translation:
  text: And I went and sat by the waters of Dan, in Dan, which lies southwest of Hermon,[a]
    and read the record of their petition[b] until I fell asleep.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Geʽez direction is compressed, combining terms for “right/south” and
      “west”; its precise geographical phrasing is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Literally, “the memorial of their petition.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ሐዊርየ
  chosen: I went
  alternatives:
  - I traveled
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Retains the narrative movement without adding a destination or manner
    of travel.
- source_word: ነበርኩ
  chosen: sat
  alternatives:
  - remained
  - dwelt
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: A seated posture fits the immediate scene of reading until sleep; no
    prolonged residence is implied.
- source_word: ማያተ ዳን በዳን
  chosen: the waters of Dan, in Dan
  alternatives:
  - the streams of Dan, in Dan
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Preserves both occurrences of Dan and does not add an unattested word
    such as “land.”
- source_word: እምየማነ ዐረበ አርሞን
  chosen: southwest of Hermon
  alternatives:
  - south of western Hermon
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Gives readable English for the compressed directional wording while flagging
    its literal form in a note.
- source_word: ወአነብብ
  chosen: and read
  alternatives:
  - and recited
  - and read aloud
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The verb supports reading or recitation; “read” avoids specifying whether
    it was audible.
- source_word: ትዝካረ ስእለቶሙ
  chosen: the record of their petition
  alternatives:
  - the memorial of their petition
  - the record of their request
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: “Record” conveys a memorial text in readable English; “petition” preserves
    the character of their request without implying that it was granted.
- source_word: እስከ ደቀስኩ
  chosen: until I fell asleep
  alternatives:
  - until I slept
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Expresses the point at which the reading ended in natural English.
theological_decisions:
- issue: The status of the Watchers’ petition
  chosen_reading: petition
  alternative_readings:
  - prayer
  - intercession
  rationale: The verse reports their request and Enoch’s reading of its record; it
    does not say that the request was accepted or that Enoch’s act secured intercession.
