  source_fidelity: 첫 명령의 ἔστω ὡς σύ는 종을 화자가 자신과 동등한 기준으로 두라는 뜻이므로 ‘그를 … 같이 여기십시오’가 적절합니다. 그러나 δεύτε 명령 ἄγε αὐτὸν ὡς σεαυτόν은 기본적으로 ‘그를 … 이끌다/인도하다’이며, 초안의 ‘대하십시오’는 가능한 문맥적 해석이지만 동사의 구체성을 넓혀 버립니다. ‘이끄십시오’로 수정하여 원문의 표현과 영어 POB 감사 기록의 lead를 보존합니다. 마지막 절은 ψυχή가 여기서 ‘생명/목숨, 자기 자신’을 가리키므로 ‘목숨만큼 필요하다’가 한국어로 더 분명합니다.
  naturalness: 합쇼체는 일관되고, ‘당신 자신처럼’보다 문맥상 ‘자신처럼’이 더 자연스럽습니다. ‘그가 당신의 생명처럼 꼭 필요하다’는 비교 대상이 다소 흐릴 수 있으므로 ‘그가 당신에게 목숨만큼 필요하다’로 다듬었습니다.
  terminology: οἰκέτης는 고대 가정에 속한 예속 신분을 뜻하므로 ‘종’을 유지할 수 있습니다. 각주에서는 영어 household slave를 그대로 쓰지 않고 한국어로 설명합니다. ‘피로 사셨다’는 ἐν αἵματι의 거친 대가 표현을 보존합니다.
