translation:
  language: ko
  text: 만군의 하나님, 부디 돌아오셔서 하늘에서 굽어보시고 보시며 이 포도나무를 돌보아 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 포도나무를 찾아보아 주십시오.’ 히브리어 동사는 ‘찾아보다’, ‘살피다’, ‘돌보다’, ‘개입하다’를 뜻할 수 있으며, 여기서는 포도나무의 복지를 위해 돌보시기를 구하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  english_pob_choice: tears it down
  chosen_korean: 허물어뜨리고
  alternatives_korean:
  - 뜯어먹고
