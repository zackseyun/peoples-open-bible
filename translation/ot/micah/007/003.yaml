  meaning_decisions:
  - source_phrase: עַל הָרַע כַּפַּיִם לְהֵיטִיב
    prior_rendering: Their hands are on evil, to do it well
    new_rendering: With both hands they do evil—and do it well
    rationale: The dual hands convey full engagement in wrongdoing, while “do it well” preserves the bitter irony of proficiency directed toward evil.
  - source_phrase: הַשַּׂר שֹׁאֵל וְהַשֹּׁפֵט בַּשִּׁלּוּם
    prior_rendering: the prince asks, and the judge is for a bribe
    new_rendering: the ruler asks for a bribe, the judge rules for a bribe
    rationale: The bribery context supplies what the ruler asks for and the judge's corrupt judicial action. “Ruler” conveys public authority without suggesting that the official must be a royal son; the alternative action for the judge is noted.
  - source_phrase: וְהַגָּדוֹל דֹּבֵר הַוַּת נַפְשׁוֹ
    prior_rendering: and the great man speaks the desire of his soul
    new_rendering: and the powerful man declares his evil desire
    rationale: “Great” denotes social power here, not admirable character. The desire is a destructive, self-serving wish, and nephesh identifies the man's personal craving rather than a separate spiritual faculty.
  - source_phrase: וַיְעַבְּתוּהָ
    prior_rendering: thus they weave it together
    new_rendering: together they weave their scheme
    rationale: The weaving image remains, but its implied object—the corrupt undertaking shared by these people—is made explicit.
