id: ISA.27.11
reference: Isaiah 27:11
source:
  edition: WLC
  text: בִּ/יבֹ֤שׁ קְצִירָ/הּ֙ תִּשָּׁבַ֔רְנָה נָשִׁ֕ים בָּא֖וֹת מְאִיר֣וֹת אוֹתָ֑/הּ כִּ֣י לֹ֤א עַם בִּינוֹת֙ ה֔וּא עַל כֵּן֙ לֹֽא יְרַחֲמֶ֣/נּוּ עֹשֵׂ֔/הוּ וְ/יֹצְר֖/וֹ לֹ֥א יְחֻנֶּֽ/נּוּ־־־׃ס
translation:
  text: When its branches dry up, they are broken off; women come and make fires with them. For these people have no understanding; therefore their Maker will not have compassion on them, and the one who formed them will not be gracious to them.
  philosophy: dynamic
lexical_decisions:
- source_word: בִּיבֹשׁ
  chosen: when ... dries up
  alternatives:
  - in drying up
  - when ... withers
  lexicon: HALOT
  rationale: 'The prefixed ב plus infinitive/verb form is taken temporally: ''when it dries up'' or ''when it withers.'' ''Dries up'' fits the agricultural image with קְצִירָהּ (''its harvest/branches cut for harvest'') and leads naturally into the breaking of dry material.'
- source_word: קְצִירָהּ
  chosen: its branches
  alternatives:
  - its dry growth
  - its cut growth
  - its harvest
  lexicon: HALOT
  rationale: Although the noun commonly denotes harvest, the abandoned vegetation is dried, broken, and burned for fuel here. 'Branches' is the contextually required sense.
- source_word: תִּשָּׁבַרְנָה
  chosen: they are broken
  alternatives:
  - they are broken off
  lexicon: HALOT
  rationale: The feminine plural verb refers to the dry branches or pieces of vegetation. English must not replace that agreement with a singular harvest.
- source_word: נָשִׁים בָּאוֹת
  chosen: women come
  alternatives:
  - women are coming
  lexicon: HALOT
  rationale: A straightforward rendering of the participial/sequential action. The image is of ordinary women gathering the dried growth, underscoring worthlessness and judgment.
- source_word: מְאִירוֹת אוֹתָהּ
  chosen: set them on fire
  alternatives:
  - make a fire with them
  - burn them
  lexicon: HALOT
  rationale: The phrase describes the women using the dried vegetation as fuel. English pluralizes the pronoun consistently while the note documents the source's collective singular object.
- source_word: לֹא עַם בִּינוֹת הוּא
  chosen: this is a people without understanding
  alternatives:
  - this is not a people of understanding
  lexicon: HALOT
  rationale: The privative English phrase communicates the same judgment directly and naturally.
- source_word: עַל כֵּן
  chosen: therefore
  alternatives:
  - for that reason
  - so
  lexicon: HALOT
  rationale: Standard inferential connective linking the people's lack of understanding to the announced absence of mercy.
- source_word: לֹא יְרַחֲמֶנּוּ
  chosen: will not have compassion on it
  alternatives:
  - will not show mercy to him/it
  - will not pity it
  lexicon: HALOT
  rationale: רחם expresses compassion/mercy. The pronominal object is masculine singular, likely referring back to the people as a collective. English 'it' fits the collective noun 'people' used in the preceding clause.
- source_word: עֹשֵׂהוּ
  chosen: its Maker
  alternatives:
  - the one who made it
  lexicon: HALOT
  rationale: A participial divine designation. 'Maker' is concise, idiomatic, and preserves the theological force of God as creator of the people.
- source_word: וְיֹצְרוֹ
  chosen: the one who formed it
  alternatives:
  - its Former
  - the one who fashioned it
  lexicon: HALOT
  rationale: יצר often evokes shaping/forming, especially with covenantal-creation overtones. 'The one who formed it' preserves the verbal imagery and parallels 'Maker' without flattening the distinction.
- source_word: לֹא יְחֻנֶּנּוּ
  chosen: will show it no favor
  alternatives:
  - will not be gracious to it
  - will not show it grace
  lexicon: HALOT
  rationale: חנן denotes showing favor/grace. 'Show it no favor' is clear modern English and avoids importing later theological jargon while preserving the sense of withheld graciousness.
