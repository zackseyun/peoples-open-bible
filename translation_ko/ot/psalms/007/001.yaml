- from: 「시가욘」— 다윗의 시로, 그가 야훼께 불렀던 노래입니다. 쿠시, 베냐민 사람의 말에 관한 것입니다.[a]
  to: 야훼, 나의 하나님, 저는 당신께 피하였습니다.[a] 저를 쫓는 모든 이에게서 저를 구원하시고 건져 주십시오.
  rationale: 제공된 원문은 표제가 아니라 시편 7:1 본문입니다. 이에 따라 본문을 원문 순서와 의미에 맞게 전면 교체했습니다. 완료형 ‘피하였습니다’는 본문에 유지하되, 기도 문맥에서 가능한 현재형은 각주로 보존했습니다. ‘모든 이에게서’는 מִכָּל רֹדְפַי(‘나를 쫓는 모든 이에게서’)를, 두 청원 동사는 각각 ‘구원하시고’와 ‘건져 주십시오’로 반영합니다.
