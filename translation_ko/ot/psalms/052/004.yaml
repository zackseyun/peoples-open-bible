theological_decisions:
- issue: 2인칭 비난 구조와 도구적 비유의 분리
  chosen_reading: ‘당신은 파멸을 꾀합니다’와 ‘당신의 혀는 …’를 분리해, 행위 주체는 ‘당신’이고 혀는 그 수단이라는 히브리어 구조를 유지했습니다.
  alternative_readings:
  - ‘당신의 혀가 파멸을 꾀합니다’처럼 혀를 주어로 묶는 읽기
  - 두 절을 합쳐 혀 자체가 악의 주체인 것처럼 번역하는 읽기
  rationale: 이 구절은 첫 절의 동사 주어와 둘째 절의 신체 은유를 구분합니다. 이를 흐리면 시편의 고발 초점이 왜곡되므로, 문법적·수사적 분리를 살렸습니다.
