id: PRO.15.3
reference: Proverbs 15:3
source:
  edition: WLC
  text: בְּֽ/כָל מָ֭קוֹם עֵינֵ֣י יְהוָ֑ה צֹ֝פ֗וֹת רָעִ֥ים ו/טוֹבִֽים־׃
translation:
  text: In every place the eyes of Yahweh watch the evil and the good.
  philosophy: dynamic
lexical_decisions:
- source_word: בְּכָל מָקוֹם
  chosen: In every place
  alternatives:
  - Everywhere
  - In every location
  lexicon: HALOT
  rationale: A fairly formal rendering preserves the distributive sense of 'in every place.' 'Everywhere' is idiomatic English, but 'in every place' better reflects the Hebrew phrasing while remaining natural.
- source_word: עֵינֵי יְהוָה
  chosen: the eyes of Yahweh
  alternatives:
  - the LORD's eyes
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: צֹפוֹת
  chosen: watch
  alternatives:
  - keep watch on
  - observe
  - are keeping watch
  lexicon: HALOT
  rationale: The participle conveys continuing watchful observation; “watch” avoids adding a protective sense.
- source_word: רָעִים וְטוֹבִים
  chosen: the evil and the good
  alternatives:
  - evil people and good people
  - the wicked and the good
  lexicon: HALOT
  rationale: The adjectives are substantival here, referring to persons characterized as evil or good. 'The evil and the good' preserves the concise parallelism of the proverb. 'The wicked' is possible for רָעִים, but 'evil' stays closer lexically and balances with 'good'.
