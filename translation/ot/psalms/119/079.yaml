  text: יָשׁ֣וּבוּ לִ֣/י יְרֵאֶ֑י/ךָ ו/ידעו עֵדֹתֶֽי/ךָ׃
translation:
  text: Let those who fear you, who know your testimonies, turn to me.
  philosophy: dynamic
lexical_decisions:
- source_word: עֵדֹתֶֽיךָ
  chosen: testimonies
  alternatives:
  - decrees
  - covenant stipulations
  lexicon: HALOT
  rationale: עֵדֹות (plural of עֵדָה, covenant testimony) is rendered 'testimonies' consistently with עֵדוּת across the psalm.
- source_word: וְיֹדְעֵי
  chosen: who know
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The participle describes the God-fearers who are to turn to the speaker; it does not state the intended result of their turning.
