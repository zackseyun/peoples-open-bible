translation:
  text: “In this way a place was created for the souls of people who were not righteous but sinners, full of wrongdoing. They will be with wrongdoers like themselves. But their souls will not be killed on the day of judgment, and they will not rise from here[a].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: This may mean that they will not be raised from the dead, or that they will never leave this place.
