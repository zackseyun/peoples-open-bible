  source_fidelity: 현 번역문은 제시된 히브리어 본문(시편 7:14)이 아니라 다음 절에 해당하는 무기와 불붙은 화살의 내용을 옮기고 있습니다. 따라서 본문 내용, 어휘 결정, 주석이 모두 원문과 불일치합니다. 원문의 임신·출산 은유와 יְחַבֶּל의 진통/산고 뉘앙스를 반영해야 합니다.
