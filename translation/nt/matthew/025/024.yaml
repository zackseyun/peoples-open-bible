  adjudicator: source-audit
  reviewer_model: gpt-5.6-sol
  source_review: state/reviews/gemini/low_agreement_recheck/nt/matthew/025/024.job-27611.json
  category: source_correction
  tier: 1
  from: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
  to: Then the one who had received the one talent also came forward and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
  rationale: The identical participle `προσελθὼν` introduces the approach of each servant in verses 20, 22, and 24. In verses 20 and 22, it is translated as 'came forward,' but here it is translated simply as 'came.' Maintaining 'came forward' preserves the parallel narrative structure of the parable. The Greek phrase `ἔγνων σε ὅτι` employs prolepsis, a common idiom where the subject of the subordinate clause is pulled forward as the object of the main verb (BDAG explicitly cites Mt 25:24 for this usage under γινώσκω). Translating this literally into English as 'I knew you, that you are' is awkward and obscures the syntax. It should be rendered 'I knew that you are' (or 'I knew you to be').
