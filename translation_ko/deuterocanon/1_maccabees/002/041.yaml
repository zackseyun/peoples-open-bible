  yaml_path: translation/deuterocanon/1_maccabees/002/041.yaml
  text: And on that day they decided, saying, “If any man comes against us for battle on the Sabbath day, we will fight against him, and we will certainly not all die as our brothers died in the hiding places.”
translation:
  language: ko
  text: 그날 그들은 이렇게 결의하여 말했습니다. “만일 안식일에 전투를 벌이러 우리에게 오는 사람이 있으면, 우리는 그에게 맞서 싸울 것이며, 우리 형제들이 숨은 곳에서 죽었던 것처럼 우리 모두가 죽지는 않을 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβουλεύσαντο
  english_pob_choice: they decided
  chosen_korean: 결의하여
  alternatives_korean:
  - 결정하여
  - 계획하여
  lexicon: βουλεύομαι
  rationale: 단순한 '결정'보다 공동체적 숙의 끝에 내린 결단의 뉘앙스를 살리기 위해 '결의하여'로 옮겼습니다.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ
  english_pob_choice: on that day
  chosen_korean: 그날
  alternatives_korean:
  - 그 날에
  - 그때
  lexicon: ἡμέρα
  rationale: 시간 부사구로 자연스럽고 간결하게 처리하되, 지시성을 유지했습니다.
- source_word: ὃς ἐὰν ἔλθῃ πρὸς ἡμᾶς εἰς πόλεμον
  english_pob_choice: If any man comes against us for battle
  chosen_korean: 전투를 벌이러 우리에게 오는 사람이 있으면
  alternatives_korean:
  - 우리와 싸우러 오는 사람이 있으면
  - 전쟁하러 우리에게 오는 자가 있으면
  lexicon: ἔρχομαι / πόλεμος
  rationale: 조건절의 의미를 살려 'if any man'을 '사람이 있으면'으로 옮기고, 'εἰς πόλεμον'은 '전투를 벌이러'로 구체화했습니다.
- source_word: οὐ μὴ ἀποθάνωμεν πάντες
  english_pob_choice: we will certainly not all die
  chosen_korean: 우리 모두가 죽지는 않을 것입니다
  alternatives_korean:
  - 우리가 모두 반드시 죽지는 않을 것입니다
  - 우리 모두가 결코 죽지 않을 것입니다
  lexicon: οὐ μή + aorist subjunctive
  rationale: 강한 부정의 확실성을 한국어 미래 부정으로 자연스럽게 반영하되, '모두'를 유지해 전부 죽는 상황을 부정했습니다.
- source_word: ἐν τοῖς κρυφοῖς
  english_pob_choice: in the hiding places
  chosen_korean: 숨은 곳에서
  alternatives_korean:
  - 숨는 곳에서
  - 은신처에서
  lexicon: κρυφός
  rationale: 원문의 장소성을 보존하면서도 한국어에서 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: 안식일에 대한 무장 저항의 정당화
  chosen_reading: 본문은 안식일 규정을 이유로 자기방어를 포기하지 않겠다는 공동체의 결의를 직접 진술합니다.
  alternative_readings:
  - 안식일 규정을 완화하는 일반 원칙 진술
  - 단순한 역사적 사건 묘사
  rationale: 문맥상 규범 제시가 아니라 박해 상황에서의 실제 결단으로 읽는 것이 원문과 영어 POB 모두에 부합합니다.
  doctrine_reference: 1 Maccabees 2:41 문맥
- issue: ‘형제들’의 죽음과 ‘숨은 곳’
  chosen_reading: ‘우리 형제들’은 같은 공동체의 순교/피살 사례를 가리키는 집단 기억으로 보존했습니다.
  alternative_readings:
  - 단순한 친족 형제
  - 비유적 동료
  rationale: 원문이 공동체 정체성을 강조하므로, 친족 의미로 축소하지 않고 집단적 연대의 표현으로 유지했습니다.
  doctrine_reference: 1 Maccabees 2:41 문맥
