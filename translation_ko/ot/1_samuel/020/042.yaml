  - 여호와의 이름으로 맹세하며
  lexicon: YHWH / oath formula
  rationale: 원문의 언약적 맹세 공식을 그대로 살려 ‘이름으로 맹세하다’를 유지했고, 본문 기준 어휘를 야훼로 렌더링했습니다.
- source_word: יְהוָה ... בֵּין ... וּבֵין ... עַד עוֹלָם
  english_pob_choice: May the LORD be between me and you, and between my offspring and your offspring forever
  chosen_korean: 야훼께서 나와 당신 사이에, 또 내 자손과 당신 자손 사이에 영원히 계시기를 바랍니다
  alternatives_korean:
  - 야훼께서 나와 당신 사이에, 또 내 씨와 당신 씨 사이에 영원히 계시기를 바랍니다
  - 야훼께서 나와 당신 사이와 내 후손과 당신 후손 사이에 영원히 계시기를 바랍니다
  lexicon: interpersonal covenant formula
  rationale: ‘사이에 계시다’는 관계적 중재/증인의 의미를 보존했고, זרע를 문맥상 ‘자손’으로 옮겨 후손 관계를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: YHWH divine name in a covenant oath formula
