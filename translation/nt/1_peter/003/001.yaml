id: 1PE.3.1
reference: 1 Peter 3:1
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
translation:
  text: Likewise, wives, submit to your own husbands, so that even if some refuse to obey the gospel message, they may be won over without a word through their wives’ conduct,
  philosophy: dynamic
lexical_decisions:
- source_word: Ὁμοίως
  chosen: Likewise
  alternatives:
  - In the same way
  - Similarly
  lexicon: BDAG
  rationale: Standard discourse connective linking this exhortation with the preceding household instructions. 'Likewise' preserves the formal connection and common NT paraenetic usage.
- source_word: γυναῖκες
  chosen: wives
  alternatives:
  - women
  lexicon: BDAG
  rationale: In context with τοῖς ἰδίοις ἀνδράσιν ('to your own husbands'), the relational sense 'wives' is required rather than the generic 'women'.
- source_word: ὑποτασσόμεναι
  chosen: being subject to
  alternatives:
  - submitting to
  - subjecting yourselves to
  lexicon: BDAG
  rationale: The participle carries the sense of ordered relational submission. 'Being subject to' is slightly more formal and avoids sounding either overly voluntary or overly coercive; it also fits the participial construction dependent on the implied exhortation.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  chosen: to your own husbands
  alternatives:
  - to your own men
  lexicon: BDAG
  rationale: ἀνήρ can mean 'man' or 'husband'; here the possessive ἰδίοις and the household context require 'husbands.' 'Your own' preserves the Greek emphasis on one's own spouse.
- source_word: ἵνα
  chosen: so that
  alternatives:
  - in order that
  lexicon: BDAG
  rationale: Introduces purpose/result. 'So that' is natural modern English while preserving the clause's purposive force.
- source_word: καὶ εἴ τινες
  chosen: even if some
  alternatives:
  - even if any
  - if some indeed
  lexicon: BDAG
  rationale: καὶ with εἴ adds concessive force. 'Even if some' captures the sense that the instruction applies also in difficult cases.
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  chosen: are disobeying the word
  alternatives:
  - do not obey the message
  - refuse to believe the word
  lexicon: BDAG
  rationale: ἀπειθέω can denote disobedience/unbelief depending on context. Here, in Petrine usage with τῷ λόγῳ, it refers to refusal of the gospel message. 'Disobeying the word' preserves the lexical link and the moral-volitional nuance, while a footnote preserves 'do not obey the message' as an explanatory alternative.
- source_word: λόγῳ
  chosen: the word
  alternatives:
  - the message
  lexicon: BDAG
  rationale: λόγος here likely refers to the proclaimed Christian message/gospel. 'The word' preserves the Greek term and common biblical idiom; 'message' is a valid contextual gloss preserved in a footnote.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  chosen: through the conduct of their wives
  alternatives:
  - through the way their wives live
  - through the behavior of the wives
  lexicon: BDAG
  rationale: ἀναστροφή in 1 Peter commonly means manner of life or conduct. 'Conduct' is concise and suitably weighty. Rendering τῶν γυναικῶν as 'their wives' makes explicit the relational reference in idiomatic English.
- source_word: ἄνευ λόγου
  chosen: without a word
  alternatives:
  - without speaking
  - without words
  lexicon: BDAG
  rationale: A concise phrase preserving the singular λόγου and the rhetorical contrast with τῷ λόγῳ earlier in the verse. It likely means without verbal argument or speech from the wives.
- source_word: κερδηθήσονται
  chosen: they may be won
  alternatives:
  - they may be gained
  - they may be won over
  lexicon: BDAG
  rationale: Passive future of κερδαίνω in evangelistic/relational context means to gain or win someone. 'Won' is idiomatic and preserves the metaphor without overexpanding it.
