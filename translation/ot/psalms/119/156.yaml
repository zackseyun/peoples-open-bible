id: PSA.119.156
reference: Psalms 119:156
source:
  edition: WLC
  text: רַחֲמֶ֖י/ךָ רַבִּ֥ים יְהוָ֑ה כְּֽ/מִשְׁפָּטֶ֥י/ךָ חַיֵּֽ/נִי׀׃
translation:
  text: Your mercies are many, Yahweh; give me life according to your ordinances.
  philosophy: dynamic
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: כְּֽמִשְׁפָּטֶיךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone of 'judgments'; 'judgments/rules' preserved as alternatives.
- source_word: רַחֲמֶיךָ
  chosen: your mercies
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Preserves the Hebrew plural and its concrete sense of abundant compassion.
