  from: You shame the counsel of the poor[a], because Yahweh is his refuge.
  to: You put the counsel of the poor to shame, but Yahweh is his refuge[a].
  rationale: Used an adversative 'but' so Yahweh's refuge does not become the reason the wicked attack the poor, and rendered the Hebrew idiom in natural English.
- timestamp: '2026-08-28T22:03:50Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: mistranslation
