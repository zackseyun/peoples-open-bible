  from: Make yourself bald and shave your head for the children of your delight; enlarge your baldness like the eagle[a], for they have gone from you into exile.
  to: Shave your head bald in mourning for your cherished children; make your bald patch as broad as a vulture’s[a], for they have gone from you into exile.
