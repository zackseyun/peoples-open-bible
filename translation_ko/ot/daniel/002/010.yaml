  source_fidelity: 핵심 의미는 대체로 충실하지만, מִלַּת מַלְכָּא는 이 절에서 왕이 요구한 ‘일/내용’을 가리키므로 ‘밝혀 알릴 만한’보다 ‘알려 줄 수 있는’이 원문의 ‘알리다’에 더 직접적으로 대응합니다. 또한 שְׁאֵל은 여기서 직능인들에게 그러한 일을 ‘요구하다’라는 뜻이므로 ‘묻다’보다 ‘요구하다’가 문맥과 영어 POB의 asked for를 더 정확히 반영합니다.
  naturalness: ‘이 땅 위에는’과 ‘밝혀 알릴 만한’은 다소 부자연스럽고 중복적으로 들립니다. ‘세상에는’과 ‘알려 줄 수 있는’이 현대 표준어 합쇼체에서 자연스럽습니다. 인용문 안의 문장도 ‘요구한 적이 없기 때문입니다’로 매끄럽게 연결됩니다.
  terminology: ‘갈대아 사람들’, ‘점술관’, ‘주술사’는 세 부류를 구분하는 번역으로 수용 가능합니다. 다만 현 주석은 본문이 히브리어가 아니라 아람어라는 사실을 잘못 진술하므로 삭제해야 합니다.
