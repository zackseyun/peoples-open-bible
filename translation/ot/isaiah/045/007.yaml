id: ISA.45.7
reference: Isaiah 45:7
source:
  edition: WLC
  text: יוֹצֵ֥ר אוֹר֙ וּ/בוֹרֵ֣א חֹ֔שֶׁךְ עֹשֶׂ֥ה שָׁל֖וֹם וּ/ב֣וֹרֵא רָ֑ע אֲנִ֥י יְהוָ֖ה עֹשֶׂ֥ה כָל אֵֽלֶּה־׃ס
translation:
  text: forming light and creating darkness, making well-being[a] and creating calamity[b]; I am Yahweh, who does all these things.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or ‘peace’ or ‘welfare.’ The Masoretic Hebrew has שָׁלוֹם, rendered here as well-being. The Great Isaiah Scroll (1QIsaᵃ) instead reads ‘good,’ giving ‘making good.’ This is a different Hebrew reading; its historical priority remains unresolved.
    reason: textual_variant
  - marker: b
    text: Or ‘disaster’ or ‘evil.’ Hebrew רָע can denote harm or adversity as well as moral evil. Its contrast with peace/well-being supports the adversity sense here; ‘calamity’ is a contextual rendering, not a theological exclusion of the alternative.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצֵר
  chosen: forming
  alternatives:
  - fashioning
  - forming
  lexicon: HALOT
  rationale: Qal participle of יצר commonly denotes shaping or forming. 'Forming' preserves the participial, ongoing/descriptive force and pairs well with 'creating' for בורא without collapsing the verbs into one gloss.
- source_word: אוֹר
  chosen: light
  lexicon: HALOT
  rationale: Basic lexical sense is literal 'light'; in this poetic pairing with 'darkness' the straightforward rendering is best.
- source_word: וּבֹרֵא
  chosen: and creating
  alternatives:
  - and creating
  lexicon: HALOT
  rationale: Qal participle of ברא, a weighty verb often used of divine creative activity. 'Creating' preserves the verbal aspect and the deliberate parallelism with 'forming' and the second occurrence later in the verse.
- source_word: חֹשֶׁךְ
  chosen: darkness
  lexicon: HALOT
  rationale: Standard lexical equivalent; the antithesis with 'light' should remain explicit.
- source_word: עֹשֶׂה
  chosen: making
  alternatives:
  - doing
  - working
  lexicon: HALOT
  rationale: The participle of עשה is broad, but 'making' fits the poetic sequence and idiomatic English better than 'doing' here.
- source_word: שָׁלוֹם
  chosen: well-being
  alternatives:
  - peace
  - welfare
  - wholeness
  - prosperity
  lexicon: BDB (hosted entry)
  rationale: The retained Masoretic שָׁלוֹם includes welfare as well as peace. Well-being expresses the broader positive condition opposite calamity without limiting it to absence of war; peace remains a viable alternative in note[a]. Published 1QIsaᵃ has טוב, good, a distinct source alternative, not another pointing of this noun. Historical priority remains unresolved. See the frozen English comparison; this does not claim a uniquely optimal gloss. No fresh HALOT consultation is claimed. This is a documented local choice, not a global replacement of peace elsewhere.
- source_word: רָע
  chosen: calamity
  alternatives:
  - disaster
  - evil
  lexicon: BDB (hosted entry)
  rationale: BDB noun II.1 places Isaiah 45:7 under distress/adversity, while the same entry also documents ethical evil elsewhere. The contrast with retained שָׁלוֹם and prophetic use of adverse conditions supports the provisional contextual rendering calamity. Note[b] preserves disaster/evil and the lexical breadth; neither theological preference nor the selected Greek/Latin forms alone settles the sense. No fresh HALOT consultation is claimed.
- source_word: אֲנִי יְהוָה
  chosen: I am Yahweh
  alternatives:
  - I, Yahweh
  lexicon: HALOT
  rationale: The explicit pronoun and written divine name give emphatic self-identification. I am Yahweh matches the actual main English and DOCTRINE.md's current divine-name rule; the historical LORD label is archived. This is label alignment, not a new historical origin or etymology claim. No fresh HALOT consultation is claimed.
- source_word: עֹשֶׂה כָל־אֵלֶּה
  chosen: who does all these things
  alternatives:
  - doing all these things
  - maker of all these things
  lexicon: HALOT
  rationale: The final participial clause sums up the preceding pairs. 'Who does all these things' is idiomatic in English while retaining the comprehensive claim of divine agency over the listed realities.
