translation:
  language: ko
  text: 저는 태에서부터 주께 내맡겨졌으며, 제 어머니의 배에서부터 주는 나의 하나님이십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 참으로
  lexicon: HALOT
  rationale: 전후 문맥의 논증 흐름을 자연스럽게 이어 주면서도, 원문의 이유 제시를 살려 합쇼체 문장으로 매끈하게 옮겼습니다.
- source_word: גֹחִי
  english_pob_choice: the one who brought me out
  chosen_korean: 저를 태에서부터 이끌어 내신 분
  alternatives_korean:
  - 저를 태에서 끌어내신 분
  - 저를 태에서 나오게 하신 분
  lexicon: HALOT
  rationale: 출생 문맥의 구체적 이미지를 유지하려고 '태에서부터'와 '이끌어 내신'을 사용했습니다. 'deliver'류의 추상화는 피했습니다.
- source_word: מַבְטִיחִי
  english_pob_choice: making me secure
  chosen_korean: 저를 든든히 하신 분
  alternatives_korean:
  - 저를 안전하게 하신 분
  - 저로 하여금 신뢰하게 하신 분
  lexicon: HALOT
  rationale: 갓난아이의 상황에서는 의식적 '믿음'보다 보호와 안정을 주는 뜻이 더 자연스러워서, 보안·안정의 감각을 살린 '든든히 하신'으로 옮겼습니다.
- source_word: שְׁדֵי אִמִּי
  english_pob_choice: at my mother’s breasts
  chosen_korean: 제 어머니의 젖가슴에서
  alternatives_korean:
  - 제 어머니의 가슴에서
  - 어머니의 젖가슴 곁에서
  lexicon: HALOT
  rationale: שְׁדֵי의 직접적 의미를 살려 '젖가슴'으로 옮겨, 모유 수유의 장면이 분명히 드러나도록 했습니다.
theological_decisions:
- issue: מַבְטִיחִי를 infant trust로 볼지 security로 볼지
  chosen_reading: 보호와 안정을 주시는 의미를 우선해 '든든히 하신'으로 번역했습니다.
  alternative_readings:
  - 저로 하여금 신뢰하게 하신
  - 저를 안전하게 하신
  rationale: 본문은 출생과 양육의 장면을 말하므로, 아직 의식적 신앙 행위로 단정하지 않고 하나님의 돌보심과 안정감을 강조하는 쪽이 원문 긴장에 더 충실합니다.
  doctrine_reference: 의식적 infant faith를 단정하지 않고, 본문의 표현 범위를 보존함
