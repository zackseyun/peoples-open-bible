- field: translation.footnotes
  value:
  - marker: '1'
    text: “Repentance” here refers to the decisive turning associated with baptism, the release of former
      sins.
    reason: cultural_note
  - marker: '2'
    text: “We went down into the water” is early Christian language for baptism without naming it explicitly
      (cf. Didache 7).
    reason: cultural_note
  - marker: '3'
    text: The Greek is abrupt here (“For the one who has received forgiveness—”); many editors assume
      an interruption at this point.
    reason: textual_variant
  - marker: '4'
    text: “Fall asleep” is a common early Christian euphemism for dying.
    reason: cultural_note
  - marker: '5'
    text: Or, more literally, “remains by himself/alone.”
    reason: lexical_alternative
  - marker: '6'
    text: “Chastity” could also be rendered “purity,” but the context favors sexual continence; “modesty”
      translates σεμνότης, moral gravity of comportment.
    reason: lexical_alternative
  - marker: '8'
    text: “Forgiveness” translates ἄφεσις; “remission” is a traditional alternative emphasizing release.
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of
      disposition and direction. The surrounding passage supplies the direction; this wording does not
      erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a
      completed moral transformation.
    reason: lexical_alternative
