source:
  edition: lxx-swete-1909
  text: ὅτι με ἀγώχεν σοι ὑγιῆ, καὶ τὴν γυναῖκά μου ἐθεράπευσεν καὶ τὸ ἀργύριόν μου ἤνεγκεν, καὶ σὲ ὁμοίως ἐθεράπευσεν.
  language: Greek
