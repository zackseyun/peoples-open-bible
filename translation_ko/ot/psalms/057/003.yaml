  source_fidelity: 현재 초안은 제시된 히브리어 본문과 영어 POB(시 57:3)가 아니라 시편 57:2(‘내가 지극히 높으신 하나님께 부르짖습니다’)를 번역한 것입니다. 따라서 절 내용 전체를 57:3으로 교체해야 합니다. 57:3의 חֵרֵף שֹׁאֲפִי는 압축된 구문으로 주어 및 관계가 다소 불확정적이므로, 본문에서는 영어 POB의 선택을 따라 하나님을 주어로 하되 대안 독법을 각주에 보존했습니다.
  naturalness: ‘하늘에서 보내시고 나를 구원하실 것입니다’는 보내지는 대상이 히브리어에서 명시되지 않은 점을 유지하면서도 한국어 문장으로 자연스럽습니다. שֹׁאֲפִי의 비유적 어감을 ‘나를 헐떡이며 뒤쫓는 자’로 살렸고, 셀라는 음역했습니다. ‘자신의 한결같은 사랑과 신실하심’은 소유 접미사와 חסד–אמת의 짝을 자연스럽게 반영합니다.
  terminology: ‘하나님’, ‘구원’, ‘셀라’, ‘한결같은 사랑’, ‘신실하심’은 현대 표준 한국어의 정중한 성서 문체에 적합합니다. ‘한결같은 사랑’은 חַסְדּוֹ를 특정 교리 용어로 과도하게 좁히지 않으면서 언약적 지속성을 전달합니다.
