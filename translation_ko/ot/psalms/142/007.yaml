base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/007.yaml
  text: Bring me out of prison, so that I may give thanks to your name; the righteous will gather around me[a], for you will treat me well.
  footnotes:
  - marker: a
    text: Or “the righteous will surround me.” The difficult Hebrew expression has also been understood more unusually as “the righteous will crown themselves because of me” or “will glory because of me.”
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영혼을 감옥에서 이끌어 내어 주십시오. 그리하여 제가 주의 이름에 감사드리게 하소서. 의인들이 내 주위에[a] 모일 것입니다. 주께서 내게 후하게 베푸실 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의인들이 나를 둘러쌀 것입니다’. 히브리어 동사는 더 이례적으로 ‘의인들이 나 때문에 스스로 관을 쓸 것이다’ 또는 ‘나 때문에 자랑할 것이다’로 이해될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
