  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Status language for עֲבָדִים/שְׁפָחוֹת
  chosen_reading: male and female slaves
  alternative_readings:
  - servants and female servants
  - slaves and maidservants
  rationale: The context concerns forced human subjugation after military victory, so the bonded nature is salient. This aligns with the project's preference for 'slave' where that force is present.
