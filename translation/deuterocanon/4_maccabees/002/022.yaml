translation:
  text: At the same time, he enthroned the holy mind as ruler over the whole person, working through the senses[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, “he enthroned the holy mind among the senses as ruler over them all.”
