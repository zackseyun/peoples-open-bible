language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: ko
  text: 그때 야훼께서[a] 모세에게 말씀하셨습니다. “바로에게 나아가 그에게 말하십시오. ‘히브리 사람들의 하나님인 야훼께서 이렇게 말씀하십니다. 내 백성을 보내어 그들이 나를 섬기게 하십시오.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여기와 뒤의 인용문에서 모두 יהוה(야훼)를 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה / the LORD
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 원문이 하나님의 고유명사 יהוה를 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 고유명성과 언약적 발화를 드러냈습니다.
- source_word: בֹּא אֶל פַּרְעֹה
  english_pob_choice: Go in to Pharaoh
  chosen_korean: 바로에게 들어가서
  alternatives_korean:
  - 바로에게 가서
  - 바로 앞에 나아가서
  lexicon: בוא
  rationale: 히브리어 בוא의 ‘들어가다’라는 방향성을 살려, 단순한 이동보다 바로의 공간/궁정 안으로 들어가는 뉘앙스를 반영했습니다.
- source_word: וְדִבַּרְתָּ אֵלָיו
  english_pob_choice: and say to him
  chosen_korean: 그에게 말하십시오
  alternatives_korean:
  - 그에게 말씀하십시오
  - 그에게 전하십시오
  lexicon: דבר
  rationale: 명령에 이어지는 직접 발화 지시이므로, 한국어에서는 자연스럽고 공손한 ‘말하십시오’로 옮겼습니다.
- source_word: וְיַעַבְדֻנִי
  english_pob_choice: so that they may serve me
  chosen_korean: 그들이 나를 섬기게 하십시오
  alternatives_korean:
  - 그들이 나를 예배하게 하십시오
  - 그들이 내게 봉사하게 하십시오
  lexicon: עבד
  rationale: עבד는 단순 예배보다 넓게 ‘섬기다/봉사하다’의 의미를 가지므로, 문맥을 과도하게 종교화하지 않는 ‘섬기다’를 택했습니다.
theological_decisions:
- issue: 야훼의 이름을 본문에 직접 표기할지 여부
  chosen_reading: 본문에서 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 출애굽기의 원문이 언약의 하나님의 이름 יהוה를 반복해 사용하므로, 독자가 발화 주체의 고유성을 분명히 인식하도록 했습니다.
  doctrine_reference: divine_name_rendering
- issue: ‘섬기다’의 종교적 강도
  chosen_reading: ‘나를 섬기게 하십시오’로 유지했습니다.
  alternative_readings:
  - 나를 예배하게 하십시오
  - 나를 경배하게 하십시오
  rationale: 본문의 עבד는 종종 언약적 예배를 포함하지만, 여기서는 바로에게 주는 명령으로서 이스라엘의 해방 목적과 섬김의 귀속을 함께 드러내므로 ‘섬기다’가 가장 원문에 가깝습니다.
  doctrine_reference: service_to_God
