  from: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
  to: But Abram said to the king of Sodom, “I have raised my hand and sworn to Yahweh, God Most High, Creator of heaven and earth[a],
  rationale: The earlier notes correctly identify the raised hand as an oath gesture; the main text now carries that meaning. The punctuation cleanup treated the verse as a complete utterance, but its oath content continues in verse 23, so the quotation remains open.
