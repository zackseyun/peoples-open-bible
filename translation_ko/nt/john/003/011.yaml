id: JHN.3.11
reference: John 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
  footnotes:
  - marker: a
    text: Or 'Amen, amen, I say to you.'
    reason: lexical_alternative
  - marker: b
    text: The repeated 'we' and 'our' are left untranslated interpretively; the exact group Jesus includes is debated.
    reason: alternative_reading
  - marker: c
    text: Or 'you do not accept our testimony.'
    reason: lexical_alternative
translation:
  language: ko
  text: 진실로, 진실로[a] 내가 당신에게 말합니다. 우리가 아는 것을 말하고 우리가 본 것을 증언합니다[b], 그리고 당신은 우리의 증언을 받지 않습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아멘, 아멘, 내가 당신에게 말합니다.’
    reason: lexical_alternative
  - marker: b
    text: 반복되는 ‘우리가’와 ‘우리의’의 지시대상(예수와 제자들, 수사적 복수, 또는 더 넓은 신적 증언)은 해석상 논쟁이 있어 본문 그대로 복수로 남깁니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘당신은 우리의 증언을 받아들이지 않습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로 진실로
  alternatives_korean:
  - 아멘 아멘
  - 참으로 참으로
  lexicon: BDAG / Liddell-Scott
  rationale: 그중첩된 강조구조를 한국어로 자연스럽게 전달하기 위해 '진실로 진실로'를 선택했습니다. 히브리어/교회용어 '아멘'을 본문 가운데에 그대로 남기지 않아 현대 독자가 즉시 이해하도록 했습니다.
- source_word: μαρτυροῦμεν / τὴν μαρτυρίαν ἡμῶν
  english_pob_choice: testify / our testimony
  chosen_korean: 증언합니다 / 우리의 증언
  alternatives_korean:
  - 증거합니다 / 우리의 증거
  - 증언합니다 / 우리 증거
  lexicon: BDAG
  rationale: μαρτυρία/μαρτυροῦμεν의 법정적·증언적 어감을 살려 '증언합니다'와 '증언'을 썼습니다. '증거'도 가능하지만 '증언'이 인식된 목격 진술의 뉘앙스를 더 잘 전달합니다.
- source_word: λαμβάνετε
  english_pob_choice: you do not receive
  chosen_korean: 받지 않습니다
  alternatives_korean:
  - 받아들이지 않습니다
  - 수용하지 않습니다
  lexicon: BDAG
  rationale: 요한복음에서 λαμβάνω는 단순한 '받다'를 넘어 '환영하여 받아들이다'의 의미를 가질 수 있으나, 본문 일관성을 위해 기본어 '받다'의 부정형 '받지 않습니다'로 번역하여 원문의 단어 선택을 보존했습니다.
- source_word: λέγω σοι
  english_pob_choice: I tell you
  chosen_korean: 내가 여러분에게 말합니다
  alternatives_korean:
  - 내가 너에게 말합니다
  - 내가 당신에게 말합니다
  lexicon: BDAG
  rationale: 직접적인 화법 표지를 현대 한국어의 정중한 발표문체로 처리하기 위해 '-말합니다' 형태를 사용했습니다. 청자 2인칭 복수의 뉘앙스를 고려해 '여러분'을 선택했습니다.
theological_decisions:
- issue: First-person plural pronouns ('we' / 'our')
  chosen_reading: 본문의 복수 1인칭 형태를 그대로 '우리가/우리의'로 유지하여 누구를 포함하는지에 대한 신학적 긴장을 남깁니다.
  alternative_readings:
  - 예수가 자신(과 제자)을 지칭한다(단수·제한적 참조로 재해석).
  - 수사적 복수(화자의 겸사적 표현)이다.
  - 하늘/하나님의 광범위한 증언을 가리킨다(신적 증언으로 확장).
  rationale: 그리스어 텍스트가 분명히 1인칭 복수형을 사용하므로 번역에서 그 형태를 풀어 해석하지 않고 그대로 남겨 독자가 원문이 제기하는 해석적 문제를 경험하도록 했습니다.
  doctrine_reference: 해석적 긴장 보존 — 본문이 자체적으로 해결하지 않는 대목을 번역에서 임의로 좁히지 않음
