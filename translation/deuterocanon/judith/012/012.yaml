id: JDT.12.12
reference: Judith 12:12
source:
  edition: lxx-swete-1909
  text: ἰδοὺ γὰρ αἰσχρὸν τῷ προσώπῳ ἡμῶν εἰ γυναῖκα τοιαύτην παρήσομεν οὐχ ὁμιλήσαντες αὐτῇ· ὅτι ἐὰν ταύτην μὴ ἐπισπάσωμεθα, καταγελάσεται ἡμῶν.
  language: Greek
  pages:
