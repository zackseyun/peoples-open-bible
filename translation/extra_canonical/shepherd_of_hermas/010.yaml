  rationale: The selected clause leaves its referent implicit; explicit Lord or Jesus wording is an interpretation
    rather than a literal alternative for the bare expression.
- issue: Right‑ and left‑hand sides in the sanctuary
  chosen_reading: Equal gifts and promises; right‑hand seating conveys honor for suffering
  alternative_readings: []
  rationale: The source explicitly gives both sides the same gifts and promises and only some glory to
    the right. Separate salvation rankings are not offered as viable readings.
- issue: Cleansing “up to this day” and non‑double‑mindedness
  chosen_reading: Retain the future will be cleansed, all their sins, the not-double-minded qualification
    and up to this day temporal expression.
  alternative_readings:
  - As of this day or on this day for the temporal phrase.
  rationale: Preserve the source’s definite cleansing promise and negative qualification; no liturgical
    date or different framework is imposed.
- issue: Translation of σταυρούς
  chosen_reading: “Crucifixions”
  alternative_readings:
  - “crosses” as metonymy
  rationale: Given the martyr list (scourges, prisons, beasts), the punishment itself is meant; ‘crucifixions’
    foregrounds the suffering endured.
- issue: Rendering ἁγίασμα
  chosen_reading: “Sanctuary”
  alternative_readings:
  - “holy place”
  rationale: Maintains sacred‑space imagery without prescribing Temple architecture; fits Hermas’ visionary
    cultic symbolism.
- issue: Rendering δίψυχος
  chosen_reading: “double‑minded” as a moral vice
  alternative_readings:
  - “doubting”
  - “two‑souled”
  rationale: Hermas develops ‘double‑mindedness’ as a stock vice beyond mere doubt; keeping the term preserves
    continuity with his paraenesis.
- issue: Tower upon the waters
  chosen_reading: Literal rendering without interpretive expansion (e.g., baptism)
  alternative_readings:
  - Explicitly reading waters as baptism
  rationale: The vision will itself interpret symbols later; translation should not pre‑empt Hermas’ own
    exegesis.
