  to: 그녀는 과부의 옷을 벗고, 베일을 두르고 자신을 감싼 뒤, 팀나로 가는 길에 있는 에나임 어귀에 앉았습니다. 이는 셀라가 자란 것을 보았지만, 자신이 그에게 아내로 주어지지 않았기 때문입니다.
  rationale: 누락된 ‘자신을 감싸다’의 동작을 보충하고, 다말이 셀라에게 아내로 주어지지 않았다는 수동문의 관계를 ‘자신이 그에게’로 명확히 했습니다. 그 밖의 지명, 인과 관계, 격식 있는 합쇼체는 유지했습니다.
