  to: 보십시오[a], 강물이 세차게 밀려와도 그는 당황하지 않습니다. 요단 강물이 그의 입에 밀려들어도 그는 태연합니다.
  rationale: ‘입가’ 대신 원문의 פִּיהוּ에 맞는 ‘입에’를 사용하고, ‘확신합니다’를 문맥상 자연스러운 ‘태연합니다’로 다듬었습니다. 강의 격렬한 움직임과 대상의 비동요라는 원문의 대조를 유지했습니다. 검토 기록의 문맥 대상은 베헤못으로 이해해야 합니다.
  reviewer_model: gpt-5.6-terra
