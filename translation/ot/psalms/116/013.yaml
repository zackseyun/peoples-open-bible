  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Number nuance of יְשׁוּעוֹת
  chosen_reading: salvation
  alternative_readings:
  - salvations
  - deliverances
  rationale: The Hebrew plural can be retained more formally, but in English the singular better communicates the poetic sense without awkwardness. The alternative is worth preserving because the plural may emphasize multiple acts of rescue.
