translation:
  text: 5. Then those who had the dry but not cut [rods] handed them in. And some of them handed in their rods green, but others dry and cut, as if worm-eaten. So those who had handed in green [rods] he ordered to stand apart, but those who had handed in dry and cut [rods] he ordered to stand with the first group.
