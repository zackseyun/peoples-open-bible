id: PSA.89.21
reference: Psalms 89:21
source:
  edition: WLC
  text: אֲשֶׁ֣ר יָ֭דִ/י תִּכּ֣וֹן עִמּ֑/וֹ אַף זְרוֹעִ֥/י תְאַמְּצֶֽ/נּוּ־׃
translation:
  text: My hand will give him steadfast support; indeed, my arm will strengthen him.
  philosophy: dynamic
lexical_decisions:
- source_word: אֲשֶׁר
  chosen: with whom
  alternatives:
  - whom
  - for whom
  lexicon: HALOT
  rationale: Here אֲשֶׁר introduces a relative clause referring back to the chosen king in the previous verse. Because the clause immediately continues with עִמּוֹ ('with him'), the sense in English is best brought out as 'with whom' rather than a bare 'whom.'
- source_word: יָדִי
  chosen: my hand
  lexicon: HALOT
  rationale: A straightforward rendering of יָד. In this poetic context 'hand' functions metaphorically for God's active power and support, but the concrete image should be preserved in the main text.
- source_word: תִּכּוֹן
  chosen: will be steadfast
  alternatives:
  - will be firm
  - will stand firm
  - will be steadfast
  lexicon: HALOT
  rationale: כון in this context denotes firmness or stability; "be steadfast" avoids the misleading sense that God's hand is being founded or installed.
- source_word: עִמּוֹ
  lemma: עִם
  chosen: with him
  alternatives:
  - with him
  lexicon: HALOT
  rationale: The prepositional relation is represented directly in idiomatic English.
- source_word: אַף
  chosen: indeed
  alternatives:
  - also
  - even
  - 'yes'
  lexicon: HALOT
  rationale: אַף here adds emphatic continuation to the parallel line. 'Indeed' captures the intensifying force in natural English better than a wooden 'also.'
- source_word: זְרוֹעִי
  chosen: my arm
  lexicon: HALOT
  rationale: A literal rendering is preferable. In Hebrew poetry 'arm' commonly symbolizes strength or might, and the image should remain visible.
- source_word: תְאַמְּצֶנּוּ
  chosen: will strengthen him
  alternatives:
  - will make him strong
  - will fortify him
  lexicon: HALOT
  rationale: From אמץ in the Piel with 3ms suffix, meaning to strengthen or make strong. 'Will strengthen him' is both accurate and idiomatic, and it preserves the causative/intensive sense.
