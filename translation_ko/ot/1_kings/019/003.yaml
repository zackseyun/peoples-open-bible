id: 1KI.19.3
reference: 1 Kings 19:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֗רְא וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל נַפְשׁ֔/וֹ וַ/יָּבֹ֕א בְּאֵ֥ר שֶׁ֖בַע אֲשֶׁ֣ר לִֽ/יהוּדָ֑ה וַ/יַּנַּ֥ח אֶֽת נַעֲר֖/וֹ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/003.yaml
  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: ko
  text: 그는 보고 일어나 자기 목숨을 건지려고 떠나, 유다에 속한 브엘세바에 이르러 그의 종을 այնտեղ 남겨 두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: And he saw
  chosen_korean: 그는 그것을 보고
  alternatives_korean:
  - 그는 보고
  - 그것을 보고
  lexicon: ראה
  rationale: 영어 POB가 확정한 ‘he saw’를 살리되, 히브리어의 직접목적어가 문맥상 생략된 형태로 보이므로 한국어에서는 자연스럽게 ‘그것을’로 보완했습니다.
- source_word: וַיֵּלֶךְ אֶל נַפְשׁוֹ
  english_pob_choice: went for his life
  chosen_korean: 자기 생명을 위해 떠나
  alternatives_korean:
  - 목숨을 부지하려고 떠나
  - 자기 목숨을 걸고 떠나
  lexicon: נפש
  rationale: נפש는 여기서 단순한 ‘영혼’이 아니라 생명/목숨의 보존을 가리키므로, 직역적이면서도 의미를 분명히 하는 표현으로 옮겼습니다.
- source_word: בְּאֵר שֶׁבַע אֲשֶׁר לִיהוּדָה
  english_pob_choice: Beersheba, which belongs to Judah
  chosen_korean: 브엘세바에 이르렀습니다. 그곳은 유다에 속한 곳이었습니다
  alternatives_korean:
  - 유다에 속한 브엘세바에 이르렀습니다
  - 유다에 속한 브엘세바까지 갔습니다
  lexicon: בְּאֵר שֶׁבַע / ל
  rationale: 소속 관계를 나타내는 ל와 관계절을 한국어의 ‘~에 속한’으로 자연스럽게 풀어, 지리적 소속을 분명히 했습니다.
- source_word: וַיַּנַּח אֶת נַעֲרוֹ שָׁם
  english_pob_choice: and left his servant there
  chosen_korean: 그리고 그의 종을 거기에 남겨 두었습니다
  alternatives_korean:
  - 그리고 그의 종을 거기에 두었습니다
  - 그리고 그의 하인을 거기에 남겨 두었습니다
  lexicon: נַעַר
  rationale: נַעַר는 문맥상 엘리야의 수행 종을 가리키므로, POB의 ‘servant’를 따라 ‘종’으로 옮겼습니다.
theological_decisions:
- issue: 이동 동사의 연쇄와 서사 긴급성
  chosen_reading: ‘보고—일어나—떠나—이르렀다—남겨 두었다’의 연쇄를 유지해 탈진과 도피의 급박함을 드러냈습니다.
  alternative_readings:
  - 문장을 더 매끈하게 재배열해 ‘곧 떠났다’로 완화하는 방식
  rationale: 히브리어의 연속된 동작 표현을 보존해야 엘리야의 위기감이 살아나므로, 서사 리듬을 희석하지 않았습니다.
  doctrine_reference: 서사 문체 보존
- issue: ‘for his life’의 의미
  chosen_reading: ‘자기 생명을 위해’로 옮겨, 단순한 여행이 아니라 생명 보존을 위한 도피임을 드러냈습니다.
  alternative_readings:
  - ‘목숨을 걸고’처럼 관용적으로 번역하는 방식
  rationale: 본문의 긴박한 생존 의미를 드러내되, 원문의 방향성(생명을 향한 움직임)을 유지하기 위해 과장된 관용어는 피했습니다.
  doctrine_reference: 어휘·서사 의미
