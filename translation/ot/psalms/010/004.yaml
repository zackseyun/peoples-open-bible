id: PSA.10.4
reference: Psalms 10:4
source:
  edition: WLC
  text: רָשָׁ֗ע כְּ/גֹ֣בַהּ אַ֭פּ/וֹ בַּל יִדְרֹ֑שׁ אֵ֥ין אֱ֝לֹהִ֗ים כָּל מְזִמּוֹתָֽי/ו־־׃
translation:
  text: With his nose held high, the wicked man does not seek God; all his thoughts are, “There is no God[a]”.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “God is in none of his thoughts.” The Hebrew can describe either the content of his thinking or God’s absence from it.
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  chosen: the wicked man
  alternatives:
  - the wicked
  - a wicked man
  lexicon: HALOT
  rationale: Singular masculine adjective used substantivally. Rendered with an explicit singular personal referent in English to match the Hebrew individual portrait while keeping the representative force.
- source_word: כְּגֹבַהּ אַפּוֹ
  chosen: With his nose held high
  alternatives:
  - In the pride of his anger
  - Because of his haughtiness
  - In his arrogant bearing
  lexicon: HALOT
  rationale: This is a natural English equivalent of the concrete image of arrogant bearing.
- source_word: בַּל
  chosen: does not
  alternatives:
  - will not
  lexicon: HALOT
  rationale: Negative particle in poetic usage. With the imperfect יִדְרֹשׁ it expresses characteristic refusal rather than future time.
- source_word: יִדְרֹשׁ
  chosen: seek him
  alternatives:
  - seek
  - inquire
  - seek God
  lexicon: HALOT
  rationale: דרשׁ commonly means seek/inquire. The direct object is not explicit in this colon, but the following clause supplies God as the implied object. 'Seek him' makes the English coherent without overexpanding beyond the Hebrew sense.
- source_word: אֵין אֱלֹהִים
  chosen: There is no God
  alternatives:
  - God does not exist
  - No God
  lexicon: HALOT
  rationale: Existential negation plus אֱלֹהִים. Best rendered as a quoted or content clause expressing the wicked person's practical atheism.
- source_word: כָּל מְזִמּוֹתָיו
  chosen: all his thoughts are
  alternatives:
  - all his schemes are
  - all his plans are
  - this is all his thinking
  lexicon: HALOT
  rationale: מְזִמּוֹת can denote plans, devices, or thoughts. In this context it refers to the total cast of his thinking. 'Thoughts' fits the following content clause naturally in English, while 'schemes' would overemphasize plotting.
- source_word: בַּל יִדְרֹשׁ
  chosen: does not seek God
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: God is the clear contextual object, and supplying it prevents an incomplete English clause.
