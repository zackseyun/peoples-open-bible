revisions:
- from: 그 무렵에 나는 유다에서 사람들이 안식일에 포도즙 틀을 밟는 것을 보았고, 곡식 더미를 들여다가 나귀에 싣는 것과—포도와 무화과와 온갖 짐도 마찬가지였습니다—안식일에 예루살렘으로 들여오는 것을 보았습니다. 그래서 나는 그들이 양식을 팔던 날에 그들을 증언하였습니다.[a][b][c]
  to: 그 무렵에 나는 유다에서 사람들이 안식일에 포도주 틀을 밟고, 곡식 더미를 가져와 나귀에 싣고, 포도주와 포도와 무화과와 온갖 짐을 안식일에 예루살렘으로 들여오는 것을 보았습니다. 그래서 나는 그들이 양식을 팔던 날에 그들에게 경고했습니다.
  rationale: 포도주의 누락을 복구하고, 원문의 연속된 노동·운반 행위를 한국어 병렬 구조로 명료하게 재구성했습니다. 마지막 동사는 문맥상 경고의 의미를 자연스럽게 드러내도록 고쳤습니다. 본문에 필수적인 주석은 없으므로, 설명적이며 본문 의미를 반복하는 기존 각주와 표지를 제거했습니다.
  reviewer_model: gpt-5.6-terra
