translation:
  language: hi
  text: हे प्रभु, आप जानते हैं कि मैं हर पाप और किसी पुरुष से अछूती हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γινώσκεις
  choice: आप जानते हैं
  rationale: वर्तमानकालीन प्रत्यक्ष संबोधन को स्वाभाविक और आदरपूर्ण हिन्दी में रखा गया है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन कारक को ‘हे’ के साथ स्पष्ट किया गया है।
- source_word: καθαρά εἰμι
  choice: मैं…शुद्ध हूँ
  rationale: स्त्रीलिंग वक्ता की नैतिक और यौन शुद्धता—दोनों की सम्भावना रखने वाले सामान्य पद को बनाए रखा गया है।
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: हर पाप से
  rationale: πάσης की व्यापकता और ἀπό के अलगाव/निर्दोषता के भाव को सीधे व्यक्त करता है।
- source_word: καὶ ἀνδρός
  choice: और पुरुष से
  rationale: ἀνήρ के एकवचन रूप तथा καί की समन्वयात्मक संरचना को यथासम्भव निकट रखा गया है; ‘किसी पुरुष से’ कहने पर मूल से अधिक सार्वत्रिकता जुड़ सकती थी।
theological_decisions:
- issue: ‘शुद्ध’ का आशय नैतिक निष्पापता है या पुरुष के साथ यौन सम्बन्ध से रहित होना
  choice: ‘हर पाप से और पुरुष से शुद्ध’ कहकर दोनों पदों को अलग समन्वित रखा गया
  alternative: ‘किसी पुरुष के साथ किए गए हर पाप से शुद्ध’ या ‘पुरुष-संसर्ग से शुद्ध’
  rationale: यूनानी वाक्य में ἁμαρτίας और ἀνδρός दोनों ἀπό पर निर्भर हैं और καί से जुड़े हैं। वैकल्पिक अनुवाद दोनों को एक ही यौन-नैतिक दावे में मिला देते और मूल की असहजता तथा सम्भावित अस्पष्टता को समाप्त कर देते।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और प्रार्थनात्मक है। मूल यूनानी की संक्षिप्त तथा कुछ असहज समन्वय-रचना को जानबूझकर अत्यधिक सहज बनाकर उसका अर्थ निश्चित नहीं किया गया है।
