  - issue: Context-sensitive reorientation terminology
    chosen_reading: '1[a]. And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and with the intention of the soul.


      2. For I myself, in my father’s presence, spoke peaceably to Joseph; but when I went out from his presence, the spirit of hatred darkened my mind and disturbed my understanding so that I wanted to kill him.


      3. Love one another from the heart; and if anyone sins against you[b], speak peace to him, and in your soul hold no deceit; and if he confesses and changes his mind, forgive him.


      4. But if he denies it, do not contend with him, lest, when he swears an oath, you sin doubly.


      5. Do not let a stranger hear your secret in a quarrel, lest, hating you, he become your enemy and commit a great sin against you; for many times he either kills by treachery or entangles you in evils, having taken in from you the poison.


      6. But if he denies it and is ashamed when reproved, be still and do not reprove him further. For the one who denies it reorients away from having done wrong against you, so as not to wrong you again, and, being afraid, makes peace.


      7. But even if he is shameless and persists in his wrongdoing, even so forgive him from the heart[c], and leave vengeance to God.'
    alternative_readings:
    - Traditional repent/repentance wording, preserved at the baseline commit.
    rationale: Use reorient/reorientation without automatically inserting God. The sentence supplies a departure, destination, interpersonal setting, or the work's own conceptual framework. Preserve distinct turning verbs and named wrongdoing.
    doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
