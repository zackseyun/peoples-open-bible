  - severity: low
    issue: ‘격한 분개’의 ‘격한’은 μηνίσεως에 명시된 수식어가 아닙니다.
    rationale: 명사의 강한 분노라는 어감은 ‘분개’ 자체와 각주 대안으로 충분히 나타낼 수 있으므로, 추가 강도 표지는 피하는 편이 안전합니다.
