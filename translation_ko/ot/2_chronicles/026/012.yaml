  - 용맹의 용사들로
  lexicon: גִּבּוֹר חַיִל
  rationale: 전치사 לְ는 단순한 목적어보다 분류·자격의 의미를 나타내므로 ‘~로서’로 처리했고, גִּבּוֹרֵי חָיִל은 ‘용맹한 전사들’로 자연스럽게 풀었습니다.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  english_pob_choice: two thousand six hundred
  chosen_korean: 이천육백 명
