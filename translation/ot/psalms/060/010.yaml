id: PSA.60.10
reference: Psalms 60:10
source:
  edition: WLC
  text: הֲ/לֹֽא אַתָּ֣ה אֱלֹהִ֣ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאוֹתֵֽי/נוּ־־׃
translation:
  text: Have you not rejected us, O God[a]? You do not march out with our armies, O God.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “Will it not be you, O God, though you have rejected us?”—answering the questions in verse 9.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  chosen: Have you not
  alternatives:
  - Is it not you who
  lexicon: HALOT
  rationale: Introduces a rhetorical question expecting affirmation. 'Have you not' preserves the interrogative force and natural English idiom.
- source_word: אַתָּה
  chosen: you
  alternatives:
  - you yourself
  lexicon: HALOT
  rationale: The independent pronoun adds emphasis. English can convey this adequately with normal word order in the rhetorical question without overtranslating.
- source_word: אֱלֹהִים
  chosen: O God
  alternatives:
  - God
  lexicon: HALOT
  rationale: Used here in direct address, so 'O God' best reflects the vocative sense in English. Repeated in the second clause to match the Hebrew repetition.
- source_word: זְנַחְתָּנוּ
  chosen: rejected us
  alternatives:
  - cast us off
  - spurned us
  - abandoned us
  lexicon: HALOT
  rationale: זנח commonly means reject or cast off. 'Rejected us' is clear modern English and preserves the covenantal/military sense of divine disfavor without sounding archaic.
- source_word: וְלֹא
  chosen: You do not
  alternatives:
  - and have not
  - and will not
  - and do not
  lexicon: HALOT
  rationale: 'The negative begins a statement of the crisis: God does not go out with the armies. Continuing the preceding English question would reverse that meaning.'
- source_word: תֵצֵא
  chosen: go out
  alternatives:
  - march out
  - go forth
  lexicon: HALOT
  rationale: In this military setting the verb means going forth to battle with the armies.
- source_word: בְּצִבְאוֹתֵינוּ
  chosen: with our armies
  alternatives:
  - with our hosts
  - among our armies
  lexicon: HALOT
  rationale: צבאות refers to military forces/armies here. 'With our armies' is idiomatic and conveys accompaniment in battle better than the more archaic 'hosts.'
