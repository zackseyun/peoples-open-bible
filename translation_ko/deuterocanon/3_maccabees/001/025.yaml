  to: 그리고 무리는 전과 같이 이들에게 계속 간청하였고, 왕 주변에 있던 장로들은 여러 가지 방법으로 왕이 마음에 품은 음모를 그만두도록 그의 오만한 마음을 돌이키려 했습니다.
  rationale: 청원의 대상인 τούτοις를 ‘이들에게’로 명확히 하고, ἀνεστρέφετο의 지속성은 ‘계속’으로 반영했습니다. 또한 왕의 마음을 이미 품은 음모에서 돌이키려 한다는 원문의 의미를 자연스러운 한국어 목적 구문으로 옮겼습니다. 핵심 용어와 본문의 정치적·도덕적 긴장은 유지했습니다.
