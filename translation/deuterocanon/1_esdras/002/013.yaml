  philosophy: dynamic
lexical_decisions:
- source_word: τὰ ... πάντα σκεύη
  chosen: all the vessels
  alternatives:
  - all the articles
  - all the utensils
  lexicon: LSJ
  rationale: σκεύη commonly denotes vessels, implements, or articles. In this temple-treasury context, 'vessels' is the most natural and traditional English term without becoming archaic.
- source_word: ἐκομίσθη
  chosen: were brought up
  alternatives:
  - were brought
  - were carried back
  lexicon: LSJ
  rationale: The aorist passive indicates transport. 'Brought up' preserves the conventional sense of conveying items up to Jerusalem/temple context, while remaining readable. The MT parallel lists items and totals but does not control this verb; the Greek is primary here.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  chosen: the gold and silver ones
  alternatives:
  - gold and silver
  - golden and silver vessels
  lexicon: LSJ
  rationale: These adjectives modify the implied σκεύη. English needs either ellipsis or repetition; 'the gold and silver ones' keeps the Greek compactness while clearly referring back to the vessels.
- source_word: πεντακισχίλια τετρακόσια ἑξήκοντα ἐννέα
  chosen: five thousand four hundred and sixty-nine
  alternatives:
  - 5,469
  lexicon: LSJ
  rationale: The Greek gives a straightforward cardinal total. The MT parallel at Ezra 1:10 has a different itemized sequence and contributes to the broader numerical tension in the inventory tradition, but this verse's Greek total is clear and should be translated directly.
