  from: He said to them[a], “An enemy did this.” Then the servants said to him, “Do you want us to go and gather them up?”
  to: He said to them[a], “An enemy did this.” Then the servants said to him, “So do you want us to go and gather them up?”
  rationale: The draft omits the inferential particle οὖν ('then' or 'so') inside the direct speech. The slaves are drawing a practical inference from the master's statement. Adding 'So' or 'then' preserves this connection (BDAG s.v. οὖν). The draft's 'Then' outside the quote translates the conjunction δὲ, leaving οὖν untranslated.
