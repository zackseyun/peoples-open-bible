  from: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
  to: Now take this seriously and consider what you should do, because disaster is certain to strike our master and his whole household. He is such a scoundrel that no one can reason with him.
