  from: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[b][c]. Blessed are all who take refuge in him.
  to: Kiss the son[a][b], lest he be angry and you perish in the way, for his anger burns quickly[c]. Blessed are all who take refuge in him.
  rationale: Relocating the note on bar to “the son” is necessary and the concrete main-text rendering “Kiss” appropriately preserves the source image while noting its homage sense. “His anger burns quickly” is a defensible concise rendering of the difficult clause, but the proposed replacement note narrows the ambiguity of כמעט too far. The note should retain the alternative sense “but a little,” rather than presenting quick kindling as the sole alternative.
