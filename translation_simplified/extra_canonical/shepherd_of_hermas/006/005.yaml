base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/005.yaml
  text: 'For the Master swore by his glory concerning his chosen ones: if, after this appointed day, sin should still occur, they have no salvation; for repentance has an end for the righteous. The days of repentance have been fulfilled for all the holy ones, but for the nations there is repentance until the last day.'
translation:
  language: en
  text: 'For the Master swore by his glory concerning his chosen people: if they sin again after this appointed day, they have no salvation. The time for the righteous to reorient[r1] comes to an end. For all the holy people, the days of reorientation are now over. But the nations may reorient until the last day.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: his chosen ones
  simplified_phrase: his chosen people
  preserved_meaning: The group specially chosen by the Master remains the subject.
  reasoning_layer_used: POB base translation
  rationale: “Chosen people” is more natural English without changing the group described.
interpretive_expansions:
- pob_phrase: if, after this appointed day, sin should still occur
  rendering: if they sin again after this appointed day
  claim: The warning concerns further sin by the chosen people after the stated day.
  evidence:
  - The preceding phrase supplies the chosen people as the subject.
  - “After” and “still” mark sin occurring beyond the appointed day.
  confidence: high
  alternatives_preserved:
  - The appointed day remains unidentified.
  - The wording does not specify a particular kind or pattern of sin.
translation_notes:
  risk_flags:
  - risk: “This appointed day” has no identified referent in the supplied record.
    mitigation: The main text preserves the phrase without guessing which day is meant.
  - risk: “The nations” may be less immediately clear than an interpretive term such as “Gentiles.”
    mitigation: The source-controlled wording is retained because no lexical rationale authorizes a narrower equivalent.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
