theological_decisions:
- issue: The identity implied by እግዚእ
  chosen_reading: the Lord
  alternative_readings:
  - Yahweh
  rationale: The Ge’ez gives a title here, not the divine name; the rendering does
    not import a later identification.
- issue: The meaning of “my holy word”
  chosen_reading: the Lord’s utterance in the vision
  alternative_readings:
  - a personified divine Word
  rationale: The immediate speech context supports an utterance; no later christological
    sense is imported.
