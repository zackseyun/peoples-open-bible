  from: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
  to: “Come up to me and help me. Let us attack Gibeon, because it has made peace with Joshua and the Israelites.”
  rationale: I retain “made peace,” following the history's sound distinction between treaty peace and the narrower claim of an alliance. The earlier preference for “sons of Israel” rested on formal correspondence; “Israelites” better conveys the national reference here.
