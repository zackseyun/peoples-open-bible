  from: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
  to: Joseph of Arimathea, a respected member of the Jewish council who was himself also waiting for the kingdom of God, boldly went in to Pilate and asked for the body of Jesus.
  rationale: I retain the recorded improvements “Joseph of Arimathea” and “boldly went in,” which remove cumbersome descriptions and redundant motion. Although earlier rationale avoided naming the Sanhedrin, identifying this as the Jewish council conveys what the narrative's first hearers would have understood without adding a claim about Joseph's role in the verdict.
