  meaning_decisions:
  - source_phrase: אֶת דִּמְכֶם לְנַפְשֹׁתֵיכֶם אֶדְרֹשׁ
    prior_rendering: I will require your blood for your lives
    new_rendering: I will surely demand an accounting for your lifeblood
    rationale: The judicial use of “require” concerns accountability for bloodshed; the prior wording could sound as though God demands the hearers' blood regardless of wrongdoing.
  - source_phrase: מִיַּד כָּל חַיָּה אֶדְרְשֶׁנּוּ
