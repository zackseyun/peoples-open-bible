  rationale: The first draft’s finite treatment of the lodging phrase communicates its meaning better than the later nominal wording. I retain the reviewer’s important distinction that the final participle should not simply become another action of the man, but explicitly identify the tongue as its likely subject and acknowledge the grammatical difficulty.
