revisions:
- from: 그러나 저는 벌레 같고 사람이 아니며, 사람들의 수치요 백성에게 멸시받는 자입니다.[a][b][c]
  to: 저를 보는 사람은 모두 저를 조롱합니다. 그들은 입술을 내밀고[a] 머리를 흔듭니다.[b]
  rationale: 지정된 WLC 원문(시편 22:7)에 맞추어 본문을 전면 교체했습니다. ‘모두’는 כָּל의 포괄성을, ‘저를 보는 사람’은 1인칭 접미사를 지닌 분사 רֹאַי를, ‘조롱합니다’는 יַלְעִגוּ לִי를 반영합니다. יַפְטִירוּ בְשָׂפָה의 구체적 동작은 확정하기 어려우므로 자연스러운 본문 표현과 대안 각주를 함께 제시했으며, 후기 기독교적 적용은 본문에 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:06:34Z'
