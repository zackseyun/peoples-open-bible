  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Meaning of נַפְשֶׁךָ in context
  chosen_reading: your life
  alternative_readings:
  - your soul
  - your self
  rationale: To preserve theological tension and avoid over-specifying a body/soul distinction not required by the Hebrew, the translation uses 'life,' which fits Psalmic usage of נֶפֶשׁ for the person or life itself.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §6
