  terminology: “Fazer expiação” e “templo” são apropriados no contexto cultual de Ezequiel. “Ingênuo” traduz bem פֶּתִי; a nota oferece “inexperiente” e “simples” como alternativas sem impor avaliação moral ou doutrinária.
