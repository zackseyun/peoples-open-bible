simplification_decisions:
- pob_phrase: Silver and gold I do not have
  simplified_phrase: I have no silver or gold
  preserved_meaning: Peter says he possesses no monetary wealth.
  reasoning_layer_used: Lexical decisions for Ἀργύριον, χρυσίον, and οὐχ ὑπάρχει μοι
  rationale: Natural English word order improves clarity while retaining both metals.
- pob_phrase: but what I do have, this I give to you
  simplified_phrase: but what I do have I give you
  preserved_meaning: Peter contrasts his lack of wealth with the gift he gives immediately.
  reasoning_layer_used: Lexical decision for ὃ δὲ ἔχω τοῦτό σοι δίδωμι and grounding review
  rationale: Removing the awkward demonstrative preserves the emphatic contrast and present act of giving.
- pob_phrase: in the name of Jesus the Messiah the Nazarene, walk
  simplified_phrase: In the name of Jesus the Messiah, the Nazarene, walk!
  preserved_meaning: Peter commands the man to walk in Jesus’ name while identifying Jesus by title and origin.
  reasoning_layer_used: Lexical and theological decisions for ἐν τῷ ὀνόματι, Χριστοῦ, Ναζωραίου, and περιπάτει
  rationale: Punctuation makes the titles easier to follow without changing the source-driven terms.
