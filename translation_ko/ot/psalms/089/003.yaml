  rationale: 이 절에서는 하나님의 지속성과 평행을 이루는 시어로 쓰여, 한국어에서는 과도하게 신학화하지 않으면서도 문맥상 지속적 사랑을 드러내는 「사랑」이 가장 자연스럽습니다.
- source_word: יִבָּנֶה
  english_pob_choice: will be built up
  chosen_korean: 세워질 것이며
  alternatives_korean:
  - 지어질 것이며
