    rationale: The questions continue the people’s appeal in verse 4; naming the implied anger makes the parallel clear, and “for all time” expresses continuing duration rather than an unspecified endpoint.
  - source_phrase: הִנֵּה דברתי וַתַּעֲשִׂי
