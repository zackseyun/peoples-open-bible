  category: meaning_retranslation
  from: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
  to: Whenever burnt offerings were offered to Yahweh on the Sabbaths, at the new moons, and at the appointed feasts, the Levites were also to serve regularly before Yahweh in the prescribed numbers[a].
  rationale: The earlier lexical rationale attaches the numbers to the sacrifices; the context of Levitical duties more strongly favors the number of Levites on duty. I retain the other reading in a footnote and preserve all three worship occasions.
