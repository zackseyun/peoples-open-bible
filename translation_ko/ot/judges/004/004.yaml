  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁ֣ה
  english_pob_choice: a woman
  chosen_korean: 여자이며
  alternatives_korean:
  - 한 여자이며
  - 여성이며
  lexicon: אִשָּׁה
  rationale: 영어 POB가 추가한 'a woman'을 반영해 드보라의 예언자·아내 정체성과 나란히 사람됨을 명시했습니다. '여성'보다 본문이 가진 직접성을 살려 '여자'를 택했습니다.
- source_word: נְבִיאָ֔ה
  english_pob_choice: a prophetess
  chosen_korean: 예언자였고
  alternatives_korean:
  - 예언자였으며
  - 여선지자였고
  lexicon: נָבִיא / נְבִיאָה
  rationale: 전통적 교회어 '여선지자'보다 원어 의미를 직역하는 '예언자'를 택해 본문의 직분을 분명히 했습니다.
- source_word: אֵ֖שֶׁת לַפִּיד֑וֹת
  english_pob_choice: the wife of Lappidoth
  chosen_korean: 라피도트의 아내로서
  alternatives_korean:
  - 라피도트의 아내이며
  - 라피도트의 아내로
  lexicon: אֵשֶׁת
  rationale: 소유 관계를 분명히 하되 한국어에서 자연스러운 부사격 연결인 '으로서'를 사용해 두 명사구를 매끄럽게 연결했습니다.
- source_word: שֹׁפְטָ֥ה
  english_pob_choice: was judging
  chosen_korean: 재판하고 있었습니다
  alternatives_korean:
  - 판단하고 있었습니다
  - 다스리고 있었습니다
  - 판결하고 있었습니다
  lexicon: שָׁפַט
  rationale: שָׁפַט는 판결 행위와 통치적 재판 기능을 함께 가질 수 있으므로, 여기서는 진행 중인 재판/재판권 행위를 드러내는 '재판하고 있었습니다'로 옮겼습니다.
theological_decisions:
- issue: 드보라의 직분/행위의 성격
  chosen_reading: 예언자이면서 동시에 이스라엘을 재판하는 지도적 역할을 수행한 것으로 옮겼습니다.
  alternative_readings:
  - 단순히 '판단하다'로 축소하는 읽기
  - 통치 의미를 강하게 넣어 '다스리다'로만 읽는 번역
  rationale: 본문은 예언과 재판 기능을 병기하므로 둘 중 하나로 흡수하지 않고, 원문의 긴장을 유지해 두 역할을 모두 보이게 했습니다.
  doctrine_reference: 사사기 4:4의 서술 기능과 사사/재판 용례
