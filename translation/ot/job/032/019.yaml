- source_word: כְּאֹבוֹת
  chosen: like new wineskins
  alternatives:
  - like skins
  - like bottles
  lexicon: HALOT
  rationale: אֹבוֹת here refers to skin-containers for wine, not spirits/ghosts. Because the object is culturally specific and paired with wine, 'wineskins' is the clearest contextual rendering.
- source_word: חֲדָשִׁים
  chosen: new
  alternatives:
  - fresh
  lexicon: HALOT
  rationale: Straightforward adjective modifying 'wineskins.' Retained directly.
- source_word: יִבָּקֵעַ
  chosen: it is about to burst
  alternatives:
  - it bursts
  - it will split open
  lexicon: HALOT
  rationale: בקע means to split or burst open. English singular 'it' refers collectively to the image of his belly likened to a pressurized wineskin. 'Is about to burst' captures the imminent pressure conveyed by the simile in idiomatic English.
