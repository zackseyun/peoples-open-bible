translation:
  text: 'But certain people ignorantly deny Him—or rather, have been denied by Him—being advocates of death rather than of the truth; and they have not been persuaded by the prophecies, nor by the law of Moses, nor even to this very hour by the Gospel, nor by the sufferings of each of us severally; for they are of the same mind also concerning us.


    For what profit is it [to me], if someone praises me but blasphemes my Lord, not confessing that He was a bearer of flesh? Yet whoever does not affirm this thereby denies Him altogether, being himself a bearer of a corpse.


    But their names, being unbelievers, I have not thought fit to record in writing—nay, far be it from me even to remember them—until they reorient[a] and return to the passion, which is our resurrection.'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - Provisional rendering based on the supplied public-domain English witness.
  - The square brackets in “[to me]” are preserved as a restoration signal.
  - “Bearer of a corpse” preserves the witness’s contrasting image.
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation. This reader text adapts the recorded English translation witness; it is not a verbatim quotation or a newly verified translation of the ancient-language text. The source witness is unchanged.
