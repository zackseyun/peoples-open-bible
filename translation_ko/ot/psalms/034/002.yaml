  naturalness: 수정문은 시편의 시적 표현인 ‘제 영혼’을 보존하면서도 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘야훼 안에서 자랑하겠습니다’는 בַּיהוָה의 영역/근거의 뉘앙스를 유지합니다.
