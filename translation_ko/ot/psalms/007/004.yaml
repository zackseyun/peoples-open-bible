lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 언약 이름 יהוה를 가리키므로 프로젝트 기본값대로 음역한 ‘야훼’를 사용했습니다. ‘주님’은 호칭 의미를 흐릴 수 있고, ‘여호와’는 본 프로젝트의 기준형이 아닙니다.
- source_word: אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 내 하나님이시여
  alternatives_korean:
