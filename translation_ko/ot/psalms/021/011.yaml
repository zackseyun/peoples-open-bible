- from: 주께서 그들의 열매를 땅에서 멸하시고, 그들의 자손을 사람의 아들들 가운데서 멸하실 것입니다.[a]
  to: 그들이 주께 악을 꾀하고 계략을 꾸몄으나, 이루지 못할 것입니다.
  rationale: This replaces the verse-10 text with a complete translation of the supplied WLC text. ‘주께 악을 꾀하고’ idiomatically renders their directing/intending evil against the addressee; ‘계략을 꾸몄으나’ preserves the parallel planning clause; and ‘이루지 못할 것입니다’ renders their inability to execute the scheme. No footnote is necessary because the Korean wording gives a faithful, sufficiently direct rendering without introducing a disputed interpretation.
