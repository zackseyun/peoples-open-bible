id: PSA.103.6
reference: Psalms 103:6
source:
  edition: WLC
  text: עֹשֵׂ֣ה צְדָק֣וֹת יְהוָ֑ה וּ֝/מִשְׁפָּטִ֗ים לְ/כָל עֲשׁוּקִֽים־׃
translation:
  text: Yahweh carries out righteous acts and secures justice for all who are oppressed.
  philosophy: dynamic
lexical_decisions:
- source_word: עֹשֵׂה
  chosen: carries out
  alternatives:
  - does
  - accomplishes
  lexicon: HALOT
  rationale: “Carries out” is an idiomatic rendering of the participial action with the following nouns.
- source_word: צְדָקוֹת
  chosen: righteous acts
  alternatives:
  - righteous acts
  - justice
  lexicon: HALOT
  rationale: The plural denotes concrete righteous deeds or acts.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: וּמִשְׁפָּטִים
  chosen: and justice
  alternatives:
  - and judgments
  - and acts of justice
  lexicon: HALOT
  rationale: The plural can denote judgments or acts of justice; collective “justice” is natural in English, with the formal plural noted.
- source_word: לְכָל
  chosen: for all
  alternatives:
  - for every
  - to all
  lexicon: HALOT
  rationale: The preposition ל with כל here marks beneficiary/recipient. 'For all' is the most natural English expression in this context.
- source_word: עֲשׁוּקִים
  chosen: who are oppressed
  alternatives:
  - the oppressed
  - those who are wronged
  lexicon: HALOT
  rationale: Passive participial form from עשק, referring to people suffering oppression or exploitation. 'Who are oppressed' is clear, natural, and preserves the passive sense.
