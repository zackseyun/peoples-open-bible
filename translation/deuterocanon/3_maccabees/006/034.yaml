translation:
  text: Those who had previously regarded the Jews as doomed to destruction and to be devoured by birds[a], and had joyfully registered them, groaned deeply, clothed in shame; their fire-breathing audacity was forcefully quenched.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or possibly, “had consigned the Jews to destruction and to be devoured by birds”; the Greek participle is difficult.
    reason: alternative_reading
lexical_decisions:
- source_word: οἵ τε πρὶν
  chosen: And those who had previously
  alternatives:
  - And those who before
  - And they who formerly
  lexicon: LSJ
  rationale: Marks a contrast with the prior reversal in the narrative; 'previously' gives the temporal force of πρίν in natural English.
- source_word: εἰς ὄλεθρον
  chosen: for destruction
  alternatives:
  - for ruin
  - for annihilation
  lexicon: LSJ
  rationale: ὄλεθρος denotes destruction/ruin; 'for destruction' fits the construction with ἀπογραφάμενοι and preserves the hostile intent without overinterpreting.
- source_word: οἰωνόβρωτους
  chosen: to be devoured by birds
  alternatives:
  - bird-devoured
  - for birds to eat
  lexicon: LSJ
  rationale: A rare compound meaning eaten by birds/left for birds as carrion. The idiomatic English clause communicates the sense more clearly than a wooden compound adjective.
- source_word: ἐξεσθιέμενοι
  chosen: been reckoning them
  alternatives:
  - considering them
  - thinking of them
  lexicon: LSJ
  rationale: In this context the participle is difficult in Swete's diplomatic text; the surrounding syntax indicates hostile anticipation regarding the Jews' fate. 'Been reckoning them' captures their prior assessment while avoiding an overconfident reconstruction beyond the witness.
- source_word: ἀπογραφάμενοι
  chosen: had registered them
  alternatives:
  - had enrolled them
  - had listed them
  lexicon: LSJ
  rationale: The verb commonly refers to registration/enrollment. In context it likely refers to the official listing of the Jews for execution; 'registered' preserves the bureaucratic force.
- source_word: μετὰ χαρᾶς
  chosen: with joy
  alternatives:
  - gladly
  - rejoicing
  lexicon: LSJ
  rationale: Simple and direct rendering of the prepositional phrase.
- source_word: κατεστέναξαν
  chosen: groaned deeply
  alternatives:
  - sighed heavily
  - lamented
  lexicon: LSJ
  rationale: The compound verb intensifies the act of groaning; 'groaned deeply' preserves that force.
- source_word: αἰσχύνην ἐφʼ ἑαυτοῖς περιβαλόμενοι
  chosen: clothing themselves with shame
  alternatives:
  - wrapping themselves in shame
  - covered with shame
  lexicon: LSJ
  rationale: The participle literally depicts putting shame on oneself like a garment. 'Clothing themselves with shame' preserves the metaphor.
- source_word: πυρόπνουν τόλμαν
  chosen: fire-breathing boldness
  alternatives:
  - fiery audacity
  - blazing insolence
  lexicon: LSJ
  rationale: The vivid metaphor combines ferocity and arrogance. 'Boldness' is more neutral lexically for τόλμα, while 'fire-breathing' preserves the image; the negative sense is supplied by context.
- source_word: ἀκμαίως ἐσβεσμένοι
  chosen: was vigorously quenched
  alternatives:
  - was utterly extinguished
  - was decisively snuffed out
  lexicon: LSJ
  rationale: ἐσβεσμένοι evokes extinguishing a flame, matching πυρόπνουν. ἀκμαίως adds force such as strongly/vigorously. Singular English predicate treats the phrase collectively as their boldness.
