  rationale: 대상 본문과 절 전체가 불일치하므로, 의미를 보존하는 부분 수정이 아니라 WLC 시편 69:29에 맞춘 완전 교체가 필요합니다. 개정문은 대조적 도입(‘그러나 저는’), 현재의 고난, 하나님께 드리는 청원을 차례로 반영합니다. 마지막 동사는 문맥상 청원으로 옮기되, 미래 진술 가능성은 각주에서 보존했습니다.
