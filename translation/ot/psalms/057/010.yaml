theological_decisions:
- issue: Rendering covenantal attributes of God in poetic parallelism
  chosen_reading: Translate חֶסֶד as 'steadfast love' and אֱמֶת as 'faithfulness'
  alternative_readings:
  - '''lovingkindness'' and ''truth'''
  - '''covenant love'' and ''truthfulness'''
  rationale: The verse praises God's enduring covenant character rather than making an abstract statement about propositional truth. The chosen pair preserves the common Hebrew theological pairing of loyal love and reliability in accessible modern English.
  doctrine_reference: Translation philosophy §§1, 5, 6
