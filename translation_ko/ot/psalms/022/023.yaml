lexical_decisions:
- source_word: אֲסַפְּרָה
  english_pob_choice: I will declare
  chosen_korean: 선포하겠습니다
  alternatives_korean:
  - 말하겠습니다
  - 전하겠습니다
  - 이야기하겠습니다
  lexicon: HALOT
  rationale: ספר의 피엘형은 단순 언급보다 공개적으로 알리거나 선포하는 뜻이 강하므로, 예배적·증언적 문맥을 살려 ‘선포하겠습니다’로 옮겼습니다.
- source_word: שִׁמְךָ
  english_pob_choice: your name
  chosen_korean: 주님의 이름
  alternatives_korean:
  - 당신의 이름
  - 주의 이름
  lexicon: HALOT
  rationale: 히브리어의 ‘이름’은 단순 호칭이 아니라 드러난 성품과 명성을 가리키므로, 시편 문맥에서 자연스럽고 경건한 한국어로 ‘주님의 이름’이라 옮겼습니다.
- source_word: לְאֶחָי
  english_pob_choice: to my brothers
  chosen_korean: 내 형제들에게
  alternatives_korean:
  - 내 형들에게
  - 내 형제자매들에게
  lexicon: HALOT
  rationale: 형태상 남성 복수형과 1인칭 소유격을 그대로 반영해 ‘형제들’로 옮겼고, 원문의 성별 표지를 지키기 위해 포괄적 확장은 본문에 넣지 않았습니다.
- source_word: קָהָל
  english_pob_choice: the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 모인 무리
  - 회집
  lexicon: HALOT
  rationale: קהל은 모여 있는 공동체를 뜻하므로, 교회 제도 용어보다 원문의 집합성을 살리는 ‘회중’이 적절합니다.
theological_decisions:
- issue: 남성 복수 친족 호칭을 본문에서 어떻게 처리할지
  chosen_reading: 내 형제들에게
  alternative_readings:
  - 내 형제자매들에게
  rationale: 히브리어 본문이 명시적으로 남성 복수형을 사용하므로 본문은 성별 표지를 유지했습니다. 공동체적·포괄적 적용 가능성은 본문이 아니라 주석 차원에서 보존하는 편이 원문 충실성에 맞습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
