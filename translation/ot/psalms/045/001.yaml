id: PSA.45.1
reference: Psalms 45:1
source:
  edition: WLC
  text: רָ֘חַ֤שׁ לִבִּ֨/י דָּ֘בָ֤ר ט֗וֹב אֹמֵ֣ר אָ֭נִי מַעֲשַׂ֣/י לְ/מֶ֑לֶךְ לְ֝שׁוֹנִ֗/י עֵ֤ט סוֹפֵ֬ר מָהִֽיר׀׀׃
translation:
  text: My heart overflows with a noble theme; I recite my verses for the king[a]; my tongue is the pen of a skillful scribe.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “about the king.”
    reason: alternative_reading
lexical_decisions:
- source_word: רָחַשׁ
  chosen: overflows
  alternatives:
  - stirs
  - bubbles up
  - is moved with
  lexicon: HALOT
  rationale: The verb conveys inner stirring or bubbling forth. 'Overflows' captures the image of something welling up from the heart into speech, fitting the poetic context better than a flatter 'utters' or a more obscure 'indites.'
- source_word: לִבִּי
  chosen: my heart
  lexicon: HALOT
  rationale: Standard rendering for the inner self, seat of thought and emotion. No reason to paraphrase.
- source_word: דָּבָר טוֹב
  chosen: a good word
  alternatives:
  - a pleasing theme
  - a noble matter
  lexicon: HALOT
  rationale: דבר is broad ('word, matter, thing'). 'A good word' preserves the lexical form while remaining intelligible. Because the phrase may also mean a noble or pleasing theme, that alternative is preserved in a footnote.
- source_word: אֹמֵר אֲנִי
  chosen: I recite
  alternatives:
  - I recite
  - I declare
  - I say
  lexicon: HALOT
  rationale: 'The participial clause introduces the poet''s spoken performance: ''I recite.'''
- source_word: מַעֲשַׂי
  chosen: my compositions
  alternatives:
  - my composition
  - my deeds
  - my work
  lexicon: HALOT
  rationale: The plural noun denotes the works or verses the poet has composed and now recites.
- source_word: לְמֶלֶךְ
  chosen: for the king
  alternatives:
  - concerning the king
  - to the king
  lexicon: HALOT
  rationale: The preposition can mark dedication, subject, or addressee. 'For the king' suits the royal composition while the other nuances remain in the note.
- source_word: לְשׁוֹנִי
  chosen: my tongue
  lexicon: HALOT
  rationale: Literal body-part metaphor should be retained in poetry rather than flattened to 'speech' or 'words.'
- source_word: עֵט
  chosen: pen
  alternatives:
  - stylus
  lexicon: HALOT
  rationale: '''Pen'' is the most natural modern equivalent for a writing implement. ''Stylus'' is more historically specific but less readable.'
- source_word: סוֹפֵר
  chosen: scribe
  alternatives:
  - secretary
  - writer
  lexicon: HALOT
  rationale: '''Scribe'' preserves the ancient literary setting and the professional sense of a trained writer.'
- source_word: מָהִיר
  chosen: skillful
  alternatives:
  - ready
  - swift
  lexicon: HALOT
  rationale: The adjective can denote quickness or readiness. In English, 'skillful scribe' communicates the idiomatic sense of practiced, fluent writing better than the potentially awkward 'swift scribe,' while still fitting the metaphor of ready composition.
