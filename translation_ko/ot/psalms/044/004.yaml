- from: 그들은 자기들의 칼로 그 땅을 차지하지 못했고, 자기들의 팔이 그들을 구원하지도 못했습니다. 그러나 당신의 오른손과 당신의 팔, 그리고 당신의 얼굴의 빛이 그러하셨으니 — 당신께서 그들을 기뻐하셨기 때문입니다.[a][b]
  to: 하나님, 주님은 나의 왕이십니다. 야곱에게 구원을 명하소서.[a]
  rationale: 원문의 강조된 선언(‘주님은 ... 왕이십니다’), 하나님을 향한 직접 호칭, 그리고 ‘명하소서’라는 피엘 명령형을 보존했습니다. יְשׁוּעוֹת는 넓게 ‘구원’으로 옮기되, 군사적·복수적 의미 가능성은 각주에 남겼습니다. 기존 초안은 다른 절을 번역했으므로 본문과 각주를 모두 교체했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:07:16Z'
