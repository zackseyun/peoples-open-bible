  meaning_decisions:
  - source_phrase: ἡ ... σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός
    prior_rendering: the flesh desires what is against the Spirit, and the Spirit what is against the flesh
    new_rendering: the flesh desires what is contrary to the Spirit, and the Spirit desires what is contrary to the flesh
    rationale: Repeating the implied verb makes the reciprocal opposition clear, while “contrary to” expresses conflicting desires more naturally than “what is against.”
  - source_phrase: ἵνα μὴ ἃ ἐὰν θέλητε ταῦτα ποιῆτε
    prior_rendering: so that you do not do the things you want
    new_rendering: so that you do not do whatever you want
    rationale: “Whatever” captures the indefinite expression without restricting the desired actions to either good or evil or turning the clause into an absolute claim of inability.
