review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 반영하지만, 현 번역은 문장이 미완결이고 인용부호가 닫히지 않았습니다. 또한 ‘하나님께 드리셨음이며’는 헬라어의 ἠγόρασας τῷ θεῷ(하나님을 위하여/하나님께)보다 ‘드리다’라는 별도 행위를 덧붙입니다. 이를 ‘하나님을 위하여 ... 사셨습니다’로 고쳐 원문의 구매 동사와 여격의 의미를 보존했습니다.
  naturalness: ‘합당하시니, 이는 … 하셨음이며’는 현대 표준 합쇼체 문장으로 부자연스럽고 문법적으로도 미완결입니다. 직접 인용을 완결된 문장들로 구성하고, ‘봉인을 여시기에’를 사용하여 자연스럽게 다듬었습니다.
  terminology: ‘두루마리’, ‘새 노래’, ‘죽임을 당하셨고’, ‘주의 피’, ‘족속과 언어와 백성과 나라’는 본문의 표현과 계시록의 문맥에 적절합니다. ‘봉인’은 현대어로 자연스러우면서 σφραγῖδες의 의미를 유지합니다.
  issues:
  - severity: high
    issue: 번역문이 문법적으로 미완결이며 인용부호가 닫히지 않았습니다.
    rationale: 본문은 ‘하셨음이며,’로 끝나고 여는 인용부호만 있어, 완결된 절로 제공될 수 없습니다.
  - severity: medium
    issue: ‘하나님께 드리셨음이며’가 원문에 없는 ‘드리다’ 행위를 추가합니다.
    rationale: ἠγόρασας는 ‘사다/구입하다’이며, τῷ θεῷ는 구매의 수혜자 또는 귀속을 나타냅니다. ‘하나님을 위하여 사람들을 사셨습니다’가 이를 더 직접적으로 반영합니다.
  - severity: low
    issue: ‘인들을 떼시기에’는 가능하나 다소 해석적입니다.
    rationale: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ는 직역상 ‘그 봉인들을 열다’입니다. ‘그 봉인들을 여시기에’가 원문 표현을 더 가깝게 보존합니다.
  revised_text: 그들은 새 노래를 부르며 이렇게 말합니다. “주께서는 두루마리를 받으시고 그 봉인들을 여시기에 합당하십니다. 주께서 죽임을 당하셨고, 주의 피로 모든 족속과 언어와 백성과 나라에서 사람들을 사셔서 하나님을 위하게 하셨기 때문입니다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘하나님께.’ 헬라어 여격 τῷ θεῷ는 ‘하나님을 위하여’ 또는 ‘하나님께’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 피와 함께.’
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘모든 족속과 언어와 백성과 나라에서.’ 네 겹의 표현은 사들여진 이들의 전 세계적 범위를 강조합니다.
    reason: cultural_note
  revision_rationale: 완결되지 않은 문장과 인용부호를 바로잡고, ‘드리다’라는 추가 의미를 제거했습니다. 다만 한국어 문법상 원문에 명시되지 않은 구매의 목적어는 필요하므로, 영어 감사 기록과 문맥에 따라 ‘사람들을’을 보충했습니다. τῷ θεῷ의 논쟁 가능한 뉘앙스는 본문에서 ‘하나님을 위하게’로, 각주에서 ‘하나님께’ 대안으로 보존했습니다.
