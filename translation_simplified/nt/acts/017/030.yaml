translation:
  language: en
  text: So then, in the past God was patient during the times when people did not know him. But now he commands everyone everywhere to reorient toward God[r1].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: To repent is to change one’s mind and turn away from sin.
    reason: simplification_note
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore, having overlooked the times of ignorance
  simplified_phrase: So then, in the past God was patient during the times when people did not know him
  preserved_meaning: God showed forbearance during the former period of ignorance without approving it.
  reasoning_layer_used: Lexical and theological decisions on ὑπεριδών and τῆς ἀγνοίας
  rationale: This wording states the past setting and God’s forbearance in natural English.
- pob_phrase: God now commands
  simplified_phrase: But now he commands
  preserved_meaning: God’s present command contrasts with his former patience.
  reasoning_layer_used: Lexical decision on τὰ νῦν and discourse contrast
  rationale: A new sentence beginning with “But now” makes the time contrast clear.
- pob_phrase: all people everywhere
  simplified_phrase: everyone everywhere
  preserved_meaning: The command applies universally and is not restricted to males or Gentiles.
  reasoning_layer_used: Lexical and theological decisions on τοῖς ἀνθρώποις πάντας πανταχοῦ
  rationale: “Everyone everywhere” expresses the same universal scope more directly.
interpretive_expansions:
- pob_phrase: times of ignorance
  rendering: times when people did not know him
  claim: The ignorance in Paul’s argument concerns lack of knowledge of God.
  evidence:
  - The lexical rationale identifies a prior lack of knowledge of God among the nations.
  - The Areopagus context concerns people worshiping without knowing the true God.
  confidence: high
  alternatives_preserved:
  - times of ignorance
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: “Was patient during” is less verbally close to the source verb than “overlooked.”
    mitigation: It preserves the audited sense of forbearance without implying approval or indifference.
  - risk: “Did not know him” makes the object of ignorance explicit.
    mitigation: Paul’s immediate argument and the lexical rationale bound this clarification.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
