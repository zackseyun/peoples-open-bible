id: JOB.31.40
reference: Job 31:40
source:
  edition: WLC
  text: תַּ֤חַת חִטָּ֨ה יֵ֥צֵא ח֗וֹחַ וְ/תַֽחַת שְׂעֹרָ֥ה בָאְשָׁ֑ה תַּ֝֗מּוּ דִּבְרֵ֥י אִיּֽוֹב׀־׃פ
translation:
  text: Then let thorns come up instead of wheat, and foul weeds[a] instead of barley. The words of Job have come to an end.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The exact plant is uncertain; the Hebrew suggests foul-smelling or noxious growth.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  chosen: instead of
  alternatives:
  - in place of
  - under
  lexicon: HALOT
  rationale: In this imprecatory agricultural context, תַּחַת marks substitution rather than physical location, so 'instead of' best conveys the sense.
- source_word: חִטָּה
  chosen: wheat
  lexicon: HALOT
  rationale: Standard rendering for the grain crop named in contrast with harmful growth.
- source_word: יֵצֵא
  chosen: let ... come up
  alternatives:
  - spring up
  - grow
  lexicon: HALOT
  rationale: Although literally 'go out/come out,' with vegetation the idiomatic sense is emergence from the ground; 'come up' is natural English and preserves the image.
- source_word: חוֹחַ
  chosen: thorns
  alternatives:
  - thornbush
  - briers
  lexicon: HALOT
  rationale: A generic harmful thorny plant is intended. 'Thorns' is clear, idiomatic, and fits the curse formula.
- source_word: שְׂעֹרָה
  chosen: barley
  lexicon: HALOT
  rationale: Standard rendering of the cereal crop.
- source_word: בָאְשָׁה
  chosen: foul weeds
  alternatives:
  - foul weeds
  - noxious weeds
  - wild grapes
  lexicon: HALOT
  rationale: Avoids implying a known species while retaining the semantic association with foul or harmful growth.
- source_word: תַּמּוּ
  chosen: are ended
  alternatives:
  - are finished
  - have come to an end
  lexicon: HALOT
  rationale: This closing colophon-like statement marks completion. 'Are ended' is concise and suitably formal in tone.
- source_word: דִּבְרֵי אִיּוֹב
  chosen: the words of Job
  alternatives:
  - Job's words
  - the speeches of Job
  lexicon: HALOT
  rationale: A straightforward construct rendering that preserves the formal closing notice.
