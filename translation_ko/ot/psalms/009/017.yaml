  yaml_path: translation/ot/psalms/009/017.yaml
  text: The wicked will return to Sheol—all the nations that forget God[a][b].
  footnotes:
  - marker: a
    text: Or 'turn back to Sheol.' The Hebrew verb can mean 'return' or 'turn back.'
    reason: lexical_alternative
  - marker: b
    text: Sheol is the Hebrew term for the realm of the dead; it is not identical in meaning to the later, more specific concept of hell.
    reason: cultural_note
translation:
  language: ko
  text: 악인들, 곧 하나님을 잊는 모든 민족은 스올로 돌아갈 것입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스올로 되돌아갈 것입니다.’ 히브리어 동사는 ‘돌아가다’ 또는 ‘되돌아가다’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘스올’은 죽은 자들의 영역을 가리키는 히브리어 용어입니다. 이는 후대의 더 특정한 ‘지옥’ 개념과 동일한 뜻은 아닙니다.
    reason: cultural_note
lexical_decisions:
- source_word: נודע יְהוָה
  english_pob_choice: Yahweh has made himself known
  chosen_korean: 야훼께서 자신을 알리셨습니다
  alternatives_korean:
  - 야훼는 알려지셨습니다
  - 야훼는 알려져 있습니다
  lexicon: HALOT
  rationale: 니팔형 נודע의 결과적·반사적 의미를 살려, 단순한 상태 진술보다 ‘자신을 드러내심/알리심’의 뉘앙스를 반영했습니다.
- source_word: מִשְׁפָּט עָשָׂה
  english_pob_choice: he has executed judgment
  chosen_korean: 심판을 집행하셨습니다
  alternatives_korean:
  - 공의를 행하셨습니다
  - 판결을 집행하셨습니다
  lexicon: HALOT
  rationale: משפט עשה는 단순한 ‘행함’이 아니라 재판적 행위를 가리키므로, 법정적 의미를 드러내는 ‘심판을 집행하다’로 옮겼습니다.
- source_word: בְּ/פֹ֣עַל כַּ֭פָּי/ו
  english_pob_choice: by the work of his own hands
  chosen_korean: 자기 손의 일로
  alternatives_korean:
  - 손의 일로
  - 자기 손으로 한 일로
  lexicon: HALOT
  rationale: כפיו의 소유 관계를 드러내기 위해 ‘자기’에 해당하는 의미를 분명히 했고, 원문의 역설적 인과를 간결하게 살렸습니다.
- source_word: הִגָּי֥וֹן
  english_pob_choice: Higgaion
  chosen_korean: 히가욘
  alternatives_korean:
  - 묵상
  - 울림
  lexicon: HALOT
  rationale: 용례가 불확실한 음악·예전 용어이므로 음역을 유지해 본문에서 특정 뜻으로 단정하지 않았습니다.
theological_decisions:
- issue: 야훼의 자기-계시와 심판의 관계
  chosen_reading: 이 절은 야훼께서 심판을 집행하심으로 자신을 알리신다는 연결을 그대로 드러냅니다.
  alternative_readings:
  - 야훼는 일반적으로 알려져 있습니다
  - 야훼께서 이 특정 사건에서만 자신을 알리십니다
  rationale: 히브리어는 ‘알려짐’과 ‘심판 집행’을 긴밀히 묶지만, 그 신학적 범위를 과도하게 확장하지 않도록 표현을 절제했습니다.
  doctrine_reference: 본문의 긴장을 보존하고 문맥이 허용하는 범위만 번역합니다.
