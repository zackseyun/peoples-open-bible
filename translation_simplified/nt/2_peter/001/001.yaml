translation:
  language: en
  text: 'From Simeon Peter, a servant of Jesus Christ and one of his apostles.


    To those who have received a faith just as precious as ours[a] in[b] the righteousness of Jesus Christ, our God and Savior:[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a faith of equal standing with ours”; the phrase can refer to equal value, honor, or privilege.
    reason: lexical_alternative
  - marker: b
    text: The Greek may also mean “through” or “by” the righteousness.
    reason: lexical_alternative
  - marker: c
    text: The Greek most naturally identifies Jesus as both God and Savior; a less likely reading refers separately to God and to the Savior Jesus the Messiah.
    reason: alternative_reading
