translation:
  text: 'After the shepherd had examined everyone’s rods, he said to me, “I told you that this tree loves
    life. Do you see how many repented and were saved?” “I see, sir,” I said. “This is so you may see,”
    he said, “that the Lord’s abundant mercy is great and glorious. He gave a spirit to those worthy of
    repentance.”[a]


    2. “Why then, sir,” I asked, “did they not all repent?” He said, “He gave repentance to those whose
    hearts he saw would become pure and serve him with their whole heart. But when he saw their deceit
    and wickedness, knowing they would repent hypocritically, he did not give them repentance, lest they
    again profane his name.”[b]


    3. I said to him, “Sir, now explain to me what sort of people handed in the rods and where they dwell.
    Then those who believed and received the seal, but broke it and did not keep it sound, may hear, recognize
    their own deeds and repent, receiving a seal from you. They may glorify the Lord because he took pity
    on them and sent you to renew their spirits.”[c]


    4. “Listen,” he said. “Those whose rods were found dry and eaten away by moths are the apostates and
    betrayers of the church. In their sins they blasphemed the Lord and were also ashamed of the Lord’s
    name that had been called over them. They were utterly lost to God.[d] You see that not one of them
    repented, although they heard the words you spoke to them, which I commanded you to speak.[e] Life
    has departed from such people.”


    5. “Those who handed in dry rods that had not rotted are close to them. They were hypocrites who introduced
    foreign teachings and led God’s servants astray, especially those who had sinned. They did not let
    them repent, but persuaded them with their foolish teachings. These people still have hope of repenting.”[f]


    6. “You see that many of them have repented since you spoke my commandments to them, and more will
    repent. Those who will not repent have lost their life. Those among them who repented became good,
    and their dwelling came to be in the first walls; some even went up into the tower.[g] So you see,”
    he said, “that the repentance of sinners brings life, but not repenting brings death.”[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: 'Philozōon literally means life-loving. “A spirit” retains the indefinite pneuma in this clause
      without silently specifying the Holy Spirit. Alternative: “He gave spirit to those worthy of repentance.”
      “Sir” addresses the shepherd; “Lord” identifies the one whose mercy he describes. The opening identification
      “the shepherd” and the final “he said” are bracketed editorial supplements in the selected working
      Greek, not preserved manuscript wording.'
  - marker: b
    reason: textual_variant
    text: '“Profane his name” follows Athos and the working 1891 text. Michigan has “blaspheme his law,”
      Bonner printed pp. 101–102. Full alternative ending: “He did not give them repentance, lest they
      again blaspheme his law.” The contrast between genuine and hypocritical repentance is preserved
      in either reading. The Greek question’s “why” is a printed conjecture; Michigan has a corresponding
      why/that construction, while Athos reads “thus.”'
  - marker: c
    reason: lexical_alternative
    text: The source explicitly speaks both of a seal previously received and broken, and of receiving
      a seal from the shepherd. The draft does not remove the second receiving or turn the passage into
      a later sacramental rule. “Their spirits” is plural; it is not silently changed to the singular
      Holy Spirit.
  - marker: d
    reason: textual_variant
    text: 'Athos and the working text say they were utterly lost to God. Michigan says they died to God,
      Bonner printed p. 103. Alternative: “They died completely to God.” The Lord’s name “called over
      them” preserves the invocation wording without adding a named ritual.'
  - marker: e
    reason: textual_variant
    text: 'The 1891 body conjectures “although they heard” and “you spoke” against Athos “and disobeyed”
      and “I spoke.” Michigan partly preserves the although/heard phrase and prints you-spoke outside
      restoration brackets, Bonner printed p. 103. Athos alternative: “Not one repented; they disobeyed
      the words I spoke to them, which I commanded you.” The modern published papyrus transcription is
      evidence for the ancient reading, not a fresh complete photograph collation.'
  - marker: f
    reason: textual_variant
    text: '“Foreign teachings” follows Athos xenas. Michigan has heteras, “other teachings,” Bonner printed
      p. 103. Alternative: “They introduced other teachings and led God’s servants astray.” Michigan’s
      persuasion verb is very doubtful; no certainty about its complete letters is claimed. Those obstructing
      others’ repentance are themselves said to have hope of repentance.'
  - marker: g
    reason: textual_variant
    text: 'Michigan omits the clause “those who will not repent,” leaving a disturbed join, Bonner printed
      p. 104. Athos preserves that condition. It is retained so the warning is not assigned indiscriminately
      to those who repent. Reconsideration of the prior lexical rendering: “the first walls” retains the
      Greek ordinal; the selected passage distinguishes these walls from the tower but does not establish
      the previous rendering “outer walls.”'
  - marker: h
    reason: textual_variant
    text: 'The bounded POB source selection reads hamartōlōn, “sinners,” from the Athos diplomatic transcription,
      Lake (1907), Plate IX line 36. Michigan partly preserves amar, with tōlōn restored across the line
      break, Bonner printed p. 104, papyrus p. 47 lines 12–13; its whole noun is not intact ink. The 1891
      body actually prints hamartiōn, “sins,” and remains archived unchanged. Alternative: “Repentance
      from sins brings life, but not repenting brings death.” No independent manuscript vote is added
      by counting two Athos editions.'
lexical_decisions:
- source_word: μετάνοια
  chosen: repentance
  alternatives:
  - turning back
  rationale: 'Reconsideration of the prior lexical metadata: διψυχεῖν and its renderings were out of unit
    and are removed; this decision concerns μετάνοια alone. Retain distinct groups, response conditions
    and warnings. An opportunity to repent is not the same as actual repentance or achieved salvation.'
- source_word: ἡ μετάνοια τῶν ἁμαρτωλῶν
  chosen: the repentance of sinners
  alternatives:
  - repentance from sins (1891 printed noun)
  rationale: Follow the bounded Athos noun selection with partial Michigan support; preserve the historical1891
    wording and explicit alternative.
