translation:
  language: en
  text: For many deceivers have gone out into the world. They do not confess that Jesus is the Messiah[a] coming in the flesh[b]—as a real human being. Such a person is the deceiver and the antichrist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Jesus the Messiah.” “Messiah” makes clear that Christ is a title here.
    reason: lexical_alternative
  - marker: b
    text: Or “having come in the flesh.” The Greek reads “coming in the flesh.”
    reason: lexical_alternative
