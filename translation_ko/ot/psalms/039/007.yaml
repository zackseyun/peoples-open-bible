  rationale: 대상 절의 히브리어 원문과 영어 POB 감사 기록에 맞추어 본문 전체를 교체했습니다. וְעַתָּה는 ‘이제’로, 호격 אֲדֹנָי는 ‘주님’으로, 수사 의문문 מַה קִּוִּיתִי는 자연스러운 한국어로 ‘제가 무엇을 기다리겠습니까?’로 옮겼습니다. 완료형 및 קוה의 희망 의미 가능성은 각주에서 제시하여 해석상의 범위를 보존했습니다. תּוֹחַלְתִּי לְךָ הִיא는 ‘제 소망은 주님께 있습니다’로 옮겼습니다.
