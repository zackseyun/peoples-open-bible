translation:
  language: ko
  text: 그러나 그분은 자신의 몸인 성전에 관하여 말씀하고 계셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 몸의 성소’로 번역할 수 있습니다. 여기서 그리스어 나오스(naos)는 성전 전체 단지보다 성소 또는 성전 건물을 더 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  english_pob_choice: he
  chosen_korean: 그는
  alternatives_korean:
  - 그 사람은
  - 저 사람은
  lexicon: BDAG
  rationale: 문맥상 ἐκεῖνος는 예수를 가리키는 지시대명사로, 한국어로 자연스럽게 '그는'으로 대명사화하여 전달하는 것이 원문 의미와 담백한 서술을 유지합니다.
- source_word: δὲ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 그런데
  lexicon: BDAG
  rationale: δὲ는 앞구절의 오해와 대조를 지시하므로 한국어에서 대조를 분명히 하는 '그러나'를 사용해 원문의 연결·대조 기능을 살렸습니다.
- source_word: ἔλεγεν
  english_pob_choice: was speaking
  chosen_korean: 말하고 있었습니다
  alternatives_korean:
  - 말하고 있었다
  - 말하였다
  lexicon: BDAG
  rationale: 임퍼펙트의 진행·서술적 과거 의미를 반영하여 '말하고 있었습니다'로 번역해 동작의 지속성을 보였습니다.
- source_word: ναοῦ
  english_pob_choice: temple
  chosen_korean: 성전
  alternatives_korean:
  - 성소
  - 성전 단지
  lexicon: BDAG
  rationale: ναός는 종종 성전 내성소(혹은 성소)를 가리키는 어휘적 뉘앙스가 있어 기본 번역은 '성전'으로 하되 주석으로 그 대체 가능성을 남겼습니다.
- source_word: σώματος / αὐτοῦ
  english_pob_choice: body / his
  chosen_korean: 그의 몸
  alternatives_korean:
  - 자기 몸
  - 그 몸
  lexicon: BDAG
  rationale: 소유격 구문은 예수 자신의 몸을 지칭하므로 명확하고 간결하게 '그의 몸'으로 처리했습니다.
theological_decisions:
- issue: Metaphorical identification of Jesus's body with the temple
  chosen_reading: 원문의 비유적·설명적 식별을 유지하여 '그의 몸의 성전'으로 직역합니다.
  alternative_readings:
  - '그의 몸을 성전이라고 해석·확장하여 더 설명적으로 번역(예: ''그의 몸이 곧 성전이다'')'
  - '''성소'' 등으로 뉘앙스를 바꿔 번역'
  rationale: 본문은 요한의 설명(주석적 진술)으로서 그리스도의 몸을 성전으로 식별하는 신학적 긴장을 담고 있으므로 불필요한 주석적 확장 없이 원문 형태를 그대로 살려 독자가 본문으로부터 신학적 함의를 판단하게 합니다.
  doctrine_reference: Affirmations; Translation philosophy §§1, 3, 6
