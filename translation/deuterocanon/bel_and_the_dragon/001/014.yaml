translation:
  text: regularly and consume the provisions. After the priests had gone out, the king set the food before Bel. At Daniel’s command, his young servants brought ashes and scattered them across the entire temple floor, with only the king watching. Then they went outside, shut the door, sealed it with the king’s signet ring, and left.
