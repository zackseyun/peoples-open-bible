  rationale: In the immediate context of Acts 9, Saul's Damascus-road encounter is with the risen Jesus, and the verse concludes with 'in the name of Jesus,' reinforcing the identification. Rendering κύριος as 'Lord' preserves the title without flattening its christological force.
