theological_decisions:
- issue: Identity of the spirit given by God and dwelling “in this flesh” (πνεῦμα … κατῴκισεν ἐν τῇ σαρκὶ
    ταύτῃ)
  chosen_reading: The spirit is the divine gift from God (often associated with the holy spirit in early
    Christian idiom), characterized as ‘without falsehood,’ dwelling in the believer.
  alternative_readings:
  - The human spirit/breath created by God.
  rationale: The parallel statements—receiving from God ‘a spirit without falsehood,’ returning it ‘false,’
    and glorifying ‘the Lord who dwells in you’—favor a divine indwelling gift rather than merely human
    psyche or breath.
- issue: Sense of ἀποστερηταί τοῦ Κυρίου
  chosen_reading: 'Active: ‘defrauders of the Lord’—they wrong the Lord by failing to return the entrusted
    deposit.'
  alternative_readings:
  - 'Passive: ‘bereft of the Lord’ (i.e., deprived of the Lord).'
  rationale: Lexically ἀποστερητής is an active agent (‘defrauder, depriver’). The deposit metaphor (‘not
    handing back the deposit’) confirms the active sense.
- issue: Referent of ‘these’ in ‘when these are found true’ (τούτων εὑρεθέντων ἀληθινῶν)
  chosen_reading: The earlier preferred interpretation takes these as words now spoken truly; former utterances
    may become trusted. This remains an interpretation, with the former-utterances referent also disclosed.
  alternative_readings:
  - ‘These’ refers back to the former utterances themselves, paradoxically ‘found true.’
  rationale: Preserve the earlier interpretive preference without inserting restored reputation or an
    explanation of how former lies become credible into the main text. The genitive absolute remains when/as;
    the later explicit if condition remains distinct.
- issue: Scope of ‘the most wicked lie’ (τοῦ πονηροτάτου ψεύσματος)
  chosen_reading: General superlative intensifying all lying rather than a technical reference to perjury
    or denial of the Lord.
  alternative_readings:
  - A specific vice such as perjury; apostasy (denial of the Lord).
  rationale: The immediate context concerns comprehensive truth-telling in speech, not oaths or apostasy.
    The superlative heightens the moral gravity of lying broadly.
- issue: Rendering δοῦλος under current servant policy
  chosen_reading: Servant of God in the main text, with bonded status and ownership nuance explained in
    note k.
  alternative_readings:
  - Bondservant of God
  - Slave of God
  rationale: Current DOCTRINE.md specifies servant consistently. Earlier slave-default and regression
    history are preserved in the archive, not treated as the current policy.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy / Contested terms: doulos'
- issue: Rendering ζήσεται τῷ Θεῷ
  chosen_reading: ‘Will live to God’ preserves the dative orientation.
  alternative_readings:
  - ‘Will live for God’ (functional/teleological).
  rationale: Maintains the textual wording and early-Christian idiom; footnote provides the smoother alternative.
