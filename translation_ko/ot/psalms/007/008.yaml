  rationale: 제시된 초안은 절을 잘못 대조하여 시편 7:7의 내용을 담고 있으므로, 의미를 유지한 부분 수정으로는 해결할 수 없습니다. 히브리어 יְהוָה יָדִין עַמִּים / שָׁפְטֵנִי יְהוָה כְּצִדְקִי וּכְתֻמִּי עָלָי의 두 절 구조를 그대로 반영했습니다. 미완료형 יָדִין은 시적·일반적 현재로 ‘심판하십니다’로, 명령형 שָׁפְטֵנִי는 간구형 ‘심판하소서’로 번역했습니다. 화자의 의와 온전함에 대한 주장은 완화하거나 교리적으로 해석하지 않았습니다.
