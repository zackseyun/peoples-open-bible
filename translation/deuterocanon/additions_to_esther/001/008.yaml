  meaning_decisions:
  - source_phrase: δίκαιον πᾶν ἔθνος
    prior_rendering: every righteous nation
    new_rendering: the whole righteous nation
    rationale: The preceding verse identifies one nation of the righteous as the target of the other nations, making a reference to that nation in its entirety the stronger contextual reading; the distributive alternative remains in a note.
  - source_phrase: φοβούμενοι τὰ ἑαυτῶν κακά
    prior_rendering: fearing their own calamities
    new_rendering: its people feared the calamities facing them
    rationale: The phrase concerns threatened harm, not evils they had committed, and the explicit reference to the people carries the Greek shift from a collective singular to plural participants.
  - source_phrase: ἡτοιμάσθησαν ἀπολέσθαι
    prior_rendering: they prepared to perish
    new_rendering: braced themselves to perish
    rationale: They were facing expected destruction, not making plans to bring about their own deaths.
