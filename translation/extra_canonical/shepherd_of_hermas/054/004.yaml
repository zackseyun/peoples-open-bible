translation:
  text: “You, therefore, who are reorienting[a], cast off the evils of this age that wear you down; and having put on every virtue of righteousness, you will be able to keep these commandments and no longer add to your sins. If, therefore, you add nothing further, you will depart from your former sins. Walk, therefore, in these my commandments, and you will live to God. These things [all] have been spoken to you by me.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
