  text: 'Die Zahl der Tage eines Menschen: viele Jahre – hundert.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀριθμὸς ἡμερῶν ἀνθρώπου
  choice: Die Zahl der Tage eines Menschen
  rationale: Gibt die griechische Nominalphrase eng und in natürlichem Standarddeutsch wieder; der artikellose Genitiv ἀνθρώπου wird allgemein als »eines Menschen« verstanden.
- source_word: πολλὰ ἔτη
  choice: viele Jahre
  rationale: Bewahrt die ausdrückliche, spannungsreiche Aussage »viele Jahre«, ohne sie durch »höchstens« oder eine andere nicht im griechischen Text stehende Einschränkung zu ersetzen.
- source_word: ἑκατόν
  choice: hundert
  rationale: Die isolierte Zahl wird wie im Griechischen knapp und appositionell wiedergegeben; »Jahre« ist aus dem unmittelbar vorausgehenden Ausdruck verständlich.
theological_decisions:
- issue: Verhältnis von »viele Jahre« zu »hundert«
  choice: Die Spannung bleibt in der Form »viele Jahre – hundert« erhalten.
  alternative: »höchstens hundert Jahre« oder »hundert Jahre sind viel«
  rationale: Der griechische Text enthält weder ein Wort für »höchstens« noch eine ausdrücklich prädikative Formulierung. Eine glättende Deutung würde die knappe, möglicherweise rhetorische Aussage stärker festlegen als die Vorlage.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. Der Gedankenstrich bildet die markante Nachstellung von ἑκατόν ab und wahrt die Ellipse des griechischen Satzes.
