id: PSA.68.31
reference: Psalms 68:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֶאֱתָ֣יוּ חַ֭שְׁמַנִּים מִנִּ֣י מִצְרָ֑יִם כּ֥וּשׁ תָּרִ֥יץ יָ֝דָ֗י/ו לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/031.yaml
  text: Nobles[a] shall come from Egypt; Cush shall quickly stretch out his hands to God[b].
  footnotes:
  - marker: a
    text: Or “envoys” or “princes.” The rare Hebrew term likely refers to prominent people from Egypt.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew personifies the singular nation Cush and says “his hands.”
    reason: literal_form
translation:
  language: ko
  text: 고관들이 이집트에서 올 것이며, 구스는 하나님께 손을 서둘러 내밀 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고관들’에 해당하는 히브리어는 드문 말입니다. 또는 ‘사절들’ 또는 ‘지도자들’로 옮길 수 있습니다. ‘구스’는 나라를 사람처럼 표현하며, 히브리어는 단수 소유 접미사로 ‘그의 손들’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּעַר
  english_pob_choice: Rebuke
  chosen_korean: 꾸짖으소서
  alternatives_korean:
  - 책망하소서
  - 꾸짖어 주십시오
  - 견책하소서
  lexicon: HALOT
  rationale: ב/하십시오체 명령으로서 강한 제압의 뉘앙스를 살리되, 단순한 감정적 꾸지람보다 권위 있는 신적 책망을 드러내도록 옮겼습니다.
- source_word: חַיַּת קָנֶה
  english_pob_choice: the beast of the reeds
  chosen_korean: 갈대의 짐승
  alternatives_korean:
  - 갈대밭의 짐승
  - 늪의 짐승
  - 갈대에 사는 들짐승
  lexicon: HALOT
  rationale: 원문의 비유를 풀어 ‘늪의 짐승’으로 특정하지 않고, POB의 이미지 보존을 따라 직역에 가깝게 유지했습니다.
- source_word: מִתְרַפֵּס בְּ/רַצֵּי כָסֶף
  english_pob_choice: trampling on pieces of silver
  chosen_korean: 은 조각 위를 짓밟는 자
  alternatives_korean:
  - 은 조각 위에서 스스로 엎드리는 자
  - 은 덩어리 위에 엎드리는 자
  - 은 조각을 바치며 엎드리는 자
  lexicon: HALOT
  rationale: 난해한 동사의 해석 중, 문맥상 적대적 형상과 맞는 ‘짓밟다’를 본문에 두고, 제출·엎드림의 대안 읽기는 주석으로 남겼습니다.
- source_word: בִּזַּר עַמִּים
  english_pob_choice: Scatter the peoples
  chosen_korean: 백성들을 흩으소서
  alternatives_korean:
  - 민족들을 흩으소서
  - 사람들을 흩으소서
  lexicon: HALOT
  rationale: עַמִּים의 기본 의미를 따라 ‘백성들’로 옮겼고, 시적 병렬 속에서 하나님의 분산 행위를 자연스럽게 드러내도록 했습니다.
theological_decisions:
- issue: 갈대의 짐승을 본문에서 특정 역사적 나라로 밝힐지 여부
  chosen_reading: 본문에서는 비유를 유지하고 특정 국가명은 넣지 않았습니다.
  alternative_readings:
  - 애굽으로 명시하기
  - 일반적 적대 제국으로 해석하기
  rationale: 히브리어는 이름을 직접 말하지 않고 이미지만 제시하므로, 본문에서는 과도한 역사적 확정을 피하고 독자가 시적 비유를 그대로 읽게 했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 미תרפס의 의미를 ‘짓밟다’로 둘지 ‘엎드리다/복종하다’로 둘지
  chosen_reading: 본문은 적대적 동작인 ‘짓밟다’를 채택했습니다.
  alternative_readings:
  - 은 조각을 바치며 엎드리다
  - 은 조각과 함께 스스로 낮아지다
  rationale: 문맥 전체가 전쟁을 즐기는 민족을 흩어 달라는 간구이므로, 폭력적 동작을 본문에 두고 복속/공물의 의미는 각주로 보존하는 것이 가장 균형적입니다.
  doctrine_reference: Translation philosophy §3
