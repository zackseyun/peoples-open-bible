id: ROM.16.25
reference: Romans 16:25
source:
  edition: robinson-pierpont-2005-byzantine
  digital_reference: Romans 14:24 (byztxt v2.0.3)
  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
translation:
  text: 'to him[a] who is able to strengthen you according to my gospel and the preaching of Jesus Christ, according to the revelation of the mystery kept secret for long ages,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Supplementary doxology (verses 25–27), absent from POB's SBLGNT base. Its wording follows the Robinson–Pierpont 2005-era digital text, which places it after Romans 14:23. POB presents it here at the end of chapter 16; that placement is an editorial choice, not the placement of the cited edition.
    reason: textual_variant
lexical_decisions:
- source_word: στηρίζω
  chosen: strengthen
  alternatives:
  - establish
  - make stand firm
  lexicon: BDAG
  rationale: "Refers to establishing or strengthening believers in their faith; 'strengthen' clearly conveys the supportive, fortifying action of God in the believer's life. Cleanup note: the reader-facing rendering no longer begins with 'Now' because this source expression does not contain an explicit temporal 'now'; any connective force is carried by the surrounding English clause or context."
- source_word: σιγάω
  chosen: kept secret
  alternatives:
  - kept silent
  - concealed
  lexicon: BDAG
  rationale: In the context of a 'mystery' (μυστήριον), the perfect passive participle σεσιγημένου implies a truth that was intentionally left unspoken or unrevealed until the appointed time.
- source_word: αἰώνιος
  chosen: long ages
  alternatives:
  - eternal times
  - ages past
  lexicon: BDAG
  rationale: While αἰώνιος often means 'eternal', in the dative plural phrase χρόνοις αἰωνίοις it idiomatically refers to vast stretches of past time during which the mystery was hidden.
