base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/018.yaml
  text: '1[v3]. And the LORD said to Abraham, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your son, your beloved one whom you love, Isaac, and go into the high land, and offer him up on one of the mountains that I will show you.”

    3. And he rose early in the morning and saddled his donkey, and he took two servants with him[v4], and Isaac his son; and he split the wood for the burnt offering, and he went to the place on the third day.

    4. And he saw the place from afar. And he came as far as the water-pit, and he said to his servants, “Stay here with the donkey, and I and the boy will go on, and we will worship, and we will return to you.”

    5. And he took the wood of the offering and laid it on Isaac his son, and he took in his hand the fire and the knife, and the two of them went together until that place.

    6. And Isaac said to his father, “Father.” And he said, “Here I am, my son.” And he said to him, “Look: the fire and the knife and the wood—but where is the sheep for the burnt offering, father?”

    7. And he said, “God will see for himself the sheep for the burnt offering, my son.” And he came near to the place of the mountain of the LORD.

    8. And he built the altar and placed the wood on the altar, and he bound Isaac his son and laid him on the wood that was on top of the altar, and he stretched out his hand to take the knife so that he might slaughter Isaac his son.

    9. And I stood before him and before the prince Mastema, and the LORD said, “Tell him not to lay down his hand upon the boy, and not to do anything to him, for now I know that he is one who fears God.”

    10. And I called to him from heaven and said to him, “Abraham, Abraham.” And he hurried and said, “Here I am.”

    11. And I said to him, “Do not stretch out your hand against the boy, and do not do anything to him, for now I know that you fear God, and you have not withheld your son, your seed, from me.”

    12. And the prince Mastema was put to shame. And Abraham lifted up his eyes and looked, and behold, a ram was caught by its horns in the thicket. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.

    13. And Abraham called that place “The LORD has seen,” so that it is said, “The LORD has seen”—that is Mount Zion.

    14. And the LORD called Abraham by his name a second time from heaven, just as he had shown me that we should speak in the name of the LORD.

    15. And he said, “By myself I have sworn, says the LORD, because you have done this thing and have not withheld your son, your seed, from me—your beloved one—surely blessing I will bless you, and multiplying I will multiply your seed like the stars of heaven and like the sand that is on the seashore, and your seed will inherit the cities of their enemies.

    16. And in your seed all the nations of the earth will be blessed, because you have obeyed my voice, and I have made known to everyone that you are faithful to me in all that I have said to you. Go in peace.”

    17. And Abraham went to his servants, and they arose and went together to Beer-sheba, and Abraham dwelt by the Well of the Oath.

    18. And he kept this festival every year for seven days with joy, and he named it the Festival of the LORD, according to the seven days during which he had gone and returned in peace.

    19. And thus it is ordained and written on the heavenly tablets concerning Israel and his seed[v18][v14][v13][v12][v9][v7], that they should keep this festival seven days with festal joy.'
  footnotes:
  - marker: v3
    text: The chapter numbering in the source rows skips from verse 1 to verse 3. No verse 2 text is present in the supplied chapter corpus.
    reason: segmentation_note
  - marker: v4
    text: The phrase rendered 'water-pit' reflects ዐዘቅተ ማይ, literally something like 'pit/cistern of water.' The exact local topographical nuance is uncertain.
    reason: lexical_alternative
  - marker: v7
    text: The final phrase may be understood as 'the place, the mountain of the LORD' or 'the place which is the mountain of the LORD.'
    reason: segmentation_note
  - marker: v9
    text: The wording is textually difficult. The sense is that the angelic narrator stands before Abraham and before Prince Mastema, and the LORD instructs him to stop Abraham.
    reason: textual_variant
  - marker: v12
    text: The opening clause is difficult; the translation takes it to mean that Prince Mastema was disgraced or put to shame when the test failed to destroy Isaac.
    reason: textual_variant
  - marker: v13
    text: Jubilees explicitly identifies the place with Mount Zion, unlike the more familiar Genesis wording. This is a significant book-specific theological expansion.
    reason: cross_reference
  - marker: v14
    text: The clause 'just as he had shown me that we should speak in the name of the LORD' reflects the revelatory framing of Jubilees and may sound abrupt because of the chapter's first-person angelic narration.
    reason: cultural_note
  - marker: v18
    text: The seven-day festival appears to count the period of Abraham's going and returning. The wording is compressed and may reflect a liturgical summary rather than a simple narrative notice.
    reason: segmentation_note
translation:
  language: ko
  text: '1. 그리고 주님께서 아브라함에게 말씀하셨습니다. “아브라함아, 아브라함아.” 그가 말했습니다. “제가 여기 있습니다.” 또 말씀하셨습니다. “네 아들, 네 사랑하는 아들, 네가 사랑하는 이삭을 데리고 높은 땅으로 가서, 내가 네게 보여 줄 산들 가운데 하나에서 그를 바치십시오.”

    3. 그는 아침 일찍 일어나 나귀에 안장을 얹고, 종 둘과 아들 이삭을 데리고, 번제에 쓸 나무를 쪼갠 뒤 셋째 날에 그곳으로 갔습니다.

    4. 그리고 그는 멀리서 그곳을 보았습니다. 그는 물이 있는 우물에 이르러 자기 종들에게 이렇게 말했습니다. “여기에 나귀들과 함께 머물러 있으십시오. 나와 아이는 가서 예배드리고 여러분에게 돌아오겠습니다.”

    5. 그리고 그는 제물에 쓸 나무를 가져다가 자기 아들 이삭에게 지우고, 자기 손에 불과 칼을 들었으며, 두 사람은 함께 그곳으로 갔습니다.

    6. 그리고 이삭이 자기 아버지에게 말했습니다. “아버지.” 그러자 그가 말했습니다. “내가 여기 있단다, 내 아들아.” 이삭이 아버지에게 말했습니다. “보세요, 불과 칼과 나무는 있는데, 번제물로 드릴 양은 어디에 있습니까, 아버지?”

    7. 그리고 그가 말하였습니다. “하나님께서 번제물로 드릴 양을 친히 보실 것입니다, 내 아들아.” 그리고 그는 하나님의 산이 있는 곳 가까이 갔습니다.

    8. 그리고 그는 제단을 쌓고 제단 위에 나무를 놓았으며, 자기 아들 이삭을 묶어 제단 위에 놓인 나무 위에 올려놓았습니다. 또 손을 뻗어 칼을 집어 들고 이삭, 곧 자기 아들을 잡아 죽이려 하였습니다.

    9. 나는 그 앞과 통치자 메스테마 앞에 서 있었고, 주께서 말씀하셨습니다. 「그에게 ‘소년에게 손을 대지 말고 그에게 아무것도 하지 말라’고 말하십시오. 이제야 내가 그가 하나님을 경외하는 자임을 알았습니다.」

    10. 그리고 내가 하늘에서 그를 불러 말했습니다. “아브라함, 아브라함.” 그러자 그는 두려워하여 말했습니다. “제가 여기 있습니다.”

    11. 그리고 내가 그에게 말했습니다. “그 아이에게 손을 뻗지 마십시오. 그에게 아무 일도 하지 마십시오. 이제 나는 당신이 하나님을 경외하며, 당신의 아들, 곧 당신의 맏아들을 내게 바치기를 아끼지 않았다는 것을 압니다.”

    12. 그리고 마스테마 군주가 수치를 당했습니다. 아브라함이 눈을 들어 보니, 숫양 한 마리가 가시덤불에 뿔이 걸려 있었습니다. 아브라함은 가서 그 숫양을 잡아 그의 아들을 대신하여 번제로 바쳤습니다.

    13. 아브라함은 그곳을 “야훼께서 보셨다”라고 불렀습니다. 그래서 “야훼께서 보셨다”라고 합니다. 그곳은 시온 산입니다.

    14. 그리고 주님께서는 하늘에서 아브라함의 이름을 두 번째로 부르셨습니다. 이는 주님께서 내게 보여 주신 대로, 우리가 주님의 이름으로 말하도록 하신 것이었습니다.

    15. 그리고 그가 말씀하셨습니다. “내가 나 자신을 두고 맹세하였다. 야훼께서 말씀하신다. 네가 이 일을 행하고 네 아들, 곧 네 맏아들, 네 사랑하는 이를 내게 바치기를 아끼지 않았으므로, 내가 반드시 네게 복을 주고 네 씨를 하늘의 별들과 바닷가의 모래처럼 크게 번성하게 하겠다. 네 씨는 그 원수들의 성읍들을 차지할 것이다.”

    16. 그리고 네 씨로 말미암아 땅의 모든 민족이 복을 받을 것입니다. 이는 네가 내 음성에 순종했기 때문입니다. 또 내가 네가 내가 네게 말한 모든 것에서 나에게 신실하다는 것을 모두에게 알렸습니다. 평안히 가십시오.

    17. 그리고 아브라함이 그의 종들에게 갔으며, 그들이 일어나 함께 브엘세바로 갔습니다. 아브라함은 맹세의 우물 곁에 거주했습니다.

    18. 그리고 그는 이 절기를 해마다 칠 일 동안 기쁨으로 지켰으며, 그가 갔다가 평안히 돌아왔던 칠 일을 따라 이것을 「야훼의 절기」라고 불렀습니다.

    19. 이와 같이, 이스라엘과 그 자손에 관하여, 그들이 이 축제를 축제의 기쁨으로 칠 일 동안 지키도록 하늘의 판에 규정되어 기록되어 있습니다.'
