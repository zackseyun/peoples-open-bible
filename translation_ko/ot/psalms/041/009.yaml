source:
  edition: WLC
  text: גַּם אִ֤ישׁ שְׁלוֹמִ֨/י אֲשֶׁר בָּטַ֣חְתִּי ב֭/וֹ אוֹכֵ֣ל לַחְמִ֑/י הִגְדִּ֖יל עָלַ֣/י עָקֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/009.yaml
  text: Even my close friend[a], in whom I trusted, who ate my bread[b][d], has lifted up his heel against me[c].
  footnotes:
  - marker: a
    text: Literally, “the man of my peace,” an idiom for one who was at peace with me, that is, a close friend or trusted ally.
    reason: lexical_alternative
  - marker: b
    text: Quoted in John 13:18 in connection with Judas's betrayal of Jesus.
    reason: cross_reference
  - marker: c
    text: Literally, “has made great a heel against me,” a Hebrew idiom for treacherous or hostile action.
    reason: lexical_alternative
  - marker: d
    text: Or “who shared my bread.” The Hebrew literally says “who ate my bread,” evoking table fellowship and trust.
    reason: lexical_alternative
translation:
  language: ko
  text: 나와 평화롭게 지내던 사람, 내가 신뢰하던 이, 내 빵을 먹던 이마저 나를 향해 자기 발꿈치를 높이 들었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나의 평화의 사람’입니다. 나와 평화로운 관계에 있던 사람, 곧 가까운 친구나 신뢰하던 동료를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 빵을 함께 먹던 이’라고 할 수 있습니다. 직역은 ‘내 빵을 먹는 이’이며, 식탁 교제와 신뢰의 관계를 떠올리게 합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘나를 향해 발꿈치를 크게 하였습니다’입니다. 적대적이고 배신적인 행동을 뜻하는 히브리어 관용 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: 요한복음 13:18은 예수님을 배반한 유다와 관련하여 이 말씀을 인용합니다.
    reason: cross_reference
lexical_decisions:
- source_word: דְּבַר בְּלִיַּעַל
  english_pob_choice: a wicked thing
  chosen_korean: 불량한 것
  alternatives_korean:
  - 악한 것
  - 패역한 것
  - 사악한 것
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현이 질병인지 비방인지 단정하지 않도록, 영어 POB의 ‘wicked thing’처럼 원문의 모호함을 보존하는 간결한 명사구로 옮겼습니다.
- source_word: יָצוּק בּוֹ
  english_pob_choice: is poured out upon him
  chosen_korean: 그에게 쏟아졌고
  alternatives_korean:
  - 그 위에 부어졌고
  - 그에게 덮쳤고
  - 그에게 쏟아지고
  lexicon: HALOT
  rationale: 수동형 동사의 이미지인 ‘부어지다/쏟아지다’를 살리되 한국어에서 자연스러운 문장으로 다듬었습니다. ‘쏟아졌고’는 재앙이 그에게 내리친다는 느낌을 유지합니다.
- source_word: לֹא יוֹסִיף לָקוּם
  english_pob_choice: he will rise no more
  chosen_korean: 다시는 일어나지 못합니다
  alternatives_korean:
  - 다시는 일어나지 않습니다
  - 다시는 일어설 수 없습니다
  - 일어나지 못할 것입니다
  lexicon: HALOT
  rationale: 관용구의 핵심인 ‘회복/일어남이 더 이상 없다’는 뜻을 현대 한국어로 분명하게 전달했습니다. 직역형보다 문맥상 종결적·비가역적 뉘앙스가 더 잘 드러납니다.
theological_decisions:
- issue: 구절의 이중적 의미 보존
  chosen_reading: 이 구절은 악한 병환이 임한 모습과, 파괴적인 고발/저주가 내려진 모습을 둘 다 완전히 배제하지 않도록 번역했습니다.
  alternative_readings:
  - 악한 병이 그에게 내렸습니다
  - 악한 고발이 그에게 덧씌워졌습니다
  rationale: 히브리어 표현이 실제로는 질병적 재앙인지, 파괴적 고발인지 확정하기 어려우므로, 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
