theological_decisions:
- issue: Metaphor of impurity in Jerusalem's judgment
  chosen_reading: Render לְנִידָה as 'unclean' in the main text
  alternative_readings:
  - has become like a menstruant
  - has become an impurity
  rationale: "Defilement is the provisional reading, not a settled exclusively ritual meaning or a doctrine about menstruation. Moral/general impurity is possible in a sin context; competing נוד-based interpretations remain disclosed. Retaining the source does not itself require this English interpretation, and choosing a different English sense would not automatically justify different consonants."
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve theological tension rather than resolve it'
