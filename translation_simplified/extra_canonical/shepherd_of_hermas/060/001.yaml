  review_output_hash: ae657def28af394bc8237825634739d4633bc3d290ed08441bf2ea1a46ea0b70
  review_summary: 'The draft is generally clearer and rightly retains the broad scope of “clean from everything.” However, it should be revised because “discipline his own soul” does not adequately carry the required self-affliction, and “firmly endure the distress” fuses two distinct demands: being distressed in tribulations and bearing the tribulations that come. The replacement keeps the passage’s severe, conditional account of repentance without adding a doctrinal mechanism or narrowing its ambiguity.'
