    rationale: Paul addresses the mixed believing community, not only its men; the familial relationship is retained.
  - source_phrase: τῆς θλίψεως ἡμῶν τῆς γενομένης ἐν τῇ Ἀσίᾳ
    prior_rendering: our affliction that happened in Asia
