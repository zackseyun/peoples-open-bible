  text: 귀로 듣자마자[a] 그들이 제게 순종합니다.[b] 이방인들이[c] 제게 거짓으로 복종합니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘귀가 들음에’입니다. ‘듣는 즉시’ 또는 ‘귀에 들리는 대로’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘듣다’로도 옮길 수 있으나, 히브리어에서 ‘~에게 듣다’는 이 문맥에서 ‘~에게 순종하다’라는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘낯선 이들의 자손’입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘제게 가장하여 복종합니다’, ‘제게 마지못해 겉으로만 복종합니다’. 이 동사는 정직하지 않거나 진실하지 않은 복종을 나타낼 수 있습니다.
    reason: lexical_alternative
