  meaning_decisions:
  - source_phrase: μαρτυρηθέντες διὰ τῆς πίστεως
    prior_rendering: though commended through faith
    new_rendering: though commended for their faith
    rationale: Their faith is the basis of the favorable testimony; 'for their faith' conveys that relationship naturally.
  - source_phrase: οὐκ ἐκομίσαντο τὴν ἐπαγγελίαν
    prior_rendering: did not receive the promise
    new_rendering: did not receive the fulfillment of the promise
    rationale: These people had received God's promises, but not the promised reality in view here; making the metonymy explicit prevents confusion while preserving the singular 'the promise.'
