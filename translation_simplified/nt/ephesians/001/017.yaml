translation:
  language: en
  text: I pray that the God of our Lord Jesus Christ, the Father of glory,[a] may give you a spirit of wisdom and revelation[b] so that you may know him.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the glorious Father.” The phrase is literally “the Father of glory.”
    reason: lexical_alternative
  - marker: b
    text: Or, “the Spirit of wisdom and revelation.” The Greek may refer either to a God-given spirit or disposition or to the Holy Spirit.
    reason: alternative_reading
  - marker: c
    text: Or, “in knowing him.” The Greek leaves the precise relationship somewhat open.
    reason: lexical_alternative
