  tier: 1
  from: Rejoice[a], young man, in your youth, and let your heart cheer you in the days of your young manhood. Walk in the ways of your heart and in the sight of your eyes[d][c][b], but know that for all these things God will bring you into judgment.
  to: Rejoice, young man, in your youth, and let your heart cheer you[a] in the days of your young manhood[b]. Walk in the ways of your heart and according to what your eyes see[c], but know that for all these things God will bring you into judgment.[d]
  rationale: “In the sight of your eyes” is unnaturally literal English. “According to what your eyes see” is a modest, source-faithful idiomatic rendering of the perceptual phrase and preserves its intentional openness. Each note is also moved to the phrase it actually explains; the final contextual note appropriately follows the judgment clause that balances the preceding imperatives.
