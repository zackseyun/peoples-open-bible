revisions:
- from: '1[v22]. 그리고 꿈에 큰아들 에서가 한 말을 리브가에게 들었습니다. 리브가가 사람을 보내어 작은 아들 야곱을 불러 그에게 이르되 보라 네 형 에서가 너를 죽이려고 위협하느니라

    2. 이제 내 아들아, 내 목소리를 들어라. 일어나 내 형 라반에게로 도피하여 하란으로 가서 네 형의 노가 풀리기까지 며칠 동안 그와 함께 머물라

    3. 그리고 네 형의 분노가 떠나고 네가 자기에게 행한 모든 일을 잊어버릴 때까지. 그러면 내가 사람을 보내어 너를 그곳에서 다시 데려오겠다.”

    4. 야곱이 이르되 나는 두렵지 아니하니 그가 나를 죽이려 하면 나도 죽이리라 하고

    5. 그 여자가 그에게 말했습니다. “제가 하루에 두 아들을 모두 잃게 되기를 바라지 않습니다.”

    6. 야곱이 그 모친 리브가에게 이르되 내 아버지가 늙어서 눈이 어두워 보지 못하시는 줄 당신도 아시느니라 만일 내가 그를 떠나면 그 앞에 악이 있을 것은 내가 그를 떠나 아버지를 떠났음이니이다

    7[v22]. 그러면 아버지께서 진노하셔서 나를 저주하실 것입니다. 나는 가지 않을 것이다. 그가 나를 보내시면 내가 갈 것입니다.”

    8. 그리고 리브가가 야곱에게 말했습니다. “내가 들어가서 말하겠습니다. 그가 당신을 보내실 것입니다.”

    9. 그리고 리브가가 들어가서 이삭에게 말했습니다. “에서가 아내로 삼은 헷의 두 딸 때문에 내가 내 생명을 싫어합니다.

    10. 그리고 야곱이 이 땅 여자들 가운데서 아내를 맞이한다면, 내가 어찌 계속 살아야 하겠습니까? 가나안의 딸들은 사악하니라.”

    11. 이삭이 야곱을 불러 그를 축복하고 명하여 이르되 너는 가나안 여자 중에서 아내를 택하지 말라

    12. 일어나 메소포타미아로 가서 네 외조부 브두엘의 집으로 가서 거기서 네 외삼촌 라반의 딸들 중에서 아내를 취하라.

    13. 전능하신 하나님이 너희에게 복을 주어 너희로 생육하고 번성하게 하여 너희로 여러 나라의 총회가 되게 하시기를 원하노라

    14. 또 내 아버지 아브라함의 복을 너와 네 후손에게 주사 네가 우거하는 땅과 하나님이 아브라함에게 주신 온 땅을 차지하게 하시기를 원하노라 내 아들아, 평안히 가라.”

    15. 이삭은 야곱을 보내어 메소포타미아로 가서 시리아 사람 브두엘의 아들이자 야곱의 어머니 리브가의 동생인 라반에게로 갔다.

