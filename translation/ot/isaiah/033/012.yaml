  category: meaning_retranslation
  from: And the peoples will become burnings of lime; like cut thornbushes[a], they will be burned in the fire.
  to: The peoples will be burned like limestone reduced to lime[a]; like cut thornbushes, they will be set ablaze.
  rationale: The lexical discussion correctly identifies lime production and the ignition of cut brush, but its defense of “burnings of lime” prioritizes compression over intelligibility. I preserve both source images while making their destructive force clear in English.
