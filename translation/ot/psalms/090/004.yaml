  to: For a thousand years in your sight are like yesterday when it is past, or like a watch in the night.[a]
  rationale: The verse text accurately represents the two similes. The current cultural note is incorrectly attached after “past,” while the second note duplicates the adopted wording. Keeping one cultural note after “night” is the smallest complete correction.
