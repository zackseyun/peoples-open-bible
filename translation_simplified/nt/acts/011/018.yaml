translation:
  language: en
  text: When they heard what Peter had told them, they stopped objecting and glorified God. They said, “So God has also given non-Jews the reorientation toward God[b][a] that leads to life.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term is often translated “repentance.”
    reason: lexical_alternative
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: When they heard these things
  simplified_phrase: When they heard what Peter had told them
  preserved_meaning: They responded after hearing Peter’s preceding report.
  reasoning_layer_used: lexical decision and immediate context
  rationale: Naming Peter’s report makes the reference clear without adding new content.
- pob_phrase: they became quiet
  simplified_phrase: they stopped objecting
  preserved_meaning: They ceased their dispute after hearing Peter.
  reasoning_layer_used: lexical decision
  rationale: This states the contextual sense of their becoming silent more clearly.
- pob_phrase: to the Gentiles
  simplified_phrase: to non-Jews
  preserved_meaning: God extended this gift beyond Jews to people of other nations.
  reasoning_layer_used: lexical decision and source footnote
  rationale: “Non-Jews” explains the contextual meaning of “Gentiles” in common English.
interpretive_expansions:
- pob_phrase: these things
  rendering: what Peter had told them
  claim: The demonstrative refers to Peter’s preceding report.
  evidence:
  - The immediate context is Peter’s report to the Jerusalem believers.
  - The POB lexical rationale identifies Peter’s preceding report as the referent.
  confidence: high
  alternatives_preserved:
  - these things
  - what they had heard
- pob_phrase: they became quiet
  rendering: they stopped objecting
  claim: Their silence marks the end of their objection to Peter’s actions.
  evidence:
  - The POB lexical rationale says the verb can denote ceasing objection.
  - The preceding context records their criticism of Peter.
  confidence: high
  alternatives_preserved:
  - they became quiet
  - they fell silent
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: Replacing “Gentiles” with “non-Jews” removes a traditional biblical term.
    mitigation: The POB rationale explicitly identifies non-Jews as the contextual referent.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
