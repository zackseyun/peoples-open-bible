id: PSA.108.9
reference: Psalms 108:9
source:
  edition: WLC
  text: מוֹאָ֤ב סִ֬יר רַחְצִ֗/י עַל אֱ֭דוֹם אַשְׁלִ֣יךְ נַעֲלִ֑/י עֲלֵֽי פְ֝לֶ֗שֶׁת אֶתְרוֹעָֽע׀־־׃
translation:
  text: Moab is my washbasin; on Edom I throw my sandal[a]; over Philistia I shout in triumph.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The sandal gesture suggests domination or contempt; the precise custom behind it is uncertain.
    reason: cultural_note
lexical_decisions:
- source_word: סִיר רַחְצִי
  chosen: my washbasin
  alternatives:
  - my washpot
  - my basin for washing
  lexicon: HALOT
  rationale: סִיר denotes a pot/basin, and רַחְצִי specifies washing. 'Washbasin' conveys the concrete image in clear modern English better than the traditional but archaic 'washpot.' The metaphor communicates subjugation or menial status.
- source_word: אַשְׁלִיךְ נַעֲלִי
  chosen: I throw my sandal
  alternatives:
  - I cast my shoe
  - I toss my sandal
  lexicon: HALOT
  rationale: The Hiphil of שלך means 'throw/cast.' נַעַל is footwear; 'sandal' is more natural and culturally fitting than 'shoe' in this ancient Near Eastern context. The phrase is idiomatic for dominance/claim over Edom, but the translation preserves the concrete imagery rather than paraphrasing the symbolism.
- source_word: עַל / עֲלֵי
  lemma: עַל
  chosen: on / over
  alternatives:
  - against
  lexicon: HALOT
  rationale: The preposition עַל can bear several spatial or hostile nuances. 'On Edom' fits the physical gesture of throwing the sandal, while 'over Philistia' suits the sense of exultant cry directed over a conquered people. This preserves the Hebrew imagery with readable English.
- source_word: אֶתְרוֹעָע
  chosen: I raise a shout
  alternatives:
  - I raise a war cry
  - I shout aloud
  - I cry out
  lexicon: HALOT
  rationale: The verb denotes raising or sounding a shout; its precise emotional or martial character is supplied by context rather than lexically specified.
- source_word: פְלֶשֶׁת
  chosen: Philistia
  alternatives:
  - the Philistines
  lexicon: HALOT
  rationale: The Hebrew place-name refers to the land/region, not directly the people. 'Philistia' therefore better matches the source form, though the people are implicitly in view.
- source_word: מוֹאָב / אֱדוֹם
  chosen: Moab / Edom
  lexicon: HALOT
  rationale: These are standard transliterations of the proper names and should be preserved as names rather than translated.
