  meaning_decisions:
  - source_phrase: וְאִם יִהְיֶה הַיֹּבֵל לִבְנֵי יִשְׂרָאֵל
    prior_rendering: And when the Jubilee comes for the sons of Israel
    new_rendering: Even when the Jubilee year comes for the Israelites
    rationale: The leaders’ point is that the anticipated Jubilee will not remedy this loss; 'even when' conveys its force in the argument.
  - source_phrase: וְנוֹסְפָה נַחֲלָתָן עַל נַחֲלַת הַמַּטֶּה אֲשֶׁר תִּהְיֶינָה לָהֶם
    prior_rendering: their inheritance will be added to the inheritance of the tribe to which they belong
    new_rendering: their inheritance will remain part of the inheritance of the tribe they marry into
    rationale: Following the transfer described in verse 3, the land remains attached to the receiving tribe when the Jubilee arrives; the wording avoids implying that the Jubilee itself first causes the transfer.
  - source_phrase: מִנַּחֲלַת מַטֵּה אֲבֹתֵינוּ
    prior_rendering: from the inheritance of the tribe of our fathers
