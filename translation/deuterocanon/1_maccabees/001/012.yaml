lexical_decisions:
- source_word: ἠγαύθη
  chosen: pleased
  alternatives:
  - was approved
  - seemed good
  - was delightful
  lexicon: LSJ
  rationale: The passive/aorist form here conveys that the matter was regarded favorably. In idiomatic English, 'pleased' best captures the sense of favorable reception without woodenly preserving the Greek passive.
- source_word: ὁ λόγος
  chosen: the proposal
  alternatives:
  - the word
  - the matter
  - the plan
  lexicon: LSJ
  rationale: In this context, λόγος refers not to a spoken 'word' in isolation but to the preceding suggestion or scheme. 'The proposal' makes the referent clear in natural English while staying anchored to the contextual sense of λόγος as matter/proposal.
- source_word: ἐν ὀφθαλμοῖς αὐτῶν
  chosen: them
  alternatives:
  - in their eyes
  - in their sight
  lexicon: LSJ
  rationale: The Greek idiom literally means 'in their eyes' and expresses evaluation or approval. English normally compresses this to 'pleased them'; the idiom is represented in sense rather than retained woodenly.
