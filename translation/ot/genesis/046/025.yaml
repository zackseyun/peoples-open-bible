  meaning_decisions:
  - source_phrase: בְּנֵי בִלְהָה
    prior_rendering: the sons of Bilhah
    new_rendering: the descendants of Bilhah
    rationale: The seven include Bilhah’s sons Dan and Naphtali together with their sons, not seven direct sons of Bilhah.
  - source_phrase: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב כָּל נֶפֶשׁ שִׁבְעָה
    prior_rendering: 'and she bore these to Jacob: seven persons in all'
    new_rendering: her offspring by Jacob numbered seven persons in all
    rationale: The ancestral birth formula encompasses the whole family line and should not suggest that Bilhah personally bore all seven.
