  to: which you had already heard of
  rationale: The current rendering is understandable but slightly awkward. The verb προακούω combines prior action (προ-) with hearing (ἀκούω). When the object is an abstract noun like 'hope' (ἣν referring to ἐλπίδα), English requires a preposition like 'of' or 'about'. 'You heard about before' is a bit clunky. 'You had already heard of' better captures the sense of prior reception in more polished English and fits the semi-formal register of a Bible translation.
