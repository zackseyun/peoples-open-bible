  source_fidelity: 히브리어의 반복된 조건절(אִם כֹּה יֹאמַר)과 각각에 대응하는 출산 결과는 충실히 반영되어 있습니다. 다만 야곱이 과거의 고용 조건과 그 결과를 회고하는 문맥에서, 초안의 현재형 조건절 ‘말하면’과 단회적 과거 결과 ‘낳았습니다’의 결합은 시간 관계를 다소 어색하게 만듭니다. ‘말할 때마다 … 낳곤 했습니다’는 반복적 과거의 뉘앙스를 자연스럽게 드러내면서 원문의 조건-결과 병렬도 보존합니다.
  naturalness: ‘모든 양 떼가’도 이해되지만, 집합명사인 ‘양 떼’와 출산 동사의 결합에는 ‘양 떼 모두가’가 더 자연스럽습니다. 또한 인용문 뒤의 ‘하였는데, 그러면’은 문장 연결이 무겁습니다. 직접 조건 구조로 정리하는 것이 현대 표준 한국어 합쇼체에 더 매끄럽습니다.
