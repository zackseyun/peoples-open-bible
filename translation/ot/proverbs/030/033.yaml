id: PRO.30.33
reference: Proverbs 30:33
source:
  edition: WLC
  text: כִּ֤י מִ֪יץ חָלָ֡ב י֘וֹצִ֤יא חֶמְאָ֗ה וּֽ/מִיץ אַ֭ף י֣וֹצִיא דָ֑ם וּ/מִ֥יץ אַ֝פַּ֗יִם י֣וֹצִיא רִֽיב־׃פ
translation:
  text: For just as churning milk produces butter[a] and squeezing the nose produces blood, so stirring up anger[b] produces strife.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “curds” or “thickened milk”; the Hebrew word denotes a thick milk product.
    reason: alternative_reading
  - marker: b
    text: Literally, “pressing anger”; the same word for “pressing” appears in all three clauses, and “nose” and “anger” are forms of the same Hebrew word.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Surely
  - Indeed
  lexicon: HALOT
  rationale: Introduces the explanatory ground for the preceding admonition; 'for' best preserves the causal connection in natural English.
- source_word: מִיץ
  chosen: pressing
  alternatives:
  - squeezing
  - wringing
  lexicon: HALOT
  rationale: The same noun occurs in all three clauses; repeated “pressing” preserves the lexical repetition and concrete imagery.
- source_word: חָלָב
  chosen: milk
  lexicon: HALOT
  rationale: Straightforward lexical rendering.
- source_word: יוֹצִיא
  chosen: produces
  alternatives:
  - brings forth
  - causes to come out
  lexicon: HALOT
  rationale: The Hiphil of יצא here expresses causation/result. 'Produces' is concise and idiomatic across all three clauses.
- source_word: חֶמְאָה
  chosen: butter
  alternatives:
  - curds
  - cream
  lexicon: HALOT
  rationale: “Butter” is a defensible English rendering for the broad term; the note preserves alternatives such as curds and thickened milk.
- source_word: אַף
  chosen: the nose
  alternatives:
  - nose
  - nostril
  lexicon: HALOT
  rationale: Here the concrete physical sense is required by the parallel with blood. Including the article in English makes the clause idiomatic.
- source_word: דָם
  chosen: blood
  lexicon: HALOT
  rationale: Straightforward lexical rendering.
- source_word: אַפַּיִם
  chosen: anger
  alternatives:
  - wrath
  - nostrils
  lexicon: HALOT
  rationale: Though literally 'nostrils,' the dual form is a common idiom for anger. Rendering it as 'anger' preserves the proverb's intended sense while maintaining the wordplay with the previous clause through 'pressing.'
- source_word: רִיב
  chosen: strife
  alternatives:
  - quarrel
  - contention
  lexicon: HALOT
  rationale: Denotes dispute or contention. 'Strife' is concise and proverbially fitting.
