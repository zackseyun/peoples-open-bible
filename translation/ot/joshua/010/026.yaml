  from: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
  to: After this Joshua struck them down and put them to death. He then hung their bodies on five trees[a], and they remained hanging there until evening.
  rationale: The lexical record recognizes a judicial display of bodies and appropriately avoids specifying impalement. I preserve “trees” with the serious timber alternative, but make the postmortem sequence explicit.
