  text: 그가 그들에게 말했습니다. “너희가 너희의 간구를 그분 앞에 드리려고 나를 그분께 보낸 이스라엘의 하나님 야훼께서 이렇게 말씀하십니다:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  english_pob_choice: And he said to them
  chosen_korean: 그가 그들에게 말했습니다
  alternatives_korean:
  - 그가 그들에게 이르렀습니다
  - 그가 그들에게 말씀하셨습니다
  lexicon: אמר
  rationale: 서술문은 자연스러운 현대 합쇼체로 옮기되, 뒤의 인용문 도입을 위해 중립적인 ‘말했습니다’를 택했습니다.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the LORD, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 여호와, 이스라엘의 하나님
  - 주님, 이스라엘의 하나님
  lexicon: יהוה
  rationale: 원문 고유명 יהוה를 프로젝트 기본값인 ‘야훼’로 옮겨, 영어 POB의 LORD를 직접 반영하면서도 המקור의 신명 표지를 보존했습니다.
- source_word: לְהַפִּיל תְּחִנַּתְכֶם לְפָנָיו
  english_pob_choice: to lay your plea before him
  chosen_korean: 그의 앞에 너희의 간구를 드리게 한 분이십니다
  alternatives_korean:
  - 그의 앞에 너희의 간구를 내놓게 한 분이십니다
  - 그의 앞에 너희의 간청을 올리게 한 분이십니다
  lexicon: תחנה
  rationale: ‘간구’를 유지해 탄원을 뜻하는 어감을 살리고, ‘드리다’로 히브리어의 ‘앞에 던져 놓다/내어놓다’라는 동작 이미지를 지나치게 평탄화하지 않도록 했습니다.
theological_decisions:
- issue: 하나님 호칭에서 יהוה의 처리
  chosen_reading: 본문의 יהוה는 ‘야훼’로 표기하고, 그 뒤에 ‘이스라엘의 하나님’을 덧붙여 예언자적 신탁의 권위를 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 예언 공식 ‘야훼, 이스라엘의 하나님께서 말씀하십니다’를 직접 담고 있으므로, 전통적 완곡어보다 원문 고유 신명과 언약적 식별을 우선했습니다.
  doctrine_reference: 출 3:15; 렘 42:9
