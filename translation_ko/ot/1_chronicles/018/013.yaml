  text: He placed garrisons in Edom, and all Edom became slaves to David. And the LORD gave David victory wherever he went.
translation:
  language: ko
  text: 그는 에돔에 수비대를 배치하였고, 온 에돔은 다윗의 종이 되었습니다. 야훼께서 다윗이 가는 곳마다 그를 구원하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצִיבִים
  english_pob_choice: garrisons
  chosen_korean: 수비대
  alternatives_korean:
  - 주둔군
  - 주둔대
  lexicon: 불특정 군사 주둔을 가리키는 일반 명사
  rationale: 문맥상 에돔에 배치된 군사 주둔을 자연스럽게 드러내면서도 과도하게 해석하지 않는 표준어 표현으로 옮겼습니다.
- source_word: עֲבָדִים
  english_pob_choice: slaves
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: 종
  rationale: 영어 POB가 "slaves"로 확정한 본문이지만, 한국어에서는 왕에게 예속된 신하적 종속을 드러내면서도 본문의 강한 종속성을 유지하기 위해 "종"을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 히브리어 원문 고유명사에 맞추어 프로젝트 기본값인 "야훼"를 사용했습니다.
- source_word: הָלַךְ
  english_pob_choice: went
  chosen_korean: 가는 곳마다
  alternatives_korean:
  - 가는 대로
  - 어디를 가든지
  lexicon: הלך
  rationale: 단순 이동이 아니라 다윗의 모든 행로와 상황 전반을 포괄하는 관용적 의미를 살리기 위해 이렇게 옮겼습니다.
theological_decisions:
- issue: יְהוָה가 다윗에게 주시는 결과를 어떻게 표현할지
  chosen_reading: '"구원하셨습니다"로 옮겨, 단순한 성공이 아니라 야훼의 적극적 구원 행위를 드러냈습니다.'
  alternative_readings:
  - '"이기게 하셨습니다"'
  - '"승리를 주셨습니다"'
  rationale: 히브리어 וַיּוֹשַׁע는 문자적으로 "구원하다"이며, 전투 맥락에서 그 결과가 승리로 나타나지만 원어의 더 넓은 구원 행위를 보존하는 것이 좋습니다.
  doctrine_reference: 구원/승리의 이중 의미 보존
