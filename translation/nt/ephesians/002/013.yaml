  - 'mediated means: ''through the blood of the Messiah'''
  rationale: The phrase refers to the means by which those formerly far away are brought near, namely the sacrificial death of the Messiah. Rendering it instrumentally communicates the theological point without importing a more developed atonement theory than the text itself states.
