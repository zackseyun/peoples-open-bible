translation:
  text: 'I went toward it and looked at seven magnificent mountains, each different from another, with precious,
    beautiful stones. Their appearance was altogether splendid and glorious, and their faces were beautiful: three
    toward the east, firmly set one upon another, and three toward the south, one upon another. There were deep,
    winding valleys, which did not come close to one another.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Here ሰሜን has the older Geʽez sense south, not the later north: Dillmann1865 col334 gives plaga australis,
      meridies and explicitly contrasts the later reversal. The repeated one-upon-another construction and valleys
      are retained rather than supplied with a modern geographical arrangement.'
    reason: lexical_alternative
