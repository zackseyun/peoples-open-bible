translation:
  text: Reuben replied, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now we are being called to account for his blood[a].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: To be called to account for someone's blood is to be held responsible for that person's death.
    reason: cultural_note
