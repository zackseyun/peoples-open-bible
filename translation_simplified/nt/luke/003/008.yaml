translation:
  language: en
  text: So produce fruits that show your reorientation toward God[b] is real. Do not start saying among yourselves,[a] ‘Abraham is our father.’ For I tell you, God can raise up children for Abraham from these stones.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “to yourselves” or “within yourselves.”
    reason: lexical_alternative
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: do not begin to say among yourselves
  simplified_phrase: Do not start saying among yourselves
  preserved_meaning: They must not even begin appealing to their shared ancestry.
  reasoning_layer_used: Lexical decision on μὴ ἄρξησθε λέγειν and ἐν ἑαυτοῖς
  rationale: “Start saying” is more natural while the footnote preserves the phrase’s ambiguity.
- pob_phrase: God is able to raise up children for Abraham from these stones
  simplified_phrase: God can raise up children for Abraham from these stones
  preserved_meaning: God has power to provide Abrahamic children apart from presumed physical descent.
  reasoning_layer_used: Lexical and theological decisions on δύναται, ἐγεῖραι, and Abrahamic descent
  rationale: “Can” makes the statement direct without weakening God’s power or the stone image.
interpretive_expansions:
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
