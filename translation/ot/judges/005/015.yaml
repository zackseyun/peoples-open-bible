  category: meaning_retranslation
  from: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
  to: The princes of Issachar were with Deborah; Issachar was likewise with Barak; they were sent into the valley close behind him. Among Reuben's divisions[a] there were great resolutions of heart[b].
  rationale: The earlier 'searchings' captures hesitation but erases the distinction between this verse's חִקְקֵי and verse 16's חִקְרֵי. I restore that distinction and translate 'at his feet' by its documented sense of following closely.
