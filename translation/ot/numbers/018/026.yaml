  - source_phrase: וַהֲרֵמֹתֶם מִמֶּנּוּ תְּרוּמַת יְהוָה מַעֲשֵׂר מִן הַמַּעֲשֵׂר
    prior_rendering: then you shall present from it Yahweh’s contribution, a tithe from the tithe
