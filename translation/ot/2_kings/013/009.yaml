  from: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
  to: Jehoahaz died[a] and was buried in Samaria. His son Joash succeeded him as king.
  rationale: The lexical record identifies the death formula and already recognizes the danger of a misleading English expression. I carry that clarification further by stating the death directly while retaining the ancestral image in a footnote.
