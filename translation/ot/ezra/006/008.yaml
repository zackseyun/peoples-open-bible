id: EZR.6.8
reference: Ezra 6:8
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ לְ/מָ֣א דִֽי תַֽעַבְד֗וּן עִם שָׂבֵ֤י יְהוּדָיֵ/א֙ אִלֵּ֔ךְ לְ/מִבְנֵ֖א בֵּית אֱלָהָ֣/א דֵ֑ךְ וּ/מִ/נִּכְסֵ֣י מַלְכָּ֗/א דִּ֚י מִדַּת֙ עֲבַ֣ר נַהֲרָ֔/ה אָסְפַּ֗רְנָא נִפְקְתָ֛/א תֶּהֱוֵ֧א מִֽתְיַהֲבָ֛א לְ/גֻבְרַיָּ֥/א אִלֵּ֖ךְ דִּי לָ֥א לְ/בַטָּלָֽא־־־־׃
translation:
  text: 'Moreover, I issue a decree concerning what you are to do for these Jewish elders as they rebuild this house of God: Their expenses are to be paid promptly from the royal revenues—the tribute collected in Beyond the River—so that the work is not interrupted.'
  philosophy: dynamic
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  chosen: Moreover, I issue a decree
  alternatives:
  - Moreover, a decree is issued by me
  - I hereby decree
  lexicon: HALOT
  rationale: The Aramaic idiom literally sets or establishes an official decision. Active English preserves the royal speaker and the decree's administrative force.
- source_word: שָׂבֵי יְהוּדָיֵא אִלֵּךְ
  chosen: these Jewish elders
  alternatives:
  - these elders of the Jews
  lexicon: HALOT
  rationale: The phrase identifies the Judean community leaders. 'These Jewish elders' is concise and natural.
- source_word: לְמִבְנֵא בֵּית אֱלָהָא דֵךְ
  chosen: as they rebuild this house of God
  alternatives:
  - in building this house of God
  - for rebuilding this temple of God
  lexicon: HALOT
  rationale: דֵךְ is the demonstrative 'this,' not a possessive 'your.' The infinitive describes the elders' rebuilding work.
- source_word: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה
  chosen: from the royal revenues—the tribute collected in Beyond the River
  alternatives:
  - from the king’s assets, namely the tribute of Beyond the River
  - from the royal treasury, from the tribute of Beyond the River
  lexicon: HALOT
  rationale: מִדַּת denotes tribute or tax, not a province. The tribute from the trans-Euphrates territory is the fiscal source of the royal payment.
- source_word: אָסְפַּרְנָא
  chosen: promptly
  alternatives:
  - diligently
  - with all care
  - exactly
  lexicon: HALOT
  rationale: The administrative loanword emphasizes expeditious, careful execution. In this payment context 'promptly' is the clearest restrained equivalent.
- source_word: נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ
  chosen: Their expenses are to be paid
  alternatives:
  - The expenses shall be given to these men
  - Their costs must be provided
  lexicon: HALOT
  rationale: The passive construction requires the project expenses to be supplied to the elders. The pronoun avoids repeating 'these men' in English.
- source_word: דִּי לָא לְבַטָּלָא
  chosen: so that the work is not interrupted
  alternatives:
  - so that there is no interruption
  - so that they are not hindered
  lexicon: HALOT
  rationale: The purpose clause prevents stoppage. Supplying 'the work' makes the unstated contextual object clear without assigning the infinitive an explicit plural subject.
