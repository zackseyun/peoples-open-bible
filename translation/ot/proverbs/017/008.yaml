id: PRO.17.8
reference: Proverbs 17:8
source:
  edition: WLC
  text: אֶֽבֶן חֵ֣ן הַ֭/שֹּׁחַד בְּ/עֵינֵ֣י בְעָלָ֑י/ו אֶֽל כָּל אֲשֶׁ֖ר יִפְנֶ֣ה יַשְׂכִּֽיל־־־׃
translation:
  text: To its owner, a bribe is a stone that brings favor[a]; wherever he turns, he succeeds.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “a stone of favor”; the expression may evoke a precious stone or a charm believed to bring favor.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן חֵן
  chosen: a stone that brings favor
  alternatives:
  - a precious stone
  - a stone of favor
  - a magic stone
  - a lucky charm
  lexicon: HALOT
  rationale: This retains both the stone image and the association with favor without defining the object more precisely than the Hebrew permits.
- source_word: הַשֹּׁחַד
  chosen: a bribe
  alternatives:
  - a gift
  lexicon: HALOT
  rationale: The noun commonly denotes a bribe rather than a neutral gift. In wisdom literature it often carries a morally negative sense. 'Gift' is possible in some contexts, but here the standard sense 'bribe' best fits the proverb's realism about corrupt advantage.
- source_word: בְּעֵינֵי
  chosen: in the eyes of
  alternatives:
  - in the view of
  - to
  lexicon: HALOT
  rationale: This Hebrew idiom expresses perspective or estimation. 'In the eyes of' is a natural and transparent English equivalent that preserves the metaphor.
- source_word: בְעָלָיו
  chosen: its owner
  alternatives:
  - its master
  - the one who possesses it
  lexicon: HALOT
  rationale: The suffix refers back to the bribe as possessed by the giver/holder. 'Owner' is idiomatic English and avoids overreading social hierarchy implied by 'master'.
- source_word: אֶל כָּל אֲשֶׁר יִפְנֶה
  chosen: wherever he turns
  alternatives:
  - to every place he turns
  - in every direction he turns
  lexicon: HALOT
  rationale: This clause is an idiomatic way of expressing any direction or undertaking. 'Wherever he turns' is concise and natural while preserving the broad scope.
- source_word: יַשְׂכִּיל
  chosen: he succeeds
  alternatives:
  - he succeeds
  - he acts wisely
  - he has success
  lexicon: HALOT
  rationale: Here the verb concerns the practical effectiveness attributed to the bribe rather than moral wisdom.
- source_word: בְּעֵינֵי בְעָלָיו
  chosen: to its owner
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This idiomatically conveys the possessor’s perspective.
