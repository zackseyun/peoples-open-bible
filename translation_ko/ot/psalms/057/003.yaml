base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/003.yaml
  text: He will send from heaven and save me; he reproaches the one who pants after me.[a] Selah. God will send his steadfast love and his faithfulness.
  footnotes:
  - marker: a
    text: Or, 'to God who completes what concerns me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 하늘에서 보내시고 나를 구원하실 것입니다.[a] 나를 헐떡이며 뒤쫓는 자를 꾸짖으실 것입니다.[b] 셀라. 하나님께서 자신의 한결같은 사랑과 신실하심을 보내실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 헐떡이며 뒤쫓는 자가 나를 헐뜯습니다.’ 히브리어의 압축된 구문은 이 절의 주어 연결을 달리 이해할 여지를 둡니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘나를 헐떡이며 뒤쫓는 자’입니다. ‘나를 추격하는 자’ 또는 문맥상 ‘나를 삼키려 하는 자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקְרָא
  english_pob_choice: I call
  chosen_korean: 부르짖습니다
  alternatives_korean:
  - 부릅니다
  - 외칩니다
  - 호소합니다
  lexicon: HALOT
  rationale: 시편의 시적 문맥에서 단순한 ‘부름’보다 하나님께 향한 간절한 호소의 뉘앙스를 살리되, 원문이 허용하는 범위를 넘지 않도록 ‘부르짖습니다’로 옮겼습니다.
- source_word: עֶלְיוֹן
  english_pob_choice: Most High
  chosen_korean: 지극히 높으신
  alternatives_korean:
  - 가장 높으신
  - 지존하신
  - 가장 높으신 분
  lexicon: HALOT
  rationale: ‘Most High’의 통상적 신칭을 한국어에서 자연스럽게 풀어 ‘지극히 높으신’으로 옮겨, ‘하나님’의 수식어로 읽히게 했습니다.
- source_word: גֹּמֵר עָלָי
  english_pob_choice: who fulfills his purpose for me
  chosen_korean: 나를 위해 일들을 이루시는
  alternatives_korean:
  - 나와 관련된 것을 완성하시는
  - 나를 위해 완성하시는
  - 나에게 관한 것을 끝맺으시는
  lexicon: HALOT
  rationale: גמר는 ‘완성하다, 끝내다’의 뜻이지만 עָלַי와 결합한 관용적 표현으로서 ‘나를 위해/나에 관하여 이루다’라는 의미가 되므로, POB의 해석을 따라 자연스럽게 ‘나를 위해 일들을 이루시는’으로 옮겼습니다.
- source_word: עָלָי
  english_pob_choice: for me
  chosen_korean: 나를 위해
  alternatives_korean:
  - 나에 관하여
  - 내게
  - 내 위에
  lexicon: HALOT
  rationale: 전치사 עַל의 여기서는 목적·관계의 뉘앙스를 살려, 한국어에서 가장 자연스러운 ‘나를 위해’로 처리했습니다.
theological_decisions:
- issue: גֹמֵר עָלָי의 의미 범위
  chosen_reading: 하나님이 시편 화자를 위해 그분의 일들을 이루시고 완성하시는 분이라는 뜻으로 읽었습니다.
  alternative_readings:
  - 하나님이 내게 관한 것을 완성하신다
  - 하나님이 내 일을 끝맺으신다
  - 하나님이 내게 은혜를 베푸신다
  rationale: 히브리어는 단순히 ‘모든 일을 해 주신다’보다, 화자와 관련된 일을 하나님이 이루어 가신다는 뜻을 담고 있습니다. 한국어에서는 그 의미를 살리되 과도한 해석을 피하기 위해 ‘일들을 이루시는’으로 표현했습니다.
  doctrine_reference: Translation philosophy §1, §5, §6
