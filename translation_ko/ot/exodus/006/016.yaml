  lexicon: 고유명사 표기
  rationale: 성서 인명은 현대 외래어 표기와 통용형을 우선해 한국어 독자에게 익숙한 형태를 채택했습니다.
- source_word: וּשְׁנֵי חַיֵּי לֵוִי ... שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  english_pob_choice: the years of Levi’s life were one hundred thirty-seven years
  chosen_korean: 레위가 산 햇수는 백서른일곱 해였습니다
  alternatives_korean:
