  naturalness: ‘개들이 나를 에워쌌고, 악을 행하는 무리가 나를 둘러쌌습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 마지막 구절은 히브리어 자체가 동사 없이 난해하므로, 이해를 위해 ‘공격합니다’ 등 동사를 보충하지 않고 파편적인 구문을 유지했습니다.
