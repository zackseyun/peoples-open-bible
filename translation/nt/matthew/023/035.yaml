  from: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
  to: so that all the righteous blood shed on the earth may come upon you[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
  rationale: The inverted word order 'upon you may come [subject]' is unnatural in English. Placing the subject before the verb ('all the righteous blood... may come upon you') or using an expletive ('there may come upon you all the righteous blood') improves readability while maintaining optimal equivalence. While ἐκχυννόμενον is a present participle, translating it with the progressive 'being poured out' clashes awkwardly with the historical scope of the verse (from Abel to Zechariah). The present participle here denotes a characteristic or general truth rather than a strictly continuous present action. 'Shed' (or 'poured out') is more natural and contextually accurate.
