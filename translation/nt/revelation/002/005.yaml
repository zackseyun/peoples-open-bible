theological_decisions:
- issue: Nature of the warning about the lampstand
  chosen_reading: Retain the symbolic image of removing the church's lampstand without explicating it as loss of salvation or merely loss of witness.
  alternative_readings:
  - loss of corporate witness
  - judgment on the church's existence/status
  - loss of salvation
  rationale: The immediate context in Revelation identifies lampstands as churches (Rev 1:20). The verse threatens judgment on the church's standing/place, but the text itself does not specify a systematic-theological conclusion about individual salvation. The translation therefore preserves the image and tension rather than resolving it.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: Context-sensitive reorientation terminology
  chosen_reading: Therefore remember from where you have fallen[a], and reorient toward God, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you reorient toward God.
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
