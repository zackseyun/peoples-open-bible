id: PSA.102.23
reference: Psalms 102:23
source:
  edition: WLC
  text: עִנָּ֖ה בַ/דֶּ֥רֶךְ כח/ו קִצַּ֥ר יָמָֽ/י׃
translation:
  text: He weakened my strength[a] along life’s journey[b]; he shortened my days.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Masoretic reading tradition has “my strength”; the written Hebrew text has “his strength.”
    reason: textual_variant
  - marker: b
    text: Literally, “on the way.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנָּה
  chosen: weakened
  alternatives:
  - humbled
  - weakened
  - afflicted
  lexicon: HALOT
  rationale: With 'strength' as object, the Piel means to weaken or break it; English does not naturally 'afflict strength.'
- source_word: בַדֶּרֶךְ
  chosen: on the way
  alternatives:
  - in the course of life
  - along the journey
  lexicon: HALOT
  rationale: Literally 'in/on the way.' In context it likely refers metaphorically to the course of life, but the Hebrew image is straightforward and should be preserved in the main text.
- source_word: כחו
  chosen: my strength
  alternatives:
  - my strength
  - his strength
  lexicon: HALOT
  rationale: The Qere reads 'my strength,' fitting the surrounding first-person context; the Ketiv 'his strength' is noted.
- source_word: קִצַּר
  chosen: shortened
  alternatives:
  - cut short
  lexicon: HALOT
  rationale: The verb קצר means to shorten or cut short. 'Shortened' is clear modern English and fits the poetic parallelism.
- source_word: יָמָי
  chosen: my days
  lexicon: HALOT
  rationale: Straightforward construct with first person suffix; the psalmist speaks of the shortening of his lifespan.
