  text: καὶ νῦν ἐξακολουθοῦμεν ἐν ὅλῃ καρδίᾳ ἡμῶν καὶ φοβούμεθά σε καὶ ζητοῦμεν τὸ πρόσωπόν σου.
  language: Greek
  pages: []
