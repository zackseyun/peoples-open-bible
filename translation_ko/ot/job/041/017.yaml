  - severity: low
    issue: ‘혼란에 빠집니다’는 יִתְחַטָּאוּ가 암시하는 갈피를 잃는 혼미를 다소 평평하게 만듭니다.
    rationale: ‘갈피를 잡지 못합니다’는 영어 감사본의 ‘beside themselves’ 및 문맥상 당혹을 더 잘 보존하면서도 과도하게 ‘정신을 잃다’로 강화하지 않습니다.
