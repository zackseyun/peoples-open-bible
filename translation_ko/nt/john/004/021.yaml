  - severity: low
    issue: ‘때’의 중복
    rationale: ‘때가 오나니 … 예배하지 아니할 때가 오리다’는 하나의 ἔρχεται ὥρα를 두 번 표현합니다. 한국어에서는 ‘… 예배하지 않을 때가 옵니다’로 한 번만 표현하는 것이 정확하고 자연스럽습니다.
