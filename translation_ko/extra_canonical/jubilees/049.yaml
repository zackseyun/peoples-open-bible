- from: '1[2a]. 유월절에 관하여 주님께서 너희에게 명령하신 명령을 기억하여 정한 때 곧 첫째 달 십사일에 지키라 저녁이 되기 전에 그것을 잡아서 먹도록 하라. 2. 밤, 열다섯째 저녁, 해가 지는 곳에서. 이 밤에 잔치의 시작이 이르렀고 기쁨의 시작이 이르렀느니라. 너희는 애굽에 거주하며 유월절을 먹으며 그 때에 마스테마의 모든 권세가 보내어 애굽 땅의 모든 처음 난 것 곧 바로의 장자로부터 물방앗간에 있는 포로 된 여종의 장자까지와 가축 떼를 치려고 보내심을 받았느니라. 주님께서 그들에게 주신 표징은 이러하니라 집마다 문설주에 바른 일 년 된 어린 양의 피를 보면 그 집에 들어가서 죽이지 말고 그냥 지나쳐 그 집에 있는 모든 사람을 구원하라 하였으니 이는 그 피의 표가 문설주에 있었음이라. 주님의 권능이 주님께서 그들에게 명령하신 대로 다 행하사 그들이 이스라엘 모든 자손을 다 덮었으므로 그들에게 임한 재앙이 그들 가운데서 가축으로부터 사람과 개까지 다 멸하지 아니하였더라. 애굽에 염병이 심히 심하여 애굽에 애통하며 애통하며 죽지 아니한 집이 하나도 없었더라 그러나 온 이스라엘은 거하여 유월절 고기를 먹고 포도주를 마시며 그 열조의 하나님 주님께 찬양과 찬송과 감사를 드리면서 애굽의 멍에와 악한 속박에서 벗어나기를 준비하였더라. 그리고 너도 네 평생에 이 날을 기억하고, 해마다 네 평생 동안, 그 모든 율법에 따라 매년 한 번씩 그 날에 지키라. 그리고 날을 날마다, 달에서 달로 옮기지 마십시오. 이는 영원한 규례니 이스라엘 자손이 다 하늘 판에 기록하고 정한 것이니 그들은 매년, 해마다, 그 날에, 매년 한 번씩 대대로 지킬지니라. 그리고 날에는 끝이 없습니다. 이는 영원히 정해졌음이니라. 그리고 정결한 사람이 그 날에 이를 지키러 와서 주님 앞에 기쁘게 예물을 드리며 절기의 날에 주님 앞에서 먹고 마시는 사람이라도 그 정결하고 가까이 하는 사람이 그 정한 시기에 주님의 제물을 가져오지 아니하므로 이를 등한히 하면 그 사람은 그 죄를 담당할 것이니라
    그러므로 이스라엘 자손은 정한 날 곧 첫째 달 십사일 저녁 사이 곧 낮 삼분의 일부터 밤의 삼분의 일까지 와서 유월절을 지킬 것이요 낮의 두 부분은 빛에 주어지고, 세 번째 부분은 저녁에 주어지기 때문입니다. 이는 주님께서 한밤중에 지키라 너희에게 명령하신 것이니라 저녁 때를 제외하고는 빛이 있는 동안에는 그것을 잡지 말며, 저녁 때부터 밤의 삼분의 일까지 그것을 먹어야 한다. 그리고 밤의 삼분의 일 이후에 그 고기가 남아 있는 것은 모두 불에 태워야 한다. 날로 먹어도 안 되고 물에 삶아 먹어도 안 된다. 다만 머리와 내장과 발을 불에 구워 먹어야 한다. 그러면 그 뼈가 하나도 꺾이지 아니하리니 이는 이스라엘 자손의 뼈가 꺾이지 아니함이라. 그러므로 주님께서 이스라엘 자손에게 명하여 유월절을 그 정한 날에 지키고 뼈를 하나도 꺾지 말라 이는 절기요 명한 날임이니라. 그 날에서 다른 날로, 또는 달에서 달로 옮기지 말고 오직 절기의 날에 지킬 것이니라. 그리고 너는 이스라엘 자손에게 명령하여 그들의 시대, 매년, 매년 한 번씩, 그 정해진 날에 유월절을 지키도록 하여라. 이는 주님 앞에 기쁘게 받으실 기념이 될 것이요 유월절을 지키는 그 해에는 살륙으로 인한 재앙이 그들에게 임하지 아니할 것이요

    16. 정한 때에 모든 일에 그 명대로 하라. 주님의 성소 밖에서는 먹지 못하고 오직 주님의 성소 앞에서와 온 회중이 그것을 먹음이니라

    17. 이스라엘 자손은 그 정한 기한에 이를 지킬지니라 그 날에 온 이십세 이상으로 무릇 네 하나님의 성소 주님 앞에서 그것을 먹을지니 이는

    18. 이와 같이 주님의 성소에서 먹으라 하였느니라 이스라엘 자손이 가나안 땅 그들이 차지할 땅에 들어가서 그들의 한 지파대로 그 땅 가운데 주님의 장막을 세울 때 그 땅에 주님의 성소가 건축될 때까지 그들이 와서 주님의 장막 가운데서 유월절을 지키고 주님 앞에서 잡을지니라

    19. 해마다. 자기 기업의 땅에 주님의 이름으로 집을 건축하는 날 저녁 해질 때에 그리로 와서 유월절 양을 잡을 것이요

    20. 오늘의 세 번째 부분에. 그 피를 제단 문지방에 가져가고 그 기름을 제단 위 불에 뿌리고 그 고기를 전 뜰에서 불에 구워 먹을지니라

    21. 이것은 주님의 이름으로 거룩하게 된 것입니다. 그리고 그들은 그들의 성읍에서나 주님의 장막 앞과 그의 이름이 계시는 그의 집 앞 외에는 어느 곳에서도 유월절을 지킬 수 없느니라. 그러면 그들은 주님를 따라 그릇된 길로 가지 않을 것입니다. 22. 그리고 모세야, 너는 이스라엘 자손에게 명령하여, 너에게 명령한 대로 유월절 규례를 지키도록 하여라. 해마다, 날마다, 무교병의 절기를 그들에게 명하여 칠 일 동안 무교병을 먹고 그 절기를 지키며 그 칠 일 동안 날마다 제물을 가져오라고 명하라

    23. 주님 앞 곧 네 하나님의 제단 위에라. 이 절기는 너희가 애굽에서 나올 때에 수르 광야에 들어갈 때까지 속히 지키니 이는 바닷가에서 이를 마치셨음이니라'
  to: '1. 유월절에 관하여 야훼께서 네게 명령하신 명령을 기억하십시오. 곧 정해진 때인 첫째 달 열넷째 날에 그것을 지키고, 저녁 전에 그것을 잡아 그들이 그것을 먹도록 하십시오.

    2. 밤, 곧 해가 진 뒤 열다섯째 날 저녁이었습니다. 그 밤에 절기가 시작되었고 즐거움도 시작되었습니다. 여러분은 이집트에 머물며 유월절을 먹고 있었고, 마스테마의 모든 세력이 이집트 땅의 모든 처음 난 것을 치도록 보내졌습니다. 바로의 처음 난 것부터 맷돌집에 있던 사로잡힌 여종의 처음 난 것까지, 또 가축까지였습니다. 주님께서 그들에게 주신 표는 이러했습니다. 문설주에 한 살 된 어린양의 피가 보이는 집에는 그들이 들어가 죽이지 말고 그 집을 지나쳐, 그 집 안에 있는 모든 사람이 구원을 받게 해야 했습니다. 피의 표가 그 집의 문설주에 있었기 때문입니다. 주님의 세력은 주님께서 명령하신 대로 모든 것을 행했습니다. 그들은 이스라엘의 모든 자손을 지나쳐 갔으며, 가축에서 사람에 이르기까지, 심지어 개에 이르기까지 그들 가운데 어떤 생명도 멸하려는 재앙이 닥치지 않았습니다. 이집트의 재앙은 매우 컸습니다. 이집트에는 죽은 사람이 없는 집이 하나도 없었고, 애곡과 통곡이 있었습니다. 그러나 온 이스라엘은 유월절 고기를 먹고 포도주를 마시며, 주님 곧 그들의 조상의 하나님을 찬양하고 찬송하며 감사드리고 있었습니다. 그들은 이집트의 멍에와 악한 종살이에서 벗어날 준비가 되어 있었습니다.


    여러분도 평생 이 날을 기억하고, 해마다 그 날에 그 모든 율법에 따라 매년 한 번씩 지키십시오. 그 날을 이 날에서 저 날로, 이 달에서 저 달로 옮기지 마십시오. 이것은 영원한 규례이며, 이스라엘의 모든 자손이 모든 세대에 걸쳐 해마다 그 날에 매년 한 번씩 지키도록 하늘의 돌판들에 기록되고 명령된 것입니다. 그 끝이 없으니, 이것은 영원히 정해진 규례입니다. 정결한 사람이 그 날에 와서 주님 앞에 받아들여질 제물을 드리고, 그 절기 날에 주님 앞에서 먹고 마시려 할 때, 그 사람이 정결하고 가까이 있음에도 정한 때에 주님의 제물을 드리지 않았다면, 그는 끊어질 것입니다. 그는 자기 죄를 짊어질 것입니다.


    그러므로 이스라엘 자손은 정해진 때에, 곧 첫째 달 열나흗날 두 저녁 사이, 낮의 중간부터 밤의 셋째 부분까지 유월절을 지켜야 합니다. 낮의 두 부분은 빛에 주어지고, 한 부분은 저녁에 속하기 때문입니다. 이것이 주님께서 여러분에게 저녁 한가운데 지키라고 명령하신 것입니다. 밝은 동안에는 저녁 때 외에는 그것을 잡아서는 안 되며, 저녁 때부터 밤의 셋째 부분까지 그것을 먹어야 합니다. 밤의 셋째 부분 뒤에 남은 고기는 모두 불에 태워야 합니다. 그것을 날것으로 먹어서도 안 되고 물에 삶아 먹어서도 안 되며, 불에 구워 먹어야 합니다. 머리와 내장과 발을 함께 불에 구워야 하며, 그것의 뼈를 하나도 꺾어서는 안 됩니다. 이스라엘 자손 가운데서는 어떤 뼈도 부서져서는 안 되기 때문입니다. 그러므로 주님께서는 이스라엘 자손에게 정해진 때에 유월절을 지키라고 명령하셨고, 그것에서 뼈를 하나도 꺾어서는 안 된다고 하셨습니다. 이는 그 날이 절기의 날이며 명령된 날이기 때문입니다. 그 날을 이 날에서 저 날로, 이 달에서 저 달로 옮겨서는 안 되며, 절기의 날에 지켜야 합니다. 여러분은 이스라엘 자손에게 명령하여, 해마다 정해진 때에 매년 한 번씩 유월절을 지키게 하십시오. 그러면 그것은 주님 앞에 기쁘게 받아들여질 기념이 될 것이며, 그들이 유월절을 지키는 그 해에는 죽이거나 치는 재앙이 그들에게 닥치지 않을 것입니다.

    16. 정해진 때에, 그 명령대로 모든 점에서 해야 합니다. 또한 그것을 야훼의 성소 밖에서 먹는 것은 허용되지 않으며, 오히려 야훼의 성소 앞에서 먹어야 합니다. 그리고 회중의 모든 백성은—

    17. 온 이스라엘은 정해진 때에 그것을 지켜야 합니다. 그리고 그 날에 오는 모든 사람, 곧 스무 살 이상인 사람은 너희 하나님의 성소의 집에서 주님 앞에 그것을 먹어야 합니다. 왜냐하면

    18. 이와 같이 그들이 그것을 주님의 성소에서 먹도록 기록되고 제정되었습니다. 이스라엘 자손이 차지하게 될 땅, 곧 가나안 땅에 들어가 그 땅 한가운데, 그들의 지파들 가운데 하나에 주님의 장막을 세우고, 주님의 성소가 그 땅에 세워질 때까지 그들이 와서 주님의 장막 한가운데에서 유월절을 지키며, 주님 앞에서 그것을 잡아야 합니다.

    19. 해마다. 그리고 야훼의 이름으로 그들의 기업의 땅에 성전이 세워지는 날들에는, 그들은 그곳으로 가서 저녁, 해가 질 무렵에 유월절 제물을 잡을 것입니다.

    20. 하루의 세 번째 부분에 그들은 그 피를 제단 밑에 가져오고, 그 기름을 제단 위에 있는 불에 올려놓으며, 그 고기를 불에 구워 집의 뜰에서 먹어야 합니다.

    21. 그것은 야훼의 이름으로 성별된 것입니다. 그들은 자기들의 도시에서나 다른 어느 곳에서나, 야훼의 장막 앞 또는 그분이 거하시는 집 앞에서가 아니면 유월절을 지킬 수 없습니다.

    22. 그리고 너, 모세여, 이스라엘 자손에게 네게 명령된 대로 유월절 규례를 지키라고 명하여라. 해마다, 날마다, 또 무교절에 관하여 그들에게 일러라. 그들이 이레 동안 무교병을 먹고 그 절기를 지키며, 그 기쁨의 이레 동안 날마다 제물을 드리게 하여라.

    23. 주님 앞에서, 여러분의 하나님 제단 위에서. 이는 여러분이 이집트에서 나와 수르 광야에 들어갈 때까지 이 절기를 서둘러 지켰고, 바닷가에서 그 절기를 마쳤기 때문입니다.'
