  from: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
  to: Then Shem and Japheth took the cloak and laid it across their shoulders. They walked backward and covered their father's nakedness. Their faces were turned away, so they did not see their father's nakedness.
  rationale: The lexical record supports both “cloak” and “faces were turned away,” though earlier choices favored closer verbal repetition. I retain the repeated references to the father's nakedness while clarifying the physical actions, which strongly support literal bodily exposure here.
