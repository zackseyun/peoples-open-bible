id: PSA.147.6
reference: Psalms 147:6
source:
  edition: WLC
  text: מְעוֹדֵ֣ד עֲנָוִ֣ים יְהוָ֑ה מַשְׁפִּ֖יל רְשָׁעִ֣ים עֲדֵי אָֽרֶץ־׃
translation:
  text: Yahweh supports the humble[a]; he brings the wicked down to the ground.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “the afflicted.”
    reason: alternative_reading
lexical_decisions:
- source_word: מְעוֹדֵד
  chosen: supports
  alternatives:
  - supports
  - sustains
  - encourages
  lexicon: HALOT
  rationale: The participle means to support, sustain, or strengthen; it does not itself mean to raise vertically.
- source_word: עֲנָוִים
  chosen: the humble
  alternatives:
  - the afflicted
  - the meek
  lexicon: HALOT
  rationale: ענוים can denote the humble/meek and often overlaps with the afflicted lowly. Here 'the humble' best fits the moral-social contrast with 'the wicked' and is clear modern English.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: מַשְׁפִּיל
  chosen: brings ... down
  alternatives:
  - humbles
  - casts down
  - lowers
  lexicon: HALOT
  rationale: The Hiphil participle of שׁפל means to make low or abase. 'Brings ... down' preserves the active causative sense and forms a strong antithesis with 'lifts up.'
- source_word: רְשָׁעִים
  chosen: the wicked
  alternatives:
  - wicked people
  - the guilty
  lexicon: HALOT
  rationale: A standard rendering for רשעים in Psalms; it preserves the ethical category without unnecessary expansion.
- source_word: עֲדֵי אָרֶץ
  chosen: to the ground
  alternatives:
  - to the earth
  - all the way to the earth
  lexicon: HALOT
  rationale: 'The phrase intensifies the lowering: ''as far as the earth/ground.'' ''To the ground'' is idiomatic English and preserves the image of being brought low to the dust/earth level.'
