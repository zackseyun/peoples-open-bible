  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: ko
  text: 그가 돌아서서 그들을 보고 야훼의 이름으로 그들을 저주했습니다. 그러자 암곰 두 마리가 숲에서 나와 그 아이들 중 마흔두 명을 물어뜯었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַלְלֵם
  english_pob_choice: he cursed them
  chosen_korean: 그들을 저주했습니다
  alternatives_korean:
  - 그들에게 저주를 퍼부었습니다
  - 그들을 저주하였습니다
  lexicon: ק־ל־ל
  rationale: 히브리어 동사는 단순한 욕설보다 공적 저주를 뜻하므로, 한국어도 직역에 가까운 ‘저주했습니다’로 옮겼습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of the LORD
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 주의 이름으로
  - 여호와의 이름으로
  lexicon: יְהוָה
  rationale: 원어의 신명사 표기 야훼를 프로젝트 기본값에 따라 반영했습니다. 영어 POB의 LORD는 이 절의 מקור 텍스트상 יהוה를 가리킵니다.
- source_word: שְׁתַּיִם דֻּבִּים
  english_pob_choice: two she-bears
  chosen_korean: 암곰 두 마리
  alternatives_korean:
  - 암곰 둘
  - 암컷 곰 두 마리
  lexicon: דֹּב / דֻּבִּים
  rationale: 성별이 표시된 곰이므로 한국어에서도 ‘암곰’으로 구체화해 POB의 she-bears를 자연스럽게 살렸습니다.
- source_word: וַתְּבַקַּעְנָה מֵהֶם
  english_pob_choice: mauled
  chosen_korean: 물어뜯었습니다
  alternatives_korean:
  - 찢어발겼습니다
  - 뜯어찢었습니다
  - 상하게 했습니다
  lexicon: בקע
  rationale: 영어 POB의 ‘mauled’는 단순 상해보다 맹수가 가하는 거친 공격을 가리키므로, 한국어도 피해 양상을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 신명사 대체 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 단락에서 동사·행위의 주체가 야훼의 이름으로 저주를 선언하는 문맥이므로, 프로젝트 기본 원칙에 따라 신명사 표기를 직접 드러냈습니다.
  doctrine_reference: YHWH transliteration policy
