  from: You have even turned back the edge of his sword; you have not enabled him to stand in battle.
  to: You have even turned back his sword[a]; you have not upheld him in battle.
  rationale: The latest revision correctly recognizes the cumulative “even” and the completed-action sequence. I preserve those gains while expressing the two military images more naturally, without committing to the narrower interpretation “blunted.”
