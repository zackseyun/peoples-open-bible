translation:
  language: en
  text: So reorient[r1] away from this wickedness of yours, and pray to the Lord. Perhaps he will forgive you for the intent in your heart.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the thought in your heart.”
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore
  simplified_phrase: So
  preserved_meaning: Peter’s command follows directly from his previous rebuke.
  reasoning_layer_used: Lexical decision for οὖν
  rationale: “So” expresses the same conclusion in common English.
- pob_phrase: pray to the Lord, if perhaps ... may be forgiven you
  simplified_phrase: pray to the Lord. Perhaps he will forgive you
  preserved_meaning: Simon must pray in hope, without any guarantee of forgiveness.
  reasoning_layer_used: Theological decision on guarded forgiveness
  rationale: A separate sentence gives the guarded possibility clear force.
- pob_phrase: the intent of your heart
  simplified_phrase: the intent in your heart
  preserved_meaning: The inward intention behind Simon’s request remains in view.
  reasoning_layer_used: Lexical decisions for ἐπίνοια and τῆς καρδίας σου
  rationale: “In your heart” is natural English and keeps the biblical heart image.
interpretive_expansions:
- pob_phrase: the intent of your heart may be forgiven you
  rendering: he will forgive you for the intent in your heart
  claim: The Lord is the implied forgiver, and Simon needs forgiveness for his inward intent.
  evidence:
  - The command to pray to the Lord supplies the implied agent of the passive verb.
  - The POB reasoning identifies this as divine forgiveness for Simon’s intent.
  confidence: high
  alternatives_preserved:
  - The title “Lord” is not further identified in the translation.
  - Forgiveness remains possible rather than guaranteed.
translation_notes:
  risk_flags:
  - risk: “Perhaps” may sound as though Peter judges forgiveness unlikely.
    mitigation: The word marks contingency without assigning any degree of likelihood.
  - risk: Making “the Lord” the explicit forgiver expands the Greek passive.
    mitigation: The immediate prayer context clearly supplies the Lord as the implied agent.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
