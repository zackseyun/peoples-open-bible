revisions:
- from: 그들이 갈 때에는 자기들의 네 방향 중 어느 쪽으로든지 갔고, 가면서 돌이키지 않았습니다. 머리가 향하는 곳으로 그들도 그 뒤를 따라갔고, 가면서 돌이키지 않았습니다.[a][b]
  to: 그들이 갈 때에는 자기들의 네 방면 가운데 어느 쪽으로든지 갔으며, 가면서 방향을 바꾸지 않았습니다. 머리가 향하는 곳이면 어디든지 그들은 그곳으로 갔으며, 가면서 방향을 바꾸지 않았습니다.
  rationale: ‘네 방면 가운데 어느 쪽으로든지’로 네 방면에 대한 원문의 표현과 이동의 비전환성을 유지했습니다. 이어지는 절은 ‘머리’ 자체의 뒤를 따른다는 모호한 표현 대신, 머리가 향하는 장소로 나아간다는 히브리어의 구문 관계를 직접 드러냈습니다. 반복되는 부정 진술도 보존했습니다.
