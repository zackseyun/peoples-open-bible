name: Corpus integrity

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: corpus-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the reviewed source baselines
        run: |
          git fetch --no-tags --depth=1 origin 6b9337f796dedecd4794b09451f712b9cfb3f6f8
          git fetch --no-tags --depth=1 origin 015bdfa7dcec66acfc40217a3085b0e75b82c90e
          git fetch --no-tags --depth=1 origin 812b40b4583513af6d7832f24f85ec93a7f7666a
          git fetch --no-tags --depth=1 origin af0ea438fb651254843ef519ba0afdc70c2b89e8
          git fetch --no-tags --depth=1 origin c14ef7e301576128acd863042cdd667b27051dce
          git fetch --no-tags --depth=1 origin ac3e51bd2580ab433502f65b2d46414b6a8c312b
          git fetch --no-tags --depth=1 origin 35c3b3307055ba55212b3f201662b2322df8c75b
          git fetch --no-tags --depth=1 origin 52792dc1d808476debbb975c5e223c0f92608a9e
          git fetch --no-tags --depth=1 origin 7cf29b67bd9f13d088b2935e27910f78b440d1fe
          git fetch --no-tags --depth=1 origin 21faf461feba9970d651bb70fa8d88aabeab43fe
          git fetch --no-tags --depth=1 origin dd74081885dcfa8b4bdc8beb53f2337a1353c8a1
          git fetch --no-tags --depth=1 origin e2d28622a8cd69df0f30eecc8da61f36b492ead1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4,<5' 'python-dotenv>=1,<2'
      - name: Validate catalog and numbering
        run: |
          python tools/extra_texts/validate_catalog.py --all
          python tools/lint_psalm_numbering.py --strict
      - name: Validate the complete reader corpus
        run: python tools/validate_reader_corpus.py --quiet --malformed-yaml error
      - name: Test reader notes and consultation policy
        env:
          PYTHONPATH: .
        run: |
          python tests/test_audit_footnotes.py
          python -m unittest discover -s tests -p 'test_reader_footnote_export.py'
          python -m unittest discover -s tests -p 'test_extra_text_reader_notes.py'
          python -m unittest discover -s tests -p 'test_psalm145_critical_application.py'
          python -m unittest discover -s tests -p 'test_psalm145_check.py'
          python -m unittest discover -s tests -p 'test_psalms_source_context_map.py'
          python -m unittest discover -s tests -p 'test_yadin_masada_policy.py'
          python -m unittest discover -s tests -p 'test_sirach_print_collation.py'
          python -m unittest discover -s tests -p 'test_uxlc_pointing_triage.py'
          python -m unittest discover -s tests -p 'test_judges20_48_application.py'
          python -m unittest discover -s tests -p 'test_jude15_variant_disclosure.py'
          python -m unittest discover -s tests -p 'test_samaritan_parallel_blocks.py'
          python -m unittest discover -s tests -p 'test_numbers20_13_disclosure.py'
          python -m unittest discover -s tests -p 'test_numbers13_33_alignment.py'
          python -m unittest discover -s tests -p 'test_numbers13_33_disclosure.py'
          python -m unittest discover -s tests -p 'test_enoch_greek_control.py'
          python -m unittest discover -s tests -p 'test_enoch1_9_application.py'
          python -m unittest discover -s tests -p 'test_enoch44_1_application.py'
          python -m unittest discover -s tests -p 'test_enoch_azure_auth.py'
          python -m unittest discover -s tests -p 'test_enoch7_8_application.py'
          python -m unittest discover -s tests -p 'test_enoch9_10_application.py'
          python -m unittest discover -s tests -p 'test_enoch_13_transaction.py'
          python -m unittest discover -s tests -p 'test_enoch_14_transaction.py'
          python -m unittest discover -s tests -p 'test_enoch_completeness.py'
          python -m unittest discover -s tests -p 'test_enoch_codex_source_review.py'
          python -m unittest discover -s tests -p 'test_unflagged_english_sample_2.py'
          python -m unittest discover -s tests -p 'test_ezekiel48_28_disclosure.py'
          python -m unittest discover -s tests -p 'test_deut32_8_armenian_controls.py'
          python -m unittest discover -s tests -p 'test_psalm100_3_disclosure.py'
          python -m unittest discover -s tests -p 'test_psalm151_4_disclosure.py'
          python -m unittest discover -s tests -p 'test_exodus20_21_alignment.py'
          python -m unittest discover -s tests -p 'test_exodus20_21_disclosure.py'
          python -m unittest discover -s tests -p 'test_exodus18_24_25_disclosure.py'
