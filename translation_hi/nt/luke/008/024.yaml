reference: Luke 8:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: hi
  text: तब वे उसके पास आए और उसे जगाया, कहते हुए, “स्वामी, स्वामी, हम नाश हो रहे हैं!” वह जागकर हवा और पानी के उफान[a] को डाँटा; वे थम गए, और शान्ति हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पानी की उठती लहरों।”
    reason: κλύδων τοῦ ὕδατος पानी के उफान, लहरों के उभार, या उग्र जल-हलचल को सूचित कर सकता है; मुख्य पाठ व्यापक अर्थ रखता है।
lexical_decisions:
- source_word: προσελθόντες
  choice: पास आकर
  rationale: यह यीशु की ओर बढ़ने और उसके बाद उसे जगाने की क्रमिक सहायक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διήγειραν
  choice: जगाने लगे
  rationale: यूनानी एओरिस्ट को प्रसंगानुकूल हिन्दी क्रिया से व्यक्त किया गया है; शिष्यों ने सोए हुए यीशु को जगाया।
- source_word: Ἐπιστάτα
  choice: स्वामी
  rationale: लूका में प्रयुक्त यह सम्मानसूचक संबोधन यीशु के अधिकार को दर्शाता है; ‘स्वामी’ आधुनिक हिन्दी में ‘शिक्षक’ से अधिक व्यापक अधिकार-सूचक है।
- source_word: ἀπολλύμεθα
  choice: हम नाश हुए जा रहे हैं
  rationale: वर्तमान काल में आसन्न विनाश और चल रहे प्राण-संकट की तीव्रता को बनाए रखता है।
- source_word: διεγερθεὶς
  choice: जागकर
  rationale: एओरिस्ट कृदन्त की क्रिया-क्रम संबंधी भूमिका को संक्षिप्त और स्वाभाविक हिन्दी में रखता है, बिना इस पर अनावश्यक जोर दिए कि वह कैसे जागा।
- source_word: ἐπετίμησεν
  choice: डाँटा
  rationale: यह हवा और जल पर यीशु के प्रबल, प्रत्यक्ष और अधिकारपूर्ण निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνέμῳ
  choice: हवा
  rationale: मूल शब्द का सीधा अर्थ रखा गया है; ‘आँधी’ जोड़ने से पाठ से अधिक विशिष्टता आती।
- source_word: κλύδωνι τοῦ ὕδατος
  choice: पानी की उठती लहरों
  rationale: κλύδων जल के उफान या प्रचण्ड उठान को सूचित करता है। यह वाक्यांश हिन्दी में दृश्य को स्वाभाविक रूप से व्यक्त करता है, यद्यपि व्याकरणिक एकवचन को अर्थगत बहुवचन ‘लहरों’ से रूपान्तरित करता है।
- source_word: ἐπαύσαντο
  choice: वे थम गईं
  rationale: बहुवचन क्रिया को बनाए रखते हुए इसका संकेत हवा और उठती लहरों, दोनों की ओर है; निकटवर्ती स्त्रीलिंग संज्ञाओं के कारण हिन्दी में स्त्रीलिंग बहुवचन स्वाभाविक है।
- source_word: ἐγένετο γαλήνη
  choice: शान्ति छा गई
  rationale: परिणामस्वरूप आई पूर्ण प्राकृतिक शान्ति को मुहावरेदार, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: Ἐπιστάτα संबोधन में यीशु का अधिकार
  choice: स्वामी
  alternative: गुरु
  rationale: ‘स्वामी’ सम्मान और अधिकार दोनों को बनाए रखता है, जबकि ‘गुरु’ संबोधन को मुख्यतः शिक्षण की भूमिका तक सीमित कर सकता है।
- issue: सृष्टि पर यीशु के अधिकार का चित्रण
  choice: हवा और पानी की उठती लहरों को डाँटा
  alternative: हवा और पानी की उठती लहरों को आज्ञा दी
  rationale: ‘डाँटा’ ἐπιτιμάω की कठोर, अधिकारपूर्ण निषेधात्मक शक्ति को बनाए रखता है, बिना पाठ में कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘शान्ति’ यहाँ परिस्थिति की निस्तब्धता है, आत्मिक शान्ति की व्याख्या नहीं। मूल पाठ में इस पद पर किसी आवश्यक पाठालोचनात्मक या अर्थगत पादटिप्पणी की जरूरत नहीं पाई गई; दिए गए अंग्रेज़ी पादटिप्पणी-चिह्न का मुख्य पाठ में स्पष्ट आधार नहीं था, इसलिए उसे नहीं अपनाया गया।
