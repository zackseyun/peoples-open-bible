    issue: 첫 문장의 동사 결합이 부자연스럽고 의미가 불명확함
    rationale: '''내 영혼을 그녀를 따라 두었습니다''는 한국어에서 무엇을 어디에 둔 것인지 분명하지 않습니다. נתתי אחרי의 헌신과 추종을 ''그녀를 따르는 데 바쳤습니다''로 드러내는 것이 안전합니다.'
  - severity: medium
