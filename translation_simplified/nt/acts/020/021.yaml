  text: I solemnly testified to both Jews and Greeks about repentance[b] toward God and having faith in our Lord Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “trust in our Lord Jesus.”
    reason: lexical_alternative
  - marker: b
    text: The Greek explicitly says repentance toward God. Repentance concerns changed disposition and conduct, not merely regret; toward God is retained because the sentence states it.
    reason: lexical_alternative
