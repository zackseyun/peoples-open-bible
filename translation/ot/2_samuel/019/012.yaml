  from: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
  to: 'King David sent this message to the priests Zadok and Abiathar: “Tell the elders of Judah, ‘Why should you be the last to bring the king back home, since news of what all Israel is saying has reached the king where he is staying?'
  rationale: I retain the current causal connection between Israel’s discussion and David’s challenge to Judah. The lexical documentation acknowledges both the message sense of “word” and the lodging sense of the final “house,” which the new English expresses directly.
