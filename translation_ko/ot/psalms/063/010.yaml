base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/010.yaml
  text: They will be given over to the power of the sword; they will become a portion for foxes.[a]
  footnotes:
  - marker: a
    text: Or 'jackals.' The Hebrew שׁוּעָלִים can refer to foxes, though some understand a broader canid term here in a battlefield/desolation context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 칼의 권세에 넘겨져, 여우들의 몫이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "자칼들의". 히브리어 שׁוּעָלִים는 보통 여우들을 가리키지만, 황폐와 전장의 문맥에서는 자칼들을 가리킨다고 이해하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 첫 절에서 단수 목적어 "그를"을 사용하고 다음 절에서는 복수 "그들은"을 사용합니다. 문맥상 시편 기자의 적대자들이 칼에 넘겨지고 포식자들의 몫이 된다는 뜻으로 이해됩니다.
    reason: grammatical_note
lexical_decisions:
- source_word: וְהֵמָּה
  english_pob_choice: But they
  chosen_korean: 그러나 그들은
  alternatives_korean:
  - 그리고 그들은
  - 그들 자신은
  lexicon: HALOT
  rationale: 문맥상 앞 절의 신뢰 고백과 대비되므로 단순 접속의 '그리고'보다 역접 '그러나'가 적절하며, 히브리어 강조 대명사도 '그들은'으로 살렸습니다.
- source_word: לְשׁוֹאָה
  english_pob_choice: to destroy it
  chosen_korean: 그것을 멸하려
