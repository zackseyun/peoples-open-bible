translation:
  language: ko
  text: 족장[ㄱ] 오홀리바마, 족장 엘라, 족장 피논입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: ㄱ
    text: 또는 ‘씨족의 우두머리’. 히브리어 알루프는 이 에돔 족보에서는 씨족 또는 부족 단위의 지도자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  english_pob_choice: chief
  chosen_korean: 족장
  alternatives_korean:
  - 우두머리
  - 지도자
  - 추장
  lexicon: HALOT
  rationale: 에돔 족보 목록의 반복되는 직함으로서 혈연·부족 단위의 우두머리를 가리키므로, 한국어에서는 간결하고 관계적 뉘앙스가 살아 있는 ‘족장’이 가장 자연스럽습니다.
- source_word: אָהֳלִיבָמָה
  english_pob_choice: Oholibamah
  chosen_korean: 오홀리바마
  alternatives_korean:
  - 아홀리바마
  lexicon: standard transliteration
  rationale: 고유명사는 번역하지 않고 음역했으며, 현대 외래어 표기 관행에 맞는 ‘오홀리바마’를 택했습니다.
- source_word: אֵלָה
  english_pob_choice: Elah
  chosen_korean: 엘라
  alternatives_korean:
  - 에라
  lexicon: standard transliteration
  rationale: 족보의 인명은 의미 풀이보다 음역이 우선이므로, 통용되는 형태에 가깝게 ‘엘라’로 옮겼습니다.
- source_word: פִּינֹן
  english_pob_choice: Pinon
  chosen_korean: 피논
  alternatives_korean:
  - 피농
  - 피넌
  lexicon: standard transliteration
  rationale: 히브리어 자음형을 따른 인명 음역으로, 간결하고 읽기 쉬운 ‘피논’을 사용했습니다.
