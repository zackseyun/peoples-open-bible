  from: There the workers of wickedness have fallen[a][b]; they are thrust down and cannot rise.
  to: There the evildoers have fallen; they are thrust down and cannot rise.
  rationale: The proposed removal of the misplaced notes is warranted, and “workers of wickedness” is unnecessarily calqued English. However, “those who do evil” loses the compact agentive force of פֹּעֲלֵי אָוֶן, for which “evildoers” is both natural and faithful. The proposal’s “have been thrust down” is possible for the Pual perfect, but the Hebrew juxtaposes a completed fall with a vivid/resultant passive description; the current “are thrust down” preserves that poetic force and need not be harmonized into a second English present perfect. “There” should remain adjacent to the verb as in the Hebrew without implying that the evildoers themselves are the locative focus.
