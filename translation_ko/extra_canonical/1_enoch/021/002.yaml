base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/002.yaml
  text: 'And there I saw a fearful work: I saw neither the heavens above nor the firmly founded earth, but a place unformed and terrible.'
translation:
  language: ko
  text: 그리고 거기에서 나는 두려운 일을 보았습니다. 나는 위의 하늘도, 견고히 세워진 땅도 보지 못했으나, 형체가 없고 두려운 한 곳을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Geʽez의 표현은 장소를 직접 ‘혼돈’으로 명시하기보다, 형체가 갖추어지지 않은 상태와 두려운 성격을 함께 드러냅니다.
    reason: theological_note
lexical_decisions:
- source_word: ግብረ፡ ግሩመ
  english_pob_choice: a fearful work
  chosen_korean: 두려운 일
  alternatives_korean:
  - 두려운 작업
  - 두려운 행위
  - 무서운 일
  lexicon: Geʽez ግብር / ግሩም
  rationale: POB가 이 구를 ‘work’로 잡았으므로, 결과물이나 사건으로 읽히는 의미를 살려 ‘일’로 옮겼습니다. ‘작업’은 현대적이지만 장인적 뉘앙스가 강하고, ‘행위’는 도덕적 주체를 암시해 문맥을 좁힐 수 있습니다.
- source_word: ርኢኩ፡ ወአሰማየ፡ ላዕለ፡
  english_pob_choice: I saw neither the heavens above
  chosen_korean: 나는 위의 하늘도 보지 못했으나
  alternatives_korean:
  - 나는 위의 하늘도 보지 못했고
  - 나는 위의 하늘도 보지 못하였으며
  lexicon: Geʽez 시각 동사 및 부정 구조
  rationale: ‘보지 못했으나’로 앞뒤 대비를 살려, 이어지는 ‘but’ 절과 연결되는 대조 구조를 자연스럽게 유지했습니다.
- source_word: ዘአኮ፡ ድልወ
  english_pob_choice: the firmly founded earth
  chosen_korean: 견고히 세워진 땅
  alternatives_korean:
  - 단단히 세워진 땅
  - 기초가 굳게 놓인 땅
  - 확고히 세워진 땅
  lexicon: Geʽez 땅/세움의 안정성 표현
  rationale: POB의 ‘firmly founded’는 단순한 위치가 아니라 지반의 확고함을 강조하므로, ‘견고히 세워진’으로 구조적 안정성을 분명히 했습니다.
- source_word: '*ግሩምም'
  english_pob_choice: terrible
  chosen_korean: 두려운
  alternatives_korean:
  - 무서운
  - 소름끼치는
  - 끔찍한
  lexicon: Geʽez ግሩም
  rationale: 동일 어근의 감탄·공포 뉘앙스를 살려 ‘두려운’으로 옮겨, 앞의 ‘두려운 일’과 어휘적 반복을 유지했습니다.
theological_decisions:
- issue: ‘place unformed and terrible’의 질료적/형태적 묘사
  chosen_reading: ‘형체가 없고 두려운 한 곳’으로, 창조 전의 혼돈을 직접 단정하지 않고 장소의 비정형성과 공포를 병기했습니다.
  alternative_readings:
  - ‘혼돈스럽고 두려운 곳’
  - ‘형성되지 않고 두려운 곳’
  rationale: 본문은 ‘place’와 그 성격을 병렬로 제시할 뿐이므로, 창세기의 창조 혼돈 어휘를 과도하게 끌어오지 않고 원문의 묘사력을 보존했습니다.
  doctrine_reference: 창세기 1장의 질서-비질서 대비를 연상시키되, 본문 자체의 현상 묘사로 한정
