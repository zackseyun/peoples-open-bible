- source_word: אֶתְפַּלָּל
  english_pob_choice: I pray
  chosen_korean: 기도합니다
  alternatives_korean:
  - 기도하겠습니다
  - 기도하고 있습니다
  lexicon: HALOT
  rationale: 히브리어 미완료형은 문맥상 현재적·지속적 기도를 나타낼 수 있으므로, 한국어에서는 현재형 ‘기도합니다’가 가장 자연스럽게 그 유동성을 담습니다.
theological_decisions:
- issue: 하나님께 대한 직접 호칭의 높임법
  chosen_reading: 나의 왕이시며 나의 하나님이시여
  alternative_readings:
