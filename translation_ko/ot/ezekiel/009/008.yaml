id: EZK.9.8
reference: Ezekiel 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כְּ/הַכּוֹתָ֔/ם וְ/נֵֽאשֲׁאַ֖ר אָ֑נִי וָ/אֶפְּלָ֨/ה עַל פָּנַ֜/י וָ/אֶזְעַ֗ק וָֽ/אֹמַר֙ אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה הֲ/מַשְׁחִ֣ית אַתָּ֗ה אֵ֚ת כָּל שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל בְּ/שָׁפְכְּ/ךָ֥ אֶת חֲמָתְ/ךָ֖ עַל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/008.yaml
  text: And it happened, while they were striking them down, and I alone was left, that I fell on my face and cried out, and I said, “Ah, Lord GOD, will you destroy all the remnant of Israel as you pour out your wrath on Jerusalem?”
translation:
  language: ko
  text: 그들이 그들을 치고 있을 때, 나만 홀로 남았습니다. 나는 얼굴을 땅에 대고 엎드려 부르짖으며 말했습니다. “아, 주 야훼여, 당신께서 예루살렘 위에 당신의 분노를 쏟아부으시면서 이스라엘의 남은 자를 모두 멸하시렵니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֵאשֲׁאַר אָנִי
  english_pob_choice: and I alone was left
  chosen_korean: 나만 홀로 남게 되었을 때
  alternatives_korean:
  - 내가 홀로 남았을 때
  - 나만 남았을 때
  lexicon: שָׁאַר / 남다
  rationale: POB의 “I alone was left”를 따라, 단순한 잔존이 아니라 예언자 자신만 남은 상황을 분명히 드러내기 위해 “나만 홀로 남게 되었을 때”로 옮겼습니다.
- source_word: וָאֶזְעַק
  english_pob_choice: and cried out
  chosen_korean: 부르짖으며
  alternatives_korean:
  - 외치며
  - 소리치며
  lexicon: זָעַק / 부르짖다
  rationale: 예언적 탄원에 어울리는 강한 호소를 살리기 위해 “부르짖다”를 택했습니다.
- source_word: יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 야훼여
  alternatives_korean:
  - 주 하나님여
  - 주 여호와여
  lexicon: יהוה / 야훼
  rationale: 본문의 신명칭은 POB 기본 원칙에 따라 야훼로 옮기고, 직접 호칭이므로 호격 조사와 결합해 “주 야훼여”로 처리했습니다.
- source_word: חֲמָתְךָ
  english_pob_choice: your wrath
  chosen_korean: 당신의 분노
  alternatives_korean:
  - 당신의 진노
  - 당신의 격분
  lexicon: חֵמָה / 분노
  rationale: 히브리어 חֵמָה의 직접적 감정·심판 용어를 살려, 교회문체의 완곡한 표현보다 “분노”를 사용했습니다.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  english_pob_choice: all the remnant of Israel
  chosen_korean: 이스라엘의 남은 자를 모두
  alternatives_korean:
  - 이스라엘의 남은 자를 전부
  - 이스라엘의 생존자들을 모두
  lexicon: שְׁאֵרִית / 남은 자
  rationale: POB의 “remnant”를 표준 신학어휘인 “남은 자”로 살리고, 전멸 위험을 강조하는 문맥을 위해 “모두”를 붙였습니다.
theological_decisions:
- issue: 예언자의 공포 섞인 호칭과 항의문을 어떻게 살릴 것인가
  chosen_reading: “아, 주 야훼여 … 멸하시렵니까?”로 옮겨, 애통과 항변의 정서를 직접적으로 드러냈습니다.
  alternative_readings:
  - “아, 주 하나님이여 … 멸하시겠습니까?”
  - “슬프도소이다, 주 야훼여 …”
  rationale: 본문의 אֲהָהּ와 수사적 질문은 단순 정보 전달이 아니라 심판 앞의 격앙된 탄원을 보여 주므로, 한국어에서도 감탄과 질문을 그대로 유지해야 합니다.
  doctrine_reference: 예언서의 중보적 탄원과 하나님의 심판 선언에 대한 경외
- issue: והשחית ... / destroy의 강도를 어떻게 반영할 것인가
  chosen_reading: “멸하시렵니까?”를 사용해 단순한 손상보다 종말적 파괴의 강도를 유지했습니다.
  alternative_readings:
  - “파괴하시렵니까?”
  - “없애시렵니까?”
  rationale: 문맥상 ירושלים에 대한 분노의 쏟아 부음과 연결된 전면적 심판이므로, 약화된 표현보다 “멸하다”가 더 적절합니다.
  doctrine_reference: 하나님의 공의로운 심판과 남은 자 보존의 긴장
