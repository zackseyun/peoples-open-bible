    issue: 원문에 없는 ‘흩어진’의 첨가
    rationale: אֲשֶׁר ... עַד־צָרְפַת는 가나안 사람들 가운데 사르밧까지 있는 이들을 한정하지만, ‘흩어진’이라는 동작·상태를 명시하지 않습니다.
  - severity: medium
    issue: גָלוּת를 ‘포로들’로 한정
    rationale: 이 단어는 유배/강제 이주의 공동체 또는 그 구성원을 가리킵니다. ‘포로’는 전쟁 포로라는 더 좁은 의미로 들릴 수 있습니다.
  - severity: low
    issue: חֵיל의 소유격 연결이 부자연스러움
    rationale: ‘군대의 포로들’은 군대에 속한 포로 또는 군대가 붙잡은 포로로 읽힐 수 있습니다. 집단에 속한 유배민이라는 관계를 드러내는 편이 낫습니다.
