reference: Testament of Judah 15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XV. Ὁ πορνεύσας¹ γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται. 2. Κἂν γάρ τις *βασιλεὺς ἐστι² καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας*, δουλεύσας τῇ πορνείᾳ⁶ ὡς κἀγὼ ἔπαθον⁷. 3. Δέδωκα⁸ γὰρ τὴν ῥάβδον μου, τουτέστι⁹ τὸ στήριγμα τῆς ἐμῆς φυλῆς¹⁰, καὶ τὴν ζώνην μου, τουτέστιν¹¹ τὴν δύναμιν, καὶ τὸ διάδημα¹², τουτέστιν¹³ τὴν δόξαν τῆς βασιλείας μου¹⁴. 4. Καίγε *μετανοήσας ἐπὶ τούτοις¹⁴, οἶνον καὶ κρέα¹⁶ οὐκ¹⁷ ἔφαγον ἕως γήρους¹⁹ μου²⁰, καὶ *πᾶσαν εὐφροσύνην²¹ οὐκ εἶδον. 5. Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ ὅτι αἱ γυναῖκες κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ²⁴ κατακυριεύουσιν αἱ γυναῖκες, *τοῦ μὲν²⁹ βασιλέως αἴρουσιν³⁰ τὴν δόξαν τοῦ ἀνδρὸς⁵¹ τὴν δύναμιν, *τοῦ δὲ πτωχοῦ³⁴ *τὴν⁵² πτωχείας⁵³ ἐλάχιστον στήριγμα.
  language: Greek
  source_pages:
  - 159
  - 160
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015.yaml
  text: 1[a]. The man who commits sexual immorality, even while being ruined, does not perceive it; and while being dishonored, he is not ashamed. 2. For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered. 3[b]. I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom. 4. And although I repented concerning these things, I ate neither meat nor drank wine until my old age, and I saw no joy at all. 5. And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's very support.
  footnotes:
  - marker: a
    text: Or, 'repented concerning these things.' The Greek participle can bear a penitential sense, though here it is rendered 'changed my mind' in keeping with project policy for cognitive-turn contexts.
    reason: lexical_alternative
  - marker: b
    text: The source OCR for verse 5 is truncated after 'And the angel of God showed me…'. The fuller warning translated here reflects the chapter's extant Greek sense in context and should be checked against critical editions in revision.
    reason: textual_variant
translation:
  language: ko
  text: 1. 음행하는 사람은 발가벗겨져도 깨닫지 못하고, 수치를 당해도 부끄러워하지 않습니다. 2. 사람이 왕이라 해도 음행하면, 음행에 예속되어 나도 겪었던 것처럼 왕권을 빼앗깁니다. 3. 나는 내 지팡이, 곧 내 지파의 버팀목을 내어 주었고, 내 띠, 곧 내 힘을 내어 주었으며, 내 관, 곧 내 왕국의 영광을 내어 주었습니다. 4. 나는 이 일들을 두고 회개한 뒤, 늙을 때까지 포도주는 마시지 않고 고기는 먹지 않았으며, 어떤 기쁨도 보지 못했습니다. 5. 하나님의 천사가 내게 보여 주었습니다. 여자들은 왕과 가난한 사람을 지배하며, 왕에게서 영광을, 남자에게서 힘을, 가난한 사람에게서 가장 작은 버팀목마저 빼앗아 갑니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεύσας / πορνεύῃ / πορνείᾳ
  english_pob_choice: commits sexual immorality / sexual immorality
  chosen_korean: 음행하다 / 음행
  alternatives_korean:
  - 성적 부정을 저지르다
  - 성적 음란
  lexicon: πορνεία
  rationale: 본문의 도덕적·신체적 타락을 직접 가리키는 표준 대응으로, POB의 'sexual immorality'를 너무 완곡하지 않게 '음행'으로 옮겼습니다.
- source_word: δουλεύσας
  english_pob_choice: having been enslaved
  chosen_korean: 종이 되다
  alternatives_korean:
  - 노예가 되다
  - 예속되다
  lexicon: δουλεύω
  rationale: 지배받아 종속된 상태를 드러내되, 본문 전체의 도덕 경고를 살리기 위해 '종이 되다'를 택했습니다.
- source_word: γυμνούται τῆς βασιλείας
  english_pob_choice: is stripped of his kingship
  chosen_korean: 왕권에서 벗겨지다
  alternatives_korean:
  - 왕권을 빼앗기다
  - 나라에서 쫓겨나다
  lexicon: γυμνόω
  rationale: '''벗겨지다''의 수동 이미지를 살려, 왕의 권위가 탈의되듯 박탈되는 원어의 강도를 보존했습니다.'
- source_word: μετανοήσας
  english_pob_choice: repented concerning these things
  chosen_korean: 이 일들에 대하여 회개한 뒤에도
  alternatives_korean:
  - 이 일들을 두고 마음을 돌이킨 뒤에도
  - 이 일들에 관해 돌이킨 뒤에도
  lexicon: μετανοέω
  rationale: 여기서는 단순한 인지 변화보다 통회와 방향 전환을 포함할 수 있어, 문맥상 '회개'를 유지했습니다.
- source_word: στήριγμα
  english_pob_choice: support / very support
  chosen_korean: 의지처
  alternatives_korean:
  - 버팀목
  - 지지대
  lexicon: στήριγμα
  rationale: 서민의 최소 생계 기반이라는 뉘앙스를 살리기 위해, 물리적 '지지대'보다 관계적·생존적 느낌의 '의지처'를 사용했습니다.
theological_decisions:
- issue: 왕권 상실과 음행의 징계 연결
  chosen_reading: 음행은 단순한 사적인 죄가 아니라 언약적·공적 권위를 해체하여 왕권을 박탈하는 죄로 제시됩니다.
  alternative_readings:
  - 왕의 개인적 타락 사례로만 읽는 해석
  - 비유적 경고로만 약화시키는 해석
  rationale: 본문은 왕의 도덕 실패가 즉각적으로 왕권 상실과 연결된다고 말하므로, 그 징계의 공적 성격을 약화하지 않았습니다.
  doctrine_reference: 성경적 거룩과 지도자 책임
- issue: 5절의 여성 지배 진술
  chosen_reading: 본문의 일반화된 진술을 그대로 유지하되, 성별 편견을 현대적으로 완화하지 않고 역사적 경고문의 수사로 남겨 두었습니다.
  alternative_readings:
  - 여성에 대한 보편적 평가로 순화하는 해석
  - 문맥을 무시하고 삭제하는 해석
  rationale: 원문은 여성을 행위 주체로 강하게 전면화하므로, 이를 도식적으로 중화하면 source meaning이 훼손됩니다.
  doctrine_reference: 원문 존중과 수사적 맥락 보존
