revisions:
- from: 아들은 아버지를 공경하고, 종은 자기 주인을 공경합니다. 그런데 내가 아버지라면, 어디에 나의 존경이 있습니까? 내가 주인이라면, 어디에 나를 두려워하는 마음이 있습니까? 만군의 야훼께서 말씀하십니다. 너희는 내 이름을 업신여기는 제사장들입니다. 그런데도 너희는 「우리가 어떻게 주의 이름을 업신여겼습니까?」라고 말합니다.[a][b]
  to: 아들은 아버지를 공경하고, 종은 자기 주인을 공경합니다. 그러므로 내가 아버지라면, 내게 마땅한 공경이 어디 있습니까? 내가 주인이라면, 나를 두려워함이 어디 있습니까? 만군의 야훼께서 너희에게, 곧 내 이름을 멸시하는 제사장들에게 말씀하십니다. 그런데 너희는 “우리가 어떻게 당신의 이름을 멸시했습니까?”라고 말합니다.
  rationale: 원문의 두 병행 수사 질문에서 공경과 두려움의 대응을 보존하고, ‘너희에게 … 제사장들에게’라는 직접 수신자 표지를 회복했습니다. 마지막 인용문의 2인칭 소유격을 정확히 반영했으며, 잘못되었거나 번역 자체에 필요하지 않은 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
