    reason: alternative_reading
lexical_decisions:
- source_word: הַסְתֵּר פָּנֶיךָ
  english_pob_choice: Hide your face
  chosen_korean: 주의 얼굴을 가리시고
  alternatives_korean:
  - 주의 얼굴을 숨기시고
  - 주의 얼굴을 돌리시고
  lexicon: HALOT
  rationale: 히필 명령의 간구를 살리면서, פנים의 직역인 ‘얼굴’과 한국어에서 자연스러운 ‘가리시고’를 사용해 하나님이 죄를 보지 않으시기를 구하는 시적 이미지를 보존했습니다.
- source_word: מֵחֲטָאָי
  english_pob_choice: from my sins
  chosen_korean: 제 죄에서
  alternatives_korean:
  - 제 죄들에서
  - 제 허물에서
  lexicon: HALOT
  rationale: חטא를 POB처럼 직접적으로 ‘죄’로 옮기되, מן의 방향성을 한국어 조사 ‘-에서’로 살려 ‘from’의 관계를 분명히 했습니다.
- source_word: עֲוֺנֹתַי
  english_pob_choice: my iniquities
  chosen_korean: 제 모든 죄악
  alternatives_korean:
  - 제 모든 불의
  - 제 모든 죄과
  lexicon: HALOT
  rationale: עוֹן의 ‘죄악/불법/죄책’ 범위를 반영하여 앞의 חטא와 구별되게 옮겼습니다. POB가 보존한 어휘적 긴장을 한국어에서도 유지하려고 ‘죄’보다 한층 무거운 ‘죄악’을 택했습니다.
- source_word: מְחֵה
  english_pob_choice: blot out
  chosen_korean: 지워 주십시오
  alternatives_korean:
  - 말소해 주십시오
  - 없애 주십시오
  lexicon: HALOT
  rationale: 문자적으로는 ‘지우다/말소하다’이지만, 한국어 기도문으로는 현재적 간구의 힘을 살리는 ‘지워 주십시오’가 가장 자연스럽습니다. 기록을 없애는 이미지도 충분히 전달됩니다.
theological_decisions:
- issue: 직접적인 청원체 유지
  chosen_reading: 하나님께 드리는 기도체로 ‘-시고 / -주십시오’를 사용했습니다.
  alternative_readings:
  - 서술형으로 평서화하기
  - 더 고전적인 기도체로 옮기기
  rationale: 이 절은 회개의 간구이므로, 현대 합쇼체이면서도 하나님께 직접 드리는 정중한 청원형이 본문의 정서와 기능을 가장 잘 드러냅니다.
  doctrine_reference: 시편의 기도체와 번역 문체 일치
- issue: 두 죄 어휘의 구분 유지
  chosen_reading: ‘죄’와 ‘죄악’을 함께 사용해 חטא와 עוון의 차이를 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘죄’로 통일하기
  - 둘 다 ‘허물’로 통일하기
  rationale: 히브리어는 병렬 속에서 서로 다른 어휘를 쓰므로, 한국어도 의미 범위를 완전히 평준화하지 않고 구분을 남겼습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
