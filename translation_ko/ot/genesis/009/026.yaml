- from: 그가 말하였습니다. 「야훼께 복이 있기를 — 셈의 하나님이시며, 가나안은 그들의 종이 될 것입니다.」
  to: 그가 말하였습니다. “셈의 하나님이신 야훼는 복되십니다. 가나안은 그들의 종이 되기를 바랍니다.”
  rationale: The revision repairs the Korean syntax, retains the divine name and plural possessive indicated by the source and English audit trail, and represents the Hebrew blessing and jussive forms in natural modern formal-polite Korean. No footnote is required because the supplied source and audit trail explicitly support the plural ‘그들의.’
  reviewer_model: gpt-5.6-terra
