  from: And when Jesus came into Peter’s house[a], he saw his mother-in-law lying down and having a fever.
  to: And when Jesus came into Peter’s house[a], he saw his mother-in-law lying in bed with a fever.
  rationale: The literal rendering 'lying down and having a fever' is clunky and misses the idiomatic force of βεβλημένην, which in this context implies being laid up or bedridden due to illness. 'Lying in bed with a fever' or 'lying sick with a fever' produces much more natural English while accurately conveying the combined meaning of the two Greek participles.
