translation:
  text: 'In those days the holy ones who dwell in the highest heavens unite with one voice. They plead and pray,
    praise, give thanks, and bless in the name of the Lord of Spirits concerning the blood of the righteous that
    was poured out and their prayer: that it may not come to nothing before the Lord of Spirits, that judgment may
    be carried out for them, and that forbearance may not last for them forever.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dillmann1865 col1329 explicitly gives come-to-nothing/be-rendered-ineffective for the prayer verb at47:2,
      while also leaving cease as an alternative. This English does not silently delete its negative. The final
      them references are not fully explicit; the prayer seeks judgment for the righteous, but the relation of forbearance
      to the people concerned remains difficult. The final source says forbearance will not be for them forever;
      it is not changed to an affirmative eternal forbearance or to a named group’s doctrine. Both Lord-of-Spirits
      occurrences have separately checked selected መንፈሳት.
    reason: alternative_reading
