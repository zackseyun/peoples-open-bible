id: PSA.119.116
reference: Psalms 119:116
source:
  edition: WLC
  text: סָמְכֵ֣/נִי כְ/אִמְרָתְ/ךָ֣ וְ/אֶֽחְיֶ֑ה וְ/אַל תְּ֝בִישֵׁ֗/נִי מִ/שִּׂבְרִֽ/י־׃
translation:
  text: Uphold me according to your promise, so that I may live; do not put me to shame by letting my hope fail.
  philosophy: dynamic
lexical_decisions:
- source_word: כְאִמְרָתְךָ
  chosen: promise
  alternatives:
  - word
  - saying
  lexicon: HALOT
  rationale: אִמְרָה in this psalm repeatedly denotes God's committed utterance on which the psalmist stakes his life; rendered 'promise' to distinguish it from דָּבָר ('word'), with 'word/saying' as alternatives.
- source_word: אַל תְּבִישֵׁנִי מִשִּׂבְרִי
  chosen: do not put me to shame in my hope
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Preserves the direct address, causative force, and the unexpanded relation of the hope phrase.
