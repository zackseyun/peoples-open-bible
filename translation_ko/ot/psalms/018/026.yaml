  text: 순결한 이와 함께하시면 주께서도 순결하십니다. 굽은 이와 함께하시면 주께서도 비틀어지십니다.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: נָבָר
