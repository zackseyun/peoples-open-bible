theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Nuance of ירש in the second clause versus the third clause
  chosen_reading: 'Different English renderings: ''dispossess them'' / ''take possession of their land'''
  alternative_readings:
  - Use 'drive out' for both clauses
  - Use 'inherit' for Israel's action
  rationale: The Hebrew repeats the root ירש in different stems and senses. Rendering both identically would flatten the contrast between God causing the nations to lose possession and Israel gaining possession. The chosen pair preserves the theological and legal-land nuance without overinterpreting.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §5: consistency of key terms, or documented exception'
