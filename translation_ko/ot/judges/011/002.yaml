base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: ko
  text: 길르앗의 아내가 그에게서 아들들을 낳았습니다. 아내의 아들들이 자라나자, 그들은 입다를 쫓아내고 그에게 말했습니다. “너는 우리 아버지 집에서 상속을 받지 못할 것이다. 너는 다른 여자에게서 난 아들이기 때문이다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'אֵשֶׁת גִּלְעָד / english_pob_choice: Gilead’s wife'
  english_pob_choice: Gilead’s wife
  chosen_korean: 길르앗의 아내
  alternatives_korean:
  - 길르앗의 아내 사람
  - 길르앗의 아내로서
  lexicon: 고유명사
  rationale: 소유격 관계를 가장 सीधे하게 살려 “길르앗의 아내”로 옮기고, 원문의 단순 서술을 유지했습니다.
- source_word: 'בָּנִים / english_pob_choice: sons'
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
