    text: 또는 전통적으로 “사람의 자녀들보다 더 아름다우십니다.” 히브리어는 문자적으로 “사람의 아들들보다”이며, 왕을 다른 인간들과 비교하는 시적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “호의” 또는 “은혜로움이 왕의 입술에 부어졌으므로.” 여기서 ‘은혜’는 왕의 말에 나타나는 호의와 은혜로움을 가리킬 수 있습니다.
