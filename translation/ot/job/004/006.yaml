id: JOB.4.6
reference: Job 4:6
source:
  edition: WLC
  text: הֲ/לֹ֣א יִ֭רְאָתְ/ךָ כִּסְלָתֶ֑/ךָ תִּ֝קְוָתְ/ךָ֗ וְ/תֹ֣ם דְּרָכֶֽי/ךָ׃
translation:
  text: Is not your fear of God your confidence, and the integrity of your ways your hope?
  philosophy: dynamic
lexical_decisions:
- source_word: הֲלֹא
  chosen: Is not
  alternatives:
  - Isn't
  - Surely
  lexicon: HALOT
  rationale: Introduces a rhetorical question expecting agreement. 'Is not' preserves the formal force and elevated tone better than the more colloquial 'Isn't,' while avoiding over-interpreting it as an assertive 'Surely.'
- source_word: יִרְאָתְךָ
  chosen: your fear
  alternatives:
  - your fear
  - your piety
  - your reverence
  lexicon: HALOT
  rationale: The noun's object is unexpressed; the likely divine referent is properly noted rather than inserted into the main text.
- source_word: כִּסְלָתֶךָ
  chosen: your confidence
  alternatives:
  - your folly
  - your trust
  - your security
  lexicon: HALOT
  rationale: Though the root כסל can denote 'folly' in some forms, this noun in context is widely understood as 'confidence' or 'trust.' The verse pairs inner disposition and moral conduct with grounds for hope; 'confidence' fits that parallelism. 'Folly' would make poor sense in this context.
- source_word: תִּקְוָתְךָ
  chosen: your hope
  alternatives:
  - your expectation
  lexicon: HALOT
  rationale: Standard rendering for תקוה in wisdom contexts. 'Hope' is idiomatic and preserves both expectation and trust.
- source_word: וְתֹם
  chosen: and the integrity
  alternatives:
  - and the blamelessness
  - and the innocence
  lexicon: HALOT
  rationale: תם denotes completeness, integrity, or blamelessness. 'Integrity' best suits the ethical sense here and reads naturally in English. 'Blamelessness' is possible but slightly more absolute than the context requires.
- source_word: דְּרָכֶיךָ
  chosen: of your ways
  alternatives:
  - of your conduct
  - of your paths
  lexicon: HALOT
  rationale: '''Ways'' preserves the Hebrew metaphor and common wisdom-language usage. ''Conduct'' is interpretive but possible; ''paths'' is more literal yet less idiomatic in this construction.'
