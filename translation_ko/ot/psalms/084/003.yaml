  source_fidelity: 현 초안은 시편 84:2의 내용(영혼이 야훼의 궁정을 사모함)을 담고 있어, 검토 대상인 84:3의 히브리어 본문 및 영어 감사 번역과 일치하지 않습니다. 84:3의 참새, 제비, 보금자리, 새끼, 제단, 만군의 야훼, 왕과 하나님을 모두 반영하도록 전면 수정이 필요합니다.
  naturalness: 수정문은 현대 표준어의 격식 있는 성경 문체를 사용하면서, 히브리 시의 압축된 호격과 장소 표현을 자연스럽게 유지합니다. ‘제단 곁에’는 새들이 제단 자체가 아니라 그 부근에 깃든다는 문맥상 의미를 명료하게 전달합니다.
  terminology: יְהוָה는 감사 번역의 방침에 따라 ‘야훼’로, צְבָאוֹת는 ‘만군’으로 옮겼습니다. מַלְכִּי וֵאלֹהָי는 ‘나의 왕, 나의 하나님’으로 보존했습니다. צִפּוֹר와 דְּרוֹר는 각각 전통적이고 가능한 번역인 ‘참새’와 ‘제비’로 옮겼습니다.
