lexical_decisions:
- source_word: δυνάμει πολλῇ
  english_pob_choice: with a large force
  chosen_korean: 큰 군대를 거느리고
  alternatives_korean:
  - 많은 군사와 함께
  - 대군을 이끌고
  - 큰 병력을 거느리고
  lexicon: δυνάμις
  rationale: 군사적 동원 규모를 나타내므로 단순한 ‘힘’보다 문맥상 자연한 ‘큰 군대’로 옮겼습니다.
- source_word: ἀπέστειλεν πρὸς Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ
  english_pob_choice: he sent to Judas and his brothers
  chosen_korean: 유다와 그의 형제들에게 … 편지를 보냈습니다
  alternatives_korean:
  - 유다와 그의 형제들에게 사람을 보냈습니다
  - 유다와 그의 형제들에게 전갈을 보냈습니다
  - 유다와 그의 형제들에게 보냈습니다
  lexicon: ἀποστέλλω
  rationale: 동사는 ‘보내다’이지만, 뒤의 ‘속임수’와 ‘평화로운 말’이 구체적으로 전달 수단을 드러내므로 한국어에서는 ‘편지를 보냈습니다’로 자연스럽게 풀었습니다.
- source_word: μετὰ δόλου λόγους εἰρηνικοὺς
  english_pob_choice: deceitfully with peaceful words
  chosen_korean: 평화로운 말로 속이면서
  alternatives_korean:
  - 속임수로 평화로운 말을 하며
  - 평화로운 말로 기만하며
  - 평화로운 말을 내세워 속이며
  lexicon: δόλος + λόγοι εἰρηνικοί
  rationale: ‘평화로운 말’과 ‘속임수’의 긴장을 그대로 살려, 평화의 외양을 이용한 기만이라는 의미를 직접 드러냈습니다.
theological_decisions:
- issue: 니카노르의 평화 제안의 성격
  chosen_reading: 겉으로는 평화로운 말을 내세웠지만 실제로는 기만적인 접근으로 제시했습니다.
  alternative_readings:
  - 단순한 외교적 접촉
  - 중립적인 협상 시도
  rationale: δόλος가 분명히 들어 있으므로 이 장면은 평화 제스처가 아니라 의도적 속임수로 읽어야 합니다.
  doctrine_reference: 본문 내 서술적 대조
