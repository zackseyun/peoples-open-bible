translation:
  text: 'Therefore, brothers and sisters, let us repent[a] at once. Let us be sober-minded about what is good, for we are full of much foolishness and wickedness. Let us wipe away our former sins, and let us not be found to be people-pleasers. Let us not desire to please only one another, but also those who are outside, through our righteousness, so that the Name may not be blasphemed because of us.


    For the Lord says, “In every way my Name is blasphemed among all the Gentiles”; and again, “Woe to the one because of whom my Name is blasphemed.” How is it blasphemed? Because you do not do the things I desire.


    For when the Gentiles hear the oracles of God from our mouths, they marvel at their beauty and greatness. Then, when they discover that our works are not worthy of the words we speak, they immediately turn to blasphemy, saying that it is an empty story and a delusion.


    For when they hear from us that God says, “It is no credit to you if you love those who love you, but this is credit to you if you love your enemies and those who hate you,” when they hear these things, I say, they marvel at their extraordinary goodness. But when they see that we not only do not love us, they ridicule us, and the Name is blasphemed.'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - This provisional rendering is based on the supplied public-domain English witness.
  - The incomplete construction “we not only do not love us” is preserved without conjectural restoration.
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in the exhortation to moral change while there is time; preserve the authors own baptismal and ethical claims rather than harmonizing them. This reader text remains an adaptation of the recorded English witness, not a verbatim quotation or a newly verified translation of the ancient-language text. The witness is unchanged.
    reason: lexical_alternative
