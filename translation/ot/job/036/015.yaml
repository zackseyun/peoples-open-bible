id: JOB.36.15
reference: Job 36:15
source:
  edition: WLC
  text: יְחַלֵּ֣ץ עָנִ֣י בְ/עָנְי֑/וֹ וְ/יִ֖גֶל בַּ/לַּ֣חַץ אָזְנָֽ/ם׃
translation:
  text: He rescues the afflicted through their affliction[a] and opens their ears through distress.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “in their affliction,” treating suffering as the setting of rescue rather than its means.
    reason: alternative_reading
lexical_decisions:
- source_word: יְחַלֵּץ
  chosen: rescues
  alternatives:
  - delivers
  lexicon: HALOT
  rationale: The Piel of חלץ here carries the sense of drawing out or delivering from danger. 'Rescues' is clear modern English and preserves the active saving sense; 'delivers' is also possible but slightly more traditional/churchy in tone.
- source_word: עָנִי
  chosen: the afflicted
  alternatives:
  - the poor
  - the humble
  lexicon: HALOT
  rationale: Though עָנִי can denote the poor, in wisdom literature it often includes the sense of one who is afflicted or oppressed. Here the parallel with עָנְיוֹ ('his affliction') and לַחַץ ('oppression/distress') favors 'the afflicted' over a narrowly economic 'the poor'.
- source_word: בְעָנְיוֹ
  chosen: through their affliction
  alternatives:
  - in his affliction
  - through his misery
  lexicon: HALOT
  rationale: Represents the probable instrumental sense in idiomatic English.
- source_word: וְיִגֶל
  chosen: opens
  alternatives:
  - uncovers
  - reveals
  lexicon: HALOT
  rationale: From גלה, the Qal can mean uncover or reveal. With 'ear' as object, the idiom means to open the ear for hearing instruction or warning. 'Opens' communicates the idiomatic sense in natural English better than the more literal 'uncovers'.
- source_word: בַּלַּחַץ
  chosen: through distress
  alternatives:
  - in oppression
  - through distress
  - by distress
  lexicon: HALOT
  rationale: Preserves the pressure/distress sense without falsely requiring a named oppressor.
- source_word: אָזְנָם
  chosen: their ears
  alternatives:
  - his ear
  lexicon: HALOT
  rationale: The consonantal form with 3mp suffix is reflected in the provided morphology, yielding 'their ears.' This also fits the generic singular עָנִי used collectively. Some translations smooth to singular, but the supplied text supports the plural.
