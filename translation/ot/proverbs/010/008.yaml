id: PRO.10.8
reference: Proverbs 10:8
source:
  edition: WLC
  text: חֲכַם לֵ֭ב יִקַּ֣ח מִצְוֺ֑ת וֶ/אֱוִ֥יל שְׂ֝פָתַ֗יִם יִלָּבֵֽט־׃
translation:
  text: The wise in heart accept commands, but a babbling fool will come to ruin[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “will be cast down”; the Hebrew verb is rare.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  chosen: The wise in heart
  alternatives:
  - a wise man in heart
  - the wise of heart
  - a wise-hearted person
  lexicon: HALOT
  rationale: Preserves the heart image idiomatically without adding “man.”
- source_word: יִקַּח
  chosen: accepts
  alternatives:
  - receives
  - takes
  lexicon: HALOT
  rationale: The verb is literally 'takes,' but in context with 'commands' it idiomatically means receiving or accepting instruction. 'Accepts' best conveys willing reception rather than mere physical taking.
- source_word: מִצְוֺת
  chosen: commands
  alternatives:
  - commandments
  - instructions
  lexicon: HALOT
  rationale: The plural noun denotes authoritative directives. 'Commands' is more natural modern English than 'commandments' here, while still preserving the force of obligation better than the softer 'instructions.'
- source_word: אֱוִיל
  chosen: a foolish man
  alternatives:
  - a fool
  - an arrogant fool
  lexicon: HALOT
  rationale: The term denotes a morally and practically foolish person. 'Foolish man' keeps the parallel with the first colon's masculine singular and avoids making the line sound like a mere insult label.
- source_word: שְׂפָתַיִם
  chosen: of lips
  alternatives:
  - lipped
  - with his lips
  - talkative
  lexicon: HALOT
  rationale: Literally 'lips' in the dual. The phrase 'foolish man of lips' preserves the Hebrew idiom that marks him by speech. More interpretive renderings like 'talkative fool' capture part of the sense but go beyond the wording.
- source_word: יִלָּבֵט
  chosen: will come to ruin
  alternatives:
  - will come to ruin
  - will be thrown down
  - will be cast headlong
  lexicon: HALOT
  rationale: Broad natural rendering of a rare and uncertain verb, with a concrete alternative noted.
- source_word: אֱוִיל שְׂפָתַיִם
  chosen: a babbling fool
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English for a fool characterized by his speech; the literal form is retained in the note.
