  human_or_scholar_review: false
  review_summary: The current “a man of bribes” gives an overly specific and awkward construal of אִישׁ תְּרוּמוֹת. The noun ordinarily denotes contributions, offerings, or gifts; in this governmental antithesis it plausibly refers to demanded or extorted payments, but it does not itself specify bribes. “One who exacts gifts” supplies the implicit relation needed in English while retaining the source term’s broader sense better than “demands payments.” The marker belongs with this phrase. The note on generic “man” is unnecessary once English uses “one.”
