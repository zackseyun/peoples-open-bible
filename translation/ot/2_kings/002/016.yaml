id: 2KI.2.16
reference: 2 Kings 2:16
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
translation:
  text: Then they said to him, “Look, your servants have fifty able men. Please let them go and search for your master. Perhaps the Spirit of Yahweh[a] has carried him away and thrown him onto one of the mountains or into one of the valleys.” But he said, “Do not send them.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “the wind of Yahweh.” The Hebrew word translated “Spirit” can also mean “wind.”
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה נָא
  chosen: Look
  alternatives:
  - Look now
  lexicon: HALOT
  rationale: As a polite attention marker before the proposal, 'Look' is sufficient; the following 'Please' carries the appeal.
- source_word: יֵשׁ אֶת עֲבָדֶיךָ
  chosen: your servants have
  alternatives:
  - there are among your servants
  lexicon: HALOT
  rationale: The existential construction identifies available men among the servants. English expresses that relationship naturally with 'your servants have.'
- source_word: חֲמִשִּׁים אֲנָשִׁים
  chosen: fifty ... men
  alternatives:
  - fifty men
  lexicon: HALOT
  rationale: Straightforward numerical phrase; retained explicitly.
- source_word: בְּנֵי חַיִל
  chosen: able men
  alternatives:
  - strong men
  - capable men
  - valiant men
  lexicon: HALOT
  rationale: The idiom denotes capable or vigorous men suited to the search, not only physical strength.
- source_word: יֵלְכוּ נָא
  chosen: Please let them go
  alternatives:
  - Please let them go now
  - Let them go, please
  lexicon: HALOT
  rationale: The jussive with נָא expresses a polite request. English requires an implied permissive sense directed to Elisha, hence 'Please let them go.'
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  chosen: and search for your master
  alternatives:
  - and seek your master
  - and look for your lord
  lexicon: HALOT
  rationale: בקשׁ with direct object here means to seek/search for. אֲדֹנֶיךָ refers to Elijah as Elisha's master. 'Master' fits the disciple-teacher relationship better than 'lord' in English.
- source_word: פֶּן
  chosen: Perhaps
  alternatives:
  - lest
  lexicon: HALOT
  rationale: Here the particle introduces the speakers' uncertain explanation for Elijah's disappearance, not an outcome they seek to prevent.
- source_word: נְשָׂאוֹ רוּחַ יְהוָה
  chosen: the Spirit of Yahweh has carried him away
  alternatives:
  - the wind of Yahweh has carried him away
  lexicon: HALOT
  rationale: The context favors divine Spirit as agent, while the lexical wind sense remains footnoted.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Follows the project's stated default for the divine name.
- source_word: וַיַּשְׁלִכֵהוּ
  chosen: and thrown him
  alternatives:
  - and cast him
  - and hurled him
  lexicon: HALOT
  rationale: The verb means to throw/cast. 'Thrown him' works naturally after 'has carried him away' in English sequence.
- source_word: בְּאַחַד הֶהָרִים
  chosen: onto one of the mountains
  alternatives:
  - on one of the mountains
  lexicon: HALOT
  rationale: The throwing verb supplies directional motion, which English naturally represents with 'onto.'
- source_word: בְּאַחַת הַגֵּאָיוֹת
  chosen: into one of the valleys
  alternatives:
  - in one of the valleys
  - into one of the ravines
  lexicon: HALOT
  rationale: גיא denotes valley/ravine. 'Valleys' is more broadly accessible; 'into' pairs naturally with the idea of being thrown there.
- source_word: לֹא תִשְׁלָחוּ
  chosen: Do not send them
  alternatives:
  - You shall not send
  - Do not send
  lexicon: HALOT
  rationale: The 2mp prohibition is directed to the group making the request. Supplying 'them' clarifies the implied object from context.
