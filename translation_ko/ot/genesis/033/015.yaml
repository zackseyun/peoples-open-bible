  source_fidelity: 핵심 동사 אַצִּיגָה는 에서가 자기 일행 중 일부를 야곱 곁에 ‘남겨 두다/배치하다’라는 뜻입니다. 초안의 ‘당신과 함께 떠나게’는 그 사람들이 야곱과 함께 떠나는 것으로 방향을 바꾸므로 수정이 필요합니다. 야곱의 אֶמְצָא חֵן은 ‘호의를 얻다’라는 관용 표현으로 자연스럽게 옮겼습니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체를 유지하면서, 에서의 정중한 제안과 야곱의 공손한 사양을 자연스럽게 드러냅니다.
  terminology: אֲדֹנִי는 여기서 신적 칭호가 아니라 야곱이 에서에게 쓰는 사회적 존칭입니다. 따라서 ‘주님’보다 ‘주인님’이 원문의 대인 호칭을 더 분명히 보존합니다. ‘눈에 은혜를 입다’는 한국어에서 다소 부자연스러워 ‘호의를 얻다’로 옮겼습니다.
