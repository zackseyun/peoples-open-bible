revisions:
- from: 그들이 빵을 먹으려고 앉았는데, 눈을 들어 바라보니, 보라, 길르앗에서 오는 이스마엘 사람들의 대상이 있었고, 그들의 낙타들은 향품과 유향과 몰약을 싣고 이집트로 내려가고 있었습니다.[a][b][c]
  to: 그들이 앉아 빵을 먹고 있는데, 눈을 들어 보니, 보라, 길르앗에서 이스마엘 사람들의 상단이 오고 있었습니다. 그들의 낙타들은 고무수지와 발삼과 라다넘[a]을 싣고, 그것들을 이집트로 내려가서 가져가려 하고 있었습니다.
  rationale: 원문 물품명 가운데 צֳרִי를 ‘발삼’으로 바로잡고, 논쟁적인 לֹט는 라다넘으로 옮기되 각주에서 대안 식별을 밝혔습니다. 또한 상단의 낙타가 싣고 가는 화물을 이집트로 가져가려는 목적을 본문에 드러냈습니다. 기존 ‘빵’ 각주는 불필요한 설명이며 히브리어 표기도 부정확하여 삭제했습니다.
