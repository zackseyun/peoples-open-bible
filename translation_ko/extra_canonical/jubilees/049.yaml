  - verse: 1
    geez: ተዘከር፡ ትእዛዘ፡ ዘአዘዘከ፡ እግዚአብሔር፡ በእንተ፡ ፋሲካ፡ ከመ፡ ትግበር፡ በጊዜሁ፡ አመ፡ ዐሡሩ፡ ወረቡዑ፡ ለወርኅ፡ ቀዳማዊ፡ ከመ፡ ትጥብቍ፡ ዘእንበለ፡ ይምሰይ፡ ወከመ፡ ይብልዕዎ፡
  - verse: 2
    geez: በሌሊት፡ አመ፡ ምሴት፡ ዘዐሡር፡ ወሐሙስ፡ እምጊዜ፡ ዐርበተ፡ ፀሐይ። እስመ፡ በዛቲ፡ ሌሊት፡ ቀዳሜ፡ በዓል፡ ይእቲ፡ ወቀዳሜ፡ ፍሥሓ፡ ይእቲ፡ አንትሙ፡ ትነብሩ፡ ትበልዑ፡ ጳስካ፡ በግብጽ፡ ሐኵለነ፡ ኀያላቲሁ፡ ለመስተማ፡ ተፈነወ፡ ከመ፡ ይቅትል፡ ኵሎ፡ በኵረ፡ በምድረ፡ ግብጽ፡ እምበኵረ፡ ፈርዖን፡ እስከ፡ *በኵረ፡ ለእኪት፡ ፄዋዊት፡' እንተ፡ ውስተ፡ ማኅረጽ፡ ወላዕለ፡ እንስሳ*ሂ። ወዛቲ፡ ትእምርት፡ ዘወሀበ፡ እግዚአብሔር፡ ሎሙ፡ ውስተ፡ ኵሉ፡ ቤት፡ ዘርእዩ፡ ውስተ፡ አንቀጹ፡ ደመ፡ በግዕ፡ ዘዓመት፡ አይበኡ፡ ውስተ፡ ቤቱ፡ ለቀቲል፡ እላ፡ ይትዐደዉ፡ ከመ፡ ይድኅኑ፡ ኵሎሙ፡ እለ፡ ውስተ፡ ቤት፡ እስመ፡ ትእምርት፡ ደም፡ ውስተ፡ አንቀጹ። ወገብሩ፡ ኀይላቲሁ፡ ለእግዚአብሔር፡ ኵሎ፡ ዘመጠነ፡ አዘዞሙ፡ እግዚአብሔር፡ ወተዐደዉ፡ እምኵሉ፡ ደቂቀ፡ እስራኤል፡ ወኢቦአ፡ ላዕሌሆሙ፡ መቅሠፍት፡ ለአማስኖ፡ እምኔሆሙ፡ *ኵሎ፡ ነፍሰ፡ እምእጓስሳ፡ እስከ፡ ሰብእ፡ ወእስከ፡ ከልብ። ወኮነ፡ መቅሠፍት፡ በግብጽ፡ ጥቀ፡ ዐቢይ፡ ወአልቦ፡ ቤት፡ በግብጽ፡ ዘአልቦ፡ በ.ርካ፡ ውስቴታ፡ *ውቡካየ፡ ወዐሙታነ፡ ወኵሉ፡ እስራኤል፡ ይነብር፡ እንዘ፡ ይበልዕ፡ ሥጋ፡ ጰስካ፡ ወእንዘ፡ ይስቲ፡ ወይነ፡ ወይሴብሕ፡ ወይባርክ፡ ወያአኵት፡ እግዚአብሔር፡ አምላከ፡ አበዊሁ፡ ወ.ድልወ፡ ይከውን፡ ለወፂእ፡ እምአርዑተ፡ ግብጽ፡ ወእምቅኔ፡ እኪት። ወአንተኒ፡ ተዘከር፡ *ዛተ፡ ዕለተ፡ ኵሎ፡ መዋዕለ፡ ሕይወትከ፡ ወግበራ፡ *እምዓም፡ ለዓም፡ ኵሎ፡ *መዋዕለ፡ ሕይወትከ፡ ምዕረ፡ ለዓመት፡ በዕለቱ፡ በከመ፡ *ኵሉ፡ ሕጉ፡ ወኢ*ታስተሐልፍ፡ *ዕለተ፡ እምዕለት፡ ወእምወርኅ፡ ለወርኅ። እስመ፡ ሥርዐት፡ ዘለዓለም፡ ውእቱ፡ ወቅዱጽ፡ ውስተ፡ ጽላተ፡ ሰማይ፡ ለኵሉ፡ ውሉደ፡ እስራኤል፡ ከመ፡ ይግበርዎ፡ በኵሉ፡ ዓመት፡
