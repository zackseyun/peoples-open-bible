    unchanged: false
    changes_summary: Updated 'Yonah' to the standard English form 'Jonah'; rendered the participles more closely with 'having repented' and 'by their supplication'; replaced 'appeased God' with 'made atonement to God' to reflect ἐξιλάσαντο more accurately while keeping formal register.
translation:
  language: en
  text: Jonah announced to the people of Nineveh that destruction was coming. But they repented[a] of their sins and pleaded with God. In this way they made atonement to him and were saved, even though they were strangers to God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in the appeal to leave sin or faction, preserving separate return verbs and the writers own exhortation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Jonah proclaimed destruction to the Ninevites
  simplified_phrase: Jonah announced to the people of Nineveh that destruction was coming
  preserved_meaning: Jonah publicly warned Nineveh of impending destruction.
  reasoning_layer_used: source syntax and POB translation
  rationale: The recast sentence makes the warning natural in modern English without specifying details the source leaves unstated.
- pob_phrase: received salvation
  simplified_phrase: were saved
  preserved_meaning: They were delivered from the announced destruction.
  reasoning_layer_used: immediate context and POB translation
  rationale: The active biblical expression is replaced with its common direct equivalent.
translation_notes:
  risk_flags:
  - risk: “Made atonement to him” may remain unfamiliar to some readers.
    mitigation: It is retained because replacing it with “appeased” or “made peace” could weaken the POB’s audited lexical choice.
  - risk: “Destruction was coming” does not identify precisely what would be destroyed.
    mitigation: The source itself leaves the object implicit, so the wording preserves that breadth.
