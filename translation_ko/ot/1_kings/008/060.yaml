  to: 그리하여 세상의 모든 민족이 야훼께서 하나님이시며 그 밖에 다른 이가 없으심을 알게 하소서.
  rationale: The revision retains the prayer-contextual formal-polite ending while making both source assertions the unified content of what all peoples are to know. It preserves the earth-wide scope, the identification of YHWH as God, and the exclusive "no other" declaration.
