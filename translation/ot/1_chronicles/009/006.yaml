  from: 'And from the sons of Zerah: Jeuel and their brothers[a], six hundred and ninety.'
  to: 'From the descendants of Zerah: Jeuel. Those listed, together with their relatives, numbered 690[a].'
  rationale: Earlier lexical guidance attached the total to Jeuel’s group while preserving the plural 'their.' The three-part Judahite list and plural suffix favor a combined total, but the narrower understanding remains in a footnote.
