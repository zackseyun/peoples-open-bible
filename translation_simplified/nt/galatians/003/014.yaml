  preserved_meaning: Both clauses state distinct purposes connected to the preceding action.
  reasoning_layer_used: Lexical decision for ἵνα and immediate syntax
  rationale: Two sentences make the repeated purpose structure easier to follow.
- pob_phrase: the blessing of Abraham might come to the Gentiles
