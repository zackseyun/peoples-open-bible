base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: ko
  text: 내가 이스라엘 자손의 십일조를 레위 사람들에게 기업으로 주었으니, 곧 그들이 야훼께 드려 올리는 거제입니다. 그러므로 내가 그들에게 말하기를, ‘이스라엘 자손 가운데에서는 그들이 기업을 얻지 못할 것입니다.’ 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תרומה는 제의적으로 ‘들어 올려 바치는 것’이라는 뜻이 있어, 여기서는 ‘거제’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעְשַׂר / tithe
  english_pob_choice: the tithe
  chosen_korean: 십일조
  alternatives_korean:
  - 열의 하나
  - 헌납분
  lexicon: 십일조
  rationale: 율법 문맥에서 마עשר은 표준적으로 ‘십일조’가 가장 직접적이고 독자 친화적이며, 수량적 의미도 분명히 드러냅니다.
- source_word: יָרִימוּ / lift up
  english_pob_choice: lift up
  chosen_korean: 드려 올리는
  alternatives_korean:
  - 들어 올리는
  - 바치는
  lexicon: 드리다 / 올리다
  rationale: 히브리어 ‘들어 올리다’의 제의적 의미를 살리면서 한국어에서 제물·거제의 관용을 반영하기 위해 ‘드려 올리는’으로 옮겼습니다.
- source_word: תְּרוּמָה / contribution
  english_pob_choice: contribution
  chosen_korean: 거제
  alternatives_korean:
  - 헌물
  - 기여물
  lexicon: 거제
  rationale: תרומה는 제의적으로 ‘들어 바치는 것’이라는 뜻이 강하므로, 본문이 십일조를 성소 제물로 구별하는 흐름을 살려 ‘거제’로 옮겼습니다.
- source_word: נַחֲלָה / inheritance
  english_pob_choice: inheritance
  chosen_korean: 기업
  alternatives_korean:
  - 유산
  - 상속분
  lexicon: 기업
  rationale: 민수기-토라 문맥에서 נחלה는 토지 상속권과 언약적 분깃을 가리키므로, 전통적이면서도 문맥에 맞는 ‘기업’을 사용했습니다.
theological_decisions:
- issue: 레위인에게 주는 십일조의 성격
  chosen_reading: 레위인에게 주어진 십일조는 단순한 생계 지원이 아니라 야훼께 구별되어 바쳐진 제의적 몫입니다.
  alternative_readings:
  - 단순한 행정적 배분
  - 세속적 급여
  rationale: 본문은 십일조를 ‘야훼께 드려 올리는 거제’로 규정하고, 이를 레위인의 ‘기업’으로 주셨다고 말하므로 제의성과 소유권 이전을 함께 드러내야 합니다.
  doctrine_reference: 민수기 18장 레위인의 분깃과 성막 봉사 규정
