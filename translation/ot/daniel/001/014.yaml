id: DAN.1.14
reference: Daniel 1:14
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע לָ/הֶ֖ם לַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יְנַסֵּ֖/ם יָמִ֥ים עֲשָׂרָֽה׃
translation:
  text: So the steward agreed to their request and tested them for ten days.
  philosophy: dynamic
lexical_decisions:
- source_word: וַיִּשְׁמַע
  chosen: listened
  alternatives:
  - heard
  - obeyed
  - agreed to
  lexicon: HALOT
  rationale: שׁמע with לְ can mean 'listen to' or 'heed.' In context the official accepts Daniel's proposal, so 'listened to' preserves the verbal image while naturally implying he gave them a hearing. 'Obeyed' would overstate the social dynamic, and 'heard' is too weak.
- source_word: לָהֶם
  chosen: to them
  alternatives:
  - them
  lexicon: HALOT
  rationale: The preposition is retained in sense with 'listened to them,' matching English idiom and the Hebrew construction.
- source_word: לַדָּבָר הַזֶּה
  chosen: in this matter
  alternatives:
  - regarding this word
  - about this proposal
  - concerning this matter
  lexicon: HALOT
  rationale: דָּבָר can mean 'word,' 'matter,' or 'affair.' Here it refers to the specific request just made, so 'in this matter' is idiomatic and contextually precise without woodenly rendering 'word.'
- source_word: וַיְנַסֵּם
  chosen: tested them
  alternatives:
  - tried them
  - put them to the test
  lexicon: HALOT
  rationale: נסה in the Piel means to test or try. 'Tested them' is concise, natural, and fits the dietary trial context.
- source_word: יָמִים עֲשָׂרָה
  chosen: for ten days
  alternatives:
  - ten days
  lexicon: HALOT
  rationale: 'The accusative of duration is best rendered in English with ''for'': the test lasted ten days.'
