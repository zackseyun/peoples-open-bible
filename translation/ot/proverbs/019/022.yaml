id: PRO.19.22
reference: Proverbs 19:22
source:
  edition: WLC
  text: תַּאֲוַ֣ת אָדָ֣ם חַסְדּ֑/וֹ וְ/טֽוֹב רָ֝שׁ מֵ/אִ֥ישׁ כָּזָֽב־׃
translation:
  text: What makes a man desirable is his kindness[a], and a poor man is better than a liar.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, “What a man desires is faithful love.” The terse Hebrew permits either understanding; the word rendered “kindness” can also denote loyalty or faithful love.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּאֲוַת
  chosen: What is desired
  alternatives:
  - the desire of
  - a man's desire
  lexicon: HALOT
  rationale: 'The noun means ''desire'' or ''that which is desired.'' In this proverb the construct chain with אָדָם and the following חַסְדּוֹ is terse and somewhat ambiguous. Rendering it as ''What is desired'' brings out the likely predicative sense: the desirable thing in a person is the quality named next.'
- source_word: אָדָם
  chosen: a man
  alternatives:
  - a person
  - humankind
  lexicon: HALOT
  rationale: Here אָדָם refers to an individual human in a wisdom saying, not humanity collectively. Per the gender-accurate policy, 'man' is retained for the representative singular, while the sense is generic.
- source_word: חַסְדּוֹ
  chosen: his kindness
  alternatives:
  - his kindness
  - his loyalty
  - his covenant faithfulness
  lexicon: HALOT
  rationale: In this human relational setting, “kindness” is natural and preserves the term's breadth.
- source_word: וְטוֹב
  chosen: and ... is better
  alternatives:
  - but better is
  - and better is
  lexicon: HALOT
  rationale: The conjunction plus adjective introduces the comparative second line. English idiom requires supplying 'is better' to make the proverb readable while preserving the contrastive/comparative force.
- source_word: רָשׁ
  chosen: a poor man
  alternatives:
  - the poor
  - a poor person
  lexicon: HALOT
  rationale: The adjective/substantive denotes a poor person. Because the proverb uses representative masculine singular terms on both sides, 'a poor man' matches the source's form and parallelism.
- source_word: מֵאִישׁ
  chosen: than
  alternatives:
  - than a man
  - more than a man
  lexicon: HALOT
  rationale: The preposition מִן marks comparison, and with אִישׁ introduces the standard of comparison. In English the noun is naturally carried into the following phrase, yielding 'than a liar' or more explicitly 'than a lying man.'
- source_word: כָּזָב
  chosen: a liar
  alternatives:
  - a lying man
  - falsehood
  - one who is false
  lexicon: HALOT
  rationale: 'As a noun, כָּזָב denotes falsehood or deceit; in this construction after אִישׁ it is best understood as characterizing the person: ''a liar'' or ''a false man.'' ''A liar'' is concise and idiomatic.'
- source_word: תַּאֲוַת אָדָם חַסְדּוֹ
  chosen: What makes a man desirable is his kindness
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This gives the likely sense in idiomatic English while leaving the alternate construal noted.
