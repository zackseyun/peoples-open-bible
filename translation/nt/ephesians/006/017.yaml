  rationale: Within Paul's armor-of-God imagery, 'the sword of the Spirit' is best understood as the sword supplied by or belonging to the Holy Spirit, especially since the following clause identifies it with 'the word of God.' This preserves the theological force of divine enablement without importing more than the text states.
