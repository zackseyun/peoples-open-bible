  yaml_path: translation/ot/psalms/044/013.yaml
  text: You make us a reproach to our neighbors, a mockery and derision to those around us.
translation:
  language: ko
  text: 주께서 우리를 이웃들에게 치욕거리가 되게 하시고, 우리 주변 사람들에게 비웃음과 조롱거리가 되게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְכֹּר
  english_pob_choice: You sell
  chosen_korean: 파시며
  alternatives_korean:
  - 파십니다
  - 팔고 계십니다
  lexicon: HALOT
  rationale: 히브리어 미완료형은 탄식 시에서 현재적·진행적 느낌을 줄 수 있지만, 시편의 항변 맥락에서는 과거 서술처럼 들리는 동사도 자연스럽습니다. 여기서는 주어가 하나님인 직접 호소이므로 문맥의 탄식을 살려 ‘파시며’로 옮겼습니다.
- source_word: עַמְּךָ
  english_pob_choice: your people
  chosen_korean: 주의 백성
  alternatives_korean:
  - 주의 사람들
  - 주의 민족
  lexicon: HALOT
  rationale: עַם은 언약적·공동체적 의미의 ‘백성’이 가장 잘 드러납니다. ‘주의 백성’은 하나님과 이스라엘의 관계성을 보존하면서도 시적 호소에 어울립니다.
- source_word: בְלֹא הוֹן
  english_pob_choice: for no gain
  chosen_korean: 값없이
  alternatives_korean:
  - 아무 이익 없이
  - 재산도 없이
  - 헛되이
  lexicon: HALOT
  rationale: הוֹן은 재물·소유를 가리키므로 단순히 ‘아무것도 없이’보다 거래의 무가치함을 보이는 표현이 필요합니다. ‘값없이’는 판매의 대가가 실질적으로 없다는 뜻을 간결하게 살립니다.
- source_word: רִבִּיתָ
  english_pob_choice: you have not increased
  chosen_korean: 이익을 더하지 않으셨습니다
  alternatives_korean:
  - 늘리지 않으셨습니다
  - 증가시키지 않으셨습니다
  - 이윤을 얻지 않으셨습니다
  lexicon: HALOT
  rationale: פִּעל형 רבה는 ‘많게 하다, 증가시키다’의 뜻이므로, 여기서는 판매로 인한 이득의 증가가 없었다는 점을 드러내야 합니다. 한국어에서는 직역보다 의미가 분명한 ‘이익을 더하다’가 자연스럽고 문맥에도 맞습니다.
- source_word: בִּמְחִירֵיהֶם
  english_pob_choice: by their price
  chosen_korean: 그들의 값으로
  alternatives_korean:
  - 그들의 매입가로
  - 그들의 대가로
  - 그들의 가격으로
  lexicon: HALOT
  rationale: מְחִיר는 ‘값, 가격, 대가’이며 ב는 수단·기준의 뉘앙스를 가질 수 있습니다. ‘그들의 값으로’는 원문의 명사를 살리면서도 한국어 문장 안에서 자연스럽습니다.
theological_decisions:
- issue: 하나님께 백성을 '파신다'는 직설적 묘사
  chosen_reading: 탄식 시의 수사적 항의로, 언약 백성이 전쟁 패배를 당한 현실을 하나님께 책임 있게 호소하는 표현으로 그대로 유지했습니다.
  alternative_readings:
  - 완화하여 '버리셨습니다'로 옮김
  - 의역하여 '넘기셨습니다'로 옮김
  rationale: 원문은 판매 은유를 통해 패배와 수치를 강하게 표현하므로, 그 긴장을 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 시편의 탄식과 언약 신학
