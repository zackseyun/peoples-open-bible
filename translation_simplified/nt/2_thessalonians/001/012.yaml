  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus Christ.
  footnotes:
  - marker: a
    text: Or 'among you' for 'in you.' The Greek preposition can carry either nuance in context.
