id: PSA.89.50
reference: Psalms 89:50
source:
  edition: WLC
  text: זְכֹ֣ר אֲ֭דֹנָ/י חֶרְפַּ֣ת עֲבָדֶ֑י/ךָ שְׂאֵתִ֥/י בְ֝/חֵיקִ֗/י כָּל רַבִּ֥ים עַמִּֽים־׃
translation:
  text: Remember, Lord, the reproach your servants endure—how I bear in my heart the reproach from all the many peoples[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “I bear in my bosom all the many peoples.” The Hebrew is compressed; “the reproach” is supplied from the first part of the verse.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  chosen: Remember
  alternatives:
  - Call to mind
  lexicon: HALOT
  rationale: Imperative masculine singular from זכר, functioning as a direct plea to God. 'Remember' is the natural and idiomatic English equivalent in lament/prayer contexts.
- source_word: אֲדֹנָי
  chosen: Lord
  alternatives:
  - my Lord
  lexicon: HALOT
  rationale: The form here is the divine title אֲדֹנָי used in address. 'Lord' is the standard English rendering for the title and aligns with the project's default for cognate lordship titles. Although morphologically analyzable with a 1cs ending historically, in usage here it is the fixed divine title, not a possessive 'my lord'.
- source_word: חֶרְפַּת
  chosen: the reproach
  alternatives:
  - the taunt
  - the disgrace
  - the insult
  lexicon: HALOT
  rationale: חֶרְפָּה denotes reproach, scorn, or disgrace. 'Reproach' best preserves the covenantal and lament-register sense without narrowing it merely to spoken mockery.
- source_word: עֲבָדֶיךָ
  chosen: your servants
  alternatives:
  - your slaves
  lexicon: HALOT
  rationale: Though עבד can denote slave/servant, in prayer language for God's people 'servants' is the most natural and contextually appropriate rendering. The bonded-status nuance is not foregrounded here as it is in some Pauline uses of δοῦλος.
- source_word: שְׂאֵתִי
  chosen: how I bear
  alternatives:
  - I carry
  - my bearing
  lexicon: HALOT
  rationale: The first-person verb introduces the psalmist’s burden within the plea and is naturally represented by “how I bear.”
- source_word: בְּחֵיקִי
  chosen: in my bosom
  alternatives:
  - in my lap
  - close to my chest
  - within me
  lexicon: HALOT
  rationale: חֵיק literally refers to the bosom/lap. 'In my bosom' preserves the concrete Hebrew image of carrying something close on oneself, a common biblical idiom for personally bearing a burden or insult.
- source_word: כָּל רַבִּים עַמִּים
  chosen: the reproach of all the many peoples
  alternatives:
  - of all the many peoples
  - from all the many peoples
  lexicon: HALOT
  rationale: This preserves both כָּל (“all”) and the plural עַמִּים while making the Hebrew ellipsis intelligible in English; the possible source sense is appropriately noted.
