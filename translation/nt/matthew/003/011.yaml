  from: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[b][c]. He himself will baptize you in the Holy Spirit and fire.
  to: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I. I am not worthy to carry his sandals[b][c]. He himself will baptize you in the Holy Spirit and fire.
  rationale: Placing the relative pronoun 'whose' immediately after 'I' creates an awkward modifier attachment in English, making it sound momentarily as if 'whose' refers to 'I'. Breaking this into a new sentence or an independent clause (e.g., '...stronger than I, and I am not worthy...') clarifies the antecedent while preserving the meaning.
