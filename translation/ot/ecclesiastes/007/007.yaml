id: ECC.7.7
reference: Ecclesiastes 7:7
source:
  edition: WLC
  text: כִּ֥י הָ/עֹ֖שֶׁק יְהוֹלֵ֣ל חָכָ֑ם וִֽ/יאַבֵּ֥ד אֶת לֵ֖ב מַתָּנָֽה־׃
translation:
  text: For oppression makes a wise man foolish, and a bribe[a] destroys[c] the heart[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a gift.” Hebrew מַתָּנָה can denote a gift generally; in this context, alongside oppression and moral corruption, “bribe” is likely intended.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “heart” commonly includes judgment, understanding, and will.
    reason: cultural_note
  - marker: c
    text: A published transcription of Dead Sea Scroll 4Q109 reads a different verb, meaning 'distorts' or 'perverts,' with its final letter doubtful. The following words for heart and gift are editorially supplied, not surviving words. Both verbs can describe corrupted judgment. POB provisionally retains the Masoretic destruction verb; earliest wording remains unresolved.
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Surely
  - Because
  lexicon: HALOT
  rationale: Introduces an explanatory ground for the preceding thought; 'For' fits Qoheleth's argumentative flow better than the more emphatic 'Surely' or the more narrowly causal 'Because'.
- source_word: הָעֹשֶׁק
  chosen: oppression
  alternatives:
  - extortion
  - injustice
  lexicon: HALOT
  rationale: The noun denotes oppressive exploitation or extortionate abuse. 'Oppression' is broad enough to cover the social and moral force of the term and is the most natural English rendering here.
- source_word: יְהוֹלֵל
  chosen: makes ... foolish
  alternatives:
  - makes ... foolish
  - makes ... rave
  lexicon: HALOT
  rationale: In this wisdom saying the verb describes oppression causing a wise person to act irrationally or foolishly; “makes ... foolish” expresses this without over-specifying mental derangement.
- source_word: חָכָם
  chosen: a wise man
  alternatives:
  - the wise man
  - a wise person
  lexicon: HALOT
  rationale: The singular masculine is a representative proverbial singular. Retaining “man” follows the stated gender-accurate editorial policy.
- source_word: וִיאַבֵּד
  chosen: destroys
  alternatives:
  - ruins
  - perverts
  lexicon: HALOT
  rationale: The verb אבד in the causative means to cause to perish, ruin, or destroy. 'Destroys' preserves the severity and works naturally with 'the heart' as the object.
- source_word: אֶת לֵב
  chosen: the heart
  alternatives:
  - the mind
  - good sense
  lexicon: HALOT
  rationale: Hebrew 'heart' often includes inner judgment, will, and understanding. The literal rendering should be retained in the main text, while the broader sense can be explained by context rather than replacing the metaphor.
- source_word: מַתָּנָה
  chosen: a bribe
  alternatives:
  - a gift
  - a present
  lexicon: HALOT
  rationale: Although the noun can mean 'gift,' in wisdom literature and especially in this collocation it commonly carries the negative sense of a corrupting gift, i.e., a bribe. This best fits the parallel with oppression and the warning about moral corruption.
- source_word: מַתָּנָה
  chosen: a bribe
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The context favors a corrupting gift, hence “bribe,” but the broader sense “gift” remains a necessary footnoted alternative.
