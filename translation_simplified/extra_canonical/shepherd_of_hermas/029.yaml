translation:
  text: 'I.1. “I command you to guard chastity,” he says. “Do not let a thought about another man’s wife[1],
    any fornication or any such evil likenesses rise up in your heart[2]. If you do this, you commit a
    great sin. But if you always remember your own wife, you will never transgress[c].


    I.2. If this thought rises up in your heart, you will transgress. If other such evil things rise up,
    you commit sin too. This thought is a great sin for a servant of God. Anyone who carries out this
    evil deed brings death upon himself[3].


    I.3. So watch yourself. Keep away from this thought. Where modesty lives, lawlessness ought not to
    rise up in a righteous man’s heart.”


    I.4. I say to him, “Sir,[4] let me ask you a few things.” He says, “Speak.” I say, “Sir, if a man
    has a wife who is faithful in the Lord [and] finds her in adultery, does he sin by continuing to live
    with her[d]?”


    I.5. He says, “As long as he does not know, he does not sin. But if he learns of her sin, and she
    does not repent[b] but keeps committing fornication, and he continues to live with her, he becomes
    guilty of her sin. He shares in her adultery.”


    I.6. I say, “Sir, what should the husband do if his wife keeps giving in to this passion?” He says,
    “Let him divorce her and remain by himself. But if he divorces her and marries another woman, he too
    commits adultery.”


    I.7. I say, “Sir, after the wife is divorced, if [the wife] repents and wants to return to her own
    husband, will she not be received?”


    I.8. He says, “Indeed, if the husband does not receive her, he sins and brings a great sin upon himself.
    The one who has sinned and is repenting must be received, but not repeatedly[5]. For the servants
    of God, repentance is one[6]. So because of repentance, the man ought not to marry. This rule applies
    to both woman and man.”


    I.9. He says, “Adultery includes more than defiling one’s flesh. Whoever makes images as the nations
    do[8] also commits adultery. So if someone keeps doing such deeds and does not repent, keep away from
    him. Do not live with him. Otherwise you too share in his sin.”


    I.10. “For this reason, you were commanded to remain by yourselves[7], whether man or woman. In cases
    like these, there can be repentance.”


    I.11. He says, “I do not give an occasion for this practice to happen this way. My purpose is that
    the one who has sinned should sin no longer. As for his former sin, there is One who is able to give
    healing[9]. He is the One who has authority over all.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: “Another man’s wife” (γυναικὸς ἀλλοτρίας) is a common idiom for a woman belonging to another,
      i.e., a married woman not one’s own. The wife/fornication imagery is retained; the translation does
      not equate an unwanted thought with the carried-out deed distinguished in2.
    reason: cultural_note
  - marker: '2'
    text: The phrase “rise up upon the heart” reflects the Greek idiom ἀναβαίνειν ἐπὶ τὴν καρδίαν, a vivid
      picture of a thought’s ascent into the inner life.
    reason: cultural_note
  - marker: '3'
    text: “Brings death upon himself” translates κατεργάζομαι + θάνατος; alternatively, “works out death
      for himself.”
    reason: lexical_alternative
  - marker: '4'
    text: Rendered “Sir” (Κύριε) to reflect respectful address to the shepherd; alternatively “Lord.”
    reason: lexical_alternative
  - marker: '5'
    text: “Not repeatedly” (μὴ ἐπὶ πολὺ) could also be read “not for long,” but the context (μετάνοιά
      ἐστιν μία, “repentance is one”) suggests limitation of frequency rather than duration. AthosPlateVline27has
      me epi poly; Sinaiticus29.8has a spelling poly(n). Vulgata40has non saepe, not often; Palatina79has
      non ad singula, not at each instance. The working frequency reading is retained alongside the duration
      alternative; no modern penitential rule is added.
    reason: lexical_alternative
  - marker: '6'
    text: Repentance is one translates metanoia estin mia, preserving the author’s stated limitation rather
      than replacing it with an unlimited formula. Sinaiticus29.8, AthosPlateVline27and Vulgata40retain
      one repentance; Palatina79expands to one forgiveness of repentance. Do not import a later discipline
      or make this chapter a comprehensive modern doctrine.
    reason: cross_reference
  - marker: '7'
    text: “To remain by yourselves” (ἐφ᾽ ἑαυτοῖς μένειν) idiomatically means to remain unmarried/single
      in this context, preserving space for the other’s repentance. The reason in10is explicitly the possibility
      of repentance. Palatina81expands to keeping themselves after divorce; the working Greek applies
      to either sex without adding another exception.
    reason: cultural_note
  - marker: '8'
    text: Makes images as the nations do follows the current working homoiomata wording. An alternative
      is doing things like the nations, reflected in Palatina79’s doing similar things to worldly people
      called gentiles. Vulgata40has simulacrum facit, makes an image. AthosPlateVline28lacks tois ethnesin,
      while Sinaiticus29.9includes it. The image-making/idolatry interpretation is therefore disclosed,
      not presented as the only possible sense or inserted in place of the source. The condition of persistence
      without repentance and the warning against sharing the sin remain.
    reason: cross_reference
  - marker: b
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: '9'
    reason: textual_variant
    text: The working Greek includes the ability to give healing. Sinaiticus’s first-hand text proceeds
      directly to the one who has authority; its corrections ca and d supply the healing clause (project
      XML, Hermas29.11). AthosLake1907PlateVline32and both Latin versions (Vulgata40,Palatina81) include
      healing. Vulgata promises a remedy, whereas the working Greek states ability; the English retains
      ability rather than importing that promise. The purpose no longer to sin is explicit. These are
      bounded transcription/edition comparisons, not original-photo or independent scholarship certification.
  - marker: c
    reason: textual_variant
    text: Remember your own wife in1is the working Greek, AthosPlateVlines16–17, Sinaiticus29.1and Palatina77.
      Vulgata39instead says remember the Lord always at all hours. The working wording is retained. Sinaiticus
      first-hand has wickedness (ponerias) where the working source has fornication; ca/d give porneias.
      Correctors are not additional independent manuscripts.
  - marker: d
    reason: textual_variant
    text: The working4has bracketed and, and7bracketed the wife; the English displays these supplied constituents.
      The bracketed Greek article in2is absorbed by English your heart without a separate added article.
      These are the working edition’s critical marks, not punctuation in manuscripts. The adultery question
      and the ignorance/knowledge conditions are retained. Sinaiticus29.5and7contain unreadable letters,
      so not every condition/pronoun is claimed as pristine first-hand ink. Palatina79prints se in6as
      an editorial addition absent its codex.
lexical_decisions:
- source_word: Ἐντέλλομαί
  chosen: I am commanding
  alternatives:
  - I command
  - I charge
  lexicon: BDAG
  rationale: Present-tense imperative nuance in direct speech; “command” preserves force of entellomai.
- source_word: φυλάσσειν
  chosen: to guard
  alternatives:
  - to keep
  - to observe
  lexicon: BDAG
  rationale: Active, vigilant sense fits moral exhortation; “guard chastity” keeps concrete ethical imagery.
- source_word: ἁγνεία
  chosen: chastity
  alternatives:
  - purity
  lexicon: BDAG
  rationale: In sexual-ethics context, “chastity” is more specific than generic “purity” and matches early
    Christian paraenesis.
- source_word: ἀναβαίνειν ἐπὶ τὴν καρδίαν
  chosen: rise up upon the heart
  alternatives:
  - enter the heart
  - come into the heart
  lexicon: BDAG
  rationale: Preserves the spatial metaphor of rising up onto the heart, retaining Hermas’s vivid idiom.
- source_word: γυναικὸς ἀλλοτρίας
  chosen: another man’s wife
  alternatives:
  - another’s wife
  - a woman belonging to another
  lexicon: BDAG
  rationale: Idiom commonly denotes a married woman belonging to someone else; “another man’s wife” is
    clear.
- source_word: πορνεία
  chosen: fornication
  alternatives:
  - sexual immorality
  - unchastity
  lexicon: BDAG
  rationale: Hermas’s concrete moral register favors the specific traditional term over the broader modern
    “sexual immorality.”
- source_word: ὁμοιώματα (πην.)
  chosen: likenesses / images
  alternatives:
  - forms
  - representations
  lexicon: BDAG
  rationale: In v.1 the general sense “likenesses” (evil models/images) fits; in v.9 with ποιέω and ἔθνη,
    “images” (idols) is appropriate. We render contextually but note the lexical unity.
- source_word: ἁμαρτία ἐργάζῃ
  chosen: commit a great sin
  alternatives:
  - work a great sin
  - do a great sin
  lexicon: BDAG
  rationale: English idiom prefers “commit” for sin while retaining the gravity of the act.
- source_word: διαμαρτάνω
  chosen: transgress
  alternatives:
  - go astray
  - err completely
  lexicon: BDAG
  rationale: Legal-moral nuance suits Hermas’s paraenetic tone better than the vaguer “go astray.”
- source_word: ἐνθύμησις
  chosen: thought
  alternatives:
  - inward thought
  - consideration
  lexicon: BDAG
  rationale: Plain “thought” is accurate and readable; context supplies the inwardness.
- source_word: δοῦλος
  chosen: servant
  alternatives:
  - bondservant
  - slave (bonded-status nuance)
  lexicon: BDAG
  rationale: Current project policy uses reader-facing servant. Bonded status, belonging and obligation
    to God remain contextual nuance; they do not replace the chosen reader term.
- source_word: θάνατον ἑαυτῷ κατεργάζεται
  chosen: brings death upon himself
  alternatives:
  - works out death for himself
  - produces death for himself
  lexicon: BDAG
  rationale: Idiomatic English while preserving causal force; footnoted alternative reflects the “work
    out” nuance.
- source_word: σεμνότης
  chosen: modesty
  alternatives:
  - dignity
  - gravity
  lexicon: BDAG
  rationale: In a sexual-ethics context “modesty” communicates both moral seriousness and restraint.
- source_word: ἀνομία
  chosen: lawlessness
  alternatives:
  - iniquity
  - wickedness
  lexicon: BDAG
  rationale: Maintains standard moral-legal category without theological overtones beyond the Greek.
- source_word: Κύριε (voc.)
  chosen: Sir
  alternatives:
  - Lord
  - Master
  lexicon: BDAG
  rationale: Here a respectful address to the angelic shepherd rather than a theophoric title; “Sir” preserves
    register.
- source_word: πιστὴν ἐν Κυρίῳ
  chosen: faithful in the Lord
  alternatives:
  - a believer in the Lord
  - faithful to the Lord
  lexicon: BDAG
  rationale: Echoes early-Christian idiom identifying believers; keeps compactness and intertextual flavor.
- source_word: συνζῇ
  chosen: live together with
  alternatives:
  - cohabit with
  - continue living with
  lexicon: BDAG
  rationale: Literal yet clear for the marital cohabitation context.
- source_word: ἔνοχος γίνεται τῆς ἁμαρτίας αὐτῆς
  chosen: he becomes guilty of her sin
  alternatives:
  - he is liable for her sin
  - he shares in her sin
  lexicon: BDAG
  rationale: “Becomes guilty of” closely matches ἔνοχος + genitive; later clause covers “share” language.
- source_word: δεχθῆναι τὸν ἡμαρτηκότα καὶ μετανοοῦντα
  chosen: to receive the one who has sinned and is repenting
  alternatives:
  - to receive the one who has sinned and is reorienting
  - to receive the one who has sinned and is repenting
  - to accept the sinner who repents
  - to take back the one who sinned and repents
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial
    assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: μὴ ἐπὶ πολὺ
  chosen: not repeatedly
  alternatives:
  - not for long
  - not to excess
  lexicon: BDAG
  rationale: In context of repentance frequency, “not repeatedly” best conveys restriction on multiple
    repentances.
- source_word: μετάνοιά ἐστιν μία
  chosen: repentance is one
  alternatives:
  - reorientation is one
  - repentance is one
  - there is one repentance
  - only one repentance
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial
    assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: οὐκ ὀφείλει γαμεῖν
  chosen: ought not to marry
  alternatives:
  - is not to marry
  - should not marry
  lexicon: BDAG
  rationale: Captures moral obligation without legalism; context implies marrying another.
- source_word: πρᾶξις… κεῖται
  chosen: this rule is laid upon
  alternatives:
  - this practice lies upon
  - this regulation is set upon
  lexicon: BDAG
  rationale: “Rule” communicates normative force of πρᾶξις here; κεῖται expresses being set/laid upon
    both sexes.
- source_word: μιάνῃ τὴν σάρκα
  chosen: defiles his flesh
  alternatives:
  - pollutes his body
  - stains his flesh
  lexicon: BDAG
  rationale: Retains ritual-moral coloration of μιάνω in sexual sin contexts.
- source_word: τὰ ὁμοιώματα ποιῇ τοῖς ἔθνεσιν
  chosen: makes images as the nations do
  alternatives:
  - makes likenesses like the Gentiles
  - fashions idols like the nations
  lexicon: BDAG
  rationale: Explicitly names image-making; “nations” preserves ethnic contrast; idolatry sense noted
    in footnote.
- source_word: ἐμμένῃ
  chosen: persists
  alternatives:
  - continues
  - remains (in)
  lexicon: BDAG
  rationale: Moral perseverance in wrongdoing is in view.
- source_word: ἀπέχου
  chosen: keep away
  alternatives:
  - abstain
  - avoid
  lexicon: BDAG
  rationale: Direct imperative with personal object; “keep away” is clear and forceful.
- source_word: μὴ συνζῆθι
  chosen: do not live together with
  alternatives:
  - do not cohabit with
  - do not share life with
  lexicon: BDAG
  rationale: Parallels earlier συνζῇ; maintains consistency.
- source_word: μέτοχος
  chosen: sharer
  alternatives:
  - participant
  - partner
  lexicon: BDAG
  rationale: “Sharer” mirrors the genitive relation to sin and keeps the communal warning sharp.
- source_word: ἐφ᾽ ἑαυτοῖς μένειν
  chosen: to remain by yourselves
  alternatives:
  - to remain unmarried
  - to stay alone
  lexicon: BDAG
  rationale: Literal phrase retained; footnote clarifies marital sense as “unmarried/single.”
- source_word: ἴασιν δοῦναι
  chosen: to give healing
  alternatives:
  - to grant healing
  - to provide cure
  lexicon: BDAG
  rationale: Hermas’s pastoral-soteriological imagery is medical; “healing” preserves metaphor.
- source_word: ὁ ἔχων πάντων τὴν ἐξουσίαν
  chosen: the One who has authority over all
  alternatives:
  - the One holding authority over all
  - the One who rules all
  lexicon: BDAG
  rationale: Keeps titular cadence and agency without prematurely naming God in the text.
