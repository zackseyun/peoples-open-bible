translation:
  language: ko
  text: 그리고 피째 먹는 사람처럼 되지 마십시오. 그들이 여러분 앞에서 피를 먹지 않도록 조심하십시오. 피를 덮으십시오. 이는 내가 여러분과 여러분의 자녀에게, 그리고 모든 육체와 함께 증언하도록 명령받았기 때문입니다.
  philosophy: optimal-equivalence
