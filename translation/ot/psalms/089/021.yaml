  from: my hand will be established
  to: my hand will stand firm
  rationale: The collocation 'established with [a person]' is slightly unnatural in English. While תִכּוֹן (Niphal of כון) can mean 'be established,' its core sense is to be firm or steadfast. In combination with עִם ('with'), a rendering like 'will stand firm' (as noted in footnote 'a') is more idiomatic and arguably captures the nuance of enduring support more vividly than the slightly abstract 'be established.'
