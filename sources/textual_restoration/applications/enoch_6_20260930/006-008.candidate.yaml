translation:
  text: These are their leaders of groups of ten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “their chiefs of tens.” Charles prints an asterisk before the word rendered “leaders.” This sentence is present after the list of names, but no verse-8 numeral appears before it; numbering it as verse 8 is an editorial division.
    reason: lexical_alternative
lexical_decisions:
- source_word: እሉ፡ እሙንቱ
  chosen: These are
  alternatives:
  - These were
  rationale: Preserves the verse’s identifying formula without reproducing both Ge’ez pronouns separately.
- source_word: '*ሀበይተ'
  chosen: leaders of tens
  alternatives:
  - chiefs
  - heads
  rationale: The printed final sentence describes their grouped leadership; the verse boundary is editorial.
- source_word: ዓሠርት፡ ዚአሆሙ
  chosen: their groups of ten
  alternatives:
  - their tens
  rationale: Renders the number and possessive while making the implied units of ten intelligible in English.
theological_decisions:
- issue: Status of the listed Watchers
  chosen_reading: Leaders of groups of ten
  alternative_readings:
  - Members of a formal celestial hierarchy
  rationale: The verse identifies a leadership arrangement but does not establish a broader doctrine of angelic ranks.
