  meaning: While campaigning against Ptolemy in Egypt, Antiochus heard that Jerusalem was delighted by a report of his death and quickly marched against its people.
  meaning_decisions:
  - source_phrase: φήμης διαδοθείσης περὶ τοῦ τεθνάναι αὐτόν
    prior_rendering: when a report had spread that he was dead
    new_rendering: because a report of his death had spread
    rationale: The report explains the people's joy, not merely its timing; the natural English clause makes that understood relationship explicit.
  - source_phrase: ὡς ἔνι μάλιστα χαίροιεν
    prior_rendering: were rejoicing as much as possible
    new_rendering: were overjoyed
    rationale: The Greek idiom intensifies their joy; it does not describe an effort to rejoice to the limit of their ability.
  - source_phrase: ἐπʼ αὐτοὺς ἀνέζευξεν
    prior_rendering: marched up against them
