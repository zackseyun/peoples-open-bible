id: PSA.125.1
reference: Psalms 125:1
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
translation:
  text: 'Those who trust in Yahweh are like Mount Zion: it cannot be shaken; it remains forever.'
  philosophy: dynamic
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  chosen: A Song of Ascents
  alternatives:
  - A song of goings up
  - A pilgrim song
  lexicon: HALOT
  rationale: Traditional superscription formula in Psalms 120–134. 'Ascents' preserves the lexical sense of מַעֲלוֹת and the established literary designation without over-paraphrasing.
- source_word: הַבֹּטְחִים
  chosen: Those who trust
  alternatives:
  - Those who are trusting
  - The ones trusting
  lexicon: HALOT
  rationale: The participle denotes a class of people characterized by trust. 'Those who trust' is natural English and preserves the ongoing/general force.
- source_word: בַּיהוָה
  chosen: in Yahweh
  alternatives:
  - in Yahweh
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: כְּהַר צִיּוֹן
  chosen: like Mount Zion
  alternatives:
  - as Mount Zion
  lexicon: HALOT
  rationale: כְּ marks comparison. 'Mount Zion' is the standard English transliteration of the place name and preserves the simile.
- source_word: לֹא יִמּוֹט
  chosen: it cannot be shaken
  alternatives:
  - it will not be moved
  - it will not totter
  lexicon: HALOT
  rationale: This is a natural rendering of the stability image; “will not be moved” remains a legitimate more literal alternative.
- source_word: לְעוֹלָם יֵשֵׁב
  chosen: it remains forever
  alternatives:
  - it sits forever
  - it abides forever
  - it dwells forever
  lexicon: HALOT
  rationale: With לְעוֹלָם, יָשַׁב communicates enduring continuance; “remains forever” is natural English.
