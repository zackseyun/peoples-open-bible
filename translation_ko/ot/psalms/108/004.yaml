  text: 이는 주님의 한결같은 사랑은 하늘보다 크고, 주님의 신실하심은 구름에까지 이르기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹדְךָ
  english_pob_choice: I will give thanks to you
  chosen_korean: 제가 주님께 감사드리고
  alternatives_korean:
  - 제가 주님을 찬양하고
  - 제가 주님을 고백하고
  lexicon: HALOT
  rationale: 시편의 감사 문맥에서 ידה 동사는 ‘감사하다’의 의미가 가장 자연스럽고, 직접목적어와 2인칭 대상을 분명히 살릴 수 있습니다.
- source_word: בָעַמִּים
  english_pob_choice: among the peoples
  chosen_korean: 백성들 가운데에서
  alternatives_korean:
  - 민족들 가운데에서
  - 사람들 가운데에서
  lexicon: HALOT
  rationale: עַמִּים의 복수성을 살리면서, 뒤의 אֻמִּים과 평행을 이루는 국제적 범위를 한국어로 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 하나님의 이름을 원칙적으로 ‘야훼’로 옮기지만, 이 절은 감탄사적 호격보다 한국어 예배문체의 직접 호명으로 자연스럽게 읽히는 ‘주님’을 본문에 두고, 신학적 결정을 통해 YHWH 표기 원칙과의 긴장을 설명합니다.
- source_word: וַאֲזַמֶּרְךָ
  english_pob_choice: and I will sing praise to you
  chosen_korean: 그리고 민족들 가운데에서 주님께 찬양을 드리겠습니다
  alternatives_korean:
  - 그리고 주님께 노래하겠습니다
  - 그리고 주님께 음악으로 찬양하겠습니다
  lexicon: HALOT
  rationale: זמר의 찬양-노래 의미를 살려 단순히 ‘노래하다’보다 ‘찬양을 드리다’로 옮기면 예배적 성격이 분명해집니다.
theological_decisions:
- issue: יהוה의 한국어 표기와 호격 처리
  chosen_reading: 본문은 한국어 예배문체에 맞추어 ‘주님’으로 읽되, 원문 고유명사 YHWH의 번역 원칙은 별도의 주석·정책 층위에서 ‘야훼’로 유지합니다.
  alternative_readings:
  - 본문에 ‘야훼’ 직접 표기
  - 전통 번역처럼 ‘여호와’ 표기
  rationale: 이 구절은 호격 구조가 강하고 반복되는 평행구 가운데 자연스러운 기도/찬양 문체가 중요하므로, 본문 가독성을 우선하면서도 원문 이름 번역 원칙과 충돌하지 않도록 처리합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
