  text: Swallow them up[a], Lord; divide their tongue[b], for I have seen violence and strife in the city.
  footnotes:
  - marker: a
    text: Or 'I would hurry to an escape' or 'let me hasten to a refuge.' The Hebrew form conveys urgent personal resolve or desire.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 혼란스럽게 하소서,[a] 주님. 그들의 말을 갈라놓으소서.[b] 내가 그 성읍에서 폭력과 다툼을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 삼키소서’ 또는 ‘그들을 멸하소서’. 히브리어 동사는 문자적으로 ‘삼키다’ 또는 ‘멸하다’라는 뜻을 가질 수 있으나, 이어지는 ‘그들의 말을 갈라놓으소서’와 함께 원수들의 계획과 소통을 혼란에 빠뜨려 달라는 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그들의 혀를’. 여기서는 그들의 말 또는 언어, 곧 서로 소통하는 능력을 가리킵니다.
    reason: lexical_alternative
