  to: 그분께서 세상에 있는 모든 것을 낮추시고 그의 나라의 왕좌에 영원히 평안 가운데 앉으신 후에, 기쁨이 드러나고 안식이 나타날 것입니다.[a]
  rationale: 의미를 바꾸지 않고 소유 표현과 어순만 다듬었습니다. 영어 감사본의 ‘all that is in the world’에 맞추어 ‘세상에 있는 모든 것’으로 옮겼고, ‘forever’가 왕좌에 앉아 계심을 수식하도록 조정했습니다. 제공된 자료에는 [a]의 내용이 없으므로 추정하여 각주를 만들지 않았습니다.
