translation:
  language: en
  text: The men of Nineveh will rise up in the judgment with this generation and condemn it, because they repented[b] at Jonah’s preaching. And look, something greater than Jonah is here.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or "one greater than Jonah is here." The Greek uses a neuter expression, literally "something greater than Jonah."
    reason: alternative_reading
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
