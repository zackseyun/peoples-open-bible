  from: For by passing wisdom by[a], they were harmed not only by not knowing what is good, but they also left behind for life a memorial of their folly, so that in the things in which they went astray they might not even be able to escape notice.
  to: For by disregarding wisdom, they not only suffered from ignorance of what is good but also left the world a memorial of their folly, so that their errors could not go unnoticed.
  rationale: The lexical rationale and earlier note already recognized that βίος refers here to the world of human life; I bring that meaning into the main text. The earlier explanations also support rendering the passing-by idiom as disregard and the final clause as the enduring visibility of their errors.
