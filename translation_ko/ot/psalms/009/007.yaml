  yaml_path: translation/ot/psalms/009/007.yaml
  text: But Yahweh sits enthroned[a] forever; he has established his throne for judgment.[b]
  footnotes:
  - marker: a
    text: Hebrew “sits”; “sits enthroned” reflects the royal setting made explicit by “his throne” in the following clause.
    reason: lexical_alternative
  - marker: b
    text: Or “he has prepared his throne for justice.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 야훼께서는 영원히 보좌에 앉아 계시며[a], 심판을 위하여 자신의 보좌를 굳게 세우셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘앉아 계신다’입니다. 문맥의 왕적·재판적 의미를 드러내기 위해 ‘보좌에 앉아 계시며’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘심판을 위하여 자신의 보좌를 마련하셨습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: הָאוֹיֵב
