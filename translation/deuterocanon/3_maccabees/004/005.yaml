translation:
  text: For an old man with a head full of gray hair was driven along at a hurried pace, though he was stooped and his feet were weak with age. He stumbled as he was violently pushed along[a], with no respect at all shown for his dignity.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The compressed Greek may describe being violently knocked down rather than stumbling under violent pressure.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγετο
  chosen: was being led along
  alternatives:
  - was led
  - was driven along
  lexicon: LSJ
  rationale: Imperfect/passive sense suggests ongoing action in the scene, not a simple completed event. 'Led along' preserves the coercive movement without overinterpreting the agent.
- source_word: γέρων
  chosen: old man
  alternatives:
  - elder
  - aged man
  lexicon: LSJ
  rationale: The term denotes an elderly male individual here, not an office-holder. 'Old man' is the most natural and direct rendering.
- source_word: πλήρης πολιᾶς
  chosen: full of gray hair
  alternatives:
  - white-haired
  - full of hoary hair
  lexicon: LSJ
  rationale: The phrase vividly emphasizes visible old age. 'Full of gray hair' is idiomatic modern English while preserving the image.
- source_word: πεπυκασμένος
  chosen: bent over
  alternatives:
  - stooped
  - hunched over
  lexicon: LSJ
  rationale: In context with ἐπικύφων and the following phrase about weakness in the feet, the participle contributes to the picture of bodily compression and frailty. 'Bent over' is clear modern English.
- source_word: τὴν ἐκ τοῦ γήρως νωθρίτητα ποδῶν
  chosen: by the weakness in his feet that comes with age
  alternatives:
  - by the sluggishness of his feet from old age
  - by age-born feebleness in his feet
  lexicon: LSJ
  rationale: νωθρίτης conveys dullness, sluggishness, or feebleness; in bodily context 'weakness' communicates the sense naturally. The genitive and prepositional phrase are preserved in sense.
- source_word: ἐπικύφων
  chosen: bent over
  alternatives:
  - stooping
  - bowed down
  lexicon: LSJ
  rationale: This participle clearly depicts a stooped posture. It overlaps semantically with the previous participial description, so the English compresses the image into natural phrasing while retaining the physical picture.
- source_word: ἀνατροπῆς ὁρμῇ βιαίας
  chosen: driven by the violent force of being thrown down
  alternatives:
  - by the violent rush of a fall
  - by the violent impulse of overthrow
  lexicon: LSJ
  rationale: The phrase is difficult, but it most naturally conveys violent compulsion associated with being knocked down or forced into stumbling. 'Driven by the violent force of being thrown down' preserves the harsh coercion without pretending greater precision than the Greek allows.
- source_word: ἁπάσης αἰδοῦς ἄνευ
  chosen: without any regard for all dignity
  alternatives:
  - without any shame
  - without all decency
  - with no respect for propriety
  lexicon: LSJ
  rationale: αἰδώς can denote shame, reverence, or sense of propriety. Here the point is the utter disregard shown toward the old man's honorable dignity. The English brings out that social-moral nuance.
- source_word: πρὸς ὀξειαν καταχρώμενος πορείαν
  chosen: making use of a swift march
  alternatives:
  - being forced into a rapid pace
  - using a hurried gait
  lexicon: LSJ
  rationale: καταχρώμενος with πορείαν suggests being made to employ or resort to a certain manner of movement. 'Swift march' keeps the unnatural speed imposed on a frail man, though 'hurried gait' is also possible.
