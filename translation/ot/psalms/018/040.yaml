id: PSA.18.40
reference: Psalms 18:40
source:
  edition: WLC
  text: וְֽ/אֹיְבַ֗/י נָתַ֣תָּה לִּ֣/י עֹ֑רֶף וּ֝/מְשַׂנְאַ֗/י אַצְמִיתֵֽ/ם׃
translation:
  text: You made my enemies turn their backs and flee; I destroyed those who hated me.
  philosophy: dynamic
lexical_decisions:
- source_word: אֹיְבַי
  chosen: my enemies
  alternatives:
  - those hostile to me
  - my foes
  lexicon: HALOT
  rationale: Standard rendering of אֹיֵב with first-person singular suffix. 'Enemies' is the most natural modern English equivalent and preserves the adversarial sense.
- source_word: נָתַתָּה לִּי
  chosen: you made ... turn
  alternatives:
  - you set before me
  - you delivered to me
  - you gave me
  lexicon: HALOT
  rationale: In the idiom 'give someone the back/neck,' God causes the enemies to turn in flight.
- source_word: עֹרֶף
  chosen: their backs
  alternatives:
  - the back of the neck
  - the backs
  - the necks
  lexicon: HALOT
  rationale: The noun is literally neck or back of the neck; in this idiom it represents the enemies turning their backs in flight.
- source_word: וּמְשַׂנְאַי
  chosen: those who hated me
  alternatives:
  - my haters
  - those who were against me
  lexicon: HALOT
  rationale: From שׂנא, 'to hate,' with first-person singular suffix. 'Those who hated me' is natural English and preserves the participial force referring to a class of opponents.
- source_word: אַצְמִיתֵם
  chosen: I destroyed
  alternatives:
  - I wiped them out
  - I silenced them
  - I annihilated them
  lexicon: HALOT
  rationale: Hiphil of צמת conveys causing to perish, exterminate, or destroy. 'I destroyed' is strong without sounding hyperbolic in modern English. The object pronoun is represented by the following phrase 'those who hated me,' so an additional 'them' is unnecessary in English.
