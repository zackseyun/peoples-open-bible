  from: And you shall have a place outside the camp[a], and you shall go out there, outside.
  to: You shall have a designated place outside the camp, and you shall go there to relieve yourself.
  rationale: The record rightly interprets yad as a place rather than an implement in this verse. I retain that gain and make the understood sanitary purpose explicit instead of preserving an unhelpful repetition of “outside.”
