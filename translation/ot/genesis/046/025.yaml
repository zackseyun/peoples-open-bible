  from: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
  to: These were the descendants of Bilhah, whom Laban had given to his daughter Rachel; her offspring by Jacob numbered seven persons in all.
