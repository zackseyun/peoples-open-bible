translation:
  text: 'The virgins told me, “The shepherd will not come here today.” I asked, “What shall I do?” They
    said, “Wait until late.[a] If he comes, he will speak with you. If not, stay here with us until he
    comes.”


    2. I said, “I will wait until late. If he does not come, I will go home and return in the morning.”
    They replied, “You were entrusted to us. You cannot leave us.”


    3. I asked, “Where will I stay?” They said, “You will sleep with us as a brother, not as a husband.
    You are our brother. From now on we will live with you, because we love you very much.” I was embarrassed
    to stay with them.


    4. The one who seemed to be first began kissing and embracing me.[b] The others saw her embrace me.
    They too began kissing me, leading me around the tower and playing with me.


    5. I felt as if I had become younger, and I too began playing with them. Some danced together, some
    danced, and some sang.[c] I walked silently with them around the tower and was glad to be with them.


    6. That evening I wanted to go home, but they kept me there. I stayed with them that night and slept
    beside the tower.


    7. They spread their linen tunics on the ground and had me lie down among them. They did nothing except
    pray. I prayed with them continually, no less than they did. They were glad to see me pray like this.
    I stayed with them until the second hour of the next day.[d]


    8. Then the shepherd came. He asked the virgins, “Have you done him any harm?” They said, “Ask him.”
    I said, “Sir, I was glad to stay with them.” He asked, “What did you have for supper?” I said, “Sir,
    I feasted on the Lord’s words all night.” He asked, “Did they receive you well?” I said, “Yes, sir.”


    9. He asked, “Now, what do you want to hear first?” I said, “Sir, just as you showed me things from
    the beginning, I ask you, sir, to explain them to me as I ask you questions.” He said, “As you wish.
    I will explain it and hide nothing from you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: “Until late, they said” follows Gebhardt’s printed conjecture compared with the Latin traditions
      and Ethiopic. The apparatus reports a grammatically disturbed Athos phrase. The conditional coming
      and the instruction to remain are retained.
  - marker: b
    reason: textual_variant
    text: 'The first “embracing” follows Harmer’s printed restoration compared with the two Latin traditions;
      Athos is reported damaged, and Ethiopic omits it. The later embrace and the kissing/play are also
      in the working text. They are retained together with the Greek contrast between “brother” and “man”
      or “husband,” rather than expanded into a different relationship. In paragraph 3, “not as a husband”
      can also be rendered “not as a man”: the Greek word ἀνήρ can mean either. This draft chooses “husband”
      in the context of the contrast with “brother.”'
  - marker: c
    reason: textual_variant
    text: The Greek has two dance expressions, the second (“others danced”) enclosed in square brackets
      in the printed source. The draft retains both rather than silently deleting the marked phrase. The
      first can describe choral or group dancing.
  - marker: d
    reason: lexical_alternative
    text: The source gives the second hour of the next day. The draft keeps that expression rather than
      imposing an exact modern clock time. The linen tunics and prayer are explicit elements of the scene.
lexical_decisions:
- source_word: κύριε
  chosen: sir
  alternatives:
  - Lord
  - master
  rationale: Respectful address to the shepherd, distinguished from named divine references and the tower
    master’s role.
- source_word: ὡς ἀδελφός, καὶ οὐχ ὡς ἀνήρ
  chosen: as a brother, not as a husband
  alternatives:
  - as a brother, not as a man
  rationale: The sibling distinction governs the scene’s affection and overnight stay. Preserve kisses/embraces
    and prayer without inventing sexual acts or deleting the contrast.
- source_word: ῥήματα Κυρίου
  chosen: the Lord’s words
  alternatives:
  - words of the Lord
  rationale: Retain the supper metaphor as Hermas’s own reply rather than replacing it with a physical
    meal.
