  text: So the people slipped into the city that day, as people who are ashamed slip away when they flee in battle.
translation:
  language: ko
  text: 그 날 백성은 전쟁에서 달아날 때 부끄러워하는 사람들이 슬며시 물러가듯이 성 안으로 슬며시 들어갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְגַּנֵּב
  english_pob_choice: slipped into / slip away
  chosen_korean: 슬며시 들어갔습니다 / 슬며시 물러났습니다
  alternatives_korean:
  - 몰래 들어갔습니다
  - 살금살금 들어갔습니다
  - 도망치듯 들어갔습니다
  lexicon: WLC
  rationale: 히트파엘 형태가 나타내는 ‘조심스럽게, 남몰래 움직이다’는 뉘앙스를 살려 단순한 이동보다 ‘슬며시’로 옮겼습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 무리
  lexicon: WLC
  rationale: 이스라엘 공동체를 가리키는 문맥이므로 일반적 ‘사람들’보다 서술적·공동체적 성격을 드러내는 ‘백성’이 더 적합합니다.
- source_word: הַנִּכְלָמִים
  english_pob_choice: people who are ashamed
  chosen_korean: 부끄러운 사람들
  alternatives_korean:
  - 수치를 당한 사람들
  - 부끄러워하는 사람들
  lexicon: WLC
  rationale: 동사의 상태를 자연스럽게 드러내되, 공개적 수치감과 패배의 맥락을 살리기 위해 ‘부끄러운’으로 옮겼습니다.
theological_decisions:
- issue: 전쟁 패주를 빗대는 수치 표현의 강도
  chosen_reading: ‘부끄러운 사람들처럼 슬며시 물러났습니다’로 수치와 패주 이미지를 함께 보존했습니다.
  alternative_readings:
  - 그냥 몰래 들어갔습니다
  - 조용히 들어갔습니다
  rationale: 히브리어는 단순한 은밀한 이동이 아니라 전쟁 패주와 연결된 수치의 감정을 비교로 강화합니다. 이를 약화하지 않도록 직설적 표현을 유지했습니다.
  doctrine_reference: 서사적 수치/패주 묘사 보존
