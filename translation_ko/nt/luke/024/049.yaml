  source_fidelity: 핵심 구조는 잘 반영되었습니다. ἐγὼ ἐξαποστέλλω의 직접적 주체, ‘내 아버지의 약속’, 도시 안에 머무르라는 명령, 능력을 ‘입는’ 은유가 유지되었습니다. 다만 ἐξ ὕψους는 능력의 출처를 나타내므로 한국어에서는 ‘위로부터 오는 능력’으로 명시하는 편이 수식 관계를 정확히 드러냅니다.
  naturalness: ‘위로부터 능력을 입다’는 ‘위로부터’가 무엇을 수식하는지 다소 어색하거나 불분명할 수 있습니다. ‘위로부터 오는 능력을 입을 때까지’는 현대 표준 한국어에서 자연스럽고 원문의 의복 은유도 보존합니다. 각주 표지도 해당 표현 바로 뒤에 두는 편이 독자에게 분명합니다.
  terminology: ‘내 아버지의 약속’, ‘능력’, ‘입다’는 원문 및 영어 POB의 용어 선택을 적절히 따릅니다. ‘보십시오’는 ἰδοὺ의 주의 환기 기능을 합쇼체로 자연스럽게 나타냅니다.
