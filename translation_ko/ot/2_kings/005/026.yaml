  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
  footnotes:
  - marker: a
    text: Or, more interpretively, “Was I not there in spirit when the man turned from his chariot to meet you?”
    reason: lexical_alternative
  - marker: b
    text: Or “male slaves and female slaves.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「그 사람이 수레에서 돌아서 너를 만나러 갈 때 내 마음이 가지 않았느냐?[a] 지금이 은과 옷, 올리브 과수원과 포도원, 양과 소, 남종들과 여종들을 받을 때냐?[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 해석적으로, “그 사람이 수레에서 돌아서 너를 만나러 갈 때, 내가 영으로 거기에 있지 않았느냐?”
    reason: lexical_alternative
  - marker: b
    text: 또는 “남자 노예들과 여자 노예들.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי הָלַךְ
  english_pob_choice: Did not my heart go
  chosen_korean: 내 마음이 … 가지 않았느냐
  alternatives_korean:
  - 내 마음이 … 가지 않았느냐
  - 내 심령이 … 가지 않았느냐
  - 내가 마음으로 함께 있지 않았느냐
  lexicon: לב + הלך
  rationale: 직역적 이미지인 ‘마음이 가다’를 살리되, 한국어에서 자연스러운 과거 회상형으로 옮겨 원문의 내적 인식/동행 감각을 보존했습니다.
- source_word: לִקְרָאתֶךָ
  english_pob_choice: to meet you
  chosen_korean: 네게 맞으려고
  alternatives_korean:
  - 네게 맞으려고
  - 너를 만나려고
  - 네 맞은편으로 나아가려고
  lexicon: קרא + ל
  rationale: 단순한 ‘만나다’보다 ‘맞으러/마주하려 가다’의 방향성을 살려, 수레에서 돌이켜 네게 향한 동작을 더 분명히 표현했습니다.
- source_word: זֵיתִים וּכְרָמִים
  english_pob_choice: olive orchards and vineyards
  chosen_korean: 올리브 과수원과 포도원
  alternatives_korean:
  - 올리브 밭과 포도원
  - 감람원과 포도원
  - 올리브나무밭과 포도원
  lexicon: זית + כרם
  rationale: 지명·식물명보다 소유 재산 목록이라는 맥락을 살려, 과수원/포도원으로 옮겨 재산 취득의 뉘앙스를 드러냈습니다.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  english_pob_choice: male servants and female servants
  chosen_korean: 종들과 여종들
  alternatives_korean:
  - 남종들과 여종들
  - 남자 종들과 여자 종들
  - 노예들과 여종들
  lexicon: עבד + שפחה
  rationale: POB의 기본 관행에 따라 사회적 종속 신분을 드러내는 ‘종/여종’으로 옮겼고, 여기서는 영어가 ‘servants’를 택했으므로 ‘노예’보다 중립적 종속 표현을 유지했습니다.
theological_decisions:
- issue: 엘리사의 내적 인식 표현
  chosen_reading: ‘내 마음이 … 가지 않았느냐’로 옮겨, 단순한 육체적 동행이 아니라 사건을 꿰뚫어 본 내적/영적 인식을 드러냈습니다.
  alternative_readings:
  - ‘내가 영으로 거기 있지 않았느냐’
  - ‘내가 속으로 알고 있지 않았느냐’
  rationale: 히브리어는 문자적으로 ‘내 마음이 갔다’이지만, 문맥상 엘리사가 게하시의 행동을 즉시 아는 예언적 통찰을 말하므로 너무 평면적인 심리 묘사로 약화하지 않았습니다.
  doctrine_reference: 예언적 통찰과 하나님의 감찰(왕하 5:26 문맥)
