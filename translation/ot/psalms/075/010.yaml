  review_summary: The current text accurately preserves the concrete horn imagery and the antithetical poetic structure. אֲגַדֵּעַ is naturally rendered “I will cut off,” while תְּרוֹמַמְנָה supports “will be lifted up.” Although צַדִּיק is morphologically singular, it is generic here and is idiomatically represented by “the righteous,” in contrast with רְשָׁעִים. Rendering the second וְ adversatively as “but” is appropriate in the parallel contrast. The existing footnote explains the metaphor without flattening it in the main text.
