id: PRO.17.16
reference: Proverbs 17:16
source:
  edition: WLC
  text: לָ/מָּה זֶּ֣ה מְחִ֣יר בְּ/יַד כְּסִ֑יל לִ/קְנ֖וֹת חָכְמָ֣ה וְ/לֶב אָֽיִן־־־׃
translation:
  text: What use is money in a fool's hand for buying wisdom when he has no sense?
  philosophy: dynamic
lexical_decisions:
- source_word: לָמָּה
  chosen: Why
  alternatives:
  - Why indeed
  - For what reason
  lexicon: HALOT
  rationale: Interrogative adverb introducing a rhetorical question. 'Why' is the plain and natural English equivalent.
- source_word: זֶּה
  chosen: there
  alternatives:
  - this
  - such
  lexicon: HALOT
  rationale: Though literally 'this,' in the idiom לָמָּה זֶּה it functions naturally in English as an existential-like 'why is there...?' rather than the stiffer 'why is this...?'.
- source_word: מְחִיר
  chosen: money
  alternatives:
  - money
  - payment
  - purchase price
  lexicon: HALOT
  rationale: Here the price term denotes the purchase means available to the fool, for which “money” is idiomatic English.
- source_word: בְּיַד
  chosen: in the hand of
  alternatives:
  - in the possession of
  - available to
  lexicon: HALOT
  rationale: Literal 'in the hand of' is idiomatic Hebrew for possession or control. Retained because it is clear in English and preserves the imagery.
- source_word: כְּסִיל
  chosen: a fool
  alternatives:
  - a dullard
  - a stupid person
  lexicon: HALOT
  rationale: Standard wisdom-literature term for the morally and intellectually obstinate person. 'Fool' is the established and accurate rendering.
- source_word: לִקְנוֹת
  chosen: to buy
  alternatives:
  - to acquire
  - to purchase
  lexicon: HALOT
  rationale: Infinitive of קנה in a commercial sense. 'To buy' fits the price metaphor and is idiomatic.
- source_word: חָכְמָה
  chosen: wisdom
  alternatives:
  - skill
  - wise instruction
  lexicon: HALOT
  rationale: In Proverbs this term centrally denotes wisdom in the moral and practical sense. 'Wisdom' is the best direct rendering.
- source_word: וְלֶב אָיִן
  chosen: when he has no sense
  alternatives:
  - but there is no sense in him
  - and he has no mind
  - and he lacks understanding
  lexicon: HALOT
  rationale: The Hebrew heart idiom here refers to lacking understanding or judgment.
- source_word: לָמָּה זֶּה מְחִיר בְּיַד כְּסִיל
  chosen: Why does a fool have money in his hand
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This gives the rhetorical possessive construction natural English form.
