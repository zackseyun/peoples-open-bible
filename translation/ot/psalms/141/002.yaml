id: PSA.141.2
reference: Psalms 141:2
source:
  edition: WLC
  text: תִּכּ֤וֹן תְּפִלָּתִ֣/י קְטֹ֣רֶת לְ/פָנֶ֑י/ךָ מַֽשְׂאַ֥ת כַּ֝פַּ֗/י מִנְחַת עָֽרֶב־׃
translation:
  text: May my prayer be set before you as incense, the lifting up of my hands as the evening offering[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew word for “offering” often denotes a grain offering.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכּוֹן
  chosen: be set
  alternatives:
  - be set in order
  - be prepared
  - be accepted
  lexicon: HALOT
  rationale: Conveys the sense of being placed or arranged before God in a natural English collocation.
- source_word: תְּפִלָּתִי
  chosen: my prayer
  lexicon: HALOT
  rationale: Straightforward nominal rendering with first-person singular suffix.
- source_word: קְטֹרֶת
  chosen: incense
  lexicon: HALOT
  rationale: Standard rendering for the fragrant offering burned before God. The comparison is explicit and cultic.
- source_word: לְפָנֶיךָ
  chosen: before you
  alternatives:
  - in your presence
  lexicon: HALOT
  rationale: Idiomatic and accurate rendering of spatial-relational language meaning before God's presence.
- source_word: מַשְׂאַת
  chosen: the lifting up of
  alternatives:
  - the raising of
  - the elevation of
  lexicon: HALOT
  rationale: From נשׂא-derived noun meaning lifting/carrying. In collocation with 'my hands,' it refers to the act of raising the hands in prayer. 'Lifting up' is natural English and preserves the embodied prayer imagery.
- source_word: כַּפַּי
  chosen: my hands
  alternatives:
  - my palms
  lexicon: HALOT
  rationale: Though כף can mean 'palm,' in this idiom 'hands' is the natural English equivalent and matches the prayer gesture.
- source_word: מִנְחַת עָרֶב
  chosen: the evening offering
  alternatives:
  - the evening grain offering
  - the evening gift offering
  lexicon: HALOT
  rationale: מִנְחָה often denotes a gift or grain offering; in cultic context with incense and evening timing, 'offering' is the best concise rendering. 'Evening offering' preserves the sacrificial reference without overloading the line with technical terminology, while the grain-offering nuance is worth preserving in a footnote.
