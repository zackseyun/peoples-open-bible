id: PSA.113.9
reference: Psalms 113:9
source:
  edition: WLC
  text: מֽוֹשִׁיבִ֨י עֲקֶ֬רֶת הַ/בַּ֗יִת אֵֽם הַ/בָּנִ֥ים שְׂמֵחָ֗ה הַֽלְלוּ יָֽהּ׀־־׃
translation:
  text: He settles the barren woman in a home as a joyful mother of children. Praise Yah!
  philosophy: dynamic
lexical_decisions:
- source_word: מֽוֹשִׁיבִי
  chosen: He settles
  alternatives:
  - He makes ... dwell
  - He seats
  - He settles
  lexicon: HALOT
  rationale: The Hiphil participle expresses causing someone to dwell or be settled.
- source_word: עֲקֶרֶת
  chosen: the barren woman
  alternatives:
  - the barren wife
  - the infertile woman
  lexicon: HALOT
  rationale: The noun denotes a barren woman, often with the sense of childlessness. 'Barren woman' is the most established and concise English equivalent; 'infertile' is medically precise but too clinical for the poetic register.
- source_word: הַבַּיִת
  chosen: in a home
  alternatives:
  - the house
  - the household
  lexicon: HALOT
  rationale: “Home” naturally conveys the domestic setting, while the indefinite form avoids adding an unmarked possessive; the literal “the house” remains available in the note.
- source_word: אֵם הַבָּנִים
  chosen: mother of children
  alternatives:
  - mother of sons
  - mother of the children
  lexicon: HALOT
  rationale: בנים can mean 'sons' specifically or 'children' more generally. Here the point is reversal of barrenness into motherhood, not male offspring in particular, so 'children' best reflects the likely sense in natural English.
- source_word: שְׂמֵחָה
  chosen: joyful
  alternatives:
  - rejoicing
  - glad
  lexicon: HALOT
  rationale: Predicate adjective describing the mother. 'Joyful' is clear, natural, and preserves the emotional result of God's action.
- source_word: הַֽלְלוּ יָהּ
  chosen: Praise Yah!
  alternatives:
  - Praise the LORD!
  - Hallelujah!
  lexicon: HALOT
  rationale: The Hebrew is the imperative plus the short divine name Yah. Because the source text explicitly has יָהּ rather than יהוה, 'Praise Yah!' preserves the form and force more directly than 'Praise the LORD!'; 'Hallelujah' would be a transliteration rather than a translation.
