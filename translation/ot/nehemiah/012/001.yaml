id: NEH.12.1
reference: Nehemiah 12:1
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם אֲשֶׁ֥ר עָל֛וּ עִם זְרֻבָּבֶ֥ל בֶּן שְׁאַלְתִּיאֵ֖ל וְ/יֵשׁ֑וּעַ שְׂרָיָ֥ה יִרְמְיָ֖ה עֶזְרָֽא־־׃
translation:
  text: 'These were the priests and Levites who returned to Jerusalem with Zerubbabel son of Shealtiel and Jeshua: Seraiah, Jeremiah, Ezra.'
  philosophy: dynamic
lexical_decisions:
- source_word: וְאֵלֶּה
  chosen: These were
  alternatives:
  - And these were
  - These were
  - Now these were
  lexicon: HALOT
  rationale: 'The conjunction plus demonstrative introduces a new list section. ''Now these were'' gives natural English paragraph progression while preserving the discourse-linking force of the initial waw better than a bare ''These were.'' Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: הַכֹּהֲנִים
  chosen: the priests
  lexicon: HALOT
  rationale: Standard rendering of כֹּהֲנִים in this genealogical/list context.
- source_word: וְהַלְוִיִּם
  chosen: and the Levites
  lexicon: HALOT
  rationale: Straightforward rendering of the coordinate group named alongside the priests.
- source_word: אֲשֶׁר עָלוּ
  chosen: who came up
  alternatives:
  - who went up
  lexicon: HALOT
  rationale: עלה in return-from-exile contexts commonly refers to going up to Jerusalem/Judah. 'Came up' is idiomatic from the narrator's perspective and suits established biblical usage in pilgrimage/return contexts.
- source_word: עִם
  chosen: with
  lexicon: HALOT
  rationale: Simple accompaniment marker.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  chosen: Zerubbabel son of Shealtiel
  alternatives:
  - Zerubbabel the son of Shealtiel
  lexicon: HALOT
  rationale: Personal names are transliterated per project philosophy; filial relation is rendered directly.
- source_word: וְיֵשׁוּעַ
  chosen: and Jeshua
  alternatives:
  - and Joshua
  lexicon: HALOT
  rationale: The Hebrew form here is יֵשׁוּעַ, conventionally transliterated 'Jeshua' in post-exilic contexts. This preserves the specific form of the name rather than normalizing it to 'Joshua.'
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  chosen: Seraiah, Jeremiah, Ezra
  lexicon: HALOT
  rationale: These are proper names beginning the list of priestly heads/families. They are best represented as a simple name list following the introductory clause.
