revisions:
- from: 왕의 딸은 모두 영광스럽고 내실에 있으며, 그 옷은 황금으로 짠 것입니다.[a][b]
  to: 그녀는 수놓은 옷을 입고 왕께로 인도됩니다. 그녀의 뒤를 따르는 처녀들, 곧 그녀의 벗들도 당신께로 이끌려 옵니다.[a]
  rationale: 대상 본문인 시편 45:14에 맞추어 전체를 새로 번역했습니다. ‘수놓은 옷을 입고’는 לִרְקָמוֹת의 직물·의복 이미지를, ‘왕께로 인도됩니다’는 수동 동사와 방향을, ‘처녀들, 곧 그녀의 벗들’은 동격 관계를 반영합니다. 마지막 ‘당신께로’와 각주는 마소라 본문의 여성 단수 2인칭 호칭 및 시적 시점 전환을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:07:10Z'
