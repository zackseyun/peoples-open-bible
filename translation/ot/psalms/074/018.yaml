  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Moral nuance of נָבָל
  chosen_reading: foolish
  alternative_readings:
  - godless
  - base
  rationale: The term often implies moral and spiritual perversity, but the text itself does not explicitly define the folly. 'Foolish' preserves the theological weight without over-resolving the nuance.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3, #6'
