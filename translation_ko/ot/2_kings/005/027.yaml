    text: 전통적으로는 ‘나아만의 나병이 당신과 당신의 후손에게 붙을 것이며, 그는 나병 환자로서 눈처럼 희어져 나갔다’로 번역합니다. 히브리어 צָרַעַת / מְצֹרָע는 현대 의학적 ‘나병’에만 한정되지 않으며, 더 넓은 범위의 심각한 피부 질환 또는 상태를 가리킬 수 있습니다.
