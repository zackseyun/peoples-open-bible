theological_decisions:
- issue: Addressing the heavenly messenger as κύριε
  chosen_reading: Render vocative κύριε as “sir” to mark respectful address to the messenger, distinguishing
    from ‘the Lord’ (God) in the same passage.
  alternative_readings:
  - Render as “Lord” uniformly
  - Render as “master”
  rationale: Avoids reader confusion between God (‘the Lord’) and the figure speaking. Hermas regularly
    uses κύριε as honorific address to visionary figures; documenting this variance aligns with our transparency
    policy.
  doctrine_reference: Translation philosophy §4 (Consistency with documented per-verse variance).
- issue: ζήσεται τῷ Θεῷ dative nuance
  chosen_reading: Translate “will live to God,” preserving the dative orientation.
  alternative_readings:
  - will live for God
  - will live with God
  - will live before God
  rationale: The dative without preposition can denote direction or relation; ‘to God’ maintains literalness
    and allows readers to sense the distinct idiom.
  doctrine_reference: Translation philosophy §3 (preserve theological tension/ambiguity).
- issue: Contextual repentance reassessment
  chosen_reading: Retain repentance and the source’s understanding argument, cessation of evil, lavish
    good, humility/chastising and conditional living; preserve witness and conjectural alternatives in
    notes.
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
