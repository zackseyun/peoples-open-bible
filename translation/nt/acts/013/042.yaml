  meaning_decisions:
  - source_phrase: Ἐξιόντων δὲ αὐτῶν παρεκάλουν
    prior_rendering: As they were going out, they were urging
    new_rendering: As Paul and Barnabas were leaving, the people urged them
    rationale: The discourse distinguishes the departing speakers from the requesting hearers. Repeating 'they' obscures that distinction in English; the referents are supplied from the immediate context.
  - source_phrase: λαληθῆναι αὐτοῖς τὰ ῥήματα ταῦτα
    prior_rendering: that these words be spoken to them
    new_rendering: them to speak about these things again
    rationale: The hearers request a repetition of Paul's message, not merely the utterance of particular words. An active construction makes the requested action clear.
