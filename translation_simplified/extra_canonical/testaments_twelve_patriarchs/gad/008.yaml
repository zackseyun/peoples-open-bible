  rendering: take in the quarrel’s poison
  claim: The poison depicts the corrupting effect of heated dispute rather than literal poison.
  evidence:
  - The immediate context concerns an escalating argument.
  - The next clause describes further sin through swearing.
  - The POB footnote identifies contentious dispute as the image’s force.
  confidence: high
