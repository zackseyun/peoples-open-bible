  from: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
  to: But if the person who was wronged has died and has no next of kin[a] to receive the restitution, the restitution must be given to Yahweh and belongs to the priest, in addition to the ram of atonement with which the priest makes atonement for the offender.
