translation:
  text: and when righteousness appears on the faces of the righteous, the chosen whose deeds hang upon the Lord
    of Spirits,[a] and light appears to the righteous and chosen who dwell on the dry land, where will sinners dwell,
    and where will those who denied the Lord of Spirits find rest? It would have been better for them not to have
    been born.
