id: PSA.122.4
reference: Psalms 122:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֶׁ/שָּׁ֨ם עָל֪וּ שְׁבָטִ֡ים שִׁבְטֵי יָ֭הּ עֵד֣וּת לְ/יִשְׂרָאֵ֑ל לְ֝/הֹד֗וֹת לְ/שֵׁ֣ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/004.yaml
  text: There the tribes went up, the tribes of Yah, as a testimony for Israel, to give thanks to the name of the LORD.
translation:
  language: ko
  text: 그곳으로 지파들, 곧 야의 지파들이 올라갔습니다. 이는 이스라엘을 위한 규례에 따라 야훼의 이름에 감사드리기 위해서입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘규례’로 번역한 히브리어 ‘에두트’는 ‘증거’ 또는 ‘증언’으로도 옮길 수 있습니다.
    reason: עֵדוּת의 의미 범위와 이 구절에서 논의되는 ‘규례/증언’의 모호성을 보존합니다.
lexical_decisions:
- source_word: עָלוּ
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 올랐습니다
  - 올라왔습니다
  lexicon: עלה
  rationale: 히브리어 동사 עלה는 실제 상승/상행을 가리키므로, 영어 POB의 went up을 따라 자연스러운 서술형으로 옮겼습니다.
- source_word: שְׁבָטִים / שִׁבְטֵי
  english_pob_choice: tribes / tribes of Yah
  chosen_korean: 지파들 / 야의 지파들
  alternatives_korean:
  - 부족들 / 야의 부족들
  - 종족들 / 야의 종족들
  lexicon: שֵׁבֶט
  rationale: ישראל의 열두 지파를 가리키는 표준적 의미를 살려 지파로 옮기고, 반복은 그대로 살려 ‘야의 지파들’로 보강했습니다.
- source_word: יָהּ
  english_pob_choice: Yah
  chosen_korean: 야
  alternatives_korean:
  - 야훼
  - 여호
  lexicon: יה
  rationale: 본문의 축약형 신명 יָהּ는 시편의 시적 용법을 따라 ‘야’로 옮기되, 뒤의 יהוה는 본래의 מלא형과 구별했습니다.
- source_word: לְהֹד֗וֹת
  english_pob_choice: to give thanks
  chosen_korean: 감사드리기 위함입니다
  alternatives_korean:
  - 감사하기 위함입니다
  - 감사하도록
  lexicon: ידה
  rationale: 전치사 לְ + 부정사 구조의 목적을 살려 ‘~하기 위함’으로 풀었고, 예배적 맥락을 드러내기 위해 ‘감사드리다’를 택했습니다.
theological_decisions:
- issue: יהוה의 번역과 시편 122:4의 예배적 맥락
  chosen_reading: 마지막의 יהוה는 ‘야훼’로 옮겨, 시적 축약형 ‘야’와 구별되게 했습니다.
  alternative_readings:
  - 모두 ‘주님’으로 통일
  - 마지막도 ‘야’로 통일
  rationale: 본문은 축약형 יָהּ와 언약명 יהוה를 병기하므로, 두 이름의 차이를 한국어에서도 보존하는 것이 본문 의미를 더 정확히 드러냅니다.
  doctrine_reference: 하나님의 이름 표기 원칙
- issue: עֵדוּת לְיִשְׂרָאֵל의 기능
  chosen_reading: ‘이스라엘을 위한 증거’로 옮겨, 순례 행위가 공동체적 증언/증거가 된다는 뜻을 살렸습니다.
  alternative_readings:
  - 이스라엘의 증언
  - 이스라엘을 위한 증언
  rationale: עֵדוּת는 단순한 감정이 아니라 공적 표지·증언의 의미를 가지므로, 관계를 분명히 보여 주는 ‘~을 위한 증거’가 가장 무난합니다.
  doctrine_reference: 공동체 기억과 예배의 증거성
