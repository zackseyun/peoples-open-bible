revisions:
- from: 사람들이 양처럼 스올을 향해 정해졌고, 죽음이 그들을 치리할 것입니다. 아침에는 정직한 이들이 그들 위에 다스릴 것입니다. 그들의 형상은 스올에서 닳아 없어질 것이며, 그 높은 거처에서 멀리 떨어질 것입니다.[a][b][c][d]
  to: 그러나 하나님께서 스올[a]의 손에서 내 생명을 속량하실 것입니다. 그분께서 나를 데려가실[b] 것이기 때문입니다. 셀라
