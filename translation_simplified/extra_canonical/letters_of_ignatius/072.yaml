- pob_phrase: who will strike off every fetter from you
  simplified_phrase: who will break every chain that binds you
  preserved_meaning: Christ’s grace will free the readers while retaining the forceful chain image.
  reasoning_layer_used: POB translation and English witness
  rationale: The concrete image is expressed in familiar modern English.
- pob_phrase: the inviolable charter
  simplified_phrase: the charter that cannot be broken
  preserved_meaning: The legal-document image and its unassailable character remain intact.
  reasoning_layer_used: POB translation and English witness
  rationale: The uncommon adjective is replaced without narrowing what the charter represents.
translation_notes:
  risk_flags:
  - risk: The exact historical referent of “written records” is uncertain because direct Greek review is pending.
    mitigation: The broad wording does not identify the records with a specific collection.
  - risk: “Charter” may remain unfamiliar to some readers, but explaining it as authority would narrow the image.
    mitigation: The term is retained and clarified only by the following phrase, “cannot be broken.”
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
