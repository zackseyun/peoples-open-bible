  meaning_decisions:
  - source_phrase: לְהָסִיר אָדָם מַעֲשֶׂה
    prior_rendering: to turn a person from his deed
    new_rendering: to turn a person from wrongdoing
    rationale: The warning and its life-preserving purpose show that the action being prevented is wrongful, not activity in general. “Wrongdoing” conveys that contextual sense without adding a specific offense.
  - source_phrase: וְגֵוָה מִגֶּבֶר יְכַסֶּה
    prior_rendering: and to hide pride from him
    new_rendering: and keep him from pride
    rationale: In this preventative context, the image means keeping pride away from the person. The prior English can instead suggest concealing his pride from his awareness; the source image remains available in the note.
