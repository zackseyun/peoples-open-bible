source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Καὶ ταῦτά μοι λίαν ὀργίλως ἐλάλησεν, ὥστε με συγχυθῆναι καὶ λίαν αὐτὸν φοβηθῆναι· ἡ μορφὴ γὰρ
    αὐτοῦ ἠλλοιώθη, ὥστε μὴ δύνασθαι ἄνθρωπον ὑπενεγκεῖν τὴν ὀργὴν αὐτοῦ. 2. ἰδὼν δέ με τεταραγμένον ὅλον
    καὶ συγκεχυμένον ἤρξατό μοι ἐπιεικέστερον [καὶ ἱλαρώτερον] λαλεῖν, καὶ λέγει· Ἄφρον, ἀσύνετε καὶ δίψυχε,
    οὐ νοεῖς τὴν δόξαν τοῦ Θεοῦ, πῶς μεγάλη ἐστὶ καὶ ἰσχυρὰ καὶ θαυμαστή, ὅτι ἔκτισε τὸν κόσμον ἕνεκα
    τοῦ ἀνθρώπου καὶ πᾶσαν τὴν κτίσιν αὐτοῦ ὑπέταξε τῷ ἀνθρώπῳ, καὶ τὴν ἐξουσίαν πᾶσαν ἔδωκεν αὐτῷ τοῦ
    κατακυριεύειν τῶν ὑπὸ τὸν οὐρανὸν πάντων; 3. εἰ οὖν, [φησί,] πάντων ὁ ἄνθρωπος κύριός ἐστι τῶν κτισμάτων
    τοῦ Θεοῦ καὶ πάντων κατακυριεύει, οὐ δύναται καὶ τούτων τῶν ἐντολῶν κατακυριεῦσαι; δύναται, φησί,
    [πάντων καὶ] πασῶν τῶν ἐντολῶν τούτων κατακυριεῦσαι ὁ ἄνθρωπος ὁ ἔχων τὸν Κύριον ἐν τῇ καρδίᾳ αὐτοῦ.
    4. οἱ δὲ ἐπὶ τοῖς χείλεσιν ἔχοντες τὸν Κύριον, τὴν δὲ καρδίαν αὐτῶν πεπωρωμένην καὶ μακρὰν ὄντες ἀπὸ
    τοῦ Κυρίου, ἐκείνοις αἱ ἐντολαὶ αὗται σκληραί εἰσι καὶ δύσβατοι. 5. θέσθε οὖν ὑμεῖς, οἱ κενοὶ καὶ
    ἐλαφροὶ ὄντες ἐν τῇ πίστει, τὸν Κύριον ὑμῶν εἰς τὴν καρδίαν, καὶ γνώσεσθε ὅτι οὐδέν ἐστιν εὐκολώτερον
    τῶν ἐντολῶν τούτων οὔτε γλυκύτερον οὔτε ἡμερώτερον. 6. ἐπιστράφητε ὑμεῖς οἱ ταῖς ἐντολαῖς πορευόμενοι
    τοῦ διαβόλου, ταῖς δυσκόλοις καὶ πικραῖς καὶ ἀγρίαις καὶ ἀσελγέσι, καὶ μὴ φοβήθητε τὸν διάβολον, ὅτι
    ἐν αὐτῷ δύναμις οὐκ ἔστιν καθ' ὑμῶν· 7. ἐγὼ γὰρ ἔσομαι μεθ' ὑμῶν, ὁ ἄγγελος τῆς μετανοίας ὁ κατακυριεύων
    αὐτοῦ. ὁ διάβολος μόνον φόβον ἔχει, ὁ δὲ φόβος αὐτοῦ τόνον οὐκ ἔχει· μὴ φοβήθητε οὖν αὐτόν, καὶ φεύξεται
    ἀφ' ὑμῶν.
