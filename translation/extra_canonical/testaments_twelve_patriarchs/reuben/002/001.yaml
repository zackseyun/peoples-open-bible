reference: Testament of Reuben 2:1
unit: verse
book: Testament of Reuben
collection: Testaments of the Twelve Patriarchs
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ νῦν¹ ἀκούσατέ μου, τέκνα μου², ἃ³ εἶδον περὶ τῶν ἑπτὰ⁴ πνευμάτων τῆς πλάνης ἐν τῇ μετανοίᾳ μου⁵.
  language: Greek
translation:
  text: And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'spirits of error' or 'spirits of delusion.'
    reason: lexical_alternative
  - marker: b
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims.
    reason: lexical_alternative
