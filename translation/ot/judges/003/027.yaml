  meaning_decisions:
  - source_phrase: וַיִּתְקַע בַּשּׁוֹפָר
    prior_rendering: he blew the trumpet
    new_rendering: he sounded the horn
    rationale: The shofar is a horn used for signaling, not the metal instrument a modern reader normally imagines as a trumpet.
  - source_phrase: בְנֵי יִשְׂרָאֵל
    prior_rendering: the sons of Israel
    new_rendering: The Israelites
    rationale: The expression identifies the Israelite people responding to Ehud, not a separate genealogical group called Israel’s sons.
  - source_phrase: וְהוּא לִפְנֵיהֶם
    prior_rendering: and he was before them
    new_rendering: and he led the way
