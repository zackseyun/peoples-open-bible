id: GEN.14.15
reference: Genesis 14:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּחָלֵ֨ק עֲלֵי/הֶ֧ם לַ֛יְלָה ה֥וּא וַ/עֲבָדָ֖י/ו וַ/יַּכֵּ֑/ם וַֽ/יִּרְדְּפֵ/ם֙ עַד חוֹבָ֔ה אֲשֶׁ֥ר מִ/שְּׂמֹ֖אל לְ/דַמָּֽשֶׂק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/015.yaml
  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: ko
  text: 그와 그의 종들은 밤에 그들을 맞아 나뉘어 그들을 치고, 다마스쿠스 북쪽에 있는 호바까지 그들을 추격하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם לַיְלָה
  english_pob_choice: By night he and his servants divided themselves against them
  chosen_korean: 그는 밤에 자기와 그의 종들을 나누어 그들을 치고
  alternatives_korean:
  - 밤에 그와 그의 종들은 그들에 맞서 갈라져
  - 그는 밤에 그와 그의 종들을 분산시켜 그들을 공격하고
  lexicon: חלק
  rationale: 히브리어 동사 חילק/נחלק의 ‘나누다, 분산되다’ 의미를 살리되, 문맥상 야간 기습과 대열 분할을 함께 드러내기 위해 ‘나누어’로 옮겼습니다.
- source_word: וַיַּכֵּם
  english_pob_choice: struck them down
  chosen_korean: 그들을 치고
  alternatives_korean:
  - 그들을 쳐부수고
  - 그들을 무찌르고
  lexicon: נכה
  rationale: 본문의 직접적 타격 동사를 간결하게 반영하면서, 전투 서술의 흐름을 과장 없이 유지하기 위해 ‘치고’로 처리했습니다.
- source_word: וַיִּרְדְּפֵם
  english_pob_choice: pursued them
  chosen_korean: 추격하였는데
  alternatives_korean:
  - 뒤쫓았는데
  - 추적하였는데
  lexicon: רדף
  rationale: 적군을 끝까지 따라붙는 의미를 살리되 한국어 문장 흐름에 맞게 ‘추격하다’를 선택했습니다.
- source_word: חוֹבָה אֲשֶׁר מִשְּׂמֹאל לְדַמָּשֶׂק
  english_pob_choice: Hobah, which is north of Damascus
  chosen_korean: 하바까지, 하바는 다마스쿠스의 북쪽에 있습니다
  alternatives_korean:
  - 호바까지, 그것은 다마스쿠스의 북쪽에 있습니다
  - 하바까지, 이는 다마스쿠스 북쪽입니다
  lexicon: חוֹבָה
  rationale: 고유명사는 음역을 유지하고, 위치 설명은 직역하여 지리 정보를 분명하게 전달했습니다.
theological_decisions:
- issue: 전투 서술의 사실성 및 과장 절제
  chosen_reading: 야간 기습, 분산, 타격, 추격의 연속 동작을 평이하게 제시했습니다.
  alternative_readings:
  - ‘쳐부수고’처럼 승리의 강도를 높이는 표현
  - 보다 서사적으로 압축한 의역
  rationale: 본문은 군사 행동의 연속을 보고하는 서술이므로, 의미를 보존하되 전투적 수사를 과도하게 증폭하지 않았습니다.
  doctrine_reference: 성경 서사의 역사적-서술적 문체 보존
- issue: 지리 주석의 본문 내 처리
  chosen_reading: ‘다마스쿠스의 북쪽에 있습니다’로 본문 안에서 설명적으로 옮겼습니다.
  alternative_readings:
  - 각주로 지리 설명을 빼는 방식
  - ‘북쪽’만 간단히 제시하는 방식
  rationale: 히브리어 יחס/מִשְּׂמֹאל의 위치 설명을 독자가 바로 이해하도록 본문에 자연스럽게 담았습니다.
  doctrine_reference: 본문 투명성 및 지리 정보 보존
