  from: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
  to: So let no one treat him with contempt. Help him on his way in peace, so that he can come to me, for I am expecting him to arrive with the brothers[a].
