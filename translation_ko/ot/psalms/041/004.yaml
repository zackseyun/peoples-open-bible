revisions:
- from: 야훼께서는 그를 병상에서 붙드십니다[가]. 그의 병중에 주께서는 그의 온 침상을 뒤집으십니다.
  to: 나는 말했습니다. “야훼여, 제게 은혜를 베풀어 주십시오. 제가 주께 죄를 지었으니, 제 영혼을 고쳐 주십시오.[가]”
  rationale: 원문 순서와 화자 전환을 그대로 반영했습니다. אֲנִי의 명시적 강조는 ‘나는’으로, אָמַרְתִּי는 과거 보고 형식인 ‘말했습니다’로 옮겼습니다. חָנֵּנִי와 רְפָאָה는 각각 은혜를 구하는 간구와 치유의 간구로 번역했습니다. כִּי חָטָאתִי לָךְ는 원인의 뉘앙스를 보존하여 ‘제가 주께 죄를 지었으니’로 옮겼습니다. נַפְשִׁי의 의미 범위는 본문에서 축소하지 않고 각주로 보완했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:07:27Z'
