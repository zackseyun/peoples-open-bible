lexical_decisions:
- source_word: צֶדֶק
  english_pob_choice: Righteousness
  chosen_korean: 의
  alternatives_korean:
  - 공의
  - 정의
  lexicon: צֶדֶק
  rationale: 시편에서 צֶדֶק은 하나님의 바른 다스림과 언약적 의를 가리키므로, POB 기본어인 ‘의’가 가장 직접적입니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그 앞에
  alternatives_korean:
  - 그 앞에서
  - 그보다 앞서
  lexicon: לְ + פָּנִים
  rationale: 전치사 לְ와 ‘얼굴/앞’의 결합은 진행 방향을 나타내므로, 자연스러운 한국어로 ‘그 앞에’로 옮겼습니다.
- source_word: יְהַלֵּךְ
  english_pob_choice: will go
  chosen_korean: 가며
  alternatives_korean:
  - 걸어가며
  - 나아가며
  lexicon: הלך
  rationale: 미래형 동사이지만 시적 병렬을 살리기 위해 현재적 진행감을 주는 ‘가며’로 처리했습니다.
- source_word: וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו
  english_pob_choice: and will make a path for his steps
  chosen_korean: 그의 발자취를 길로 삼을 것입니다
  alternatives_korean:
  - 그의 발걸음에 길을 내실 것입니다
  - 그의 걸음을 길로 만드실 것입니다
  lexicon: שׂוּם + דֶרֶךְ + פְּעָמִים
  rationale: 직역적 ‘길을 내다’보다, 원문의 ‘발걸음/발자취’를 ‘길’로 삼는 시적 이미지를 살려 POB 영어의 ‘make a path for his steps’에 맞게 옮겼습니다.
