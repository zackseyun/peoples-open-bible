id: PSA.134.3
reference: Psalms 134:3
source:
  edition: WLC
  text: יְבָרֶכְ/ךָ֣ יְ֭הוָה מִ/צִּיּ֑וֹן עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
translation:
  text: May Yahweh, maker of heaven and earth, bless you from Zion[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “Yahweh will bless you from Zion.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְבָרֶכְךָ
  chosen: May ... bless you
  alternatives:
  - The LORD bless you
  - He will bless you
  lexicon: HALOT
  rationale: Piel imperfect of ברך with 2ms suffix functions naturally here as a jussive/wish in the psalm's closing benediction. 'May ... bless you' best conveys the benedictory force in idiomatic English.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: מִצִּיּוֹן
  lemma: מִן
  chosen: from Zion
  alternatives:
  - out of Zion
  lexicon: HALOT
  rationale: The preposition מִן marks source/origin. 'From Zion' is the most natural English rendering and preserves the imagery of blessing proceeding from Zion.
- source_word: עֹשֵׂה
  chosen: maker of
  alternatives:
  - maker of
  - who made
  - the one making
  lexicon: HALOT
  rationale: The participle functions as a title in apposition to Yahweh. Placing 'maker of heaven and earth' next to the divine name makes its referent unmistakable.
- source_word: שָׁמַיִם
  chosen: heaven
  alternatives:
  - the heavens
  - sky
  lexicon: HALOT
  rationale: Although formally plural in Hebrew, 'heaven and earth' is the standard English merism for the totality of creation. This avoids awkwardness while preserving meaning.
- source_word: וָאָרֶץ
  chosen: and earth
  alternatives:
  - and the earth
  - land
  lexicon: HALOT
  rationale: With שׁמים it forms the fixed creation pair 'heaven and earth.' 'Earth' is preferable to 'land' because the scope is cosmic, not territorial.
