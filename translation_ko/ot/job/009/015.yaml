lexical_decisions:
- source_word: אִם צָדַקְתִּי
  english_pob_choice: Even if I were in the right
  chosen_korean: 설령 내가 옳다 해도
  alternatives_korean:
  - 내가 의롭다 해도
  - 내가 정당하다 해도
  lexicon: צָדַק
  rationale: 재판 맥락에서 משפט적 ‘옳음/의로움’을 담되, 자연스러운 현대 한국어로는 ‘옳다’가 가장 직접적이고 과도한 신학적 확장을 피합니다.
- source_word: לֹא אֶעֱנֶה
  english_pob_choice: I would not answer
  chosen_korean: 대답하지 않겠습니다
  alternatives_korean:
  - 응답하지 않겠습니다
  - 대꾸하지 않겠습니다
  lexicon: ענה
  rationale: 문맥상 변론에 대한 ‘대답/응답’을 뜻하므로, 직설적이고 간결한 ‘대답하다’로 옮겼습니다.
- source_word: לִמְשֹׁפְטִי
  english_pob_choice: from my judge
  chosen_korean: 내 재판관에게
  alternatives_korean:
  - 내 판사에게
  - 내 심판자에게
  lexicon: שׁפט
  rationale: שפט는 ‘재판하다/심판하다’의 법정적 의미가 강하므로, 현대 한국어에서 법정 이미지가 분명한 ‘재판관’을 택했습니다.
- source_word: אֶתְחַנָּן
  english_pob_choice: I would plead for mercy
  chosen_korean: 자비를 구하겠습니다
  alternatives_korean:
  - 은혜를 구하겠습니다
  - 간청하겠습니다
  lexicon: חנן
  rationale: 동사의 핵심은 ‘은혜/자비를 간구하다’이므로, 관계와 청원의 뉘앙스를 살리는 ‘자비를 구하다’로 옮겼습니다.
theological_decisions:
- issue: 의로움이 있어도 하나님 앞에서 항변하지 않는 욥의 태도
  chosen_reading: 본문의 초점은 자기 의의 주장보다 재판관 앞에서의 겸손한 청원에 있습니다.
  alternative_readings:
  - 도덕적 무죄 선언으로 약화하는 해석
  - 법정 논쟁의 수사로만 축소하는 해석
  rationale: 히브리어 법정 어휘가 실제 재판 장면을 형성하므로, 욥의 말은 ‘옳음’의 주장보다 판결자 앞에서의 자비 호소로 읽는 것이 문맥에 충실합니다.
  doctrine_reference: 욥기 9장; 하나님의 주권과 인간의 한계에 대한 성경적 법정 비유
