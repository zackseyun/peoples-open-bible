translation:
  language: en
  text: 'Therefore, brothers and sisters, let us repent[b] now. Let us think clearly about what is good, because we are full of foolishness and evil. Let us wipe away the sins of our past. We must not live merely to win people’s approval. Let us seek to please not only one another, but also people outside the church by living rightly, so that God’s Name is not dishonored because of us.


    For the Lord says, “People among the nations speak evil of my Name everywhere.” He also says, “How terrible it will be for the person who causes my Name to be spoken against!” How do people speak against it? They do so because you do not obey what I desire.


    When people outside the church hear us speak God’s messages, they are amazed at their beauty and greatness. But when they discover that our lives do not match our words, they quickly speak evil of God’s message, calling it an empty tale and a deception.


    They hear us say that God teaches, “There is nothing praiseworthy about loving those who love you. What is praiseworthy is loving your enemies and those who hate you.” They are amazed at how good this teaching is. But when they see that we fail to show such love,[a] they ridicule us, and God’s Name is dishonored.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The POB wording here is grammatically incomplete; this rendering preserves the clear point without reconstructing the missing words.
    reason: source_note
  - marker: b
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in the exhortation to moral change while there is time; preserve the authors own baptismal and ethical claims rather than harmonizing them.
    reason: lexical_alternative
