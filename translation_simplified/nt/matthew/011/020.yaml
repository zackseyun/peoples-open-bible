translation:
  language: en
  text: Then he began to rebuke the cities where most of his mighty works had been done[a], because they did not repent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or "miracles" or "works of power" for "mighty works."
    reason: lexical_alternative
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
