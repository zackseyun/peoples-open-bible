  source_fidelity: 그리스어 καὶ εἶπεν ὁ πρεσβύτης를 ‘그리고 그 노인이 말했습니다’로, Δικαιοῦται αὐτῷ를 ‘그에게는 그것이 정당합니다’로 옮겨 원문의 비인칭적 판정 표현과 여격 αὐτῷ의 귀속/관계 뉘앙스를 보존합니다. 영어 POB의 ‘It is justified for him’과도 일치합니다.
  naturalness: ‘그에게는 그것이 정당합니다’는 한국어에서 다소 문어적이지만, 짧고 판정적인 원문의 발화를 현대 한국어 합쇼체로 자연스럽게 전달합니다. 서술문 과거와 인용문 현재의 결합도 적절합니다.
  terminology: πρεσβύτης를 직분 의미가 강한 ‘장로’가 아닌 ‘노인’으로 옮긴 것은 문맥상 안전합니다. δικαιοῦται를 교리적 ‘의롭다 하다’로 한정하지 않고 ‘정당합니다’로 처리하여 본문의 모호한 판정 표현을 유지했습니다.
