  from: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
  to: There is little Benjamin, ruling them; the princes of Judah with their throng; the princes of Zebulun; the princes of Naphtali.[a]
  rationale: רֹדֵם has the dominion/rule sense of רדה; “leading them” weakens it through an unmarked processional inference. The rare רִגְמָתָם is uncertain. “With their throng” makes the Hebrew relation intelligible in English without pretending that the noun’s precise nuance is settled; the note records the uncertainty.
