id: 1KI.8.39
reference: 1 Kings 8:39
source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָלַחְתָּ֣ וְ/עָשִׂ֔יתָ וְ/נָתַתָּ֤ לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּֽי אַתָּ֤ה יָדַ֨עְתָּ֙ לְ/בַדְּ/ךָ֔ אֶת לְבַ֖ב כָּל בְּנֵ֥י הָ/אָדָֽם־־־־־׃
translation:
  text: then may you hear in heaven, the place where you dwell, and forgive and act. Repay each person according to all their ways, knowing their heart—for you alone know every human heart—
  philosophy: dynamic
lexical_decisions:
- source_word: תִּשְׁמַע
  chosen: may you hear
  alternatives:
  - you shall hear
  - hear
  lexicon: HALOT
  rationale: In Solomon's prayer context, the imperfect functions jussively/petitionally rather than as a simple future. 'May you hear' best conveys the prayerful appeal in natural English.
- source_word: הַשָּׁמַיִם
  chosen: in heaven
  alternatives:
  - from heaven
  - the heavens
  lexicon: HALOT
  rationale: With the following apposition 'the place where you dwell,' English idiom prefers 'in heaven.' 'The heavens' is more formal but less natural here.
- source_word: מְכוֹן שִׁבְתֶּךָ
  chosen: the place where you dwell
  alternatives:
  - your dwelling place
  - the established place of your dwelling
  lexicon: HALOT
  rationale: מָכוֹן denotes an established place/fixed dwelling. The construct with 'your dwelling' is rendered idiomatically as 'the place where you dwell,' preserving the locative sense without stiffness.
- source_word: וְסָלַחְתָּ
  chosen: and forgive
  alternatives:
  - then forgive
  lexicon: HALOT
  rationale: Sequential waw + perfect continues the chain of requested divine actions. English present-form imperative/jussive style after 'may you hear' is the most natural equivalent.
- source_word: וְעָשִׂיתָ
  chosen: and act
  alternatives:
  - and do
  - and intervene
  lexicon: HALOT
  rationale: The verb is broad ('do/make'), but in this prayer context it refers to God's responsive action. 'Act' is concise and idiomatic without over-specifying the nature of the action.
- source_word: וְנָתַתָּ לָאִישׁ
  chosen: and give to each man
  alternatives:
  - and render to each man
  - and give to the man
  lexicon: HALOT
  rationale: The sense is distributive and individual. 'Each man' captures the singular generic force of לָאִישׁ in context.
- source_word: כְּכָל דְּרָכָיו
  chosen: according to all his ways
  alternatives:
  - according to all his conduct
  - according to all his ways of life
  lexicon: HALOT
  rationale: '''Ways'' is a standard and theologically resonant rendering of דֶּרֶךְ in moral contexts, preserving the Hebrew metaphor of conduct.'
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  chosen: whose heart you know
  alternatives:
  - as you know his heart
  - for you know his heart
  lexicon: HALOT
  rationale: 'This relative clause most naturally modifies the preceding individual: God gives according to a person''s ways, that person being one whose heart God knows. ''Whose heart you know'' is compact and faithful.'
- source_word: לְבָב / לְבָבוֹ
  chosen: heart
  alternatives:
  - mind
  - inner being
  lexicon: HALOT
  rationale: לֵבָב in Hebrew commonly denotes the inner person, including thought and will, but 'heart' remains the best primary English equivalent and preserves biblical idiom.
- source_word: לְבַדְּךָ
  chosen: you alone
  alternatives:
  - you by yourself
  - you only
  lexicon: HALOT
  rationale: This adverbial expression emphasizes God's exclusive knowledge. 'You alone' is the clearest idiomatic rendering.
- source_word: כָּל בְּנֵי הָאָדָם
  chosen: all the sons of man
  alternatives:
  - all mankind
  - all the children of man
  - all humanity
  lexicon: HALOT
  rationale: Per the project's gender-accurate policy, the masculine representative expression is preserved rather than neutralized. The phrase is a Hebrew idiom for human beings collectively, but 'sons of man' keeps the source texture and anthropological force.
