  from: Then I was beside him[a], like a master workman; and I was his delight day after day, rejoicing before him at all times[b],
  to: Then I was beside him, a skilled worker[a]; and I was a delight day after day, playing before him at all times,
  rationale: אָמֹון is genuinely difficult. “A skilled worker” gives the plausible artisan sense without the unsupported comparative “like” or the added rank “master,” while the note openly retains the principal child reading. “A delight” does not impose an explicit possessive absent from the Hebrew, though the relation to God is supplied by context. “Playing” preserves the concrete image of שׂחק, continued in the next verse, better than the abstracted “rejoicing.” Since the retained note covers only אָמוֹן, the former second marker should be removed.
