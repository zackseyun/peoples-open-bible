theological_decisions:
- issue: Whether χρηστότης / χρηστόν should be rendered as "kindness" or "goodness" in a way that might affect the tone of God's action.
  chosen_reading: Rendered both occurrences as "kindness."
  alternative_readings:
  - Rendered as "goodness" in one or both occurrences.
  rationale: The context emphasizes God's gracious restraint toward the sinner, so "kindness" better captures the personal and relational force while remaining faithful to the Greek.
  doctrine_reference: Translation philosophy §§5–6
- issue: Context-sensitive reorientation terminology
  chosen_reading: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to reorientation toward God?
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
