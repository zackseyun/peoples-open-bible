base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/004.yaml
  text: How long will the land mourn, and the grass of every field dry up? Because of the evil of those who dwell in it, beasts and birds are swept away, for they say, “He will not see our end.”
translation:
  language: ko
  text: 땅이 언제까지 애도하며[a], 모든 들의 풀이 마르겠습니까? 그곳에 사는 자들의 악 때문에 짐승과 새가 사라졌습니다. 이는 그들이 "그가 우리의 끝을 보지 못할 것이다"라고 말하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תֶּאֱבַ֣ל는 ‘애도하다/슬퍼하다’를 뜻합니다. 땅이 애도하는 것으로 묘사하여 자연의 황폐함을 의인화합니다.
    reason: source_note
lexical_decisions:
- source_word: תֶּאֱבַ֣ל הָ/אָ֔רֶץ
  english_pob_choice: the land mourn
  chosen_korean: 땅이 … 슬퍼하며
  alternatives_korean:
  - 땅이 … 애도하며
  - 땅이 … 통곡하며
  lexicon: מָתַי / אָבַל
  rationale: אָבַל의 기본적 애도·슬픔의 의미를 살려, 자연스러운 현대어로 ‘슬퍼하다’를 택했습니다.
- source_word: עֵ֥שֶׂב כָּל הַ/שָּׂדֶ֖ה
  english_pob_choice: the grass of every field
  chosen_korean: 들의 풀
