  text: Sacrifice and offering[a] you did not desire; ears you have opened for me[b]; burnt offering and sin offering you did not ask for.
  footnotes:
  - marker: a
    text: Or more specifically, “grain offering.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “ears you have dug for me,” likely an idiom for enabling hearing or obedience. The Septuagint, followed in Hebrews 10:5, reads “a body you prepared for me.”'
    reason: alternative_reading
translation:
  language: ko
  text: 제사와 곡식 제물을 원하지 않으셨으나[a], 주께서는 제 귀를 열어 주셨습니다[b]. 번제와 속죄제도 요구하지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제사와 예물’. 히브리어 ‘곡식 제물’은 문맥에 따라 더 넓게 ‘예물’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘제 귀를 파 주셨습니다.’ 이는 듣고 순종하도록 귀를 열어 주셨다는 관용적 표현으로 보입니다. 칠십인역은 ‘나를 위하여 몸을 준비하셨습니다’로 읽으며, 히브리서 10:5도 이를 따릅니다.
    reason: alternative_reading
