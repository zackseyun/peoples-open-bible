    reason: מַסִּיעַ의 의미 범위와 ‘채석’이라는 해석적 가능성을 보존합니다.
lexical_decisions:
- source_word: מַסִּיעַ אֲבָנִים
  english_pob_choice: Whoever quarries stones
  chosen_korean: 돌을 캐는 자
  alternatives_korean:
  - 석재를 채석하는 자
  - 돌을 캐는 사람
  lexicon: מסיע / אבנים
  rationale: 동작의 일반성을 살리면서도 ‘quarry’의 의미를 자연스럽게 드러내기 위해 ‘돌을 캐는 자’로 옮겼습니다. ‘채석하다’는 다소 기술적이고 현대적이어서 시적 경구의 직설성을 약화할 수 있습니다.
- source_word: יֵעָצֵב בָּהֶם
  english_pob_choice: may be hurt by them
  chosen_korean: 그것들에 의해 상처를 입을 수 있고
  alternatives_korean:
  - 그것들 때문에 다칠 수 있고
  - 그것들로 인해 상처받을 수 있고
  lexicon: עצב
  rationale: 히브리어는 ‘상처/고통을 당하다’의 수동적 결과를 나타내므로, 단순 사고보다 결과적 손상을 분명히 하는 ‘상처를 입다’를 택했습니다.
- source_word: בּוֹקֵעַ עֵצִים
  english_pob_choice: whoever splits logs
  chosen_korean: 통나무를 쪼개는 자
  alternatives_korean:
  - 장작을 패는 자
  - 나무를 쪼개는 자
  lexicon: בקע / עצים
  rationale: 개정된 영어 POB의 ‘logs’를 반영해 עֵצִים을 통나무로 옮겼습니다. ‘장작’은 이미 가공된 땔감의 뉘앙스가 더 강해 원문의 일반적 목재를 좁힐 수 있습니다.
- source_word: יִסָּכֶן בָּם
  english_pob_choice: may be endangered by them
  chosen_korean: 그것들에 의해 위험에 빠질 수 있습니다
  alternatives_korean:
  - 그것들로 인해 위험해질 수 있습니다
  - 그것들에 의해 다칠 수 있습니다
  lexicon: סכן
  rationale: סכן은 단순한 상해보다 ‘위험에 놓이다/위험에 빠지다’의 의미가 더 직접적이어서, 결과 상태를 드러내는 표현을 선택했습니다.
