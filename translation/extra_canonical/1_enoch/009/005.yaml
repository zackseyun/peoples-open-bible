translation:
  text: You made everything, and dominion over everything is with you. Everything is uncovered before you and manifest. You
    see everything, and nothing can hide itself from you.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: ገበርከ፡ ኵሎ
  chosen: You made everything
  alternatives:
  - You did everything
  - You created everything
  rationale: ገበረ has the broad sense “make/do.” With ኵሎ (“everything”) and the following assertion of universal dominion,
    “made” naturally expresses God’s making of all things without adding the more specific claim encoded by “created.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ስልጣነ፡ ኵሉ፡ ምስሌከ
  chosen: dominion over everything is with you
  alternatives:
  - the authority of everything is with you
  - power over everything belongs to you
  rationale: ስልጣን denotes authority, rule, power, or dominion. “Dominion over everything” preserves the royal and cosmic force,
    while “is with you” closely reflects ምስሌከ rather than replacing it with a smoother possessive idiom.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ክሡት፡ ቅድሜከ፡ ወግሁድ
  chosen: uncovered before you and manifest
  alternatives:
  - open before you and revealed
  - naked before you and visible
  rationale: ክሡት conveys what is uncovered, exposed, or open, while ግሁድ conveys what is manifest or evident. The paired terms
    are retained rather than collapsed, preserving the emphatic statement that nothing lies concealed before God.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ትሬኢ፡ ኵሎ
  chosen: You see everything
  alternatives:
  - You behold everything
  - You perceive everything
  rationale: The verb is the ordinary verb of seeing. “See” is clear modern English and preserves the direct assertion without
    importing a technical theological term such as “omniscient.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወአልቦ፡ ዘይትከሀል፡ ይትኀባእ፡ እምኔከ
  chosen: and nothing can hide itself from you
  alternatives:
  - and there is nothing that is able to conceal itself from you
  - and nothing can be hidden from you
  rationale: አልቦ marks nonexistence (“there is not/nothing”), ይትከሀል expresses ability, and the reflexive/passive form ይትኀባእ
    denotes being hidden or hiding oneself. “Hide itself” best preserves the verbal form and the image of attempted concealment.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
