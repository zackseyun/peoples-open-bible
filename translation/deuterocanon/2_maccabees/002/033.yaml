lexical_decisions:
- source_word: προσελθόντες
  chosen: came near
  alternatives:
  - approached
  - came forward
  lexicon: LSJ
  rationale: Aorist participle of προσέρχομαι, indicating movement toward the place in question. 'Came near' is natural English and preserves the directional sense without over-specifying the object approached.
- source_word: τινὲς τῶν συνακολουθούντων
  chosen: some of those who had followed
  alternatives:
  - some of the companions
  - some of those accompanying
  lexicon: LSJ
  rationale: The partitive construction τινὲς τῶν + participle is best represented as 'some of those who had followed.' This keeps the relation to the larger group explicit and avoids importing a more interpretive noun like 'companions.'
- source_word: ὥστε ἐπισημήνασθαι τὴν ὁδόν
  chosen: to mark the way
  alternatives:
  - so as to mark the road
  - in order to mark the route
  lexicon: LSJ
  rationale: Here ὥστε with infinitive expresses intended result/purpose. ἐπισημήνασθαι conveys marking out or indicating clearly. 'The way' is a flexible rendering of τὴν ὁδόν that fits either path or route in context.
- source_word: οὐκ ἠδυνήθησαν
  chosen: they were not able
  alternatives:
  - they could not
  lexicon: LSJ
  rationale: This preserves the verbal force of inability more explicitly than the contracted English 'could not,' while remaining idiomatic.
- source_word: εὑρεῖν
  chosen: to find it
  alternatives:
  - to find
  - to discover it
  lexicon: LSJ
  rationale: The infinitive depends on ἠδυνήθησαν. English idiom benefits from supplying the object 'it,' referring back to the way/place sought, which is implicit from context and the preceding clause.
