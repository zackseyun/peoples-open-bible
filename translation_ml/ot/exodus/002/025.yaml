  text: וַ/יַּ֥רְא אֱלֹהִ֖ים אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֵּ֖דַע אֱלֹהִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/025.yaml
  text: God saw the sons of Israel, and God knew.
translation:
  language: ml
  text: ദൈവം ഇസ്രായേൽമക്കളെ കണ്ടു; ദൈവം അറിഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ/പുത്രന്മാർ’ എന്ന ഹീബ്രായ പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികവും പാരമ്പര്യപരവുമായ സമൂഹനാമമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: സാധാരണമായ ‘കാണുക’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיֵּדַע
  choice: അറിഞ്ഞു
  rationale: ഹീബ്രായ ക്രിയയുടെ സംക്ഷിപ്തതയും ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; ‘ശ്രദ്ധിച്ചു’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘ദൈവം അറിഞ്ഞു’ എന്ന വാക്യത്തിന്റെ അവ്യക്തത
  choice: ദൈവം അറിഞ്ഞു
  alternative: ദൈവം അവരെ ശ്രദ്ധിച്ചു / അവരുടെ സ്ഥിതി മനസ്സിലാക്കി
  rationale: മൂലപാഠം ‘എന്ത്’ അറിഞ്ഞു എന്ന് വ്യക്തമാക്കുന്നില്ല. ഉടമ്പടി ഓർത്തതും ജനത്തിന്റെ കഷ്ടതയോടുള്ള ദൈവിക പരിഗണനയും സന്ദർഭത്തിൽ സൂചിപ്പിക്കപ്പെടുന്നുവെങ്കിലും, വിവർത്തനം ആ അർഥം തുറന്ന് ചേർക്കാതെ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംക്ഷിപ്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ഔപചാരിക ശൈലി. മൂലവാക്യത്തിലെ ദൈവനാമത്തിന്റെ ആവർത്തനം നിലനിർത്തിയിരിക്കുന്നു.
