translation:
  text: All his work[a] was with the Watchers[b], and his days were with the holy ones.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: 'Charles prints the all-word between daggers, with a star before its opening dagger; another star precedes
      Watchers. Apparatus5 calls the all-word a corruption of a rendering of an article. The main text is retained
      rather than replaced with the editor’s proposed wording. The selected second clause is compressed: his days
      is supplied with were in English, not changed to an unprinted life-span or journey. This is an intrinsically
      uncertain printed-edition reading, not a secure manuscript reconstruction.'
  - marker: b
    reason: cultural_note
    text: Watchers translates the vigilance/wakefulness designation for heavenly beings here, not ordinary human
      observers. Personally viewed Dillmann1865 columns571–572, whose relevant head includes the angelic epithet.
      The text separately calls others the holy ones; no equation of every Watcher with the holy ones is added.
