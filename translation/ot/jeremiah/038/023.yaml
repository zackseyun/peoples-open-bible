  category: meaning_retranslation
  from: And all your wives and your sons will be brought out to the Chaldeans[a], and you yourself will not escape from their hand, for you will be seized by the hand of the king of Babylon[c][b], and this city will be burned with fire.
  to: All your wives and sons will be brought out to the Chaldeans. You yourself will not escape their hands, for you will be captured by the king of Babylon, and you will cause this city to be burned down[a].”
  rationale: 'There is no maintainer ruling here; the prior explanation takes תִּשְׂרֹף as feminine singular, but אֶת marks ''this city'' as its object, so the verb addresses the king: ''you will burn.'' The translation restores Zedekiah’s responsibility for the burning rather than presenting only a passive outcome.'
