lexical_decisions:
- source_word: ወርኢኩ
  chosen: And I saw
  rationale: Preserves the first-person visionary report and its opening conjunction.
- source_word: አድባረ፡ ቀበሬት፡ እለ፡ ክረምት
  chosen: the mountains of winter darkness
  alternatives:
  - the mountains of winter
  rationale: Retains the mountain and winter imagery, but the OCR form ቀበሬት is uncertain; ‘darkness’ is provisional, not a secure lexical identification.
- source_word: ምክዐወ
  chosen: outpouring
  alternatives:
  - outlet
  - place of outflow
  rationale: Preserves the movement of the source noun without adding an explicit place.
- source_word: ማይ፡ ዘኵሉ፡ ቀላይ
  chosen: all the waters of the deep
  alternatives:
  - the water of every sea
  - the waters of all the seas
  rationale: Preserves the singular deep-water image instead of multiplying separate seas.
