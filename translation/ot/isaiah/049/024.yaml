theological_decisions:
- issue: Interpretation of צַדִּיק in a context describing a captor
  chosen_reading: Provisionally retain the WLC wording and current 'righteous one' interpretation, with explicit published-scroll
    and Greek distinctions in the note.
  alternative_readings:
  - Select the published Great Isaiah Scroll's עריץ, 'ruthless one,' while separately adjudicating its linked wording.
  - Interpret the retained צדיק in terms of legal entitlement or an innocent captive; these are interpretive alternatives,
    not newly attested Hebrew spellings.
  rationale: The scroll wording fits the oppressor context, but its paired noun changes make local harmonization a concrete
    competing explanation. The Greek's unjust-capture construction does not directly attest the same Hebrew noun. The present
    decision retains the base provisionally and discloses the alternatives; it does not establish historical priority or declare
    one interpretation optimal.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
