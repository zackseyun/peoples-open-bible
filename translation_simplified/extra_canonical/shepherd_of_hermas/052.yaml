  text: 'Εἶπόν σοι, φησί, καὶ ἄρτι, ὅτι πανοῦργος εἶ καὶ αὐθάδης, ἐπερωτῶν τὰς ἐπιλύσεις τῶν παραβολῶν.
    ἐπειδὴ δὲ οὕτω παράμονος εἶ, ἐπιλύσω σοι τὴν παραβολὴν τοῦ ἀγροῦ καὶ τῶν λοιπῶν τῶν ἀκολούθων πάντων,
    ἵνα γνωστὰ πάντα ποιήσῃς αὐτά. ἄκουε νῦν, φησί, καὶ σύνιε αὐτά. 2. ὁ ἀγρὸς ὁ κόσμος οὗτός ἐστιν· ὁ
    δὲ κύριος τοῦ ἀγροῦ, ὁ κτίσας τὰ πάντα καὶ ἀπαρτίσας αὐτὰ καὶ ἐνδυναμώσας. ὁ δὲ δοῦλος ὁ υἱὸς τοῦ
    Θεοῦ ἐστιν· αἱ δὲ ἄμπελοι ὁ λαὸς [οὗτός] ἐστιν ὃν αὐτὸς ἐφύτευσεν. 3. οἱ δὲ χάρακες οἱ [ἅγιοι] ἄγγελοί
    εἰσιν τοῦ Κυρίου οἱ συγκρατοῦντες τὸν λαὸν αὐτοῦ· αἱ δὲ βοτάναι αἱ ἐκτετιλμέναι ἐκ τοῦ ἀμπελῶνος,
    αἱ ἀνομίαι εἰσὶ τῶν δούλων τοῦ Θεοῦ· τὰ δὲ ἐδέσματα ἃ ἔπεμψεν αὐτῷ ἐκ τοῦ δείπνου, αἱ ἐντολαί εἰσιν
    ἃς ἔδωκε τῷ λαῷ αὐτοῦ διὰ τοῦ υἱοῦ αὐτοῦ· οἱ δὲ φίλοι καὶ σύμβουλοι, οἱ ἅγιοι ἄγγελοι οἱ πρῶτοι κτισθέντες·
    ἡ δὲ ἀποδημία τοῦ δεσπότου, ὁ χρόνος ὁ περισσεύων εἰς τὴν παρουσίαν αὐτοῦ. 4. λέγω αὐτῷ· Κύριε, μεγάλως
    καὶ θαυμαστῶς [πάντα ἐστὶ] καὶ ἐνδόξως πάντα ἔχει. μὴ οὖν, φημί, ἐγὼ ἠδυνάμην ταῦτα νοῆσαι; οὐδὲ ἕτερος
    τῶν ἀνθρώπων, κἂν λίαν συνετός ᾖ τις, οὐ δύναται νοῆσαι αὐτά. ἔτι, φημί, κύριε, δήλωσόν μοι ὃ μέλλω
    σε ἐπερωτᾶν. 5. Λέγε, φησίν, εἴ τι βούλει. Διατί, φημί, [κύριε,] ὁ υἱὸς τοῦ Θεοῦ εἰς δούλου τρόπον
    κεῖται ἐν τῇ παραβολῇ;


    Ἄκουε, φησίν· εἰς δούλου τρόπον οὐ κεῖται ὁ υἱὸς τοῦ Θεοῦ, ἀλλ᾽ εἰς ἐξουσίαν μεγάλην κεῖται καὶ κυριότητα.
    Πῶς, φημί, κύριε; οὐ νοῶ. 2. Ὅτι, φησίν, ὁ Θεὸς τὸν ἀμπελῶνα ἐφύτευσε, τοῦτ᾽ ἔστι τὸν λαὸν ἔκτισε,
    καὶ παρέδωκε τῷ υἱῷ αὐτοῦ· καὶ ὁ υἱὸς κατέστησε τοὺς ἀγγέλους ἐπ᾽ αὐτοὺς τοῦ συντηρεῖν αὐτούς· καὶ
    αὐτὸς τὰς ἁμαρτίας αὐτῶν ἐκαθάρισε πολλὰ κοπιάσας καὶ πολλοὺς κόπους ἠντληκώς· οὐδεὶς γὰρ δύναται
    σκαφεῦσαι ἄτερ κόπου ἢ μόχθου. 3. αὐτὸς οὖν καθαρίσας τὰς ἁμαρτίας τοῦ λαοῦ ἔδειξεν αὐτοῖς τὰς τρίβους
    τῆς ζωῆς, δοὺς αὐτοῖς τὸν νόμον ὃν ἔλαβε παρὰ τοῦ πατρὸς αὐτοῦ. 4. | βλέπεις, φησίν, ὅτι αὐτὸς κύριός
    ἐστι τοῦ λαοῦ, ἐξουσίαν πᾶσαν λαβὼν παρὰ τοῦ πατρὸς αὐτοῦ. | ὅτι δὲ ὁ κύριος σύμβουλον ἔλαβε τὸν υἱὸν
    αὐτοῦ καὶ τοὺς ἐνδόξους ἀγγέλους περὶ τῆς κληρονομίας τοῦ δούλου, ἄκουε. 5. τὸ πνεῦμα τὸ ἅγιον τὸ
    προόν, τὸ κτίσαν πᾶσαν τὴν κτίσιν, κατῴκισεν ὁ Θεὸς εἰς σάρκα ἣν ἠβούλετο. αὕτη οὖν ἡ σάρξ, ἐν ᾗ κατῴκησε
    τὸ πνεῦμα τὸ ἅγιον, ἐδούλευσε τῷ πνεύματι καλῶς ἐν σεμνότητι καὶ ἁγνείᾳ πορευθεῖσα, μηδὲν ὅλως μιάνασα
    τὸ πνεῦμα. 6. πολιτευσαμένην οὖν αὐτὴν καλῶς καὶ ἁγνῶς καὶ συγκοπιάσασαν τῷ πνεύματι καὶ συνεργήσασαν
    ἐν παντὶ πράγματι, ἰσχυρῶς καὶ ἀνδρείως ἀναστραφεῖσαν, μετὰ τοῦ πνεύματος τοῦ ἁγίου εἵλατο κοινωνόν·
    ἤρεσε γὰρ [τῷ Κυρίῳ] ἡ πορεία τῆς σαρκὸς ταύτης, ὅτι οὐκ ἐμιάνθη ἐπὶ τῆς γῆς ἔχουσα τὸ πνεῦμα τὸ ἅγιον.
    7. σύμβουλον οὖν ἔλαβε τὸν υἱὸν καὶ τοὺς ἀγγέλους τοὺς ἐνδόξους, ἵνα καὶ ἡ σὰρξ αὕτη, δουλεύσασα τῷ
    πνεύματι ἀμέμπτως, σχῇ τόπον τινὰ κατασκηνώσεως, καὶ μὴ δόξῃ τὸν μισθὸν | τῆς δουλείας αὐτῆς ἀπολωλεκέναι·
    πᾶσα γὰρ σὰρξ ἀπολήψεται μισθὸν | ἡ εὑρεθεῖσα ἀμίαντος καὶ ἄσπιλος, ἐν ᾗ τὸ πνεῦμα τὸ ἅγιον κατῴκησεν.
    8. ἔχεις καὶ ταύτης τῆς παραβολῆς τὴν ἐπίλυσιν.'
