  from: You hide your face[a], they are terrified; you take away their breath[b], they die and return to their dust.
  to: When you hide your face, they are terrified; when you take away their breath,[a] they die and return to their dust.
  rationale: The Hebrew parataxis presents the creatures' responses to God's actions. Recasting the paired clauses with “when” makes that temporal relationship idiomatic English and removes the comma-splice construction without adding a substantive interpretation. “Face” appropriately preserves the source image, while the genuine breadth of רוּחַ is retained in a note at the relevant term.
