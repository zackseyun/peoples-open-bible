translation:
  text: He answered and said to me, “These three were made so that the spirits of the dead might be separated. In
    this way a place was set apart for the spirits of the righteous, where there is a spring of water, with brightness
    above it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The actual selected numeral is three, despite four in22:2; it is not harmonized. A place is supplied in
      English with the impersonal separation clause. The final selected word ብርህት is the feminine adjective bright,
      visually identical to that in22:2. Charles printed58 note32 says it was emended from the noun ብርሃን with Greek
      φωτεινή; the source does not simply print the noun light. English brightness is a provisional nominalized
      rendering of this adjective, while above it retains the actual preposition and suffix. The suffix does not
      securely identify whether the spring, the place, or another antecedent is intended, and the relative/adjectival
      syntax remains uncertain; this is not a recovered clear predication. The editorial Greek-based choice is not
      independent manuscript attestation.
    reason: textual_variant
