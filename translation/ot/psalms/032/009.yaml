id: PSA.32.9
reference: Psalms 32:9
source:
  edition: WLC
  text: אַל תִּֽהְי֤וּ כְּ/ס֥וּס כְּ/פֶרֶד֮ אֵ֤ין הָ֫בִ֥ין בְּ/מֶֽתֶג וָ/רֶ֣סֶן עֶדְי֣/וֹ לִ/בְל֑וֹם בַּ֝֗ל קְרֹ֣ב אֵלֶֽי/ךָ־׀־׃
translation:
  text: Do not be like a horse or a mule with no understanding, which must be restrained with bit and bridle; otherwise it will not come near you[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “to keep it from coming near you.” The difficult final clause may describe either an animal that will not approach unless restrained or one restrained to prevent its approach.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיוּ
  chosen: Do not be
  alternatives:
  - Do not become
  lexicon: HALOT
  rationale: אַל with היה in the imperfect/jussive gives a prohibition. English 'Do not be' is the most natural rendering in context, though 'Do not become' is possible.
- source_word: כְּסוּס
  chosen: like a horse
  lexicon: HALOT
  rationale: Straightforward comparison marker כ plus סוּס. Singular collective imagery is preserved.
- source_word: כְּפֶרֶד
  chosen: like a mule
  alternatives:
  - like a donkey-mule
  lexicon: HALOT
  rationale: פֶרֶד denotes a mule. 'Mule' is clear modern English and matches the paired animal imagery.
- source_word: אֵין הָבִין
  chosen: without understanding
  alternatives:
  - having no understanding
  - without discernment
  lexicon: HALOT
  rationale: The phrase describes the animals as lacking understanding/discernment. 'Without understanding' is idiomatic and preserves the moral-intellectual sense.
- source_word: בְּמֶתֶג וָרֶסֶן
  chosen: bit and bridle
  alternatives:
  - bridle and reins
  - bit and halter
  lexicon: HALOT
  rationale: מֶתֶג commonly refers to a bit or bridle-control, and רֶסֶן to a bridle/rein. The traditional pair 'bit and bridle' best captures the sense of controlling tack in concise English.
- source_word: עֶדְיוֹ
  chosen: whose trappings are
  alternatives:
  - its ornament is
  - its harness is
  - its adornment is
  lexicon: HALOT
  rationale: עֲדִי often means ornament/adornment, but here in context of horse and mule with bit and bridle it refers to what is put on the animal—its trappings/harness. 'Whose trappings are' makes the syntax intelligible in English without flattening the image.
- source_word: לִבְלֹם
  chosen: to restrain it
  alternatives:
  - to curb it
  - for holding it in check
  lexicon: HALOT
  rationale: From בלם, 'to restrain, check, muzzle.' In context of bit and bridle, 'to restrain it' is natural and sufficiently literal.
- source_word: בַּל קְרֹב אֵלֶיךָ
  chosen: otherwise it will not come near you
  alternatives:
  - otherwise they will not come near you
  - lest it come near you
  lexicon: HALOT
  rationale: This is a plausible contextual construal of the difficult clause; the possible sense “lest it come near you” is preserved in the note.
- source_word: בְּמֶתֶג וָרֶסֶן עֶדְיוֹ לִבְלֹם
  chosen: whose trappings—bit and bridle—are for restraint
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This retains עֶדְיוֹ as the animal’s trappings, identifies the bit and bridle appositionally, and preserves the purposive force of לִבְלֹם without gloss-like syntax.
