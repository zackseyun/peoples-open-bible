  text: Great is his glory through your salvation[a][b]; you bestow splendor and majesty on him.
  footnotes:
  - marker: a
    text: '''Salvation'' may also be understood here as ''deliverance'' or, in this royal context, ''victory.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'by your salvation' or 'in your salvation'; the Hebrew preposition can express means or sphere.
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 구원[a][b]으로 말미암아 그의 영광이 큽니다. 주께서 그에게 존귀와 위엄을 더하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 구원 안에서’ 또는 ‘주의 구원으로’. 히브리어 전치사는 수단 또는 영역을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구원’은 ‘건져 주심’으로도, 이 왕적 문맥에서는 ‘승리’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 긴 생명
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 여기서는 추상적 단수 의미의 ‘생명’이 자연스럽고, 뒤의 기간 표현으로 길이가 확장됩니다.
- source_word: שָׁאַל מִמְּךָ
  english_pob_choice: asked from you
  chosen_korean: 주님께 ... 구하였고
  alternatives_korean:
  - 주님께 ... 요청하였고
  - 주님으로부터 ... 구하였고
  lexicon: HALOT
  rationale: שָׁאַל는 ‘구하다/청하다’의 뜻이므로, 시적 문맥에서 ‘구하였고’가 자연스럽고 원문의 청원성을 잘 살립니다. 한국어에서는 대상과 출처를 모두 드러내기보다 ‘주님께’가 더 유려합니다.
- source_word: אֹרֶךְ יָמִים
  english_pob_choice: length of days
  chosen_korean: 날들의 길이
  alternatives_korean:
  - 장수
  - 긴 생애
  - 오랜 세월
  lexicon: HALOT
  rationale: 이 관용구를 ‘날들의 길이’로 옮기면 원문의 시적 병렬과 직역적 울림을 보존할 수 있습니다. ‘장수’는 의미는 분명하지만 뒤의 ‘영원히, 영원히’와의 구분이 약해집니다.
- source_word: עוֹלָם וָעֶד
  english_pob_choice: forever and ever
  chosen_korean: 영원히, 영원히
  alternatives_korean:
  - 영원무궁히
  - 세세토록
  lexicon: HALOT
  rationale: 쌍어 표현의 반복과 강조를 한국어에서도 살리기 위해 ‘영원히, 영원히’로 옮겼습니다. 보다 전통적인 관용구보다 반복 자체가 가진 강조 효과를 유지합니다.
theological_decisions:
- issue: 왕의 생명 약속을 과도하게 해석하지 않음
  chosen_reading: 본문의 시간을 ‘영원히, 영원히’로 직접 유지하되, 본문 안에서 이를 단순 과장이나 메시아 해석으로 축소하지 않습니다.
  alternative_readings:
  - 단순한 궁중 과장으로 축소
  - 메시아적 성취를 본문 번역에 명시
  rationale: 히브리어 자체가 무한한 지속을 말하므로, 번역은 그 긴장을 그대로 보존해야 합니다. 해석적 결론은 주해의 몫으로 남겨 두는 편이 POB의 원칙에 맞습니다.
  doctrine_reference: 번역은 해석적 결론을 미리 확정하지 않고 본문의 긴장을 보존합니다.
