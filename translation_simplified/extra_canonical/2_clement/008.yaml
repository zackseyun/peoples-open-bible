translation:
  language: en
  text: 'So while we are still on earth, let us reorient[b], because we are like clay in the hands of a craftsman.


    When a potter is making a container and it becomes misshapen or crushed in his hands, he shapes it again. But once he has put it into the fiery oven, he can no longer repair it. In the same way, while we are still in this world, let us reorient wholeheartedly of the evil things we have done with our bodies, so that we may be saved by the Lord while we still have time to reorient.


    After we leave this world, we can no longer confess our sins or reorient.


    Therefore, brothers and sisters, if we do the Father’s will, keep our bodies pure, and obey the Lord’s commands, we will receive eternal life.


    For the Lord says in the Gospel, “If you have not kept what is small, who will entrust you with something great? I tell you, whoever is faithful in the smallest matter is also faithful in much.”


    This is what he means: “Keep your body pure and the seal unstained,[a] so that we may receive life.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “seal” is an image of a mark that must remain unstained; its precise meaning is not explained here.
    reason: simplification_note
  - marker: b
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
