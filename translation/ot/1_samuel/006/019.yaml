  rationale: Retention avoids silently deleting source content, not proof that fifty thousand belonged to the earliest text. The selected Rahlfs/Hanhart Greek includes both figures; Josephus recounts seventy with a different offense explanation. The NET author note reports a few medieval Hebrew omissions, but those individual copies were not collated here. Distinguish interpretation, selected versional text, retelling and modern editorial report. The numerical and look-at/look-into questions remain open.
