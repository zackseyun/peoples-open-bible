theological_decisions:
- issue: The statement that Abraham, Isaac, and Jacob 'did not sin against you' could be softened to avoid tension with broader biblical portrayals of the patriarchs as sinners.
  chosen_reading: 'Retain the text''s direct wording: ''who did not sin against you.'''
  alternative_readings:
  - who did not sin greatly against you
  - who were not counted as sinners before you
  - who did not sin in this matter
  rationale: The Greek witness plainly says οὐχ ἡμαρτηκόσιν σοι without qualification. The translation should preserve the prayer's rhetoric rather than harmonize it with other passages or later theology.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: Contextual repentance reassessment
  chosen_reading: So you[a], Lord, God of the righteous, did not appoint repentance for the righteous—for Abraham and Isaac and Jacob, who did not sin against you—but you appointed repentance for me, the sinner,
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: The prayer contrasts those for whom repentance was not appointed with the sinful speaker; preserve both negation and contrast without adding a second-person destination to metanoia.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
