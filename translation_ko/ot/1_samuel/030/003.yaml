  text: When David and his men came to the city, behold, it had been burned with fire, and their wives, sons, and daughters had been taken captive.
translation:
  language: ko
  text: 다윗과 그의 사람들이 그 성읍에 이르렀을 때, 보니 그 성읍은 불에 타 있었고, 그들의 아내들과 아들들과 딸들은 사로잡혀 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보니
  alternatives_korean:
  - 보라
  - 그런데
  - 그때 보니
  lexicon: none
  rationale: 사건의 갑작스러움과 발견의 뉘앙스를 간결하게 살리기 위해 서술문 안에서는 ‘보니’가 가장 자연스럽습니다.
- source_word: שְׂרוּפָה בָּאֵשׁ
  english_pob_choice: it had been burned with fire
  chosen_korean: 불에 타 버렸고
  alternatives_korean:
  - 불로 소각되어 있었고
  - 불에 의해 불타 있었고
  - 불타 있었고
  lexicon: none
  rationale: 히브리어의 상태 결과를 한국어로 자연스럽게 옮기면서, 완전히 타 버린 참상을 분명히 드러내기 위해 ‘타 버렸고’로 렌더링했습니다.
- source_word: נִשְׁבּוּ
  english_pob_choice: taken captive
  chosen_korean: 사로잡혀 있었습니다
  alternatives_korean:
  - 포로로 끌려가 있었습니다
  - 붙잡혀 있었습니다
  - 사로잡혔습니다
  lexicon: none
  rationale: 단순히 붙잡힌 것이 아니라 전쟁 포로로 끌려간 상태를 나타내므로, 상태 지속을 드러내는 ‘사로잡혀 있었습니다’가 적절합니다.
theological_decisions:
- issue: 서술 시점의 상태 표현
  chosen_reading: 도시의 파괴와 가족들의 포로 상태를 결과 상태로 제시합니다.
  alternative_readings:
  - 단회적 사건 중심의 ‘불탔다’/‘사로잡혔다’
  - 더 완곡한 ‘피해를 입었다’
  rationale: 본문은 귀환 직후 확인된 충격적 상황을 묘사하므로, 결과 상태를 분명히 드러내는 번역이 서술 의도에 가장 충실합니다.
  doctrine_reference: 본문 서사 이해
