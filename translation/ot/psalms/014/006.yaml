id: PSA.14.6
reference: Psalms 14:6
source:
  edition: WLC
  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
translation:
  text: You try to thwart[a] the plans of the poor, but[b] Yahweh is their refuge.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “put to shame.”
    reason: lexical_alternative
  - marker: b
    text: Or “for Yahweh is their refuge.”
    reason: alternative_reading
lexical_decisions:
- source_word: עֲצַת
  chosen: the counsel of
  alternatives:
  - the plan of
  - the advice of
  - the purpose of
  lexicon: HALOT
  rationale: Construct form of עֵצָה, denoting counsel, plan, or advice. 'Counsel' preserves the broad sense without over-specifying either internal intention ('plan') or spoken advice alone.
- source_word: עָנִי
  chosen: the poor
  alternatives:
  - the afflicted
  - the needy
  - the humble
  lexicon: HALOT
  rationale: עָנִי commonly denotes one who is poor, afflicted, or oppressed. In this psalm's social and moral context, 'the poor' is concise and natural English while still allowing the broader vulnerability implied by the Hebrew.
- source_word: תָבִישׁוּ
  chosen: You put ... to shame
  alternatives:
  - you put to shame
  - you mock
  - you disgrace
  - You shame
  lexicon: HALOT
  rationale: The Hiphil means to put something or someone to shame. English needs the full idiom with the abstract object 'counsel.'
- source_word: כִּי
  chosen: for
  alternatives:
  - for
  - since
  - because
  lexicon: HALOT
  rationale: The particle introduces a causal/explanatory clause. “For” preserves that relation without overexplaining how it functions in the discourse.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: מַחְסֵהוּ
  chosen: his refuge
  alternatives:
  - his shelter
  - his place of refuge
  lexicon: HALOT
  rationale: מַחְסֶה means refuge or shelter, with 3ms suffix. 'His refuge' is the most natural and established rendering, preserving the metaphor of protective safety.
