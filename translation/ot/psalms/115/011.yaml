id: PSA.115.11
reference: Psalms 115:11
source:
  edition: WLC
  text: יִרְאֵ֣י יְ֭הוָה בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
translation:
  text: You who fear Yahweh, trust in Yahweh; he is your help and your shield.
  philosophy: dynamic
lexical_decisions:
- source_word: יִרְאֵי
  chosen: You who fear
  alternatives:
  - O fearers of
  - Those who fear
  lexicon: HALOT
  rationale: 'Construct participle plural from ירא used substantivally: ''those who fear.'' Rendering with direct address (''You who fear'') fits the psalm''s exhortational style and pairs naturally with the imperative plural that follows.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: בִּטְחוּ
  chosen: trust
  alternatives:
  - put your trust
  - have confidence
  lexicon: HALOT
  rationale: Qal imperative plural of בטח. 'Trust' is the most direct and natural imperative in English, preserving the command without unnecessary expansion.
- source_word: בַיהוָה
  chosen: in Yahweh
  alternatives:
  - in Yahweh
  - in Jehovah
  lexicon: HALOT
  rationale: The preposition ב with בטח is idiomatically rendered 'trust in.' Repeating 'the LORD' preserves the Hebrew repetition for emphasis.
- source_word: עזרם
  lemma: עזר
  chosen: their help
  alternatives:
  - their helper
  - help for them
  lexicon: HALOT
  rationale: The noun עזר denotes 'help' or 'helper.' Here the parallel with 'shield' and the predicate structure favor the abstract noun 'help,' matching common biblical idiom ('He is their help and their shield').
- source_word: ומגנם
  chosen: and their shield
  alternatives:
  - and their protector
  lexicon: HALOT
  rationale: מגן literally means 'shield.' The concrete metaphor should be preserved rather than generalized to 'protector.'
- source_word: הוא
  chosen: he is
  alternatives:
  - he
  - it is
  lexicon: HALOT
  rationale: 'The independent pronoun functions as the predicate subject for emphasis: ''he is.'' Explicitly supplying ''is'' is required in English and preserves the emphatic assertion.'
- source_word: עֶזְרָם
  chosen: your help
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Although the Hebrew suffix is third-person plural, English direct address naturally carries the plural audience with “your.”
- source_word: וּמָגִנָם
  chosen: and your shield
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Conforms the English possessive to the direct address while retaining the concrete Hebrew metaphor.
