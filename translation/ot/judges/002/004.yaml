  from: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
  to: When the angel of Yahweh spoke these words to all the Israelites, the people wept aloud.
  rationale: The lexical history recognizes both the collective identity of the audience and the audible force of raising their voices. The rendering carries those meanings directly while retaining “angel of Yahweh” without specifying the messenger’s nature.
