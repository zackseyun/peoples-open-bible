source:
  edition: WLC
  text: כְּעַ֞ן אֲנָ֣ה נְבוּכַדְנֶצַּ֗ר מְשַׁבַּ֨ח וּ/מְרוֹמֵ֤ם וּ/מְהַדַּר֙ לְ/מֶ֣לֶךְ שְׁמַיָּ֔/א דִּ֤י כָל מַעֲבָד֨וֹ/הִי֙ קְשֹׁ֔ט וְ/אֹרְחָתֵ֖/הּ דִּ֑ין וְ/דִי֙ מַהְלְכִ֣ין בְּ/גֵוָ֔ה יָכִ֖ל לְ/הַשְׁפָּלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/034.yaml
  text: Now I, Nebuchadnezzar, praise and exalt and honor the King of heaven, because all his works are truth, and his ways are justice; and those who walk in pride he is able to humble.
translation:
  language: ko
  text: 이제 나 느부갓네살은 하늘의 왕을 찬양하고 높이며 존귀하게 합니다. 그의 모든 행위는 참되고 그의 길은 정의로우며, 교만 가운데 행하는 자들을 그는 낮추실 수 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשַׁבַּח וּ/מְרוֹמֵם וּ/מְהַדַּר
  english_pob_choice: praise and exalt and honor
  chosen_korean: 찬양하고 높이며 존귀히 여깁니다
  alternatives_korean:
  - 찬양하고 들어 높이며 영화롭게 합니다
  - 찬양하고 높이며 존중합니다
  lexicon: 찬양하다 / 높이다 / 존귀히 여기다
  rationale: 세 동사의 병렬을 살리되, 현대 합쇼체에서 자연스럽고 예배적 의미를 유지하는 표현으로 옮겼습니다.
- source_word: לְ/מֶ֣לֶךְ שְׁמַיָּ֔/א
  english_pob_choice: the King of heaven
  chosen_korean: 하늘의 왕
  alternatives_korean:
  - 하늘 왕
  - 하늘의 임금
  lexicon: 하늘의 왕
  rationale: 직역에 가깝게 유지하면서도 한국어 문맥에서 통용 가능한 왕호를 사용했습니다.
- source_word: קְשֹׁ֔ט ... דִּין
  english_pob_choice: truth ... justice
  chosen_korean: 진실하고 ... 정의이며
  alternatives_korean:
  - 참되고 ... 공의이며
  - 진리이며 ... 정의이며
  lexicon: 진실하다 / 정의
  rationale: 문맥상 하나님의 행위와 길의 성격을 진술하므로, 사전적 대응을 유지하면서도 자연스러운 한국어 판단문으로 구성했습니다.
- source_word: בְּ/גֵוָה
  english_pob_choice: in pride
  chosen_korean: 교만하게
  alternatives_korean:
  - 오만하게
  - 자만하여
  lexicon: 교만하다
  rationale: 행동 방식(‘walk’)을 부사형으로 살려, מקור의 ‘교만’ 상태를 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 주어와 시제 — “he is able to humble”
  chosen_reading: “그는 낮추실 수 있습니다”
  alternative_readings:
  - 그는 낮출 수 있습니다
  - 그는 겸손하게 하실 수 있습니다
  rationale: ‘walk in pride’에 대응하는 심판적 능력을 드러내는 동사로 ‘낮추다’를 택했고, 가능 표현으로 하나님의 주권을 보존했습니다.
  doctrine_reference: 하나님의 주권과 교만한 자를 낮추시는 심판의 주제
- issue: ‘your works are truth / your ways are justice’의 품사 처리
  chosen_reading: “그의 모든 일은 진실하고, 그의 길은 정의이며”
  alternative_readings:
  - 그의 모든 일은 진리이며, 그의 길은 공의입니다
  - 그의 모든 행위는 참되고, 그의 길은 옳습니다
  rationale: 히브리어 병렬 구조를 유지하되, 한국어에서 두 속성을 대등하게 진술하는 형태로 정리했습니다.
  doctrine_reference: 하나님의 행위와 길의 도덕적 정당성
