theological_decisions:
- issue: Meaning of הַמּוֹרֶה in a verse sometimes read messianically as 'the teacher of righteousness'
  chosen_reading: Rendered as 'the early rain' in the main text
  alternative_readings:
  - the teacher for righteousness
  - the teacher of righteousness
  rationale: Agricultural context supports retaining rain provisionally. Teacher need not automatically identify a Messiah; theological preference cannot decide the lexical interpretation. The selected Latin's teacher and Greek/Syriac food expressions remain visible in note a without establishing different Hebrew consonants. This application does not newly certify the first-gift rendering.
  doctrine_reference: Translation philosophy §1, §3
- issue: Sense of לִצְדָקָה
  chosen_reading: Provisionally retain 'for righteousness' with contextual alternatives
  alternative_readings:
  - in just measure
  - for your vindication
  - for your prosperity
  rationale: The main word retains a lexical association, not a conclusion that צדקה is only ethical righteousness or physical correctness. Consulted BDB6b supplies a prosperity interpretation of this rain phrase within vindication/salvation. Note b preserves contextual alternatives; theological vocabulary is not a veto against a later source-grounded main-English comparison.
  doctrine_reference: Translation philosophy §3, §5
