  text: ἔλεγον δὲ καὶ τῶν δορυφόρων τινὲς ὡς ὅτε ἔμελλεν καὶ αὐτὴ συλλαμβάνεσθαι πρὸς θάνατον, ἵνα μὴ ψαύσειέν τι τοῦ σώματος αὐτῆς, ἑαυτὴν ἔρριψεν κατὰ τῆς πυρᾶς.
