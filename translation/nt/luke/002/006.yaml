- issue: Potential implication of providential or appointed timing in ἐπλήσθησαν αἱ ἡμέραι
  chosen_reading: Rendered as 'the days were fulfilled' rather than reducing to a bare 'the time came,' preserving Luke's wording without adding explicit theological interpretation.
