review_pass:
  verdict: revise
  source_fidelity: 현 초안은 시편 84편 4절이 아니라 앞 절(84:3)의 참새·제비·제단 내용을 옮긴 것이므로, 제시된 히브리어 본문과 일치하지 않습니다. 84:4의 אַשְׁרֵי, יוֹשְׁבֵי בֵיתֶךָ, עוֹד יְהַלְלוּךָ, סֶלָה를 모두 반영하도록 전문을 교체해야 합니다.
  naturalness: 개정문은 현대 표준어 합쇼체로 자연스럽고, 시편의 예배적·격조 있는 어조를 유지합니다. ‘주의 집에 거하는 이들’은 단순한 일시적 방문이 아니라 지속적으로 거주/섬기는 participle의 뜻을 무리 없이 나타냅니다.
  terminology: ‘주의 집’은 בֵּיתֶךָ의 직역적 이미지를 보존하며, 성전으로 한정하지 않습니다. ‘셀라’는 뜻이 불확실한 히브리 예전 표지이므로 음역합니다. 원문에는 하나님의 고유명사가 아니라 2인칭 접미사가 있으므로, 본문에서 ‘야훼’를 보충하지 않고 ‘주’를 사용했습니다.
  issues:
  - severity: high
    issue: 구절 본문 불일치
    rationale: 초안은 ‘작은 참새도 집을 찾았고’로 시작하는 시편 84:3 내용이며, 검토 대상인 84:4의 ‘주의 집에 거하는 이들은 복이 있다; 그들은 계속 주를 찬양한다. 셀라’와 전혀 일치하지 않습니다.
  - severity: high
    issue: 주석 및 어휘 결정이 잘못된 절에 연결됨
    rationale: 참새, 제비, 제단, 만군의 야훼에 관한 현 주석과 결정은 84:4 원문에 존재하지 않는 요소들입니다. 84:4에 맞는 ‘주의 집’과 ‘셀라’ 주석으로 교체해야 합니다.
  revised_text: 주의 집에 거하는 이들은 복이 있습니다. 그들은 계속 주를 찬양합니다. 셀라.
  revised_footnotes:
  - marker: a
    text: ‘주의 집’은 하나님의 성소 또는 성전을 가리키는 것으로 이해될 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘셀라’는 뜻이 확실하지 않은 히브리어 예전적 또는 음악적 용어이므로, 전통적으로 번역하지 않고 음역합니다.
    reason: lexical_alternative
  revision_rationale: 제시된 WLC 본문을 기준으로, אַשְׁרֵי를 ‘복이 있습니다’로, יוֹשְׁבֵי בֵיתֶךָ를 ‘주의 집에 거하는 이들’로 옮겼습니다. עוֹד는 지속의 의미를 살려 ‘계속’으로 번역했고, 미완료형 יְהַלְלוּךָ는 한국어 현재형의 습관적·지속적 용법으로 자연스럽게 보존했습니다. ‘셀라’는 해석을 덧붙이지 않고 음역했습니다.
