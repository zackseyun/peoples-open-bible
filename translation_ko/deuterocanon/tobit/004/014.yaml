revisions:
- from: 네가 너에게서 일하는 모든 사람의 품삯은 하룻밤 너와 함께 머물게 하지 말고, 곧바로 그에게 갚아 주십시오. 하나님을 섬기면, 그것은 당신에게 보상될 것입니다. 아이야, 너의 모든 일에서 너 자신을 조심하고, 너의 모든 행실에서 훈련된 사람이 되십시오.
  to: 네게서 일한 모든 사람의 품삯을 네 곁에 하룻밤 묵혀 두지 말고, 곧바로 그에게 주십시오. 하나님을 섬기면 그 보답을 받게 될 것입니다. 아이야, 네 모든 일에서 스스로를 살피고, 네 모든 행실에서 잘 훈련된 사람이 되십시오.
  rationale: 원문의 명령형과 미래 수동태의 약속을 보존하면서, 품삯 지급에 관한 한국어 관용 표현과 청자 지칭을 정리했습니다. ‘아이야’는 παιδίον의 친근한 호격을 성별 특정 없이 반영하며, 본문의 보답 약속에 특정 교리적 설명을 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:54:56Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 임금 지급 금지·즉시 지급 명령, 하나님을 섬김에 대한 미래 수동태의 보답 약속, 그리고 자녀에게 주는 자기 성찰과 품행의 훈계가 모두 보존되어야 합니다. 초안은 대체로 내용을 담았으나, ‘그것은 당신에게 보상될 것입니다’의 지시 대상이 한국어에서 불분명하고, ‘너’와 ‘당신’의 혼용 및 일부 직역 어순이 원문의 전달을 흐립니다.
  naturalness: ‘네가 너에게서 일하는’, ‘품삯은 하룻밤 너와 함께 머물게’는 자연스러운 한국어 표현이 아닙니다. ‘네게서 일한 사람의 품삯을 네 곁에 하룻밤 묵혀 두지 말고’로 고치면 뜻과 관용을 함께 살릴 수 있습니다. 합쇼체에 맞추어 종결도 일관되게 조정했습니다.
  terminology: ‘품삯’, ‘하나님을 섬기다’는 적절합니다. ἀποδοθήσεταί σοι의 수동적 보답 약속은 행위공로를 과도하게 해설하지 않고 ‘보답을 받게 될 것입니다’로 옮겼습니다. πεπαιδευμένος은 단순한 일회적 교육보다 형성된 품성을 가리키므로 ‘잘 훈련된 사람이 되십시오’로 유지하되 문맥을 자연스럽게 했습니다.
  issues:
  - severity: medium
    issue: 대명사와 높임말의 혼용
    rationale: ‘너/너의’로 부르다가 ‘당신에게’라고 하면 동일한 청자에 대한 호칭이 불일치합니다. 표준어 합쇼체에서는 ‘네게/네’와 ‘-십시오’를 일관되게 사용할 수 있습니다.
  - severity: medium
    issue: 품삯이 ‘너와 함께 머문다’는 직역적 표현
    rationale: παρὰ σοὶ ... αὐλισθήτω는 품삯을 지급하지 않고 밤새 보유한다는 뜻입니다. 한국어에서는 ‘네 곁에 하룻밤 묵혀 두다’가 이 의미를 더 자연스럽게 전달합니다.
  - severity: medium
    issue: ‘그것은 당신에게 보상될 것입니다’의 지시 대상 불명확
    rationale: 원문의 비인칭적 미래 수동태는 하나님을 섬김에 대한 보답을 약속합니다. 한국어에서는 ‘그 보답을 받게 될 것입니다’가 지시 관계를 분명히 하면서도 보답의 주체를 본문 이상으로 특정하지 않습니다.
  - severity: low
    issue: ‘훈련된 사람이 되십시오’의 결합이 다소 부자연스러움
    rationale: ‘모든 행실에서 잘 훈련된 사람이 되십시오’로 하면 πεπαιδευμένος의 지속적·형성적 의미를 유지하면서 문장이 자연스럽습니다.
  revised_text: 네게서 일한 모든 사람의 품삯을 네 곁에 하룻밤 묵혀 두지 말고, 곧바로 그에게 주십시오. 하나님을 섬기면 그 보답을 받게 될 것입니다. 아이야, 네 모든 일에서 스스로를 살피고, 네 모든 행실에서 잘 훈련된 사람이 되십시오.
