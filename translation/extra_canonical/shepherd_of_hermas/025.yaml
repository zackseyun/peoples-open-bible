theological_decisions:
- issue: Rendering ἐντολαί in Hermas as "mandates" rather than "commandments"
  chosen_reading: Retain mandates as the documented Hermas section-label rendering; commands and commandments
    remain alternatives.
  alternative_readings:
  - Translate ἐντολαί as "commandments" throughout
  - Use "commands" as a neutral rendering
  rationale: Consistency with the earlier adjudication and customary section label does not by itself
    prove that the ordinary noun excludes Mosaic-commandment associations.
  doctrine_reference: 'Translation philosophy: consistency of key terms; preserve second-century church
    texture.'
- issue: σεμνοτάτου ἀγγέλου
  chosen_reading: '"most venerable angel"'
  alternative_readings:
  - most holy angel
  - most august angel
  - most noble angel
  rationale: σεμνός emphasizes dignified, august character rather than moral purity per se; "venerable"
    captures reverential dignity.
- issue: ἐκπειράζων με
  chosen_reading: '"testing me" rather than "tempting me"'
  alternative_readings:
  - tempting me
  - trying me
  rationale: Test retains the narrator’s recognition-related supposition; tempting or trying remain lexical
    alternatives. No claim of the shepherd’s actual intention or absolute lexical exclusion is added.
- issue: Capitalizing "Shepherd"
  chosen_reading: Capitalize "Shepherd" when referring to the visionary figure identified as ὁ ποιμήν.
  alternative_readings:
  - Keep "shepherd" lowercase as a common noun
  rationale: Within Hermas, "the Shepherd" is a specific, recurring personage. Capitalization helps readers
    track the figure without adding interpretation.
  doctrine_reference: 'Translation philosophy: readability and transparency.'
- issue: Plural second person (ὑμῖν) addressed by the Shepherd
  chosen_reading: Keep English "you" (ambiguous number) but annotate that the Greek shifts to plural,
    indicating community-wide instruction.
  alternative_readings:
  - Paraphrase to "you all" to mark plurality
  - Shift to singular for Hermas alone
  rationale: English lacks a standard plural "you"; footnote marks the communal scope without altering
    the register.
  doctrine_reference: 'Transparency principle: preserve ambiguity and annotate.'
- issue: παραβολαί as "parables" vs. "Similitudes"
  chosen_reading: Translate παραβολαί as "parables" in the verse; footnote that this corresponds to the
    section known as the Similitudes.
  alternative_readings:
  - Render as "similitudes" to match later section title
  rationale: Greek uses παραβολαί; translating as "parables" follows the source while still guiding readers
    to the book’s structure via note.
  doctrine_reference: Original-language primacy over translation tradition.
- issue: Contextual repentance reassessment
  chosen_reading: Exact reader wording is recorded in config/terminology/repentance-contextual-2026-10-13.json#translation/extra_canonical/shepherd_of_hermas/025.yaml
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
