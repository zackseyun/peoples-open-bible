source:
  edition: WLC
  text: וַ/יֹּאמַ֡ר אֶרְחָמְ/ךָ֖ יְהוָ֣ה חִזְקִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/002.yaml
  text: Yahweh is my crag[a] and my fortress and my deliverer, my God, my rock, in whom I take refuge[b], my shield and the horn of my salvation[c], my stronghold.
  footnotes:
  - marker: a
    text: 'Hebrew: ''I have compassion for you'' or ''I cherish you deeply''; the verb carries a nuance of tender compassion, here expressed idiomatically as love.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 나의 바위 절벽[a], 나의 요새, 나를 건져 주시는 분이십니다. 나의 하나님이시며 나의 반석이십니다. 내가 그분 안에서 피신합니다[b]. 나의 방패, 나의 구원의 뿔[c], 나의 산성이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바위 절벽’(히브리어 סֶלַע)은 뒤의 ‘반석’(צוּר)과 관련된 말이지만 구별되는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 그분을 의지합니다.’
    reason: lexical_alternative
  - marker: c
    text: ‘뿔’은 힘과 승리의 구원을 나타내는 비유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמַר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말씀하셨습니다
  lexicon: HALOT
  rationale: 와우-계속형이 도입하는 발화 표지를 한국어에서도 분명히 드러내어, 시편 표제부의 서술 흐름을 본문에 남겼습니다.
- source_word: אֶרְחָמְךָ
  english_pob_choice: I love you
  chosen_korean: 내가 주를 사랑합니다
  alternatives_korean:
  - 내가 주를 불쌍히 여깁니다
  - 내가 주를 깊이 사랑합니다
  lexicon: HALOT
  rationale: רחם의 핵심은 긍휼/깊은 애정이지만, 하나님께 직접 말하는 문맥에서는 ‘사랑합니다’가 한국어로 가장 자연스럽게 관계적 헌신을 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 여호와여
  - 야훼
  lexicon: HALOT
  rationale: 여호와 대신 고유명사 야훼를 유지하여, 원문의 신명(神名)을 직역 관습에 따라 드러냈습니다. 호격을 위해 -여를 붙였습니다.
- source_word: חִזְקִי
  english_pob_choice: my strength
  chosen_korean: 나의 힘이시여
  alternatives_korean:
  - 나의 힘
  - 나의 능력이시여
  - 나의 강함이시여
  lexicon: HALOT
  rationale: חזק의 명사적 용례를 한국어의 관계 호격으로 살려, 야훼가 화자의 힘/지탱이심을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 여호와/야훼 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 제목적 대체어로 바꾸지 않고 고유이름으로 유지해, 언약적 신명 자체를 독자에게 직접 보이게 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רחם의 정서적 뉘앙스
  chosen_reading: 사랑합니다
  alternative_readings:
  - 긍휼을 베풉니다
  - 깊이 사랑합니다
  rationale: 하나님께 향한 직접 호소에서 רחם를 ‘불쌍히 여기다’로 옮기면 화용론적으로 어색하므로, 관계적 헌신을 드러내는 ‘사랑합니다’를 채택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
