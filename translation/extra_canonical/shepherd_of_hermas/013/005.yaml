translation:
  text: '“And those whom they were casting away and throwing aside—who are they?” “These are people who have sinned and want to reorient[a]. For this reason they were not flung far away outside the tower, because they will be useful for the building, if they reorient. Therefore those who are going to reorient—if they reorient—will be strong in the faith, if they reorient now, while the tower is being built. But if the building is completed, they no longer have a place, but will be cast out. But they have only this: to lie beside the tower.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
