- timestamp: '2026-08-27T21:08:39Z'
  adjudicator: source-audit
  reviewer_model: gpt-5.6-sol
  source_review: state/reviews/gemini/low_agreement_recheck/nt/matthew/016/008.job-27574.json
  category: source_correction
  tier: 1
  from: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
  to: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you did not bring bread?”
  rationale: The SBLGNT text reads ἐλάβετε (from λαμβάνω, 'to take/bring'), not ἔχετε ('to have'). The draft flattens this action into a state ('have no bread'), which breaks the lexical chain established in verse 5 (λαβεῖν) and verse 7 (ἐλάβομεν). To maintain optimal equivalence and consistency with the preceding verses, the translation must reflect the active verb.
- timestamp: '2026-11-09T17:14:51Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
