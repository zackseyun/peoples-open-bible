id: MRK.6.12
reference: Mark 6:12
source:
  edition: SBLGNT
  text: Καὶ ἐξελθόντες ⸀ἐκήρυξαν ἵνα ⸀μετανοῶσιν,
translation:
  text: And they went out and proclaimed that people should reorient toward God[r1][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more literally, 'that they should repent,' with 'they' referring to those who heard their proclamation.
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  chosen: And
  alternatives:
  - Then
  lexicon: BDAG
  rationale: Standard connective coordinating this verse with the preceding commissioning narrative. 'And' preserves the simple narrative flow without adding temporal nuance beyond the Greek.
- source_word: ἐξελθόντες
  chosen: they went out
  alternatives:
  - having gone out
  - after going out
  lexicon: BDAG
  rationale: Aorist active participle of ἐξέρχομαι, nominative plural, referring to the disciples. Rendered with a finite English verb for natural narrative style while preserving the action antecedent to or accompanying the main verb.
- source_word: ἐκήρυξαν
  chosen: proclaimed
  alternatives:
  - preached
  - announced
  - heralded
  lexicon: BDAG
  rationale: κηρύσσω denotes public proclamation. 'Proclaimed' preserves the heraldic force without sounding overly ecclesiastical; 'preached' is possible but may import later church associations not explicit in the immediate context.
- source_word: ἵνα
  chosen: that
  alternatives:
  - so that
  - in order that
  lexicon: BDAG
  rationale: Introduces the content/purpose of the proclamation. In this context English idiom is best served by 'proclaimed that people should…,' which captures the intended response without awkwardness.
- source_word: μετανοῶσιν
  chosen: should reorient toward God
  alternatives:
  - should change their thinking
  - should change their minds
  - should turn back
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
