id: MAT.19.27
reference: Matthew 19:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: ko
  text: 그때 베드로가 예수께 대답하여 말했습니다. 「보십시오, 우리는 모든 것을 버리고 당신을 따랐습니다. 그러면 우리에게 무엇이 있게 되겠습니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε ἀποκριθεὶς ... εἶπεν αὐτῷ
  english_pob_choice: Then Peter answered him
  chosen_korean: 그때 베드로가 예수께 대답하여 말했습니다
  alternatives_korean:
  - 그때 베드로가 그분께 대답하여 말했습니다
  - 그때 베드로가 응답하여 말했습니다
  lexicon: ἀποκρίνομαι / λέγω
  rationale: ἀποκριθεὶς εἶπεν은 단순히 ‘말하다’보다 ‘대답하다’의 응답 성격이 분명하므로 그렇게 살렸고, αὐτῷ는 문맥상 예수께로 구체화했습니다.
- source_word: Ἰδοὺ
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  - 이 보십시오
  lexicon: ἰδού
  rationale: 영어 POB의 ‘Look’을 따라 시선을 끄는 감탄으로 처리하되, 현대 합쇼체에서는 ‘보십시오’가 가장 자연스럽고 공손한 대응입니다.
- source_word: ἀφήκαμεν πάντα
  english_pob_choice: we have left everything
  chosen_korean: 우리는 모든 것을 버리고
  alternatives_korean:
  - 우리는 모든 것을 떠나
  - 우리는 모든 것을 남겨 두고
  lexicon: ἀφίημι
  rationale: ἀφήκαμεν은 단순한 이동이 아니라 관계적·소유적 ‘떠남/버림’의 뉘앙스가 있어, 문맥상 제자도의 대가를 드러내는 ‘버리고’로 옮겼습니다.
- source_word: ἠκολουθήσαμέν σοι
  english_pob_choice: followed you
  chosen_korean: 주님을 따랐습니다
  alternatives_korean:
  - 주님께 따라왔습니다
  - 주님을 따라왔습니다
  lexicon: ἀκολουθέω
  rationale: ἀκολουθέω는 제자도의 지속적 추종을 가리키므로 ‘따랐습니다’로 번역했고, 예수에 대한 호칭은 문맥상 ‘주님’이 자연스럽습니다.
theological_decisions:
- issue: 제자도에 대한 질문의 뉘앙스
  chosen_reading: 베드로의 질문을 보상 요구가 아니라, 모든 것을 버린 제자들의 장래를 묻는 실제적 질문으로 보존했습니다.
  alternative_readings:
  - 상급을 기대하는 청구문처럼 더 강하게 옮길 수 있음
  - 완화하여 단순한 호기심처럼 옮길 수 있음
  rationale: τί ἄρα ἔσται ἡμῖν;는 직역하면 ‘그러면 우리에게 무엇이 있겠습니까?’로, 제자도의 대가와 결과를 묻는 긴장감을 유지하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 제자도와 보상/상급의 긴장
- issue: 예수 호칭의 처리
  chosen_reading: 직접 대화 속 αὐτῷ는 예수께 대한 지시로 이해하여 ‘주님’으로 호칭했습니다.
  alternative_readings:
  - 그분께
  - 당신께
  rationale: 한국어 본문에서 2인칭 직접 호칭 없이도 예수를 분명히 지칭할 수 있으며, 문맥상 존칭을 유지하는 것이 자연스럽습니다.
  doctrine_reference: 그리스도 호칭의 경칭 처리
