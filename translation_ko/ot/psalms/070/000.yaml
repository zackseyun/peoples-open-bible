  - 기념하기 위하여
  lexicon: HALOT
  rationale: 히필 부정사 לְהַזְכִּיר는 '기억나게 하다/상기시키다'의 목적 표지로 쓰일 수 있으나, 표제에서는 간결한 명사구가 적절하므로 '기억을 위하여'로 처리해 목적성과 표제성을 함께 살렸습니다.
