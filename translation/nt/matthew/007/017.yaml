  from: So[a], every good tree produces good fruit[b][c], but the rotten tree produces bad fruit.
  to: So[a], every good tree produces good fruit[b][c], but the bad tree produces bad fruit.
  rationale: While 'σαπρός' can mean 'rotten' (often used for spoiled fruit or fish), applying 'rotten' to a living, fruit-bearing tree is logically awkward in English. A 'rotten tree' implies dead, decaying wood that would not bear fruit at all. 'Bad', 'diseased', or 'unhealthy' fits the agricultural reality of a living tree much better.
