review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the conditional appeal and the prayerful prohibition. However, ‘부르짖을 때에는’ changes the perfect infinitive κεκραγέναι into a temporal present/general expression. A Korean conditional perfect (‘부르짖었다면’) can preserve the source more closely. Further, παρασιωπήσῃς ἀπʼ ἐμοῦ conveys passing the petitioner by in silence, not merely being silent ‘to’ the petitioner.
  naturalness: '‘저에게 잠잠하지 마십시오’ is understandable but not idiomatic modern Korean: 잠잠하다 normally does not naturally govern 저에게 in this sense. ‘저를 지나쳐 침묵하지 마십시오’ is natural enough in elevated prayer language and represents the verbal image.'
  terminology: ‘주님’ is an acceptable supplied Korean address in this prayer context, and the formal-polite imperative ‘마십시오’ appropriately maintains the requested 합쇼체 register. No doctrinally loaded terminology has been introduced.
  issues:
  - severity: medium
    issue: The perfect infinitive κεκραγέναι is rendered as ‘부르짖을 때,’ losing its completed/perfect nuance and making the condition temporal.
    rationale: 'The Greek construction is difficult, but Korean can retain the conditional and completed action without awkwardness: ‘제가 주님께 부르짖었다면.’'
  - severity: medium
    issue: ‘저에게 잠잠하지 마십시오’ inadequately represents παρασιωπήσῃς ἀπʼ ἐμοῦ and is syntactically unnatural.
    rationale: The compound verb includes the sense of passing someone over in silence; the prepositional phrase refers to the petitioner as the one passed by. ‘저를 지나쳐 침묵하지 마십시오’ preserves this image more closely.
  revised_text: 그러나 제가 주님께 부르짖었다면, 저를 지나쳐 침묵하지 마십시오.[a]
  revised_footnotes:
