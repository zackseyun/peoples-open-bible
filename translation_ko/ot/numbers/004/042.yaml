  rationale: 본문은 신학적 해설보다 공동체 편제의 실제 목록을 제시하므로, 지나치게 종교적이거나 고어적인 표현보다 행정적 성격이 살아 있는 표현을 택했습니다.
  doctrine_reference: 민수기 1–4장의 레위인 계수/배치 문맥
- issue: 문장 종결부의 콜론 처리
  chosen_reading: 히브리어 원문의 열거 구조를 반영해 한국어도 미완결의 목록형 종결로 두었습니다.
  alternative_readings:
