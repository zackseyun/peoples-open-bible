translation:
  text: '1. “But I, the angel of repentance[c], say to you: do not fear the devil. For I was sent,” he
    says, “to be with you who are repenting with all their heart, and to strengthen them in the faith.”


    2. “Therefore believe God, you who, because of your sins, have despaired of your life, add sin to
    sin, and burden your life: if you turn back to the Lord with your whole heart, work righteousness
    for the remaining days of your life[d], and serve him rightly according to his will, he will bring
    healing[e] for your former transgressions, and you will have power to master the devil’s works. Do
    not fear the devil’s threat at all; for he is strengthless, like the sinews of a dead man.”


    3. “So listen to me, and fear the One who is able to do all things, to save and to destroy. Keep these
    commandments, and you will live to God.”


    4. I say to him, “Sir, now I have been strengthened in all the righteous requirements of the Lord,
    because you are with me. I know that you will cut off all the devil’s power, and we shall master him
    and prevail against all his works. And I hope, sir, that I can now keep these commandments you have
    commanded, with the Lord strengthening me.”


    5. “You will keep them,” he says, “if your heart becomes pure toward the Lord[f]. And all will keep
    them who cleanse their own hearts from the vain desires of this age, and they will live to God.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    reason: lexical_alternative
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
  - marker: d
    reason: textual_variant
    text: The whole-heart turning, remaining-days righteousness and service according to his will are
      retained as conditions in the working Greek. Vulgata printed 68 has a shorter version without the
      explicit remaining-days righteousness clause; Palatina printed 131 retains it. No condition is removed
      to harmonize versions.
  - marker: e
    reason: textual_variant
    text: Working healing (iasin) contrasts with Palatina printed 131 pardon (veniam); Vulgata printed
      68 has remedy. The source image is retained with the versional alternatives exposed.
  - marker: f
    reason: textual_variant
    text: The last paragraph belongs to Mandate12 vi, not to the city teaching of Similitude1. Working
      pure heart toward the Lord and cleansing from vain desires are retained. Vulgata printed 69 and
      Palatina printed 131 also retain this boundary and condition; Palatina adds amen, absent from the
      working Greek. No amen is inserted.
