translation:
  language: en
  text: 'In the beginning, God would not have come to Israel’s aid and rescued them from Egypt, where they were enslaved, if they had not groaned and cried out to him because of their cruel oppression.


    Again, it is written in the Psalms:


    “I am worn out from groaning.

    Every night I soak my bed

    and drench my couch with tears.

    I have grown old among all my enemies.


    Go away from me, all you who do evil,

    for the Lord has heard my weeping.

    The Lord has accepted my prayer.”

    (Psalm 6:6–9)


    If we reorient[r1], God will surely hear us. He is patient and full of mercy. Glory belongs to him forever and ever. Amen!


    The Exegesis on the Soul'
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
