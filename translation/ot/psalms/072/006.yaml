  from: May he come down like rain on mown grass[a][b][c], like showers that water the earth.
  to: May he come down like rain on mown grass[b][c], like showers that water the earth[a].
  rationale: The marker corrections are needed, but replacing “that water the earth” with “falling on the earth” is not an improvement. זַרְזִיף denotes dripping/sprinkling rain, and in this poetic construction “showers that water the earth” is a natural, contextually faithful representation of rain’s action, not an unwarranted abstraction. It also avoids supplying an explicit preposition absent from the second colon.
