lexical_decisions:
- source_word: συνῆγεν
  chosen: grew intense
  alternatives:
  - closed in
  - pressed together
  - was joined
  lexicon: LSJ
  rationale: From συνάγω in an intransitive battle context, the sense is that the fighting tightened or intensified rather than simply 'was gathered.' 'Grew intense' gives natural English while preserving the image of the conflict drawing together.
- source_word: ὁ πόλεμος
  chosen: the battle
  alternatives:
  - the war
  - the fighting
  lexicon: LSJ
  rationale: In this immediate combat scene, 'battle' fits better than the broader 'war' and is more concrete than 'fighting.'
- source_word: ἐξέτεινεν ... τὴν χεῖρα αὐτοῦ
  chosen: stretched out his hand
  alternatives:
  - extended his hand
  - reached out his hand
  lexicon: LSJ
  rationale: A conventional Greek expression retained in straightforward English. It likely introduces the action of striking, but the idiom itself should remain visible.
- source_word: πατάξαι
  chosen: to strike
  alternatives:
  - to hit
  - to smite
  - to attack
  lexicon: LSJ
  rationale: '''Strike'' is the most natural modern equivalent that still preserves the force of the verb without archaic coloring (''smite'') or overgeneralization (''attack'').'
- source_word: Βακχίδην
  chosen: Bacchides
  rationale: Personal name transliterated according to project policy.
- source_word: ἐξέκλινεν
  chosen: turned away
  alternatives:
  - dodged aside
  - withdrew
  - veered away
  lexicon: LSJ
  rationale: The verb indicates turning aside or swerving away. 'Turned away' is clear and sufficiently literal; more interpretive options like 'dodged aside' are possible but less neutral.
- source_word: ἀπ᾿ αὐτοῦ
  chosen: from him
  alternatives:
  - away from him
  lexicon: LSJ
  rationale: Refers most naturally to Jonathan as the one from whom Bacchides turned aside.
- source_word: εἰς τὰ ὀπίσω
  chosen: to the rear
  alternatives:
  - backward
  - behind
  - to the back
  lexicon: LSJ
  rationale: The phrase denotes movement to the back/rear. 'To the rear' is idiomatic in a military setting and preserves the directional sense.
