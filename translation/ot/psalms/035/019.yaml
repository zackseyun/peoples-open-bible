id: PSA.35.19
reference: Psalms 35:19
source:
  edition: WLC
  text: אַֽל יִשְׂמְחוּ לִ֣/י אֹיְבַ֣/י שֶׁ֑קֶר שֹׂנְאַ֥/י חִ֝נָּ֗ם יִקְרְצוּ עָֽיִן־־־׃
translation:
  text: Do not let my deceitful enemies[a] rejoice over me, nor let those who hate me without cause wink in triumph.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “those who are my enemies unjustly.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַל
  chosen: Do not let
  alternatives:
  - May ... not
  - Let ... not
  lexicon: HALOT
  rationale: Negative particle used with the following imperfect as a jussive/prohibitive. In English, 'Do not let' naturally conveys the prayerful prohibition addressed to God in the psalm.
- source_word: יִשְׂמְחוּ
  chosen: rejoice
  alternatives:
  - be glad
  - exult
  lexicon: HALOT
  rationale: The verb שמח commonly means 'rejoice' or 'be glad.' 'Rejoice' fits the hostile triumph in context without overtranslating.
- source_word: לִי
  chosen: over me
  alternatives:
  - at me
  - concerning me
  - against me
  lexicon: HALOT
  rationale: Though literally 'to/for me,' in this hostile context the idiomatic sense is rejoicing over someone's downfall. 'Over me' is natural English and reflects the adversarial nuance.
- source_word: אֹיְבַי שֶׁקֶר
  chosen: my deceitful enemies
  alternatives:
  - my enemies falsely
  - my lying enemies
  - my enemies without cause
  lexicon: HALOT
  rationale: Keeps שֶׁקֶר with the enemies/their enmity rather than making it an adverb of rejoicing, while avoiding the misleading implication that the enemies are imaginary.
- source_word: שֹׂנְאַי
  chosen: those who hate me
  alternatives:
  - my haters
  - my enemies
  lexicon: HALOT
  rationale: A participial form meaning 'those hating me.' 'Those who hate me' is clear, natural, and preserves the ongoing hostile stance.
- source_word: חִנָּם
  chosen: without cause
  alternatives:
  - for nothing
  - gratuitously
  - without reason
  lexicon: HALOT
  rationale: In this context the adverb indicates baseless hostility. 'Without cause' is idiomatic and matches the psalm's legal/moral complaint.
- source_word: יִקְרְצוּ עָיִן
  chosen: wink at me
  alternatives:
  - wink with the eye
  - leer
  - signal with the eye
  lexicon: HALOT
  rationale: Natural English form of the concrete hostile eye gesture; its malicious force is retained in the note.
