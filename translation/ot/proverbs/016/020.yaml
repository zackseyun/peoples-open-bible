id: PRO.16.20
reference: Proverbs 16:20
source:
  edition: WLC
  text: מַשְׂכִּ֣יל עַל דָּ֭בָר יִמְצָא ט֑וֹב וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה אַשְׁרָֽי/ו־־׃
translation:
  text: Whoever gives careful attention to a matter[a] will find what is good, and blessed is the one who trusts in Yahweh.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “Whoever heeds instruction.”
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  chosen: gives careful attention
  alternatives:
  - acts wisely
  - prospers by insight
  - considers wisely
  lexicon: HALOT
  rationale: The Hiphil participle of שׂכל can denote acting with insight, giving prudent attention, or prospering through wisdom. In this proverb, followed by עַל דָּבָר ('to/over a matter'), the sense is best captured as attentive, prudent consideration rather than mere intellectual possession of wisdom. 'Gives careful attention' expresses the active, practical nuance in readable English.
- source_word: עַל דָּבָר
  lemma: עַל
  chosen: to a matter
  alternatives:
  - in a matter
  - concerning a matter
  - to the word
  lexicon: HALOT
  rationale: דָּבָר can mean 'word,' 'matter,' or 'thing.' Here the proverb concerns prudent handling of affairs, so 'a matter' fits better than 'a word.' The preposition עַל with שׂכל likely conveys attentive regard toward or concerning something; idiomatic English prefers 'to a matter' with the chosen verbal rendering.
- source_word: יִמְצָא טוֹב
  chosen: will find what is good
  alternatives:
  - will find prosperity
  - will obtain good
  - finds what is good
  lexicon: HALOT
  rationale: The broad substantival use of טוֹב is made idiomatic without specifying the kind of good found.
- source_word: וּבוֹטֵחַ
  chosen: and ... who trusts
  alternatives:
  - and the one trusting
  - and whoever trusts
  lexicon: HALOT
  rationale: The Qal participle functions generically, parallel to the first clause. Rendering it as a relative clause in English preserves the proverbial style and smooths the transition to the beatitude statement.
- source_word: בַּיהוָה
  chosen: in Yahweh
  alternatives:
  - in Yahweh
  lexicon: HALOT
  rationale: This records the divine-name rendering used in the verse and its footnote.
- source_word: אַשְׁרָיו
  chosen: blessed is he
  alternatives:
  - happy is he
  - how fortunate is he
  - blessed is the one
  lexicon: HALOT
  rationale: אַשְׁרֵי language denotes a state of blessedness or flourishing, not merely subjective happiness. 'Blessed is he' preserves the beatitude force. The masculine singular is retained as gender-accurate generic per doctrine; it refers representatively, not exclusively.
