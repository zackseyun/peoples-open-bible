  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Christ Jesus.
  footnotes:
  - marker: a
    text: Or 'your trial in my flesh,' reflecting the textual and syntactical difficulty of the phrase.
    reason: alternative_reading
