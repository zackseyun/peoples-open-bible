id: SNG.8.2
reference: Song of Songs 8:2
source:
  edition: WLC
  text: אֶנְהָֽגֲ/ךָ֗ אֲבִֽיאֲ/ךָ֛ אֶל בֵּ֥ית אִמִּ֖/י תְּלַמְּדֵ֑/נִי אַשְׁקְ/ךָ֙ מִ/יַּ֣יִן הָ/רֶ֔קַח מֵ/עֲסִ֖יס רִמֹּנִֽ/י־׃
translation:
  text: I would lead you and bring you into my mother’s house, where you would teach me[a]; I would give you spiced wine to drink and the juice of my pomegranate[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “where she would teach me,” referring to her mother; the Hebrew verb permits either subject.
    reason: alternative_reading
  - marker: b
    text: 'Alternatively, the drinks may be described together: “spiced wine from the juice of my pomegranate.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶנְהָגֲךָ
  chosen: I would lead you
  alternatives:
  - I will lead you
  - I would guide you
  lexicon: HALOT
  rationale: Qal imperfect 1cs of נהג with 2ms suffix. In this poetic context the imperfect is best rendered with modal/desiderative force ('would') rather than simple future. 'Lead' preserves the concrete sense without overinterpreting as merely emotional guidance.
- source_word: אֲבִיאֲךָ
  chosen: and bring you
  alternatives:
  - and take you in
  - and bring you in
  lexicon: HALOT
  rationale: Hiphil imperfect 1cs of בוא with 2ms suffix. Coordinated with the previous verb, it expresses the speaker's intended action. 'Bring you' is idiomatic and keeps the causative movement sense.
- source_word: בֵּית אִמִּי
  chosen: into my mother’s house
  alternatives:
  - to my mother’s house
  lexicon: HALOT
  rationale: Construct phrase with directional sense after אֶל. 'Into' fits naturally with 'bring' and the imagery of entering the house.
- source_word: תְּלַמְּדֵנִי
  chosen: you would teach me
  alternatives:
  - you would teach me
  - may she teach me
  - she teaches me
  lexicon: HALOT
  rationale: The unpointed consonantal/formal morphology permits either 2ms or 3fs; continued second-person address supports 2ms while the note preserves 3fs.
- source_word: אַשְׁקְךָ
  chosen: I would give you ... to drink
  alternatives:
  - I would make you drink
  - I would let you drink
  lexicon: HALOT
  rationale: Hiphil imperfect 1cs + 2ms suffix of שקה means to cause to drink/give drink. In English, 'give you ... to drink' is natural and preserves the causative sense.
- source_word: מִיַּיִן הָרֶקַח
  chosen: spiced wine
  alternatives:
  - wine mixed with spices
  - perfumed wine
  lexicon: HALOT
  rationale: יין with הרקח refers to wine prepared or mixed with spices/aromatics. 'Spiced wine' is concise, idiomatic, and preserves the sensual banquet imagery.
- source_word: מֵעֲסִיס רִמֹּנִי
  chosen: from the juice of my pomegranate
  alternatives:
  - from the sweet wine of my pomegranate
  - from the fresh juice of my pomegranate
  lexicon: HALOT
  rationale: עסיס denotes juice, sweet fresh drink, or must. Given the parallel with wine and the possessive 'my pomegranate,' 'juice' is a clear modern rendering that preserves the fruit imagery without forcing fermentation. Singular 'pomegranate' follows the Hebrew singular with 1cs suffix.
