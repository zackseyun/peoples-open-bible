translation:
  text: “But there are also indulgences that save people; for many, by doing good things, indulge themselves, being carried along by their own pleasure. This indulgence, therefore, is beneficial for the servants of God, and it secures life for such a person; but the harmful indulgences previously mentioned procure torments and punishments for them; and if they persist and do not repent[a], they procure death for themselves.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
