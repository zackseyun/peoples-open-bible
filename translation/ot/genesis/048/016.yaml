  from: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
  to: the angel who has redeemed me from all harm—may he bless the boys. May they carry on my name and the name of my fathers Abraham and Isaac[a]; may they multiply greatly[b] in the land.”
  rationale: The earlier revision rightly kept Jacob’s name and his fathers’ name together under one blessing, and that unity remains. I preserve 'angel' and 'redeemed' without defining the angel’s identity, while replacing source-transparent naming language and consolidating the excessive, misplaced notes.
