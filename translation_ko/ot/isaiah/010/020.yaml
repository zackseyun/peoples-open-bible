    rationale: מַכֵּהוּ는 문맥상 남은 이스라엘/야곱 집을 친 자를 가리키지만, 한국어 재귀 표현 ‘자기’는 주어가 자신을 친 것으로 오해될 수 있습니다.
  - severity: low
    issue: ‘오직’이 원문에 없는 배타성을 명시함
    rationale: 대조 구조상 야훼께로 향하는 전환은 분명하지만, 본문은 ‘오직’에 해당하는 명시적 한정사를 사용하지 않습니다. 이를 제거해 원문의 표현 범위를 보존합니다.
  revised_text: 그날에 이스라엘의 남은 자와 야곱의 집에서 살아남은 자는 더 이상 그들을 친 자에게 기대지 않고, 야훼, 이스라엘의 거룩하신 분께 진실로 기대게 될 것입니다.
