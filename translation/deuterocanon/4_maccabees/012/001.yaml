id: 4MA.12.1
reference: 4 Maccabees 12:1
source:
  edition: lxx-swete-1909
  text: Ὡς δὲ καὶ αὖτος μακαρίως ἐναπέθανεν καταβληθεὶς εἰς λέβητα, ὁ ἕβδομος παρεγίνετο, ὁ πάντων νεώτερος.
  language: Greek
