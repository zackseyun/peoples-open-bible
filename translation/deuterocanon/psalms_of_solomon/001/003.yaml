  from: I had been filled with righteousness, when I prospered and became abundant
  to: I was filled with righteousness, when I prospered and abounded
  rationale: The aorist ἐπλήσθην is better rendered as a simple past 'was filled' in this indirect discourse (representing 'I am filled' in direct thought), rather than the pluperfect 'had been filled', which distances the state too much from the concurrent prosperity. Additionally, 'abounded' is a more natural English rendering for πολλὴν γενέσθαι than the slightly clunky 'became abundant'.
