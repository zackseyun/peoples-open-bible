id: PSA.118.7
reference: Psalms 118:7
source:
  edition: WLC
  text: יְהוָ֣ה לִ֭/י בְּ/עֹזְרָ֑/י וַ֝/אֲנִ֗י אֶרְאֶ֥ה בְ/שֹׂנְאָֽ/י׃
translation:
  text: Yahweh is on my side, among my helpers; I myself will look in triumph on those who hate me[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “I myself will look on those who hate me.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: לִי
  chosen: for me
  alternatives:
  - is for me
  - belongs to me
  lexicon: HALOT
  rationale: The preposition expresses Yahweh’s support for the speaker and should be represented in English.
- source_word: בְּעֹזְרָי
  chosen: among my helpers
  alternatives:
  - for my help
  - with my helpers
  - as my helper
  lexicon: HALOT
  rationale: The plural participial expression denotes those helping the speaker; it should not be reduced to a singular helper.
- source_word: וַאֲנִי
  chosen: I myself
  alternatives:
  - and I
  - but I
  lexicon: HALOT
  rationale: The independent pronoun is emphatic. 'I myself' preserves the emphasis better than a bare 'and I,' while still fitting natural English.
- source_word: אֶרְאֶה
  chosen: will look on
  alternatives:
  - will see
  - will gaze upon
  lexicon: HALOT
  rationale: ראה commonly means 'see,' but in this context with ב plus object it carries the sense of looking upon in triumph or witnessing what happens to one's enemies. 'Will look on' preserves the idiom without importing a fuller paraphrase such as 'in triumph.'
- source_word: בְשֹׂנְאַי
  chosen: those who hate me
  alternatives:
  - those who hate me
  - my enemies
  lexicon: HALOT
  rationale: This naturally renders the plural participle with its first-person suffix without the marked English noun “haters.”
