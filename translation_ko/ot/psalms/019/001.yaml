id: PSA.19.1
reference: Psalms 19:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ מִזְמ֥וֹר לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/001.yaml
  text: The heavens declare the glory of God, and the expanse[b] proclaims the work of his hands[a].
  footnotes:
  - marker: a
    text: Or 'by David' or 'for David'; the Hebrew expression can indicate authorship, association, or dedication.
    reason: alternative_reading
translation:
  language: ko
  text: 하늘이 하나님의 영광을 선포하고, 창공이 그 손으로 하신 일을 알립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁창’. 히브리어 라키아(רָקִיעַ)는 펼쳐진 하늘 또는 하늘의 둥근 지붕을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 합창 지휘자에게
  - 음악 감독에게
  - 인도자에게
  lexicon: HALOT
  rationale: 시편 표제어의 לַמְנַצֵּחַ는 예배 음악을 맡은 책임자에게 향하는 표지로 이해하는 것이 자연스럽습니다. '지휘자'는 기능을 간결하게 드러내면서도 현대 한국어에서 무리 없이 읽힙니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 찬가
  - 노래
  - 시편
  lexicon: HALOT
  rationale: מִזְמוֹר는 장르 표지로서 '시편'이라는 책 이름보다 짧은 '시'가 표제문의 형식에 더 직접적입니다. 다만 한국어 문맥에서는 '시'만으로도 시편 표제의 장르성을 충분히 전달합니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗을 위한
  - 다윗에게
  - 다윗이 지은
  lexicon: HALOT
  rationale: לְדָוִד는 저자성, 관련성, 헌정성을 모두 열어 두는 표제어이므로, '다윗의'가 한국어에서 가장 과잉 해석 없이 그 열린 관계를 보존합니다.
theological_decisions:
- issue: 시편 표제의 לְדָוִד를 한국어로 어떻게 처리할지
  chosen_reading: '''다윗의''로 번역해 저자·관련·헌정의 가능성을 모두 남겨 둡니다.'
  alternative_readings:
  - '''다윗이 지은''으로 저자성을 확정하는 번역'
  - '''다윗을 위한''으로 헌정성을 확정하는 번역'
  rationale: 히브리어 표제는 다윗과의 관계를 단일하게 규정하지 않으므로, 한국어도 그 모호성을 유지하는 편이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
