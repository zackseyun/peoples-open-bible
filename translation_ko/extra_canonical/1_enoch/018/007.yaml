  text: 그리고 동쪽의 것들은 빛깔 있는 돌이었고, 그 가운데 하나는 진주석이었으며, 또 하나는 치유의 돌이었습니다. 남쪽의 것들은 붉은 돌이었습니다.
  philosophy: optimal-equivalence
