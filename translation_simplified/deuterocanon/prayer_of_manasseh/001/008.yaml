translation:
  language: en
  text: So, Lord, God of righteous people, you did not appoint reorientation toward you[r1][a] for righteous people—Abraham, Isaac, and Jacob—who did not sin against you. But you appointed it for me—the sinner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “set repentance before.”
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
