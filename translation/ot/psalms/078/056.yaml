  from: tested and rebelled against God Most High
  to: tested God Most High and rebelled
  rationale: The current phrasing conjoins two verbs ('tested' and 'rebelled') before a single prepositional phrase ('against God Most High'). While 'rebelled against' is idiomatic, 'tested against' is not; the Hebrew verb נסה (nsh, 'to test') takes a direct object. The current syntax forces an unidiomatic reading onto the first verb. The suggested rewrite separates the two verbal ideas for clarity and grammatical precision, rendering the first verb with its direct object ('tested God Most High') and allowing the second ('rebelled') to stand, with the object of rebellion being perfectly clear from the context.
