  from: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
  to: No one among you may sacrifice his son or daughter in the fire[a], practice divination, tell fortunes[b], interpret omens, or practice sorcery.
  rationale: The earlier rationale avoided identifying the fire ritual, but Deuteronomy 12:31 and the wider biblical usage strongly support child sacrifice. I render that meaning with the alternative noted, while retaining the established distinctions among the occult practices.
