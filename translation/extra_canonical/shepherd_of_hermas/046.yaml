id: HERM.M.12.vi
reference: Shepherd of Hermas — Mandate 12, section vi
unit: section
book: Shepherd of Hermas
source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Ἐγὼ δὲ ὑμῖν λέγω, ὁ ἄγγελος τῆς μετανοίας· μὴ φοβήθητε τὸν διάβολον. ἀπεστάλην γάρ, φησί, μεθ' ὑμῶν εἶναι τῶν μετανοούντων ἐξ ὅλης καρδίας αὐτῶν καὶ ἰσχυρο-
  language: Greek
  pages:
  - 356
  unit_id: M.12.vi
  label: Mandate 12, section vi
  sequence: 46
translation:
  text: 'But I[a], the angel of repentance[c], say to you: do not fear the devil. For I was sent," he says[b], "to be with you who are repenting with all your heart and to streng—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Hermas, the 'angel of repentance' is the heavenly guide who instructs Hermas and aids those turning back to God. The phrase reflects the work’s angelology rather than a purely metaphorical 'spirit of repentance.'
    reason: cultural_note
  - marker: b
    text: The Greek line available to us breaks at ἰσχυρο- and continues in full editions; this draft reflects the extant portion supplied here.
    reason: textual_variant
  - marker: c
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄγγελος τῆς μετανοίας
  chosen: the angel of repentance
  alternatives:
  - the angel of reorientation
  - the angel of repentance
  - the messenger of repentance
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: μετάνοια / μετανοέω (μετανοούντων)
  chosen: repentance / those who are repenting
  alternatives:
  - reorientation / those who are reorienting
  - repentance / those who are repenting
  - change of mind / those changing their mind
  - penitence / penitents
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: μὴ φοβήθητε
  chosen: do not be afraid
  alternatives:
  - do not fear
  - do not be fearful
  lexicon: BDAG
  rationale: Imperative prohibition best rendered with clear, direct English. "Do not be afraid" is natural while preserving the exhortational tone. "Do not fear" is possible but slightly more archaic in register.
- source_word: διάβολος
  chosen: the devil
  alternatives:
  - the accuser
  - the slanderer
  lexicon: BDAG
  rationale: Hermas employs διάβολος as the personal adversary figure. "Devil" communicates this conventional referent in early Christian discourse; "accuser/slanderer" would over-literalize and potentially obscure the personal entity intended.
- source_word: ἀπεστάλην
  chosen: I was sent
  alternatives:
  - I have been sent
  lexicon: BDAG
  rationale: Aorist passive indicative in narrative speech. Simple past "I was sent" fits the context of commission; English present perfect is possible but less direct.
- source_word: μεθ' ὑμῶν εἶναι
  chosen: to be with you
  alternatives:
  - to be among you
  - to be beside you
  lexicon: LSJ
  rationale: Standard idiom with μετά + genitive meaning "with"; "to be with you" is the most straightforward rendering.
- source_word: ἐξ ὅλης καρδίας
  chosen: with all [their] heart
  alternatives:
  - from [their] whole heart
  - wholeheartedly
  lexicon: BDAG
  rationale: Hebraic/Septuagintal idiom carried into Christian Greek. "With all [their] heart" preserves the biblical register; "wholeheartedly" is acceptable but less transparent to the underlying imagery.
- source_word: φησί
  chosen: he says
  alternatives:
  - (omitted)
  - he is saying
  lexicon: LSJ
  rationale: Hermas frequently uses the parenthetic reporting formula φησί in direct discourse. Retaining "he says" in dashes signals the stylistic feature without interrupting readability.
