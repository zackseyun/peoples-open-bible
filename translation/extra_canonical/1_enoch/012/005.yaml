theological_decisions:
- issue: Scope of the denial of peace and forgiveness
  chosen_reading: The denial applies to ‘them,’ the people addressed in the surrounding passage.
  alternative_readings:
  - A general statement that no sin can be forgiven
  rationale: The pronoun limits the statement; the verse does not warrant a universal doctrinal claim.
