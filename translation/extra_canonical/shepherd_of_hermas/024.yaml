id: HERM.V.4.iii
reference: Shepherd of Hermas — Vision 4, section iii
unit: section
book: Shepherd of Hermas
source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Ἠρώτησα αὐτὴν περὶ τῶν τεσσάρων χρωμάτων ὧν εἶχεν τὸ θηρίον εἰς τὴν κεφαλήν. ἡ δὲ ἀποκριθεῖσά
    μοι λέγει· Πάλιν περίεργος εἶ περὶ τοιούτων πραγμάτων. Ναί, φημί, κυρία· γνώρισόν μοι τί ἐστιν ταῦτα.
    2. Ἄκουε, φησίν· τὸ μὲν μέλαν οὗτος ὁ κόσμος ἐστίν, ἐν ᾧ κατοικεῖτε. 3. τὸ δὲ πυροειδὲς καὶ αἱματῶδες,
    ὅτι δεῖ τὸν κόσμον τοῦτον δι' αἵματος καὶ πυρὸς ἀπόλλυσθαι· 4. τὸ δὲ χρυσοῦν μέρος ὑμεῖς ἐστὲ οἱ ἐκφυγόντες
    τὸν κόσμον τοῦτον. ὥσπερ γὰρ τὸ χρυσίον δοκιμάζεται διὰ τοῦ πυρὸς καὶ εὔχρηστον γίνεται, οὕτως καὶ
    ὑμεῖς δοκιμάζεσθε [οἱ κατοικοῦντες] ἐν αὐτοῖς. οἱ οὖν μείναντες καὶ πυρωθέντες ὑπ' αὐτοῦ καθαρισθήσεσθε.
    ὥσπερ τὸ χρυσίον ἀποβάλλει τὴν σκωρίαν αὐτοῦ, οὕτω καὶ ὑμεῖς ἀποβαλεῖτε πᾶσαν λύπην καὶ στενοχωρίαν,
    καὶ καθαρισθήσεσθε καὶ χρήσιμοι ἔσεσθε εἰς τὴν οἰκοδομὴν τοῦ πύργου. 5. τὸ δὲ λευκὸν μέρος ὁ αἰὼν
    ὁ ἐπερχόμενός ἐστιν, ἐν ᾧ κατοικήσουσιν οἱ ἐκλεκτοὶ τοῦ θεοῦ· ὅτι ἄσπιλοι καὶ καθαροὶ ἔσονται οἱ ἐκλελεγμένοι
    ὑπὸ τοῦ Θεοῦ εἰς ζωὴν αἰώνιον. 6. σὺ οὖν μὴ διαλίπῃς λαλῶν εἰς τὰ ὦτα τῶν ἁγίων. ἔχετε καὶ τὸν τύπον
    τῆς θλίψεως τῆς ἐρχομένης μεγάλης. ἐὰν δὲ ὑμεῖς θελήσητε, οὐδὲν ἔσται. μνημονεύετε τὰ προγεγραμμένα.
    7. ταῦτα εἴπασα ἀπῆλθεν, καὶ οὐκ εἶδον ποίῳ τόπῳ ἀπῆλθεν· ψόφος γὰρ ἐγένετο· κἀγὼ ἐπεστράφην εἰς τὰ
    ὀπίσω φοβηθείς, δοκῶν ὅτι τὸ θηρίον ἔρχεται.
  language: Greek
  pages:
  - 332
  - 333
  unit_id: V.4.iii
  label: Vision 4, section iii
  sequence: 24
translation:
  text: 'III.1. I asked her about the four colors that the beast[a] had upon its head. But she answered
    me and says, “Again you are curious about such matters.” “Yes, my Lady[b],” I say; “make known to
    me what these things are.”


    III.2. She says, “Listen: the black is this world, in which you dwell.”


    III.3. “And the fiery and blood-red[c] is because this world must be destroyed by blood and fire.”


    III.4. “But the golden portion is you who have escaped this world[p]. For just as gold is tested by
    fire and becomes useful, so also you [who dwell][d] are being tested among them[e]. Therefore you
    who have remained and have been fired by it[f] will be purified[g]. Just as gold casts off its dross,
    so also you will cast off every grief and distress, and you will be purified and will be useful for
    the building of the tower[h].”


    III.5. “But the white portion is the age that is coming[i], in which the elect of God will dwell;
    because those chosen by God for eternal life will be spotless and pure[q].”


    III.6. “You, therefore, do not cease speaking in the ears of the holy ones[j]. You also have the pattern[k]
    of the great tribulation that is coming[l]; but if you are willing, it will be nothing[m]. Remember
    the things written beforehand[n].”


    III.7. Having said these things, she went away, and I did not see to what place she went[r]; for a
    noise occurred[o]. And I turned around in fear, thinking that the beast was coming.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beast renders thērion, also wild beast. Four colors belong to the one beast’s head. Sinaiticus24.1’s
      first-hand chrēmatōn is corrected by ca to chrōmatōn, colors; the correction is not a second independent
      manuscript.
    reason: textual_variant
  - marker: b
    text: Lady retains kyria as respectful address to the visionary woman, with Mistress as an alternative.
      Sinaiticus24.1 has a dotted contracted ke first hand, replaced by S1 with kyria; the corrected feminine
      address is not intact first-hand agreement. The selected Greek has Yes, Lady, without a separate
      possessive my; my is the retained idiomatic English address, not another preserved Greek word.
    reason: lexical_alternative
  - marker: c
    text: Fiery and blood-red retain both descriptions in one color group. Blood-colored or blood-stained
      are alternatives for the second adjective. Palatina printed65 has fire or blood, vel, rather than
      the selected and, but its following destruction clause still has both blood and fire. Sinaiticus24.3
      omits dei, must, while the selected print and Athos retain it; the main text retains necessity without
      pretending agreement in every witness.
    reason: textual_variant
  - marker: d
    text: The selected print brackets hoi katoikountes, those who dwell. The English now represents that
      disputed phrase as [who dwell], applying it to you, and retains its brackets rather than certifying
      it as undisputed wording. It formerly appeared only in a note. Athos PlateIV and Sinaiticus24.4
      contain the phrase without brackets in the consulted transcriptions. Vulgata printed33 has qui habitatis.
      These are separate readings and editorial presentations, not a claim that brackets describe physical
      manuscript loss.
    reason: textual_variant
  - marker: e
    text: Among them retains the earlier adjudicated choice for en autois, also in them. The referent
      remains uncertain; the English does not replace it with an added certain noun such as trials or
      people. Athos PlateIV instead has en autō, singular. Sinaiticus24.4 has first-hand en autē, singular,
      replaced by S1 with en autois, plural. Palatina printed67 has in vobis, in yourselves, while the
      Ethiopic edition’s Latin rendering printed127 has a singular in illo. These versions do not establish
      identical pronoun number or referent.
    reason: textual_variant
  - marker: f
    text: Fired by it retains the earlier metallurgical wording for pyrōthentes, also heated, burned or
      refined. The selected hyp autou is singular, by it or by him; the fire/testing process is the earlier
      contextual interpretation, not an explicit supplied noun. Sinaiticus24.4 has plural hyp autōn, by
      them, and Vulgata printed33 has ab eis, by them. Palatina printed67 has singular ab ipso. The selected
      singular remains without harmonizing those variants.
    reason: textual_variant
  - marker: g
    text: You ... will be purified restores the selected second-person plural future katharisthēsesthe.
      The participles remained and fired describe the addressed people; the former those ... will be purified
      obscured the direct you. Athos uses epimeinantes where the selected print has meinantes; both express
      remaining or endurance. Vulgata has a third-person purification construction, which is not a reason
      to replace the selected Greek person. The later second-person purification, every grief and distress,
      and usefulness all remain.
    reason: textual_variant
  - marker: h
    text: The tower remains the building image of the earlier visions. The selected text says both purified
      and useful for its construction, not purification alone. Vulgata printed34 has purified in the tower’s
      structure but lacks the exact separate useful clause there; Palatina printed67 and the mediated
      Ethiopic Latin printed127 retain usefulness. Versional differences are not silently imported into
      the working text.
    reason: textual_variant
  - marker: i
    text: The age that is coming retains aiōn ho eperchomenos, also the coming age or world to come. This
      contrasts with the present kosmos, world, in paragraph2. The English does not add an exact timetable.
      Latin world/age vocabulary is not itself another preserved Greek aiōn reading.
    reason: lexical_alternative
  - marker: j
    text: Holy ones renders hagioi, also saints. Do not cease speaking in their ears retains the negative
      command and bodily hearing image; it does not add a new class of hearers or convert the instruction
      into a permission to stop.
    reason: lexical_alternative
  - marker: k
    text: Pattern retains typos, also type, sign or token, the previous prefigurative wording. The Ethiopic
      edition’s Latin rendering printed127 instead describes a completed explanation of the coming great
      calamity; it is mediated versional evidence, not exact lexical corroboration of typos or a direct
      Geʿez manuscript reading.
    reason: lexical_alternative
  - marker: l
    text: Great tribulation that is coming retains the magnitude and future orientation of the selected
      phrase. Coming great distress or affliction are alternatives. Palatina printed67 omits great in
      this clause; the selected Greek and Athos retain it. The differing Palatina description does not
      cancel the adjective in the main text.
    reason: textual_variant
  - marker: m
    text: If you are willing, it will be nothing retains the condition and elliptical future. The prior
      interpretation that the trial’s impact becomes as nothing for the willing remains a contextual possibility.
      If you are willing, nothing will happen, with the event averted, is another reading; the main text
      does not settle these alternatives. Sinaiticus24.6, Athos and the consulted Latin versions retain
      a conditional nothing formulation; the Ethiopic edition’s Latin rendering has as nothing. This is
      not an unconditional promise that no trial exists.
    reason: lexical_alternative
  - marker: n
    text: The things written beforehand retains ta progegrammena, also what was previously written. Earlier
      written admonitions or parts of the vision are possible references, not a newly identified book
      title. Remember remains an imperative, not merely a prediction of future memory.
    reason: lexical_alternative
  - marker: o
    text: Noise retains psophos, also sound, an unspecified disturbance, as in the earlier main text.
      Athos PlateIV and Vulgata printed34 have a noise construction; the Ethiopic edition’s Latin rendering
      printed127 has heard noise. Sinaiticus24.7 instead reads nephos, cloud, and Palatina printed67 nebula,
      cloud or mist. Those witnesses do not all support noise. Thinking the beast was coming is the narrator’s
      fearful inference, not a report that the beast actually returned.
    reason: textual_variant
  - marker: p
    text: You who have escaped this world retains the selected past escape formulation. Palatina printed65
      instead has evadetis, you will escape, a future. That difference is disclosed without silently replacing
      the selected aspect or inventing another escape event.
    reason: textual_variant
  - marker: q
    text: The full because-clause retains spotless and pure, chosen by God, and eternal life. Sinaiticus24.5
      has a shorter statement about the coming age, God’s elect and eternal life, omitting the intervening
      because/purity/chosen-by-God clause; this is not marked as a gap or supplied text there. Athos PlateIV
      retains the longer purity clause but has elect of the Lord at its first occurrence, where the selected
      text has God. The Ethiopic edition’s mediated Latin likewise uses Lord. Vulgata and Palatina retain
      the longer purity wording. The main text is not shortened or its divine title harmonized.
    reason: textual_variant
  - marker: r
    text: I did not see to what place she went retains the selected departure clause. Sinaiticus24.7 first
      hand has only the departure at this point; ca adds the did-not-see/where clause, with topō, place,
      itself marked supplied in the modern XML. Neither that correction nor the supplied word is described
      as intact first-hand ink. The narrator turns back in fear and supposes the beast is coming; Palatina’s
      expecting and the Ethiopic edition’s appeared-to-me wording remain disclosed versional differences.
    reason: textual_variant
lexical_decisions:
- source_word: θηρίον
  chosen: beast
  alternatives:
  - wild beast
  lexicon: BDAG
  rationale: Common apocalyptic term; "beast" preserves symbolic weight without adding 'wild' unless needed.
- source_word: χρώματα
  chosen: colors
  lexicon: LSJ
  rationale: Plain sense of visible hues on the beast’s head.
- source_word: εἰς τὴν κεφαλήν
  chosen: upon its head
  alternatives:
  - on its head
  lexicon: BDAG
  rationale: Spatial prepositional sense; "upon" keeps the visionary concreteness.
- source_word: περίεργος
  chosen: curious
  alternatives:
  - overcurious
  - meddlesome
  lexicon: LSJ
  rationale: Reproach for inquisitiveness fits context; 'curious' is idiomatic yet close to sense.
- source_word: κυρία
  chosen: Lady
  alternatives:
  - Mistress
  lexicon: LSJ
  rationale: Hermas consistently addresses the visionary woman as 'Lady'; 'Mistress' can imply ownership
    and is less fitting in English.
- source_word: κόσμος
  chosen: world
  alternatives:
  - order
  - universe
  lexicon: BDAG
  rationale: Here denotes the present human world-order in which they dwell; 'world' captures this.
- source_word: πυροειδές
  chosen: fiery
  alternatives:
  - fire-colored
  lexicon: LSJ
  rationale: Adjectival form meaning 'of fire-like appearance'.
- source_word: αἱματῶδες
  chosen: blood‑red
  alternatives:
  - blood-stained
  - blood-colored
  lexicon: LSJ
  rationale: Color nuance fits the symbolic palette; 'blood‑red' is succinct.
- source_word: ἀπόλλυσθαι
  chosen: be destroyed
  alternatives:
  - perish
  - be undone
  lexicon: BDAG
  rationale: Passive infinitive of ruin fits prophetic-apocalyptic diction.
- source_word: χρυσοῦν (μέρος) / χρυσίον
  chosen: golden / gold
  lexicon: LSJ
  rationale: '''Golden portion'' keeps the metaphor; ''gold'' for the refining comparison.'
- source_word: ἐκφυγόντες
  chosen: escaped
  alternatives:
  - fled out from
  lexicon: BDAG
  rationale: Compound emphasizes deliverance from; 'escaped' is natural English.
- source_word: δοκιμάζεται
  chosen: is tested
  alternatives:
  - is proved
  - is tried
  lexicon: BDAG
  rationale: Metallurgical testing; 'tested' communicates the process.
- source_word: εὔχρηστον
  chosen: useful
  alternatives:
  - serviceable
  lexicon: LSJ
  rationale: Outcome of testing is suitability for use; 'useful' is clear and concise.
- source_word: ἐν αὐτοῖς
  chosen: among them
  alternatives:
  - in them
  lexicon: BDAG
  rationale: Keeps the ambiguity of the Greek referent (the conditions or elements mentioned).
- source_word: πυρωθέντες
  chosen: fired
  alternatives:
  - heated
  - refined
  lexicon: LSJ
  rationale: Metallurgical 'to fire' matches the gold-smelting imagery.
- source_word: σκωρία
  chosen: dross
  alternatives:
  - slag
  - scoria
  lexicon: LSJ
  rationale: Standard term for impurities removed in refining.
- source_word: λύπη
  chosen: grief
  alternatives:
  - sorrow
  lexicon: BDAG
  rationale: Emotional burden to be cast off; 'grief' pairs well with 'distress'.
- source_word: στενοχωρία
  chosen: distress
  alternatives:
  - anguish
  - hardship
  lexicon: BDAG
  rationale: Captures constriction/pressure metaphor in accessible English.
- source_word: χρήσιμοι
  chosen: useful
  alternatives:
  - serviceable
  lexicon: LSJ
  rationale: Echoes earlier εὔχρηστον to keep the utility motif consistent.
- source_word: οἰκοδομή
  chosen: building
  alternatives:
  - construction
  lexicon: BDAG
  rationale: Literal building of the symbolic tower, not abstract 'edification' here.
- source_word: λευκόν
  chosen: white
  lexicon: LSJ
  rationale: Color in the symbolic sequence; plain rendering.
- source_word: αἰὼν ὁ ἐπερχόμενος
  chosen: the age that is coming
  alternatives:
  - the coming age
  - the world to come
  lexicon: BDAG
  rationale: '''Age'' reflects two-age eschatology; ''coming'' keeps the temporal movement.'
- source_word: ἐκλεκτοί / ἐκλελεγμένοι
  chosen: elect / those chosen
  alternatives:
  - chosen / chosen ones
  lexicon: BDAG
  rationale: Adjectival form as 'elect'; participle as 'those chosen' to reflect aspect while keeping
    root consistency.
- source_word: ἄσπιλοι καὶ καθαροί
  chosen: spotless and pure
  alternatives:
  - without stain and clean
  lexicon: BDAG
  rationale: Idiomatic pair in moral purity language.
- source_word: ἅγιοι
  chosen: holy ones
  alternatives:
  - saints
  lexicon: BDAG
  rationale: '''Holy ones'' preserves early-Christian texture and literal sense.'
- source_word: τύπος
  chosen: pattern
  alternatives:
  - type
  - token
  - sign
  lexicon: BDAG
  rationale: '''Pattern'' conveys an exemplar/foreshadow without technical theological ''type'' jargon.'
- source_word: θλῖψις μεγάλη ἐρχομένη
  chosen: the great tribulation that is coming
  alternatives:
  - the great distress that is coming
  - the coming great affliction
  lexicon: BDAG
  rationale: '''Tribulation'' preserves apocalyptic register while remaining intelligible.'
- source_word: μνημονεύετε τὰ προγεγραμμένα
  chosen: remember the things written beforehand
  alternatives:
  - remember what was previously written
  lexicon: BDAG
  rationale: Plain imperative; keeps pro- prefix nuance of prior recording.
- source_word: ψόφος
  chosen: noise
  alternatives:
  - sound
  - rumbling
  lexicon: LSJ
  rationale: Neutral auditory disturbance fits the scene.
- source_word: ἐπεστράφην εἰς τὰ ὀπίσω
  chosen: I turned around
  alternatives:
  - I turned back
  lexicon: BDAG
  rationale: Natural English for physical movement to the rear.
- source_word: δοκῶν ὅτι
  chosen: thinking that
  alternatives:
  - supposing that
  lexicon: BDAG
  rationale: Cognitive aspect of the narrator’s fear.
- source_word: '[οἱ κατοικοῦντες]'
  chosen: '[who dwell]'
  alternatives:
  - omit the bracketed phrase from the main text, disclose in note
  lexicon: Selected Greek print and bounded Athos/Sinaiticus/versional comparison
  rationale: Represent the print’s bracketed disputed phrase explicitly, without describing editorial
    brackets as physical manuscript loss. Preserve the selected plural among them and the earlier adjudication.
- source_word: οἱ οὖν μείναντες ... καθαρισθήσεσθε
  chosen: Therefore you who have remained ... will be purified
  alternatives:
  - Therefore those of you who have remained ... will be purified
  lexicon: Selected Greek morphology
  rationale: Restore second-person plural future and express the participial group as the addressed you,
    rather than silently substituting a third-person statement.
