  rationale: 히브리어 원문에 따라 ‘영원히’(לְעוֹלָם), ‘내가 지키겠다’(אֶשְׁמֹר), ‘나의 한결같은 사랑’(חַסְדִּי), ‘나의 언약’(בְּרִיתִי)을 모두 반영했습니다. נֶאֱמֶנֶת는 언약의 신실함과 확실함을 함께 나타낼 수 있으므로 본문에서는 한국어에서 자연스러운 ‘확실할 것입니다’를 쓰고, ‘신실할 것입니다’는 각주로 남겨 의미 범위를 보존했습니다. 두 번의 לוֹ는 ‘그를 위해/그에게’로 각각의 자연스러운 한국어 결합에 맞추어 옮겼습니다.
