translation:
  text: The women sit in the streets with cords wrapped around themselves, burning bran as incense.
  philosophy: dynamic
lexical_decisions:
- source_word: περιθέμεναι
  lemma: περιτίθημι
  chosen: with cords wrapped around themselves
  alternatives:
  - having put cords around themselves
  - wearing cords
  lexicon: LSJ
  rationale: The participle from περιτίθημι indicates placing something around oneself. 'Wrapped around themselves' is natural English while preserving the reflexive sense better than the vaguer 'wearing.'
- source_word: σχοινία
  chosen: cords
  alternatives:
  - ropes
  - strings
  lexicon: LSJ
  rationale: σχοινία denotes cords/ropes. 'Cords' fits the likely ritual or symbolic binding without overstating size as 'ropes' might.
- source_word: ἐν ταῖς ὁδοῖς
  chosen: in the streets
  alternatives:
  - on the roads
  - in the ways
  lexicon: LSJ
  rationale: In this urban/public setting, ὁδοί is best rendered 'streets' rather than the more literal but less idiomatic 'roads' or 'ways.'
- source_word: ἐγκάθηνται
  chosen: sit
  alternatives:
  - sit down
  - remain seated
  lexicon: LSJ
  rationale: The verb means to sit or sit down. Simple present 'sit' matches the descriptive flow of the verse.
- source_word: θυμιῶσα
  lemma: θυμιάω
  chosen: burning
  alternatives:
  - offering incense with
  - fumigating with
  lexicon: LSJ
  rationale: The participle is from θυμιάω, to burn incense or make smoke offerings. Because the direct object here is πίτυρα ('bran'), 'burning' communicates the act clearly without implying standard incense material.
- source_word: τὰ πίτυρα
  chosen: bran
  alternatives:
  - chaff
  - coarse meal
  lexicon: LSJ
  rationale: πίτυρα commonly means bran. 'Bran' is the most direct lexical equivalent; 'chaff' would suggest a different agricultural byproduct.
