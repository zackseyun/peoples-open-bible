id: ISA.14.32
reference: Isaiah 14:32
source:
  edition: WLC
  text: וּ/מַֽה יַּעֲנֶ֖ה מַלְאֲכֵי ג֑וֹי כִּ֤י יְהוָה֙ יִסַּ֣ד צִיּ֔וֹן וּ/בָ֥/הּ יֶחֱס֖וּ עֲנִיֵּ֥י עַמּֽ/וֹ־־׃ס
translation:
  text: And what answer should be given to the nation's envoys? “Yahweh has founded Zion, and in her the afflicted among his people will find refuge.”
  philosophy: dynamic
lexical_decisions:
- source_word: וּמַה
  chosen: And what
  alternatives:
  - What
  - And how
  lexicon: HALOT
  rationale: Introduces the content of the expected reply with a conjunctive waw plus interrogative; 'And what' preserves the discourse connection from the prior context.
- source_word: יַעֲנֶה
  chosen: will one answer
  alternatives:
  - will he answer
  - shall be answered
  lexicon: HALOT
  rationale: 'Qal imperfect 3ms of ענה here functions generically/indefinitely: ''what will one answer?'' This avoids forcing a specific subject not present in the Hebrew while yielding natural English.'
- source_word: מַלְאֲכֵי גוֹי
  chosen: the messengers of the nation
  alternatives:
  - the envoys of the nation
  - the ambassadors of the nation
  - the messengers of a nation
  lexicon: HALOT
  rationale: מלאכי can denote diplomatic messengers/envoys in context. 'Messengers' is broad and transparent; 'of the nation' reflects the singular גוי, likely referring to the foreign nation just addressed, without over-specifying 'ambassadors.'
- source_word: כִּי
  chosen: That
  alternatives:
  - For
  - Because
  lexicon: HALOT
  rationale: Introduces the substance of the answer rather than a causal clause in English. 'That' best captures the content of the reply.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: יִסַּד
  chosen: has founded
  alternatives:
  - has established
  - founded
  - laid the foundation of
  lexicon: HALOT
  rationale: The verb יסד denotes founding/establishing, often with architectural nuance. Present perfect in English fits the prophetic assertion of an accomplished divine act with ongoing significance.
- source_word: צִיּוֹן
  chosen: Zion
  alternatives:
  - Tsion
  lexicon: HALOT
  rationale: Standard English transliteration of the place name.
- source_word: וּבָהּ
  chosen: and in her
  alternatives:
  - and in it
  - and within her
  lexicon: HALOT
  rationale: The pronominal suffix is feminine singular, referring to Zion. 'Her' preserves the personified-city imagery common in prophetic literature.
- source_word: יֶחֱסוּ
  chosen: will find refuge
  alternatives:
  - will take refuge
  - will seek refuge
  lexicon: HALOT
  rationale: חסה means to seek/take refuge. 'Will find refuge' reads naturally in English and fits the resultative sense in context, while still conveying dependence on Zion as the place of safety.
- source_word: עֲנִיֵּי עַמּוֹ
  chosen: the afflicted of his people
  alternatives:
  - the poor of his people
  - the humble of his people
  - the needy of his people
  lexicon: HALOT
  rationale: עניים can denote the poor, afflicted, or humble depending on context. Here 'afflicted' best captures the vulnerable, oppressed condition of the LORD's people in need of refuge, without reducing the term to merely economic poverty.
