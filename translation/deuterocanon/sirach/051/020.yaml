translation:
  text: I devoted my soul to pursuing her[a], and for everlasting ages I will not turn away from her. In purity I found her, and from the beginning[b] I acquired a heart for her[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, 'I gave my soul after her'. The English expresses devoted pursuit while retaining the soul image.
    reason: lexical_alternative
  - marker: b
    text: Hebrew has a feminine suffix, literally 'from her beginning'; its precise relation to Wisdom remains open.
    reason: lexical_alternative
  - marker: c
    text: Greek orders the heart and purity clauses differently, has plural 'with them' in the heart clause, and ends 'I will not be abandoned'. Hebrew's promise not to turn away expresses different agency.
    reason: textual_variant
lexical_decisions:
- source_word: נַפְשִׁי נָתַתִּי אַחֲרֶיהָ, וּלְנֵצַח נְצָחִים לֹא אַטֶּה מִמֶּנָּה.  וּבְטָהֳרָה מְצָאתִיהָ, וְלֵב קָנִיתִי לָהּ מִתְּחִלָּתָהּ.
  chosen: I devoted my soul to pursuing her, and for everlasting ages I will not turn away from her. In purity I found her, and from the beginning I acquired a heart for her.
  rationale: נָתַתִּי, מְצָאתִיהָ, קָנִיתִי qatal 1cs, the middle form with 3fs object; אַטֶּה Hiphil yiqtol 1cs of נטה; אַחֲרֶיהָ 'after her'; לָהּ and מִתְּחִלָּתָהּ have 3fs suffixes. The opening idiom expresses giving one's soul in devoted pursuit. The remaining Hebrew clauses and their order are retained; 'from the beginning' is idiomatic, with the feminine suffix disclosed. Greek's differing order and passive promise are not imported.
