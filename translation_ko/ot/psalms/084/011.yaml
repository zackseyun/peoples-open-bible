- from: 참으로 당신의 뜰에서의 하루가 천 일보다 낫습니다. 저는 악인의 장막에 거하기보다 제 하나님 집의 문지방에 서기를 택하였습니다.[a][b]
  to: 이는 야훼 하나님은 해와 방패이시며, 야훼께서는 은총과 영예를 주시기 때문입니다. 그분은 온전하게 행하는 이들에게 좋은 것을 거절하지 않으십니다.
  rationale: 히브리어 כִּי를 앞 문맥의 근거를 제시하는 ‘이는 … 때문입니다’로 옮겼습니다. שֶׁמֶשׁ וּמָגֵן의 시적 은유를 ‘해와 방패’로 그대로 유지했습니다. יִתֵּן과 לֹא יִמְנַע는 일반적·반복적 진술로서 현재형 ‘주시기’와 ‘거절하지 않으십니다’로 번역했습니다. לַהֹלְכִים בְּתָמִים은 ‘온전하게 행하는 이들’로 옮겨 삶의 방식이라는 은유와 תמים의 온전함·성실함을 함께 보존했습니다.
