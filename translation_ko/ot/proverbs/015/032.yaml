base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/032.yaml
  text: Whoever ignores discipline despises himself, but he who listens to reproof gains understanding.
translation:
  language: ko
  text: 훈계를 저버리는 사람은 자기 자신을 업신여기지만, 책망을 듣는 사람은 분별력을 얻습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פּוֹרֵעַ מוּסָר
  english_pob_choice: ignores discipline
  chosen_korean: 훈계를 저버리는 사람
  alternatives_korean:
  - 훈계를 무시하는 사람
  - 훈계를 버리는 사람
  lexicon: מוסר → 훈계
  rationale: פּוֹרֵעַ는 단순한 무시는 아니고 훈계를 풀어 헤치거나 저버리는 뉘앙스를 가지므로, 의미를 살려 ‘저버리는’으로 옮겼습니다.
- source_word: מוֹאֵס נַפְשׁוֹ
  english_pob_choice: despises himself
  chosen_korean: 자기 자신을 업신여기지만
  alternatives_korean:
  - 자기 자신을 멸시하지만
  - 자기 생명을 멸시하지만
  lexicon: נפש → 자기 자신
  rationale: נֶפֶשׁ/נַפְשׁוֹ는 여기서 단순한 ‘생명’보다 인격 전체를 가리키므로, POB의 취지를 따라 자기 자신으로 풀었습니다.
- source_word: וְשׁוֹמֵעַ תּוֹכַחַת
  english_pob_choice: he who listens to reproof
  chosen_korean: 책망을 듣는 사람
  alternatives_korean:
  - 훈계를 듣는 사람
  - 타이름을 듣는 사람
  lexicon: תּוֹכַחַת → 책망
  rationale: תּוֹכַחַת는 교정적 권면이면서도 책망의 성격을 가지므로, 문맥상 가장 직접적인 ‘책망’을 택했습니다.
- source_word: קוֹנֶה לֵב
  english_pob_choice: gains understanding
  chosen_korean: 지혜를 얻습니다
  alternatives_korean:
  - 마음을 얻습니다
  - 분별력을 얻습니다
  - 깨달음을 얻습니다
  lexicon: לֵב → 마음/분별
  rationale: לֵב는 히브리어에서 이해력과 분별의 중심을 뜻하므로, 본문의 대비 구조를 살려 ‘지혜를 얻는다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: לֵב의 의미 범위
  chosen_reading: 지혜를 얻습니다
  alternative_readings:
  - 마음을 얻습니다
  - 분별력을 얻습니다
  rationale: 히브리어 לֵב는 단순 감정기관이 아니라 사고·분별의 중심을 포함하므로, 잠언의 교훈적 문맥에서는 ‘지혜’가 가장 기능적으로 대응합니다.
  doctrine_reference: 지혜문학의 인식론적 마음(לֵב) 이해
