revisions:
- from: 지금 나는 느부갓네살이니, 하늘의 왕을 찬양하고 높이며 존귀히 여깁니다. 그의 모든 일은 진실하고, 그의 길은 정의이며, 교만하게 걷는 자들을 그는 낮추실 수 있습니다.
  to: 이제 나 느부갓네살은 하늘의 왕을 찬양하고 높이며 존귀하게 합니다. 그의 모든 행위는 참되고 그의 길은 정의로우며, 교만 가운데 행하는 자들을 그는 낮추실 수 있습니다.
  rationale: 원문의 명시적 시간 표지 כְּעַן을 ‘이제’로 반영하고, 자기 지시 구문을 현대 합쇼체에 맞게 다듬었습니다. 세 개의 찬양 동사와 두 개의 병렬 술어를 보존했으며, ‘교만 가운데 행하는’으로 בְּגֵוָה와 ‘걷다’의 비유를 유지했습니다. יָכִל לְהַשְׁפָּלָה는 능력 표현으로 ‘낮추실 수 있습니다’로 옮겼습니다.
