  rationale: The translation follows original-language primacy rather than defaulting to familiar NT-influenced English tradition. At the same time, because the traditional phrasing is deeply embedded in Christian reception history and reflects legitimate lexical possibilities, the alternatives are preserved in footnotes rather than suppressed.
