translation:
  text: For we had told the king that the strength of our Lord would be with those who seek him for every restoration[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'for all restoration'; the unusual Greek phrase may more broadly mean 'for success' or 'for a good outcome'.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπαμεν
  chosen: we had told
  alternatives:
  - we said
  - we told
  lexicon: BDAG
  rationale: 'A past perfect in English fits the narrative sequence naturally: this statement had already been made to the
    king before the present action. ''Told'' better reflects speech directed to a person than the flatter ''said.'''
- source_word: Ἰσχὺς
  chosen: strength
  alternatives:
  - might
  - power
  lexicon: BDAG
  rationale: Ἰσχύς denotes strength or might. 'Strength' is clear modern English and preserves the sense of divine enabling
    without overstating into a more abstract 'power.'
- source_word: τοῦ κυρίου ἡμῶν
  chosen: of our Lord
  alternatives:
  - of our master
  lexicon: BDAG
  rationale: κύριος is rendered by the project's default as 'Lord.' In this Jewish-Greek context it refers to God reverentially;
    'our Lord' is the most natural rendering.
- source_word: μετὰ τῶν ἐπιζητούντων αὐτόν
  chosen: with those who seek him
  alternatives:
  - with those who diligently seek him
  - with those who look for him
  lexicon: BDAG
  rationale: ἐπιζητέω can intensify the idea of seeking, but English usually expresses this adequately with 'seek' unless
    the emphasis must be foregrounded. 'Those who seek him' is idiomatic and faithful.
- source_word: εἰς πᾶσαν ἐπανόρθωσιν
  chosen: for every restoration
  alternatives:
  - for all restoration
  - unto complete restoration
  - for every good outcome
  lexicon: LSJ
  rationale: The Greek expression is rendered 'for every restoration' in this unit. The selected Greek, not an approximate
    cross-reference, controls the active rendering; any prior lexicon label is historical, not a new consultation.
