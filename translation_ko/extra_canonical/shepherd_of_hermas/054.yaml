lexical_decisions:
- source_word: δοξάζων τὸν Κύριον
  english_pob_choice: glorifying the Lord
  chosen_korean: 주님을 찬양하며
  alternatives_korean:
  - 주님께 영광을 돌리며
  - 주님을 영화롭게 하며
  lexicon: δοξάζω
  rationale: 경배적·찬양적 맥락이어서 자연스럽게 ‘찬양하다’로 옮기되, 대상은 κύριος의 통상 번역인 ‘주님’으로 유지했습니다.
- source_word: ἐντολαί
  english_pob_choice: commandments
  chosen_korean: 계명들
  alternatives_korean:
  - 명령들
  - 훈계들
  lexicon: ἐντολή
  rationale: 문맥상 단순한 지시가 아니라 준수해야 할 규범적 명령이어서 ‘계명들’이 가장 직접적입니다.
- source_word: διψυχεῖς
  english_pob_choice: double-minded
  chosen_korean: 마음이 갈라집니까
  alternatives_korean:
  - 의심합니까
  - 두 마음을 품습니까
  lexicon: διψυχέω
  rationale: 단순 지적 의심보다 내적 분열과 양분된 상태를 드러내는 표현이어서, 한국어로는 ‘마음이 갈라지다’가 소스의 긴장을 잘 보존합니다.
- source_word: ἔνδυσαι τὴν πίστιν τοῦ Κυρίου
  english_pob_choice: clothe yourself with faith in the Lord
  chosen_korean: 주님에 대한 믿음을 입으십시오
  alternatives_korean:
  - 주님에 대한 믿음으로 옷 입으십시오
  - 주님의 믿음을 입으십시오
  lexicon: ἐνδύω + πίστις
  rationale: ‘입다’의 비유를 살리면서도 믿음의 대상이 주님임을 분명히 하기 위해 ‘주님에 대한 믿음’을 택했습니다.
- source_word: ἱλαραὶ / πάνυ ἱλαρός
  english_pob_choice: cheerful
  chosen_korean: 즐거워하고 / 매우 즐거워하고
  alternatives_korean:
  - 기뻐하고
  - 명랑하고
  lexicon: ἱλαρός
  rationale: 반복되는 형용사를 일관되게 ‘즐거워하다’ 계열로 옮겨, 양들과 목자의 정서적 분위기를 그대로 살렸습니다.
theological_decisions:
- issue: ‘야훼’ 대신 κύριος를 본문에서 어떻게 처리할 것인가
  chosen_reading: 이 단락의 κύριος는 원문 상 그냥 ‘주님’으로 두었습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 여기서는 구약 인용에 해당하는 명시적 YHWH 표지가 없고, 이야기 화자가 예수를 가리키는 호칭으로 쓰고 있으므로 전통적·문맥적 호칭인 ‘주님’이 가장 안전합니다.
  doctrine_reference: κύριος 호칭의 문맥적 번역 원칙
- issue: ‘faith of the Lord’의 소유격을 어떻게 이해할 것인가
  chosen_reading: ‘주님에 대한 믿음’으로 옮겨, 믿음의 대상이 주님임을 드러냈습니다.
  alternative_readings:
  - 주님의 믿음
  - 주님을 향한 믿음
  rationale: 원문은 문법적으로 애매하지만, 이 문맥에서는 믿음의 주체적 성질보다 신뢰의 대상이 강조되므로 ‘주님에 대한 믿음’이 가장 균형적입니다.
  doctrine_reference: πίστις의 목적격/속격 문맥 해석
