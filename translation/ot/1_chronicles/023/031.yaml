  meaning_decisions:
  - source_phrase: וּלְכֹל הַעֲלוֹת עֹלוֹת לַיהוָה
    prior_rendering: and for all the burnt offerings offered to Yahweh
    new_rendering: Whenever burnt offerings were offered to Yahweh ... the Levites were also to serve
    rationale: The phrase continues the Levites’ duties and specifies the occasions for their service; it does not independently assign them the priestly act of offering the sacrifices.
  - source_phrase: בְּמִסְפָּר כְּמִשְׁפָּט עֲלֵיהֶם
