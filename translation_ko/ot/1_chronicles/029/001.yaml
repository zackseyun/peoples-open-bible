  source_fidelity: ‘택하신 사람’은 히브리어의 관계절을 대체로 전달하지만, ‘내 아들 솔로몬’을 직접 수식하는 구조로 옮기는 편이 더 충실합니다. הַמְּלָאכָה는 여기서 성전 건축을 위한 ‘일/공사’를 가리키며, 문맥상 ‘이 일’도 가능하나 ‘공사’가 더 구체적입니다. הַבִּירָה는 영어 POB의 ‘palace’를 따라 ‘궁전’으로 유지할 수 있습니다.
  naturalness: 합쇼체 서술에서는 ‘다윗 왕이 … 말했습니다’보다 ‘다윗 왕이 … 말씀하셨습니다’가 자연스럽고, 직접 인용 안의 접속과 논리 관계를 한 문장으로 연결하면 원문의 흐름을 더 잘 살립니다. 각주 표지는 해당 어구 바로 뒤에 두어야 합니다.
  terminology: ‘회중’, ‘야훼 하나님’은 원문의 공적 집회와 יהוה אֱלֹהִים을 일관되게 반영합니다. ‘궁전’은 영어 POB 감사 경로와 일치하되, 이 문맥의 건축물이 하나님을 위한 것이라는 대비를 본문에서 보존했습니다.
