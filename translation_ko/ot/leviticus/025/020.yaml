    rationale: 조건절과 직접 인용을 연결하는 현대 표준어 표현으로는 ‘…라고 말한다면’이 더 자연스럽습니다.
  - severity: low
    issue: 절 끝의 쉼표 뒤에 불필요한 각주 표지
    rationale: 문체상 선택을 설명하는 각주는 본문 이해에 필요하지 않으며, 수정문은 조건절 구조를 자체적으로 명료하게 드러냅니다.
