id: PSA.78.50
reference: Psalms 78:50
source:
  edition: WLC
  text: יְפַלֵּ֥ס נָתִ֗יב לְ/אַ֫פּ֥/וֹ לֹא חָשַׂ֣ךְ מִ/מָּ֣וֶת נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם לַ/דֶּ֥בֶר הִסְגִּֽיר־׃
translation:
  text: He leveled a path for his anger; he did not spare their lives from death, but gave their lives over to the plague.
  philosophy: dynamic
lexical_decisions:
- source_word: יְפַלֵּס
  chosen: leveled
  alternatives:
  - made level
  - prepared
  - cleared
  lexicon: HALOT
  rationale: The Piel of פלס commonly conveys making level or preparing a way. 'Leveled' preserves the concrete imagery of smoothing/opening a route for wrath to proceed, while remaining natural English.
- source_word: נָתִיב
  chosen: a path
  alternatives:
  - a way
  - a track
  lexicon: HALOT
  rationale: נָתִיב denotes a path or ճանապարհ-like track. 'Path' is idiomatic with the verb and preserves the metaphor of opening a course for divine anger.
- source_word: לְאַפּוֹ
  chosen: for his anger
  alternatives:
  - for his wrath
  - for his nose/anger
  lexicon: HALOT
  rationale: אַף literally refers to nose but idiomatically means anger/wrath. 'Anger' is clear modern English; 'wrath' is possible but slightly more elevated. The suffix is retained as 'his.'
- source_word: לֹא חָשַׂךְ
  chosen: he did not spare
  alternatives:
  - he did not withhold
  - he did not hold back
  lexicon: HALOT
  rationale: חשׂך in this construction means to spare or withhold. 'Did not spare' is the most idiomatic English with a direct object referring to life.
- source_word: מִמָּוֶת
  chosen: from death
  alternatives:
  - from dying
  lexicon: HALOT
  rationale: 'The preposition מן with מָוֶת is straightforwardly separative: he did not spare them from death.'
- source_word: נַפְשָׁם
  chosen: their lives
  alternatives:
  - their soul
  - their lives
  lexicon: HALOT
  rationale: In this context, the word denotes mortal life, not specifically an immaterial soul.
- source_word: וְחַיָּתָם
  chosen: their lives
  alternatives:
  - their living being
  - their life
  - their vitality
  lexicon: HALOT
  rationale: The parallel expression likewise denotes their living existence; plural English is natural with plural possessors.
- source_word: לַדֶּבֶר
  chosen: to the plague
  alternatives:
  - to pestilence
  - to disease
  lexicon: HALOT
  rationale: דֶּבֶר often denotes pestilence/plague, especially in judgment contexts. 'Plague' is accessible modern English and preserves the sense of divinely sent epidemic judgment.
- source_word: הִסְגִּיר
  chosen: gave their lives over
  alternatives:
  - delivered over
  - handed over
  - shut up
  lexicon: HALOT
  rationale: This naturally conveys handing them over to the plague.
