id: REV.12.14
reference: Revelation 12:14
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
translation:
  text: And the woman was given the two wings of the great eagle so that she could fly to her place in the wilderness, where she is nourished for a time, times, and half a time[a], out of the serpent’s reach.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The expression echoes Daniel 7:25 and 12:7 and denotes three and a half periods of time, corresponding to the 1,260 days in verse 6.
    reason: cross_reference
