  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘그가 본 것과 들은 이것을’은 관계대명사 ὃ가 가리키는 내용을 한국어에서 부자연스럽게 중복 지시합니다. ‘그가 보고 들은 것을’로 옮기면 ὃ와 τοῦτο의 내용-재개 구조를 자연스럽게 보존하면서도 의미를 잃지 않습니다. οὐδεὶς λαμβάνει의 강한 보편부정도 유지되어야 합니다.
  naturalness: 초안의 첫 문장은 ‘들은 이것’이라는 결합이 현대 표준 한국어에서 비문에 가깝고, ‘본 것과 들은 것’이라는 병렬도 불완전합니다. ‘그가 보고 들은 것을 증언합니다’가 간결하고 자연스러운 합쇼체입니다.
  terminology: μαρτυρεῖ/μαρτυρίαν은 각각 ‘증언합니다/증언’으로 일관되게 옮긴 것이 적절합니다. λαμβάνει는 해석을 과도하게 덧붙이지 않는 ‘받지 않습니다’가 적합합니다.
