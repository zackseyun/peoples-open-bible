translation:
  language: ko
  text: 하나님, 저의 구원의 하나님이시여, 피 흘린 죄책에서 저를 건져 주십시오[a]. 그러면 제 혀가 주님의 의를[b] 크게 노래하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피 흘림에서’, ‘혈죄에서’. 히브리어는 문자적으로 ‘피들’이며, 흔히 피를 흘린 데 대한 죄책을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 정의’. 히브리어 낱말은 도덕적 올바름과 사법적 정의의 뉘앙스를 함께 지닐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַמְּדָה
  english_pob_choice: I will teach
  chosen_korean: 제가 … 가르치겠습니다
  alternatives_korean:
