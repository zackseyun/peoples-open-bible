translation:
  text: And from these[a], those who were searched for in the genealogical record in the enrollment, and were not found[b],
    were excluded from serving as priests.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The context concerns verification in the genealogical register and eligibility for priestly service.
    reason: cultural_note
  - marker: b
    text: Greek 'not having been found' is feminine singular and can refer to the genealogical record; the main text retains
      the existing English construal rather than settling the compressed syntax.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζητήθησαν
  chosen: were searched for
  alternatives:
  - were sought
  - were investigated
  lexicon: LSJ
  rationale: The passive indicates that these persons were looked for in the record. 'Were searched for' keeps the procedural
    sense in context of documentary verification.
- source_word: τῆς γενικῆς γραφῆς
  chosen: the genealogical record
  alternatives:
  - the family register
  - the ancestral document
  lexicon: LSJ
  rationale: The selected Greek expression is rendered 'the genealogical record' in this list or record-search context. The
    Greek, not a same-number parallel, controls the active wording. A retained lexicon label is historical; no fresh consultation
    is claimed.
- source_word: ἐν τῷ καταλοχισμῷ
  chosen: in the enrollment
  alternatives:
  - in the registration
  - in the muster
  lexicon: LSJ
  rationale: The noun denotes arrangement by list or enrollment. 'Enrollment' fits the administrative context and avoids overly
    military connotations that 'muster' might suggest here.
- source_word: μὴ εὑρεθείσης
  chosen: were not found
  alternatives:
  - not having been found
  - was not found
  lexicon: LSJ
  rationale: The Greek genitive-absolute expression is feminine singular and can refer to the genealogical record. The existing
    finite English 'were not found' is retained for this partition-only candidate, with the syntax qualified in its note.
    The historical lexicon label does not imply a fresh consultation.
- source_word: ἐχωρίσθησαν
  chosen: were excluded
  alternatives:
  - were separated
  - were removed
  lexicon: LSJ
  rationale: In this context the verb indicates disqualification from priestly service. 'Were excluded' communicates the practical
    result more clearly than the more literal 'were separated.'
- source_word: τοῦ ἱερατεύειν
  chosen: from serving as priests
  alternatives:
  - from the priesthood
  - from ministering as priests
  lexicon: LSJ
  rationale: The infinitive expresses priestly service rather than merely abstract status. 'From serving as priests' is both
    accurate and readable.
