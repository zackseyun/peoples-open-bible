    rationale: Here ‘cuts off’ means eliminating the nations, not interrupting or isolating them; ‘ahead of you’ locates them in Israel’s path.
  - source_phrase: אֲשֶׁר אַתָּה בָא שָׁמָּה לָרֶשֶׁת אוֹתָם
