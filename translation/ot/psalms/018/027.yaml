  - humble people
  rationale: The verse contrasts those whom God rescues with the proud whom he humbles. Rendering עָנִי as 'afflicted' preserves the psalmic theme of divine rescue from distress without narrowing the term to economics alone or over-moralizing it as merely an inner virtue.
