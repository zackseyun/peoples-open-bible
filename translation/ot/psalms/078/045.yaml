  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: lexical
  tier: 1
  from: He sent among them swarms of flies[a], which devoured them, and frogs, which destroyed them.
  to: He sent among them a swarm[a], which devoured them, and frogs, which destroyed them.
  rationale: The precise referent of עָרֹב is uncertain, so “flies” is unwarranted precision in the main text. “A swarm” is closer to the singular collective Hebrew than the proposed plural “swarms,” while retaining idiomatic English. The relative clauses remain a natural way to render the following singular collective verbs.
