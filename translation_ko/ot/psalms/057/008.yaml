base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/008.yaml
  text: Awake, my glory![a] Awake, harp and lyre![b] I will awaken the dawn.
  footnotes:
  - marker: a
    text: Or “my soul” or “my whole being”; Hebrew “my glory” is a poetic self-reference.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew names two ancient stringed instruments; their exact modern equivalents are uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 깨어나십시오, 나의 영광아[a]! 깨어나십시오, 수금과 비파야[b]! 내가 새벽을 깨우겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나의 영혼’ 또는 ‘나의 온 존재’. ‘나의 영광’은 시적인 자기 지시일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 두 고대 현악기의 이름을 사용합니다. 정확히 어떤 현대 악기에 해당하는지는 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: נָכוֹן
  english_pob_choice: steadfast
  chosen_korean: 굳게 섰습니다
  alternatives_korean:
  - 굳건합니다
  - 확고합니다
  - 정해졌습니다
  lexicon: HALOT
  rationale: ‘steadfast’가 가리키는 안정성·확고함을 한국어로 자연스럽게 살리되, 시편의 결단된 태도를 함께 드러내기 위해 동사적 표현을 사용했습니다.
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_korean: 내 마음
  alternatives_korean:
  - 내 심장
  - 내 중심
  - 내 속
  lexicon: HALOT
  rationale: 히브리어 ‘heart’는 감정만이 아니라 의지와 내면 전체를 가리키므로, 한국어 성경 문맥에 자연스러운 ‘마음’을 택했습니다.
- source_word: אָשִׁירָה
  english_pob_choice: I will sing
  chosen_korean: 내가 노래하겠습니다
  alternatives_korean:
  - 내가 부르겠습니다
  - 노래하리이다
  - 노래하겠습니다
  lexicon: HALOT
  rationale: 코호르타티브의 결단을 현대 합쇼체로 옮기기 위해 ‘-겠습니다’를 사용했습니다.
- source_word: וַאֲזַמֵּרָה
  english_pob_choice: I will make melody
  chosen_korean: 찬양의 노래를 부르겠습니다
  alternatives_korean:
  - 노래하겠습니다
  - 음악을 만들겠습니다
  - 찬양하겠습니다
  lexicon: HALOT
  rationale: זמר의 ‘노래하다/찬양하다’ 성격을 살리면서 첫 번째 ‘노래하다’와 구별되도록, 음악적·찬양적 뉘앙스를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 첫 번째 절의 ‘O God’ 호격과 반복 구조를 어떻게 살릴지
  chosen_reading: ‘내 마음이 하나님께 굳게 섰습니다’와 반복문을 그대로 두어, 하나님께 직접 향한 신뢰의 선언으로 읽히게 했습니다.
  alternative_readings:
  - 하나님이여, 내 마음이 굳게 섰습니다
  - 내 마음이 확고합니다, 하나님이여
  rationale: 히브리어 본문은 하나님께 직접 말하는 호격을 전제하므로, 이를 분명히 드러내되 현대 한국어에서 과도하게 고어적이지 않게 옮겼습니다.
  doctrine_reference: 시편의 예배적 호칭과 직접 기도 언어
