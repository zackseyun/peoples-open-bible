  lexicon: HALOT
  rationale: 의미가 불확실한 장르 표지는 번역어보다 음역이 더 투명하므로 그대로 음역했습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗이 지은
