id: PRO.13.24
reference: Proverbs 13:24
source:
  edition: WLC
  text: חוֹשֵׂ֣ךְ שִׁ֭בְט/וֹ שׂוֹנֵ֣א בְנ֑/וֹ וְ֝/אֹהֲב֗/וֹ שִֽׁחֲר֥/וֹ מוּסָֽר׃
translation:
  text: Whoever withholds his rod hates his son, but whoever loves him diligently disciplines him[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “seeks him early for discipline,” which can emphasize diligence or prompt attention.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹשֵׂךְ
  chosen: withholds
  alternatives:
  - spares
  - holds back
  lexicon: HALOT
  rationale: The participle from חשׂך carries the sense of refraining from using or holding back. 'Withholds' preserves the active refusal implied by the Hebrew better than the traditional 'spares,' which can sound compassionate in modern English and may soften the proverb's force.
- source_word: שִׁבְטוֹ
  chosen: his rod
  alternatives:
  - his staff
  - his switch
  lexicon: HALOT
  rationale: שֵׁבֶט commonly denotes a rod, staff, or scepter. In wisdom literature and family-discipline contexts, 'rod' is the most direct and established sense. It should not be paraphrased away, since the concrete image is part of the proverb.
- source_word: שׂוֹנֵא
  chosen: hates
  alternatives:
  - is hateful toward
  - rejects
  lexicon: HALOT
  rationale: The verb plainly means 'hate.' Although in some biblical contexts 'hate' can function comparatively, there is no need to weaken it here. The proverb uses stark antithesis for rhetorical force.
- source_word: בְנוֹ
  chosen: his son
  alternatives:
  - his child
  lexicon: HALOT
  rationale: The Hebrew is specifically 'his son,' not a gender-neutral term. Per the translation philosophy, gender-accurate rendering is preferred over neutralization, even where the proverb may have broader representative application.
- source_word: וְאֹהֲבוֹ
  chosen: but whoever loves him
  alternatives:
  - but the one loving him
  - but he who loves him
  lexicon: HALOT
  rationale: The participial construction is rendered idiomatically in English while preserving the direct object suffix 'him,' referring back to the son.
- source_word: שִׁחֲרוֹ
  chosen: diligently disciplines him
  alternatives:
  - seeks early
  - is earnest to seek
  lexicon: HALOT
  rationale: The Piel verb conveys seeking early and, idiomatically, earnest or diligent action; its suffix is the son.
- source_word: מוּסָר
  chosen: disciplines
  alternatives:
  - instruction
  - correction
  - training
  lexicon: HALOT
  rationale: In this construction, discipline is directed to the son; a verbal English rendering avoids an ungrammatical or misleading objectless noun phrase.
