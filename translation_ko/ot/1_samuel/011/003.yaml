base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: ko
  text: 야베스의 장로들이 그에게 말했습니다. 「칠 일 동안 우리를 그냥 두십시오. 그러면 우리가 전령들을 이스라엘의 모든 지역으로 보내겠습니다. 그런 뒤에 우리를 구할 자가 없으면, 우리가 당신에게로 나가겠습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף לָנוּ
  english_pob_choice: Leave us alone
  chosen_korean: 우리를 그냥 두십시오
  alternatives_korean:
  - 우리를 내버려 두십시오
  - 잠시 물러나 주십시오
  - 우리에게서 손을 떼십시오
  lexicon: הֶרֶף
  rationale: 청유가 아니라 위협 상황에서의 ‘그만 간섭하라/물러서라’는 요청이므로, 영어 POB의 직설성을 살려 ‘그냥 두십시오’로 옮겼습니다.
- source_word: שִׁבְעַת יָמִים
  english_pob_choice: for seven days
  chosen_korean: 칠 일 동안
  alternatives_korean:
  - 일주일 동안
  - 일곱 날 동안
  lexicon: שֶׁבַע / יָמִים
  rationale: 히브리어의 기간 표현을 자연스러운 현대 한국어로 옮기되, 수량과 기간이 분명히 드러나도록 했습니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 전령들
  alternatives_korean:
  - 사자들
  - 사신들
  - 심부름꾼들
  lexicon: מַלְאָךְ
  rationale: 문맥상 천사가 아니라 사람을 보내는 것이므로 ‘전령들’이 가장 중립적이며 공적입니다.
- source_word: מוֹשִׁיעַ אֹתָנוּ
  english_pob_choice: no one to save us
  chosen_korean: 우리를 구할 자가 없으면
  alternatives_korean:
  - 우리를 구원할 이가 없으면
  - 우리를 건져 줄 사람이 없으면
  lexicon: יָשַׁע
  rationale: 구출·구원의 의미를 살리되, 이 본문에서는 군사적 구조의 뉘앙스가 강하므로 ‘구할 자’로 간명하게 옮겼습니다.
theological_decisions:
- issue: ‘구하다/구원하다’의 뉘앙스
  chosen_reading: 이 절에서는 종말론적 ‘구원’보다 현실적 위기에서의 ‘구출’ 뉘앙스를 살리되, 한국어 성경 어휘로는 ‘구하다’ 계열을 유지했습니다.
  alternative_readings:
  - ‘구원할 자가 없으면’
  - ‘건져 줄 사람이 없으면’
  rationale: 사울의 군사적 상황 속 협상 문맥이므로, 독자가 과도한 신학적 일반화를 하지 않도록 사건성 중심으로 번역했습니다.
  doctrine_reference: 서사 문맥의 어휘 선택
