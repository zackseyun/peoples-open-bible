translation:
  text: and Jahaz, and Kedemoth, and Mephaath;
  philosophy: dynamic
lexical_decisions:
- source_word: וְ/יַהְצָה
  chosen: and Jahaz
  alternatives:
  - and Jahzah
  lexicon: HALOT
  rationale: Proper place name in a boundary/city list; transliterated rather than translated per philosophy for names. English convention commonly shortens/spells the name as 'Jahaz'; 'Jahzah' reflects a closer consonantal preservation and is worth preserving as an alternative.
- source_word: וּ/קְדֵמֹת
  chosen: and Kedemoth
  lexicon: HALOT
  rationale: Proper place name; transliterated directly. Although the root relates to 'east' or 'ancient things,' in this context it functions as a toponym and should not be translated semantically.
- source_word: וּ/מֵפָעַת
  chosen: and Mephaath
  alternatives:
  - and Mophaath
  lexicon: HALOT
  rationale: Proper place name; transliterated. 'Mephaath' is the standard English form; minor spelling variation 'Mophaath' appears in some traditions and is preserved as an alternative.
