- field: translation.footnotes
  value:
  - marker: a
    text: The words 'removes ignorance and' are textually uncertain in the Greek witness and are therefore retained in brackets.
    reason: textual_variant
  - marker: b
    text: Or 'envy' for 'jealousy' in v. 3; the Greek term can cover both hostile jealousy and envious rivalry.
    reason: lexical_alternative
  - marker: c
    text: The phrase rendered 'for ten months' is literally 'for ten times/periods'; 'months' is a contextual judgment.
    reason: alternative_reading
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
