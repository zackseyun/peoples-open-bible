  text: ὁ δὲ βασιλεὺς ὑπερισχύει καὶ κυριεύει αὐτῶν, καὶ δεσπόζει αὐτῶν, καὶ πᾶν ὃ ἐὰν εἴπῃ αὐτοῖς ἐνακούουσιν.
