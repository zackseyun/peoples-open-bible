  naturalness: ‘야훼, 이스라엘의 하나님께서’도 가능하나, 관계절을 포함한 문장에서는 ‘이스라엘의 하나님 야훼’가 더 자연스럽고 명료합니다. 원문의 신탁 도입 공식과 뒤따를 말씀을 연결하는 콜론을 유지했습니다.
  terminology: ‘야훼’, ‘이스라엘의 하나님’, ‘간구’는 모두 현대 한국어 성서 문맥에서 무난하며 원문의 호칭과 탄원 의미를 충실히 보존합니다. ‘그분 앞에’는 לְפָנָיו의 표현을 살립니다.
