translation:
  text: 'VIII.1. When I stopped asking her about all these things, she says to me, “Do you want to see
    something else?” Eager to see it, I became very glad.


    VIII.2. She looked at me, smiled, and says, “Do you see seven women around the tower?” “I do, lady,”
    I said. “These women support this tower at the Lord’s command.”


    VIII.3. “Now hear their functions[a]. The first, the one clasping her hands[b], is called Faith. Through
    her the chosen of God are saved[d].”


    VIII.4. “The second, who is girded about and acting bravely[c], is called Self-control. She is Faith’s
    daughter. Whoever follows her becomes blessed in his life, because he will refrain from all evil works.
    He believes that if he refrains from every evil desire, he will inherit eternal life[e].”


    VIII.5. “Who are the others, lady?” “They are daughters of one another. They are called Simplicity,
    Knowledge, Innocence, Dignity, and Love[f]. Whenever you do all their mother’s works[g], you are able
    to live.”


    VIII.6. “I wanted to know, lady,” I said, “what power each has.” “Hear,” she says, “the powers they
    have.”


    VIII.7. “Their powers are held together by one another[h]. They follow one another in the order in
    which they were born. Self-control is born from Faith, Simplicity from Self-control, Innocence from
    Simplicity, Dignity from Innocence, Knowledge from Dignity, and Love from Knowledge. Their works are
    pure and dignified and divine[i].”


    VIII.8. “Whoever serves them and proves able to hold fast to their works[j] will have his dwelling
    in the tower with the holy ones of God[k].”


    VIII.9. I kept asking her about the times, whether it is already the end[l]. She cried out loudly,
    “Senseless man, do you not see that the tower is still being built? When the tower is finished being
    built, it comes to an end. But it will be built up quickly. Do not ask me anything more. This reminder
    and the renewal of your spirits are enough for you and for the holy ones[m].”


    VIII.10. “It was not revealed to you alone, but so that you may make these things known to all[n].”


    VIII.11. “After three days[r]—for you must first understand, and I first command you, Hermas, the
    words I am about to say to you—speak[o] them all[p] into the ears of the holy ones. Then, after hearing
    them and doing them, they may be cleansed from their evils[q], and you also with them.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Functions renders energeiai, also activities or operations. Paragraph6 asks about powers, dynameis;
      the two expressions are not collapsed into a new list of people.
    reason: lexical_alternative
  - marker: b
    text: Clasping her hands retains the earlier interpretation. Literally holding the hands, the Greek
      does not explicitly add her own; holding hands or being strong in the hands are alternatives discussed
      for this image. The gesture is not uniquely established by an English possessive. Vulgata contains
      manu, Palatina tenet manus, and the Ethiopic edition’s Latin rendering puts manibus in parentheses;
      these do not settle the exact gesture.
    reason: textual_variant
  - marker: c
    text: Acting bravely renders andrizomenē, showing courage, with a literal be-manly nuance. Being girded
      about, also belted or ready for action, remains separate. Sinaiticus16.4 and both Latin versions
      retain the courageous action; Athos PlateIII and the Ethiopic edition’s Latin rendering omit it.
      Its omission there is not imported into the working text.
    reason: textual_variant
  - marker: d
    text: The selected Greek says through her, dia tautēs, and the chosen of God are saved, present passive.
      Faith remains a woman personifying the virtue in the tower vision. Sinaiticus16.3 instead has dia
      tautēn, because of her; its initially malformed called expression is corrected by S1/d. Vulgata
      printed23 uses per hanc and future salvation. The Ethiopic edition’s Latin rendering printed122
      says chosen of the Lord. These are not identical grammatical forms or a reason to add a later doctrinal
      account.
    reason: textual_variant
  - marker: e
    text: The working text retains believing that, the if-condition concerning abstention from every evil
      desire, and future inheritance of eternal life. Sinaiticus16.4 instead joins refraining from evil
      works and every evil desire and inheriting life without this believing/if sequence. Athos retains
      the condition; Vulgata printed24 also has believing/if, while Palatina printed49 has a different
      believing/escape/and-inherit construction. The Ethiopic edition’s Latin rendering uses a when-abstaining
      construction. The differences are disclosed without weakening or removing the selected condition.
    reason: textual_variant
  - marker: f
    text: These personified names retain Simplicity, Knowledge, Innocence, Dignity and Love, with single-heartedness,
      understanding, guilelessness, reverent seriousness and charity as alternatives. Paragraph5’s list
      has Knowledge earlier than the birth chain in7; Sinaiticus agrees with that list order, while Athos
      lists them in the birth-chain order. Vulgata printed24 has Simplicitas, Innocentia, Modestia, Disciplina
      and Caritas; Palatina printed49 has Simplicitas, Disciplina, Innocentia, Castitas and Caritas, with
      Caritas an editorial emendation of codex Claritas. The Ethiopic edition’s Latin rendering printed122
      gives Innocentia, Hilaritas, Caritas, Castitas and Sinceritas with a different later chain. No harmonized
      list is imposed.
    reason: textual_variant
  - marker: g
    text: Their mother is singular in the selected text; the preceding birth from Faith supplies context,
      but the English does not replace the source’s mother with a new explicit identification. Sinaiticus16.5
      initially repeats mother, with S1/ca deleting the repetition. Vulgata printed24 concludes that you
      can keep all rather than the selected you are able to live. Palatina printed49 prints vivere, live,
      as an emendation of codex videre, see. Edited readings and codex words are distinguished.
    reason: textual_variant
  - marker: h
    text: Their powers are held together by one another preserves the selected mutual relation. Sinaiticus16.7
      has apo, from, rather than hypo, by, and its repeated/corrupt Simplicity sequence is corrected by
      S1/ca. Athos omits the explicit powers noun in the opening but retains mutual holding, following
      and birth. Corrections are not counted as independent manuscripts.
    reason: textual_variant
  - marker: i
    text: Pure, dignified and divine renders hagna, semna and theia. The complete selected birth chain
      ends Knowledge to Love. Vulgata printed24 instead joins Disciplina and Caritas at its ending and
      describes works as holy, chaste and right. Palatina printed49 has a fuller chain using Castitas/Disciplina
      and describes chaste, holy and divine works. The Ethiopic edition’s Latin rendering has a different
      sequence and an additional chastity/justice statement. These formulations are not flattened into
      exact Greek corroboration.
    reason: textual_variant
  - marker: j
    text: Hold fast to their works retains the earlier lexical adjudication; master their works is the
      archived prior rendering. Serving the women and proving able to hold fast remain coordinated requirements
      before dwelling in the tower. Neither is omitted or weakened to mere admiration.
    reason: lexical_alternative
  - marker: k
    text: Holy ones of God retains the selected plural human/community designation, with saints of God
      as an alternative. Sinaiticus16.8, Athos and Vulgata retain God; Palatina printed49 has holy ones
      without God, and its apparatus reports erased tuis after sanctis. The Ethiopic edition’s Latin rendering
      has holy ones of the Lord. These titles are not silently interchanged.
    reason: textual_variant
  - marker: l
    text: The end renders synteleia, completion or consummation, in the question about the times. The
      reply connects the end with the tower’s completion and says it will be built up quickly; it gives
      no calendar date. Sinaiticus16.9’s repeated tower-completion wording is corrected by S1/ca; Athos
      has a shorter completion clause. Neither difference cancels the selected still-being-built statement
      or quick completion.
    reason: textual_variant
  - marker: m
    text: This reminder and the renewal are nominative expressions; retain the earlier grammatical adjudication
      making both part of what is enough, rather than translating renewal as for the renewal. Your spirits
      is plural and the address reaches Hermas and the community. Both Latin versions retain reminder
      and renewal; the Ethiopic edition’s Latin rendering instead uses a purpose construction about renewing
      a singular spirit. That does not replace the selected Greek grammar.
    reason: textual_variant
  - marker: n
    text: Not to you alone and so that you may make them known to all retain both the denial of private
      restriction and the purpose. The Greek switches from singular revealed to plural them; the English
      leaves that reference broad rather than identifying a new object. The Ethiopic edition’s Latin rendering
      printed122 has an active you reveal formulation in its main text; its footnote proposes passive
      was revealed. The proposed repair is not counted as preserved passive manuscript evidence.
    reason: textual_variant
  - marker: o
    text: Speak is the existing contextual English resolution of lalēsai, an infinitive which LH1891 marks
      with obeli as textually difficult. The print reports that Sinaiticus and Athos have the infinitive,
      while the versions suggest an imperative or purpose construction. The official Sinaiticus16.11 XML
      has first-hand lalēse corrected by ca to lalēsai and lacks the selected first-command clause; Athos
      has that clause and lalēsai. Vulgata printed25 has ut loquaris, so that you speak; Palatina printed51
      has the imperative loquere. The English command is retained with this uncertainty explicit, not
      presented as an unproblematic unanimous Greek imperative.
    reason: textual_variant
  - marker: p
    text: All corresponds to bracketed panta in the selected auta [panta]. LH1891’s apparatus attributes
      the combined wording to Hilgenfeld’s conjecture, linked to Palatina, and reports auta in Sinaiticus
      versus panta in Athos. The official Sinaiticus16.11 XML has auta without panta; Athos PlateIII prints
      panta. Vulgata printed25’s omnia is itself an editorial emendation, with omnibus or omission reported;
      Palatina printed51 has ea omnia. The selected all is retained as disclosed editorial wording, not
      claimed to survive in every manuscript.
    reason: textual_variant
  - marker: q
    text: The selected purpose includes hearing the words and doing them before being cleansed from their
      evils; Hermas is expressly included with them. Sinaiticus16.11 initially has an active cleansing
      form corrected by ca to passive katharisthōsin. Athos, both Latin versions and the Ethiopic edition’s
      Latin rendering retain hearing/doing/cleansing and Hermas’s inclusion in their formulations. No
      one-sided hearing-only promise or exclusion of Hermas is added.
    reason: textual_variant
  - marker: r
    text: After three days retains the selected interval together with first understanding, the first
      command addressed to Hermas and the words she is about to say. The exact syntax of the final command
      is difficult, as noteo explains. The Ethiopic edition’s Latin rendering printed123 instead has until
      the third day, with day parenthetical. No universal agreement on the timing formulation is claimed.
    reason: textual_variant
lexical_decisions:
- source_word: βαστάζεται
  chosen: is supported
  alternatives:
  - is carried
  - is borne
  lexicon: BDAG
  rationale: In the tower image the sense is structural support. 'Supported' keeps the picture clear without
    weakening the metaphor.
- source_word: ἐνεργείας
  chosen: functions
  alternatives:
  - activities
  - operations
  - powers at work
  lexicon: LSJ
  rationale: The term describes what each personified virtue does. 'Functions' is clear and concrete in
    English.
- source_word: Πίστις
  chosen: Faith
  alternatives:
  - Faithfulness
  lexicon: BDAG
  rationale: As a personified virtue in Hermas, 'Faith' is the most natural rendering and matches the
    genealogical sequence that follows.
- source_word: Ἐγκράτεια
  chosen: Self-control
  alternatives:
  - Temperance
  - Continence
  lexicon: BDAG
  rationale: Self-restraint is the moral force of the virtue here, and 'Self-control' is the clearest
    modern English equivalent.
- source_word: Ἁπλότης
  chosen: Simplicity
  alternatives:
  - Single-heartedness
  - Sincerity
  lexicon: BDAG
  rationale: Hermas uses the term in an ethical sense close to singleness and straightforwardness; 'Simplicity'
    preserves the traditional moral register.
- source_word: Ἀκακία
  chosen: Innocence
  alternatives:
  - Guilelessness
  - Harmlessness
  lexicon: LSJ
  rationale: The virtue names build a chain of moral character; 'Innocence' is readable and keeps the
    ethical sense.
- source_word: Σεμνότης
  chosen: Dignity
  alternatives:
  - Gravity
  - Reverent seriousness
  lexicon: BDAG
  rationale: The term denotes honorable seriousness; 'Dignity' works naturally in the virtue list while
    preserving the elevated tone.
- source_word: Ἀγάπη
  chosen: Love
  alternatives:
  - Charity
  lexicon: BDAG
  rationale: Standard rendering and the right one for the closing virtue in the sequence.
- source_word: κατοίκησιν
  chosen: dwelling
  alternatives:
  - residence
  - habitation
  lexicon: LSJ
  rationale: The point is having one’s settled place in the tower. 'Dwelling' keeps the symbolic and eschatological
    force.
- source_word: συντέλεια
  chosen: the end
  alternatives:
  - consummation
  - completion
  lexicon: BDAG
  rationale: The question is eschatological. 'The end' is plain English and fits the tower-completion
    image.
- source_word: ἀνακαίνωσις
  chosen: renewal
  alternatives:
  - renewing
  - restoration
  lexicon: BDAG
  rationale: The noun marks inward renewal of life/spirit; 'renewal' is the best idiomatic rendering.
- source_word: καθαρισθῶσιν
  chosen: may be cleansed
  alternatives:
  - may be purified
  lexicon: BDAG
  rationale: Hermas uses cleansing language for moral purification; 'cleansed' preserves that imagery.
- source_word: κρατῆσαι τῶν ἔργων
  chosen: hold fast to their works
  alternatives:
  - keep their works
  rationale: Retain the earlier full lexical adjudication, archived before replacement; serving and being
    able to hold fast are both required.
- source_word: †λαλῆσαι† αὐτὰ [πάντα]
  chosen: speak them all
  alternatives:
  - so that you speak them all
  rationale: Retain the contextual command while noteso/p disclose the obelized infinitive, differing
    constructions and bracketed editorial all. No new manuscript reading selected.
