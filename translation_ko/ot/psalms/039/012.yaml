source:
  edition: WLC
  text: בְּֽ/תוֹכָ֘ח֤וֹת עַל עָוֺ֨ן יִסַּ֬רְתָּ אִ֗ישׁ וַ/תֶּ֣מֶס כָּ/עָ֣שׁ חֲמוּד֑/וֹ אַ֤ךְ הֶ֖בֶל כָּל אָדָ֣ם סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/012.yaml
  text: Hear my prayer, Yahweh, and listen to my cry; do not be silent at my tears[a]. For I am a sojourner with you, a resident alien like all my fathers[b].
  footnotes:
  - marker: a
    text: Or 'you make his precious things waste away like a moth'; the Hebrew for 'what is precious to him' can also be understood more specifically as 'his beauty' or more broadly as 'his treasured things.'
    reason: lexical_alternative
  - marker: b
    text: '''Vapor'' renders Hebrew hebel, a word used for breath-like transience or insubstantiality; traditionally, ''vanity.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와여, 제 기도를 들으시고 제 부르짖음에 귀를 기울여 주십시오. 제 눈물을 향해 잠잠하지 마십시오[a]. 저는 주님과 함께하는 나그네이며, 제 모든 조상들과 같은 거류민입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 눈물에 귀를 막지 마십시오.’ 히브리어 동사는 ‘잠잠하다’ 또는 문맥상 ‘듣지 못하다/귀를 막다’로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘제 모든 아버지들과 같이’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  english_pob_choice: with rebukes
  chosen_korean: 책망으로
  alternatives_korean:
