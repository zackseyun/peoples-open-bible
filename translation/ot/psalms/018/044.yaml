id: PSA.18.44
reference: Psalms 18:44
source:
  edition: WLC
  text: לְ/שֵׁ֣מַֽע אֹ֭זֶן יִשָּׁ֣מְעוּ לִ֑/י בְּנֵֽי נֵ֝כָ֗ר יְכַחֲשׁוּ לִֽ/י־־׃
translation:
  text: As soon as they hear of me, they obey me; foreigners feign obedience to me[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “foreigners submit cringingly to me.”
    reason: alternative_reading
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  chosen: As soon as they hear
  alternatives:
  - As soon as they hear
  - At the mere hearing
  lexicon: HALOT
  rationale: The idiom denotes an immediate response upon hearing; a literal note preserves its concrete Hebrew wording.
- source_word: יִשָּׁמְעוּ לִי
  chosen: they obey me
  alternatives:
  - they hear me
  - they listen to me
  lexicon: HALOT
  rationale: שׁמע with ל often carries the sense 'listen to, obey.' In this royal-victory context, obedience is the likely force, not mere auditory hearing. This also creates a meaningful contrast with the following colon about foreigners' insincere submission.
- source_word: בְּנֵי נֵכָר
  chosen: foreigners
  alternatives:
  - sons of a foreign land
  - alien peoples
  - foreign sons
  lexicon: HALOT
  rationale: The phrase literally means 'sons of foreignness/foreign land,' an idiom for foreigners or alien peoples. 'Foreigners' is the clearest natural English equivalent and preserves the referent without awkward literalism.
- source_word: יְכַחֲשׁוּ לִי
  chosen: feign obedience to me
  alternatives:
  - submit cringingly to me
  - lie to me
  - yield feigned allegiance to me
  lexicon: HALOT
  rationale: כחש in the piel can mean 'deceive, deny, disappoint,' and in contexts of conquest often conveys forced or insincere submission. 'Feign obedience' best fits the parallelism with 'obey me' while signaling that the submission is not genuine. A more literal 'lie to me' is possible but too opaque in English here.
