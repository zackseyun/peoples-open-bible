translation:
  text: I looked and saw within it a lofty throne. Its appearance [was] like crystal, and its circle [was] like
    the shining sun. And [there was] the voice of the cherubim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The selected final words are literally “and the voice of the cherubim.” That voice word is retained. The
      bracketed words supply English copulas for nominal phrases, not an unprinted hearing or seeing verb. The text
      does not specify how the voice relates to the throne’s appearance, so the English leaves that relation open
      rather than changing voice into a conjectured vision. Circle can also denote roundness; no different Greek
      wheel expression is adopted. The low confidence and these grammatical limits are essential to this critical
      rendering.
