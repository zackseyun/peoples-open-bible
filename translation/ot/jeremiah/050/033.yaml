theological_decisions:
- issue: Rendering of the divine name יְהוָה in the prophetic formula
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Whether to render בְּנֵי literally or idiomatically
  chosen_reading: The sons of Israel ... and the sons of Judah
  alternative_readings:
  - The people of Israel ... and the people of Judah
  - The Israelites and the Judeans
  rationale: The Hebrew is grammatically masculine plural and refers to the covenant people groups. Per the gender-accurate policy, the filial expression is preserved rather than neutralized, since it is not merely an abstract national label.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
revisions:
- timestamp: '2026-04-21T01:27:49Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
