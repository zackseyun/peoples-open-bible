translation:
  text: Reason, the master gardener, weeds, prunes, ties up, waters, and thoroughly irrigates each of these, taming the wild growth of character and passions[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the materials of character and passions”; the word for “materials” can also mean wood or woodland.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἕκαστος
  chosen: Each of these
  alternatives:
  - each one of which
  - each of them
  lexicon: LSJ
  rationale: The phrase refers back to the previously mentioned virtues or faculties. 'Each of these' is idiomatic English and preserves the distributive force of ἕκαστος.
- source_word: ὁ πανεγώργος λογισμός
  chosen: all-working reason
  alternatives:
  - resourceful reason
  - universally effective reason
  - reason that works in every way
  lexicon: LSJ
  rationale: λογισμός in 4 Maccabees is a key term for rational faculty or reasoned judgment, often personified. πανεγώργος is rare and conveys being capable of every kind of operation or effect. 'All-working reason' keeps the unusual, active force without flattening it to a generic adjective.
- source_word: περικαθαίρων
  chosen: thoroughly purifies
  alternatives:
  - cleanses all around
  - purifies completely
  lexicon: LSJ
  rationale: The peri- prefix intensifies the action. 'Thoroughly purifies' communicates comprehensive cleansing in natural English.
- source_word: ἀποκνίζων
  chosen: prunes away
  alternatives:
  - scrapes off
  - cuts away
  - pares away
  lexicon: LSJ
  rationale: The verb is uncommon and suggests removing what is excessive or rough. 'Prunes away' fits the sequence of shaping metaphors and conveys selective removal rather than total destruction.
- source_word: περιπλέκων
  chosen: entwines
  alternatives:
  - interweaves
  - wraps around
  - braids together
  lexicon: LSJ
  rationale: The verb literally suggests weaving or winding around. 'Entwines' preserves the figurative image of reason shaping moral material.
- source_word: ἐπάρδων
  chosen: raises up
  alternatives:
  - lifts up
  - elevates
  lexicon: LSJ
  rationale: The participle likely continues the series of craft or cultivation metaphors. 'Raises up' is straightforward and keeps the upward formative sense.
- source_word: πάντα τρόπον μεταχέων
  chosen: in every way transforms
  alternatives:
  - changing in every manner
  - recasting by every method
  lexicon: LSJ
  rationale: The phrase denotes alteration by every possible method. 'Transforms' captures the cumulative effect of the preceding participles in readable English.
- source_word: ἐξημεροῖ
  chosen: tames
  alternatives:
  - civilizes
  - makes gentle
  lexicon: LSJ
  rationale: The verb means to make gentle, tame, or civilized. 'Tames' best fits the image of bringing unruly inner material under rational control.
- source_word: τὰς τῶν ἠθῶν καὶ παθῶν ὕλας
  chosen: the raw materials of character and passions
  alternatives:
  - the matter of habits and passions
  - the material of moral dispositions and emotions
  lexicon: LSJ
  rationale: ὕλη is literally material, timber, or raw matter. Here it is metaphorical for the stuff out of which character and passions are formed. ἤθη are moral dispositions or character traits; πάθη are passions or emotions. 'Raw materials of character and passions' preserves the metaphor and the anthropological distinction.
