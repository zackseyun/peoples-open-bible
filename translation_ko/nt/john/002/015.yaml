id: JHN.2.15
reference: John 2:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
  footnotes:
  - marker: a
    text: Greek ἱερόν refers to the temple complex or courts, not specifically the inner sanctuary.
    reason: cultural_note
  - marker: b
    text: Or 'both the sheep and the oxen.'
    reason: lexical_alternative
  - marker: c
    text: The Greek says 'them all,' then specifies 'both the sheep and the cattle'; the wording does not explicitly state that the whip was used on people.
    reason: alternative_reading
translation:
  language: ko
  text: 끈으로 채찍을 만드신 뒤, 그분은 성전 뜰[a]에서 모두를[c] 쫓아내셨으며, 양과 소[b]도 쫓아내셨습니다. 또 환전상들의 동전을 쏟으시고 그들의 탁자들을 뒤엎으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἱερόν은 내부 성소(ναός)가 아니라 성전 구역이나 뜰을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 '양과 황소(oxen)'로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 '모두'라고 한 뒤 양과 소를 명시합니다. 채찍이 사람들에게 사용되었는지는 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: φραγέλλιον
  english_pob_choice: a whip
  chosen_korean: 채찍
  alternatives_korean:
  - 매
  - 채찍 모양의 도구
  lexicon: BDAG
  rationale: φραγέλλιον은 채찍과 유사한 도구를 가리킵니다. 한국어에서 '채찍'이 가장 자연스럽고 독자가 곧 이해할 수 있는 용어입니다.
- source_word: ἐκ σχοινίων
  english_pob_choice: out of cords
  chosen_korean: 끈으로 만든
  alternatives_korean:
  - 밧줄로 만든
  - 끈들로 된
  lexicon: BDAG
  rationale: σχοινίων은 끈·밧줄과 같은 재료를 가리키므로 '끈으로 만든'이 채찍의 재료 감을 한국어로 정확하게 전달합니다. 어순상 채찍을 수식하도록 표현했습니다.
- source_word: τοῦ ἱεροῦ
  english_pob_choice: the temple courts
  chosen_korean: 성전의 뜰
  alternatives_korean:
  - 성전
  - 성전 경내
  lexicon: BDAG
  rationale: ἱερόν은 내부 성소(ναός)가 아니라 성전 구역·뜰을 가리키므로, '성전의 뜰'이라 번역해 구역적 의미를 살렸습니다(각주 a).
- source_word: πάντας
  english_pob_choice: them all
  chosen_korean: 모두
  alternatives_korean:
  - 모든 이들
  - 전부
  lexicon: BDAG
  rationale: 그리스어의 범주적 포괄성을 보존하기 위해 중립적인 포괄어인 '모두'를 택했습니다. 원문은 이어서 동물을 명시하므로 채찍이 인간에게 사용되었는지에 관해서는 불확실성이 남습니다(각주 c).
theological_decisions:
- issue: 예수의 성전 행동의 범위와 수단(채찍 사용 대상)
  chosen_reading: 본문은 '모두'를 쫓아냈다고 말하며 이어서 양과 소를 명시합니다. 원문이 채찍이 사람들에게 사용되었다고 명시하지 않으므로, 번역은 광범한 축출 행위를 전달하되 채찍이 사람에게 직접 사용되었다고 단정하지 않습니다.
  alternative_readings:
  - 예수께서 사람들과 동물 모두를 채찍으로 내쫓으셨다(명시적 폭력 강조)
  - 예수께서 동물만을 내쫓으셨다(사람은 직접 치지 않음)
  rationale: 그리스어 구문이 'πάντας'라는 포괄적 표현을 사용하면서 다음에 동물을 명시하므로, 두 가지 해석 가능성이 존재합니다. 근원 텍스트의 긴장감을 해소하지 않고 보존하는 것이 원문에 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
