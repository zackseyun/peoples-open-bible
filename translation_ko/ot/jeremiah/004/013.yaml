theological_decisions:
- issue: 마지막 탄식의 강도와 책임 인식
  chosen_reading: ‘화가 우리에게 있도다 — 우리가 황폐하게 되었습니다!’로 옮겨, 심판을 당하는 공동체의 절규를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘우리에게 재앙이로다’
  - ‘우리는 망하였다’
  rationale: 히브리어 אוי와 שֻׁדָּדְנוּ는 단순한 슬픔이 아니라 심판 아래 놓인 공동체의 절박한 탄식을 나타내므로, 완곡하게 누그러뜨리지 않았습니다.
  doctrine_reference: 예언서의 심판 선언과 공동체 탄식
