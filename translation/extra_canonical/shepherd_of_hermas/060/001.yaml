translation:
  text: …with their whole heart. So then, do you suppose that the sins of those who are reorienting[r1] are immediately forgiven? Not entirely. Rather, the one who reorients must afflict his own soul and be humble-minded in all his conduct, resolutely, and be distressed in all kinds of tribulations; and if he bears the tribulations that come upon him, the One who created all things and strengthened them will surely be moved with compassion and will grant some healing. And this, when [God] sees the heart of the one reorienting clean from everything.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
