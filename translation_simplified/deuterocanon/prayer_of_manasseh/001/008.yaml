  rationale: “Righteous people” makes the group reference immediately clear.
- pob_phrase: for the righteous—for Abraham and Isaac and Jacob
  simplified_phrase: for righteous people—Abraham, Isaac, and Jacob
  preserved_meaning: The patriarchs are explicitly identified as righteous, maintaining the contrast with the sinner.
  reasoning_layer_used: Greek sequence and POB appositional rationale
  rationale: The category and names are both retained in a simpler apposition.
