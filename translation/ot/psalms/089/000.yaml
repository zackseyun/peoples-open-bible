translation:
  text: A Maskil[a] of Ethan the Ezrahite.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Maskil is a Hebrew musical or literary designation whose precise meaning is uncertain, possibly indicating an instructive or contemplative composition.
