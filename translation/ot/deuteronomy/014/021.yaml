theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Force of the legal verbs regarding giving/selling the carcass
  chosen_reading: permissive ('may give ... may sell')
  alternative_readings:
  - imperatival ('shall give ... shall sell')
  rationale: In this legal context the point is to prohibit Israelite consumption while allowing disposal to non-Israelites. English permissive wording communicates the law's function more naturally without adding obligation beyond the Hebrew's legal allowance.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence'
