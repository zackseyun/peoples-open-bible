source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλέγχετε δὲ ἀλλήλους μὴ ἐν ὀργῇ, ἀλλ' ἐν εἰρήνῃ, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ· καὶ παντὶ ἀστοχοῦντι κατὰ τοῦ ἑτέρου μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω, ἕως οὗ μετανοήσῃ.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/didache/015/003.yaml
  text: And reprove one another[a], not in anger but in peace, as you have in the gospel; and let no one speak to anyone who sins against another, nor let him be heard by you, until he repents.
  footnotes:
  - marker: a
    text: Or 'anyone who goes wrong against another'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:33:03Z'
    unchanged: false
    changes_summary: Removed the unnecessary pronoun in 'as you have in the gospel'; revised 'wrongs another' to 'sins against another' for closer lexical accuracy to ἀστοχοῦντι κατὰ τοῦ ἑτέρου; and changed 'nor let him hear from you' to 'nor let him be heard by you' to reflect ἀκουέτω more accurately.
translation:
  language: en
  text: Correct one another, but do it peacefully, not in anger, as the gospel teaches. If anyone sins against another person, no one among you is to speak to that offender or hear what they say until they reorient[r1].
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: reprove one another, not in anger but in peace
  simplified_phrase: Correct one another, but do it peacefully, not in anger
  preserved_meaning: Believers must correct one another peacefully rather than angrily.
  reasoning_layer_used: POB translation and Greek contrast
  rationale: This replaces formal wording while retaining the command and its contrast.
- pob_phrase: as you have in the gospel
  simplified_phrase: as the gospel teaches
  preserved_meaning: The instruction follows teaching already given in the gospel.
  reasoning_layer_used: POB translation and immediate context
  rationale: This makes the compressed expression clear without naming a specific saying.
