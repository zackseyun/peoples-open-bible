id: PSA.89.16
reference: Psalms 89:16
source:
  edition: WLC
  text: בְּ֭/שִׁמְ/ךָ יְגִיל֣וּ/ן כָּל הַ/יּ֑וֹם וּ/בְ/צִדְקָתְ/ךָ֥ יָרֽוּמוּ־׃
translation:
  text: They rejoice in your name all day long, and through your righteousness they rise high.
  philosophy: dynamic
lexical_decisions:
- source_word: בְּשִׁמְךָ
  chosen: In your name
  alternatives:
  - By your name
  - At your name
  lexicon: HALOT
  rationale: The preposition ב here is best rendered idiomatically as 'in,' expressing sphere or basis of rejoicing. 'Your name' in Hebrew commonly denotes God's revealed character and reputation, not merely the spoken label.
- source_word: יְגִילוּן
  chosen: they rejoice
  alternatives:
  - they exult
  - they are glad
  lexicon: HALOT
  rationale: From גיל, denoting joyful exultation. 'Rejoice' is natural modern English and preserves the positive, celebratory force without sounding overly elevated.
- source_word: כָּל הַיּוֹם
  chosen: all day long
  alternatives:
  - all the day
  - continually
  lexicon: HALOT
  rationale: This idiom indicates ongoing duration through the day. 'All day long' is idiomatic contemporary English and preserves the temporal emphasis.
- source_word: וּבְצִדְקָתְךָ
  chosen: and in your righteousness
  alternatives:
  - and by your righteousness
  - and in your justice
  lexicon: HALOT
  rationale: צדקה can denote righteousness or justice. Here 'righteousness' better fits the psalm's praise context and aligns with the project's default handling of cognate theological terms, while 'justice' remains a viable lexical alternative.
- source_word: יָרוּמוּ
  chosen: they rise high
  alternatives:
  - they are lifted up
  - they rise high
  lexicon: HALOT
  rationale: Renders the Qal form without adding an unexpressed passive agent, while keeping the image of elevation.
