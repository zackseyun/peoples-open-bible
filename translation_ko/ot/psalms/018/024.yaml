  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 히브리어의 두 ‘~에 따라’ 구문과 ‘그분의 눈앞에서’라는 표현을 보존합니다.
  terminology: יהוה는 POB 방침과 영어 감사 기록에 맞추어 ‘야훼’로, צִדְקִי는 ‘제 의로움’으로 옮깁니다. ‘손의 깨끗함’은 행실의 무고함/정직함을 나타내는 히브리어 비유를 유지합니다.
