  source_fidelity: 첫 절의 שָׂבַעְתָּ는 ‘수치를 충분히 당했다’라기보다 수치로 ‘가득 차다/배부르다’라는 충만의 비유입니다. 또한 תִּסּוֹב עָלֶיךָ는 잔이 ‘당신에게로 돌아오다’라는 방향성을 명시하는 편이 충실합니다. קִיקָלוֹן은 수치·치욕을 뜻하며, 본문 자체가 요구하지 않는 강도 부사 ‘극심한’은 피하는 것이 좋습니다.
  naturalness: 초안은 ‘너는/네게’와 합쇼체 명령 ‘드러내십시오’가 섞여 있습니다. 표준 현대 한국어 합쇼체에 맞추어 ‘당신/당신에게’로 통일했습니다. ‘야훼의 오른손의 잔’은 한국어에서 다소 겹쳐 들리므로 ‘야훼의 오른손에 있는 잔’으로 자연스럽게 옮겼습니다.
  terminology: יהוה는 초안의 프로젝트 방침대로 ‘야훼’로 유지했습니다. הֵעָרֵל의 수치와 노출의 표현은 ‘할례받지 않은 모습을 드러내십시오’로 유지하되, 해당 어구 바로 뒤에 주석을 배치했습니다.
