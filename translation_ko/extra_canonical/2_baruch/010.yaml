lexical_decisions:
- source_word: ܡܠܬܐ ܕܐܠܗܐ / “the word of God”
  english_pob_choice: the word of God came to me
  chosen_korean: 하나님의 말씀이 내게 임하여
  alternatives_korean:
  - 하나님의 말씀이 내게 왔습니다
  - 하나님의 말씀이 내게 이르렀습니다
  lexicon: 말씀
  rationale: 서사적 도래 표현을 자연스럽게 살리되, ‘임하다’는 예언적 계시가 주체적으로 찾아오는 뉘앙스를 보존합니다.
- source_word: ܓܠܘܬܐ / captivity, ܒܒܝܠ / Babylon
  english_pob_choice: accompany the captivity of the people as far as Babylon
  chosen_korean: 백성의 포로 행렬을 따라가게 하십시오 … 바빌론까지
  alternatives_korean:
  - 백성의 포로들을 동행하게 하십시오
  - 백성의 사로잡힘을 따라가게 하십시오
  lexicon: 포로 / 바빌론
  rationale: POB의 ‘captivity’는 추상화보다 포로 상태의 이동을 드러내는 것이 적절해 ‘포로 행렬’로 풀고, 지명은 현대 표기 ‘바빌론’을 사용했습니다.
- source_word: ܣܢ̈ܝܐ / wasteland, ܪܒܝܨܐ
  english_pob_choice: remain here in the desolation of Zion
  chosen_korean: 시온의 황폐함 가운데 머물러 있으십시오
  alternatives_korean:
  - 시온의 황무지에 머물러 있으십시오
  - 시온의 폐허 가운데 남아 있으십시오
  lexicon: 황폐함
  rationale: 시온의 상태를 단순한 지리보다 파괴된 처지로 드러내는 표현을 택해 예언적 애가의 음성을 살렸습니다.
- source_word: ܣܝܪ̈ܝܢܘܣ / Sirens, ܠܝ̈ܠܝܬܐ / Liliths, ܫܐ̈ܕܐ / demons, ܬܢ̈ܝܢܐ / dragons
  english_pob_choice: Sirens ... Liliths ... demons and dragons from the forests
  chosen_korean: 사이렌들 … 릴리트들 … 악령들과 숲의 용들
  alternatives_korean:
  - 세이렌들 … 릴리트들 … 귀신들과 용들
  - 사이렌들 … 릴리스들 … 악령들과 괴물들
  lexicon: 사이렌 / 릴리트 / 악령 / 용
  rationale: 정체불명의 전승적 존재들을 성경 본문이 지닌 이질성을 유지해 음역·직역으로 함께 살렸고, ‘숲의’는 POB의 장소 수식을 반영했습니다.
- source_word: ܒܘܟ̈ܐ / groaning, ܒܟܝܐ / lamentation, ܐܝܬܐ
  english_pob_choice: take up lamentation with me, and mourn with me
  chosen_korean: 나와 함께 애가를 시작하고, 나와 함께 슬퍼하라
  alternatives_korean:
  - 나와 함께 통곡을 하라
  - 나와 함께 애통하라
  lexicon: 애가 / 슬퍼하다
  rationale: 장르적 뉘앙스가 강한 ‘lamentation’을 ‘애가’로, 반복 명령의 호소를 평이한 동사로 옮겨 노래의 리듬을 살렸습니다.
theological_decisions:
- issue: 예언적 발화의 화자 전환과 명령문 존대
  chosen_reading: 바룩의 서술문은 합쇼체로 유지하고, 하나님의 직접 발화는 인용문 안에서 정중한 명령형으로 처리했습니다.
  alternative_readings:
  - 전체를 평서형으로 통일
  - 인용문 안에서도 서술체로 완화
  rationale: 본문은 서술자 말과 신적 직접 발화가 교차하므로, 화자 경계를 흐리지 않으면서 현대 한국어의 경어 체계를 적용하는 것이 가장 투명합니다.
  doctrine_reference: 화자 구분과 계시 문체 보존
- issue: ‘여인들아, 아이를 낳게 해 달라고 기도하지 말라’의 생식 거부 선언
  chosen_reading: 출산 자체를 금지하는 윤리 명령이 아니라, 시온의 황폐함에 상응하는 애가적 금식/중단 선언으로 읽히게 했습니다.
  alternative_readings:
  - 출산 금지의 절대 명령
  - 단순한 수사적 과장
  rationale: 문맥 전체가 시온의 멸망을 애도하는 시문이므로, 본문을 시대적 애가와 금욕 규례로 오독하지 않도록 해석의 긴장을 보존해야 합니다.
  doctrine_reference: 예언문학의 수사와 애가 전통
