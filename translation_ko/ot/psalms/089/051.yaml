id: PSA.89.51
reference: Psalms 89:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֤ר חֵרְפ֖וּ אוֹיְבֶ֥י/ךָ יְהוָ֑ה אֲשֶׁ֥ר חֵ֝רְפ֗וּ עִקְּב֥וֹת מְשִׁיחֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/051.yaml
  text: with which your enemies have taunted, Yahweh, with which they have taunted the footsteps[b] of your anointed.[a]
  footnotes:
  - marker: a
    text: Or “your Messiah.” The Hebrew says “your anointed” (מְשִׁיחֶךָ), referring here to the Davidic king.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word may denote footsteps, steps, heels, or tracks; the concrete image is preserved here.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주의 원수들이 모욕하였습니다. 그들이 주께서 기름 부으신 이의 발자취를 모욕하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주께서 기름 부으신 이’는 ‘주의 메시아’로도 옮길 수 있습니다. 이 시편의 직접 문맥에서는 다윗 왕조의 기름 부음 받은 왕을 가리킬 가능성이 크지만, 히브리어 낱말 자체가 지닌 더 넓은 메시아적 울림도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘발자취’는 문자적으로 ‘발꿈치들’, ‘걸음들’, 또는 ‘자취들’을 뜻할 수 있습니다. 여기서는 기름 부으신 이의 행보나 다가옴을 가리키는 비유적 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר / Remember
  english_pob_choice: Remember
  chosen_korean: 기억하소서
  alternatives_korean:
  - 기억해 주십시오
  - 기억해 주소서
  lexicon: WLC זכר
  rationale: 시편의 탄원 기도에서 하나님께 직접 드리는 간구이므로, 단순한 서술형보다 청유형 공손체가 원문 기능을 잘 살립니다.
- source_word: אֲדֹנָי / Lord
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 나의 주님
  lexicon: HALOT אֲדֹנָי
  rationale: 여기서는 하나님께 직접 부르는 호칭이므로 한국어 기도체에서는 ‘주님’이 가장 자연스럽고, ‘나의 주님’은 원문에 없는 소유 뉘앙스를 덧붙입니다.
- source_word: חֶרְפַּת עֲבָדֶיךָ
  english_pob_choice: the reproach of your servants
  chosen_korean: 주의 종들의 수치
  alternatives_korean:
  - 주의 종들의 모욕
  - 주의 종들의 치욕
  - 주의 종들의 수치와 모욕
  lexicon: HALOT חֶרְפָּה / עֶבֶד
  rationale: חֶרְפָּה는 단순한 조롱보다 ‘수치/치욕’의 강한 부끄러움을 가리키므로, 기도문 맥락에 맞게 ‘수치’로 옮겼습니다. עֲבָדֶיךָ는 여기서 하나님 백성에 대한 예배 언어이므로 ‘종들’이 적절합니다.
- source_word: בְחֵיקִי
  english_pob_choice: in my bosom
  chosen_korean: 내 품에
  alternatives_korean:
  - 내 품속에
  - 내 가슴에
  - 내 품 안에
  lexicon: HALOT חֵיק
  rationale: 히브리어 관용구를 한국어의 자연스러운 신체 이미지로 옮기되, 개인적으로 가깝고 내밀하게 짊어진다는 뜻을 보존하기 위해 ‘내 품에’를 택했습니다.
- source_word: כָּל רַבִּים עַמִּים
  english_pob_choice: from many peoples
  chosen_korean: 많은 민족들 가운데서
  alternatives_korean:
  - 많은 민족들로부터
  - 모든 많은 민족들의 수치로
  lexicon: HALOT עַמִּים
  rationale: 압축된 히브리어 구문을 한국어로 풀어, 수치의 출처가 여러 민족들임을 분명히 드러내되 ‘민족들’로 עמים의 집단적 의미를 살렸습니다.
theological_decisions:
- issue: 히브리어 압축 구문의 귀속 관계
  chosen_reading: 수치가 ‘많은 민족들 가운데서’ 화자에게 가해졌다는 방향으로 읽었습니다.
  alternative_readings:
  - ‘내 품에’에서 내가 짊어진 것이 ‘모든 많은 민족들의 수치’라는 읽기
  - 수치의 내용과 출처를 동시에 담는 혼합 읽기
  rationale: 원문은 בְחֵיקִי 이후 구문이 압축되어 있어 출처와 내용의 경계가 다소 겹칩니다. 시편 탄원의 흐름에서는 ‘많은 민족들로부터 받은 수치’를 먼저 드러내는 것이 가장 자연스럽습니다.
  doctrine_reference: 시편의 탄원 시학과 본문 압축 구문의 양의성
- issue: 직접 호소의 문체
  chosen_reading: 하나님께 드리는 직접 호소를 ‘기억하소서’로 공손하게 표현했습니다.
  alternative_readings:
  - ‘기억하십시오’
  - ‘기억해 주십시오’
  rationale: 합쇼체 기도문에서 존대와 간구를 함께 살리는 표현입니다. 원문 명령형의 긴박함도 유지됩니다.
  doctrine_reference: Korean liturgical style / prayer register
