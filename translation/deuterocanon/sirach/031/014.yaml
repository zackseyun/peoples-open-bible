- issue: Use of the Hebrew idiom 'evil eye'
  chosen_reading: Retain 'evil eye' in the main text
  alternative_readings:
  - stinginess
  - grudging disposition
  - envy
  rationale: The phrase is a recognizable biblical idiom for a miserly or begrudging attitude, especially in meal contexts, but the Hebrew wording itself is concrete and proverbial. Preserving the idiom maintains transparency to the source while allowing a footnote to explain the sense.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: Source-level mismatch between Hebrew and Greek parallel
  chosen_reading: Translate the extant Hebrew as primary, while noting the Greek parallel diverges substantially
  alternative_readings:
  - Translate from the Greek parallel instead
  rationale: Project policy gives primacy to the surviving Hebrew of Sirach where extant. Here the supplied Greek parallel ('The spirit of those who fear the Lord will live') does not correspond to the Hebrew line and appears to reflect a different verse or textual alignment. The English therefore follows the Hebrew, with the divergence documented honestly in a footnote.
