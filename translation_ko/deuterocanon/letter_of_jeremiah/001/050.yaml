  text: ὑπάρχοντα γὰρ ξύλινα καὶ περίχρυσα καὶ περιάργυρα γνωσθήσεται μετὰ ταῦτα ὅτι ἐστὶν ψευδῆ· τοῖς ἔθνεσι πᾶσι τοῖς τε βασιλεῦσι φανερὸν ἔσται ὅτι οὐκ εἰσὶ θεοὶ ἀλλὰ ἔργα χειρῶν ἀνθρώπων, καὶ οὐθὲν θεοῦ ἔργον ἐν αὐτοῖς ἐστίν.
