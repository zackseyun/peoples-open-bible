id: PSA.106.15
reference: Psalms 106:15
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לָ֭/הֶם שֶׁאֱלָתָ֑/ם וַ/יְשַׁלַּ֖ח רָז֣וֹן בְּ/נַפְשָֽׁ/ם׃
translation:
  text: So he gave them what they asked for, but sent a wasting disease among them[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “sent leanness into their soul”; “soul” can refer to their life or living selves.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  chosen: he gave
  alternatives:
  - he granted
  lexicon: HALOT
  rationale: The waw-consecutive verb from נתן straightforwardly means 'and/he gave.' 'Gave' is the most direct rendering; 'granted' is possible in context but slightly more interpretive.
- source_word: לָהֶם
  chosen: them
  rationale: Indirect object pronoun, naturally rendered 'them' in English.
- source_word: שֶׁאֱלָתָם
  chosen: what they asked for
  alternatives:
  - their request
  - their desire
  lexicon: HALOT
  rationale: From שאלה, 'request, thing asked.' English idiom prefers 'what they asked for' after 'he gave them,' though 'their request' is also possible. This balances clarity and fidelity.
- source_word: וַיְשַׁלַּח
  chosen: but sent
  alternatives:
  - and sent
  lexicon: HALOT
  rationale: 'Literally ''and he sent.'' In context the second clause is adversative in sense: God granted the request, yet also sent judgment. Rendering ''but sent'' brings out the Hebrew narrative contrast without over-paraphrasing.'
- source_word: רָזוֹן
  chosen: wasting
  alternatives:
  - wasting disease
  - emaciation
  - weakness
  lexicon: HALOT
  rationale: The noun denotes leanness or a wasting condition; “wasting” is clear without diagnosing a particular disease.
- source_word: בְּנַפְשָׁם
  chosen: into their lives
  alternatives:
  - among them
  - into their lives
  - into their very being
  lexicon: HALOT
  rationale: Here nephesh denotes the affected persons’ life or living selves rather than distinctly an immaterial soul.
