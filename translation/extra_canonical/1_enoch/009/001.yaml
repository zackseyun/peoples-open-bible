translation:
  text: Then Michael, Uriel, Raphael, and Gabriel looked down from heaven and saw much blood being poured out upon the earth,
    and all the lawlessness being committed upon the earth.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “looked out from heaven.” The rendering “looked down” expresses the implied direction of their gaze toward the
      earth.
    reason: lexical_alternative
  - marker: b
    text: Or “all the violence” or “all the injustice.” The Ge'ez term covers wrongful violation of moral and social order.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእሜሃ (wa-ʾəmēhā)
  chosen: Then
  alternatives:
  - And then
  - At that time
  rationale: The expression advances the narrative to the angels’ response. “Then” is natural modern English; the initial
    conjunction is represented by the verse’s narrative continuity rather than mechanically rendered.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ሐወጹ (ḥawwaṣu)
  chosen: looked down
  alternatives:
  - looked out
  - looked forth
  rationale: The verb describes the four angels directing their gaze from heaven toward events on earth. “Looked down” makes
    the spatial relation explicit without weakening the visionary image, though “looked out” is a more formally cautious alternative.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ደመ (dama)
  chosen: blood
  rationale: 'The singular noun is collective here: the angels see a great quantity of blood rather than multiple individually
    counted instances.'
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዘይትከዓው (za-yətkaʿaw)
  chosen: being poured out
  alternatives:
  - being shed
  - flowing
  rationale: The passive verbal form presents blood as being poured out. This preserves the concrete image more directly than
    the conventional idiom “bloodshed.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዓመፃ (ʿamaṣā)
  chosen: lawlessness
  alternatives:
  - violence
  - injustice
  - wrongdoing
  rationale: The term can denote violent wrong, injustice, or rebellion against right order. “Lawlessness” preserves its broad
    moral and social scope alongside the immediately preceding image of spilled blood.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዘይትገበር (za-yətgabbār)
  chosen: being committed
  alternatives:
  - being done
  - being carried out
  rationale: With “lawlessness,” idiomatic English uses “committed.” The passive construction is retained, leaving the perpetrators
    unstated as in the witness.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
