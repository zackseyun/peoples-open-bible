translation:
  text: But since the young man would not listen at all, the king called his mother to him and urged her to counsel her son so that his life might be spared.
  philosophy: dynamic
lexical_decisions:
- source_word: τοῦ ... νεανίου
  chosen: the young man
  alternatives:
  - the youth
  - the young fellow
  lexicon: LSJ
  rationale: νεανίας/νεανίου denotes a young man or youth. 'Young man' is natural modern English and fits the narrative context of the mother's son.
- source_word: μηδαμῶς προσέχοντος
  chosen: was paying no attention at all
  alternatives:
  - was not listening at all
  - was giving no heed whatsoever
  lexicon: LSJ
  rationale: The participial phrase conveys complete refusal to heed what has been said. 'Paying no attention at all' preserves the emphatic μηδαμῶς while remaining idiomatic.
- source_word: προσκαλεσάμενος
  chosen: called ... to him
  alternatives:
  - summoned
  - called for
  lexicon: LSJ
  rationale: The middle participle indicates the king had the mother brought/called into his presence. 'Called ... to him' captures the relational force without overformalizing.
- source_word: παρῄνει
  chosen: urged
  alternatives:
  - encouraged
  - exhorted
  - advised
  lexicon: LSJ
  rationale: παραινέω commonly means to urge, exhort, or advise. 'Urged' best reflects the king's persuasive pressure in context.
- source_word: γενέσθαι ... σύμβουλον
  chosen: to become an adviser
  alternatives:
  - to act as a counselor
  - to give counsel
  lexicon: LSJ
  rationale: The infinitive plus predicate noun expresses becoming/serving as a counselor. 'Become an adviser' is clear and close to the Greek structure.
- source_word: τοῦ μειρακίου
  chosen: to the youth
  alternatives:
  - to the boy
  - to her son
  lexicon: LSJ
  rationale: μειράκιον refers to a youth or young person. 'To the youth' preserves the lexical distinction from νεανίου while remaining natural; 'her son' would import information not stated in this phrase.
- source_word: ἐπὶ σωτηρία
  chosen: for his preservation
  alternatives:
  - for his safety
  - for his deliverance
  - for his salvation
  lexicon: LSJ
  rationale: σωτηρία can denote rescue, preservation, safety, or salvation. In this immediate context the king wants the young man spared from execution if he complies, so 'for his preservation' best conveys practical deliverance without importing later theological overtones.
