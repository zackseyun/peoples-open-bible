    they walked in the uprightness of the Lord[k] and accomplished his commandments[l].”


    V.4. “And the ones being brought and set into the building—who are they?” “They are new in the faith
    and faithful[m]. But they are being admonished[n] by the angels to do good, because evil was found
    in them[u].”


    V.5. “And those whom they were casting away and throwing aside[o]—who are they?” “These are people
    who have sinned and want to repent[p][t]. For this reason they were not flung far away outside the
    tower, because they will be useful for the building[q], if they repent. Therefore those who are going
    to repent—if they repent—will be strong in the faith, if they repent now, while the tower is being
    built[w]. But if the building is completed, they no longer have a place, but will be cast out[r].
    But they have only this: to lie beside the tower[s].”'
