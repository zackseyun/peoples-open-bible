  text: '1[3]. And Israel set out from Haran, from his house, on the new moon of the third month, and he went by the way of the Well of the Oath, and he offered a sacrifice to the God of his father Isaac on the seventh of this month.

    2. And Jacob remembered the dream that he had seen at Bethel, and he feared to go down into Egypt.

    3. And while he was thinking of sending word to Joseph to come to him, and of not going down, he remained there seven days, to see a vision whether he should remain or whether he should go down. And he celebrated the feast of the firstfruits of the old grain, for in all the land of Canaan there was no handful of any seed in the land, because it had all become food for beasts and cattle and birds and also for men.

    4. And on the sixteenth the Lord appeared to him and said to him, “Jacob, Jacob.” And he said, “Here I am.”

    5. And he said to him, “I am the God of your father, the God of Abraham and Isaac. Do not fear; go down into Egypt, for there I will make you into a great nation.

    6[11]. I will go down with you, and I will surely bring you up again. And in this land you will be buried, and Joseph will place his hand on your eyes. Do not fear; go down into Egypt.”

    7. And his sons and the sons of his sons rose up, and they loaded their father and their possessions on wagons. And Israel set out from the Well of the Oath on the sixteenth of this third month, and he went to the land of Egypt.

    8. And Israel sent Judah before him to his son Joseph, so that he might prepare the land of Goshen, because there Joseph had told his brothers to come and dwell, so that they might be near him. And it was good in the land of Egypt, and near to him, for all of them and for their livestock.

    9. And these are the names of the sons of Jacob who went into Egypt with Jacob their father: Reuben, the firstborn of Israel; and these are the names of his sons: Enoch, Pallu, Hezron, and Carmi—four.

    10. Simeon and his sons; and these are the names of his sons: Jemuel, Jamin, Ohad, Jachin, Zohar, and Saul, the son of a Canaanite woman—six.

    11. Levi and his sons; and these are the names of his sons: Gershon, Kohath, and Merari—three.

    12. Judah and his sons; and these are the names of his sons: Shelah, Perez, and Zerah—three.

    13. Issachar and his sons; and these are the names of his sons: Tola, Puvah, Iashub, and Shimron—four.

    14. Zebulun and his sons; and these are the names of his sons: Sered, Elon, and Jahleel—three.

    15. These are the sons of Jacob and their sons, whom Leah bore to Jacob in Mesopotamia: six, and Dinah their sister, one. And all the persons of Leah’s sons and their sons who came with Jacob their father into Egypt were thirty-three; and with Jacob their father among them, they were thirty-four.

    16. And the sons of Zilpah, Leah’s maidservant, whom she bore to Jacob: Gad and Asher. And these are the names of their sons who came with him into Egypt. The sons of Gad: Ziphion, Haggi, Shuni, Ezbon, Eri, Arodi, and Areli—seven.

    17. And the sons of Asher: Imnah, Ishvah, Beriah, and Serah their sister—four. All the persons were sixteen, and all Leah’s line was forty-nine.

    18. And the sons of Rachel, Jacob’s wife: Joseph and Benjamin.

    19. And sons were born to Joseph in Egypt before his father entered Egypt, whom Asenath, the daughter of Potiphar, priest of Heliopolis, bore to him: Manasseh and Ephraim—two.

    20. And the sons of Benjamin: Bela, Becher, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim, and Ard—ten.

    21. And all the persons of Rachel were fourteen.

    22. And the sons of Bilhah, Rachel’s maidservant, whom she bore to Jacob: Dan and Naphtali.

    23. And these are the names of their sons who came with them into Egypt. And the sons of Dan: Hushim, Samon, Asudi, Iaka, and Solomon—five.

    24. And they died in the year in which they entered Egypt, and Hushim alone was left to Dan.

    25. And these are the names of the sons of Naphtali: Jahziel, Guni, Jezer, Shallum, and Iv.

    26. And Iv also died in Egypt after the year of the famine. And all the persons of Rachel were twenty-six.

    27. And all the persons of Jacob who entered Egypt were seventy persons. These are his sons and the sons of his sons, all of them seventy-five,

    28. five of whom died in Egypt, not counting Joseph and his two sons. And in the land of Canaan the two sons of Judah, Er and Onan, died, and they had no children.

    29. And the sons of Israel buried those who had been struck down[27][25][23][16], and they were reckoned within the seventy persons.'
  footnotes:
  - marker: '3'
    text: The verse is textually difficult in the transmitted Ge'ez. The sense appears to be that Jacob waited seven days for a confirming vision and observed a firstfruits festival using old grain because the famine had consumed fresh produce.
    reason: textual_variant
  - marker: '11'
    text: The Ge'ez numeral appears confused in this row; the listed names are three sons of Levi, though one manuscript tradition may have a corrupted total.
    reason: textual_variant
  - marker: '16'
    text: One name in Gad's list is partially obscured in the supplied row segmentation; the translation follows the most likely sequence known from the Ge'ez/Genesis tradition.
    reason: segmentation_note
  - marker: '23'
    text: Dan's sons differ from the more familiar Genesis list. Jubilees here preserves an expanded tradition in which several sons are named, though most die in Egypt the same year.
    reason: cross_reference
  - marker: '25'
    text: The final name in Naphtali's list is uncertain in the Ge'ez row and may reflect a shortened or corrupted form.
    reason: textual_variant
  - marker: '27'
    text: 'The chapter''s arithmetic is deliberate but not straightforward: it speaks of seventy entering Egypt, then seventy-five including descendants, and then explains that five died in Egypt, while Joseph and his two sons are excluded from that death notice.'
    reason: cross_reference
translation:
  language: ko
  text: '1. 이스라엘은 셋째 달 초하루에 하란의 자기 집에서 떠나 맹세의 우물 길로 갔습니다. 그리고 이 달 칠일에 자기 아버지 이삭의 하나님께 제사를 드렸습니다.

    2. 야곱은 벧엘에서 보았던 꿈을 기억하고, 이집트로 내려가기를 두려워했습니다.

    3. 그가 요셉에게 사람을 보내어 자기에게 오게 하고, 자신은 내려가지 않으려고 생각하는 동안, 그는 거기서 칠 일 동안 머물며 환상을 통해 자신이 머물러야 할지 내려가야 할지를 알아보려고 하였습니다. 그리고 그는 묵은 곡식의 첫 열매를 거두는 추수 절기를 지켰습니다. 이는 가나안 온 땅에 땅에 뿌릴 어떤 씨앗도 한 움큼조차 없었고, 기근이 모든 짐승과 가축과 새와 사람들에게 미쳤기 때문입니다.

    4. 그리고 십육일에 주님께서 그에게 나타나셔서 말씀하셨습니다. “야곱아, 야곱아.” 그가 말했습니다. “제가 여기 있습니다.”

    5. 또 그에게 말씀하셨습니다. “나는 네 조상들의 하나님, 곧 아브라함과 이삭의 하나님이다. 두려워하지 마십시오. 애굽으로 내려가십시오. 내가 거기서 당신을 큰 민족으로 만들겠습니다.”

    6. 내가 너와 함께 내려가겠고 반드시 너를 다시 일으키리라. 그리고 네가 이 땅에 장사되고 요셉이 네 눈에 손을 얹을 것이다. 두려워하지 마십시오. 이집트로 내려가거라.”

    7. 그의 아들들과 손자들이 일어나 그들의 아버지와 그들의 소유물을 수레에 실었습니다. 이스라엘은 이 셋째 달 십육일에 맹세의 우물에서 떠나 이집트 땅으로 갔습니다.

    8. 이스라엘은 자기 아들 요셉에게 유다를 앞서 보내어 고센 땅을 살펴보게 하였습니다. 그곳에서 요셉이 자기 형제들에게 와서 거주하여 자기 가까이에 살도록 말하였기 때문입니다. 그곳은 이집트 땅에서 가장 좋은 곳이었으며, 그들 모두와 그들의 가축이 요셉 가까이에 머물기에 가까운 곳이었습니다.

    9. 그들의 아버지 야곱과 함께 애굽으로 내려간 야곱의 아들들의 이름은 이러합니다. 이스라엘의 장자 르우벤과 그의 아들들의 이름은 하녹, 발루, 헤스론, 갈미, 이렇게 네 사람입니다.

    10. 시므온과 그의 아들들의 이름은 이러합니다. 여무엘, 야민, 오핫, 야긴, 소할, 그리고 가나안 여인에게서 난 사울, 모두 여섯 명입니다.

    11. 레위와 그의 아들들입니다. 그의 아들들의 이름은 게르손, 고핫, 므라리, 곧 세 사람입니다.

    12. 유다와 그의 아들들이며, 그 아들들의 이름은 이러하니 셀라와 베레스와 세라, 세 사람입니다.

    13. 잇사갈과 그의 아들들이며, 그의 아들들의 이름은 이러합니다. 돌라와 부아와 야숩과 시므론, 네 명입니다.

    14. 스불론과 그의 아들들이며, 그의 아들들의 이름은 이러하니 세렛과 엘론과 야흘르엘, 곧 세 사람입니다.

    15. 이들은 메소포타미아에서 레아가 야곱에게 낳은 아들들과 그들의 아들들입니다. 아들은 여섯 명이고, 그들의 누이 디나는 한 명입니다. 야곱 그들의 아버지와 함께 이집트로 온 레아의 아들들과 그들의 아들들은 모두 삼십삼 명이었습니다. 그들의 아버지 야곱을 그들 가운데 포함하면 모두 삼십사 명이었습니다.

    16. 그리고 레아의 여종 실바가 야곱에게 낳은 아들들은 갓과 아셀입니다. 야곱과 함께 이집트로 들어간 그들의 아들들의 이름은 이러합니다. 갓의 아들들은 시브온, 학기, 수니, 에스본, 에리, 아로디, 아렐리, 곧 일곱 명입니다.

    17. 아셀의 아들들은 임나, 이스와, 브리아였고, 그들의 누이는 세라였습니다. 모두 네 명이었습니다. 사람은 모두 열여섯 명이었고, 레아 쪽의 사람은 모두 마흔아홉 명이었습니다.

    18. 야곱의 아내 라헬의 아들들은 요셉과 베냐민입니다.

    19. 요셉의 아버지가 애굽에 오기 전에, 애굽에서 요셉에게 아들들이 태어났습니다. 헬리오폴리스 제사장 보디발의 딸 아스낫이 그에게 낳은 아들들은 므낫세와 에브라임, 곧 둘이었습니다.

    20. 베냐민의 아들은 벨라와 베골과 아스벨과 게라와 나아만과 에히와 로스와 뭅빔과 훔빔과 아릇, 열 명입니다.

    21. 라헬에게 속한 사람은 모두 열네 명이었습니다.

    22. 라헬의 여자 노예인 빌하가 야곱에게 낳은 아들들은 단과 납달리입니다.

    23. 단의 아들들은 후심, 사몬, 아수디, 이아카, 솔로몬, 다섯 명입니다.

    24. 그들은 이집트에 들어간 해에 죽었고, 단에게는 후심만 남았습니다.

    25. 납달리 아들들의 이름은 야스엘, 구니, 예셀, 살룸, 이브입니다.

    26. 열한 명입니다. 라헬에게 속한 모든 사람은 열네 명이었습니다. 그리고 라헬의 여종 빌하의 아들들은:

    27. 야곱의 식구들 가운데 이집트에 들어간 사람은 모두 칠십 명이었습니다. 이들은 그의 아들들과 그의 아들들의 아들들로서, 모두 칠십오 명이었습니다.

    28. [이들은 야곱의 아내 라헬의 여종 빌하가 야곱에게 낳은 아들들의 이름입니다. 곧 단과 납달리입니다.] 그리고 이들은 그들과 함께 이집트로 들어간 그들의 자녀들의 이름입니다. 단의 아들들은 후심과 사몬입니다.

    29. 아수디와 이약과 솔로몬까지 모두 여섯 명이었습니다. 그들은 이집트에 들어간 그 해에 죽었고, 다니에게는 남아 있었습니다.'
