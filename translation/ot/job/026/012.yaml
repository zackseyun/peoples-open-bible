  from: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
  to: By his power he stirred up the sea, and by his understanding he shattered Rahab[a].
  rationale: With the sea as object, the Hiphil of רָגַע is well supported as causing the sea to surge or roar (cf. Isaiah 51:15; Jeremiah 31:35), not as quieting it. “Stirred up” is an appropriately natural rendering. The Rahab explanatory note belongs with “Rahab,” not “sea.”
