  lexicon: προτρέπω
  rationale: 단순한 설득보다 목표를 향해 강하게 밀어붙이는 뉘앙스를 살리되, 부정적 뉘앙스가 과도한 ‘부추기다’는 피했습니다.
- source_word: τὸν τῆς εὐσεβείας θάνατον
