  from: they will come in fear
  to: they will turn in dread
  rationale: The current rendering of the two clauses results in the repetition of 'come' ('come trembling' and 'come in fear'), a word supplied by the translator in both cases for dynamic effect. While effective, this repetition is slightly awkward. Translating אֶל...יִפְחָדוּ as 'they will turn in dread to...' avoids this, maintains the directional sense of 'אֶל', and uses a distinct synonym ('dread' for פחד) that contrasts well with 'be afraid' (for ירא) in the final clause.
