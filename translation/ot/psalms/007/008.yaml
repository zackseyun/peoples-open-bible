theological_decisions:
- issue: Whether the psalmist's claim to righteousness/integrity should be rendered in a way that implies absolute sinlessness
  chosen_reading: Retain the first-person claim straightforwardly as a situational appeal to righteousness and integrity
  alternative_readings:
  - Paraphrase as 'relative innocence' or 'just cause' in the main text
  rationale: The Hebrew explicitly states 'my righteousness' and 'my integrity.' The translation preserves this theological tension rather than softening it, while the lexical choice 'integrity' helps avoid implying perfection beyond what the text itself states.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
revisions:
- timestamp: '2026-04-21T00:21:44Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/007/009.json
  category: awkward_english
  tier: 1
  from: that is upon me
  to: that is in me
  rationale: While 'upon me' is a literal translation of 'עָלָי', it is unidiomatic in English when describing an internal quality like 'integrity', creating an awkward phrase. 'That is in me' is a more natural English equivalent used by several major translations (e.g., ESV, NASB, KJV). It better conveys the sense of an inherent characteristic while remaining faithful to the Hebrew meaning that this integrity pertains to the psalmist.
- timestamp: '2026-04-23T11:23:49Z'
  adjudicator: azure-gpt-5.4-revision-pass
  reviewer_model: gpt-5.4
  category: revision_pass
  from: The LORD judges the peoples; judge me, O LORD, according to my righteousness and according to my integrity that is in me.
  to: The LORD judges the peoples; judge me, O LORD, according to my righteousness and according to my integrity that is upon me.
  rationale: Changed 'that is in me' to 'that is upon me' to more closely reflect עָלַי ('upon me'). Kept the rest unchanged as accurate and natural enough for a formal translation.
- timestamp: '2026-08-28T22:04:02Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: awkward_english
  tier: 1
  from: Yahweh judges the peoples[a]; judge me, O Yahweh[b], according to my righteousness and according to my integrity that is upon me.
  to: Yahweh judges the peoples; judge me, O Yahweh[a], according to my righteousness and to the integrity that is in me[b].
  rationale: “Integrity that is upon me” is unnatural gloss-English in this context. “That is in me” is a natural English expression of the integrity pertaining to the speaker and does not introduce a different quality. The proposed “within me” is possible, but is slightly more inwardly psychologizing than needed; “in me” is the smaller correction. The proposal correctly relocates the notes to the expressions they explain.
- timestamp: '2026-11-09T18:37:05Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: Yahweh judges the peoples; judge me, O Yahweh[a], according to my righteousness and to the integrity that is in me[b].
  to: Yahweh judges the peoples; vindicate me[a], O Yahweh, according to my righteousness and my integrity.
  rationale: The later revisions correctly rejected 'integrity that is upon me' as misleading English; the concise possessive retains their meaning-based gain. The existing note already recognizes the vindicatory force of 'judge me,' which is now carried in the main text without weakening David’s claim to righteousness.
