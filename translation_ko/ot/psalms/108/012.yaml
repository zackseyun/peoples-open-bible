lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Have you not
  chosen_korean: …했습니까?
  alternatives_korean:
  - …하지 않으셨습니까?
  - 정녕 …하지 않으셨습니까?
  lexicon: HALOT
  rationale: 수사적 질문으로서의 반문을 살리기 위해 합쇼체 의문형으로 옮겼습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 하나님이여
  lexicon: HALOT
  rationale: 시편의 직접 호칭에서는 한국어 예배 문체에 맞게 ‘주님’으로 옮기되, 본문의 호격 기능을 유지했습니다.
- source_word: זְנַחְתָּנוּ
  english_pob_choice: rejected us
  chosen_korean: 우리를 버리셨습니까
  alternatives_korean:
  - 우리를 거절하셨습니까
  - 우리를 내치셨습니까
  - 우리를 내버리셨습니까
  lexicon: HALOT
  rationale: זנח의 강한 거절·버림의 의미를 살리되, 시편의 탄식 문맥에 자연스러운 표준어로 옮겼습니다.
- source_word: תֵצֵא ... בְּצִבְאֹתֵינוּ
  english_pob_choice: you do not go out with our armies
  chosen_korean: 우리 군대와 함께 나아가지 않으십니까
  alternatives_korean:
  - 우리 군대와 함께 나가지 않으십니까
  - 우리 군대와 함께 출전하지 않으십니까
  lexicon: HALOT
  rationale: תצא의 군사적 ‘나아가다/출전하다’ 뉘앙스를 반영해 단순 이동보다 전투 동행의 뜻이 드러나도록 했습니다.
theological_decisions:
- issue: 시편 탄식의 직접적 항의 어조
  chosen_reading: 하나님께서 자기 백성을 버리셨다는 탄식과, 군대와 함께 나아가지 않으신다는 불평을 그대로 드러냈습니다.
  alternative_readings:
  - ‘떠나셨습니까’처럼 완화하는 읽기
  - ‘함께 계시지 않습니까’처럼 관계적 거리로 바꾸는 읽기
  rationale: 히브리어 זנח와 전쟁 맥락은 언약적 거절의 강한 긴장을 포함하므로, 이를 완화하지 않고 탄식의 날카로움을 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 호칭의 한국어 예배 문체
  chosen_reading: אֱלֹהִים의 직접 호격은 합쇼체 기도·탄식 문체에 맞게 ‘주님’으로 표현했습니다.
  alternative_readings:
  - ‘하나님’
  - ‘오 하나님’
  rationale: 문맥상 단순 호칭이므로 한국어 독자가 탄식의 직접 호소를 자연스럽게 읽도록 예배적 호칭을 사용했습니다.
  doctrine_reference: Korean target style guideline
