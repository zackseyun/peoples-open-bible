  from: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
  to: King Cyrus of Persia had them brought out through Mithredath the treasurer and counted out to Sheshbazzar, the leader of Judah[a].
