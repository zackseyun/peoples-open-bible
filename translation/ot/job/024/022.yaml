    a: alternative_meaning
  history_weighed: The archive favors the oppressor as subject and “drags away,” but records conflicting judgments about the final clause. I adopt the established sustaining reading because the security granted in verse 23 and the common death in verse 24 better fit Job's complaint about the mighty's survival, while preserving the destructive reading in a note.
