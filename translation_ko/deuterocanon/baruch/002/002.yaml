translation:
  language: ko
  text: 그가 예루살렘에서 행하신 것과 같은 일은 온 하늘 아래 어디에서도 일어난 적이 없었습니다. 이는 모세의 율법에 기록된 대로였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐποιήθη / ἐποίησεν
  english_pob_choice: it had not been done / he did
  chosen_korean: 그런 일이 일어난 적이 없었으며
  alternatives_korean:
  - 그처럼 행해진 적이 없었으며
  - 그와 같은 일이 없었으며
  lexicon: ποιέω
  rationale: 영문 POB의 과거 완료·과거 구분을 자연스러운 한국어로 풀어, ‘어떤 일이 그렇게 행해진 적이 없다’는 비교적 서술을 살렸습니다.
- source_word: ὑποκάτω παντὸς τοῦ οὐρανοῦ
  english_pob_choice: under all heaven
  chosen_korean: 온 하늘 아래에서는
  alternatives_korean:
  - 온 천하에서
  - 하늘 아래 온 세상에서
  lexicon: ὑποκάτω / οὐρανός
  rationale: 직역적 구조를 유지하되 한국어 관용에 맞게 ‘온 하늘 아래’로 옮겨 비교의 범위를 분명히 했습니다.
- source_word: ἐν Ἰερουσαλήμ
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘 가운데서
  lexicon: Ἰερουσαλήμ
  rationale: 장소 부사구로 자연스럽게 옮겼습니다.
- source_word: ἐν τῷ νόμῳ Μωυσῆ
  english_pob_choice: in the law of Moses
  chosen_korean: 모세의 율법에 기록된 대로
  alternatives_korean:
  - 모세의 율법에 따라
  - 모세의 율법에 기록된 바대로
  lexicon: νόμος / Μωυσῆς
  rationale: 문맥상 단순한 ‘안에서’보다 기록된 규범을 가리키므로, 이미 뒤에 있는 ‘기록된’과 연결해 자연스럽게 풀었습니다.
theological_decisions:
- issue: 율법의 지시 방식
  chosen_reading: ‘모세의 율법에 기록된 대로’는 규범의 출처를 강조하는 번역으로, 단순한 법조문보다 하나님의 계시된 규정이라는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘모세의 율법 안에서’
  - ‘모세의 율법에 따라’
  rationale: 헬라어가 단순 위치가 아니라 문헌적 권위를 가리키므로, 한국어에서도 ‘기록된 대로’로 그 권위를 드러내는 것이 적절합니다.
  doctrine_reference: 율법의 계시성과 성문성
