id: JOB.17.5
reference: Job 17:5
source:
  edition: WLC
  text: לְ֭/חֵלֶק יַגִּ֣יד רֵעִ֑ים וְ/עֵינֵ֖י בָנָ֣י/ו תִּכְלֶֽנָה׃
translation:
  text: Whoever denounces friends for gain[a]—his children’s eyes will fail[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “for a share he reports friends.” The difficult clause appears to describe betrayal for personal gain.
    reason: lexical_alternative
  - marker: b
    text: Or “his children’s eyes will waste away with longing.”
    reason: alternative_reading
lexical_decisions:
- source_word: לְחֵלֶק
  chosen: for a share
  alternatives:
  - for a portion
  - for gain
  - for flattery
  lexicon: HALOT
  rationale: Keeps the core sense “share/portion” without adding “spoil.”
- source_word: יַגִּיד
  chosen: informs against
  alternatives:
  - tells
  - betrays
  - accuses
  lexicon: HALOT
  rationale: The Hiphil of נגד means 'declare, tell, make known.' In context with 'friends' and the mercenary phrase לְחֵלֶק, the sense is not neutral reporting but exposing or betraying them. 'Informs against' preserves the denunciatory force without overcommitting to a narrower legal setting.
- source_word: רֵעִים
  chosen: friends
  alternatives:
  - companions
  - associates
  lexicon: HALOT
  rationale: רֵעִים ordinarily means 'friends' or 'companions.' 'Friends' best conveys the relational betrayal implied by the verse.
- source_word: וְעֵינֵי בָנָיו
  chosen: the eyes of his children
  alternatives:
  - his sons' eyes
  lexicon: HALOT
  rationale: בנים can mean 'sons' specifically or 'children' more broadly. In English, 'children' is natural and does not materially alter the sense here. The construct phrase is rendered straightforwardly.
- source_word: תִּכְלֶנָה
  chosen: will fail
  alternatives:
  - will waste away
  - will grow dim
  - will pine away
  lexicon: HALOT
  rationale: כלה in this form can denote coming to an end, wasting away, or failing. With 'eyes' as subject, 'will fail' is idiomatic English and preserves the image of eyes wasting away or growing dim from deprivation or judgment.
- source_word: יַגִּיד רֵעִים
  chosen: One who denounces friends
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The generic subject makes the Hebrew singular construction coherent in English; “denounces” is contextual and its less specific lexical sense is disclosed in the note.
