  from: I will open my mouth in a parable[a][b][c][d]; I will utter riddles from of old.
  to: I will open my mouth with a saying[a]; I will utter riddles from ancient times.
  rationale: “From of old” is ungrammatical in the current text, and “from ancient times” is a natural rendering. “Saying” appropriately avoids prematurely limiting מָשָׁל to the genre “parable.” Retain one note for the real lexical breadth of מָשָׁל, but do not offer ungrammatical “from of old” as an alternative; “of old” would be the idiomatic alternative.
