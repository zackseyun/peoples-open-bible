translation_notes:
  source_alignment_notes: The translation carefully respects the Greek verb tenses and specialized terms. The perfect tense of ἤγγικεν is preserved through the phrase 'has come near' and clarified in footnote [a]. The distinctive Matthean phrase 'kingdom of heaven' is preserved and contextualized in footnote [b].
  readability_notes:
  - By converting 'From that time' to 'From that time on' and removing the redundant 'saying', the verse reads much more naturally to modern English speakers without sacrificing its solemn, scriptural tone.
  compression_notes:
  - The only semantic compression is the omission of the verbal participle 'saying' (λέγειν), which is grammatically redundant in English when introducing a direct quote after 'proclaim'. No theological content or nuances were lost.
  risk_flags:
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
