  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
  to: “For the king will listen and deliver his servant from the power of the man who would destroy me and my son together, cutting us off from God’s inheritance[a].”
  rationale: The lexical discussion already recognizes responsive hearing, power expressed by “hand,” and the threatened loss of a place within Israel’s inheritance. I express those relationships naturally while retaining the weighty term “inheritance” and avoiding a reduction to private property alone.
