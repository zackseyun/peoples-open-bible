  text: They will put on sackcloth, and horror will cover them; shame will be on every face, and baldness on all their heads.
translation:
  language: ko
  text: 그들은 굵은 베옷을 두르고, 공포가 그들을 덮을 것이며, 모든 얼굴에는 수치가 있고, 그들의 모든 머리는 대머리가 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָגְרוּ שַׂקִּים
  english_pob_choice: They will put on sackcloth
  chosen_korean: 굵은 베옷을 입을 것입니다
  alternatives_korean:
  - 삼베옷을 입을 것입니다
  - 베옷을 두를 것입니다
  lexicon: שַׂקִּים
  rationale: 맹렬한 애도와 굴욕의 상징인 sackcloth를 현대 한국어에서 가장 자연스럽게 드러내기 위해 ‘굵은 베옷’을 선택했습니다.
- source_word: פַּלָּצוּת
  english_pob_choice: horror
  chosen_korean: 두려움
  alternatives_korean:
  - 공포
  - 전율
  lexicon: פַּלָּצוּת
  rationale: 본문의 엄습하는 공포 상태를 살리되, 문맥상 지나치게 심리적·추상적으로 흐르지 않도록 ‘두려움’으로 옮겼습니다.
- source_word: בּוּשָׁה
  english_pob_choice: shame
  chosen_korean: 수치
  alternatives_korean:
  - 부끄러움
  - 치욕
  lexicon: בּוּשָׁה
  rationale: 얼굴에 드러나는 공개적 수치를 가리키므로 개인 감정보다 강한 ‘수치’가 문맥에 더 가깝습니다.
- source_word: קָרְחָה
  english_pob_choice: baldness
  chosen_korean: 대머리
  alternatives_korean:
  - 벗어진 머리
  - 삭발
  lexicon: קָרְחָה
  rationale: 머리의 탈모 상태를 직접적으로 보여 주는 표현을 택해, 심판 아래의 외형적 쇠락을 분명히 했습니다.
theological_decisions:
- issue: 심판 장면의 정서 강도
  chosen_reading: ‘두려움’으로 옮겨 본문의 압박감과 심판의 위협을 유지했습니다.
  alternative_readings:
  - ‘공포’로 더 강하게 번역
  - ‘전율’로 더 문학적으로 번역
  rationale: 히브리어 פַּלָּצוּת는 단순한 감정명사보다 덮쳐 오는 भय/공포의 상태를 가리키므로, 지나친 문학화 없이도 심판의 무게를 드러내는 번역이 적절합니다.
  doctrine_reference: 예언서 심판 선언의 가시성과 경고성
