translation:
  language: en
  text: 'But some people deny Him because they do not understand. Or rather, He has denied them. They defend death instead of the truth. They have not been convinced by the prophets, the law of Moses, or even the Gospel up to this very hour. Nor have they been convinced by the suffering each of us has endured, for they think the same way about us as they do about Him.


    What good does it do me if someone praises me but blasphemes my Lord by refusing to confess that He truly had human flesh? Anyone who refuses to affirm this denies Him completely, while carrying around a corpse himself.


    Because they are unbelievers, I have chosen not to write down their names. Far be it from me even to remember them until they repent[a] and return to Christ’s suffering, which is our resurrection.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in these appeals to reconciliation and ecclesial unity; keep distinct return expressions and the authors own claims about the bishop.
    reason: lexical_alternative
