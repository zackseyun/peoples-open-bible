source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ עַֽל הַ/גִּתִּ֗ית מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/001.yaml
  text: O Yahweh[a], our Lord, how majestic[b] is your name in all the earth—you have set your splendor[c] above the heavens.
  footnotes:
  - marker: a
    text: Hebrew Gittith; probably a musical or liturgical term, perhaps the name of a tune or instrument.
    reason: cultural_note
  - marker: b
    text: Or 'by David' or 'for David.' The Hebrew 'of David' can indicate authorship or association.
    reason: alternative_reading
  - marker: c
    text: 'Or ''For the choir director: according to The Gittith. A psalm of David.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 야훼[a], 우리의 주님, 온 땅에서 주의 이름이 어찌 그리 위엄 있는지요![b] 주께서 주의 영광을 하늘 위에 두셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 YHWH(יהוה)입니다. 전통적으로 ‘주’ 또는 ‘여호와’로도 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘온 땅에서 주의 이름이 어찌 그리 탁월한지요!’
    reason: lexical_alternative
  - marker: c
    text: 히브리어 본문의 ‘두셨습니다’에 해당하는 동사는 마소라 모음상 명령형처럼 보이는 난해한 형태입니다. 문맥과 통상적 해석에 따라 ‘주의 영광을 하늘 위에 두셨습니다’로 옮겼습니다. ‘영광’은 ‘위엄’ 또는 ‘광채’로도 옮길 수 있습니다.
    reason: textual_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
