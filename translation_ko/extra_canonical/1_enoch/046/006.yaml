- source_word: ይመልኦሙ፡ ኃፍረተ፡ ወጽልመት፡
  english_pob_choice: he will fill them with shame; and darkness shall become their dwelling
  chosen_korean: 그들을 수치와 어둠으로 채우실 것입니다
  alternatives_korean:
