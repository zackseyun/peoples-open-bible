  rationale: כֵּן은 여기서 앞선 갈망과 현재의 회상을 잇는 부사로 쓰였으므로, 한국어에서는 자연스럽게 인과·결과를 잇는 ‘그러므로’가 적절합니다.
- source_word: בַּקֹּדֶשׁ
