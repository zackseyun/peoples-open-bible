translation:
  text: And from there I went above the summits of those mountains, far to the east, and I crossed over the Erythraean
    Sea[a]; and I went far from it[b], and passed above the angel Zutel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Erythraean Sea renders the selected printed proper name. This source proposal does not identify its exact
      modern coastline or silently replace it with a modern geographical boundary.
    reason: cultural_note
  - marker: b
    text: The selected edition encloses †ኅንኩ፡† in daggers. I went follows Charles’s explicitly printed repair ሖርኩ
      in printed page 72 note 12, compared there with Greek ὠχόμην. It is an editorially assisted rendering, not
      an unproblematic lexical translation of the daggered form; no letters are normalized in the selected source.
    reason: textual_variant
  - marker: c
    text: The selected Ethiopic has the angel noun and the name ዙጥኤል, rendered Zutel here. The English preserves
      passed above rather than supplying a new gate or journey destination. No different Greek name or reported
      omission of angel is adopted.
    reason: lexical_alternative
