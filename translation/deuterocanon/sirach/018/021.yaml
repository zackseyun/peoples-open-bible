translation:
  text: Before you become sick[a], humble yourself, and in the time of sins show a turning back[r1].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or "show your return." Greek epistrophe denotes a turning back; the immediate reference to sins gives this movement its moral context.
    reason: lexical_alternative
  - marker: r1
    text: Earlier reader wording used a form of "repent." The source uses a turning/return expression rather than the metanoia word family; render that movement transparently rather than homogenize distinct words.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν
  chosen: Before
  alternatives:
  - ere
  - prior to
  lexicon: LSJ
  rationale: Temporal marker introducing an action to be taken in advance of what follows.
- source_word: ἀρρωστῆσαί
  lemma: ἀρρωστέω
  chosen: become sick
  alternatives:
  - fall ill
  - be weak
  lexicon: LSJ
  rationale: Aorist infinitive from ἀρρωστέω, referring to becoming ill or infirm. 'Become sick' is natural modern English and preserves the ingressive sense better than simply 'be sick.'
- source_word: σε
  chosen: you
  lexicon: Greek grammar
  rationale: Object of the infinitive; in English the clause is naturally rendered with 'you' as subject of 'become sick.'
- source_word: ταπεινώθητι
  chosen: humble yourself
  alternatives:
  - be humbled
  - submit yourself
  lexicon: LSJ
  rationale: Aorist passive imperative of ταπεινόω, often functioning with reflexive force in exhortation. 'Humble yourself' best conveys the ethical command in idiomatic English without implying merely external humiliation.
- source_word: ἐν καιρῷ
  chosen: at the time of
  alternatives:
  - in the time of
  - when
  lexicon: LSJ
  rationale: καιρός denotes an appointed or fitting time. 'At the time of' keeps the temporal nuance while remaining readable.
- source_word: ἁμαρτημάτων
  chosen: sins
  alternatives:
  - sin
  - transgressions
  lexicon: LSJ
  rationale: Plural genitive is best preserved as 'sins,' referring to occasions or acts of sin rather than an abstract principle.
- source_word: δεῖξον
  chosen: show
  alternatives:
  - display
  - make evident
  lexicon: LSJ
  rationale: Aorist imperative of δείκνυμι. 'Show' is the straightforward rendering and leaves the object to define what is manifested.
- source_word: ἐπιστροφήν
  chosen: turning back
  alternatives:
  - repentance
  - turning back
  - conversion
  - return
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: The source uses a turning/return expression rather than the metanoia word family; render that movement transparently rather than homogenize distinct words. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
