revisions:
- from: 주님, 우리 조상들은 주님을 신뢰하였습니다. 그들은 신뢰하였고, 주님께서는 그들을 구원하셨습니다.[a]
  to: 그들은 주님께 부르짖어 구출되었고, 주님을 신뢰하여 수치를 당하지 않았습니다.
  rationale: 원문의 두 병행 연쇄, 곧 ‘주님께 부르짖음—구출됨’과 ‘주님을 신뢰함—수치를 당하지 않음’을 순서대로 복원했습니다. נִמְלָטוּ는 문맥상 하나님의 응답을 암시하지만, 한국어 수동형 ‘구출되었고’로 원문의 직접적 행위자 비명시성을 유지했습니다. בֹשׁוּ는 단순한 내적 감정보다 신뢰가 헛되어 겪게 될 불명예의 의미를 포함할 수 있으므로 ‘수치를 당하지 않았습니다’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
