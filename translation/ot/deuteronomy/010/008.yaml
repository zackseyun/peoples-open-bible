  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Cultic role of Levi in לַעֲמֹד ... לְשָׁרְתוֹ
  chosen_reading: to stand before the LORD to minister to him
  alternative_readings:
  - to stand before the LORD to serve him
  rationale: The verse describes sacred Levitical appointment. 'Minister' preserves the religious-service nuance without importing later denominational priestly structures beyond the text.
