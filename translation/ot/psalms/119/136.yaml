id: PSA.119.136
reference: Psalms 119:136
source:
  edition: WLC
  text: פַּלְגֵי מַ֭יִם יָרְד֣וּ עֵינָ֑/י עַ֝֗ל לֹא שָׁמְר֥וּ תוֹרָתֶֽ/ךָ־־׃
translation:
  text: Streams of tears flow from my eyes because people do not keep your law.
  philosophy: dynamic
lexical_decisions:
- source_word: תוֹרָתֶֽךָ
  chosen: law
  alternatives:
  - instruction
  - teaching
  lexicon: HALOT
  rationale: תּוֹרָה is God's revealed instruction. 'Law' is the established English gloss and is kept consistent across the psalm's eight terms for God's word; 'instruction/teaching' preserved as alternatives.
- source_word: פַּלְגֵי מַיִם
  chosen: streams of water
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The Hebrew explicitly retains the water image rather than naming tears.
- source_word: עֵינָי
  chosen: from my eyes
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English marks the eyes as the source of the descending streams.
- source_word: לֹא שָׁמְרוּ
  chosen: people do not keep
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The unexpressed plural is generic here; “people” avoids an antecedentless English pronoun while not specifying a particular group.
