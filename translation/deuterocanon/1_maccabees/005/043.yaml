  meaning_decisions:
  - source_phrase: διεπέρασεν πρὸς αὐτοὺς πρότερον
    prior_rendering: he crossed over to them first
    new_rendering: Judas took the initiative by crossing over to attack them
    rationale: In light of Timothy's warning, 'first' concerns which side initiates the crossing, not Judas preceding his own soldiers.
  - source_phrase: πᾶς ὁ λαὸς αὐτοῦ ἔμπροσθεν αὐτοῦ
    prior_rendering: all his people were before him
    new_rendering: all his men advancing ahead of him
    rationale: The phrase describes the position of his fighting force during the advance, not people standing in his presence.
  - source_phrase: πάντα τὰ ἔθνη
    prior_rendering: all the nations
    new_rendering: All the forces of the nations
    rationale: The defeated and fleeing parties are the nations' assembled troops, not every inhabitant of those nations.
  - source_phrase: τὸ τέμενος
    prior_rendering: the sanctuary
    new_rendering: the temple precinct
    rationale: This identifies the sacred enclosure precisely and consistently with its burning in the next verse.
