  lexicon: HALOT
  rationale: 희귀어로서 정확한 세부 뉘앙스가 불확실하므로, 집결한 무리라는 넓은 의미를 살려 ‘무리 가운데’로 옮겼습니다.
theological_decisions:
- issue: 지배/통치보다 행진 인도에 초점을 둘지
  chosen_reading: 베냐민의 역할을 ‘그들을 이끌고 있고’로 옮겨 행진의 선두성에 초점을 두었습니다.
  alternative_readings:
  - 그들을 다스리고 있고
  - 그들 위에 군림하고 있고
  rationale: 시편 68편의 열방/지파 행렬 문맥에서는 정치적 지배보다 의식적 행진 선도라는 의미가 더 직접적으로 전달됩니다.
  doctrine_reference: 시편 68편의 시적 묘사와 문맥적 우선순위
- issue: 유다의 ‘رִגְמָתָם’의 불확실성 처리
  chosen_reading: 정확한 사전적 확정을 피하고 ‘그들의 무리 가운데’로 번역했습니다.
  alternative_readings:
  - 그들의 회사 가운데
  - 그들의 군중 가운데
  - 그들의 모임 가운데
  rationale: 원어의 희귀성과 의미 불확실성을 숨기지 않되, 본문이 분명히 말하는 집단성은 유지해야 합니다.
  doctrine_reference: 시적 어휘의 불확정성에 대한 본문 보존 원칙
