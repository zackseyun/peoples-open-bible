  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: lexical
  tier: 1
  from: They surrounded me like bees[a]; they went out like a fire among thorns. In the name of Yahweh[b], I surely cut them down.
  to: They surrounded me like bees; they were extinguished like a fire of thorns. In the name of Yahweh, I cut them off.
  rationale: With the enemies as grammatical subject, “went out” is misleading; דעך denotes being extinguished or dying out. “A fire of thorns” preserves the Hebrew construct relation better than “among thorns.” “Were extinguished” more directly retains the fire image than “died out.” As in vv. 10–12, “cut them off” is preferable, while “surely” overstates an uncertain analysis of כי.
