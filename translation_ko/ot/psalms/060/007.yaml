  lexicon: HALOT
  rationale: 목적/결과를 여는 קשר을 한국어에서 가장 자연스럽게 드러내되, 과도하게 설명적이지 않게 옮겼습니다.
- source_word: יְדִידֶיךָ
  english_pob_choice: your beloved ones
  chosen_korean: 주님의 사랑하는 자들
  alternatives_korean:
  - 주님의 사랑받는 이들
  - 주님의 प्रिय한 자들
  lexicon: HALOT
  rationale: 복수성과 친밀한 언약적 애정을 함께 살리기 위해 ‘사랑하는 자들’로 옮겼습니다.
- source_word: הוֹשִׁיעָה
  english_pob_choice: save
  chosen_korean: 구원하시고
  alternatives_korean:
  - 구원하소서
  - 건지시고
  lexicon: HALOT
  rationale: 시편의 간구 형식에 맞춰 구원 행위를 청하는 동사를 유지했고, 앞뒤 절과 병렬을 이루도록 연결했습니다.
- source_word: יְמִינְךָ
  english_pob_choice: with your right hand
  chosen_korean: 주님의 오른손으로
  alternatives_korean:
  - 주님의 오른손으로써
  - 주님의 오른손으로 말미암아
  lexicon: HALOT
  rationale: 하나님의 구원 권능을 나타내는 신체 이미지를 약화시키지 않고, 한국어에서 자연스러운 수단 표현으로 유지했습니다.
theological_decisions:
- issue: 마지막 청원의 인칭
  chosen_reading: 마지막 청원은 공동체적 1인칭 복수로 이해하여 ‘우리에게 응답하소서’로 번역했습니다.
  alternative_readings:
  - ‘내게 응답하소서’
  rationale: 제시된 마소라 형태와 POB 주석의 공동체적 읽기를 따라, 개인화하지 않고 시의 화자 공동체성을 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 하나님의 오른손 이미지
  chosen_reading: ‘오른손’ 이미지는 직역으로 유지했습니다.
  alternative_readings:
  - ‘능력으로’
  - ‘권능으로’
  rationale: 구원 능력을 비유적으로 드러내는 성서적 이미지이므로 추상화하지 않고 보존하는 것이 원문 의미에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §6
