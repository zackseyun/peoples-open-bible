translation:
  text: 'III.1. He showed me many trees without leaves. They seemed dry to me, for they were all alike.
    He says, “Do you see these trees?” I say, “Sir, I see that they are alike and dry.” He answers, “The
    trees you see are those who live in this age.”


    III.2. I say, “Sir, why do they seem dry and alike?” He says, “Neither the righteous nor the sinners
    can be seen for what they are in this age[a]. They are alike. For this age is winter for the righteous.
    They are not visible while living among sinners.”


    III.3. “In winter, trees that have lost their leaves are alike. You cannot see which are dry and which
    are living. In the same way, neither the righteous nor the sinners are apparent in this age. All are
    alike.”


    IV.1. He again showed me many trees. Some were sprouting and others were dry. He says, “Do you see
    these trees?” I say, “Sir, I see some sprouting and others dry.”


    IV.2. He says, “The sprouting trees are the righteous, who are about to live in the age to come. That
    age is summer for the righteous, but winter for sinners. When the Lord’s mercy shines forth, those
    who serve God will be made manifest, and all will be made manifest[b].”


    IV.3. “In summer, each tree’s fruits become visible and are recognized for what they are. In the same
    way, the fruits of the righteous will be visible. All will be known, flourishing in that age[c].”


    IV.4. “The nations and the sinners will be like the dry trees you saw. They will be dry and fruitless
    in that age. They will be burned up like wood and will be manifest[d], because their conduct was evil
    in their life. The sinners will be burned because they sinned and did not repent[e]. The nations will
    be burned because they did not know the one who created them.”


    IV.5. “So bear fruit, so that your fruit may be known in that summer. Keep away from many activities,
    and you will not go wrong in anything[f]. People who do many things also sin much. Their activities
    distract them, and they do not serve their own Lord at all.”


    IV.6. He says, “How can someone ask the Lord for anything and receive it while not serving the Lord?
    For[g] those who serve him will receive what they ask for. Those who do not serve the Lord will receive
    nothing.”


    IV.7. “If someone undertakes one activity, he can also serve the Lord. His mind will not be led astray
    from the Lord[h]. Instead, he will serve him with a pure mind.”


    IV.8. “If you do these things, you can bear fruit for the age to come. Whoever does these things will
    bear fruit[i].”'
