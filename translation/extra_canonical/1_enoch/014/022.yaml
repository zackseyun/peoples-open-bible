translation:
  text: Burning fire was around him, and a great fire stood before him. None of those
    around him could approach him; myriads upon myriads were before him, yet he sought
    no counsel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final words are marked uncertain in the supplied witness. Their wording
      is awkward; ‘counsel’ is taken as the object of ‘did not desire.’
    reason: alternative_reading
lexical_decisions:
- source_word: ዘይነድድ
  chosen: burning
  alternatives:
  - blazing
  rationale: Preserves the explicit image of fire in combustion without intensifying
    it beyond the witness.
- source_word: ትእልፊተ ትእልፊት
  chosen: myriads upon myriads
  alternatives:
  - ten thousand times ten thousand
  rationale: Retains the repeated, immense quantity without implying a precise headcount.
- source_word: ኢይፈቅድ … ምክር
  chosen: sought no counsel
  alternatives:
  - desired no counsel
  - needed no counselor
  rationale: The verb expresses willing or desiring, and ምክር is counsel; ‘needed no
    counselor’ would add a claim not stated this way in the supplied wording.
theological_decisions:
- issue: The figure's relation to counsel
  chosen_reading: He sought no counsel.
  alternative_readings:
  - He needed no counselor.
  rationale: The translation does not turn an uncertain expression about counsel into
    an explicit assertion of divine self-sufficiency.
