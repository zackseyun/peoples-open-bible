translation:
  language: en
  text: and have fallen away,[a] to bring them back again to reorientation toward God[c],[b] because they are crucifying the Son of God again for themselves and publicly shaming him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “have committed apostasy”; the word describes a serious falling away.
    reason: lexical_alternative
  - marker: b
    text: Or “while they are crucifying the Son of God again for themselves and publicly shaming him.”
    reason: alternative_reading
  - marker: c
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and having fallen away
  simplified_phrase: and have fallen away
  preserved_meaning: The same people described in the preceding verses have seriously turned away.
  reasoning_layer_used: POB lexical decision and dependent syntax
  rationale: The wording continues the earlier description without adding an unsupported sequence marker.
- pob_phrase: exposing him to public shame
  simplified_phrase: publicly shaming him
  preserved_meaning: Their action openly subjects the Son of God to disgrace.
  reasoning_layer_used: POB lexical decision for παραδειγματίζοντας
  rationale: The active wording is more direct while preserving the public disgrace.
translation_notes:
  risk_flags:
  - risk: Readers may take “fallen away” as settling later debates about loss of salvation.
    mitigation: The wording preserves the warning without defining the people through a denominational system.
  - risk: “Because” favors the explanatory reading of the participles.
    mitigation: Footnote [b] preserves the possible contemporaneous reading with “while.”
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
