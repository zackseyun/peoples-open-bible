language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דִּבַּ֨רְתִּי אֲנִ֤י עִם לִבִּ/י֙ לֵ/אמֹ֔ר אֲנִ֗י הִנֵּ֨ה הִגְדַּ֤לְתִּי וְ/הוֹסַ֨פְתִּי֙ חָכְמָ֔ה עַ֛ל כָּל אֲשֶׁר הָיָ֥ה לְ/פָנַ֖/י עַל יְרוּשָׁלִָ֑ם וְ/לִבִּ֛/י רָאָ֥ה הַרְבֵּ֖ה חָכְמָ֥ה וָ/דָֽעַת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/016.yaml
  text: I said in my heart, saying, “I—look—I have become great and increased in wisdom beyond all who were before me over Jerusalem, and my heart has seen much wisdom and knowledge.”
translation:
  language: ko
  text: 나는 마음속으로 이렇게 말했습니다. “보라, 나는 예루살렘을 다스렸던 나 이전의 모든 사람보다 위대해졌고 지혜를 더 많이 얻었습니다. 또 내 마음은 지혜와 지식을 많이 보았습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבַּ֨רְתִּי אֲנִ֤י עִם לִבִּי֙ לֵאמֹר
  english_pob_choice: I said in my heart, saying
  chosen_korean: 나는 내 마음속으로 말했습니다
  alternatives_korean:
  - 나는 내 마음에 말했습니다
  - 나는 속으로 말했습니다
  lexicon: לב
  rationale: 히브리어의 직역 구조를 살리되, 한국어에서는 자연스러운 관용 표현인 ‘마음속으로’로 옮겨 내적 독백임을 분명히 했습니다.
- source_word: הִנֵּה
  english_pob_choice: I—look—
  chosen_korean: 보라
  alternatives_korean:
  - 이제 보라
  - 자, 보라
  lexicon: הִנֵּה
  rationale: POB의 감탄적 삽입을 살려 화자의 자기지시를 강조하는 감탄사로 처리했습니다.
- source_word: הִגְדַּלְתִּי וְהוֹסַפְתִּי חָכְמָה
  english_pob_choice: I have become great and increased in wisdom
  chosen_korean: 나 자신을 크게 하고 지혜를 더하여
  alternatives_korean:
  - 크게 되었고 지혜를 더하여
  - 위대해지고 지혜를 더하여
  lexicon: גדל / יסף
  rationale: ‘크게 하다/더하다’의 동사성을 보존하되, 한국어에서 1인칭 완료의 자기과시를 자연스럽게 드러내도록 구성했습니다.
- source_word: עַל כָּל אֲשֶׁר הָיָה לְפָנַי עַל יְרוּשָׁלָם
  english_pob_choice: beyond all who were before me over Jerusalem
  chosen_korean: 나보다 먼저 예루살렘에 있었던 모든 이들보다
  alternatives_korean:
  - 예루살렘에서 나보다 앞선 모든 이들보다
  - 예루살렘 위에 있던 내 앞선 모든 이들보다
  lexicon: לפני / על ירושלם
  rationale: 전치사 결합을 한국어 문맥에 맞게 풀어 ‘나보다 먼저’와 ‘예루살렘에 있었던’으로 나누어, 비교의 대상과 장소를 함께 보존했습니다.
- source_word: וְלִבִּי רָאָה הַרְבֵּה חָכְמָה וָדָעַת
  english_pob_choice: and my heart has seen much wisdom and knowledge
  chosen_korean: 내 마음은 많은 지혜와 지식을 보았습니다
  alternatives_korean:
  - 내 마음이 많은 지혜와 지식을 보았습니다
  - 내 마음은 지혜와 지식을 많이 보았습니다
  lexicon: לב / ראה / חכמה / דעת
  rationale: ‘마음’이 지각의 주체로 기능하는 시적 표현을 살리면서, ‘보았다’는 통찰의 획득을 뜻하는 은유로 유지했습니다.
theological_decisions:
- issue: 지혜자의 자기평가와 과시의 뉘앙스
  chosen_reading: 자기 내면 독백의 과장된 자기진술로 읽되, 교만을 명시적으로 완화하지 않았습니다.
  alternative_readings:
  - 겸손한 자기보고로 완화
  - 단순한 사실 진술로 중화
  rationale: 문맥상 전도자는 자신의 지혜가 이전의 누구보다 뛰어났다고 말하며, 그 과장성과 긴장을 그대로 드러내는 것이 본문의 수사와 논지를 보존합니다.
  doctrine_reference: 전도서 1장 문맥의 허무와 인간 지혜의 한계
- issue: ‘마음’의 인지 주체성
  chosen_reading: ‘마음’이 말하고 보고하는 주체라는 히브리적 인식 표현을 유지했습니다.
  alternative_readings:
  - ‘생각’으로 바꾸어 심리적 표현으로 순화
  - ‘마음속’으로만 처리하여 의인화를 약화
  rationale: 히브리어 לב의 인지·의지 중심 의미를 살려, 본문이 지혜의 성찰을 단순 감정이 아니라 전인적 내적 판단으로 말한다는 점을 보존했습니다.
  doctrine_reference: 히브리어 인류학과 전도서의 지혜 담론
