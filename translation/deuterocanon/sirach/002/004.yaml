  rationale: The project philosophy gives primacy to the original-language witness available; here Hebrew survives and remains primary. However, the Greek parallel is explicitly to be used as translation input. Since וּבְשִׁבְרְךָ is capable of a more literal 'in your breaking/brokenness,' but the Greek reflects a fuller phrase about changes/reversals in humiliation, the main text preserves the likely sense without pretending the Hebrew alone is fully transparent. The alternative more Hebraic reading is preserved in a footnote.
