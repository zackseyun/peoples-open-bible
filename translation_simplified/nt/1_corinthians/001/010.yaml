translation:
  language: en
  text: Brothers,[a] I urge you on the authority of our Lord Jesus Christ:[b] all of you must agree in what you say. Do not let divisions separate you. Instead, be brought back together, united in the way you think and in the conclusions you reach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word is masculine, but here it may address the whole community of believers, both men and women.
    reason: cultural_note
  - marker: b
    text: Messiah is traditionally translated “Christ.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: by the name of our Lord Jesus the Messiah
  simplified_phrase: on the authority of our Lord Jesus the Messiah
  preserved_meaning: Paul bases his appeal on Jesus’ authority while retaining the title Messiah.
  reasoning_layer_used: lexical and theological decisions
  rationale: This states the force of the idiom in clear modern English.
- pob_phrase: that you all say the same thing
  simplified_phrase: all of you must agree in what you say
  preserved_meaning: Paul calls for agreement expressed in the community’s speech.
  reasoning_layer_used: lexical decision for τὸ αὐτὸ λέγητε πάντες
  rationale: The wording preserves the speech emphasis without suggesting identical words.
- pob_phrase: be joined together in the same mind and in the same judgment
  simplified_phrase: be brought back together, united in the way you think and in the conclusions you reach
  preserved_meaning: The divided community is to be restored to shared thinking and judgment.
  reasoning_layer_used: lexical decisions for κατηρτισμένοι, νοῒ, and γνώμῃ
  rationale: The passive restoration and the two distinct aspects of unity remain visible.
