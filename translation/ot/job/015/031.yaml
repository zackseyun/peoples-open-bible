  from: Let him not trust in emptiness, going astray[a], for emptiness will be what he gets in return[b].
  to: Let him not go astray[a] by trusting in emptiness[b], for emptiness will be his return.
  rationale: I preserve the latest audit’s rejection of an explicitly self-caused deception and its repetition of “emptiness.” The loosely attached participle is integrated into the sentence, while the passive possibility remains in a note.
