id: ECC.10.19
reference: Ecclesiastes 10:19
source:
  edition: WLC
  text: לִ/שְׂחוֹק֙ עֹשִׂ֣ים לֶ֔חֶם וְ/יַ֖יִן יְשַׂמַּ֣ח חַיִּ֑ים וְ/הַ/כֶּ֖סֶף יַעֲנֶ֥ה אֶת הַ/כֹּֽל־׃
translation:
  text: A meal is prepared for merriment, wine gladdens life, and money is the answer to everything[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “money pays for it all.”
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׂחוֹק
  chosen: for merriment
  alternatives:
  - for merriment
  - for amusement
  - for pleasure
  lexicon: HALOT
  rationale: This naturally conveys festive laughter in the meal-and-wine setting.
- source_word: עֹשִׂים לֶחֶם
  chosen: A meal is prepared
  alternatives:
  - bread is made
  - they prepare a feast
  lexicon: HALOT
  rationale: לחם can denote food or a meal here, and an English passive naturally represents the unspecified plural subject.
- source_word: וְיַיִן יְשַׂמַּח חַיִּים
  chosen: and wine gladdens life
  alternatives:
  - and wine makes life glad
  - and wine gladdens the living
  - and wine cheers life
  lexicon: HALOT
  rationale: יַיִן is straightforwardly 'wine.' The Piel of שׂמח means 'make glad/gladden.' חַיִּים can mean 'life' or 'the living'; here 'life' best fits the proverbial statement and avoids an awkward personal object in English.
- source_word: וְהַכֶּסֶף
  chosen: and money
  alternatives:
  - and silver
  lexicon: HALOT
  rationale: כֶּסֶף can mean either 'silver' or 'money.' In this wisdom context the economic sense is primary, so 'money' communicates the point more clearly in modern English.
- source_word: יַעֲנֶה אֶת־הַכֹּל
  chosen: answers everything
  alternatives:
  - meets every need
  - responds to everything
  - is the answer to everything
  lexicon: HALOT
  rationale: ענה ordinarily means 'answer, respond.' In this context it likely carries the idiomatic sense that money provides a response or solution in many situations. 'Answers everything' preserves the Hebrew wording and the verse's sharp, possibly ironic, compression better than a fuller paraphrase.
