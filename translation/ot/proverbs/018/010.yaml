  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Gender representation in צַדִּיק
  chosen_reading: the righteous man
  alternative_readings:
  - the righteous
  - the righteous person
  rationale: The Hebrew form is singular masculine and proverbially representative. Following the stated policy, the translation remains gender-accurate rather than flattening to a gender-neutral collective, while the representative sense can be noted.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
