revisions:
- from: 그러자 다윗이 다시 맹세하며 말했습니다. "당신의 아버지는 내가 당신의 눈에 은총을 입었다는 것을 분명히 알고 있습니다. 그리고 그는 말하기를, ‘이 일을 요나단이 알면 안 된다. 그가 상하지 않도록 하려는 것이다.’ 하지만 야훼께서 살아 계시듯, 그리고 당신의 생명이 살아 있듯, 나와 죽음 사이에는 한 걸음밖에 남지 않았습니다."[a]
  to: 그러자 다윗이 다시 맹세하고 말했습니다. “당신의 아버지는 내가 당신에게 호의를 얻었다는 것을 틀림없이 알고 있습니다. 그래서 그는 ‘요나단이 이 일을 알아서는 안 된다. 그가 근심할까 염려된다’라고 말했습니다. 그러나 야훼께서 살아 계시고 당신의 목숨을 두고 맹세합니다. 나와 죽음 사이는 한 걸음뿐입니다.”
  rationale: 사울의 발언 안에 있는 ‘요나단은 알면 안 된다’와 ‘그가 근심할까’의 관계를 한국어에서 자연스럽게 재현했습니다. 맹세 공식은 직역으로 인한 어색함을 피하면서도 야훼와 상대의 목숨을 증인으로 삼는 원문의 기능을 보존했습니다. 원문의 별도 주석 근거가 없고, 기존 각주는 번역 선택을 설명할 뿐 본문 이해에 필수적이지 않아 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:26:43Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 맹세 공식, 사울이 요나단에게 이 일을 알리지 않으려는 이유, 그리고 죽음의 임박성을 전반적으로 잘 담았으나, ‘그가 상하지 않도록 하려는 것이다’는 עצב의 의미와 원문의 종속 구문을 충분히 정확하게 반영하지 못합니다. ‘당신의 생명이 살아 있듯’도 히브리어 맹세 관용구를 한국어로 자연스럽게 옮긴 표현이 아닙니다.
  naturalness: 서술부는 자연스럽지만, 직접 인용문의 ‘그가 상하지 않도록 하려는 것이다’와 ‘당신의 생명이 살아 있듯’은 현대 표준 한국어에서 다소 부자연스럽습니다. 맹세는 ‘…을 두고 맹세합니다’로 풀어 쓰는 것이 명료하고 자연스럽습니다.
  terminology: חֵן은 여기서 신학적 ‘은총’보다 상대의 호의·호감을 가리키므로 ‘호의를 얻었다’가 문맥에 더 정확합니다. עצב는 ‘상하다’보다 ‘근심하다’로 옮기는 것이 적절합니다. יהוה는 초안의 표기 원칙을 따라 ‘야훼’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘그가 상하지 않도록 하려는 것이다’
    rationale: פֶּן יֵעָצֵב는 ‘그가 근심할까 하여/근심하지 않도록’이라는 우려의 종속절입니다. ‘상하다’는 의미가 부정확하고, ‘하려는 것이다’는 원문에 없는 설명적 목적 진술을 덧붙입니다.
  - severity: medium
    issue: ‘당신의 생명이 살아 있듯’
    rationale: וְחֵי נַפְשְׁךָ는 맹세 관용구로서 문자적으로 옮기면 한국어가 어색합니다. ‘당신의 목숨을 두고 맹세합니다’가 원문의 맹세 기능을 자연스럽게 보존합니다.
  - severity: low
    issue: ‘은총을 입었다’
    rationale: חֵן은 이 대인 관계 문맥에서 종교적·신학적 뉘앙스가 강한 ‘은총’보다 ‘호의’를 뜻합니다.
