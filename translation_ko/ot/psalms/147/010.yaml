  naturalness: ‘좋아하지 않으십니다’도 이해되지만, 첫 절의 ‘기뻐하지 않으십니다’와 병행시키면 원문의 반복적 병행 구조와 격식 있는 시편 문체가 더 자연스럽게 살아납니다.
  terminology: ‘말의 힘’과 ‘사람의 다리’는 적절합니다. ‘사람’은 הָאִישׁ의 일반적·대표적 용법을 현대 한국어로 무리 없이 반영합니다. 부정확한 어휘 주석은 삭제하는 것이 안전합니다.
