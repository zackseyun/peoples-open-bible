lexical_decisions:
- source_word: דִכִּיתָנוּ
  english_pob_choice: you crushed us
  chosen_korean: 우리를 짓밟으시고
  alternatives_korean:
  - 우리를 부수시고
  - 우리를 짓이기시고
  - 우리를 압박하셨고
  lexicon: HALOT
  rationale: דכה는 단순한 심리적 압박보다 강한 파괴·짓눌림의 이미지를 가지므로, 현대 한국어에서 물리적·비유적 강도를 함께 살릴 수 있는 ‘짓밟으시고’가 적절합니다.
- source_word: בִּמְקוֹם תַּנִּים
  english_pob_choice: in a place of jackals
  chosen_korean: 자칼의 곳에서
  alternatives_korean:
  - 자칼들이 우글거리는 곳에서
  - 황무지에서
  - 들개들의 곳에서
  lexicon: HALOT
  rationale: תַּנִּים은 문맥상 ‘용’보다 사막의 황량함을 드러내는 ‘자칼’이 가장 가능성이 높으므로, 장소성을 살린 ‘자칼의 곳’으로 옮겼습니다.
- source_word: בְצַלְמָוֶת
  english_pob_choice: with deep darkness
  chosen_korean: 깊은 어둠으로
  alternatives_korean:
  - 사망의 그늘로
  - 깊은 흑암으로
  - 죽음의 그늘로
  lexicon: HALOT
  rationale: צַלְמָוֶת은 관용적으로 ‘깊은 어둠’의 뜻으로 쓰일 수 있으므로, 전통적 표현을 그대로 고정하지 않고 현대적이면서도 이미지가 살아 있는 표현을 택했습니다.
