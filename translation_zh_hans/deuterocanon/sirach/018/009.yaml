lexical_decisions:
- source_word: ἀριθμὸς ἡμερῶν ἀνθρώπου
  choice: 人的年日
  rationale: 直译为“人的日子的数目”在现代汉语中生硬；“人的年日”简洁表达人的寿日总数，并保留原文的概括性。
- source_word: πολλὰ ἔτη
  choice: 很多
  rationale: 原文明确说“许多年／很多年”，不增添“至多”“不过”等限制性措辞；中文中由“一百年”补足具体年数。
- source_word: ἑκατόν
  choice: 一百年
  rationale: 原文末尾仅作“一百”的同位说明，量词承接前面的“年”；译文补出“年”以符合现代汉语。
theological_decisions:
- issue: 一百年是上限还是对“很多年”的概括说明
  choice: 以破折号并列为概括说明，不明说“至多”
  alternative: 人的年日再多，也不过一百年。
  rationale: 希腊文没有表示“至多”或“不过”的词；保留其简练而略带张力的表述，避免把推断写入正文。
translation_notes:
  register: 采用简洁、庄重的现代汉语；破折号保留原文后置“一百”的强调和解释关系。
