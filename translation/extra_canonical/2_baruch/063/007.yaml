  from: And I went out and destroyed
  to: And he went out and destroyed
  rationale: The Syriac verb is in the third-person masculine singular (referring
    to the angel sent by the Mighty One), not the first person. Baruch is narrating
    the historical event, so 'I went out' is a mistranslation.
