id: JHN.1.51
reference: John 1:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
  footnotes:
  - marker: a
    text: The 'you' in 'I say to you' and 'you will see' is plural in Greek.
    reason: lexical_alternative
  - marker: b
    text: This imagery echoes Jacob's dream in Genesis 28:12, now centered on the Son of Man.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. “진실로 진실로 내가 여러분에게[a] 말합니다. 여러분은 하늘이 열려 있는 것과 하나님의 천사들이 인자[b] 위로 오르내리는 것을 보게 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘여러분에게’와 ‘여러분은’은 그리스어에서 복수형입니다(ὑμῖν, ὄψεσθε).
    reason: lexical_alternative
  - marker: b
    text: '이 장면은 창세기 28:12에 나오는 야곱의 꿈을 떠올리게 하며, 이제 인자를 중심으로 묘사됩니다(참조: 창세기 28:12).'
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로 진실로
  alternatives_korean:
  - 아멘 아멘
  - 정말로 정말로
  lexicon: BDAG / Liddell-Scott
  rationale: 헬라어의 강조된 중복 공식(Ἀμὴν ἀμὴν)을 그대로 살리되, 현대 한국어에서 경건하고 무게감 있는 서두로 전달하기 위해 '진실로 진실로'를 사용했습니다. '아멘'을 본문에 그대로 두면 현대 독자에게 의례적 어투로 들릴 수 있으므로 주저했습니다.
- source_word: ὑμῖν
  english_pob_choice: you
  chosen_korean: 너희
  alternatives_korean:
  - 여러분
  - 너희들
  lexicon: BDAG
  rationale: 원문 대명사는 복수입니다. 본문은 자연스러운 한국어로 흐르도록 단수/복수 모호성을 피하면서도 전통적 성경어법에 맞게 '너희'를 사용했고, 원문의 복수 지시성은 주석[a]로 분명히 했습니다.
- source_word: ἀγγέλους τοῦ θεοῦ
  english_pob_choice: the angels of God
  chosen_korean: 하나님의 천사들
  alternatives_korean:
  - 하나님의 사자들
  - 사자들
  lexicon: BDAG
  rationale: 비전적 맥락과 창세기 28장의 상호텍스트성을 고려하여 초자연적 존재인 '천사들'이 적합합니다. '하나님의'는 τοῦ θεοῦ의 소유격을 충실히 반영합니다.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου (ἐπὶ τὸν ...)
  english_pob_choice: the Son of Man
  chosen_korean: 인자 위로
  alternatives_korean:
  - 인자에게로
  - 사람의 아들 위에
  lexicon: BDAG
  rationale: 프로젝트 표준어에 따라 '인자'를 사용했습니다. ἐπί + 대격의 공간관계를 한국어로 자연스럽게 살리기 위해 '인자 위로'로 번역했고, 이는 'on the Son of Man'의 이미지(천사들이 인자와 관련하여 오르내리는 장면)를 보존합니다.
theological_decisions:
- issue: 청자 수(단수 서술자(αὐτῷ) vs. 직접 호칭의 복수(ὑμῖν))
  chosen_reading: 본문은 자연스러운 한국어를 위해 '너희'로 처리하고, 그리스어의 복수 지시성은 각주[a]에 명시했습니다.
  alternative_readings:
  - 본문에서 명시적으로 '여러분' 또는 '너희들 모두'로 복수를 표기
  - 본문을 단수 독자(나타날)로 읽도록 번역
  rationale: 그리스어는 발화 담화 상황에서 개별 청자(나타나엘)를 향해 말하면서도 복수로 일반화합니다. 한국어 본문에 복수 표현을 과도하게 삽입하면 자연스러움이 떨어지므로 본문은 직역에 가깝게 유지하되 복수성은 주석으로 보존합니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 야곱의 사다리(창 28:12)와의 상호텍스트성
  chosen_reading: 본문은 영상적 표현을 보존하고 해석적 확장을 피하며, 상호텍스트성은 주석[b]으로 제시했습니다.
  alternative_readings:
  - 본문에서 명시적으로 '야곱의 꿈을 떠올리게 하는' 같은 주석적 덧붙임
  - 상호텍스트성을 본문에 통합하여 해석적으로 번역
  rationale: 원문은 창세기 어휘를 불러일으키지만, 번역 자체에서 설명적 주석을 넣으면 원문 텍스트의 자율성이 손상됩니다. 주석으로 연결점을 제시하는 것이 원문 충실성과 독자 이해를 둘 다 살립니다.
  doctrine_reference: Translation philosophy §1, §3
