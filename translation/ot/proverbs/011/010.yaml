id: PRO.11.10
reference: Proverbs 11:10
source:
  edition: WLC
  text: בְּ/ט֣וּב צַ֭דִּיקִים תַּעֲלֹ֣ץ קִרְיָ֑ה וּ/בַ/אֲבֹ֖ד רְשָׁעִ֣ים רִנָּֽה׃
translation:
  text: When it goes well with the righteous, a city rejoices, and when the wicked perish, there is joyful shouting.
  philosophy: dynamic
lexical_decisions:
- source_word: בְּטוּב
  chosen: When it goes well with
  alternatives:
  - In the good of the righteous
  - By the goodness of the righteous
  - When it goes well with the righteous
  lexicon: HALOT
  rationale: This idiomatic temporal rendering retains the broad notion of the righteous people's well-being.
- source_word: צַדִּיקִים
  chosen: the righteous
  alternatives:
  - righteous people
  - the just
  lexicon: HALOT
  rationale: Plural adjective used substantivally. 'The righteous' is concise, natural, and preserves the moral category central to Proverbs.
- source_word: תַּעֲלֹץ
  chosen: rejoices
  alternatives:
  - exults
  - is jubilant
  lexicon: HALOT
  rationale: The verb עלץ conveys exultant joy. 'Rejoices' is clear modern English and fits the personified subject 'city,' while avoiding overstatement.
- source_word: קִרְיָה
  chosen: a city
  alternatives:
  - the city
  - town
  lexicon: HALOT
  rationale: קִרְיָה refers to a city/town. The anarthrous Hebrew is well represented by the generic English singular 'a city,' expressing a proverbial general truth rather than a specific city.
- source_word: וּבַאֲבֹד
  chosen: and when ... perish
  alternatives:
  - and at the perishing of
  - and when ... are destroyed
  lexicon: HALOT
  rationale: The preposition with infinitive construct is naturally rendered as a temporal clause.
- source_word: רְשָׁעִים
  chosen: the wicked
  alternatives:
  - wicked people
  - the guilty
  lexicon: HALOT
  rationale: Plural adjective used substantivally. 'The wicked' is the standard concise rendering and matches the moral contrast with 'the righteous.'
- source_word: רִנָּה
  chosen: joyful shouting
  alternatives:
  - there is joyful shouting
  - there is a cry of joy
  - there is singing
  lexicon: HALOT
  rationale: In context the term denotes a jubilant public cry rather than merely neutral shouting.
