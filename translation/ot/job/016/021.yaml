id: JOB.16.21
reference: Job 16:21
source:
  edition: WLC
  text: וְ/יוֹכַ֣ח לְ/גֶ֣בֶר עִם אֱל֑וֹהַּ וּֽ/בֶן אָדָ֥ם לְ/רֵעֵֽ/הוּ־־׃
translation:
  text: May he plead a man's case with God, as a person pleads for a friend[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, the second line may mean, “and a human being's case with his neighbor,” with the same witness acting in both disputes.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיוֹכַח
  chosen: would plead
  alternatives:
  - might plead
  - would decide
  - would argue the case
  lexicon: HALOT
  rationale: In this appeal, the legal verb concerns presenting a human's case before God; “plead” fits the benefactive construction without suggesting a neutral arbitrator.
- source_word: לְגֶבֶר
  chosen: for a man
  alternatives:
  - for a strong man
  - for a person
  lexicon: HALOT
  rationale: גבר commonly denotes a man, often with nuance of a male person or strong man. Here it functions generically for a human litigant. 'For a man' preserves the masculine/generic force in line with the gender-accurate policy.
- source_word: עִם אֱלוֹהַּ
  chosen: with God
  alternatives:
  - against God
  - before God
  lexicon: HALOT
  rationale: עִם most basically means 'with,' though in legal contexts it can imply engagement in dispute. 'With God' is the most textually direct and leaves the juridical nuance to the verb 'arbitrate.'
- source_word: וּבֶן אָדָם
  chosen: as a person
  alternatives:
  - and a son of man
  - and as a human being
  lexicon: HALOT
  rationale: Here the expression is an ordinary Hebrew designation for a human being; this natural English rendering avoids unmarked title associations while the footnote retains the literal form.
- source_word: לְרֵעֵהוּ
  chosen: for his neighbor
  alternatives:
  - for his friend
  - with his companion
  lexicon: HALOT
  rationale: רֵעַ can mean neighbor, friend, or companion. In a legal/interpersonal comparison, 'neighbor' is broad and natural, while still allowing relational closeness. The prefixed ל is taken as marking the party on whose behalf the action is done, parallel to לְגֶבֶר.
