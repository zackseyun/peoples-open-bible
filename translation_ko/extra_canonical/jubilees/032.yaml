revisions:
- from: '1[5-6]. 유다는 기뻐하며 그의 조상 아브라함과 이삭의 하나님을 찬양하였다. 그가 이르되 내가 만유의 하나님 앞에서 나와 내 자녀들에게 영원한 소망이 있는 줄을 이제 알았노라 이삭이 그들에게 축복한 대로 이 두 사람을 위하여 정해졌으니 영원한 증거로 하늘 판에 기록되리라.”

    2. 야곱은 이 달 십사일 아침에 일찍 일어나 사람과 가축과 금과 모든 소유물에서 자기와 함께 갔던 모든 것에서 십일조를 냈고, 모든 것에서 십일조를 취했습니다. 3. 그 때에 라헬이 베냐민을 임신하였고 야곱이 자기 중에서 자기 아들들을 계수하니 레위가 주님의 몫으로 올라오매 그의 아버지가 그에게 옷을 입히니라

    4. 제사장의 옷을 입고 두 손에 채웠으니 이 달 열다섯 마리에 소 열넷과 숫양 스물여덟 마리와 양 마흔아홉 마리와 어린 양 일곱 마리와 어린 새끼 스물한 마리를 제단에 드렸으며

    5. 길르앗 땅에서. 그리고 야곱은 라반에게 자신의 뜻을 숨기고 그에게 알리지 않았습니다. 그리고 일곱째 해 넷째 주, 열째 해 그 달 초하루에 야곱이 길르앗으로 돌아왔습니다. 라반이 그 소식을 듣고 그를 뒤쫓아 제십삼년 셋째 달에 길르앗 산에서 야곱을 따라잡았더라. 주님께서 그가 야곱에게 해를 끼치는 것을 허락지 아니하셨으니 이는 그가 밤에 꿈에 그에게 나타나 야곱을 위하여 라반에게 말씀하심이었더라. 그 날 열다섯째 날에 야곱이 라반과 그와 함께 온 모든 사람을 위하여 잔치를 베푸니라 그 날에 야곱이 라반에게 맹세하고 라반도 야곱에게 맹세하기를 증거의 산에서 악한 뜻으로 건너가지 아니하리라 하고

    6. 그가 그 기도한 바에 따라 그들의 희생제물과 전제물과 함께 십일조를 드리게 하였더라. 불이 번제물을 다 태운 후에 그는 소 두 마리와 숫양 네 마리와 양 네 마리와 숫염소 다섯 마리와 일 년 된 양 네 마리를 구원의 희생으로 드렸습니다. 7[10-12]. 그러므로 이스라엘 딸이 부정하게 된 것에 대하여 이같이 이스라엘이 법을 정하였나니 이스라엘 중에 어떤 사람이 그 딸이나 누이를 이방인 중 누구에게 주려거든 반드시 돌로 쳐죽일지니 이는 그가 이스라엘 중에 불명예를 행하였음이니라. 그리고 그 여자

    8. 그 여자가 그 아버지 집의 이름을 더럽혔음이니 그들이 불사를 것이라 그는 이스라엘 중에서 끊어지리라 그리고 땅의 대대로 이스라엘 가운데서 음행이나 더러움이 발견되지 않게 하십시오. 이스라엘은 주님께 성물이기 때문입니다. 그것을 더럽히는 사람은 누구나 반드시 죽을 것이다. 그들은 그를 돌로 칠 것이다. 9. 이 증거에 따르면 이 규례는 영원히 증거가 될 것입니다. 전에는 길르앗 땅을 르바임의 땅이라 불렀으니 그 땅은 르바임의 땅이었기 때문이더라. 거기서 르바임이 태어났는데 키가 아홉 큐빗, 여덟 큐빗, 적게는 일곱 큐빗인 거인들이더라. 10. 더럽히는 자는 반드시 죽고 돌로 맞아질 것이다. 이 율법에는 기한이 없고 사면도 없고 속죄도 없느니라 오직 온 이스라엘 중에서 그 딸을 더럽힌 사람을 쫓아내지 못하였으니 이는 그가 그 자손을 몰렉에게 주고 그것을 더럽혀 악을 행하였음이라. 11. 그들의 왕국은 카르나임과 아스다롯과 에드레이와 미수르와 베온이었더라. 주님께서 그들의 악행대로 심판하사 그들이 심히 악하므로 아모리 족속을 그 땅에 거하게 하신즉 악하고 죄가 있더라 오늘날 그들처럼 그 죄를 가득 채운 백성이 없고 다시는 없느니라

    12. 장수할 수 없었으니 스물일곱 살부터 그 수명이 이십육년을 넘지 못하였느니라 그 해에는 종자를 먹되 제이십팔년의 수확기까지 먹으며 포도주는 그 해의 수확기까지 먹음이니라

    13. “우리 딸을 포피 가진 사람에게 주지 말자. 그것이 우리에게 욕이 된다.” 이방인의 딸들에게 주는 자와 빼앗는 자들이 이스라엘에게 욕을 당할 것이니 이는 부정함이라

    14. 그리고 대대손손도 마찬가지입니다. 주님께서 그의 영광을 위하여 너와 네 자손에게 큰 마음을 주시기를 원하며 또 그가 모든 육체 중에서 너희와 너희 자손을 그에게 가까이 이끄시고 너희가 임재한 천사들과 거룩한 자들과 같이 그의 성소에서 섬기게 하시기를 원하노라 네 아들의 후손도 그들과 같이 영광과 위대함이 있으리로다

    15. 열방의 딸들 위에 계시며 너희 딸들 중에 어느 이방인에게 몸을 바친 자가 있으면 재앙에 재앙이 그에게 임하고 저주에 저주가 임하리니 만일 그가 이 일을 행하면 이 모든 재앙과 저주가 임하리니 만일 그가 부정을 행하는 자와 주님의 성소를 더럽히는 자와 그의 성호를 욕되게 하는 자를 보지 아니하면 모든 부정과 모독으로 말미암아 온 백성이 함께 심판을 받으리라. 16. 주님께서 그들의 입에 넣어서 사랑하는 자의 모든 자손에게 복을 주시리라 주님께서 너희를 그들 중에서 부르셨나니 레위 같이 하시고 진실로 주님께 가까이 나아오라고 너를 부르셨나니 이는 너로 그의 것이 되고 야곱의 모든 아들이 네 상에서 먹게 하며 너와 네 아들들이 만민의 식탁에서 먹게 하려 하심이니라

    17. 이스라엘 중 자기 성소를 더럽히는 모든 남자와 여자. 그러므로 내가 너희에게 명하여 이르기를 이스라엘에 대하여 이 증언을 하라 세겜과 그 아들들에게 된 일을 보라 그들이 야곱의 두 아들의 손에 넘겨져 고통스럽게 죽였으므로 그것이 그들의 의로 여기고 그들을 위한 의로 기록되었느니라.

