    issue: 문두의 ‘또’
    rationale: καὶ γάρ는 여기서 단순 첨가의 ‘또’라기보다 앞 진술을 뒷받침하거나 강조하는 ‘참으로/실로, 왜냐하면’의 기능을 합니다.
  - severity: low
    issue: 각주의 어휘적 단정
    rationale: συλλαμβάνω는 ‘붙잡다, 체포하다’ 모두를 포괄하며, 이 절의 형태만으로 ‘체포되다’보다 폭력적 구속을 특별히 암시한다고 확정할 수 없습니다.
