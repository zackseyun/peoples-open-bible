  from: And Yahweh sent to you all his servants the prophets[a], rising early and sending them, but you did not listen, nor did you incline your ear to hear.
  to: Yahweh has also sent all his servants the prophets to you again and again, but you have not listened or paid any attention.
  rationale: The lexical discussion recognizes earnest repetition and attentive listening as the meanings of the two idioms, although the current text preserves their Hebrew forms. 'His servants the prophets' remains intact as the designation of Yahweh’s commissioned messengers.
