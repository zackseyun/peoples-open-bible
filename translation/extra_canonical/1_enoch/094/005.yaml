  - source_phrase: ይግበሩ፡ ጥበበ፡ እኩየ
    prior_rendering: to practice evil wisdom
    new_rendering: to deal wickedly with wisdom
    rationale: I understand the evil as describing people's treatment of wisdom. This fits the following statement that wisdom finds no place and the book's portrayal of wisdom rejected among human beings; the alternative construction remains in a note.
  - source_phrase: ወኵሉ፡ መካን፡ ኢይትረከብ፡ ላቲ
    prior_rendering: and no place will be found for it
    new_rendering: so that no place will be found for her
    rationale: The clause expresses the consequence of the sinners' enticement. The feminine reference preserves wisdom's personification rather than treating it only as an impersonal technique.
