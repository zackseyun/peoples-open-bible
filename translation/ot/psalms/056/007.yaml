id: PSA.56.7
reference: Psalms 56:7
source:
  edition: WLC
  text: עַל אָ֥וֶן פַּלֶּט לָ֑/מוֹ בְּ֝/אַ֗ף עַמִּ֤ים הוֹרֵ֬ד אֱלֹהִֽים־־׀׃
translation:
  text: Will they escape because of their iniquity[a]? In anger bring down the peoples, O God.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew is difficult and contains no explicit negative; another possible reading is “Because of their iniquity, cast them out.”
    reason: alternative_reading
lexical_decisions:
- source_word: עַל
  chosen: because of
  alternatives:
  - For
  - On account of
  - Upon
  - Because of
  lexicon: HALOT
  rationale: 'Introduces the ground on which escape would be incongruous: their iniquity.'
- source_word: אָוֶן
  chosen: their iniquity
  alternatives:
  - wickedness
  - evil
  - trouble
  - iniquity
  lexicon: HALOT
  rationale: The noun denotes the wrongdoing belonging to the people under judgment; English supplies the possessive for clarity.
- source_word: פַּלֶּט
  chosen: Will they escape
  alternatives:
  - deliver them not
  - do not rescue them
  - let there be no escape for them
  - do not let them escape
  lexicon: HALOT
  rationale: Without an expressed negative, the form is best understood as a rhetorical question in this context. An imperative 'cast them out' is preserved as an alternative.
- source_word: לָמוֹ
  chosen: them
  alternatives:
  - for them
  - to them
  lexicon: HALOT
  rationale: The pronominal suffix refers to the wicked opponents in the psalm. In English, 'them' is the natural object/complement with the chosen rendering of the verb.
- source_word: בְּאַף
  chosen: in anger
  alternatives:
  - in wrath
  - with anger
  - in your anger
  lexicon: HALOT
  rationale: אַף in this idiom denotes anger or wrath. 'In anger' is concise and preserves the instrumental/circumstantial sense. 'Your' is not explicit in Hebrew, though clearly addressed to God.
- source_word: עַמִּים
  chosen: the peoples
  alternatives:
  - the nations
  - peoples
  lexicon: HALOT
  rationale: עַמִּים is the plural 'peoples.' 'The peoples' is slightly more formal but preserves the lexical distinction from a singular 'nation' and fits psalmic diction.
- source_word: הוֹרֵד
  chosen: bring down
  alternatives:
  - cast down
  - bring low
  - cause to descend
  lexicon: HALOT
  rationale: The causative imperative from ירד calls on God to make the peoples go down, i.e., to abase or overthrow them. 'Bring down' is idiomatic and preserves the metaphor of descent/humiliation.
- source_word: אֱלֹהִים
  chosen: O God
  alternatives:
  - God
  lexicon: HALOT
  rationale: Here אֱלֹהִים is a direct address at the end of the petition. 'O God' makes the vocative force explicit in English.
