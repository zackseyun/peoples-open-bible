  yaml_path: translation/ot/psalms/065/011.yaml
  text: You crown the year with your goodness, and your paths[a] drip with abundance[b].
  footnotes:
  - marker: a
    text: Or “your tracks”; the Hebrew image may evoke the course of God’s procession leaving fertility behind.
    reason: lexical_alternative
  - marker: b
    text: Literally “fatness,” a Hebrew image for rich fertility and plentiful provision.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 주님의 선하심으로 그 해를 관을 씌우시며, 주님의 길에는 풍요[a]가 흘러넘칩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 자취에는 풍요가 흘러넘칩니다.’ 히브리어의 이미지는 하나님의 행차가 지나간 자리에 풍요가 남는 모습을 암시할 수 있습니다.
    reason: מַעְגָּלֶיךָ의 ‘길/자취’라는 어휘적 대안을 보존합니다.
  - marker: b
    text: 직역하면 ‘기름진 것’ 또는 ‘기름짐’입니다. 히브리어에서는 풍요로운 비옥함과 넉넉한 공급을 나타내는 이미지입니다.
    reason: דָּשֶׁן의 문자적 의미와 농경적 비유를 보존합니다.
lexical_decisions:
- source_word: תְּלָמֶ֣י/הָ
  english_pob_choice: its furrows
  chosen_korean: 그의 밭고랑을
  alternatives_korean:
