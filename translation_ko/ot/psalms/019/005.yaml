  rationale: 지정된 WLC 본문을 직접 반영하도록 전면 교체했습니다. ‘해’는 바로 앞 절의 선행사이므로 한국어에서 자연스러운 명시적 주어로 제시했습니다. ‘자기 신방에서 나오는 신랑’은 מֵחֻפָּתוֹ의 소유 접미사와 출현 이미지를 살리고, ‘길을 달려갈 용사처럼 기뻐합니다’는 יָשִׂישׂ כְּגִבּוֹר לָרוּץ אֹרַח의 기쁨과 달리기 비유를 보존합니다. חֻפָּה의 의미 범위는 본문에서 단정하지 않고 각주에 제시했습니다.
