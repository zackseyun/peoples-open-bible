id: PSA.109.16
reference: Psalms 109:16
source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר לֹ֥א זָכַר֮ עֲשׂ֪וֹת חָ֥סֶד וַ/יִּרְדֹּ֡ף אִישׁ עָנִ֣י וְ֭/אֶבְיוֹן וְ/נִכְאֵ֨ה לֵבָ֬ב לְ/מוֹתֵֽת׀־׃
translation:
  text: Because he gave no thought to showing kindness, but pursued the poor and needy, the brokenhearted, to put them to death.
  philosophy: dynamic
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  chosen: because
  alternatives:
  - since
  - for that
  lexicon: HALOT
  rationale: The compound introduces the reason for the judgment in the surrounding context. 'Because' is natural modern English and preserves the causal force.
- source_word: לֹא זָכַר עֲשׂוֹת חָסֶד
  chosen: did not remember to show kindness
  alternatives:
  - did not remember to do covenant loyalty
  - did not remember to practice mercy
  lexicon: HALOT
  rationale: זָכַר + infinitive conveys failure to keep in mind so as to act. חָסֶד can carry covenantal loyalty/steadfast love, but here in interpersonal ethics 'show kindness' best fits the object and remains readable without overstating covenantal nuance.
- source_word: וַיִּרְדֹּף
  chosen: but pursued
  alternatives:
  - and pursued
  - persecuted
  lexicon: HALOT
  rationale: The waw-consecutive continues the description. English 'but' brings out the adversative sense between failing to show kindness and actively hunting the vulnerable; 'pursued' is more literal than 'persecuted' and fits the verbal imagery.
- source_word: אִישׁ עָנִי וְאֶבְיוֹן
  chosen: the poor and needy
  alternatives:
  - a poor and needy man
  - the afflicted and needy man
  lexicon: HALOT
  rationale: The Hebrew singular may be representative; the English class plural is idiomatic and avoids an awkward mismatch with the coordinated description.
- source_word: וְנִכְאֵה לֵבָב
  chosen: the brokenhearted
  alternatives:
  - and the crushed in heart
  - and the stricken of heart
  lexicon: HALOT
  rationale: This preserves a coordinated description of vulnerable people without asserting that it must be appositional to a single individual.
- source_word: לְמוֹתֵת
  chosen: to put them to death
  alternatives:
  - to kill
  - to bring to death
  lexicon: HALOT
  rationale: The plural pronoun coherently refers to the representative groups in the English rendering; the Hebrew infinitive itself has no expressed pronominal object.
