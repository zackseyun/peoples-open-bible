  from: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
  to: When the Philistines heard that David had been anointed king over Israel, all the Philistine forces marched up to attack him. When David heard of it, he went down to the stronghold.
