  text: And they fasted on that day, and put on sackcloth, and put ashes on their heads, and tore their garments.
translation:
  language: ko
  text: 그들은 그날 금식하고, 베옷을 입고, 머리에 재를 얹고, 그들의 옷을 찢었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘베옷’은 애도와 참회의 표시로 입는 거친 옷입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνήστευσαν
  english_pob_choice: they fasted
  chosen_korean: 금식하고
  alternatives_korean:
  - 굶고
  - 단식하고
  lexicon: 'Strong''s-style lexical equivalent: νηστεύω'
  rationale: 종교적 애도와 회개의 행위로서의 ‘fasted’를 표준 한국어 성경체인 ‘금식하다’로 옮겼습니다.
- source_word: περιεβάλλοντο σάκκους
  english_pob_choice: put on sackcloth
  chosen_korean: 베옷을 입고
  alternatives_korean:
  - 굵은베를 두르고
  - 자루옷을 입고
  lexicon: 'Strong''s-style lexical equivalent: σάκκος'
  rationale: σάκκος는 애도복인 베옷을 뜻하므로, 직역성이 있으면서도 자연스러운 ‘베옷’을 선택했습니다.
- source_word: σποδὸν ἐπὶ τὰς κεφαλὰς αὐτῶν
  english_pob_choice: put ashes on their heads
  chosen_korean: 머리에 재를 얹고
  alternatives_korean:
  - 머리에 재를 뿌리고
  - 그들의 머리 위에 재를 두르고
  lexicon: 'Strong''s-style lexical equivalent: σποδός'
  rationale: 본문의 동작은 머리 위에 재를 두는 애도 표현이므로, POB의 문장 의미를 유지하며 자연스럽게 ‘얹다’로 옮겼습니다.
- source_word: διέρρηξαν τὰ ἱμάτια αὐτῶν
  english_pob_choice: tore their garments
  chosen_korean: 그들의 옷을 찢었습니다
  alternatives_korean:
  - 겉옷을 찢었습니다
  - 의복을 찢었습니다
  lexicon: 'Strong''s-style lexical equivalent: διαρρήγνυμι / ἱμάτια'
  rationale: ἱμάτια는 일반적으로 ‘옷’ 또는 ‘겉옷’이지만, 여기서는 통상적 애도 행위 묘사이므로 문맥상 넓게 ‘옷’을 사용했습니다.
theological_decisions:
- issue: 애도 의식의 누적 표현을 어떻게 살릴지
  chosen_reading: 금식, 베옷, 재, 옷 찢음의 네 행위를 모두 병렬로 유지했습니다.
  alternative_readings:
  - 두세 개의 행위로 묶어 간단히 처리
  - ‘재와 베옷’처럼 전통적 관용구로 축약
  rationale: 원문은 애도와 통회 행동을 연속적으로 나열하므로, 각 행위를 분리해 독자가 장면의 강도를 그대로 느끼도록 했습니다.
  doctrine_reference: 문맥상 역사 서술의 애도 표지이며 교리적 쟁점은 없습니다.
