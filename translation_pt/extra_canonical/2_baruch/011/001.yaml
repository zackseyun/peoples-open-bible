  yaml_path: translation/extra_canonical/2_baruch/011/001.yaml
  text: 'Then I, Baruch, said: “And I said to you, O Babylon: ‘If you had prospered, and Zion had dwelt in her glory, our grief would still have been great that you had been made equal to Zion. But now, behold, the grief is infinite and the lamentation beyond measure, because Babylon has prospered and Zion lies desolate. For who can judge concerning these things, or to whom shall we complain about what has come upon us? O Lord, how have you endured it? Our fathers went to rest without grief, and behold, the righteous sleep quietly in the earth, because they did not know this distress, nor had they heard what has happened to us. Would that you had ears, O earth, and that you had a heart, O dust, so that you might go and announce in Sheol and say to the dead, ‘Blessed are you more than we who live.’”'
translation:
  language: pt
  text: 'Então eu, Baruque, disse: “E eu te disse, ó Babilônia: ‘Se tivesses prosperado e Sião tivesse permanecido em sua glória, ainda assim nossa dor teria sido grande, por teres sido igualada a Sião. Mas agora, eis que a dor é infinita e a lamentação, sem medida, porque Babilônia prosperou, enquanto Sião jaz desolada. Pois quem pode julgar estas coisas? Ou a quem apresentaremos nossa queixa pelo que nos sobreveio? Ó Senhor, como suportaste isso? Nossos pais foram repousar sem dor, e eis que os justos dormem tranquilamente na terra, porque não conheceram esta aflição nem ouviram falar do que nos aconteceu. Quem dera tivesses ouvidos, ó terra, e coração, ó pó, para que pudesses ir anunciar no Sheol e dizer aos mortos: ‘Felizes são vocês, mais do que nós, que estamos vivos.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡ̇ܪ ܐܢܐ ... ܗ̣ܘ ܐܢܐ ܒܪܘܟ
  choice: Então eu, Baruque, disse
  rationale: Mantém a apresentação do falante e a continuação narrativa em português corrente, sem tentar reconstruir além do que permite a passagem siríaca de leitura difícil.
- source_word: ܒܒܠ
  choice: Babilônia
  rationale: Preserva a cidade personificada como destinatária direta do lamento.
- source_word: ideia de prosperidade aplicada à Babilônia
  choice: prosperado / prosperou
  rationale: Conserva o contraste entre o êxito da Babilônia e a desolação de Sião, sem acrescentar uma avaliação moral explícita.
- source_word: ܨܗܝܘܢ
  choice: Sião
  rationale: Emprega a forma bíblica portuguesa consagrada e conserva a personificação da cidade.
- source_word: linguagem de desolação referente a Sião
  choice: jaz desolada
  rationale: Expressão solene e natural que mantém tanto a imagem de abatimento quanto o caráter poético do lamento.
- source_word: verbo de suportar aplicado ao Senhor
  choice: como suportaste isso?
  rationale: Expressa a perplexidade de Baruque diante da tolerância divina sem transformar a pergunta em uma acusação mais forte.
- source_word: idiomas de repouso e sono para os mortos
  choice: foram repousar / dormem tranquilamente
  rationale: Conserva o paralelismo e o eufemismo solene para a morte.
- source_word: ܫܝܘܠ
  choice: Sheol
  rationale: Mantém o termo antigo para o domínio dos mortos, evitando substituí-lo por uma equivalência teologicamente mais interpretativa.
theological_decisions:
- issue: Designação do domínio dos mortos
  choice: Sheol
  alternative: sepultura; Hades
  rationale: A transliteração preserva o horizonte judaico antigo do texto e não impõe uma sistematização posterior da vida após a morte.
- issue: Pergunta dirigida ao Senhor
  choice: Ó Senhor, como suportaste isso?
  alternative: Ó Senhor, como pudeste permitir isso?
  rationale: A formulação preserva a tensão e a perplexidade do lamento sem tornar explícita uma acusação causal que o texto não exige.
- issue: Linguagem de felicidade aplicada aos mortos
  choice: Felizes são vocês, mais do que nós, que estamos vivos
  alternative: Vocês são mais bem-aventurados do que nós, os vivos
  rationale: Mantém a força comparativa e paradoxal do lamento sem converter a exclamação em uma doutrina geral sobre o estado dos mortos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se as apóstrofes, as personificações de Babilônia, Sião, terra e pó, e o tom poético de lamentação. A segunda pessoa dirigida a Babilônia e à terra usa “você” por clareza internacional contemporânea; a fala dirigida ao Senhor conserva “suportaste”, de registro bíblico solene.
