  from: Hear[a], my people, and I will testify against you; O Israel[b], if you would listen to me!
  to: Listen, my people, and I will warn you; Israel, if only you would listen to me!
  rationale: In this covenantal admonition, the Hiphil of עוד can naturally be rendered “warn.” “If only” accurately expresses the optative force of אִם. But the Hebrew conjunction should remain coordination (“and I will warn you”), not be recast as the more interpretive temporal/subordinate “as I warn you.” Repeating “listen” usefully preserves the verbal echo.
