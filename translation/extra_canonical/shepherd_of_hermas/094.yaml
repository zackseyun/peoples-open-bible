    κατοικοῦσαι ὅλον τὸν κόσμον. ἐκηρύχθη οὖν εἰς ταύτας ὁ υἱὸς τοῦ Θεοῦ διὰ τῶν ἀποστόλων.
    2. Διατί δὲ ποικίλα, καὶ ἄλλη καὶ ἄλλη ἰδέα ἐστὶ τὰ ὄρη, δήλωσόν μοι, κύριε. Ἄκουε,
    φησίν. αἱ δώδεκα φυλαὶ αὗται αἱ κατοικοῦσαι ὅλον τὸν κόσμον δώδεκα ἔθνη εἰσί.
    ποικίλα δέ εἰσι τῇ φρονήσει καὶ τῷ νοΐ· οἷα οὖν εἶδες τὰ ὄρη ποικίλα, τοιαῦταί
    εἰσι καὶ τούτων αἱ ποικιλίαι τοῦ νοὸς τῶν ἐθνῶν καὶ ἡ φρόνησις. δηλώσω δέ σοι
    καὶ ἑνὸς ἑκάστου τὴν πρᾶξιν. 3. Πρῶτον, φημί, κύριε, τοῦτο δήλωσον, διατί οὕτω
    ποικίλα ὄντα τὰ ὄρη, εἰς τὴν οἰκοδομὴν ὅταν ἐτέθησαν οἱ λίθοι αὐτῶν, μιᾷ χρόᾳ
    ἐγένοντο λαμπροί, ὡς καὶ οἱ ἐκ τοῦ βυθοῦ ἀναβεβηκότες λίθοι; 4. Ὅτι, φησί, πάντα
    τὰ ἔθνη τὰ ὑπὸ τὸν οὐρανὸν κατοικοῦντα ἀκούσαντα καὶ πιστεύσαντα ἑνὶ ὀνόματι ἐκλήθησαν
    [τοῦ υἱοῦ] τοῦ Θεοῦ. λαβόντες οὖν τὴν σφραγῖδα μίαν φρόνησιν ἔσχον καὶ ἕνα νοῦν,
    καὶ μία πίστις αὐτῶν ἐγένετο καὶ [μία] ἀγάπη, καὶ τὰ πνεύματα τῶν παρθένων μετὰ
    τοῦ ὀνόματος ἐφόρεσαν· διὰ τοῦτο ἡ οἰκοδομὴ τοῦ πύργου μιᾷ χρόᾳ ἐγένετο λαμπρὰ
    ὡς ὁ ἥλιος. 5. μετὰ δὲ τὸ εἰσελθεῖν αὐτοὺς ἐπὶ τὸ αὐτὸ καὶ γενέσθαι ἓν σῶμα, τινὲς
    ἐξ αὐτῶν ἐμίαναν ἑαυτοὺς καὶ ἐξεβλήθησαν ἐκ τοῦ γένους τῶν δικαίων, καὶ πάλιν
    ἐγένοντο οἷοι πρότερον ἦσαν, μᾶλλον δὲ καὶ χείρονες.
