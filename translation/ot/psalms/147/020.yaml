  rationale: The source text uses the short form יָהּ, not the full tetragrammaton יְהוָה. The doctrine excerpt specifies transliterating names and gives 'the LORD' as the default specifically for YHWH. Here, preserving 'Yah' best reflects the actual Hebrew form while keeping the acclamation transparent.
