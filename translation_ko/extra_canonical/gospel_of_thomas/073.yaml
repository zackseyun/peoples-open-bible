base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/073.yaml
  text: Jesus said[1], "The harvest indeed is plentiful, but the workers are few. Beseech the master, then[2], that he may send out workers to the harvest."
  footnotes:
  - marker: '1'
    text: Unlike the canonical parallels in Matthew 9:38 and Luke 10:2, Thomas lacks the phrase 'of the harvest' after 'master' (or 'Lord'), and lacks 'his' before the final 'harvest'.
    reason: textual_variant
  - marker: '2'
    text: The Coptic ⲡϫⲟⲉⲓⲥ (pjoeis) can be translated as 'the Lord' or 'the master'. In the context of an agricultural estate, 'master' is used here.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “추수는 참으로 많으나 일꾼은 적습니다. 그러므로 주인[a]께서 일꾼들을 추수할 곳으로 내보내시도록 간청하십시오.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ⲡϫⲟⲉⲓⲥ는 ‘주님’ 또는 ‘주인’으로 옮길 수 있습니다. 여기서는 추수와 일꾼의 비유적 맥락을 고려하여 ‘주인’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 마태복음 9:38과 누가복음 10:2의 평행 구절과 달리, 이 말씀에는 ‘추수의’라는 말이 ‘주인’ 뒤에 없고, 마지막 ‘추수’ 앞에도 ‘그의’라는 말이 없습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲱϩⲥ
  english_pob_choice: harvest
  chosen_korean: 추수
  alternatives_korean:
  - 수확
  - 걷이
  lexicon: Crum 283a
  rationale: 농경 맥락의 표준어로서 ‘추수’가 가장 자연스럽고, POB의 harvest를 직접적으로 반영합니다.
- source_word: ⲛⲁϣⲱϥ
  english_pob_choice: plentiful
  chosen_korean: 참으로 많지만
  alternatives_korean:
  - 풍성하지만
  - 많지만
  - 풍부하지만
  lexicon: Crum 242a
  rationale: ‘plentiful’의 양감과 대비를 살리되 한국어에서는 수량 표현으로 자연스럽게 풀어 ‘참으로 많지만’으로 옮겼습니다.
- source_word: ⲥⲟⲃⲕ
  english_pob_choice: few
  chosen_korean: 적습니다
  alternatives_korean:
  - 몇 되지 않습니다
  - 적습니다
  - 소수입니다
  lexicon: Crum 320b
  rationale: 짧고 분명한 대조를 위해 평서형 ‘적습니다’로 처리했습니다.
- source_word: ⲥⲟⲡⲥ
  english_pob_choice: Beseech
  chosen_korean: 간청하십시오
  alternatives_korean:
  - 간구하십시오
  - 청하십시오
  - 애원하십시오
  - 빌십시오
  lexicon: Crum 351b
  rationale: 단순한 요청보다 긴급하고 간절한 뉘앙스가 있어 ‘간청하십시오’가 가장 잘 맞습니다.
- source_word: ⲡϫⲟⲉⲓⲥ
  english_pob_choice: master
  chosen_korean: 주인
  alternatives_korean:
  - 주님
  - 주
  - 주인
  lexicon: Crum 785a
  rationale: 영문 POB가 농경/소유 맥락을 따라 ‘master’를 택한 점을 반영해, 신학적 호칭보다 관계적·서사적 의미가 드러나는 ‘주인’으로 옮겼습니다.
theological_decisions:
- issue: ⲡϫⲟⲉⲓⲥ의 호칭성
  chosen_reading: 여기서는 예배적 호칭인 ‘주님’보다, 농장 비유의 맥락을 살린 ‘주인’으로 번역했습니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 토마스복음의 이 말씀은 추수와 일꾼의 비유적 장면 안에 놓여 있으므로, 인격적 신앙 고백을 앞세우기보다 본문이 드러내는 소유자/지배자의 의미를 우선하는 것이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 문맥 우선 원칙
