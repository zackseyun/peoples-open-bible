base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/019.yaml
  text: 'Abijah pursued Jeroboam and captured from him cities: Bethel and its daughter towns, Jeshanah and its daughter towns, and Ephron and its daughter towns.'
translation:
  language: ko
  text: 아비야는 여로보암을 추격하여 그에게서 여러 성읍을 점령했습니다. 그 성읍들은 벧엘과 그에 딸린 촌락들, 여사나와 그에 딸린 촌락들, 에브론과 그에 딸린 촌락들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף ... אַחֲרֵי
  english_pob_choice: pursued
  chosen_korean: 뒤쫓아
  alternatives_korean:
  - 추격하여
  - 추적하여
  lexicon: רדף
  rationale: 전투 서술의 진행을 살리면서도 현대 한국어에서 자연스럽고 직접적인 동작성을 유지하기 위해 ‘뒤쫓아’로 옮겼습니다.
- source_word: וַיִּלְכֹּד
  english_pob_choice: captured
  chosen_korean: 점령했는데
  alternatives_korean:
  - 함락시켰는데
  - 사로잡았는데
  lexicon: לכד
  rationale: 성읍을 대상으로 한 정복 동사이므로 ‘점령하다’가 가장 정확하며, 문장 연결을 위해 과거 서술형으로 정리했습니다.
- source_word: עָרִים ... בֵּית אֵל ... יְשָׁנָה ... עֶפְרוֹן
  english_pob_choice: cities
  chosen_korean: 성읍들
  alternatives_korean:
  - 도시들
  - 읍들
  lexicon: עיר
  rationale: 본문의 개별 지명이 단순 나열이 아니라 그 주변의 부속 촌락까지 포함한 행정·거점 단위를 가리키므로, 고전적이지만 의미를 잘 보존하는 ‘성읍들’을 택했습니다.
- source_word: וּבְנוֹתֶיהָ
  english_pob_choice: daughter towns
  chosen_korean: 그에 딸린 촌락들
  alternatives_korean:
  - 주변 마을들
  - 속한 촌락들
  lexicon: בנות
  rationale: 직역의 이미지인 ‘딸들’보다 한국어에서 의미가 분명한 ‘딸린 촌락들’로 옮겨, 본문이 말하는 종속 촌락의 개념을 드러냈습니다.
