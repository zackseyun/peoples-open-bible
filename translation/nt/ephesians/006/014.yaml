- issue: Rendering δικαιοσύνη in a Pauline armor metaphor
  chosen_reading: righteousness
  alternative_readings:
  - justice
  rationale: The project default for δικαιοσύνη is 'righteousness,' with 'justice' preserved in a footnote for Pauline passages. In this context, 'righteousness' fits the established metaphor and common Pauline usage without excluding the ethical/public dimension carried by 'justice.'
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη → righteousness; preserve ''justice'' in footnotes for Pauline passages'
revisions:
- timestamp: '2026-04-21T03:13:53Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
