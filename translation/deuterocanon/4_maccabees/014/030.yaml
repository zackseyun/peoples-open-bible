  meaning_decisions:
  - source_phrase: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
    prior_rendering: so many impulses of motherly love
    new_rendering: so many claims of motherly love
    rationale: The preceding verses enumerate grounds for affection—pregnancy, birth pains, and the sons’ virtues—not merely passing emotional impulses.
  - source_phrase: εἰς συμπάθειαν ἑλκόντων
    prior_rendering: were drawing ... toward sympathy
    new_rendering: drew ... toward compassion
    rationale: Here the feeling is the mother’s tender response to suffering, not agreement with another person’s position.
  - source_phrase: αἱ παντοίκιλοι βάσανοι
    prior_rendering: the all-varied tortures
    new_rendering: tortures of every kind
    rationale: This conveys the exhaustive variety of the tortures without an unnatural English compound.
  - source_phrase: ἐπʼ οὐδενὸς αὐτῶν
    prior_rendering: by any one of them
    new_rendering: in the case of even one of her sons
    rationale: The distributive phrase most naturally concerns her response to each son’s torture, leading into the individual and collective exhortations in verse 31; the other possible antecedent is noted.
