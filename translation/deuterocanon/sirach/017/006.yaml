  chosen_reading: Rendered as 'good and evil'
  alternative_readings:
  - good things and bad things
  rationale: In context the verse describes human cognitive and moral capacity given by God. The traditional and contextually strongest sense is moral discernment, not merely awareness of advantageous and disadvantageous things.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition
