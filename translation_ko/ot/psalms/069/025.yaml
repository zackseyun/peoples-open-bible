  lexicon: HALOT
  rationale: 히브리어 שׁפךְ의 ‘쏟다/붓다’ 이미지를 살리되, 분노를 액체처럼 비우는 비유가 자연스럽게 드러나도록 ‘쏟아 내시고’로 옮겼습니다.
- source_word: עֲלֵיהֶם
