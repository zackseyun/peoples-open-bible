  text: 주 하나님께서 이렇게 말씀하십니다. “적이 너희를 두고 ‘아하!’ 하며, ‘옛 높은 곳들이 우리의 소유가 되었다’고 말하였기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님 야훼
  lexicon: 아도나이 + 야훼
  rationale: 원문은 주권 호칭 아도나이와 고유 신명 야훼를 결합한 공식이며, 한국어 본문은 예배적 존칭을 유지하면서도 고유명은 문맥상 ‘주 하나님’으로 자연스럽게 옮겼습니다.
- source_word: הָאוֹיֵב
  english_pob_choice: the enemy
  chosen_korean: 적
  alternatives_korean:
  - 원수
  - 대적
  lexicon: ויב/적대자 일반명사
  rationale: 문맥상 집단적 적대 세력을 가리키는 일반 명사이므로, 현대 한국어에서 간결하고 직설적인 ‘적’이 원문의 대립 구조를 가장 잘 드러냅니다.
- source_word: הֶאָח
  english_pob_choice: Aha!
  chosen_korean: 아하!
  alternatives_korean:
  - 하하!
  - 좋다!
  lexicon: 감탄사
  rationale: 조롱과 승리의 감탄을 나타내는 감탄사로서, 한국어에서도 동일한 음성적·정서적 효과를 지닌 ‘아하!’가 가장 직접적입니다.
- source_word: בָמֹות עוֹלָם
  english_pob_choice: the ancient heights
  chosen_korean: 옛 산당들
  alternatives_korean:
  - 옛 높은 곳들
  - 영원한 산당들
  - 오래된 산당들
  lexicon: במה
  rationale: POB의 ‘ancient heights’는 단순한 지리적 ‘높은 곳’보다 우상숭배 장소로서의 산당을 염두에 둔 표현이므로, 문맥의 종교적 뉘앙스를 살려 ‘옛 산당들’로 옮겼습니다.
theological_decisions:
- issue: ‘the ancient heights’의 의미 범위
  chosen_reading: 지리적 고도보다 이스라엘의 옛 산당/예배 장소에 대한 조롱 섞인 점유 선언으로 읽었습니다.
  alternative_readings:
  - 옛 언덕들
  - 영원한 언덕들
  rationale: 히브리어 בָּמוֹת은 예언서에서 우상숭배와 연관된 산당을 자주 가리키므로, 문맥상 단순한 지형이 아니라 종교적 점유를 암시하는 독법이 더 강합니다.
  doctrine_reference: Ezekiel 36:2의 심판-회복 문맥
