lexical_decisions:
- source_word: statim non conparescebant
  english_pob_choice: they immediately disappeared
  chosen_korean: 그들은 곧 사라졌습니다
  alternatives_korean:
  - 그들은 즉시 사라졌습니다
  - 그들은 곧 보이지 않게 되었습니다
  lexicon: statim / conparescebant
  rationale: lat. statim의 즉각성을 살리되, 본문이 형상적 소멸을 말하므로 자연스러운 ‘사라졌습니다’로 옮겼습니다.
- source_word: Nam et
