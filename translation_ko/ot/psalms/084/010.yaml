id: PSA.84.10
reference: Psalms 84:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מָ֭גִנֵּ/נוּ רְאֵ֣ה אֱלֹהִ֑ים וְ֝/הַבֵּ֗ט פְּנֵ֣י מְשִׁיחֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/010.yaml
  text: For a day in your courts is better than a thousand[a]; I would rather stand at the threshold[b] in the house of my God than dwell in the tents of wickedness.
  footnotes:
  - marker: a
    text: Or 'our protector.' The Hebrew reads 'our shield,' a poetic metaphor that may refer either to God as protector or to the king.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your anointed.' The word is the same root behind 'Messiah'; here it likely refers first to the Davidic king, with possible broader messianic resonance.
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 뜰들에서 보내는 하루가 천보다 더 낫습니다.[b] 나는 내 하나님의 집 문지방에 서 있기를 택하겠습니다,[a] 악의 장막들에 사는 것보다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 내 하나님의 집 문지방에 있기를 택하였습니다.’ 전통적으로는 ‘내 하나님의 집에서 문지기로 있기를 원합니다’라고 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단지 ‘천보다’라고 합니다. 일부 번역은 ‘다른 곳에서의 천 [날]보다’라고 보충하지만, ‘다른 곳’이나 ‘날’은 본문에 없습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנֵּנוּ
  english_pob_choice: our shield
  chosen_korean: 우리의 방패
  alternatives_korean:
  - 우리의 보호자
  lexicon: HALOT
  rationale: מָגֵן은 문자적으로 ‘방패’이며, 시적 기도문에서는 보호자를 가리키는 비유일 수 있지만, 원문의 구체적 이미지를 살려 ‘방패’로 옮겼습니다.
- source_word: רְאֵה
  english_pob_choice: look on
  chosen_korean: 살피소서
  alternatives_korean:
  - 보소서
  - 돌보소서
  lexicon: HALOT
  rationale: 명령형 ראה는 단순 시각이 아니라 호의적이고 응답하는 관심을 구하는 청원으로, 하나님께 드리는 정중한 기도체 ‘살피소서’가 이를 잘 드러냅니다.
- source_word: מְשִׁיחֶךָ
  english_pob_choice: your anointed
  chosen_korean: 당신의 메시아
  alternatives_korean:
  - 당신의 기름부음 받은 이
  - 당신의 기름부음 받은 자
  lexicon: HALOT
  rationale: מָשִׁיחַ는 ‘기름부음 받은 자’라는 뜻이지만, POB의 어휘 결정처럼 메시아라는 어근 연결을 살리되, 시편의 직접적 문맥이 다윗 왕을 가리킬 수 있음을 해치지 않도록 주해적 용어로 유지했습니다.
theological_decisions:
- issue: ‘우리의 방패’의 지시 대상
  chosen_reading: 지시 대상을 해명하지 않고 비유를 그대로 유지했습니다.
  alternative_readings:
  - 하나님을 ‘우리의 방패’로 이해하는 번역
  - 왕을 ‘우리의 방패’로 이해하는 번역
  rationale: 히브리어는 의도적으로 모호할 수 있으므로, 본문이 지닌 시적 긴장을 해소하지 않고 그대로 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: מְשִׁיחֶךָ의 번역에서의 대문자/기독론화
  chosen_reading: ‘당신의 메시아’로 옮기되, 본문 자체에서 기독론적 확정을 하지는 않았습니다.
  alternative_readings:
  - 당신의 그리스도
  - 당신의 기름부음 받은 이
  rationale: 원문은 우선 다윗 왕을 가리킬 가능성이 크며, 번역 본문에서 지나친 신학적 특정화를 피하면서 어근 연결은 살렸습니다.
  doctrine_reference: 'Translation philosophy §2: Translate titles; transliterate names; source primacy over tradition.'
