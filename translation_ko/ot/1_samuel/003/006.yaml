revisions:
- from: 그때 야훼께서 사무엘을 다시 부르셨습니다. 사무엘이 일어나 엘리에게 가서 말했습니다. “여기 있습니다. 당신이 저를 부르셨기 때문입니다.” 그러자 엘리가 말했습니다. “나는 부르지 않았다, 내 아들아. 돌아가 누워라.”
  to: 그때 야훼께서 다시 사무엘을 부르셨습니다. 사무엘이 일어나 엘리에게 가서 말했습니다. “여기 있습니다. 당신이 저를 부르셨기 때문입니다.” 그러자 엘리가 말했습니다. “제가 부르지 않았습니다, 내 아들아. 돌아가서 누우십시오.”
  rationale: 원문의 사건 순서, 반복 호출, 친밀한 호칭, 그리고 ‘돌아가/누워라’의 연속 명령을 보존했습니다. 안전한 문체 교정으로 엘리의 발화를 합쇼체로 통일했으며, 두 명령의 관계를 한국어에서 자연스럽게 드러내기 위해 ‘돌아가서 누우십시오’로 옮겼습니다.
