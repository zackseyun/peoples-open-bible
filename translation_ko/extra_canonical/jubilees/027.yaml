base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/027.yaml
  text: '1[v22]. And it was told to Rebekah in a dream the words of Esau her older son. And Rebekah sent and called Jacob her younger son and said to him, “Look, Esau your brother is threatening you so as to kill you.

    2. And now, my son, listen to my voice. Rise and flee to Laban my brother, to Haran, and stay with him a few days, until your brother’s anger turns away,

    3. and until your brother’s anger leaves you and he forgets all that you did to him. Then I will send and bring you back from there.”

    4. And Jacob said, “I am not afraid. If he wants to kill me, I will kill him.”

    5. And she said to him, “Let me not be bereaved of both my sons in one day.”

    6. And Jacob said to Rebekah his mother, “Look, you know that my father has become old and does not see, because his eyes are dim. And if I leave him, it will be evil in his sight, because I have left him and gone away from you,

    7[v22]. and my father will be angry and curse me. I will not go; only if he sends me will I go.”

    8. And Rebekah said to Jacob, “I will go in and speak, and he will send you.”

    9. And Rebekah went in and said to Isaac, “I loathe my life because of the two daughters of Heth whom Esau has taken for himself as wives.

    10. And if Jacob takes a wife from among the daughters of the land like these, why should I still live? For the daughters of Canaan are evil.”

    11. And Isaac called Jacob and blessed him and charged him and said to him, “Do not take a wife for yourself from any of the daughters of Canaan.

    12. Rise and go to Mesopotamia, to the house of Bethuel, your mother’s father, and take for yourself a wife from there, from the daughters of Laban, your mother’s brother.

    13. And may God Almighty bless you and make you fruitful and multiply you, and may you become an assembly of nations.

    14. And may he give to you the blessing of my father Abraham, to you and to your seed after you, so that you may inherit the land of your sojourning and all the land that God gave to Abraham. Go, my son, in peace.”

    15. And Isaac sent Jacob away, and he went to Mesopotamia, to Laban son of Bethuel the Syrian, the brother of Rebekah, Jacob’s mother.

    16. And after Jacob had risen to go to Mesopotamia, the spirit of Rebekah was grieved after her son, and she wept.

    17. And Isaac said to Rebekah, “My sister, do not weep because of Jacob my son, for he will go in peace and return in peace.

    18. The Most High God will guard him from every evil and will be with him, for he will not forsake him all his days.

    19. For I know that his ways will prosper in everything wherever he goes, until he returns to us in peace and we see him in peace.

    20. Do not fear for him, my sister, for he is upright in his ways, and he is a complete man, and he is faithful. Do not weep.”

    21. And Isaac comforted Rebekah concerning Jacob her son, and he blessed him.

    22. And Jacob went out from the Well of the Oath to go to Haran in the first year of the second week of the forty-fourth jubilee. And he came to Luz, which is in the mountains, that is, Bethel, on the new moon of the first month of this week. And he came to the place at evening, and he turned aside from the road on that night, and he slept there, because the sun had set.

    23. And he took one of the stones of that place and put it under the tree, and he was there alone, and he slept.

    24. And he dreamed that night, and look, a ladder was set up on the earth, and its top reached to heaven. And look, the angels of the Lord were going up and coming down on it, and look, the Lord stood upon it.

    25. And he spoke with Jacob and said, “I am the Lord, the God of Abraham your father and the God of Isaac. The land on which you are sleeping I will give to you and to your seed after you.

    26. And your seed will be like the dust of the earth, and you will spread out to the west and the east and the north and the south. And in you and in your seed all the families of the nations will be blessed.

    27. And look, I will be with you and will keep you wherever you go, and I will bring you back into this land in peace. For I will not leave you until I have done everything that I have told you.”

    28. And Jacob awoke from his sleep and said, “Truly the house of the Lord is this place, and I did not know it.” And he was afraid and said, “How awesome this place is! This is nothing other than the house of the Lord, and this is the gate of heaven.”

    29. And Jacob rose early in the morning and took the stone that he had put by his head, and he set it up as a pillar for a sign, and he poured oil on its top. And he called the name of that place Bethel, though formerly the name of that region was Luz.

    30. And Jacob prayed a prayer to the Lord, saying, “If the Lord is with me and keeps me on this road on which I am going, and gives me bread to eat and clothing to wear,

    31. and I return to my father’s house in peace, then the Lord will be my God, and this stone that I have set up as a pillar for a sign in this place will be the house of the Lord. And of everything that you give me, I will surely give a tenth to you[v24][v24][v23], my God.”'
  footnotes:
  - marker: v22
    text: 'The chronological phrase is technical Jubilees language: ''the first year of the second week of the forty-fourth jubilee.'' Here ''week'' refers to a seven-year unit within jubilee reckoning, not an ordinary seven-day week.'
    reason: cultural_note
  - marker: v22
    text: The place-name in the source is given as 'the Well of the Oath,' corresponding to Beersheba.
    reason: cross_reference
  - marker: v23
    text: The clause rendered 'put it under the tree' is textually difficult in this Ethiopic row and may reflect a segmentation or transmission issue. A more expected parallel would place the stone under or at his head.
    reason: segmentation_note
  - marker: v24
    text: The expression translated 'ladder' could also be understood more broadly as a stairway or stepped ascent.
    reason: lexical_alternative
  - marker: v24
    text: The final clause literally places the Lord 'upon it' or 'in/over it'; the exact spatial relation is not entirely certain in the Ethiopic wording.
    reason: alternative_reading
translation:
  language: ko
  text: '1. 리브가의 맏아들 에서에 관한 일이 꿈에 리브가에게 알려졌습니다. 리브가는 사람을 보내어 작은아들 야곱을 불러 그에게 말했습니다. “보아라, 네 형 에서가 너를 죽이려고 네게 원한을 품고 있다.”

    2. 이제, 내 아들아, 내 말을 들으십시오. 일어나 하란에 있는 내 형제 라반에게로 도망하여, 네 형제의 분노가 누그러질 때까지 그와 함께 며칠 동안 머무르십시오.

    3. 그리고 네 형제가 너를 향한 분노를 거두고, 네가 그에게 한 모든 일을 잊을 때까지입니다. 그러면 내가 사람을 보내어 거기에서 너를 다시 데려오겠습니다.”

    4. 야곱이 말했습니다. “저는 두렵지 않습니다. 그가 저를 죽이고자 한다면, 저는 그를 죽일 것입니다.”

    5. 그녀가 그에게 말했습니다. “제가 하루에 제 두 아들을 모두 잃지 않게 해 주십시오.”

    6. 야곱이 그의 어머니 레베카에게 말했습니다. “보십시오, 아버지께서 늙으셔서 보지 못하신다는 것을 어머니도 아십니다. 아버지의 눈이 흐려졌기 때문입니다. 제가 아버지를 떠나면, 제가 아버지를 버리고 어머니 곁을 떠나갔기 때문에 아버지께서 보시기에 악한 일이 될 것입니다.”

    7. “아버지께서 화를 내시고 저를 저주하실 것입니다. 저는 가지 않겠습니다. 아버지께서 저를 보내실 때에만 가겠습니다.”

    8. 리브가가 야곱에게 말했습니다. “제가 들어가서 말하겠습니다. 그러면 그가 너를 보낼 것입니다.”

    9. 리브가가 들어가서 이삭에게 말했습니다. “저는 에서가 자기 아내로 삼은 헷 사람의 두 딸 때문에 제 삶이 몹시 싫습니다.”

    10. «야곱이 이 땅의 딸들 가운데서 이들과 같은 여자를 아내로 맞이한다면, 제가 왜 더 살아야 합니까? 가나안의 딸들은 악하기 때문입니다.»

    11. 이삭이 야곱을 불러 그에게 복을 주고 명령하고 말하였습니다. “가나안의 딸들 중 누구도 아내로 맞이하지 마십시오.”

    12. 일어나 메소포타미아, 곧 네 어머니의 아버지 브두엘의 집으로 가십시오. 그곳에서 네 어머니의 형제 라반의 딸들 가운데 한 사람을 아내로 맞이하십시오.

    13. 전능하신 하나님께서 네게 복을 주시고, 너를 생육하게 하시며 번성하게 하시고, 네가 여러 민족의 무리가 되게 하시기를 바란다.

    14. 그분께서 내 아버지 아브라함의 축복들을 너와 네 뒤를 이을 네 씨에게 주셔서, 네가 네가 나그네로 머무는 땅과 하나님께서 아브라함에게 주신 모든 땅을 상속받게 하시기를 바랍니다. 가십시오, 내 아들아. 평안히.

    15. 이스삭이 야곱을 떠나보내고, 야곱은 메소포타미아로 가서 시리아 사람 밧우엘의 아들 라반, 곧 야곱의 어머니 리브가의 형제에게 갔습니다.

    16. 야곱이 메소포타미아로 가려고 일어난 뒤, 리브가의 영은 자기 아들을 두고 슬퍼하였으며, 리브가는 울었습니다.

    17. 이삭이 리브가에게 말했습니다. “내 누이여, 내 아들 야곱 때문에 울지 마십시오. 그가 평안히 갈 것이며 평안히 돌아올 것입니다.”

    18. 지극히 높으신 하나님께서는 그의 모든 날 동안 그를 버리지 않으실 것이므로, 그를 모든 악에서 지키시고 그와 함께 계실 것입니다.

    19. 그가 평안히 우리에게 돌아와 우리가 평안히 그를 볼 때까지, 그가 어디로 가든지 그의 길이 모든 일에서 형통할 것을 나는 압니다.

    20. 그를 두고 두려워하지 마십시오, 내 누이여. 그는 자기 길에서 바르고, 흠 없는 사람이며, 신실하고, 버려지지 않을 것입니다. 울지 마십시오.

    21. 이삭은 아들 야곱에 관하여 리브가를 위로하고 야곱을 축복했습니다.

    22. 야곱은 제44희년 둘째 주간 첫해에 맹세의 우물에서 나와 하란으로 가려고 했습니다. 그는 그 주간 첫째 달 초하루에 산지에 있는 루스, 곧 벧엘에 도착했습니다. 그리고 저녁에 어떤 곳에 이르러, 그날 밤 자기 길에서 벗어나 길 서쪽으로 비켜갔습니다. 해가 졌으므로 그는 거기서 잠들었습니다.

    23. 그리고 그는 그곳의 돌들 가운데 하나를 가져다가 그 나무 아래에 두었고, 홀로 여행하고 있었습니다. 그리고 잠들었습니다.

    24. 그 밤에 그가 꿈을 꾸었습니다. 보라, 사닥다리가 땅 위에 놓여 있었고 그 꼭대기는 하늘에 닿아 있었습니다. 보라, 하나님의 천사들이 그 사닥다리 위로 오르내리고 있었고, 보라, 하나님께서 그 사닥다리 위에 서 계셨습니다.

    25. 그가 야곱에게 말씀하셨습니다. 「나는 주님입니다. 나는 네 조상 아브라함의 하나님이며 이삭의 하나님입니다. 네가 누워 자고 있는 이 땅을 내가 너와 네 뒤를 이을 네 씨에게 주겠습니다.」

    26. 그리고 당신의 씨는 땅의 티끌처럼 될 것이며, 당신은 바다 쪽과 동쪽과 북쪽과 남쪽으로 퍼질 것입니다. 그리고 당신과 당신의 씨 안에서 모든 민족의 땅이 복을 받을 것입니다.

    27. 보십시오, 내가 당신과 함께 있을 것이며 당신이 어디로 가든지 당신을 지켜 주고, 당신을 이 땅으로 평안히 데려오겠습니다. 내가 당신에게 말한 모든 것을 이루기까지는 당신을 버리지 않겠습니다.

    28. 야곱은 잠에서 깨어나 말했습니다. 「분명히 이곳은 주님의 집인데, 내가 알지 못했습니다.」 그는 두려워하며 말했습니다. 「이곳이 얼마나 두려운 곳입니까! 이곳은 주님의 집 외에 다른 곳이 아니며, 이곳은 하늘의 문입니다.」

    29. 야곱은 아침 일찍 일어나 자기 머리맡에 두었던 돌을 가져다가, 그것을 표징이 되도록 기둥으로 세우고 그 꼭대기에 기름을 부었습니다. 그는 그곳의 이름을 벧엘이라 불렀는데, 그 지역의 옛 이름은 루스였습니다.

    30. 야곱은 주님께 기도하며 말했습니다. “주님께서 저와 함께하시고, 제가 가는 이 길에서 저를 지켜 주시며, 먹을 빵과 입을 옷을 주신다면,

    31. 그리고 제가 평안히 제 아버지의 집으로 돌아가면, 야훼께서 저의 하나님이 되실 것이며, 제가 표징으로 세운 이 돌은 이곳에서 야훼의 집이 될 것입니다. 또 야훼께서 제게 주시는 모든 것에서 십분의 일을 반드시 야훼께 드리겠습니다, 저의 하나님이시여.'
