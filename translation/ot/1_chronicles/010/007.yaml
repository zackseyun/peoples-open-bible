  from: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
  to: When all the men of Israel in the valley saw that the army had fled and that Saul and his sons were dead, they abandoned their cities and fled. Then the Philistines came and settled in them.
  rationale: The lexical record recognizes both the implicit subject and 'settled' as a possible rendering. Its preference for preserving the subject’s supposed ambiguity is not persuasive in this narrative sequence, where the army’s flight causes the inhabitants’ later flight.
