  from: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
  to: Be assured, I am with you. I will watch over you wherever you go and bring you back to this land. For I will not leave you until I have done what I have promised you.”
