  source_fidelity: 히브리어의 시간 표현(“그때”), 화자·청자, ‘나 혼자서’, 그리고 נָשָׂא의 문맥상 ‘감당하다’는 의미가 충실히 반영되었습니다. לֵאמֹר은 한국어에서 직접 인용을 도입하는 “말했습니다. ‘…’” 구조로 자연스럽게 구현되어, 별도의 ‘말하여 이르기를’ 직역이 필요하지 않습니다.
