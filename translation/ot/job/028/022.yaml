id: JOB.28.22
reference: Job 28:22
source:
  edition: WLC
  text: אֲבַדּ֣וֹן וָ֭/מָוֶת אָ֣מְר֑וּ בְּ֝/אָזְנֵ֗י/נוּ שָׁמַ֥עְנוּ שִׁמְעָֽ/הּ׃
translation:
  text: Destruction[a] and Death say, “Our ears have heard a report of it.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Hebrew Abaddon, “destruction,” also a designation for the realm of the dead.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבַדּוֹן
  chosen: Destruction
  alternatives:
  - Destruction
  lexicon: HALOT
  rationale: The common noun can denote destruction or its realm and is poetically personified here; transliteration as a proper name is unnecessarily specific.
- source_word: וָמָוֶת
  chosen: and Death
  alternatives:
  - and death
  lexicon: HALOT
  rationale: Capitalized 'Death' because the verse personifies it alongside Abaddon as a speaker. The conjunction is simply additive.
- source_word: אָמְרוּ
  chosen: say
  alternatives:
  - said
  lexicon: HALOT
  rationale: Although morphologically perfect, Hebrew poetry often uses the perfect for vivid present or gnomic statement. Present tense fits the immediate poetic context in which various domains are queried about wisdom's whereabouts.
- source_word: בְּאָזְנֵינוּ
  chosen: With our ears
  alternatives:
  - In our ears
  - By our ears
  lexicon: HALOT
  rationale: This preserves the Hebrew hearing image without adding “own.”
- source_word: שָׁמַעְנוּ
  chosen: we have heard
  alternatives:
  - we heard
  lexicon: HALOT
  rationale: English present perfect conveys a past hearing with present relevance, matching the poetic sense that they possess only secondhand knowledge.
- source_word: שִׁמְעָהּ
  chosen: a report of it
  alternatives:
  - its report
  - the rumor of it
  - a mention of it
  lexicon: HALOT
  rationale: This naturally conveys report or hearsay without adding “only.”
