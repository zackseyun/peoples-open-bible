id: 1KI.6.35
reference: 1 Kings 6:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קָלַ֤ע כְּרוּבִים֙ וְ/תִ֣מֹר֔וֹת וּ/פְטֻרֵ֖י צִצִּ֑ים וְ/צִפָּ֣ה זָהָ֔ב מְיֻשָּׁ֖ר עַל הַ/מְּחֻקֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/035.yaml
  text: He carved cherubim and palm trees and open flowers, and overlaid them with gold, fitted over the carved work.
translation:
  language: ko
  text: 그는 그룹들과 종려나무들과 활짝 핀 꽃들을 새기고, 새긴 것 위에 맞추어 금을 입혔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/קָלַ֤ע
  english_pob_choice: He carved
  chosen_korean: 새기고
  alternatives_korean:
  - 조각하고
  - 깎아 만들고
  lexicon: קלע
  rationale: 문맥상 성전 내부 장식에 대한 목공·조각 작업이므로, 단순한 ‘만들다’보다 조각의 손길을 드러내는 ‘새기다’가 원문 동작을 가장 직접적으로 반영합니다.
- source_word: כְּרוּבִים
  english_pob_choice: cherubim
  chosen_korean: 그룹들
  alternatives_korean:
  - 케루빔
  - 천사들
  lexicon: כרוב
  rationale: 한국어 성경 전통에서 כרוב은 ‘그룹’으로 굳어져 있고, 여기서는 성전 장식의 도상적 형상으로 쓰였으므로 그 관용형을 유지했습니다.
- source_word: וְ/תִ֣מֹר֔וֹת
  english_pob_choice: palm trees
  chosen_korean: 종려나무들
  alternatives_korean:
  - 야자나무들
  - 종려들
  lexicon: תמר
  rationale: תמר의 식물명은 문맥과 전통적 식별 모두에서 ‘종려나무’가 가장 분명하며, 성전 장식의 상징적 모티프도 살릴 수 있습니다.
- source_word: וּ/פְטֻרֵ֖י צִצִּ֑ים
  english_pob_choice: open flowers
  chosen_korean: 펼친 꽃들
  alternatives_korean:
  - 핀 꽃들
  - 피어난 꽃들
  lexicon: ציץ
  rationale: ‘열린/펴진 꽃’이라는 형태적 의미를 살려, 장식 무늬의 시각적 상태를 자연스럽게 드러내는 ‘펼친 꽃들’로 옮겼습니다.
- source_word: וְ/צִפָּ֣ה זָהָ֔ב
  english_pob_choice: overlaid them with gold
  chosen_korean: 금을 입혔습니다
  alternatives_korean:
  - 금으로 덮었습니다
  - 금박을 입혔습니다
  lexicon: צפה
  rationale: צפה는 표면을 입히거나 덮는 뜻이므로, 장식 공정의 상태를 분명히 보여 주는 ‘금을 입히다’가 적절합니다.
- source_word: מְיֻשָּׁ֖ר עַל הַ/מְּחֻקֶּֽה
  english_pob_choice: fitted over the carved work
  chosen_korean: 새긴 공작물에 맞게 입혀졌습니다
  alternatives_korean:
  - 새긴 부분 위에 고르게 입혀졌습니다
  - 조각한 것 위에 정확히 덮였습니다
  lexicon: ישר / חקה
  rationale: 영어 POB의 ‘fitted’를 반영하되, 히브리어의 ‘곧게 맞음/정렬됨’과 ‘새긴 것’ 위에 입혀지는 관계를 함께 드러내기 위해 ‘맞게 입혀졌다’로 처리했습니다.
theological_decisions:
- issue: 성전 장식의 묘사에서 의역과 직역의 균형
  chosen_reading: 조각 장식의 형상과 금 입힘의 물리적 관계가 드러나도록 비교적 직역적으로 옮겼습니다.
  alternative_readings:
  - 의장적 의미를 살려 더 유려하게 풀어쓰기
  - 전통적 예배용 어휘로 단순화하기
  rationale: 본문은 신학적 논평보다 성전 내부 장식의 제작 과정을 묘사하므로, 장식의 구체성과 공예적 정밀함을 보존하는 번역이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: 성전 기물/성전 묘사 본문
