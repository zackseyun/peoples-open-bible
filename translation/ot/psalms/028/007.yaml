id: PSA.28.7
reference: Psalms 28:7
source:
  edition: WLC
  text: יְהוָ֤ה עֻזִּ֥/י וּ/מָגִנִּ/י֮ בּ֤/וֹ בָטַ֥ח לִבִּ֗/י וְֽ/נֶ֫עֱזָ֥רְתִּי וַ/יַּעֲלֹ֥ז לִבִּ֑/י וּֽ/מִ/שִּׁירִ֥/י אֲהוֹדֶֽ/נּוּ׀׃
translation:
  text: Yahweh is my strength and my shield; in him my heart trusted, and I was helped. So my heart rejoiced, and with my song I will praise him[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “I will give thanks to him.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: עֻזִּי
  chosen: my strength
  alternatives:
  - my stronghold
  - my might
  lexicon: HALOT
  rationale: The noun עֹז commonly denotes strength or might. 'My strength' is the most direct and idiomatic rendering here, fitting the parallel with 'my shield.'
- source_word: מָגִנִּי
  chosen: my shield
  alternatives:
  - my protector
  lexicon: HALOT
  rationale: מָגֵן is literally 'shield.' The metaphor is transparent in English and should be preserved rather than generalized to 'protector' in the main text.
- source_word: בּוֹ
  chosen: in him
  alternatives:
  - on him
  lexicon: HALOT
  rationale: The preposition ב with בטח can be rendered 'in' or 'on.' 'In him' is idiomatic in English for personal trust and preserves the relational sense.
- source_word: בָטַח
  chosen: trusted
  alternatives:
  - trusted securely
  - put confidence
  lexicon: HALOT
  rationale: The Qal perfect is best represented here as completed trust in the sequence leading to help.
- source_word: לִבִּי
  chosen: my heart
  lexicon: HALOT
  rationale: לֵב/לֵבָב often denotes the inner self, including will and affections. 'My heart' is the standard and fitting rendering in this poetic context.
- source_word: נֶעֱזָרְתִּי
  chosen: I was helped
  alternatives:
  - I have been helped
  - I was given help
  lexicon: HALOT
  rationale: The Niphal perfect denotes help received and naturally takes English past passive form.
- source_word: וַיַּעֲלֹז
  chosen: So my heart rejoiced
  alternatives:
  - exults
  - leaps for joy
  lexicon: HALOT
  rationale: The wayyiqtol continues the prior completed sequence and presents rejoicing as its consequence.
- source_word: וּמִשִּׁירִי
  chosen: with my song
  alternatives:
  - from my song
  - by my song
  - with singing
  lexicon: HALOT
  rationale: The prefixed מִן with שִׁיר likely expresses means or accompaniment in context. 'With my song' is idiomatic and captures the sense that praise is offered in song.
- source_word: אֲהוֹדֶנּוּ
  chosen: I will praise him
  alternatives:
  - I thank him
  - I will give thanks to him
  lexicon: HALOT
  rationale: ידה in the Hiphil can mean 'give thanks' or 'praise.' In parallel with 'my song,' 'I will praise him' best fits the poetic and worshipful context, while the thanksgiving nuance is preserved as an alternative.
