  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: ko
  text: 그러자 야훼께서 사무엘에게 말씀하셨습니다. "보라, 내가 이스라엘 가운데 한 일을 하려고 하는데, 그것을 듣는 사람마다 두 귀가 다 울릴 것입니다."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: 원문 하나님의 이름을 공적 표기인 야훼로 옮겨, 일반적인 호칭인 주님과 구별했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보라
  alternatives_korean:
  - 봐라
  - 이제
  - 자
  lexicon: particle
  rationale: 예언적 주목 촉구의 뉘앙스를 살리기 위해 직설적이되 문어체인 보라를 선택했습니다.
- source_word: דָבָר
  english_pob_choice: a thing
  chosen_korean: 한 일
  alternatives_korean:
  - 일
  - 것
  - 사건
  lexicon: thing/event
  rationale: 막연한 물건이 아니라 야훼께서 이루실 구체적 행위를 가리키므로 한 일로 자연스럽게 옮겼습니다.
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  english_pob_choice: will make both ears of everyone who hears of it tingle
  chosen_korean: 두 귀가 다 울릴 것입니다
  alternatives_korean:
  - 두 귀가 다 저릴 것입니다
  - 두 귀가 쨍할 것입니다
  lexicon: idiom
  rationale: 히브리어의 관용적 반응 표현을 한국어로 직접 재현해, 놀라움과 전율의 의미를 살렸습니다.
