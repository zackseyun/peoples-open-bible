id: SIR.17.20
reference: Sirach 17:20
source:
  edition: lxx-swete-1909
  text: πλὴν μετανοοῦσιν ἔδωκεν ἐπάνοδον, καὶ παρεκάλεσεν ἐκλείποντας ὑπομονήν.
  language: Greek
  pages:
  - 681
  - 692
  - 693
  - 694
  - 695
