  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Meaning of מַלְאָכוֹ in this context
  chosen_reading: his angel
  alternative_readings:
  - his messenger
  rationale: The Hebrew term can denote either a human messenger or a supernatural messenger, but in a statement about the LORD's providential leading, 'angel' best fits the context. The alternative is preserved in a footnote because the lexical ambiguity is real.
