  from: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
  to: If a disputed case in your towns is too difficult for you to decide—whether it concerns bloodshed, legal claims, or injuries[a]—you shall set out and go up to the place that Yahweh your God will choose.
  rationale: The documented lexical work understands these as difficult local judicial cases and favors 'injury' while acknowledging an affliction reading. I retain those judgments, express the repeated legal formulas naturally, and preserve the serious alternative in one note.
