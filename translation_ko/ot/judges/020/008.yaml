    rationale: ‘돌아서다’는 보통 방향을 바꾸는 동작에 쓰이며 ‘집으로’와 결합할 때는 부자연스럽습니다. נָסוּר의 방향 전환·이탈의 뉘앙스는 ‘집으로 발길을 돌리다’로 자연스럽게 드러낼 수 있습니다.
  - severity: low
    issue: 직접 발화의 종결 표현
    rationale: ‘말했습니다’ 뒤의 집단 결의는 ‘않겠습니다’로 마무리하면 현대 합쇼체 직접 인용의 결의와 화자 일치를 더 분명히 합니다.
  - severity: low
    issue: 각주의 필요성과 표지 위치
    rationale: ‘한 사람처럼’은 본문 자체로 이해 가능하며 각주가 필요한 해석상 난점이 아닙니다. 현 표지 [a]는 인용문 끝에 있어 해당 구절과의 연결도 불분명합니다.
