  from: For the mouth of the wicked and the mouth of deceit have opened against me[a][b]; they have spoken to me with a lying tongue.
  to: For the mouth of the wicked and a deceitful mouth[a] have opened against me; they have spoken to me[b] with a lying tongue.
  rationale: The plural verb is proper with two coordinated singular subjects, so there is no need to collapse the repeated Hebrew “mouth” into a plural phrase. “A deceitful mouth” is more idiomatic than “the mouth of deceit” while retaining the repeated image. The existing notes are attached at the wrong location; each is now placed directly after the wording it explains.
