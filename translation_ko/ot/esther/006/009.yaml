  text: וְ/נָת֨וֹן הַ/לְּב֜וּשׁ וְ/הַ/סּ֗וּס עַל יַד אִ֞ישׁ מִ/שָּׂרֵ֤י הַ/מֶּ֨לֶךְ֙ הַֽ/פַּרְתְּמִ֔ים וְ/הִלְבִּ֨ישׁוּ֙ אֶת הָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֣ץ בִּֽ/יקָר֑/וֹ וְ/הִרְכִּיבֻ֤/הוּ עַל הַ/סּוּס֙ בִּ/רְח֣וֹב הָ/עִ֔יר וְ/קָרְא֣וּ לְ/פָנָ֔י/ו כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/009.yaml
  text: And let the robe and the horse be entrusted to the hand of one of the king’s noble officials, and let them clothe the man whom the king delights to honor, and let them mount him on the horse through the open square of the city, and proclaim before him, ‘Thus shall it be done for the man whom the king delights to honor.’
translation:
  language: ko
  text: 왕의 예복과 말을 왕의 귀족 관원 한 사람의 손에 맡기고, 그들이 왕께서 영예롭게 하기를 기뻐하시는 사람에게 그 예복을 입히고 그를 그 말에 태워 도시의 넓은 광장을 지나가게 하며, 그의 앞에서 이렇게 외치게 하십시오. ‘왕께서 영예롭게 하기를 기뻐하시는 사람에게는 이렇게 행해질 것입니다.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפַּרְתְּמִים
  english_pob_choice: one of the king’s noble officials
  chosen_korean: 왕의 귀족 관원 한 사람
  alternatives_korean:
  - 왕의 가장 높은 관리 한 사람
  - 왕의 고관 한 사람
  lexicon: —
  rationale: 페르시아 궁정의 높은 신분 관직을 가리키므로 단순한 ‘관리’보다 위계감을 드러내되, 과장된 관제어는 피했습니다.
- source_word: נָתוֹן ... עַל יַד
  english_pob_choice: be entrusted to the hand of
  chosen_korean: 손에 맡기고
  alternatives_korean:
  - 손에 넘기고
  - 맡겨지고
  lexicon: —
  rationale: 히브리어 관용구를 자연스럽게 살리면서, 책임 있게 인도·처리하도록 넘겨지는 뉘앙스를 반영했습니다.
- source_word: חָפֵץ בִּיקָרוֹ
  english_pob_choice: delights to honor
  chosen_korean: 존귀하게 여기기를 기뻐하는
  alternatives_korean:
  - 존귀히 여기기를 즐거워하는
  - 영예롭게 하기를 기뻐하는
  lexicon: —
  rationale: 직역보다 ‘기뻐하다’와 ‘존귀하게 여기다’의 목적 관계를 함께 살려, 왕의 의지와 호의를 드러냈습니다.
- source_word: וְהִרְכִּיבֻהוּ
  english_pob_choice: mount him on the horse
  chosen_korean: 말을 태워
  alternatives_korean:
  - 말에 태워
  - 말 위에 올려
  lexicon: —
  rationale: 말을 타게 한다는 동작을 간결하고 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 왕의 명령문 형식과 직접화법의 높임 유지
  chosen_reading: 직접화법 안에서는 조서체 요청문을 살려 ‘하십시오’로 옮겼습니다.
  alternative_readings:
  - 서술형으로 완화
  - 명령형을 약화한 평서문
  rationale: 본문은 궁정 선포문 형식이므로, 한국어에서도 공식적·명령적 어조를 유지하는 것이 원문 효과에 부합합니다.
  doctrine_reference: 문체/화용
- issue: 하나님 호칭이 없는 서사 본문에서 종교어를 덧붙이지 않음
  chosen_reading: 본문의 정치·궁정적 표면 의미를 그대로 유지했습니다.
  alternative_readings:
  - 섭리적 의미를 문장에 암시
  rationale: 에스더 6:9는 명시적 신명칭이나 신학 진술이 없으므로, 과도한 신학화 없이 사건의 궁정적 아이러니를 드러내는 데 집중했습니다.
  doctrine_reference: 본문충실성
