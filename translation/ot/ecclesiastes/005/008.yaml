id: ECC.5.8
reference: Ecclesiastes 5:8
source:
  edition: WLC
  text: וְ/יִתְר֥וֹן אֶ֖רֶץ בַּ/כֹּ֣ל היא מֶ֥לֶךְ לְ/שָׂדֶ֖ה נֶעֱבָֽד׃
translation:
  text: The land’s profit is for everyone; even a king depends on the field[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew is difficult. Alternatively, “An advantage to a land in every respect is a king committed to cultivated fields.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְרוֹן אֶרֶץ
  chosen: The land’s profit
  alternatives:
  - The land’s advantage
  - Moreover, the profit of the land
  lexicon: HALOT
  rationale: יִתְרוֹן is Ecclesiastes' recurring term for profit, advantage, or gain. The possessive English phrase is concise and retains that vocabulary.
- source_word: בַּכֹּל
  chosen: is for everyone
  alternatives:
  - is for all
  - is in every respect
  lexicon: HALOT
  rationale: With the preferred clause division, the phrase says that the land's yield or advantage extends to all. The alternative adverbial construal remains in the footnote.
- source_word: מֶלֶךְ לְשָׂדֶה נֶעֱבָד
  chosen: even a king is served by the field
  alternatives:
  - even a king depends on the field
  - a king committed to cultivated fields
  lexicon: HALOT
  rationale: The passive participle can naturally take 'king' as its subject, with the field as the means by which he is served. The compressed Hebrew admits other construals, which are preserved rather than hidden.
