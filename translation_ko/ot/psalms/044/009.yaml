  yaml_path: translation/ot/psalms/044/009.yaml
  text: Yet you have rejected us and put us to shame, and you do not go out with our armies[a].
  footnotes:
  - marker: a
    text: Or 'we praise all day long in God' or 'we glory in God all day long.' The Hebrew verb can carry the sense of praise or exultant boasting depending on context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to your name,' a biblical way of referring to God's revealed character and reputation.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 주께서는 우리를 버리시고 우리에게 수치를 당하게 하셨으며, 우리 군대와 함께 나가시지 않습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역하여, ‘우리 군대 안에서 나가시지 않습니다.’ 히브리어 전치사구는 하나님께서 이스라엘의 군대와 함께 출전하지 않으심을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  english_pob_choice: In God
  chosen_korean: 하나님 안에서
  alternatives_korean:
  - 하나님으로
  - 하나님으로 인해
  lexicon: HALOT
  rationale: 전치사 בְּ는 여기서 수단보다 영역·근거를 나타내므로, ‘안에서’가 하나님을 자랑의 근거와 범위로 자연스럽게 드러냅니다.
- source_word: הִלַּלְנוּ
  english_pob_choice: we boast
  chosen_korean: 우리가 자랑합니다
  alternatives_korean:
  - 우리가 찬양합니다
  - 우리가 영광을 돌립니다
  lexicon: HALOT
  rationale: 이 동사는 이 문맥에서 단순한 찬양보다 ‘자랑하다/자부하다’의 뉘앙스가 강하므로, 시편의 역동을 살려 ‘자랑합니다’로 옮겼습니다.
- source_word: כָל הַיּוֹם
  english_pob_choice: all day long
  chosen_korean: 온종일
  alternatives_korean:
  - 하루 종일
  - 늘
  lexicon: HALOT
  rationale: 지속적인 시간성을 자연스럽게 살리는 현대 한국어 표현으로 ‘온종일’을 택했습니다.
- source_word: נוֹדֶה
  english_pob_choice: we will give thanks
  chosen_korean: 찬송하겠습니다
  alternatives_korean:
  - 감사하겠습니다
  - 감사를 드리겠습니다
  lexicon: HALOT
  rationale: הוֹדָה 계열은 본래 ‘감사하다’이지만, 병행절의 ‘자랑하다’와 함께 예배적 응답을 이루므로 한국어 시어의 흐름을 살려 ‘찬송하겠습니다’로 표현했습니다.
theological_decisions:
- issue: ‘당신의 이름’의 신학적 의미
  chosen_reading: ‘이름’을 하나님의 드러난 성품과 명성에 대한 지시로 유지했습니다.
  alternative_readings:
  - 단순한 호칭으로 축소하는 읽기
  - ‘이름’을 의례적 표현으로만 보는 읽기
  rationale: 히브리어에서 ‘이름’은 단순 표지가 아니라 하나님이 자신을 알려 주신 존재 방식과 평판을 가리키므로, 이를 보존해야 시편의 신학이 살아납니다.
  doctrine_reference: 하나님의 계시된 이름과 성품
