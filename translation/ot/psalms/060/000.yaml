id: PSA.60.0
reference: Psalms 60:0
source:
  edition: WLC
  text: לַ֭/מְנַצֵּחַ עַל שׁוּשַׁ֣ן עֵד֑וּת מִכְתָּ֖ם לְ/דָוִ֣ד לְ/לַמֵּֽד־׃ בְּ/הַצּוֹת֨/וֹ ׀ אֶ֥ת אֲרַ֣ם נַהֲרַיִם֮ וְ/אֶת־אֲרַ֪ם צ֫וֹבָ֥ה וַ/יָּ֤שָׁב יוֹאָ֗ב וַ/יַּ֣ךְ אֶת־אֱד֣וֹם בְּ/גֵיא־מֶ֑לַח שְׁנֵ֖ים עָשָׂ֣ר אָֽלֶף׃
translation:
  text: 'For the choirmaster: according to “Lily of Testimony[a]”. A miktam[b] of David, for instruction. When David fought against Aram-naharaim and Aram-zobah, Joab returned and struck down twelve thousand Edomites in the Valley of Salt.'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: A musical or liturgical designation of uncertain meaning, possibly the name of a tune.
    reason: lexical_alternative
  - marker: b
    text: Miktam is a Hebrew designation of uncertain meaning, perhaps a kind of poem or a musical term.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  chosen: For the choirmaster
  alternatives:
  - For the director of music
  - To the leader
  lexicon: HALOT
  rationale: In Psalm superscriptions this term conventionally addresses the musical leader or overseer. 'Choirmaster' is concise, idiomatic, and preserves the liturgical function better than the vaguer 'leader.'
- source_word: עַל
  chosen: according to
  alternatives:
  - upon
  - to the tune of
  - concerning
  lexicon: HALOT
  rationale: In superscriptions עַל often introduces the melody, tune, or musical setting. 'According to' is flexible and natural in English while leaving the exact technical force open.
- source_word: שׁוּשַׁן עֵדוּת
  chosen: Lily of Testimony
  alternatives:
  - The Lily of the Testimony
  - Lilies of Testimony
  - a tune called 'Lily of Testimony'
  lexicon: HALOT
  rationale: This appears to be a musical or liturgical designation in the superscription. Because the exact referent is uncertain, a relatively formal rendering is preferable. Capitalization and quotation marks signal a title-like expression.
- source_word: מִכְתָּם
  chosen: miktam
  alternatives:
  - inscription
  - golden song
  - psalm
  lexicon: HALOT
  rationale: The precise meaning of this genre term is uncertain. Transliteration is more transparent and auditable than choosing a speculative gloss.
- source_word: לְדָוִד
  chosen: of David
  alternatives:
  - by David
  - for David
  lexicon: HALOT
  rationale: The preposition can mark authorship, association, or dedication. 'Of David' preserves the ambiguity better than resolving it to authorship or dedication.
- source_word: לְלַמֵּד
  chosen: for teaching
  alternatives:
  - to teach
  - for instruction
  lexicon: HALOT
  rationale: The infinitive/purpose form indicates intended instructional use. 'For teaching' is natural English and preserves the purposive sense of the Hebrew.
- source_word: בְּהַצּוֹתוֹ ... שְׁנֵים עָשָׂר אָלֶף
  chosen: when he fought ... twelve thousand
  alternatives: []
  lexicon: WLC source-corpus repair
  rationale: POB normalizes the two Masoretic superscription verses into verse 0. The complete WLC historical notice must therefore remain in both the source payload and translation rather than being dropped because the earlier normalized record contained only the first source row.
