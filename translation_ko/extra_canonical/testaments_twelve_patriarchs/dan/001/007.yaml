    issue: ‘나와 함께 작용하여’와 ‘말하기를 … 하였습니다’의 표현
    rationale: 전자는 한국어에서 어색하며, 후자는 현대 합쇼체 서술에 비해 지나치게 문어적입니다. 원문의 협력 및 발화 관계는 ‘나와 함께 일하면서, …라고 말했습니다’로 자연스럽고 정확하게 표현됩니다.
