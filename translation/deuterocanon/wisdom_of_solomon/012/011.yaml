  meaning_decisions:
  - source_phrase: σπέρμα γὰρ ἦν κατηραμένον ἀπʼ ἀρχῆς
    prior_rendering: For it was a seed accursed from the beginning
    new_rendering: For they were accursed offspring from the beginning
    rationale: “Offspring” makes the reference to the people and their lineage intelligible while preserving the force of the curse. The seed image is retained in a footnote.
  - source_phrase: οὐδὲ εὐλαβούμενός τινα ἐφʼ οἷς ἥμαρταν ἄδειαν ἐδίδους
    prior_rendering: and not fearing anyone because of the things in which they sinned, you granted them no pardon
    new_rendering: and it was not out of fear of anyone that you left their sins unpunished
    rationale: In the context of delayed judgment and opportunity for repentance, the clause denies fear as the motive for leniency, rather than categorically denying pardon. “Left their sins unpunished” conveys the judicial sense of granting impunity, and “for their sins” replaces the opaque wording about the things in which they sinned.
