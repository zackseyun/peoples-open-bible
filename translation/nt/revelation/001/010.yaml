id: REV.1.10
reference: Revelation 1:10
source:
  edition: SBLGNT
  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
translation:
  text: On the Lord’s day[a], I came under the Spirit’s influence[b] and heard a loud voice behind me like a trumpet,
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Probably Sunday, the Christian day of worship; a less likely understanding is the future “day of the Lord.”
    reason: alternative_reading
  - marker: b
    text: Literally, “I came to be in the Spirit”; this phrase introduces John’s visions elsewhere in Revelation (4:2; 17:3; 21:10).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  chosen: I came to be
  alternatives:
  - I was
  - I came
  - I became
  lexicon: BDAG
  rationale: Aorist middle of γίνομαι often denotes coming into a state. 'I came to be' preserves the ingressive sense better than the flatter 'I was,' while avoiding overinterpretation such as ecstatic trance language not explicit in the verb itself.
- source_word: ἐν πνεύματι
  chosen: in the Spirit
  alternatives:
  - in spirit
  - in the spirit
  lexicon: BDAG
  rationale: Capitalized 'Spirit' reflects the likely reference to the Holy Spirit in Johannine apocalyptic usage, especially in Revelation's visionary formulas, while preserving the Greek prepositional phrase without expanding it to 'in a trance' or similar interpretive paraphrase.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  chosen: on the Lord’s day
  alternatives:
  - on the day of the Lord
  lexicon: BDAG
  rationale: κυριακός means 'belonging to the Lord.' The adjectival phrase is best rendered 'the Lord’s day,' the standard sense of κυριακῇ ἡμέρᾳ. It should be distinguished from the eschatological expression 'day of the Lord,' which uses different Greek wording.
- source_word: ἤκουσα
  chosen: I heard
  alternatives:
  - I listened to
  lexicon: BDAG
  rationale: Simple aorist of ἀκούω here reports perception, not attentive listening; 'I heard' is the natural English equivalent.
- source_word: ὀπίσω μου
  chosen: behind me
  alternatives:
  - after me
  - at my back
  lexicon: BDAG
  rationale: Spatial sense fits the context of hearing a voice from behind; 'after me' would suggest sequence rather than location.
- source_word: φωνὴν μεγάλην
  chosen: a loud voice
  alternatives:
  - a great voice
  - a loud sound
  lexicon: BDAG
  rationale: μέγας with φωνή idiomatically means loudness or force in context. 'A loud voice' is idiomatic modern English and preserves the auditory emphasis.
- source_word: ὡς σάλπιγγος
  chosen: like a trumpet
  alternatives:
  - like a trumpet blast
  - as of a trumpet
  lexicon: BDAG
  rationale: The comparison is to the quality of the voice. 'Like a trumpet' is sufficiently literal and clear; 'blast' adds an element not explicit in the Greek noun alone.
