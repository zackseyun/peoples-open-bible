translation:
  language: ko
  text: 당신의 자녀들; 그들의 발을 굳게 하십시오. 내가 당신에게 준 종들은,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: filios tuos
  english_pob_choice: your children
  chosen_korean: 당신의 자녀들
  alternatives_korean:
  - 당신의 아들들
  - 당신의 아이들
  lexicon: filii
  rationale: 라틴어 filios는 성별 포괄적 의미의 ‘자녀들’로 읽는 것이 자연스럽고, POB의 영어도 children으로 잡고 있으므로 그대로 반영했습니다.
- source_word: confirma enim pedes eorum
  english_pob_choice: strengthen their feet
  chosen_korean: 그들의 발을 굳게 하십시오
  alternatives_korean:
  - 그들의 발을 강하게 하십시오
  - 그들의 발걸음을 굳게 하십시오
  lexicon: confirmo / pes
  rationale: confirma는 단순한 ‘강화’보다 ‘굳게 하다/견고하게 하다’가 더 직접적이고, pedes eorum은 문자적으로 ‘그들의 발’이므로 원문 이미지를 살렸습니다.
- source_word: Seruos quos tibi dedi
  english_pob_choice: The servants whom I have given you
  chosen_korean: 당신에게 내가 준 종들
  alternatives_korean:
  - 내가 당신에게 준 종들
  - 당신에게 준 종들
  lexicon: servus
  rationale: seruos는 본문이 말하는 종속적 지위를 유지하기 위해 ‘종들’로 옮겼고, the servants라는 정관사 성격을 한국어에서는 문맥상 자연스럽게 처리했습니다.
