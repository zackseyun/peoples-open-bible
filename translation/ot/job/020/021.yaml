id: JOB.20.21
reference: Job 20:21
source:
  edition: WLC
  text: אֵין שָׂרִ֥יד לְ/אָכְל֑/וֹ עַל כֵּ֝֗ן לֹא יָחִ֥יל טוּבֽ/וֹ־־־׃
translation:
  text: Nothing escaped his devouring; therefore his prosperity will not endure.
  philosophy: dynamic
lexical_decisions:
- source_word: אֵין
  chosen: Nothing
  alternatives:
  - There is no
  lexicon: HALOT
  rationale: Existential negation introducing the clause. In English, 'Nothing' gives a natural rendering when paired with the following noun and infinitive construction.
- source_word: שָׂרִיד
  chosen: escaped
  alternatives:
  - survivor
  - remnant
  - one left
  lexicon: HALOT
  rationale: Literally 'survivor/remnant.' In context with לְאָכְלוֹ ('for his eating/devouring'), the sense is that nothing remained or escaped from what he consumed. Rendering verbally as 'escaped' communicates the idiomatic force in natural English while preserving the image of total consumption.
- source_word: לְאָכְלוֹ
  chosen: his devouring
  alternatives:
  - for his eating
  - for him to eat
  - from his food
  lexicon: HALOT
  rationale: From אכל, 'to eat.' The prefixed ל plus infinitive construct with suffix likely means 'for his eating' or 'to his devouring,' describing the wicked man's consuming greed. 'His devouring' best fits the hostile, excessive sense in context.
- source_word: עַל כֵּן
  chosen: therefore
  alternatives:
  - for this reason
  - so
  lexicon: HALOT
  rationale: Standard inferential expression marking consequence from the previous clause.
- source_word: לֹא
  chosen: not
  lexicon: HALOT
  rationale: Simple negation of the following verb.
- source_word: יָחִיל
  chosen: will endure
  alternatives:
  - will last
  - will prosper
  - will writhe
  lexicon: HALOT
  rationale: The contextual sense is that his good fortune will not continue; the lexical difficulty is noted.
- source_word: טוּבוֹ
  chosen: his prosperity
  alternatives:
  - his good things
  - his wealth
  - his well-being
  lexicon: HALOT
  rationale: Though literally 'his good(ness)/good thing,' in this judgment context it refers to the wicked man's goods or prosperity. 'His prosperity' is idiomatic and fits the consequence stated.
- source_word: שָׂרִיד לְאָכְלוֹ
  chosen: escaped his devouring
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The survivor/remnant is what did not survive his eating or devouring.
