translation:
  text: It is the original historian’s task to explore the subject in depth, range widely in the account[a], and dwell at length on individual details.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “take a walk in discourse.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβατείνειν
  chosen: to go into detail
  alternatives:
  - to enter deeply
  - to investigate thoroughly
  lexicon: LSJ
  rationale: The verb literally suggests stepping into or penetrating further. In this rhetorical context, paired with περίπατον ποιεῖσθαι λόγῳ, it refers to treating matters at greater length or depth. 'Go into detail' captures the idiomatic force in clear English without over-literal awkwardness.
- source_word: περίπατον ποιεῖσθαι λόγῳ
  chosen: to make a discourse into a full walk-through
  alternatives:
  - to expatiate in speech
  - to take a long excursion in words
  lexicon: LSJ
  rationale: 'The phrase is metaphorical: literally ''to make a walk in speech.'' It conveys discursiveness or extended treatment. I preserved some of the metaphor with ''walk-through'' while making the sense intelligible in modern English.'
- source_word: πολυπραγμονεῖν
  chosen: to be overly occupied
  alternatives:
  - to be meddlesome about
  - to busy oneself excessively with
  lexicon: LSJ
  rationale: The verb often carries the sense of busying oneself excessively or fussily. Here it qualifies attention to details, so 'be overly occupied' communicates the negative nuance without importing interpersonal 'meddling' too strongly.
- source_word: ἐν τοῖς κατὰ μέρος
  chosen: with the particulars
  alternatives:
  - in individual points
  - with matters one by one
  - with details
  lexicon: LSJ
  rationale: The phrase refers to itemized or point-by-point matters. 'The particulars' is concise, natural English and fits the author's contrast between a full history and an epitome.
- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  chosen: to the originator of the history
  alternatives:
  - to the founder of the history
  - to the author of the history
  lexicon: LSJ
  rationale: ἀρχηγενέτης is rare and denotes one who originates or first produces something. In context this points to the original historian, contrasted with the epitomizer. 'Originator of the history' preserves that distinction better than the flatter 'author.'
- source_word: καθῆκε
  chosen: belongs
  alternatives:
  - is fitting
  - is appropriate
  - falls to
  lexicon: LSJ
  rationale: The verb indicates what is proper or assigned to someone. 'Belongs' is concise and idiomatic here, expressing that such expansive treatment is the proper task of the original historian.
