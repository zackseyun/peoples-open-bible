  - source_phrase: תָּמִיד לִפְנֵי יְהוָה
    prior_rendering: continually before Yahweh
    new_rendering: serve regularly before Yahweh
    rationale: The named recurring worship occasions show that the service is regular and ongoing, not uninterrupted.
