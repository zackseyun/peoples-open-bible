id: PSA.106.33
reference: Psalms 106:33
source:
  edition: WLC
  text: כִּֽי הִמְר֥וּ אֶת רוּח֑/וֹ וַ֝/יְבַטֵּ֗א בִּ/שְׂפָתָֽי/ו־־׃
translation:
  text: For their rebellion provoked Moses to anger[a], and he spoke rashly.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Hebrew, “they rebelled against his spirit.” Another interpretation takes “his spirit” to refer to God's Spirit rather than Moses' spirit.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - because
  lexicon: HALOT
  rationale: Introduces the reason for the preceding statement. 'For' fits the explanatory flow in English while remaining close to the Hebrew conjunction.
- source_word: הִמְרוּ
  chosen: rebelled against
  alternatives:
  - rebelled against
  - provoked
  - embittered
  lexicon: HALOT
  rationale: The Hiphil is from marah, to rebel against, not from marar, to be bitter.
- source_word: אֶת רוּחוֹ
  chosen: his spirit
  alternatives:
  - his רוח = temper
  - his mind
  - his spirit
  lexicon: HALOT
  rationale: The uncapitalized pronoun naturally refers to Moses, the antecedent in v. 32; no reference to God's Spirit is marked by the Hebrew.
- source_word: וַיְבַטֵּא
  chosen: he spoke rashly
  alternatives:
  - he spoke thoughtlessly
  - he uttered
  - he spoke rashly
  lexicon: HALOT
  rationale: The masculine singular verbal form continues Moses as subject; retaining “he” preserves the Hebrew's pronoun-based linkage.
- source_word: בִּשְׂפָתָיו
  chosen: with his lips
  alternatives:
  - with his mouth
  - by his lips
  lexicon: HALOT
  rationale: A literal rendering of the Hebrew idiom. 'With his lips' is clear modern English and preserves the concrete imagery of speech.
