  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Rendering אִשֶּׁה in sacrificial legislation
  chosen_reading: food offering
  alternative_readings:
  - offering by fire
  - fire offering
  rationale: The term is not a major doctrinally contested term in the excerpt, but it bears theological significance in sacrificial texts. 'Food offering' communicates the cultic category in readable English while avoiding the misleading impression that fire itself is the substance of the offering. A footnote preserves the more traditional literal alternatives.
