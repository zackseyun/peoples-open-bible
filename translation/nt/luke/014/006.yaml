id: LUK.14.6
reference: Luke 14:6
source:
  edition: SBLGNT
  text: καὶ οὐκ ἴσχυσαν ⸀ἀνταποκριθῆναι πρὸς ταῦτα.
translation:
  text: They had no answer to this.
  philosophy: dynamic
lexical_decisions:
- source_word: καὶ
  chosen: And
  alternatives:
  - Then
  - So
  lexicon: BDAG
  rationale: Standard connective; simple coordination best preserves the flow from the prior exchange without adding temporal nuance.
- source_word: οὐκ
  chosen: not
  alternatives:
  - 'no'
  - by no means
  lexicon: BDAG
  rationale: Straightforward negation modifying the verb phrase; English 'not' is the natural equivalent.
- source_word: ἴσχυσαν
  chosen: were able
  alternatives:
  - had strength
  - could
  lexicon: BDAG
  rationale: The aorist of ἰσχύω here idiomatically expresses ability rather than physical strength. 'Were able' preserves that sense clearly in modern English.
- source_word: ἀνταποκριθῆναι
  chosen: to reply
  alternatives:
  - to answer back
  - to respond
  lexicon: BDAG
  rationale: The infinitive denotes making a response in return. 'Reply' captures the reciprocal/responding force without sounding unnecessarily combative; 'answer back' could overstate insolence.
- source_word: πρὸς ταῦτα
  chosen: to these things
  alternatives:
  - to this
  - to these words
  - against these things
  lexicon: BDAG
  rationale: πρός with ταῦτα here means 'in response to these things/this.' 'To these things' is slightly formal but transparent and preserves the plural demonstrative of the Greek.
