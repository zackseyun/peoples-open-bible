id: PSA.89.13
reference: Psalms 89:13
source:
  edition: WLC
  text: לְ/ךָ֣ זְ֭רוֹעַ עִם גְּבוּרָ֑ה תָּעֹ֥ז יָ֝דְ/ךָ֗ תָּר֥וּם יְמִינֶֽ/ךָ־׃
translation:
  text: You have a mighty arm; your hand is strong; your right hand is raised high.
  philosophy: dynamic
lexical_decisions:
- source_word: לְךָ
  chosen: Yours is
  alternatives:
  - You have
  - To you belongs
  lexicon: HALOT
  rationale: The prefixed preposition with pronominal suffix marks possession/existence ('to you [belongs]'). In idiomatic English, 'Yours is' best preserves the emphatic possessive force at the head of the line without sounding wooden.
- source_word: זְרוֹעַ
  chosen: arm
  alternatives:
  - strength
  - power
  lexicon: HALOT
  rationale: The noun literally means 'arm' and commonly functions as a metaphor for power. Retaining 'arm' preserves the Hebrew imagery rather than flattening it into an abstract term.
- source_word: עִם גְּבוּרָה
  lemma: עִם
  chosen: with might
  alternatives:
  - with power
  - in strength
  lexicon: HALOT
  rationale: 'The preposition עִם plus גְּבוּרָה expresses accompaniment/characterization: the arm is characterized by might. ''With might'' is concise and natural while preserving the concrete Hebrew construction.'
- source_word: תָּעֹז
  chosen: is strong
  alternatives:
  - shows strength
  - prevails
  lexicon: HALOT
  rationale: 'From עזז/עזז-like verbal idea of being strong. Because the subject is ''your hand'' in the next colon, English supplies the copular sense naturally: ''your hand is strong.'' This avoids an awkward literal finite verb while preserving the predicative force.'
- source_word: יָדְךָ
  chosen: your hand
  lexicon: HALOT
  rationale: Literal rendering is appropriate; 'hand' is a standard Hebrew anthropomorphic image for active power and should be preserved.
- source_word: תָּרוּם
  chosen: is raised high
  alternatives:
  - is lifted high
  - is raised
  lexicon: HALOT
  rationale: Keeps the verb's concrete high/raised sense with the right hand as subject.
- source_word: יְמִינֶךָ
  chosen: your right hand
  lexicon: HALOT
  rationale: Literal rendering preserves the Hebrew poetic parallelism and the common biblical symbolism of the right hand as the hand of strength and victory.
- source_word: לְךָ זְרוֹעַ עִם גְּבוּרָה
  chosen: You have a mighty arm
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural possessive English while retaining the arm image and its characterization by might.
