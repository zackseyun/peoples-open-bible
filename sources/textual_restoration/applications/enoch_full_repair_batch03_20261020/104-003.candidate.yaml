translation:
  text: As for your cry, cry out for judgment, and it will appear to you,[a] because all your suffering will be
    required of the angels and of all those who helped those who drive you away.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening joins “your cry,” judgment, and the command to cry out. The following verb can mean “appear”
      or “become manifest”; its precise subject is not expressed. “It” is understood here as the requested judgment,
      but the Ge’ez does not explicitly name the appearing subject. The word is not limited to the sense “cause
      something else to appear.”
    reason: lexical_alternative
  - marker: b
    text: The selected edition prints “angels” here. This is the wording of the edited text, not a substitution
      of rulers or a claim that independent manuscripts have been checked.
    reason: textual_variant
