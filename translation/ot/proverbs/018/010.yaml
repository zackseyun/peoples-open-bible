id: PRO.18.10
reference: Proverbs 18:10
source:
  edition: WLC
  text: מִגְדַּל עֹ֭ז שֵׁ֣ם יְהוָ֑ה בּֽ/וֹ יָר֖וּץ צַדִּ֣יק וְ/נִשְׂגָּֽב־־׃
translation:
  text: The name of Yahweh is a strong tower; a righteous person runs into it and is safe[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'is set on high,' an image of being beyond an enemy's reach.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל
  chosen: tower
  alternatives:
  - fortress
  - towered stronghold
  lexicon: HALOT
  rationale: The noun denotes a tower or elevated defensive structure. 'Tower' is the most direct and natural English rendering in the proverb's metaphor.
- source_word: עֹז
  chosen: strong
  alternatives:
  - strength
  - mighty
  lexicon: HALOT
  rationale: In construct with מִגְדַּל, the phrase means 'tower of strength.' Rendering adjectivally as 'strong tower' is idiomatic English while preserving the force of the Hebrew.
- source_word: שֵׁם
  chosen: name
  alternatives:
  - reputation
  lexicon: HALOT
  rationale: Hebrew 'name' can imply revealed character or reputation, but the proverb explicitly says 'name,' and retaining it preserves the theological richness without over-interpreting.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: בּוֹ
  chosen: into it
  alternatives:
  - into him
  - in it
  lexicon: HALOT
  rationale: The preposition plus 3ms suffix is grammatically masculine singular and refers back most naturally to the metaphorical 'tower' represented by 'the name of the LORD.' English idiom with 'run' favors 'into it.' Because the referent is the divine name in metaphor, 'into him' is possible but less immediate in this syntax.
- source_word: יָרוּץ
  chosen: runs
  alternatives:
  - flees
  - hurries
  lexicon: HALOT
  rationale: The verb means 'run.' In this protective context it implies urgent movement for refuge, but 'runs' keeps the image concrete and lets the context supply the nuance.
- source_word: צַדִּיק
  chosen: a righteous person
  alternatives:
  - the righteous
  - a righteous man
  lexicon: HALOT
  rationale: The singular substantival adjective is proverbially representative. This is natural English without adding a male-specific noun.
- source_word: נִשְׂגָּב
  chosen: is safe
  alternatives:
  - is safe
  - is exalted
  - is protected
  lexicon: HALOT
  rationale: The verb denotes being inaccessible or secure; “is safe” communicates the result, with the note preserving the height image.
