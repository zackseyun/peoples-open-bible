id: EXO.12.40
reference: Exodus 12:40
source:
  edition: WLC
  text: וּ/מוֹשַׁב֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יָשְׁב֖וּ בְּ/מִצְרָ֑יִם שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה׃
translation:
  text: The dwelling of the sons of Israel, who lived in Egypt[a], was four hundred thirty years.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: POB provisionally retains the Masoretic wording. The Samaritan Hebrew control includes their fathers and places Canaan before Egypt; the Rahlfs Greek edition places Egypt before Canaan without the fathers. Other Greek witnesses include the fathers; the Cambridge apparatus reports this addition after Canaan in Alexandrinus. It also reports 435 years in Vaticanus's first hand and 430 after correction, with uncertainty about the corrector's identity. In the published 4Q14 transcription, partly preserved Egypt is followed directly by the duration, excluding Canaan after Egypt there; the missing beginning cannot exclude Canaan before Egypt or the fathers. In 2Q2 the geographical phrase is supplied in a gap. These fragments do not establish the entire Egypt-only form, and the earliest wording remains uncertain.
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  chosen: dwelling
  alternatives:
  - sojourning
  - time of residence
  - settlement
  lexicon: HALOT
  rationale: "מוֹשַׁב denotes dwelling/residence or place/time of dwelling. Here it refers not merely to a location but to the period/state of residence, so 'dwelling' preserves the noun while remaining natural in English. Cleanup note: the reader-facing rendering no longer begins with 'Now' because this source expression does not contain an explicit temporal 'now'; any connective force is carried by the surrounding English clause or context."
- source_word: בְּנֵי יִשְׂרָאֵל
  chosen: the sons of Israel
  alternatives:
  - the children of Israel
  - the Israelites
  lexicon: HALOT
  rationale: Formally, the Hebrew is 'sons of Israel.' This keeps the traditional covenantal expression and follows the gender-accurate principle. 'Israelites' is smoother but less transparent to the source wording.
- source_word: אֲשֶׁר יָשְׁבוּ
  chosen: who lived
  alternatives:
  - during which they lived
  - which they dwelt
  - who sojourned
  lexicon: HALOT
  rationale: "The current English attaches 'who lived' to 'sons of Israel'; 'during which they lived' instead attaches the relative clause to the residence. This disclosure review does not decide between these renderings. 'Lived' renders ישׁב."
- source_word: בְּמִצְרַיִם
  chosen: in Egypt
  lexicon: HALOT
  rationale: Straightforward locative use of the preposition ב with the place name Egypt.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  chosen: four hundred thirty years
  alternatives:
  - thirty years and four hundred years
  lexicon: HALOT
  rationale: English idiom reverses the Hebrew order of the compound number. 'Four hundred thirty years' is the natural equivalent and preserves the stated duration.
