  - male and female cupbearers
  - every kind of luxury
  rationale: The term is lexically uncertain and has generated multiple interpretations. The main text adopts the reading that best fits the immediate context of royal luxury and human delights, while preserving major alternatives in a footnote rather than overstating certainty.
