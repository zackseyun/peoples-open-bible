- source_word: ⲁⲩⲱ
  choice: （句间承接）
  rationale: 通常意为“并且、又”；为使残缺的中文句子自然，以句号承接，没有强行补出逻辑关系。
- source_word: ⲙⲛⲧⲁⲓ ⲡⲉⲧⲛⲁⲕⲣⲓⲛⲉ ⲙⲙⲟⲓ
  choice: 没有人会……审判我
