  rationale: The Hebrew here uses the ordinary noun עָנָן with article, without an adjective meaning 'thick.' The translation preserves the narrative's theophanic imagery without expanding it interpretively.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
