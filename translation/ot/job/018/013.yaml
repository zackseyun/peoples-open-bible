id: JOB.18.13
reference: Job 18:13
source:
  edition: WLC
  text: יֹ֭אכַל בַּדֵּ֣י עוֹר֑/וֹ יֹאכַ֥ל בַּ֝דָּ֗י/ו בְּכ֣וֹר מָֽוֶת׃
translation:
  text: It devours parts of his skin; the firstborn of death[a] devours his limbs.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: A poetic title, perhaps meaning death’s foremost or deadliest offspring or agent.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכַל
  chosen: it devours
  alternatives:
  - it eats
  - he devours
  - is consumed
  lexicon: HALOT
  rationale: Qal imperfect 3ms of אכל, here used metaphorically of destructive consumption. English present 'devours' fits the poetic vividness better than the more literal but weaker 'eats.' The subject is left impersonal/indefinite in English because Hebrew supplies no explicit subject in the first colon.
- source_word: בַּדֵּי
  chosen: the limbs of
  alternatives:
  - parts of
  - members of
  - branches of
  lexicon: HALOT
  rationale: בַּדִּים can denote parts, members, or limbs. In context with skin/body imagery, 'limbs of' best conveys bodily members rather than literal branches.
- source_word: עוֹרוֹ
  chosen: his skin
  alternatives:
  - his hide
  lexicon: HALOT
  rationale: עוֹר normally means skin/hide. 'His skin' is the natural idiomatic rendering in this bodily affliction context.
- source_word: בַּדָּיו
  chosen: his limbs
  alternatives:
  - his members
  - his parts
  lexicon: HALOT
  rationale: In the second colon, the bodily context supports the more specific sense “limbs.”
- source_word: בְּכוֹר מָוֶת
  chosen: the firstborn of death
  alternatives:
  - death's firstborn
  - the foremost offspring of death
  lexicon: HALOT
  rationale: The concrete but uncertain poetic expression should be retained rather than identified with a specific disease or destructive agent.
- source_word: בַּדֵּי עוֹרוֹ
  chosen: parts of his skin
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This preserves the construct relation without the false implication that skin has limbs or the added interpretation “skin-covered.”
