  - severity: medium
    issue: 현대 합쇼체와 맞지 않는 문체
    rationale: ‘말하되’, ‘보라’, ‘있느니라’는 고전적 성경체입니다. 지정된 현대 formal-polite 합쇼체에는 ‘말했습니다’, ‘보십시오’, ‘있습니다’가 적합합니다.
  - severity: medium
