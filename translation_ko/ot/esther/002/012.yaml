  source_fidelity: 핵심 어휘와 열두 달의 준비 기간, 두 차례의 각 여섯 달이라는 구성은 잘 반영했습니다. 다만 כְּדָת הַנָּשִׁים는 단순히 ‘여자들을 위한’ 규정보다 ‘여자들에게 정해진/적용되는’ 규정이라는 뜻이 더 분명하며, ‘그들의 미용 기간이 이렇게 채워졌기 때문인데’는 원문의 설명적 כִּי כֵּן을 다소 어색하게 처리합니다.
  naturalness: ‘차례가 와서 … 들어갈 때에는’ 및 ‘뒤였습니다’의 결합이 다소 부자연스럽습니다. ‘차례가 되었을 때에는’과 ‘정해진 규정대로’로 다듬으면 현대 표준 한국어 합쇼체에서 더 자연스럽고 명료합니다.
  terminology: ‘젊은 여자’, ‘몰약 기름’, ‘향품’, ‘화장품’은 문맥에 적절합니다. מְרוּקֵיהֶן는 특정한 현대적 ‘미용’보다 몸단장·단장 처치를 넓게 가리키므로 ‘몸단장 기간’이 더 중립적입니다.
