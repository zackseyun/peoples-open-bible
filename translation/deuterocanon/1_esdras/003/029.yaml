  from: And those who do not serve in the army or fight, but farm the land—again, when they sow, after reaping they bring tribute to the king; and by compelling one another, they bring the taxes to the king.
  to: And those who do not serve in the army or fight, but cultivate the land, again, when they have sown, after reaping they bring tribute to the king; and compelling one another, they bring the taxes to the king.
  rationale: Replaced 'farm the land' with the more formal 'cultivate the land'; adjusted 'when they sow' to 'when they have sown' to better reflect the Greek subjunctive with temporal clause; removed 'by' before 'compelling one another' for a more direct rendering of the participle.
