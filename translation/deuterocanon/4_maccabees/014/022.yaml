id: 4MA.14.22
reference: 4 Maccabees 14:22
source:
  edition: lxx-swete-1909
  text: μήτηρ δυεῖν προκειμένων, εὐσεβείας, καὶ τῆς ἑπτὰ υἱῶν σωτηρίας προσκαίρου κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν·
  language: Greek
  pages:
  - 752
