translation:
  text: 'Then those whose rods were green but cracked handed them in. All handed in green rods and stood
    in their own group. The shepherd rejoiced over them because they had all changed and put away their
    cracks.


    2. Those whose rods were half green and half dry also handed them in. Some rods were found completely
    green, some half dry, some dry and eaten away, and some green with shoots. All these people were dismissed,
    each to their own group.


    3. Then those whose rods were two-thirds green and one-third dry handed them in. Many handed in green
    rods, many half-dry ones, and others dry ones that were eaten away. All stood in their own group.


    4. Then those whose rods were two-thirds dry and one-third green handed them in. Many handed in half-dry
    rods; some handed in dry ones that were eaten away, some half-dry ones with cracks, and a few green
    ones. All stood in their own group.[a]


    5. Those whose rods had been green, with a very small dry part and cracks, handed them in. Some handed
    in green rods, and some green rods with shoots. They too went to their own group.[b]


    6. Then those whose rods had only a little green, with the remaining parts dry, handed them in. Their
    rods were found mostly green, with shoots and fruit on the shoots, while others were entirely green.
    The shepherd rejoiced very greatly over these rods because they were found in this condition. Each
    person went to their own group.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: 'The whole paragraph is bracketed in the 1891 working edition, supplied from versions and absent
      from Athos. Michigan now partly preserves corresponding Greek, Bonner (1934), printed pp. 99–100,
      but has a shorter list. Shorter alternative: “Then those whose rods were two-thirds dry and one-third
      green handed them in. Many handed in half-dry rods; some had dry rods with cracks, and very few
      had green rods.” The working text retains the worm-eaten subgroup and the additional half-dry/cracked
      subgroup provisionally; Michigan does not certify that entire longer reconstruction.'
  - marker: b
    reason: textual_variant
    text: “Dry” is bracketed as supplied in the 1891 edition and absent from Athos. Michigan has the dry
      word outside brackets in its published transcription, Bonner printed p. 100. It supplies later Greek
      support for this word, not for every part of the surrounding reconstruction.
  - marker: c
    reason: textual_variant
    text: 'Athos preserves this distinct mostly-dry group introduction. Michigan omits its beginning,
      joining the shoots/fruit description to the preceding group. Shorter alternative after paragraph
      5: “Their rods were found mostly green, with shoots and fruit on the shoots, while others were entirely
      green.” The draft retains both groups rather than conflating them. “Very greatly” includes an intensifier
      bracketed in the working edition; Athos has a different emphatic construction with the same rejoicing
      sense.'
lexical_decisions:
- source_word: μετάνοια / διψυχεῖν
  chosen: repentance / waver
  alternatives:
  - turning back / be double-minded
  rationale: Retain distinct groups, response conditions and warnings. An opportunity to repent is not
    the same as actual repentance or achieved salvation.
- source_word: χλωρός / ξηρός / τάγμα
  chosen: green / dry / group
  alternatives:
  - fresh / withered / rank
  rationale: Preserve exact fractions and separate rod groups; green is a living condition in the vision,
    not an arbitrary color change.
