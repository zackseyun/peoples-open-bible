  source_fidelity: 첫 절의 ἐν αὐτῇ는 문자적으로는 ‘그 안에서/그것 안에서’이지만, 영어 POB의 ‘by it’를 따라 원인·계기의 관계로 옮길 수 있습니다. 다만 현행 ‘그것으로 미끄러지다’는 한국어에서 부자연스럽습니다. δεύτε 절의 κατέναντι ἐνεδρεύοντος는 ‘매복해 있는 자 앞에서’라는 뜻이며, 현행 번역은 ‘그 앞에’와 ‘자 앞에서’를 중복하여 원문의 관계를 흐립니다.
  naturalness: ‘그것으로 미끄러지지 않도록’보다 ‘그것 때문에 발을 헛디디지 않도록’이 현대 표준 한국어에서 자연스럽고 ὀλισθήσῃς의 비유적·실제적 미끄러짐을 잘 전달합니다. ‘매복해 있는 자 앞에서’는 ἐνεδρεύοντος를 간결하고 자연스럽게 옮깁니다.
  terminology: ‘주의하십시오’는 πρόσεχε에 적절한 합쇼체 권고입니다. ‘매복해 있는 자’는 ‘숨어 기다리는 자’보다 ἐνεδρεύω의 적대적으로 잠복하는 뉘앙스를 정확히 살립니다.
  issues:
