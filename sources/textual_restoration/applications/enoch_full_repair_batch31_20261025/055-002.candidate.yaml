translation:
  text: 'And he swore by his great name that from now on he would not do this to all those who live on dry land.
    And he caused a sign to circle in the heavens: “Let there be faithfulness between me and them forever, for the
    duration of the days of heaven upon earth; and this is by my command.”[a]'
  footnotes:
  - text: The selected Ethiopic uses a verb of causing to go round for the sign in the heavens; it does not name
      the kind of sign. “Faithfulness” renders ሃይማኖት, whose primary lexical range includes trust and the good faith
      of a relationship; a pledge is another contextual way of expressing that relation, but the selected word is
      not the technical noun for a covenant. The duration clause retains መጠነ, “measure/extent,” with the days of
      heaven upon earth, without adding a new conjunction. The text shifts from third-person narration to first-person
      “me” and “my”; quotation marks are editorial presentation. The selected starred form ማእከሌሆሙ is retained without
      silently normalizing its letters. The broad critical bracket begun at 54:7 closes after this unit. Six spaced
      printed dots follow that bracket before 55:3; these are editorial source signs, not authorization to invent
      missing wording or to add a new opening bracket at 55:1. The main print has the plural “in the heavens”; the
      singular form is recorded as a variant in the printed apparatus.
    marker: a
  philosophy: optimal-equivalence
