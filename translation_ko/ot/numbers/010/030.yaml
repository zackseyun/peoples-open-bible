  source_fidelity: 히브리어의 발화 전환(그가 그에게 말함), 단호한 부정 의지(לֹא אֵלֵךְ), 대조를 이루는 כִּי אִם, 그리고 ‘내 땅’과 ‘내 친족/출생 공동체’라는 두 목적지를 충실히 반영합니다. ‘고향’은 אֶרֶץ의 문맥적 의미를 자연스럽게 드러내며, ‘친족’은 영어 POB의 kindred 및 מוֹלַדְתִּי의 가능한 친족 의미와 잘 맞습니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. 직접 인용문 안의 ‘저는 가지 않겠습니다… 가겠습니다’는 화자의 결연한 의지를 명확하게 전달하며, ‘고향과 친족에게로’도 병렬 목적지로 무리 없이 읽힙니다.
  terminology: ‘고향’, ‘친족’, ‘오히려’는 각각 본문의 지리적 소속, 혈연·출생 공동체, 역접적 대조를 적절히 전달합니다. 특정 교리적 해석이나 불필요한 지명·관계의 특정화가 없습니다.
