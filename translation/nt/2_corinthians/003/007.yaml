  from: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
  to: But if the ministry that brought death, whose law was engraved in letters on stone tablets, came with such glory that the Israelites could not gaze at Moses’ face because of its glory, even though that glory was fading away[a],
  rationale: The recorded preference for fading away fits the visible glory, while the alternative of being brought to an end remains significant. The earlier insistence on sons and stones reflected source form rather than the people and tablets the passage means.
