  text: And you will be scattered as captives among the nations, and there you will be for a reproach and a curse.
translation:
  language: ko
  text: 그리고 너희는 민족들 가운데서 포로로 흩어질 것이며, 거기에서 치욕거리와 저주거리가 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διασπαρήσεσθε
  english_pob_choice: you will be scattered
  chosen_korean: 흩어질 것입니다
  alternatives_korean:
  - 흩어지게 될 것입니다
  - 뿔뿔이 흩어질 것입니다
  lexicon: διασπείρω
  rationale: 장차 일어날 분산을 자연스러운 한국어 미래 표현으로 옮기되, 강제적 유배의 맥락을 해치지 않도록 과도한 의역은 피했습니다.
- source_word: αἰχμάλωτοι
  english_pob_choice: as captives
  chosen_korean: 포로로
  alternatives_korean:
  - 사로잡힌 자로
  - 포로된 채
  lexicon: αἰχμάλωτος
  rationale: ‘포로’가 본문이 말하는 억류 상태를 가장 직접적으로 드러내므로, 상태 표지로 간결하게 옮겼습니다.
- source_word: ἐν τοῖς ἔθνεσιν
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데로
  alternatives_korean:
  - 열방 가운데로
  - 이방 민족들 가운데로
  lexicon: ἔθνος
  rationale: 문맥상 이스라엘과 대비되는 ‘민족들’을 뜻하므로, 종교적 색채를 덧씌우지 않고 직역에 가깝게 처리했습니다.
- source_word: εἰς ὄνειδος καὶ εἰς κατάραν
  english_pob_choice: for a reproach and a curse
  chosen_korean: 수치와 저주가 될 것입니다
  alternatives_korean:
  - 욕됨과 저주가 될 것입니다
  - 모욕과 저주가 될 것입니다
  lexicon: ὄνειδος, κατάρα
  rationale: 결과 상태를 한국어로 자연스럽게 나타내기 위해 ‘~가 될 것입니다’를 사용했으며, ὄνειδος의 사회적 수치를 ‘수치’로, κατάρα의 언약적 저주를 ‘저주’로 유지했습니다.
theological_decisions:
- issue: 심판 선언의 어조
  chosen_reading: 본문은 포로 흩어짐과 민족들 가운데서의 수치·저주를 하나의 심판 결과로 제시합니다.
  alternative_readings:
  - 단순한 예언적 경고로 약화하여 읽는 해석
  - 역사적 유배 묘사만으로 제한하는 해석
  rationale: 그리스어 접속과 결과구조(‘흩어질 것이며… 거기에서…’)를 따라, 심판의 연속성을 보존했습니다.
  doctrine_reference: 언약적 저주와 포로 심판
