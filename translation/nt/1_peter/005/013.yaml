id: 1PE.5.13
reference: 1 Peter 5:13
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
translation:
  text: The church[a] in Babylon[b], chosen together with you, greets you, and so does Mark, my son[c].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “She who is in Babylon, chosen together with you.” The Greek leaves the feminine referent unnamed; some understand a Christian woman rather than the church.
    reason: alternative_reading
  - marker: b
    text: “Babylon” is probably a symbolic reference to Rome, though some understand the literal city of Babylon.
    reason: alternative_reading
  - marker: c
    text: “My son” could express a close spiritual relationship, not only a biological one.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζεται
  lemma: ἀσπάζομαι
  chosen: greets
  alternatives:
  - sends greetings to
  - greets warmly
  lexicon: BDAG
  rationale: The verb ἀσπάζομαι commonly means to greet or send greetings. 'Greets' is concise, natural English and preserves the epistolary sense without unnecessary expansion.
- source_word: ἡ ... συνεκλεκτὴ
  chosen: She who is ... chosen together with you
  alternatives:
  - the fellow chosen one in Babylon
  - the church in Babylon, chosen together with you
  lexicon: BDAG
  rationale: The feminine singular adjective with article is elliptical, literally 'the [feminine singular] co-elect one.' Because no explicit noun is present, the translation preserves the personal feminine form with 'She who is...' rather than supplying 'church' in the main text. This keeps the Greek ambiguity visible while remaining readable.
- source_word: ἐν Βαβυλῶνι
  chosen: in Babylon
  alternatives:
  - in Rome
  lexicon: BDAG
  rationale: The text says 'in Babylon.' The translation retains the place name as written rather than interpreting it in the main text. If understood symbolically as Rome, that belongs in a footnote, not the translation itself.
- source_word: συνεκλεκτὴ
  chosen: chosen together with you
  alternatives:
  - co-elect
  - fellow chosen
  lexicon: BDAG
  rationale: The adjective denotes being chosen together with others. 'Chosen together with you' expresses the relational force clearly in modern English. 'Co-elect' is more literal but unnatural.
- source_word: Μᾶρκος
  chosen: Mark
  lexicon: BDAG
  rationale: Standard English transliteration of the personal name Μᾶρκος.
- source_word: ὁ υἱός μου
  chosen: my son
  alternatives:
  - my child
  lexicon: BDAG
  rationale: υἱός normally means 'son.' Here it is likely spiritual rather than biological, but the Greek expression itself is simply 'my son,' so the translation keeps the literal wording and leaves the relational nuance to interpretation or footnote.
