base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: ko
  text: 그때 야훼께서 다시 사무엘을 부르셨습니다. 사무엘이 일어나 엘리에게 가서 말했습니다. “여기 있습니다. 당신이 저를 부르셨기 때문입니다.” 그러자 엘리가 말했습니다. “제가 부르지 않았습니다, 내 아들아. 돌아가서 누우십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 원문 신명성 표지를 직접 살리기 위해 기본 용례인 야훼를 사용했습니다. POB의 주님보다 원문-직결성이 높고, 여호와는 비표준 전통형이어서 채택하지 않았습니다.
- source_word: קָרָא
  english_pob_choice: called
  chosen_korean: 부르셨습니다 / 부르지 않았다
  alternatives_korean:
  - 부르셨습니다
  - 불렀습니다
  - 호명하셨습니다
  lexicon: Qal perfect/imperfect of קרא
  rationale: 사무엘을 ‘부르다’로 자연스럽고 직접적으로 옮겨, 대화 맥락에서 반복되는 호출을 드러냈습니다. ‘호명하다’는 지나치게 문어적이고 의미 범위가 좁습니다.
- source_word: בְנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 아들아
  lexicon: construct + 2ms vocative
  rationale: 엘리의 친밀한 호칭을 보존하기 위해 호격을 살렸습니다. 종결형으로 처리해 한국어 대화체의 직접성을 유지했습니다.
- source_word: שׁוּב שְׁכָב
  english_pob_choice: Go back; lie down
  chosen_korean: 돌아가 누워라
  alternatives_korean:
  - 돌아가서 누워라
  - 가서 다시 누워라
  lexicon: imperatives
  rationale: 연속 명령을 간결하게 살려, 원문의 짧고 단호한 지시를 반영했습니다. ‘가서 다시’는 의미는 가능하지만 중복성이 있어 덜 간결합니다.
theological_decisions:
- issue: 야훼의 직접적 호출을 어떻게 표기할지
  chosen_reading: 본문 서술자 차원에서는 야훼로 직접 표기하고, 인간 화자 엘리의 발화는 그대로 구분해 옮겼습니다.
  alternative_readings:
  - 주님께서
  - 여호와께서
  rationale: 이 절은 서술 문장에서 신적 행위자를 분명히 밝히므로, 원문 표지를 흐리지 않는 표기가 중요합니다. 야훼를 사용해 본문의 신학적 주체를 명시했습니다.
  doctrine_reference: 신명기적 신명 표기 일관성
