  text: καὶ ταῖς μιαραῖς χερσὶν τὰ ἱερὰ σκεύη λαμβάνων, καὶ τὰ ὑπὸ πολλῶν βασιλέων ἀνασταθέντα πρὸς αὔξησιν καὶ δόξαν τοῦ τόπου καὶ τιμήν, ταῖς βεβήλοις χερσὶν συνσύρων.
