  yaml_path: translation/ot/psalms/040/015.yaml
  text: Let those who say to me, “Aha, aha!” be appalled because of their shame.
  footnotes:
  - marker: a
    text: Or 'to destroy it' / 'to consume it'; the Hebrew verb can carry the sense of bringing the psalmist's life to an end.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my soul/life'; here 'life' best fits the idiom of enemies seeking to kill the psalmist.
    reason: lexical_alternative
  - marker: c
    text: Or 'those who seek my life to sweep it away'.
    reason: previous_rendering
translation:
  language: ko
  text: 나에게 “아하, 아하!” 하고 말하는 자들이 자기들의 수치 때문에[b] 경악하게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경악하게 하소서’에 해당하는 히브리어 동사는 ‘황폐하게 되다’, ‘망연해지다’, ‘깜짝 놀라다’라는 뜻도 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 수치의 발꿈치 위에’입니다. 이 표현은 여기서 그들의 수치가 초래한 결과 또는 원인을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  english_pob_choice: be put to shame
  chosen_korean: 수치를 당하게 하소서
  alternatives_korean:
