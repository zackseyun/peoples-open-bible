id: 1CH.24.22
reference: 1 Chronicles 24:22
source:
  edition: WLC
  text: לַ/יִּצְהָרִ֣י שְׁלֹמ֔וֹת לִ/בְנֵ֥י שְׁלֹמ֖וֹת יָֽחַת׃
translation:
  text: Among the Izharites was Shelomoth; among Shelomoth’s descendants was Jahath.
  philosophy: dynamic
lexical_decisions:
- source_word: לַיִּצְהָרִי
  chosen: For the Izharite
  alternatives:
  - To/for Izharite
  lexicon: HALOT
  rationale: The prefixed ל marks assignment within the priestly/Levitical divisions list, best rendered idiomatically as 'For.' The gentilic/noun from Izhar is rendered 'Izharite' as a clan designation.
- source_word: שְׁלֹמוֹת
  chosen: Shelomoth
  alternatives:
  - Shelomot
  lexicon: HALOT
  rationale: Proper name, so transliterated rather than translated, following the project's policy for personal names.
- source_word: לִבְנֵי
  chosen: for the sons of
  alternatives:
  - for the descendants of
  - for the children of
  lexicon: HALOT
  rationale: 'בנים in genealogical/organizational contexts commonly means ''sons'' and can extend to descendants, but here the formulaic listing is most naturally preserved as ''sons of.'' The prefixed ל again indicates assignment: ''for the sons of.'''
- source_word: שְׁלֹמוֹת
  chosen: Shelomoth
  alternatives:
  - Shelomot
  lexicon: HALOT
  rationale: Repeated proper name, consistently transliterated.
- source_word: יָחַת
  chosen: Jahath
  alternatives:
  - Yahath
  lexicon: HALOT
  rationale: Proper name, transliterated by standard English convention as 'Jahath.'
