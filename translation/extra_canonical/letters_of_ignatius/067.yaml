translation:
  text: 'Keep away from noxious herbs, which are not the husbandry of Jesus Christ, because they are not the planting of the Father. Not that I have found division among you, but filtering.


    For as many as are of God and of Jesus Christ, they are with the bishop; and as many as shall reorient[r1] and enter into the unity of the Church, these also shall be of God, that they may be living after Jesus Christ. Be not deceived, my brethren.


    If any man follows one that makes a schism, he does not inherit the kingdom of God. If any man walks in strange doctrine, he has no fellowship with the passion.'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - Provisional bridge rendering from the supplied public-domain English witness.
  - The unusual term “filtering” is retained without interpretation.
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation. This reader text adapts the recorded English translation witness; it is not a verbatim quotation or a newly verified translation of the ancient-language text. The source witness is unchanged.
    reason: lexical_alternative
