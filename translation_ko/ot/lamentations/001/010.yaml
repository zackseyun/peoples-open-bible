revisions:
- from: 원수가 그의 손을 그녀의 모든 보배 위로 펼쳤습니다. 그녀는 이방 나라들이 자기 성소에 들어오는 것을 보았습니다. 당신께서 그들에게 “그들은 당신의 회중에 들어오지 말라”고 명하셨는데도 말입니다.[a]
  to: 원수가 그녀의 모든 귀한 것들 위에 손을 뻗었습니다. 그녀는 민족들이 그녀의 성소에 들어온 것을 보았습니다. 그들은 당신께서 당신의 집회에 들어오지 못하도록 명하셨던 민족들입니다.[a]
  rationale: 예루살렘을 가리키는 여성 단수 지시를 ‘그녀의 성소’로 명확히 하고, 침입 사건의 완료성을 ‘들어온 것’으로 반영했습니다. 마지막 절은 원문의 관계절 구조를 유지하면서도 자연스러운 한국어 문장으로 다듬었습니다. ‘집회’는 특정 교회 전통의 용어로 의미가 좁아질 수 있는 ‘회중’보다 קָהָל의 범위를 더 중립적으로 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:36:55Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 기본 구조와 의미는 대체로 반영했으나, ‘자기 성소’는 한국어에서 가장 가까운 주어인 ‘이방 나라들’의 성소로 이해될 수 있어 히브리어 여성 단수 접미사(예루살렘을 가리킴)를 제대로 전달하지 못합니다. 또한 완료형 ‘들어왔다’를 ‘들어오는’으로 옮긴 시제가 부정확하며, 원문의 관계절을 직접 인용으로 바꾸고 ‘그들은 … 말라’라고 한 표현은 한국어 문법과 지시 관계를 흐립니다.
  naturalness: ‘그의 손을 그녀의 모든 보배 위로 펼쳤습니다’는 ‘위로 펼치다’의 결합이 다소 어색하고, ‘그녀의 모든 보배’도 현대 한국어에서는 부자연스럽습니다. ‘그녀의 성소’, ‘귀한 것들’, ‘손을 뻗었습니다’로 조정하고 마지막 절을 관계절에 맞추어 풀면 현대적 합쇼체로 더 자연스럽습니다.
  terminology: מַחֲמַדֶּיהָ는 금전적 보물에 국한되지 않으므로 ‘귀한 것들’이 적절합니다. גוֹיִם은 본문 자체에 ‘이방’이라는 대조 범주를 명시하지 않으므로 ‘민족들’로 옮깁니다. קָהָל은 교회 용어로 좁혀질 수 있는 ‘회중’보다 ‘집회’가 원문의 폭을 보존합니다.
  issues:
  - severity: high
    issue: ‘자기 성소’의 선행사가 잘못 해석될 수 있습니다.
    rationale: 한국어 재귀대명사 ‘자기’는 통상 해당 절의 주어인 ‘이방 나라들’을 가리키므로, ‘그녀의 성소’라는 히브리어의 의미를 훼손합니다.
  - severity: medium
    issue: ‘들어오는 것’이 히브리어 완료형을 현재 진행으로 바꿉니다.
    rationale: רָאֲתָה גוֹיִם בָּאוּ는 그녀가 민족들이 성소에 들어온 일을 보았다는 진술입니다.
  - severity: medium
    issue: 마지막 절의 직접 인용과 ‘그들은 … 말라’가 부자연스럽고 관계절의 의미를 흐립니다.
    rationale: אֲשֶׁר צִוִּיתָה לֹא יָבֹאוּ는 앞의 민족들을 수식하는 관계절입니다. 하나님께서 그들이 집회에 들어오지 못하도록 명하셨다는 형태가 자연스럽고 충실합니다.
  - severity: low
    issue: ‘보배’와 ‘이방 나라들’은 각각 의미 범위를 좁히거나 문체상 다소 부자연스럽습니다.
    rationale: ‘귀한 것들’은 가치 있는 소유물 전반을 포괄하며, ‘민족들’은 גוֹיִם의 비표지적 기본 의미를 유지합니다.
  revised_text: 원수가 그녀의 모든 귀한 것들 위에 손을 뻗었습니다. 그녀는 민족들이 그녀의 성소에 들어온 것을 보았습니다. 그들은 당신께서 당신의 집회에 들어오지 못하도록 명하셨던 민족들입니다.[a]
