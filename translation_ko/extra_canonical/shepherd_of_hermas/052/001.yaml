  source_fidelity: 원문의 2인칭 단수(σοι, εἶ)와 ‘교활하고 고집이 센’이라는 평가가 초안에서 복수로 바뀌었습니다. παράμονος는 ‘참을성이 있는’이 아니라 ‘끈질긴/집요한’입니다. 또한 원문은 그가 죄를 깨끗하게 했다고 서술하며, ‘깨끗하게 하시려고’라는 목적 표현과 ‘많이 참으셨다’는 의미는 맞지 않습니다.
  naturalness: 인용문의 문장 연결과 종결을 현대 한국어 합쇼체로 정리했습니다. ‘많은 수고를 겪으셨으니’는 πολλοὺς κόπους ἠντληκώς의 고난·수고의 뜻을 자연스럽게 나타냅니다.
  terminology: παραβολή는 문맥상 ‘비유’, ἐπιλύσεις는 ‘해석’으로 옮겼습니다. 본문에 명시된 주체는 영어 감사본의 ‘he’에 맞추어 대명사 ‘그’로 유지하여, 이 발췌문만으로 주체를 과도하게 특정하지 않았습니다.
  issues:
  - severity: high
    issue: 2인칭 단수의 복수화
    rationale: 원문은 ‘너’에게 말하며(σοι, εἶ), 초안의 ‘너희에게/너희는/너희가’는 수신자를 변경합니다.
  - severity: high
    issue: παράμονος의 의미 오역
    rationale: ‘참을성이 있으므로’가 아니라 질문을 계속하는 ‘매우 끈질기므로/집요하므로’라는 뜻입니다.
  - severity: medium
    issue: 정결 행위의 목적화 및 κόπους의 오역
    rationale: ἐκαθάρισε는 ‘깨끗하게 하셨다’라는 완료된 행위이고, πολλοὺς κόπους ἠντληκώς는 ‘많은 수고를 겪으셨다’이지 ‘많이 참으셨다’가 아닙니다.
  - severity: medium
    issue: ‘나머지 비유’의 범위 불명료
    rationale: τῶν λοιπῶν은 ‘나머지 것들’로 읽힐 여지가 있으나, 영어 감사본이 ‘the rest [of the parables]’로 보충하므로 한국어에서도 괄호로 보충을 표시해 본문 전승의 불완전성을 과장 없이 보존했습니다.
  revised_text: 그가 말씀하셨습니다. “내가 방금도 너에게 말하였다. 너는 비유들의 해석을 묻는 교활하고 고집 센 사람이다. 그러나 네가 이처럼 끈질기므로, 내가 너에게 밭의 비유와 나머지 비유를 해석해 주겠다. 그가 그것들을 천사들에게 맡겨 지키게 하였고, 친히 많은 수고를 하고 많은 노고를 겪어 그들의 죄를 깨끗하게 하였다. 수고나 노고 없이는 아무도 땅을 팔 수 없기 때문이다.”
