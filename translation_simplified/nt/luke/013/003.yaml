translation:
  language: en
  text: “No, I tell you. But unless you repent[b], you will all likewise perish.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “perish in a similar way.” The comparison may point to a similar sudden judgment, not the identical manner of death.
    reason: lexical_alternative
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
