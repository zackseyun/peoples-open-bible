translation:
  text: And when all their sons have slaughtered one another, and they have seen the destruction of their beloved ones, bind
    them for seventy generations beneath the valleys of the earth, until the day of their judgment and their consummation—until
    the judgment that is forever and ever is completed.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The earth’s topographical term is uncertain; “beneath the hills of the earth” is an alternative to the main text’s
      “valleys.” No exact subterranean geography is asserted.
    reason: lexical_alternative
  - marker: b
    text: “Consummation” renders a term for completion or final end; the paired expression may also be translated “their judgment
      and their end.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትራገዙ
  chosen: have slaughtered one another
  alternatives:
  - have killed one another
  - have destroyed one another
  rationale: The reciprocal verbal form describes the sons' mutual violent killing. “Slaughtered one another” preserves the
    severity of the judgment scene without adding details beyond the witness.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ውሉዶሙ
  chosen: their sons
  alternatives:
  - their children
  - their offspring
  rationale: The noun can denote children or offspring, but the immediate context concerns the male giant offspring of the
    Watchers; “sons” is therefore the clearest local rendering.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ሐጕሎሙ ለፍቁራኒሆሙ
  chosen: the destruction of their beloved ones
  alternatives:
  - the loss of their loved ones
  - the ruin of their beloved ones
  rationale: The construction presents what the Watchers see happen to those dear to them. “Destruction” retains the violent
    judicial force of the context, while “beloved ones” closely reflects ፍቁራን.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እሰሮሙ
  chosen: bind them
  alternatives:
  - imprison them
  - bind them fast
  rationale: The imperative calls for literal restraint of the Watchers. “Bind” preserves the concrete apocalyptic image;
    “imprison” would state an implication rather than the source action.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ለ፸ ትውልድ
  chosen: for seventy generations
  alternatives:
  - for seventy lineages
  rationale: “Generations” naturally conveys the specified extended period while preserving the symbolic apocalyptic number.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በመትሕተ አውግርተ ምድር
  chosen: beneath the valleys of the earth
  alternatives:
  - under the valleys of the earth
  - beneath the hills of the earth
  rationale: The preposition is spatially “beneath/under.” The topographical noun is difficult and has been understood as
    “valleys” or “hills”; “valleys” is retained in the main text, with the consequential alternative disclosed in a footnote.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዕለተ ኵነኔሆሙ ወተፍጻሜቶሙ
  chosen: the day of their judgment and their consummation
  alternatives:
  - the day of their condemnation and their end
  - the day of their judgment and completion
  rationale: ኵነኔ can refer to judgment or condemnation, while ተፍጻሜ denotes completion or consummation. The chosen wording
    preserves both coordinated judicial endpoints without collapsing them into one idea.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኵነኔ ዘለዓለመ ዓለም
  chosen: the judgment that is forever and ever
  alternatives:
  - eternal judgment
  - the judgment of eternity
  rationale: The expanded English relative clause preserves the Ge'ez's emphatic duration formula rather than reducing it
    to the less transparent adjective “eternal.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
