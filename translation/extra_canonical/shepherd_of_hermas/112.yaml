source:
  edition: Lightfoot & Harmer 1891 (edited Latin Vulgata ending)
  text: 'Dico ei: Interroga ipsum, domine, ex quo in domo mea est, an aliquid extra ordinem fecerim, in
    quo eum offenderim. 2. Et ego, inquit, scio nihil extra ordinem fecisse te neque esse facturum. et
    ideo haec loquor tecum, ut perseveres. bene enim de te hic apud me existimavit. tu autem ceteris haec
    verba dices, ut et illi qui egerunt aut acturi sunt paenitentiam, eadem quae tu sentiant, et hic apud
    me his bene interpretetur, et ego apud Dominum. 3. Et ego, inquam, domine, omni homini indico magnalia
    Domini; spero autem omnes qui iam antea peccaverunt, si haec audiant, quod libenter acturi sunt paenitentiam,
    vitam recuperantes. 4. Permane ergo, inquit, in hoc ministerio et consumma illud. quicumque autem
    mandata huius efficiunt, habebunt vitam, et hic apud Dominum magnum honorem. quicumque vero huius
    mandata non servant, fugiunt a sua vita et faciunt adversus illum, nec mandata eius secuntur, sed
    morti se tradunt, et unusquisque eorum reus fit sanguinis sui. tibi autem dico ut servias mandatis
    his, et remedium peccatorum habebis.'
