  from: to possess it
  to: to possess
  rationale: The Hebrew uses a second infinitive of purpose (לְרִשְׁתָּהּ), which the draft renders literally as 'to possess it'. While accurate, the pronoun 'it' is slightly redundant in this English construction and makes the phrase a little clunky. A more idiomatic rendering would be 'to possess', where the object ('this land') is understood from the preceding clause, resulting in a smoother and more natural English flow.
