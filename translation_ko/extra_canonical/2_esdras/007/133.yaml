  source_fidelity: 라틴어는 ‘자비로우시며’(et miserator)와, 그의 율법으로 돌아서는/회심하는 이들에게 자비를 베푸시는 까닭(in eo quod miseretur illis qui conversionem faciunt in lege eius)을 연결합니다. 현 번역은 핵심 의미를 잘 반영하지만, ‘자기 율법’은 한국어에서 주어 지시가 다소 모호하고 문체상 어색할 수 있습니다.
