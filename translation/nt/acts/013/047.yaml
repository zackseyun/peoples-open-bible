  meaning_decisions:
  - source_phrase: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος
    prior_rendering: For so the Lord has commanded us
    new_rendering: For this is what the Lord has commanded us
    rationale: The introductory adverb points forward to the wording of the command, which this construction makes explicit.
  - source_phrase: τοῦ εἶναί σε εἰς σωτηρίαν
    prior_rendering: so that you may be for salvation
    new_rendering: so that you may bring salvation
    rationale: The commission assigns a saving role; 'be for salvation' fails to express that role intelligibly in English. 'Bring salvation' conveys it without identifying the missionaries as its ultimate source.
