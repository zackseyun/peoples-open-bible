  from: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
  to: You shall not reap what grows on its own from your previous harvest or harvest the grapes of your unpruned vines[a]; it shall be a year of complete rest for the land.
  rationale: The lexical record correctly identifies spontaneous growth and vines left unpruned, and I preserve both meanings. Reading the prohibition alongside verses 6–7 warrants distinguishing the regular harvest from permitted consumption rather than retaining the overly broad 'gather.'
