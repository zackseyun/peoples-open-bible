id: PSA.73.9
reference: Psalms 73:9
source:
  edition: WLC
  text: שַׁתּ֣וּ בַ/שָּׁמַ֣יִם פִּי/הֶ֑ם וּ֝/לְשׁוֹנָ֗/ם תִּֽהֲלַ֥ךְ בָּ/אָֽרֶץ׃
translation:
  text: They set their mouths against the heavens, and their tongues range over the earth[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'they set their mouth in the heavens, and their tongue walks about on the earth.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתּוּ
  chosen: set
  alternatives:
  - put
  - set against
  lexicon: HALOT
  rationale: From שׁית/שתת in the sense of placing or setting. In this idiom with 'mouth' and 'in/against the heavens,' 'set' is the most natural English base verb. The hostile nuance is supplied by the larger phrase rather than by the verb alone.
- source_word: בַשָּׁמַיִם
  chosen: against the heavens
  alternatives:
  - in the heavens
  - toward the heavens
  lexicon: HALOT
  rationale: The context supports defiant speech against heaven, while the footnote preserves the literal and potentially significant “in the heavens.”
- source_word: פִּיהֶם
  chosen: their mouths
  alternatives:
  - their mouths
  lexicon: HALOT
  rationale: The Hebrew has a singular collective noun with a plural possessor; the English plural is more natural.
- source_word: וּלְשׁוֹנָם
  chosen: and their tongues
  alternatives:
  - and their tongues
  lexicon: HALOT
  rationale: The Hebrew representative singular is rendered as an idiomatic English plural parallel to “their mouths.”
- source_word: תִּהֲלַךְ
  chosen: range over
  alternatives:
  - walks through
  - goes through
  - ranges through
  lexicon: HALOT
  rationale: The verb means to walk or go about; “range over” preserves expansive movement without adding the unexpressed manner conveyed by “struts.”
- source_word: בָּאָרֶץ
  chosen: over the earth
  alternatives:
  - in the earth
  - through the land
  lexicon: HALOT
  rationale: With a verb of ranging movement, “over the earth” is natural English and preserves the heaven–earth scope.
