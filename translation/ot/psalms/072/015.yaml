id: PSA.72.15
reference: Psalms 72:15
source:
  edition: WLC
  text: וִ/יחִ֗י וְ/יִתֶּן ל/וֹ֮ מִ/זְּהַ֪ב שְׁ֫בָ֥א וְ/יִתְפַּלֵּ֣ל בַּעֲד֣/וֹ תָמִ֑יד כָּל הַ֝/יּ֗וֹם יְבָרֲכֶֽ/נְהֽוּ־־׃
translation:
  text: Long may he live! May some of the gold of Sheba be given to him; may prayer be offered for him continually, and may he be blessed all day long[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew uses active singular verbs whose pronoun referents are unstated; another reading takes the rescued person as the one who lives, gives gold to the king, prays for him, and blesses him.
    reason: alternative_reading
lexical_decisions:
- source_word: וִיחִי
  chosen: May he live
  alternatives:
  - And he shall live
  - Long may he live
  lexicon: HALOT
  rationale: Qal jussive 3ms of חיה expresses a wish/blessing. English 'May he live' best captures the volitive force without overcommitting to simple future.
- source_word: וְיִתֶּן לוֹ
  chosen: and may he give him
  alternatives:
  - and may he give to him
  - and he will give him
  lexicon: HALOT
  rationale: The form is active third masculine singular with a third masculine singular indirect object; the antecedents remain unstated.
- source_word: מִזְּהַב שְׁבָא
  chosen: some of the gold of Sheba
  alternatives:
  - some of the gold of Sheba
  - gold of Sheba
  lexicon: HALOT
  rationale: The מן construction can naturally be rendered partitivally in the context of giving royal tribute.
- source_word: וְיִתְפַּלֵּל בַּעֲדוֹ
  chosen: May he pray for him
  alternatives:
  - and may one pray for him
  - and he will pray for him
  - and may they pray for him
  lexicon: HALOT
  rationale: The verb is active third masculine singular, and the prepositional suffix is third masculine singular.
- source_word: תָמִיד
  chosen: continually
  alternatives:
  - constantly
  - regularly
  lexicon: HALOT
  rationale: תמיד denotes ongoing regularity. 'Continually' fits the elevated poetic register and pairs well with the following temporal phrase.
- source_word: כָּל הַיּוֹם
  chosen: all day long
  alternatives:
  - all the day
  - throughout the day
  lexicon: HALOT
  rationale: Idiomatic English rendering of the temporal expression in poetry.
- source_word: יְבָרֲכֶנְהוּ
  chosen: may he bless him
  alternatives:
  - may one bless him
  - he will bless him
  lexicon: HALOT
  rationale: The form is singular, with a singular object suffix; rendering its subject as “they” is unsupported by the morphology.
