base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023.yaml
  text: 'The compassionate and altogether beneficent Father has tender affections for those who fear him, and gently and kindly gives his gracious gifts to those who come to him with a single-minded heart.


    Therefore let us not be double-minded, nor let our soul entertain vain imaginations over his surpassing and glorious gifts. Far be from us this scripture, where it says, “Wretched are the double-minded, those who waver in their soul, who say, ‘These things we heard even in the days of our fathers, and look, we have grown old, and none of these things has happened to us.’”


    You foolish ones, compare yourselves to a tree: take a vine. First it sheds its leaves, then a shoot appears, then a leaf, then a flower, and after these comes the unripe grape, then the full cluster appears. You see that in a little season the fruit of the tree comes to maturity.


    Truly, quickly and suddenly his will shall be accomplished, as the scripture also bears witness, “Quickly he will come, and he will not delay,” and, “Suddenly the Lord will come to his temple, even the Holy One whom you expect.”'
translation:
  language: ko
  text: '긍휼이 많고 모든 면에서 선을 베푸시는 아버지께서는 자기를 두려워하는 이들에게 친밀한 사랑을 품으시며, 순전한 마음으로 그에게 나아오는 이들에게 은혜의 선물들을 온유하고 친절하게 베푸십니다.


    그러므로 우리는 두 마음을 품지 말아야 하며, 그의 뛰어나고 영광스러운 선물들 때문에 우리 영혼이 헛된 상상에 빠져서도 안 됩니다. 「두 마음을 품는 이들은 불쌍합니다. 그들은 자기 영혼 안에서 흔들리며, ‘이것들은 우리가 우리 조상들의 시대에도 들었습니다. 보십시오, 우리는 늙어 가는데도 이런 일들 가운데 아무것도 우리에게 일어나지 않았습니다’라고 말합니다」라는 이 성경 말씀은 우리에게서 멀리 떠나야 합니다.


    어리석은 이들이여, 나무를 본받아 보십시오. 포도나무를 가져오십시오. 먼저 잎이 떨어지고, 다음에 새싹이 나오며, 그 다음에 잎, 그 다음에 꽃, 그리고 그 뒤에 덜 익은 포도, 그다음에 온전한 송이가 나타납니다. 보십시오, 짧은 때 안에 나무의 열매가 익어 갑니다.


    참으로, 그의 뜻은 속히 그리고 갑자기 이루어질 것입니다. 성경도 증언하기를, 「그가 속히 오실 것이며 지체하지 않으실 것입니다」라고 하며, 「주께서 갑자기 자기 성전으로 오실 것이니, 곧 여러분이 기다리는 거룩하신 분이십니다」라고 합니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκτίρμων ... εὐεργετικὸς πατήρ
  english_pob_choice: The compassionate and altogether beneficent Father
  chosen_korean: 긍휼이 많고 모든 면에서 선을 베푸시는 아버지
  alternatives_korean:
  - 자비로우시고 전적으로 은혜로운 아버지
  - 불쌍히 여기시고 모든 선을 베푸시는 아버지
  lexicon: οἰκτίρμων, εὐεργετικός, πατήρ
  rationale: οἰκτίρμων의 연민/긍휼과 εὐεργετικός의 선행·유익 제공을 함께 살려, 추상화된 ‘은혜로우신’보다 원문의 성격을 드러내는 표현으로 옮겼습니다.
- source_word: σπλάγχνα
  english_pob_choice: tender affections
  chosen_korean: 친밀한 사랑
  alternatives_korean:
  - 애틋한 마음
  - 진심 어린 긍휼
  lexicon: σπλάγχνα
  rationale: 문자적 ‘내장’은 한국어에서 거칠 수 있어, 정서 중심의 관용적 의미를 살리되 원문의 내면적 애정을 반영하는 표현으로 옮겼습니다.
- source_word: ἁπλῇ διανοίᾳ
  english_pob_choice: with a single-minded heart
  chosen_korean: 순전한 마음
  alternatives_korean:
  - 한결같은 마음
  - 단일한 생각
  lexicon: ἁπλοῦς / διάνοια
  rationale: POB의 ‘single-minded’ 취지를 따라 분열되지 않은 내적 태도를 한국어 성서 문체의 ‘순전한 마음’으로 압축해 전달했습니다.
- source_word: διψυχῶμεν / δίψυχοι
  english_pob_choice: double-minded
  chosen_korean: 두 마음을 품다 / 두 마음을 품는 이들
  alternatives_korean:
  - 양다리를 걸치다
  - 마음이 갈라지다
  lexicon: δίψυχος
  rationale: 직역보다 한국어 성경에서 널리 이해되는 내적 분열의 표현을 택하되, ‘흔들리며’로 뒤의 설명을 보강해 원문의 심리적 긴장을 살렸습니다.
- source_word: τὰς χάριτας αὐτοῦ
  english_pob_choice: his gracious gifts
  chosen_korean: 은혜의 선물들
  alternatives_korean:
  - 그의 은혜들
  - 그의 호의로운 선물들
  lexicon: χάρις
  rationale: χάρις의 ‘은혜’와 문맥의 ‘선물’ 측면을 함께 반영해, 하나님의 호의가 구체적 선물로 주어진다는 의미를 드러냈습니다.
theological_decisions:
- issue: 성경 인용문의 권위와 종말론적 긴장
  chosen_reading: ‘속히’와 ‘갑자기’의 이중 강조를 살려, 하나님의 뜻의 성취가 지연 없이 이루어진다는 긴박성을 유지했습니다.
  alternative_readings:
  - 단순히 ‘곧’으로 완화
  - 미래 성취를 일반적 위로로 희석
  rationale: 원문과 POB 모두 시간적 긴박성을 강조하므로, 한국어에서도 예언적 확실성과 임박성을 약화하지 않도록 했습니다.
  doctrine_reference: 종말론적 성취의 확실성
- issue: ‘거룩하신 분’과 ‘주’의 병치
  chosen_reading: 마지막 인용을 ‘주’와 ‘거룩하신 분’으로 구분해, 본문의 인용 구조와 기대되는 메시아적 인물을 함께 드러냈습니다.
  alternative_readings:
  - 둘을 한 표현으로 합치기
  - ‘거룩한 자’로 일반화
  rationale: 원문은 주의 성전 방문과 ‘거룩하신 분’을 병치하므로, 메시아적-성전적 뉘앙스를 보존하는 번역이 필요합니다.
  doctrine_reference: 메시아적 성전 도래
