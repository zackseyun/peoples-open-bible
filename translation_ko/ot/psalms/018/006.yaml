  - 밧줄이
  - 줄이
  lexicon: HALOT
  rationale: 문맥이 포위와 포획의 이미지이므로 단순한 ‘끈’보다 얽어매고 잡아두는 함의를 살리는 ‘올가미’가 시적 효과를 더 잘 전달합니다.
- source_word: שְׁא֣וֹל
  english_pob_choice: Sheol
