  - all the days of the year come to
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The verb conveys reaching or totaling. 'Amount to' gives clear English while preserving the numerical force.
- source_word: ፭እምእሉኩ ፭ዓመት ተመሊኦሙ
