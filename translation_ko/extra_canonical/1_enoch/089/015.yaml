  rationale: 첫 동사는 명시적으로 공포를 주는 행위이고, 둘째 동사는 단순한 '공격'보다 지속적 강압·억압의 뉘앙스를 더 잘 살립니다.
- source_word: ወገደፉ፡ ደቂቆሙ
