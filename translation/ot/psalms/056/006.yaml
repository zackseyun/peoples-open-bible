  from: as they have waited for my life
  to: as they lie in wait for my life
  rationale: The current phrasing creates a slightly unnatural comparison in English. While 'as' is a valid translation for כַּאֲשֶׁר and 'have waited for' for קִוּוּ, the combination feels stilted. The Hebrew clause provides the manner or purpose for their watching. The suggested rewrite, 'as they lie in wait for my life,' uses a well-attested sense of קִוּוּ in a hostile context (as noted in footnote c) and creates a more natural parallel with 'they watch my steps,' clarifying that the watching is part of the act of lying in wait.
