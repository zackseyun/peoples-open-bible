id: DEU.6.15
reference: Deuteronomy 6:15
source:
  edition: WLC
  text: כִּ֣י אֵ֥ל קַנָּ֛א יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/קִרְבֶּ֑/ךָ פֶּן יֶ֠חֱרֶה אַף יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/ךְ וְ/הִשְׁמִ֣ידְ/ךָ֔ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־׃ס
translation:
  text: For Yahweh your God, who is in your midst, is a jealous God. Otherwise his anger will burn against you, and he will wipe you off the face of the earth.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - indeed
  lexicon: HALOT
  rationale: Introduces the reason for the prohibition in the previous verse; 'for' is the most natural English connective here.
- source_word: אֵל קַנָּא
  chosen: a jealous God
  alternatives:
  - a zealous God
  lexicon: HALOT
  rationale: The phrase denotes God's exclusive covenant claim and intolerance of rival worship. 'Jealous' is the established and most semantically precise rendering in this covenant context; 'zealous' weakens the relational exclusivity.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: אֱלֹהֶיךָ
  chosen: your God
  lexicon: HALOT
  rationale: Construct form with second masculine singular suffix; straightforwardly rendered 'your God.'
- source_word: בְּקִרְבֶּךָ
  chosen: in your midst
  alternatives:
  - among you
  - within you
  lexicon: HALOT
  rationale: The phrase indicates God's presence among his people. 'In your midst' preserves the covenantal and spatial sense better than the more individualized 'within you.'
- source_word: פֶּן
  chosen: lest
  alternatives:
  - otherwise
  - so that not
  lexicon: HALOT
  rationale: Introduces a warning of possible consequence. 'Lest' is concise and suitably solemn in this legal-covenantal context.
- source_word: יֶחֱרֶה אַף
  chosen: the anger ... burn
  alternatives:
  - be kindled
  - flare up
  lexicon: HALOT
  rationale: This idiom literally involves anger burning or kindling. 'Burn' preserves the metaphor in readable modern English.
- source_word: בָּךְ
  chosen: against you
  alternatives:
  - in you
  lexicon: HALOT
  rationale: With verbs of anger, the preposition is idiomatically adversative in English; 'against you' conveys the sense clearly.
- source_word: וְהִשְׁמִידְךָ
  chosen: and he destroy you
  alternatives:
  - and he exterminate you
  - and he wipe you out
  lexicon: HALOT
  rationale: Hiphil of שׁמד conveys destruction/removal. 'Destroy' is strong, accurate, and avoids colloquial flattening.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  chosen: from the face of the earth
  alternatives:
  - from upon the face of the ground
  - from the land
  lexicon: HALOT
  rationale: This is a standard Hebrew idiom for removal from the inhabited earth/ground. 'From the face of the earth' is idiomatic English and preserves the force of total removal.
