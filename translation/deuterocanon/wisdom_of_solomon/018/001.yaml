- issue: Referent of the implied subject in the participial and finite verbs after the semicolon
  chosen_reading: The Egyptians/hearers are the ones hearing the Israelites' voice without seeing their form, and then counting them blessed.
  alternative_readings:
  - The holy ones are the ones hearing another group's voice
