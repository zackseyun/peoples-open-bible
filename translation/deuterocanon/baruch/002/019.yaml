translation:
  text: For it is not on the basis of the righteous deeds of our fathers and of our kings that we lay our plea for mercy before you, O Lord our God,
  philosophy: dynamic
lexical_decisions:
- source_word: δικαιώματα
  chosen: righteous deeds
  alternatives:
  - righteous acts
  - ordinances
  - statutes
  - just deeds
  lexicon: LSJ
  rationale: In this penitential prayer context, the phrase 'of our fathers and of our kings' points to deeds or claims of righteousness rather than legal ordinances possessed by them. 'Righteous deeds' best captures the sense of meritorious acts without importing technical legal language.
- source_word: καταβάλλομεν
  chosen: lay
  alternatives:
  - present
  - cast down
  - bring forward
  - submit
  lexicon: LSJ
  rationale: With 'τὸν ἔλεον' and 'before your face,' the verb is idiomatic for setting or laying something before someone. 'Lay' preserves the concrete imagery while remaining natural English.
- source_word: τὸν ἔλεον
  chosen: our plea for mercy
  alternatives:
  - mercy
  - compassion
  - supplication for mercy
  lexicon: LSJ
  rationale: A literal 'the mercy' is awkward in English and could imply that the speakers are offering mercy rather than appealing for it. The context is petitionary prayer, so 'our plea for mercy' makes explicit the object of the appeal while staying close to the idiom.
- source_word: κατὰ πρόσωπόν σου
  chosen: before your face
  alternatives:
  - before you
  - in your presence
  lexicon: LSJ
  rationale: The Greek is literally face-oriented language. 'Before your face' preserves the vivid Hebraic/LXX idiom and the solemnity of direct address, while remaining understandable in English.
- source_word: Κύριε ὁ θεὸς ἡμῶν
  chosen: O Lord our God
  alternatives:
  - O Lord, our God
  lexicon: LSJ
  rationale: '''Lord'' follows the project''s default rendering for κύριος. The vocative address is retained with ''O'' for prayerful solemnity.'
