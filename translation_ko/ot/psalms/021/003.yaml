id: PSA.21.3
reference: Psalms 21:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תְ֭קַדְּמֶ/נּוּ בִּרְכ֣וֹת ט֑וֹב תָּשִׁ֥ית לְ֝/רֹאשׁ֗/וֹ עֲטֶ֣רֶת פָּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/003.yaml
  text: For you meet him[b] with blessings of good things; you set a crown of fine gold[a] on his head.
  footnotes:
  - marker: a
    text: '''Fine gold'' may also be rendered ''pure gold'' or ''refined gold.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'you go before him with blessings of good things' or 'you come to meet him with blessings of good things.' The Hebrew verb can carry the sense of meeting or going before someone in advance.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 좋은 복으로 그를 맞이하시며, 그의 머리에 순금 왕관을 씌우십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맞이하시며’는 ‘그보다 앞서 가시다’ 또는 ‘미리 그에게 나아가시다’로도 옮길 수 있습니다. 히브리어 동사는 누군가를 앞서 맞이하거나 먼저 나아가는 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘순금’은 ‘정금’ 또는 ‘정련된 금’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  english_pob_choice: his heart’s desire
  chosen_korean: 그의 마음의 소원
  alternatives_korean:
  - 그의 হৃদ의 소원
  - 그의 마음의 바람
  lexicon: HALOT
  rationale: 히브리어의 내적 욕구를 한국어에서 자연스럽게 드러내면서도, 시편의 병행 구조를 살려 ‘입술의 요청’과 대응되게 했습니다.
- source_word: נָתַתָּה לּוֹ
  english_pob_choice: you have given him
  chosen_korean: 주께서는 … 주셨고
  alternatives_korean:
  - 주께서 … 주셨습니다
  - 주께서는 … 주셨습니다
  lexicon: HALOT
  rationale: 완료형의 감사 진술을 현재와 연결된 결과로 옮기기 위해 ‘주셨고’로 처리했고, 시편의 직접적 호칭을 살려 ‘주께서’ 대신 ‘주께서는’으로 시작했습니다.
- source_word: וַאֲרֶשֶׁת שְׂפָתָיו
  english_pob_choice: the request of his lips
  chosen_korean: 그의 입술의 요청
  alternatives_korean:
  - 그의 입술의 청원
  - 그의 입술의 간구
  - 그의 입술의 소원
  lexicon: HALOT
  rationale: 희귀 명사 וַאֲרֶשֶׁת을 ‘요청’으로 옮겨, 내적 소원과 구별되는 말로 된 청원을 드러냈습니다.
- source_word: בַּל מָנַעְתָּ
  english_pob_choice: you have not withheld
  chosen_korean: 거두지 않으셨습니다
  alternatives_korean:
  - 막지 않으셨습니다
  - 금하지 않으셨습니다
  - 거절하지 않으셨습니다
  lexicon: HALOT
  rationale: מנע의 ‘막다/가로막다/거두다’ 의미 가운데, 시적 문맥에서 은혜로운 응답의 뉘앙스를 살리기 위해 ‘거두지 않다’를 선택했습니다.
- source_word: סֶּלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 셀라
  lexicon: HALOT
  rationale: 정확한 기능이 확정되지 않으므로 음역을 유지했습니다.
theological_decisions:
- issue: 화자와 직접 호칭의 유지
  chosen_reading: 시적 감사 진술을 현대 예배체로 옮기되, 하나님께 대한 직접 호칭은 ‘주께서는’으로 유지했습니다.
  alternative_readings:
