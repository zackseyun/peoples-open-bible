base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/010.yaml
  text: 'And these are the names of those who lead them: those who keep watch and go in at their appointed times, those who lead them in their stations and in their orders and in their times and in their months and in their authorities and in their positions.'
translation:
  language: ko
  text: 다음은 그들을 인도하는 이들의 이름들입니다. 곧 정해진 때에 살피고 들어가며, 그들을 자기들의 자리와 질서와 때와 달과 권위와 위치에서 인도하는 이들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አስማቲሆሙ
  english_pob_choice: the names of those who lead them
  chosen_korean: 그들을 인도하는 이들의 이름
  alternatives_korean:
  - 그들을 이끄는 자들의 이름
  - 그들을 다스리는 이들의 이름
  lexicon: 이름 / 인도하다
  rationale: 원문의 초점이 ‘명단의 이름들’에 있으므로, 행위보다 명사구를 살려 ‘이들의 이름’으로 옮겼고, leadership은 중립적인 ‘인도하다’로 표현했습니다.
- source_word: የዐቅቡ
  english_pob_choice: keep watch
  chosen_korean: 자기들의 정해진 때에 들어가며
  alternatives_korean:
  - 지키며
  - 경계하며
  lexicon: 지키다 / 들어가다
  rationale: POB의 ‘go in’에 따라 문맥상 성소/직무의 교대 입장을 뜻하는 것으로 보아, 단순한 ‘감시’보다 ‘정해진 때에 들어가다’로 구체화했습니다.
- source_word: በመካናቲሆሙ ... በምቅዋማቲሆሙ
  english_pob_choice: in their stations ... in their positions
  chosen_korean: 자기들의 자리와 ... 직분에 따라
  alternatives_korean:
  - 자기들의 위치와 ... 자리에서
  - 자기들의 직무와 ... 위치에 따라
  lexicon: 자리 / 직분
  rationale: 열거되는 상태어들을 한국어로 자연스럽게 살리되, ‘positions’는 물리적 위치보다 직무상 위치에 가까워 ‘직분’으로 옮겼습니다.
- source_word: ወበሥርዓታቲሆሙ ወ*በ*ጊዜያቲሆሙ ወበአውራኂሆሙ ወበስልጣናቲሆሙ
  english_pob_choice: in their orders and in their times and in their months and in their authorities
  chosen_korean: 질서와 때와 달과 권위
  alternatives_korean:
  - 규례와 시기와 달과 통치
  - 명령과 시간과 달과 권세
  lexicon: 질서 / 때 / 달 / 권위
  rationale: 원문의 병렬 구조를 따라 각 항목을 분리했고, ‘authorities’는 권세보다 통치적 위상에 가까운 ‘권위’로 번역했습니다.
theological_decisions:
- issue: 직분·권위의 열거가 천상 질서인지 단순한 행정 체계인지
  chosen_reading: 천상 존재들의 정해진 질서와 담당 구역을 가리키는 열거로 읽었습니다.
  alternative_readings:
  - 단순한 조직 운영의 비유
  - 별자리·천문 주기의 묘사
  rationale: 문맥상 ‘때, 달, 권위, 직분’이 함께 나와, 시간성과 위계성이 결합된 천상 질서를 나타내는 것으로 보입니다.
  doctrine_reference: 제2성전기 천사론과 질서 개념에 대한 일반 주해
