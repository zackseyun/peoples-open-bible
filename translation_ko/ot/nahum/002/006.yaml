    reason: cultural_note
  revision_rationale: 문맥상 소집의 뜻을 유지하되, 주요 어휘의 범위를 더 자연스럽고 정확하게 반영했습니다. 공성 도구는 정확한 형태가 불확실하므로 ‘차폐물’로 제한하여 소스의 보호·가림 의미를 보존했습니다. 두 각주는 해당 어구에 직접 붙였습니다.
