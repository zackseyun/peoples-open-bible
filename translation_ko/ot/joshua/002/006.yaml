  source_fidelity: 원문의 הֶעֱלָתַם은 라합이 그들을 지붕으로 ‘데리고 올라간’ 선행 행동을 나타냅니다. 현 초안의 ‘올라가게 한’은 사역형을 기계적으로 반영하여 라합이 직접 동행해 올린 의미를 약화할 수 있습니다. לָהּ는 ‘그녀를 위해/자신을 위해’라는 여격·이익의 뉘앙스를 본문에 명시하는 것이 적절합니다.
  naturalness: ‘그들을 지붕으로 데리고 올라가’와 ‘아마 줄기들 사이에’가 현대 표준 한국어 합쇼체에서 자연스럽고, 선행 행동과 주된 행동의 관계도 명료합니다.
  terminology: פִּשְׁתֵּי הָעֵץ는 ‘아마 줄기들’로, טמן은 ‘숨겼습니다’로 유지하는 것이 적절합니다. ‘자신을 위해’는 주어 라합을 분명히 가리키면서 원문의 לָהּ를 보존합니다.
  issues:
