    issue: ‘그는 없어집니다’의 시제·상 표현
    rationale: אֵינֶנּוּ는 ‘더 이상 존재하지 않는다’는 결과 상태를 말합니다. ‘그는 더 이상 없습니다’가 원문과 영어 POB의 ‘he is no more’에 더 가깝습니다.
