  meaning: The gospel was proclaimed to people who have since died so that, despite undergoing humanity’s bodily death, they might live in the spirit as God intends.
  meaning_decisions:
  - source_phrase: καὶ νεκροῖς εὐηγγελίσθη
    prior_rendering: the gospel was also proclaimed to the dead
    new_rendering: the gospel was proclaimed even to those who are now dead
    rationale: The connection with verse 5 most naturally reassures readers about people who heard the gospel while alive but have since died; proclamation after death remains a serious alternative.
  - source_phrase: κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ
    prior_rendering: though judged according to men in the flesh
    new_rendering: although they underwent the judgment of death in the body, as all people do
    rationale: In this reading, physical death is the judgment shared by humanity; making that sense explicit explains why death does not defeat the gospel’s purpose, while a note preserves human condemnation as an alternative.
  - source_phrase: ζῶσι δὲ κατὰ θεὸν πνεύματι
    prior_rendering: they might live according to God in the spirit
    new_rendering: they might live in the spirit as God intends
    rationale: The phrase contrasts ordinary humanity’s bodily judgment with spiritual life corresponding to God’s purpose; “as God intends” makes the governing relationship intelligible without defining the precise mode of that life.
