  text: Καὶ μετὰ τὸ συντελέσαι αὐτὸν τὰς ἐπιλύσεις πασῶν τῶν ῥάβδων λέγει μοι· Ὕπαγε, καὶ πᾶσι λέγε ἵνα
    μετανοήσωσι, καὶ ζήσονται τῷ Θεῷ· ὅτι ὁ Κύριος ἔπεμψέ με σπλαγχνισθεὶς πᾶσι δοῦναι τὴν μετάνοιαν,
    καίπερ τινῶν μὴ ὄντων ἀξίων διὰ τὰ ἔργα αὐτῶν· ἀλλὰ μακρόθυμος ὢν ὁ Κύριος θέλει τὴν κλῆσιν τὴν γενομένην
    διὰ τοῦ υἱοῦ αὐτοῦ σώζεσθαι. 2. λέγω αὐτῷ· Κύριε, ἐλπίζω ὅτι πάντες ἀκούσαντες αὐτὰ μετανοήσουσι.
    πείθομαι γὰρ ὅτι εἷς ἕκαστος τὰ ἴδια ἔργα ἐπιγνοὺς καὶ φοβηθεὶς τὸν Θεὸν μετανοήσει. 3. ἀποκριθείς
    μοι λέγει· Ὅσοι, [φησίν,] ἐξ ὅλης καρδίας αὐτῶν [μετανοήσωσι καὶ] καθαρίσωσιν ἑαυτοὺς ἀπὸ τῶν πονηριῶν
    αὐτῶν τῶν προειρημένων καὶ μηκέτι μηδὲν προσθῶσι ταῖς ἁμαρτίαις αὐτῶν, λήψονται ἴασιν παρὰ τοῦ Κυρίου
    τῶν προτέρων ἁμαρτιῶν, ἐὰν μὴ διψυχήσωσιν ἐπὶ ταῖς ἐντολαῖς ταύταις, καὶ ζήσονται τῷ Θεῷ. [ὅσοι δέ,
    φησί, προσθῶσι ταῖς ἁμαρτίαις αὐτῶν καὶ ἀναστραφῶσιν ἐν ταῖς ἐπιθυμίαις τοῦ αἰῶνος τούτου, κατακρινοῦσιν
    ἑαυτοὺς εἰς θάνατον.] 4. σὺ δὲ πορεύου ἐν ταῖς ἐντολαῖς μου, καὶ ζῆθι [τῷ Θεῷ· καὶ ὅσοι ἂν πορευθῶσιν
    ἐν αὐταῖς καὶ κατορθώσωσι, ζήσονται τῷ Θεῷ.] 5. ταῦτά μοι δείξας [καὶ λαλήσας] πάντα λέγει μοι· Τὰ
    δὲ λοιπὰ ἐπιδείξω μετ᾿ ὀλίγας ἡμέρας.
