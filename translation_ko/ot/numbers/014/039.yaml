source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּֽתְאַבְּל֥וּ הָ/עָ֖ם מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/039.yaml
  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
  footnotes:
  - marker: a
    text: Or 'to all the Israelites' or traditionally 'to all the children of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 이 말씀들을 이스라엘의 모든 자손에게[a] 말하였고, 백성은 크게 애통해하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 이스라엘 사람’; 전통적으로 ‘이스라엘의 모든 자녀’.
    reason: בְּנֵי יִשְׂרָאֵל의 관용적 민족 명칭에 대한 번역 대안을 제시합니다.
lexical_decisions:
- source_word: וַ/יְדַבֵּ֤ר
  english_pob_choice: spoke
  chosen_korean: 말하니
  alternatives_korean: 말하였다
  lexicon: verb, qal, consecutive
  rationale: Consecutive form indicates narrative flow; '말하니' connects the action to the result, maintaining formal narrative tone.
- source_word: הָ/עָ֖ם
  english_pob_choice: people
  chosen_korean: 백성
  alternatives_korean: 무리
  lexicon: noun, common
  rationale: '''백성'' is the standard formal term for ''people'' in biblical context, distinguishing the collective from individuals.'
- source_word: מְאֹֽד
  english_pob_choice: greatly
  chosen_korean: 심히
  alternatives_korean: 매우
  lexicon: adverb
  rationale: '''심히'' conveys the intensity of the mourning more formally than ''매우''.'
theological_decisions:
- decision: Maintain collective identity
  rationale: Used '이스라엘 모든 자손' to reflect the covenantal identity of the community as 'sons of Israel' without archaic phrasing.
