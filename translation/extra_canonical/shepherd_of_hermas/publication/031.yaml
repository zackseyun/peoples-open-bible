  text: 'Ἔτι, φημί, κύριε, προσθήσω τοῦ ἐπερωτῆσαι. Λέγε, φησίν· Ἤκουσα, φημί, κύριε, παρά τινων διδασκάλων,
    ὅτι ἑτέρα μετάνοια οὐκ ἔστιν εἰ μὴ ἐκείνη, ὅτε εἰς ὕδωρ κατέβημεν καὶ ἐλάβομεν ἄφεσιν ἁμαρτιῶν ἡμῶν
    τῶν προτέρων. 2. λέγει μοι· Καλῶς ἤκουσας· οὕτω γὰρ ἔχει. ἔδει γὰρ τὸν εἰληφότα ἄφεσιν ἁμαρτιῶν μηκέτι
    ἁμαρτάνειν, ἀλλ᾽ ἐν ἁγνείᾳ κατοικεῖν. 3. ἐπεὶ δὲ πάντα ἐξακριβάζῃ, καὶ τοῦτό σοι δηλώσω, μὴ διδοὺς
    ἀφορμὴν τοῖς μέλλουσι πιστεύειν ἢ τοῖς νῦν πιστεύσασιν εἰς τὸν Κύριον. οἱ γὰρ νῦν πιστεύσαντες ἢ μέλλοντες
    πιστεύειν μετάνοιαν ἁμαρτιῶν οὐκ ἔχουσιν, ἄφεσιν δὲ ἔχουσι τῶν προτέρων ἁμαρτιῶν αὐτῶν. 4. τοῖς οὖν
    κληθεῖσι πρὸ τούτων τῶν ἡμερῶν ἔθηκεν ὁ Κύριος μετάνοιαν. καρδιογνώστης γὰρ ὢν ὁ Κύριος καὶ πάντα
    προγινώσκων, ἔγνω τὴν ἀσθένειαν τῶν ἀνθρώπων καὶ τὴν πολυπλοκίαν τοῦ διαβόλου, ὅτι ποιήσει τι κακὸν
    τοῖς δούλοις τοῦ Θεοῦ καὶ πονηρεύσεται εἰς αὐτούς· 5. πολυεύσπλαγχνος οὖν ὢν ὁ Κύριος ἐσπλαγχνίσθη
    ἐπὶ τὴν ποίησιν αὐτοῦ καὶ ἔθηκεν τὴν μετάνοιαν ταύτην, καὶ ἐμοὶ ἡ ἐξουσία τῆς μετανοίας ταύτης ἐδόθη.
    6. ἀλλὰ ἐγώ σοι λέγω, φησί· μετὰ τὴν κλῆσιν ἐκείνην τὴν μεγάλην καὶ σεμνὴν ἐάν τις ἐκπειρασθεὶς ὑπὸ
    τοῦ διαβόλου ἁμαρτήσῃ, μίαν μετάνοιαν ἔχει. ἐὰν δὲ ὑπὸ χεῖρα ἁμαρτάνῃ καὶ μετανοήσῃ, ἀσύμφορόν ἐστι
    τῷ ἀνθρώπῳ τῷ τοιούτῳ· δυσκόλως γὰρ ζήσεται. 7. λέγω αὐτῷ· Ἐζωοποιήθην ταῦτα παρὰ σοῦ ἀκούσας οὕτως
    ἀκριβῶς· οἶδα γὰρ ὅτι, ἐὰν μηκέτι προσθήσω ταῖς ἁμαρτίαις μου, σωθήσομαι. Σωθήσῃ, φησί, καὶ πάντες
    ὅσοι ἐὰν ταῦτα ποιήσωσιν.


    Ἠρώτησα αὐτὸν πάλιν λέγων· Κύριε, ἐπεὶ ἅπαξ ἀνέχῃ μου, ἔτι μοι καὶ τοῦτο δήλωσον. Λέγε, φησίν. Ἐὰν
    γυνή, φημί, κύριε, ἢ πάλιν ἀνήρ τις κοιμηθῇ, καὶ γαμήσῃ τις ἐξ αὐτῶν, μήτι ἁμαρτάνει ὁ γαμῶν; 2. Οὐχ
    ἁμαρτάνει, φησίν· ἐὰν δὲ ἐφ'' ἑαυτῷ μείνῃ τις, περισσοτέραν ἑαυτῷ τιμὴν καὶ μεγάλην δόξαν περιποιεῖται
    πρὸς τὸν Κύριον· ἐὰν δὲ καὶ γαμήσῃ, οὐχ ἁμαρτάνει. 3. τήρει οὖν τὴν ἁγνείαν καὶ τὴν σεμνότητα, καὶ
    ζήσῃ τῷ Θεῷ. ταῦτά σοι ὅσα λαλῶ καὶ μέλλω λαλεῖν, φύλασσε ἀπὸ τοῦ νῦν, ἀφ'' ἧς μοι παρεδόθης ἡμέρας,
    καὶ εἰς τὸν οἶκόν σου κατοικήσω. 4. τοῖς δὲ προτέροις σου παραπτώμασιν ἄφεσις ἔσται, ἐὰν τὰς ἐντολάς
    μου φυλάξῃς· καὶ πᾶσι δὲ ἄφεσις ἔσται, ἐὰν τὰς ἐντολάς μου ταύτας φυλάξωσι καὶ πορευθῶσιν ἐν τῇ ἁγνότητι
    ταύτῃ.'
