  to: For he came out of prison[a] to reign, though even in his kingdom he had been born poor.
  rationale: '“From prison” is the natural English equivalent of מִבֵּית הַסּוּרִים; retaining “house of prisoners” in the main text would be unnecessarily gloss-like. The literal wording is honestly preserved in a note. Removing the former note about being born “during his reign” is warranted: that alternative imposes a temporally implausible English sense and does not clarify the Hebrew’s genuine difficulty. “In his kingdom” appropriately preserves the lexical ambiguity of בְּמַלְכוּתוֹ without over-resolving it.'
