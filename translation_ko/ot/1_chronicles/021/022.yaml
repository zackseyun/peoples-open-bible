  to: 그때 다윗이 오르난에게 말했습니다. “타작마당의 자리를 내게 주십시오. 내가 그 위에 야훼를 위한 제단을 쌓겠습니다. 제값을 받고 그것을 내게 주십시오. 그리하여 백성 위의 재앙이 그치게 하십시오.”
  rationale: 매매 대가의 표현을 현대 표준어로 다듬고, 재앙의 중단을 다윗의 청원 목적에 맞게 옮겼습니다. 원문의 범위를 넘어 전염병으로 한정하지 않았으며, 불필요한 각주 표지를 제거했습니다.
