  text: Εἶτα ἦλθε κατανοῆσαι τοὺς λευκοὺς καὶ στρογγύλους λίθους, καὶ λέγει μοι· Τί
    ποιοῦμεν περὶ τούτων τῶν λίθων; Τί, φημί, ἐγὼ γινώσκω, κύριε; [Καὶ λέγει μοι·]
    Οὐδὲν οὖν ἐπινοεῖς περὶ αὐτῶν; 2. Ἐγώ, φημί, κύριε, ταύτην τὴν τέχνην οὐκ ἔχω,
    οὐδὲ λατόμος εἰμί, οὐδὲ δύναμαι νοῆσαι. Οὐ βλέπεις αὐτούς, φησί, λίαν στρογγύλους
    ὄντας; καὶ ἐὰν θελήσω αὐτοὺς τετραγώνους ποιῆσαι, πολὺ δεῖ ἀπ᾿ αὐτῶν ἀποκοπῆναι·
    δεῖ δὲ ἐξ αὐτῶν ἐξ ἀνάγκης τινὰς εἰς τὴν οἰκοδομὴν τεθῆναι. 3. Εἰ οὖν, φημί, κύριε,
    ἀνάγκη ἐστί, τί σεαυτὸν βασανίζεις καὶ οὐκ ἐκλέγεις εἰς τὴν οἰκοδομὴν οὓς θέλεις,
    καὶ ἁρμόζεις εἰς αὐτήν; ἐξελέξατο ἐξ αὐτῶν τοὺς μείζονας καὶ λαμπρούς, καὶ ἐλατόμησεν
    αὐτούς· αἱ δὲ παρθένοι ἄρασαι ἥρμοσαν εἰς τὰ ἐξώτερα μέρη τῆς οἰκοδομῆς. 4. οἱ
    δὲ λοιποὶ οἱ περισσεύσαντες ἤρθησαν, καὶ ἀπετέθησαν εἰς τὸ πεδίον ὅθεν ἠνέχθησαν·
    οὐκ ἀπεβλήθησαν δέ, Ὅτι, φησί, λείπει τῷ πύργῳ ἔτι μικρὸν οἰκοδομηθῆναι. πάντως
    δὲ θέλει ὁ δεσπότης τοῦ πύργου τούτους ἁρμοσθῆναι τοὺς λίθους εἰς τὴν οἰκοδομήν,
    ὅτι λαμπροί εἰσι λίαν. 5. ἐκλήθησαν δὲ γυναῖκες δώδεκα, εὐειδέσταται τῷ χαρακτῆρι,
    μέλανα ἐνδεδυμέναι, [περιεζωσμέναι καὶ ἔξω τοὺς ὤμους ἔχουσαι,] καὶ τὰς τρίχας
    λελυμέναι. ἐδόκουσαν δέ μοι αἱ γυναῖκες αὗται ἄγριαι εἶναι. ἐκέλευσε δὲ αὐτὰς
    ὁ ποιμὴν ἆραι τοὺς λίθους τοὺς ἀποβεβλημένους ἐκ τῆς οἰκοδομῆς, καὶ ἀπενεγκεῖν
    αὐτοὺς εἰς τὰ ὄρη ὅθεν καὶ ἠνέχθησαν. 6. αἱ δὲ ἱλαραὶ ἦσαν, καὶ ἀπήνεγκαν πάντας
    τοὺς λίθους, καὶ ἔθηκαν ὅθεν ἐλήφθησαν. καὶ μετὰ τὸ ἀρθῆναι πάντας τοὺς λίθους
    καὶ μηκέτι κεῖσθαι λίθον κύκλῳ τοῦ πύργου, λέγει μοι ὁ ποιμήν· Κυκλώσωμεν τὸν
    πύργον, καὶ ἴδωμεν μή τι ἐλάττωμά ἐστιν ἐν αὐτῷ. καὶ ἐκύκλευον ἐγὼ μετ᾿ αὐτοῦ.
    7. ἰδὼν δὲ ὁ ποιμὴν τὸν πύργον εὐπρεπῆ ὄντα τῇ οἰκοδομῇ, λίαν ἱλαρὸς ἦν· ὁ γὰρ
    πύργος οὕτως ἦν ᾠκοδομημένος, ὥστε με ἰδόντα ἐπιθυμεῖν τὴν οἰκοδομὴν αὐτοῦ· οὕτω
    γὰρ ἦν ᾠκοδομημένος, ὡσὰν ἐξ ἑνὸς λίθου, μὴ ἔχων μίαν ἁρμογὴν ἐν ἑαυτῷ. ἐφαίνετο
    δὲ ὁ λίθος ὡς ἐκ τῆς πέτρας ἐκκεκολαμμένος· μονόλιθος γάρ μοι ἐδόκει εἶναι.
