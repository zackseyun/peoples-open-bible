id: PSA.55.18
reference: Psalms 55:18
source:
  edition: WLC
  text: פָּ֘דָ֤ה בְ/שָׁל֣וֹם נַ֭פְשִׁ/י מִ/קֲּרָב לִ֑/י כִּֽי בְ֝/רַבִּ֗ים הָי֥וּ עִמָּדִֽ/י־־׃
translation:
  text: He has redeemed my life in safety from the battle against me, though many fought against me[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “for many were on my side”; literally, “for many were with me.”
    reason: alternative_reading
lexical_decisions:
- source_word: פָּדָה
  chosen: has redeemed
  alternatives:
  - redeemed
  - ransomed
  - delivered
  lexicon: HALOT
  rationale: The verb פדה commonly denotes redeeming/ransoming by rescue. 'Has redeemed' preserves the perfect aspect naturally in English and retains the stronger covenantal-rescue sense better than the flatter 'delivered.'
- source_word: בְשָׁלוֹם
  chosen: in safety
  alternatives:
  - in safety
  - peacefully
  - in peace
  lexicon: HALOT
  rationale: In a rescue from battle, shalom denotes safe well-being. 'In safety' expresses the result clearly.
- source_word: נַפְשִׁי
  chosen: my life
  alternatives:
  - my life
  - me
  - my soul
  lexicon: HALOT
  rationale: Here nephesh is the psalmist's endangered life or self, not a separable immaterial soul.
- source_word: מִקֲּרָב לִי
  chosen: from the battle against me
  alternatives:
  - from battle against me
  - from my conflict
  - from the attack on me
  lexicon: HALOT
  rationale: קְרָב denotes battle or combat. The preposition לִי here is best taken adversatively/contextually as 'against me' in idiomatic English. This yields a clear sense without obscuring the military imagery.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - indeed
  lexicon: HALOT
  rationale: כִּי introduces the reason or explanation for the preceding statement. 'For' fits the poetic flow and preserves the explanatory force.
- source_word: בְרַבִּים
  chosen: many fought
  alternatives:
  - they were many in number
  - in great numbers
  - they were many
  lexicon: HALOT
  rationale: The plural multitude is the subject of the conflict clause.
- source_word: עִמָּדִי
  chosen: against me
  alternatives:
  - against me
  - beside me
  - with me
  lexicon: HALOT
  rationale: With the battle context, 'with me' means engaged in conflict with the psalmist, hence 'against me.'
