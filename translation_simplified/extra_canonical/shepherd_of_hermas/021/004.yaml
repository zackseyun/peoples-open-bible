  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/004.yaml
  text: Therefore those who have repented completely will be new and firmly founded, those who have repented from their whole heart. You have the revelation complete. No longer ask anything about revelation; but if anything is needed, it will be revealed to you.
translation:
  language: en
  text: Therefore, those who have repented[a] completely—with their whole heart—will be new and firmly established. You have received the full revelation. Do not ask any more questions about revelation. But if anything else is needed, it will be revealed to you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You have the revelation complete
  simplified_phrase: You have received the full revelation
  preserved_meaning: The revelation given to the hearer is now complete.
  reasoning_layer_used: POB translation and immediate context
  rationale: The recast sentence clarifies that the complete revelation has been given.
translation_notes:
  risk_flags:
  - risk: “Firmly established” makes the foundation image less concrete.
    mitigation: The wording retains the sense of secure founding rather than reducing it to general strength.
