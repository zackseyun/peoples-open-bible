- from: 제 말들에 귀를 기울이소서, 야훼여. 제 신음하는 소리를 깨달아 주십시오.[a]
  to: 제 도움을 청하는 부르짖는 소리에 귀 기울여 주십시오, 나의 왕, 나의 하나님이여. 제가 주께 기도합니다.[a]
  rationale: 제시된 WLC 시편 5:2를 기준으로 절 전체를 바로잡았습니다. הַקְשִׁיבָה는 공손한 간청으로 ‘귀 기울여 주십시오’로, לְקוֹל שַׁוְעִי는 도움을 요청하는 성격을 드러내어 ‘제 도움을 청하는 부르짖는 소리’로 옮겼습니다. מַלְכִּי וֵאלֹהָי의 두 호격과 אֵלֶיךָ의 방향성을 각각 ‘나의 왕, 나의 하나님이여’와 ‘주께’로 보존했습니다. אֶתְפַּלָּל은 문맥상 현재의 기도로 번역하되 미래 가능성은 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:46:23Z'
