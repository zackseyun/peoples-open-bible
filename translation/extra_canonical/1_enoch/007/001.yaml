translation:
  text: These and all the others with them took wives for themselves, and each chose one for himself. Then they began to go
    in to them and join themselves to them.[a] They taught them charms and incantations,[b] the cutting of roots, and made
    them acquainted with plants.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez verb means “join” or “associate oneself.” In this context it may imply cohabitation; “defile themselves”
      is an interpretive alternative.
    reason: lexical_alternative
  - marker: b
    text: The two Ge'ez terms designate forms of magical practice, but their precise distinction is uncertain; they may also
      be rendered “spells and enchantments.”
    reason: lexical_alternative
  - marker: c
    text: “These” is parenthesized and the first conjunction bracketed in the selected Charles printing. The joining verb
      and magical terms have variants; the source is not harmonized to another language witness. “Plants” includes the plants/shrubs
      sense discussed in the printed apparatus.
    reason: textual_variant
lexical_decisions:
- source_word: እሉ፡ ወባዕዳን፡ ኵሉ፡ ምስሌሆሙ
  chosen: These and all the others with them
  alternatives:
  - These, and the others—all of them with them
  - These and all their companions
  rationale: Preserves the demonstrative “these,” which points back to the Watchers in the preceding context, while representing
    ባዕዳን as “others” and ምስሌሆሙ as “with them.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ነሥኡ፡ ሎሙ፡ አንስተ
  chosen: took wives for themselves
  alternatives:
  - took women for themselves
  rationale: አንስት can denote women or wives. The accompanying language of each choosing one for himself supports “wives,”
    without implying that the unions were legitimate.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ወኃረዩ፡ ኵሉ፡ ለለ፡ ርእሱ፡ አሐተ
  chosen: and each chose one for himself
  alternatives:
  - and they each chose one
  - each one chose a single woman for himself
  rationale: Retains the distributive force of ኵሉ and ለለ ርእሱ and the feminine numeral አሐተ, referring to one woman for each
    Watcher.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ይብኡ፡ ኀቤሆን
  chosen: go in to them
  alternatives:
  - enter in to them
  - have relations with them
  rationale: The literal motion language functions contextually as a sexual euphemism. “Go in to them” preserves that source-level
    indirectness rather than replacing it with an explicit paraphrase.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ተደመሩ፡ ምስሌሆን
  chosen: join themselves to them
  alternatives:
  - associate themselves with them
  - cohabit with them
  - defile themselves with them
  rationale: The reflexive verb conveys joining or associating oneself. The context clearly concerns illicit sexual unions,
    but “defile” makes an interpretive moral consequence explicit where the supplied Ge'ez wording itself foregrounds union.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ሥረያተ፡ ወሥብያተ
  chosen: charms and incantations
  alternatives:
  - spells and enchantments
  - charms and spells
  rationale: The paired plurals denote kinds of magical instruction. Distinct English terms preserve the pairing, though their
    exact technical differentiation is uncertain.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: መቲረ፡ ስርው
  chosen: the cutting of roots
  alternatives:
  - root-cutting
  - the gathering of roots
  rationale: A concrete rendering preserves the transmitted image of cutting roots rather than generalizing it as herbalism
    or medicine.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ወዕፀወ፡ አመርዎን
  chosen: and made them acquainted with plants
  alternatives:
  - and made plants known to them
  - and taught them about plants
  - and made them know herbs
  rationale: Represents the causative sense of አመርዎን (“made them know”) in readable English. “Plants” is broader and less
    interpretive than “medicinal herbs.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
theological_decisions:
- issue: Characterization of the Watchers’ unions with the women
  chosen_reading: Preserve the source’s sexual euphemism and its language of joining, while leaving the illicit character
    to the narrative context.
  alternative_readings:
  - Render the act explicitly as sexual relations
  - Render the joining as moral defilement
  rationale: The verse depicts transgressive angel-human unions, but translating ተደመሩ as “defile themselves” would build the
    theological evaluation into a verb whose primary image is joining or association. The main text therefore preserves both
    the euphemism and the joining language.
- issue: Nature of the knowledge taught to the women
  chosen_reading: Render the instruction as charms, incantations, root-cutting, and knowledge of plants.
  alternative_readings:
  - Generalize the list as sorcery
  - Interpret the roots and plants specifically as medicine
  rationale: The apocalyptic accusation concerns forbidden instruction. Keeping the individual practices distinct preserves
    the text’s portrayal without collapsing them into a generic category or imposing a medical interpretation.
