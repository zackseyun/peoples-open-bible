id: HAB.2.16
reference: Habakkuk 2:16
source:
  edition: WLC
  text: שָׂבַ֤עְתָּ קָלוֹן֙ מִ/כָּב֔וֹד שְׁתֵ֥ה גַם אַ֖תָּה וְ/הֵֽעָרֵ֑ל תִּסּ֣וֹב עָלֶ֗י/ךָ כּ֚וֹס יְמִ֣ין יְהוָ֔ה וְ/קִיקָל֖וֹן עַל כְּבוֹדֶֽ/ךָ־־׃
translation:
  text: You will have your fill of shame instead of glory. Drink, you too, and expose your uncircumcision[a]! The cup in Yahweh’s right hand will come around to you, and utter disgrace will fall upon your glory.
  footnotes:
  - marker: a
    text: A Dead Sea Scroll quotes a Hebrew reading meaning 'stagger'; the ancient Greek and Syriac versions also express shaking or agitation rather than exposure.
    reason: textual_variant
  philosophy: dynamic
