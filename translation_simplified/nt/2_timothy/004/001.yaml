simplification_decisions:
- pob_phrase: I solemnly charge you before God and Messiah Jesus
  simplified_phrase: In the presence of God and Messiah Jesus, I give you this solemn command
  preserved_meaning: Paul gives Timothy an authoritative and serious command in the presence of God and Messiah Jesus.
  reasoning_layer_used: POB lexical decisions for Διαμαρτύρομαι and ἐνώπιον
  rationale: The rewrite explains both the formal force of “charge” and the presence meant by “before.”
- pob_phrase: who is about to judge the living and the dead
  simplified_phrase: Messiah Jesus is about to judge the living and the dead
  preserved_meaning: Messiah Jesus is the coming judge of both the living and the dead.
  reasoning_layer_used: POB lexical and theological decisions for μέλλω and Χριστός
  rationale: A separate sentence names the judge clearly while preserving “about to” and the judgment's full scope.
- pob_phrase: and by his appearing and his kingdom
  simplified_phrase: I give you this command by his appearing and his kingdom
  preserved_meaning: His appearing and kingdom add solemn force to the same command.
  reasoning_layer_used: POB syntactic rationale for the difficult second καί
  rationale: Referring back to “this command” clarifies the preferred adjuration sense without creating a second command.
interpretive_expansions:
- pob_phrase: who is about to judge
  rendering: Messiah Jesus is about to judge
  claim: The relative clause identifies Messiah Jesus as the coming judge.
  evidence:
  - The singular Greek relative phrase directly follows Χριστοῦ Ἰησοῦ.
  - The POB punctuation and reasoning attach the judgment clause to Messiah Jesus.
  confidence: high
translation_notes:
