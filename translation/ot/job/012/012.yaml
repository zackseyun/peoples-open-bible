  category: awkward_english
  tier: 1
  from: With the aged is wisdom[a], and with length of days[b], understanding.
  to: Wisdom is with the aged, and understanding with long life.
  rationale: The current fronted prepositional clauses are needlessly stiff in English. Recasting the first colon supplies the natural English copula while retaining the Hebrew's association in both cola. The proposed "comes with" adds a verbal development not expressed by the parallel nominal clauses; omit it. "Long life" is an idiomatic equivalent of the Hebrew idiom.
