id: 1SA.14.41
reference: 1 Samuel 14:41
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֗וּל אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הָ֣בָ/ה תָמִ֑ים וַ/יִּלָּכֵ֧ד יוֹנָתָ֛ן וְ/שָׁא֖וּל וְ/הָ/עָ֥ם יָצָֽאוּ־׃
translation:
  text: Then Saul said to Yahweh, the God of Israel, “Give a perfect lot.”[a] And Jonathan and Saul were taken, but the people escaped.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: "The terse Hebrew request is difficult. 'Lot' is supplied from the selection scene; another interpretation is 'Answer honestly.' The Rahlfs–Hanhart Greek text has a longer prayer asking why God has not answered and distinguishing guilt in Saul or Jonathan from guilt in the people. Its requests are commonly interpreted in terms of Urim and Thummim; these are not preserved Hebrew words in 4Q52 fragment 2, whose reconstruction and identification with this passage are disputed."
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: הָבָה
  chosen: Give
  alternatives:
  - Grant
  - Bring
  lexicon: HALOT
  rationale: Imperative/request language addressed to God. 'Give' is the most direct and natural English equivalent here.
- source_word: תָמִים
  chosen: a perfect lot
  alternatives:
  - what is right
  - truth
  - an innocent/perfect decision
  lexicon: HALOT
  rationale: "The pointed form can express completeness or blamelessness and can function substantivally; Amos 5:10 also supports truth-conforming content. The selection scene in verses 40–42 supplies 'lot', not the word itself. 'Answer honestly' is an interpretive alternative, not an established superior rendering or a word-for-word gloss. BDB's target cross-reference proposes Thummim instead of the pointed form and must not be cited as direct approval of the retained English. Source prayer length and Greek interpretation remain separate unresolved questions. The historical HALOT label is retained; no fresh HALOT consultation is claimed."
- source_word: וַיִּלָּכֵד
  chosen: were taken
  alternatives:
  - were selected
  - were caught
  lexicon: HALOT
  rationale: In lot-casting/judicial contexts, לכד can denote being identified or singled out. 'Were taken' preserves the idiom and the passive sense without overinterpreting.
- source_word: יָצָאוּ
  chosen: escaped
  alternatives:
  - went out
  - came out
  - were cleared
  lexicon: HALOT
  rationale: Given the contrast with Jonathan and Saul being taken, the people are those not selected by the lot. 'Escaped' communicates the contextual sense in idiomatic English better than the overly literal 'went out.'
