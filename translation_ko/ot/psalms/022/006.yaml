  source_fidelity: 초안은 시편 22:6의 히브리어 본문이 아니라 앞 절(시 22:5)에 해당하는 내용(‘주님께 부르짖으니…’)을 번역하고 있습니다. 시편 22:6은 화자가 자신을 ‘벌레요 사람이 아닌 자’로 묘사하고, 사람들과 백성에게 받는 모욕과 멸시를 말합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 히브리 시의 병렬 구조와 낮아짐의 강한 어조를 유지합니다. ‘조롱거리’는 חֶרְפַּת의 공적 모욕·치욕의 뜻을 자연스럽게 드러냅니다.
  terminology: תוֹלַעַת는 과도하게 종을 특정하지 않고 ‘벌레’로, אִישׁ는 ‘사람’으로 옮겼습니다. אָדָם은 집합적인 ‘사람들’로, עָם은 본문의 병렬을 보존하여 ‘백성’으로 옮겼습니다. 그리스도론적 해석은 본문에 덧붙이지 않았습니다.
