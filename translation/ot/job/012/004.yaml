  rationale: The current final phrase wrongly supplies a relation ('to the righteous and blameless man') absent from the Hebrew. צַדִּיק תָּמִים identifies the mocked person in apposition. The proposed correction is substantively right, but its terminal 'a righteous and blameless man, a laughingstock' is unnecessarily ungainly, and the Hebrew participle is better retained as present, with the following verb rendered passively to avoid an unclear pronoun shift. The revision keeps the Hebrew's emphatic final 'laughingstock.'
