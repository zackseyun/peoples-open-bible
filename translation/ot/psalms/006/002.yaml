  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: lexical
  tier: 1
  from: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
  to: Be gracious to me, O Yahweh, for I am weak[a]; heal me, O Yahweh, for my bones are troubled[b].
  rationale: The current “are trembling” does make the Hebrew verb more physically specific than its basic sense of being alarmed, disturbed, or dismayed. However, “my bones are terrified” is materially unnatural English and turns the poetic bodily image into an awkward literal personification. “My bones are troubled” is natural in lament diction, preserves the concrete Hebrew image, and retains the verb’s semantic breadth. The markers should be moved to the expressions they explain.
