  to: 아하스는 하나님의 집 기물들을 모아다가 하나님의 집 기물들을 잘라 버리고, 여호와의 집 문들을 닫았으며, 예루살렘의 모든 모퉁이에 자기를 위해 제단들을 만들었습니다.
