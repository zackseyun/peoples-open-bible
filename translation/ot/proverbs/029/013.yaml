id: PRO.29.13
reference: Proverbs 29:13
source:
  edition: WLC
  text: רָ֤שׁ וְ/אִ֣ישׁ תְּכָכִ֣ים נִפְגָּ֑שׁוּ מֵ֤אִיר עֵינֵ֖י שְׁנֵי/הֶ֣ם יְהוָֽה־׃
translation:
  text: 'A poor man and an oppressor[a] have this in common: Yahweh gives life to both of them[b].'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “a deceitful man” or “a usurer”; the Hebrew expression is uncertain.
    reason: alternative_reading
  - marker: b
    text: Literally, “gives light to the eyes of both of them”; the image can also refer to giving sight or renewing vitality.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  chosen: poor man
  alternatives:
  - poor person
  - the poor
  lexicon: HALOT
  rationale: The noun denotes a poor or needy person. Because the Hebrew is singular masculine and paired with אִישׁ, 'poor man' preserves the gendered, proverbial parallelism better than a neutral plural.
- source_word: אִישׁ תְּכָכִים
  chosen: an oppressor
  alternatives:
  - a man of oppressions
  - a deceitful man
  - a usurer
  lexicon: HALOT
  rationale: The phrase is difficult, but in context and common usage תְּכָכִים refers to oppressive exactions or exploitative dealings. 'An oppressor' gives the likely sense in idiomatic English while avoiding an overly literal but opaque 'man of oppressions.'
- source_word: נִפְגָּשׁוּ
  chosen: meet
  alternatives:
  - meet
  - have this in common
  - encounter one another
  lexicon: HALOT
  rationale: The Niphal means meet or encounter; English does not require “together.”
- source_word: מֵאִיר
  chosen: gives light
  alternatives:
  - illumines
  - lights up
  - gives sight
  lexicon: HALOT
  rationale: The Hiphil participle of אור means 'causing to shine/give light.' With 'eyes' as object, the idiom can imply giving life, sight, or sustaining awareness. 'Gives light' is a transparent rendering that preserves the metaphor.
- source_word: עֵינֵי שְׁנֵיהֶם
  chosen: the eyes of both of them
  alternatives:
  - both their eyes
  - the eyes of both
  lexicon: HALOT
  rationale: This is a straightforward construct phrase. The fuller English wording preserves the emphasis that both parties alike depend on the LORD.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives: []
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
