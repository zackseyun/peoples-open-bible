id: MAT.26.46
reference: Matthew 26:46
source:
  edition: SBLGNT
  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
translation:
  text: Get up; let us go. Look, my betrayer[a] is near.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the one handing me over.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  chosen: Get up
  alternatives:
  - Rise
  - Arise
  lexicon: BDAG
  rationale: Jesus addresses the disciples with a plural imperative. 'Get up' is direct, accurate, and natural modern English.
- source_word: ἄγωμεν
  chosen: let us go
  alternatives:
  - let us be going
  - let us leave
  lexicon: BDAG
  rationale: The first-person plural subjunctive is hortatory; 'let us go' is its natural English equivalent.
- source_word: ἰδού
  chosen: Look
  alternatives:
  - Behold
  - See
  lexicon: BDAG
  rationale: The particle draws attention to the urgent development. 'Look' preserves its vivid force without archaic tone.
- source_word: ἤγγικεν
  chosen: is near
  alternatives:
  - has drawn near
  - has come near
  lexicon: BDAG
  rationale: The perfect presents the approach as accomplished and presently relevant; 'is near' expresses that resulting state naturally.
- source_word: ὁ παραδιδούς με
  chosen: my betrayer
  alternatives:
  - the one betraying me
  - the one handing me over
  lexicon: BDAG
  rationale: The substantival participle identifies Judas by his active role. 'My betrayer' is concise and contextually warranted; the concrete handing-over sense remains in the footnote.
