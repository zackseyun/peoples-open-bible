  verdict: revise
  source_fidelity: חֲלָלָה is a participial/legal-status term meaning ‘profaned’ and, in this context, denotes a woman regarded as disqualified or impure for priestly marriage. ‘부정해진’ adds an eventive nuance (‘has become unclean/defiled’) that is not explicit in the Hebrew. ‘부정한’ more naturally conveys the stated status while remaining aligned with the English audit rendering ‘defiled.’ The plural prohibitions and singular rationale are retained.
  naturalness: The formal-polite register is appropriate. Replacing ‘부정해진 여자’ with ‘부정한 여자’ is more idiomatic and avoids suggesting a specific process by which she became defiled.
  terminology: ‘창녀,’ ‘아내로 맞다,’ ‘이혼한 여자,’ and ‘거룩하다’ are understandable and suitably formal in context. ‘부정한’ is preferable here as a concise legal-ritual designation; it does not force a particular explanation of the woman’s status.
  issues:
  - severity: medium
    issue: ‘부정해진’ is overly eventive for חֲלָלָה.
    rationale: The Hebrew describes a status (‘profaned/defiled’), not explicitly a transition into that status. ‘부정한’ better preserves the legal-ritual characterization without adding a process.
  revised_text: 그들은 창녀나 부정한 여자를 아내로 맞아서는 안 되고, 남편에게서 이혼한 여자도 아내로 맞아서는 안 됩니다. 이는 그가 자기 하나님께 거룩하기 때문입니다.
