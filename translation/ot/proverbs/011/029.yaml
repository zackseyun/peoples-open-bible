  from: Whoever troubles his own house will inherit wind[b][a], and the fool will be a servant to the wise of heart.
  to: Whoever troubles his own household will inherit wind[a], and the fool will be a servant to the wise in heart.
  rationale: “Household” correctly represents בית in this domestic-social context, and “wise in heart” is more natural than “wise of heart.” The proposal’s omission of the article in “a fool” is possible in English proverbial style but not needed; “the fool” appropriately represents the wisdom type. Likewise, “be a servant to” is a more complete and natural predicate than bare “be servant to.”
- timestamp: '2026-11-09T19:34:26Z'
