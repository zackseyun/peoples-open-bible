- from: 그러나 우리는 우리 하나님, 우리 구원자에게서 소망을 품을 것입니다. 왜냐하면 우리 하나님의 권세는 자비와 함께 영원하며, 우리 하나님의 나라는 영원히 민족들 위에 있기 때문입니다.
  to: 그러나 우리는 우리 구원자이신 하나님께 소망을 둘 것입니다. 우리 하나님의 권세는 자비와 함께 영원하며, 우리 하나님의 나라는 민족들을 영원히 다스리기 때문입니다.
