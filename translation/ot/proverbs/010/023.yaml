  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: idiom
  tier: 1
  from: Doing wickedness is like a joke to a fool[a], but wisdom is for a man of understanding.
  to: Doing wickedness is like sport[a] to a fool, but wisdom is like sport to a man of understanding.
  rationale: 'The current “wisdom is for a man of understanding” leaves the parallel relation too indeterminate in English. The comparison introduced by כִּשְׂחוֹק is naturally carried into the second colon: the fool treats wickedness as sport, whereas the discerning man finds comparable engagement in wisdom. However, “pleasure” replaces the Hebrew’s concrete image of laughter/sport rather than translating it. “Like sport” is natural English and preserves that image; the repeated comparison makes the ellipsis clear without adding a motive beyond the parallelism.'
