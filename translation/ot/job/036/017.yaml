id: JOB.36.17
reference: Job 36:17
source:
  edition: WLC
  text: וְ/דִין רָשָׁ֥ע מָלֵ֑אתָ דִּ֖ין וּ/מִשְׁפָּ֣ט יִתְמֹֽכוּ־׃
translation:
  text: But you are suffering the full judgment due to the wicked[a]; judgment and justice take hold of you[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “you are filled with the judgment of the wicked”; this may instead mean “you are preoccupied with the wicked person's case.”
    reason: alternative_reading
  - marker: b
    text: Or, “judgment and justice uphold you”; no object is expressed in Hebrew.
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִין
  chosen: But
  alternatives:
  - And
  - Now
  lexicon: HALOT
  rationale: The conjunction וְ is rendered adversatively in context, marking contrast with the preceding possibility of repentance and restoration. דִּין here is taken together with the following phrase rather than as a separate clause-initial noun to be repeated woodenly in English.
- source_word: דִּין
  chosen: judgment
  alternatives:
  - case
  - justice
  - legal decision
  lexicon: HALOT
  rationale: דִּין commonly denotes judgment, legal case, or judicial decision. Here it is best rendered 'judgment' to match the forensic tone and to pair naturally with מִשְׁפָּט in the second colon.
- source_word: רָשָׁע
  chosen: the wicked
  alternatives:
  - a wicked man
  - the guilty
  lexicon: HALOT
  rationale: The singular adjective functions substantivally. 'The wicked' preserves the generic force without forcing an individualizing 'man' into English.
- source_word: מָלֵאתָ
  chosen: you are full of
  alternatives:
  - you have been filled with
  - you are filled with
  lexicon: HALOT
  rationale: Naturally expresses the resultant state of the perfect without changing the filling metaphor.
- source_word: דִּין
  chosen: judgment
  alternatives:
  - justice
  - legal decision
  - case
  lexicon: HALOT
  rationale: The repeated noun is kept as 'judgment' for consistency and to preserve the rhetorical repetition in Hebrew.
- source_word: וּמִשְׁפָּט
  chosen: and justice
  alternatives:
  - and judgment
  - and legal right
  lexicon: HALOT
  rationale: מִשְׁפָּט overlaps with דִּין but often carries the sense of justice or judicial right/order. Rendering it 'justice' preserves the parallelism without collapsing both nouns into identical English.
- source_word: יִתְמֹכוּ
  chosen: take hold
  alternatives:
  - support
  - uphold
  - take hold of
  lexicon: HALOT
  rationale: Preserves the absence of an expressed object and the verb’s range between grasping and supporting.
