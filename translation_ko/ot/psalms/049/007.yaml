translation:
  language: ko
  text: 아무도 형제를 결코 속량할 수 없으며, 하나님께 그의 몸값을 드릴 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫말 אָח는 보통 ‘형제’를 뜻하며 여기서는 ‘형제를’로 옮겼습니다. 일부는 이를 강조 부사로 이해하여 ‘참으로 아무도 형제를 속량할 수 없다’로 번역합니다. ‘몸값’은 히브리어 כָּפְרוֹ, 곧 해방을 위해 지불하는 대가를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּטְחִים עַל
  english_pob_choice: those who trust in
  chosen_korean: 의지하며
  alternatives_korean:
