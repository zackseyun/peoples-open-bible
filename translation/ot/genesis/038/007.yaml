theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Portrayal of divine agency in Er's death
  chosen_reading: and the LORD put him to death
  alternative_readings:
  - and the LORD killed him
  - and the LORD caused him to die
  rationale: The Hebrew explicitly attributes Er's death to YHWH through a causative verb. The translation preserves that direct agency without softening it or importing explanation about means or justice beyond the text itself.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
