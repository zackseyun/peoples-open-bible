  lexicon: HALOT
  rationale: נשא의 관용적 의미인 ‘견디다/감당하다’를 자연스러운 조건문으로 옮겼습니다.
- source_word: הִגְדִּיל
  english_pob_choice: has magnified himself against me
  chosen_korean: 스스로를 높인 것이라면
  alternatives_korean:
  - 스스로를 크게 한 것이라면
