  from: Why, my son, should you go astray with a forbidden woman and embrace the bosom of a foreign woman?[a]
  to: Why, my son, should you go astray with a forbidden woman and embrace the bosom of a woman who is not your wife?
  rationale: I retain the later audit's “forbidden woman” and its recognition that “go astray” has moral force here despite the positive use in verse 19. I depart from “foreign woman” because the history itself identifies illicit intimacy, not ethnicity, as the point; that clarification now belongs in the main text.
