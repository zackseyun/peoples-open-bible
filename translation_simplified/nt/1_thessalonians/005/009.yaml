  - The POB rationale contrasts wrath with salvation as final outcomes.
  confidence: high
  alternatives_preserved:
  - for wrath
- pob_phrase: but for obtaining salvation
  rendering: Instead, he appointed us to receive salvation
  claim: The appointment verb also governs the contrasting salvation clause.
  evidence:
  - The Greek contrast uses one verb with two parallel εἰς phrases.
  - The POB reads both phrases as contrasting intended outcomes.
  confidence: high
  alternatives_preserved:
  - obtaining salvation
  - gaining salvation
  - being preserved for salvation
