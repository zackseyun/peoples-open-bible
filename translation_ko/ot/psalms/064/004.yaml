translation:
  language: ko
  text: 그들은 은밀한 곳에서 흠 없는 이를 쏘려고, 갑자기 그를 향해 쏘고도 두려워하지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁנְנוּ כַחֶרֶב לְשׁוֹנָם
  english_pob_choice: who sharpen their tongue like a sword
  chosen_korean: “자기 혀를 칼처럼 날카롭게 하고”
  alternatives_korean:
  - 자기 혀를 칼처럼 벼리고
  - 그들의 혀를 칼처럼 날카롭게 하고
  lexicon: שׁנן / לשון
  rationale: 히브리어 동사 שׁנן은 ‘날카롭게 하다, 벼리다’의 의미를 가지므로 ‘날카롭게 하다’가 직역에 가깝습니다. ‘자기 혀’는 소유격이 문맥상 자연스럽고, 시적 병행을 살리기 위해 간결하게 옮겼습니다.
- source_word: דָּרְכ֥וּ חִצָּם
  english_pob_choice: they bend their arrow
  chosen_korean: “쓰디쓴 말을 화살처럼 당깁니다”
  alternatives_korean:
  - 그들의 화살을 당깁니다
  - 화살을 겨룹니다
  lexicon: דרך / חץ
  rationale: POB의 수정본이 ‘bend’를 보존하고, 뒤의 ‘a bitter word’가 화살의 해석적 동격이므로 한국어에서는 화살상(像)을 유지하면서 ‘당깁니다’로 옮겼습니다. ‘겨룹니다’는 자연스러우나 활시위를 당기는 동작을 더 직접적으로 드러내는 ‘당깁니다’가 원문에 가깝습니다.
- source_word: דָּבָר מָר
  english_pob_choice: a bitter word
  chosen_korean: “쓰디쓴 말”
  alternatives_korean:
  - 쓴 말
  - 모진 말
  lexicon: דבר / מר
  rationale: דָּבָר מָר는 문자적으로 ‘쓴 말’이지만, 한국어에서는 감각을 살리되 관용적으로 더 강한 ‘쓰디쓴 말’이 시적·정서적으로 적절합니다. 이는 ‘bitter’의 감각을 살리면서도 과장되지 않게 전달합니다.
theological_decisions:
- issue: 시적 병행에서 ‘화살’의 이미지와 ‘말’의 동격 관계
  chosen_reading: 후반부를 ‘쓰디쓴 말’로 옮겨 화살의 비유적 실체를 드러냈습니다.
  alternative_readings:
  - ‘그들의 화살을 당깁니다 — 쓰디쓴 말 —’처럼 원문의 은유를 더 분리해 표기할 수 있습니다.
  rationale: 히브리어는 ‘그들의 화살’과 ‘쓰디쓴 말’의 병치를 통해 공격적 언어를 묘사합니다. 한국어 본문에서는 독자가 이 병행을 즉시 읽도록, 화살 이미지와 말의 해설적 동격을 한 문장 안에 자연스럽게 결합했습니다.
  doctrine_reference: 시편의 악인 묘사와 혀의 폭력성에 대한 일반적 문학/신학적 이해
