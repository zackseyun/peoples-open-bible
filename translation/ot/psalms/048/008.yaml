- issue: Referent of the feminine suffix in יְכוֹנְנֶהָ
  chosen_reading: 'the city is personified as feminine: ''God will establish her forever'''
  alternative_readings:
  - God will establish it forever
  rationale: The suffix is feminine singular and most naturally refers to 'city' (עִיר), a feminine noun. 'Her' preserves the grammatical and poetic personification better than the neuter 'it.'
