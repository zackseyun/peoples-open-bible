translation:
  text: So prepare the torture wheels and fan the fire even more fiercely!
  philosophy: dynamic
lexical_decisions:
- source_word: πρὸς ταῦτα
  chosen: For this
  alternatives:
  - For these things
  - In response to this
  lexicon: LSJ
  rationale: Idiomatic transitional phrase introducing the tyrant's command in response to what has just been said. Singular English ('this') best captures the discourse function without woodenly preserving the neuter plural form.
- source_word: τροχοὺς
  lemma: τροχοί
  chosen: the wheels
  alternatives:
  - wheels
  - racks
  lexicon: LSJ
  rationale: τροχοί literally means 'wheels.' In this martyrdom context it likely refers to torture wheels, but the text itself names the instrument directly rather than interpreting it, so 'the wheels' preserves the concrete wording. 'Racks' would over-interpret.
- source_word: εὐτρέπιζε
  chosen: prepare
  alternatives:
  - make ready
  - set in readiness
  lexicon: LSJ
  rationale: Imperative sense calling for equipment to be made ready. 'Prepare' is clear modern English and fits the command context.
- source_word: τὸ πῦρ
  chosen: the fire
  alternatives:
  - fire
  - flame
  lexicon: LSJ
  rationale: Direct object with article; 'the fire' reflects the specific fire already in view in the torture scene.
- source_word: ἔκφυσα
  chosen: blow
  alternatives:
  - fan
  - kindle by blowing
  lexicon: LSJ
  rationale: The verb denotes blowing upon a fire to intensify it. 'Blow' stays close to the Greek image; 'fan' is possible but less direct to the verbal picture.
- source_word: σφοδρότερον
  chosen: even more fiercely
  alternatives:
  - more violently
  - more intensely
  lexicon: LSJ
  rationale: Comparative adverb modifying the intensifying of the fire. 'Even more fiercely' conveys the comparative escalation in natural English.
