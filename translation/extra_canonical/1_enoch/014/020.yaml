translation:
  text: And the Great Glory sat upon it, and his garment gleamed brighter than the
    sun and was whiter than all snow.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez pronoun can mean “him” or “it”; “it” refers to the throne in the
      preceding context.
    reason: alternative_reading
lexical_decisions:
- source_word: ዓቢይ፡ ስብሐት
  chosen: the Great Glory
  alternatives:
  - great glory
  rationale: Preserves the visionary designation rather than replacing it with a divine
    name.
- source_word: ይነብር፡ ላዕሌሁ
  chosen: sat upon it
  alternatives:
  - sat upon him
  rationale: The pronoun is grammatically masculine; the throne in the preceding context
    is the likely referent.
- source_word: ፃጽፉሰ
  chosen: his garment
  alternatives:
  - his clothing
  rationale: Keeps the concrete clothing image without specifying a particular kind
    of robe.
- source_word: ይበርህ
  chosen: gleamed brighter
  alternatives:
  - shone more brightly
  rationale: Conveys radiance in the comparison with the sun.
- source_word: እምኵሉ፡ በረድ
  chosen: than all snow
  alternatives:
  - than any snow
  rationale: Retains both the universal modifier and the snow imagery.
theological_decisions:
- issue: Identity of the enthroned figure
  chosen_reading: the Great Glory
  alternative_readings:
  - God
  - the Lord
  rationale: The Ge'ez gives an epithet; the translation does not substitute a more
    specific divine title.
