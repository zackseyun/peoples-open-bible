id: PSA.114.6
reference: Psalms 114:6
source:
  edition: WLC
  text: הֶֽ֭/הָרִים תִּרְקְד֣וּ כְ/אֵילִ֑ים גְּ֝בָע֗וֹת כִּ/בְנֵי צֹֽאן־׃
translation:
  text: Mountains, why do you skip like rams? Hills, why do you skip like lambs?
  philosophy: dynamic
lexical_decisions:
- source_word: הֶהָרִים
  chosen: Mountains
  alternatives:
  - mountains
  lexicon: HALOT
  rationale: The plural noun is in continued direct address; modern English does not require “O.”
- source_word: תִּרְקְדוּ
  chosen: do you skip
  alternatives:
  - do you dance
  - do you leap
  lexicon: HALOT
  rationale: The verb רָקַד denotes skipping, leaping, or dancing. In this poetic context of mountains moving like animals, 'skip' best captures the lively, springing motion and aligns well with the similes that follow.
- source_word: כְאֵילִים
  chosen: like rams
  alternatives:
  - like stags
  - like male deer
  lexicon: HALOT
  rationale: אֵילִים can denote rams and in some contexts strong animals more broadly, but 'rams' is the most straightforward lexical sense here and pairs naturally with the flock imagery in the second colon.
- source_word: גְּבָעוֹת
  chosen: hills
  alternatives:
  - hills
  lexicon: HALOT
  rationale: This likewise continues the direct address and is clear without “O.”
- source_word: כִּבְנֵי צֹאן
  chosen: like lambs of the flock
  alternatives:
  - like young sheep
  - like the sons of the flock
  lexicon: HALOT
  rationale: Literally 'like sons of the flock,' a Hebrew idiom for young sheep/lambs. 'Lambs of the flock' preserves the imagery while remaining natural English and retaining the explicit flock reference.
