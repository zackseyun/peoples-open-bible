id: PSA.104.11
reference: Psalms 104:11
source:
  edition: WLC
  text: יַ֭שְׁקוּ כָּל חַיְת֣/וֹ שָׂדָ֑י יִשְׁבְּר֖וּ פְרָאִ֣ים צְמָאָֽ/ם־׃
translation:
  text: They give drink to every wild animal; the wild donkeys quench their thirst.
  philosophy: dynamic
lexical_decisions:
- source_word: יַשְׁקוּ
  chosen: They give drink to
  alternatives:
  - are watered
  - drink
  lexicon: HALOT
  rationale: Retains the causative verbal sense and the understood waters as subject.
- source_word: כָּל
  chosen: All
  alternatives:
  - every
  lexicon: HALOT
  rationale: Distributive/collective sense is naturally conveyed by 'All' with the plural English noun phrase.
- source_word: חַיְתוֹ שָׂדָי
  chosen: the beasts of the field
  alternatives:
  - the animals of the field
  - the wildlife of the field
  lexicon: HALOT
  rationale: Construct phrase meaning the wild living creatures/animals belonging to the open country. 'Beasts of the field' is a natural and established English rendering that remains understandable in modern English.
- source_word: יִשְׁבְּרוּ
  chosen: quench
  alternatives:
  - satisfy
  - break
  lexicon: HALOT
  rationale: Qal of שׁבר with 'thirst' as object is an idiom meaning to satisfy or quench thirst, not literally 'break' in English. 'Quench' preserves the concrete imagery.
- source_word: פְרָאִים
  chosen: wild donkeys
  alternatives:
  - wild asses
  - onagers
  lexicon: HALOT
  rationale: Refers to wild donkeys/onagers. 'Wild donkeys' is clear modern English; 'wild asses' is traditional but potentially distracting, and 'onagers' is more technical.
- source_word: צְמָאָם
  chosen: their thirst
  alternatives:
  - their parchedness
  lexicon: HALOT
  rationale: Abstract noun with 3mp suffix; 'their thirst' is the straightforward idiomatic rendering in English.
- source_word: כָּל חַיְתוֹ שָׂדָי
  chosen: every beast of the field
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural distributive English for the collective Hebrew expression.
