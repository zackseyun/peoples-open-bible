translation:
  language: en
  text: That is why I sent Timothy to you. He is my dear and faithful child in the Lord.[a] He will remind you of the way I live and teach in union with Christ Jesus,[b] just as I teach everywhere in every church.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “son in the Lord.” The Greek word more literally means “child.”
    reason: lexical_alternative
  - marker: b
    text: Or “Jesus the Messiah.” “Messiah” expresses the meaning of the Greek title.
    reason: lexical_alternative
