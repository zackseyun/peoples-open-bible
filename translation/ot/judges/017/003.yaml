theological_decisions:
- issue: Rendering the divine name יהוה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Cultic language of dedication despite idolatrous outcome
  chosen_reading: I had solemnly dedicated the silver to the LORD
  alternative_readings:
  - I had consecrated the silver to the LORD
  rationale: The Hebrew uses sanctification/dedication language without editorial softening. The translation preserves the theological tension that the silver is said to be dedicated to the LORD for making images, rather than resolving or harmonizing the contradiction in the wording.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
