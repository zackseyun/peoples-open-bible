translation:
  language: en
  text: But you have mercy on everyone, because you can do all things. You pass over people's sins for the time being so that they may reorient toward you[r1].
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: have mercy on all
  simplified_phrase: have mercy on everyone
  preserved_meaning: God's mercy extends to all people.
  reasoning_layer_used: Lexical decision for πάντας
  rationale: “Everyone” makes the universal personal scope immediately clear.
- pob_phrase: you are able to do all things
  simplified_phrase: you can do all things
  preserved_meaning: God has comprehensive power and ability.
  reasoning_layer_used: Lexical decision for πάντα δύνασαι
  rationale: “Can” expresses the same meaning in more natural English.
interpretive_expansions:
- pob_phrase: reorient / reorientation
  rendering: toward you
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use reorientation toward you because the speaker addresses God directly; do not switch the addressee to a detached third-person reference. The direction is contextual clarification, not a literal component of metanoia.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
