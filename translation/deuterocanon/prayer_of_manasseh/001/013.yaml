  rationale: Use reorientation toward you because the speaker addresses God directly; do not switch the addressee to a detached third-person reference. The direction is contextual clarification, not a literal component of metanoia.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
