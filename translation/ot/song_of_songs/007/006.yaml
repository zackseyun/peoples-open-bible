id: SNG.7.6
reference: Song of Songs 7:6
source:
  edition: WLC
  text: רֹאשֵׁ֤/ךְ עָלַ֨יִ/ךְ֙ כַּ/כַּרְמֶ֔ל וְ/דַלַּ֥ת רֹאשֵׁ֖/ךְ כָּ/אַרְגָּמָ֑ן מֶ֖לֶךְ אָס֥וּר בָּ/רְהָטִֽים׃
translation:
  text: Your head crowns you like Mount Carmel, and your hair is like purple cloth; a king is held captive in your tresses[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The final Hebrew word is uncertain. Here it may mean “tresses” or “flowing locks”; other interpretations include “channels” or “galleries.”
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאשֵׁךְ
  chosen: your head
  alternatives:
  - your crown
  lexicon: HALOT
  rationale: The basic sense is 'head.' While 'crown of your head' can be an extended sense in some contexts, here the comparison to Carmel and the following mention of hair favor the literal 'head.'
- source_word: עָלַיִךְ
  chosen: upon you
  alternatives:
  - on you
  - above you
  lexicon: HALOT
  rationale: The preposition על with 2fs suffix is spatial. 'Upon you' preserves the poetic image of the head as it is borne on the body, while remaining natural enough in English poetry.
- source_word: כַּכַּרְמֶל
  chosen: like Carmel
  alternatives:
  - like Mount Carmel
  lexicon: HALOT
  rationale: כ plus proper noun marks comparison. 'Carmel' likely evokes Mount Carmel's stately height and beauty. The shorter form preserves the Hebrew's compact poetic force; the geographic identification can be clarified in a footnote.
- source_word: דַּלַּת רֹאשֵׁךְ
  chosen: the hair of your head
  alternatives:
  - the locks of your head
  - the hanging hair of your head
  lexicon: HALOT
  rationale: The rare noun is understood in context as hanging or flowing hair, but the general rendering avoids unnecessary precision.
- source_word: כָּאַרְגָּמָן
  chosen: like purple cloth
  alternatives:
  - like purple cloth
  - like crimson-purple
  lexicon: HALOT
  rationale: אַרְגָּמָן can denote purple-dyed material, and “purple cloth” supplies a concrete referent for the simile.
- source_word: מֶלֶךְ
  chosen: a king
  alternatives:
  - the king
  lexicon: HALOT
  rationale: The noun lacks the article, so 'a king' is the more straightforward rendering. In context it functions generically or hyperbolically rather than identifying a specific monarch.
- source_word: אָסוּר
  chosen: is held captive
  alternatives:
  - is bound
  - is imprisoned
  - is fettered
  lexicon: HALOT
  rationale: 'From אסר, ''to bind.'' In this love-poem context the passive participial/adjectival sense is metaphorical: the king is captivated or bound fast. ''Held captive'' preserves the metaphor while sounding idiomatic in English.'
- source_word: בָּרְהָטִים
  chosen: in the tresses
  alternatives:
  - in the locks
  - in the galleries
  - in the channels
  lexicon: HALOT
  rationale: The immediate hair imagery supports this contextual rendering, while the footnote preserves the word’s substantial lexical uncertainty.
- source_word: רֹאשֵׁךְ עָלַיִךְ
  chosen: Your head crowns you
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This represents the expressed spatial relation in natural English without adding the motion implied by “rises.”
