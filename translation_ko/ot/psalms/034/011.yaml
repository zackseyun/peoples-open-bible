  lexicon: HALOT
  rationale: '''לֹא יַחְסְרוּ''의 일반적 보장과 ''כָל טוֹב''의 포괄성을 함께 살리기 위해, ''어떤 좋은 것도 부족함이 없습니다''로 자연스럽게 번역했습니다.'
