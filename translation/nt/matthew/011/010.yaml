  from: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
  to: 'This is the one about whom it is written: ‘Behold, I am sending my messenger ahead of you; he will prepare your way before you[a].’'
  rationale: The record emphasizes preserving both advance-position phrases and the prophetic register, and I retain those gains. I depart from its preference for “before your face” because that bodily idiom obscures the messenger’s advance mission in contemporary English.
