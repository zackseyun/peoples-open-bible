id: JDT.1.13
reference: Judith 1:13
source:
  edition: lxx-swete-1909
  text: καὶ παρετάξατο ἐν τῇ δυνάμει αὐτοῦ πρὸς Ἀρφαξὰδ βασιλέα ἐν τῷ ἔτει τῷ ἐπτακαιδεκάτῳ, καὶ ἐκραταιώθη ἐν τῷ πολέμῳ αὐτοῦ, καὶ ἀνέστρεψεν πᾶσαν τὴν δύναμιν Ἀρφαξὰδ καὶ πᾶσαν τὴν ἵππον αὐτοῦ καὶ πάντα τὰ ἅρματα αὐτοῦ,
  language: Greek
