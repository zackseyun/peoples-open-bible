id: PSA.113.3
reference: Psalms 113:3
source:
  edition: WLC
  text: מִ/מִּזְרַח שֶׁ֥מֶשׁ עַד מְבוֹא֑/וֹ מְ֝הֻלָּ֗ל שֵׁ֣ם יְהוָֽה־־׃
translation:
  text: From where the sun rises to where it sets[a], the name of Yahweh is to be praised.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “From sunrise to sunset.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִמִּזְרַח
  lemma: מִזְרַח
  chosen: from the rising
  alternatives:
  - from the east
  - from sunrise
  lexicon: HALOT
  rationale: The noun מִזְרַח can denote the place of sunrise ('east') or the act/point of rising. In parallel with מְבוֹאוֹ ('its setting/going in') and with שֶׁמֶשׁ following, the temporal-cosmic sense 'the rising' best fits the poetic merism.
- source_word: שֶׁמֶשׁ
  chosen: of the sun
  lexicon: HALOT
  rationale: Standard rendering of שֶׁמֶשׁ. Combined with מִמִּזְרַח it yields the idiomatic phrase 'the rising of the sun.'
- source_word: מְבוֹאוֹ
  chosen: its setting
  alternatives:
  - its going in
  - its place of setting
  lexicon: HALOT
  rationale: Literally 'its going/coming in,' with 3ms suffix referring to the sun. In English, 'its setting' naturally conveys the sun's descent while preserving the poetic merism from sunrise to sunset.
- source_word: מְהֻלָּל
  chosen: is to be praised
  alternatives:
  - is praised
  - be praised
  lexicon: HALOT
  rationale: The passive participle means 'praised' or 'worthy of praise.' In this poetic context, 'is to be praised' captures the durative/general force and the exhortatory nuance without over-paraphrasing.
- source_word: שֵׁם
  chosen: the name
  lexicon: HALOT
  rationale: Retained literally. In Hebrew, 'name' can stand for reputation, revealed identity, or person as known in worship; the literal rendering preserves that theological richness.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
