  from: If he is able[a], he will scarcely recover half, and will count it as a find; but if not, he has been deprived of his money, and has gained an enemy for nothing. He will repay him with curses and insults[b], and instead of honor he will repay him with dishonor.
  to: If the lender is able to get anything back, he will barely recover half and count it as a windfall; otherwise, he has been deprived of his money and has gained an enemy at his own expense. The borrower will repay him with curses and insults, and with dishonor instead of honor.
  rationale: The earlier record rightly emphasizes financial loss and hostile 'repayment,' but 'for nothing' fails to carry the negative in οὐ δωρεάν. I preserve the honor–dishonor contrast and make both subject changes explicit.
