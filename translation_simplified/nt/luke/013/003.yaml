translation:
  language: en
  text: “No, I tell you. But unless you reorient toward God[b], you will all likewise perish.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “perish in a similar way.” The comparison may point to a similar sudden judgment, not the identical manner of death.
    reason: lexical_alternative
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: No, I tell you; but
  simplified_phrase: No, I tell you. But
  preserved_meaning: Jesus firmly rejects the assumption and contrasts it with his warning.
  reasoning_layer_used: POB lexical decisions for οὐχί, λέγω ὑμῖν, and ἀλλ’
  rationale: Two sentences make the contrast easier to follow without weakening it.
- pob_phrase: you will all likewise perish
  simplified_phrase: you will all likewise perish
  preserved_meaning: The warning applies to every hearer and compares their judgment with the preceding examples.
  reasoning_layer_used: POB lexical and theological decisions for πάντες, ὁμοίως, and ἀπολεῖσθε
  rationale: Keeping “likewise” preserves the comparison and its documented ambiguity.
interpretive_expansions:
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
