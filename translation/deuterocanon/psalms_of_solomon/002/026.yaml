  to: And they will be brought to an end, unless you, Lord, rebuke them in your wrath.
  rationale: Replaced 'Israel' with 'they' because the Greek has no explicit subject here; retained the passive sense of συντελεσθήσονται as 'will be brought to an end' and kept the rest essentially unchanged for accuracy and naturalness.
