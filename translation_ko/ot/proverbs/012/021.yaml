  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא יְאֻנֶּ֣ה לַ/צַּדִּ֣יק כָּל אָ֑וֶן וּ֝/רְשָׁעִ֗ים מָ֣לְאוּ רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/021.yaml
  text: No harm will happen to the righteous, but the wicked are filled with trouble.
translation:
  language: ko
  text: 의인에게는 아무런 해도 닥치지 않지만, 악인들은 고난으로 가득합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יְאֻנֶּה
  english_pob_choice: No harm will happen
  chosen_korean: 어떤 재앙도 닥치지 않지만
  alternatives_korean:
  - 해를 입지 않지만
  - 불행이 생기지 않지만
  lexicon: יָאָנֶה / אָוֶן
  rationale: ח`לֹא יְאֻנֶּה`는 단순한 ‘없다’보다 ‘닥치다/덮치다’의 발생·도달 이미지를 살려, 의인에게 재앙이 ‘닥치지 않는다’로 옮겼습니다.
- source_word: צַּדִּיק
  english_pob_choice: the righteous
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: צַדִּיק
  rationale: 잠언의 משפט적·윤리적 대조를 유지하기 위해 관용적인 ‘의인’을 사용했습니다.
- source_word: אָוֶן
  english_pob_choice: harm
  chosen_korean: 재앙
  alternatives_korean:
  - 해
  - 악
  - 불행
  lexicon: אָוֶן
  rationale: 문맥상 의인에게 미치지 않는 부정적 결과를 가리키므로, 추상적인 ‘악’보다 결과적 피해를 드러내는 ‘재앙’이 더 적절합니다.
- source_word: רְשָׁעִים ... רָע
  english_pob_choice: the wicked are filled with trouble
  chosen_korean: 악인들은 고난으로 가득합니다
  alternatives_korean:
  - 악인들은 괴로움으로 가득합니다
  - 악인들은 재난으로 가득합니다
  lexicon: רָשָׁע / רַע
  rationale: 영어 POB의 ‘trouble’에 맞추되, 히브리어 `רָע`의 폭넓은 부정적 상태를 한국어에서 자연스럽고 출판 가능한 표현인 ‘고난’으로 옮겼습니다.
theological_decisions:
- issue: 의인에게 재앙이 ‘없다’는 잠언적 일반 진술의 범위
  chosen_reading: 이 구절은 절대적 무조건 약속이라기보다 지혜문학의 일반 원칙으로, 의인과 악인의 삶의 방향을 대조합니다.
  alternative_readings:
  - 개별 사건마다 예외 없는 보장으로 읽기
  - 현세적 성공 공리로 축소하기
  rationale: 히브리 시의 평행법과 잠언 문맥은 통계적·지혜적 진술을 지지하며, 본문 자체가 의인/악인의 대비를 통해 도덕적 질서를 강조합니다.
  doctrine_reference: 잠언 12장 지혜문학의 일반 원칙
