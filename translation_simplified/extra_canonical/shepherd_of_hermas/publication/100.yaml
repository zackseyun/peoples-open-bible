  text: Οἱ δὲ ἐκ τοῦ ὄρους τοῦ ἕκτου τοῦ ἔχοντος σχισμὰς μεγάλας καὶ μικρὰς καὶ ἐν ταῖς σχισμαῖς βοτάνας
    μεμαρασμένας πιστεύσαντες τοιοῦτοί εἰσιν· 2. οἱ μὲν τὰς σχισμὰς τὰς μικρὰς ἔχοντες, οὗτοί εἰσιν οἱ
    κατ᾿ ἀλλήλων ἔχοντες, καὶ ἀπὸ τῶν καταλαλιῶν ἑαυτῶν μεμαρασμένοι εἰσὶν ἐν τῇ πίστει· ἀλλὰ μετενόησαν
    ἐκ τούτων πολλοί. καὶ οἱ λοιποὶ δὲ μετανοήσουσιν, ὅταν ἀκούσωσί μου τὰς ἐντολάς· μικραὶ γὰρ αὐτῶν
    εἰσιν αἱ καταλαλιαί, καὶ ταχὺ μετανοήσουσιν. 3. οἱ δὲ μεγάλας ἔχοντες σχισμάς, οὗτοι παράμονοί εἰσι
    ταῖς καταλαλιαῖς αὐτῶν καὶ μνησίκακοι γίνονται μηνιώντες ἀλλ⸢ήλοις⸣. οὗτοι οὖν ἀπὸ τοῦ πύργου ἀπερρίφησαν
    καὶ ἀπεδοκιμάσθησαν τῆς οἰκοδομῆς αὐτοῦ. οἱ τοιοῦτοι οὖν δυσκόλως ζήσονται. 4. εἰ ὁ Θεὸς καὶ ὁ Κύριος
    ἡμῶν ὁ πάντων κυριεύων καὶ ἔχων πάσης τῆς κτίσεως αὐτοῦ τὴν ἐξουσίαν οὐ μνησικακεῖ τοῖς ἐξομολογουμένοις
    τὰς ἁμαρτίας αὐ⸢τῶν⸣, ἀλλ᾿ ἵλεως γίνεται, ἄνθρωπος φθαρτὸς ὢν καὶ πλήρης ἁμαρτιῶν ἀνθρώπῳ μνησικακεῖ
    ὡς δυνάμενος ἀπολέσαι ἢ σῶσαι αὐτόν; 5. λέγω δὲ ⸢ὑμῖν⸣, ὁ ἄγγελος τῆς μετανοίας, ὅσοι ταύτην ἔχετε
    τὴν αἵρεσιν, ἀπόθεσθε αὐτὴν καὶ μετανοήσατε, καὶ ὁ Κύριος ἰάσεται ὑμῶν τὰ πρότε⸢ρα ἁμαρτήματα⸣, ἐὰν
    καθαρίσητε ἑαυτοὺς ἀπὸ τούτου τοῦ δαιμονίου· εἰ δὲ μή, παραδοθήσεσθε αὐτῷ εἰς θάνατον.
