simplification_decisions:
- pob_phrase: Remember Jesus the Messiah
  simplified_phrase: Keep Jesus the Messiah in mind
  preserved_meaning: Paul commands ongoing remembrance of Jesus under his messianic title.
  reasoning_layer_used: Lexical decision for Μνημόνευε and theological decision for Χριστός
  rationale: This wording naturally conveys the command’s continuing force.
- pob_phrase: raised from the dead, descended from David
  simplified_phrase: he was raised from the dead and is descended from David
  preserved_meaning: Jesus was raised by an unstated agent and belongs to David’s family line.
  reasoning_layer_used: Lexical and theological decisions for ἐγηγερμένον and ἐκ σπέρματος Δαυίδ
  rationale: A full clause clearly distinguishes resurrection from family descent.
- pob_phrase: according to my gospel
  simplified_phrase: in keeping with the gospel I proclaim
  preserved_meaning: These truths accord with the gospel Paul proclaims.
  reasoning_layer_used: Lexical and theological decision for κατὰ τὸ εὐαγγέλιόν μου
  rationale: This preserves the broad relation expressed by “according to” while clarifying “my gospel.”
interpretive_expansions:
- pob_phrase: my gospel
  rendering: the gospel I proclaim
  claim: The possessive identifies the gospel Paul proclaims rather than a private gospel unique to him.
  evidence:
  - The POB lexical rationale lists “the gospel I proclaim” as an alternative.
  - The POB theological decision rejects the sense of a distinct Pauline gospel.
  confidence: high
  alternatives_preserved:
  - my gospel
translation_notes:
  risk_flags:
  - risk: Expanding “my gospel” could weaken Paul’s possessive wording.
    mitigation: The rendering follows a POB-approved alternative and retains Paul’s relation to the gospel.
