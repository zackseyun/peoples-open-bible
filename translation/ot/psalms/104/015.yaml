id: PSA.104.15
reference: Psalms 104:15
source:
  edition: WLC
  text: וְ/יַ֤יִן יְשַׂמַּ֬ח לְֽבַב אֱנ֗וֹשׁ לְ/הַצְהִ֣יל פָּנִ֣ים מִ/שָּׁ֑מֶן וְ֝/לֶ֗חֶם לְֽבַב אֱנ֥וֹשׁ יִסְעָֽד׀־־׃
translation:
  text: and wine that gladdens the human heart, oil[a] that makes the face shine[b], and bread that sustains the human heart.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Oil was used to anoint the skin.
    reason: cultural_note
  - marker: b
    text: Or, 'wine that gladdens the human heart, making the face shine more than oil.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/יַיִן
  chosen: and wine
  alternatives:
  - and wine that
  lexicon: HALOT
  rationale: Straightforward noun with conjunction. No article in Hebrew; English idiom naturally renders it as a generic substance, 'wine.'
- source_word: יְשַׂמַּח
  chosen: gladdens
  alternatives:
  - makes glad
  - cheers
  lexicon: HALOT
  rationale: Piel of שׂמח conveys causing joy or gladness. 'Gladdens' is concise, natural, and preserves the causative sense better than the more colloquial 'cheers.'
- source_word: לְבַב אֱנוֹשׁ
  chosen: the human heart
  alternatives:
  - the heart of a man
  - the human heart
  - the heart of man
  lexicon: HALOT
  rationale: The representative singular denotes the human heart generally.
- source_word: לְ/הַצְהִיל
  chosen: that makes ... shine
  alternatives:
  - to make ... shine
  - to brighten
  - making ... shine
  lexicon: HALOT
  rationale: The infinitive continues the provision list and is expressed as a relative clause with oil.
- source_word: פָּנִים
  chosen: the face
  alternatives:
  - faces
  - the countenance
  lexicon: HALOT
  rationale: Though morphologically plural, פָּנִים commonly functions as a singular in English when referring generically to a person's face/countenance. 'Face' is the most natural modern rendering.
- source_word: מִ/שָּׁמֶן
  lemma: מִן
  chosen: oil
  alternatives:
  - from oil
  - with oil
  - more than oil
  lexicon: HALOT
  rationale: 'The preposition indicates source or means: oil makes the face shine. The comparative reading is less likely in the agricultural triad.'
- source_word: וְ/לֶחֶם
  chosen: and bread
  alternatives:
  - and food
  lexicon: HALOT
  rationale: לֶחֶם literally means 'bread' and should be retained unless context clearly broadens it. Here bread stands naturally as staple food within the poetic triad.
- source_word: יִסְעָד
  chosen: sustains
  alternatives:
  - strengthens
  - supports
  lexicon: HALOT
  rationale: The verb סעד means to support, sustain, uphold. 'Sustains' fits the context of bread's nourishing function and pairs well with 'heart' in English.
