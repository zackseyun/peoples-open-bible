  text: 그분은 우리를 위하여 우리의 유산, 곧 그가 사랑하시는 야곱의 자랑을 택하십니다.[a][b] 셀라.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분은 우리를 위하여 우리의 유산, 곧 그가 사랑하시는 야곱의 영광을 택하실 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘그가 사랑하시는’은 ‘야곱’을 가리킬 수도 있고, 유산 또는 땅을 가리킬 수도 있습니다. 후자의 경우에는 ‘그가 사랑하시는 야곱의 자랑’으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘셀라’는 뜻이 확실하지 않은 히브리어 예배 또는 음악 용어이므로, 전통적으로 번역하지 않고 음역합니다.
    reason: cultural_note
