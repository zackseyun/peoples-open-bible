  text: 'I.1. While fasting and sitting on a certain mountain and thanking the Lord for everything he
    had done with me, I see the shepherd sitting beside me and saying, “Why have you come here so early?”
    I say, “Because, sir, I am keeping a station[a].”


    I.2. “What,” he says, “is a station?” “I am fasting, sir,” I say. “And what,” he says, “is this fast
    that you keep[b]?” “I fast as I have been accustomed, sir,” I say.


    I.3. “You do not know how to fast to the Lord[c],” he says, “nor is this useless fast that you keep
    for him a fast.” “Why do you say this, sir?” I say. He says, “I tell you that this is not fasting,
    the kind you think you are doing. But I will teach you what a complete fast acceptable to the Lord
    is.” “Yes, sir,” I say, “you will make me happy if I learn the fast acceptable to God[d].” “Listen,”
    he says.


    I.4. “God does not want such an empty fast. For by fasting to God in this way, you will accomplish
    nothing for righteousness. Instead, keep a fast of this kind to God[e]:”


    I.5. “Do nothing evil in your life, and serve the Lord with a pure heart. Keep his commandments, walking
    in his ordinances, and let no evil desire rise in your heart. Trust God; and if you do these things,
    fear him, and restrain yourself from every evil deed, you will live to God. And if you do these things,
    you will complete a great fast acceptable to God[f].”


    II.1. “Listen to the parable I am about to tell you, which concerns fasting[g].”


    II.2. “Someone had a field and many servants. He planted a vineyard in part of the field. Choosing
    a certain faithful, pleasing, honored servant[h], he called him and says to him, ‘Take this vineyard
    that I planted and fence it until I come[i]. Do nothing else to the vineyard. Keep this command of
    mine, and you will be free with me.’ Then the servant’s master went away on his journey.”


    II.3. “After he left, the servant took up the work and fenced the vineyard. When he had finished fencing
    it, he saw that the vineyard was full of weeds.”


    II.4. “So he reasoned within himself, saying, ‘I have completed this command of my master. Now I will
    dig this vineyard. It will look better when dug, and without weeds it will give more fruit, since
    it will not be choked by the weeds.’ He set to work, dug the vineyard, and pulled out all the weeds
    in it. That vineyard became very beautiful and flourishing, with no weeds to choke it.”


    II.5. “After a time, the master of the servant and of the field[j] came and entered the vineyard.
    He saw it well fenced and also dug, with all the weeds pulled out and the vines flourishing. He rejoiced
    greatly[k] at the servant’s work.”


    II.6. “So he called his beloved son, whom he had as heir, and the friends he had as advisers. He tells
    them everything he had commanded his servant and everything he had found done. They rejoiced with
    the servant because of the testimony the master gave about him.”


    II.7. “And he says to them, ‘I promised this servant freedom if he kept the command I gave him[l].
    He has kept my command and added a good work to the vineyard, and he has pleased me greatly. So in
    return for this work he has done, I want to make him co-heir with my son, because when he thought
    of what was good, he did not neglect it but carried it out.’”


    II.8. “The master’s son agreed with this decision, that the servant should become co-heir with the
    son[m].”


    II.9. “A few days later his master held a dinner[n] and sent him many dishes from it. The servant
    received the food sent to him by the master[o], took enough for himself, and distributed the rest
    to his fellow servants.”


    II.10. “His fellow servants received the food and rejoiced. They began to pray for him, that he might
    find greater favor with the master, because he had treated them in this way.”


    II.11. “His master heard everything that had happened and again rejoiced greatly at the servant’s
    action. Calling his friends and his son together again, the master told them what the servant had
    done with the food he had received[p]. They approved all the more that the servant should become co-heir
    with his son.”'
