  value:
  - marker: a
    text: Or 'our worship' or 'our devotion' for 'our religion.'
    reason: lexical_alternative
  - marker: b
    text: The address 'brothers' renders a masculine Greek form; the chapter is addressed to the Corinthian church as a body.
    reason: cultural_note
  - marker: c
    text: '''Free from resentment'' could also be rendered ''not bearing grudges'' or ''without remembering wrongs.'''
    reason: lexical_alternative
  - marker: d
    text: '''The sayings of God''s training'' may also be rendered ''the oracles of God''s instruction.'''
    reason: lexical_alternative
  - marker: e
    text: Or 'have been deeply instructed in'.
    reason: previous_rendering
  - marker: f
    text: Or 'in what concerns the Father and God and Creator and all people'.
    reason: previous_rendering
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
