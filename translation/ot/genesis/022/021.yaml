  rationale: The Hebrew construct naturally reads 'father of Aram.' Because genealogical 'father' can sometimes mean ancestor or founder, that nuance is preserved as an alternative, but the main text keeps the more direct rendering and does not import a broader ethnic or territorial interpretation beyond the text.
