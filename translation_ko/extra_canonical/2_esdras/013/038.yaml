    rationale: ‘율법도 그렇게 하실 것입니다’는 율법을 perdet(멸하다)의 목적어로 처리하지 못하며, 원문에 없는 서술을 도입합니다. et legem은 eos와 함께 perdet의 목적어입니다.
  - severity: low
    issue: 완료 수동 표현의 상태성이 약화됨
    rationale: adsimilatae sunt와 adsimilata est는 이미 불/불꽃에 비유된 상태를 가리키므로 ‘비유되어 있습니다’와 ‘비유된’으로 옮기는 편이 더 정확합니다.
