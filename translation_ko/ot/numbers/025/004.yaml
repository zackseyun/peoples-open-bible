  source_fidelity: 수령들을 처벌의 대상으로 보는 본문은 히브리어의 가장 직접적인 문법적 연결을 따르지만, 현 번역의 ‘여호와 앞에서’는 לַיהוָה를 ‘여호와를 위하여/여호와께’로 옮겨야 한다는 점에서 부정확합니다. 또한 הוֹקַע는 단순히 ‘매달아 죽이다’로 한정하기보다 공개적이고 가혹한 ‘꿰어 달기/말뚝에 달기’의 의미를 보존하는 편이 적절합니다.
  naturalness: ‘수령’은 오늘날 한국어에서 다소 낡고 북한 행정·정치 용례도 연상시킬 수 있으므로 ‘지도자’가 현대 표준어에 더 자연스럽습니다. 문장 전체를 현대적인 합쇼체 서술과 명령으로 다듬었습니다.
  terminology: יהוה는 초안의 관례를 따라 ‘여호와’로 유지했습니다. רָאשֵׁי는 ‘지도자들’, חֲרוֹן אַף는 열기를 보존하여 ‘타오르는 진노’로 옮겼습니다. ‘그들’의 선행사에 관한 실제 해석상 논점은 각주로 유지했습니다.
  issues:
  - severity: high
    issue: ‘여호와 앞에서’
    rationale: 히브리어는 לַיהוָה(‘여호와를 위하여/여호와께’)이며, ‘여호와 앞에서’라면 일반적으로 לִפְנֵי יהוה가 기대됩니다. 영어 감사 기록도 이 점을 반영하여 ‘for Yahweh’를 택합니다.
  - severity: medium
    issue: ‘매달아 죽이라’가 הוֹקַע의 의미를 과도하게 확정함
