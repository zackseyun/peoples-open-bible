translation:
  text: Urel, one of the holy angels—for he is concerned with the world and with “trembling.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The list uses a short relation of the world and of trembling, introduced by for/because; concerned with
      supplies an English relation without adding a specific office or an unprinted appointment verb. The world
      expression is an editorial emendation in Charles printed52 note4. The noun trembling is enclosed by daggers;
      Dillmann1865 column312 gives that sense and explicitly cites20:2. Charles note5 suggests that the word may
      go back to a corrupt transliteration of Tartarus. This is his suggestion, not an independently verified name,
      and Tartarus is not silently substituted.
