translation:
  text: And evil spirits came out from their flesh, because they were created from above[a],
    and their beginning and first foundation were from the holy Watchers[b]. They shall be evil
    spirits upon the earth and shall be called evil spirits[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected Ethiopic prints the daggered reading “from above.” Charles, p42 n49 and
      p43 n14, treats it as corrupt. Gg prints daggered ἀνωτέρων, “those above,” whereas Gs
      reads ἀνθρώπων, “human beings.” This English provisionally retains the selected Ethiopic
      rather than adopting the Greek-supported repair.
    reason: textual_variant
  - marker: b
    text: The conjunction (ወ), “and,” is parenthesized and supplied with Greek support in Charles,
      p42 n50. The origin-and-foundation wording is retained; Charles's Greek note, p43 n15,
      discusses probable duplication in the corresponding expression.
    reason: textual_variant
  - marker: c
    text: The longer earthly-existence and naming formulation follows the Ethiopic continuation
      on p44 and is discussed in p44 Greek apparatus n1.
    reason: textual_variant
