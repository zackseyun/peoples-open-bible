translation:
  text: Place rough and sharp stones over him, cover him with darkness, and let him remain there forever. Cover his face so
    that he may not see light.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: ደይ፡ ላዕሌሁ፡ እብነ
  chosen: Place ... stones over him
  alternatives:
  - Lay ... stones upon him
  - Set ... stones over him
  rationale: The imperative ደይ directs the placing of እብነ (“stones”) ላዕሌሁ (“over/upon him”). “Place ... over him” is clear
    modern English and preserves the image of burial or confinement without interpreting it further.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ጠያያተ፡ ወበሊሓተ
  chosen: rough and sharp
  alternatives:
  - jagged and sharp
  - rugged and sharp
  rationale: The paired modifiers characterize the stones by harsh texture or irregularity and by sharpness. “Rough and sharp”
    preserves both qualities without embellishing the image.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ክድኖ፡ ጽልመተ
  chosen: cover him with darkness
  alternatives:
  - envelop him in darkness
  - hide him in darkness
  rationale: ክድኖ is a command to cover him, while ጽልመተ is darkness. The rendering remains concrete and also preserves the
    repetition of “cover” later in the verse.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይኅድር፡ ለዓለም
  chosen: let him remain there forever
  alternatives:
  - let him dwell there forever
  - let him stay there for eternity
  rationale: ይኅድር can denote dwelling, staying, or remaining. In a place of confinement, “remain” communicates enforced continuance
    more naturally than “dwell,” while ለዓለም expresses unbounded duration in this judgment formula.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ክድኖ፡ ለገጹ
  chosen: Cover his face
  alternatives:
  - Veil his face
  - Cover over his face
  rationale: The clause repeats the verb used with darkness and specifies the face as its object. Repeating “cover” preserves
    the source's judgment rhetoric.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ከመ፡ ኢይርአይ፡ ብርሃነ
  chosen: so that he may not see light
  alternatives:
  - so that he will not see light
  - that he might not behold light
  rationale: The purpose clause states the intended deprivation directly. “See light” retains the concrete apocalyptic image;
    “behold” would add unnecessary archaism.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
