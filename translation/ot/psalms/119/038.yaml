id: PSA.119.38
reference: Psalms 119:38
source:
  edition: WLC
  text: הָקֵ֣ם לְ֭/עַבְדְּ/ךָ אִמְרָתֶ֑/ךָ אֲ֝שֶׁ֗ר לְ/יִרְאָתֶֽ/ךָ׃
translation:
  text: Fulfill your promise to your servant, so that you may be feared[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “Fulfill your promise to your servant, who is devoted to fearing you.” The Hebrew phrase may express the purpose of the promise or describe the servant’s devotion.
    reason: alternative_reading
lexical_decisions:
- source_word: אִמְרָתֶךָ
  chosen: promise
  alternatives:
  - word
  - saying
  lexicon: HALOT
  rationale: אִמְרָה in this psalm repeatedly denotes God's committed utterance on which the psalmist stakes his life; rendered 'promise' to distinguish it from דָּבָר ('word'), with 'word/saying' as alternatives.
- source_word: אֲשֶׁר לְיִרְאָתֶךָ
  chosen: so that you may be feared
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: The phrase can express the purpose or intended result of confirming the promise. This avoids introducing the current text’s unexpressed plural, while the alternative construal with the servant is retained in a note.
