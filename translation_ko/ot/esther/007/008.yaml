base_translation:
  language: en
  yaml_path: translation/ot/esther/007/008.yaml
  text: The king returned from the palace garden to the house of the wine feast, and Haman was falling on the couch where Esther was. Then the king said, “Will he even assault the queen while I am in the house?” As the word went out from the king’s mouth, they covered Haman’s face.
translation:
  language: ko
  text: 왕이 포도주 잔치가 열리던 궁궐 정원에서 연회장으로 돌아왔는데, 하만이 에스더가 기대고 있는 침상 위에 엎드려 있었습니다. 그러자 왕이 말했습니다. “내가 집 안에 있는데도, 그가 왕비를 강제로 범하려는 것이냐?” 왕의 입에서 그 말이 나오자, 사람들은 하만의 얼굴을 가렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포도주 잔치가 열리던 연회장’은 히브리어 ‘포도주의 잔치 집’을 한국어에서 자연스럽게 풀어 옮긴 표현입니다.
    reason: korean_style_note
  - marker: b
    text: ‘강제로 범하려는 것이냐’는 히브리어 כָּבַשׁ의 강한 폭력성을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית מִשְׁתֵּה הַיַּיִן
  english_pob_choice: the house of the wine feast
  chosen_korean: 포도주 잔치가 열리던 연회장
  alternatives_korean:
  - 포도주 잔치집
  - 술잔치의 집
  - 포도주 연회의 집
  lexicon: בַּיִת, מִשְׁתֶּה, יַיִן
  rationale: 직역 구조를 유지하되 한국어에서 자연스러운 장소 표현으로 풀어, 단순한 ‘집’보다 연회가 열리던 공간임을 드러냈습니다.
- source_word: נֹפֵל עַל הַמִּטָּה
  english_pob_choice: was falling on the couch
  chosen_korean: 침상 위에 엎드려 있었습니다
  alternatives_korean:
  - 침상에 넘어져 있었습니다
  - 침상 위에 쓰러져 있었습니다
  - 침상에 기대고 있었습니다
  lexicon: נפל + מִטָּה
  rationale: 히브리어 현재적/진행적 동작을 반영해 ‘엎드려 있었습니다’로 옮겨, 단순한 정태보다 당시의 상황성을 살렸습니다.
- source_word: הֲגַם לִכְבּוֹשׁ אֶת הַמַּלְכָּה
  english_pob_choice: Will he even assault the queen
  chosen_korean: 그가 왕비를 강제로 범하려는 것이냐
  alternatives_korean:
  - 그가 왕비를 겁탈하려는 것이냐
  - 그가 왕비를 능욕하려는 것이냐
  - 그가 왕비를 폭행하려는 것이냐
  lexicon: כָּבַשׁ
  rationale: 문맥상 성폭력적 폭언을 가리키므로, 전통적 완곡어보다 원문의 가혹함을 드러내는 ‘강제로 범하다’를 택했습니다.
- source_word: וּפְנֵי הָמָן חָפוּ
  english_pob_choice: they covered Haman’s face
  chosen_korean: 사람들은 하만의 얼굴을 가렸습니다
  alternatives_korean:
  - 하만의 얼굴을 덮었습니다
  - 하만은 얼굴을 가렸습니다
  - 하만의 얼굴이 가려졌습니다
  lexicon: חפה
  rationale: 히브리어 수동/집합적 뉘앙스를 살려, 왕 앞에서의 수치와 체포 직전의 행동을 모두 떠올리게 하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 왕의 즉각적 분노 표현과 성적 폭력 언어의 강도
  chosen_reading: 왕의 말은 단순한 의심이 아니라 왕비에 대한 강제 성행위 시도를 공적으로 규탄하는 폭발적 발언으로 읽었습니다.
  alternative_readings:
  - 정치적 음모에 대한 분노로 약화해 읽는 방법
  - 단순한 불륜 시도로 완화하는 방법
  rationale: 히브리어 כָּבַשׁ의 강한 의미와 서술의 긴박성을 고려하면, 왕의 발언은 사건의 도덕적·형사적 중대성을 분명히 드러냅니다.
  doctrine_reference: 성경 본문의 직설성과 인간의 죄악에 대한 공적 규탄
