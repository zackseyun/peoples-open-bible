    prior_rendering: and I will cut an everlasting covenant with them
    new_rendering: and make an everlasting covenant with them
    rationale: “Cut a covenant” is the Hebrew idiom for establishing a covenant; “make” carries its meaning in English without suggesting that the covenant itself is being severed.
