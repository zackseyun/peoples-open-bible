  from: For it is pleasant if you keep them within you[b][a], if they are established together on your lips.
  to: For it is pleasant when you keep them within you[a]; they will be ready together on your lips.
  rationale: The current second “if” wrongly turns the independent יִכֹּנוּ clause into a further protasis. The second כִּי naturally introduces the circumstance of keeping the sayings. The following imperfect is well rendered as the resulting availability of the sayings for speech. “Will be ready” is preferable to the proposal’s jussive “may they be ready,” since an imperative/wish force is not required, while “together” directly represents יַחְדָּו.
