id: PSA.68.1
reference: Psalms 68:1
source:
  edition: WLC
  text: יָק֣וּם אֱ֭לֹהִים יָפ֣וּצוּ אוֹיְבָ֑י/ו וְ/יָנ֥וּסוּ מְ֝שַׂנְאָ֗י/ו מִ/פָּנָֽי/ו׃
translation:
  text: Let God arise[a]; let his enemies scatter, and let those who hate him flee before him[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “God rises up; his enemies scatter, and those who hate him flee before him.”
    reason: alternative_reading
  - marker: b
    text: 'Echoes Moses'' prayer when the ark set out: “Rise up, Yahweh! May your enemies scatter” (Numbers 10:35).'
    reason: cross_reference
lexical_decisions:
- source_word: יָקוּם
  chosen: rises up
  alternatives:
  - arises
  - may God arise
  lexicon: HALOT
  rationale: Qal imperfect 3ms of קום. In poetic context it can function as a vivid present/future-like declaration or jussive-like wish. 'Rises up' preserves the verbal imagery and works naturally in English without overcommitting to an optative reading.
- source_word: אֱלֹהִים
  chosen: God
  lexicon: HALOT
  rationale: Though morphologically plural, here it takes a singular verb and clearly refers to Israel's God, so singular 'God' is required.
- source_word: יָפוּצוּ
  chosen: scatter
  alternatives:
  - scatter
  - are dispersed
  lexicon: HALOT
  rationale: The Qal plural verb is intransitive here.
- source_word: אֹיְבָיו
  chosen: his enemies
  lexicon: HALOT
  rationale: Construct form with 3ms suffix; straightforward possessive rendering.
- source_word: וְיָנוּסוּ
  chosen: and ... flee
  alternatives:
  - and ... take flight
  - and ... run away
  lexicon: HALOT
  rationale: Qal imperfect plural of נוס. 'Flee' is the most natural elevated English equivalent in a poetic context.
- source_word: מְשַׂנְאָיו
  chosen: those who hate him
  alternatives:
  - his haters
  - his foes
  lexicon: HALOT
  rationale: Participle functioning substantivally with 3ms suffix. 'Those who hate him' preserves the active verbal force better than a flatter noun like 'haters' or a broader term like 'foes'.
- source_word: מִפָּנָיו
  chosen: from before him
  alternatives:
  - from his presence
  - before him
  lexicon: HALOT
  rationale: Literally 'from his face/presence.' 'From before him' preserves the concrete Hebrew idiom and the sense of retreat in God's presence, while remaining understandable in English.
- source_word: מִפָּנָיו
  chosen: before him
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English in a flight/retreat clause while retaining the presence imagery.
