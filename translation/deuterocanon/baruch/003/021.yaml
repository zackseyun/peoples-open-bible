lexical_decisions:
- source_word: συνῆκαν
  lemma: συνίημι
  chosen: understand
  alternatives:
  - comprehend
  - perceive
  lexicon: BDAG
  rationale: The verb from συνίημι commonly denotes grasping or understanding. 'Understand' is clear modern English and fits the object 'its paths' as figurative language for wisdom's ways.
- source_word: τρίβους
  chosen: paths
  alternatives:
  - tracks
  - ways
  lexicon: LSJ
  rationale: τρίβος can mean path or track. 'Paths' preserves the metaphorical image and reads naturally in English alongside the following ὁδός-language.
- source_word: ἀντελάβοντο
  chosen: take hold of
  alternatives:
  - grasp
  - lay hold of
  - help themselves to
  lexicon: BDAG
  rationale: The middle of ἀντιλαμβάνομαι can mean take hold of, grasp, or partake of depending on context. Here, with wisdom implied by αὐτῆς, 'take hold of' preserves the metaphor of seizing or obtaining wisdom without overinterpreting.
- source_word: οἱ υἱοὶ αὐτῶν
  chosen: their sons
  alternatives:
  - their children
  lexicon: BDAG
  rationale: The Greek is explicitly masculine plural 'sons.' Per project policy, gender-accurate rendering is preferred over neutralizing to 'children' unless context requires it.
- source_word: πόρρω ἐγενήθησαν
  chosen: became far from
  alternatives:
  - went far from
  - were far removed from
  lexicon: LSJ
  rationale: The Greek is literally 'became far from.' This likely expresses estrangement or distance from the way in question. The chosen rendering stays close to the source while remaining intelligible.
- source_word: ἀπὸ τῆς ὁδοῦ αὐτῶν
  chosen: from their way
  alternatives:
  - from its way
  - from the way of them
  lexicon: BDAG
  rationale: The transmitted Greek reads plural possessive, most naturally 'their way.' Because the verse is marked with source validation 'major_mismatch' and the syntax is somewhat awkward, the translation stays close to the attested wording rather than smoothing to a conjectural singular.
