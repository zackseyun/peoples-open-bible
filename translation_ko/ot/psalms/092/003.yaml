    text: ‘가락’으로 옮긴 히가욘(הִגָּיוֹן)은 묵상, 낮은 소리, 또는 울림 있는 음악을 뜻할 수 있습니다. 여기서는 악기 문맥에 따라 음악적 의미로 옮겼습니다.
    reason: lexical_alternative
