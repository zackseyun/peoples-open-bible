  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: sw
  text: na ili audhihirishe utajiri wa utukufu wake juu ya vyombo vya rehema, ambavyo alivitayarisha tangu awali kwa ajili ya utukufu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωρίσῃ
  choice: audhihirishe
  rationale: Huwasilisha maana ya kufanya jambo lijulikane au lionekane wazi katika muktadha huu.
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: utajiri wa utukufu wake
  rationale: Hifadhi ya karibu ya sitiari na muundo wa Kigiriki.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: juu ya vyombo vya rehema
  rationale: Neno ἐπί limetafsiriwa moja kwa moja kama “juu ya,” na sitiari ya vyombo imehifadhiwa bila kuifafanua kupita kiasi.
- source_word: προητοίμασεν
  choice: alivitayarisha tangu awali
  rationale: Huonyesha wazi kiambishi πρό- cha kutayarisha kabla.
- source_word: εἰς δόξαν
  choice: kwa ajili ya utukufu
  rationale: Huhifadhi mwelekeo au kusudi linaloweza kuonyeshwa na εἰς bila kuongeza maelezo ya kimadhehebu.
theological_decisions:
- issue: Uhusiano wa “vyombo vya rehema” na utukufu wa Mungu
  choice: juu ya vyombo vya rehema
  alternative: kwa vyombo vya rehema
  rationale: “Juu ya” huhifadhi kwa ukaribu ἐπί na msisitizo wa utajiri wa utukufu wake kudhihirishwa juu yao.
- issue: Mtendaji wa kutayarisha tangu awali
  choice: ambavyo alivitayarisha tangu awali
  alternative: vilivyotayarishwa tangu awali
  rationale: Kitenzi cha Kigiriki kiko katika nafsi ya tatu umoja na katika muktadha mhusika anayerejelewa ni Mungu; tafsiri haifanyi kitenzi kuwa tendwa.
- issue: Maana ya “kwa ajili ya utukufu”
  choice: kwa ajili ya utukufu
  alternative: ili vipate utukufu
  rationale: Muundo mfupi huhifadhi uwezekano wa kusudi au hatima bila kufafanua zaidi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka. Muundo umewekwa kama mwendelezo wa sentensi ya mstari uliotangulia, kwa hiyo unaanza kwa herufi ndogo na kuishia kwa koma.
