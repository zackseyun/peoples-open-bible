  to: 이제 보십시오, 야훼께서 당신의 이 예언자들의 입에 거짓 영을 넣으셨고, 야훼께서 당신에게 재앙을 선언하셨습니다.[a][b]
  rationale: 히브리어 원문과 영어 POB의 ‘has spoken disaster against you’를 따라, 재앙을 왕에게 선포하셨다는 의미를 자연스러운 한국어로 명확히 했습니다. 나머지 표현은 원문의 직접적 인과 서술과 심판 선언의 어조를 유지했습니다.
