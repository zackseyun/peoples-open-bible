  source_fidelity: ἀσθενῶν을 ‘병든 사람’으로, Κύριε를 영어 POB의 확정 선택을 따라 ‘주님’으로 옮겼습니다. ἄνθρωπον οὐκ ἔχω ἵνα ... βάλῃ με의 ‘나를 못에 넣어 줄 사람이 없습니다’는 목적·필요의 뜻을 충실히 반영합니다. ὅταν ταραχθῇ τὸ ὕδωρ도 ‘물이 흔들릴 때’로 수동적 물의 동요를 과장 없이 전달하며, ἐν ᾧ ... ἄλλος πρὸ ἐμοῦ καταβαίνει는 ‘제가 가는 동안에는 다른 사람이 저보다 먼저 내려갑니다’로 원문의 진행성과 선행을 보존합니다.
  naturalness: 현대 표준어 합쇼체가 일관되며, 문장 흐름도 자연스럽습니다. ‘못’은 성경 문맥에서 κολυμβήθρα의 수조/연못을 간결하게 지칭하는 자연스러운 표현입니다.
  terminology: ‘주님’은 제공된 영어 POB 감사 이력의 Lord 선택과 일치합니다. ‘병든 사람’, ‘못’, ‘물이 흔들릴 때’도 본문 문맥과 현대 한국어 사용에 적절합니다.
