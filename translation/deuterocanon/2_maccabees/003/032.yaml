  from: But the high priest[a], becoming suspicious that the king might perhaps suppose that some wrongdoing against Heliodorus had been carried out by the Jews, offered a sacrifice for the man's recovery.
  to: Fearing that the king might think the Jews had committed a crime against Heliodorus, the high priest offered a sacrifice for the man's recovery.
  rationale: The lexical rationale correctly identifies wary concern rather than suspicion directed at Onias, so I express that concern more clearly. I retain 'recovery,' which the record grounds in Heliodorus's bodily condition, and drop the unnecessary note about broader senses of σωτηρία.
