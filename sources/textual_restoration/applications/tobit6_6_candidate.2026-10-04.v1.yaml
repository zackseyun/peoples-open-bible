id: TOB.6.6
reference: Tobit 6:6
source:
  edition: lxx-swete-1909
  text: καὶ ἀνασχίσας τὸ παιδάριον τὸν ἰχθὺν συνήγαγεν τὴν χολὴν καὶ τὴν καρδίαν καὶ τὸ ἧπαρ, καὶ ὤπτησεν τοῦ ἰχθύος καὶ ἔφαγεν, καὶ ἀφῆκεν ἐξ αὐτοῦ ἡλισμένον. καὶ
    ἐπορεύθησαν ἀμφότεροι κοινῶς ἕως ἤγγισαν εἰς Μηδίαν.
  language: Greek
  pages:
  - 847
  literary_form: Greek II, Swete lower Sinaiticus text
  validation: published_print_checked; historical_priority_unresolved
  note: Local longer-form selection for 6:3–6 within POB’s otherwise unreviewed mixed working Tobit. This is verbatim printed Greek, not restored Aramaic or a continuous
    Sinaiticus edition.
  numbering_note: Swete comparison numbering VI 6; content alignment governs, not another edition’s verse label.
translation:
  text: The young man cut open the fish and collected the gall, heart and liver. He roasted some of the fish and ate it[a], and set aside some of it, salted. Then
    the two of them traveled together until they came near Media[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In the selected longer Greek, the young man alone roasts and eats some of the fish; he sets aside a salted portion. The shorter Greek says they roasted
      and ate. Published 4Q197 preserves the complete singular Aramaic eating verb; 4Q196 preserves only its final letter and a following word boundary, conditionally
      supporting the singular reconstruction. This does not prove original wording or settle the angel’s nature.
    reason: textual_variant
  - marker: b
    text: The longer Greek names Media, the region; the shorter Greek names Ecbatana, a city. The selected wording expresses approach, not full arrival.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνασχίσας ... συνήγαγεν
  chosen: cut open ... collected
  rationale: Render participle and main verb as an English sequence; retain the named organs.
- source_word: ὤπτησεν τοῦ ἰχθύος καὶ ἔφαγεν
  chosen: He roasted some of the fish and ate it
  rationale: Preserve the partitive fish expression and singular eater; the travel clause alone returns to a plural subject.
- source_word: ἀφῆκεν ἐξ αὐτοῦ ἡλισμένον
  chosen: set aside some of it, salted
  rationale: Keep the retained portion and its salted state; do not invent a separately narrated salting action.
- source_word: ἐπορεύθησαν ἀμφότεροι κοινῶς
  chosen: the two of them traveled together
  rationale: Preserve both travelers and togetherness without requiring walked.
- source_word: ἕως ἤγγισαν εἰς Μηδίαν
  chosen: until they came near Media
  rationale: Preserve the regional place name and approach rather than arrival.
