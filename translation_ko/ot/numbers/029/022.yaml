base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/022.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
  footnotes:
  - marker: a
    text: Or 'the continual burnt offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'its grain offering and its drink offering,' referring to the regular burnt offering.
    reason: cross_reference
translation:
  language: ko
  text: 또한 늘 드리는 번제[b]와 그 소제와 그 전제[a] 외에, 속죄제물로 수염소 한 마리를 드리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘그 소제와 그 전제’; 늘 드리는 번제를 가리킵니다.
    reason: 히브리어 여성 단수 소유 접미사가 앞의 번제를 가리킴을 명시합니다.
  - marker: b
    text: 또는 ‘계속 드리는 번제’.
    reason: תָּמִיד의 가능한 번역을 제시합니다.
lexical_decisions:
- source_word: שְׂעִיר
  english_pob_choice: male goat
  chosen_korean: 수염소
  alternatives_korean: 염소, 수컷 염소
  lexicon: WLC
  rationale: Hebrew שְׂעִיר specifically denotes a male goat, which is the standard sacrificial animal for sin offerings in Levitical law. '수염소' preserves this specific gender and species distinction.
- source_word: עֹלָת
  english_pob_choice: burnt offering
  chosen_korean: 번제
  alternatives_korean: 올려드리는 제사
  lexicon: WLC
  rationale: Standard theological term for עֹלָת in Korean Bible translations, referring to the total consumption of the sacrifice on the altar.
- source_word: תָּמִיד
  english_pob_choice: regular
  chosen_korean: 지속적인
  alternatives_korean: 상시, 매일
  lexicon: WLC
  rationale: Refers to the daily continual offering. '지속적인' conveys the unceasing nature of the daily sacrifice better than '매일' which might imply only frequency without the covenantal continuity.
- source_word: מִנְחָתָהּ
  english_pob_choice: grain offering
  chosen_korean: 소제
  alternatives_korean: 곡물 제물
  lexicon: WLC
  rationale: Standard term for מִנְחָה in Korean religious context, referring to the grain offering accompanying the burnt offering.
- source_word: נִסְכָּהּ
  english_pob_choice: drink offering
  chosen_korean: 전제
  alternatives_korean: 부어 드리는 제물
  lexicon: WLC
  rationale: Standard term for נֶסֶךְ, referring to the liquid offering poured out, typically wine.
theological_decisions:
- decision: Structure of 'besides'
  rationale: The Hebrew מִלְּבַד (besides/except) indicates that the goat is an addition to the standard daily sacrifice, not a replacement. The Korean structure '... 외에' clearly marks this additive relationship.
- decision: Reference of pronouns
  rationale: The Hebrew suffixes on 'grain' and 'drink' (תָּמִיד) refer back to the burnt offering (עֹלָת). The translation explicitly links them to '번제' to avoid ambiguity, as the English context note suggests.
