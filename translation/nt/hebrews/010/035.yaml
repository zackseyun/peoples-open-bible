  chosen_reading: The term refers to the believers' confident boldness before God and in persevering faith, rendered 'boldness.'
  alternative_readings:
  - confidence
  rationale: Hebrews uses παρρησία for confident access and steadfast openness grounded in faith. Rendering it 'boldness' preserves the exhortational force without narrowing it to inward assurance alone.
