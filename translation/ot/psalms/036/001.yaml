  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: ambiguity
  tier: 1
  from: 'Transgression speaks to the wicked within my heart: there is no fear of God before his eyes[a].'
  to: 'Within my heart, transgression speaks to the wicked: there is no fear of God before his eyes.[a]'
  rationale: 'Fronting “Within my heart” is a warranted minimal clarification: it prevents English from attaching the phrase to “the wicked,” while retaining the difficult first-person MT reading. The proposal’s “concerning the wicked” is not required by the Hebrew and weakens the more straightforward force of לָרָשָׁע as the recipient/addressee (“to the wicked”); the ambiguity can remain documented. “Speaks” is a natural personifying rendering of נְאֻם in this compressed construction. Quotation marks and “declares” add interpretive presentation and are unnecessary.'
