id: LEV.14.57
reference: Leviticus 14:57
source:
  edition: WLC
  text: לְ/הוֹרֹ֕ת בְּ/י֥וֹם הַ/טָּמֵ֖א וּ/בְ/י֣וֹם הַ/טָּהֹ֑ר זֹ֥את תּוֹרַ֖ת הַ/צָּרָֽעַת׃ס
translation:
  text: to give instruction about when something is unclean and when it is clean. This is the law concerning the defiling condition[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Traditionally, “leprosy.” The Hebrew term can describe defiling conditions affecting people, fabrics, or houses and is not limited to modern Hansen’s disease.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/הוֹרֹת
  chosen: to give instruction about
  alternatives:
  - to teach about
  - to instruct concerning
  lexicon: HALOT
  rationale: The Hiphil describes authoritative instruction about recognizing the ritual states covered by the preceding laws.
- source_word: בְּ/י֥וֹם
  chosen: when
  alternatives:
  - at the time
  lexicon: HALOT
  rationale: In this formula the temporal idiom means when the condition is present, not a literal calendar day.
- source_word: הַ/טָּמֵא
  chosen: it is unclean
  alternatives:
  - the unclean state
  lexicon: HALOT
  rationale: The adjective identifies the condition being judged. A finite English clause makes the practical distinction clear.
- source_word: וּ/בְ/י֣וֹם הַ/טָּהֹר
  chosen: and when it is clean
  alternatives:
  - and at the time it is clean
  lexicon: HALOT
  rationale: The parallel temporal idiom contrasts the recognized clean state with the unclean state.
- source_word: זֹאת
  chosen: This is
  alternatives:
  - This
  - Such is
  lexicon: HALOT
  rationale: Standard demonstrative introducing a concluding summary formula.
- source_word: תּוֹרַת
  chosen: the law concerning
  alternatives:
  - the instruction concerning
  lexicon: HALOT
  rationale: The construct introduces the governing instruction for the category that follows.
- source_word: הַ/צָּרָעַת
  chosen: the defiling condition
  alternatives:
  - the scale disease
  - leprosy
  lexicon: HALOT
  rationale: The Hebrew ritual category applies not only to human skin but also to fabrics and houses. 'Defiling condition' communicates its shared ritual effect without a false medical identification.
