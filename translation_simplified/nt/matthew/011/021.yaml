translation:
  language: en
  text: Woe to you, Chorazin! Woe to you, Bethsaida! If the miracles done among you had happened in Tyre and Sidon, their people would have reoriented toward God[r1] long ago, wearing sackcloth and sitting in ashes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sackcloth and ashes were signs of mourning and repentance.
    reason: cultural_note
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the mighty works done among you
  simplified_phrase: the miracles done among you
  preserved_meaning: These were deeds of divine power performed among the townspeople.
  reasoning_layer_used: POB lexical decision for αἱ δυνάμεις
  rationale: “Miracles” is an approved alternative that immediately identifies the deeds for modern readers.
- pob_phrase: had taken place in Tyre and Sidon
  simplified_phrase: had happened in Tyre and Sidon
  preserved_meaning: Jesus makes a contrary-to-fact comparison between the towns.
  reasoning_layer_used: POB lexical decision for ἐγένοντο and theological decision
  rationale: “Had happened” is plainer while preserving the hypothetical comparison.
interpretive_expansions:
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: “Miracles” is narrower than the more literal “mighty works.”
    mitigation: POB lists “miracles” as a valid contextual alternative for deeds of divine power.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
