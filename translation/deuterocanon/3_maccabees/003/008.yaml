translation:
  text: But the Greeks in the city, who had suffered no wrong, saw the unexpected turmoil surrounding the Jews and the disorderly crowds gathering. They lacked the power to help, but their sympathy moved them to appeal on the Jews' behalf[a]; some were also agitated[b] and thought the situation would change.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'to offer them encouragement'; the Greek wording of this clause is difficult.
    reason: alternative_reading
  - marker: b
    text: Or, 'were also caught up in the commotion.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οἱ δὲ κατὰ τὴν πόλιν Ἕλληνες
  chosen: But the Greeks in the city
  alternatives:
  - Now the Greeks throughout the city
  - But the city-dwelling Greeks
  lexicon: LSJ
  rationale: κατὰ τὴν πόλιν idiomatically locates them within the city rather than meaning 'throughout' in a distributive sense. 'But' reflects δέ as a mild contrast with the prior group.
- source_word: οὐδὲν ἠδικημένοι
  chosen: having suffered no wrong
  alternatives:
  - having been wronged in nothing
  - not having been harmed at all
  lexicon: LSJ
  rationale: Perfect passive participle of ἀδικέω indicates they themselves had not been mistreated. 'Having suffered no wrong' is natural English and preserves the passive sense.
- source_word: ταραχὴν ἀπροσδόκητον
  chosen: the unexpected turmoil
  alternatives:
  - an unexpected disturbance
  - unexpected unrest
  lexicon: LSJ
  rationale: ταραχή denotes disturbance, turmoil, or commotion. 'Turmoil' fits the civic unrest context and reads naturally.
- source_word: περὶ τοὺς ἄνδρας
  chosen: concerning the men
  alternatives:
  - around the men
  - about those men
  lexicon: LSJ
  rationale: περί here marks reference rather than physical location. 'Concerning the men' keeps the ambiguity broad and avoids over-specifying.
- source_word: συνδρομὰς ἀπροκόπους γινομένας
  chosen: the disorderly gatherings that were taking place
  alternatives:
  - the unmanageable rushes that were happening
  - the aimless crowds forming
  lexicon: LSJ
  rationale: συνδρομή can denote a running together, concourse, or gathering/crowd. ἀπρόκοπος literally suggests making no progress, hence ineffective, disorderly, or unmanageable. 'Disorderly gatherings' best captures the public crowding in context.
- source_word: βοηθεῖν μὲν οὐκ ἔσθενον
  chosen: they were not strong enough to help
  alternatives:
  - they were unable to help
  - they did not have the strength to assist
  lexicon: LSJ
  rationale: σθενόω/ἔσθενον conveys having strength or capacity. The phrase indicates inability rather than unwillingness.
- source_word: παρακλῆσιν γὰρ ἡ διάθεσις παρεκάλουν
  chosen: for their disposition urged an appeal
  alternatives:
  - for their inclination kept calling for encouragement
  - for their sympathy prompted entreaty
  lexicon: LSJ
  rationale: The Greek is somewhat compressed. παράκλησις can mean exhortation, appeal, entreaty, or encouragement; διάθεσις is disposition/inclination. The sense appears to be that their inner attitude moved them toward pleading rather than direct intervention. 'Urged an appeal' preserves that without over-paraphrasing.
- source_word: οἱ δὲ καὶ συνδρόμως εἶχον
  chosen: and some also were in an agitated state
  alternatives:
  - and some too were in confusion
  - and some also were swept along with the crowd
  lexicon: LSJ
  rationale: The adverb συνδρόμως is rare and related to συνδρομή; it likely means tumultuously, in a state of commotion, or along with the rush. 'Were in an agitated state' captures the emotional/social disturbance without forcing a more specific image.
- source_word: μεταπεσεῖσθαι ταῦτα ὑπελάμβανον
  chosen: supposed that these things would change
  alternatives:
  - thought that this situation would turn around
  - assumed that these matters would take another turn
  lexicon: LSJ
  rationale: μεταπίπτω means to change, turn, or shift. The infinitive with ὑπολαμβάνω expresses their assumption that the present situation would alter.
