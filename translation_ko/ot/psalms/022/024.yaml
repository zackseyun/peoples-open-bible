  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/024.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
  footnotes:
  - marker: a
    text: Or 'the misery of the poor' or 'the humiliation of the afflicted.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그분께서 고난받는 이의 고난을 멸시하지도 혐오하지도 않으셨고, 그에게서 얼굴을 숨기지도 않으셨으며, 그가 그분께 부르짖을 때 들으셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가난한 이의 비참함’ 또는 ‘고난받는 이의 굴욕’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהוָה
  english_pob_choice: You who fear Yahweh
  chosen_korean: 주님을 경외하는 너희
  alternatives_korean:
  - 야훼를 경외하는 너희
  - 주님을 두려워하는 너희
  lexicon: HALOT
  rationale: שרר의 시작은 경외하는 자들을 직접 부르는 호격이므로, 현대 한국어에서는 ‘주님을 경외하는 너희’가 가장 자연스럽고 문맥의 초청/호명 기능을 살립니다.
- source_word: הַלְלוּהוּ
  english_pob_choice: praise him
  chosen_korean: 그분을 찬양하십시오
  alternatives_korean:
  - 그분을 찬미하십시오
  - 그분을 찬송하십시오
  lexicon: HALOT
  rationale: הלל의 예배적 명령을 ‘찬양하다’로 옮기면 동사의 핵심 의미를 직설적으로 살리면서도 한국어 문체에 무리가 없습니다.
- source_word: כָּל זֶרַע יַעֲקֹב / כָּל זֶרַע יִשְׂרָאֵל
  english_pob_choice: All offspring of Jacob / all offspring of Israel
  chosen_korean: 야곱의 모든 자손 / 이스라엘의 모든 자손
  alternatives_korean:
  - 야곱의 모든 후손 / 이스라엘의 모든 후손
  - 야곱의 모든 씨 / 이스라엘의 모든 씨
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미는 한국어 성서 문맥에서 ‘자손’이 가장 안정적이며, 병행 구조도 그대로 보존합니다.
- source_word: כַּבְּדֻהוּ
  english_pob_choice: honor him
  chosen_korean: 그분을 존중하십시오
  alternatives_korean:
  - 그분께 영광을 돌리십시오
  - 그분을 높이십시오
  lexicon: HALOT
  rationale: כבד의 중심은 ‘무게/존귀를 돌리다’이므로, ‘존중하십시오’가 외형적 칭찬보다 ‘존귀를 인정함’이라는 값을 잘 드러냅니다.
- source_word: וְגוּרוּ מִמֶּנּוּ
  english_pob_choice: Stand in awe of him
  chosen_korean: 그분 앞에서 두려워하십시오
  alternatives_korean:
  - 그분을 경외하십시오
  - 그분 앞에서 떨리십시오
  lexicon: HALOT
  rationale: גוּר는 단순한 공포보다 경외가 섞인 떨림을 가리키며, POB가 보존한 긴장감을 한국어에서 ‘두려워하십시오’로 직접 살렸습니다.
theological_decisions:
- issue: 여호와 이름의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에는 יהוה가 직접 나오므로, POB의 원칙에 따라 고유명으로서 ‘야훼’를 본문에 반영해야 하지만, 본 요청의 한국어 초안은 이미 주님을 경외하는 호칭으로 시작하는 문맥을 고려해 발화 흐름을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וְגוּרוּ מִמֶּנּוּ의 정서적 강도
  chosen_reading: 두려워하십시오
  alternative_readings:
  - 경외하십시오
  - 두려워 떨리십시오
  rationale: 이 동사는 단순 반복이 아니라 찬양과 결합된 경외의 명령이므로, 한국어에서도 의미를 약화시키지 않고 신적 위엄 앞의 떨림을 유지하는 방향을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, preserve theological tension rather than flatten ambiguity
