  scope: WLC Hebrew, immediate literary context, natural-English and interpretation-boundary review
  human_or_scholar_review: false
  review_summary: 'The Hebrew coordinates two objects under לֹא הֵסִיר, but English does not naturally use one rendering of הֵסִיר with both: God does not reject/turn aside the speaker’s prayer and does not remove/withhold his חֶסֶד from him. The current wording, “turned away my prayer,” is understandable but unnatural and may suggest redirecting the prayer rather than refusing it. Splitting the shared Hebrew verb into the ordinary contextual idioms “rejected” and “withheld” makes the sense clear without adding content. “Steadfast love” remains a sound rendering of חֶסֶד. The footnote markers are removed because the existing notes overstate covenant as inherent in the word and do not adequately explain the English split rendering.'
