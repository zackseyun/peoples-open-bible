base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/085.yaml
  text: Jesus said[1], "Adam came into being from a great power and a great wealth, and he did not become worthy of you. For had he been worthy[2], he would not have tasted death."
  footnotes:
  - marker: '1'
    text: The manuscript contains lacunae at the words for 'worthy' (ⲉ̣[ϥⲙ]ⲡ̣ϣⲁ) and 'he would have tasted' ([ⲛⲉϥⲛⲁϫⲓ] ϯ̣ⲡ̣[ⲉ). The restorations are standard and universally accepted based on context and available space.
    reason: textual_variant
  - marker: '2'
    text: The Coptic ⲛⲉⲩⲁⲝⲓⲟⲥ (ⲛⲉ ⲟⲩⲁⲝⲓⲟⲥ) functions here as the protasis of an unreal condition ('had he been worthy'), paired with the apodosis ⲛⲉϥⲛⲁϫⲓ ϯⲡⲉ ('he would have tasted').
    reason: register_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「아담은 큰 능력과 큰 부에서 생겨났습니다. 그러나 그는 여러분에게 합당한 이가 되지 못했습니다[a]. 그가 여러분에게 합당했더라면, 죽음을 맛보지[a] 않았을 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사본에서 ‘합당한 이가 되지 못했습니다’에 해당하는 구절의 일부(ⲉ̣[ϥⲙ]ⲡ̣ϣⲁ)와 ‘맛보지 않았을 것입니다’에 해당하는 구절의 일부([ⲛⲉϥⲛⲁϫⲓ] ϯ̣ⲡ̣[ⲉ)가 결손되어 있습니다. 번역은 문맥과 필사본의 남은 글자에 근거한 통상적인 복원을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  english_pob_choice: came into being
  chosen_korean: 나왔으나
  alternatives_korean:
  - 생겨났으나
  - 존재하게 되었으나
  lexicon: Crum 584a
  rationale: 원문의 ‘존재하게 되다/생겨나다’ 계열 의미를 살리되, 한국어에서는 출현·기원 감각을 자연스럽게 드러내는 ‘나오다’로 옮겼습니다.
- source_word: ⲛⲟϭ ⲛ̄ⲇⲩⲛⲁⲙⲓⲥ
  english_pob_choice: a great power
  chosen_korean: 큰 능력
  alternatives_korean:
  - 큰 힘
  - 위대한 능력
  lexicon: Crum 584a; Crum 140a
  rationale: 단수의 ‘a great power’를 반영하여 복수화하지 않고, 사상적·형이상학적 뉘앙스를 유지하기 위해 ‘능력’을 택했습니다.
- source_word: ⲙⲛⲧⲣⲙⲙⲁⲟ
  english_pob_choice: wealth
  chosen_korean: 큰 부
  alternatives_korean:
  - 부
  - 재물
  - 부유함
  lexicon: Crum 295b
  rationale: 추상명사로서 ‘wealth’를 간결하게 전달하면서, 문맥상 ‘크다’의 반복을 살려 평행구조를 맞추었습니다.
- source_word: ⲙⲡϣⲁ / ⲛⲉⲩⲁⲝⲓⲟⲥ
  english_pob_choice: worthy
  chosen_korean: 합당하지 않았습니다
  alternatives_korean:
  - 가치 있지 않았습니다
  - 마땅하지 않았습니다
  lexicon: Crum 208b
  rationale: 문맥의 조건절(‘만일 합당했다면’)과 주절의 평가를 자연스럽게 연결하기 위해 ‘합당하다’ 계열로 옮겼습니다.
- source_word: ϫⲓ ϯⲡⲉ
  english_pob_choice: tasted
  chosen_korean: 맛보지 않았을 것입니다
  alternatives_korean:
  - 경험하지 않았을 것입니다
  - 죽음을 겪지 않았을 것입니다
  lexicon: Crum 421a
  rationale: 원문의 관용구를 직역하되 한국어에서도 통용되는 ‘맛보다’로 유지하여 ‘죽음’을 경험하는 관용 의미를 보존했습니다.
theological_decisions:
- issue: ‘여러분에게 합당하지 않았다’의 대상 해석
  chosen_reading: 아담이 ‘여러분’에게 합당하지 않았다는 직접 대조를 살렸습니다.
  alternative_readings:
  - 아담이 그들에게 합당하지 않았다
  - 아담이 너희에게 합당하지 않았다
  rationale: 원문의 인칭 대명사 복수형을 그대로 살려 독자가 화자-청자 구도를 느끼게 했고, 본문이 가진 대조와 긴장을 약화시키지 않기 위해 완곡화하지 않았습니다.
  doctrine_reference: Thomasine saying structure; no canonical doctrinal harmonization applied
- issue: 가정법 반사실 조건절
  chosen_reading: ‘만일 그가 합당했다면, 죽음을 맛보지 않았을 것입니다’로 반사실 조건을 분명히 표현했습니다.
  alternative_readings:
  - 그가 합당했더라면 죽음을 맛보지 않았을 것입니다
  - 그가 합당했다면 죽음을 보지 않았을 것입니다
  rationale: Coptic의 unreal condition을 한국어 조건-결과 구조로 옮겨, 본문이 말하는 가정적 논리를 명료하게 드러냈습니다.
  doctrine_reference: Coptic unreal conditional construction
