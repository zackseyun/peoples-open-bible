- source_word: οἱ Ἰσμαήλου
  chosen: the sons of Ishmael
  alternatives:
  - those of Ishmael
  lexicon: LSJ
  rationale: The Greek uses a genitival family designation, literally 'those of Ishmael.' In this census style, English commonly
    and clearly renders such patronymics as 'the sons of Ishmael.' The proper name is transliterated rather than translated.
- source_word: υἱοὶ Λακουβάτου
