translation:
  text: 'III.1. But it is not for this that God is angry with you, but so that you may turn back your
    household[a], which has sinned against the Lord and against you[h], their parents. Yet, being fond
    of your children, you did not admonish your household, but you let it be grievously ruined; for this
    the Lord is angry with you. But he will heal all the past evils in your household; for because of
    their sins and lawless deeds you yourself were ruined by worldly affairs.


    III.2. But the Lord’s abundant compassion has had mercy on you and your household, and he will strengthen
    you and set you on a foundation in his glory. Only do not be slothful, but take heart and strengthen
    your household. For, as the blacksmith hammering his work masters the thing he intends, so also the
    righteous word day by day[e] prevails over every wickedness. Do not, therefore, cease admonishing
    your children; for I know that if they repent[i][f] with their whole heart, they will be written in
    the books of life[b] with the holy ones[g].


    III.3. After these words of hers ceased, she says to me, “Do you wish to hear me reading?” And I say,
    “I do, Lady.” She says to me, “Become a hearer, and hear the glories of God.” I heard great and wondrous
    things which I was not able to remember; for all the words were terrifying—things a human being is
    not able to bear. So I remembered the last words, for they were beneficial and gentle for us[j]:


    III.4. “Behold, the God of hosts[c], who by his invisible and mighty power[k] and by his great understanding
    created the world, and by his glorious counsel adorned his creation with beauty, and by his mighty
    word fixed the heaven and founded the earth upon the waters[d], and by his own wisdom and providence
    created his holy church, which also he blessed—behold, he is moving the heavens and the mountains
    and the hills and the seas, and all things become level for his elect, in order that he may give to
    them the promise which he promised with much glory and joy, if they keep the statutes of God which
    they received with great faith[l].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: h
    text: The printed working edition, Lightfoot & Harmer physical315/printed299, reads hymas, you, not
      the imported hemas, us. Raw and normalized text are corrected to that printed reading. Athos Plate
      I has you; Vulgata printed5 has vos as an editorial emendation against reported nos in D and omission
      in Vat; Palatina printed11 has vobis, you. Sinaiticus3.1 first hand has a difficult e autous e tous
      sequence; corrector ca replaces it with kai eis hemas tous, and against us, their. That actual corrected
      reading remains a variant, not a reason to misquote the working edition or a second manuscript vote.
      The same Ethiopic edition’s Latin rendering has contra vos quoque, against you also, followed by
      contra parentes vestros, against your parents; that different parent phrasing is not silently equated
      with the selected Greek.
    reason: textual_variant
  - marker: a
    text: Turn back renders epistrepseis in the purpose clause, directing Hermas to turn or correct his
      household. It is distinct from metanoesosin, repent, in paragraph2. The Greek supplies the household
      and its named wrongdoing; no uniform added direction is imposed. Palatina printed11 uses corrigas,
      correct. Sinaiticus3.1 first hand has epistrepse, corrected by ca to epistrepses; the working second-person
      command/purpose remains. D’Abbadie1860’s Latin rendering of the Ethiopic (printed114) also gives
      a corrective purpose, ut reprehendas, that you may rebuke; the present comparison is through that
      translation, not directly from Geʿez.
    reason: lexical_alternative
  - marker: i
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: b
    reason: textual_variant
    text: The working Greek, Athos and Sinaiticus3.2 have plural books of life. Vulgata printed6 has singular
      book of life and prints scribentur, will be written, as an editorial emendation against reported
      forms in its codices. Palatina printed13–15 has books of life of the saints. The working plural
      is preserved without treating the Vulgata editor’s corrected verb as independent codex evidence.
      D’Abbadie1860’s Latin rendering of the Ethiopic printed115 has singular book of life with the saints.
  - marker: c
    reason: lexical_alternative
    text: God of hosts renders Theos ton dynameon; God of the powers or armies are alternatives. The Greek
      title is retained without inserting a divine personal name.
  - marker: d
    reason: cultural_note
    text: The earth founded upon the waters preserves the source’s creation image. Athos, Sinaiticus3.4
      and both Latin printed versions retain it. No physical mechanism is added to the ancient wording.
  - marker: e
    reason: textual_variant
    text: The daily righteous word prevailing over every wickedness follows the working Greek, Athos and
      Sinaiticus3.2. Vulgata printed6 instead has speaking a daily righteous word and cutting off a great
      sin; Palatina printed13 has the daily righteous word overcoming all iniquity. The blacksmith comparison
      and every/all scope of the selected Greek are retained. The Ethiopic edition’s Latin rendering printed115
      likewise has the daily word of justice (truth) overcoming every evil. Its printed114 main wording
      instead has remittet tibi in the glory clause; the footnote proposes fundabit, will establish, as
      a reading change. That proposed foundation reading is not counted as preserved Ethiopic words.
  - marker: f
    reason: textual_variant
    text: The working Greek, Athos and Sinaiticus3.2 retain if they repent with their whole heart, with
      the future writing promise conditional. Vulgata printed6 instead says God knows that they will do
      repentance, omitting the if; Palatina printed13 has I know that they will do repentance, also without
      if. Neither Latin formulation replaces the selected condition or the woman’s I know. Repentance
      remains distinct from turning the household in paragraph1. Unlike those two Latin versions, d’Abbadie1860’s
      rendering of the Ethiopic printed115 retains I know, if they repent with their whole heart.
  - marker: g
    reason: textual_variant
    text: Holy ones renders hagioi; saints is an alternative. Working Greek, Athos and Sinaiticus3.2 have
      with the holy ones. Vulgata printed6 ends the promise at the book of life without this phrase; Palatina
      printed13–15 has the books of life of the saints. Their formulations are not silently harmonized.
      The Ethiopic edition’s Latin rendering printed115 retains with the saints.
  - marker: j
    reason: textual_variant
    text: Beneficial and gentle for us follows the working Greek and Athos. Sinaiticus3.3 first hand has
      a difficult spelling of the same words, while ca gives a different and difficult six-days/in-trouble
      reformulation. Vulgata printed6–7 has moderate and useful for us; Palatina printed15 has fitting
      and gentle for us. The working description remains, without adopting the corrected Sinaiticus reformulation.
      The Ethiopic edition’s Latin rendering printed115 remembers the final words and proceeds to the
      recital without a separate beneficial-and-gentle description.
  - marker: k
    reason: textual_variant
    text: The working Greek and Athos have invisible and mighty power; Vulgata printed7 has invisible
      power. Sinaiticus3.4 first hand has hon agapo, whom I love, where the working text has invisible,
      followed by difficult power/mighty forms; S1 and ca correct forms in that clause, but do not supply
      a new invisible word there. Palatina printed15 has omnia virtute sustentabili; its apparatus proposes
      alternatives including invisible as conjectures, not additional preserved manuscript words. The
      working reading is retained and the differences disclosed. D’Abbadie1860’s Latin rendering printed115
      has mercy and love, firmness of power and great wisdom instead of the working invisible phrase.
      This is a mediated versional reading, not reconstructed Greek.
  - marker: l
    reason: textual_variant
    text: The final promise retains if they keep God’s statutes received with great faith. Athos, Sinaiticus3.4
      and both printed Latin versions retain a final condition. The creation clauses, moving heavens/mountains/hills/seas,
      leveling for the elect, promised glory and joy, and received faith are all kept; the promise is
      not detached from its if-clause. The Ethiopic edition’s Latin rendering printed115 retains a final
      if about the Lord’s law received with great faith, but earlier describes arranging the cosmos to
      purify the elect and giving their hoped-for hope instead of the working moving/leveling and promise
      formulations.
lexical_decisions:
- source_word: ὑμᾶς
  chosen: you
  alternatives:
  - us (Sinaiticus ca reading)
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Correct imported source to the printed working edition; distinguish the real corrected Sinaiticus
    alternative.
- source_word: ἐπιστρέψῃς
  chosen: turn back your household
  alternatives:
  - turn your household
  - correct your household
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: The source identifies the household and wrongdoing; keep this verb distinct from repent.
- source_word: ἰάσεται
  chosen: will heal
  alternatives:
  - will cure
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Keep healing of all past household evils and the reason for Hermas’s ruin.
- source_word: πολυσπλαγχνία
  chosen: abundant compassion
  alternatives:
  - great compassion
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Retain the mercy already shown and the promised strengthening and foundation.
- source_word: ὁ λόγος ὁ καθημερινὸς ὁ δίκαιος
  chosen: the righteous word day by day
  alternatives:
  - the daily righteous word
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Preserve both daily recurrence and righteousness, together with every wickedness.
- source_word: ἐὰν μετανοήσωσιν
  chosen: if they repent
  alternatives:
  - if they change their disposition and conduct
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Keep the conditional, whole-heart language and the distinction from turning the household.
- source_word: βίβλους τῆς ζωῆς
  chosen: books of life
  alternatives:
  - book of life (Vulgata reading)
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Retain the Greek plural without harmonizing versions.
- source_word: τῶν ἁγίων
  chosen: the holy ones
  alternatives:
  - the saints
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Keep with the holy ones and disclose the versional difference.
- source_word: σύμφορα καὶ ἥμερα
  chosen: beneficial and gentle
  alternatives:
  - useful and mild
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Describe the remembered last words without adopting a different corrector’s reformulation.
- source_word: Θεὸς τῶν δυνάμεων
  chosen: God of hosts
  alternatives:
  - God of the powers
  - God of armies
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Translate the source title and preserve the creation recital.
- source_word: ἀοράτῳ δυνάμει καὶ κραταιᾷ
  chosen: invisible and mighty power
  alternatives:
  - unseen and mighty power
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Retain the working Greek while disclosing the substantive Sinaiticus difference.
- source_word: ἐκκλησία
  chosen: church
  alternatives:
  - assembly
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Keep the holy church’s creation and blessing without expanding its identity.
- source_word: νόμιμα
  chosen: statutes
  alternatives:
  - ordinances
  - commandments
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Preserve the explicit final condition and received faith.
