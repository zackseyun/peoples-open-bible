  text: For they were conducting either child-killing rites, or secret mysteries, or frenzied revelries with strange customs,
translation:
  language: ko
  text: 이는 그들이 아이를 죽이는 의례를 행하거나, 은밀한 비의를 거행하거나, 낯선 관습에 따른 광란의 향연을 벌였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεκνοφόνους τελετάς
  english_pob_choice: child-killing rites
  chosen_korean: 아이를 죽이는 의식
  alternatives_korean:
  - 아동 살해 의식
  - 자녀 살해 의례
  lexicon: τελετή
  rationale: τελετάς는 종교적·의례적 행위를 가리키므로 ‘의식’으로 옮기고, τεκνοφόνους는 직설적으로 ‘아이를 죽이는’으로 살려 윤리적 충격을 유지했습니다.
- source_word: κρύφια μυστήρια
  english_pob_choice: secret mysteries
  chosen_korean: 비밀스러운 신비 의식
  alternatives_korean:
  - 은밀한 신비
  - 비밀 신비례
  lexicon: μυστήριον
  rationale: μυστήρια는 단순한 비밀이 아니라 비의적·종교적 ‘신비 의식’의 뉘앙스가 있어, ‘비밀스러운’과 결합해 중복 없이 의미를 드러냈습니다.
- source_word: ἐμμανεῖς ἐξάλλων θεσμῶν κώμους ἄγοντες
  english_pob_choice: frenzied revelries with strange customs
  chosen_korean: 낯선 관습을 따른 광란의 축제를 벌였습니다
  alternatives_korean:
  - 이상한 규례를 따르는 광란의 연회를 열었습니다
  - 기이한 법도에 따른 흥청거림을 벌였습니다
  lexicon: θεσμός
  rationale: θεσμῶν은 제도·관습·규례의 뜻이므로 문맥상 자연한 ‘관습’으로 옮겼고, κώμους ἄγοντες는 ‘축제를 벌였습니다’로 처리해 방탕한 향연의 성격을 살렸습니다.
theological_decisions:
- issue: 문장의 윤리적 강도와 의례적 성격
  chosen_reading: 이 구절은 단순한 나쁜 행위 열거가 아니라 우상숭배에 결부된 잔혹한 제의와 광란의 향연을 함께 고발하는 문장으로 읽었습니다.
  alternative_readings:
  - 일반적 도덕적 타락의 목록으로만 읽는 해석
  - 종교적 제의성은 약화하고 사회적 일탈로만 보는 해석
  rationale: τελεταί와 μυστήρια가 모두 종교적 맥락을 강하게 띠므로, 번역에서도 의례성과 죄의 심각성을 함께 드러내야 합니다.
  doctrine_reference: Wisdom of Solomon의 우상숭배 비판 문맥
- issue: ἐξάλλων θεσμῶν의 처리
  chosen_reading: ‘낯선 관습’은 문자적 낯섦뿐 아니라 이방적·비정상적 제의 관행이라는 뉘앙스를 유지합니다.
  alternative_readings:
  - ‘이상한 법도’로 옮겨 제도적 느낌을 강하게 주는 읽기
  - ‘기이한 규례’로 옮겨 경건한 법규처럼 들릴 위험이 있는 읽기
  rationale: English POB가 ‘strange customs’를 택한 점을 따라, 과도한 교회용어화 없이 원문의 이방성·비정상성을 보존했습니다.
  doctrine_reference: 우상숭배와 이방 제의에 대한 지혜문학적 경고
