id: RUT.1.10
reference: Ruth 1:10
source:
  edition: WLC
  text: וַ/תֹּאמַ֖רְנָה לָּ֑/הּ כִּי אִתָּ֥/ךְ נָשׁ֖וּב לְ/עַמֵּֽ/ךְ־־׃
translation:
  text: But they said to her, “No, we will return with you to your people.”
  philosophy: dynamic
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  chosen: But they said
  alternatives:
  - And they said
  lexicon: HALOT
  rationale: The waw-consecutive on אמר advances the narrative. English can render this as either 'and' or 'but'; 'but' best reflects the contrast with Naomi's urging in the immediate context, while still preserving the basic speech-introduction sense of the verb.
- source_word: לָּהּ
  chosen: to her
  lexicon: HALOT
  rationale: The preposition ל with 3fs suffix straightforwardly marks the indirect object, referring to Naomi.
- source_word: כִּי
  chosen: 'No'
  alternatives:
  - surely
  - indeed
  - for
  lexicon: HALOT
  rationale: Although כִּי often means 'for' or marks assertion, in direct speech after a negative-response context it can introduce emphatic contradiction/insistence. Rendering it as 'No' brings out the daughters-in-law's refusal of Naomi's request in natural English. The more literal connective force is preserved in the footnote alternative.
- source_word: אִתָּךְ
  chosen: with you
  lexicon: HALOT
  rationale: The preposition with 2fs suffix indicates accompaniment with Naomi.
- source_word: נָשׁוּב
  chosen: we will return
  alternatives:
  - we will go back
  lexicon: HALOT
  rationale: שׁוּב commonly means 'return' or 'turn back.' 'Return' preserves the lexical connection to the repeated motif in Ruth 1, where the same root is prominent.
- source_word: לְעַמֵּךְ
  chosen: to your people
  alternatives:
  - to your kin
  - to your nation
  lexicon: HALOT
  rationale: עַם here refers to Naomi's ethnic/community people rather than merely close family. 'Your people' is the most natural and contextually accurate rendering in English.
