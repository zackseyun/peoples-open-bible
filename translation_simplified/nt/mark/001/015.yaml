translation:
  language: en
  text: Jesus said, “The appointed time has come, and the kingdom of God[a] is near. Repent[c] and believe in the good news[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the reign of God.”
    reason: lexical_alternative
  - marker: b
    text: Or, “believe in the gospel.”
    reason: lexical_alternative
  - marker: c
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
