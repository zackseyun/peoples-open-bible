  from: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
  to: except Caleb son of Jephunneh. He shall see it, and I will give him and his descendants the land he walked on, because he has followed Yahweh wholeheartedly.”
  rationale: The documented preference for 'sons' acknowledged the broader inheritance sense, which I bring into the main text as 'descendants.' I also retain the earlier recognition that 'fully followed' is an idiom for wholehearted loyalty.
