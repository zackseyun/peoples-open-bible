  - 전통적 성취 해석을 본문에 직접 반영하는 방식
  rationale: 히브리어 본문 자체가 말하는 이미지를 보존해야 하므로, 메시아적 성취는 본문을 바꾸지 말고 교차참조로 드러내는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 정경적 성취는 주해와 각주로 처리
