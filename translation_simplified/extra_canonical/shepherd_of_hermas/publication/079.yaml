base_translation:
  text: 'In the middle of the plain he showed me a great white rock rising from the plain. The rock was
    higher than the mountains and square, large enough to hold the whole world.[a]


    2. That rock was old and had a gate cut into it. The cutting of the gate seemed recent to me. The
    gate shone more brightly than the sun, so that I marveled at its brilliance.


    3. Twelve virgins stood around the gate. The four standing at the corners seemed more glorious to
    me, though the others were glorious too. They stood on the gate’s four sides, with two virgins between
    each pair of them.[d]


    4. They wore linen tunics and were neatly belted, with their right shoulders bare, as if about to
    carry a load. They were ready like this, very cheerful and eager.[b]


    5. After seeing this, I marveled within myself that I was seeing such great and glorious things. Again
    I was puzzled about the virgins: though so delicate, they stood courageously, as if about to carry
    the whole heaven.


    6. The shepherd said to me, “Why do you reason and puzzle over things within yourself and bring sorrow
    on yourself? Do not attempt what you cannot understand as though you were wise. Ask the Lord instead,
    so that you may receive understanding to comprehend it.”[c][e]


    7. “You cannot see what is behind you, but you see what is before you. Leave alone what you cannot
    see, and do not torment yourself. Master what you do see, and do not pry into the rest. I will explain
    to you everything I show you. So look at what comes next.”'
