  simplified_phrase: The rest of humanity—those who were not killed by these plagues
  preserved_meaning: The collective group consists of the human beings who survived the plagues.
  reasoning_layer_used: POB lexical and theological decisions on οἱ λοιποὶ τῶν ἀνθρώπων
  rationale: The dash separates the identifying clause without changing humanity's generic collective sense.
- pob_phrase: the idols of gold and silver and bronze and stone and wood, which can neither see nor hear nor walk
  simplified_phrase: idols made of gold, silver, bronze, stone, and wood. These idols cannot see, hear, or walk
  preserved_meaning: The material list and the threefold mockery of powerless idols remain intact.
  reasoning_layer_used: POB lexical decisions on the idol materials and περιπατεῖν
  rationale: Two sentences make the long description easier to follow while retaining its cumulative force.
