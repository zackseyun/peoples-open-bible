  text: You care for the earth and water it; you greatly enrich it. The river of God[a] is full of water; you prepare their grain[b], for this is how you prepare the earth.
  footnotes:
  - marker: a
    text: Or 'stand in awe because of your signs.' The Hebrew verb can express fear, dread, or reverent awe.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the outgoings of morning and evening.' The phrase poetically refers to dawn and dusk, or to the places/times where morning and evening emerge.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 땅을 돌보시고 물을 대시어 그것을 크게 풍성하게 하시나이다. 하나님의 시내[a]는 물이 가득하며, 주께서 그들의 곡식을 마련하시나이다[b]. 이는 주께서 이처럼 땅을 마련하시기 때문이니이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하나님의 물줄기' 또는 '하나님의 수로.' 히브리어 표현은 시적이며, 비와 풍요의 하늘 근원을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들의 곡식을 공급하시나이다' 또는 '그들의 곡식을 세우시나이다.' 히브리어 동사는 '마련하다', '준비하다', '세우다'를 뜻할 수 있습니다.
    reason: lexical_alternative
