base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/074.yaml
  text: He said[1], "Lord, there are many around the drinking trough[3][2], but there is nothing in the well."
  footnotes:
  - marker: '1'
    text: The text reads ⲡⲉϫⲁϥ ϫⲉ ⲡϫⲟⲉⲓⲥ ('He said, "Lord..."'). It is unclear whether Jesus is addressing God, or a disciple is addressing Jesus. Some scholars suggest it may be a continuation of Saying 73.
    reason: textual_variant
  - marker: '2'
    text: 'Coptic ⲧϫⲱⲧⲉ (Crum 792b: well, cistern). Translated here as ''drinking trough'' to distinguish it from the following word for well (ⲧϣⲱⲛⲉ).'
    reason: lexical_alternative
  - marker: '3'
    text: Coptic ⲗⲁⲁⲩ can mean 'anything' or 'anyone'. The phrase could also be translated 'there is no one in the well,' which would shift the metaphor from a lack of water to a lack of people willing to go deep.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다[1]. “주님, 물 마시는 구유[2] 주위에는 많은 이들이 있지만, 우물에는 아무것도 없습니다[3].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 본문은 ‘그가 말했다’와 호격 ‘주님’을 함께 두므로, 누가 누구에게 말하는지 확정하지 않습니다. 따라서 화자가 하나님께 말하는지, 제자가 예수께 말하는지는 알 수 없습니다.
    reason: textual_variant
  - marker: '2'
    text: 콥트어 ⲧϫⲱⲧⲉ는 ‘우물, 저수조’ 등의 뜻 범위를 가질 수 있습니다. 여기서는 뒤의 ⲧϣⲱⲛⲉ(‘우물’)와 구별하기 위해 ‘물 마시는 구유’로 옮겼습니다.
    reason: lexical_alternative
  - marker: '3'
    text: 콥트어 ⲗⲁⲁⲩ는 부정문에서 ‘아무것도’ 또는 ‘아무도’를 뜻할 수 있습니다. 따라서 ‘우물에는 아무도 없습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡϫⲟⲉⲓⲥ
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  lexicon: Crum 783a
  rationale: 콥트어 정관사형 호격을 살려 예수나 하나님을 특정하지 않고, 문맥상의 호칭으로 ‘주님’을 유지했습니다.
- source_word: ⲧϫⲱⲧⲉ
  english_pob_choice: drinking trough
  chosen_korean: 물통
  alternatives_korean:
  - 물마시는 통
  - 우물
  - 저수조
  lexicon: Crum 792b
  rationale: 영어 POB가 구분한 표층의 gathering place라는 대비를 한국어로 과도하게 해석하지 않으면서, 뒤의 ‘우물’과 구별되는 가까운 생활용어로 옮겼습니다.
- source_word: ⲧϣⲱⲛⲉ
  english_pob_choice: well
  chosen_korean: 우물
  alternatives_korean:
  - 샘
  - 저수조
  - 구덩이
  lexicon: Crum 572a
  rationale: 바로 앞의 ⲧϫⲱⲧⲉ와 의미를 달리하는 깊은 물의 원천을 가리키므로, 일반적으로 이해되는 ‘우물’로 번역했습니다.
- source_word: ⲗⲁⲁⲩ
  english_pob_choice: nothing
  chosen_korean: 아무것도
  alternatives_korean:
  - 아무도
  lexicon: Crum 147b
  rationale: 부정 존재사와 결합한 ⲗⲁⲁⲩ는 문맥상 ‘아무것도’가 가장 자연스럽고, 영어 POB가 주석한 ‘아무도’ 가능성은 본문에 남기지 않고 주석으로만 반영했습니다.
theological_decisions:
- issue: 발화 주체와 수신자 표지의 모호성
  chosen_reading: 「그가 말했습니다.」로 두고, 인용문 안의 호칭은 ‘주님’으로 유지했습니다.
  alternative_readings:
  - 「주님이 말씀하셨습니다」
  - 발화자를 예수나 제자로 특정하기
  rationale: 콥트어 본문은 ‘그가 말했다’와 호격 ‘주님’을 함께 두어 발화 관계를 확정하지 않으므로, 영어 POB의 모호성을 보존했습니다.
  doctrine_reference: 본문 비확정성 보존 원칙
- issue: ‘우물에는 아무것도 없습니다’의 상징성
  chosen_reading: 물의 결핍으로 읽되, 인물의 결핍으로 바꾸지 않았습니다.
  alternative_readings:
  - ‘우물에는 아무도 없습니다’
  rationale: 콥트어 ⲗⲁⲁⲩ는 문법적으로 ‘아무도’도 가능하지만, 현재 문맥의 일차 의미는 물의 부재이므로 은유를 과도하게 인간 중심으로 전환하지 않았습니다.
  doctrine_reference: 문맥 우선 해석 원칙
