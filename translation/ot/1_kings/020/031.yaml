translation:
  text: His servants said to him, “We have heard that the kings of Israel are merciful. Please let us put sackcloth around our waists and ropes on our heads[a] and go out to the king of Israel. Perhaps he will spare your life.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Sackcloth and ropes signaled humiliation and submission.
    reason: cultural_note
