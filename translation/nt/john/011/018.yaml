id: JHN.11.18
reference: John 11:18
source:
  edition: SBLGNT
  text: ἦν δὲ ⸀ἡ Βηθανία ἐγγὺς τῶν Ἱεροσολύμων ὡς ἀπὸ σταδίων δεκαπέντε.
translation:
  text: Bethany was near Jerusalem, about two miles[a] away.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “fifteen stadia,” roughly three kilometers.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  chosen: Now
  alternatives:
  - and
  - but
  lexicon: BDAG
  rationale: 'δέ is a mild connective here, advancing the narrative rather than marking strong contrast. ''Now'' gives natural English discourse flow without overstating contrast. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: Βηθανία
  chosen: Bethany
  rationale: Proper place name; transliterated according to standard English convention, in keeping with the policy to transliterate names.
- source_word: ἐγγὺς
  chosen: near
  alternatives:
  - close to
  lexicon: BDAG
  rationale: ἐγγύς denotes spatial nearness. 'Near' is the most natural and concise English equivalent here.
- source_word: Ἱεροσολύμων
  chosen: Jerusalem
  rationale: Standard English rendering of the place name Ἱεροσόλυμα.
- source_word: ὡς
  chosen: about
  alternatives:
  - approximately
  - some
  lexicon: BDAG
  rationale: With a measure expression, ὡς marks approximation. 'About' is idiomatic and preserves the non-exact sense.
- source_word: ἀπὸ σταδίων δεκαπέντε
  chosen: fifteen stadia away
  alternatives:
  - about two miles away
  - fifteen stadia from it
  lexicon: BDAG
  rationale: στάδιον is an ancient unit of distance. Retaining 'stadia' preserves the source-culture measure more formally, while 'away' brings out the spatial sense implied by ἀπό. A modern equivalent is worth preserving in a footnote rather than replacing the source unit in the main text.
