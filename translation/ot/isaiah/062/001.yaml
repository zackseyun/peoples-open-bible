    prior_rendering: I will not be quiet
    new_rendering: I will not rest
    rationale: The verb includes remaining inactive or at rest, not only remaining silent; this wording also connects naturally with the unceasing appeal in verses 6–7.
  - source_phrase: עַד יֵצֵא כַנֹּגַהּ צִדְקָהּ
    prior_rendering: until her righteousness goes out like brightness
    new_rendering: until her righteousness shines brightly
    rationale: The image means that Zion’s righteousness becomes radiantly visible; the new wording carries that image without an unnatural English movement expression.
  - source_phrase: וִישׁוּעָתָהּ כְּלַפִּיד יִבְעָר
