id: NUM.18.19
reference: Numbers 18:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: ko
  text: 이스라엘 자손이 주께 드리는[a] 거룩한 것들의 모든 헌물은 내가 너와, 너와 함께 있는 네 아들들과 네 딸들에게 영원한 규례로 주었습니다. 그것은 주 앞에서 너와 너와 함께 있는 네 후손에게 영원한 소금 언약입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘들어 올리는’이며, 제의적 봉헌 행위를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: תְּרוּמֹת
  english_pob_choice: contributions
  chosen_korean: 헌물
  alternatives_korean:
  - 기여물
  - 봉헌물
  - 드리는 것
  lexicon: תרומה
  rationale: התרומה는 ‘들어 올려 바치는 예물’의 성격이 있으므로, 출처의 제의적 맥락을 살리면서도 현대 한국어에서 자연스러운 ‘헌물’로 옮겼습니다.
- source_word: יָרִימוּ
  english_pob_choice: lift up
  chosen_korean: 드리는
  alternatives_korean:
  - 들어 올리는
  - 바치는
  - 올려 드리는
  lexicon: רום
  rationale: English POB의 ‘lift up’를 그대로 반영하되, 한국어에서는 제의적 의미가 분명한 ‘드리는’이 문맥상 가장 자연스럽고 오해가 적습니다.
- source_word: בְּרִית מֶלַח
  english_pob_choice: a covenant of salt
  chosen_korean: 소금 언약
  alternatives_korean:
  - 소금의 언약
  - 소금으로 맺은 언약
  - 소금처럼 영구한 언약
  lexicon: ברית
  rationale: 관용적 표지인 ‘소금 언약’을 직역형으로 유지해 언약의 지속성과 불변성을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 주
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: יהוה
  rationale: 현행 POB의 영어 본문이 LORD로 정리되어 있어, 한국어 본문에서는 주님의 호칭으로 자연스럽게 옮기되, 본문 내부의 인칭·제의적 호칭 일관성을 유지했습니다.
theological_decisions:
- issue: תְּרוּמֹת הַקֳּדָשִׁים의 제의적 범위
  chosen_reading: ‘거룩한 것들의 모든 헌물’로 옮겨, 단순한 일반 헌금이 아니라 성소 관련 봉헌물을 가리키는 범위를 보존했습니다.
  alternative_readings:
  - ‘거룩한 것들의 기여물’
  - ‘성물의 모든 헌물’
  rationale: 문맥상 아론과 그의 자손에게 주어지는 제의적 몫이므로, 일반적인 후원 개념으로 약화하지 않고 성물 관련 언약 조항으로 읽히게 했습니다.
  doctrine_reference: 민수기 18장 제사장 몫 규정
- issue: בְּרִית מֶלַח עוֹלָם의 지속성
  chosen_reading: ‘영원한 소금 언약’으로 옮겨 언약의 영속성을 직접 보존했습니다.
  alternative_readings:
  - ‘소금의 영원한 언약’
  - ‘영원히 지속되는 소금 언약’
  rationale: 소금은 부패 방지와 보존의 상징이므로, 이를 설명적으로 풀기보다 본문 표현 자체를 살려 언약의 불변성을 강조했습니다.
  doctrine_reference: 언약의 영속성
