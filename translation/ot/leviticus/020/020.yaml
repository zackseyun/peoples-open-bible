  from: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
  to: If a man lies with his uncle's wife, he has violated his uncle's marriage[a]. Both of them shall bear their sin; they shall die childless.
