  - serve the restored people of God represented by the city
  rationale: The immediate context addresses Zion/Jerusalem in the feminine singular. The translation preserves the direct address rather than resolving the imagery into a theological abstraction.
  doctrine_reference: Preserve theological tension rather than resolve it.
