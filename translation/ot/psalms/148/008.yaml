id: PSA.148.8
reference: Psalms 148:8
source:
  edition: WLC
  text: אֵ֣שׁ וּ֭/בָרָד שֶׁ֣לֶג וְ/קִיט֑וֹר ר֥וּחַ סְ֝עָרָ֗ה עֹשָׂ֥ה דְבָרֽ/וֹ׃
translation:
  text: lightning[a] and hail, snow and mist[b], stormy wind carrying out his command,
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “fire.”
    reason: lexical_alternative
  - marker: b
    text: Or “smoke”; the Hebrew word can refer to rising vapor or smoke.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵשׁ
  chosen: fire
  alternatives:
  - flame
  lexicon: HALOT
  rationale: The noun straightforwardly denotes fire. 'Fire' is the natural English equivalent in this creation-praise list.
- source_word: וּבָרָד
  chosen: and hail
  lexicon: HALOT
  rationale: בָּרָד denotes hail; the prefixed conjunction is carried over as 'and.'
- source_word: שֶׁלֶג
  chosen: snow
  lexicon: HALOT
  rationale: Standard gloss for the noun in a meteorological sequence.
- source_word: וְקִיטוֹר
  chosen: and vapor
  alternatives:
  - and smoke
  - and mist
  lexicon: HALOT
  rationale: קִיטוֹר can denote vapor, smoke, or exhalation. In parallel with hail and snow in a list of atmospheric phenomena, 'vapor' best preserves the broad meteorological sense without over-specifying combustion ('smoke').
- source_word: רוּחַ סְעָרָה
  chosen: stormy wind
  alternatives:
  - tempest
  - windstorm
  lexicon: HALOT
  rationale: The construct-like pairing expresses a wind characterized by סערה, i.e., a storm or tempest. 'Stormy wind' is idiomatic and preserves both elements.
- source_word: עֹשָׂה
  chosen: carrying out
  alternatives:
  - fulfilling
  - performing
  lexicon: HALOT
  rationale: With דְבָרוֹ, the participle denotes carrying out what has been spoken or commanded.
- source_word: דְבָרוֹ
  chosen: his command
  alternatives:
  - his command
  lexicon: HALOT
  rationale: Although literally “his word,” in this context it is the directive executed by the storm wind; the literal expression is retained in the footnote.
