translation:
  text: and to remember the lawless killing of innocent infants and the blasphemies committed against his name, and to show his hatred of evil[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “to hate wickedness.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  chosen: to remember
  alternatives:
  - to call to mind
  - to be mindful of
  lexicon: BDAG
  rationale: Aorist infinitive of μιμνῄσκομαι/μιμνήσκομαι used in a petition sequence; 'to remember' is the plain and natural English equivalent.
- source_word: ἀναμαρτήτων
  chosen: innocent
  alternatives:
  - sinless
  - guiltless
  lexicon: LSJ
  rationale: Literally 'without sin,' but in idiomatic English for murdered children 'innocent' best conveys moral blamelessness without overstating a doctrinal claim about absolute sinlessness.
- source_word: νηπίων
  chosen: infants
  alternatives:
  - children
  - babes
  lexicon: LSJ
  rationale: νηπίοι are very young children; 'infants' fits the pathos and likely age reference better than the broader 'children.'
- source_word: παρανόμου
  chosen: lawless
  alternatives:
  - illegal
  - wicked
  lexicon: LSJ
  rationale: The adjective stresses violation of law and justice; 'lawless' preserves that force better than the modern-sounding 'illegal' or the broader 'wicked.'
- source_word: ἀπωλίας
  chosen: destruction
  alternatives:
  - slaughter
  - ruin
  lexicon: LSJ
  rationale: The noun can denote destruction or ruin; in context of killing infants, 'destruction' is faithful and grave. 'Slaughter' is interpretive and more vivid than the Greek requires, though context implies lethal violence.
- source_word: βλασφημιῶν
  chosen: blasphemies
  alternatives:
  - slanders
  - insults
  lexicon: LSJ
  rationale: Because the object is 'his name,' the religious sense 'blasphemies' is most appropriate and preserves the theological weight of the offense.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  chosen: against his name
  alternatives:
  - concerning his name
  - directed at his name
  lexicon: LSJ
  rationale: In this hostile context, εἰς with 'name' is well represented by 'against his name,' making explicit the adversative force in idiomatic English.
- source_word: μισοπνηρῆσαι
  chosen: to come to hate evil
  alternatives:
  - to hate evil
  - to abhor wickedness
  lexicon: LSJ
  rationale: This rare verb means to hate evil/wickedness. 'To come to hate evil' reflects the ingressive sense naturally following the remembered atrocities as motivation, while remaining readable.
