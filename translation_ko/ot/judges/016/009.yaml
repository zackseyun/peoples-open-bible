source:
  edition: WLC
  text: וְ/הָ/אֹרֵ֗ב יֹשֵׁ֥ב לָ/הּ֙ בַּ/חֶ֔דֶר וַ/תֹּ֣אמֶר אֵלָ֔י/ו פְּלִשְׁתִּ֥ים עָלֶ֖י/ךָ שִׁמְשׁ֑וֹן וַ/יְנַתֵּק֙ אֶת הַ/יְתָרִ֔ים כַּ/אֲשֶׁ֨ר יִנָּתֵ֤ק פְּתִֽיל הַ/נְּעֹ֨רֶת֙ בַּ/הֲרִיח֣/וֹ אֵ֔שׁ וְ/לֹ֥א נוֹדַ֖ע כֹּחֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/009.yaml
  text: Now the ambush was waiting for her in the inner room, and she said to him, “Philistines are upon you, Samson!” But he snapped the cords as a thread of tow snaps when it smells fire, and his strength was not discovered.
translation:
  language: ko
  text: 내실에는 그녀를 위해 매복해 있던 자가 앉아 있었습니다.[a] 그러자 그녀가 그에게 말했습니다. 「블레셋 사람들이 당신에게 들이닥쳤습니다, 삼손!」 그러나 그는 그 줄들을 불 냄새를 맡으면 끊어지는 삼의 실처럼 끊어 버렸습니다.[b] 그의 힘은 드러나지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לָהּ는 여성 단수 대명사이며, 문맥상 들릴라를 가리킵니다. 전치사 לְ는 ‘그녀를 위해’ 또는 ‘그녀에게 속하여/그녀와 함께’처럼 관계를 폭넓게 나타낼 수 있습니다.
    reason: source_note
  - marker: b
    text: 히브리어는 삼의 실이 불 냄새를 맡을 때 끊어지는 모습을 비유로 듭니다. 이는 불에 이미 탄 실을 뜻하지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: וְהָאֹרֵב יֹשֵב לָהּ בַּחֶדֶר
  english_pob_choice: Now the ambush was waiting for her in the inner room
  chosen_korean: 그리고 매복한 자는 내실에 그를 기다리고 있었습니다
  alternatives_korean:
  - 그리고 매복한 자는 내실에서 그녀를 기다리고 있었습니다
  - 그리고 복병이 방 안에서 그녀를 기다리고 있었습니다
  lexicon: אֹרֵב
  rationale: אֹרֵב은 단순한 ‘매복’ 상황의 사람을 가리키므로, 사건의 주체성을 살려 ‘매복한 자’로 옮겼습니다. POB의 ‘for her’는 히브리어 לָהּ의 방향격을 반영한 것으로 보이며, 문맥상 대상 지시가 불분명하여 그대로 다소 중립적으로 처리했습니다.
- source_word: פְּלִשְׁתִּים עָלֶיָך שִׁמְשׁוֹן
  english_pob_choice: Philistines are upon you, Samson!
  chosen_korean: 「블레셋 사람들이 당신에게 들이닥쳤습니다, 삼손!」
  alternatives_korean:
  - 「블레셋 사람들이 당신 위에 있습니다, 삼손!」
  - 「블레셋 사람들이 당신에게 달려들었습니다, 삼손!」
  lexicon: פְּלִשְׁתִּים / עָלֶיךָ
  rationale: ‘are upon you’의 공격적 도착성을 한국어에서 자연스럽게 드러내기 위해 ‘들이닥쳤습니다’를 선택했습니다. 고유명은 통용 표기인 ‘블레셋’과 ‘삼손’을 유지했습니다.
- source_word: וַיְנַתֵּק אֶת־הַיְתָרִים כַּאֲשֶׁר יִנָּתֵק פְּתִיל הַנְּעֹרֶת בַּהֲרִיחוֹ אֵשׁ
  english_pob_choice: But he snapped the cords as a thread of tow snaps when it smells fire
  chosen_korean: 그는 새끼줄을 불에 탄 삼실처럼 끊어 버렸습니다
  alternatives_korean:
  - 그는 줄들을 불 냄새를 맡으면 끊어지는 삼실처럼 끊어 버렸습니다
  - 그는 끈들을 불에 가까이 가면 끊어지는 삼실처럼 끊어 버렸습니다
  lexicon: יְתָרִים / פְּתִיל הַנְּעֹרֶת
  rationale: 문맥의 ‘cords’를 한국어의 일반적인 ‘새끼줄’로 옮겨 끊어짐의 물성을 살렸습니다. פְּתִיל הַנְּעֹרֶת은 POB의 ‘thread of tow’를 따라 ‘삼실’로 처리하되, 관용적으로 이해되도록 ‘불에 탄’으로 이미지 효과를 보강했습니다.
- source_word: וְלֹא נוֹדַע כֹּחוֹ
  english_pob_choice: and his strength was not discovered
  chosen_korean: 그의 힘은 드러나지 않았습니다
  alternatives_korean:
  - 그의 힘은 알려지지 않았습니다
  - 그의 힘은 드러나지 않은 채였습니다
  lexicon: נוֹדַע
  rationale: נוֹדַע는 단순한 ‘알려지다’보다 ‘드러나다/밝혀지다’의 뉘앙스가 있어, POB의 ‘not discovered’를 한국어 자연문으로 풀어 ‘드러나지 않았습니다’로 옮겼습니다.
theological_decisions:
- issue: 매복한 자의 위치와 대상 지시
  chosen_reading: ‘לָהּ’의 지시를 엄밀히 드러내지 않고 ‘그를 기다리고 있었습니다’로 번역해, 장면의 긴장과 서술 흐름을 유지했습니다.
  alternative_readings:
  - ‘그녀를 기다리고 있었습니다’
  - ‘그에게서 그녀를 노리고 있었습니다’
  rationale: 히브리어 대명사 지시가 문맥상 다소 불명확하므로, 본문이 명시하는 공격의 순간에 초점을 맞추는 번역이 가장 안전합니다.
  doctrine_reference: 문법·담화 결정
