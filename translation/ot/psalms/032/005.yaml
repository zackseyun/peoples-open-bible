  from: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
  to: I made my sin known to you, and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave[a] the guilt of my sin. Selah
