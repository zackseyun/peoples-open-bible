translation:
  text: '“The eleventh mountain had trees full of fruit, adorned with many different kinds of fruit. The
    believers from that mountain are like this:


    2. “They suffered for the name of the Son of God.[a] They suffered willingly, with all their hearts,
    and gave up their lives.”


    3. “Sir,” I say, “all the trees bear fruit. Why are some of their fruits more beautiful?[b]” He says,
    “Listen. God honors everyone who has suffered for the name. All their sins have been taken away because
    they suffered for the name of the Son of God. Now hear why their fruits differ and some are better
    than others.”


    4. “Some were brought before the authorities and questioned. They did not deny but suffered willingly.
    The Lord honors them even more. Their fruit is the best. Others became afraid and hesitated. They
    wondered whether to deny or confess, but they still suffered. Their fruits are smaller because that
    thought arose in their hearts. It is an evil thought for a servant to deny their own master.”


    5. “If you are thinking this way, take care. Do not let the thought stay in your hearts, or you may
    die to God. You who suffer for the name must glorify God. God considered you worthy to bear this name
    and to have all your sins healed.”


    6. “So count yourselves blessed.[c] Yet when one of you suffers for God, you think you have done something
    great. The Lord gives you life, but you do not understand. Your sins weighed you down. If you had
    not suffered for the name of the Lord,[d] you would have died to God because of your sins.”


    7. “I say this to you who hesitate between denial and confession. Confess that you have a Lord. If
    you deny him, you may be handed over to prison.”


    8. “If the nations punish their servants when one denies their own master, what do you think the Lord
    will do to you? He has authority over all. Remove these thoughts from your hearts so that you may
    live to God forever.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: “Of the Son of God” is bracketed in the printed Greek here. It is translated as part of the
      working edition, without claiming those words are unbracketed surviving Athos text.
  - marker: b
    reason: textual_variant
    text: “More beautiful” follows the working edition’s conjectural εὐειδέστεροι, compared in its apparatus
      with Latin Vulgata, Palatina and Ethiopic. Athos is reported as ἀηδέστεροι, “more unpleasant.” This
      remains an edition-mediated selection, not fresh manuscript collation.
  - marker: c
    reason: textual_variant
    text: The beginning of this sentence is partly supplied by Gebhardt in damaged Greek. “So count yourselves
      blessed” takes μακαρίζετε as an imperative. The warning that follows contrasts life as the Lord’s
      gift with taking credit for a great deed; the restoration is not all preserved manuscript lettering.
  - marker: d
    reason: textual_variant
    text: “Of the Lord” is bracketed in the printed source. The source’s healing, removal of sins and
      gift-of-life language is retained without replacing it with a later theory of merit or atonement.
lexical_decisions:
- source_word: κύριε / Κύριε
  chosen: Sir
  alternatives:
  - Lord
  - Master
  rationale: Respectful dialogue address to the shepherd, distinct from the Lord referred to in the teaching.
- source_word: παρέδωκαν τὰς ψυχὰς αὐτῶν
  chosen: gave up their lives
  alternatives:
  - handed over their souls
  rationale: Context is suffering before authorities, not a new account of the soul’s substance.
- source_word: ἁμαρτίαι ἰαθῶσιν / ζωὴν ... χαρίζεται
  chosen: sins healed / grants life
  alternatives:
  - sins forgiven / rewards with life
  rationale: Keep the source’s distinct healing and gift language; do not turn granting life into payment
    for suffering.
- source_word: τὰ ἔθνη / τοὺς δούλους
  chosen: the nations / their servants
  alternatives:
  - Gentiles / slaves
  rationale: Preserve the ancient master–servant analogy without presenting it as a new moral endorsement.
    The comparison concerns denial and accountability.
