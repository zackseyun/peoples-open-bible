    rationale: ‘<sup>a</sup>’와 문장 끝 ‘[a]’가 모두 같은 각주를 가리킵니다. 한 표지만 남기는 것이 일반적인 본문 형식에 맞습니다.
  revised_text: 그들은 또한 그들의 병기에 맞설 병기들을 만들고, 여러 날 동안 싸웠습니다.<sup>a</sup>
  revised_footnotes:
