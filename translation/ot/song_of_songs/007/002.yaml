  from: How beautiful are your feet in sandals[a], O noble daughter! The curves of your thighs are like jewels[b], the work of the hands of a master craftsman.
  to: How beautiful are your feet in sandals, noble daughter! The curves of your thighs[a] are like ornaments[b], the work of a skilled craftsman's hands.
  rationale: חֲלָאִים denotes crafted adornments/ornaments, so “jewels” can misleadingly identify the objects as gemstones. “Skilled craftsman” is an appropriate rendering of אָמָּן. The proposal correctly repairs the marker placement, but the real hip/thigh range of יָרֵךְ should not be silently lost.
