  lexicon: HALOT
  rationale: 시편의 탄식에서 결과 상태를 나타내는 완료적 뉘앙스를 살려, 단순 과거보다 ‘~이 되다’의 상태 진입을 반영했습니다.
- source_word: לְאֶחָ֑י
  english_pob_choice: to my brothers
  chosen_korean: 형제들에게는
  alternatives_korean:
  - 내 형제들에게는
  - 친족들에게는
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족 표현을 그대로 살리되, 한국어에서는 문맥상 ‘형제들’이 가장 직관적이어서 이렇게 옮겼습니다.
- source_word: לִבְנֵ֥י אִמִּֽ/י
  english_pob_choice: to my mother's sons
  chosen_korean: 어머니의 아들들에게는
  alternatives_korean:
  - 어머니의 아들들에게
  - 내 어머니에게서 난 아들들에게는
  - 친어머니의 아들들에게는
  lexicon: HALOT
  rationale: 직역에 가까운 히브리어 관용구를 유지하여, 혈연의 밀접함을 강조하는 시적 평행법을 보존했습니다.
theological_decisions:
- issue: 성별이 표시된 친족 표현의 처리
  chosen_reading: ‘형제들’과 ‘어머니의 아들들’을 본문에 유지했습니다.
  alternative_readings:
  - 형제자매들
  - 가족들
  rationale: 시의 평행 구조와 남성 복수 친족 표현을 지우지 않고, 원문의 관계적 긴장을 그대로 드러내는 쪽이 본문 충실도에 더 맞습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
