reference: Bel and the Dragon 1:13
source:
  edition: lxx-swete-1909
  text: αὐτοὶ δὲ κατεφρόνουν, ὅτι πεποιήκεσαν ὑπὸ τὴν τράπεζαν κεκρυμμένην εἴσοδον, καὶ διʼ αὐτῆς εἰσεπορεύοντο
  language: Greek
  pages:
