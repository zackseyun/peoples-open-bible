    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלֵי
  english_pob_choice: the tents of
  chosen_korean: 장막들
  alternatives_korean:
  - 천막들
  - 거처들
  lexicon: HALOT
  rationale: 히브리어는 אָהֶל의 복수 연계형으로 문자적으로는 ‘~의 장막들’입니다. 한국어에서는 관형격을 살려도 되지만, 시적 병렬에서 ‘에돔의 장막들’로 자연스럽게 옮기기보다 핵심 이미지인 ‘장막들’을 살려 구문을 유지했습니다.
- source_word: אֱדוֹם
  english_pob_choice: Edom
  chosen_korean: 에돔
  alternatives_korean:
  - 에돔 사람들
  - 에돔 족속
  lexicon: HALOT
  rationale: 고유명사이므로 음역을 따랐습니다. 이 구절의 나열 구조에서는 민족명보다 지명/집단명 자체를 보존하는 편이 원문 병렬성을 더 잘 드러냅니다.
- source_word: יִשְׁמְעֵאלִים
  english_pob_choice: the Ishmaelites
  chosen_korean: 이스마엘 사람들
  alternatives_korean:
  - 이스마엘족
  - 이스마엘 사람들
  lexicon: HALOT
  rationale: 히브리어 집단명은 한국어 성서 문맥에서 ‘~사람들’로 옮기면 가독성이 좋고, 원문의 민족 집단 의미도 유지됩니다. ‘이스마엘족’보다 덜 기술적이고 현대적인 표현입니다.
- source_word: הַגְרִים
  english_pob_choice: the Hagrites / the Hagarites
  chosen_korean: 하그리 사람들
  alternatives_korean:
  - 하그리족
  - 하갈 사람들
  lexicon: HALOT
  rationale: POB의 영어 선택이 ‘Hagrites’를 본문으로 두고 ‘Hagarites’를 대안으로 제시하므로, 한국어 본문은 자음형에 더 가까운 음역을 택하되 집단명임을 분명히 하기 위해 ‘사람들’을 붙였습니다. ‘하갈 사람들’은 어원 연결은 분명하지만 본문 형태와는 한 단계 더 해석적입니다.
