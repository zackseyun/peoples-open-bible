revisions:
- from: '그리고 이제 내가 너희에게 명령합니다, 내 자녀들아: 은을 사랑하지 말고, 여인들의 아름다움에 시선을 두지 마십시오. 나 또한 금과 아름다움 때문에 가나안 여자 베수에에게 유혹되어 빗나갔기 때문입니다.


    그리고 나는 이 두 가지 때문에 내 씨가 음행의 파멸로 이르게 될 것을 압니다. 그들은 내 아들들 가운데서도 지혜로운 사람들을 타락시킬 것이며, 주께서 내 아버지 야곱에게 순종한 대가로 내게 주신 유다의 왕국을 작아지게 할 것입니다.[a][b]'
