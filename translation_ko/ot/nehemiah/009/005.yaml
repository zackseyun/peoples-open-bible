- from: 레위 사람 곧 예수[a],kadmiel, 바니, 하스바냐, 세레브야, 호디야, 세바냐, 그리고 페다히야가 말하기를, "일어나서 영원부터 영원까지 너희 하나님 여호와를 찬송하라. 찬송과 감사보다 더 높으시고 찬송을 받으실 그 영광스러운 이름[b]을 찬송하라."
  to: 그때 레위 사람들, 곧 예수아[a], 갓미엘, 바니, 하삽느야, 세레뱌, 호디야, 스바냐, 브다히야가 말했습니다. 「일어나 영원부터 영원까지 여러분의 하나님 야훼를 찬송하십시오. 모든 찬송과 찬양 위에 높으신 주의 영광스러운 이름[b]에 찬송을 드립니다.」
  category: reader_text_correction
  rationale: 세 가지 문제가 겹쳐 있었습니다. 첫째, 이름 Kadmiel이 번역되지 않은 채 「,kadmiel」로 로마자 그대로, 띄어쓰기도 없이 남아 있었습니다. 「갓미엘」로 옮겼습니다. 둘째, Jeshua가 「예수」로 표기되어 있었는데, 한국어에서 「예수」는 단독으로 나사렛 예수를 가리키므로 독자를 심각하게 오도합니다. 통용 표기인 「예수아」로 바로잡았습니다. 셋째, 신명이 「여호와」로 되어 있어 용어집 기본값 「야훼」와 어긋났고, 종결 어미 「찬송하라」가 하라체여서 규정된 합쇼체와 맞지 않았습니다. 둘 다 정정했습니다.
