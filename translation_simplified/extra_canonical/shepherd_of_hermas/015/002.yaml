  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/002.yaml
  text: But those that fall into the fire and are burned—these are the ones who have finally turned away from the living God, and it no longer came up into their heart to repent because of the desires of their lewdness and the evils they have done.
translation:
  language: en
  text: But those who fall into the fire and are burned are those who have finally turned away from the living God. Because of their sexually immoral desires and the evil they have done, they no longer think of reorienting[r1].
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: these are the ones who have finally turned away from the living God
  simplified_phrase: are those who have finally turned away from the living God
  preserved_meaning: Their turning away from the living God is decisive and final in the stated sequence.
  reasoning_layer_used: POB controlling translation
  rationale: Retaining “finally” preserves the temporal and decisive force without implying total or irreversible apostasy.
translation_notes:
  risk_flags:
