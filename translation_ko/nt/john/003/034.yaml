id: JHN.3.34
reference: John 3:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
  footnotes:
  - marker: a
    text: Or, 'for he gives the Spirit without measure,' with 'he' understood as the one whom God sent.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님이 보내신 이는 하나님의 말씀을 전하십니다. 왜냐하면 하나님께서 성령을 한량없이 주시기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그분이 성령을 한량없이 주십니다”로 번역할 수 있습니다. 이 경우 ‘그분’은 하나님이 보내신 이를 가리키는 것으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  english_pob_choice: the one whom
  chosen_korean: 하나님이 보내신 이는
  alternatives_korean:
  - 하나님이 보내신 사람
  - 그(보내심을 받은 이)
  lexicon: BDAG / Johannine usage
  rationale: 그리스어의 관계대명사(목격격, 남성 단수)는 '보내신 이'의 실체를 가리키므로 한국어로는 '하나님이 보내신 이는'처럼 실질적 주어 형태로 옮겨 문장의 흐름을 살렸습니다.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  english_pob_choice: the words of God
  chosen_korean: 하나님의 말씀
  alternatives_korean:
  - 하나님의 말들
  - 하나님의 말씀들
  lexicon: BDAG
  rationale: ῥήματα는 '말씀·발화'의 복수형 어휘로서 '하나님의 말씀'이 자연스럽고 신학적으로도 적절한 한국어입니다.
- source_word: τὸ πνεῦμα
  english_pob_choice: the Spirit
  chosen_korean: 성령
  alternatives_korean:
  - 영
  - 영(성령)
  lexicon: BDAG / Johannine context
  rationale: 요한복음의 문맥에서 πνεῦμα는 일관되게 신적 영을 가리키므로 한국어로 '성령'이라 번역하는 것이 독자가 의미를 바로 파악하게 합니다.
- source_word: ἐκ μέτρου
  english_pob_choice: without measure
  chosen_korean: 한량없이
  alternatives_korean:
  - 측량 없이
  - 헤아림 없이
  - 아낌없이
  lexicon: BDAG / idiom
  rationale: 부정문과 결합된 관용구로 '한정·측정되지 않음'을 뜻하므로 전통적 한국어 어휘 '한량없이'를 선택했습니다(대체어들은 의미상 가능하나 어휘 느낌이 다릅니다).
theological_decisions:
- issue: Subject of δίδωσιν ('gives') — who gives the Spirit?
  chosen_reading: 하나님이 성령을 주신다(주어를 명시적으로 하나님으로 읽음).
  alternative_readings:
  - 보내심을 받은 이(아들)가 성령을 준다(주어를 아들로 이해).
  rationale: 문장 흐름과 이어지는 3:35(아버지가 아들에게 모든 것을 주심) 등 바로 뒤 문맥을 고려하면 '주다'의 주체를 하나님으로 읽는 편이 자연스럽습니다. 그러나 그리스어는 주어가 생략되어 두 독법이 모두 가능한 만큼 대안 해석은 각주로 남겨 원문상 긴장을 보존했습니다.
  doctrine_reference: 원문적 긴장 보존(교리적 결론을 강제하지 않음)
