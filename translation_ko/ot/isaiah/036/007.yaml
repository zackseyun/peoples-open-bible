revisions:
- from: “만일 당신이 내게 ‘우리는 야훼 우리 하나님을 신뢰한다’고 말한다면, 그것은 히스기야가 제거한 그분의 산당들과 그분의 제단들이 아니겠습니까? 그는 유다와 예루살렘에 ‘너희는 이 제단 앞에서 절하라’고 말했습니다.”[a]
  to: “그러나 만일 당신이 내게 ‘우리는 야훼 우리 하나님을 신뢰한다’고 말한다면, 히스기야가 그분의 산당들과 제단들을 없애고 유다와 예루살렘에 ‘너희는 이 제단 앞에서 절하라’고 말한 분이 바로 그분이 아니겠습니까?”
  rationale: 원문의 ‘그분—히스기야가 그의 산당들과 제단들을 없앤 분’이라는 관계절 구조를 한국어 수사 의문문으로 정확히 회복했습니다. ‘말한’은 원문의 단순 발화 동사를 과도하게 해석하지 않으면서, 뒤따르는 직접 인용과 자연스럽게 연결합니다. 불필요한 각주는 삭제했습니다.
