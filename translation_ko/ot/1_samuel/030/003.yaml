  - severity: low
    issue: ‘그것은’의 지시 대상
    rationale: 한국어에서는 ‘그 성읍은’으로 반복하는 편이 자연스럽고, 발견 장면의 초점도 분명해집니다.
  revised_text: 다윗과 그의 사람들이 그 성읍에 이르렀을 때, 보니 그 성읍은 불에 타 있었고, 그들의 아내들과 아들들과 딸들은 사로잡혀 있었습니다.
