theological_decisions:
- issue: Nature of δυνάμεις in Jesus' ministry
  chosen_reading: Rendered as "mighty works" rather than the more interpretive "miracles."
  alternative_readings:
  - miracles
  - works of power
  rationale: The verse refers to extraordinary acts evidencing divine power, but the Greek term itself emphasizes power/deeds. "Mighty works" preserves that nuance without reducing the term to a later technical category.
  doctrine_reference: Translation philosophy §1, §5
- issue: Context-sensitive reorientation terminology
  chosen_reading: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have reoriented toward God[b], sitting in sackcloth and ashes.
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
