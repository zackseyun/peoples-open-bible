id: PSA.89.19
reference: Psalms 89:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֤ז דִּבַּ֥רְתָּֽ בְ/חָ֡זוֹן לַֽ/חֲסִידֶ֗י/ךָ וַ/תֹּ֗אמֶר שִׁוִּ֣יתִי עֵ֭זֶר עַל גִּבּ֑וֹר הֲרִימ֖וֹתִי בָח֣וּר מֵ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/019.yaml
  text: Then you spoke in a vision to your faithful ones[a] and said, “I have bestowed help on a mighty one[b]; I have raised up a young man from among the people.”
  footnotes:
  - marker: a
    text: Some ancient versions read “your faithful one.”
    reason: textual_variant
  - marker: b
    text: Or “a warrior.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 주께서 환상 가운데에 주의 충실한 이들에게 말씀하시고, “나는 한 용사 위에 도움을 두었으며, 백성 가운데에서 택함받은 이를 높였습니다.”
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: בְּחָזוֹן
  english_pob_choice: in a vision
  chosen_korean: 환상 가운데에
  alternatives_korean:
  - 환상 속에서
  - 환상 가운데
  lexicon: HALOT
  rationale: 히브리어 전치사 ב와 חָזוֹן의 결합은 계시가 이루어진 방식/장소를 가리키므로, ‘환상 가운데에’가 원문 구조를 비교적 자연스럽게 살립니다.
- source_word: לַחֲסִידֶיךָ
  english_pob_choice: to your faithful ones
  chosen_korean: 주의 충실한 이들에게
  alternatives_korean:
  - 주의 신실한 이들에게
  - 주의 경건한 이들에게
  - 주의 성도들에게
  lexicon: HALOT
  rationale: חָסִיד는 언약적 충실함을 지닌 사람들을 가리킬 수 있으므로, 교회적 전통어인 ‘성도’보다 ‘충실한 이들’이 원뜻을 더 투명하게 드러냅니다.
- source_word: שִׁוִּיתִי עֵזֶר עַל גִּבּוֹר
  english_pob_choice: I have set help upon a mighty man
  chosen_korean: 나는 한 용사 위에 도움을 두었으며
  alternatives_korean:
  - 나는 한 용사에게 도움을 주었으며
  - 나는 한 용사 위에 구원을 두었으며
  - 나는 한 영웅 위에 도움을 두었으며
  lexicon: HALOT
  rationale: שִׁוִּיתִי는 ‘두다/놓다’의 뜻이므로 ‘도움을 두다’로 살리고, גִּבּוֹר는 군사적 뉘앙스를 유지하면서도 과도하게 좁히지 않는 ‘용사’로 옮겼습니다.
- source_word: הֲרִימוֹתִי בָחוּר מֵעָם
  english_pob_choice: I have exalted one chosen from the people
  chosen_korean: 백성 가운데에서 택함받은 이를 높였습니다
  alternatives_korean:
  - 백성 가운데서 한 젊은이를 높였습니다
  - 백성 가운데에서 선택된 이를 높였습니다
  - 백성들 가운데서 한 사람을 들어 올렸습니다
  lexicon: HALOT
  rationale: בָחוּר는 문맥상 단순한 ‘젊은이’보다 선택된 자의 의미가 우세하므로 ‘택함받은 이’로 옮기고, מֵעָם은 출처/선택의 범위를 드러내는 ‘백성 가운데에서’로 처리했습니다.
theological_decisions:
- issue: לַחֲסִידֶיךָ의 단수/복수 전통 차이
  chosen_reading: 본문에 맞춰 복수인 ‘주의 충실한 이들’을 본문에 두고, 단수 전통은 각주로 남겼습니다.
  alternative_readings:
  - ‘주의 충실한 이에게’(일부 본문 전통/번역 반영)
  rationale: 제공된 WLC 형태는 복수형이므로 이를 우선했고, 다른 읽기는 본문에 흡수하지 않고 각주로 처리해 본문과 전통 차이를 보존했습니다.
  doctrine_reference: 원문 우선 원칙과 본문비평적 투명성
