  alternatives_korean:
  - 화를 냈습니다
  - 분노하였습니다
  - 노여워하였습니다
  lexicon: ἀγανακτέω
  rationale: 단순한 감정 변화가 아니라 도덕적·상황적 불만이 드러나는 동사이므로, 비교적 강한 ‘분개하다’로 옮겼습니다.
- source_word: περὶ τῶν δύο ἀδελφῶν
