translation:
  language: ko
  text: 그리고 아폴로니오스는 그들 뒤에 천 명의 기병을 은밀히 남겨 두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέλειπεν
  english_pob_choice: left
  chosen_korean: 남겨 두었습니다
  alternatives_korean:
  - 두고 갔습니다
  - 남겼습니다
  lexicon: ἀπολείπω
  rationale: 여기서는 단순히 ‘떠나다’보다 뒤에 사람을 배치해 두는 의미가 분명하므로, ‘남겨 두었습니다’가 문맥의 의도를 가장 잘 드러냅니다.
- source_word: χιλίαν ἵππον
  english_pob_choice: a thousand horsemen
  chosen_korean: 천 명의 기병
  alternatives_korean:
  - 천의 말
  - 천 기병
  lexicon: χίλιοι + ἱππεύς/ἵππος
  rationale: 영어 POB의 ‘horsemen’에 맞춰 군사 단위인 ‘기병’으로 옮겼고, 인원 수를 자연스럽게 ‘천 명의’로 표현했습니다.
- source_word: κρυπτῶς
  english_pob_choice: hidden
  chosen_korean: 은밀히
  alternatives_korean:
  - 숨겨진 채로
  - 몰래
  lexicon: κρυπτῶς
  rationale: 부사로서 배치의 방식이 드러나도록 ‘은밀히’를 택해, 전면에 드러나지 않게 숨겨 둔 상황을 전달했습니다.
- source_word: κατόπισθεν αὐτῶν
  english_pob_choice: behind them
  chosen_korean: 그들 뒤에
  alternatives_korean:
  - 그 뒤에
  - 그들 뒤편에
  lexicon: κατόπισθεν
  rationale: 위치 관계를 직설적으로 살려 ‘그들 뒤에’로 옮겼습니다.
