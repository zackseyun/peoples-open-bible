lexical_decisions:
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 자애
  lexicon: HALOT
  rationale: חֶסֶד은 단순한 감정보다 지속적이고 관계적인 신실한 사랑을 가리키므로, 시적 병행 속에서 압축적이면서도 그 뉘앙스를 살리는 ‘인애’를 택했습니다.
- source_word: אֱמֶת
  english_pob_choice: truth
  chosen_korean: 진실
  alternatives_korean:
  - 진리
  - 신실함
  - 성실함
  lexicon: HALOT
  rationale: אֱמֶת은 ‘진리’도 가능하지만, 여기서는 חסד과 짝을 이루는 추상명사로서 사실성과 신뢰성을 함께 담는 ‘진실’이 가장 자연스럽습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: צֶדֶק은 문맥에 따라 ‘의’와 ‘정의’가 가능하지만, 시편의 신학적·시적 용법에서는 넓은 윤리적·관계적 의미를 포괄하는 ‘의’가 가장 적절합니다.
- source_word: נָשָׁקוּ
  english_pob_choice: have kissed
  chosen_korean: 서로 입맞춥니다
  alternatives_korean:
  - 입맞췄습니다
  - 포옹합니다
  - 서로 맞닿습니다
  lexicon: HALOT
  rationale: 나שק의 구체적 이미지인 ‘입맞추다’를 살리되, 인격화된 추상명사들이 주어이므로 자연스러운 현재형 시적 진술로 옮겼습니다.
theological_decisions:
