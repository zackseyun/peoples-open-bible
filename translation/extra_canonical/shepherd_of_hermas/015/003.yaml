translation:
  text: And those others that fall near the waters yet are not able to roll into the water—do you want to know who they are? These are the ones who have heard the word and want to be baptized into the name of the Lord; then, when the purity of the truth comes to their remembrance, they change their minds[a] and go back again after their evil desires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Retain change their minds: this is retreat from baptism or vacillation into divination, not repentance toward God. Preserve the adverse direction.'
    reason: lexical_alternative
