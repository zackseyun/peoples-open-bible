translation:
  text: '1. He says to me, “Remove every evil desire from yourself. Clothe yourself with good and dignified[a]
    desire. For when you wear this desire, you will hate evil desire and bridle it as you wish.”


    2. “For evil desire is wild and hard to tame. It is frightening, and its savagery greatly consumes
    people. If a servant of God[c] falls into it and is not sensible, it consumes him terribly. It consumes
    those who do not wear the garment of good desire, but are mixed up with this age. So it hands them
    over to death.”


    3. I say, “Sir, what deeds of evil desire hand people over to death? Make them known to me so that
    I may keep away from them.” He says, “Listen[b] to the deeds by which evil desire puts God’s servants
    to death.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: Dignified renders semnēn; reverent or honorable are alternatives. The clothing and bridle images
      remain.
  - marker: b
    reason: textual_variant
    text: The working i.3 brackets he says; the 1891 apparatus calls it Harmer’s insertion supported by
      versions, while Lake (1907) Plate VIII lacks it. The English supplies the disclosed working attribution,
      not a claim of unanimous Greek.
  - marker: c
    reason: textual_variant
    text: Reader-facing servant follows current DOCTRINE.md. Bonded status, ownership and total allegiance
      remain part of the doulos metaphor; slave is a lexical alternative.
