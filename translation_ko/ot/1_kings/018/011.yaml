  source_fidelity: '원문의 발화 구조(‘이제 당신은 말합니다: 가서 당신의 주인에게 …라고 말하라’)와 ‘당신의 주인’이라는 인간 상관 지칭은 유지되어야 합니다. 초안의 ‘말하라고 하고 있습니다’는 ‘말하고 있습니다’보다 명령을 내리는 행위 쪽으로 다소 바뀌며, 인용부호 배치도 중첩 인용을 명확히 드러내지 못합니다.'
  naturalness: 합쇼체에서는 명령 인용을 ‘…라고 말하십시오’로, 이를 다시 ‘…라고 말씀하십니다’로 받으면 자연스럽고 인용 층위도 분명합니다. ‘보십시오’는 הִנֵּה의 주의 환기 기능을 현대 공손체로 무리 없이 반영합니다.
  terminology: ‘엘리야’는 확립된 한국어 성경 인명 표기이며, אָדוֹן은 이 문맥에서 하나님 칭호가 아니라 아합을 가리키므로 ‘주인’이 적절합니다. 별도 각주는 필요하지 않습니다.
  issues:
  - severity: medium
    issue: 중첩 인용부호와 인용 종결 표현이 불명확함
    rationale: 초안은 바깥 인용부호 안에서 안쪽 인용을 닫은 뒤 ‘라고 말하라고’가 이어져, 누가 무엇을 말하는지와 인용의 경계가 문법적으로 어색합니다.
  - severity: low
    issue: ‘하고 있습니다’의 의미가 원문의 ‘당신은 말합니다’와 다소 다름
    rationale: ‘말하라고 하고 있습니다’는 명령을 반복·지속해 지시한다는 뉘앙스를 더합니다. ‘말씀하십니다’는 원문의 현재 발화와 명령 인용을 직접적으로 반영합니다.
  revised_text: “이제 당신은 ‘가서 당신의 주인에게 ‘보십시오, 엘리야가 여기 있습니다’라고 말하십시오’라고 말씀하십니다.”
