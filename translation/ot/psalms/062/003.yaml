  from: How long will you assail a man? Will you all break him down[a], like a leaning wall[b], a tottering fence?
  to: How long will you assail a man? Will you all murder him[a], like a leaning wall[b], a tottering fence?
  rationale: The proposal rightly identifies that the present note is circular and that the lexical record must agree with the main text, but "break him down" is not a source-near rendering of רצח. The verb ordinarily means murder/kill, and the wall-and-fence comparison can naturally portray the assaulted man as vulnerable and near collapse; it does not license replacing the lethal verb in the text. Retain the usual sense in the main line and record the contextual metaphorical alternative in a note.
