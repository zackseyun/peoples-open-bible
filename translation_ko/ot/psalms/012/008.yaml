  terminology: רְשָׁעִים은 ‘악인들’, זֻלּוּת은 문맥상 도덕적으로 천하고 가치 없는 것을 가리키는 ‘비천한 것’으로 옮겼습니다. לִבְנֵי אָדָם은 일반 인류를 뜻하므로 ‘사람들 가운데’로 자연스럽게 번역하고, 문자적 표현은 각주에 남겼습니다.
