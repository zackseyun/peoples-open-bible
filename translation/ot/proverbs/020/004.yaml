id: PRO.20.4
reference: Proverbs 20:4
source:
  edition: WLC
  text: מֵ֭/חֹרֶף עָצֵ֣ל לֹא יַחֲרֹ֑שׁ ישאל בַּ/קָּצִ֣יר וָ/אָֽיִן־׃
translation:
  text: The lazy man will not plow because of the cold[a]; at harvest he asks for food[b], but has nothing.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'does not plow in winter.'
    reason: alternative_reading
  - marker: b
    text: Or, 'he looks for a crop, but finds nothing.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵחֹרֶף
  chosen: Because of winter
  alternatives:
  - In winter
  - From winter
  - On account of the cold season
  lexicon: HALOT
  rationale: The preposition מִן with חֹרֶף can express causation ('because of/on account of winter') rather than simple temporal location. In this proverb, the sense is that winter/cold is the excuse or deterrent for not plowing, which fits the antithetical outcome in the second colon.
- source_word: עָצֵל
  chosen: the lazy man
  alternatives:
  - the sluggard
  - a lazy person
  lexicon: HALOT
  rationale: עָצֵל is the stock wisdom term for a habitually lazy person. 'The lazy man' preserves the masculine singular form and representative force, in keeping with the gender-accurate policy. 'Sluggard' is traditional but less natural in contemporary English.
- source_word: לֹא יַחֲרֹשׁ
  chosen: does not plow
  alternatives:
  - will not plow
  - does not cultivate
  lexicon: HALOT
  rationale: חרשׁ here refers to agricultural plowing. English present tense suits proverbial, gnomic force. 'Plow' is more precise than the broader 'cultivate'.
- source_word: ישאל
  chosen: he asks
  alternatives:
  - he asks
  - he begs
  - he looks for
  lexicon: HALOT
  rationale: שׁאל ordinarily means “ask.” The Hebrew leaves the requested object unstated, which English can preserve here.
- source_word: בַּקָּצִיר
  chosen: at harvest
  alternatives:
  - in harvest time
  - during the harvest
  lexicon: HALOT
  rationale: The phrase marks the time when the consequence becomes evident. 'At harvest' is concise and natural English.
- source_word: וָאָיִן
  chosen: and there is nothing
  alternatives:
  - but there is nothing
  - and he has nothing
  - and there is none
  lexicon: HALOT
  rationale: אָיִן is an existential negation. 'There is nothing' preserves the terseness and leaves the implied object unstated, matching the Hebrew's concise judgment. The conjunction can be rendered simply as 'and' while still conveying the result.
