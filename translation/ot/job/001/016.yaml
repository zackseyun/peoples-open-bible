translation:
  text: While he was still speaking, another messenger came and said, “Fire from God[a] fell from heaven, set the flocks and the servants ablaze, and consumed them. I alone have escaped to tell you.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “a mighty fire”; the expression may refer to lightning.
    reason: alternative_reading
