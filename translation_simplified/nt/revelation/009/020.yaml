translation:
  language: en
  text: The rest of humanity—those who were not killed by these plagues—did not even reorient[r1] away from the things their own hands had made. Their reorientation would have meant no longer worshiping demons and idols made of gold, silver, bronze, stone, and wood.[a] These idols cannot see, hear, or walk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek can describe either the purpose or the intended result of repentance: that they would no longer worship them.'
    reason: alternative_reading
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
