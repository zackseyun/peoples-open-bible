  from: And he crossed over to them first[a], and all his people were before him; and all the nations were crushed before him[b], and they threw down all their weapons and fled into the sanctuary at Carnain.
  to: Judas took the initiative by crossing over to attack them, with all his men advancing ahead of him. All the forces of the nations were crushed before him; they threw down all their weapons and fled into the temple precinct at Carnain.
