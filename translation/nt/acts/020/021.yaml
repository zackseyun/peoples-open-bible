id: ACT.20.21
reference: Acts 20:21
source:
  edition: SBLGNT
  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
translation:
  text: solemnly testifying to both Jews and Greeks about repentance[b] toward God and faith in our Lord Jesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'trust in our Lord Jesus.'
    reason: lexical_alternative
  - marker: b
    text: The Greek explicitly says repentance toward God. Repentance concerns changed disposition and conduct, not merely regret; toward God is retained because the sentence states it.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτυρόμενος
  chosen: solemnly testifying
  alternatives:
  - testifying
  - earnestly warning
  - solemnly declaring
  lexicon: BDAG
  rationale: The participle carries the sense of emphatic, solemn witness or testimony. 'Solemnly testifying' preserves both the testimonial and weighty force better than the flatter 'testifying' alone.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  chosen: to both Jews and Greeks
  alternatives:
  - to Jews as well as Greeks
  - to both Jews and Gentiles
  lexicon: BDAG
  rationale: Ἕλληνες in Acts often denotes Greeks/Greek-speaking non-Jews rather than functioning as a fully generalized ethnic term 'Gentiles.' 'Both Jews and Greeks' preserves Luke's wording and the paired scope of Paul's witness.
- source_word: μετάνοιαν
  chosen: repentance toward God
  alternatives:
  - a reorientation toward God
  - a change of mind
  - turning
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: 'Use repentance toward God: unlike most passages the Greek explicitly supplies eis theon. Retain that destination and the parallel faith in Jesus. Contextual editorial assessment, not independent scholarly certification.'
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: εἰς θεόν
  chosen: toward God
  alternatives:
  - to God
  - before God
  lexicon: BDAG
  rationale: With μετάνοιαν, εἰς marks direction/orientation. 'Toward God' naturally conveys repentance directed Godward and pairs well with the following 'faith in' construction.
- source_word: πίστιν
  chosen: faith
  alternatives:
  - trust
  - faithfulness
  lexicon: BDAG
  rationale: Per doctrine defaults, πίστις is rendered 'faith' in the main text. In this construction the object is explicit ('in our Lord Jesus'), so 'faith' is the most natural rendering, while 'trust' remains a viable lexical alternative preserved in a footnote.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  chosen: in our Lord Jesus
  alternatives:
  - toward our Lord Jesus
  - in the Lord Jesus who is ours
  lexicon: BDAG
  rationale: With πίστις, εἰς commonly expresses faith directed into or placed in someone; idiomatic English is 'faith in.' κύριος is translated 'Lord' per doctrine, and Ἰησοῦς is transliterated 'Jesus' as a personal name.
- source_word: κύριον
  chosen: Lord
  alternatives:
  - Master
  lexicon: BDAG
  rationale: Per the contested-terms guidance, κύριος defaults to 'Lord.' This preserves both the title's christological weight and standard NT usage without importing a narrower social sense like 'Master'.
