id: PSA.148.12
reference: Psalms 148:12
source:
  edition: WLC
  text: בַּחוּרִ֥ים וְ/גַם בְּתוּל֑וֹת זְ֝קֵנִ֗ים עִם נְעָרִֽים־־׃
translation:
  text: young men and young women[a], old men with boys[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “virgins,” referring here to unmarried young women.
    reason: alternative_reading
  - marker: b
    text: Or “youths”; the Hebrew term covers a broader age range than English “boys.”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחוּרִים
  chosen: young men
  alternatives:
  - young men in their prime
  - choice young men
  lexicon: HALOT
  rationale: The noun refers to young adult males, often emphasizing vigor or prime age. 'Young men' is the most natural modern English rendering and preserves the male-specific reference.
- source_word: וְגַם
  chosen: and
  alternatives:
  - and also
  lexicon: HALOT
  rationale: Ordinary coordination carries the additive particle naturally in this compressed poetic list.
- source_word: בְּתוּלוֹת
  chosen: young women
  alternatives:
  - virgins
  - maidens
  lexicon: HALOT
  rationale: Although the Hebrew term can denote virgins, in this poetic catalog the focus is on social groups by age and sex rather than sexual status. 'Young women' communicates the likely referent in clear modern English, while the more literal alternative is preserved in a footnote.
- source_word: זְקֵנִים
  chosen: old men
  alternatives:
  - elders
  - the aged
  lexicon: HALOT
  rationale: In this sequence of age-group pairings, the term most naturally denotes elderly males rather than office-bearing elders. 'Old men' keeps the male-specific and age-specific sense.
- source_word: עִם
  chosen: with
  alternatives:
  - along with
  lexicon: HALOT
  rationale: The concise preposition preserves the grouping of old men and boys in parallel with the first pair.
- source_word: נְעָרִים
  chosen: boys
  alternatives:
  - youths
  - young men
  lexicon: HALOT
  rationale: The term denotes younger males here and contrasts with the preceding adult young men. 'Boys' preserves both gender and age structure; the broader range remains footnoted.
