  source_fidelity: 히브리어는 시삭의 군사력과 그를 따라 이집트에서 온 수를 셀 수 없는 백성을 열거합니다. 병거 1,200대, 기병 60,000명, 그리고 루빔·수키임·구스인이라는 민족 집단의 열거가 수정문에 보존되었습니다. ‘백성’을 ‘군대’로 한정하지 않았고, 수키 사람들의 정체에 관한 불확실성도 유지했습니다.
