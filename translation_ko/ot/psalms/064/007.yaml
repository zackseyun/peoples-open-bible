source:
  edition: WLC
  text: יַֽחְפְּֽשׂוּ עוֹלֹ֗ת תַּ֭מְנוּ חֵ֣פֶשׂ מְחֻפָּ֑שׂ וְ/קֶ֥רֶב אִ֝֗ישׁ וְ/לֵ֣ב עָמֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/007.yaml
  text: 'They devise injustices: “We have perfected a carefully concealed plot.” And the inward part of each man, and the heart, are deep.'
translation:
  language: ko
  text: 그러나 하나님께서 그들에게 화살을 쏘시니, 그들은 갑자기 상처를 입었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחְפְּשׂוּ עוֹלֹת
  english_pob_choice: They devise injustices
  chosen_korean: 그들은 불의를 꾸밉니다
  alternatives_korean:
  - 그들은 부정을 꾸밉니다
  - 그들은 불의한 일을 궁리합니다
  lexicon: חפשׂ / עול
  rationale: 동사는 ‘꾸미다’로, 악한 계획을 의도적으로 짜내는 뉘앙스를 살렸고, עוֹלֹת는 추상적인 ‘불의’로 옮겨 행위의 부당성을 드러냈습니다.
- source_word: חֵפֶשׂ מְחֻפָּשׂ
  english_pob_choice: a carefully concealed plot
  chosen_korean: 교묘하게 숨긴 계략
  alternatives_korean:
  - 세심하게 감춘 계략
  - 철저히 숨겨진 음모
  lexicon: חֵפֶשׂ / מְחֻפָּשׂ
  rationale: 중복된 어근이 ‘숨김’과 ‘철저한 은폐’를 강조하므로, ‘교묘하게 숨긴’으로 자연스럽게 압축하되 악의적 계획인 ‘계략’을 유지했습니다.
- source_word: קֶרֶב אִישׁ וְלֵב עָמֹק
  english_pob_choice: the inward part of each man, and the heart, are deep
  chosen_korean: 사람의 속내와 마음은 깊습니다
  alternatives_korean:
  - 각 사람의 내면과 마음은 깊습니다
  - 사람의 속과 마음은 깊습니다
  lexicon: קֶרֶב / לֵב
  rationale: ‘קֶרֶב’의 신체적 ‘배/속’ 이미지를 한국어의 ‘속내’로 옮겨 내면성의 표현력을 살렸고, 병렬된 ‘마음’은 그대로 유지했습니다.
theological_decisions:
- issue: 악인의 내면을 ‘깊다’고 말하는 표현
  chosen_reading: 겉으로 드러나지 않는 내면의 심층성과 은폐성을 묘사하는 표현으로 읽었습니다.
  alternative_readings:
  - 지혜로운 깊이의 긍정적 묘사로 읽는 해석
  - 단순히 이해하기 어려운 정도를 말하는 해석
  rationale: 문맥상 불의를 꾸미고 은밀한 계략을 세우는 사람들의 내면을 말하므로, 긍정적 ‘깊이’가 아니라 숨겨진 악의 심도를 가리킵니다.
  doctrine_reference: 시편 64편의 문맥적 악인 묘사
