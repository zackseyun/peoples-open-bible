  english_pob_choice: that ram made those sheep ... return
  chosen_korean: 그 숫양은 길을 잃었던 그 양들이 돌아오게 하여
  alternatives_korean:
  - 그 숫양이 그 양들을 돌아오게 하여
  - 그 숫양은 그 양들이 돌아오도록 하여
  lexicon: L5
  rationale: 원문의 사역성을 분명히 하기 위해 ‘돌아오게 하여’로 옮겨 주체의 적극적 작용을 드러냈습니다.
theological_decisions:
- issue: 폭력적 심판 장면의 직설성
  chosen_reading: 은유적 상징을 약화하지 않고, 숫양이 길 잃은 양들을 죽이기 시작하는 장면을 직설적으로 유지했습니다.
  alternative_readings:
  - 심판의 의미를 완화한 표현으로 바꾸는 읽기
  - 비유적 의미를 앞세워 폭력성을 희석하는 읽기
  rationale: 원문은 상징적 심판 행위를 매우 분명하고 거칠게 제시하므로, 현대 한국어에서도 그 긴장과 충격을 보존해야 합니다.
  doctrine_reference: 서사적·예언적 심판 이미지 보존
- issue: ‘자기 우리’로의 귀환
  chosen_reading: 길 잃은 양들이 원래 속한 울타리/우리로 돌아가는 회복의 방향을 유지했습니다.
  alternative_readings:
  - 단순한 귀가
  - 공동체적 회복을 약화한 읽기
  rationale: 마지막 절은 파괴만이 아니라 귀환과 질서 회복을 함께 보여 주므로, ‘자기 우리’로의 복귀를 분명히 했습니다.
  doctrine_reference: 회복과 심판의 병치
