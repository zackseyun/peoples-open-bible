translation:
  text: '“First of all, sir,” I said, “explain this to me: who are the rock and the gate?” “This rock
    and the gate are the Son of God,” he said. “How, sir,” I said, “is the rock old, but the gate new?”
    “Listen and understand, you who lack understanding,” he said.


    2. “The Son of God is older than all his creation, so that he became the Father’s counselor in his
    creation.[a] That is why he is old.” “But why is the gate new, sir?” I said.


    3. “Because,” he said, “he became manifest in the last days of the consummation. That is why the gate
    became new: so that those who are to be saved might enter God’s kingdom through it.”[b]


    4. “You saw the stones that passed through the gate go into the building of the tower, and those that
    did not enter cast back to their own place?”[c] “I saw them, sir,” I said. “In the same way,” he said,
    “no one will enter God’s kingdom without receiving the name of his Son.”[d]


    5. “If you wish to enter a city that is surrounded by a wall and has only one gate, can you enter
    that city except through its gate?” “How could anyone do otherwise, sir?” I said. “If you cannot enter
    the city except through its gate, then in the same way,” he said, “a person cannot enter God’s kingdom
    except through the name of his Son, whom he loves.”[e]


    6. “Did you see the crowd building the tower?” he said. “I saw them, sir,” I said. “They are all glorious
    angels,” he said. “These form a wall around the Lord.[f] The gate is the Son of God; this is the one
    entrance to the Lord. No one, then, will enter his presence except through his Son.”


    7. “Did you see the six men and the glorious, great man among them, who walked around the tower and
    rejected stones from the building?” “I saw them, sir,” I said.


    8. “The glorious man is the Son of God,” he said. “The six are the glorious angels supporting him
    on his right and left. None of these glorious angels will enter God’s presence without him.[g] Whoever
    does not receive his name will not enter God’s kingdom.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: “Creation” follows the printed working reading; Athos is reported with a similar word meaning
      “possession.” “His” and “the Father’s counselor” retain the Greek’s relationships without supplying
      an account of how or when the Son originated. Amherst fragmentf begins only at the end of paragraph2
      and does not certify this entire creation/counselor sentence.
  - marker: b
    reason: textual_variant
    text: “Last days of the consummation” preserves the Greek’s end-time expression without adding a date.
      Amherst190 fragmentf recto,1901 printed198, partly preserves this manifestation/new-gate passage.
      Its line openings, endings and some intervening letters are supplied; the fragment does not provide
      a complete independent copy of the paragraph.
  - marker: c
    reason: textual_variant
    text: The verb describing the stones going into the building is a bar-marked insertion by Harmer compared
      with the versions, reported absent from Athos by similar endings. It remains an explicit editorial
      repair. Amherstf does not cover this sentence.
  - marker: d
    reason: textual_variant
    text: '“The name of his Son” follows Gebhardt’s printed conjecture compared with the Latin traditions
      and Ethiopic. Athos is reported as “his holy name.” Alternative: “No one will enter God’s kingdom
      without receiving his holy name.” Amherstf does not decide this variant.'
  - marker: e
    reason: textual_variant
    text: The first “through the gate” is absent in Athos as reported but occurs in the working text compared
      with the versions. Amherstf verso partly preserves the only-gate comparison, including “through
      the gate,” with supplied letters in the surrounding words. Its surviving text ends within paragraph5;
      it does not reach paragraph6.
  - marker: f
    reason: textual_variant
    text: '“The Lord” follows the printed working text compared with Latin Vulgata, Palatina and Ethiopic.
      Athos is reported as “the world.” Alternative: “These form a wall around the world.” The following
      gate/entry explanation is retained under either reading. Amherstf does not reach this clause, and
      Sinaiticus has no surviving coverage here; neither is cited to settle Lord/world.'
  - marker: g
    reason: textual_variant
    text: '“Without him” follows Anger’s printed conjecture compared with the versions. Athos is reported
      as “without God.” Alternative: “None of these glorious angels will enter God’s presence without
      God.” The draft retains the printed pronoun but does not present the versions and Greek as unanimous.
      No angel’s name or later hierarchy is added.'
