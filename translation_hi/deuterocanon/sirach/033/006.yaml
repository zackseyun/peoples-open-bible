lexical_decisions:
- source_word: πλὴν σοῦ
  choice: तेरे सिवा
  rationale: अपवाद व्यक्त करने वाले यूनानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐγκαίνισον
  choice: नया कर
  rationale: आज्ञार्थक क्रिया का मूल अर्थ ‘नया करना/फिर से नया करना’ है; इसे केवल ‘दिखा’ कहने से नवीनीकरण का भाव खो जाता।
- source_word: σημεῖα
  choice: चिन्हों
  rationale: σημεῖον के धार्मिक और चमत्कारिक संकेत—दोनों आयामों को बनाए रखने वाला प्रचलित हिन्दी शब्द।
- source_word: ἀλλοίωσον
  choice: बदल दे
  rationale: क्रिया का स्पष्ट अर्थ ‘बदलना/भिन्न कर देना’ है; स्रोत की असामान्य अभिव्यक्ति को सहज बनाकर मिटाया नहीं गया।
- source_word: θαυμάσια
  choice: अद्भुत कामों
  rationale: संज्ञात्मक बहुवचन का अर्थ चमत्कारपूर्ण या विस्मयकारी कार्य है; सामान्य पाठक के लिए ‘अद्भुत काम’ स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: परमेश्वर की अद्वितीयता
  choice: तेरे सिवा कोई परमेश्वर नहीं है
  alternative: तेरे अतिरिक्त कोई ईश्वर नहीं
  rationale: मूल कथन की विशिष्टता को बिना किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के सीधे रखा गया।
- issue: चिन्हों और अद्भुत कामों के लिए प्रार्थना
  choice: चिन्हों को नया कर और अद्भुत कामों को बदल दे
  alternative: नए चिन्ह दिखा और नए प्रकार के चमत्कार कर
  rationale: स्रोत की दो अलग आज्ञार्थक क्रियाओं और उनके बीच के तनाव को बनाए रखा गया; ‘बदल दे’ को व्याख्यात्मक रूप से ‘और बड़े’ या ‘फिर से’ नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन आत्मीय संबोधन ‘तेरे’ रखा गया है, जो प्रार्थनात्मक बाइबलीय शैली में स्वाभाविक है। वाक्य का अंतिम अल्पविराम स्रोत और दिए गए परामर्श-पाठ में आगे जारी रहने वाले वाक्य को दर्शाता है। उपलब्ध यूनानी पाठ और निर्दिष्ट संदर्भ संख्या के बीच संभावित संदर्भ-असंगति है; मसौदा दिए गए यूनानी पाठ के आधार पर किया गया है।
