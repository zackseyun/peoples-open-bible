id: EZK.3.12
reference: Ezekiel 3:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּשָּׂאֵ֣/נִי ר֔וּחַ וָ/אֶשְׁמַ֣ע אַחֲרַ֔/י ק֖וֹל רַ֣עַשׁ גָּד֑וֹל בָּר֥וּךְ כְּבוֹד יְהוָ֖ה מִ/מְּקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/012.yaml
  text: 'Then the Spirit lifted me up, and I heard behind me a sound of a great rumbling: “Blessed be the glory of the LORD from his place.”'
translation:
  language: ko
  text: 그러자 영이 나를 들어 올렸고, 나는 내 뒤에서 큰 굉음이 나는 것을 들었습니다. “야훼의 영광이 그분의 처소로부터 찬송받으시기를.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רוּחַ
  english_pob_choice: The Spirit
  chosen_korean: 영
  alternatives_korean:
  - 성령
  - 바람
  lexicon: רוּחַ
  rationale: 문맥상 예언자를 들어 올리는 주체이므로 물리적 ‘바람’보다 영적 존재를 가리키는 ‘영’이 적절합니다. 이 본문은 문맥만으로 성령의 고유표현을 강제하지 않으므로 기본값 ‘영’을 따랐습니다.
- source_word: קוֹל רַעַשׁ גָּדוֹל
  english_pob_choice: a sound of a great rumbling
  chosen_korean: 큰 요란한 소리
  alternatives_korean:
  - 큰 우렛소리
  - 큰 요동의 소리
  lexicon: קוֹל רַעַשׁ גָּדוֹל
  rationale: ‘רַעַשׁ’는 단순한 소리보다 ‘요란함/진동’을 포함하므로, 청각적으로 드러나는 ‘큰 요란한 소리’로 옮겨 원문의 강도를 살렸습니다.
- source_word: בָּר֥וּךְ כְּבוֹד יְהוָ֖ה
  english_pob_choice: Blessed be the glory of the LORD
  chosen_korean: 야훼의 영광이 찬양을 받으시기를
  alternatives_korean:
  - 야훼의 영광을 찬송합니다
  - 야훼의 영광이 복되시기를
  lexicon: בָּרוּךְ
  rationale: 히브리어 축복 선언형은 단순 서술보다 ‘~이 찬양을 받으시기를’이라는 축복/송영형 한국어가 원문의 기능을 잘 드러냅니다. ‘영광’ 자체를 ‘복되다’로 주어화하기보다, 그 영광에 대한 찬양의 뜻을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 이 프로젝트의 기본 원칙에 따라 텍스트에 나타난 신명은 학술 전사 ‘야훼’로 옮겼습니다. 이 절은 야훼의 현현을 직접 언급하므로 전통적 완곡어 ‘주님’보다 원형을 보존했습니다.
theological_decisions:
- issue: ‘Blessed be…’의 송영적 표현을 한국어로 어떻게 살릴지
  chosen_reading: 축복 선언을 직역하지 않고, 공동체가 하나님 영광을 향해 드리는 찬양/송영의 형식으로 옮겼습니다.
  alternative_readings:
  - ‘복되도다, 야훼의 영광이 그 계신 곳에서’
  - ‘야훼의 영광이 그 계신 곳에서 복을 받으십시오’
  rationale: 히브리어 בָּרוּךְ는 단순 상태 진술보다 예배적 선언 기능이 강하므로, 한국어에서도 송영적 기능이 드러나도록 번역했습니다. 다만 원문의 축복 어감을 지우지 않기 위해 ‘찬양을 받으시기를’로 보존했습니다.
  doctrine_reference: 송영(doxology) 표현의 기능 보존
- issue: יְהוָה의 표기
  chosen_reading: 본문에는 ‘야훼’를 사용했습니다.
  alternative_readings:
  - ‘주’
  - ‘주님’
  rationale: 이 문맥은 본문의 직접 발화가 아니라 예언적 환시의 기록이므로, 신명 표기를 숨기기보다 source-direct 원칙에 따라 드러내는 것이 적절합니다.
  doctrine_reference: Tetragrammaton 표기 원칙
