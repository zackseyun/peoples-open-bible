theological_decisions:
- issue: Identity of the woman in the vision
  chosen_reading: She is the Church (personified), not the Sibyl.
  alternative_readings: []
  rationale: The text explicitly identifies the woman as the Church and rejects Hermas’s Sibyl identification.
    Neither the rejected Sibyl nor another substitute identity is a viable alternative reading of this
    selected dialogue; comparisons with other personification traditions remain interpretation, not a
    replacement identity.
- issue: Reason the Church appears as an old woman
  chosen_reading: She appears old because she was created first of all, and for her sake the world was
    set in order.
  alternative_readings:
  - Purely metaphorical for the Church’s antiquity/pre-eminence without ontological claim
  - Allusion to Wisdom traditions rather than a doctrinal assertion
  rationale: We render the claim as stated, preserving Hermas’s tension-laden pre-existence imagery without
    harmonizing or softening it.
- issue: Rendering Ἐκκλησία as “Church”
  chosen_reading: Translate as “the Church,” capitalized in context.
  alternative_readings:
  - Translate as “assembly” or “congregation”
  rationale: The young man explicitly identifies the personified woman as the Church. Capitalization marks
    that identification; no external date claim is required.
- issue: Public reading practice implied by ἀναγινώσκω
  chosen_reading: Retain read it aloud as contextual reading with the elders.
  alternative_readings:
  - “you will read it” without ‘aloud’
  rationale: The reading has the elders as its stated company; no later liturgical procedure is asserted.
- issue: Translation of ἐκλεκτοί
  chosen_reading: “the elect” to preserve the theological term.
  alternative_readings:
  - “the chosen (ones)”
  rationale: Maintains traditional theological vocabulary without specifying a particular doctrinal system;
    alternatives are noted in lexical options.
- issue: Church order in “elders who preside over the church”
  chosen_reading: Maintain presiding/leadership language rather than generic ‘leaders.’
  alternative_readings:
  - Simplify to ‘leaders’
  rationale: Hermas reflects emerging church order; “preside” preserves the technical flavor of προΐσταμαι.
