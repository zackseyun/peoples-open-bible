id: MAT.23.10
reference: Matthew 23:10
source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
translation:
  text: Do not be called instructors, for you have one instructor, the Messiah.
  philosophy: dynamic
lexical_decisions:
- source_word: μηδὲ
  chosen: Do not
  alternatives:
  - And do not
  lexicon: BDAG
  rationale: The connective continues the preceding prohibitions, but a standalone English verse need not begin with 'And.'
- source_word: κληθῆτε
  chosen: be called
  alternatives:
  - be named
  - be addressed as
  lexicon: BDAG
  rationale: Passive of καλέω here refers to receiving a title or designation. 'Be called' is the most direct and idiomatic rendering.
- source_word: καθηγηταί
  chosen: instructors
  alternatives:
  - guides
  - leaders
  - teachers
  lexicon: BDAG
  rationale: καθηγητής denotes one who leads or instructs. 'Instructors' fits the title sense in this context and avoids collapsing it into 'teachers,' which could blur the distinction from διδάσκαλος in the nearby verses.
- source_word: ὅτι
  chosen: for
  alternatives:
  - because
  lexicon: BDAG
  rationale: The conjunction introduces the reason for the prohibition. 'For' is concise and dignified in this direct teaching.
- source_word: καθηγητὴς
  chosen: instructor
  alternatives:
  - guide
  - leader
  - teacher
  lexicon: BDAG
  rationale: Rendered consistently with the plural earlier in the verse. Singular maintained for the predicate nominative.
- source_word: ὑμῶν
  chosen: you have
  alternatives:
  - your
  lexicon: BDAG
  rationale: English recasts the possessive predicate construction as 'you have one instructor' while preserving its meaning.
- source_word: ἐστιν εἷς
  chosen: one
  alternatives:
  - is one
  lexicon: BDAG
  rationale: The Greek predicate emphasizes a single instructor. English places 'one' before the noun in the recast construction.
- source_word: ὁ χριστός
  chosen: the Messiah
  alternatives:
  - Christ
  lexicon: BDAG
  rationale: Per doctrine guidance, Χριστός is translated as 'Messiah' where it functions as a title rather than a name-like form. Here the article marks it clearly as a title.
