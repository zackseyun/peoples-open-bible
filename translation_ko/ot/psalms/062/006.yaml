  to: 오직 그분만이 나의 반석이시며 나의 구원이시고, 나의 요새이시니, 나는 흔들리지 않을 것입니다.[a]
  rationale: 제공된 WLC 본문과 영어 POB 감사 기록에 맞추어 절 전체를 새로 번역했습니다. אַךְ הוּא의 배타적 강조는 ‘오직 그분만이’로, 세 소유격 명사는 병렬 구조로 보존했습니다. לֹא אֶמּוֹט의 ‘흔들리다/움직이다’ 범위는 본문에는 자연스러운 ‘흔들리지 않을 것입니다’를 두고 각주에서 대안을 제시하여 유지했습니다.
