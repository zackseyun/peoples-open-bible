source:
  edition: WLC
  text: יִֽהְי֥וּ לְ/רָצ֨וֹן אִמְרֵי פִ֡/י וְ/הֶגְי֣וֹן לִבִּ֣/י לְ/פָנֶ֑י/ךָ יְ֝הוָ֗ה צוּרִ֥/י וְ/גֹאֲלִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/014.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable to you[a], Yahweh, my rock and my redeemer[b].
  footnotes:
  - marker: a
    text: More literally, “acceptable before you” or “acceptable in your presence.”
    reason: literal_form
  - marker: b
    text: The Hebrew term can denote one who rescues or reclaims, especially a close relative acting on a family member’s behalf.
    reason: cultural_note
translation:
  language: ko
  text: 내 입의 말과 내 마음의 묵상을 당신 앞에[a] 기쁘게 받아 주십시오, 야훼여, 저의 반석, 저의 구속자[b]여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 눈앞에’. 히브리어는 직역하면 ‘당신의 얼굴 앞에’ 또는 ‘당신의 임재 앞에’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구속자’는 이스라엘의 법과 관습에서 친족의 의무에 따라 구해 내거나 되찾아 주는 이를 가리키는 말과 관련됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִזֵּדִים
  english_pob_choice: from presumptuous sins
  chosen_korean: 주제넘은 죄에서
  alternatives_korean:
  - 교만한 사람들로부터
  - 오만한 자들로부터
  - 고집 센 죄에서
  lexicon: HALOT
  rationale: 문맥이 숨은 허물과 죄의 지배를 말하므로, 인물보다 죄의 성격으로 읽는 것이 자연스럽습니다. '주제넘은'은 זֵדִים의 교만·방자함 뉘앙스를 살립니다.
- source_word: חֲשֹׂךְ
  english_pob_choice: keep ... back
  chosen_korean: 지켜 주십시오
  alternatives_korean:
  - 막아 주십시오
  - 붙들어 주십시오
  - 억제해 주십시오
  lexicon: HALOT
  rationale: 하나님께 죄를 짓지 않도록 붙들어 달라는 간구이므로, 현대 한국어 기도체에서 자연스러운 '지켜 주십시오'가 명령의 보호적 힘을 잘 드러냅니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 일꾼
  - 주의 하인
  lexicon: HALOT
  rationale: 하나님께 드리는 기도에서는 정체성과 복종 관계를 드러내는 '주의 종'이 가장 자연스럽습니다. 여기서는 bonded-status를 강조할 본문적 필요가 크지 않습니다.
- source_word: אַֽל יִמְשְׁלוּ בִי
  english_pob_choice: do not let them rule over me
  chosen_korean: 그것들이 저를 지배하지 못하게 하십시오
  alternatives_korean:
  - 그것들이 저를 다스리지 못하게 하십시오
  - 그것들이 저를 군림하지 못하게 하십시오
  - 그것들이 저를 주관하지 못하게 하십시오
  lexicon: HALOT
  rationale: מָשַׁל의 통치·지배 이미지를 한국어 동사 '지배하다'로 옮기면 죄가 사람 위에 군림하는 뉘앙스가 분명해집니다. 주어를 죄로 읽었으므로 '그것들'을 사용했습니다.
- source_word: אֵיתָם
  english_pob_choice: I will be blameless
  chosen_korean: 저는 온전하고
  alternatives_korean:
  - 저는 흠 없고
  - 저는 완전하고
  - 저는 결백하고
  lexicon: HALOT
  rationale: 이 형용사는 윤리적 온전함과 통전성을 가리키므로, '온전하고'가 무죄 선언으로 과장하지 않으면서도 의미를 넓게 담습니다.
- source_word: וְנִקֵּיתִי
  english_pob_choice: be cleared
  chosen_korean: 깨끗하게 될 것입니다
  alternatives_korean:
  - 무죄가 될 것입니다
  - 깨끗이 될 것입니다
  - 정결하게 될 것입니다
  lexicon: HALOT
  rationale: נקה의 핵심은 죄책에서 벗어나 정화/면책되는 상태입니다. '깨끗하게 될 것입니다'는 그 해방감을 자연스럽게 전하면서도 과도한 법정 용어를 피합니다.
theological_decisions:
- issue: 'מִזֵּדִים의 대상: 죄인가, 사람인가'
  chosen_reading: 주제넘은 죄로 읽었습니다.
  alternative_readings:
  - 오만한 사람들
  - 교만한 자들
  rationale: 앞뒤 문맥이 허물, 죄, 반역을 말하므로 도덕적 범주로 읽는 것이 시편의 기도 흐름을 가장 잘 보존합니다. 따라서 주체를 사람보다 죄의 힘으로 제시했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: אֵיתָם과 וְנִקֵּיתִי의 결과 상태
  chosen_reading: '''온전함''과 ''깨끗함''을 죄책 없음과 인격적 통전성의 표현으로 유지했습니다.'
  alternative_readings:
  - 무흠함/완전함
  - 결백함/무죄함
  rationale: 본문은 하나님의 보존을 통해 얻는 결과를 말하지만, 이는 절대적 무죄 선언보다 하나님 앞에서의 온전함과 죄책에서의 해방을 가리킵니다. 그래서 신학적으로 과도한 완전주의를 피했습니다.
  doctrine_reference: Translation philosophy §3
