  from: to turn a man from his deed[a], and to cover pride from a strong man,
  to: to turn a person from his deed, and to hide pride from him,[a]
  rationale: 'The current “cover pride from a strong man” is genuinely unnatural. The proposed “hide” correctly gives the English construction for כיסה ... מן, but pluralizing the singular מעשה is unnecessary and “from a man” loses the tight parallelism of the two human referents. “Hide pride from him” preserves the unresolved Hebrew image: pride may be kept from the man or concealed from him. “Strong man” overstates the lexical force of גבר in this poetic parallel.'
