  from: To you[a], O men, I call, and my voice is to the sons of mankind.
  to: I call to you, men, and raise my voice to all humanity.[a]
  rationale: The proposed English is a justified natural rendering of the direct call and the second, verbless clause; “raise my voice” makes the stated voice into a natural English predicate without changing the public-proclamation sense. However, the proposed note incorrectly treats אָדָם as the personal name “Adam.” In this expression it is the common noun “man/humankind,” and the note must state that honestly.
