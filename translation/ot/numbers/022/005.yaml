  meaning_decisions:
  - source_phrase: וַיִּשְׁלַח
    prior_rendering: So he sent
    new_rendering: So Balak sent
    rationale: Naming the subject makes explicit who sends the messengers, as the preceding narrative establishes.
  - source_phrase: אֲשֶׁר עַל־הַנָּהָר
    prior_rendering: which is by the River
    new_rendering: beside the Euphrates
    rationale: Identifying the river conveys the geographical reference familiar to the first hearers; the note preserves the Hebrew designation.
  - source_phrase: אֶרֶץ בְּנֵי עַמּוֹ
    prior_rendering: in the land of the sons of his people
    new_rendering: in the land of his people
    rationale: “Sons of his people” denotes members of a people, not specifically their male descendants. The smoother wording retains the uncertain pronoun, while the note acknowledges the serious alternative geographical interpretation.
  - source_phrase: לִקְרֹא לוֹ לֵאמֹר
    prior_rendering: to call him, saying
    new_rendering: to summon … with this message
    rationale: The messengers are sent to bring Balaam to Balak, not merely to speak to him; the revised structure also identifies the quoted words as Balak’s message.
  - source_phrase: הִנֵּה כִסָּה אֶת עֵין הָאָרֶץ וְהוּא יֹשֵׁב מִמֻּלִי
    prior_rendering: Look, it has covered the face of the land, and it is dwelling opposite me
    new_rendering: Look, they have covered the face of the land and are settled opposite me
    rationale: English naturally refers to the members of this collective people as “they.” “Are settled” conveys their continuing presence without suggesting permanent residence.
