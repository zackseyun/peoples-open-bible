  naturalness: 초안의 ‘네게 물어 보기를 … 하거든’은 현대 한국어 문장으로 부자연스럽고, 서술·인용의 종결 방식도 합쇼체 요청과 일관되지 않습니다. ‘하고 물으면’ 및 ‘말하십시오’로 다듬고 인용문도 합쇼체로 통일했습니다.
