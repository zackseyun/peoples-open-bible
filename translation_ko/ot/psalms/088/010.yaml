  terminology: פֶּלֶא는 ‘기적’으로, יוֹדוּךָ는 예배·감사의 문맥을 포괄하는 ‘주를 찬양하다’로 옮겼습니다. רְפָאִים은 후대의 영혼론을 확정하지 않도록 본문에서 ‘죽은 자들의 그림자들’로 번역하고 각주에서 히브리어 및 대안을 밝혔습니다. סֶּלָה는 뜻이 불확실하므로 ‘셀라’로 음역했습니다.
