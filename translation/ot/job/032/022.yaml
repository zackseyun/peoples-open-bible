id: JOB.32.22
reference: Job 32:22
source:
  edition: WLC
  text: כִּ֤י לֹ֣א יָדַ֣עְתִּי אֲכַנֶּ֑ה כִּ֝/מְעַ֗ט יִשָּׂאֵ֥/נִי עֹשֵֽׂ/נִי׃
translation:
  text: For I do not know how to give flattering titles; if I did, my Maker would soon take me away.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  lexicon: HALOT
  rationale: The second כי introduces the reason or consequence underlying Elihu's refusal and should not be left unrepresented.
- source_word: לֹא יָדַעְתִּי
  chosen: I do not know
  alternatives:
  - I have not learned
  - I do not know how
  lexicon: HALOT
  rationale: The idiom with following infinitive-like verbal form expresses lack of ability or practiced skill. Present English 'I do not know' communicates the sense better than a strictly past 'I did not know' in context.
- source_word: אֲכַנֶּה
  chosen: to give flattering titles
  alternatives:
  - to give flattering titles
  - to address with honorifics
  lexicon: HALOT
  rationale: כנה concerns naming or addressing by a title; the surrounding rejection of partiality supplies the pejorative, flattering sense.
- source_word: כִּמְעַט
  chosen: soon
  alternatives:
  - in a little while
  - almost
  - quickly
  lexicon: HALOT
  rationale: In this warning context, the phrase conveys imminent consequence rather than mere approximation. 'Soon' gives the temporal sense idiomatically.
- source_word: יִשָּׂאֵנִי
  chosen: would take me away
  alternatives:
  - would take me away
  - would remove me
  - would lift me up
  lexicon: HALOT
  rationale: This naturally preserves the broad removal sense of נשא without asserting death.
- source_word: עֹשֵׂנִי
  chosen: my Maker
  alternatives:
  - the one who made me
  - my Creator
  lexicon: HALOT
  rationale: A participial form meaning 'the one making/made me.' 'My Maker' is natural, concise, and preserves the personal creator-creature relation emphasized in Elihu's speech.
