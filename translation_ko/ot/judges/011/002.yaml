  lexicon: בֵּן
  rationale: 복수형을 분명히 드러내기 위해 “아들들”로 옮겼습니다.
- source_word: 'וַיְגָרְשׁוּ / english_pob_choice: they drove out'
  english_pob_choice: they drove Jephthah out
  chosen_korean: 쫓아내며
  alternatives_korean:
  - 내쫓으며
  - 몰아내며
  lexicon: גָּרַשׁ
  rationale: 강한 배제·추방의 동사를 자연스러운 현대 한국어로 직접 살렸습니다.
- source_word: 'לֹא תִנְחַ֣ל ... כִּ֛י בֶּן אִשָּׁ֥ה אַחֶ֖רֶת אָֽתָּה / english_pob_choice: You will not have an inheritance ... for you are the son of another woman'
  english_pob_choice: You will not have an inheritance ... for you are the son of another woman
  chosen_korean: 상속을 받지 못할 것이다 ... 다른 여자에게서 난 아들
  alternatives_korean:
  - 유산을 받지 못할 것이다
  - 기업을 얻지 못할 것이다
  lexicon: נחל / אִשָּׁה אַחֶרֶת
  rationale: POB가 “inheritance”로 풀어쓴 점을 따라 상속으로 옮기되, 출생 근거를 드러내는 “다른 여자에게서 난”을 붙여 원문의 낙인성 표현을 약화시키지 않았습니다.
theological_decisions:
- issue: 아버지 집에서의 상속 거절 표현
  chosen_reading: “우리 아버지 집에서 상속을 받지 못할 것이다”로 옮겨 권리 박탈의 의미를 유지했습니다.
  alternative_readings:
  - “우리 아버지 집에서 물려받지 못할 것이다”
  - “우리 아버지 집에서 기업을 얻지 못할 것이다”
  rationale: 문맥상 단순 상속 분쟁이 아니라 가족 공동체에서의 법적 배제와 수치 부여가 핵심이므로, 현대 독자가 이해할 수 있는 법적 표현을 택했습니다.
  doctrine_reference: 가족-상속 공동체에서의 배제와 언약 백성 내 소속 문제
- issue: 직접화법의 조롱성
  chosen_reading: 직접 인용부호를 유지해 형제들의 배척 발언이 갖는 공격성을 드러냈습니다.
  alternative_readings:
  - 간접화법으로 완화
  - 서술체로 평탄화
  rationale: 원문은 단순 정보가 아니라 입다의 정체성을 근거로 한 공개적 거절을 제시하므로, 발화의 날카로움을 보존하는 것이 중요합니다.
  doctrine_reference: 서사 내 수치-배제 표현의 보존
