  from: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
  to: And when Yahweh your God hands them over to you and you strike them down, you must devote them completely to destruction[a]. Make no covenant with them and show them no mercy[b].
  rationale: The earlier deliberation rightly distinguished sacred devotion from ordinary military destruction, and that distinction remains. Its preference for the lexical breadth of 'favor' is outweighed here by the command’s immediate context, with that alternative preserved in a correctly placed note.
