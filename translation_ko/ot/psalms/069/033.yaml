  text: For Yahweh hears the needy, and he does not despise his prisoners[a].
  footnotes:
  - marker: a
    text: Or 'his captives.' The Hebrew term can refer broadly to those held in bondage or confinement.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 궁핍한 이들의 말을 들으시고, 자신의 갇힌 이들을[a] 멸시하지 않으시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 포로들’. 히브리어는 포로, 죄수, 또는 넓게는 속박되거나 갇힌 이들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  english_pob_choice: the humble
  chosen_korean: 겸손한 이들
  alternatives_korean:
  - 고난받는 이들
