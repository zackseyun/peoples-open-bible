id: PSA.134.1
reference: Psalms 134:1
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
translation:
  text: Now bless Yahweh, all you servants of Yahweh who serve[a] in the house of Yahweh by night.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “who stand.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  chosen: A Song of Ascents
  alternatives:
  - A song of goings up
  - A pilgrim song
  lexicon: HALOT
  rationale: Traditional superscription denoting the psalm collection title; 'Ascents' preserves the Hebrew noun מַעֲלוֹת more formally than interpretive alternatives like 'pilgrim song'.
- source_word: הִנֵּה
  chosen: Behold
  alternatives:
  - Look
  - See
  lexicon: HALOT
  rationale: Preserves the elevated attention-directing force; “Now” is an idiomatic discourse alternative, whereas “Come” adds an invitation and “Look/See” may imply literal vision.
- source_word: בָּרֲכוּ
  chosen: bless
  alternatives:
  - praise
  lexicon: HALOT
  rationale: The verb ברך commonly means 'bless'; 'praise' is possible in context but narrows the semantic range. 'Bless' preserves the liturgical language of the psalm.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Follows the project's default rendering for the divine name, preserving covenantal reference while aligning with established English Bible convention.
- source_word: כָּל עַבְדֵי יְהוָה
  chosen: all you servants of Yahweh
  alternatives:
  - all servants of the LORD
  - all you slaves of the LORD
  lexicon: HALOT
  rationale: The imperative makes the phrase vocative; “you” supplies natural English direct address.
- source_word: הָעֹמְדִים
  chosen: who stand
  alternatives:
  - who are standing
  - who minister
  lexicon: HALOT
  rationale: A participle describing the addressed servants. 'Who stand' preserves the concrete Hebrew image; 'minister' is interpretive and therefore avoided in the main text.
- source_word: בְּבֵית יְהוָה
  chosen: in the house of Yahweh
  alternatives:
  - in the temple of the LORD
  lexicon: HALOT
  rationale: '''House of the LORD'' is the standard literal expression and preserves the Hebrew idiom; ''temple'' is a valid contextual gloss but less formally transparent.'
- source_word: בַּלֵּילוֹת
  chosen: by night
  alternatives:
  - in the nights
  - at night
  lexicon: HALOT
  rationale: Natural poetic English for the Hebrew plural temporal expression without false precision.
