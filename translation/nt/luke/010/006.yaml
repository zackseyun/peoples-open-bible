  category: meaning_retranslation
  from: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
  to: If someone who welcomes peace[a] is there, the peace you offer will rest upon that person; if not, it will return to you.
  rationale: Earlier decisions recognized receptivity as the idiom's meaning but retained 'son of peace' for formal and grammatical reasons. I express that recognized meaning directly while preserving the images of peace resting and returning.
