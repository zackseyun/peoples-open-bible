id: PRO.5.20
reference: Proverbs 5:20
source:
  edition: WLC
  text: וְ/לָ֤/מָּה תִשְׁגֶּ֣ה בְנִ֣/י בְ/זָרָ֑ה וּ֝/תְחַבֵּ֗ק חֵ֣ק נָכְרִיָּֽה׃
translation:
  text: Why, my son, should you go astray with a forbidden woman and embrace the bosom of a woman who is not your wife?
  philosophy: dynamic
lexical_decisions:
- source_word: לָמָה
  chosen: Why ... should you
  alternatives:
  - Why would you
  - Why
  lexicon: HALOT
  rationale: Interrogative 'why' introducing a rhetorical question of admonition. In English, adding 'should you' brings out the exhortational force naturally without over-paraphrasing.
- source_word: תִשְׁגֶּה
  chosen: go astray
  alternatives:
  - wander
  - be led astray
  - be intoxicated
  lexicon: HALOT
  rationale: The verb retains its negative moral sense in the rhetorical warning, even as verse 19 exploits a related positive erotic sense.
- source_word: בְנִי
  chosen: my son
  alternatives:
  - son
  lexicon: HALOT
  rationale: The form includes the 1cs suffix, so 'my son' is required. This also preserves the father-to-son instructional frame of Proverbs and follows the gender-accurate policy.
- source_word: זָרָה
  chosen: a forbidden woman
  alternatives:
  - strange woman
  - another woman
  - adulteress
  lexicon: HALOT
  rationale: In this warning context, the term denotes a woman outside the permitted sexual and marital relationship, not simply someone unusual.
- source_word: תְחַבֵּק
  chosen: embrace
  alternatives:
  - clasp
  - hug
  lexicon: HALOT
  rationale: A straightforward rendering of חבק. 'Embrace' fits both the poetic register and the sexual context.
- source_word: חֵק
  chosen: bosom
  alternatives:
  - breast
  - lap
  - embrace
  lexicon: HALOT
  rationale: חֵק often denotes bosom or lap, especially the intimate area held in an embrace. 'Bosom' preserves the concrete image and poetic tone better than the flatter 'lap' in this sexual context.
- source_word: נָכְרִיָּה
  chosen: foreign woman
  alternatives:
  - strange woman
  - outsider woman
  lexicon: HALOT
  rationale: The adjective/noun denotes a foreign or alien woman. Here it overlaps semantically with זָרָה, likely for poetic parallelism. Rendering it 'foreign woman' preserves the lexical distinction from זָרָה while allowing the context to signal that moral otherness, not merely ethnicity, is in view.
