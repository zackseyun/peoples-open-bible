revisions:
- from: 나는 너희를 향기로운 제물처럼 기쁘게 받아들일 것입니다. 내가 너희를 민족들 가운데서 끌어내고, 너희가 흩어져 있던 여러 나라들에서 너희를 모을 때 그렇게 할 것이며, 내가 너희를 통하여 열국의 눈앞에서 나 자신을 거룩하게 드러낼 것입니다.[a][b]
  to: 나는 너희를 향기로운 냄새처럼 기꺼이 받아들일 것입니다. 내가 너희를 민족들 가운데서 이끌어 내고, 너희가 흩어져 있던 여러 땅에서 너희를 모을 때에, 내가 너희를 통하여 열국이 보는 앞에서 내 거룩함을 드러낼 것입니다.[a][b]
  rationale: 원문에 없는 ‘제물’을 삭제하고, 향기 비유와 하나님의 수용을 각각 보존했습니다. ‘여러 나라들’을 ‘여러 땅’으로 고쳐 원문의 어휘 범위를 살렸습니다. 마지막 절은 영어 POB의 ‘through you’를 따르면서도, 히브리어의 하나님의 자기 성별/거룩함 현현을 자연스러운 한국어로 나타냈습니다. 각주 표지는 관련 표현 뒤에 유지하여 구조적 문제 없이 앵커를 분명히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:45Z'
review_pass:
  verdict: revise
  source_fidelity: ‘향기로운 제물’은 원문에 명시되지 않은 ‘제물’을 보태므로, רֵיחַ נִיחֹחַ의 향기 비유를 직접 옮기는 편이 더 충실합니다. 또한 אֲרָצוֹת는 ‘나라들’보다 ‘땅들’로 옮겨야 합니다. בָכֶם은 문맥과 영어 POB의 선택을 따라 ‘너희를 통하여’로 반영하되, 하나님의 자기 성별/거룩함의 공적 현현은 ‘내 거룩함을 드러내다’로 자연스럽게 표현할 수 있습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하며, ‘향기로운 냄새처럼’이라는 제의적 관용 표현을 불필요하게 ‘제물’로 구체화하지 않습니다. ‘열국’은 예언서 문맥에서 자연스럽고, ‘열국이 보는 앞에서’는 ‘열국의 눈앞에서’보다 약간 더 매끄럽습니다.
  terminology: רֵיחַ נִיחֹחַ는 ‘향기로운 냄새’로, רצה는 ‘기꺼이 받아들이다’로 옮겼습니다. וְנִקְדַּשְׁתִּי בָכֶם의 신적 자기 현현은 특정 교리적 해석을 덧붙이지 않고 ‘내 거룩함을 드러내다’로 표현했습니다. הַגּוֹיִם의 ‘열국’은 유지했습니다.
  issues:
