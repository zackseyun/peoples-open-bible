simplification_decisions:
- pob_phrase: My love be with
  simplified_phrase: May my love be with
  preserved_meaning: Paul closes with a wish that his love accompany them.
  reasoning_layer_used: The theological decision on the implied verb in the Greek benediction.
  rationale: Adding “may” clearly expresses the closing wish in natural English.
- pob_phrase: all of you
  simplified_phrase: every one of you
  preserved_meaning: Paul includes the whole Corinthian church without exception.
  reasoning_layer_used: The lexical decision for πάντων ὑμῶν.
  rationale: “Every one of you” makes the inclusive scope direct and clear.
- pob_phrase: in Messiah Jesus
  simplified_phrase: in Messiah Jesus
  preserved_meaning: Paul locates or qualifies his closing wish in relation to Messiah Jesus without narrowing that relationship.
  reasoning_layer_used: The lexical and theological decisions for ἐν Χριστῷ Ἰησοῦ.
  rationale: Retaining “in” preserves the important Pauline expression and its documented breadth.
