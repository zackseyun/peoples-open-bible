  text: אָג֣וּרָה בְ֭/אָהָלְ/ךָ עוֹלָמִ֑ים אֶֽחֱסֶ֨ה בְ/סֵ֖תֶר כְּנָפֶ֣י/ךָ סֶּֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you, O God, have heard my vows; you have given me[a] the inheritance of those who fear your name[b].
  footnotes:
  - marker: a
    text: Or 'I will dwell in your tent forever' / 'May I dwell in your tent forever'; the Hebrew form expresses a strong wish or resolve.
    reason: lexical_alternative
  - marker: b
    text: '''Tent'' may evoke God''s sanctuary or dwelling place; traditional English often has ''tabernacle.'''
    reason: cultural_note
translation:
  language: ko
  text: 당신의 장막에서 영원히 거하게 하시며[a], 당신의 날개의 그늘에 피하게 하소서[b]. 셀라
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 장막에서 영원히 거하겠습니다’ / ‘당신의 장막에서 영원히 거하게 해주십시오’; 히브리어 형태는 강한 소망이나 결의를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘장막’은 하나님의 성소 또는 거처를 떠올리게 할 수 있으며, 전통적인 영어 번역에는 ‘tabernacle’이 쓰이기도 합니다.
    reason: cultural_note
lexical_decisions:
- source_word: אָג֣וּרָה
  english_pob_choice: Let me dwell
  chosen_korean: 거하게 하시며
  alternatives_korean:
  - 거하게 하소서
  - 살게 하소서
  - 거주하게 하소서
  lexicon: HALOT
  rationale: 1인칭 청유/소망의 뉘앙스를 한국어 기도체로 자연스럽게 살리기 위해 ‘-게 하소서’ 구조를 택했습니다. ‘거하다’는 성경적 상징성을 유지하면서도 ‘살다’보다 더 문어적이고 지속 거주의 의미를 잘 드러냅니다.
- source_word: בְ֭/אָהָלְ/ךָ
  english_pob_choice: in your tent
  chosen_korean: 당신의 장막에서
  alternatives_korean:
  - 당신의 천막에서
  - 당신의 성막에서
  - 당신의 거처에서
  lexicon: HALOT
  rationale: 히브리어 אָהֶל의 기본 뜻은 ‘tent’이므로 문자적 이미지를 살려 ‘장막’으로 옮겼습니다. ‘성막’은 예배적 해석을 앞서 들이기 쉬워 여기서는 피했습니다.
- source_word: בְ/סֵ֖תֶר כְּנָפֶ֣י/ךָ
  english_pob_choice: in the shelter of your wings
  chosen_korean: 당신의 날개의 그늘에
  alternatives_korean:
  - 당신의 날개 아래에
  - 당신의 날개 보호 아래에
  - 당신의 날개의 피난처에
  lexicon: HALOT
  rationale: סֵתֶר는 숨겨진 보호의 장소를 가리키므로 ‘그늘’이 보호와 은신의 이미지를 함께 살립니다. ‘날개의 그늘’은 시편의 익숙한 시적 표현이면서도 본문의 은유를 과도하게 풀어쓰지 않습니다.
- source_word: עוֹלָמִ֑ים
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 영원까지
  - 오래도록
  lexicon: HALOT
  rationale: עוֹלָם의 복수형이 지속의 강화를 나타내므로, 현대 한국어에서 가장 자연스럽고 강한 시간 표현인 ‘영원히’로 옮겼습니다.
theological_decisions:
- issue: 장막/날개 이미지의 해석 범위
  chosen_reading: ‘장막’과 ‘날개의 그늘’이라는 구체적 은유를 그대로 유지했습니다.
  alternative_readings:
  - 성막으로 확장
  - 성소로 해석
  - 보호의 개념만으로 의역
  rationale: 히브리어는 하나님의 임재와 보호를 시적으로 말하지만, 본문 자체는 ‘tent’와 ‘wings’의 구체적 이미지를 사용합니다. 해석을 앞서기보다 원문 은유를 보존하는 것이 문맥상 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
