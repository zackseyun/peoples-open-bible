  from: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
  to: They made me jealous with what is not a god; they provoked me to anger with their worthless idols. So I will make them jealous with those who are not a people[a]; I will provoke them to anger with a foolish nation.
  rationale: The lexical record rightly emphasizes the reciprocal jealousy and anger and the deliberate pairing of “not a god” with “not a people.” I preserve those features and the refusal to identify a particular nation, while bringing the recorded worthlessness of the idols into the translation.
