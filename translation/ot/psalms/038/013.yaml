id: PSA.38.13
reference: Psalms 38:13
source:
  edition: WLC
  text: וַ/אֲנִ֣י כְ֭/חֵרֵשׁ לֹ֣א אֶשְׁמָ֑ע וּ֝/כְ/אִלֵּ֗ם לֹ֣א יִפְתַּח פִּֽי/ו־׃
translation:
  text: But I, like a deaf man, do not hear; I am like a mute man who does not open his mouth.
  philosophy: dynamic
lexical_decisions:
- source_word: וַאֲנִי
  chosen: But I
  alternatives:
  - And I
  - As for me
  lexicon: HALOT
  rationale: The conjunction with the pronoun marks contrast with the hostile speakers in the surrounding context; 'But I' brings out that adversative force naturally in English.
- source_word: כְחֵרֵשׁ
  chosen: like a deaf man
  alternatives:
  - as one deaf
  - like the deaf
  lexicon: HALOT
  rationale: The prefixed כ marks comparison. חֵרֵשׁ denotes a deaf person. 'Like a deaf man' preserves the singular masculine image and the simile.
- source_word: לֹא אֶשְׁמָע
  chosen: do not hear
  alternatives:
  - do not listen
  - cannot hear
  lexicon: HALOT
  rationale: שׁמע in the qal commonly means 'hear.' Here the psalmist presents himself as one who does not respond to accusations; 'do not hear' keeps the literal sensory language while allowing the rhetorical implication.
- source_word: וּכְאִלֵּם
  chosen: and like a mute man
  alternatives:
  - and like one mute
  - and like a speechless man
  lexicon: HALOT
  rationale: אִלֵּם denotes a mute person, parallel to 'deaf.' 'Mute' is concise and preserves the physical metaphor better than the broader 'speechless.'
- source_word: לֹא יִפְתַּח פִּיו
  chosen: who does not open his mouth
  alternatives:
  - he does not speak
  - his mouth does not open
  lexicon: HALOT
  rationale: The third-person verb and possessive suffix describe the mute man in the simile.
