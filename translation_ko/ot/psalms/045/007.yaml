  to: 당신은 의를 사랑하시고 악을 미워하셨으므로, 하나님[a], 곧 당신의 하나님께서 기쁨의 기름을 부어 당신에게 기름부으셨습니다. 당신의 동료들보다 더하셨습니다.[b]
  rationale: 대상 절과 무관한 45:6 번역 및 각주를 전면 교체했습니다. 본문은 첫 ‘하나님’을 ‘기름부으셨습니다’의 주어로 읽되, 히브리어에서 가능한 호격 독법을 각주에 보존했습니다. 비교 표현 ‘동료들보다 더’는 원문의 비교 의미를 유지하도록 별도 문장으로 처리했으며, 우월성의 구체적 방식은 원문이 명시하지 않으므로 첨가하지 않았습니다.
