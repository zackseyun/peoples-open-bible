id: HAG.2.22
reference: Haggai 2:22
source:
  edition: WLC
  text: וְ/הָֽפַכְתִּי֙ כִּסֵּ֣א מַמְלָכ֔וֹת וְ/הִ֨שְׁמַדְתִּ֔י חֹ֖זֶק מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וְ/הָפַכְתִּ֤י מֶרְכָּבָה֙ וְ/רֹ֣כְבֶ֔י/הָ וְ/יָרְד֤וּ סוּסִים֙ וְ/רֹ֣כְבֵי/הֶ֔ם אִ֖ישׁ בְּ/חֶ֥רֶב אָחִֽי/ו׃
translation:
  text: I will overturn royal thrones[a] and destroy the power of the nations’ kingdoms. I will overturn chariots and their riders; horses and their riders will fall, each man by his comrade’s sword[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the throne of kingdoms”; the singular can represent royal power collectively.
    reason: lexical_alternative
  - marker: b
    text: Literally, “each by the sword of his brother.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָפַכְתִּי
  chosen: I will overturn
  alternatives:
  - I will overthrow
  - I will turn over
  lexicon: HALOT
  rationale: הפך in this judgment context conveys overturning/overthrowing established powers. 'Overturn' preserves the concrete imagery and works for both the throne and the chariot in this verse.
- source_word: כִּסֵּא מַמְלָכוֹת
  chosen: the throne of kingdoms
  alternatives:
  - the thrones of kingdoms
  - the royal throne of kingdoms
  lexicon: HALOT
  rationale: כִּסֵּא is singular in the Hebrew. The singular likely functions collectively or symbolically for royal rule; 'the throne of kingdoms' preserves the singular form without over-interpreting.
- source_word: וְהִשְׁמַדְתִּי
  chosen: I will destroy
  alternatives:
  - I will annihilate
  - I will wipe out
  lexicon: HALOT
  rationale: The Hiphil of שׁמד is a strong judgment verb. 'Destroy' is forceful and idiomatic without overstating beyond the text.
- source_word: חֹזֶק
  chosen: the strength
  alternatives:
  - the might
  - the power
  lexicon: HALOT
  rationale: חֹזֶק denotes strength or might. 'Strength' is a straightforward rendering and pairs naturally with political kingdoms.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  chosen: the kingdoms of the nations
  alternatives:
  - the kingdoms of the Gentiles
  - the kingdoms of the peoples
  lexicon: HALOT
  rationale: גּוֹיִם here refers to foreign nations in a geopolitical sense. 'Nations' is the clearest modern English rendering in prophetic judgment context.
- source_word: מֶרְכָּבָה
  chosen: the chariot
  alternatives:
  - the war chariot
  - the chariot-force
  lexicon: HALOT
  rationale: The singular is retained. While it may stand collectively for military power, 'the chariot' best preserves the Hebrew image and allows the context to supply the military sense.
- source_word: וְרֹכְבֶיהָ
  chosen: its riders
  alternatives:
  - its rider
  lexicon: HALOT
  rationale: The participle is masculine plural construct with a feminine singular possessive suffix referring to the chariot. 'Its riders' preserves both the plural occupants and the singular antecedent, as well as the repeated plural 'riders' in the following horse clause. The chariot may represent military transport collectively; that does not require turning its occupants into one rider. 'The chariots and their riders' would make the collective sense explicit but would no longer preserve the source's singular chariot image.
- source_word: וְיָרְדוּ
  chosen: will go down
  alternatives:
  - will fall
  - will be brought down
  lexicon: HALOT
  rationale: ירד literally means 'go down' or 'descend.' In battle context it implies falling in defeat, but 'go down' preserves the Hebrew wording and imagery.
- source_word: סוּסִים
  chosen: horses
  alternatives:
  - warhorses
  lexicon: HALOT
  rationale: The plain lexical sense is 'horses.' The military context is already clear from 'chariot' and 'riders,' so no expansion is necessary.
- source_word: וְרֹכְבֵיהֶם
  chosen: their riders
  alternatives:
  - their horsemen
  lexicon: HALOT
  rationale: '''Their riders'' is the most direct rendering. ''Horsemen'' is possible but slightly more interpretive.'
- source_word: אִישׁ בְּחֶרֶב אָחִיו
  chosen: each by the sword of his brother
  alternatives:
  - each by his brother's sword
  - each against his brother with the sword
  lexicon: HALOT
  rationale: This idiom expresses mutual slaughter or internecine conflict. 'Each by the sword of his brother' stays close to the Hebrew while remaining intelligible. 'His brother' is retained as gender-accurate and idiomatic per translation philosophy.
