- source_word: חֲנוֹךְ
  chosen: Enoch
  alternatives:
  - Hanokh
  lexicon: HALOT
  rationale: Proper personal name; per translation philosophy, personal names are transliterated by standard English convention rather than translated. 'Enoch' is the established English form of חֲנוֹךְ.
- source_word: מְתוּשֶׁלַח
  chosen: Methuselah
  alternatives:
  - Methushelah
  lexicon: HALOT
  rationale: Proper personal name in a genealogy; transliterated using the conventional English form 'Methuselah.'
- source_word: לָמֶךְ
  chosen: Lamech
  alternatives:
  - Lamek
  lexicon: HALOT
  rationale: Proper personal name; rendered by the standard English transliteration 'Lamech.'
- source_word: — (genealogical sequence)
  chosen: comma-separated list
  alternatives:
  - '''Enoch fathered Methuselah, Methuselah fathered Lamech'''
  rationale: The Hebrew here consists only of three names without an explicit verb, continuing the genealogical list style from the surrounding verses. English preserves this terse list format rather than supplying repeated verbs not present in this verse.
