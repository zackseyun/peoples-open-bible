revisions:
- from: 그러므로, 보십시오. 때가 이전의 것들보다 더 빨리 지나가고, 지나간 것들보다 더 빠르게 계절이 흐르며, 현재의 것들보다 더 빨리 해들이 움직이는 날들이 올 것입니다.[a]
  to: 그러므로 보십시오. 때가 이전의 때보다 더 빨리 지나가고, 계절이 지나간 계절보다 더 빨리 지나가며, 해가 현재의 해보다 더 빨리 흘러갈 날들이 올 것입니다.
  rationale: 원문의 예언적 미래 진술과 ‘때—계절—해’의 점층적 병렬을 그대로 유지하면서, 각 비교 대상의 지시를 명료하게 했습니다. 시간의 속도감을 뜻하는 비유를 해석적으로 확대하지 않았으며, 내용이 제공되지 않은 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:18Z'
