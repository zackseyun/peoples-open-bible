base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/007.yaml
  text: Gilead is mine, and Manasseh is mine; Ephraim is the defense of my head; Judah is my scepter.[a]
  footnotes:
  - marker: a
    text: Or 'my lawgiver' or 'my ruler’s staff.' The Hebrew term can refer to one who decrees or to the staff/scepter that symbolizes rule.
    reason: alternative_reading
translation:
  language: ko
  text: 길르앗은 내 것이며, 므낫세도 내 것이다. 에브라임은 내 머리의 요새이며, 유다는 나의 홀이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나의 통치 지팡이’ 또는 ‘나의 법을 세우는 이’. 히브리어는 법령을 내리는 사람을 가리킬 수도 있고, 통치를 상징하는 지팡이 또는 홀을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: So that
  chosen_korean: 그리하여
  alternatives_korean:
  - 그것은 ~하기 위하여
