base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/083.yaml
  text: Jesus said[1], "The images are manifest to humanity, and the light that is within them is hidden in the image of the light of the Father. He will be revealed[2], and his image is hidden by his light."
translation:
  language: zh_hans
  text: 耶稣说：“众形象显现在人面前，而其中的光，却隐藏在父之光的形象里。他[a]将显现出来，而他的形象被他的光遮藏。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”也可译作“它”。科普特语的阳性单数代词既可指“父”，也可指“光”，因为这两个名词在语法上都是阳性。若指“光”，本句可译为：“它将显现出来，而它的形象被它的光遮藏。”
    reason: 保留代词所指的真实语法歧义。
lexical_decisions:
- source_word: ⲛϩⲓⲕⲱⲛ
  choice: 众形象
  rationale: 这是借自希腊语 εἰκών 的复数形式，指可见的形象或表象；译作“众形象”既保留复数，也避免将其限定为偶像或肖像。
- source_word: ⲥⲉⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: 显现在
  rationale: 该状态式表示处于显明、可见的状态；“显现在人面前”在现代汉语中自然，并与后文“隐藏”形成对照。
- source_word: ⲙ̄ⲡⲣⲱⲙⲉ
  choice: 在人面前
  rationale: ⲡⲣⲱⲙⲉ 是单数类称，可泛指人或人类；此处译为“人”保留其集合性，又不把原文强行解释为某一个人。
- source_word: ϩⲏⲡ⳿ / ϩⲱⲡ
  choice: 隐藏／遮藏
  rationale: 该词表示隐藏、遮蔽。前句译“隐藏”以表达状态，末句因有 ϩⲓⲧⲛ（借着、由于）而译“被……遮藏”，保留光既显明又遮蔽的张力。
- source_word: ϭⲱⲗⲡ⳿ ⲉⲃⲟⲗ
  choice: 显现出来
  rationale: 此复合动词在这里是不及物或被动意义“被揭示、显露”；译文保留它与“隐藏”的反义对照，不采用“脱去”等不合语境的解释。
- source_word: ⲡⲟⲩⲟⲉⲓⲛ ⲙ̄ⲡⲉⲓⲱⲧ
  choice: 父之光
  rationale: 直译为“父的光”；采用庄重而清楚的“父之光”，不额外加入“天父”等原文没有的限定。
theological_decisions:
- issue: “他将显现出来”中阳性单数代词的所指
  choice: 正文用“他”，允许理解为父
  alternative: “它将显现出来，而它的形象被它的光遮藏”，将代词理解为“光”
  rationale: 科普特语前缀 ϥ- 为阳性单数，“父”和“光”在语法上都属阳性，因此所指并不确定。正文承接最近的具位称谓“父”而用“他”，但以脚注明确保留“光”的可能读法，不把神学所指定死。
- issue: 光与形象之间显明和隐藏的张力
  choice: 保留“父将显现”与“他的形象被他的光遮藏”并置
  alternative: 将末句解释成光揭示形象
  rationale: 原文末句明确使用“隐藏”词根，并以 ϩⲓⲧⲛ 表示媒介或原因。译文不消解光既与显现相关、又遮藏形象的悖论性表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“众形象—光—父之光的形象—他的形象”维持原文关键词的重复和结构关联；不引入特定宗派术语。脚注标记已在正文以[a]出现。
