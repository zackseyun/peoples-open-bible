- from: 그때에 나는 예루살렘을 등불로 샅샅이 뒤지고, 자기 찌꺼기 위에 눌어붙어 있는 사람들을 벌하겠습니다. 그들은 마음속으로 ‘야훼께서는 선을 행하지도 않으시고, 악을 행하지도 않으실 것이다’라고 말합니다.[a]
