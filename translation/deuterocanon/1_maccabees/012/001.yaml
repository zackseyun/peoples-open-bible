  text: Καὶ ἰδὼν Ἰωναθὰν ὅτι ὁ καιρὸς αὐτῷ συνεργεῖ, καὶ ἐπέλεξεν ἄνδρας, καὶ ἀπέστειλεν εἰς Ῥώμην στῆσαι καὶ ἀνανεῶσαι τὴν πρὸς αὐτοὺς φιλίαν·
