id: PSA.89.32
reference: Psalms 89:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם חֻקֹּתַ֥/י יְחַלֵּ֑לוּ וּ֝/מִצְוֺתַ֗/י לֹ֣א יִשְׁמֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/032.yaml
  text: Then I will punish their transgression with the rod[a], and their iniquity with blows.
  footnotes:
  - marker: a
    text: Or 'violate my statutes.' The Hebrew verb can denote profaning or treating as defiled/common; 'profane' preserves the stronger force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 내가 그들의 반역을 막대기로 벌하고, 그들의 죄악을 매질로 벌하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 막대기로 그들의 반역을 찾아 벌하고, 매질로 그들의 죄악을 찾아 벌하겠습니다.’ 히브리어 동사는 ‘찾아가다, 돌보다, 살피다’라는 뜻도 지니지만, 여기서는 막대기와 매질이 함께 언급되므로 벌한다는 뜻이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  english_pob_choice: my statutes
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 율례들
  - 내 법도들
  lexicon: HALOT
  rationale: 규례들은 정해진 규정·법령의 뜻을 자연스럽게 살리면서, 뒤의 ‘명령들’과도 구별됩니다.
- source_word: יְחַלֵּלוּ
  english_pob_choice: profane
  chosen_korean: 더럽히고
  alternatives_korean:
  - 모독하고
  - 속되게 하고
  - 범하고
  lexicon: HALOT
  rationale: 이 동사는 단순 위반보다 거룩한 것을 속되게 다루는 강한 뉘앙스를 가지므로, ‘더럽히다’가 그 훼손성과 경멸적 처리의 감각을 잘 드러냅니다.
- source_word: מִצְוֺתַי
  english_pob_choice: and my commandments
  chosen_korean: 내 명령들
  alternatives_korean:
  - 내 계명들
  - 내 법도들
  lexicon: HALOT
  rationale: 명령들은 מִצְוָה의 직접적 의미를 살리며, 규례들과의 병행 구조도 자연스럽게 유지합니다.
- source_word: יִשְׁמֹרוּ
  english_pob_choice: keep
  chosen_korean: 지키지
  alternatives_korean:
  - 준수하지
  - 간수하지
  - 따르지
  lexicon: HALOT
  rationale: 언약적·법적 문맥에서 ‘keep’는 ‘지키다’가 가장 자연스럽고 관용적인 대응입니다.
theological_decisions:
- issue: יְחַלֵּלוּ의 강한 종교적 훼손 의미
  chosen_reading: ‘더럽히고’로 번역해 단순한 규정 위반보다 거룩한 질서를 훼손하는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘위반하고’
  - ‘모독하고’
  rationale: 히브리어의 핵심은 불순종 자체보다 거룩한 것을 속되게 만드는 행위이므로, 한국어에서도 그 중량감을 보존하는 쪽이 본문에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
