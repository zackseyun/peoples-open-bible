  from: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
  to: For bodily training has limited value[a], but godliness is valuable in every way, since it holds the promise of life both now and in the life to come.
  rationale: The lexical history recognizes both extent and duration for 'a little,' but its choice of duration is less persuasive than the immediate contrast with comprehensive benefit. I retain the temporal reading as an alternative and preserve the creation-friendly acknowledgment that bodily training has value.
