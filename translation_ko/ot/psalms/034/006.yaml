source:
  edition: WLC
  text: זֶ֤ה עָנִ֣י קָ֭רָא וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗י/ו הוֹשִׁיעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/006.yaml
  text: This poor man cried out[a], and Yahweh heard and saved him[b] from all his troubles.
  footnotes:
  - marker: a
    text: Or “afflicted man” or “poor one.” The Hebrew can denote poverty, affliction, or humble lowliness.
    reason: lexical_alternative
  - marker: b
    text: Or “delivered him” or “rescued him.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이 가난한 사람[a]이 부르짖으니, 야훼께서 들으시고 그의 모든 환난에서 그를 구원하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고난당하는 사람’, ‘낮은 사람’. 히브리어 עָנִי는 가난, 고난, 또는 겸손하고 낮은 처지를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘건져 내셨습니다’, ‘구출하셨습니다’. 히브리어 동사는 위험이나 곤경에서 구원하는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּ֣יטוּ אֵלָ֣י/ו
  english_pob_choice: looked to him
  chosen_korean: 주님을 바라보았고
  alternatives_korean:
  - 그를 바라보았고
  - 주님께 시선을 두었고
  lexicon: HALOT
  rationale: 히브리어 동사는 단순한 시선 이동보다 ‘바라보다/응시하다’의 의미가 있어, 시적 문맥에서 자연스럽고 간결한 ‘바라보았고’로 옮겼습니다. 대명사 대상을 ‘주님’으로 풀어 독자가 주어를 명확히 이해하도록 했습니다.
- source_word: וְנָהָרוּ
  english_pob_choice: were radiant
  chosen_korean: 빛났으며
  alternatives_korean:
  - 환하게 빛났으며
  - 광채를 발했으며
  lexicon: HALOT
  rationale: 어근은 어떤 문맥에서는 ‘흐르다’도 가능하지만, 여기서는 얼굴과 수치의 병행 구조 안에서 밝아지는 의미가 자연스러워 ‘빛났으며’로 옮겼습니다.
- source_word: אַל יֶחְפָּרוּ
  english_pob_choice: were not put to shame
  chosen_korean: 수치를 당하지 않았습니다
  alternatives_korean:
  - 부끄러움을 당하지 않았습니다
  - 수치를 입지 않았습니다
  lexicon: HALOT
  rationale: 히브리어는 단순 내적 감정보다 공개적 수치/굴욕의 의미를 담을 수 있어, 한국어에서도 그 뉘앙스를 살린 ‘수치를 당하다’로 번역했습니다.
theological_decisions:
- issue: אֵלָיו의 읽기 전통(‘to him’ vs. ‘to me’)
  chosen_reading: 본문은 문맥에 맞는 3인칭 ‘그/주님’을 따라 옮기고, 읽기 전통의 차이는 각주로 보존했습니다.
  alternative_readings:
  - ‘나에게’로 읽을 가능성
  rationale: 시편의 문맥에서는 주님을 향해 바라보는 대상이 자연스러우므로 3인칭이 본문 흐름에 더 잘 맞습니다. 다만 자음 전통에 남아 있는 1인칭 가능성은 삭제하지 않고 각주로 남겨, 실제 본문 변이를 가릴 수 있도록 했습니다.
  doctrine_reference: Translation philosophy §3 (실제 본문 변이와 긴장 보존)
