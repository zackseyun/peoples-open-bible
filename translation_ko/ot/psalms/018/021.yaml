source:
  edition: WLC
  text: כִּֽי שָׁ֭מַרְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹֽא רָ֝שַׁ֗עְתִּי מֵ/אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/021.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
  footnotes:
  - marker: a
    text: Or, 'I have not done wickedly by departing from my God.' The Hebrew verb can be rendered more literally as 'acted wickedly,' with the following phrase expressing separation from God.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 야훼의 길들을 지켰고, 내 하나님에게서 악하게 떠난 적이 없기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִגְמְלֵנִי
  english_pob_choice: has dealt with me
  chosen_korean: 보응하셨습니다
  alternatives_korean:
  - 대하셨습니다
  - 갚으셨습니다
  - 행하셨습니다
  lexicon: HALOT
  rationale: גמל은 행위에 상응하는 처우를 뜻할 수 있으므로, 첫 절과 평행을 이루는 보응/갚음의 의미를 살리되 한국어에서는 시적·법정적 뉘앙스가 모두 가능한 ‘보응하셨습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: יהוה의 고유명을 제목이나 대체어로 바꾸지 않고, 프로젝트 기본값에 따라 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: כְּצִדְקִי
  english_pob_choice: according to my righteousness
  chosen_korean: 내 의에 따라
  alternatives_korean:
  - 내 의로 말미암아
  - 내 의로움에 따라
  - 내 올바름에 따라
  lexicon: HALOT
  rationale: צדק은 여기서 시편 화자의 올바른 행실/정당함을 가리키므로, doctrinally 둔화하지 않고 ‘의’로 직역에 가깝게 유지했습니다.
- source_word: כְּבֹר יָדַי
  english_pob_choice: according to the cleanness of my hands
  chosen_korean: 내 손의 깨끗함에 따라
  alternatives_korean:
  - 내 손의 청결에 따라
  - 내 손의 결백에 따라
  - 내 손의 깨끗한 행위에 따라
  lexicon: HALOT
  rationale: ‘손의 깨끗함’은 무고함과 정결한 행위를 가리키는 관용구이므로, 비유를 살려 손을 그대로 유지하고 ‘깨끗함’으로 표현했습니다.
- source_word: יָשִׁיב לִי
  english_pob_choice: he has repaid me
  chosen_korean: 내게 갚으셨습니다
  alternatives_korean:
  - 내게 돌려주셨습니다
  - 내게 보답하셨습니다
  - 내게 되돌리셨습니다
  lexicon: HALOT
  rationale: שוב의 사역형은 여기서 ‘되돌림’보다 상응하는 보상/배상 의미가 강하므로, 첫 절과 맞물리는 ‘갚다’로 번역했습니다.
theological_decisions:
- issue: ‘내 의’가 자기의로 읽힐 가능성
  chosen_reading: 화자가 자신의 언약적·행위적 정당성을 말하는 것으로 그대로 유지했습니다.
  alternative_readings:
  - 내 결백
  - 내 정당한 사유
  rationale: 히브리어 본문이 1인칭 소유격과 צדק을 분명히 사용하므로, 신학적 부담을 이유로 약화하지 않았습니다. 시편의 맥락에서는 절대적 무죄 선언이 아니라 해당 국면에서의 무고함과 정당한 처지를 말합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
