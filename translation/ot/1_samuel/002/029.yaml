    prior_rendering: Why do you scorn
    new_rendering: Why do you and your sons scorn
    rationale: The opening verb is plural, addressing the offending family, before the following singular verb focuses on Eli personally.
  - source_phrase: בְּזִבְחִי וּבְמִנְחָתִי
    prior_rendering: my sacrifice and my offering
