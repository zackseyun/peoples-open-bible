  rationale: 절의 중반부가 「그의 종들에게 이르되 … 여기 있으라 … 돌아오리라 하고」라는 개역 계열 문어체로 떨어지고 구두점도 사라졌으며, 서술 종결도 「데리고 갔다」로 해라체가 섞여 있었습니다. 서술은 합쇼체로, 인용은 앞뒤 절과 같은 겹따옴표로 정리하고 문장 부호를 넣었습니다. 이 절의 review_pass revised_text는 롯과 땅의 상속을 말하는 전혀 다른 본문이어서 채택하지 않았습니다. 이 절의 source.text는 비어 있고 상위 장 파일의 게으즈 행 목록에도 2절이 없으므로 의미는 바꾸지 않았습니다.
