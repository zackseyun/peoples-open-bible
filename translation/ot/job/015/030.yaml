id: JOB.15.30
reference: Job 15:30
source:
  edition: WLC
  text: לֹֽא יָס֨וּר מִנִּי חֹ֗שֶׁךְ יֹֽ֭נַקְתּ/וֹ תְּיַבֵּ֣שׁ שַׁלְהָ֑בֶת וְ֝/יָס֗וּר בְּ/ר֣וּחַ פִּֽי/ו־׀־׃
translation:
  text: He will not escape from darkness; a flame will dry up his shoot, and he will be swept away by the breath of his mouth[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “His mouth” may refer either to the wicked man or to God; the Hebrew does not explicitly identify a new subject.
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר ... מִנִּי חֹשֶׁךְ
  chosen: He will not depart from darkness
  alternatives:
  - He will not turn aside from darkness
  - He will not escape darkness
  lexicon: HALOT
  rationale: סור commonly means 'turn aside, depart, remove oneself.' With מן plus 'darkness,' the sense is that the wicked person cannot get away from darkness/calamity. 'Depart from darkness' is formally close while still natural English; 'escape darkness' is interpretive and therefore kept as an alternative.
- source_word: יֹנַקְתּוֹ
  chosen: his shoot
  alternatives:
  - his suckers
  - his tender branch
  - his sapling
  lexicon: HALOT
  rationale: The Hebrew plant term is singular.
- source_word: תְּיַבֵּשׁ שַׁלְהָבֶת
  chosen: a flame will dry up
  alternatives:
  - a flame will wither
  - a blazing flame will dry up
  lexicon: HALOT
  rationale: יבש in the Piel means 'dry up, wither.' שלהבת denotes flame/blaze. 'A flame will dry up' preserves the image of scorching destruction against the plant metaphor.
- source_word: וְיָסוּר
  chosen: he will pass away
  alternatives:
  - he will depart
  - it will be swept away
  lexicon: HALOT
  rationale: The second סור likely shifts from inability to escape to actual removal/perishing. Because the subject is masculine singular and the verse concerns the wicked person, 'he will pass away' communicates the result in idiomatic English. A more wooden 'he will depart' is possible but less clear in context.
- source_word: בְּרוּחַ פִּיו
  chosen: by the breath of his mouth
  alternatives:
  - by the wind of his mouth
  - by the blast of his mouth
  lexicon: HALOT
  rationale: רוּחַ can mean breath, wind, or spirit. With 'of his mouth,' the concrete sense 'breath' is primary. The phrase may evoke destructive utterance or divine blast; 'breath of his mouth' preserves the ambiguity better than 'wind.'
- source_word: פִּיו
  chosen: his mouth
  alternatives:
  - His mouth
  lexicon: HALOT
  rationale: The 3ms suffix most naturally refers back to the wicked man in the immediate syntax. Some interpreters take it as God's mouth, but the Hebrew does not explicitly mark a subject change; the main text preserves the nearer grammatical referent, with the alternative noted theologically.
- source_word: לֹא יָסוּר מִנִּי חֹשֶׁךְ
  chosen: He will not escape from darkness
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural contextual expression of inability to get free from darkness.
- source_word: וְיָסוּר בְּרוּחַ פִּיו
  chosen: he will be swept away by the breath of his mouth
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Expresses removal under the force of the breath without deciding whose mouth is meant.
