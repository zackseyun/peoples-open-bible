  alternatives:
  - those who act lawlessly
  rationale: The noun is broader than rebellion alone; preserve the moral accusation
    without narrowing it.
theological_decisions:
- issue: The earth's role in the accusation
  chosen_reading: The earth is personified as accusing the rebellious ones.
  alternative_readings:
  - The earth laments their wrongdoing.
  rationale: The Ge'ez makes the earth the acting subject and uses a verb of complaint
    or accusation; it does not name an additional speaker or judge.
