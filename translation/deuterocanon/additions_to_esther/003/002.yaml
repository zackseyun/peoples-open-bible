  meaning: Mordecai acknowledges God’s rule over everything and declares that no one can prevent him from saving Israel.
  meaning_decisions:
  - source_phrase: βασιλεῦ πάντων κρατῶν
    prior_rendering: King over all powers
    new_rendering: you are King over all
    rationale: In this construction, κρατῶν is best understood as the participle “ruling,” with πάντων expressing the scope of that rule, rather than as a plural noun naming separate powers.
  - source_phrase: ἐν ἐξουσίᾳ σου τὸ πᾶν ἐστιν
    prior_rendering: everything is in your authority
    new_rendering: everything is under your authority
    rationale: “Under your authority” naturally conveys universal subjection to God’s rule, not merely his ability to act.
  - source_phrase: οὐκ ἔστιν ὁ ἀντιδρῶσων σοι
    prior_rendering: there is no one who can oppose you
    new_rendering: No one can thwart you
    rationale: The point is that no opposition can frustrate God’s saving purpose, not that no one will attempt to oppose him.
  - source_phrase: ἐν τῷ θέλειν σε
    prior_rendering: when you desire
    new_rendering: when you choose
    rationale: In this assertion of sovereignty, the verb expresses God’s will to act rather than an unrealized wish.
