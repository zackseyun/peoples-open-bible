translation:
  language: ko
  text: 야훼께서 의인의 모든 뼈를 지키십니다[a]. 그 가운데 하나도 부러지지 않습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''지키십니다''는 ''보호하십니다'' 또는 ''보존하십니다''로도 옮길 수 있습니다.'
