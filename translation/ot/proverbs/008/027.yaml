  - Translate in a way that foregrounds later christological interpretation of Wisdom
  rationale: The verse belongs to personified Wisdom's creation speech. The translation should preserve the poetic imagery and theological openness of the Hebrew text without resolving broader interpretive debates beyond what the verse itself states.
  doctrine_reference: Preserve theological tension rather than resolve it.
