id: PSA.80.1
reference: Psalms 80:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֹ֘עֵ֤ה יִשְׂרָאֵ֨ל הַאֲזִ֗ינָ/ה נֹהֵ֣ג כַּ/צֹּ֣אן יוֹסֵ֑ף יֹשֵׁ֖ב הַ/כְּרוּבִ֣ים הוֹפִֽיעָ/ה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/001.yaml
  text: Shepherd of Israel, give ear, you who lead Joseph[b] like a flock; you who are enthroned above the cherubim[a], shine forth.
  footnotes:
  - marker: a
    text: Or 'enthroned between the cherubim.' The Hebrew literally says 'sitting/dwelling [among/upon] the cherubim,' a standard expression for God's royal presence.
    reason: alternative_reading
  - marker: b
    text: '''Joseph'' here likely stands for the people of Israel, especially the northern tribes, though the Hebrew text retains the personal name.'
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘의 목자여, 귀를 기울이소서. 요셉을 양 떼처럼 인도하시는 분이여[b], 그룹들 위에 좌정하시는 분이여[a], 빛을 비추소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그룹들 사이에 좌정하시는 분이여.” 히브리어는 문자적으로 “그룹들에/그룹들과 함께 앉아 계시는 분”이라고 하며, 정확한 공간 관계는 명시하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 “요셉”은 이스라엘 백성, 특히 북쪽 지파들을 가리킬 수 있으나, 히브리어 본문은 인명 “요셉”을 그대로 사용합니다.
    reason: cultural_note
