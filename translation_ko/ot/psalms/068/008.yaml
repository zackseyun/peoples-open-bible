  text: The earth quaked; even the heavens poured down before God—Sinai itself—before God, the God of Israel.
translation:
  language: ko
  text: 땅이 진동하였고, 하늘도 하나님 앞에서 비를 내렸습니다. 이 시내 산도 하나님, 곧 이스라엘의 하나님 앞에서 그러하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님이여
  alternatives_korean:
  - 하나님
  lexicon: HALOT
  rationale: 시편의 머리말에서 하나님께 직접 호소하는 문맥이므로, 한국어에서는 호격을 드러내는 '하나님이여'가 원문의 직접 주소 기능을 가장 자연스럽게 나타냅니다.
- source_word: בְּצֵאתְךָ
  english_pob_choice: when you went out
  chosen_korean: 나가실 때
  alternatives_korean:
  - 나가실 때에
  - 나가실 때는
  lexicon: HALOT
  rationale: ב + יצא의 시간적 용법을 한국어의 종속절 '…할 때'로 옮겨, 사건의 회상이라는 시적 흐름을 살렸습니다.
- source_word: לִפְנֵי עַמֶּךָ
  english_pob_choice: before your people
  chosen_korean: 주의 백성 앞에서
  alternatives_korean:
  - 주의 백성 앞에
  - 백성 앞에서
  lexicon: HALOT
  rationale: לִפְנֵי의 공간적·인도자적 이미지를 '앞에서'로 살려, 하나님이 백성의 선두에 서 계신다는 뉘앙스를 유지했습니다.
- source_word: בִישִׁימוֹן
  english_pob_choice: through the wilderness
  chosen_korean: 광야를
  alternatives_korean:
  - 광야를 지나
  - 광야에서
  lexicon: HALOT
  rationale: יְשִׁימוֹן은 황량한 광야 지대를 가리키므로, 한국어에서는 익숙한 성경어 '광야'를 사용하되 이동 동사 '걸으실 때'와 함께 자연스럽게 이동 감각을 전달했습니다.
theological_decisions:
- issue: 시적 화자에 의한 직접 주소 유지
  chosen_reading: 이 절은 하나님을 제3자가 서술하는 문장이 아니라, 회중이 하나님께 직접 말하는 형식으로 옮겼습니다.
  alternative_readings:
  - 하나님이 주의 백성 앞에서 나가셨을 때, 광야를 걸으셨습니다
  rationale: 히브리어 머리말의 אֱלֹהִים은 본문 맥락상 호격적으로 기능하며, 시편의 찬양·회상 구조도 직접 호소를 지지하므로 한국어에서도 직접 주소를 유지하는 편이 원문 기능을 더 잘 드러냅니다.
  doctrine_reference: 시편 68편의 예배적-기억적 화법
- issue: סֶלָה의 처리
  chosen_reading: 의미를 확정 번역하지 않고 '셀라'를 음역으로 유지했습니다.
  alternative_readings:
  - 잠시 멈춤
  - 연주
  rationale: 표현의 정확한 기능이 확정되지 않았으므로, 해석을 과도하게 단정하지 않기 위해 전통적 음역을 보존했습니다.
  doctrine_reference: 본문의 불확정 표지 보존 원칙
