id: PSA.41.2
reference: Psalms 41:2
source:
  edition: WLC
  text: יְהוָ֤ה יִשְׁמְרֵ֣/הוּ וִֽ֭/יחַיֵּ/הוּ יאשר בָּ/אָ֑רֶץ וְ/אַֽל תִּ֝תְּנֵ֗/הוּ בְּ/נֶ֣פֶשׁ אֹיְבָֽי/ו׀־׃
translation:
  text: Yahweh will guard him and keep him alive; he will be called blessed in the land. Do not give him over to the will of his enemies.
  philosophy: dynamic
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: יִשְׁמְרֵהוּ
  chosen: will guard him
  alternatives:
  - will guard him
  - will preserve him
  lexicon: HALOT
  rationale: “Guard” clearly expresses protective keeping and avoids overlap with the following verb.
- source_word: וִיחַיֵּהוּ
  chosen: and keep him alive
  alternatives:
  - and keep him alive
  - and revive him
  lexicon: HALOT
  rationale: The Piel means to preserve alive or keep alive.
- source_word: יאשר
  chosen: he will be called blessed
  alternatives:
  - he will be blessed
  - he will be pronounced happy
  lexicon: HALOT
  rationale: From אשר in a declarative sense, 'to call blessed' or 'pronounce happy/blessed.' The passive-like English 'will be called blessed' best reflects the Hebrew nuance that others regard or declare him blessed, rather than merely stating a condition.
- source_word: בָּאָרֶץ
  chosen: in the land
  alternatives:
  - in the earth
  - in the country
  lexicon: HALOT
  rationale: אֶרֶץ can mean land, earth, or country. In this psalmic context, 'in the land' is the most natural and specific rendering, likely referring to life within the realm of the living/community rather than the whole globe.
- source_word: וְאַל
  chosen: and do not
  alternatives:
  - and may you not
  - but do not
  lexicon: HALOT
  rationale: אַל with the following jussive addresses YHWH directly as a negative wish/prayer. 'And do not' preserves the shift from declaration to petition without overcomplicating the English.
- source_word: תִּתְּנֵהוּ
  chosen: give him over
  alternatives:
  - hand him over
  - deliver him
  lexicon: HALOT
  rationale: From נתן, here idiomatically 'give over/hand over' into another's power. 'Give him over' is clear modern English and fits the hostile context.
- source_word: בְּנֶפֶשׁ
  chosen: to the desire
  alternatives:
  - to the will
  - to the appetite
  - to the soul
  lexicon: HALOT
  rationale: נֶפֶשׁ in this idiom often means desire, appetite, or will rather than 'soul' in a modern immaterial sense. 'To the desire of his enemies' best captures the idiomatic force in context.
- source_word: אֹיְבָיו
  chosen: his enemies
  alternatives:
  - those hostile to him
  - his foes
  lexicon: HALOT
  rationale: Standard rendering of אויב. 'Enemies' is the clearest and most natural English equivalent.
- source_word: יְאֻשַּׁר / יאשר
  chosen: he will be called blessed
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The form carries the sense of being pronounced blessed.
- source_word: וְאַל תִּתְּנֵהוּ
  chosen: and do not give him over
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This is a second-person negative petition addressed to Yahweh.
