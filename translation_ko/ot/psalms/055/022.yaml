source:
  edition: WLC
  text: חָלְק֤וּ מַחְמָאֹ֣ת פִּי/ו֮ וּֽ/קֲרָב לִ֫בּ֥/וֹ רַכּ֖וּ דְבָרָ֥י/ו מִ/שֶּׁ֗מֶן וְ/הֵ֣מָּה פְתִחֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/022.yaml
  text: Cast your burden on Yahweh[a], and he will sustain you; he will never allow the righteous[b] to be shaken.
  footnotes:
  - marker: a
    text: Or 'flattering words come from his mouth'; the Hebrew expression is rare and may more specifically emphasize buttery or flattering speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'unsheathed swords.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 짐을 야훼께[a] 맡기십시오. 그가 당신을 붙들어 주실 것입니다. 그가 의인이[b] 흔들리도록 결코 내버려 두지 않으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 몫’, ‘당신의 염려’, 또는 ‘그가 당신에게 주신 것’. 히브리어의 이 희귀 명사는 사람이 짊어진 짐이나 부담 전반을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 남성 단수형 ‘의로운 사람’입니다. 여기서는 일반적으로 의로운 사람을 가리키는 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלְקוּ מַחְמָאֹת פִּי/ו
  english_pob_choice: The words of his mouth are smooth
  chosen_korean: 그의 입의 말은 매끄럽고
  alternatives_korean:
  - 그의 입의 말은 아첨합니다
  - 그의 입의 말은 미끄럽습니다
  - 그의 입의 말은 달콤합니다
  lexicon: HALOT
  rationale: 입에서 나오는 말을 ‘매끄럽다’로 옮겨, 원문의 ‘smooth/flattened’ 이미지를 살리면서도 한국어에서 자연스러운 화법으로 만들었습니다.
- source_word: וּקֲרָב לִבּוֹ
  english_pob_choice: but his heart is war
  chosen_korean: 그러나 그의 마음은 전쟁입니다
  alternatives_korean:
  - 그러나 그의 속에는 전쟁이 있습니다
  - 그러나 그의 마음은 싸움입니다
  - 그러나 그의 마음속에는 적대가 있습니다
  lexicon: HALOT
  rationale: ‘전쟁’이라는 명사적 비유를 그대로 살려, 겉의 부드러운 말과 속의 적대라는 강한 대비를 유지했습니다.
- source_word: רַכּוּ דְבָרָיו מִשֶּׁמֶן
  english_pob_choice: his words are softer than oil
  chosen_korean: 그의 말은 기름보다 더 부드럽지만
  alternatives_korean:
  - 그의 말은 기름보다 더 유하지만
  - 그의 말은 기름보다 더 다정하지만
  - 그의 말은 기름보다 더 매끄럽지만
  lexicon: HALOT
  rationale: 비교급 구조를 살려 ‘기름보다 더 부드럽다’로 옮겼고, 한국어에서는 자연스러운 연결을 위해 ‘하지만’을 뒤에 붙였습니다.
- source_word: פְתִחוֹת
  english_pob_choice: drawn swords
  chosen_korean: 뽑아낸 칼입니다
  alternatives_korean:
  - 뽑은 칼입니다
  - 칼집에서 뽑은 칼입니다
  - 칼날을 드러낸 칼입니다
  lexicon: HALOT
  rationale: 문맥상 ‘열린/뽑힌 무기’의 관용적 의미를 따라, 현대 한국어에서 즉각 이해되는 ‘뽑아낸 칼’로 번역했습니다.
