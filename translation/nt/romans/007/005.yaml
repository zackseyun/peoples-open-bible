  meaning: In their former life under the power of the flesh, sinful passions stirred up through the law worked in their bodies and bore fruit for death.
  meaning_decisions:
  - source_phrase: ὅτε … ἦμεν ἐν τῇ σαρκί
    prior_rendering: when we were in the flesh
    new_rendering: when we lived under the power of the flesh
    rationale: The expression describes their former condition governed by the flesh, not merely their bodily existence. The clarification retains Paul’s term without reducing it to a fixed formula such as “sinful nature.”
  - source_phrase: τὰ διὰ τοῦ νόμου
    prior_rendering: that came through the law
    new_rendering: aroused through the law
    rationale: Verses 7–8 explain that sin exploits the commandment to stir up sinful desire. “Aroused” conveys that relationship more clearly than wording that could suggest the law itself originated sin.
  - source_phrase: ἐν τοῖς μέλεσιν ἡμῶν
    prior_rendering: in our members
    new_rendering: in the parts of our bodies
    rationale: “Members” means bodily parts functioning as instruments of action, not members of a community. The new wording makes that bodily reference explicit.
