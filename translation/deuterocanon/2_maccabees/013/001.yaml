translation:
  text: In the one hundred forty-ninth year[a], word reached Judas and his men that Antiochus Eupator had come with a large army to attack Judea.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The year is counted according to the Seleucid era, which began in 312/311 BC.
