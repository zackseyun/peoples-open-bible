lexical_decisions:
- source_word: אַף
  english_pob_choice: Indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 또한
  - 심지어
  - 확실히
  lexicon: HALOT
  rationale: 문맥상 단순한 덧붙임이 아니라 하나님의 추가적이고 단호한 선언을 여는 강조어이므로, 현대 한국어에서 자연스러운 강조 표현인 ‘참으로’로 옮겼습니다.
- source_word: בְּכוֹר
  english_pob_choice: the firstborn
  chosen_korean: 첫째
  alternatives_korean:
  - 맏아들
  - 첫사람
