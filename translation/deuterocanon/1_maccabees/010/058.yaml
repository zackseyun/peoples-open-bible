  from: And King Alexander met him and gave him Cleopatra his daughter[a], and he held her wedding in Ptolemais, as kings do[b], with great splendor.
  to: King Alexander met him, and Ptolemy gave him his daughter Cleopatra in marriage and celebrated her wedding in Ptolemais with great splendor, as kings do.
