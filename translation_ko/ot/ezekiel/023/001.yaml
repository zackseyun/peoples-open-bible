  terminology: ‘야훼’와 ‘말씀’은 원문의 신명과 예언 문맥의 דבר를 적절히 반영합니다. 각주에서는 ‘신명사’보다 일반적으로 이해되는 ‘하나님의 이름’ 및 ‘테트라그람마톤’이라는 표현이 더 정확하고 자연스럽습니다.
