  from: And when he heard, he was greatly alarmed, and he seized the men who had come to destroy him and killed them, for he knew that they were seeking to destroy him.
  to: When John heard this, he was greatly alarmed. He seized the men who had come to kill him and killed them, for he knew they were trying to kill him.
