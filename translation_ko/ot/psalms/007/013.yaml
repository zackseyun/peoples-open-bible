  - marker: c
    text: Or 'and made it ready'.
    reason: previous_rendering
translation:
  language: ko
  text: 그를 위해 죽음의 무기들을 마련하셨고, 그의 화살들을 불화살로 만드십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불화살로’에 해당하는 히브리어는 ‘불타는’이라는 뜻으로 이해될 수 있습니다. 그러나 ‘추격하는 자들’이라는 뜻으로도 이해되어, ‘추격자들을 위해’ 또는 ‘추격자들을 향해’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
