  lexical_decisions:
  - source_word: רְאוּ
    chosen: See
    alternatives:
    - Look
    - Behold
    lexicon: HALOT
    rationale: Imperative plural of ראה, inviting direct observation. 'See' is natural modern English and preserves the force without archaic tone.
  - source_word: בְעֵינֵיכֶם
    chosen: with your own eyes
    alternatives:
    - in your eyes
    - with your eyes
    lexicon: HALOT
    rationale: The prepositional phrase is idiomatic for direct personal verification. 'With your own eyes' brings out the emphatic experiential sense better than a wooden 'in your eyes.'
  - source_word: כִּי
    chosen: that
    alternatives:
    - for
    - because
    lexicon: HALOT
    rationale: Here כִּי introduces the content of what the audience is to observe, so 'that' fits better than causal renderings.
  - source_word: קָטֹן
    chosen: small
    alternatives:
    - young
    - insignificant
    - little
    lexicon: HALOT
    rationale: The Hebrew adjective most naturally means 'small' or 'insignificant.' Given the contrast with later attainment, 'small' preserves the humble starting point without over-interpreting as age alone. The Greek parallel's 'I labored little' reflects a different Vorlage or interpretive rendering, but the Hebrew witness is primary here.
  - source_word: הָיִיתִי
    chosen: I was
    alternatives:
    - I became
    lexicon: HALOT
    rationale: Simple past of היה. 'I was' is the straightforward rendering in context.
  - source_word: וְעָמַדְתִּי
    chosen: yet I stood by
    alternatives:
    - and I stood
    - and I persisted in
    - and I took my stand in
    lexicon: HALOT
    rationale: עמד can denote standing, remaining, or persisting. With the following בָהּ ('in/by it/her'), the sense is perseverance or steadfast attachment to wisdom/instruction. 'Stood by' is idiomatic and captures committed persistence.
  - source_word: בָהּ
    chosen: it
    alternatives:
    - her
    - in it
    - by her
    lexicon: HALOT
    rationale: The feminine pronominal suffix likely refers back to Wisdom, commonly personified as feminine in Sirach. To keep the English readable and avoid over-personifying beyond the immediate wording, the main text uses 'it,' while the feminine-personified alternative is preserved in a footnote.
  - source_word: וּמְצָאתִיהָ
    chosen: and found it
    alternatives:
    - and found her
    - and attained it
    lexicon: HALOT
    rationale: מצא with feminine suffix means 'found it/her.' In context this refers to obtaining wisdom. 'Found it' matches the main-text choice for בָהּ and keeps the line concise; the personified alternative is worth preserving in a footnote.
  theological_decisions:
  - issue: Referent and personification of the feminine suffixes in בָהּ and מְצָאתִיהָ
    chosen_reading: Render with impersonal 'it' in the main text, referring to wisdom/instruction, while preserving 'her' in a footnote.
    alternative_readings:
    - Render both suffixes as 'her,' making Wisdom's personification explicit
    rationale: Sirach often personifies Wisdom as feminine, and the Hebrew grammar supports that. However, this verse alone does not require a strongly personified English rendering, and 'it' reads more naturally in modern English while still allowing the likely referent to remain clear from context. The alternative is preserved for transparency.
    doctrine_reference: Translation philosophy §§1, 3, 6
  - issue: Handling divergence between Hebrew and Greek parallel
    chosen_reading: Follow the Hebrew as the primary witness for Sirach where extant, while noting the Greek's substantially different sense in a footnote.
    alternative_readings:
    - 'Translate toward the Greek sense: ''I labored little and found for myself much rest'''
    rationale: Project policy gives primacy to the surviving Hebrew of Sirach where available. The Greek parallel here appears to reflect a different textual form or interpretive development, substantial enough that readers should be alerted rather than having the difference silently absorbed.
    doctrine_reference: 'PHILOSOPHY.md: Hebrew Sirach is translated from Hebrew where it survives; transparency principle'
