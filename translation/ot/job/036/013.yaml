  rationale: The Hebrew uses a third-person singular verb with pronominal suffix, and the immediate discourse concerns God's dealings with people through affliction. Retaining 'he' preserves the source text while allowing the contextual referent to remain clear.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
