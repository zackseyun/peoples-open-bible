  source_fidelity: 현 초안은 복수의 ‘홀로 있는 이들’과 수동적 ‘선택된 이들’을 대체로 반영하지만, ⲙⲟⲛⲁⲭⲟⲥ를 ‘외로운 이들’로 옮기면 고독·외로움의 정서가 강해져 ‘하나인/홀로 있는’이라는 어휘의 뜻을 흐립니다. 또한 ‘거기에서 왔고’는 선행하는 ‘나라’와의 지시 관계를 한국어에서 다소 불분명하게 합니다. 필사본의 복수 표현 및 선택됨의 수동·상태 의미는 유지해야 합니다.
  naturalness: ‘복됩니다’보다 ‘복이 있습니다’가 현대 정중한 문어체에서 자연스럽습니다. ‘그 나라에서 나왔으며, 다시 그리로 갈 것입니다’는 원문의 출처와 귀환의 관계를 명료하게 하면서 합쇼체 문체를 유지합니다.
  terminology: ⲙⲟⲛⲁⲭⲟⲥ는 후대 제도적 의미의 ‘수도승’으로 한정하지 않고 ‘홀로 있는 이들’로 옮겼습니다. ⲙⲛⲧⲉⲣⲟ는 본문에서는 ‘나라’로 유지하되, 지시어를 보충하여 일관성을 확보했습니다. ‘선택된’은 ⲉⲧⲥⲟⲧⲡ의 수동·상태적 의미를 보존합니다.
