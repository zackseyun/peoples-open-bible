id: PRO.16.5
reference: Proverbs 16:5
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה כָּל גְּבַהּ לֵ֑ב יָ֥ד לְ֝/יָ֗ד לֹ֣א יִנָּקֶֽה־־׃
translation:
  text: Everyone who is proud in heart is an abomination to Yahweh; be assured[a], not one will go unpunished.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “hand to hand,” understood as an assurance formula; alternatively, “though they join hands,” referring to an alliance.
    reason: alternative_reading
lexical_decisions:
- source_word: תּוֹעֲבַת
  chosen: an abomination
  alternatives:
  - detestable
  - a detestable thing
  lexicon: HALOT
  rationale: The noun denotes something abhorrent or detestable, often in covenantal/moral contexts. 'Abomination' preserves the strong moral-religious force common in Proverbs and in English Bible usage.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: כָּל
  chosen: Everyone who
  alternatives:
  - every
  - all who
  lexicon: HALOT
  rationale: Although literally 'all/every,' in English the construction 'Everyone who is proud in heart' reads naturally and accurately conveys the distributive force of the Hebrew.
- source_word: גְּבַהּ לֵב
  chosen: proud in heart
  alternatives:
  - haughty of heart
  - arrogant in heart
  lexicon: HALOT
  rationale: The phrase literally refers to one high/exalted in heart, an idiom for inward pride or arrogance. 'Proud in heart' is clear modern English while preserving the internal, dispositional emphasis of לֵב.
- source_word: יָד לְיָד
  chosen: be assured
  alternatives:
  - surely
  - be assured
  - though they join hands
  lexicon: HALOT
  rationale: The expression functions here as an assurance formula; the literal form and possible alliance sense belong in the note.
- source_word: לֹא יִנָּקֶה
  chosen: he will not go unpunished
  alternatives:
  - he will not be acquitted
  - he will not be left unpunished
  lexicon: HALOT
  rationale: This naturally expresses failure to escape punishment; the asseverative force is already conveyed by “be assured.”
