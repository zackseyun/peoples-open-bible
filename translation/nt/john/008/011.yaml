  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
translation:
  text: She said, “No one, Lord[a].” Jesus said, “Neither do I condemn you. Go, and sin no more.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “sir,” a respectful form of address.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  chosen: Lord
  alternatives:
  - sir
  - master
  lexicon: BDAG
  rationale: While 'sir' is a valid translation of the vocative 'kyrie' as a polite address, 'Lord' is traditionally retained here, reflecting a recognition of Jesus' authority.
- source_word: κατακρίνω
  chosen: condemn
  alternatives:
  - pass judgment on
  - sentence
  lexicon: BDAG
  rationale: '''Condemn'' perfectly captures the judicial sense of passing a sentence against someone, which fits the context of the scribes and Pharisees seeking to stone her.'
- source_word: μηκέτι
  chosen: no more
  alternatives:
  - no longer
  - from now on not
  lexicon: BDAG
  rationale: '''No more'' is concise and carries the temporal weight of ceasing an action from this point forward.'
