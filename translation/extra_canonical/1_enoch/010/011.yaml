translation:
  text: And the Lord said to Michael, “Go, make known to Semyaza and the others who are with him,[a] who joined themselves
    to women so that they defiled themselves with them in their impurity.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The daggered imperative in the selected Ethiopic printing says “make known/announce.” Charles proposes “bind” as
      an emendation in printed28note15. This edition keeps the difficult presented command rather than silently adopting that
      emendation; its unstated announcement is understood from the following judgment. Binding is explicit in verse12.
    reason: textual_variant
lexical_decisions:
- source_word: እግዚእ
  chosen: the Lord
  alternatives:
  - the master
  rationale: The noun denotes a lord or master; with the definite force and as the speaker issuing judgment, “the Lord” is
    the fitting divine designation without importing the divine name.
  model_suggested_lexicon_unverified: Dillmann’s Lexicon
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ሑር
  chosen: Go
  alternatives:
  - Depart
  rationale: The imperative initiates Michael’s commission; “Go” is direct, readable, and preserves the force of the angelic
    command.
  model_suggested_lexicon_unverified: Dillmann’s Lexicon
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: አይድዕ
  chosen: make known/announce
  alternatives:
  - make known
  - announce
  rationale: Retain the daggered presented Ethiopic imperative; bind is Charles’s proposed emendation, not an unmarked source
    equivalent.
  model_suggested_lexicon_unverified: Dillmann’s Lexicon
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ለስምያዛ
  chosen: Semyaza
  alternatives:
  - Semjaza
  - Shemyaza
  rationale: Uses a conventional English transliteration of the Watcher’s name while preserving the Ethiopic consonantal shape.
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ለካልኣን፡ እለ፡ ምስሌሁ
  chosen: the others who are with him
  alternatives:
  - his associates
  - his companions
  rationale: This relatively formal rendering transparently represents both “the others” and the following phrase “who are
    with him,” rather than compressing them into a single relational noun.
  model_suggested_lexicon_unverified: Dillmann’s Lexicon
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ሐብሩ፡ ምስለ፡ አንስት
  chosen: joined themselves to women
  alternatives:
  - associated with women
  - united with women
  rationale: The verb describes their association or union with women. “Joined themselves to” preserves the relational wording
    and, in context, its sexual-marital implication without adding an explicit term absent from the clause.
  model_suggested_lexicon_unverified: Dillmann’s Lexicon
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይማስኑ
  chosen: they defiled themselves
  alternatives:
  - they corrupted themselves
  - they became corrupt
  rationale: The verb conveys corruption or defilement. The reflexive English wording suits the plural actors and their participation
    in the impurity described by the following phrase.
  model_suggested_lexicon_unverified: Dillmann’s Lexicon
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በርኵሶ፡ ዚአሆን
  chosen: in their impurity
  alternatives:
  - in their uncleanness
  - by their defilement
  rationale: “Impurity” preserves the ritual and moral weight of ርኵስ better than a generic “sin,” while the possessive phrase
    is represented directly as “their.”
  model_suggested_lexicon_unverified: Dillmann’s Lexicon
  consultation_status: No independently consulted lexicon entry is claimed by this application.
