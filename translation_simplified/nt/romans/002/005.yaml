translation:
  language: en
  text: But because your heart is hard and unwilling to reorient toward God[b], you are storing up wrath for yourself for the day of wrath, when God reveals his righteous judgment.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or: “God’s just judgment.”'
    reason: lexical_alternative
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: storing up wrath for yourself on the day of wrath
  simplified_phrase: storing up wrath for yourself for the day of wrath
  preserved_meaning: The person is accumulating divine wrath now for the coming day of judgment.
  reasoning_layer_used: Immediate context and POB alternative for ἐν ἡμέρᾳ ὀργῆς
  rationale: “For the day” prevents readers from placing the storing up itself on judgment day.
- pob_phrase: the revelation of God’s righteous judgment
  simplified_phrase: when God reveals his righteous judgment
  preserved_meaning: On that day, God’s judgment will be openly revealed as righteous.
  reasoning_layer_used: POB theological decision and acknowledged contextual alternative
  rationale: A direct clause shows how the revelation relates to the day.
interpretive_expansions:
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: Changing the Greek nominal phrase into a finite clause is more explicit than the POB wording.
    mitigation: The POB audit itself recognizes this reading as contextually sound, and the wording preserves both wrath and revelation.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
