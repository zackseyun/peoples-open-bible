id: PSA.119.148
reference: Psalms 119:148
source:
  edition: WLC
  text: קִדְּמ֣וּ עֵ֭ינַ/י אַשְׁמֻר֑וֹת לָ֝/שִׂ֗יחַ בְּ/אִמְרָתֶֽ/ךָ׃
translation:
  text: I was awake before each watch of the night[a] to meditate on your promise.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The night was divided into watches, periods during which guards took turns on duty.
    reason: cultural_note
lexical_decisions:
- source_word: בְּאִמְרָתֶֽךָ
  chosen: promise
  alternatives:
  - word
  - saying
  lexicon: HALOT
  rationale: אִמְרָה in this psalm repeatedly denotes God's committed utterance on which the psalmist stakes his life; rendered 'promise' to distinguish it from דָּבָר ('word'), with 'word/saying' as alternatives.
