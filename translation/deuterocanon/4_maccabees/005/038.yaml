  text: ἀσεβῶν μὲν γὰρ τυραννήσεις· τῶν δὲ ἐμῶν περὶ τῆς εὐσεβείας λογισμῶν οὔτε λόγοις δεσπόσεις, οὔτε δι᾽ ἔργων.
