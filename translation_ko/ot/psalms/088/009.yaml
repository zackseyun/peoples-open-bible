  rationale: 명사형 ‘가증물/가증한 것’의 충격을 살리되 한국어 문맥에서는 대상화된 평가를 자연스럽게 드러내기 위해 ‘혐오스러운 존재’로 풀었습니다.
- source_word: כָּלֻא
  english_pob_choice: I am confined
  chosen_korean: 저는 갇혀서
  alternatives_korean:
  - 저는 가두어져
  - 저는 봉쇄되어
  - 저는 구금되어
  lexicon: HALOT
  rationale: 단순한 내적 상태보다 억눌린 처지를 나타내는 문맥이므로, 넓은 의미의 구속을 담는 ‘갇혀서’로 옮겼습니다.
- source_word: וְלֹא אֵצֵא
  english_pob_choice: and cannot go out
  chosen_korean: 나갈 수 없습니다
  alternatives_korean:
  - 밖으로 나가지 못합니다
  - 나가지 않습니다
  - 나올 수 없습니다
  lexicon: HALOT
  rationale: 앞의 ‘갇혀서’와 결합될 때 능력 부재의 뜻이므로 ‘나갈 수 없습니다’가 가장 자연스럽고 정확합니다.
theological_decisions:
- issue: 1인칭 화자의 곤경을 나타내는 문장의 주어·대상 관계
  chosen_reading: 문두의 ‘주께서’는 직접적인 행위자 표지로 두고, 뒤의 결과는 1인칭 탄식으로 유지했습니다.
  alternative_readings:
  - ‘하나님께서’
  - 수동적으로 풀어 ‘제 동료들이 멀어졌습니다’
  rationale: 히브리어는 2인칭 주어가 분명하므로, 고난의 책임을 신에게 직접 호소하는 시편 탄식의 긴장을 흐리지 않도록 능동형으로 살렸습니다.
  doctrine_reference: 시편 탄식문학의 직접 호소
