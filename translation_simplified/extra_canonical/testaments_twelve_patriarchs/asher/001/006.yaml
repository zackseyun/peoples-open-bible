  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/006.yaml
  text: If, then, the soul wants to walk well, it does all its actions in righteousness; and even if it sins, it immediately repents.
  revision_pass:
    model: gpt-5.4-mini
    timestamp: '2026-05-03T07:41:53Z'
    unchanged: false
    changes_summary: Adjusted 'desires' to 'wants' for a more direct rendering of θέλει, and 'deeds' to 'actions' for πράξεις; retained the rest of the draft as accurate and natural.
translation:
  language: en
  text: So if the soul wants to follow the right path, it acts righteously in everything. Even if it sins, it reorients[r1] at once.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: If, then
  simplified_phrase: So
  preserved_meaning: The statement remains a conclusion drawn from the preceding thought.
  reasoning_layer_used: POB syntax and immediate context
  rationale: “So” expresses the logical connection in natural modern English.
- pob_phrase: wants to walk well
  simplified_phrase: wants to follow the right path
  preserved_meaning: The soul desires to conduct its life rightly.
  reasoning_layer_used: POB rendering and source-language image
  rationale: The wording keeps the path image while making its moral sense clear.
- pob_phrase: does all its actions in righteousness
  simplified_phrase: acts righteously in everything
  preserved_meaning: Righteousness governs all the soul’s conduct.
  reasoning_layer_used: POB lexical choice and clause meaning
  rationale: The shorter wording avoids an unnatural phrase without weakening its scope.
translation_notes:
  risk_flags:
  - risk: “Follow the right path” makes the moral sense of “walk well” more explicit.
    mitigation: The path metaphor preserves the source image rather than replacing it with an abstract claim.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
