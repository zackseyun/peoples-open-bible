translation:
  language: ko
  text: 그리고 주님, 주님은 처음부터 우리의 하나님이시며, 우리의 희망은 주님께 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θεὸς ἡμῶν
  english_pob_choice: our God
  chosen_korean: 우리의 하나님
  alternatives_korean:
  - 우리 하나님
  - 우리의 하느님
  lexicon: θεός
  rationale: 소유 관계를 분명히 살리되, POB 기본어인 ‘하나님’을 유지했습니다.
- source_word: ἀπʼ ἀρχῆς
  english_pob_choice: from the beginning
  chosen_korean: 처음부터
  alternatives_korean:
  - 태초부터
  - 시작부터
  lexicon: ἀρχή
  rationale: 문맥상 시간의 기원을 자연스러운 현대 한국어로 옮기되, ‘from the beginning’의 범위를 과장하지 않도록 했습니다.
- source_word: ἐπὶ σὲ ἡ ἐλπὶς ἡμῶν
  english_pob_choice: on you is our hope
  chosen_korean: 주님께 우리의 희망이 있습니다
  alternatives_korean:
  - 주님 위에 우리의 희망이 있습니다
  - 우리의 희망은 주님께 있습니다
  lexicon: ἐπί + dative / ἐλπίς
  rationale: 영문 POB의 ‘on you’를 반영하면서도 한국어에서는 ‘주님께’로 옮겨, 희망의 의지 대상을 분명히 했습니다.
- source_word: Κύριε
  english_pob_choice: O Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주님이시여
  lexicon: κύριος
  rationale: 직접 호칭으로서 존칭 종결을 유지하고, 문장 전체의 현대 합쇼체와 맞추었습니다.
theological_decisions:
- issue: ‘on you is our hope’의 관계 표현
  chosen_reading: 희망이 하나님을 향해 의지되고 걸려 있다는 의미를 한국어에서 ‘주님께 우리의 희망이 있습니다’로 표현했습니다.
  alternative_readings:
  - 우리의 희망은 주님 안에 있습니다
  - 우리의 희망은 주님 위에 있습니다
  rationale: 원문의 전치사적 방향성을 살리면서도 한국어에서 어색한 직역을 피하기 위해, 희망의 ‘향함’과 ‘의존’을 모두 드러내는 표현을 택했습니다.
  doctrine_reference: 시 62:5, 렘 17:7-8과 같은 ‘여호와/하나님께 소망을 둠’의 성경적 용례
