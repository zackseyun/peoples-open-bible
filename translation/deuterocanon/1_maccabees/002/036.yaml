lexical_decisions:
- source_word: ἀπεκρίθησαν
  chosen: did not answer
  alternatives:
  - did not reply
  - did not respond
  lexicon: LSJ
  rationale: The verb commonly means to answer or reply. In this context of confrontation, 'did not answer' is the most direct and formally anchored rendering.
- source_word: λίθον
  chosen: a stone
  alternatives:
  - stone
  lexicon: LSJ
  rationale: The singular is retained in English as an idiomatic object after the verb 'hurl,' preserving the Greek wording without awkwardness.
- source_word: ἐνετίναξαν
  chosen: hurl
  alternatives:
  - throw
  - cast
  lexicon: LSJ
  rationale: The verb suggests forceful throwing or brandishing. 'Hurl' best conveys the violent action implied in context.
- source_word: ἐνέφραξαν
  chosen: block up
  alternatives:
  - close off
  - stop up
  lexicon: LSJ
  rationale: The verb means to fence in, block, or stop up. 'Block up' fits the likely sense of obstructing access to the places where they were concealed.
- source_word: τοὺς κρυφούς
  chosen: the hiding places
  alternatives:
  - the hidden places
  - the secret places
  - the concealed places
  lexicon: LSJ
  rationale: Although literally related to what is hidden, the context is tactical and spatial. 'The hiding places' gives clear English sense while remaining faithful to the Greek.
