id: PSA.103.3
reference: Psalms 103:3
source:
  edition: WLC
  text: הַ/סֹּלֵ֥חַ לְ/כָל עֲוֺנֵ֑/כִי הָ֝/רֹפֵ֗א לְ/כָל תַּחֲלֻאָֽיְ/כִי־־׃
translation:
  text: who forgives all your iniquities, who heals all your diseases,
  philosophy: dynamic
lexical_decisions:
- source_word: הַסֹּלֵחַ
  chosen: who forgives
  alternatives:
  - the one forgiving
  - who pardons
  lexicon: HALOT
  rationale: The articular participle functions substantivally within the series of relative-like descriptions of the LORD in this psalm section. English idiom is best served by 'who forgives,' which preserves the ongoing characteristic force without awkwardness.
- source_word: לְכָל
  chosen: all
  alternatives:
  - every
  - the whole of
  lexicon: HALOT
  rationale: With the following plural/collective objects, 'all' is the most natural English rendering and preserves the comprehensive scope.
- source_word: עֲוֺנֵכִי
  chosen: your iniquities
  alternatives:
  - your guilt
  - your sin
  lexicon: HALOT
  rationale: The Hebrew noun is plural and is naturally represented by the English plural.
- source_word: הָרֹפֵא
  chosen: who heals
  alternatives:
  - the one healing
  - who restores
  lexicon: HALOT
  rationale: Like the previous participle, this is a substantival articular participle describing the LORD's characteristic action. 'Who heals' is natural and structurally parallel.
- source_word: תַּחֲלֻאָיִכִי
  chosen: your diseases
  alternatives:
  - your sicknesses
  - your illnesses
  lexicon: HALOT
  rationale: The noun refers to sickness/disease. 'Diseases' is a clear, standard rendering that preserves the concrete bodily sense more strongly than the broader 'illnesses.'
