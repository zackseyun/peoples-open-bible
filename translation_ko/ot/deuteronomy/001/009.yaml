lexical_decisions:
- source_word: וָ/אֹמַ֣ר אֲלֵ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר
  english_pob_choice: And I said to you at that time, saying
  chosen_korean: 그리고 그때 내가 여러분에게 말했습니다
  alternatives_korean:
  - 그리고 그때 내가 당신들에게 말했습니다
  - 그때 내가 여러분에게 말하여 이르기를
  lexicon: אָמַר
  rationale: 히브리어 동사 ‘말하다’의 진행을 자연스러운 한국어 서술로 옮기되, 영어 POB의 ‘saying’을 위해 불필요한 직역 표현은 줄였습니다.
- source_word: לֹא אוּכַ֥ל
  english_pob_choice: I am not able
  chosen_korean: 감당할 수 없습니다
  alternatives_korean:
  - 견딜 수 없습니다
  - 할 수 없습니다
  lexicon: יָכֹל
  rationale: 단순 능력 부정이지만, 뒤의 ‘여러분’을 ‘지탱하다/감당하다’는 문맥에 맞춰 의미를 분명히 했습니다.
- source_word: לְ/בַדִּ֖/י שְׂאֵ֥ת אֶתְ/כֶם
  english_pob_choice: bear you by myself
  chosen_korean: 나 혼자서는 여러분을 감당할 수 없습니다
  alternatives_korean:
  - 나 홀로는 여러분을 떠맡을 수 없습니다
  - 나만으로는 여러분을 지탱할 수 없습니다
  lexicon: נָשָׂא
  rationale: ‘bear’는 단순히 ‘참다’보다 백성의 짐을 ‘짊어지다/감당하다’는 뜻이 더 분명하므로, 공동체를 이끄는 부담을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 모세의 한계 진술을 한국어로 어떻게 드러낼지
  chosen_reading: ‘나 혼자서는 … 감당할 수 없습니다’로 번역해 리더의 실제 한계를 분명히 했습니다.
  alternative_readings:
  - ‘나 혼자서는 … 짊어질 수 없습니다’
  - ‘내 힘만으로는 … 맡을 수 없습니다’
  rationale: 본문은 모세의 무능이 아니라, 백성을 홀로 떠맡을 수 없는 현실적 한계를 말하므로 그 긴장을 약화하지 않는 표현을 선택했습니다.
  doctrine_reference: 민수기 11장과 신명기 1장의 리더십 부담 묘사
