  from: Then I would speak and not fear him[a], for I am not so in myself.
  to: Then I would speak and not fear him, for it is not so with me.[a]
  rationale: The final clause is elliptical. “I am not so in myself” is materially unnatural in English and risks turning an opaque situational statement into a claim about Job’s intrinsic inner state. “It is not so with me” is idiomatic, remains close to the Hebrew’s “not so ... with me,” and leaves its precise implication open. The footnote should be placed on the clause it explains and should identify the ambiguity rather than present a single alternative as definitive.
