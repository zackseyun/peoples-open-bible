id: PSA.32.11
reference: Psalms 32:11
source:
  edition: WLC
  text: שִׂמְח֬וּ בַֽ/יהוָ֣ה וְ֭/גִילוּ צַדִּיקִ֑ים וְ֝/הַרְנִ֗ינוּ כָּל יִשְׁרֵי לֵֽב־־׃
translation:
  text: Be glad in Yahweh and rejoice, you righteous; shout for joy[a], all you upright in heart.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “sing for joy”; the Hebrew verb can describe a ringing cry that is shouted or sung.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂמְחוּ
  lemma: שׂמח
  chosen: Be glad
  alternatives:
  - Rejoice
  - Be joyful
  lexicon: HALOT
  rationale: Imperative plural from שׂמח, calling for joy/gladness. 'Be glad' preserves the imperative force while allowing the following גילו to be rendered distinctly as 'rejoice' rather than repeating the same English verb.
- source_word: בַיהוָה
  chosen: in Yahweh
  alternatives:
  - in Yahweh
  - in the LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: וְגִילוּ
  chosen: and rejoice
  alternatives:
  - and exult
  - and be jubilant
  lexicon: HALOT
  rationale: Imperative plural from גיל, often denoting exuberant rejoicing. 'Rejoice' is idiomatic and clear; 'exult' is possible but less natural for the target audience.
- source_word: צַדִּיקִים
  chosen: you righteous
  alternatives:
  - righteous ones
  - the righteous
  lexicon: HALOT
  rationale: Vocative/appositional use addressing the audience of the imperatives. 'You righteous' makes the direct address explicit in natural English.
- source_word: וְהַרְנִינוּ
  chosen: shout for joy
  alternatives:
  - sing for joy
  - raise a joyful shout
  lexicon: HALOT
  rationale: Hiphil imperative plural from רנן. The verb can denote ringing cries of joy, sometimes sung, sometimes shouted. 'Shout for joy' best captures the audible, exuberant imperative without over-specifying music.
- source_word: כָּל
  chosen: all
  alternatives:
  - every
  lexicon: HALOT
  rationale: Quantifier encompassing the whole addressed group.
- source_word: יִשְׁרֵי לֵב
  chosen: upright in heart
  alternatives:
  - upright of heart
  - straight in heart
  lexicon: HALOT
  rationale: Idiomatic Hebrew expression for inward moral integrity. 'Upright in heart' is natural English and preserves the internal/heart dimension rather than flattening it to merely 'sincere'.
