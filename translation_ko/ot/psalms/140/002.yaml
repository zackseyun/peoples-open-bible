  rationale: 히브리어는 אָדָם רָע와 אִישׁ חֲמָסִים를 평행으로 배치해 두 측면의 위협을 강조하므로, 한국어에서도 둘을 구분해 반복 구조를 보존했습니다.
  doctrine_reference: 'Translation philosophy: source-closely, maintain poetic parallelism'
