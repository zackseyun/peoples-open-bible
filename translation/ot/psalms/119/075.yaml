id: PSA.119.75
reference: Psalms 119:75
source:
  edition: WLC
  text: יָדַ֣עְתִּי יְ֭הוָה כִּי צֶ֣דֶק מִשְׁפָּטֶ֑י/ךָ וֶ֝/אֱמוּנָ֗ה עִנִּיתָֽ/נִי־׃
translation:
  text: I know, Yahweh, that your ordinances are righteous, and that in faithfulness you have afflicted me.
  philosophy: dynamic
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: מִשְׁפָּטֶיךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone of 'judgments'; 'judgments/rules' preserved as alternatives.
