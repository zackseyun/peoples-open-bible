  from: and you waters
  to: and waters
  rationale: The Hebrew coordinates two vocatives ('heavens of the heavens' and 'the waters') governed by a single imperative. The draft makes the vocative explicit for the second element ('and you waters') but not the first ('highest heavens'). This creates a slight, unnecessary asymmetry. The vocative sense is already clear from the governing imperative 'Praise him'. A more parallel and natural rendering would be '...highest heavens, and waters above the heavens.'
