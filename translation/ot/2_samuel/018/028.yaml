  to: Ahimaaz called out to the king, “All is well[a]!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God, who has handed over to you the men who rebelled against my lord the king.”
  rationale: The earlier notes already recognize “All is well” and “handed over” as contextual senses, and the lexical discussion identifies raising the hand as rebellion. I bring those meanings into the text while retaining the blessing, divine name, bodily prostration, and courtly address.
