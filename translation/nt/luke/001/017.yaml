  meaning: John will precede the Lord with Elijah’s prophetic spirit and power, restoring hearts and leading the disobedient into righteous wisdom to prepare a people for the Lord.
  meaning_decisions:
  - source_phrase: προελεύσεται ἐνώπιον αὐτοῦ
    prior_rendering: will go before him
    new_rendering: will go ahead of the Lord
    rationale: John’s role is to precede the coming Lord; naming the pronoun’s stated antecedent clarifies the connection to verse 16 without replacing “Lord” with a narrower identification.
  - source_phrase: ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα
    prior_rendering: to turn the hearts of fathers to children
    new_rendering: to turn the hearts of fathers toward their children
    rationale: The image concerns a restored orientation of the heart toward the children, not a transformation of fathers into children; the Malachi image remains intact.
  - source_phrase: ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον
    prior_rendering: to prepare for the Lord a people made ready
    new_rendering: to make a people ready for the Lord
    rationale: The English construction conveys both the act of preparation and its resulting readiness without redundant wording.
