  yaml_path: translation/ot/psalms/035/010.yaml
  text: All my bones will say, “O LORD, who is like you, delivering the poor from one stronger than he, and the poor and needy from the one who robs him?”
translation:
  language: ko
  text: 내 모든 뼈가 말할 것입니다. 「야훼여, 누가 주님과 같습니까? 주님은 가난한 자를 그보다 강한 자에게서 건져 내시며, 가난하고 궁핍한 자를 그를 빼앗는 자에게서 건져 내십니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַצְמוֹתַי
  english_pob_choice: All my bones
  chosen_korean: 내 모든 뼈
  alternatives_korean:
  - 내 뼈들
  - 내 온몸
  lexicon: עֶצֶם
  rationale: 히브리어 복수 표현을 한국어에서는 자연스럽게 ‘내 모든 뼈’로 옮겨, 전인적 찬양의 강조를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: O LORD
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: יהוה
  rationale: 본문의 신명 표지인 יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 직접 호칭이므로 호격 ‘-여’를 붙였습니다.
- source_word: מַצִּיל עָנִי
  english_pob_choice: delivering the poor
  chosen_korean: 가난한 자를 건지시며
  alternatives_korean:
  - 궁핍한 자를 구하십니다
  - 고난받는 자를 구원하십니다
  lexicon: נצל / עני
  rationale: POB의 확정 독법인 ‘the poor’를 따라 עָנִי를 사회적·경제적 가난을 지닌 ‘가난한 자’로 구체화하고, 동사 מַצִּיל은 구원보다 일차적 의미인 ‘건지다’로 옮겼습니다.
- source_word: עָנִי וְאֶבְיוֹן
  english_pob_choice: the poor and needy
  chosen_korean: 가난하고 궁핍한 자
  alternatives_korean:
  - 가난하고 빈곤한 자
  - 가난하고 불쌍한 자
  lexicon: עָנִי / אֶבְיוֹן
  rationale: 두 형용사의 병렬을 살려 ‘가난하고 궁핍한 자’로 옮겨, 같은 계층을 중복 강조하는 히브리 시의 뉘앙스를 보존했습니다.
- source_word: מִגֹּזְלוֹ
  english_pob_choice: from the one who robs him
  chosen_korean: 그를 노략질하는 자에게서
  alternatives_korean:
  - 그를 빼앗는 자에게서
  - 그를 강탈하는 자에게서
  lexicon: גזל
  rationale: גזל의 약탈·강탈적 폭력을 드러내기 위해 ‘노략질하는 자’로 옮겼습니다.
theological_decisions:
- issue: ‘LORD’의 한국어 신명 표기
  chosen_reading: 본문에는 ‘야훼’로 두고 직접 호격으로 처리했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: WLC의 יהוה를 가리키는 본문 표지를 한국어에서 가시적으로 보존하려는 프로젝트 원칙을 따랐습니다.
  doctrine_reference: divine-name policy
- issue: ‘poor/needy’의 사회적 지시
  chosen_reading: ‘가난한 자 / 가난하고 궁핍한 자’로 번역해 경제적·사회적 취약성을 드러냈습니다.
  alternative_readings:
  - ‘고난받는 자’
  - ‘겸손한 자’
  rationale: English POB가 확정적으로 ‘the poor’로 되돌린 점을 따라, 시적 표현을 심리적 겸손보다 실제적 빈곤과 궁핍으로 읽는 것이 문맥상 적합합니다.
  doctrine_reference: poverty in Psalms
