  from: Remove your plague from me[a][b][c]; by the blow of your hand I am consumed.
  to: Remove your stroke from me[a]; because of the attack of your hand, I am spent.[b]
  rationale: The proposal corrects real lexical and idiomatic issues. נֶגַע need not denote a disease-specific “plague”; “stroke” naturally conveys an inflicted affliction without that false precision. תִּגְרָה is hostile contention or an attack, not simply a physical “blow,” and the causal rendering of מִן is well suited to the clause. “I am spent” is a natural rendering of the speaker’s depleted state. The revised note placement is honest and useful.
