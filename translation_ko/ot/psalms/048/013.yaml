  text: Set your hearts on her rampart[a]; examine her citadels[b], so that you may tell the next generation.
  footnotes:
  - marker: a
    text: Or “her outer wall.” The Hebrew term refers broadly to a city’s fortification.
    reason: lexical_alternative
  - marker: b
    text: Or “her palaces.” The Hebrew can denote palatial buildings or fortified strongholds.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성벽[a]에 마음을 두고, 그 성채들[b]을 두루 살펴보십시오. 그리하여 다음 세대에게 전하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 방어 시설’로 옮길 수 있습니다. 히브리어는 도시의 성벽이나 외곽 방어 시설을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 궁전들’로 옮길 수 있습니다. 히브리어는 궁전 भवन 또는 요새화된 건물을 뜻할 수 있으며, 여기서는 도시의 방어 시설을 살피는 문맥에 따라 ‘성채들’로 옮겼습니다.
    reason: lexical_alternative
