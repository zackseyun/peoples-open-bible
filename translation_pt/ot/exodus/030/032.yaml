  text: עַל בְּשַׂ֤ר אָדָם֙ לֹ֣א יִיסָ֔ךְ וּ/בְ/מַ֨תְכֻּנְתּ֔/וֹ לֹ֥א תַעֲשׂ֖וּ כָּמֹ֑/הוּ קֹ֣דֶשׁ ה֔וּא קֹ֖דֶשׁ יִהְיֶ֥ה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: pt
  text: Não será derramado sobre carne humana, e vocês não farão nada semelhante a ele conforme a sua composição. Ele é santo; será santo para vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִיסָךְ
  choice: será derramado
  rationale: Mantém a forma passiva e o sentido concreto de verter ou aplicar o óleo, sem substituir o verbo pelo resultado ritual mais amplo de ungir.
- source_word: עַל בְּשַׂר אָדָם
  choice: sobre a carne humana
  rationale: Preserva בָּשָׂר como «carne» e expressa naturalmente o valor genérico de אָדָם, referente aos seres humanos em geral.
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: com a mesma composição
  rationale: מַתְכֹּנֶת designa a composição ou proporção medida da mistura; a formulação portuguesa explicita de modo natural que não se deve reproduzi-la.
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: nem fareis outro igual
  rationale: Comunica a proibição de fabricar outro óleo equivalente, preservando a força comparativa de כָּמֹהוּ.
- source_word: קֹדֶשׁ הוּא
  choice: Ele é santo
  rationale: Conserva o termo bíblico central «santo» e refere-se naturalmente ao óleo, masculino em português.
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: será santo para vós
  rationale: Mantém a relação expressa por לָכֶם e a repetição enfática de «santo», sem a reduzir a uma paráfrase.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: carne humana
  alternative: carne do homem; corpo de qualquer pessoa
  rationale: Aqui אָדָם não identifica um homem específico, mas a humanidade em geral. «Carne humana» conserva tanto a referência coletiva quanto o substantivo concreto בָּשָׂר, sem introduzir uma restrição de gênero.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com «vós» para manter o plural explícito dirigido à comunidade de Israel. A ordem da segunda proibição foi levemente reorganizada para soar natural em português, sem alterar seu conteúdo.
