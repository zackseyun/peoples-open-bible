  source_fidelity: 현 초안은 제시된 WLC 본문(시 49:8)이 아니라 바로 앞 절의 내용(‘아무도 형제를 속량할 수 없으며 하나님께 속전을 드릴 수 없다’)을 번역하고 있습니다. 시 49:8은 ‘그들의 생명의 속량 값이 비싸다’와 난해한 ‘וְחָדַל לְעוֹלָם’ 절을 담습니다. 따라서 본문 전체를 해당 히브리어 절에 맞추어 교체해야 합니다.
  naturalness: 개정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘생명의 속량 값’은 원문의 경제적·법적 비유를 유지하며, 후반절은 히브리어의 압축성과 해석상 불확실성을 과도하게 해소하지 않도록 ‘그 일을 영원히 그만두어야 합니다’로 옮기고 주석에서 대안을 제시했습니다.
  terminology: פִּדְיוֹן은 ‘속량 값’, נַפְשָׁם은 이 문맥에서 ‘그들의 생명’으로 번역했습니다. 이는 죽음에서 생명을 되찾는 문맥을 반영하며, 비물질적 영혼이라는 의미로 한정하지 않습니다. יָקַר는 ‘너무 비싸다’로, 속량의 불가능성을 뒷받침하는 문맥적 함의를 자연스럽게 드러냅니다.
