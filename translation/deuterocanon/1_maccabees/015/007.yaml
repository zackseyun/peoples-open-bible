  from: But Jerusalem and the holy places are to be free; and all the weapons that you have made[a], and the strongholds that you have built, which you hold, shall remain yours.
  to: Jerusalem and the sanctuary shall be free[a]. All the weapons you have made and the strongholds you have built and hold shall remain yours.
  rationale: The lexical record recognizes 'the sanctuary' as an alternative but favors a broader wording to avoid narrowing the precincts to one building. 'Sanctuary' need not imply only the building, and the chapter’s later reference to the sanctuary supports it here; the ambiguity in 'free' remains visible in a note.
