reference: 1 Clement 57:1
unit: verse
book: 1 Clement
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑμεῖς οὖν οἱ τὴν καταβολὴν τῆς στάσεως ποιήσαντες ὑποτάγητε τοῖς πρεσβυτέροις καὶ παιδεύθητε εἰς μετάνοιαν, κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν.
  language: Greek
translation:
  text: Therefore, you who laid the foundation of the rebellion, submit yourselves to the elders and be disciplined unto repentance[b], bending the knees of your heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'uprising'.
    reason: previous_rendering
  - marker: b
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in the appeal to leave sin or faction, preserving separate return verbs and the writers own exhortation.
    reason: lexical_alternative
