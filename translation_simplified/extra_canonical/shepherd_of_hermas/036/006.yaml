base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/006.yaml
  text: But those who are complete in faith ask for all things, having put their trust in the Lord, and they receive, because they ask without doubting, not being at all double-minded. For every double-minded man, unless he repents, will be saved with difficulty.
translation:
  language: en
  text: But those whose faith is complete trust in the Lord and ask him for everything. They receive what they ask for because they do not doubt, and their hearts are not divided. Anyone with a divided heart will be saved only with great difficulty unless they reorient[r1].
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: having put their trust in the Lord
  simplified_phrase: trust in the Lord
  preserved_meaning: Their requests arise from reliance on the Lord.
  reasoning_layer_used: POB translation
  rationale: The finite verb states the same basis more directly.
- pob_phrase: not being at all double-minded
  simplified_phrase: their hearts are not divided
  preserved_meaning: They are not inwardly divided in their trust.
  reasoning_layer_used: POB translation and source-language image
  rationale: The wording makes the divided inner state clear without merging it with doubt.
- pob_phrase: every double-minded man
  simplified_phrase: anyone with a divided heart
  preserved_meaning: The warning applies to every person who is inwardly divided.
  reasoning_layer_used: POB translation
  rationale: The inclusive wording preserves the universal warning in natural English.
translation_notes:
  risk_flags:
  - risk: “Ask him for everything” could be mistaken for an unconditional promise about every desire.
    mitigation: The text retains POB’s wording and keeps trust and freedom from doubt as its stated conditions.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
