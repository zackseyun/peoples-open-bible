review_pass:
  verdict: revise
  source_fidelity: ‘맏아들/막내아들’은 이 쌍둥이 형제의 문맥에서는 결과적으로 맞을 수 있으나, 히브리어 הַגָּדֹל/הַקָּטָן은 본절에서 직접적으로 ‘나이 많은/적은 아들’의 대비를 표현합니다. 또한 מִתְנַחֵם לְךָ לְהָרְגֶךָ는 에서가 야곱을 죽일 생각으로 자신을 달래는 뜻이므로, ‘너에 대해 스스로 위로하며’보다 목적·수단 관계를 명확히 하는 번역이 적절합니다.
  naturalness: 서술문의 합쇼체는 자연스럽지만, 어머니가 아들에게 하는 직접화법의 ‘보십시오’는 청자를 높이는 표현이라 원문의 관계 및 한국어 대화 관습에 맞지 않습니다. ‘보아라’가 자연스럽습니다. ‘사람을 보내어 … 불러오게 하고’는 וַתִּשְׁלַח וַתִּקְרָא의 연속 동작을 분명히 합니다.
  terminology: ‘큰아들/작은아들’은 문맥상 연장자와 연소자의 대비를 유지하면서도 원문의 상대적 표현에 더 가깝습니다. ‘스스로를 달래고 있다’는 מִתְנַחֵם의 재귀적 뉘앙스를 현대 한국어로 자연스럽게 드러냅니다.
