  text: Now concerning the apostles and prophets, according to the rule of the gospel, do thus.
translation:
  language: ko
  text: 한편 사도들과 예언자들에 관해서는 복음의 규칙에 따라 이와 같이 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ δὲ τῶν ἀποστόλων καὶ προφητῶν
  english_pob_choice: Now concerning the apostles and prophets
  chosen_korean: 그런데 사도들과 예언자들에 관해서는
  alternatives_korean:
  - 이제 사도들과 예언자들에 대하여는
  - 그리고 사도들과 예언자들에 관해서는
  lexicon: ἀπόστολος, προφήτης
  rationale: Περὶ δέ는 문맥 전환의 연결 표현이므로 ‘그런데 …에 관해서는’으로 자연스럽게 옮겼고, προφήτης는 교회 제도어보다 원문 기능을 살려 ‘예언자들’로 번역했습니다.
- source_word: κατὰ τὸ δόγμα
  english_pob_choice: according to the rule
  chosen_korean: 복음의 규칙에 따라
  alternatives_korean:
  - 복음의 규례에 따라
  - 복음의 원칙에 따라
  lexicon: δόγμα
  rationale: 이곳의 δόγμα는 공적 교리나 행정 명령보다 준거가 되는 기준을 가리키므로, 영어 POB의 ‘rule’을 따라 ‘규칙’으로 옮겨 문맥의 판단 기준성을 드러냈습니다.
- source_word: τοῦ εὐαγγελίου
  english_pob_choice: of the gospel
  chosen_korean: 복음의
  alternatives_korean:
  - 복음의 가르침의
  - 복음에 따른
  lexicon: εὐαγγέλιον
  rationale: εὐαγγέλιον은 프로젝트 기본어인 ‘복음’을 유지하고, 앞의 ‘규칙’과 결합해 소속격으로 자연스럽게 처리했습니다.
- source_word: οὕτω ποιήσατε
  english_pob_choice: do thus
  chosen_korean: 그렇게 하십시오
  alternatives_korean:
  - 이와 같이 행하십시오
  - 그렇게 행하십시오
  lexicon: ποιέω
  rationale: 짧은 명령형의 간결함을 살리면서도 현대 한국어에서 자연스러운 합쇼체로, ‘do thus’에 해당하는 직접적 지시를 반영했습니다.
theological_decisions:
- issue: 사도와 예언자에 대한 적용 규범
  chosen_reading: 이 구절은 사도들과 예언자들을 다룰 때 복음의 규칙을 기준으로 삼으라는 실천 지침으로 읽었습니다.
  alternative_readings:
  - 사도와 예언자를 교리적으로 규정하는 문장으로 읽기
  - ‘복음의 규칙’을 제도적 규례로만 제한해 읽기
  rationale: 원문은 서술보다 명령에 초점이 있으며, 공동체가 분별할 기준을 제시합니다. 그래서 규범적 지시로 처리하되, 원문의 긴장을 약화시키지 않도록 ‘규칙’을 유지했습니다.
  doctrine_reference: Didache의 공동체 분별 규범
- issue: ‘예언자들’의 용어 선택
  chosen_reading: ‘예언자들’로 번역해 1세기 공동체 내 영감받은 발화자라는 기능을 드러냈습니다.
  alternative_readings:
  - ‘선지자들’
  - ‘예언자/선지자들’
  rationale: 표준 현대어에서 ‘예언자’가 가장 중립적이며, 본문은 유대-기독교 전통의 직능을 설명하는 맥락이므로 과도한 교회식 고정어를 피했습니다.
  doctrine_reference: 초기 기독교 공동체의 은사 직분
