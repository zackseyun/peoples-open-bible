id: PSA.119.41
reference: Psalms 119:41
source:
  edition: WLC
  text: וִֽ/יבֹאֻ֣/נִי חֲסָדֶ֣/ךָ יְהוָ֑ה תְּ֝שֽׁוּעָתְ/ךָ֗ כְּ/אִמְרָתֶֽ/ךָ׃
translation:
  text: Let your steadfast love and your salvation come to me, Yahweh, according to your promise.
  philosophy: dynamic
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: כְּאִמְרָתֶֽךָ
  chosen: promise
  alternatives:
  - word
  - saying
  lexicon: HALOT
  rationale: אִמְרָה in this psalm repeatedly denotes God's committed utterance on which the psalmist stakes his life; rendered 'promise' to distinguish it from דָּבָר ('word'), with 'word/saying' as alternatives.
