  from: Would you even annul my justice? Would you condemn me so that you may be justified?[a]
  to: Would you even overturn my judgment[a]? Would you condemn me so that you may be in the right?
  rationale: “Overturn my judgment” is natural judicial English for making God's מִשְׁפָּט void or ineffective, and “be in the right” conveys the forensic sense of תִּצְדָּק without importing a technical theological register. “May,” rather than “can,” better carries the purpose clause introduced by לְמַעַן. The lexical note concerns “judgment” and therefore belongs in the first question.
