  revised_text: 그리고 벨리알의 영들 중 하나가 나와 함께 일하면서 이렇게 말했습니다. 「이 칼을 집어 들고 그것으로 요셉을 죽여라. 그러면 그가 죽은 뒤에 아버지가 너를 사랑할 것이다.」
