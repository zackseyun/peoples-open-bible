  rationale: The earlier notes acknowledged relational nearness but favored the nominal construction for source-transparency; the context supports stating its meaning directly. The recorded “Lord GOD” conflicts with both its own rationale and the standing divine-name ruling, so I correct it to “Lord Yahweh.”
