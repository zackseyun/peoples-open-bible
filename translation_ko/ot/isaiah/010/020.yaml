id: ISA.10.20
reference: Isaiah 10:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא לֹֽא יוֹסִ֨יף ע֜וֹד שְׁאָ֤ר יִשְׂרָאֵל֙ וּ/פְלֵיטַ֣ת בֵּֽית יַעֲקֹ֔ב לְ/הִשָּׁעֵ֖ן עַל מַכֵּ֑/הוּ וְ/נִשְׁעַ֗ן עַל יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל בֶּ/אֱמֶֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/010/020.yaml
  text: And in that day the remnant of Israel and the survivors of the house of Jacob will no longer continue to lean on the one who struck them, but will lean on the LORD, the Holy One of Israel, in truth.
translation:
  language: ko
  text: 그날에 이스라엘의 남은 자와 야곱의 집에서 살아남은 자는 더 이상 그들을 친 자에게 기대지 않고, 야훼, 이스라엘의 거룩하신 분께 진실로 기대게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יוֹסִיף עוֹד ... לְהִשָּׁעֵן
  english_pob_choice: will no longer continue to lean on
  chosen_korean: 더 이상 ... 기대지 않고
  alternatives_korean:
  - 더 이상 ... 의지하지 않고
  - 계속해서 ... 기대는 일을 멈추고
  lexicon: יָסַף / שׁען
  rationale: 반복적·지속적 행위를 끊는 뉘앙스를 살려 ‘더 이상’과 부정 동사로 자연스럽게 옮겼고, ‘기대다/의지하다’ 중에서는 몸을 맡기는 이미지가 살아 있는 ‘기대다’를 택했습니다.
- source_word: מַכֵּהוּ
  english_pob_choice: the one who struck them
  chosen_korean: 자기를 친 자
  alternatives_korean:
  - 그들을 친 자
  - 때린 자
  lexicon: נכה
  rationale: 히브리어의 ‘치다/상처 입히다’는 가해 행위를 가리키므로, 대상의 집단성을 고려해 ‘자기를 친 자’로 간결하게 처리했습니다.
- source_word: יְהוָה קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the LORD, the Holy One of Israel
  chosen_korean: 야훼, 이스라엘의 거룩하신 분
  alternatives_korean:
  - 주님, 이스라엘의 거룩하신 이
  - 야훼, 이스라엘의 거룩하신 이
  lexicon: יהוה / קדוֹשׁ יִשְׂרָאֵל
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, ‘거룩하신 분’은 호칭성을 살리되 한국어에서 자연스러운 존칭형으로 표현했습니다.
- source_word: בֶּאֱמֶת
  english_pob_choice: in truth
  chosen_korean: 진실로
  alternatives_korean:
  - 참으로
  - 진리 안에서
  lexicon: אמת
  rationale: 단순한 사실성보다 신뢰성과 성실함의 어감을 함께 살리기 위해, 관용적이면서도 강조를 유지하는 ‘진실로’를 택했습니다.
theological_decisions:
- issue: 이스라엘의 남은 자와 야곱의 집에서 살아남은 자의 회심 방향
  chosen_reading: 가해 세력에 대한 정치적/군사적 의존을 끊고 야훼께만 기대는 전환으로 읽었습니다.
  alternative_readings:
  - 단순한 외교적 재편
  - 내적 신앙 태도만의 변화
  rationale: 문맥상 ‘친 자’에 다시 기대지 않는다는 대비가 핵심이므로, 의지의 대상이 사람에서 야훼로 옮겨 가는 언약적 전환을 드러내는 번역이 가장 직접적입니다.
  doctrine_reference: 예언서의 남은 자 사상과 언약적 신뢰
- issue: יהוה의 표기
  chosen_reading: 본문에서는 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 원문 신명성을 드러내는 학술 음역을 유지했으며, 이는 텍스트의 고유 호칭을 흐리지 않습니다.
  doctrine_reference: 신명기적 신명 표기 원칙
