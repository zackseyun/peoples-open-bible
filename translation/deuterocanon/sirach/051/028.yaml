translation:
  text: Many heard my instruction in my youth[a], and you will acquire silver and gold[b] through me[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek opens with a plural command to receive instruction for a large amount of silver, rather than Hebrew's retrospective report of many hearing the speaker in his youth.
    reason: textual_variant
  - marker: b
    text: Pointed Hebrew addresses plural 'you', not 'they'. The imperfect permits promissory 'you will acquire' or exhortative 'acquire'; an English injunction would not mean Hebrew is pointed as an imperative. Greek has a plural imperative.
    reason: lexical_alternative
  - marker: c
    text: Hebrew בִי may mean 'through me', 'by me' or 'in me'. The chosen wording interprets the speaker as the means; Greek instead has feminine 'in/by it', referring contextually to instruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים שָׁמְעוּ לִמּוּדִי בִּנְעֻרוֹתָי, וְכֶסֶף וְזָהָב תִּקְנוּ בִי.
  chosen: Many heard my instruction in my youth, and you will acquire silver and gold through me.
  rationale: שָׁמְעוּ Qal qatal 3cp with רַבִּים subject; לִמּוּדִי noun with 1cs suffix; בִּנְעֻרוֹתָי youth noun with 1cs suffix; תִּקְנוּ Qal yiqtol 2mp of קנה, not qatal 3cp; בִי preposition with 1cs suffix. The completed third-person hearing clause is followed by Qal imperfect second-person plural תִּקְנוּ, not 'they acquired'. Future English is a promissory preference; exhortative force remains open without repointing. 'Through me' is an instrumental interpretation matching the actual English and note.
