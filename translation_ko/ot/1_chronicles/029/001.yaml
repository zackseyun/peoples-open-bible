- from: 그때 다윗 왕이 온 회중에게 말했습니다. “내 아들 솔로몬은 하나님께서 택하신 사람인데, 아직 어리고 미숙합니다. 그리고 이 일은 매우 큽니다. 이 궁전은 사람을 위한 것이 아니라 야훼 하나님을 위한 것이기 때문입니다.”[a][b]
