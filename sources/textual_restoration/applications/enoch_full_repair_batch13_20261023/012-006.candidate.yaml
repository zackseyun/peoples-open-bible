translation:
  text: And because they delight in their children[a], they will see their loved ones killed. They will cry out
    over the loss of their children and plead forever, but they will have neither mercy[b] nor peace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The opening is retained as and because, although the causal link is awkward; this is not silently rewritten
      as an unprinted concessive promise or restored from another language. The printed star before mercy is preserved
      in the source. Reported variants at apparatus26–34 are not substituted for the selected text.
  - marker: b
    reason: lexical_alternative
    text: Plead represents request/prayer language, not an assertion that the plea is granted. Mercy follows the
      selected ምሕረት and is not flattened into the different forgiveness-of-sins phrase of12:5. Personally viewed
      Dillmann1865 columns1347–1350 (rejoice/delight),1359–1360 (beloved),129–132 (loss/destruction lead),1185–1188
      (cry out),375–376 (ask/plead) and157–158 (mercy).
