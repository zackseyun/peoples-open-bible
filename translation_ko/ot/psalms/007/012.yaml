translation:
  language: ko
  text: 그가 돌이키지 않으면,[a] 그는 자기 칼을 갈 것이며, 자기 활을 당겨 준비하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 회개하지 않으면’. 히브리어 동사는 기본적으로 ‘돌이키다, 돌아오다’를 뜻하며, 이 문맥에서는 회개의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그는’, ‘자기 칼’, ‘자기 활’의 지시 대상은 문맥상 회개하지 않는 자를 심판하시는 하나님으로 이해하는 것이 유력합니다. 그러나 이를 악인이 자기 무기를 준비하는 것으로 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: WLC/HALOT
  rationale: 문맥에서 복수형 표기는 이스라엘의 한 분 하나님을 가리키므로, 한국어 표준 종교어휘인 ‘하나님’으로 옮겼습니다.
- source_word: שׁוֹפֵט צַדִּיק
  english_pob_choice: is a righteous judge
  chosen_korean: 의로운 재판장이시며
  alternatives_korean:
  - 의로운 심판자이시며
  - 의로우신 재판장이시며
  lexicon: HALOT
  rationale: 분사형 술어는 단순 동작보다 성격 규정에 가깝기 때문에 ‘재판장’으로 자연스럽게 살리고, צַדִּיק은 도덕적·신학적 함의를 살려 ‘의로운’으로 옮겼습니다.
- source_word: זֹעֵם
  english_pob_choice: is indignant
  chosen_korean: 분노하시는
  alternatives_korean:
  - 격분하시는
  - 노여워하시는
  lexicon: HALOT
  rationale: 하나님의 지속적 분노를 나타내는 분사이므로, 감정의 강도와 지속성을 함께 담는 ‘분노하시는’이 가장 직접적입니다.
- source_word: בְּכָל יוֹם
  english_pob_choice: every day
  chosen_korean: 매일
  alternatives_korean:
  - 날마다
  - 매일마다
  lexicon: HALOT
  rationale: 정기적·반복적 의미를 간결하게 전달하는 한국어로 ‘매일’을 택했습니다.
theological_decisions:
- issue: 하나님의 분노 표현을 약화하지 않을 것
  chosen_reading: 매일 분노하시는 하나님이십니다
  alternative_readings:
  - 매일 노여워하시는 하나님이십니다
  - 매일 진노하시는 하나님이십니다
  rationale: 히브리어 본문은 하나님의 지속적 분노를 분명히 말하므로, 이를 완화하지 않고 유지했습니다. ‘진노’는 가능하지만 현대 한국어에서는 다소 교회어적이어서 여기서는 직설적인 ‘분노하시는’이 본문의 긴장을 더 분명히 드러냅니다.
  doctrine_reference: Translation philosophy §3
