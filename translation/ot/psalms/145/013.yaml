theological_decisions:
- issue: Rendering the duration of God's reign
  chosen_reading: The verse is translated to emphasize God's universal and enduring kingship without importing later doctrinal formulations beyond the Hebrew poetry.
  alternative_readings:
  - Your kingdom is an everlasting kingdom, and your dominion endures throughout all generations.
  rationale: The Hebrew plainly affirms the perpetual duration of God's kingdom and rule. The chosen rendering preserves the poetic repetition and age-spanning language rather than reducing it to a conventional formula like 'everlasting kingdom.'
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: Provisional nun-line inclusion and divine designation
  chosen_reading: Include the actual 11Q5 line, rendered God is faithful in his words and loyal in all his deeds.
  alternative_readings:
  - Retain the Masoretic form without a nun line.
  - Corresponding Greek line with Lord rather than God.
  rationale: Early direct Hebrew attestation, alphabetic structure and a corresponding Greek line without the recurring blessings support modest inclusion preference. Early repair using verse 17 remains possible; no copying event is established. Choosing one attested wording for a provisional composite is not identifying the exact earliest wording.
  doctrine_reference: Original-language primacy; disclose alternative source forms.
