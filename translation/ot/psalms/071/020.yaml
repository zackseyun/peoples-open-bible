id: PSA.71.20
reference: Psalms 71:20
source:
  edition: WLC
  text: אֲשֶׁ֤ר הראית/נו צָר֥וֹת רַבּ֗וֹת וְ/רָ֫ע֥וֹת תָּשׁ֥וּב תחיי/נו וּֽ/מִ/תְּהֹמ֥וֹת הָ֝/אָ֗רֶץ תָּשׁ֥וּב תַּעֲלֵֽ/נִי׀׃
translation:
  text: You who have made us[a] experience many troubles and calamities will revive us again; from the depths of the earth you will bring me up again.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The written Hebrew has “us” in the first two clauses; the traditional Masoretic reading has “me” in both.
    reason: textual_variant
lexical_decisions:
- source_word: אֲשֶׁר
  chosen: who
  alternatives:
  - that
  lexicon: HALOT
  rationale: Introduces a relative clause referring to God. 'Who' is more natural in English for a personal antecedent than 'that.'
- source_word: הראיתנו
  chosen: have made us see
  alternatives:
  - have shown us
  - caused us to see
  lexicon: HALOT
  rationale: Hiphil of ראה is causative. 'Made us see' preserves the causative force more explicitly than the traditional 'shown us,' while still reading naturally.
- source_word: צָרוֹת
  chosen: troubles
  alternatives:
  - distresses
  - afflictions
  lexicon: HALOT
  rationale: Conveys adversity or distress in accessible modern English without over-specifying the kind of suffering.
- source_word: רַבּוֹת
  chosen: many
  alternatives:
  - great
  - numerous
  lexicon: HALOT
  rationale: The adjective here most naturally quantifies the troubles rather than intensifies them.
- source_word: וְרָעוֹת
  chosen: and calamities
  alternatives:
  - and evils
  - and disasters
  lexicon: HALOT
  rationale: רָעוֹת in this context refers to harmful experiences, not moral evil committed by God. 'Calamities' communicates severe adversity clearly in English.
- source_word: תָּשׁוּב
  chosen: again
  alternatives:
  - will turn
  - will return
  lexicon: HALOT
  rationale: 'Before another verb, shuv functions adverbially: to do the action again, not physically return and then act.'
- source_word: תְּחַיֵּנוּ
  chosen: will revive us
  alternatives:
  - make us live again
  - restore our life
  - revive us
  lexicon: HALOT
  rationale: The verb means to make us live or revive us; 'again' is supplied by the preceding auxiliary.
- source_word: וּמִתְּהֹמוֹת הָאָרֶץ
  chosen: and from the depths of the earth
  alternatives:
  - and from the deep places of the earth
  - and from the abysses of the earth
  lexicon: HALOT
  rationale: תְּהֹמוֹת literally denotes depths/abysses. 'Depths of the earth' preserves the vivid imagery without sounding overly technical.
- source_word: תַּעֲלֵנִי
  chosen: you will bring me up
  alternatives:
  - raise me up
  - lift me up
  - bring me up
  lexicon: HALOT
  rationale: The final verb retains the singular object 'me'; the preceding repeated shuv supplies 'again.'
- source_word: נו ... ני
  chosen: us ... me
  alternatives:
  - me ... me
  - us ... us
  lexicon: Hebrew grammar
  rationale: The Masoretic text shifts from first person plural ('us') to first person singular ('me'). The translation preserves this shift rather than smoothing it out, since it is part of the received text and may reflect movement from communal to personal appropriation.
