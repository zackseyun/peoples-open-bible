translation:
  text: I saw how the stars of heaven come out, and the number of the gates from which they come out. I wrote down
    all their goings out, one by one, according to their number and names, their ranks, activity, times and months,
    as Urel, the holy angel who was with me, showed me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The actual opening word is እፎ, how (primary Dillmann1865 columns806–807), not a mouth noun used to supply
      unprinted portals at this point. Gates are explicitly present in the following count clause, which is retained
      in full. The actual quantity noun is transcribed ኍልቁ, and raised apparatus number31 near the later quantity
      phrase is not a critical star; the real star before the doubled one numeral is retained. All items in the
      selected list remain, including ranks, activity, times and months; no year, season, modern star catalogue
      or calculation is added. Urel follows selected ኡርኤል rather than silently adding a syllable or a different
      angel classification. Goings out and the ordered list are literal visionary terms, not a modern astronomical
      certification.
