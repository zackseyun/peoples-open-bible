  rationale: The verse concerns David's benevolent action rooted in his covenant relationship with Jonathan. 'Kindness' is the most natural English in context, but the covenant-loyalty dimension should not be erased, so an explanatory footnote preserves that nuance without importing more theology into the main text than the immediate context requires.
