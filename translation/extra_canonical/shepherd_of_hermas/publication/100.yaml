lexical_decisions:
- source_word: μετάνοια / μετανοεῖν
  chosen: repentance / repent
  alternatives:
  - regret
  - penance
  rationale: 'Reconsideration of the prior lexical rationale: context requires altered conduct, including
    abandoning resentment and slander, not pride. Preserve conditions and the stated life/death consequences.'
- source_word: τὴν αἵρεσιν
  chosen: this disposition
  alternatives:
  - this choice
  - this heresy
  rationale: The immediate subject is persistent resentment and slander; do not import a later technical
    label for doctrinal heresy.
- source_word: ἵλεως / ἰάσεται
  chosen: merciful / will heal
  alternatives:
  - propitious / forgive
  rationale: Retain distinct mercy and healing expressions, including confession and the conditional cleansing
    clause.
