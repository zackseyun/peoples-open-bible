id: PSA.76.10
reference: Psalms 76:10
source:
  edition: WLC
  text: כִּֽי חֲמַ֣ת אָדָ֣ם תּוֹדֶ֑/ךָּ שְׁאֵרִ֖ית חֵמֹ֣ת תַּחְגֹּֽר־׃
translation:
  text: For human wrath will bring you praise; you will clothe yourself with the wrath that remains[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “you will restrain the wrath that remains.” The Hebrew expression is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Surely
  - Indeed
  - Because
  lexicon: HALOT
  rationale: Introduces the ground or explanation for the preceding call to vow and pay; 'for' best preserves the causal/explanatory force in context.
- source_word: חֲמַת אָדָם
  chosen: human wrath
  alternatives:
  - human wrath
  - the rage of humankind
  lexicon: HALOT
  rationale: אָדָם is generic in this construction; “human” is natural contemporary English and retains the collective sense.
- source_word: תּוֹדֶךָּ
  chosen: will praise you
  alternatives:
  - will give thanks to you
  - shall acknowledge you
  lexicon: HALOT
  rationale: Hiphil of ידה commonly means 'give thanks, praise.' In this poetic context, the sense is that human wrath ends up redounding to God's praise. 'Praise you' is idiomatic and contextually stronger than the narrower 'give thanks to you.'
- source_word: שְׁאֵרִית
  chosen: the remnant
  alternatives:
  - the remainder
  - what is left
  lexicon: HALOT
  rationale: The noun means what remains or is left over. 'Remnant' is concise, natural in biblical-poetic English, and preserves the image of leftover wrath.
- source_word: חֵמֹת
  chosen: wrath
  alternatives:
  - wraths
  - rage
  lexicon: HALOT
  rationale: Although plural in Hebrew, English normally uses the mass noun 'wrath' here. The plural likely intensifies or collectivizes the idea rather than requiring a wooden plural in English.
- source_word: תַּחְגֹּר
  chosen: you will gird yourself with
  alternatives:
  - you will put on
  - you will bind on
  - you will arm yourself with
  lexicon: HALOT
  rationale: Retains the MT’s second-person verbal form and its girding metaphor in natural English word order.
- source_word: שְׁאֵרִית חֵמֹת
  chosen: the remaining wrath
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This idiomatically renders what remains of the wrath while appropriately treating the Hebrew plural as a mass noun in English.
