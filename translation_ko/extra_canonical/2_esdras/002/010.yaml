source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus ad Ezram: adnuntia populo meo, quoniam dabo eis regnum Hierusalem, quod daturus eram Israel.'
