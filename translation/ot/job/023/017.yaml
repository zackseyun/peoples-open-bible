    prior_rendering: For I was not silenced because of the darkness
    new_rendering: For it is not the darkness that has undone me
    rationale: Following the explicit attribution of terror to God, the negation is best understood as distinguishing God from darkness as the source of Job's collapse; “undone” preserves the verb's destructive force without restricting it to speech.
  - source_phrase: וּמִפָּנַי כִּסָּה אֹפֶל
    prior_rendering: nor because deep gloom covered my face
    new_rendering: nor the deep gloom that covers my face
    rationale: The second line continues the contrast of causes while retaining the covering image as Job's ongoing experience; the alternative understanding of concealment from his sight is noted.
