  rationale: פָּרִים은 수소/황소 계열의 수컷 소를 가리키므로, 일반적인 '소'보다 성별과 위협적 힘이 드러나는 '수소들'이 원문 이미지에 더 가깝습니다.
- source_word: אַבִּירֵי בָשָׁן
  english_pob_choice: mighty bulls of Bashan
  chosen_korean: 바산의 힘센 수소들
  alternatives_korean:
  - 바산의 강한 수소들
  - 바산의 힘센 소들
  lexicon: HALOT
  rationale: אַבִּיר는 '힘센, 강한, 위력 있는'의 뜻이어서 추상명사화하지 않고 동물 이미지와 맞는 '힘센'으로 옮겼고, 지명 바산은 음역을 유지했습니다.
- source_word: כִּתְּרוּנִי
  english_pob_choice: encircle me
  chosen_korean: 저를 둘러쌉니다
  alternatives_korean:
