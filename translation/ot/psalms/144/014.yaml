  from: Our cattle are heavy with young[a]; there is no breach and no going out[b], and no cry in our streets.
  to: Our oxen are heavily laden[a]; there is no breach, no one carried away[b], and no cry in our streets.
  rationale: “Heavy with young” supplies pregnancy without lexical warrant; “oxen are heavily laden” reflects the ordinary burden-bearing sense while noting that both terms are difficult. In the security sequence, unrestricted “no one going out” sounds as though peaceful movement has ceased and fails to convey the likely calamitous sense of the feminine participle. “No one carried away” is idiomatic and contextually apt for forced removal or captivity, but because the terse Hebrew literally denotes a going out and permits other construals, that uncertainty is retained in the note. Repeating “and” between the first two coordinated negatives is unnecessary in English.
