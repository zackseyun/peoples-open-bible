base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/003.yaml
  text: 'Concerning the Chosen Ones I said, and I uttered a parable concerning them: The Holy and Great One will go forth from his dwelling.'
translation:
  language: ko
  text: 택함 받은 이들에 관하여 내가 말하였고, 그들에 관하여 비유를 말하였습니다. 거룩하시고 크신 분께서 자신의 거처에서 나오실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእንተ ፡ ኅሩያን ፡
  english_pob_choice: Concerning the Chosen Ones
  chosen_korean: 택하신 이들에 관하여
  alternatives_korean:
  - 선택된 자들에 관하여
  - 택함 받은 이들에 관하여
  lexicon: ኅሩያን → chosen/selected ones
  rationale: 지시 대상이 집단이므로 ‘이들’을 써서 자연스럽게 옮기되, 선택의 수동성을 드러내는 ‘택하신’으로 원문의 의미를 유지했습니다.
- source_word: እቤ ፡
  english_pob_choice: I said
  chosen_korean: 나는 말하였고
  alternatives_korean:
  - 내가 말하였고
  - 나는 말했고
  lexicon: እቤ → I said / I spoke
  rationale: POB가 ‘I said’로 정리한 점을 따르되, 직설적 발화의 의미를 살려 ‘말하였고’로 옮겼습니다.
- source_word: ወአውሣእኩ ፡
  english_pob_choice: I uttered a parable
  chosen_korean: 비유를 들었습니다
  alternatives_korean:
  - 비유를 말했습니다
  - 비유를 선포했습니다
  lexicon: ወአውሣእኩ → I uttered / I spoke in parables
  rationale: 동사의 핵심은 ‘비유로 말하다’이므로 한국어 관용에 맞는 ‘비유를 들었습니다’를 선택해 행위의 형식을 분명히 했습니다.
- source_word: ቅዱስ ፡ ወዐቢይ
  english_pob_choice: The Holy and Great One
  chosen_korean: 거룩하시고 크신 분
  alternatives_korean:
  - 거룩하고 크신 분
  - 거룩한 크신 분
  lexicon: ቅዱስ / ዐቢይ → holy / great
  rationale: 인격적 호칭이므로 명사화된 ‘분’으로 처리했고, 하나님을 직접 지칭하는 존칭 효과를 위해 ‘거룩하시고’로 옮겼습니다.
- source_word: እማኅደሩ
  english_pob_choice: from his dwelling
  chosen_korean: 그의 거처에서 나오실 것입니다
  alternatives_korean:
  - 그의 거처에서 나가실 것입니다
  - 그의 처소에서 나오실 것입니다
  lexicon: እማኅደሩ → from his dwelling
  rationale: ‘거처’는 현재적 주거를, ‘나오실 것입니다’는 미래적 이동을 분명히 드러내며, 신적 주체의 능동성을 살립니다.
theological_decisions:
- issue: ‘The Holy and Great One’의 신적 호칭 처리
  chosen_reading: 하나님의 직접 호칭으로 이해하여 ‘거룩하시고 크신 분’으로 번역했습니다.
  alternative_readings:
  - 단순한 경외적 표현으로 완화하여 ‘거룩하고 큰 분’으로 옮김
  - 고유 칭호를 살려 음역/직역 혼합 처리
  rationale: 문맥상 최종 주어는 초월적 신적 존재이며, 한국어에서는 인격적 호칭을 드러내는 것이 원문의 장중함을 가장 잘 보존합니다.
  doctrine_reference: 1 Enoch의 묵시적 신학과 신적 현현 표현
