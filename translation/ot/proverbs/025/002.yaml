  - Interpret as mutual participation in wisdom, with kings uncovering what God has concealed
  rationale: 'The proverb states a poetic parallel about respective glory: God in concealing, kings in investigating. The translation should preserve the tension without importing a more developed doctrine of revelation or politics than the Hebrew itself states.'
