translation:
  language: en
  text: '1 After this, she sent me food with sorcery mixed into it. 2 When the eunuch brought it, I looked up and saw a terrifying man[a] handing me a sword along with the dish. Then I understood that this was a scheme to lead me astray. 3 After the eunuch left, I wept. I did not taste that food or any of her other food.


    4 The next day she came to me. When she noticed the untouched food, she asked, “Why didn’t you eat it?”


    5 I answered, “Because you filled it with deadly sorcery. How could you say, ‘I do not draw near to idols, but only to the Lord’? 6 Know this: the God of my father revealed your wickedness to me through his angel. So I kept the food as evidence to confront you, hoping that when you saw it, you might repent[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek text does not identify this terrifying man; he may be a visionary or symbolic figure, or he may be connected with the attempted sorcery.
    reason: alternative_reading
  - marker: b
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims.
    reason: lexical_alternative
