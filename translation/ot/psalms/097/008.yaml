- issue: Whether בְּנוֹת יְהוּדָה should be interpreted literally or as a geographic idiom
  chosen_reading: the daughters of Judah
  alternative_readings:
  - the towns of Judah
  - the villages of Judah
  rationale: The Hebrew expression is literally 'daughters of Judah.' Since the phrase may function idiomatically for Judah's dependent towns, the main text keeps the literal wording for transparency and poetic force, while a footnote preserves the geographic interpretation rather than resolving the ambiguity.
