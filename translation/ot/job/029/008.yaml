  from: The young men saw me and hid themselves[a], and the aged rose and stood.
  to: the young men saw me and withdrew from sight; the aged rose and remained standing.
  rationale: The later review rightly insisted that simple withdrawal was insufficient to convey hiding from view. “Withdrew from sight” preserves that gain, while “remained standing” clarifies the significance of the two verbs for the aged men.
