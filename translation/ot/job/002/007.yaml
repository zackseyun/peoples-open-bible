  chosen_reading: the Adversary
  alternative_readings:
  - Satan
  - the Satan
  rationale: The Hebrew includes the article, which strongly suggests a title or function in this context. Rendering it as 'the Adversary' avoids importing later assumptions about the term as a fixed proper name while still identifying the same hostile figure. The traditional rendering is preserved in a footnote for transparency.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve theological tension rather than resolve it.'
- issue: Rendering יְהוָה
  chosen_reading: Yahweh
