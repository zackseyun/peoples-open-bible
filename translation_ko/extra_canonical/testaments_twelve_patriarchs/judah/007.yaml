  text: '1. And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.


    2. So Dan and I, pretending to be Amorites as though allies, entered their city.


    3. And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering everything that belonged to them, we tore down their three walls.


    4. And we drew near to Thamna, where all their baggage was.


    5. Then, being insulted by them, I became angry, and I rushed up against them to the summit. And they kept hurling stones and shooting arrows at me.


    6. And if Dan my brother had not fought alongside me,'
translation:
  language: ko
  text: '1. 다음 날, 가아스 성읍의 왕이 큰 무리를 거느리고 우리를 치러 온다는 소식이 우리에게 전해졌습니다.


    2. 그래서 단과 제가 아모리 사람들에게 가서, 그들에게 동맹인 체하고 그들의 성읍에 들어갔습니다.


    3. 깊은 밤에 내 형제들이 우리에게 왔습니다. 우리는 그들에게 성문을 열어 주고, 그들을 모두 멸하고 약탈했습니다.


    4. 우리는 탐네에 가까이 갔는데, 그곳에는 적군 왕들의 모든 짐이 있었습니다.


    5. 그러자 그들에게 모욕을 당한 나는 분노하여 정상을 향해 그들에게 돌진했습니다. 그들은 나에게 돌을 던지고 활을 쏘아 댔습니다.


    6. 내 형제 단이 나와 함께 싸워 주지 않았더라면,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς / ἐρρέθη πρὸς ἡμᾶς
  english_pob_choice: And on the next day it was reported to us
  chosen_korean: “다음 날… 우리에게 보고되었습니다”
  alternatives_korean:
  - “이튿날… 우리에게 전해졌습니다”
  - “다음 날… 우리에게 알려졌습니다”
  lexicon: reported / 전해지다
  rationale: 수동 표현을 살려 사건 전달의 공적·서사적 성격을 드러냈고, ‘보고되었습니다’는 원문의 비인칭적 전달 의미를 비교적 직접적으로 옮깁니다.
- source_word: Γαὰς πόλεως βασιλεὺς ἐν λαῷ πολλῷ
  english_pob_choice: the king of the city of Gaas was coming against us with a great multitude
  chosen_korean: “가스 성읍의 왕이 큰 무리를 거느리고 우리를 치러”
  alternatives_korean:
  - “가스 도시의 왕이 많은 군중과 함께 우리를 향해”
  - “가스 성읍의 왕이 많은 백성을 이끌고 우리에게”
  lexicon: city / multitude / coming against
  rationale: πόλις는 ‘성읍’이 자연스럽고, ἐν λαῷ πολλῷ는 단순한 숫자보다 동반 집단의 규모를 보여 주므로 ‘큰 무리’로 옮겼습니다.
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  english_pob_choice: pretending to be Amorites as though allies
  chosen_korean: “아모리 사람인 척하며 동맹인 것처럼”
  alternatives_korean:
  - “아모리 사람인 양, 마치 동맹인 듯”
  - “아모리 사람인 체하고 동맹인 것처럼”
  lexicon: pretending / allies
  rationale: προσποιησάμενοι와 συμμάχους의 이중성을 살려, 외형상 동맹을 가장한 기만을 분명히 했습니다.
- source_word: ὥρμησα ἐπ᾽ αὐτοὺς ἐπὶ τὴν κορυφήν
  english_pob_choice: I rushed up against them to the summit
  chosen_korean: “그들을 향해 산꼭대기까지 돌진했습니다”
  alternatives_korean:
  - “그들을 향해 꼭대기까지 내달렸습니다”
  - “그들에게 달려들어 정상까지 올라갔습니다”
  lexicon: rushed up against / summit
  rationale: reviser가 보존한 “I rushed up against”의 공격적 뉘앙스를 따라 ‘돌진했습니다’로 옮기고, κορυφήν은 지형적 의미가 분명하므로 ‘산꼭대기’로 구체화했습니다.
