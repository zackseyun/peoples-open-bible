  from: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
  to: The next day Saul divided the troops into three companies. They entered the Ammonite camp during the morning watch[a] and struck down the Ammonites until the day grew hot. The survivors scattered so completely that no two of them were left together.
  rationale: The lexical record already recognizes military companies, the Ammonite force, and complete dispersal, but often preserves their Hebrew surface forms. I translate those contextual meanings directly and retain the military watch term with a short explanatory note.
