translation:
  text: All of them answered him, “Let us all swear an oath and bind one another under a curse, so that we will
    not turn away from this plan but carry out this [plan] deed.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected print has a star before the final “this” and brackets the repeated noun “plan”; its apparatus36
      calls that noun an intrusion from the preceding clause. The deliberately awkward “[plan] deed” retains that
      printed bracketed word rather than silently deleting it or mistaking it for a reader-note anchor. The actual
      negative verb is ኢንመጠ, not the old transcription ኢንምጠ; Dillmann1865 columns214–215 support turning aside or
      withdrawing. Oath and mutual imprecation are distinct (columns155–156 and939–940). This is a translation of
      the selected critical text, not a claim that its bracketed repetition is secure ancient wording.
