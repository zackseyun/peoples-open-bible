source:
  edition: WLC
  text: הֲֽ/לֹא אַ֭תָּה תָּשׁ֣וּב תְּחַיֵּ֑/נוּ וְ֝/עַמְּ/ךָ֗ יִשְׂמְחוּ בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/006.yaml
  text: Will you not return[b] and revive us[a], so that your people may rejoice in you?
  footnotes:
  - marker: a
    text: Or 'give us life again' or 'make us live.'
    reason: lexical_alternative
  - marker: b
    text: Or 'turn back' or 'turn again.' The Hebrew verb can denote returning or turning back, here likely of God turning again toward his people in favor.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주께서 돌아오셔서 우리를 살려 주시지 않겠습니까? 그러면 주의 백성이 주 안에서 기뻐할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아오셔서’는 히브리어 동사의 뜻을 옮긴 것으로, ‘다시 돌아오셔서’ 또는 ‘돌이키셔서’로도 번역할 수 있습니다. 여기서는 하나님께서 자기 백성에게 다시 은혜로이 향하신다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘살려 주시다’는 ‘다시 생명을 주시다’ 또는 ‘살게 하시다’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/לְ/עוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  lexicon: HALOT
  rationale: אָ/לְעוֹלָם의 시간적 지속을 한국어 질문문에서 자연스럽게 드러내는 가장 간결한 표현입니다.
- source_word: תֶּֽאֱנַף בָּ֑/נוּ
  english_pob_choice: will you be angry with us
  chosen_korean: 우리에게 노하십니까
  alternatives_korean:
  - 우리와 함께 노하십니까
  - 우리에게 화를 내십니까
  lexicon: HALOT
  rationale: בָּנוּ는 대상/방향을 나타내므로 한국어에서는 ‘우리에게’가 가장 직접적이며, אנף의 기본 의미를 ‘노하다’로 살렸습니다.
- source_word: תִּמְשֹׁ֥ךְ אַ֝פְּ/ךָ֗
  english_pob_choice: will you prolong your anger / literally, draw out your anger
  chosen_korean: 당신의 진노를 길이 끌어가시겠습니까
  alternatives_korean:
  - 당신의 진노를 끌어내시겠습니까
  - 당신의 분노를 오래 지속하시겠습니까
  lexicon: HALOT
  rationale: משך의 ‘끌다/늘이다’라는 동사 이미지를 보존하면서, אַף의 관용적 의미를 한국어 ‘진노’로 옮겨 원문의 강도를 유지했습니다.
- source_word: לְ/דֹ֣ר וָ/דֹֽר
  english_pob_choice: from generation to generation
  chosen_korean: 세대에서 세대로
  alternatives_korean:
  - 대대로
  - 한 세대에서 다음 세대로
  lexicon: HALOT
  rationale: 히브리어의 반복적 세대 관용구를 직역에 가깝게 옮겨, 계속되는 시간의 흐름을 분명히 드러냈습니다.
theological_decisions:
- issue: 하나님의 분노에 대한 의인화적 표현
  chosen_reading: ‘노하십니까’, ‘진노’를 그대로 유지해 하나님의 분노를 완화하지 않았습니다.
  alternative_readings:
  - 영원히 불쾌해하십니까
  - 영원히 우리를 못마땅해하십니까
  rationale: 시편의 탄식은 하나님의 실제적인 진노를 정면으로 말하므로, 이를 심리적 불쾌감으로 약화하면 본문의 긴장이 사라집니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
