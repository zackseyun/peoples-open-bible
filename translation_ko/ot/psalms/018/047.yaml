source:
  edition: WLC
  text: הָ/אֵ֗ל הַ/נּוֹתֵ֣ן נְקָמ֣וֹת לִ֑/י וַ/יַּדְבֵּ֖ר עַמִּ֣ים תַּחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/047.yaml
  text: the God who carries out acts of vengeance for me[a] and subdues peoples under me[b].
  footnotes:
  - marker: a
    text: Or “who avenges me.”
    reason: lexical_alternative
  - marker: b
    text: The verb here means “subdues” or “brings into subjection,” not “speaks,” despite its relation to the common Hebrew verb meaning “to speak.”
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 위하여 보복을 행하시고[a] 민족들을 내 아래에 복종시키시는[b] 하나님이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보복의 행위들을’로 옮길 수 있습니다. 히브리어는 복수형을 사용하며, 추상적 또는 강조의 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 히브리어 동사는 일반적으로 ‘말하다’라는 뜻과 관련이 있지만, 여기서는 전통적으로 ‘복종시키다’ 또는 ‘지배 아래 두다’라는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  english_pob_choice: The LORD lives
  chosen_korean: 야훼께서 살아 계십니다
  alternatives_korean:
  - 야훼는 살아 계십니다
  - 주님은 살아 계십니다
  lexicon: HALOT
  rationale: חי + 신명조합은 여호와의 실재적·현존적 생명을 선언하는 관용적 표현이므로, 한국어에서는 ‘살아 계십니다’로 자연스럽게 옮기되 하나님의 이름은 ‘야훼’로 보존했습니다.
- source_word: וּבָרוּךְ
  english_pob_choice: and blessed be
  chosen_korean: 복되시며
  alternatives_korean:
  - 복을 받으십시오
  - 복되십니다
  - 복되소서
  lexicon: HALOT
  rationale: 이 구는 찬양의 축복 선언이므로, 합쇼체 안에서 선언적·송축적 뉘앙스를 살려 ‘복되시며’로 옮겼습니다.
- source_word: צוּרִי
  english_pob_choice: my rock
  chosen_korean: 내 반석
  alternatives_korean:
  - 내 바위
  - 내 피난처
  lexicon: HALOT
  rationale: צוּר의 핵심 은유를 직접 살려 하나님의 견고함과 보호를 함께 드러내는 가장 표준적인 대응인 ‘반석’을 선택했습니다.
- source_word: וְיָרוּם אֱלוֹהֵי יִשְׁעִי
  english_pob_choice: and exalted be the God of my salvation
  chosen_korean: 내 구원의 하나님이 높임을 받으십시오
  alternatives_korean:
  - 내 구원의 하나님이 높임을 받으시기를 바랍니다
  - 내 구원의 하나님은 높임을 받으십니다
  lexicon: HALOT
  rationale: יוּרום의 도식적·송축적 힘을 한국어에서 명령형 기도체 ‘높임을 받으십시오’로 재현하여, 단순 서술보다 찬양적 평행성을 살렸습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명은 대체 호칭이 아니라 고유 이름이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약적·인격적 지칭을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 찬양문에서의 동사 어조
  chosen_reading: ‘높임을 받으십시오’의 기도/송축적 어조
  alternative_readings:
  - ‘높임을 받으십니다’의 진술
  - ‘높임을 받으소서’의 고전적 기원형
  rationale: 히브리어 완료/미완료의 평행 구조가 이 구절에서는 선언과 기원이 겹치는 송축적 표현으로 기능하므로, 현대 합쇼체에서는 공적 찬양에 자연스러운 ‘받으십시오’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
