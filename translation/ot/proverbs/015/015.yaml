id: PRO.15.15
reference: Proverbs 15:15
source:
  edition: WLC
  text: כָּל יְמֵ֣י עָנִ֣י רָעִ֑ים וְ/טֽוֹב לֵ֝֗ב מִשְׁתֶּ֥ה תָמִֽיד־־׃
translation:
  text: All the days of the afflicted[a] are miserable, but a cheerful heart is a continual feast.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “the poor.”
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל
  chosen: All
  alternatives:
  - Every
  lexicon: HALOT
  rationale: Quantifier covering the whole set; 'All' is idiomatic with the following plural construct 'days of.'
- source_word: יְמֵי
  chosen: the days of
  alternatives:
  - the lifetime of
  lexicon: HALOT
  rationale: Construct plural of 'days'; in wisdom literature it commonly denotes the course of one's days. 'The days of' preserves the Hebrew image without over-interpreting as 'lifetime.'
- source_word: עָנִי
  chosen: the afflicted
  alternatives:
  - the poor
  - the oppressed
  - the needy
  lexicon: HALOT
  rationale: The adjective/noun can denote poverty, affliction, or oppression. Here the contrast is with inward cheerfulness rather than wealth, so 'the afflicted' best captures the broader condition of misery without restricting the saying to economics alone.
- source_word: רָעִים
  chosen: are bad
  alternatives:
  - are evil
  - are miserable
  - are hard
  lexicon: HALOT
  rationale: Predicate adjective describing the quality of the afflicted person's days. 'Bad' is broad and natural English, preserving the Hebrew's general term without narrowing it to moral evil ('evil') or adding interpretive color ('miserable').
- source_word: וְטוֹב לֵב
  chosen: but a cheerful heart
  alternatives:
  - but one with a cheerful heart
  - but a glad heart
  lexicon: HALOT
  rationale: Contextually natural rendering of a person characterized by a positive or glad inner disposition.
- source_word: מִשְׁתֶּה
  chosen: a feast
  alternatives:
  - a banquet
  - feasting
  lexicon: HALOT
  rationale: The noun denotes a feast or banquet. 'Feast' is concise and idiomatic in the predicate construction 'is a continual feast.'
- source_word: תָמִיד
  chosen: continual
  alternatives:
  - always
  - continually
  - perpetual
  lexicon: HALOT
  rationale: Adverbial/nominal term meaning continually or regularly. 'Continual' works smoothly attributively with 'feast' and preserves the proverb's enduring contrast.
