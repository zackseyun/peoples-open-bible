translation:
  language: en
  text: I tell you, in the same way there will be more joy in heaven over one sinner who reorients toward God[b] than over ninety-nine righteous people[a] who do not need a reorientation toward God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Righteous people” may be straightforward or ironic in this context; the wording leaves both readings open.
    reason: alternative_reading
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: there will be joy in heaven ... than
  simplified_phrase: there will be more joy in heaven ... than
  preserved_meaning: The joy over the one sinner is compared with the joy over the ninety-nine.
  reasoning_layer_used: POB lexical decision for ἢ
  rationale: Adding “more” makes the implied comparison grammatical and clear in English.
interpretive_expansions:
- pob_phrase: joy in heaven ... than
  rendering: more joy in heaven ... than
  claim: The Greek comparison implies a greater degree of joy.
  evidence:
  - POB treats ἢ as comparative “than.”
  - The POB rationale identifies an implied comparison of greater joy.
  confidence: high
  alternatives_preserved:
  - there will be joy in heaven ... rather than
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: “Changes their mind” may sound like merely changing an opinion.
    mitigation: It retains the POB’s audited lexical choice without adding an unsupported spiritual explanation.
  - risk: Readers may assume “righteous people” is certainly ironic.
    mitigation: The footnote preserves both the straightforward and ironic readings.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
