translation:
  language: ko
  text: 그리고 당신의 경건한 이들의 의로운 행위들은 주님 앞에 있습니다. 하나님, 사람이 어디에 당신의 아심을 피하여 숨을 수 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δικαιοσύναι
  english_pob_choice: the righteous deeds / the righteousnesses
  chosen_korean: 의로운 행위
  alternatives_korean:
  - 의들
  - 의로움들
  - 의로운 일들
  lexicon: δικαιοσύνη
  rationale: 복수형 δικαιοσύναι는 단일 추상명사보다 구체적 행위들의 복수성을 드러내므로, ‘의로운 행위’로 옮겨 행위성과 복수성을 함께 살렸습니다.
- source_word: τῶν ὁσίων σου
  english_pob_choice: your pious ones
  chosen_korean: 당신의 경건한 이들
  alternatives_korean:
  - 당신의 거룩한 이들
  - 당신의 성도들
  lexicon: ὅσιος
  rationale: ὅσιος는 ἅγιος보다 ‘경건함/경건한 자들’의 결을 가지므로, 전통적 ‘성도’보다 원어의 뉘앙스를 더 직접적으로 반영했습니다.
- source_word: ἐνώπιόν σου
  english_pob_choice: before you
  chosen_korean: 당신 앞에
  alternatives_korean:
  - 당신 앞에 있습니다
  - 당신 눈앞에
  lexicon: ἐνώπιον
  rationale: 하나님 앞에서 드러나 있다는 공간적·법정적 이미지를 자연스러운 한국어로 살리기 위해 ‘당신 앞에 있습니다’로 옮겼습니다.
- source_word: ἀπὸ τῆς γνώσεώς σου
  english_pob_choice: from your knowledge
  chosen_korean: 당신의 지식으로부터
  alternatives_korean:
  - 당신의 아심으로부터
  - 당신의 앎으로부터
  lexicon: γνῶσις
  rationale: γνῶσις는 단순 정보가 아니라 아심/지식의 포괄적 능력을 뜻하므로, 본문이 말하는 하나님 인지의 전면성을 살려 ‘지식’으로 두었습니다.
theological_decisions:
- issue: 하나님 호칭의 번역
  chosen_reading: 앞의 Κύριε는 ‘주님’, 뒤의 ὁ θεός는 ‘하나님’으로 구분해 번역했습니다.
  alternative_readings:
  - 모두 ‘주님’으로 통일
  - 모두 ‘하나님’으로 통일
  rationale: 원문은 동일 인물을 가리키더라도 호칭을 달리하며 수사적 평행을 이룹니다. 이를 구분해 옮겨 원문의 호칭 변화를 보존했습니다.
  doctrine_reference: 문맥상 호칭 구분 보존
- issue: ‘경건한 이들’의 정체
  chosen_reading: ὅσιοι를 ‘성도’가 아니라 ‘경건한 이들’로 옮겨, 시편적·지혜문학적 맥락의 품성 강조를 살렸습니다.
  alternative_readings:
  - 성도
  - 거룩한 이들
  rationale: 이 본문은 교회 제도적 용어보다 경건의 성격을 말하는 표현이 더 적합하므로, 독자가 원문의 윤리적 초점을 이해하도록 했습니다.
  doctrine_reference: 어휘-문맥 일치
