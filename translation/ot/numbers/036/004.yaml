  from: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
  to: Even when the Jubilee year[a] comes for the Israelites, their inheritance will remain part of the inheritance of the tribe they marry into, and it will be taken away from the inheritance of our fathers’ tribe.”
