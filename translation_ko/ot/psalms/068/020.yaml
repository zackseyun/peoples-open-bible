revisions:
- from: 주님은 송축받으소서. 주님께서는 날마다 우리를 지탱하십니다 — 하나님은 우리의 구원이십니다. 셀라[a]
  to: 하나님은 우리에게 구원의 하나님이시며, 죽음에서 벗어날 길들은 주 여호와께 있습니다.[a][b]
  rationale: 제시된 히브리어 본문을 우선하여, 초안에 혼입된 68:19의 내용을 제거하고 68:20 전체를 번역했습니다. 첫 구절의 반복된 אֵל은 ‘하나님은 … 하나님의’ 구조로 보존했으며, מוֹשָׁעוֹת의 복수 뉘앙스는 한국어의 자연스러움을 위해 각주에서 밝혔습니다. 마지막 구절은 לַמָּוֶת תּוֹצָאוֹת의 문자적 ‘출구들’과 문맥적 ‘죽음에서 벗어남’을 함께 살려 번역했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:10:18Z'
