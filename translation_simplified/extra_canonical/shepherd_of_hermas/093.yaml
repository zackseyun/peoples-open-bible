translation:
  text: '“Sir,” I said, “explain something else.” He asked, “What do you want to know?” “Why did the stones
    come up from the depths and get placed in the building? They had already worn these spirits.”


    2. He said, “They had to come up through water to be made alive. They could not enter God’s kingdom
    without putting off the deadness of their former life.[a]”


    3. “So those who had fallen asleep also received the seal of the Son of God and entered God’s kingdom.[b]
    Before a person bears the name of the Son of God, that person is dead. On receiving the seal, the
    person puts off deadness and takes up life.”


    4. “The seal is the water.[c] They go down into the water dead and come up alive. This seal was also
    proclaimed to those people. They used it to enter God’s kingdom.”


    5. “Sir,” I said, “why did the forty stones come up from the depths with them? They already had the
    seal.” He said, “These apostles and teachers proclaimed the name of the Son of God. After falling
    asleep in his power and faith, they also proclaimed to those who had fallen asleep before them. They
    themselves gave those people the seal of the proclamation.”


    6. “They went down into the water with them and came up again. These went down alive and came up alive
    again. Those who had fallen asleep earlier went down dead but came up alive.[d]”


    7. “Through these, they were made alive and came to know the name of the Son of God. They came up
    together and were fitted into the building of the tower. They were built in without being hewn. They
    had fallen asleep in righteousness and great purity. They lacked only this seal. Now you have their
    explanation too.”[e] “I have it, sir,” I said.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: “Former” is bracketed in the printed Greek, supplied from the versions as reported. Sinaiticus
      partly preserves a corresponding first/former-life expression, with damage in the paragraph. The
      necessity and unless condition are retained.
  - marker: b
    reason: textual_variant
    text: 'The entry-into-the-kingdom sentence is bar-marked as an insertion in the older working edition,
      reported missing in Athos by similar endings. It is now attested in the primary Sinaiticus transcription,Q95F8r
      col4 lines8–14, as entry into “the kingdom of the Son of God.” The draft retains the printed “God’s
      kingdom”; alternative: “They entered the kingdom of the Son of God.” The next printed “of the Son”
      phrase is bracketed and also occurs in Sinaiticus. This corroboration is specific to these phrases,
      not a full adoption of Sinaiticus.'
  - marker: c
    reason: lexical_alternative
    text: The source itself identifies the seal as water and describes descent dead and ascent alive.
      This is baptismal imagery in the vision; the draft does not replace the narrated actions with a
      later doctrinal explanation or insert the word Hades.
  - marker: d
    reason: textual_variant
    text: 'The older edition supplies the entire contrast from Clement of Alexandria’s quotation, with
      an inner bracket around “and came up alive again.” Bounded comparison of Clement, Stromata2.9.44.2–3,1906
      printed136, supports retaining that inner phrase. Sinaiticus also has the contrast, with some supplied
      letters, but its apostles’ ascent reads “and came up again,” without a repeated “alive”; alternative:
      “But these went down alive and came up again; those who had fallen asleep before them went down
      dead but came up alive.” These are separate transmission routes, not unanimous wording. The Clement
      editor’s corrections elsewhere from Hermas are not independent manuscript evidence.'
  - marker: e
    reason: lexical_alternative
    text: “Through these” keeps the source’s plural expression rather than inserting a new named agent.
      The speakers distinguish the apostles/teachers from those who died earlier; the draft preserves
      the vision’s proclamation, seal and life language without extending its scope beyond the described
      groups.
lexical_decisions:
- source_word: κύριε
  chosen: sir
  alternatives:
  - Lord
  - master
  rationale: Respectful address to the visionary shepherd; keep it distinct from explicit references to
    the divine Lord.
- source_word: σφραγίς / νέκρωσις / κεκοιμημένοι
  chosen: seal / deadness / those who had fallen asleep
  alternatives:
  - mark / death / the dead
  rationale: Retain the explicit water identification and the life/death contrast, including proclamation
    to those who died earlier. Do not substitute a later universal claim or omit the narrated necessity.
- source_word: ἀλατόμητοι
  chosen: without being hewn
  alternatives:
  - uncut
  rationale: The stones are incorporated without further cutting because the people died in righteousness
    and purity; retain the building image.
