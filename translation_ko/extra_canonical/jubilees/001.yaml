revisions:
- from: '1[a]. 이스라엘 자손이 애굽에서 나온 지 첫째 해 셋째 달에 이런 일이 일어났으니

    2. 그 달 십육일에 주님께서 모세에게 말씀하여 이르시되 산으로 내게로 올라오라 내가 율법과 계명을 기록한 두 돌판을 네게 주리니 너로 가르치리라 하신지라 모세가 주님의 산에 올라가니 주님의 영광이 시내산에 머무르고

    3. 그리고 엿새 동안 구름이 그것을 덮었습니다.

    4. 일곱째 날에 그가 구름 가운데서 모세를 부르시니 주님의 영광이 산 꼭대기에 붙는 불 같이 나타나시니라 그리고 모세는 사십 주 사십 야를 산에 있었습니다.

    5. 주님께서 처음과 장래 일과 율법의 모든 날의 구분과 증거의 일을 그에게 가르치시니라 이르시되 내가 이 산에서 네게 이르는 모든 것을 너는 마음에 두고 책에 기록하라 이는 그들이 오늘 나와 너희 사이에 세우는 규례를 그들이 어겨 모든 악을 행하였으므로 내가 그들을 버리지 아니한 것을 그들의 후손으로 알게 하려 함이라

    6. 시내산에서 그들의 세대를 위하여.” 이러하리라 이 모든 일이 그들에게 임한 후에 그들은 자기의 모든 심판과 모든 행위에 있어서 내가 그들보다 의로운 줄 알리라

    7. 그러면 그들은 내가 진실로 그들과 함께 있었다는 것을 알게 될 것입니다. 내가 오늘 네게 알리는 모든 말을 너는 기록하라 내가 그들의 조상 아브라함과 이삭과 야곱을 향하여 맹세하여 이르기를 내가 젖과 꿀이 흐르는 땅을 네 자손에게 주리라 한 땅으로 그들을 인도하여 들이기 전에 나는 그들의 반역함과 그들의 목이 곧은 것을 아노라 그리하면 그들이 먹고 배부르리라

    8. 그들은 다른 신들에게로 향할 것인데, 그들은 자기들을 그 환난에서 건져내지 못하는 자들입니다.

    9. 그리고 이 증언은 그들에 대한 증언으로 들리게 될 것입니다. 그들은 나의 모든 계명과 내가 그들에게 명령하는 모든 것을 잊어버리고 이방인과 더러운 것과 수치스러운 일을 좇고 그들의 신들을 섬기리니 이것이 그들에게 거치는 것과 환난과 환난과 올무가 되리라.

    10. 많은 사람이 멸망하고 사로잡혀 원수의 손에 떨어지리니 이는 그들이 내 규례와 계명과 내 언약의 절기와 안식일과 내가 그들 중에서 나를 위하여 거룩하게 한 성물과 내 이름을 두려고 이 땅 가운데에 구별한 내 장막과 내 성소를 버렸음이라.

    11. 그들은 자기를 위하여 산당과 아세라와 조각한 형상을 만들고 각각 자기의 죄악에 절하며 마귀에게와 자기 마음의 그릇된 모든 일에게 자기 자녀를 제물로 드리리로다

    12. 그리고 내가 그들에게 증언하려고 증인을 보내겠지만 그들은 듣지 않을 것입니다. 증인들도 죽이고 율법을 구하는 자들을 쫓아내며 모든 것을 뒤엎고 악한 일을 시작하리라

    13. 내 눈앞에서. 내가 그들에게서 내 얼굴을 가리고 그들을 열방의 손에 넘겨 포로와 약탈과 삼키게 하며 그들을 땅 가운데에서 쫓아내며 열방 중에 흩으리로다

    14. 그들은 내 모든 율법과 내 모든 계명과 내 모든 규례를 잊어버리고 월삭과 같이 미혹하리라

    15. 안식일과 축제와 희년과 규례들입니다. 그 후에 그들이 마음을 다하고 뜻을 다하고 힘을 다하여 이방인 중에서 내게로 돌아올 것이라 내가 그들을 모든 이방인 중에서 모으리니 그들이 나를 찾아 발견되리라 그들이 마음을 다하고 성품을 다하여 나를 구하면 내가 의와 함께 풍성한 평안을 그들에게 나타내리니 내가 그들을 곧게 심은 식물처럼 심을 것이요

    16. 내 마음을 다하고 뜻을 다하여. 그리고 그들은 축복이 되고 저주가 되지 않을 것이며, 머리가 되고 꼬리가 되지 않을 것입니다. 내가 그들 가운데 내 성소를 건축하고 그들과 함께 거할 것이며

    17. 나는 그들의 하나님이 되고 그들은 진리와 정의로 나의 백성이 되리라.

    18. 나는 그들을 버리지 아니하며 그들에게서 떠나지도 아니하리니 나는 그들의 하나님 주님임이니라 그리고 모세는 얼굴을 땅에 대고 엎드렸습니다.

    19. 그가 기도하여 이르되 주 나의 하나님이여 주의 백성과 주의 기업을 버리지 마시고 그들의 마음의 그릇된 길로 행하지 마옵소서 그들을 그들의 원수 곧 이방인들의 손에 붙이지 마옵소서 그들이 그들을 주관하여 주께 범죄하게 할까 두려우니이다 주님여, 주의 백성 위에 주의 자비를 베푸소서

    20. 그들에게 정직한 영을 창조하시고 벨리알의 영이 그들을 주관하게 하사 그들을 주 앞에서 고소하지 못하게 하사 그들을 모든 의의 길에서 꾀어 그들이 주의 앞에서 멸망하게 하지 마옵소서 그러나 그들은 주의 큰 능력으로 애굽의 손에서 구원하신 주의 백성이요 주의 기업이로소이다. 그들을 위해 창조하세요

    21. 깨끗한 마음과 성령을 주시고 지금부터 영원히 죄에 빠지지 않게 하소서.” 주님께서 모세에게 이르시되 내가 그들의 반역과 생각과 목이 곧은 것을 아노니 그들이 듣지 아니하고

    22. 자기 죄와 자기 조상의 죄를 깨달을 때까지라 그 후에는 그들이 정직하고 마음을 다하고 뜻을 다하여 내게로 돌아오리라

    23. 그리고 내가 그들의 마음의 덮개와 그들의 후손의 마음의 덮개를 열고, 그들에게 성령을 창조하여, 그들이 그날부터 영원까지 나를 떠나지 않도록 깨끗하게 하겠다.

    24. 그리고 그들의 영혼은 나와 나의 모든 계명을 굳게 붙잡고 나의 계명을 행할 것이다. 그리고 나는 그들의 아버지가 되고 그들은 나의 자녀가 될 것이다.

    25. 그리고 그들 모두는 살아계신 하나님의 자녀라 일컬음을 받을 것이며 모든 천사와 모든 영은 그들이 내 자녀인 것과 내가 정직과 공의로 그들의 아버지인 것과 내가 그들을 사랑하는 것을 알 것이며 참으로 알리라.

    26. 이제 내가 이 산에서 너희에게 알게 한 이 모든 말 곧 처음이요 나중이며 장래에 올 일을 율법과 증거의 모든 날과 희년의 주간에 영원히 기록하리니 내가 강림하여 영원토록 저희와 함께 거하리라.”

    27. 그리고 앞을 내는 천사에게 말씀하셨다. “창조의 시작부터 영원토록 내 성소가 그들 가운데 세워질 때까지 모세를 위하여 기록하라.

    28. 주님께서 모든 사람의 눈에 나타나시리니 모든 사람이 내가 이스라엘의 하나님이요, 야곱의 모든 자손의 아버지요, 시온 산의 영원무궁토록 왕인 줄 알리라. 그리고 시온과 예루살렘이 거룩해질 것이다.”

    29. 이스라엘 진 앞에 가던 임재의 사자가 창조의 때로부터 율법과 증거와 해마다의 희년의 주간과 해마다의 희년을 기록한 판을 가져갔으니 곧 새 창조의 날부터 하늘과 땅과 그 모든 피조물이 하늘의 권능들과 땅의 모든 창조를 따라 새로워져 성소까지 이르리라 주님의 빛이 예루살렘 시온산에 창조되고 모든 빛이 새롭게 되어 이스라엘의 택하신 모든 자의 치료와 평강과 축복을 얻게 하려니와 그 날부터 세상의 모든 날에 이와 같으리라.'
  to: '1. 그리고 이스라엘 자손이 이집트에서 떠난 첫해 셋째 달에, 이런 일이 있었습니다.

    2. 그 달 열여섯째 날에 야훼께서 모세에게 말씀하셨습니다. “산으로 내게 올라오십시오. 내가 네게 율법과 계명, 곧 내가 기록한 것을 담은 두 돌판을 주겠습니다. 네가 그것들을 가르치도록 하기 위해서입니다.” 그러자 모세는 야훼의 산으로 올라갔고, 야훼의 영광이 시내 산에 머물렀습니다.

    3. 야훼의 영광이 시내 산 위에 있었고, 구름이 그것을 여섯 날 동안 덮었습니다. 그리고 그분이 그를 부르셨습니다.

    4. 그리고 일곱째 날에 야훼께서 구름 한가운데서 모세를 부르셨습니다. 야훼의 영광의 모습은 산 꼭대기에서 타오르는 불과 같았습니다. 모세는 그 산에서 사십 일과 사십 밤을 지냈습니다.

    5. 주께서는 그에게 처음의 일들과 장차 올 일들, 곧 율법과 증언에 관한 모든 날의 구분에 대한 기록을 가르치셨습니다. 그리고 말씀하셨습니다. “너는 이 산에서 내가 네게 말하는 모든 것을 마음에 새기고 책에 기록하여라. 그러면 그들의 후손들이, 그들이 나와 너 사이에 내가 세우는 규례를 어김으로써 저지른 모든 악 때문에 내가 그들을 버리지 않았음을 보게 될 것이다.”

    6. 오늘 시내 산에서, 그들의 세대를 위하여—그리고 그리될 것입니다. 이 모든 일이 그들에게 임할 때, 그들은 내가 그들의 모든 판단과 모든 행위에 있어서 그들보다 더 의롭다는 것을 알게 될 것입니다.

    7. 그들은 내가 그들과 함께해 왔다는 것을 알게 될 것입니다. 너는 오늘 내가 너에게 알게 하는 모든 말을 기록해 두십시오. 내가 그들의 반역과 목이 뻣뻣한 것을 알고 있기 때문입니다. 내가 그들을, 내가 그들의 조상들 곧 아브라함과 이삭과 야곱에게 ‘너희 후손에게 젖과 꿀이 흐르는 땅을 주겠다’라고 말씀하시며 맹세한 땅으로 데려가기 전에 말입니다. 그들은 먹고 배부를 것입니다.

    8. 그들은 그 어떤 환난에서도 자신들을 구원할 수 없는 이방 신들에게로 돌아갈 것입니다.

    9. 그리고 이 증언이 그들에게 불리한 증언으로 들릴 것입니다. 그들이 내 모든 계명, 곧 내가 그들에게 명하는 모든 것을 잊고, 민족들을 따라가며, 그들의 부정함을 따라가며, 그들의 수치스러운 것들을 따라가며, 그들의 신들을 섬길 것이기 때문입니다. 그 신들은 그들에게 걸림돌이 되고 고난과 환난과 덫이 될 것입니다.

    10. 그리고 많은 이들이 멸망하고, 붙잡혀 원수의 손에 넘어갈 것입니다. 이는 그들이 내 규례와 내 명령과 내 언약의 절기들과 내 안식일들과, 내가 그들 가운데에서 나를 위하여 거룩하게 한 내 거룩한 것들과, 내 이름을 그 위에 두기 위해 내가 그 땅 한가운데에서 나를 위하여 거룩하게 한 내 장막과 내 성소를 버렸기 때문입니다.

    11. 그리고 그들은 자기들을 위하여 산당과 신성한 수풀과 새긴 우상들을 만들 것이며, 저마다 자기의 그릇됨에 절할 것이며, 자기들의 자녀를 귀신들과 그들의 마음의 그릇됨에서 나온 모든 행위에 제물로 바칠 것입니다.

    12. 그리고 내가 그들에게 증언하려고 증인들을 보내겠으나, 그들은 듣지 않을 것입니다. 또한 그들은 증인들을 죽이고, 율법을 찾는 이들을 쫓아내며, 모든 것을 뒤엎고 악을 행하기 시작할 것입니다.

    13. 내 눈앞에서. 내가 그들에게서 내 얼굴을 숨기고, 그들을 나라들의 손에 넘겨 포로가 되고, 약탈당하고, 삼켜지게 하며, 그들을 땅 한가운데에서 뿌리째 뽑아 내고, 그들을 나라들 가운데에 흩어 버리겠습니다.

    14. 그리고 그들은 내 모든 율법과 모든 계명과 모든 규례를 잊어버리고, 초하루들에 관하여 그릇될 것입니다.

    15. 또한 안식일들과 절기들과 희년들과 규례들을 잊을 것입니다. 그 후에 그들은 온 마음과 온 영혼과 온 힘을 다하여 여러 민족 가운데서 내게로 돌아올 것이며, 나는 그들을 모든 민족 가운데서 모으겠습니다. 그들은 나를 찾아, 내가 그들에게 발견될 것입니다. 그들이 온 마음과 온 영혼을 다하여 나를 찾을 때, 나는 의 안에서 풍성한 평강을 그들에게 나타내고, 그들을 의로운 심음으로 옮겨 심겠습니다.

    16. 온 마음과 온 영혼으로. 그리고 그들은 복이 되고 저주가 되지 않을 것이며, 머리가 되고 꼬리가 되지 않을 것입니다. 또 내가 그들 가운데 내 성소를 세우고, 그들과 함께 거하겠습니다.

    17. 나는 그들의 하나님이 되고, 그들은 진실과 의 안에서 내 백성이 될 것입니다.

    18. “나는 그들을 버리지도 않고, 그들에게서 멀어지지도 않겠습니다. 내가 그들의 주 하나님이기 때문입니다.” 그리고 모세는 얼굴을 땅에 대고 엎드렸습니다.

    19. 그리고 그는 기도하며 말했습니다. “주님, 제 하나님이시여, 당신의 백성과 당신의 기업을 그들이 마음의 그릇됨을 따라 방황하도록 내버려 두지 마시고, 그들을 그들의 원수인 여러 민족의 손에 넘기지 마십시오. 그 민족들이 그들을 다스리고 당신께 죄를 짓게 할까 하기 때문입니다. 주님, 당신의 자비가 당신의 백성 위에 높이 들리게 하십시오.”

    20. 그리고 그들에게 바른 영을 창조하시고, 벨리알의 영이 그들을 다스리며 주님 앞에서 그들을 고발하고 의의 모든 길에서 떠나게 하지 마소서. 그들이 주님의 얼굴 앞에서 멸망하지 않게 하소서. 그러나 그들은 주님의 백성이며 주님의 유산입니다. 주님께서는 큰 능력으로 그들을 애굽의 손에서 구해 내셨습니다. 그들을 위하여 창조하소서.

    21. 깨끗한 마음과 거룩한 영을 가지게 하시고, 이제부터 영원토록 그들이 그들의 죄에 얽매이지 않게 하십시오.” 그리고 주님께서 모세에게 말씀하셨습니다. “나는 그들의 거역함과 그들의 생각과 그들의 목이 곧음을 알고 있으며, 그들은 듣지 않을 것입니다

    22. 그리고 그들은 자기 죄와 자기 조상들의 죄를 인정할 때까지는 듣지 않을 것입니다. 그리고 그 뒤에 그들은 온전히 바르게, 온 마음으로, 온 영혼으로 저에게 돌아올 것입니다.

    23. 내가 그들의 마음의 포피와 그들의 후손의 마음의 포피를 잘라 내고, 그들을 위하여 거룩한 영을 창조하며, 그들이 그날부터 영원까지 나를 따르는 길에서 돌아서지 않도록 그들을 정결하게 하겠습니다.

    24. 그들의 영혼은 나와 나의 모든 계명에 굳게 붙을 것이며, 그들은 나의 계명을 지킬 것입니다. 나는 그들의 아버지가 되고, 그들은 나의 자녀가 될 것입니다.

    25. 모든 천사와 모든 영은 이들이 내 자녀들이며, 내가 정직과 의 안에서 그들의 아버지이고, 내가 그들을 사랑한다는 것을 알게 될 것입니다.

    26. “그리고 나는 이 산에서 너에게 알리고 있는 이 모든 것을 기록하겠습니다. 곧 처음인 것과 마지막인 것과 앞으로 올 것, 율법과 증언과 그 희년들의 주간들 안에 있는 모든 날의 구분들 전체에 걸쳐 영원히, 내가 내려가 그들과 함께 영원한 모든 시대에 걸쳐 거주할 때까지입니다.”

    27. 그가 임재의 천사에게 말씀하셨다. “창조의 시작부터 내 성소가 그들 가운데 영원무궁히 세워질 때까지의 일을 모세를 위하여 기록하라.” “그리고 주께서는 모든 이의 눈에 나타나실 것이다.”

    28. 그리고 모든 사람이 내가 이스라엘의 하나님이며 야곱의 모든 자녀의 아버지이고, 시온 산에서 영원히 다스리는 왕임을 알게 될 것입니다. 또 시온과 예루살렘은 거룩할 것입니다.

    29. 그리고 이스라엘 진영 앞에서 나아가던 임재의 천사가, 창조 때부터의 해들의 구분, 곧 율법과 증언, 그들의 희년들의 주간들을 그 모든 수에 따라 해마다 기록하고, 또 희년들을 해마다 기록한 판들을 가져갔습니다. 그것은 창조의 날부터 하늘과 땅과 그 모든 피조물이 하늘의 권능에 따라, 또 땅의 모든 창조물에 따라 새롭게 되고, 예루살렘 시온 산에 야훼의 성소가 세워지며, 모든 빛이 이스라엘의 모든 택하신 이들을 위한 치유와 평화와 복을 위해 새롭게 될 날까지의 것이며, 그날부터 땅의 모든 날 동안 그렇게 되게 하려는 것이었습니다.'
  category: register_archaic_repair
  rationale: '이 장 파일의 한국어 본문은 개역 계열 문어체(「이르되」, 「-니라」, 「-더라」, 「하사」, 「하옵」 등)로 작성되어 있었고 문장 부호도 대부분 빠져 있어, KOREAN_PIPELINE.md가 규정한 현대 표준어 합쇼체 등록과 어긋났습니다. 원문이 아니라 개역 계열 한국어 성경을 바탕으로 초벌 작성된 흔적도 있었습니다(예: 6장 2절의 「어린아이」는 게으즈 원문과 영어 POB의 kids/young goats, 곧 「염소 새끼」를 잘못 옮긴 것입니다). 같은 장의 절 단위 기록(translation_ko/extra_canonical/jubilees/<장>/<절>.yaml)은 이미 게으즈 원문을 근거로 합쇼체로 번역되어 검토를 마친 상태이므로, 장 파일의 본문을 그 절 단위 기록을 순서대로 이어 붙여 다시 만들었습니다. 이렇게 하면 같은 본문에 대해 서로 어긋나는 두 개의 번역이 생기지 않고, 장 파일도 절 기록과 동일하게 원문에 근거하게 됩니다. 절 기록의 각주 표지는 장 단위로 합치면 서로 충돌하므로 집계 본문에서는 제거했습니다. 각주는 절 단위 기록이 계속 보유합니다.'
