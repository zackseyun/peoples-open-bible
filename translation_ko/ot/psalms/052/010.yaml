- source_word: עוֹלָם וָעֶד
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
  - 영원히
  - 영원토록
  - 세세토록
  lexicon: HALOT
  rationale: 중첩 표현의 강조를 한국어의 관용적인 누적 표현으로 옮겨, 지속성의 강한 강조를 살렸습니다.
theological_decisions:
- issue: חֶסֶד의 신학적 무게
  chosen_reading: 하나님의 변함없는 사랑
  alternative_readings:
