  rationale: 제시된 WLC 본문에 맞추어 번역을 전면 교정했습니다. נִשְׁפַּכְתִּי는 ‘쏟아졌고’로, הִתְפָּרְדוּ는 뼈가 서로 떨어져 나가거나 탈구되는 이미지를 살린 ‘어그러졌습니다’로 옮겼습니다. הָיָה לִבִּי כַּדּוֹנָג נָמֵס는 결과 상태와 녹는 밀랍의 비유를 따라 ‘내 마음은 밀랍처럼 되었으며 … 녹아내렸습니다’로 번역했습니다. מֵעַי의 해부학적·정서적 신체성을 보존하기 위해 본문에는 자연스러운 ‘내 속’을 쓰고 각주에 문자적 표현을 남겼습니다.
