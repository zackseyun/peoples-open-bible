  meaning_decisions:
  - source_phrase: ἕκαστος εἰς τὴν ἔμπροσθεν
    prior_rendering: each one to his former place
    new_rendering: Each returned to his former home
    rationale: The compressed phrase supplies the destination of the return described in verse 20; the homeward context identifies the former place as each person's home.
  - source_phrase: ἐξουσίαν ἐσχηκότες μετὰ δόξης καὶ φόβου
    prior_rendering: having obtained authority ... with glory and fear
    new_rendering: They now held authority ... and were honored and feared
    rationale: Here glory concerns their restored public honor, and fear is the fear they inspire in others, as the restitution in verse 22 confirms.
  - source_phrase: τὸ σύνολον ὑπὸ μηδενὸς διασεισθέντες τῶν ὑπαρχόντων
    prior_rendering: their whole body of possessions having been shaken by none
    new_rendering: no one robbed them of any of their possessions
    rationale: The participle describes the people, not the possessions, and in relation to property the verb can denote extortion or plundering; the clause guarantees that no one deprived them of their belongings.
