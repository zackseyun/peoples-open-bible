  from: endures sorrows while suffering unjustly because of consciousness of God
  to: because of consciousness of God, endures sorrows while suffering unjustly
  rationale: The current word order places the causal phrase 'because of consciousness of God' at the very end of the clause. This makes it syntactically ambiguous, as it could be read as modifying 'suffering unjustly' rather than the intended verb 'endures'. The Greek word order, 'διὰ συνείδησιν θεοῦ ὑποφέρει' (because of consciousness of God, he endures), makes the connection between the motive and the action of enduring explicit. Moving the causal phrase earlier in the English clause, as in '...if someone, because of consciousness of God, endures sorrows...', resolves this awkwardness and better reflects the logical flow of the source text.
