id: ECC.5.18
reference: Ecclesiastes 5:18
source:
  edition: WLC
  text: גַּ֣ם כָּֽל הָ/אָדָ֡ם אֲשֶׁ֣ר נָֽתַן ל֣/וֹ הָ/אֱלֹהִים֩ עֹ֨שֶׁר וּ/נְכָסִ֜ים וְ/הִשְׁלִיט֨/וֹ לֶ/אֱכֹ֤ל מִמֶּ֨/נּוּ֙ וְ/לָ/שֵׂ֣את אֶת חֶלְק֔/וֹ וְ/לִ/שְׂמֹ֖חַ בַּ/עֲמָל֑/וֹ זֹ֕ה מַתַּ֥ת אֱלֹהִ֖ים הִֽיא־־־׃
translation:
  text: Also, when God gives someone wealth and possessions and enables them to enjoy them[a], take their portion, and rejoice in their labor, this is God’s gift.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “eat from it,” referring to the wealth and possessions.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  chosen: Also
  alternatives:
  - Moreover
  - Even
  lexicon: HALOT
  rationale: Connective/adverb continuing the reflection from the previous verse; 'Also' preserves the additive force without sounding overly formal.
- source_word: כָּל הָאָדָם
  chosen: every man
  alternatives:
  - everyone
  - every person
  - all humankind
  lexicon: HALOT
  rationale: The phrase is distributive and generic. Per doctrine, gender-accurate rendering is preferred where Hebrew uses masculine representative language. 'Every man' preserves the singular-generic force better than the pluralizing 'everyone,' while still functioning idiomatically in English.
- source_word: נָתַן לוֹ הָאֱלֹהִים
  chosen: God has given
  alternatives:
  - God gave
  lexicon: HALOT
  rationale: The Hebrew perfect here states a completed act with present relevance in a general truth setting. English present perfect communicates that well in this wisdom context.
- source_word: עֹשֶׁר
  chosen: wealth
  alternatives:
  - riches
  lexicon: HALOT
  rationale: '''Wealth'' is the most natural modern rendering for material abundance in wisdom literature.'
- source_word: נְכָסִים
  chosen: possessions
  alternatives:
  - property
  - assets
  lexicon: HALOT
  rationale: Distinguishes this term from עֹשֶׁר while keeping accessible modern English; it refers to owned goods/property.
- source_word: וְהִשְׁלִיטוֹ
  chosen: has enabled him
  alternatives:
  - has given him power
  - has enabled him
  - has allowed him
  lexicon: HALOT
  rationale: In context the verb describes God’s granting a person the ability to benefit from possessions.
- source_word: לֶאֱכֹל מִמֶּנּוּ
  chosen: to eat from them
  alternatives:
  - to enjoy them
  - to partake of it
  lexicon: HALOT
  rationale: The idiom is literally 'to eat from it,' referring to deriving sustenance/enjoyment from one's wealth. I retained the concrete image rather than paraphrasing to 'enjoy,' since the following clauses already unpack the enjoyment theme. Number shifts to 'them' because the antecedent is the pair 'wealth and possessions' in English.
- source_word: וְלָשֵׂאת אֶת חֶלְקוֹ
  chosen: to take up his portion
  alternatives:
  - to receive his lot
  - to take his share
  - to accept his portion
  lexicon: HALOT
  rationale: חלק commonly means one's allotted share/portion in Ecclesiastes. For נשׂא, 'take up' preserves the verbal force without overinterpreting it as merely mental acceptance. The phrase conveys appropriating one's allotted share in life.
- source_word: וְלִשְׂמֹחַ בַּעֲמָלוֹ
  chosen: to rejoice in his labor
  alternatives:
  - to enjoy his toil
  - to be glad in his work
  lexicon: HALOT
  rationale: Ecclesiastes often uses עמל for labor/toil. 'Labor' preserves the weight of effort better than the lighter 'work,' while 'rejoice in' keeps the explicit joy language of שמח.
- source_word: זֹה מַתַּת אֱלֹהִים הִיא
  chosen: this is the gift of God
  alternatives:
  - this is God's gift
  - this is a gift of God
  lexicon: HALOT
  rationale: A straightforward predication. 'The gift of God' reads naturally and can denote the reality just described as divine gift without implying exclusivity beyond the context.
