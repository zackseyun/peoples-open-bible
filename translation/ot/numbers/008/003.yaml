  from: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
  to: 'Aaron did so: he lit the lamps[a] to shine in front of the lampstand, just as Yahweh had commanded Moses.'
