id: ISA.17.14
reference: Isaiah 17:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/עֵ֥ת עֶ֨רֶב֙ וְ/הִנֵּ֣ה בַלָּהָ֔ה בְּ/טֶ֥רֶם בֹּ֖קֶר אֵינֶ֑/נּוּ זֶ֚ה חֵ֣לֶק שׁוֹסֵ֔י/נוּ וְ/גוֹרָ֖ל לְ/בֹזְזֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/014.yaml
  text: At evening time, look—terror! Before morning, he is no more. This is the portion of those who plunder us, and the lot of those who loot us.
translation:
  language: ko
  text: 저녁때에 보십시오—공포입니다! 아침이 되기 전에 그는 더 이상 없습니다. 이것이 우리를 약탈하는 자들의 몫이요, 우리를 노략질하는 자들의 제비입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֵת עֶרֶב / בְּטֶרֶם בֹּקֶר
  english_pob_choice: At evening time / Before morning
  chosen_korean: 저녁 무렵에는 / 아침이 되기 전에는
  alternatives_korean:
  - 저녁때에는 / 새벽 전에는
  - 저녁 시간에는 / 아침 전에
  lexicon: 시간 부사구
  rationale: 히브리어의 대조적 시간표현을 자연스러운 한국어로 살리되, 사건의 급박한 전개가 드러나도록 ‘무렵’과 ‘되기 전’을 사용했습니다.
- source_word: וְהִנֵּה בַלָּהָה
  english_pob_choice: look—terror!
  chosen_korean: 보십시오—공포입니다!
  alternatives_korean:
  - 보라—공포입니다!
  - 보십시오, 두려움입니다!
  lexicon: 감탄·명령 표현
  rationale: 히브리어 הנֵּה의 주목 촉구를 직역하되, 영어 POB의 ‘look—’을 반영해 듣는 이를 즉시 끌어당기는 문장으로 옮겼습니다.
- source_word: אֵינֶנּוּ
  english_pob_choice: he is no more
  chosen_korean: 그는 없어집니다
  alternatives_korean:
  - 그는 더 이상 없습니다
  - 그는 있지 않습니다
  lexicon: 부재·소멸 표현
  rationale: 존재 부정을 단순한 실종이 아니라 소멸의 결과로 드러내는 문맥이므로, 한국어로는 상태적 부재보다 단호한 소멸감을 주는 표현을 택했습니다.
- source_word: שׁוֹסֵינוּ / בֹזְזֵינוּ
  english_pob_choice: those who plunder us / those who loot us
  chosen_korean: 우리를 약탈하는 자들 / 우리를 노략질하는 자들
  alternatives_korean:
  - 우리를 노략하는 자들 / 우리를 빼앗는 자들
  - 우리를 강탈하는 자들 / 우리를 약탈하는 자들
  lexicon: 가해자 명사구
  rationale: 두 동사는 모두 반복적 약탈을 가리키지만 어감이 겹치지 않도록 ‘약탈하다’와 ‘노략질하다’를 구분해 원문의 병렬을 보존했습니다.
theological_decisions:
- issue: 예언적 경고의 시간 대비
  chosen_reading: 저녁과 아침의 급격한 대비를 통해 심판의 신속함과 불가피성을 드러냈습니다.
  alternative_readings:
  - 단순한 시간 정보로 평이하게 처리하는 읽기
  - 상징적 시간표현으로 완화하는 읽기
  rationale: 본문은 시간 정보 자체보다 ‘저녁—아침’의 반전으로 멸망의 급박함을 강조하므로, 그 긴박성을 한국어에서도 유지했습니다.
  doctrine_reference: 예언서의 심판 선언
- issue: ‘보십시오’의 화자 호소력
  chosen_reading: 히브리어 הנֵּה를 반말적 ‘보라’보다 합쇼체 ‘보십시오’로 옮겨 공적 선포의 어조를 유지했습니다.
  alternative_readings:
  - 보라—공포입니다!
  - 자, 공포입니다!
  rationale: 예언 담화의 공개적 성격을 고려하면, 한국어 본문은 현대 공적 문체를 유지하는 것이 적절합니다.
  doctrine_reference: 예언 선포의 수사
