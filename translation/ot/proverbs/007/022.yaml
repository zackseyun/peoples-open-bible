id: PRO.7.22
reference: Proverbs 7:22
source:
  edition: WLC
  text: ה֤וֹלֵ֥ךְ אַחֲרֶ֗י/הָ פִּ֫תְאֹ֥ם כְּ֭/שׁוֹר אֶל טָ֣בַח יָב֑וֹא וּ֝/כְ/עֶ֗כֶס אֶל מוּסַ֥ר אֱוִֽיל־־׃
translation:
  text: He follows her at once, like an ox going to slaughter, and like a fool in fetters going to punishment[a],
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The final comparison is uncertain; literally, “like a fetter to the punishment of a fool.” Another proposed reading is “like a deer going into a snare.”
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ
  chosen: goes
  alternatives:
  - walks
  - is going
  lexicon: HALOT
  rationale: Qal participle of הלך used predicatively in context; present English 'goes' gives the vivid, ongoing action without sounding wooden.
- source_word: אַחֲרֶיהָ
  chosen: after her
  alternatives:
  - behind her
  lexicon: HALOT
  rationale: Spatial idiom here conveys following the adulterous woman; 'after her' is natural English and preserves the sense.
- source_word: פִּתְאֹם
  chosen: at once
  alternatives:
  - suddenly
  - immediately
  lexicon: HALOT
  rationale: The adverb marks abrupt, unreflective action. 'At once' fits the context of impulsive compliance; 'suddenly' could suggest merely temporal surprise rather than rash immediacy.
- source_word: כְּשׁוֹר
  chosen: like an ox
  alternatives:
  - as an ox
  - like a bull
  lexicon: HALOT
  rationale: שׁוֹר commonly denotes ox/cattle; 'ox' is the conventional and contextually apt image of a domesticated animal being led unknowingly.
- source_word: אֶל טָבַח יָבֹא
  chosen: going to the slaughter
  alternatives:
  - comes to slaughter
  - to be slaughtered
  lexicon: HALOT
  rationale: The Hebrew literally 'comes to slaughter.' In English, 'going to the slaughter' is idiomatic and preserves the destination/result sense.
- source_word: וּכְעֶכֶס
  chosen: and like a fool in fetters
  alternatives:
  - and like shackles
  - and like an anklet
  lexicon: HALOT
  rationale: עֶכֶס is difficult here but can denote a fetter or restraint. The rendering supplies the implied bearer to produce coherent English while the footnote preserves the uncertain syntax and lexeme.
- source_word: אֶל מוּסַר
  chosen: to the discipline
  alternatives:
  - to correction
  - to punishment
  - to instruction
  lexicon: HALOT
  rationale: מוּסָר in Proverbs often carries the sense of corrective discipline/instruction. Here, in a judgment context, 'discipline' preserves the semantic breadth better than the narrower 'punishment' or the softer 'instruction'.
- source_word: אֱוִיל
  chosen: of a fool
  alternatives:
  - for a fool
  - of the fool
  lexicon: HALOT
  rationale: The final noun is singular masculine 'fool.' The construct-like relation is syntactically difficult; 'of a fool' is a cautious rendering that preserves the Hebrew wording without overresolving the exact relation.
- source_word: הוֹלֵךְ אַחֲרֶיהָ
  chosen: He follows her
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: “Follows her” is the direct idiomatic rendering of going after her in this narrative context.
- source_word: אֶל מוּסַר אֱוִיל
  chosen: going to punishment
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: In this destructive context מוּסָר denotes punitive correction. The rendering construes the fool as the one undergoing it but marks the uncertain entire comparison in the note.
