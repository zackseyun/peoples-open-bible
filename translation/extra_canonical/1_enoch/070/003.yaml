translation:
  text: From that day I was not reckoned among them.[a] He placed me between the two winds, between the north and
    the west,[b] where the angels took cords to measure out for me a place for the chosen and righteous.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The printed verb is reckoned/counted, supported by Dillmann1865 column91. Charles printed128 note4 records
      forms for being drawn/brought; the English does not substitute those readings for the selected verb. The printed
      shift to first-person I/me is retained.
    reason: textual_variant
  - marker: b
    text: Dillmann1865 columns708-709 supports wind for this noun and cites70:3; column180 gives north forመስዕ and
      column964 west forዐረብ. The repeated between construction is retained without pretending its spatial detail
      is more precise than the text.
    reason: lexical_alternative
  - marker: c
    text: Dillmann1865 column100 explicitly cites70:3 under measuring cords. The selected source includes for me
      followed by a place for the chosen and righteous; neither phrase is silently omitted.
    reason: lexical_alternative
