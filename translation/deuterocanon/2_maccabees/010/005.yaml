  from: But when he entered Judea and came near Bethsura[a], a fortified place about five schoeni from Jerusalem[b], he was pressing it hard.
  to: He entered Judea and advanced on Bethsura, a fortified town about five schoeni[a] from Jerusalem, and laid siege to it.
