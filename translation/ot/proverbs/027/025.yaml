id: PRO.27.25
reference: Proverbs 27:25
source:
  edition: WLC
  text: גָּלָ֣ה חָ֭צִיר וְ/נִרְאָה דֶ֑שֶׁא וְ֝/נֶאֶסְפ֗וּ עִשְּׂב֥וֹת הָרִֽים־׃
translation:
  text: The grass is removed[a], fresh growth appears, and the plants of the mountains are gathered.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “The grass appears”; the Hebrew may refer to uncovering rather than removal.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלָה
  chosen: is removed
  alternatives:
  - is uncovered
  - is gone
  - disappears
  lexicon: HALOT
  rationale: The verb literally has the sense of being uncovered or laid bare. With חָצִיר ('hay/grass') as subject in this agricultural context, the sense is that the hay has been cut off or is gone, making room for subsequent growth. 'Is removed' communicates the practical result in natural English without over-paraphrasing.
- source_word: חָצִיר
  chosen: hay
  alternatives:
  - grass
  lexicon: HALOT
  rationale: In this pastoral context the term refers to grass suitable for fodder, and 'hay' fits the sequence of harvesting and regrowth better than the broader 'grass.'
- source_word: נִרְאָה
  chosen: appears
  alternatives:
  - is seen
  - becomes visible
  lexicon: HALOT
  rationale: The Niphal form commonly means 'appears' or 'is seen.' 'Appears' is idiomatic in English and suits the emergence of fresh vegetation after the hay is removed.
- source_word: דֶשֶׁא
  chosen: fresh growth
  alternatives:
  - tender grass
  - green grass
  - fresh grass
  lexicon: HALOT
  rationale: Natural English for fresh green vegetation emerging in the sequence.
- source_word: נֶאֶסְפוּ
  chosen: are gathered
  alternatives:
  - are collected
  - are harvested
  lexicon: HALOT
  rationale: The passive sense 'are gathered' is the most straightforward rendering. 'Harvested' is possible contextually, but 'gathered' stays closer to the lexical sense while still fitting the agricultural setting.
- source_word: עִשְּׂבוֹת
  chosen: the plants
  alternatives:
  - herbs
  - plants
  - green fodder
  lexicon: HALOT
  rationale: Maintains the term’s broad vegetation sense without false species precision.
- source_word: הָרִים
  chosen: of the mountains
  alternatives:
  - of the mountains
  - from the hill country
  lexicon: HALOT
  rationale: The mountain noun varies only for Hebrew number, definiteness, and construct syntax; the underlying concrete sense is unchanged.
- source_word: גָּלָה חָצִיר
  chosen: The grass is gone
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: חָצִיר denotes grass or herbage and need not specify dried hay; in context גָּלָה can express its having gone or been removed.
