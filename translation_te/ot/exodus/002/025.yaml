  terminology: ‘దేవుడు’ మరియు ‘ఇశ్రాయేలీయులు’ స్థిరమైన, గౌరవప్రదమైన పదప్రయోగాలు. ‘తెలుసుకున్నాడు’ ఇక్కడ ఇంగ్లిష్ POB యొక్క ‘knew’తోనూ, హీబ్రూ యాదాʿ క్రియకు ఉన్న విస్తృతార్థంతోనూ సరిపోతుంది; ‘పట్టించుకున్నాడు’ వంటి వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని నివారించడం మంచిది.
