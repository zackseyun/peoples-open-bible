  doctrine_reference: 'DOCTRINE.md Contested terms: Χριστός → Messiah (where title; Christ where name-like)'
- issue: Force of παθεῖν in relation to prophecy
  chosen_reading: that his Messiah would suffer
  alternative_readings:
  - that his Messiah should suffer
  - his Messiah to suffer
  rationale: This wording conveys the prophetic content without overstating modal necessity. It preserves the statement that the prophets announced the Messiah's suffering and that God has now fulfilled it.
