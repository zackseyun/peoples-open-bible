  rationale: 'Greek ποιεῖτε is a present imperative, and ὁσάκις ἐὰν πίνητε explicitly places the command in repeated occasions: whenever the cup is drunk. The phrase εἰς τὴν ἐμὴν ἀνάμνησιν uses ἀνάμνησις for an active memorial remembrance or commemoration. Rendering the clause as "Keep doing this, whenever you drink it, in remembrance of me" makes the recurring Communion practice and its memorial reference to Jesus visible in English.'
