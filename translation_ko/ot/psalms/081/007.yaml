  text: In distress you called, and I rescued you; I answered you from the hiding place of thunder[a]; I tested you at the waters of Meribah[b]. Selah
  footnotes:
  - marker: a
    text: Or “from the secret place of thunder.” The image presents God as concealed within the thunderstorm.
    reason: lexical_alternative
  - marker: b
    text: Meribah recalls the wilderness episodes associated with quarrelling over water (Exodus 17:1–7; Numbers 20:1–13).
    reason: cross_reference
