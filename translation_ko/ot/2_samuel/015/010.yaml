  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: ko
  text: 그러자 압살롬은 이스라엘의 모든 지파에 정탐꾼들[a]을 보내어 이렇게 지시했습니다. “너희가 나팔 소리를 듣거든, ‘압살롬이 헤브론에서 왕이 되었습니다’라고 말하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘정탐꾼들(spies)’입니다. 군사·정치적 맥락에서 비밀리에 상황을 살피게 하는 사람들을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: מְרַגְּלִים
  english_pob_choice: spies
  chosen_korean: 정탐꾼들
  alternatives_korean:
  - 스파이들
  - 첩자들
  lexicon: מְרַגְּלִים
  rationale: 정탐꾼들은 ‘몰래 정보를 살피는 사람들’이라는 기능을 비교적 직접적으로 드러내며, 본문의 군사·정치적 맥락에 맞습니다.
- source_word: בְּ/כָל שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: throughout all the tribes of Israel
  chosen_korean: 이스라엘의 모든 지파에
  alternatives_korean:
  - 이스라엘의 온 지파에
  - 이스라엘 전 지파에
  lexicon: שִׁבְטֵי יִשְׂרָאֵל
  rationale: ‘모든 지파에’로 범위를 간결하게 살리되, 파견 대상이 이스라엘 전체의 지파 공동체임을 유지했습니다.
- source_word: מָלַךְ
  english_pob_choice: has become king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 왕이 되었습니다
  - 다스리기 시작했습니다
  - 즉위했습니다
  lexicon: מָלַךְ
  rationale: 완료 뉘앙스를 살리면서도 한국어에서 자연스러운 결과 상태를 나타내기 위해 ‘왕이 되었습니다’를 택했습니다.
- source_word: בְּ/חֶבְרוֹן
  english_pob_choice: in Hebron
  chosen_korean: 헤브론에서
  alternatives_korean:
  - 헤브론에서
  - 헤브론에
  lexicon: חֶבְרוֹן
  rationale: ‘왕이 되었습니다’와 함께 장소적 범위를 분명히 하려고 ‘~에서’를 사용했습니다.
theological_decisions:
- issue: 압살롬의 선동 연설을 직접화법으로 어떻게 옮길지
  chosen_reading: 직접화법의 명령문을 한국어 명령형으로 유지해, 속임수와 선동의 긴박함을 드러냈습니다.
  alternative_readings:
  - 간접화법으로 완화
  - 설명형으로 재진술
  rationale: 본문은 전달된 말의 내용 자체가 서사의 핵심이므로, 명령문 구조를 보존하는 편이 원문의 효과를 더 잘 반영합니다.
  doctrine_reference: 서사 본문 번역 원칙
