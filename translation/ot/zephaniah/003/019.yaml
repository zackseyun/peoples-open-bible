id: ZEP.3.19
reference: Zephaniah 3:19
source:
  edition: WLC
  text: הִנְ/נִ֥י עֹשֶׂ֛ה אֶת כָּל מְעַנַּ֖יִ/ךְ בָּ/עֵ֣ת הַ/הִ֑יא וְ/הוֹשַׁעְתִּ֣י אֶת הַ/צֹּלֵעָ֗ה וְ/הַ/נִּדָּחָה֙ אֲקַבֵּ֔ץ וְ/שַׂמְתִּי/ם֙ לִ/תְהִלָּ֣ה וּ/לְ/שֵׁ֔ם בְּ/כָל הָ/אָ֖רֶץ בָּשְׁתָּֽ/ם־־־־׃
translation:
  text: Behold, at that time I will deal with all your oppressors[a][f], and I will save the lame and gather the outcast[b], and I will make them praised and renowned[e] in every land[c] where they were put to shame[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'those who afflict you.' The Hebrew verb can denote afflicting, oppressing, or humbling.
    reason: lexical_alternative
  - marker: b
    text: Or 'the one who limps' and 'the one driven away'; the Hebrew uses feminine singular forms, likely personifying the afflicted community.
    reason: lexical_alternative
  - marker: c
    text: Or 'in all the earth.'
    reason: lexical_alternative
  - marker: d
    reason: alternative_reading
    text: The Hebrew ends with ‘their shame.’ ‘Where they were put to shame’ is a contextual expansion, not a literal relative clause; the compressed phrase's grammatical attachment remains uncertain.
  - marker: e
    reason: lexical_alternative
    text: Literally ‘for praise and for a name.’ The main wording makes the public-honor sense explicit, replacing the Hebrew noun imagery with English predicates.
  - marker: f
    reason: textual_variant
    text: Selected Greek texts have action ‘in you, for your sake’ rather than explicitly against all oppressors, and a plural ‘they will be put to shame’ with no subject named in that clause. Rahlfs–Hanhart numbers the shame clause in 3:20; Swete prints it in 3:19. Align the content across these different divisions. Published Hebrew fragments partly support the received oppressors wording; they contain damaged or supplied letters. Neither exact lost Hebrew nor historical priority is established.
lexical_decisions:
- source_word: הִנְנִי
  chosen: Behold
  alternatives:
  - Look
  - See
  lexicon: HALOT
  rationale: Introduces a solemn divine announcement. 'Behold' preserves the prophetic force better than the more colloquial 'look' or 'see'.
- source_word: עֹשֶׂה
  chosen: I will deal with
  alternatives:
  - I am about to act against
  - I will act against
  lexicon: WLC/OSHB; bounded published Hebrew/Greek/Latin comparison
  rationale: The received Qal participle עֹשֶׂה governs the explicit object all-your-afflicters. Retain ‘deal with’ provisionally without Latin's stronger killing claim. Published4Q77/Mur88 report object wording with letter uncertainty; selectedGreek in-you/for-you is different wording, not proof of exact lostHebrew. Future English remains the common restoration-context input, not newly certified; historical priority held. No fresh HALOT consultation.
- source_word: מְעַנַּיִךְ
  chosen: your oppressors
  alternatives:
  - those who afflict you
  - those who humble you
  lexicon: WLC/OSHB morphology; published4Q77/Mur88
  rationale: Piel active participle plural with2fs suffix describes those afflicting/oppressing the feminine addressee. Published directHebrew copies partly support the object sequence, not an undamaged whole clause or received pointing. Retain ‘your oppressors’ provisionally; no physical-copy chronological winner or fresh ink reading. No fresh HALOT consultation.
- source_word: בָּעֵת הַהִיא
  chosen: at that time
  alternatives:
  - in that time
  - on that day
  lexicon: HALOT
  rationale: A standard prophetic temporal formula. 'At that time' is the direct rendering of the Hebrew phrase here; 'on that day' would import a different common formula not used in this clause.
- source_word: וְהוֹשַׁעְתִּי
  chosen: I will save
  alternatives:
  - I will deliver
  lexicon: HALOT
  rationale: The verb ישׁע commonly denotes saving/delivering. 'Save' preserves the theological resonance while fitting the restoration context.
- source_word: הַצֹּלֵעָה
  chosen: the lame
  alternatives:
  - the limping one
  - the crippled
  lexicon: HALOT
  rationale: Literally 'the one who limps,' feminine singular used collectively or personifying the afflicted community. 'The lame' is idiomatic English and preserves the image.
- source_word: הַנִּדָּחָה
  chosen: the outcast
  alternatives:
  - the driven away
  - the banished
  lexicon: HALOT
  rationale: From נדח, 'to drive away/scatter.' 'The outcast' communicates both exclusion and displacement in concise English.
- source_word: אֲקַבֵּץ
  chosen: gather
  alternatives:
  - bring together
  - regather
  lexicon: HALOT
  rationale: A common restoration verb for assembling the scattered people. 'Gather' is direct and preserves biblical intertextual resonance.
- source_word: וְשַׂמְתִּים
  chosen: I will make them
  alternatives:
  - I will set them
  - I will appoint them
  lexicon: HALOT
  rationale: The idiom with following predicates ('for praise and for a name') is best rendered 'make them,' expressing transformed status.
- source_word: לִתְהִלָּה
  chosen: praised
  alternatives:
  - an object of praise
  - renown
  lexicon: BDB printed240 sense5c; WLC/OSHB
  rationale: BDB explicitly cites3:19,20 for figurative praise/object-of-praise public status. English predicate ‘praised’ communicates that status with less opaque noun syntax but more readily suggests actual acclaim; this is a real semantic narrowing/loss of noun imagery, judged warranted moderately in context. No speaker, ceremony or motive added. Hebrew remains a noun; not a new morphological analysis. Pair reversal with20 preserved. No fresh HALOT consultation.
- source_word: וּלְשֵׁם
  chosen: renowned
  alternatives:
  - renown
  - fame
  lexicon: BDB printed1028 name2b(1); WLC/OSHB
  rationale: BDB explicitly associates the name idiom in3:19,20 with reputation/fame/glory. ‘Renowned’ makes that contextual sense explicit while sacrificing literal name-as-noun imagery. The one masked comparison favors this paired rendering moderately, not uniquely. Order praise/name in19 versus name/praise in20 remains praised/renowned versus renowned/praised. No new Hebrew wording or fresh HALOT consultation.
- source_word: בְּכָל הָאָרֶץ
  chosen: in every land
  alternatives:
  - in all the earth
  - throughout the whole earth
  lexicon: HALOT
  rationale: Although הארץ can mean 'earth,' in this restoration context with dispersion/shame among the nations, 'every land' better conveys the distributive sense of places where they had been scattered.
- source_word: בָּשְׁתָּם
  chosen: where they were put to shame
  alternatives:
  - in their shame
  - when they were ashamed
  lexicon: WLC/OSHB morphology; qualified versional alignment
  rationale: The pointed word is a shame noun with3mp suffix, not separately a preposition, relative marker or finite passive. ‘Where they were put to shame’ remains a provisional contextual expansion, not newly certified by the honor trial. Mur88's published noun is unbracketed/unmarked;4Q77's corresponding tail is supplied. Greek instead has a plural future passive without a named subject in that clause; RH numbers it3:20 whereas Swete prints it3:19. Align content rather than infer absence from numbering. Latin has a shame nounphrase. Do not claim uniform versional support or literal in-their-shame. No fresh HALOT consultation.
