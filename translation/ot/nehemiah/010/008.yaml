lexical_decisions:
- source_word: מְשֻׁלָּם
  chosen: Meshullam
  alternatives:
  - Mesullam
  rationale: Proper personal name; per translation philosophy, personal names are transliterated rather than translated. 'Meshullam' is the standard English transliteration.
- source_word: אֲבִיָּה
  chosen: Abijah
  alternatives:
  - Abiah
  rationale: Proper personal name; transliterated by standard English convention. The final theophoric element is commonly represented in English as '-jah'.
- source_word: מִיָּמִן
  chosen: Mijamin
  alternatives:
  - Miamin
  - Miniamin
  rationale: Proper personal name in a list of signatories/priests; transliterated rather than translated. 'Mijamin' preserves the consonantal shape of the Hebrew name in a readable English form.
