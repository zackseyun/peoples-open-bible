simplification_decisions:
- pob_phrase: God is faithful, by whom you were called
  simplified_phrase: God is faithful. He called you
  preserved_meaning: God’s dependable character and personal agency in calling them remain explicit.
  reasoning_layer_used: Lexical decisions for πιστός, δι’ οὗ, and ἐκλήθητε
  rationale: Two direct sentences replace the dense passive construction without weakening God’s agency.
- pob_phrase: called into fellowship with his Son
  simplified_phrase: called you into fellowship with his Son
  preserved_meaning: God’s call brings believers into relational and participatory fellowship with his Son.
  reasoning_layer_used: Lexical decisions for ἐκλήθητε, κοινωνία, and τοῦ υἱοῦ αὐτοῦ
  rationale: The active wording is clearer while “fellowship” avoids specifying what is shared.
- pob_phrase: Jesus the Messiah our Lord
  simplified_phrase: Jesus the Messiah, our Lord
  preserved_meaning: Messiah and Lord remain titles of Jesus.
  reasoning_layer_used: Theological decision for Χριστός and lexical decision for κύριος
  rationale: The comma clarifies the title sequence while preserving the required rendering “Messiah.”
translation_notes:
  risk_flags:
  - risk: “Fellowship” may be unfamiliar to some modern readers.
    mitigation: It is retained because simpler alternatives risk narrowing its relational and participatory meaning.
