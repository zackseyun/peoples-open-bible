id: PSA.84.3
reference: Psalms 84:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם צִפּ֨וֹר מָ֪צְאָה בַ֡יִת וּ/דְר֤וֹר קֵ֥ן לָ/הּ֮ אֲשֶׁר שָׁ֪תָה אֶפְרֹ֫חֶ֥י/הָ אֶֽת מִ֭זְבְּחוֹתֶי/ךָ יְהוָ֣ה צְבָא֑וֹת מַ֝לְכִּ֗/י וֵ/אלֹהָֽ/י־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/003.yaml
  text: Even a bird has found a home, and the swallow a nest for herself, where she has placed her young—at your altars[a], O Yahweh of Armies[b], my King and my God.
  footnotes:
  - marker: a
    text: The Hebrew construction is compact, reading literally “your altars”; it may present the altars as the birds’ home and nest or indicate their location at the sanctuary.
    reason: ambiguity
  - marker: b
    text: Or “Yahweh of hosts.”
    reason: lexical_alternative
translation:
  language: ko
  text: 작은 참새도 집을 찾았고, 제비도 새끼를 둘 둥지를 찾았습니다[a]. 곧 주의 제단 곁[b]—만군의 야훼[c], 나의 왕이시며 나의 하나님이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 새끼를 거기 둔 곳’으로도 볼 수 있습니다. 히브리어 동사는 완료된 동작으로 읽힐 수도 있어, 둥지가 이미 새끼를 둔 장소라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘주의 제단 가까이에’ 혹은 ‘주의 제단 옆에’. 히브리어 구조는 제단과의 근접성을 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: '전통 번역: ‘만군의 주님’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צִפּוֹר
  english_pob_choice: Even the sparrow
  chosen_korean: 작은 참새도
  alternatives_korean:
  - 참새도
  - 심지어 참새도
  - 작은 새도
  lexicon: HALOT
  rationale: גַּם의 강조를 한국어 ‘도’와 ‘작은’으로 살려, 작은 새조차 하나님의 처소를 얻는다는 대조를 자연스럽게 전달했습니다.
- source_word: מָצְאָה בַיִת
  english_pob_choice: has found a home
  chosen_korean: 집을 찾았고
  alternatives_korean:
  - 거처를 찾았고
  - 집을 얻었고
  - 집을 발견했는데
  lexicon: HALOT
  rationale: 단순한 ‘건물’을 찾았다는 뜻보다 거처를 확보했다는 뉘앙스를 살려 ‘집을 찾았다’로 옮겼습니다.
- source_word: אֶפְרֹחֶיהָ
  english_pob_choice: her young
  chosen_korean: 새끼를 둘
  alternatives_korean:
  - 새끼들을
  - 병아리를
  - 어린 새를
  lexicon: HALOT
  rationale: 시적 문맥에서 ‘young’은 알에서 깬 어린 새들을 가리키므로, 둥지와 결합되는 한국어 표현으로 ‘새끼를 둘’이 가장 자연스럽습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주님
  - 군대들의 야훼
  lexicon: HALOT
  rationale: 공인된 원칙에 따라 여호와 대신 야훼를 쓰고, צְבָאוֹת은 전통적이지만 덜 투명한 ‘만군’으로 옮겨 시적·신학적 호칭을 보존했습니다.
- source_word: מַלְכִּי וֵאלֹהָי
  english_pob_choice: my King and my God
  chosen_korean: 나의 왕이시며 나의 하나님이십니다
  alternatives_korean:
  - 나의 왕이시고 나의 하나님이십니다
  - 나의 왕이시며 나의 하나님이십니다
  - 내 왕, 내 하나님이십니다
  lexicon: HALOT
  rationale: 하나님께 직접 드리는 고백이므로 존칭 종결을 유지했고, 병렬 호칭을 ‘이시며’로 연결해 원문의 격조를 살렸습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 고유명사이므로, 제목으로 환원하지 않고 음역에 가까운 ‘야훼’로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘at your altars’의 공간 관계
  chosen_reading: 주의 제단 곁
  alternative_readings:
  - 주의 제단에서
  - 주의 제단 위에
  - 주의 제단 가까이에
  rationale: 히브리어의 짧은 구문은 제단 ‘위’의 문자적 위치보다 근접성을 가리킬 수 있으므로, 본문 이미지와 문법 가능성을 함께 살려 ‘곁’으로 처리했습니다.
  doctrine_reference: POB audit trail on אַת מִזְבְּחוֹתֶיךָ
