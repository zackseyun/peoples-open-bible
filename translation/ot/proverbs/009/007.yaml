  meaning_decisions:
  - source_phrase: וּמוֹכִיחַ לְרָשָׁע מוּמוֹ
    prior_rendering: and whoever rebukes a wicked man incurs a blemish
    new_rendering: whoever rebukes a wicked man brings harm on himself
    rationale: Blemish does not readily communicate the warning in contemporary English. Harm conveys an adverse consequence without narrowing the difficult expression to verbal abuse or reputational damage alone; the note preserves its image and uncertainty.
