  lexicon: HALOT
  rationale: פשע는 단순한 실수보다 의도적 거역과 반역의 뉘앙스가 있어, 한국어에서 그 성격을 드러내는 ‘허물꾼들’을 택했습니다. 지나치게 교회적이거나 법률적인 표현보다 원문의 도덕·언약적 긴장을 잘 보존합니다.
- source_word: דְּרָכֶיךָ
  english_pob_choice: your ways
  chosen_korean: 주님의 길
  alternatives_korean:
  - 주님의 길들
  - 주님의 방식
  - 주님의 행하시는 길
  lexicon: HALOT
  rationale: דרך의 복수는 하나님의 행하심과 삶의 길을 가리키므로, 한국어에서는 관용적이면서도 원문의 비유를 살리는 ‘주님의 길’로 옮겼습니다.
- source_word: יָשׁוּבוּ
  english_pob_choice: will return
  chosen_korean: 돌아올 것입니다
  alternatives_korean:
  - 돌이킬 것입니다
  - 되돌아올 것입니다
  - 주님께 돌아올 것입니다
  lexicon: HALOT
  rationale: שוב는 ‘돌아오다/되돌아가다’와 ‘돌이키다’의 의미를 모두 가질 수 있으나, 회개와 회복의 문맥에서는 관계적 복귀를 드러내는 ‘돌아올 것입니다’가 가장 균형 잡힙니다.
theological_decisions:
- issue: שוב의 회개-귀환 뉘앙스
  chosen_reading: ‘돌아올 것입니다’로 옮겨 회개와 귀환의 이중 가능성을 열어 둡니다.
  alternative_readings:
  - ‘돌이킬 것입니다’로 좁혀 번역하기
  - ‘주님께 돌아갈 것입니다’로 명시하기
  rationale: 시편 51편의 문맥은 죄인이 하나님께 다시 향하는 회복을 말하지만, שוב 자체가 가진 ‘돌다/돌아오다’의 폭을 유지하는 편이 원문의 신학적 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
