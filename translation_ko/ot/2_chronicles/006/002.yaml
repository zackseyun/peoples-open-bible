  text: But I have built for you a lofty house, a place for you to dwell forever.
translation:
  language: ko
  text: 그러나 저는 주님을 위하여 높은 집을 지었습니다. 곧 주님께서 영원히 거하실 처소입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
