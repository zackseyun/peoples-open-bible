translation:
  text: 'There my eyes saw all the hidden things of heaven that are there: a mountain of iron, a mountain of copper,
    a mountain of silver, a mountain of gold, a mountain of easily melted metal, and a mountain of lead.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Easily melted metal renders ነጠብጣብ by its primary lexical description, metallum quod facile liquescit,
      not by an undisclosed identification with a modern alloy. Copper is the ordinary metal sense of ጸሪቅ, also
      used for bronze; the final ዐረር is lead. This is a list of six mountains, not a numeral printed in the source.
    reason: lexical_alternative
