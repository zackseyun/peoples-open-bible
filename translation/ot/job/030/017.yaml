id: JOB.30.17
reference: Job 30:17
source:
  edition: WLC
  text: לַ֗יְלָה עֲ֭צָמַ/י נִקַּ֣ר מֵ/עָלָ֑/י וְ֝/עֹרְקַ֗/י לֹ֣א יִשְׁכָּבֽוּ/ן׃
translation:
  text: At night my bones are pierced within me[a], and my gnawing pains do not rest[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “Night pierces my bones”; the Hebrew wording is difficult.
    reason: alternative_reading
  - marker: b
    text: The rare Hebrew word may instead refer to sinews or veins.
    reason: alternative_reading
lexical_decisions:
- source_word: לַיְלָה
  chosen: At night
  alternatives:
  - By night
  - In the night
  lexicon: HALOT
  rationale: Temporal accusative/adverbial use of 'night'; 'At night' is natural modern English and preserves the temporal force.
- source_word: עֲצָמַי
  chosen: my bones
  alternatives:
  - my frame
  lexicon: HALOT
  rationale: Literal 'my bones' best preserves the concrete bodily imagery of suffering in Job.
- source_word: נִקַּר
  chosen: are pierced
  alternatives:
  - is pierced
  - are bored through
  - gnaws
  lexicon: HALOT
  rationale: From נקר, 'to bore/pierce.' With the plural subject 'my bones,' English idiom uses plural agreement. This keeps the violent physical image. Some take the verb more generally as 'gnaws at,' but the core sense of piercing/bored through is preferable in the main text.
- source_word: מֵעָלָי
  chosen: within me
  alternatives:
  - from upon me
  - away from me
  - on me
  lexicon: HALOT
  rationale: The prepositional phrase is difficult literally ('from upon me'). In context of bodily pain, an idiomatic rendering is needed. 'Within me' communicates internal bodily affliction more clearly than a wooden literalism, while staying close to the sense.
- source_word: וְעֹרְקַי
  chosen: my gnawing pains
  alternatives:
  - my sinews
  - my veins
  - my arteries
  lexicon: HALOT
  rationale: The contextual interpretation is defensible but uncertain, so literal bodily possibilities are retained in the note.
- source_word: לֹא יִשְׁכָּבוּן
  chosen: do not rest
  alternatives:
  - do not rest
  - do not cease
  lexicon: HALOT
  rationale: This is natural English for the Hebrew rest metaphor when applied to pains.
- source_word: עֲצָמַי נִקַּר מֵעָלָי
  chosen: my bones are pierced within me
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This preserves the clause’s explicit bodily imagery without supplying an unmarked agent or subject; the note records the difficult syntax and alternatives.
