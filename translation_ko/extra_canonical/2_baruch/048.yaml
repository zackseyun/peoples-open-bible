  lexicon: N/A
  rationale: 이 단락의 ܢܡܘܣܐ는 단순한 법규가 아니라 공동체가 받은 신적 토라를 가리키므로, POB의 원뜻을 따라 ‘율법’으로 유지했습니다.
- source_word: ܒܪܝܟ / ܣܒ̈ܘܗܝ
  english_pob_choice: the seventh day had passed / after seven days
