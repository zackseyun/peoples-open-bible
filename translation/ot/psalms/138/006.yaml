theological_decisions:
- issue: Relational nuance of God's knowledge of the proud
  chosen_reading: Rendered 'he knows from afar' without expanding to condemnation or rejection.
  alternative_readings:
  - he keeps the proud at a distance
  - he recognizes the proud from afar
  rationale: The Hebrew states that the LORD 'knows' the haughty 'from afar.' The verse implies distance in God's relation to the proud, but it does not explicitly say 'rejects' or 'opposes' here. The translation preserves the theological tension and avoids importing a stronger doctrinal claim than the text itself makes.
  doctrine_reference: Preserve theological tension rather than resolve it.
revisions:
- timestamp: '2026-04-21T00:25:46Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/138/006.json
  category: awkward_english
  tier: 1
  from: lowly, but
  to: lowly; but
  rationale: 'The verse presents three clauses with nuanced relationships: the first is a general statement, the second is a concessive elaboration (''yet''), and the third is an adversative contrast (''but''). Using only commas to link these clauses (''A, yet B, but C'') can feel slightly breathless in English. Replacing the comma before ''but'' with a semicolon creates a stronger separation between the two main actions of God (seeing the lowly vs. knowing the haughty), improving the poetic and logical clarity of the sentence.'
