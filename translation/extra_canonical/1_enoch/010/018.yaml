translation:
  text: In those days the whole earth will be cultivated in righteousness; the whole of it will be planted with trees and
    filled with blessing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The resuming expression “the whole of it” follows the selected Charles printing checked at printed30. This reading
      continues the whole-earth subject; it does not assert a precise physical planting scheme.
