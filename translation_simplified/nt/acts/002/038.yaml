  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus Christ for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
  footnotes:
  - marker: a
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
