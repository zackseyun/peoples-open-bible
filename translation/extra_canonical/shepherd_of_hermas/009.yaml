theological_decisions:
- issue: Rendering of κύριος (Kyrios)
  chosen_reading: the Lord
  alternative_readings:
  - Master
  rationale: Maintains early Christian confessional register without over-specifying referent (God vs.
    the Lord Jesus). Hermas often uses 'the Lord' in a general theistic sense.
  doctrine_reference: 'Translation philosophy: Titles — Kyrios → Lord'
- issue: δικαιοσύνη semantic range
  chosen_reading: righteousness (main text)
  alternative_readings:
  - justice
  rationale: Hermas emphasizes personal and communal moral rectitude; 'righteousness' best captures this.
    'Justice' is noted as an alternative in footnotes for readers aware of the broader semantic range.
  doctrine_reference: Doctrine.md — Contested terms table
- issue: Capitalization of 'the Name'
  chosen_reading: the Name (capitalized)
  alternative_readings:
  - the name (lowercase)
  rationale: The selected clause leaves the Name without an expressed possessive or added referent. Capitalization
    signals its marked use while note8 discloses witness differences; no new object is inserted.
- issue: πρεσβυτέρους as 'elders'
  chosen_reading: elders
  alternative_readings:
  - older men
  rationale: Given Hermas’s Roman church context where presbyters existed, 'elders' preserves potential
    ecclesial reference and the honor dynamic implied by seating.
- issue: ἁπλότης as 'simplicity'
  chosen_reading: simplicity
  alternative_readings:
  - sincerity
  - singleness of heart
  rationale: Hermas contrasts simplicity with double-mindedness elsewhere; 'simplicity' keeps his ascetical-ethical
    category intact.
