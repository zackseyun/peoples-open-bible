id: JHN.4.21
reference: John 4:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
  footnotes:
  - marker: a
    text: Or 'Trust me.' The Greek verb can carry the sense of believing what someone says or trusting the person.
    reason: lexical_alternative
  - marker: b
    text: '''Woman'' was a respectful form of address in this context, not a rude one.'
    reason: cultural_note
  - marker: c
    text: Or 'the hour is coming.' Although the noun lacks the article here, John often uses 'hour' as a thematic term for a decisive time in God's plan.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그 여자에게 말씀하셨습니다. “여인이여, 내 말을 믿으십시오[a]. 이 산에서도 예루살렘에서도 아버지께 예배하지 않을 때가 옵니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 말을 믿으십시오’는 원어 Πίστευέ μοι의 ‘내가 하는 말을 믿으십시오’라는 뜻을 옮긴 것입니다. ‘나를 신뢰하십시오’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원어의 γύναι는 직역하면 ‘여자’이지만, 이 문맥에서는 모욕적 표현이 아니라 예의를 갖춘 호칭입니다. 본문에서는 이를 ‘여인이여’로 옮겼습니다.
    reason: cultural_note
lexical_decisions:
- source_word: Πίστευέ μοι
  english_pob_choice: Believe me
  chosen_korean: 내 말을 믿으십시오
  alternatives_korean:
  - 나를 믿으십시오
  - 믿으라
  lexicon: BDAG; Liddell-Scott
  rationale: 그리스어 직설법 명령형에 대격/여격 대명사가 결합된 표현은 예수의 진술을 받아들이라는 직접적 호소입니다. 한국어에서 '내 말을 믿으십시오'는 '믿으라'보다 공손하고 문맥의 호소성을 살립니다. '나를 믿으십시오'는 대명사의 대상 강조를 다르게 만듭니다.
- source_word: γύναι
  english_pob_choice: woman
  chosen_korean: 여자
  alternatives_korean:
  - 부인
  - 여인
  lexicon: BDAG
  rationale: 원어의 직역 'woman'을 보존했습니다. 존칭적 어감이 문맥상 있음을 각주로 밝히고(footnote b) 본문에서는 불필요한 완곡어를 덧붙이지 않았습니다.
- source_word: ἔρχεται ὥρα
  english_pob_choice: an hour is coming
  chosen_korean: 때가 오나니
  alternatives_korean:
  - 한 때가 오리니
  - 시간이 오리라
  lexicon: BDAG; Johannine motif
  rationale: 요한복음의 ὥρα(시간/때) 어휘를 살리되 한국어 문맥상 자연스러운 '때'로 번역했습니다. 영어 POB처럼 'an hour' 직역을 그대로 '한 때'로도 쓸 수 있으나, '때'가 반복적 어휘성과 의미를 잘 전달합니다.
- source_word: ἐν τῷ ὄρει τούτῳ ... ἐν Ἱεροσολύμοις ... προσκυνήσετε τῷ πατρί
  english_pob_choice: on this mountain ... in Jerusalem ... worship the Father
  chosen_korean: 이 산에서도 ... 예루살렘에서도 ... 아버지께 예배하지 아니할 때가 오리다
  alternatives_korean:
  - 이 산에서는 ... 예루살렘에서는 ... 아버지께 경배하지 않을 것이다
  lexicon: BDAG
  rationale: 지리적 전치사와 장소 반복을 한국어 대칭 구조로 처리했습니다. 'προσκυνέω'는 맥락상 단순한 절(몸을 굽혀 경배) 이상의 종교적 예배 행위를 가리키므로 '예배하다'를 선택했고, '아버지'는 존칭으로 '아버지께'로 표기했습니다.
theological_decisions:
- issue: Tone of address γύναι
  chosen_reading: 직역 '여자'로 유지하되, 존칭성은 주석으로 처리
  alternative_readings:
  - 부인
  - 여인
  rationale: 원문은 무례한 호칭이 아니라 존중의 호칭으로 보입니다. 본문을 과도하게 완곡화하면 원문 표현을 흐릴 우려가 있어 직역을 본문에 두고 각주로 독자에게 설명합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: Rendering of Johannine ὥρα motif
  chosen_reading: '''때''로 번역하여 요한의 주제어를 보존'
  alternative_readings:
  - 한 때
  - 시간
  rationale: ὥρα는 요한에서 반복되는 신학적 의미를 담고 있습니다. 한국어에서 '때'가 자연스럽고 함축을 유지하므로 이를 사용했습니다.
  doctrine_reference: Translation philosophy §3, §5
