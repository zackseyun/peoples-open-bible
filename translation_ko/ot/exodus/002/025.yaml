  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신
  lexicon: אֱלֹהִים
  rationale: 출발어의 주어는 언약적 하나님을 가리키므로 한국어 성경의 표준적인 '하나님'을 사용했습니다.
- source_word: בְּנֵ֣י יִשְׂרָאֵ֑ל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손들
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: בְּנֵי יִשְׂרָאֵל
  rationale: 직역의 '아들들'은 한국어에서 성별 포괄성이 약해지므로, 관용적이면서도 혈연-언약 집단을 드러내는 '이스라엘 자손들'로 옮겼습니다.
- source_word: וַיֵּדַע
  english_pob_choice: knew
  chosen_korean: 아셨습니다
  alternatives_korean:
  - 알고 계셨습니다
  - 알아보셨습니다
  - 주목하셨습니다
  lexicon: ידע
  rationale: POB의 최종 결정인 'knew'를 따라, 단순 정보 습득보다 관계적·언약적 인지를 드러내는 '아셨습니다'를 사용했습니다.
theological_decisions:
- issue: 하나님의 '앎'의 의미
  chosen_reading: 하나님이 이스라엘의 처지를 단순히 인지하신 것이 아니라, 언약적으로 아시고 돌보실 상황을 아신다는 뜻으로 번역했습니다.
  alternative_readings:
  - 하나님이 단순히 사실을 아셨다
  - 하나님이 주목하셨다
  rationale: ידע는 문맥상 피상적 정보 파악보다 깊은 인식과 돌봄의 함의를 가질 수 있으나, 본문이 말하는 것을 넘어서 '주목하셨다'로 해석적으로 좁히지는 않았습니다.
  doctrine_reference: 출애굽기 2장 전체의 압제-부르짖음-하나님의 응답 흐름
