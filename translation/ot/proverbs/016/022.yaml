id: PRO.16.22
reference: Proverbs 16:22
source:
  edition: WLC
  text: מְק֣וֹר חַ֭יִּים שֵׂ֣כֶל בְּעָלָ֑י/ו וּ/מוּסַ֖ר אֱוִלִ֣ים אִוֶּֽלֶת׃
translation:
  text: Understanding is a fountain of life to the one who has it, but fools are disciplined by their own folly[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “the instruction of fools is folly.”
    reason: alternative_reading
lexical_decisions:
- source_word: מְקוֹר
  chosen: fountain
  alternatives:
  - spring
  - source
  lexicon: HALOT
  rationale: The noun denotes a spring, fountain, or source. 'Fountain' preserves the concrete metaphor in idiomatic English and fits the wisdom imagery of life-giving refreshment.
- source_word: חַיִּים
  chosen: life
  alternatives:
  - lives
  - living
  lexicon: HALOT
  rationale: Though morphologically plural, the Hebrew commonly functions as the abstract noun 'life.' Singular English best conveys the sense in this metaphorical construction.
- source_word: שֵׂכֶל
  chosen: understanding
  alternatives:
  - prudence
  - insight
  - good sense
  lexicon: HALOT
  rationale: In Proverbs this term often refers to practical intelligence or sound understanding. 'Understanding' is clear modern English and suits the parallel with the fools' folly.
- source_word: בְּעָלָיו
  chosen: the one who has it
  alternatives:
  - its owner
  - the one who has it
  - those who possess it
  lexicon: HALOT
  rationale: Natural English for the possessor of understanding.
- source_word: מוּסַר
  chosen: instruction
  alternatives:
  - instruction
  - correction
  - chastening
  lexicon: HALOT
  rationale: A standard sense in this compact contrast, with other senses footnoted.
- source_word: אֱוִלִים
  chosen: fools
  alternatives:
  - the foolish
  lexicon: HALOT
  rationale: Standard rendering in Proverbs for the morally dull and obstinate. 'Fools' is concise and preserves the proverbial category.
- source_word: אִוֶּלֶת
  chosen: folly
  alternatives:
  - foolishness
  lexicon: HALOT
  rationale: This abstract noun names the characteristic quality of fools. 'Folly' is idiomatic in English wisdom literature and creates a sharp epigrammatic ending.
