  source_fidelity: 현 초안은 시편 59:3이 아니라 앞 절의 내용(‘악을 행하는 자들… 피 흘리는 사람들…’)을 옮긴 것으로, 히브리어 본문의 ‘목숨을 노려 매복함’, ‘강한 자들의 집결’, 무죄의 호소, 그리고 여호와께 부르는 호격을 모두 반영하지 못합니다. 개정문은 כִּי הִנֵּה, אָרְבוּ לְנַפְשִׁי, יָגוּרוּ עָלַי עַזִּים, לֹא פִשְׁעִי וְלֹא חַטָּאתִי, יְהוָה를 순서와 뜻에 맞게 반영합니다.
  naturalness: ‘보십시오’는 הנה의 주의를 환기하는 기능을 자연스럽게 살리며, ‘제 목숨을 노리고 숨어 기다립니다’는 ‘내 목숨을 위하여 매복하다’를 현대 표준어로 명료하게 옮깁니다. ‘제가 범죄하거나 죄를 지은 일이 없는데도’는 원문의 무죄 주장과 대적들의 행동 사이의 부당함을 자연스러운 한국어로 연결합니다.
  terminology: נפשׁ는 여기서 ‘목숨’으로, עזים은 위협적인 ‘강한 자들’로 옮겼습니다. פשע와 חטאת의 병렬은 ‘범죄’와 ‘죄’로 유지했습니다. 하나님의 이름 יהוה는 한국어 성경의 통상적 호격인 ‘여호와여’로 표기했습니다.
