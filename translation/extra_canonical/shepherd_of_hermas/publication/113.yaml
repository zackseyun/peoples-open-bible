translation:
  text: '“I sent these virgins to you to live with you, for I saw that they were friendly toward you.
    You have them as helpers so that you may be better able to keep his commandments; for these commandments
    cannot be kept without these virgins. I see that they are glad to be with you. But I will instruct
    them never to leave your house.”


    2. “You only need to cleanse your house thoroughly, for they will gladly live in a clean house. They
    are clean, chaste and diligent, and all have favor with the Lord. So if they find your house pure,
    they will remain with you. But if even a little defilement occurs, they will immediately leave your
    house. These virgins have no love at all for defilement.”


    3. I say to him, “Sir, I hope to please them so that they will always be glad to live in my house.
    And just as this one, to whom you entrusted me, has no complaint about me, neither will they.”


    4. He said to that shepherd, “I know[a] that God’s servant wants to live, will keep these commandments,
    and will give these virgins a clean dwelling.[b]”


    5. After saying this, he again entrusted me to that shepherd. He called those virgins and said to
    them, “Since I see that you are glad to live in this man’s house, I entrust him and his house to you,
    so that you will never leave his house.” The virgins gladly heard these words.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: “I know” follows the published corrected Greek reading in P.Oxy.III404, recto15, with Palatina
      Scio and reported Ethiopic support. The continuous Vulgata base reads Video, “I see.” The correction
      is an editorial report; the plate does not independently settle its earlier letter here. This is
      a bounded selection, not a continuous Greek ending.
  - marker: b
    reason: textual_variant
    text: The continuous Latin says “a clean dwelling.” The Greek fragment preserves purity wording at
      recto18, with missing letters; its fuller clause is reconstructed by editors. An alternative is
      “will establish these virgins in purity.” This draft retains the Latin housing image pending fuller
      adjudication.
lexical_decisions:
- source_word: virgines
  chosen: virgins
  alternatives:
  - young women
  - virtues
  rationale: Keep the allegorical figures concrete; do not replace them with their interpretation or erase
    the stated virginity.
- source_word: conmunda / munda / puram / inquinationis
  chosen: cleanse thoroughly / clean / pure / defilement
  alternatives:
  - tidy / dirt
  rationale: Preserve the bodily/household image and its moral force. The printed compound spelling is
    retained in source. This is not reduced to housekeeping alone.
- source_word: Video (Vulgata); published corrected οἶδα in P.Oxy.III404; Scio (Palatina)
  chosen: I know
  alternatives:
  - I see
  rationale: Bounded Greek fragment edition supports know together with Palatina and reported Ethiopic;
    full witness/English alternatives in oxy404-ending-20261103.v1.json. Source Latin Video is preserved,
    not silently rewritten.
- source_word: habitatione munda conlocaturum
  chosen: will give these virgins a clean dwelling
  alternatives:
  - will establish these virgins in purity
  rationale: Retain continuous Latin housing image here. Greek purity stem is partly preserved but the
    complete clause is reconstructed; do not replace the whole clause on the strength of restored letters.
    Footnote records the alternative.
- source_word: domine (vocative address to the visionary interlocutor)
  chosen: Sir
  alternatives:
  - Lord
  - Master
  rationale: Respectful address in this dialogue does not itself identify the interlocutor as God. Render
    this vocative Sir; Dominum referring to the Lord remains Lord. This is an explicit contextual distinction,
    not an unrecorded terminology switch.
