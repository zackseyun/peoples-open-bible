  naturalness: 문맥상 직접 인용된 권위 있는 금지 명령에 ‘마라’형을 쓴 것은 자연스럽고, 이를 둘러싼 서술은 합쇼체로 유지됩니다. ‘여호와의 말씀으로’는 성서 한국어에서 통용되는 표현이며 원문의 בִּדְבַר יְהוָה를 무리 없이 반영합니다.
