  from: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
  to: But the king of Egypt said to them, “Moses and Aaron, why are you keeping the people from their work? Go back to your forced labor[a]!”
