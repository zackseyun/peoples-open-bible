  text: ὅπου γε καὶ τὰ ἄλογα ζῷα ὁμοίαν τὴν πρὸς τὰ ἐξ αὐτῶν γεννώμενα συνπίθειαν καὶ στοργὴν ἔχει τοῖς ἀνθρώποις.
