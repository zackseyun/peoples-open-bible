  from: Then I will go to the altar of God[a], to God, the joy of my rejoicing; and I will praise you with the lyre, O God[b], my God.
  to: Then I will go to the altar of God, to God, my greatest joy[a]; and I will praise you with the lyre[b], O God, my God.
  rationale: “The joy of my rejoicing” is a transparent but ungainly calque of an intensive Hebrew joy expression. “My greatest joy” naturally conveys its intensifying force without introducing a distinct theological claim. Placing the notes at the expressions they explain is an improvement.
