  category: meaning_retranslation
  from: A scatterer has come up against your face[a]. Guard the fortress; watch the road; strengthen your loins[c][b]; muster your strength greatly.
  to: A destroyer has advanced against you, Nineveh! Guard the fortress; watch the road; brace yourself; muster all your strength!
  rationale: The lexical record recognizes both scattering and shattering in the attacker’s designation, which the broader word “destroyer” accommodates. I preserve the urgent defensive commands and leave their taunting force implicit rather than adding that resistance is futile.
