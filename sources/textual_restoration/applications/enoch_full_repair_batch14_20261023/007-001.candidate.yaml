    text: 'The opening pronoun is parenthesized and the conjunction before took is bracketed in Charles. All four
      printed asterisks are retained: before others and all on Charles PDF52/printed14, and before joined and incantations
      on PDF54/printed16. The selected joined wording is rendered as printed, not replaced by the proposed mad/raving
      emendation discussed in Charles printed16 note2. This is a selected-edition rendering, not certification of
      a reconstructed manuscript reading.'
  - marker: b
    reason: lexical_alternative
    text: Charms and incantations distinguish the two selected nouns; other possible renderings are sorceries and
      spells. Cutting roots and learning about plants are kept distinct. Personally viewed Dillmann1865 columns245–246
      (sorcery),363–364 (incantation),183–186 (cut/cutting),241–242 (roots),727–728 (make known),143–144 (teach)
      and1087–1088 (join, including sexual union).
