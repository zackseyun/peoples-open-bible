translation:
  text: In every province and every city, wherever the king’s command and decree reached, there was joy and gladness for the Jews, with feasting and a day of celebration. Many from the other peoples of the land were becoming Jews[a], because fear of the Jews had seized them.
  philosophy: dynamic
  footnotes:
