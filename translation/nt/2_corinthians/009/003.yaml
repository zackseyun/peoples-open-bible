  meaning_decisions:
  - source_phrase: ἔπεμψα δὲ τοὺς ἀδελφούς
    prior_rendering: But I sent the brothers
    new_rendering: But I am sending the brothers
    rationale: In this letter-sending context, the aorist naturally describes the dispatch from the recipients' perspective; English presents it as the action Paul is taking.
  - source_phrase: ἵνα μὴ τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν κενωθῇ ἐν τῷ μέρει τούτῳ
    prior_rendering: so that our boasting about you might not be emptied in this matter
