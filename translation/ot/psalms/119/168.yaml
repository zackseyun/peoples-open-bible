  text: שָׁמַ֣רְתִּי פִ֭קּוּדֶי/ךָ וְ/עֵדֹתֶ֑י/ךָ כִּ֖י כָל דְּרָכַ֣/י נֶגְדֶּֽ/ךָ־׃
translation:
  text: I keep your precepts and testimonies, for all my ways lie open before you.
  philosophy: dynamic
lexical_decisions:
- source_word: פִקּוּדֶיךָ
  chosen: precepts
  alternatives:
  - orders
  - charges
  lexicon: HALOT
  rationale: פִּקּוּדִים are the specific charges God appoints. 'Precepts' keeps this term distinct from statutes and commandments.
- source_word: וְעֵדֹתֶיךָ
  chosen: testimonies
  alternatives:
  - decrees
  - covenant stipulations
  lexicon: HALOT
  rationale: עֵדֹות (plural of עֵדָה, covenant testimony) is rendered 'testimonies' consistently with עֵדוּת across the psalm.
