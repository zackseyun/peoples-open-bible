  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/006.yaml
  text: Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and by this I preserved it as evidence against you, in hope that perhaps, seeing it, you might repent.”
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:55:21Z'
    unchanged: false
    changes_summary: Revised 'for this reason I kept it as evidence against you, to expose you' to more closely reflect ἐν τούτῳ ἐφύλαξα αὐτὸ εἰς ἔλεγχόν σου as 'by this I preserved him for your conviction.' Also simplified the final clause to match ἰδοῦσα μετανοήσεις more directly as 'seeing it, you might repent.'
translation:
  language: en
  text: 'Understand this now: the God of my father showed me your wickedness through his angel. By this, I kept it as evidence against you, hoping that perhaps, when you saw it, you might repent[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims.
    reason: lexical_alternative
