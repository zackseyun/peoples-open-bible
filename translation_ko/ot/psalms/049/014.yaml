base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/014.yaml
  text: Like sheep they are set for Sheol[a]; death will shepherd them, and the upright will rule over them in the morning. Their form will waste away in Sheol, far from their lofty dwelling.[b]
  footnotes:
  - marker: a
    text: Sheol is the realm of the dead.
    reason: cultural_note
  - marker: b
    text: The Hebrew of the final line is difficult. “Their form” may alternatively be read “their rock” or “their strength”; the closing words may also be understood as “Sheol will consume them, leaving them without a dwelling.”
    reason: alternative_reading
translation:
  language: ko
  text: 양 떼처럼 그들은 스올[a]에 놓였고, 죽음이 그들의 목자가 될 것입니다. 올바른 이들이 아침에 그들을 다스릴 것이며, 그들의 형상은 스올에서 쇠하여 그들의 높은 거처에서 멀어질 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스올은 죽은 이들의 영역을 가리키는 히브리어 표현입니다. 단순히 육신을 묻는 ‘무덤’보다 넓은 뜻을 지닙니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 마지막 구절은 문법과 어휘가 난해합니다. ‘그들의 형상을 스올이 소멸시킬 것이며, 스올이 그들의 거처가 될 것이다’ 또는 이와 비슷하게 옮길 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זֶה
  english_pob_choice: This is
  chosen_korean: 이것이 …입니다
  alternatives_korean:
  - 이것은 …입니다
  - 이것이 …이다
  lexicon: HALOT
  rationale: 지시대명사로 앞선 사람들의 삶을 판정하는 문맥이므로, 한국어에서도 판단문 형태로 자연스럽게 옮겼습니다.
- source_word: דַרְכָּם
  english_pob_choice: their way
  chosen_korean: 그들의 길
  alternatives_korean:
  - 그들의 방식
  - 그들의 삶의 길
  lexicon: HALOT
  rationale: דֶּרֶךְ의 기본 의미인 ‘길’은 비유적 윤리적 삶의 방식을 함께 살리므로 그대로 유지했습니다.
- source_word: כֵּסֶל לָמוֹ
  english_pob_choice: their folly
  chosen_korean: 그들의 어리석음
  alternatives_korean:
  - 그들의 우둔함
  - 그들에게는 어리석음
  lexicon: HALOT
  rationale: כֵּסֶל은 여기서 지혜문학적 평가어로 ‘어리석음’이 가장 직접적이며, לָמוֹ의 함축도 문맥상 소유 관계로 자연스럽게 드러납니다.
- source_word: בְּפִיהֶם יִרְצוּ
  english_pob_choice: people approve their words
  chosen_korean: 그들의 말을 좋게 여깁니다
  alternatives_korean:
  - 그들의 말을 받아들입니다
  - 그들의 말을 좋아합니다
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 입을’이지만 한국어에서는 관용적으로 ‘말’로 옮겨, 입술이 아니라 발화 내용을 가리키는 점을 분명히 했습니다.
theological_decisions:
- issue: וְאַחֲרֵיהֶם의 대상
  chosen_reading: ‘그들 뒤를 따르는 이들’로 넓게 이해해, 후대의 추종자들이 그들의 말을 승인한다는 뜻으로 옮겼습니다.
  alternative_readings:
  - ‘그들의 자손’
  - ‘그들 뒤의 사람들’
  rationale: 히브리어는 혈통적 자손인지 일반적 후계자/추종자인지 열어 두므로, 시편의 풍자적 경고를 살리는 넓은 독법을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
