id: PSA.119.43
reference: Psalms 119:43
source:
  edition: WLC
  text: וְֽ/אַל תַּצֵּ֬ל מִ/פִּ֣/י דְבַר אֱמֶ֣ת עַד מְאֹ֑ד כִּ֖י לְ/מִשְׁפָּטֶ֣/ךָ יִחָֽלְתִּי־־־׃
translation:
  text: Do not take the word of truth entirely from my mouth, for I hope in your ordinances.
  philosophy: dynamic
lexical_decisions:
- source_word: דְבַר
  chosen: word
  alternatives:
  - matter
  - thing
  lexicon: HALOT
  rationale: דָּבָר is God's spoken word. Rendered 'word' consistently; paired with אִמְרָה ('promise') the two utterance-terms stay distinct.
- source_word: לְמִשְׁפָּטֶךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone of 'judgments'; 'judgments/rules' preserved as alternatives.
