id: ACT.15.18
reference: Acts 15:18
source:
  edition: SBLGNT
  text: γνωστὰ ἀπ’ ⸀αἰῶνος.
translation:
  text: known[a] from ancient times[b].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, verses 17–18 may read, 'who does these things that have been known from ancient times.'
    reason: alternative_reading
  - marker: b
    text: Some manuscripts expand the wording to 'All his works are known to God from ancient times.'
    reason: textual_variant
lexical_decisions:
- source_word: γνωστὰ
  chosen: known
  alternatives:
  - made known
  - well known
  lexicon: BDAG
  rationale: Adjective functioning predicatively in this verbless clause. 'Known' is the most direct and natural rendering. 'Made known' would import a verbal nuance not explicit in the adjective, while 'well known' overstates the degree.
- source_word: ἀπ’
  chosen: from
  alternatives:
  - since
  lexicon: BDAG
  rationale: Standard sense of ἀπό marking temporal origin here. 'From' preserves the concise temporal force of the Greek.
- source_word: αἰῶνος
  chosen: of old
  alternatives:
  - eternity
  - the age
  - ancient times
  lexicon: BDAG
  rationale: In this temporal idiom, αἰών can denote a long past duration or ancient time. 'Of old' gives idiomatic English and fits the compressed citation form. 'Eternity' is possible in some textual traditions and translations, but with the SBLGNT wording this shorter phrase is better represented as 'from of old,' with the stronger alternative preserved in a footnote.
