  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Sense of the speakers' complaint about religious observance
  chosen_reading: The verse is rendered as a cynical complaint that serving God and keeping his requirements has yielded no benefit.
  alternative_readings:
  - A narrower complaint focused only on ritual mourning practices
  rationale: The syntax joins serving God, keeping his charge, and walking in mourning as related examples of pious conduct the speakers deem unprofitable. The translation preserves that complaint without importing a stronger theological claim than the text states.
