  - 고라 자손이 쓴
  lexicon: HALOT
  rationale: 히브리어 ל가 표제문에서 저자성, 소속, 헌정의 가능성을 모두 열어 두므로, 단정하지 않고 ‘~의’로 처리해 그 여지를 보존했습니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 한 시편
  - 노래
  - 시편
  lexicon: HALOT
  rationale: מִזְמוֹר는 장르 표지이므로 ‘시’로 간결하게 옮겨 문학 형식을 드러냈습니다. 표제문 맥락상 정관사 없이도 자연스럽습니다.
