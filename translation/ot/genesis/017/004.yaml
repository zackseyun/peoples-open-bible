theological_decisions:
- issue: Covenant formulation and Abraham's role
  chosen_reading: 'Render the statement as a divine covenant declaration without importing later theological categories: ''my covenant is with you, and you will become the father of a multitude of nations.'''
  alternative_readings:
  - Expand to 'I am making my covenant with you'
  - Render more interpretively as 'you will be ancestor of many nations'
  rationale: The verse states the covenant relationship and promised outcome plainly. The translation preserves the covenantal and promissory force without paraphrasing into a fuller theological explanation not explicit in the Hebrew.
