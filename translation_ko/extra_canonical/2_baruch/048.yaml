  - 전능자
  lexicon: N/A (proper divine epithet)
  rationale: 서두의 호칭은 문맥상 하나님께 대한 직접 호칭이므로, 능력의 강조를 살리면서도 현대 한국어 예배문체에 지나치게 고착되지 않는 ‘전능하신 분’으로 옮겼습니다.
