translation:
  language: en
  text: I realized, my children, that this had happened to me because of Joseph. So I repented[a] and wept. I prayed to the Lord God to restore my hand and help me stay away from every kind of moral corruption, from envy, and from all foolishness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims.
    reason: lexical_alternative
