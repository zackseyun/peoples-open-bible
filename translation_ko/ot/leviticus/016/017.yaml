  - severity: low
    issue: 출입 금지와 시간 범위의 연결이 분리됨
    rationale: 초안도 뜻은 전달하지만, 원문은 그가 들어가는 때부터 나오는 때까지 아무도 회막에 없어야 한다는 하나의 규정을 제시합니다. 이를 한 문장으로 연결하면 더 정확하고 자연스럽습니다.
  - severity: low
