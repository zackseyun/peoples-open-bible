  text: לְ/עוֹלָ֥ם יְהוָ֑ה דְּ֝בָרְ/ךָ֗ נִצָּ֥ב בַּ/שָּׁמָֽיִם׃
translation:
  text: Forever, Yahweh, your word stands firm in the heavens.
