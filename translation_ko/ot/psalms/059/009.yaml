translation:
  language: ko
  text: 그의 힘을 두고[a], 제가 주님을 향해 지켜보겠습니다[b]. 하나님은 나의 요새이시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로 흔히, “오, 나의 힘이시여, 제가 주님을 향해 지켜보겠습니다.” 히브리어 본문의 형태는 직역하면 “그의 힘”입니다.
    reason: alternative_reading
  - marker: b
    text: “지켜보다”는 문맥에 따라 “기다리다” 또는 “주님을 기다리다”로 이해될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: But you
  chosen_korean: 그러나 주님,
  alternatives_korean:
  - 그리고 주님,
  - 그러나 주님께서는
  lexicon: HALOT
  rationale: 문맥상 앞선 탄원과 대비되는 전환이므로, 단순한 접속인 ‘그리고’보다 반전의 힘을 드러내는 ‘그러나’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시편의 호칭으로는 한국어 교회 독자에게 자연스러운 ‘주님’을 본문에 두되, 원어 신명 자체를 훼손하지 않도록 별도 주석 없이도 동일 인격 지시를 유지했습니다.
- source_word: תִּשְׂחַק
  english_pob_choice: laugh
  chosen_korean: 웃으십니다
  alternatives_korean:
  - 비웃으십니다
  - 웃으십니다
  lexicon: HALOT
  rationale: 히브리어는 기본적으로 ‘웃다’이므로, 해석을 과도하게 밀어붙이는 ‘비웃다’보다 원뜻을 살린 ‘웃으십니다’를 택했습니다.
- source_word: תִּלְעַג
  english_pob_choice: mock
  chosen_korean: 조롱하십니다
  alternatives_korean:
  - 조소하십니다
  - 비웃으십니다
  lexicon: HALOT
  rationale: 두 번째 동사는 명시적으로 조롱/모욕의 뉘앙스를 가지므로, 앞 동사와 구별되게 ‘조롱하십니다’로 옮겼습니다.
- source_word: לְ/כָל גּוֹיִם
  english_pob_choice: all the nations
  chosen_korean: 모든 민족을
  alternatives_korean:
  - 모든 나라를
  - 모든 민족들을
  lexicon: HALOT
  rationale: 가욤은 여기서 특정 외국인 집단이 아니라 포괄적 집단을 가리키므로, 한국어에서는 자연스럽고 포괄적인 ‘모든 민족’을 택했습니다.
theological_decisions:
- issue: YHWH의 한국어 처리
  chosen_reading: 시편의 대화체에서 ‘주님’으로 번역해 직접 호칭을 살리되, 문맥상 야훼의 인격적 주도권이 드러나게 했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 신명 찬가가 아니라 시적 직접화법이므로, 한국어 예배 독자에게 즉시 이해되는 호칭을 사용하되 원문이 말하는 인격적 호명 기능을 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
