base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/002.yaml
  text: And he said to me, “What do you see?” And I said, “I see, and behold, a lampstand all of gold, with its bowl on top of it, and seven lamps on it, with seven and seven spouts for the lamps that are on top of it.”
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. “무엇이 보이십니까?” 제가 대답했습니다. “제가 보니, 온통 금으로 된 등잔대가 있습니다. 그 등잔대 꼭대기에는 그릇이 있고, 그 위에는 일곱 등불이 있으며, 그 꼭대기에 있는 등불들을 위해 일곱과 일곱 개의 주둥이가 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְנוֹרַת
  english_pob_choice: lampstand
  chosen_korean: 등잔대
  alternatives_korean:
  - 촛대
  - 등대
  lexicon: menorah
  rationale: 히브리어 מְנוֹרָה는 성막/성전 기물로서의 ‘lampstand’를 가리키므로, 현대 한국어 성경에서 이해되기 쉬운 ‘등잔대’를 택했습니다.
- source_word: גֻלָּה
  english_pob_choice: bowl
  chosen_korean: 그릇
  alternatives_korean:
  - 바가지
  - 받침그릇
  lexicon: gullah
  rationale: 문맥상 등잔대 위에 놓인 용기를 가리키므로, 형태를 특정하지 않고도 자연스러운 ‘그릇’으로 옮겼습니다.
- source_word: מוּצָקֹת
  english_pob_choice: spouts
  chosen_korean: 주둥이
  alternatives_korean:
  - 관
  - 파이프
  - 주입구
  lexicon: mutsaqot
  rationale: 영어 POB가 ‘spouts’로 정리한 바를 따라, 기름을 흘려보내는 돌출구의 기능을 살리는 일상적 어휘인 ‘주둥이’를 선택했습니다.
- source_word: שִׁבְעָה וְשִׁבְעָה
  english_pob_choice: seven and seven
  chosen_korean: 일곱과 일곱
  alternatives_korean:
  - 일곱씩 일곱
  - 일곱에 일곱
  lexicon: numeral construction
  rationale: 반복 구조를 그대로 살려 수량의 중첩과 형상을 드러냈습니다.
theological_decisions:
- issue: 사물 묘사의 직역 정도
  chosen_reading: 상징적 해석을 덧붙이지 않고, 환상 속 물체의 구성 요소를 소박하게 묘사했습니다.
  alternative_readings:
  - 등잔대를 교회나 하나님의 백성의 상징으로 미리 풀이함
  - ‘주둥이’를 더 유려한 해석어로 풀어씀
  rationale: 이 절 자체는 질문-응답 형식의 환상 묘사이므로, 본문이 말하는 바를 넘는 신학적 해석을 본문 안에 주입하지 않았습니다.
  doctrine_reference: 문맥 우선의 본문 해석 원칙
- issue: 직접 화법의 호칭 유지
  chosen_reading: ‘보십시오’로 듣는 이의 주의를 끄는 감탄/지시를 살렸습니다.
  alternative_readings:
  - ‘봐라’처럼 반말형으로 처리
  - 단순히 ‘보입니다’만 두고 감탄을 약화
  rationale: 히브리어 הִנֵּה의 주의 환기 기능을 자연스럽게 전달하기 위해, 한국어에서 허용되는 정중한 명령형/지시 표현을 사용했습니다.
  doctrine_reference: 화자-청자 관계 보존
