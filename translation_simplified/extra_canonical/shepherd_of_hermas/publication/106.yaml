base_translation:
  text: '“The believers from the twelfth mountain, the white one, are like this: they are like infants.
    No evil rises into their hearts, and they have not known what wickedness is, but have always remained
    in childlike innocence.”[1]


    2. “People like this dwell without hesitation in God’s kingdom, because they have not defiled God’s
    commandments in any matter. Instead, they have remained in childlike innocence all the days of their
    lives, with the same disposition.”


    3. “So all of you who remain and become like infants, having no evil,” he says, “will be more honored
    than all those mentioned before. For all infants are honored before God and hold first place with
    him. Blessed, then, are you who remove wickedness from yourselves and put on innocence. You will be
    first of all to live to God.”


    4. After he finished the parables of the mountains, I say to him, “Sir, now explain to me the stones
    taken up from the plain and placed in the building in place of the stones removed from the tower.
    Explain also the round stones placed in the building, and those that are still round.”'
