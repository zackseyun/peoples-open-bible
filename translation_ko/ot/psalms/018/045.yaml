  text: 이방의 자손들은 쇠잔해지고, 그들의 요새에서 떨며 나옵니다[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이방/낯섦의 아들들’입니다. ‘이방인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘떨며 나옵니다’에 해당하는 히브리어 동사는 드물고 뜻이 확실하지 않습니다. ‘움츠러들며 나오다’ 또는 ‘절뚝이며 나오다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘요새’는 ‘성채’ 또는 더 넓게 ‘울타리 친 곳’으로도 옮길 수 있습니다.
    reason: lexical_alternative
