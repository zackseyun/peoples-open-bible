translation:
  text: The wealth of the unjust will dry up like a river; it will resound like mighty thunder in a rainstorm[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'The Hebrew is obscure: literally, ''from force [or wealth] to force, like an enduring stream, and from a mighty channel, with a crash of sounds.'' The main text follows the clearer Greek parallel.'
    reason: textual_variant
lexical_decisions:
- source_word: מחיל אל חיל
  chosen: from force to force
  alternatives:
  - from army to army
  - from strength to strength
  - wealth of the unjust
  lexicon: HALOT
  rationale: The Hebrew witness is difficult and somewhat elliptical. חיל can denote strength, force, wealth, or army. Given the immediate water imagery in the Hebrew ('like a perennial wadi' / 'from a mighty channel') and the alliterative parallelism, a sense of surging force best fits the line as preserved. The Greek parallel reflects a substantially different Vorlage about 'wealth of the unjust,' so that alternative is preserved in a footnote rather than imported into the main text.
- source_word: נחל איתן
  chosen: a perennial wadi
  alternatives:
  - an ever-flowing stream
  - a lasting torrent
  - a mighty river
  lexicon: HALOT
  rationale: נחל is often a wadi or torrent-bed rather than a generic river; איתן conveys enduring, perennial, or ever-flowing strength. 'Perennial wadi' preserves the Hebrew landscape image while remaining intelligible in English.
- source_word: אפיק אדיר
  chosen: a mighty channel
  alternatives:
  - a mighty streambed
  - a strong river-course
  - a powerful channel
  lexicon: HALOT
  rationale: אפיק denotes a channel, bed, or ravine; אדיר means mighty. 'Mighty channel' keeps the concrete topographical image and parallels the preceding water metaphor.
- source_word: בחזיז קולות
  chosen: with a crash of sounds
  alternatives:
  - with peals of thunder
  - in a thunderous burst
  - with a flash of voices/sounds
  lexicon: HALOT
  rationale: The phrase is rare and difficult. קולות commonly means sounds, voices, or thunderings. In context with the Greek's thunder imagery, 'a crash of sounds' captures the auditory violence without overcommitting to a reconstruction not explicit in the Hebrew text as transmitted.
