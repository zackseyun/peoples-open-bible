  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַ֥עַן אֲסַפְּרָ֗ה כָּֽל תְּהִלָּ֫תֶ֥י/ךָ בְּ/שַֽׁעֲרֵ֥י בַת צִיּ֑וֹן אָ֝גִ֗ילָה בִּ/ישׁוּעָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/014.yaml
  text: so that I may recount all your praises at the gates of Daughter Zion; I will rejoice in your salvation[a].
  footnotes:
  - marker: a
    text: Or “deliverance.” The Hebrew term can refer to rescue from present danger as well as salvation in a broader sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 딸 시온의 성문들에서 야훼께 드리는 모든 찬양을 선포하고, 야훼의 구원[a]을 기뻐하게 하려 함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’은 여기서 현재의 위험에서 건져 내심, 곧 ‘구출’ 또는 ‘건지심’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנְנֵנִי
  english_pob_choice: Be gracious to me
  chosen_korean: 내게 은혜를 베푸소서
  alternatives_korean:
  - 나에게 은혜를 베푸소서
  - 나를 불쌍히 여기소서
  lexicon: HALOT
  rationale: חנן의 간구형은 은혜를 베풀어 달라는 요청이므로, ‘은혜를 베푸소서’가 가장 직접적이며 예배·기도 문맥에도 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명사 표기를 한국어에서도 고유명사로 살려, 전통적 칭호 ‘주’로 대체하지 않고 ‘야훼’로 옮겼습니다.
- source_word: עָנְיִי
  english_pob_choice: my affliction
  chosen_korean: 내 고난
  alternatives_korean:
  - 내 환난
  - 내 비참함
  - 내 고통
  lexicon: HALOT
  rationale: עֳנִי는 억눌린 처지와 고통을 함께 가리키므로, 현대 한국어에서 자연스럽고 포괄적인 ‘고난’이 적절합니다.
- source_word: מִשֹּׂנְאַי
  english_pob_choice: from those who hate me
  chosen_korean: 나를 미워하는 자들에게서 오는
  alternatives_korean:
  - 나를 미워하는 자들로부터의
  - 나를 미워하는 자들 때문에 생긴
  lexicon: HALOT
  rationale: מִן은 원인·출처의 뉘앙스를 띠므로, 고난이 ‘나를 미워하는 자들’에게서 비롯됨을 한국어에서 분명히 드러냈습니다.
- source_word: מְרוֹמְמִי
  english_pob_choice: you who lift me up
  chosen_korean: 나를 높이시는 분이시여
  alternatives_korean:
  - 나를 들어 올리시는 분이시여
  - 나를 일으키시는 분이시여
  lexicon: HALOT
  rationale: 어근 רום의 ‘높이다/들어 올리다’는 구원 행위를 비유하므로, 시적 어감을 살리면서도 기도문에 맞는 ‘나를 높이시는 분’으로 옮겼습니다.
- source_word: מִשַּׁעֲרֵי מָוֶת
  english_pob_choice: from the gates of death
  chosen_korean: 죽음의 문들에서
  alternatives_korean:
  - 죽음의 성문들에서
  - 죽음의 문턱에서
  lexicon: HALOT
  rationale: ‘죽음의 문들’은 죽음의 위협을 가리키는 히브리어 이미지이므로, 직역에 가까운 표현을 유지했습니다.
theological_decisions:
- issue: 여호와/주 대신 신명사 표기 유지
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮기고, 제목이나 문맥상 일반 호칭으로 약화하지 않았습니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 시편의 간구는 언약적 이름을 직접 부르는 형식이므로, 고유한 신명사성을 보존하는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
