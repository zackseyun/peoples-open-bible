source:
  edition: WLC
  text: תְּאַבֵּד֮ דֹּבְרֵ֪י כָ֫זָ֥ב אִישׁ דָּמִ֥ים וּ/מִרְמָ֗ה יְתָ֘עֵ֥ב יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/006.yaml
  text: You destroy those who speak lies[b]; Yahweh abhors a man of bloodshed and deceit[a].
  footnotes:
  - marker: a
    text: Hebrew “a man of bloods and deceit,” an idiom for one marked by bloodshed and treachery.
    reason: lexical_alternative
  - marker: b
    text: Or “You will destroy those who speak falsehood.” The Hebrew verb may be understood as future or as a general statement of God’s action.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 거짓을 말하는 자들을 멸하십니다.[a] 야훼께서는 피를 흘리고 속이는 사람을 혐오하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸하실 것입니다.’ 히브리어 동사는 미래를 가리킬 수도 있고, 하나님의 일반적인 행위를 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  english_pob_choice: will not stand
  chosen_korean: 서지 못하며
  alternatives_korean:
  - 서지 않을 것입니다
  - 자리를 지키지 못합니다
  - 자기 자리에 서지 못합니다
  lexicon: HALOT
  rationale: 히트파엘 형태는 하나님 앞에 ‘서서 버티다/자기를 내세우다’는 뜻이므로, 자연스러운 한국어로는 ‘서지 못하다’가 가장 간명하게 대응합니다.
- source_word: הוֹלְלִים
  english_pob_choice: the boastful
  chosen_korean: 오만한 자들
  alternatives_korean:
  - 자랑하는 자들
  - 교만한 자들
  - 어리석은 자들
  lexicon: HALOT
  rationale: 이 분사는 단순 지적 무지보다 자기 과시와 오만의 뉘앙스가 강하므로, ‘오만한 자들’이 본문의 도덕적 성격을 가장 잘 드러냅니다.
- source_word: לְנֶגֶד עֵינֶיךָ
  english_pob_choice: before your eyes
  chosen_korean: 주님 앞에
  alternatives_korean:
  - 주님의 눈앞에
  - 주님의 시야 앞에
  - 주님 보시는 앞에
  lexicon: HALOT
  rationale: 히브리어 관용구는 하나님의 시선과 현존 앞에 서는 상황을 가리키므로, 한국어에서는 ‘주님 앞에’로 간결하게 옮겨 의미를 살렸습니다.
- source_word: שָׂנֵאתָ
  english_pob_choice: you hate
  chosen_korean: 미워하십니다
  alternatives_korean:
  - 증오하십니다
  - 싫어하십니다
  - 배척하십니다
  lexicon: HALOT
  rationale: 동사는 본문의 직접적인 강한 감정을 뜻하므로, 이를 완화하지 않고 ‘미워하십니다’로 옮겨 원문의 강도를 유지했습니다.
- source_word: פֹּעֲלֵי אָוֶן
  english_pob_choice: workers of wickedness
  chosen_korean: 모든 악을 행하는 자들
  alternatives_korean:
  - 불의를 행하는 자들
  - 악행을 일삼는 자들
  - 죄악을 일하는 자들
  lexicon: HALOT
  rationale: 직역적인 ‘악을 행하는 자들’이 אָוֶן의 도덕적 악과 행위의 지속성을 함께 드러내며, 한국어 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: 하나님의 미움 언어
  chosen_reading: 본문의 직설적인 표현을 유지하여, 하나님께서 ‘모든 악을 행하는 자들’을 미워하신다고 번역했습니다.
  alternative_readings:
  - 하나님께서 악을 미워하신다고 완화하여 번역
  - 하나님께서 악한 행위를 거부하신다고 순화
  rationale: 히브리어 שָׂנֵאתָ는 실제 미움을 분명히 말하므로, 독자에게 불편할 수 있어도 본문의 신학적 긴장을 약화하지 않고 그대로 반영했습니다.
  doctrine_reference: Translation philosophy §1, §3
