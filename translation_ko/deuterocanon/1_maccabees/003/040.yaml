lexical_decisions:
- source_word: ἀπῆραν
  english_pob_choice: they set out
  chosen_korean: 떠나 왔습니다
  alternatives_korean:
  - 출발했습니다
  - 길을 떠났습니다
  lexicon: ἀπαίρω
  rationale: 군사 이동의 시작을 자연스럽게 나타내면서, 단순한 이동보다 ‘떠나다’의 기동성을 살렸습니다.
- source_word: σὺν πάσῃ τῇ δυνάμει αὐτῶν
  english_pob_choice: with all their forces
  chosen_korean: 모든 군대를 거느리고
  alternatives_korean:
  - 그들의 모든 병력과 함께
  - 온 군세를 이끌고
  lexicon: δύναμις
  rationale: 여기서 δύναμις는 추상적 ‘힘’보다 실제 전력/군세를 가리키므로, 군사적 맥락이 드러나게 했습니다.
- source_word: παρεβάλον
  english_pob_choice: encamped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 야영했습니다
  - 숙영했습니다
  lexicon: παραβάλλω
  rationale: 전투 전 배치된 군사의 상태를 드러내는 한국어 관용 표현으로 ‘진을 치다’를 택했습니다.
- source_word: Ἀμμαοῦν
  english_pob_choice: Ammaus
  chosen_korean: 아마우스
  alternatives_korean:
  - 엠마오
  - 암마우스
  lexicon: 고유명사 음역
  rationale: English POB의 ‘Ammaus’를 따르되, 외래어 표기법에 맞춘 음역으로 고유명사를 일관되게 옮겼습니다.
theological_decisions:
- issue: 전투 서술의 평서적 톤
  chosen_reading: 신학적 해석을 덧붙이지 않고, 군사 이동과 주둔의 사실 서술을 그대로 살렸습니다.
  alternative_readings:
  - 하나님의 섭리나 심판을 암시하는 해석을 문장에 삽입함
  - ‘진을 쳤습니다’를 상징적으로 확장함
  rationale: 본문은 사건의 전개를 간결하게 기록할 뿐이므로, 의미를 과장하거나 설교적으로 확장하지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 서술문 직역 원칙
- issue: 지명 표기 'Ἀμμαοῦν'
  chosen_reading: 아마우스
  alternative_readings:
  - 엠마오
  - 암마우스
  rationale: POB의 audited English 형태인 ‘Ammaus’를 반영하되, 한국어 독자가 문맥상 동일 지명으로 인식할 수 있게 음역을 정리했습니다.
  doctrine_reference: 고유명사 표기 일관성
