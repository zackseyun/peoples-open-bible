translation:
  language: en
  text: Greet every one of the holy people in Christ Jesus[a]. The brothers[b] who are with me send you their greetings.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in Jesus the Messiah.”
    reason: lexical_alternative
  - marker: b
    text: “Brothers” here may refer more broadly to fellow believers with Paul, including both men and women.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: every saint
  simplified_phrase: every one of the holy people
  preserved_meaning: Each believer is identified as holy or set apart.
  reasoning_layer_used: POB lexical decision for πάντα ἅγιον
  rationale: This avoids the modern misconception that saints are only specially recognized deceased believers.
- pob_phrase: The brothers with me greet you
  simplified_phrase: The brothers who are with me send you their greetings
  preserved_meaning: Paul's companions convey their greetings to the readers.
  reasoning_layer_used: POB lexical decisions for ἀσπάζονται and οἱ σὺν ἐμοὶ ἀδελφοί
  rationale: The recast sentence sounds natural in modern correspondence while retaining the distinct group and action.
translation_notes:
  risk_flags:
  - risk: “Holy people” could sound collective rather than distributive.
    mitigation: “Every one of” preserves the Greek emphasis on each individual.
  - risk: “Brothers” may be understood as excluding women.
    mitigation: Footnote b preserves the contextually broader possibility.
