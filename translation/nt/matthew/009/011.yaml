  chosen_reading: Supplied 'it' in English
  alternative_readings:
  - And seeing, the Pharisees were saying...
  - And when the Pharisees saw, they were saying...
  rationale: The Greek leaves the object implicit, but English normally requires one in this construction. Supplying 'it' clarifies that they observed the meal situation without adding theological content.
