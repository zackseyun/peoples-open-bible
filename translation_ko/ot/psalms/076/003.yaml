source:
  edition: WLC
  text: שָׁ֭מָּ/ה שִׁבַּ֣ר רִשְׁפֵי קָ֑שֶׁת מָגֵ֬ן וְ/חֶ֖רֶב וּ/מִלְחָמָ֣ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/003.yaml
  text: There he shattered the arrows of the bow[a], shield and sword and battle[b]. Selah
  footnotes:
  - marker: a
    text: Or 'the fiery arrows of the bow.' The Hebrew expression literally involves 'flames/flashes of the bow,' a poetic way of referring to arrows with vivid imagery.
    reason: lexical_alternative
  - marker: b
    text: Or 'and war' / 'and warfare.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 그분은 활의 불화살[a]과 방패와 칼과 전쟁[b]을 부수셨습니다. 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘활의 화살들’. 히브리어 표현은 문자적으로 ‘활의 불꽃/번개’를 뜻하며, 활에서 쏘는 화살을 생생한 이미지로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전투’ 또는 ‘전쟁 행위’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: was
  chosen_korean: 있습니다
  alternatives_korean:
  - 되었습니다
  - 있었습니다
  lexicon: HALOT
  rationale: 여기서는 존재 상태를 여는 서술이므로, 현대 한국어에서 자연스럽고 간결한 ‘있습니다’로 옮겨 장소-서술의 기능을 살렸습니다.
- source_word: סֻכּוֹ
  english_pob_choice: his shelter
  chosen_korean: 그분의 장막
  alternatives_korean:
  - 그분의 피난처
  - 그분의 초막
  - 그분의 성막
  lexicon: HALOT
  rationale: סֻכּוֹ는 기본적으로 덮개가 있는 임시 거처를 가리키므로, 시적 문맥과 고대적 이미지를 살리는 ‘장막’이 적절합니다.
- source_word: וּמְעוֹנָתוֹ
  english_pob_choice: and his dwelling place
  chosen_korean: 그분의 거처
  alternatives_korean:
  - 그분의 주거
  - 그분의 거주지
  - 그분의 dwelling place
  lexicon: HALOT
  rationale: מְעוֹנָה는 거주하는 자리라는 뜻이므로, 격식 있으면서도 자연한 ‘거처’가 핵심 의미를 잘 전달합니다.
- source_word: בְשָׁלֵם / בְצִיּוֹן
  english_pob_choice: in Salem / in Zion
  chosen_korean: 살렘 / 시온
  alternatives_korean:
  - 예루살렘 / 시온
  - 살렘 / 예루살렘
  lexicon: HALOT
  rationale: 히브리어가 두 지명을 병렬로 보존하므로, 본문도 ‘살렘’과 ‘시온’을 각각 살려 시적 평행을 유지했습니다.
theological_decisions:
- issue: 살렘과 시온의 관계를 본문에서 어떻게 처리할지
  chosen_reading: 본문에서는 두 지명을 구분해 유지하고, 독자가 동일한 성소 전통을 암시적으로 느끼도록 했습니다.
  alternative_readings:
  - ‘살렘’을 ‘예루살렘’으로 풀어 명시적으로 동일시함
  rationale: 시편의 시적 병렬을 보존하는 것이 원문이 주는 의미 층위를 가장 잘 드러내므로, 주석적 동일시는 본문에서 하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
