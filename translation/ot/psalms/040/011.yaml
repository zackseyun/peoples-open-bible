id: PSA.40.11
reference: Psalms 40:11
source:
  edition: WLC
  text: אַתָּ֤ה יְהוָ֗ה לֹא תִכְלָ֣א רַחֲמֶ֣י/ךָ מִמֶּ֑/נִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ תָּמִ֥יד יִצְּרֽוּ/נִי־׃
translation:
  text: You, O Yahweh, do not withhold[a] your compassion from me; may your steadfast love and your faithfulness continually preserve me[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The same Hebrew verb as “restrained” in verse 9, where the psalmist has not held back his lips from praise.
    reason: cross_reference
  - marker: b
    text: Or “You, O Yahweh, will not withhold your compassion from me; your steadfast love and your faithfulness will continually preserve me,” a statement of confidence rather than a plea.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: תִכְלָא
  chosen: do not withhold
  alternatives:
  - will not restrain
  - will not shut up
  - do not withhold
  lexicon: HALOT
  rationale: The imperfect has volitive force in this prayer context.
- source_word: רַחֲמֶיךָ
  chosen: your compassion
  alternatives:
  - your mercies
  - your tender mercies
  lexicon: HALOT
  rationale: The plural noun from רחם often denotes compassionate mercy. "Compassion" is natural modern English and conveys the affective force without archaic phrasing like "tender mercies."
- source_word: מִמֶּנִּי
  chosen: from me
  alternatives:
  - away from me
  lexicon: HALOT
  rationale: Standard rendering of the preposition plus 1cs suffix; "from me" is sufficient in English after "withhold."
- source_word: חַסְדְּךָ
  chosen: your steadfast love
  alternatives:
  - your lovingkindness
  - your covenant love
  - your mercy
  lexicon: HALOT
  rationale: חסד is a key covenant term. "Steadfast love" best balances fidelity, kindness, and covenant commitment in readable modern English.
- source_word: אֲמִתְּךָ
  chosen: your faithfulness
  alternatives:
  - your truth
  - your reliability
  lexicon: HALOT
  rationale: אמת can mean truth or faithfulness. In parallel with חסד and in relation to God's preserving action, "faithfulness" best captures the relational and covenantal sense.
- source_word: תָּמִיד
  chosen: continually
  alternatives:
  - always
  - constantly
  lexicon: HALOT
  rationale: Rendered adverbially to modify the guarding action. "Continually" preserves the durative sense in a slightly elevated but still natural register.
- source_word: יִצְּרוּנִי
  chosen: may ... preserve me
  alternatives:
  - will preserve me
  - will keep me
  - will watch over me
  lexicon: HALOT
  rationale: The plural imperfect functions as a petition with steadfast love and faithfulness as its subject.
