source:
  edition: lxx-swete-1909
  text: ἐπράθητε τοῖς ἔθνεσιν οὐκ εἰς ἀπώλειαν, διὰ δὲ τὸ παροργίσαι ὑμᾶς τὸν θεόν, παρεδόθητε τοῖς ὑπεναντίοις.
  language: Greek
  pages:
