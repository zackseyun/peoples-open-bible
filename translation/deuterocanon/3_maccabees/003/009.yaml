  meaning_decisions:
  - source_phrase: τηλικοῦτο σύστημα
    prior_rendering: so great an organization
    new_rendering: so large a community
    rationale: In this narrative, the organized body is the Jewish community, not an administrative institution.
  - source_phrase: μηδὲν ἠγνοηκός
    prior_rendering: lacking no knowledge
    new_rendering: innocent of any wrongdoing
    rationale: The verb can refer to an error or offense. The context concerns the injustice of persecuting a loyal community, rather than its possession of comprehensive knowledge.
  - source_phrase: μὴ γὰρ οὕτω παροραθήσεσθαι
    prior_rendering: For … must not be overlooked
    new_rendering: For they believed that … would not be disregarded in this way
    rationale: The future infinitive continues the expectation expressed in verse 8. It gives the observers' reason for expecting change rather than issuing a detached command, and οὕτω describes the manner of disregard.
