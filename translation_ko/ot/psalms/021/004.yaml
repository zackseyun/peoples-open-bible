  yaml_path: translation/ot/psalms/021/004.yaml
  text: He asked you for life; you gave it to him—length of days[b] forever and ever[a].
  footnotes:
  - marker: a
    text: The phrase 'forever and ever' may be read as royal hyperbole for enduring life and reign, or as language that finds fuller fulfillment in the Messiah.
    reason: alternative_reading
  - marker: b
    text: Or 'long life'; literally 'length of days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 주님께 생명을 구하니, 주님께서 그에게 주셨습니다—영원무궁토록 긴 날들을.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘긴 생명’. 직역하면 ‘날들의 길이’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영원무궁토록’은 오래 지속되는 생명과 통치를 높여 말한 왕실 찬양의 표현으로 읽힐 수도 있고, 메시아 안에서 더욱 충만하게 성취되는 표현으로 읽힐 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תְקַדְּמֶנּוּ
  english_pob_choice: you meet him
  chosen_korean: 그를 맞이하십니다
  alternatives_korean:
  - 그를 만나십니다
  - 그보다 앞서 가십니다
  - 그에게 먼저 다가가십니다
  lexicon: HALOT
  rationale: קדם의 ‘마중하다/맞이하다’는 선행성과 대면의 뉘앙스를 함께 살리므로, 합쇼체 시에서 자연스럽고 격식 있는 ‘맞이하십니다’로 옮겼습니다.
- source_word: בִּרְכוֹת טוֹב
  english_pob_choice: blessings of good
  chosen_korean: 좋은 복
  alternatives_korean:
  - 복의 선함
  - 선한 복
  - 좋은 축복
  lexicon: HALOT
  rationale: 히브리어의 복수형 ‘blessings’와 수식어 ‘good’을 함께 살려, 내용의 범위를 좁히지 않으면서도 한국어에서 가장 자연스러운 ‘좋은 복’으로 처리했습니다.
- source_word: פָּז
  english_pob_choice: fine gold
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 정련된 금
  - 순수한 금
  lexicon: HALOT
  rationale: פָּז는 고급 금속을 가리키므로, 시편의 왕권적 문맥에서 ‘순금’이 가장 간결하고 품격 있게 대응합니다.
- source_word: עֲטֶרֶת
  english_pob_choice: a crown
  chosen_korean: 왕관
  alternatives_korean:
  - 면류관
  - 관
  - 면류
  lexicon: HALOT
  rationale: 왕을 위한 관의 맥락이 분명하므로, 한국어 독자에게 즉시 의미가 드러나는 ‘왕관’으로 옮겼습니다.
theological_decisions:
- issue: 시의 복의 성격을 특정 범주로 제한할지 여부
  chosen_reading: 복의 내용을 물질적 번영이나 영적 축복으로 한정하지 않고, 하나님께서 베푸시는 선한 호의로 넓게 유지했습니다.
  alternative_readings:
  - 물질적 번영으로 구체화
  - 언약적·영적 축복으로 구체화
  rationale: 원문 ‘blessings of good’는 의도적으로 넓은 표현이므로, 한국어도 그 범위를 보존해 독자가 시적 풍요를 그대로 받도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
