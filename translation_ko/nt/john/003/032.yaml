translation:
  language: ko
  text: 그가 보고 들은 것을 증언합니다[a]. 아무도 그의 증언을 받지 않습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘증거합니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘아무도 그의 증언을 받지 않는다’는 강한 일반화입니다. 다음 절에서는 그의 증언을 받은 사람이 언급됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  english_pob_choice: What
  chosen_korean: 이것/…것
  alternatives_korean:
  - 그것
  - 이 바(것)
  lexicon: BDAG / Greek demonstrative
  rationale: 중성 관계대명사 ὃ는 앞에서 언급한 내용 전체(‘본 것과 들은 것’)을 가리킵니다. 한국어에서는 내용 지시를 위해 ‘이것’ 또는 ‘…것’ 구조(여기서는 ‘본 것과 들은 이것’)로 처리하는 것이 자연스럽고 원문의 지시 대상을 보존합니다.
- source_word: ἑώρακεν / ἤκουσεν
  english_pob_choice: he has seen and heard
  chosen_korean: 본 것과 들은
  alternatives_korean:
  - 보았고 들은
  - 보고 들은
  lexicon: BDAG (perfect/aorist aspect)
  rationale: 그리스어의 퍼펙트·아오리스트 대조를 한국어의 과거 표현으로 재현했습니다. 한국어에 명확한 현재완료 대조가 없으므로 ‘본 것과 들은’(또는 ‘보았고 들은’)으로 완료된 행위를 지시하되 문맥상 계속된 관련성을 보존합니다.
- source_word: μαρτυρεῖ / μαρτυρίαν
  english_pob_choice: he testifies to / testimony
  chosen_korean: 증언합니다 / 증언
  alternatives_korean:
  - 증거합니다 / 증거
  - 증인으로 말합니다 / 증언
  lexicon: BDAG (witness, testify)
  rationale: 요한복음의 μαρτυρεῖ는 법적·공적 증언의 뉘앙스를 포함합니다. 한국어로는 '증언합니다'가 이러한 법정적·목격적 어감을 전달하면서도 공적 증언이라는 원어 의미를 유지합니다.
- source_word: οὐδεὶς λαμβάνει
  english_pob_choice: no one receives
  chosen_korean: 아무도 받지 않습니다
  alternatives_korean:
  - 아무도 받아들이지 않습니다
  - 누구도 받지 않습니다
  lexicon: 'BDAG (λαμβάνω: receive, accept)'
  rationale: λαμβάνει는 요한서신에서 ‘받음/수용’의 관용적 어휘입니다. 더 해석적인 '받아들이지 않습니다'도 가능하지만, 원어의 직역적 어감을 살려 보다 중립적이고 직접적인 '받지 않습니다'로 번역했습니다.
theological_decisions:
- issue: 범위가 드러나는 부정어 '아무도 그의 증언을 받지 않는다'의 해석
  chosen_reading: 그리스어의 강한 일반화(수사적 보편부정)를 그대로 살려 번역한다 — '아무도 받지 않습니다'로 보존
  alternative_readings:
  - 매우 적은 사람들이 받는다(완화)
  - 문맥상 단지 대부분이 받지 않는다는 뜻(부분적 부정)
  rationale: 원문은 강한 보편 부정을 사용하여 수사적 긴장을 만들어 냅니다. 다음 절이 이를 부분적으로 완화하는 사례(받는 이가 있음)를 제시하므로 번역문은 이 긴장을 지우지 않고 원문의 극적 효과를 유지해야 합니다.
  doctrine_reference: 원문 텍스트의 수사성과 신학적 함축을 해소하지 않고 보존함
