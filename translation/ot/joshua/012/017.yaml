  lexicon: HALOT
  rationale: Place name; transliterated by standard English convention.
- source_word: אֶחָד
  chosen: one
  alternatives:
  - one king
  lexicon: HALOT
  rationale: Same elliptical counting formula as the first occurrence; kept consistent to mirror the Hebrew list style.
