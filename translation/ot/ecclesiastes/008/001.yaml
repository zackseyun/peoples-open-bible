  from: Who is like the wise man[a], and who knows the interpretation of a matter? A man's wisdom lights up his face[b], and the hardness of his face is changed.
  to: Who is like the wise man, and who knows the interpretation of a matter? A man's wisdom lights up his face, and the sternness of his face is changed.[a]
