  to: 죽었던 사람이 손과 발이 감는 천으로 묶인 채 나왔습니다[a]. 그의 얼굴은 수건으로 감싸여 있었습니다. 예수께서 그들에게 말씀하십니다. 「그를 풀어 주고 가게 하십시오.」
