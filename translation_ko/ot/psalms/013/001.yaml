id: PSA.13.1
reference: Psalms 13:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַד אָ֣נָה יְ֭הוָה תִּשְׁכָּחֵ֣/נִי נֶ֑צַח עַד אָ֓נָה תַּסְתִּ֖יר אֶת פָּנֶ֣י/ךָ מִמֶּֽ/נִּי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/001.yaml
  text: How long, O Yahweh, will you forget me forever? How long will you hide your face[a] from me?
  footnotes:
  - marker: a
    text: Or “your presence”; literally, “your face.” In Hebrew, hiding one’s face can signify withdrawing favor or presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 어느 때까지 저를 영원히 잊으시겠습니까? 어느 때까지 주님의 얼굴을 제게서 숨기시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 임재’. 직역하면 ‘주님의 얼굴’입니다. 히브리어에서 얼굴을 숨긴다는 표현은 호의나 임재를 거두는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 합창 지휘자에게
  - 지휘 책임자에게
  lexicon: HALOT
  rationale: 시편 표제의 לַמְנַצֵּחַ는 연주를 맡는 책임자를 가리키므로, 기능을 드러내는 현대 한국어로 자연스럽게 옮겼습니다. 여격 표지 ל는 표제문 맥락에서 ‘-에게’로 처리했습니다.
- source_word: מִזְמ֥וֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  - 찬가
  lexicon: HALOT
  rationale: מִזְמוֹר는 장르 표지로서 ‘시’가 가장 간결하고 표제문에 자연스럽습니다. ‘시편’은 책 이름과 겹칠 수 있어 여기서는 장르를 더 직접적으로 드러내는 표현을 택했습니다.
- source_word: לְ/דָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗이 지은
  - 다윗을 위한
  - 다윗에 속한
  lexicon: HALOT
  rationale: לְדָוִד는 저자성, 관련성, 헌정 등 여러 관계를 가질 수 있으므로, 영어 POB의 ‘of David’처럼 한국어에서도 소유·관련의 여지를 남기는 ‘다윗의’를 사용했습니다.
theological_decisions:
- issue: 시편 표제의 לְדָוִד 관계성
  chosen_reading: 다윗의 시로 단정하지 않고, 다윗과의 연관성을 열어 둡니다.
  alternative_readings:
  - 다윗이 지은 시
  - 다윗을 위한 시
  rationale: 히브리어 표제가 저자·소속·헌정의 가능성을 모두 허용하므로, 본문이 말하는 범위를 넘어서 저작권을 확정하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3
