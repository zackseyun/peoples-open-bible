id: PSA.113.5
reference: Psalms 113:5
source:
  edition: WLC
  text: מִ֭י כַּ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הַֽ/מַּגְבִּיהִ֥י לָ/שָֽׁבֶת׃
translation:
  text: Who is like Yahweh our God, who is seated on high,
  philosophy: dynamic
lexical_decisions:
- source_word: מִי
  chosen: Who
  alternatives:
  - Who is there
  lexicon: HALOT
  rationale: Interrogative pronoun introducing a rhetorical question of incomparability. Simple 'Who' is idiomatic and preserves the force.
- source_word: כַּ/יהוָה
  chosen: is like Yahweh
  alternatives:
  - is like Yahweh
  - is comparable to the LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: אֱלֹהֵינוּ
  chosen: our God
  lexicon: HALOT
  rationale: Construct form with 1cp suffix, straightforwardly 'our God,' appositional to 'the LORD.'
- source_word: הַמַּגְבִּיהִי
  chosen: who sits on high
  alternatives:
  - who has exalted himself to sit
  - the one who enthrones himself high
  - who is enthroned on high
  lexicon: HALOT
  rationale: From גבהּ in a causative/denominative participial form, literally 'the one making high.' In context with לָשָׁבֶת ('to sit/dwell'), the sense is idiomatically that God is exalted in his seated position. 'Who sits on high' gives natural English while preserving the image of transcendent exaltation. More literal options were considered but are less idiomatic here.
- source_word: לָשָׁבֶת
  chosen: sits
  alternatives:
  - to sit
  - to dwell
  lexicon: HALOT
  rationale: Infinitive construct with ל following the participle, functioning idiomatically with it. English finite 'sits' best conveys the clause in context; 'dwell' is possible lexically but 'sit' fits the enthronement imagery better.
