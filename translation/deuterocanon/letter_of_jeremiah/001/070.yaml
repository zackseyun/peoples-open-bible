translation:
  text: In the same way, their wooden gods overlaid with gold and silver are like a thornbush[a] in a garden, on which every bird sits, and also like a dead body thrown out in the dark.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek names a thorny shrub; 'buckthorn' is another possible rendering.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν αὐτὸν τρόπον
  chosen: In the same way
  alternatives:
  - Likewise
  - In the same manner
  lexicon: LSJ
  rationale: Idiomatic introductory phrase marking comparison; 'In the same way' is natural modern English and preserves the comparative force.
- source_word: ῥάμνῳ
  chosen: a thornbush
  alternatives:
  - a buckthorn
  lexicon: LSJ, ῥάμνος (Scaife ATLAS lsj-n92149; consulted 2026-10-19)
  rationale: The printed dative is ῥάμνῳ, a thorny shrub, not the malformed βάμψῳ. LSJ includes several prickly shrubs, so thornbush avoids an unsupported species identification. This is a second comparison, distinct from the protective figure in verse 69.
- source_word: ἐν κήπῳ
  chosen: in a garden
  alternatives:
  - in an orchard
  lexicon: LSJ
  rationale: κήπος commonly means 'garden'; no contextual need to narrow to orchard.
- source_word: ἐφ’ ἧς πᾶν τὸ ὄρνεον ἐπικάθηται
  chosen: on which every bird sits
  alternatives:
  - upon which every bird perches
  lexicon: LSJ
  rationale: Straightforward relative clause; 'sits' is simple and natural, while still reflecting the image of birds perching on an inert object.
- source_word: νεκρῷ ἐρριμμένῳ ἐν σκότει
  chosen: a dead body thrown out in the dark
  alternatives:
  - a corpse cast into darkness
  - the dead one lying discarded in darkness
  lexicon: LSJ
  rationale: νεκρός here is best rendered concretely as 'dead body/corpse.' ἐρριμμένῳ conveys being thrown or cast aside. 'In the dark' preserves ἐν σκότει without overinterpreting it as metaphysical darkness.
- source_word: ἀφωμοίωνται
  chosen: are like
  alternatives:
  - have been likened to
  - resemble
  rationale: The perfect passive expresses a comparison or likeness. Are like is idiomatic English here, not a claim that the gods were physically remade into a shrub or corpse.
- source_word: οἱ θεοὶ αὐτῶν ξύλινοι καὶ περίχρυσοι καὶ περιάργυροι
  chosen: their wooden gods overlaid with gold and silver
  alternatives:
  - their gods of wood, covered with gold and silver
  - their wooden gods plated with gold and silver
  lexicon: LSJ
  rationale: ξύλινοι identifies the idols as wooden in substance; περίχρυσοι and περιάργυροι indicate gold and silver covering/overlay. 'Overlaid with gold and silver' is clear and idiomatic.
