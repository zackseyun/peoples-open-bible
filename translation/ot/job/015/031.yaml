  from: Let him not trust in emptiness[a], deceiving himself[c][b], for emptiness will be his recompense.
  to: Let him not trust in emptiness, going astray[a], for emptiness will be what he gets in return[b].
  rationale: נִתְעָה does not expressly make the subject the agent of his own deception; “going astray” preserves its non-reflexive ambiguity, with the passive alternative properly noted. “What he gets in return” is a natural contextual rendering of תְּמוּרָתוֹ and does not require a punitive sense. Repeating “emptiness” appropriately retains the repeated שָׁוְא.
