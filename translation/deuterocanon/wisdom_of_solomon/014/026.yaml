translation:
  text: ingratitude, defilement of souls, sexual perversion[a], disorder in marriages, adultery and debauchery.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'change of birth or generation'; the phrase may instead refer to confusion of parentage.
