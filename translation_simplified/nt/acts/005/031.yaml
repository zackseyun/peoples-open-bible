translation:
  language: en
  text: God raised this very Jesus to the place of highest honor at his right hand[a], as Leader and Savior. He did this to give Israel reorientation toward God[b]—and forgiveness of sins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “God raised him up by his right hand.” The Greek can have either sense, but the main text most likely refers to the place of highest honor beside God.
    reason: alternative_reading
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: this one
  simplified_phrase: this very Jesus
  preserved_meaning: The wording points emphatically and specifically to Jesus.
  reasoning_layer_used: lexical decision for τοῦτον
  rationale: Naming Jesus makes the reference immediately clear while preserving the demonstrative emphasis.
- pob_phrase: exalted this one to his right hand
  simplified_phrase: raised this very Jesus to the place of highest honor at his right hand
  preserved_meaning: God elevated Jesus to supreme honor and authority beside him.
  reasoning_layer_used: theological decision on exaltation and lexical decision for ὕψωσεν
  rationale: The expanded wording explains the royal image without reducing it to resurrection.
interpretive_expansions:
- pob_phrase: to his right hand
  rendering: to the place of highest honor at his right hand
  claim: God placed Jesus in the position of highest honor and authority beside him.
  evidence:
  - The POB theological decision identifies this as exaltation to highest honor and authority.
  - The POB lexical rationale favors the New Testament enthronement idiom.
  confidence: high
  alternatives_preserved:
  - God exalted him by his right hand.
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: The Greek phrase for God’s right hand may describe either destination or means.
    mitigation: The main text follows the POB’s preferred enthronement sense, and the instrumental reading remains in the footnote.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
