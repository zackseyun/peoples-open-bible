  to: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into fiery Gehenna.
  rationale: Because 'Gehenna' functions as a proper noun in English, preceding it with the definite article ('the Gehenna') is grammatically awkward. Greek frequently uses the definite article with proper nouns, but English typically drops it. Consider 'the fire of Gehenna', 'fiery Gehenna', or simply 'Gehenna of fire'.
