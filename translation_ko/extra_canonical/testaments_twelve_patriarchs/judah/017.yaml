  rationale: 원문 1–5절 전체를 보완하여 번역 범위를 일치시켰습니다. 금과 아름다움 때문에 베수에에게로 잘못 이끌렸다는 인과와 방향성을 유지했고, ‘이 두 가지’가 후손과 왕국에 미칠 결과라는 문장 구조를 보존했습니다. 3–5절에서는 야곱에 대한 순종, 아브라함과 야곱의 축복, 유다에게서 왕국이 일어날 것이라는 진술을 직접적으로 옮겼습니다. 대응 내용이 없는 각주 표지는 제거했습니다.
