  terminology: בָּמָה를 ‘산당’으로 옮긴 것은 에스겔 20장의 예배 처소 문맥에 잘 맞습니다. 마지막 ‘바마’는 명칭으로 음역하여 원문의 어원적 말장난을 보존합니다.
