id: HAB.2.16
reference: Habakkuk 2:16
source:
  edition: WLC
  text: שָׂבַ֤עְתָּ קָלוֹן֙ מִ/כָּב֔וֹד שְׁתֵ֥ה גַם אַ֖תָּה וְ/הֵֽעָרֵ֑ל תִּסּ֣וֹב עָלֶ֗י/ךָ כּ֚וֹס יְמִ֣ין יְהוָ֔ה וְ/קִיקָל֖וֹן עַל כְּבוֹדֶֽ/ךָ־־׃
translation:
  text: You have had your fill of shame instead of glory. Drink, you also, and show your uncircumcision[a]! The cup from the LORD’s right hand will come around to you, and utter disgrace will be upon your glory.
  footnotes:
  - marker: a
    text: An ancient Hebrew quotation reads a different letter order, commonly understood as ‘stagger’; Greek and Syriac also express shaking or agitation. The quotation’s commentary nevertheless invokes an uncircumcised heart. Which Hebrew wording is earliest remains unresolved.
    reason: textual_variant
