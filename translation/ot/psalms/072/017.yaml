  from: May his name endure forever; may his name continue as long as the sun[a]. May all nations be blessed in him[b]; may they call him blessed.
  to: May his name endure forever; may his name continue as long as the sun[a]. May all nations be blessed in him[b]; may they call him blessed.
  rationale: The later audit’s “as long as the sun” correctly conveys the temporal expression rather than suggesting a spatial position. I retain its restrained rendering of the rare verb and the blessing formula, including the reflexive alternative.
