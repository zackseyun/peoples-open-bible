  - 인류의 격노
  lexicon: HALOT
  rationale: אָדָם은 여기서 일반적인 인간을 가리키므로 '사람'으로 옮겼고, חֵמָה는 높임 없이도 충분한 '분노'가 시적 어조에 가장 자연스럽습니다.
- source_word: שְׁאֵרִית חֵמֹת
  english_pob_choice: the remnant of wrath
  chosen_korean: 남은 분노
  alternatives_korean:
  - 분노의 나머지
  - 남은 진노
  - 남겨진 분노
  lexicon: HALOT
  rationale: שְׁאֵרִית의 남아 있는 것이라는 뜻을 간결하게 살리면서, 한국어 시적 표현으로는 '남은'이 가장 자연스럽습니다.
- source_word: תַּחְגֹּר
  english_pob_choice: you will gird yourself
  chosen_korean: 자신을 두르실 것입니다
  alternatives_korean:
  - 스스로 띠를 띠실 것입니다
  - 두르실 것입니다
  - 허리에 차실 것입니다
  lexicon: HALOT
  rationale: חגר의 기본 이미지는 '둘러 매다/띠다'이므로, 해석을 지나치게 풀지 않고 은유를 유지하는 '두르시다'를 택했습니다.
theological_decisions:
- issue: 마지막 절의 난해한 동사구 해석
  chosen_reading: 하나님께서 남은 분노를 '자신을 두르시는' 이미지로 보존했습니다.
  alternative_readings:
  - 남은 분노를 제어하실 것입니다
  - 남은 분노가 주님을 두를 것입니다
  rationale: 히브리어 완료/미완료 어형과 어순이 2인칭 하나님 지시를 자연스럽게 받으므로, POB의 원문 보존 원칙에 따라 해석을 정리하지 않고 은유를 유지했습니다.
  doctrine_reference: Translation philosophy §3 — 어려운 히브리어는 평탄화하지 말고 긴장을 보존한다.
