  lexicon: 고유명사 표기 관례
  rationale: 히브리어 고유명사는 한국어 음역 관례에 따라 ‘고멜’로 적는 것이 자연스럽습니다.
- source_word: אַשְׁכֲּנַז
  english_pob_choice: Ashkenaz
  chosen_korean: 아스그나스
