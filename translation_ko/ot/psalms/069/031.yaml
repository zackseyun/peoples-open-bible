  yaml_path: translation/ot/psalms/069/031.yaml
  text: And it will please Yahweh more than an ox[a], a bull with horns and split hooves.
  footnotes:
  - marker: a
    text: Or 'with a thank-offering'; the Hebrew תּוֹדָה can refer either to thanksgiving or to a thanksgiving sacrifice, depending on context.
