id: EXO.3.13
reference: Exodus 3:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָֽ/אֱלֹהִ֗ים הִנֵּ֨ה אָנֹכִ֣י בָא֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/אָמַרְתִּ֣י לָ/הֶ֔ם אֱלֹהֵ֥י אֲבוֹתֵי/כֶ֖ם שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/אָֽמְרוּ לִ֣/י מַה שְּׁמ֔/וֹ מָ֥ה אֹמַ֖ר אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: ko
  text: 그러자 모세가 하나님께 말했습니다. “보십시오, 제가 이스라엘 자손에게 가서 ‘여러분의 조상의 하나님께서 저를 여러분에게 보내셨습니다’라고 말하면, 그들이 제게 ‘그분의 이름이 무엇입니까?’라고 하면, 제가 그들에게 무엇이라고 말해야 합니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오
  lexicon: הִנֵּה
  rationale: 호소문맥의 주의 환기 표현으로, 합쇼체에서 자연스럽고 직접적인 ‘보십시오’가 POB의 ‘Look’에 가장 가깝습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: בְּנֵי יִשְׂרָאֵל
  rationale: 직역적이면서도 한국어 성경에서 널리 이해되는 집단명으로, 혈통·언약 공동체의 뉘앙스를 유지합니다.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  english_pob_choice: The God of your fathers
  chosen_korean: 여러분의 조상의 하나님
  alternatives_korean:
  - 너희 조상의 하나님
  - 너희 조상들의 하나님
  lexicon: אֱלֹהֵי אֲבוֹתֵיכֶם
  rationale: 직접 خطاب을 합쇼체로 옮기면서도 ‘아버지들’의 관용적 의미를 ‘조상’으로 풀어 한국어에서 자연스럽게 했습니다.
- source_word: מַה שְּׁמוֹ
  english_pob_choice: What is his name?
  chosen_korean: 그의 이름이 무엇입니까?
  alternatives_korean:
  - 그 이름이 무엇입니까?
  - 무슨 이름입니까?
  lexicon: שֵׁם
  rationale: 질문의 대상이 ‘이름’임을 그대로 살리되, 소유격 ‘그의’로 문맥상 앞선 ‘하나님’에 대한 지시를 보존했습니다.
theological_decisions:
- issue: 하나님의 호칭을 일반명사로 둘지 고유 호칭으로 둘지
  chosen_reading: 하나님
  alternative_readings:
  - 하느님
  - 신
  rationale: 출애굽기 서술의 표준적 신명칭으로서 공적·신학적 가독성을 유지하면서, 원문의 אֱלֹהִים을 통상적인 한국어 신칭으로 옮겼습니다.
  doctrine_reference: 구약 신명칭 번역 일관성
- issue: 직접화법의 호소어 ‘Look’를 명령형으로 얼마나 강하게 옮길지
  chosen_reading: 보십시오
  alternative_readings:
  - 보라
  - 보세요
  rationale: 모세의 진술 안에 들어간 주의 환기 표현으로서, 너무 구어적이거나 고어적인 어조를 피하고 합쇼체의 공손한 강조를 유지했습니다.
  doctrine_reference: 서술 내 직접화법 화행 보존
