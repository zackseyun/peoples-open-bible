theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Depiction of divine judgment by fire
  chosen_reading: the fire of the LORD burned among them
  alternative_readings:
  - a fire from the LORD burned among them
  rationale: The translation preserves the text's direct attribution of the fire to the LORD without softening or expanding the theological claim. The genitive construction is left transparent rather than interpreted away.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
