translation:
  text: 'The second way: because they cannot now make a good reorientation[r1] so as to live[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or ''The second way: because they cannot now make a good repentance so as to live.''.'
