  - 풍부한 물이 흐르는 강으로
  - 많은 물의 급류로
  lexicon: stream of much water
  rationale: 직역을 유지하되 한국어로 자연스럽게 '흐르는 시내'로 옮겨, 물의 양이 많은 수로라는 이미지를 살렸습니다.
- source_word: ኀበ፡ እግዚኦሙ
