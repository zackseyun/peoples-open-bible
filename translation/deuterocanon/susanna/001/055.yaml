translation:
  text: Then Daniel said, “You have told a fine lie—one that brings judgment on your own head! For an angel of God has already received a sentence from God and will split you in two[a].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: In Greek, “mastic tree” (schinos, verse 54) echoes “will split” (schisei).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀρθῶς
  chosen: correctly
  alternatives:
  - rightly
  - well
  lexicon: LSJ
  rationale: 'Adverb from ὀρθός, here used ironically in Daniel''s response: the elder has ''lied rightly/correctly'' in the sense that his lie has rebounded accurately upon himself. ''Correctly'' preserves the sharp irony better than the flatter ''well''.'
- source_word: ἔψευσαι
  chosen: you have lied
  alternatives:
  - you lied
  - you have spoken falsely
  lexicon: LSJ
  rationale: Aorist middle of ψεύδομαι. 'You have lied' gives direct, idiomatic English and fits the immediate judicial accusation.
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  chosen: against your own head
  alternatives:
  - upon your own head
  - to your own hurt
  lexicon: LSJ
  rationale: This idiom signals guilt or consequence returning on the person himself. 'Against your own head' keeps the concrete imagery while making the adversative force clear in English.
- source_word: ἤδη
  chosen: already
  alternatives:
  - now
  - even now
  lexicon: LSJ
  rationale: Marks the sentence as already set in motion. 'Already' preserves the immediacy of impending judgment.
- source_word: ἄγγελος τοῦ θεοῦ
  chosen: an angel of God
  alternatives:
  - the angel of God
  lexicon: LSJ
  rationale: The Greek lacks the article before ἄγγελος, so 'an angel of God' is the more straightforward rendering here.
- source_word: λαβὼν φάσιν
  chosen: having received a sentence
  alternatives:
  - having received a decision
  - having received an order
  lexicon: LSJ
  rationale: φάσις can denote an utterance, declaration, or judicial pronouncement. In this courtroom-judgment context, 'sentence' best captures the punitive decision now to be executed.
- source_word: παρὰ τοῦ θεοῦ
  chosen: from God
  alternatives:
  - from beside God
  - at God's hand
  lexicon: LSJ
  rationale: παρά with genitive indicates source. 'From God' is the natural English equivalent.
- source_word: σχίσει σε μέσον
  chosen: will split you in two
  alternatives:
  - will cut you in half
  - will cleave you down the middle
  lexicon: LSJ
  rationale: σχίζω means split/tear; μέσον adds the sense of through the middle. 'Will split you in two' is vivid, natural English that preserves the severity of the threatened judgment.
