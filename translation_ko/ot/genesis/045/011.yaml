revisions:
- from: 그곳에서 내가 당신을 부양하겠습니다. 아직 기근이 다섯 해나 더 남았기 때문입니다. 당신과 당신의 집안과 당신에게 속한 모든 것이 빈궁에 빠지지 않게 하려는 것입니다.
  to: 그곳에서 내가 아버지를 부양하겠습니다. 아직 기근이 다섯 해 더 남아 있으니, 아버지와 아버지의 집안과 아버지께 속한 모든 것이 궁핍하게 되지 않도록 하겠습니다.
  rationale: 원문의 ‘그곳에서 ... 부양하겠다’, 남은 다섯 해의 기근, 그리고 궁핍을 막으려는 목적을 유지했습니다. 수신자가 요셉의 아버지인 문맥을 반영하여 ‘당신’을 ‘아버지’로 바꾸고, 소유물까지 포함한 병렬 목적어가 한국어에서 자연스럽게 읽히도록 문장을 조정했습니다.
