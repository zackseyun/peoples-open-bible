id: JAS.2.24
reference: James 2:24
source:
  edition: SBLGNT
  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
translation:
  text: You see that a person is justified[a] by works and not by faith alone.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “is shown to be righteous” or “is vindicated.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρᾶτε
  chosen: You see
  alternatives:
  - You see for yourselves
  - You perceive
  lexicon: BDAG
  rationale: Present active indicative, second person plural, functioning as a direct appeal to the audience based on the preceding example. 'You see' is natural modern English and preserves the indicative force better than an imperative-like 'See.'
- source_word: ἐξ ἔργων
  chosen: by works
  alternatives:
  - from works
  - out of works
  lexicon: BDAG
  rationale: The preposition ἐκ/ἐξ with the genitive here marks source or basis. In English, 'by works' best communicates the instrumental/basis sense in this argument without awkwardness.
- source_word: δικαιοῦται
  chosen: is justified
  alternatives:
  - is shown to be righteous
  - is declared righteous
  - is vindicated
  lexicon: BDAG
  rationale: δικαιόω can mean declare righteous, justify, or vindicate/show to be in the right depending on context. 'Is justified' preserves the Greek term's theological weight and lexical continuity, while the contextual nuance that works demonstrate genuine righteousness is preserved in theological documentation and footnote rather than replacing the term in the main text.
- source_word: ἄνθρωπος
  chosen: a man
  alternatives:
  - a person
  - a human being
  lexicon: BDAG
  rationale: The noun is grammatically masculine singular and used generically. Per the project's gender-accurate policy, 'a man' preserves the source form and representative force better than the gender-neutral 'a person,' with inclusivity noted in a footnote.
- source_word: πίστεως
  chosen: faith
  alternatives:
  - faithfulness
  - trust
  lexicon: BDAG
  rationale: Per the doctrine table, πίστις defaults to 'faith.' In this verse the contrast is between works and faith considered by itself, so 'faith' is retained in the main text; lexical alternatives are preserved in a footnote only as possibilities, not as preferred readings.
- source_word: μόνον
  chosen: alone
  alternatives:
  - only
  lexicon: BDAG
  rationale: Placed after 'faith' in English as 'faith alone' to reflect idiomatic English while preserving the exclusivity expressed by μόνον.
