  rationale: The verse does not explicitly identify the speaker in its wording. To preserve theological tension and avoid importing an interpretive decision, the English keeps the first person without naming the speaker.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
