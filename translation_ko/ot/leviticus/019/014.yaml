revisions:
- from: 귀한 사람을 저주하지 말며, 맹인의 앞에는 장애물을 두지 말라. 너는 네 하나님을 두려워하라. 나는 야훼니라.
  to: 듣지 못하는 사람을 저주하지 말고, 보지 못하는 사람 앞에 걸림돌을 놓지 마십시오. 여러분의 하나님을 경외하십시오. 나는 야훼입니다.
  category: register_archaic_repair
  rationale: 오역 교정입니다. 종전 본문은 「귀한 사람을 저주하지 말며」였는데, 히브리어 חֵרֵשׁ는 「귀한(貴한) 사람」이 아니라 「듣지 못하는 사람」입니다. 「귀한」은 아마도 「귀먹은」의 오기로 보이며, 그대로 두면 이 계명의 대상인 장애인 보호라는 요지가 사라집니다. 이어지는 「맹인」도 「보지 못하는 사람」으로 맞추었고, KOREAN_PIPELINE.md가 규정한 등록은 현대 합쇼체입니다. 종결 어미를 합쇼체로 통일했습니다.
