id: PSA.102.15
reference: Psalms 102:15
source:
  edition: WLC
  text: וְ/יִֽירְא֣וּ ג֭וֹיִם אֶת שֵׁ֣ם יְהוָ֑ה וְֽ/כָל מַלְכֵ֥י הָ֝/אָ֗רֶץ אֶת כְּבוֹדֶֽ/ךָ־־־׃
translation:
  text: The nations will fear the name of Yahweh[a], and all the kings of the earth will fear your glory.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “revere the name of Yahweh”; the verb includes the sense of reverent awe.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִירְאוּ
  chosen: The nations will fear
  alternatives:
  - And ... will fear
  - will revere
  lexicon: HALOT
  rationale: The waw coordinates the clause; English need not add a consequential adverb.
- source_word: גּוֹיִם
  chosen: the nations
  alternatives:
  - nations
  - Gentiles
  lexicon: HALOT
  rationale: גוים commonly means nations/peoples. 'The nations' fits the generic plural in a psalmic context better than 'Gentiles,' which can import later Jewish/Christian contrast not explicit here.
- source_word: אֶת שֵׁם יְהוָה
  chosen: the name of Yahweh
  alternatives:
  - the LORD's name
  lexicon: HALOT
  rationale: The object marker plus construct phrase is straightforward. 'Name' in Hebrew often carries reputation and revealed identity, but this should be preserved rather than paraphrased.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: וְכָל מַלְכֵי הָאָרֶץ
  chosen: and all the kings of the earth
  alternatives:
  - and every king of the earth
  lexicon: HALOT
  rationale: כָל with plural construct is naturally 'all the kings.' 'Of the earth' is retained formally rather than reduced to 'earth's kings.'
- source_word: אֶת כְּבוֹדֶךָ
  chosen: will fear your glory
  alternatives:
  - your honor
  - your splendor
  lexicon: HALOT
  rationale: The omitted governing verb is supplied in English to represent the Hebrew ellipsis clearly.
