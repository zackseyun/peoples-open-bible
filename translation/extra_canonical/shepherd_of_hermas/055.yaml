translation:
  text: 'II.1. And he says to me, “Do you see this shepherd?” “I do,” I say, “sir[a].” “This,” he says,
    “is an angel of luxury and deception[b]. He wears down the souls of God’s servants and turns them
    away from the truth, deceiving them with the evil desires in which they perish.”


    II.2. “For they forget the commandments of the living God and walk in deceptions and empty luxuries.
    They perish through this angel, some to death and some to corruption[c].”


    II.3. I say to him, “Sir, I do not understand what ‘to death’ means and what ‘to corruption’ means.”
    “Listen,” he says. “The sheep you saw cheerful and skipping are those who have separated themselves
    completely from God and handed themselves over to the desires of this age. In them, then, there is
    no repentance of life[d], because God’s name is also blasphemed because of them[e]. The life of such
    people is death[f].”


    II.4. “But the sheep you saw not skipping but grazing in one place are those who have handed themselves
    over to luxuries and deceptions, yet they have not blasphemed the Lord at all. These, then, have been
    corrupted away from the truth. In them there is hope for repentance[l], by which they can live. Corruption,
    then, has hope of a certain renewal, but death has eternal destruction[g].”


    II.5. Again we went on a little, and he shows me a great shepherd, as if savage in appearance, wearing
    a white goatskin. He had a bag on his shoulders, a very hard staff with knots, and a great whip. He
    had a very bitter look, so that I was afraid of him—such was his look[h].


    II.6. This shepherd, then, took over the sheep from the young shepherd—those that were living profligately
    and in self-indulgence, but not skipping. He cast them into a certain place that was steep, thorny,
    and full of thistles[i], so that, because of the thorns and thistles, the sheep could not disentangle
    themselves, but [were entangled in the thorns and thistles; these, then,] being entangled, grazed
    among the thorns and thistles[j]. They suffered greatly, being beaten by him. He drove them here and
    there and gave them no rest, and those sheep were not at ease at all[k].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Sir addresses the shepherd, not God. The original reader’s complete earlier record and adjudication
      history are archived; its very bitter look and the corruption/renewal versus eternal destruction
      contrast are retained.
  - marker: b
    reason: textual_variant
    text: The working Greek has luxury and deception and wears down the souls. Michigan printed63–64 instead
      has an additional therefore, ekstre p h ei (corrupts/turns) at the first verb, and a following of
      the empty ones after God’s servants, before the second turns-away verb. The working Greek does not
      contain that added description. Vulgata printed88 and Palatina printed163 render the first action
      corrupts minds and the angel title with sweetness/pleasure wording. These variants are disclosed
      without silently combining them.
  - marker: c
    reason: textual_variant
    text: Both death and corruption are explicit in the working II.2 and in Michigan printed64, though
      Michigan omits the first some/men contrast wording and has damage/supplied letters elsewhere. Palatina
      printed163 brackets some to death as an editorial addition absent from its codex; it cannot be counted
      as independent Palatina ink. Vulgata printed88 includes both outcomes. Corruption remains distinct
      from the eternal destruction in II.4.
  - marker: d
    reason: lexical_alternative
    text: No repentance of life retains the working Greek’s strong negative and genitive, with repentance
      leading to life as an explanatory alternative. Michigan printed65 partly preserves the same clause.
      Vulgata printed88 and Palatina printed163 say there is no return to life through repentance. The
      clause is not softened to a temporary delay or a mere absence of remorse; nor is it expanded into
      a doctrine beyond this passage.
  - marker: e
    reason: textual_variant
    text: Working II.3 says God’s name is blasphemed because of them. Michigan printed65 instead says
      they added blasphemy against the Lord’s name; the Lord abbreviation and much of that wording are
      printed as preserved, not a wholly supplied passage. Both Latin versions have a longer active accusation
      about adding name-blasphemy to their other offenses. These corroborate the accusation but not the
      exact passive wording. The1891 body is retained and the difference made explicit.
  - marker: f
    reason: textual_variant
    text: Working II.3 has the life of such people is death. Michigan printed65 has a shorter nominal
      wording, of such people, then, death, without the explicit life and is. Both Latin versions describe
      these people as destined for death. The complete life-is-death assertion follows the working source;
      it is not claimed as identical wording in every witness. The1891 Athos omission across much of II.3–4
      is an edition-reported copying omission, not a new photograph finding.
  - marker: l
    reason: lexical_alternative
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
  - marker: g
    reason: textual_variant
    text: Michigan printed65–66 partly preserves II.4’s hope of repentance/life and renewal versus eternal
      destruction, including damaged/supplied letters. Vulgata printed89 and Palatina printed163–165 also
      retain the contrast. No universal future renewal is inserted in place of the explicit eternal destruction,
      and the first group’s negative in II.3 is not erased by the second group’s hope.
  - marker: h
    reason: lexical_alternative
    text: Very bitter look preserves the recorded prior adjudication for peripikron. The shepherd’s repeated
      frightening look, white goatskin, shoulder bag, hard knotted staff and great whip all remain. Michigan
      printed66 lacks the explicit me in the fear clause and has damage in several descriptions; this
      does not license omitting the event in the working Greek.
  - marker: i
    reason: textual_variant
    text: The working source lists steep, thorny and thistly. Michigan printed67 omits thorny from that
      initial list, while retaining thorns later. Vulgata printed89 and Palatina printed165 support a
      fuller initial description. All three working features are translated.
  - marker: j
    reason: textual_variant
    text: The bracketed entanglement wording is an editorial restoration in the working Greek. Michigan
      printed67 partly preserves the corresponding entanglement language with damage and some different
      phrasing, while the Latin versions also describe entanglement. Not every word of the working bracket
      is claimed as papyrus ink. The critical brackets remain visible in source and English.
  - marker: k
    reason: textual_variant
    text: Michigan printed67 partly preserves no rest; the final working clause those sheep were not at
      ease at all falls beyond the viewed page and is not certified from it. The Latin versions instead
      express not being allowed to stand or remain anywhere, with Palatina also explicit no rest. The
      draft retains the working final clause and the old reader’s at ease choice, rather than silently
      replacing it by Latin wording.
lexical_decisions:
- source_word: μετάνοια ζωῆς / μετάνοια
  chosen: repentance of life / repentance
  alternatives:
  - repentance leading to life
  lexicon: Working Greek and contextual project policy; no new lexicon lookup.
  rationale: Retain the negative life claim in II.3 and the positive hope for the other group in II.4
    without replacing either with a uniform imported formula.
- source_word: περίπικρον / καταφθορά / ἀπώλεια αἰώνιος
  chosen: very bitter / corruption / eternal destruction
  alternatives:
  - very harsh / ruin / everlasting loss
  lexicon: Working Greek, bounded primary editions, and earlier reader adjudication; no new lexicon lookup.
  rationale: Preserve prior deliberate choices where faithful and the explicit distinction between the
    two outcomes.
