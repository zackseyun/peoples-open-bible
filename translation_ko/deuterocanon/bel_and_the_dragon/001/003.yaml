    text: 아르타바는 고대의 곡물 부피 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: εἴδωλον
  english_pob_choice: idol
  chosen_korean: 우상
  alternatives_korean:
  - 신상
  - 우상 숭배 대상
  lexicon: εἴδωλον
  rationale: 그리스어의 직접적 의미를 살려 바빌로니아 신상에 대한 종교적 평가를 분명히 드러내기 위해 ‘우상’으로 옮겼습니다.
- source_word: τοῖς Βαβυλωνίοις
  english_pob_choice: among the Babylonians
  chosen_korean: 바빌로니아 사람들 가운데에는
  alternatives_korean:
  - 바빌로니아인들 가운데에는
  - 바빌론 사람들 가운데에는
  lexicon: Βαβυλώνιος
  rationale: 민족 집단을 나타내므로 ‘사람들 가운데에는’으로 자연스럽게 풀어, 단순 소유가 아니라 그들 사회 내부에 있던 대상을 나타냈습니다.
- source_word: σεμιδάλεως ἀρτάβαι δώδεκα
  english_pob_choice: twelve artabas of fine flour
  chosen_korean: 고운 가루 열두 아르타바
  alternatives_korean:
  - 정제한 밀가루 열두 아르타바
  - 고운 밀가루 열두 아르타바
  lexicon: σεμίδαλις; ἀρτάβη
  rationale: σεμίδαλις는 ‘고운 가루/정제한 밀가루’의 의미가 핵심이어서 직역했고, ἀρτάβη는 고유의 도량형을 보존하기 위해 음역했습니다.
theological_decisions:
- issue: 우상에게 공급된 제물의 성격
  chosen_reading: 이 절은 벨이 실제로 먹는 존재라기보다, 바빌로니아인들이 매일 막대한 양의 곡물을 우상에게 바치는 관행을 서술합니다.
  alternative_readings:
  - 단순한 사치 비용 설명
  - 우상 자체의 실재적 필요를 암시하는 서술
  rationale: 본문의 목적은 벨 숭배의 허구성과 우상숭배의 비합리성을 드러내는 데 있으므로, ‘쓰였습니다’로 처리해 공물의 소비를 자연스럽게 드러냈습니다.
  doctrine_reference: 우상숭배 비판 / 제2계명
