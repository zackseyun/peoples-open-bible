    text: ויאמר רפאל אל טובי ואל טוביה בנו שירו ליי שיר חדש וברכו(הו) וזמרו שמו על כל הטובה אשר עשה עמכם והרבו לפניו תפלה ותחנה וצדקה כל ימי חייכם כי טוב לפני יי לעשות צדקה תמיד מכנוס אוצרות כסף וזהב כי צדקה תציל ממות ואני לא אכחד מכם כל האמת דעו כי בעת אשר התפללת[ם] והתחננת[ם] לפני (הקדוש ברוך הוא) אתה ושרה כלתך על צרת נפשכם אני העליתי תפלתכם לפני כסא הכבוד ובעת אשר היית קובר את המתים אני הייתי עמך [ובחג שבועות שעזבת את שלחנך והלכת לקבור את המת אני הייתי עמך] ובחנך האלהים בעורות עיניך כי יי צדיק יבחן ובעת צרתך שלחני יי לרפא אותך ואת שרה כלתך ואני (הוא) רפאל המלאך אחד מן השרים המשרתים לפני כסא הכבוד.
    kind: indirect_hebrew
    note: NOT an ancient Hebrew witness. Neubauer's 1878 Hebrew is a back-translation from an Aramaic Munich MS. The actual ancient evidence is Qumran 4Q196-200 (Aramaic), published in DJD XIX (not redistributable). Use for translation reference only; do not treat as Vorlage.
    reference: TOB 12:3
base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/003.yaml
  text: because he brought me back to you healthy, and he healed my wife and brought back my money, and he likewise healed you.
translation:
  language: ko
  text: 그가 저를 건강한 몸으로[a] 아버지께 데려다주었고, 제 아내를 치유해 주었으며, 제 돈을 가져다주었고, 아버지도 마찬가지로 치유해 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ὑγιῆ는 ‘건강한, 온전한 상태로’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: ὑγιῆ
  english_pob_choice: healthy
  chosen_korean: 건강하게
  alternatives_korean:
  - 온전하게
  - 무사히
  lexicon: ὑγιής
  rationale: POB의 'healthy'를 따라 신체적·상태적 회복을 직접적으로 나타내는 표준어로 옮겼습니다. 문맥상 단순한 안전 귀환보다 치유의 결과가 더 분명합니다.
- source_word: ἐθεράπευσεν
  english_pob_choice: healed
  chosen_korean: 고쳐 주었습니다
  alternatives_korean:
  - 치유하였습니다
  - 낫게 하였습니다
  lexicon: θεραπεύω
  rationale: 하나님이 아니라 행위 주체가 인간을 낫게 하는 서술이므로, 현대 한국어에서 자연스럽고 의미가 분명한 '고쳐 주었습니다'를 택했습니다.
- source_word: τὸ ἀργύριόν μου ἤνεγκεν
  english_pob_choice: brought back my money
  chosen_korean: 제 돈도 다시 가져다주었고
  alternatives_korean:
  - 제 은전도 되돌려주었고
  - 제 은도 다시 가져왔고
  lexicon: ἀργύριον
  rationale: ἀργύριον은 여기서 단순한 '은'이 아니라 실질적 재산/금전의 의미이므로 POB의 'my money'에 맞춰 옮겼습니다. '가져다주다'는 회수·반환의 뉘앙스를 살립니다.
- source_word: σὲ ὁμοίως
  english_pob_choice: likewise you
  chosen_korean: 당신도 그와 같이
  alternatives_korean:
  - 당신도 마찬가지로
  - 당신 역시
  lexicon: ὁμοίως
  rationale: 앞선 두 치유 행위를 병렬로 이어 주는 비교 부사이므로, 결과의 동일성을 드러내는 '그와 같이'로 번역했습니다.
theological_decisions:
- issue: 치유 주체와 서술 방식
  chosen_reading: 인물의 치유를 행한 주체를 드러내되, 본문이 인과를 서술하는 방식에 맞추어 직접적 서술로 옮겼습니다.
  alternative_readings:
  - '''그가… 치유하셨습니다''처럼 더 신앙적 주어를 보강하는 읽기'
  - 보다 완곡한 '무사히 돌아오게 했습니다'로 축소하는 읽기
  rationale: 그리스어 본문은 치유와 회복을 반복해 말하므로, 그 강도를 약화하지 않고 한국어에서도 같은 서술력을 유지했습니다.
  doctrine_reference: 본문 문맥 보존 원칙
