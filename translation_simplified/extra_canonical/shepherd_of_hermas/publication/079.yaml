revisions:
- category: publication_review_correction
  rationale: Paragraph 4 restores the explicit degree λίαν and the connection οὕτως … γάρ. Paragraph 6
    restores the contrast ἀλλά and the purpose and object expressed by ἵνα λάβῃς σύνεσιν νοεῖν αὐτά. Paragraph
    7 renders both occurrences of βλέπεις as actual sight rather than ability to see, while retaining
    the inability expressed by οὐ δύνῃ. Existing notes and paragraph divisions remain unchanged.; S.9.ii
    contains no tower lord’s inspection. This replacement documents the actual scene and instruction,
    including readiness rather than an already occurring shared carrying action.; This rationale follows
    the selected Greek’s distinct references to the Lord and the shepherd. Disputed stone counts and conjectural
    negation belong to other units and should not be claimed as decisions here.; The selected passage
    counts virgins, not stones, and contains neither a conjectural negative nor a pause/completion distinction.
    The replacement documents this unit’s actual simplifications and the source distinctions restored
    in the proposed text.
- category: publication_review_correction
  rationale: Addresses both findings independently against the supplied Greek. In paragraph 5, μετὰ τὸ
    ἰδεῖν με ταῦτα explicitly places the marveling after seeing these things, and ἐν ἐμαυτῷ locates it
    within Hermas himself; both are restored. In paragraph 6, διαλογίζῃ καὶ διαπορῇ names reasoning as
    well as puzzlement, while ἐν σεαυτῷ gives their inward setting; these are restored without changing
    the self-caused sorrow expressed by σεαυτῷ λύπην ἐπισπᾶσαι. Existing notes, paragraph prefixes, and
    blank-line divisions remain unchanged. No prior lexical decision is reconsidered.
- category: publication_review_correction
  rationale: In paragraph 5, τρυφεραὶ οὕτως οὖσαι asserts that the virgins were so delicate, contrasting
    this with ἀνδρείως εἱστήκεισαν, their courageous stance. Replacing “looked” with “were” removes the
    unsupported qualification about appearance. No recorded prior lexical decision is reconsidered; existing
    notes, paragraph prefixes, and blank-line divisions remain unchanged.
- category: publication_review_correction
  rationale: Add markers for the two independently checked source distinctions. The simplified arrangement
    is compatible with selected αὐτῶν, and “cannot grasp” preserves selected οὐ δύνασαι. Retain both readings
    while documenting the reported alternatives separately. Preserve all existing wording, markers, paragraph
    prefixes, and blank-line divisions. No prior lexical decision is reconsidered.; Add accessible, separate
    notes for the consequential pronoun and inability alternatives reported in the supplied apparatus.
    Preserve all existing valid notes and distinguish the selected Greek, attributed version support,
    and reported Athos readings. Include the apparatus’s additional L₁ qualification for the pronoun;
    do not silently settle its changed reference or reconstruct a sentence from the isolated οὐδὲ report.
    Existing lexical, theological, and simplification decisions remain consistent with the unchanged translation
    wording.
