    reason: source_note
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  english_pob_choice: These are the names
  chosen_korean: 이것은 … 이름이며
  alternatives_korean:
  - 이것들은 … 이름입니다
  - 이것이 … 이름입니다
  lexicon: שֵׁם
  rationale: 서술문형 도입구를 자연스러운 현대 한국어로 옮기되, ‘이것은’으로 히브리어 지시구조를 살렸습니다.
- source_word: בְּנֵי לֵוִי לְתֹלְדֹתָם
  english_pob_choice: Levi’s sons according to their generations
  chosen_korean: 레위의 아들들의 نسل에 따라
  alternatives_korean:
  - 레위의 아들들을 그 نسل대로
  - 레위의 아들들, 그 계보에 따라
  lexicon: תּוֹלְדוֹת
  rationale: תּוֹלְדוֹת는 단순한 ‘세대’보다 계보/출생 계열의 뜻이 강해 ‘…에 따라’ 구조로 원문의 계보적 진술을 살렸습니다.
- source_word: גֵּרְשׁוֹן וּקְהָת וּמְרָרִי
  english_pob_choice: Gershon, Kohath, and Merari
  chosen_korean: 게르손과 고핫과 므라리
