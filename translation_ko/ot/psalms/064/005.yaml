  text: They bolster an evil plan for themselves[b]; they talk of hiding snares; they say, “Who will see them?”[a]
  footnotes:
  - marker: a
    text: Or “Who will see us?” This takes the speakers as referring to themselves, although the Hebrew pronominal form is third-person plural (“them”).
    reason: alternative_reading
  - marker: b
    text: The Hebrew expression may also be rendered “an evil matter” or “a wicked scheme,” since דָּבָר can mean “word,” “matter,” or “affair.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 악한 일을 굳게 다지며[b], 올무를 숨길 일을 의논하고, 말합니다. “누가 그들을 보겠는가?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “누가 우리를 보겠는가?” 히브리어 형태는 3인칭 복수(“그들”)이지만, 음모를 꾸미는 자들이 자신들을 가리켜 말하는 것으로 이해하는 해석도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘악한 일’은 문맥에 따라 ‘악한 계획’ 또는 ‘사악한 음모’로도 이해할 수 있습니다. 히브리어 단어는 말, 일, 사안, 사건을 뜻할 수 있습니다.
    reason: lexical_alternative
