lexical_decisions:
- source_word: κατὰ τοῦτον τὸν τρόπον
  chosen: in this way also
  alternatives:
  - according to this manner also
  - thus also
  lexicon: LSJ
  rationale: Idiomatic phrase introducing comparison or continuation. 'In this way also' preserves the connective force of καί and reads naturally in English without over-paraphrase.
- source_word: πνεῦμα
  chosen: spirit
  alternatives:
  - breath
  - inner being
  - mind
  lexicon: LSJ
  rationale: In this martyrdom context πνεῦμα most naturally refers to the person's animating inner life rather than mere physical breath. 'Spirit' preserves the anthropological weight without narrowing it to psychology.
- source_word: στενοχωρούμενος
  chosen: being hemmed in
  alternatives:
  - being distressed
  - being constricted
  - being hard-pressed
  lexicon: LSJ
  rationale: The participle can denote being pressed into narrowness, hence distress or constriction. 'Being hemmed in' keeps the concrete imagery while allowing the emotional sense to remain implicit.
- source_word: σῶμα
  chosen: body
  alternatives:
  - flesh
  - person
  lexicon: LSJ
  rationale: Straightforward bodily reference; 'body' is the natural formal equivalent here.
- source_word: ἀγχόμενος
  chosen: being choked
  alternatives:
  - being strangled
  - being throttled
  lexicon: LSJ
  rationale: The verb denotes constriction of the throat or suffocation. 'Being choked' is vivid and accessible, while 'strangled' might over-specify a completed killing act rather than the ongoing participial process.
