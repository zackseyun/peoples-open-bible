  text: גְּעַ֨ר חַיַּ֪ת קָנֶ֡ה עֲדַ֤ת אַבִּירִ֨ים בְּ/עֶגְלֵ֬י עַמִּ֗ים מִתְרַפֵּ֥ס בְּ/רַצֵּי כָ֑סֶף בִּזַּ֥ר עַ֝מִּ֗ים קְרָב֥וֹת יֶחְפָּֽצוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/030.yaml
  text: Rebuke the beast of the reeds[a], the herd of bulls among the calves of the peoples, submitting itself with pieces of silver[b]. He has scattered the peoples who delight in wars.
  footnotes:
  - marker: a
    text: Or “the wild beast of the reeds,” possibly a figurative reference to Egypt or another hostile power.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase is difficult. The verb may mean “prostrating itself,” perhaps in submission with silver tribute; the term rendered “pieces” may denote bars or ingots of silver.
    reason: alternative_reading
translation:
  language: ko
  text: 갈대의 짐승, 곧 민족들의 송아지들 가운데 있는 황소 떼와 은 조각들을 짓밟는 자들을 꾸짖으십시오.[a][b] 전쟁을 좋아하는 민족들을 흩으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈대의 들짐승’. 이는 이집트나 다른 적대 세력을 비유적으로 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절의 히브리어는 난해합니다. ‘은 조각들을 가지고 스스로 굴복하는 자’ 또는 ‘은 덩이들로 엎드려 절하는 자’, 곧 조공을 바치는 자라는 뜻일 수도 있습니다.
    reason: alternative_reading
