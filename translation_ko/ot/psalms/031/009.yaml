  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י צַ֫ר לִ֥/י עָשְׁשָׁ֖ה בְ/כַ֥עַס עֵינִ֗/י נַפְשִׁ֥/י וּ/בִטְנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/009.yaml
  text: Be gracious to me, O Yahweh, for I am in distress; my eye has wasted away with grief[a]—my soul[b] and my belly[c] as well.
  footnotes:
  - marker: a
    text: Or “my eye has grown dim from vexation” or “my eye fails with grief.”
    reason: lexical_alternative
  - marker: b
    text: “My soul” may also be rendered “my life” or “my self.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew “my belly”; the term can also refer more broadly to the inward parts.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 제게 은혜를 베풀어 주십시오. 제가 곤경에 처해 있습니다. 괴로움으로 제 눈이 쇠하고, 제 영혼과 배도 쇠합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 눈이 괴로움으로 흐려졌습니다’ 또는 ‘제 눈이 슬픔으로 쇠합니다’.
    reason: lexical_alternative
  - marker: b
    text: ‘영혼’은 ‘생명’ 또는 ‘자신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘배’; 더 넓게는 몸속 기관 또는 내면을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  english_pob_choice: have not given me over / delivered me
  chosen_korean: 저를 ... 넘기지 않으셨고
  alternatives_korean:
