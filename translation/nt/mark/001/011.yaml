id: MRK.1.11
reference: Mark 1:11
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
translation:
  text: 'A voice came from the heavens: “You are my beloved Son; with you I am well pleased[a].”'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The declaration echoes Psalm 2:7 and Isaiah 42:1.
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  chosen: a voice came
  alternatives:
  - a voice came forth
  - a voice happened
  - there came a voice
  lexicon: BDAG
  rationale: 'The idiom ἐγένετο with a nominative subject is naturally rendered as an event occurring: ''a voice came.'' This is more idiomatic in modern English than the overly literal ''a voice happened'' while preserving the narrative force.'
- source_word: ἐκ τῶν οὐρανῶν
  chosen: from the heavens
  alternatives:
  - from heaven
  - out of the heavens
  lexicon: BDAG
  rationale: The Greek is plural, 'the heavens.' The translation preserves the plural form rather than smoothing to the traditional singular 'heaven,' since original-language primacy favors retaining the source wording where English remains natural.
- source_word: Σὺ εἶ
  chosen: You are
  alternatives:
  - You are indeed
  lexicon: BDAG
  rationale: The explicit pronoun adds directness and emphasis, but standard English conveys this adequately with 'You are' without needing an added adverb.
- source_word: ὁ υἱός μου
  chosen: my Son
  alternatives:
  - the Son of me
  lexicon: BDAG
  rationale: This is the natural English rendering of the articular noun with possessive pronoun. Capitalizing 'Son' reflects its use here as a direct divine address to Jesus with christological significance, not merely a generic filial reference.
- source_word: ὁ ἀγαπητός
  chosen: beloved
  alternatives:
  - dearly loved
  - the beloved
  - the one I love
  lexicon: BDAG
  rationale: 'ἀγαπητός commonly means ''beloved'' or ''dearly loved.'' ''Beloved'' is concise, natural, and preserves the solemn register of the divine declaration. The article is absorbed idiomatically in English: ''my beloved Son.'''
- source_word: ἐν σοὶ
  chosen: in you
  alternatives:
  - with you
  lexicon: BDAG
  rationale: The preposition ἐν is most directly 'in.' Although some English versions use 'with you' for idiomatic reasons, 'in you' more closely reflects the Greek and remains understandable in English.
- source_word: εὐδόκησα
  chosen: I am well pleased
  alternatives:
  - I have taken delight
  - I delighted
  - I was well pleased
  lexicon: BDAG
  rationale: 'The aorist can be rendered in English with a present stative expression in this declaration formula: ''I am well pleased.'' This preserves the sense of divine approval in idiomatic English and aligns with the utterance''s present force. A more strictly past rendering (''I was well pleased'') is possible but sounds less natural in this context.'
