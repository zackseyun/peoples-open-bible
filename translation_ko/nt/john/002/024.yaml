id: JHN.2.24
reference: John 2:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: αὐτὸς ⸀δὲ Ἰησοῦς οὐκ ἐπίστευεν ⸀αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας
base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
  footnotes:
  - marker: a
    text: 'The Greek uses the same verb as in the previous verse: many ''believed in'' Jesus, but Jesus did not ''entrust himself to'' them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 예수님께서는 친히 그들에게 자신을 맡기지 않으셨습니다[a]. 이는 모든 사람을 알고 계셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 앞 절과 여기에서 같은 동사(πιστεύω)를 사용합니다. 앞 절에서 많은 사람이 예수를 ‘믿었다’고 한 것과 달리, 여기에서는 예수님께서 그들에게 자신을 ‘맡기지 않으셨다’고 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  english_pob_choice: But Jesus himself
  chosen_korean: 그러나 예수 자신은
  alternatives_korean:
  - 그러나 예수는
  - 그때 예수 자신은
  lexicon: BDAG
  rationale: αὐτός는 주격에서 강조를 나타내므로 '자신'을 살려 대비를 유지했습니다. δέ는 역접을 나타내어 '그러나'로 번역했습니다.
- source_word: ἐπίστευεν
  english_pob_choice: was not entrusting
  chosen_korean: 자신을 맡기지 않으셨다
  alternatives_korean:
  - 믿지 않으셨다
  - 자신을 맡기지 않았다
  lexicon: BDAG
  rationale: πιστεύω가 여기서는 목적어(자신)와 함께 쓰여 '자신을 맡기다/신뢰하다'의 의미를 주므로 '자신을 맡기지 않으셨다'로 옮겼습니다. 미완료형의 지속·성향을 반영해 '-지 않으셨다' 형태를 선택했습니다.
- source_word: αὑτὸν αὐτοῖς
  english_pob_choice: himself to them
  chosen_korean: 자신을 그들에게
  alternatives_korean:
  - 자신을 그 사람들에게
  - 자신을 그들에게로
  lexicon: BDAG
  rationale: 재귀 대명사와 여격 대상은 개인적 자기 위임을 나타냅니다. 한국어에서도 재귀 표현 '자신을 그들에게'로 그 구조와 말장난을 보존했습니다.
- source_word: διὰ τὸ αὐτὸν γινώσκειν πάντας
  english_pob_choice: he knew all people
  chosen_korean: 이는 그가 모든 사람을 알고 계셨기 때문이다
  alternatives_korean:
  - 그 이유는 그가 모든 사람을 알았기 때문입니다
  - 왜냐하면 그가 모든 사람을 알고 있었기 때문입니다
  lexicon: BDAG
  rationale: διά + 정관사 + 부정사는 인과를 나타냅니다. γινώσκειν의 인격적 지식을 한국어로 자연스럽게 '알고 계셨다'로 옮겼고, 'πάντας'는 문맥상 '모든 사람'으로 번역했습니다.
theological_decisions:
- issue: Rendering of πιστεύω across Jn 2:23–24
  chosen_reading: 앞 절에서는 '믿었다', 이 절에서는 동사의 의미를 살려 '자신을 맡기다' 계열로 번역하여 그 어휘적 연결을 보존합니다.
  alternative_readings:
  - 두 절 모두에서 동일하게 '믿었다'로 번역한다
  - 이 절에서도 단순히 '믿지 않았다'로 번역한다
  rationale: 그리스어 원문은 동일한 동사를 사용해 의도적 어휘 놀이를 만듭니다(많은 이들이 예수를 믿었으나 예수는 자신을 맡기지 않았다). 한국어는 이중 의미를 동시에 살리기 어려워, 어휘적 연결을 주석으로 문서화하면서 의미상 적절한 '자신을 맡기다' 어구를 사용했습니다.
  doctrine_reference: 'Translation philosophy #5 (consistency of key terms, or documented exception)'
- issue: Scope of πάντας
  chosen_reading: '''모든 사람''으로 번역하여 인류 일반에 대한 포괄적 지식을 표현합니다.'
  alternative_readings:
  - '''모두'','
  - '''모든 이들'''
  rationale: 문맥은 특정 집단을 한정하지 않고 예수의 전반적 인식 능력을 말하므로 '모든 사람'이 정확하고 자연스럽습니다.
  doctrine_reference: 'Translation philosophy #4 (gender-accurate over gender-neutral)'
