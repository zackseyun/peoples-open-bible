review_pass:
  verdict: revise
  source_fidelity: 히브리어의 반복(‘그것이 올 때/오면—보라, 그것이 오고 있다’)과 결론(‘그들이 알 것이다’)은 대체로 잘 반영되었습니다. 다만 וְ의 단순한 결과 연결을 ‘그제야’로 옮기면 ‘그때에야/오직 그때’라는 제한적 강조가 더해집니다. 또한 ‘보십시오’는 독자에게 직접 명령하는 형태여서 הִנֵּה의 주의 환기 감탄사보다 화자·청자의 관계를 다소 구체화합니다.
  naturalness: 수정문은 현대 표준어의 합쇼체 문맥에 맞고, 대시로 둘러싼 예언적 삽입 강조도 자연스럽습니다. ‘그들 가운데’가 ‘자기들 가운데’보다 문어적 성경 번역 문맥에서 더 중립적입니다.
  terminology: ‘예언자’는 נָבִיא에 적절합니다. ‘그들 가운데’는 בְתוֹכָם의 공동체 내부성을 충실하게 보존합니다.
  issues:
  - severity: medium
    issue: ‘그제야’가 원문보다 제한적·지연된 인식의 뉘앙스를 더합니다.
    rationale: וְיָדְעוּ는 앞 절의 사건 뒤에 이어지는 결론을 나타내지만, ‘그제야’에 담긴 ‘오직 그때에야’의 강조가 문법적으로 명시되지는 않습니다.
  - severity: low
    issue: ‘보십시오’는 הִנֵּה를 독자에게 향한 직접 명령처럼 들리게 합니다.
    rationale: הִנֵּה는 본문 안에서 ‘보라/보십시오’라는 주의 환기 표현이지만, 한국어 ‘보십시오’는 현대 대화에서 청자에게 실제로 보라고 권하는 느낌을 줄 수 있습니다. ‘보라’는 예언적 감탄사의 관습적 기능을 더 직접 보존합니다.
  - severity: low
    issue: ‘자기들 가운데’는 불필요한 재귀적·구어적 뉘앙스를 냅니다.
    rationale: בְתוֹכָם은 단순히 ‘그들 가운데’이며, 재귀성이나 소유 강조가 없습니다.
  revised_text: 그것이 오면—보라, 그것이 오고 있습니다—그러면 그들은 그들 가운데 한 예언자가 있었다는 것을 알게 될 것입니다.
