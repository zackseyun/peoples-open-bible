review_pass:
  verdict: revise
  source_fidelity: ‘בַּקֹּדֶשׁ’는 이 절에서 일반적으로 ‘거룩한 곳/성소’를 뜻하며, 본문 자체만으로 ‘지성소’로 한정하지 않습니다. 초안의 ‘지성소’는 해석을 앞서가므로 ‘성소’로 고쳐야 합니다. 또한 출입 금지의 시간 범위를 한 문장 안에서 명확히 연결하는 편이 원문의 수식 관계를 더 잘 반영합니다.
  naturalness: ‘아무도 회막 안에 있지 못해야 합니다’보다 ‘아무도 회막 안에 있어서는 안 됩니다’가 현대 표준 한국어의 금지 표현으로 자연스럽습니다. 시간 절을 앞에 두어 문장 흐름도 자연스럽게 다듬었습니다.
  terminology: ‘회막’과 ‘속죄’는 제의 문맥에 적절합니다. ‘성소’는 히브리어 קֹדֶשׁ의 범위를 보존하며, 특정 구획인 ‘지성소’로 좁히지 않습니다. אָדָם은 한국어에서 성별을 특정하지 않는 ‘아무도’로 자연스럽게 옮길 수 있습니다.
