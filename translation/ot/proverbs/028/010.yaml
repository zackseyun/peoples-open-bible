  from: Whoever leads the upright astray in an evil way will himself fall into his own pit[a], but the blameless will inherit good.
  to: Whoever leads the upright astray onto an evil path will himself fall into his own pit,[a] but the blameless will inherit good.
  rationale: “In an evil way” is awkward and can describe the manner of misleading rather than the harmful course into which the upright are misled. “Onto an evil path” preserves דרך’s concrete image and communicates the construction naturally. The retained “pit” preserves the proverb’s trap imagery, with the alternative sense properly noted.
