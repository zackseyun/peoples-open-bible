review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘귀한 사람’은 히브리어 חֵרֵשׁ(듣지 못하는 사람/농인)를 잘못 옮긴 것으로, 핵심 대상이 바뀌었습니다. 또한 מִכְשֹׁל은 넘어지게 하는 물건이므로 ‘장애물’보다 ‘걸림돌’이 더 직접적입니다. 마지막 선언은 야훼의 자기선언으로 정확히 유지해야 합니다.
  naturalness: ‘듣지 못하는 사람’과 ‘보지 못하는 사람’은 현대 표준 한국어에서 존중을 갖춘 자연스러운 표현입니다. 합쇼체 명령형과 종결형을 일관되게 적용했습니다.
  terminology: ‘저주하다’, ‘걸림돌’, ‘경외하다’, ‘야훼’는 원문의 어휘와 성경적 문맥을 충실히 반영합니다. 히브리어의 남성 단수는 대표적 법률 사례이지만, 한국어 ‘사람’은 성별을 문법적으로 표시하지 않는 자연스러운 일반 표현입니다.
  issues:
  - severity: high
    issue: ‘귀한 사람’
    rationale: חֵרֵשׁ는 ‘귀한’이라는 뜻이 아니라 ‘듣지 못하는, 귀먹은’이라는 뜻입니다. 현 초안은 명령의 보호 대상을 전혀 다른 의미로 바꿉니다.
  - severity: medium
    issue: ‘장애물’
    rationale: מִכְשֹׁל은 특히 사람이 걸려 넘어지게 하는 물건 또는 걸림돌을 가리킵니다. ‘걸림돌’이 본문의 구체적 이미지를 더 잘 보존합니다.
  - severity: low
    issue: 문체 불일치
    rationale: 지정된 현대 합쇼체에 맞추어 명령을 ‘-십시오’로, 종결 선언을 ‘-입니다’로 통일하는 것이 적절합니다.
  revised_text: 듣지 못하는 사람을 저주하지 말고, 보지 못하는 사람 앞에 걸림돌을 놓지 마십시오. 당신의 하나님을 경외하십시오. 나는 야훼입니다.
  revised_footnotes:
  - marker: a
    text: 히브리어는 ‘듣지 못하는 남자’와 ‘보지 못하는 남자’라는 남성 단수형을 대표적인 법률 사례로 사용합니다.
    reason: 원문의 남성 단수 대표 용례를 밝혀 한국어의 성별 비표지 ‘사람’이 원문 형태를 임의로 신학화하거나 제한한 것이 아님을 명시합니다.
  revision_rationale: 원문의 보호 대상인 듣지 못하는 사람과 보지 못하는 사람을 정확히 복원하고, 문자적으로 넘어지게 하는 ‘걸림돌’의 이미지를 유지했습니다. 하나님의 이름 야훼와 하나님을 경외하라는 동기 절도 보존했으며, 전체 문체를 현대 표준 한국어 합쇼체로 정리했습니다.
