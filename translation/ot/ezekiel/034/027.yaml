  from: The tree of the field will give its fruit[a], and the land will give its produce, and they will be secure on their land. Then they will know that I am Yahweh, when I break the bars of their yoke and deliver them from the hand of those who enslaved them.
  to: The trees of the field will bear their fruit, and the land will yield its produce; my people will be secure on their own land. Then they will know that I am Yahweh when I break the bars of their yoke and deliver them from the power of those who enslave them.
  rationale: I retain the yoke image and the strong sense of enslavement defended in the lexical record. I depart from its preference for a singular 'tree' and literal 'hand' because the collective and power idioms are clearer in natural English.
