  terminology: ‘짐/부담’은 נִכְבַּד עָלֶיךָ의 비유적 의미를 적절히 전달합니다. וַיְבָרֲכֵהוּ는 해석적으로 약화하지 않고 ‘복을 빌어 주었습니다’로 옮겨 축복 행위를 유지했습니다.
