  text: καὶ νῦν τοῦτό ἐστιν ὅσα ἀξιῶ, κύριε βασιλεῦ, καὶ ὃ αἰτοῦμαί σε, καὶ αὕτη ἐστὶν ἡ μεγαλωσύνη ἡ παρὰ σοῦ· δέομαι οὖν ἵνα ποιήσῃς τὴν εὐχὴν ἣν ηὐξάμην τῷ βασιλεῖ τοῦ οὐρανοῦ ποιῆσαι ἐκ στόματός σου.
