    text: ‘독수리들’은 히브리어 נְשָׁרִים의 전통적 번역입니다. 이 말은 더 넓게는 큰 맹금류나 썩은 고기를 먹는 큰 새를 가리킬 수도 있습니다.
    reason: lexical_alternative
