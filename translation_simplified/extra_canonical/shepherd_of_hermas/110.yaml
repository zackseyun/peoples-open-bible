  yaml_path: translation/extra_canonical/shepherd_of_hermas/110.yaml
  text: '“I, the shepherd, the messenger of repentance, have shown and spoken to God’s servants all these
    things written above. If, then, you believe, listen to my words, walk in them and correct your ways,
    you will be able to live. But if you persist in wickedness and grudges, no one of that kind will live
    to God. I have told you everything I was to say.”


    2. The shepherd himself said to me, “Have you asked me everything?” I said, “Yes, sir.” “Why, then,
    did you not ask me about the marks on the stones placed in the structure, and why we filled in those
    marks?[a]” I said, “I forgot, sir.”


    3. “Now hear about them,” he said. “These are the people who have now heard my commandments and repented
    with all their hearts. When the Lord saw that their repentance was good and pure and that they could
    remain in it, he ordered their former sins to be erased. These marks were their sins, and they were
    smoothed away so they would not appear.”'
