  source_fidelity: 본문은 καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ의 두 동작, τί οὖν의 이유를 묻는 용법, 현재형 βαπτίζεις, 그리고 세 인물에 대한 병렬 부정을 충실히 반영합니다. 다만 서술 도입부는 ‘물어 말했습니다’가 두 그리스어 동사를 보존하면서도 더 자연스럽습니다.
  naturalness: 합쇼체와 직접화법은 적절합니다. ‘메시아도 아니고 … 아니라면’의 조건절과 ‘왜 세례를 베푸십니까?’는 현대 표준어에서 자연스럽습니다. 각주에는 비일관적인 ‘메시야’ 표기와 다소 어색하고 중복적인 설명이 있어 다듬는 것이 좋습니다.
  terminology: ‘메시아’, ‘엘리야’, ‘그 예언자’, ‘세례를 베푸십니까’는 모두 적절합니다. ‘그 예언자’는 관사가 가리키는 특정 기대 인물의 뉘앙스를 보존하며, 각주에서는 이를 단정하지 않고 ‘보입니다’로 처리해야 합니다.
