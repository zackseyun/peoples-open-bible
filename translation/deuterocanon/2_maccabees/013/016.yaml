lexical_decisions:
- source_word: τὸ τέλος
  chosen: in the end
  alternatives:
  - at last
  - finally
  lexicon: LSJ
  rationale: Idiomatic temporal expression marking the outcome of the action; 'in the end' preserves the narrative sense without over-literal awkwardness.
- source_word: παρεμβολήν
  chosen: camp
  alternatives:
  - encampment
  - army camp
  lexicon: LSJ
  rationale: In military context the noun refers to the camp or encamped force. 'Camp' is the most natural concise rendering in English.
- source_word: δέους
  chosen: fear
  alternatives:
  - dread
  - terror
  lexicon: LSJ
  rationale: The genitive with ἐπλήρωσαν expresses what the camp was filled with. 'Fear' is broad and natural; 'terror' would over-intensify beyond what the noun itself requires.
- source_word: ταραχῆς
  chosen: confusion
  alternatives:
  - disturbance
  - tumult
  - panic
  lexicon: LSJ
  rationale: The term denotes agitation or disorder. 'Confusion' pairs well with 'fear' and fits the military setting without forcing the more specific 'panic'.
- source_word: ἐπλήρωσαν
  chosen: filled
  alternatives:
  - filled up
  - caused to be full of
  lexicon: LSJ
  rationale: Straightforward rendering of the verb; the object is the camp and the genitives indicate the contents.
- source_word: ἐξέλυσαν
  chosen: withdrew
  alternatives:
  - departed
  - broke camp
  - retired
  lexicon: LSJ
  rationale: In context the verb indicates departure after the successful action. 'Withdrew' fits a military movement better than the more generic 'departed.'
- source_word: εὐημεροῦντες
  chosen: in good order
  alternatives:
  - successfully
  - prosperously
  - in high spirits
  lexicon: LSJ
  rationale: Literally the participle can suggest prospering or faring well. In this military narrative, attached to their withdrawal, it most plausibly conveys that they came away safely and advantageously. 'In good order' expresses a successful, unharmed withdrawal in idiomatic English without sounding financially 'prosperous'.
