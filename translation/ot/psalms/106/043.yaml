  to: Many times he delivered them, but they rebelled by following their own plans and were brought low by their iniquity[a].
  rationale: The latest substantive review supports “rebelled” and “were brought low,” which I retain; no MAINTAINER revision is recorded. I depart from its preference for “in their counsel” because that wording obscures the meaning in contemporary English.
