id: JOB.27.22
reference: Job 27:22
source:
  edition: WLC
  text: וְ/יַשְׁלֵ֣ךְ עָ֭לָי/ו וְ/לֹ֣א יַחְמֹ֑ל מִ֝/יָּד֗/וֹ בָּר֥וֹחַ יִבְרָֽח׃
translation:
  text: It hurls itself against him[a] without pity; he flees headlong from its hand[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “it hurls against him”; the object is unstated.
    reason: lexical_alternative
  - marker: b
    text: Some understand God, rather than the east wind, as the unstated subject of the attack.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַשְׁלֵךְ
  chosen: hurls himself at
  alternatives:
  - casts at
  - throws himself against
  - casts himself upon
  lexicon: HALOT
  rationale: 'The Hiphil of שלך commonly means ''throw/cast.'' With עָלָיו (''upon/against him'') and in this violent judgment context, the sense is best rendered as an aggressive action directed at the wicked man: ''hurls himself at him.'' English supplies ''himself'' idiomatically to express the hostile onset of the unnamed subject. A more wooden ''casts at him'' is possible but less natural and less clear.'
- source_word: עָלָיו
  chosen: at him
  alternatives:
  - upon him
  - against him
  lexicon: HALOT
  rationale: The preposition עַל with hostile motion can mean 'upon' or 'against.' In idiomatic modern English after 'hurls himself,' 'at him' communicates the attack clearly. 'Against him' is also viable and is preserved as an alternative nuance.
- source_word: וְלֹא יַחְמֹל
  chosen: without pity
  alternatives:
  - and has no pity
  - and does not show compassion
  lexicon: HALOT
  rationale: This naturally conveys the attacking force’s merciless action.
- source_word: מִיָדוֹ
  chosen: from its hand
  alternatives:
  - from his power
  - from his grasp
  lexicon: HALOT
  rationale: The possessive is coordinated with the contextually understood east wind, while “hand” preserves the Hebrew personification.
- source_word: בָּרוֹחַ יִבְרָח
  chosen: he flees headlong
  alternatives:
  - he flees headlong
  - he flees in haste
  - fleeing, he flees
  lexicon: HALOT
  rationale: The infinitive absolute intensifies the flight. “Headlong” gives idiomatic English urgency without the misleading certainty of “surely” or the calque “fleeing, he flees.”
- source_word: וְיַשְׁלֵךְ עָלָיו
  chosen: It hurls itself against him
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: The east wind of verse 21 is the most immediate contextual subject. The reflexive object is not expressed in Hebrew but completes the otherwise elliptical construction in English, so it is disclosed in a note.
