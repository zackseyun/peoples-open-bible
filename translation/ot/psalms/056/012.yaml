id: PSA.56.12
reference: Psalms 56:12
source:
  edition: WLC
  text: עָלַ֣/י אֱלֹהִ֣ים נְדָרֶ֑י/ךָ אֲשַׁלֵּ֖ם תּוֹדֹ֣ת לָֽ/ךְ׃
translation:
  text: I am bound by vows to you, O God; I will render thank offerings[a] to you.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “thanksgivings” or “songs of thanks.”
    reason: alternative_reading
lexical_decisions:
- source_word: עָלַי
  chosen: I am bound
  alternatives:
  - are on me
  - rest on me
  - bind me
  - are upon me
  lexicon: HALOT
  rationale: The idiom says the obligation lies upon the speaker. 'I am bound' expresses that obligation naturally.
- source_word: אֱלֹהִים
  chosen: O God
  alternatives:
  - God
  lexicon: HALOT
  rationale: Here אֱלֹהִים is a direct address in the verse, so 'O God' makes the vocative force explicit in natural English.
- source_word: נְדָרֶיךָ
  chosen: by vows to you
  alternatives:
  - vows to you
  - my vows to you
  - Your vows
  lexicon: HALOT
  rationale: 'The suffix marks the recipient of the vows: vows made to God, not vows made by God.'
- source_word: אֲשַׁלֵּם
  chosen: I will render
  alternatives:
  - I will pay
  - I will fulfill
  - I will repay
  lexicon: HALOT
  rationale: With offerings or thanks, 'render' naturally expresses fulfilling what is owed.
- source_word: תּוֹדוֹת
  chosen: thank offerings
  alternatives:
  - thanksgivings
  - songs of thanks
  - praises
  lexicon: HALOT
  rationale: The plural noun can denote acts or offerings of thanksgiving. In parallel with vows and the verb 'repay,' a sacrificial nuance is likely, so 'thank offerings' best captures the cultic sense while remaining readable.
- source_word: לָךְ
  chosen: to you
  alternatives:
  - for you
  lexicon: HALOT
  rationale: The preposition ל marks the indirect object/recipient. 'To you' is the most direct rendering. Although the morphology table marks a feminine suffix, the context and preceding masculine suffix indicate the addressee is God; this is best understood as a pointing/analyzing irregularity rather than a change in referent.
