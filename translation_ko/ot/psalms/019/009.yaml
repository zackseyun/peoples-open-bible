  lexicon: HALOT
  rationale: פִּקּוּדִים은 시편 19편의 율법어군 가운데 하나로, 단순한 일반 지시보다 하나님의 특정한 규범적 지시를 가리킵니다. 한국어 '증거들'은 시편의 병행어법 속에서 하나님의 규범적 선언이라는 성격을 살리면서도, 바로 뒤의 '계명'과 구별되는 항목으로 읽히게 합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms / established POB glossary
  rationale: 본문의 신명은 대체 칭호가 아니라 고유명사로 처리해야 하므로, POB 기준에 따라 '야훼'로 옮겼습니다. 이렇게 해야 본문이 언약의 이름을 직접 드러내며, 시편의 찬양 어조도 유지됩니다.
- source_word: מְשַׂמְּחֵי לֵב
  english_pob_choice: rejoicing the heart
  chosen_korean: 마음을 기쁘게 하고
  alternatives_korean:
  - 마음을 즐겁게 하고
  - 마음을 환하게 하고
  - 마음을 기쁘게 하는
  lexicon: HALOT
  rationale: 분사구는 지속적 효과를 나타내므로, 한국어에서도 결과를 드러내는 동사구로 자연스럽게 살렸습니다. '마음'은 히브리어 לֵב의 인지·의지까지 포괄하는 관용적 대응으로 충분합니다.
- source_word: בָּרָה
  english_pob_choice: pure
  chosen_korean: 순수하여
  alternatives_korean:
  - 깨끗하여
  - 맑아
  - 명료하여
  lexicon: HALOT
  rationale: 히브리어 형용사의 기본 의미는 정결함·순수함입니다. 영어 POB가 각주로 'clear' 가능성을 열어 두었지만, 본문에서는 의미의 핵심을 보존하는 '순수하여'를 택하고, 그 결과로 뒤의 '눈을 밝게 합니다'와의 평행을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 시편의 율법어군을 한국어에서 어떻게 구분할 것인가
  chosen_reading: '''증거들''과 ''계명''을 구분해 번역하여, שני 개념의 병행성을 유지했습니다.'
  alternative_readings:
  - 둘 다 '율법'으로 통합
  - '''법도''와 ''계명''으로 번역'
  rationale: 본문은 פִּקּוּדֵי와 מִצְוַת을 나란히 두어 의미 차이를 형성합니다. 한국어에서 둘을 하나로 뭉개면 시적 평행과 어휘 대비가 약해지므로, 서로 다른 낱말로 구분해 읽히게 했습니다.
  doctrine_reference: 시편 19편의 토라 어휘 병행 구조
