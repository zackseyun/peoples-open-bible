    reason: lexical_alternative
translation:
  language: ko
  text: 지휘자를 위하여. “먼 곳의 잠잠한 비둘기” 곡조에 맞추어[a]. 다윗의 믹담[b]. 블레셋 사람들이 그를 가드에서 붙잡았을 때.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 “먼 곳의 잠잠한 비둘기”로 옮길 수 있으나, 다른 곡조 제목일 수도 있으며 정확한 뜻은 확실하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 믹담은 시편 표제에 나오는 기술 용어로, 정확한 뜻은 확실하지 않습니다.
    reason: lexical_alternative
