  meaning_decisions:
  - source_phrase: אֵל מוֹצִיאוֹ מִמִּצְרַיִם
    prior_rendering: God brings him out of Egypt
    new_rendering: God brought him out of Egypt
    rationale: The participle identifies God by his deliverance of Israel; English past tense clearly locates the exodus already experienced by the people.
  - source_phrase: כְּתוֹעֲפֹת רְאֵם לוֹ
    prior_rendering: he has for him the horns of a wild ox
    new_rendering: and is his strength, like the horns of a wild ox
