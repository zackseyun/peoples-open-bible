  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005.yaml
  text: 'And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as my husband.”


    2 So when I heard this, I tore my garments and said to her, “Woman, be ashamed before God, and do not do this lawless and evil deed, lest you be destroyed. For know this also: I will report your scheme to everyone.”


    3 Then she, being afraid, begged me not to report this scheme.


    4 And she went away, trying to win me over with gifts and every kind of pleasure.'
translation:
  language: ko
  text: '그리고 다시, 또 다른 때에 그녀가 내게 말했습니다. “네가 간음하기를 원하지 않는다면, 나는 내 남편을 독으로 죽이고 너를 내 남편으로 삼겠습니다.”


    2 내가 이 말을 듣고 내 옷을 찢고 그녀에게 말했습니다. “여인이여, 하나님 앞에서 부끄러워하십시오. 이 악한 일을 하지 마십시오. 그렇게 하지 않으면 당신은 멸망할 것입니다. 또한 이것을 알아 두십시오. 나는 당신의 이 계책을 모든 사람에게 알리겠습니다.”


    3 그러자 그녀는 두려워하여, 이 계책을 알리지 말아 달라고 내게 간청했습니다.


    4 그녀는 선물과 온갖 즐거움으로 나의 환심을 사려 하면서 떠나갔습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεῦσαι
  english_pob_choice: commit adultery
  chosen_korean: 간음하기
  alternatives_korean:
  - 음행하기
  - 간음하다
  lexicon: μοιχεύω
  rationale: 배우자에 대한 성적 배신을 가리키는 직접적 표현이므로, POB의 ‘commit adultery’를 반영해 ‘간음하기’로 옮겼습니다.
- source_word: φαρμάκῳ
  english_pob_choice: with poison
  chosen_korean: 독으로
  alternatives_korean:
  - 약으로
  - 독약으로
  lexicon: φάρμακον
  rationale: 문맥상 남편을 죽이기 위한 수단이므로 ‘독’이 가장 자연스럽고 직역에 가깝습니다.
- source_word: αἰδέσθητι τὸν Θεόν
  english_pob_choice: be ashamed before God
  chosen_korean: 하나님 앞에서 부끄러워하십시오
  alternatives_korean:
  - 하나님을 두려워하십시오
  - 하나님을 부끄럽게 여기십시오
  lexicon: αἰδέομαι + Θεός
  rationale: POB의 선택처럼 단순한 ‘두려워하다’보다 도덕적 수치와 절제의 요청이 분명하므로 ‘부끄러워하십시오’를 택했습니다.
- source_word: πρᾶξιν ταύτην τὴν πονηράν
  english_pob_choice: this lawless and evil deed
  chosen_korean: 이 불법하고 악한 일
  alternatives_korean:
  - 이 악한 행위
  - 이 불법한 행위
  lexicon: πρᾶξις + πονηρός
  rationale: 두 형용사의 병렬을 살려 ‘불법하고 악한’으로 옮겼고, ‘행위’보다 문맥상 자연한 ‘일’을 사용했습니다.
- source_word: ἐπίνοιαν
  english_pob_choice: scheme
  chosen_korean: 계책
  alternatives_korean:
  - 음모
  - 꾀
  lexicon: ἐπίνοια
  rationale: 그녀의 계획된 살해·유혹의 의도를 드러내는 말이므로, 중립적이면서도 계산된 의도를 담는 ‘계책’이 적절합니다.
theological_decisions:
- issue: 부끄러움/두려움의 뉘앙스
  chosen_reading: ‘αἰδέσθητι τὸν Θεόν’을 ‘하나님 앞에서 부끄러워하십시오’로 옮겨, 단순한 공포가 아니라 하나님의 임재 앞에서의 도덕적 수치와 책임을 드러냈습니다.
  alternative_readings:
  - 하나님을 두려워하십시오
  - 하나님을 경외하십시오
  rationale: 문맥상 요셉이 간음과 살인의 계획을 제지하며 윤리적 수치를 촉구하므로, ‘경외’보다 ‘부끄러움’이 원문의 압박감을 더 잘 보존합니다.
  doctrine_reference: 성화와 윤리적 권면의 문맥
- issue: 직접 화법의 인격적 호칭
  chosen_reading: 여성에게 직접 말하는 대목을 ‘여인이여’로 정중하게 살리되, 명령형은 합쇼체로 유지했습니다.
  alternative_readings:
  - 여자여
  - 부인
  rationale: 원문의 γύναι를 너무 현대적으로 약화시키지 않으면서도 한국어 독자에게 부자연스럽지 않게 정중한 호칭으로 옮겼습니다.
  doctrine_reference: 서사체 직접화법의 수사적 전달
