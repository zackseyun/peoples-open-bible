revisions:
- from: 하나님, 주님의 길은 거룩함 안에 있습니다. 누구가 하나님과 같은 위대한 신이겠습니까?[a]
  to: 주님은 놀라운 일을 행하시는 하나님이십니다. 주님께서는 민족들[a] 가운데 주님의 능력[b]을 알리셨습니다.
  rationale: 대상 히브리어 본문과 영어 POB 감사 기록에 맞추어 본문 전체를 교체했습니다. ‘놀라운 일을 행하시는’은 עֹשֵׂה פֶלֶא의 지속적·특성적 행동과 פֶלֶא의 단수 집합적 의미를 자연스럽게 반영합니다. הוֹדַעְתָּ의 완료된 사역형은 ‘알리셨습니다’로, בָעַמִּים은 ‘민족들 가운데’로 옮겼습니다. 원문에 없는 성소/거룩함 관련 각주는 제거하고, 실제 원문의 어휘적 범위에 대한 각주를 본문 앵커와 일치시켰습니다.
  reviewer_model: gpt-5.6-terra
