  from: It is as high as the heavens—what can you do? Deeper than Sheol—what can you know?[a]
  to: It is as high as the heavens—what can you do? Deeper than Sheol[a]—what can you know?
  rationale: The latest audit's correction from 'higher than' to 'as high as' respects the different Hebrew constructions in the two halves. I retain that gain and the cosmic imagery, while shortening the Sheol note to its essential explanation.
