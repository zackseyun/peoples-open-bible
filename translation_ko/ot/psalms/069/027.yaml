translation:
  language: ko
  text: 그들의 죄악 위에 죄악을 더하시고,[a] 그들이 주의 의에 이르지 못하게 하소서.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘죄악’은 ‘죄책’ 또는 ‘죄악의 결과’를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주의 의’는 문맥상 ‘주의 정의’ 또는 주님의 의로운 구원 행위를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그들이
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞절의 이유를 잇는 인과를 한국어에서는 자연스럽게 주어를 앞세운 서술로 풀어 주었습니다.
- source_word: אַתָּה אֲשֶׁר הִכִּיתָ
  english_pob_choice: the one you struck
