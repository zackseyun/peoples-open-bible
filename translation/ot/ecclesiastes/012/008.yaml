  chosen_reading: vapor
  alternative_readings:
  - vanity
  - futility
  - breath
  rationale: This is primarily a lexical and literary decision rather than a doctrinal one, but it significantly shapes interpretation. 'Vapor' best preserves the metaphorical texture of Ecclesiastes and avoids resolving the term into a single abstract concept such as moral vanity or philosophical futility. This preserves the book's tension and multivalence.
