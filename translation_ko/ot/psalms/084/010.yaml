  rationale: 대상 본문과 무관한 84:9의 번역을 84:10의 히브리어 본문에 맞게 전면 교체했습니다. מֵאָלֶף의 생략된 비교 대상을 본문에서 해석적으로 보충하지 않았고, בָּחַרְתִּי와 הִסְתּוֹפֵף의 가능한 뉘앙스는 각주에서 제시했습니다. ‘문지기’라는 직책은 본문에 명시되지 않으므로 본문에는 넣지 않았습니다.
