  rationale: 'The draft omits two entire clauses present in the Syriac text: ''Or
    who can search out the depth of your way? Or who can calculate the weight of your
    path?'' (aw manw bsa ''umqa d-urkakh, aw manw khashab tuqla d-shbilakh). Note:
