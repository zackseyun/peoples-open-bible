id: PSA.91.2
reference: Psalms 91:2
source:
  edition: WLC
  text: אֹמַ֗ר לַֽ֭/יהוָה מַחְסִ֣/י וּ/מְצוּדָתִ֑/י אֱ֝לֹהַ֗/י אֶבְטַח בּֽ/וֹ־׃
translation:
  text: I will say to Yahweh, “You are my refuge and my fortress, my God, in whom I trust.”
  philosophy: dynamic
lexical_decisions:
- source_word: אֹמַר
  chosen: I will say
  alternatives:
  - I will say
  - I say
  lexicon: HALOT
  rationale: The Qal imperfect is best expressed as a future declaration here. 'I will say' preserves the Hebrew verbal form and the psalm's forward-looking sequence; the present-tense confessional sense remains possible.
- source_word: לַיהוָה
  chosen: to Yahweh
  alternatives:
  - of Yahweh
  - concerning Yahweh
  - to the LORD
  lexicon: HALOT
  rationale: 'The lamed most naturally marks the addressee here: ''to Yahweh.'' A reference sense (''of/concerning Yahweh'') is possible, but the direct confession and the project''s divine-name policy favor ''to Yahweh.'''
- source_word: יהוה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The translation makes the personal divine name visible as 'Yahweh'; the traditional substitute 'the LORD' is preserved in the footnote.
- source_word: מַחְסִי
  chosen: my refuge
  alternatives:
  - my shelter
  lexicon: HALOT
  rationale: מַחְסֶה denotes a place of refuge or shelter. 'My refuge' is the more established and precise English equivalent in psalmic protection imagery.
- source_word: וּמְצוּדָתִי
  chosen: and my fortress
  alternatives:
  - and my stronghold
  lexicon: HALOT
  rationale: מְצוּדָה refers to a stronghold or fortress. 'Fortress' pairs well with 'refuge' and preserves the defensive military imagery.
- source_word: אֱלֹהַי
  chosen: my God
  lexicon: HALOT
  rationale: 'The 1cs suffix makes the personal confession explicit: ''my God.'' This is straightforward and should remain direct.'
- source_word: אֶבְטַח
  chosen: I trust
  alternatives:
  - I will trust
  lexicon: HALOT
  rationale: Qal imperfect 1cs of בטח expresses trust/confidence. In this confessional context, English present 'I trust' best conveys the psalmist's settled reliance; future 'I will trust' is possible but less natural here.
- source_word: בּוֹ
  chosen: in whom
  alternatives:
  - in him
  lexicon: HALOT
  rationale: The preposition plus 3ms suffix means 'in him.' Because the clause modifies 'my God' directly in English, 'in whom I trust' is smoother and more idiomatic while preserving the same referent and sense.
