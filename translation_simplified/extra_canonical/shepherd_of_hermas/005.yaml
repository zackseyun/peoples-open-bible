translation:
  text: 'I.1. As I was going to Cumae[a] at the same season as the year before, I remembered last year’s
    vision as I walked. A spirit[b] lifted me again and carried me to the same place as the year before.


    I.2. When I came to the place, I knelt down[c] and began to pray to the Lord and glorify his name,
    because he had counted me worthy and had made known to me my former sins.


    I.3. After I rose from prayer, I saw the old woman whom I had also seen last year[h]. She was walking
    and reading a little book[d]. She said to me, “Can you announce these things to the elect of God[f]?”
    I said to her, “Lady, I cannot remember so many things. Give me the little book so that I may copy
    it.” “Take it,” she said, “and you will give it back to me[g].”


    I.4. I took it and withdrew to a spot in the field. There I copied everything letter for letter, because
    I could not make out the syllables[e]. When I finished writing the letters of the book, suddenly the
    little book was snatched from my hand. I did not see who took it.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cumae is the conventional name used for working Koumas. Athos Plate I and Sinaiticus5.1 spell
      komas, which also permits a villages interpretation. Vulgata printed8 has Cumis and Palatina printed17
      has the region of the Cumaeans. D’Abbadie1860’s Latin rendering of Ethiopic printed115 instead has
      among villages. The selected destination is retained without counting an editor’s capitalization
      as an independent manuscript reading.
    reason: textual_variant
  - marker: b
    text: The Greek has pneuma, spirit, without an article and does not explicitly name the Holy Spirit.
      A spirit retains the narrative’s unspecified agency; the Spirit is an interpretive alternative.
      The spirit carries Hermas again to the same place, while the later agent who snatches the book remains
      unseen.
    reason: alternative_reading
  - marker: c
    text: Literally, “I set the knees,” a Greek idiom for kneeling. Palatina printed17 names God in the
      prayer where working Greek says Lord. The working worthiness and former-sins clauses remain the
      reasons for praying and glorifying; the Ethiopic edition’s Latin rendering has teaching the past
      sins without a separate worthiness phrase.
    reason: cultural_note
  - marker: d
    text: Little book reflects the diminutive biblaridion, followed by biblidion in the request and return
      narrative. Booklet is an alternative. The diminutive alone does not establish a scroll or bound-book
      format. Sinaiticus5.3 first hand has biblion in the request, changed by S1 to biblidion.
    reason: lexical_alternative
  - marker: e
    text: The working Greek says he copied everything letter for letter because he could not make out
      the syllables. Athos and Sinaiticus5.4 retain both clauses, and Vulgata printed8 also has syllables.
      Palatina printed19 describes writing in order and inability to divide the writing by syllables;
      its commentary cites continuous writing as an explanation. That explanation is not an explicit cause
      stated by the Greek. D’Abbadie1860’s Latin rendering printed115 instead says he did not know the
      book, with an alternative about being unskilled in letters in its footnote. The selected Greek does
      not by itself prove personal illiteracy. Vulgata’s printed withdrawing is an editorial emendation
      against reported sitting; Palatina also has sitting.
    reason: cultural_note
  - marker: f
    text: Elect may also be chosen ones. The working Greek, Athos, Sinaiticus5.3 and both printed Latin
      versions name God in the phrase elect of God. The Ethiopic edition’s Latin rendering printed115
      instead names the Lord. This versional difference is disclosed rather than silently substituted.
    reason: textual_variant
  - marker: g
    reason: textual_variant
    text: The working Greek and Athos have the woman’s reply, take it and you will give it back to me;
      Vulgata printed8 likewise retains it. Sinaiticus5.3 first hand ends the request with auton and has
      no separate take/return reply; ca replaces that ending with auto and adds the reply. Palatina printed19
      and the Ethiopic edition’s Latin rendering printed115 proceed to receiving/copying without that
      separate reply. No physical gap is encoded at the Sinaiticus locus. The working reply remains with
      its speaker identified.
  - marker: h
    reason: textual_variant
    text: The working Greek, Athos and Vulgata printed8 explicitly say that he had seen this woman last
      year. Sinaiticus5.3 instead has proteron, before; Palatina printed19 and the Ethiopic edition’s
      Latin rendering printed115 identify the previously seen old woman without repeating last year here.
      This does not remove the earlier time-setting, which remains in paragraph1. Ethiopic evidence throughout
      these notes is through d’Abbadie’s printed Latin translation, not direct Geʿez or manuscript-photo
      collation.
lexical_decisions:
- source_word: Κούμας
  chosen: Cumae
  alternatives:
  - Cuma
  - Cumas
  lexicon: LSJ
  rationale: Standard Anglicized form for the ancient city; retains proper-name specificity without paraphrase.
- source_word: πνεῦμα
  chosen: a spirit
  alternatives:
  - the Spirit
  - the spirit
  lexicon: BDAG
  rationale: Anarthrous in Greek and context does not force identification as the Holy Spirit; rendering
    preserves ambiguity.
- source_word: τιθῶ τὰ γόνατα
  chosen: knelt down
  alternatives:
  - I set my knees
  - I kneeled down
  lexicon: LSJ
  rationale: Idiomatic Greek expression for kneeling; English "knelt" conveys the act clearly while the
    footnote preserves the idiom.
- source_word: Κύριος
  chosen: the Lord
  alternatives:
  - the Master
  lexicon: BDAG
  rationale: Consistent with project policy for κύριος in Christian prayer contexts; capitalization reflects
    reverence.
- source_word: δοξάζειν
  chosen: glorify
  alternatives:
  - praise
  - honor
  lexicon: BDAG
  rationale: Maintains theological weight of giving glory to God's name.
- source_word: ἡγήσατο ἄξιον
  chosen: counted me worthy
  alternatives:
  - counted me worthy
  - considered me worthy
  lexicon: BDAG
  rationale: Everyday counted preserves the evaluative action and the causal clause.
- source_word: ἐγνώρισεν
  chosen: made known
  alternatives:
  - revealed
  - disclosed
  lexicon: BDAG
  rationale: Common rendering that keeps God as the subject who grants knowledge.
- source_word: ἁμαρτίας
  chosen: sins
  alternatives:
  - faults
  - transgressions
  lexicon: BDAG
  rationale: Standard moral-theological term; avoids softening to "faults."
- source_word: πρεσβυτέραν
  chosen: the old woman
  alternatives:
  - the elder woman
  - the aged lady
  lexicon: LSJ
  rationale: Describes age without importing ecclesiastical office; preserves visionary imagery later
    explained in Hermas.
- source_word: βιβλαρίδιον
  chosen: little book
  alternatives:
  - booklet
  - small scroll
  lexicon: LSJ
  rationale: Diminutive of βιβλίον; "little book" conveys size and concreteness without anachronism.
- source_word: ἀναγγεῖλαι
  chosen: announce
  alternatives:
  - proclaim
  - report
  lexicon: BDAG
  rationale: Neutral verb of making known to others; avoids over-preaching connotation while keeping publicness.
- source_word: ἐκλεκτοῖς
  chosen: elect
  alternatives:
  - chosen ones
  - chosen
  lexicon: BDAG
  rationale: Retains traditional theological register and second-century ecclesial texture; footnote offers
    alternative.
- source_word: Κυρία
  chosen: Lady
  alternatives:
  - Madam
  - Mistress
  lexicon: LSJ
  rationale: Respectful address to a woman of status; "Lady" preserves dignity and matches Hermas’s usage
    without connoting servitude.
- source_word: μεταγράψωμαι/μετεγραψάμην
  chosen: copy / copied
  alternatives:
  - transcribe
  - rewrite
  lexicon: LSJ
  rationale: Retain the copying request and its fulfillment, with letter-for-letter detail and inability
    to make out syllables.
- source_word: πρὸς γράμμα
  chosen: letter for letter
  alternatives:
  - character by character
  - letter by letter
  lexicon: LSJ
  rationale: Idiomatic phrase indicating exact, sequential copying at the level of letters.
- source_word: συλλαβάς
  chosen: syllables
  alternatives:
  - word divisions
  - syllabic units
  lexicon: LSJ
  rationale: Literal meaning retained; explanatory footnote clarifies ancient practice of scriptio continua.
- source_word: ἡρπάγη
  chosen: was snatched
  alternatives:
  - was seized
  - was taken away suddenly
  lexicon: BDAG
  rationale: Conveys suddenness and force inherent in the verb ἁρπάζω.
