  yaml_path: translation/deuterocanon/1_maccabees/002/012.yaml
  text: And look—our holy things, our beauty, and our glory have been laid waste, and the nations have defiled them.
translation:
  language: ko
  text: 보십시오[a]—우리의 거룩한 것들과 우리의 아름다움과 우리의 영광이 황폐해졌고[b], 이방 민족들이 그것들을 더럽혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἰδοὺ는 주의 환기 표현으로, 여기서는 감탄보다 ‘보십시오’의 지시성을 살렸습니다.
    reason: source_note
  - marker: b
    text: ἠρημώθη는 단순한 파괴보다 ‘황폐해지다/폐허가 되다’의 결과 상태를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: ἰδοὺ
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: ἰδοὺ
  rationale: 문장 앞의 주의 환기 표현을 합쇼체로 자연스럽게 살리되, 영어 POB의 ‘look’이 가진 감탄·지시 효과를 유지했습니다.
- source_word: τὰ ἅγια ἡμῶν
  english_pob_choice: our holy things
  chosen_korean: 우리의 거룩한 것들
  alternatives_korean:
  - 우리의 성물들
  - 우리의 성소
  lexicon: ἅγια
  rationale: ἅγια는 여기서 특정 성소 한 곳보다 공동체의 성스러운 대상들을 가리키므로, 과도하게 협소한 ‘성소’보다 중립적인 ‘거룩한 것들’이 원문 범위를 잘 반영합니다.
- source_word: ἡ καλλονὴ ἡμῶν καὶ ἡ δόξα ἡμῶν
  english_pob_choice: our beauty, and our glory
  chosen_korean: 우리의 아름다움과 우리의 영광
  alternatives_korean:
  - 우리의 아름다움과 우리의 명예
  - 우리의 영화와 우리의 영광
  lexicon: καλλονή, δόξα
  rationale: καλλονή는 외형적·상징적 ‘아름다움’, δόξα는 공동체의 ‘영광/영화’로 볼 수 있으나, 본문 대조를 살려 POB의 ‘beauty’와 ‘glory’를 직역에 가깝게 옮겼습니다.
- source_word: ἠρημώθη
  english_pob_choice: have been laid waste
  chosen_korean: 황폐해졌습니다
  alternatives_korean:
  - 폐허가 되었습니다
  - 황량해졌습니다
  lexicon: ἐρημόω
  rationale: 수동 완료의 결과 상태를 드러내면서, 성전·도성의 파괴적 훼손을 담는 ‘황폐해지다’가 가장 직접적입니다.
- source_word: ἐβεβήλωσαν αὐτὰ ἔθνη
  english_pob_choice: the nations have defiled them
  chosen_korean: 이방 민족들이 그것들을 더럽혔습니다
  alternatives_korean:
  - 열국이 그것들을 더럽혔습니다
  - 민족들이 그것들을 속되게 했습니다
  lexicon: ἔθνη, βεβηλόω
  rationale: ἔθνη는 문맥상 언약 밖의 민족들을 가리키므로 ‘이방 민족들’로 옮기고, βεβηλόω는 종교적 오염을 가리키는 ‘더럽히다’로 유지했습니다.
theological_decisions:
- issue: ‘거룩한 것들’의 범위
  chosen_reading: 구체적 한 대상이 아니라 공동체의 성물·성전 관련 거룩한 대상들을 포괄하는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘성소’로 좁혀 번역
  - ‘거룩한 물건들’로 물질성을 강조
  rationale: ἅγια의 복수형과 병렬 구조가 단일 성전 건물보다 더 넓은 신성한 대상들의 훼손을 시사하므로, 범위를 과도하게 축소하지 않았습니다.
  doctrine_reference: 성전/성물의 더러워짐과 언약 공동체의 상징적 수치를 드러내는 본문 맥락
