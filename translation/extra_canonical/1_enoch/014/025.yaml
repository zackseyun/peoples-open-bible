theological_decisions:
- issue: Identity of the one raising Enoch
  chosen_reading: Leave the subject as “he.”
  alternative_readings:
  - Identify him as a holy one
  - Identify him as the Lord
  rationale: The supplied Ge’ez excerpt begins mid-verse and does not name the subject.
- issue: Meaning of Enoch’s lowered face
  chosen_reading: Describe the posture without naming it worship.
  alternative_readings:
  - Interpret the posture explicitly as worship
  rationale: The witness reports Enoch’s posture, not its ritual significance.
