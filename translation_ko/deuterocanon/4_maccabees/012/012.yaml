revisions:
- from: 이런 일들로 인해, 신적인 정의가 더 짙고 영원한 불과 고문[a][b]을 너를 위해 저장하고 있으니, 그것들은 온 세월 동안 너를 놓아주지 않을 것입니다.
  to: 이런 일들 때문에 신적 정의가 더욱 거세고 영원한 불과 고문[a]을 네게 쌓아 두고 있으니, 그것들은 온 시대에 걸쳐 너를 놓아주지 않을 것입니다.
  rationale: 원문의 인과 관계(ἀνθ᾽ ὧν), 의인화된 신적 정의, 축적·예비의 이미지(ταμιεύεταί), 그리고 불과 고통이 지속적으로 놓아주지 않는다는 관계절을 보존했습니다. πυκνοτέρῳ는 ‘더 짙은’이라는 부자연스러운 직역 대신 문맥상 더 강하고 집중된 불을 나타내는 ‘더욱 거센’으로 조정했습니다. αἰωνίῳ와 εἰς ὅλον τὸν αἰῶνα의 중첩된 지속성은 ‘영원한’과 ‘온 시대에 걸쳐’로 각각 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:03:55Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 반영했으나, ταμιεύεταί의 ‘쌓아 두다/예비하다’라는 심판 준비의 비유는 ‘너를 위해 저장하고’보다 ‘네게 쌓아 두고’가 원문과 한국어 모두에서 더 정확합니다. πυκνοτέρῳ는 이 문맥에서 불의 물리적 ‘짙음’보다는 더 거세고 집중된 성격을 나타내므로 ‘더욱 거센’으로 옮기는 것이 안전합니다.
  naturalness: ‘불과 고문을 너를 위해 저장하고’는 한국어의 목적어·수혜자 관계가 부자연스럽습니다. ‘불과 고문을 네게 쌓아 두고 있으니’는 자연스럽고 원문의 축적 이미지를 보존합니다. 직접 خطاب의 ‘네게’와 종결형 ‘것입니다’는 현대 표준어 합쇼체 문맥에 적절합니다.
  terminology: θεία δίκη는 비인격적·의인화된 심판의 공의라는 폭을 보존하도록 ‘신적 정의’로 유지합니다. βάσανοις는 가혹한 형벌적 고통을 뜻할 수 있으므로 본문의 강한 표현인 ‘고문’을 유지하되, 이를 특정 교리적 결론으로 해설하지 않습니다.
  issues:
  - severity: medium
    issue: ‘너를 위해 저장하고’라는 표현
    rationale: 원문의 ταμιεύεταί는 심판을 쌓아 두거나 예비한다는 뜻이며, 현 번역은 한국어에서 무엇을 누구를 위해 저장하는지가 어색하게 결합됩니다.
  - severity: medium
    issue: πυκνοτέρῳ를 ‘더 짙고’로 번역
    rationale: 불에 대해 ‘짙다’는 현대 한국어에서 자연스럽지 않으며, 이 문맥의 비교급은 더 거세고 집중된 심판의 불이라는 뜻으로 옮기는 편이 적절합니다.
