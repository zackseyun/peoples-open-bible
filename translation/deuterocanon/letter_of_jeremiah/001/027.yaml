id: LJE.1.27
reference: Letter of Jeremiah 1:27
source:
  edition: lxx-swete-1909
  text: τὰς δὲ θυσίας αὐτῶν ἀποδιδόμενοι οἱ ἱερεῖς αὐτῶν καταχρῶνται· ὡσαύτως δὲ καὶ αἱ γυναῖκες ἀπ' αὐτῶν ταριχεύουσαι οὔτε πτωχῷ οὔτε ἀδυνάτῳ μὴ μεταδῶσιν.
  language: Greek
  pages:
  - 402
  - 403
  - 404
  - 405
  - 406
  - 407
  confidence: high
  validation: agree
translation:
  text: Their priests sell the sacrifices offered to them[a] and use the proceeds for themselves; likewise, the women preserve some of the sacrificial meat but share none with the poor or the helpless.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “take back the sacrifices offered to them and use them for themselves.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποδιδόμενοι
  chosen: taking back
  alternatives:
  - receiving back
  - recovering
  lexicon: LSJ
  rationale: The middle/passive participial form with θυσίας suggests the priests are reclaiming or receiving back the sacrifices offered to the idols. 'Taking back' communicates that the offerings are diverted for priestly use rather than remaining truly dedicated.
- source_word: καταχρῶνται
  chosen: make use of
  alternatives:
  - use up
  - misuse
  - consume
  lexicon: LSJ
  rationale: The verb can mean to use or make full use of, sometimes with a negative nuance. Here it refers to the priests appropriating the sacrifices for themselves. 'Make use of' stays close to the Greek while allowing the context to supply the criticism.
- source_word: ταριχεύουσαι
  chosen: preserving
  alternatives:
  - salting
  - pickling
  - curing
  lexicon: LSJ
  rationale: The participle refers to preserving food, likely by salting. 'Preserving' is natural modern English and broad enough to cover the ancient practice without over-specifying the exact method in the main text.
- source_word: μεταδῶσιν
  chosen: give
  alternatives:
  - share
  - impart
  lexicon: BDAG
  rationale: The sense is to give a share to someone from what one has. 'Give' is concise and idiomatic in English, while the context already implies sharing from the preserved sacrificial food.
- source_word: πτωχῷ
  chosen: the poor
  alternatives:
  - a poor person
  lexicon: BDAG
  rationale: The singular dative has representative force. 'The poor' is idiomatic English for this class reference.
- source_word: ἀδυνάτῳ
  chosen: the weak
  alternatives:
  - the helpless
  - the needy
  - the powerless
  lexicon: BDAG
  rationale: The term denotes one lacking strength or ability. 'The weak' preserves the broad sense and pairs naturally with 'the poor'.
