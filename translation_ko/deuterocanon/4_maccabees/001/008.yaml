  lexicon: ἀποδείκνυμι
  rationale: 논증적 맥락에서 단순 서술보다 근거를 들어 보여 주는 의미가 강하므로 '입증하다'가 적절합니다.
- source_word: ἀνδραγαθείας
  english_pob_choice: courage
  chosen_korean: 용맹
  alternatives_korean:
