  - marker: a
    text: The names follow the Greek forms here rather than being harmonized to familiar Hebrew spellings.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλα
  chosen: I sent for
  alternatives:
  - I sent
  - I dispatched
  lexicon: BDAG
  rationale: The verb means 'I sent,' but with πρὸς plus personal names in this context it idiomatically conveys sending to
    summon or call persons. 'I sent for' is natural English and fits the narrative sense better than the bare 'I sent.'
- source_word: πρὸς
  chosen: for
  alternatives:
  - to
  - to summon
  lexicon: BDAG
  rationale: Literally 'to/toward,' but after ἀπέστειλα and before a list of persons it indicates the direction of the sending.
    In English, 'sent for' best captures the action of dispatching messengers to these named men.
- source_word: Ἐλεάζαρον καὶ Ἰδούηλον καὶ Μαασμὰν καὶ Ἐναατὰν καὶ Σαμαίαν καὶ Ἰώριβον, Ναθάν, Ἐννατάν, Ζαχαρίαν καὶ Μεσολαβών
  chosen: Eleazar, Iduel, Maasman, Enaathan, Shemaiah, Jorib, Nathan, Ennathan, Zechariah, and Mesholabon
  alternatives:
  - Eleazar, Idouel, Maasma, Enaatan, Samaias, Iorib, Nathan, Ennatan, Zachariah, and Mesolabōn
  lexicon: LSJ
  rationale: The Greek expression is rendered 'Eleazar, Iduel, Maasman, Enaathan, Shemaiah, Jorib, Nathan, Ennathan, Zechariah,
    and Mesholabon' in this unit. The selected Greek, not an approximate cross-reference, controls the active rendering; any
    prior lexicon label is historical, not a new consultation.
- source_word: τοὺς ἡγουμένους
  chosen: the leaders
  alternatives:
  - the leading men
  - the rulers
  lexicon: BDAG
  rationale: The participle denotes those who lead or hold prominence. 'The leaders' is concise, natural English and fits
    the social role indicated here.
- source_word: ἐπιστήμονας
  chosen: men of understanding
  alternatives:
  - experts
  - men of insight
  - learned men
  lexicon: LSJ
  rationale: The adjective/substantive denotes knowledgeable or skilled persons. 'Men of understanding' preserves the personal
    and qualitative sense without sounding overly technical. Because the Greek is grammatically masculine and refers to specific
    named males, a masculine rendering is appropriate under the project's gender-accuracy principle.
