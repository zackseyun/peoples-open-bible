- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Rendering אֲנַסֶּה in relation to God
  chosen_reading: test
  alternative_readings:
  - tempt
  - put to the test
  rationale: The Hebrew verb נסה here denotes testing God, echoing the biblical prohibition against putting the LORD to the test. 'Test' preserves the lexical sense without importing a stronger moral sense of enticement to evil that English 'tempt' can suggest.
