id: ECC.2.26
reference: Ecclesiastes 2:26
source:
  edition: WLC
  text: כִּ֤י לְ/אָדָם֙ שֶׁ/טּ֣וֹב לְ/פָנָ֔י/ו נָתַ֛ן חָכְמָ֥ה וְ/דַ֖עַת וְ/שִׂמְחָ֑ה וְ/לַ/חוֹטֶא֩ נָתַ֨ן עִנְיָ֜ן לֶ/אֱס֣וֹף וְ/לִ/כְנ֗וֹס לָ/תֵת֙ לְ/טוֹב֙ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֔ים גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־׃
translation:
  text: For God has given wisdom, knowledge, and joy to the man who is good in his sight, but to the sinner he has given the task of gathering and storing up wealth, to give it to the one who is good in God's sight. This too is vapor and chasing after wind.
  philosophy: dynamic
lexical_decisions:
- source_word: לְאָדָם
  chosen: to the man
  alternatives:
  - to a person
  - to humankind
  lexicon: HALOT
  rationale: אָדָם here refers to an individual in contrast with 'the sinner,' not humanity in general. Per doctrine, gender-accurate rendering is preferred where the source is masculine and representative; 'man' preserves the Hebrew form and the individualizing contrast.
- source_word: שֶׁטּוֹב לְפָנָיו
  chosen: who is good before him
  alternatives:
  - who pleases him
  - who is good in his sight
  lexicon: HALOT
  rationale: Literally 'who is good before him.' This idiom can mean pleasing to God, but 'good before him' preserves the evaluative language of טוב while remaining natural enough in English. A more interpretive 'pleases him' is possible but less transparent to the Hebrew wording.
- source_word: נָתַן
  chosen: has given
  alternatives:
  - gave
  lexicon: HALOT
  rationale: 'The qatal form is rendered with English present perfect here to fit the reflective, gnomic style of Qoheleth in context: what God has allotted is a standing reality.'
- source_word: חָכְמָה
  chosen: wisdom
  lexicon: HALOT
  rationale: Standard rendering; denotes practical and reflective wisdom in Ecclesiastes.
- source_word: דַעַת
  chosen: knowledge
  alternatives:
  - understanding
  lexicon: HALOT
  rationale: '''Knowledge'' is the most direct gloss and pairs naturally with ''wisdom.'' ''Understanding'' would overlap too much with wisdom here.'
- source_word: שִׂמְחָה
  chosen: joy
  alternatives:
  - gladness
  lexicon: HALOT
  rationale: '''Joy'' is idiomatic and concise, fitting Qoheleth''s recurring theme of enjoyment as divine gift.'
- source_word: לַחוֹטֵא
  chosen: to the sinner
  alternatives:
  - to the one who sins
  lexicon: HALOT
  rationale: The participial form denotes a characteristic sinner, not merely an isolated act. 'The sinner' captures the contrast with the one good before God.
- source_word: עִנְיָן
  chosen: the task
  alternatives:
  - the business
  - the burden
  - the occupation
  lexicon: HALOT
  rationale: In Ecclesiastes this term often denotes an assigned occupation or preoccupation, sometimes burdensome. 'Task' fits the immediate sense of an imposed activity without overloading the term with negativity already conveyed by the context.
- source_word: לֶאֱסוֹף וְלִכְנוֹס
  chosen: of gathering and collecting
  alternatives:
  - to gather and heap up
  - to gather and accumulate
  lexicon: HALOT
  rationale: The paired infinitives are near-synonyms emphasizing accumulation. 'Gathering and collecting' preserves the parallelism without sounding overly idiomatic. 'Accumulate' is possible but slightly more interpretive.
- source_word: לָתֵת לְטוֹב לִפְנֵי הָאֱלֹהִים
  chosen: to give it to the one who is good before God
  alternatives:
  - to give to the one who pleases God
  - to give to the man who is good before God
  lexicon: HALOT
  rationale: The purpose/result infinitive is retained without the unsupported restrictive “only”; “it” represents the gathered goods.
- source_word: הֶבֶל
  chosen: vapor
  alternatives:
  - vapor
  - breath
  - meaninglessness
  lexicon: HALOT
  rationale: “Vapor” preserves the recurring concrete Hebrew image.
- source_word: רְעוּת רוּחַ
  chosen: chasing after wind
  alternatives:
  - striving after wind
  - shepherding the wind
  lexicon: HALOT
  rationale: This is natural modern English while retaining the source image; “striving after wind” remains a valid alternative.
- source_word: לְאָדָם שֶׁטּוֹב לְפָנָיו נָתַן
  chosen: For God has given ... to the man who is good before him
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: English order is smoothed, and God is supplied as the contextual and explicitly named implied subject to avoid an erroneous English antecedent for “he.”
