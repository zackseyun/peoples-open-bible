translation:
  text: These mountains that your eyes have seen—the mountain of iron, the mountain of copper, the mountain of silver,
    the mountain of gold, the mountain of easily melted metal and the mountain of lead—all of them will be before
    the Chosen One like beeswax before fire and like water flowing down onto those mountains from above. They will
    become powerless before his feet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The dagger and selected stars remain. The final actual expression is before his feet; the first draft
      extra suffix on before is removed. Primary Dillmann207 controls honey, and1153 explicitly gives the honey-plus-wild
      compound as cera, wax. Easily melted metal uses the primary697 description rather than an undisclosed modern
      alloy identification.
    reason: lexical_alternative
