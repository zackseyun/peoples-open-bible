id: ROM.15.28
reference: Romans 15:28
source:
  edition: SBLGNT
  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
translation:
  text: So when I have completed this task and safely delivered this fruit of Gentile generosity to them[a], I will go on to Spain by way of you.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'sealed this fruit to them,' referring to securing the contribution for its intended recipients.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  chosen: this
  alternatives:
  - this matter
  - this task
  lexicon: BDAG
  rationale: Demonstrative referring back to the collection/delivery Paul has been discussing. 'This' keeps the reference concise and natural, while the participial clauses clarify the action.
- source_word: οὖν
  chosen: Therefore
  alternatives:
  - then
  - so
  lexicon: BDAG
  rationale: Marks inference/transition from the preceding discussion. 'Therefore' preserves the logical connection more clearly than the lighter 'then.'
- source_word: ἐπιτελέσας
  chosen: have completed
  alternatives:
  - have finished
  - have accomplished
  lexicon: BDAG
  rationale: Aorist participle indicating prior action relative to the main future verb. Rendered with English perfect in a temporal clause ('when I have completed') to express action completed before 'I will go.' 'Completed' fits the sense of bringing an assigned task to its end.
- source_word: σφραγισάμενος
  chosen: have sealed to them
  alternatives:
  - have delivered securely to them
  - have certified for them
  - have ensured to them
  lexicon: BDAG
  rationale: Literally 'having sealed.' In this context of delivering the Jerusalem collection, the metaphor likely conveys formally securing or guaranteeing the gift to its recipients. The main text keeps the concrete metaphor 'sealed' for auditability, while English syntax adds 'to them' from αὐτοῖς.
- source_word: αὐτοῖς
  chosen: to them
  alternatives:
  - for them
  lexicon: BDAG
  rationale: Dative pronoun referring to the Jerusalem believers/recipients. 'To them' fits naturally with 'sealed' in English and preserves the directionality of the dative.
- source_word: τὸν καρπὸν τοῦτον
  chosen: this fruit
  alternatives:
  - this result
  - this harvest
  - this offering
  lexicon: BDAG
  rationale: Paul uses 'fruit' metaphorically for the tangible outcome of Gentile generosity. Retaining 'fruit' preserves Paul's metaphor and intertextual Pauline usage, though the referent is the monetary contribution.
- source_word: ἀπελεύσομαι
  chosen: I will go on
  alternatives:
  - I will depart
  - I will leave
  lexicon: BDAG
  rationale: Future middle of ἀπέρχομαι, here indicating Paul's onward travel. 'Go on' communicates movement to the next destination more idiomatically than the more abrupt 'depart.'
- source_word: δι’ ὑμῶν
  chosen: by way of you
  alternatives:
  - through you
  - via you
  - by you
  lexicon: BDAG
  rationale: διά with genitive can denote movement through or by way of. In context Paul means he will travel via Rome, likely with their assistance and in their company for part of the journey. 'By way of you' preserves the spatial/travel sense without over-specifying support.
- source_word: εἰς Σπανίαν
  chosen: to Spain
  alternatives:
  - into Spain
  lexicon: BDAG
  rationale: Standard directional phrase indicating destination. 'To Spain' is idiomatic English.
