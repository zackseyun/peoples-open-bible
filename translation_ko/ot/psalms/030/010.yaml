id: PSA.30.10
reference: Psalms 30:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה בֶּ֥צַע בְּ/דָמִ/י֮ בְּ/רִדְתִּ֪/י אֶ֫ל שָׁ֥חַת הֲ/יוֹדְ/ךָ֥ עָפָ֑ר הֲ/יַגִּ֥יד אֲמִתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/010.yaml
  text: Hear, O Yahweh, and be gracious to me[a]; O Yahweh, be my helper.
  footnotes:
  - marker: a
    text: Or 'What gain is there in my death?' The Hebrew reads literally, 'What profit is there in my blood?'
    reason: lexical_alternative
  - marker: b
    text: Or 'the grave' for 'the pit.'
    reason: lexical_alternative
  - marker: c
    text: Or 'your truth.' The Hebrew term can mean 'truth' or 'faithfulness,' with 'faithfulness' fitting the covenantal context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 들으시고 제게 은혜를 베풀어 주십시오. 야훼여, 저를 돕는 이가 되어 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제게 은혜를 베풀어 주십시오’는 ‘제게 자비를 베풀어 주십시오’로도 옮길 수 있습니다. 히브리어 동사는 도움을 구하는 간청에서 은혜 또는 자비를 베푸는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה בֶּצַע
  english_pob_choice: What profit is there
  chosen_korean: 무슨 유익이 있습니까
  alternatives_korean:
  - 무슨 이익이 있습니까
  - 무슨 이득이 있습니까
  lexicon: HALOT
  rationale: 히브리어 관용구가 묻는 '무슨 이득/유익'의 수사적 질문을 한국어로 자연스럽게 살리되, 시적 맥락에 맞게 간결하게 옮겼습니다.
- source_word: בְּדָמִי
  english_pob_choice: in my blood
  chosen_korean: 내 피에
  alternatives_korean:
  - 내 죽음에
  - 내 피 흘림에
  lexicon: HALOT
  rationale: 본문의 구체적 이미지를 따라 '피'를 보존했고, 해석을 앞세워 '죽음'으로 완화하지 않았습니다.
- source_word: שָׁחַת
  english_pob_choice: the pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 무덤
  - 스올
  lexicon: HALOT
  rationale: 시편의 하강 이미지를 살리기 위해 '구덩이'를 택했으며, 전통적 교회어인 '무덤'보다 원문의 공간적 비유를 더 직접적으로 드러냅니다.
- source_word: הֲיוֹדְךָ עָפָר
  english_pob_choice: Will the dust praise you
  chosen_korean: 흙이 주님을 찬양하겠습니까
  alternatives_korean:
  - 먼지가 주님께 감사하겠습니까
  - 티끌이 주님을 찬양하겠습니까
  lexicon: HALOT
  rationale: יָדָה 계열의 예배적 뉘앙스는 '찬양하다'로 자연스럽게 옮기고, עָפָר는 인간의 죽음과 귀환을 가리키는 '흙'으로 번역해 시적 대응을 살렸습니다.
- source_word: אֲמִתֶּךָ
  english_pob_choice: your faithfulness
  chosen_korean: 주님의 신실하심
  alternatives_korean:
  - 주님의 진실
  - 주님의 진리
  lexicon: HALOT
  rationale: אֱמֶת는 '진리'도 가능하지만, 여기서는 언약적 맥락에서 하나님의 성품을 가리키므로 '신실하심'이 가장 적절합니다.
theological_decisions:
- issue: 직접적인 죽음-이미지 유지 여부
  chosen_reading: '''피'', ''구덩이'', ''흙''의 구체적 이미지를 본문에서 그대로 유지했습니다.'
  alternative_readings:
  - '''죽음'', ''무덤'', ''죽은 자''로 해석적으로 풀어 쓸 수 있습니다.'
  rationale: 시편의 논지는 죽음이 하나님을 공개적으로 찬양할 기회를 끊는다는 데 있으며, 원문은 이를 구체적 생명/죽음의 이미지로 표현합니다. 그 긴장을 보존하는 것이 본문의 힘을 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
