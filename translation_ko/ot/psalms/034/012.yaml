  text: לְֽכוּ בָ֭נִים שִׁמְעוּ לִ֑/י יִֽרְאַ֥ת יְ֝הוָ֗ה אֲלַמֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/012.yaml
  text: Who is the man who desires life and loves many days, that he may see good?[a]
  footnotes:
  - marker: a
    text: Or 'sons.' The Hebrew term is masculine plural, but here likely functions as a wisdom-style address to learners generally.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the fear of the LORD,' a wisdom expression encompassing reverent awe, obedience, and proper dread before God.
    reason: lexical_alternative
translation:
  language: ko
  text: 생명을 바라고 좋은 것을[b] 보려고 날들을 사랑하는 사람이[a] 누구입니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 남자’이지만, 여기서는 일반적으로 사람을 가리키는 단수 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘좋은 것을 경험하려고’. 히브리어의 ‘보다’는 이 문맥에서 경험한다는 뜻을 함축할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
