lexical_decisions:
- source_word: ἐπορεύθησαν
  chosen: went
  alternatives:
  - traveled
  - journeyed
  lexicon: LSJ
  rationale: Aorist middle/passive deponent of πορεύομαι, here simply narrating movement. 'Went' is the most natural English rendering; 'journeyed' is possible but slightly more elevated than the context requires.
- source_word: εἰς Ῥώμην
  chosen: to Rome
  alternatives:
  - into Rome
  lexicon: LSJ
  rationale: Directional εἰς with a place name is naturally rendered 'to Rome' in English travel narration.
- source_word: ἡ ὁδὸς πολλὴ σφόδρα
  chosen: the journey was very long indeed
  alternatives:
  - the road was very long
  - the way was exceedingly long
  lexicon: LSJ
  rationale: Although literally 'the road/way [was] very much/exceedingly [great],' the idiomatic sense in context is the length of the trip. 'Journey' communicates the intended meaning better than a wooden 'road,' while retaining the emphasis of πολλὴ σφόδρα with 'very long indeed.'
- source_word: εἰσῆλθον
  chosen: entered
  alternatives:
  - went into
  lexicon: LSJ
  rationale: Standard aorist of εἰσέρχομαι. 'Entered' is concise and fits the formal narrative style.
- source_word: τὸ βουλευτήριον
  chosen: the council chamber
  alternatives:
  - the senate house
  - the council hall
  lexicon: LSJ
  rationale: βουλευτήριον denotes the place where a council deliberates. In the Roman setting it refers to the meeting place of the governing council; 'council chamber' is transparent English without over-specifying beyond the Greek. 'Senate house' is historically plausible but more interpretive.
- source_word: ἀπεκρίθησαν
  chosen: answered
  alternatives:
  - replied
  - spoke in response
  lexicon: LSJ
  rationale: The verb commonly means 'answered/replied.' Even though the content of the reply follows in the next verse, retaining 'answered' reflects the Greek narrative sequence.
