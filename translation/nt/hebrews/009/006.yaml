  meaning_decisions:
  - source_phrase: Τούτων δὲ οὕτως κατεσκευασμένων
    prior_rendering: With these things prepared in this way
    new_rendering: With everything arranged in this way
    rationale: The opening refers to the completed arrangement of the sanctuary and its furnishings.
  - source_phrase: εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν
    prior_rendering: continually enter the first tabernacle
    new_rendering: regularly enter the first room
    rationale: The priests habitually enter the outer compartment; the phrase does not mean uninterrupted entry or entry into a separate tabernacle.
  - source_phrase: τὰς λατρείας ἐπιτελοῦντες
    prior_rendering: performing the services
    new_rendering: to carry out their duties of worship
    rationale: These are prescribed priestly acts of worship, not services in the modern congregational sense.
