translation:
  text: And what they ask of you shall not be granted to their fathers on their behalf, because they hope to live an eternal
    life, and that each one of them will live five hundred years.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez does not clearly identify the petitioners in this clause; in context, the plural pronouns may refer in
      different ways to the Watchers and their offspring.
    reason: textual_variant
  - marker: b
    text: The text places “an eternal life” beside the expectation of living five hundred years; both expressions are retained
      without harmonizing them.
    reason: lexical_alternative
  - marker: c
    text: The printed conjunction is bracketed and the plural referents remain uncertain. The source’s eternal-life/five-hundred-years
      juxtaposition is not resolved into a literal lifespan claim.
    reason: textual_variant
lexical_decisions:
- source_word: እሉ፡ ዘይስእሉከ
  chosen: what they ask of you
  alternatives:
  - these things that they ask of you
  - their requests to you
  rationale: The demonstrative እሉ is used substantivally with the relative clause ዘይስእሉከ. English “what they ask of you” conveys
    the construction without supplying a source noun such as “request.” The identity of “they” is not explicit in this isolated
    clause.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኢይከውኑ፡ ለአበዊሆሙ
  chosen: shall not be granted to their fathers
  alternatives:
  - shall not be for their fathers
  - shall not come to pass for their fathers
  rationale: The verb ከወነ literally concerns being or becoming, but with requested things and the dative phrase “to their
    fathers,” “be granted” expresses the contextual force while retaining the future negative judgment.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በእንቲአሆሙ
  chosen: on their behalf
  alternatives:
  - concerning them
  - for their sake
  rationale: The prepositional expression marks reference or benefit. “On their behalf” best fits the intercessory context,
    though the chain of plural pronouns remains somewhat ambiguous.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይሴፈዉ
  chosen: they hope
  alternatives:
  - they expect
  rationale: The verb expresses hopeful expectation. “Hope” preserves that the anticipated longevity is their desire or expectation,
    not a divine promise.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይኅየዉ፡ ሕይወተ፡ ዘለዓለም
  chosen: to live an eternal life
  alternatives:
  - to live forever
  - to live a life of eternity
  rationale: The rendering preserves the cognate life/live wording and the explicit expression ሕይወተ ዘለዓለም rather than reducing
    it to generic longevity. The following five-hundred-year clause creates an intentional or inherited tension that should
    not be resolved in translation.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: አሐዱ፡ አሐዱ፡ እምኔሆሙ
  chosen: each one of them
  alternatives:
  - one by one among them
  - every one of them
  rationale: The distributive repetition “one, one” is idiomatically represented by “each one,” preserving its individualizing
    force.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኃምስተ፡ ምእተ፡ ክረምተ
  chosen: five hundred years
  alternatives:
  - five hundred rainy seasons
  rationale: ክረምት can denote the rainy season and, by seasonal reckoning, a year. In this age formula, “years” is the clear
    English equivalent.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
