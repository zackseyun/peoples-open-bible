translation:
  text: In those days I will open the storehouses of blessing in heaven[a], to send them down to the earth upon
    the work and toil of humankind[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Storehouses can also be rendered treasuries. The work/toil pair is retained; toil is not changed into
      reward. The plural object in send them down follows the selected wording without adding an unprinted rain
      or fertility image. Personally viewed Dillmann1865 columns1065–1068 (storehouses),1363–1364 (open),505–506
      (blessing),901–902 (descend/bring down),1163–1164 (work),1271–1272 (toil),885–886 (offspring) and359–360 (human
      beings).
  - marker: b
    reason: textual_variant
    text: 'The two main-text asterisks are retained in the source transcription: after the initial preposition and
      before upon the earth. Charles reports a marginal gloss at apparatus46 and a small variant at47; neither is
      substituted for the selected main text.'
