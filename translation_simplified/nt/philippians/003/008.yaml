translation:
  language: en
  text: More than that, I consider all things to be a loss because of the surpassing worth of knowing Messiah[a] Jesus my Lord. For his sake, I have suffered the loss of all things and consider them rubbish[b], so that I may gain Messiah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Messiah” translates the Greek title traditionally rendered “Christ.”
    reason: lexical_alternative
  - marker: b
    text: “Rubbish” translates a strong word that can also mean “garbage,” “refuse,” or “dung.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: because of the surpassing value of the knowledge of Messiah Jesus
  simplified_phrase: because of the surpassing worth of knowing Messiah Jesus
  preserved_meaning: Knowing Messiah Jesus has value greater than everything else.
  reasoning_layer_used: POB lexical decision for διὰ τὸ ὑπερέχον τῆς γνώσεως
  rationale: The verbal form “knowing” expresses the same relational sense in more natural English.
- pob_phrase: for whose sake I have suffered the loss
  simplified_phrase: For his sake, I have suffered the loss
  preserved_meaning: Paul suffered these losses because of Messiah Jesus.
  reasoning_layer_used: POB lexical decision for δι’ ὃν and ἐζημιώθην
  rationale: A new sentence clarifies the personal cause while retaining the incurred loss.
- pob_phrase: consider all things to be loss ... suffered the loss ... gain Messiah
  simplified_phrase: consider all things to be a loss ... suffered the loss ... gain Messiah
  preserved_meaning: The linked accounting image contrasts everything lost with gaining Messiah.
  reasoning_layer_used: POB lexical decisions for ζημίαν, ἐζημιώθην, and κερδήσω
  rationale: The repeated loss-and-gain language preserves Paul’s central metaphor.
