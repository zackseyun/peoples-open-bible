  - 당신의 종
  lexicon: HALOT
  rationale: 시편 화자가 하나님께 직접 말하는 관계적 표현이므로, 법적 예속을 강조하는 '노예'보다 경건한 자기 지칭인 '종'이 원문 의도에 더 가깝습니다.
- source_word: נִזְהָר
  english_pob_choice: is warned
  chosen_korean: 경고를 받습니다
  alternatives_korean:
  - 경고를 받습니다
  - 주의를 받습니다
  - 훈계를 받습니다
  - 경고를 받아 깨닫습니다
  lexicon: HALOT
  rationale: 수동적·결과적 뉘앙스를 살려 '경고를 받다'로 옮겼습니다. '훈계'보다 본문의 경고성, 즉 율례가 사람을 경계하게 한다는 뜻이 분명합니다.
- source_word: עֵקֶב רָב
  english_pob_choice: great reward
  chosen_korean: 큰 상
  alternatives_korean:
  - 큰 보상
  - 큰 보답
  - 풍성한 보상
  lexicon: HALOT
  rationale: עֵקֶב은 순종의 결과로 따르는 유익을 가리키므로, 공로를 과도하게 강조하지 않으면서도 결과의 크기를 드러내는 '큰 상'이 적절합니다.
theological_decisions:
- issue: 순종의 보상이 공로 사상으로 들릴 가능성
  chosen_reading: 이 절은 하나님의 명령을 지킬 때 따르는 큰 유익을 말하며, 인간이 공로로 보상을 사는 체계를 단정하지 않습니다.
  alternative_readings:
  - 순종이 하나님 앞에서 보상을 획득한다는 더 강한 공로적 읽기
  rationale: 히브리어는 순종과 그에 따르는 결과를 간명하게 진술할 뿐이므로, 본문이 말하는 긍정적 결과를 보존하되 신학 체계를 과잉 주입하지 않도록 했습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 공로론으로 해소하지 않음.
