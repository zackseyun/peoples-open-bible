review_pass:
  verdict: revise
  source_fidelity: 현 본문은 인용문의 τοῦ οἴκου σου(‘당신의 집’)를 ‘야훼의 집’으로 바꾸어 2인칭 소유 표현을 보존하지 못했습니다. 또한 ἐμνήσθησαν에 대응하는 ‘기억했습니다’와 γεγραμμένον ἐστίν의 성경 인용 공식은 수정문에서 충실히 반영했습니다. καταφάγεταί με의 미래는 ‘삼킬 것이다’로 유지했습니다.
  naturalness: ‘제자들은 … 기록되어 있다는 것을 기억했습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 인용문의 시적·성경적 어조도 유지합니다. ‘이것이 기록되어 있음을’보다 지시 대상이 명료합니다.
  terminology: ζῆλος는 ‘열심’, οἶκος는 ‘집’으로 옮겨 시편 인용의 어휘를 보존했습니다. 원문에 없는 ‘야훼’를 본문에 삽입하지 않고, 원문의 2인칭 소유격을 ‘당신의’로 번역했습니다.
  issues:
  - severity: high
    issue: 인용문의 ‘야훼의 집’
    rationale: 그리스어는 τοῦ οἴκου σου, 즉 ‘당신의 집’입니다. ‘야훼의 집’은 시편의 궁극적 지시 대상을 해설적으로 명시하면서 원문의 직접 호칭과 소유격을 변경합니다.
  - severity: medium
    issue: 각주 b의 신명 표기 해설
    rationale: 본문에 없는 ‘야훼’를 삽입한 선택을 정당화하며, 요한복음 2:17의 그리스어 인용 자체에는 신명이 나타나지 않습니다. 따라서 삭제해야 합니다.
  - severity: low
    issue: 각주 a의 ‘일부 필사 전통의 시편 69:9 원문’ 표현
    rationale: ‘원문’은 특정 본문 전통과 대비될 때 부정확합니다. ‘시편 69:9의 일부 본문 전통’이라고 해야 대안 독법의 성격을 정확히 나타냅니다.
  revised_text: 제자들은 “당신의 집을 위한 열심이 나를 삼킬 것이다”라고 기록되어 있다는 것을 기억했습니다[a].
  revised_footnotes:
