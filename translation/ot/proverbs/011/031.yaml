id: PRO.11.31
reference: Proverbs 11:31
source:
  edition: WLC
  text: הֵ֣ן צַ֭דִּיק בָּ/אָ֣רֶץ יְשֻׁלָּ֑ם אַ֝֗ף כִּֽי רָשָׁ֥ע וְ/חוֹטֵֽא־׃
translation:
  text: Indeed, the righteous are repaid on earth—how much more the wicked and the sinner.
  philosophy: dynamic
lexical_decisions:
- source_word: הֵן
  chosen: Indeed
  alternatives:
  - Behold
  - Indeed
  lexicon: HALOT
  rationale: An emphatic affirmative particle here, not a conditional marker or a literal command to look.
- source_word: צַדִּיק
  chosen: the righteous
  alternatives:
  - a righteous man
  - the righteous person
  lexicon: HALOT
  rationale: The singular masculine adjective functions substantivally. 'The righteous' preserves the representative singular without over-specifying gender in English, while remaining close to the Hebrew.
- source_word: בָּאָרֶץ
  chosen: on earth
  alternatives:
  - in the land
  - in the earth
  lexicon: HALOT
  rationale: Fits the general scope of the proverb, while “in the land” remains a valid alternative.
- source_word: יְשֻׁלָּם
  chosen: is repaid
  alternatives:
  - is recompensed
  - is rewarded
  - is requited
  lexicon: HALOT
  rationale: Pual of שלם here denotes receiving due repayment or recompense. 'Is repaid' is broad enough to include recompense without implying only positive reward; this suits the proverb's logic that even the righteous receive due consequences in this life.
- source_word: אַף כִּי
  chosen: how much more
  alternatives:
  - much more
  - even more so
  - surely then
  lexicon: HALOT
  rationale: Marks an a-fortiori conclusion without requiring an English if-clause.
- source_word: רָשָׁע
  chosen: the wicked
  alternatives:
  - the wicked man
  - the guilty
  lexicon: HALOT
  rationale: Standard rendering for the substantival adjective in wisdom literature. 'The wicked' is concise and idiomatic.
- source_word: וְחוֹטֵא
  chosen: the sinner
  alternatives:
  - the one who sins
  - the sinful one
  lexicon: HALOT
  rationale: חוֹטֵא as a participle/substantive denotes one characterized by sinning. 'The sinner' is the most natural English equivalent and preserves the pairing with 'the wicked'.
