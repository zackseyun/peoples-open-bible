  - 어찌
  lexicon: Crum 54b / POB audit trail
  rationale: 직역보다 자연스러운 한국어 의문부사 ‘어떻게’가 원문의 관용구 뜻을 정확히 살립니다.
- source_word: ϭⲓⲛⲟⲩⲱⲙ
  english_pob_choice: concerning eating
  chosen_korean: 먹는 일에 관해서
  alternatives_korean:
  - 먹는 것에 관하여
  - 식사에 관해서
  - 음식에 관해서
  lexicon: Crum 819a / POB audit trail
  rationale: 여기서는 시간 부사절 ‘먹을 때’가 아니라 주제 표지 ‘먹는 일에 관해서’가 원문의 명사구를 더 정확히 반영합니다.
- source_word: ϫⲉϭⲟⲗ
  english_pob_choice: lie
  chosen_korean: 거짓말하다
  alternatives_korean:
  - 거짓을 말하다
  - 속이다
  lexicon: Crum 808b / POB audit trail
  rationale: 경구적 압축감을 살리면서도 한국어에서 곧바로 이해되는 표현으로 옮겼습니다.
- source_word: ⲙⲡⲉⲙⲧⲟ ⲉⲃⲟⲗ
  english_pob_choice: before
  chosen_korean: 하늘 앞에서
  alternatives_korean:
  - 하늘 앞에
  - 하늘의 면전에서
  lexicon: Crum 192a / POB audit trail
  rationale: 콥트어 관용구는 ‘~의 앞에서/면전에서’라는 뜻이므로, 원문이 말하는 공개성·현전성을 살려 옮겼습니다.
theological_decisions:
- issue: '복음서 전승과의 차이: Coptic 본문은 ‘covered/uncovered’이며 P.Oxy. 654는 ‘buried/raised’입니다.'
  chosen_reading: 콥트어 본문을 따라 ‘덮여 있지만 벗겨지지 않은 채 남을 것도 아무것도 없습니다’로 번역했습니다.
  alternative_readings:
  - ‘묻혀 있지만 일으켜지지 않을 것’
  - ‘숨겨져 있지만 드러나지 않을 것’
  rationale: 현재 기준 본문은 콥트어이며, 그 문맥은 종말론적 ‘묻힘/부활’보다 계시적 ‘가려짐/폭로됨’의 의미를 더 강하게 드러냅니다.
  doctrine_reference: 본문 비평 / 계시의 공개성
