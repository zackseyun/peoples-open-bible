    rationale: עָלָיו는 이 문맥에서 곡을 대상으로 하는 심판의 반대 방향을 나타내며, ‘에게’는 이를 단순한 전달 대상으로 바꿉니다. ‘대언하다’도 נבא의 일반적 번역어보다 대리 발화의 뜻이 강합니다.
