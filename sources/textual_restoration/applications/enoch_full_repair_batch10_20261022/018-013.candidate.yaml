translation:
  text: There I saw seven stars like great burning mountains, and I asked about them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected final Geʽez clause is daggered and corrupt, approximately “and like a spirit that asks me,”
      with the direction of inquiry distorted. The English inquiry about the stars adopts Charles’s printed Greek
      περὶ ὧν πυνθανομένῳ μοι, “as I inquired about them.” His printed50 note24 and printed51 note5 explicitly compare
      the corrupt Geʽez with this inquiry construction. The Greek links the inquiry to the angel’s reply in18:14;
      English coordinates “I asked” for a readable verse without adding the reply here. This is an openly Greek-assisted
      critical treatment, not a claim that the selected Geʽez spirit-asks-me clause is sound or that a Greek manuscript
      was independently collated.
    reason: textual_variant
