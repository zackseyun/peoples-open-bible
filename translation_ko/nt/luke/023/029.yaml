revisions:
- from: 「보십시오, 날들이 올 것인데, 그때는 ‘임신하지 못한 여자들은 복되다’ 하고, ‘한 번도 아이를 낳지 못한 태와, 한 번도 젖먹여 길러 보지 못한 젖가슴’이라고 말할 것입니다.”[a][b][c]
  to: 「보십시오, 날들이 오고 있습니다. 그때에는 사람들이 ‘아이를 낳지 못하는 여자들과, 한 번도 아이를 낳지 않은 자궁들과, 한 번도 젖을 먹이지 않은 젖가슴들이 복되다’라고 말할 것입니다.”
  rationale: 직접 인용 전체를 하나로 복원하여 세 병렬 명사가 모두 ‘복되다’의 대상으로 기능하게 했습니다. ‘날들이 오고 있습니다’는 ἔρχονται의 임박한 미래성을 자연스럽게 나타내며, ‘그때에는’은 ἐν αἷς를 반영합니다. 출산과 수유의 부정을 각각 ‘한 번도 … 않은’으로 명시해 영어 POB의 never와 원문의 문맥적 의미를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:46:41Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 미래 예고, ‘복되다’ 선언, 불임 여성·출산하지 않은 자궁·수유하지 않은 젖가슴의 세 병렬 대상을 대체로 반영했습니다. 그러나 초안은 인용문을 ‘여자들’ 뒤에서 종결하여 뒤의 두 병렬 명사가 독립된 발화처럼 되며, ‘한 번도’라는 의미는 본문에서 명료하게 유지하는 편이 좋습니다.
  naturalness: 초안의 인용부호와 ‘이라고 말할 것입니다’의 연결이 문법적으로 부자연스럽습니다. 세 대상을 하나의 직접 인용 안에 두고, 한국어에서 자연스러운 집합적 신체 명사 표현을 사용하면 명료합니다.
  terminology: μακάριαι는 문맥의 역설을 보존하는 ‘복되다’로 유지했습니다. στεῖραι는 불필요하게 낙인적인 명사화보다 ‘아이를 낳지 못하는 여자들’로, κοιλίαι는 문맥상 ‘자궁들’로, μαστοί는 수유 기능을 명시하는 ‘젖을 먹이지 않은 젖가슴들’로 옮겼습니다.
  issues:
  - severity: high
    issue: 인용문의 구조가 끊어져 있습니다.
    rationale: 원문은 Μακάριαι 이하의 세 병렬 대상을 하나의 발화로 묶습니다. 초안은 ‘임신하지 못한 여자들은 복되다’ 뒤의 인용부호로 발화를 닫고, 이어지는 ‘태와 … 젖가슴’이 문장 안에서 문법적으로 연결되지 않습니다.
  - severity: medium
    issue: 수유 행위의 번역이 다소 의역적입니다.
    rationale: ἔθρεψαν은 여기서 젖을 먹여 기르다/수유하다를 가리킵니다. ‘젖을 먹이지 않은’은 원문의 부정된 과거 행위와 신체 부위의 병렬을 더 직접적으로 재현합니다.
  - severity: low
    issue: 각주들이 본문 의미를 보완하지 못하고 일부는 본문과 중복됩니다.
    rationale: ‘또는 임신하지 못한 여자들’은 기존 본문과 사실상 동일하고, 본문을 자연스럽고 직접적으로 수정하면 제시된 어휘 대안 각주는 필요하지 않습니다.
