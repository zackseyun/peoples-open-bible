theological_decisions:
- issue: Sense of ἐπισκοπή in relation to the righteous man's claims about God
  chosen_reading: visitation
  alternative_readings:
  - vindication
  - care
  - punishment
  rationale: The Greek leaves the nature of the visitation somewhat open, though in context it likely refers to divine intervention validating or attending to the righteous man. Following the project's principle of preserving theological tension rather than resolving ambiguity, the main text keeps the broader 'visitation,' with alternatives preserved in a footnote.
