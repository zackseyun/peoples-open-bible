    rationale: μονογενής의 주된 어휘 의미는 유일한·독특한 것이며, ‘독생’은 역사적으로 중요한 전통 번역입니다. 본문에서 ‘유일한 아들’을 쓰고 ‘독생자/독생하신 아들’을 각주에서 전통적 번역으로 제시하면 양쪽을 정확하고 투명하게 보존할 수 있습니다.
