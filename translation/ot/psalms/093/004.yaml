id: PSA.93.4
reference: Psalms 93:4
source:
  edition: WLC
  text: מִ/קֹּל֨וֹת מַ֤יִם רַבִּ֗ים אַדִּירִ֣ים מִשְׁבְּרֵי יָ֑ם אַדִּ֖יר בַּ/מָּר֣וֹם יְהוָֽה׀־׃
translation:
  text: Mightier than the roar of many waters, mightier than the breakers of the sea, is Yahweh on high.
  philosophy: dynamic
lexical_decisions:
- source_word: מִ/קֹּלוֹת
  lemma: מִן
  chosen: than the sound of
  alternatives:
  - from the sounds of
  - above the voices of
  - than the voices of
  lexicon: HALOT
  rationale: The preposition מִן here is comparative in context, not separative ('from'). קוֹל can mean 'sound,' 'voice,' or 'noise.' With waters and sea-breakers, 'sound' best fits idiomatic English while preserving the auditory imagery.
- source_word: מַיִם רַבִּים
  chosen: many waters
  alternatives:
  - great waters
  - abundant waters
  lexicon: HALOT
  rationale: A common Hebrew expression for large, powerful waters. 'Many waters' preserves the biblical idiom and poetic resonance better than a more interpretive rendering.
- source_word: אַדִּירִים
  chosen: majestic
  alternatives:
  - mighty
  - powerful
  lexicon: HALOT
  rationale: The adjective conveys might, nobility, and grandeur. In this psalm's enthronement context, 'majestic' captures both power and royal exaltation better than the flatter 'mighty.'
- source_word: מִשְׁבְּרֵי יָם
  chosen: the breakers of the sea
  alternatives:
  - the breakers of the sea
  - the pounding waves of the sea
  - the breakers of the ocean
  lexicon: HALOT
  rationale: Directly preserves the concrete sea image without importing an adjective into this phrase.
- source_word: אַדִּיר
  chosen: majestic
  alternatives:
  - mighty
  lexicon: HALOT
  rationale: The second use of אַדִּיר predicates YHWH's superiority. Rendering it again as 'majestic' preserves lexical consistency with the previous occurrence while fitting the psalm's royal-theological tone.
- source_word: בַּ/מָּרוֹם
  chosen: on high
  alternatives:
  - in the heights
  - in the high place
  - in heaven
  lexicon: HALOT
  rationale: The phrase denotes exalted height. 'On high' is idiomatic, concise, and preserves the poetic sense of transcendent elevation without over-specifying 'heaven.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: מִקֹּלוֹת
  chosen: than the sounds of
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Plural noun with comparative מן.
- source_word: אַדִּירִים / אַדִּיר
  chosen: mightier / mightier
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The repeated root predicates Yahweh’s superior power over the waters.
