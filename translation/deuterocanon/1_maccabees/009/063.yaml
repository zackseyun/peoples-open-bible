lexical_decisions:
- source_word: ἔγνω
  chosen: learned of it
  alternatives:
  - knew
  - found out
  - came to know
  lexicon: BDAG
  rationale: Aorist of γινώσκω here likely means coming to know or learning of a development, not merely possessing knowledge. 'Learned of it' fits the narrative sequence and implies receipt of information.
- source_word: συνήγαγεν
  chosen: gathered
  alternatives:
  - assembled
  - brought together
  lexicon: BDAG
  rationale: The verb indicates collecting people together for action. 'Gathered' is natural English and preserves the military mobilization sense in context.
- source_word: πᾶν τὸ πλῆθος αὐτοῦ
  chosen: all his forces
  alternatives:
  - all his multitude
  - all his company
  - all his army
  lexicon: BDAG
  rationale: Literally 'all his multitude,' but in this military setting the phrase refers to the body of troops or followers under his command. 'All his forces' communicates the sense without wooden phrasing.
- source_word: τοῖς ἐκ τῆς Ἰουδαίας
  chosen: those from Judea
  alternatives:
  - those in Judea
  - the men from Judea
  - those of Judea
  lexicon: BDAG
  rationale: The preposition ἐκ most naturally means 'from/out of.' The phrase likely refers to persons associated with Judea rather than a purely locative 'in Judea.' 'Those from Judea' keeps the Greek force while remaining readable.
- source_word: παρήγγειλεν
  chosen: he gave orders
  alternatives:
  - he commanded
  - he sent instructions
  - he gave command
  lexicon: BDAG
  rationale: The verb commonly means to give instructions or orders. 'He gave orders' suits the military context and avoids overstating with a more formal or archaic expression.
