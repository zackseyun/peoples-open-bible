translation:
  language: en
  text: nor height nor depth, nor anything else God has created[a], will be able to separate us from God’s love for us in Christ Jesus our Lord[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “anything else in creation” or “any other created thing.”
    reason: simplification_note
  - marker: b
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
    reason: simplification_note
simplification_decisions:
- pob_phrase: nor any other created thing
  simplified_phrase: nor anything else God has created
  preserved_meaning: Keeps the full created-order scope while saying it in more direct modern English.
  reasoning_layer_used: POB lexical decisions
  rationale: The phrase “God has created” makes “created thing” immediately understandable without changing the theological boundary.
- pob_phrase: from the love of God that is in Messiah Jesus our Lord
  simplified_phrase: from God’s love for us in Messiah Jesus our Lord
  preserved_meaning: Makes the likely genitive sense explicit while preserving POB’s note that the context points to God’s love for us.
  reasoning_layer_used: POB footnote and theological context
  rationale: SPOB can unpack documented meaning when doing so helps common readers and does not erase a live ambiguity central to the text.
retained_terms:
- term: Messiah Jesus
  reason: Retained from POB’s title-rendering policy.
- term: Lord
  reason: Retained as the established rendering for κύριος.
- term: height nor depth
  reason: Retains Paul’s spatial merism.
translation_notes:
  source_alignment_notes: Completes the list from verse 38 and preserves the conclusion that no created reality can separate believers from God’s love in Messiah Jesus.
  readability_notes:
  - Uses “God’s love for us” rather than the more formal “the love of God.”
  - Uses “anything else God has created” for immediate comprehension.
  compression_notes:
  - The three POB footnotes are reduced to two because the main text already expresses the likely meaning of “the love of God.”
  risk_flags:
  - risk: Main text resolves “the love of God” as God’s love for us.
    mitigation: POB itself says this is the most likely contextual sense; reviewers can restore a footnote if they want the ambiguity more visible.
