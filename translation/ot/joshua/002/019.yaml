id: JOS.2.19
reference: Joshua 2:19
source:
  edition: WLC
  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
translation:
  text: If anyone goes out through the doors of your house, his blood will be on his own head[a], and we will be guiltless. But if anyone is with you in the house, his blood will be on our heads if anyone lays a hand on him.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “His blood will be on his own head” and “his blood will be on our heads” assign responsibility for bloodshed or death.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  chosen: introduces the stipulation (not separately represented)
  alternatives:
  - And it shall be
  - And it will happen
  lexicon: HALOT
  rationale: The form introduces the next covenant stipulation. English can state the condition directly without a separate formula.
- source_word: כֹּל אֲשֶׁר
  chosen: anyone who
  alternatives:
  - whoever
  - everyone who
  lexicon: HALOT
  rationale: Although literally 'all that/who,' in context it refers distributively to persons. 'Anyone who' is idiomatic and preserves the individualizing force.
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  chosen: goes out through the doors of your house
  alternatives:
  - goes outside from the doors of your house
  lexicon: HALOT
  rationale: The directional adverb is already conveyed by 'goes out'; adding 'to the outside' would duplicate the movement unidiomatically.
- source_word: דָּמוֹ בְרֹאשׁוֹ
  chosen: his blood will be on his own head
  alternatives:
  - he will be responsible for his own blood
  lexicon: HALOT
  rationale: The legal idiom assigns responsibility for the resulting bloodshed. The main text preserves the source image and the note explains it.
- source_word: וַאֲנַחְנוּ נְקִיִּם
  chosen: and we will be guiltless
  alternatives:
  - and we will be free of guilt
  - and we will be innocent
  lexicon: HALOT
  rationale: The adjective describes freedom from liability under the oath. 'Guiltless' is concise and juridically apt.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת
  chosen: but anyone who is with you in the house
  alternatives:
  - but everyone who is with you in the house
  lexicon: HALOT
  rationale: The contrasting stipulation applies to any person who remains protected inside the house.
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  chosen: his blood will be on our heads
  alternatives:
  - we will be responsible for his blood
  lexicon: HALOT
  rationale: The matching idiom assigns liability to the spies and preserves the verse's rhetorical parallelism.
- source_word: אִם יָד תִּהְיֶה בוֹ
  chosen: if a hand is laid on him
  alternatives:
  - if a hand is against him
  - if anyone lays a hand on him
  lexicon: HALOT
  rationale: The Hebrew literally says 'if a hand is on/in him,' an idiom for violent action or harm. 'If a hand is laid on him' is a standard, natural English equivalent that preserves the passive/indefinite force without specifying the agent.
