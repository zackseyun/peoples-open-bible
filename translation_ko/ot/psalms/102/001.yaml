translation:
  language: ko
  text: 야훼[a]여, 제 기도를 들으시고 제 부르짖음이 주께 이르게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘YHWH’입니다. 전통적으로 ‘여호와’ 또는 ‘주’로 옮기기도 합니다.
