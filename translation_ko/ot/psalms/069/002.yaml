- from: 하나님, 저를 구원해 주십시오. 물들이 제 목까지 올라왔습니다.[a]
  to: 저는 깊은 진창에 빠져들었으나 발 디딜 곳이 없습니다. 깊은 물속에 들어왔고, 급류가 저를 휩쓸었습니다.
  rationale: 원문 טָבַעְתִּי의 완료된 위기 상태를 ‘빠져들었으나’로, וְאֵין מָעֳמָד의 현재적 무력 상태를 ‘발 디딜 곳이 없습니다’로 살렸습니다. בָאתִי בְמַעֲמַקֵּי מַיִם는 ‘깊은 물속에 들어왔고’로, שִׁבֹּלֶת שְׁטָפָתְנִי는 물의 파괴적 흐름을 유지하여 ‘급류가 저를 휩쓸었습니다’로 옮겼습니다. 영어 감사 기록의 대안들은 가능한 어휘 범위이나, 이 한국어 본문에는 독해에 필요한 별도 각주가 안전하게 요구되지 않습니다. 기존 각주는 다른 절의 נֶפֶשׁ을 다루므로 삭제했습니다.
