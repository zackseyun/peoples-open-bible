source:
  edition: "Charles 1908 Greek Versions (pages 134-175, Judah pilot full)"
  text: "Καίγε *μετανοήσας ἐπὶ τούτοις, οἶνον καὶ κρέα οὐκ ἔφαγον ἕως γήρους μου, καὶ *πᾶσαν εὐφροσύνην οὐκ εἶδον."
  language: Greek
  note: "Greek from Charles XV.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV."
translation:
  text: And indeed I reoriented[a] away from these things; and wine and meat I did not consume until old age, and I saw no joy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
