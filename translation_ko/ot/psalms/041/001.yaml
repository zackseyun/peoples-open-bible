  yaml_path: translation/ot/psalms/041/001.yaml
  text: Blessed is the one who considers the poor[a][b][c]; in the day of trouble Yahweh will deliver him.
  footnotes:
  - marker: a
    text: Or 'by David' or 'for David'; the Hebrew superscription can indicate authorship, association, or dedication.
    reason: alternative_reading
translation:
  language: ko
  text: 가난한 이를 깊이 살피는[a] 이는 복이 있습니다. 재앙의 날[b]에 야훼께서 그를 건지실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가난한 이를 지혜롭게 돌보는 이.’ 히브리어는 사려 깊고 지혜롭게 관심을 기울이는 뜻을 나타냅니다. ‘가난한 이’는 ‘약한 이’ 또는 ‘궁핍한 이’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘악의 날.’ 여기서 ‘악’은 도덕적 악이 아니라 재앙이나 고난을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 합창대장에게
  - 최고 음악 책임자에게
  lexicon: HALOT
  rationale: 시편 표제의 לַמְנַצֵּחַ는 공연·전달 지시를 나타내는 관용적 표지이므로, 본문 기능을 살리면서도 현대 한국어에서 자연스러운 ‘지휘자에게’로 옮겼습니다.
- source_word: מִזְמֹור
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 노래
  - 찬가
  lexicon: HALOT
  rationale: מִזְמֹור는 표제에서 장르 표지로 쓰이는 ‘psalm’에 해당하므로, 한국어 성경에서 익숙한 ‘시’로 간결하게 옮겼습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗이 쓴
  - 다윗을 위한
  - 다윗에게
  lexicon: HALOT
  rationale: לְ의 의미가 저자 표기, 관련 표기, 헌정 모두로 열려 있으므로 영어 POB처럼 소유격형 ‘다윗의’로 두어 의미의 범위를 보존했습니다.
theological_decisions:
- issue: 다윗 표제의 관계 의미
  chosen_reading: 본문은 저자성으로 단정하지 않고, 관계가 열려 있는 표제형으로 유지했습니다.
  alternative_readings:
  - 다윗이 쓴 시
  - 다윗을 위한 시
  rationale: 히브리어 표제의 לְדָוִד는 단일한 관계로 확정되지 않으므로, 본문에서는 열린 형태를 유지하여 해석의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
