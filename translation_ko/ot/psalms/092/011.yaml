id: PSA.92.11
reference: Psalms 92:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תַּבֵּ֥ט עֵינִ֗/י בְּ/שׁ֫וּרָ֥/י בַּ/קָּמִ֖ים עָלַ֥/י מְרֵעִ֗ים תִּשְׁמַ֥עְנָה אָזְנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/011.yaml
  text: My eye has looked on my foes[a]; my ears hear of the evildoers who rise against me.[b]
  footnotes:
  - marker: a
    text: Or “those who watch me”; the Hebrew expression may refer to hostile watchers or observers.
    reason: lexical_alternative
  - marker: b
    text: Or “my ears have heard” or “my ears shall hear”; the Hebrew verbal form allows more than one contextual rendering in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 눈은 제 대적들을 보았고[a], 제 귀는 저를 거슬러 일어나는 악을 행하는 자들에 대하여 들었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 엿보는 자들’. 히브리어 낱말은 문맥상 대적을 가리킬 수 있으며, 더 문자적으로는 지켜보거나 엿보는 사람을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘듣습니다’ 또는 ‘들을 것입니다’. 히브리어 동사 형태는 문맥에 따라 현재적, 완료적, 또는 미래적 의미로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרֶם
  english_pob_choice: you have exalted
  chosen_korean: 높이셨습니다
  alternatives_korean:
  - 들어 올리셨습니다
  - 높여 주셨습니다
  lexicon: HALOT
  rationale: רום의 ‘높이다/들어 높이다’ 의미를 합쇼체 시제로 자연스럽게 살려, 하나님께서 시편 화자의 힘을 들어 높이신다는 뜻을 유지했습니다.
- source_word: כִּרְאֵים
  english_pob_choice: like that of a wild ox
  chosen_korean: 들소의 뿔처럼
  alternatives_korean:
  - 들소처럼
  - 야생 소의 뿔처럼
  lexicon: HALOT
  rationale: רְאֵם은 전통적으로 ‘wild ox’에 해당하는 강한 야생 들짐승이므로, 현대 한국어에서는 ‘들소’가 가장 자연스럽고 오해를 줄입니다.
- source_word: קַרְנִי
  english_pob_choice: my horn
  chosen_korean: 제 뿔
  alternatives_korean:
  - 나의 뿔
  - 제 권세
  lexicon: HALOT
  rationale: קֶרֶן의 문자적 의미인 ‘뿔’을 그대로 유지해, 힘과 존귀를 가리키는 비유를 해석으로 지우지 않았습니다.
- source_word: בַּלֹּתִי
  english_pob_choice: I have been anointed
  chosen_korean: 부어짐받았습니다
  alternatives_korean:
  - 기름을 바름받았습니다
  - 기름에 적셔졌습니다
  lexicon: HALOT
  rationale: בלל의 이 형태는 뜻이 분명하지 않아, 본문 문맥상 기름과 연결된 ‘적셔짐/부어짐’의 이미지를 살리되 과도한 해석은 피했습니다.
theological_decisions:
- issue: ‘horn’ 비유 보존
  chosen_reading: ‘뿔’ 이미지를 그대로 살려 힘과 승격의 상징을 유지했습니다.
  alternative_readings:
  - 힘
  - 권세
  rationale: 시적 은유를 평탄화하지 않고, 화자의 높여짐과 영예를 원문에 가깝게 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: בַּלֹּתִי의 번역 불확정성
  chosen_reading: 문맥상 기름의 풍성한 부어짐을 나타내는 표현으로 옮겼습니다.
  alternative_readings:
  - 기름에 젖었습니다
  - 기름과 섞였습니다
  rationale: 본문의 희귀한 동사와 기름 이미지 사이의 긴장을 보존하면서도, 독자가 축복과 기름부음의 분위기를 이해하도록 했습니다.
  doctrine_reference: Translation philosophy §3, §5
