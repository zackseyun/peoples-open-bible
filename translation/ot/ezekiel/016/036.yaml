  meaning_decisions:
  - source_phrase: אֲדֹנָי יְהֹוִה
    prior_rendering: the Lord GOD
    new_rendering: the Lord Yahweh
    rationale: The standing ruling requires Yahweh for the divine name, including this combination with the title Lord.
  - source_phrase: הִשָּׁפֵךְ נְחֻשְׁתֵּךְ
    prior_rendering: your bronze was poured out
    new_rendering: you poured out your wealth
    rationale: The gifts and payments in the preceding verses support bronze as wealth expended on lovers; unexplained bronze would not convey that meaning in English.
  - source_phrase: וַתִּגָּלֶה עֶרְוָתֵךְ בְּתַזְנוּתַיִךְ
    prior_rendering: your nakedness was uncovered in your prostitutions
    new_rendering: exposed your nakedness in your prostitution
    rationale: The active construction makes Jerusalem’s conduct explicit while retaining the sexual image.
  - source_phrase: גִּלּוּלֵי תוֹעֲבוֹתַיִךְ
    prior_rendering: the idols of your abominations
    new_rendering: your detestable idols
    rationale: The Hebrew construction characterizes the idols as abominable rather than describing idols belonging to separate abominations.
