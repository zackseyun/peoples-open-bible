  text: Moab is my washbasin[a]; on Edom I throw my sandal[b]; over Philistia I raise a shout[c].
  footnotes:
  - marker: a
    text: Or “my washpot,” a vessel used for washing.
    reason: lexical_alternative
  - marker: b
    text: Or “I cast my shoe.” The significance of the gesture is not stated explicitly.
    reason: ambiguity
  - marker: c
    text: The Hebrew can refer to a jubilant or martial shout.
    reason: lexical_alternative
translation:
  language: ko
  text: 모압은 내 씻는 대야입니다[a]. 에돔 위에 내가 내 신을 던지며[b], 블레셋을 향하여 내가 승리의 함성을 지릅니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 씻는 솥’. 히브리어는 씻는 데 쓰는 그릇을 가리키며, 모압의 굴복 또는 낮아진 처지를 나타내는 비유입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 신발을 던집니다’. 이 행위는 에돔에 대한 지배 또는 권리의 상징일 수 있으나, 본문은 그 구체적 이미지를 그대로 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘블레셋을 향해 소리칩니다’ 또는 ‘블레셋 위로 함성을 올립니다’. 히브리어 동사는 기쁨의 외침이나 전투의 함성을 가리킬 수 있습니다.
    reason: alternative_reading
