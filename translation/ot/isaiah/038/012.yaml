  - Harmonize impersonally without explicit subject shift
  rationale: The Hebrew appears to move from a third-person cutting image within the weaving metaphor to direct second-person address to God. Preserving the shift respects the poetic texture and avoids smoothing out the lament’s emotional immediacy.
