  previous_text: He answered me, “I have been appointed to oversee repentance, and I give understanding to everyone who repents. Do you not see that repentance itself is a form of understanding? Indeed, repentance shows great understanding. A man who has sinned recognizes that he has done evil before the Lord. What he did rises again in his heart, and he repents. He stops doing evil and instead does much good. He humbles himself and brings sorrow upon his own soul because he sinned. So you see that repentance shows great understanding.”
