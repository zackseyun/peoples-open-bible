revisions:
- from: '1[4]. 주님께서는 가인이 아벨을 죽였으므로 그 일로 말미암아 가인을 책망하셨다.

    2. 그리고 다섯째 주에 그녀는 그에게 딸 아완을 낳았습니다. 셋째 희년 원년에 가인이 아벨을 죽였으니 이는 아벨의 제물은 받으셨으나 그의 제물은 받지 아니하셨음이더라.

    3. 그리고 그는 그를 들에서 죽였습니다. 그리고 그의 피가 땅에서 하늘에 닿아 그를 고소했습니다.

    4. 그러므로 주님께서는 가인이 아벨을 죽였으므로 그 일로 말미암아 가인을 꾸짖으셨습니다. 그리고 그 형의 피 때문에 그를 땅에서 도망자로 만들고 땅에서 그를 저주했습니다.

    5. 그러므로 하늘 판에 이렇게 기록되어 있습니다. “자기 이웃을 치는 자는 저주를 받을 것이다.” 보고 듣는 모든 사람이 “그렇게 하십시오”라고 말하게 하십시오. 보고 알리는 그 사람도 그와 같이 저주를 받으리라.

    6. 그러므로 우리가 우리 하나님 주님 앞에 나아갈 때에 모든 죄를 선언하노니

    7[6-7]. 하늘과 땅, 빛과 어두움, 모든 곳에서 행해진 일이다. 그리고 아담과 그의 아내는 아벨을 위해 4주 동안 애곡했습니다. 다섯째 주 넷째 해에 그들이 기뻐하매 아담이 다시 그의 아내와 동침하여 아들을 낳으매 그가 그의 이름을 셋이라 하였으며 “가인이 죽였으므로 주님께서 나를 위하여 아벨 대신에 다른 씨를 땅에 일으키셨느니라”고 말하였기 때문입니다. 그리고 여섯째 주에 그는 딸 아주라를 낳았습니다. 그리고 가인은 그의 누이 아완을 아내로 맞이했고, 그녀는 넷째 희년 끝에 에녹을 그에게 낳았습니다. 그리고 다섯째 희년 첫째 주간 첫째 해에 땅 위에 집들이 건축되었고, 가인은 성을 건설하고 그의 아들의 이름을 따서 그 이름을 에녹이라 불렀습니다. 그리고 아담은 아내 하와와 알았고, 하와는 아홉 아들을 더 낳았습니다. 그리고 다섯째 희년의 다섯째 주에 셋은 그의 누이 아주라를 아내로 맞이하였고, 넷째 해에 그가 에노스를 낳았습니다. 그는 땅에서 주님의 이름을 처음으로 부른 사람이었습니다. 그리고 일곱째 희년 곧 셋째 주에 에노스가 그의 누이 노암을 아내로 취하였더니 그가 다섯째 주 셋째 해에 그에게 아들을 낳으매 그가 그의 이름을 게난이라 하였으며 여덟째 희년 끝에 게난이 그의 누이 무알렐렛을 아내로 삼았더니 그가 아홉째 희년 곧 그 주의 셋째 해 첫째 주에 그에게 아들을 낳아 그의 이름을 마할랄렐이라 불렀더라. 열째 희년 둘째 주에 마할랄렐이 그의 아버지의 형제의 딸 바라키엘의 딸 디나를 아내로 삼았더니 셋째 주 곧 여섯째 해에 그에게 아들을 낳고 그의 이름을 야렛이라 하였으며 그 때에 주님의 사자들이 땅에 강림하였으니 곧 순찰자라 일컫는 자들이니 이는 사람의 자녀들을 교훈하려 함이라

    8. 그리고 그들이 땅에서 정의와 정의를 행하게 하려는 것입니다.

    9. 열한째 희년에 야렛이 아내를 얻었으니 그 이름은 바라까라 그는 이 희년 네째 주에 그의 아버지의 형제의 딸이요 라수잘의 딸이더라 그 여자는 다섯째 주 곧 넷째 해에 그에게 아들을 낳았고

    10. 그리고 그는 그의 이름을 에녹이라 불렀습니다.

    11. 그는 땅에 난 자 중에 가장 먼저 글과 훈계와 지혜를 배워 하늘의 징조를 그 달의 순서대로 책에 기록하였으니 이는 사람의 아들들이 그 달의 순서대로 연한을 알게 하려 함이니라.

    12. 그는 처음으로 증언을 기록하였고 땅의 세대들에게 사람의 아들들에게 증언하였으며 희년의 주간을 계수하고 연한을 알게 하였으며 달을 정하였으니

    13. 그리고 우리가 그에게 알려 준 대로, 몇 년 간의 안식일을 이야기했습니다. 그가 자기 꿈의 환상에서 본 것은 대대에 걸쳐 심판 날까지 사람의 아들들에게 일어날 일이며 장래 일이니라. 그는 모든 것을 보시고 이해하셨으며, 그의 증언을 기록하셨고, 사람의 모든 자녀들과 그들의 세대에 대한 증언을 땅에 두셨습니다.

    14. 열두째 희년 곧 일곱째 주에 그가 아내를 맞이하였으니 그 이름은 에드니니 그의 아버지의 형의 딸이요 단엘의 딸이더라 이번 주 여섯째 해에 그가 아들을 낳으매 그가 그의 이름을 므두셀라라 불렀더라.

    15. 그가 여섯 해 동안 하나님의 사자들과 함께 있으니 천사들이 땅과 하늘에 있는 모든 일과 해의 법칙을 그에게 보이니 그가 모든 것을 기록하였느니라.

    16. 그리고 그는 사람의 딸들과 함께 죄를 지은 순찰자들에 대해 증언했습니다. 이는 이들이 사람의 딸들과 연합하여 자기들을 더럽히기 시작하였음이라. 그리고 에녹은 그들 모두에 대해 증언했습니다. 그리고 그는 사람의 아들들 가운데서 취하여져서 위대함과 영광을 위해 그를 에덴동산으로 데려왔습니다. 그리고 보라, 그는 거기에서 세상에 대한 정죄와 심판과 사람의 자녀들의 모든 사악함을 기록하고 계시느니라. 그로 말미암아 에덴 온 땅에 홍수가 생기지 아니하였으니 그가 거기서 표징과 모든 사람의 아들들에게 증거하기 위하여 세웠음이라 이는 대대의 모든 행위를 심판 날까지 말하려 하심이니라.

    17. 그리고 그는 성소의 향 곧 향산에서 주님 앞에 받으실 만한 향을 사랐습니다. 땅 위에 주님의 처소가 네 군데 있으니 에덴 동산과 동산과 오늘 너희가 있는 이 산 곧 시내 산과 시온 산이니 이 산은 땅을 거룩하게 하시기 위하여 새 창조 안에서 거룩하게 될 것임이니라 그러므로 땅은 대대로 모든 죄와 모든 더러움에서 거룩하게 되리라. 그리고 열넷째 희년에 므두셀라는 그의 아버지의 형제의 딸 아스리알의 딸 에드나를 아내로 맞이하였다. 셋째 주 곧 그 주의 첫째 해에 그가 아들을 낳으매 그가 그의 이름을 라멕이라 하였으며 열다섯째 희년 곧 셋째 주에 라멕이 아내를 얻었으니 그 이름은 베테노스라 그의 아버지의 동생 바라키엘의 딸이더라 이번 주에 그가 아들을 낳으매 그가 그 이름을 노아라 하여 이르되 나의 슬픔과 나의 모든 일과 주님께서 땅을 저주하신 일로 말미암아 이 아이가 나를 안위하리라 하였더라.

    18. 그리고 십구째 희년이 끝나고 여섯째 해인 일곱째 주에 아담이 죽었습니다. 그의 모든 아들들이 그를 창조된 땅에 장사했습니다. 그리고 그는 땅에 묻힌 첫 번째 사람이었습니다.

    19. 그에게는 천년 중에 칠십년이 부족하였나니 이는 하늘의 증거에 있어서 천년이 하루 같으니라. 그러므로 지식의 나무에 관하여는 “네가 그것을 먹는 날에는 죽으리라”고 기록되어 있다. 그러므로 그가 오늘의 세월을 채우지 못하였으니 이는 그 날에 죽었음이라.

    20. 이 희년이 끝나자 그 해에 가인이 죽임을 당했습니다. 그 집이 그 위에 무너지매 그가 그 집 가운데서 죽고 그 돌에 맞아 죽으니 이는 그가 아벨을 돌로 죽였음이니라.

    21. 그리고 그는 의로운 심판을 받고 돌에 맞아 죽었습니다. 그러므로 하늘의 판에 정하였나니 사람이 그 이웃을 죽이는 도구로 그 사람을 죽일지니 그가 상한 대로 그에게 행할지니라 하였느니라.

    22. 그리고 이십오째 희년에 노아가 아내를 취하였으니, 그 이름은 엠사라였으니, 그는 다섯째 주의 첫째 해에 그의 아버지의 형제의 딸, 라크엘의 딸이더라. 셋째 해에 셈을 낳았고, 다섯째 해에 함(Ham)을 낳았고, 여섯째 주의 첫째 해에 야벳을 낳았습니다.'
  to: '1. 그리고 둘째 희년의 셋째 주간에 그녀가 가인을 낳고, 넷째 주간에 아벨을 낳고, 다섯째 주간에 자기 딸 아완을 낳았습니다.

    2. 그리고 다섯째 주간에 그녀는 그에게 딸 아완을 낳았습니다. 그리고 세 번째 희년의 첫해에 카인이 아벨을 죽였습니다. 아벨의 제물은 받아들여졌지만 카인의 희생 제물은 받아들여지지 않았기 때문입니다.

    3. 그리고 그는 들판에서 그를 죽였습니다. 그의 피가 땅에서 하늘로 그를 두고 고발하며 부르짖었습니다.

    4. 그러므로 주님께서는 가인이 그의 형제 아벨을 죽였기 때문에 가인을 저주하셨습니다. 또 그 형제의 피 때문에 그가 땅에서 도망자가 되게 하셨고, 땅 위에서 그를 저주하셨습니다.

    5. 그리고 이 일 때문에 하늘의 서판들에 이렇게 기록되어 있습니다. “이웃을 악의로 치는 자는 저주를 받을 것입니다.” 그리고 보고 듣는 모든 사람은 “그리되기를”이라고 말해야 합니다. 또 보고도 알리지 않은 사람은 그와 같이 저주를 받을 것입니다.

    6. 이 때문에 우리는 주 우리 하나님 앞에 나아올 때 모든 죄를 …

    7. 하늘과 땅에서, 빛과 어둠 속에서, 그리고 모든 곳에서 행해지는 것들입니다. 아담과 그의 아내는 아벨 때문에 네 주 동안 슬퍼하였습니다. 다섯째 주의 넷째 해에 그들은 기뻐하게 되었고, 아담은 다시 그의 아내를 알았으며, 그녀는 그에게 아들을 낳았습니다. 그는 그 이름을 셋이라 하였습니다. 이는 그가 말하기를, “가인이 그를 죽였으므로, 하나님께서 아벨 대신에 땅 위에서 나를 위하여 또 다른 씨를 일으키셨다” 하였기 때문입니다. 여섯째 주에 아담은 딸 아주라를 두었습니다. 가인은 그의 누이 아완을 아내로 맞이하였고, 그녀는 넷째 희년이 끝날 때 그에게 에녹을 낳았습니다. 다섯째 희년의 첫째 주, 첫째 해에 땅 위에 집들이 세워졌고, 가인은 성읍을 건설하여 그의 아들 에녹의 이름을 따라 그 이름을 지었습니다. 아담은 그의 아내 하와를 알았고, 그녀는 아홉 자녀를 더 낳았습니다. 다섯째 희년의 다섯째 주에 셋은 그의 누이 아주라를 아내로 맞이하였고, 넷째 해에 그녀는 그에게 에노스를 낳았습니다. 그는 땅 위에서 주님의 이름을 부른 첫 사람이었습니다. 일곱째 희년의 셋째 주에 에노스는 그의 누이 노암을 아내로 맞이하였고, 그녀는 다섯째 주의 셋째 해에 그에게 아들을 낳았으며, 그는 그 이름을 가이난이라 하였습니다. 여덟째 희년이 끝날 때 가이난은 그의 누이 무알렐렛을 아내로 맞이하였고, 그녀는 아홉째 희년의 첫째 주, 그 주의 셋째 해에 그에게 아들을 낳았으며, 그들은 그 이름을 마할랄렐이라 하였습니다. 열째 희년의 둘째 주에 마할랄렐은 바라기엘의 딸이며 그의 아버지의 형제의 딸인 디나를 아내로 맞이하였고, 그녀는 셋째 주의 여섯째 해에 그에게 아들을 낳았으며, 그들은 그 이름을 야렛이라 하였습니다. 그의 시대에 주님의 천사들, 곧 감시자라 불리는 이들이 사람의 자녀들을 가르치려고 땅으로 내려왔습니다.

