- from: 아사랴, 호사야의 아들, 여호하난, 가레아의 아들, 그리고 모든 거만한 사람들이 예레미야에게 말했습니다. “당신은 거짓을 말하고 있습니다. 우리 하나님 야훼께서는 당신에게 ‘너희는 이집트로 내려가 거기에서 머물면 안 된다’고 말씀하라고 보내시지 않았습니다.”
  to: 호사야의 아들 아사랴와 가레아의 아들 요하난과 모든 교만한 사람들이 예레미야에게 말했습니다. “당신은 거짓을 말하고 있습니다. 우리 하나님 여호와께서는 당신에게 ‘너희는 이집트에 가서 그곳에 머물러 살지 말라’고 말씀하라고 보내지 않으셨습니다.”
