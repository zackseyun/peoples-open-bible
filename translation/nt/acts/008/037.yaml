  text: Εἶπεν δὲ ὁ Φίλιππος, Εἰ πιστεύεις ἐξ ὅλης τῆς καρδίας, ἔξεστιν. Ἀποκριθεὶς δὲ εἶπεν, Πιστεύω τὸν υἱὸν τοῦ θεοῦ εἶναι τὸν Ἰησοῦν Χριστόν.
  language: Greek
translation:
  text: Then Philip said, “If you believe with all your heart, you may.” The eunuch replied, “I believe that Jesus Christ is the Son of God[a].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: This verse is absent from the earliest surviving Greek manuscripts and most later ones. It is preserved in some manuscripts, and its confession was quoted by Irenaeus in the second century.
    reason: textual_variant
lexical_decisions:
- source_word: ἔξεστιν
  chosen: you may
  alternatives:
  - it is permitted
  - it is lawful
  - it is allowed
  lexicon: BDAG
  rationale: The impersonal verb ἔξεστιν denotes what is permitted or possible. In this context, 'you may' naturally conveys the permission to be baptized without sounding overly legalistic.
- source_word: καρδίας
  chosen: heart
  alternatives:
  - mind
  - inner self
  lexicon: BDAG
  rationale: The phrase 'with all your heart' (ἐξ ὅλης τῆς καρδίας) is a standard biblical idiom for complete sincerity and devotion, best preserved literally in English.
- source_word: Πιστεύω
  chosen: I believe
  alternatives:
  - I trust
  lexicon: BDAG
  rationale: In this confessional context, 'believe' accurately captures the intellectual and relational assent to the identity of Jesus Christ.
