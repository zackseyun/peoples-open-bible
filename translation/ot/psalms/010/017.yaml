theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: O Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Sense of עֲנָוִים in context
  chosen_reading: the humble
  alternative_readings:
  - the afflicted
  - the meek
  rationale: The psalm's context concerns the oppressed, but the lexical form itself points to humility/meekness. The translation preserves that tension rather than narrowing the term to socioeconomic affliction alone.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
