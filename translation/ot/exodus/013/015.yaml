  from: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
  to: When Pharaoh stubbornly refused to let us go, Yahweh killed every firstborn in the land of Egypt, both human and animal. That is why I sacrifice to Yahweh every firstborn male of my livestock[a], but I redeem all my firstborn sons.’
  rationale: The lexical rationale accurately understands Pharaoh’s obstinacy and the sacrifice/redemption contrast, which I retain. Its defense of generic “man” and the unqualified womb phrase is outweighed by the need to make the human/animal distinction and the animal scope of sacrifice clear.
