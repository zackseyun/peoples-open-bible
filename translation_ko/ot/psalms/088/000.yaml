    text: '''마할라스 레아노스''라는 표현은 불확실하다. 이는 곡조나 음악 스타일을 나타낼 수 있습니다. 다른 제안에는 ''마할랏에 따라, 화답하는 노래'' 또는 ''마할랏에 따르면, 고난에 관하여''가 포함됩니다.'
    reason: lexical_alternative
  - marker: b
    text: '''마스킬''은 시편 제목의 전문 용어로, 종종 교훈적이거나 명상적인 구성으로 이해됩니다.'
    reason: lexical_alternative
  - marker: c
    text: '또는 ''노래[a]. 고라 자손의 시. 합창단 장의 경우: Mahalath Leannoth[b]에 따르면. 마스킬''.'
