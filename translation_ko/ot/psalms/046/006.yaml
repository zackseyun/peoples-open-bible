base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/006.yaml
  text: Nations raged[a], kingdoms tottered; he raised his voice, the earth melted.
  footnotes:
  - marker: a
    text: Or 'in her midst.'
    reason: lexical_alternative
  - marker: b
    text: Or 'she will not be shaken' or 'she will not totter.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'at the turning of the morning'; that is, at daybreak or when morning dawns.
    reason: lexical_alternative
translation:
  language: ko
  text: 민족들이 소란을 일으키고 왕국들이 흔들렸습니다. 그가 음성을 내시니 땅이 녹았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들이 소란에 빠지고, 왕국들이 흔들렸다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: WLC
  rationale: 시편의 문맥에서 이 단어는 이스라엘의 한 분 하나님을 가리키므로 표준 교회어인 ‘하나님’으로 옮겼습니다.
- source_word: בְּקִרְבָּהּ
  english_pob_choice: within her
  chosen_korean: 그 안에
  alternatives_korean:
  - 그 가운데에
  - 그 한가운데에
  lexicon: HALOT
  rationale: 히브리어는 대상의 내부/중심에 계심을 나타내므로, 현대 한국어에서 자연스럽고 직접적인 ‘그 안에’를 택했습니다.
- source_word: תִּמּוֹט
  english_pob_choice: will be moved
  chosen_korean: 흔들리지 않을 것입니다
  alternatives_korean:
  - 움직이지 않을 것입니다
  - 무너지지 않을 것입니다
  - 떨리지 않을 것입니다
  lexicon: HALOT
  rationale: 동사의 핵심은 넘어짐·동요·흔들림의 부정이므로, 시편의 안정 이미지를 살리는 ‘흔들리지 않을 것입니다’로 옮겼습니다.
- source_word: לִפְנוֹת בֹּקֶר
  english_pob_choice: when morning dawns
  chosen_korean: 새벽이 밝아 올 때
  alternatives_korean:
  - 아침이 돌 때
  - 아침이 밝을 때
  - 동틀 녘에
  lexicon: HALOT
  rationale: 직역하면 ‘아침이 돌아오는/돌아선 때’라는 이미지이지만, 한국어 시어로는 ‘새벽이 밝아 올 때’가 의미와 장면을 가장 잘 드러냅니다.
theological_decisions:
- issue: 여성 단수 대명사 ‘her/she’의 지시 대상
  chosen_reading: 문맥상의 시온/하나님의 성을 가리키는 여성 단수로 유지했습니다.
  alternative_readings:
  - 하나님의 백성 전체를 가리키는 일반적 표현
  rationale: 히브리어 여성 단수는 바로 앞 문맥의 성읍을 자연스럽게 가리키므로, 해석어를 덧붙이지 않고 대명사 성격을 살렸습니다.
  doctrine_reference: 문맥 지시 대명사 처리
