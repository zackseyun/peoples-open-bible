translation:
  language: ko
  text: 그분의 콧구멍에서 연기가 올라오고, 그분의 입에서는 사르는 불이 나오며, 숯불이 그분에게서 타올랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 분노에서’. 히브리어 אַף는 ‘코, 콧구멍’을 뜻하거나 관용적으로 ‘분노’를 뜻할 수 있습니다. 여기서는 ‘그분의 입’과 이루는 병행 때문에 구체적인 신체 이미지로 옮겼습니다.
