  philosophy: dynamic
lexical_decisions:
- source_word: νεοκτίστους
  chosen: newly created
  alternatives:
  - new-made
  - newly formed
  lexicon: LSJ
  rationale: Compound from νέος + κτίζω, indicating creatures brought into being anew rather than merely young. 'Newly created' preserves the creation sense.
- source_word: θυμοῦ πλήρεις
  chosen: full of rage
  alternatives:
  - full of fury
  - filled with wrath
  lexicon: LSJ
  rationale: θυμός here denotes fierce anger or violent passion; with πλήρεις it describes the beasts' disposition. 'Rage' is vivid and natural English.
- source_word: θῆρας
  chosen: wild beasts
  alternatives:
  - beasts
  - animals
  lexicon: LSJ
  rationale: θήρ commonly refers to wild animals or beasts, especially dangerous ones. 'Wild beasts' best conveys menace.
- source_word: ἀγνώστους
  chosen: unknown
  alternatives:
  - unfamiliar
  - strange
  lexicon: LSJ
  rationale: The adjective means not known or unfamiliar. 'Unknown' keeps the starkness and fits the context of unprecedented creatures.
- source_word: ἤτοι
  chosen: or else
  alternatives:
  - that is
  - namely
  lexicon: LSJ
  rationale: In context it introduces a further specification within the alternative possibility. 'Or else' fits the verse's sequence of options better than an explanatory gloss.
- source_word: πυρπνόον
  chosen: fiery
  alternatives:
  - fire-breathing
  - breathing fire
  lexicon: LSJ
  rationale: The adjective literally suggests 'fire-buffing/breathing fire.' Because it modifies ἆσθμα through φυσῶντας, rendering the phrase as 'breathing out a fiery blast' avoids awkward redundancy while preserving the fire imagery.
- source_word: φυσῶντας ἆσθμα
  chosen: breathing out a ... blast
  alternatives:
  - blowing ... breath
  - snorting ... breath
  lexicon: LSJ
  rationale: φυσάω is to blow or puff; ἆσθμα is breath, blast, or panting. In this threatening context, 'breathing out a blast' is idiomatic and forceful.
