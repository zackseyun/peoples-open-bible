  text: 'For the choir director: “Do Not Destroy.”[a] Of David. A miktam[b], when Saul sent men[c], and they watched the house to kill him.'
  footnotes:
  - marker: a
    text: “Do Not Destroy” is likely a tune name or musical notation in the psalm heading.
    reason: cultural_note
  - marker: b
    text: The meaning of “miktam” is uncertain; it is therefore transliterated rather than translated.
    reason: lexical_alternative
  - marker: c
    text: More formally, “when Saul sent, and they watched the house to kill him.” The Hebrew does not explicitly state “men,” but the plural verb implies sent agents.
    reason: lexical_alternative
translation:
  language: ko
  text: 지휘자를 위하여. 「멸하지 마소서」에 맞추어[b]. 다윗의 믹담[a]. 사울이 사람들을 보내었을 때[c], 그들이 그 집을 감시하여 그를 죽이려 하였을 때.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘믹담’의 뜻은 분명하지 않으므로 음역했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멸하지 마소서’는 곡조 이름 또는 음악적 지시일 가능성이 높습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 ‘사람들’을 명시하지 않지만, 뒤의 복수 동사가 사울이 보낸 대리자들을 가리킴을 암시합니다.
    reason: source_note
