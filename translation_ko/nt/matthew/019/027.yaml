review_pass:
  verdict: revise
  source_fidelity: 그리스어는 베드로가 예수께 대답한 사실과, 인용문 안에서 예수를 2인칭 단수(σοι, ‘당신을/그대를’)로 가리킨다는 점을 명시합니다. 초안의 ‘주님을’은 본문에 없는 호칭을 더하므로, 직접 지시를 유지하는 표현으로 바로잡는 것이 안전합니다. 또한 ‘무엇이 있겠습니까?’는 대체로 뜻을 전달하지만 미래형 ἔσται를 ‘있게 되겠습니까?’로 드러낼 수 있습니다.
  naturalness: ‘보십시오’와 ‘모든 것을 버리고’는 현대 한국어 합쇼체에서 자연스럽고, 베드로의 강조와 제자도 맥락을 잘 전달합니다. ‘당신을’은 현대 대화체에서는 용례 제약이 있으나, 예수께 드리는 직접 발화라는 성서 번역 문맥에서는 2인칭 원문을 보존하는 가장 중립적인 선택입니다.
  terminology: ‘주님’은 신약에서 중요한 호칭이지만 이 절의 그리스어에는 κύριε 등의 호칭이 아니라 단순 2인칭 대명사 σοι가 있습니다. 따라서 이 절에서는 호칭을 삽입하지 않습니다. ‘베드로’, ‘예수’, ‘따르다’는 적절합니다.
  issues:
  - severity: medium
    issue: σοι를 ‘주님을’으로 번역하여 본문에 없는 호칭을 삽입함
    rationale: σοι는 ‘당신을/그대를’라는 2인칭 단수 대명사입니다. 문맥상 예수를 가리키기는 하지만, 원문이 사용하지 않은 ‘주님’이라는 호칭을 넣으면 발화의 표현을 바꾸고 신학적 경칭을 덧붙이게 됩니다.
  - severity: low
    issue: ἔσται의 미래 의미가 다소 약하게 드러남
    rationale: ‘그러면 우리에게 무엇이 있겠습니까?’도 문맥상 장래를 시사할 수 있으나, ‘무엇이 있게 되겠습니까?’가 미래형을 더 직접적으로 반영합니다.
  revised_text: 그때 베드로가 예수께 대답하여 말했습니다. 「보십시오, 우리는 모든 것을 버리고 당신을 따랐습니다. 그러면 우리에게 무엇이 있게 되겠습니까?」
