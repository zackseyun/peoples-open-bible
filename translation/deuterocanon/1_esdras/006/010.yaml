lexical_decisions:
- source_word: ἐπυνθανόμεθα
  chosen: we questioned
  alternatives:
  - we inquired of
  - we asked
  lexicon: LSJ
  rationale: The imperfect/middle form conveys an act of asking for information. 'Questioned' fits the official investigative
    setting better than the softer 'asked,' while remaining natural English.
- source_word: τῶν πρεσβυτέρων τούτων
  chosen: these elders
  alternatives:
  - these older men
  - these leaders
  lexicon: LSJ
  rationale: πρεσβύτεροι here refers to recognized community elders/leaders, not merely men advanced in age. 'Elders' preserves
    the social-political role.
- source_word: Τίνος ὑμῖν προστάξαντος
  chosen: Who commanded you
  alternatives:
  - Who gave you the order
  - By whose command
  lexicon: LSJ
  rationale: The question asks whose command authorized the works; the existing main wording 'Who commanded you' is retained.
- source_word: οἰκοδομεῖτε
  chosen: to build
  alternatives:
  - you are building
  - to rebuild
  lexicon: LSJ
  rationale: The finite Greek question is expressed in the existing English construction 'Who commanded you to build'; the
    restored second predicate is coordinated under the same construction.
- source_word: τὸν οἶκον τοῦτον
  chosen: this house
  alternatives:
  - this temple
  - this building
  lexicon: LSJ
  rationale: οἶκος literally means 'house.' In this context it refers to the temple, but 'house' preserves the source wording
    and biblical idiom without over-specifying beyond the Greek.
- source_word: τὰ ἔργα ταῦτα ἐθεμελιοῦτε
  chosen: lay the foundations of these works
  alternatives:
  - establish these works
  rationale: The checked printed question includes this second foundation predicate before the next inline verse. English
    coordinates it with 'to build' under the retained authorization question. This is a translation of the restored printed
    clause, not a new lexicon consultation.
