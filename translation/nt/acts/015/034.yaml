lexical_decisions:
- source_word: δοκέω
  chosen: it seemed good
  alternatives:
  - he decided
  - it pleased
  - he resolved
  lexicon: BDAG
  rationale: The impersonal use of δοκέω with the dative (τῷ Σίλᾳ) idiomatically means 'it seemed good to [someone]' or 'someone resolved.' 'It seemed good' maintains the exact syntactic structure of the Greek.
- source_word: ἐπιμένω
  chosen: to remain
  alternatives:
  - to stay
  - to tarry
  - to continue
  lexicon: BDAG
  rationale: A compound of μένω (to remain), ἐπιμένω accurately captures the sense of continuing or staying in a specific location, fitting the context of Silas choosing not to depart with the others.
- source_word: αὐτοῦ
  chosen: there
  alternatives:
  - in that place
  - here
  lexicon: BDAG
  rationale: Used here as an adverb of place, referring back to Antioch where the believers currently were.
