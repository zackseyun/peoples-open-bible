lexical_decisions:
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_korean: 내 마음
  alternatives_korean:
  - 내 심장
  - 내 속마음
  - 내 속
  lexicon: HALOT
  rationale: 히브리어 לֵב/לֵבָב은 사고와 감정의 중심인 ‘마음’을 가리키므로, 시적 문맥에서 자연스럽고 현대적인 ‘내 마음’으로 옮겼습니다.
- source_word: יָחִיל
  english_pob_choice: writhes
  chosen_korean: 뒤틀리고
  alternatives_korean:
  - 떨리고
  - 고통스러워하고
  - 몸부림치고
  lexicon: HALOT
  rationale: 이 동사는 떨림, 몸부림, 극심한 고통의 뉘앙스를 모두 가질 수 있는데, 문맥상 단순한 두려움보다 내면의 격렬한 요동을 살리는 표현이 필요하여 ‘뒤틀리고’로 옮겼습니다.
- source_word: אֵימוֹת מָוֶת
  english_pob_choice: the terrors of death
  chosen_korean: 죽음의 두려움
  alternatives_korean:
  - 죽음의 공포
  - 죽음의 위협
  - 죽음의 전율
  lexicon: HALOT
  rationale: 복수형 אֵימוֹת은 ‘두려움들/공포들’의 중첩된 강도를 드러내므로, 한국어에서는 복수 표지를 직접 두기보다 자연스러운 ‘죽음의 두려움’으로 압축해 강도를 보존했습니다.
- source_word: נָפְלוּ עָלַי
  english_pob_choice: have fallen upon me
  chosen_korean: 나에게 덮쳐왔습니다
  alternatives_korean:
  - 내게 떨어졌습니다
  - 내 위에 내렸습니다
  - 나를 덮쳤습니다
  lexicon: HALOT
  rationale: ‘떨어지다’의 단순한 물리적 이미지보다, 시편의 절박한 정서를 살리는 한국어 관용으로서 ‘덮쳐오다’가 완료된 압박감을 가장 잘 전달합니다.
theological_decisions:
- issue: 시적 현재감의 처리
  chosen_reading: 완료형으로 번역하되 현재적 압박이 남아 있는 상태를 드러내기 위해 ‘-왔습니다’를 사용했습니다.
  alternative_readings:
  - ‘덮쳤습니다’
  - ‘덮쳐 있습니다’
  rationale: 히브리어 완료형 נָפְלוּ는 이미 닥친 현실을 말하지만, 시의 정서는 그 결과가 지금도 지속되는 상태입니다. 그래서 사건성과 잔존 압박을 함께 살렸습니다.
  doctrine_reference: 시편 탄식시의 시적 시제 처리
