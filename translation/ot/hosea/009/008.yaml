  from: Ephraim’s watchman is with my God[a]; the prophet is a fowler’s snare on all his ways[b], and hostility is in the house of his God.
  to: The prophet is a watchman over Ephraim for my God[a], yet a birdcatcher’s snare lies along every path he takes[b], and hostility awaits him in the house of his God.
  rationale: The earlier deliberation read the prophet as a snare, but the Hebrew can instead make the prophet the topic and the snare something encountered on his paths. The watchman’s association with the speaker’s God and the repeated hostility support a true prophet under attack; the prior construal and the pronoun distinction remain preserved.
