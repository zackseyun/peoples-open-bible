id: NUM.30.1
reference: Numbers 30:1
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
translation:
  text: Moses told the Israelites all these things, just as Yahweh had commanded him.
  philosophy: dynamic
lexical_decisions:
- source_word: וַיֹּאמֶר
  chosen: spoke
  alternatives:
  - said
  lexicon: HALOT
  rationale: Though the verb is formally 'said,' English idiom with an indirect object plus summary content is smoother as 'spoke to.' This preserves the speech act without implying direct quotation.
- source_word: בְּנֵי יִשְׂרָאֵל
  chosen: the sons of Israel
  alternatives:
  - the children of Israel
  - the Israelites
  lexicon: HALOT
  rationale: This is the literal Hebrew expression. Per the gender-accurate policy, 'sons' is retained rather than neutralizing to 'children' or 'Israelites,' since the phrase is a standard covenantal ethnonym built on the masculine plural construct.
- source_word: כְּכֹל אֲשֶׁר
  chosen: according to all that
  alternatives:
  - all that
  - just as everything that
  lexicon: HALOT
  rationale: The prefixed כ conveys conformity ('according to, in accordance with'), not merely content. 'According to all that' best reflects the Hebrew construction while remaining natural English.
- source_word: צִוָּה
  chosen: had commanded
  alternatives:
  - commanded
  lexicon: HALOT
  rationale: 'English past perfect clarifies the sequence: the LORD''s command to Moses precedes Moses'' speaking to Israel.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: אֶת מֹשֶׁה
  chosen: Moses
  alternatives:
  - to Moses
  lexicon: HALOT
  rationale: The direct-object marker אֶת indicates that Moses is the object of 'had commanded.' English requires the preposition 'to' with 'command' in many contexts, but 'commanded Moses' is idiomatic and more formally aligned here.
