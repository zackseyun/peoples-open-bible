translation:
  text: Judas and his men pursued them down the slope of Beth-horon as far as the plain. About eight hundred of the enemy fell, but the rest fled into the land of the Philistines.
  philosophy: dynamic
lexical_decisions:
- source_word: ἐδίωκον
  chosen: pursued
  alternatives:
  - were pursuing
  - chased
  lexicon: LSJ
  rationale: Imperfect verb describing continued action in narrative; 'pursued' gives natural English narrative style while preserving the sense of active chase.
- source_word: ἐν τῇ καταβάσει
  chosen: down the descent
  alternatives:
  - on the descent
  - in the descent/pass
  lexicon: LSJ
  rationale: κατάβασις denotes a descent or downward route. 'Down the descent' captures both the topographical feature and the motion implied by the pursuit.
- source_word: Βαιθωρὼν
  chosen: Beth-horon
  alternatives:
  - Beth Horon
  rationale: Standard transliteration of the place name; hyphenated form is conventional and readable in English.
- source_word: ἕως τοῦ πεδίου
  chosen: as far as the plain
  alternatives:
  - as far as the plain country
  - to the plain
  lexicon: LSJ
  rationale: πέδιον means 'plain' or level ground. 'As far as the plain' preserves the boundary sense of ἕως and the geographical contrast with the descent.
- source_word: ἔπεσον ἀπʼ αὐτῶν
  chosen: about eight hundred of them fell
  alternatives:
  - eight hundred of them fell
  - from among them eight hundred fell
  - about eight hundred men fell from their side
  lexicon: LSJ
  rationale: The idiom means casualties from among the pursued force. Because ἀπό with numerals in such contexts can indicate approximation, 'about eight hundred of them fell' is a careful, natural rendering without over-specifying manner of death.
- source_word: εἰς ἄνδρας ὀκτακοσίους
  chosen: about eight hundred
  alternatives:
  - eight hundred men
  - some eight hundred men
  lexicon: LSJ
  rationale: The phrase gives the number of men who fell. English can omit repeating 'men' after 'them' without loss; 'about' reflects the idiomatic force of εἰς with a numeral.
- source_word: οἱ δὲ λοιποὶ
  chosen: but the rest
  alternatives:
  - and the rest
  - the remaining men
  lexicon: LSJ
  rationale: δέ marks contrast with those who fell; 'but the rest' preserves that contrast cleanly.
- source_word: ἔφυγον εἰς γῆν Φυλιστιείμ
  chosen: fled into the land of the Philistines
  alternatives:
  - fled to Philistia
  - escaped into the land of Philistia
  lexicon: LSJ
  rationale: The Greek literally refers to the land of the Philistines. This more transparent rendering stays close to the source while remaining idiomatic.
