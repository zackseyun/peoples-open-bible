source:
  edition: WLC
  text: כִּ֤י לֹ֣א בְ֭/מוֹת/וֹ יִקַּ֣ח הַ/כֹּ֑ל לֹא יֵרֵ֖ד אַחֲרָ֣י/ו כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/017.yaml
  text: For at his death he will take nothing[a][b][c]; his glory will not go down after him.
  footnotes:
  - marker: a
    text: The phrase 'will not go down after him' likely refers to death, the grave, or Sheol, but the Hebrew leaves the destination implicit.
    reason: alternative_reading
  - marker: b
    text: '''His glory'' may also mean his honor, splendor, or wealth/status.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he will take none of it'; literally, 'he will not take the whole/all.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그가 죽을 때 아무것도[a] 가져가지 못하며, 그의 영광[b]도 그를 따라 내려가지[c] 않기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 모든 것을 가져가지 못하며’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영광’은 그의 명예, 위상, 화려함 또는 부를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내려가지’는 죽음과 관련된 하강의 이미지를 나타냅니다. 무덤이나 스올을 암시할 수 있으나, 히브리어 본문은 목적지를 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל + תִּירָא
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
