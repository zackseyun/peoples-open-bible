id: PRO.15.6
reference: Proverbs 15:6
source:
  edition: WLC
  text: בֵּ֣ית צַ֭דִּיק חֹ֣סֶן רָ֑ב וּ/בִ/תְבוּאַ֖ת רָשָׁ֣ע נֶעְכָּֽרֶת׃
translation:
  text: In the house of the righteous there is great wealth, but the income of the wicked is beset by trouble[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “the income of the wicked comes to ruin.”
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּית
  chosen: house
  alternatives:
  - household
  - home
  lexicon: HALOT
  rationale: Construct form with צַדִּיק, denoting the house/estate of the righteous person. 'House' preserves the concrete image and can naturally imply household possessions and condition.
- source_word: צַדִּיק
  chosen: the righteous
  alternatives:
  - a righteous man
  - the just
  lexicon: HALOT
  rationale: Used substantivally for a righteous person in proverbial contrast with רָשָׁע. 'The righteous' is idiomatic in English and preserves the representative/generic singular force without over-specifying gender.
- source_word: חֹסֶן
  chosen: wealth
  alternatives:
  - treasure
  - riches
  - security
  lexicon: HALOT
  rationale: The noun can denote wealth, treasure, or resources. In this antithetical proverb, paired with agricultural/economic תְבוּאָה, 'wealth' best captures material abundance in the righteous person's house.
- source_word: רָב
  chosen: great
  alternatives:
  - much
  - abundant
  lexicon: HALOT
  rationale: Modifies חֹסֶן to indicate abundance. 'Great wealth' is natural English and preserves the sense of largeness/abundance.
- source_word: וּבִתְבוּאַת
  chosen: but the income of
  alternatives:
  - and in the produce of
  - but in the harvest of
  - but in the revenue of
  lexicon: HALOT
  rationale: “Income” is a defensible contextual rendering of yield or produce. English need not retain the Hebrew preposition once the noun serves as subject.
- source_word: רָשָׁע
  chosen: the wicked
  alternatives:
  - a wicked man
  - the guilty
  lexicon: HALOT
  rationale: Substantival adjective in antithesis to צַדִּיק. 'The wicked' is the standard and natural rendering for the representative singular.
- source_word: נֶעְכָּרֶת
  chosen: is troubled
  alternatives:
  - it is troubled
  - it is ruined
  - it is disturbed
  lexicon: HALOT
  rationale: The Niphal form predicates disturbance or ruin of the income/yield itself. This avoids converting it into an active causative statement.
