review_pass:
  verdict: revise
  source_fidelity: 핵심 명령인 피를 먹지 말 것과 피를 덮을 것은 대체로 반영했지만, ‘피째 먹는’은 원문의 ‘피와 함께 먹는’을 부정확하고 비자연스럽게 옮겼으며, ‘가리라’는 명령법과 합쇼체 문체를 따르지 못합니다.
  naturalness: ‘피째 먹는 사람’, ‘그들이 여러분 앞에서’, ‘받았음이니라’는 현대 표준어 합쇼체로 자연스럽지 않습니다. 주어를 생략하여 수신자에게 향한 금지를 자연스럽게 표현하고, 명령과 근거를 현대적인 문장으로 정리하는 것이 좋습니다.
  terminology: ‘피를 덮으십시오’는 Ge'ez 동사와 영어 감사 이력의 ‘Cover the blood’를 정확히 반영합니다. ‘모든 육체’는 원문의 포괄적 표현을 보존하되, 한국어에서 의미가 분명하도록 ‘모든 육체와 함께’로 옮깁니다.
  issues:
  - severity: medium
    issue: ‘피째 먹는 사람’
    rationale: 원문은 ‘피와 함께 먹는 자’라는 뜻이며, ‘피째’는 한국어에서 부자연스럽고 의미를 흐릴 수 있습니다.
  - severity: medium
    issue: ‘피를 가리라’
    rationale: 원문은 피를 덮으라는 명령이며, ‘가리라’는 미래·서술형처럼 들리고 요구된 합쇼체 문체에도 맞지 않습니다.
  - severity: low
    issue: ‘그들이 여러분 앞에서 피를 먹지 않도록’
    rationale: 원문의 경계 명령은 수신자에게 직접 향합니다. 한국어에서는 ‘피를 먹지 않도록 조심하십시오’로 주어를 생략하는 편이 자연스럽고 문맥상 적절합니다.
  - severity: low
    issue: ‘증언하라는 명령을 받았음이니라’
    rationale: 원문의 ‘내가 명령받아 너희에게 증언하였다/증언하도록 하였다’의 인과를 현대 합쇼체로 표현할 필요가 있습니다.
  revised_text: 그리고 피와 함께 먹는 사람처럼 되지 마십시오. 피를 먹지 않도록 조심하십시오. 피를 덮으십시오. 이는 내가 여러분과 여러분의 자녀와 모든 육체에게 함께 증언하도록 명령받았기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “피를 쏟아 내십시오.”
    reason: 영어 POB 감사 이력에 남아 있는 대체 번역을 보존합니다. 그러나 본문은 Ge'ez 원문과 최신 감사 결정에 따라 ‘피를 덮으십시오’로 번역합니다.
  revision_rationale: 원문의 금지와 명령을 현대 표준어 합쇼체로 명료하게 옮겼습니다. 특히 논쟁의 여지 없이 원문 및 감사 이력이 지지하는 ‘피를 덮으십시오’를 유지했으며, ‘모든 육체’라는 포괄 표현도 보존했습니다.
