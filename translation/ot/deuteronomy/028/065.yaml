id: DEU.28.65
reference: Deuteronomy 28:65
source:
  edition: WLC
  text: וּ/בַ/גּוֹיִ֤ם הָ/הֵם֙ לֹ֣א תַרְגִּ֔יעַ וְ/לֹא יִהְיֶ֥ה מָנ֖וֹחַ לְ/כַף רַגְלֶ֑/ךָ וְ/נָתַן֩ יְהוָ֨ה לְ/ךָ֥ שָׁם֙ לֵ֣ב רַגָּ֔ז וְ/כִלְי֥וֹן עֵינַ֖יִם וְ/דַֽאֲב֥וֹן נָֽפֶשׁ־־׃
translation:
  text: Among those nations you will find no rest, no resting place for the sole of your foot. There Yahweh will give you a trembling heart, eyes worn out with longing[a], and anguish of soul.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'failing eyesight.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַרְגִּיעַ
  chosen: you will find no rest
  alternatives:
  - you will not be at ease
  - you will not have rest
  lexicon: HALOT
  rationale: Hiphil of רגע here conveys causing oneself to settle/be at rest, idiomatically 'find rest' or 'be at ease.' 'Find no rest' is natural English and matches the exile-curse context without over-paraphrasing.
- source_word: מָנוֹחַ
  chosen: resting place
  alternatives:
  - rest
  - repose
  lexicon: HALOT
  rationale: The noun denotes a place or state of rest. With 'for the sole of your foot,' the concrete sense 'resting place' best fits the idiom.
- source_word: לְכַף רַגְלֶךָ
  chosen: for the sole of your foot
  alternatives:
  - for your foot
  - for the bottom of your foot
  lexicon: HALOT
  rationale: כַּף with רֶגֶל refers specifically to the sole/palm-like underside. The established English idiom 'sole of your foot' is precise and readable.
- source_word: וְנָתַן יְהוָה לְךָ שָׁם
  chosen: and there the LORD will give you
  alternatives:
  - and the LORD will give you there
  lexicon: HALOT
  rationale: Retains the Hebrew word order emphasis on location ('there') while keeping smooth English. The subject is explicitly YHWH, rendered per doctrine as 'the LORD.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: לֵב רַגָּז
  chosen: a trembling heart
  alternatives:
  - an anxious heart
  - a quaking heart
  - an agitated heart
  lexicon: HALOT
  rationale: רַגָּז conveys trembling, agitation, or inner turmoil. 'Trembling heart' preserves the vivid bodily-emotional image and the curse's psychological force.
- source_word: כִּלְיוֹן עֵינַיִם
  chosen: failing eyes
  alternatives:
  - wasting eyes
  - languishing eyes
  lexicon: HALOT
  rationale: כִּלְיוֹן denotes wasting away, consumption, or failing. In English, 'failing eyes' communicates depletion and despair more naturally than the more literal but awkward 'wasting eyes.'
- source_word: דַּאֲבוֹן נָפֶשׁ
  chosen: anguish of soul
  alternatives:
  - sorrow of soul
  - pain of soul
  - despair of soul
  lexicon: HALOT
  rationale: דַּאֲבוֹן is pain, sorrow, or anguish. 'Anguish of soul' preserves the intensity and keeps נֶפֶשׁ as 'soul' rather than flattening it to mere emotion.
