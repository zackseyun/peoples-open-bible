id: ECC.12.13
reference: Ecclesiastes 12:13
source:
  edition: WLC
  text: ס֥וֹף דָּבָ֖ר הַ/כֹּ֣ל נִשְׁמָ֑ע אֶת הָ/אֱלֹהִ֤ים יְרָא֙ וְ/אֶת מִצְוֺתָ֣י/ו שְׁמ֔וֹר כִּי זֶ֖ה כָּל הָ/אָדָֽם־־־־׃
translation:
  text: 'Now that everything has been heard, here is the conclusion: fear God and keep his commandments, for this is the whole duty of humanity[a].'
  footnotes:
  - marker: a
    text: Alternatively, “for this applies to everyone.” Literally, “for this is the whole of humanity.”
    reason: alternative_reading
  philosophy: dynamic
