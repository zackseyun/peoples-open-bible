id: PSA.93.5
reference: Psalms 93:5
source:
  edition: WLC
  text: עֵֽדֹתֶ֨י/ךָ נֶאֶמְנ֬וּ מְאֹ֗ד לְ/בֵיתְ/ךָ֥ נַאֲוָה קֹ֑דֶשׁ יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־׃
translation:
  text: Your decrees[a] are completely trustworthy; holiness befits your house[b], O Yahweh, forever.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “testimonies,” referring to God’s covenant declarations.
    reason: alternative_reading
  - marker: b
    text: God’s temple.
    reason: cultural_note
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  chosen: your testimonies
  alternatives:
  - your decrees
  - your statutes
  lexicon: HALOT
  rationale: עֵדוֹת commonly refers to divine testimonies/witnesses, especially covenantal declarations. 'Testimonies' preserves the lexical link without narrowing it to legal enactments alone, though 'decrees' or 'statutes' are possible in Psalmic context.
- source_word: נֶאֶמְנוּ
  chosen: are trustworthy
  alternatives:
  - are sure
  - are faithful
  - are confirmed
  lexicon: HALOT
  rationale: From אמן in the Niphal, conveying firmness, reliability, or trustworthiness. 'Are trustworthy' is natural modern English and communicates the predicate quality of God's testimonies.
- source_word: מְאֹד
  chosen: very
  alternatives:
  - exceedingly
  lexicon: HALOT
  rationale: Standard intensifier. 'Very' is idiomatic and sufficient in modern English.
- source_word: לְבֵיתְךָ
  chosen: your house
  alternatives:
  - your temple
  lexicon: HALOT
  rationale: בַּיִת literally means 'house.' In context it can denote the sanctuary/temple, but 'your house' preserves the Hebrew image and allows the cultic sense to remain implicit.
- source_word: נַאֲוָה
  chosen: befits
  alternatives:
  - is fitting for
  - is beautiful for
  - is becoming for
  lexicon: HALOT
  rationale: The verb conveys suitability or comeliness. 'Befits' is concise, dignified, and captures the sense that holiness properly belongs to God's house.
- source_word: קֹדֶשׁ
  chosen: holiness
  alternatives:
  - holy splendor
  - sanctity
  lexicon: HALOT
  rationale: As an abstract noun here, 'holiness' best fits the predication with נַאֲוָה. It expresses the quality appropriate to God's house.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: לְאֹרֶךְ יָמִים
  chosen: forever
  alternatives:
  - forever
  - for many days
  - throughout all days
  lexicon: HALOT
  rationale: Renders the duration idiom naturally while preserving its literal form in a note.
- source_word: נֶאֶמְנוּ מְאֹד
  chosen: are completely trustworthy
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English expression for the strongly intensified assertion of reliability.
