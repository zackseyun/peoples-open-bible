id: EZR.1.1
reference: Ezra 1:1
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה מִ/פִּ֣י יִרְמְיָ֑ה הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כֹּ֣רֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃
translation:
  text: 'In the first year of Cyrus king of Persia[a], to fulfill the word of Yahweh spoken through Jeremiah[b], Yahweh stirred up the spirit of Cyrus king of Persia. Cyrus issued a proclamation throughout his kingdom and also put it in writing:'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: This means Cyrus’s first year ruling Babylon, after his conquest of the city.
    reason: cultural_note
  - marker: b
    text: See Jeremiah 25:11–12 and 29:10.
    reason: cross_reference
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  chosen: In the first year
  alternatives:
  - And in the first year
  - In the first year
  - Now in the first year
  lexicon: HALOT
  rationale: 'The conjunction plus temporal phrase introduces a new narrative stage. ''Now'' captures the discourse transition naturally in English while preserving the temporal setting; ''first year'' is the plain sense of the construct with אַחַת. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  chosen: of Cyrus king of Persia
  alternatives:
  - of Cyrus, king of Persia
  lexicon: HALOT
  rationale: Standard genitival dating formula. Personal name is transliterated per project philosophy; royal title is translated.
- source_word: לִכְלוֹת
  chosen: so that ... might be fulfilled
  alternatives:
  - to complete
  - when ... was completed
  - to bring to an end
  lexicon: HALOT
  rationale: With דְּבַר יְהוָה, the infinitive expresses the bringing to completion of the LORD's word. In idiomatic English for prophetic realization, 'might be fulfilled' best conveys the sense without woodenly saying 'completed.'
- source_word: דְּבַר יְהוָה
  chosen: the word of the LORD
  alternatives:
  - the promise of the LORD
  - the message of the LORD
  lexicon: HALOT
  rationale: דָּבָר here refers to the prophetic word/promise. 'Word' preserves the broad biblical idiom and allows the fulfillment motif to remain explicit.
- source_word: מִפִּי יִרְמְיָה
  chosen: spoken by Jeremiah
  alternatives:
  - from the mouth of Jeremiah
  - by the mouth of Jeremiah
  lexicon: HALOT
  rationale: Literally 'from the mouth of Jeremiah,' an idiom for prophetic mediation. 'Spoken by Jeremiah' is clear modern English and preserves Jeremiah as the human instrument.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: הֵעִיר
  chosen: stirred up
  alternatives:
  - awakened
  - moved
  - aroused
  lexicon: HALOT
  rationale: The hiphil of עור here denotes inciting or prompting someone internally to action. 'Stirred up' is a standard and accurate rendering that preserves divine initiative without over-specifying mechanism.
- source_word: אֶת רוּחַ כֹּרֶשׁ
  chosen: the spirit of Cyrus
  alternatives:
  - the mind of Cyrus
  - the inner spirit of Cyrus
  lexicon: HALOT
  rationale: רוּחַ can denote spirit, disposition, or inner impulse. 'Spirit' preserves the Hebrew term's breadth and theological resonance; alternatives narrow the sense too much in the main text.
- source_word: וַיַּעֲבֶר קוֹל
  chosen: he sent a proclamation
  alternatives:
  - he caused a voice/proclamation to pass
  - he made a proclamation
  lexicon: HALOT
  rationale: The idiom literally means causing a message to circulate publicly. 'Sent a proclamation' is natural English and retains the official-public sense of קוֹל in this context.
- source_word: בְּכָל מַלְכוּתוֹ
  chosen: throughout all his kingdom
  alternatives:
  - through all his kingdom
  - in all his kingdom
  lexicon: HALOT
  rationale: The preposition and noun indicate dissemination across the whole realm. 'Throughout' best conveys geographic extent.
- source_word: וְגַם בְּמִכְתָּב
  chosen: and also in writing
  alternatives:
  - and also in a written document
  - and in writing as well
  lexicon: HALOT
  rationale: This phrase adds a written form alongside the oral proclamation. 'In writing' is concise and idiomatic.
- source_word: לֵאמֹר
  chosen: 'saying:'
  alternatives:
  - 'as follows:'
  lexicon: HALOT
  rationale: Standard introduction to direct discourse; 'saying:' is the most transparent rendering.
