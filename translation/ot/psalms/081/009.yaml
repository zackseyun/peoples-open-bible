id: PSA.81.9
reference: Psalms 81:9
source:
  edition: WLC
  text: לֹֽא יִהְיֶ֣ה בְ֭/ךָ אֵ֣ל זָ֑ר וְ/לֹ֥א תִ֝שְׁתַּחֲוֶ֗ה לְ/אֵ֣ל נֵכָֽר־׃
translation:
  text: You must have no foreign god among you, and you must not bow down to a god of a foreign land.
  philosophy: dynamic
lexical_decisions:
- source_word: יִהְיֶה
  chosen: You must have no
  alternatives:
  - There must be no
  - There shall be no
  lexicon: HALOT
  rationale: With the negation in this covenant address, the clause is a prohibition rather than a prediction. Direct second-person English matches the following command.
- source_word: בְּךָ
  chosen: among you
  alternatives:
  - within you
  lexicon: HALOT
  rationale: Israel is addressed corporately in the singular. 'Among you' is the natural English idiom for excluding foreign worship from the community.
- source_word: אֵל
  chosen: god
  alternatives:
  - mighty one
  - deity
  lexicon: HALOT
  rationale: In parallel with the worship prohibition, אֵל clearly refers to a deity. Lowercase 'god' is appropriate for false gods.
- source_word: זָר
  chosen: foreign
  alternatives:
  - strange
  lexicon: HALOT
  rationale: The adjective describes a god outside Israel's authorized worship and is paired with a near-synonym in the second colon.
- source_word: תִשְׁתַּחֲוֶה
  chosen: you must not bow down
  alternatives:
  - you shall not bow down
  - do not bow down
  lexicon: HALOT
  rationale: The negative imperfect carries prohibitive force. 'Must not' is clear direct English and parallels the first clause.
- source_word: לְאֵל
  chosen: to a ... god
  alternatives:
  - before a ... god
  lexicon: HALOT
  rationale: English idiom with 'bow down' normally takes 'to' here, adequately representing the Hebrew preposition ל in this worship context.
- source_word: נֵכָר
  chosen: alien
  alternatives:
  - foreign
  - strange
  lexicon: HALOT
  rationale: Using 'alien' preserves the Hebrew's poetic lexical variation without asserting a distinct category of deity.
- source_word: אֵל נֵכָר
  chosen: a god of a foreign land
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This expresses the foreign-land sense of נֵכָר naturally, avoids the misleading modern sense of “alien,” and preserves variation from the preceding אֵל זָר.
