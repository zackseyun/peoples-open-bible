  text: οἱ δὲ ἀσεβεῖς καθʼ ἃ ἐλογίσαντο ἕξουσιν ἐπιτιμίαν, οἱ ἀμελήσαντες τοῦ δικαίου καὶ τοῦ κυρίου ἀποστάντες.
  language: Greek
  pages:
