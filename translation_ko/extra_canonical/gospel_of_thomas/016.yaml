  to: 예수께서 말씀하셨습니다. “아마 사람들은 내가 세상에 평강을 던지러 왔다고 생각할 것입니다. 그러나 그들은 내가 땅 위에 분열을 던지러 왔다는 것을 알지 못합니다. 곧 불과 칼과 전쟁입니다. 한 집에 다섯이 있게 될 것이며, 셋은 둘을 거슬러 서고 둘은 셋을 거슬러 설 것입니다. 아버지는 아들을 거슬러, 아들은 아버지를 거슬러 설 것입니다. 그리고 그들은 홀로 있는 이들로 서게 될 것입니다.”[a][b][c]
