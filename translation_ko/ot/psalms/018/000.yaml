  rationale: 시편 표제의 관용구를 따라 음악적 인도자를 가리키는 기능을 간결하게 살렸습니다.
- source_word: לְעֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종
