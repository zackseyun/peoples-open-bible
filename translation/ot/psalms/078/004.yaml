revisions:
- timestamp: '2026-04-21T00:17:06Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/078/004.json
  category: awkward_english
  tier: 1
  from: telling to the coming generation
  to: we will tell the coming generation
  rationale: Rendering the Hebrew participle (מְסַפְּרִים) with an English participial phrase ('telling...') is grammatically valid but creates a slightly less forceful sentence structure. Recasting the phrase as a second main clause ('...; we will tell...') makes the connection between not hiding and actively telling more explicit and rhetorically stronger in English. This change would also naturally remove the slightly stiff preposition 'to' after 'telling'.
- timestamp: '2026-04-23T11:27:32Z'
  adjudicator: azure-gpt-5.4-revision-pass
  reviewer_model: gpt-5.4
  category: revision_pass
  from: We will not hide them from their children, we will tell the coming generation the praiseworthy deeds of the LORD, and his strength, and his wonders that he has done.
  to: We will not hide them from their children, telling the coming generation the praiseworthy deeds of the LORD, and his strength, and his wonders that he has done.
  rationale: Replaced the second finite clause ('we will tell') with the participial construction ('telling') to better reflect the Hebrew syntax and avoid an unnecessary repetition of 'we will.'
- timestamp: '2026-08-28T22:07:46Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: footnotes
  tier: 1
  from: We will not hide them from their children[a], telling the coming generation the praiseworthy deeds of Yahweh, and his strength[b], and his wonders that he has done.
  to: We will not hide them from their children; we will tell the coming generation the praises of Yahweh, his might, and the wonders he has done.
  rationale: The extant markers are attached to words other than those their notes explain and should be removed. “The praises of Yahweh” retains the lexical form and leaves its precise objective/subjective coloring less resolved than “praiseworthy deeds.” A finite English clause is acceptable for the participial Hebrew. The proposed em dash, however, makes Yahweh’s might and wonders look like an apposition defining “praises,” whereas the Hebrew presents coordinated items; commas preserve the coordination.
- timestamp: '2026-11-09T18:43:22Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: We will not hide them from their children; we will tell the coming generation the praises of Yahweh, his might, and the wonders he has done.
  to: We will not hide these things from their children; we will tell the coming generation of Yahweh’s praiseworthy deeds, his might, and the wonders he has done.
  rationale: I retained the stronger finite clause and the latest revision’s coordination of deeds, might, and wonders. Although that revision preferred “praises” for lexical breadth, the documented earlier reasoning and the narrative context support making the praiseworthy acts explicit.
