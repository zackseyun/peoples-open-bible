  from: Hear, O Israel, behold, I am going the way of all the earth; but do not withdraw
    from the statutes of the Mighty One.
  to: But you, do not withdraw from the way of the law, but guard and admonish the
    people who remain, lest they withdraw from the commandments of the Mighty One.
  rationale: The current draft appears to be a hallucinated conflation of 44:1 and
    44:2. It adds 'Hear, O Israel' (which is not in the Syriac), pulls 'going the
    way of all the earth' from 44:1, and completely omits the central clause of 44:2
    ('but guard and admonish the people who remain'). The Syriac for 44:2 begins with
    'But you, do not withdraw...' (ܐܢܬܘܢ ܕܝܢ ܠܐ ܬܥܕܘܢ).
