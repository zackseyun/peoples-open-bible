  preserved_meaning: The greeting still addresses everyone in Rome whom God loves.
  reasoning_layer_used: POB lexical decisions and epistolary context
  rationale: Direct address and “loved” make the greeting natural without weakening God’s love.
- pob_phrase: called to be saints
  simplified_phrase: called holy people
  preserved_meaning: The recipients are described as people whom God has called and who are holy.
  reasoning_layer_used: POB lexical and theological decisions on κλητοῖς ἁγίοις
