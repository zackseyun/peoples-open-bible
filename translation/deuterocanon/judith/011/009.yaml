  text: καὶ νῦν λόγος ὃν ἐλάλησεν Ἀχιὼρ ἐν τῇ συνεδρείᾳ σου, ἠκούσαμεν τὰ ῥήματα αὐτοῦ, ὅτι περιεποίησαντο αὐτὸν οἱ ἄνδρες Βαιτυλουά, καὶ ἀπήγγειλεν αὐτοῖς πάντα ὅσα ἐξελάλησεν παρὰ σοί.
