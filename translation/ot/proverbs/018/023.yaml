id: PRO.18.23
reference: Proverbs 18:23
source:
  edition: WLC
  text: תַּחֲנוּנִ֥ים יְדַבֶּר רָ֑שׁ וְ֝/עָשִׁ֗יר יַעֲנֶ֥ה עַזּֽוֹת־׃
translation:
  text: The poor man pleads, but the rich man answers harshly.
  philosophy: dynamic
lexical_decisions:
- source_word: תַּחֲנוּנִים
  chosen: pleads
  alternatives:
  - supplications
  - entreaties
  - pleading
  lexicon: HALOT
  rationale: In combination with the verb of speaking, the noun denotes earnest pleading or entreaty. English “pleads” idiomatically expresses the combined force.
- source_word: יְדַבֶּר
  chosen: pleads
  alternatives:
  - speaks with
  - utters
  - makes
  lexicon: HALOT
  rationale: The English verb incorporates the Hebrew speaking verb together with its entreaty-object, avoiding the wooden construction “speaks with pleas.”
- source_word: רָשׁ
  chosen: the poor man
  alternatives:
  - a poor man
  - the poor
  - the needy man
  lexicon: HALOT
  rationale: The adjective/substantive refers to a poor person. 'The poor man' preserves the singular representative force typical of Proverbs and follows the project's gender-accurate principle for grammatically masculine generic forms.
- source_word: וְעָשִׁיר
  chosen: but the rich man
  alternatives:
  - and the rich man
  - while the rich man
  - but a rich man
  lexicon: HALOT
  rationale: Though the conjunction is formally 'and,' the proverb sets up a contrast between poor and rich, so 'but' best conveys the adversative sense in idiomatic English. 'The rich man' mirrors the singular representative masculine form.
- source_word: יַעֲנֶה
  chosen: answers
  alternatives:
  - responds
  - replies
  lexicon: HALOT
  rationale: ענה in Qal commonly means 'answer/respond.' 'Answers' is the most direct and idiomatic choice in this antithetical proverb.
- source_word: עַזּוֹת
  chosen: harshly
  alternatives:
  - roughly
  - with hard words
  - boldly
  lexicon: HALOT
  rationale: From עזז/עז, the plural feminine form here functions adverbially, describing the manner of the rich man's response. In context the sense is not commendable boldness but hard, severe, or brusque speech. 'Harshly' captures the social contrast of the proverb better than the more ambiguous 'boldly'.
