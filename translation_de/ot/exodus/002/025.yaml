  text: God saw the sons of Israel, and God knew.
translation:
  language: de
  text: Gott sah die Israeliten, und Gott wusste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich „die Söhne Israels“, bezeichnet hier aber das Volk Israel insgesamt; „die Israeliten“ gibt dies im modernen Deutschen natürlich und inklusiv wieder.
- source_word: וַיֵּדַע
  choice: und Gott wusste
  rationale: Das einfache Verb ידע bedeutet „wissen/kennen“. Die knappe, offene Formulierung bewahrt die im Hebräischen nicht ausdrücklich ergänzte Bedeutung, statt sie als „nahm sich ihrer an“ oder „nahm Kenntnis“ auszudeuten.
theological_decisions:
- issue: Unausgesprochenes Objekt von וַיֵּדַע
  choice: „und Gott wusste“ ohne ergänztes Objekt
  alternative: „und Gott nahm sich ihrer an“ / „und Gott wusste um ihre Lage“
  rationale: Der hebräische Text lässt das Objekt und damit die genaue Nuance unausgesprochen. Die Übersetzung bewahrt diese theologisch gewichtige Offenheit und den abrupten Satzschluss.
translation_notes:
  register: Knappe, würdevolle Standardsprache. Die Wiederholung von „Gott“ bildet die hebräische Wiederholung von אֱלֹהִים ab; die ungewöhnliche Kürze des letzten Satzteils bleibt bewusst erhalten.
