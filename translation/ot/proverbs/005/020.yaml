  from: Why[a], my son[b], should you go astray with a strange woman and embrace the bosom of a foreign woman?
  to: Why, my son, should you go astray with a forbidden woman and embrace the bosom of a foreign woman?[a]
  rationale: The proposal correctly identifies the misplaced current markers, but “an outsider” fails to signal the feminine form and is less clear in this parallel pair. The negative “go astray” rightly preserves the verb’s moral force in this verse; the positive contextual development in verse 19 need not require an identical English gloss. “Forbidden woman” naturally conveys the contextual relational sense of זָרָה without treating ethnicity as the point. A single correctly attached note can explain both paired terms and the alternative sense of חֵק.
