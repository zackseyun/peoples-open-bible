lexical_decisions:
- source_word: לא נעדר ממנו כל שכל
  english_pob_choice: No understanding is lacking to him
  chosen_korean: 그에게는 어떤 이해도 부족하지 않고
  alternatives_korean:
  - 그에게는 어떤 깨달음도 빠지지 않고
  - 그에게는 아무 지혜도 모자라지 않고
  lexicon: שכל
  rationale: שכל을 단순한 ‘지식’보다 더 넓은 ‘이해’로 옮겨, 모든 사려와 분별이 결핍되지 않았다는 뜻을 직접 살렸습니다.
- source_word: כל דבר / οὐδὲ εἷς λόγος
  english_pob_choice: no word has escaped him
  chosen_korean: 어떤 말도 그를 지나치지 않았습니다
  alternatives_korean:
  - 어떤 말도 그에게서 숨지 않았습니다
  - 어떤 말도 그의 눈을 피해 가지 않았습니다
  lexicon: דבר / λόγος
  rationale: 히브리어의 ‘말/사건’ 가능성과 그리스어 λόγος의 ‘말’ 뜻을 함께 반영하되, POB의 확정된 영어처럼 ‘word’ 중심 의미를 유지했습니다.
- source_word: חלפו
  english_pob_choice: has escaped
  chosen_korean: 그를 지나치지 않았습니다
  alternatives_korean:
  - 그에게서 벗어나지 않았습니다
  - 그에게서 사라지지 않았습니다
  lexicon: חלף
  rationale: ‘지나가다, 스쳐 가다’의 동작상을 살려, 단순한 부재보다 ‘그의 인지 밖으로 지나가 버리지 않음’을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 지혜의 전지성 표현
  chosen_reading: 이 구절은 지혜가 모든 이해와 모든 말/표현을 완전히 파악하고 있음을 말하는 것으로 보아, 과장 없이 전면적 인지를 나타내는 서술로 유지했습니다.
  alternative_readings:
  - 지혜가 모든 것을 알고 있다는 신격화로 읽는 해석
  - 단지 뛰어난 통찰력에 대한 문학적 과장으로 약화하는 해석
  rationale: 문맥상 지혜의 찬양이지만, 본문 자체는 과도한 신학적 확장 없이 ‘빠짐 없음’을 말하므로 수사적 강도를 보존했습니다.
  doctrine_reference: 잠언적 지혜 전통 / 집회서의 지혜 찬양
