  naturalness: ‘지극히 슬퍼서 울었습니다’는 자연스럽고 합쇼체에도 맞습니다. 그러나 여성 인물을 가리키는 영어 감사 기록 및 해당 구절의 문맥과 달리 ‘그는’은 남성 대명사이므로 ‘그녀는’으로 고쳐야 합니다.
  terminology: 특별한 신학 용어나 고유명사는 없습니다. ‘지극히 슬퍼서’는 λίαν의 강도를 무리 없이 반영하며, ‘울었습니다’는 ἔκλαιεν에 적절합니다.
