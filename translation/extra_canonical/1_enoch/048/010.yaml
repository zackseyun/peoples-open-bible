translation:
  text: On the day of their distress there will be rest upon the earth. Before them they will fall and will not
    rise. There is no one who will take hold of them with his hand and raise them, because they denied the Lord
    of Spirits and his Anointed One.[a] May the name of the Lord of Spirits be blessed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Anointed One renders the title with its his suffix; the source does not replace it with an additional
      personal name here. The hand expression uses the take-up or support verb, supported by Dillmann1865 column225
      with an explicit48:10 citation. His hand is retained, not changed to the fallen people’s own hands. The whole
      unit continues from printed91 onto92.
    reason: lexical_alternative
