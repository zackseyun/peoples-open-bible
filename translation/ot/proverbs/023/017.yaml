id: PRO.23.17
reference: Proverbs 23:17
source:
  edition: WLC
  text: אַל יְקַנֵּ֣א לִ֭בְּ/ךָ בַּֽ/חַטָּאִ֑ים כִּ֥י אִם בְּ/יִרְאַת יְ֝הוָ֗ה כָּל הַ/יּֽוֹם־־־־׃
translation:
  text: Do not let your heart envy sinners; instead, fear Yahweh all day long.
  philosophy: dynamic
lexical_decisions:
- source_word: אַל
  chosen: Do not
  alternatives:
  - Let not
  lexicon: HALOT
  rationale: Standard negative particle used for prohibition; idiomatic English imperative is 'Do not.'
- source_word: יְקַנֵּא
  chosen: envy
  alternatives:
  - be jealous of
  - be envious of
  lexicon: HALOT
  rationale: The verb קנא in this context denotes jealous/envying desire toward others' apparent prosperity. 'Envy' is the most natural concise English rendering here.
- source_word: לִבְּךָ
  chosen: your heart
  alternatives:
  - your mind
  - you
  lexicon: HALOT
  rationale: Hebrew 'heart' is retained rather than flattened, since it naturally conveys the inner disposition in English and preserves the imagery of the source.
- source_word: בַּחַטָּאִים
  chosen: sinners
  alternatives:
  - sinful people
  lexicon: HALOT
  rationale: The noun plainly refers to those characterized by sin. 'Sinners' is direct, idiomatic, and preserves the moral category.
- source_word: כִּי אִם
  chosen: instead
  alternatives:
  - rather
  - except that
  lexicon: HALOT
  rationale: After the negative clause, it introduces the contrasted positive orientation.
- source_word: בְּיִרְאַת יְהוָה
  chosen: fear Yahweh
  alternatives:
  - in fearing the LORD
  - in reverence for the LORD
  lexicon: HALOT
  rationale: English requires a predicate; this verbal idiom expresses the source phrase naturally without adding “continue.”
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: כָּל הַיּוֹם
  chosen: all day long
  alternatives:
  - all the day
  - continually
  lexicon: HALOT
  rationale: The phrase denotes duration through the whole day. 'All day long' is natural modern English and preserves the temporal emphasis.
