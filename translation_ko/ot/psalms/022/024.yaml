- from: 주님을 경외하는 너희는 그분을 찬양하십시오! 야곱의 모든 자손아, 그분을 존중하십시오! 이스라엘의 모든 자손아, 그분 앞에서 두려워하십시오![a]
  to: 이는 그분께서 고난받는 이의 고난을 멸시하지도 혐오하지도 않으셨고, 그에게서 얼굴을 숨기지도 않으셨으며, 그가 그분께 부르짖을 때 들으셨기 때문입니다.[a]
  rationale: 제공된 WLC 본문에 맞추어 초안 전체를 교체했습니다. כִּי를 이유를 제시하는 ‘이는 … 때문입니다’로, 두 부정 동사를 ‘멸시하지도 혐오하지도 않으셨고’로 옮겨 강도 있는 병렬을 보존했습니다. עֱנוּת עָנִי는 본문에서 고난의 의미를 유지하고, 경제적 빈곤·비참함 또는 굴욕의 가능한 뉘앙스는 각주에 남겼습니다. הִסְתִּיר פָּנָיו의 비유적 표현과 대명사의 지시 관계도 보존했습니다.
