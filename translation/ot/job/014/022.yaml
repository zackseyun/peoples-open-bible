  rationale: The verse poetically juxtaposes bodily pain and inward grief. Translating נֶפֶשׁ as 'soul' preserves the tension and imagery without making a dogmatic claim about human constitution beyond what the text states.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
