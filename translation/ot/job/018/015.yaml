id: JOB.18.15
reference: Job 18:15
source:
  edition: WLC
  text: תִּשְׁכּ֣וֹן בְּ֭/אָהֳל/וֹ מִ/בְּלִי ל֑/וֹ יְזֹרֶ֖ה עַל נָוֵ֣/הוּ גָפְרִֽית־־׃
translation:
  text: What is not his dwells in his tent[a]; sulfur[b] is scattered over his dwelling.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'The Hebrew is difficult. Another possible reading takes sulfur as the delayed subject: “Sulfur dwells in his tent, though it is not his.”'
    reason: alternative_reading
  - marker: b
    text: Sulfur is associated with fiery destruction, as in Genesis 19:24.
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  chosen: dwells
  alternatives:
  - she dwells
  - there dwells
  - nothing of his dwells
  lexicon: HALOT
  rationale: The verb means “dwells”; English requires an expressed subject.
- source_word: בְּאָהֳלוֹ
  chosen: in his tent
  alternatives:
  - in his tent-home
  - in his dwelling
  lexicon: HALOT
  rationale: אֹהֶל is literally 'tent.' Retaining 'tent' preserves the concrete imagery common in Job, though the broader sense of household/dwelling is possible.
- source_word: מִבְּלִי לוֹ
  chosen: what is not his
  alternatives:
  - belonging to none of his
  - without anything of his
  - because it is not his
  lexicon: HALOT
  rationale: This renders the elliptical phrase without the unsupported temporal implication of “no longer his.”
- source_word: יְזֹרֶה
  chosen: is scattered
  alternatives:
  - he scatters
  - one scatters
  - is strewn
  lexicon: HALOT
  rationale: From זרה in the Piel, 'to scatter, strew.' Although morphologically 3ms active, Hebrew often uses such forms impersonally. English passive best conveys the scene without forcing an explicit unnamed agent.
- source_word: עַל נָוֵהוּ
  chosen: over his dwelling
  alternatives:
  - upon his pasture
  - over his habitation
  - upon his home
  lexicon: HALOT
  rationale: נָוֶה can denote abode, habitation, or pastureland depending on context. Here, in parallel with 'his tent,' 'dwelling' best fits the ruined-home imagery.
- source_word: גָפְרִית
  chosen: sulfur
  alternatives:
  - brimstone
  lexicon: HALOT
  rationale: גָפְרִית denotes sulfur/brimstone. 'Sulfur' is the clearer modern English term; 'brimstone' is traditional but archaic. The destructive connotation remains clear in context.
