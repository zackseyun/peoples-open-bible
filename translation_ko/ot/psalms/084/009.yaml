reference: Psalms 84:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מָ֭גִנֵּ/נוּ רְאֵ֣ה אֱלֹהִ֑ים וְ֝/הַבֵּ֗ט פְּנֵ֣י מְשִׁיחֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/009.yaml
  text: Look on our shield[a], O God, and look on the face of your anointed[b].
  footnotes:
  - marker: a
    text: Or “our protector.” The Hebrew reads “our shield,” a poetic metaphor that may refer either to God as protector or to the king.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “your anointed.” The word is the source of the term “Messiah”; in this context it most directly refers to the anointed king.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님이여, 우리의 방패를[a] 보시고 주께서 기름 부으신 이의[b] 얼굴을 살피소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 보호자’. 히브리어는 문자적으로 ‘우리의 방패’입니다. 이 시적 비유는 하나님을 가리킬 수도, 왕을 가리킬 수도 있으므로 본문에서는 이를 특정하지 않았습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘당신의 기름 부음 받은 이’입니다. ‘메시아’와 같은 어근의 말이며, 여기서는 우선 다윗 왕을 가리킬 가능성이 있으나 더 넓은 메시아적 울림도 있을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים צְבָאוֹת
  english_pob_choice: Yahweh God of hosts
  chosen_korean: 만군의 하나님 야훼
  alternatives_korean:
  - 야훼 하나님 만군의 주재
  - 만군의 야훼 하나님
  lexicon: WLC; HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, צְבָאוֹת은 하나님의 군대/천상 군대의 넓은 의미를 살려 관용적인 ‘만군의’로 옮겼습니다. 앞의 אֱלֹהִים은 호칭이므로 ‘하나님’으로 자연스럽게 처리했습니다.
- source_word: שִׁמְעָה
  english_pob_choice: hear
  chosen_korean: 들으소서
  alternatives_korean:
  - 들어 주십시오
  - 들어 주소서
  lexicon: HALOT
  rationale: 기도문에서의 مباشر한 청원을 살리기 위해 ‘들으소서’로 옮겨, 단순 정보 수용이 아니라 응답을 요청하는 뉘앙스를 유지했습니다.
- source_word: תְפִלָּתִי
  english_pob_choice: my prayer
  chosen_korean: 제 기도
  alternatives_korean:
  - 나의 기도
  - 내 기도
  lexicon: HALOT
  rationale: 첫인칭 소유를 한국어 합쇼체에 맞게 ‘제’로 풀어, 직접적인 기도 어조를 자연스럽게 살렸습니다.
- source_word: הַאֲזִינָה
  english_pob_choice: give ear
  chosen_korean: 귀를 기울이소서
  alternatives_korean:
  - 귀를 기울여 주십시오
  - 들으소서
  lexicon: HALOT
  rationale: 앞의 ‘들으소서’와 평행을 이루되 더 강한 주의와 응답의 요청을 보여 주는 동사 차이를 살리기 위해 ‘귀를 기울이소서’로 구분했습니다.
- source_word: אֱלֹהֵי יַעֲקֹב
  english_pob_choice: God of Jacob
  chosen_korean: 야곱의 하나님
  alternatives_korean:
  - 야곱의 하나님이여
  - 야곱의 하나님
  lexicon: HALOT
  rationale: אָנ칭 구문을 직역해 야곱과 맺으신 언약적 관계를 드러내는 표준적 표현으로 옮겼습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 쉼
  - 간주
  lexicon: HALOT
  rationale: 의미가 확정되지 않은 전례/음악 용어이므로 해석을 덧씌우지 않고 음역을 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼로 표기해 고유한 신명성을 보존했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 시편 본문은 언약적 하나님의 이름을 직접 사용하므로, 표제적 칭호로 완화하지 않고 고유 이름을 드러내는 것이 원문 의도를 더 잘 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 셀라의 처리
  chosen_reading: 음역 ‘셀라’를 유지했습니다.
  alternative_readings:
  - 쉼
  - 잠깐 멈춤
  - 간주
  rationale: 용법과 기능이 불확실하므로 의미를 단정하지 않고 본문의 시가적 표지를 보존하는 편이 번역의 긴장을 해치지 않습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
