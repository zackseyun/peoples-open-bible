  text: With rebukes for iniquity you discipline a man, and like a moth you consume what is precious to him[a]; surely every man is vapor[b]. Selah
  footnotes:
  - marker: a
    text: Or “you make his precious things waste away like a moth”; the Hebrew for “what is precious to him” can also be understood more specifically as “his beauty” or more broadly as “his treasured things.”
    reason: lexical_alternative
  - marker: b
    text: “Vapor” renders Hebrew hebel, a word used for breath-like transience or insubstantiality; traditionally, “vanity.”
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 죄악 때문에 꾸짖어 사람을 징계하시면, 좀이 먹듯이 그가 소중히 여기는 것을[a] 쇠하게 하십니다. 참으로 모든 사람은 한낱 입김일 뿐입니다.[b] 셀라
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아름다움’. 히브리어는 ‘그가 소중히 여기는 것’ 또는 ‘그의 보물들’이라는 더 넓은 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘입김’은 히브리어 헤벨을 옮긴 말로, 숨결처럼 덧없고 실체 없는 것을 가리킵니다. 전통적으로 ‘헛됨’으로도 번역합니다.
    reason: lexical_alternative
