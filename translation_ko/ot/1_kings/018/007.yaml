  terminology: אֲדֹנִי는 하나님을 가리키는 신적 칭호가 아니라 엘리야를 향한 사회적 존칭입니다. ‘제 주인이신’으로 옮겨 인물 간 호칭임을 분명히 하고, 엘리야에게는 한국어 존칭 ‘님’을 사용했습니다.
