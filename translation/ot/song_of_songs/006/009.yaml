id: SNG.6.9
reference: Song of Songs 6:9
source:
  edition: WLC
  text: אַחַ֥ת הִיא֙ יוֹנָתִ֣/י תַמָּתִ֔/י אַחַ֥ת הִיא֙ לְ/אִמָּ֔/הּ בָּרָ֥ה הִ֖יא לְ/יֽוֹלַדְתָּ֑/הּ רָא֤וּ/הָ בָנוֹת֙ וַֽ/יְאַשְּׁר֔וּ/הָ מְלָכ֥וֹת וּ/פִֽילַגְשִׁ֖ים וַֽ/יְהַלְלֽוּ/הָ׃ס
translation:
  text: But my dove, my flawless one, is the only one; she is her mother's only one[a], the favorite of the one who bore her. Young women saw her and called her blessed; queens and concubines also praised her.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or 'she is unique in her mother’s eyes.'
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹנָתִי
  chosen: my dove
  alternatives:
  - my darling
  lexicon: HALOT
  rationale: Literally 'my dove.' In Song of Songs this is an endearment and imagery of beauty/gentleness; retaining the bird image preserves the poetic metaphor rather than flattening it to a generic term of affection.
- source_word: תַמָּתִי
  chosen: my flawless one
  alternatives:
  - my perfect one
  - my blameless one
  lexicon: HALOT
  rationale: From תם/תמה, conveying completeness, wholeness, or blameless beauty. 'Flawless' fits the romantic-poetic context better than the more moralized 'blameless' and sounds more natural than 'perfect' in modern English while preserving the superlative sense.
- source_word: אַחַת הִיא
  chosen: is the only one
  alternatives:
  - is one
  - is unique
  lexicon: HALOT
  rationale: The repeated phrase emphasizes singularity and exclusiveness, not merely numerical identity. 'The only one' best captures the force in context.
- source_word: לְאִמָּהּ
  chosen: of her mother
  alternatives:
  - to her mother
  - for her mother
  lexicon: HALOT
  rationale: The preposition ל here expresses relation with the following predicate, indicating status in relation to her mother. English idiom is best conveyed by 'of her mother' in the phrase 'the only one of her mother.'
- source_word: בָּרָה
  chosen: pure
  alternatives:
  - choice
  - clear
  - radiant
  lexicon: HALOT
  rationale: The adjective can denote purity/cleanness and by extension selectness. In parallel with her singular status and in relation to the one who bore her, 'pure' is the most straightforward rendering, while preserving the elevated poetic register.
- source_word: לְיוֹלַדְתָּהּ
  chosen: to the one who bore her
  alternatives:
  - to her mother who gave birth to her
  - to her bearer
  lexicon: HALOT
  rationale: The participial form means 'the one bearing/giving birth to her.' 'To the one who bore her' is natural English and preserves the relational sense introduced by ל.
- source_word: רָאוּהָ
  chosen: saw her
  alternatives:
  - looked upon her
  lexicon: HALOT
  rationale: Simple past narrative verb; 'saw her' is sufficient and idiomatic.
- source_word: בָנוֹת
  chosen: young women
  alternatives:
  - young women
  - maidens
  lexicon: HALOT
  rationale: Here the term functions idiomatically for female peers rather than literal daughters.
- source_word: וַיְאַשְּׁרוּהָ
  chosen: called her blessed
  alternatives:
  - pronounced her happy
  - declared her fortunate
  lexicon: HALOT
  rationale: From אשר in the Piel, meaning to declare blessed/happy. 'Called her blessed' is idiomatic biblical English and preserves the evaluative force.
- source_word: מְלָכוֹת
  chosen: queens
  lexicon: HALOT
  rationale: Straightforward plural noun.
- source_word: וּפִילַגְשִׁים
  chosen: and concubines also
  alternatives:
  - and concubines
  lexicon: HALOT
  rationale: The conjunction links a second group with queens; adding 'also' in English clarifies that both groups joined in the action, matching the Hebrew coordination and improving flow.
- source_word: וַיְהַלְלוּהָ
  chosen: praised her
  alternatives:
  - extolled her
  lexicon: HALOT
  rationale: From הלל, 'praise.' 'Praised her' is clear and natural; 'extolled' is possible but less accessible.
- source_word: אַחַת הִיא לְאִמָּהּ
  chosen: she is her mother's only one
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This natural possessive construction retains the repeated assertion of her singularity in relation to her mother.
- source_word: בָּרָה הִיא לְיוֹלַדְתָּהּ
  chosen: the favorite of the one who bore her
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: In this relational context, “favorite” naturally conveys the adjective’s sense of exceptional or choice status; the more literal senses are noted.
