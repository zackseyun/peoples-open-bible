  - 그를 왕으로 만들려고
  lexicon: מלך Hiphil
  rationale: 히필의 ‘왕으로 세우다/삼다’의 뜻을 살려, 왕권 부여의 행위를 분명하게 표현했습니다.
theological_decisions:
- issue: the causal connection introduced by כִּי
  chosen_reading: 르호보암의 세겜 행과 이스라엘의 집합 사이의 이유-결과 관계를 그대로 드러냅니다.
  alternative_readings:
  - 단순한 시간적 병렬로 완화
  - ‘그래서’로 결과 중심 번역
  rationale: 본문은 세겜 방문의 이유를 설명하므로, 인과를 약화하지 않고 ‘때문입니다’로 옮겼습니다.
  doctrine_reference: 서사 본문의 명시적 인과관계 보존
