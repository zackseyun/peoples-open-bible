  from: Jonah began to go into the city a day's journey[a], and he cried out and said, “Yet forty days[b], and Nineveh will be overturned.”
  to: Jonah began his journey into the city, going a day's distance. He cried out, “Forty more days, and Nineveh will be overturned[a]!”
  rationale: The lexical history rightly emphasizes the countdown and the breadth of 'overturned.' I preserve the latter wording and explain its range, while smoothing the journey clause and doubled speech formula.
