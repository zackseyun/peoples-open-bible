id: HOS.10.5
reference: Hosea 10:5
source:
  edition: WLC
  text: לְ/עֶגְלוֹת֙ בֵּ֣ית אָ֔וֶן יָג֖וּרוּ שְׁכַ֣ן שֹֽׁמְר֑וֹן כִּי אָבַ֨ל עָלָ֜י/ו עַמּ֗/וֹ וּ/כְמָרָי/ו֙ עָלָ֣י/ו יָגִ֔ילוּ עַל כְּבוֹד֖/וֹ כִּֽי גָלָ֥ה מִמֶּֽ/נּוּ־־־׃
translation:
  text: 'The inhabitants of Samaria tremble for the calf-idol[a] of Beth-aven[b]: its worshipers mourn over it, as do its idolatrous priests who once rejoiced over its glory[c], for that glory has departed from it.'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Hebrew, 'calves'; the verse then refers to the idol in the singular.
    reason: lexical_alternative
  - marker: b
    text: Beth-aven means 'house of wickedness,' Hosea's mocking name for Bethel, 'house of God.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew verb normally means 'rejoice'; alternatively, the clause is understood as 'its idolatrous priests wail over it, over its glory.'
    reason: alternative_reading
