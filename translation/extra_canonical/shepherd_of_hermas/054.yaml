    “These commandments are beneficial for those who are about to repent; for if they do not walk in them, their repentance is in vain.


    “You, therefore, who are repenting, cast off the evils of this age that wear you down; and having put on every virtue of righteousness, you will be able to keep these commandments and no longer add to your sins. If, therefore, you add nothing further, you will depart from your former sins. Walk, therefore, in these my commandments, and you will live to God. These things [all] have been spoken to you by me.”


