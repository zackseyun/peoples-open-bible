  text: But the angel said to him, “Grab the fish.” So the boy seized the fish and threw it up onto the land.
translation:
  language: ko
  text: 그러자 천사는 그에게 말했습니다. 「물고기를 붙잡으십시오.」 그래서 소년은 물고기를 붙잡아 땅 위로 던졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπιλαβοῦ
  english_pob_choice: Grab
  chosen_korean: 붙잡아라
  alternatives_korean:
  - 잡아라
  - 움켜라
  - 취하라
  lexicon: ἐπιλαμβάνομαι
  rationale: 명령형으로서 물고기를 재빨리 강하게 붙드는 동작을 살리기 위해 ‘붙잡아라’를 택했습니다. POB의 ‘Grab’에 가장 가깝고, 단순한 ‘잡아라’보다 동작의 긴급성과 힘이 더 드러납니다.
- source_word: ἐκράτησεν
  english_pob_choice: seized
  chosen_korean: 붙잡아
  alternatives_korean:
  - 잡아
  - 움켜
  - 거머쥐어
  lexicon: κρατέω
  rationale: 앞의 천사 명령과 같은 어휘감으로 연결하되, 소년의 반응을 자연스럽게 한국어로 나타내기 위해 서술형 ‘붙잡아’를 사용했습니다.
- source_word: ἀνέβαλεν αὐτὸν ἐπὶ τὴν γῆν
  english_pob_choice: threw it up onto the land
  chosen_korean: 땅 위로 던졌습니다
  alternatives_korean:
  - 땅으로 끌어올렸습니다
  - 땅 위에 던졌습니다
  - 뭍으로 던졌습니다
  lexicon: ἀναβάλλω
  rationale: POB가 ‘pulled it up’보다 ‘threw it up’의 방향성과 힘을 반영하므로, 단순한 인양보다 투척 동작을 살린 ‘던졌습니다’를 택했습니다. ‘땅 위로’는 ἐπὶ τὴν γῆν의 방향성을 직접 반영합니다.
- source_word: τὸ παιδάριον
  english_pob_choice: the boy
  chosen_korean: 소년은
  alternatives_korean:
  - 아이는
  - 어린아이는
  - 아이는
  lexicon: παιδάριον
  rationale: 작은 아이를 가리키는 말이지만 문맥상 토비아스의 어린 동행자를 자연스럽게 드러내기 위해 ‘소년’을 선택했습니다. 너무 유아적으로 들리는 표현은 서사 흐름을 약화시킬 수 있습니다.
theological_decisions:
- issue: 천사의 직접 명령을 한국어 명령형으로 얼마나 강하게 살릴지
  chosen_reading: 「물고기를 붙잡아라」로 직설적 명령을 유지했습니다.
  alternative_readings:
  - 「물고기를 잡아라」
  - 「물고기를 붙드시오」
  rationale: 본문은 천사가 즉각적인 행동을 요구하는 장면이므로, 완곡하게 낮추기보다 명령의 긴박함을 보존하는 것이 source-direct합니다. 다만 한국어 문체는 합쇼체 서술로 유지했습니다.
  doctrine_reference: 서사적 명령/직접화법의 문체 보존
