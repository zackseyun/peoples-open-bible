  from: O Yahweh[b], who may sojourn in your tent? Who may dwell on your holy mountain?
  to: O Yahweh, who may sojourn in your tent[b]? Who may dwell on your holy mountain?
  rationale: The tent footnote is attached to the divine name rather than to the word it explains and should be moved. “Sojourn” is a precise, still-natural formal-English rendering of יָגוּר and retains the residence-as-a-sojourner nuance without adding the more specific social implication of being a “guest.” “Stay as a guest” is an acceptable interpretation, but not a necessary correction.
