- pob_phrase: all these stones that were cast away and did not fit into the building of the tower
  simplified_phrase: all these stones that were thrown away and did not fit into the building of the tower
  preserved_meaning: The stones were rejected and were not suitable for the tower's construction.
  reasoning_layer_used: POB base text and source imagery
  rationale: The wording keeps both descriptions without making either one the cause of the other.
