translation:
  text: Tryphon sought to become king of Asia[a], to put on the crown, and to lay hands on King Antiochus.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Here 'Asia' refers to the Seleucid kingdom, not the modern continent.
