id: PSA.130.1
reference: Psalms 130:1
source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֑וֹת מִ/מַּעֲמַקִּ֖ים קְרָאתִ֣י/ךָ יְהוָֽה׃
translation:
  text: Out of the depths I call to you, Yahweh.
  philosophy: dynamic
lexical_decisions:
- source_word: שִׁיר
  chosen: A Song
  alternatives:
  - A Psalm
  - Song
  lexicon: HALOT
  rationale: The noun denotes a song. In psalm superscriptions, 'A Song' is the natural English equivalent and avoids importing the more specific genre label 'psalm' where the Hebrew here simply says 'song'.
- source_word: הַמַּעֲלוֹת
  chosen: of Ascents
  alternatives:
  - of the Ascents
  - for going up
  lexicon: HALOT
  rationale: The plural noun from עלה in this superscription is conventionally and accurately rendered 'Ascents.' This preserves the established sense of the collection title without over-interpreting its precise historical setting.
- source_word: מִמַּעֲמַקִּים
  chosen: Out of the depths
  alternatives:
  - From the depths
  - Out of deep places
  lexicon: HALOT
  rationale: The plural noun means 'depths' or 'deep places,' here used metaphorically for extreme distress. 'Out of the depths' is idiomatic, faithful, and preserves the vivid imagery.
- source_word: קְרָאתִיךָ
  chosen: I call to you
  alternatives:
  - I have called to you
  - I cried out to you
  lexicon: HALOT
  rationale: קרא means call; in direct poetic prayer an English present is natural, though the Hebrew perfect also permits a past rendering.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
