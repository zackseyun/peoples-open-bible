id: JHN.10.28
reference: John 10:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: ko
  text: 그리고 나는 그들에게 영원한 생명을 줍니다. 그들은 결코 멸망하지 않을 것이며, 아무도 내 손에서 그들을 빼앗아 가지 못할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίδωμι αὐτοῖς ζωὴν αἰώνιον
  english_pob_choice: I give them eternal life
  chosen_korean: 나는 그들에게 영원한 생명을 줍니다
  alternatives_korean:
  - 나는 그들에게 영생을 줍니다
  - 내가 그들에게 영원한 생명을 주겠습니다
  lexicon: δίδωμι / ζωὴ αἰώνιος
  rationale: 현재형 '줍니다'로 예수의 지속적 주시는 행동을 살리고, ζωὴ αἰώνιον은 직역에 가까운 '영원한 생명'으로 옮겨 문장의 의미를 분명히 했습니다.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  english_pob_choice: they will certainly never perish forever
  chosen_korean: 그들은 결코 영원히 멸망하지 않을 것이며
  alternatives_korean:
  - 그들은 결코 망하지 않을 것이며
  - 그들은 영원히 멸망하지 않을 것입니다
  lexicon: οὐ μὴ + aorist subjunctive / εἰς τὸν αἰῶνα
  rationale: οὐ μὴ의 강한 부정과 εἰς τὸν αἰῶνα의 시간적 강조를 함께 반영해 '결코 영원히'로 옮겼습니다.
- source_word: ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου
  english_pob_choice: no one will snatch them out of my hand
  chosen_korean: 아무도 내 손에서 그들을 빼앗지 못합니다
  alternatives_korean:
  - 아무도 내 손에서 그들을 낚아채지 못합니다
  - 아무도 내 손에서 그들을 빼앗아 갈 수 없습니다
  lexicon: ἁρπάζω / χείρ
  rationale: ἁρπάζω의 급작스러운 강탈 뉘앙스를 '빼앗다'로 자연스럽게 살리고, '내 손에서'는 보호와 소유의 이미지를 그대로 유지했습니다.
theological_decisions:
- issue: οὐ μὴ + εἰς τὸν αἰῶνα의 강한 보장 표현
  chosen_reading: '''결코 영원히 멸망하지 않을 것이다''로 절대적 보장을 드러냈습니다.'
  alternative_readings:
  - '''절대로 멸망하지 않을 것이다'''
  - '''영원히 멸망하지 않을 것이다'''
  rationale: 본문의 이중적 부정 구조는 단순 가능성 부정이 아니라 강한 확언이므로, 한국어에서도 그 강도를 보존했습니다.
  doctrine_reference: 보존과 견인의 약속에 대한 요한복음의 문맥적 진술
