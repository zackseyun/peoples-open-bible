translation:
  language: en
  text: How terrible for you, Chorazin! How terrible for you, Bethsaida! If the acts of power[a] that happened among you had happened in Tyre and Sidon, the people there would have reoriented toward God[b] long ago, sitting in sackcloth and ashes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “miracles”; the Greek describes deeds that display power.
    reason: lexical_alternative
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Woe to you
  simplified_phrase: How terrible for you
  preserved_meaning: This keeps the force of solemn denunciation and lament without making it only a future prediction.
  reasoning_layer_used: POB lexical decision for Οὐαί
  rationale: The exclamation expresses grave distress and judgment in common English.
- pob_phrase: mighty works
  simplified_phrase: acts of power
  preserved_meaning: These are deeds that display divine power without reducing the term to a technical label.
  reasoning_layer_used: POB lexical and theological decisions for δυνάμεις
  rationale: The phrase clearly preserves both the deeds and their power.
interpretive_expansions:
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: “How terrible for you” is less traditional than “Woe to you.”
    mitigation: Its exclamatory form retains the POB’s denunciation and lament.
  - risk: “Sackcloth and ashes” may be unfamiliar to some readers.
    mitigation: The concrete biblical image is retained because the POB audit identifies it as important.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
