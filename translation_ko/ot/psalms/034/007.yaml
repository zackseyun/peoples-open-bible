  rationale: 검토 대상 히브리어 본문에 맞추어 본문 전체를 교체했습니다. חֹנֶה는 지속적·일반적 행동을 나타내는 표현으로 ‘진을 치고’로, סָבִיב는 ‘주위에’로 옮겼습니다. יְרֵאָיו는 단순 공포가 아니라 야훼를 향한 경외를 포함하므로 ‘그분을 경외하는 이들’로 번역했습니다. וַיְחַלְּצֵם는 위험에서 끌어내어 구출한다는 뜻을 살려 ‘그들을 건져 내십니다’로 옮겼습니다.
