  yaml_path: translation/deuterocanon/psalms_of_solomon/004/018.yaml
  text: May sleep be taken from his temples in the night; may they fall away from every work of his hands.
translation:
  language: zh_hans
  text: 愿夜间的睡眠从他的两鬓被夺去；愿他们从他双手所做的一切事上退去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”原文为复数，但本句没有明说所指；也可能是承接上下文中的人。
    reason: 提示希腊文复数动词的主语含混，避免读者误以为译文已能确定其先行词。
lexical_decisions:
- source_word: ἀφαιρεθείη
  choice: 愿……被夺去
  rationale: 保留不定过去时被动祈愿语气，表达咒愿而非事实陈述。
- source_word: κροτάφων
  choice: 两鬓
  rationale: κρόταφος 指头部两侧的太阳穴、鬓角；“两鬓”既贴近复数形式，也符合庄重诗体。
- source_word: ἀποπέσοιεν
  choice: 愿他们……退去
  rationale: 该词为复数祈愿式，基本义是“落下、离开、退去”；译文保留复数主语及其指代不明的状态，不擅自改成单数或指定对象。
- source_word: παντὸς ἔργου χειρῶν αὐτοῦ
  choice: 他双手所做的一切事
  rationale: 直译属格结构，保留“手”作为行为与劳作之喻的原文形象。
theological_decisions:
- issue: ἀποπέσοιεν 的复数隐含主语
  choice: 正文译作“他们”，并以脚注说明原文未明说所指
  alternative: 补成“他的双手”，或将动词改为单数并以“他”为主语
  rationale: 希腊文动词明确为第三人称复数，但本节没有明确的复数主语；直接补定所指会消除原文真实存在的语法与语义张力。
translation_notes:
  register: 采用庄重而现代的祈愿句式。“两鬓”比生硬的“太阳穴”更适合诗歌语域；后半句刻意保留原文突兀的复数主语，并借脚注交代歧义。
