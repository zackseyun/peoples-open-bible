  from: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
  to: But you shall not punish the young woman; she has committed no sin deserving death. For this case is like one in which a man attacks his neighbor and murders him.
