  terminology: 고유명사는 한국어 성경 전통과 현대적 통용을 고려하여 ‘오렙, 스엡, 세바, 살문나’로 옮겼습니다. נְדִיבֵמוֹ와 נְסִיכֵמוֹ의 병행을 보존하기 위해 각각 ‘귀족들’과 ‘방백들’을 사용했습니다.
