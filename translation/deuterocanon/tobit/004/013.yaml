  meaning: Tobit warns his son not to let pride alienate him from his own people when choosing a wife, and teaches that pride and idleness lead to ruin and deprivation.
  meaning_decisions:
  - source_phrase: τοὺς ἀδελφούς σου
    prior_rendering: your brothers
    new_rendering: your relatives
    rationale: The preceding marriage instruction establishes the broader kinship sense, rather than a reference limited to male siblings.
  - source_phrase: μὴ ὑπερηφάνευε τῇ καρδίᾳ σου ἀπὸ τῶν ἀδελφῶν σου … λαβεῖν σεαυτῷ ἐξ αὐτῶν γυναῖκα
    prior_rendering: do not become proud in your heart over your brothers … so as to take a wife for yourself from among them
    new_rendering: do not let pride in your heart make you look down on your relatives … by refusing to marry a woman from among them
    rationale: In the flow from verse 12, the warning most naturally opposes pride that leads to rejecting marriage within one's people; the prior wording obscures that connection.
  - source_phrase: ἐν τῇ ὑπερηφανίᾳ ἀπώλεια καὶ ἀκαταστασία πολλή
    prior_rendering: in pride there is ruin and much disorder
    new_rendering: pride brings ruin and great disorder
    rationale: The nominal construction states the consequences of pride, which a direct causal sentence expresses naturally.
  - source_phrase: ἐν τῇ ἀχρειότητι … ἡ γὰρ ἀχρειότης μήτηρ ἐστὶν τοῦ λιμοῦ
    prior_rendering: in uselessness … for uselessness is the mother of famine
    new_rendering: idleness brings … for idleness is the mother of famine
    rationale: Decline, deprivation, and famine favor unproductive idleness rather than a judgment that a person is inherently useless; the maternal metaphor remains intact.
  footnote_kinds:
    a: alternative_meaning
  history_weighed: The revision and revert rationales do not consistently match their recorded wording, but the lexical discussion strongly supports 'idleness.' I clarify the marriage clause from its immediate context while retaining the serious alternative recognized in the earlier notes.
