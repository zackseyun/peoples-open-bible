lexical_decisions:
- source_word: ἐγένετο μέγας
  chosen: became great
  alternatives:
  - became prominent
  - was magnified
  - grew great
  lexicon: BDAG
  rationale: The construction expresses a change of status or reputation. 'Became great' is a natural, close rendering that preserves the idiom without over-interpreting it as political power alone.
- source_word: ἐνώπιον τοῦ λαοῦ
  lemma: ἐνώπιον
  chosen: in the sight of the people
  alternatives:
  - before the people
  - among the people
  lexicon: BDAG
  rationale: ἐνώπιον literally means 'before/in the presence of'; here it conveys public estimation. 'In the sight of the people' preserves both the literal imagery and the sense of public regard.
- source_word: ἀπὸ τῆς ἡμέρας ἐκείνης
  chosen: from that day
  alternatives:
  - from that day on
  - since that day
  lexicon: BDAG
  rationale: A straightforward temporal phrase marking the beginning point of Daniel's elevated standing.
- source_word: καὶ ἐπέκεινα
  chosen: onward
  alternatives:
  - and beyond
  - thereafter
  lexicon: LSJ
  rationale: The adverb extends the timeframe beyond the named day. 'Onward' gives idiomatic modern English while preserving the continuing sense. Combined with the previous phrase, it yields the natural expression 'from that day onward.'
- source_word: Δανιήλ
  chosen: Daniel
  lexicon: Greek proper name tradition
  rationale: Personal names are transliterated by standard English convention per project philosophy.
