theological_decisions:
- issue: 사자 이미지와 곧이어 나오는 인간 적대자 표현을 어떻게 처리할지
  chosen_reading: 동물 이미지와 인간 이미지의 긴장을 풀지 않고 함께 보존했습니다.
  alternative_readings:
  - 사자를 비유적으로만 풀어 적대자로 설명하기
  - 인간만을 가리키는 것으로 단정하기
  rationale: 본문은 ‘사자들’에서 ‘사람의 아들들’로 이동하므로, 시적 중첩을 해설로 평탄화하지 않고 원문의 긴장을 유지하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (theological tension preservation)
