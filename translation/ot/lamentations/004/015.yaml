    prior_rendering: “Turn aside! Unclean!” they cried to them. “Turn aside, turn aside, do not touch!”
    new_rendering: “Keep away! Unclean!” people cried at them. “Keep away! Keep away! Do not touch!”
    rationale: These are cries of exclusion and warnings against contact, not directions to take another route; identifying the speakers as people also distinguishes them from the rejected leaders.
  - source_phrase: כִּי נָצוּ גַּם נָעוּ
