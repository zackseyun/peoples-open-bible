translation:
  text: Habakkuk said, “My lord[a], I have never been to Babylon, and I do not know where the pit is.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “Lord,” if Habakkuk is addressing God through the angel.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμβακοὺμ
  chosen: Habakkuk
  lexicon: LSJ
  rationale: Standard English transliteration of the prophet's name.
- source_word: Κύριε
  chosen: Lord
  alternatives:
  - Master
  lexicon: LSJ
  rationale: Vocative of κύριος; 'Lord' is the default rendering per doctrine and fits direct address to God here.
- source_word: Βαβυλῶνα
  chosen: Babylon
  lexicon: LSJ
  rationale: Accusative of the place name Babylon; rendered by the standard English form.
- source_word: οὐχ ἑώρακα
  chosen: I have not seen
  alternatives:
  - I have never seen
  - I did not see
  lexicon: LSJ
  rationale: 'Perfect of ὁράω naturally conveys a present state resulting from past experience: Habakkuk has not seen Babylon. ''I have not seen'' preserves that force without over-paraphrase.'
- source_word: τὸν λάκκον
  chosen: the pit
  alternatives:
  - the den
  - the cistern
  lexicon: LSJ
  rationale: λάκκος broadly denotes a pit, ditch, cistern, or den-like hole. 'Pit' is the most direct and least interpretively loaded rendering here; in context it refers to the place where Daniel has been cast, but the Greek itself uses the generic term.
- source_word: οὐ γινώσκω
  chosen: I do not know
  alternatives:
  - I am not acquainted with
  - I do not know about
  lexicon: LSJ
  rationale: Present tense of γινώσκω expresses lack of knowledge or acquaintance. 'I do not know' is the plainest English equivalent.
