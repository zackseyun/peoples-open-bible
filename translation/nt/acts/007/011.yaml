id: ACT.7.11
reference: Acts 7:11
source:
  edition: SBLGNT
  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
translation:
  text: A famine struck all Egypt and Canaan, bringing great distress, and our forefathers could not find food.
  philosophy: dynamic
lexical_decisions:
- source_word: ἦλθεν
  chosen: came
  alternatives:
  - occurred
  - fell
  lexicon: BDAG
  rationale: 'Aorist of ἔρχομαι used idiomatically with λιμός; ''came'' is natural English and preserves the eventive force without over-paraphrasing. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: δὲ
  chosen: Now
  alternatives:
  - And
  - Then
  lexicon: BDAG
  rationale: δέ marks narrative development. 'Now' signals transition smoothly in English without implying strong contrast.
- source_word: λιμὸς
  chosen: famine
  alternatives:
  - hunger
  - dearth
  lexicon: BDAG
  rationale: In this context λιμός denotes a widespread scarcity of food, best rendered 'famine' rather than the more subjective 'hunger'.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  chosen: over all Egypt and Canaan
  alternatives:
  - throughout all Egypt and Canaan
  - upon the whole of Egypt and Canaan
  lexicon: BDAG
  rationale: ἐπί with accusative here conveys extension over a region. 'Over all Egypt and Canaan' is idiomatic and preserves the geographic scope.
- source_word: Χανάαν
  chosen: Canaan
  lexicon: BDAG
  rationale: Standard English transliteration of the place name.
- source_word: θλῖψις μεγάλη
  chosen: great distress
  alternatives:
  - great affliction
  - severe hardship
  - great tribulation
  lexicon: BDAG
  rationale: θλῖψις here refers to severe hardship accompanying the famine, not specifically eschatological tribulation. 'Great distress' is clear modern English and fits the historical setting.
- source_word: οὐχ ηὕρισκον
  chosen: could not find
  alternatives:
  - were not finding
  - did not find
  lexicon: BDAG
  rationale: Imperfect indicates ongoing inability during the crisis. 'Could not find' captures the practical force better than a wooden past progressive.
- source_word: χορτάσματα
  chosen: food
  alternatives:
  - provisions
  - fodder
  - grain
  lexicon: BDAG
  rationale: χορτάσματα denotes food supplies/provisions. 'Food' is the broadest natural rendering; 'grain' is too narrow and 'fodder' could misleadingly suggest animal feed only.
- source_word: οἱ πατέρες ἡμῶν
  chosen: our fathers
  alternatives:
  - our ancestors
  lexicon: BDAG
  rationale: Stephen is speaking of Israel's forefathers. Per translation philosophy, the masculine familial term is retained as 'fathers' rather than neutralized, since it matches the source and the patriarchal reference.
