  text: 그들은 제가 재앙을 당한 날에 나를 맞섰으나[a], 야훼께서는 나를 붙들어 주시는 분이셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘나를 맞섰다’ 외에 ‘나에게 닥쳐왔다’ 또는 ‘나를 만났다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַצִּילֵנִי
  english_pob_choice: He delivered me
  chosen_korean: 건져 주셨습니다
  alternatives_korean:
  - 구해 주셨습니다
  - 해방하셨습니다
  lexicon: HALOT
