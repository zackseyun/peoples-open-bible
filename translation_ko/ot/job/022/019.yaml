review_pass:
  verdict: revise
  source_fidelity: ‘이것을’은 히브리어 본문에 명시된 목적어가 아니며, 영어 POB도 이를 생략합니다. 앞 문맥상 악인의 멸망을 가리킬 수 있으나 본문에는 보충하지 않는 것이 원문 충실성에 더 맞습니다. 나머지 핵심 어휘와 ‘그들을’의 문맥적 지시는 적절합니다.
  naturalness: ‘의인들은 보고 기뻐하고, 무죄한 이는 그들을 비웃습니다’는 현대 표준 한국어의 합쇼체로 자연스럽습니다. ‘무죄한 이’는 단수형 히브리어의 일반적·집합적 용법을 한국어에서 무리 없이 반영합니다.
  terminology: ‘의인’, ‘무죄한 이’, ‘비웃습니다’는 צַדִּיקִים, נָקִי, יִלְעַג에 각각 적절합니다. 각주에서는 본문 표현을 중복하지 않고 ‘조롱합니다’라는 유효한 어휘 대안을 제시하도록 고쳤습니다.
  issues:
  - severity: medium
    issue: 본문에 없는 ‘이것을’의 삽입
    rationale: יִרְאוּ는 목적어 없이 ‘그들이 보고’라고 되어 있습니다. 문맥적 대상은 이해될 수 있지만, 본문에 ‘이것’을 보충하면 영어 POB의 절제된 표현 및 히브리어의 무표지성을 넘어섭니다.
  - severity: low
    issue: 각주가 본문과 동일한 ‘그들을 비웃습니다’를 대안으로 반복함
    rationale: 어휘 대안 각주는 실제 대안을 제공해야 합니다. ‘조롱합니다’를 제시하면 לעג의 경멸적 뉘앙스를 보존하면서 중복을 피할 수 있습니다.
  revised_text: 의인들은 보고 기뻐하고, 무죄한 이는 그들을 비웃습니다.[a]
