  revision_rationale: 원문에 없는 존칭 신적 호칭과 ‘대답하다’를 제거하고, 직접 청자와 문맥상 미확정인 구문을 보존했습니다. ‘규례’ 및 ‘그가 할 일’은 원문의 의미 범위를 유지하며 현대 합쇼체에 맞춥니다. 소망/시간 전제의 문법적 모호성은 각주로 보존했습니다.
