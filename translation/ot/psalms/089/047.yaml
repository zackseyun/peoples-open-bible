revisions:
- timestamp: '2026-04-21T00:17:07Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/089/048.json
  category: awkward_english
  tier: 1
  from: For what vanity you have created all the sons of man.
  to: For what vanity have you created all the sons of man?
  rationale: The current word order, which follows the Hebrew, can be read as a declarative statement in English ('You created them for the purpose of vanity'). Inverting the subject and verb ('have you created') and adding a question mark makes it unambiguously a rhetorical question, which is the clear intent of the Hebrew 'עַל מַה־שָּׁוְא'. This better captures the psalmist's questioning lament.
