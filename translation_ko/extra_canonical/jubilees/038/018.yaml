translation:
  language: ko
  text: 그의 도시는 다나바였습니다. 발락이 죽고, 보세르 출신 세라의 아들 요밥이 그의 뒤를 이어 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 도시는 다나바였습니다. 발락이 죽고, 보세르 출신 세라의 아들 요밥이 그 뒤에 왕이 되었습니다.”
    reason: 영어 POB 감사 기록의 이전 번역 대안(‘after him’)을 완전한 절 단위로 반영합니다. 이는 본문의 ‘그의 자리에’를 시간적으로 옮긴 대안일 뿐, 본문보다 우선하지 않습니다.
