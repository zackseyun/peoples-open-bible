  - church
  rationale: The verse quotes Psalm 22:22 and evokes the gathered people of God. 'Assembly' preserves the lexical sense without importing later institutional church associations that the quotation itself does not require.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 1
