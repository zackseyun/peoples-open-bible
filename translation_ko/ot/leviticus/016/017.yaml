source:
  edition: WLC
  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: ko
  text: 그가 성소에서 속죄하려고 들어갈 때부터 나올 때까지, 아무도 회막 안에 있어서는 안 됩니다. 그는 자신과 자기 집안과 이스라엘의 온 회중을 위해 속죄해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  lexicon: אֹהֶל מוֹעֵד
  rationale: 성막 문맥의 고정된 용례를 살리되, 현대 한국어에서 기능이 분명한 ‘회막’을 사용해 제의적 장소를 간결하게 드러냈습니다.
- source_word: לֹא יִהְיֶה בְּ/אֹהֶל מוֹעֵד
  english_pob_choice: no man shall be in the tent of meeting
  chosen_korean: 아무도 회막 안에 있지 못해야 합니다
  alternatives_korean:
  - 회막 안에 아무도 있어서는 안 됩니다
  - 회막 안에는 아무도 없어야 합니다
  lexicon: אָדם / הָיָה + 부정
  rationale: 영어 POB의 ‘no man’를 반영하되, 한국어에서는 성별 일반화 의미를 살려 ‘아무도’로 옮기고, 금지/부적합의 뉘앙스를 ‘있지 못해야 합니다’로 전달했습니다.
- source_word: לְכַפֵּר בַּקֹּדֶשׁ
  english_pob_choice: to make atonement in the holy place
  chosen_korean: 지성소에서 속죄하려고
  alternatives_korean:
  - 거룩한 곳에서 속죄하려고
  - 성소에서 속죄하려고
  lexicon: כפר / קֹדֶשׁ
  rationale: 속죄 행위의 제의적 중심을 드러내기 위해 ‘속죄’를 택했고, 문맥상 지성소를 가리키는 자리로 보아 ‘지성소’로 옮겼습니다.
- source_word: בְּעַד
  english_pob_choice: for
  chosen_korean: -를 위해
  alternatives_korean:
  - -을 위하여
  - -을 대신하여
  lexicon: בְּעַד
  rationale: 자기, 집안, 이스라엘 전체를 포괄하는 대속/대변의 기능을 자연스러운 한국어로 유지하기 위해 ‘-를 위해’를 사용했습니다.
theological_decisions:
- issue: 아론의 속죄 행위와 회막 출입 제한의 관계
  chosen_reading: 속죄 행위가 진행되는 동안에는 아무도 회막 안에 있을 수 없다는 제의적 긴장과 엄중함을 그대로 유지했습니다.
  alternative_readings:
  - 단순한 예식 절차 안내로 완화하는 읽기
  - ‘성소’로 일반화해 장소의 긴장을 줄이는 읽기
  rationale: 본문은 대속죄일의 단독적·배타적 제의성을 강조하므로, 출입 금지와 속죄의 엄중함을 약화시키지 않도록 직설적으로 옮겼습니다.
  doctrine_reference: 레 16장 대속죄일 문맥
