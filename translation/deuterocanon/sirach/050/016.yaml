lexical_decisions:
- source_word: וַיָּרִיעוּ
  chosen: they raised a shout
  alternatives:
  - they shouted
  - they gave a blast
  - they cried out
  lexicon: HALOT
  rationale: From רוע/הריע in a cultic-public setting, the verb denotes raising a loud shout or acclamation. 'Raised a shout' preserves the audible, ceremonial force without over-specifying instrumentality.
- source_word: וַיַּשְׁמִיעוּ
  chosen: made ... heard
  alternatives:
  - sounded
  - caused to be heard
  - proclaimed
  lexicon: HALOT
  rationale: Hiphil of שמע means to cause to hear, make heard. The wording keeps the causative nuance and fits the parallel with the preceding shout.
- source_word: קוֹל אַדִּיר
  chosen: a mighty sound
  alternatives:
  - a mighty voice
  - a great sound
  - a majestic sound
  lexicon: HALOT
  rationale: קוֹל can be voice or sound; here, with the Greek's 'great voice' and the liturgical context, the phrase refers broadly to a powerful audible signal. 'Mighty sound' preserves the Hebrew adjective אַדִּיר and avoids implying only spoken speech.
- source_word: לְהַזְכִּיר
  chosen: to make remembrance
  alternatives:
  - to bring to remembrance
  - to serve as a memorial
  - to make mention
  lexicon: HALOT
  rationale: The infinitive of זכר in Hiphil here carries memorial/reminder force in a sacrificial-liturgical context. 'To make remembrance' is slightly formal but best preserves the cultic sense also reflected by the Greek εἰς μνημόσυνον.
- source_word: לִפְנֵי עֶלְיוֹן
  chosen: before the Most High
  alternatives:
  - in the presence of the Most High
  - before God Most High
  lexicon: HALOT
  rationale: עֶלְיוֹן is a divine title, best rendered 'the Most High.' 'Before' straightforwardly reflects לִפְנֵי and suits the liturgical setting.
