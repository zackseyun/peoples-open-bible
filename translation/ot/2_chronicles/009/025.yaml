  from: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
  to: Solomon had four thousand stalls for chariot horses[a] and twelve thousand horsemen. He stationed some in the cities where his chariot forces were based and others with him in Jerusalem.
  rationale: The lexical record favored retaining 'horses and chariots' separately, but the stabling context and the parallel in Kings support 'chariot horses.' I preserve Chronicles’ four thousand and note the alternative construction rather than harmonizing the count with Kings.
