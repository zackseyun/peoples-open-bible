translation:
  text: Every delightful tree will be planted on it, and vineyards will be planted on it. The vine planted on it
    will produce wine in abundance. Every seed sown on it—one measure will produce a thousand;[a] and one measure
    of olives will produce ten press-measures of oil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected wordእልፈhas more than one numerical use. Actual Dillmann1865col721, entryእልፍsubsection1, placesEnoch10:19under
      “thousand”; subsection2 distinguishes explicit “ten thousand/myriad” uses elsewhere. This qualified rendering
      follows the verse-specific citation, rather than treating the word as an unambiguous ten thousand. It describes
      the text’s promised abundance, not a verified agricultural yield.
    reason: lexical_alternative
  - marker: b
    text: The unusual olive/oil term is checked in actualDillmann719–720; the press term at873can name a pressing-place
      or apparatus. “Press-measures” retains the production-capacity image without inventing a modern volume or
      agricultural technique. The printed press-count፲is ten and is not changed by the separate seed-yield ambiguity.
    reason: lexical_alternative
