lexical_decisions:
- source_word: ትዝካረ
  chosen: a record
  alternatives:
  - a memorial
  - a remembrance
  rationale: Conveys the written memorial Enoch made without implying a verbatim transcript.
- source_word: ስእለቶሙ፡ ወአስተብቍዖተ
  chosen: their petition and supplication
  alternatives:
  - their request and entreaty
  rationale: Keeps both terms and the prayerful force of the second.
- source_word: መንፈሶሙ
  chosen: their spirits
  alternatives:
  - their souls
  rationale: Retains the witness’s term without adding an interpretation of the Watchers’
    nature.
- source_word: ለለአሐዱ፡ ምግባሮሙ
  chosen: the deeds of each one
  alternatives:
  - their deeds individually
  - each of their deeds
  rationale: Preserves the distributive wording, though its precise attachment is
    uncertain.
- source_word: ስርየተ
  chosen: forgiveness
  alternatives:
  - pardon
  - remission
  rationale: Names what the petitioners seek, not what they receive.
- source_word: እሱተ
  chosen: an extension
  alternatives:
  - a lengthening of time
  - a reprieve
  rationale: Avoids supplying 'of days,' which is not explicit in the supplied witness;
    the OCR reading needs verification.
theological_decisions:
- issue: Whether the petition implies pardon was granted
  chosen_reading: The Watchers request forgiveness; the verse does not grant it.
  alternative_readings:
  - Reading their request as an assurance of forgiveness
  rationale: The clause reports what they sought, not a divine answer.
