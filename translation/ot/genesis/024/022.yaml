  from: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
  to: When the camels had finished drinking, the man took out a gold nose ring weighing half a shekel[a] and two gold bracelets for her wrists, together weighing ten shekels.
  rationale: The lexical record recognized the nose-ring identification, the beka’s equivalence, and the wrist location but preferred broader or more literal wording. The chapter supplies enough evidence to carry those meanings directly into the text while retaining the ancient weight system.
