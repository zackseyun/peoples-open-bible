id: PSA.17.2
reference: Psalms 17:2
source:
  edition: WLC
  text: מִ֭/לְּ/פָנֶי/ךָ מִשְׁפָּטִ֣/י יֵצֵ֑א עֵ֝ינֶ֗י/ךָ תֶּחֱזֶ֥ינָה מֵישָׁרִֽים׃
translation:
  text: May my vindication come from your presence; may your eyes behold what is right.
  philosophy: dynamic
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  chosen: from before you
  alternatives:
  - from your presence
  - from you
  lexicon: HALOT
  rationale: This retains the expressed spatial/presence imagery.
- source_word: מִשְׁפָּטִי
  chosen: my vindication
  alternatives:
  - my justice
  - my vindication
  - my case
  lexicon: HALOT
  rationale: In this appeal it denotes the favorable judicial outcome sought for the psalmist.
- source_word: יֵצֵא
  chosen: come out
  alternatives:
  - go forth
  - issue forth
  lexicon: HALOT
  rationale: The verb יצא means 'go out/come out.' In English, with the point of origin foregrounded ('from before you'), 'come out' is natural and preserves the image of a verdict proceeding from God's presence.
- source_word: עֵינֶיךָ
  chosen: your eyes
  alternatives:
  - you
  lexicon: HALOT
  rationale: The Hebrew explicitly uses 'your eyes,' a vivid anthropomorphic expression for divine examination. Retaining it preserves the poetic concreteness rather than flattening to the abstract 'you.'
- source_word: תֶּחֱזֶינָה
  chosen: see
  alternatives:
  - behold
  - look upon
  lexicon: HALOT
  rationale: חזה often carries the sense of seeing or beholding attentively. 'See' is clear modern English; the attentiveness is supplied by context and by the object 'what is upright.'
- source_word: מֵישָׁרִים
  chosen: what is right
  alternatives:
  - uprightness
  - equity
  - what is right
  lexicon: HALOT
  rationale: Natural English while retaining moral-juridical rightness.
