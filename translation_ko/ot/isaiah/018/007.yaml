language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ/עֵת֩ הַ/הִ֨יא יֽוּבַל שַׁ֜י לַ/יהוָ֣ה צְבָא֗וֹת עַ֚ם מְמֻשָּׁ֣ךְ וּ/מוֹרָ֔ט וּ/מֵ/עַ֥ם נוֹרָ֖א מִן ה֣וּא וָ/הָ֑לְאָה גּ֣וֹי קַו קָ֣ו וּ/מְבוּסָ֗ה אֲשֶׁ֨ר בָּזְא֤וּ נְהָרִים֙ אַרְצ֔/וֹ אֶל מְק֛וֹם שֵׁם יְהוָ֥ה צְבָא֖וֹת הַר צִיּֽוֹן־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/007.yaml
  text: At that time a gift will be brought to the LORD of Armies from a people tall and smooth-skinned, from a people feared far and wide, a nation of command upon command and trampling, whose land rivers divide, to the place of the name of the LORD of Armies, Mount Zion.
translation:
  language: ko
  text: 그때에 키가 크고 살갗이 매끈한 백성, 그곳에서 멀리까지 두려움의 대상인 백성, 명령에 명령을 거듭하고 짓밟는 나라, 곧 강들이 그 땅을 가르는 백성에게서 만군의 주께 예물이 드려져, 만군의 주의 이름이 있는 곳, 곧 시온 산으로 옮겨질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공물’.
    reason: שַׁי의 어휘적 대안입니다.
  - marker: b
    text: ‘명령에 명령을 거듭하고’에 해당하는 히브리어 표현은 ‘줄 위에 줄’ 또는 ‘측량줄에 측량줄’로 이해될 수도 있습니다.
    reason: קַו קָו의 논쟁적 의미를 보존합니다.
lexical_decisions:
- source_word: שַׁי
  english_pob_choice: gift
  chosen_korean: 예물
  alternatives_korean:
  - 공물
  - 헌물
  - 선물
  lexicon: שַׁי
  rationale: POB가 ‘gift’로 확정한 점을 따라, 예배적·제의적 맥락을 살리되 조공의 뉘앙스는 과도하게 강하지 않은 ‘예물’을 택했습니다.
- source_word: לַיהוָה צְבָא֗וֹת / יְהוָ֥ה צְבָא֖וֹת
  english_pob_choice: the LORD of Armies
  chosen_korean: 만군의 주
  alternatives_korean:
  - 만군의 야훼
  - 만군의 여호와
  lexicon: יהוה + צבאות
  rationale: 본문의 YHWH를 프로젝트 기본값 ‘야훼’로 처리할 수 있으나, 본절의 POB가 지닌 ‘the LORD of Armies’ 관용을 한국어 성경 문맥에서 가장 직접적으로 옮길 수 있는 표지로 ‘만군의 주’를 채택했습니다.
- source_word: צְבָא֗וֹת / גּוֹי קַו קָו וּמְבוּסָה
  english_pob_choice: a nation of command upon command and trampling
  chosen_korean: 명령 위에 명령이 있고 짓밟히는 나라
  alternatives_korean:
  - 규례 위에 규례가 있고 짓밟히는 나라
  - 명령이 거듭되는 나라, 짓밟히는 나라
  lexicon: קַו קָו / וּמְבוּסָה
  rationale: ‘command upon command’의 반복적 압박과 행진의 이미지를 살리기 위해 직역에 가깝게 옮겼고, ‘trampling’은 상태 묘사로 보아 ‘짓밟히는’으로 처리했습니다.
- source_word: מְק֛וֹם שֵׁם
  english_pob_choice: the place of the name
  chosen_korean: 이름이 있는 곳
  alternatives_korean:
  - 이름의 장소
  - 이름이 머무는 곳
  lexicon: מקום + שם
  rationale: 히브리어 관용구를 과장하지 않고 보존하기 위해 문자적으로 옮겼으며, 뒤의 ‘시온 산’이 그 장소를 특정하므로 자연스러운 한국어 문장으로 정리했습니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 표기할 것인가
  chosen_reading: 본문은 ‘만군의 주’로 두고, 필요시 주석에서 YHWH 대응을 확인할 수 있게 했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 본절은 서술 구문 안에서 하나님의 칭호가 두 차례 반복되므로, 한국어 독자가 즉시 인식 가능한 경외적 호칭을 유지하는 것이 문장 흐름과 예배적 어조에 더 적합했습니다.
  doctrine_reference: 신명기 28–32, 이사야서의 야훼-만군의 주 칭호 사용
