revisions:
- from: “너희 형제들과 똑같은 이 미친 짓에 너도 빠지지 말고, 왕에게 설득당하여 너 자신을 구하십시오.”[a]
  to: “네 형제들이 빠진 것과 같은 광기에 너도 빠지지 말고, 왕의 말을 받아들여 네 자신을 구하십시오.”
  rationale: 단수 청자를 가리키는 소유 표현을 바로잡고, μανῇς와 μανία의 강한 어휘적 연관을 ‘광기’로 보존했습니다. ‘형제들이 빠진 것과 같은’은 한국어에서 비교 관계를 명확히 하며, ‘왕의 말을 받아들여’는 수동 분사 πεισθεὶς의 의미를 자연스럽게 반영합니다. 기존 각주는 번역 선택의 해설일 뿐 본문 이해에 필수적이지 않아 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:52:58Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 그리스어의 καὶ σὺ는 단수인 ‘너도’를 강조하며, τοῖς ἀδελφοῖς σου는 ‘네 형제들과/네 형제들이’입니다. 초안의 ‘너희 형제들과’는 단수 청자와 복수 소유 표현이 충돌합니다. 또한 μανῇς ... τὴν αὐτὴν μανίαν은 형제들과 동일한 광기에 빠지거나 미쳐서는 안 된다는 강한 표현입니다. πεισθεὶς τῷ βασιλεῖ는 왕의 설득을 받아들이라는 뜻이며, σῶζε σεαυτόν은 자신을 구하라는 명령입니다.
  naturalness: ‘이 미친 짓에 ... 빠지지 말고’는 구어적이고, ‘이’는 원문에 없는 지시성을 더합니다. 현대 공식 문체에서는 ‘광기에 ... 빠지지 말고’가 자연스러우면서도 원문의 강한 비난을 보존합니다. ‘왕의 말을 받아들여’는 ‘왕에게 설득되어’를 자연스럽게 풀어 쓴 표현입니다.
  terminology: μανία는 ‘광기’로 옮겨 μανῇς와의 어근 반복 및 수사적 강도를 유지했습니다. ‘구하십시오’는 σῶζε의 현재 명령과 합쇼체에 적절합니다. 본문에는 신학 전문 용어 또는 별도 주석이 필요한 본문상 이견이 없습니다.
  issues:
  - severity: medium
    issue: ‘너희 형제들과’와 ‘너도’의 인칭·수 일치 불일치
    rationale: 원문은 καὶ σὺ 및 σου로 일관되게 단수 청자에게 말합니다. 한국어도 ‘네 형제들/네 형제들이’로 맞추어야 합니다.
  - severity: low
    issue: ‘이 미친 짓’의 지시성 및 구어성
    rationale: 원문의 ‘같은 광기’에는 ‘이’에 해당하는 지시어가 없으며, ‘미친 짓’은 행위 중심으로 다소 의역됩니다. ‘광기’가 반복 어휘와 의미를 더 직접적으로 보존합니다.
  revised_text: “네 형제들이 빠진 것과 같은 광기에 너도 빠지지 말고, 왕의 말을 받아들여 네 자신을 구하십시오.”
