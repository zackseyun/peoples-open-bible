id: JOB.26.2
reference: Job 26:2
source:
  edition: WLC
  text: מֶה עָזַ֥רְתָּ לְ/לֹא כֹ֑חַ ה֝וֹשַׁ֗עְתָּ זְר֣וֹעַ לֹא עֹֽז־־־׃
translation:
  text: How you have helped one without power! How you have saved one whose arm has no strength!
  philosophy: dynamic
lexical_decisions:
- source_word: מֶה
  chosen: How
  alternatives:
  - What
  lexicon: HALOT
  rationale: In this exclamatory rhetorical question, מֶה functions idiomatically as an exclamation ('how!') rather than a simple interrogative 'what.' This better captures Job's irony toward Bildad.
- source_word: עָזַרְתָּ
  chosen: you have helped
  alternatives:
  - you helped
  lexicon: HALOT
  rationale: From עזר, 'help.' The perfect is rendered with English present perfect to convey the completed action with rhetorical force in direct address.
- source_word: לְלֹא כֹחַ
  chosen: one without power
  alternatives:
  - him who has no strength
  - one without power
  lexicon: HALOT
  rationale: This represents the singular, indefinite expression without introducing a collective referent.
- source_word: הוֹשַׁעְתָּ
  chosen: you have saved
  alternatives:
  - you have delivered
  lexicon: HALOT
  rationale: From ישׁע, whose core sense is 'save/deliver.' 'Saved' preserves the lexical force and the ironic parallelism with 'helped.' 'Delivered' is possible but less direct here.
- source_word: זְרוֹעַ
  chosen: an arm
  alternatives:
  - an arm
  - strength
  lexicon: HALOT
  rationale: The indefinite English article preserves the concrete image without added definiteness.
- source_word: לֹא עֹז
  chosen: without strength
  alternatives:
  - that has no might
  - without power
  lexicon: HALOT
  rationale: עֹז denotes strength, might. 'Without strength' gives a smooth English equivalent and mirrors the earlier כֹחַ while preserving the poetic parallelism.
