  source_fidelity: 히브리어 בִּרְכָתִי는 기본적으로 ‘내 축복’을 뜻하지만, 바로 앞의 가축 선물과 이 절의 수령 행위라는 문맥에서는 실제로 건네는 선물/예물을 가리킵니다. ‘예물’은 이 문맥을 적절히 반영합니다. 다만 הֻבָאת לָךְ는 수동형이므로 초안의 ‘당신에게로 가져온’보다 ‘당신께 가져온’ 또는 ‘당신께 드린’처럼 목적어와의 관계를 더 자연스럽게 드러낼 필요가 있습니다. וַיִּפְצַר는 단순한 부탁보다 강하게 권함을 뜻하므로 ‘간청했다’보다 ‘강권했다’가 정확합니다.
  naturalness: 초안의 ‘당신에게로 가져온’은 현대 한국어에서 다소 부자연스럽고, 연속된 ‘그는’은 문맥상 인물을 식별하기 어렵게 합니다. 야곱과 에서를 밝혀 주고, 인용문 안에서는 합쇼체에 맞춰 ‘제게/제 예물’을 쓰는 것이 자연스럽습니다.
  terminology: ‘하나님’과 ‘은혜를 베푸셨다’는 적절합니다. ‘예물’은 종교 의례의 봉헌물을 연상할 여지가 있으나, 존대 장면에서 건네는 선물이라는 문맥에 무리 없이 맞고 영어 POB의 ‘gift’와도 부합합니다. 각주에서 ‘축복’이라는 어휘적 배경을 밝혀 의미 범위를 보존합니다.
