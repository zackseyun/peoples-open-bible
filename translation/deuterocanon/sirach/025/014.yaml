reference: Sirach 25:14
source:
  edition: lxx-swete-1909
  text: πᾶσαν ἐπαγωγήν, καὶ μὴ ἐπαγωγὴν μισούντων· καὶ πᾶσαν ἐκδίκησιν, καὶ μὴ ἐκδίκησιν ἐχθρῶν.
