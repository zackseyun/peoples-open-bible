id: PSA.132.1
reference: Psalms 132:1
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת זְכוֹר יְהוָ֥ה לְ/דָוִ֑ד אֵ֝ת כָּל עֻנּוֹתֽ/וֹ־־׃
translation:
  text: Yahweh, remember David and all his affliction.
  philosophy: dynamic
lexical_decisions:
- source_word: שִׁיר
  chosen: Song
  alternatives:
  - song
  - psalm
  lexicon: HALOT
  rationale: Superscription term meaning 'song.' 'Song' is the standard concise rendering in the psalm headings; 'psalm' would be less precise here because the Hebrew specifically uses שִׁיר rather than מִזְמוֹר.
- source_word: הַמַּעֲלוֹת
  chosen: of Ascents
  alternatives:
  - of goings up
  - of steps
  lexicon: HALOT
  rationale: In the established psalm superscription שִׁיר הַמַּעֲלוֹת, the noun denotes 'ascents/goings up.' 'Song of Ascents' is both idiomatic and close to the Hebrew, preserving the traditional collection title without over-interpreting its background.
- source_word: זְכוֹר
  chosen: Remember
  alternatives:
  - call to mind
  - remember favorably
  lexicon: HALOT
  rationale: Imperative addressed to God. 'Remember' preserves the covenantal-prayer force of זכר without adding interpretive expansion; the favorable or active sense is implied by context rather than stated explicitly.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: לְדָוִד
  chosen: David
  alternatives:
  - for David
  - to David
  - concerning David
  lexicon: HALOT
  rationale: In this prayer the lamed identifies David as the one in whose regard Yahweh is asked to remember; direct coordination is natural English.
- source_word: אֵת כָּל
  chosen: all
  alternatives:
  - all of
  - the whole of
  lexicon: HALOT
  rationale: אֵת marks the direct object and is not translated independently; with כָּל it yields 'all.'
- source_word: עֻנּוֹתוֹ
  chosen: his affliction
  alternatives:
  - his suffering
  - all his hardship
  - all his humiliation
  lexicon: HALOT
  rationale: The singular abstract noun preserves the breadth of the Hebrew better than a required pluralization.
