  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 책임자에게
  - 인도자에게
  - 지휘관에게
  lexicon: HALOT
  rationale: 시편 표제에서 공연을 맡는 책임자를 가리키는 말이므로, 현대 한국어로는 음악적 기능을 드러내는 ‘지휘자에게’가 가장 자연스럽습니다.
- source_word: בִּנְגִינוֹת
  english_pob_choice: with stringed instruments
  chosen_korean: 현악기로 연주하며
  alternatives_korean:
  - 현악기로
  - 현악 반주로
  - 줄악기로 연주하며
  lexicon: HALOT
  rationale: 문맥상 악기 또는 현악 반주를 가리키므로, ‘현악기로 연주하며’가 한국어로 의미를 분명히 하면서도 과도하게 특정하지 않습니다.
- source_word: הַשְּׁמִינִית
  english_pob_choice: the Sheminith
  chosen_korean: 스미니트에 따라
  alternatives_korean:
  - 여덟째에 따라
  - 옥타브에 따라
  - 스미니트
  lexicon: HALOT
  rationale: 정확한 뜻이 확정되지 않은 음악 용어이므로 음역을 유지해 본문에서 함부로 의미를 단정하지 않았습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에 속한
  - 다윗이 지은
  - 다윗을 위한
  lexicon: HALOT
  rationale: לְ가 표제에서 저자 표기, 관련성, 헌정 모두를 열어 둘 수 있으므로 ‘다윗의’로 옮겨 영어 POB가 보존한 애매성을 유지했습니다.
theological_decisions:
- issue: 시편 표제의 기능과 범위
  chosen_reading: 표제를 본문 일부로 번역하되, 음악적 지시와 시의 성격을 함께 드러냈습니다.
  alternative_readings:
  - 표제를 생략하거나 주석으로만 처리
  - 더 강한 저작 표기로 단정
  rationale: 히브리어 본문에 있는 표제 정보를 보존하는 편이 원문에 더 충실하며, 동시에 저작 관계는 단정하지 않아야 합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
