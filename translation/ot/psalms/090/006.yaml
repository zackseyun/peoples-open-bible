id: PSA.90.6
reference: Psalms 90:6
source:
  edition: WLC
  text: בַּ֭/בֹּקֶר יָצִ֣יץ וְ/חָלָ֑ף לָ֝/עֶ֗רֶב יְמוֹלֵ֥ל וְ/יָבֵֽשׁ׃
translation:
  text: In the morning it sprouts and grows anew; by evening it withers[a] and dries up.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “is cut down.”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּבֹּקֶר
  chosen: In the morning
  alternatives:
  - In morning
  - At morning
  lexicon: HALOT
  rationale: Temporal prepositional phrase marking the time of the grass's brief vitality. 'In the morning' is natural modern English and preserves the temporal sense.
- source_word: יָצִיץ
  chosen: it sprouts
  alternatives:
  - it blossoms
  - it flourishes
  - it shoots up
  lexicon: HALOT
  rationale: From צוץ/יץץ in the Hiphil, denoting sprouting or blossoming. 'Sprouts' best captures the initial emergence/growth stage in parallel with the later decline. 'Blossoms' is possible, but 'sprouts' fits the life-cycle imagery more precisely here.
- source_word: וְחָלָף
  chosen: and grows anew
  alternatives:
  - and passes away
  - and changes
  - and grows on
  lexicon: HALOT
  rationale: Within the morning half of the growth-and-decay image, the verb conveys renewed growth/change rather than a simple abstract flourishing.
- source_word: לָעֶרֶב
  chosen: by evening
  alternatives:
  - in the evening
  - toward evening
  lexicon: HALOT
  rationale: Temporal phrase indicating the transition to the day's end. 'By evening' communicates the contrast with morning and the rapidity of the change.
- source_word: יְמוֹלֵל
  chosen: it withers
  alternatives:
  - it is cut down
  - it droops
  - it fades
  lexicon: HALOT
  rationale: The verb can denote being cut off or withering/fading in plant imagery. Given the immediate pairing with 'dries up,' 'withers' gives a coherent picture of decline without over-specifying an external agent. 'Cut down' is possible but less likely in this parallel description of natural transience.
- source_word: וְיָבֵשׁ
  chosen: and dries up
  alternatives:
  - and becomes dry
  - and withers away
  lexicon: HALOT
  rationale: Straightforward rendering of יבש in plant imagery. 'Dries up' is idiomatic and preserves the final stage of desiccation.
