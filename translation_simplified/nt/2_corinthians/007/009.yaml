translation:
  language: en
  text: Now I rejoice—not because you were saddened, but because your sorrow led you to repentance[c].[a] You were saddened in a way that was in keeping with God,[b] so that you would not suffer any loss through us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “led you to a change of mind.”
    reason: lexical_alternative
  - marker: b
    text: Or “in a godly way” or “as God wills.”
    reason: lexical_alternative
  - marker: c
    text: Sorrow leads to or produces repentance here; they are not the same thing. Repentance describes changed disposition and conduct, not merely feeling sorry. The separate language of regret remains distinct.
    reason: lexical_alternative
