  to: My hand will be steadfast with him; indeed[a], my arm will strengthen him.
  rationale: The current "with whom my hand will be established" is syntactically over-literal and unnatural, while "will remain" supplies a duration idea rather than directly rendering the firmness denoted by תִּכּוֹן. "My hand will be steadfast with him" is natural English, retains the concrete image, and expresses the promised firm support. The relative construction may be left implicit in English because the antecedent is clear from the preceding context.
