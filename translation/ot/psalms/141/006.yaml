id: PSA.141.6
reference: Psalms 141:6
source:
  edition: WLC
  text: נִשְׁמְט֣וּ בִֽ/ידֵי סֶ֭לַע שֹׁפְטֵי/הֶ֑ם וְ/שָׁמְע֥וּ אֲ֝מָרַ֗/י כִּ֣י נָעֵֽמוּ־׃
translation:
  text: When their rulers are thrown down beside the cliff[a], they[b] will hear my words, for they are pleasant.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “in/by the hands of a rock”; this difficult phrase is often understood as being thrown down from a cliff.
    reason: lexical_alternative
  - marker: b
    text: The hearers may be the rulers or the people they govern.
    reason: alternative_reading
lexical_decisions:
- source_word: נִשְׁמְטוּ
  chosen: have been thrown down
  alternatives:
  - have been cast down
  - have been let slip
  - have been overthrown
  lexicon: HALOT
  rationale: The Niphal form of שׁמט conveys being dropped, thrown down, or made to slip. In this poetic context, an English passive expressing violent downfall fits better than a milder 'slipped.'
- source_word: בִידֵי
  chosen: by the sides of
  alternatives:
  - into the hands of
  - at the hands of
  lexicon: HALOT
  rationale: Although בְּיָד often means 'in/into the hand(s) of,' with an inanimate noun following ('rock') that idiom is awkward in English. The phrase is commonly understood spatially here, referring to the sides or places alongside a crag.
- source_word: סֶלַע
  chosen: the cliff
  alternatives:
  - a crag
  - the cliff
  lexicon: HALOT
  rationale: “Cliff” is a natural contextual rendering of the rocky crag denoted by סֶלַע and suits the scene without specifying an exact landform.
- source_word: שֹׁפְטֵיהֶם
  lemma: שׁפט
  chosen: their judges
  alternatives:
  - their rulers
  lexicon: HALOT
  rationale: The participial form from שׁפט normally denotes those who judge or rule. 'Judges' is the most direct rendering, while 'rulers' is possible by extension.
- source_word: וְשָׁמְעוּ
  chosen: they will hear
  alternatives:
  - then they hear
  - and they will hear
  lexicon: HALOT
  rationale: Naturally expresses the second clause as the consequence of the temporally construed first clause, without claiming that this sequence is morphologically mandatory.
- source_word: אֲמָרַי
  chosen: my words
  alternatives:
  - my sayings
  - what I say
  lexicon: HALOT
  rationale: A straightforward rendering of the plural construct with first-person suffix; 'words' is natural and sufficiently formal.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - that
  lexicon: HALOT
  rationale: Here כִּי introduces the reason the words are heard/received. 'For' preserves the explanatory force in concise poetic English.
- source_word: נָעֵמוּ
  chosen: they are pleasant
  alternatives:
  - they are sweet
  - they are delightful
  lexicon: HALOT
  rationale: The verb נעם conveys pleasantness or agreeableness. 'Pleasant' is idiomatic and avoids over-sentimentalizing the line while preserving the positive evaluation of the psalmist's words.
- source_word: נִשְׁמְטוּ בִידֵי סֶלַע
  chosen: When ... are thrown down beside the cliff
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Retains the plausible downfall and temporal reading while avoiding the stale claim that יָד itself means “side”; the unresolved literal construction is documented in the note.
