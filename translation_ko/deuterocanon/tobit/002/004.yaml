  text: And I, before I had tasted anything, sprang up and removed him into a room until the sun set.
translation:
  language: ko
  text: 그리고 나는 아직 아무것도 맛보기도 전에 벌떡 일어나, 해가 질 때까지 그를 어느 방으로 옮겨 두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀγώ
  english_pob_choice: And I
  chosen_korean: 그리고 나는
  alternatives_korean:
  - 나도
  - 그리고 저도
  lexicon: καί + ἐγώ
  rationale: 서술의 연결을 분명히 하면서 1인칭 화자를 자연스럽게 드러내는 기본적인 연결어로 옮겼습니다.
- source_word: πρὶν ἢ γεύσασθαί με
  english_pob_choice: before I had tasted anything
  chosen_korean: 아직 아무것도 맛보기도 전에
  alternatives_korean:
  - 맛보기 전에
  - 음식을 입에 대기도 전에
  lexicon: πρίν ἤ + γεύομαι
  rationale: ‘맛보다’의 직접 의미를 살리되, 문맥상 식사 전에라는 뜻이 분명하므로 한국어에서는 자연스럽게 “아무것도 맛보기도 전에”로 풀었습니다.
- source_word: ἀνειλόμην αὐτὸν εἰς τι οἴκημα
  english_pob_choice: removed him into a room
  chosen_korean: 그를 어느 방으로 옮겨 놓았는데
  alternatives_korean:
  - 그를 방 안으로 옮겼는데
  - 그를 어떤 방으로 데려갔는데
  lexicon: ἀναιρέω + οἴκημα
  rationale: 영어 POB의 ‘removed’는 단순히 데려감보다 ‘옮겨 두다’에 가깝습니다. οἴκημα는 방/거처이므로 ‘어느 방’으로 옮겨 놓았다고 옮겼습니다.
- source_word: ἕως οὗ ἔδυ ὁ ἥλιος
  english_pob_choice: until the sun set
  chosen_korean: 해가 질 때까지
  alternatives_korean:
  - 해가 질 때까지
  - 태양이 질 때까지
  lexicon: ἕως οὗ + δύω + ὁ ἥλιος
  rationale: 관용적 시간 표현이므로 자연스러운 현대 한국어로 직역에 가까이 옮겼습니다.
