id: JOB.10.18
reference: Job 10:18
source:
  edition: WLC
  text: וְ/לָ֣/מָּה מֵ֭/רֶחֶם הֹצֵאתָ֑/נִי אֶ֝גְוַ֗ע וְ/עַ֣יִן לֹא תִרְאֵֽ/נִי־׃
translation:
  text: Why, then, did you bring me out of the womb? If only I had died before any eye had seen me!
  philosophy: dynamic
lexical_decisions:
- source_word: וְלָמָה
  chosen: Why, then,
  alternatives:
  - And why
  - Why
  lexicon: HALOT
  rationale: Interrogative 'why' with prefixed conjunction. 'Then' brings out the discourse connection from the preceding complaint without overtranslating.
- source_word: מֵרֶחֶם
  chosen: from the womb
  alternatives:
  - out of the womb
  lexicon: HALOT
  rationale: Straightforward spatial source expression; 'womb' preserves the concrete birth imagery.
- source_word: הֹצֵאתָנִי
  chosen: did you bring me out
  alternatives:
  - did you bring me forth
  - did you cause me to come out
  lexicon: HALOT
  rationale: Hiphil of יצא with 1cs suffix refers to causing birth/emergence. 'Bring me out' is natural English and keeps the direct address to God.
- source_word: אֶגְוַע
  chosen: I would have died
  alternatives:
  - I would have died
  - might I have died
  - expired
  lexicon: HALOT
  rationale: The imperfect has counterfactual force in this lament sequence.
- source_word: וְעַיִן
  chosen: and no eye
  alternatives:
  - so that no eye
  - and not an eye
  lexicon: HALOT
  rationale: '''Eye'' stands metonymically for any observer. Adding ''no'' in English reflects the following negation naturally.'
- source_word: לֹא תִרְאֵנִי
  chosen: would have seen me
  alternatives:
  - should see me
  - would see me
  lexicon: HALOT
  rationale: With the preceding clause, the imperfect conveys the unreal result of the wished-for death before birth. 'Would have seen me' makes the counterfactual sequence explicit in English.
