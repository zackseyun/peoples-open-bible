  text: בַּ/יָּמִ֣ים הָ/הֵ֡מָּה רָאִ֣יתִי בִֽ/יהוּדָ֣ה דֹּֽרְכִֽים גִּתּ֣וֹת בַּ/שַּׁבָּ֡ת וּ/מְבִיאִ֣ים הָ/עֲרֵמ֣וֹת וְֽ/עֹמְסִ֪ים עַל הַ/חֲמֹרִ֟ים וְ/אַף יַ֜יִן עֲנָבִ֤ים וּ/תְאֵנִים֙ וְ/כָל מַשָּׂ֔א וּ/מְבִיאִ֥ים יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וָ/אָעִ֕יד בְּ/י֖וֹם מִכְרָ֥/ם צָֽיִד׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/015.yaml
  text: In those days I saw in Judah people treading winepresses on the Sabbath, and bringing in heaps of grain and loading them on donkeys—and also wine, grapes, figs, and every kind of load—and bringing them into Jerusalem on the Sabbath day. So I testified against them on the day they sold food.
translation:
  language: ko
  text: 그 무렵에 나는 유다에서 사람들이 안식일에 포도주 틀을 밟고, 곡식 더미를 가져와 나귀에 싣고, 포도주와 포도와 무화과와 온갖 짐을 안식일에 예루살렘으로 들여오는 것을 보았습니다. 그래서 나는 그들이 양식을 팔던 날에 그들에게 경고했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּרְכִים גִּתּוֹת
  english_pob_choice: people treading winepresses
  chosen_korean: 포도즙 틀을 밟는 것
  alternatives_korean:
  - 포도즙 틀을 짓밟는 것
  - 포도원을 밟는 것
  lexicon: דָּרַךְ / גַּת
  rationale: 히브리어는 포도즙을 내기 위해 틀을 밟는 동작을 가리키므로, 관용적으로 ‘포도즙 틀을 밟다’로 옮겨 노동 행위를 드러냈습니다.
- source_word: הָעֲרֵמוֹת
  english_pob_choice: heaps of grain
  chosen_korean: 곡식 더미
  alternatives_korean:
  - 곡물 더미
  - 이삭 더미
  lexicon: עֲרֵמָה
  rationale: 문맥상 운반되는 짐의 첫 항목이므로, ‘곡식 더미’가 가장 자연스럽고 구체적입니다.
- source_word: מַשָּׂא
  english_pob_choice: every kind of load
  chosen_korean: 온갖 짐
  alternatives_korean:
  - 모든 짐
  - 각종 짐
  lexicon: מַשָּׂא
  rationale: 뒤따르는 열거를 포괄하는 표현으로, 의미를 과도하게 확정하지 않는 ‘온갖 짐’이 적절합니다.
- source_word: צָיִד
  english_pob_choice: food
  chosen_korean: 양식
  alternatives_korean:
  - 먹거리
  - 식량
  lexicon: צָיִד
  rationale: 영어 POB가 본문 개정으로 ‘provisions’에서 ‘food’로 정리한 점을 반영하되, 상업적 거래의 일반식을 나타내는 말로 ‘양식’을 택했습니다.
theological_decisions:
- issue: 안식일 위반을 서술하는 전치사 반복의 처리
  chosen_reading: ‘안식일에 … 안식일에 …’를 반복해 위반의 장소와 시간을 모두 드러냈습니다.
  alternative_readings:
  - 한 번만 반복해 자연스럽게 정리하는 번역
  rationale: 본문은 유다와 예루살렘에서 안식일에 행해진 거래를 누적적으로 강조하므로, 반복을 살려 고발의 강도를 유지했습니다.
  doctrine_reference: 네헤미야 13장의 안식일 개혁 서술
