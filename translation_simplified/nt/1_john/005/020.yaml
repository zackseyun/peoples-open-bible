  text: We know that the Son of God has come. He has given us understanding so that we may know the True One. We are in the True One—in his Son, Jesus Christ. This one is the true God and eternal life.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “This one” most naturally refers to Jesus the Messiah, but it may refer to the True One, the Father.
