lexical_decisions:
- source_word: הַר צִיּוֹן
  english_pob_choice: Mount Zion
  chosen_korean: 시온 산
  alternatives_korean:
  - 시온의 산
  - 시온 산악
  lexicon: HALOT
  rationale: 히브리어의 지명 결합을 한국어에서 자연스럽게 옮기되, ‘산’의 지리적 이미지를 보존했습니다.
- source_word: בְּנוֹת יְהוּדָה
  english_pob_choice: the daughters of Judah
  chosen_korean: 유다의 딸들
  alternatives_korean:
  - 유다의 마을들
  - 유다의 촌락들
  - 유다의 여자들
  lexicon: HALOT
  rationale: 시적 표현의 직역을 본문에 유지해, 지명화된 공동체일 수도 있다는 중의성을 한국어 본문에서 바로 지우지 않았습니다.
- source_word: מִשְׁפָּטֶיךָ
  english_pob_choice: your judgments
  chosen_korean: 주님의 판단
  alternatives_korean:
  - 주님의 심판
  - 주님의 공의
  - 주님의 규례
  lexicon: HALOT
  rationale: 문맥상 토라 규정이라기보다 왕이자 재판관으로서 행하시는 하나님의 판정과 처분을 가리키므로, ‘판단’으로 옮겨 판결 행위를 드러냈습니다.
- source_word: לְמַעַן
  english_pob_choice: because of
  chosen_korean: 때문에
  alternatives_korean:
  - 으로 말미암아
  - 를 인하여
  lexicon: HALOT
  rationale: 기쁨의 이유를 나타내는 인과 관계를 한국어에서 가장 자연스럽게 표현했습니다.
theological_decisions:
- issue: מִשְׁפָּטֶיךָ의 신학적 뉘앙스
  chosen_reading: 하나님의 주권적 판단과 심판 행위로 이해했습니다.
  alternative_readings:
  - 하나님의 공의
  - 하나님의 율례
  rationale: 이 시편의 맥락은 하나님의 보호와 대적들에 대한 통치적 개입을 찬양하는 흐름이므로, ‘판단’이 단순한 법규보다 왕적·재판적 행위를 더 잘 드러냅니다.
  doctrine_reference: 하나님의 주권과 심판
