translation:
  text: For they could no longer speak or lift their eyes to heaven, because of the
    shame of their sins for which they had been condemned.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Charles 1906 stars the pronoun introducing the explanation. The main text
      follows his selected wording without inserting an unstated recipient of the
      speech.
    reason: textual_variant
lexical_decisions:
- source_word: እስመ፡ እሙንቱሰ
  chosen: For they
  alternatives:
  - Because they, however
  rationale: Preserves the causal connection; the contrastive particle does not require
    an awkward English insertion.
- source_word: ኢይክሉ፡ እምይእዜ፡ ተናግሮ
  chosen: could no longer speak
  alternatives:
  - could not speak from then on
  rationale: Renders the negated ability and temporal expression without supplying
    an addressee absent from the witness.
- source_word: ወኢያነስኡ፡ አዕይንቲሆሙ፡ ውስተ፡ ሰማይ
  chosen: or lift their eyes to heaven
  alternatives:
  - nor raise their eyes toward heaven
  rationale: Retains the physical and heavenly imagery.
- source_word: እምኃፍረት፡ አበሳሆሙ
  chosen: because of the shame of their sins
  alternatives:
  - out of shame for their offenses
  rationale: Preserves both their shame and the sins that occasion it.
- source_word: ዘተኰነኑ
  chosen: for which they had been condemned
  alternatives:
  - on account of which they were condemned
  rationale: The relative clause points back to their sins; the passive leaves the
    condemning agent unnamed.
theological_decisions:
- issue: Ground and agent of condemnation
  chosen_reading: Their sins are the grounds for condemnation; the judge is not named.
  alternative_readings:
  - The relative clause could refer more broadly to their disgrace.
  rationale: The relative clause follows “their sins,” while the passive verb does
    not identify who condemned them.
