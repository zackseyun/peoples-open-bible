lexical_decisions:
- source_word: δεύτερος
  chosen: the second
  alternatives:
  - second
  lexicon: LSJ
  rationale: Used substantivally with the article, referring to the second-ranked person among those under discussion. English keeps the ordinal as a title-like designation.
- source_word: καθιεῖται
  chosen: will sit beside
  alternatives:
  - will be seated
  - will sit down
  - will be appointed to sit
  lexicon: LSJ
  rationale: The verb naturally denotes being seated or taking a seat. In this courtly context, with Darius as the reference point, 'will sit beside' brings out the implied honor of placement near the king better than the flatter 'will be seated,' without overparaphrasing into 'will be appointed.'
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  chosen: because of his wisdom
  alternatives:
  - on account of his wisdom
  - through his wisdom
  lexicon: LSJ
  rationale: διά with the accusative here is causal. 'Because of his wisdom' is the clearest modern English expression of the reason for the honor described.
- source_word: συγγενής
  chosen: kinsman
  alternatives:
  - relative
  - kinsman
  - kinsman/close relation
  lexicon: LSJ
  rationale: The term denotes one of the same family or kin. 'Kinsman' preserves the elevated, courtly tone and avoids the possible modern narrowness of 'relative' while not overstating literal blood relation beyond the Greek.
- source_word: κληθήσεται
  chosen: will be called
  alternatives:
  - will be named
  - will be regarded as
  lexicon: LSJ
  rationale: Future passive of 'call/name.' 'Will be called' preserves the wording and leaves open whether the designation is formal or honorific.
