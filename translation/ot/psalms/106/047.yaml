theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Nuance of לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  chosen_reading: boast in your praise
  alternative_readings:
  - glory in your praise
  - exult in your praise
  rationale: The phrase expresses exultant self-involving praise centered on God. 'Boast' best preserves the strong biblical idiom without softening it to a generic 'rejoice,' while making clear that the boasting is in relation to God's praise, not human achievement.
