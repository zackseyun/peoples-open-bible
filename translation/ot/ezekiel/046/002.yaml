  to: The prince shall enter from outside by way of the porch of the gate and shall stand by the doorpost of the gate. Then the priests shall offer his burnt offering and his peace offerings[a], and he shall bow down in worship at the threshold of the gate. Then he shall go out, but the gate shall not be shut until evening.
