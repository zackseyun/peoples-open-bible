  from: and cuts off the spear
  to: and cuts the spear in pieces
  rationale: The Hebrew verb קִצֵּץ (qitsets) means 'to cut in pieces.' While 'cuts off' is a possible gloss, it is an awkward fit for the object 'spear' in English. One does not typically 'cut off' a spear. 'Cuts the spear in pieces' or 'splinters the spear' more naturally conveys the act of destroying this type of weapon and better reflects the destructive force of the verb.
