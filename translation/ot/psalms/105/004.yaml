- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Whether to translate פָנָיו idiomatically as 'his presence' or formally as 'his face'
  chosen_reading: his face
  alternative_readings:
  - his presence
  rationale: The Hebrew idiom can denote presence, but the project favors preserving theological and literary tension rather than resolving imagery too quickly. 'Seek his face' keeps the anthropomorphic covenant language of the psalm, with the idiomatic alternative preserved in a footnote.
