translation:
  language: ko
  text: 온 마음으로 하나님을 경외하고, 그의 제사장들을 공경하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그의 제사장들을 거룩하게 하라’입니다. 여기서는 그들을 거룩한 직분을 지닌 이들로 대하고 공경하라는 뜻입니다. 그리스어 번역은 ‘경탄하다/높이 여기다’라는 표현을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: בְּכָל לִבְּך
  english_pob_choice: With all your heart
  chosen_korean: 마음 다하여
  alternatives_korean:
  - 온 마음으로
  - 전심으로
  lexicon: לֵב / καρδία
  rationale: 히브리어 ‘마음’은 단순 감정보다 의지와 중심을 포함하므로, 자연스러운 현대 한국어로는 ‘마음 다하여’가 원문의 총체성을 잘 드러냅니다.
- source_word: פְּחַד אִל
  english_pob_choice: fear God
  chosen_korean: 하나님을 경외하고
  alternatives_korean:
  - 하나님을 두려워하고
  - 하나님을 무서워하고
  lexicon: יָרֵא / εὐλαβέομαι
  rationale: 문맥상 단순 공포보다 경외와 신앙적 두려움을 가리키므로, 합쇼체에서 자연스럽고 신학적으로도 정확한 ‘경외하다’를 택했습니다.
- source_word: כֹּהֲנָיו
  english_pob_choice: his priests
  chosen_korean: 그의 제사장들을
  alternatives_korean:
  - 그의 사제들을
  - 그의 성직자들을
  lexicon: כֹּהֵן / ἱερεύς
  rationale: 히브리어와 그리스어가 모두 제의적 직분을 가리키므로, 한국어 성서 용례에 맞는 ‘제사장들’을 유지했습니다.
- source_word: הַקְדִישׁ / θαύμαζε
  english_pob_choice: honor
  chosen_korean: 존중하십시오
  alternatives_korean:
  - 공경하십시오
  - 존경하십시오
  lexicon: קדשׁ / θαυμάζω
  rationale: POB의 개정된 ‘honor’를 반영하되, 제사장 직분에 대한 적절한 태도를 현대 한국어로 직접 전달하는 ‘존중하다’를 선택했습니다.
theological_decisions:
- issue: 제사장들에 대한 태도 표현
  chosen_reading: ‘거룩하게 하다’보다 ‘존중하다’로 번역해, 직분의 존엄을 인정하라는 뜻으로 제시했습니다.
  alternative_readings:
  - ‘성별하십시오’
  - ‘거룩하게 하십시오’
  rationale: 영어 POB의 audit trail이 이미 ‘sanctify’에서 ‘honor’로 개정되었으므로, 본문 의미를 과도한 성화 명령으로 확대하지 않고 존중과 경외의 윤리를 드러내는 번역이 더 적절합니다.
  doctrine_reference: 직분 존중, 예배 질서
