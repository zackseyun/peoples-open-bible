  text: Καὶ βασιλεὺς Δαρεῖος ἐποίησεν δοχὴν μεγάλην πᾶσιν τοῖς ὑπʼ αὐτόν, καὶ πᾶσιν τοῖς οἰκογενέσιν αὐτοῦ, καὶ πᾶσιν τοῖς μεγιστᾶσιν τῆς Μηδείας καὶ τῆς Περσίδος,
