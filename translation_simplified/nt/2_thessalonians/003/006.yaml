translation:
  language: en
  text: Brothers,[a] in the name of our Lord Jesus Christ, we command you to keep away from any brother whose way of life is disorderly and who does not follow the tradition they received from us.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Brothers” translates a masculine plural term, but Paul is addressing the whole church.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read “you received” or “he received” instead of “they received.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: every brother who is walking disorderly
  simplified_phrase: any brother whose way of life is disorderly
  preserved_meaning: The brother’s ongoing conduct is outside proper order or discipline.
  reasoning_layer_used: POB lexical decisions for ἀτάκτως and περιπατοῦντος
  rationale: “Way of life” makes Paul’s walking image understandable as a person’s conduct.
- pob_phrase: and not according to the tradition
  simplified_phrase: and who does not follow the tradition
  preserved_meaning: The person is not living by the apostolic tradition.
  reasoning_layer_used: POB lexical decision for μὴ κατὰ τὴν παράδοσιν
  rationale: “Does not follow” expresses the practical force of “not according to” in natural English.
- pob_phrase: We command you, brothers, in the name
  simplified_phrase: Brothers, in the name ... we command you
  preserved_meaning: Paul gives the church an authoritative command under Jesus’ name.
  reasoning_layer_used: POB lexical decisions for Παραγγέλλομεν and ἐν ὀνόματι
  rationale: Reordering the address reduces sentence strain while retaining its solemn authority.
translation_notes:
