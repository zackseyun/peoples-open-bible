translation:
  language: ko
  text: 하나님께서 그의 거룩함 가운데 말씀하셨습니다. “내가 크게 기뻐하리라. 내가 세겜을 나누고 숙곳 골짜기를 측량하리라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 그의 성소에서 말씀하셨습니다’ 또는 ‘하나님께서 그의 거룩함으로 말씀하셨습니다.’ 히브리어 표현은 하나님의 거룩함을 가리킬 수도 있고, 그와 관련된 거룩한 장소를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
