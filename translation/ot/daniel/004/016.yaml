  from: Then Daniel[a], whose name was Belteshazzar, was appalled for about an hour, and his thoughts terrified him. The king answered and said, “Belteshazzar, do not let the dream or its interpretation terrify you.” Belteshazzar answered and said, “My lord, may the dream be for those who hate you[b], and its interpretation for your enemies.”
  to: Then Daniel, whose name was Belteshazzar, was appalled for a while[a], and his thoughts terrified him. The king said, “Belteshazzar, do not let the dream or its interpretation terrify you.” Belteshazzar replied, “My lord, if only the dream applied to those who hate you, and its interpretation to your enemies!”
