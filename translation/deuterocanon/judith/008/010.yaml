  text: καὶ ἀποστείλασα τὴν ἅβραν αὐτῆς τὴν ἐφεστῶσαν πᾶσιν τοῖς ὑπάρχουσιν αὐτῆς ἐκάλεσεν Χαβρεὶν καὶ Χαρμεῖν τοὺς πρεσβυτέρους τῆς πόλεως αὐτῆς.
