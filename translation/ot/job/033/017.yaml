id: JOB.33.17
reference: Job 33:17
source:
  edition: WLC
  text: לְ֭/הָסִיר אָדָ֣ם מַעֲשֶׂ֑ה וְ/גֵוָ֖ה מִ/גֶּ֣בֶר יְכַסֶּֽה׃
translation:
  text: to turn a person from wrongdoing and keep him from pride[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “to turn a person from a deed and hide pride from a man.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָסִיר
  chosen: to turn ... from
  alternatives:
  - to remove
  - to turn away
  lexicon: HALOT
  rationale: 'The Hiphil infinitive construct of סור here expresses causation: causing someone to depart from something. In context with אָדָם and מַעֲשֶׂה, ''to turn a man from'' communicates the idiomatic sense more naturally than the more wooden ''to remove a man from.'''
- source_word: אָדָם
  chosen: a man
  alternatives:
  - humankind
  - a person
  lexicon: HALOT
  rationale: Per doctrine, אָדָם is rendered according to context. Here it is singular and paired with גֶּבֶר ('strong man/man'), so the masculine singular 'a man' best reflects the Hebrew parallelism rather than a collective 'humankind.'
- source_word: מַעֲשֶׂה
  chosen: his deed
  alternatives:
  - his work
  - his action
  lexicon: HALOT
  rationale: 'The noun can mean deed, work, or action. In this context of divine warning restraining wrongdoing, ''deed'' fits the moral sense well and reads naturally in English. The possessive sense is implicit in the Hebrew construction: turning a man from his own deed.'
- source_word: וְגֵוָה
  chosen: pride
  alternatives:
  - arrogance
  - haughtiness
  lexicon: HALOT
  rationale: The noun denotes exaltation in the negative sense here. 'Pride' is the most idiomatic and concise English rendering, while preserving the moral force of the term.
- source_word: מִגֶּבֶר
  chosen: from a strong man
  alternatives:
  - from a man
  - from a warrior
  lexicon: HALOT
  rationale: גֶּבֶר often emphasizes man in his strength or vigor. Rendering it 'strong man' preserves the lexical distinction from אָדָם in the first colon. A simpler 'man' would flatten the Hebrew parallelism.
- source_word: יְכַסֶּה
  chosen: to cover
  alternatives:
  - to conceal
  - to hide
  lexicon: HALOT
  rationale: Though morphologically an imperfect, it functions here in parallel with the preceding infinitive and expresses purpose/result in Elihu's statement. 'To cover' preserves the concrete Hebrew metaphor and allows the sense of suppressing or hiding pride. 'Conceal' is possible but more interpretive.
- source_word: לְהָסִיר אָדָם מַעֲשֶׂה
  chosen: to turn a person from his deed
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This gives the contextual purpose sense while retaining the singular deed; the alternative syntactic construal is noted.
- source_word: וְגֵוָה מִגֶּבֶר יְכַסֶּה
  chosen: and to hide pride from him
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English for the construction while preserving its ambiguity.
- source_word: גֶּבֶר
  chosen: him
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Avoids importing a strength emphasis while retaining the second singular human referent.
