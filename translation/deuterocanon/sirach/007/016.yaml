  rationale: For Sirach, the project translates from the Hebrew where it survives, while using the Greek as a real input and consistency check. Here the Greek parallel is not a close equivalent but a substantially different line, indicating a divergent textual tradition rather than a minor lexical variation. Therefore the main text follows the Hebrew witness, and the Greek reading is preserved in a footnote as a textual variant of interpretive significance.
