id: PSA.47.7
reference: Psalms 47:7
source:
  edition: WLC
  text: כִּ֤י מֶ֖לֶךְ כָּל הָ/אָ֥רֶץ אֱלֹהִ֗ים זַמְּר֥וּ מַשְׂכִּֽיל־׃
translation:
  text: For God is the King of all the earth; sing praises with understanding[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'sing praises skillfully,' or 'sing a Maskil,' a psalm designation whose precise meaning is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - Because
  lexicon: HALOT
  rationale: Introduces the ground or reason for the preceding summons to praise. 'For' best preserves the causal/explanatory force in natural English.
- source_word: מֶלֶךְ
  chosen: King
  alternatives:
  - a king
  - the ruler
  lexicon: HALOT
  rationale: Predicate noun describing God's royal status. 'King' is the direct and standard rendering; the definite sense is supplied naturally in English by the following genitive phrase.
- source_word: כָּל הָאָרֶץ
  chosen: of all the earth
  alternatives:
  - over all the earth
  - of the whole earth
  lexicon: HALOT
  rationale: The construct chain literally yields 'king of all the earth.' This preserves the universal scope of God's reign. 'Of all the earth' is formally close and idiomatic.
- source_word: אֱלֹהִים
  chosen: God
  lexicon: HALOT
  rationale: Here the plural form takes singular sense and refers to Israel's God. 'God' is the straightforward English equivalent.
- source_word: זַמְּרוּ
  chosen: sing praises
  alternatives:
  - make music
  - sing praises
  lexicon: HALOT
  rationale: In this summons to worship, זמר denotes singing or making musical praise; the English plural is idiomatic and does not assert a distinct lexical object in the Hebrew.
- source_word: מַשְׂכִּיל
  chosen: with understanding
  alternatives:
  - with understanding
  - skillfully
  - a maskil
  lexicon: HALOT
  rationale: An adverbial understanding/insight sense is well supported in context; the accompanying note retains the viable “skillfully” and Maskil-designation readings.
