translation:
  text: In the five-hundredth year, in the seventh month, on the fourteenth day of the month, in the life of Enoch,
    I saw in that vision how the heaven of heavens shook with a great shaking. The host of the Most High and angels,
    myriads of myriads and ten-thousands of ten-thousands, were greatly troubled.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected date is the five-hundredth year, seventh month and fourteenth day, in Enoch’s life. Charles
      printed103 note39 discusses the name Enoch as an editorial replacement for Noah, but this proposal retains
      the actual selected name and does not adopt that conjecture. The multiplied myriad expressions are retained
      as large-number expressions, not converted into a modern population total.
    reason: textual_variant
