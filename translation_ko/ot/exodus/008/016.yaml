  source_fidelity: ‘바로 앞에’는 히브리어 לִפְנֵי פַרְעֹה(‘파라오 앞에’)에서 명시된 대상을 빠뜨립니다. 또한 הִנֵּה יוֹצֵא는 파라오가 물가로 나가는 중임을 가리키므로 단순 미래형 ‘나갈 것입니다’보다 현재 진행 표현이 더 충실합니다.
  naturalness: 합쇼체 명령과 인용 구조는 자연스럽습니다. ‘파라오 앞에 서십시오’와 ‘물가로 나가고 있습니다’가 현대 표준 한국어에서 더 명료하고 자연스럽습니다.
  terminology: ‘야훼’, ‘모세’, ‘파라오’, ‘내 백성’, ‘섬기다’는 원문의 고유명사 및 핵심 용어를 적절히 반영합니다. עבד의 넓은 의미를 위해 ‘섬기다’를 유지합니다.
  issues:
