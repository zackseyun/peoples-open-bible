  - 주님이여
  lexicon: HALOT
  rationale: 신명기적 고유명사를 그대로 드러내는 POB 원칙에 따라 전통적 대치어 ‘주님’이 아니라 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: פָּנֶיךָ를 ‘얼굴’로 유지할지 ‘임재’로 풀지
  chosen_reading: ‘주님의 얼굴의 빛 가운데서’로 유지했습니다.
  alternative_readings:
  - 주님의 임재의 빛 가운데서
  - 주님의 은혜의 빛 가운데서
  rationale: 히브리어의 신학적 긴장과 시적 이미지를 해소하지 않고 보존하기 위해, 해석어로 단정하지 않고 ‘얼굴’ 이미지를 유지했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
