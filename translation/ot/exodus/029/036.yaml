  from: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
  to: Each day you shall offer a bull as a sin offering[a] for atonement. You shall purify the altar by making atonement for it, and anoint it to consecrate it.
  rationale: I retain the record’s distinction between purification of the altar and moral forgiveness, together with its serious alternative “purification offering.” The instrumental reading of the infinitive better conveys the relationship between the altar’s purification and atonement.
