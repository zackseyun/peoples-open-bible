    ἐπιδεδομένους διὰ τῶν χειρῶν αὐτῶν καὶ μείναντας εἰς τὴν οἰκοδομήν, | τούτων τῶν παρθένων τὴν δύναμιν
    ἐνδεδυμένοι εἰσί. 5. διὰ τοῦτο βλέπεις τὸν πύργον μονόλιθον γεγονότα [μετὰ] τῆς πέτρας. οὕτω καὶ οἱ
    πιστεύσαντες τῷ Κυρίῳ διὰ τοῦ υἱοῦ αὐτοῦ καὶ ἐνδιδυσκόμενοι τὰ πνεύματα ταῦτα, ἔσονται εἰς ἓν πνεῦμα,
    καὶ ἓν σῶμα, μία χρόα τῶν ἱματίων αὐτῶν. τῶν τοιούτων δὲ τῶν φορούντων τὰ ὀνόματα τῶν παρθένων ἐστὶν
