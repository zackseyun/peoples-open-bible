  rationale: The immediate context recounts God's acts for Israel in the wilderness, and the plural object suffix in 'he satisfied them' supports a corporate reading. Rendering the opening as plural in English avoids awkward ambiguity and matches the verse's narrative sense, while preserving the singular-form alternative in a footnote for auditability.
