  from: The desire of the righteous is only good[b][a], but the hope of the wicked is wrath.
  to: The desire of the righteous is only good, but the expectation of the wicked is wrath[a].
  rationale: “Expectation” is a sound contextual rendering of תקוה and avoids the potentially distracting implication that wrath is positively desired. The terse predicate “is wrath” properly leaves unresolved both whose wrath is intended and whether it is the content or outcome of expectation. The existing notes are misattached and should be replaced with a note at the relevant clause.
