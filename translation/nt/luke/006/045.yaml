  from: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
  to: A good person brings forth good from the good stored up in their heart[a], and an evil person brings forth evil from the evil stored up within them. For the mouth speaks from the overflow of the heart.
  rationale: The earlier notes rightly preserve the moral weight of “good” and “evil,” together with “heart” and “overflow,” which remain. I depart from their source-form preference for “man” and “treasure” because the saying concerns people generally and what the heart has stored, not only men or valuables.
