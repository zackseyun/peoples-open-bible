translation:
  text: On that day they will take up one voice and bless, praise and exalt in the spirit of faith, the spirit of
    wisdom, the spirit of patience, the spirit of mercy, the spirit of judgment and peace, and the spirit of goodness.
    All of them will say with one voice, “Blessed be the name of the Lord of Spirits, and may it be blessed for
    ever and ever.”[a]
  philosophy: optimal-equivalence
