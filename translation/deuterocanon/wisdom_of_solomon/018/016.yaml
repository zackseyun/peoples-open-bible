translation:
  text: He bore your uncompromising command[a] as a sharp sword; taking his stand, he filled all things with death. He touched heaven while standing on the earth.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'your unfeigned command'—a command that is genuine, not a pretense.
