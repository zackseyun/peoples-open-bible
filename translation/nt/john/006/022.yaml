  from: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
  to: The next day, the crowd that had remained on the other side of the sea realized that only one boat had been there and that Jesus had not boarded it with his disciples, but his disciples had left alone.
  rationale: The earlier decisions preserved the retrospective sequence but gave unnecessary prominence to standing posture and the diminutive boat form. The revised wording retains the information that makes the crowd's subsequent search intelligible.
