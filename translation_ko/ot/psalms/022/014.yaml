base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/014.yaml
  text: I am poured out like water, and all my bones are out of joint; my heart has become like wax, melted within me.[a]
  footnotes:
  - marker: a
    text: Or more literally, “melted within my inward parts.”
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 물처럼 쏟아졌고, 나의 모든 뼈가 어그러졌습니다. 내 마음은 밀랍처럼 되었으며, 내 속에서[a] 녹아내렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “나의 내장 가운데서.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצ֣וּ עָלַ֣י פִּיהֶם
  english_pob_choice: They open their mouth against me
  chosen_korean: 그들은 … 저에게 입을 벌립니다
  alternatives_korean:
  - 그들은 저를 향해 입을 엽니다
  - 그들은 저를 거슬러 입을 벌립니다
  lexicon: HALOT
  rationale: פָּצוּ는 ‘크게 벌리다/열다’의 동작을 살리고, עָלַי의 적대적 방향은 문맥상 ‘저에게’로 자연스럽게 드러냈습니다. פִּיהֶם의 단수형 ‘입’도 히브리어 형식을 반영해 유지했습니다.
- source_word: אַרְיֵה
  english_pob_choice: like a lion
  chosen_korean: 사자처럼
  alternatives_korean:
  - 사자 같이
  - 사자와 같이
  lexicon: HALOT
  rationale: 히브리어는 비교사를 명시하지 않지만, POB의 영어처럼 문맥상 비유를 드러내기 위해 ‘처럼’을 보탰습니다.
- source_word: טֹרֵף וְשֹׁאֵג
  english_pob_choice: tearing and roaring
  chosen_korean: 찢어 대며 포효하면서
  alternatives_korean:
  - 찢으며 우르릉대며
  - 뜯어 먹으며 포효하며
  lexicon: HALOT
  rationale: טֹרֵף는 사자의 공격적 ‘찢음/뜯음’을, שֹׁאֵג는 사자의 ‘포효’를 가리키므로, 동작성과 음향성을 함께 살린 표현을 택했습니다.
theological_decisions:
- issue: 시편 시구의 압축된 사자 이미지 처리
  chosen_reading: 직역적으로 풀어 쓰되, 사자 비유를 문장 안에서 분명하게 드러냈습니다.
  alternative_readings:
  - ‘그들은 저를 거슬러 입을 벌립니다. 찢어 대며 포효하는 사자처럼.’
  - ‘그들은 저를 향해 입을 벌립니다—찢어 대며 포효하는 사자처럼.’
  rationale: 히브리어는 비교 표현이 압축되어 있어 한국어에서는 독자가 비유를 즉시 이해하도록 약간의 보충이 필요합니다. 다만 의미를 넘어서지 않도록 비유의 핵심만 드러냈습니다.
  doctrine_reference: 시편 22편의 탄식/박해 이미지
