id: JHN.2.10
reference: John 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
  footnotes:
  - marker: a
    text: Or 'when they are drunk' or 'when they have drunk freely.' The Greek verb commonly means 'become drunk'; some translations soften the expression to emphasize reduced discernment rather than explicit intoxication.
    reason: lexical_alternative
  - marker: b
    text: Greek 'Every man' uses a generic singular expression meaning people generally, not males only.
    reason: cultural_note
translation:
  language: ko
  text: 그가 그에게 말하였습니다. 「모든 사람[b]은 먼저 좋은 포도주를 내놓고, 사람들이 취하게 되면[a] 그다음에는 그보다 못한 포도주를 내놓습니다. 그러나 당신은 지금까지 좋은 포도주를 남겨 두었습니다。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘취하면’ 또는 ‘실컷 마신 뒤에’로도 옮길 수 있습니다. 그리스어 동사는 통상 ‘취하게 되다’를 뜻하므로, 본문은 취함을 직설적으로 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ‘Πᾶς ἄνθρωπος’는 일반적인 단수 표현으로 사람들을 가리키며, 남성만을 뜻하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει αὐτῷ
  english_pob_choice: he said to him
  chosen_korean: 그가 그에게 말하였습니다
  alternatives_korean:
  - 그가 그에게 말한다
  - 그가 그에게 말했다
  lexicon: BDAG / Greek narrative convention
  rationale: λέγει의 역사적 현재(서술적 현재)를 한국어 내러티브에서는 과거 시제로 자연스럽게 옮기는 것이 관습적입니다. 따라서 '말하였습니다'로 처리해 직접화법의 힘을 보존하면서 이야기를 과거 시제로 전개합니다.
- source_word: Πᾶς ἄνθρωπος
  english_pob_choice: Every man
  chosen_korean: 모든 사람
  alternatives_korean:
  - 각 사람
  - 모든 남자
  lexicon: BDAG
  rationale: 그리스어의 단수 일반 표현으로 '사람들 일반'을 가리키므로 현대 한국어의 포괄적 표현 '모든 사람'으로 옮깁니다(남성만을 가리키는 뜻이 아님).
- source_word: ὅταν μεθυσθῶσιν
  english_pob_choice: when they have become drunk
  chosen_korean: 사람들이 취하게 되면
  alternatives_korean:
  - 사람들이 취하면
  - 사람들이 과음하면
  lexicon: BDAG
  rationale: μεθύω의 수동형은 '취하게 되다/취하다'의 명백한 의미를 전합니다. 번역은 원문이 명시하는 '취함'을 흐리지 않고 전달하기 위해 '취하게 되면'으로 옮겼습니다(ὅταν의 시간적·종속적 의미를 반영).
- source_word: τὸν ἐλάσσω
  english_pob_choice: the inferior
  chosen_korean: 더 못한 것
  alternatives_korean:
  - 질이 낮은 포도주
  - 더 하찮은 것
  lexicon: BDAG
  rationale: ἐλάσσων은 비교급 '더 적은/더 못한'을 의미하며 문맥상 '포도주'가 생략되어 있습니다. 한국어에서는 '더 못한 것'으로 간결히 옮겨 문맥상의 동음(포도주)을 보존합니다.
theological_decisions:
- issue: Rendering of μεθυσθῶσιν in a miracle context involving wine and intoxication
  chosen_reading: 원문이 말하는 대로 '취하게 되다'의 분명한 의미를 유지합니다.
  alternative_readings:
  - 취하면(완곡하게)
  - 과음하면/충분히 마시면(완곡한 표현)
  rationale: 원문 ε·μεθύω는 통상 '취하다/취하게 되다'를 의미하므로, 도덕적 판단을 회피하거나 완곡하게 바꾸지 않고 사실 서술로서의 '취함'을 그대로 전달합니다. 번역철학은 원어 우선성을 따르며 신학적 갈등을 인위적으로 완화하지 않습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy; Preserve theological tension rather than resolve it.'
