  naturalness: ‘은보다 택함을 받는 것입니다’는 현대 표준 한국어에서 어색하며, 무엇이 누구에게 택함을 받는지 불분명합니다. ‘은보다 더 택할 만합니다’가 자연스럽고 비교의 의미도 분명합니다. 합쇼체 권면으로 ‘얻으십시오’를 사용했습니다.
