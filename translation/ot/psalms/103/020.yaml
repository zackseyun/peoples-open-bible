  to: Bless the LORD, his angels, mighty in strength, who do his word, listening to the sound of his word.
  rationale: Replaced 'listening to the sound of his word' with 'obeying the voice of his word' for more accurate rendering of לִשְׁמֹעַ בְּקוֹל ('to heed/obey the voice') and more natural formal English.
