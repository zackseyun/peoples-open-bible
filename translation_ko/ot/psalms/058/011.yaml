  naturalness: The revised wording is natural in contemporary formal Korean and uses 합쇼체. ‘땅에서 심판하시는 하나님’ is idiomatic while retaining the participial force of the Hebrew.
  terminology: ‘의인,’ ‘열매,’ ‘하나님,’ and ‘심판하시는’ are appropriate standard Korean biblical terms. ‘열매’ preserves the Hebrew metaphor without prematurely narrowing it to ‘보상.’
