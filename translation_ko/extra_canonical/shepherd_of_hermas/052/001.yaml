    text: '‘나머지 비유’: 그리스어 본문은 이 지점에서 전승상 불완전하며, 영어 감사본은 문맥에 따라 ‘나머지 비유’로 보충한다.'
    reason: τῶν λοιπῶν 뒤의 명사가 제공된 그리스어 본문에서 결락·손상된 듯하여, 번역상 보충된 말을 투명하게 표시합니다.
  revision_rationale: 수신자의 수와 핵심 어휘의 의미를 원문에 맞추고, 죄를 깨끗하게 한 행위와 그에 수반된 수고를 정확히 반영했습니다. 전승이 불완전한 ‘나머지’의 대상은 영어 감사본을 따르되 각주로 보충 사실을 밝혔습니다.
