id: PSA.92.7
reference: Psalms 92:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/פְרֹ֤חַ רְשָׁעִ֨ים כְּמ֥וֹ עֵ֗שֶׂב וַ֭/יָּצִיצוּ כָּל פֹּ֣עֲלֵי אָ֑וֶן לְ/הִשָּֽׁמְדָ֥/ם עֲדֵי עַֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/007.yaml
  text: When the wicked sprout like grass and all who do evil flourish, it is only to be destroyed forever.[a]
  footnotes:
  - marker: a
    text: Or “so that they may be destroyed forever” or “for their destruction forever.” The Hebrew may express purpose or result.
    reason: alternative_reading
translation:
  language: ko
  text: 악인들이 풀처럼 돋아나고 모든 악을 행하는 자들이 번성할 때, 이는 그들이 영원히 멸망하도록 하기 위해서입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 인간
  lexicon: HALOT
  rationale: 히브리어 אִישׁ은 여기서 남성 단수 형식을 가지지만, 시적 평행법에서 일반적 인간을 가리키는 대표 명사로 쓰입니다. 한국어에서는 직역식 '남자'보다 문맥상 일반화된 '사람'이 자연스럽고, 뒤의 형용사들과도 잘 어울립니다.
- source_word: בַּעַר
  english_pob_choice: brutish
  chosen_korean: 어리석은
  alternatives_korean:
  - 우둔한
  - 짐승 같은
  - 미련한
  lexicon: HALOT
  rationale: 이 형용사는 단순한 무지보다 짐승처럼 둔하고 분별이 없는 상태를 가리킵니다. 한국어의 '어리석은'은 그 의미를 과도하게 약화하지 않으면서도 현대 시어체로 자연스럽게 읽힙니다.
- source_word: כְסִיל
  english_pob_choice: fool
  chosen_korean: 미련한
  alternatives_korean:
  - 어리석은
  - 우둔한
  - 둔한
  lexicon: HALOT
  rationale: כְסִיל은 지혜문학에서 익숙한 '어리석은 자'의 어휘이므로, 한국어에서는 같은 계열을 유지하되 앞의 בַּעַר과 중복을 피하기 위해 '미련한'으로 옮겼습니다.
- source_word: יֵדָע / יָבִין
  english_pob_choice: does not know / does not understand
  chosen_korean: 알지 못하고 / 이해하지 못합니다
  alternatives_korean:
  - 모르고 / 분별하지 못합니다
  - 알지 못하고 / 깨닫지 못합니다
  lexicon: HALOT
  rationale: ידע와 בין의 병렬을 살리되, 첫 동사는 지식의 부재를, 둘째 동사는 분별과 이해의 부재를 드러내도록 구분했습니다. 문장 종결은 시편의 인용문이므로 현대 합쇼체로 정리했습니다.
- source_word: אֶת זֹאת
  english_pob_choice: this
  chosen_korean: 이것
  alternatives_korean:
  - 이 일
  - 이것
  lexicon: HALOT
  rationale: 문맥상 바로 앞에서 진술된 야훼의 행위를 가리키는 지시어이므로, 한국어에서는 간결하게 '이것'으로 처리했습니다.
theological_decisions:
- issue: 시적 병렬에서 두 부류의 어리석음을 어떻게 구분할 것인가
  chosen_reading: 첫 절반은 '어리석은 사람'으로, 둘째 절반은 '미련한 사람'으로 옮겨 의미는 같되 한국어 표현을 약간 달리해 히브리어 병렬을 드러냈습니다.
  alternative_readings:
  - 둘 다 '어리석은 사람'으로 통일
  - 둘 다 '미련한 사람'으로 통일
  rationale: 원문은 거의 동의적 평행법이지만 שני 표현의 어감 차이가 있습니다. 한국어에서도 반복을 피하면서 동일한 어리석음의 범주를 유지하는 번역이 가장 적절합니다.
  doctrine_reference: 시편의 지혜 전통과 시적 평행법
- issue: 마지막의 콜론을 어떻게 처리할 것인가
  chosen_reading: 한국어 본문에는 콜론을 유지했습니다.
  alternative_readings:
  - 문장부호 없이 다음 절로 넘김
  - 쉼표로 약화
  rationale: 영문 POB와 히브리어 원문 모두 뒤이어 설명이 이어질 것을 예고하는 구조이므로, 콜론을 남겨 문장 관계를 보존했습니다.
  doctrine_reference: 시적 구문과 담화 표지
