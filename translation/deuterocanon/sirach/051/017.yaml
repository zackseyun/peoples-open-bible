translation:
  text: Her yoke[a] was an honor to me, and I will give thanks to my teachers[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kahana's composite edition points this as 'her yoke.' The unpointed opening permits other analyses; this is not a newly deciphered reading.
    reason: lexical_alternative
  - marker: b
    text: Kahana's pointing gives plural 'my teachers'; the unpointed Hebrew does not independently settle the number. God is not explicitly named.
    reason: lexical_alternative
  - marker: c
    text: This verse uses a Hebrew working form after the Greek working form at verses 13–16. The Hebrew scroll 11Q5 has a shorter first clause; Greek instead speaks of progress and a giver of wisdom. The earliest Hebrew wording remains unresolved.
    reason: textual_variant
lexical_decisions:
- source_word: עֻלָּהּ
  chosen: Her yoke
  rationale: Kahana's pointing specifies the yoke with a feminine possessive suffix. The translation follows that working edition rather than substituting Greek progress for this Hebrew noun. The unpointed opening remains open to other analyses; the pointing is not newly verified manuscript ink.
- source_word: הָיָה לִי לְכָבוֹד
  chosen: was an honor to me
  alternatives:
  - was for my honor
  rationale: The verb and two prepositional phrases describe the yoke as honorable or an honor for the speaker. 'Was an honor to me' gives readable English without dropping the explicit honor phrase found in this Hebrew working form.
- source_word: וְלִמְלַמְּדַי
  chosen: to my teachers
  alternatives:
  - to my instructors
  rationale: Kahana's pointed participial form is plural with a first-person possessive suffix. The English preserves that plurality instead of importing the Greek singular giver and its explicit wisdom object. The unpointed manuscript spelling does not independently decide number.
- source_word: אֶתֵּן הוֹדָאָה
  chosen: I will give thanks
  alternatives:
  - I will offer thanksgiving
  rationale: The first-person verb and thanksgiving noun support giving thanks. 'Glory' would follow the different Greek noun rather than this pointed Hebrew working text.
