id: PSA.38.7
reference: Psalms 38:7
source:
  edition: WLC
  text: כִּֽי כְ֭סָלַ/י מָלְא֣וּ נִקְלֶ֑ה וְ/אֵ֥ין מְ֝תֹ֗ם בִּ/בְשָׂרִֽ/י־׃
translation:
  text: For my sides[a] are filled with burning pain[b], and there is no soundness in my flesh.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew refers to the loins or flanks, the region around the lower back and sides.
    reason: lexical_alternative
  - marker: b
    text: Or, “a loathsome condition”; the meaning of the Hebrew word is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  - Indeed
  lexicon: HALOT
  rationale: Introduces the reason for the psalmist's distress in the surrounding context. 'For' fits the explanatory force naturally in English.
- source_word: כְסָלַי
  chosen: my loins
  alternatives:
  - my flanks
  - my hips
  - my lower back
  lexicon: HALOT
  rationale: כֶּסֶל can denote the loins/flanks region. 'My loins' preserves the bodily reference with traditional precision, while avoiding over-interpretation toward either back or sexual organs.
- source_word: מָלְאוּ
  chosen: are filled
  alternatives:
  - have become full
  - are full
  lexicon: HALOT
  rationale: The verb מלא in the qal expresses being full/filled. 'Are filled' is idiomatic with the following predicate and preserves the stative-result sense.
- source_word: נִקְלֶה
  chosen: burning
  alternatives:
  - inflammation
  - scorching
  - disgrace
  - vileness
  lexicon: HALOT
  rationale: In this context “burning” gives a plausible physical sense without adding an object such as “sores,” which the Hebrew does not state. The substantial lexical uncertainty is retained in a note.
- source_word: וְאֵין
  chosen: and there is no
  alternatives:
  - and there is not
  lexicon: HALOT
  rationale: Standard existential negation. 'And there is no' is natural English and preserves the clause structure.
- source_word: מְתֹם
  chosen: soundness
  alternatives:
  - wholeness
  - health
  - integrity
  lexicon: HALOT
  rationale: In bodily contexts, מְתֹם denotes soundness or health, especially the absence of injury or disease. 'Soundness' preserves the broad physical sense and matches the parallelism with bodily affliction.
- source_word: בבשרי
  chosen: in my flesh
  alternatives:
  - in my body
  lexicon: HALOT
  rationale: בָּשָׂר here refers literally to the psalmist's physical flesh/body, not a theological metaphor. Per translation philosophy, 'flesh' is retained in literal contexts.
