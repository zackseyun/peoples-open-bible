revisions:
- from: 그러자 영이 나를 들어 올리셨고, 나는 뒤에서 큰 요란한 소리를 들었습니다. “야훼의 영광이 그 계신 곳에서 찬양을 받으시기를.”[a][b]
  to: 그러자 영이 나를 들어 올렸고, 나는 내 뒤에서 큰 굉음이 나는 것을 들었습니다. “야훼의 영광이 그분의 처소로부터 찬송받으시기를.”
  rationale: 원문의 רוּחַ를 ‘영’으로 유지하되 한국어 존대를 제거했습니다. קוֹל רַעַשׁ גָּדוֹל은 자연스러운 ‘큰 굉음’으로 다듬었고, מִמְּקוֹמוֹ의 ‘~로부터’를 명시했습니다. 송영형 בָּרוּךְ는 ‘찬송받으시기를’으로 옮겼습니다. 불필요하거나 번역을 해석적으로 규정하는 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:38:07Z'
