  rationale: The doctrine guidelines set 'righteousness' as the default for δικαιοσύνη, while preserving 'justice' in footnotes where relevant. Here the term likely refers to righteous action or doing what is right; 'righteousness' best preserves the broader moral-covenantal sense without narrowing it to social or judicial justice alone.
