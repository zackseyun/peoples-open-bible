  category: meaning_retranslation
  from: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
  to: Then you answered me, “We have sinned against Yahweh. We ourselves will go up and fight, doing all that Yahweh our God commanded us.” Each man strapped on his weapons of war, and you thought it would be easy to go up into the hill country[a].
  rationale: The earlier deliberation correctly recognized reckless self-confidence, but its 'set out' wording blurs preparation here with the actual ascent in verse 43. I preserve that negative force through 'thought it would be easy' and note the serious alternative rather than treating the rare verb as certain.
