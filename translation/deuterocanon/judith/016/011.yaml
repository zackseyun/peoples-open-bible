id: JDT.16.11
reference: Judith 16:11
source:
  edition: lxx-swete-1909
  text: τότε ἠλάλαξαν οἱ ταπεινοί μου, καὶ ἐφοβήθησαν οἱ ἀσθενοῦντές μου καὶ ἐπτοήθησαν· ὕψωσαν τὴν φωνὴν αὐτῶν καὶ ἀνετράπησαν.
