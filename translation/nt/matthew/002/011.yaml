  from: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
  to: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasure chests they offered him gifts: gold and frankincense and myrrh.'
  rationale: While 'treasures' is traditional, the Greek word θησαυρός here refers specifically to the receptacles or chests containing the valuables (BDAG 1), as indicated by the verb 'opened.' In modern English, one opens a chest or box, rather than the 'treasure' itself. The aorist participle πεσόντες preceding the aorist main verb προσεκύνησαν is best understood as attendant circumstance. Translating it as a finite verb ('they fell down and paid homage') is more natural in English and accurately reflects the Greek syntax, avoiding the slightly wooden 'falling down they...' construction.
