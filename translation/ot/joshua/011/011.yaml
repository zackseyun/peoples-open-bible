  from: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
  to: They struck down everyone in the city with the edge of the sword, devoting them to destruction[a]; not a single person was left alive. Joshua burned Hazor.
  rationale: I retain the history’s important distinction between devotion to destruction and generic military destruction, as well as its recognition that Joshua is the final clause’s subject. The broader wording “breathing thing” is narrowed to the human scope established by the surrounding account.
