translation:
  language: en
  text: He did not learn this from people, but through repentance[a] he knows how to welcome those who turn back.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And he did not learn this from men
  simplified_phrase: He did not learn this from people
  preserved_meaning: His knowledge did not come from human instruction.
  reasoning_layer_used: POB translation and Greek source
  rationale: “People” conveys the generic human sense of “men” in modern English.
- pob_phrase: receive those who turn back
  simplified_phrase: welcome those who turn back
  preserved_meaning: He accepts those who return.
  reasoning_layer_used: POB translation
  rationale: “Welcome” makes the sense of receiving returning people immediately clear.
