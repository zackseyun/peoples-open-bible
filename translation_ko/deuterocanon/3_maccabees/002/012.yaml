  terminology: ἅγιε Βασιλεῦ는 기도문의 호격으로 “거룩하신 왕이여”가 적절합니다. ὑπετάγημεν은 자발적 행위를 암시할 수 있는 “복종하게 되었고”보다 피동적 복속을 분명히 하는 “복속되었고”가 더 충실합니다.
