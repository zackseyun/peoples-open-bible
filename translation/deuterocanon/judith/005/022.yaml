lexical_decisions:
- source_word: ἐγένετο ὡς
  chosen: And it happened, when
  alternatives:
  - And when
  - Now when
  lexicon: BDAG
  rationale: A common narrative transition in Greek. Retaining 'And it happened' preserves the formal narrative texture of the source, while 'when' naturally carries ὡς into English.
- source_word: ἐπαύσατο
  chosen: had stopped
  alternatives:
  - ceased
  - finished
  lexicon: BDAG
  rationale: The verb means to stop or cease. 'Had stopped' gives clear English sequence before the crowd's reaction.
- source_word: λαλῶν τοὺς λόγους τούτους
  chosen: speaking these words
  alternatives:
  - saying these things
  - uttering these words
  lexicon: BDAG
  rationale: A straightforward rendering that preserves both the participle and the demonstrative force of τούτους.
- source_word: ἐγόγγυσεν
  chosen: began to grumble
  alternatives:
  - murmured
  - complained
  lexicon: BDAG
  rationale: γογγύζω denotes muttering or grumbling. 'Began to grumble' fits the ingressive sense in context and avoids archaic 'murmured' while preserving the hostile crowd reaction.
- source_word: πᾶς ὁ λαὸς
  chosen: all the people
  alternatives:
  - the whole people
  - all the crowd
  lexicon: BDAG
  rationale: '''All the people'' is the most natural equivalent and reflects the collective force without over-specifying ethnicity or political identity.'
- source_word: ὁ κυκλῶν τὴν σκηνὴν καὶ περιστὼς
  chosen: around the tent and standing about
  alternatives:
  - encircling the tent and standing around
  - surrounding the tent and standing nearby
  lexicon: BDAG
  rationale: The Greek uses two participles describing the crowd's position. 'Around the tent and standing about' preserves both without overloading the line. 'Tent' is retained as the plain sense of σκηνή.
- source_word: οἱ μεγιστᾶνες Ὀλοφέρνου
  chosen: the nobles of Holofernes
  alternatives:
  - the magnates of Holofernes
  - the chief men of Holofernes
  lexicon: LSJ
  rationale: μεγιστᾶνες refers to leading men or nobles. 'Nobles' is idiomatic and suitably elevated without being obscure.
- source_word: οἱ κατοικοῦντες τὴν παραλίαν
  chosen: all who lived by the seacoast
  alternatives:
  - all who inhabited the coastland
  - all who dwelt in the coastal region
  lexicon: LSJ
  rationale: παραλία denotes the coast or seacoast region. 'Lived by the seacoast' is natural English and preserves the geographic sense.
- source_word: συγκόψαι αὐτόν
  chosen: to cut him down
  alternatives:
  - to strike him down
  - to kill him
  lexicon: LSJ
  rationale: The infinitive here expresses what they said should be done to Achior. συγκόπτω can convey striking down or cutting down; 'cut him down' preserves the violent imagery without overinterpreting the exact method.
