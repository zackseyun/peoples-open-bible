revisions:
- from: 그가 자기 병거들의 바퀴를 빼 버리고, 그것들을 무겁게 몰았습니다. 그러자 이집트가 말했습니다. “이스라엘 앞에서 달아나자. 야훼께서 이집트를 상대로 그들을 위해 싸우고 계신다.”
  to: 그가 그의 병거들의 바퀴를 빼시고, 병거들이 힘겹게 움직이게 하셨습니다. 그러자 이집트가 말했습니다. “이스라엘 앞에서 달아나자. 야훼께서 이집트를 상대로 그들을 위해 싸우신다.”
  rationale: 원문의 단수형 ‘바퀴’와 단수 접미사가 낳는 문법적 난점을 본문에서 과도하게 해결하지 않으면서, 문맥상 병거 운행이 곤란해졌다는 뜻을 자연스러운 한국어로 옮겼습니다. 집합적 주어인 ‘이집트가 말했습니다’와 권유형 ‘달아나자’는 유지했습니다.
