lexical_decisions:
- source_word: וִיחִי
  english_pob_choice: that he should ... live
  chosen_korean: 계속 살아서
  alternatives_korean:
  - 살아서
  - 살게 되어
  - 계속 살고
  lexicon: HALOT
  rationale: 문맥상 단순 현재가 아니라 계속되는 생존을 바라는/가정하는 뉘앙스이므로, 자연스러운 합쇼체로 ‘계속 살아서’로 옮겼습니다.
- source_word: לָנֶצַח
  english_pob_choice: on forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  lexicon: HALOT
  rationale: לָנֶצַח의 지속성과 영속성을 표준적인 현대 한국어 ‘영원히’로 간결하게 살렸습니다.
- source_word: הַשָּׁחַת
  english_pob_choice: the Pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 무덤
  - 멸망의 구덩이
  - 음부
  lexicon: HALOT
  rationale: 시적 죽음의 이미지인 שחת를 추상화하지 않고, 한국어에서 구체적이고 직관적인 ‘구덩이’로 옮겨 ‘보지 않다’와의 결합을 살렸습니다.
theological_decisions:
- issue: שחת의 한국어 처리와 죽음의 이미지 유지
  chosen_reading: ‘죽음의 구덩이’라는 표현으로, 단순한 매장지보다 죽음과 멸망의 하강 이미지를 유지했습니다.
  alternative_readings:
  - 무덤
  - 멸망
  - 음부
  rationale: 원문은 죽음을 피하고 싶어 하는 시적·신학적 이미지를 담고 있으므로, 의미를 한쪽으로만 좁히지 않으면서도 한국어 독자가 이해할 수 있게 풀었습니다.
  doctrine_reference: Translation philosophy §3, §5
