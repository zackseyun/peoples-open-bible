id: PSA.89.28
reference: Psalms 89:28
source:
  edition: WLC
  text: לְ֭/עוֹלָ֗ם אשמור ל֣/וֹ חַסְדִּ֑/י וּ֝/בְרִיתִ֗/י נֶאֱמֶ֥נֶת לֽ/וֹ־׃
translation:
  text: Forever I will keep my steadfast love for him, and my covenant will stand firm for him.
  philosophy: dynamic
lexical_decisions:
- source_word: לְעוֹלָם
  chosen: Forever
  alternatives:
  - For ever
  - for eternity
  lexicon: HALOT
  rationale: עוֹלָם with prefixed ל expresses enduring duration. 'Forever' is natural modern English and preserves the covenantal permanence emphasized in the verse.
- source_word: אֶשְׁמֹר
  chosen: I will keep
  alternatives:
  - I will preserve
  - I will maintain
  - I will guard
  lexicon: HALOT
  rationale: From שׁמר, here in covenant context meaning to keep/preserve. 'Keep' is concise and idiomatic with 'steadfast love,' while still allowing the sense of active preservation.
- source_word: לוֹ
  chosen: for him
  alternatives:
  - to him
  lexicon: HALOT
  rationale: In the second clause the lamed marks the covenant’s relation or benefit to the king and collocates naturally with “stand firm.”
- source_word: חַסְדִּי
  chosen: my steadfast love
  alternatives:
  - my covenant love
  - my lovingkindness
  - my mercy
  lexicon: HALOT
  rationale: חסד is a theologically rich covenant term. 'Steadfast love' is the best established English rendering that preserves both affection and covenant loyalty without archaic tone.
- source_word: וּבְרִיתִי
  chosen: and my covenant
  alternatives:
  - and my treaty
  - and my pact
  lexicon: HALOT
  rationale: בְּרִית is the standard covenant term. 'Covenant' is theologically and lexically precise in this Davidic promise context.
- source_word: נֶאֱמֶנֶת
  chosen: will stand firm
  alternatives:
  - will be faithful
  - will be sure
  - will remain established
  lexicon: HALOT
  rationale: The Niphal participle of אמן describes the covenant as firm, reliable, or established; “will stand firm” expresses this naturally without making the covenant personally faithful.
