  text: You stand at the gate tonight, and I will go out with my maidservant; and within the days after which you said you would hand over the city to our enemies, the Lord will visit Israel by my hand.
translation:
  language: ko
  text: 당신들은 오늘 밤 성문에 서 계십시오. 나는 내 여종과 함께 나가겠습니다. 그리고 당신들이 우리 원수들에게 이 성읍을 넘겨주겠다고 말한 그 날들이 지나기 전에, 주님께서 내 손으로 이스라엘을 돌아보실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στήσεσθε ἐπὶ τῆς πύλης
  english_pob_choice: You stand at the gate
  chosen_korean: 문에서 서 있어야 합니다
  alternatives_korean:
  - 문에 서 있어야 합니다
  - 성문에 서 있어야 합니다
  lexicon: στήσεσθε / πύλη
  rationale: 명령형의 지속적 대기 의미를 살리되, πύλη를 단순히 ‘문’으로 옮겨 본문의 요새/성문 상황을 과도하게 특정하지 않도록 했습니다.
- source_word: ἅβρας μου
  english_pob_choice: my maidservant
  chosen_korean: 내 여종
  alternatives_korean:
  - 내 시녀
  - 내 하녀
  lexicon: ἅβρα
  rationale: 영어 POB의 maidservant에 대응해 신분적 종속을 드러내는 ‘여종’을 택했고, 현대 한국어에서 가장 자연스럽고 직접적인 대응입니다.
- source_word: παραδῶσειν τὴν πόλιν τοῖς ἐχθροῖς ἡμῶν
  english_pob_choice: hand over the city to our enemies
  chosen_korean: 성을 넘겨 주겠다고
  alternatives_korean:
  - 도시를 우리 원수들에게 넘기겠다고
  - 성을 적들에게 넘겨 주겠다고
  lexicon: παραδῶσειν / πόλις / ἐχθροί
  rationale: παραδιδόναι 계열의 ‘넘겨 주다’ 의미를 살리면서, πόλις는 이 문맥에서 성읍/성의 함축이 있어 ‘성’으로 옮겼습니다.
- source_word: ἐπισκέψεται Κύριος τὸν Ἰσραὴλ ἐν χειρί μου
  english_pob_choice: the Lord will visit Israel by my hand
  chosen_korean: 주님께서 내 손을 통해 이스라엘을 돌보실 것입니다
  alternatives_korean:
  - 주님께서 내 손으로 이스라엘을 방문하실 것입니다
  - 주님께서 내 손을 통해 이스라엘을 찾아보실 것입니다
  lexicon: ἐπισκέψεται / ἐν χειρί μου
  rationale: ἐπισκέπτομαι는 단순 방문보다 ‘돌보시다/살피시다’의 구약적 용례가 강하므로 ‘돌보실 것입니다’로 옮겼고, ἐν χειρί μου는 매개성을 살려 ‘내 손을 통해’로 처리했습니다.
theological_decisions:
- issue: ἐπισκέψεται Κύριος의 신적 주어와 인칭 매개 표현
  chosen_reading: 주님께서 이스라엘을 직접 돌보시되, 그 실행의 매개가 ‘내 손’임을 함께 드러냈습니다.
  alternative_readings:
  - 주님께서 내 손으로 이스라엘을 방문하실 것입니다
  - 주님께서 내 손을 통해 이스라엘을 찾아보실 것입니다
  rationale: 구약적 ‘돌보심/권고하심’의 의미를 유지하면서도, 유딧의 행위가 하나님의 섭리에 종속된 도구적 행위임을 본문대로 보존했습니다.
  doctrine_reference: 섭리와 도구성
