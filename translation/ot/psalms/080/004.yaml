id: PSA.80.4
reference: Psalms 80:4
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהִ֣ים צְבָא֑וֹת עַד מָתַ֥י עָ֝שַׁ֗נְתָּ בִּ/תְפִלַּ֥ת עַמֶּֽ/ךָ־׃
translation:
  text: O Yahweh God of hosts[a], how long will you fume at the prayer of your people[b]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “Hosts” means armies or mighty forces, including heavenly armies.
    reason: lexical_alternative
  - marker: b
    text: Literally, “smoke against the prayer of your people,” using smoke as an image of anger.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: אֱלֹהִים
  chosen: God
  alternatives:
  - god
  - divine one
  lexicon: HALOT
  rationale: In apposition to YHWH and followed by 'of hosts,' this functions as the title 'God,' yielding the compound address 'O LORD God of hosts.'
- source_word: צְבָאוֹת
  chosen: of hosts
  alternatives:
  - of armies
  - of heavenly armies
  lexicon: HALOT
  rationale: The traditional and still transparent title 'God of hosts' preserves the military/cosmic sense of צבאות without over-specifying whether earthly or heavenly armies are in view.
- source_word: עַד מָתַי
  chosen: how long
  alternatives:
  - until when
  lexicon: HALOT
  rationale: Standard idiomatic rendering of the Hebrew lament formula, preserving the psalm's urgent complaint in natural English.
- source_word: עָשַׁנְתָּ
  chosen: will you fume
  alternatives:
  - are you angry at
  - will your anger smoke against
  - do you fume against
  lexicon: HALOT
  rationale: “Fume” is natural English for the verb's anger imagery while retaining its smoke-based metaphor.
- source_word: בִּתְפִלַּת
  chosen: at the prayer
  alternatives:
  - at the prayer
  - in response to the prayer
  lexicon: HALOT
  rationale: With “fume,” “at” idiomatically expresses the adversative relation conveyed in context.
- source_word: עַמֶּךָ
  chosen: your people
  alternatives:
  - your nation
  lexicon: HALOT
  rationale: '''Your people'' is the natural covenantal sense in this psalmic address and preserves the communal dimension of Israel''s plea.'
