  rationale: 히브리어는 관찰과 인지의 진술이지, 본문이 요구하지 않는 과도한 승리감이나 미래 예언으로 확장할 필요가 없습니다.
  doctrine_reference: 시편의 시적 화자 이해; 본문 주해의 절제 원칙
