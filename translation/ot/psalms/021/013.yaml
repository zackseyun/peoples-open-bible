id: PSA.21.13
reference: Psalms 21:13
source:
  edition: WLC
  text: ר֣וּמָ/ה יְהוָ֣ה בְּ/עֻזֶּ֑/ךָ נָשִׁ֥ירָה וּֽ֝/נְזַמְּרָה גְּבוּרָתֶֽ/ךָ׃
translation:
  text: Be exalted[a], O Yahweh, in your strength! We will sing and make music in praise of your might.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or 'Rise up.'
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  chosen: Be exalted
  alternatives:
  - Rise up
  - Be lifted up
  - Exalt yourself
  lexicon: HALOT
  rationale: The imperative of רום may express Yahweh’s being shown high or exalted; “Be exalted” is an idiomatic contextual rendering, with “Rise up” retained as an alternative.
- source_word: יְהוָה
  chosen: O Yahweh
  alternatives:
  - the LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: בְּעֻזֶּךָ
  chosen: in your strength
  alternatives:
  - by your strength
  - through your strength
  lexicon: HALOT
  rationale: 'ב with עֹז can denote sphere or means. ''In your strength'' preserves the Hebrew preposition more closely and suits the parallel praise context: the LORD is exalted in the display of his strength.'
- source_word: נָשִׁירָה
  chosen: We will sing
  alternatives:
  - Let us sing
  - We shall sing
  lexicon: HALOT
  rationale: Cohortative 1cp can express resolve or invitation. Here, following the petition, it naturally conveys the worshipers' resolved response. 'We will sing' is clear modern English and preserves the volitional sense without sounding archaic.
- source_word: וּנְזַמְּרָה
  chosen: and make music
  alternatives:
  - and sing praises
  - and sing psalms
  lexicon: HALOT
  rationale: זמר in praise contexts often means making music/singing praise. 'Make music' preserves the musical nuance and avoids flattening it into a mere synonym of 'sing,' while still fitting natural English parallelism.
- source_word: גְּבוּרָתֶךָ
  chosen: of your might
  alternatives:
  - your power
  - your mighty deeds
  - your strength
  lexicon: HALOT
  rationale: Yahweh’s might is the content of the singing and music. “Of your might” expresses that relation in natural elevated English.
