revisions:
- from: 우리 하나님이여, 우리를 못 본 체하지 마소서. 민족들이 우리를 집어삼켜서, 마치 구원할 사람이 없는 것처럼 되지 않게 하소서.[a][b]
  to: 우리 하나님이여, 우리를 외면하지 마소서.[a] 마치 우리를 구원해 줄 이가 없는 것처럼 민족들이 우리를 집어삼키지 못하게 하소서.[b]
  rationale: 기도문의 현대적 합쇼체를 유지하면서, ὑπερίδῃς를 ‘외면하지 마소서’로 자연스럽게 옮겼습니다. ἵνα μὴ와 ὡς 이하의 관계를 한국어 어순으로 재구성하여, 민족들이 구원자가 없는 듯 우리를 집어삼키는 일이 없게 해 달라는 간구를 명확히 했습니다. ‘우리를’은 그리스어에서 앞선 목적어와 문맥상 분명한 대상을 한국어에서 자연스럽게 보충한 것입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:43Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 기도의 호격과 ‘민족들이 우리를 집어삼키는’ 비유를 대체로 충실히 반영합니다. 그러나 ‘집어삼켜서, ... 되지 않게’는 ἵνα μὴ가 나타내는 두려운 결과를 한국어에서 어색하게 연결하며, 마지막 구절의 수식 관계도 흐립니다. λυτρουμένου는 행위하는 분사이므로 ‘우리를 구원해 줄 이’로 목적어를 보완하는 것이 자연스럽고 원문의 뜻에 맞습니다.
  naturalness: ‘못 본 체하지 마소서’는 현대 한국어에서 다소 구어적이며, 실제로 보면서 모른 척한다는 의도적 뉘앙스가 강합니다. 기도문의 격식과 ὑπερίδῃς의 ‘돌보지 않고 지나치다/외면하다’라는 뜻에는 ‘외면하지 마소서’가 더 자연스럽습니다. 또한 조건·목적절을 ‘…집어삼키지 못하게 하소서’로 정리해야 합쇼체 기도문으로 매끄럽습니다.
  terminology: ‘민족들’은 ἔθνη의 외부 민족·국가들을 가리키는 문맥을 무리 없이 반영합니다. ‘구원해 줄 이’는 λυτρουμένου의 명사화된 현재분사, 곧 구원·속량을 행할 사람이 없다는 뜻을 살리면서 특정 신학적 칭호로 고정하지 않습니다. 각주에서 ‘속량해 줄 이’라는 대안을 제시하는 것은 적절합니다.
