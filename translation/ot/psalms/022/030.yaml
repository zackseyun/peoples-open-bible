  from: A seed will serve him; it will be proclaimed about the Lord to the generation.
  to: Posterity will serve him; it will be told of the Lord to the generation.
  rationale: זֶרַע is a collective “seed/offspring,” and “posterity” is a warranted natural-English rendering. But יְסֻפַּר is an impersonal passive that can be rendered “it will be told/recounted”; its grammatical masculine singular form does not require that “the Lord” be made the passive subject. The proposal’s “the Lord will be proclaimed” therefore resolves an ambiguity and is less idiomatic than “it will be told of the Lord.” Likewise, לַדּוֹר has the article (“the generation”); the next verse supports a future horizon, but “to a generation to come” makes that implication explicit beyond the wording. Retain the source’s compact ambiguity while correcting the misleading “A seed.”
