translation:
  text: And when they saw the Lord of the sheep, they turned back[c] so as to flee from before his face; and that
    watercourse[a] gathered together, and it became swift according to its nature, and it filled with water and
    rose up until it covered those wolves.[b][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'that channel of water' or 'that torrent-bed'; the Ge'ez term likely refers to a stream-course that
      suddenly swells.
    reason: lexical_alternative
  - marker: b
    text: Or 'rose up to cover those wolves.' The final phrase may refer either to the flood reaching the wolves'
      covering/shelter or to the waters covering the wolves themselves.
    reason: alternative_reading
  - marker: c
    text: Or 'they entered'.
    reason: alternative_reading
  - marker: d
    text: Or 'as far as the covering of those wolves'.
    reason: alternative_reading
