  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017.yaml
  text: 'And now I command you, my children: do not love silver, and do not set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.


    And I know that because of these two things my seed will come to the ruin of sexual immorality. For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which the Lord gave me because of my obedience to my father Jacob.'
translation:
  language: ko
  text: '17

    1. 이제 내가 너희에게 명령합니다, 내 자녀들아. 은을 사랑하지 말고, 여인들의 아름다움에 시선을 두지 마십시오. 나도 금과 아름다움 때문에 가나안 여인 베수에에게로 잘못 이끌렸기 때문입니다.


    2. 나는 이 두 가지 때문에 내 후손이 음행으로 말미암는 파멸에 이르게 될 것을 압니다. 그것들은 내 아들들 가운데 지혜로운 사람들까지 타락시킬 것이며, 주께서 내가 내 아버지 야곱에게 순종했기 때문에 내게 주신 유다의 왕국을 작아지게 할 것입니다.


    3. 나는 아버지 야곱의 말씀을 결코 거역하지 않았습니다. 그가 내게 말한 모든 것을 행했기 때문입니다.


    4. 나의 조상 아브라함은 내가 이스라엘에서 왕으로 다스리도록 축복하였고, 야곱도 이와 같이 나를 축복하였습니다.


    5. 나는 왕국이 내게서 일어설 것을 압니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἀγαπᾶτε ἀργύριον
  english_pob_choice: do not love silver
  chosen_korean: 은을 사랑하지 말고
  alternatives_korean:
  - 은을 좋아하지 말고
  - 은을 탐내지 말고
  lexicon: ἀργύριον → 은
  rationale: POB가 silver를 직역하므로 통용되는 화폐어를 살려 ‘은’으로 옮기고, ἀγαπᾶτε는 단순 선호보다 애착을 뜻하므로 ‘사랑하다’를 유지했습니다.
- source_word: μηδὲ ἐπιβλέπει εἰς κάλλος γυναικῶν
  english_pob_choice: do not set your gaze on the beauty of women
  chosen_korean: 여인들의 아름다움에 시선을 두지 마십시오
  alternatives_korean:
  - 여인들의 아름다움에 눈길을 주지 마십시오
  - 여인들의 아름다움을 바라보지 마십시오
  lexicon: ἐπιβλέπειν εἰς + κάλλος
  rationale: ‘시선을 두다’는 단순 시각 행위보다 의도적 응시를 잘 드러내며, κάλλος의 외모적 매력을 ‘아름다움’으로 자연스럽게 반영합니다.
- source_word: εἰς ἀπώλειαν πορνείας
  english_pob_choice: to the ruin of sexual immorality
  chosen_korean: 음행의 파멸로 이르게 될
  alternatives_korean:
  - 음행의 멸망에 이르게 될
  - 성적 부도덕의 파멸로 이르게 될
  lexicon: ἀπώλεια + πορνεία
  rationale: POB의 긴장을 따라 πορνεία를 교회식 완곡어인 ‘성적 부도덕’보다 더 직접적인 ‘음행’으로 옮기고, ἀπώλεια는 ‘파멸’로 강도를 살렸습니다.
- source_word: τὸ βασίλειον / βασιλείαν Ἰούδα
  english_pob_choice: the kingdom of Judah
  chosen_korean: 유다의 왕국
  alternatives_korean:
  - 유다의 나라
  - 유다 왕국
  lexicon: βασιλεία/βασίλειον
  rationale: 정치적·왕조적 실체를 지시하므로 ‘왕국’이 적합하며, 문맥상 지명성보다 유다의 통치 영역을 가리킵니다.
theological_decisions:
- issue: 성적 타락이 왕국의 쇠퇴와 연결되는 경고
  chosen_reading: 저자는 개인의 욕망이 공동체와 왕권의 쇠퇴로 이어진다는 인과를 분명히 제시합니다.
  alternative_readings:
  - 개인 도덕 경고로만 축소하는 읽기
  - 비유적 과장으로만 처리하는 읽기
  rationale: 원문은 ‘이 두 가지’가 후손의 파멸과 왕국의 축소를 낳는다고 직접 연결하므로, 도덕 훈계로 약화하지 않고 인과를 유지해야 합니다.
  doctrine_reference: 지혜/윤리 경고의 공동체적 책임 강조
