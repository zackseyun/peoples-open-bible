id: GEN.3.15
reference: Genesis 3:15
source:
  edition: WLC
  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
translation:
  text: And I will put enmity between you and the woman, and between your seed[a] and her seed; he[b] will crush your head[c], and you will bruise his heel.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: '''Seed'' means offspring or descendants and can refer collectively to a group or to a representative individual.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'it,' referring collectively to her offspring.
    reason: alternative_reading
  - marker: c
    text: Or, 'he will strike your head, and you will strike his heel'; the same Hebrew verb is used in both clauses.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיבָה
  chosen: enmity
  alternatives:
  - hostility
  lexicon: HALOT
  rationale: Denotes active, enduring opposition. 'Enmity' stays closer to the Hebrew term and preserves the weight of the relationship God establishes, while 'hostility' remains a clear modern alternative.
- source_word: אָשִׁית
  chosen: I will put
  alternatives:
  - I will set
  lexicon: HALOT
  rationale: Qal of שׂים commonly means 'put, place, set.' 'I will put' is the most natural modern rendering here.
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  chosen: between you and the woman
  lexicon: HALOT
  rationale: Straightforward relational preposition repeated for emphasis; retained in English for the parallel structure.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  chosen: your seed ... her seed
  alternatives:
  - your offspring ... her offspring
  - your descendants ... her descendants
  lexicon: HALOT
  rationale: זֶרַע is a collective noun that literally means 'seed' and can denote offspring or descendants. Repeating 'seed' preserves the Hebrew image for both the serpent's line and the woman's line while keeping the collective and representative-individual senses visible.
- source_word: הוּא
  chosen: he
  alternatives:
  - it
  - he/it
  lexicon: HALOT
  rationale: The pronoun is grammatically masculine singular. Given the singular pronoun following the collective noun 'seed,' English 'he' best reflects the Hebrew form while allowing the representative-individual sense to remain visible. The collective possibility is preserved in a footnote.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  chosen: will crush ... will bruise
  alternatives:
  - will bruise ... will bruise
  - will strike ... will strike
  - will attack ... will attack
  lexicon: HALOT
  rationale: The verb שׁוּף is rare and repeated in both clauses, but the contrasting objects create a deliberate asymmetry. 'Crush' for the head wound and 'bruise' for the heel wound makes that asymmetry explicit while the footnote preserves the repeated Hebrew verb and its alternatives.
- source_word: רֹאשׁ
  chosen: head
  lexicon: HALOT
  rationale: Literal body-part term; retained plainly.
- source_word: עָקֵב
  chosen: heel
  lexicon: HALOT
  rationale: Literal body-part term; retained plainly.
