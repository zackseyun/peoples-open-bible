revisions:
- from: 좋든지 나쁘든지, 우리는 당신을 그에게 보내는 주 우리 하나님의 목소리에 순종하겠습니다. 그래서 우리가 주 우리 하나님의 목소리에 순종할 때 우리에게 잘되게 하실 것입니다.
  to: 좋든 나쁘든, 우리는 우리가 당신을 보내는 분, 곧 주 우리 하나님의 말씀에 순종하겠습니다. 이는 우리가 주 우리 하나님의 말씀에 순종할 때 우리에게 잘되게 하려는 것입니다.
  rationale: 관계절의 선행사인 ‘주 우리 하나님’을 동격으로 명시하여 원문의 문법 관계를 바로잡았습니다. 하나님의 명시적 사역을 덧붙이지 않고 ‘우리에게 잘되게 하다’라는 비인칭적 결과 표현을 유지했으며, 목적과 순종의 연결은 ‘순종할 때’로 자연스럽게 나타냈습니다.
