  rationale: 히브리어는 전쟁 기동력을 대표하는 ‘병거와 말’을 병렬로 제시하므로, 전투력을 가리키는 시적 표현으로 그대로 유지했습니다.
theological_decisions:
- issue: 군사력의 무력화 이미지
  chosen_reading: 여호와의 책망 앞에서 적의 전쟁 기동력이 깊은 잠에 빠져 무력해지는 장면으로 읽었습니다.
  alternative_readings:
  - 말과 병거가 문자적으로 잠드는 장면
  - 죽음이나 전멸을 직접 말하는 표현
  rationale: 문맥상 시적 과장과 의인화를 통해 하나님의 권능이 적의 군사력을 즉각 무력화하는 뜻을 전달하므로, 이미지를 과도하게 문자화하지 않았습니다.
  doctrine_reference: 시편 76편의 하나님의 주권적 심판과 전쟁 제압 이미지
