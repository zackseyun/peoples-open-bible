theological_decisions:
- issue: Ecclesial office terms (ἐπίσκοποι, διάκονοι)
  chosen_reading: Translate as bishops and deacons (technical offices)
  alternative_readings:
  - overseers and ministers (functional glosses)
  rationale: Retain the selected bishops/deacons role labels with functional alternatives, without asserting
    the later form of church hierarchy.
  doctrine_reference: Translation philosophy — Preserve second-century church texture; Translate titles;
    Consistency of key terms.
- issue: τοῖς ἐκλεκτοῖς (the elect)
  chosen_reading: Render as God’s elect
  alternative_readings:
  - God’s chosen ones
  rationale: “Elect” keeps theological density and early-Christian diction; aligns with Cartha default
    for contested terms.
  doctrine_reference: DOCTRINE.md — Contested terms table (elect).
- issue: μετανοέω in a sin context
  chosen_reading: repent
  alternative_readings:
  - change one’s mind
  rationale: Retain contextual repentance after named sin, all conditions, and the construction deadline;
    do not reduce it to sadness or impose a uniform Godward formula.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- issue: Angels admonishing new believers
  chosen_reading: Treat as literal angelic activity within the vision
  alternative_readings: []
  rationale: Angels are the explicit agents in this vision; replacing them with human teachers would change
    that statement.
  doctrine_reference: What matters most — Keep the allegories legible; Preserve visionary imagery.
- issue: Those drawn from the deep as martyrs
  chosen_reading: Render descriptively as those who suffered on account of the Lord’s name
  alternative_readings: []
  rationale: The selected clause says suffered, without death or a technical label. Noteh distinguishes
    the versions and Athos; their expansions are not inserted into the working reading.
  doctrine_reference: Original-language primacy over translation tradition.
- issue: Eschatological cutoff (completion of the building)
  chosen_reading: Retain the tower-construction deadline, no-place denial and future exclusion.
  alternative_readings: []
  rationale: The selected text explicitly conditions usefulness/strength on repentance now during construction.
    It supplies no calendar or wider timetable; no temporary admission pause is invented.
  doctrine_reference: Preserve theological tension and early-Christian paraenesis.
- issue: σεμνότης τοῦ Θεοῦ
  chosen_reading: ‘Reverent dignity of God’ reflects God’s own solemn standard shaping their conduct
  alternative_readings:
  - ‘Solemnity for God’ (subjective genitive)
  rationale: The prepositional phrase κατὰ τὴν σεμνότητα τοῦ Θεοῦ most naturally takes God as the norm
    of their behavior, not merely its object.
- issue: Contextual repentance reassessment
  chosen_reading: Repentance retains moral change after explicit sin and all tower-construction conditions.
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: The immutable contextual terminology record and complete old record are retained in a separately
    pinned followup; these aligned drafts receive fresh source review.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
