  source_fidelity: 히브리어는 야곱의 아들들이 그 소식을 듣고 들에서 왔으며, 그들이 매우 근심하고 격분한 까닭이 세겜이 야곱의 딸과 동침하여 이스라엘 안에서 נְבָלָה, 곧 수치스럽고 용납될 수 없는 일을 저질렀기 때문이라고 말합니다. 초안은 전반적 의미를 전달하나, ‘부끄러운 일’은 נְבָלָה의 강한 사회적·도덕적 규탄을 다소 약화합니다.
