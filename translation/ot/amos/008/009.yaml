  from: And it shall happen in that day[a], declares the Lord GOD, that I will make the sun go down at noon, and I will darken the earth in broad daylight.
  to: On that day, declares the Lord Yahweh, I will make the sun go down at noon and darken the earth in broad daylight.
  rationale: I retain the earlier rendering of the sun's setting at noon and darkness in broad daylight, which conveys the reversal vividly. The prior conventional divine title yields to the standing Yahweh ruling, while the introductory formula is shortened without interpreting the event as a particular eclipse.
