translation:
  text: of insisting on accurate scales and balances[a], or on correct ephah measures and stone weights[b];
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew wording is difficult; the Greek reads “accuracy of scales and weights,” followed here.
    reason: textual_variant
  - marker: b
    text: An ephah was a standard measure for dry goods; stones served as standard weights on scales.
    reason: cultural_note
lexical_decisions:
- source_word: שחק
  chosen: cheating
  alternatives:
  - fraud
  - exactness
  - accuracy
  lexicon: HALOT
  rationale: The Hebrew as transmitted in Kahana is difficult; in context with scales and balances it most naturally points to dishonest manipulation rather than mere play or wear. The Greek parallel has 'accuracy of scale and weights,' which suggests the line concerns proper commercial measurement. Rendering 'cheating' captures the likely practical sense from the Hebrew while acknowledging the mismatch with the Greek.
- source_word: מאזנים
  chosen: scales
  alternatives:
  - balances
  lexicon: HALOT
  rationale: Standard Hebrew term for weighing scales. 'Scales' is the most natural modern English equivalent.
- source_word: פלס
  chosen: balances
  alternatives:
  - weights
  - balance-beam
  lexicon: HALOT
  rationale: In a weighing context this likely denotes balancing apparatus or standard balancing measure. 'Balances' pairs naturally with 'scales' without over-specifying the instrument.
- source_word: תמחות
  chosen: measures
  alternatives:
  - quantities
  - standard measures
  lexicon: HALOT
  rationale: The form is textually difficult, but in context with 'ephah and stone' it refers to units or standards of measurement. 'Measures' preserves the commercial sense without forcing a narrower reconstruction.
- source_word: איפה
  chosen: ephah
  alternatives:
  - dry measure
  lexicon: HALOT
  rationale: An ephah is a specific ancient unit; transliteration preserves the source term better than flattening it to a generic 'measure.'
- source_word: אבן
  chosen: stone weight
  alternatives:
  - stone
  - weight-stone
  lexicon: HALOT
  rationale: In commercial contexts אבן commonly refers to a stone used as a weight. 'Stone weight' makes the sense explicit in English.
- source_word: περὶ ἀκριβείας ζυγοῦ καὶ σταθμίων
  chosen: about cheating with scales and balances
  alternatives:
  - about accuracy in scales and weights
  - about exactness of scale and weights
  lexicon: BDAG
  rationale: The Greek parallel points toward precision/accuracy in weighing, but the Hebrew witness appears to reflect abuse or manipulation. Because the project prioritizes surviving Hebrew for Sirach where available, the main text follows the Hebrew-leaning sense while preserving the Greek-oriented alternative in a footnote.
- source_word: περὶ κτήσεως πολλῶν καὶ ὀλίγων
  chosen: measures of ephah and stone weight
  alternatives:
  - acquiring much and little
  - large and small quantities
  lexicon: BDAG
  rationale: The Greek second colon diverges notably from the Hebrew. Since the Hebrew specifically mentions ephah and stone, the translation follows the Hebrew wording, with the Greek divergence noted as a textual/translation issue.
