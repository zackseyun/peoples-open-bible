translation:
  text: The wind of dew has its dwelling at the ends of heaven and adjoins the storehouses of rain. Its course is
    in winter and summer. The rain cloud and the cloud of mist join together, and one gives to the other.[a]
  philosophy: optimal-equivalence
  footnotes:
