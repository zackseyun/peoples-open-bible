id: LUK.2.29
reference: Luke 2:29
source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
translation:
  text: “Now, Master, you are letting your servant[a] depart[b] in peace, as you promised,
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Greek doulos denotes a slave or bondservant, making the relationship to the Master explicit.
    reason: lexical_alternative
  - marker: b
    text: Literally, “you are releasing” or “dismissing,” with departure from this life in view.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν
  chosen: Now
  alternatives:
  - At this time
  lexicon: BDAG
  rationale: Temporal adverb marking the present fulfillment of Simeon’s expectation. 'Now' is the natural and sufficiently direct English equivalent.
- source_word: ἀπολύεις
  chosen: are releasing
  alternatives:
  - dismiss
  - let go
  - set free
  lexicon: BDAG
  rationale: Present active indicative, second singular. In context Simeon speaks of being allowed to depart, likely with death in view. 'Are releasing' preserves the verbal image without over-interpreting it as explicitly 'letting die.'
- source_word: τὸν δοῦλόν σου
  chosen: your slave
  alternatives:
  - your servant
  - your bondservant
  lexicon: BDAG
  rationale: δοῦλος can mean either 'slave' or 'servant' depending on context. Per doctrine, 'slave' is preferred where bonded status is salient. Here Simeon addresses God as δέσποτα ('Master'), making the master-slave relation explicit, so 'your slave' best preserves the relational force.
- source_word: δέσποτα
  chosen: Master
  alternatives:
  - Sovereign Lord
  - Lord
  lexicon: BDAG
  rationale: Vocative of δεσπότης, denoting an owner/master with authority. 'Master' best matches the immediate pairing with δοῦλος and preserves the personal address. 'Sovereign Lord' is interpretive expansion not required by the Greek.
- source_word: κατὰ τὸ ῥῆμά σου
  chosen: according to your word
  alternatives:
  - in accordance with your word
  - as you said
  lexicon: BDAG
  rationale: κατά with the accusative here expresses conformity. ῥῆμα is 'word' or 'spoken word/matter.' 'According to your word' is both natural and close to the Greek, preserving the allusion to divine promise.
- source_word: ἐν εἰρήνῃ
  chosen: in peace
  alternatives:
  - peacefully
  lexicon: BDAG
  rationale: Prepositional phrase best rendered literally. 'In peace' preserves the biblical resonance of peaceful departure under divine favor better than the adverb 'peacefully.'
