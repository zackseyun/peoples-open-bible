  text: καὶ παρεγένοντο ἐπὶ τὴν σκηνὴν Ὁλοφέρνου, καὶ εἶπαν τῷ οὔτι ἐπὶ πάντων τῶν αὐτοῦ Ἔγειρον δὴ τὸν κύριον ἡμῶν, ὅτι ἐτόλμησαν οἱ δοῦλοι καταβαίνειν ἐφʼ ἡμᾶς εἰς πόλεμον, ἵνα ἐξολοθρευθῶσιν εἰς τέλος.
