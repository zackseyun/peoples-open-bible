- from: 하나님의 사람이 엘리에게 와서 그에게 말했습니다. “야훼께서 이같이 말씀하십니다. 내가 이집트에 있었고 바로의 집에 속해 있던 너의 조상들의 집에 정말로 나를 나타냈느냐?”[a]
  to: 하나님의 사람이 엘리에게 와서 그에게 말했습니다. “야훼께서 이렇게 말씀하십니다. 네 조상 집안이 이집트에서 바로의 집에 속해 있을 때, 내가 그들에게 나 자신을 분명히 나타내지 않았느냐?”
  rationale: 시간절의 주체를 ‘네 조상 집안’으로 명시하여 원문의 통사 관계를 바로잡았습니다. ‘바로의 집에 속해 있을 때’는 לְבֵית פַּרְעֹה의 소속·예속 관계를 유지하며, 수사 의문문은 원문의 강조를 살려 번역했습니다.
