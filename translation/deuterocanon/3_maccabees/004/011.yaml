  - source_phrase: τοῖς καταπορευομένοις ... καὶ τοῖς ... στελλομένοις πρὸς ἐκδημίαν
    prior_rendering: those who were traveling down into the city and ... those being sent out from there into the country on a journey
    new_rendering: everyone entering the city or setting out from it into the countryside
    rationale: The relevant contrast is between incoming and outgoing travelers, not between people arriving voluntarily and people being officially dispatched.
