  rationale: The adjective can denote either faithfulness or belief. The verse does not force a sharp distinction, so the main text uses 'faithful' as a natural descriptor, with 'believing' preserved in a footnote to maintain the lexical tension rather than over-resolve it.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
