base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/001.yaml
  text: Clap your hands, all peoples[a]; shout to God with a cry of joy[b].
  footnotes:
  - marker: a
    text: Or 'all nations.' The Hebrew עַמִּים can denote peoples in an ethnic/corporate sense or nations more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or 'with the sound of rejoicing' or 'with a joyful voice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 민족들아[a], 손뼉을 치십시오. 기쁨의 소리로[b] 하나님께 외치십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 백성들아’ 또는 ‘모든 나라들아’. 히브리어 עַמִּים은 여러 백성 집단을 가리키며, 문맥에 따라 민족들 또는 나라들로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기쁨의 목소리로’ 또는 ‘환호의 소리로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 지휘자에게
  - 인도자에게
  - 음악 감독에게
  lexicon: HALOT
  rationale: 시편 표제에서 לַמְנַצֵּחַ는 음악 책임자나 지휘자를 가리키는 관용적 표지이므로, 기능을 자연스럽게 드러내는 ‘지휘자에게’로 옮겼습니다.
- source_word: לִבְנֵי קֹרַח
  english_pob_choice: Of the sons of Korah
  chosen_korean: 고라 자손의
  alternatives_korean:
  - 고라 자손의
  - 고라 자손을 위한
  - 고라 자손이 지은
  lexicon: HALOT
  rationale: 전치사 ל가 이 표제에서 소속·헌정·저작 가능성을 모두 열어 두므로, 한국어는 소속을 드러내면서도 저작을 단정하지 않는 소유격 표현을 택했습니다.
- source_word: מִזְמֽוֹר
  english_pob_choice: A psalm
  chosen_korean: 시입니다
  alternatives_korean:
  - 시입니다
  - 시편입니다
  - 노래입니다
  lexicon: HALOT
  rationale: מִזְמוֹר는 정형화된 장르 표지이므로, 한국어에서도 ‘시’로 옮겨 장르성을 유지했습니다.
theological_decisions:
- issue: 시편 표제의 전치사 ל가 갖는 소속/헌정/저작의 다의성
  chosen_reading: 한국어는 ‘고라 자손의’로 두어 표제의 소속감을 살리되, 저작자를 단정하지는 않았습니다.
  alternative_readings:
  - 고라 자손을 위한
  - 고라 자손이 지은
  rationale: 원문은 의도적으로 관계를 열어 두므로, 번역도 그 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 시편 표제 해석학; 저작 표기 보존 원칙
