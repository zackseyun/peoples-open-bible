id: PSA.68.4
reference: Psalms 68:4
source:
  edition: WLC
  text: שִׁ֤ירוּ לֵֽ/אלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥/וֹ סֹ֡לּוּ לָ/רֹכֵ֣ב בָּ֭/עֲרָבוֹת בְּ/יָ֥הּ שְׁמ֗/וֹ וְ/עִלְז֥וּ לְ/פָנָֽי/ו׀׃
translation:
  text: Sing to God; sing praise to his name. Prepare the way for the one who rides through the deserts[a]; Yah[b] is his name. Exult before him.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “across the steppes”; another interpretation is “upon the clouds.”
    reason: alternative_reading
  - marker: b
    text: Yah is a shortened form of Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  chosen: Sing
  alternatives:
  - Sing out
  lexicon: HALOT
  rationale: Imperative plural of שׁיר, a straightforward call to sing. English imperative 'Sing' preserves the direct exhortation.
- source_word: לֵאלֹהִים
  chosen: to God
  alternatives:
  - to gods
  lexicon: HALOT
  rationale: In this psalmic context אֱלֹהִים clearly refers to the God of Israel, so singular 'God' is required.
- source_word: זַמְּרוּ שְׁמוֹ
  chosen: sing praise to his name
  alternatives:
  - make music to his name
  - psalm his name
  lexicon: HALOT
  rationale: זמר in praise contexts commonly means making music/singing praise. 'Sing praise to his name' is idiomatic and preserves the object 'his name,' which signifies his revealed person and reputation.
- source_word: סֹלּוּ
  chosen: Prepare the way
  alternatives:
  - prepare a highway
  - raise up
  - cast up
  lexicon: HALOT
  rationale: Restores the imperative road-building image.
- source_word: לָרֹכֵב
  chosen: for the one who rides
  alternatives:
  - for him who rides
  - for the rider
  lexicon: HALOT
  rationale: Qal participle of רכב used as a divine epithet. 'The one who rides' is natural English and preserves the participial force.
- source_word: בָּעֲרָבוֹת
  chosen: through the deserts
  alternatives:
  - through the steppes
  - upon the clouds
  - in the wildernesses
  lexicon: HALOT
  rationale: A defensible rendering of desert plains/steppe terrain in context.
- source_word: בְּיָהּ שְׁמוֹ
  chosen: Yah is his name
  alternatives:
  - his name is Yah
  lexicon: HALOT
  rationale: יָהּ is the short form of the divine name. Per translation philosophy, personal names are transliterated rather than translated; therefore 'Yah' is preferred over substituting 'the LORD' here.
- source_word: וְעִלְזוּ לְפָנָיו
  chosen: exult before him
  alternatives:
  - rejoice before him
  - be jubilant before him
  lexicon: HALOT
  rationale: עלז conveys exuberant rejoicing. 'Exult' preserves the elevated, celebratory tone of the imperative.
