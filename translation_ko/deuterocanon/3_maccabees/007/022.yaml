    issue: ‘등록으로’는 ἐξ ἀπογραφῆς의 의미 관계를 한국어에서 분명히 전달하지 못합니다.
    rationale: ἀπογραφή는 공식 등록 또는 등록부/기록을 뜻할 수 있습니다. ‘등록부에 기록된’으로 옮기면 행정 기록과 재산 반환의 관련성을 자연스럽게 나타내면서 과도하게 특정하지 않습니다.
