  yaml_path: translation/ot/psalms/018/032.yaml
  text: God is the one who equips me with strength[a] and makes my way blameless[b].
  footnotes:
  - marker: a
    text: More literally, “who girds me with strength”; the Hebrew pictures being belted and equipped for action.
    reason: lexical_alternative
  - marker: b
    text: Or “makes my way complete.” The Hebrew can denote wholeness, integrity, or freedom from defect.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 나에게 힘을 두르게 하시며 내 길을 온전하게 하시는 분이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 힘으로 띠우시는 분’. 히브리어는 본래 힘·능력·용맹을 ‘띠우는’ 것으로 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 길을 완전하게 하시는 분’, ‘내 길을 흠 없게 하시는 분’. 히브리어 ‘타밈’은 온전함, 완전함, 성실함 또는 흠 없음을 뜻할 수 있습니다.
    reason: lexical_alternative
