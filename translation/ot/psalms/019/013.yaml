  from: Also keep your servant back from presumptuous sins[a]; do not let them rule over me[b][c]. Then I will be blameless and be cleared from great transgression.
  to: Also keep your servant back from presumptuous sins[a]; do not let them rule over me. Then I will be blameless[b] and cleared of great transgression[c].
  rationale: 'The proposed marker placement and notes improve correspondence. “Innocent of great transgression,” however, slightly shifts the verbal sense: וְנִקֵּיתִי is better retained as “cleared,” and “cleared of” is natural English. This also preserves the distinction from the preceding אֵיתָם (“blameless”). The contextual rendering “presumptuous sins” remains defensible while the note honestly preserves the personal referent alternative.'
