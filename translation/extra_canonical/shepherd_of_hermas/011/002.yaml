translation:
  text: She said, "Many indeed will hear; and, having heard, some of them will rejoice, but some will weep. But even these, if they hear and repent[a], they too will rejoice. Therefore listen to the parables of the tower, for I will reveal everything to you. And no longer cause me trouble about revelations, for these revelations have an end, for they have been completed. But you will not stop asking for revelations, for you are shameless."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
