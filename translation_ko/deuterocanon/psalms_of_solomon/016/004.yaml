  text: He prodded me like a horse’s goad He prodded me like a horse’s goad to watchfulness for Him; my Savior and my helper saved me at all times.
translation:
  language: ko
  text: 그는 말의 박차처럼[a][b] 나를 찔러 그의 깨어 있음에 이르도록 하셨습니다.[c] 나의 구원자요 돕는 이께서[d] 모든 때에 나를 구원하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나를 찔러’(ἔνυξέν με)는 문자적으로 찌르거나 쏘는 강한 동작을 가리킵니다.
    reason: source_note
  - marker: b
    text: κέντρον은 말을 비롯한 짐승을 재촉하는 뾰족한 도구를 뜻합니다. 여기서는 ‘박차’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그의 깨어 있음에/그의 깨어 있음을 위하여’입니다. ἐγρήγορσις는 ‘깨어 있음, 경계하는 상태’를 뜻하며, αὐτοῦ(‘그의’)가 누구를 가리키는지와 그 정확한 관계는 본문만으로 확정하기 어렵습니다.
    reason: source_note
  - marker: d
    text: ἀντιλήμπτωρ는 돕고 붙들어 주는 이를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνυξέν με
  english_pob_choice: He prodded me
  chosen_korean: 그는 … 나를 찔렀습니다
  alternatives_korean:
  - 그는 … 나를 찌르셨습니다
  - 그는 … 나를 자극하셨습니다
  - 그는 … 나를 찔러 일깨우셨습니다
  lexicon: ἔνυξεν
  rationale: 동작의 강한 촉발성을 살리면서도 한국어에서 자연스러운 직접 동사인 ‘찔렀습니다’를 택했습니다. ‘자극하다’는 의미를 약화시킬 수 있어 제외했습니다.
- source_word: ὡς κέντρον ἵππου
  english_pob_choice: like a horse’s goad
  chosen_korean: 말의 박차처럼
  alternatives_korean:
  - 말의 채찍처럼
  - 말몰이용 쇠꼬챙이처럼
  - 말을 몰는 채찍처럼
  lexicon: κέντρον
  rationale: κέντρον은 말이나 짐승을 자극하는 도구를 가리키므로, 본문 이미지가 분명히 살아나는 ‘박차처럼’으로 옮겼습니다. 다만 전통적 종교어보다 직관적 이미지가 우선입니다.
- source_word: ἐπὶ τὴν ἐγρήγορσίν αὐτοῦ
  english_pob_choice: to watchfulness for Him
  chosen_korean: 그를 향한 깨어 있음으로
  alternatives_korean:
  - 그를 위해 깨어 있으려고
  - 그의 깨어 있음에 이르도록
  - 그를 지키기 위한 깨어 있음으로
  lexicon: ἐγρήγορσις
  rationale: ἐγρήγορσις는 단순한 ‘깨어남’보다 지속적인 경계 상태를 뜻하므로 ‘깨어 있음’으로 옮겼고, ἐπὶ를 목적/방향으로 이해해 ‘그를 향한’으로 풀었습니다.
- source_word: ἀντιλήμπτωρ μου
  english_pob_choice: my helper
  chosen_korean: 나의 돕는 이이신 분
  alternatives_korean:
  - 나의 조력자
  - 나를 붙드시는 분
  - 나의 도움자
  lexicon: ἀντιλήμπτωρ
  rationale: 단순 보조자보다 ‘붙들어 주는 도움’의 뉘앙스를 살리기 위해 ‘돕는 이이신 분’으로 옮겼습니다. 문맥상 신적 칭호처럼 기능하므로 존칭 구조를 유지했습니다.
theological_decisions:
- issue: ‘그를 향한 깨어 있음’의 목적 관계
  chosen_reading: 본문은 그를 깨우려는 행위가 아니라, 그를 향해 늘 깨어 있으려는 상태를 말하는 것으로 읽었습니다.
  alternative_readings:
  - 그를 깨우기 위해
  - 그를 깨닫게 하려고
  - 그를 일깨우려는 의미
  rationale: English POB의 ‘to watchfulness for Him’과 그리스어 ἐπὶ τὴν ἐγρήγορσιν의 방향성을 따라, 인간이 하나님을 깨우는 듯한 오해를 피하고 경계적 충실함을 살렸습니다.
  doctrine_reference: 시편적 경건과 신자-하나님 관계의 경계/깨어 있음 표상
- issue: ‘구원자요 돕는 이’의 칭호 유지
  chosen_reading: ‘나의 구원자요 나의 돕는 이이신 분’으로 두 칭호를 병렬 유지했습니다.
  alternative_readings:
  - 나의 구원자와 돕는 이
  - 나를 구원하시고 돕는 분
  rationale: ὁ σωτήρ와 ἀντιλήμπτωρ를 각각 보존해, 구원과 지속적 도움이라는 두 역할을 구분해 드러냈습니다.
  doctrine_reference: 하나님의 구원과 섭리의 이중 표상
