  rationale: 원문과 영어 POB의 절 구분을 바로잡아, 히브리어 완료형 עָלָה를 ‘올라가셨습니다’로 옮겼습니다. בִּתְרוּעָה는 넓은 의미를 보존하는 ‘환호와 함께’로 번역하고, 병행하는 두 번째 반행의 생략된 동사는 한국어의 완결된 문장을 위해 보충했습니다. ‘승천’은 가능한 어휘 대안으로만 각주에 두어 본문이 후대의 특정 신학적 해석을 강제하지 않게 했습니다.
