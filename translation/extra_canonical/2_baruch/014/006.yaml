  category: lexical
  from: were found
  to: were provided
  rationale: The Syriac verb (Ethpeel of shkh) literally means 'were found', but in
    this context it carries the sense of 'were provided', 'appeared', or 'existed'.
    'Were found' is slightly unnatural here.
