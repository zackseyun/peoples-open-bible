  review_summary: “Do valiantly” is a traditional but dated gloss of the idiom עשה חיל. In this martial context the phrase naturally means to prevail or achieve victory. “Achieve victory” communicates the idiom in modern English while preserving the coordinated human action in dependence on God and God's decisive trampling of the foes.
