  category: ambiguity
  tier: 1
  from: Though a sinner does evil a hundred times and prolongs his life[a], yet I also know that it will be well for those who fear God[b], who fear before him.
  to: Though a sinner does evil a hundred times and lives long, yet I also know that it will be well for those who fear God, who fear before him.
  rationale: The proposal rightly identifies that the Hebrew leaves the object of “lengthens” unexpressed and that “prolongs his life” can overstate the sinner’s agency. But “continues long” is not natural English. “Lives long” is idiomatic, conveys the contextual sense, and does not supply an explicit object. The current “yet I also know” and “it will be well” are source-faithful and need not be replaced merely for preference.
