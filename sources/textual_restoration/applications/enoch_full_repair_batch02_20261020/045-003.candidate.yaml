translation:
  text: On that day my Chosen One will sit on the throne of glory and choose their works.[a] Their resting places
    will be numberless,[b] and their souls will grow strong within them when they see my chosen ones and those who
    have called upon my glorious name.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The printed dagger marks 'choose' as corrupt. Charles 1906 printed page 85 note 21 proposes an underlying
      'try/examine' through a Hebrew or Aramaic explanation. 'Choose' retains the printed Ge'ez rather than silently
      installing that reconstruction. The reconstruction is the editor's proposal, not an additional manuscript
      witness.
    reason: textual_variant
  - marker: b
    text: Literally, 'their rest, a number there is not.' The clause is separated from the preceding works phrase
      rather than made another object of 'choose'.
    reason: lexical_alternative
  - marker: c
    text: Dillmann’s 1865 lexicon, column383, cites this verse under approaching or appealing to someone in prayer
      or for help. “Called upon” follows that sense, not the separate accusation sense. The printed verse shifts
      from singular “my Chosen One” to plural “my chosen ones”; the shift is retained.
    reason: lexical_alternative
