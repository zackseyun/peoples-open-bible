id: PSA.56.6
reference: Psalms 56:6
source:
  edition: WLC
  text: יָג֤וּרוּ יצפינו הֵ֭מָּה עֲקֵבַ֣/י יִשְׁמֹ֑רוּ כַּ֝/אֲשֶׁ֗ר קִוּ֥וּ נַפְשִֽׁ/י׀׃
translation:
  text: They band together and lurk; they watch my steps[a], waiting to take my life.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “my heels.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוּרוּ
  chosen: they gather together
  alternatives:
  - they sojourn
  - they attack
  - they stir up strife
  lexicon: HALOT
  rationale: From גור in the Qal imperfect 3mp. In this hostile context the sense is not neutral 'sojourn' but hostile assembling/banding together. 'Gather together' preserves the image without overinterpreting to explicit violence.
- source_word: יצפינו
  chosen: they hide themselves
  alternatives:
  - they lurk
  - they conceal themselves
  lexicon: HALOT
  rationale: 'From צפן in the Hiphil 3mp, with reflexive sense in context: they conceal themselves in ambush. ''Hide themselves'' is clear modern English and leaves the ambush nuance to the context.'
- source_word: המה
  chosen: they
  alternatives:
  - they themselves
  lexicon: HALOT
  rationale: Independent pronoun used for emphasis. English can represent this simply with 'they' without awkwardness; the repeated clauses already convey emphasis.
- source_word: עֲקֵבַי
  chosen: my steps
  alternatives:
  - my heels
  - my footsteps
  lexicon: HALOT
  rationale: Literally 'my heels,' but idiomatically refers to one's steps/footsteps or movements being tracked. 'My steps' is the most natural idiomatic rendering in English.
- source_word: יִשְׁמֹרוּ
  chosen: they watch
  alternatives:
  - they keep watch over
  - they observe
  - they guard
  lexicon: HALOT
  rationale: From שמר, here in the sense of watching/keeping track of someone rather than guarding for protection. 'They watch' fits the hostile surveillance context.
- source_word: כַּאֲשֶׁר
  chosen: as
  alternatives:
  - just as
  - because
  lexicon: HALOT
  rationale: 'Best taken comparatively: ''as/just as'' introducing the manner in which they watch his steps. A causal sense is possible but less straightforward here.'
- source_word: קִוּוּ
  chosen: they lie in wait for
  alternatives:
  - they hope for
  - they lie in wait for
  - they eagerly expect
  lexicon: HALOT
  rationale: Although קוה ordinarily means wait or hope, its object and the surrounding concealment and surveillance make hostile waiting the contextual sense. “Lie in wait for” is natural English where “wait for my life” is not.
- source_word: נַפְשִׁי
  chosen: my life
  alternatives:
  - my soul
  - me
  lexicon: HALOT
  rationale: נפש often means 'life' or 'self' in Psalms. Here enemies are seeking the psalmist's life, so 'my life' is clearer and contextually stronger than the more ambiguous 'my soul'.
