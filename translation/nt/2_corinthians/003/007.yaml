  meaning_decisions:
  - source_phrase: ἡ διακονία τοῦ θανάτου
    prior_rendering: the ministry of death
    new_rendering: the ministry that brought death
    rationale: The genitive describes the ministry’s effect, not service offered to death as a personified master.
  - source_phrase: ἐν γράμμασιν ἐντετυπωμένη λίθοις
    prior_rendering: engraved in letters on stones
    new_rendering: whose law was engraved in letters on stone tablets
    rationale: The first hearers understood the Sinai law and its tablets; the clarification avoids suggesting that a ministry itself was physically engraved.
  - source_phrase: τοὺς υἱοὺς Ἰσραήλ
    prior_rendering: the sons of Israel
    new_rendering: the Israelites
    rationale: This is the conventional designation of Israel’s people, not a restriction to male descendants.
