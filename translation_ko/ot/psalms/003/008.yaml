translation:
  language: ko
  text: 구원은 야훼께 있습니다. 당신의 백성 위에 당신의 복이 있습니다.[a] 셀라[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 백성 위에 당신의 복이 있기를 빕니다.’ 히브리어 이 절은 동사가 없는 문장이므로 선언으로도 기원으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘셀라’는 예배나 음악과 관련된 표지였을 가능성이 크지만, 정확한 뜻은 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  english_pob_choice: Rise up
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 일어서십시오
  - 일어나소서
  lexicon: HALOT
  rationale: 하나님께 드리는 호소형 명령을 현대 한국어 합쇼체로 옮기되, 시적 긴박감을 살리기 위해 ‘일어나십시오’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기적 고유명사를 직역 관례에 따라 ‘야훼’로 옮겨, POB의 이름-대체 방침을 반영했습니다.
- source_word: לֶחִי
  english_pob_choice: on the cheek
  chosen_korean: 뺨을
  alternatives_korean:
  - 턱을
  - 턱뼈를
  lexicon: HALOT
  rationale: לֶחִי는 ‘뺨/턱’ 모두 가능하지만, 한국어에서는 ‘뺨을 치다’가 가장 자연스럽고 수치와 패배의 이미지를 함께 살립니다.
- source_word: שִׁנֵּי רְשָׁעִים
  english_pob_choice: the teeth of the wicked
  chosen_korean: 악인들의 이빨
  alternatives_korean:
  - 악한 자들의 이빨
  - 악인들의 치아
  lexicon: HALOT
  rationale: 직유적 폭력을 약화하지 않고 본문의 신체 이미지를 그대로 유지했습니다. ‘이빨’은 시적 맥락에서 더 생생합니다.
- source_word: שִׁבַּרְתָּ
  english_pob_choice: you have broken
  chosen_korean: 부수셨습니다
  alternatives_korean:
  - 깨뜨리셨습니다
  - 부서뜨리셨습니다
  lexicon: HALOT
  rationale: 완료형의 확정성을 한국어 과거완료보다 자연스러운 존대 서술로 옮겨, 하나님의 निर्ण정적 행위를 분명히 드러냈습니다.
theological_decisions:
- issue: 하나님께 드리는 직접 호소의 문체
  chosen_reading: 합쇼체 명령형과 존대 서술을 유지했습니다.
  alternative_readings:
