  from: But he chose the tribe of Judah[a], Mount Zion which he loved.
  to: But he chose the tribe of Judah and Mount Zion, which he loved.
  rationale: The repeated object marker אֶת marks both “the tribe of Judah” and “Mount Zion” as direct objects of the one verb. The comma-only wording falsely invites an appositional reading. Coordinating the two objects with “and” is necessary natural English; the relative clause most naturally modifies Mount Zion.
