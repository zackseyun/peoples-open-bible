id: PRO.29.6
reference: Proverbs 29:6
source:
  edition: WLC
  text: בְּ/פֶ֤שַֽׁע אִ֣ישׁ רָ֣ע מוֹקֵ֑שׁ וְ֝/צַדִּ֗יק יָר֥וּן וְ/שָׂמֵֽחַ׃
translation:
  text: An evil man is ensnared by his transgression, but a righteous man sings for joy and rejoices.
  philosophy: dynamic
lexical_decisions:
- source_word: בְּפֶשַׁע
  chosen: In the transgression
  alternatives:
  - By transgression
  - In transgression
  lexicon: HALOT
  rationale: The preposition ב plus פשע is rendered locatively/instrumentally. 'In the transgression' preserves the Hebrew compactness and the proverb's sense that the snare is bound up with the evil man's wrongdoing itself.
- source_word: אִישׁ רָע
  chosen: an evil man
  alternatives:
  - a wicked man
  - an evil person
  lexicon: HALOT
  rationale: Gender-accurate rendering follows the masculine singular Hebrew. 'Evil' is chosen over 'wicked' for readable modern English while retaining moral force.
- source_word: מוֹקֵשׁ
  chosen: a snare
  alternatives:
  - a trap
  lexicon: HALOT
  rationale: '''Snare'' is the standard wisdom-literature image and fits the terse proverbial style. It can imply either the trap itself or entanglement resulting from sin.'
- source_word: צַדִּיק
  chosen: the righteous
  alternatives:
  - a righteous man
  - the righteous person
  lexicon: HALOT
  rationale: Substantival adjective rendered as a representative class term. 'The righteous' is idiomatic in English wisdom literature and preserves the contrast with the evil man.
- source_word: יָרוּן
  chosen: sings for joy
  alternatives:
  - shouts for joy
  - cries aloud
  - rejoices
  lexicon: HALOT
  rationale: The verb denotes an audible joyful cry or song. “Sings for joy” is natural English and accurately reflects the retained translation.
- source_word: וְשָׂמֵחַ
  chosen: and rejoices
  alternatives:
  - and is glad
  - and is joyful
  lexicon: HALOT
  rationale: The participle adds a second expression of joy. 'Rejoices' is natural English and preserves the parallelism without flattening it into a single idea.
