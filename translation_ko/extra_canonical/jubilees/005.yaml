revisions:
- from: '1[a]. 또 이렇게 되었나니 사람의 자녀들이 땅 위에 번성하기 시작할 때에 그들에게서 딸들이 나니 이 희년의 어느 해에 하나님의 천사들이 그들을 보니 보기에 아름다웠더라. 그들이 택한 모든 자 중에서 아내를 취하여 자녀를 낳았으니 이들은 거인들이더라.

    2. 땅에 불법이 많아졌고 모든 육체가 그 길을 부패하였으니 곧 사람에게서 가축과 짐승과 새와 땅에 움직이는 모든 것에 이르니라. 그들은 모두 자기들의 길과 규례를 부패하게 하고, 서로 잡아먹기 시작했습니다. 불법이 땅에 성하였고 모든 사람의 자녀들의 생각의 모든 상상이 항상 악하였느니라.

    3. 주님께서 땅을 보신즉 땅이 황폐하여 모든 육체가 그 질서를 부패하였고 땅에 있는 자가 다 그의 목전에 악을 행하였더라.

    4. 그리고 말씀하셨다. “내가 창조한 땅 위에서 사람과 모든 육체를 다 멸하리라.”

    5. 그러나 노아만이 주님의 눈앞에서 은혜를 입었습니다.

    6. 그리고 땅에 보내신 천사들에게 진노하사 그들을 모든 권세에서 뽑아 버리셨습니다. 그리고 그는 우리에게 그것들을 땅 깊은 곳에 결박하라고 말씀하셨습니다. 보라, 그것들은 그들 가운데 결박되어 따로 보관되어 있습니다.

    7. 그리고 그들의 아들들에 관하여, 칼에 맞아 하늘 아래에서 제거되어야 한다는 말씀이 그의 얼굴 앞에서 나왔습니다.

    8. 또 이르시되 나의 영이 영원히 사람 위에 머물지 아니하리니 이는 그들도 육신이 됨이라 그들의 날은 백이십 년이 되리라 하시고

    9. 그리고 그는 그들 사이에 칼을 보내어 각각 자기 동료를 죽이게 하였더니 그들이 서로 죽이기 시작하여 마침내 그들이 다 칼에 맞아 땅에서 멸망하였느니라.

    10. 그들의 조상들이 깨어 있었으나 그 후에 그들은 주님 앞에서 자기 길과 행위를 부패하게 한 모든 자들을 심판하는 큰 심판의 날까지 영원히 땅 깊은 곳에 결박되었느니라.

    11. 주님께서 그 곳에서 다 멸하시매 그 모든 악을 따라 심판하지 아니하신 자는 한 사람도 남지 아니하였느니라.

    12. 그리고 그는 그의 모든 일을 위하여 새롭고 의로운 성품을 만드셨습니다. 이는 그들이 영원히 죄를 짓지 않게 하시고, 모두가 그 종류대로, 항상 의롭게 되도록 하신 것입니다.

    13. 이 모든 것은 하늘 판에 정하여 기록된 것이니, 자기가 행하도록 정해진 길에서 떠나는 사람에게는 불의가 없느니라.

    14. 만일 그들이 그리로 행하지 아니하면 모든 피조물과 모든 종류에 대한 심판이 기록되어 있느니라 그리고 하늘에나 땅에나 빛에나 어두움에나 스올에나 깊은 데에나 어두운 곳에 아무 것도 없으나 모든 것이 정해져 있고 기록되고 새겨져 있느니라.

    15. 그분은 모든 일에 있어서 큰 사람을 그 위대함대로 심판하시고 작은 사람을 그 작은 대로 심판하시며 각 사람을 그 행위대로 심판하실 것입니다.

    16. 하나님은 사람을 외모로 취하는 분이 아니시고 선물을 받는 분이 아니십니다. 사람이 땅에 있는 모든 것을 드린다 할지라도 그는 외모를 보지 아니하시며 받으시지도 아니하시며 그의 손에서 흔들리지 아니하시리니 그는 의로운 재판관이심이라.

    17. 또 이스라엘 자손에 대하여 기록되고 정하였나니 만일 그들이 의로 하나님께로 돌이키면 주님께서 그들의 모든 죄과를 사하시며 그들의 모든 죄를 사하시리라 하였느니라

    18. 그는 모든 죄에서 돌아서는 모든 사람에게 매년 한 번씩 자비를 베푸시겠다고 기록되고 정해졌습니다.

    19. 그러나 홍수 전에 자기 길과 계획을 부패하게 한 모든 자들에 대하여 노아만 제외하고는 아무도 차별을 받지 아니하였느니라. 그 아들들을 인하여 그에게 은총을 입으셨으니 이는 하나님이 그를 인하여 그들을 홍수에서 구원하신 것이라 그 마음이 모든 일에 의로워서 명령하신 대로 모든 일에 의로우며 자기를 위하여 정하신 모든 일에서 어기지 아니하였음이니라

    20. 주님께서 이르시되 육지에 있는 것은 다 멸하라, 곧 사람으로부터 가축과 들짐승과 공중의 새와 땅에 움직이는 모든 것까지 다 멸하라 하시니라

    21. 그리고 그분은 노아에게 명하여 홍수에서 구원을 받기 위해 방주를 지으라고 하셨습니다.

    22. 노아는 제오년의 제 이십칠 희년, 제오째 주일에 자기가 명령한 대로 방주를 만들었습니다.

    23. 그는 여섯째 해 둘째 달, 둘째 달 초승달에 들어가 열여섯째 날까지 이르렀다. 그와 우리가 그에게 데려온 모든 것을 방주 안으로 들어갔더니 주님께서 십칠일 저녁에 방주를 밖에서 닫으시니라

    24. 주님께서 하늘에 일곱 수문과 큰 깊음의 샘 어귀를 여시니 수효가 일곱이라 그 수문들이 사십 주 사십 밤 동안 하늘에서 물을 쏟아내시니라

    25. 그리고 깊은 샘들에서도 물이 솟아나서 온 세상이 물로 가득 차게 되었습니다.

    26. 그리고 물이 땅 위로 15큐빗이나 솟아올랐습니다. 물이 모든 높은 산 위로 솟아 오르매 방주가 땅에서 들려 물 위에 떴더라.

    27. 물이 다섯 달 백오십 일 동안 땅 위에 머물렀더라.

    28. 방주가 가서 아라랏 산 중 하나인 루발 꼭대기에 머물렀다.

    29. 그리고 넷째 달에 큰 깊음의 샘들이 닫히고 하늘의 수문들이 막혔습니다. 일곱째 달의 초승달에 땅의 깊은 곳의 모든 입구가 열리고 물이 낮은 곳으로 내려가기 시작하니라.

    30. 그리고 열째 달 초승달에 산들의 꼭대기들이 나타나고 첫째 달 초승달에 땅이 나타났습니다.

    31. 일곱째 해 다섯째 주에 물이 땅 위에서 사라졌습니다. 둘째 달 열이렛날에 땅이 말랐습니다.

    32[c][d][e][f][g][h]. 그리고 스물일곱째 날에 하나님이 방주를 여시고 짐승과 가축과 새와 움직이는 모든 것을 방주에서 내보내셨습니다.'
  to: '1. 사람의 자녀들이 땅 위에서 번성하기 시작하고 그들에게 딸들이 태어났을 때, 이 희년의 어느 해에 하나님의 천사들이 그 딸들을 보니, 그들은 보기에 아름다웠습니다. 그래서 천사들은 자신들이 택한 모든 여자 가운데서 아내들을 맞이했고, 그 여자들은 그들에게 자녀들을 낳아 주었으며, 그 자녀들은 거인들이었습니다.

    2. 그리고 땅 위에 무법이 더욱 심해졌으며, 모든 육체가 자기 길을 더럽혔습니다. 곧 사람에서 가축과 들짐승과 새와 땅 위에서 움직이는 모든 것에 이르기까지 그랬습니다. 그들 모두가 자기들의 길과 규례를 더럽혔고, 서로 잡아먹기 시작했습니다. 또 땅 위에 무법이 더욱 심해졌으며, 사람의 모든 자녀가 품은 생각과 모든 계획은 날마다 이처럼 악했습니다.

    3. 주님께서 땅을 보셨습니다. 보십시오, 땅은 황폐해졌고, 모든 육체는 자기 질서를 더럽혔으며, 땅 위에 있는 모든 이가 그분의 눈앞에서 악을 행했습니다.

    4. 그가 말씀하셨습니다. “내가 창조한 땅의 표면 위에 있는 사람과 모든 육체를 멸하겠습니다.”

    5. 그러나 노아만이 주의 눈앞에서 은총을 얻었습니다.

    6. 그리고 그분께서는 땅에 보내신 자신의 천사들에게 몹시 분노하셔서 그들의 모든 권세를 빼앗으셨으며, 그들을 땅의 깊은 곳에 묶으라고 우리에게 말씀하셨습니다. 보십시오, 그들은 그곳에 묶여 있고 분리되어 있습니다.

    7. 그들의 아들들에 관해서는, 그들이 칼에 맞아 쓰러지고 하늘 아래에서 제거되리라는 말이 그의 앞에서 나왔습니다.

    8. 그리고 그가 말씀하셨습니다. “내 영은 사람 위에 영원히 머물지 않을 것이다. 그들도 육체이기 때문이다. 그들의 날은 백이십 년이 될 것이다.”

    9. 그리고 그들 가운데에 칼을 보내어 각 사람이 자기 동료를 죽이게 하셨습니다. 그들은 서로를 죽이기 시작하여 모두 칼에 쓰러지고 마침내 땅에서 쓸려 없어졌습니다.

    10. 그들의 아버지들은 지켜보고 있었습니다. 이 일 뒤에 그들은 땅의 깊은 곳에 영원토록, 큰 심판의 날, 곧 주 앞에서 자기들의 길과 행위를 타락시킨 모든 자들에게 심판이 내려질 날까지 묶였습니다.

    11. 그는 그들을 모두 그들의 거처에서 멸하셨고, 그들 가운데 그들의 모든 악에 따라 심판을 받지 않은 채 남아 있던 사람은 하나도 없었습니다.

    12. 그분께서는 자신의 모든 피조물을 위하여 새롭고 의로운 본성을 만드셔서, 그들이 영원히 그들의 온 본성에서 죄를 짓지 않고, 모두가 각각 그 종류에 따라 모든 날 동안 의롭게 되게 하셨습니다.

    13. 그리고 이 모든 일은 하늘의 서판들에 정해지고 기록되었으며, 불의는 없습니다. 그리고 그들이 그 안에서 걸어가도록 정해진 길에서 벗어나는 모든 사람은—

    14. 그리고 그들이 그 길을 걷지 않으면, 모든 피조물과 모든 종류에 대한 심판이 기록되어 있습니다. 하늘에나 땅에나, 빛 가운데나 어둠 가운데나, 스올에나 깊음에나, 어둠의 장소에나 심판을 받지 않는 것은 하나도 없습니다. 그들 각자의 모든 심판은 정해져 있고, 기록되어 있고, 새겨져 있습니다.

    15. 모든 것에 관하여, 그는 큰 자는 그 큼에 따라, 작은 자는 그 작음에 따라, 각 사람은 자기 길에 따라 심판하실 것입니다.

    16. 그는 각 사람에게 심판을 내리겠다고 말씀하실 때에도 편파적으로 대하거나 뇌물을 받는 분이 아니십니다. 누가 땅 위에 있는 모든 것을 드린다 해도, 그는 편파적으로 대하거나 그것을 받지 않으실 것이며, 그의 손에서 아무것도 받지 않으실 것입니다. 그는 의로운 재판관이시기 때문입니다.

    17. 그리고 이스라엘 자손에 관하여는 이렇게 기록되고 정해졌습니다. 그들이 의롭게 그에게 돌아오면, 그는 그들의 모든 허물을 용서하시고 그들의 모든 죄를 사하실 것입니다.

    18. 자신의 모든 잘못에서 돌이키는 모든 이에게는 해마다 한 번씩 자비가 베풀어질 것이라고 기록되어 있으며 규정되어 있습니다.

    19. 그러나 대홍수 전에 자기들의 길과 계획을 더럽힌 모든 사람에게는 아무 호의도 베풀어지지 않았습니다. 오직 노아에게만 호의가 베풀어졌습니다. 그의 아들들을 위하여 그에게 호의가 베풀어졌고, 노아는 자신 때문에 대홍수의 물에서 그들을 구해 냈습니다. 그의 마음은 그에 관하여 명령된 대로 그의 모든 길에서 의로웠으며, 그에게 정해진 것 가운데 어느 것에서도 벗어나지 않았기 때문입니다.

    20. 주께서 마른 땅 위에 있는 모든 것, 곧 사람과 가축과 짐승과 하늘의 새와 땅에서 움직이는 모든 것을 멸하시겠다고 말씀하셨습니다.

    21. 그리고 그는 노아에게 자신을 위하여 방주를 만들어 홍수의 물에서 구원받도록 명령하셨습니다.

    22. 노아는 스물여섯 번째 희년의 다섯째 주, 다섯째 해에 하나님께서 그에게 명령하신 대로 모든 면에서 방주를 만들었습니다.

    23. 그는 그 여섯째 해에, 둘째 달, 그 둘째 달의 초하루부터 십육일까지 그 안으로 들어갔습니다. 그리고 그와 우리가 그에게 데려온 모든 것이 방주 안으로 들어갔고, 주께서 십칠일 저녁에 밖에서 그것을 닫으셨습니다.

    24. 그리고 주님께서 하늘의 일곱 홍수문과 큰 깊음의 샘들이 열린 곳들을 여셨습니다. 그것들은 모두 일곱 열린 곳이었습니다. 그리고 그 홍수문들은 사십 일과 사십 밤 동안 하늘에서 물을 쏟아냈습니다.

    25. 그리고 깊은 곳의 샘들도 온 세상이 물로 가득 찰 때까지 물을 솟아오르게 하였습니다.

    26. 물은 땅 위로 십오 규빗 높이 올라갔습니다. 물은 모든 높은 산 위로 높이 올라갔고, 방주는 땅에서 들어 올려져 물 위에서 떠다녔습니다.

    27. 물이 땅 위에 다섯 달, 곧 백오십 일 동안 머물러 있었습니다.

    28. 그리고 그 방주가 가서 아라랏 산들 가운데 하나인 루바르 꼭대기에 머물렀습니다.

    29. 넷째 달에 큰 깊음의 샘들이 닫혔고, 하늘의 창문들이 막혔습니다. 그리고 일곱째 달이 시작될 때에 땅의 깊은 곳들의 모든 입구가 열렸고, 물들이 아래의 깊은 곳으로 내려가기 시작했습니다.

    30. 그리고 열째 달의 초하루에 산꼭대기들이 드러났고, 첫째 달의 초하루에 땅이 드러났습니다.

