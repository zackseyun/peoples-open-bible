    issue: Construção pouco idiomática em «sereis para ele filhos».
    rationale: Embora reproduza formalmente o dativo grego, a formulação é pouco corrente em português moderno. O possessivo em «seus filhos» comunica a relação filial sem perda semântica relevante.
  - severity: low
    issue: Repetição desnecessária da preposição em «nos seus mandamentos, nos primeiros e nos últimos».
