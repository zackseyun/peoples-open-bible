id: ROM.2.13
reference: Romans 2:13
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
translation:
  text: For it is not the hearers of the law who are righteous before God, but the doers of the law who will be justified.
  philosophy: dynamic
lexical_decisions:
- source_word: ἀκροαταὶ
  chosen: hearers
  alternatives:
  - listeners
  lexicon: BDAG
  rationale: ‘Hearers’ best preserves the contrast with ‘doers’ and fits Paul’s rhetorical point about merely hearing the law versus acting on it.
- source_word: νόμου
  chosen: of the law
  alternatives:
  - of law
  lexicon: BDAG
  rationale: Although anarthrous in Greek, ‘the law’ is the most natural English rendering in this Pauline context and clearly signals the law under discussion without sounding unnatural.
- source_word: δίκαιοι
  chosen: righteous
  alternatives:
  - just
  lexicon: BDAG
  rationale: ‘Righteous’ is the clearest English equivalent in this context and fits established Pauline usage better than the less natural ‘just’ in contemporary English.
- source_word: παρὰ τῷ θεῷ
  chosen: before God
  alternatives:
  - in the sight of God
  - with God
  lexicon: BDAG
  rationale: ‘Before God’ is concise, natural, and accurately conveys standing in God’s judgment or evaluation.
- source_word: ποιηταὶ
  chosen: doers
  alternatives:
  - those who do
  - practicers
  lexicon: BDAG
  rationale: ‘Doers’ preserves the direct antithesis with ‘hearers’ and reflects the substantival force of the Greek succinctly.
- source_word: δικαιωθήσονται
  chosen: will be justified
  alternatives:
  - will be declared righteous
  - will be vindicated
  lexicon: BDAG
  rationale: ‘Will be justified’ is the most standard and precise rendering for the future passive of δικαιόω here. ‘Declared righteous’ is a helpful explanatory alternative, but ‘justified’ better preserves the term’s theological and lexical continuity in Romans.
