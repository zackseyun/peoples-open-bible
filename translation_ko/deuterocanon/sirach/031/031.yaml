lexical_decisions:
- source_word: שמע
  english_pob_choice: Listen
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으시오
  - 들으세요
  - 들어라
  lexicon: שמע
  rationale: 지혜 문학의 권면형 명령을 현대 합쇼체로 옮겨, 화자의 직접적 권고를 살렸습니다.
- source_word: וקח אמרי
  english_pob_choice: accept my words
  chosen_korean: 내 말을 받아들이십시오
  alternatives_korean:
  - 내 말을 받으십시오
  - 내 말을 수용하십시오
  lexicon: לקח / אמרים
  rationale: אמרי를 단순한 정보가 아니라 화자의 권면으로서 ‘말’로 옮기고, 능동적 수용을 드러내는 ‘받아들이십시오’를 택했습니다.
- source_word: ואל תלעיז עליי
  english_pob_choice: do not reject me
  chosen_korean: 나를 거절하지 마십시오
  alternatives_korean:
  - 나를 업신여기지 마십시오
  - 나를 조롱하지 마십시오
  lexicon: תלעיז
  rationale: English POB의 도식에 맞추되, 히브리어의 반응 거부·경멸 가능성을 모두 담을 수 있는 가장 직접적인 표현으로 옮겼습니다.
- source_word: ובאחרית
  english_pob_choice: in the end
  chosen_korean: 끝에 가서
  alternatives_korean:
  - 마침내
  - 결국
  lexicon: אחרית
  rationale: 결론 시점을 자연스러운 한국어 시간 표현으로 풀어, 종결의 뉘앙스를 유지했습니다.
