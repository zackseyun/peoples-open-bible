translation:
  language: en
  text: For after I turned away[b], I was sorry for what I had done[a]. When I was made to understand, I struck my thigh. I was ashamed and humiliated because I carried the disgrace of my youth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Retain after I turned away, I was sorry for what I had done. Preserve after I turned back as an alternative and disclose that for what I had done is contextual clarification.
    reason: lexical_alternative
  - marker: b
    text: '"After I turned away": alternatively, "after I turned back."'
    reason: lexical_alternative
