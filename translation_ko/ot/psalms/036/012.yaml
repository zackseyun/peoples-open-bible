  text: 거기에서 악을 행하는 자들이 쓰러졌습니다. 그들은 내던져져 다시 일어설 수 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תְּבוֹאֵנִי
  english_pob_choice: Let not ... come against me
  chosen_korean: 내게 닿지 못하게 하시고
  alternatives_korean:
  - 내게 오지 못하게 하시고
  - 내게 닥치지 못하게 하시고
  - 내게 다가오지 못하게 하시고
  lexicon: WLC / HALOT
  rationale: 히브리어 בוא는 문자적으로 ‘오다’이지만, 여기서는 ‘교만의 발’이 해를 끼치러 오는 이미지이므로 한국어에서는 위협적 접촉을 자연스럽게 드러내는 표현이 적절합니다.
- source_word: רֶגֶל גַּאֲוָה
  english_pob_choice: the foot of pride
  chosen_korean: 교만의 발
  alternatives_korean:
  - 교만한 자의 발
  - 오만의 발
  - 거만의 발
  lexicon: WLC / HALOT
  rationale: 히브리어의 ‘발 + 추상명사’ 구조를 살려 이미지와 시적 긴장을 보존했습니다. ‘교만한 자’로 옮기면 비유가 사람 지칭으로 바뀝니다.
- source_word: יַד רְשָׁעִים
  english_pob_choice: the hand of the wicked
  chosen_korean: 악인의 손
  alternatives_korean:
  - 악한 자들의 손
  - 악한 이들의 손
  - 불의한 자들의 손
  lexicon: WLC / HALOT
  rationale: ‘손’은 능력·행위의 비유로 유지하고, רְשָׁעִים은 문맥상 집단을 가리키는 ‘악인’으로 옮겼습니다.
- source_word: תְּנִדֵנִי
  english_pob_choice: drive me away
  chosen_korean: 나를 쫓아내지 못하게 하소서
  alternatives_korean:
  - 나를 몰아내지 못하게 하소서
  - 나를 내쫓지 못하게 하소서
  - 나를 떠밀어 내지 못하게 하소서
  lexicon: WLC / HALOT
  rationale: Hiphil נדד/נוד의 ‘흩어지게 하다, 떠돌게 하다, 몰아내다’의 강제적 이동 뉘앙스를 살리되, 한국어에서는 ‘쫓아내다’가 가장 응축된 대응입니다.
- source_word: אַל
  english_pob_choice: Let not
  chosen_korean: -지 못하게 하소서
  alternatives_korean:
  - -하지 못하게 하소서
  - -지 않게 하소서
  - -하지 말게 하소서
  lexicon: WLC / HALOT
  rationale: 시편의 간구형 부정 명령을 현대 한국어 기도체로 옮겨, 간청의 높임말을 유지했습니다.
theological_decisions:
- issue: 시적 병행과 위협 이미지의 보존
  chosen_reading: ‘교만의 발’과 ‘악인의 손’을 각각 이미지로 살리고, 두 구를 같은 간구형으로 맞췄습니다.
  alternative_readings:
  - 의인화된 표현을 풀어 ‘교만한 사람들’과 ‘악한 사람들’로 옮길 수 있음
  - 두 번째 절을 단순히 ‘해하지 못하게’로 일반화할 수 있음
  rationale: 본문은 추상명사와 신체 은유를 통해 위협의 성격을 강조하므로, 이를 평탄화하지 않고 병행 구조를 유지하는 편이 원문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 시편 36편의 시적 수사와 보호 간구
