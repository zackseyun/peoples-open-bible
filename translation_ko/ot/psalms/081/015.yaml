base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/015.yaml
  text: Those who hate Yahweh would pretend to submit to him[a], and their time would last forever[b].
  footnotes:
  - marker: a
    text: Or 'Soon I would subdue their enemies.' The Hebrew כִּמְעַט can express nearness in time ('soon') or, less likely here, 'almost.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'I would turn back my hand upon their adversaries,' an idiom for directing power in judgment against them.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와를 미워하는 자들은 그분에게 굴복하는 체할 것이며,[a] 그들의 때는 영원할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘굴복하는 체할 것이다’는 히브리어 כחשׁ의 문맥상 뜻을 따른 것입니다. ‘그분에게 거짓으로 복종할 것이다’, ‘그분 앞에서 비굴하게 굴복할 것이다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 때는 영원히’입니다. ‘때’는 그들에게 정해진 기간, 운명, 또는 형벌의 기간을 가리킬 수 있으나, 본문은 이를 더 구체적으로 한정하지 않습니다.
    reason: alternative_reading
