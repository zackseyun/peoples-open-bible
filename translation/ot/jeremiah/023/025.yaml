  rationale: The Hebrew permits either an object-like noun ('lies') or an adverbial sense ('falsely'). The chosen rendering preserves the concrete force of שקר while clearly indicating that they falsely invoke YHWH's authority. No doctrinal tension is created or resolved beyond the text.
