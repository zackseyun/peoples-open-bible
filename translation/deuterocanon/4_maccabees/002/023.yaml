  meaning_decisions:
  - source_phrase: καὶ τούτῳ νόμον ἔδωκεν
    prior_rendering: And to him he gave a law
    new_rendering: And he gave the mind a law
    rationale: The most immediate antecedent is the mind just enthroned as ruler. Naming it maintains the passage’s governing metaphor rather than suggesting an otherwise unidentified earthly king.
  - source_phrase: καθʼ ὃν πολιτευόμενος
    prior_rendering: according to which, by conducting himself as a citizen
    new_rendering: so that by living according to that law
    rationale: The participle describes ordering one’s life under a law. The natural English carries that sense without implying literal citizenship, while the note preserves the civic imagery.
  - source_phrase: βασιλεύσειε βασιλείαν σώφρονά τε καὶ δικαίαν καὶ ἀγαθὴν καὶ ἀνδρείαν
    prior_rendering: he would rule a kingdom that was self-controlled and just and good and courageous
    new_rendering: it might reign with self-control, justice, goodness, and courage
    rationale: The cognate construction can describe the character of the reign itself. This reading continues the mind’s royal government of human life, preserves all four virtues, and retains 'kingdom' as a serious alternative.
  footnote_kinds:
    a: literal_wording
    b: alternative_meaning
