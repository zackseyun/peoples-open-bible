  validation: no_reference
translation:
  text: in hiding behind Jonathan’s men. Jonathan realized that an ambush lay
  philosophy: dynamic
lexical_decisions:
- source_word: κρυπτῶς
  chosen: secretly
  alternatives:
  - in secret
  - stealthily
  lexicon: LSJ
  rationale: Adverb meaning covertly or in a hidden manner. 'Secretly' is natural modern English and preserves the clandestine sense.
- source_word: κατόπισθεν
  chosen: behind
  alternatives:
  - after
  - at the rear of
  lexicon: LSJ
  rationale: Spatial adverb/preposition meaning behind or in the rear. In this military context, 'behind' best fits the immediate sense.
- source_word: αὐτῶν
  chosen: them
  alternatives:
  - him
  lexicon: Greek grammar
  rationale: Genitive plural pronoun; the surviving clause points to a plural referent, so 'them' is required.
- source_word: ἔγνω
  chosen: knew
  alternatives:
  - recognized
  - found out
  lexicon: LSJ
  rationale: Aorist of γινώσκω. 'Knew' is the most direct rendering; 'recognized' or 'found out' are possible contextual expansions but less literal.
- source_word: ἔνεδρον
  chosen: an ambush
  alternatives:
  - an ambush party
  - a trap
  lexicon: LSJ
  rationale: Military term for an ambush or those lying in wait. 'An ambush' is concise and idiomatic in English, while still allowing the military sense.
