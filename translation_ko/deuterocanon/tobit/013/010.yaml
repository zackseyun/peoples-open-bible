  verdict: revise
  source_fidelity: 개정이 필요합니다. ἀγαθῶς는 여기서 ‘선하게’보다 ‘합당하게/마땅히’라는 예배 행위의 적절성을 나타내므로, ‘선하게 감사하고’는 한국어 의미와 용법 모두에서 부정확합니다. 또한 ἵνα 이하의 목적 구조는 단순 미래 진술보다 목적을 드러내야 합니다. ‘만대의 왕’은 ‘왕이신 만대의 왕’이라는 중복 없이 옮길 수 있습니다.
  naturalness: ‘야훼께 선하게 감사하고’와 ‘왕이신 만대의 왕’은 현대 표준 한국어의 자연스러운 예배 언어가 아닙니다. ‘야훼께 마땅히 감사드리고, 만세의 왕을 찬송하십시오’가 자연스럽고 격식 있는 합쇼체입니다. 원문의 단수 σοι 및 ἐν σοί는 번역에서 유지하되, 지시 대상이 공동체/도시일 가능성을 본문에서 과도하게 해설하지 않습니다.
  terminology: κύριος는 초안의 방침에 따라 ‘야훼’로 유지합니다. σκηνή는 성전으로 한정하지 않는 ‘장막’으로, αἰχμάλωτοι와 ταλαιπώροι는 각각 ‘포로들’과 ‘고난받는 이들’로 유지합니다. τῶν αἰώνων은 관용적이면서도 시대의 지속성을 담는 ‘만세의’로 옮깁니다.
