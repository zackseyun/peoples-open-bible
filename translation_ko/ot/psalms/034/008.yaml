  text: Taste and see that Yahweh is good; blessed is the man[a] who takes refuge in him.
  footnotes:
  - marker: a
    text: Hebrew “the man”; the masculine singular is used representatively for anyone who takes refuge in Yahweh.
    reason: lexical_alternative
translation:
  language: ko
  text: 맛보고 보십시오. 야훼께서 선하십니다. 그에게 피하는 사람은 복됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 남자’라는 남성 단수형을 사용하지만, 여기서는 야훼께 피하는 모든 사람을 대표하여 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹנֶה
  english_pob_choice: encamps
  chosen_korean: 진을 치고
  alternatives_korean:
  - 캠프를 치고
  - 머물고
  - 둘러 진을 치고
  lexicon: HALOT
  rationale: חנה의 군사적·보호적 이미지를 살리기 위해 ‘진을 치고’로 옮겼습니다. ‘머물고’는 평면적이고, ‘둘러 진을 치고’는 의미를 반복합니다.
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 초월적 존재인 ‘천사’로 보는 것이 자연스럽고, יְהוָה는 본문 취지에 따라 고유명사 ‘야훼’로 옮겼습니다.
- source_word: לִירֵאָיו
  english_pob_choice: those who fear him
  chosen_korean: 그를 경외하는 이들
  alternatives_korean:
  - 그를 두려워하는 자들
  - 그를 공경하는 이들
  lexicon: HALOT
  rationale: 히브리어 관용구의 언약적·경건적 뉘앙스를 살리면서도 현대 한국어에서 자연스럽게 들리도록 ‘경외하는’으로 옮겼습니다.
- source_word: וַיְחַלְּצֵם
  english_pob_choice: and rescues them
  chosen_korean: 그들을 건져냅니다
  alternatives_korean:
  - 그들을 구해냅니다
  - 그들을 구출합니다
  - 그들을 건집니다
  lexicon: HALOT
  rationale: חלץ는 ‘빼내다/구해내다/건져내다’의 뜻이므로, 위험에서 건져내는 구출 이미지를 살리는 ‘건져냅니다’를 택했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 본절의 신성명을 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 판본의 원칙에 따라 하나님의 이름을 존칭 대체어로 바꾸지 않고 고유명사로 보존했습니다.
  doctrine_reference: 신성명 보존 원칙
- issue: מַלְאַךְ יְהוָה의 존재를 어떻게 규정할지
  chosen_reading: 천사의 정체를 더 특정하지 않고 본문이 말하는 범위 안에서만 옮겼습니다.
  alternative_readings:
  - 야훼의 사자
  - 현현/그리스도 현현
  rationale: 본문은 보호와 구원의 행위를 말할 뿐, 정체를 해명하지 않으므로 해석을 과도하게 밀어 넣지 않았습니다.
  doctrine_reference: 해석상의 긴장 보존
