id: PSA.68.25
reference: Psalms 68:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קִדְּמ֣וּ שָׁ֭רִים אַחַ֣ר נֹגְנִ֑ים בְּ/ת֥וֹךְ עֲ֝לָמ֗וֹת תּוֹפֵפֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/025.yaml
  text: The singers went before[a], the musicians after[b], in the midst of young women beating tambourines.
  footnotes:
  - marker: a
    text: Or 'The singers preceded, the players followed; among them were young women playing tambourines.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew עֲלָמוֹת refers to young women; some English versions render it 'maidens' or 'virgins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 노래하는 이들이 앞서가고, 악기를 연주하는 이들이 뒤따르며, 그 가운데에서 젊은 여성들이 소고를 치고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאוּ
  english_pob_choice: They have seen
  chosen_korean: 보았습니다
  alternatives_korean:
  - 보았습니다
  - 보았습니까
  lexicon: HALOT
  rationale: 완료된 목격을 나타내는 동사로, 시의 서술적 뉘앙스를 살려 현대 한국어의 자연스러운 완료형으로 옮겼습니다.
- source_word: הֲלִיכוֹתֶיךָ / הֲלִיכוֹת
  english_pob_choice: your processions / the processions
  chosen_korean: 행렬들
  alternatives_korean:
  - 행진들
  - 걸음들
  - 행차들
  lexicon: HALOT
  rationale: 반복되는 복수 명사와 예배적·공적 이동의 맥락을 살려, 단순한 ‘걸음’보다 의례적 이동을 드러내는 ‘행렬들’로 번역했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 하나님이시여
  alternatives_korean:
  - 오 하나님
  - 하나님이여
  lexicon: HALOT
  rationale: 직접 호격을 한국어 예배체로 자연스럽게 드러내기 위해 호격 종결을 사용했으며, 시적 직접호출의 강도를 보존했습니다.
- source_word: בַקֹּדֶשׁ
  english_pob_choice: into the sanctuary
  chosen_korean: 성소로 들어가는 것을
  alternatives_korean:
  - 성소 안에서
  - 거룩함 안에서
  - 성소에
  lexicon: HALOT
  rationale: 문맥상 단순한 상태표현보다 목적지/방향성이 더 분명하므로, 행렬이 성소로 향하는 장면을 드러내는 방향 표현으로 옮겼습니다.
theological_decisions:
- issue: 복수형 הֲלִיכוֹת의 의미를 어떻게 살릴지
  chosen_reading: 하나님의 의례적 행렬들이 목격되었다는 시적·예배적 묘사로 읽었습니다.
  alternative_readings:
  - ‘주의 걸음들’처럼 더 추상적인 ‘가는 길’로 읽을 수 있습니다.
  - ‘거룩함 가운데서’라는 상태 묘사로 볼 수도 있습니다.
  rationale: 반복되는 복수형과 문맥의 공적 행렬 이미지가 단순한 추상적 ‘길’보다 의례적 이동을 더 강하게 가리키므로, 그 의미를 한국어에서도 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §3, §5
