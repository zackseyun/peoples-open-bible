  lexicon: HALOT
  rationale: 히필형 סגר는 적대자의 지배 아래로 ‘넘겨주다/내주다’는 뜻이므로, 한국어에서는 관계와 권세의 이동을 자연스럽게 드러내는 ‘넘기다’로 옮겼습니다.
- source_word: בְּיַד
