id: JOB.19.24
reference: Job 19:24
source:
  edition: WLC
  text: בְּ/עֵט בַּרְזֶ֥ל וְ/עֹפָ֑רֶת לָ֝/עַ֗ד בַּ/צּ֥וּר יֵחָצְבֽוּ/ן־׃
translation:
  text: With an iron stylus and lead[a], may they be engraved in the rock forever!
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Lead may have been used to fill the carved letters and make them visible.
    reason: cultural_note
lexical_decisions:
- source_word: בְּעֵט
  chosen: with a stylus
  alternatives:
  - with a pen
  - with a graving tool
  lexicon: HALOT
  rationale: עֵט denotes a writing or engraving instrument. In this context, paired with iron and rock, an engraving tool is in view rather than an ink pen. 'Stylus' preserves the writing-image while fitting inscriptional usage.
- source_word: בַּרְזֶל
  chosen: iron
  lexicon: HALOT
  rationale: Straightforward material term; 'iron' specifies the stylus's substance.
- source_word: וְעֹפָרֶת
  chosen: and lead
  lexicon: HALOT
  rationale: עֹפָרֶת is the metal lead. In inscription contexts it may refer to lead used with engraving, possibly to fill incised letters, but the text itself simply names the material, so 'and lead' is retained.
- source_word: לָעַד
  chosen: forever
  alternatives:
  - for ever
  - perpetually
  lexicon: HALOT
  rationale: The term expresses enduring permanence. 'Forever' is idiomatic modern English and matches the wish for a lasting inscription.
- source_word: בַּצּוּר
  chosen: in the rock
  alternatives:
  - on the rock
  - in stone
  lexicon: HALOT
  rationale: צוּר commonly means rock/crag. With the passive/reflexive engraving verb, English idiom favors 'engraved in the rock,' conveying inscription cut into stone. 'Rock' is more specific to the Hebrew than the broader 'stone.'
- source_word: יֵחָצְבוּן
  chosen: may they be engraved
  alternatives:
  - let them be hewn
  - may they be inscribed
  lexicon: HALOT
  rationale: From חצב, 'to hew/cut.' In context of words being recorded permanently in rock, the sense is that the words are cut/engraved. The imperfect here is jussive-like in the wish sequence begun in the previous verse, so 'may they be engraved' best captures both sense and mood.
