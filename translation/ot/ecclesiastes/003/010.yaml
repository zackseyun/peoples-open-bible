id: ECC.3.10
reference: Ecclesiastes 3:10
source:
  edition: WLC
  text: רָאִ֣יתִי אֶת הָֽ/עִנְיָ֗ן אֲשֶׁ֨ר נָתַ֧ן אֱלֹהִ֛ים לִ/בְנֵ֥י הָ/אָדָ֖ם לַ/עֲנ֥וֹת בּֽ/וֹ־׃
translation:
  text: I have seen the task God has given humanity to keep them occupied[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “to burden them.”
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  chosen: I have seen
  alternatives:
  - I saw
  lexicon: HALOT
  rationale: Qal perfect 1cs of ראה. In Ecclesiastes, the speaker often reports reflective observation; English present perfect captures the ongoing relevance of what has been observed, while remaining close to the Hebrew perfect.
- source_word: הָעִנְיָן
  chosen: the task
  alternatives:
  - the business
  - the occupation
  - the travail
  lexicon: HALOT
  rationale: עִנְיָן in Ecclesiastes commonly denotes an assigned matter, occupation, or task rather than merely an abstract 'affair.' 'Task' is concise, natural English and fits the idea of something given by God for humans to engage in.
- source_word: אֲשֶׁר נָתַן
  chosen: that ... has given
  alternatives:
  - which ... gave
  lexicon: HALOT
  rationale: Relative clause introducing the content of the observed matter. Present perfect in English matches the reflective tone and links naturally with 'I have seen.'
- source_word: אֱלֹהִים
  chosen: God
  lexicon: HALOT
  rationale: Standard rendering for אֱלֹהִים here, referring to the one true God in Qoheleth.
- source_word: לִבְנֵי הָאָדָם
  chosen: humanity
  alternatives:
  - to the children of man
  - to humankind
  - to mankind
  lexicon: HALOT
  rationale: The construct phrase has collective reference to human beings; “humanity” is its natural English equivalent here.
- source_word: הָאָדָם
  chosen: humanity
  alternatives:
  - humankind
  lexicon: HALOT
  rationale: אָדָם is collective in this idiom, referring to humankind rather than to an individual male.
- source_word: לַעֲנוֹת בּוֹ
  chosen: to be occupied with
  alternatives:
  - to be afflicted by it
  - to labor in it
  - to exercise themselves in it
  lexicon: HALOT
  rationale: The infinitive of ענה with ב can carry the sense of being occupied, busied, or exercised with something in this context. Given Ecclesiastes' theme of burdensome human activity, 'to be occupied with' preserves the experiential sense without overcommitting to the stronger 'afflicted' reading in the main text.
