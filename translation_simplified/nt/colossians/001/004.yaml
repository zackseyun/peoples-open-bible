simplification_decisions:
- pob_phrase: having heard of
  simplified_phrase: We have heard about
  preserved_meaning: Paul and his companions learned of the Colossians' faith and love through a report.
  reasoning_layer_used: lexical decision for ἀκούσαντες and the implied subject from the previous verse
  rationale: A complete English clause is clearer while preserving the participle's reported basis for thanksgiving.
- pob_phrase: the love that you have for
  simplified_phrase: your love for
  preserved_meaning: The readers presently show love toward the whole group named.
  reasoning_layer_used: lexical decisions for ἀγάπην and ἣν ἔχετε
  rationale: The possessive wording expresses the same relationship without a heavy relative clause.
- pob_phrase: all the saints
  simplified_phrase: all God's holy people
  preserved_meaning: The love extends to all believers identified as holy to God.
  reasoning_layer_used: lexical alternative for εἰς πάντας τοὺς ἁγίους
  rationale: This avoids the common misunderstanding that “saints” means only an exceptional class of Christians.
translation_notes:
  risk_flags:
  - risk: Turning the opening participle into a full clause makes its grammatical link to the preceding thanksgiving less visible.
    mitigation: “We have heard” retains the implied speakers and the report that prompted their thanksgiving.
  - risk: “God's holy people” does not preserve “saints” as the project's usual key term.
    mitigation: It uses the POB's documented lexical alternative and preserves the designation's holy-community sense.
