translation:
  text: '“These measures will reveal all the hidden things in the depth of the earth: those who perished in the
    wilderness, those devoured by wild beasts and those devoured by the fish of the sea, so that they may return
    and find support on the day of the chosen one. Nothing perishes before the Lord of Spirits, and nothing can
    perish.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The lost people in wilderness, those eaten by wild beasts and those eaten by sea fish are all retained.
      Return and leaning are distinct verbs. Both final denials of perishing remain; the source is not changed into
      a claim that the listed deaths never occurred.
    reason: lexical_alternative
