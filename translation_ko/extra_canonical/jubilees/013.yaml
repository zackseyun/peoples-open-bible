  to: '15. 파라오가 사래, 곧 아브람의 아내를 내보내고 그를 이집트 땅에서 쫓아냈습니다. 그는 처음에 장막을 쳤던 곳, 곧 서쪽에는 벧엘이 있고 동쪽에는 아이가 있는 제단의 자리로 갔습니다. 그리고 그는 자기를 평안히 돌아오게 하신 그의 하나님이신 주님을 찬양했습니다.

    16. 그리고 제41 희년 첫째 주의 셋째 해에, 그는 이곳으로 돌아와 그 위에 희생 제물을 바치고 야훼의 이름을 불렀습니다.

    17. 그리고 그가 말했습니다. “당신은 지극히 높으신 하나님, 영원히 영원토록 제 하나님이십니다.” 그리고 이 주간의 일곱째 해에 롯은 그에게서 갈라져 나왔고, 소돔에 살게 되었습니다. 소돔 사람들은 매우 죄가 많았습니다.

    18. 그의 형제의 아들이 그에게서 떼어져 나가게 된 것이 그의 마음을 괴롭게 하였습니다. 이는 그에게 자녀가 없었기 때문입니다.

    19. 롯이 사로잡혔던 그 해, 롯이 아브람에게서 떠난 뒤, 이 주간의 넷째 해에 주님께서 아브람에게 말씀하셨습니다. “네가 거주하고 있는 곳에서 눈을 들어 북쪽과 남쪽과 서쪽과 동쪽을 바라보십시오,

    20. 네가 보는 모든 땅을 내가 너와 네 자손에게 영원히 주겠습니다. 또 내가 네 자손을 바다의 모래처럼 많게 하겠습니다. 사람이 땅의 티끌을 셀 수 있다면, 네 자손도

