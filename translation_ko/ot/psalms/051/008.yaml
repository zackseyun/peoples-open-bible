  text: 우슬초로 저를 정결하게 하소서. 그러면 제가 깨끗해지겠습니다. 저를 씻어 주소서. 그러면 제가 눈보다 더 희어지겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
