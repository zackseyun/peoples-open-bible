id: NAM.3.11
reference: Nahum 3:11
source:
  edition: WLC
  text: גַּם אַ֣תְּ תִּשְׁכְּרִ֔י תְּהִ֖י נַֽעֲלָמָ֑ה גַּם אַ֛תְּ תְּבַקְשִׁ֥י מָע֖וֹז מֵ/אוֹיֵֽב־־׃
translation:
  text: You too will become drunk[b]; you will be hidden. You too will seek a refuge[a] from the enemy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'You too will seek a stronghold from the enemy.'
    reason: lexical_alternative
  - marker: b
    text: '''Become drunk'' likely continues prophetic imagery of being overwhelmed and reeling under judgment, not merely literal intoxication.'
    reason: cultural_note
  - marker: c
    text: 'The Masoretic wording is retained provisionally. The quotation in the Nahum commentary (4Q169, fragments 3–4, iv 7) adds בעיר to the refuge phrase: approximately ''seek a refuge in a city from the enemy.'' Its opening verb is supplied, and ''in the city'' is also possible. Inherited wording or adaptation for the commentary remain possible. The words for ''refuge from the enemy'' in the Murabba''at scroll are supplied, so that scroll does not attest omission of the city.'
    reason: textual_variant
lexical_decisions:
- source_word: תִּשְׁכְּרִי
  chosen: will become drunk
  alternatives:
  - will be drunk
  - will be intoxicated
  lexicon: HALOT
  rationale: The Qal imperfect of שׁכר commonly means to become drunk/intoxicated. In prophetic judgment language it can be metaphorical for staggering under divine wrath, but the verse itself does not explicitly mention wrath here, so the main text keeps the concrete image 'become drunk' and lets the context carry the metaphorical force.
- source_word: תְּהִי נַעֲלָמָה
  chosen: you will be hidden
  alternatives:
  - you will be concealed
  - you will disappear
  lexicon: HALOT
  rationale: The construction with היה + passive participle/niphal-like form from עלם conveys coming into a state of being hidden or concealed. 'You will be hidden' is a natural English rendering that preserves the passive/resultative sense. 'Disappear' is possible interpretively, but less transparent to the Hebrew form.
- source_word: תְּבַקְשִׁי
  chosen: will seek
  alternatives:
  - will look for
  lexicon: HALOT
  rationale: בקש in the Piel commonly means seek, look for, or attempt to obtain. 'Seek' is the standard concise rendering and fits the elevated prophetic tone.
- source_word: מָעוֹז
  chosen: a refuge
  alternatives:
  - a stronghold
  - protection
  - fortress
  lexicon: HALOT
  rationale: Under the provisionally retained Masoretic wording, מָעוֹז denotes a place or means of safety/strength; 'a refuge' expresses the functional sense. 'Stronghold' remains an English lexical alternative in note a. The city expression in the 4Q169 quotation is a separate source alternative disclosed in note c, not another meaning of this noun. Source priority and whole-verse English optimality remain unresolved.
- source_word: מֵאוֹיֵב
  chosen: from the enemy
  alternatives:
  - because of the enemy
  - against the enemy
  lexicon: HALOT
  rationale: 'The preposition מִן with אוֹיֵב is most naturally taken as separation/protection: refuge from the enemy. This fits the context of seeking safety under threat.'
- source_word: גַּם אַתְּ
  chosen: You too
  alternatives:
  - Also you
  - Even you
  lexicon: HALOT
  rationale: The repeated phrase emphasizes that Nineveh, like No-amon before her, will suffer the same fate. 'You too' is idiomatic and preserves the rhetorical force of comparison and inevitability.
