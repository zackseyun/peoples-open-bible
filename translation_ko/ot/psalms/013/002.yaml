  rationale: 본문을 WLC 시편 13:2에 맞게 전면 교체했습니다. אָשִׁית עֵצוֹת בְּנַפְשִׁי는 지속되는 내적 숙고의 부담을 드러내도록 ‘제 속으로 계획들을 세우며’로, יָגוֹן בִּלְבָבִי יוֹמָם은 ‘날마다 제 마음에 슬픔을 품어야 합니까?’로 옮겼습니다. יָרוּם אֹיְבִי עָלָי는 원수의 우월함이라는 원이미지를 보존하여 ‘제 원수가 제 위로 높아지겠습니까?’로 번역했습니다. 다른 절에 속한 각주는 삭제했습니다.
