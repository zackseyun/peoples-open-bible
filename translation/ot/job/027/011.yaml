id: JOB.27.11
reference: Job 27:11
source:
  edition: WLC
  text: אוֹרֶ֣ה אֶתְ/כֶ֣ם בְּ/יַד אֵ֑ל אֲשֶׁ֥ר עִם שַׁ֝דַּ֗י לֹ֣א אֲכַחֵֽד־־׃
translation:
  text: I will teach you about the work of God's hand; I will not hide the ways of the Almighty[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “what is with the Almighty.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹרֶה
  chosen: I will teach
  alternatives:
  - I will instruct
  - let me teach
  lexicon: HALOT
  rationale: Hiphil imperfect 1cs of ירה in instructional sense. Future-like 'I will teach' fits Job's declaration to his hearers.
- source_word: אֶתְכֶם
  chosen: you
  rationale: Direct object pronoun, second person masculine plural, naturally rendered 'you' in English.
- source_word: בְּיַד אֵל
  chosen: about God's hand
  alternatives:
  - concerning God's hand
  - by the hand of God
  lexicon: HALOT
  rationale: The phrase identifies the subject of Job's instruction; this preserves the hand image in idiomatic English.
- source_word: אֵל
  chosen: God
  alternatives:
  - Mighty God
  lexicon: HALOT
  rationale: El here functions as a divine title/name. 'God' is the clearest standard English rendering in context.
- source_word: אֲשֶׁר עִם שַׁדַּי
  chosen: what is with the Almighty
  alternatives:
  - what belongs to the Almighty
  - what is from the Almighty
  - that which is with the Almighty
  lexicon: HALOT
  rationale: The Hebrew remains deliberately broad and elliptical.
- source_word: שַׁדַּי
  chosen: the Almighty
  lexicon: HALOT
  rationale: Standard rendering of the divine title שדי in Job; readable and conventional without loss of meaning.
- source_word: לֹא אֲכַחֵד
  chosen: I will not hide
  alternatives:
  - I will not conceal
  - I will not deny
  lexicon: HALOT
  rationale: Piel imperfect of כחד commonly means conceal or hide. 'Hide' is concise and natural; 'deny' is less likely in this context of declaring knowledge.
