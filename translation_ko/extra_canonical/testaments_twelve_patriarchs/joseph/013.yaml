review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 특히 3절의 원문은 파엔/펜테프리스가 단지 질문하는 것으로, 그가 중개인에게 ‘달려들었다’는 영어 POB의 표현은 그리스어 본문에 없습니다. 또한 1절 ψυχάς는 이 매매 맥락에서 한국어 ‘영혼들’보다 ‘사람들’을 뜻하며, 9절 κἀμέ는 ‘그도’가 아니라 ‘나도/나 역시’를 뜻합니다.
  naturalness: 현대 표준어 합쇼체에 맞추어 서술을 자연스럽게 정리했습니다. 심문 장면의 위계는 유지하되, ‘주여’처럼 현대 한국어에서 신적 호칭으로 우선 읽히기 쉬운 표현은 ‘주인님’으로 바꾸었습니다.
  terminology: Πεντεφρίς/Πεντεφρής는 영어 POB의 Pentephris 및 그리스어 음가에 맞추어 ‘펜테프리스’로 일관되게 옮겼습니다. δοῦλος는 법적 예속 신분을 가리키므로 ‘노예’로 통일했고, μετάβολος는 ‘중개인’으로 유지했습니다.
  issues:
  - severity: high
    issue: 3절에 ‘파엔페리스가 그에게 말했습니다’라고 되어 있어 영어 POB의 ‘fell upon him’ 오류는 반복하지 않았지만, ‘이 히브리인 종이 내 앞에서’는 그리스어에 없는 첨가입니다.
    rationale: 원문은 ‘그렇다면 그 히브리인 종은 어디서 왔느냐?’라고 묻습니다. ‘내 앞에서’는 삭제해야 합니다.
  - severity: high
    issue: 9절의 ‘그도 저를’은 κἀμέ의 의미를 잘못 반영합니다.
    rationale: κἀμέ는 ‘나 또한/나도’를 뜻하므로, 펜테프리스가 자신도 벌거벗긴 채 매질하라고 명령했다는 뜻이 아니라 요셉도 같은 처벌을 받게 되었다는 뜻입니다.
  - severity: medium
