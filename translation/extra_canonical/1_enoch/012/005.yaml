lexical_decisions:
- source_word: ኢይከውን
  chosen: there will be no
  alternatives:
  - there shall not be
  rationale: Preserves the negated future sense in natural modern English.
- source_word: ሎሙ
  chosen: for them
  rationale: Retains the stated recipients without expanding their identity in the
    verse.
- source_word: ሰላም
  chosen: peace
  alternatives:
  - well-being
  rationale: Keeps the direct term and its force in this judgment statement.
- source_word: ኅድገተ ኃጢአት
  chosen: forgiveness of sin
  alternatives:
  - remission of sin
  - forgiveness of sins
  rationale: Renders both nouns directly and retains the source’s singular ‘sin.’
theological_decisions:
- issue: Scope of the denial of peace and forgiveness
  chosen_reading: The denial applies to ‘them,’ the people addressed in the surrounding
    passage.
  alternative_readings:
  - A general statement that no sin can be forgiven
  rationale: The pronoun limits the statement; the verse does not warrant a universal
    doctrinal claim.
