  source_fidelity: 주된 문제는 אֲשֶׁר אָמַר אֲלֵיהֶם(‘그들에게 말씀하신’)이 초안에서 ‘그에게 말씀하시기를’으로 옮겨져, 수혜 대상이 복수에서 단수로 바뀌고 문장 구조도 어색해진 점입니다. 또한 הָנִיחוּ는 복수 명령으로, ‘지친 사람을 쉬게 하십시오’가 원문의 사역적 명령을 자연스럽게 반영합니다. 마지막 אָבוּא שְׁמוֹעַ은 ‘듣기를 원하지 않았다’라는 의지적 거부를 정확히 나타냅니다.
  naturalness: ‘그들에게 말씀하셨습니다’로 문장을 독립시키고 직접 인용으로 이어 가면 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘안식’과 ‘쉼’의 병렬은 지나친 해석을 더하지 않으면서 두 히브리어 명사의 반복·변주를 살립니다.
  terminology: מְנוּחָה는 ‘안식’, מַרְגֵּעָה는 ‘쉼’으로 옮겨 유사하지만 동일하지 않은 병렬을 보존했습니다. ‘평온’도 가능한 뜻이지만, 여기서는 제공되는 쉼의 선언 및 명령과 연결되는 ‘쉼’이 더 직접적입니다.
