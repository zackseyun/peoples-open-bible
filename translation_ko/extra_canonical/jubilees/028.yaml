    45. 야곱이 레아에게 들어갔고, 레아는 임신하여 아들을 낳았습니다. 레아는 그 아들의 이름을 잇사갈이라 불렀습니다. 넷째 날에.

    46. 다섯째 달, 넷째 주의 넷째 해에. 그리고 그녀는 그를 유모에게 맡겼습니다. 그리고 야곱은 다시 들어갔습니다.

    47. 그녀에게로 가서, 그녀가 임신하여 또 다른 아들과 딸을 낳았고, 그녀는 그 아들의 이름을 스불론이라 불렀습니다.

