id: 2KI.8.6
reference: 2 Kings 8:6
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֥ל הַ/מֶּ֛לֶךְ לָ/אִשָּׁ֖ה וַ/תְּסַפֶּר ל֑/וֹ וַ/יִּתֶּן לָ֣/הּ הַ/מֶּלֶךְ֩ סָרִ֨יס אֶחָ֜ד לֵ/אמֹ֗ר הָשֵׁ֤יב אֶת כָּל אֲשֶׁר לָ/הּ֙ וְ/אֵת֙ כָּל תְּבוּאֹ֣ת הַ/שָּׂדֶ֔ה מִ/יּ֛וֹם עָזְבָ֥ה אֶת הָ/אָ֖רֶץ וְ/עַד עָֽתָּה־־־־־־־־׃פ
translation:
  text: The king asked the woman, and she told him. Then the king appointed an official[a] for her, saying, “Restore everything that belongs to her, along with all the yield of the field from the day she left the land until now.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “a eunuch”; the Hebrew term can also denote a court official.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁאַל
  chosen: The king asked
  alternatives:
  - So the king asked
  lexicon: HALOT
  rationale: English names the continuing subject from context. The narrative conjunction does not require a sentence-initial 'So.'
- source_word: לָאִשָּׁה
  chosen: the woman
  alternatives:
  - the wife
  lexicon: HALOT
  rationale: אִשָּׁה can mean 'woman' or 'wife.' In this context it refers to the Shunammite woman already in view, not primarily her marital status, so 'the woman' is preferable.
- source_word: וַתְּסַפֶּר לוֹ
  chosen: she told him
  alternatives:
  - she recounted to him
  - she related it to him
  lexicon: HALOT
  rationale: ספר in the piel commonly means to recount or tell. 'She told him' is concise, idiomatic, and fits the narrative flow.
- source_word: וַיִּתֶּן לָהּ ... סָרִיס אֶחָד
  chosen: the king appointed an official for her
  alternatives:
  - the king assigned a court official to her
  - the king appointed a eunuch for her
  lexicon: HALOT
  rationale: The construction appoints one individual functionary to implement restitution; the indefinite numeral need not be rendered mechanically. The title's literal eunuch sense remains footnoted.
- source_word: לֵאמֹר
  chosen: saying
  alternatives:
  - with the order
  - commanding
  lexicon: HALOT
  rationale: The infinitive introduces direct speech in standard Hebrew narrative style. 'Saying' preserves the form naturally.
- source_word: הָשֵׁיב
  chosen: Restore
  alternatives:
  - Return
  - Give back
  lexicon: HALOT
  rationale: The hiphil imperative of שוב here commands the official to cause property to be returned. 'Restore' fits both the property and the accumulated agricultural income that follows.
- source_word: אֶת כָּל אֲשֶׁר לָהּ
  chosen: everything that belongs to her
  alternatives:
  - all that belongs to her
  lexicon: HALOT
  rationale: The expanded pronoun is natural in the restitution order and preserves the comprehensive scope.
- source_word: תְּבוּאֹת הַשָּׂדֶה
  chosen: the yield of the field
  alternatives:
  - the produce of the field
  - the income from the field
  lexicon: HALOT
  rationale: The noun denotes agricultural produce or yield. 'Yield' can include the field's accrued returns without narrowing the source to monetary income.
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ
  chosen: from the day she left the land
  alternatives:
  - from the day she departed from the land
  - since the day she left the country
  lexicon: HALOT
  rationale: עָזַב here means to leave/depart from. 'The land' preserves the Hebrew term אֶרֶץ without overinterpreting whether it means region or country; in context it refers to her homeland/territory.
- source_word: וְעַד עָתָּה
  chosen: until now
  alternatives:
  - up to now
  - to this day
  lexicon: HALOT
  rationale: A standard temporal expression meaning up to the present moment of the narrative action. 'Until now' is the most straightforward rendering.
