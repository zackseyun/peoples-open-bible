lexical_decisions:
- source_word: Ἀπαγγείλατε
  chosen: Report
  alternatives:
  - Tell
  - Declare
  lexicon: LSJ
  rationale: Imperative plural of ἀπαγγέλλω, conveying a formal act of reporting or announcing. 'Report' fits the court-like setting better than the more casual 'tell'.
- source_word: περὶ τῶν γεγραμμένων
  chosen: about what has been written
  alternatives:
  - concerning the written things
  - about what you have written
  lexicon: LSJ
  rationale: The perfect passive participle γεγραμμένων most naturally refers to the written submissions already composed. 'What has been written' is idiomatic English and preserves the passive/resultative sense without over-specifying authorship.
- source_word: ἤρξατο
  chosen: began
  alternatives:
  - started
  lexicon: LSJ
  rationale: Standard rendering of ἄρχομαι. 'Began' is natural and suitably formal.
- source_word: ὁ πρῶτος
  chosen: the first
  alternatives:
  - the first one
  lexicon: LSJ
  rationale: Straightforward ordinal substantive, referring to the first contestant/speaker.
- source_word: ὁ εἴπας
  chosen: who had spoken
  alternatives:
  - the one who said
  - who spoke
  lexicon: LSJ
  rationale: Aorist participle identifying the first speaker by his prior thesis. English relative clause smooths the Greek apposition while preserving sense.
- source_word: περὶ τῆς ἰσχύος τοῦ οἴνου
  chosen: about the strength of wine
  alternatives:
  - concerning the power of wine
  - about wine's strength
  lexicon: LSJ
  rationale: ἰσχύς denotes strength, might, or force. 'Strength of wine' preserves the lexical image and fits the argumentative topic in this contest.
- source_word: ἔφη οὕτως
  chosen: said this
  alternatives:
  - spoke thus
  - said as follows
  lexicon: LSJ
  rationale: Formula introducing direct speech. 'Said this' is concise, natural English that preserves the introductory force.
