  - 157
  validation: no_reference
translation:
  text: And from this you must know that women rule over you. Do you not labor and toil, and give and bring everything to women?
  philosophy: dynamic
lexical_decisions:
- source_word: ἐντεῦθεν
  chosen: from this
  alternatives:
  - from here
  - therefore
  - hence
  lexicon: LSJ
  rationale: In context it points to an inference drawn from the preceding examples, so 'from this' preserves the demonstrative force without over-interpreting it as a purely logical connective like 'therefore'.
- source_word: δεῖ
  chosen: must
  alternatives:
  - it is necessary
  - ought
  lexicon: BDAG
  rationale: The verb expresses necessity or obligation. 'Must' gives clear modern English and fits the rhetorical force of the speech.
- source_word: γνῶναι
  chosen: know
  alternatives:
  - recognize
  - understand
  lexicon: BDAG
  rationale: Aorist infinitive after δεῖ is naturally rendered 'must know.' 'Recognize' is possible, but 'know' is simpler and sufficiently strong.
- source_word: γυναῖκες
  chosen: women
  alternatives:
  - wives
  lexicon: LSJ
  rationale: The plural noun normally means 'women.' Although some examples in the surrounding context involve wives or consorts, this verse states the claim generically, so 'women' best matches the Greek.
- source_word: κυριεύουσιν
  chosen: rule over
  alternatives:
  - have dominion over
  - lord it over
  - master
  lexicon: BDAG
  rationale: The verb means to exercise lordship or dominion over. 'Rule over' is idiomatic, direct, and preserves the strong claim without sounding archaic.
- source_word: πονεῖτε
  chosen: labor
  alternatives:
  - work hard
  - strive
  lexicon: BDAG
  rationale: This verb denotes hard work or exertion. 'Labor' keeps the elevated rhetorical tone and pairs well with μοχθεῖτε.
- source_word: μοχθεῖτε
  chosen: toil
  alternatives:
  - be weary
  - struggle
  lexicon: BDAG
  rationale: Used alongside πονεῖτε, it intensifies the idea of burdensome effort. 'Toil' preserves the near-synonymous rhetorical doubling.
- source_word: πάντα
  chosen: everything
  alternatives:
  - all things
  - it all
  lexicon: BDAG
  rationale: The accusative object is comprehensive. 'Everything' is natural English and preserves the totalizing force.
- source_word: δίδοτε καὶ φέρετε
  chosen: give and bring
  alternatives:
  - hand over and carry
  - give and carry
  lexicon: BDAG/LSJ
  rationale: The two verbs likely distinguish giving and bringing/carrying. Rendering both avoids collapsing the Greek doublet and preserves the rhetorical accumulation.
