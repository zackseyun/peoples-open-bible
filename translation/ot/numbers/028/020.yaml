  from: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
  to: 'You shall prepare their grain offering from fine flour mixed with oil: three-tenths of an ephah[a] for each bull and two-tenths of an ephah for the ram.'
