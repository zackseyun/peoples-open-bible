  rationale: 결과로 주어지는 긍정적 정서를 자연스러운 현대 한국어로 표현하기 위해 ‘기쁨’으로 옮겼습니다.
theological_decisions:
- issue: 욕망-쾌락-기쁨의 순서 관계를 어떻게 드러낼지
  chosen_reading: 원문의 대비 구조를 따라 ‘욕망이 먼저, 그 다음 쾌락, 그 뒤 기쁨’이라는 인과적·순차적 관계를 평서문으로 보존했습니다.
  alternative_readings:
  - ‘쾌락보다 욕망이 앞서며, 쾌락 뒤에는 기쁨이 있다’
  - ‘쾌락 이전에 욕망이 있고, 쾌락 이후에는 기쁨이 있다’
  rationale: 원문은 시간적 전후와 결과의 배열을 단순하지만 분명하게 제시하므로, 그 질서를 훼손하지 않는 직결형 번역을 택했습니다.
  doctrine_reference: 지혜문학적·윤리적 진술의 순차 구조 보존
