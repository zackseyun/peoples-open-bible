  meaning_decisions:
  - source_phrase: מֵעִיר מְתִים יִנְאָקוּ
    prior_rendering: From the city, men groan
    new_rendering: People groan in the city
    rationale: The poetic noun denotes people, not the dying; natural English locates their groaning in the city without suggesting that people originating there are groaning elsewhere.
  - source_phrase: וְנֶפֶשׁ חֲלָלִים תְּשַׁוֵּעַ
    prior_rendering: and the wounded cry out for help
    new_rendering: the souls of the wounded cry out for help
    rationale: The wounded remain living victims, but “souls” restores the depth of their anguished appeal rather than reducing nephesh entirely to a reference to persons.
  - source_phrase: לֹא יָשִׂים תִּפְלָה
    prior_rendering: does not regard it as folly
    new_rendering: charges no one with wrongdoing
    rationale: In this catalogue of unchecked oppression, the idiom concerns assigning moral blame; “folly” alone can sound like mere foolishness, while the implied offenders are otherwise left unstated.
