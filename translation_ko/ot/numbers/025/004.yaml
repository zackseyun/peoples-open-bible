source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
  footnotes:
  - marker: a
    text: Or, 'Take all the leaders of the people, and have them execute the guilty before the LORD in broad daylight.' The Hebrew pronoun 'them' most directly points to the leaders, but some understand the leaders as the ones commanded to carry out the punishment.
    reason: alternative_reading
  - marker: b
    text: Literally, 'before the sun.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 모세에게 말씀하셨습니다. “백성의 모든 지도자를 데려다가, 여호와를 위하여 해가 비치는 곳에서 그들을[a] 꿰어 달아 두십시오[b]. 그러면 여호와의 타오르는 진노가 이스라엘에게서 돌이킬 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들’은 문법상 가장 가깝게는 ‘백성의 모든 지도자들’을 가리킵니다. 그러나 일부는 다음 절과의 관련에서 지도자들이 유죄자들을 처형하라는 명령을 받은 것으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘해 앞에서’입니다. 이는 햇빛 아래, 곧 공개적으로 드러나는 곳에서라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי
  english_pob_choice: leaders
  chosen_korean: 수령들
  alternatives_korean: 장로들, 우두머리들
  lexicon: BDB 917
  rationale: '''수령''은 지도적 지위를 강조하며, WLC의 ''רָאשֵׁי'' (머리들/지도자들) 의 의미를 정확히 반영합니다.'
- source_word: הוֹקַע
  english_pob_choice: impale
  chosen_korean: 매달아 죽이다
  alternatives_korean: 처형하다, 십자가에 못 박히다
  lexicon: HALOT 365
  rationale: 원어 동사 'הוֹקַע'는 구체적으로 매달아 죽이는 형벌을 지칭하므로, 현대 한국어에서 명확한 형벌의 의미를 전달하기 위해 '매달아 죽이다'를 선택했습니다.
- source_word: נֶגֶד הַשָּׁמֶשׁ
  english_pob_choice: in broad daylight
  chosen_korean: 해가 떠 있는 동안에
  alternatives_korean: 해 아래에서, 낮에
  lexicon: WLC literal
  rationale: 문자적 의미인 '해 앞'을 '해가 떠 있는 동안에'로 번역하여 공개적인 처형의 시간적 맥락을 유지했습니다.
theological_decisions:
- decision: 여호와 진노의 돌이킴
  rationale: 원어 'חֲרוֹן אַף' (진노의 불꽃) 을 '진노'로 번역하고, 그 결과가 '돌이키리라'로 표현되어 하나님의 공의로운 심판이 회개와 심판 실행을 통해 해결됨을 강조했습니다.
