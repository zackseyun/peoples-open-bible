  review_summary: “With emptiness” presents הָבֶל as the empty substance of the friends’ consolation rather than merely saying that their attempt fails. “Your answers” naturally renders תְּשׁוּבוֹתֵיכֶם, while “remain nothing but treachery” communicates the severe breach-of-trust sense of מָעַל in natural English. The connective “when” makes the relationship between the coordinated clauses explicit without adding a new motive or agent.
