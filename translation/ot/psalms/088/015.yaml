id: PSA.88.15
reference: Psalms 88:15
source:
  edition: WLC
  text: עָ֘נִ֤י אֲנִ֣י וְ/גֹוֵ֣עַ מִ/נֹּ֑עַר נָשָׂ֖אתִי אֵמֶ֣י/ךָ אָפֽוּנָה׃
translation:
  text: I have been afflicted and near death since my youth; I have borne your terrors; I am overwhelmed[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The final Hebrew word is uncertain; other possibilities are 'I am distraught' or 'I am confounded.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָנִי
  chosen: afflicted
  alternatives:
  - poor
  - humble
  - wretched
  lexicon: HALOT
  rationale: In lament contexts the adjective commonly denotes being afflicted or miserable rather than economically poor. 'Afflicted' fits the psalm's sustained language of suffering.
- source_word: וְגֹוֵעַ
  chosen: near death
  alternatives:
  - dying
  - expiring
  lexicon: HALOT
  rationale: The participle from גוע conveys perishing or dying. 'Near death' gives natural English while preserving the ongoing state implied by the participle; 'dying' is possible but can sound too immediate in English.
- source_word: מִנֹּעַר
  chosen: from my youth
  alternatives:
  - from youth
  lexicon: HALOT
  rationale: The preposition marks duration from an early stage of life. Supplying 'my' is idiomatic in English and reflects the first-person context.
- source_word: נָשָׂאתִי
  chosen: I have borne
  alternatives:
  - I have borne
  - I carry
  - I endured
  lexicon: HALOT
  rationale: The perfect naturally admits a retrospective English perfect.
- source_word: אֵמֶיךָ
  chosen: your terrors
  alternatives:
  - your horrors
  - your dreadful things
  lexicon: HALOT
  rationale: The plural noun denotes terrors or frightful things. 'Your terrors' is the most direct and idiomatic rendering in context, referring to terrors associated with God's dealings.
- source_word: אָפוּנָה
  chosen: I am overwhelmed
  alternatives:
  - I am distraught
  - I am helpless
  - I am confounded
  lexicon: HALOT
  rationale: Contextually plausible, while the note preserves the lexical uncertainty.
- source_word: עָנִי אֲנִי וְגֹוֵעַ מִנֹּעַר
  chosen: I have been afflicted and near death since my youth
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English for a condition extending from youth to the present.
