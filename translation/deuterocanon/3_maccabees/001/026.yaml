reference: 3 Maccabees 1:26
source:
  edition: lxx-swete-1909
  text: θρασυνθεὶς δὲ καὶ πάντας παραπέμψας ἤδη, καὶ πρόσβασιν ἤδη ἐποιεῖτο, τέλος ἐπιθήσειν δοκῶν τῷ προειρημένῳ.
  language: Greek
