  from: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
  to: The land of Egypt is at your disposal. Settle your father and your brothers in the best part of the land; let them live in the land of Goshen. If you know of any capable men among them, appoint them to oversee my livestock.”
  rationale: The lexical record explicitly recognizes 'at your disposal' as the contextual meaning but previously favored the Hebrew image. I adopt that meaning while retaining 'capable men,' which correctly avoids a military interpretation.
