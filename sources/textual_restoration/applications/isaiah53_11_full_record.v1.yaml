theological_decisions:
- issue: Interpretation of בְּדַעְתּוֹ
  chosen_reading: 'subjective/instrumental: ''by his knowledge'''
  alternative_readings:
  - 'objective: ''by knowledge of him'''
  rationale: Both 'by his knowledge' and 'by knowledge of him' remain available interpretations; the suffix by itself does not settle that choice. Retain the former and disclose the latter without treating theological preference as grammatical proof.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: Textual form of יראה אור
  chosen_reading: Provisional Hebrew object אור, rendered light
  alternative_readings:
  - MT יראה without an explicit object
  rationale: Two published Hebrew transcriptions preserve the complete word light, with partial third and Greek support. A clarifying expansion remains a serious counter-explanation; this is not a witness-count vote or a doctrinal argument. Original-language primacy does not require automatic WLC priority. Full critical-source approval remains pending.
  doctrine_reference: DOCTRINE.md, Translation philosophy §§1, 3
- issue: Scope of לָרַבִּים
  chosen_reading: '''many'''
  alternative_readings:
  - '''the many'''
  rationale: The Hebrew says 'many,' and the translation should not expand this to 'all' for theological harmonization. 'Many' preserves the wording while leaving broader doctrinal synthesis to readers and theology, not the translation.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
