theological_decisions:
- issue: Whether the verse should be translated as a doctrinal denial of any postmortem praise or more narrowly as poetic language about the silence of death
  chosen_reading: 'Retain the poetic statement without importing a full doctrine of the intermediate state: ''The dead do not praise Yah, nor do any who go down into silence.'''
  alternative_readings:
  - Interpretively expand to 'the dead in the grave do not praise the LORD'
  - Read 'silence' as a direct reference to Sheol/the grave in the main text
  rationale: The psalm contrasts the living worshipers with the dead using conventional Hebrew poetic language. The translation should preserve that tension and imagery without resolving broader theological debates about consciousness after death. Therefore 'silence' is kept literal/metaphorical in the main text, with interpretive alternatives left to footnote rather than embedded in translation.
  doctrine_reference: Preserve theological tension rather than resolve it.
