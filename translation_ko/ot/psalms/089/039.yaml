  yaml_path: translation/ot/psalms/089/039.yaml
  text: You have repudiated the covenant with your servant[a]; you have defiled his crown on the ground.[b]
  footnotes:
  - marker: a
    text: Literally, “the covenant of your servant.”
    reason: literal_form
  - marker: b
    text: Or “his diadem.” The Hebrew term can also carry an association with consecration.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 주님의 종과 맺으신 언약을 저버리셨고, 그의 왕관을 땅에 떨어뜨려 욕되게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕관’에 해당하는 히브리어는 ‘봉헌된 것’ 또는 ‘성별’을 뜻할 수도 있습니다. 따라서 이 표현에는 왕권뿐 아니라 성별된 지위가 욕되게 되었다는 뉘앙스도 담겨 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  english_pob_choice: But you
  chosen_korean: 그러나 주님께서는
  alternatives_korean:
  - 그런데 주님께서는
  - 하지만 주님께서는
  lexicon: WLC; adversative conjunction + independent pronoun
  rationale: 문맥상 앞선 언약적 진술들과 강하게 대비되는 전환이므로, ‘그러나’로 역접을 살리고 주어를 분명히 밝혔습니다.
- source_word: זָנַחְתָּ
  english_pob_choice: have cast off
  chosen_korean: 버리시고
  alternatives_korean:
  - 내치시고
  - 내던지시고
  lexicon: HALOT
  rationale: זנח의 핵심은 ‘버리다/내치다’의 배척 의미이므로, 현대 한국어에서 자연스럽고 직접적인 ‘버리시고’를 택했습니다.
- source_word: וַ/תִּמְאָס
  english_pob_choice: and rejected
  chosen_korean: 거절하셨으며
  alternatives_korean:
  - 버리셨으며
  - 경멸하셨으며
  lexicon: HALOT
  rationale: מאס는 단순한 거절을 넘어 경멸 섞인 배척을 뜻하지만, 앞 동사와의 중첩을 한국어에서 과도하게 반복하지 않도록 ‘거절하셨으며’로 옮겼습니다.
- source_word: מְשִׁיחֶךָ
  english_pob_choice: your anointed one
  chosen_korean: 주님의 기름부음 받은 이
  alternatives_korean:
  - 주님의 메시아
  - 주님의 기름부음 받은 자
  lexicon: HALOT; messianic title
  rationale: 이 용어는 문자적으로 ‘기름부음 받은 이’이며, 본문에서는 다윗 왕을 가리키는 즉각적 의미가 강하므로 제목을 해석적으로 풀되 메시아적 연관은 과잉해석하지 않았습니다.
theological_decisions:
- issue: מְשִׁיחֶךָ의 다윗 왕적 지시와 메시아적 여운의 처리
  chosen_reading: 본문에서는 다윗 언약의 왕을 가리키는 ‘주님의 기름부음 받은 이’로 두고, 신학적 동일시는 본문 밖으로 미루었습니다.
  alternative_readings:
  - 주님의 메시아
  - 주님의 기름부음 받은 자
  rationale: 시편 89편의 문맥은 언약 백성의 왕에 대한 탄식이므로, 본문 수준에서는 즉각적 역사적 지시를 유지하는 것이 더 정확합니다. 동시에 ‘기름부음 받은 이’라는 표현 자체가 뒤의 메시아 용례와 연결되므로 그 긴장은 보존됩니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve theological tension rather than resolve it.'
