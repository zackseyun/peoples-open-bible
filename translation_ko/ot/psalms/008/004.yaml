base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/004.yaml
  text: What is man[a] that you remember him, and the son of man[b] that you attend to him[c]?
  footnotes:
  - marker: a
    text: Or “mortal man”; the Hebrew אֱנוֹשׁ often highlights human frailty.
    reason: lexical_alternative
  - marker: b
    text: “Son of man” here is a Hebrew idiom for a human being. Later biblical usage can give the phrase messianic significance, but in this psalm it functions as a poetic parallel for humanity.
    reason: cross_reference
  - marker: c
    text: Or “care for him,” “visit him,” or “take notice of him.”
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이[a] 무엇이기에 주께서 그를 기억하시며, 인자가[b] 무엇이기에 주께서 그를 돌보십니까[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽을 수밖에 없는 사람’. 히브리어 에노쉬(אֱנוֹשׁ)는 인간의 연약함과 필멸성을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인자’는 여기서 메시아 칭호가 아니라 인간을 가리키는 히브리어 관용적 표현으로, 앞의 ‘사람’과 병행합니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘살피십니까’, ‘찾아오십니까’, ‘관심을 기울이십니까’. 히브리어 פקד는 돌보다, 살피다, 찾아오다 등의 폭넓은 뜻을 지닙니다.
    reason: lexical_alternative
