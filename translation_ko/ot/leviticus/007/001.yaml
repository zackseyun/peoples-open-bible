id: LEV.7.1
reference: Leviticus 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הָ/אָשָׁ֑ם קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/001.yaml
  text: 'Now this is the law of the guilt offering: it is most holy[a].'
  footnotes:
  - marker: a
    text: Or 'reparation offering' or 'compensation offering.' The Hebrew asham names a sacrifice associated with guilt and restitution.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 속건제에 관한 규례입니다. 속건제는 지극히 거룩한 제사입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배상제’ 또는 ‘보상제’. 히브리어 아샴은 죄책 및 배상과 관련된 제사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  english_pob_choice: Now this
  chosen_korean: 이것은
  alternatives_korean:
  - 그리고 이것은
  - 이것은 이제
  lexicon: BDB, HALOT
  rationale: 서두의 וְ+זֹאת는 새 규정을 도입하는 표지이므로, 현대 한국어에서는 군더더기 없이 ‘이것은’으로 시작해 문맥 전환을 살렸습니다.
- source_word: תּוֹרַת
  english_pob_choice: the law of
  chosen_korean: 율법
  alternatives_korean:
  - 규례
  - 가르침
  - 법
  lexicon: HALOT
  rationale: 여기서는 제의 절차를 규정하는 항목이므로, 관용적인 ‘율법’이 원문의 제도적 성격을 가장 자연스럽게 전달합니다.
- source_word: הָאָשָׁם
  english_pob_choice: the guilt offering
  chosen_korean: 속건제
  alternatives_korean:
  - 속죄제
  - 배상제
  - 유죄제
  lexicon: HALOT
  rationale: 아샴은 레위기 제의 범주로서 특정 희생제를 가리키므로, 전통적으로 확립된 ‘속건제’를 본문에 두고, 배상·보상 뉘앙스는 각주로 보완하는 편이 원문 범주를 안정적으로 유지합니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: most holy
  chosen_korean: 지극히 거룩합니다
  alternatives_korean:
  - 가장 거룩합니다
  - 지성소입니다
  - 지극히 성한 것입니다
  lexicon: HALOT
  rationale: 직역의 ‘거룩함들의 거룩함’은 한국어에서 부자연스럽기 때문에, 제의 등급을 나타내는 관용적 의미를 살려 ‘지극히 거룩합니다’로 옮겼습니다.
theological_decisions:
- issue: אָשָׁם의 제의적 범주와 배상 뉘앙스
  chosen_reading: 본문에는 ‘속건제’를 두고, 배상·보상 의미는 주석적 여지로 남깁니다.
  alternative_readings:
  - 배상제
  - 보상제
  rationale: 이 절은 특정 제사의 분류를 선언하는 본문이므로, 읽기 쉬우면서도 레위기 내 제의 체계를 보존하는 한국어 교회용어인 ‘속건제’가 적절합니다. 동시에 아샴에 내포된 배상 성격은 본문 외 설명으로 보존하는 것이 좋습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
