translation:
  text: A wise person will be cautious in everything and guard against wrongdoing in times of sin.
  philosophy: dynamic
lexical_decisions:
- source_word: ἄνθρωπος
  chosen: man
  alternatives:
  - person
  - human being
  lexicon: LSJ
  rationale: The singular generic noun is grammatically masculine and proverbial in force. Per project philosophy, a gender-accurate rendering is preferred over flattening to a neutral term when the source uses masculine representative language.
- source_word: σοφὸς
  chosen: wise
  alternatives:
  - prudent
  - skilled
  lexicon: LSJ
  rationale: In wisdom literature context, σοφός denotes practical and moral wisdom, not merely technical skill.
- source_word: ἐν παντὶ
  chosen: in everything
  alternatives:
  - in every matter
  - in all things
  lexicon: LSJ
  rationale: A broad expression covering all circumstances or matters; 'in everything' is natural modern English and preserves the scope.
- source_word: εὐλαβηθήσεται
  chosen: will be cautious
  alternatives:
  - will be reverent
  - will be on guard
  - will act carefully
  lexicon: LSJ
  rationale: The future passive/middle form of εὐλαβέομαι can mean to be wary, cautious, or reverent. Here the parallel clause about paying attention to avoid wrongdoing points to practical wariness rather than cultic reverence, so 'will be cautious' best fits the context.
- source_word: ἡμέραις ἁμαρτιῶν
  chosen: days of sins
  alternatives:
  - days of sin
  - times of sinning
  - sinful days
  lexicon: LSJ
  rationale: The Greek is literally plural, 'days of sins.' This likely refers to occasions characterized by sin or temptation. The somewhat literal rendering preserves the plural while remaining intelligible; the sense is then clarified by the following clause.
- source_word: προσέξει
  chosen: he will beware
  alternatives:
  - he will pay attention
  - he will take heed
  - he will be attentive
  lexicon: LSJ
  rationale: προσέχω often means to pay attention or take heed. Because it is followed by ἀπὸ πλημμελίας ('from wrongdoing'), English idiom is better served by 'beware,' which captures attentive avoidance.
- source_word: ἀπὸ
  chosen: of
  alternatives:
  - from
  lexicon: LSJ
  rationale: Although ἀπό normally means 'from,' English with 'beware' regularly takes 'of.' The sense of avoidance is preserved without awkwardness.
- source_word: πλημμελίας
  chosen: wrongdoing
  alternatives:
  - offense
  - transgression
  - error
  - fault
  lexicon: LSJ
  rationale: πλημμέλεια denotes a fault, offense, or misdeed. 'Wrongdoing' is broad enough to fit the wisdom context and avoids over-specifying the term as either accidental error or formal transgression.
