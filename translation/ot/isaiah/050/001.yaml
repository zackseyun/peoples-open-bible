translation:
  text: 'Thus says Yahweh: Where is your mother''s[a] certificate of divorce, with which I sent her away? Or to which of my creditors did I sell you? Look, you were sold because of your iniquities, and your mother was sent away because of your transgressions.'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Zion is pictured as Yahweh's wife and the mother of her people.
    reason: cultural_note
