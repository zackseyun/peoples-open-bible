translation:
  text: Turn to me, you who are simple[a], and lodge in the house of my instruction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew can also mean 'fools' or those lacking understanding. Greek addresses the untrained and says 'Draw near to me'; the instructional invitation permits 'simple' without proving Hebrew lacks rebuke.
    reason: lexical_alternative
  - marker: b
    text: Hebrew specifies 'my' instruction or study. Greek has a house of instruction without that possessive suffix.
    reason: textual_variant
lexical_decisions:
- source_word: פְּנוּ אֵלַי סְכָלִים, וְלִינוּ בְּבֵית מִדְרָשִׁי.
  chosen: Turn to me, you who are simple, and lodge in the house of my instruction.
  rationale: פְּנוּ and לִינוּ Qal imperatives 2mp; סְכָלִים plural adjective/substantive; מִדְרָשִׁי noun with 1cs suffix in construct with בֵּית. The plural invitation, lodging image and first-person possessive follow Hebrew. 'Simple' fits the educational setting, while the stronger 'fools' remains possible; the active rationale now matches 'simple' rather than claiming 'unlearned' was chosen.
