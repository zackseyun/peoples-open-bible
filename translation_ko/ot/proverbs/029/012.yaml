  terminology: ‘통치자’와 ‘신하’는 통치자 및 그를 섬기는 이들을 가리키는 문맥에 적절합니다. רְשָׁעִים은 여기서 ‘악합니다’로 옮겨, ‘악한 자들이다’라는 서술을 자연스럽게 반영합니다.
