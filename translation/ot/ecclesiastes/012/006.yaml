id: ECC.12.6
reference: Ecclesiastes 12:6
source:
  edition: WLC
  text: עַ֣ד אֲשֶׁ֤ר לֹֽא ירחק חֶ֣בֶל הַ/כֶּ֔סֶף וְ/תָרֻ֖ץ גֻּלַּ֣ת הַ/זָּהָ֑ב וְ/תִשָּׁ֤בֶר כַּד֙ עַל הַ/מַּבּ֔וּעַ וְ/נָרֹ֥ץ הַ/גַּלְגַּ֖ל אֶל הַ/בּֽוֹר־־־׃
translation:
  text: before the silver cord is snapped[a], and the golden bowl is shattered, and the jar is broken at the spring, and the wheel is broken at the well,
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “is loosened” or “is removed”; the Hebrew verb is difficult.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  chosen: before
  alternatives:
  - until not
  - before ... not
  lexicon: HALOT
  rationale: In context with the preceding exhortation ('remember your Creator'), the idiom introduces the time before death overtakes a person. English 'before' best captures the force naturally.
- source_word: ירחק
  chosen: is snapped
  alternatives:
  - is removed
  - is torn away
  - is severed
  lexicon: HALOT
  rationale: The verb רחק normally means 'be far/distant,' but in this difficult poetic context many understand a textual/semantic development reflected in traditional renderings like 'be loosed' or 'be snapped' for the cord. 'Snapped' fits the death imagery and parallels the following verbs of destruction. The uncertainty is preserved in a footnote.
- source_word: חֶבֶל הַכֶּסֶף
  chosen: the silver cord
  alternatives:
  - the cord of silver
  lexicon: HALOT
  rationale: A straightforward construct phrase. 'Silver cord' is idiomatic English and preserves the metaphorical image.
- source_word: וְתָרֻץ
  chosen: is shattered
  alternatives:
  - is crushed
  - is smashed
  - is broken
  lexicon: HALOT
  rationale: From רצץ, conveying violent breaking/crushing. 'Shattered' gives vivid poetic force and matches the fragile object in view.
- source_word: גֻּלַּת הַזָּהָב
  chosen: the golden bowl
  alternatives:
  - the bowl of gold
  - the golden lamp-bowl
  lexicon: HALOT
  rationale: גֻּלָּה can denote a bowl or basin, including a lamp reservoir in some contexts. Here 'golden bowl' is the most natural and traditional image without over-specifying function.
- source_word: וְתִשָּׁבֶר כַּד
  chosen: the jar is broken
  alternatives:
  - the pitcher is broken
  lexicon: HALOT
  rationale: כַּד is a jar/pitcher used for drawing water. 'Jar' is more accessible modern English; the water-drawing context is retained by 'at the spring.'
- source_word: עַל הַמַּבּוּעַ
  chosen: at the spring
  alternatives:
  - by the fountain
  - at the source
  lexicon: HALOT
  rationale: מַבּוּעַ denotes a spring or fountainhead. 'Spring' is clear modern English and suits the water imagery.
- source_word: וְנָרֹץ
  chosen: is crushed
  alternatives:
  - is shattered
  - is smashed
  lexicon: HALOT
  rationale: Again from רצץ, here with the wheel as subject. 'Crushed' avoids exact repetition while preserving the violent destruction.
- source_word: הַגַּלְגַּל
  chosen: the wheel
  alternatives:
  - the pulley
  - the water wheel
  lexicon: HALOT
  rationale: The noun can mean wheel and in this context may refer specifically to the well-wheel/pulley. Main text keeps the broader 'wheel'; the more specific possibility is preserved in a footnote.
- source_word: אֶל הַבּוֹר
  chosen: at the well
  alternatives:
  - into the cistern
  - into the well
  lexicon: HALOT
  rationale: The immediate water-drawing imagery supports “well”; the alternatives preserve the broader range of בּוֹר.
- source_word: וְנָרֹץ הַגַּלְגַּל
  chosen: and the wheel is broken
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: “Broken” is idiomatic for the object and retains the destruction denoted by רצץ.
