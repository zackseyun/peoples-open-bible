  - A formal command/order
  rationale: The verse participates in Matthew's theme of Jesus restraining premature publicity. The Greek supports a stern directive, but does not itself specify the theological reason; the translation therefore avoids importing a fuller explanation into the text.
  doctrine_reference: Preserve theological tension rather than resolve it.
