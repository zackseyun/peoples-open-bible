  source_fidelity: 현 초안은 אֶשֶׁד הַנְּחָלִים(‘와디들의 비탈/경사’)에서 핵심 명사 אֶשֶׁד를 ‘경사지’로 다소 부자연스럽게 처리하고, נְחָלִים을 ‘시내들’로 옮겨 계절성 물길·와디라는 지형적 의미를 충분히 드러내지 못합니다. 또한 וְנִשְׁעַן의 ‘기대다/의지하다’라는 비유적 지형 묘사가 ‘닿다’로 약화되었습니다. 수정문은 ‘아르가 자리한 곳’이라는 난해한 לְשֶׁבֶת עָר의 위치적 해석을 유지하되 각주로 불확실성을 보존합니다.
