  to: 악을 행하는 자들아, 모두 내게서 떠나가십시오. 야훼께서 제가 우는 소리를 들으셨습니다.
  rationale: 검토 대상 WLC를 우선하여 초안 전체를 시편 6:8에 맞게 교체했습니다. סוּרוּ는 복수 명령으로, ‘악을 행하는 자들아’라는 호격 뒤에 ‘떠나가십시오’로 옮겼습니다. כָּל은 ‘모두’로, מִמֶּנִּי는 ‘내게서’로 반영했습니다. פֹּעֲלֵי אָוֶן은 압축된 ‘악인들’보다 원문의 행위자 뉘앙스를 보존하는 ‘악을 행하는 자들’로 번역했습니다. שָׁמַע의 완료형은 현재적 확신을 나타내는 ‘들으셨습니다’로, קוֹל בִּכְיִי는 ‘제가 우는 소리’로 번역했습니다. 원문에 본문상 불확실성을 표시할 만한 쟁점은 없고, 기존 각주는 다른 절의 본문에 대한 것이므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:47:19Z'
