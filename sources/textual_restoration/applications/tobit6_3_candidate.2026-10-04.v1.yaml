id: TOB.6.3
reference: Tobit 6:3
source:
  edition: lxx-swete-1909
  text: καὶ κατέβη τὸ παιδίον περινίψασθαι τοὺς πόδας εἰς τὸν Τίγριν ποταμόν, καὶ ἀναπηδήσας ἰχθὺς μέγας ἐκ τοῦ ὕδατος ἐβούλετο καταπεῖν τὸν πόδα τοῦ παιδαρίου,
    καὶ ἔκραξεν.
  language: Greek
  pages:
  - 846
  literary_form: Greek II, Swete lower Sinaiticus text
  validation: published_print_checked; historical_priority_unresolved
  note: Local longer-form selection for 6:3–6 within POB’s otherwise unreviewed mixed working Tobit. This is verbatim printed Greek, not restored Aramaic or a continuous
    Sinaiticus edition.
  numbering_note: Swete comparison numbering VI 3; content alignment governs, not another edition’s verse label.
translation:
  text: The young man went down to the Tigris River to wash his feet. A large fish leaped up from the water and wanted to swallow the young man’s foot[a], and the
    young man cried out.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: POB provisionally selects the longer Greek form of the connected fish episode (6:3–6), as printed from Sinaiticus by Swete. The shorter Greek says the fish
      wanted to swallow the young man, without specifying his foot or the fish’s size. Published 4Q197 preserves the Aramaic words for foot/leg and large, but its
      swallowing verb is only partly preserved. These early details support the local choice; early explanatory expansion remains possible, and earliest wording is
      unresolved.
    reason: textual_variant
lexical_decisions:
- source_word: τὸ παιδίον / τοῦ παιδαρίου
  chosen: the young man
  rationale: Use the same label as the surrounding travel narrative; no age distinction is inferred between these related Greek forms.
  alternatives:
  - the boy
  - the youth
- source_word: περινίψασθαι τοὺς πόδας
  chosen: to wash his feet
  rationale: Preserve plural feet in the washing action, distinct from the single threatened foot.
- source_word: εἰς τὸν Τίγριν ποταμόν
  chosen: to the Tigris River
  rationale: Into is also possible; to preserves motion to the water without implying full bodily immersion.
  alternatives:
  - into the Tigris River
- source_word: ἀναπηδήσας ἰχθὺς μέγας
  chosen: A large fish leaped up
  rationale: Render the participial action as a finite English sequence without suppressing the explicit size descriptor.
- source_word: ἐβούλετο καταπεῖν τὸν πόδα
  chosen: wanted to swallow the young man’s foot
  rationale: Preserve intention and the singular anatomical object; do not replace swallow with bite or intention with a separately narrated attempt.
- source_word: καὶ ἔκραξεν
  chosen: and the young man cried out
  rationale: The subject is implicit in Greek; context identifies the youth. Repeating his label makes the interpretation explicit and avoids an English fish antecedent.
