  from: Were you not ashamed[a], though you are a man, most beastly one, to cut out the tongues of those who share the same sufferings and have come from the same elements, and after mutilating him in this way[b], to torture him?
  to: You utter beast! Though you are human, were you not ashamed to cut out the tongues of those who can suffer just as you can[a] and are made from the same elements[b] as you, and then torture them after mutilating them in this way?
