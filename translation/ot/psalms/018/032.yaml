id: PSA.18.32
reference: Psalms 18:32
source:
  edition: WLC
  text: הָ֭/אֵל הַ/מְאַזְּרֵ֣/נִי חָ֑יִל וַ/יִּתֵּ֖ן תָּמִ֣ים דַּרְכִּֽ/י׃
translation:
  text: God is the one who equips me with strength[a] and makes my way secure[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'girds me with strength,' picturing being belted and ready for action.
    reason: lexical_alternative
  - marker: b
    text: Or, 'makes my way blameless'; the Hebrew word can describe moral integrity as well as freedom from defect.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל
  chosen: God is the one who
  alternatives:
  - God
  lexicon: HALOT
  rationale: This supplies the English copula required for the Hebrew nominal identification while retaining God as the identified actor.
- source_word: הַמְאַזְּרֵנִי
  chosen: who equips me
  alternatives:
  - who equips me
  - who arms me
  lexicon: HALOT
  rationale: This communicates the contextual sense of girding for action in natural modern English; the literal image is retained in the note.
- source_word: חָיִל
  chosen: with strength
  alternatives:
  - with might
  - with valor
  lexicon: HALOT
  rationale: חיל can denote strength, might, efficiency, or valor. Here, following the verb 'girds,' 'with strength' is the most natural English collocation and suits the personal empowerment sense.
- source_word: וַיִּתֵּן
  chosen: and makes
  alternatives:
  - and sets
  - and gives
  lexicon: HALOT
  rationale: Although נתן commonly means 'give,' in this idiom with predicate adjective and object ('make/give ... blameless my way') English idiom is better served by 'makes.' This reflects the resultant sense without woodenly preserving 'gives.'
- source_word: תָּמִים
  chosen: blameless
  alternatives:
  - perfect
  - whole
  - complete
  lexicon: HALOT
  rationale: תמים often conveys wholeness or integrity rather than philosophical perfection. 'Blameless' is the best contextual rendering for a person's way or conduct, avoiding misleading absolutist overtones of 'perfect.'
- source_word: דַּרְכִּי
  chosen: my way
  alternatives:
  - my path
  - my course
  lexicon: HALOT
  rationale: '''Way'' is the standard and sufficiently transparent rendering for דרך in ethical/life-course contexts. It preserves the metaphor and aligns with common biblical usage.'
