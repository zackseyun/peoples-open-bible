  text: For my father Jacob also blessed me with blessings of the earth and firstfruits of fruits.
translation:
  language: ko
  text: 이는 나의 아버지 야곱도 땅의 축복과 열매의 첫 수확으로 나를 축복하였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πατήρ μου Ἰακώβ
  english_pob_choice: my father Jacob
  chosen_korean: 내 아버지 야곱
  alternatives_korean:
  - 아버지 야곱
  - 내 아버지 야곱
  lexicon: πατήρ, Ἰακώβ
  rationale: 소유 표현을 자연스럽게 살리면서도 인물 이름을 그대로 보존해, 화자가 자기 아버지 야곱을 가리킨다는 점을 분명히 했습니다.
- source_word: ἐν εὐλογίαις τῆς γῆς
  english_pob_choice: with blessings of the earth
  chosen_korean: 땅의 축복
  alternatives_korean:
  - 땅의 복들
  - 땅의 축복들
  lexicon: εὐλογίαις, γῆ
  rationale: 복수형 ‘축복들’을 직역할 수도 있지만, 한국어에서는 집합적 표현인 ‘땅의 축복’이 자연스럽고 원문의 의미를 덜 분절합니다.
- source_word: καὶ ἀπαρχῶν καρπῶν
  english_pob_choice: and firstfruits of fruits
  chosen_korean: 첫열매의 열매
  alternatives_korean:
  - 첫열매의 과실
  - 첫 열매의 열매
  lexicon: ἀπαρχῶν, καρπῶν
  rationale: 개정된 POB의 ‘firstfruits of fruits’를 반영해 ‘첫열매’와 ‘열매’의 반복 구조를 살리고, καρπῶν을 ‘과실’보다 덜 옛스러운 ‘열매’로 옮겼습니다.
- source_word: εὐλόγησέ με
  english_pob_choice: blessed me
  chosen_korean: 나를 축복하였습니다
  alternatives_korean:
  - 나를 복 주었습니다
  - 나를 축복했습니다
  lexicon: εὐλόγησέ
  rationale: 본문의 동사 의미를 직접 살리되, 합쇼체 서술형으로 자연스럽게 정리했습니다.
theological_decisions:
- issue: ‘축복’과 복수형 표현의 처리
  chosen_reading: ‘땅의 축복’과 ‘첫열매의 열매’로 옮겨, 복수적 은혜의 총합을 한국어의 집합적 명사로 표현했습니다.
  alternative_readings:
  - ‘땅의 복들’
  - ‘첫열매들의 열매’
  rationale: 원문은 복수형이지만, 한국어에서는 과도한 복수 표지가 오히려 어색할 수 있어 의미를 해치지 않는 범위에서 자연스럽게 정리했습니다.
  doctrine_reference: 문자적-의미적 대응 원칙
