translation:
  text: “They are the ones who judge the stars of heaven and raise their hands against the Most High[a]. They walk on dry land and dwell on it. All their deeds display injustice; their power rests on their wealth. They have put their trust in the gods they made with their own hands, and they deny the name of the Lord of Spirits.”
