revisions:
- timestamp: '2026-04-28T06:42:07Z'
  adjudicator: auto_apply_tier2_source_grounded
  reviewer_model: gemini-3.1-pro-preview
  source_review: state/reviews/gemini/vertex_gap_closure_2026_04/extra_canonical/2_baruch/039/002.job-75729.json
  category: mistranslation
  tier: 2
  from: this is a kingdom that will arise in those days.
  to: 'this is the word:'
  rationale: The Syriac text ends the verse with 'hādē hī meltā' ('this is the word'
    or 'this is the meaning'). The phrase 'this is a kingdom that will arise in those
    days' is not in the Syriac of this verse and appears to be a hallucination or
    an improper conflation with the subsequent verses (e.g., 39:3, 5) describing the
    kingdoms.
- timestamp: '2026-04-28T09:36:33Z'
  adjudicator: claude-opus-4-7
  reviewer_model: gemini-3.1-pro-preview
  source_review: state/reviews/gemini/vertex_full_book_qc_2026_04/extra_canonical/2_baruch/039/002.job-77242.json
  category: lexical
  from: 'this is the word:'
  to: 'this is the interpretation:'
  rationale: While 'meltā' literally means 'word', in the context of explaining a
    vision, it carries the sense of 'meaning' or 'interpretation' (as in 'this is
    the word [concerning it]'). Rendering it as 'interpretation' or 'meaning' better
    fits optimal equivalence.
- timestamp: '2026-09-13T05:25:02Z'
  adjudicator: claude-opus-5-footnote-marker-cleanup
  reviewer_model: claude-opus-5
  category: footnote_marker_cleanup
  tier: 1
  from: 'As for the great forest that you saw, with the lofty and rugged mountains
    surrounding it, this is the interpretation:'
  to: 'As for the great forest that you saw, with the lofty and rugged mountains surrounding
    it, this is the[b] interpretation:'
  rationale: Footnote marker(s) declared but absent from the rendering, so the note
    never reached the reader. [b] anchored to ('this is the word:') because that phrase
    is the rendering the note's alternative corresponds to. Rendering and footnote
    text unchanged.
