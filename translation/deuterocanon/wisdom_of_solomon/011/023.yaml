id: WIS.11.23
reference: Wisdom of Solomon 11:23
source:
  edition: lxx-swete-1909
  text: ἐλεεῖς δὲ πάντας, ὅτι πάντα δύνασαι, καὶ παρορᾷς ἁμαρτήματα ἀνθρώπων εἰς μετάνοιαν.
  language: Greek
  pages:
  - 621
  - 638
  - 639
  - 640
