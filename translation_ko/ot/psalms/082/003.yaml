  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁפְטוּ
  english_pob_choice: Defend
  chosen_korean: 변호하고
  alternatives_korean:
  - 심판하고
  - 판결하고
  - 정의롭게 판단하고
  lexicon: שׁפט
  rationale: 문맥상 단순한 재판 행위보다 약한 자를 보호하고 권리를 세우라는 요청이므로, POB의 'Defend'를 따라 한국어도 법정적 보호 행위를 드러내는 '변호하다'를 택했습니다.
- source_word: דַל
  english_pob_choice: the weak
  chosen_korean: 약한 자
  alternatives_korean:
  - 가난한 자
  - 빈곤한 자
  - 연약한 자
  lexicon: דל
  rationale: 사회적 힘이 약하고 보호받지 못하는 대상을 가리키므로, 물질적 빈곤보다 포괄적인 '약한 자'가 원문의 폭을 잘 살립니다.
- source_word: עָנִ֖י וָ/רָ֣שׁ
  english_pob_choice: the afflicted and the poor
  chosen_korean: 고난받는 자와 가난한 자
  alternatives_korean:
  - 억눌린 자와 가난한 자
  - 곤고한 자와 빈한한 자
  - 고통받는 자와 궁핍한 자
  lexicon: ענה / רש
  rationale: ‘עָנִי’는 단순 경제적 가난만이 아니라 눌림과 고난의 상태를 포함할 수 있어 '고난받는 자'로, 'רָשׁ'는 경제적 결핍을 분명히 드러내는 '가난한 자'로 옮겼습니다.
- source_word: הַצְדִּיקוּ־
  english_pob_choice: vindicate
  chosen_korean: 정의를 세우십시오
  alternatives_korean:
  - 의롭다 하십시오
  - 무죄를 선언하십시오
  - 옳다고 판정하십시오
  lexicon: צדק
  rationale: 법정에서 누명을 벗겨 주고 권리를 회복시키는 의미를 반영해, 단순 선언보다 회복적·공적 뉘앙스를 가진 '정의를 세우다'를 사용했습니다.
theological_decisions:
