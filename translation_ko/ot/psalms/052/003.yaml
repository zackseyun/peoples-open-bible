  text: 너는 파멸을 꾀합니다. 네 혀는 날카롭게 벼린 면도칼 같고, 속임수를 일삼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה תִּתְהַלֵּל
  english_pob_choice: Why do you boast
  chosen_korean: 어찌하여 너는 자랑합니까
  alternatives_korean:
  - 왜 너는 뽐냅니까
  - 어찌하여 너는 떠벌립니까
  lexicon: תִּתְהַלֵּל
  rationale: 반어적 책망의 질문으로 읽어 ‘어찌하여’와 ‘자랑하다’를 살렸습니다. ‘뽐내다’는 가벼워질 수 있어 기본 의미를 유지했습니다.
- source_word: בְּרָעָה
  english_pob_choice: in evil
  chosen_korean: 악을
  alternatives_korean:
  - 악 속에서
  - 악 가운데서
  lexicon: רָעָה
  rationale: POB의 ‘in evil’을 한국어로 자연스럽게 옮기되, 행위/방향성을 드러내는 목적격 표현으로 처리했습니다.
- source_word: הַגִּבּוֹר
  english_pob_choice: mighty man
  chosen_korean: 용사여
  alternatives_korean:
  - 강한 사람아
  - 권세 있는 이여
  lexicon: גִּבּוֹר
  rationale: 시편의 책망 대상이 되는 강한 자를 한국어 시적 호격으로 옮겼습니다. 문맥상 단순 ‘힘센 사람’보다 ‘용사’가 어조를 더 잘 살립니다.
- source_word: חֶסֶד אֵל
  english_pob_choice: The steadfast love of God
  chosen_korean: 하나님의 인자하심
  alternatives_korean:
  - 하나님의 변함없는 사랑
  - 하나님의 한결같은 사랑
  lexicon: חֶסֶד
  rationale: חֶסֶד는 언약적 신실함이 포함된 사랑이므로, 전통적이지만 의미를 담는 ‘인자하심’으로 옮겼습니다. ‘변함없는 사랑’은 뜻은 통하나 언약적 뉘앙스가 약해집니다.
- source_word: כָּל הַיּוֹם
  english_pob_choice: all day long
  chosen_korean: 온종일 지속됩니다
  alternatives_korean:
  - 하루 종일입니다
  - 날마다 계속됩니다
  lexicon: כָּל הַיּוֹם
  rationale: 시간의 지속성을 한국어 서술로 풀어, 히브리어의 반복적·지속적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: חֶסֶד אֵל의 신학적 뉘앙스
  chosen_reading: 하나님의 인자하심을 하나님의 지속적 언약 사랑으로 이해하되, 본문에는 직접 그 해설을 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님의 자비
  - 하나님의 변함없는 사랑
  rationale: 시적 문맥에서 하나님의 성품을 찬양하는 표현이므로, 원문의 압축성과 다의성을 유지하는 번역이 적절합니다.
  doctrine_reference: 구약의 חֶסֶד(언약적 인자/사랑) 용례 전반
