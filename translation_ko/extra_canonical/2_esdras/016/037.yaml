id: 2ES.16.37
reference: 2 Esdras 16:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'ecce verbum Domini, excipite eum, ne discredatis de quibus dicit Dominus:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/037.yaml
  text: 'Behold, the word of the Lord: receive it; do not disbelieve what the Lord says.'
translation:
  language: ko
  text: 보십시오, 주님의 말씀입니다. 그 말씀을 받아들이십시오. 주님께서 말씀하시는 것을 믿지 않는 일이 없도록 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: 직접 호소/주의 환기
  rationale: 독자에게 즉시 주의를 돌리는 명령형으로, 합쇼체에서 자연스럽고 문맥의 선포성을 살립니다.
- source_word: verbum Domini
  english_pob_choice: the word of the Lord
  chosen_korean: 주님의 말씀
  alternatives_korean:
  - 주님의 말
  - 주님의 말씀
  lexicon: verbum / Dominus
  rationale: verbum은 단순한 '말'보다 하나님의 계시된 말씀을 가리키므로 '말씀'이 더 정확합니다.
- source_word: excipite eum
  english_pob_choice: receive it
  chosen_korean: 그것을 받으십시오
  alternatives_korean:
  - 그것을 받아들이십시오
  - 그것을 맞으십시오
  lexicon: excipere
  rationale: 문맥상 '환영하다'보다 '받다/받아들이다'가 직접적이며, 지시 대상인 '말씀'을 대명사로 자연스럽게 이어 줍니다.
- source_word: ne discredatis
  english_pob_choice: do not disbelieve
  chosen_korean: 믿지 마십시오
  alternatives_korean:
  - 불신하지 마십시오
  - 의심하지 마십시오
  lexicon: discredere
  rationale: discredere는 단순한 의심보다 '믿지 않다'가 핵심이므로, 권고의 강도를 살리되 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 주님의 발화 대상 표지
  chosen_reading: '''주님께서 말씀하시는 것''으로 옮겨, 뒤 절을 직접적인 주님의 말씀에 대한 반응 요청으로 유지했습니다.'
  alternative_readings:
  - '''주님이 말씀하시는 것들'''
  - '''주님께서 말씀하신 것'''
  rationale: 라틴어 dicit Dominus는 현재진행적 발화를 드러내므로, 단회적 과거보다 '말씀하시는'이 더 충실합니다.
  doctrine_reference: 계시의 현재적 선포성과 권위
- issue: '''말씀''의 수사적 기능'
  chosen_reading: '''주님의 말씀입니다''를 앞세워 전체 절을 권위 있는 선포로 구성했습니다.'
  alternative_readings:
  - '''주님의 말입니다'''
  - '''주님의 말씀이니'''
  rationale: 본문은 단순 정보 전달이 아니라 공동체가 받아들여야 할 권면이므로, 선포문 구조를 유지하는 것이 적절합니다.
  doctrine_reference: 성경적 권위와 수납의 요청
