id: JOB.24.21
reference: Job 24:21
source:
  edition: WLC
  text: רֹעֶ֣ה עֲ֭קָרָה לֹ֣א תֵלֵ֑ד וְ֝/אַלְמָנָ֗ה לֹ֣א יְיֵטִֽיב׃
translation:
  text: He preys on the barren woman who bears no children and shows no kindness to the widow.
  philosophy: dynamic
lexical_decisions:
- source_word: רֹעֶה
  chosen: feeds on
  alternatives:
  - feeds on
  - shepherds
  - consumes
  lexicon: HALOT
  rationale: Preserves the feeding image of רעה; the surrounding reference to vulnerable women makes the exploitative implication clear without replacing the image with an interpretation.
- source_word: עֲקָרָה
  chosen: barren woman
  alternatives:
  - barren
  - infertile woman
  lexicon: HALOT
  rationale: The noun/adjective refers to a woman who is barren/infertile. 'Barren woman' is explicit and natural in English, preserving the feminine singular reference.
- source_word: לֹא תֵלֵד
  chosen: who bears no children
  alternatives:
  - who cannot bear children
  - childless
  lexicon: HALOT
  rationale: Natural English for “does not give birth,” without adding an explicit assertion of incapacity.
- source_word: אַלְמָנָה
  chosen: widow
  lexicon: HALOT
  rationale: Standard rendering for the vulnerable social category named in the Hebrew.
- source_word: לֹא יְיֵטִיב
  chosen: does no good to
  alternatives:
  - does not treat well
  - shows no kindness to
  - does not benefit
  lexicon: HALOT
  rationale: The Hiphil of יטב means 'do good, treat well, benefit.' 'Does no good to' is a clear, fairly literal rendering that preserves the moral force without over-paraphrasing.
