translation:
  text: And on the great day of judgment, let him be cast into the burning heat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “so that he may be sent into the heat”; in context the clause carries forward the command of judgment.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበዕለት፡ ዓባይ፡ እንተ፡ ኵነኔ፡
  chosen: And on the great day of judgment
  alternatives:
  - And on the great day, which is the judgment
  - And on the great judgment day
  rationale: The construction literally presents 'the great day' with a relative expression connected to 'judgment.' English
    idiom naturally conveys this as 'the great day of judgment' while preserving the apocalyptic judgment formula.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ከመ፡ ይትፈኖ፡
  chosen: let him be cast
  alternatives:
  - so that he may be sent
  - that he may be cast
  rationale: The verb is passive and can denote being sent or cast. In this punitive destination context, 'be cast' conveys
    force more clearly than neutral 'be sent.' Although ከመ commonly marks purpose ('so that'), the dependent clause functions
    here as a command within the surrounding angelic judgment instructions, so English 'let him' gives the intended directive
    without adding an agent.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ውስተ፡ ዋዕይ፡
  chosen: into the burning heat
  alternatives:
  - into the heat
  - into the fire
  rationale: ውስተ marks movement into, while ዋዕይ denotes heat or burning heat. 'Burning heat' preserves the witness's thermal
    image; rendering it simply as 'fire' would make explicit an image not lexically stated in the supplied Ge'ez.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
