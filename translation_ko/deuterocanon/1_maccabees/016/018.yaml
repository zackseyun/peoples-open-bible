revisions:
- from: 그리고 프톨레마이오스는 이 일들을 기록하고, 왕에게 사람을 보내어 그에게 도움으로 쓸 군대와 그들의 나라와 도시들을 넘겨 달라고 했습니다.
  to: 프톨레마이오스는 이 내용을 왕에게 써 보내어, 왕이 프톨레마이오스에게 지원군을 보내고 그들의 나라와 도시들을 넘겨주도록 요청했습니다.
  rationale: 원문에 없는 ‘사람’을 삭제하고, γράφω와 ἀποστέλλω의 연결을 ‘써 보내다’로 자연스럽게 옮겼습니다. ὅπως 이하를 왕에게 한 요청의 내용으로 명시하면서도, ‘그들의’의 지시 대상은 해석으로 특정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:47:29Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘왕에게 사람을 보내어’는 ἀπέστειλεν(보냈다)에 원문에 없는 전달자 ‘사람’을 보충합니다. 또한 ὅπως 이하의 두 접속법은 왕이 프톨레마이오스에게 병력을 보내고 그들의 나라와 도시들을 넘겨주게 하려는 요청의 내용입니다.
  naturalness: ‘이 내용을 왕에게 써 보내어’는 γράψας/ἔγραψεν과 ἀπέστειλεν의 연속을 자연스러운 한국어로 재현하며, 현대 공적 문체에도 맞습니다. ‘지원군’은 군사 문맥에서 간결하고 자연스럽습니다.
  terminology: δυνάμεις는 ‘지원군’으로, παραδῷ는 지배권의 이전을 드러내는 ‘넘겨주다’로 옮겼습니다. χώρα는 문맥상 ‘나라’로 유지했고, αὐτῶν의 지시 대상은 원문대로 ‘그들의’로 보존했습니다.
  issues:
  - severity: medium
    issue: ‘사람을 보내어’라는 전달 수단의 추가
    rationale: 원문은 왕에게 무엇인가를 ‘보냈다’고만 하며 사람을 보냈다고 명시하지 않습니다. 앞선 ‘기록했다’와 결부하여 ‘써 보내다’로 옮기면 불필요한 구체화를 피할 수 있습니다.
  - severity: low
    issue: 요청 내용의 수혜자와 병력의 목적이 다소 불명확함
    rationale: ‘그에게 도움으로 쓸 군대’는 한국어상 왕이 누구에게 보내는지와 군대의 성격이 다소 어색합니다. ‘프톨레마이오스에게 지원군을 보내고’가 원문의 여격 αὐτῷ와 εἰς βοήθειαν을 명료하게 반영합니다.
  revised_text: 프톨레마이오스는 이 내용을 왕에게 써 보내어, 왕이 프톨레마이오스에게 지원군을 보내고 그들의 나라와 도시들을 넘겨주도록 요청했습니다.
