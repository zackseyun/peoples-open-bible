base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/023.yaml
  text: Therefore the Creator of the world, who formed the origin of man and devised the origin of all things, will in mercy give back to you both breath and life, since you now disregard yourselves for the sake of his laws.
translation:
  language: ko
  text: 그러므로 세상의 창조주이시며 사람의 생겨남을 빚으시고 만물의 기원을 마련하신 분께서, 자비로 너희에게 숨과 생명을 다시 돌려주실 것입니다. 너희가 이제 그분의 법들을 위해 자신을 아끼지 않기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τοῦ κόσμου κτίστης
  english_pob_choice: the Creator of the world
  chosen_korean: 세상의 창조주
  alternatives_korean:
  - 세계를 지으신 분
  - 세계의 창조자
  lexicon: κτίστης
  rationale: κόσμος를 ‘세상’으로 옮기고 κτίστης는 창조 행위를 드러내는 ‘창조주’로 옮겨, 창조주 칭호의 힘을 살렸습니다.
- source_word: ὁ πλάσας ἀνθρώπου γένεσιν καὶ πάντων ἐξευρὼν γένεσιν
  english_pob_choice: who formed the origin of man and devised the origin of all things
  chosen_korean: 사람의 기원을 지으시고 만물의 기원을 찾아내신 분
  alternatives_korean:
  - 사람의 생성을 빚으시고 만물의 생성을 찾아내신 분
  - 인간의 시작을 만드시고 모든 것의 시작을 찾아내신 분
  lexicon: πλάσας / γένεσις / ἐξευρών
  rationale: γένεσις를 단순한 ‘출생’보다 원초적 ‘기원’으로 옮기고, ἐξευρών은 ‘찾아내다’로 옮겨 창조적 지혜의 탐지 의미를 반영했습니다.
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν
  english_pob_choice: both breath and life
  chosen_korean: 숨과 생명
  alternatives_korean:
  - 영과 생명
  - 호흡과 생명
  lexicon: πνεῦμα / ζωή
  rationale: 영적 존재를 뜻하는 문맥이 아니므로 πνεῦμα를 ‘숨’으로 옮겨, POB의 개정된 영어 선택인 ‘breath’에 맞추었습니다.
- source_word: τοὺς αὐτοῦ νόμους
  english_pob_choice: his laws
  chosen_korean: 그분의 법들
  alternatives_korean:
  - 그분의 율법
  - 그분의 규정들
  lexicon: νόμος
  rationale: 복수형 νόμους를 살려 ‘법들’로 옮기되, 유대교적 토라 문맥을 과도하게 좁히지 않도록 했습니다.
theological_decisions:
- issue: πνεῦμα의 번역이 이 구절에서 ‘영’인지 ‘숨’인지
  chosen_reading: ‘숨’으로 번역했습니다.
  alternative_readings:
  - ‘영’으로 번역
  - ‘호흡’으로 번역
  rationale: 문맥은 죽음 이후의 회복을 말하지만, POB 영어 본문이 ‘breath and life’로 수정한 점과 함께 생물학적 생명력의 회복을 강조하므로 ‘숨’이 가장 직접적입니다.
  doctrine_reference: 창 2:7; 전 12:7
- issue: τοὺς αὐτοῦ νόμους의 뉘앙스
  chosen_reading: ‘그분의 법들’로 옮겼습니다.
  alternative_readings:
  - ‘그분의 율법들’
  - ‘그분의 계명들’
  rationale: 순교자들이 하나님의 명령을 위해 고난받는 맥락이지만, 복수형을 유지해 개별적 요구들의 집합이라는 문법을 드러냈습니다.
  doctrine_reference: 시 119편; 2마카 7장 문맥
