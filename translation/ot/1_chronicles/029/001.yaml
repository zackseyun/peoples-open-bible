translation:
  text: Then King David said to the whole assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great, for this temple[a] is not for a human being but for Yahweh God.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “palace,” presenting the temple as God’s royal dwelling.
    reason: lexical_alternative
