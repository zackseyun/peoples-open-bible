reference: Genesis 34:7
source:
  edition: WLC
  text: וּ/בְנֵ֨י יַעֲקֹ֜ב בָּ֤אוּ מִן הַ/שָּׂדֶה֙ כְּ/שָׁמְעָ֔/ם וַ/יִּֽתְעַצְּבוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹ֑ד כִּֽי נְבָלָ֞ה עָשָׂ֣ה בְ/יִשְׂרָאֵ֗ל לִ/שְׁכַּב֙ אֶת בַּֽת יַעֲקֹ֔ב וְ/כֵ֖ן לֹ֥א יֵעָשֶֽׂה־־־־׃
translation:
  text: Jacob’s sons came in from the field when they heard what had happened. The men were grieved and burning with anger, because Shechem had done an outrageous thing[a] in Israel by lying with Jacob’s daughter—a thing that must never be done.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Hebrew nebalah, a gross outrage that breaks the moral bonds of the community; the same words recur in 2 Samuel 13:12.
    reason: lexical_alternative
