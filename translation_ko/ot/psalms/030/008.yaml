  terminology: יְהוָה는 초안의 프로젝트 용례를 따라 ‘야훼’로, אֲדֹנָי의 1인칭 소유 표현은 ‘저의 주님’으로 옮겼습니다. ‘은혜를 간구하다’는 אֶתְחַנָּן의 ‘자비/은총을 애원하다’를 충실히 반영합니다.
