  revised_text: “이는 야훼의 말씀으로 내게 말씀이 임하였기 때문입니다. ‘너는 그곳에서 떡을 먹지도 말고 물도 마시지 말라. 네가 갔던 길로 다시 돌아오지 말라’ 하였습니다.”
