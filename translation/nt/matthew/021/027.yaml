  tier: 1
  from: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
  to: So they answered Jesus, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
  rationale: The literal rendering of the redundant participle construction ('answering... they said') is somewhat wooden in English. Collapsing it into a finite verb ('So they answered Jesus' or 'They answered Jesus, saying') improves naturalness while remaining faithful to the text under an optimal-equivalence philosophy. In English, 'He also said' can be slightly ambiguous, potentially implying that Jesus was adding a second statement to something he had already said. The Greek 'καὶ αὐτός' here marks a reciprocal response ('he himself' or 'he in turn'). Adjusting the phrasing avoids this minor ambiguity.
