translation:
  language: en
  text: Peter said to them, “Repent. Every one of you must be baptized in the name of Jesus Christ[a] for the forgiveness of your sins.[b] You will receive the gift of the Holy Spirit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
    reason: alternative_reading
  - marker: b
