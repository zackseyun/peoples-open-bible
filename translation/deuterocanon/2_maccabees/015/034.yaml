translation:
  text: They all blessed the Lord who had made himself known[a], lifting their praise to heaven and saying, “Blessed is he who has kept his own sanctuary undefiled.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “the glorious Lord.”
