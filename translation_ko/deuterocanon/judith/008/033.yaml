revisions:
- from: 당신들은 오늘 밤 문에서 서 있어야 합니다. 나는 내 여종과 함께 나가겠습니다. 그리고 당신들이 우리 원수들에게 성을 넘겨 주겠다고 말한 날들 안에, 주님께서 내 손을 통해 이스라엘을 돌보실 것입니다.
  to: 당신들은 오늘 밤 성문에 서 계십시오. 나는 내 여종과 함께 나가겠습니다. 그리고 당신들이 우리 원수들에게 이 성읍을 넘겨주겠다고 말한 그 날들이 지나기 전에, 주님께서 내 손으로 이스라엘을 돌아보실 것입니다.
  rationale: 그리스어의 지시형 미래가 지닌 명령적 기능을 합쇼체 지시로 자연스럽게 옮기고, 성읍을 넘기기로 정한 기한이라는 시간 관계를 분명히 했습니다. 또한 πόλις와 ἐπισκέπτομαι의 의미 범위를 불필요하게 좁히지 않도록 각각 ‘성읍’과 ‘돌아보시다’를 사용했습니다.
