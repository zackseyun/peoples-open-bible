  text: תַּ֣עַן לְ֭שׁוֹנִ/י אִמְרָתֶ֑/ךָ כִּ֖י כָל מִצְוֺתֶ֣י/ךָ צֶּֽדֶק־׃
translation:
  text: My tongue will sing of your promise, for all your commandments are righteous.
  philosophy: dynamic
lexical_decisions:
- source_word: אִמְרָתֶךָ
  chosen: promise
  alternatives:
  - word
  - saying
  lexicon: HALOT
  rationale: אִמְרָה in this psalm repeatedly denotes God's committed utterance on which the psalmist stakes his life; rendered 'promise' to distinguish it from דָּבָר ('word'), with 'word/saying' as alternatives.
- source_word: מִצְוֺתֶיךָ
  chosen: commandments
  alternatives:
  - command
  - orders
  lexicon: HALOT
  rationale: מִצְוָה/מִצְוֺת are God's authoritative commandments. Rendered 'commandment(s)' consistently across the psalm's eight terms.
