  preserved_meaning: The blessing associated with Abraham extends to the Gentiles.
  reasoning_layer_used: Lexical decisions for εὐλογία, τοῦ Ἀβραὰμ, γένηται, and ἔθνη
  rationale: The active wording is clearer while preserving the Jew-Gentile contrast.
- pob_phrase: in Messiah Jesus
  simplified_phrase: in Messiah Jesus
  preserved_meaning: The wording retains the Messiah-centered or union dimension without reducing it to means.
  reasoning_layer_used: Lexical and theological decision for ἐν Χριστῷ Ἰησοῦ
  rationale: Keeping “in” preserves the phrase’s contextual range and the POB’s title choice.
