id: JOB.8.8
reference: Job 8:8
source:
  edition: WLC
  text: כִּֽי שְׁאַל נָ֭א לְ/דֹ֣ר רִישׁ֑וֹן וְ֝/כוֹנֵ֗ן לְ/חֵ֣קֶר אֲבוֹתָֽ/ם־־׃
translation:
  text: For inquire, please, of a former generation, and consider what their ancestors discovered.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - Surely
  - Because
  lexicon: HALOT
  rationale: Here כִּי introduces Bildad's supporting exhortation, functioning naturally as a discourse connector giving grounds for what precedes. 'For' best preserves that relation in English.
- source_word: שְׁאַל נָא
  chosen: inquire, please
  alternatives:
  - ask now
  - inquire, please
  lexicon: HALOT
  rationale: This naturally renders the imperative and the polite or entreating particle without the awkward wording “please ask” after “For.”
- source_word: לְדֹר רִישׁוֹן
  chosen: of a former generation
  alternatives:
  - a former generation
  - the generation before
  - the first generation
  lexicon: HALOT
  rationale: The phrase refers to an earlier generation; the indefinite article is natural because the Hebrew phrase lacks the article.
- source_word: וְכוֹנֵן
  chosen: consider
  alternatives:
  - set your mind to
  - direct your attention to
  - prepare yourself for
  lexicon: HALOT
  rationale: From כון in the imperative, the sense here is to fix or direct oneself attentively toward something. 'Consider' is concise, idiomatic, and fits the parallel with 'ask'.
- source_word: לְחֵקֶר
  chosen: the findings
  alternatives:
  - the search
  - the investigation
  - what has been searched out
  lexicon: HALOT
  rationale: חֵקֶר denotes searching, investigation, or what is discovered by inquiry. Because the object is the accumulated wisdom of the ancestors, 'the findings' communicates the result of investigation in natural English.
- source_word: אֲבוֹתָם
  chosen: their fathers
  alternatives:
  - their ancestors
  lexicon: HALOT
  rationale: 'The suffix most naturally refers back to the former generation: their fathers, i.e., the ancestors of that earlier generation. ''Fathers'' preserves the Hebrew wording and the text''s gendered ancestral idiom; ''ancestors'' is a possible smoothing but less literal.'
- source_word: לְחֵקֶר אֲבוֹתָם
  chosen: what their fathers discovered
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This expresses the contextually suitable result-of-inquiry sense in natural English, while the footnote retains the possible action sense “investigation.”
