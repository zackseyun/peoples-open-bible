id: PRO.12.10
reference: Proverbs 12:10
source:
  edition: WLC
  text: יוֹדֵ֣עַ צַ֭דִּיק נֶ֣פֶשׁ בְּהֶמְתּ֑/וֹ וְֽ/רַחֲמֵ֥י רְ֝שָׁעִ֗ים אַכְזָרִֽי׃
translation:
  text: A righteous man attends to his animal's needs[a], but even the compassion of the wicked is cruel.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “knows the life of his animal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדֵעַ
  chosen: understands
  alternatives:
  - cares for
  - understands
  lexicon: HALOT
  rationale: With this object, the verb conveys attentive knowledge of the animal’s condition, for which “understands” is natural English.
- source_word: צַדִּיק
  chosen: a righteous man
  alternatives:
  - the righteous
  - a righteous person
  lexicon: HALOT
  rationale: צַדִּיק refers to a righteous person. Because the Hebrew form is grammatically masculine singular and proverbial, 'a righteous man' preserves the gendered singular form in keeping with the project's gender-accurate policy, while functioning generically in wisdom literature.
- source_word: נֶפֶשׁ
  chosen: the needs
  alternatives:
  - the soul
  - the needs
  - the appetite
  lexicon: HALOT
  rationale: Here the term refers idiomatically to the animal’s living condition and needs; the literal “life” is retained in the note.
- source_word: בְּהֶמְתּוֹ
  chosen: his animal
  alternatives:
  - his beast
  - his livestock
  - his cattle
  lexicon: HALOT
  rationale: בְּהֵמָה can denote beast, domestic animal, or livestock. Singular with suffix here is well rendered 'his animal,' which is natural modern English and broad enough not to restrict the reference to cattle alone.
- source_word: רַחֲמֵי
  chosen: the compassion
  alternatives:
  - the mercies
  - the tender mercies
  - the pity
  lexicon: HALOT
  rationale: From רחם, the plural construct often expresses acts or feelings of compassion/mercy. 'Compassion' is idiomatic and clear in modern English while preserving the emotional-ethical sense.
- source_word: רְשָׁעִים
  chosen: the wicked
  alternatives:
  - wicked people
  - the guilty
  lexicon: HALOT
  rationale: Standard rendering for the plural adjective/substantive in wisdom literature. 'The wicked' is concise and idiomatic.
- source_word: אַכְזָרִי
  chosen: cruel
  alternatives:
  - merciless
  - harsh
  lexicon: HALOT
  rationale: 'אַכְזָרִי means cruel, pitiless, merciless. ''Cruel'' is the most direct and forceful English equivalent and fits the proverb''s irony: even what the wicked call compassion is cruelty.'
