  rationale: Preserves the verse’s temporal link to the preceding narrative without specifying which events are meant.
- source_word: ተከብተ
  chosen: was hidden
  alternatives:
  - was concealed
  rationale: Retains the passive wording and repeats it in the question of where Enoch had been hidden.
- source_word: ውሉደ፡ ሰብእ
  chosen: children of men
  alternatives:
  - human beings
  rationale: Preserves the source’s kinship expression rather than reducing it to a general term.
- source_word: ወምንት፡ ኮነ
  chosen: or what had become of him
  alternatives:
  - or what happened to him
  rationale: Expresses the question idiomatically while leaving Enoch’s fate unspecified.
