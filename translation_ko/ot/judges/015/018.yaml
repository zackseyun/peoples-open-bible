  source_fidelity: 원문의 시간 진행은 삼손이 전투 후에 ‘몹시 목이 말랐고’ 이어 여호와께 호소한 것입니다. 초안의 ‘목마르므로’는 목마름을 부르짖음의 원인으로 강하게 연결하므로, 단순한 연속 서술로 고치는 것이 더 충실합니다. 또한 בְּיַד עַבְדְּךָ의 수단·매개 표현은 ‘주의 종의 손으로’로 살렸고, הָעֲרֵלִים의 복수형도 ‘할례받지 않은 자들’로 반영했습니다.
  naturalness: ‘심히 목마르므로’와 ‘이르되’는 현대 표준어 합쇼체 서술로는 다소 문어적·고전적입니다. 현대적인 서술과 직접 인용으로 정리하고, 기도 안의 수사 의문문도 자연스러운 합쇼체로 다듬었습니다.
  terminology: 여호와는 한국어 성경에서 확립된 יְהוָה의 명칭으로 유지했습니다. תְּשׁוּעָה는 이 문맥에서 군사적 구출과 신학적 의미를 함께 지닌 ‘구원’으로 옮길 수 있습니다. ‘할례받지 않은 자들’은 원문의 언약적으로 표지된 표현을 보존하며, 각주에서 직접 지시 대상인 블레셋 사람들을 보충합니다.
  issues:
  - severity: medium
    issue: ‘그가 심히 목마르므로’
    rationale: וַיִּצְמָא מְאֹד는 ‘그가 몹시 목이 말랐다’라는 사건 서술입니다. ‘-므로’는 원문에 없는 인과 관계를 전면화합니다.
  - severity: medium
    issue: ‘주의 종의 손에 이 큰 구원을 주셨사오니’
    rationale: בְּיַד עַבְדְּךָ는 여기서 ‘주의 종의 손으로/통하여’라는 매개·수단을 나타냅니다. 한국어 ‘손에 ... 주셨다’는 구원을 종에게 넘겨주었다는 의미로 읽힐 수 있습니다.
  - severity: low
    issue: ‘할례 받지 아니한 자’
    rationale: 원문 הָעֲרֵלִים은 복수형입니다. 현대 맞춤법에 따라 ‘할례받지 않은 자들’로 쓰는 것이 자연스럽습니다.
  revised_text: 그가 몹시 목이 말라 여호와께 부르짖어 말했습니다. “주께서 주의 종의 손으로 이 큰 구원을 베푸셨는데, 이제 제가 목말라 죽고 할례받지 않은 자들의 손에 떨어지겠습니까?”
