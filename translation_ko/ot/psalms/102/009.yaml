  lexicon: HALOT
  rationale: 히브리어 전치사 בִּי의 구문을 살려 직역하면서, POB 각주가 지적한 호의적 맹세가 아니라 경멸·저주의 용법일 수 있다는 긴장을 본문에 유지했습니다.
theological_decisions:
- issue: 나를 두고 맹세한다는 표현의 의미
  chosen_reading: 본문은 단순한 중립적 맹세보다, 시편 기자를 경멸하거나 저주 공식의 대상으로 삼는 적대적 언어를 함축할 수 있습니다.
  alternative_readings:
  - 그를 기준으로 맹세한다
  - 그를 가리켜 맹세한다
  - 그의 이름을 저주 공식으로 삼는다
  rationale: 원문과 POB 주석의 난해함을 지우지 않고, 독자가 본문을 적대적 수치 언어로 읽을 가능성을 열어 두었습니다.
  doctrine_reference: 시편의 탄식과 원수의 수치 언어에 대한 이해
