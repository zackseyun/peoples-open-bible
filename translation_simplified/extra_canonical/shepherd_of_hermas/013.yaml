base_translation:
  text: 'V.1. “Listen now about the stones that go into the building. The stones, then, that are square
    and white and that fit together at their joints[a]—these are the apostles and bishops[b] and teachers
    and deacons[c], who walked in the reverent dignity of God[d] and who oversaw and taught and served
