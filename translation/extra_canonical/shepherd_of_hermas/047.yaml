reference: Shepherd of Hermas — Similitude 1
unit: section
book: Shepherd of Hermas
source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Λέγει μοι· Οἴδατε ὅτι ἐπὶ ξένης κατοικεῖτε ὑμεῖς οἱ δοῦλοι τοῦ Θεοῦ· ἡ γὰρ πόλις ὑμῶν μακράν ἐστιν
    ἀπὸ τῆς πόλεως ταύτης· εἰ οὖν οἴδατε τὴν πόλιν ὑμῶν ἐν ᾗ μέλλετε κατοικεῖν, τί ὧδε ὑμεῖς ἑτοιμάζετε
    ἀγροὺς καὶ παρατάξεις πολυτελεῖς καὶ οἰκοδομὰς καὶ οἰκήματα μάταια; 2. ταῦτα οὖν ὁ ἑτοιμάζων εἰς ταύτην
    τὴν πόλιν οὐ διανοεῖται ἐπανακάμψαι εἰς τὴν ἰδίαν πόλιν. 3. ἄφρον καὶ δίψυχε καὶ ταλαίπωρε ἄνθρωπε,
    οὐ νοεῖς ὅτι ταῦτα πάντα ἀλλότριά ἐστι, καὶ ὑπ᾽ ἐξουσίαν ἑτέρου εἰσίν; ἐρεῖ γὰρ ὁ κύριος τῆς πόλεως
    ταύτης· Οὐ θέλω σε κατοικεῖν εἰς τὴν πόλιν μου, ἀλλ᾽ ἔξελθε ἐκ τῆς πόλεως ταύτης, ὅτι τοῖς νόμοις
    μου οὐ χρᾶσαι. 4. σὺ οὖν ἔχων ἀγροὺς καὶ οἰκήσεις καὶ ἑτέρας ὑπάρξεις πολλάς, ἐκβαλλόμενος ὑπ᾽ αὐτοῦ
    τί ποιήσεις σου τὸν ἀγρὸν καὶ τὴν οἰκίαν καὶ τὰ λοιπὰ ὅσα ἡτοίμασας σεαυτῷ; λέγει γάρ σοι δικαίως
    ὁ κύριος τῆς χώρας ταύτης· Ἢ τοῖς νόμοις μου χρῶ, ἢ ἐκχώρει ἐκ τῆς χώρας μου. 5. σὺ οὖν τί μέλλεις
    ποιεῖν, ἔχων νόμον ἐν τῇ σῇ πόλει; ἕνεκεν τῶν ἀγρῶν σου καὶ τῆς λοιπῆς ὑπάρξεως τὸν νόμον σου πάντως
    ἀπαρνήσῃ καὶ πορεύσῃ τῷ νόμῳ τῆς πόλεως ταύτης; βλέπε μὴ ἀσύμφορόν ἐστιν ἀπαρνῆσαι τὸν νόμον σου·
    ἐὰν γὰρ ἐπανακάμψαι θελήσῃς εἰς τὴν πόλιν σου, οὐ μὴ παραδεχθήσῃ [ὅτι ἀπηρνήσω τὸν νόμον τῆς πόλεώς
    σου,] καὶ ἐκκλεισθήσῃ ἀπ᾿ αὐτῆς. 6. βλέπε οὖν σύ· ὡς ἐπὶ ξένης κατοικῶν μηδὲν πλέον ἑτοίμαζε σεαυτῷ
    εἰ μὴ τὴν αὐτάρκειαν τὴν ἀρκετήν σοι, καὶ ἕτοιμος γίνου, ἵνα ὅταν θέλῃ ὁ δεσπότης τῆς πόλεως ταύτης
    ἐκβαλεῖν σε ἀντιταξάμενον τῷ νόμῳ αὐτοῦ, ἐξέλθῃς ἐκ τῆς πόλεως αὐτοῦ καὶ ἀπέλθῃς εἰς τὴν πόλιν σου,
    καὶ τῷ σῷ νόμῳ χρήσῃ ἀνυβρίστως ἀγαλλιώμενος. 7. βλέπετε οὖν ὑμεῖς οἱ δουλεύοντες τῷ Θεῷ καὶ ἔχοντες
    αὐτὸν εἰς τὴν καρδίαν· ἐργάζεσθε τὰ ἔργα τοῦ Θεοῦ μνημονεύοντες τῶν ἐντολῶν αὐτοῦ καὶ τῶν ἐπαγγελιῶν
    ὧν ἐπηγγείλατο, καὶ πιστεύσατε αὐτῷ ὅτι ποιήσει αὐτάς, ἐὰν αἱ ἐντολαὶ αὐτοῦ φυλαχθῶσιν. 8. ἀντὶ ἀγρῶν
    οὖν ἀγοράζετε ψυχὰς θλιβομένας, καθά τις δυνατός ἐστιν, καὶ χήρας καὶ ὀρφανοὺς ἐπισκέπτεσθε, καὶ μὴ
    παραβλέπετε αὐτούς, καὶ τὸν πλοῦτον ὑμῶν καὶ τὰς παρατάξεις πάσας εἰς τοιούτους ἀγροὺς καὶ οἰκίας
    δαπανᾶτε, ἃς ἐλάβετε παρὰ τοῦ Θεοῦ. 9. εἰς τοῦτο γὰρ ἐπλούτισεν ὑμᾶς ὁ δεσπότης, ἵνα ταύτας τὰς διακονίας
    τελέσητε αὐτῷ· πολὺ βέλτιόν ἐστι τοιούτους ἀγροὺς ἀγοράζειν [καὶ κτήματα] καὶ οἴκους, οὓς εὑρήσεις
    ἐν τῇ πόλει σου, ὅταν ἐπιδημήσῃς εἰς αὐτήν. 10. αὕτη ἡ πολυτέλεια καλὴ καὶ ἱλαρά, λύπην μὴ ἔχουσα
    μηδὲ φόβον, ἔχουσα δὲ χαράν. τὴν οὖν πολυτέλειαν τῶν ἐθνῶν μὴ πράσσετε· ἀσύμφορον γάρ ἐστιν ὑμῖν τοῖς
    δούλοις τοῦ Θεοῦ· 11. τὴν δὲ ἰδίαν πολυτέλειαν πράσσετε, ἐν ᾗ δύνασθε χαρῆναι καὶ μὴ παραχαράσσετε,
    μηδὲ τοῦ ἀλλοτρίου ἅψησθε μηδὲ ἐπιθυμεῖτε αὐτοῦ· πονηρὸν γάρ ἐστιν ἀλλοτρίων ἐπιθυμεῖν. τὸ δὲ σὸν
    ἔργον ἐργάζου, καὶ σωθήσῃ.
