  meaning: John leads his hesitant troops across the stream by crossing first himself.
  meaning_decisions:
  - source_phrase: αὐτὸς καὶ ὁ λαὸς αὐτοῦ
    prior_rendering: he himself and his people
    new_rendering: John and his troops
    rationale: Simon has delegated the fighting to his sons, and verse 9 identifies John as the continuing commander; naming him prevents readers from assuming that the elderly Simon leads the crossing.
  - source_phrase: παρενέβαλεν κατὰ πρόσωπον αὐτῶν
    prior_rendering: encamped opposite them
    new_rendering: took up positions facing the enemy
    rationale: Here the military verb describes deployment opposite an approaching enemy, without necessarily implying another overnight camp.
  - source_phrase: τὸν λαὸν … οἱ ἄνδρες
    prior_rendering: the people … the men
    new_rendering: his men … His men
    rationale: These are the soldiers under John’s command, not the civilian population.
  - source_phrase: τὸν χειμάρρουν
    prior_rendering: the wadi
    new_rendering: the stream
    rationale: This retains the terminology established in verse 5, where the seasonal-watercourse sense is explained.
  footnote_kinds: {}
  history_weighed: The lexical rationale mistakenly attributes the leading action to Simon, although the chapter’s succession scene and verse 9 point to John. I preserve the earlier distinction between fear and moral cowardice, while clarifying the commander and the troops’ deployment.
