id: PSA.119.160
reference: Psalms 119:160
source:
  edition: WLC
  text: רֹאשׁ דְּבָרְ/ךָ֥ אֱמֶ֑ת וּ֝/לְ/עוֹלָ֗ם כָּל מִשְׁפַּ֥ט צִדְקֶֽ/ךָ־־׃
translation:
  text: The sum of your word is truth[a], and every one of your righteous ordinances endures forever.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, Your word has been true from the beginning.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבָרְךָ
  chosen: word
  alternatives:
  - matter
  - thing
  lexicon: HALOT
  rationale: דָּבָר is God's spoken word. Rendered 'word' consistently; paired with אִמְרָה ('promise') the two utterance-terms stay distinct.
- source_word: מִשְׁפַּט
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone of 'judgments'; 'judgments/rules' preserved as alternatives.
