  text: Οἱ δὲ ἐπιδεδωκότες τὰς ῥάβδους ἥμισυ μὲν χλωράς, ἥμισυ δὲ ξηράς, οὗτοί εἰσιν οἱ ἐν ταῖς πραγματείαις
    ἐμπεφυρμένοι καὶ μὴ κολλώμενοι τοῖς ἁγίοις. διὰ τοῦτο τὸ ἥμισυ αὐτῶν ζῇ, τὸ δὲ ἥμισυ νεκρόν ἐστι.
    2. πολλοὶ οὖν ἀκούσαντές μου τῶν ἐντολῶν μετενόησαν. ὅσοι γοῦν μετενόησαν, ἡ κατοικία αὐτῶν εἰς τὸν
    πύργον. τινὲς δὲ αὐτῶν εἰς τέλος ἀπέστησαν. οὗτοι οὖν μετάνοιαν οὐκ ἔχουσιν· διὰ γὰρ τὰς πραγματείας
    αὐτῶν ἐβλασφήμησαν τὸν Κύριον καὶ ἀπηρνήσαντο. ἀπώλεσαν οὖν τὴν ζωὴν αὐτῶν διὰ τὴν πονηρίαν ἣν ἔπραξαν.
    3. πολλοὶ δὲ ἐξ αὐτῶν ἐδιψύχησαν. οὗτοι ἔτι ἔχουσι μετάνοιαν ἐὰν ταχὺ μετανοήσωσι, καὶ ἔσται αὐτῶν
    ἡ κατοικία εἰς τὸν πύργον· ἐὰν δὲ βραδύτερον μετανοήσωσι, κατοικήσουσιν εἰς τὰ τείχη· ἐὰν δὲ μὴ μετανοήσωσι,
    καὶ αὐτοὶ ἀπώλεσαν τὴν ζωὴν αὐτῶν. 4. οἱ δὲ τὰ δύο μέρη χλωρά, τὸ δὲ τρίτον ξηρὸν ἐπιδεδωκότες, οὗτοί
    εἰσιν οἱ ἀρνησάμενοι ποικίλαις ἀρνήσεσι. 5. πολλοὶ οὖν μετενόησαν ἐξ αὐτῶν, καὶ ἀπῆλθον εἰς τὸν πύργον
    κατοικεῖν· πολλοὶ δὲ ἀπέστησαν εἰς τέλος τοῦ Θεοῦ· οὗτοι τὸ ζῆν εἰς τέλος ἀπώλεσαν. τινὲς δὲ ἐξ αὐτῶν
    ἐδιψύχησαν καὶ ἐδιχοστάτησαν. τούτοις οὖν ἐστὶ μετάνοια, ἐὰν ταχὺ μετανοήσωσι καὶ μὴ ἐπιμείνωσι ταῖς
    ἡδοναῖς αὐτῶν· ἐὰν δὲ ἐπιμείνωσι ταῖς πράξεσιν αὐτῶν, καὶ οὗτοι θάνατον ἑαυτοῖς κατεργάζονται.
