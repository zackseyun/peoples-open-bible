source:
  edition: WLC
  text: כִּֽי לְ/ךָ֣ יְהוָ֣ה הוֹחָ֑לְתִּי אַתָּ֥ה תַ֝עֲנֶ֗ה אֲדֹנָ֥/י אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/015.yaml
  text: For I wait for you[a], Yahweh; you will answer[b], O Lord my God.
  footnotes:
  - marker: a
    text: The Hebrew is literally “For you, Yahweh, I have waited/hoped.” The verb can also be rendered “I have hoped” or “I have waited in hope.”
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew leaves the object unstated: “you will answer.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 제가 주님을 기다려 왔으므로, 주님, 저의 하나님이시여, 주님께서 응답하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֱהִי
  english_pob_choice: And I became
  chosen_korean: 저는 … 같아졌고
  alternatives_korean:
  - 저는 … 되었습니다
  - 그리고 저는 … 이었습니다
  lexicon: HALOT
  rationale: 상태의 변화를 나타내는 wayyiqtol의 흐름을 살려, 단순 과거 '이었습니다'보다 변화가 드러나는 '같아졌고'로 옮겼습니다.
- source_word: כְּאִישׁ
  english_pob_choice: like a man
  chosen_korean: 사람과 같아졌고
  alternatives_korean:
  - 남자와 같아졌고
  - 한 사람과 같아졌고
  lexicon: HALOT
  rationale: 히브리어의 אִישׁ는 문자적으로 '남자'이지만, 한국어에서는 대표적 인간 일반을 가리키는 비교이므로 문맥을 해치지 않는 '사람'으로 옮겼습니다.
- source_word: אֲשֶׁר לֹא שֹׁמֵעַ
  english_pob_choice: who does not hear
  chosen_korean: 듣지 못하는
  alternatives_korean:
  - 듣지 않는
  - 들을 수 없는
  lexicon: HALOT
  rationale: שׁמע는 여기서 청각적 '듣다'와 응답적 '듣다'가 겹치지만, 앞뒤의 침묵 대비를 살리기 위해 직역에 가까운 '듣지 못하는'을 택했습니다.
- source_word: תּוֹכָחוֹת
  english_pob_choice: reproofs
  chosen_korean: 책망
  alternatives_korean:
  - 반박
  - 변론
  - 대답
  lexicon: HALOT
  rationale: 이 단어는 책망, 논박, 반론, 응답을 아우를 수 있으나, 시편 문맥의 침묵을 고려할 때 한국어로는 가장 포괄적이면서도 형식적인 '책망'이 적절합니다.
