id: JOB.34.13
reference: Job 34:13
source:
  edition: WLC
  text: מִֽי פָקַ֣ד עָלָ֣י/ו אָ֑רְצָ/ה וּ/מִ֥י שָׂ֝֗ם תֵּבֵ֥ל כֻּלָּֽ/הּ־׃
translation:
  text: Who appointed him over the earth, and who put the whole world under his charge?
  philosophy: dynamic
lexical_decisions:
- source_word: פָקַד
  chosen: appointed
  alternatives:
  - charged
  - entrusted
  - visited
  - oversaw
  lexicon: HALOT
  rationale: In this context פקד with עַל conveys assigning responsibility or authority over something/someone. 'Appointed' best captures the rhetorical question about whether anyone placed the earth under God's administration. 'Charged' or 'entrusted' are possible but less natural in English here.
- source_word: עָלָיו
  chosen: over him
  alternatives:
  - upon him
  - concerning him
  lexicon: HALOT
  rationale: The preposition עַל with pronominal suffix most naturally means 'over him' in this governance context. The suffix refers to God in Elihu's argument. 'Upon him' is more literal but less idiomatic; 'concerning him' does not fit the sense.
- source_word: אָרְצָה
  chosen: the earth
  alternatives:
  - the land
  lexicon: HALOT
  rationale: אֶרֶץ can mean 'land' or 'earth.' Here, paired with תבל ('world'), the cosmic scope favors 'the earth' rather than a local 'land.' The directional/paragogic ending does not materially alter the English rendering in this clause.
- source_word: שָׂם
  chosen: set
  alternatives:
  - placed
  - established
  lexicon: HALOT
  rationale: שׂים commonly means 'put, place, set.' 'Set' is concise and fits the parallelism with the first colon. 'Established' is interpretive and slightly stronger than the base verb.
- source_word: תֵּבֵל
  chosen: the world
  alternatives:
  - the inhabited world
  lexicon: HALOT
  rationale: תבל commonly denotes the world in its inhabited, ordered sense. 'The world' is the most natural English equivalent; 'the inhabited world' is more explicit but heavier than the context requires.
- source_word: כֻּלָּהּ
  chosen: the whole
  alternatives:
  - all of it
  - its entirety
  lexicon: HALOT
  rationale: The suffix refers back to תבל, intensifying totality. Rendering it with 'the whole world' preserves the emphasis in idiomatic English.
- source_word: פָקַד עָלָיו אָרְצָה
  chosen: appointed him over the earth
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The person marked by the suffix is the one assigned oversight; the earth is the sphere entrusted to him.
- source_word: וּמִי שָׂם תֵּבֵל כֻּלָּהּ
  chosen: and who put the whole world under his charge
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The elliptical second question continues the commissioning/entrusting sense of the first colon.
