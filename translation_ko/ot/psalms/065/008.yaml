  text: Those who dwell at the ends of the earth fear[b] because of your signs; you make the dawn and the evening[a] shout for joy.
  footnotes:
  - marker: a
    text: Literally, 'the outgoings of morning and evening.' The phrase poetically refers to dawn and dusk, or to the places/times where morning and evening emerge.
    reason: lexical_alternative
  - marker: b
    text: Or 'stand in awe because of your signs.' The Hebrew verb can express fear, dread, or reverent awe.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅 끝에 사는 이들이 주의 표징 때문에 두려워합니다.[a] 주께서는 아침과 저녁이 시작되는 곳들을 기쁨으로 외치게 하십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 표징을 보고 경외합니다.’ 히브리어 동사는 두려움, 공포, 경외를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘아침과 저녁의 나아감들’입니다. 이 시적 표현은 새벽과 해질녘, 또는 그것들이 나타나는 곳이나 때를 가리킬 수 있습니다.
