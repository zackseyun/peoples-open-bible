id: LEV.9.10
reference: Leviticus 9:10
source:
  edition: WLC
  text: וְ/אֶת הַ/חֵ֨לֶב וְ/אֶת הַ/כְּלָיֹ֜ת וְ/אֶת הַ/יֹּתֶ֤רֶת מִן הַ/כָּבֵד֙ מִן הַ֣/חַטָּ֔את הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
translation:
  text: He burned the fat, the kidneys, and the lobe of the liver from the sin offering on the altar as an offering[a], just as Yahweh had commanded Moses.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “made them go up in smoke on the altar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  chosen: fat
  alternatives:
  - fat portions
  lexicon: HALOT
  rationale: In sacrificial contexts חֵלֶב refers to the fatty portions reserved for offering. 'Fat' is the most direct rendering; 'fat portions' is possible but slightly more interpretive.
- source_word: כְּלָיֹת
  chosen: kidneys
  lexicon: HALOT
  rationale: The anatomical reference is straightforward. 'Kidneys' preserves the concrete sacrificial detail of the Hebrew.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  chosen: the lobe from the liver
  alternatives:
  - the appendage of the liver
  - the long lobe of the liver
  lexicon: HALOT
  rationale: This phrase denotes the extra lobe/appendage associated with the liver removed in sacrifice. 'Lobe from the liver' is readable modern English while staying close to the Hebrew construction.
- source_word: חַטָּאת
  chosen: sin offering
  alternatives:
  - purification offering
  lexicon: HALOT
  rationale: While some argue that חַטָּאת in priestly sacrificial contexts can be rendered 'purification offering,' 'sin offering' remains the clearest and most widely recognized rendering here. The alternative is worth preserving because it reflects a legitimate scholarly nuance about the offering's function.
- source_word: הִקְטִיר
  chosen: turned into smoke
  alternatives:
  - burned
  - offered up in smoke
  lexicon: HALOT
  rationale: The Hiphil of קטר in sacrificial contexts refers specifically to causing an offering to go up in smoke on the altar, not merely generic burning. 'Turned into smoke' preserves that cultic nuance better than simply 'burned.'
- source_word: הַמִּזְבֵּחָה
  chosen: on the altar
  alternatives:
  - to the altar
  lexicon: HALOT
  rationale: With the directional ending, the form can indicate motion toward the altar, but in English the idiomatic sacrificial expression is 'on the altar,' especially with הִקְטִיר.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives: []
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
