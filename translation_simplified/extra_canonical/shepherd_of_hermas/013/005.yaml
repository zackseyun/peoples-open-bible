  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/005.yaml
  text: '“And those whom they were casting away and throwing aside—who are they?” “These are people who have sinned and want to repent. For this reason they were not flung far away outside the tower, because they will be useful for the building, if they repent. Therefore those who are going to repent—if they repent—will be strong in the faith, if they repent now, while the tower is being built. But if the building is completed, they no longer have a place, but will be cast out. But they have only this: to lie beside the tower.”'
translation:
  language: en
  text: '“And who are the ones they were rejecting and tossing aside?”


    “They are people who have sinned and want to repent[a]. They were not thrown far away from the tower, because if they repent, they can still be used in its construction. Those who are going to repent will be strong in the faith if they repent now, while the tower is still being built. Once it is finished, there will be no place for them, and they will be cast out. The only thing left for them is to lie beside the tower.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those whom they were casting away and throwing aside
  simplified_phrase: the ones they were rejecting and tossing aside
  preserved_meaning: They are judged unsuitable and moved aside from the building work.
  reasoning_layer_used: POB translation and immediate tower imagery
  rationale: Ordinary wording retains both rejection and physical removal.
- pob_phrase: 'But they have only this: to lie beside the tower'
  simplified_phrase: The only thing left for them is to lie beside the tower
  preserved_meaning: Their remaining condition is limited to lying outside beside the tower.
  reasoning_layer_used: POB translation and contrast with having a place
  rationale: This states the restricted outcome without presenting it as an advantage.
