id: GEN.50.25
reference: Genesis 50:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּשְׁבַּ֣ע יוֹסֵ֔ף אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִתֶ֥ם אֶת עַצְמֹתַ֖/י מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: ko
  text: 그때 요셉이 이스라엘 자손들에게 맹세하게 했습니다. 그는 말했습니다. “하나님께서 반드시 여러분을 돌보실 것이니, 여러분은 내 뼈를 여기서 가지고 올라가야 합니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם
  english_pob_choice: God will surely attend to you
  chosen_korean: 하나님이 반드시 여러분을 돌보실 것이니
  alternatives_korean:
  - 하나님이 반드시 여러분을 찾아오실 것이니
  - 하나님이 반드시 여러분을 돌보아 주실 것이니
  lexicon: פקד / אלוהים
  rationale: 반복형 동사 פָּקֹד יִפְקֹד는 단순한 ‘방문’보다 구원의 개입과 돌보심을 강하게 나타내므로, POB의 ‘attend to’에 맞춰 ‘돌보시다’로 옮겼습니다. ‘여러분’을 써서 공동체 전체를 향한 약속을 살렸습니다.
- source_word: וְ/הַעֲלִתֶ֥ם
  english_pob_choice: you must bring up
  chosen_korean: 여러분은 ... 메고 올라가야 합니다
  alternatives_korean:
  - 여러분은 ... 데리고 올라가야 합니다
  - 여러분은 ... 올려야 합니다
  lexicon: עלה
  rationale: 히필형 הַעֲלִיתֶם은 ‘올리다/데리고 올라가다’의 능동적 수행을 뜻하므로, 시신의 존엄을 드러내는 문맥에서 한국어로는 ‘메고 올라가다’가 가장 자연스럽고 구체적입니다.
- source_word: אֶת עַצְמֹתַ֖/י
  english_pob_choice: my bones
  chosen_korean: 내 뼈들을
  alternatives_korean:
  - 내 유해를
  - 내 뼈를
  lexicon: עֶצֶם
  rationale: 복수형 ‘뼈들’을 그대로 살려 원문 형식을 반영했습니다. 장례 맥락이지만 원문은 일반적 ‘유해’보다 ‘뼈들’로 더 직접적입니다.
- source_word: וַ/יַּשְׁבַּ֣ע
  english_pob_choice: made ... swear
  chosen_korean: 맹세하게 하며
  alternatives_korean:
  - 맹세시켰습니다
  - 맹세시켜
  lexicon: שׁבע
  rationale: 서술 흐름상 요셉이 그들에게 맹세를 요구한 행위를 자연스럽게 표현하되, 강제성과 서술성을 함께 살리기 위해 ‘맹세하게 하며’로 옮겼습니다.
theological_decisions:
- issue: פָּקֹד יִפְקֹד의 의미 범위
  chosen_reading: 하나님의 ‘방문’보다 언약적 돌보심과 구원적 개입을 드러내는 표현으로 번역했습니다.
  alternative_readings:
  - 하나님이 반드시 여러분을 찾아오실 것입니다
  - 하나님이 반드시 여러분을 방문하실 것입니다
  rationale: 출애굽을 내다보는 요셉의 확언은 단순한 방문 예고가 아니라 하나님이 언약 백성을 확실히 돌보시고 인도하신다는 약속이므로, 신학적 함의를 분명히 하는 쪽이 원문의 기능에 더 가깝습니다.
  doctrine_reference: 언약적 돌보심 / 출애굽 예표
