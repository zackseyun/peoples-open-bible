base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016.yaml
  text: '1[v5]. And we announced to Abraham that Sarah had conceived in the seventh month, and we returned to Sarah and found that she had conceived before us. And we blessed him, and we told him all that had been commanded for him: that he would not die until he had begotten six sons and had seen Isaac, and that in Isaac a name and seed would be named for him.

    2. And Sarah laughed when she heard that we had spoken this word with Abraham, and we rebuked her.

    3. And she was afraid and denied that she had laughed because of the word. And we told her the name of her son, as it had been ordained:

    4. and it was written on the heavenly tablets, Isaac. And when we came to her at the appointed time, she conceived and bore a son.

    5[v9]. And in this month the Lord executed the judgments of Sodom and Gomorrah and Zoar and all the region of the Jordan, and he burned them with fire and sulfur and destroyed them to this day, according to all their works, because they were utterly lawless and sinful,

    6. and they defiled themselves and committed fornication in their flesh and worked uncleanness on the earth. And thus the Lord will execute judgment on the places where they have done according to the uncleanness of Sodom, just as he judged Sodom.

    7. But Lot we saved, for God remembered Abraham and brought him out from the midst of the overthrow.

    8. And he also committed sin, and his daughters, upon the earth such as had not been on the earth

    9. from the days of Adam until his time, because a man lay with his daughters. And behold, it was commanded and written concerning all his seed on the heavenly tablets, that he should remove them and uproot them and execute their judgment like the judgment of Sodom, and that he should leave no seed of that man on the earth on the day of condemnation.

    10. And in this month Abraham moved from Hebron and went

    11. and dwelt between Kadesh and Shur in the mountains of Gerar. And in the middle of the fifth month he moved from there and dwelt at the Well of the Oath.

    12. And in the middle of the sixth month the Lord visited Sarah

    13. and did to her as he had said. And she conceived and bore a son in the third month, in the middle of the month, at the time of which the Lord had spoken to Abraham, on the feast of the firstfruits of the harvest Isaac was born.

    14. And Abraham circumcised his son on the eighth day: he was the first to be circumcised according to

    15. the covenant that is ordained forever. And in the sixth year of the fourth week we came to Abraham at the Well of the Oath, and we appeared to him as we had told Sarah that we would return to her and she would have conceived a son.

    16. And we returned in the seventh month and found Sarah pregnant before us, and we blessed the Lord, the God of all ages, who had visited his servant and had fulfilled his word.

    17. And we blessed him and told him everything that had been decreed concerning him, that he would not die until he begot six sons more and saw Isaac''s sons before he died; but in Isaac his name and seed would be called.

    18. And that one would become a holy seed, and would not be reckoned among the nations, for he would become the portion of the Most High, and all his seed had fallen to the lot of God, that it should become for the Lord a people for possession out of all peoples, and that it should become a kingdom

    19. of priests and a holy people. And he went on his way, and he rejoiced and blessed the Lord for all that we had told him.

    20. And he built an altar there to the Lord who had delivered him, and who was making him rejoice in the land of his sojourning.

    21. And he celebrated a feast of rejoicing in this month, seven days, near the altar that he had built at the Well of the Oath. And he built booths for himself and for his servants

    22. for this feast, and he was the first to celebrate the feast of booths on the earth. And during these seven days he was bringing, each day and every day, on the altar to the Lord two oxen, two rams, seven sheep, one he-goat for a sin offering,

    23. to make atonement for himself and for his seed; and for a sacrifice of well-being, seven rams, seven goats, seven sheep, and seven male kids, and their grain offerings and their drink offerings. And he burned all their fat on the altar, a choice offering to the Lord for a pleasing aroma.

    24. And morning and evening he burned fragrant substances: frankincense, galbanum, stacte, nard, myrrh, costus, and cassia, seven of these; he offered all of them mixed together, pure.

    25. And he kept this feast seven days, rejoicing with all his heart and with all his soul, he and all who were in his house; and there was no foreigner with him, nor anyone uncircumcised.

    26. And he blessed his Creator, who had created him in his generation, because by his good pleasure he had created him; for he knew and understood that from him there would be a plant of righteousness for the eternal generations, and from him a holy seed, so that it might become like him who had made all things.

    27. And he blessed and rejoiced, and he called the name of this feast the feast of the Lord, a joy

    28. acceptable to the Most High God. And we blessed him forever, and all his seed after him throughout all the generations of the earth, because he celebrated this feast in its season according to the testimony of the heavenly tablets.

    29. Therefore it is ordained on the heavenly tablets concerning Israel, that they should celebrate the feast of booths seven days with joy in the seventh month, acceptable before the Lord—

    30. an everlasting statute throughout their generations in every year. And there is no limit of days for this, for it is ordained forever for Israel that they should celebrate it and dwell in booths and place crowns on their heads and take leafy branches and willows from the brook.

    31. And Abraham took branches of palm trees and fruit of beautiful trees, and every day he went around the altar with the branches, seven times each day[v30][v27-28][v24][v20][v15][v13]; and in the morning he praised and gave thanks to his God for everything in joy.'
  footnotes:
  - marker: v5
    text: The place-name list is textually difficult. The Ethiopic appears to include Sodom, Gomorrah, and likely Zoar, together with the settlements of the Jordan plain.
    reason: textual_variant
  - marker: v9
    text: The clause about Lot's seed is compressed and difficult. The sense appears to be that judgment against that line was recorded on the heavenly tablets, with language of removal and uprooting.
    reason: segmentation_note
  - marker: v13
    text: The chronology links Isaac's birth to the feast of firstfruits; the Ethiopic wording is dense, but the calendrical connection is clear and should be preserved.
    reason: cross_reference
  - marker: v15
    text: Verse numbering in this chapter is uneven in the source rows; vv. 16-17 continue the same speech and may reflect omitted intermediate row numbers in the working corpus.
    reason: segmentation_note
  - marker: v20
    text: This verse is reconstructed from the immediate context of the Ethiopic sequence; the source rows jump in numbering, but the sense is supported by the surrounding lines about altar-building and rejoicing.
    reason: segmentation_note
  - marker: v24
    text: Several incense names are uncertain in exact botanical identification; the translation gives conventional approximations rather than over-precise modern species labels.
    reason: lexical_alternative
  - marker: v27-28
    text: The Ethiopic at this point is difficult. Some witnesses may support wording closer to 'a great joy acceptable to the Most High God.'
    reason: alternative_reading
  - marker: v30
    text: The commands about crowns, branches, and booths intentionally preserve Jubilees' expanded festival practice and should not be harmonized away to the Pentateuchal wording alone.
    reason: cross_reference
translation:
  language: ko
  text: '1. 그녀는 아들을 잉태했습니다. 그리고 우리는 일곱째 달에 사라에게로 돌아가, 사라가 우리 앞에 임신한 상태로 있었음을 발견했습니다. 우리는 그를 축복했고, 그에게 명령된 모든 것을 그에게 말했습니다. 곧 그가 죽기 전에 여섯 아들을 낳고 그들을 보게 될 것이며, 이삭 안에서 그의 이름과 씨가 불리게 될 것이라는 것입니다.

    2. 사라는 우리가 아브라함과 이 말씀을 나누었다는 것을 듣고 웃었습니다. 그리고 우리는 사라를 꾸짖었습니다.

    3. 그녀는 두려워하여 그 말 때문에 자기가 웃었다는 것을 부인했습니다. 그리고 우리는 정해진 대로 그녀의 아들의 이름을 알려 주었습니다.

    4. 그리고 그의 이름, 이삭이 하늘의 서판들에 기록되어 있었습니다. 그리고 우리가 정해진 때에 그녀에게 돌아갔을 때, 그녀는 잉태하여 아들을 낳았습니다.

    5. 그녀는 아들을 잉태하였습니다. 이 달에 주께서는 소돔과 고모라와 돔과 요르단의 모든 지역에 심판을 집행하셨으며, 불과 유황으로 그들을 태우시고 오늘날까지 멸망시키셨습니다. 내가 이제 너희에게 그들의 모든 행위를 밝혀 알린 바와 같이, 그들은 지극히 사악하고 죄가 많았습니다.

    6. 그들은 자신들을 더럽히고 자기 육체로 음행하며 땅에서 부정을 저질렀습니다. 이와 같이 주님께서는 그들이 소돔의 부정에 따라 행한 그 곳들에 심판을 내리실 것이며, 소돔을 심판하신 것과 같이 하실 것입니다.

    7. 그러나 우리는 롯을 구해 냈습니다. 하나님께서 아브라함을 기억하시고 롯을 멸망의 한가운데서 이끌어 내셨기 때문입니다.

    8. 그가 그것을 뒤엎었습니다. 그리고 그와 그의 딸들도 땅 위에서 죄를 지었는데, 그것은 땅 위에 전례가 없었던 죄였습니다.

    9. 아담 시대부터 그때까지, 한 사람이 자기 딸들과 동침하였기 때문입니다. 보십시오, 하늘의 판들에는 그의 모든 씨에 관하여, 그들을 제거하고 뿌리 뽑고, 그들의 심판을 소돔의 심판처럼 집행하며, 정죄의 날에 그의 씨를 땅에 하나도 남기지 말라고 명령되고 결정되어 있었습니다.

    10. 그리고 그 달에 아브라함은 헤브론을 떠나 그랄 산지에서 가데스와 수르 사이에 머물렀습니다.

    11. 그는 가데스와 술 사이인 그랄 산지에 머물렀습니다. 그리고 다섯째 달 중순에 그곳을 떠나 맹세의 우물에 머물렀습니다.

    12. 그곳에서 그는 맹세의 우물 곁에 거하였고, 여섯째 달 한가운데에 주께서 사라를 찾아오셨습니다.

    13. 그리고 그는 사라에게 말씀하신 대로 해 주셨습니다. 사라는 잉태하여 셋째 달, 그 달 중순에, 주께서 아브라함에게 말씀하신 때에 아들을 낳았습니다. 추수의 첫 열매 절기에 그가 태어났습니다.

    14. 아브라함은 여드레째 되는 날에 그의 아들 이삭에게 할례를 행하였습니다. 그는 영원히 제정된 규례에 따라 할례를 받은 첫 사람이었습니다.

    15. 영원히 확립된 언약입니다. 그리고 넷째 주의 여섯째 해에 우리는 ‘맹세의 우물’에서 아브라함에게 갔고, 우리가 다시 사라에게 올 것이며 사라가 아들을 잉태할 것이라고 사라에게 말한 대로 그에게 나타났습니다.

    16. 우리는 일곱째 달에 돌아와 우리 앞에서 사라가 임신한 것을 발견했습니다. 그리고 주님을 찬송하고, 하나님께서 아브라함에 관하여 말씀하신 모든 것을 그에게 알렸습니다. 하나님께서는 그 일들을 반드시 이루실 것이었습니다.

    17. 우리는 그를 축복하고, 그가 여섯 아들을 더 낳고 죽기 전에 그들을 볼 때까지 죽지 않을 것과 이삭에게서 그의 이름과 씨가 불릴 것이라고, 그에 관하여 정해진 모든 것을 그에게 말하였습니다.

    18. 그리고 이삭만이 거룩한 씨가 될 것이며, 그는 민족들 가운데 셈에 들지 않을 것입니다. 이는 그가 지극히 높으신 분의 몫이 될 것이기 때문입니다. 그의 모든 자손은 하나님의 몫으로 돌아가, 모든 백성 가운데서 주님의 소유가 될 백성이 되고 한 왕국이 되도록 하려는 것입니다.

    19. 제사장직과 거룩한 백성이 되었습니다. 그는 길을 떠났고, 기뻐하며 우리가 그에게 말해 준 것 때문에 만물의 창조주를 찬양했습니다.

    20. 그는 그곳에서 야훼께 제단을 쌓았습니다. 야훼께서는 그를 구원하시고, 그가 나그네로 살아가는 땅에서 그를 기쁘게 하셨습니다. 그리고 그는 이 달에 자신이 맹세의 우물에 쌓은 제단 곁에서 기쁨의 절기를 칠 일 동안 지켰습니다.

    21. 그가 서약의 우물 곁에 세운 제단 가까이에, 자신과 그의 종들을 위하여 초막들을 지었습니다.

    22. 이 절기 때에 그는 땅에서 초막절을 처음으로 지켰습니다. 그리고 이 일곱 날 동안 그는 날마다 제단 위에서 주님께 수소 두 마리와 숫양 두 마리와 양 일곱 마리와 속죄제를 위한 숫염소 한 마리를 바쳤습니다.

    23. 그것으로 죄를 속죄하여 자기와 자기의 자손을 위하고, 평안제물로 숫양 일곱, 어린 염소 일곱, 양 일곱, 숫염소 일곱을 드렸습니다. 또 그에 딸린 곡식제물과 전제를 드렸습니다. 그는 그것들의 모든 기름을 제단 위에서 불살랐습니다. 그것은 주님께 드리는, 향기로운 냄새가 나는 선택된 제물이었습니다.

    24. 그는 아침과 저녁에 유향, 풍자향, 스타크테, 나르드, 몰약, 계피, 코스투스로 만든 향기로운 향을 피웠습니다. 이 일곱 가지를 모두 함께 섞어 순수하게 바쳤습니다.

    25. 그는 온 마음과 온 영혼으로 기뻐하며 이 절기를 이레 동안 지켰습니다. 그와 그의 집에 있는 모든 사람이 그러했습니다. 그와 함께 있는 이방인이나 할례받지 않은 사람은 아무도 없었습니다.

    26. 그는 자신을 그의 세대 가운데 창조하신 자기 창조주를 송축하였습니다. 그분께서 자신의 기뻐하심에 따라 그를 창조하셨기 때문입니다. 그는 자기에게서 영원한 세대들을 위한 의의 심긴 것이 나올 것이며, 자기에게서 거룩한 씨가 나와 모든 것을 만드신 분과 같이 될 것을 알고 깨달았습니다.

    27. 그는 축복하고 기뻐하며, 이 절기의 이름을 ‘주님의 절기, 기쁨’이라고 불렀습니다.

    28. 둘 모두에게 매우 큰 기쁨이 있었습니다. 그는 거기에 자신에게 복을 주시고 자신이 나그네로 머무는 땅에서 기뻐하게 하신 주님께 제단을 세웠습니다. 그리고 그는 이 달에 칠 일 동안 기쁨의 잔치를 열었습니다.

    29. 그러므로 이스라엘이 일곱째 달에 기쁨으로 칠 일 동안 초막절을 지키는 것이 주 앞에서 받아들여지도록 하늘의 판들에 규정되어 있습니다.

    30. 그것은 그들의 모든 세대에 걸쳐 해마다 지켜야 할 영원한 규례입니다. 또 이 일에는 정해진 날수의 한계가 없습니다. 이스라엘이 그것을 지키고 초막에 거하며, 머리에 관을 쓰고, 잎이 무성한 가지와 버드나무를 취하도록 영원히 제정된 것이기 때문입니다.

    31. 아브라함은 종려나무 가지들과 아름다운 나무의 열매를 가져다가, 날마다 그 가지들을 가지고 제단 주위를 일곱 번 돌았으며, 아침에는 기쁨으로 자기 하나님께 모든 것에 대하여 찬양하고 감사드렸습니다.'
