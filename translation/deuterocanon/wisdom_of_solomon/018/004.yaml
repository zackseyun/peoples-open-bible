translation:
  text: 'For the Egyptians deserved to be deprived of light and imprisoned in darkness: they had kept your sons captive, the very ones through whom the imperishable light of the law was to be given to the world[a].'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “given for all time.”
