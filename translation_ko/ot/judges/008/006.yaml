  text: 그때 숙곳의 지도자들이 말했습니다. “세바와 살문나를 벌써 네 손아귀에 넣었느냐? 우리가 네 군대에 빵을 주어야 하겠느냐?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵ֣י סֻכּ֔וֹת
  english_pob_choice: the leaders of Succoth
  chosen_korean: 숙곳의 지도자들
  alternatives_korean:
  - 숙곳의 방백들
  - 숙곳의 우두머리들
  lexicon: 정치·사회적 직함
  rationale: 히브리어 שָׂרֵי는 통치·지도 계층을 가리키므로, 문맥에 맞게 중립적인 ‘지도자들’로 옮겼습니다.
- source_word: הֲכַף ... בְּיָדֶךָ
  english_pob_choice: Are the hands ... already in your hand
  chosen_korean: '...의 손이 벌써 네 손에 있느냐'
  alternatives_korean:
  - '...의 손이 이미 네 손에 있느냐'
  - '...의 손아귀에 있느냐'
  lexicon: 관용구/이미지
  rationale: 손을 권력과 장악의 표지로 보는 히브리어 표현을 그대로 살려, POB의 ‘already’에 맞춰 ‘벌써’로 옮겼습니다.
- source_word: לִצְבָאֲךָ
  english_pob_choice: to your army
  chosen_korean: 네 군대에
  alternatives_korean:
  - 네 부대에
  - 네 병사들에게
  lexicon: 집합명사
  rationale: צָבָאּ는 집합적 ‘군대’이므로, 자연스러운 한국어로 간명하게 처리했습니다.
- source_word: לָחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 양식
  lexicon: 일상식/생존 식량
  rationale: 전투 상황에서의 기본 식량을 가리키므로, 현대어로 직역성이 높은 ‘빵’을 유지했습니다.
theological_decisions:
- issue: 숙곳 사람들의 질문이 단순 정보 요청인지 조롱성 거절인지
  chosen_reading: 본문의 수사적 질문을 그대로 살려, 그들이 기드온의 승리를 아직 확인하지 못했다는 핑계와 냉소를 함께 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘정말 벌써 잡았느냐’처럼 노골적 조롱으로 강화
  - 중립적 사실 확인 질문으로 완화
  rationale: 히브리어 질문 형식과 이어지는 서술 문맥을 훼손하지 않기 위해, 의미를 과장하지도 약화하지도 않았습니다.
  doctrine_reference: 서사 문맥 보존
