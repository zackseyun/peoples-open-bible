id: PSA.30.5
reference: Psalms 30:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י רֶ֨גַע בְּ/אַפּ/וֹ֮ חַיִּ֪ים בִּ/רְצ֫וֹנ֥/וֹ בָּ֭/עֶרֶב יָלִ֥ין בֶּ֗כִי וְ/לַ/בֹּ֥קֶר רִנָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/005.yaml
  text: For his anger lasts only a moment, but his favor lasts a lifetime. Weeping may stay for the night[a], but a shout of joy comes in the morning[b].
  footnotes:
  - marker: a
    text: Literally, “In the evening weeping lodges”; the Hebrew personifies weeping as an overnight guest.
    reason: lexical_alternative
  - marker: b
    text: Or “joyful singing.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 진노는 한순간이지만[a], 그분의 은총 안에는 생명이 있습니다.[b] 저녁에는 울음이 머물러도[c], 아침에는 기쁨의 외침이 있습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 진노 안에 한순간’입니다.
    reason: 히브리어의 압축된 명사절 표현을 설명합니다.
  - marker: b
    text: 또는 ‘그분의 호의 가운데에는 생명이 있습니다’라고 옮길 수 있습니다.
    reason: רָצוֹן은 ‘은총, 호의, 선의’를 뜻할 수 있습니다.
  - marker: c
    text: 또는 ‘저녁에 울음이 밤을 지냅니다’라고 옮길 수 있습니다. 히브리어 동사는 ‘묵다, 밤을 지내다’를 뜻합니다.
    reason: יָלִין의 ‘하룻밤 묵다’라는 어휘적 뉘앙스를 보존합니다.
  - marker: d
    text: 또는 ‘기쁨의 노래’ 또는 ‘환호’라고 옮길 수 있습니다.
    reason: רִנָּה는 기쁨에 찬 외침이나 노래를 가리킬 수 있습니다.
lexical_decisions:
- source_word: זַמְּרוּ
  english_pob_choice: Sing praise
  chosen_korean: 노래로 찬양을 드리십시오
  alternatives_korean:
  - 찬양하십시오
  - 노래하십시오
  - 찬송하십시오
  lexicon: HALOT
  rationale: 피엘 명령형의 예배적·음악적 뉘앙스를 살리기 위해 단순한 ‘노래하다’보다 ‘노래로 찬양하다’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: WLC
  rationale: 본문의 고유한 신명 יהוה를 직접 드러내기 위해 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
- source_word: חֲסִידָיו
  english_pob_choice: you his faithful ones
  chosen_korean: 그의 신실한 이들아
  alternatives_korean:
  - 그의 성도들아
  - 그의 경건한 이들아
  - 그의 충실한 이들아
  lexicon: HALOT
  rationale: 호격으로 부르는 대상이므로 ‘이들아’로 직접 부름을 살렸고, חסיד의 언약적 충실성을 ‘신실한’으로 반영했습니다.
- source_word: וְהוֹדוּ
  english_pob_choice: and give thanks
  chosen_korean: 감사하십시오
  alternatives_korean:
  - 감사드리십시오
  - 찬양하십시오
  - 고백하십시오
  lexicon: HALOT
  rationale: 이 문맥에서 ידה의 히필 명령형은 감사와 찬양의 응답을 뜻하므로, 뒤의 명사구와 자연스럽게 연결되는 ‘감사하십시오’로 옮겼습니다.
- source_word: לְזֵכֶר קָדְשׁוֹ
  english_pob_choice: to the remembrance of his holiness
  chosen_korean: 그분의 거룩하심을 기억하며
  alternatives_korean:
  - 그분의 거룩하심의 기억을 위해
  - 그분의 거룩하심의 언급에 대해
  - 그분의 거룩하심을 기억할 때
  lexicon: HALOT
  rationale: לְזֵכֶר는 ‘~을 기억함/기념함’의 상황을 나타내므로 ‘기억하며’로 자연스럽게 풀었고, קָדְשׁוֹ는 본문에 없는 ‘이름’을 덧붙이지 않고 ‘거룩하심’으로 직접 살렸습니다.
theological_decisions:
