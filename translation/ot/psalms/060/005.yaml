  rationale: The Hebrew image is theologically and poetically significant; optimal equivalence preserves it rather than flattening it into abstraction.
  doctrine_reference: Translation philosophy §1, §6
- issue: Object suffix in final verb
  chosen_reading: Translate as plural 'answer us.'
  alternative_readings:
  - '''answer me'' if following a different textual/morphological construal'
  rationale: The provided morphology indicates 1cp suffix, and the communal petition coheres with the surrounding context. A singular alternative is worth preserving as a textual/reading note rather than adopted in the main text.
