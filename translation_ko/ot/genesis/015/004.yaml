  text: 보십시오, 야훼의 말씀이 그에게 임했습니다. 말씀하시기를, “이 사람은 네 상속자가 되지 못할 것이지만, 네 몸에서 나올 자가 네 상속자가 될 것입니다.”
  philosophy: optimal-equivalence
