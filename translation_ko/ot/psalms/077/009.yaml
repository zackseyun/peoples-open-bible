  terminology: חנן은 ‘은혜를 베푸시다’, רַחֲמָיו는 집합적 추상명사로 ‘자신의 긍휼’, אַף는 ‘진노’로 옮겼습니다. אֵל은 문맥상 ‘하나님’으로 번역했습니다. סֶלָה는 뜻을 단정하지 않고 음역했습니다.
