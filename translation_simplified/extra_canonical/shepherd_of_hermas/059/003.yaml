  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/003.yaml
  text: '2. He says, “Listen: your sins are many, but not so many that you should be handed over to this angel. Rather, your household has committed great lawless deeds and sins, and the glorious angel was embittered at their works; and for this reason he ordered that you be afflicted for a certain time, so that they too might repent and cleanse themselves from every desire of this age. When therefore they repent and are cleansed, then the angel of punishment will depart.”'
translation:
  language: en
  text: 2. He said, “Listen. You have many sins, but not enough for you to be handed over to this angel. Instead, your household has committed serious acts of lawlessness and many sins. Their actions made the glorious angel bitterly angry, so he ordered you to suffer for a time. This was so that they too might reorient[r1] and cleanse themselves of every desire belonging to this present age. When they have reoriented and become clean, the angel of punishment will leave.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: your sins are many, but not so many that you should be handed over to this angel
  simplified_phrase: You have many sins, but not enough for you to be handed over to this angel
  preserved_meaning: His sins are numerous but do not by themselves justify being placed under this angel.
  reasoning_layer_used: POB translation and immediate context
  rationale: The shorter contrast keeps both his guilt and the stated limit on it.
- pob_phrase: was embittered at their works; and for this reason he ordered that you be afflicted for a certain time
  simplified_phrase: Their actions made the glorious angel bitterly angry, so he ordered you to suffer for a time
  preserved_meaning: The household’s conduct provoked the angel and led to a limited period of suffering.
  reasoning_layer_used: POB translation and source-driven clause relationship
  rationale: Ordinary cause-and-effect wording replaces an awkward passive construction.
translation_notes:
  risk_flags:
  - risk: “Bitterly angry” may sound stronger than the uncommon phrase “was embittered.”
    mitigation: It preserves the POB’s force without adding a new cause or action.
  - risk: Modern readers may find one person’s suffering for a household’s sins difficult.
    mitigation: The draft preserves the POB’s stated relationship without explaining or doctrinally resolving it.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
