id: JOB.19.18
reference: Job 19:18
source:
  edition: WLC
  text: גַּם עֲ֭וִילִים מָ֣אֲסוּ בִ֑/י אָ֝ק֗וּמָה וַ/יְדַבְּרוּ בִֽ/י־־׃
translation:
  text: Even young boys[a] despise me; when I rise, they speak against me.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “fools” or “the insolent”; the Hebrew term is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  chosen: Even
  alternatives:
  - also
  - indeed
  lexicon: HALOT
  rationale: Adds emphasis and continuation from the surrounding lament; 'even' best conveys the force in context.
- source_word: עֲוִילִים
  chosen: young boys
  alternatives:
  - fools
  - the insolent
  - young boys
  lexicon: HALOT
  rationale: The context favors young or socially insignificant mockers, while “young boys” avoids the false precision of “little children”; other possible senses remain in the note.
- source_word: מָאֲסוּ בִי
  chosen: despise me
  alternatives:
  - reject me
  - spurn me
  lexicon: HALOT
  rationale: The verb מאס expresses contemptuous rejection. 'Despise me' fits the emotional tone and idiomatic English.
- source_word: אָקוּמָה
  chosen: when I rise
  alternatives:
  - if I arise
  - when I stand up
  lexicon: HALOT
  rationale: 'The cohortative/form here functions naturally in context as a temporal clause: whenever Job rises, the mockery follows. ''When I rise'' is concise and idiomatic.'
- source_word: וַיְדַבְּרוּ בִי
  chosen: they speak against me
  alternatives:
  - they talk about me
  - they mock me
  - they speak of me
  lexicon: HALOT
  rationale: The preposition ב with דבר here carries a hostile sense in context. 'Speak against me' preserves the verbal action without over-paraphrasing to 'mock,' though mockery is implied.
