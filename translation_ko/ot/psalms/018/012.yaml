  source_fidelity: 현 초안은 제시된 히브리어(시 18:12)가 아니라 앞 절에 해당하는 다른 히브리어 본문(‘어둠을 ... 숨는 곳으로 삼으시고’)을 번역하고 있습니다. 따라서 본문과 어휘 결정, 각주는 모두 제시된 원문에 맞게 교체되어야 합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지합니다. 히브리어 끝부분의 압축적 병렬은 ‘도 그러했습니다’로 최소한으로 풀어 한국어 문장성을 확보하되, 무엇이 어떻게 지나갔는지에 관한 시적 압축은 각주에서 밝혔습니다.
  terminology: נֹגַהּ는 ‘광채’, עָבָיו는 문맥상 ‘짙은 구름들’, בָּרָד는 ‘우박’, גַחֲלֵי־אֵשׁ는 직역에 가까운 ‘불의 숯불’로 옮겼습니다. ‘주’는 앞 문맥에서 하나님을 가리키는 존칭 대명사 ‘그’와 함께 사용될 수 있으나, 이 절의 히브리어에는 신명이 직접 나오지 않으므로 ‘그’로 유지했습니다.
