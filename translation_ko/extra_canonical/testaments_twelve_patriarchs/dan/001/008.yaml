  source_fidelity: 초안은 ‘분노의 영’과 그것이 화자를 설득하고 충동을 넣는다는 기본 구조를 잘 반영합니다. 그러나 원문의 ἐκμύζουσα/ἐκμυζῆσαι는 염소 새끼와 요셉 자체를 목적어로 삼으며 ‘피’를 명시하지 않습니다. ‘피’를 두 차례 보충하면 원문에 없는 구체화를 더하여 이미지의 범위를 좁힙니다. 또한 ἐνέβαλεν은 화자 안에 그러한 행위를 향한 충동을 넣었다는 뜻이므로, 이를 한국어에서 분명히 나타내는 편이 좋습니다.
  naturalness: ‘표범이 새끼 염소를 빨아내듯이’는 의도적으로 섬뜩하고 비일상적인 원문의 비유를 보존하면서도 문법적으로 자연스럽습니다. ‘내게 충동을 불어넣었습니다’는 ‘put into me’를 현대 표준어 합쇼체로 자연스럽게 옮깁니다.
