id: PSA.61.7
reference: Psalms 61:7
source:
  edition: WLC
  text: יֵשֵׁ֣ב ע֭וֹלָם לִ/פְנֵ֣י אֱלֹהִ֑ים חֶ֥סֶד וֶ֝/אֱמֶ֗ת מַ֣ן יִנְצְרֻֽ/הוּ׃
translation:
  text: May he sit enthroned before God forever[a]; appoint steadfast love and faithfulness to guard him.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “May he dwell before God forever.”
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשֵׁב
  chosen: May he dwell
  alternatives:
  - May he dwell
  - He will sit
  lexicon: HALOT
  rationale: “Dwell” conveys continuing presence before God while avoiding an unmarked enthronement specification.
- source_word: עוֹלָם
  chosen: forever
  alternatives:
  - for evermore
  - eternally
  lexicon: HALOT
  rationale: In this poetic context עוֹלָם expresses enduring duration. 'Forever' is natural modern English and preserves the sense of perpetual continuance.
- source_word: לִפְנֵי אֱלֹהִים
  lemma: לִפְנֵי
  chosen: before God
  alternatives:
  - in the presence of God
  - before the face of God
  lexicon: HALOT
  rationale: לִפְנֵי literally means 'before' or 'in the presence of.' 'Before God' is concise and idiomatic, while still preserving the relational and covenantal sense of living/reigning under God's gaze.
- source_word: חֶסֶד
  chosen: steadfast love
  alternatives:
  - mercy
  - lovingkindness
  - covenant love
  lexicon: HALOT
  rationale: חֶסֶד is a covenantally rich term often denoting loyal, steadfast love. 'Steadfast love' is a well-established English rendering that preserves both affection and loyalty better than the narrower 'mercy'.
- source_word: אֱמֶת
  chosen: faithfulness
  alternatives:
  - faithfulness
  - reliability
  lexicon: HALOT
  rationale: In coordination with חֶסֶד, “faithfulness” idiomatically represents covenantal reliability; “truth” remains a legitimate lexical alternative.
- source_word: מַן
  chosen: appoint
  alternatives:
  - prepare
  - ordain
  - set
  lexicon: HALOT
  rationale: The form is commonly understood as an imperative from מנה, calling on God to assign or appoint what follows. 'Appoint' fits the prayer context and the object 'steadfast love and truth' better than the more ambiguous 'prepare'.
- source_word: יִנְצְרֻהוּ
  chosen: to guard him
  alternatives:
  - that they may preserve him
  - to watch over him
  lexicon: HALOT
  rationale: נצר means to guard, keep, or preserve. With the plural verb and singular suffix, the sense is that steadfast love and truth function as personified agents protecting the king. 'Guard him' is clear and vivid in English.
