  meaning_decisions:
  - source_phrase: ἐν τῇ οἰκίᾳ αὐτοῦ
    prior_rendering: in his house
    new_rendering: at Levi’s house
    rationale: The preceding call of Levi most naturally identifies the host, supported by Luke 5:29; the serious alternative remains in a footnote.
  - source_phrase: γίνεται κατακεῖσθαι αὐτὸν ... συνανέκειντο
