  from: O Yahweh God of hosts[a], restore us; make your face shine[b], that we may be saved.
  to: O Yahweh God of hosts, restore us; make your face shine, and we will be saved[a].
  rationale: The coordinated cohortative naturally expresses the hoped-for result of the preceding imperatives; “and we will be saved” preserves that coordination without forcing it into a purpose clause. The conventional English vocative “O” is not a mistranslation and its deletion is merely stylistic, so it is retained. The note honestly records the viable purposive rendering.
