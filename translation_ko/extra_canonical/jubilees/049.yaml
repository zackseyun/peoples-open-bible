      ይትገበር። ወአንተኒ፡ አዝዞሙ፡ ለውሉደ፡ እስራኤል፡ ከመ፡ ይግበሩ፡ ፋሲካ፡ በመዋዕሊሆሙ፡ በኵሉ፡ ዓመት፡ ምዕረ፡ ለዓመት፡ በዕለተ፡ ጊዜሁ፡ ወይመጽእ፡ ተዝካረ፡ እምቅድመ፡ እግዚአብሔር፡ ዘይሠምር፡ ወኢይመጽኦሙ፡ መቅሠፍት፡ ለቀቲል፡ ወለ*ምሕፀት፡ በውእቱ፡ ዓመት፡ አመ፡ ገብሩ፡ ጳስካ፡
  - verse: 16
    geez: በጊዜሁ፡ *በኵሉ፡ በከመ፡ ትእዛዙ። ወኢይከውን፡ ለበሊያቶ፡ በ*አፍአ፡ እምቤተ፡ መቅደሱ፡ ለእግዚአብሔር፡ ወበአንጻረ፡ ቤተ፡ *መቅደሱ፡ ለእግዚአብሔር፡ ወኵሉ፡ ሕዝበ፡ ማኅበ
  - verse: 17
    geez: ሮሙ፡ ለእስራኤል፡ ይገበርዎ፡ በጊዜሁ። ወ*ኵሉ፡ ሰብእ፡ *ዘመጽአ፡ በዕለቱ፡ ይብልዎ፡ በቤተ፡ መቅደሱ፡ ለአምላክክሙ፡ በቅድመ፡ እግዚአብሔር፡ ዘእም*፳ዓመት፡ ወላዕለ፡ እስመ፡
  - verse: 18
    geez: ከመዝ፡ ተጽሕፈ፡ ወተሠርዐ፡ ከመ፡ ይብልዕዎ፡ በቤተ፡ መቅደሱ፡ ለእግዚአብሔር። ወ*እምከመ፡ ቦኡ፡ ውሉደ፡ እስራኤል፡ ውስተ፡ ምድር፡ እንተ፡ ይእኅዙ፡ ውስተ፡ ምድረ፡ ከናአን፡ ወ*ይተክሉ፡ ደብተራ፡ እግዚአብሔር፡ ማእከለ፡ ምድር፡ ውስተ፡ አሐዱ፡ እምነ፡ ሠራዊቶሙ፡ እስከ፡ አመ፡ ይትሐነጽ፡ መቅደሱ፡ ለእግዚአብሔር፡ በዲበ፡ ምድር፡ ወ*ይኩኑ፡ እንዘ፡ ይመጽኡ፡ ወይገብሩ፡ ጳስካ፡ *በማእከለ፡ ደብተራሁ፡ ለእግዚአብሔር፡ *ወይጠብኅዎ፡ በቅድመ፡ እግዚአብ
  - verse: 19
    geez: ሔር፡ እምዓመት፡ በ*ዓመት። ወበመዋዕለ፡ አመ፡ ተሐንጸ፡ ቤት፡ በስመ፡ እግዚአብሔር፡ በምድረ፡ ርስትሙ፡ ህየ፡ የሐሩ፡ ወይጥብሑ፡ ጳስካ፡ ምሴተ፡ እንዘ፡ የዐርብ፡ ፀሐይ፡
  - verse: 20
