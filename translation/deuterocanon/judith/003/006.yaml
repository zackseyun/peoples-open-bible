  text: καὶ κατέβη ἐπὶ τὴν παραλίαν αὐτὸς καὶ ἡ δύναμις αὐτοῦ, καὶ ἐφρούρησε τὰς πόλεις τὰς ὑψηλάς, καὶ ἔλαβον ἐξ αὐτῶν εἰς συμμαχίαν ἄνδρας ἐπιλέκτους.
