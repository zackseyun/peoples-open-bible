  text: 6. Then those whose rods were half dry and had cracks handed them in. Many of them handed in green
    rods without cracks. Some were green with shoots bearing fruit, like the fruit on the rods of the
    crowned people who had gone into the tower. Some handed in dry and worm-eaten rods; others dry rods
    that had not been eaten; and others rods just as they had been, half dry and cracked. He ordered each
    of them to stand separately, some with their own groups and others apart.
translation:
  language: en
  text: 6. Next came those whose rods had been half dry and cracked. Many handed in green rods with no
    cracks. Some rods were green and had shoots bearing fruit, like the rods held by the crowned people
    who had gone into the tower. Others were dry and worm-eaten. Some were dry but not worm-eaten, and
    others were still half dry and cracked. He told each person to stand separately, some with their own
    groups and others apart.
