lexical_decisions:
- source_word: למען
  chosen: so that
  alternatives:
  - in order that
  - for the sake that
  lexicon: HALOT
  rationale: Introduces purpose/result. 'So that' is natural modern English and preserves the purposive force.
- source_word: דעת
  chosen: may know
  alternatives:
  - might know
  - to know
  lexicon: HALOT
  rationale: With למען, the clause expresses intended knowledge. English finite verb 'may know' best captures the sense in context.
- source_word: כל זרע יעקב
  chosen: all the offspring of Jacob
  alternatives:
  - all the seed of Jacob
  - all the descendants of Jacob
  lexicon: HALOT
  rationale: זרע literally means 'seed,' but in English 'offspring' communicates the collective descendant sense clearly while retaining the familial/covenantal nuance. 'Jacob' is preserved rather than assimilating to the Greek 'Israel' because the Hebrew witness is primary here.
- source_word: כי טוב
  chosen: that it is good
  alternatives:
  - for it is good
  - that good it is
  lexicon: HALOT
  rationale: This introduces the content of what Jacob's offspring are to know. 'That it is good' reads naturally and keeps the evaluative statement explicit.
- source_word: למלא אחרי
  chosen: to follow after
  alternatives:
  - to go after
  - to walk after
  - to be fully obedient to
  lexicon: HALOT
  rationale: The Hebrew idiom is somewhat unusual here, and the Greek parallel has πορεύεσθαι ὀπίσω, 'to go/walk after.' 'Follow after' preserves the directional discipleship/obedience sense without overinterpreting it as a technical phrase like 'be fully obedient to.'
- source_word: יהוה
  chosen: the LORD
  alternatives:
  - Yahweh
  - Jehovah
  - the Lord
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton is rendered 'the LORD' in small caps style. This follows project policy and preserves reverential convention.
