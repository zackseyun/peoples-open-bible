  from: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
  to: Sing to God; sing praise to his name. Prepare the way for the one who rides through the deserts[a]; Yah is his name. Exult before him.
