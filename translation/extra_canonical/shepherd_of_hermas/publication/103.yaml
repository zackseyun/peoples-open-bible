book: Shepherd of Hermas
source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Ἐκ δὲ τοῦ ὄρους τοῦ ἐνάτου τοῦ ἐρημώδους, τοῦ ⸢τὰ⸣ ἑρπετὰ καὶ θηρία ἐν αὐτῷ ἔχοντος τὰ διαφθείροντα
    τοὺς ἀνθρώπους, οἱ πιστεύσαντες τοιοῦτοί εἰσιν· 2. οἱ μὲν τοὺς σπίλους ἔχοντες διάκονοί εἰσι κακῶς
    διακονήσαντες καὶ διαρπάσαντες χηρῶν καὶ ὀρφανῶν τὴν ζωήν, καὶ ἑαυτοῖς περιποιησάμενοι ἐκ τῆς διακονίας
    ἧς ἔλαβον διακονῆ⸢σαι⸣· ἐὰν οὖν ἐπιμείνωσι τῇ αὐτῇ ἐπιθυμίᾳ, ἀπέθανον, καὶ οὐδεμία αὐτοῖς ἐλπὶς ζωῆς·
    ἐὰν δὲ ἐπιστρέψωσι καὶ ἁγνῶς τελειώσωσι τὴν διακονίαν αὐτῶν, δυνήσονται ζῆσαι. 3. οἱ δὲ ἐψωριακότες,
    οὗτοι οἱ ἀρνησάμενοί εἰσι καὶ μὴ ἐπιστρέψαντες ἐπὶ τὸν κύριον ἑαυτῶν, ἀλλὰ χερσωθέντες καὶ γενόμενοι
    ἐρημώδεις, μὴ κολλώμενοι τοῖς δούλοις τοῦ Θεοῦ, ἀλλὰ μονάζοντες, ἀπολλύουσι τὰς ἑαυτῶν ψυχάς. 4. ὡς
    γὰρ ἄμπελος ἐν φραγμῷ τινι καταλειφθεῖσα ἀμελείας τυγχάνουσα καταφθείρεται καὶ ὑπὸ τῶν βοτανῶν ἐρημοῦται,
    καὶ τῷ χρόνῳ ἀγρία γίνεται, καὶ οὐκέτι εὔχρηστός ἐστ⸢ι⸣ τῷ δεσπότῃ ἑαυτῆς, οὕτω καὶ οἱ τοιοῦτοι ἄνθρωποι
    ἑαυτοὺς ἀπεγνώκασι, καὶ γίνονται ἄχρηστοι τῷ κυρίῳ ἑαυτῶν ἀγριωθέντες. 5. τούτοις οὖν μετάνοια γίνεται,
    ἐὰν μὴ ἐκ καρδίας εὑρεθῶσιν ἠρνημένοι· ἐὰν δὲ ἐκ καρδίας εὑρεθῇ ἠρνημένος τις, οὐκ οἶδα εἰ δύναται
    ζῆσαι. 6. καὶ τοῦτο οὐκ εἰς ταύτας τὰς ἡμέρας λέγω, ἵνα τις ἀρνησάμενος μετάνοιαν λάβῃ· ἀδύνατον γάρ
    ἐστι σωθῆναι τὸν μέλλοντα νῦν ἀρνεῖσθαι τὸν Κύριον ἑαυτοῦ· ἀλλ᾿ ἐκείνοις τοῖς πάλαι ἠρνημένοις δοκεῖ
    κεῖσθαι μετάνοια. εἴ τις οὖν μέλλει μετανοεῖν, ταχινὸς γενέσθω πρὶν τοῦ πύργου ἀποτελεσθῆναι· εἰ δὲ
    μή, ὑπὸ τῶν γυναικῶν καταφθαρήσεται εἰς θάνατον. 7. καὶ οἱ κολοβοί, οὗτοι δόλιοί εἰσι καὶ κατάλαλοι·
    καὶ τὰ θηρία ἃ εἶδες εἰς τὸ ὄρος οὗτοί εἰσιν. ὥσπερ γὰρ τὰ θηρία διαφθείρει τῷ ἑαυτῶν ἰῷ τὸν ἄνθρωπον
    καὶ ἀπολλύει, οὕτω καὶ τῶν τοιούτων ἀνθρώπων τὰ ῥήματα διαφθείρει τὸν ἄνθρωπον καὶ ἀπολλύει. 8. οὗτοι
    οὖν κολοβοί εἰσιν ἀπὸ τῆς πίστεως αὐτῶν διὰ τὴν πρᾶξιν ἣν ἔχουσιν ἐν ἑαυτοῖς· τινὲς δὲ μετενόησαν
    καὶ ἐσώθησαν. καὶ οἱ λοιποὶ οἱ τοιοῦτοι ὄντες δύνανται σωθῆναι, ἐὰν μετανοήσωσιν· ἐὰν δὲ μὴ μετανοήσωσιν,
    ἀπὸ τῶν γυναικῶν ἐκείνων, ὧν τὴν δύναμιν ἔχουσιν, ἀποθανοῦνται.
