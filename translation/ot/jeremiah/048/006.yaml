id: JER.48.6
reference: Jeremiah 48:6
source:
  edition: WLC
  text: נֻ֖סוּ מַלְּט֣וּ נַפְשְׁ/כֶ֑ם וְ/תִֽהְיֶ֕ינָה כַּ/עֲרוֹעֵ֖ר בַּ/מִּדְבָּֽר׃
translation:
  text: Flee! Escape with your lives, and be like a shrub[a] in the wilderness.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “like Aroer in the wilderness.” The Hebrew term may be a place-name; if it names a shrub, the species is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: נֻסוּ
  chosen: Flee!
  alternatives:
  - Run!
  - Take flight!
  lexicon: HALOT
  rationale: Imperative plural from נוס, a direct command to flee. 'Flee' is concise, idiomatic, and preserves the urgency of the Hebrew imperative.
- source_word: מַלְּטוּ
  chosen: Escape
  alternatives:
  - Save
  - Deliver
  lexicon: HALOT
  rationale: Piel imperative plural from מלט, here functioning with נַפְשְׁכֶם to mean 'save/escape with your lives.' 'Escape' fits the flight context and avoids an awkwardly literal 'deliver your souls.'
- source_word: נַפְשְׁכֶם
  chosen: your lives
  alternatives:
  - yourselves
  - your souls
  lexicon: HALOT
  rationale: נֶפֶשׁ in survival contexts commonly means 'life' or 'self.' Here, with flight imperatives, 'your lives' is the most natural English rendering and best conveys the sense of preserving life.
- source_word: וְתִהְיֶינָה
  chosen: and be
  alternatives:
  - and become
  lexicon: HALOT
  rationale: Qal imperfect 2fp of היה used jussively/imperativally after the preceding commands. English idiom favors continuing the command sequence with 'and be.' The feminine plural form likely agrees with the addressees as a collective/city population rather than requiring a marked English distinction.
- source_word: כַּעֲרוֹעֵר
  chosen: like a juniper
  alternatives:
  - like Aroer
  - like a desert shrub
  - like a tamarisk
  lexicon: HALOT
  rationale: The noun is traditionally understood here as a plant/shrub rather than the place-name Aroer. In context with 'in the wilderness,' a solitary desert shrub image fits the simile. 'Juniper' is a conventional and readable rendering, though the exact species is uncertain.
- source_word: בַּמִּדְבָּר
  chosen: in the wilderness
  alternatives:
  - in the desert
  lexicon: HALOT
  rationale: מִדְבָּר denotes wilderness/desert land. 'Wilderness' preserves the biblical register while remaining natural English.
