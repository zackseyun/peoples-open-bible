theological_decisions:
- issue: Subject and sense of לֹא נָמוּת
  chosen_reading: We will not die
  alternative_readings:
  - You do not die
  rationale: The communal reading can express confidence in survival through judgment; the divine-subject alternative coheres with the address to God's antiquity and holiness. The commentary at 1QpHab V.3 interprets God as not destroying his people, but does not preserve the disputed biblical verb. The reported scribal-euphemism tradition may explain the received wording without proving a historical alteration. These contextual arguments do not uniquely establish earliest wording. See docs/HABAKKUK_1_12_SOURCE_COMPARISON_2026-09-06.md for the published passages and limits; no fresh HALOT, critical-apparatus or image consultation is claimed for this update.
  doctrine_reference: 'Translation philosophy 1 and 3: original-language primacy; preserve theological tension rather than resolve it'
