id: JOB.12.19
reference: Job 12:19
source:
  edition: WLC
  text: מוֹלִ֣יךְ כֹּהֲנִ֣ים שׁוֹלָ֑ל וְ/אֵֽתָנִ֣ים יְסַלֵּֽף׃
translation:
  text: He leads priests away stripped and overthrows those firmly established.
  philosophy: dynamic
lexical_decisions:
- source_word: מוֹלִיךְ
  chosen: leads away
  alternatives:
  - makes go
  - drives away
  - leads
  lexicon: HALOT
  rationale: Hiphil participle of הלך with God as the implied subject in context; conveys causing someone to go, here in the sense of leading off or away. 'Leads away' is idiomatic in English and fits the judgment context.
- source_word: כֹּהֲנִים
  chosen: priests
  alternatives:
  - priestly officials
  lexicon: HALOT
  rationale: Standard rendering of כהנים. In Job's wisdom context it refers to socially and religiously prominent figures; 'priests' is the plain lexical sense.
- source_word: שׁוֹלָל
  chosen: stripped
  alternatives:
  - as plunder
  - spoiled
  - despoiled
  - barefoot
  lexicon: HALOT
  rationale: Adjectival/participial form from שלל in a context of humiliation and dispossession. 'Stripped' communicates being deprived of possessions and honor. 'Despoiled' is possible but less natural; 'barefoot' is too interpretive here.
- source_word: אֵתָנִים
  chosen: the firmly established
  alternatives:
  - the enduring
  - the strong
  - the established ones
  lexicon: HALOT
  rationale: Expresses the adjective's core sense of firmness and endurance in the present context.
- source_word: יְסַלֵּף
  chosen: overthrows
  alternatives:
  - twists
  - subverts
  - ruins
  lexicon: HALOT
  rationale: Naturally conveys the contextual result of twisting or subverting these established persons.
