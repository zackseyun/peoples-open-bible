  from: He hurls at him and does not spare[b][a]; he surely flees from his hand.
  to: It hurls itself against him without pity[a]; he flees headlong from its hand.
  rationale: Verse 21 supplies the east wind as the likeliest continuing subject, so “it/its” is preferable to ambiguous masculine English pronouns. Because וְיַשְׁלֵךְ has no expressed object, “itself” is a contextual English completion and must be identified as such. “Fleeing, he flees” is unnatural gloss-English; the infinitive absolute here is better represented idiomatically by “flees headlong,” while acknowledging that the exact nuance is emphatic or urgent rather than lexically precise.
