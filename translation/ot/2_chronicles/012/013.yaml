theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Temple-election formula 'to put his name there'
  chosen_reading: Retain the concrete idiom without expanding it into a doctrinal paraphrase about presence or indwelling.
  alternative_readings:
  - to establish his presence there
  - to cause his name to dwell there
  rationale: The Hebrew speaks of YHWH choosing Jerusalem 'to put his name there.' Preserving the idiom avoids importing a more developed theological explanation than the text itself states.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
