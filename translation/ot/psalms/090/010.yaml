id: PSA.90.10
reference: Psalms 90:10
source:
  edition: WLC
  text: יְמֵֽי שְׁנוֹתֵ֨י/נוּ בָ/הֶ֥ם שִׁבְעִ֪ים שָׁנָ֡ה וְ/אִ֤ם בִּ/גְבוּרֹ֨ת שְׁמ֘וֹנִ֤ים שָׁנָ֗ה וְ֭/רָהְבָּ/ם עָמָ֣ל וָ/אָ֑וֶן כִּי גָ֥ז חִ֝֗ישׁ וַ/נָּעֻֽפָ/ה־׀־׃
translation:
  text: Our years amount to seventy, or eighty if we have the strength; yet their best[a] is toil and trouble, for life quickly passes[b], and we fly away.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “their boast” or “their pride.”
    reason: alternative_reading
  - marker: b
    text: Or, “life is quickly cut off.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְמֵי שְׁנוֹתֵינוּ
  chosen: The days of our years
  alternatives:
  - The years of our life
  - Our lifespan
  lexicon: HALOT
  rationale: A fairly literal rendering preserves the Hebrew idiom and poetic cadence. Smoother English alternatives are possible, but the idiom is intelligible and fitting in a psalm.
- source_word: בָהֶם
  chosen: are
  alternatives:
  - amount to
  - come to
  lexicon: HALOT
  rationale: The preposition with pronoun functions idiomatically in a statement of total lifespan ('in them/among them'). English requires a copular sense here.
- source_word: שִׁבְעִים שָׁנָה
  chosen: seventy years
  lexicon: HALOT
  rationale: Straightforward numerical expression.
- source_word: וְאִם בִּגְבוּרֹת
  chosen: or eighty if we have the strength
  alternatives:
  - and if by strength
  - or with strength
  lexicon: HALOT
  rationale: Expresses the exceptional case of a lifespan extended by vigor.
- source_word: שְׁמֹונִים שָׁנָה
  chosen: eighty years
  lexicon: HALOT
  rationale: Straightforward numerical expression.
- source_word: וְרָהְבָּם
  chosen: yet their best
  alternatives:
  - their boast
  - their span's pride
  - their best
  lexicon: HALOT
  rationale: Contextually conveys what is most impressive or substantial about the years without introducing an unwarranted sense of arrogance.
- source_word: עָמָל וָאָוֶן
  chosen: toil and trouble
  alternatives:
  - labor and sorrow
  - toil and misery
  - trouble and wickedness
  lexicon: HALOT
  rationale: עָמָל commonly denotes toil/labor with hardship; אָוֶן can denote trouble, sorrow, or in some contexts iniquity. In this lifespan context, experiential misery rather than moral evil is in view, so 'toil and trouble' is the best natural pairing.
- source_word: כִּי גָז חִישׁ
  chosen: for it quickly passes
  alternatives:
  - for it quickly passes
  - for it is cut off quickly
  lexicon: HALOT
  rationale: Preserves both transience and rapidity in idiomatic English.
- source_word: וַנָּעֻפָה
  chosen: and we fly away
  alternatives:
  - and we are gone
  - and we pass away
  lexicon: HALOT
  rationale: The verb literally evokes flying/flying off. Retaining 'fly away' preserves the vivid poetic image and the first-person plural form.
- source_word: יְמֵי שְׁנוֹתֵינוּ בָהֶם
  chosen: Our years amount to
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English rendering of the Hebrew expression for the span of human life.
