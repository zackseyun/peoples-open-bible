translation:
  language: en
  text: '…the times are near and already closing in. The pitcher is near the well, the ship is near the harbor, the journey is near the city, and life is near its end.


    Therefore, accept his commandments. Then you will not be cut off from his great mercy, but will find rest instead of condemnation.


    For when the Most High brings these things to pass, there will be no more opportunity to reorient[a]. The times will no longer be held back, the seasons will not be extended, and no one will be able to turn toward rest. No one will be helped by prayer, by the mediation of the fathers, by the petitions of the prophets, or by the aid of the righteous. Neither the weeping of women, the tenderness of little children, the crying of infants, the innocence of newborns, nor the righteousness of their fathers will help. Nothing once thought to offer help will be able to help then.


    For each of us will then be judged alone.


    He will preserve for his age those who place their hope in him, but he will immediately destroy those who are defiled by sins.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
