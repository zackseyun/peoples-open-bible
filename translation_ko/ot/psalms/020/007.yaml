  text: 이들은 병거를 의지하고 저들은 말을 의지하지만, 우리는 우리 하나님 야훼의 이름을 부릅니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשִׁיחוֹ
  english_pob_choice: his anointed
  chosen_korean: 그의 메시아
  alternatives_korean:
  - 그의 기름부음받은 자
  - 그의 기름부은 이
  - 그의 그리스도
  lexicon: 메시아
  rationale: 시편의 문맥에서 מָשִׁיחַ는 단순한 직분 설명보다 왕적/구원사적 칭호를 띠므로, POB의 영어 선택인 his anointed를 한국어에서도 직설적으로 ‘메시아’로 옮겨 원의의 무게를 살렸습니다.
- source_word: יַעֲנֵהוּ
  english_pob_choice: he answers him
  chosen_korean: 그를 응답하시며
  alternatives_korean:
  - 그의 말을 들으시며
  - 그에게 대답하시며
  - 그에게 응답하시며
  lexicon: ענה
  rationale: 히브리어 ענה는 단순히 ‘대답하다’보다 기도와 요청에 대한 응답의 뉘앙스가 강하므로, POB의 answers him을 따라 ‘응답하시다’를 유지했습니다.
- source_word: מִשְּׁמֵי קָדְשׁוֹ
  english_pob_choice: from his holy heaven
  chosen_korean: 그의 거룩한 하늘에서
  alternatives_korean:
  - 그의 거룩한 하늘로부터
  - 그의 성스러운 하늘에서
  lexicon: שׁמים קדש
  rationale: 전치사 min의 출발점 의미를 한국어 조사 ‘-에서’로 자연스럽게 풀어, 하늘이 응답의 근원이라는 점을 드러냈습니다.
- source_word: בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ
  english_pob_choice: with the mighty saving deeds of his right hand
  chosen_korean: 그의 오른손의 강력한 구원 행위들로
  alternatives_korean:
  - 그의 오른손의 강력한 구원으로
  - 그의 오른손의 힘찬 구원 행위들로
  - 그의 오른손의 강한 구원 행위로
  lexicon: גבורה / ישע / ימין
  rationale: POB의 mighty saving deeds를 따라 복수형 ‘행위들’을 살리고, גבורות의 능력성과 ישע의 구원성을 함께 드러내기 위해 ‘강력한 구원 행위들’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 시편 본문의 히브리어 사본에 있는 신명사 표기는 학술적·직역적 원칙에 따라 ‘야훼’로 표기했습니다. 영어 POB의 LORD는 번역 관례상 해당 신명사를 가리킵니다.
  doctrine_reference: POB translation convention / source-language transparency
- issue: ‘his anointed’의 칭호성
  chosen_reading: 그의 메시아
  alternative_readings:
  - 그의 기름부음받은 자
  rationale: 문맥상 이 표현은 단순한 상태 설명이 아니라 야훼의 선택받은 왕적 인물을 가리키는 칭호이므로, POB의 선택을 따라 메시아적 함의를 보존했습니다.
  doctrine_reference: Psalmic royal-messianic terminology
