translation:
  language: en
  text: to be a minister of Christ Jesus to the Gentiles. I carry out priestly service by proclaiming God’s good news, so that the Gentiles may become an offering acceptable to God,[a] made holy by the Holy Spirit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “so that the offering made by the Gentiles may be acceptable to God.”
    reason: alternative_reading
  - marker: b
    text: Or “made holy in the Holy Spirit.”
    reason: lexical_alternative
