  source_fidelity: 현 초안은 시편 77:9가 아니라 앞 절의 내용(헤세드와 말씀/약속의 지속)을 번역하고 있어, 히브리어 본문인 ‘은혜를 베푸심’, ‘진노’, ‘긍휼’, ‘셀라’를 전혀 반영하지 못합니다. 본문에 맞추어 두 개의 수사 의문문과 셀라를 옮겨야 합니다.
