reference: Wisdom of Solomon 14:15
source:
  edition: lxx-swete-1909
  text: ἀώρῳ γὰρ πένθει τρυχόμενος πατήρ τοῦ ταχέως ἀφαιρεθέντος τέκνου εἰκόνα ποιήσας τὸν τότε νεκρὸν ἄνθρωπον νῦν ὡς θεὸν ἐτίμησεν, καὶ παρέδωκεν τοῖς ὑποχειρίοις μυστήρια καὶ τελετάς·
  language: Greek
  pages:
