  meaning_decisions:
  - source_phrase: עָרֵי מָעֻזּוֹ
    prior_rendering: his fortified cities
    new_rendering: Israel's fortified cities
    rationale: The surrounding verses concern Jacob's judgment and Israel's turn from idols; identifying the national referent removes an otherwise unclear pronoun.
  - source_phrase: כַּעֲזוּבַת הַחֹרֶשׁ וְהָאָמִיר
    prior_rendering: like the deserted places of the forest and the treetop
    new_rendering: like the deserted settlements in the woods and on the heights
    rationale: The comparison concerns abandoned habitation sites; “heights” conveys the elevated setting without suggesting cities situated in literal treetops. The difficult source wording and the ancient alternative are documented in notes.
  - source_phrase: אֲשֶׁר עָזְבוּ מִפְּנֵי בְּנֵי יִשְׂרָאֵל
    prior_rendering: which they abandoned before the sons of Israel
    new_rendering: abandoned as their inhabitants fled before the Israelites
    rationale: This supplies the understood inhabitants and makes the retreat-from-presence idiom clear; the Hebrew ethnonym denotes the Israelites, not only male descendants.
  - source_phrase: וְהָיְתָה שְׁמָמָה
    prior_rendering: and it will become a desolation
    new_rendering: the land will become desolate
    rationale: The implied devastated territory is made explicit, while the resultative transition is retained.
