id: JOB.34.11
reference: Job 34:11
source:
  edition: WLC
  text: כִּ֤י פֹ֣עַל אָ֭דָם יְשַׁלֶּם ל֑/וֹ וּֽ/כְ/אֹ֥רַח אִ֝֗ישׁ יַמְצִאֶֽ/נּוּ־׃
translation:
  text: For he repays a man for his deeds and brings upon each one what his way of life deserves.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - Because
  lexicon: HALOT
  rationale: Introduces the ground for Elihu's assertion in the surrounding context. 'For' best preserves the explanatory force in natural English.
- source_word: פֹעַל
  chosen: deed
  alternatives:
  - work
  - action
  lexicon: HALOT
  rationale: The noun refers to what a person does. 'Deed' fits the moral-retributive context better than the more neutral 'work' while remaining concise.
- source_word: אָדָם
  chosen: a man
  alternatives:
  - humankind
  - a person
  lexicon: HALOT
  rationale: The singular pairs naturally with the following singular אִישׁ and functions representatively. Per the gender-accurate policy, 'a man' preserves the Hebrew form and generic force better than a pluralized or neutralized rendering.
- source_word: יְשַׁלֶּם לוֹ
  chosen: he repays a man for his deed
  alternatives:
  - he pays him back
  - he recompenses him
  lexicon: HALOT
  rationale: The Piel is requital, and English “repay ... for” naturally conveys the relation signaled by the Hebrew.
- source_word: וּכְאֹרַח
  chosen: according to ... way
  alternatives:
  - according to ... path
  - in keeping with ... conduct
  lexicon: HALOT
  rationale: אֹרַח literally denotes a way or path and often metaphorically one's manner of life. 'Way' preserves the metaphor and is standard biblical English.
- source_word: אִישׁ
  chosen: a man's
  alternatives:
  - a person's
  - each man's
  lexicon: HALOT
  rationale: Like אָדָם, this singular masculine noun is representative/generic. Rendering it as 'a man's' preserves the parallelism and gender-accurate policy.
- source_word: יַמְצִאֶנּוּ
  chosen: he makes him find
  alternatives:
  - he causes it to come upon him
  - he lets him encounter
  - he brings upon him
  lexicon: HALOT
  rationale: The Hiphil of מצא can mean 'cause to find/experience.' In this context it expresses causing a person to meet the consequences corresponding to his way. 'Makes him find' stays close to the Hebrew while remaining intelligible; the more interpretive alternatives are preserved in a footnote.
- source_word: וּכְאֹרַח אִישׁ יַמְצִאֶנּוּ
  chosen: and causes each one to find what his way deserves
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This renders the causative sense of Hiphil מצא and the correspondence marked by כְּ without making the implied outcome into the more explicit noun “consequences.”
