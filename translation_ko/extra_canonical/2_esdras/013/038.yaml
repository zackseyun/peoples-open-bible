source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quibus incipient cruciari, Quae adsimilatae sunt flammae, et perdet eos sine labore et legem quae igni adsimilata est. Et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/038.yaml
  text: with which they are about to be tormented, which are likened to a flame; and he will destroy them without effort, and the law, which is likened to fire.
translation:
  language: ko
  text: 그것들로 말미암아 그들이 고통받기 시작할 것이며, 그것들은 불꽃에 비유되어 있습니다. 그는 수고 없이 그들을 멸하시고, 불에 비유된 율법도 멸하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quibus incipient cruciari
  english_pob_choice: with which they are about to be tormented
  chosen_korean: 그것들로 말미암아 그들이 고통받기 시작할 것이며
  alternatives_korean:
  - 그것들 때문에 그들이 괴로움을 당하기 시작할 것이며
  - 그것들로 인해 그들이 고문받기 시작할 것이며
  lexicon: cruciari
  rationale: 라틴어 cruciari의 강한 고통/괴로움 의미를 살리되, 문맥상 시작되는 상태를 드러내기 위해 ‘고통받기 시작할 것입니다’로 옮겼습니다.
- source_word: Quae adsimilatae sunt flammae
  english_pob_choice: which are likened to a flame
  chosen_korean: 그것들은 불꽃에 비유됩니다
  alternatives_korean:
  - 그것들은 불꽃과 같다고 여겨집니다
  - 그것들은 불꽃에 견주어집니다
  lexicon: adsimilatae sunt
  rationale: adsimilare의 ‘닮다/비슷하게 되다’ 의미를 반영하여 직설적으로 ‘비유됩니다’로 옮겼습니다.
- source_word: sine labore
  english_pob_choice: without effort
  chosen_korean: 수고 없이
  alternatives_korean:
  - 노력 없이
  - 애쓰지 않고
  lexicon: sine labore
  rationale: labore의 ‘수고, 노고’라는 뉘앙스를 살려 하나님의 행위가 무력함 없이 이루어짐을 드러냈습니다.
- source_word: legem quae igni adsimilata est
  english_pob_choice: the law, which is likened to fire
  chosen_korean: 불에 비유된 율법도 그렇게 하실 것입니다
  alternatives_korean:
  - 불에 비유된 그 율법도 멸하실 것입니다
  - 불과 같다고 여겨진 율법도 그렇게 하실 것입니다
  lexicon: legem ... igni adsimilata
  rationale: 법/원리로 약화하지 않고 문맥상 기존 종교적 규범을 가리키는 ‘율법’으로 유지했으며, 불과의 대비를 살렸습니다.
theological_decisions:
- issue: 마지막 절의 주어와 서술 범위
  chosen_reading: ‘그는’은 앞선 심판 행위의 주체로서 동일한 신적 주체를 가리키며, 뒤의 ‘율법도 그렇게 하실 것입니다’까지 같은 심판 동작으로 읽었습니다.
  alternative_readings:
  - 마지막 절을 별도 행위로 분리해 읽는 방식
  - ‘율법’을 다른 주체의 대상으로 보는 방식
  rationale: 라틴어 접속 구조상 동일한 심판 주체의 연속 동작으로 읽는 것이 가장 자연스럽고, 문맥의 종말 심판 진술과도 부합합니다.
  doctrine_reference: 종말 심판과 신적 주권
