revisions:
- from: 다윗이 자기와 함께 서 있는 사람들에게 말했습니다. 「블레셋 사람을 쳐서 넘어뜨리고 이스라엘에서 수치를 없애는 사람에게는 무엇이 해주어집니까? 이 할례받지 않은 블레셋 사람은 누구이기에 살아 계신 하나님의 군대 진지를 모욕합니까?」
  to: 다윗이 자기와 함께 서 있는 사람들에게 말했습니다. 「이 블레셋 사람을 쳐서 넘어뜨리고 이스라엘에서 수치를 없애는 사람에게는 무엇을 해 줍니까? 살아 계신 하나님의 전열을 모욕한 이 할례받지 않은 블레셋 사람이 도대체 누구입니까?」
  rationale: 첫 질문을 문법적이고 자연스러운 수혜자 중심의 수동 의미로 고쳤습니다. ‘군대 진지’를 원문의 군사 전열 의미에 맞는 ‘전열’로 수정했으며, 둘째 질문의 완료된 모욕 행위와 수사적 비난을 자연스럽게 재구성했습니다.
