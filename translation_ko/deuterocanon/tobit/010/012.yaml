  source_fidelity: 수정이 필요합니다. ‘보증물’은 παρακαταθήκη(맡겨 보관하는 것, 예탁물)의 뜻과 달리 담보·보증의 뜻으로 기울며, ‘드립니다’도 παρατίθεμαι(맡기다)를 양도하는 뜻으로 바꿉니다. 또한 ‘좋은 소식을 들려주기를’은 화자가 딸에게 소식을 전해 달라고 요청하는 뜻이 강해져, 자신이 딸에 관한 좋은 소식을 듣기를 바라는 원문과 다소 다릅니다.
  naturalness: 초안은 일부 문장이 현대 표준 한국어 합쇼체와 맞지 않습니다. 인용문 안의 ‘공경하라’, ‘부모이다’, ‘바라노라’는 문체가 섞여 있으므로 합쇼체로 통일했습니다. 자녀에 관한 구절도 ‘당신과 제 딸 사라 사이에서 난 자녀들’로 다듬어 관계를 명료하게 했습니다.
  terminology: ‘하늘의 주님’은 κύριος τοῦ οὐρανοῦ에 충실하고 적절합니다. πενθερούς는 문맥상 사라의 혼인 상대인 토비아의 부모를 가리키므로 ‘시부모님’으로 옮길 수 있습니다. παρακαταθήκη는 본문에서 ‘맡겨 둔 것’으로 처리하고, 각주에서 ‘예탁물’이라는 문자적 비유를 밝혔습니다.
  issues:
