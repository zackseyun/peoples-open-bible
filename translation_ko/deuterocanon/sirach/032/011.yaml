  to: 식사 자리에서는 말을 많이 하지 마십시오. 마음에 할 말이 떠오르더라도 그러하십시오. 떠날 때가 되면 머뭇거리지 말고, 집으로 돌아가 원하는 일을 이루십시오.
  rationale: 원문에 있으나 초안에서 빠진 양보절을 보완하고, 마지막 권면을 히브리어의 ‘바람을 이루다’라는 표현에 더 가깝게 조정했습니다. בעת מפקד의 정확한 어원적 분석에는 논의의 여지가 있으나, 이 문맥에서는 ‘떠날 때’라는 번역이 안전하며 별도 각주는 필요하지 않습니다.
