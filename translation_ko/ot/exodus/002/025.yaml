  source_fidelity: 히브리어는 문자적으로 “하나님께서 이스라엘 자손들을 보셨고, 하나님께서 아셨다”라고 하며, 초안은 두 번의 אֱלֹהִים과 וַיֵּדַע의 목적어 없는 표현을 모두 충실히 보존합니다. ‘이스라엘 자손들’은 בְּנֵי יִשְׂרָאֵל의 자연스럽고 정착된 한국어 대응입니다.
  naturalness: “하나님은 이스라엘 자손들을 보셨고, 하나님은 아셨습니다.”는 현대 표준 한국어 합쇼체로 자연스럽습니다. 두 번째 주어를 반복한 것은 원문의 반복을 살리며, 문맥상 중요한 종결적 강조에도 어울립니다.
  terminology: ‘하나님’과 ‘이스라엘 자손들’은 한국어 성경 번역 전통 및 본문의 지시 대상에 적절합니다. ‘아셨습니다’는 ידע의 열린 의미를 유지하여 ‘돌보셨다’나 ‘주목하셨다’처럼 해석적으로 한정하지 않습니다.
