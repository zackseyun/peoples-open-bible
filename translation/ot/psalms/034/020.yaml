id: PSA.34.20
reference: Psalms 34:20
source:
  edition: WLC
  text: שֹׁמֵ֥ר כָּל עַצְמוֹתָ֑י/ו אַחַ֥ת מֵ֝/הֵ֗נָּה לֹ֣א נִשְׁבָּֽרָה־׃
translation:
  text: Yahweh guards all the bones of the righteous man; not one of them is broken[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'Compare John 19:36: “Not one of his bones will be broken.”'
    reason: cross_reference
lexical_decisions:
- source_word: שֹׁמֵר
  lemma: שׁמר
  chosen: guards
  alternatives:
  - guards
  - watches over
  - preserves
  lexicon: HALOT
  rationale: “Guards” naturally represents the participle’s protective sense in this context without replacing the image of bodily preservation.
- source_word: כָּל
  chosen: all
  lexicon: HALOT
  rationale: 'Standard distributive sense: the totality of the bones is in view.'
- source_word: עַצְמוֹתָיו
  chosen: his bones
  alternatives:
  - all his bones
  lexicon: HALOT
  rationale: The noun means 'bones'; the 3ms suffix is best rendered 'his.' 'All' is represented with כָּל in the clause as a whole.
- source_word: אַחַת
  chosen: not one
  alternatives:
  - not a single one
  lexicon: HALOT
  rationale: Though literally 'one' (feminine, agreeing with implied 'bone'), in English the negated idiom is best expressed as 'not one'.
- source_word: מֵהֵנָּה
  chosen: of them
  alternatives:
  - from them
  lexicon: HALOT
  rationale: 'Partitive מן + pronoun indicates one out of the set: ''of them'' is the most idiomatic English rendering.'
- source_word: לֹא נִשְׁבָּרָה
  chosen: is broken
  alternatives:
  - will be broken
  - has been broken
  lexicon: HALOT
  rationale: The Niphal perfect of שׁבר means 'be broken.' In this poetic context, English present 'is broken' communicates the gnomic/proverbial force more naturally than a strict past or future.
