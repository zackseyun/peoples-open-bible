  to: 그것의 자랑은 방패들이 줄지어 선 것이며, 그것들은 단단히 봉인한 것처럼 빈틈없이 닫혀 있습니다.
  rationale: 영어 POB의 ‘proud rows’와 달리, 히브리어 본문에서는 גַּאֲוָה를 명사 ‘자랑’으로 보아 방패들의 줄지음이 그 존재의 자랑이라는 진술을 유지했습니다. 방패라는 본문 어휘를 보존하고, 단단한 봉인처럼 닫힌 상태라는 후반부의 이미지를 자연스러운 합쇼체로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
