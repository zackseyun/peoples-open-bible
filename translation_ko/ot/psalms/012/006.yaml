  text: The words of Yahweh are pure words, like silver refined in a furnace[a] on the earth[b], purified seven times.
  footnotes:
  - marker: a
    text: Hebrew of the final clause is difficult. Or, more literally, 'I will set in safety; he pants for it,' with some taking the sense as 'I will set him in safety from the one who snorts at him' or similar.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 말씀은 순수한 말씀, 땅 위의[b] 도가니[a]에서 제련되고 일곱 번 정련된 은과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 단어는 드물게 쓰이며 정확한 지시 대상이 확실하지 않습니다. ‘도가니’ 외에 ‘용광로’ 또는 ‘제련 용기’로 옮길 수도 있으나, 금속을 정련하는 것과 관련된 뜻은 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘땅 위에’입니다. 이 표현은 정련 과정의 장소나 배경을 나타낼 수 있으나, 정확한 뉘앙스는 확실하지 않습니다.
    reason: lexical_alternative
