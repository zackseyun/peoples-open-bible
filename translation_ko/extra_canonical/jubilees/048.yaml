- from: '1[1]. 그리고 마흔아홉째 희년 셋째 주 여섯째 해에 너희가 미디안 땅을 떠나 일년 일 년 오 주 동안 거주하였고 둘째 주에 애굽에 들어갔느니라. 2. 제오십년 희년에는 시내산에서 너희에게 말씀하신 것과 너희가 애굽에 들어갈 때에 마스테마 왕이 너희를 해하려 한 일을 너희가 알게 되리라. 3. 가는 길에 숙소에 와서 당신을 고소하려고 했습니다. 그리고 그는 당신을 죽이고 이집트인들을 당신의 손에서 구원하려고 온 힘을 다해 원했습니다. 그는 당신이 이 일을 하고 이집트를 심판하도록 보내심을 받은 것을 봤습니다. 4. 그러나 내가 너희를 그 손에서 건져내었으니 FN1__ 너희는 바로와 그의 온 집과 그의 신하와 그의 백성에게 행하라고 애굽에서 보내심을 받은 이적과 기사를 행하였느니라. 5. 주님께서 이스라엘을 위하여 그들에게 큰 원수를 갚으사 피와 개구리와 각다귀와 개 파리와 물집이 나는 악종과 가축의 사망과 우박으로 그들을 쳐서 그 싹이 돋는 것을 다 멸하시고 메뚜기가 그 남은 것을 먹음과 흑암과 우박과 사람과 짐승의 남은 것을 먹게 하셨으니 주님께서는 그들의 모든 신들에게 복수를 하셨습니다. 6. 그리고 그는 그들을 불태웠습니다. 그리고 모든 것이 당신의 손을 통해 보내진 것은 당신이 그것을 할 수 있도록 하신 것입니다. 7. 그리고 너는 이집트 왕 앞과 그의 모든 신하들 앞에서, 그의 백성 앞에서 말해야 했다. 모든 일이 주의 말씀대로 이루어지되 열 가지 크고 엄한 형벌이 애굽 땅에 임하고

    8. 이는 이스라엘을 위하여 원수를 갚으시려 하심이라 주님께서는 이스라엘을 위하여 모든 일을 행하셨으니 곧 아브라함과 세우신 언약대로 행하셨으니 이는 그들이 강포로 그들을 학대하였으므로 그들에게 보복하려 하심이었더라. 9. 그리고 마스테마 왕이 너희를 대적하여 너희를 바로의 손에 넘기려고 하였더니 그가 애굽 마술사들을 도왔더니 그들이 너희 앞에 서서 행하였느니라. 그들은 참으로 그들의 예술을 실천했고, 우리는 그들이 그들의 손으로 할 수 있도록 허락했습니다. 주님께서 악한 종기로 그들을 치시므로 그들이 능히 대항하지 못하였으니 이는 우리가 그들에게 마술의 표징 하나도 행하지 못하게 하였음이라. 모든 이적과 기사로 왕 마스테마가 부끄러움을 당하고 마침내 강성하여 애굽 사람들에게 외쳐 애굽의 모든 권세와 그 병거와 말과 애굽 온 무리를 거느리고 너희를 추격하라 하매 내가 애굽 사람과 이스라엘 사이에 서서 이스라엘을 그 손과 그 백성의 손에서 건져내매 주님께서 그들을 바다 가운데서 육지 같이 인도하여 내시니라 10.그가 인도하여 낸 모든 백성이 이스라엘의 뒤를 따르니 우리 하나님 주님께서 그들을 바다 가운데 깊은 데 던지셨으니 이스라엘 자손의 발 아래에 애굽 사람이 그 아들들을 강에 던진 것 같이 하였더라. 그 일로 말미암아 용사가 일만만 명이 죽었나니

    11. 그들이 강 가운데서 주의 백성에 대하여 내린 판결이니라 12. 그리고 14일, 15일, 16일, 17일, 18일에 마스테마 왕자는 결박되어 그 아이들을 쫓는 것이 금지되었습니다.

    13. 이스라엘을 고발하지 못하게 하셨느니라 14. 그리고 열아홉째 날에 우리는 그들을 놓아주었습니다. 이는 그들이 이집트 사람들을 돕고 이스라엘 자손들을 추격하게 하려는 것이었습니다. 15. 주님께서 그들의 마음을 강퍅케 하시고 완고하게 하셨으니 주님께서 애굽 사람을 쳐서 바다 가운데 던지실 일이 우리 하나님 주님께 숨겨졌느니라 그리고 열일곱째 날에 우리는 그를 결박하여 이스라엘 자손이 애굽 사람들에게 은 패물과 금 패물과 동 패물을 요구하던 날에 그로 그들을 고발하지 못하게 하였으니 이는 애굽 사람들이 그들을 강압적으로 학대한 대가로 약탈하려 함이니라. 그리고 우리는 이스라엘 자손을 이집트에서 빈손으로 데리고 나온 것이 아닙니다.'
