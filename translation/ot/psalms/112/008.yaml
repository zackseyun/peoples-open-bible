- timestamp: '2026-04-21T00:17:06Z'
  adjudicator: claude-opus-4-7
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/112/008.json
  category: mistranslation
  tier: 2
  from: until he looks on his adversaries
  to: until he looks in triumph on his adversaries
  rationale: The current rendering implies that the person's fearlessness ceases upon seeing their adversaries, which is the opposite of the Hebrew's intent. The phrase 'עַד אֲשֶׁר יִרְאֶה בְצָרָיו' means his confidence endures until the moment of his vindication *over* his foes. The verb 'ראה' with the preposition 'ב' in this context implies looking with satisfaction or triumph at the outcome. The literal 'until he looks on' is misleading in English, suggesting his courage fails at the critical moment. Adding 'in triumph' (or a similar clarifier like 'with satisfaction') is necessary to convey the correct meaning and resolve the temporal ambiguity of 'until'.
- timestamp: '2026-04-23T11:30:02Z'
  adjudicator: azure-gpt-5.4-revision-pass
  reviewer_model: gpt-5.4
  category: revision_pass
  from: His heart is steadfast; he will not fear, until he looks in triumph on his adversaries.
  to: His heart is steadfast; he will not fear until he looks on his adversaries.
  rationale: Removed the comma before 'until' for smoother English and omitted 'in triumph,' which is not explicitly present in the source text and adds interpretation beyond the verse.
- timestamp: '2026-08-28T22:10:04Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: idiom
  tier: 1
  from: His heart is steadfast[a]; he will not fear until he looks on his adversaries.
  to: His heart is secure; he will not fear until he looks in triumph on his adversaries.[a]
  rationale: “Secure” naturally represents the supported/established sense of סָמוּךְ and usefully avoids flattening it into the distinct “steadfast” wording of verse 7. In this hostile-vindication idiom, the righteous person’s seeing his adversaries is seeing their defeat; bare English “until he looks on his adversaries” can wrongly imply that fearlessness ends upon encounter. “Looks in triumph on” supplies the idiomatic force without discarding the source image of seeing. The note now follows “adversaries,” the word it addresses.
- timestamp: '2026-11-09T18:45:01Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: His heart is secure; he will not fear until he looks in triumph on his adversaries.[a]
  to: His heart is secure; he will remain fearless until he looks in triumph on his adversaries[a].
  rationale: The latest substantive review correctly restored the vindication idiom and distinguished “secure” from verse 7's “steadfast.” I preserve both gains and refine the negative-until construction so that it more clearly conveys continuing courage.
