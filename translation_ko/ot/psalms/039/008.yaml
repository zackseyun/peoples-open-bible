  - 무엇을 바라왔습니까
  lexicon: HALOT
  rationale: קוה는 ‘기다리다’와 ‘바라다/소망하다’의 의미가 겹치므로, 시편의 소망 문맥을 살려 ‘바라다’로 옮기되 반문형으로 현재의 긴장을 보존했습니다.
- source_word: תּוֹחַלְתִּי
  english_pob_choice: My hope
  chosen_korean: 제 소망
  alternatives_korean:
  - 제 희망
  - 제 기대
  - 제 기다림
  lexicon: HALOT
  rationale: תוחלת은 기대와 소망을 포함하지만, 시적 문맥에서 하나님께 향한 내적 기대를 가장 자연스럽게 드러내는 한국어는 ‘소망’입니다.
- source_word: לְךָ הִיא
  english_pob_choice: is in you
  chosen_korean: 주님께 있습니다
  alternatives_korean:
  - 주님께 향해 있습니다
  - 주님을 향합니다
  - 주님 안에 있습니다
  lexicon: HALOT
  rationale: לְ + 2인칭은 대상/방향을 표시하므로, 신뢰의 대상이 하나님임을 한국어 관용에 맞게 ‘주님께 있습니다’로 표현했습니다.
theological_decisions:
