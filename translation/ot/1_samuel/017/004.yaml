id: 1SA.17.4
reference: 1 Samuel 17:4
source:
  edition: POB-critical
  language: Hebrew
  text: ויצא איש הבנים ממחנות פלשתים גלית שמו מגת גבהו ארבע אמות וזרת׃
  note: Provisional editorial composite, not a transcription of one manuscript or a recovered autograph. The unpointed text retains the declared base except for the recorded changes; interpretive vocalization outside those changes follows the base.
  apparatus:
  - witness: WLC, 1 Samuel17:4
    reading: שש אמות וזרת
    note: Retained six alternative; exact pointed base preserved in restoration_draft.baseline.source.
  - witness: 4QSama (4Q51), DJD XVII pp78–79, fragments12–14 line3
    reading: ']א֯רבע[ א]מות וזרת'
    note: Initial bracket closes earlier supplied text; aleph of four uncertain, aleph of cubits supplied. Qualified published reading, not full-verse attestation.
  - witness: Cambridge1927, p55, Vaticanus-based main text B
    reading: τεσσάρων
    note: Four; edition text, not a new codex image reading.
  - witness: Cambridge1927, p55, main apparatus N
    reading: πεντε
    note: Five, with other supporting sigla not enumerated here.
  - witness: Cambridge1927, p55, main apparatus A (Alexandrinus)
    reading: εξ
    note: Six, with other supporting sigla not enumerated here.
  - witness: Cambridge1927, p55, separate bottom apparatus
    reading: σʹ εξ j
    note: Separately attributed six; not another continuous-text manuscript vote.
translation:
  text: Then a champion[a] came out from the camps of the Philistines; his name was Goliath, from Gath. His height was four cubits and a span[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebrew: ''a man of the between,'' likely referring to a representative fighter who steps out between the battle lines; hence ''champion.'''
    reason: lexical_alternative
  - marker: b
    text: POB provisionally selects “four,” supported by the published 4QSama (4Q51) reading and the Vaticanus-based Greek text. The scroll’s aleph is uncertain and part of “cubits” is supplied. The Masoretic Text and Greek Alexandrinus read “six”; other Greek witnesses read “five.” Using an 18-inch cubit, four cubits and a span is about 6 feet 9 inches (2.1 meters), and six is about 9 feet 9 inches (3.0 meters). Earlier wording and the precise measurement remain uncertain.
    reason: textual_variant
lexical_decisions:
- source_word: אִישׁ הַבֵּנַיִם
  chosen: a champion
  alternatives:
  - a man of the space between
  - an intermediary warrior
  - a man between the lines
  lexicon: HALOT
  rationale: The idiom literally refers to a 'man of the between/two spaces,' likely the fighter who steps out between battle lines for representative combat. 'Champion' is the established and contextually clear English rendering, while the more literal alternatives are preserved as lexical possibilities.
- source_word: וַיֵּצֵא
  chosen: came out
  alternatives:
  - went out
  lexicon: HALOT
  rationale: The verb means 'went out/came out.' In English narrative from the observer's perspective, 'came out' reads naturally and fits the scene of a warrior emerging from the Philistine side.
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  chosen: from the camps of the Philistines
  alternatives:
  - from the Philistine camp
  - from the ranks of the Philistines
  lexicon: HALOT
  rationale: The Hebrew noun is plural ('camps'). Retaining the plural reflects the source text more closely than the smoother singular. 'Philistines' is the standard transliteration of the people-group name.
- source_word: גָּלְיָת
  chosen: Goliath
  rationale: Personal names are transliterated by standard English convention per project philosophy.
- source_word: שְׁמוֹ
  chosen: his name was
  alternatives:
  - named
  lexicon: HALOT
  rationale: This is the straightforward nominal expression introducing the figure by name. 'His name was' preserves the Hebrew structure naturally.
- source_word: מִגַּת
  chosen: from Gath
  alternatives:
  - the Gittite
  lexicon: HALOT
  rationale: The Hebrew gives the place of origin directly, 'from Gath.' Rendering it this way is more literal than converting it to the gentilic 'the Gittite.'
- source_word: גָּבְהוֹ
  chosen: his height was
  alternatives:
  - he was tall to the measure of
  lexicon: HALOT
  rationale: The noun with suffix denotes his height/stature. 'His height was' is the natural English equivalent.
- source_word: ארבע אמות וזרת
  chosen: four cubits and a span
  alternatives:
  - six cubits and a span
  - five cubits and a span
  rationale: The provisional source selection adopts four, not a new meaning of six. Preserve cubits and span in the main text; the note labels approximate conversions and competing numerals. Reading notes and the Greek apparatus support a qualified preference, not historical certainty.
