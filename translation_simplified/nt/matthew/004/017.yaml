translation:
  language: en
  text: From that time on, Jesus began to proclaim, “Repent[c], for the kingdom of heaven[a] has come near[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek 'the kingdom of the heavens.' Matthew regularly uses this expression where other Gospels say 'the kingdom of God.'
    reason: simplification_note
  - marker: b
    text: Or 'is near.' The Greek verb suggests that the kingdom has arrived and remains close at hand.
    reason: simplification_note
  - marker: c
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
