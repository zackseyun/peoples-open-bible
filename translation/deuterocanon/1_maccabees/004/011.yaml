lexical_decisions:
- source_word: γνώσονται
  chosen: will know
  alternatives:
  - will come to know
  - will recognize
  lexicon: BDAG
  rationale: Future middle of γινώσκω here denotes coming to know/recognize a fact. 'Will know' is clear, natural English and preserves the predictive force.
- source_word: πάντα τὰ ἔθνη
  chosen: all the nations
  alternatives:
  - all the Gentiles
  - every nation
  lexicon: BDAG
  rationale: In this Jewish-Greek context ἔθνη can mean 'Gentiles,' but the phrase with πάντα is most naturally rendered 'all the nations,' preserving the universal political-ethnic scope without importing a narrower insider/outsider contrast.
- source_word: ὅτι ἔστιν
  chosen: that there is
  alternatives:
  - that he is
  lexicon: BDAG
  rationale: The Greek clause uses ἔστιν without an explicit subject before the articular participles. English requires some completion; 'there is' best reflects the existential construction and avoids over-specifying the referent in the main text.
- source_word: ὁ λυτρούμενος
  chosen: one who redeems
  alternatives:
  - the one who redeems
  - the deliverer
  - the one who ransoms
  lexicon: BDAG
  rationale: The present middle participle with article functions substantivally. 'One who redeems' preserves the ongoing, characteristic sense and the redemptive vocabulary, while remaining idiomatic.
- source_word: σώζων
  chosen: saves
  alternatives:
  - delivers
  - rescues
  lexicon: BDAG
  rationale: σῴζω commonly means 'save' or 'deliver.' 'Saves' pairs well with 'redeems' and preserves the theological resonance of the Greek without becoming wooden.
- source_word: τὸν Ἰσραήλ
  chosen: Israel
  alternatives:
  - the people of Israel
  lexicon: BDAG
  rationale: Directly transliterating the proper name is the most transparent rendering. The article in Greek does not require expansion in English.
