  text: εἶπεν πρὸς αὐτὴν Ὁλοφέρνης Εὖ ἐποίησεν ὁ θεὸς ἀποστεῖλας σε ἔμπροσθεν τοῦ λαοῦ, τοῦ γενήθηναι ἐν χερσὶν ἡμῶν κράτος· ἐν δὲ τοῖς φαυλίσασι τὸν κύριόν μου ἀπώλεια.
  language: Greek
