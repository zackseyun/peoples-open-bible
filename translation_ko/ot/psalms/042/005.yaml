  lexicon: HALOT
  rationale: 어려운 בַּסָּךְ와 दुर्लभ 동사 אֶדַּדֵּם의 행렬적 의미를 반영해, 단순 동행보다 ‘무리와 함께 지나가며’와 ‘인도하던’으로 축제 행렬의 움직임을 살렸습니다.
- source_word: בְּקוֹל רִנָּה וְתוֹדָה
  english_pob_choice: with the sound of joyful shouting and thanksgiving
  chosen_korean: 기쁨의 외침과 감사의 소리
  alternatives_korean:
