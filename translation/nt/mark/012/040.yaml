  rationale: The verse warns of punitive divine reckoning, not merely evaluative judgment. 'Condemnation' best captures the severity implied by the comparison 'greater.' This does not import a detailed doctrine of final judgment beyond the text's warning; it simply reflects the likely contextual force of κρίμα here.
