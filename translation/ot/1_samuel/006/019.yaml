id: 1SA.6.19
reference: 1 Samuel 6:19
source:
  edition: WLC
  text: וַ/יַּ֞ךְ בְּ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ כִּ֤י רָאוּ֙ בַּ/אֲר֣וֹן יְהוָ֔ה וַ/יַּ֤ךְ בָּ/עָם֙ שִׁבְעִ֣ים אִ֔ישׁ חֲמִשִּׁ֥ים אֶ֖לֶף אִ֑ישׁ וַ/יִּֽתְאַבְּל֣וּ הָ/עָ֔ם כִּֽי הִכָּ֧ה יְהוָ֛ה בָּ/עָ֖ם מַכָּ֥ה גְדוֹלָֽה־־
translation:
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, 'because they had looked at the ark of Yahweh.' The Hebrew permits an at/into interpretation; 'looked into' is retained provisionally, not settled by the casualty-count comparison.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew has 'seventy men, fifty thousand men,' without a conjunction between the numbers. 'Fifty thousand and seventy' and 'seventy out of fifty thousand' interpret their relationship. The selected Rahlfs/Hanhart Greek edition has both figures with a conjunction. Josephus (Antiquities 6.16) recounts seventy deaths but gives a different explanation of the offense; his retelling does not establish the exact Hebrew wording. POB retains both figures provisionally; the earliest wording remains unresolved.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  chosen: he struck down
  alternatives:
  - he struck
  - he smote
  lexicon: HALOT
  rationale: The surrounding account of death and mourning supports 'struck down'; the subject is understood as Yahweh, named later in the verse. This does not settle the mechanism of death or require an epidemic. No fresh lexicon consultation is claimed.
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  chosen: the men of Beth-shemesh
  alternatives:
  - the men among Beth-shemesh
  - the people of Beth-shemesh
  lexicon: HALOT
  rationale: אַנְשֵׁי is literally 'men of,' and the place name is transliterated per house style. 'Men' is retained as gender-accurate rather than neutralized to 'people.'
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  chosen: because they had looked into the ark of Yahweh
  alternatives:
  - because they had looked at the ark of Yahweh
  - because they had looked upon the ark of Yahweh
  lexicon: HALOT
  rationale: Retain 'looked into' provisionally, while disclosing 'looked at' as an alternative. The casualty-count comparison does not decide this construction; the selected Greek opening and Josephus retelling describe different offenses and do not prove this English wording. No fresh lexicon consultation is claimed.
- source_word: אֲרוֹן יְהוָה
  chosen: the ark of Yahweh
  alternatives:
  - the ark of the LORD
  lexicon: HALOT
  rationale: Align this construct phrase with the existing main text and project policy of rendering the divine name as Yahweh. This corrects inconsistent metadata, not Hebrew letters or a new lexical finding. No fresh lexicon consultation is claimed.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  chosen: seventy men, fifty thousand men
  alternatives:
  - seventy men out of fifty thousand men
  - fifty thousand and seventy men
  lexicon: HALOT
  rationale: Retain both numerical phrases provisionally. WLC has no conjunction between them; an additive 50,070 total or seventy out of fifty thousand interprets the relationship. The selected Rahlfs/Hanhart Greek has both figures with a conjunction. Josephus Antiquities 6.16 recounts seventy deaths, but a retelling does not establish exact Hebrew wording or independent manuscript support. Earliest wording remains unresolved. No fresh lexicon consultation is claimed.
- source_word: בָּעָם
  chosen: among the people
  alternatives:
  - of the people
  - among the populace
  lexicon: HALOT
  rationale: Retain the current 'among the people' rendering without moving it in this disclosure-only pass. Its English position between the numerical phrases differs from the Hebrew position before them and can affect interpretation; this pass does not certify that placement as optimal. No fresh lexicon consultation is claimed.
- source_word: וַיִּתְאַבְּלוּ
  chosen: mourned
  alternatives:
  - lamented
  - grieved
  lexicon: HALOT
  rationale: The hitpael of אבל denotes mourning or lamentation, especially after death or disaster. 'Mourned' is the most natural modern English equivalent.
- source_word: מַכָּה גְדוֹלָה
  chosen: a great blow
  alternatives:
  - a great slaughter
  - a great plague
  lexicon: HALOT
  rationale: מַכָּה is a 'blow,' 'stroke,' or 'plague.' Here 'great blow' preserves the lexical connection to the repeated verb נכה ('strike') and avoids importing a more specific category like epidemic unless context requires it.
