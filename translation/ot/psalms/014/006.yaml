  to: You try to thwart[a] the plans of the poor, but[b] Yahweh is their refuge.
  rationale: The most recent review restored causal 'for,' but the surrounding declaration of God's presence with the righteous supports a contrast between the evildoers' efforts and Yahweh's protection. I therefore use 'but' while preserving the later review's causal reading as an alternative.
