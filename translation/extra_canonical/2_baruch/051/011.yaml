translation:
  text: For the expanses of Paradise will be spread out before them; and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the armies of the angels—those now held fast by my word so that they may not appear, and those kept by my command, to stand in their places until their arrival[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'until their coming arrives'.
    reason: previous_rendering
