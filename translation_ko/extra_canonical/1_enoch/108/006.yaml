base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/006.yaml
  text: 'And he said to me, “This is the place that you see: here the spirits of sinners and blasphemers and those who do evil will be cast, and those who twist everything that the Lord has spoken by the mouth of the prophets—all the things that are to be done.”'
translation:
  language: ko
  text: 그가 내게 말했습니다. “네가 보는 곳이 바로 이곳입니다. 여기에는 죄인들과 신성을 모독하는 자들과 악을 행하는 자들의 영들과, 주께서 예언자들의 입을 통해 말씀하신 모든 것, 곧 이루어질 모든 것을 왜곡하는 자들이 던져질 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መካን
  english_pob_choice: the place that you see
  chosen_korean: 네가 보는 이곳
  alternatives_korean:
  - 네가 보는 장소
  - 네가 보는 곳
  lexicon: —
  rationale: 지시어와 시각적 대상을 자연스러운 현대 한국어로 옮기되, 단순한 ‘장소’보다 본문이 가리키는 특정한 ‘이곳’의 현장감을 살렸습니다.
- source_word: መናፍስተ፡ ኃጥኣን፡ ወጽኁፋን፡ ወእለ፡ ይገብሩ፡ እኩየ
  english_pob_choice: the spirits of sinners and blasphemers and those who do evil
  chosen_korean: 죄인들과 신성을 모독하는 자들과 악을 행하는 자들의 영들
  alternatives_korean:
  - 죄인들과 모독하는 자들과 악행자들의 영들
  - 죄인들과 신성모독자들과 악을 행하는 자들의 영들
  lexicon: —
  rationale: ‘영들’은 지옥의 거처에 놓이는 비인격적 존재군을 드러내며, ‘신성을 모독하는 자들’은 blasphemers의 의미를 직역해 종교적 모독성을 분명히 했습니다.
- source_word: ይመይጡ
  english_pob_choice: twist everything
  chosen_korean: 모든 것을 비틀어 놓는 자들
  alternatives_korean:
  - 모든 것을 왜곡하는 자들
  - 모든 것을 뒤틀어 놓는 자들
  lexicon: —
  rationale: English POB의 ‘twist’는 단순 오해가 아니라 본문 의미를 의도적으로 뒤틀는 행위를 가리키므로, 한국어에서도 물리적 비틀림의 이미지를 살렸습니다.
- source_word: ዘነገረ፡ እግዚእ፡ በኣፈ፡ ነቢያት
  english_pob_choice: the Lord has spoken by the mouth of the prophets
  chosen_korean: 주께서 예언자들의 입을 통해 말씀하신
  alternatives_korean:
  - 주께서 예언자들의 입으로 말씀하신
  - 주께서 예언자들을 통해 말씀하신
  lexicon: —
  rationale: ‘입을 통해’는 히브리적 관용구를 비교적 직접적으로 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 마지막 절의 ‘all the things that are to be done’의 범위와 문장 연결
  chosen_reading: ‘곧 이루어질 모든 것’으로 보충 구를 두어, 선지자들을 통해 말해진 것의 총체가 미래에 실현될 예언적 내용임을 드러냈습니다.
  alternative_readings:
  - ‘행해질 모든 것’
  - ‘일어날 모든 것’
  rationale: 게에즈 본문과 English POB 모두 미래 실현을 가리키는 맥락이므로, 단순한 행위 목록이 아니라 예언 성취의 총체를 나타내는 것으로 읽는 것이 적절합니다.
  doctrine_reference: 예언 성취와 심판의 확정성
- issue: ‘the Lord’의 표기
  chosen_reading: 본 절의 Lord는 고유명 야훼가 아니라 본문 내 지배자 표지로 읽어 ‘주’로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 인용 구조상 예언자들의 입을 통해 말씀하신 분을 지칭하는 일반적 주 호칭이므로, 이 문맥에서는 고유명 처리보다 ‘주’가 더 직접적입니다.
  doctrine_reference: 주 호칭의 문맥 판별
