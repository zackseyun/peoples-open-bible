  meaning_decisions:
  - source_phrase: מֵהַמִּדְבָּר וְהַלְּבָנוֹן הַזֶּה ... יִהְיֶה גְּבוּלְכֶם
    prior_rendering: From the wilderness and this Lebanon ... shall be your border
    new_rendering: Your territory will extend from the wilderness and Lebanon
    rationale: The verse describes the extent of the land, not a single border line. Placing the subject first clarifies the geographical declaration, while the demonstrative attached to Lebanon need not be reproduced as the unnatural English 'this Lebanon.'
  - source_phrase: כֹּל אֶרֶץ הַחִתִּים
    prior_rendering: —all the land of the Hittites—
    new_rendering: including all the land of the Hittites
    rationale: The supplied connection makes clear that the Hittite land belongs within the described territory without narrowing the geographical designation.
  - source_phrase: הַיָּם הַגָּדוֹל מְבוֹא הַשָּׁמֶשׁ
    prior_rendering: the Great Sea, toward the going down of the sun
    new_rendering: the Mediterranean Sea[a] to the west
    rationale: The first hearers recognized the sea and understood the sunset expression as a direction. The main text supplies that geographical meaning, while the note preserves the ancient sea designation.
