  from: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
  to: You ascended on high; you took captives; you received gifts among people[a], even among the rebellious, so that Yah God might dwell there[b].
  rationale: “Led captivity captive” is now opaque gloss-English; “took captives” conveys the concrete result of the cognate construction naturally. Generic “people” is suitable for אָדָם. The proposal’s final-clause note should be attached to “there” (or the final clause), not merely to “rebellious.”
