id: JOB.19.25
reference: Job 19:25
source:
  edition: WLC
  text: וַ/אֲנִ֣י יָ֭דַעְתִּי גֹּ֣אֲלִ/י חָ֑י וְ֝/אַחֲר֗וֹן עַל עָפָ֥ר יָקֽוּם־׃
translation:
  text: But as for me, I know that my Redeemer[a] lives, and at the last he will stand upon the dust[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “my Vindicator.” The Hebrew describes one who acts to defend a relative’s rights or cause.
    reason: alternative_reading
  - marker: b
    text: Or, “and as the last one he will stand over the dust.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  chosen: But as for me
  alternatives:
  - And I
  - But I
  lexicon: HALOT
  rationale: The conjunction with the independent pronoun is emphatic and contrastive in context. 'But as for me' brings out the marked personal assertion better than a bare 'And I.'
- source_word: יָדַעְתִּי
  chosen: I know
  alternatives:
  - I have known
  - I knew
  lexicon: HALOT
  rationale: The perfect here expresses Job's settled conviction in present relevance. English present 'I know' best communicates that force idiomatically.
- source_word: גֹּאֲלִי
  chosen: my Redeemer
  alternatives:
  - my vindicator
  - my kinsman-redeemer
  - my avenger
  lexicon: HALOT
  rationale: The noun גאל denotes one who acts as a family redeemer, defender, or vindicator. 'Redeemer' preserves the traditional and theological weight while remaining broad enough not to over-specify one legal nuance. Because 'vindicator' is a strong contextual option in Job, it is preserved in a footnote.
- source_word: חָי
  chosen: lives
  alternatives:
  - is living
  - is alive
  lexicon: HALOT
  rationale: Predicate adjective rendered idiomatically as the English verb 'lives.' This is the most natural way to express the ongoing reality asserted by the Hebrew.
- source_word: וְאַחֲרוֹן
  chosen: and at the last
  alternatives:
  - at the last
  - as the last one
  - finally
  lexicon: HALOT
  rationale: This reflects the adjective/substantive “last” in natural English without reducing it to the ordinary adverb “afterward” or forcing the predicative reading into the main text.
- source_word: עַל
  chosen: over
  alternatives:
  - upon
  - 'on'
  - against
  lexicon: HALOT
  rationale: The preposition commonly means 'on/upon/over.' 'Over' works naturally in English with 'rise' and leaves the exact spatial nuance open.
- source_word: עָפָר
  chosen: the dust
  alternatives:
  - dust
  - the grave
  lexicon: HALOT
  rationale: The Hebrew literally means 'dust.' Rendering it literally preserves the imagery and avoids prematurely interpreting it as 'grave,' though that interpretive sense may be in view.
- source_word: יָקוּם
  chosen: he will stand
  alternatives:
  - he will stand
  - he will arise
  lexicon: HALOT
  rationale: “Stand” directly represents קום here and avoids making resurrection imagery more explicit than the disputed clause warrants.
- source_word: עַל עָפָר
  chosen: upon the dust
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This preserves the ordinary spatial relation and the concrete Hebrew image without interpreting עָפָר as “earth” or “grave.”
