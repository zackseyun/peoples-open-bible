  text: Lord, Father and Master of my life, do not abandon me to their counsel; do not let me fall by them.
translation:
  language: ko
  text: 주님, 제 생명의 아버지이시며 주인이신 분이시여, 저를 그들의 꾀 속에 버려두지 마시고, 그들 가운데서 넘어지게 하지 마소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: κύριος
  rationale: 호격으로 하나님께 직접 부르는 기도문이므로 ‘주님’이 한국어 예배체에서 가장 자연스럽고, 본문 전체의 간구 어조를 살립니다.
- source_word: πάτερ
  english_pob_choice: Father
  chosen_korean: 아버지이시며
  alternatives_korean:
  - 아버지
  - 아버지여
  lexicon: πατήρ
  rationale: 하나님을 부르는 호칭이므로 존칭 서술로 처리해 ‘주님, 제 생명의 아버지이시며…’처럼 자연스럽게 연결했습니다.
- source_word: δέσποτα
  english_pob_choice: Master
  chosen_korean: 주인이신 분
  alternatives_korean:
  - 주인
  - 통치자
  - 주재자
  lexicon: δεσπότης
  rationale: δεσπότης의 강한 주권성과 소유권을 살리기 위해 ‘주인’의 의미를 유지하되, 하나님 호칭에 맞게 ‘이신 분’으로 풀어 표준어 문맥에 맞췄습니다.
- source_word: ἐν βουλῇ αὐτῶν
  english_pob_choice: to their counsel
  chosen_korean: 그들의 계략에
  alternatives_korean:
  - 그들의 뜻에
  - 그들의 꾀에
  - 그들의 의논에
  lexicon: βουλή
  rationale: 문맥상 단순한 ‘상담’보다 해로운 의도와 책략의 뉘앙스가 강하므로 ‘계략’이 더 적절합니다.
- source_word: πεσεῖν ἐν αὐτοῖς
  english_pob_choice: fall by them
  chosen_korean: 그들 때문에 넘어지지
  alternatives_korean:
  - 그들 가운데 넘어지지
  - 그들 안에서 넘어지지
  - 그들에게 쓰러지지
  lexicon: πίπτω
  rationale: 영 POB의 ‘by them’은 단순한 공간 관계보다 원인·매개를 드러내므로, ‘그들 때문에 넘어지지’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 호격 기도문의 하나님 호칭을 어떻게 한국어로 살릴지
  chosen_reading: ‘주님, 제 생명의 아버지이시며 주인이신 분이시여’로 하나님께 직접 드리는 기도 어조를 유지했습니다.
  alternative_readings:
  - ‘주여, 제 생명의 아버지와 주인이시여’
  - ‘주님, 제 생명의 아버지와 주인이신 분이시여’
  rationale: 본문은 지혜문학적 기도로서 친밀한 호칭과 주권적 호칭을 함께 사용하므로, 두 층위를 모두 살리되 한국어에서 과도하게 경직되지 않게 했습니다.
  doctrine_reference: 하나님의 아버지 되심과 주권
- issue: ‘저를 그들의 계략에 내버려 두지 마시고’와 ‘그들 때문에 넘어지지 않게 하소서’의 관계
  chosen_reading: 두 간구를 분리된 요청으로 두어, 외적 유혹에 대한 보호와 실제적 타락의 방지를 모두 드러냈습니다.
  alternative_readings:
  - ‘저를 그들의 뜻에 버려 두지 마시고’
  - ‘저를 그들 가운데 넘어지지 않게 하소서’
  rationale: 그리스어의 두 부정 간구는 의미상 연결되지만 각각 다른 위험을 말하므로, 한국어에서도 둘을 나눠 원문의 긴장과 중복 효과를 보존했습니다.
  doctrine_reference: 인간의 연약함과 하나님의 보호
