  from: Then I turned to consider all the works that my hands had done[a], and the labor that I had labored to do; and behold, all was vanity and a chasing after wind[c][b], and there was no profit under the sun.
  to: Then I turned to consider all the works that my hands had done, and the labor I had put into doing them; and behold, all was vanity[a] and a chasing after wind[b], and there was no profit[c] under the sun.
  rationale: The current repeated “labor/labored” construction is unidiomatic in this English syntax, particularly with the bare infinitive. “The labor I had put into doing them” naturally represents the effort expended in making the preceding works; “them” has a clear antecedent and does not materially specify the Hebrew's implicit object. The relocated notes now mark the terms they explain.
