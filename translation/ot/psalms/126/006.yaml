  category: ambiguity
  tier: 1
  from: He surely goes out weeping[a], carrying the seed for sowing; he will surely come in with joyful shouting[b], carrying his sheaves.
  to: He surely goes, weeping, carrying seed for sowing[a]; he will surely come with joyful shouting[b], carrying his sheaves.
  rationale: The current “goes out” and “come in” make directional nuances more explicit than the verbs require; plain “goes” and “come” preserve the source wording. Both infinitive-absolute constructions carry emphasis, so “surely” should be retained in both clauses. “Come back” is also more specific than the Hebrew, even though return is readily inferred from the agricultural scene. Because מֶשֶׁךְ הַזָּרַע is difficult, “seed for sowing” remains appropriately broad with a note. The note on רִנָּה remains useful in this verse and should not be removed merely because the word occurs elsewhere.
