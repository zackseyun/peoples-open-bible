revisions:
- from: 그곳에 야훼의 선지자 오벳이 있었는데, 그가 사마리아로 오는 군대 앞에 나가 그들에게 말했습니다. “보십시오, 너희 조상들의 하나님 야훼께서 유다에게 진노하셔서 그들을 너희 손에 넘기셨습니다. 그런데 너희는 그들을 하늘에까지 닿는 분노로 죽였습니다.”
  to: 그곳에 야훼의 선지자 오뎃이 있었는데, 그가 사마리아로 오는 군대 앞에 나가 그들에게 말했습니다. “보십시오, 너희 조상들의 하나님 야훼께서 유다에게 진노하셔서 그들을 너희 손에 넘기셨습니다. 그런데 너희는 그들을 죽였고, 너희의 분노는 하늘에까지 이르렀습니다.”
  rationale: 인명을 히브리어 עֹדֵד에 맞게 ‘오뎃’으로 교정했습니다. 또한 ‘하늘에까지 이르렀다’의 주어가 군대의 분노임을 분명히 하여, 원문의 술어 구조와 비난의 강도를 보존했습니다. 접속 표현 ‘그런데’는 앞선 신적 넘겨주심과 뒤이은 인간의 분노에 찬 살해 사이의 대조를 자연스럽게 드러냅니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:30Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 구문과 논리 관계는 대체로 충실합니다. 그러나 עֹדֵד의 인명은 ‘오벳’이 아니라 통상 ‘오뎃’으로 옮겨야 합니다. 또한 ‘하늘에까지 닿는’ 것은 살해 행위의 수식어가 아니라 그들의 분노가 하늘에 이르렀다는 진술이므로, 이를 독립 절로 명시하는 편이 원문에 더 정확합니다.
  naturalness: 합쇼체 문장은 자연스럽습니다. 마지막 구절을 ‘너희의 분노는 하늘에까지 이르렀습니다’로 풀면 한국어에서도 수식 범위가 명확해집니다.
  terminology: ‘야훼’, ‘선지자’, ‘진노’, ‘너희 손에 넘기셨습니다’는 일관되고 이해 가능한 성서 번역 용어입니다. 인명만 ‘오뎃’으로 바로잡아야 합니다.
