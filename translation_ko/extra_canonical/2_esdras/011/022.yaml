review_pass:
  verdict: revise
  source_fidelity: ‘tenebant principatum’은 통치권을 ‘보유하다/유지하다’라는 뜻이므로, ‘잡지 못했습니다’보다 ‘유지하지 못했습니다’가 원문의 미완료 과거와 의미에 더 가깝습니다. 끝의 ‘non’은 본문에 실제로 남아 있으므로 줄임표로 대체하지 않고 ‘아니’로 옮기되, 문장이 미완성이라는 점은 주석으로 밝혀야 합니다.
  naturalness: 합쇼체 서술을 유지했습니다. 다만 절 끝의 ‘아니’는 번역문으로서 다소 비문처럼 보일 수 있으나, 이는 현존 라틴어 본문의 단절을 충실히 보존하기 위한 것입니다.
  terminology: ‘통치권’은 principatum의 정치적 통치·지배 지위라는 의미를 적절히 전달합니다. ‘유지하다’는 tenebant의 ‘붙들고 있다/보유하다’에 맞습니다.
  issues:
  - severity: medium
    issue: 마지막 라틴어 non이 줄임표로 대체되었습니다.
    rationale: 원문과 영어 감사 기록 모두 절단된 본문 끝의 non(‘not’)을 보존합니다. 번역도 이 어휘를 ‘아니’로 남기고, 미완성 상태는 각주에서 설명해야 합니다.
  - severity: low
    issue: ‘통치권을 잡지 못했습니다’는 tenebant의 보유·유지 의미를 다소 약화합니다.
    rationale: ‘잡다’는 통치권을 획득하는 행위로 읽히기 쉬운 반면, tenere principatum은 통치권을 보유하거나 유지하는 것을 뜻합니다.
  revised_text: 그러나 그들은 통치권을 유지하지 못했습니다. 그 뒤에 내가 보니, 보십시오, 아니[a]
