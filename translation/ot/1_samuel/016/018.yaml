  from: who knows how to play, a mighty man of valor, a man of war, prudent in speech, a handsome man
  to: a skillful player, a mighty man of valor, a man of war, one prudent in speech, and a handsome man
  rationale: The current translation renders the list of David's qualities using a mix of grammatical forms (a relative clause, noun phrases, and an adjectival phrase). This slightly disrupts the parallelism and rhetorical force of the commendation. The Hebrew presents a more consistent series of adjectival descriptions. Recasting the list as a series of parallel noun phrases ('a skillful player... one prudent in speech...') would make the English more stylistically parallel and rhetorically effective, better reflecting the structure of the source text.
