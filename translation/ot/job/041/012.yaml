id: JOB.41.12
reference: Job 41:12
source:
  edition: WLC
  text: מִ֭/נְּחִירָי/ו יֵצֵ֣א עָשָׁ֑ן כְּ/ד֖וּד נָפ֣וּחַ וְ/אַגְמֹֽן׃
translation:
  text: Smoke goes out from his nostrils, like smoke from a pot over a fire of rushes.
  philosophy: dynamic
lexical_decisions:
- source_word: מִנְּחִירָיו
  chosen: from his nostrils
  alternatives:
  - from his snorting
  - from his nose
  lexicon: HALOT
  rationale: נְחִירַיִם denotes nostrils/nose; with the prefixed preposition and 3ms suffix, the phrase is most naturally 'from his nostrils.' 'Nostrils' preserves the vivid bodily imagery better than the broader 'nose.'
- source_word: יֵצֵא
  chosen: goes out
  alternatives:
  - comes out
  - issues forth
  lexicon: HALOT
  rationale: The imperfect of יצא here describes characteristic action in poetic description. 'Goes out' is a natural, fairly formal English equivalent that preserves the verbal image without over-paraphrase.
- source_word: עָשָׁן
  chosen: smoke
  lexicon: HALOT
  rationale: Standard rendering of עָשָׁן; no contextual reason to vary.
- source_word: כְּדוּד
  chosen: like a pot
  alternatives:
  - like a cauldron
  - like a kettle
  lexicon: HALOT
  rationale: דּוּד refers to a cooking pot/cauldron. 'Pot' is the most accessible modern English choice; the larger vessel nuance is not crucial enough here to require 'cauldron' in the main text.
- source_word: נָפוּחַ
  chosen: over a fire
  alternatives:
  - blown upon
  - kindled
  - fanned
  lexicon: HALOT
  rationale: The participle literally concerns blowing or fanning. In this compressed smoke-and-pot simile it points to a stoked fire; the rendering supplies the natural English relation without falsely translating the pot itself as explicitly “boiling.”
- source_word: וְאַגְמֹן
  chosen: a fire of rushes
  alternatives:
  - and rushes
  - and marsh-reeds
  lexicon: HALOT
  rationale: Rushes are likely understood as the fuel. This expresses the contextual relation while avoiding the unmarked adjective “burning.”
