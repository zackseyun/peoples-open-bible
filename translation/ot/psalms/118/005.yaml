id: PSA.118.5
reference: Psalms 118:5
source:
  edition: WLC
  text: מִֽן הַ֭/מֵּצַ֥ר קָרָ֣אתִי יָּ֑הּ עָנָ֖/נִי בַ/מֶּרְחָ֣ב יָֽהּ־׃
translation:
  text: Hemmed in, I called on Yah; Yah answered me and set me in a spacious place[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “From the narrow place I called on Yah; Yah answered me in a broad place.” The paired images describe distress and relief.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  chosen: Out of
  alternatives:
  - From
  lexicon: HALOT
  rationale: The preposition marks source or origin. 'Out of' fits the idiom of crying from a condition of distress and sounds natural in English while preserving the image.
- source_word: הַמֵּצַר
  chosen: my distress
  alternatives:
  - the strait
  - the narrow place
  - the tight place
  lexicon: HALOT
  rationale: מֵצַר literally denotes a narrow or constricted place and metaphorically distress. Because English 'strait' is archaic/ambiguous and the psalm clearly uses spatial imagery metaphorically, 'my distress' communicates the sense naturally. The possessive is implicit in English because the distress is the speaker's condition; the underlying spatial metaphor is preserved by contrasting it with 'spaciousness' later in the verse.
- source_word: קָרָאתִי
  chosen: I called on
  alternatives:
  - I called
  - I cried out to
  lexicon: HALOT
  rationale: קרא in prayer contexts commonly means to call upon someone. 'Called on' makes the object relationship explicit in English and suits invocation of the divine name.
- source_word: יָּהּ
  chosen: Yah
  alternatives:
  - the LORD
  lexicon: HALOT
  rationale: This is the short poetic form of the divine name, not the full tetragrammaton יְהוָה. The doctrine table specifies 'the LORD' for YHWH, but here the source text is specifically Yah. Transliteration preserves the distinct form and poetic force better than substituting the standard covenant-name convention.
- source_word: עָנָנִי
  chosen: answered me
  alternatives:
  - answered
  - responded to me
  lexicon: HALOT
  rationale: The verb means to answer or respond. 'Answered me' is the most direct and idiomatic rendering of the Hebrew suffix construction.
- source_word: בַמֶּרְחָב
  chosen: in a broad place
  alternatives:
  - into a broad place
  - in a spacious place
  - with freedom
  lexicon: HALOT
  rationale: The prefixed ב is naturally rendered locatively here, and מֶרְחָב preserves the corresponding broad-place image.
- source_word: יָהּ
  chosen: Yah
  alternatives:
  - the LORD
  lexicon: HALOT
  rationale: Repeated short divine name retained consistently for poetic parallelism and to reflect the Hebrew form.
- source_word: מִן הַמֵּצַר
  chosen: From the narrow place
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The phrase denotes a constricted place and is deliberately contrasted with the broad place later in the verse.
