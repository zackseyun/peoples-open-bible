translation:
  text: See with your own eyes that I was young[a], and I stood by her[b] and found her[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew 'small' may concern youth or status. 'Young' fits the neighboring youth reference, but 'small' or 'insignificant' remain possible; the adjective alone does not settle the interpretation.
    reason: lexical_alternative
  - marker: b
    text: The feminine suffixes are rendered 'her', referring contextually to Wisdom. 'I stood by her' can also express remaining or persisting in her; the standing idiom remains open.
    reason: lexical_alternative
  - marker: c
    text: Greek instead says the speaker labored little and found much rest for himself. It changes predicate and object, not merely the meaning of Hebrew 'small'.
    reason: textual_variant
lexical_decisions:
- source_word: רְאוּ בְעֵינֵיכֶם כִּי קָטֹן הָיִיתִי, וְעָמַדְתִּי בָהּ וּמְצָאתִיהָ.
  chosen: See with your own eyes that I was young, and I stood by her and found her.
  rationale: רְאוּ Qal imperative 2mp; קָטֹן adjective 'small/little', potentially age/status; הָיִיתִי Qal qatal 1cs; עָמַדְתִּי Qal qatal 1cs; בָהּ 3fs suffix; מְצָאתִיהָ Qal qatal 1cs with 3fs object. The youth interpretation is contextual rather than uniquely morphological. Both feminine suffixes are consistently 'her' in actual English, and 'stood by' expresses remaining or committed attachment. The old rationale claiming 'small' and impersonal 'it' are the active choices is superseded.
