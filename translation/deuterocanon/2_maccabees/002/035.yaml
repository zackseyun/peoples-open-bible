  validation: no_reference
translation:
  text: Then the Lord will reveal these things[a], and the glory of the Lord and the cloud[b] will appear, just as they appeared in the time of Moses and when Solomon prayed that the place would be greatly sanctified.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'The sacred objects Jeremiah had hidden: the tent, the ark, and the altar of incense.'
    reason: cultural_note
  - marker: b
    text: See Exodus 40:34–35 and 1 Kings 8:10–11 for the cloud and the glory of the Lord filling the sanctuary.
    reason: cross_reference
lexical_decisions:
- source_word: ἀναδείξει
  chosen: will disclose
  alternatives:
  - will reveal
  - will make known
  - will bring to light
  lexicon: LSJ
  rationale: The verb can mean to bring to light, display, or reveal. In this context, with ταῦτα ('these things') as object and followed by visible divine manifestations, 'will disclose' captures the sense of making previously hidden matters known without over-specifying how.
- source_word: ταῦτα
  chosen: these things
  alternatives:
  - these
  - them
  lexicon: LSJ
  rationale: The demonstrative is explicit in Greek and likely refers back to the hidden sacred items/traditions in the surrounding context. 'These things' preserves the referential openness better than a more interpretive gloss.
- source_word: ὀφθήσεται
  chosen: will appear
  alternatives:
  - will be seen
  - will become visible
  lexicon: LSJ
  rationale: Passive form of 'to see' commonly functions as 'appear' in English. This is natural modern English while preserving the manifestation sense.
- source_word: δόξα
  chosen: glory
  alternatives:
  - splendor
  - majesty
  lexicon: LSJ
  rationale: '''Glory'' is the standard biblical rendering and fits theophanic context. Alternatives like ''splendor'' are possible but lose intertextual resonance with divine manifestation language.'
- source_word: νεφέλη
  chosen: the cloud
  alternatives:
  - cloud
  lexicon: LSJ
  rationale: The article suggests a recognizable theophanic cloud known from Israel's traditions. 'The cloud' preserves that specificity.
- source_word: ἐπὶ Μωσῇ
  lemma: ἐπί
  chosen: in the case of Moses
  alternatives:
  - with Moses
  - for Moses
  - upon Moses
  lexicon: LSJ
  rationale: The preposition ἐπί with dative here is idiomatic and refers to the Mosaic precedent rather than physical location. 'In the case of Moses' communicates comparison to the earlier manifestation account.
- source_word: ἐδηλοῦτο
  chosen: it was shown
  alternatives:
  - it was made manifest
  - it was revealed
  lexicon: LSJ
  rationale: The imperfect/passive sense points to a prior manifestation. 'It was shown' is clear and sufficiently formal without becoming wooden.
- source_word: ἠξίωσεν
  chosen: asked
  alternatives:
  - requested
  - deemed worthy
  - prayed
  lexicon: LSJ
  rationale: In context Solomon is making a petition concerning the temple's sanctification. 'Asked' is the most straightforward rendering; 'prayed' is interpretive, though contextually plausible.
- source_word: ὁ τόπος
  chosen: the place
  alternatives:
  - the site
  - the sanctuary place
  lexicon: LSJ
  rationale: The Greek says 'the place,' likely referring to the temple site. The plain rendering preserves the wording and lets the context identify the referent.
- source_word: καταγιασθῇ
  chosen: might be sanctified
  alternatives:
  - might be consecrated
  - might be made holy
  lexicon: LSJ
  rationale: The verb denotes being made holy or consecrated. 'Sanctified' preserves biblical register and theological nuance; 'consecrated' is possible but slightly narrower.
- source_word: μεγάλως
  chosen: greatly
  alternatives:
  - magnificently
  - in a great way
  - exceedingly
  lexicon: LSJ
  rationale: The adverb intensifies the sanctification. 'Greatly' is simple and close to the Greek, avoiding the more interpretive 'magnificently'.
