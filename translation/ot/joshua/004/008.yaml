  from: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
  to: The Israelites did just as Joshua had commanded. They took up twelve stones from the middle of the Jordan, one for each tribe of Israel, just as Yahweh had told Joshua. They carried them across with them to their overnight camp and set them down there.
