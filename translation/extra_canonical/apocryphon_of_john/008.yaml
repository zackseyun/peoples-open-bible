translation:
  text: '1. Further, from the Precognition of Perfect Mind, by means of the revelation of the will of the unseen Spirit and the will of the self-generated one, (issued forth) ‹the› Perfect Man, the first revelation, even the truth.


    2. He is the one whom the virginal Spirit named Pigera-Adama(s), and he appointed him over «9» the first aeon together with the Mighty One, the self-generated one, Christ, by the first light, Armozel, escorted by his powers.


    3. Further, the unseen one granted him a spiritual, invulnerable strength,


    4. and he spoke and extolled and praised the unseen Spirit, saying: ‘On your account the All has come forth into being, and to you will return the All.


    5. I will praise and extol you and the self-generated one, and the three aeons, the Father, the Mother, the Son, the perfect power.’


    6. He appointed also his son Seth over the second aeon, in front of the second light, Oroiel, and inside the third aeon the seed of Seth was appointed over the third light, Daveithai, and (inside it) were placed the souls of the holy ones.


    7. Further, inside the fourth aeon were placed the souls of those unacquainted with the Fullness, and who failed to reorient[r1] immediately, but who instead continued (unwilling to reorient) for some time, and who reoriented (only) afterwards.


    8. These are the fourth light, Eleleth.


    9. These are creatures who extol the unseen Spirit.'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - Provisional rendering based on the supplied public-domain English witness.
  - The bare manuscript page number was removed where it interrupted the sentence.
  - Technical names and the unusual wording of paragraph 8 were preserved without harmonization.
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation. This reader text adapts the recorded English translation witness; it is not a verbatim quotation or a newly verified translation of the ancient-language text. The source witness is unchanged.
    reason: lexical_alternative
