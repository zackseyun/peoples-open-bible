  review_summary: “The man of your right hand” is gloss-like and ambiguous in an unhelpful English way. In this context אִישׁ יְמִינֶךָ naturally denotes the man positioned at or associated with God’s right hand. “At your right hand” is ordinary English and preserves the image without spelling out favor, support, or identity. “On” is preferable to unnecessarily elevated “upon.”
