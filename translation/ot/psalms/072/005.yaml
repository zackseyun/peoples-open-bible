id: PSA.72.5
reference: Psalms 72:5
source:
  edition: WLC
  text: יִֽירָא֥וּ/ךָ עִם שָׁ֑מֶשׁ וְ/לִ/פְנֵ֥י יָ֝רֵ֗חַ דּ֣וֹר דּוֹרִֽים־׃
translation:
  text: May they fear you as long as the sun and moon endure[a], through all generations.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “with the sun and before the moon,” a poetic expression for enduring duration.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירָאוּךָ
  chosen: May they fear you
  alternatives:
  - May they revere you
  - They will fear you
  lexicon: HALOT
  rationale: From ירא, 'to fear, revere.' In royal/psalmic context this can denote reverential fear rather than terror. English 'fear' preserves the lexical core and theological weight better than 'revere,' while 'may they fear you' reflects the common jussive/prayer-like force in context better than a simple future.
- source_word: עִם
  chosen: as long as
  alternatives:
  - with
  - while
  lexicon: HALOT
  rationale: 'Although עִם commonly means ''with,'' in this idiom with celestial bodies it expresses duration/contemporaneity: as long as the sun is present/endures. ''As long as'' communicates the temporal sense naturally in English.'
- source_word: שָׁמֶשׁ
  chosen: the sun endures
  alternatives:
  - the sun
  - the sun lasts
  lexicon: HALOT
  rationale: The noun itself is 'sun'; 'endures' is supplied in English to make the temporal idiom with עִם explicit and readable. This avoids a wooden 'with the sun' while preserving the sense of ongoing duration.
- source_word: וְלִפְנֵי
  chosen: and before
  alternatives:
  - and in the presence of
  - and as long as there is
  lexicon: HALOT
  rationale: לִפְנֵי is literally 'before/in front of.' With the moon in parallel to the previous colon, it functions idiomatically for continuing duration. 'Before' keeps the lexical form visible while remaining intelligible in poetic English.
- source_word: יָרֵחַ
  chosen: the moon
  lexicon: HALOT
  rationale: Straightforward rendering of the celestial body in parallel with 'sun.'
- source_word: דּוֹר דּוֹרִים
  chosen: through all generations
  alternatives:
  - generation to generations
  - for all generations
  lexicon: HALOT
  rationale: Natural English expressing continuing duration across generations.
- source_word: עִם שָׁמֶשׁ וְלִפְנֵי יָרֵחַ
  chosen: as long as the sun and moon endure
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The paired expressions are a poetic duration formula. This idiomatic English rendering preserves both celestial images and conveys their temporal force; the literal wording is retained in a note.
