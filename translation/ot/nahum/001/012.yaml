id: NAM.1.12
reference: Nahum 1:12
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם שְׁלֵמִים֙ וְ/כֵ֣ן רַבִּ֔ים וְ/כֵ֥ן נָגֹ֖זּוּ וְ/עָבָ֑ר וְ/עִ֨נִּתִ֔/ךְ לֹ֥א אֲעַנֵּ֖/ךְ עֽוֹד׀־׃
translation:
  text: 'This is what Yahweh says: Though they are at full strength and so numerous, they will still be cut down and pass away. Though I have afflicted you, Judah[a], I will afflict you no more.'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “you”; the promise is understood as addressing Judah, the nation oppressed by Assyria.
    reason: lexical_alternative
