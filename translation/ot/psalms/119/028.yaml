id: PSA.119.28
reference: Psalms 119:28
source:
  edition: WLC
  text: דָּלְפָ֣ה נַ֭פְשִׁ/י מִ/תּוּגָ֑ה קַ֝יְּמֵ֗/נִי כִּ/דְבָרֶֽ/ךָ׃
translation:
  text: My soul weeps with sorrow; sustain me according to your word.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּדְבָרֶֽךָ
  chosen: word
  alternatives:
  - matter
  - thing
  lexicon: HALOT
  rationale: דָּבָר is God's spoken word. Rendered 'word' consistently; paired with אִמְרָה ('promise') the two utterance-terms stay distinct.
- source_word: דָּלְפָה
  chosen: weeps
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: With the soul as subject and sorrow as the occasion, “weeps” naturally expresses the verb’s dripping image without replacing it with melting.
- source_word: קַיְּמֵנִי
  chosen: sustain me
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The imperative asks God to uphold or preserve the psalmist, which “sustain me” conveys directly.
