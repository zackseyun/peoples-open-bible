id: PRO.25.3
reference: Proverbs 25:3
source:
  edition: WLC
  text: שָׁמַ֣יִם לָ֭/רוּם וָ/אָ֣רֶץ לָ/עֹ֑מֶק וְ/לֵ֥ב מְ֝לָכִ֗ים אֵ֣ין חֵֽקֶר׃
translation:
  text: As the heavens are high and the earth is deep, so the hearts of kings cannot be searched out.
  philosophy: dynamic
lexical_decisions:
- source_word: שָׁמַיִם
  chosen: the heavens
  alternatives:
  - heaven
  - the sky
  lexicon: HALOT
  rationale: Plural form commonly denotes the heavens/sky. 'The heavens' fits English biblical style and preserves the elevated comparison with earth and kings' hearts.
- source_word: לָרוּם
  chosen: are high
  alternatives:
  - in height
  - as to height
  - for exaltation
  lexicon: HALOT
  rationale: Natural English supplies the implied copula and retains the dimensional image.
- source_word: וָאָרֶץ
  chosen: and the earth
  alternatives:
  - and earth
  - and the land
  lexicon: HALOT
  rationale: In parallel with 'the heavens,' אֶרֶץ here is cosmic 'earth,' not localized 'land.' The conjunction is retained.
- source_word: לָעֹמֶק
  chosen: is deep
  alternatives:
  - in depth
  - as to depth
  lexicon: HALOT
  rationale: Natural English supplies the implied copula and retains the dimensional image.
- source_word: לֵב
  chosen: the heart
  alternatives:
  - the mind
  - the inner being
  lexicon: HALOT
  rationale: '''Heart'' is the standard rendering and in Hebrew includes thought, intention, and inner disposition. It best preserves the metaphor without over-interpreting.'
- source_word: מְלָכִים
  chosen: of kings
  alternatives:
  - of rulers
  lexicon: HALOT
  rationale: The noun specifically means 'kings,' not the broader 'rulers.' Retaining 'kings' preserves the proverb's royal setting.
- source_word: אֵין חֵקֶר
  chosen: cannot be searched out
  alternatives:
  - is unsearchable
  - there is no fathoming
  - there is no understanding
  lexicon: HALOT
  rationale: This expresses the lack of successful searching while preserving the source image.
- source_word: לֵב מְלָכִים
  chosen: the hearts of kings
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The singular construct is naturally distributive with the plural referent in English.
