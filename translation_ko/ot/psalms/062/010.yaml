source:
  edition: WLC
  text: אַל תִּבְטְח֣וּ בְ/עֹשֶׁק֮ וּ/בְ/גָזֵ֪ל אַל תֶּ֫הְבָּ֥לוּ חַ֤יִל כִּֽי יָנ֑וּב אַל תָּשִׁ֥יתוּ לֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/010.yaml
  text: Do not trust in oppression, and do not be deluded by robbery[a]; if wealth increases, do not set your heart on it.
  footnotes:
  - marker: a
    text: The Hebrew verb is derived from the word for “vanity” or “emptiness.” Or, “do not be vain through robbery,” “do not set vain hope on robbery,” or “do not boast in robbery.”
    reason: lexical_alternative
translation:
  language: ko
  text: 억압을 신뢰하지 말며, 강탈한 것에 헛된 기대를 두지 마십시오[a]. 재물이 늘어난다 해도 거기에 마음을 두지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛된 기대를 두지 마십시오’로 옮긴 히브리어 동사는 뜻이 확실하지 않습니다. ‘강탈한 것을 두고 헛되이 자랑하지 마십시오’ 또는 ‘강탈한 것에서 헛된 행동을 하지 마십시오’로 이해할 수도 있습니다.
    reason: lexical_alternative
