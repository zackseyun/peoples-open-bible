translation:
  text: The Lord of Spirits commanded the angels who were coming not to raise their hands and to keep watch, because
    these angels were over the power of the waters.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Charles prints one negative ኢ before ያንሥኡ, a raising/lifting form; the raised 7 is an apparatus reference,
      not another source letter. Note 7 reports omission by u; note 8 gives a variant without the same causative
      vocalization. Dillmann, columns 636–637, supports raising or lifting, including hands. The following ወ coordinates
      the positive instruction to keep watch; “but” is not supplied. The source says “hands” without an overt possessive
      suffix; “their” identifies the commanded angels idiomatically in English.
