  source_fidelity: 히브리어는 장사 중인 사람들이 약탈대를 보고 시신을 엘리사의 무덤에 던졌으며, 그 사람이 가서 엘리사의 뼈에 닿은 뒤 살아나 자기 발로 일어섰다고 서술합니다. 초안은 핵심 사건과 순서를 대체로 충실히 옮겼으나, 약탈대를 본 주체가 문법상 불분명하고 ‘보니 약탈대가 보였습니다’는 원문의 능동 동작을 흐립니다. 또한 וַיֵּלֶךְ의 ‘가서’를 유지하는 것이 원문 및 영어 POB 감사 이력에 더 부합합니다.
  naturalness: ‘보니 약탈대가 보였습니다’는 같은 어근의 반복과 피동 표현 때문에 현대 한국어로 어색합니다. ‘그들이 약탈대를 보았습니다’로 주체를 명시하면 자연스럽고 명료합니다. 나머지 서술은 현대 공적 문체의 합쇼체에 적절합니다.
  terminology: ‘약탈대’, ‘엘리사의 무덤’, ‘엘리사의 뼈’, ‘살아나서’는 문맥과 핵심 용어를 적절히 전달합니다. ‘자기 발로 일어났습니다’도 עַל־רַגְלָיו의 신체적 표현을 잘 살립니다.
  issues:
