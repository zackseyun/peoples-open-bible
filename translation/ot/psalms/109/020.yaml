  from: This is the recompense from Yahweh for my accusers, for those who speak evil against me.[a]
  to: May this be the recompense from Yahweh for my accusers[a], for those who speak evil against me.
  rationale: 'The later review’s important clarification is retained: Yahweh supplies the recompense and the accusers receive it, rather than being its source. “Against me” also preserves its correction of the overly narrow “against my life”; the preceding prayer supplies the reason for the change in mood.'
