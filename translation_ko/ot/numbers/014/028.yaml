  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם חַי אָ֨נִי֙ נְאֻם יְהוָ֔ה אִם לֹ֕א כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם בְּ/אָזְנָ֑/י כֵּ֖ן אֶֽעֱשֶׂ֥ה לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: ko
  text: 그들에게 이렇게 말하십시오. ‘내가 살아 있음을 두고 맹세합니다. 주님의 선언입니다. 너희가 내가 듣는 데서 말한 그대로, 내가 반드시 너희에게 그렇게 하겠습니다.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָנִי / As I live
  english_pob_choice: As I live
  chosen_korean: 내가 살아 있음을 두고 맹세한다
  alternatives_korean:
  - 내가 살아 있다
  - 내 생명을 걸고
  lexicon: חַי
  rationale: 히브리어 관용구는 단순한 생존 진술이 아니라 엄숙한 맹세 공식을 이루므로, 한국어에서도 맹세의 힘이 드러나도록 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares the LORD
  chosen_korean: 야훼의 선언이다
  alternatives_korean:
  - 주님의 말씀이다
  - 여호와의 말씀이니라
  lexicon: נְאֻם + יהוה
  rationale: 본문의 발화 표지를 살려 직설적으로 ‘선언’으로 옮기되, 프로젝트 기본값에 따라 יהוה는 야훼로 반영했습니다.
- source_word: אִם לֹא ... כַּאֲשֶׁר
  english_pob_choice: surely just as
  chosen_korean: 너희가 ... 그대로
  alternatives_korean:
  - 반드시 ... 그대로
  - 정녕 ... 그대로
  lexicon: אִם לֹא + כַּאֲשֶׁר
  rationale: 히브리어의 강한 확언 구조를 반영해 ‘반드시’라는 확정성을 살렸고, 뒤의 비교구조는 ‘그대로’로 대응했습니다.
- source_word: בְּאָזְנַי
  english_pob_choice: in my hearing
  chosen_korean: 내 귀에
  alternatives_korean:
  - 내가 들은 대로
  - 내가 듣는 데서
  lexicon: אֹזֶן
  rationale: 직역에 가깝게 옮기되, 한국어에서 자연스럽게 이해되도록 ‘내 귀에’라고 했습니다.
theological_decisions:
- issue: 신적 자기맹세의 강도
  chosen_reading: ‘내가 살아 있음을 두고 맹세한다’로 옮겨, 하나님이 자신의 생명을 근거로 하시는 엄숙한 선포임을 드러냈습니다.
  alternative_readings:
  - 단순한 ‘내가 살아 있다’
  - 완화된 ‘틀림없이’
  rationale: 본문은 단순한 강조가 아니라 신적 자기맹세 공식이므로, 맹세성의 무게를 약화시키지 않도록 했습니다.
  doctrine_reference: 민수기 14장 문맥의 심판 선포; 하나님의 거룩하신 말씀의 확정성
- issue: 야훼 표기
  chosen_reading: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 반영했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문 명칭을 추적 가능하게 유지하면서도, 본문 발화의 주체가 분명히 드러나도록 했습니다.
  doctrine_reference: YHWH 표기 원칙
