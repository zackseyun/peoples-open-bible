lexical_decisions:
- source_word: ἠυφράνθη
  chosen: was delighted
  alternatives:
  - rejoiced
  - was gladdened
  lexicon: LSJ
  rationale: The passive/deponent form conveys that Holofernes became glad or delighted. 'Was delighted' fits natural English and preserves the emotional response without overstating it.
- source_word: ἀπʼ αὐτῆς
  lemma: ἀπό
  chosen: with her
  alternatives:
  - because of her
  - by her
  lexicon: LSJ
  rationale: 'The preposition ἀπό here marks source/cause: his delight arose from her presence or influence. ''With her'' is idiomatic in English in this context, while still reflecting that she is the occasion of his pleasure.'
- source_word: ἔπιεν οἶνον πολὺν σφόδρα
  chosen: he drank a very great amount of wine
  alternatives:
  - he drank very much wine
  - he drank a great deal of wine
  lexicon: LSJ
  rationale: πολὺν σφόδρα intensifies the quantity strongly. 'A very great amount of wine' preserves the emphatic excess more clearly than a flatter 'much wine.'
- source_word: ὅσον οὐκ ἔπιεν πώποτε
  chosen: as much as he had never drunk
  alternatives:
  - more than he had ever drunk
  - such as he had never drunk
  lexicon: LSJ
  rationale: ὅσον introduces the extent of his drinking, followed by a negated ever-clause. This rendering keeps the comparison of quantity explicit and close to the Greek structure.
- source_word: ἐν ἡμέρᾳ μιᾷ
  chosen: in a single day
  alternatives:
  - in one day
  lexicon: LSJ
  rationale: The phrase is straightforwardly temporal. 'In a single day' is idiomatic and preserves the emphasis on one day's span.
- source_word: ἀφʼ οὗ ἐγεννήθη
  chosen: since he was born
  alternatives:
  - from the time he was born
  - since his birth
  lexicon: LSJ
  rationale: This temporal expression marks the whole span of his life up to that point. 'Since he was born' is the clearest natural English equivalent.
