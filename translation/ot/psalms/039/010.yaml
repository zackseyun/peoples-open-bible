id: PSA.39.10
reference: Psalms 39:10
source:
  edition: WLC
  text: הָסֵ֣ר מֵ/עָלַ֣/י נִגְעֶ֑/ךָ מִ/תִּגְרַ֥ת יָ֝דְ/ךָ֗ אֲנִ֣י כָלִֽיתִי׃
translation:
  text: Remove the affliction you have brought on me; the attack of your hand has left me spent.
  philosophy: dynamic
lexical_decisions:
- source_word: הָסֵר
  chosen: Remove
  alternatives:
  - Take away
  - Turn away
  lexicon: HALOT
  rationale: Hiphil imperative of סור/סיר functions as a direct plea for removal. 'Remove' is concise, natural English and preserves the imperative force.
- source_word: מֵעָלַי
  chosen: from upon me
  alternatives:
  - from me
  - off me
  lexicon: HALOT
  rationale: Literally combines the preposition 'from' with 'upon me.' 'From upon me' preserves the spatial imagery more closely than the flatter 'from me,' while remaining intelligible.
- source_word: נִגְעֶךָ
  chosen: your stroke
  alternatives:
  - your stroke
  - your affliction
  lexicon: HALOT
  rationale: Avoids unnecessarily specifying a plague while retaining the sense of a divinely inflicted harm.
- source_word: מִתִּגְרַת
  chosen: because of the attack of
  alternatives:
  - from the hostility of
  - from the blow of
  - from the attack of
  lexicon: HALOT
  rationale: Conveys hostile onset and the causal force of the preposition in context.
- source_word: יָדְךָ
  chosen: your hand
  lexicon: HALOT
  rationale: A standard anthropomorphic expression for divine power or action. 'Hand' should be retained rather than paraphrased as 'power' to preserve the Hebrew imagery.
- source_word: אֲנִי
  chosen: I
  lexicon: HALOT
  rationale: Explicit pronoun adds emphasis in Hebrew; retained straightforwardly in English.
- source_word: כָלִיתִי
  chosen: I am spent
  alternatives:
  - am finished
  - waste away
  - am spent
  lexicon: HALOT
  rationale: Natural English for exhaustion or depletion in this lament context.
