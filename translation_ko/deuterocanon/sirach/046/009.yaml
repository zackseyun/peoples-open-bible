revisions:
- from: 그리고 주님께서 갈렙에게 힘을 주셨으며, 그는 노년이 올 때까지 그와 함께 머물렀습니다. 그래서 그는 땅의 높은 곳으로 올라갔고, 그의 자손은 유산을 차지했습니다.[a]
  to: 주님께서는 갈렙에게 힘을 주셨고, 그 힘은 노년에 이를 때까지 그와 함께 있었습니다. 그리하여 갈렙은 그 땅의 높은 곳으로 올라갔고, 그의 자손은 유산을 차지했습니다.[a]
