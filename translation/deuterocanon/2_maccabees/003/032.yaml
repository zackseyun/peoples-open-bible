  chosen_reading: physical recovery/preservation rather than spiritual salvation
  alternative_readings:
  - salvation
  - deliverance
  rationale: The immediate context concerns Heliodorus's bodily collapse and restoration after divine judgment. Rendering σωτηρία as 'recovery' preserves the narrative sense and avoids importing soteriological overtones not demanded by the text.
