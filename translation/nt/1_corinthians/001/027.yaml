  meaning_decisions:
  - source_phrase: τὰ μωρὰ τοῦ κόσμου
    prior_rendering: the foolish things of the world
    new_rendering: what the world considers foolish
    rationale: The surrounding contrast concerns wisdom measured by human standards. This wording makes that perspective explicit without suggesting that God endorses foolishness, while retaining the broad reference of the Greek rather than restricting it to people.
  - source_phrase: τὰ ἀσθενῆ τοῦ κόσμου
    prior_rendering: the weak things of the world
    new_rendering: what the world considers weak
    rationale: The parallel wording identifies weakness according to the world's measures of strength and status. 'What' naturally includes people without limiting the expression to them.
  - source_phrase: ἵνα καταισχύνῃ
    prior_rendering: so that he might shame
    new_rendering: to put ... to shame
    rationale: The Greek expresses God's purpose, not uncertainty about his ability or intention. The English infinitive conveys that purpose directly, and 'put to shame' preserves the force of overturning the standing of the wise and strong.
