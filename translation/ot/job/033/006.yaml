id: JOB.33.6
reference: Job 33:6
source:
  edition: WLC
  text: הֵן אֲנִ֣י כְ/פִ֣י/ךָ לָ/אֵ֑ל מֵ֝/חֹ֗מֶר קֹרַ֥צְתִּי גַם אָֽנִי־־׃
translation:
  text: Look, before God I am like you[a]; I too was shaped from clay[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “I am as you wished before God.” The Hebrew expression is uncertain.
    reason: alternative_reading
  - marker: b
    text: Literally, “pinched off from clay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  chosen: Look
  alternatives:
  - Behold
  - See
  lexicon: HALOT
  rationale: Discourse particle drawing attention emphatically. 'Look' is natural modern English while preserving the deictic force better than the more archaic 'Behold.'
- source_word: כְפִיךָ לָאֵל
  chosen: before God I am like you
  alternatives:
  - according to your wish before God
  - as your spokesman to God
  - as your equal before God
  lexicon: HALOT
  rationale: Avoids making Elihu Job’s spokesman while fitting the following emphasis on their common creatureliness; the difficult wording and alternatives are noted.
- source_word: מֵחֹמֶר
  chosen: from clay
  alternatives:
  - from the clay
  - from dust/clay
  lexicon: HALOT
  rationale: חֹמֶר denotes clay, mortar, or clay material. 'Clay' best fits the creation-from-earth imagery and the immediate claim of shared human origin.
- source_word: קֹרַצְתִּי
  chosen: was pinched
  alternatives:
  - was formed
  - was fashioned
  - was cut out
  lexicon: HALOT
  rationale: Keeps the verb’s tactile clay-working image without the less natural particle “off.”
- source_word: גַם אֲנִי
  chosen: I too
  alternatives:
  - also I
  - I also
  lexicon: HALOT
  rationale: Emphatic addition underscoring Elihu's solidarity with Job as likewise human.
