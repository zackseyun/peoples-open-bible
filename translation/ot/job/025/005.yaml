id: JOB.25.5
reference: Job 25:5
source:
  edition: WLC
  text: הֵ֣ן עַד יָ֭רֵחַ וְ/לֹ֣א יַאֲהִ֑יל וְ֝/כוֹכָבִ֗ים לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־־׃
translation:
  text: Indeed, in his eyes even the moon is not bright, and the stars are not pure[a];
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “bright.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  chosen: Indeed
  alternatives:
  - Indeed
  - Look
  lexicon: HALOT
  rationale: “Indeed” conveys the particle’s emphatic, attention-directing force without the archaizing register of “Behold.”
- source_word: עַד
  chosen: even
  alternatives:
  - as far as
  - up to
  lexicon: HALOT
  rationale: In this idiom with a following noun, it has an intensifying sense ('even the moon'), not a spatial or temporal meaning.
- source_word: יָרֵחַ
  chosen: the moon
  lexicon: HALOT
  rationale: Straightforward rendering of the celestial body named in the comparison.
- source_word: לֹא יַאֲהִיל
  chosen: does not shine
  alternatives:
  - is not bright
  - does not give light
  lexicon: HALOT
  rationale: The Hiphil of אהל here refers to giving light or shining. 'Does not shine' is idiomatic modern English and fits the poetic contrast with the stars.
- source_word: וְכוֹכָבִים
  chosen: and the stars
  lexicon: HALOT
  rationale: Simple coordinate continuation of the celestial imagery.
- source_word: לֹא זַכּוּ
  chosen: are not pure
  alternatives:
  - are not clean
  - are not bright
  lexicon: HALOT
  rationale: Though the root can carry ideas of cleanness or brightness, in context of evaluation before God and with the phrase 'in his eyes,' 'pure' best conveys moral/qualitative insufficiency without over-paraphrasing.
- source_word: בְעֵינָיו
  chosen: in his eyes
  alternatives:
  - in his sight
  - before him
  lexicon: HALOT
  rationale: A common Hebrew idiom for evaluation from someone's perspective. 'In his eyes' preserves the metaphor closely while remaining natural in English.
