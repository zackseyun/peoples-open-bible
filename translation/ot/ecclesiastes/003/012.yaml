  rationale: The proposed removal of the comparative is not a necessary correction. In this context, the idiom is naturally and well rendered as "there is nothing better for them than," even though a comparative preposition is not overtly present. The real needed correction is to attach the existing lexical-alternative note to "do good," rather than to "lives."
