  meaning_decisions:
  - source_phrase: ἄρχοντες τῶν κατοικούντων ἐν Βαιτυλουά
    prior_rendering: rulers of those who dwell in Bethulia
    new_rendering: rulers of Bethulia
    rationale: The phrase identifies the city's governing authorities; the shorter English conveys their relationship to its inhabitants without an unnecessary participial construction.
  - source_phrase: ὁ λόγος ὑμῶν ὃν ἐλαλήσατε ἐναντίον τοῦ λαοῦ ἐν τῇ ἡμέρᾳ ταύτῃ
    prior_rendering: your word that you spoke against the people on this day
    new_rendering: What you said before the people today
    rationale: Here ἐναντίον describes speaking in the people's presence; the preceding narrative shows an address to them, not a verbal attack against them.
  - source_phrase: ἐστήσατε τὸν ὅρκον ὃν ἐλαλήσατε ἀνὰ μέσον τοῦ θεοῦ καὶ ὑμῶν
    prior_rendering: you have set up the oath that you spoke between God and yourselves
    new_rendering: You have set terms between God and yourselves by the oath you swore
    rationale: Judith's objection is that their sworn deadline presumes to set conditions for God's action; the rendering makes the oath's function clear while preserving the relationship between the parties and noting the literal wording.
  - source_phrase: ἐκδώσειν τὴν πόλιν τοῖς ἐχθροῖς ἡμῶν
    prior_rendering: hand over the city to our enemies
    new_rendering: surrender the city to our enemies
    rationale: The military situation establishes surrender as the intended meaning.
  - source_phrase: ἐὰν μὴ ἐν αὐταῖς ἐπιστρέψῃ ὁ κύριος βοήθειαν ὑμῖν
    prior_rendering: if within these days the Lord does not turn back to help you
    new_rendering: unless the Lord comes to your aid within these five days
    rationale: The compressed construction concerns God's intervention to help them, not a physical turning movement; the pronoun refers to the five days already specified in the narrative.
