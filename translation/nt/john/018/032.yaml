theological_decisions:
- issue: Fulfillment language in relation to Jesus' prior prediction
  chosen_reading: 'Retain explicit fulfillment wording: ''the word of Jesus would be fulfilled.'''
  alternative_readings:
  - '''what Jesus had said would come true'''
  rationale: The Greek uses standard fulfillment language (πληρωθῇ) that carries theological weight in John, linking events to Jesus' authoritative foretelling. A looser rendering would be understandable but would weaken this motif.
  doctrine_reference: Translation philosophy §1, §5
- issue: Force of μέλλω in relation to Jesus' death
  chosen_reading: Render as imminent future ('was about to die') rather than stronger predestinarian language.
  alternative_readings:
  - '''was destined to die'''
  - '''was going to die'''
  rationale: The text states that Jesus had indicated the kind of death he was going to undergo; it does not itself require a stronger doctrinal claim about destiny in this clause. This preserves theological tension without overreading.
  doctrine_reference: Translation philosophy §3
revisions:
- timestamp: '2026-04-21T12:31:01Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/nt/john/018/032.json
  category: awkward_english
  tier: 1
  from: which he had spoken to indicate
  to: which he had spoken, indicating
  rationale: 'The Greek uses a circumstantial participle (σημαίνων) modifying the verb ''spoke''. While rendering this as an infinitive of purpose (''to indicate'') is not incorrect, it creates a slightly awkward English phrase (''spoken to indicate by what...''). Using an English participle (''indicating'') more closely mirrors the Greek syntax and results in a more fluid reading: ''...which he had spoken, indicating by what kind of death...'''
- timestamp: '2026-11-09T17:11:01Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
  to: This happened to fulfill Jesus’ words, by which he had indicated how he was going to die[a].
  rationale: The earlier revision rightly identified 'indicating' as describing what Jesus accomplished through his words. The new sentence preserves that relationship and the weight of fulfillment, while replacing the awkward relative construction and retaining the deliberate link to John 12:32–33.
