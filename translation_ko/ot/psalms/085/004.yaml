source:
  edition: WLC
  text: שׁ֭וּבֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ וְ/הָפֵ֖ר כַּֽעַסְ/ךָ֣ עִמָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/004.yaml
  text: Restore us[a], God of our salvation, and put away your anger from us.
  footnotes:
  - marker: a
    text: Or 'Turn us back, O God of our salvation.' The Hebrew verb can more literally mean 'cause us to return.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저희를 회복시켜 주십시오[a], 저희 구원의 하나님이시여. 저희를 향한 주의 분노를 거두어 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저희를 돌아오게 하여 주십시오.’ 히브리어 동사는 더 문자적으로는 ‘돌아오게 하다, 되돌리다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָסַפְתָּ
  english_pob_choice: you withdrew
  chosen_korean: 거두셨고
  alternatives_korean:
  - 물러가셨고
  - 취하셨고
  - 모으셨고
  lexicon: HALOT
  rationale: אסף는 ‘거두다, 모으다, 치우다’의 뜻을 가지며, 여기서는 ‘주의 모든 분노’를 더 이상 드러내지 않으시는 의미로 자연스럽게 옮겨야 하므로 ‘거두셨다’가 본문 이미지와 한국어 자연성을 함께 살립니다.
- source_word: עֶבְרָתֶךָ
  english_pob_choice: your wrath
  chosen_korean: 주의 모든 분노
  alternatives_korean:
  - 주의 진노
  - 주의 격노
  - 주의 노여움
  lexicon: HALOT
  rationale: עֶבְרָה는 단순한 노여움보다 강한 ‘격렬한 분노/진노’에 가깝지만, 시의 어조를 살리면서도 현대 한국어에서 분명하게 읽히도록 ‘분노’로 옮기고, 앞의 כָל을 반영해 ‘모든’을 넣었습니다.
- source_word: הֱשִׁיבוֹתָ מֵחֲרוֹן אַפֶּךָ
  english_pob_choice: you turned back from the burning of your anger
  chosen_korean: 주의 맹렬한 진노에서 돌이키셨습니다
  alternatives_korean:
  - 주의 타오르는 진노에서 물러나셨습니다
  - 주의 타는 분노에서 돌이키셨습니다
  - 주의 격렬한 노여움에서 돌이키셨습니다
  lexicon: HALOT
  rationale: הֵשִׁיב with מִן/מֵ conveys ‘~에서 돌이키다/물러서다’의 방향성을 살려 ‘돌이키셨습니다’로 옮겼고, חֲרוֹן은 불타는 열기 이미지를 보존하되 한국어로는 ‘맹렬한’이 시적·의미적으로 가장 자연스럽습니다.
theological_decisions:
- issue: 하나님의 분노를 어떻게 표현할지
  chosen_reading: 분노와 진노의 강한 이미지를 약화시키지 않고 그대로 살렸습니다.
  alternative_readings:
  - 노여움처럼 완화해 표현하기
  - 정서적 불편을 피하려 중립적으로 표현하기
  rationale: 히브리어는 하나님의 심판적 분노를 강한 열기 이미지로 묘사하므로, 이를 완화하지 않고 ‘분노/진노’로 유지해야 본문의 신학적 긴장이 보존됩니다.
  doctrine_reference: Psalm 85:4의 시적-신학적 이미지
