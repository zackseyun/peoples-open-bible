  lexicon: HALOT
  rationale: תַּמּוּ의 ‘끝나다/다하다’와 חֳרָבוֹת의 ‘폐허’ 이미지를 함께 살려, 결과 상태를 현대 한국어로 응축해 표현했습니다.
- source_word: נָתַשְׁתָּ
  english_pob_choice: you have uprooted
  chosen_korean: 뿌리째 뽑으셨으니
  alternatives_korean:
  - 뿌리째 뽑으셨습니다
  - 완전히 뽑아내셨으니
  lexicon: HALOT
  rationale: נתשׁ의 뿌리 뽑는 비유를 유지하면서, 완전한 제거의 폭력을 한국어 관용구 ‘뿌리째 뽑다’로 옮겼습니다.
- source_word: זִכְרָם הֵמָּה
  english_pob_choice: the very memory of them has perished
  chosen_korean: 그들의 기억마저 사라졌습니다
  alternatives_korean:
  - 그들에 대한 기억마저 사라졌습니다
