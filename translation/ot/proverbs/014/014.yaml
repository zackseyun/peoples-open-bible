id: PRO.14.14
reference: Proverbs 14:14
source:
  edition: WLC
  text: מִ/דְּרָכָ֣י/ו יִ֭שְׂבַּע ס֣וּג לֵ֑ב וּ֝/מֵ/עָלָ֗י/ו אִ֣ישׁ טֽוֹב׃
translation:
  text: The one whose heart turns away will have his fill of the fruit of his ways, but a good man will be satisfied with the fruit of his deeds[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “but a good man from what is upon him.” This difficult phrase may instead mean that the good man finds satisfaction within himself.
    reason: alternative_reading
lexical_decisions:
- source_word: מִדְּרָכָיו
  lemma: מִן
  chosen: with the fruit of his ways
  alternatives:
  - from his ways
  - by his ways
  lexicon: HALOT
  rationale: 'The preposition מִן with ''his ways'' marks source: he is satisfied from what his conduct produces. In English, ''filled with the fruit of his ways'' makes the causal/resultative sense clear and idiomatic while preserving the metaphor of being filled from one''s conduct.'
- source_word: יִשְׂבַּע
  chosen: will have his fill
  alternatives:
  - will be satisfied
  - will have his fill
  lexicon: HALOT
  rationale: Naturally expresses being full or sated while retaining the concrete metaphor.
- source_word: סוּג לֵב
  chosen: the one whose heart turns away
  alternatives:
  - the one who turns away in heart
  - the faithless in heart
  - the apostate in heart
  lexicon: HALOT
  rationale: Transparently conveys inward moral defection without importing the potentially technical label “backslider.”
- source_word: וּמֵעָלָיו
  chosen: but a good man from what is upon him
  alternatives:
  - and from above him
  - and from upon him
  - and beyond him
  lexicon: HALOT
  rationale: Preserves the difficult prepositional wording and the clause’s ellipsis more closely than interpretive references to deeds or to what “comes from” the man.
- source_word: אִישׁ טוֹב
  chosen: a good man
  alternatives:
  - a good person
  - a good one
  lexicon: HALOT
  rationale: The Hebrew is grammatically masculine singular and representative. Per translation philosophy, gender-accurate rendering is preferred where generic force is present. 'A good man' matches the source form and proverbial style.
