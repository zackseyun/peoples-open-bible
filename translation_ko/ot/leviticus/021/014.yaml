  source_fidelity: 원문의 네 부류와 금지-허용의 대조, 그리고 ‘자기 백성 가운데서’라는 한정은 초안에 대체로 반영되어 있습니다. 그러나 חֲלָלָה는 단순히 위생적으로 ‘더러운’ 여자를 뜻하지 않고 제사장 결혼 규정에서 부정/속됨의 지위와 관련된 표현이므로, ‘더러운 여자’는 부정확하고 불필요하게 모욕적으로 들릴 수 있습니다.
  naturalness: ‘아내로 취하지 말 것이요 … 취할지니라’는 이해 가능하지만 현대 표준 한국어 합쇼체로는 다소 고어적입니다. ‘아내로 맞이해서는 안 됩니다/맞아야 합니다’가 법규적 문맥을 유지하면서 더 자연스럽습니다.
  terminology: חֲלָלָה는 본문에서 ‘부정한 여자’로 옮기고, ‘속된 여자’ 및 ‘더럽혀진 여자’라는 가능한 어휘 대안을 주석으로 보존하는 것이 적절합니다. זֹנָה는 현대어로 ‘창녀’가 직접적 대응어입니다.
  issues:
  - severity: medium
    issue: ‘더러운 여자’
    rationale: חֲלָלָה의 제의적·법적 상태를 신체적 청결 또는 일반적 비난으로 축소할 수 있습니다. ‘부정한 여자’가 이 문맥의 의미를 더 충실히 전달합니다.
  - severity: low
    issue: 고어적 법문 종결 표현
    rationale: ‘취하지 말 것이요/취할지니라’ 대신 현대 합쇼체의 ‘맞이해서는 안 됩니다/맞아야 합니다’로 다듬을 수 있습니다.
  revised_text: 그는 과부나 이혼한 여자나 부정한 여자나 창녀, 곧 이런 여자들을 아내로 맞이해서는 안 됩니다. 오직 자기 백성 가운데서 처녀를 아내로 맞아야 합니다.
  revised_footnotes:
  - marker: a
    text: ‘부정한 여자’는 ‘속된 여자’ 또는 ‘더럽혀진 여자’로도 옮길 수 있습니다. 히브리어는 제사장의 거룩함에 관한 법에서 결혼에 적합하지 않다고 여겨진 여성의 지위를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: ‘더러운 여자’를 제사장 거룩함 규정의 문맥에 맞는 ‘부정한 여자’로 수정하고, 어휘적 불확실성과 대안을 주석에 보존했습니다. 또한 현대 표준 한국어 합쇼체에 맞게 법규 문장을 자연스럽게 다듬었으며, 원문의 집합 지시어 ‘이런 여자들’과 허용되는 대안의 대조를 명시했습니다.
