  - vindicate me
  rationale: 'The Hebrew נקם explicitly invokes divine vengeance/vindication. The translation preserves the text''s theological tension: Jeremiah appeals to God''s justice amid persecution, and the wording should not be diluted or moralized beyond the source text.'
