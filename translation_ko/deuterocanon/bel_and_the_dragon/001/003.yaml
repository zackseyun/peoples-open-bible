  text: And there was an idol among the Babylonians whose name was Bel, and for it twelve artabas of fine flour were spent each day.
translation:
  language: ko
  text: 바빌로니아 사람들에게는 벨이라는 이름의 우상이 있었고, 매일 고운 가루 열두 아르타바가 그것을 위해 소비되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
