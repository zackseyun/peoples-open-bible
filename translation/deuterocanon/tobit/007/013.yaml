  from: And he called Sarah his daughter[a], and taking her by the hand he gave her to Tobiah as a wife, and he said, “See, according to the law of Moses, take her and bring her to your father.” And he blessed them.
  to: He called his daughter Sarah, took her by the hand, and gave her to Tobiah as his wife. He said, “Here she is. In accordance with the law of Moses, receive her and take her to your father.” And he blessed them.
