base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/003.yaml
  text: Love one another from the heart; and if anyone sins against you, speak peace to him, and in your soul hold no deceit; and if he confesses and repents, forgive him.
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:54:56Z'
    unchanged: false
    changes_summary: Replaced 'changes his mind' with 'repents' for more accurate rendering of μετανοήσας while keeping the rest of the verse substantially unchanged.
translation:
  language: en
  text: Love one another sincerely. If someone sins against you, speak to him peacefully and do not harbor deceit in your heart. If he confesses his sin and reorients[a], forgive him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Love one another from the heart
  simplified_phrase: Love one another sincerely
  preserved_meaning: The love must be genuine and inward, not merely outward.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Sincerely” expresses heartfelt love in direct modern English.
- pob_phrase: speak peace to him
  simplified_phrase: speak to him peacefully
  preserved_meaning: The response to the offender should be peaceable rather than hostile.
  reasoning_layer_used: POB translation and Greek source image
  rationale: The recasting keeps the force of peace while making the command natural in English.
- pob_phrase: in your soul hold no deceit
  simplified_phrase: do not harbor deceit in your heart
  preserved_meaning: The speaker must not inwardly retain false or treacherous intent.
  reasoning_layer_used: POB translation and Greek source wording
  rationale: “Harbor” clearly conveys continuing to keep deceit within oneself.
