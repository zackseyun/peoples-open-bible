  yaml_path: translation/ot/exodus/036/015.yaml
  text: The length of each curtain was thirty cubits, and four cubits was the width of each curtain; the eleven curtains had one measure.
translation:
  language: ko
  text: 각 휘장의 길이는 서른 규빗이었고, 각 휘장의 너비는 네 규빗이었습니다. 열한 장의 휘장은 한 치수였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 각 휘장의 길이와 너비를 단수형으로 반복해, 하나하나가 동일한 규격임을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: אֹרֶךְ / הָאַחַת / הָאֶחָת
  english_pob_choice: The length of each curtain
  chosen_korean: 각 휘장의 길이
  alternatives_korean:
  - 휘장 하나의 길이
  - 각 휘장의 길이
  lexicon: 길이
  rationale: 히브리어의 단수 분배 표현을 자연스러운 한국어로 옮겨, 각 휘장마다 동일한 치수를 말하는 뜻을 분명히 했습니다.
- source_word: בָּאַמָּה / אַרְבַּע אַמּוֹת
  english_pob_choice: thirty cubits / four cubits
  chosen_korean: 서른 규빗 / 네 규빗
  alternatives_korean:
  - 삼십 규빗 / 네 규빗
  - 서른 자 / 네 자
  lexicon: 규빗
  rationale: 원문의 고대 길이 단위를 그대로 살리면서, 한국어에서는 수사를 합쇼체 문맥에 맞게 자연스럽게 풀어 썼습니다.
- source_word: מִדָּה אַחַת
  english_pob_choice: had one measure
  chosen_korean: 한 치수였습니다
  alternatives_korean:
  - 같은 치수였습니다
  - 한 측량이었습니다
  lexicon: 치수
  rationale: 문맥상 단순한 ‘측정 행위’보다 동일한 규격을 뜻하므로, POB의 ‘one measure’를 한국어로 간결하게 옮겼습니다.
- source_word: לְעַשְׁתֵּי עֶשְׂרֵ֖ה יְרִיעֹֽת
  english_pob_choice: the eleven curtains
  chosen_korean: 열한 장의 휘장
  alternatives_korean:
  - 열한 휘장
  - 열한 장의 천
  lexicon: 휘장
  rationale: 출애굽기 성막 문맥의 בדי/יריעות는 일반 ‘천’보다 ‘휘장’이 더 정확하며, 장수 표시는 ‘장’을 붙여 한국어 어법에 맞췄습니다.
theological_decisions:
- issue: 치수의 동일성 강조
  chosen_reading: 열한 장의 휘장은 한 치수였습니다
  alternative_readings:
  - 열한 장의 휘장은 모두 같은 치수였습니다
  - 모든 휘장은 동일한 크기였습니다
  rationale: 원문의 짧은 선언형 구조와 POB의 one measure를 보존해, 성막 재료가 규정된 질서에 따라 정밀하게 준비되었음을 드러냈습니다.
  doctrine_reference: 출 36:1-38 문맥의 성막 제작 규정
