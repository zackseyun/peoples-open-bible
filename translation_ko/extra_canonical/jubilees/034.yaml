  text: '1[4]. And in the sixth year of this week of years, of this forty-fourth jubilee, Jacob sent his sons to pasture their sheep, and his servants also with them, in the pastures of Shechem.

    2. And the seven kings of the Amorites gathered themselves against them, to kill them, hiding themselves

    3. under the trees, and to seize their cattle. But Jacob, and Levi, and Judah, and Joseph were in the house with Isaac their father, because his spirit was sorrowful and they could not leave him.

    4. And Benjamin was the youngest, and for this reason he remained with his father. And there came the kings of Taphu, and the kings of Ares[8], and the kings of Seragan, and the kings of Selo, and the kings of Gaas, and the king of Bethoron, and the king of Maanisakir, and all those who dwell on this mountain, and those who dwell in

    5. the land of Ham, in the land of Canaan. And they told Jacob, saying, “Behold, the kings of the Amorites

    6. have surrounded your sons, and their flocks have been taken.” And he rose up from his house, he and his three sons, and all his father’s servants, and he went against them with

    7. six thousand men who carried weapons. And he killed them in the pasture of Shechem, and pursued those who fled, and killed them with the edge of the sword, and he killed Ares and Taphu and Seragan,

    8. and Selo and Amanisakir and Gagaas. And he recovered his flocks, and prevailed over them, and imposed tribute on them, so that they gave him tribute, a fifth of the produce of their land. And he built

    9. Robel and Tamnatares. And he returned in peace and made peace with them, and they became

    10. his servants until the day when he and his sons went down into Egypt. And in the seventh year of this week he sent Joseph from his house to learn of the welfare of his brothers in the land of

    11. Shechem, and he found them in the land of Dothan. And they dealt treacherously with him and formed a plan against him to kill him; but changing their minds, they sold him to Ishmaelite merchants, and they brought him down to Egypt and sold him to Potiphar, an officer of Pharaoh, the chief of the cooks, priest of the city of Heliopolis.

    12. And the sons of Jacob slaughtered a kid of the goats and stained Joseph’s garment with the blood, and sent it to Jacob their father on the tenth of the seventh month.

    13. And he mourned all that night, because at evening they had brought it to him, and he became fevered with grief for his death, and said, “A wild beast has devoured Joseph.” And all the people of his house mourned with him on that day, and they were grieving and mourning with him all that day.

    14. And his sons and his daughters rose up to comfort him, but he would not be comforted for his son.

    15. And on that day Bilhah heard that Joseph had perished, and while she was mourning for him she died in Qafratef, and Dinah his daughter also died after Joseph had perished.

    16. And these three mournings came upon Israel in one month. And they buried Bilhah opposite Rachel’s tomb, and they buried Dinah his daughter there.

    17. And he mourned for Joseph one year, and did not cease, for he said, “I will go down to the grave mourning for my son.”

    18. Therefore it was ordained for the sons of Israel that they should afflict themselves on the tenth of the seventh month, on the day when the news that Joseph had died reached Jacob his father, and that they should make atonement for themselves on it with a young goat on the tenth of the seventh month, once each year, because of their sins; for they had grieved the compassion of their father concerning Joseph his son.

    19. And this day was ordained so that they should grieve on it for their sins, and for all their transgressions, and for all their errors, so as to cleanse themselves on this day once each year.

    20. And after Joseph was taken away, the sons of Jacob took wives. The name of Reuben’s wife was Ada, and the name of Simeon’s wife was Adiba, a Canaanite; and the name of Levi’s wife was Melka, from the daughters of Aram, from the seed of the sons of Terah; and the name of Judah’s wife was Bethasu’el, a Canaanite; and the name of Issachar’s wife was Hezaqa; and the name of Zebulun’s wife was Ni’aman; and the name of Dan’s wife was Egla; and the name of Naphtali’s wife was Rasu’a, from Mesopotamia; and the name of Gad’s wife was Maka; and the name of Asher’s wife was Ijona; and the name of Joseph’s wife was Asenath, the Egyptian; and the name of Benjamin’s wife was Iyasaka.

    21. And Simeon repented and took a second wife from Mesopotamia[21][18][15][11], like his brothers.'
  footnotes:
  - marker: '4'
    text: The sequence of place and royal names in vv. 4-8 is difficult in the Ethiopic tradition; the names are transliterated conservatively rather than normalized.
    reason: segmentation_note
  - marker: '8'
    text: The two built places are textually uncertain in form; 'Robel' and 'Tamnatares' are provisional transliterations from the Ethiopic.
    reason: textual_variant
  - marker: '11'
    text: The title rendered 'chief of the cooks' is difficult and has been rendered differently by interpreters. The translation follows the immediate Ethiopic sense rather than the more familiar Genesis wording.
    reason: lexical_alternative
  - marker: '15'
    text: The place name 'Qafratef' is uncertain in vocalization and may reflect a corrupted toponym in the Ethiopic transmission.
    reason: textual_variant
  - marker: '18'
    text: The chapter links the annual self-affliction on the tenth of the seventh month with Joseph's bloodied garment and Jacob's mourning, functioning as an etiology for the observance.
    reason: cross_reference
  - marker: '21'
    text: The verb for Simeon may mean 'repented,' 'changed his mind,' or more generally 'turned'; the sense is that he took another wife from Mesopotamia like his brothers.
    reason: alternative_reading
translation:
  language: ko
  text: '1. 그리고 이 마흔넷째 희년에 속한 이 주간의 여섯째 해에, 야곱은 아들들을 보내어 그들의 양떼를 치게 하고, 그들의 종들도 그들과 함께 세겜의 목초지로 보냈습니다.

    2. 그리고 아모리 사람의 일곱 왕이 그들에게 대항하여 모여, 그들을 몰래 죽이려고 하였습니다.

    3. 나무들 아래에서 그들의 가축을 빼앗으려 하였습니다. 그러나 야곱과 레위와 유다와 요셉은 아버지 이삭과 함께 집에 있었는데, 이삭의 영이 괴로웠고 그들이 이삭을 떠날 수 없었기 때문입니다.

    4. 베냐민은 막내였고, 그 때문에 아버지와 함께 있었습니다. 타푸의 왕들, 아레스의 왕들, 세라간의 왕들, 셀로의 왕들, 가아스의 왕들, 벧호론의 왕, 마아니사케르의 왕, 그리고 이 산에 사는 모든 이들과, …에 사는 이들이 왔습니다.

    5. 그들은 가나안 땅에서 왔습니다. 그리고 그들은 야곱에게 이렇게 말했습니다. 「보십시오, 아모리 사람들의 왕들이…」

    6. “너희 아들들을 포위하였고, 그들의 가축은 빼앗겼습니다.” 그러자 그는 자기와 그의 세 아들, 그의 아버지의 모든 종들, 그리고 그의 집의 종들과 함께 집에서 일어나, 육천 명과 함께 그들을 치러 나아갔습니다.

    7. 그는 무기를 든 육천 명을 죽였습니다. 또 세겜의 내리막에서 그들을 죽이고, 달아난 자들을 추격하여 칼날로 죽였으며, 아레스와 타푸와 세라간도 죽였습니다.

    8. 세로와 아마니스케르와 가가아스, 그리고 그는 자기 소유물을 되찾고 그들을 물리쳐 그들에게 공물을 부과하였습니다. 그리하여 그들은 그에게 자기네 땅의 소산 가운데 오분의 일을 공물로 바쳤습니다. 그리고 그는 세웠습니다.

    9. 로벨과 탐나타레스였습니다. 그리고 그는 평안히 돌아와 그들과 화평을 맺었고, 그들은 그에게 속하게 되었습니다.

    10. 그의 종들… 그와 그의 아들들이 이집트로 내려간 날까지. 그리고 이 주간의 일곱째 해에 그는 자기 집에서 요셉을 보내어 형제들의 안부를 알아보게 하였습니다. 그 땅의…

    11. 그는 세겜으로 갔으나 도단 땅에서 그들을 찾았습니다. 그들은 그에게 배신을 꾀하고 그를 죽이려는 계획을 세웠습니다. 그러나 마음을 바꾸어 그를 이스마엘 사람 상인들에게 팔았고, 그를 이집트로 데려가 파라오의 관리이며 경호대장이고 헬리오폴리스 성읍의 제사장인 포티파르에게 팔았습니다.

    12. 야곱의 아들들이 염소 새끼를 잡아 요셉의 옷을 피에 담갔다가, 일곱째 달 십일에 그 옷을 그들의 아버지 야곱에게 보냈습니다.

    13. 저녁에 그들이 그것을 그에게 가져왔기 때문에, 그는 밤새도록 슬퍼했습니다. 그는 그 죽음으로 말미암아 슬픔에 사무쳐 열병이 났으며, “야수가 요셉을 잡아먹었습니다”라고 말했습니다. 그날 그의 집안 모든 사람이 그와 함께 애통해했고, 그날 종일 그와 함께 슬퍼하며 애통해했습니다.

    14. 그의 아들들과 딸들이 일어나 그를 위로하려 하였으나, 그는 자기 아들 때문에 위로받으려 하지 않았습니다.

    15. 그 날 빌하는 요셉이 죽었다는 소식을 듣고 그를 위하여 애곡하던 중 카프라테프에서 죽었습니다. 요셉이 죽은 뒤에는 야곱의 딸 디나도 죽었습니다.

    16. 그리고 이 세 차례의 애통이 한 달 안에 이스라엘에게 닥쳤습니다. 그들은 빌하를 라헬의 무덤 맞은편에 장사했고, 그의 딸 디나도 거기에 장사했습니다.

    17. 그는 요셉을 위하여 한 해 동안 슬퍼하며 그치지 않았습니다. 그는 “내 아들을 위하여 슬퍼하며 무덤으로 내려가겠습니다” 하고 말했습니다.

    18. 그러므로 이스라엘 자손에게는 일곱째 달 열흘째 날, 곧 요셉에 관한 소식이 그의 아버지 야곱에게 전해진 그 날에 스스로를 괴롭게 하고, 해마다 한 번 그 날에 어린 염소로 자기들의 죄를 위하여 자신들을 속죄하도록 정해졌습니다. 이는 그들이 아들 요셉을 향해 그들의 아버지가 품은 애정을 슬프게 했기 때문입니다.

    19. 그들의 죄는 그의 아들 요셉 때문에 아버지의 긍휼한 마음을 슬프게 한 것이었습니다. 그리고 이 날은 그들이 이 날에 자기들의 죄와 모든 범법과 모든 잘못 때문에 슬퍼하고, 해마다 한 번 이 날에 스스로를 정결하게 하도록 정해졌습니다.

    20. 요셉이 사라진 뒤에 야곱의 아들들이 아내를 맞이했습니다. 르우벤의 아내의 이름은 아다였고, 시므온의 아내의 이름은 가나안 여인 아디바였으며, 레위의 아내의 이름은 아람의 딸들 가운데 한 사람이며 데라의 아들들의 후손인 멜카였습니다. 유다의 아내의 이름은 가나안 여인 베타수엘이었고, 잇사갈의 아내의 이름은 헤자카였으며, 스불론의 아내의 이름은 니아만이었습니다. 단의 아내의 이름은 에글라였고, 납달리의 아내의 이름은 메소포타미아 출신 라수아였으며, 갓의 아내의 이름은 마카였습니다. 아셀의 아내의 이름은 이요나였고, 요셉의 아내의 이름은 이집트 여인 아세낫이었으며, 베냐민의 아내의 이름은 이야사카였습니다.

    21. 베냐민의 아내는 이야사카였습니다. 시므온은 후회하여 그의 형제들처럼 메소포타미아에서 온 둘째 아내를 맞았습니다.'
