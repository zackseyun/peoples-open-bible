id: PSA.107.15
reference: Psalms 107:15
source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
translation:
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds for human beings.
  philosophy: dynamic
lexical_decisions:
- source_word: יוֹדוּ
  chosen: Let them give thanks
  alternatives:
  - let them praise
  - let them confess/acknowledge
  lexicon: HALOT
  rationale: The Hiphil jussive/plural of ידה in this refrain calls for an exhortational sense. In this psalmic context, 'give thanks' best fits the recurring formula and natural English, while preserving the imperative/jussive force with 'Let them'.
- source_word: לַיהוָה
  chosen: to Yahweh
  alternatives:
  - to Yahweh
  lexicon: HALOT
  rationale: The lexical record should conform to the main-text rendering and the stated divine-name policy.
- source_word: חסדו
  chosen: his steadfast love
  alternatives:
  - his lovingkindness
  - his covenant love
  - his mercy
  lexicon: HALOT
  rationale: חסד denotes loyal, covenantal love and kindness. 'Steadfast love' is the most established concise English rendering that preserves both affection and constancy better than the broader 'mercy'.
- source_word: ונפלאותיו
  chosen: and for his wondrous deeds
  alternatives:
  - and his wonders
  - and for his wonderful works
  - and his marvelous acts
  lexicon: HALOT
  rationale: The conjunction joins a second object of thanksgiving parallel to חסדו. From פלא, the noun refers to extraordinary acts. 'Wondrous deeds' is idiomatic and preserves the active sense of divine acts better than the more static 'wonders'.
- source_word: לבני אדם
  chosen: for human beings
  alternatives:
  - to the sons of men
  - to humankind
  - for the children of man
  lexicon: HALOT
  rationale: The idiom denotes people collectively. This is idiomatic English and preserves its beneficiary-oriented force.
