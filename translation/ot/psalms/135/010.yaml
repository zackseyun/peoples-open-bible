id: PSA.135.10
reference: Psalms 135:10
source:
  edition: WLC
  text: שֶֽׁ֭/הִכָּה גּוֹיִ֣ם רַבִּ֑ים וְ֝/הָרַ֗ג מְלָכִ֥ים עֲצוּמִֽים׃
translation:
  text: 'He defeated many nations and killed mighty kings:'
  philosophy: dynamic
lexical_decisions:
- source_word: שֶׁ/הִכָּה
  lemma: שֶׁ
  chosen: who struck
  alternatives:
  - who struck
  - who smote
  lexicon: HALOT
  rationale: The relative particle is represented by “who,” and bare “struck” renders the verb without adding a result nuance.
- source_word: גּוֹיִם
  chosen: nations
  alternatives:
  - peoples
  - Gentiles
  lexicon: HALOT
  rationale: גּוֹיִם is the standard term for nations/peoples. In this military-historical context, 'nations' is the most natural and conventional rendering; 'Gentiles' would import later Jewish/Christian connotations not required here.
- source_word: רַבִּים
  chosen: many
  alternatives:
  - great many
  - numerous
  lexicon: HALOT
  rationale: The adjective straightforwardly quantifies גּוֹיִם. 'Many' is the plain, idiomatic equivalent.
- source_word: וְ/הָרַג
  chosen: and killed
  alternatives:
  - and slew
  - and put to death
  lexicon: HALOT
  rationale: הרג means 'kill, slay.' 'Killed' is clear modern English; 'slew' is accurate but archaic, and 'put to death' is too formal for the poetic parallelism.
- source_word: מְלָכִים
  chosen: kings
  lexicon: HALOT
  rationale: The English form varies only as context requires for number, possession, construct state, and syntax; the referent remains a king throughout.
- source_word: עֲצוּמִים
  chosen: mighty
  alternatives:
  - powerful
  - strong
  lexicon: HALOT
  rationale: עָצוּם denotes strength, might, or power. 'Mighty' fits the elevated poetic register and pairs well with 'kings' in English.
