  to: Deliver me from my enemies, O Yahweh; to you I flee for shelter[a].
  rationale: 'The prior “to you I have hidden myself” is formally close but unnatural and misleading English: the difficult form need not be represented as a reflexive hiding action. The ancient versions and lexical uncertainty support caution, while the directional אֵלֶיךָ should remain visible. “To you I flee for shelter” communicates the likely protective movement without changing “to” into “in”; the note preserves the literal covering/hiding possibility and the common refuge interpretation. The perfect is rendered as a present-state prayer idiom rather than with a wooden English perfect.'
