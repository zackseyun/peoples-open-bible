  from: And the chamber whose front faces north is for the priests who keep charge of the altar. They are the sons of Zadok[a], who from among the sons of Levi come near to Yahweh to minister to him.
  to: The chamber facing north is for the priests who have charge of the altar. They are the descendants of Zadok, those among Levi's descendants who draw near to Yahweh to minister to him.”
  rationale: The earlier decisions rightly distinguish Zadok's line within Levi's larger lineage and retain 'Yahweh' and priestly 'minister.' I translate the family idiom as 'descendants' without adding 'only' or an explicit grant of permission.
