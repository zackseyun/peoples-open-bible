  yaml_path: translation/ot/psalms/056/002.yaml
  text: My enemies pursue me all day long, for many fight against me proudly[a].
  footnotes:
  - marker: a
    text: Or “for many fight against me, O Most High.” The final Hebrew word may also be understood as describing the attackers’ exalted or arrogant stance.
