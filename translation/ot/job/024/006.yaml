id: JOB.24.6
reference: Job 24:6
source:
  edition: WLC
  text: בַּ֭/שָּׂדֶה בְּלִיל֣/וֹ יקצירו וְ/כֶ֖רֶם רָשָׁ֣ע יְלַקֵּֽשׁוּ׃
translation:
  text: They harvest a wicked man’s fodder in the field and glean his vineyard.
  philosophy: dynamic
lexical_decisions:
- source_word: בַּשָּׂדֶה
  chosen: In the field
  alternatives:
  - In a field
  - Out in the field
  lexicon: HALOT
  rationale: The preposition ב plus שָׂדֶה is locative. English idiom favors 'in the field.' The definite article in Hebrew can be rendered naturally without overemphasis in English.
- source_word: בְּלִילוֹ
  chosen: his fodder
  alternatives:
  - provender
  - mixed fodder
  - his fodder
  lexicon: HALOT
  rationale: The word denotes fodder and bears a third-person masculine singular suffix, which should be represented in translation.
- source_word: יקצירו
  chosen: they harvest
  alternatives:
  - they reap
  lexicon: HALOT
  rationale: From קצר 'to reap/harvest.' 'Harvest' is slightly more natural in contemporary English while preserving the agricultural sense.
- source_word: וְכֶרֶם
  chosen: and ... the vineyard
  alternatives:
  - and the vineyard
  - and in the vineyard
  lexicon: HALOT
  rationale: The conjunction links a second clause. English supplies 'in' idiomatically with 'glean' even though no preposition is explicit in Hebrew, because the verb naturally takes the location as its object in context.
- source_word: רָשָׁע
  chosen: the wicked
  alternatives:
  - a wicked man
  - the wicked man
  lexicon: HALOT
  rationale: The singular adjective functions substantivally. 'The wicked' preserves the generic/class sense and avoids over-specifying an individual male owner, though the context may imply a wicked landowner.
- source_word: יְלַקֵּשׁוּ
  chosen: they glean
  alternatives:
  - they gather late produce
  - they pick over
  lexicon: HALOT
  rationale: Piel of לקשׁ refers to gathering gleanings or late-picked produce. 'Glean' is the most concise and contextually fitting rendering, especially in parallel with harvesting.
