revisions:
- from: 아침이 되어 보니, 보아라, 그것은 레아였습니다. 그리고 그는 라반에게 말했습니다. “이게 당신이 내게 한 일이 무엇입니까? 내가 라헬 때문에 당신과 함께 일하지 않았습니까? 그런데 어째서 당신은 나를 속였습니까?”
  to: 아침이 되자, 보니 레아였습니다. 그러자 그는 라반에게 말했습니다. “당신이 제게 무슨 일을 한 것입니까? 내가 라헬을 위해 당신을 위해 일한 것이 아닙니까? 그런데 어째서 저를 속였습니까?”
  rationale: 원문의 갑작스러운 인식(‘보니 레아였습니다’)과 야곱의 항의하는 반문을 보존하면서, 사람을 사물로 지칭하는 표현과 어색한 질문 어순을 바로잡았습니다. 라반 아래에서 한 야곱의 노동이라는 문맥적 의미를 ‘당신을 위해 일한’으로 명료하게 옮겼습니다.
