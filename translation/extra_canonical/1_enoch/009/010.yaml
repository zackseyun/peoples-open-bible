translation:
  text: And now, behold, the souls of those who have died cry out and plead up to
    the gate of heaven. Their lament has risen and cannot die away in the face of
    the injustice being done on the earth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The closing expression is more literally, “it cannot go out from before
      the face of the injustice being done on the earth.” The wording is difficult;
      “cannot die away” takes “it” to refer to the lament.
    reason: alternative_reading
lexical_decisions:
- source_word: ነፍሰ፡ እለ፡ ሞቱ
  chosen: the souls of those who have died
  alternatives:
  - the lives of those who died
  rationale: Preserves the witness’s reference to the dead without specifying their
    condition beyond what the verse says.
- source_word: ወይስእዩ፡ እስከ፡ አንቀጸ፡ ሰማይ
  chosen: and plead up to the gate of heaven
  alternatives:
  - and petition at the gate of heaven
  rationale: Keeps the act of appeal and the singular gate, while retaining the directional
    force of እስከ.
- source_word: ወዓርገ፡ ገዓሮሙ
  chosen: Their lament has risen
  alternatives:
  - their outcry has ascended
  rationale: Preserves the upward movement of the mournful cry without repeating “cry
    out” in the same sentence.
- source_word: ወኢይክል፡ ወጺአ፡ እምቅድመ፡ ገጸ
  chosen: and cannot die away in the face of
  alternatives:
  - and cannot depart from before the face of
  rationale: Takes the continuing lament as the subject. “Die away” conveys a cry’s
    failure to depart or cease; the less idiomatic literal construction is noted below.
- source_word: ዓመፃ፡ ዘይትገበር፡ በዲበ፡ ምድር
  chosen: the injustice being done on the earth
  alternatives:
  - the wrongdoing being committed on the earth
  - the violence being done on the earth
  rationale: “Injustice” suits the appeal of the dead while leaving the wrongdoing’s
    precise form open.
theological_decisions:
- issue: The dead pleading at heaven’s gate
  chosen_reading: The souls of the dead cry out and plead toward heaven.
  alternative_readings:
  - A fully specified doctrine of the dead’s location or intermediate state
  rationale: The verse presents an apocalyptic appeal but does not define a broader
    doctrine of the afterlife.
