theological_decisions:
- issue: 하나님께 მიმართ하는 ברך의 번역
  chosen_reading: 본문에는 '송축하겠습니다'를 두고, '찬양하다'는 해석적 대안으로 각주에 두었습니다.
  alternative_readings:
  - 주님을 찬양하겠습니다
  - 주님을 축복하겠습니다
  rationale: 히브리어 동사는 분명 ברך이며, 하나님께 대해 '복을 빌다/송축하다'는 예배 언어의 긴장을 보존하는 편이 원문에 더 가깝습니다. 한국어 독자의 자연성을 위해 본문은 '송축하다'로 옮겼습니다.
  doctrine_reference: 번역 원칙 §1, §5
