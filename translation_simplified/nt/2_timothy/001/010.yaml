  confidence: high
- pob_phrase: through the appearing ... who indeed abolished death and brought
  rendering: Through his appearing, he abolished death and brought
  claim: Christ’s appearing is explicitly retained as the setting and means by which his victory and disclosure became manifest.
  evidence:
  - The POB links grace’s revelation through Christ’s appearing directly to the actions described by the following participles.
  confidence: moderate
  alternatives_preserved:
  - Christ’s appearing may be understood primarily as the historical setting of these actions.
