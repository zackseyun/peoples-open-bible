translation:
  language: en
  text: and have fallen away,[a] to bring them back again to repentance[c],[b] because they are crucifying the Son of God again for themselves and publicly shaming him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “have committed apostasy”; the word describes a serious falling away.
    reason: lexical_alternative
  - marker: b
