  rationale: This is a lexical/cultic decision rather than a doctrinal dispute, but it affects how readers understand sacrificial language. 'Food offering' communicates the priestly sacrificial category in accessible English while preserving the cultic sense; the traditional alternative is retained in a footnote for auditability.
