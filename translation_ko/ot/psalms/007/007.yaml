  - ‘행동하소서’로 의역
  rationale: 시편의 수사학은 하나님의 즉각적 개입을 청하는 생생한 기도 언어이므로, 완화된 추상어로 바꾸지 않고 원문의 인격적·시적 긴장감을 살렸습니다.
