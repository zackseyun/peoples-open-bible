id: PSA.91.9
reference: Psalms 91:9
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה יְהוָ֣ה מַחְסִ֑/י עֶ֝לְי֗וֹן שַׂ֣מְתָּ מְעוֹנֶֽ/ךָ־׃
translation:
  text: For you have made Yahweh—my refuge, the Most High—your dwelling place[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, with an abrupt change of addressee, 'For you, Yahweh, are my refuge! You have made the Most High your dwelling place.' The second 'you' then addresses the worshiper.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - For
  - Because
  lexicon: HALOT
  rationale: Introduces the ground for the protection that follows. 'For' preserves the explanatory relation without requiring an unexpressed speech verb.
- source_word: אַתָּה
  chosen: you
  lexicon: HALOT
  rationale: The second-person pronoun addresses the protected person in the main construal. The Masoretic accentuation can instead produce an abrupt address to Yahweh; that reading remains explicit in the note.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: מַחְסִי
  chosen: my refuge
  alternatives:
  - my shelter
  lexicon: HALOT
  rationale: מַחְסֶה denotes a place of refuge or shelter. 'Refuge' is the more established and precise term in Psalmic protection language.
- source_word: עֶלְיוֹן
  chosen: the Most High
  alternatives:
  - Most High
  lexicon: HALOT
  rationale: A divine title meaning 'Most High.' The article in English makes the title read naturally and clearly as a designation for God.
- source_word: שַׂמְתָּ
  chosen: you have made
  alternatives:
  - you have set
  - you have placed
  lexicon: HALOT
  rationale: Qal perfect 2ms of שׂים, here meaning to make or set something as something. 'You have made' is idiomatic with the complement 'your dwelling place.'
- source_word: מְעוֹנֶךָ
  chosen: your dwelling place
  alternatives:
  - your habitation
  - your refuge
  lexicon: HALOT
  rationale: מָעוֹן refers to a dwelling or habitation. 'Dwelling place' is clear modern English and distinguishes it from מַחְסֶה ('refuge') earlier in the verse.
