  rationale: Per project philosophy for Sirach, the surviving Hebrew is primary where extant. Here the Hebrew warns against association with musical/entertaining women and being 'burned by their mouths,' while the Greek presents a more explicit moralizing equivalent about prostitutes and loss of inheritance. The main text follows the Hebrew wording; the Greek alternative is preserved in a footnote because it materially affects interpretation.
