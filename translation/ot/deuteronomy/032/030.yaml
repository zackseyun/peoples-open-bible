  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Capitalization of צוּר as a divine title
  chosen_reading: their Rock
  alternative_readings:
  - their rock
  rationale: Within the Song of Moses, 'Rock' is repeatedly used as a title/metaphor for Israel's God in contrast with false 'rocks' (cf. nearby context). Capitalization helps English readers perceive the titular force while preserving the metaphorical language.
