  - severity: medium
    issue: 고유명사 ‘엣난’의 음역
    rationale: אֶתְנָן(Ethnan)은 한국어 성서 고유명사 표기 관례에 따라 ‘에드난’으로 옮기는 것이 더 안정적입니다.
  - severity: low
