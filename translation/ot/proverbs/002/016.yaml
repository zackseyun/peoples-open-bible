  to: to rescue you from the forbidden woman[a], from the foreign woman[b] whose words are smooth.
  rationale: “Strange woman” is materially misleading in contemporary English, and “forbidden woman” reasonably conveys the contextual force of זרה. But replacing נכריה with “outsider” removes the source’s foreignness image and resolves an ambiguity that should remain visible. “Foreign woman,” with an honest contextual note, is source-near and natural. The markers must be attached to the respective expressions they explain.
