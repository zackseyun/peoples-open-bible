translation:
  language: en
  text: So, Lord, God of righteous people, you did not appoint repentance[b][a] for righteous people—Abraham, Isaac, and Jacob—who did not sin against you. But you appointed it for me—the sinner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “set repentance before.”
    reason: lexical_alternative
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Lord, God of the righteous
  simplified_phrase: Lord, God of righteous people
  preserved_meaning: God is identified as the God of those who are righteous.
  reasoning_layer_used: POB lexical decision for δικαίων
  rationale: “Righteous people” makes the group reference immediately clear.
- pob_phrase: for the righteous—for Abraham and Isaac and Jacob
  simplified_phrase: for righteous people—Abraham, Isaac, and Jacob
  preserved_meaning: The patriarchs are explicitly identified as righteous, maintaining the contrast with the sinner.
  reasoning_layer_used: Greek sequence and POB appositional rationale
  rationale: The category and names are both retained in a simpler apposition.
translation_notes:
  risk_flags:
