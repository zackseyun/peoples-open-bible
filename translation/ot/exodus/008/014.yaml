  category: meaning_retranslation
  from: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
  to: The magicians tried to do the same, using their secret arts to produce gnats[a], but they could not. The gnats infested people and livestock.
  rationale: The earlier lexical rationale recognizes both an attempt to produce the plague and collective human and animal groups, but the current wording follows the Hebrew forms too closely. The new wording makes the failure explicit while retaining “secret arts” and the insect alternative.
