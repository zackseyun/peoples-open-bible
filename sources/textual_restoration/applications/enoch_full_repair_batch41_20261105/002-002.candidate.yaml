translation:
  text: 'Look at the earth and consider the work done on it from the beginning to completion[a]: none of God’s work
    changes[b] [while appearing; subject and attachment uncertain][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: The printed completion word ends in ቱ, not the bare ት of the dictionary headword. The vowel is compatible
      with a singular suffix, “its completion”; the neutral “to completion” does not identify a possessor. No possessive
      is supplied for “the beginning.” The source retains both printed asterisks, before “look” and the phrase introducing
      the work.
  - marker: b
    reason: textual_variant
    text: 'The colon introduces the observation signaled by ከመ. The printed negative and “all” are rendered as “none,”
      a use described in Dillmann’s Grammar §197(d). The suffixes in “look at the earth” and “God’s work” are not
      duplicated in English: §172(c) describes a suffix anticipating a following noun introduced by ለ. Charles’s
      note 13 proposes that words were lost by similar endings. The body has no visible gap, and this rendering
      inserts no Greek wording or contrast.'
  - marker: c
    reason: textual_variant
    text: The two printed words are እንዘ፡ ያስተርኢ። Dillmann’s Grammar §170.5 supports the circumstantial “while,” and
      his lexicon (column 298, stem IV.1) gives the imperfect with the sense of appearing. Neither the subject nor
      the link to the rest of the sentence is certain; the bracket marks that uncertainty, not a gap. Charles’s
      note 15 proposes another connective conditional on his loss hypothesis, and note 16 compares Greek “appears”
      but questions the underlying rendering. Flemming also prints a circumstantial connector and an appearance
      form. The edited Aramaic fragments offer a comparison for the appearance sense, not a basis to import a subject
      or restore the clause.
