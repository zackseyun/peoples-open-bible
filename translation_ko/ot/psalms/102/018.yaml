  lexicon: HALOT
  rationale: בזה의 평가절하와 거절의 뉘앙스를 함께 살리기 위해, 단순한 ‘거절’보다 강한 ‘업신여기다’를 선택했습니다.
- source_word: תְּפִלָּתָם
  english_pob_choice: their prayer
  chosen_korean: 그들의 기도
  alternatives_korean:
  - 그들의 간구
  - 그들의 기도문
  lexicon: HALOT
  rationale: 히브리어의 단수 명사를 집합적으로 처리한 반복 구조를 살려, 두 번째도 ‘기도’로 반복해 대응성을 유지했습니다.
