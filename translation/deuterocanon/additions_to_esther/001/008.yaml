  category: meaning_retranslation
  from: And every righteous nation was thrown into turmoil[a], fearing their own calamities[c][b], and they prepared to perish.
  to: The whole righteous nation[a] was thrown into turmoil; its people feared the calamities facing them and braced themselves to perish.
  rationale: The earlier lexical decision favored 'every' from the anarthrous construction, but the dream’s contrast between many hostile nations and one righteous nation supports 'whole' here. Its explanations of impending calamity and destruction are retained and made clearer.
