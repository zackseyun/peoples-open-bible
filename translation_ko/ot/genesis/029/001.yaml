base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/001.yaml
  text: Then Jacob set out and went to the land of the sons of the east.
translation:
  language: ko
  text: 그때 야곱이 길을 떠나 동방 사람들의 땅으로 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא ... רַגְלָיו
  english_pob_choice: set out
  chosen_korean: 길을 떠나
  alternatives_korean:
  - 발을 들고
  - 발걸음을 옮기고
  - 출발하여
  lexicon: נשא + רגלים idiom
  rationale: 직역하면 ‘발을 들다’에 가깝지만, 이 구절에서 EN POB가 의미 중심의 ‘set out’를 채택한 점을 따라 자연스럽게 ‘길을 떠나’로 옮겼습니다. 야곱의 가벼운 발걸음/출발의 뉘앙스를 보존하면서도 한국어에서 부자연스럽지 않습니다.
- source_word: אַרְצָה
  english_pob_choice: to the land of
  chosen_korean: … 땅으로
  alternatives_korean:
  - … 땅에
  - … 땅으로 향하여
  lexicon: ארץ
  rationale: 목적지 이동을 나타내므로 ‘땅으로’가 가장 직접적입니다. 히브리어의 방향성도 유지됩니다.
- source_word: בְנֵי קֶדֶם
  english_pob_choice: the sons of the east
  chosen_korean: 동방 사람들의
  alternatives_korean:
  - 동쪽의 아들들의
  - 동방의 자손들의
  - 동쪽 사람들의
  lexicon: בני + קדם
  rationale: 히브리어 관용구를 한국어에서 그대로 살리면 어색하므로, 의미를 드러내는 ‘동방 사람들’로 옮겼습니다. ‘사람들의’는 집단/민족적 지시를 자연스럽게 전달합니다.
theological_decisions:
- issue: בְנֵי קֶדֶם의 관용구 처리
  chosen_reading: ‘동방 사람들’로 옮겨 지리적·민족적 구분을 드러냈습니다.
  alternative_readings:
  - ‘동쪽의 아들들’처럼 직역할 수 있음
  - ‘동방의 자손들’로 완화할 수 있음
  rationale: 이 표현은 문자 그대로의 혈연 표현이라기보다 동방 지역 집단을 가리키는 관용적 명칭이므로, 독자가 본문 의도를 즉시 이해하도록 의미 중심으로 처리했습니다.
  doctrine_reference: 문맥적/주해적 판단
