  - 왕 솔로몬
  lexicon: מֶלֶךְ; שלמה
  rationale: 히브리어 어순을 그대로 따르기보다 한국어 자연어 순서에 맞춰 ‘솔로몬 왕’으로 옮겼습니다.
theological_decisions:
- issue: 이 절의 동사 선택이 히람의 자발적 이동인지 강제적 이송인지
  chosen_reading: ‘데려왔습니다’로 옮겨, 왕의 주도적 소환과 이동을 드러냈습니다.
  alternative_readings:
  - ‘불러왔습니다’
  - ‘가져왔습니다’
  rationale: וַיִּקַּח은 단순한 물리적 ‘취하다’보다 여기서는 사람을 불러오거나 데려오는 왕의 행정적 조치를 가리키므로, 과도한 강제성은 피하면서도 주도성을 유지했습니다.
  doctrine_reference: 서사 문맥의 행위 주체성과 히브리어 동사 용례
