translation:
  text: Then the king said to him, “Ask for whatever you want beyond the rewards already set down in writing, and we will give it to you, since you have proved wiser than the others. You shall sit next to me and be called my kinsman[a].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Here 'kinsman' is a court honor, not a statement that the young man is a blood relative.
    reason: cultural_note
