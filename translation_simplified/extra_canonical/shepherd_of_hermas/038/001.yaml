  yaml_path: translation/extra_canonical/shepherd_of_hermas/038/001.yaml
  text: '“Listen, then,” he says, “foolish one, how sorrow wears down the Holy Spirit and then again saves. Whenever the double‑minded person undertakes some action and fails in it because of his double‑mindedness, this sorrow enters into the person and grieves the Holy Spirit and wears it down. Then again, when quick temper clings to a person concerning some matter, and he becomes exceedingly embittered, again sorrow enters into the heart of the person who became quick‑tempered, and he is grieved over the deed that he did and repents, because he did what is evil. This sorrow, then, seems to bring salvation, because after doing what is evil he repented. Therefore both things grieve the Spirit: double‑mindedness, because it did not attain its purpose; and quick temper grieves the Spirit, because it did what is evil. Both, then, are grievous to the Holy Spirit—double‑mindedness and quick temper. Remove, therefore, sorrow from yourself, and do not afflict the Holy Spirit that dwells in you,
    lest it appeal to God and depart from you. For the Spirit of God that was given to this flesh does not endure sorrow or distress.”'
translation:
  language: en
  text: '“Listen, then, foolish one,” he says, “and learn how sorrow wears down the Holy Spirit, yet can also save. When a person with a divided mind tries to do something but fails because of that divided mind, sorrow enters the person, grieves the Holy Spirit, and wears the Spirit down. Again, when someone loses his temper over some matter and becomes deeply bitter, sorrow enters his heart. He is grieved by what he has done and repents[a] because he did evil. This sorrow seems to lead to salvation, since he repented after doing evil.


    “So both a divided mind and a quick temper grieve the Spirit. A divided mind grieves the Spirit because it fails to achieve its purpose; a quick temper grieves the Spirit because it does evil. Both are grievous to the Holy Spirit. Therefore, remove sorrow from yourself. Do not afflict the Holy Spirit who lives in you, or the Spirit may appeal to God and leave you. For the Spirit of God, who was given to dwell in this human body, cannot endure sorrow or distress.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
