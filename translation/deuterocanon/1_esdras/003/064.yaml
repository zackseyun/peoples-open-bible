  text: καὶ οὐκ ἔστιν ἐν τῇ κρίσει αὐτῆς οὐθὲν ἄδικον. καὶ αὕτη ἡ ἰσχὺς καὶ τὸ βασίλειον καὶ ἡ ἐξουσία καὶ ἡ μεγαλειότης τῶν πάντων αἰώνων· εὐλογητὸς ὁ θεὸς τῆς ἀληθείας.
