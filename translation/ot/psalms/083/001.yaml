id: PSA.83.1
reference: Psalms 83:1
source:
  edition: WLC
  text: אֱלֹהִ֥ים אַל דֳּמִי לָ֑/ךְ אַל תֶּחֱרַ֖שׁ וְ/אַל תִּשְׁקֹ֣ט אֵֽל־־־־׃
translation:
  text: O God, do not be silent; do not be quiet, and do not be still, O God.
  philosophy: dynamic
lexical_decisions:
- source_word: אֱלֹהִים
  chosen: O God
  alternatives:
  - God
  lexicon: HALOT
  rationale: Vocative use in direct address within a prayer. Rendering with 'O God' reflects the Hebrew address naturally in English poetic style.
- source_word: אַל
  chosen: do not
  alternatives:
  - let not
  lexicon: HALOT
  rationale: Negative jussive particle introducing a plea/request. 'Do not' is clear modern English and preserves the force of the petition.
- source_word: דֳּמִי לָךְ
  chosen: do not be silent
  alternatives:
  - be still
  - rest
  - be quiet
  lexicon: HALOT
  rationale: This renders the opening appeal directly without adding a required continuative sense.
- source_word: תֶּחֱרַשׁ
  chosen: do not be quiet
  alternatives:
  - be silent
  - keep silent
  lexicon: HALOT
  rationale: In this parallel sequence, the verb denotes silence or quietness, not deafness.
- source_word: וְאַל תִּשְׁקֹט
  chosen: and do not be still
  alternatives:
  - and do not be quiet
  - and do not rest
  - and do not be at ease
  lexicon: HALOT
  rationale: This preserves the final appeal against divine quietness or inactivity.
- source_word: אֵל
  chosen: O God
  alternatives:
  - O Mighty One
  - God
  lexicon: HALOT
  rationale: A second divine title closing the verse. Rendering again as 'O God' keeps the parallel address natural in English; 'Mighty One' is possible but less idiomatic here and may over-specify the nuance.
