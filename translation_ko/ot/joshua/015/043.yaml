  lexicon: HALOT
  rationale: 고유 지명으로서 영어 POB의 Nezib를 따르되, 히브리어 자음값에 맞춘 간결한 음역으로 처리했습니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
