  chosen_reading: Translate the verse in ordinary narrative terms without importing a christological or trinitarian interpretation.
  alternative_readings:
  - Render attendance language more exaltedly to suggest divine status of the visitors
  rationale: The verse itself narrates Abraham's hospitality. Historic orthodoxy is preserved without loading the translation with theological conclusions not explicit in the Hebrew.
