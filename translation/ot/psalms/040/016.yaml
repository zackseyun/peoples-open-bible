  to: Let all who seek you rejoice and be glad in you; let those who love your salvation[a] say continually, “May Yahweh be magnified!”
  rationale: The proposed declarative “Yahweh is great!” changes a jussive acclamation into an assertion. “May Yahweh be magnified” is natural liturgical English for the wish that Yahweh’s greatness be publicly exalted; it does not entail that he becomes intrinsically greater. The useful deliverance alternative belongs after “salvation”; no note is needed for the adequately rendered acclamation.
