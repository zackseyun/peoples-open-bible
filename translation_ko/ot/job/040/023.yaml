  text: הֵ֤ן יַעֲשֹׁ֣ק נָ֭הָר לֹ֣א יַחְפּ֑וֹז יִבְטַ֓ח כִּֽי יָגִ֖יחַ יַרְדֵּ֣ן אֶל פִּֽי/הוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/023.yaml
  text: Look, if a river rages, he is not alarmed; he is confident even if the Jordan surges against his mouth.
translation:
  language: ko
  text: 보십시오[a], 강물이 세차게 밀려와도 그는 당황하지 않습니다. 요단 강물이 그의 입에 밀려들어도 그는 태연합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 히브리어 감탄사 הֵן의 주의 환기 기능을 살린 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: הֵ֤ן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 자
  lexicon: הֵן
  rationale: 청자의 주의를 끄는 감탄·호출 표현으로, 현대 합쇼체에서 자연스럽고 직접적인 ‘보십시오’가 source의 경고적 도입을 잘 살립니다.
- source_word: יַעֲשֹׁ֣ק נָ֭הָר
  english_pob_choice: a river rages
  chosen_korean: 강이 거세게 밀려와도
  alternatives_korean:
  - 강이 요동해도
  - 강물이 사납게 덮쳐도
  - 강이 거세어도
  lexicon: עָשַׁק / נָהָר
  rationale: POB의 ‘rages’를 따라 물의 격렬한 움직임을 살리되, 한국어에서는 ‘밀려오다’가 강의 압도적 세력을 가장 자연스럽게 드러냅니다.
- source_word: לֹ֣א יַחְפּ֑וֹז
  english_pob_choice: he is not alarmed
  chosen_korean: 그는 당황하지 않습니다
  alternatives_korean:
  - 그는 놀라지 않습니다
  - 그는 동요하지 않습니다
  - 그는 급히 피하지 않습니다
  lexicon: חָפַז
  rationale: 동사의 핵심은 급박함/당황의 부재이므로, 감정과 반응을 함께 담는 ‘당황하지 않습니다’가 문맥상 가장 정확합니다.
- source_word: יָגִ֖יחַ יַרְדֵּ֣ן אֶל פִּֽי/הוּ
  english_pob_choice: the Jordan surges against his mouth
  chosen_korean: 요단이 그의 입가로 들이닥쳐도
  alternatives_korean:
  - 요단이 그의 입으로 넘쳐 들어와도
  - 요단이 그의 입에 들이쳐도
  - 요단이 그의 입가에 거세게 밀려와도
  lexicon: נָגַח / יַרְדֵּן
  rationale: ‘surges’의 급격한 돌진성을 유지하면서, ‘입’은 직역보다 한국어에서 자연스러운 ‘입가로’로 옮겨 위협이 닿는 지점을 선명하게 했습니다.
theological_decisions:
- issue: 비유적 과장으로서의 자연 재난 이미지
  chosen_reading: 이 절은 실제 강이 아니라, 압도적 위협 앞에서도 두려워하지 않는 자의 확신을 과장법으로 묘사합니다.
  alternative_readings:
  - 단순한 자연 관찰
  - 개인적 용기의 일반 진술
  rationale: 문맥상 리워야단 묘사의 일부로, 자연 현상의 서술을 넘어 압도적 위협에 대한 무감각·자신감을 강조합니다.
  doctrine_reference: 욥기 40장 문맥
