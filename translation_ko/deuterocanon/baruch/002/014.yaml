  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἕνεκεν σοῦ는 강조된 재귀 표현인 '당신 자신'보다 '주님을 위하여'가 더 직접적이며 자연스럽습니다. 또한 κατὰ πρόσωπον 이하의 χάρις는 포로로 끌려간 이들이 그 사람들 앞에서 호의를 얻도록 해 달라는 청원이므로, 그 관계를 한국어에 더 분명히 드러내는 것이 좋습니다.
  naturalness: 현 문안의 '그리고'와 '당신 자신을 위하여'는 기도문으로 다소 부자연스럽고, 종결형도 '들으소서'와 '-주십시오'가 섞여 있습니다. 현대적인 합쇼체 청원문으로 종결을 통일했습니다.
  terminology: προσευχή/δέησις의 '기도와 간청', ἐξαιρέω의 '건져 주시다', χάρις의 문맥적 '호의'는 적절합니다. ἀποικίζω는 이 문맥에서 강제 이주·포로 상태를 가리키므로 '포로로 끌고 간 사람들'로 옮기고 주석에서 어휘의 문자적 범위를 설명합니다.
