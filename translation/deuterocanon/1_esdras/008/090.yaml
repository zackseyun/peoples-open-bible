    translation:
      text: And Jechonias son of Jeelus[a], of the sons of Israel, cried out and said to Ezra, “We have sinned against the
        Lord, and foreign women from the nations of the land have dwelt among us[b]; and now there is still hope for all Israel.”
      philosophy: optimal-equivalence
      footnotes:
      - marker: a
        text: The Greek final clause is difficult and appears to diverge from or compress the Hebrew parallel in Ezra 10:2.
          The translation follows the likely sense, 'there is still hope for Israel,' rather than a more literal but obscure
          rendering.
        reason: textual_variant
      - marker: b
        text: The Hebrew parallel reads more explicitly, 'we have married foreign women from the peoples of the land'; the
          Greek here instead says that foreign women 'have dwelt' among them.
        reason: alternative_reading
    lexical_decisions:
    - source_word: φωνήσας
      lemma: φωνέω
      chosen: cried out
      alternatives:
      - called out
      - spoke up
      lexicon: LSJ
      rationale: The participle from φωνέω conveys raising the voice or calling aloud. 'Cried out' preserves the public, urgent
        force better than the flatter 'said' or 'spoke.'
    - source_word: Ἰεχονίας Ἰεήλου
      chosen: Jechonias son of Jeelus
      alternatives:
      - Jechonias, of Jeelus
      - Jehoniah son of Jehiel
      rationale: The Greek names are transliterated per project policy. Because the construction likely reflects filiation,
        'son of Jeelus' makes the relationship explicit in English. The MT parallel in Ezra 10:2 has Jehiel, which supports
        understanding the second name as the father rather than a second appositional personal name.
    - source_word: τῶν υἱῶν Ἰσραήλ
      chosen: of the sons of Israel
      alternatives:
      - of the Israelites
      - from the sons of Israel
      lexicon: LSJ
      rationale: A relatively formal rendering preserves the Greek phrase and its genealogical flavor. 'Sons of Israel' is
        retained rather than flattening to 'Israelites,' since the phrase marks covenant identity.
    - source_word: ἡμάρτομεν εἰς τὸν κύριον
      chosen: We have sinned against the Lord
      alternatives:
      - We sinned against the Lord
      lexicon: LSJ
      rationale: The idiom means sinning against someone. 'Have sinned' reflects the Greek aorist in natural English within
        direct speech and matches the confessional tone.
    - source_word: γυναῖκες ἀλλογενεῖς
      chosen: foreign women
      alternatives:
      - women of another people
      - alien women
      lexicon: LSJ
      rationale: ἀλλογενής denotes one of another race/people, here in the context of intermarriage. 'Foreign women' is clear
        modern English and fits the social-religious context without archaic wording.
    - source_word: ἐκ τῶν ἐθνῶν τῆς γῆς
      chosen: from the nations of the land
      alternatives:
      - from the peoples of the land
      - from the Gentile peoples of the land
      lexicon: LSJ
      rationale: ἔθνη can mean nations or peoples. 'Nations of the land' stays close to the Greek while preserving the contrast
        with Israel. 'Gentile' would import later Christian associations not required here.
    - source_word: κατῴκησαν
      chosen: have dwelt among us
      alternatives:
      - have settled
      - have lived
      lexicon: LSJ
      rationale: The Greek verb means to dwell or settle. Because the MT parallel speaks of 'we have taken foreign wives,'
        the Greek here is somewhat divergent or compressed. 'Have dwelt among us' translates the Greek honestly while adding
        'among us' to make the implied social incorporation intelligible in English.
    - source_word: καὶ νῦν ἔστιν ἐπάνω πᾶς Ἰσραήλ
      chosen: and now there is still hope for all Israel
      alternatives:
      - and now all Israel is above
      - and now there is something remaining for all Israel
      lexicon: LSJ
      rationale: The transmitted Greek is difficult and appears mismatched against the MT parallel (Ezra 10:2), which reads
        'yet now there is hope in Israel concerning this matter.' Given the source validation flag and the strong parallel,
        the translation adopts the sense 'there is still hope for all Israel' as the most defensible rendering of a likely
        corrupt or compressed Greek clause, while documenting the uncertainty in a footnote.
    theological_decisions:
    - issue: Use of the divine title κύριον
      chosen_reading: the Lord
