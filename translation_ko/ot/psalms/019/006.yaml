  rationale: 앞선 절의 해를 가리키는 지시를 살려 비인칭으로 옮기되, 시적 문맥의 연결은 유지했습니다.
- source_word: כְּחָתָן
  english_pob_choice: like a bridegroom
  chosen_korean: 신랑 같고
