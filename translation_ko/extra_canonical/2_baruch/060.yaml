base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/060.yaml
  text: '1. And the fifth black waters that you saw raining—these are the deeds that the Amorites did, and the spells of their enchantments that they practiced, and the wickedness of their mysteries, and the mingling of their uncleanness.


    2. But Israel also was defiled with sins in the days of the judges, while they were seeing many signs that were done by him who made them.'
translation:
  language: ko
  text: '1. 네가 보았던 다섯째 검은 물은 떨어져 내리는 것이니 — 이는 아모리 사람들의 행위와, 그들이 행한 마술의 주술들과, 그들의 신비의 악함과, 그들의 더러움이 뒤섞인 것입니다.


    2. 그러나 이스라엘도 사사들의 시대에 죄로 더럽혀졌습니다. 그들이 그것들을 지으신 이가 행하신 많은 표징을 보고 있었기 때문입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ ... ܕܢܚܬܘ
  english_pob_choice: the fifth black waters ... raining down
  chosen_korean: 다섯째 검은 물은 떨어져 내리는 것이니
  alternatives_korean:
  - 검은 물들이 내리는 것이니
  - 비처럼 쏟아지는 검은 물은
  lexicon: 물 / 검은 / 떨어져 내리다
  rationale: 원문의 ‘검은 물’과 ‘내려오다/떨어지다’의 이미지가 핵심이어서, 자연스러운 합쇼체로 옮기되 물의 상징성과 하강 이미지를 유지했습니다.
- source_word: ܚܝܠܘܗܝ ... ܠܐܪܥܐ ܗܕܐ
  english_pob_choice: that were done by him who made them
  chosen_korean: 그것들을 지으신 이가 행하신
  alternatives_korean:
  - 그들을 만드신 분이 행하신
  - 그것을 지으신 분이 하신
  lexicon: 지으시다 / 행하다
  rationale: ‘만든 이’보다 창조-제작의 어감을 살리는 ‘지으신 이’를 택해, 뒤의 ‘많은 표징’을 행하신 분과 같은 주체를 분명히 했습니다.
- source_word: ܚܙܝܬ ... ܕܚܫܘܟ̈ܐ / ܡܟܘܬܐ
  english_pob_choice: spells of their enchantments / wickedness of their mysteries / mingling of their uncleanness
  chosen_korean: 마술의 주술들 / 그들의 신비의 악함 / 그들의 더러움이 뒤섞인 것
  alternatives_korean:
  - 주술의 주술들
  - 마법의 술수들 / 비밀의 악함 / 부정함의 섞임
  lexicon: 마술 / 주술 / 신비 / 더러움
  rationale: 영어 POB의 해석을 따라 중복적이지만 의도적으로 ‘spells of their enchantments’의 겹친 주술성을 드러내고, 원문의 도덕적 부정성은 ‘더러움’으로 보존했습니다.
- source_word: ܫܪܒܐ ܕܝܢ ... ܕܝܘܡܐ
  english_pob_choice: in the days of the judges
  chosen_korean: 사사들의 시대에
  alternatives_korean:
  - 재판관들의 날에
  - 사사 시대에
  lexicon: 사사
  rationale: 고유한 성경 역사 용어이므로 한국 교회 독자에게도 곧바로 뜻이 전달되는 ‘사사들’ 표현을 유지했습니다.
theological_decisions:
- issue: 아모리 사람들의 죄목을 ‘주술’과 ‘신비’의 영역으로 함께 제시하는 방식
  chosen_reading: 행위, 마술의 주술들, 신비의 악함, 더러움의 뒤섞임을 나란히 배치해 우상숭배적 타락의 총체성을 드러냈습니다.
  alternative_readings:
  - 단순히 ‘악행들’로 일반화
  - ‘신비’ 대신 ‘비밀’로 중화
  rationale: 원문은 행위 목록을 구체적으로 축적하여 부정성을 강화하므로, 이를 완화하지 않고 병렬 구조를 보존했습니다.
  doctrine_reference: 본문의 윤리적 경고와 정결/부정의 대조
