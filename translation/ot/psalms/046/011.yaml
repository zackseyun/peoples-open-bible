id: PSA.46.11
reference: Psalms 46:11
source:
  edition: WLC
  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
translation:
  text: Yahweh of Armies is with us; the God of Jacob is a stronghold for us. Selah
  philosophy: dynamic
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: צְבָאוֹת
  chosen: of Armies
  alternatives:
  - of hosts
  - of heavenly armies
  lexicon: HALOT
  rationale: The construct with YHWH denotes armies/hosts. 'Armies' is more transparent in contemporary English than the traditional 'hosts' while preserving the martial and sovereign sense.
- source_word: עִמָּנוּ
  lemma: עִם
  chosen: is with us
  alternatives:
  - is among us
  lexicon: HALOT
  rationale: The preposition עִם with 1cp suffix naturally means 'with us.' Supplying 'is' is required in English verbless clause translation.
- source_word: מִשְׂגָּב
  chosen: a stronghold
  alternatives:
  - a refuge
  - a high fortress
  lexicon: HALOT
  rationale: מִשְׂגָּב denotes a secure height or fortified refuge. 'Stronghold' best captures both protection and fortification in readable modern English.
- source_word: לָנוּ
  chosen: for us
  alternatives:
  - to us
  lexicon: HALOT
  rationale: 'The prefixed ל marks advantage/benefit here: God is a stronghold ''for us,'' not merely ''to us.'''
- source_word: אֱלֹהֵי יַעֲקֹב
  chosen: the God of Jacob
  alternatives:
  - Jacob's God
  lexicon: HALOT
  rationale: The construct phrase is most naturally rendered 'the God of Jacob.' This preserves the covenantal identification and traditional biblical idiom.
- source_word: סֶלָה
  chosen: Selah
  alternatives:
  - Interlude
  - Musical pause
  lexicon: HALOT
  rationale: Because the precise force of סלה remains uncertain, transliteration preserves the Hebrew term without over-interpreting its liturgical or musical meaning.
