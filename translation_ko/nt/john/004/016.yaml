translation:
  language: ko
  text: 그가 그녀에게 말했습니다[a]. “가서 남편을 불러 이리로 오십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 현재시제(Λέγει)를 사용합니다. 이를 역사적 현재로 볼 수 있으나, 현대 한국어 서술의 자연스러움을 위해 과거형으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  english_pob_choice: He said
  chosen_korean: 그가 그녀에게 말했습니다
  alternatives_korean:
  - 그가 그녀에게 말한다
  - 그가 그녀에게 말씀하셨다
  lexicon: BDAG
  rationale: 그리스어 현재(역사적 현재)는 내러티브에서 과거로 옮겨 자연스럽게 읽히는 경우가 많습니다. 현대 한국어 본문에는 과거 시제가 더 자연스럽으므로 '말했습니다'로 번역했습니다. 대체로 경어화(말씀하셨다)도 가능하지만 원문의 대화적 직접성을 유지하기 위해 평서형 경어(말했습니다)를 택했습니다.
- source_word: Ὕπαγε
  english_pob_choice: Go
  chosen_korean: 가서
  alternatives_korean:
  - 떠나라
  - 가거라
  lexicon: BDAG
  rationale: ὑπάγω의 명령형은 출발·행동을 지시합니다. 한국어에서는 다음 행동(부르다)과 연결되는 '가서'가 간결하고 자연스럽습니다.
- source_word: φώνησον
  english_pob_choice: call
  chosen_korean: 남편을 불러
  alternatives_korean:
  - 남편을 불러오라
  - 남편을 데려와라
  lexicon: BDAG
  rationale: φωναέω의 aorist 명령형으로 '부르다/소환하다' 의미입니다. 문맥상 즉시 사람을 부르라는 명령이라 '불러'가 적절합니다.
- source_word: τὸν ἄνδρα σου
  english_pob_choice: your husband
  chosen_korean: 네 남편
  alternatives_korean:
  - 당신의 남편
  - 그의 남편
  lexicon: BDAG
  rationale: ἀνήρ는 문맥에 따라 '남편' 또는 '남자'로 번역됩니다. 소유대명사 'σου'와 가정적 상황을 고려하면 '네 남편'이 가장 직접적입니다. 인칭·경어 문제로 본문 내 직설 화법에서는 친밀한 2인칭 표지가 적합하다고 판단했습니다.
- source_word: ἐλθὲ ἐνθάδε
  english_pob_choice: come here
  chosen_korean: 여기로 오라
  alternatives_korean:
  - 여기로 오십시오
  - 여기 오너라
  lexicon: BDAG
  rationale: ἔρχομαι의 명령형+ἐνθάδε(여기)로 '여기로 오라'가 직역에 가까우며 원문 명령의 간결함을 살립니다.
theological_decisions:
- issue: 역사적 현재(Λέγει) 처리
  chosen_reading: 한국어 자연스러움을 위해 과거 시제('말했습니다')로 옮김
  alternative_readings:
  - 원문 현재시제 그대로 '말한다'로 유지
  - 높임말 과거 '말씀하셨다'로 옮김
  rationale: 복음서의 현재 시제는 종종 역사적 현재로 기능합니다. 현대 한국어 본문에서는 독자 이해와 자연스러운 서술을 위해 과거 시제가 더 적절하므로 과거형을 선택했습니다. 원문 시제의 특수성을 밝히기 위해 각주를 달았습니다.
  doctrine_reference: 서사문법·번역실무
- issue: 직접 인용문 내 경어·2인칭 표현
  chosen_reading: 예수의 직접 발화는 대화의 즉시성을 살려 평서적/직설적 2인칭(‘네’, ‘오라’)으로 번역
  alternative_readings:
  - 본문 전체를 한결같이 존칭·정중체로 처리하여 인용문도 '당신의 남편을 불러 여기로 오십시오'로 번역
  - 인용문을 더 고전적·경어적으로 '불러 오라' 등으로 처리
  rationale: 원문 맥락상 예수와 사마리아 여인 사이의 직접적 대화가 중심이므로 인용문의 즉시성을 살리는 직설적 표현을 택했습니다. POB 지침은 인용문에서의 등록(레지스터) 변화를 허용하므로 이를 활용했습니다.
  doctrine_reference: POB 번역 원칙(직접성 보존)
