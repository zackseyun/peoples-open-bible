translation:
  text: 'V.1. He says, “I told you just now that you are crafty and headstrong, asking for explanations
    of the parables. Since you are so persistent, I will explain the field and everything else that follows,
    so that you can make all these things known. Listen now and understand them.”


    V.2. “The field is this world. Its master is the one who created everything, completed it and strengthened
    it. The servant is the Son of God[a]. The vines are this people whom he himself planted[b].”


    V.3. “The stakes are the Lord’s holy angels, who hold his people together[c]. The weeds pulled out
    of the vineyard are the lawless deeds of God’s servants. The food sent from the dinner is the commandments
    he gave his people through his Son. The friends and advisers are the holy angels who were created
    first. The master’s journey away is the time left until his coming.”


    V.4. I say, “Sir, everything is great, wonderful and glorious[d]. Could I have understood these things?
    No other person can understand them either, however intelligent. Sir, also explain what I am about
    to ask you.”


    V.5. He says, “Speak, if you wish anything.” I say, “Sir[e], why is the Son of God placed in a servant’s
    position in the parable?”


    VI.1. He says, “Listen. The Son of God is not placed in a servant’s position[f]. He is placed in great
    authority and lordship.” I say, “How, sir? I do not understand.”


    VI.2. He says, “God planted the vineyard. That means he created the people and handed them over to
    his Son. The Son appointed angels over them to preserve them. He himself cleansed their sins[g]. He
    labored much and endured many toils, for no one can dig without toil or labor.”


    VI.3. “After cleansing the people’s sins himself, he showed them the paths of life. He gave them the
    law he received from his Father.”


    VI.4. He says, “You see that he himself is Lord of the people. He received all authority from his
    Father[h]. Now listen to why the master took his Son and the glorious angels as advisers about the
    servant’s inheritance.”


    VI.5. “God caused the Holy Spirit, which existed before and created all creation, to dwell in flesh
    that he willed[i]. This flesh served the Spirit well. It walked in dignity and purity and did not
    defile the Spirit in any way.”


    VI.6. “This flesh had lived well and purely. It had toiled with the Spirit and worked with it in every
    deed. It had behaved strongly and courageously. So he chose it as a partner with the Holy Spirit[j].
    This flesh’s conduct pleased the Lord[k], because it was not defiled on earth while having the Holy
    Spirit.”


    VI.7. “So he took the Son and the glorious angels as advisers. This was so that this flesh, which
    had served the Spirit blamelessly, might have a place to dwell. It might then not seem to have lost
    the reward of its service. All flesh found undefiled and spotless, in which the Holy Spirit dwelt,
    will receive a reward[l].”


    VI.8. “You also have the explanation of this parable.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The working V.2 identifies the servant as the Son of God. Vulgata Hil1873 printed82 also separately
      identifies the parable’s son as the Holy Spirit; Palatina GH1877 printed151–153 and the working
      Greek lack that additional sentence. Michigan has a physical loss through much of V.2–3 and cannot
      decide its presence. The additional Vulgata identification is disclosed, not silently inserted or
      treated as unanimous. Later doctrinal identifications are not added to the translation.
  - marker: b
    reason: textual_variant
    text: Working V.2 brackets this in this people. Both printed Latin versions have vineyard rather than
      plural vines. The working Greek image and disclosed bracketed word are retained.
  - marker: c
    reason: textual_variant
    text: Working V.3 brackets holy and prints hold-together as Hilgenfeld’s conjecture against reported
      Athos bring-together. The printed Latin versions describe angels appointed to hold the people together.
      Michigan loses the relevant stretch and cannot certify these Greek words. The foods-as-commandments
      explanation is retained in full; Palatina’s wording differs and its editor discusses a correction.
  - marker: d
    reason: textual_variant
    text: Working V.4 brackets everything is in the first part of the expression. Michigan printed57 partly
      preserves the corresponding expression and differs in the later word order. The strong claim that
      no other person can understand is retained without adding an exception.
  - marker: e
    reason: textual_variant
    text: Working V.5 brackets sir. Michigan’s fifteen-line physical loss begins during this question
      and spans VI.1. Its absence there is not evidence that Hermas never asked the question.
  - marker: f
    reason: textual_variant
    text: The first not in VI.1 is Hilgenfeld’s insertion from the Latin versions according to the1891
      apparatus; reported Athos lacks it. Vulgata printed83 and Palatina printed155 directly have non
      ponitur (is not placed). Michigan’s fifteen lost lines cover this clause, so Michigan cannot vote
      for either reading. This draft retains the disclosed working negative; the positive Athos alternative
      is not hidden or called impossible.
  - marker: g
    reason: textual_variant
    text: Working VI.2 has their sins, Gebhardt’s version-supported correction against reported Athos
      our sins. Michigan printed58 has their sins largely supplied where damaged, not independent preservation
      of the whole pronoun. Michigan says no vineyard can be dug without toil or labor; the working source
      says no one can dig. Palatina printed155 describes suffering the people’s sins in VI.3, while the
      working source and Vulgata printed84 retain cleansing/removal. These differences are not silently
      combined.
  - marker: h
    reason: textual_variant
    text: The bars around VI.4’s Lord-of-the-people and all-authority sentence mark Gebhardt’s version-supported
      restoration against the reported Athos/Ethiopic similar-ending loss. Michigan printed58 partly preserves
      its opening (including Lord), but the next seventeen lines are lost. It does not preserve every
      restored word. Both printed Latin versions contain the sentence. The following about is Anger’s
      conjecture against reported Athos beside/from; the working inheritance relation is retained.
  - marker: i
    reason: textual_variant
    text: Working VI.5 says the preexistent Holy Spirit created all creation and God caused it to dwell
      in flesh. Both printed Latin versions instead have created first of all language and difficult,
      differently edited wording about the body; their editors discuss corruption and corrections. Michigan
      loses this paragraph entirely. The draft retains the actual Greek assertion, without turning it
      into God created the Spirit, calling the Latin wording identical, or adding a later doctrinal formula.
  - marker: j
    reason: textual_variant
    text: Working VI.6 retains he chose it as a partner with the Holy Spirit. Michigan printed58 has a
      heavily damaged partner word and lacks the following holy in its printed text; the editor calls
      the word uncertain. The Latin versions recast the selection/approval with the Spirit. No unique
      interpretation of the choice or identity of every parable actor is asserted here.
  - marker: k
    reason: textual_variant
    text: Working VI.6 brackets the Lord, inserted by Harmer from Palatina/Ethiopic support; reported
      Athos and Michigan lack the dative recipient. Vulgata printed85 has God and Palatina printed159
      has Lord. The supplied working recipient is retained and disclosed.
  - marker: l
    reason: textual_variant
    text: The bars within VI.7 mark Gebhardt’s version-supported restoration of the reward-of-service
      and all-flesh-receives-reward wording missing in reported Athos through similar endings. Vulgata
      printed85 directly has the reward statement. Palatina printed159 recasts the pure body as not found
      without reward rather than a separate all-flesh future assertion. Michigan loses seventeen lines
      here and cannot certify this supplement. The working reward statement keeps its undefiled/spotless
      and indwelling-Spirit conditions.
