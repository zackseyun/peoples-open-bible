id: PRO.23.34
reference: Proverbs 23:34
source:
  edition: WLC
  text: וְ֭/הָיִיתָ כְּ/שֹׁכֵ֣ב בְּ/לֶב יָ֑ם וּ֝/כְ/שֹׁכֵ֗ב בְּ/רֹ֣אשׁ חִבֵּֽל־׃
translation:
  text: You will be like someone lying aboard a ship in the heart of the sea, like someone lying at the top of a mast[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The rare Hebrew nautical term is uncertain; it may refer to a ship’s ropes or rigging rather than its mast.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיִיתָ
  chosen: And you will be
  alternatives:
  - and you become
  - then you will be
  lexicon: HALOT
  rationale: Qal perfect 2ms of היה with prefixed conjunction functions here with future/resultative force in the warning context. 'And you will be' preserves the direct second-person address and the consequence sense.
- source_word: כְּשֹׁכֵב
  chosen: like one lying down
  alternatives:
  - like one who lies down
  - as one sleeping
  lexicon: HALOT
  rationale: The participle of שׁכב denotes the state of lying down. 'Like one lying down' is idiomatic and preserves the simile without overinterpreting it as actual sleep.
- source_word: בְּלֶב יָם
  chosen: in the heart of the sea
  alternatives:
  - in the midst of the sea
  - at sea
  lexicon: HALOT
  rationale: לֵב literally means 'heart,' often metaphorically 'midst' or 'center.' Retaining 'heart of the sea' preserves the vivid Hebrew imagery while remaining understandable in English.
- source_word: וּכְשֹׁכֵב
  chosen: like one lying down
  alternatives:
  - and like one lying down
  - like one who lies down
  lexicon: HALOT
  rationale: The repeated participial phrase intensifies the comparison. English can omit an extra 'and' inside the simile for smoother style while preserving the parallelism.
- source_word: בְּרֹאשׁ
  chosen: at the top of
  alternatives:
  - at the head of
  - on the summit of
  lexicon: HALOT
  rationale: This is the natural English expression for location at the elevated point envisioned by the simile.
- source_word: חִבֵּל
  chosen: a mast
  alternatives:
  - a mast
  - the ropes
  - a ship's mast
  lexicon: HALOT
  rationale: “Mast” gives the traditional and contextually vivid nautical image, while the note preserves the uncertainty surrounding the rare term and its possible association with rope or tackle.
