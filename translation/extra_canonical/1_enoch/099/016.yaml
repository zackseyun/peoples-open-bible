    rationale: Within the sequence of punishments, evil placed in their hearts most likely means inward affliction or misery. The alternative moral sense remains possible and is given in a footnote.
  - source_phrase: ወያነሥእ፡ *መዐተ፡ ወመንፈሱ፡ ያሐጕለክሙ፡ ለ*ኵልክሙ፡ በሰይፍ
    prior_rendering: ''
    new_rendering: and rouse his wrath; his spirit will destroy you all with the sword
    rationale: The supplied wording distinguishes the arousing of wrath from destruction by his spirit. The translation preserves that agency and the sword image without reducing the clause to a general statement of punishment.
  - source_phrase: ወኵሎሙ፡ *ቅዱሳን፡ ወጻድቃን፡ ይዜከሩ፡ ኃጢአተ፡ ዚአክሙ
