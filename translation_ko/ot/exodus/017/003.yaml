  to: 그곳에서 백성은 물이 없어 목말랐습니다. 백성은 모세에게 불평하며 말했습니다. "어찌하여 당신은 우리를 이집트에서 데리고 올라와, 나와 내 자녀들과 내 가축을 갈증으로 죽게 하십니까?"
  rationale: 갈증으로 인한 죽음이라는 원문의 표현을 현대 한국어로 정확하고 자연스럽게 고쳤고, 모세를 향한 백성의 직접적인 항변과 단수 화자의 '나와 내 자녀들과 내 가축'을 보존했습니다. 논쟁적 해석이나 교리적 보충은 하지 않았습니다.
