translation:
  text: '1. “Foremost of all is desire for another’s wife or husband[a], and for the luxury of wealth,
    and for many vain dishes and intoxicating drinks, and for many other foolish indulgences; for every
    indulgence is foolish and empty for the servants of God.


    2. “These, then, are evil desires, putting the servants of God to death. For this evil desire is the
    devil’s daughter[b]. Therefore one must abstain from evil desires, so that, by abstaining, you may
    live to God.


    3. “But all who are overmastered by them and do not stand against them will die utterly[c]; for these
    desires are death‑dealing.


    4. “But you—put on the desire for righteousness, and, having armed yourself with the fear of the Lord[d],
    stand against them. For the fear of God dwells in the good desire. If the evil desire sees you armed
    with the fear of God and standing against it, it will flee far away from you, and it will no longer
    appear to you, being afraid of your weapons.


    5. “So then, having been crowned in your contest against it, come to the desire for righteousness,
    and, handing over to it the victory you received, serve it as it wills. If you serve the good desire
    and submit to it, you will be able to master the evil desire and to subject it as you wish.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Another’s wife or husband preserves both sexes and the shared other-person construction. The
      Greek does not restrict this clause to a man desiring a wife.
  - marker: b
    reason: textual_variant
    text: 'Project edition-comparison report: Working daughter of the devil is present in Lake (1907)
      Plate VIII and Palatina printed 125. Vulgata printed 64 instead says from the devil. These are different
      versional forms, not three identical Greek witnesses.'
  - marker: c
    reason: lexical_alternative
    text: Die utterly preserves eis telos; alternatives include die finally or die completely. The working
      necessity and death warning are not softened.
  - marker: d
    reason: lexical_alternative
    text: The working passage has fear of the Lord and fear of God at their respective positions. These
      titles are retained rather than standardized throughout the paragraph.
