id: JOB.40.14
reference: Job 40:14
source:
  edition: WLC
  text: וְ/גַם אֲנִ֥י אוֹדֶ֑/ךָּ כִּֽי תוֹשִׁ֖עַ לְ/ךָ֣ יְמִינֶֽ/ךָ־־׃
translation:
  text: Then even I will praise you, because your right hand can save you.
  philosophy: dynamic
lexical_decisions:
- source_word: וְגַם
  chosen: Then even
  alternatives:
  - And also
  - Even
  lexicon: HALOT
  rationale: The combination adds emphasis and continuation from the preceding challenge. 'Then even' captures both the connective force and the emphatic sense in natural English.
- source_word: אֲנִי
  chosen: I
  lexicon: HALOT
  rationale: 'Explicit pronoun retained for emphasis: God himself is the speaker.'
- source_word: אוֹדְךָ
  chosen: will praise you
  alternatives:
  - will acknowledge you
  - will confess you
  lexicon: HALOT
  rationale: Hiphil of ידה here means to give praise/thanks. In this context of divine concession after Job proves his power, 'praise you' fits better than 'thank you' or the less idiomatic 'acknowledge you.'
- source_word: כִּי
  chosen: because
  alternatives:
  - for
  - that
  lexicon: HALOT
  rationale: Introduces the reason for the preceding statement. 'Because' is the clearest modern English rendering.
- source_word: תוֹשִׁיעַ
  chosen: can save
  alternatives:
  - will save
  - gives victory
  - delivers
  lexicon: HALOT
  rationale: The verb is Hiphil of ישׁע, 'save/deliver.' With the preceding conditional challenge, the sense is capability demonstrated by action; 'can save' communicates that if Job can accomplish this, God would concede his sufficiency. 'Will save' is possible but sounds more predictive than concessive.
- source_word: לְךָ
  chosen: you
  alternatives:
  - for yourself
  lexicon: HALOT
  rationale: 'The preposition marks advantage: ''for yourself.'' In idiomatic English, ''save you'' communicates the sense naturally, while the reflexive nuance can be preserved in a footnote.'
- source_word: יְמִינְךָ
  chosen: your right hand
  lexicon: HALOT
  rationale: Literal rendering preserved. In Hebrew idiom the right hand signifies strength or power, and the image should remain visible in the main text.
- source_word: תוֹשִׁיעַ לְךָ יְמִינֶךָ
  chosen: your right hand can save you
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Keeps the Hebrew image and expresses the beneficiary naturally without adding emphasis not explicitly carried by the preposition.
