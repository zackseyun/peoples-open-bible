id: PRO.4.13
reference: Proverbs 4:13
source:
  edition: WLC
  text: הַחֲזֵ֣ק בַּ/מּוּסָ֣ר אַל תֶּ֑רֶף נִ֝צְּרֶ֗/הָ כִּי הִ֥יא חַיֶּֽי/ךָ־־׃
translation:
  text: Hold fast to instruction[a]; do not let go. Guard it, for it is your life.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Hebrew musar includes disciplined training and correction, not only the imparting of knowledge.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  chosen: Hold fast
  alternatives:
  - Take hold
  - Seize firmly
  - Hold on to
  lexicon: HALOT
  rationale: Imperative of חזק conveys strong grasping or firm adherence. 'Hold fast' preserves both the physical metaphor and the exhortational force in natural English.
- source_word: בַּמּוּסָר
  chosen: to instruction
  alternatives:
  - to discipline
  - to correction
  lexicon: HALOT
  rationale: מוּסָר in Proverbs often denotes formative instruction with disciplinary force. 'Instruction' fits the wisdom context best in English, while the disciplinary nuance is acknowledged by alternatives.
- source_word: אַל תֶּרֶף
  chosen: do not let go
  alternatives:
  - do not slacken
  - do not abandon
  - do not release
  lexicon: HALOT
  rationale: From רפה, the sense here is to loosen one's grip or relax one's hold. 'Do not let go' matches the preceding grasp metaphor and reads idiomatically.
- source_word: נִצְּרֶהָ
  chosen: Guard it
  alternatives:
  - Keep her
  - Watch over her
  - Preserve her
  lexicon: HALOT
  rationale: The Hebrew feminine suffix refers to instruction; English idiom uses the neuter pronoun for “instruction.”
- source_word: כִּי הִיא
  chosen: for it
  alternatives:
  - for it
  - because she
  lexicon: HALOT
  rationale: The feminine Hebrew pronoun marks agreement with its referent and need not be represented by an English personal pronoun.
- source_word: חַיֶּיךָ
  chosen: your life
  alternatives:
  - your lives
  - your livelihood
  - your source of life
  lexicon: HALOT
  rationale: 'Though formally plural, חַיִּים often functions idiomatically as ''life.'' Singular English is the natural rendering here: instruction is presented as the addressee''s life in a comprehensive sense.'
