lexical_decisions:
- source_word: לְצֶלַע נָכוֹן
  english_pob_choice: ready to fall
  chosen_korean: 넘어질 준비가 되어 있고
  alternatives_korean:
  - 쓰러질 준비가 되어 있고
  - 떨어질 준비가 되어 있고
  lexicon: נכון
  rationale: 히브리어 נָכוֹן은 ‘준비되다/굳게 서다’의 뜻을 가지며, POB의 ‘ready to fall’을 자연스럽게 풀어 현대 한국어로 옮기면 ‘넘어질 준비가 되어 있다’가 가장 직접적입니다.
- source_word: מַכְאוֹב
  english_pob_choice: pain
  chosen_korean: 고통
  alternatives_korean:
  - 아픔
  - 통증
  lexicon: מכאוב
  rationale: מַכְאוֹב는 단순한 신체 통증보다 더 넓은 ‘고통/괴로움’의 뜻을 담으므로, 시적 문맥에서 ‘고통’이 의미 범위를 잘 드러냅니다.
- source_word: תָמִיד נֶגְדִּי
  english_pob_choice: always before me
  chosen_korean: 항상 내 앞에 있습니다
  alternatives_korean:
  - 늘 내 앞에 있습니다
  - 언제나 내 앞에 있습니다
  lexicon: נגד
  rationale: נֶגְדִּי는 ‘내 앞에, 내 시야에’라는 공간적 대비를 나타내므로, ‘항상 내 앞에 있습니다’로 옮겨 지속적 자각을 살렸습니다.
theological_decisions:
- issue: 시편 화자의 자기 진술을 현재형으로 유지할지 여부
  chosen_reading: 현재형으로 ‘내가 … 있습니다’라고 옮겨, 지속적 상태와 탄식의 현재성을 살렸습니다.
  alternative_readings:
  - 과거형으로 ‘내가 … 있었습니다’
  - 미래형 뉘앙스로 ‘내가 … 있게 됩니다’
  rationale: 히브리어 문맥은 현재적 실존 상태를 드러내는 탄식이므로, 한국어도 현재형이 가장 자연스럽고 원문 효과를 보존합니다.
  doctrine_reference: 시편의 탄식 시학
