  meaning_decisions:
  - source_phrase: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן וְהִקְרִיב
    prior_rendering: he shall bring them to the priest, and he shall present
    new_rendering: He shall bring them to the priest, who shall present
    rationale: The subject changes from the offender to the priest; naming that change prevents readers from assigning the ritual action to the offender.
  - source_phrase: וּמָלַק אֶת רֹאשׁוֹ מִמּוּל עָרְפּוֹ
    prior_rendering: he shall pinch off its head from the front of its neck
    new_rendering: The priest shall cut the bird’s neck at the nape
    rationale: The neck term denotes the nape, and the ritual action cuts into the neck without necessarily detaching the head; 'pinch off' misleadingly suggests complete removal.
  - source_phrase: וְלֹא יַבְדִּיל
    prior_rendering: but he shall not sever it
    new_rendering: but shall not completely detach its head
    rationale: The prohibition concerns complete separation of the head, not the absence of a cut.
