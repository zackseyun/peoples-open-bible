revisions:
- from: 한 가지를 하나님께서 말씀하셨습니다. 두 가지를 제가 들었습니다. 곧 힘은 하나님께 속합니다.[a]
  to: 주님, 한결같은 사랑은 주님께 속합니다. 주님께서 각 사람에게 그 행위대로 갚으시기 때문입니다.
  rationale: 히브리어의 전치된 ‘주님께’를 첫 문장에 보존하고, 무동사절은 한국어의 ‘속합니다’로 자연스럽게 보충했습니다. כִּי는 앞 진술의 근거를 나타내므로 ‘때문입니다’로 옮겼습니다. ‘각 사람’은 אִישׁ의 대표적 단수 용법을, ‘그 행위대로’는 כְּמַעֲשֵׂהוּ의 대응 관계와 단수 소유 접미사를 반영합니다. 원문과 무관한 기존 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:09:08Z'
