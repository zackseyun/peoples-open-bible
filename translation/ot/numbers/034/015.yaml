  from: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
  to: The two tribes and the half-tribe have received their inheritance on the east side of the Jordan opposite Jericho, toward the sunrise.”
  rationale: The lexical record recognizes the doubled eastern designation and the Jericho reference as geographical orientation. I make the side of the Jordan explicit while retaining “toward the sunrise,” so the source’s emphatic eastern orientation remains in the text rather than a footnote.
