id: JOB.32.13
reference: Job 32:13
source:
  edition: WLC
  text: פֶּן תֹּ֣֭אמְרוּ מָצָ֣אנוּ חָכְמָ֑ה אֵ֖ל יִדְּפֶ֣/נּוּ לֹא אִֽישׁ־־׃
translation:
  text: Do not say, “We have found wisdom; God will overcome him[a], not man.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “drive him away”; in this dispute, the image suggests overcoming an opponent.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  chosen: Lest
  alternatives:
  - so that not
  - otherwise
  lexicon: HALOT
  rationale: Introduces a warning against a possible claim. 'Lest' is concise and fits the cautionary force better than a more wooden 'so that not.'
- source_word: תֹּאמְרוּ
  chosen: you say
  alternatives:
  - you may say
  - you should say
  lexicon: HALOT
  rationale: Second person masculine plural imperfect in direct discourse context; simple present English after 'lest' naturally conveys the prospective sense.
- source_word: מָצָאנוּ
  chosen: we have found
  alternatives:
  - we found
  lexicon: HALOT
  rationale: The perfect is well represented by English present perfect here, expressing a claimed result already attained.
- source_word: חָכְמָה
  chosen: wisdom
  lexicon: HALOT
  rationale: Standard rendering; no contextual reason to narrow or paraphrase.
- source_word: אֵל
  chosen: God
  alternatives:
  - God alone
  lexicon: HALOT
  rationale: The noun refers to God, not merely 'mighty one,' in this contrastive clause. 'God' is the plain sense in context.
- source_word: יִדְּפֶנּוּ
  chosen: will drive him away
  alternatives:
  - will drive him away
  - can answer him
  - can subdue him
  lexicon: HALOT
  rationale: Preserves the verb's concrete image while the note records contextual interpretations.
- source_word: לֹא אִישׁ
  chosen: not man
  alternatives:
  - not a man
  - not a human
  lexicon: HALOT
  rationale: The Hebrew contrasts God with a human being in a generic sense. Following the project's gender-accurate policy, 'man' is retained as the representative singular matching the source form and contrast.
- source_word: פֶּן תֹּאמְרוּ
  chosen: Do not say
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Idiomatic English for Elihu's warning against their prospective claim.
