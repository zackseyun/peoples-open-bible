  naturalness: ‘호렙에서, 곧 모임의 날에’의 ‘곧’은 호렙과 모임의 날을 동격처럼 들리게 하므로 삭제해야 합니다. ‘하나님께 구한’과 ‘제가 죽을까 합니다’는 현대 한국어의 정중한 직접 인용으로 자연스럽습니다.
  terminology: 야훼 및 하나님은 초안의 명명 방침을 유지할 수 있습니다. קָהָל은 문맥상 ‘모임’으로 번역 가능하며, 주석은 그 공적 집합의 의미를 적절히 설명합니다.
