lexical_decisions:
- source_word: μηχανὰς
  chosen: engines
  alternatives:
  - siege engines
  - machines
  lexicon: LSJ
  rationale: In this military context μηχανή refers to war machines used in siege warfare. 'Engines' preserves the concise sense of the Greek and fits the reciprocal phrase 'against their engines.' 'Siege engines' is more explicit but slightly more interpretive; 'machines' is broader and less idiomatic for ancient warfare.
- source_word: πρὸς
  chosen: against
  alternatives:
  - for use against
  - toward
  lexicon: LSJ
  rationale: Here πρὸς with the accusative in a hostile military setting is best rendered 'against,' indicating opposition between one side's devices and the other's.
- source_word: ἐπολέμησαν
  chosen: they fought
  alternatives:
  - they waged war
  - they battled
  lexicon: LSJ
  rationale: The verb straightforwardly denotes engaging in battle. 'They fought' is natural modern English and adequately reflects the aorist narrative action without overexpansion.
- source_word: ἡμέρας πολλάς
  chosen: for many days
  alternatives:
  - many days
  - over many days
  lexicon: LSJ
  rationale: The accusative of duration is naturally rendered 'for many days' in English.
- source_word: καὶ αὐτοὶ
  chosen: they also
  alternatives:
  - they themselves also
  - they too
  lexicon: LSJ
  rationale: The phrase marks that this side likewise constructed such devices in response. 'They also' captures the additive force cleanly; 'themselves' would add emphasis that is possible but not necessary in English here.
