id: PSA.41.13
reference: Psalms 41:13
source:
  edition: WLC
  text: בָּ֘ר֤וּךְ יְהוָ֨ה אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל מֵֽ֭/הָ/עוֹלָם וְ/עַ֥ד הָ/עוֹלָ֗ם אָ֘מֵ֥ן וְ/אָמֵֽן׀׀׃
translation:
  text: Blessed be Yahweh, the God of Israel, from everlasting to everlasting. Amen and Amen.
  philosophy: dynamic
lexical_decisions:
- source_word: בָּרוּךְ
  chosen: Blessed be
  alternatives:
  - Praised be
  - May ... be blessed
  lexicon: HALOT
  rationale: As a passive participial blessing formula introducing doxology, this is most naturally rendered idiomatically in English as 'Blessed be,' preserving the liturgical force without awkwardness.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  chosen: the God of Israel
  alternatives:
  - God of Israel
  lexicon: HALOT
  rationale: Construct phrase straightforwardly means 'God of Israel.' The article in English improves naturalness in a doxological sentence.
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  chosen: from everlasting to everlasting
  alternatives:
  - from eternity to eternity
  - from age to age
  - forever and ever
  lexicon: HALOT
  rationale: עוֹלָם here denotes unbounded duration in a doxological formula. 'From everlasting to everlasting' preserves the elevated, temporal-totality sense better than the more idiomatic but slightly less precise 'forever and ever.'
- source_word: אָמֵן וְאָמֵן
  chosen: Amen and Amen
  alternatives:
  - Amen, yes, amen
  - Truly and truly
  lexicon: HALOT
  rationale: The repeated liturgical affirmation is best preserved by transliteration. Repetition should remain explicit rather than collapsed, since it marks emphatic congregational assent and closes the psalm/book section.
