id: T12P.GAD.06
reference: Testament of Gad 6
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 'VI. *Καὶ νῦν¹, τέκνα μου, Γπαραινῶ ὑμῖν⌉². ἀγαπᾶτε³ ἕκαστος *τὸν πλησίον⁴ αὑτοῦ⁵, καὶ ἐξάρατε τὸ μῖσος ἀπὸ τῶν καρδιῶν ὑμῶν· ἀγαπήσατε⁶ ἀλλήλους⁷ ἐν ἔργῳ καὶ λόγῳ καὶ διανοίᾳ ψυχῆς. 2. *Ἐγὼ γὰρ⁸ κατὰ πρόσωπον τοῦ πατρὸς μου⁹, εἰρηνικὰ¹⁰ ἐλάλουν τῷ Ἰωσήφ· *ἐξερχόμενος δὲ ἐξ αὐτοῦ¹¹ τὸ πνεῦμα *τοῦ μίσους ἐσκότιζέ μου τὸν νοῦν¹², καὶ ἐτάρασσέ¹³ *μου τὸν λογισμόν¹⁴ *πρὸς τὸ¹⁵ ἀνελεῖν αὐτόν¹⁶. 3. Ἀγαπήσατε¹⁷ ἀλλήλους ἀπὸ καρδίας, καὶ ἐάν τις¹⁸ *ἁμαρτήσει εἰς σέ¹⁹, [α-text] εἰπὲ αὐτῷ εἰρήνην²⁰, καὶ ἐν τῇ ψυχῇ σου μὴ κρατήσῃς δόλον· καὶ ἐὰν μετανοήσας ὁμολογήσῃ²¹, ἄφες αὐτῷ²². [β, Α, S¹] εἰπὲ αὐτῷ *ἐν εἰρήνῃ²³, ἐξορίσας τὸν ἰὸν τοῦ μίσους, καὶ²⁴ ἐν τῇ²⁵ ψυχῇ σου μὴ κρατήσῃς δόλον· καὶ ἐὰν *ὁμολογήσας μετανοήσῃ²⁶ *ἄφες αὐτῷ²⁷. 4. Ἐὰν δὲ ἀρνεῖται²⁸, μὴ φιλονείκει αὐτῷ, μήποτε²⁹ ὁμόσαντος αὐτοῦ δισσῶς ἁμαρτάνεις³⁰. 5. [Μὴ³¹ ἀκούσῃ³² ἐν μάχῃ ἀλλότριος³³ τὸ³⁴ μυστήριόν σου³⁵, *ἵνα μὴ³⁶ μισήσας³⁷ *ἐχθράνῃ σε³⁸, καὶ μεγάλην ἁμαρτίαν ἐργάσηται³⁹ [ἐν σοί]⁴⁰. ὅτι πολλάκις *δολοφωνεῖ σε⁴¹ ἢ περιεργάζεται σε⁴² ἐν κακοῖς⁴³] *λαβὼν ἀπό σου⁴⁴ τὸν ἰόν. 6. Ἐὰν *δὲ ἀρνήσηται⁴⁵ καὶ *αἰδεσθῇ ἐλεγχόμενος⁴⁶, ἡσύχασον⁴⁷ μὴ †ἐλέγξῃς⁴⁸ αὐτόν· ὁ γὰρ ἀρνούμενος⁴⁹ μετανοεῖ *τοῦ πλημμελῆσαι⁵⁰ *εἰς σέ⁵¹. *καὶ [φοβηθεὶς] εἰρηνεύει⁵². 7. Ἐὰν δέ *ἔστω ἀναιδὴς⁵³ καὶ ἐνίσταται⁵⁴ τῇ κακίᾳ, *καὶ οὕτως⁵⁵ ἄφες αὐτῷ ἀπὸ καρδίας, καὶ δὸς⁵⁶ τῷ Θεῷ τὴν ἐκδίκησιν.'
