  naturalness: 현 초안 자체의 문장은 대체로 자연스럽지만, 대상 절이 달라 해당 구절의 번역으로는 사용할 수 없습니다. 수정문은 현대 표준어 합쇼체로 간결하고 자연스럽게 구성했습니다.
