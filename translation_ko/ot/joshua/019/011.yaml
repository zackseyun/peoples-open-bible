  text: And their border went up westward to Maralah, and touched Dabbesheth, and touched the wadi that is opposite Jokneam.
translation:
  language: ko
  text: 그 경계가 서쪽으로 마랄라까지 올라가 답베셋에 닿고, 욕느암 맞은편에 있는 와디에 닿았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘와디’는 물길 또는 골짜기 물길을 가리키며, 지역에 따라 계절적으로나 간헐적으로 물이 흐를 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָלָה גְבוּלָם לַיָּמָּה
  english_pob_choice: their border went up westward
  chosen_korean: 그 경계는 서쪽으로 올라가서
  alternatives_korean:
  - 그들의 경계는 서쪽으로 올라갔습니다
  - 경계가 서쪽으로 올라갔습니다
  lexicon: גְבוּלָם / לַיָּמָּה
  rationale: העית/경계의 이동을 자연스럽게 살리되, 방향 부사 לַיָּמָּה를 ‘서쪽으로’로 옮겨 POB의 의미를 직접 반영했습니다.
- source_word: וּמַרְעֲלָה
  english_pob_choice: Maralah
  chosen_korean: 마라라
  alternatives_korean:
  - 마랄라
  - 마라할라
  lexicon: 고유명사
  rationale: 현대 외래어 표기 기준에 맞춰 음역하되, 한국어 성경에서 지나치게 낯설지 않도록 간결한 음가를 택했습니다.
- source_word: וּפָגַע בְּדַבָּשֶׁת
  english_pob_choice: touched Dabbesheth
  chosen_korean: 다브셋에 닿고
  alternatives_korean:
  - 다브셋에 이르고
  - 다브셋을 맞닿고
  lexicon: פָגַע
  rationale: Pob의 ‘touched’를 따라 경계가 지명에 ‘닿다’는 경계 접촉의 뉘앙스를 유지했습니다.
- source_word: וּפָגַע אֶל הַנַּחַל
  english_pob_choice: and touched the wadi
  chosen_korean: 와디에 닿았습니다
  alternatives_korean:
  - 시내에 닿았습니다
  - 골짜기 물길에 닿았습니다
  lexicon: הַנַּחַל
  rationale: נַחַל은 건천/와디를 가리킬 수 있으므로, 지리적 의미를 살려 ‘와디’로 옮겼습니다.
