  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִי יִשְׁאָלְ/ךָ֩ הָ/עָ֨ם הַ/זֶּ֜ה אֽוֹ הַ/נָּבִ֤יא אֽוֹ כֹהֵן֙ לֵ/אמֹ֔ר מַה מַשָּׂ֖א יְהוָ֑ה וְ/אָמַרְתָּ֤ אֲלֵי/הֶם֙ אֶת מַה מַשָּׂ֔א וְ/נָטַשְׁתִּ֥י אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/033.yaml
  text: And when this people, or a prophet, or a priest asks you, saying, ‘What is the burden of the LORD?’ then you shall say to them, ‘You are the burden, and I will cast you off,’ declares the LORD.
translation:
  language: ko
  text: 이 백성이나 예언자나 제사장이 당신에게 “야훼의 신탁이 무엇입니까?” 하고 물으면, 당신은 그들에게 “무슨 신탁이냐? 내가 너희를 내버리겠다” 하고 말하십시오. 야훼의 말씀이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마싸(מַשָּׂא)는 ‘짐, 부담’을 뜻하며 예언적 ‘신탁’의 뜻으로도 쓰입니다. 응답의 “무슨 신탁이냐?”는 이 말의 이중 의미를 활용한 반문입니다. 히브리어 본문은 여기서 “너희가 그 짐이다”라고 하지 않고 “무슨 짐/신탁이냐?”라고 읽힙니다.
    reason: source_note
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: burden
  chosen_korean: 무게[부담]
  alternatives_korean:
  - 짐
  - 부담
  - 예언의 말씀
  lexicon: H7223
  rationale: 본문의 מַשָּׂא를 POB의 'burden'에 맞추되, 예언적 경고의 함의와 문자적 감각을 함께 보이기 위해 '무게[부담]'로 옮겼습니다. 이 절은 사람들이 '야훼의 무게'가 무엇인지 묻는 장면이므로, 전통적 완곡어인 '예언'으로 바꾸지 않았습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares the LORD
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼의 말입니다
  lexicon: H5002 / H3068
  rationale: נְאֻם은 단순한 서술이 아니라 권위 있는 신탁 공식을 나타내므로, 합쇼체 문맥에 맞게 '말씀이십니다'로 처리했습니다. YHWH는 프로젝트 기본값에 따라 야훼로 옮겼습니다.
theological_decisions:
- issue: ‘burden of the LORD’의 의미를 어떻게 드러낼 것인지
  chosen_reading: 사람들이 묻는 '야훼의 무게[부담]'를 그대로 유지하고, 이어지는 신탁에서 그들이 바로 '무게[부담]'라고 선언했습니다.
  alternative_readings:
  - '''야훼의 말씀''으로 완화'
  - '''예언'' 또는 ''경고''로 의역'
  rationale: 본문은 제사적·예언적 오용을 뒤집는 수사적 반전을 담고 있으므로, 질문 자체를 완화하지 않고 응답의 충격을 보존해야 합니다.
  doctrine_reference: 예언자적 심판 신탁의 수사와 문맥 보존
