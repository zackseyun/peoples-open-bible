  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
  footnotes:
  - marker: a
    text: Or “Sir, give me this water …”
    reason: alternative_reading
translation:
  language: ko
  text: 여자가 그에게 말하였다. 「주님[a], 이 물을 제게 주십시오. 제가 목마르지도 않고, 여기까지 와서 물을 긷지도 않게 해 주십시오。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님, 이 물을 제게 주십시오.” 헬라어 Κύριε는 단순한 정중 호칭인 ‘선생님’으로도 읽힐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 선생님
  - 주여
  lexicon: BDAG
  rationale: 'Πολύστιχο: κύριος는 존칭으로도 사용되지만 요한복음의 맥락에서 예수의 칭호 가능성을 남겨 두는 것이 중요합니다. 한국어 표준어로는 ''주님''을 기본으로 하고, 원문의 존칭적 대화 가능성은 각주로 보존합니다.'
- source_word: τοῦτο τὸ ὕδωρ
  english_pob_choice: this water
  chosen_korean: 이 물
  alternatives_korean:
  - 생명수
  - 이 물(샘물)
  lexicon: BDAG
  rationale: 그리스어에는 형용사 'living'이 반복되지 않으므로 본문에 없는 '생명'을 추가하지 않았습니다. 직역적·명시적 이해를 돕기 위해 '물'을 보충했습니다.
- source_word: δός μοι (imperative)
  english_pob_choice: give me
  chosen_korean: 제게 주십시오
  alternatives_korean:
  - 주오
  - 주시오
  lexicon: BDAG
  rationale: 화자가 예수에게 직접 요청하는 구문이므로 한국어에서 적절한 공손·경어 형태인 '-주십시오'를 사용해 원문의 명령법·경칭을 반영했습니다.
- source_word: ἀντλεῖν (with ἐνθάδε διέρχωμαι)
  english_pob_choice: come here to draw
  chosen_korean: 여기 와서 물을 길으러 오다
  alternatives_korean:
  - 물을 긷다
  - 물을 길다
  lexicon: BDAG
  rationale: ἁντλεῖν은 맥락상 '물을 긷다'를 의미하므로 영어 POB처럼 목적어 'water'를 한국어로 명시했습니다. διέρχωμαι·ἐνθάδε의 반복되는 현재적·반복적 뉘앙스는 '오다'로 자연스럽게 처리했습니다.
theological_decisions:
- issue: Rendering of Κύριε in the Samaritan woman's address (title vs. polite address)
  chosen_reading: 주님
  alternative_readings:
  - 선생님
  - 주여
  rationale: 요한복음에서는 κύριος가 신적·칭호적 함의를 가질 수 있으므로 본문에는 '주님'을 사용해 그 가능성을 보존했습니다. 그러나 일상적 존칭 '선생님/사랑하는 이'로 읽을 여지도 있으므로 그 대안은 각주로 제시합니다 (프로젝트의 ‘contested-terms’ 원칙).
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord; preserve tension'
- issue: Choice of Korean honorific for the imperative to Jesus
  chosen_reading: 제게 주십시오 (honorific imperative)
  alternative_readings:
  - 주오
  - 줘
  rationale: 예수께 직접 청하는 발화문 안이므로 한국어의 경어 규범에 따라 공손한 명령형을 사용했습니다. 이는 원문의 경칭·요청적 성격을 충실히 반영합니다.
  doctrine_reference: 'Korean style guide: direct address to Jesus uses honorific forms'
