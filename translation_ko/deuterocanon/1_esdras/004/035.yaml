  text: Is not the one who does these things great? And truth is great, and stronger than everything.
translation:
  language: ko
  text: 이런 일들을 하는 이가 위대하지 않습니까? 진리는 위대하며 모든 것보다 강합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχὶ μέγας ὃς ταῦτα ποιεῖ;
  english_pob_choice: Is not the one who does these things great?
  chosen_korean: 이런 일들을 행하시는 분이 크지 않으십니까?
  alternatives_korean:
  - 이런 일들을 하시는 분이 크지 않으십니까?
  - 이런 일들을 행하시는 분이 महान하지 않으십니까?
  lexicon: μέγας
  rationale: 주어를 인칭 대명사 '그'로 좁히지 않고, POB의 'the one who'에 맞춰 '행하시는 분'으로 옮겨 행위의 주체를 일반적·서술적으로 살렸습니다.
- source_word: ταῦτα ποιεῖ
  english_pob_choice: does these things
  chosen_korean: 이런 일들을 행하시는
  alternatives_korean:
  - 이런 일들을 하시는
  - 이런 것들을 행하시는
  lexicon: ποιέω
  rationale: ποιέω의 일반적 의미를 살려 '행하다'를 택했고, 대상은 문맥상 앞선 논지를 가리키는 '이런 일들'로 자연스럽게 표현했습니다.
- source_word: ἡ ἀλήθεια
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 진실
  - 참됨
  lexicon: ἀλήθεια
  rationale: 철학적·신학적 함의를 가진 명사이므로 '진리'가 가장 직접적이며, 문장 전체의 선언성을 보존합니다.
- source_word: ἰσχυροτέρα παρὰ πάντα
  english_pob_choice: stronger than everything
  chosen_korean: 모든 것보다 더 강합니다
  alternatives_korean:
  - 모든 것보다 강합니다
  - 만물보다 더 강합니다
  lexicon: ἰσχυρός
  rationale: 비교 구문 παρὰ πάντα를 자연스럽게 풀어 '보다 더 강합니다'로 옮겼고, POB의 'everything'을 따라 '모든 것'으로 포괄성을 유지했습니다.
theological_decisions:
- issue: 진리의 성격을 단순한 사실 진술이 아니라 서술적 선언으로 옮길지 여부
  chosen_reading: '''진리는 크며, 모든 것보다 더 강합니다''로 독립된 두 절의 선언으로 처리했습니다.'
  alternative_readings:
  - '''진리는 크고 모든 것보다 강합니다'''
  - '''진실은 위대하며 모든 것보다 강합니다'''
  rationale: 원문은 두 번째 절에서 ἡ ἀλήθεια를 주어로 재진술하며, '크다/강하다'의 병렬을 통해 진리의 우위성을 강조합니다. 이를 한국어에서도 분리된 선언으로 살려 수사적 힘을 유지했습니다.
  doctrine_reference: 일반적 진리론 / 지혜문학적 찬탄
- issue: 인칭 지시를 약화하여 보편적 진술로 번역할지 여부
  chosen_reading: '''이런 일들을 행하시는 분''으로 번역해 특정 인물을 지목하는 식의 직역을 피했습니다.'
  alternative_readings:
  - '''이런 일들을 하시는 이'''
  - '''그가 이런 일들을 행하십니까'''
  rationale: οὐχὶ μέγας ὃς 구조는 수사적 질문으로 일반적 찬탄을 형성하므로, 한국어에서도 보편적·찬탄적 어조를 유지하는 것이 적절합니다.
  doctrine_reference: 수사학 / 헬라어 의문문
