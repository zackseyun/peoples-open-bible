id: PRO.29.18
reference: Proverbs 29:18
source:
  edition: WLC
  text: בְּ/אֵ֣ין חָ֭זוֹן יִפָּ֣רַֽע עָ֑ם וְ/שֹׁמֵ֖ר תּוֹרָ֣ה אַשְׁרֵֽ/הוּ׃
translation:
  text: Where there is no prophetic revelation, the people run wild, but the one who keeps the law[a] is blessed.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'instruction.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֵין
  chosen: Where there is no
  alternatives:
  - In the absence of
  - Without
  lexicon: HALOT
  rationale: The preposition ב with אֵין forms a circumstantial expression meaning 'where/when there is no' or 'in the absence of.' 'Where there is no' is idiomatic English and fits the proverb's general condition-consequence structure.
- source_word: חָזוֹן
  chosen: revelation
  alternatives:
  - revelation
  - prophetic vision
  lexicon: HALOT
  rationale: The term denotes divine or prophetic revelation rather than human aspiration or planning.
- source_word: יִפָּרַע
  chosen: runs wild
  alternatives:
  - runs wild
  - is let loose
  - becomes ungoverned
  lexicon: HALOT
  rationale: This idiom conveys becoming unrestrained without importing the unsupported sense “perishes.”
- source_word: עָם
  chosen: a people
  alternatives:
  - the people
  - people
  lexicon: HALOT
  rationale: A singular collective used generically; English correspondingly uses singular “runs.”
- source_word: וְשֹׁמֵר
  chosen: but the one who keeps
  alternatives:
  - and whoever keeps
  - but whoever guards/observes
  lexicon: HALOT
  rationale: The participle marks a characteristic person. 'The one who keeps' is natural English and preserves the singular individual contrast with the collective first colon. The conjunction is rendered adversatively ('but') because the proverb contrasts two outcomes.
- source_word: תּוֹרָה
  chosen: the law
  alternatives:
  - instruction
  - teaching
  lexicon: HALOT
  rationale: תּוֹרָה can mean instruction broadly, but in wisdom literature it often carries covenantal and moral weight. 'The law' preserves that weight and matches the likely sense here, while 'instruction' is preserved as an alternative in a footnote.
- source_word: אַשְׁרֵהוּ
  chosen: is happy
  alternatives:
  - blessed is he
  - how happy he is
  lexicon: HALOT
  rationale: Natural English for the beatitude; “blessed” remains an honest alternative.
