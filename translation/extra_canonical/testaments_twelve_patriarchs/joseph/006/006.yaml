id: T12P.JOS.6.6
reference: Testament of Joseph 6:6
unit: verse
book: Testament of Joseph
collection: Testaments of the Twelve Patriarchs
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: |-
    Νῦν οὖν γνῶθι³⁴, ὅτι ὁ³⁵ Θεὸς *τοῦ πατρός³⁶ μου *δι’ ἀγγέλου αὐτοῦ³⁷ ἀπεκάλυψέ³⁸ μοι τὴν κακίαν σου³⁹, καὶ *ἐν τούτῳ ἐφύλαξα⁴⁰ αὐτὸ⁴¹ εἰς ἔλεγχόν σου, *εἴπως ἄρα⁴² ἰδοῦσα⁴³ μετανοήσεις⁴⁴.
  language: Greek
translation:
  text: Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and by this I preserved it as evidence against you, in hope that perhaps, seeing it, you might repent[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims.
    reason: lexical_alternative
