translation:
  text: 'Examine all the works in heaven, how they do not change their ways, and the lights in heaven: how they
    all rise and set, all ordered, each in its season, and do not transgress their order.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: This follows the selected Charles 1906 Ethiopic print on printed page 6 (PDF44), including its two source
      stars and parenthetical conjunction. The selected rising form is ይሠርቁ. Actual Dillmann 1865 columns 239-240
      support rising and 963-964 setting; 243-244 support ordering, 1041 season/time, 1011-1012 transgression, and
      715-716 the two negatives. Charles note 1 reports an emended opening and equates it with Greek κατανοήσατε;
      note 3 says the lost conjunction was supplied on Greek authority. Only those bounded edited inputs are adopted
      and recorded separately, not the facing Greek festival clause or an alternative ordering construction. The
      English preserves both negatives and the repeated all/each relation. This is a low-confidence edited-print
      treatment, not independent manuscript certification.
