  to: For seven days you shall offer a male goat as a sin offering each day, and the priests shall offer a bull from the herd and a ram from the flock, both without blemish.
  rationale: The lexical record rightly preserves the distinction between Ezekiel’s instruction and the priests’ performance, which remains explicit here. Its defense of 'son of the herd' concerned source transparency, so I use the natural expression already established in verse 19.
