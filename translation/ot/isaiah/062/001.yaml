  from: For Zion’s sake I will not keep silent[a], and for Jerusalem’s sake I will not be quiet[c][b], until her righteousness goes out like brightness and her salvation burns like a torch.
  to: For Zion’s sake I will not keep silent, and for Jerusalem’s sake I will not rest, until her righteousness[a] shines brightly and her salvation blazes like a torch.
  rationale: The earlier rationale rightly preserved the unidentified speaker and the breadth of “righteousness,” and I retain both. Its alternative “rest” better conveys the continuing activity of the speaker and the chapter’s repeated refusal to give rest.
