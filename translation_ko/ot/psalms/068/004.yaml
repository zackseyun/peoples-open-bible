  to: 하나님께 노래하십시오. 그분의 이름을 찬양하여 노래하십시오. 광야 평원들을 타고 가시는 분을 위하여 길을 닦으십시오.[a] 그분의 이름은 야입니다. 그분 앞에서 크게 기뻐하십시오.[b]
  rationale: 원문 WLC의 어순과 시적 명령 연쇄를 기준으로 본문을 전면 교체했습니다. סֹלּוּ는 기본적인 도로 조성의 비유를 살려 ‘길을 닦으십시오’로 옮겼고, 이 해석과 찬양의 뜻으로 보는 대안을 각주에 밝혔습니다. בָּעֲרָבוֹת는 ‘광야 평원들’로 번역하면서 ‘구름들’이라는 오래된 해석 가능성을 보존했습니다. יָהּ는 여호와의 짧은 형태이므로 ‘야’로 음역했습니다.
