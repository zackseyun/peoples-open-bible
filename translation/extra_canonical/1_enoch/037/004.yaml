  from: Until now, the wisdom I have received had not been given to me from the presence of the Lord of Spirits, as I considered, as the Lord of Spirits willed, from whom a share of eternal life was given to me.[a]
  to: Not until now was I given this wisdom from the presence of the Lord of Spirits. I received it according to my understanding[a] and the will of the Lord of Spirits, who has given me a share in eternal life.
