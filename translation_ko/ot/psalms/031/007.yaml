translation:
  language: ko
  text: 제가 주의 한결같은 사랑으로 기뻐하고 즐거워하겠습니다. 주께서 제 고난을 보셨고 제 영혼의 환난을 아셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 생명의 환난’ 또는 ‘제가 겪는 환난’. 히브리어 네페쉬는 문맥에 따라 ‘영혼’, ‘생명’, 또는 ‘자신’을 뜻할 수 있습니다.
