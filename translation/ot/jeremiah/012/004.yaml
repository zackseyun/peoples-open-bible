translation:
  text: How long will the land mourn and the grass of every field dry up? Because of the evil of those who live in it, beasts and birds are swept away, for they say, “He will not see what becomes of us[a].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “He” may refer to Yahweh, or to Jeremiah, whose enemies have threatened to kill him (11:19–21).
