translation:
  text: The Lord of the sheep summoned those first seven white men and ordered them to bring the stars before him, beginning with the first star that had gone ahead of those whose private parts were like those of horses—the first star that had gone out before them[a]. And they brought them before him.
  philosophy: dynamic
