  to: Joseph opened all the storehouses
  rationale: The Hebrew phrase 'אֶת כָּל אֲשֶׁר בָּהֶם' is an idiomatic ellipsis. The object of 'opened' (וַיִּפְתַּח) is the storehouses themselves, not their contents. The draft's literal rendering 'all that was in them' is confusing and nonsensical in English, as the pronoun 'them' has no antecedent. This forces reliance on a footnote to explain a basic action. Lexicons (e.g., HALOT under פתח; BDB under פתח) confirm the meaning is 'to open the granaries.' Translating the sense as 'all the storehouses' provides a clear and accurate rendering that aligns with the principle of optimal equivalence by resolving an awkward literalism.
