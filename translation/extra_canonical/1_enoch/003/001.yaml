translation:
  text: Examine and see all the trees, how they appear as though dry,[a] with all their foliage fallen, except for
    fourteen trees that do not shed their leaves.[b] But they remain from the old until the new comes—from two and
    from three years.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: “As though dry” describes how the trees appear; it does not say they were not dry. Dillmann cites Enoch
      3 under appearance or resemblance (column 298) and the dry participle (column 1071). The connective can also
      introduce what is perceived rather than a comparison. The surviving Greek text at this point supports the
      opening commands and “all the trees,” but breaks off before the drying clause.
  - marker: b
    reason: textual_variant
    text: Charles prints fourteen in the body; apparatus note 27 records variation in the count. Dillmann’s entry
      (columns 695–696) cites Enoch 3 both for the fallen or shed participle and for trees shedding their own leaves
      or being stripped of foliage. The translation follows the printed exception without identifying a species.
  - marker: c
    reason: lexical_alternative
    text: “The old” and “the new” likely refer to foliage, but the Ethiopic does not repeat a noun here. The closing
      words preserve two, three and both instances of “from”; it is unclear exactly how this time phrase attaches.
      The final noun can mean winter or rainy season, but Dillmann cites this passage under “year” (column 834).
      The wording does not resolve the phrase into a definite “for two or three years,” or supply a missing ending
      from another witness.
