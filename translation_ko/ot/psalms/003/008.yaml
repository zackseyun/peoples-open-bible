  naturalness: 수정문은 현대 표준어 합쇼체의 정중한 기도·고백 문체를 유지합니다. ‘당신의’는 야훼께 직접 말하는 히브리어 2인칭 소유접미사를 보존합니다.
  terminology: יהוה는 프로젝트 방침과 영어 POB에 맞추어 ‘야훼’로, יְשׁוּעָה는 ‘구원’으로, בְּרָכָה는 ‘복’으로 옮겼습니다. ‘셀라’는 뜻을 단정하지 않고 음역합니다.
