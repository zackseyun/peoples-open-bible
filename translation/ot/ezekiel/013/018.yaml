translation:
  text: 'Say, ‘The Lord Yahweh says: Woe to the women who sew magic bands[a] for every wrist and make head coverings for people of every height, to ensnare people! Will you ensnare my people while keeping yourselves alive[b]?'
  philosophy: dynamic
  footnotes:
