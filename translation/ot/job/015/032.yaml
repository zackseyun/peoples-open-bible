id: JOB.15.32
reference: Job 15:32
source:
  edition: WLC
  text: בְּֽ/לֹא י֭וֹמ/וֹ תִּמָּלֵ֑א וְ֝/כִפָּת֗/וֹ לֹ֣א רַעֲנָֽנָה־׃
translation:
  text: His return will come in full before his time[a], and his branch will not be green.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “it will be completed before his day”; the unstated subject probably refers to the “return” in verse 31.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֹא יוֹמוֹ
  chosen: before his time
  alternatives:
  - not in his day
  - before his day
  lexicon: HALOT
  rationale: The preposition ב with לֹא plus יוֹם in construct with the pronominal suffix yields the sense 'not in his day/time,' idiomatically 'before his time.' This fits the context of premature judgment better than a more wooden 'not in his day.'
- source_word: תִּמָּלֵא
  chosen: will be completed
  alternatives:
  - will be fulfilled
  - will be completed
  - will be cut off
  lexicon: HALOT
  rationale: Retains the completion/fullness sense without introducing payment language.
- source_word: כִפָּתוֹ
  chosen: his branch
  alternatives:
  - his palm branch
  - his crown
  - his top shoot
  lexicon: HALOT
  rationale: The noun likely denotes a branch, bough, or top shoot, fitting the vegetal imagery continued by 'stay green.' 'Palm branch' is too specific in English here, and 'crown' would shift the image away from plant life.
- source_word: לֹא רַעֲנָנָה
  chosen: will not be green
  alternatives:
  - will not be luxuriant
  - will not be fresh
  - will not flourish
  lexicon: HALOT
  rationale: Directly represents the branch's stated lack of freshness/greenness.
