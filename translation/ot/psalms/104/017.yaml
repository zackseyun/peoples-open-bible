  to: where the birds make their nests; the stork has its home in the conifers.[a]
  rationale: The tree term is uncertain enough that “conifers,” with an honest note, avoids a falsely precise species identification. The marker must accompany that term rather than “nests.” But בֵּיתָהּ is a verbless statement that the trees are the stork’s home; “has its home” is faithful and does not add the nest-building action implied by “makes its home.”
