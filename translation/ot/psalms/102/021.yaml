id: PSA.102.21
reference: Psalms 102:21
source:
  edition: WLC
  text: לְ/סַפֵּ֣ר בְּ֭/צִיּוֹן שֵׁ֣ם יְהוָ֑ה וּ֝/תְהִלָּת֗/וֹ בִּ/ירוּשָׁלִָֽם׃
translation:
  text: so that the name of Yahweh may be proclaimed in Zion and he may be praised in Jerusalem,
  philosophy: dynamic
lexical_decisions:
- source_word: לְסַפֵּר
  chosen: to declare
  alternatives:
  - to recount
  - to tell
  - to proclaim
  lexicon: HALOT
  rationale: The infinitive construct with ל expresses purpose/result in context ('to declare'). ספר in the piel commonly means to recount or tell, but here with 'the name of the LORD' it carries the sense of publicly declaring or proclaiming rather than merely narrating.
- source_word: בְּצִיּוֹן
  chosen: in Zion
  alternatives:
  - at Zion
  lexicon: HALOT
  rationale: The preposition ב is most naturally rendered 'in' with a place name here. 'Zion' is retained as the standard transliteration of the proper name.
- source_word: שֵׁם
  chosen: name
  lexicon: HALOT
  rationale: The Hebrew noun means 'name,' and in this context refers to the revealed identity/reputation of God. The literal rendering preserves the theological richness without paraphrasing it as 'renown' or 'fame' in the main text.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: וּתְהִלָּתוֹ
  chosen: and his praise
  alternatives:
  - and praise to him
  - and his renown
  lexicon: HALOT
  rationale: The noun תְּהִלָּה means 'praise,' with the 3ms suffix naturally rendered 'his.' The phrase is elliptical in Hebrew; 'his praise' is the most direct and idiomatic rendering, meaning praise directed to him or concerning him.
- source_word: בִּירוּשָׁלִָם
  chosen: in Jerusalem
  alternatives:
  - at Jerusalem
  lexicon: HALOT
  rationale: The preposition ב is best rendered 'in' with the city name. 'Jerusalem' is the standard English form of the proper name.
