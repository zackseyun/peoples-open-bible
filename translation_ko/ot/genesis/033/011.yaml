  to: “부디 당신께 가져온 이 제 예물을[a] 받아 주십시오. 하나님께서 제게 은혜를 베푸셨고, 제게는 모든 것이 있기 때문입니다.” 야곱이 에서에게 강권하니[b], 에서가 그것을 받았습니다.
  rationale: 문맥상 선물을 뜻하는 בִּרְכָה의 의미를 ‘예물’로 유지하되, 수동형 ‘당신께 가져온’을 자연스럽게 반영했습니다. 강한 권유를 뜻하는 וַיִּפְצַר를 ‘강권하니’로 바로잡고, 문맥상 명확한 인물 이름을 제시했습니다. 각주 표지는 해당 표현 뒤로 옮겼으며, 원문의 반복 대명사를 ‘긴박한 흐름’으로 해석하던 불필요한 주석은 제거했습니다.
