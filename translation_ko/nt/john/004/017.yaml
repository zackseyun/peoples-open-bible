  source_fidelity: ‘남편’은 다음 절의 혼인 문맥에 맞는 ἀνήρ의 적절한 번역입니다. 다만 예수께서 여자의 말을 평가하는 부분의 ‘잘 말씀하셨습니다’는 여성에게 존칭 선어말어미 ‘-셨-’를 부여하여 원문의 비표지 서술을 넘습니다.
  naturalness: ‘대답하여 그에게 말했습니다’는 현대 한국어에서 다소 중복적입니다. 또한 인용문 뒤의 콜론은 이 문맥에서 자연스럽지 않습니다. 간결한 서술과 ‘-라고 잘 말했습니다’ 구성이 현대 합쇼체에 자연스럽습니다.
  terminology: 예수의 발화에 ‘예수께서 ... 말씀하셨습니다’를 쓰는 것은 한국어 성경 문체에서 자연스럽습니다. 여자를 가리키는 ‘그 여자’와 결혼 관계를 뜻하는 ‘남편’도 적절합니다. ‘남편이 없습니다’는 한국어에서 이미 ‘I have no husband’의 자연스러운 대응이므로, 이를 ‘더 문자적’이라고 하는 각주 a는 실질적 대안을 제공하지 않습니다.
