  rationale: מִשְׁפָּט과 צִוִּיתָ의 결합을 ‘심판을 명하다’로 처리하여, 하나님이 판단을 정하셨다는 사법적·주권적 의미를 간결하게 드러냈습니다.
theological_decisions:
- issue: 하나님께 드리는 긴박한 명령형 기도어법의 보존
  chosen_reading: ‘일어나소서… 스스로 높아지소서… 깨어나소서’처럼 직접적 탄원형 명령을 유지했습니다.
  alternative_readings:
