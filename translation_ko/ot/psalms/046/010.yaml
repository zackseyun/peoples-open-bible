id: PSA.46.10
reference: Psalms 46:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַרְפּ֣וּ וּ֭/דְעוּ כִּי אָנֹכִ֣י אֱלֹהִ֑ים אָר֥וּם בַּ֝/גּוֹיִ֗ם אָר֥וּם בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/010.yaml
  text: Be still[a], and know that I am God. I will be exalted[b] among the nations; I will be exalted on earth[c].
  footnotes:
  - marker: a
    text: Or “Cease” or “Let go”; the Hebrew imperative can mean to slacken, stop, or release one's grip.
    reason: lexical_alternative
  - marker: b
    text: Or “I am exalted” or “I shall be lifted up”; the Hebrew form can be rendered with present or future force in context.
    reason: alternative_reading
  - marker: c
    text: Or “in the land”; the Hebrew word can mean “earth” or “land,” but the parallel with “among the nations” favors the worldwide sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그치십시오[a]. 그리고 내가 하나님인 줄 아십시오. 내가 민족들 가운데서 높임을 받을 것입니다. 내가 땅에서 높임을 받을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그만두십시오’, ‘손을 놓으십시오’. 히브리어 명령형은 느슨하게 하다, 멈추다, 붙잡은 것을 놓다는 뜻을 낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘높임을 받습니다’ 또는 ‘들려 높아질 것입니다’. 히브리어 형태는 문맥에 따라 현재적 또는 미래적 의미로 옮길 수 있습니다. ‘땅’은 ‘땅/나라’로도 옮길 수 있으나, 이 시편의 넓은 범위에서는 ‘땅’이 알맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁבִּית
  english_pob_choice: makes ... cease
  chosen_korean: 전쟁을 그치게 하십니다
  alternatives_korean:
  - 전쟁을 멈추게 하십니다
  - 전쟁을 끝내십니다
  lexicon: HALOT
  rationale: 히필 분사형의 사역 의미를 살려 ‘그치게 하다’로 옮겼습니다. 단순히 ‘멈추다’보다 원인의 주체성을 더 분명히 드러냅니다.
- source_word: עַד קְצֵה הָאָרֶץ
  english_pob_choice: to the end of the earth
  chosen_korean: 땅끝까지
  alternatives_korean:
  - 땅의 끝까지
  - 온 땅 끝까지
  lexicon: HALOT
  rationale: 히브리어의 범위를 자연스러운 한국어 관용으로 압축하되, 보편적 종결 범위를 유지했습니다.
- source_word: עֲגָלוֹת
  english_pob_choice: wagons
  chosen_korean: 수레
  alternatives_korean:
  - 마차
  - 전차
  lexicon: HALOT
  rationale: 어근상 ‘수레/화물수레’가 직접 뜻에 가깝기 때문에 본문에는 ‘수레’를 두고, 전통적 전쟁 문맥을 떠올리게 하는 ‘전차’는 본문에서 피했습니다.
- source_word: וְקִצֵּץ
  english_pob_choice: cuts the spear in two
  chosen_korean: 창을 둘로 자르시며
  alternatives_korean:
  - 창을 부러뜨리시며
  - 창을 잘라 부수시며
  lexicon: HALOT
  rationale: קצץ의 ‘자르다/끊다’ 의미를 살리되, 무기 파괴의 장면이 한국어에서 자연스럽게 들리도록 ‘둘로 자르다’로 옮겼습니다.
theological_decisions:
- issue: 전쟁 종결과 무기 파괴의 직접성
  chosen_reading: 하나님이 전쟁을 실제로 그치게 하시고 무기를 실제로 파괴하신다는 묘사로 유지했습니다.
  alternative_readings:
  - 비유적으로 평화를 주신다는 일반 진술로 완화
  - 정치적 이상에 대한 선언으로 추상화
  rationale: 시편의 시적 표현을 약화시키지 않고, 원문의 강한 종결·파괴 이미지를 그대로 전달하는 편이 본문 의도에 더 충실합니다.
  doctrine_reference: 시편 46편의 하나님의 주권과 평화 주도권
