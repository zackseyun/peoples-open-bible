- from: 이것이 우리가 이집트에서 당신에게 말한 바로 그 말이 아닙니까? ‘우리를 내버려 두어 우리가 이집트 사람들을 섬기게 하십시오.’ 이집트 사람들을 섬기는 것이 광야에서 죽는 것보다 우리에게는 더 낫겠습니다.
  to: 이것이 우리가 이집트에서 모세에게 말한 바로 그 말이 아닙니까? ‘우리를 내버려 두고 우리가 이집트 사람들을 섬기게 하십시오.’ 이집트 사람들을 섬기는 것이 광야에서 죽는 것보다 우리에게는 더 나았을 것입니다.
