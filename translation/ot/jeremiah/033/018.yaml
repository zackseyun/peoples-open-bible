id: JER.33.18
reference: Jeremiah 33:18
source:
  edition: WLC
  text: וְ/לַ/כֹּהֲנִים֙ הַ/לְוִיִּ֔ם לֹֽא יִכָּרֵ֥ת אִ֖ישׁ מִ/לְּ/פָנָ֑/י מַעֲלֶ֨ה עוֹלָ֜ה וּ/מַקְטִ֥יר מִנְחָ֛ה וְ/עֹ֥שֶׂה זֶּ֖בַח כָּל הַ/יָּמִֽים־־־׃ס
translation:
  text: And the Levitical priests will never lack a man before me to offer burnt offerings, burn grain offerings, and offer sacrifices continually.
  philosophy: dynamic
lexical_decisions:
- source_word: וְלַכֹּהֲנִים הַלְוִיִּם
  chosen: And the Levitical priests
  alternatives:
  - And for the Levitical priests
  lexicon: HALOT
  rationale: The priests are the topic and beneficiary of the promise; English does not need to reproduce the prefixed preposition separately.
- source_word: לֹא יִכָּרֵת אִישׁ
  chosen: will never lack a man
  alternatives:
  - a man will never be lacking
  - a man shall not be cut off
  lexicon: HALOT
  rationale: In this idiom the priestly group is promised that it will not be without a serving representative, rather than that one individual cannot be cut off.
- source_word: מִלְּפָנַי
  chosen: before me
  alternatives:
  - from before me
  lexicon: HALOT
  rationale: The phrase describes priestly service in God's presence. English 'before me' conveys the location directly.
- source_word: מַעֲלֶה עוֹלָה
  chosen: to offer burnt offerings
  alternatives:
  - one who offers a burnt offering
  lexicon: HALOT
  rationale: After 'lack a man,' an infinitive expresses the serving representative's function naturally while retaining the participial sense.
- source_word: וּמַקְטִיר מִנְחָה
  chosen: burn grain offerings
  alternatives:
  - offer grain offerings
  - one who burns a grain offering
  lexicon: HALOT
  rationale: The participle describes causing the grain offering to smoke on the altar. The infinitive continues the English series.
- source_word: וְעֹשֶׂה זֶּבַח
  chosen: and make sacrifices
  alternatives:
  - and offer sacrifices
  - and make sacrifice
  lexicon: HALOT
  rationale: The generic sacrificial phrase is naturally plural in English and completes the parallel infinitive series.
- source_word: כָּל הַיָּמִים
  chosen: continually
  alternatives:
  - all the days
  - always
  lexicon: HALOT
  rationale: The idiom promises ongoing priestly service. 'Continually' preserves the durative force without a wooden temporal phrase.
