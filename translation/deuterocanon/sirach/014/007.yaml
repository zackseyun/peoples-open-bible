translation:
  text: Even if he does good, he does it by mistake[a]; in the end he reveals his evil.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'in forgetfulness.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν
  chosen: Even if
  alternatives:
  - and if
  - although if
  lexicon: LSJ
  rationale: Contraction of καὶ ἐάν introducing a concessive condition; 'Even if' best captures the force in natural English.
- source_word: εὖ ποιῇ
  chosen: does good
  alternatives:
  - acts well
  - does what is good
  lexicon: LSJ
  rationale: The idiom εὖ ποιέω commonly means to do good or act beneficently. 'Does good' is concise and idiomatic.
- source_word: ἐν λήθῃ
  chosen: in forgetfulness
  alternatives:
  - forgetfully
  - as though forgotten
  - without remembering
  lexicon: LSJ
  rationale: Literally 'in forgetfulness/oblivion.' The phrase is somewhat unusual; retaining 'in forgetfulness' preserves the metaphorical texture and leaves open whether the sense is careless, unmindful, or done so as to be forgotten.
- source_word: ποιεῖ
  chosen: he does it
  alternatives:
  - he acts
  - he performs it
  lexicon: LSJ
  rationale: The repeated verb links the clauses. Supplying 'it' in English makes the object implicit from the previous clause and keeps the repetition intelligible.
- source_word: ἐπʼ ἐσχάτων
  chosen: in the end
  alternatives:
  - at the last
  - ultimately
  lexicon: LSJ
  rationale: Temporal idiom meaning at the end or finally. 'In the end' is natural modern English while preserving the temporal sense.
- source_word: ἐκφαίνει
  chosen: reveals
  alternatives:
  - shows forth
  - displays
  - brings to light
  lexicon: LSJ
  rationale: The verb means to bring to light or make manifest. 'Reveals' is clear and fits the moral exposure in context.
- source_word: τὴν κακίαν αὐτοῦ
  chosen: his evil
  alternatives:
  - his wickedness
  - his malice
  - his bad character
  lexicon: LSJ
  rationale: κακία can denote evil, wickedness, or malice. 'His evil' is broad enough to cover moral badness without narrowing the sense to spite alone.
