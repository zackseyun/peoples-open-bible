id: JOB.34.36
reference: Job 34:36
source:
  edition: WLC
  text: אָבִ֗י יִבָּחֵ֣ן אִיּ֣וֹב עַד נֶ֑צַח עַל תְּ֝שֻׁבֹ֗ת בְּ/אַנְשֵׁי אָֽוֶן־־־׃
translation:
  text: Oh[a], let Job be tested to the limit[b] because of his answers like those of wicked men[c].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'The Masoretic Hebrew reads “my father,” but the difficult opening is commonly understood as an expression of a wish: “Oh” or “Would that.”'
    reason: lexical_alternative
  - marker: b
    text: Literally, “forever”; here the phrase likely expresses testing carried through to the utmost.
    reason: lexical_alternative
  - marker: c
    text: Or, “because of his answers among wicked men.” The Hebrew may express comparison or association.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִי
  chosen: Oh
  alternatives:
  - O my father
  - Would that my father
  lexicon: HALOT
  rationale: The context and difficult expression favor an optative exclamation; the literal Masoretic vocalization is documented in a note.
- source_word: יִבָּחֵן
  chosen: let ... be tested
  alternatives:
  - may ... be examined
  - will ... be tested
  lexicon: HALOT
  rationale: The Niphal imperfect of בחן carries the sense 'be tested/examined.' Given the surrounding wish-like force of the clause, an English jussive 'let ... be tested' best represents the sense.
- source_word: עַד נֶצַח
  chosen: to the limit
  alternatives:
  - forever
  - without end
  - completely
  lexicon: HALOT
  rationale: The rendering expresses the likely intensive force, with the literal temporal sense noted.
- source_word: עַל
  chosen: because of
  alternatives:
  - for
  - on account of
  - concerning
  lexicon: HALOT
  rationale: 'Here עַל introduces the ground or reason for the wish: Job should be tested because of something, namely his responses.'
- source_word: תְּשֻׁבוֹת
  chosen: answers
  alternatives:
  - replies
  - responses
  lexicon: HALOT
  rationale: The noun denotes answers or replies. 'Answers' is concise and fits the disputational setting.
- source_word: בְּאַנְשֵׁי אָוֶן
  chosen: like those of wicked men
  alternatives:
  - with men of iniquity
  - like wicked men
  lexicon: HALOT
  rationale: This gives the comparative construal in grammatical English without comparing replies directly to men.
