id: NUM.13.22
reference: Numbers 13:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ בַ/נֶּגֶב֮ וַ/יָּבֹ֣א עַד חֶבְרוֹן֒ וְ/שָׁ֤ם אֲחִימַן֙ שֵׁשַׁ֣י וְ/תַלְמַ֔י יְלִידֵ֖י הָ/עֲנָ֑ק וְ/חֶבְר֗וֹן שֶׁ֤בַע שָׁנִים֙ נִבְנְתָ֔ה לִ/פְנֵ֖י צֹ֥עַן מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: ko
  text: 그들은 네겝으로 올라가, 그가 헤브론까지 이르렀습니다. 거기에는 아낙의 자손인 아히만, 세새, 달매가 있었습니다. 헤브론은 이집트의 소안보다 일곱 해 앞서 세워졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲל֣וּ בַ/נֶּגֶב
  english_pob_choice: They went up into the Negev
  chosen_korean: 그들은 네겝으로 올라가
  alternatives_korean:
  - 그들은 남쪽 광야로 올라가
  - 그들은 네겝 땅으로 올라가
  lexicon: 네겝
  rationale: נֶגֶב는 지리명으로서 ‘네겝’을 유지하는 것이 원문 지시를 가장 직접적으로 보존합니다.
- source_word: וַ/יָּבֹ֣א עַד חֶבְרוֹן
  english_pob_choice: and he came as far as Hebron
  chosen_korean: 헤브론에 이르렀습니다
  alternatives_korean:
  - 그는 헤브론까지 갔습니다
  - 그가 헤브론에까지 이르렀습니다
  lexicon: 이르다
  rationale: 히브리어 단수 동사와 POB의 ‘he came’에 맞추어, 탐사 보고 속 한 사람의 도달을 자연스러운 한국어로 옮겼습니다.
- source_word: יְלִידֵ֖י הָ/עֲנָ֑ק
  english_pob_choice: the descendants of Anak
  chosen_korean: 아낙의 자손인
  alternatives_korean:
  - 아낙의 후손인
  - 아낙에게서 난
  lexicon: 자손
  rationale: יְלִידֵי는 출생/혈통 관계를 가리키므로, POB의 ‘descendants’를 살려 ‘자손’으로 옮겼습니다.
- source_word: שֶׁ֤בַע שָׁנִים֙ נִבְנְתָ֔ה
  english_pob_choice: had been built seven years before
  chosen_korean: 일곱 해 먼저 세워졌습니다
  alternatives_korean:
  - 일곱 해 전에 세워졌습니다
  - 일곱 해 앞서 건축되었습니다
  lexicon: 세워지다
  rationale: נִבְנְתָה는 수동으로 ‘세워지다/건축되다’의 뜻이므로, 간결하면서도 연대 비교를 분명히 하는 표현을 택했습니다.
- source_word: צֹ֥עַן מִצְרָֽיִם
  english_pob_choice: Zoan of Egypt
  chosen_korean: 이집트의 소안
  alternatives_korean:
  - 이집트의 조안
  - 애굽의 소안
  lexicon: 소안
  rationale: 고유명사 צֹעַן은 한국어 성서에서 통용되는 ‘소안’을 사용하고, 지명 관계를 분명히 하기 위해 ‘이집트의’로 옮겼습니다.
theological_decisions:
- issue: 문맥상의 주어 전환
  chosen_reading: 한국어에서는 ‘그들은… 헤브론에 이르렀습니다’로 시작해 이후 인물 열거를 자연스럽게 연결했습니다.
  alternative_readings:
  - ‘그가 헤브론에 이르렀습니다’로 단수 주어를 전면에 둘 수 있음
  rationale: 히브리어 본문은 복수 동사 뒤에 단수 동사가 이어지는 특이한 구조를 가지므로, 한국어에서는 의미를 훼손하지 않으면서 탐사 보고의 초점을 유지하는 방식으로 매끈하게 처리했습니다.
  doctrine_reference: 서술 관찰의 문법 처리
- issue: ‘헤브론은… 세워졌습니다’의 수동 표현
  chosen_reading: 수동을 유지해 도시의 기원/선행성을 객관적으로 진술했습니다.
  alternative_readings:
  - 능동으로 풀어 ‘사람들이 헤브론을… 세웠습니다’로 옮길 수 있음
  rationale: 원문은 도시의 건립 시기를 비교하는 객관적 진술이므로, 주체를 덧붙이지 않고 수동을 살리는 편이 원문에 더 가깝습니다.
  doctrine_reference: 서술 문체 보존
