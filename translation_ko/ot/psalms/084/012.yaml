translation:
  language: ko
  text: 만군의 야훼여, 주님을 신뢰하는 사람은 복이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘행복합니다’ 또는 ‘복됩니다’.
