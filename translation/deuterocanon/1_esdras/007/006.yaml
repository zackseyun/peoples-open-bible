translation:
  text: And the sons of Israel, and the priests, and the Levites, and the rest from
    the captivity[a] who had been added[b], did according to what is in the book of
    Moses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'from the exile' for 'from the captivity'.
    reason: lexical_alternative
  - marker: b
    text: 'Or, idiomatically, ''who had joined them.'' Greek: ''who had been added'';
      it does not explicitly state the agent or to whom they were added.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  chosen: the sons of Israel
  alternatives:
  - the Israelites
  - the children of Israel
  lexicon: LSJ
  rationale: A formally close rendering preserves the stock biblical expression. Although
    'Israelites' is smoother modern English, 'sons of Israel' reflects the Greek wording
    and keeps continuity with the traditional ethnic-covenantal designation.
- source_word: οἱ λοιποί
  chosen: the rest
  alternatives:
  - the remainder
  - the others
  lexicon: LSJ
  rationale: '''The rest'' is the most natural concise rendering for the substantival
    adjective here, distinguishing this group from priests and Levites already named.'
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  chosen: from the captivity
  alternatives:
  - from the exile
  - of the captivity
  lexicon: LSJ
  rationale: The Greek literally refers to those associated with the captivity/exile.
    'From the captivity' stays close to the wording, while the sense is effectively
    'from the exile.' The alternative is preserved because modern readers may find
    it clearer.
- source_word: οἱ προστεθέντες
  chosen: who had been added
  alternatives:
  - who had been joined
  - who had joined them
  lexicon: LSJ, s.v. προστίθημι (Perseus/Scaife ATLAS; consulted 2026-10-19)
  rationale: The checked printed word is an aorist passive participle of προστίθημι.
    The entry's addition sense supports added; its joining uses help explain the idiomatic
    alternative but do not turn this passive into an explicit active return verb.
    The agent and the complement of added are not stated. Prefer the close passive
    provisionally, with the joined formulation in a note; do not identify a precise
    admission event or infer a Hebrew Vorlage.
- source_word: ἀκολούθως
  chosen: according to
  alternatives:
  - according to this
  - in accordance
  - following
  lexicon: LSJ
  rationale: Together with the following dative phrase, the adverb expresses conformity
    to the Mosaic-book standard. Match the existing main English according to rather
    than the stale chosen field accordingly; no change to the main clause is needed.
- source_word: τοῖς ἐν τῇ Μωσέως βίβλῳ
  chosen: what is in the book of Moses
  alternatives:
  - according to the things in the book of Moses
  - to the prescriptions in the book of Moses
  lexicon: LSJ
  rationale: The phrase supplies the standard governed by according to in the main
    wording. Retain book rather than inserting an unexpressed law noun.
