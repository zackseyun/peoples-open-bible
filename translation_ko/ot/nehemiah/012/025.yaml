revisions:
- from: 맛다냐와 박부기야와 오바댜와 메술람과 달몬과 악굽은 문고에서 지키는 자들, 곧 문지기들이었으며, 창고들에서 경계하고 있었습니다.
  to: 맛다냐와 박부기야와 오바댜와 므술람과 달몬과 악굽은 파수꾼들, 곧 문지기들이었으며, 성문들의 창고에서 파수 임무를 맡고 있었습니다.
  rationale: 원문의 직능 병치(‘파수꾼들, 곧 문지기들’)와 성문에 속한 창고라는 장소 정보를 모두 보존했습니다. ‘파수 임무를 맡고 있었습니다’는 명사 מִשְׁמָר를 현대 합쇼체 문장 안에서 자연스럽게 풀어낸 표현입니다.
