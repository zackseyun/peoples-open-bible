translation:
  text: But we threatened these men more severely for what they had done and, in keeping with our clemency toward everyone, spared their lives only with difficulty. We recognized that the God of heaven had certainly defended the Jews.
  philosophy: dynamic
lexical_decisions:
- source_word: σκληρότερον
  lemma: σκληρός
  chosen: more harshly
  alternatives:
  - more severely
  - more sternly
  lexicon: LSJ
  rationale: Comparative adverb from σκληρός; in context of threats, 'more harshly' conveys increased severity without overformal diction.
- source_word: διαπειλησάμενοι
  chosen: after threatening
  alternatives:
  - having threatened strongly
  - after issuing threats
  lexicon: LSJ
  rationale: Aorist middle participle indicating prior action; the compound verb intensifies the act of threatening. 'After threatening' is natural English and keeps the sequence clear.
- source_word: ἐπιείκειαν
  chosen: clemency
  alternatives:
  - gentleness
  - forbearance
  - leniency
  lexicon: LSJ
  rationale: The term denotes fairness, mildness, or lenient restraint. 'Clemency' fits the royal-administrative context, especially alongside sparing lives.
- source_word: μόγις
  chosen: scarcely
  alternatives:
  - barely
  - with difficulty
  lexicon: LSJ
  rationale: Marks reluctance or narrow concession. 'Scarcely granted them their lives' communicates that they were only just spared.
- source_word: τὸ ζῆν αὐτοῖς χαρισάμενοι
  chosen: granted them their lives
  alternatives:
  - graciously granted them to live
  - spared their lives
  lexicon: LSJ
  rationale: Idiomatic expression meaning to grant continued life. 'Granted them their lives' stays close to the Greek while remaining readable; 'spared their lives' is possible but slightly more interpretive.
- source_word: ἐπουράνιον θεόν
  chosen: the heavenly God
  alternatives:
  - the God of heaven
  - the heavenly deity
  lexicon: LSJ
  rationale: Literally 'heavenly God.' 'The God of heaven' is idiomatic, but 'the heavenly God' preserves the adjectival form of the Greek and the elevated tone.
- source_word: ἐγνωκότες
  chosen: recognizing
  alternatives:
  - having come to know
  - knowing
  lexicon: LSJ
  rationale: Perfect participle indicating settled recognition based on experience. 'Recognizing' captures the inferential sense in context.
- source_word: ἀσφαλῶς
  chosen: surely
  alternatives:
  - securely
  - certainly
  lexicon: LSJ
  rationale: Adverb here modifies the certainty/effectiveness of divine protection. 'Surely' reads naturally in English and reflects confidence rather than physical security alone.
- source_word: ὑπερησπικότα
  chosen: had surely defended
  alternatives:
  - had strongly protected
  - had come to the defense of
  lexicon: LSJ
  rationale: Perfect active participle of a compound verb meaning to shield or defend on behalf of. 'Defended' is concise and suits the retrospective acknowledgment of divine intervention.
