  source_fidelity: 수정이 필요합니다. οὐ ... βιούντων은 현재의 일반적 삶의 방식을 가리키는데, 초안의 ‘살지 않았던’은 과거형으로 바꾸어 원문의 시제를 벗어납니다. 또한 μετὰ εὐλογιστίας는 ‘복된 삶’이라는 명사구로도 뜻은 전달되나, ‘복되이 살다’가 원문의 ‘복됨을 지니고 살다’라는 방식·상태를 더 직접적으로 반영합니다.
  naturalness: ‘그러나 당신은 우리의 철학을 조롱하십니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘그 안에서 복되이 살지 않는 것처럼’은 ‘그 안에서 복된 삶을 살지 않았던 것처럼’보다 시제와 표현 모두 자연스럽습니다.
  terminology: ‘철학’은 φιλοσοφία의 저자 고유의 범주화를 보존하는 적절한 번역입니다. εὐλογιστία는 희귀어여서 ‘복되이’로 본문에 절제하여 옮기고, 행복 및 좋은 평판의 가능성은 각주로 남기는 것이 타당합니다. 각주는 관련 어구인 ‘복되이’ 뒤에 두어야 합니다.
