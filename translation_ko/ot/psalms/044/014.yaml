  yaml_path: translation/ot/psalms/044/014.yaml
  text: You make us a byword among the nations[b], a shaking of the head among the peoples.[a]
  footnotes:
  - marker: a
    text: A gesture of mockery or contempt.
    reason: cultural_note
  - marker: b
    text: Or “a proverb.” The Hebrew can denote a proverbial saying or a byword of scorn.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 우리를 나라들 가운데서 속담으로 삼으시고, 백성들 가운데서 고개를 흔드는 대상이 되게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  english_pob_choice: You make us
  chosen_korean: 주님께서는 우리를 … 되게 하셨습니다
  alternatives_korean:
  - 주님께서는 우리를 … 삼으셨습니다
  - 주님께서는 우리를 … 만드셨습니다
  lexicon: HALOT
  rationale: שׂים의 ‘두다, 세우다, 만들다’라는 결과적/사역적 의미를 한국어에서는 ‘되게 하셨습니다’로 자연스럽게 옮겨, 하나님께서 직접 그렇게 만드신다는 뉘앙스를 살렸습니다.
- source_word: מָשָׁל
  english_pob_choice: a proverb
  chosen_korean: 속담
  alternatives_korean:
  - 우화
  - 비유
  - 속담 같은 말
  lexicon: HALOT
  rationale: 이 문맥의 מָשָׁל은 지혜문학적 ‘잠언’보다 조롱거리가 된 ‘속담/우화’ 쪽에 가깝기 때문에, 현대 한국어에서 경멸적 반복 употреб보다 자연스러운 ‘속담’으로 옮겼습니다.
- source_word: מְנוֹד רֹאשׁ
  english_pob_choice: a shaking of the head
  chosen_korean: 고개를 흔드는 대상
  alternatives_korean:
  - 머리를 흔드는 것
  - 머리를 저음
  - 조롱의 고개짓
  lexicon: HALOT
  rationale: 직역하면 ‘머리의 흔듦’이지만, 한국어에서는 관용적으로 ‘고개를 흔들다’가 자연스럽고 조롱의 몸짓도 잘 드러내므로 이미지와 기능을 함께 살렸습니다.
- source_word: בַּגּוֹיִם / בַּל אֻמִּים
  english_pob_choice: among the nations / among the peoples
  chosen_korean: 나라들 가운데서 / 백성들 가운데서
  alternatives_korean:
  - 민족들 가운데서
  - 열방 가운데서
  lexicon: HALOT
  rationale: 두 병행구를 모두 살리기 위해 ‘나라들’과 ‘백성들’을 나란히 두었고, 후자는 시적 병행을 유지하면서도 ‘열방’보다 덜 교회적·후대적 표현으로 처리했습니다.
theological_decisions:
- issue: 시편 탄원의 과거형 진술을 한국어에서 어떻게 표지할지
  chosen_reading: ‘만드셨습니다’의 과거형으로 하나님의 실제 행위를 서술했습니다.
  alternative_readings:
  - 현재형 ‘만드십니다’
  - 완료 뉘앙스를 약화한 ‘되게 하십니다’
  rationale: 본문은 공동체가 겪은 실제 수치를 회고하며 하나님께 호소하는 탄원문이므로, 한국어에서도 과거 서술로 번역해 사건의 현실성과 탄원의 긴박함을 유지했습니다.
  doctrine_reference: 시편의 탄원시 어법
