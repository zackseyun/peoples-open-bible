  text: The guests in my house and my female servants count me as a stranger; I have become a foreigner in their eyes.
translation:
  language: ko
  text: 제 집의 손님들[a]과 제 여종들이 저를 낯선 사람[b]으로 여기며, 저는 그들의 눈에 타인[c]이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손님들’은 히브리어 גָּרֵי בֵיתִי를 영어 POB의 ‘guests’를 따라 옮긴 것입니다. 이 말은 집에 머물거나 기거하는 이들을 가리킬 수도 있습니다.
    reason: source_note
  - marker: b
    text: ‘낯선 사람’은 לְזָר의 관계적 소외를 살린 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘타인’은 נָכְרִי가 문맥에서 나타내는 낯섦과 관계적 거리감을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּרֵי בֵיתִי
  english_pob_choice: The guests in my house
  chosen_korean: 제 집의 손님들
  alternatives_korean:
  - 제 집의 나그네들
  - 제 집에 머무는 사람들
  lexicon: גָּרִים/גָּרֵי + בַּיִת
  rationale: English POB가 'guests'로 확정했으므로, הבית의 거주·체류 뉘앙스를 살리되 현대 한국어에서는 가장 자연스러운 '손님들'로 옮겼습니다.
- source_word: וְאַמְהֹתַי
  english_pob_choice: and my female servants
  chosen_korean: 제 여종들이
  alternatives_korean:
  - 제 여자 종들이
  - 제 하녀들이
  lexicon: אָמָה
  rationale: אָמָה는 여종을 가리키므로 성별을 드러내는 '여종'을 택하고, 고전적이지만 직역성을 해치지 않는 표현으로 정리했습니다.
- source_word: לְזָר תַּחְשְׁבֻנִי
  english_pob_choice: count me as a stranger
  chosen_korean: 저를 낯선 사람으로 여깁니다
  alternatives_korean:
  - 저를 외국인으로 여깁니다
  - 저를 이방인으로 여깁니다
  lexicon: זָר + חשב
  rationale: זָר는 관계적으로 '낯선/이질적인 사람'을 뜻하므로, 민족적·신학적 색채가 강한 '이방인'보다 직접적 상황 의미인 '낯선 사람'을 선택했습니다.
- source_word: נָכְרִי הָיִיתִי
  english_pob_choice: I have become a foreigner
  chosen_korean: 저는 ... 타인이 되었습니다
  alternatives_korean:
  - 저는 ... 외국인이 되었습니다
  - 저는 ... 낯선 사람이 되었습니다
  lexicon: נָכְרִי
  rationale: נָכְרִי는 '외국인'도 가능하지만, 본절의 상호소외와 거리감을 반영해 '타인'으로 옮겨 관계적 소외를 부각했습니다.
theological_decisions:
- issue: 본문의 사회적 소외 표현을 민족·종교적 '이방인'으로 과도하게 확대할지 여부
  chosen_reading: 가사 내 관계가 끊어진 상태를 말하는 사회적 소외로 읽고, '낯선 사람'과 '타인'으로 번역했습니다.
  alternative_readings:
  - '''이방인''으로 번역해 더 강한 성경적 대조를 드러내는 읽기'
  - '''외국인''으로 옮겨 사회적 타자성을 강조하는 읽기'
  rationale: 히브리어 어휘는 민족 분류보다 관계적 소외를 우선하며, 이 절의 문맥은 가족·집안 안에서조차 인정받지 못하는 수치를 드러냅니다.
  doctrine_reference: 문맥 우선 원칙과 어휘의 1차 의미
