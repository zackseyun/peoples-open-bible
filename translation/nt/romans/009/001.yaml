  rationale: In Pauline usage, 'Holy Spirit' is the most natural reading, and the solemn truth-claim is grounded in divine corroboration rather than merely subjective sincerity. The capitalization reflects this interpretive judgment while preserving the Greek preposition 'in.'
  doctrine_reference: Nicene Creed affirmation of the Holy Spirit as divine person; translation aims not to flatten explicit or probable references to the Spirit.
