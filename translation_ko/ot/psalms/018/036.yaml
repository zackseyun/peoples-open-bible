translation:
  language: ko
  text: 주께서 제 아래에서 제 걸음을 넓혀 주셨고, 제 발목이 비틀거리지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָגֵן יִשְׁעֶךָ
  english_pob_choice: the shield of your salvation
  chosen_korean: 주의 구원의 방패
  alternatives_korean:
  - 주의 구원 방패
  - 주의 구원하시는 방패
  lexicon: HALOT
  rationale: מָגֵן은 기본적으로 ‘방패’이고, יִשְׁעֶךָ는 ‘주의 구원/구출’의 소유격 구조이므로, 시적 이미지를 살려 직역에 가깝게 옮겼습니다.
- source_word: וִימִינְךָ
  english_pob_choice: your right hand
  chosen_korean: 주의 오른손
  alternatives_korean:
  - 주의 오른편 손
  - 주의 오른손과
  lexicon: HALOT
  rationale: 히브리어의 ‘오른손’은 능력과 적극적 도움의 표상으로, 한국어에서도 관용적으로 자연스러운 ‘오른손’을 유지했습니다.
- source_word: תִסְעָדֵנִי
  english_pob_choice: supported me
  chosen_korean: 저를 붙드셨고
  alternatives_korean:
  - 저를 도우셨고
  - 저를 받치셨고
  - 저를 붙들어 주셨고
  lexicon: HALOT
  rationale: סעד는 ‘지탱하다, 받치다, 붙들어 주다’의 뜻이므로, 시편 문맥에서 하나님의 실제적 도움을 선명하게 드러내는 ‘붙드셨고’를 선택했습니다.
- source_word: וְעַנְוַתְךָ
  english_pob_choice: your humility
  chosen_korean: 주의 겸손
  alternatives_korean:
  - 주의 온유
  - 주의 온순함
  - 주의 자비로운 낮아지심
  lexicon: HALOT
  rationale: עוָנָה/עַנְוָה는 ‘겸손, 온유, 낮아짐’의 폭을 가지며, 본문이 하나님께 이 특성을 돌리는 긴장을 살리기 위해 ‘주의 겸손’을 본문에 유지했습니다.
theological_decisions:
- issue: 하나님께 ‘겸손’이 귀속되는 표현의 처리
  chosen_reading: 주의 겸손이 저를 크게 하셨습니다
  alternative_readings:
  - 주의 온유가 저를 크게 하셨습니다
  - 주의 자비로운 낮아지심이 저를 크게 하셨습니다
  rationale: 원문은 하나님이 낮아져 돕는 놀라운 긴장을 담고 있으므로, 이를 완화하지 않고 본문에 남겼습니다. 전통적 완곡어인 ‘온유’는 뜻을 덜 직접적으로 드러내므로 대안으로만 남겼습니다.
  doctrine_reference: 원문 우선 번역 원칙; 신학적 긴장 보존
