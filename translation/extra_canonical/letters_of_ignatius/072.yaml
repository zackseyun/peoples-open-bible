source:
  text: |-
    I therefore did my own part, as a man composed unto union. But where there is division and anger, there God abideth not. Now the Lord forgiveth all men when they repent, if repenting they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who shall strike off every fetter from you; and I entreat you,

    Do ye nothing in a spirit of factiousness but after the teaching of Christ. For I heard certain persons saying, If I find it not in the charters, I believe it not in the Gospel. And when I said to them, It is written, they answered me That is the question. But as for me, my charter is Jesus Christ, the inviolable charter is His cross and His death and His resurrection, and faith through Him; wherein I desire to be justified through your prayers.
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
