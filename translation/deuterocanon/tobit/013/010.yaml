translation:
  text: Give thanks to the Lord as he deserves, and bless the King of the ages, so that his sanctuary[a] may be rebuilt for you with joy, and so that within you he may bring joy to the captives and show love to the afflicted for all generations to come.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “his tent,” referring here to God's temple in Jerusalem.
    reason: lexical_alternative
