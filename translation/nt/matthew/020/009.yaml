  from: And those who came about the eleventh hour received a denarius each[a].
  to: And when those hired about the eleventh hour came, they received a denarius each[a].
  rationale: The draft treats the anarthrous circumstantial participle ἐλθόντες as if it were attributive (as if the Greek were οἱ ἐλθόντες περὶ...). In the Greek, ἐλθόντες refers to the workers coming forward to receive their pay in the evening, while οἱ περὶ τὴν ἑνδεκάτην ὥραν is the subject ('the ones [hired] about the eleventh hour'). The draft's rendering conflates these, implying they came to get paid at the eleventh hour. Supplying 'hired' (as in ESV, NASB) clarifies the substantive phrase, allowing 'came' to correctly function as the circumstantial action.
- timestamp: '2026-11-09T17:15:09Z'
