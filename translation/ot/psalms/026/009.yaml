id: PSA.26.9
reference: Psalms 26:9
source:
  edition: WLC
  text: אַל תֶּאֱסֹ֣ף עִם חַטָּאִ֣ים נַפְשִׁ֑/י וְ/עִם אַנְשֵׁ֖י דָמִ֣ים חַיָּֽ/י־־־׃
translation:
  text: Do not sweep me away with sinners[a], nor take my life with men of bloodshed,
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'Do not gather my life with sinners.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  chosen: take ... away
  alternatives:
  - take away
  - sweep away
  lexicon: HALOT
  rationale: In context, the verb describes removal together with sinners in judgment; the note retains the gathering image.
- source_word: נַפְשִׁי
  chosen: me
  alternatives:
  - my life
  - me
  lexicon: HALOT
  rationale: Here נפש denotes the person or self, not necessarily a distinct immaterial component.
- source_word: חַטָּאִים
  chosen: sinners
  alternatives:
  - sinful people
  lexicon: HALOT
  rationale: The noun straightforwardly denotes those characterized by sin. 'Sinners' is concise, natural, and preserves the moral category in the Hebrew.
- source_word: אַנְשֵׁי דָמִים
  chosen: violent men
  alternatives:
  - bloodthirsty men
  - men of blood
  - murderers
  lexicon: HALOT
  rationale: This is the ordinary English sense of the Hebrew bloodshed idiom while preserving its breadth.
- source_word: חַיָּי
  chosen: my life
  alternatives:
  - my living being
  - my days
  lexicon: HALOT
  rationale: 'In parallel with נַפְשִׁי, חַיַּי naturally means ''my life.'' This keeps the poetic intensification: the psalmist asks that neither his inner self nor his life be counted with violent people.'
- source_word: אַל
  chosen: Do not
  alternatives:
  - May you not
  lexicon: HALOT
  rationale: With the imperfect, אַל expresses a negative plea or prohibition. 'Do not' is idiomatic English prayer language here.
