  from: I opened to my beloved[a], but my beloved had turned away and gone. My soul went out when he spoke; I sought him, but I did not find him. I called him[b], but he did not answer me.
  to: I opened to my beloved, but my beloved had slipped away and gone.[a] My soul went out when he spoke;[b] I sought him, but I did not find him. I called to him, but he did not answer me.
  rationale: “Slipped away” more directly reflects חָמַק than “turned away,” which can add an unwarranted suggestion of deliberate rejection. “Called to him” is natural English for the direct-object Hebrew verb in this context. The notes are also correctly relocated to the departure and difficult נפשׁ idiom.
