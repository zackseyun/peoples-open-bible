  lexicon: HALOT
  rationale: Cardinal number used elliptically in this list to count each defeated king. Rendering it as 'one' preserves the terse repetitive structure of the Hebrew.
- source_word: מֶלֶךְ
  chosen: the king of
  alternatives:
  - king of
  lexicon: HALOT
  rationale: Repeated construct phrase for the second entry in the list; translated consistently with the first occurrence.
- source_word: חֵפֶר
