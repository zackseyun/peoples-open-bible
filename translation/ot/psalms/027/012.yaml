  rationale: The participial English clause naturally characterizes the preceding false witnesses and avoids the current unmarked conversion of the Hebrew singular final form into an explicit plural “they.” The note candidly preserves the viable reading of the singular as a further or distributive witness. The proposed footnotes are accurately placed and appropriately concise.
