    reason: textual_lexical_ambiguity
lexical_decisions:
- source_word: קוּמָה
  english_pob_choice: Rise up
  chosen_korean: 일어나소서
  alternatives_korean:
  - 일어나십시오
  - 일어나 주십시오
  lexicon: HALOT
  rationale: 하나님께 드리는 시적 청원으로서 ‘일어나소서’가 행위의 촉발과 긴박함을 자연스럽게 살리면서도 합쇼체 본문과 잘 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 하나님의 고유명사를 가리키므로 전통적 대체어 ‘주’ 대신 프로젝트 기본값인 ‘야훼’를 사용했습니다.
- source_word: יָעֹז אֱנוֹשׁ
  english_pob_choice: do not let man prevail
  chosen_korean: 사람이 우쭐대지 못하게 하시고
  alternatives_korean:
  - 사람이 이기지 못하게 하시고
  - 사람이 강해지지 못하게 하시고
  lexicon: HALOT
  rationale: יָעֹז는 단순한 힘의 소유보다 ‘우세를 점하다/뽐내며 힘을 드러내다’의 뉘앙스를 가질 수 있어, 시편의 대조를 살리면서도 현대 한국어로 자연스러운 ‘우쭐대지 못하게’로 옮겼습니다.
- source_word: יִשָּׁפְטוּ גוֹיִם
  english_pob_choice: let the nations be judged
  chosen_korean: 민족들이 주 앞에서 심판을 받게 하소서
  alternatives_korean:
  - 민족들이 심판을 받게 하소서
  - 민족들이 판결을 받게 하소서
  lexicon: HALOT
  rationale: 수동적 법정 의미를 살려 ‘심판을 받다’로 옮겼고, גוֹיִם은 시편 문맥에 맞게 ‘민족들’로 번역했습니다.
- source_word: עַל פָּנֶיךָ
  english_pob_choice: before you
  chosen_korean: 주 앞에서
  alternatives_korean:
  - 주 앞에
  - 주의 얼굴 앞에서
  lexicon: HALOT
  rationale: 직역의 ‘주의 얼굴 앞에서’는 한국어에서 다소 무거우므로, 하나님 앞에서 공개적으로 재판이 이루어진다는 의미를 간결하게 ‘주 앞에서’로 전달했습니다.
theological_decisions:
- issue: אֱנוֹשׁ의 인간 연약성 뉘앙스
  chosen_reading: 사람
  alternative_readings:
  - 연약한 사람
  - 필멸의 사람
  rationale: 이 절은 인간의 보편성과 하나님의 주권을 대비하므로, 성별-정확성을 해치지 않는 범위에서 단수 대표어 ‘사람’을 유지했습니다. 연약성과 유한성은 본문 주석 성격의 각주로 보완합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4 (Gender-accurate over gender-neutral)
