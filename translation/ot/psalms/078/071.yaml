  from: from following the nursing ewes he brought him[a], to shepherd Jacob his people[b], and Israel his inheritance.
  to: From following the nursing ewes[a], he brought him to shepherd Jacob, his people, and Israel, his inheritance.
  rationale: The proposed commas clarify the appositions and the removal of the comma between “him” and “to shepherd” improves the English. But עָלוֹת specifically denotes suckling/nursing ewes; “ewes with young” is possible but slightly broader and does not improve the meaning enough to replace the more precise current wording. The unnecessary inheritance alternative may be removed. The remaining note should honestly preserve the spatial alternative for מֵאַחַר.
