  from: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
  to: The singers, the descendants of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun, the king’s seer. The gatekeepers were at each gate. They did not need to leave their service, because their fellow Levites prepared their food for them.
  rationale: The lexical discussion supports the non-prohibitive reading and the attachment of ‘the king’s seer’ to Jeduthun, both retained here. Its reluctance to identify what was prepared gives way to the clear meal-preparation context; the earlier notes are unnecessary once these points are clear in the text.
