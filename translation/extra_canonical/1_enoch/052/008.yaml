translation:
  text: And iron will not serve for protection, nor will they dress for armouring the chest.[a] Copper will
    not benefit it,[b] and lead [will not benefit it, and][c] will not be valued[d]; nor will lead be desired.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected wording has plural “they will not dress/put on,” followed by an armouring expression
      and the body-part term. “For armouring the chest” keeps that purpose relation without supplying an unprinted
      garment or named actor. The primary body-part entry gives the chest or breast range, not a newly identified
      piece of equipment.
  - marker: b
    text: The benefit verb has a singular object suffix. “It” retains that suffix without claiming that its
      precise referent has been recovered; no new person or plural “them” is supplied.
  - marker: c
    text: The repeated negative and conjunction in square brackets are printed in Charles’s edited main text.
      His note6 on printed96 brackets this clause as an intrusion affecting parallelism. The English retains
      it; these are editorial brackets, not a claim of an ancient gap or permission to remove the negative.
  - marker: d
    text: For “will not be valued,” this working English follows the count/reckon predicate in Dillmann’s1851
      edited parallel,52:8 on printed29. Its labialized word is provisionally read, with its vowel orders not
      finally certified here. Charles’s different ኢይትኃሰይ remains in the selected source; its meaning here is
      not claimed resolved.
  - marker: e
    text: The source uses two different lead-range metal words, nāʾək andʿarar. Both are rendered “lead” here
      without asserting identical chemical material or forcing an exclusive tin-versus-lead distinction. The
      copper word can also cover bronze. The final negative is passive “will not be desired”; no newly named
      demander is introduced.
