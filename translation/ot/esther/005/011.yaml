  from: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
  to: Haman told them about the splendor of his wealth, his many sons, all the ways the king had promoted him, and how the king had exalted him above the royal officials and servants.
