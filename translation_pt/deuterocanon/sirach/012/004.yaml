revisions:
- from: O mal o alcançará em dobro no tempo da necessidade; com todo bem, chegará até ele.[a]
  to: O mal o alcançará em dobro quando estiver em necessidade; em todo bem, chegará até ele.[a]
  rationale: A revisão limita-se a tornar mais direta a correspondência de בְּכָל («em todo») e a melhorar a fluência da expressão temporal. Mantém-se a elipse do sujeito na segunda oração, pois o hebraico não o repete; assim, não se resolve artificialmente uma construção textualmente difícil. A leitura grega, muito diferente, continua assinalada em nota, sem substituir o texto hebraico de base.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:02:09Z'
review_pass:
  verdict: revise
  source_fidelity: 'A primeira oração reproduz adequadamente o hebraico: פִּי שְׁנַיִם expressa uma medida dupla, רָעָה é «mal/desgraça», e תַּשִּׂיג significa «alcançará». A segunda oração conserva a sintaxe concisa e difícil do hebraico, cujo sujeito feminino não é repetido e é naturalmente entendido como «o mal». Convém, porém, traduzir בְּכָל como «em», não «com», para refletir melhor a preposição hebraica e não introduzir uma relação instrumental indevida.'
  naturalness: «No tempo da necessidade» é compreensível, mas «quando estiver em necessidade» é mais natural em português e explicita, sem acrescentar conteúdo, o referente já indicado pelo sufixo «o». Na segunda oração, a elipse do sujeito pode ser mantida para preservar a ambiguidade do original.
  terminology: «Mal», «em dobro» e «pecador» são escolhas adequadas e de registro digno. «Piedoso» representa corretamente εὐσεβής na nota grega. A nota identifica de forma suficiente a divergência substancial da tradição grega.
  issues:
  - severity: low
    issue: «com todo bem» para בְּכָל טוֹבָה
    rationale: A preposição בְּ é mais diretamente «em». «Com» sugere que o bem seria o meio pelo qual algo chega, nuance não indicada pelo hebraico. «Em todo bem» preserva a formulação difícil e a ambiguidade do texto.
  - severity: low
    issue: Formulação temporal menos idiomática
    rationale: «Quando estiver em necessidade» é mais fluente que «no tempo da necessidade» e mantém o sentido de בְּעֵת צֹרֶךְ.
