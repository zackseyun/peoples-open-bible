theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Referent of the pronoun in בְאָהֳלוֹ
  chosen_reading: his tent = the LORD's tent
  alternative_readings:
  - his tent = the psalmist's tent
  rationale: In context the most natural antecedent is the LORD, especially given the immediate movement into sacrifice and praise directed to the LORD. This yields sanctuary imagery coherent with the psalm's temple language.
