  to: 보십시오, 여러분의 형제 시므온입니다. 나는 그가 분별 있는 사람임을 압니다. 평생 그의 말을 들으십시오. 그는 여러분에게 아버지가 될 것입니다.
  rationale: 원문의 확신, 시므온에게 귀 기울이라는 명령, 그리고 아버지 역할에 대한 직설적 약속을 보존하면서 현대 표준 한국어 합쇼체로 다듬었습니다. βουλή의 판단·조언 의미는 ‘분별 있는 사람’으로 무리 없이 반영했으며, 별도 각주는 필요하지 않습니다.
