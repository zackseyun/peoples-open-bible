  review_summary: The suffix in בִּבְכוֹרֵיהֶם is grammatically plural because מִצְרַיִם has plural form, but English treats the nation Egypt as singular here. “Their firstborn” creates an unnecessary agreement problem. “Through its firstborn” keeps the Hebrew’s compact and somewhat open בְּ relation without adding another striking verb; the note preserves the alternatives.
