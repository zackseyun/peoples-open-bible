  - severity: high
    issue: All draft lexical and theological notes concern absent source material
    rationale: The notes discuss נָקָם, פְּעָמָיו, and דַם הָרָשָׁע, none of which occurs in Psalm 58:11. They must be replaced rather than retained.
  - severity: medium
    issue: Ambiguous plural morphology in the final clause requires acknowledgment
    rationale: אֱלֹהִים שֹׁפְטִים combines a morphologically plural noun and plural participle. The main rendering may appropriately understand it as the one God, but a note should preserve the less likely plural reading.
