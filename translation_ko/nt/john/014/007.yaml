id: JHN.14.7
reference: John 14:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: ko
  text: 여러분이 나를 알았더라면, 내 아버지도 알았을 것입니다. 이제부터는 그분을 알고, 그분을 보았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ ἐγνώκειτέ με
  english_pob_choice: If you had known me
  chosen_korean: 여러분이 나를 알았더라면
  alternatives_korean:
  - 여러분이 나를 알았더라면
  - 여러분이 나를 알고 있었다면
  lexicon: γινώσκω
  rationale: 과거완료적 조건을 한국어의 '알았더라면'으로 자연스럽게 살려, 단순한 정보 인지가 아니라 관계적 인식을 담았습니다.
- source_word: τὸν πατέρα μου
  english_pob_choice: my Father
  chosen_korean: 내 아버지
  alternatives_korean:
  - 내 아버지
  - 내 아버님
  lexicon: πατήρ
  rationale: 예수의 발화에서 하나님의 부자 관계를 드러내되, 본문이 요구하는 바 이상의 경어화를 피하고 직접성을 유지했습니다.
- source_word: ἀπ’ ἄρτι γινώσκετε αὐτὸν
  english_pob_choice: From now on you do know him
  chosen_korean: 이제부터는 그분을 알고 있으며
  alternatives_korean:
  - 이제부터는 그분을 압니다
  - 이제부터는 그분을 알게 됩니다
  lexicon: ἀπ’ ἄρτι + γινώσκω
  rationale: POB의 'do know'를 반영해 현재적 확증을 나타내는 '알고 있으며'로 옮겨, 단순 미래나 시작 시점만이 아니라 지금부터의 인식 상태를 살렸습니다.
- source_word: ἑωράκατε αὐτόν
  english_pob_choice: have seen him
  chosen_korean: 그분을 보았습니다
  alternatives_korean:
  - 그분을 보았습니다
  - 그분을 본 적이 있습니다
  lexicon: ὁράω
  rationale: 완료의 결과 상태를 과장하지 않으면서도 'have seen'의 완료성을 한국어 현재완료로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 아버지-아들 관계의 신학적 호칭
  chosen_reading: '''아버지''를 유지하되 ''아버님''으로 경어화하지 않았습니다.'
  alternative_readings:
  - 내 아버님
  - 아버지님
  rationale: 본문은 친밀한 계시 선언이며, 한국어 경어화는 오히려 관계의 긴장과 직접성을 약화시킬 수 있어 원문의 발화력을 우선했습니다.
  doctrine_reference: 요한복음의 계시-인식 모티프
