  source_fidelity: 초어 대조용으로 제공된 시리아어 본문은 이 절의 영어 감사 추적과 직접 대응하는 구절을 명확히 보여 주지 않으며, 페이지 보간 범위도 중첩·잠정 상태입니다. 따라서 영어 감사 추적에 보존된 사건 열거와 수동 표현을 기준으로 검토했습니다. 초안의 사건 순서와 핵심 내용은 대체로 유지되지만, ‘열국의 많은 피를 흘렸고’는 행위 주체가 불명확한 능동문이므로 ‘피가 흘려졌고’로 수동 의미를 보존하는 편이 안전합니다.
  naturalness: ‘시온이 건축되고’보다 명사구 병렬인 ‘시온의 건축과 성소의 봉헌이 이루어졌고’가 자연스럽습니다. 또한 현대 공식 합쇼체 기준에서 종결형 ‘-느니라’는 맞지 않으므로 ‘-습니다’로 고쳤습니다.
  terminology: ‘시온’, ‘성소’, ‘봉헌’, ‘열국’, ‘제물’은 본문 전통 및 한국어 성서 문체에 맞는 용어입니다. ‘성소 봉헌식’도 가능하지만, 원문의 ‘성소의 봉헌’을 불필요하게 의례 명칭으로 한정하지 않기 위해 ‘성소 봉헌 때’로 옮겼습니다.
  issues:
  - severity: medium
    issue: 현대 합쇼체에 맞지 않는 종결형
    rationale: 초안의 ‘드렸느니라’는 고전적 성서체이며, 지정된 현대 공식-공손체(합쇼체)와 맞지 않습니다.
  - severity: medium
    issue: 피를 흘린 행위의 문법적 주체가 불명확함
    rationale: 영어 감사 추적은 ‘much blood ... was shed’라는 수동 표현입니다. 초안의 능동형은 누가 피를 흘렸는지 문법적으로 불분명하므로 수동형으로 의미를 보존해야 합니다.
  - severity: low
    issue: 병렬 사건 표현의 어색함
    rationale: ‘시온이 건축되고 성소가 봉헌되며’는 뒤의 과거 사건들과 시제·연결이 고르지 않습니다. 명사구 병렬과 과거 연결형이 더 자연스럽습니다.
  revised_text: 그때에 시온의 건축과 성소의 봉헌이 이루어졌고, 그때 범죄한 열국의 많은 피가 흘려졌으며, 성소 봉헌 때 많은 제물이 바쳐졌습니다.
  revised_footnotes: []
  revision_rationale: 사건의 순서와 반복되는 시간 표지(‘그때’)를 보존하고, 피 흘림과 제물 봉헌을 수동형으로 옮겼습니다. 현대 합쇼체로 종결을 정리했습니다. 영어의 ‘there came/took place’ 변이와 관련하여 한국어 ‘이루어졌고’는 두 표현이 공유하는 사건 발생 의미를 자연스럽게 포괄하므로 별도 각주가 필요하지 않습니다.
