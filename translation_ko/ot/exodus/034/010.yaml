  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: ko
  text: 그가 말씀하셨습니다. “보십시오, 내가 언약을 맺습니다. 너의 모든 백성 앞에서 나는 온 땅 어디에서도, 어느 민족 가운데에서도 창조된 적이 없는 놀라운 일들을 행할 것입니다. 네가 그 가운데 있는 모든 백성은 야훼께서 하시는 일을 보게 될 것이니, 내가 너와 함께 행하는 일이 경외스럽기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 보세요
  - 봐라
  lexicon: 히네
  rationale: 서술 속 선언을 강조하는 감탄적 표지로서, 현대 문체에서 가장 자연스럽고 압축적인 ‘보라’가 원문의 주의 환기 기능을 잘 살립니다.
- source_word: כֹּרֵת בְּרִית
  english_pob_choice: I am making a covenant
  chosen_korean: 내가 언약을 맺습니다
  alternatives_korean:
  - 내가 언약을 세웁니다
  - 내가 언약을 체결합니다
  lexicon: כרת ברית
  rationale: 히브리어 관용구를 직역하기보다 한국어 성경어법에 맞게 ‘언약을 맺다’로 옮겨, 관계적·구속사적 의미를 유지했습니다.
- source_word: נִפְלָאֹת
  english_pob_choice: wonders
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 기이한 일들
  - 경이로운 일들
  lexicon: נפלאות
  rationale: 표적의 초자연성과 경이감을 함께 담으면서도 과장된 신학어를 피하기 위해 ‘놀라운 일들’을 택했습니다.
- source_word: מַעֲשֵׂה יְהוָה
  english_pob_choice: the work of the LORD
  chosen_korean: 야훼의 하시는 일
  alternatives_korean:
  - 야훼의 일
  - 주님의 일
  lexicon: מעשה + יהוה
  rationale: 문맥상 단순한 결과물이 아니라 지금 ‘행하고 계시는’ 행위를 가리키므로, 동사성을 살린 ‘하시는 일’로 번역했습니다.
- source_word: נוֹרָא הוּא
  english_pob_choice: awe-inspiring
  chosen_korean: 경외스럽기 때문입니다
  alternatives_korean:
  - 두려울 만큼 놀랍기 때문입니다
  - 떨릴 만큼 두렵기 때문입니다
  lexicon: ירא/נורא
  rationale: 원문의 נורא는 단순한 ‘멋짐’보다 경외와 두려움을 함께 유발하는 성격이므로, ‘경외스럽다’로 긴장감을 보존했습니다.
theological_decisions:
- issue: 야훼의 이름 표기와 LXX 인용 관행
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮기되, 여기서는 직접 인용·언급이므로 본문에 그대로 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB 기본 원칙에 따라 신명기적/구약 본문에서 YHWH는 학술적 음역인 ‘야훼’를 유지하는 것이 가장 원문 가시성이 높습니다.
  doctrine_reference: Tetragrammaton rendering policy
