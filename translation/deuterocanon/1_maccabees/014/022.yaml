reference: 1 Maccabees 14:22
source:
  edition: lxx-swete-1909
  text: καὶ ἀναγραψάμενοι τὰ ὑπ' αὐτῶν εἰρημένα ἐν ταῖς βουλαῖς τοῦ δήμου οὕτως Νουμήνιος Ἀντιόχου καὶ Ἀντίπατρος Ἰάσονος πρεσβευταὶ Α Ἰουδαίων ἦλθοσαν πρὸς ἡμᾶς ἀνανεούμενοι τὴν πρὸς ἡμᾶς φιλίαν
  language: Greek
  pages:
