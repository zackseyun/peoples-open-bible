translation:
  language: ko
  text: 용사여, 당신의 영화와 위엄을 갖추고 칼을 넓적다리에 차십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘용사여, 당신의 칼을 넓적다리에 차십시오, 당신의 영화와 당신의 위엄이여’와 같습니다. 마지막 두 명사는 히브리어에서 전치사 없이 놓여 있으며, 명령을 수식하여 ‘당신의 영화와 위엄 가운데서’ 또는 왕적 영광을 가리키는 호격적 표현으로 이해되기도 합니다.
    reason: alternative_reading
