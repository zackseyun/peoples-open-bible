  rationale: The verse uses deliberately graphic sexual imagery to portray Jerusalem's covenant unfaithfulness. Softening the language would mute the rhetorical force of the prophetic indictment and go beyond the source text.
  doctrine_reference: 'Translation philosophy: original-language primacy; never paraphrase beyond what the source warrants.'
