  meaning: Human life is insubstantial, people’s turmoil is futile, and they do not know who will receive the possessions they accumulate.
  meaning_decisions:
  - source_phrase: בְּצֶלֶם
    prior_rendering: as an image
    new_rendering: like phantoms
    rationale: Here “image” depicts insubstantial human existence, not a portrait or humanity’s creation in God’s image. “Phantoms” carries that contextual force; the note preserves the source image.
  - source_phrase: יִתְהַלֶּךְ אִישׁ ... יֶהֱמָיוּן ... יִצְבֹּר וְלֹא יֵדַע
    prior_rendering: a man walks about ... people are in turmoil ... He heaps things up but does not know
    new_rendering: people walk about ... they are in turmoil ... They heap up possessions but do not know
    rationale: The Hebrew alternates representative singular and generic plural expressions for humanity. A consistent English plural conveys the same general observation without seeming to introduce different subjects.
  - source_phrase: יִצְבֹּר
    prior_rendering: heaps things up
    new_rendering: heap up possessions
    rationale: The context concerns accumulated holdings whose eventual recipient is unknown, not merely a pile of unspecified objects. “Possessions” supplies the understood object while preserving the plural reference in the final clause.
