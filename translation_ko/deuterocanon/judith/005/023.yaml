  verdict: revise
  source_fidelity: 초안은 미래 수동인 βοηθησόμεθα를 ‘도움을 받지 못할 것입니다’로 적절히 반영하고, 유대적 집단명인 ‘이스라엘 자손’도 충실히 옮겼습니다. 다만 ‘강한 전열을 갖춘 싸움에 나설 만한’은 원문의 ‘강한 전열/진형을 위한’이라는 군사적 표현을 다소 우회하며 한국어로도 어색합니다. 또한 두 번째 γάρ의 설명적 연결이 드러나지 않습니다.
  naturalness: ‘강한 전열을 갖춘 싸움에 나설 만한 힘’은 수식 관계가 무겁고 부자연스럽습니다. ‘강력한 전열을 펼칠 힘도 능력도’가 현대 표준 한국어에서 더 자연스럽고 원문의 군사적 이미지를 직접 보존합니다.
  terminology: ‘이스라엘 자손’은 υἱῶν Ἰσραήλ의 성서적 집단 표현으로 유지할 수 있습니다. δύναμις와 κράτος의 병렬은 ‘힘도 능력도’로 보존하고, παράταξις는 ‘전열’로 옮깁니다.
  issues:
  - severity: medium
    issue: ‘강한 전열을 갖춘 싸움에 나설 만한’이 παράταξιν ἰσχυράν의 의미와 수식 관계를 불명확하게 한다.
    rationale: 원문은 강한 전열 또는 전투 진형을 이루는 데 필요한 δύναμις와 κράτος의 부재를 말합니다. ‘전열을 펼칠’로 옮기면 군사적 배치의 뜻을 명확히 하면서 자연스러운 한국어가 됩니다.
  - severity: low
