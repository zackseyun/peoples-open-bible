source:
  text: |-
    Therefore, brethren, since we have found no small opportunity for repentance, seeing that we have time, let us turn again unto God that called us, while we have still One that receiveth us.

    For if we bid farewell to these enjoyments and conquer our soul in refusing to fulfill its evil lusts, we shall be partakers of the mercy of Jesus.

    But ye know that the day of judgment cometh even now as a burning oven, and the powers of the heavens shall melt, and all the earth as lead melting on the fire, and then shall appear the secret and open works of men.

    Almsgiving therefore is a good thing, even as repentance from sin&gt; Fasting is better than prayer, but almsgiving better than both. And love covereth a multitude of sins, but prayer out of a good conscience delivereth from death. Blessed is every man that is found full of these. For almsgiving lifteth off the burden of sin.
