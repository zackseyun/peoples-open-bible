  chosen_reading: 본문의 자기고발적 회개 언어를 그대로 유지했습니다.
  alternative_readings:
  - 단순 과거 실패로 완화하는 표현
  - 일반적 비행으로 넓히는 표현
  rationale: 이 구절은 공동체가 율법에 대한 불순종을 고백하는 회개 맥락이므로, 죄책의 강도를 약화하지 않고 원문의 책임 고백을 유지하는 것이 적절합니다.
  doctrine_reference: 회개와 언약적 책임
