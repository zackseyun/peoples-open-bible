id: JHN.4.9
reference: John 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
  footnotes:
  - marker: a
    text: Or, “For Jews have no dealings with Samaritans,” possibly with the more specific sense that they did not use items in common, such as drinking vessels.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 사마리아 여인이 그에게 말했습니다. “어떻게 유대인인 당신이 사마리아 여자인 나에게 물을 달라고 하십니까?” (유대인들은 사마리아인들과 어울리지 않습니다.[a])
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대인들은 사마리아인들과 교제하지 않습니다” 또는 “거래하지 않습니다”로 옮길 수 있습니다. 더 구체적으로는 마시는 그릇과 같은 물건을 함께 사용하지 않았다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  english_pob_choice: So ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리하여 ... 말했다
  - 따라서 ... 말하였다
  lexicon: BDAG
  rationale: οὖν은 서술의 진행을 잇는 접속적 요소입니다. '그러자'가 자연스럽고 현대 한국어의 연결 기능을 보존합니다.
- source_word: Ἰουδαῖος
  english_pob_choice: Jew
  chosen_korean: 유대인
  alternatives_korean:
  - 유다인
  - 유대 사람
  lexicon: BDAG
  rationale: 본문은 사마리아인과의 공동체적 구별을 말하므로 지리적 의미보다 종교·민족적 의미인 '유대인'을 사용합니다.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις / γυναικὸς Σαμαρίτιδος οὔσης
  english_pob_choice: the Samaritan woman / from me, a Samaritan woman
  chosen_korean: 사마리아 여인 / 사마리아 여자인 나에게
  alternatives_korean:
  - 사마리아인 여자
  - 사마리아 여자
  lexicon: BDAG
  rationale: 중복 관사는 신원(성별·공동체)을 강조합니다. 한국어 관용 표현으로 '사마리아 여인'을 기본으로 하고, 속격절은 '사마리아 여자인 나에게'처럼 첨가적으로 번역했습니다.
- source_word: συγχρῶνται
  english_pob_choice: associate with
  chosen_korean: 어울리지 않습니다
  alternatives_korean:
  - 교제하지 않습니다
  - 함께 쓰지 않습니다 (그릇을 공유하지 않습니다)
  lexicon: BDAG
  rationale: 동사는 광범위한 '교류하지 않음'을 담고 있습니다. 본문 맥락상 사회적 분리 전체를 말하므로 '어울리지 않습니다'를 택했고, 기구 공유 같은 좁은 의미는 주석(각주)으로 보존했습니다.
theological_decisions:
- issue: Meaning of Ἰουδαῖος in Johannine usage
  chosen_reading: 유대인 (종교·민족적 공동체)
  alternative_readings:
  - 유다 지방의 주민(지리적 의미)
  rationale: 요한복음의 대조는 사마리아인과의 공동체적·종교적 분리를 강조하므로 '유대인'이 문맥에 더 적합합니다.
  doctrine_reference: Translation philosophy §1, 원어 우선 원칙
- issue: Scope of συγχρῶνται
  chosen_reading: 일반적 사회적 교류의 부재(넓은 의미)
  alternative_readings:
  - 특정 물건·그릇의 공동 사용 불허(좁은 의미)
  rationale: 본문 바로 다음의 상황(그릇과 물을 함께 쓰는 문제)이 좁은 해석을 가능하게 하지만, 본절은 더 일반적인 사회적 분리를 진술하므로 넓은 의미를 기본으로 번역하고 좁은 가능성은 각주로 보존했습니다.
  doctrine_reference: Translation philosophy §3, 신학적 긴장 보존
