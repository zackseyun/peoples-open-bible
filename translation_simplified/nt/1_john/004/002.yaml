translation:
  language: en
  text: 'This is how you recognize the Spirit of God: every spirit that openly acknowledges that Jesus Christ[a] has come in the flesh[b] is from God.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Jesus the Messiah.” Messiah translates Christ as a title, not as though it were a surname.
    reason: lexical_alternative
  - marker: b
    text: His coming in real human flesh has lasting significance.
    reason: simplification_note
simplification_decisions:
- pob_phrase: By this you know
  simplified_phrase: This is how you recognize
  preserved_meaning: The confession that follows is the criterion for recognizing God's Spirit.
  reasoning_layer_used: Lexical decision for ἐν τούτῳ and γινώσκετε
  rationale: The recasting makes the criterion clear while keeping the verb as a statement rather than a command.
- pob_phrase: confesses Jesus the Messiah having come
  simplified_phrase: openly acknowledges that Jesus the Messiah has come
  preserved_meaning: The spirit affirms Jesus' identity and genuine coming in flesh.
  reasoning_layer_used: Lexical decision for ὁμολογεῖ and applied awkward-English revision
  rationale: A that-clause is natural English, and “openly acknowledges” retains the force of public confession.
interpretive_expansions:
- pob_phrase: confesses
  rendering: openly acknowledges
  claim: The confession is an expressed acknowledgment, not merely private awareness.
  evidence:
  - The POB lexical rationale says the verb carries public-avowal force in this context.
  confidence: high
  alternatives_preserved:
  - confesses
  - acknowledges
translation_notes:
  risk_flags:
  - risk: “Has come” may not by itself display the perfect participle's enduring significance.
    mitigation: Footnote [b] states that the real human coming remains significant.
  - risk: “Acknowledges” can sound weaker than the traditional term “confesses.”
    mitigation: Adding “openly” preserves the source verb's avowal force.
