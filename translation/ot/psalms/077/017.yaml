  rationale: The Hebrew lexeme is literally 'arrows,' and the translation philosophy prioritizes the source text over inherited interpretive smoothing. Because the context strongly suggests a storm manifestation of God, the metaphorical sense is preserved in a footnote rather than resolved away in the main text.
