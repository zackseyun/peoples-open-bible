  from: And they sounded the trumpets[a], and Cendebeus and his camp were thrown into confusion, and many of them fell wounded[b]; but those who were left fled into the stronghold.
  to: They sounded the trumpets, and Cendebeus and his army were routed. Many of his men fell wounded, and the rest fled to the stronghold.
  rationale: The old footnote already acknowledged “were routed,” and the lexical discussion confirms that military sense despite preferring a weaker main-text rendering. I retain “fell wounded,” which avoids claiming that every man struck down died, and drop notes whose points the text now carries.
