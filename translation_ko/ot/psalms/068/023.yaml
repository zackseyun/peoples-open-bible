translation:
  language: ko
  text: 그리하여 주님의 발이 피 속에서 그들을 짓밟고, 주님의 개들의 혀가 원수들에게서 제 몫을 얻도록 하셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 표현은 난해하고 타원적입니다. 직역에 가깝게는 ‘주님의 개들의 혀가 원수들에게서, 그에게서’이며, 문맥상 ‘원수들에게서 제 몫을 얻다’로 이해할 수 있습니다. 또한 ‘그들을’은 히브리어에 명시되지 않았으나 문맥상 보충한 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: The Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 주께서
  lexicon: HALOT
  rationale: 아도나이는 하나님의 호칭이므로 한국어에서는 자연스러운 존칭 형태인 ‘주께서’로 옮겨, 영어 POB의 ‘The Lord’와 같은 제목적 기능을 유지했습니다.
