translation:
  language: en
  text: I listened carefully, but what they said was not right. No man[a] regretted[b] his evil, saying, “What have I done?” Each one turned back to his own path, like a horse rushing into battle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew says “No man,” using one man to represent the people generally.
    reason: source_note
  - marker: b
    text: Earlier reader wording used a form of "repent." Preserve the contextual sense of regret/contrition rather than make every historical use of repent mean Godward reorientation. The source term and/or local context supports regret here; alternatives remain available in the notes.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I have paid attention and listened
  simplified_phrase: I listened carefully
  preserved_meaning: The speaker listened with deliberate attention.
  reasoning_layer_used: Lexical decisions for הִקְשַׁבְתִּי and וָאֶשְׁמָע
  rationale: “Carefully” preserves the combined force of the two listening verbs.
- pob_phrase: they do not speak rightly
  simplified_phrase: what they said was not right
  preserved_meaning: Their speech was improper or false.
  reasoning_layer_used: Lexical decision for לוֹא כֵן יְדַבֵּרוּ
  rationale: The recast clause states the moral judgment in natural English.
- pob_phrase: Every one turns in his own course
  simplified_phrase: Each one turned back to his own path
  preserved_meaning: Every individual returned to his chosen way.
  reasoning_layer_used: Lexical decisions for כֻּלֹּה, שָׁב, and במרצותם
  rationale: “Each one” keeps the distributive force, while “path” clearly conveys the person’s course.
interpretive_expansions:
- pob_phrase: turns in his own course
  rendering: turned back to his own path
  claim: The people returned to their individually chosen ways rather than turning from evil.
  evidence:
  - The POB rationale says שָׁב means turning back into one’s chosen path.
  - The POB footnote describes persistence in one’s chosen path.
  confidence: high
  alternatives_preserved:
  - turned to his own course
  - turned back to his own course
translation_notes:
  risk_flags:
  - risk: “No man” may be misread as excluding women.
    mitigation: The footnote explains its representative force.
  - risk: “Path” replaces the source image of a running or course.
    mitigation: The horse rushing into battle preserves the image of headlong motion.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
