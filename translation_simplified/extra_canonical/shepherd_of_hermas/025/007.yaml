  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/007.yaml
  text: 7. If then, having heard them, you keep them and walk in them and do them with a pure heart, you will receive from the Lord what he promised you; but if, having heard, you do not repent, but still add to your sins, you will receive from the Lord the opposite things. The Shepherd, the angel of repentance, commanded me to write all these things in this way.
translation:
  language: en
  text: 7. So when you hear these commands, obey them. Live by them and carry them out with a pure heart. Then you will receive what the Lord promised you. But if you hear them and do not reorient[a], and instead keep adding to your sins, you will receive the opposite from the Lord. This is how the Shepherd, the angel of reorientation, commanded me to write all these things.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: keep them and walk in them and do them
  simplified_phrase: obey them. Live by them and carry them out
  preserved_meaning: The three expressions retain the distinct ideas of obedience, a continuing way of life, and concrete action.
  reasoning_layer_used: POB text and immediate context
  rationale: The biblical image of walking is expressed as living by the commands rather than being dropped.
- pob_phrase: but still add to your sins
  simplified_phrase: and instead keep adding to your sins
  preserved_meaning: The warning concerns continued and increasing sin after hearing the commands.
  reasoning_layer_used: POB text
  rationale: The recast clause makes the contrast and ongoing action easier to follow.
- pob_phrase: commanded me to write all these things in this way
  simplified_phrase: This is how ... commanded me to write all these things
  preserved_meaning: The Shepherd directed both the writing and its manner.
  reasoning_layer_used: POB text
  rationale: Ordinary English word order clarifies the closing statement without changing its claim.
interpretive_expansions:
- pob_phrase: having heard them
  rendering: when you hear these commands
  claim: The things heard are commands to be obeyed, lived by, and carried out.
  evidence:
  - The following verbs require active obedience to what was heard.
  - The closing sentence says the Shepherd commanded these things.
  confidence: high
translation_notes:
  risk_flags:
  - risk: Replacing “walk in them” could weaken its way-of-life image.
    mitigation: “Live by them” preserves the sense of continuing conduct.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
