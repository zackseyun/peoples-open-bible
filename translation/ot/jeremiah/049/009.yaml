  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: If grape gatherers came to you[a], would they not leave gleanings? If thieves came by night, they would destroy only enough for themselves.
  to: If grape gatherers came to you, would they not leave some grapes behind[a]? If thieves came by night, they would plunder only until they had enough.
  rationale: I retain the earlier interpretation of ordinary harvesting and theft as limited, supported by the closely related wording in Obadiah 5 and the emphatic contrast in the next verse. Because Jeremiah’s wording also permits a statement that no gleanings remain, that serious alternative is preserved in a note.
