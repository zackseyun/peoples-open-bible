id: JOS.13.13
reference: Joshua 13:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֤א הוֹרִ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/גְּשׁוּרִ֖י וְ/אֶת הַ/מַּעֲכָתִ֑י וַ/יֵּ֨שֶׁב גְּשׁ֤וּר וּ/מַֽעֲכָת֙ בְּ/קֶ֣רֶב יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/013.yaml
  text: But the sons of Israel did not drive out the Geshurites or the Maacathites, and Geshur and Maacath lived among Israel to this day.
translation:
  language: ko
  text: 그러나 이스라엘 자손은 그술 사람과 마아가 사람을 쫓아내지 않았고, 그술과 마아가가 오늘날까지 이스라엘 가운데 살았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא הוֹרִישׁוּ
  english_pob_choice: did not drive out
  chosen_korean: 쫓아내지 못하였고
  alternatives_korean:
  - 몰아내지 못하였고
  - 내쫓지 못하였고
  lexicon: הוֹרִישׁ (Hiphil)
  rationale: 정복·축출의 동작을 자연스럽게 살리되, 단순한 ‘거주 이전’보다 강한 배제 의미가 드러나도록 ‘쫓아내다’를 택했습니다.
- source_word: הַגְּשׁוּרִי / הַמַּעֲכָתִי
  english_pob_choice: the Geshurites / the Maacathites
  chosen_korean: 그술 사람 / 마아가 사람
  alternatives_korean:
  - 게수르 사람 / 마아가 사람
  - 그술 족속 / 마아가 족속
  lexicon: 지명형 형용사 -ִי
  rationale: 지명에서 파생된 집단명을 한국어 성경 관용에 맞춰 ‘사람’으로 풀어, 독자가 민족/거주 집단을 바로 이해하도록 했습니다.
- source_word: וַיֵּשֶׁב ... בְּקֶרֶב יִשְׂרָאֵל
  english_pob_choice: lived among Israel
  chosen_korean: 이스라엘 가운데 살았습니다
  alternatives_korean:
  - 이스라엘 가운데 거주했습니다
  - 이스라엘 중에 살았습니다
  lexicon: יָשַׁב + בְּקֶרֶב
  rationale: ‘among’의 관계성을 살리면서도 ‘살다’의 평이한 서술을 유지해 본문의 역사적 진술을 자연스럽게 옮겼습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘날까지
  alternatives_korean:
  - 이 날까지
  - 지금까지
  lexicon: 관용구
  rationale: 히브리어 관용구를 현대 한국어에서 가장 자연스럽게 받는 표현으로 옮겼습니다.
theological_decisions:
- issue: 정복 서술의 동사 강도
  chosen_reading: ‘쫓아내지 못하였고’로 번역해 이스라엘의 불완전한 정복이 본문 자체에서 분명히 드러나게 했습니다.
  alternative_readings:
  - ‘몰아내지 못하였고’
  - ‘내쫓지 못하였고’
  rationale: 본문은 단순한 미거주가 아니라 실제 축출 실패를 말하므로, 약화된 표현보다 정복 실패의 역사성을 분명히 드러내는 번역이 적절합니다.
  doctrine_reference: 약속의 땅 분배와 불순종의 역사적 결과
- issue: ‘오늘날까지’의 서술 시점
  chosen_reading: 역사 서술의 종결 관용구로 처리해 현재 독자에게 직접적인 종말론적 의미를 부여하지 않았습니다.
  alternative_readings:
  - 현대적 지속성 강조
  - 편집자 주석화
  rationale: 본문의 초점은 사건 당시의 지속 상태를 기록하는 데 있으며, 관용구를 과도하게 신학화하지 않는 것이 원문에 충실합니다.
  doctrine_reference: 역사서의 서술 관습
