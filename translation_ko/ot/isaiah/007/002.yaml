  to: 다윗의 집에 “아람이 에브라임에 붙어 있습니다”라는 소식이 전해졌습니다. 그러자 그의 마음과 그의 백성의 마음이 바람 앞에 흔들리는 숲의 나무들처럼 흔들렸습니다.
  rationale: The revision removes the misleading physical-overlap sense of ‘위에 내려앉다’ while avoiding the more specific interpretation ‘동맹을 맺었다.’ It also updates the report formula to natural modern formal-polite Korean. No footnotes are needed because the revised wording preserves the source expression's contextual breadth rather than choosing a disputed technical explanation.
