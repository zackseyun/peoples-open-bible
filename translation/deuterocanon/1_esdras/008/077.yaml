translation:
  text: but he has shown us favor before the kings of Persia, to give us sustenance,
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: ἐποίησεν ἡμᾶς ἐν χάριτι ἐνώπιον
  chosen: has shown us favor before
  alternatives:
  - has made us objects of favor before
  - has dealt graciously with us before
  lexicon: BDAG
  rationale: The idiom ἐποίησεν ... ἐν χάριτι conveys causing someone to be in favor/grace before another. 'Has shown us favor
    before' is idiomatic English while preserving the relational sense of receiving grace in the sight of the Persian kings.
- source_word: τῶν βασιλέων Περσῶν
  chosen: the kings of Persia
  alternatives:
  - the Persian kings
  lexicon: BDAG
  rationale: A straightforward genitival construction. 'Kings of Persia' keeps the Greek order and echoes the historical setting.
- source_word: δοῦναι ἡμῖν τροφήν
  chosen: to give us sustenance
  alternatives:
  - to give us food
  - to provide for us
  lexicon: BDAG
  rationale: τροφή can mean food or nourishment/provision. 'Sustenance' preserves the concrete sense while fitting the broader
    idea of royal support better than the narrower 'food.'
