id: PSA.139.11
reference: Psalms 139:11
source:
  edition: WLC
  text: וָ֭/אֹמַר אַךְ חֹ֣שֶׁךְ יְשׁוּפֵ֑/נִי וְ֝/לַ֗יְלָה א֣וֹר בַּעֲדֵֽ/נִי־׃
translation:
  text: If I say, “Surely darkness will cover me[a], and the light around me will become night,”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “will overwhelm me” or “will crush me”; the Hebrew verb is rare.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  chosen: If I say
  alternatives:
  - Then I said
  - If I say
  - And I said
  lexicon: HALOT
  rationale: 'In the continuing hypothetical sequence, the wayyiqtol introduces another imagined condition: ''If I say.'''
- source_word: אַךְ
  chosen: Surely
  alternatives:
  - only
  - indeed
  lexicon: HALOT
  rationale: אַךְ here marks emphasis or confident assertion rather than restriction. 'Surely' best fits the psalmist's thought and idiomatic English.
- source_word: חֹשֶׁךְ
  chosen: darkness
  lexicon: HALOT
  rationale: Standard rendering of the noun; no contextual reason to vary.
- source_word: יְשׁוּפֵנִי
  chosen: will cover me
  alternatives:
  - will crush me
  - will overwhelm me
  - will bruise me
  lexicon: HALOT
  rationale: The verb שׁוּף is rare and context-sensitive. In this verse, with 'darkness' as subject, a sense like 'cover/overwhelm' fits the imagery and parallelism better than the more concrete 'bruise/crush' known from other contexts. 'Cover me' also prepares for the contrast developed in the next verse about darkness not being dark to God.
- source_word: וְלַיְלָה
  chosen: will become night
  alternatives:
  - even the night
  - and the night
  lexicon: HALOT
  rationale: 'In the verbless second colon, ''night'' is the predicate: the light around the speaker becomes night.'
- source_word: אוֹר
  chosen: the light
  alternatives:
  - is light
  - becomes light
  - will be light
  lexicon: HALOT
  rationale: Light is the subject of the second colon, not night.
- source_word: בַּעֲדֵנִי
  chosen: around me
  alternatives:
  - about me
  - for me
  - behind me
  lexicon: HALOT
  rationale: The preposition בעד in this context most naturally conveys surrounding spatial relation. 'Around me' is idiomatic and fits the imagery of night enclosing the speaker. Other senses such as 'for me' are less suitable here.
