  meaning: All the nations will be assembled before the Son of Man, who will distinguish people from one another as a shepherd separates sheep from goats.
  meaning_decisions:
  - source_phrase: ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων
    prior_rendering: he will separate them from one another
    new_rendering: he will separate the people from one another
    rationale: The masculine pronoun refers to the people constituting the grammatically neuter nations; making that reference explicit avoids implying that whole nations are sorted as undivided units.
  - source_phrase: ὁ ποιμὴν
    prior_rendering: the shepherd
    new_rendering: a shepherd
    rationale: The Greek article introduces a generic illustration, not a previously identified shepherd; English naturally uses the indefinite article.
  footnote_kinds:
