  text: מַ֭דּוּעַ אֵלָ֣י/ו רִיב֑וֹתָ כִּ֥י כָל דְּ֝בָרָ֗י/ו לֹ֣א יַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/013.yaml
  text: Why do you contend against him, because he does not answer for all his words?
translation:
  language: ko
  text: 어찌하여 그분과 다투십니까? 그분께서 자신의 모든 말씀에 대해 대답하지 않으시기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַ֭דּוּעַ
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 까닭으로
  lexicon: interrogative adverb
  rationale: 단순한 '왜'보다 '어찌하여'가 시적·논쟁적 수사에 더 어울리며, 원문의 따져 묻는 어조를 살립니다.
- source_word: רִיבוֹתָ
  english_pob_choice: contend
  chosen_korean: 다투십니까
  alternatives_korean:
  - 논쟁하십니까
  - 변론하십니까
  - 맞서십니까
  lexicon: Qal perfect 2ms from ריב
  rationale: 원문은 책망 섞인 대립을 묻는 동사이므로, 합쇼체로 자연스럽게 옮기되 법정적 뉘앙스를 잃지 않도록 '다투다'를 택했습니다.
- source_word: דְּבָרָיו
  english_pob_choice: his words
  chosen_korean: 그의 모든 말에 대하여
  alternatives_korean:
  - 그의 모든 말들에 대하여
  - 그의 온갖 말에 대하여
  lexicon: דָּבָר + pronominal suffix
  rationale: '''דְּבָרָיו''의 복수적 총칭을 살려 ''모든 말''로 옮겼고, 전치사적 관계를 명시해 뒤의 ''대답하지 않으시기''와 자연스럽게 연결했습니다.'
- source_word: לֹא יַעֲנֶה
  english_pob_choice: does not answer
  chosen_korean: 대답하지 않으시기 때문입니다
  alternatives_korean:
  - 응답하지 않으시기 때문입니다
  - 대답하지 않으시기 때문이지요
  lexicon: ענה in context
  rationale: 본문의 질문은 '왜 답하지 않는가'라는 이유 제시이므로, '때문입니다'로 인과를 분명히 하고 '대답하다'로 직설적인 대응 관계를 유지했습니다.
theological_decisions:
- issue: 호격/대상 지시 대명사 해석
  chosen_reading: 그에게
  alternative_readings:
  - 그분에게
  - 그 사람에게
  rationale: 본문의 3인칭 대상은 일반적으로 하나님을 가리키지만, 원문 자체는 인칭 대명사로 제시하므로 문맥을 존중해 직역했습니다.
  doctrine_reference: 문맥적 신적 지시를 유지하되, 본문에 없는 해석어를 과도하게 삽입하지 않음
