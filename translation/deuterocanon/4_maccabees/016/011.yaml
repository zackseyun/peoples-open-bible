translation:
  text: Not even when I die will I have one of my sons to bury me.” But the holy and God-fearing mother did not lament any of them in this way.
  philosophy: dynamic
lexical_decisions:
- source_word: ἣ
  chosen: who
  alternatives:
  - she who
  lexicon: LSJ
  rationale: Relative pronoun referring back to the mother in the preceding context; simple 'who' preserves the linkage without overloading the English.
- source_word: οὐδʼ ἂν ἀποθάνω
  chosen: even if I were not to die
  alternatives:
  - even if I should not die
  - though I did not die
  lexicon: LSJ
  rationale: The combination with ἄν expresses a hypothetical condition. First-person singular is retained, reflecting the mother's quoted or represented speech/thought.
- source_word: θάπτοντα
  chosen: would bury
  alternatives:
  - would be burying
  - burying
  lexicon: LSJ
  rationale: Rendered as a finite English verb to make the Greek participial construction idiomatic in context, expressing the action consequent on the hypothetical condition.
- source_word: τῶν υἱῶν
  chosen: of my sons
  alternatives:
  - from among my sons
  - of the sons
  lexicon: LSJ
  rationale: Given the maternal context and the implied first-person perspective of ἀποθάνω, 'my sons' best conveys the sense in English.
- source_word: ἕξω τινά
  chosen: some one
  alternatives:
  - one
  - any one
  lexicon: LSJ
  rationale: The phrase indicates an indefinite individual out of the group. 'Some one of my sons' preserves the distributive sense, though the Greek is somewhat compressed.
- source_word: ἀλλὰ
  chosen: But
  alternatives:
  - Yet
  - Instead
  lexicon: LSJ
  rationale: Marks a strong contrast with the expected maternal lament.
- source_word: τούτῳ τῷ θρήνῳ
  chosen: with this lament
  alternatives:
  - in this mourning
  - by this dirge
  lexicon: LSJ
  rationale: θρῆνος denotes lamentation; 'lament' is natural modern English and keeps the solemn tone.
- source_word: οὐδένα ὀλοφύρετο
  chosen: bewailed none of them
  alternatives:
  - lamented none
  - mourned for none of them
  lexicon: LSJ
  rationale: ὀλοφύρομαι is stronger than simple sadness, denoting lamentation/wailing. 'Bewailed' preserves that force. 'None of them' makes explicit the object in context.
- source_word: ἡ ἱερὰ καὶ θεοσεβὴς μήτηρ
  chosen: the holy and God-fearing mother
  alternatives:
  - the sacred and devout mother
  - the consecrated and pious mother
  lexicon: LSJ
  rationale: ἱερά is rendered 'holy' in a morally/religiously elevated sense; θεοσεβής is well captured by 'God-fearing,' a transparent and biblically familiar expression.
