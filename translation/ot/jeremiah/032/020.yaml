  rationale: The Hebrew uses אָדָם generically for humankind. Following the doctrine's gender-accurate principle and contested-terms guidance, the translation should reflect collective humanity without flattening the lexical connection to 'man' entirely. 'Mankind' best balances accuracy and readability here.
