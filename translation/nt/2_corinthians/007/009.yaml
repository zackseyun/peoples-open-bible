id: 2CO.7.9
reference: 2 Corinthians 7:9
source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
translation:
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into repentance[d]; for you were grieved according to God[c][b], so that you might suffer no loss from us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'to repentance.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in a godly manner' or 'as God wills.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you might not be harmed because of us.'
    reason: lexical_alternative
  - marker: d
    text: Sorrow leads to or produces repentance here; they are not the same thing. Repentance describes changed disposition and conduct, not merely feeling sorry. The separate language of regret remains distinct.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  chosen: Now
  alternatives:
  - As it is
  - At present
  lexicon: BDAG
  rationale: Temporal adverb marking Paul's present perspective in contrast to the prior situation; 'Now' is the most natural concise rendering.
- source_word: χαίρω
  chosen: I rejoice
  alternatives:
  - I am glad
  lexicon: BDAG
  rationale: Retains the verbal force and slightly elevated tone appropriate to Paul; 'I am glad' is possible but somewhat flatter.
- source_word: ἐλυπήθητε
  chosen: you were grieved
  alternatives:
  - you were made sorrowful
  - you were saddened
  lexicon: BDAG
  rationale: Passive aorist is best preserved with 'were grieved.' This keeps the repeated verbal pattern across the verse and avoids overinterpreting agency.
- source_word: εἰς μετάνοιαν
  chosen: into repentance
  alternatives:
  - into a reorientation toward God
  - into a change of mind
  - to repentance
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Restore repentance, retaining grief as what led to it; explain that the resulting change is not identical to the grief. Contextual editorial assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: μετάνοιαν
  chosen: repentance
  alternatives:
  - a reorientation toward God
  - a change of mind
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Restore repentance, retaining grief as what led to it; explain that the resulting change is not identical to the grief. Contextual editorial assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: κατὰ θεόν
  chosen: according to God
  alternatives:
  - in a godly manner
  - as God wills
  - godly
  lexicon: BDAG
  rationale: A relatively formal rendering that preserves the Greek expression without prematurely narrowing it. It conveys sorrow measured by or aligned with God, while alternatives like 'godly sorrow' are interpretive expansions.
- source_word: ζημιωθῆτε
  chosen: you might suffer no loss
  alternatives:
  - you might not be harmed
  - you might incur no loss
  lexicon: BDAG
  rationale: Passive subjunctive after ἵνα indicates intended result. 'Suffer no loss' captures the semantic range of ζημιόω here without overstating physical harm.
- source_word: ἐξ ἡμῶν
  chosen: from us
  alternatives:
  - through us
  - because of us
  lexicon: BDAG
  rationale: ἐκ/ἐξ marks source. 'From us' is the most direct rendering, while English readers can infer causative source from context.
