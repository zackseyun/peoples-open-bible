  rationale: Removed a leading English 'Now' that was functioning as a discourse marker rather than translating an explicit source-language now-word.
- timestamp: '2026-08-28T22:15:30Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: grammar
  tier: 1
  from: Gird up your loins like a man; I will question you[a], and you shall make it known to me.
  to: Gird up your loins like a man[a]; I will question you, and inform me.
  rationale: “Inform me” is a natural rendering of the Hiphil of ידע, but the Hebrew וְהוֹדִיעֵנִי is imperatival in this command sequence, not merely predictive. Coordinating it as “and inform me” retains that force and avoids the stiff gloss “you shall make it known to me.” The note properly belongs with the opening imperative clause. The particle נָא contributes exhortative urgency; English need not mechanically render it as either “now” or “please” in this idiomatic command.
