  naturalness: ‘큰 무리의 큰 불법 행위’는 동일한 수식어의 반복으로 어색합니다. ‘그 무리가 저지른 중대한 불법 행위들’로 옮기면 복수형 ἀνομιῶν 및 σοβα한 정도를 자연스럽게 드러내면서, ‘무리’가 행위의 주체임을 분명히 합니다.
  terminology: ‘불법 행위’는 ἀνομία의 법·도덕적 위반 의미를 보존할 수 있습니다. 다만 한국어에서 일반 민법·형법 위반으로만 좁게 읽히지 않도록 병행본문 각주에서 그리스어가 죄를 일반적으로 서술한다는 점을 유지했습니다.
