  from: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
  to: Give me my wives, for whom I have served you, and my children[a], and let me go. You know the work I have done for you.”
  rationale: The lexical record itself notes that the feminine suffix refers especially to the wives, so I make that link explicit while retaining the broader reading in a note. I condensed the repeated service construction without losing Jacob’s appeal to Laban’s knowledge.
