id: T12P.REU.2.1
reference: Testament of Reuben 2:1
unit: verse
book: Testament of Reuben
collection: Testaments of the Twelve Patriarchs
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ νῦν¹ ἀκούσατέ μου, τέκνα μου², ἃ³ εἶδον περὶ τῶν ἑπτὰ⁴ πνευμάτων τῆς πλάνης ἐν τῇ μετανοίᾳ μου⁵.
  language: Greek
translation:
  text: And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my reorientation[r1].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'spirits of error' or 'spirits of delusion.'
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
