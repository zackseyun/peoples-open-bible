theological_decisions:
- issue: ‘돌아일어남’과 심판 후 회복 가능성의 뉘앙스
  chosen_reading: ‘일어날 희망이 없을 것입니다’로 번역해 단순한 신체적 기상이 아니라 최종적 심판과 회복 부재의 뉘앙스를 함께 남겼습니다.
  alternative_readings:
  - ‘일어날 수 없습니다’
  - ‘다시 일어날 희망이 없습니다’
  rationale: 문맥이 무덤-부패 이미지와 연결되므로, 물리적 동작만이 아니라 종말론적 판결의 의미를 함께 전달하는 표현이 적절합니다.
  doctrine_reference: 에녹서 심판 문맥 / 최종 심판 이미지
- issue: ‘Lord of Spirits’의 호칭 처리
  chosen_reading: 본문은 ‘만군의 주님’으로 옮겨 한국어 가독성을 확보했습니다.
  alternative_readings:
  - ‘영들의 주님’
  - ‘영의 주님’
  rationale: 게으즈의 직역형 호칭은 생소하지만, 한국어 성서 용례에서 ‘만군의 주님’이 초월적 주권을 드러내는 관용구로 기능할 수 있어 이를 채택했습니다.
  doctrine_reference: 신명 개념 / 신적 통치 호칭
