  text: Περιπατοῦντός μου εἰς τὸν ἀγρὸν καὶ κατανοοῦντος πτελέαν καὶ ἄμπελον, καὶ διακρίνοντος περὶ αὐτῶν
    καὶ τῶν καρπῶν αὐτῶν, φανεροῦταί μοι ὁ ποιμὴν καὶ λέγει· Τί σὺ ἐν ἑαυτῷ ζητεῖς; Περὶ τῆς πτελέας καὶ
    τῆς ἀμπέλου συζητῶ, φημί, [κύριε,] ὅτι εὐπρεπέσταταί εἰσιν ἀλλήλαις. 2. Ταῦτα τὰ δύο δένδρα, φησίν,
    εἰς τύπον κεῖται τοῖς δούλοις τοῦ Θεοῦ. Ἤθελον, φημί, [κύριε,] γνῶναι τὸν τύπον τῶν δένδρων τούτων
    ὧν λέγεις. Βλέπεις, φησί, τὴν πτελέαν καὶ τὴν ἄμπελον; Βλέπω, φημί, κύριε. 3. Ἡ ἄμπελος, φησίν, αὕτη
    καρπὸν φέρει, ἡ δὲ πτελέα ξύλον ἄκαρπόν ἐστιν· ἀλλ᾿ ἡ ἄμπελος αὕτη, ἐὰν μὴ ἀναβῇ ἐπὶ τὴν πτελέαν,
    οὐ δύναται καρποφορῆσαι πολὺ ἐρριμμένη χαμαί, καὶ ὃν φέρει καρπόν, σεσηπότα φέρει μὴ κρεμαμένη ἐπὶ
    τῆς πτελέας. ὅταν οὖν ἐπιρριφῇ ἡ ἄμπελος ἐπὶ τὴν πτελέαν, καὶ παρ᾿ ἑαυτῆς φέρει καρπὸν καὶ παρὰ τῆς
    πτελέας. 4. βλέπεις οὖν ὅτι καὶ ἡ πτελέα [πολὺν] καρπὸν δίδωσιν, οὐκ ἐλάσσονα τῆς ἀμπέλου, μᾶλλον
    δὲ καὶ πλείονα. | Πῶς, φημί, κύριε, πλείονα; | Ὅτι, φησίν, ἡ ἄμπελος κρεμαμένη ἐπὶ τὴν πτελέαν τὸν
    καρπὸν πολὺν καὶ καλὸν δίδωσιν, ἐρριμμένη δὲ χαμαὶ σαπρὸν καὶ ὀλίγον φέρει. αὕτη οὖν ἡ παραβολὴ εἰς
    τοὺς δούλους τοῦ Θεοῦ κεῖται, εἰς πτωχὸν καὶ πλούσιον. 5. Πῶς, φημί, κύριε; γνώρισόν μοι. Ἄκουε, φησίν·
    ὁ μὲν πλούσιος ἔχει χρήματα πολλά, τὰ δὲ πρὸς τὸν Κύριον πτωχεύει περισπώμενος περὶ τὸν πλοῦτον αὐτοῦ,
    καὶ λίαν μικρὰν ἔχει τὴν ἐξομολόγησιν καὶ τὴν ἔντευξιν πρὸς τὸν Κύριον, καὶ ἣν ἔχει, μικρὰν καὶ βληχρὰν
    καὶ ἄνω μὴ ἔχουσαν δύναμιν. ὅταν οὖν ἀναβῇ ὁ πλούσιος ἐπὶ τὸν πένητα καὶ χορηγήσῃ αὐτῷ τὰ δέοντα,
    πιστεύων ὅτι ὃ ἐργάσεται εἰς τὸν πένητα δυνήσεται τὸν μισθὸν εὑρεῖν παρὰ τῷ Θεῷ—ὅτι ὁ πένης πλούσιός
    ἐστιν ἐν τῇ ἐντεύξει [καὶ τῇ ἐξομολογήσει,] καὶ δύναμιν μεγάλην ἔχει ἡ ἔντευξις αὐτοῦ παρὰ τῷ Θεῷ—
    ἐπιχορηγεῖ οὖν ὁ πλούσιος τῷ πένητι πάντα ἀδιστάκτως· 6. ὁ πένης δὲ ἐπιχορηγούμενος ὑπὸ τοῦ πλουσίου
    ἐντυγχάνει αὐτῷ, τῷ Θεῷ εὐχαριστῶν περὶ τοῦ διδόντος αὐτῷ. κἀκεῖνος ἔτι ἐπισπουδάζει περὶ τοῦ πένητος,
    ἵνα ἀδιάλειπτος γένηται ἐν τῇ ζωῇ αὐτοῦ· οἶδε γὰρ ὅτι ἡ ἔντευξις τοῦ πένητος προσδεκτή ἐστι καὶ πλουσία
    πρὸς τὸν Θεόν. 7. ἀμφότεροι οὖν τὸ ἔργον τελοῦσιν· ὁ μὲν πένης ἐργάζεται τὴν ἔντευξιν ἐν ᾗ πλουτεῖ,
    [ἣν ἔλαβεν ἀπὸ τοῦ Κυρίου·] ταύτην ἀποδίδωσι τῷ Κυρίῳ τῷ ἐπιχορηγοῦντι αὐτῷ. καὶ ὁ πλούσιος ὡσαύτως
    τὸν πλοῦτον ὃν ἔλαβεν ἀπὸ τοῦ Κυρίου ἀδιστάκτως παρέχει τῷ πένητι. καὶ τοῦτο ἔργον μέγα ἐστὶ καὶ δεκτὸν
    παρὰ τῷ Θεῷ, ὅτι συνῆκεν ἐπὶ τῷ πλούτῳ αὐτοῦ καὶ εἰργάσατο εἰς τὸν πένητα ἐκ τῶν δωρημάτων τοῦ Κυρίου
    καὶ ἐτέλεσε τὴν διακονίαν τοῦ Κυρίου ὀρθῶς. 8. παρὰ τοῖς ἀνθρώποις οὖν ἡ πτελέα δοκεῖ καρπὸν μὴ φέρειν,
    καὶ οὐκ οἴδασιν οὐδὲ νοοῦσιν ὅτι, ἐὰν ἀβροχία γένηται, ἡ πτελέα ὕδωρ ἔχουσα τρέφει τὴν ἄμπελον, καὶ
    ἡ ἄμπελος ἀδιάλειπτον ἔχουσα ὕδωρ διπλοῦν τὸν καρπὸν δίδωσι, καὶ ὑπὲρ ἑαυτῆς καὶ ὑπὲρ τῆς πτελέας.
    οὕτω καὶ οἱ πένητες ἐντυγχάνοντες πρὸς τὸν Κύριον ὑπὲρ τῶν πλουσίων πληροφοροῦσι τὸν πλοῦτον αὐτῶν,
    καὶ πάλιν οἱ πλούσιοι χορηγοῦντες τοῖς πένησι τὰ δέοντα πληροφοροῦσι τὰς ψυχὰς αὐτῶν. 9. γίνονται
    οὖν ἀμφότεροι κοινωνοὶ τοῦ ἔργου τοῦ δικαίου. ταῦτα οὖν ὁ ποιῶν οὐκ ἐγκαταλειφθήσεται ὑπὸ τοῦ Θεοῦ,
    ἀλλ᾽ ἔσται ἐπιγεγραμμένος εἰς τὰς βίβλους τῶν ζώντων. 10. μακάριοι οἱ ἔχοντες καὶ συνιέντες ὅτι παρὰ
    τοῦ Κυρίου πλουτίζονται· ὁ γὰρ συν[ίω]ν τοῦτ[ο] δυνήσεται δια[κ]ονῆσαί τ[ι ἀ]γαθόν.
