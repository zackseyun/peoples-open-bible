  verdict: revise
  source_fidelity: 첫 구절의 בַּדִּים은 ‘거짓의’라는 추상 명사가 아니라 거짓을 말하는 사람들(‘liars’)을 가리키므로, ‘거짓의 징조들’은 소유·주체 관계를 충분히 반영하지 못합니다. 나머지 동사 연쇄와 ‘점치는 자들’, ‘지혜로운 자들’, ‘지식’의 대응은 원문의 의미를 대체로 충실히 전달합니다.
  naturalness: ‘거짓말하는 자들의 표징’을 사용하면 의미 관계가 분명하면서도 현대 표준어 합쇼체 문장으로 자연스럽습니다. ‘뒤로 돌려세우시고’는 מֵשִׁיב … אָחוֹר의 사역적 방향성을 간결하게 살립니다.
  terminology: אֹתוֹת는 성경 문맥에서 ‘표징’으로 옮길 수 있으며, בַּדִּים은 ‘거짓말하는 자들’로 명시하는 것이 적절합니다. קֹסְמִים은 ‘점치는 자들’이 중립적이고 정확합니다. 특정 교리적 해석을 추가하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘거짓의 징조들’이 בַּדִּים의 인칭 지시를 추상화함
    rationale: 원문과 영어 감사본은 표징 자체가 ‘거짓’이라고 하기보다 거짓말하는 자들의 표징을 무력하게 하신다고 말합니다. 소유자를 밝혀야 원문의 구문과 대조 구조가 보존됩니다.
