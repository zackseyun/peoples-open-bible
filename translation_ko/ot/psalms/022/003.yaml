  text: וְ/אַתָּ֥ה קָד֑וֹשׁ י֝וֹשֵׁ֗ב תְּהִלּ֥וֹת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/003.yaml
  text: Yet you are holy[a], enthroned on the praises of Israel.
  footnotes:
  - marker: a
    text: Or 'But you are holy, dwelling in the praises of Israel.' The Hebrew participle can be understood as 'sitting/dwelling,' though the royal sense 'enthroned' best fits the poetic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님은 거룩하십니다. 이스라엘의 찬양 위에 좌정하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 찬양 가운데 거하십니다.’ 히브리어는 문자적으로 ‘앉아 계시는’이라는 뜻이며, 문맥에서는 왕이 좌정하는 모습을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  english_pob_choice: My God
  chosen_korean: 하나님
  alternatives_korean:
  - 나의 하나님
  - 오 하나님
  lexicon: WLC; HALOT
  rationale: 1인칭 소유격이 붙은 직접 호칭이므로, 한국어에서는 감탄사 없이 자연스러운 호격인 ‘하나님’으로 시작하되 문맥상 직접 호소를 분명히 했습니다.
- source_word: אֶקְרָא
  english_pob_choice: I cry out
  chosen_korean: 제가 … 부르짖어도
  alternatives_korean:
  - 제가 … 부르짖습니다
  - 제가 … 부릅니다
  lexicon: HALOT
  rationale: 탄식시 문맥에서 קרא는 단순한 부름보다 절박한 호소를 가리키므로, ‘부르짖다’를 써서 POB의 ‘cry out’을 반영했습니다.
- source_word: תַעֲנֶה
  english_pob_choice: you do not answer
  chosen_korean: 주님은 대답하지 않으시고
  alternatives_korean:
  - 주님은 응답하지 않으시고
  - 주님은 답하지 않으시고
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호소이므로 2인칭을 존칭으로 옮겼고, 원문의 부정 응답을 가장 직접적으로 드러내는 ‘대답하다’를 택했습니다.
- source_word: דֻמִיָּה לִי
  english_pob_choice: there is no silence for me / I have no rest
  chosen_korean: 제게는 잠잠함이 없습니다
  alternatives_korean:
  - 제게는 고요함이 없습니다
  - 제게는 쉼이 없습니다
  lexicon: HALOT
  rationale: דומיה의 기본 의미인 ‘잠잠함/고요함’을 살려, 해석을 과도하게 앞서지 않으면서도 한국어로 자연스럽게 읽히는 표현으로 옮겼습니다.
theological_decisions:
- issue: 밤에 대한 마지막 절구의 의미
  chosen_reading: 밤에도 화자의 내적·외적 잠잠함이 없다는 탄식으로 읽었습니다.
  alternative_readings:
  - 밤에도 쉬지 못한다는 뜻으로 옮길 수 있습니다.
  - 밤에도 응답이 없다는 뜻으로 좁혀 읽을 수 있습니다.
  rationale: 히브리어는 ‘잠잠함/고요함’이라는 명사를 사용하므로, 응답 부재와 동일시하지 않고 시적 긴장을 유지하는 번역이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
