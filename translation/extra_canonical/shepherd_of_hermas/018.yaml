  text: Ὅτε οὖν ἐπαύσατο μετ᾿ ἐμοῦ λαλοῦσα, ἦλθον οἱ ἓξ νεανίσκοι οἱ οἰκοδομοῦντες, καὶ ἀπήνεγκαν αὐτὴν
    πρὸς τὸν πύργον, καὶ ἄλλοι τέσσαρες ἦραν τὸ συμψέλιον καὶ ἀπήνεγκαν καὶ αὐτὸ πρὸς τὸν πύργον. τούτων
    τὸ πρόσωπον οὐκ εἶδον, ὅτι ἀπεστραμμένοι ἦσαν. 2. ὑπάγουσαν δὲ αὐτὴν ἠρώτων ἵνα μοι ἀποκαλύψῃ περὶ
    τῶν τριῶν μορφῶν ἐν αἷς μοι ἐνεφανίσθη. ἀποκριθεῖσά μοι λέγει· Περὶ τούτων ἕτερον δεῖ σε ἐπερωτῆσαι
    ἵνα σοι ἀποκαλυφθῇ. 3. ὤφθη δέ μοι, ἀδελφοί, τῇ μὲν πρώτῃ ὁράσει τῇ περυσινῇ λίαν πρεσβυτέρα καὶ ἐν
    καθέδρᾳ καθημένη. 4. τῇ δὲ ἑτέρᾳ ὁράσει τὴν μὲν ὄψιν νεωτέραν εἶχεν, τὴν δὲ σάρκα καὶ τὰς τρίχας πρεσβυτέρας,
    καὶ ἑστηκυῖά μοι ἐλάλει. ἱλαρωτέρα δὲ ἦν ἢ τὸ πρότερον. 5. τῇ δὲ τρίτῃ ὁράσει ὅλη νεωτέρα καὶ κάλλει
    ἐκπρεπεστάτη, μόνας δὲ τὰς τρίχας πρεσβυτέρας εἶχεν· ἱλαρὰ δὲ εἰς τέλος ἦν καὶ ἐπὶ συμψελίου καθημένη.
    6. περὶ τούτων περίλυπος ἤμην λίαν τοῦ γνῶναί με τὴν ἀποκάλυψιν ταύτην. καὶ βλέπω τὴν πρεσβυτέραν
    ἐν ὁράματι τῆς νυκτὸς λέγουσάν μοι· Πᾶσα ἐρώτησις ταπεινοφροσύνης χρήζει· νήστευσον οὖν, καὶ λήμψῃ
    ὃ αἰτεῖς παρὰ τοῦ Κυρίου. 7. ἐνήστευσα οὖν μίαν ἡμέραν, καὶ αὐτῇ τῇ νυκτί μοι ὤφθη νεανίσκος καὶ λέγει
    μοι· Ὅτι σὺ ὑπὸ χεῖρα αἰτεῖς ἀποκαλύψεις ἐν δεήσει, βλέπε μήποτε πολλὰ αἰτούμενος βλάψῃς σου τὴν σάρκα.
    8. ἀρκοῦσίν σοι αἱ ἀποκαλύψεις αὗται. μήτι δύνη ἰσχυροτέρας ἀποκαλύψεις ὧν ἑώρακας ἰδεῖν; 9. ἀποκριθεὶς
    αὐτῷ λέγω· Κύριε, τοῦτο μόνον αἰτοῦμαι, περὶ τῶν τριῶν μορφῶν τῆς πρεσβυτέρας ἵνα ἀποκάλυψις ὁλοτελὴς
    γένηται. ἀποκριθείς μοι λέγει· Μέχρι τίνος ἀσύνετοί ἐστε; ἀλλʼ αἱ διψυχίαι ὑμῶν ἀσυνέτους ὑμᾶς ποιοῦσιν
    καὶ τὸ μὴ ἔχειν τὴν καρδίαν ὑμῶν πρὸς τὸν Κύριον. 10. ἀποκριθεὶς αὐτῷ πάλιν εἶπον· Ἀλλʼ ἀπὸ σοῦ, κύριε,
    ἀκριβέστερον αὐτὰ γνωσόμεθα.
