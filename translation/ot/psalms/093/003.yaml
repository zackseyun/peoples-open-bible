id: PSA.93.3
reference: Psalms 93:3
source:
  edition: WLC
  text: נָשְׂא֤וּ נְהָר֨וֹת יְֽהוָ֗ה נָשְׂא֣וּ נְהָר֣וֹת קוֹלָ֑/ם יִשְׂא֖וּ נְהָר֣וֹת דָּכְיָֽ/ם׀׃
translation:
  text: The rivers have risen, O Yahweh; the rivers have raised their voice; the rivers surge and pound[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The rare final Hebrew word may refer to the waters’ pounding, crashing, or breakers.
    reason: alternative_reading
lexical_decisions:
- source_word: נָשְׂאוּ / יִשְׂאוּ
  chosen: have risen / have raised / raise
  alternatives:
  - raise
  - have raised
  - bear up
  lexicon: HALOT
  rationale: The first occurrence is contextually intransitive, whereas the second and third govern “their voice” and the rare final noun respectively; the varied English constructions represent these uses naturally.
- source_word: נְהָרוֹת
  chosen: rivers
  alternatives:
  - floods
  - streams
  lexicon: HALOT
  rationale: The noun normally denotes 'rivers.' Although many English versions use 'floods' here to fit the storm imagery, the Hebrew word itself is 'rivers,' and the translation philosophy prioritizes the plain lexical sense over tradition unless context compels otherwise. The tumultuous sense is conveyed by the surrounding language.
- source_word: יְהוָה
  chosen: O Yahweh
  alternatives:
  - O Yahweh
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: קוֹלָם
  chosen: their voice
  alternatives:
  - their sound
  - their noise
  lexicon: HALOT
  rationale: קוֹל commonly means 'voice, sound, noise.' 'Their voice' preserves the personifying poetic imagery of the rivers crying out, while remaining idiomatic in English.
- source_word: דָּכְיָם
  chosen: their pounding
  alternatives:
  - their breakers
  - their crashing
  - their pounding
  lexicon: HALOT
  rationale: Retains the rare term’s probable pounding or crashing force without adding the unexpressed and overly specific noun “waves” or deciding that the reference is solely to sound.
