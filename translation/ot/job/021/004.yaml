  text: הֶ֭/אָנֹכִי לְ/אָדָ֣ם שִׂיחִ֑/י וְ/אִם מַ֝דּ֗וּעַ לֹא תִקְצַ֥ר רוּחִֽ/י־־׃
translation:
  text: As for me, is my complaint addressed to a mortal? Why, then, should I not be impatient[a]?
  footnotes:
  - marker: a
    text: Or “If it were addressed to a mortal, why should I not be impatient?”
    reason: alternative_reading
  philosophy: dynamic
