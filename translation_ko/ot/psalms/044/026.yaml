id: PSA.44.26
reference: Psalms 44:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י שָׁ֣חָה לֶ/עָפָ֣ר נַפְשֵׁ֑/נוּ דָּבְקָ֖ה לָ/אָ֣רֶץ בִּטְנֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/026.yaml
  text: Rise up to help us[a] and redeem us[b] for the sake of your steadfast love.[c]
  footnotes:
  - marker: a
    text: Or 'our life' or 'we ourselves' for 'our soul.'
    reason: lexical_alternative
  - marker: b
    text: Or 'has bowed down to the dust.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나셔서 우리를 도우시고,[a] 주의 한결같은 사랑을 위하여 우리를 속량해 주십시오.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리에게 도움이 되어’입니다. 히브리어는 ‘돕다’가 아니라 ‘도움’이라는 명사를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속량해’는 ‘구해 내어’ 또는 ‘구원해’로도 옮길 수 있습니다. 히브리어 동사는 대가를 치르고 풀어 주는 것 또는 결정적으로 건져 내는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘한결같은 사랑’은 히브리어 헤세드(חסד)를 옮긴 말로, 신실하고 충성스러운 사랑을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁחָה + לֶעָפָר
  english_pob_choice: has sunk down to the dust / has bowed down to the dust
  chosen_korean: 티끌에까지 내려앉았고
  alternatives_korean:
  - 티끌로 굽어졌고
  - 티끌에까지 낮아졌고
  lexicon: HALOT
  rationale: שָׁחָה의 ‘낮아짐/굽어짐’과 לֶעָפָר의 ‘dust’를 함께 살리되, 현대 한국어에서 자연스럽고 시적 이미지가 유지되는 ‘내려앉다’를 택했습니다.
- source_word: נַפְשֵׁנוּ
  english_pob_choice: our soul
  chosen_korean: 우리의 영혼
  alternatives_korean:
  - 우리의 생명
  - 우리 자신
  lexicon: HALOT
  rationale: 네페쉬의 폭넓은 의미를 한 가지로 축소하지 않으면서, 시적 탄식에서 영어 POB의 ‘our soul’에 가장 가까운 표준어 표현으로 옮겼습니다.
- source_word: דָּבְקָה לָאָרֶץ
  english_pob_choice: clings to the earth
  chosen_korean: 땅에 달라붙어 있습니다
  alternatives_korean:
  - 땅에 들러붙어 있습니다
  - 땅에 꼭 달라붙어 있습니다
  lexicon: HALOT
  rationale: דָּבַק의 강한 부착 이미지를 살리면서도, 현대 한국어에서 구어적 과장이 적은 ‘달라붙다’를 사용해 몸이 땅에 눕혀진 상태를 분명히 드러냈습니다.
- source_word: בִּטְנֵנוּ
  english_pob_choice: our belly
  chosen_korean: 우리의 배
  alternatives_korean:
  - 우리의 배 속
  - 우리의 복부
  lexicon: HALOT
  rationale: 비트넨우의 문자적 이미지를 그대로 옮기되, 한국어에서는 ‘배’가 가장 자연스럽고 시편의 병행구에서 신체 전체가 땅에 눌린 모습을 전달합니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역 범위
  chosen_reading: 우리의 영혼
  alternative_readings:
  - 우리의 생명
  - 우리 자신
  rationale: 이 시는 탄식시로서 האדם의 내적·존재적 깊이를 의도하므로, 범위를 평면화하지 않고 ‘영혼’으로 두어 원문의 긴장을 보존했습니다.
  doctrine_reference: 시편의 시적 인류학; 번역 철학 §3, §6
- issue: 신체 이미지의 직설성
  chosen_reading: 배는 땅에 달라붙어 있습니다
  alternative_readings:
  - 몸은 땅에 붙어 있습니다
  - 배가 땅에 닿아 있습니다
  rationale: 히브리어는 신체가 실제로 땅에 압착된 강한 이미지를 제시하므로, 이를 완화하지 않고 직설적으로 옮겨 탄식의 강도를 살렸습니다.
  doctrine_reference: 시편 44편의 집단 탄원 문맥
