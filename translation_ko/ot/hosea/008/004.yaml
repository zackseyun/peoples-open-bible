  text: הֵ֤ם הִמְלִיכוּ֙ וְ/לֹ֣א מִמֶּ֔/נִּי הֵשִׂ֖ירוּ וְ/לֹ֣א יָדָ֑עְתִּי כַּסְפָּ֣/ם וּ/זְהָבָ֗/ם עָשׂ֤וּ לָ/הֶם֙ עֲצַבִּ֔ים לְמַ֖עַן יִכָּרֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/004.yaml
  text: They made kings, but not from me; they appointed princes, but I did not know it. With their silver and their gold they made idols for themselves, so that they might be cut off.
translation:
  language: ko
  text: 그들은 왕들을 세웠으나 나에게서 나온 것이 아니며, 통치자들을 세웠으나 나는 알지 못했습니다. 그들은 자기들의 은과 금으로 자기들을 위하여 우상들을 만들었으니, 그들이 끊어지게 하려고 한 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִמְלִיכוּ
  english_pob_choice: They made kings
  chosen_korean: 왕들을 세웠으나
  alternatives_korean:
  - 왕들을 만들었으나
  - 왕들로 삼았으나
  lexicon: Qal/Hiphil of מלך
  rationale: 통치자를 ‘세우다’로 옮겨 사람을 왕위에 올리는 행위를 자연스럽게 드러내되, 인위적 임명이라는 뉘앙스를 유지했습니다.
- source_word: מִמֶּנִּי
  english_pob_choice: from me
  chosen_korean: 내게서 난 것이 아니며
  alternatives_korean:
  - 내게서가 아니며
  - 나로부터가 아니며
  lexicon: מִן
  rationale: POB의 ‘from me’를 그대로 반영하되, 출처·기원 거부의 의미가 분명하도록 ‘난 것이 아니다’로 풀었습니다.
- source_word: עֲצַבִּים
  english_pob_choice: idols
  chosen_korean: 우상들
  alternatives_korean:
  - 우상
  - 조각상들
  lexicon: עצב
  rationale: 문맥상 금속 재료로 만든 예배 대상이므로 표준적인 ‘우상들’이 가장 직접적입니다.
theological_decisions:
- issue: ‘from me’의 신학적 뉘앙스
  chosen_reading: 이스라엘의 왕정과 정치적 권위가 야훼의 뜻과 기원에서 이탈했음을 분명히 드러내는 진술로 읽었습니다.
  alternative_readings:
  - 단순히 하나님의 사전 인지 부재
  - 절차상의 승인 부재
  rationale: 이어지는 ‘나는 그것을 알지 못했습니다’와 평행을 이루며, 단순 정보 부재보다 관계적·언약적 거절을 강하게 시사합니다.
  doctrine_reference: '호세아 8장 문맥: 언약 불순종과 우상숭배에 대한 심판'
