  rationale: 'Lexical reconsideration of the prior simplified rendering: Περίζωσαι and περιεζωσάμην specify
    girding oneself, not merely putting on clothing; περιεζωσμένον in paragraph 2 recalls that same action.
    The proposed wording makes the waist-binding explicit in all three places without specifying a particular
    garment shape. Independently, οἵους agrees with καρπούς, so paragraph 6 must compare fruit rather
    than rods. Restoring the fruit comparison also removes the unsupported claim that the crowned people
    held the rods.'
