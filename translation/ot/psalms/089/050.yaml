  from: Remember, Lord, the reproach of your servants—how I bear in my bosom[b] the reproach of all the many peoples.[a]
  to: Remember, Lord, the reproach your servants endure—how I bear in my heart the reproach from all the many peoples[a].
  rationale: The latest revision rightly restores “all” and supplies the repeated “reproach” from the first clause. Its preference for “of” preserves formal compression but leaves the direction unclear; the following verse supports making “from” explicit.
