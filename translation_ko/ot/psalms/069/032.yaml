  rationale: 원문 WLC에 따라 절 전체를 새로 번역했습니다. רָאוּ는 완료된 봄을 ‘보고’로, יִשְׂמָחוּ는 그 결과의 기쁨을 ‘기뻐할 것입니다’로 옮겼습니다. דֹּרְשֵׁי אֱלֹהִים은 뒤따르는 복수 소유 접미사에 맞추어 직접 호격인 ‘하나님을 찾는 여러분’으로 번역했습니다. וִיחִי לְבַבְכֶם의 단수 집합명사 ‘마음’과 기원/권면의 뉘앙스는 ‘여러분의 마음이 살아나기를 바랍니다’로 보존했습니다.
