  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Sense of חָסִיד
  chosen_reading: the godly
  alternative_readings:
  - the faithful one
  - the loyal one
  - the pious one
  rationale: The term carries covenantal and ethical weight, but the verse does not require a narrower doctrinal reading. 'The godly' preserves the broad sense of one marked by devotion and covenant loyalty.
