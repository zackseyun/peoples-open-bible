  source_fidelity: ‘내가 알기로는’은 οἶδα(‘나는 안다’)의 확신을 약화하며, ‘그에게서 들으십시오’는 αὐτοῦ ἀκούετε(그의 말을 들으라)의 직접 목적 관계를 다소 부자연스럽게 옮깁니다. 또한 ‘아버지와 같을 것입니다’는 εἰς πατέρα의 단정적 역할 진술을 비교 표현으로 약화합니다.
  naturalness: 합쇼체와 복수 청자 표지는 적절합니다. 다만 ‘그의 말을 평생 들으십시오’가 현대 한국어에서 더 자연스럽고, 지속 명령도 명료하게 드러냅니다.
  terminology: ἀνὴρ βουλῆς는 단순한 일반 지능을 뜻하는 ‘지혜로운 사람’보다 판단과 조언의 역량을 포함하는 ‘분별 있는 사람’이 문맥과 원문에 더 가깝습니다. ‘아버지가 될 것입니다’는 생물학적 관계를 주장하기보다 본문에 있는 지도·보호의 역할 언어를 보존합니다.
  issues:
