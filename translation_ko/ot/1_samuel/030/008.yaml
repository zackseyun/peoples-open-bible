- from: 다윗이 야훼께 여쭈며 말했습니다. “이 약탈대를 뒤쫓아가야 합니까? 내가 그들을 따라잡겠습니까?” 그러자 그가 다윗에게 말씀하셨습니다. “뒤쫓아가라. 네가 반드시 따라잡을 것이며, 반드시 구출할 것이다.”
  to: 다윗이 야훼께 여쭈며 말했습니다. “이 약탈대를 추격하겠습니까? 내가 그들을 따라잡겠습니까?” 그러자 야훼께서 다윗에게 말씀하셨습니다. “추격하십시오. 당신이 반드시 그들을 따라잡을 것이며, 반드시 구출할 것입니다.”
  rationale: 의미와 강조는 보존하면서, 직접 인용문의 명령·미래 진술을 현대 공식 합쇼체로 일관되게 고쳤습니다. ‘야훼께서’를 명시하여 히브리어 대명사의 문맥상 선행사를 한국어에서 분명히 했습니다.
