id: PSA.9.16
reference: Psalms 9:16
source:
  edition: WLC
  text: נ֤וֹדַ֨ע יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּ/פֹ֣עַל כַּ֭פָּי/ו נוֹקֵ֣שׁ רָשָׁ֑ע הִגָּי֥וֹן סֶֽלָה׀׃
translation:
  text: Yahweh is known by the judgment he has executed; the wicked are snared by the work of their own hands. Higgaion[a]. Selah[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: An uncertain musical or liturgical term, possibly meaning “meditation” or “resounding music.”
    reason: lexical_alternative
  - marker: b
    text: An uncertain musical or liturgical direction.
    reason: lexical_alternative
lexical_decisions:
- source_word: נודע
  chosen: is known
  alternatives:
  - is known
  - has become known
  lexicon: HALOT
  rationale: Directly represents the passive/stative reading while the note preserves the viable resultative alternative.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: מִשְׁפָּט עָשָׂה
  chosen: he has executed judgment
  alternatives:
  - has done justice
  - has performed judgment
  lexicon: HALOT
  rationale: Keeps the Hebrew clause independent rather than imposing an instrumental syntactic relation.
- source_word: בפעל כפיו
  chosen: by the work of his own hands
  alternatives:
  - in the work of his hands
  - through the work of his hands
  lexicon: HALOT
  rationale: The preposition with פעל indicates instrument or circumstance. The phrase refers to the wicked person's own deeds as the means of his downfall. 'Own' is supplied in English to make the possessive force explicit.
- source_word: נוקש
  chosen: is snared
  alternatives:
  - is trapped
  - is caught
  lexicon: HALOT
  rationale: The verb denotes being ensnared or trapped, often in a figurative sense. 'Is snared' preserves the metaphor and matches the judicial-retributive context.
- source_word: רשע
  chosen: the wicked
  alternatives:
  - the wicked man
  - a wicked person
  lexicon: HALOT
  rationale: The singular adjective functions substantivally. 'The wicked' is concise and idiomatic, while preserving the representative singular.
- source_word: הגיון
  chosen: Higgaion
  alternatives:
  - meditation
  - resounding music
  - interlude
  lexicon: HALOT
  rationale: The term is difficult and likely a musical/liturgical notation. Transliteration is preferable in the main text because no single English gloss is certain; lexical alternatives are preserved in a footnote.
- source_word: סלה
  chosen: Selah
  alternatives:
  - interlude
  - pause
  lexicon: HALOT
  rationale: This is conventionally left untranslated because its precise force remains uncertain, likely a liturgical or musical marker.
