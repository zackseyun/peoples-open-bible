  source_fidelity: 현 초안은 시편 34:22가 아니라 바로 앞 절(34:21)의 히브리어 내용(‘악이 악인을 죽이고…’)을 번역하고 있습니다. WLC 본문인 ‘야훼께서 그의 종들의 생명을 속량하시며, 그에게 피하는 자는 아무도 유죄가 되지 않는다’로 전면 교정해야 합니다.
  naturalness: 교정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘그분께 피하는 사람’은 חסה의 피난처 이미지를 보존하면서도 자연스럽고, ‘유죄로 판정되지 않을 것입니다’는 משפט적 의미를 명료하게 전달합니다.
  terminology: יְהוָה는 POB의 방침과 영어 감사 기록을 따라 ‘야훼’로, פדה는 ‘속량하다’로 옮겼습니다. נֶפֶשׁ은 비이원론적 의미를 보존하도록 ‘생명’으로 옮기고 대안을 각주로 제시했습니다. אשם의 법정적 죄책 의미는 ‘유죄로 판정되다’로 반영했습니다.
  issues:
