  - 모욕
  lexicon: none
  rationale: 문맥상 단순한 감정적 수치심보다 사람들 앞에서 ‘조롱과 경멸의 대상’이 되는 상태를 가리키므로, 현대 한국어에서 자연스럽고 직접적인 ‘수치’로 옮겼습니다.
- source_word: הָיִיתִי
  english_pob_choice: I became
  chosen_korean: 나는 … 되었습니다
