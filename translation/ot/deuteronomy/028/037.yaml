id: DEU.28.37
reference: Deuteronomy 28:37
source:
  edition: WLC
  text: וְ/הָיִ֣יתָ לְ/שַׁמָּ֔ה לְ/מָשָׁ֖ל וְ/לִ/שְׁנִינָ֑ה בְּ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁר יְנַהֶגְ/ךָ֥ יְהוָ֖ה שָֽׁמָּ/ה־׃
translation:
  text: You will become an object of horror, a byword, and a taunt among all the peoples where Yahweh will drive you.
  philosophy: dynamic
lexical_decisions:
- source_word: וְהָיִיתָ
  chosen: And you shall become
  alternatives:
  - And you shall be
  lexicon: HALOT
  rationale: Qal perfect with prefixed conjunction in this curse sequence has future/resultative force. 'Become' brings out the resulting state more naturally in English than the stative 'be' while staying close to the Hebrew.
- source_word: לְשַׁמָּה
  chosen: an object of horror
  alternatives:
  - a horror
  - an astonishment
  - a desolation
  lexicon: HALOT
  rationale: שַׁמָּה in judgment contexts denotes something appalling that causes horror/astonishment. 'Object of horror' communicates that Israel becomes the thing reacted to, which fits the lamed predicate construction and the curse context better than the more abstract 'desolation' here.
- source_word: לְמָשָׁל
  chosen: a proverb
  alternatives:
  - a byword
  lexicon: HALOT
  rationale: מָשָׁל commonly means 'proverb' or 'byword.' 'Proverb' is the more direct lexical equivalent; the negative force is supplied by the curse context and the surrounding terms.
- source_word: וְלִשְׁנִינָה
  chosen: a taunt
  alternatives:
  - a byword
  - a mockery
  - an object of scorn
  lexicon: HALOT
  rationale: שְׁנִינָה refers to a cutting saying, taunt, or derisive byword. 'Taunt' captures the hostile speech dimension and avoids flattening it into a duplicate of מָשָׁל.
- source_word: בְּכֹל הָעַמִּים
  chosen: among all the peoples
  alternatives:
  - among all the nations
  lexicon: HALOT
  rationale: עַמִּים is the plural of 'peoples.' 'Among all the peoples' is more formally aligned with the Hebrew than 'nations,' while remaining natural English.
- source_word: אֲשֶׁר יְנַהֶגְךָ
  chosen: where the LORD will drive you
  alternatives:
  - to which the LORD will lead you
  - where the LORD will lead you
  lexicon: HALOT
  rationale: The verb נהג can mean lead, drive, or conduct. In this curse context of exile and dispersal, 'drive' better conveys forced removal and judgment than the neutral 'lead.' The relative clause is rendered idiomatically with 'where' for destination.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives: []
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: שָׁמָּה
  chosen: you
  alternatives:
  - there
  lexicon: HALOT
  rationale: The adverb means 'there,' but in English the sense is naturally absorbed into 'where the LORD will drive you.' Explicitly repeating 'there' would sound redundant.
