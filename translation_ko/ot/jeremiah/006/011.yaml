- from: 그러나 나는 야훼의 진노로 가득 차 있습니다. 더는 그것을 억누를 수 없습니다. 거리의 어린아이 위에, 그리고 젊은이들의 무리 위에 함께 쏟아부으십시오. 남자와 여자 모두 붙잡히고, 노인과 나이가 매우 많은 이도 마찬가지입니다.[a]
