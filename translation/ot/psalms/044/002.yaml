id: PSA.44.2
reference: Psalms 44:2
source:
  edition: WLC
  text: אַתָּ֤ה יָדְ/ךָ֡ גּוֹיִ֣ם ה֭וֹרַשְׁתָּ וַ/תִּטָּעֵ֑/ם תָּרַ֥ע לְ֝אֻמִּ֗ים וַֽ/תְּשַׁלְּחֵֽ/ם׀׃
translation:
  text: With your hand you drove out nations and planted our ancestors; you crushed peoples and sent them away[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'you crushed peoples but caused our ancestors to spread out'; the final 'them' may refer to Israel's ancestors rather than the displaced peoples.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדְךָ
  chosen: With your hand
  alternatives:
  - your hand
  - by your hand
  lexicon: HALOT
  rationale: The emphatic opening is naturally rendered 'With your hand.'
- source_word: גּוֹיִם
  chosen: nations
  alternatives:
  - Gentiles
  - peoples
  lexicon: HALOT
  rationale: In this historical context the term refers to foreign national groups inhabiting the land, not specifically 'Gentiles' as a later Jewish/Christian contrast. 'Nations' is the most natural and contextually precise rendering.
- source_word: הוֹרַשְׁתָּ
  chosen: drove out
  alternatives:
  - dispossessed
  - expelled
  lexicon: HALOT
  rationale: The Hiphil of ירשׁ commonly means to cause to lose possession, especially in conquest contexts. 'Drove out' is idiomatic and clear, while still reflecting the force of dispossession.
- source_word: וַתִּטָּעֵם
  chosen: and planted our ancestors
  alternatives:
  - and planted our fathers
  - and settled them
  - and planted them
  lexicon: HALOT
  rationale: The suffix refers back to the ancestors named in the preceding verse, not to the nations just expelled; English must supply the referent.
- source_word: תָּרַע
  chosen: you crushed
  alternatives:
  - you harmed
  - you broke
  - you afflicted
  lexicon: HALOT
  rationale: In parallel with driving out the nations, the verb expresses God breaking or crushing the peoples.
- source_word: לְאֻמִּים
  chosen: peoples
  alternatives:
  - nations
  - tribes
  lexicon: HALOT
  rationale: This term overlaps with 'nations' but is distinct in the Hebrew parallelism. Rendering it as 'peoples' preserves the poetic variation without flattening the line.
- source_word: וַתְּשַׁלְּחֵם
  chosen: and sent them away
  alternatives:
  - and sent them away
  - and let them go
  - and cast them out
  - and spread them abroad
  lexicon: HALOT
  rationale: 'The immediate referent is the displaced peoples: God sent them away. A reading in which Israel''s ancestors were spread abroad remains possible.'
