  meaning: The wicked are so intent on evil that they cannot sleep without doing wrong and causing someone else to stumble.
  meaning_decisions:
  - source_phrase: לֹא יִשְׁנוּ
    prior_rendering: they do not sleep
    new_rendering: they cannot sleep
    rationale: The parallel statement about lost sleep portrays compulsive restlessness, not merely a choice to remain awake; “cannot sleep” conveys that force.
  - source_phrase: וְנִגְזְלָה שְׁנָתָם אִם לֹא יכשולו
    prior_rendering: and their sleep is taken away unless they make someone stumble
    new_rendering: they are robbed of sleep unless they have made someone stumble
    rationale: “Robbed of sleep” preserves the force of גזל in natural English, while the present perfect expresses the wrongdoing that must precede sleep and parallels “have done evil.”
