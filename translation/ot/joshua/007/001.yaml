  from: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
  to: But the Israelites acted unfaithfully regarding the things devoted to Yahweh[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of them; so Yahweh's anger burned against the Israelites.
  rationale: The lexical and theological records rightly emphasize covenantal unfaithfulness and Israel's corporate involvement, both of which remain. Joshua 6:17–19 requires broadening 'devoted to destruction' for the stolen goods, since the silver and gold were reserved for Yahweh rather than marked for destruction.
