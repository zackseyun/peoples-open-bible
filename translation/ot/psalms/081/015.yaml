id: PSA.81.15
reference: Psalms 81:15
source:
  edition: WLC
  text: מְשַׂנְאֵ֣י יְ֭הוָה יְכַֽחֲשׁוּ ל֑/וֹ וִ/יהִ֖י עִתָּ֣/ם לְ/עוֹלָֽם־׃
translation:
  text: Those who hate Yahweh would pretend to submit to him, and their doom would last forever[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'Hebrew: ''their time would be forever.'' Some understand this as Israel''s enduring time of security rather than the enemies'' lasting doom.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׂנְאֵי
  chosen: those who hate
  alternatives:
  - the haters of
  - those hating
  lexicon: HALOT
  rationale: Participle used substantivally; 'those who hate' is natural modern English and preserves the ongoing character of the group.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Follows the project's default rendering for the divine name.
- source_word: יְכַחֲשׁוּ לוֹ
  chosen: would pretend to submit to him
  alternatives:
  - would submit to him falsely
  - would feign obedience to him
  - would cower before him
  lexicon: HALOT
  rationale: The expression denotes false or feigned submission in this context.
- source_word: וִיהִי
  chosen: would be
  alternatives:
  - and it would be
  - then would be
  lexicon: HALOT
  rationale: Jussive/imperfect form in poetic sequence; rendered idiomatically as a modal future-like statement in English.
- source_word: עִתָּם
  chosen: their time
  alternatives:
  - their fate
  - their season
  - their punishment
  lexicon: HALOT
  rationale: The noun עת normally means 'time' or 'season.' While some interpreters understand the line as referring to fate or punishment, the lexical base is temporal, so 'their time' best preserves the Hebrew while allowing the poetic ambiguity to remain.
- source_word: לְעוֹלָם
  chosen: forever
  alternatives:
  - for eternity
  - perpetually
  lexicon: HALOT
  rationale: Standard rendering of לעולם in poetic context; concise and natural.
- source_word: וִיהִי עִתָּם לְעוֹלָם
  chosen: and their time would last forever
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This supplies natural English syntax while retaining the Hebrew noun “time” and avoiding an unwarranted choice among fate- or doom-related implications.
