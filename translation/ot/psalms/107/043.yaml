theological_decisions:
- issue: Rendering of the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Gender representation in the singular opening with subsequent plural verb
  chosen_reading: Who is wise? Let him keep these things, and let them consider...
  alternative_readings:
  - Who is wise? Let him keep these things and consider...
  - Let the wise keep these things and consider...
  rationale: The Hebrew begins with a masculine singular rhetorical question and then shifts to a plural verb. Following the gender-accurate guideline, the singular representative force is preserved with 'him' in the first clause, while the plural shift is reflected in the second clause with 'them.' This keeps the source-text tension rather than smoothing it away.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3 and #4'
revisions:
- timestamp: '2026-04-21T00:25:45Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/107/043.json
  category: awkward_english
  tier: 1
  from: and let them consider
  to: and let the wise consider
  rationale: The current rendering preserves the Hebrew shift from a singular verb to a plural verb by using 'Let him... and let them...'. However, in English, this creates a grammatical awkwardness, as the pronoun 'them' lacks a clear antecedent. The reader is forced to deduce that 'them' refers to the class of people represented by 'him'. Making the implied subject of the plural verb explicit ('the wise') resolves this ambiguity with minimal paraphrase, improving readability while remaining faithful to the meaning and plural form of the Hebrew.
- timestamp: '2026-04-23T11:30:17Z'
  adjudicator: azure-gpt-5.4-revision-pass
  reviewer_model: gpt-5.4
  category: revision_pass
  from: Who is wise? Let him keep these things, and let the wise consider the steadfast love of the LORD.
  to: Who is wise? Let him keep these things, and let them consider the steadfast love of the LORD.
  rationale: Replaced the second 'the wise' with 'them' to reflect the plural verb without adding a repeated noun not present in the source. Kept 'keep these things' and 'steadfast love of the LORD' as accurate and natural.
- timestamp: '2026-08-28T22:09:38Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: awkward_english
  tier: 1
  from: Who is wise? Let him keep these things[a][b], and let them consider the steadfast love of Yahweh.
  to: Who is wise? Let him heed these things and consider Yahweh’s acts of steadfast love.[a][b]
  rationale: “Heed these things” naturally conveys שמר in this concluding wisdom exhortation, where attentive observance of the psalm’s lessons is intended rather than literal possession or guarding. Coordinating “consider” with the singular exhortation removes the antecedentless English “them”; the note candidly preserves the Hebrew’s shift to a plural verb. “Acts of steadfast love” is a natural, source-responsive rendering of plural חַסְדֵי, communicating multiple manifestations without the unnatural literal plural “steadfast loves.”
- timestamp: '2026-11-09T18:44:17Z'
  adjudicator: gpt-6.1-sol-meaning-pass
