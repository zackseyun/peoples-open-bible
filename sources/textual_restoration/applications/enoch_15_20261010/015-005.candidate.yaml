translation:
  text: Therefore I gave them women, so that they might sow seed in them[a] and children might
    be born through them, so that in this way work might not fail for them on the earth[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “sow upon them”; the feminine pronoun refers to the women. The following
      birth-expression likewise refers to the women through whom children are born.
    reason: textual_variant
  - marker: b
    text: The selected Ethiopic daggers the final feminine expression †በላዕሌሆን፡†, literally “upon
      them.” “For them” is a provisional contextual rendering of that crux, not a secure literal
      reading. The Greek speaks of work not failing for them on earth; it does not remove the
      uncertainty in the selected Ethiopic.
    reason: textual_variant
