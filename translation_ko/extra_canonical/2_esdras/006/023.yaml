source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tuba canet cum sono, quam cum omnes audierint subito expavescent.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/023.yaml
  text: And the trumpet will sound, and when all hear it, they will suddenly be terrified.
translation:
  language: ko
  text: 그리고 나팔이 큰 소리로 울릴 것입니다. 모든 사람이 그 소리를 들으면 갑자기 두려움에 사로잡힐 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et tuba canet cum sono
  english_pob_choice: And the trumpet will sound
  chosen_korean: 그리고 나팔이 울릴 것입니다
  alternatives_korean:
  - 그리고 나팔이 크게 울릴 것입니다
  - 그리고 나팔 소리가 날 것입니다
  lexicon: tuba → 나팔; canet → 울릴 것입니다
  rationale: 라틴어는 나팔이 ‘소리와 함께’ 울린다고 말하지만, 영어 POB의 수정처럼 중복을 피하면서도 ‘울리다’로 소리의 발생을 충분히 담을 수 있습니다.
- source_word: cum omnes audierint
  english_pob_choice: when all hear it
  chosen_korean: 모든 사람이 그것을 들으면
  alternatives_korean:
  - 모두 그것을 들으면
  - 사람들이 모두 그것을 들으면
  lexicon: omnes → 모든 사람들; audierint → 들으면
  rationale: audierint는 청각적 인지를 뜻하므로, 단순히 ‘듣다’로 옮겨 사건의 직접적 반응을 살렸습니다.
- source_word: subito expavescent
  english_pob_choice: they will suddenly be terrified
  chosen_korean: 곧바로 두려워할 것입니다
  alternatives_korean:
  - 순식간에 두려워할 것입니다
  - 갑자기 경악할 것입니다
  lexicon: subito → 곧바로/갑자기; expavescent → 두려워할 것입니다
  rationale: expavescent는 강한 공포 반응을 가리키므로 ‘두려워하다’로 번역하되, ‘곧바로’로 즉시성을 보완했습니다.
