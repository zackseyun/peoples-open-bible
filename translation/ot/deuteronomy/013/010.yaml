  meaning_decisions:
  - source_phrase: כִּי הָרֹג תַּהַרְגֶנּוּ
    prior_rendering: For you must surely put him to death
    new_rendering: Instead, you must put that person to death without fail.
    rationale: Following the prohibitions against sparing or shielding the offender, the clause states the required action instead; ‘without fail’ conveys the emphatic obligation, and ‘that person’ includes every relationship listed in verse 7.
  - source_phrase: יָדְךָ תִּהְיֶה בּוֹ בָרִאשׁוֹנָה לַהֲמִיתוֹ וְיַד כָּל הָעָם בָּאַחֲרֹנָה
    prior_rendering: your hand shall be first against him to put him to death, and afterward the hand of all the people
    new_rendering: You must be the first to strike, and afterward all the people must join in
    rationale: The hand construction requires the person solicited to act physically first in the execution, followed by the community; it does not merely assign supervisory responsibility.
