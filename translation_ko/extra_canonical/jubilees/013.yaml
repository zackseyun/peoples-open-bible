  text: '15[24]. And Pharaoh sent away Sarai, Abram’s wife, and expelled him from the land of Egypt. And he went to the place where he had pitched his tent at first, between Bethel on the west and Ai on the east, to the place of the altar, and he blessed the LORD his God who had brought him back in peace.

    16. And in the forty-first jubilee, in the third year of the first week, he entered that place and built there an altar, and he called on the name of the LORD.

    17. And he said, “You are God Most High, my God forever and ever.” And in the fourth year of this week, Lot separated from him, and Lot settled in Sodom; and the men of Sodom were very sinful.

    18[23]. And it was grievous in his heart that his brother’s son had separated from him, for he had no children.

    19. In that year, when Lot had been taken captive, the LORD said to Abram, after Lot had separated from him, in the fourth year of this week, “Lift up your eyes from the place where you are dwelling, northward and southward and westward and eastward,

    20. for all the land that you see I will give to you and to your seed forever. And I will make your seed like the sand of the sea; if a man can count the dust of the earth, then your seed also

    21. will be innumerable. Rise, walk through the land in its length and its breadth, and see it all,

    22. for I will give it to your seed.” And Abram went to Hebron and settled there. And in this year Chedorlaomer king of Elam came, and Amraphel king of Shinar, and Arioch king of Ellasar,

    23. and Tidal king of nations; and they struck the king of Gomorrah and the king of Sodom, and many fell into the bitumen pits in the Salt Sea valley. And they took Sodom and Admah and Zeboiim, and they took Lot also, Abram’s brother’s son, and all his possessions, and they went as far as Dan.

    24. And one who had escaped came and told Abram that his brother’s son had been taken captive. And he armed the servants born in his house . . . Upon Abram and upon his seed he laid the first tithe for the LORD, and the LORD made it an ordinance forever, that they should give it to the priests who minister before him,

    25. that they might possess it forever.

    26. And for this law there is no limit of days, for he ordained it for the generations forever: that they should give a tenth of everything to the LORD, from seed and from wine and from oil,

    27. and from cattle and from sheep. And he gave it to his priests to eat and to drink with rejoicing

    28. before him. And the king of Sodom came near and bowed before him, and said, “Our lord Abram,

    29. give us the persons whom you rescued, but let the goods be yours.” And Abram said to him, “I have lifted up my hands to God Most High: not from a thread even to a sandal strap will I take anything that is yours, lest you should say, ‘I have made Abram rich’—except only what the young men have eaten, and the share of the men who went with me, Aner and Eshcol and Mamre[26][24]; let them take their share.”'
  footnotes:
  - marker: '24'
    text: The verse is textually difficult and appears segmentationally compressed in this edition. After 'he armed the servants born in his house' the text shifts abruptly to the institution of the tithe. A fuller underlying narrative likely stood here.
    reason: segmentation_note
  - marker: '23'
    text: The sequence of city names and battle details follows the Ge'ez closely, though the syntax is compressed and may reflect a condensed retelling of Genesis 14.
    reason: cross_reference
  - marker: '24'
    text: '''The first tithe'' could also be rendered ''the chief tithe'' or understood as an initial tithe associated with first produce; the Ge''ez wording is unusual.'
    reason: lexical_alternative
  - marker: '26'
    text: '''From seed'' likely refers to agricultural produce or yield, not merely seed reserved for sowing.'
    reason: cultural_note
translation:
  language: ko
  text: '15. 파라오가 사래, 곧 아브람의 아내를 내보내고 그를 이집트 땅에서 쫓아냈습니다. 그는 처음에 장막을 쳤던 곳, 곧 서쪽에는 벧엘이 있고 동쪽에는 아이가 있는 제단의 자리로 갔습니다. 그리고 그는 자기를 평안히 돌아오게 하신 그의 하나님이신 주님을 찬양했습니다.

    16. 그리고 제41 희년 첫째 주의 셋째 해에, 그는 이곳으로 돌아와 그 위에 희생 제물을 바치고 야훼의 이름을 불렀습니다.

    17. 그리고 그가 말했습니다. “당신은 지극히 높으신 하나님, 영원히 영원토록 제 하나님이십니다.” 그리고 이 주간의 일곱째 해에 롯은 그에게서 갈라져 나왔고, 소돔에 살게 되었습니다. 소돔 사람들은 매우 죄가 많았습니다.

    18. 그의 형제의 아들이 그에게서 떼어져 나가게 된 것이 그의 마음을 괴롭게 하였습니다. 이는 그에게 자녀가 없었기 때문입니다.

    19. 롯이 사로잡혔던 그 해, 롯이 아브람에게서 떠난 뒤, 이 주간의 넷째 해에 주님께서 아브람에게 말씀하셨습니다. “네가 거주하고 있는 곳에서 눈을 들어 북쪽과 남쪽과 서쪽과 동쪽을 바라보십시오,

    20. 네가 보는 모든 땅을 내가 너와 네 자손에게 영원히 주겠습니다. 또 내가 네 자손을 바다의 모래처럼 많게 하겠습니다. 사람이 땅의 티끌을 셀 수 있다면, 네 자손도

    21. 그 수는 헤아릴 수 없을 것입니다. 일어나십시오. 그 땅의 길이와 너비를 따라 두루 걸어 다니며, 그것을 모두 보십시오.

    22. “내가 그것을 네 자손에게 주겠습니다.” 아브람은 헤브론으로 가서 거기서 살았습니다. 그리고 그 해에 엘람 왕 그돌라오멜과 시날 왕 아므라벨과 엘라살 왕 아리옥이 왔습니다.

    23. 그리고 민족들의 왕 타르갈과 그들은 고모라의 왕을 죽였고, 소돔의 왕은 도망쳤으며, 많은 사람이 소금 바다 곁에 있는 소돔 사람들의 골짜기의 역청 속으로 떨어졌습니다 그들은 소돔과 아드마와 스보임을 사로잡았고, 아브람의 형제의 아들인 롯과 그의 모든 재산도 사로잡아 단까지 갔습니다.

    24. 그리고 도망쳐 온 한 사람이 와서 아브람에게 그의 형제의 아들이 사로잡혔다고 알렸습니다. 아브람은 자기 집에서 태어난 종들을 무장시켰습니다. … 아브람과 그의 자손에게는 여호와께 드릴 첫 십일조가 있으며, 여호와께서는 그것을 영구한 규례로 세우셔서, 그들이 그분 앞에서 섬기는 제사장들에게 그것을 주게 하셨습니다.

    25. 그들이 그것을 영원히 소유하게 하려는 것이었습니다.

    26. 이 율법에는 기한이 없으니, 하나님께서 그것을 모든 세대를 위하여 영원히 정하셨기 때문입니다. 곧 그들이 모든 것에서 십분의 일을 야훼께 드리도록 하신 것입니다. 곧 씨앗과 포도주와 기름에서 말입니다.

    27. 또한 소와 양에서 나온 것이 있었습니다. 그는 그것을 자기 제사장들에게 주어, 그들이 기뻐하며 먹고 마시게 하였습니다.

    28. 그 앞에. 그리고 소돔 왕이 다가와 그 앞에 절하고 말했습니다. 「우리의 주 아브람이여,」

