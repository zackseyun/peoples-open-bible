theological_decisions:
- issue: Whether to render כרת idiomatically as 'be lacking' or more literally as 'be cut off' in a promise of perpetual priestly service
  chosen_reading: a man shall not be cut off
  alternative_readings:
  - a man shall not be lacking
  rationale: The immediate context concerns enduring covenant lines, and the literal idiom carries stronger covenantal force. It also parallels the preceding promise about David's line. The translation preserves the Hebrew's theological texture rather than smoothing it into a mere statement of absence.
  doctrine_reference: Translation philosophy §3, §4, §5
- issue: How to render הַכֹּהֲנִים הַלְוִיִּם
  chosen_reading: the Levitical priests
  alternative_readings:
  - the priests, the Levites
  - the Levitical priesthood
  rationale: This rendering preserves the identification of the priests with the Levites without importing a narrower denominational or historical reconstruction. It is idiomatic English and keeps the focus on the priestly line's continuity.
  doctrine_reference: Translation philosophy §1, §6
revisions:
- timestamp: '2026-04-21T03:37:54Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/jeremiah/033/018.json
  category: awkward_english
  tier: 1
  from: to offer up a burnt offering, to burn a grain offering, and to make sacrifice
  to: who offers up a burnt offering, who burns a grain offering, and who makes sacrifice
  rationale: The Hebrew uses participles (מַעֲלֶה, וּמַקְטִיר, וְעֹשֶׂה) which function adjectivally, describing the 'man' (אִישׁ). The current 'to + infinitive' construction implies a purpose or result, which is a less direct translation of the participial function here. Rendering them as relative clauses ('who offers...') or present participles ('offering...') better captures the descriptive nature of the priestly activities. This clarifies that the promise is about the perpetual presence of priests performing these functions, rather than the purpose of their not being cut off.
