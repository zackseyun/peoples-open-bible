  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Gendered kinship term אֲבֹתֵיכֶם
  chosen_reading: your fathers
  alternative_readings:
  - your ancestors
  rationale: The source text specifically uses the masculine term 'fathers.' Following the gender-accurate policy, the translation retains the masculine wording rather than replacing it with a gender-neutral term, while recognizing that the referent is the covenant forefathers of Israel.
