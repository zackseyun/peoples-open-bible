translation:
  text: And you, cleanse the earth from every oppression, from every act of lawlessness, from every sin, and from every wickedness;
    and eradicate from the earth every defilement committed upon it.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: አንጽሓ
  chosen: cleanse
  alternatives:
  - purify
  rationale: The imperative calls for the removal of moral and ritual corruption from the earth. “Cleanse” preserves the purification
    imagery without reducing the command to ethical reform.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ግፍዕ
  chosen: oppression
  alternatives:
  - injustice
  - violence
  - wrong
  rationale: The term denotes harmful injustice or violent wrongdoing. “Oppression” gives it a concrete social force while
    distinguishing it from the following term for lawlessness.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዓመፃ
  chosen: act of lawlessness
  alternatives:
  - rebellion
  - iniquity
  - violence
  rationale: The word can describe revolt, transgression, or conduct that rejects rightful order. “Every act of lawlessness”
    is intelligible English and preserves the repeated distributive እምኵሉ (“from every”).
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኃጢአት
  chosen: sin
  alternatives:
  - offense
  - transgression
  rationale: “Sin” is the direct and contextually appropriate rendering for the general category of moral offense.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ረሲዕ
  chosen: wickedness
  alternatives:
  - impiety
  - godlessness
  - evil
  rationale: The term denotes wicked or impious character and conduct. “Wickedness” retains the moral weight without adding
    an explicit denial of God that “godlessness” might suggest to modern readers.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ርኵስ
  chosen: defilement
  alternatives:
  - impurity
  - uncleanness
  - unclean thing
  rationale: In this purification context, the term portrays evil as pollution of the earth. “Defilement” preserves that concrete
    apocalyptic image more clearly than the broader “impurity.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: አኅልቆሙ
  chosen: eradicate
  alternatives:
  - destroy them
  - bring them to an end
  - wipe them out
  rationale: The causative verb expresses bringing the named defilements to an end, and its object suffix is plural. “Eradicate”
    conveys complete removal while allowing idiomatic English to treat the preceding collective “every defilement” as its
    object.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
