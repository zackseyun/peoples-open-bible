translation:
  language: ko
  text: '의인들이 보고 두려워할 것이며[a], 그를 비웃을 것입니다[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려워할 것이다’. 히브리어는 공포나 두려움의 뜻을 지닐 수 있으며, 이 문맥에서는 하나님의 심판 앞에서 느끼는 경외 섞인 두려움의 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 비웃어 조롱할 것이다’ 또는 ‘그를 두고 웃을 것이다’. 히브리어 동사는 기본적으로 ‘웃다’라는 뜻이며, 여기서는 문맥상 조롱의 뜻이 함축됩니다.
    reason: lexical_alternative
lexical_decisions:
