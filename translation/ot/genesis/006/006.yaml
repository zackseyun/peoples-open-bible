theological_decisions:
- issue: Anthropopathic language about God ('regretted' / 'was pained')
  chosen_reading: Retain the text's direct portrayal of Yahweh as regretting the prior act of making humanity and as inwardly pained, without resolving the theological tension inside the translation.
  alternative_readings:
  - The LORD appeared to grieve
  - The LORD relented
  - The LORD was sorry
  rationale: Per the translation philosophy, theological tension should be preserved rather than resolved. The נחם Niphal with a clause naming Yahweh's prior act is most precisely rendered 'regretted,' while the distinct עצב Hitpael supplies the inward pain. The text does not explain how this language relates to divine foreknowledge, so the main translation should neither add cognitive surprise nor remove the retrospective regret that the Hebrew states.
  doctrine_reference: Translation philosophy §3; Affirmations (historic orthodoxy without flattening textual tension)
- issue: Collective sense of הָאָדָם
  chosen_reading: Render as 'man' in the representative/generic sense.
  alternative_readings:
  - humankind
  - humanity
  rationale: The context concerns the human race broadly. The project's policy prefers gender-accurate renderings matching the source's representative force rather than flattening to gender-neutral language by default.
  doctrine_reference: Translation philosophy §4; Contested terms table for אָדָם
revisions:
- timestamp: '2026-04-21T00:25:46Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/genesis/006/006.json
  category: awkward_english
  tier: 1
  from: to his heart
  to: in his heart
  rationale: While 'to his heart' is a literal translation of the Hebrew preposition אֶל, the more idiomatic English rendering for this expression of internal feeling is 'in his heart.' The Hebrew phrase אֶל־לֵב often carries the sense of 'within oneself' (e.g., Gen 8:21, 'the LORD said in his heart'). The current rendering is understandable but slightly stiff compared to the more natural 'in his heart,' which conveys the same meaning of deep, internal grief.
- timestamp: '2026-05-07T00:17:26Z'
  adjudicator: maintainer
  category: theological_clarity
  tier: 2
  from: regretted that he had made man on the earth, and he was grieved in his heart
  to: grieved over having made man on the earth, and he was pained in his heart
  rationale: The English verb 'regretted' carries the implication 'I should not have done this,' which when applied to God can be heard as diminishing divine foresight and sovereignty. The Hebrew נחם (Niphal) expresses sorrow over a prior action, not cognitive surprise or moral fault — so 'grieved over' preserves the emotional weight without that connotation. The second verb עצב (Hitpael) carries the force of an inward wound; rendering it 'was pained' (in place of 'was grieved') sharpens the parallelism (sorrow → inward wound) and avoids doubling now that the first verb carries 'grieved.' This preserves the anthropopathism rather than softening it, while removing the doctrinally misleading English overtone.
- timestamp: '2026-07-13T21:27:23Z'
  adjudicator: maintainer
  category: lexical
  tier: 2
  from: grieved over having made man on the earth, and he was pained in his heart
  to: regretted having made man on the earth, and he was pained in his heart
  rationale: Source-language accuracy takes priority over resolving the theological difficulty. The נחם Niphal with a clause naming a prior action carries retrospective regret or sorrow, while the following distinct verb עצב carries the pain or grief. Restoring 'regretted' preserves both parts of that two-verb structure. The Hebrew itself does not state that Yahweh was surprised or lacked foreknowledge, so that clarification belongs in the note rather than being achieved by weakening the main verb.
