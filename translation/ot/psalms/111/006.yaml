  meaning_decisions:
  - source_phrase: הִגִּיד לְעַמּוֹ
    prior_rendering: has declared to his people
    new_rendering: has made known to his people
    rationale: The giving of the inheritance makes his power known through his deeds. “Made known” accommodates that demonstration without suggesting that the verse chiefly describes a spoken declaration.
  - source_phrase: נַחֲלַת גּוֹיִם
    prior_rendering: the inheritance of the nations
    new_rendering: the land of the nations as their inheritance
    rationale: The phrase refers to the nations’ territory being granted to Israel as an inheritance. Naming the land clarifies what is inherited and avoids suggesting that Israel receives something bequeathed by the nations.
