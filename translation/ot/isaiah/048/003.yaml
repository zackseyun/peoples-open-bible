  from: I declared the former things long ago[a]; they went out from my mouth, and I made them heard. Suddenly I acted[b], and they came to pass.
  to: I foretold the earlier events long ago; I spoke of them with my own mouth and made them known. Suddenly I acted, and they came to pass.
  rationale: The earlier decisions rightly preserve both divine announcement and divine action, and I retain the abrupt fulfillment expressed by “Suddenly I acted.” Their preference for causative wording is better conveyed here by making the announcements known than by the awkward “made them heard.”
