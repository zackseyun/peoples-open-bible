  text: Μέλλοντες ἄγειν ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι τὸν καθαρισμὸν τοῦ ἱεροῦ, δέον ἡγησάμεθα διασαφῆσαι ὑμῖν, ἵνα καὶ αὐτοὶ ἄγητε σκηνοπηγίας καὶ τοῦ πυρός, ὅτε Νεεμίας, ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον, ἀνήνεγκεν θυσίας.
