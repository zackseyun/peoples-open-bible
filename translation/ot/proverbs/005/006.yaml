id: PRO.5.6
reference: Proverbs 5:6
source:
  edition: WLC
  text: אֹ֣רַח חַ֭יִּים פֶּן תְּפַלֵּ֑ס נָע֥וּ מַ֝עְגְּלֹתֶ֗י/הָ לֹ֣א תֵדָֽע־׃פ
translation:
  text: She does not consider the path of life; her paths wander, and she does not know it[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “Her paths wander to keep you from considering the path of life; you do not know them.” The Hebrew verb forms permit either “she” or “you.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרַח חַיִּים
  chosen: the path of life
  alternatives:
  - the way of life
  lexicon: HALOT
  rationale: אֹרַח denotes a path/way, and חַיִּים specifies life. 'Path of life' is natural English and preserves the concrete metaphor.
- source_word: פֶּן
  chosen: lest
  alternatives:
  - so that not
  - otherwise
  lexicon: HALOT
  rationale: פֶּן commonly introduces a negative purpose or prevention clause. 'Lest' is concise and fits the warning style of Proverbs.
- source_word: תְּפַלֵּס
  chosen: level
  alternatives:
  - make straight
  - weigh
  - ponder
  lexicon: HALOT
  rationale: From פלס in the piel, the sense here is to make level/straight or weigh out. In the immediate path imagery, 'level' best preserves the metaphor of a straight, well-considered course. 'Ponder' is a traditional rendering but is less directly tied to the road imagery.
- source_word: נָעוּ
  chosen: wander
  alternatives:
  - are unstable
  - reel
  - move to and fro
  lexicon: HALOT
  rationale: The verb conveys wavering or instability. 'Wander' fits the image of deviating tracks and communicates moral instability in idiomatic English.
- source_word: מַעְגְּלֹתֶיהָ
  chosen: her paths
  alternatives:
  - her paths
  - her courses
  lexicon: HALOT
  rationale: “Paths” retains the way imagery without adding the specificity of physical tracks.
- source_word: לֹא תֵדָע
  chosen: she does not know it
  alternatives:
  - you do not know
  - she does not know
  - you will not know
  lexicon: HALOT
  rationale: The ketiv/qere tradition and context favor a third feminine subject referring to the adulterous woman described in the surrounding verses. The object 'it' is implicit in English, referring to the wandering of her tracks or the path of life. This yields a coherent sense in context.
- source_word: פֶּן תְּפַלֵּס
  chosen: Lest you ponder
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: פֶּן is retained, and the pointed verb is second masculine singular; “ponder” conveys the figurative weighing sense of פלס.
