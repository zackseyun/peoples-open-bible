  source_fidelity: 개정이 필요합니다. 초안에는 영어 동물명(elephants, camels, donkeys)이 그대로 남아 있어 한국어 번역으로서 불완전합니다. 또한 እስከ ... ‘~할 때까지’의 시간 한정을 ‘그러면 ... 될 것입니다’라는 결과문으로 바꾸어 원문의 명령 구조와 의미를 바꾸었습니다. 게으즈어의 반복된 ዲበ(‘~위에’)는 열거된 대상들과 ‘그 모두’에 닥칠 일을 수식하므로 이를 보존해야 합니다.
  naturalness: ‘여기에 머물러 계십시오. ... 보실 때까지.’는 현대 표준 한국어 합쇼체에서 자연스럽고, 환상 서사의 격식도 유지합니다. ‘그 모든 것’보다는 열거된 존재들을 받는 ‘그 모두’가 더 자연스럽고 정확합니다.
  terminology: አልህምታት은 ‘양’이 아니라 소류를 가리키므로 ‘소들’로 옮깁니다. elephants/camels/donkeys는 각각 ‘코끼리들/낙타들/나귀들’로 번역합니다. 원문이 사건을 심판이라고 규정하지 않으므로 ‘닥칠 모든 것’으로 중립성을 유지합니다.
  issues:
  - severity: high
    issue: 영어 동물명이 한국어 본문에 남아 있습니다.
    rationale: 목표 언어 본문으로서 완결되지 않았으며, 코끼리·낙타·나귀라는 원문 동물 열거를 한국어로 제시해야 합니다.
  - severity: high
    issue: ‘그러면 ... 보게 될 것입니다’가 እስከ ... 의 ‘~할 때까지’ 구조를 결과문으로 변경합니다.
    rationale: 원문은 ‘여기에 머물라’는 명령의 지속 기한을 정하며, 조건·결과 관계를 진술하지 않습니다.
  - severity: medium
    issue: ‘그 모든 것’은 생물·대상들의 총칭인 ወኵሎሙ를 부정확하게 처리합니다.
    rationale: ‘그 모두’가 앞서 열거한 존재들을 더 직접적으로 가리키며, 반복되는 ‘위에’의 적용 범위도 명료하게 합니다.
  revised_text: 그들은 내게 말했습니다. “여기에 머물러 계십시오. 그 코끼리들과 낙타들과 나귀들 위에, 또 별들과 소들 위에, 그리고 그 모두 위에 닥칠 모든 것을 보실 때까지.”
  revised_footnotes:
  - marker: a
    text: ‘닥칠’에 해당하는 표현은 무엇이 이 대상들 위에 오는지를 구체적으로 밝히지 않습니다. 문맥상 심판을 연상시킬 수 있으나, 본문은 그것을 명시하지 않습니다.
    reason: alternative_reading
  revision_rationale: 영어 잔재를 모두 한국어로 바꾸고, 원문의 명령문과 ‘~할 때까지’ 시간 구조를 회복했습니다. 동물 상징은 본문에서 해석하지 않았으며, ‘소들’은 አልህምታት의 직접적 번역입니다. 반복된 ‘위에’와 마지막 ‘그 모두’를 살려 사건의 성격을 불필요하게 특정하지 않았습니다.
