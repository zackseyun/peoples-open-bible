  from: And he refrained from coming with a large force[a], and secretly sent letters to all his allies in Judea, so that they might seize Jonathan and those with him; but they were not able[b], because their plan became known to them.
  to: Bacchides set out with a large force[a] and secretly sent letters to all his allies in Judea, instructing them to seize Jonathan and those with him. But he failed, because Jonathan and his followers had learned of the plot.
  rationale: The lexical record favored 'refrained,' but the verb's ordinary military usage and the purpose construction support setting out more strongly. The earlier notes correctly identified both the singular verb and the recipients of the exposed plot; those gains are now carried in the text.
