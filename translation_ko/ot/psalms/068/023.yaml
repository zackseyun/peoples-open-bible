  lexicon: HALOT
  rationale: 직접 인용을 여는 서술동사로는 평이한 ‘말씀하셨습니다’가 가장 자연스럽고, 신적 발화의 무게도 살립니다.
- source_word: מִבָּשָׁן
  english_pob_choice: from Bashan
  chosen_korean: 바산에서
  alternatives_korean:
  - 바산에서
