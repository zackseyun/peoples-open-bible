  review_summary: The Masoretic pointing distinguishes הָרֶשַׁע, "wickedness," from הָרָשָׁע, the substantival "wicked one." The current rendering loses that distinction. "The wicked one" is preferable to "the wicked man," since the Hebrew substantival adjective need not specify male sex.
