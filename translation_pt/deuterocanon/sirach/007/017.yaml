  text: Humilhe profundamente a sua alma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico fornecido para este versículo traz uma leitura muito diferente: “Não se apresse em dizer-me: ‘Abre uma brecha’; entregue a Deus e aceite o caminho dele.” O texto principal segue o grego antigo: “Humilhe profundamente a sua alma”.'
    reason: Documentar uma divergência textual substancial entre a fonte hebraica indicada e o paralelo grego, cuja leitura corresponde à numeração e à tradição conhecida deste versículo.
lexical_decisions:
- source_word: ταπείνωσον
  choice: Humilhe
  rationale: Imperativo que preserva diretamente o sentido de rebaixar ou humilhar; neste contexto sapiencial, exorta à humildade profunda.
- source_word: σφόδρα
  choice: profundamente
  rationale: Expressa a intensidade de modo natural e digno em português; também seria possível traduzir por “muito”.
- source_word: τὴν ψυχήν σου
  choice: a sua alma
  rationale: Mantém a imagem antropológica explícita do paralelo grego, sem reduzi-la a um simples pronome reflexivo.
theological_decisions:
- issue: Divergência entre o hebraico fornecido e o paralelo grego
  choice: Adotar no texto principal a leitura grega, que corresponde à tradição textual de Sirácida 7:17 e à camada de consulta auditada.
  alternative: 'Traduzir o hebraico fornecido: “Não se apresse em dizer-me: ‘Abre uma brecha’; entregue a Deus e aceite o caminho dele.”'
  rationale: O hebraico citado apresenta conteúdo inteiramente distinto, apesar de a validação indicar apenas uma pequena divergência, e parece não corresponder a Sirácida 7:17. A leitura grega é clara, antiga e coincide com o texto inglês auditado; a divergência hebraica é registrada em nota, sem ser ocultada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva “alma” e a força do imperativo, evitando paráfrase denominacional.
