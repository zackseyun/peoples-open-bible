  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Sense of פֶּסַח in cultic context
  chosen_reading: the Passover
  alternative_readings:
  - Passover offering
  - Passover sacrifice
  rationale: The Hebrew term can refer either to the festival or to the sacrificial rite/victim. The broader context is a calendar of appointed times, so the main text keeps the broader festival term while preserving the sacrificial nuance in a footnote rather than resolving the ambiguity too narrowly.
