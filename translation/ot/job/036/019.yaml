id: JOB.36.19
reference: Job 36:19
source:
  edition: WLC
  text: הֲ/יַעֲרֹ֣ךְ שׁ֭וּעֲ/ךָ לֹ֣א בְ/צָ֑ר וְ֝/כֹ֗ל מַאֲמַצֵּי כֹֽחַ־׃
translation:
  text: Will your cry for help keep you out of distress, or all your strongest efforts[a]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew is difficult. Alternatively, “Will your wealth keep you out of distress, or all the resources of your strength?”
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  chosen: will ... avail
  alternatives:
  - will he esteem
  - will he set in order
  - will it be sufficient
  lexicon: HALOT
  rationale: The verb ערך literally has senses such as 'arrange, set in order,' but in this difficult poetic context many understand it idiomatically as 'be of use / avail / suffice' with the following object. 'Avail' captures the rhetorical question about whether the addressee's appeal can help him.
- source_word: שׁוּעֲךָ
  lemma: שׁוע
  chosen: your cry
  alternatives:
  - your plea
  - your wealth
  lexicon: HALOT
  rationale: The consonantal form is commonly taken from שׁוע 'cry for help,' yielding 'your cry/plea.' Some interpreters, influenced by context and ancient versions, take it differently as 'your riches/wealth,' but the MT vocalization supports 'your cry.' Because the verse is notoriously difficult, the alternative is preserved in a footnote.
- source_word: לֹא
  chosen: when
  alternatives:
  - not
  lexicon: HALOT
  rationale: Although normally the negation 'not,' in this compressed poetic line many translators construe the phrase idiomatically with בצר to express the circumstance of distress rather than a simple negation. Rendering the whole clause as 'when distress comes' produces coherent English while reflecting the likely sense of the rhetorical question. The more literal negative construal is preserved as an alternative in a footnote.
- source_word: בְצָר
  chosen: when distress comes
  alternatives:
  - in distress
  - against distress
  lexicon: HALOT
  rationale: בצר denotes distress, trouble, or straits. Expanded slightly to 'when distress comes' for natural English and to make explicit the situational force of the prepositional phrase in context.
- source_word: וְכֹל
  chosen: or all
  alternatives:
  - and all
  - even all
  lexicon: HALOT
  rationale: 'The conjunction can be rendered simply ''and,'' but in this rhetorical question it likely introduces an additional possible resource that also fails. ''Or all'' fits the sense: neither the cry nor all one''s strength will help.'
- source_word: מַאֲמַצֵּי כֹחַ
  chosen: the exertions of your strength
  alternatives:
  - your mighty efforts
  - all the forces of strength
  - all your strong efforts
  lexicon: HALOT
  rationale: The phrase combines effort/strain with strength/power. 'The exertions of your strength' preserves both elements and the poetic force without over-paraphrasing. The possessive 'your' is supplied in English from the verse's direct address and parallelism.
- source_word: הֲ/יַעֲרֹ֣ךְ
  chosen: will ... keep
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Contextually asks whether the stated resource can suffice to produce the result of being out of distress.
- source_word: שׁ֭וּעֲ/ךָ
  chosen: your cry for help
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Follows the WLC vocalization as a cry or appeal while retaining “wealth” as an alternative.
- source_word: לֹ֣א בְ/צָ֑ר
  chosen: out of distress
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Represents the explicit negation rather than converting it into a temporal “when.”
- source_word: מַאֲמַצֵּי כֹֽחַ
  chosen: your strongest efforts
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Idiomatic English for exertions characterized by strength, avoiding the unnatural phrase “efforts of strength.”
