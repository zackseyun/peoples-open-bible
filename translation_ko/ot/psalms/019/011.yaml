  text: Your servant is also warned by them[a]; in keeping them there is great reward.[b]
  footnotes:
  - marker: a
    text: Or 'to be desired ... and sweeter than honey, even drippings from the comb.' The Hebrew uses participial forms with comparative phrases, and the final expression can be rendered more literally as 'dripping honey of combs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 주의 종이 이것들로 말미암아 경고를 받으며[a], 그것들을 지키는 데에는 큰 상이 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것들로 말미암아 경계합니다.’ 히브리어 동사는 ‘경고를 받다’ 또는 ‘주의를 기울이다’라는 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘큰 보응’, ‘큰 결과’. 히브리어 עֵקֶב은 어떤 행위 뒤따르는 결과나 보응을 가리킬 수 있습니다.
    reason: lexical_alternative
