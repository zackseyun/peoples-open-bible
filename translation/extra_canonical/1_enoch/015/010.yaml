translation:
  text: The spirits of heaven shall have their dwelling in heaven, and the spirits
    of earth, who were born upon the earth, shall have their dwelling on earth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final Ge'ez phrase is literally 'in the earth.' Here it is rendered
      'on earth' as a dwelling-place contrast with 'in heaven.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መናፍስተ
  chosen: spirits
  alternatives:
  - winds
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The reference to being born on earth and having a dwelling points to
    spirits, not winds.
- source_word: ይከውኑ፡ ማኅደሪሆሙ
  chosen: shall have their dwelling
  alternatives:
  - their dwelling shall be
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Retains the future sense and the repeated noun 'dwelling' in readable
    English.
- source_word: ዘተወልዱ፡ ዲበ፡ ምድር
  chosen: who were born upon the earth
  alternatives:
  - which were born on earth
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Preserves the relative clause and the preposition 'upon' in the account
    of their origin.
- source_word: ውስተ፡ ምድር
  chosen: on earth
  alternatives:
  - in the earth
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The locative phrase contrasts their earthly dwelling with the heavenly
    spirits' dwelling; 'on earth' avoids implying an underground abode.
theological_decisions:
- issue: Identity and dwelling of the earth-born spirits
  chosen_reading: Leave them as 'spirits of earth' dwelling on earth.
  alternative_readings:
  - Explicitly identify them as spirits of the giants
  - Interpret their dwelling as underground
  rationale: The surrounding passage supplies context, but this verse itself names
    neither giants nor an underground realm.
