review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ‘에스더가 기대고 있는’은 원문의 ‘에스더가 그 위에 있는’을 ‘기대다’로 구체화하며, ‘강제로 범하려는’은 כָּבַשׁ의 ‘제압하다/굴복시키다’라는 표현을 성폭력으로 단정합니다. 문맥상 그러한 함의가 있을 수 있으나, 본문 자체의 표현 범위는 보존하는 편이 적절합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. 장소 이동을 ‘궁궐 정원에서 포도주 잔치가 벌어지는 연회장으로’로 정리하고, 왕의 반문도 자연스럽게 유지했습니다.
  terminology: מִטָּה는 ‘침상’, כָּבַשׁ는 문맥상 강압적 ‘제압/굴복’의 어조를 반영하여 ‘폭력을 쓰려는’으로 옮겼습니다. 이는 성적 함의를 배제하지 않으면서도 원문이 명시하지 않은 행위를 단정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘에스더가 기대고 있는 침상’
    rationale: 히브리어는 에스더가 침상 ‘위에/그것 위에’ 있음을 말할 뿐, 기대고 있다는 자세를 명시하지 않습니다.
  - severity: medium
    issue: ‘왕비를 강제로 범하려는 것’
    rationale: 문맥상 성적 공격으로 이해될 여지는 있으나 כָּבַשׁ 자체는 제압하다, 굴복시키다의 뜻입니다. 성폭력을 본문에 명시된 사실로 단정하는 번역은 원문의 모호성을 좁힙니다.
  - severity: low
    issue: 각주 a의 앵커 위치
    rationale: 각주는 해당 장소 표현 바로 뒤에 두는 것이 독자의 참조와 구조상 더 명확합니다.
  revised_text: 왕이 궁궐 정원에서 포도주 잔치가 벌어지는 연회장으로 돌아왔는데, 하만은 에스더가 있는 침상 위에 엎드려 있었습니다. 그러자 왕이 말했습니다. “내가 이 집에 있는데도 그가 왕비에게까지 폭력을 쓰려는 것이냐?” 왕의 입에서 이 말이 나오자, 하만의 얼굴을 가렸습니다.
  revised_footnotes:
  - marker: a
    text: ‘포도주 잔치가 벌어지는 연회장’은 직역하면 ‘포도주의 잔치 집’입니다.
    reason: korean_style_note
  - marker: b
    text: ‘폭력을 쓰려는’으로 옮긴 동사는 기본적으로 ‘제압하다, 굴복시키다’를 뜻합니다. 이 문맥에서는 왕이 하만의 행동을 격렬하게 비난하는 말이며, 성적 공격의 함의로 이해되기도 합니다.
    reason: lexical_alternative
  revision_rationale: 에스더의 자세를 불필요하게 구체화한 표현을 제거하고, 왕의 격앙된 비난의 강도는 유지하되 כָּבַשׁ의 의미를 성폭력으로 단정하지 않도록 수정했습니다. 각주 표지는 최종 조판에서 각각 ‘연회장’ 뒤와 ‘폭력을 쓰려는’ 뒤에 배치해야 합니다.
