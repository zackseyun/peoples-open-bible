translation:
  text: He was angry with them and bound them until the time when their sin would come to an end—for ten thousand
    years.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected ending literally has “in a year of mystery,” with “mystery” daggered. Dillmann1865 col181
      confirms the mystery/secret word and explicitly cites18:16; it does not mean ten thousand. For the duration
      this English adopts Charles’s printed Greek ἐνιαυτῶν μυρίων, ten thousand years. Printed50 note36 and printed51
      note9 identify the Geʽez ending as corrupt and distinguish Greek years/myriad from year/mystery. The duration
      therefore comes from the explicitly identified edited Greek parallel, not from silently changing a Geʽez numeral,
      lexicalizing mystery as a number, or claiming fresh manuscript evidence. “Sin” retains the selected noun rather
      than replacing it with an unmarked word for punishment.
    reason: textual_variant
