  yaml_path: translation/ot/psalms/056/001.yaml
  text: Be gracious to me, O God, for a man pursues me[a]; all day long an attacker oppresses me.
  footnotes:
  - marker: a
    text: The Hebrew verb depicts hostile panting or eager pursuit; it can also be understood as “tramples me” or “would swallow me up.”
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 제게 은혜를 베풀어 주십시오. 사람이 나를 헐떡이며 뒤쫓고[a], 온종일 싸우며 나를 압박합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나를 짓밟고”, “나를 물어뜯듯 달려들고”, “나를 삼키려 하고”. 히브리어 동사는 적대적으로 헐떡이거나 몹시 탐내며 뒤쫓는 모습을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
