source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד בַּֽ/יהוָ֨ה חָסִ֗יתִי אֵ֭יךְ תֹּאמְר֣וּ לְ/נַפְשִׁ֑/י נודו הַרְ/כֶ֥ם צִפּֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/001.yaml
  text: For the choirmaster. Of David. In the LORD I have taken refuge; how can you say to me, “Flee to your mountain like a bird”?
translation:
  language: ko
  text: 지휘자에게[a]. 다윗의 시. 나는 야훼 안에서 피난처를 구했습니다. 어찌하여 내게 “새처럼 네 산으로 도망가라”라고 말합니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “지휘자에게”로, 시편 표제의 기능을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 “내 영혼에게”이지만, 여기서는 경고의 대상인 “나에게”로 이해하는 것이 문맥에 더 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster.
  chosen_korean: 지휘자에게.
  alternatives_korean:
  - 지휘자에게 맡긴.
  - 성가대 지휘자에게.
  lexicon: לַמְנַצֵּחַ
  rationale: 시편 표제의 기능을 살려 예배 지휘 책임자에게 향한 지시로 옮겼습니다.
- source_word: בַּיהוָה
  english_pob_choice: In the LORD
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: יהוה
  rationale: 원어의 신명 표지를 POB 기본값인 ‘야훼’로 직접 반영하고, 도피 대상이 되는 신적 의탁의 방향을 격 조사로 분명히 했습니다.
- source_word: חָסִיתִי
  english_pob_choice: I have taken refuge
  chosen_korean: 피했습니다
  alternatives_korean:
  - 피난처를 삼았습니다
  - 피했습니다—
  - 도피했습니다
  lexicon: חסה
  rationale: ‘피난하다/피난처를 삼다’의 피난-의탁 의미를 살리되, 시적 문맥에서 간결하게 현재완료적 상태를 드러냈습니다.
- source_word: אֵיךְ תֹּאמְרוּ לְנַפְשִׁי
  english_pob_choice: how can you say to me
  chosen_korean: 어찌 내게
  alternatives_korean:
  - 어찌 내 영혼에게
  - 어찌 내게 말할 수 있습니까
  lexicon: נפשׁ
  rationale: POB의 재검토 결과처럼 ‘내 영혼에게’보다 직접 목적어인 ‘내게’가 권고/경고의 방향을 더 자연스럽게 전달합니다.
- source_word: נודו ... צִפּוֹר
  english_pob_choice: “Flee ... like a bird”
  chosen_korean: “새처럼 네 산으로 도망가라”
  alternatives_korean:
  - “새처럼 산으로 도망가라”
  - “새처럼 네 산으로 피하라”
  lexicon: נדד / צפור
  rationale: 동사 어간의 도피 명령과 ‘새’ 비유를 합쳐, 두려움 속에 급히 산으로 숨으라는 뜻을 한국어로 자연스럽게 재현했습니다.
theological_decisions:
- issue: יהוה를 어떻게 옮길지
  chosen_reading: 야훼로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편의 신명 표지를 POB 기본 원칙에 따라 가시화하여, 본문이 특정 언약명의 존재를 드러내도록 했습니다.
  doctrine_reference: 성경 번역 원칙 / 신명 표기
- issue: 내게/내 영혼에게의 대상 표현
  chosen_reading: ‘내게’로 옮겼습니다.
  alternative_readings:
  - ‘내 영혼에게’
  rationale: 히브리어 לְנַפְשִׁי는 직역상 ‘내 영혼에게’이지만, 이 구절에서는 경고의 수신자를 지시하는 관용적 용법으로 기능하므로 의미를 과도하게 영혼론화하지 않았습니다.
  doctrine_reference: 문맥 기반 의미론
