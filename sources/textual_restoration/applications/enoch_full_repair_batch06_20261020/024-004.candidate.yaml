translation:
  text: Among them was a tree whose scent I had never smelled; there was none among them, nor any other, like it.[a]
    Its fragrance surpassed every fragrance. Its leaves, blossoms, and wood never withered; its fruit was beautiful,
    and its fruit was like a cluster of dates.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The page-crossing clause beginning †ወአፄእምውስቴቶሙ is marked corrupt in the edition. The English no-other-like-it
      sense follows the surviving negative/comparison; its relationship to the smelling clause is reconstructed,
      not a claim that the daggered sequence is sound Geʽez. Charles p61 note16/p62 note1 discuss a missing Greek
      verb and a mistranslated pronoun. The source preserves the actual dagger and does not insert that proposed
      verb.
    reason: textual_variant
  - marker: b
    text: The selected printed *ገሙራ is interpreted with the negative temporal use of ግሙራ, never, attested explicitly
      for Enoch24:4 in Dillmann1865 col1147; it is not translated as a noun meaning fragrance. The smelling construction
      is explained at col1309; col378 explicitly cites the date/palm-cluster phrase in24:4. The printed tree/wood
      and repeated fruit remain distinct, not silently reduced to branches and fruit.
    reason: lexical_alternative
