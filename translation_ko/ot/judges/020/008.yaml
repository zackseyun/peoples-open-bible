revisions:
- from: 그러자 모든 백성이 한 사람처럼 일어나 말했습니다. “우리 중 아무도 자기 장막으로 가지 않을 것이며, 우리 중 아무도 자기 집으로 돌아서지 않을 것입니다.”[a]
  to: 그러자 모든 백성이 한 사람처럼 일어나 말했습니다. “우리 중 아무도 자기 장막으로 가지 않을 것이며, 우리 중 아무도 자기 집으로 발길을 돌리지 않겠습니다.”
  rationale: 두 부정 선언의 총체성은 ‘우리 중 아무도’로 유지했습니다. 두 번째 동사는 히브리어 סור의 ‘돌이키다/방향을 바꾸다’라는 의미를 살리면서 자연스러운 현대 한국어가 되도록 ‘자기 집으로 발길을 돌리지 않겠습니다’로 고쳤습니다. 불필요하고 표지 연결이 불명확한 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:11:08Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 집단적 결의(‘모든 백성’, ‘한 사람처럼’)와 두 1인칭 복수 부정 선언은 대체로 충실히 반영되었습니다. 다만 נָסוּר의 ‘돌이키다/벗어나다’는 ‘집으로 돌아서지 않다’보다 ‘집으로 발길을 돌리지 않다’가 더 자연스럽고 의미도 잘 보존합니다.
  naturalness: ‘자기 집으로 돌아서지 않겠습니다’는 현대 한국어에서 다소 어색합니다. 직접 인용된 공동 선언에는 ‘않겠습니다’가 더 자연스러운 합쇼체이며, ‘발길을 돌리지 않겠습니다’는 문맥상 유려합니다.
  terminology: ‘백성’, ‘장막’, ‘집’은 적절합니다. כְּאִישׁ אֶחָד은 ‘한 사람처럼’으로 충분히 옮겨졌으며, 별도 각주는 필수적이지 않습니다.
  issues:
