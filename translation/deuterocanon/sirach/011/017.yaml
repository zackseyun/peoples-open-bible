translation:
  text: Prosperity and adversity[a], life and death, poverty and wealth—all come from Yahweh.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or 'good and evil'; the Hebrew terms can describe moral qualities as well as favorable and adverse circumstances.
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  chosen: good
  alternatives:
  - prosperity
  - what is good
  lexicon: HALOT
  rationale: The plain adjectival/substantival sense fits the paired opposites in the Hebrew line. 'Good' preserves the broad scope rather than narrowing it to material prosperity.
- source_word: וְרַע
  chosen: and evil
  alternatives:
  - and harm
  - and adversity
  lexicon: HALOT
  rationale: In antithesis with 'good,' the broad term 'evil' best reflects the Hebrew. Although context could include calamity/adversity, the verse presents comprehensive opposites, so the wider term is retained.
- source_word: חַיִּים
  chosen: life
  alternatives:
  - living
  lexicon: HALOT
  rationale: Standard rendering in the life/death pair; singular English is idiomatic while preserving the Hebrew plural-of-abstraction sense.
- source_word: וָמָוֶת
  chosen: and death
  lexicon: HALOT
  rationale: Direct opposite of 'life'; no reason to soften or paraphrase.
- source_word: רֵישׁ
  chosen: poverty
  alternatives:
  - want
  - destitution
  lexicon: HALOT
  rationale: The noun denotes poverty or impoverishment. 'Poverty' is the most natural English counterpart to 'wealth' in the next term.
- source_word: וְעֹשֶׁר
  chosen: and wealth
  alternatives:
  - riches
  lexicon: HALOT
  rationale: '''Wealth'' is modern and broad, matching the socioeconomic contrast with ''poverty''.'
- source_word: מֵיי הוּא
  chosen: they are from him
  alternatives:
  - are from the LORD
  - come from him
  lexicon: HALOT
  rationale: The Hebrew as given points to an unspecified third-person singular pronoun, literally 'from him.' Because the divine name is not present in the Hebrew line, the translation preserves the pronoun rather than supplying 'the LORD.' The plural English verb 'they are' gathers the listed pairs as a collective subject.
