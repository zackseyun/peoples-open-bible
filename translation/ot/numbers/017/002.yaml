  meaning: Yahweh directs Moses to have Eleazar recover the censers from the burned remains and to scatter the burning coals away because the censers have become holy.
  meaning_decisions:
  - source_phrase: וְיָרֵם אֶת הַמַּחְתֹּת מִבֵּין הַשְּׂרֵפָה
    prior_rendering: to lift the censers out from among the burning
    new_rendering: to retrieve the censers from among the burned remains
    rationale: The command concerns recovering the vessels after the fatal fire; 'among the burning' does not clearly convey that setting in English.
  - source_phrase: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
    prior_rendering: and scatter the fire farther away
    new_rendering: Scatter the burning coals away
    rationale: The fire in these incense vessels consists of burning coals, which can be scattered; the separate sentence also distinguishes the imperative addressed to Moses from the instruction concerning Eleazar.
  - source_phrase: כִּי קָדֵשׁוּ
    prior_rendering: for they have become holy
    new_rendering: for the censers have become holy
    rationale: Naming the subject prevents readers from taking the holiness statement to refer to the coals or the burned remains.
