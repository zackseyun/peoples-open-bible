    text: 또는 시편 69:9의 일부 본문 전통의 표현을 따라 “나를 삼켰다”로 번역할 수 있습니다. 그러나 여기서 요한의 그리스어는 미래형(καταφάγεταί με)을 사용합니다.
    reason: alternative_reading
  revision_rationale: 원문 인용의 2인칭 소유격을 보존하고 원문에 없는 신명 삽입 및 그에 따른 각주를 제거했습니다. 요한복음의 미래형은 유지했으며, 대안 시제에 관한 각주는 영어 POB 감사 기록과 일치하도록 정확히 다듬었습니다.
