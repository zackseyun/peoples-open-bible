  to: 그것들로 말미암아 그들이 고통받기 시작할 것이며, 그것들은 불꽃에 비유되어 있습니다. 그는 수고 없이 그들을 멸하시고, 불에 비유된 율법도 멸하실 것입니다.
  rationale: 라틴어의 불완전한 절 단위와 지시어의 선행 문맥 의존성은 유지했습니다. 다만 perdet eos ... et legem의 등위 목적어 구조를 한국어에서 명시하여, ‘그들’과 ‘율법’ 모두가 멸망의 대상이라는 원문 통사를 회복했습니다. 해석적 교리 보충은 하지 않았습니다.
