translation:
  text: 'From there I went to another place, more terrifying than this, and saw a terrifying sight: a great fire
    burning and blazing there. The place had a chasm reaching all the way to the abyss, with great pillars of fire
    descending into it. I could see neither its extent nor its size, nor could I estimate it[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: Charles brackets a repeated seeing verb as an intrusion (p54 note39). The English renders the seeing/estimating
      sequence without reproducing that repetition.
