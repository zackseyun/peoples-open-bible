  from: In your name they rejoice all day long[a], and in your righteousness they are exalted.
  to: In your name they rejoice all day long, and in your righteousness they rise high[a].
  rationale: The existing note is misplaced. More importantly, יָרוּמוּ is Qal, so “they are exalted” introduces a passive construal not marked by the Hebrew. The proposal’s “are raised high” remains passive and has the same issue. “They rise high” reflects the active/stative Qal sense naturally and preserves the elevation image. The note can retain the alternate “justice,” but should not force “rise high” as the sole alternate wording.
