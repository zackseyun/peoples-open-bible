id: LUK.3.3
reference: Luke 3:3
source:
  edition: SBLGNT
  text: καὶ ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν,
translation:
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of reorientation toward God[c] for the forgiveness of sins[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'throughout the whole region around the Jordan.'
    reason: lexical_alternative
  - marker: b
    text: Or 'preaching' instead of 'proclaiming.'
    reason: lexical_alternative
  - marker: c
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  chosen: came
  alternatives:
  - went
  lexicon: BDAG
  rationale: Aorist of ἔρχομαι is most naturally rendered 'came.' English narrative style commonly uses 'came' here without needing to specify direction more dynamically.
- source_word: εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  chosen: into all the surrounding region of the Jordan
  alternatives:
  - throughout the whole region around the Jordan
  - into the entire district around the Jordan
  lexicon: BDAG
  rationale: περίχωρος denotes the surrounding region/district. Retaining 'all' reflects πᾶσαν, while 'of the Jordan' preserves the genitive construction closely. 'Into' reflects εἰς, though the phrase idiomatically implies movement throughout the area.
- source_word: κηρύσσων
  chosen: proclaiming
  alternatives:
  - preaching
  - heralding
  lexicon: BDAG
  rationale: κηρύσσω is the public announcement of a herald. 'Proclaiming' preserves that force in readable modern English better than the more church-associated 'preaching,' though that remains a valid alternative.
- source_word: βάπτισμα
  chosen: baptism
  lexicon: BDAG
  rationale: The noun directly denotes baptism/ritual washing. 'Baptism' is the standard and clearest rendering here.
- source_word: μετανοίας
  chosen: of reorientation toward God
  alternatives:
  - of repentance
  - for repentance
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  chosen: for the forgiveness of sins
  alternatives:
  - unto forgiveness of sins
  - for release from sins
  lexicon: BDAG
  rationale: ἄφεσις commonly means forgiveness/remission/release. In this context, 'for the forgiveness of sins' is the most natural English rendering and matches the phrase's established sense without forcing a sacramental or merely symbolic interpretation.
