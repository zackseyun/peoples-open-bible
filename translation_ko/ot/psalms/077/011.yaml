  yaml_path: translation/ot/psalms/077/011.yaml
  text: I will remember[a] the deeds of Yah, for I will remember your wonders from of old.[b]
  footnotes:
  - marker: a
    text: Or “I will recount the deeds of Yah.” The verb can carry the sense of remembering aloud or making mention.
    reason: lexical_alternative
  - marker: b
    text: Or “your wonders from ancient times” or “long ago.”
    reason: lexical_alternative
translation:
  language: ko
  text: '제가 야[a]께서 하신 일들을 기억하겠습니다.[b]

    참으로 제가 옛적에 주님께서 행하신 기이한 일들을 기억하겠습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야’는 하나님의 이름 YHWH의 짧은 시적 형태입니다.
    reason: divine_name
  - marker: b
    text: 또는 ‘야께서 하신 일들을 말하겠습니다’ 또는 ‘전하겠습니다’. 히브리어 동사는 기억하다와 더불어 기억하여 말하다 또는 언급하다의 뜻을 낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
