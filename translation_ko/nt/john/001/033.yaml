  source_fidelity: 원문의 κἀγώ는 ‘나 역시’로, βαπτίζειν ἐν ὕδατι와 ἐν πνεύματι ἁγίῳ는 한국어에서 자연스러운 동일한 조사 ‘-으로’로 병행해 옮겼습니다. 식별 표식의 관계절은 ‘네가 성령이 내려와 그 위에 머무는 것을 보는 이’로 보존했으며, 성령이 ‘그에게’가 아니라 ‘그 위에’ 머문다는 ἐπ’ αὐτόν의 공간적 표현을 바로잡았습니다.
  naturalness: ‘물 안에서 세례 주라고’는 현대 표준 한국어에서 부자연스럽고, ‘그에게 머무는’은 원문의 뜻을 흐릴 수 있습니다. 수정문은 현대적인 합쇼체 서술을 유지하면서 직접 인용 안의 단수 2인칭을 자연스럽게 처리합니다.
  terminology: 문맥과 이어지는 ‘성령’이라는 명시적 표현에 따라 첫 τὸ πνεῦμα도 ‘성령’으로 일관되게 옮겼습니다. 이는 신학적 추가가 아니라 본문 안의 동일 지시 대상을 한국어에서 명료하게 나타낸 것입니다. βαπτίζων은 ‘세례를 베푸는 분’으로, 존칭과 문체에 맞게 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘물 안에서 세례 주라고’
    rationale: ἐν ὕδατι의 형식적 대응을 위해 ‘물 안에서’를 택했으나, 한국어에서 세례의 매개·수단은 ‘물로’라고 하는 것이 자연스럽습니다. 후반도 ‘성령으로’로 옮기면 동일 조사를 통해 병행도 유지됩니다.
