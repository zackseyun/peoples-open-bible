id: JER.11.16
reference: Jeremiah 11:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זַ֤יִת רַֽעֲנָן֙ יְפֵ֣ה פְרִי תֹ֔אַר קָרָ֥א יְהוָ֖ה שְׁמֵ֑/ךְ לְ/ק֣וֹל הֲמוּלָּ֣ה גְדֹלָ֗ה הִצִּ֥ית אֵשׁ֙ עָלֶ֔י/הָ וְ/רָע֖וּ דָּלִיּוֹתָֽי/ו־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/016.yaml
  text: The LORD called your name, ‘A green olive tree, beautiful with good fruit.’ At the sound of a great roar he set fire to it, and its branches are ruined.
translation:
  language: ko
  text: 야훼께서 당신의 이름을 “열매와 모양이 아름다운 푸른 감람나무”라고 부르셨습니다. 큰 소동의 소리에 그 나무에 불을 지르셨고, 그 가지들은 부서졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה / LORD
  english_pob_choice: The LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 원문의 신명 표기를 한국어 기본값인 ‘야훼’로 옮겨, 영어 POB의 LORD를 그대로 일반 호칭으로 약화하지 않았습니다.
- source_word: זַיִת רַעֲנָן
  english_pob_choice: a green olive tree
  chosen_korean: 푸른 감람나무
  alternatives_korean:
  - 생기 있는 감람나무
  - 무성한 감람나무
  lexicon: זַיִת / רַעֲנָן
  rationale: 직역적으로는 ‘푸른/생기 있는 감람나무’가 가능하며, 시적 비유의 생동감을 살리기 위해 ‘푸른 감람나무’로 옮겼습니다.
- source_word: יְפֵה פְרִי תֹאַר
  english_pob_choice: beautiful with good fruit
  chosen_korean: 열매가 좋고 아름다운
  alternatives_korean:
  - 좋은 열매와 아름다운
  - 아름답고 열매가 좋은
  lexicon: פְרִי / תֹאַר
  rationale: 영어 POB의 ‘good fruit’와 원문의 병렬 구조를 반영하여, 열매의 선함과 나무의 아름다움을 함께 드러내도록 옮겼습니다.
- source_word: לְקוֹל הֲמוּלָּה גְדֹלָה
  english_pob_choice: At the sound of a great roar
  chosen_korean: 큰 소동이 일어나는 소리에
  alternatives_korean:
  - 큰 울부짖음의 소리에
  - 큰 떠들썩한 소리에
  lexicon: הֲמוּלָּה גְדֹלָה
  rationale: הֲמוּלָּה는 단순한 ‘소리’보다 ‘소동/혼란의 소음’에 가깝기 때문에, 원문의 군중적·전투적 소란을 살려 번역했습니다.
- source_word: דָּלִיּוֹתָיו
  english_pob_choice: its branches are ruined
  chosen_korean: 그 가지들이 망가졌습니다
  alternatives_korean:
  - 그 가지들이 부러졌습니다
  - 그 가지들이 파괴되었습니다
  lexicon: דָּלִיּוֹת
  rationale: 가지의 상태를 결과적으로 손상된 것으로 표현하는 넓은 의미를 살리되, 시적 문맥에 맞게 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: ‘야훼’ 호칭 유지와 심판 비유의 직접성
  chosen_reading: 본문의 주어를 일반적인 ‘주님’이 아니라 ‘야훼’로 유지하고, 나무에 불을 붙이는 심판 이미지를 완화하지 않았습니다.
  alternative_readings:
  - 주님께서
  - 주께서
  rationale: 예레미야의 언약 심판 맥락에서 신명 표기를 분명히 드러내는 것이 원문의 화행과 신학적 긴장을 가장 잘 보존합니다.
  doctrine_reference: 언약 심판 / 신명 표기
- issue: ‘소동’의 집단적·전쟁적 뉘앙스
  chosen_reading: ‘큰 소동이 일어나는 소리’로 옮겨, 단순한 큰 소음이 아니라 공동체적 혼란과 공격성을 암시하게 했습니다.
  alternative_readings:
  - 큰 소리
  - 큰 함성
  rationale: 원문 הֲמוּלָּה는 혼잡·소동의 의미가 강하므로, 예언적 심판 장면의 긴박함을 살리기 위해 그 뉘앙스를 유지했습니다.
  doctrine_reference: 예언서의 심판 이미지
