translation:
  text: After you have made known to them these words which the Master commanded me to be revealed to you, then all their sins that they formerly committed are forgiven them, and also to all the holy ones who have sinned up to this day, if they reorient[a] with all their heart and remove from their heart their double‑mindedness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
