  - 한 뜻으로 함께 꾸미었고
  lexicon: HALOT
  rationale: 원문의 ‘함께 상의하다/모의하다’와 ‘한 마음’의 결합을 살리되, 뒤의 대적 언약과 어울리게 ‘모의하다’로 옮겨 적대적 뉘앙스를 드러냈습니다.
- source_word: עָלֶיךָ
  english_pob_choice: against you
  chosen_korean: 주님을 대적하여
  alternatives_korean:
  - 주님을 향하여
  - 주님에 대하여
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘대하여’가 아니라 적대적 방향을 분명히 해야 하므로 ‘대적하여’로 옮겼습니다.
- source_word: בְּרִית יִכְרֹתוּ
  english_pob_choice: they make a covenant
  chosen_korean: 언약을 맺습니다
  alternatives_korean:
  - 언약을 자릅니다
  - 계약을 맺습니다
  lexicon: HALOT
  rationale: כרת ברית의 직역상 ‘언약을 자르다’이지만, 현대 한국어에서 의미가 분명한 관용 표현 ‘언약을 맺다’를 택하되, 실제 행위가 하나님을 거스르는 언약 체결임을 앞절로 보완했습니다.
theological_decisions:
- issue: 하나님을 향한 반역의 강도
  chosen_reading: 주님을 대적하여 언약을 맺습니다
  alternative_readings:
  - 주님을 향하여 언약을 맺습니다
  - 주님에 대해 언약을 맺습니다
  rationale: 시편 83편의 적대적 동맹을 정치적 협의로 누그러뜨리지 않기 위해, 원문의 adversative force를 ‘대적하여’로 분명히 드러냈습니다.
  doctrine_reference: 시편의 열방 반역과 하나님의 주권
- issue: ‘한 마음’의 관용 표현
  chosen_reading: 한 마음으로 함께 모의하였고
  alternative_readings:
  - 한 마음으로 함께 의논하였고
  - 한 뜻으로 함께 모의하였고
  rationale: לֵב יַחְדָּו의 이미지가 단순한 합의가 아니라 내적 의도의 일치이므로, ‘한 마음’과 ‘함께’를 함께 살려 원문의 긴장을 유지했습니다.
  doctrine_reference: 시편의 문학적 평행법
