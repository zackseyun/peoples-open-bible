  from: And he removed the covering of Judah[b][a], and on that day you looked to the weapons of the House of the Forest.
  to: Yahweh removed Judah’s protective covering[a]. On that day you looked to the weapons in the House of the Forest[b].
  rationale: The lexical and theological discussion correctly recognizes a protective metaphor, so I clarify that sense without discarding the covering image. I go beyond its deliberately implicit subject by naming Yahweh from the literary context, while preserving the serious alternative in a footnote.
