translation:
  language: ko
  text: 야훼께 찬양을 노래하십시오, 시온에 거하시는 분께. 그분이 행하신 일들을 민족들 가운데 알리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시온에 좌정하시는 분께’.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִבְטְחוּ בְּךָ
  english_pob_choice: And ... will trust in you
  chosen_korean: 그리고 ... 주님을 신뢰할 것입니다
  alternatives_korean:
  - 그리고 ... 주님께 의지할 것입니다
  - 그리고 ... 주님을 믿을 것입니다
  lexicon: HALOT
  rationale: בטח는 단순 인지보다 신뢰와 의탁의 의미가 강하므로, 시편 문맥에서는 ‘신뢰하다’가 가장 안정적으로 원문의 의미를 살립니다.
- source_word: יֹדְעֵי שְׁמֶךָ
  english_pob_choice: those who know your name
  chosen_korean: 주님의 이름을 아는 이들
  alternatives_korean:
  - 주님의 이름을 알고 있는 이들
  - 주님의 이름을 아는 사람들
  lexicon: HALOT
  rationale: ‘이름’은 단순 호칭이 아니라 하나님의 드러난 성품과 명성을 가리키므로, 직역을 유지하되 자연스러운 한국어로 다듬었습니다.
- source_word: לֹא עָזַבְתָּ
  english_pob_choice: have not forsaken
  chosen_korean: 버리지 않으셨기 때문입니다
  alternatives_korean:
  - 떠나지 않으셨기 때문입니다
  - 버려두지 않으셨기 때문입니다
  lexicon: HALOT
  rationale: עָזַב는 관계적·언약적 뉘앙스가 있는 ‘버리다/떠나다’이므로, 시편에서는 ‘버리지 않다’가 그 정서를 가장 잘 전합니다.
- source_word: דֹרְשֶׁיךָ
  english_pob_choice: those who seek you
  chosen_korean: 주님을 찾는 이들
  alternatives_korean:
  - 주님을 구하는 이들
  - 주님께 구하는 이들
  lexicon: HALOT
  rationale: דרש는 하나님께 대한 경건한 추구를 뜻하므로, 현대 한국어에서는 관용적이면서도 충분히 직접적인 ‘찾다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 프로젝트의 기본값은 야훼이지만, 본문 전체의 호칭 반복과 시적 병행을 고려해 한국어 본문에서는 ‘주님’을 사용했습니다. 이는 직접 음역보다 시편의 자연스러운 호칭 효과를 살리기 위한 선택입니다.
theological_decisions:
- issue: 야훼의 한국어 표기와 반복 호칭
  chosen_reading: 본문에서는 ‘주님’으로 옮기고, 문맥상 같은 호칭이 두 번 반복되는 구조를 유지했습니다.
  alternative_readings:
  - 야훼, 주님의 이름을 아는 이들은 야훼를 신뢰할 것입니다.
  - 주님, 주님의 이름을 아는 이들은 주님을 신뢰할 것입니다.
  rationale: 히브리어 원문은 마지막 절에서 야훼를 직접 부르며, 앞의 ‘당신의 이름’과 병행을 이룹니다. 한국어에서는 반복 호칭을 살리면서도 시적 읽기와 예배적 자연스러움을 위해 ‘주님’으로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
