  from: Violent witnesses rise up[a]; they ask me about things I do not know.
  to: Malicious witnesses rise up[a]; they question me about things I do not know.
  rationale: חָמָס in this forensic context denotes wrongful, injurious hostility; “violent witnesses” can misleadingly imply that the witnesses themselves use physical violence. “Malicious witnesses” is a natural, suitably broad rendering, and “question me about” is an unobtrusive contextual improvement over “ask me about.”
