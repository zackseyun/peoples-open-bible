base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045.yaml
  text: 'You are contentious, brothers, and zealous about the things that pertain to salvation. You have bent down to look into the holy Scriptures, the true Scriptures, those given through the Holy Spirit. You know that nothing unjust or falsified has been written in them; you will not find righteous people cast off by holy men. The righteous were persecuted, but by the lawless; they were imprisoned, but by the unholy; they were stoned by the lawbreakers; they were killed by those who were defiled and unjust, through intolerable jealousy. While suffering these things, they endured nobly.


    For what shall we say, brothers? Was Daniel thrown into a den of lions by those who feared God? Or were Hananiah and Azariah and Mishael brought down into a furnace of fire by those who practiced the magnificent and glorious religion of the Most High? May this never be! Who then were the ones who did these things? Those who were hateful and full of every evil were stirred up to such a pitch of wrath that they subjected to abuse those who served God in a holy and blameless purpose, not knowing that the Most High is champion and defender of those who worship his all-virtuous name with a pure conscience—to whom be the glory forever and ever. Amen.


    But those who endured in confidence inherited glory and honor, and were exalted; and they became enrolled by God in their memorial forever and ever. Amen.'
translation:
  language: ko
  text: '형제들이여, 여러분은 다투기를 좋아하고 구원에 속한 일들에 열심을 내고 있습니다. 여러분은 거룩한 성경, 참된 성경, 곧 성령을 통하여 주어진 성경을 깊이 살펴보았습니다. 여러분은 그 성경에 부당한 것도, 왜곡된 것도 전혀 기록되어 있지 않음을 알고 있습니다. 또 의로운 사람들은 거룩한 사람들에게서 내쳐지지 않음을 알게 될 것입니다. 의인들은 불의한 자들에게 박해를 받았고, 부정한 자들에게 갇혔으며, 율법을 어기는 자들에게 돌에 맞았고, 더럽고 불의한 자들에게 죽임을 당했습니다. 그들은 견딜 수 없는 시기로 그런 일을 당하면서도, 고결하게 견뎠습니다.


    그러면 형제들이여, 우리가 무엇이라고 말하겠습니까? 다니엘이 하나님을 두려워하는 사람들에 의해 사자 굴에 던져졌습니까? 아니면 하나님의 지극히 크고 영광스러운 종교를 실천하던 사람들에 의해 하나냐와 아사랴와 미사엘이 불타는 가마로 내려갔습니까? 그런 일은 결코 있을 수 없습니다! 그러면 그 일을 저지른 자들은 누구입니까? 미움받는 자들이고 온갖 악으로 가득한 자들이 분노에 이르기까지 격해져서, 거룩하고 흠 없는 뜻으로 하나님을 섬기는 이들을 학대하게 만들었습니다. 그들은 지극히 높으신 분께서 자신의 모든 덕스러운 이름을 깨끗한 양심으로 예배하는 이들의 수호자이시며 변호자이신 줄을 알지 못했습니다. 그분께 영광이 영원무궁하도록 있기를 빕니다. 아멘.


    그러나 확신 가운데 견딘 이들은 영광과 존귀를 유업으로 받았고, 높임을 받았으며, 하나님에 의해 그들의 기념책에 영원무궁하도록 기록되었습니다. 아멘.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φιλόνεικοί ἐστε
  english_pob_choice: You are contentious
  chosen_korean: 여러분은 다투기를 좋아하고
  alternatives_korean:
  - 여러분은 논쟁적이고
  - 여러분은 다툼을 잘하고
  lexicon: φιλόνεικος
  rationale: 직역하면 ‘다투기를 사랑하는/좋아하는’ 뜻이므로, POB의 논쟁적 뉘앙스를 살리되 한국어에서 자연스럽게 ‘다투기를 좋아하고’로 옮겼습니다.
- source_word: ἐνεκύψατε εἰς
  english_pob_choice: You have bent down to look into
  chosen_korean: 깊이 살펴보았습니다
  alternatives_korean:
  - 몸을 굽혀 들여다보았습니다
  - 주의 깊게 들여다보았습니다
  lexicon: ἐγκύπτω
  rationale: ‘몸을 굽혀 들여다보다’의 이미지를 포함하되, 문맥상 성경을 진지하게 탐구한다는 의미가 핵심이어서 간결하게 ‘깊이 살펴보다’로 옮겼습니다.
- source_word: διὰ τοῦ πνεύματος τοῦ ἁγίου
  english_pob_choice: through the Holy Spirit
  chosen_korean: 성령을 통하여
  alternatives_korean:
  - 거룩한 영을 통하여
  - 성스러운 영을 통하여
  lexicon: πνεῦμα ἅγιον
  rationale: 문맥상 하나님의 영을 가리키므로 프로젝트 기본어인 ‘성령’을 사용했습니다.
- source_word: θρησκείαν
  english_pob_choice: religion
  chosen_korean: 종교
  alternatives_korean:
  - 경건
  - 예배
  lexicon: θρησκεία
  rationale: 여기서는 단순한 내적 경건보다 외적 종교 실천을 가리키므로, POB의 ‘religion’을 그대로 반영해 ‘종교’로 옮겼습니다.
- source_word: ὑπέρμαχος καὶ ὑπερασπιστής
  english_pob_choice: champion and defender
  chosen_korean: 수호자이시며 변호자이신
  alternatives_korean:
  - 옹호자이시며 변호자이신
  - 옹호자이시며 보호자이신
  lexicon: ὑπέρμαχος / ὑπερασπιστής
  rationale: 두 겹의 보호·옹호 의미를 살리기 위해 ‘수호자’와 ‘변호자’를 병렬로 두었습니다.
- source_word: μνημοσύνῳ
  english_pob_choice: in their memorial
  chosen_korean: 그들의 기념책에
  alternatives_korean:
  - 그들의 기억에
  - 그들의 기념록에
  lexicon: μνημόσυνον
  rationale: 단순한 추상적 ‘기억’보다 하나님 앞의 기록/기념을 가리키는 문맥이어서 ‘기념책’으로 구체화했습니다.
theological_decisions:
- issue: 지극히 높으신 분의 ‘종교’와 ‘예배’의 구분
  chosen_reading: θρησκεία는 하나님의 경배 자체보다 ‘종교 실천’의 외적 형태로, 뒤의 λατρεύοντων(예배하는 이들)과 구분해 번역했습니다.
  alternative_readings:
  - θρησκεία를 ‘경건’으로 완화하는 읽기
  - θρησκεία를 ‘예배’로 흡수하는 읽기
  rationale: 본문은 ‘종교를 실천하는 자들’과 ‘깨끗한 양심으로 예배하는 자들’을 대조하므로 두 표현을 분리해야 논지가 선명합니다.
  doctrine_reference: 1 Clement 45:7 문맥 대조
- issue: ‘성경에 왜곡된 것이 없다’의 강한 진술
  chosen_reading: οὐδὲ παρεπεποιημένον을 ‘왜곡된 것도 전혀 기록되어 있지 않음’으로 옮겨, 문헌의 정직성과 무결성 주장을 강하게 유지했습니다.
  alternative_readings:
  - ‘꾸며진 것도 없다’
  - ‘조작된 것도 없다’
  rationale: 원문은 단순한 오류 부재가 아니라 의도적 변조 부재를 말하므로 ‘왜곡’이 가장 균형 있게 의미를 담습니다.
  doctrine_reference: 성경의 진실성에 대한 본문 진술
