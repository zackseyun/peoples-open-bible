id: PSA.73.12
reference: Psalms 73:12
source:
  edition: WLC
  text: הִנֵּה אֵ֥לֶּה רְשָׁעִ֑ים וְ/שַׁלְוֵ֥י ע֝וֹלָ֗ם הִשְׂגּוּ חָֽיִל־־׃
translation:
  text: Look, these are the wicked, always at ease; they have acquired wealth.
  philosophy: dynamic
lexical_decisions:
- source_word: הִנֵּה
  chosen: Look
  alternatives:
  - Behold
  - See
  lexicon: HALOT
  rationale: Natural modern equivalent of the deictic particle.
- source_word: אֵלֶּה
  chosen: these
  alternatives:
  - these ones
  lexicon: HALOT
  rationale: Straightforward demonstrative referring to the people just described in context.
- source_word: רְשָׁעִים
  chosen: the wicked
  alternatives:
  - wicked people
  - the ungodly
  lexicon: HALOT
  rationale: Definite-sounding class designation in context; 'the wicked' is idiomatic in Psalms and preserves the moral category without unnecessary expansion.
- source_word: וְשַׁלְוֵי עוֹלָם
  chosen: always at ease
  alternatives:
  - secure forever
  - at ease for an age
  - perpetually carefree
  lexicon: HALOT
  rationale: The construct phrase literally combines 'at ease/secure' with 'forever/everlasting/age.' In this lament context it describes the wicked as enjoying enduring ease. 'Always at ease' captures the idiomatic sense in natural English without overstating metaphysical perpetuity.
- source_word: הִשְׂגּוּ
  chosen: have increased
  alternatives:
  - have attained
  - have acquired
  - have grown
  lexicon: HALOT
  rationale: The verb can denote reaching, attaining, or increasing. With חָיִל here, the sense is that their resources have grown or accumulated; 'have increased' fits the collocation and context of prosperity.
- source_word: חָיִל
  chosen: wealth
  alternatives:
  - riches
  - substance
  - strength
  lexicon: HALOT
  rationale: Though חָיִל can mean strength, efficiency, army, or wealth, in this context of the prosperity of the wicked the economic sense is primary. 'Wealth' is clear and natural.
- source_word: הִשְׂגּוּ חָיִל
  chosen: they have acquired wealth
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Represents the perfect of attain/reach with wealth as its object.
