theological_decisions:
- issue: Preserving the two comparisons in the selected Greek text
  chosen_reading: The gods are compared to a thornbush on which birds sit and to a discarded corpse.
  alternative_readings:
  - Buckthorn is a possible narrower rendering of the shrub.
  rationale: The shrub image must not be harmonized into the preceding scarecrow. A thornbush is not literally lifeless; the anti-idol rhetoric does not authorize replacing the stated plant with an inert watch-figure. This correction does not decide literary dependence, an original Hebrew text, or canonical status.
