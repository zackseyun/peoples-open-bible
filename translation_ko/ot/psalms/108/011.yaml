translation:
  language: ko
  text: 하나님, 주께서 우리를 버리셨습니까?[a] 주께서는 우리 군대와 함께 나아가지 않으십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 내치셨습니까?’ 히브리어 동사는 강하게 거절하거나 내버리는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 누가 과연
  - 도대체 누가
  lexicon: HALOT
  rationale: 히브리어 의문대명사의 단순하고 수사적인 물음을 한국어에서도 자연스럽게 살렸습니다.
- source_word: יֹבִלֵנִי
  english_pob_choice: will bring me
  chosen_korean: 인도하겠습니까
  alternatives_korean:
  - 데려가겠습니까
  - 이끌겠습니까
  lexicon: HALOT
  rationale: 목적지로 데려가는 동작과 시편의 시적 평행법을 함께 살리기 위해 ‘인도하다’를 택했습니다.
- source_word: עִיר מִבְצָר
  english_pob_choice: the fortified city
  chosen_korean: 요새성
  alternatives_korean:
  - 요새화된 성읍
  - 견고한 성읍
  - 요새 도시
  lexicon: HALOT
  rationale: ‘성읍/도시’보다 고어적이지만 본문 맥락의 전략적 거점을 드러내는 ‘요새성’으로 압축해 번역했습니다.
- source_word: נָחַנִי
  english_pob_choice: will lead me
  chosen_korean: 인도하겠습니까
  alternatives_korean:
  - 이끌겠습니까
  - 안내하겠습니까
  lexicon: HALOT
  rationale: 히브리어 완료형이지만 시적 평행 속에서 미래적/수사적 의미를 갖는다는 감사노트를 반영해 첫 행과 같은 동사로 맞췄습니다.
- source_word: עַד אֱדוֹם
  english_pob_choice: as far as Edom
  chosen_korean: 에돔까지
  alternatives_korean:
  - 에돔에까지
  - 에돔으로
  lexicon: HALOT
  rationale: ‘עד’의 도달 한계를 가장 간결하게 살리는 표현으로 ‘까지’를 택했고, 고유명사는 음역했습니다.
theological_decisions:
- issue: 히브리어 완료형 נָחַנִי의 시적 시제 처리
  chosen_reading: 두 번째 절도 미래형 수사 의문으로 처리했습니다.
  alternative_readings:
  - ‘나를 인도하셨습니까’로 완료형을 직역함
  - 현재적 진행으로 완화함
  rationale: 본문은 미래적 도움을 구하는 평행 구조이므로, 완료형의 형태보다 수사적 기능을 우선해 첫 절과 같은 미래형으로 맞추는 것이 의미를 더 정확히 전달합니다.
  doctrine_reference: 시편의 평행법과 시적 시제 용법
- issue: עִיר מִבְצָר의 지시 대상 불명확성
  chosen_reading: 특정 도시명을 넣지 않고 ‘요새성’으로 두었습니다.
  alternative_readings:
  - ‘보스라’ 같은 추정 지명 삽입
  - ‘그 요새화된 성읍’으로 일반화
  rationale: 히브리어 본문은 도시 이름을 명시하지 않으므로, 추정 지명을 본문에 넣지 않고 전략적 거점을 가리키는 일반적 표현만 유지했습니다.
  doctrine_reference: 본문에 근거한 절제된 번역 원칙
