translation:
  text: You know everything before it comes to be, and you know this and all that concerns them[a]. Yet you have not told us what we should do to them concerning this.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Ge'ez phrase here is uncertain; it literally reads “what belongs to them.”
    reason: textual_variant
lexical_decisions:
- source_word: ታአምር
  chosen: you know
  alternatives:
  - you understand
  rationale: The repeated verb expresses the addressee’s knowledge; repeating “you know” preserves the source’s rhetoric.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኵሎ፡ ዘእንበለ፡ ይኩን
  chosen: everything before it comes to be
  alternatives:
  - all that is before it happens
  - all things before they come to pass
  rationale: This renders the temporal force of ዘእንበለ with the becoming/existence verb ይኩን while avoiding archaic English.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዘንተ፡ †ወዘዚአሆሙ፡†
  chosen: this and what belongs to them
  alternatives:
  - this and their affairs
  - this, and you permit them
  rationale: The marked OCR reading most directly appears to say “this and that which is theirs.” Because the phrase is textually suspect and may conceal a different verb or wording, the main text remains formally transparent rather than importing the smoother traditional sense “you permit them.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወአልቦ፡ ዘትነግረነ
  chosen: Yet there is no one to tell us
  alternatives:
  - and there is none who tells us
  rationale: ወአልቦ gives an existential negation, and the relative verb identifies the absent informant. “Yet” conveys the contextual contrast without changing the proposition.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ምንት፡ መፍትው፡ ንረስዮሙ
  chosen: what we should do to them
  alternatives:
  - what it is fitting for us to do to them
  - what we desire to do to them
  rationale: መፍትው can concern what is desired, appropriate, or required; in the angels’ appeal for direction, “should” naturally expresses the requested proper course of action without overstating a divine command.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በእንተ፡ ዝንቱ
  chosen: concerning this
  alternatives:
  - because of this
  - with regard to this
  rationale: The prepositional phrase marks the matter or grounds in view; “concerning this” preserves that broad relation.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
