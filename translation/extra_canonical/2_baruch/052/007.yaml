    ܕܐܫܠܡܬ ܐܢܘܢ ܠܗ̇.
    ܗܟܢܐ ܐܦ ܡܩܝܡܐ
    ܠܗܘܢ. ܗܢܝܢ ܡܬܒܥܐ
    ܓܝܪ ܠܡܚܘܝܘ ܠܐܝܠܝܢ
    ܕܚܝܝܢ. ܕܚܝܘ ܡ̈ܝܬܐ.
    ܘܐܬܘ ܗܢܘܢ ܕܐܙܠܘ
    ܗܘܘ. ܘܢܗܘܐ ܟܕ
    ܕܐܬܝܕܥܘ ܚܕ ܠܚܕ
    ܐܝܠܝܢ ܕܗܫܐ ܝܕܥܝܢ. ܗܝܕܝܢ
