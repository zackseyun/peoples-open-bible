base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/008.yaml
  text: Yahweh judges the peoples; judge me, O Yahweh[a], according to my righteousness and to the integrity that is in me[b].
  footnotes:
  - marker: a
    text: Or “vindicate me, O Yahweh”; in context, “judge me” is a request for a favorable verdict.
    reason: lexical_alternative
  - marker: b
    text: Or “my blamelessness” for “the integrity that is in me.”
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 민족들을 심판하십니다.[a] 여호와여, 나의 의와 내게 있는 온전함에 따라 나를 심판하소서.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러 백성들을’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나를 심판하소서’는 문맥상 ‘나의 정당함을 밝혀 주소서’라는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘온전함’은 ‘흠 없음’ 또는 ‘성실함’으로도 옮길 수 있습니다. 히브리어 표현은 직역하면 ‘내 위에 있는 [온전함]’입니다.
    reason: lexical_alternative
