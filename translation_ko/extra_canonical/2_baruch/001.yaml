base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001.yaml
  text: '1 In the twenty-fifth year of Jeconiah king of Judah, the word of the Lord came upon Baruch son of Neriah, and he said to him,

    2 “You have seen all that this people has done against me—the evils that these two tribes which remain have done, more than the ten tribes that were carried away captive.

    3 For the former tribes were driven by their kings to sin, but these two tribes themselves pressed and compelled their kings to sin.

    4 Therefore behold, I am bringing evil upon this city and upon its inhabitants, and it shall be taken away from before me for a time, and I will scatter this people among the nations, that it may prove useful to the nations.

    5 And my people shall be chastened, and the time will come when they will seek the prosperity of their times.”'
translation:
  language: ko
  text: '1 유다 왕 여고냐의 이십오 년에 주님의 말씀이 네리야의 아들 바룩에게 임하여 그에게 말씀하셨습니다.


    2 "너는 이 백성이 나에게 행한 모든 것을 보았다. 곧 이 남아 있는 두 지파가 포로로 끌려간 열 지파보다 더 많이 저지른 악행을 보았다.


    3 앞선 지파들은 그들의 왕들 때문에 죄를 짓도록 강요받았지만, 이 두 지파는 스스로 그들의 왕들을 죄짓게 몰아붙이고 강요하였다.


    4 그러므로 보아라, 내가 이 도성과 그 주민들에게 재앙을 내리겠다. 그리고 그 도성은 잠시 내 앞에서 치워질 것이며, 내가 이 백성을 민족들 사이에 흩으리니 민족들에게 유익이 되게 하려는 것이다.


    5 내 백성은 징계를 받을 것이며, 때가 이르면 그들은 자기 시대의 번영을 구하게 될 것이다."'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܬܓܡܗ ܕܡܪܝܐ
  english_pob_choice: the word of the Lord
  chosen_korean: 주님의 말씀
  alternatives_korean:
  - 주님의 말
  - 주님의 명령
  lexicon: ܦܬܓܡܐ
  rationale: 시리아어 ܦܬܓܡܐ는 단순한 ‘말’보다 권위 있는 ‘말씀’에 가깝고, ܕܡܪܝܐ는 주님의 소유격으로 자연스럽게 살렸습니다.
- source_word: ܐܬܦܫܩ ܡܢ ܝܘܢܝܐ ܠܣܘܪܝܝܐ
  english_pob_choice: translated from Greek into Syriac
  chosen_korean: '...'
  alternatives_korean: []
  lexicon: 번역문 서두
  rationale: 이 구절은 본문이 아니라 서두의 서지 표제이므로 한국어 본문에서는 옮기지 않았습니다.
- source_word: ܕܢܚܛܘܢ / ܕܚܨܘ ܘܐܠܨܘ
  english_pob_choice: were driven to sin / pressed and compelled their kings to sin
  chosen_korean: 죄를 짓도록 강요받았지만 / 스스로 그들의 왕들을 죄짓게 몰아붙이고 강요하였다
  alternatives_korean:
  - 죄를 범하게 되었다 / 그들의 왕들을 죄짓도록 재촉하였다
  - 죄를 짓게 만들었다 / 그들의 왕들에게 죄를 강요하였다
  lexicon: ܚܛܐ
  rationale: 앞선 지파와 뒤의 두 지파를 대조하는 동사의 뉘앙스를 살려, 첫 절반은 수동적 강요, 둘째 절반은 주체적 압박과 강요로 구분했습니다.
- source_word: ܡܘܨܠܚܘܬܗܘܢ ܕܙܒܢܝ̈ܗܘܢ
  english_pob_choice: the prosperity of their times
  chosen_korean: 자기 시대의 번영
  alternatives_korean:
  - 그들의 시대의 형통
  - 그 시대의 번성
  lexicon: ܡܨܠܚܘܬܐ
  rationale: POB의 ‘prosperity’를 따르되, 시기성(그들의 times)을 자연스럽게 드러내기 위해 ‘자기 시대’로 옮겼습니다.
theological_decisions:
- issue: 4절의 ܕܬܬܬܪܝܡ ܡܢ ܩܕܡܝ ܥܕ ܙܒܢܐ의 의미
  chosen_reading: 그 도성은 잠시 내 앞에서 치워질 것입니다
  alternative_readings:
  - 내 앞에서 제거될 것입니다
  - 내 앞에서 물러나 있을 것입니다
  rationale: 문자적으로는 ‘내 앞에서 옮겨지다/치워지다’에 가깝지만, 도시가 심판으로 인해 현존 질서에서 한동안 हट는다는 뜻을 한국어로 가장 자연스럽게 드러냈습니다.
  doctrine_reference: 심판과 유배의 일시성에 대한 본문 내 서술
