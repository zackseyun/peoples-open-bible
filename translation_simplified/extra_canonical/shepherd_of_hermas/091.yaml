  text: Τί οὖν, φημί, κύριε, ἐὰν οὗτοι οἱ ἄνθρωποι, τοιοῦτοι ὄντες, μετανοήσωσι καὶ ἀποβάλωσι τὰς ἐπιθυμίας
    τῶν γυναικῶν τούτων, καὶ ἐπανακάμψωσιν ἐπὶ τὰς παρθένους, καὶ ἐν τῇ δυνάμει αὐτῶν καὶ ἐν τοῖς ἔργοις
    αὐτῶν πορευθῶσιν, οὐκ εἰσελεύσονται εἰς τὸν οἶκον τοῦ Θεοῦ; 2. Εἰσελεύσονται, φησίν, ἐὰν τούτων τῶν
    γυναικῶν ἀποβάλωσι τὰ ἔργα, τῶν δὲ παρθένων ἀναλάβωσι τὴν δύναμιν καὶ ἐν τοῖς ἔργοις αὐτῶν πορευθῶσι.
    διὰ τοῦτο γὰρ καὶ τῆς οἰκοδομῆς ἀνοχὴ ἐγένετο, ἵνα ἐὰν μετανοήσωσιν οὗτοι, ἀπέλθωσιν εἰς τὴν οἰκοδομὴν
    τοῦ πύργου. ἐὰν δὲ μὴ μετανοήσωσι, τότε ἄλλοι ἀπελεύσονται, καὶ οὗτοι εἰς τέλος ἐκβληθήσονται. 3.
    ἐπὶ τούτοις πᾶσιν ηὐχαρίστησα τῷ Κυρίῳ, ὅτι ἐσπλαγχνίσθη ἐπὶ πᾶσι τοῖς ἐπικαλουμένοις τὸ ὄνομα αὐτοῦ,
    καὶ ἐξαπέστειλε τὸν ἄγγελον τῆς μετανοίας εἰς ἡμᾶς τοὺς ἁμαρτήσαντας εἰς αὐτόν, καὶ ἀνεκαίνισεν ἡμῶν
    τὸ πνεῦμα, καὶ ἤδη κατεφθαρμένων ἡμῶν καὶ μὴ ἐχόντων ἐλπίδα τοῦ ζῆν ἀνενέωσε τὴν ζωὴν ἡμῶν. 4. Νῦν,
    φημί, κύριε, δήλωσόν μοι, διατί ὁ πύργος χαμαὶ οὐκ ᾠκοδόμηται, ἀλλ᾿ ἐπὶ τὴν πέτραν καὶ ἐπὶ τὴν πύλην.
    Ὅτι, φησίν, ἄφρων εἶ καὶ ἀσύνετος, [ἐπερωτᾷς]. Ἀνάγκην ἔχω, φημί, κύριε, πάντα ἐπερωτᾶν σε, ὅτι οὐδ᾿
    ὅλως οὐδὲν δύναμαι νοῆσαι· τὰ γὰρ πάντα μεγάλα καὶ ἔνδοξά ἐστι καὶ δυσνόητα τοῖς ἀνθρώποις. 5. Ἄκουε,
    φησί· τὸ ὄνομα τοῦ υἱοῦ τοῦ Θεοῦ μέγα ἐστὶ καὶ ἀχώρητον, καὶ τὸν κόσμον ὅλον βαστάζει. εἰ οὖν πᾶσα
    ἡ κτίσις διὰ τοῦ υἱοῦ [τοῦ Θεοῦ] βαστάζεται, τί δοκεῖς τοὺς κεκλημένους ὑπ᾿ αὐτοῦ καὶ τὸ ὄνομα φοροῦντας
    τοῦ υἱοῦ [τοῦ Θεοῦ] καὶ πορευομένους ταῖς ἐντολαῖς αὐτοῦ; 6. βλέπεις οὖν ποίους βαστάζει; τοὺς ἐξ
    ὅλης καρδίας φοροῦντας τὸ ὄνομα αὐτοῦ. αὐτὸς οὖν θεμέλιος αὐτοῖς ἐγένετο, καὶ ἡδέως αὐτοὺς βαστάζει,
    ὅτι οὐκ ἐπαισχύνονται τὸ ὄνομα αὐτοῦ φορεῖν.
