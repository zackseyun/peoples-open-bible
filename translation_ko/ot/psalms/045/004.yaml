- source_word: הוֹדְךָ
  english_pob_choice: your splendor
  chosen_korean: 당신의 위엄
  alternatives_korean:
  - 당신의 영광
  - 당신의 찬란함
  lexicon: HALOT
  rationale: הוֹד는 왕적·시적 문맥에서 광휘, 위엄, 영광의 결을 가지므로, 다음 어휘와의 중복을 피하면서 품격을 드러내는 ‘위엄’을 선택했습니다.
- source_word: וַהֲדָרֶךָ
  english_pob_choice: and your majesty
  chosen_korean: 당신의 장엄함
  alternatives_korean:
  - 당신의 위엄
  - 당신의 화려함
  lexicon: HALOT
  rationale: הָדָר는 장식된 위대함, 장엄함, 위엄을 나타내므로, 앞의 ‘위엄’과 구별되면서도 왕적 평행구를 살리는 ‘장엄함’이 적절합니다.
theological_decisions:
- issue: 왕적 호칭과 메시아적 해석의 긴장
  chosen_reading: 본문의 직접 화법은 왕-전사에게 향한 것으로 유지하고, 번역어 자체는 메시아적 동일시를 명시하지 않았습니다.
  alternative_readings:
  - 후대 정경적 사용을 따라 메시아적 함의를 번역문에 직접 반영
  - 전통 교회 용어로 ‘기름부음 받은 왕’의 의미를 풀어 쓰기
  rationale: 히브리어 본문은 우선 왕적 전사를 향한 시적 호격이므로, 번역은 즉시적 의미를 보존하고 해석적 확장은 독자가 주석과 정경 맥락에서 읽도록 남겨 두는 편이 원문에 더 충실합니다.
  doctrine_reference: 의미 보존과 해석의 긴장 유지
