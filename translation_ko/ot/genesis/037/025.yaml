base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: ko
  text: 그들이 앉아 빵을 먹고 있는데, 눈을 들어 보니, 보라, 길르앗에서 이스마엘 사람들의 상단이 오고 있었습니다. 그들의 낙타들은 고무수지와 발삼과 라다넘[a]을 싣고, 그것들을 이집트로 내려가서 가져가려 하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘라다넘’(לֹט)은 향기 나는 수지로 흔히 이해됩니다. 정확한 식별에는 논의가 있으며, 일부 번역은 이를 ‘몰약’으로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 음식
  lexicon: לֶחֶם
  rationale: 문맥상 일반적인 식사를 가리키지만, 한국어에서는 가장 직접적이고 자연스러운 기본식품어인 ‘빵’이 POB의 직역성을 잘 살립니다.
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  english_pob_choice: a caravan of Ishmaelites
  chosen_korean: 이스마엘 사람들의 대상
  alternatives_korean:
  - 이스마엘 사람들의 행렬
  - 이스마엘 사람들의 상단
  lexicon: אֹרְחָה
  rationale: אֹרְחָה는 이동하는 상인 무리/대상을 뜻하므로, 전통 번역의 ‘대상’을 유지하되 ‘이스마엘 사람들’로 소유격 관계를 분명히 했습니다.
- source_word: נְכֹאת, צְרִי, וָלֹט
  english_pob_choice: gum, balm, and myrrh
  chosen_korean: 향품과 유향과 몰약
  alternatives_korean:
  - 향료와 유향과 몰약
  - 수지와 유향과 몰약
  lexicon: נְכֹאת / צְרִי / לֹט
  rationale: 세 품목은 향료·수지 계열의 화물로 보이므로, 너무 풀이하지 않고 한국어 성경에서 익숙한 물품명으로 대응했습니다.
- source_word: הוֹלְכִים לְהוֹרִיד מִצְרָיְמָה
  english_pob_choice: on their way to take it down to Egypt
  chosen_korean: 이집트로 내려가고 있었습니다
  alternatives_korean:
  - 이집트로 가져가려 가고 있었습니다
  - 이집트로 내려가는 길이었습니다
  lexicon: הוֹלֵךְ + הוֹרִיד
  rationale: 동작의 방향성을 살려 ‘내려가다’를 유지했고, 목적어가 생략된 히브리어 표현은 한국어에서 자연스럽게 풀어 번역했습니다.
theological_decisions:
