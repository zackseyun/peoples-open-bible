  to: Wait for Yahweh; be strong, and let your heart take courage[a]; and wait for Yahweh[b].
  rationale: 'Replacing interpretive “yes” with “and” is a modest source-nearer correction: the repeated imperative is introduced by ordinary וְ, and repetition itself supplies the emphasis. However, the proposal still attaches footnote a to the first occurrence of “Yahweh,” though that note concerns וְיַאֲמֵץ, the middle clause. Move it there. The lexical alternative in footnote b may remain on the final repeated imperative, while naturally applying to both occurrences.'
