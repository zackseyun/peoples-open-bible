id: JOB.37.13
reference: Job 37:13
source:
  edition: WLC
  text: אִם לְ/שֵׁ֥בֶט אִם לְ/אַרְצ֑/וֹ אִם לְ֝/חֶ֗סֶד יַמְצִאֵֽ/הוּ־־־׃
translation:
  text: Whether as a rod of discipline, for the good of his land, or to show steadfast love, he brings it.
  philosophy: dynamic
lexical_decisions:
- source_word: אִם
  chosen: whether
  alternatives:
  - if
  lexicon: HALOT
  rationale: Here אִם introduces alternative purposes or outcomes in a threefold sequence, not a simple conditional protasis. 'Whether' best reflects the repeated disjunctive structure in English.
- source_word: לְשֵׁבֶט
  chosen: for a rod
  alternatives:
  - for a rod
  - for punishment
  - for discipline
  lexicon: HALOT
  rationale: Retains the source image while context allows its disciplinary force to be understood.
- source_word: לְאַרְצוֹ
  chosen: for his land
  alternatives:
  - for his earth
  - for his country
  lexicon: HALOT
  rationale: אֶרֶץ commonly means 'land/earth.' With the 3ms suffix, 'his land' is the most natural rendering in context, referring to the territory under God's governance rather than the whole globe in abstraction.
- source_word: לְחֶסֶד
  chosen: for steadfast love
  alternatives:
  - for mercy
  - for covenant loyalty
  - for kindness
  lexicon: HALOT
  rationale: חֶסֶד is a weighty covenantal term often rendered 'steadfast love.' Even in a non-covenant-explicit context, this rendering preserves its rich sense better than the thinner 'kindness' or the narrower 'mercy.'
- source_word: יַמְצִאֵהוּ
  chosen: he causes it to come
  alternatives:
  - he makes it come
  - he brings it about
  - he causes it to find him
  lexicon: HALOT
  rationale: Represents the causative bringing/arrival sense without reducing it to an abstract occurrence.
