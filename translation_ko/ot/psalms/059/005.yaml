  yaml_path: translation/ot/psalms/059/005.yaml
  text: But you, O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers.[a] Selah[b]
  footnotes:
  - marker: a
    text: Or “show no mercy to any treacherous evildoers.” The Hebrew verb means “show favor” or “be gracious.”
    reason: lexical_alternative
  - marker: b
    text: “Selah” is likely a musical or liturgical notation; its precise meaning is uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 여호와여, 만군의 하나님, 이스라엘의 하나님이시여, 일어나셔서 모든 민족을 벌하소서[a]. 배신하며 악을 행하는 모든 자에게 은혜를 베풀지 마소서[b]. 셀라[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 민족을 찾아가 살피소서” 또는 “모든 민족에게 책임을 물으소서.” 히브리어 פקד는 문맥에 따라 ‘찾아가다’, ‘살피다’, ‘책임을 묻다’, ‘벌하다’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “배신하며 악을 행하는 어떤 자에게도 자비를 베풀지 마소서.” 히브리어 חנן은 본래 ‘은혜를 베풀다, 호의를 보이다’를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘셀라’는 음악 또는 예배와 관련된 표지로 보이나, 정확한 뜻은 확실하지 않습니다.
    reason: cultural_note
