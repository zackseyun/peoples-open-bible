  naturalness: ‘제 도움을 청하는 부르짖는 소리에 귀 기울여 주십시오’는 현대 표준 한국어에서 자연스럽고, 간청하는 기도문의 합쇼체를 유지합니다. ‘나의 왕, 나의 하나님이여’는 직접 호격의 시편 문체를 자연스럽게 전달합니다.
  terminology: ‘하나님’은 אֱלֹהַי에 적절하며, ‘왕’도 מַלְכִּי를 보존합니다. 원문에 יהוה가 없으므로 ‘야훼여’는 넣지 않아야 합니다. אֶתְפַּלָּל의 미완료형은 본문에서 ‘기도합니다’로 자연스럽게 옮기고, 가능한 미래 뉘앙스는 각주로 보존합니다.
