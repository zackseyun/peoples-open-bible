  source_fidelity: 초안은 ‘사자들’, ‘에브라임 산’, ‘미디안을 치러 내려가서’, ‘물을 막으라’ 등에서 히브리어의 범위와 동작을 충분히 반영하지 못합니다. 특히 לָכַד는 물을 ‘막다’가 아니라 장악하거나 점령한다는 뜻이며, 에브라임 사람들이 소집된 뒤 그 물들을 장악한 사건도 명시되어야 합니다.
  naturalness: 현대 표준 한국어 합쇼체 서술로, 지명과 지시문의 구조를 분명히 하고 직접 인용을 사용하면 자연스럽습니다.
  terminology: מַלְאָכִים은 문맥상 ‘전령들’로, הַר אֶפְרַיִם은 단일 산이 아닌 ‘에브라임 산지’로 옮기는 것이 적절합니다. הַמַּיִם은 본문에서 직역에 가까운 ‘물’을 유지하되 전략적 건넘목일 가능성은 각주로 처리합니다.
  issues:
  - severity: high
    issue: ‘에브라임 온 산’은 지역명 הַר אֶפְרַיִם의 의미를 부정확하게 전달합니다.
    rationale: 이는 단수 산봉우리가 아니라 에브라임의 산지·고지대 지역을 가리킵니다.
  - severity: high
    issue: ‘물을 막으라/물을 막으니라’는 לָכַד의 의미를 바꿉니다.
    rationale: 동사는 붙잡다, 장악하다, 점령하다의 뜻이며, 물을 차단한다는 의미를 본문에 추가해서는 안 됩니다.
  - severity: medium
    issue: 명령의 대상과 후속 행동이 충분히 드러나지 않습니다.
    rationale: 본문은 미디안을 맞으러 내려가라는 명령, 물과 요단을 장악하라는 명령, 에브라임 사람들이 소집되어 이를 실행한 일을 차례로 서술합니다.
  - severity: medium
    issue: וַיִּצָּעֵק의 어려운 표현을 반영하는 설명이 없습니다.
    rationale: 문맥상 에브라임 사람들이 소집되었다는 뜻으로 옮길 수 있으나, 다른 이해 가능성을 각주로 밝혀 모호성을 보존하는 것이 안전합니다.
  revised_text: 기드온이 에브라임 산지 전역에 전령들을 보내며 말했습니다. “내려가 미디안을 맞아, 벳바라까지의 물과 요단을 장악하십시오.” 그러자 에브라임의 모든 사람이 소집되었고, 그들은 벳바라까지의 물과 요단을 장악했습니다.
