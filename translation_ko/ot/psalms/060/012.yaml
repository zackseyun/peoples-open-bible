  yaml_path: translation/ot/psalms/060/012.yaml
  text: With God[a] we will do valiantly, and he will trample our adversaries[b].
  footnotes:
  - marker: a
    text: Or “By God.” The Hebrew preposition can express close association or means.
    reason: lexical_alternative
  - marker: b
