  text: וְ/זִיזָ֨א בֶן שִׁפְעִ֧י בֶן אַלּ֛וֹן בֶּן יְדָיָ֥ה בֶן שִׁמְרִ֖י בֶּן שְׁמַֽעְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/037.yaml
  text: and Ziza son of Shiphi[a], son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.
  footnotes:
  - marker: a
    text: Or possibly "Zizah," reflecting a different English convention for the final syllable of the name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 스마야의 아들 시므리의 아들 여다야의 아들 알론의 아들 시피의 아들 지사[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 지사(영어 POB의 Ziza)는 히브리어 끝 글자 알레프를 반영한 표기입니다. 일부 영어 전통에서는 Zizah로 적기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זִיזָ֨א
  english_pob_choice: and Ziza
  chosen_korean: 그리고 지사
  alternatives_korean:
  - 그리고 지자
  - 그리고 시자
  lexicon: HALOT
  rationale: 문맥상 족보를 이어 주는 접속사는 「그리고」로 옮기고, 고유명사는 번역하지 않고 음역했습니다. 히브리어 끝소리 알레프를 반영해 영어 POB의 Ziza에 대응하는 한국어는 지사로 두는 편이 가장 자연스럽습니다.
- source_word: שִׁפְעִ֧י
  english_pob_choice: Shiphi
  chosen_korean: 시사
  alternatives_korean:
  - 시피
  - 시프히
  lexicon: HALOT
  rationale: 히브리어 인명은 한국어 음역으로 처리하되, 족보 표기의 간결성과 발음 가능성을 고려해 시사로 적었습니다. 영어 POB의 Shiphi에 해당하는 이름을 한국어 표기 관행에 맞게 옮긴 것입니다.
- source_word: בֶן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 의 아들
  - ~의 아들
  lexicon: HALOT
  rationale: 족보 공식에서 בֶן은 혈연 관계를 드러내는 기본 표현이므로 「아들」로 직역해 원문 구조를 보존했습니다.
- source_word: בֶן אַלּוֹן
  english_pob_choice: son of Allon
  chosen_korean: 앨론의 아들
  alternatives_korean:
  - 알론의 아들
  lexicon: HALOT
  rationale: אַלּוֹן은 일반명사 뜻과 구별되는 인명이므로 「참나무」 등으로 번역하지 않고 음역했습니다. 영어 POB의 Allon에 맞춰 한국어에서는 앨론으로 옮겼습니다.
- source_word: יְדָיָ֥ה
  english_pob_choice: Jedaiah
  chosen_korean: 여대야
  alternatives_korean:
  - 제다야
  - 예다야
  lexicon: HALOT
  rationale: 히브리어 인명 יְדָיָה는 한국어 성서 번역에서 익숙한 형태를 우선하여 여대야로 음역했습니다. 영어 POB의 Jedaiah와 대응하면서도 한국어 독자에게 읽기 쉽습니다.
- source_word: שִׁמְרִ֖י
  english_pob_choice: Shimri
  chosen_korean: 시므리
  alternatives_korean:
  - 심리
  lexicon: HALOT
  rationale: 히브리어 shin을 반영해 시-로 시작하는 표기를 택했고, 인명이라 뜻풀이보다 음역이 적절합니다.
- source_word: שְׁמַֽעְיָֽה
  english_pob_choice: Shemaiah
  chosen_korean: 스마야
  alternatives_korean:
  - 세마야
  - 시마야
  lexicon: HALOT
  rationale: שְׁמַעְיָה는 한국어 성서 표기 전통을 고려해 스마야로 옮겼습니다. 영어 POB의 Shemaiah에 대응하는 이름을 과도하게 개의적으로 바꾸지 않았습니다.
