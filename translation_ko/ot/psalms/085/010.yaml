source:
  edition: WLC
  text: אַ֤ךְ קָר֣וֹב לִ/ירֵאָ֣י/ו יִשְׁע֑/וֹ לִ/שְׁכֹּ֖ן כָּב֣וֹד בְּ/אַרְצֵֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/010.yaml
  text: Steadfast love and truth have met[a][b]; righteousness and peace have kissed.
  footnotes:
  - marker: a
    text: Or 'Indeed, his deliverance is near those who fear him.'
    reason: lexical_alternative
  - marker: b
    text: '''Glory'' may refer to God''s manifest presence or to honor restored to the land.'
    reason: alternative_reading
translation:
  language: ko
  text: 변함없는 사랑과 진실[a]이 서로 만났고, 의[b]와 평화가 서로 입맞추었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진실’은 ‘신실함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의’는 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 참으로
  alternatives_korean:
  - 분명히
  - 확실히
  - 오직
  lexicon: HALOT
  rationale: 여기서 אַךְ는 제한이 아니라 강한 확언을 나타내므로, 한국어에서는 자연스럽고 힘 있는 부사인 ‘참으로’가 가장 잘 맞습니다.
- source_word: לִירֵאָיו
  english_pob_choice: those who fear him
  chosen_korean: 그를 경외하는 이들
  alternatives_korean:
  - 그를 두려워하는 자들
  - 그를 공경하는 이들
  lexicon: HALOT
  rationale: ירא의 핵심은 단순한 존중이 아니라 하나님을 향한 경외이므로, ‘경외하다’를 살리되 현대 한국어의 자연스러운 표현으로 옮겼습니다.
- source_word: יִשְׁעוֹ
  english_pob_choice: his salvation
  chosen_korean: 그의 구원
  alternatives_korean:
  - 그의 구출
  - 그의 구원하심
  lexicon: HALOT
  rationale: ישׁע는 구원/구출의 뜻을 가지며, 시편 문맥에서는 신학적 울림을 살리는 ‘구원’이 가장 적절합니다.
- source_word: כָּבוֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 영화
  - 광채
  lexicon: HALOT
  rationale: כָּבוֹד는 하나님의 임재를 가리킬 수도, 회복된 영예를 가리킬 수도 있어 문맥상 여지를 남기기 위해 포괄적인 ‘영광’을 유지했습니다.
theological_decisions:
- issue: ‘영광’(כָּבוֹד)의 지시 대상
  chosen_reading: 하나님의 임재, 회복된 존귀, 혹은 그 땅에 임할 영화로운 상태를 한 가지로 못 박지 않고 ‘영광’으로 남겼습니다.
  alternative_readings:
  - 하나님의 영광이 우리 땅에 머물게 하려 하십니다
  - 우리 땅의 존귀가 회복되게 하려 하십니다
  rationale: 히브리어는 의도적으로 열린 표현이므로, 해석을 지나치게 특정하지 않고 시적·신학적 긴장을 보존하는 것이 본문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
