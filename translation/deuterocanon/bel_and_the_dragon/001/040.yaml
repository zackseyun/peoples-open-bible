  text: κατέστησεν τὸν Ἀμβακοὺμ παραχρῆμα εἰς τὸν τόπον αὐτοῦ. ὁ δὲ Βασιλεὺς ἦλθεν τῇ ἡμέρᾳ τῇ ἑβδόμῃ πενθῆσαι τὸν Δανιήλ, καὶ ἦλθεν ἐπὶ τὸν λάκκον καὶ ἐνέβλεψεν, καὶ ἰδοὺ Δανιὴλ καθήμενος.
  language: Greek
