  from: Pass through your land like the Nile[a], daughter of Tarshish[c][b]; there is no restraint anymore.
  to: Overflow your land like the Nile, daughter of Tarshish; nothing restrains you now[a].
  rationale: The automated revision preferred “Pass through” to preserve the verb-plus-simile structure, but the Nile image and final clause point to unrestrained spreading. I return to the earlier “Overflow” because it conveys that meaning while retaining the image; no maintainer revision is recorded.
