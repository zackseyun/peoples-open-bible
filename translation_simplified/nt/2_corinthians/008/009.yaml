translation:
  language: en
  text: You know the grace our Lord Jesus Christ showed. Though he was rich, he became poor for your sake. He did this so that through his poverty you might become rich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paul does not explain exactly what “rich” and “poor” mean here; they describe Christ’s self-giving without limiting it to material wealth.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For you know the grace of our Lord Jesus Christ, that
  simplified_phrase: You know the grace our Lord Jesus the Messiah showed.
  preserved_meaning: The Corinthians already know Christ’s gracious act, and Messiah retains the meaning of his Greek title.
  reasoning_layer_used: POB lexical decisions for γινώσκετε, χάριν, and Ἰησοῦ Χριστοῦ
  rationale: The active wording makes the opening easier to understand while retaining grace and Messiah.
- pob_phrase: though he was rich, yet for your sake he became poor
  simplified_phrase: Though he was rich, he became poor for your sake.
  preserved_meaning: Christ willingly moved from richness to poverty for the readers’ benefit.
  reasoning_layer_used: POB lexical decisions for πλούσιος ὤν, δι’ ὑμᾶς, and ἐπτώχευσεν
  rationale: A separate sentence highlights the rich-poor contrast without defining the metaphor.
- pob_phrase: so that you by his poverty might become rich
  simplified_phrase: He did this so that through his poverty you might become rich.
  preserved_meaning: Christ’s poverty is the means by which the readers may become rich.
  reasoning_layer_used: POB lexical decisions for τῇ ἐκείνου πτωχείᾳ and πλουτήσητε
  rationale: An explicit subject and natural word order clarify the purpose while preserving the verbal contrast.
interpretive_expansions:
- pob_phrase: the grace of our Lord Jesus Christ
  rendering: the grace our Lord Jesus the Messiah showed
  claim: Grace here is expressed in Christ’s self-giving action described in the verse.
  evidence:
