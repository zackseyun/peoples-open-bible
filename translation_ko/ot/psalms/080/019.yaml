translation:
  language: ko
  text: 여호와 만군의 하나님이여, 우리를 회복시켜 주십시오[a]. 주님의 얼굴빛을 비추어 주십시오. 그러면 우리가 구원을 받겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 돌이켜 주십시오’ 또는 ‘우리를 돌아오게 해 주십시오’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그러면 우리는 구원을 받을 것입니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא נָסוֹג מִמֶּךָּ
  english_pob_choice: Then we will not turn back from you
  chosen_korean: 그러면 우리가 주님에게서 돌아서지 않겠습니다
  alternatives_korean:
  - 그러면 우리는 주님에게서 물러서지 않겠습니다
  - 그러면 우리는 주님에게서 돌아가지 않겠습니다
  lexicon: HALOT
  rationale: נָסוֹג는 ‘뒤로 물러나다/돌아서다’의 뜻이므로, 현대 한국어에서는 관계적·신앙적 이탈을 자연스럽게 드러내는 ‘돌아서다’가 가장 적절합니다.
- source_word: תְּחַיֵּנוּ
  english_pob_choice: revive us
  chosen_korean: 우리에게 생명을 주십시오
  alternatives_korean:
  - 우리를 소생시켜 주십시오
  - 우리를 살려 주십시오
  - 우리를 다시 살게 해주십시오
  lexicon: HALOT
  rationale: חיה의 Piel은 ‘살게 하다, 생명을 주다, 소생시키다’의 폭이 있어, ‘생명을 주십시오’로 넓은 의미를 살리면서도 한국어 문맥에서 지나치게 좁은 ‘영적 부흥’으로 한정하지 않았습니다.
- source_word: וּבְשִׁמְךָ נִקְרָא
  english_pob_choice: and we will call on your name
  chosen_korean: 그리고 주님의 이름을 부르겠습니다
  alternatives_korean:
  - 그리고 주님의 이름을 부르짖겠습니다
  - 그리고 주님의 이름을 부를 것입니다
  - 그리고 주님의 이름을 부르겠습니다
  lexicon: HALOT
  rationale: קרא + 이름은 ‘이름을 부르다/부르짖다’의 관용구이므로, 예배와 간구의 뉘앙스를 유지하면서도 직역의 어색함을 피하는 표현을 택했습니다.
- source_word: מִמֶּךָּ
  english_pob_choice: from you
  chosen_korean: 주님에게서
  alternatives_korean:
  - 주님으로부터
  - 주님에게서
  lexicon: HALOT
  rationale: 분리의 מן은 한국어에서 ‘-에게서’가 가장 자연스럽고, 시편의 언약적 관계를 ‘주님’ 호칭으로 옮기는 것이 문맥에 맞습니다.
theological_decisions:
- issue: תְּחַיֵּנוּ의 생명/회복 범위
  chosen_reading: 하나님께서 백성에게 생명을 주셔서 그들이 그분에게서 돌아서지 않고 계속 그 이름을 부르게 하시는 간구로 읽었습니다.
  alternative_readings:
  - 회복을 구하는 기도
  - 육체적 보존을 구하는 기도
  rationale: 히브리어 חיה는 ‘살게 하다, 소생시키다, 보존하다’까지 포함하므로, 번역은 어느 한 방향으로만 좁히지 않고 폭을 남겨 두는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
