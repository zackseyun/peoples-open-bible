revisions:
- from: 그러나 저는 주의 풍성한 인애로 주의 집에 들어가겠습니다. 저는 주의 거룩한 성전을 향하여 주께 엎드려 경배하겠습니다. 주를 경외함으로 말입니다.[a][b]
  to: 야훼여, 제 대적들[a] 때문에 주의 의로 저를 인도하시고, 주의 길을 제 앞에서 곧게 하여 주십시오.[b]
  rationale: 제시된 WLC 본문을 직접 번역했습니다. נְחֵנִי는 기도 요청에 맞게 ‘저를 인도하시고’로, בְּצִדְקָתֶךָ는 하나님의 의를 근거·기준으로 삼는 표현인 ‘주의 의로’로 옮겼습니다. לְמַעַן שׁוֹרְרָי는 대적 때문에 생긴 위협적 상황을 나타내므로 ‘제 대적들 때문에’로 번역하고 어휘적 세부 뉘앙스를 각주에 남겼습니다. הוֹשַׁר는 ‘곧게 하다’로, דַּרְכֶּךָ는 ‘주의 길’로 보존했습니다.
