  terminology: ‘야훼’, ‘납달리’, ‘스불론’, ‘다볼 산’은 원문 중심의 학술적 한국어 표기와 일관됩니다. ‘진군하라’는 군사 문맥을 적절히 전달하며, 후반의 ‘데리고 가라’와도 구별됩니다.
