translation:
  language: en
  text: Even if someone sins against you seven times in a day and comes back to you[a] seven times, saying, “I am reorienting[r1] myself,” you must forgive that person.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “turns to you.”
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if he sins against you
  simplified_phrase: if someone sins against you
  preserved_meaning: A person repeatedly commits an offense against the hearer.
  reasoning_layer_used: POB lexical decision on ἁμαρτήσῃ εἰς σὲ and αὐτῷ
  rationale: “Someone” and “that person” make the generic reference natural without changing who must be forgiven.
translation_notes:
  risk_flags:
  - risk: “Must forgive” states the imperative force more directly than the Greek future form.
    mitigation: The POB theological audit explicitly recognizes this command sense and lists this rendering.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
