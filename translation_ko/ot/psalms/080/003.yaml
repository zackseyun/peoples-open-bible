theological_decisions:
- issue: 하나님의 개입을 청하는 기도문 번역
  chosen_reading: ‘주의 능력을 일으키시고 우리를 구원하시려고 오소서’로, 하나님이 친히 개입하셔서 구원해 주시기를 구하는 간구로 읽었습니다.
  alternative_readings:
  - ‘주의 능력을 일으키시고 우리를 구원하러 오소서’
  - ‘주의 능력을 일으키시고 우리를 구원 위해 가소서’
  rationale: 문맥은 교리 진술이 아니라 절박한 기도이므로, 원문의 동적 청원을 한국어 기도체로 자연스럽게 표현했습니다.
  doctrine_reference: 시편의 탄원시 문맥
