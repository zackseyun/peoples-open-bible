  yaml_path: translation/ot/psalms/069/010.yaml
  text: When I wept and fasted[a], it became a reproach to me.
  footnotes:
  - marker: a
    text: Hebrew literally, “When I wept with the fasting of my soul,” or “When I wept in fasting, my soul.” The expression describes the speaker himself fasting.
    reason: literal_form
translation:
  language: ko
  text: 제가 금식으로 제 자신을 괴롭게 하여 울었더니, 그것이 제게 모욕거리가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 더 직역하면 ‘내 영혼을 금식으로 하여 울었더니’입니다. ‘내 영혼’은 여기서 ‘나 자신’을 가리키며, 금식과의 정확한 문법적 관계는 다소 압축되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִנְאַת
  english_pob_choice: zeal
  chosen_korean: 열심
  alternatives_korean:
  - 열정
  - 질투
  lexicon: HALOT
  rationale: 이 문맥에서는 시편 화자의 하나님 집을 향한 뜨거운 헌신을 가리키므로, 부정적 뉘앙스의 ‘질투’보다 ‘열심’이 의미를 더 정확히 드러냅니다.
- source_word: בֵּיתְךָ
  english_pob_choice: your house
  chosen_korean: 주님의 집
  alternatives_korean:
  - 주님의 집
  - 주님의 성전
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘당신의 집’이며, POB가 ‘house’를 유지한 점을 따라 ‘집’으로 옮기되 한국어 문맥에서 주님을 명시해 대상이 분명해지도록 했습니다. ‘성전’은 의미를 좁혀 원문보다 구체화합니다.
- source_word: אֲכָלָתְנִי
  english_pob_choice: has consumed me
  chosen_korean: 저를 삼켰습니다
  alternatives_korean:
  - 저를 소모시켰습니다
  - 저를 먹어 치웠습니다
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘먹다’이지만 관용적으로 ‘삼키다/소모하다’의 강한 소진을 뜻하므로, 시적 강도를 살리면서도 자연스러운 한국어인 ‘삼켰습니다’를 택했습니다.
- source_word: חֶרְפּוֹת ... חֹרְפֶיךָ
  english_pob_choice: the reproaches of those who reproach you
  chosen_korean: 주님을 비방하는 자들의 모욕
  alternatives_korean:
  - 주님을 조롱하는 자들의 조롱
  - 주님을 욕하는 자들의 욕설
  lexicon: HALOT
  rationale: 명사와 분사의 어근 반복을 한국어에서도 최대한 보존하기 위해 ‘비방하는 자들의 모욕’으로 옮겼습니다. ‘모욕’은 공개적 수치와 비난의 의미를 살립니다.
theological_decisions:
- issue: 시편 69:10의 메시아적 적용을 본문에 직접 반영할지 여부
  chosen_reading: 본문은 시편 화자의 직접적 진술로 번역하고, 신약의 적용은 본문 밖으로 남겼습니다.
  alternative_readings:
  - 메시아적 성취를 암시하는 표현을 본문에 더 분명히 드러내는 읽기
  rationale: 히브리어 본문 자체는 시편 화자의 경험을 말하므로, 후대의 요한복음 인용을 본문 의미에 섞어 넣지 않고 원문의 1차 의미를 유지했습니다.
  doctrine_reference: 원어 우선 원칙; 본문 의미와 정경적 적용의 구분
