id: JDT.16.10
reference: Judith 16:10
source:
  edition: lxx-swete-1909
  text: ἔφριξαν Πέρσαι τὴν τόλμαν αὐτῆς, καὶ Μῆδοι τὸ θράσος αὐτῆς ἐρράχθησαν.
  language: Greek
  pages:
  - 798
