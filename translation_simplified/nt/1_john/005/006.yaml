translation:
  language: en
  text: Jesus Christ is the one who came by water and blood.[a] He did not come by water alone, but by water and blood. And the Spirit testifies, because the Spirit is the truth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “through water and blood.” The phrase may refer to Jesus’ baptism and death, his birth and death, or baptism and the Lord’s Supper; the wording leaves the meaning open.
    reason: alternative_reading
  - marker: b
    text: Or “testifies that the Spirit is the truth.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: This is the one who came by water and blood—Jesus the Messiah
  simplified_phrase: Jesus the Messiah is the one who came by water and blood
  preserved_meaning: Jesus is emphatically identified as the one who came by water and blood.
  reasoning_layer_used: POB lexical decisions for Οὗτός, ὁ ἐλθὼν, and Ἰησοῦς Χριστός
  rationale: Putting Jesus first makes the identification easier to follow without weakening it.
- pob_phrase: not by the water only, but by the water and by the blood
  simplified_phrase: He did not come by water alone, but by water and blood
  preserved_meaning: Both water and blood remain essential to the contrast.
  reasoning_layer_used: POB lexical and theological decisions on water and blood
  rationale: A complete sentence and less repetition make the contrast clearer while preserving both images.
- pob_phrase: the Spirit is the one testifying
  simplified_phrase: the Spirit testifies
  preserved_meaning: The Holy Spirit bears witness.
  reasoning_layer_used: POB lexical decision for τὸ πνεῦμά and τὸ μαρτυροῦν
  rationale: The direct verb is natural English and keeps the Spirit as the active witness.
