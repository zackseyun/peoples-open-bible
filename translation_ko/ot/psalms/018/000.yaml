base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/000.yaml
  text: For the choirmaster. Of David, the servant of Yahweh[a], who spoke to Yahweh the words of this song on the day when Yahweh rescued him from the hand[b] of all his enemies and from the hand of Saul.
  footnotes:
  - marker: a
    text: Or “slave of Yahweh.” The Hebrew term can denote a servant or slave; here it functions as an honorific title for David.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “from the hand of,” an idiom referring to someone’s power or control.
    reason: cultural_note
translation:
  language: ko
  text: 지휘자를 위하여. 야훼의 종[a] 다윗의 시. 야훼께서 그를 모든 원수의 손에서와 사울의 손에서[b] 건져 주신 날에, 다윗이 이 노래의 말씀을 야훼께 아뢰었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 노예’. 히브리어 עֶבֶד은 종이나 노예를 뜻할 수 있으나, 여기서는 다윗에게 붙은 존칭적 호칭이므로 ‘종’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘손에서’라는 관용구를 사용하며, 이는 누군가의 권세나 지배에서 건져 냄을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 인도자를 위하여
