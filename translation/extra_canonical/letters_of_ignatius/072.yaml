  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'I therefore did my own part, as a man composed unto union. But where there is division and anger, there God abideth not. Now the Lord forgiveth all men when they repent, if repenting they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who shall strike off every fetter from you; and I entreat you,


    Do ye nothing in a spirit of factiousness but after the teaching of Christ. For I heard certain persons saying, If I find it not in the charters, I believe it not in the Gospel. And when I said to them, It is written, they answered me That is the question. But as for me, my charter is Jesus Christ, the inviolable charter is His cross and His death and His resurrection, and faith through Him; wherein I desire to be justified through your prayers.'
translation:
  text: 'I therefore did my part, as a man committed to unity. But where there is division and anger, God does not dwell. Now the Lord forgives everyone when they repent[a], if in repentance they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who will strike off every fetter from you; and I urge you,


    Do nothing in a spirit of faction, but according to the teaching of Christ. For I heard certain people saying, “If I do not find it in the charters, I do not believe it in the Gospel.” And when I said to them, “It is written,” they answered me, “That is the question.” But for me, my charter is Jesus Christ; the inviolable charter is his cross, his death, his resurrection, and faith through him. In these I desire to be justified through your prayers.'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - Provisional rendering based on the supplied public-domain English witness.
  - “Charter” and “charters” are retained to preserve the witness’s repeated image.
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in these appeals to reconciliation and ecclesial unity; keep distinct return expressions and the authors own claims about the bishop. This reader text remains an adaptation of the recorded English witness, not a verbatim quotation or a newly verified translation of the ancient-language text. The witness is unchanged.
    reason: lexical_alternative
