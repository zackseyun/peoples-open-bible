review_pass:
  verdict: revise
  source_fidelity: 본문의 대조 접속사(δέ), 미완료 과거(ἔλεγεν), 그리고 예수의 몸과 성전을 연결하는 비유를 대체로 충실히 옮겼습니다. 다만 ‘그의 몸의 성전’은 한국어에서 소유 관계처럼 들려, 몸 자체가 성전이라는 원문의 식별 관계를 충분히 드러내지 못합니다.
  naturalness: ‘자신의 몸인 성전’이 현대 표준 한국어에서 더 자연스럽고 의미 관계도 명료합니다. 예수에 대한 서술에는 ‘말씀하고 계셨습니다’가 합쇼체 및 성경 문체에 더 알맞습니다.
  terminology: ναός의 기본 번역으로 ‘성전’을 유지하는 것이 적절합니다. 각주에서 이를 ‘내성소’라고 한정하는 것은 지나치므로, 성전 전체 단지와 구별되는 성소/성전 건물을 가리키는 경우가 많다는 정도로 수정해야 합니다.
  issues:
  - severity: medium
    issue: ‘그의 몸의 성전’의 한국어 소유격 표현
    rationale: 원문의 ‘τοῦ ναοῦ τοῦ σώματος αὐτοῦ’는 문맥상 예수의 몸을 성전으로 가리킵니다. 한국어 ‘몸의 성전’은 몸에 속한 성전이라는 관계로도 읽혀 비유적 동일시가 불명확합니다.
  - severity: low
    issue: 각주의 ‘내성소·성소’ 설명
    rationale: ναός는 넓은 성전 단지(ἱερόν)와 대비되는 성소 또는 성전 건물을 가리킬 수 있으나, 여기서 반드시 내성소만을 뜻한다고 볼 수는 없습니다.
  revised_text: 그러나 그분은 자신의 몸인 성전에 관하여 말씀하고 계셨습니다[a].
  revised_footnotes:
