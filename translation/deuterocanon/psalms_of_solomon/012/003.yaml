  meaning_decisions:
  - source_phrase: ἡ παροικία αὐτοῦ, ἐμπλῆσαι οἴκους ἐν γλώσσῃ ψεύδει
    prior_rendering: His dwelling is to fill houses with a lying tongue
    new_rendering: Where he stays, he fills households with lies
    rationale: The nominal construction describes the destructive effect of his stay; a finite English clause communicates that meaning clearly. “Households” identifies the people affected, and “lies” supplies the understood content with which his tongue fills them.
  - source_phrase: ἐκκόψαι δένδρα εὐφροσύνης
    prior_rendering: to cut down trees of gladness
    new_rendering: and cuts down trees of gladness
    rationale: The infinitive becomes a coordinated finite action, while the poetic image of gladness being cut down is preserved.
  - source_phrase: φλογίζούσης παρανόμους
    prior_rendering: flaming against the lawless
    new_rendering: his tongue inflames the lawless
    rationale: The lawless are the direct object of the burning action, not merely people against whom something flames. Taking the tongue as the subject gives the most coherent contextual meaning without falsely presenting the difficult grammar as certain.
