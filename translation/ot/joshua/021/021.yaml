id: JOS.21.21
reference: Joshua 21:21
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת עִ֨יר מִקְלַ֧ט הָ/רֹצֵ֛חַ אֶת שְׁכֶ֥ם וְ/אֶת מִגְרָשֶׁ֖/הָ בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת גֶּ֖זֶר וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
translation:
  text: They gave them Shechem in the hill country of Ephraim, a city of refuge for someone who had killed another person[a], with its pasturelands, and Gezer with its pasturelands.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Refuge cities sheltered a person who had killed someone until trial and protected those found to have killed unintentionally from the victim’s avenger (Joshua 20:3–6).
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  chosen: They gave
  alternatives:
  - And they gave
  lexicon: HALOT
  rationale: Wayyiqtol of נתן, standard narrative past. English omits the conjunction for natural style while preserving the sequential sense.
- source_word: לָהֶם
  chosen: them
  lexicon: HALOT
  rationale: Indirect object referring to the Levites in context; straightforward pronominal rendering.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  chosen: the city of refuge for the manslayer
  alternatives:
  - the city of refuge for the murderer
  - a refuge city for the killer
  lexicon: HALOT
  rationale: Construct chain literally 'city of refuge of the killer/slayer.' In legal contexts רצח commonly refers to one who kills a person, especially in the asylum legislation distinguishing accidental killing from murder. 'Manslayer' best fits the technical sense without importing guilt of murder.
- source_word: שְׁכֶם
  chosen: Shechem
  lexicon: HALOT
  rationale: Standard English transliteration of the place name.
- source_word: מִגְרָשֶׁיהָ
  chosen: its pasturelands
  alternatives:
  - its surrounding pasturelands
  - its common land
  lexicon: HALOT
  rationale: Refers to the open land attached to a town for grazing/use. 'Pasturelands' is the clearest natural rendering in Joshua's town lists.
- source_word: בְּהַר אֶפְרָיִם
  chosen: in the hill country of Ephraim
  alternatives:
  - in Mount Ephraim
  lexicon: HALOT
  rationale: הַר with a tribal region commonly denotes the hill country, not a single mountain. This is standard geographic English.
- source_word: גֶּזֶר
  chosen: Gezer
  lexicon: HALOT
  rationale: Standard English transliteration of the place name.
