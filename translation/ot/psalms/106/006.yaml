id: PSA.106.6
reference: Psalms 106:6
source:
  edition: WLC
  text: חָטָ֥אנוּ עִם אֲבוֹתֵ֗י/נוּ הֶעֱוִ֥ינוּ הִרְשָֽׁעְנוּ־׃
translation:
  text: We have sinned along with our fathers; we have committed iniquity; we have acted wickedly.
  philosophy: dynamic
lexical_decisions:
- source_word: חָטָאנוּ
  chosen: we have sinned
  alternatives:
  - we sinned
  lexicon: HALOT
  rationale: Qal perfect 1cp of חטא, denoting committing sin or missing the mark morally. Present perfect English conveys a confessional summary of completed action with present relevance, fitting the penitential context.
- source_word: עִם
  chosen: along with
  alternatives:
  - with
  - together with
  lexicon: HALOT
  rationale: Conveys association in the corporate confession while avoiding an unintended implication of contemporaneous shared action.
- source_word: אֲבוֹתֵינוּ
  chosen: our fathers
  alternatives:
  - our ancestors
  lexicon: HALOT
  rationale: Hebrew literally means 'our fathers.' Per translation philosophy, gender-accurate rendering is preferred where the source uses a masculine kinship term. 'Ancestors' is possible by sense, but the literal familial term is retained.
- source_word: הֶעֱוִינוּ
  chosen: we have done wrong
  alternatives:
  - we have committed iniquity
  - we have acted perversely
  lexicon: HALOT
  rationale: Hiphil perfect 1cp of עוה conveys acting wrongly or perversely, often with the sense of incurring guilt. 'Done wrong' is readable modern English that preserves the moral force without importing overly technical diction; 'committed iniquity' is a more formal alternative.
- source_word: הִרְשָׁעְנוּ
  chosen: we have acted wickedly
  alternatives:
  - we have been wicked
  - we have done wickedly
  lexicon: HALOT
  rationale: Hiphil perfect 1cp of רשע expresses acting wickedly or being in the wrong. 'Acted wickedly' best captures verbal force and keeps the climactic intensification of the threefold confession.
