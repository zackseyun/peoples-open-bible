  source_fidelity: 현 초안은 숫양, 다른 양들(복수), 길을 잃은 양들, 죽임, 사역적 귀환, 우리로의 귀환이라는 핵심 요소를 대체로 보존합니다. 다만 ‘그 양들 위에 이르러’는 ዲበ의 대인·대상 지향을 한국어에서 부자연스럽고 오해 가능하게 옮긴 표현입니다. 또한 원문은 숫양이 양들을 ‘돌아오게’ 한 뒤 그들이 ‘우리로 돌아갔다’고 서술하는데, 초안은 후자를 다시 사역으로 번역했습니다.
  naturalness: ‘다른 양들을 데리고 와서’는 뒤따르는 접근 동작과 결합될 때 ‘와서’가 다소 중복되며, ‘양들 위에 이르러’는 현대 표준 한국어에서 자연스럽지 않습니다. ‘데리고 … 양들에게 다가가’가 자연스럽습니다. 마지막 절은 ‘그들은 자기들의 우리로 돌아갔습니다’로 독립적으로 번역하는 편이 명료합니다.
  terminology: ‘숫양’, ‘양들’, ‘우리’는 동물 환상 문맥과 원문의 상징적 구별을 적절히 보존합니다. 폭력 표현은 완화하지 않아야 합니다. 각주 a의 대안은 ‘붙잡기 시작했습니다’가 아니라 ‘죽이려고 붙잡았습니다’로 제시해야 영어 POB 감사 기록의 문자적 대안 및 원문의 목적 지향을 더 정확히 반영합니다.
