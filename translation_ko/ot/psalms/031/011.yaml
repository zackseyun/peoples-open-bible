id: PSA.31.11
reference: Psalms 31:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י כָל֪וּ בְ/יָג֡וֹן חַיַּ/י֮ וּ/שְׁנוֹתַ֪/י בַּ/אֲנָ֫חָ֥ה כָּשַׁ֣ל בַּ/עֲוֺנִ֣/י כֹחִ֑/י וַ/עֲצָמַ֥/י עָשֵֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/011.yaml
  text: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances; those who see me in public avoid me[b].
  footnotes:
  - marker: a
    text: Or 'because of my guilt'; the Hebrew word can denote iniquity, guilt, or the consequence of guilt.
    reason: lexical_alternative
  - marker: b
    text: Or 'my strength fails'; the Hebrew verb is literally 'stumbles' or 'totters,' used metaphorically here.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 모든 대적 때문에[a] 치욕거리가 되었고, 제 이웃들에게는 더욱 그러했으며, 제가 아는 사람들에게는 두려움의 대상이 되었습니다. 거리에서 저를 보는 사람들은 저를 피해 달아납니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 대적에게서 치욕거리가 되었고’; 일부는 ‘모든 대적보다 더 큰 치욕거리가 되었고’로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘밖에서’입니다. 여기서는 사람들이 공공장소에서 그를 보는 상황을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘저에게서 물러납니다’ 또는 ‘저에게서 멀리 떠납니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / כָלוּ
  english_pob_choice: For / is spent
  chosen_korean: 다했고
  alternatives_korean:
  - 끝났고
  - 소진되었고
  - 소모되었고
  lexicon: HALOT
  rationale: כִּי의 설명적 흐름은 앞선 탄식의 이유를 이어 주며, כָלוּ는 ‘다하다/소진되다’의 뜻이어서 ‘다했고’로 자연스럽게 풀었습니다.
- source_word: בְיָגוֹן / בַּאֲנָחָה
  english_pob_choice: with grief / with sighing
  chosen_korean: 슬픔으로 / 탄식으로
  alternatives_korean:
  - 근심으로 / 신음으로
  - 슬픔 가운데 / 한숨 가운데
  lexicon: HALOT
  rationale: יָגוֹן과 אֲנָחָה는 각각 슬픔과 탄식을 가리키므로, 시적 평행을 살리면서도 현대 한국어에서 무리 없는 ‘슬픔으로’와 ‘탄식으로’로 옮겼습니다.
- source_word: כָּשַׁל
  english_pob_choice: has stumbled
  chosen_korean: 주저앉았고
  alternatives_korean:
  - 비틀거렸고
  - 쓰러졌고
  - 기울었고
  lexicon: HALOT
  rationale: כָּשַׁל의 기본뜻은 ‘넘어지다/비틀거리다’이지만, 여기서는 기력이 꺾이는 비유적 사용이므로 ‘주저앉았고’가 이미지와 문맥을 함께 살립니다.
- source_word: בַּעֲוֺנִי
  english_pob_choice: because of my iniquity
  chosen_korean: 제 죄악 때문에
  alternatives_korean:
  - 제 불의 때문에
  - 제 죄책 때문에
  - 제 죄 때문에
  lexicon: HALOT
  rationale: עָוֹן은 죄악, 죄책, 그 결과까지 아우를 수 있어, 도덕적 원인성을 분명히 드러내는 ‘제 죄악 때문에’로 옮겼습니다.
- source_word: עָשֵׁשׁוּ
  english_pob_choice: waste away
  chosen_korean: 쇠해 갑니다
  alternatives_korean:
  - 시들어 갑니다
  - 마모되어 갑니다
  - 허물어집니다
  lexicon: HALOT
  rationale: עָשֵׁשׁוּ는 마르고 쇠약해지는 상태를 가리키므로, 뼈의 쇠잔함을 살리는 ‘쇠해 갑니다’로 번역했습니다.
theological_decisions:
- issue: עָוֹן의 의미 범위—죄악, 죄책, 또는 죄의 결과
  chosen_reading: 본문은 원인성을 살려 ‘제 죄악 때문에’로 두되, 죄책과 결과의 여지를 완전히 닫지는 않습니다.
  alternative_readings:
  - 제 죄책 때문에
  - 제 불의 때문에
  - 죄의 결과 때문에
  rationale: 시편의 탄식은 자기 고난의 도덕적 배경을 말하지만, 여기서 그것을 형벌론으로 좁혀 단정할 필요는 없습니다. 원문의 긴장을 유지하면서도 독자가 죄와 쇠약의 연관을 이해하도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
