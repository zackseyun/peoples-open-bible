  from: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
  to: May the stars of its twilight be dark[a]; may it wait for light, but there is none, and may it not see the eyelids of dawn.[b]
  rationale: The note on “the eyelids of dawn” must follow that image, not “none.” “But find none” makes the personified night actively find or fail to find light, whereas the Hebrew simply states the absence of the awaited light. “But there is none” is natural current English and preserves that terseness.
