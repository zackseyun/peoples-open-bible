translation:
  language: ko
  text: '1. 요셉은 그들의 생각을 알 수 있는 계획을 세웠습니다. 곧 그들 사이에 평화로운 생각이 있는지를 알기 위한 것이었습니다. 그리고 그는 자기 집을 맡은 사람에게 말했습니다. “그들의 자루들을 모두 곡식으로 채우고, 그들의 돈을 그들의 자루들 한가운데에 다시 넣으십시오. 또 내가 마시는 내 은잔을 막내의 자루에 넣으십시오.” 그리고 그들을 떠나보냈습니다.

    2. 그는 요셉이 그에게 말한 대로 하여, 그들의 모든 자루를 곡식으로 채우고 그들의 돈을 그 자루들에 넣었으며, 베냐민의 자루에 그 잔을 넣었습니다. 아침이 밝자 그들은 떠났습니다.

    3. 그들이 거기서 나가자, 요셉은 자기 집 사람에게 말했습니다. “그들을 뒤쫓아 달려가서 따라잡고 이렇게 말하십시오. ‘좋은 것을 악으로 갚았습니다. 당신들은 내 주인이 마시는 은잔을 내게서 훔쳤습니다.’” 그리고 그들의 막내 동생을 내게 데려오십시오. 내가 판결을 내리기 전에 그를 빨리 데려오십시오.

    4. 그가 그들을 뒤쫓아 가서 이 말대로 그들에게 말했습니다. 그러자 그들이 그에게 말했습니다. "당신의 종들이 이런 일을 하는 것은 있을 수 없습니다. 또한 당신의 주인의 집에서 어떤 돈이나 금도 훔칠 수 없습니다. 전에 우리가 자루에서 찾아냈던 돈은 우리 종들이 아…

    5. 가나안 사람이여. 우리가 어찌 물건을 훔치겠습니까? 보십시오, 우리와 우리의 자루를 수색하십시오. 그리고 우리 가운데 어느 한 사람의 자루에서 그 잔을 찾게 되는 사람은 죽임을 당하게 하십시오. 우리와 우리의 나귀들도 우리 주님의 종이 되겠습니다.

    6. “우리는 우리 주인의 종이 되겠습니다.” 그리고 그가 그들에게 말했습니다. “아닙니다. 내가 그것을 그에게서 찾아낸 사람—그 사람만이”

    7. “나는 그를 노예로 삼겠습니다. 너희는 평안히 너희 집으로 가십시오.” 그들이 그들의 물건을 조사할 때, 맏이부터 막내까지 차례로 조사하였는데, 그것은 베냐민의 자루에서 발견되었습니다.

    8. 그들은 그들의 옷을 찢고 나귀에 짐을 싣고 성읍으로 돌아가 집에 이르렀습니다.

    9. 그리고 그들은 요셉에게 와서 모두 얼굴을 땅에 대고 그 앞에 절했습니다. 요셉이 그들에게 말했습니다. “너희가 악을 행했습니다.” 그들이 대답했습니다. “우리가 무엇을 말하겠습니까? 또 어떻게 우리가 무죄하다고 밝히겠습니까? 우리 주님께서 당신의 종들의 죄를 찾아내셨습니다.”

    10. “그의 노예들입니다. 보십시오, 우리는 우리 주인의 노예들이며, 우리 나귀들도 그렇습니다.” 요셉이 그들에게 말했습니다. “하나님께서 내가 이런 일을 하는 것을 금하십니다. 여러분은 각자의 집으로 가십시오. 그러나 여러분의 막내 동생은 내 노예가 될 것입니다. 여러분이 악을 행했기 때문입니다. 내가 하듯이 사람이 자기 잔으로 반드시 점을 친다는 것을 여러분은 알지 못했습니까?”

    11. 유다가 말했습니다. 「내 주여, 청하오니 이 종이 내 주의 귀에 한 말씀을 아뢰게 해 주십시오. 그의 어머니가 당신의 종인 우리 아버지에게 두 형제를 낳았습니다. 그 하나는 나갔다가 행방을 잃었고, 아무도 그를 찾지 못했습니다. 그만이 그의 어머니에게서 남아 있으며, 이 종은…」

    12. 우리 아버지는 그 아이를 사랑하시며, 아버지의 생명은 그 아이의 생명에 매여 있습니다. 우리가 당신의 종인 우리 아버지께 갔을 때 그 아이가 우리와 함께 있지 않으면, 아버지는 죽으실 것이며, 우리는 슬픔으로 우리 아버지를 괴롭게 하여 죽음에 이르게 할 것입니다.

    13. 그러므로 이제 당신의 종인 제가 그 소년을 대신하여 홀로 내 주님의 종으로 남게 해 주십시오. 그 젊은이는 자기 형제들과 함께 가게 해 주십시오. 제가 당신의 종인 우리 아버지에게 그를 위하여 보증을 섰기 때문입니다. 그리고 제가 그를 데려오지 못하면, 당신의 종은 우리 아버지 앞에서 평생 그 책임을 지겠습니다.’

    14. 그리고 요셉은 그들 모두가 서로 선한 뜻으로 마음을 하나로 모으고 있는 것을 보고, 울었습니다.

    15. 그러자 그는 더는 자신을 억제할 수 없어, 자신이 요셉이라고 그들에게 말했습니다. 그리고 그들과 히브리어로 말했습니다.

    16. 그는 그들의 목을 끌어안고 울었습니다. 그러나 그들은 그를 알아보지 못했고, 그들도 울었습니다. 그리고 그는 그들에게 말했습니다.

    17. 나 때문에 울지 마십시오. 서둘러 내 아버지를 내게로 데려오십시오. 여러분은 내 입이 말하고 있는 것을 봅니다. 내 동생 베냐민도 자기 눈으로 그것을 봅니다. 보십시오, 기근의 둘째 해입니다.

    18. 그리고 아직도 다섯 해가 남아 있으며, 그동안 쟁기질도 없고 나무의 열매도 없고 수확도 없을 것입니다.

    19. 서두르십시오. 당신들과 당신들의 가족은 내려가십시오. 그러면 기근으로 멸망하지 않고, 당신들의 소유 때문에 근심하지 않게 될 것입니다. 하나님께서 그들이 살도록, 당신들보다 앞서 저를 생존을 위하여 보내셨습니다.

    20. 많은 백성. 내 아버지에게 내가 아직 살아 있다고 알리십시오. 보십시오, 여러분도 하나님께서 나를 바로의 아버지로, 또 바로의 집의 통치자로 삼으셨음을 보시지 않습니까?

    21. 또한 이집트 온 땅을 다스리고 있습니다. 내 아버지께 나의 모든 영예와 내게 주어진 모든 것을 알려 주십시오."

    22. 그리고 바로의 명령에 따라 그들에게 수레와 여행길에 쓸 양식을 주었습니다.

    23. 그는 그들 모두에게 갈아입을 옷과 은을 주었습니다. 또 그들의 아버지에게도 옷과 은을 보냈습니다.

    24. 그리고 곡식 실은 나귀 열 필이었습니다. 그는 그들을 떠나보냈습니다. 그들은 올라가서 아버지에게 요셉이 살아 있으며, 그가 세상의 모든 민족에게 곡식을 나누어 주고 다스리고 있다고 말했습니다.

    25. 온 이집트 땅에 걸쳐 있었습니다. 그들의 아버지는 마음이 멍해져서 그들을 믿지 않았습니다. 그러나 요셉이 보낸 수레들을 보고 나서 그의 영에 생명이 되살아났고, 그는 말했습니다. “요셉이 살아 있기만 하다면, 그것으로 저는 족합니다. 내가 죽기 전에 내려가 그를 보겠습니다.”'
