  source_fidelity: 현 초안은 시편 89:47의 히브리어 본문이 아니라 앞 절(89:46)의 내용(‘언제까지입니까, 야훼여?’)을 번역하고 있습니다. 89:47은 화자 자신의 짧은 삶을 기억해 달라는 간구와, 모든 인간이 헛됨을 위해 창조되었는지를 묻는 수사 의문입니다.
  naturalness: 제안문은 현대 표준 한국어 합쇼체의 기도·탄식 문맥에 자연스럽습니다. ‘기억해 주십시오’는 하나님을 향한 직접 간구를 공손하게 표현하며, ‘어찌하여’는 두 번째 절의 수사적 질문을 분명히 드러냅니다.
  terminology: חָלֶד는 ‘삶의 기간/수명’으로 ‘제 삶이 얼마나 짧은지’로 옮겼습니다. שָׁוְא는 ‘헛됨, 허무’의 뜻으로 본문의 목적·결과 관련 뉘앙스를 과도하게 해석하지 않고 ‘헛되이’로 번역했습니다. כָל־בְּנֵי אָדָם은 포괄적 인간 지칭으로 본문에서는 ‘모든 사람’으로 자연스럽게 옮기고, 직역 표현은 각주에 밝혔습니다.
