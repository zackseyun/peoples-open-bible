  meaning: Invoking the authority of the Lord Jesus Christ, Paul commands the congregation to keep away from fellow believers whose irresponsible conduct violates the apostolic teaching they received.
  meaning_decisions:
  - source_phrase: ἀδελφοί ... παντὸς ἀδελφοῦ
    prior_rendering: brothers ... every brother
    new_rendering: brothers and sisters ... every brother or sister
    rationale: The command addresses the congregation and concerns fellow members of that family; the wording makes that scope explicit while retaining the familial language.
  - source_phrase: ἀτάκτως περιπατοῦντος
    prior_rendering: who is walking disorderly
    new_rendering: who lives irresponsibly
    rationale: The expression describes a way of life, not physical walking or merely disruptive behavior; in this paragraph it concerns undisciplined refusal to work and its consequences.
  - source_phrase: καὶ μὴ κατὰ τὴν παράδοσιν
    prior_rendering: and not according to the tradition
    new_rendering: and does not follow the teaching
    rationale: The tradition here is instruction transmitted by Paul and his companions, not an unspecified custom; an explicit verb makes the violation clear in English.
