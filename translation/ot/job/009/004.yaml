id: JOB.9.4
reference: Job 9:4
source:
  edition: WLC
  text: חֲכַ֣ם לֵ֭בָב וְ/אַמִּ֣יץ כֹּ֑חַ מִֽי הִקְשָׁ֥ה אֵ֝לָ֗י/ו וַ/יִּשְׁלָֽם־׃
translation:
  text: He is wise in heart and mighty in strength; who has stubbornly defied him[a] and come through unharmed?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “hardened himself against him.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵבָב
  chosen: wise in heart
  alternatives:
  - wise of heart
  - wise in mind
  lexicon: HALOT
  rationale: The Hebrew pairs an adjective with 'heart' as the seat of intellect and will. 'Wise in heart' preserves the Hebrew imagery better than flattening to merely 'wise' or 'wise in mind.'
- source_word: וְאַמִּיץ כֹּחַ
  chosen: and mighty in strength
  alternatives:
  - and strong in power
  - and mighty in power
  lexicon: HALOT
  rationale: אַמִּיץ conveys strength/might; כֹּחַ is strength/power. 'Mighty in strength' is slightly taut but reflects the emphatic Hebrew collocation and suits poetic style.
- source_word: מִי
  chosen: who
  alternatives:
  - who is it that
  lexicon: HALOT
  rationale: Introduces a rhetorical question. Simple 'who' is natural and sufficiently formal.
- source_word: הִקְשָׁה
  chosen: has hardened himself
  alternatives:
  - has been stubborn
  - has made himself hard
  - has resisted stubbornly
  lexicon: HALOT
  rationale: From קשׁה in the Hiphil, here with אֵלָיו, the sense is to make oneself hard or stubborn against someone. 'Has hardened himself' preserves the reflexive force and the moral obstinacy implied.
- source_word: אֵלָיו
  chosen: against him
  alternatives:
  - to him
  lexicon: HALOT
  rationale: With הקשה in this idiom, the preposition marks hostile opposition rather than simple direction. 'Against him' best captures the sense in English.
- source_word: וַיִּשְׁלָם
  chosen: and come through unharmed
  alternatives:
  - and prospered
  - and remained unharmed
  - and had peace
  lexicon: HALOT
  rationale: The verb's wholeness/safety sense fits the rhetorical question about resisting God and emerging intact.
