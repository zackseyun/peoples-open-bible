id: PSA.148.14
reference: Psalms 148:14
source:
  edition: WLC
  text: וַ/יָּ֤רֶם קֶ֨רֶן לְ/עַמּ֡/וֹ תְּהִלָּ֤ה לְֽ/כָל חֲסִידָ֗י/ו לִ/בְנֵ֣י יִ֭שְׂרָאֵל עַֽם קְרֹב֗/וֹ הַֽלְלוּ יָֽהּ׀־־־׃
translation:
  text: He has raised up a horn of strength[a] for his people, bringing honor to all his faithful ones[b], to the children of Israel, the people near to him. Praise Yah!
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “a horn”; an animal's raised horn is an image of strength and honor.
    reason: lexical_alternative
  - marker: b
    text: Or “giving all his faithful ones reason to praise.” The Hebrew says “praise for all his faithful ones.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּרֶם
  chosen: he has raised up
  alternatives:
  - he raised
  - he exalts
  lexicon: HALOT
  rationale: From רום, 'to raise/exalt.' In Psalmic praise, the wayyiqtol can function as a perfective describing what God has done, so 'has raised up' fits the celebratory summary sense better than a simple past while preserving the verbal image.
- source_word: קֶרֶן
  chosen: horn
  alternatives:
  - strength
  - might
  lexicon: HALOT
  rationale: Literally 'horn,' a common Hebrew metaphor for strength, dignity, or exalted power. The metaphor is transparent enough in English and should be preserved rather than flattened to an interpretation.
- source_word: לְעַמּוֹ
  chosen: for his people
  alternatives:
  - for his nation
  - for his own people
  lexicon: HALOT
  rationale: עַם commonly means 'people' in covenantal/national sense. 'For his people' is natural and preserves the relational force of the suffix.
- source_word: תְּהִלָּה
  chosen: praise
  alternatives:
  - a praise
  - glory
  lexicon: HALOT
  rationale: 'The noun likely stands in apposition/result relation to the previous clause: the raising of the horn becomes ''praise'' for God''s faithful people. ''Praise'' is the most direct rendering; ''glory'' is possible but less lexically exact.'
- source_word: לְכָל חֲסִידָיו
  chosen: for all his faithful ones
  alternatives:
  - for all his saints
  - for all his godly ones
  lexicon: HALOT
  rationale: חסידים are those characterized by covenant loyalty/devotion. 'Faithful ones' communicates this in readable modern English without importing later ecclesiastical overtones that 'saints' may carry.
- source_word: לִבְנֵי יִשְׂרָאֵל
  chosen: for the children of Israel
  alternatives:
  - for the children of Israel
  - for the people of Israel
  lexicon: HALOT
  rationale: In this conventional corporate designation, “children of Israel” is natural English while retaining the Hebrew familial expression; the literal lexical form is supplied in a note.
- source_word: עַם קְרֹבוֹ
  chosen: the people near to him
  alternatives:
  - a people near him
  - his near people
  lexicon: HALOT
  rationale: קָרוֹב with suffix denotes nearness to God, likely covenantal and worshipful proximity. 'The people near to him' is idiomatic and preserves the relational image without overinterpreting it as 'chosen' or 'beloved.'
- source_word: הַלְלוּ יָהּ
  chosen: Praise Yah!
  alternatives:
  - Hallelujah!
  - Praise the LORD!
  lexicon: HALOT
  rationale: The Hebrew imperative plus divine short form is best represented transparently. 'Praise Yah!' preserves the form and meaning better than the untranslated liturgical borrowing 'Hallelujah,' and avoids replacing יָהּ with 'the LORD' where the text uses the shorter divine name.
