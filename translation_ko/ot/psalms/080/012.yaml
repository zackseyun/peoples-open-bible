base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/012.yaml
  text: Why have you broken down its walls[b], so that all who pass by the way pluck its fruit[a]?
  footnotes:
  - marker: a
    text: Or “strip it” or “pick at it”; the Hebrew verb suggests plucking from the vine rather than total destruction in this clause.
    reason: lexical_alternative
  - marker: b
    text: Or “its fences” or “its hedge wall”; the Hebrew refers to the protective enclosure around a vineyard.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 그 울타리들을 허무셔서, 길을 지나는 모든 이가 그 열매를 따 가게 하셨습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘울타리들’은 포도원을 둘러싸 보호하는 담, 울타리 또는 산울타리를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 포도나무나 포도원에서 무엇을 따거나 뜯어 가는 뜻입니다. 본문은 문맥에 따라 ‘그 열매’를 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁלַּח
  english_pob_choice: it sent out
  chosen_korean: 뻗게 하였고
  alternatives_korean:
  - 내보냈고
  - 펴게 하였고
  lexicon: HALOT
  rationale: 포도나무가 가지와 새순을 바깥으로 확장하는 동작을 한국어로 자연스럽게 살리기 위해, 단순한 방향 이동보다 ‘뻗다’ 계열을 택했습니다.
- source_word: קְצִירֶהָ
  english_pob_choice: its branches
  chosen_korean: 그 가지들
  alternatives_korean:
  - 그 큰가지들
  - 그 넝쿨들
  lexicon: HALOT
  rationale: 이 단어는 이 시적 비유에서 일반적인 ‘가지’보다 더 넓은 확장성을 가리킬 수 있지만, 현대 한국어에서는 문맥상 ‘가지들’이 가장 분명하고 과도하게 해석을 덧붙이지 않습니다.
- source_word: נָהָר
  english_pob_choice: the River
  chosen_korean: 강
  alternatives_korean:
  - 그 강
  - 유브라테스 강
  lexicon: HALOT
  rationale: 히브리어 정관사 없는 나하르는 문맥상 유브라테스를 가리킬 수 있으나, 본문은 지명 설명을 직접 요구하지 않으므로 본문에는 자연스러운 ‘강’을 두고, 해석상의 뉘앙스는 주석에서 처리하는 편이 적절합니다.
theological_decisions:
- issue: 시편의 포도나무 비유가 이스라엘의 확장/경계를 암시하는지
  chosen_reading: 본문의 직접적 이미지는 포도나무의 확장된 번성을 말하며, 역사·지리적 암시는 본문 밖에서 보완합니다.
  alternative_readings:
  - 이스라엘의 이상적 영토 경계(바다에서 강까지)를 직접 가리킨다
  - 단순한 농경 이미지에 머문다
  rationale: 히브리어 시어 자체는 식물 이미지가 우선이므로, 본문 번역에서는 비유를 과잉 해석하지 않고 이미지의 힘을 보존하되, 지리적 함의는 필요한 경우 주석에서 다루는 것이 균형적입니다.
  doctrine_reference: 시편 80편의 포도나무 이미지와 언약 백성의 번성에 대한 시적 표현
