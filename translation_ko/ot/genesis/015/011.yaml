translation:
  language: ko
  text: 맹금들이[a] 그 사체들 위로 내려왔고, 아브람은 그것들을 쫓아냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수형이며, ‘맹금 한 마리’로도 옮길 수 있습니다. 그러나 여기서는 사체들을 노리는 새들을 집합적으로 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַיִט
  english_pob_choice: the birds of prey
  chosen_korean: 독수리들
  alternatives_korean:
  - 맹금들
  - 사나운 새들
  - 독수리(집합적)
  lexicon: עַיִט
  rationale: 문맥상 사체를 노리는 맹금류를 가리키며, 한국어에서는 자연스럽고 생동감 있게 복수형 ‘독수리들’로 옮기되 집합적 의미를 유지했습니다.
- source_word: הַפְּגָרִים
  english_pob_choice: the carcasses
  chosen_korean: 그 사체들
  alternatives_korean:
  - 그 시체들
  - 그 죽은 짐승들
  - 사체들
  lexicon: פֶּגֶר
  rationale: 히브리어 פֶּגֶר는 죽은 몸, 사체를 뜻하므로 더 완곡한 ‘시체들’보다 직접적인 ‘사체들’이 적절합니다.
- source_word: וַיַּשֵּׁב אֹתָם אַבְרָם
  english_pob_choice: Abram drove them away
  chosen_korean: 아브람이 그것들을 쫓아냈습니다
  alternatives_korean:
  - 아브람이 그것들을 몰아냈습니다
  - 아브람이 그것들을 쫓아버렸습니다
  lexicon: וַיַּשֵּׁב
  rationale: 동사는 ‘되돌려 보내다/멀어지게 하다’의 뉘앙스를 지니지만, 여기서는 새들을 물리쳐 사체에서 떼어 놓는 장면이므로 ‘쫓아냈습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 새의 수와 집합적 이해
  chosen_reading: 복수 주어 ‘독수리들’로 자연스럽게 읽었습니다.
  alternative_readings:
  - 단수 집합적 ‘독수리’
  - ‘맹금들’로 더 포괄적으로 옮김
  rationale: 히브리어 명사는 형태상 단수처럼 보일 수 있으나, 영어 POB 주석도 집합적 의미를 지지하므로 한국어 본문에서는 복수로 처리해 장면의 생동감을 살렸습니다.
  doctrine_reference: 본문 서술의 자연스러운 의미 재현
