theological_decisions:
- issue: Rendering of the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Sense of לְאֹרֶךְ יָמִים
  chosen_reading: for length of days
  alternative_readings:
  - forever
  rationale: The phrase is idiomatic for enduring duration, but the Hebrew wording is preserved in the main text rather than resolving it fully into the interpretive gloss 'forever.' The alternative is preserved in a footnote to maintain transparency.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3, #5'
