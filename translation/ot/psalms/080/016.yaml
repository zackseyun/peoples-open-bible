  text: שְׂרֻפָ֣ה בָ/אֵ֣שׁ כְּסוּחָ֑ה מִ/גַּעֲרַ֖ת פָּנֶ֣י/ךָ יֹאבֵֽדוּ׃
translation:
  text: It is burned with fire and cut down; at your angry rebuke[a] they perish[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “at the rebuke of your face,” an image of God's angry presence.
    reason: lexical_alternative
  - marker: b
    text: Or, “may they perish,” understood as a plea against the vine's destroyers.
    reason: alternative_reading
