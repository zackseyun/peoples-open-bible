source:
  edition: Funk 1901 (normalized OCR)
  text: Μετανοήσατε, οἶκος Ἰσραήλ, ἀπὸ τῆς ἀνομίας ὑμῶν· εἶπον τοῖς υἱοῖς τοῦ λαοῦ μου· Ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ καὶ ἐὰν ὦσιν πυρρότεραι κόκκου καὶ μελανώτεραι σάκκου, καὶ ἐπιστραφῆτε πρὸς με ἐξ ὅλης τῆς καρδίας καὶ εἴπητε· Πάτερ, ἐπακούσομαι ὑμῶν ὡς λαοῦ ἁγίου.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/008/003.yaml
  text: “Repent, O house of Israel, of your lawlessness. I said to the sons of my people, ‘If your sins should be from the earth to heaven, and if they are redder than scarlet and blacker than sackcloth, and you turn to me with your whole heart and say, “Father,” I will listen to you as to a holy people.’”
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T11:33:41Z'
    unchanged: false
    changes_summary: Restored the explicit past verb 'I said' instead of 'Say' for lexical accuracy, adjusted 'Even if' to 'If' to reflect the conditional structure more directly, and simplified 'should reach from the earth to heaven' to 'should be from the earth to heaven' to stay closer to the Greek without added interpretation.
translation:
  language: en
  text: “People of Israel, reorient[a] away from your lawlessness. I said to the children of my people, ‘If your sins extend from earth to heaven, if they are redder than scarlet and blacker than the coarse cloth worn in mourning, and if you turn to me with all your heart and say, “Father,” I will listen to you as I would to a holy people.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: O house of Israel ... the sons of my people
  simplified_phrase: People of Israel ... the children of my people
  preserved_meaning: God addresses Israel as a whole and then speaks to the members of his people.
  reasoning_layer_used: POB translation and immediate context
  rationale: Common community and family terms replace unfamiliar or needlessly gender-specific expressions.
- pob_phrase: If your sins should be from the earth to heaven ... with your whole heart
  simplified_phrase: If your sins extend from earth to heaven ... with all your heart
  preserved_meaning: The vast spatial image and the call for complete inward commitment remain intact.
  reasoning_layer_used: POB translation and source imagery
  rationale: Natural English idioms clarify both expressions without weakening their force.
- pob_phrase: blacker than sackcloth
  simplified_phrase: blacker than the coarse cloth worn in mourning
  preserved_meaning: The sins are compared to the dark appearance of traditional mourning cloth.
  reasoning_layer_used: POB translation, immediate contrast, and grounding review
  rationale: The cultural object is explained so modern readers can understand the color comparison.
interpretive_expansions:
- pob_phrase: sackcloth
  rendering: the coarse cloth worn in mourning
  claim: The comparison refers to cloth associated with mourning, making its cultural function explicit.
  evidence:
  - The immediate phrase contrasts intense scarlet with intense black.
  - The grounding review identifies sackcloth here as a dark mourning fabric.
  confidence: high
translation_notes:
  risk_flags:
  - risk: “Extend” expresses the static earth-to-heaven image as a spatial action.
    mitigation: Both endpoints and the conditional form are preserved without saying the sins reach heaven.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
