    prior_rendering: by the valley of my mountains ... the valley of the mountains
    new_rendering: through the valley between my mountains ... the valley between the mountains
    rationale: The valley is the one formed when the Mount of Olives splits into two halves (verse 4), so it runs between the mountains; 'my' is kept because Yahweh speaks of his own mountains.
