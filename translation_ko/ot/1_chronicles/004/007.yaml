  to: 또 헬라의 아들들은 세렛과 이스할과 에드난입니다.[a]
  rationale: 원문의 족보 공식과 접속 관계는 유지하면서, 고유명사를 원어 및 한국어 성서 음역 관례에 맞게 ‘세렛’, ‘에드난’으로 바로잡았습니다. 나열 접속사는 현대 격식체 한국어에 맞게 조정했으며, 족보 용어의 의미 범위를 설명하는 각주는 그대로 유지했습니다.
