id: PSA.17.11
reference: Psalms 17:11
source:
  edition: WLC
  text: אַ֭שֻּׁרֵי/נוּ עַתָּ֣ה סבבו/ני עֵינֵי/הֶ֥ם יָ֝שִׁ֗יתוּ לִ/נְט֥וֹת בָּ/אָֽרֶץ׃
translation:
  text: At every step they now surround me[a]; their eyes are fixed on bringing me to the ground.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “our steps—now they surround me”; the Hebrew shifts from “our” to “me.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשֻּׁרֵינוּ
  chosen: our steps
  alternatives:
  - our tracks
  - our footsteps
  lexicon: HALOT
  rationale: The noun from אשר in this form refers to steps/footsteps or tracks. 'Our steps' is natural English and fits the image of enemies hemming in the psalmist's movement. It avoids the less idiomatic 'our goings.'
- source_word: עַתָּה
  chosen: Now
  alternatives:
  - at this time
  lexicon: HALOT
  rationale: Temporal adverb marking the present crisis. 'Now' is concise and idiomatic.
- source_word: סבבוני
  chosen: they surround me
  alternatives:
  - encircled
  - surrounded me/us
  - have surrounded
  lexicon: HALOT
  rationale: The consonantal form has a first-person singular suffix, 'they surround me.' The preceding 'our steps' is represented idiomatically as the setting 'at every step.'
- source_word: עיניהם
  chosen: their eyes
  lexicon: HALOT
  rationale: The concrete image of hostile eyes is retained.
  alternatives: []
- source_word: ישיתו
  chosen: they fix
  alternatives:
  - they fix
  - they place
  - they set
  lexicon: HALOT
  rationale: With 'eyes,' the verb naturally means to set or fix one's gaze.
- source_word: לנטות
  chosen: to bring me down
  alternatives:
  - to bring down
  - to incline
  - to overthrow
  - to cast us down
  lexicon: HALOT
  rationale: In this hostile context the infinitive describes bending or bringing the speaker down toward the ground.
- source_word: בארץ
  chosen: to the ground
  alternatives:
  - to the earth
  - in the land
  lexicon: HALOT
  rationale: Here אֶרֶץ is best taken concretely as ground/earth rather than 'land.' 'To the ground' matches the physical image of being brought low.
