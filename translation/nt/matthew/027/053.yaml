  from: And after coming out of the tombs after his resurrection
  to: And coming out of the tombs after his resurrection
  rationale: The current rendering's double 'after' ('after coming out... after his resurrection') is redundant and creates an awkward English construction. The temporal sequence is already clearly provided by 'after his resurrection,' which modifies the action of the participle. Translating the aorist participle ἐξελθόντες simply as 'coming out' creates a more natural English clause ('And coming out of the tombs after his resurrection, they entered...') that preserves the subordinate relationship without sacrificing readability.
