  yaml_path: translation/ot/psalms/034/015.yaml
  text: The eyes of Yahweh are toward the righteous, and his ears toward their cry for help.[a]
  footnotes:
  - marker: a
    text: Or “their plea for help.” The Hebrew term refers to a cry arising from distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 눈은 의인들을 향해 있고, 그의 귀는 그들의 부르짖음을 향해 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 도움을 구하는 외침’. 히브리어는 곤경 가운데 올리는 부르짖음이나 호소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּר מֵרָע
  english_pob_choice: Turn away from evil
  chosen_korean: 악에서 돌아서고
  alternatives_korean:
  - 악을 떠나
  - 악에서 떠나
  lexicon: HALOT
  rationale: סוּר는 단순 이동보다 방향 전환의 뉘앙스가 있어, 도덕적 방향을 바꾸는 명령으로서 '돌아서다'가 자연스럽고도 원문에 가깝습니다.
- source_word: וַעֲשֵׂה טוֹב
  english_pob_choice: and do good
  chosen_korean: 선을 행하십시오
  alternatives_korean:
  - 좋은 일을 하십시오
  - 좋은 것을 행하십시오
  lexicon: HALOT
  rationale: '''טוֹב''는 여기서 일반적인 선/선한 행위를 가리키므로, 성경적 윤리 명령으로 간결하게 ''선을 행하다''로 옮겼습니다.'
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평화
  alternatives_korean:
  - 평강
  - 온전함
  - 복됨
  lexicon: HALOT
  rationale: POB의 핵심 의미인 peace를 한국어에서 가장 직접적으로 드러내는 말은 '평화'입니다. 본문의 넓은 의미는 오해를 막기 위해 별도 주석으로 처리합니다.
- source_word: וְרָדְפֵהוּ
  english_pob_choice: and pursue it
  chosen_korean: 그것을 추구하십시오
  alternatives_korean:
  - 그것을 좇으십시오
  - 그것을 따라가십시오
  lexicon: HALOT
  rationale: רָדַף의 적극적·지속적 뉘앙스를 살리면서 현대 한국어에서 자연스럽게 읽히도록 '추구하다'로 옮겼습니다.
theological_decisions:
- issue: שָׁלוֹם의 의미 범위
  chosen_reading: 본문의 '평화'는 단지 분쟁의 부재가 아니라 관계의 온전함과 복리를 포함하는 것으로 읽었습니다.
  alternative_readings:
  - 오직 분쟁이 없는 상태로만 이해
  - '''평강''으로 교회적 어휘를 우선 적용'
  rationale: 영어 POB의 주석이 지적하듯 שָׁלוֹם은 폭넓은 의미를 지니므로, 본문은 기본어휘로 '평화'를 유지하되 의미의 넓이는 주석으로 보완하는 것이 가장 투명합니다.
  doctrine_reference: 시편 34:15의 지혜문학적 권면과 שָׁלוֹם의 어휘 범위
