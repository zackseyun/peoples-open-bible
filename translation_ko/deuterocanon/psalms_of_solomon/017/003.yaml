  naturalness: ‘우리 구원자이신 하나님께 소망을 둘 것입니다’는 동격 관계와 소망의 대상을 자연스럽게 표현합니다. ‘민족들을 영원히 다스리다’는 한국어에서 ‘나라/왕국이 … 위에 있다’보다 자연스럽습니다.
  terminology: σωτήρ는 비교파적으로 ‘구원자’로 유지했습니다. κράτος는 ‘권세’, ἔλεος는 ‘자비’, βασιλεία는 ‘나라’로 유지하여 원문의 병렬을 살렸습니다.
  issues:
