  from: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
  to: Both riches and honor come from you, and you rule over all. In your hand are power and might, and it is in your hand to make all great and strong.
  rationale: The earlier rationale favored “from before you” for source transparency, but its stated meaning is divine provision, which “from you” communicates better. The repeated hand image is retained because it remains intelligible and connects this verse with the prayer’s later acknowledgment of God’s gifts.
