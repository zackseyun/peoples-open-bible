  category: meaning_retranslation
  from: And in answer he reported to them the words of Holofernes’ council[a], and all the words that he had spoken in the midst of the rulers of the sons of Asshur[b], and whatever boastful things Holofernes had spoken against the house of Israel.
  to: In reply, Achior told them what had been said at Holofernes’ council, everything he himself had said before the Assyrian leaders, and all the boasts Holofernes had made against the house of Israel.
  rationale: The lexical notes rightly emphasize the spoken contents of the council and the hostility of Holofernes’ boasts. Their preference for “sons of Asshur” rests on source texture rather than a distinct ethnic meaning, so I use the documented alternative “Assyrian” while retaining “the house of Israel.”
