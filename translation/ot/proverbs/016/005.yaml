  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: idiom
  tier: 1
  from: Everyone who is proud in heart is an abomination to Yahweh; hand to hand[a], he will certainly not go unpunished.
  to: Everyone who is proud in heart is an abomination to Yahweh; be assured[a], he will not go unpunished.
  rationale: In this formula, יָד לְיָד is most plausibly asseverative. “Hand to hand” is opaque and unnatural in English, whereas “be assured” gives its pragmatic force. Removing “certainly” avoids duplicating that force; the literal wording and viable joined-hands alternative are honestly retained in the note.
