  source_fidelity: 첫 절반의 두려움(וַיָּגָר)과 인구가 많았다는 이유는 대체로 반영되어 있습니다. 그러나 두 번째 동사 וַיָּקָץ는 첫 동사와 같은 단순한 ‘두려워하다’로 반복하기보다, 이 문맥에서의 질색함·괴로움·혐오 섞인 공포를 구별하여 옮겨야 합니다.
  naturalness: 초안의 ‘하였으니 … 때문이요, … 하였더라’는 현대 표준어 합쇼체보다 문어적 성경체에 가깝고 문장 연결도 다소 무겁습니다. 문장을 분리하고 ‘하였습니다’ 체로 통일하면 자연스럽고 명료합니다.
  terminology: ‘모압’, ‘이스라엘 자손’은 적절합니다. הָעָם은 ‘그 백성’으로, 집합명사의 단수와 뒤의 ‘많음’을 한국어에서 자연스럽게 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: וַיָּקָץ를 다시 ‘두려워하였더라’로 번역함
    rationale: וַיָּקָץ는 וַיָּגָר의 단순 반복이 아니라 질색함, 혐오, 심한 괴로움 또는 공포에 찬 반감을 나타낼 수 있습니다. 문맥상 공포와 연결되지만, 두 동사의 어휘적 차이는 드러내는 편이 충실합니다.
  - severity: low
    issue: 현대 합쇼체 register 불일치
    rationale: ‘하였으니’, ‘때문이요’, ‘하였더라’는 요청된 현대 formal-polite 합쇼체와 일관되지 않습니다.
  revised_text: 모압은 그 백성 때문에 매우 두려워하였습니다. 그 백성이 많았기 때문입니다. 모압은 이스라엘 자손 때문에 몹시 괴로워하였습니다.
