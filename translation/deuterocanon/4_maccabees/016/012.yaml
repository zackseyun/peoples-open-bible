  category: meaning_retranslation
  from: Nor did she try to turn any of them away so that they might not die, nor did she grieve as they were dying.
  to: Nor did she try to turn any of them back to save their lives, nor did she grieve for them as though they were dying[a].
  rationale: The lexical record rightly understood her refusal to dissuade the sons, but its temporal reading of the final clause is not the only serious possibility. The chapter's immortality language favors 'as though,' while the established temporal reading is preserved as an alternative.
