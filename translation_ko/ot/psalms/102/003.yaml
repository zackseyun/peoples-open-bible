revisions:
- from: 당신의 얼굴을 내게서 숨기지 마십시오. 내 고난의 날에 당신의 귀를 내게 기울여 주십시오. 내가 부를 때, 속히 내게 응답해 주십시오.[a][b][c]
  to: 이는 내 날들이 연기처럼 사라지고, 내 뼈들이 화덕처럼 타 버렸기 때문입니다.[a]
