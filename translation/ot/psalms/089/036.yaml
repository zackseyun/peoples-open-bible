  from: and his throne like the sun before me
  to: and his throne will endure like the sun before me
  rationale: The current rendering faithfully mirrors the Hebrew's verbless second clause, relying on poetic ellipsis. While this is effective and has a long history in English translations (cf. KJV), some modern readers might find the construction slightly clipped. Explicitly supplying the verb from the first clause (e.g., 'will endure' or 'will be') could enhance immediate clarity, though at the cost of conciseness. The current draft is defensible as a more formal, poetic choice, but the alternative is worth considering for readability.
