  text: מָלַ֣ךְ אֱ֭לֹהִים עַל גּוֹיִ֑ם אֱ֝לֹהִ֗ים יָשַׁ֤ב עַל כִּסֵּ֬א קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/009.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[b], for the shields of the earth belong to God[a]; he is greatly exalted.
  footnotes:
  - marker: a
    text: Or, 'God has become king over the nations; God has taken his seat on his holy throne.' The Hebrew perfect verbs can be understood as emphasizing the establishment of his reign.
    reason: alternative_reading
translation:
  language: ko
  text: 민족들의 고관들이 아브라함의 하나님의 백성으로 함께 모였습니다[a]. 땅의 방패들은 하나님께 속하였으니[b], 그분은 크게 높임을 받으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브라함의 하나님의 백성과 함께.’ 히브리어의 압축된 표현은 고관들이 그 백성에 속하여 모였다는 뜻이나 그 백성과 함께 모였다는 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘땅의 통치자들.’ 직역하면 ‘땅의 방패들’입니다.
    reason: lexical_alternative
