  yaml_path: translation/ot/1_chronicles/024/026.yaml
  text: 'The sons of Merari: Mahli and Mushi. The sons of Jaaziah: his son.'
translation:
  language: hi
  text: 'मरारी के पुत्र: महली और मूशी। याजिय्याह के पुत्र: उसका पुत्र।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: पुत्र
  rationale: वंशावली के प्रसंग में सामान्य और औपचारिक समतुल्य; दोनों बार मूल की रचना को बनाए रखता है।
- source_word: בְנוֹ
  choice: उसका पुत्र
  rationale: मसोरेटिक पाठ में यह सामान्य संज्ञा בֵּן पर तृतीय पुरुष एकवचन संबंधवाचक प्रत्यय है, इसलिए इसे व्यक्तिनाम ‘बनो’ न मानकर ‘उसका पुत्र’ अनूदित किया गया है।
theological_decisions:
- issue: खंडित वंशावली-वाक्य की अस्पष्टता
  choice: '‘याजिय्याह के पुत्र: उसका पुत्र’ के रूप में मूल की कठिन और अपूर्ण-सी संरचना सुरक्षित रखी गई।'
  alternative: ‘याजिय्याह का पुत्र बनो’ अथवा अगले पद से नाम जोड़कर वाक्य पूरा करना
  rationale: WLC में בְנוֹ स्पष्टतः ‘उसका पुत्र’ पढ़ा जाता है; पाठ की असहजता को अनुमान से दूर करना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली। मूल पाठ की पुनरुक्ति और असहजता को सहज बनाने के लिए अतिरिक्त नाम या व्याख्या नहीं जोड़ी गई।
