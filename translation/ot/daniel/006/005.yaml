id: DAN.6.5
reference: Daniel 6:5
source:
  edition: WLC
  text: אֱדַ֨יִן סָֽרְכַיָּ֜/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֗/א הֲו֨וֹ בָעַ֧יִן עִלָּ֛ה לְ/הַשְׁכָּחָ֥ה לְ/דָנִיֵּ֖אל מִ/צַּ֣ד מַלְכוּתָ֑/א וְ/כָל עִלָּ֨ה וּ/שְׁחִיתָ֜ה לָא יָכְלִ֣ין לְ/הַשְׁכָּחָ֗ה כָּ/ל קֳבֵל֙ דִּֽי מְהֵימַ֣ן ה֔וּא וְ/כָל שָׁלוּ֙ וּ/שְׁחִיתָ֔ה לָ֥א הִשְׁתְּכַ֖חַת עֲלֽוֹ/הִי־־־־־׃
translation:
  text: Then the high officials and satraps tried to find grounds for accusing Daniel in his administration of the kingdom, but they could find neither grounds for accusation nor corruption because he was trustworthy. No negligence or corruption could be found against him.
  philosophy: dynamic
lexical_decisions:
- source_word: אֱדַיִן
  chosen: Then
  alternatives:
  - At that time
  - Thereupon
  lexicon: HALOT
  rationale: Temporal/sequential adverb introducing the next development in the narrative; 'Then' is natural modern English and preserves the flow.
- source_word: סָרְכַיָּא
  chosen: high officials
  alternatives:
  - commissioners
  - presidents
  lexicon: HALOT
  rationale: Administrative title in Imperial Aramaic. 'High officials' is clear modern English and avoids overly specific traditional renderings that may reflect later bureaucratic assumptions.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  chosen: satraps
  alternatives:
  - provincial governors
  lexicon: HALOT
  rationale: A well-established historical term for Persian provincial rulers; retaining 'satraps' preserves the setting and is sufficiently accessible.
- source_word: בָעַיִן
  chosen: tried
  alternatives:
  - were seeking
  lexicon: HALOT
  rationale: With the infinitive 'to find,' the ongoing effort is naturally expressed in English as 'tried to find.'
- source_word: עִלָּה
  chosen: grounds for accusation
  alternatives:
  - a charge
  - a ground for accusing
  lexicon: HALOT
  rationale: The noun denotes a pretext or ground on which an accusation can be brought, not necessarily a formal charge already established.
- source_word: לְהַשְׁכָּחָה
  chosen: to find
  alternatives:
  - to discover
  lexicon: HALOT
  rationale: The infinitive states the officials' attempted discovery of accusatory grounds.
- source_word: מִצַּד מַלְכוּתָא
  chosen: in matters of the kingdom
  alternatives:
  - in connection with the kingdom
  - in regard to the administration of the kingdom
  lexicon: HALOT
  rationale: 'Specifies the sphere in which they sought grounds against Daniel: his governmental service. ''Matters of the kingdom'' is natural and sufficiently formal.'
- source_word: שְׁחִיתָה
  chosen: corruption
  alternatives:
  - wrongdoing
  - corrupt practice
  lexicon: HALOT
  rationale: The term denotes corrupt or damaging misconduct. 'Corruption' fits the administrative setting and pairs well with 'charge.'
- source_word: מְהֵימַן
  chosen: trustworthy
  alternatives:
  - faithful
  - reliable
  lexicon: HALOT
  rationale: In this administrative context the adjective concerns Daniel's dependable conduct in office. 'Trustworthy' avoids an unintended specifically religious coloring.
- source_word: שָׁלוּ
  chosen: negligence
  alternatives:
  - error
  - lapse
  - carelessness
  lexicon: HALOT
  rationale: The term denotes an administrative lapse, error, or negligence. The main choice fits the inquiry into official misconduct.
- source_word: הִשְׁתְּכַחַת עֲלֹוהִי
  chosen: could be found against him
  alternatives:
  - was found against him
  - was found in him
  lexicon: HALOT
  rationale: The Aramaic preposition carries a forensic orientation here. English 'against him' fits the failed search for grounds of accusation.
