base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/013.yaml
  text: And when those twelve sheep had grown, they handed over one of them to the donkeys, and those donkeys in turn handed over that sheep to the wolves, and that sheep grew up in the midst of the wolves.
translation:
  language: ko
  text: 그리고 그 열두 양이 자라자, 그들은 그들 가운데 하나를 당나귀들에게 넘겨주었고, 그 당나귀들은 다시 그 양을 늑대들에게 넘겨주었으며, 그 양은 늑대들 가운데서 자랐습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቁ ዝኩ 12 አባግዕ
  english_pob_choice: those twelve sheep
  chosen_korean: 그 열두 양
  alternatives_korean:
  - 그 열두 양떼
  - 그 열두 어린양
  lexicon: 양
  rationale: 게에즈의 አባግዕ은 문자 그대로 ‘양들’이므로, POB의 sheep를 그대로 살려 ‘양’으로 옮겼습니다. ‘어린양’은 의미를 과도하게 신학화할 수 있어 배제했습니다.
- source_word: መጦውዎ
  english_pob_choice: handed over
  chosen_korean: 넘겨주었고
  alternatives_korean:
  - 맡겼고
  - 인도했고
  - 전달했고
  lexicon: 넘겨주다
  rationale: 반복되는 위임·이양 동작을 자연스럽게 드러내면서도, 소유권/책임의 이전이라는 강한 뉘앙스를 유지하는 표현으로 옮겼습니다.
- source_word: ለአእዱግ / አእዱግ
  english_pob_choice: the donkeys
  chosen_korean: 당나귀들
  alternatives_korean:
  - 나귀들
  - 노새들
  lexicon: 당나귀
  rationale: 게에즈의 어휘는 가축으로서의 당나귀를 가리키므로, 한국어의 가장 직접적인 대응어인 ‘당나귀들’을 사용했습니다.
- source_word: ለዝኩ በግዕ / ማእከለ አዝእብት
  english_pob_choice: that sheep ... in the midst of the wolves
  chosen_korean: 그 양 ... 늑대들 가운데서
  alternatives_korean:
  - 그 양 ... 늑대들 한가운데서
  - 그 양 ... 늑대들 사이에서
  lexicon: 가운데서
  rationale: ‘사이에서’보다 ‘가운데서’가 중간에 놓여 있는 지속적 상태를 더 잘 살리며, POB의 in the midst of를 직접 반영합니다.
theological_decisions:
- issue: 서사적 동물 상징의 보존
  chosen_reading: 이 절은 알레고리적 동물 서사를 해설 없이 그대로 보존했습니다.
  alternative_readings:
  - 의미를 풀어 ‘양=사람’ 식으로 의역
  - 전통적 교회 언어로 상징을 평탄화
  rationale: 원문과 POB의 문맥은 상징 해석을 절 본문에 주입하지 않고 사건의 흐름을 전달하는 데 있으므로, 독자가 뒤 문맥에서 상징을 판단하도록 남겨 두었습니다.
  doctrine_reference: 본문 서술 보존 원칙
