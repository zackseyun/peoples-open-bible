review_pass:
  verdict: revise
  source_fidelity: 초안은 전반적으로 라틴어의 책망과 비유를 반영합니다. 그러나 ad placendum et gloriandum in amatoribus는 화자가 아니라 ‘비참한 자’가 ‘연인들의 마음에 들고 그들을 자랑하는’ 목적을 나타냅니다. 초안의 ‘사랑하는 자들 앞에서 기쁘게 하고 자랑하게 하였’는 ‘앞에서’와 사역 표현을 더하여 원문의 문법 관계를 바꿉니다.
  naturalness: ‘너에게 화가 있다’와 ‘네가’는 현대 한국어의 합쇼체 요구와 맞지 않습니다. ‘당신에게 화가 있습니다’ 및 ‘당신이’로 통일하고, 목적 표현을 ‘~하기 위해’로 명시하면 현대의 격식 있는 문장으로 자연스럽습니다.
  terminology: Vae는 심판적 경고를 살려 ‘화가 있습니다’로 옮겼습니다. amatoribus는 이 문맥에서 성적·우상숭배적 비유를 포함할 수 있는 ‘연인들’이 자연스럽습니다. fornicatione는 원문의 비유적 모호성을 보존하여 ‘음행을 하도록’으로 처리했습니다.
