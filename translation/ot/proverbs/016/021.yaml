id: PRO.16.21
reference: Proverbs 16:21
source:
  edition: WLC
  text: לַ/חֲכַם לֵ֭ב יִקָּרֵ֣א נָב֑וֹן וּ/מֶ֥תֶק שְׂ֝פָתַ֗יִם יֹסִ֥יף לֶֽקַח־׃
translation:
  text: The wise in heart are called discerning, and pleasant speech increases persuasiveness[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “promotes learning.”
    reason: alternative_reading
lexical_decisions:
- source_word: לַחֲכַם לֵב
  chosen: The wise in heart
  alternatives:
  - The wise-hearted man
  - A wise-hearted person
  - The wise in heart
  lexicon: HALOT
  rationale: Natural English while retaining the heart image.
- source_word: יִקָּרֵא
  chosen: is called
  alternatives:
  - will be called
  - is proclaimed
  lexicon: HALOT
  rationale: Niphal of קרא here is best rendered as a passive/resultative, 'is called' or 'is regarded as.' English present tense fits proverbial style better than a strict future.
- source_word: נָבוֹן
  chosen: discerning
  alternatives:
  - understanding
  - prudent
  - intelligent
  lexicon: HALOT
  rationale: נבון denotes one who has understanding or discernment. 'Discerning' fits the wisdom context and reads naturally after 'is called.' 'Understanding' would be more wooden in English when used predicatively of a person.
- source_word: וּמֶתֶק שְׂפָתַיִם
  chosen: and pleasant speech
  alternatives:
  - and pleasant speech
  - and sweetness of speech
  - and gracious lips
  lexicon: HALOT
  rationale: Natural rendering of the speech metonymy.
- source_word: יֹסִיף
  chosen: increases
  alternatives:
  - adds
  - augments
  lexicon: HALOT
  rationale: Hiphil of יסף means to add or increase. 'Increases' works well with the object לקח in a proverbial statement and avoids awkwardness of 'adds learning' in some English registers.
- source_word: לֶקַח
  chosen: learning
  alternatives:
  - persuasion
  - instruction
  - insight
  lexicon: HALOT
  rationale: לקח can mean instruction received, learning, or teaching. In this context, where pleasant speech enhances receptivity and effectiveness, 'learning' is a strong fit. 'Persuasion' is a plausible contextual alternative and worth preserving in a footnote because some interpreters understand the line as effective speech increasing persuasiveness rather than knowledge strictly speaking.
- source_word: יֹסִיף לֶקַח
  chosen: adds persuasiveness
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Contextually defensible for effective speech, with other lexical senses retained in a note.
