id: 1KI.8.17
reference: 1 Kings 8:17
source:
  edition: WLC
  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣ד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
translation:
  text: It was in the heart of David my father to build a house for the name of Yahweh, the God of Israel.
  philosophy: dynamic
lexical_decisions:
- source_word: וַיְהִי
  chosen: It was
  alternatives:
  - And it was
  - It was
  - Now it was
  lexicon: HALOT
  rationale: 'The wayyiqtol of היה here introduces a past-state formula rather than a simple event. ''Now it was'' gives natural English while preserving the narrative linkage and stative sense. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: עִם לְבַב
  chosen: in the heart of
  alternatives:
  - with the heart of
  - on the heart of
  - it was with the heart of
  lexicon: HALOT
  rationale: The idiom עִם + לֵב/לְבַב expresses something being present in someone's heart, that is, intention or desire. 'In the heart of' is idiomatic English and preserves the Hebrew metaphor better than flattening to merely 'David intended.'
- source_word: דָּוִד אָבִי
  chosen: David my father
  alternatives:
  - my father David
  lexicon: HALOT
  rationale: Both English orders are possible. 'David my father' stays closer to the Hebrew sequence while remaining natural in English.
- source_word: לִבְנוֹת
  chosen: to build
  alternatives:
  - to construct
  lexicon: HALOT
  rationale: Standard rendering of בנה in temple-building contexts; clear and consistent.
- source_word: בַּיִת
  chosen: a house
  alternatives:
  - a temple
  lexicon: HALOT
  rationale: Although the referent is the temple, the Hebrew says 'house.' Retaining 'house' preserves the temple-as-house imagery central to the passage. 'Temple' is a possible interpretive gloss but is not required in the main text.
- source_word: לְשֵׁם
  chosen: for the name of
  alternatives:
  - for the honor of
  - for the renown of
  lexicon: HALOT
  rationale: The phrase 'for the name of' is a standard biblical expression, especially in temple contexts, and should be preserved rather than paraphrased away. It conveys dedication to YHWH's revealed identity and presence without over-interpreting.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  chosen: the God of Israel
  alternatives:
  - God of Israel
  lexicon: HALOT
  rationale: The construct phrase identifies the LORD covenantally. Including the article yields natural English and reflects the appositional identification.
