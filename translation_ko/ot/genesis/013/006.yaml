  yaml_path: translation/ot/genesis/013/006.yaml
  text: And the land could not support them living together, because their possessions were too great for them to live together.
translation:
  language: ko
  text: 그들이 함께 거주하기에는 그 땅이 그들을 감당하지 못했습니다. 그들이 가진 것이 너무 많아서 함께 거주할 수 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לֹא נָשָׂ֥א ... הָ/אָ֖רֶץ
  english_pob_choice: the land could not support them
  chosen_korean: 그 땅이 ... 감당하지 못했습니다
  alternatives_korean:
  - 그 땅이 ... 지탱하지 못했습니다
  - 그 땅이 ... 받쳐 주지 못했습니다
  lexicon: נָשָׂא
  rationale: נָשָׂא의 ‘떠받치다/감당하다’ 의미를 살려, 단순한 물리적 ‘수용’보다 땅의 수용 능력이 한계를 넘었다는 뜻을 자연스럽게 표현했습니다.
- source_word: לָ/שֶׁ֣בֶת יַחְדָּ֑ו
  english_pob_choice: living together
  chosen_korean: 함께 거주하는 것
  alternatives_korean:
  - 함께 사는 것
  - 한곳에 함께 거주하는 것
  lexicon: ישב
  rationale: יַחְדָּו의 공동 거주를 평이한 현대어로 옮기되, 단순 동거가 아니라 같은 지역에 함께 정착해 사는 상황을 드러냈습니다.
- source_word: רְכוּשָׁ/ם֙ רָ֔ב
  english_pob_choice: their possessions were too great
  chosen_korean: 그들의 소유가 너무 많아서
  alternatives_korean:
  - 그들의 재산이 너무 많아서
  - 그들의 소유물이 너무 많아서
  lexicon: רְכוּשׁ
  rationale: רְכוּשׁ을 ‘소유/재산’으로 옮길 수 있으나, 서사 맥락에서 가축과 재물 전체를 포괄하는 넓은 의미를 살리기 위해 ‘소유’로 처리했습니다.
theological_decisions:
- issue: 아브람과 롯의 갈등 원인 서술을 과장 없이 유지할지 여부
  chosen_reading: 땅의 수용 한계와 소유의 많음을 원인으로만 제시하고, 심리적 추정은 덧붙이지 않았습니다.
  alternative_readings:
  - 서로 다투기 시작했다는 암시를 넣는 번역
  - 이주민의 정착 곤란을 해석적으로 확장하는 번역
  rationale: 히브리어 본문은 갈등의 배경만 진술하므로, 이후 절들에서 드러날 충돌을 앞당겨 해석하지 않고 본문이 말하는 범위에만 머물렀습니다.
  doctrine_reference: 본문 충실성 원칙
