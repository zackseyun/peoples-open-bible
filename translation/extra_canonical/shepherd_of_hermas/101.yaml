  text: Ἐκ δὲ τοῦ ἑβδόμο⸢υ⸣ ὄρους, ἐν ᾧ βοτάνα⸢ι⸣ χλωραὶ ⸢καὶ⸣ ἱλαραί, καὶ ὅλον τὸ ὄρος εὐθηνοῦν, καὶ
    πᾶν γένος κτηνῶν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ ἐνέμοντο τὰς βοτά⸢νας ἐν τούτῳ τῷ⸣ ὄρει, καὶ αἱ ⸢βοτάναι⸣
    ἃς ἐνέμοντο μᾶλλον εὐθαλεῖς ἐγίνοντο, οἱ πιστεύσαντες τοιοῦτοί εἰσι· 2. πάντοτε ἁπλοὶ ⸢καὶ ἄκακοι⸣
    ⸢καὶ⸣ μακάριοι ἐγίνοντο, μηδὲν κατ᾿ ἀλλήλων ἔχοντες, ἀλλὰ πάντοτε ἀγαλλιώμενοι ἐπὶ τοῖς δούλοις τοῦ
    Θεοῦ καὶ ἐνδεδυμένοι ⸢τὸ⸣ πνεῦμα ⸢τὸ ἅγιον⸣ τούτων τῶν παρθένων καὶ πάντοτε σπλάγχνον ἔχοντες ἐπὶ
    πάντα ἄνθρωπον, καὶ ἐκ τῶν κόπων αὐτῶν παντὶ ἀνθρώπῳ ἐχορήγησαν ἀνονειδίστως καὶ ἀδιστάκτως. 3. ⸢ὁ
    οὖν⸣ Κύριος ἰδὼν τὴν ἁπλότητα αὐτῶν καὶ πᾶσαν νηπιότητα ἐπλήθυνεν αὐτοὺς ἐν τοῖς κόποις τῶν χειρῶν
    αὐτῶν καὶ ἐχαρίτωσεν αὐτοὺς ἐν πάσῃ πράξει αὐτῶν. 4. λέγω δὲ ὑμῖν τοῖς τοιούτοις οὖσιν ἐγὼ ὁ ἄγγελος
    τῆς μετανοίας· διαμείνατε τοιοῦτοι, καὶ οὐκ ἐξαλειφθήσεται τὸ σπέρμα ὑμῶν ἕως αἰῶνος. ἐδοκίμασε γὰρ
    ὑμᾶς ὁ Κύριος καὶ ἐνέγραψεν ὑμᾶς εἰς τὸν ἀριθμὸν τὸν ἡμέτερον, καὶ ὅλον τὸ σπέρμα ὑμῶν κατοικήσει
    μετὰ τοῦ υἱοῦ τοῦ Θεοῦ· ἐκ γὰρ τοῦ πνεύματος αὐτοῦ ἐλάβετε.
