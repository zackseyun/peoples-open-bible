id: REV.11.18
reference: Revelation 11:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
  footnotes:
  - marker: a
    text: Or 'slaves' for 'your servants'; Greek doulos can denote a servant or a slave, depending on context.
    reason: alternative_reading
  - marker: b
    text: Or 'those who ruin/corrupt the earth'; Greek gē can also mean 'land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 만국이 분노하였고, 주의 진노가 임하였으며, 죽은 자들이 심판받을 때가, 곧 주의 종들인 예언자들과 성도들과 주의 이름을 경외하는 자들, 작은 자나 큰 자나 그들에게 상을 주실 때가, 또 땅을 멸하는 자들을 멸하실 때가 이르렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς δούλοις σου τοῖς προφήταις
  english_pob_choice: your servants—the prophets
  chosen_korean: 주의 노예들 예언자들
  alternatives_korean:
  - 주의 종들 예언자들
  lexicon: BDAG
  rationale: 1:1, 10:7과 일관되게 δοῦλος를 「노예」로 옮긴다.
