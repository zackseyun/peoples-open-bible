id: 1CH.27.14
reference: 1 Chronicles 27:14
source:
  edition: WLC
  text: עַשְׁתֵּֽי עָשָׂר֙ לְ/עַשְׁתֵּ֣י עָשָׂ֣ר הַ/חֹ֔דֶשׁ בְּנָיָ֥ה הַ/פִּרְעָתוֹנִ֖י מִן בְּנֵ֣י אֶפְרָ֑יִם וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־־־׃ס
translation:
  text: The eleventh, for the eleventh month, was Benaiah the Pirathonite, from the sons of Ephraim[a]; and over his division were twenty-four thousand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'from Ephraim.' The Hebrew more literally reads 'from the sons of Ephraim,' indicating tribal descent.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  chosen: The eleventh, for the eleventh month
  alternatives:
  - The eleventh course, for the eleventh month
  lexicon: Brown-Driver-Briggs Hebrew and English Lexicon (Sefaria digital entry)
  entry: BDB07732
  rationale: 'Both retained compounds mean eleven and have ordinal force in this roster: the eleventh course and the eleventh month, between the tenth and twelfth assignments. The selected Rahlfs–Hanhart 2006 Greek likewise retains both eleventh expressions. Main English keeps the first expression elliptical without supplying course or commander; English was supplies the Hebrew zero-copula roster linkage, not another source word. The initial expression orders the roster leader/course without an explicit noun; course in the alternative is an explicitly supplied referent from the military-division context, not an additional source word. Twenty-four thousand remains unchanged. No fresh HALOT entry was consulted.'
- source_word: בְּנָיָה
  chosen: Benaiah
  rationale: Personal names are transliterated by standard convention per translation philosophy.
- source_word: הַפִּרְעָתוֹנִי
  chosen: the Pirathonite
  alternatives:
  - the man from Pirathon
  lexicon: HALOT
  rationale: The gentilic is best represented by the standard English form 'Pirathonite,' preserving the place-based identity.
- source_word: מִן בְּנֵי אֶפְרָיִם
  chosen: from the sons of Ephraim
  alternatives:
  - from Ephraim
  - from the people of Ephraim
  lexicon: HALOT
  rationale: The Hebrew explicitly says 'sons of Ephraim.' This likely denotes tribal descent rather than immediate parentage, but the more literal rendering preserves the source wording and its genealogical flavor.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  chosen: and over his division were
  alternatives:
  - and his division had
  - and in his division were
  lexicon: HALOT
  rationale: מַחֲלֻקָה here refers to the military division/course under his command in this chapter's repeated formula. 'Over his division were' preserves the Hebrew preposition and the administrative sense, though slightly idiomatic in English.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  chosen: twenty-four thousand
  lexicon: HALOT
  rationale: Straightforward cardinal number; rendered in standard English form.
