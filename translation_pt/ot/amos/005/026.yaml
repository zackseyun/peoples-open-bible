source:
  edition: WLC
  text: וּ/נְשָׂאתֶ֗ם אֵ֚ת סִכּ֣וּת מַלְכְּ/כֶ֔ם וְ/אֵ֖ת כִּיּ֣וּן צַלְמֵי/כֶ֑ם כּוֹכַב֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר עֲשִׂיתֶ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/026.yaml
  text: And you carried Sikkuth your king[a], and Kiyyun your images, the star of your god[c][b], which you made for yourselves.
translation:
  language: pt
  text: E vocês carregaram Sicute, seu rei[a], e Quium[b], suas imagens — a estrela do seu deus[c] —, que fizeram para si mesmos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vosso Moloque”. O hebraico diz literalmente “vosso rei”, mas muitos entendem aqui uma referência à divindade Moloque, interpretação refletida também em Atos 7:43.
    reason: alternative_reading
  - marker: b
    text: Sicute e Quium são nomes raros, provavelmente associados ao culto astral; sua identificação exata é incerta.
    reason: cultural_note
  - marker: c
    text: Possivelmente “a estrela dos vossos deuses”; contudo, a vocalização massorética favorece o singular “vosso deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשָׂאתֶם
  choice: E carregastes
  rationale: O qal perfeito na segunda pessoa do plural, ligado pela conjunção, descreve o ato de transportar objetos de culto. “Carregastes” reproduz naturalmente o valor verbal sem impor uma leitura futura.
- source_word: סִכּוּת
  choice: Sicute
  rationale: Termo raro e incerto, provavelmente nome próprio ligado ao culto astral. A transliteração preserva a evidência hebraica sem adotar uma identificação especulativa.
- source_word: מַלְכְּכֶם
  choice: vosso rei
  rationale: O texto massorético permite a leitura direta “vosso rei”. A possível referência à divindade Moloque é mantida em nota, não inserida no texto principal.
- source_word: כִּיּוּן
  choice: Quium
  rationale: Nome raro, tradicionalmente relacionado a uma divindade astral. A forma portuguesa transliterada evita uma identificação excessivamente segura.
- source_word: צַלְמֵיכֶם
  choice: vossas imagens
  rationale: Traduz de modo amplo e preciso o plural de צֶלֶם, sem acrescentar a avaliação interpretativa explícita de “ídolos”.
- source_word: כּוֹכַב אֱלֹהֵיכֶם
  choice: a estrela do vosso deus
  rationale: Preserva a relação construta e o singular indicado pela vocalização massorética, sem explicitar além do texto a relação entre a estrela e os nomes anteriores.
- source_word: אֲשֶׁר עֲשִׂיתֶם לָכֶם
  choice: que fizestes para vós mesmos
  rationale: Mantém a oração relativa e expressa a força reflexiva de objetos que o próprio povo produziu para si.
theological_decisions:
- issue: Se מַלְכְּכֶם deve ser traduzido como substantivo comum ou identificado com Moloque
  choice: vosso rei
  alternative: vosso Moloque; Moloque, vosso rei
  rationale: A forma do texto massorético lê naturalmente “vosso rei” e não apresenta de maneira inequívoca o nome divino. A tradição que identifica aqui Moloque, refletida também em Atos 7:43, é relevante, mas permanece como alternativa em nota.
- issue: Se סִכּוּת e כִּיּוּן devem ser interpretados ou transliterados
  choice: transliterar como Sicute e Quium
  alternative: traduzir Sicute como “santuário” ou identificar diretamente ambos com divindades astrais específicas
  rationale: Os dois termos são raros e sua identificação exata é incerta. A transliteração preserva a provável função de nomes próprios e evita transformar hipóteses históricas em afirmações do texto.
- issue: Se אֱלֹהֵיכֶם deve ser entendido no singular ou no plural
  choice: vosso deus
  alternative: vossos deuses
  rationale: A vocalização massorética favorece o singular com sufixo plural de segunda pessoa. A possibilidade de plural é registrada em nota para preservar a incerteza lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa do plural coerentes com o tom bíblico sem arcaísmo excessivo. Os nomes incertos são transliterados em formas legíveis em português, e a estrutura apositiva do hebraico é preservada para não resolver indevidamente suas relações sintáticas.
