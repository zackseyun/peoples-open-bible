id: PSA.7.14
reference: Psalms 7:14
source:
  edition: WLC
  text: הִנֵּ֥ה יְחַבֶּל אָ֑וֶן וְ/הָרָ֥ה עָ֝מָ֗ל וְ/יָ֣לַד שָֽׁקֶר־׃
translation:
  text: 'Look: the evildoer writhes in labor with wickedness, conceives trouble, and gives birth to falsehood.'
  philosophy: dynamic
lexical_decisions:
- source_word: הִנֵּה
  chosen: Look
  alternatives:
  - Behold
  - See
  lexicon: HALOT
  rationale: The interjection draws attention to the vivid image. 'Look' is direct modern English.
- source_word: יְחַבֶּל
  chosen: labors with
  alternatives:
  - travails with
  - writhes in labor with
  - conceives
  lexicon: HALOT
  rationale: In this birth metaphor the verb evokes painful labor or travail. 'Labors with' retains the image without using the archaic verb 'travails.'
- source_word: אָוֶן
  chosen: wickedness
  alternatives:
  - iniquity
  - evil
  - trouble
  lexicon: HALOT
  rationale: The word carries both moral wrong and harmful trouble. 'Wickedness' distinguishes the first object from the following עָמָל while preserving moral agency.
- source_word: הָרָה
  chosen: conceives
  alternatives:
  - is pregnant with
  - becomes pregnant with
  lexicon: HALOT
  rationale: This is the verse's conception or pregnancy verb. The English verbal sequence intentionally preserves the Hebrew's compressed, non-biological order.
- source_word: עָמָל
  chosen: trouble
  alternatives:
  - mischief
  - misery
  - toil
  lexicon: HALOT
  rationale: In this context the term names harmful trouble produced by wicked action and pairs naturally with the birth metaphor.
- source_word: יָלַד שָׁקֶר
  chosen: gives birth to falsehood
  alternatives:
  - brings forth deceit
  - bears a lie
  lexicon: HALOT
  rationale: The final clause completes the reproductive image with a clear contemporary expression.
