translation:
  text: They will no longer sin, nor will they be condemned throughout all the days of their lives.[a] They will
    not die by punishment or wrath, but will complete the full number of their days. Their lives will grow long
    in peace, and their years of joy will increase in gladness and everlasting peace throughout all the days of
    their lives.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected Ge’ez has “will not be condemned/judged.” Its apparatus discusses a different “will not sin”
      reading and possible corruption. This draft retains the selected Ge’ez judgment verb rather than silently
      replacing it with that alternative.
  - marker: b
    text: The verse continues for six lines on the next Ge’ez page before chapter VI. The print retains separate
      “by punishment” and “not by wrath” expressions; its apparatus proposes combining them as “punishment of death.”
      This draft follows the printed wording instead of silently adopting the proposal.
