translation:
  text: Until then I lay prostrate on my face, trembling.[a] The Lord called to me
    with his own mouth and said, “Come here, Enoch, and hear my word.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The printed Geʿez word after on my face is daggered. Apparatus25 treats
      it as corrupt and prefers the Greek posture reading, βεβλημένος. Prostrate is
      a Greek-supported editorial repair, not a separately certain translation of
      that Geʿez form.
    reason: textual_variant
  - marker: b
    text: The selected Geʿez gives and to my holy word, with holy daggered. Apparatus28
      questions holy as a corruption corresponding to Greek ἄκουσον, hear. The body
      here follows the printed Greek καὶ τὸν λόγον μου ἄκουσον, and hear my word,
      at this crux; it does not add the uncertain Geʿez holy adjective to that Greek
      wording.
    reason: textual_variant
