theological_decisions:
- issue: Rendering of the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Sense of אֱלֹהִים in the final colon
  chosen_reading: gods
  alternative_readings:
  - divine beings
  - heavenly beings
  rationale: The psalm emphasizes the LORD's supremacy over all rival claimants to divinity. Rendering as 'gods' preserves the Hebrew term's plain plural sense and the text's theological tension without prematurely resolving whether the referents are idols, nations' gods, or heavenly beings.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
