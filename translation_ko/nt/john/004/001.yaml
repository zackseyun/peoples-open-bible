    issue: The temporal force of Ὡς is missing.
    rationale: ‘그러므로’ represents οὖν, but the draft’s ‘예수께서 ... 아셨습니다’ is an independent completed sentence and does not translate Ὡς ἔγνω (‘when/as Jesus came to know’). Since the Greek continues into the next verse, Korean should retain ‘아셨을 때—’.
  - severity: low
    issue: ‘제자들을 만들고’ is overly literal and the footnote’s alternative has inconsistent aspect.
    rationale: ‘제자를 삼으시고’ is the established, idiomatic Korean rendering for ποιεῖ μαθητάς. The footnote’s ‘베풀었다’ changes the present-tense report into a completed past action; it should retain the reported present/progressive sense.
