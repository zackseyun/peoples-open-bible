  text: Καὶ⁶⁸ ὁ πρῶτος κλῆρος ἔσται μέγας· καὶ ὑπὲρ αὐτὸν οὐ γενήσεται ἕτερος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/012.yaml
  text: And the first lot will be great, and no other will arise above it.
translation:
  language: ko
  text: 첫째 몫은 위대할 것이며, 그보다 위에 설 다른 몫은 없을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρῶτος κλῆρος
  english_pob_choice: the first lot
  chosen_korean: 첫째 몫
  alternatives_korean:
  - 첫째 제비
  - 첫 번째 몫
  - 첫째 분깃
  lexicon: κλῆρος
  rationale: κλῆρος는 단순한 ‘제비’보다 분배되어 주어지는 몫의 뉘앙스가 있어, 이 문맥에서는 ‘몫’이 가장 자연스럽고 source-direct합니다.
- source_word: ἔσται μέγας
  english_pob_choice: will be great
  chosen_korean: 클 것입니다
  alternatives_korean:
  - 위대할 것입니다
  - 크게 될 것입니다
  lexicon: μέγας
  rationale: 예언적 선언의 크기와 우위를 한국어로 자연스럽게 살리기 위해 ‘클 것입니다’로 옮겼습니다.
- source_word: ὑπὲρ αὐτὸν οὐ γενήσεται ἕτερος
  english_pob_choice: no other will arise above it
  chosen_korean: 그보다 위에 올라서는 다른 것은 없을 것입니다
  alternatives_korean:
  - 그보다 더 큰 다른 것은 없을 것입니다
  - 그 위에 설 다른 이는 없을 것입니다
  lexicon: ὑπέρ / γενήσεται / ἕτερος
  rationale: γενήσεται의 ‘일어나다/생겨나다’와 ὑπέρ의 ‘위에’ 방향성을 함께 살리면서, ἕτερος를 ‘다른 것’으로 반영해 ‘other’의 의미를 놓치지 않도록 했습니다.
theological_decisions:
- issue: 계급적/서열적 우위 표현의 직역성
  chosen_reading: ‘그보다 위에 올라서는’으로 서열적 우위를 드러냈습니다.
  alternative_readings:
  - ‘그보다 더 뛰어난’
  - ‘그보다 크지 않을’
  rationale: 문맥상 단순 비교가 아니라 위계적 우위의 부정을 말하므로, 한국어에서도 상향/우위 이미지를 유지했습니다.
  doctrine_reference: 문맥적 예언/축복 선언의 서열 표현
