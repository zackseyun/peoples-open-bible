id: JOB.3.20
reference: Job 3:20
source:
  edition: WLC
  text: לָ֤/מָּה יִתֵּ֣ן לְ/עָמֵ֣ל א֑וֹר וְ֝/חַיִּ֗ים לְ/מָ֣רֵי נָֽפֶשׁ׃
translation:
  text: Why is light given[a] to one in misery, and life to those bitter in soul?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “Why does he give light?” God is likely the unstated subject.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  chosen: Why
  alternatives:
  - Why is it that
  - For what reason
  lexicon: HALOT
  rationale: Interrogative adverb introducing Job's lament question. Simple 'Why' best preserves the force and poetic directness.
- source_word: יִתֵּן
  chosen: is given
  alternatives:
  - does he give
  - gives
  lexicon: HALOT
  rationale: The Hebrew is 3ms 'he gives,' but no explicit subject is stated. English passive avoids importing 'God' into the line while preserving the sense of bestowed existence; this fits the lament context and keeps the implied agent unstated.
- source_word: לְעָמֵל
  chosen: to one in misery
  alternatives:
  - to the miserable
  - to the weary
  - to the afflicted
  lexicon: HALOT
  rationale: Clearly conveys a person undergoing misery or distress.
- source_word: אוֹר
  chosen: light
  lexicon: HALOT
  rationale: Retained literally. In context it stands metonymically for continued existence or the experience of life, but 'light' is the Hebrew image and should be preserved.
- source_word: וְחַיִּים
  chosen: and life
  alternatives:
  - and living
  lexicon: HALOT
  rationale: Though morphologically plural, חַיִּים commonly functions idiomatically as 'life.' Singular English is the natural equivalent.
- source_word: לְמָרֵי נָפֶשׁ
  chosen: to the bitter in soul
  alternatives:
  - to those bitter of soul
  - to the embittered
  - to the bitter in spirit
  lexicon: HALOT
  rationale: The construct phrase literally means 'to the bitter ones of soul.' 'Bitter in soul' preserves the Hebrew idiom and emotional depth better than flattening it to merely 'embittered.' 'Soul' is retained rather than 'spirit' because נֶפֶשׁ here refers to the inner self/person in distress.
