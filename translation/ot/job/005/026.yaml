  review_summary: The verse’s mature-harvest comparison favors the traditional sense of full or ripe age over “full vigor,” which can imply death before old age. גָּדִישׁ is a stack or heap of grain rather than an individual sheaf. “Brought up” is overly literal and unnatural for the agricultural image in English; “gathered” supplies the contextual harvest sense without adding a distinct image. “In ripe old age” is idiomatic; “at a ripe old age” is not suitable with “come to the grave.”
