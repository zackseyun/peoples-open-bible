  meaning: After their ordered voyage to Schedia, the king confined the deportees in Alexandria's exposed racecourse to disgrace them publicly, separate them from his troops, and deny them even a proper enclosure.
  meaning_decisions:
  - source_phrase: ἐν τῷ πρὸ τῆς πόλεως ἱπποδρόμῳ
    prior_rendering: in the hippodrome before the city
    new_rendering: in the horse-racing course outside Alexandria
    rationale: The venue and its position are made immediately understandable, and the city's contextual identity is supplied so that readers do not mistake it for Schedia.
  - source_phrase: ἁπλατῷ καθεστῶτι περιμέτρῳ, καὶ πρὸς παραδειγματισμὸν ἄγαν εὐκαιροτάτῳ
    prior_rendering: an open area excellently suited for making an example of them
