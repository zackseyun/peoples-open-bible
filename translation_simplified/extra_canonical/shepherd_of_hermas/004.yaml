theological_decisions:
- issue: Scope of ἔθνη
  chosen_reading: Rendered as "nations"
  alternative_readings:
  - Gentiles
  rationale: Retain the selected two-group wording, nations and apostates, with versional alternatives
    disclosed in note b. This does not identify further groups absent from the source.
- issue: Referent nuance of ἀποστάται
  chosen_reading: Rendered as "apostates" to signal falling away from the community
  alternative_readings:
  - rebels
  - deserters
  rationale: Hermas is preoccupied with repentance for those who have fallen; "apostates" captures religious
    defection rather than generic rebellion.
- issue: Force of ἀνδρίζου
  chosen_reading: Rendered as "Take courage"
  alternative_readings:
  - Be brave
  - Act like a man
  rationale: The imperative exhorts to courageous action. We choose an idiomatic English exhortation that
    communicates the force without gendered idiom, while noting the literal in a footnote.
