  meaning: Despite their cruelty, God sustains powerful people and enables them to recover even when they despair of surviving.
  meaning_decisions:
  - source_phrase: וּמָשַׁךְ אַבִּירִים בְּכֹחוֹ
    prior_rendering: Yet he drags away the mighty by his power
    new_rendering: Yet God prolongs the life of the mighty by his power
    rationale: The verb can express extending or prolonging, and God's granting security in the next verse favors his sustaining the mighty despite their wrongdoing; the destructive reading remains a serious alternative.
  - source_phrase: יָקוּם וְלֹא יַאֲמִין בַּחַיִּין
    prior_rendering: he rises up, but he has no assurance of life
    new_rendering: they rise again even when they despair of life
    rationale: On the sustaining reading, the representative singular refers to members of the mighty class recovering despite having no confidence in continued life.
