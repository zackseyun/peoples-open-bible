  - 성결과 의로
  lexicon: ὁσιότης, δικαιοσύνη
  rationale: ὁσιότης는 단순 도덕성보다 하나님 앞의 거룩한 상태를 가리키므로 ‘거룩함’이 적절하고, δικαιοσύνη는 프로젝트 기본어인 ‘의’를 유지했습니다.
- source_word: ἐν εὐθύτητι ψυχῆς
  english_pob_choice: with uprightness of soul
  chosen_korean: 마음의 올바름으로
  alternatives_korean:
  - 영혼의 올곧음으로
  - 혼의 바름으로
  lexicon: εὐθύτης, ψυχή
  rationale: ψυχή는 여기서 내면의 인격·자아를 가리키므로 ‘마음’으로 자연스럽게 옮기되, εὐθύτης의 직선성·정직성을 ‘올바름’으로 반영했습니다.
- source_word: κρίσιν κρίνῃ
  english_pob_choice: judge
  chosen_korean: 심판하십니다
  alternatives_korean:
  - 판단하십니다
  - 판결하십니다
  lexicon: κρίνω
  rationale: 끝의 중첩 구조는 ‘심판하다’가 가장 직접적이며, 문맥상 공적 재판행위를 살리는 표현입니다.
