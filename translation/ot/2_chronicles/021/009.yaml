  category: meaning_retranslation
  from: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
  to: So Jehoram set out with his commanders and his entire chariot force. He rose during the night and attacked the Edomites who had surrounded him, as well as their chariot commanders[a].
  rationale: The earlier caution against treating “struck” as a decisive victory is retained, since verse 10 reports continued independence. I clarify the grammatically stronger reading that the chariot commanders were also attacked, while noting the alternative that they were Jehoram’s encircled commanders.
