  meaning: The offered peace will rest on someone who welcomes it, but otherwise it will return to the messengers.
  meaning_decisions:
  - source_phrase: υἱὸς εἰρήνης
    prior_rendering: a son of peace
    new_rendering: someone who welcomes peace
    rationale: In the hospitality and mission context, the idiom describes a receptive person, not literal sonship; the alternative sense of a peaceful person's character is preserved in the note.
  - source_phrase: ἡ εἰρήνη ὑμῶν
    prior_rendering: your peace
    new_rendering: the peace you offer
    rationale: This identifies the peace with the blessing just spoken, rather than the messengers' own inward tranquility.
  - source_phrase: ἐπ’ αὐτόν
    prior_rendering: upon him
    new_rendering: upon that person
    rationale: The pronoun refers to the person described by the idiom; its grammatical masculinity does not restrict the blessing to males.
  footnote_kinds:
    a: alternative_meaning
  history_weighed: Earlier decisions recognized receptivity as the idiom's meaning but retained 'son of peace' for formal and grammatical reasons. I express that recognized meaning directly while preserving the images of peace resting and returning.
