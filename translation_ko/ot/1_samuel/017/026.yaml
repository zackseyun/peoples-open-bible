source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶֽל הָ/אֲנָשִׁ֞ים הָ/עֹמְדִ֣ים עִמּ/וֹ֮ לֵ/אמֹר֒ מַה יֵּעָשֶׂ֗ה לָ/אִישׁ֙ אֲשֶׁ֤ר יַכֶּה֙ אֶת הַ/פְּלִשְׁתִּ֣י הַלָּ֔ז וְ/הֵסִ֥יר חֶרְפָּ֖ה מֵ/עַ֣ל יִשְׂרָאֵ֑ל כִּ֣י מִ֗י הַ/פְּלִשְׁתִּ֤י הֶֽ/עָרֵל֙ הַ/זֶּ֔ה כִּ֣י חֵרֵ֔ף מַעַרְכ֖וֹת אֱלֹהִ֥ים חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: ko
  text: 다윗이 자기와 함께 서 있는 사람들에게 말했습니다. 「이 블레셋 사람을 쳐서 넘어뜨리고 이스라엘에서 수치를 없애는 사람에게는 무엇을 해 줍니까? 살아 계신 하나님의 전열을 모욕한 이 할례받지 않은 블레셋 사람이 도대체 누구입니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל הָאֲנָשִׁים הָעֹמְדִים עִמּוֹ
  english_pob_choice: And David said to the men standing with him
  chosen_korean: 다윗이 자기와 함께 서 있는 사람들에게 말했습니다
  alternatives_korean:
  - 다윗이 자기 곁에 서 있는 사람들에게 말했습니다
  - 다윗이 함께 서 있던 사람들에게 말했습니다
  lexicon: אָמַר / עָמַד
  rationale: 동적인 서술이지만 원문의 ‘말하다’와 ‘함께 서 있는’ 상태를 자연스럽게 살려, 군중 속 대화 상황을 현대 한국어로 명확하게 옮겼습니다.
- source_word: מַה יֵּעָשֶׂה לָאִישׁ
  english_pob_choice: What will be done for the man
  chosen_korean: 무엇이 해주어집니까
  alternatives_korean:
  - 그 사람에게 무엇이 행해집니까
  - 그 사람에게 어떤 보상이 주어집니까
  lexicon: עשה + ל
  rationale: 히브리어 수동형의 일반적 의미를 반영해, 명시된 보상이 아니라 ‘어떤 일이 그에게 이루어지는가’를 묻는 표현으로 유지했습니다.
- source_word: חֶרְפָּה
  english_pob_choice: disgrace
  chosen_korean: 수치
  alternatives_korean:
  - 모욕
  - 치욕
  lexicon: חרפה
  rationale: 이스라엘 위에 놓인 공적 수치를 가리키므로, 개인 감정보다 공동체적 ‘수치’가 더 직접적입니다.
- source_word: הֶעָרֵל
  english_pob_choice: uncircumcised
  chosen_korean: 할례받지 않은
  alternatives_korean:
  - 무할례의
  - 할례 없는
  lexicon: ערל
  rationale: 언약 표지의 부재를 드러내는 직설적 표현을 유지하되, 한국어에서는 가장 자연스러운 현대 형용사형으로 옮겼습니다.
- source_word: מַעַרְכֹת אֱלֹהִים חַיִּים
  english_pob_choice: the battle lines of the living God
  chosen_korean: 살아 계신 하나님의 군대 진지
  alternatives_korean:
  - 살아 계신 하나님의 진영
  - 살아 계신 하나님의 전열
  lexicon: מערכה + אלהים חיים
  rationale: 마ַעַרְכוֹת은 단순한 ‘전투’보다 전열/진지를 뜻하므로, 전쟁 맥락을 살려 ‘군대 진지’로 번역했습니다.
theological_decisions:
- issue: ‘living God’의 신학적 강조
  chosen_reading: 살아 계신 하나님
  alternative_readings:
  - 생존하시는 하나님
  - 살아있는 하나님
  rationale: 단순한 존재 상태가 아니라 우상과 대조되는 참되신 하나님을 드러내는 관용구이므로, 한국어 성경에서 널리 쓰이면서도 의미를 보존하는 표현을 채택했습니다.
  doctrine_reference: 하나님의 생명성 및 우상과의 대조
- issue: 블레셋 사람의 도전이 누구를 겨냥하는가
  chosen_reading: 하나님의 군대 진지를 모욕합니다
  alternative_readings:
  - 하나님의 군대를 모욕합니다
  - 하나님의 전열을 욕되게 합니까
  rationale: 영문 POB가 ‘defy’의 결과를 단순 대결 이상으로 읽어 전투 질서에 대한 모욕으로 풀어낸 점을 따라, 원문의 적대적 도전성을 보존했습니다.
  doctrine_reference: 하나님의 백성에 대한 공개적 모욕과 언약적 대립
