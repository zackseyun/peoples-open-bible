  source_fidelity: 게에즈 본문과 영어 POB의 연속 동작(다시 화살을 쏨 → 아람 사람 아도란의 왼쪽 가슴을 맞힘 → 그를 물러서게 함 → 죽임)은 보존되어 있습니다. 다만 현행 ‘아도란 사람 아람 사람’은 인명과 민족 표지가 중복·역전되어 ‘Adoran the Aramean’을 정확하고 자연스럽게 전달하지 못합니다. 또한 ‘그래서’는 본문에 없는 인과 연결을 다소 강화합니다.
