id: JOB.28.17
reference: Job 28:17
source:
  edition: WLC
  text: לֹא יַעַרְכֶ֣/נָּה זָ֭הָב וּ/זְכוֹכִ֑ית וּ/תְמ֖וּרָתָ֣/הּ כְּלִי פָֽז־־׃
translation:
  text: Gold and glass[a] cannot equal it, nor can a vessel of fine gold be exchanged for it.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “crystal”; the transparent material named here was a costly luxury in the ancient world.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  chosen: cannot equal it
  alternatives:
  - cannot compare with it
  - cannot be valued against it
  - cannot match it
  lexicon: HALOT
  rationale: From ערך in the sense of setting in order/estimating/comparing. In this wisdom context about the incomparable worth of wisdom, 'equal it' captures the idea that gold and glass do not measure up to wisdom. The 3fs suffix refers back to wisdom in the surrounding context.
- source_word: זָהָב
  chosen: gold
  lexicon: HALOT
  rationale: Standard rendering for the precious metal; straightforward in context.
- source_word: זְכוֹכִית
  chosen: glass
  alternatives:
  - crystal
  lexicon: HALOT
  rationale: The term most naturally denotes glass, a luxury material in the ancient world. 'Crystal' is a traditional alternative, but 'glass' better reflects the likely lexical sense and avoids importing a more specific material not required by the Hebrew.
- source_word: תְמוּרָתָהּ
  chosen: its exchange
  alternatives:
  - its price
  - what is given in exchange for it
  - its equivalent
  lexicon: HALOT
  rationale: 'תְּמוּרָה denotes exchange/substitution. ''Its exchange'' preserves the concrete commercial metaphor: nothing can be traded for wisdom as an equivalent.'
- source_word: כְּלִי פָז
  chosen: an article of fine gold
  alternatives:
  - a vessel of fine gold
  - an object of pure gold
  lexicon: HALOT
  rationale: כְּלִי is a broad term for vessel, article, implement, or object. 'Article' is slightly broader and more natural in English here, while preserving the sense of a crafted item. פָּז denotes refined/fine gold, not merely generic gold.
- source_word: תְמוּרָתָהּ כְּלִי פָז
  chosen: nor can a vessel of fine gold be exchanged for it
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English expression of the nominal exchange construction.
- source_word: כְּלִי פָז
  chosen: a vessel of fine gold
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: A concrete and suitably broad contextual rendering of the crafted fine-gold item.
