  meaning: Paul reminds the readers that they were once estranged from God, inwardly hostile toward him, and engaged in evil deeds.
  meaning_decisions:
  - source_phrase: ἀπηλλοτριωμένους
    prior_rendering: alienated
    new_rendering: alienated from God
    rationale: The surrounding reconciliation language identifies God as the one from whom they were estranged; making this explicit prevents the English from suggesting merely social alienation.
  - source_phrase: ἐχθροὺς τῇ διανοίᾳ
    prior_rendering: hostile in mind
    new_rendering: hostile toward him in your thinking
    rationale: This clarifies both the object of their hostility and its inward character without reducing it to intellectual disagreement.
  - source_phrase: ἐν τοῖς ἔργοις τοῖς πονηροῖς
    prior_rendering: in evil deeds
    new_rendering: doing evil deeds
    rationale: This restores natural English for their outward conduct without asserting that their evil deeds caused their hostility.
