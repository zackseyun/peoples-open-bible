- from: 예수께서 말씀하셨습니다. 「아담은 큰 능력과 큰 부에서 나왔으나, 여러분에게 합당하지 않았습니다. 만일 그가 합당했다면, 죽음을 맛보지 않았을 것입니다.」[a]
