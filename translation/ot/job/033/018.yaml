  from: He spares his soul from the pit[c][b][a], and his life from passing by the weapon.
  to: He keeps his soul from the pit[a], and his life from perishing by the weapon.[b]
  rationale: “Passing by the weapon” is misleadingly literal and does not communicate the lethal outcome indicated by the context and parallelism with the pit. “Keeps ... from” well conveys the prevention sense of the Hiphil, while “perishing by the weapon” naturally renders the idiomatic force without false precision about the weapon.
