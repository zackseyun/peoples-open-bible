  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: ko
  text: 그가 그의 병거들의 바퀴를 빼시고, 병거들이 힘겹게 움직이게 하셨습니다. 그러자 이집트가 말했습니다. “이스라엘 앞에서 달아나자. 야훼께서 이집트를 상대로 그들을 위해 싸우신다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹפַן מַרְכְּבֹתָיו
  english_pob_choice: the wheels from his chariots
  chosen_korean: 자기 병거들의 바퀴
  alternatives_korean:
  - 그의 병거의 바퀴
  - 전차들의 바퀴
  lexicon: אֹפַן
  rationale: 핵심 명사 오판은 ‘바퀴’로 직접 옮기고, 영어 POB의 his chariots를 따라 소유 관계를 자연스럽게 반영했습니다.
- source_word: בִּכְבֵדֻת
  english_pob_choice: with difficulty
  chosen_korean: 무겁게
  alternatives_korean:
  - 어렵게
  - 힘겹게
  lexicon: כבד
  rationale: 직역상 ‘무겁게’가 원문의 무거움/둔중함을 가장 직접적으로 드러내며, ‘어렵게’보다 수레가 실제로 무거워진 상태를 잘 살립니다.
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  lexicon: מִצְרַיִם
  rationale: 지명은 현대 한국어 가독성을 위해 ‘이집트’로 옮겼고, 본문 후반의 민족/국가 주체도 동일하게 유지했습니다.
- source_word: נִלְחָם
  english_pob_choice: is fighting
  chosen_korean: 싸우고 계신다
  alternatives_korean:
  - 싸우신다
  - 전쟁하고 계신다
  lexicon: לחם
  rationale: 현재 진행형의 동작을 살리되, 야훼에 대한 직접 화법이므로 존대 종결을 사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 원문 신명사 הוה를 학술적 음역인 ‘야훼’로 표기해 원천 텍스트와의 대응을 분명히 했습니다.
  doctrine_reference: YHWH transliteration policy
- issue: 말하는 주체 ‘Egypt’의 처리
  chosen_reading: 이집트가 말했습니다
  alternative_readings:
  - 애굽이 말했습니다
  - 이집트 사람들이 말했습니다
  rationale: 히브리어는 집합명사 ‘미츠라임’이 주어이므로, 한국어에서는 국가/집단의 의인화된 발화를 자연스럽게 살려 옮겼습니다.
  doctrine_reference: collective singular usage
