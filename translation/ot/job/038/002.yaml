id: JOB.38.2
reference: Job 38:2
source:
  edition: WLC
  text: מִ֤י זֶ֨ה מַחְשִׁ֖יךְ עֵצָ֥ה בְ/מִלִּ֗ין בְּֽלִי דָֽעַת׀־׃
translation:
  text: Who is this who obscures my purpose[a] with words without knowledge?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “darkens counsel”; “counsel” here includes wise planning and purpose.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  chosen: Who is this
  alternatives:
  - Who is this one
  - Who is he, this one
  lexicon: HALOT
  rationale: The interrogative מִי with demonstrative זֶה forms an emphatic challenge. 'Who is this' is natural English and preserves the confrontational force.
- source_word: מַחְשִׁיךְ
  chosen: darkens
  alternatives:
  - obscures
  - makes dark
  lexicon: HALOT
  rationale: From חשׁך, 'to darken.' 'Darkens' preserves the metaphor of making something unclear rather than replacing it with a more interpretive gloss like 'confuses.'
- source_word: עֵצָה
  chosen: counsel
  alternatives:
  - plan
  - purpose
  lexicon: HALOT
  rationale: עֵצָה can mean counsel, plan, or purpose. 'Counsel' fits the idiom well in Job and preserves the sense of wise deliberation or divine purpose without over-specifying.
- source_word: בְמִלִּין
  chosen: with words
  alternatives:
  - by words
  - with speech
  lexicon: HALOT
  rationale: 'The preposition ב here is instrumental: the darkening happens by means of words. ''With words'' is idiomatic and sufficiently literal.'
- source_word: בְּלִי דָעַת
  chosen: without knowledge
  alternatives:
  - without understanding
  - ignorantly
  lexicon: HALOT
  rationale: The phrase literally means 'without knowledge.' This preserves the Hebrew wording and avoids collapsing knowledge into a more interpretive adverb.
