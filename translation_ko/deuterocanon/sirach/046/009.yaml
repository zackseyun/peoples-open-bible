base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/009.yaml
  text: And he gave Caleb strength, and it remained with him until old age, so that he went up into the highlands of the land, and his offspring took possession of an inheritance.
translation:
  language: ko
  text: 주님께서는 갈렙에게 힘을 주셨고, 그 힘은 노년에 이를 때까지 그와 함께 있었습니다. 그리하여 갈렙은 그 땅의 높은 곳으로 올라갔고, 그의 자손은 유산을 차지했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제시된 히브리어 본문은 갈렙에게 주어진 힘이 노년에 이를 때까지 그와 함께 있었다고 말합니다. 그리스어 병행본은 주님을 주어로 명시하며, 갈렙이 그 땅의 높은 곳으로 올라가고 그의 자손이 유산을 차지했다는 내용을 덧붙입니다.
    reason: textual_variant
lexical_decisions:
- source_word: חזק / ἰσχύν
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 능력
  - 강함
  - 기력
  lexicon: 한글 일반어휘
  rationale: 여기서는 갈렙에게 주어진 지속적 체력·용맹을 포괄해야 하므로, 과도하게 추상적인 '능력'보다 자연스럽고 직접적인 '힘'이 원문의 의미를 잘 드러냅니다.
- source_word: עד שיבה / ἕως γήρους
  english_pob_choice: until old age
