  lexicon: HALOT
  rationale: 복수형 ‘책망/책망들’의 도구적 뉘앙스를 살리되 한국어로는 자연스럽게 ‘책망으로’가 가장 간결합니다.
- source_word: עַל עָוֺן
  english_pob_choice: for iniquity
  chosen_korean: 죄악 때문에
  alternatives_korean:
