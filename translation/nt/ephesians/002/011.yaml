  meaning_decisions:
  - source_phrase: Διὸ μνημονεύετε ὅτι ποτὲ ὑμεῖς
    prior_rendering: Therefore remember that formerly you
    new_rendering: Therefore, you ... remember your former condition
    rationale: Reordering the command and expressing its anticipated content as 'your former condition' makes the verse readable without bringing the specific circumstances of verse 12 into this verse.
  - source_phrase: τὰ ἔθνη ἐν σαρκί
    prior_rendering: the Gentiles in the flesh
    new_rendering: Gentiles by birth
    rationale: Here flesh identifies bodily or ethnic status, not the sinful orientation described in verse 3; 'by birth' makes that distinction clear.
  - source_phrase: οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς
    prior_rendering: who are called “uncircumcision” by what is called “circumcision”
    new_rendering: called “the uncircumcised” by those called “the circumcised”
    rationale: The abstract terms designate groups of people. Naming the groups directly preserves the repeated 'called' without making Paul's distancing language more sarcastic.
  - source_phrase: ἐν σαρκὶ χειροποιήτου
    prior_rendering: made by hands in the flesh
    new_rendering: whose circumcision is performed on the body by human hands
    rationale: The phrase qualifies circumcision as a physical procedure performed by humans; the revised wording makes both the referent and the bodily action explicit.
