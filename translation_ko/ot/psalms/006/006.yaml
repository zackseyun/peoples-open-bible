  - marker: b
    text: Or 'I have grown weary with my sighing.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 신음으로 지쳤습니다. 밤마다 내 침상을 흠뻑 적시고[a], 내 눈물로 내 잠자리를 젖게 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하여 ‘내 침상을 헤엄치게 한다’입니다. 눈물로 침상을 흠뻑 적신다는 시적 과장입니다.
    reason: lexical_alternative
