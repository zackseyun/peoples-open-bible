  from: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
  to: The man would say to him, “They must burn the fat now; then take whatever you want.” But the servant would reply, “No, you must give it now, or I will take it by force.”
  rationale: The earlier rationale rightly emphasizes the required sacrificial sequence and the servant’s coercive response. I carry the verbal emphasis into the main text and translate the appetite idiom by its contextual meaning rather than retaining “soul.”
