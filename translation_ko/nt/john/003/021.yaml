id: JHN.3.21
reference: John 3:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
  footnotes:
  - marker: a
    text: Or 'practices the truth' or 'does what is true.' The Greek expression is literally 'does the truth.'
    reason: lexical_alternative
  - marker: b
    text: Or 'because they have been done in God.' The conjunction can be taken as introducing either the content of what is revealed or the reason for it.
    reason: alternative_reading
  - marker: c
    text: '''In God'' may also be understood as ''by God'' or ''through God,'' but the Greek wording is left more open.'
    reason: lexical_alternative
  - marker: d
    text: Or 'that they have been done in God'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 진리를 행하는 사람은 자신의 행위들이 하나님 안에서 이루어졌음이 드러나도록 빛으로 나아옵니다[a][d][c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진리를 실천하는 사람’ 또는 ‘참된 것을 행하는 사람’이라고 옮길 수 있습니다. 그리스어 어구는 문자적으로 ‘진리를 행한다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들이 하나님 안에서 이루어졌기 때문에’라고 번역할 수 있습니다. 접속사(ὅτι)는 드러나는 내용의 표시로도, 이유의 표시로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘하나님 안에서’는 ‘하나님에 의해’ 또는 ‘하나님을 통해’로도 이해될 수 있으나, 그리스어 표현은 이러한 의미들 가운데 하나로 한정되지 않습니다.
    reason: lexical_alternative
  - marker: d
    text: 직역에 가깝게는 ‘그의 행위들이 드러나게 하려는 것이니, 그것들이 하나님 안에서 이루어졌기 때문이다’처럼 옮길 수도 있습니다. 이는 이전 번역안에서 사용된 인과적 표현을 설명합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  english_pob_choice: But the one who does the truth
  chosen_korean: 진리를 행하는 자
  alternatives_korean:
  - 진리를 실천하는 사람
  - 참된 것을 행하는 사람
  - 진리를 행하는 이
  lexicon: BDAG
  rationale: 그리스어의 관사화된 현재 분사(ὁ ποιῶν)는 '행하는 사람'으로 사람을 지칭하므로, '진리를 행하는 자'는 원문 구조와 진행적·성격적 의미를 보존합니다. 영어 초안과 마찬가지로 문자적 어구를 유지하여 요한의 신학적 뉘앙스(진리는 행해지는 것임)를 살립니다.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  english_pob_choice: so that his works may be revealed
  chosen_korean: 그의 행위들이 드러나게 하려는 것입니다
  alternatives_korean:
  - 그의 행위들이 드러나게 하기 위함입니다
  - 그의 행위들이 보여지게 하려는 것입니다
  lexicon: BDAG
  rationale: ἵνα + aorist passive subjunctive(φανερωθῇ)의 목적·목적적 뉘앙스를 존중하여 '드러나게 하려는 것입니다'로 번역했습니다. 수동·결과성(드러나 있음의 상태)을 한국어에서 자연스럽게 표현합니다.
- source_word: ἐν θεῷ ἐστιν εἰργασμένα
  english_pob_choice: because they have been done in God
  chosen_korean: 하나님 안에서 행하여졌기 때문입니다
  alternatives_korean:
  - 하나님에 의해 행하여졌기 때문입니다
  - 하나님을 통해 행하여졌기 때문입니다
  - 하나님 안에서 행해진 것임입니다
  lexicon: BDAG
  rationale: ἐν θεῷ의 ἐν을 '안에서'로 옮겨 원문이 열어 둔 신학적 긴장을 보존합니다. 완료성·수동(ἐστιν εἰργασμένα)은 '행하여졌기 때문입니다'로 처리하여 완료된 행위의 결과가 현재 드러난다는 의미를 살렸습니다.
theological_decisions:
- issue: '의미론적 긴장: ποιῶν τὴν ἀλήθειαν(진리를 ''행한다'')이라는 관용'
  chosen_reading: '문자적·의미론적 보존: ''진리를 행하는 자''로 직역'
  alternative_readings:
  - 진리를 실천하는 자
  - 진리에 따라 사는 자
  - 참된 것을 행하는 자
  rationale: 요한서는 '진리'를 인지적 진술을 넘는 실천적·계시적 실재로 다룹니다. 문자적 표현을 유지하면 원문이 제시하는 신학적 긴장을 그대로 전달하여 독자가 해석적 결정을 직접 평가할 수 있게 합니다.
  doctrine_reference: '번역철학: 원어 우선주의와 신학적 긴장 보존'
- issue: '접속사 ὅτι의 기능: 내용표지(‘that’) vs. 이유표지(‘because’)'
  chosen_reading: 행위들이 하나님 안에서 행하여졌으므로(이유) — '… 때문입니다'로 번역
  alternative_readings:
  - …라고(내용) 드러나기 위함이다
  - …로서 드러나기 위함이다
  rationale: 영어 초안의 심사·수정 과정에서 ὅτι를 자연스러운 흐름으로 '이유'로 읽는 편이 명확하다는 판단이 반영되었습니다. 한국어 본문도 이 판정을 따르되, ἐν θεῷ의 열려 있는 신학적 범위('안에서' 등)는 그대로 보존했습니다.
  doctrine_reference: '번역철학: 원문이 남긴 모호성(신적 작용·관계)을 불필요히 좁히지 않음'
