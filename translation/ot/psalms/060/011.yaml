id: PSA.60.11
reference: Psalms 60:11
source:
  edition: WLC
  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָם־׃
translation:
  text: Help us out of our distress[a], for human help cannot save us.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “Help us against the enemy.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָבָה
  chosen: Give
  alternatives:
  - Grant
  - Bring
  lexicon: HALOT
  rationale: Imperative/request form from יהב used idiomatically in prayer as a plea for God to provide. 'Give' is the most direct and natural English equivalent.
- source_word: לָּנוּ
  chosen: us
  rationale: First person common plural indirect object, naturally rendered 'us' with the imperative.
- source_word: עֶזְרַת
  chosen: help
  alternatives:
  - aid
  - assistance
  lexicon: HALOT
  rationale: Construct form meaning 'help' or 'aid.' 'Help' is the most idiomatic and suitably weighty in a prayer context.
- source_word: מִצָּר
  chosen: from distress
  alternatives:
  - from distress
  - from trouble
  - from the foe
  lexicon: HALOT
  rationale: Preserves the common impersonal sense and avoids selecting the personal sense; the viable alternative is noted.
- source_word: וְשָׁוְא
  chosen: is futile
  alternatives:
  - and ... is emptiness
  - and ... is futile
  lexicon: HALOT
  rationale: Accurately conveys emptiness or futility in idiomatic English.
- source_word: תְּשׁוּעַת
  chosen: the salvation
  alternatives:
  - deliverance
  - victory
  lexicon: HALOT
  rationale: The noun can mean salvation, deliverance, or victory. 'Salvation' preserves the lexical connection while still fitting a context of rescue in battle; alternatives are viable and worth preserving.
- source_word: אָדָם
  chosen: man
  alternatives:
  - humankind
  - mankind
  - humanity
  lexicon: HALOT
  rationale: Here אָדָם refers generically to human beings as contrasted with divine help. Per doctrine, gender-accurate rendering is preferred; 'man' is acceptable for representative humanity in this poetic register, while inclusive alternatives are preserved in a footnote.
- source_word: תְּשׁוּעַת אָדָם
  chosen: human deliverance
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English for generic human rescue/deliverance in contrast with divine aid.
