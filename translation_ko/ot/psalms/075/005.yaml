  - 힘
  - 자존심
  lexicon: HALOT
  rationale: 시편의 관용적 은유를 본문에서 그대로 유지하여, 힘·지위·자기 과시를 암시하는 이미지를 보존했습니다.
theological_decisions:
- issue: ‘horn’의 은유를 본문에서 유지할지 여부
  chosen_reading: 본문에서는 ‘뿔’을 그대로 두고, 해석을 열어 둡니다.
  alternative_readings:
  - 권세를 높이지 말라
  - 자존심을 높이지 말라
