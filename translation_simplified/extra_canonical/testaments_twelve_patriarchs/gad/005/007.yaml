translation:
  language: en
  text: True repentance[b]—the kind God desires—drives away darkness.[a] It brings light to the eyes, gives knowledge to the soul, and leads the mind toward salvation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek edition marks “removes ignorance and” as uncertain before “drives away darkness.”
    reason: textual_variant
  - marker: b
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims.
    reason: lexical_alternative
