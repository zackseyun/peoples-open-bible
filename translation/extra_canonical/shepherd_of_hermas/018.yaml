translation:
  text: 'X.1. When she had ceased speaking with me, the six young men who were building came and carried
    her to the tower. Four others lifted the cushioned seat and carried it also to the tower. I did not
    see their faces, because they were turned away[a].


    X.2. As she was going, I asked her to reveal to me about the three forms in which she had appeared
    to me. She answered me and said, “About these, you must ask another, so that it may be revealed to
    you[b].”


    X.3. She appeared to me, brothers, in the first vision—the one last year—very aged and sitting on
    a chair.


    X.4. In the second vision her appearance was younger, but her flesh and her hair were older. As she
    stood she spoke to me, and she was more cheerful than before.


    X.5. In the third vision she was wholly younger and most distinguished in beauty; only her hair was
    older. She was exceedingly cheerful and was seated on a cushioned seat.


    X.6. I was very much distressed about these things, wanting to know this revelation. I see the aged
    woman in a vision of the night, saying to me, “Every inquiry has need of humility; therefore fast,
    and you will receive what you ask from the Lord[c].”


    X.7. So I fasted one day, and on that very night a young man appeared to me and said to me, “Since
    you are continually asking for revelations in prayer, watch lest by asking for many things you harm
    your flesh[d].


    X.8. These revelations are sufficient for you. Surely you cannot see revelations more powerful than
    those you have seen[e]?”


    X.9. I answered him and said, “Sir, this only I ask—that concerning the three forms of the aged woman
    the revelation may become complete[f].” He answered me and said, “How long will you be senseless?
    Rather, your double-mindedness makes you senseless, and so does not having your heart toward the Lord[g].”


    X.10. Answering him again, I said, “But from you, sir, we shall learn these things more precisely.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The source-page boundary falls within to the tower; physical328prints pyrgon, correcting the
      raw OCR pyrgou without selecting a different manuscript reading. Sinaiticus18.1 first-hand has a
      dotted with us wording, S1 with me. AthosPlateIIIline56has a shorter they lifted account and four
      others without an explicit count noun; the complete working six-plus-four scene is retained. Palatina55prints
      they took her in it with an additional tower clause its apparatus identifies as in the codex but
      omitted by Dressel. Vulgata26prints to the tower as an editorial correction against its reported
      Latin codices from the tower. A cushioned seat renders sympselion; chair in3remains a different
      word.
  - marker: b
    reason: textual_variant
    text: Ask another is in the working Greek, Sinaiticus18.2 and AthosPlateIIIline58. Vulgata27also has
      alium; Palatina55instead has you must ask me later. That difference is disclosed without conflating
      the figures. Sinaiticus18.3 brothers is an S1/ca correction to first-hand adelphe;18.4first-hand
      has face where the working text says before. The three distinct appearances, postures and hair/flesh
      contrasts remain. Working eis telos in5is intensive (exceedingly/completely cheerful); the older
      temporal to-the-end reading is archived.
  - marker: c
    reason: textual_variant
    text: Fast in X.6 is the working Greek, AthosPlateIIIline63, Sinaiticus18.6 and Vulgata27. Palatina55instead
      reads believe (crede), although it still narrates the one-day fast in7. Sinaiticus has repeated/difficult
      every/inquiry wording corrected S1/ca; do not flatten these into several independent witnesses.
      The promise of receiving what is requested remains, without adding a universal rule about fasting.
  - marker: d
    reason: lexical_alternative
    text: Continually asking renders the difficult idiom hypo cheira; at hand/readily or on demand are
      alternatives. Vulgata27interprets frequenter; Palatina55has sub manu, preserving the hand idiom,
      and AthosPlateIIIline64has hypo cheiras in a question. The working Since construction is retained,
      as is the bodily harm warning. The old English left the idiom unrepresented. No specific medical
      mechanism is supplied.
  - marker: e
    reason: textual_variant
    text: These revelations are sufficient is present in the working Greek, AthosPlateIIIline65and both
      Latin versions. In Sinaiticus18.8it is a ca-corrector addition to an empty first-hand reading; it
      must not be cited as intact first-hand text. The meti stronger-revelations question expects a negative
      answer, now explicit as Surely you cannot, and remains a question; Palatina55paraphrases do not
      think you can see stronger ones.
  - marker: f
    reason: lexical_alternative
    text: Sir in X.9and10renders kyrie as respectful address to the young man. The older record defaulted
      to Lord; its full wording and adjudications are archived. Neither the vocative nor the Latin domine
      by itself identifies this young man as God. Lord remains for the divine referent in6and9. The request
      is specifically a complete revelation about the three forms, not an unrestricted demand.
  - marker: g
    reason: textual_variant
    text: The rebuke in X.9changes from the singular questioner to plural you in Greek; English you retains
      that number ambiguity and the note makes the shift explicit. Double-mindedness represents plural
      dipsychiai, not a psychiatric diagnosis. Both the doubts and the heart’s failure to turn toward
      the Lord are causes of senselessness. Vulgata28instead begins you are not senseless, but your doubts
      make you senseless; Palatina57and the Greek have how long. The working rebuke is retained.
