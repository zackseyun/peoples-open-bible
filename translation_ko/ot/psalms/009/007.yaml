  rationale: 히브리어는 호격적으로도 읽힐 수 있지만, 뒤의 동사 흐름과 심판 선언의 진행을 따라 서술문이 더 자연스럽습니다. 이는 신학적 차이라기보다 통사 선택입니다.
  doctrine_reference: 시 9편의 심판 선언 구조
