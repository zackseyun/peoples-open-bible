  lexicon: HALOT
  rationale: 히트파엘의 ‘뒤틀린 방식으로 대응하다’는 의미를 직역에 가깝게 살리되, 하나님께 도덕적 비틀림을 돌리지 않도록 ‘비틀어지십니다’로 절제했습니다.
theological_decisions:
- issue: 하나님이 ‘비틀어지신다’는 표현의 신학적 긴장
  chosen_reading: 주께서 악한 자에게 그들의 굽음에 상응하는 방식으로 응답하신다는 시적 대응으로 보되, 본문 표현 자체는 약화하지 않았습니다.
  alternative_readings:
  - 주께서도 교묘하게 대하십니다
  - 주께서도 그들을 속이십니다
  rationale: 히브리어의 대구와 반향어법을 유지하는 것이 핵심이므로, 의미를 설명적으로 풀어버리기보다 본문 표현을 살리고 오해 가능성은 주석에 맡기는 편이 원문에 충실합니다.
  doctrine_reference: 시적 인격화와 의로운 응답의 대응 관계
