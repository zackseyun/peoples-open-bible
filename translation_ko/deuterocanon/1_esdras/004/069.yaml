  source_fidelity: 핵심 동작과 관직 목록, 예루살렘 재건 목적은 대체로 충실합니다. 그러나 마지막 목적절의 ‘그와 함께 … 모든 사람과 함께 그들을’은 목적어가 중복되고, 원문의 ‘그와 그와 함께 올라가는 모든 사람’을 정확하고 명료하게 전달하지 못합니다.
  naturalness: ‘그와 함께 … 모든 사람과 함께 그들을 길에 오르게’는 현대 표준 한국어 문장으로 어색하며 지시 대상도 혼동됩니다. ‘그와 함께 … 모든 사람을 떠나보내도록’으로 정리하는 것이 자연스럽습니다.
