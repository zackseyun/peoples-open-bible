  yaml_path: translation/deuterocanon/3_maccabees/002/033.yaml
  text: And they remained hopeful of obtaining help, and they loathed those who were withdrawing from among them, and judged them as enemies of the nation, and deprived them of common association and support.
translation:
  language: ko
  text: 그들은 도움을 얻을 수 있으리라는 희망을 품고 있었으며, 자기들 가운데서 떠나가는 이들을 혐오하고 그들을 민족의 원수로 판단했으며, 공동의 교제와 지원을 빼앗았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐέλπιδές τε καθιστήκεισαν ἀντιλήμψεως τεύξασθαι
  english_pob_choice: remained hopeful of obtaining help
  chosen_korean: 도움을 얻을 수 있으리라 기대하며 계속 희망을 품었고
  alternatives_korean:
  - 도움을 얻기를 바라는 마음을 계속 품었고
  - 도움을 받을 수 있으리라 낙관하며
  lexicon: ἐλπίζω/εὔελπις → 희망을 품다; ἀντίλημψις → 도움, 원조
  rationale: εὐέλπιδες는 단순한 ‘기대’보다 ‘희망을 품은 상태’가 자연스럽고, τεύξασθαι ἀντιλήμψεως는 ‘도움을 얻다/받다’로 옮겨 결과를 분명히 했습니다.
- source_word: τοὺς ἀποχωροῦντας ἐξ αὐτῶν
  english_pob_choice: those who were withdrawing from among them
  chosen_korean: 자기들 가운데서 떠나가는 이들
  alternatives_korean:
  - 그들 가운데서 물러나는 이들
  - 그들로부터 떠나가는 자들
  lexicon: ἀποχωρέω → 떠나가다, 물러나다
  rationale: 공동체 내부에서 ‘떠나가는’ 동작을 드러내되, 한국어에서 자연스러운 현재분사 표현으로 다듬었습니다.
- source_word: ἐβδελύσσοντο / ὡς πολεμίους τοῦ ἔθνους ἔκρινον
  english_pob_choice: they loathed ... and judged them as enemies of the nation
  chosen_korean: 혐오하며, 그들을 민족의 원수로 판단하고
  alternatives_korean:
  - 가증히 여기며, 그들을 민족의 적으로 여겨
  - 역겨워하며, 그들을 나라의 원수로 판정하고
  lexicon: βδελύσσομαι → 혐오하다; κρίνω → 판단하다
  rationale: ἐβδελύσσοντο의 강한 혐오감을 ‘혐오하다’로 보존하고, ὡς πολεμίους τοῦ ἔθνους는 ‘민족의 원수’로 간결하게 살렸습니다.
- source_word: τῆς κοινῆς συναναστροφῆς καὶ εὐχρηστίας ἐστέρουν
  english_pob_choice: deprived them of common association and support
  chosen_korean: 공동의 교제와 지원에서 그들을 배제했습니다
  alternatives_korean:
  - 공동의 교제와 도움을 빼앗았습니다
  - 함께 어울림과 도움의 혜택에서 제외했습니다
  lexicon: συναναστροφή → 교제, 함께 지냄; εὐχρηστία → 유용함, 도움, 편의
  rationale: POB의 ‘support’를 한국어로 너무 추상화하지 않도록 ‘지원’으로 옮기되, συναναστροφή는 공동체적 관계를 드러내는 ‘교제’로 처리했습니다.
theological_decisions:
- issue: 공동체 제재의 성격
  chosen_reading: 이 절은 개인적 감정이 아니라 집단적 배제와 적대의 진행을 묘사하는 문장으로 읽었습니다.
  alternative_readings:
  - 단순한 사회적 거리두기
  - 종교적 정결 조치
  rationale: ‘민족의 원수’ 판단과 ‘공동의 교제와 지원에서의 배제’가 결합되어 있어, 단순 감정이 아니라 공동체적 차원의 적대 행위로 나타납니다.
  doctrine_reference: 서술 맥락 해석
