id: 1CLEM.8.5
reference: 1 Clement 8:5
unit: verse
book: 1 Clement
source:
  edition: Funk 1901 (normalized OCR)
  text: πάντας οὖν τοὺς ἀγαπητοὺς αὐτοῦ βουλόμενος μετανοίας μετασχεῖν ἐστήριξεν τῷ παντοκρατορικῷ βουλήματι αὐτοῦ.
  language: Greek
translation:
  text: Therefore[a], desiring all his beloved ones to share in reorientation[r1], he established it by his almighty will.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'established it'.
    reason: previous_rendering
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
