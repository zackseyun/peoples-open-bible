id: ISA.11.10
reference: Isaiah 11:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא שֹׁ֣רֶשׁ יִשַׁ֗י אֲשֶׁ֤ר עֹמֵד֙ לְ/נֵ֣ס עַמִּ֔ים אֵלָ֖י/ו גּוֹיִ֣ם יִדְרֹ֑שׁוּ וְ/הָיְתָ֥ה מְנֻחָת֖/וֹ כָּבֽוֹד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/010.yaml
  text: And in that day the root of Jesse, who stands as a banner for the peoples—to him the nations will seek, and his resting place will be glory.
translation:
  language: ko
  text: 그날에 이새의 뿌리가 만민을 위한 깃발로 서고,[a] 민족들이 그에게 나아가 찾을 것이며,[b] 그의 안식처는 영광이 될 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깃발’은 히브리어 נֵס의 표지·집결 신호 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘민족들’은 히브리어 גּוֹיִם의 보편적 대상을 가리킵니다.
    reason: source_note
  - marker: c
    text: ‘영광’은 히브리어 כָּבוֹד의 명사형을 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: שֹׁרֶשׁ יִשַׁי
  english_pob_choice: the root of Jesse
  chosen_korean: 이새의 뿌리
  alternatives_korean:
  - 이새의 근원
  - 이새의 뿌리줄기
  lexicon: root
  rationale: 히브리어 שֹׁרֶשׁ는 혈통적 기원을 가리키는 ‘뿌리’가 가장 자연스럽고, 메시아적 계보를 보존합니다.
- source_word: לְנֵס עַמִּים
  english_pob_choice: as a banner for the peoples
  chosen_korean: 만민의 깃발로
  alternatives_korean:
  - 백성들의 기치로
  - 민족들의 깃발로
  lexicon: banner
  rationale: נֵס는 전투·집합의 표지인 ‘깃발/기치’를 뜻하므로, 추상화하지 않고 표지 기능을 살려 옮겼습니다.
- source_word: גּוֹיִם יִדְרֹשׁוּ
  english_pob_choice: to him the nations will seek
  chosen_korean: 민족들이 그에게 나아가 찾을 것이며
  alternatives_korean:
  - 민족들이 그를 찾을 것이며
  - 열국이 그를 찾을 것이며
  lexicon: seek
  rationale: דרשׁ는 단순한 탐색보다 ‘찾아 나아가다/구하다’의 뉘앙스가 있어, 대상에게 향하는 동적 움직임을 드러냈습니다.
- source_word: מְנֻחָת/וֹ כָּבוֹד
  english_pob_choice: his resting place will be glory
  chosen_korean: 그의 안식처는 영광이 될 것입니다
  alternatives_korean:
  - 그의 안식은 영광이 될 것입니다
  - 그가 쉬는 곳은 영광이 될 것입니다
  lexicon: resting place
  rationale: מְנוּחָה는 ‘휴식/안식/머무는 자리’의 뜻을 함께 가지므로, 장소적 의미를 살린 ‘안식처’로 옮겼습니다.
theological_decisions:
- issue: 메시아적 표상으로서의 ‘이새의 뿌리’와 ‘만민의 깃발’
  chosen_reading: 이 구절은 이새의 뿌리라는 계보적 표현과 만민을 끌어모으는 깃발 이미지를 통해, 다스리시는 분이 열방의 중심 표지가 되심을 드러냅니다.
  alternative_readings:
  - 단순한 왕권 상징으로만 읽는 해석
  - 이스라엘 내부 회복에만 한정하는 해석
  rationale: 본문의 ‘만민’과 ‘민족들’은 범위를 이스라엘 내부로 제한하지 않으며, POB의 영어도 이 보편적 확장을 유지합니다.
  doctrine_reference: 메시아와 열방
- issue: מְנֻחָה의 ‘영광’ 대응
  chosen_reading: ‘그의 안식처는 영광이 될 것입니다’로 두어, מקום/상태의 복합 의미를 유지하면서 결과 상태를 ‘영광’으로 마무리합니다.
  alternative_readings:
  - ‘그의 안식은 영광이 될 것입니다’처럼 상태 중심으로만 옮기는 해석
  - ‘그의 거처는 영화로울 것입니다’처럼 형용사화하는 해석
  rationale: 영어 POB가 형용사화를 버리고 명사 ‘glory’를 택한 수정 이력을 반영해, 히브리어의 명사적 결말을 살렸습니다.
  doctrine_reference: 본문어휘 보존
