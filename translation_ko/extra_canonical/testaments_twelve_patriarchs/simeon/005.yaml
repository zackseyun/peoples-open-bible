base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005.yaml
  text: 'Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.


    And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will be finding favor before the Lord and men.


    Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.


    For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.


    But they will not be able to stand against Levi, because he will fight the Lord’s war and will defeat your whole host.


    And they will be few in number, being divided in Levi and in Judah, and none from among you will be for leadership, just as our father also prophesied in his blessings.'
translation:
  language: ko
  text: '그러므로 요셉은 용모가 빼어났고 보기에 아름다웠습니다. 이는 그 안에 악한 것이 아무것도 머물지 않았기 때문입니다. 얼굴은 영의 혼란을 드러내기 때문입니다.


    이제 나의 자녀들아, 주 앞에서 너희 마음을 선하게 하고, 사람들 앞에서 너희 길을 곧게 하십시오. 그러면 너희는 주와 사람들 앞에서 은혜를 얻게 될 것입니다.


    그러므로 성적 부도덕을 멀리하십시오. 성적 부도덕은 온갖 악의 어머니이며, 하나님에게서 멀어지게 하고 벨리아르에게 가까이 가게 합니다.


    내가 에녹의 기록에서 보니, 너희 아들들은 성적 부도덕 가운데서 멸망할 것이며, 칼로 레위의 아들들에게 불의를 행할 것입니다.


    그러나 그들은 레위에게 맞서지 못할 것입니다. 그가 주의 전쟁을 치르고 너희의 모든 진영을 이길 것이기 때문입니다.


    그들은 수가 적어 레위와 유다 안에서 나뉘어 있을 것이며, 너희 가운데서는 아무도 지도자가 되지 못할 것입니다. 우리 아버지께서도 자신의 축복들 가운데서 그렇게 예언하셨기 때문입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει / καλὸς τῇ ὄψει
  english_pob_choice: handsome in form / beautiful in appearance
  chosen_korean: 외모가 아름답고 모습이 아름다웠습니다
  alternatives_korean:
  - 용모가 훌륭하고 보기에 아름다웠습니다
  - 외형이 아름답고 보기에도 아름다웠습니다
  lexicon: ὡραῖος, εἶδος, ὄψις
  rationale: 두 개의 병렬 표현을 모두 살려, 요셉의 외적 아름다움과 시각적 인상을 중복 없이 전달했습니다.
- source_word: ἐν αὐτῷ οὐδὲν πονηρόν / τὸ πρόσωπον δηλοῖ τὴν ταραχὴν τοῦ πνεύματος
  english_pob_choice: nothing evil dwelt in him; for the face reveals the turmoil of the spirit
  chosen_korean: 그 안에 악한 것이 아무것도 머물지 않았기 때문입니다. 곧 얼굴은 영의 혼란을 드러냅니다
  alternatives_korean:
  - 그 안에 악한 것이 전혀 없었기 때문입니다. 얼굴은 영의 동요를 드러냅니다
  - 악한 것은 그 안에 거하지 않았기 때문입니다. 얼굴은 영의 불안을 나타냅니다
  lexicon: ἐνοικέω, πονηρός, πρόσωπον, ταραχή, πνεῦμα
  rationale: ‘머물지 않았습니다’로 내주/거주의 부정을 살리고, πρόσωπον과 πνεῦμα의 상관을 직역에 가깝게 옮겼습니다.
- source_word: Ἀγαθύνατε / εὐθύνατε / εὑρίσκοντες χάριν
  english_pob_choice: make your hearts good / make your ways straight / finding favor
  chosen_korean: 너희 마음을 선하게 하고, 너희 길을 곧게 하십시오. 그러면 너희는 은혜를 얻게 될 것입니다
  alternatives_korean:
  - 너희 마음을 좋게 하고, 너희 길을 바르게 하십시오. 그러면 은혜를 찾게 될 것입니다
  - 마음을 선하게 만들고 길을 곧게 하십시오. 그러면 은혜를 발견할 것입니다
  lexicon: ἀγαθύνω, εὐθύνω, χάρις
  rationale: 명령형의 도덕적 수정을 자연스럽게 풀어 쓰고, POB의 'favor'에 해당하는 χάριν은 문맥상 ‘은혜’로 옮겼습니다.
- source_word: πορνεία
  english_pob_choice: sexual immorality
  chosen_korean: 성적 부도덕
  alternatives_korean:
  - 음행
  - 성적 음란
  lexicon: πορνεία
  rationale: 본문의 윤리적 금지 범위를 드러내면서도 현대 한국어에서 과도하게 협소하거나 교회식으로 굳은 표현을 피했습니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리알
  alternatives_korean:
  - 벨리아르
  - 벨리아르
  lexicon: Βελίαρ
  rationale: 고유명사를 음역하되, 한국어 성경 독자에게 익숙한 형태로 표기했습니다.
theological_decisions:
- issue: ἐνώπιον Κυρίου의 번역과 경어 처리
  chosen_reading: 주 앞에서
  alternative_readings:
  - 주님 앞에서
  - 야훼 앞에서
  rationale: 직설 인용이 아닌 권면 문맥이므로 합쇼체 명령과 자연스럽게 맞는 ‘주’로 두었고, 이 본문은 YHWH 직인용 표지로 보기 어려워 야훼 치환은 하지 않았습니다.
  doctrine_reference: POB divine-name policy; quotation/allusion discipline
- issue: 영(πνεῦμα)의 번역
  chosen_reading: 영의 혼란
  alternative_readings:
  - 성령의 혼란
  - 마음의 혼란
  rationale: 문맥상 개인 내부의 영/기운을 가리키므로 ‘성령’으로 올리지 않고, 심리화도 지나치지 않게 ‘영’을 유지했습니다.
  doctrine_reference: πνεῦμα context sensitivity
