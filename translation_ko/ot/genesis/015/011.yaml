  text: And the birds of prey came down on the carcasses[a], and Abram drove them away.
  footnotes:
  - marker: a
    text: 'Or ''the bird of prey came down on the carcasses.'' The Hebrew noun can be read as a singular collective, but the sense is likely collective here: scavenging birds.'
