  text: And coming forward, she showed them the head from the bag and said to them, “Look, the head of Holofernes, the commander-in-chief of the army of Asshur; and look, the canopy under which he was lying in his drunkenness. And the Lord struck him down by the hand of a woman.”
translation:
  language: ko
  text: 그리고 앞으로 나와서 자루에서 머리를 꺼내 그들에게 보여 주고 말했습니다. 「보십시오, 아수르 군대의 최고 사령관 홀로페르네스의 머리입니다. 그리고 보십시오, 그가 술에 취한 채 누워 있던 차양입니다. 주께서 한 여자의 손으로 그를 치셨습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προελθοῦσα
  english_pob_choice: And coming forward
  chosen_korean: 앞으로 나와서
  alternatives_korean:
  - 나서서
  - 앞으로 나가
  lexicon: proelthousa
  rationale: 행동의 진행성과 공개적 등장감을 살리기 위해 ‘앞으로 나와서’를 택했습니다.
- source_word: τὴν κεφαλὴν ἐκ τῆς πήρας
  english_pob_choice: the head from the bag
  chosen_korean: 자루에서 머리를
  alternatives_korean:
  - 가방에서 머리를
  - 주머니에서 머리를
  lexicon: kephalē / pēra
  rationale: πήρα를 문맥상 ‘자루’로 옮겨 현대적이되 원문의 소박한 도구 이미지를 유지했습니다.
- source_word: ἀρχιστρατήγου δυνάμεως Ἀσσούρ
  english_pob_choice: the commander-in-chief of the army of Asshur
  chosen_korean: 아수르 군대의 최고 사령관
  alternatives_korean:
  - 아수르 군대의 총사령관
  - 앗수르 군대의 최고 지휘관
  lexicon: archistratēgos / dynamis
  rationale: ἀρχιστρατήγου의 위계적 뉘앙스를 ‘최고 사령관’으로 살리고, δυνάμεως는 군사적 실체를 드러내는 ‘군대’로 옮겼습니다.
- source_word: τὸ κωνώπιον
  english_pob_choice: the canopy
  chosen_korean: 차양
  alternatives_korean:
  - 휘장
  - 캐노피
  lexicon: kōnōpion
  rationale: 문맥상 침상 위 덮개/천막을 가리키므로 교회적 관용어 ‘휘장’보다 중립적인 ‘차양’을 택했습니다.
- source_word: ἐν χειρὶ θηλείας
  english_pob_choice: by the hand of a woman
  chosen_korean: 한 여자의 손을 통해
  alternatives_korean:
  - 여자의 손으로
  - 한 여인의 손으로
  lexicon: cheir / thēleia
  rationale: 원인·도구성을 드러내면서도 ‘여자’라는 성별 대비를 분명히 하기 위해 ‘통해’를 넣었습니다.
theological_decisions:
- issue: 주체가 하나님/주로 표기되는 절정 선언의 번역
  chosen_reading: ‘주께서 한 여자의 손을 통해 그를 치셨습니다’로 옮겨, 인간 행위 뒤에 있는 하나님의 주권적 행위를 분명히 했습니다.
  alternative_readings:
  - ‘주께서 그를 여자 손으로 치셨습니다’
  - ‘주님이 여자 손으로 그를 쓰러뜨리셨습니다’
  rationale: 헬라어의 ἐπάταξεν αὐτὸν ὁ κύριος는 직접적 신적 행위 진술이므로, 주어를 흐리지 않고 ‘치셨습니다’로 보존했습니다.
  doctrine_reference: 하나님의 주권과 섭리
- issue: ‘술에 취해 누워 있던’의 상태 묘사
  chosen_reading: ‘술에 취해 누워 있던’으로 직역에 가깝게 유지해, 조롱과 수치의 서술 효과를 보존했습니다.
  alternative_readings:
  - ‘취한 채 누워 있던’
  - ‘술취한 상태로 누워 있던’
  rationale: ἐν ταῖς μέθαις αὐτοῦ는 단순한 상태표현이므로 과도한 해설 없이 문맥의 모욕적 뉘앙스를 살렸습니다.
  doctrine_reference: 서사적 사실 진술
