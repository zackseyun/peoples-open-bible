  from: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
  to: You will be driven away from human society and will live with the beasts of the field. You will be made to eat grass like oxen, and you will remain in this condition for seven periods of time[a], until you acknowledge that the Most High rules over the kingdom of mankind and gives it to whomever he wills.”
