translation:
  language: ko
  text: 주의 맹렬한 진노가 내 위를 휩쓸고[a][b], 주의 공포가 나를 멸절시켰습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 위로 지나갔고’. 히브리어 동사는 문자적으로 ‘지나갔다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘주의 불타는 진노’. 전통적으로는 ‘주의 진노’로도 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나를 끊어 버렸습니다’.
