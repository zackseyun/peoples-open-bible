  from: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
  to: Then God said, “Let us make humankind in our image, according to our likeness, and let them rule over the fish of the sea, the birds of the sky, the livestock, all the earth, and every small creature that moves along the ground.”
  rationale: The earlier rationale acknowledges that adam denotes humanity collectively but preferred “man” to preserve the grammatical form; the present meaning-first aim favors making that collective reference explicit. I retain the unexplained plural divine speech, image and likeness, and the full scope of rule without importing the interpretations listed in the former notes.
