id: PSA.5.3
reference: Psalms 5:3
source:
  edition: WLC
  text: יְֽהוָ֗ה בֹּ֭קֶר תִּשְׁמַ֣ע קוֹלִ֑/י בֹּ֥קֶר אֶֽעֱרָךְ לְ֝/ךָ֗ וַ/אֲצַפֶּֽה־׃
translation:
  text: Yahweh, in the morning you hear my voice; in the morning I lay my prayer before you[a] and watch expectantly.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “I arrange for you”; the object is unstated, but the context suggests his prayer.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: בֹּקֶר
  chosen: in the morning
  alternatives:
  - morning
  - at morning
  lexicon: HALOT
  rationale: Temporal noun used adverbially. 'In the morning' is natural modern English and preserves the repeated emphasis by rendering both occurrences explicitly.
- source_word: תִּשְׁמַע
  chosen: you hear
  alternatives:
  - you will hear
  - you listen to
  lexicon: HALOT
  rationale: Qal imperfect 2ms of שׁמע can be future or habitual/presentive in poetic prayer. 'You hear' fits the psalm's confident address without overemphasizing futurity; English present also conveys assured expectation.
- source_word: קוֹלִי
  chosen: my voice
  alternatives:
  - my sound
  - my cry
  lexicon: HALOT
  rationale: קוֹל commonly means 'voice' here in prayer context. 'My cry' is interpretive and stronger than the Hebrew requires; 'my voice' is the more direct rendering.
- source_word: אֶעֱרָךְ
  chosen: I lay my request before you
  alternatives:
  - I arrange before you
  - I set in order before you
  - I prepare for you
  lexicon: HALOT
  rationale: ערך in the Qal can mean 'arrange, set in order.' In prayer context, the object is implicit, likely the psalmist's prayer or case. 'I lay my request before you' makes the idiom intelligible in English while preserving the sense of ordered presentation before God.
- source_word: לְךָ
  chosen: before you
  alternatives:
  - to you
  - for you
  lexicon: HALOT
  rationale: Although the preposition is formally 'to/for you,' with ערך in this context English idiom is best expressed as 'before you,' conveying presentation in God's presence.
- source_word: וַאֲצַפֶּה
  chosen: and watch expectantly
  alternatives:
  - and I watch
  - and I wait expectantly
  - and I keep watch
  lexicon: HALOT
  rationale: צפה can denote watching, looking out, or waiting expectantly. In this prayer setting the sense is not mere visual watching but hopeful expectation after presenting prayer. 'Watch expectantly' preserves both the literal and anticipatory nuance.
- source_word: אֶעֱרָךְ לְךָ
  chosen: I lay my prayer before you
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The verb means arrange or set in order, with an implicit object supplied by the prayer context.
