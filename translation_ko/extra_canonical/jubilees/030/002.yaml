  revised_text: 그리고 그곳에서 히위 사람 하몰의 아들이며 그 땅의 통치자인 세겜이 야곱의 딸 디나를 보고, 그녀를 붙잡아 동침하고 더럽혔습니다. 그녀는 어린 소녀였습니다.ᵃ
