  text: 그때 아브넬이 요압에게 말했습니다. “청년들이 일어나 우리 앞에서 겨루게 하십시오.” 요압이 말했습니다. “그들이 일어나게 하십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִישַׂחֲק֖וּ
  english_pob_choice: compete
  chosen_korean: 겨루게 하십시오
  alternatives_korean:
  - 놀게 하십시오
  - 경기하게 하십시오
  - 시합하게 하십시오
  lexicon: 사전 항목 번호를 사용하지 않음
  rationale: 문맥상 단순한 놀이가 아니라 군사적 충돌을 앞둔 대표자들의 대결이므로, English POB의 ‘compete’를 살려 ‘겨루다’로 옮겼습니다.
- source_word: הַנְּעָרִים
  english_pob_choice: the young men
  chosen_korean: 청년들
  alternatives_korean:
  - 젊은이들
  - 소년들
  - 젊은 병사들
  lexicon: 사전 항목 번호를 사용하지 않음
  rationale: 성인 남자들로 보이는 전투 참여자들이므로 ‘소년들’보다 중립적인 ‘청년들’이 원문 범위에 더 잘 맞습니다.
- source_word: לְפָנֵינוּ
  english_pob_choice: before us
  chosen_korean: 우리 앞에서
  alternatives_korean:
  - 우리 앞에
  - 우리 면전에서
  - 우리 앞에서 공개적으로
  lexicon: 사전 항목 번호를 사용하지 않음
  rationale: 대면한 자리에서 벌어지는 행동이라는 공간적 의미를 자연스럽게 살려 ‘우리 앞에서’로 옮겼습니다.
theological_decisions:
- issue: 대결 성격을 어떻게 드러낼 것인가
  chosen_reading: ‘겨루게 하십시오’로 번역해 무해한 놀이가 아니라 대표자들 사이의 실제 대결임을 드러냈습니다.
  alternative_readings:
  - ‘놀게 하십시오’
  - ‘시합하게 하십시오’
  rationale: 히브리어 동사는 문맥에 따라 ‘놀다/희롱하다’로도 갈 수 있지만, 여기서는 뒤이어 벌어지는 전투 문맥상 경쟁적 대결로 읽는 것이 가장 자연스럽습니다.
