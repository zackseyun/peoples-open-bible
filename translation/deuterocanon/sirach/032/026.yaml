translation:
  text: Mercy is beautiful in a time of distress[a], like rain clouds in a time of drought.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “in the time of his distress,” referring to the recipient of mercy, possibly God's people spoken of collectively.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡραῖον
  chosen: beautiful
  alternatives:
  - timely
  - pleasant
  - fitting
  - lovely
  lexicon: LSJ
  rationale: The adjective commonly denotes beauty or attractiveness. In context it praises the value and welcome character of mercy. 'Beautiful' preserves the imagery and evaluative force better than a flatter 'good' or an interpretive 'timely.'
- source_word: ἔλεος
  chosen: mercy
  alternatives:
  - kindness
  - compassion
  lexicon: BDAG/LSJ
  rationale: ἔλεος regularly denotes mercy or compassionate help. 'Mercy' is the most direct and weighty rendering, while still fitting the wisdom context of aid shown to one in need.
- source_word: ἐν καιρῷ
  chosen: in a time of
  alternatives:
  - at the time of
  - when
  lexicon: LSJ
  rationale: The phrase marks a fitting or critical occasion. 'In a time of' is natural English and preserves the temporal emphasis repeated in both halves of the verse.
- source_word: θλίψεως
  chosen: distress
  alternatives:
  - affliction
  - trouble
  - tribulation
  lexicon: BDAG/LSJ
  rationale: θλῖψις can mean pressure, affliction, or distress. In Sirach's wisdom style, 'distress' is accessible modern English and broad enough to cover hardship without importing later technical theological overtones of 'tribulation.'
- source_word: αὐτοῦ
  chosen: his
  alternatives:
  - one's
  - a person's
  lexicon: LSJ
  rationale: The Greek has a masculine singular pronoun. Per gender-accurate policy, 'his' best matches the source form and generic wisdom style, rather than neutralizing it to 'one's' in the main text.
- source_word: νεφέλαι ὑετοῦ
  chosen: rain clouds
  alternatives:
  - clouds of rain
  - rain-bearing clouds
  lexicon: LSJ
  rationale: 'The genitive is descriptive: clouds associated with rain. ''Rain clouds'' is idiomatic English and preserves the image clearly.'
- source_word: ἀβροχίας
  chosen: a time without rain
  alternatives:
  - drought
  - dryness
  lexicon: LSJ
  rationale: The noun denotes lack of rain. 'A time without rain' stays close to the Greek wording and mirrors the repeated ἐν καιρῷ structure; 'drought' is possible but slightly more compressed and interpretive.
