base_translation:
  text: 'VII.1. “As for the other stones that you saw thrown far from the tower and falling into the road
    and rolling from the road into the pathless places[h]: these are those who have believed, but because
    of their double-mindedness[l] they abandon their true road. Thinking, then, that they are able to
    find a better road, they go astray and suffer misery as they walk in the pathless places.”


    VII.2. “But those that fall into the fire and are burned—these are the ones who have finally turned
    away from the living God[m], and it no longer came up into their heart to repent[a] because of the
    cravings of their lewdness[b] and the evils they have done.”


    VII.3. “And those others that fall near the waters yet are not able to roll into the water—do you
    want to know who they are? These are the ones who have heard the word and want to be baptized into
    the name of the Lord[j]; then, when the purity of the truth[c] comes to their remembrance, they change
    their mind[d] and go back again after their evil desires.”


    VII.4. So she finished the explanation of the tower.


    VII.5. But, plucking up my courage[n] again, I questioned her further whether all these stones that
    were cast away and did not fit into the building of the tower—whether there is repentance[k] for them
    and whether they have a place in this tower. “They have repentance,” she says, “but they cannot fit
    into this tower[o].”


    VII.6. “Rather, they will fit in another place, much smaller[e]; and this will be when they have been
    tormented[p] and have completed the days of their sins[i]. And for this reason they will be transferred[q],
    because they have shared in the righteous word[f]. And then it will happen that they are transferred
    from their torments[r], if the evil deeds they have done come up into their heart[g]. But if they
    do not come up into their heart, they are not saved because of their hardness of heart[s].”'
