id: JHN.1.38
reference: John 1:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
  footnotes:
  - marker: a
    text: Or “What are you looking for?” The Greek can refer to ordinary searching, but “seeking” better preserves the possible deeper sense in John’s narrative.
    reason: lexical_alternative
  - marker: b
    text: “Rabbi” is a Hebrew/Aramaic title meaning “Teacher.”
    reason: cultural_note
  - marker: c
    text: Or “where are you remaining?” The Greek verb is the same one often rendered “remain” or “abide” elsewhere in John.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 돌아서서 그들이 따라오는 것을 보시고 그들에게 말씀하셨습니다. “무엇을 찾으십니까?[a]” 그들이 예수께 말했습니다. “랍비[b](번역하면 ‘선생님’이라는 뜻입니다), 어디에 머무르십니까?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무엇을 구하십니까?” 원어 ζητέω는 ‘찾다’, ‘구하다’, ‘추구하다’ 등을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “랍비”는 히브리어·아람어 호칭으로 ‘선생님’을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는 “어디에 계십니까?” 원어 μένω는 ‘머무르다’, ‘남다’, ‘거하다’ 등으로 옮길 수 있으며, 여기서는 거처를 묻는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  english_pob_choice: turned
  chosen_korean: 몸을 돌이키시어
  alternatives_korean:
  - 돌아서서
  - 돌아보시고
  lexicon: BDAG
  rationale: aorist participle로 예수의 행동을 소개합니다. '몸을 돌이키시어'는 동작의 시작을 품으면서도 경어형을 사용해 복음서의 존칭 표현을 유지합니다.
- source_word: θεασάμενος
  english_pob_choice: seeing
  chosen_korean: 보시고
  alternatives_korean:
  - 보시며
  - 주시하여 보시고
  lexicon: BDAG
  rationale: 시각적 인식을 나타내는 분사입니다. '보시고'는 앞의 '몸을 돌이키시어'와 자연스럽게 이어지며 관찰의 힘을 보존합니다.
- source_word: Τί ζητεῖτε;
  english_pob_choice: What are you seeking?
  chosen_korean: 무엇을 찾고 계십니까?
  alternatives_korean:
  - 무엇을 찾으십니까?
  - 무엇을 구하십니까?
  lexicon: BDAG
  rationale: ζητέω의 현재형은 진행적·탐구적 뉘앙스를 가질 수 있습니다. 진행형 표현('찾고 계십니까')은 일상적 질문이면서도 요한복음의 '찾음/구함'이라는 잠재적 신학적 긴장을 남깁니다.
- source_word: Ῥαββί
  english_pob_choice: Rabbi
  chosen_korean: 랍비
  alternatives_korean:
  - 라비
  - 랍비(라삐)
  lexicon: BDAG
  rationale: 원어의 유대어/아람어 호칭을 음역으로 보존했습니다. 본문이 즉시 설명을 덧붙이므로 음역으로 두고 괄호 설명을 함께 제시하는 편이 원문 취지를 충실히 반영합니다.
- source_word: ποῦ μένεις;
  english_pob_choice: where are you staying?
  chosen_korean: 어디에 머무르십니까?
  alternatives_korean:
  - 어디에 거하십니까?
  - 어디에 머무르십니까? (머무르다=remain/abide)
  lexicon: BDAG
  rationale: μένω는 요한복음 전반에서 신학적 무게를 얻지만, 이 문맥에서는 실제적 위치를 묻는 질문입니다. '머무르십니까'는 자연스러운 한국어면서도 나중의 '거하심/머무르심' 신학적 어감과 충돌하지 않도록 열어 둡니다.
theological_decisions:
- issue: Rendering μένω in an early Johannine context where the verb later carries theological weight
  chosen_reading: 어디에 머무르십니까?
  alternative_readings:
  - 어디에 거하십니까?
  - 어디에 머무르십니까? (remain/abide)
  rationale: μένω가 요한복음 전체에서 '거함/머묾' 신학을 형성하는 동사이지만, 이 첫 대목은 제자들이 실질적 거처를 묻는 상황적 질문입니다. 즉시적 문맥을 따라 평이한 거처 질문으로 옮기되, 원어의 신학적 여지를 지우지 않도록 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: Rendering ζητέω with possible Johannine double meaning
  chosen_reading: 무엇을 찾고 계십니까?
  alternative_readings:
  - 무엇을 찾으십니까?
  - 무엇을 구하십니까?
  rationale: 요한은 일상어를 신학적으로 중첩하여 사용하는 경향이 있습니다. 진행형 표현은 당장의 물리적 탐색을 전달하면서도 '찾음'의 영적·신학적 가능성을 남겨 둡니다.
  doctrine_reference: Translation philosophy §3
