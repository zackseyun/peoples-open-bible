  text: judged, but love those who have always trusted in your glory. For we and our fathers have lived in mortal ways, but you, however,
translation:
  language: ko
  text: 심판을 받았으나, 늘 당신의 영광을 신뢰해 온 이들을 사랑하십시오. 우리는 우리 조상들과 더불어 필멸의 방식으로 살아왔습니다. 그러나 당신은,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicati
  english_pob_choice: judged
  chosen_korean: 심판받을 자들
  alternatives_korean:
  - 심판된 자들
  - 판결받은 자들
  lexicon: iudico
  rationale: 라틴어 수동 분사 iudicati를 영어 POB의 'judged'에 맞춰, 문맥상 대상화된 심판 상태를 드러내는 '심판받을 자들'로 옮겼습니다.
- source_word: diligas
  english_pob_choice: love
  chosen_korean: 사랑하십시오
  alternatives_korean:
  - 사랑하소서
  - 사랑하세요
  lexicon: diligo
  rationale: 직설법이 아니라 권고/청유의 기능을 유지하면서 현대 합쇼체로 자연스럽게 표현했습니다.
- source_word: qui semper in tua gloria confiderunt
  english_pob_choice: those who have always trusted in your glory
  chosen_korean: 늘 당신의 영광을 의지해 온 이들
  alternatives_korean:
  - 항상 당신의 영광을 신뢰해 온 이들
  - 늘 당신의 영광에 믿음을 둔 이들
  lexicon: confido
  rationale: confiderunt의 ‘신뢰하다’ 의미를 살리되, 한국어에서 하나님께 대한 신뢰의 자연스러운 표현인 '의지하다'를 선택했습니다.
- source_word: mortalibus moribus egimus
  english_pob_choice: have lived in mortal ways
  chosen_korean: 죽을 수밖에 없는 삶을 살았습니다
  alternatives_korean:
  - 죽을 운명의 방식으로 살아왔습니다
  - 유한한 삶의 방식으로 행했습니다
  lexicon: mortalis
  rationale: mortalibus moribus의 '죽을 수밖에 없는/유한한' 뉘앙스를 살리기 위해, 단순한 도덕성보다 인간의 유한성과 필멸성을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 원문이 'tu autem'에서 끊기는 미완결성 처리
  chosen_reading: 문장을 완결시키지 않고 “그러나 당신은,”에서 끊었습니다.
  alternative_readings:
  - 문맥상 추정하여 보완함
  - 자연스러운 한국어로 종결함
  rationale: 제공된 라틴 본문이 'tu autem'에서 끝나므로, 미완결을 보존하는 것이 원문 충실성과 검증 가능성을 지킵니다.
  doctrine_reference: source fidelity
- issue: '''tua gloria''의 번역 선택'
  chosen_reading: ‘당신의 영광’으로 번역했습니다.
  alternative_readings:
  - ‘당신의 영광스러운 이름’
  - ‘당신의 영광 가운데’
  rationale: 영광(gloria)을 본문 그대로 유지해, 신적 찬란함/존귀를 흐리지 않도록 했습니다.
  doctrine_reference: lexical transparency
