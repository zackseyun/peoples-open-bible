  text: καὶ συνέδραμον πάντες ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν, ὅτι παράδοξον ἦν αὐτοῖς τοῦ ἐλθεῖν αὐτήν, καὶ ἤνοιξαν τὴν πύλην καὶ ἀπεδέξαντο αὐτάς. ἅψαντες πῦρ εἰς φάσιν περιεκύκλωσαν αὐτάς.
