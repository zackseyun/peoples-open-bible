  rationale: The verse itself poetically blesses Judah with leonine strength and dominance. While later biblical theology may develop this imagery messianically, the translation should not import that conclusion into the main text where the Hebrew does not state it explicitly.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; never import doctrinal claims the text does not make.'
