id: PSA.105.16
reference: Psalms 105:16
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א רָ֭עָב עַל הָ/אָ֑רֶץ כָּֽל מַטֵּה לֶ֥חֶם שָׁבָֽר־־־׃
translation:
  text: He summoned a famine against the land; he cut off its entire supply of bread[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “he broke every staff of bread”; bread is pictured as a staff supporting life.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  chosen: He summoned
  alternatives:
  - he called
  - he summoned
  lexicon: HALOT
  rationale: With famine as object, the verb denotes calling or summoning famine upon the land rather than requesting it.
- source_word: רָעָב
  chosen: a famine
  alternatives:
  - hunger
  lexicon: HALOT
  rationale: The anarthrous noun is naturally rendered indefinitely in English.
- source_word: עַל הָאָרֶץ
  chosen: against the land
  alternatives:
  - upon the earth
  - against the land
  lexicon: HALOT
  rationale: With the summoned famine, the preposition has an adverse contextual force that “against” conveys.
- source_word: כָּל
  chosen: every
  alternatives:
  - all
  lexicon: HALOT
  rationale: With a singular construct phrase, 'every' gives idiomatic English and conveys totality clearly.
- source_word: מַטֵּה לֶחֶם
  chosen: staff of bread
  alternatives:
  - supply of bread
  - support of bread
  lexicon: HALOT
  rationale: This is a Hebrew idiom literally meaning the staff or support of bread, that is, the sustaining food supply. The main text keeps the metaphor with 'staff of bread' for transparency to the source; a footnote preserves the idiomatic sense.
- source_word: שָׁבָר
  chosen: he broke
  alternatives:
  - he shattered
  - he destroyed
  lexicon: HALOT
  rationale: The verb's basic sense is 'break.' Retaining that wording preserves the metaphor of the bread-staff being broken, echoing common biblical famine language.
