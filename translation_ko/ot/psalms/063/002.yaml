lexical_decisions:
- source_word: אֱלֹהִים / אֵלִי
  english_pob_choice: God / my God
  chosen_korean: 하나님 / 나의 하나님
  alternatives_korean:
  - 오 하나님
  - 내 하나님
  lexicon: HALOT
  rationale: 두 호칭이 병렬로 쓰여 하나님께 직접 부르는 말임을 살리되, 첫 호칭은 단순 호격보다 자연스러운 ‘하나님’으로, 둘째는 관계를 드러내는 ‘나의 하나님’으로 옮겼습니다.
- source_word: אֲשַׁחֲרֶךָּ
  english_pob_choice: I seek you at dawn
  chosen_korean: 내가 새벽에 주님을 찾습니다
  alternatives_korean:
  - 내가 일찍 주님을 찾습니다
  - 내가 간절히 주님을 찾습니다
  lexicon: HALOT
  rationale: 동사의 핵심인 ‘새벽/동틀 무렵’의 시각적 이미지를 보존하기 위해 ‘새벽에’로 옮겼습니다. 단순히 ‘일찍’이나 ‘간절히’로 풀면 시간 이미지가 약해집니다.
- source_word: צָמְאָה נַפְשִׁי / כָּמַהּ בְשָׂרִי
  english_pob_choice: My soul thirsts for you, my flesh longs for you
  chosen_korean: 내 영혼이 주님을 목말라하고, 내 육체가 주님을 그리워합니다
  alternatives_korean:
  - 내 혼이 주님을 목말라하고, 내 몸이 주님을 그리워합니다
  - 내 영혼이 주님을 갈망하고, 내 육신이 주님을 갈망합니다
  lexicon: HALOT
  rationale: ‘영혼/육체’의 내적·신체적 병렬을 살리면서, ‘목마르다’와 ‘그리워하다’로 서로 다른 동사의 결을 구분했습니다. ‘육체’를 ‘몸’으로 완화하지 않고 남긴 것은 원문의 대비를 보존하기 위해서입니다.
- source_word: בְּאֶרֶץ צִיָּה וְעָיֵף בְּלִי מָיִם
  english_pob_choice: in a dry and weary land without water
  chosen_korean: 마른 땅과 지친 땅, 물 없는 곳에서 그렇게 합니다
  alternatives_korean:
  - 마르고 지친 땅에서, 물 없이
  - 메마르고 피곤한 땅, 물 없는 곳에서
  lexicon: HALOT
  rationale: 지명처럼 느껴질 수 있는 ‘땅’의 상태를 두 형용사로 병렬화하고, 마지막 ‘물 없는 곳’을 붙여 원문의 사막적 긴장감을 살렸습니다. 영어의 문장 종결 위치를 반영해 뒤의 장소구가 앞의 갈망 전체를 수식하도록 했습니다.
theological_decisions:
- issue: 기도체에서 하나님 직접 호칭의 높임 표현
  chosen_reading: 본문의 2인칭 직접 호칭은 ‘주님’과 높임 동사로 처리해 경건한 기도문 톤을 유지했습니다.
  alternative_readings:
  - 일반 서술체로 ‘당신’을 사용한다
  - 모든 동사를 중립형으로 평준화한다
  rationale: 시편의 화자는 하나님께 직접 말하고 있으므로, 한국어 합쇼체에서 경어를 쓰는 것이 원문의 기도적 성격을 가장 자연스럽게 전달합니다.
  doctrine_reference: 시편의 기도/찬양 어법; 한국어 경어 체계
