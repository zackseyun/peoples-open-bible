id: PSA.34.17
reference: Psalms 34:17
source:
  edition: WLC
  text: צָעֲק֣וּ וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗/ם הִצִּילָֽ/ם־׃
translation:
  text: The righteous cry out, and Yahweh hears and delivers them from all their troubles.
  philosophy: dynamic
lexical_decisions:
- source_word: צָעֲקוּ
  chosen: The righteous cry out
  alternatives:
  - They cried
  - They called out
  - They cried out
  lexicon: HALOT
  rationale: The plural subject is implicit and carried from the righteous in the context. Supplying it prevents a false antecedent in English.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: שָׁמֵעַ
  chosen: hears
  alternatives:
  - hears
  - was hearing
  - heard
  lexicon: HALOT
  rationale: The participial form and wisdom context present a continuing truth, best expressed with English present tense.
- source_word: מִכָּל
  chosen: from all
  alternatives:
  - out of all
  - from every
  lexicon: HALOT
  rationale: The preposition מן with כָּל expresses deliverance away from the totality of their distresses. 'From all' is concise and idiomatic.
- source_word: צָרוֹתָם
  chosen: their troubles
  alternatives:
  - their distresses
  - their afflictions
  - their adversities
  lexicon: HALOT
  rationale: The noun denotes troubles/distresses. 'Troubles' is readable modern English and fits the psalm's experiential tone; 'distresses' is possible but less natural here.
- source_word: הִצִּילָם
  chosen: delivers them
  alternatives:
  - rescued them
  - saved them
  - delivered them
  lexicon: HALOT
  rationale: 'The action belongs to the same gnomic sequence: Yahweh hears and delivers the righteous.'
