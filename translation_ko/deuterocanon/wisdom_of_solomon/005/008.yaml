  terminology: ὑπερηφανία는 ‘교만’, πλοῦτος는 ‘재물’, ἀλαζονία는 단순한 내적 자만보다 과시·허세의 뉘앙스가 있어 ‘허세’가 더 가깝습니다. συμβέβληται의 결과적 유익 의미는 ‘무슨 이득을 주었습니까?’로 무리 없이 전달됩니다.
