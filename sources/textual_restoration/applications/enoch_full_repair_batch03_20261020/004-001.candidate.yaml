translation:
  text: Again, observe the days of summer, how the sun is over it at its beginning.[a] You seek shelter and shade[b]
    because of the heat of the sun, and the earth grows hot with burning heat.[c] You cannot walk upon the earth
    or a rock because of its heat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected Ge’ez has a compressed feminine-pronoun expression, literally “over it, before it/at its
      beginning.” The exact relation to summer is difficult; this rendering does not resolve it into an unstated
      claim about the sun’s strength.
    reason: alternative_reading
  - marker: b
    text: The Ge’ez uses two related shelter/shade terms; both are retained rather than collapsed into one.
    reason: lexical_alternative
  - marker: c
    text: The heat expression crosses the Ge’ez page boundary from printed6 to8. Charles’s printed6 note42 records
      differing forms. This source record preserves the selected printed formእምቀ followed byሐሩር, rather than supplying
      a longer normalized word from a digital oracle.
    reason: textual_variant
