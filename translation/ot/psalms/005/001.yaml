id: PSA.5.1
reference: Psalms 5:1
source:
  edition: WLC
  text: אֲמָרַ֖/י הַאֲזִ֥ינָ/ה יְהוָ֗ה בִּ֣ינָ/ה הֲגִֽיגִ/י׀׃
translation:
  text: Give ear to my words, Yahweh; consider my murmured prayer[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “my inward meditation.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲמָרַי
  chosen: my words
  alternatives:
  - what I say
  - my speech
  lexicon: HALOT
  rationale: Plural construct with 1cs suffix from אמר, referring to the psalmist's spoken words. 'My words' is the most direct and natural rendering in English.
- source_word: הַאֲזִינָה
  chosen: Give ear
  alternatives:
  - listen to
  - hear
  lexicon: HALOT
  rationale: Imperative/jussive-like plea from אזן, literally 'give ear' or 'listen attentively.' 'Give ear' preserves the vivid idiom and prayerful tone better than the flatter 'listen.'
- source_word: יְהוָה
  chosen: O Yahweh
  alternatives:
  - the LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: בִּינָה
  chosen: understand
  alternatives:
  - consider
  - discern
  lexicon: HALOT
  rationale: Imperative from בין, asking God to perceive with understanding. 'Understand' best captures the cognitive nuance in straightforward modern English.
- source_word: הֲגִיגִי
  chosen: my groaning
  alternatives:
  - my meditation
  - my murmuring
  lexicon: HALOT
  rationale: הגיג can denote musing, murmuring, or low utterance. In this lament-prayer context, paired with 'my words,' it likely refers to the psalmist's inward, anguished utterance rather than calm meditation. 'My groaning' best conveys that emotional force while remaining textually grounded.
- source_word: בִּינָה הֲגִיגִי
  chosen: consider my murmuring
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This renders the appeal for discerning attention while retaining the subdued, ambiguous character of הֲגִיגִי.
