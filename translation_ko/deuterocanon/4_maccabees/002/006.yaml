  to: 그런데도 율법이 우리에게 욕망을 품지 말라고 말하였는데, 이성이 욕망들을 지배할 수 있다는 것은 이성이 의를 방해하는 정념들을 다스릴 수 있는 것과 마찬가지로, 제가 여러분을 훨씬 더 설득할 수 있을 것입니다.[a]
  rationale: 원문의 잠재적 표현(‘설득할 수 있을 것입니다’)과 율법의 선행 진술을 보존하고, 이성이 두 대상—욕망과 의를 방해하는 정념—을 다스린다는 비교 구조를 명시적으로 복원했습니다. 의미를 추가하거나 특정 교리적 해석을 부과하지 않았습니다.
