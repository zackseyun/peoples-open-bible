base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/015.yaml
  text: Then he said to me, “Have you seen this, son of man? You will see again still greater abominations than these.”
translation:
  language: ko
  text: 그가 내게 말씀하셨습니다. “인자야, 이것을 보았습니까? 너는 다시 이것들보다 더 큰 가증한 일들을 보게 될 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: Then he said to me
  chosen_korean: 그가 내게 말씀하셨습니다
  alternatives_korean:
  - 그가 내게 말했습니다
  - 그가 내게 이르셨습니다
  lexicon: אמר
  rationale: 서술문의 טבע한 과거를 살리되, 에스겔에서 하나님의 발화가 이어지는 문맥을 고려해 ‘말씀하셨습니다’로 공손하고 문학적인 톤을 유지했습니다.
- source_word: בֶן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인자여
  lexicon: בן־אדם
  rationale: 에스겔의 고정 호칭으로서 한국어 성경 관용을 따르되, 현대 합쇼체에 맞게 ‘인자야’로 옮겼습니다.
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  english_pob_choice: still greater abominations
  chosen_korean: 아직도 이보다 더 큰 가증한 일들
  alternatives_korean:
  - 이보다 더 큰 가증한 것들
  - 여전히 더 큰 혐오스러운 일들
  lexicon: תועבה
  rationale: תועבות를 도덕적·예배적 혐오를 가진 ‘가증한 일들’로 옮기고, עוֹד를 ‘아직도’로 살려 다음 계시가 더 이어짐을 드러냈습니다.
- source_word: עוֹד
  english_pob_choice: still
  chosen_korean: 아직도
  alternatives_korean:
  - 또
  - 여전히
  lexicon: עוד
  rationale: English POB의 ‘still’을 반영해 단순한 시간 부사가 아니라 ‘계속해서 더’라는 누적적 의미를 분명히 했습니다.
theological_decisions:
- issue: 에스겔 8장의 심판적 계시에서 감탄사적 호칭의 톤
  chosen_reading: ‘인자야’는 예언자에게 주어진 호칭으로 그대로 유지하고, 문장 전체는 하나님/신적 화자의 권위를 해치지 않도록 공손한 서술체로 처리했습니다.
  alternative_readings:
  - 호칭을 생략하여 ‘이것을 보았느냐?’만 번역함
  - ‘사람아’로 일반화함
  rationale: 본문의 계시적 긴장과 에스겔 특유의 호칭을 보존해야 하므로, 평이한 일반 호칭으로 희석하지 않았습니다.
  doctrine_reference: Ezekiel 8:15 context; prophetic address conventions
