translation:
  text: Bear witness to your former deeds[a], and fulfill the vision proclaimed in your name[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, “Bear witness to those you created in the beginning,” as in the Greek parallel, referring in context to Israel.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word after “vision” is obscure; “proclaimed in your name” follows the corresponding Greek line, which speaks of prophecies given in God's name.
    reason: textual_variant
lexical_decisions:
- source_word: תן עדות
  chosen: Bear witness
  alternatives:
  - Give testimony
  - Testify
  lexicon: HALOT
  rationale: The imperative phrase literally means 'give witness/testimony.' 'Bear witness' is idiomatic modern English that preserves the juridical-testimonial force better than the flatter 'give testimony' in this poetic context.
- source_word: למראש
  chosen: to your former
  alternatives:
  - from the beginning
  - to what came before
  - to the first
  lexicon: HALOT
  rationale: The form is difficult, but in context with 'your deeds' it most naturally points to what is prior or former. This keeps the Hebrew witness primary while acknowledging some uncertainty in the exact nuance.
- source_word: מעשיך
  chosen: deeds
  alternatives:
  - works
  - acts
  lexicon: HALOT
  rationale: '''Deeds'' fits wisdom-style moral action language in readable English. ''Works'' can sound overly theological in English; ''acts'' is possible but less natural here.'
- source_word: והקם
  chosen: and establish
  alternatives:
  - and raise up
  - and confirm
  - and fulfill
  lexicon: HALOT
  rationale: 'The hiphil/imparative sense of קום here is causative: to set up, establish, or confirm. ''Establish'' best fits an object like ''vision'' and preserves the force without overinterpreting it as ''fulfill.'''
- source_word: חזון
  chosen: vision
  alternatives:
  - revelation
  - oracle
  lexicon: HALOT
  rationale: The standard sense is 'vision.' Although 'oracle' or 'revelation' could fit a prophetic context, 'vision' is the most direct rendering and leaves the imagery intact.
- source_word: דברק
  chosen: swiftly
  alternatives:
  - lightning-like
  - your word
  - your plague
  lexicon: HALOT
  rationale: The Hebrew is textually difficult. In light of the Greek parallel's sense ('and in addition bless the one who made you and satisfies you with his good things'), the Hebrew likely preserves a corrupt or obscure expression. The consonants may suggest a sense related to 'flash/lightning' or rapidity; 'swiftly' gives a restrained rendering of the extant Hebrew without pretending certainty. This is a significant uncertainty and is preserved in a footnote.
- source_word: בשמך
  chosen: in your name
  alternatives:
  - for your name
  - by your name
  lexicon: HALOT
  rationale: The preposition ב with 'name' is naturally rendered 'in your name.' This preserves the Hebrew wording closely, though the exact syntactic relation in the line remains somewhat opaque.
