source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֣וּר אֶת רַב שָׁקֵ֨ה מִ/לָּכִ֧ישׁ יְרוּשָׁלְַ֛מָ/ה אֶל הַ/מֶּ֥לֶךְ חִזְקִיָּ֖הוּ בְּ/חֵ֣יל כָּבֵ֑ד וַֽ/יַּעֲמֹ֗ד בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָ/עֶלְיוֹנָ֔ה בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/002.yaml
  text: Then the king of Assyria sent the Rabshakeh from Lachish to Jerusalem, to King Hezekiah, with a heavy force. And he stood by the conduit of the upper pool, on the highway to the launderer’s field.
translation:
  language: ko
  text: 그때 앗수르 왕이 큰 군대를 거느린 랍사게를 라기스에서 예루살렘에 있는 히스기야 왕에게 보냈습니다. 랍사게는 윗못의 수로 곁, 세탁하는 사람의 밭으로 가는 큰길에 섰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/חֵיל כָּבֵד
  english_pob_choice: with a heavy force
  chosen_korean: 군사력을 많이 거느리고
  alternatives_korean:
  - 큰 군대로
  - 막강한 군사력을 가지고
  - 대군을 거느리고
  lexicon: חֵיל
  rationale: 영어 POB의 "heavy force"는 단순한 인원 수보다 압도적인 군사적 압력과 장비를 포함한 병력의 성격을 드러내므로, 한국어에서도 자연스럽고 직역에 치우치지 않게 "군사력을 많이 거느리고"로 옮겼습니다.
- source_word: מִ/לָּכִישׁ
  english_pob_choice: from Lachish
  chosen_korean: 락기스에서
  alternatives_korean:
  - 라기스에서
  - 라키스에서
  lexicon: 지명 표기
  rationale: 히브리어 지명 לָכִישׁ의 현대 음역으로는 표준 외래어 표기법에 맞는 "락기스"가 적절하며, 본문 흐름상 출발지를 분명히 하기 위해 조사 "에서"를 붙였습니다.
- source_word: בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵס
  english_pob_choice: on the highway to the launderer’s field
  chosen_korean: 빨래하는 자들의 들판으로 가는 길에
  alternatives_korean:
  - 세탁하는 자들의 밭으로 가는 큰길에
  - 빨래꾼의 밭길에
  - 세탁장의 들판으로 가는 길에
  lexicon: מְסִלָּה / שְׂדֵה כוֹבֵס
  rationale: שְׂדֵה כוֹבֵס는 전통 번역의 "세탁자의 들판"보다, 현대 한국어에서 의미가 즉시 드러나는 "빨래하는 자들의 들판"으로 풀어 주되, 장소 명칭이 아니라 위치 설명이라는 점을 살려 "가는 길에"로 처리했습니다.
theological_decisions:
- issue: 앗수르 왕의 군사력 묘사
  chosen_reading: 본문의 "군사력을 많이 거느리고"는 단순한 이동 묘사가 아니라 예루살렘을 압박하는 위세를 강조하는 표현으로 읽었습니다.
  alternative_readings:
  - 그냥 군대를 거느리고
  - 대군을 이끌고
  rationale: 히브리어 כָּבֵד는 무게감과 압도성을 포함하므로, 사건의 긴장감을 약화시키지 않도록 강한 군사적 압박을 드러내는 방향을 택했습니다.
  doctrine_reference: 역사 서술의 문맥 보존
