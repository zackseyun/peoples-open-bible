  lexicon: HALOT
  rationale: 정확한 의미가 불확실한 음악/예식 표제이므로, 곡조·선율을 암시하는 구조를 살리면서도 해석을 과도하게 좁히지 않았습니다.
- source_word: מִכְתָּם
