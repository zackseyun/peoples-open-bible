id: JHN.2.20
reference: John 2:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
  footnotes:
  - marker: a
    text: Or 'the Judeans.' The Greek says 'the Jews,' a term John uses in varied ways depending on context.
    reason: alternative_reading
  - marker: b
    text: Or 'rebuild it.' The Greek verb can be understood by the speakers in a construction sense, but 'raise it up' preserves the wording that John later connects to Jesus' resurrection.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 유대인들이[a] 말하였습니다. 「이 성전은 사십육 년에 걸쳐 지어졌는데, 당신이 삼 일 만에 그것을 일으키겠습니까[b]?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다인들.’ 그리스어는 문자적으로 ‘유대인들’이라고 기록되어 있으며, 요한복음에서 이 용어의 지시 범위는 문맥에 따라 달라질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘재건하겠습니까’ 또는 ‘다시 세우겠습니까.’ 그리스어 동사는 청자들이 건축의 의미로 이해할 수 있으나, ‘일으키다’는 요한이 이어지는 본문에서 예수의 부활과 연결하는 어휘적 연관을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러자
  alternatives_korean:
  - 그러므로
  - 그러니
  lexicon: BDAG
  rationale: οὖν은 앞말에 따른 귀결을 표시하므로 현대 한국어의 자연스러운 연결어 '그러자'를 사용해 담화 연결을 살렸습니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유다인들
  - 유대인 지도자들
  lexicon: BDAG
  rationale: 그리스어 표현은 문자적으로 '유대인들'이므로 본문은 원어를 직접 반영했습니다. 요한복음에서 이 용어는 문맥에 따라 의미가 달라질 수 있으므로 각별한 해석은 주석(각주)으로 남겼습니다.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  english_pob_choice: in forty-six years
  chosen_korean: 사십육 년 동안에
  alternatives_korean:
  - 사십육 년에 걸쳐
  - 사십육 년 동안
  lexicon: BDAG
  rationale: 시간의 여격(기간)을 전달하는 표현이므로 '사십육 년 동안에'로 번역해 건축 기간의 의미를 살렸습니다.
- source_word: ἐγερεῖς (σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν)
  english_pob_choice: raise it up
  chosen_korean: 일으키겠느냐
  alternatives_korean:
  - 다시 세우겠느냐
  - 재건하겠느냐
  lexicon: BDAG
  rationale: ἐγείρω는 '일으키다/일으키시다'의 어휘를 포함하며, 요한복음이 이후 21절에서 예수의 몸과 부활을 연결하므로 '일으키다'로 번역해 본문이 남기는 신학적 아이러니를 보존했습니다.
- source_word: σὺ
  english_pob_choice: and will you
  chosen_korean: 너는
  alternatives_korean:
  - 당신은
  - 네가
  lexicon: BDAG
  rationale: σὺ는 강조적 대명사이므로 인용문 안에서는 구어체적 강조를 드러내기 위해 '너는'을 선택했습니다. 전체 문체는 합쇼체이나, 인용된 발화의 대화적 성격을 살리기 위해 인칭표현에 약간의 register 변화를 주었습니다.
theological_decisions:
- issue: οἱ Ἰουδαῖοι의 번역이 반유대주의적 해석으로 흐를 위험
  chosen_reading: 본문은 '유대인들'로 직역하고 주석(각주)으로 문맥적 다양성을 알림
  alternative_readings:
  - 유다인들
  - 유대 지도자들
  rationale: 요한복음에서 οἱ Ἰουδαῖοι는 문맥에 따라 다양한 범위를 가리킬 수 있으므로 본문에서는 원어 표현을 보존하고 해석적 확장은 각주로 남겨 독자가 평가하도록 했습니다.
  doctrine_reference: '번역 원칙: 원문 충실성 및 독자 주석 제공'
- issue: ἐγερεῖς의 부활 이미지와의 관계
  chosen_reading: '''일으키다''로 번역하여 요한의 신학적 아이러니 보존'
  alternative_readings:
  - 재건하다
  - 다시 지을 것이다
  rationale: 청자들은 건축 의미로 이해할 수 있으나 복음서 저자는 예수의 몸과 부활을 암시합니다. 번역은 이 중첩된 의미를 삭제하지 않고 남겨 두는 쪽을 택했습니다.
  doctrine_reference: 요한 2:21-22의 서술적 연결
