  yaml_path: translation/deuterocanon/psalms_of_solomon/002/018.yaml
  text: You exposed their sins so that your judgment might be seen.
translation:
  language: ko
  text: 주님께서는 그들의 죄를 드러내셨습니다. 이는 주님의 심판이 보이게 하시려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 죄를 밝히셨으니”
    reason: alternative_reading
  - marker: b
    text: 또는 “주님의 심판이 드러나게 되도록”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέκαλυψας
  english_pob_choice: You exposed
  chosen_korean: 드러내셨으니
  alternatives_korean:
  - 폭로하셨으니
  - 드러내셨습니다
  lexicon: ἀνακαλύπτω
  rationale: 영어 POB의 'exposed'를 따라, 단순한 비난보다 숨겨진 것을 밖으로 드러내는 의미를 살려 '드러내다'로 옮겼습니다.
- source_word: τὰς ἁμαρτίας
  english_pob_choice: their sins
  chosen_korean: 그들이 지은 죄
  alternatives_korean:
  - 그들의 죄
  - 그들의 죄악
  lexicon: ἁμαρτία
  rationale: ἁμαρτίας는 행위로서의 죄를 가리키므로, 한국어에서는 주어-서술 관계를 살린 '그들이 지은 죄'가 가장 자연스럽습니다.
- source_word: τὸ κρίμα σου
  english_pob_choice: your judgment
  chosen_korean: 주님의 심판
  alternatives_korean:
  - 주의 심판
  - 당신의 심판
  lexicon: κρίμα
  rationale: 여기서 κρίμα는 단순한 판단이 아니라 드러난 죄에 대한 심판을 가리키므로 '심판'이 적절하며, 기도문/신앙문체에 맞춰 '주님'을 사용했습니다.
theological_decisions:
- issue: ἵνα φανῇ의 목적절 의미
  chosen_reading: 죄의 드러남은 하나님의 심판이 보이게 하려는 목적을 가진 것으로 옮겼습니다.
  alternative_readings:
  - 그래서 주님의 판단이 알려지게 하시려는 것입니다
  - 주님의 심판이 나타나게 하시려는 것입니다
  rationale: ἵνα + 접속법은 목적을 나타내므로, 결과보다 의도를 살려 '드러나게 하시려는'으로 번역했습니다. 영어 POB의 'might be seen'도 이 목적성을 반영합니다.
  doctrine_reference: 신적 심판의 공적 가시성
- issue: τὸ κρίμα σου의 인칭 처리
  chosen_reading: 직접적인 2인칭을 유지하되, 한국어에서는 예배체에 맞게 '주님의'로 자연스럽게 풀었습니다.
  alternative_readings:
  - 당신의 심판
  - 주의 심판
  rationale: 원문은 2인칭 소유를 사용하지만, 한국어 공적 문체에서는 '당신'보다 '주님의'가 더 자연스럽고 경건한 어감을 유지합니다.
  doctrine_reference: 하나님의 주권적 심판
