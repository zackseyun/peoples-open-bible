translation:
  language: en
  text: 'When the final judgment comes, the men of Nineveh will rise alongside the people of this generation and condemn them, because they repented[b] in response to Jonah’s message. And take notice: something greater than Jonah is here.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “one greater than Jonah is here” or “more than Jonah is here.” The Greek may refer broadly to Jesus and the greater reality present in his ministry, not only to Jesus as a person.
    reason: alternative_reading
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will rise up in the judgment with this generation
  simplified_phrase: When the final judgment comes, ... will rise alongside the people of this generation
  preserved_meaning: The Ninevite men will arise together with this generation at the final judicial event.
  reasoning_layer_used: Lexical decisions for ἀναστήσονται, κρίσις, and μετά
  rationale: The reordered clause retains both the rising image and the shared judgment setting.
- pob_phrase: and behold, something greater than Jonah is here
  simplified_phrase: 'And take notice: something greater than Jonah is here'
  preserved_meaning: Jesus emphatically points to a present reality surpassing Jonah without limiting it to a personal comparison.
  reasoning_layer_used: Lexical and theological decisions for ἰδού and πλεῖον Ἰωνᾶ
  rationale: “Take notice” is clear modern English, while “something greater” preserves the documented breadth.
interpretive_expansions:
- pob_phrase: in the judgment
  rendering: When the final judgment comes
  claim: The judgment is the final judicial event.
  evidence:
  - The POB lexical rationale identifies κρίσις here as the final judicial event.
  - The future rising of both groups supplies an eschatological setting.
  confidence: high
  alternatives_preserved:
  - at the judgment
