    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악행을 일삼는 자들의 소란’, ‘악행을 일삼는 자들의 동요’로 옮길 수 있습니다. 히브리어 리그샤는 적대적인 소요나 소란스러운 동요를 가리킬 수 있습니다.
    reason: lexical_alternative
