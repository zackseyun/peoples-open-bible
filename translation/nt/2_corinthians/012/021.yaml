  baseline_commit: 1c388ebf7b81430b6dbf56575de3b3604ba77804
  baseline_path: translation/nt/2_corinthians/012/021.yaml
  sha256: 27327ea4b8267d3256f66cca146c5c290d11460324182462c2b2fc4f07203e77
  certifies_this_candidate: false
  value:
  - issue: Force of Paul's statement introduced by μή after the implied verb of fear from the previous verse
    chosen_reading: Expressed as 'I fear that when I come again... my God may humble me before you'
    alternative_readings:
    - Lest when I come again my God should humble me among you
    rationale: The Greek continues the fear statement from v.20 rather than making an independent assertion. English needs the implied fear made explicit for clarity. This is a syntactic, not doctrinal, decision.
  - issue: Moral vice terminology
    chosen_reading: Rendered the three terms distinctly as 'impurity and sexual immorality and sensuality'
    alternative_readings:
    - uncleanness and fornication and licentiousness
    rationale: The verse lists overlapping but distinct sins; the translation preserves the accumulation without collapsing them into one category. This avoids importing narrower doctrinal definitions than the Greek itself states.
    doctrine_reference: Translation philosophy §§5–6
  - issue: Context-sensitive reorientation terminology
    chosen_reading: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not reoriented away from the impurity and sexual immorality and sensuality that they practiced.
    alternative_readings:
    - Traditional repent/repentance wording, preserved at the baseline commit.
    rationale: Use reorient/reorientation without automatically inserting God. The sentence supplies a departure, destination, interpersonal setting, or the work's own conceptual framework. Preserve distinct turning verbs and named wrongdoing.
    doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
