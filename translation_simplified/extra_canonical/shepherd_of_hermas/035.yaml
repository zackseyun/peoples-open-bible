source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Εἶπόν σοι, φησίν, ὅτι τὰ κτίσματα τοῦ Θεοῦ διπλᾶ ἐστί· καὶ γὰρ ἡ ἐγκράτεια διπλῆ ἐστίν. ἐπί τινων
    γὰρ δεῖ ἐγκρατεύεσθαι, ἐπί τινων δὲ οὐ δεῖ. 2. Γνώρισόν μοι, φημί, κύριε, ἐπὶ τίνων δεῖ ἐγκρατεύεσθαι,
    ἐπὶ τίνων δὲ οὐ δεῖ. Ἄκουε, φησί. τὸ πονηρὸν ἐγκρατεύου, καὶ μὴ ποίει αὐτό· τὸ δὲ ἀγαθὸν μὴ ἐγκρατεύου,
    ἀλλὰ ποίει αὐτό. ἐὰν | γὰρ ἐγκρατεύσῃ τὸ ἀγαθὸν μὴ ποιεῖν, ἁμαρτίαν μεγάλην ἐργάζῃ· ἐὰν | δὲ ἐγκρατεύσῃ
    τὸ πονηρὸν μὴ ποιεῖν, δικαιοσύνην μεγάλην ἐργάζῃ. ἐγκράτευσαι οὖν ἀπὸ πονηρίας πάσης ἐργαζόμενος τὸ
    ἀγαθόν. 3. Ποταπαί, φημί, κύριε, εἰσὶν αἱ πονηρίαι ἀφ᾽ ὧν [ἡμᾶς] δεῖ ἐγκρατεύεσθαι; Ἄκουε, φησίν·
    ἀπὸ μοιχείας καὶ πορνείας, ἀπὸ μεθύσματος ἀνομίας, ἀπὸ τρυφῆς πονηρᾶς, ἀπὸ ἐδεσμάτων πολλῶν καὶ πολυτελείας
    πλούτου καὶ καυχήσεως καὶ ὑψηλοφροσύνης καὶ ὑπερηφανίας, καὶ ἀπὸ ψεύσματος καὶ καταλαλίας καὶ ὑποκρίσεως
    [καὶ] μνησικακίας καὶ πάσης βλασφημίας. 4. ταῦτα τὰ ἔργα πάντων πονηρότατά εἰσιν ἐν τῇ ζωῇ τῶν ἀνθρώπων.
    ἀπὸ τούτων οὖν τῶν ἔργων δεῖ ἐγκρατεύεσθαι τὸν δοῦλον τοῦ Θεοῦ. ὁ γὰρ μὴ ἐγκρατευόμενος ἀπὸ τούτων
    οὐ δύναται ζῆσαι τῷ Θεῷ. ἄκουε οὖν καὶ τὰ ἀκόλουθα τούτων. 5. Ἔτι γάρ, φημί, κύριε, πονηρὰ ἔργα ἐστί;
    Καί γε πολλά, φησίν, ἔστιν ἀφ᾽ ὧν δεῖ τὸν δοῦλον τοῦ Θεοῦ ἐγκρατεύεσθαι· κλέμμα, ψεῦδος, ἀποστέρησις,
    ψευδομαρτυρία, πλεονεξία, ἐπιθυμία πονηρά, ἀπάτη, κενοδοξία, ἀλαζονεία, καὶ ὅσα τούτοις ὅμοιά εἰσιν.
    6. οὐ δοκεῖ σοι ταῦτα πονηρὰ εἶναι, καὶ λίαν πονηρά, [φησί,] τοῖς δούλοις τοῦ Θεοῦ; τούτων πάντων
    δεῖ ἐγκρατεύεσθαι τὸν δουλεύοντα τῷ Θεῷ. ἐγκράτευσαι οὖν ἀπὸ πάντων τούτων, ἵνα ζήσῃ τῷ Θεῷ, καὶ ἐγγραφήσῃ
    μετὰ τῶν ἐγκρατευομένων αὐτά. ἀφ᾽ ὧν μὲν οὖν δεῖ σε ἐγκρατεύεσθαι, ταῦτά ἐστιν. 7. ἃ δὲ δεῖ σε μὴ
    ἐγκρατεύεσθαι, φησίν, ἀλλὰ ποιεῖν, ἄκουε. τὸ ἀγαθὸν μὴ ἐγκρατεύου, ἀλλὰ ποίει αὐτό. 8. Καὶ τῶν ἀγαθῶν
    μοι, φημί, κύριε, δήλωσον τὴν δύναμιν, ἵνα πορευθῶ ἐν αὐτοῖς καὶ δουλεύσω αὐτοῖς, ἵνα ἐργασάμενος
    αὐτὰ δυνηθῶ σωθῆναι. Ἄκουε, φησί, καὶ τῶν ἀγαθῶν τὰ ἔργα, ἅ σε δεῖ ἐργάζεσθαι καὶ μὴ ἐγκρατεύεσθαι.
    9. πρῶτον πάντων πίστις, φόβος Κυρίου, ἀγάπη, ὁμόνοια, ῥήματα δικαιοσύνης, ἀλήθεια, ὑπομονή· τούτων
    ἀγαθώτερον οὐδέν ἐστιν ἐν τῇ ζωῇ τῶν ἀνθρώπων. ταῦτα ἐάν τις φυλάσσῃ καὶ μὴ ἐγκρατεύηται ἀπ᾽ αὐτῶν,
    μακάριος γίνεται ἐν τῇ ζωῇ αὐτοῦ. 10. εἶτα τούτων τὰ ἀκόλουθα ἄκουσον· χήραις ὑπηρετεῖν, ὀρφανοὺς
    καὶ ὑστερουμένους ἐπισκέπτεσθαι, ἐξ ἀναγκῶν λυτροῦσθαι τοὺς δούλους τοῦ Θεοῦ, φιλόξενον εἶναι (ἐν
    γὰρ τῇ φιλοξενίᾳ εὑρίσκεται ἀγαθοποίησίς ποτε), μηδενὶ ἀντιτάσσεσθαι, ἡσύχιον εἶναι, ἐνδεέστερον γίνεσθαι
    πάντων ἀνθρώπων, πρεσβύτας σέβεσθαι, δικαιοσύνην ἀσκεῖν, ἀδελφότητα συντηρεῖν, ὕβριν ὑποφέρειν, μακρόθυμον
    εἶναι, μνησικακίαν μὴ ἔχειν, κάμνοντας τῇ ψυχῇ παρακαλεῖν, ἐσκανδαλισμένους ἀπὸ τῆς πίστεως μὴ ἀποβάλλεσθαι
    ἀλλ᾽ ἐπιστρέφειν καὶ εὐθύμους ποιεῖν, ἁμαρτάνοντας νουθετεῖν, χρεώστας μὴ θλίβειν ἐνδεεῖς, καὶ εἴ
    τινα τούτοις ὅμοιά ἐστι. 11. δοκεῖ σοι, φησί, ταῦτα ἀγαθὰ εἶναι; Τί γάρ, φημί, κύριε, τούτων ἀγαθώτερον;
    Πορεύου οὖν, φησίν, ἐν αὐτοῖς καὶ μὴ ἐγκρατεύου ἀπ᾽ αὐτῶν, καὶ ζήσῃ τῷ Θεῷ. 12. φύλασσε οὖν τὴν ἐντολὴν
    ταύτην· ἐὰν τὸ ἀγαθὸν ποιῇς καὶ μὴ ἐγκρατεύσῃ ἀπ᾽ αὐτοῦ, ζήσῃ τῷ Θεῷ, καὶ πάντες ζήσονται τῷ Θεῷ οἱ
    οὕτω ποιοῦντες. καὶ πάλιν ἐὰν τὸ πονηρὸν μὴ ποιῇς καὶ ἐγκρατεύσῃ ἀπ᾽ αὐτοῦ, ζήσῃ τῷ Θεῷ, καὶ πάντες
    ζήσονται τῷ Θεῷ ὅσοι ἐὰν ταύτας τὰς ἐντολὰς φυλάξωσι καὶ πορευθῶσιν ἐν αὐταῖς.
