  source_fidelity: ὅτι의 인과적 연결이 초안에서 빠졌고, οὐκ ἐφείσαντο를 ‘아끼지 않았습니다’로 옮긴 것은 현대 한국어에서 목적어 없이 매우 부자연스럽고 의미가 모호합니다. ‘가차 없이 대했습니다’는 상대를 봐주거나 해를 삼가지 않았다는 뜻을 자연스럽게 전달합니다. μηνίσεως에 ‘격한’을 더하는 것은 원문의 명시적 수식이 아니므로 ‘분개’로 절제했습니다.
  naturalness: ‘그들은 조롱하고도 아끼지 않았습니다’는 ‘-고도’가 양보·대조를 불필요하게 만들고 ‘아끼다’의 현대적 용법상 어색합니다. 인과절과 감정의 삼중 누적을 갖춘 문장으로 정리하면 합쇼체 문맥에서 자연스럽습니다.
  terminology: ὀργή, θυμός, μήνισις의 수사적 누적은 ‘분노와 격노와 분개’로 보존했습니다. 특정 교리적 의미를 덧붙이지 않았습니다. 각주에서는 μηνίσεως의 가능한 어감을 대안으로만 제시합니다.
  issues:
