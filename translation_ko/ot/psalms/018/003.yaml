theological_decisions:
- issue: 여호와 신명과 보호 은유의 밀도
  chosen_reading: 신명을 '야훼'로 옮기고, 바위·산성·구원자·반석·방패·뿔·요새의 반복 이미지를 그대로 살렸습니다.
  alternative_readings:
  - '''주님''으로 완화해 번역하기'
  - 보호 이미지를 한두 개로 압축하기
  rationale: 시편의 시적 누적은 하나님이 누구이신지와 어떻게 보호하시는지를 동시에 드러내므로, 은유의 중첩을 줄이지 않는 것이 본문 의미에 충실합니다.
