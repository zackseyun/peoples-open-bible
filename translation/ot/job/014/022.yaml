id: JOB.14.22
reference: Job 14:22
source:
  edition: WLC
  text: אַךְ בְּ֭שָׂר/וֹ עָלָ֣י/ו יִכְאָ֑ב וְ֝/נַפְשׁ֗/וֹ עָלָ֥י/ו תֶּאֱבָֽל־׃פ
translation:
  text: Only his own flesh feels pain[a], and his own soul mourns.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “his flesh upon him feels pain”; the same expression recurs with “his soul” in the second line.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  chosen: Only
  alternatives:
  - Only
  - indeed
  - but
  lexicon: HALOT
  rationale: The restrictive sense fits the contrast with the preceding statement that the dead person does not know what happens to his children.
- source_word: בְּשָׂרוֹ
  lemma: בָּשָׂר
  chosen: his flesh
  alternatives:
  - his body
  lexicon: HALOT
  rationale: בָּשָׂר literally means 'flesh.' In this context it refers to the man's bodily existence after death or in dying. 'Flesh' preserves the concrete Hebrew imagery better than the more interpretive 'body.'
- source_word: עָלָיו
  chosen: on him
  alternatives:
  - upon him
  - for himself
  - within him
  lexicon: HALOT
  rationale: The preposition עַל with pronominal suffix is retained in a relatively literal way. In English, 'his flesh on him' is unusual but intelligible and reflects the Hebrew idiom of bodily pain being experienced by the person himself.
- source_word: יִכְאָב
  chosen: feels pain
  alternatives:
  - hurts
  - is in pain
  - aches
  lexicon: HALOT
  rationale: A direct and idiomatic rendering of the verb’s experiential sense.
- source_word: נַפְשׁוֹ
  chosen: his soul
  alternatives:
  - his life
  - his self
  - his inner being
  lexicon: HALOT
  rationale: נֶפֶשׁ can denote soul, life, self, or inner being depending on context. Here paired with 'flesh,' it forms a body/inner-self parallel. 'Soul' best preserves that poetic contrast in English without flattening the anthropological tension.
- source_word: עָלָיו
  chosen: within him
  alternatives:
  - on him
  - for himself
  - over him
  lexicon: HALOT
  rationale: Although the same Hebrew preposition appears, strict repetition would sound awkward in English in the second colon. 'Within him' brings out the inward dimension of the parallel with נַפְשׁוֹ while still reflecting personal reference.
- source_word: תֶּאֱבָל
  chosen: mourns
  alternatives:
  - grieves
  - laments
  lexicon: HALOT
  rationale: Directly and naturally represents the Hebrew verb.
- source_word: בְּשָׂרוֹ עָלָיו
  chosen: his own flesh
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: The reflexive possessive gives natural English for the difficult self-referential phrase while retaining the concrete image of flesh.
- source_word: נַפְשׁוֹ עָלָיו
  chosen: his own soul
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This renders the repeated construction consistently and preserves the poetic parallelism; the wider range of נֶפֶשׁ is retained in the note.
