translation:
  language: ko
  text: 저의 모든 죄에서 저를 건져 주소서. 어리석은 자의 조롱거리가 되게 하지 마소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어리석은 자의 수치가 되게 하지 마소서.’ 히브리어 표현은 어리석은 자에게 조롱을 받는 대상이 되는 뜻으로도, 어리석음과 관련된 수치가 되는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 이제는
  - 그러나 이제
  lexicon: HALOT
  rationale: 현재의 전환을 나타내는 הזמן 부사로, 한국어에서는 간결한 ‘이제’가 담화 전환을 가장 자연스럽게 살립니다.
- source_word: מַה קִּוִּיתִי
  english_pob_choice: what do I wait for
