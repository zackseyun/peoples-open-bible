  meaning: Yahweh commands his warriors to reap and to tread the winepress, because the nations' wickedness has grown full and the time of judgment has come.
  meaning_decisions:
  - source_phrase: שִׁלְחוּ מַגָּל
    prior_rendering: Send in the sickle
    new_rendering: Swing the sickle
    rationale: “Send the sickle” is the Hebrew idiom for putting the sickle to work in the harvest. “Swing” says that in English and matches the rendering of the same image in Revelation 14.
  - source_phrase: בֹּאוּ רְדוּ
    prior_rendering: Come, go down
    new_rendering: Come, tread the grapes
    rationale: The next clause, “for the winepress is full”, shows the action is treading the press, and “come, go down” reads awkwardly in English. The Hebrew form fits either verb, so the other reading goes in a footnote.
  - source_phrase: כִּי רַבָּה רָעָתָם
    prior_rendering: for their evil is great
    new_rendering: for their wickedness is great
    rationale: The word names the nations' moral evil, not misfortune. “Wickedness” makes that plain and keeps the echo of Genesis 6:5, where the same Hebrew phrase is traditionally “the wickedness of man was great”.
  footnote_kinds:
    a: alternative_meaning
