  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/002.yaml
  text: Answering me, he says, "I," he says, "am appointed over repentance, and I give understanding to all who repent. Or does it not seem to you," he says, "that this very thing—to repent—is understanding? To repent," he says, "is great understanding. For the man who has sinned understands that he has done what is evil before the Lord, and the deed that he did rises up in his heart, and he repents and no longer does evil, but does good abundantly, and he humbles his own soul and afflicts it, because he sinned. You see then that repentance is great understanding."
translation:
  language: en
  text: He answered me, “I have been appointed to oversee reorientation[a], and I give understanding to everyone who reorients. Do you not see that reorientation itself is understanding? Indeed, to reorient is great understanding. A person who has sinned recognizes that he has done evil before the Lord. What he did rises in his heart, and he reorients. He stops doing evil and instead does much good. He humbles himself and afflicts his own soul because he sinned. So you see that reorientation is great understanding.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the deed that he did rises up in his heart
  simplified_phrase: What he did rises in his heart
  preserved_meaning: His sinful act comes into his inward awareness while the heart image remains intact.
  reasoning_layer_used: POB translation and source image
  rationale: The wording clarifies the deed’s reference without adding repetition.
translation_notes:
  risk_flags:
