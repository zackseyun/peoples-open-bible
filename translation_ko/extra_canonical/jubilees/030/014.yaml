  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. ዘቦ፡ ብእሲት의 소유·혼인 관계를 ‘아내로 둔’으로 옮긴 것은 영어 POB의 최신 검토와 원문에 부합합니다. 다만 ኢይነጽሕ와 ርኵስ의 결합은 정결/부정의 어휘쌍으로 유지하는 편이 더 직접적입니다.
  naturalness: ‘이스라엘에게 가증한 것입니다’는 이해되지만, 현대 한국어에서는 ‘이스라엘에게는 가증한 일입니다’가 더 자연스럽습니다. 또한 본문의 [a] 표지에는 제공된 한국어 각주가 없으므로 표지와 각주를 함께 정비해야 합니다.
  terminology: 제의적·도덕적 오염을 가리키는 ርኵስ에는 ‘부정함’을 유지하고, 그 해소에는 ‘정결하게 되다’를 사용했습니다. ‘이방 민족의 딸들’은 원문의 복수 표현을 보존합니다.
  issues:
  - severity: medium
    issue: 본문에 [a] 각주 표지가 있으나 한국어 각주 세트가 제공되지 않았습니다.
