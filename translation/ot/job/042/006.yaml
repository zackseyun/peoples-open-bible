id: JOB.42.6
reference: Job 42:6
source:
  edition: WLC
  text: עַל כֵּ֭ן אֶמְאַ֣ס וְ/נִחַ֑מְתִּי עַל עָפָ֥ר וָ/אֵֽפֶר־־׃פ
translation:
  text: Therefore I recant, and I feel regret[b] in dust and ashes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is concise and debated. The first verb means “reject” or “despise” but has no stated object; “I despise myself” is also possible. The second verb may mean “repent,” “relent,” or “be comforted,” and the final phrase may be read “in dust and ashes” or “concerning dust and ashes.”
    reason: alternative_reading
  - marker: b
    text: Retain feel regret under the existing interpretation, with alternative readings preserved. This review does not adjudicate the disputed object or preposition of Jobs statement.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  chosen: Therefore
  alternatives:
  - For this reason
  - Therefore then
  lexicon: HALOT
  rationale: The phrase marks Job's conclusion from the preceding divine speeches and his confession in v. 5. 'Therefore' is natural modern English and preserves the inferential force.
- source_word: אֶמְאַס
  chosen: I recant
  alternatives:
  - I reject
  - I recant
  - I despise
  lexicon: HALOT
  rationale: This contextual rendering expresses withdrawal without inserting “myself” or another disputed object into the text; the verb’s more direct lexical senses are retained in the note.
- source_word: וְנִחַמְתִּי
  chosen: and I feel regret
  alternatives:
  - and I repent
  - and I am sorry
  - and I relent
  - and I am comforted
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Retain feel regret under the existing interpretation, with alternative readings preserved. This review does not adjudicate the disputed object or preposition of Jobs statement. Contextual editorial assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: עַל
  chosen: in
  alternatives:
  - 'on'
  - over
  - concerning
  lexicon: HALOT
  rationale: The preposition literally means 'on/upon/over,' but in the idiom with 'dust and ashes' English 'in' best conveys Job's posture or condition. A more literal 'on dust and ashes' is possible, but less idiomatic in contemporary English.
- source_word: עָפָר וָאֵפֶר
  chosen: dust and ashes
  alternatives:
  - dust and ash
  lexicon: HALOT
  rationale: This fixed expression denotes mortality, humiliation, and mourning. The plural 'ashes' is standard idiomatic English for the pair and preserves the traditional force of the expression.
