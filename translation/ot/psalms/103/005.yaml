id: PSA.103.5
reference: Psalms 103:5
source:
  edition: WLC
  text: הַ/מַּשְׂבִּ֣יַע בַּ/טּ֣וֹב עֶדְיֵ֑/ךְ תִּתְחַדֵּ֖שׁ כַּ/נֶּ֣שֶׁר נְעוּרָֽיְ/כִי׃
translation:
  text: who satisfies you[a] with good things; your youth is renewed like the eagle’s[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “your adornment,” an obscure expression here; other understandings include “you throughout your life” and “your mouth.”
    reason: lexical_alternative
  - marker: b
    text: Possibly, “vulture’s”; the Hebrew names a large bird of prey.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּשְׂבִּיעַ
  chosen: who satisfies
  alternatives:
  - who fills
  - who satiates
  lexicon: HALOT
  rationale: Hiphil participle of שׂבע in a relative-like sequence continuing the description of the LORD's actions. 'Satisfies' best conveys providing fully enough, without the overly physical sense of 'satiates' or the weaker 'fills.'
- source_word: בַּטּוֹב
  chosen: with good
  alternatives:
  - with good things
  - with what is good
  lexicon: HALOT
  rationale: טוֹב here is a substantive adjective. 'With good' is concise and close to the Hebrew; 'with good things' is interpretive but possible. The singular collective sense is preserved in English without over-specifying objects.
- source_word: עֶדְיֵךְ
  chosen: you
  alternatives:
  - your adornment
  - your mouth
  - your desire
  lexicon: HALOT
  rationale: The literal pointed form is “your adornment,” but it is obscure in this clause. “You” supplies the likely contextual sense while the note candidly preserves the textual difficulty and major alternatives.
- source_word: תִּתְחַדֵּשׁ
  chosen: is renewed
  alternatives:
  - is made new
  - renews itself
  lexicon: HALOT
  rationale: Hitpael/imperfect of חדש, with passive-reflexive nuance. English passive 'is renewed' is the most natural rendering in context.
- source_word: כַּנֶּשֶׁר
  chosen: like the eagle’s
  alternatives:
  - like an eagle's
  lexicon: HALOT
  rationale: The English possessive naturally completes the comparison with the renewed youth; the note preserves the lexical identification issue.
- source_word: נְעוּרָיִכִי
  chosen: your youth
  alternatives:
  - your youthful vigor
  - your young age
  lexicon: HALOT
  rationale: Plural abstract noun meaning 'youth/youthful vigor' with 2fs suffix. 'Your youth' is idiomatic and preserves the poetic force; the sense includes renewed vigor, not merely chronological age.
