id: JOB.18.11
reference: Job 18:11
source:
  edition: WLC
  text: סָ֭בִיב בִּֽעֲתֻ֣/הוּ בַלָּה֑וֹת וֶ/הֱפִיצֻ֥/הוּ לְ/רַגְלָֽי/ו׃
translation:
  text: Terrors frighten him on every side and chase him at his heels[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “at his feet.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סָבִיב
  chosen: on every side
  alternatives:
  - all around
  - round about
  lexicon: HALOT
  rationale: Adverbial noun indicating surrounding from all directions. 'On every side' is idiomatic modern English and preserves the image of encirclement.
- source_word: בִּעֲתֻהוּ
  chosen: frighten him
  alternatives:
  - terrify him
  - startle him
  lexicon: HALOT
  rationale: From בעת, to terrify or suddenly alarm. 'Frighten him' fits the poetic parallelism with 'terrors' while avoiding an overly wooden repetition such as 'terrors terrify him.'
- source_word: בַלָּהוֹת
  chosen: Terrors
  alternatives:
  - horrors
  - dreadful things
  lexicon: HALOT
  rationale: Plural noun denoting terrors or sudden alarms. Capitalization is not theological but stylistic at line opening. 'Terrors' is the most direct and conventional rendering in wisdom poetry.
- source_word: וֶהֱפִיצֻהוּ
  chosen: and chase him
  alternatives:
  - and drive him away
  - and disperse him
  lexicon: HALOT
  rationale: In this context the causative expression portrays relentless pursuit or driving, rather than literal dispersal.
- source_word: לְרַגְלָיו
  chosen: at his heels
  alternatives:
  - at his heels
  - toward his feet
  - wherever he steps
  lexicon: HALOT
  rationale: This natural English pursuit idiom renders the contextual force while the note preserves the literal wording.
