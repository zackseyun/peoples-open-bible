  from: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
  to: For three days the Egyptians could not see one another, and no one moved from where they were; but all the Israelites had light where they lived.
  rationale: The earlier lexical discussion correctly recognized the reciprocal expression and the locational idiom. I carry those meanings further into natural English and choose the contextual inability to see, despite the earlier preference for the formally closer “did not.”
