  rationale: The Hebrew depicts the realm of the dead in poetic judgment language. The translation preserves the imagery and theological tension without importing later doctrinal specificity not explicit in the text.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
