source:
  edition: WLC
  text: נ֤וֹדַ֨ע יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּ/פֹ֣עַל כַּ֭פָּי/ו נוֹקֵ֣שׁ רָשָׁ֑ע הִגָּי֥וֹן סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/016.yaml
  text: Yahweh is known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
  footnotes:
  - marker: a
    text: Or “Yahweh has made himself known.” The Hebrew may be read as stative/passive (“is known”) or resultative (“has made himself known”).
    reason: alternative_reading
  - marker: b
    text: “Higgaion” is an uncertain musical or liturgical term; proposed senses include “meditation” and “resounding music.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 자신을 알리셨습니다.[a] 심판을 행하셨습니다. 악인은 자기 손으로 한 일에 걸려들었습니다. 힉가욘.[b] 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼께서 알려지셨습니다.” 히브리어 נוֹדַע는 상태를 나타내는 수동형(‘알려지셨다’)으로도, 그 결과를 나타내는 뜻(‘자신을 알리셨다’)으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘힉가욘’은 음악 또는 예배와 관련된 표지로 보이지만 정확한 뜻은 확실하지 않습니다. ‘묵상’ 또는 ‘울림 있는 연주’ 같은 뜻으로 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ
  english_pob_choice: have sunk
  chosen_korean: 빠졌습니다
  alternatives_korean:
  - 가라앉았습니다
  - 잠겼습니다
  lexicon: HALOT
  rationale: 물을 뜻하는 단순한 ‘가라앉다’보다, 시편의 비유적 파멸 이미지를 한국어에서 자연스럽게 살리는 ‘빠지다’가 원문의 추락·몰락 감각을 잘 전달합니다.
- source_word: גוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들이
  alternatives_korean:
  - 나라들이
  - 열방이
  lexicon: HALOT
  rationale: 여기서는 적대 집단 전체를 가리키는 복수 명사이므로, 시적 문맥에서 자연스러운 ‘민족들’이 원문의 집합적 의미를 무리 없이 옮깁니다.
- source_word: רַגְלָם
  english_pob_choice: their own foot
  chosen_korean: 그들의 발
  alternatives_korean:
  - 그들 자신의 발
  - 발
  lexicon: HALOT
  rationale: 히브리어는 단수형 ‘그들의 발’로 되어 있어 집합적 단수의 역설을 담고 있으므로, 한국어에서는 과도한 해설 없이도 그 집단 귀속을 드러내는 ‘그들의 발’을 택했습니다.
theological_decisions:
- issue: 자기들이 만든 함정에 스스로 걸리는 보응의 역설
  chosen_reading: 원문이 강조하는 ‘자기들이 판 구덩이’와 ‘자기들이 숨긴 그물’의 자기파멸적 보응을 그대로 살렸습니다.
  alternative_readings:
  - ‘자업자득’처럼 해석적으로 압축하기
  - 도덕적 교훈을 덧붙여 풀어쓰기
  rationale: 시편의 시적 역설은 설명보다 이미지 자체가 힘을 갖기 때문에, 원인이 결과로 되돌아오는 구조를 직역에 가깝게 보존하는 것이 더 적절합니다.
  doctrine_reference: 잠언적 보응 원리 / 시편의 시적 심판 이미지
