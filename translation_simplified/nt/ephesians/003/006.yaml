translation:
  language: en
  text: that the Gentiles[a] share the same inheritance, belong to the same body, and share in the promise in Christ Jesus[b] through the gospel,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Gentiles are the non-Jewish peoples whom God includes with Israel in his saving promise.
    reason: simplification_note
  - marker: b
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: fellow heirs
  simplified_phrase: share the same inheritance
  preserved_meaning: Gentiles receive the inheritance together with God’s existing people.
  reasoning_layer_used: Lexical decision for συγκληρονόμα and the Jew-Gentile context
  rationale: The rewrite explains the less familiar word “heirs” while preserving shared inheritance.
- pob_phrase: fellow members of the body
  simplified_phrase: belong to the same body
  preserved_meaning: Gentiles are incorporated with others into one body.
  reasoning_layer_used: Lexical decision for σύσσωμα and the applied revision
  rationale: The wording is natural English and keeps Paul’s body image.
- pob_phrase: fellow partakers of the promise
  simplified_phrase: share in the promise
  preserved_meaning: Gentiles jointly participate in the singular covenant promise.
  reasoning_layer_used: Lexical decisions for συμμέτοχα and τῆς ἐπαγγελίας
  rationale: The common verb “share” clearly expresses joint participation without archaic wording.
translation_notes:
  risk_flags:
  - risk: Repeating “share” reduces some of the Greek compound-word rhythm.
    mitigation: The repetition creates clear English parallelism while preserving all three distinct claims.
