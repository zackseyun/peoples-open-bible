  text: 야훼께서 재판관이 되셔서 나와 당신 사이를 판단하시고, 보시고 나의 송사를 변호하시며, 당신의 손에서 나를 구해 주시기를 바랍니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 본문은 사울에게 말하는 직접 청원으로, POB 기본 원칙에 따라 신명사형을 한국어 학술 음역인 ‘야훼’로 옮겨 원문 지시 대상을 분명히 했습니다.
- source_word: לְדַיָּן
  english_pob_choice: be judge
  chosen_korean: 재판관이 되셔서
  alternatives_korean:
  - 판단하시고
  - 심판자가 되셔서
  lexicon: דָּיַן / שׁפט
  rationale: 단순한 내적 판단보다 분쟁을 가리는 공적 심판 역할이 강조되므로, ‘재판관’으로 풀어 원문의 법정 이미지를 살렸습니다.
- source_word: וְיֵרֶא ... וְיָרֵב אֶת רִיבִי
  english_pob_choice: see and plead my case
  chosen_korean: 보시며 나의 사정을 변론하시고
  alternatives_korean:
  - 보시고 나의 송사를 변호하시고
  - 보시며 나의 사건을 다투시고
  lexicon: ראה / ריב
  rationale: ‘보다’와 ‘다투다/변론하다’의 병행을 살리되, 한국어에서 자연스러운 법정 어휘인 ‘변론하시고’로 옮겨 다윗의 억울한 송사를 드러냈습니다.
- source_word: מִיָּדֶךָ
  english_pob_choice: from your hand
  chosen_korean: 당신의 손에서
  alternatives_korean:
  - 당신 손에서
  - 당신의 손아귀에서
  lexicon: יד
  rationale: 히브리어 관용구를 직역하여 폭력적 통제의 출처를 드러내되, 문맥상 과도한 확대인 ‘손아귀’는 피했습니다.
theological_decisions:
- issue: יהוה의 호칭을 한국어로 어떻게 표기할지
  chosen_reading: 본문에는 ‘야훼’를 사용했습니다.
  alternative_readings:
  - ‘주님’으로 중립화
  - ‘여호와’로 전통화
  rationale: 이 구절은 야훼를 분명한 인격적 재판관으로 호소하는 맥락이어서, POB 기본 번역 원칙에 따라 신명사형을 직접 표기했습니다.
