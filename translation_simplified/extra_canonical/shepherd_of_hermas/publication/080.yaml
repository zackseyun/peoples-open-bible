  text: Εἶδον ἓξ ἄνδρας ἐληλυθότας ὑψηλοὺς καὶ ἐνδόξους καὶ ὁμοίους τῇ ἰδέᾳ· καὶ ἐκάλεσαν πλῆθός τι ἀνδρῶν.
    κἀκεῖνοι δὲ οἱ ἐληλυθότες ὑψηλοὶ ἦσαν ἄνδρες καὶ καλοὶ καὶ δυνατοί· καὶ ἐκέλευσαν αὐτοὺς οἱ ἓξ ἄνδρες
    οἰκοδομεῖν ἐπάνω τῆς πέτρας πύργον τινά. ἦν δὲ θόρυβος τῶν ἀνδρῶν ἐκείνων μέγας τῶν ἐληλυθότων οἰκοδομεῖν
    τὸν πύργον, ὧδε κἀκεῖσε περιτρεχόντων κύκλῳ τῆς πύλης· 2. αἱ δὲ παρθένοι ἑστηκυῖαι κύκλῳ τῆς πύλης
    ἔλεγον τοῖς ἀνδράσι σπεύδειν τὸν πύργον οἰκοδομεῖσθαι. ἐκπεπετάκεισαν δὲ τὰς χεῖρας αἱ παρθένοι ὡς
    μέλλουσαί τι λαμβάνειν παρὰ τῶν ἀνδρῶν. 3. οἱ δὲ ἓξ ἄνδρες ἐκέλευον ἐκ βυθοῦ τινὸς λίθους ἀναβαίνειν
    καὶ ὑπάγειν εἰς τὴν οἰκοδομὴν τοῦ πύργου. ἀνέβησαν δὲ λίθοι δέκα τετράγωνοι λαμπροί, [μὴ] λελατομημένοι.
    4. οἱ δὲ ἓξ ἄνδρες ἐκάλουν τὰς παρθένους καὶ ἐκέλευαν αὐτὰς τοὺς λίθους πάντας τοὺς μέλλοντας εἰς
    τὴν οἰκοδομὴν ὑπάγειν τοῦ πύργου βαστάζειν καὶ διαπορεύεσθαι διὰ τῆς πύλης, καὶ ἐπιδιδόναι τοῖς ἀνδράσι
    τοῖς μέλλουσιν οἰκοδομεῖν τὸν πύργον. 5. αἱ δὲ παρθένοι τοὺς δέκα λίθους τοὺς πρώτους τοὺς ἐκ τοῦ
    βυθοῦ ἀναβάντας ἐπετίθουν ἀλλήλαις καὶ κατὰ ἕνα λίθον ἐβάσταζον ὁμοῦ.
