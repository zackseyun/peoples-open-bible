id: PSA.9.12
reference: Psalms 9:12
source:
  edition: WLC
  text: כִּֽי דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣/ם זָכָ֑ר לֹֽא שָׁ֝כַ֗ח צַעֲקַ֥ת עניים־־׃
translation:
  text: For he who demands an accounting for bloodshed remembers the afflicted[a]; he does not forget their cry.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “the poor.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  lexicon: HALOT
  rationale: Introduces the ground or reason for the preceding statement. 'For' fits the psalm's explanatory flow in English.
- source_word: דֹרֵשׁ דָּמִים
  chosen: the one who calls bloodshed to account
  alternatives:
  - he who requires blood
  - the one who seeks out bloodguilt
  - the avenger of blood
  lexicon: HALOT
  rationale: Preserves the idiom of requiring an accounting for shed blood without narrowing it to vengeance.
- source_word: אוֹתָם
  chosen: them
  alternatives:
  - him
  lexicon: HALOT
  rationale: The ketiv/qere tradition reflected in the morphology supports the plural object, referring to the afflicted/poor as a group. The plural is retained in English.
- source_word: זָכָר
  chosen: remembers
  alternatives:
  - has remembered
  - calls to mind
  lexicon: HALOT
  rationale: 'Though formally perfect, in poetic context it expresses a present, characteristic action of God: he remembers. This reads naturally in English while preserving the sense.'
- source_word: לֹא שָׁכַח
  chosen: does not forget
  alternatives:
  - has not forgotten
  lexicon: HALOT
  rationale: Negated perfect in parallel with זָכָר; present English best conveys the ongoing truth in the psalm's praise.
- source_word: צַעֲקַת
  chosen: the cry
  alternatives:
  - the outcry
  - the plea
  lexicon: HALOT
  rationale: '''Cry'' is the most direct and idiomatic rendering for a distress call to God. ''Outcry'' is possible but slightly less natural here.'
- source_word: עניים
  chosen: the afflicted
  alternatives:
  - the poor
  - the humble
  - the oppressed
  lexicon: HALOT
  rationale: Appropriate contextual rendering; the note honestly preserves “the poor” as an alternative.
