  to: There is the sea, great and wide[a]; there are swarming things without number, living creatures both small and great.
  rationale: רְחַב יָדַיִם is an idiom of breadth, not an English image that can be preserved as “broad of hands.” “Wide” accurately renders its sense, and the note preserves the literal Hebrew expression. Repeating “there” represents שָׁם directly, and “both small and great” is natural English for the inclusive size-pairing.
