lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 응답했습니다
  lexicon: BDAG
  rationale: 담화에서의 일반적인 응답 동사로, 한국어 문체상 직접화법 앞에 '대답하여 말했습니다'를 넣어 원문 참여·발화 구조를 보존합니다.
- source_word: βαπτίζω
  english_pob_choice: baptize
  chosen_korean: 세례를 베풉니다
  alternatives_korean:
  - 침수합니다
  - 세례를 줍니다
  lexicon: BDAG
  rationale: 한국어 성경 전통과 현대 독자 어감을 고려하여 '세례'를 사용했습니다. '베풀다'는 동사로서 자연스러운 표현이며 원문의 종교적·의례적 의미를 보존합니다.
- source_word: ἐν ὕδατι
  english_pob_choice: in water
  chosen_korean: 물로
  alternatives_korean:
  - 물에
  - 물로서
  lexicon: BDAG
  rationale: 그리스어 ἐν + 여격의 관습적 표현을 한국어로 자연스럽게 전달하면서 문맥상 '물'을 매개로 하는 행위를 드러내기 위해 '물로'를 선택했습니다. '물에'는 침수 의미를 강조할 수 있어 신학적 과잉해석을 피하기 위해 배제했습니다.
- source_word: μέσος ὑμῶν
  english_pob_choice: among you
  chosen_korean: 여러분 가운데
  alternatives_korean:
  - 여러분 중에
  - 너희 가운데
  lexicon: BDAG
  rationale: 현대 한국어의 정중한 지시 표현으로 '여러분 가운데'를 사용해 원문의 '그룹 내부에 존재함'이라는 의미를 살리고, 번역체의 정중성을 유지합니다.
theological_decisions:
- issue: Identity of the unnamed one standing among them
  chosen_reading: 본문은 지시 대상을 특정하지 않은 채 긴장감을 유지하므로, 번역문에서도 '한 사람'으로 일반적으로 처리하여 메시아 지칭을 확정하지 않습니다.
  alternative_readings:
  - 메시아로 명시적으로 번역한다 ('메시아가 서 있다').
  - 지시 대명사 '그'나 '그분'으로 번역하여 화자 관점에서 이미 알고 있는 인물처럼 처리한다.
  rationale: 본문 자체가 지칭 대상을 이름으로 밝히지 않고 청중의 무지를 지적하는 수사적 효과를 가지고 있습니다(문맥상 예수임을 암시하나 이 구절은 의도적으로 이름을 제공하지 않음). 번역은 이 서사적 긴장을 보존해야 하므로 일반적 지시어로 남깁니다.
  doctrine_reference: '텍스트 비평적·서사적 보존: 본문이 의도적으로 미확정성을 유지하므로 신학적 결론을 번역에서 섣불리 도출하지 않습니다.'
