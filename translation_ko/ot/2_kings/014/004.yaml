  source_fidelity: 본문 번역은 히브리어의 역접(רַק), 산당이 제거되지 않았다는 진술, 그리고 백성이 계속 제사를 드리고 분향했다는 지속적 행위를 충실히 반영합니다. 다만 각주 b는 히브리어 본문에서 뒷받침되지 않는 대안을 제시하며, 한국어 본문에서는 실제로 동일한 표현을 반복할 뿐이므로 삭제하는 것이 정확합니다.
