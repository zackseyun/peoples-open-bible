  text: '1 And it happened after seven days that the word of God came to me and said to me:


    2 “Tell Jeremiah to go and accompany the captivity of the people as far as Babylon.


    3 But you, remain here in the desolation of Zion, and after these days I will show you what is to happen in the latter times.”


    4 And I spoke to Jeremiah my brother as the Lord had commanded me.


    5 And he went with the people, but I, Baruch, returned and sat before the gates of the temple, and I lifted up this lament over Zion and said:


    6 “Blessed is he who was not born,

    or he who was born and died.


    7 But as for us who live, woe to us,

    because we have seen the afflictions of Zion

    and what has happened to Jerusalem.


    8 I will call the Sirens from the sea,

    and you Liliths, come from the desert,

    and you demons and dragons from the forests:

    awake, gird up your loins for mourning,

    and take up lamentation with me,

    and mourn with me.


    9 You farmers, do not sow again;

    and you, O earth, why do you still give the fruit of your produce?

    Keep within you the sweetness of your nourishment.


    10 And you, vine, why do you still give your wine?

    For no offering from you will again be received in Zion,

    and no firstfruits will again be accepted.


    11 And you, heavens, hold back your dew,

    and do not open the treasuries of rain.


    12 And you, sun, hold back the light of your rays;

    and you, moon, extinguish the abundance of your light.

    For why should light rise again,

    where the light of Zion has been darkened?


    13 And you, bridegrooms, do not enter;

    and let not the virgins adorn themselves.

    And you, women, do not pray to bear children.


    14 Rather, let the barren rejoice,

    and let those who have no children be glad;

    but let those who have children grieve.


    15 For why should they bear in pain

    and bury in groaning?


    16 Or why should people again have children,

    or why should the seed of their nature again be named,

    when this mother lies desolate

    and her children have gone away into captivity?


    17 From now on, do not again speak of beauty,

    and do not discourse of loveliness ...”'
translation:
  language: ko
  text: '1. 일곱 날이 지난 뒤, 하나님의 말씀이 내게 임하여 내게 말씀하셨습니다.


    2. "예레미야에게 말하여, 그가 가서 백성의 포로 행렬을 바빌론까지 따라가게 하십시오.


    3. 그러나 당신은 여기 시온의 황폐함 가운데 머물러 있으십시오. 그리고 이 날들이 지난 뒤, 내가 당신에게 마지막 때에 일어날 일을 보여 주겠습니다."


    4. 나는 주님께서 내게 명하신 대로 내 형제 예레미야에게 말했습니다.


    5. 그가 백성과 함께 갔고, 나는 바룩으로서 돌아와 성전 문들 앞에 앉아 시온을 두고 이 슬픔의 노래를 높여 이렇게 말했습니다:


    6. "복된 사람은 그가 태어나지 않은 사람이며, 또는 태어났다가 죽은 사람입니다.


    7. 그러나 살아 있는 우리에게는 화가 있습니다. 시온의 고난과 예루살렘에 일어난 일을 우리가 보았기 때문입니다.


    8. 나는 바다에서 사이렌들을 부를 것이며, 너희 릴리트들아, 광야에서 나오너라. 그리고 너희 악령들과 숲의 용들아, 깨어나라. 슬픔을 위해 너희 허리를 동이고, 나와 함께 애가를 시작하고, 나와 함께 슬퍼하라.


    9. 너희 농부들아, 다시 씨를 뿌리지 말라. 너희 땅아, 왜 여전히 네 소산의 열매를 내느냐? 너는 네 양식의 달콤함을 네 안에 간직하여라.


    10. 너 포도나무야, 왜 여전히 네 포도주를 내느냐? 너에게서 나오는 어떤 예물도 다시는 시온에서 받아들여지지 않을 것이며, 첫 열매도 다시는 받아들여지지 않을 것이다.


    11. 하늘들아, 이슬을 거두고 비의 곳간을 열지 말라.


    12. 해님아, 네 빛의 광선을 거두어라. 달아, 네 빛의 충만함을 꺼 버려라. 시온의 빛이 어두워진 곳에서 어찌 빛이 다시 떠오를 수 있겠느냐?"


    13. "신랑들아, 들어오지 말라. 처녀들이 자신을 꾸미게 하지 말라. 여자들아, 아이를 낳게 해 달라고 기도하지 말라.


    14. 오히려 아이 없는 여인이 기뻐하고, 자녀가 없는 사람들이 즐거워하라. 그러나 자녀가 있는 사람들은 슬퍼하라.


    15. 그들이 어찌 고통 가운데 낳고, 신음 가운데 묻어야 하겠느냐?


    16. 아니, 사람들이 어찌 다시 자녀를 낳겠느냐? 또는 그들의 본성의 씨가 어찌 다시 불릴 수 있겠느냐? 이 어머니가 황폐하게 누워 있고, 그녀의 자녀들이 포로로 사라져 갔는데도 말입니다.


    17. 이제부터는 다시는 아름다움을 말하지 말고, 아리따움을 논하지도 말라 …"[a]'
