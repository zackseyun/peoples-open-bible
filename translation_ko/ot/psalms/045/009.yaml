  text: בְּנ֣וֹת מְ֭לָכִים בְּ/יִקְּרוֹתֶ֑י/ךָ נִצְּבָ֥ה שֵׁגַ֥ל לִֽ֝/ימִינְ/ךָ֗ בְּ/כֶ֣תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/009.yaml
  text: Daughters of kings are among your honored women[b]; at your right hand stands the queen in gold of Ophir[a].
  footnotes:
  - marker: a
    text: '''Gold of Ophir'' refers to fine gold associated with Ophir, a place renowned in the Old Testament for its wealth and gold.'
    reason: cultural_note
  - marker: b
    text: Or 'among your precious ones' or 'among your noble ladies' for the difficult phrase 'among your honored women.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕들의 딸들이 당신의 귀한 여인들 가운데 있고[a], 오빌의 금으로 단장한 왕비가 당신 오른편에 서 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 귀한 여인들 가운데’는 난해한 표현입니다. ‘당신의 귀한 이들 가운데’ 또는 ‘당신의 고귀한 여인들 가운데’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘오빌의 금’은 구약에서 부와 질 좋은 금으로 알려진 오빌과 관련된 정금(순금)을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מֹר
  english_pob_choice: myrrh
  chosen_korean: 몰약
  alternatives_korean:
