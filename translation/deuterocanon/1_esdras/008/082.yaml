translation:
  text: and do not take their daughters for your sons, and do not seek peace with them[a] all your days, so that, having become
    strong, you may eat the good things of the land and leave it as an inheritance to your sons forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'seek peaceful relations with them'; the Greek speaks of making peace with them.
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβητε
  chosen: take
  alternatives:
  - marry
  - take in marriage
  lexicon: BDAG
  rationale: The verb literally means 'take.' In this marriage context, English 'take' preserves the source wording while
    naturally implying taking in marriage when paired with 'their daughters for your sons.' 'Marry' would be more explicit
    but slightly more interpretive.
- source_word: ζητήσετε
  chosen: seek
  alternatives:
  - pursue
  - strive for
  lexicon: BDAG
  rationale: A straightforward rendering of the future verb. 'Seek' keeps the prohibition broad and close to the Greek.
- source_word: εἰρηνεῦσαι τὰ πρὸς αὐτούς
  chosen: peace with them
  alternatives:
  - to be at peace with them
  - their welfare
  - their peace and prosperity
  lexicon: BDAG
  rationale: The Greek expression is rendered 'peace with them' in this unit. The selected Greek, not an approximate cross-reference,
    controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: τὸν ἅπαντα χρόνον
  chosen: all your days
  alternatives:
  - forever
  - all your days
  - at any time
  lexicon: BDAG
  rationale: Active rendering synchronized with this printed Greek unit and its main English; the prior lexicon label is historical,
    not a new consultation.
- source_word: ἵνα ἰσχύσαντες
  chosen: having become strong
  alternatives:
  - being strengthened
  - growing strong
  lexicon: BDAG
  rationale: The aorist participle from ἰσχύω denotes becoming strong or prevailing. 'Having become strong' preserves the
    participial sequence leading into the purpose/result clause.
- source_word: φάγητε τὰ ἀγαθὰ τῆς γῆς
  chosen: you may eat the good things of the land
  alternatives:
  - enjoy the good of the land
  - eat the produce of the land
  lexicon: BDAG
  rationale: A fairly literal rendering that still reads naturally. 'Good things' preserves the broad sense of ἀγαθά, which
    can include produce and prosperity.
- source_word: κατακληρονομήσητε
  chosen: leave it as an inheritance
  alternatives:
  - leave it as an inheritance
  - possess it as an inheritance
  lexicon: BDAG
  rationale: Active rendering synchronized with this printed Greek unit and its main English; the prior lexicon label is historical,
    not a new consultation.
- source_word: τοῖς υἱοῖς ὑμῶν
  chosen: to your sons
  alternatives:
  - for your sons
  - to your children
  lexicon: LSJ
  rationale: The Greek expression is rendered 'to your sons' in this unit. The selected Greek, not an approximate cross-reference,
    controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: ἕως αἰῶνος
  chosen: forever
  alternatives:
  - for ever
  - unto the age
  - perpetually
  lexicon: LSJ
  rationale: This idiom commonly expresses enduring duration. 'Forever' gives clear modern English while preserving the sense
    of permanence. 'Unto the age' would be overly wooden here.
