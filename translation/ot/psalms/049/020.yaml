id: PSA.49.20
reference: Psalms 49:20
source:
  edition: WLC
  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
translation:
  text: A man who is honored but lacks understanding is like the beasts that perish[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “is like the beasts; they are alike,” taking the final Hebrew verb to express likeness rather than perishing.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  chosen: A man
  alternatives:
  - humankind
  - a man
  lexicon: HALOT
  rationale: Naturally represents the generic singular in English.
- source_word: בִּיקָר
  chosen: who is honored
  alternatives:
  - in splendor
  - in wealth
  - in preciousness
  lexicon: HALOT
  rationale: Idiomatic English for being in a state of honor or high status.
- source_word: וְלֹא יָבִין
  chosen: but lacks understanding
  alternatives:
  - and does not understand
  - but does not discern
  lexicon: HALOT
  rationale: Naturally conveys the finite verb and contextual contrast.
- source_word: נִמְשַׁל
  chosen: is like
  alternatives:
  - is compared to
  - is likened to
  lexicon: HALOT
  rationale: The Niphal of משל here expresses being likened or compared. 'Is like' is the most natural English equivalent in a poetic line and avoids stiffness.
- source_word: כַּבְּהֵמוֹת
  chosen: the beasts
  alternatives:
  - animals
  - cattle
  lexicon: HALOT
  rationale: A broad and register-appropriate rendering in this poetic comparison.
- source_word: נִדְמוּ
  chosen: that perish
  alternatives:
  - that are destroyed
  - they are like them
  - have become like them
  lexicon: HALOT
  rationale: The psalm’s mortality theme supports this contextual sense, while the note preserves the possible likeness sense.
