  source_review: state/reviews/gemini/phase9_greek/extra_canonical/1_clement/054/004.job-70775.json
  category: mistranslation
  tier: 2
  from: live out the unrepented citizenship
  to: live the unregretted way of life
  rationale: The adjective 'ἀμεταμέλητος' means 'not to be regretted' or 'without regret' (BDAG). In English, 'unrepented' almost exclusively refers to sins that have not been repented of, which completely reverses the author's meaning of a righteous life. Furthermore, the cognate accusative construction 'πολιτευόμενοι... πολιτείαν' here refers to conducting one's 'way of life' or 'conduct' (BDAG s.v. πολιτεία 2), rather than 'citizenship' in a strict political sense.
