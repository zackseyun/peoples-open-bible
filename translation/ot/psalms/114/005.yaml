id: PSA.114.5
reference: Psalms 114:5
source:
  edition: WLC
  text: מַה לְּ/ךָ֣ הַ֭/יָּם כִּ֣י תָנ֑וּס הַ֝/יַּרְדֵּ֗ן תִּסֹּ֥ב לְ/אָחֽוֹר־׃
translation:
  text: Why do you flee, sea? Why do you turn back, Jordan?
  philosophy: dynamic
lexical_decisions:
- source_word: מַה לְּךָ
  chosen: What is the matter with you
  alternatives:
  - What ails you
  - What is the matter with you
  - Why
  lexicon: HALOT
  rationale: This is the natural English idiom for the Hebrew rhetorical question; the literal form is retained in the note.
- source_word: הַיָּם
  chosen: sea
  alternatives:
  - the sea
  lexicon: HALOT
  rationale: In direct address, English naturally uses the bare noun.
- source_word: כִּי
  chosen: that
  alternatives:
  - for
  - because
  - why
  lexicon: HALOT
  rationale: 'Here כִּי introduces the content/result of the rhetorical question: ''that you flee.'' Rendering it as ''that'' fits the English construction after ''What is with you...?'' and avoids the more causal sense ''because/for,'' which is less natural here.'
- source_word: תָנוּס
  chosen: you flee
  alternatives:
  - you run away
  - you retreat
  lexicon: HALOT
  rationale: From נוּס, 'to flee.' 'You flee' is the most direct and formally close rendering, matching the psalm's personification of the sea.
- source_word: הַיַּרְדֵּן
  chosen: Jordan
  alternatives:
  - the Jordan
  lexicon: HALOT
  rationale: The proper name is directly addressed and needs neither an article nor an added vocative particle.
- source_word: תִּסֹּב
  chosen: you turn back
  alternatives:
  - you turn around
  - you are turned back
  - you go back
  lexicon: HALOT
  rationale: From סבב/סוּב in this context, the sense is turning back or reversing course. 'You turn back' is idiomatic, concise, and fits the parallel with 'you flee.'
- source_word: לְאָחוֹר
  chosen: back
  alternatives:
  - backward
  - to the rear
  lexicon: HALOT
  rationale: The adverb means 'back/backward.' 'Back' is the most natural modern English collocation with 'turn' while preserving the sense.
