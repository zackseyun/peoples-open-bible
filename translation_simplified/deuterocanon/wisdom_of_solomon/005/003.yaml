translation:
  language: en
  text: 'As they reconsider[a], they will say among themselves and groan because their spirits are in anguish: “This is the one we once mocked.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Retain reconsidering: the speakers reassess their ridicule in anguish. Do not assert a saving conversion or remove the anguish.'
    reason: lexical_alternative
