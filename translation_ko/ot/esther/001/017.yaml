  source_fidelity: 히브리어의 דְבַר הַמַּלְכָּה(‘왕후의 일/사안’)와 יֵצֵא(‘퍼져 나가다’), 그리고 אָמַר לְהָבִיא(‘데려오라고 말하다’)를 대체로 충실히 반영했습니다. 다만 בְּעֵינֵיהֶן은 한국어에서 ‘자기 눈에서’라고 하면 부자연스럽고 뜻이 불명확해지므로, ‘자기 눈에’로 옮기는 것이 관점 표현과 원문의 의미를 더 정확히 전달합니다.
  naturalness: ‘자기 남편을 자기 눈에서 업신여기게’는 현대 표준 한국어의 자연스러운 결합이 아닙니다. ‘자기 눈에 자기 남편을 업신여기게’는 원문의 반복된 재귀 지시를 보존하면서도 자연스럽습니다. 또한 인용문 뒤의 ‘할 것이기 때문입니다’는 ‘말하기를’보다 현대적인 서술 문맥에 더 매끄럽게 연결됩니다.
  terminology: ‘왕후’, ‘아하수에로’, ‘와스디’는 적절합니다. ‘왕후의 일’은 דְבַר의 넓은 의미를 보존하며, ‘데려오라고 하였으나’는 אָמַר를 과도하게 ‘명령하다’로 강화하지 않아 적절합니다.
