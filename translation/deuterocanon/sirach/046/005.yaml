  from: For he called on God Most High when his enemies pressed him from all around[a], and God Most High answered him with hailstones and ice-stones.
  to: For he called on God Most High when his enemies pressed him on every side; God Most High answered him with hailstones[a].
  rationale: The lexical deliberation rightly understands Joshua’s call as an appeal for help and retains the repeated title “God Most High.” Its insistence on distinguishing the two hail terms produces an unnatural distinction in English, so their shared meaning is carried in the text and their wording in a note.
