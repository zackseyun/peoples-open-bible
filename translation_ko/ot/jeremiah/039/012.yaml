  text: Take him, keep your eyes on him, and do him no harm; rather, do with him just as he speaks to you.
translation:
  language: ko
  text: 그를 데려가십시오. 그를 지켜보고, 그에게는 아무 해도 입히지 마십시오. 다만 그가 당신에게 말하는 대로 그를 대하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָחֶ֗/נּוּ
  english_pob_choice: Take him
  chosen_korean: 그를 데려가십시오
  alternatives_korean:
  - 그를 취하십시오
  - 그를 잡아가십시오
  lexicon: לקח
  rationale: 명령형으로서의 ‘Take him’을 한국어에서 자연스럽고 정중하게 옮기기 위해 ‘데려가십시오’를 택했습니다. 단순한 ‘취하다’보다 사람을 옮겨 데려가는 상황을 더 분명히 드러냅니다.
- source_word: וְ/עֵינֶ֨י/ךָ֙ שִׂ֣ים עָלָ֔י/ו
  english_pob_choice: keep your eyes on him
  chosen_korean: 눈을 그에게 두고
  alternatives_korean:
  - 그를 주시하고
  - 그에게서 눈을 떼지 말고
  lexicon: עין + שים על
  rationale: 직역보다 한국어 관용에 맞게 ‘눈을 두다’로 옮기되, 감시·보호의 주의를 유지하라는 뉘앙스를 살렸습니다.
- source_word: וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֣וּמָה רָּ֑ע
  english_pob_choice: do him no harm
  chosen_korean: 그에게 아무 해도 하지 마십시오
  alternatives_korean:
  - 그에게 해를 끼치지 마십시오
  - 그를 해치지 마십시오
  lexicon: רעע / רע
  rationale: 부정 명령과 목적어의 관계를 분명히 하면서, ‘harm’의 직접성을 살리기 위해 ‘아무 해도 하지 마십시오’로 옮겼습니다.
- source_word: כִּ֗י אם כַּֽ/אֲשֶׁר֙ יְדַבֵּ֣ר אֵלֶ֔י/ךָ כֵּ֖ן עֲשֵׂ֥ה עִמּֽ/וֹ
  english_pob_choice: rather, do with him just as he speaks to you
  chosen_korean: 오히려 그가 당신에게 말하는 대로 그에게 행하십시오
  alternatives_korean:
  - 다만 그가 당신에게 말하는 대로 그에게 하십시오
  - 그가 당신에게 말하는 대로 그대로 하십시오
  lexicon: כִּי אִם + כַּאֲשֶׁר
  rationale: 영문 POB의 ‘rather’에 해당하는 대조를 살리기 위해 ‘오히려’를 사용했고, ‘just as’는 ‘말하는 대로’로 간명하게 옮겼습니다.
