base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/020/003.yaml
  text: 'and the judgment of Sodom, how they were judged because of their wickedness, and because of fornication and uncleanness and corruption among themselves: by fornication they died. And you also, guard yourselves from all fornication and uncleanness and from every defilement of sin, so that you may not make your name a curse, and all your life a reproach, and all your sons to destruction by the sword, and you become accursed like Sodom, and all your remnant like the sons of Gomorrah. I testify to you, my children: love him'
translation:
  language: pt
  text: 'e o julgamento de Sodoma, como seus habitantes foram julgados por causa de sua maldade, de sua imoralidade sexual, de sua impureza e da corrupção que havia entre eles: por causa da imoralidade sexual, morreram. Quanto a vocês, guardem-se também de toda imoralidade sexual e impureza e de toda contaminação do pecado, para que não entreguem seu nome à maldição, toda a sua vida ao opróbrio e todos os seus filhos à destruição pela espada; nem se tornem amaldiçoados como Sodoma, nem todo o seu remanescente seja como os filhos de Gomorra. Eu vos declaro, meus filhos: amai-o.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዝሙት
  choice: imoralidade sexual
  rationale: Expressa o campo semântico de conduta sexual ilícita em português atual, com maior clareza e abrangência do que o termo mais restrito ou arcaizante “fornicação”.
- source_word: ርኵስ
  choice: impureza
  rationale: Mantém a noção de impureza moral presente no contexto e sua distinção em relação à imoralidade sexual.
- source_word: ሙስና
  choice: corrupção / destruição
  rationale: 'O termo assume matizes contextuais diferentes: primeiro descreve a corrupção existente entre os sodomitas; depois, na expressão preposicional ለሙስና, indica o destino de destruição reservado aos filhos.'
- source_word: ፃማነ፡ ኀጢአት
  choice: contaminação do pecado
  rationale: Reproduz a imagem de mácula ou contaminação causada pelo pecado em linguagem natural e solene.
- source_word: ኢትሀቡ
  choice: não entregueis
  rationale: 'Preserva o único verbo que rege os três objetos paralelos: o nome à maldição, a vida ao opróbrio e os filhos à destruição.'
- source_word: አሰምዕ
  choice: eu vos dou testemunho
  rationale: Reflete a forma verbal na primeira pessoa, com sentido de testemunhar ou declarar, em vez de tratá-la como imperativo de ouvir.
- source_word: አፍቅርዎ
  choice: amai-o
  rationale: Conserva o imperativo plural e o sufixo de objeto masculino singular, cujo referente aparece no contexto seguinte.
theological_decisions:
- issue: Referente do pronome em “amai-o”
  choice: Manter o pronome masculino singular sem explicitar o referente
  alternative: Explicitar “amai a Deus”
  rationale: O texto-fonte traz um objeto pronominal e antecipa seu referente no versículo seguinte; explicitá-lo aqui eliminaria a ligação e acrescentaria conteúdo não expresso neste versículo.
- issue: Relação entre pecado e juízo de Sodoma
  choice: Preservar a enumeração de maldade, imoralidade sexual, impureza e corrupção
  alternative: Resumir tudo como perversidade
  rationale: A enumeração pertence ao texto e deve permanecer sem redução nem harmonização teológica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas plurais solenes (“vós”, “guardai-vos”, “amai-o”) adequadas ao discurso patriarcal. A sintaxe foi ajustada para tornar claro o paralelismo regido por “entregueis”, sem transformar “à destruição” em uma oração verbal independente. “Seus habitantes” esclarece o referente humano do plural após “Sodoma” sem alterar o sentido.
