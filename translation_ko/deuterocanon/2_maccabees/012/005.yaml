    rationale: γεγονυῖαν은 ‘일어난, 벌어진’이라는 완료 분사입니다. 잔혹한 일이 누군가의 행위일 가능성은 문맥상 있을 수 있으나, 본문은 여기서 가해자를 밝히지 않습니다.
