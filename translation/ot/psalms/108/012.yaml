id: PSA.108.12
reference: Psalms 108:12
source:
  edition: WLC
  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָֽם־׃
translation:
  text: Give us help against the adversary[a], for deliverance by humans is futile.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “Help us out of distress.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָבָה
  chosen: Give
  alternatives:
  - Grant
  - Bring
  lexicon: HALOT
  rationale: Imperative/request form from יהב used idiomatically in prayer as a plea for God to provide. 'Give' is the most direct and natural English equivalent.
- source_word: לָּנוּ
  chosen: us
  alternatives:
  - to us
  lexicon: HALOT
  rationale: Indirect object of the imperative. English idiom prefers 'Give us help' rather than the more wooden 'Give to us help.'
- source_word: עֶזְרַת
  chosen: help
  alternatives:
  - aid
  - assistance
  lexicon: HALOT
  rationale: Construct form meaning 'help of.' 'Help' is the standard, natural rendering in prayer language and fits the parallel with 'salvation' in the second colon.
- source_word: מִצָּר
  lemma: מִן
  chosen: against the adversary
  alternatives:
  - from distress
  - from trouble
  - from the foe
  lexicon: HALOT
  rationale: The noun צַר can denote distress or an adversary/foe. In this psalm's military context and in parallel with Psalm 60:11, the personal sense fits best. The preposition מִן after 'help' is rendered idiomatically as 'against' in English rather than the less natural 'from' here.
- source_word: וְשָׁוְא
  chosen: for ... is futile
  alternatives:
  - and vain is
  - and false is
  - and worthless is
  lexicon: HALOT
  rationale: Here שָׁוְא characterizes humanly supplied help as empty and ineffective; “futile” is natural English.
- source_word: תְּשׁוּעַת
  chosen: deliverance
  alternatives:
  - deliverance
  - victory
  lexicon: HALOT
  rationale: In this setting תְּשׁוּעָה denotes rescue or victory rather than theological salvation.
- source_word: אָדָם
  chosen: by humans
  alternatives:
  - humankind
  - humanity
  - mankind
  lexicon: HALOT
  rationale: The contextual construct expresses deliverance supplied by human beings, in contrast with divine help; this wording avoids the ambiguity of “human deliverance.”
