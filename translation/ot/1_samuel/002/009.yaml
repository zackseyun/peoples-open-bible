  from: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
  to: He guards the steps of his faithful ones[a], but the wicked are silenced in darkness, for no one prevails by strength.
  rationale: I retain the earlier preference for the traditional plural reading and its restrained rendering of the wicked being silenced. The earlier preference for “a man” rested on grammatical gender, but the statement applies universally, including to Hannah herself.
