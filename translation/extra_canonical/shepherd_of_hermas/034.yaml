translation:
  text: '1. “Fear,” he says, “the Lord, and keep his commandments. By keeping the commandments of God
    you will be powerful in every deed, and your conduct will be beyond compare. For in fearing the Lord
    you will do everything well. This is the fear that you must have—and you will be saved.[a]


    2. But do not fear the devil; for by fearing the Lord you will gain mastery over the devil, because
    there is no power in him. In the one who has no power, there is no fear; but in the one who has glorious
    power, there is also fear. For everyone who has power is feared, but the one who has no power is despised
    by all.[b]


    3. But fear the works of the devil, for they are evil. So, by fearing the Lord, you will fear the
    works of the devil, and you will not do them, but will keep away from them.[c]


    4. Therefore there are two fears: if you wish to do what is evil, fear the Lord and you will not do
    it; and if, on the other hand, you wish to do what is good, fear the Lord and you will do it. Thus
    the fear of the Lord is strong and great and glorious. So fear the Lord, and you will live for him;
    and all who fear him among those who keep his commandments will live for God.[d]


    5. “Why,” I said, “sir, did you say about those who keep his commandments, ‘They will live for God’?”
    “Because,” he said, “all creation fears the Lord, but it does not keep his commandments. Therefore
    the life of those who fear him and keep his commandments is with God; but for those who do not keep
    his commandments, there is not even life in them.[e]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Fear is retained rather than replacing every occurrence with reverence; the mandate itself distinguishes
      fear of the Lord, the devil and the devil’s works. The promise of salvation is part of the working
      Greek at paragraph1. Clement’s paraphrase adds its own language of building up and destruction;
      it is not inserted into Hermas.
  - marker: b
    reason: textual_variant
    text: “Everyone who has power is feared” interprets the Greek “has fear” as inspiring fear in this
      power contrast. “Everyone who has power has fear” is a more literal alternative. The printed Greek
      brackets de in paragraph2; the English does not require a separate but there. Palatina, Gebhardt/Harnack1877
      printed97, includes a bracketed fearing-the-Lord clause supplied by its editor; that supplied Latin
      is not intact manuscript agreement.
  - marker: c
    reason: textual_variant
    text: The working Greek distinguishes not fearing the devil from fearing and avoiding his works. Athos,
      Lake1907 Plate VI lines49–50, supports that contrast. Clement, Stromata II.12, Stählin1906 printed143
      lines5–10, paraphrases fear of the Lord rather than the devil, and fear/avoidance of the devil’s
      works, alongside his own building-up/love explanation. It is indirect quotation evidence, not another
      continuous Hermas manuscript. The working future keep-away form is an edited grammatical form against
      an Athos infinitive report in the 1891 apparatus.
  - marker: d
    reason: textual_variant
    text: 'Both branches are retained: fear of the Lord prevents doing evil and leads to doing good. Lake1907
      Plate VI lines50–52 has both. The Vulgata, Hilgenfeld1873 printed51, brackets the good-doing clause
      as supplied from Greek; the Palatina printed97 lacks that branch. Those versions cannot be counted
      as two intact witnesses for the supplied clause. The working promise retains the commandment-keeping
      condition. Live for God renders the Greek live to God idiom.'
  - marker: e
    reason: textual_variant
    text: The final “in them” retains the existing English interpretation, also found in Vulgata printed51
      (in illis). The working printed Greek and Lake1907 Plate VI line56 instead have singular en autō,
      “in him”; “there is not even life in him” is the more literal alternative, with God as one possible
      referent. Palatina printed97 paraphrases “will not be in life,” with an editor-supplied negation
      in its preceding do-not-fear clause. These differences are explicit rather than silently rewriting
      Greek to match Latin. All creation fearing and the further commandment-keeping condition are both
      retained; this bounded check does not independently certify the whole manuscript tradition.
lexical_decisions:
- source_word: φόβος / φοβεῖσθαι
  chosen: fear
  alternatives:
  - reverence
  - awe
  rationale: Retain term across the distinctions the passage itself makes.
- source_word: φόβον ἔχει
  chosen: is feared
  alternatives:
  - has fear
  rationale: Context contrasts inspiring fear through power with being despised through lack of power.
- source_word: ζήσῃ / ζήσονται τῷ Θεῷ
  chosen: live for God
  alternatives:
  - live to God
  rationale: Retain existing English dative interpretation rather than imposing one phrase throughout.
- source_word: οὐδὲ ζωὴ ἐν αὐτῷ
  chosen: there is not even life in them (retained interpretation)
  alternatives:
  - there is not even life in him (literal singular Greek)
  rationale: Expose singular working Greek and differing Latin endings; original English retained provisionally
    pending independent review.
