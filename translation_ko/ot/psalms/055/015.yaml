source:
  edition: WLC
  text: ישימות עָלֵ֗י/מוֹ יֵרְד֣וּ שְׁא֣וֹל חַיִּ֑ים כִּֽי רָע֖וֹת בִּ/מְגוּרָ֣/ם בְּ/קִרְבָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/015.yaml
  text: Let death come upon them[a]; let them go down alive to Sheol, for evil is in their dwelling[b][c][d], in their midst.
  footnotes:
  - marker: a
    text: Or, 'Let desolations come upon them,' 'May death come suddenly upon them,' or similar. The Hebrew of the opening word is difficult, and the exact nuance is uncertain.
    reason: textual_variant
  - marker: b
    text: Or 'within them' or 'among them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in their habitation' / 'in their sojourning.'
    reason: lexical_alternative
  - marker: d
    text: Sheol is the Hebrew term for the realm of the dead; alternatively, 'the grave.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죽음이 그들에게 닥치게 하소서[a]. 그들이 산 채로 스올로 내려가게 하소서[b]. 이는 악이 그들의 거처에 있고[c], 그들 가운데 있기 때문입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 단어의 형태와 정확한 뉘앙스는 불확실합니다. ‘멸망들이 그들에게 닥치게 하소서’, ‘죽음이 갑자기 그들에게 닥치게 하소서’ 등으로 옮길 수도 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘스올’은 죽은 자들의 영역을 가리키는 히브리어 표현입니다. ‘무덤’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그들의 거처에’는 ‘그들의 사는 곳에’ 또는 ‘그들의 머무름에’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘그들 가운데’는 ‘그들 안에’ 또는 ‘그들 사이에’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַמְתִּיק סוֹד
  english_pob_choice: we sweetened counsel / we shared sweet counsel
  chosen_korean: 달콤한 교제를 나누었다
  alternatives_korean:
  - 달콤한 조언을 나누었다
  - 비밀스러운 교제를 나누었다
  - 친밀한 교제를 나누었다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘달게 하다’이지만, 대상인 סוֹד는 단순한 조언보다 친밀하고 비밀스러운 대화나 교제를 뜻할 수 있으므로, 한국어에서는 직역보다 ‘달콤한 교제’가 시적 표현과 의미를 함께 살립니다.
- source_word: יַחְדָּו
  english_pob_choice: Together
  chosen_korean: 함께
  alternatives_korean:
  - 한데
  - 더불어
  lexicon: HALOT
  rationale: 공동의 회상을 강조하는 부사이므로, 합쇼체 시에서 가장 자연스러운 ‘함께’로 옮겨 공동체적 친밀감을 보존했습니다.
- source_word: בְּבֵית אֱלֹהִים
  english_pob_choice: in the house of God
  chosen_korean: 하나님의 집에서는
  alternatives_korean:
  - 하나님의 집 안에서
  - 하나님의 집에서
  lexicon: HALOT
  rationale: 예배적 공간을 가리키는 기본적 장소 표현이므로, 한국어 관용에 맞게 ‘하나님의 집’으로 옮기고 대조를 살리기 위해 조사 ‘에서는’를 붙였습니다.
- source_word: בְּרָגֶשׁ
  english_pob_choice: in the throng
  chosen_korean: 무리 가운데
  alternatives_korean:
  - 군중 속에서
  - 소란 가운데
  - 떠들썩한 무리 가운데
  lexicon: HALOT
  rationale: רגש는 군중, 소란, 뒤섞임을 포괄할 수 있어, 예배에 모인 많은 사람들을 너무 부정적으로 만들지 않도록 ‘무리 가운데’로 옮겼습니다.
