  - severity: medium
    issue: ἆξαι의 번역
    rationale: ‘빼앗아 가다’는 소유를 탈취하는 의미를 더할 수 있습니다. 원문은 이성을 자기에게서 ‘이끌어 가다/벗어나게 하다’라는 뜻입니다.
  - severity: low
    issue: 호격 표현의 현대성
    rationale: ‘오’와 ‘지체들’의 결합은 현대 표준어 산문에서 어색합니다. ‘마귀의 사지들아’는 원문의 비유적 모욕과 신체 이미지 모두를 보존합니다.
  revised_text: 그러나 그가 말했습니다. “마귀의 사지들아, 너희의 수단은 내 이성을 이끌어 갈 만큼 강하지 않다. 내 사지들을 자르십시오, 내 살을 불태우십시오, 내 관절을 비트십시오.”
