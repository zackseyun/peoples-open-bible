lexical_decisions:
- source_word: εὐδόκησαν
  chosen: were pleased with
  alternatives:
  - approved of
  - were well disposed toward
  - took pleasure in
  lexicon: LSJ
  rationale: The verb denotes favorable approval or satisfaction. 'Were pleased with' is natural English and preserves the sense of positive disposition toward Alexander without overstating formal endorsement.
- source_word: ἐν Ἀλεξάνδρῳ
  chosen: with Alexander
  alternatives:
  - in Alexander
  - toward Alexander
  lexicon: LSJ
  rationale: Although the Greek uses ἐν, in this idiom after εὐδοκέω it conveys the object in whom pleasure or approval is taken. English idiom requires 'with Alexander' rather than a wooden 'in Alexander.'
- source_word: ἐγένετο
  chosen: had become
  alternatives:
  - became
  - proved to be
  - was
  lexicon: LSJ
  rationale: The aorist marks the event of becoming; 'had become' fits the explanatory clause introduced by ὅτι and reads smoothly in English.
- source_word: ἀρχηγὸς
  chosen: initiator
  alternatives:
  - leader
  - author
  - originator
  - champion
  lexicon: LSJ
  rationale: Here ἀρχηγός governs 'peaceful terms/words' rather than a people or movement. 'Initiator' best captures one who takes the lead in beginning peace negotiations, avoiding the misleadingly broad 'leader.'
- source_word: λόγων εἰρηνικῶν
  chosen: peaceful terms
  alternatives:
  - peaceful words
  - words of peace
  - peace proposals
  lexicon: LSJ
  rationale: Literally 'peaceful words,' but in diplomatic context this refers to conciliatory or peace-making proposals/terms. 'Peaceful terms' preserves the negotiation sense without excessive paraphrase.
- source_word: συνεμάχουν
  chosen: fought alongside
  alternatives:
  - allied themselves with
  - were fighting with
  - gave military support to
  lexicon: LSJ
  rationale: The compound verb denotes fighting together as allies. 'Fought alongside' keeps the military force explicit and avoids reducing it to a merely political alliance.
- source_word: πάσας τὰς ἡμέρας
  chosen: all the days
  alternatives:
  - continually
  - the whole time
  - every day
  lexicon: LSJ
  rationale: A fairly literal rendering preserves the idiom's durative sense. 'All the days' is understandable in modern English and retains the textual flavor better than a more interpretive paraphrase.
