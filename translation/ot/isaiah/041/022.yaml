  from: Let them bring them forward and tell us what will happen[a]. Tell us the former things—what they are—that we may set our heart on them and know their outcome[c][b]; or declare to us the things to come.
  to: Let them come forward and tell us what will happen. Tell us what the earlier events[a] were, so that we may consider them and know their outcome; or announce to us what is coming.
