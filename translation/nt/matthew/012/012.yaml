  from: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
  to: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbath.
  rationale: The clause 'How much more valuable, then, is a man than a sheep' is an exclamatory or rhetorical question. In English, it requires an exclamation mark or a question mark, not a period. Although morphologically plural, 'σάββασιν' is a well-known idiom (likely derived from the Aramaic emphatic singular) that means 'on the Sabbath' (singular). Translating it as plural in English is misleading and obscures the meaning, especially since the surrounding context refers to a single Sabbath day. The singular should be in the main text, with the morphological note relegated to the footnote.
