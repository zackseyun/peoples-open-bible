  to: 여호와여, 돌아오십시오. 제 생명을 건져 주시고, 주의 한결같은 사랑을 위하여 저를 구원해 주십시오.
  rationale: 원문과 영어 POB에 따라 절 전체를 새로 번역했습니다. שובה의 하나님께서 다시 돌보시기를 바라는 간구는 ‘돌아오십시오’로, חלצה נפשי는 ‘제 생명을 건져 주시고’로, הושיעני는 ‘저를 구원해 주십시오’로 옮겼습니다. למען חסדך의 목적·근거 표현은 해석을 과도하게 좁히지 않도록 ‘주의 한결같은 사랑을 위하여’로 직역에 가깝게 유지했습니다. 원문 절과 무관한 기존 각주는 모두 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:46:15Z'
