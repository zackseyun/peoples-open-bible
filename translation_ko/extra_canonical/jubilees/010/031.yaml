  text: In rebellion you have dwelt, and in rebellion your children will fall, and you will be uprooted forever. Do not dwell.
  footnotes:
  - marker: a
    text: Or 'In your dwelling you will dwell, and in your dwelling your children will fall forever.'.
    reason: previous_rendering
translation:
  language: ko
  text: 반역 가운데[a] 너희가 거하였고, 반역 가운데에서 너희 자녀가 넘어질 것이며, 너희는 영원히 뿌리 뽑힐 것입니다. 거하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희 거처에서 너희가 거하고, 너희 거처에서 너희 자녀가 영원히 넘어질 것이다.”
    reason: The repeated Geʽez phrase has a disputed alternate rendering reflected in the English POB audit trail. The note is anchored at the opening phrase to which the alternative pertains.
lexical_decisions:
- source_word: በሀከከ
  english_pob_choice: in rebellion
  chosen_korean: 반역 가운데에
  alternatives_korean:
  - 반란 가운데에
  - 배반 가운데에
  lexicon: 반역
  rationale: 게에즈 원어의 반복 구문에서 상태나 영역을 나타내는 말로 보이며, POB의 'in rebellion'을 따라 행동의 성격을 분명히 드러냈습니다.
- source_word: ኀደርክሙ
  english_pob_choice: you have dwelt
  chosen_korean: 너희가 거하였고
  alternatives_korean:
  - 너희가 살았고
  - 너희가 머물렀고
  lexicon: 거하다
  rationale: 완료형을 반영해 현재·미래가 아닌 과거 완료적 사실로 옮겼고, 반복되는 ‘거하다’의 어감을 살렸습니다.
- source_word: ይወድቁ ደቂቅከ
  english_pob_choice: your children will fall
  chosen_korean: 너희 자녀가 넘어질 것이며
  alternatives_korean:
  - 너희 자녀가 쓰러질 것이며
  - 너희 자손이 넘어질 것이며
  lexicon: 넘어지다
  rationale: 직역보다 한국어에서 가장 자연스럽게 ‘fall’의 파멸적 함의를 전달하는 동사를 선택했습니다.
- source_word: ወትሴር ለዓለም
  english_pob_choice: you will be uprooted forever
  chosen_korean: 너희는 영원히 뽑힐 것입니다
  alternatives_korean:
  - 너희는 영원히 뿌리 뽑힐 것입니다
  - 너희는 영원히 제거될 것입니다
  lexicon: 뽑히다
  rationale: ‘뿌리째 제거됨’의 이미지를 살리되, 원문의 ‘uprooted’에 가장 직접 대응하는 표현으로 옮겼습니다.
- source_word: ኢትኅደር
  english_pob_choice: Do not dwell
  chosen_korean: 거하지 마십시오
  alternatives_korean:
  - 살지 마십시오
  - 머물지 마십시오
  lexicon: 거하다
  rationale: 명령형 금지문을 그대로 살려, 앞의 ‘거하였고’와 연결되는 어휘 일관성을 유지했습니다.
theological_decisions:
- issue: 반복되는 ‘거하다/거하지 마십시오’의 대비
  chosen_reading: 첫 절반은 과거의 반역 상태를, 마지막 문장은 그 상태에 머물지 말라는 금지로 읽었습니다.
  alternative_readings:
  - 동일한 ‘거주’ 표현을 단순 장소 묘사로 읽는 방식
  - 앞부분과 뒷부분을 서로 다른 주제 문장으로 분리하는 방식
  rationale: 게에즈 본문과 POB 수정안 모두 반복과 대조를 강조하므로, ‘반역 가운데에 거함’과 ‘거하지 마십시오’를 연결해 수사적 긴장을 보존했습니다.
  doctrine_reference: 본문의 예언적 경고와 회개 촉구의 구조
