translation:
  text: '1. After a few days I saw him in the same field where I had seen the shepherds. He says to me,
    “What are you seeking?” I say, “I am here, sir[a], so that you may command the shepherd, the punisher,
    to leave my house. He afflicts me greatly.” He says, “You must be afflicted. This is what the glorious
    angel has commanded for you. He wants you to be tested.” I say, “Sir, what have I done that is so
    evil that I should be handed over to this angel?”


    2. He says, “Listen. Your sins are many, but not so many that you should be handed over to this angel.
    But your household has committed great lawless deeds and sins. The glorious angel was embittered by
    their works. That is why he ordered you to be afflicted for a certain time. This is so that they too
    might repent[c] and cleanse themselves from every desire of this age. When they repent and are cleansed,
    the angel of punishment will withdraw.”


    3. I say to him, “Sir, if they did these things and embittered the glorious angel, what did I do?”
    He says, “They cannot be afflicted in any other way unless you, the head of the [whole] household[b],
    are afflicted. When you are afflicted, they too will necessarily be afflicted. But while you are at
    ease, they cannot have any affliction[d].”


    4. I say, “But look, sir. They have repented with all their heart.” He says, “I also know that they
    have repented with all their heart[e]. So do you think that the sins of those who repent are forgiven
    immediately? Not at all[f]. The one who repents must afflict his own soul. He must be resolutely humble-minded
    in all his conduct and be afflicted with all kinds of afflictions. If he endures the afflictions that
    come on him, the one who created and strengthened all things will surely be moved with compassion
    and give some healing[g].”


    5. “This will happen when [God] sees that the heart of the one who repents is clean from every evil
    deed[h]. It is beneficial for you and your household to be afflicted now. Why do I say so much to
    you? You must be afflicted. This is what that angel of the Lord commanded, the one who handed you
    over to me. Give thanks to the Lord for this. He considered you worthy to be told about the affliction
    beforehand. Knowing about it in advance, you could endure it resolutely.”


    6. I say to him, “Sir, be with me. Then I will be able to endure every affliction [easily][i].” He
    says, “I will be with you. I will also ask the angel who punishes to afflict you more lightly. You
    will be afflicted for a short time. Then you will be restored again to your house[j]. Only persist
    in humility and in serving the Lord with a clean heart. Your children and your household must do this
    too. Walk in my commandments which I have commanded you. Then your repentance will be able to be strong
    and clean.”


    7. “If you keep these commandments with your household, every affliction will withdraw from you[k].
    Affliction will also withdraw,” he says, “from all who walk in these commandments of mine.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: Sir addresses the shepherd. The working opening has I am here, so that you may command; Michigan
      printed77 and the Sinaiticus project transcription add an explicit request, I ask you (partly supplied
      in each). Both Latin versions include ask. The working request remains implicit in the English syntax;
      no new clause is inserted into normalized Greek.
  - marker: c
    reason: lexical_alternative
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
  - marker: b
    reason: textual_variant
    text: Whole is bracketed in the working Greek as Harmer’s version-supported insertion. Michigan printed79
      lacks the adjective. Both Latin versions have whole household. Sinaiticus has a six-line gap at
      this location and cannot supply an independent preserved reading for the adjective.
  - marker: d
    reason: lexical_alternative
    text: While you are at ease translates the genitive absolute with you as its explicit subject. The
      old reader’s being steadfast left the subject unclear and changed the contrast. Michigan printed79
      preserves the corresponding you-at-ease wording, with damage at the page join. Vulgata printed95
      says while you are well established; Palatina printed171 says while you have ease. Sinaiticus has
      a corrected ease-verb ending and supplied pronouns here; those supplies are not treated as intact
      ink.
  - marker: e
    reason: textual_variant
    text: The repeated I also know that they have repented with all their heart belongs to the working
      reply. Michigan printed80 and Sinaiticus global66.4 omit that repeated acknowledgment, while both
      Latin versions retain it. The old reader059 stopped within it; the next old unit060 contained the
      continuation under the wrong historical heading. The complete clause is retained without claiming
      unanimous Greek attestation.
  - marker: f
    reason: textual_variant
    text: Immediately is a version-supported insertion in the1891 working source against reported Athos
      omission; Michigan printed80 partly preserves euthys, while the Sinaiticus transcription does not
      include it in this question. The negative reply is emphatic, Not at all, answering immediate forgiveness;
      the ensuing endurance and clean-heart conditions remain. Afflict his own soul preserves the strong
      basanisai, literally torment/test one’s own soul, rather than silently reducing it to regret or
      erasing the passage’s demand.
  - marker: g
    reason: textual_variant
    text: The working source has surely and healing, the latter Anger’s version-supported conjecture against
      reported Athos strength. Michigan printed80–81 partly preserves the corresponding compassion and
      healing wording, with damaged/supplied letters; it is not a new change to the working body. Both
      Latin versions have a remedy but say perhaps (Vulgata printed95–96, Palatina173), rather than surely.
      The Sinaiticus fragment breaks at a partly preserved compassion form before a physical gap, so it
      cannot independently attest the following creator/healing clause.
  - marker: h
    reason: textual_variant
    text: God is bracketed as Harmer’s contextual conjecture in the working opening of paragraph5. Michigan
      printed81 instead has pantos and a clean-heart condition without this explicit God insertion. Both
      Latin versions retain the condition; the corresponding Sinaiticus opening is lost between the last
      line of column3 and the surviving ending of afflicted at column4line1, not an omission vote. Every
      evil deed is explicit in the working Greek; the old donor060’s clean from everything was incomplete
      here.
  - marker: i
    reason: textual_variant
    text: Easily is bracketed in the working source as Harmer’s version-supported insertion. Michigan
      printed81 and Sinaiticus global66.6 lack the adverb. Both Latin versions have easily. The English
      shows the working bracket instead of claiming the adverb is intact early Greek.
  - marker: j
    reason: textual_variant
    text: Working paragraph6 promises restoration to your house. Michigan printed82 and the Sinaiticus
      transcription instead have your place; both Latin versions also have place. Michigan also has Lord
      God where the working source has Lord. These alternatives are disclosed; the continuous working
      Greek remains unchanged. The Sinaiticus fragment ends within the later clean-heart phrase, so its
      unpreserved children/household and closing promises are not counted as absent manuscript readings.
  - marker: k
    reason: textual_variant
    text: The first household promise expressly depends on keeping the commandments together. Michigan
      printed82 partly preserves this condition, as does Vulgata printed96; Palatina173 omits that explicit
      conditional clause while retaining the injunctions and ensuing promise. The final promise applies
      to those who walk in the commandments; it is not an unconditional promise to everyone. Michigan
      printed83 has a singular relative construction and omits all before the final affliction, unlike
      the working wording. The critical conditions are not removed to harmonize the witnesses.
lexical_decisions:
