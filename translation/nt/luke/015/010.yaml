theological_decisions:
- issue: Location/agent of the joy
  chosen_reading: Translate ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ as 'before the angels of God' rather than specifying that the angels themselves are rejoicing.
  alternative_readings:
  - among the angels of God
  - the angels of God rejoice
  rationale: The Greek says literally that joy occurs 'before' the angels of God, which may imply divine joy in their presence or joy in the heavenly court more generally. The translation preserves that nuance rather than narrowing the subject of the joy.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: Context-sensitive reorientation terminology
  chosen_reading: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who reorients toward God.
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
