id: ISA.50.1
reference: Isaiah 50:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֵ֣י זֶ֠ה סֵ֣פֶר כְּרִית֤וּת אִמְּ/כֶם֙ אֲשֶׁ֣ר שִׁלַּחְתִּ֔י/הָ א֚וֹ מִ֣י מִ/נּוֹשַׁ֔/י אֲשֶׁר מָכַ֥רְתִּי אֶתְ/כֶ֖ם ל֑/וֹ הֵ֤ן בַּ/עֲוֺנֹֽתֵי/כֶם֙ נִמְכַּרְתֶּ֔ם וּ/בְ/פִשְׁעֵי/כֶ֖ם שֻׁלְּחָ֥ה אִמְּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/001.yaml
  text: 'Thus says the LORD: Where is your mother''s certificate of divorce, with which I sent her away? Or which of my creditors is it to whom I sold you? Look, you were sold because of your iniquities, and your mother was sent away because of your transgressions.'
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “내가 그것으로 너희 어머니를 내보낸 이혼증서가 어디 있느냐? 내가 너희를 팔아넘긴 내 채권자들 가운데 누구에게 팔았느냐? 보라, 너희는 너희의 죄악 때문에 팔렸고, 너희 어머니는 너희의 허물 때문에 내보내졌습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 원문 신명사호를 직접 반영해 POB 기본어인 야훼를 유지했습니다. English POB의 'the LORD'는 관습적 우회표현이므로, 한국어 본문에서는 원천어 기반의 직역을 택했습니다.
- source_word: סֵפֶר כְּרִיתוּת
  english_pob_choice: certificate of divorce
  chosen_korean: 이혼증서
  alternatives_korean:
  - 이혼 서류
  - 이혼 증명서
  - 이혼장
  lexicon: כְּרִיתוּת
  rationale: 법적 문서라는 뜻을 살리되, 현대 한국어에서 가장 자연스럽고 의미가 분명한 '이혼증서'를 택했습니다.
- source_word: נִמְכַּרְתֶּם
  english_pob_choice: you were sold
  chosen_korean: 너희는 … 팔렸고
  alternatives_korean:
  - 너희는 … 팔려 갔고
  - 너희는 … 팔린 것이다
  lexicon: מכר
  rationale: 피동적 매매를 그대로 살려, 언약적 책망의 강도를 약화하지 않도록 '팔렸고'로 옮겼습니다.
- source_word: שֻׁלְּחָה
  english_pob_choice: was sent away
  chosen_korean: 내보내졌습니다
  alternatives_korean:
  - 보내졌습니다
  - 내쫓겼습니다
  - 내려보내졌습니다
  lexicon: שלח
  rationale: '''보내다''보다 관계 단절과 추방의 뉘앙스를 더 분명히 드러내는 ''내보내지다''를 사용했습니다. 문맥상 아내의 이혼/추방을 함께 함축합니다.'
theological_decisions:
- issue: 하나님의 발언에서 수사적 질문과 법정적 고발의 톤을 어떻게 유지할지
  chosen_reading: 직역에 가깝게 유지해, 언약 파기와 죄책을 드러내는 법정적 질문으로 읽히게 했습니다.
  alternative_readings:
  - 부드럽게 풀어 설명하는 의역
  - 현대적 대화체로 완화
  rationale: 본문은 위로보다 고발과 논증이 중심이므로, 수사적 질문 구조와 반복되는 매매/추방 이미지를 보존하는 것이 원문의 의도를 가장 잘 전달합니다.
  doctrine_reference: 언약 신학; 예언자적 심판 선언
- issue: ‘the LORD’ 표기의 한국어 처리
  chosen_reading: 본문은 야훼로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB 기본 원칙에 따라 히브리어 원명과의 연결성을 유지했습니다. 이 절은 야훼의 직접 화법이므로 일반적 경칭보다 원천어 표기가 더 투명합니다.
  doctrine_reference: 신명사호 표기 원칙
