translation:
  language: pt
  text: O mal o alcançará em dobro quando estiver em necessidade; em todo bem, chegará até ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega traz uma leitura diferente: “Dê ao piedoso e não ajude o pecador.”'
    reason: Documentar uma variante textual importante que corresponde ao texto grego e à forma adotada pela camada inglesa de consulta.
lexical_decisions:
- source_word: פִּי שְׁנַיִם
  choice: em dobro
  rationale: Expressa de modo natural a ideia idiomática de medida dupla, sem transformar a expressão em uma contagem rígida.
- source_word: רָעָה
  choice: o mal
  rationale: Mantém o substantivo amplo do hebraico, que pode indicar mal, dano ou desgraça.
- source_word: בְּעֵת צֹרֶךְ
  choice: no tempo da necessidade
  rationale: Preserva a formulação temporal e o sentido de carência ou aperto do hebraico.
- source_word: בְּכָל טוֹבָה
  choice: com todo bem
  rationale: Tradução formal que conserva a formulação incomum e potencialmente ambígua do texto hebraico.
- source_word: תַּגִּיעַ אֵלָיו
  choice: chegará até ele
  rationale: Conserva a terceira pessoa e não explicita um sujeito que o hebraico deixa implícito.
theological_decisions:
- issue: Divergência entre o texto hebraico e a tradição grega
  choice: Traduzir o hebraico como texto principal e registrar a leitura grega em nota
  alternative: “Dê ao piedoso e não ajude o pecador.”
  rationale: A fonte hebraica indicada tem alta confiança e validação; a leitura grega representa uma tradição textual substancialmente diferente e deve permanecer visível sem substituir silenciosamente o hebraico.
- issue: Sujeito implícito da segunda oração
  choice: Não acrescentar um sujeito expresso
  alternative: “o mal chegará até ele”
  rationale: Embora “o mal” possa continuar como sujeito, o hebraico não o repete; a tradução preserva essa tensão sintática em vez de resolvê-la.
translation_notes:
  register: Português atual, digno e amplamente compreensível. A construção algo enigmática da segunda oração reflete deliberadamente a concisão e a ambiguidade do hebraico.
