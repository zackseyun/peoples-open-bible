  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: lexical
  tier: 1
  from: You must have no foreign god among you, and you must not bow down to an alien god[a].
  to: You must have no foreign god among you, and you must not bow down to a god of a foreign land[a].
  rationale: “Alien god” is materially unnatural in contemporary English and risks an unintended extraterrestrial sense. “Another nation’s god” improves idiom but introduces an unnecessary singular-nation construal. “A god of a foreign land” is natural, preserves the second Hebrew expression’s distinct wording, and avoids that false precision.
