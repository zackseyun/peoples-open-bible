  from: Let all my enemies be ashamed and greatly terrified[a]; let them turn back and be ashamed in an instant.
  to: Let all my enemies be ashamed and greatly dismayed[a]; let them turn back and be ashamed in an instant.
  rationale: Approve the lexical adjustment. The Niphal of בהל denotes being alarmed or dismayed; “greatly dismayed” represents the verb with the explicit intensifier מְאֹד and is more idiomatic in this construction than “greatly terrified,” without reducing the petitionary force. The jussive-like English “Let ... be” correctly represents the poetic imperfects. “Turn back,” the repeated “be ashamed,” and “in an instant” may stand.
