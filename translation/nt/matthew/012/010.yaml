  from: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
  to: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbath?” so that they might accuse him.
  rationale: While the Greek form τοῖς σάββασιν is morphologically plural, it is a well-established idiom that refers to a single Sabbath day (likely influenced by the Aramaic emphatic state 'shabbata'). Rendering it as 'on the Sabbaths' in English misleadingly implies the Pharisees are asking about multiple days, rather than the institution of the Sabbath or the current day. Optimal equivalence translates the singular meaning into the text and relegates the morphological note to the footnote. If the main text is corrected to 'on the Sabbath', the footnote should be updated to reflect this. Additionally, the current footnote incorrectly implies the Greek plural was used to refer to multiple 'Sabbath days', whereas it was actually a common idiom for a single Sabbath day.
