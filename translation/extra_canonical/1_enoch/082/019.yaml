translation:
  text: 'These are the signs of these days on the earth: scorching heat and dryness. The trees bring forth sun-warmed fruit and yield all their fruit warm and ripe. The sheep mate and conceive; all the earth’s produce and everything in the fields are gathered in, and grapes are trodden for wine. All this takes place during his dominion.'
