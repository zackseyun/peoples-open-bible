revisions:
- from: '1[a]. 그리고 제2년째 되는 제45번째 희년에 유다는

    2. 에르의 장자는 아람 여자 중에서 아내를 얻었으니 그 이름은 다말이더라 그러나 그가 그 여자를 버리고 그와 동침하지 아니하였으니 이는 그 어머니가 가나안 족속의 딸이요 또 그 어머니의 친족 중에서 아내를 삼고자 함이더라.

    3. 그리고 그의 아버지 유다가 그를 꾸짖었다. 그리고 유다의 장자 엘이 악하므로 주님께서 그를 죽이셨다.

    4. 유다가 그의 형 오난에게 이르되 네 형수에게로 들어가서 그에게 형의 의무를 행하고 그를 양육하라

    5[b]. 네 형의 자손이니라.” 그리고 오난은 그 씨가 자기 형의 것이 아니라 자기 것이 될 것임을 알았습니다. 그리고 형수에게 들어갔을 때, 그는 그 씨앗을 땅에 쏟았습니다. 그리고 그것은 보기에 악했다.

    6. 주님께서 그를 죽이셨도다 유다가 그 며느리 다말에게 이르되 내 아들 셀라가 장성할 때까지 네 아버지 집에 과부로 있어라. 내가 너를 그에게 아내로 주리라. 셀라가 장성하였으나 유다의 아내 브두엘이 셀라에게 자기 아들을 주지 아니하고 셀라와 결혼하게 하였더니 그리고 침대-

    7. 유다의 아내 수엘이 이번 주 오년에 죽었습니다. 여섯째 해에 유다가 자기 양털을 깎으러 딤나에 올라갔더니 다말이 어떤 사람에게 말하되 보라 네 시아버지가 머리털을 깎으러 딤나에 올라왔다 하였느니라

    8. 그의 양.” 그리고 그녀는 과부의 옷을 벗고 너울을 쓰고 자기를 단장하고

    9. 그리고 팀나로 가는 길 곁 문에 앉았습니다. 유다가 길을 가다가 그 여자를 만나매

    10. 그리고 그녀를 매춘부라고 생각했습니다. 그리고 그는 그녀에게 "내가 당신에게 들어가게 해주세요"라고 말했습니다. 그러자 그 여자가 그에게 “들어오세요.”라고 말했습니다. 그리고 그가 들어갔다. 그리고 그녀가 그에게 말했다.

    11. “나에게 무엇을 주실 건가요?” 그리고 그는 “내가 염소 중에서 새끼 하나를 네게 보내리라”고 말씀하셨습니다. 그리고 그녀는 “당신이 그것을 보낼 때까지 나에게 담보물을 주십시오”라고 말했습니다.

    27. 그리고 그분은 이스라엘에게서 진노와 형벌을 그치게 하실 것입니다. 그리고 유다에게는 그의 두 아들이 그 여자와 동침하지 않았으므로 그의 씨가 다른 지파를 위해 세워져 뽑히지 않았다고 말했습니다.

    28. 그가 그 눈의 뜻대로 행하며 판결을 구하였으니 이는 아브라함이 그 아들들에게 명하신 판결을 따라 유다가 그를 불에 살라버리기를 원하였음이라.'
  to: '1. 그리고 마흔다섯째 희년의 둘째 주, 둘째 해에 유다가 취했습니다.

    2. 그는 맏아들 에르를 위하여 아람의 딸들 가운데서 아내를 맞이하였는데, 그 이름은 다말이었습니다. 그러나 에르는 그녀를 거절하고 그녀와 동침하지 않았습니다. 그의 어머니가 가나안의 딸들 가운데서 났기 때문에, 그는 자기 어머니의 친족 가운데서 아내를 맞이하고 싶어 했습니다.

    3. 그리고 그의 아버지 유다가 그를 막았습니다. 유다의 맏아들 에르는 악하였으며, 야훼께서 그를 죽이셨습니다.

    4. 유다가 에르의 동생 오난에게 말했습니다. “네 형의 아내에게 들어가서 그 여인에게 수혼의 의무를 행하고, 네 형을 위하여 후사를 세우십시오.”

    5. “네 형을 위하여 자손을 낳게 하라.” 오난은 그 자손이 자기 것이 아니라 자기 형의 것임을 알았습니다. 그래서 그가 형의 아내에게 들어갔을 때, 씨를 땅에 쏟아 버렸습니다. 그리고 그것은 보시기에 악했습니다

    6. 주님께서 그를 죽이셨습니다. 유다는 그의 며느리 다말에게 말하였습니다. “네 아버지의 집에 머무르십시오. 그동안…”

    7. 「내 아들 셀라가 장성할 때까지 과부로 지내십시오. 그러면 내가 당신을 그에게 아내로 주겠습니다.」 그러나 셀라가 장성하였는데도, 유다의 아내 베두엘은 자기 아들 셀라가 결혼하도록 허락하지 않았습니다. 그리고 베드[수엘]이 죽었습니다.

    8. 그리고 이 주간의 다섯째 해에 유다의 아내 수아가 죽었습니다. 여섯째 해에 유다는 딤나에서 자기 양의 털을 깎으러 올라갔습니다. 그들이 다말에게 말하였습니다. “보십시오, 당신의 시아버지가 털을 깎으려고 딤나로 올라가고 있습니다.”

    9. ...그의 양 떼는 팀나에 있었습니다. 그리고 그녀는 과부 때 입던 옷을 벗고 베일을 두른 뒤 몸을 단장했습니다.

    10. 그리고 그녀는 팀낫으로 가는 길에 있는 입구에 앉아 있었습니다. 유다가 가고 있을 때 그는 그녀를 발견했습니다.

    11. 그는 그녀를 창녀로 여기고 그녀에게 말했습니다. “제가 당신에게 들어가게 해 주십시오.” 그러자 그녀가 그에게 말했습니다. “들어오십시오.” 그래서 그가 들어갔습니다. 그녀가 그에게 말했습니다.

    27. 이로써 그가 이스라엘에서 진노와 징벌을 돌이킬 것입니다. 우리는 유다에게 그의 두 아들이 그녀와 동침하지 않았다고 말하였으며, 이 때문에 그의 후손은 또 다른 지파가 되도록 세워졌고 뿌리째 뽑혀 없어지지 않았습니다.

    28. 그는 눈의 순전함으로 행하며 판결을 구했습니다. 이는 아브라함이 자기 아들들에게 명한 판결에 따라, 유다가 그 여인이 불로 태워지기를 원했기 때문입니다.'
