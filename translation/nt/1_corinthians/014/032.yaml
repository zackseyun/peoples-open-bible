id: 1CO.14.32
reference: 1 Corinthians 14:32
source:
  edition: SBLGNT
  text: (καὶ πνεύματα προφητῶν προφήταις ὑποτάσσεται,
translation:
  text: And the spirits of prophets[a] are under the prophets' control.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Here 'spirits' refers to the spiritual inspiration or impulses involved in prophecy.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  chosen: And
  alternatives:
  - also
  - even
  lexicon: BDAG
  rationale: Standard connective introducing an additional supporting statement. 'And' is the most natural English rendering here and preserves the flow of Paul's argument.
- source_word: πνεύματα
  chosen: spirits
  alternatives:
  - spiritual utterances
  - spirit-gifts
  lexicon: BDAG
  rationale: The plural noun πνεύματα most naturally means 'spirits' here. In context it refers to the prophetic impulse or spiritual activity associated with prophets, but the text does not warrant paraphrasing it into 'utterances' or 'gifts' in the main text.
- source_word: προφητῶν
  chosen: of prophets
  alternatives:
  - belonging to prophets
  lexicon: BDAG
  rationale: Genitive plural modifying 'spirits.' The simple possessive 'of prophets' is formally close and sufficiently clear in English.
- source_word: προφήταις
  chosen: to prophets
  alternatives:
  - by prophets
  lexicon: BDAG
  rationale: Dative plural with ὑποτάσσεται is best rendered as the dative of subordination, 'subject to prophets.' This communicates that prophetic spirits are under the control of prophets themselves.
- source_word: ὑποτάσσεται
  chosen: are subject
  alternatives:
  - submit
  - are subordinated
  lexicon: BDAG
  rationale: Although morphologically singular/passive-middle, the verb functions with a neuter plural subject in a general statement. 'Are subject' is idiomatic English and preserves the sense of being under authority or control without overtranslating.
