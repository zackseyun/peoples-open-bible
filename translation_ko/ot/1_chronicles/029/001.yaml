base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/001.yaml
  text: Then King David said to all the assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great; for the palace is not for man, but for the LORD God.”
translation:
  language: ko
  text: 그때 다윗 왕이 온 회중[a]에게 말씀하셨습니다. “하나님께서 택하신 내 아들 솔로몬은 아직 어리고 미숙하며, 이 공사는 큰 일입니다. 왜냐하면 이 궁전은 사람을 위한 것이 아니라 야훼[b] 하나님을 위한 것이기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회중’은 공적으로 모인 사람들의 집합을 가리킵니다.
    reason: korean_style_note
  - marker: b
    text: 히브리어는 여호와의 이름을 가리키는 יהוה를 포함합니다.
    reason: ot_citation
lexical_decisions:
- source_word: הַקָּהָל
  english_pob_choice: the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모인 무리
  - 모임
  lexicon: ἐκκλησία / קהל 대응 일반 집합명사
  rationale: 공적 소집된 사람들의 집합이라는 의미를 살려, 제도적 뉘앙스가 강한 ‘교회’보다 ‘회중’이 원문에 더 가깝습니다.
- source_word: בָּחַר בּוֹ אֱלֹהִים
  english_pob_choice: the one God has chosen
  chosen_korean: 하나님께서 택하신 사람
  alternatives_korean:
  - 하나님이 그를 선택하신
  - 하나님께서 그를 택하신
  lexicon: בחר + pronoun
  rationale: POB의 ‘the one’은 선택받은 자라는 관계를 드러내는 표현이므로, 인칭대명사를 풀어 ‘사람’을 보충해 자연스러운 한국어로 옮겼습니다.
- source_word: נַעַר וָרָךְ
  english_pob_choice: young and inexperienced
  chosen_korean: 아직 어리고 미숙합니다
  alternatives_korean:
  - 어리고 연약합니다
  - 젊고 미숙합니다
  lexicon: נער + רך
  rationale: 단순한 연령만이 아니라 준비와 경험의 부족을 함께 나타내므로 ‘미숙하다’로 경험 부족을 반영했습니다.
- source_word: הַבִּירָה
  english_pob_choice: the palace
  chosen_korean: 궁전
  alternatives_korean:
  - 왕궁
  - 성전
  lexicon: בירה
  rationale: 문맥상 다윗이 준비하려는 건축물의 규모와 위상을 살려 ‘궁전’으로 옮겼고, 후반의 ‘사람을 위한 것이 아니라’라는 대비도 유지했습니다.
- source_word: לַיהוָה אֱלֹהִים
  english_pob_choice: for the LORD God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 주 하나님
  - 여호와 하나님
  lexicon: יהוה + אלהים
  rationale: 프로젝트 기본값에 따라 יהוה는 ‘야훼’로 옮기고, מיד 뒤의 אֱלֹהִים은 ‘하나님’으로 살렸습니다.
theological_decisions:
- issue: יהוה의 음역
  chosen_reading: ‘LORD’에 해당하는 יהוה를 본문에서 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원어 추적성과 감사 가능한 텍스트 정책을 우선해, 전통적 교회 용례보다 학술 음역을 유지했습니다.
  doctrine_reference: 텍스트-기반 명칭 표기 원칙
