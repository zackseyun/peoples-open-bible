id: PSA.68.9
reference: Psalms 68:9
source:
  edition: WLC
  text: גֶּ֣שֶׁם נְ֭דָבוֹת תָּנִ֣יף אֱלֹהִ֑ים נַחֲלָתְ/ךָ֥ וְ֝/נִלְאָ֗ה אַתָּ֥ה כֽוֹנַנְתָּֽ/הּ׃
translation:
  text: You poured down abundant rain, O God; your inheritance[a] was weary, and you sustained it.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: God's inheritance may mean his people, their land, or both.
    reason: alternative_reading
lexical_decisions:
- source_word: גֶּשֶׁם
  chosen: rain
  alternatives:
  - shower
  - downpour
  lexicon: HALOT
  rationale: The noun denotes rain/precipitation. 'Rain' is the most natural base rendering in English and fits the poetic image.
- source_word: נְדָבוֹת
  chosen: abundant
  alternatives:
  - bountiful
  - freewill
  - generous
  lexicon: HALOT
  rationale: Literally related to freewill offerings or voluntariness, but in this collocation with 'rain' it idiomatically conveys lavishness or generosity. 'Abundant' communicates the sense clearly in modern English without forcing sacrificial imagery into the line.
- source_word: תָּנִיף
  chosen: you poured down
  alternatives:
  - you caused to rain
  - you shook out
  lexicon: HALOT
  rationale: Concrete contextual rendering of God’s causing the rain to fall.
- source_word: אֱלֹהִים
  chosen: O God
  alternatives:
  - God
  lexicon: HALOT
  rationale: Direct address is appropriate in this poetic line, and the vocative sense is natural in English. 'O God' preserves the prayerful-poetic register.
- source_word: נַחֲלָתְךָ
  chosen: your inheritance
  alternatives:
  - your possession
  - your heritage
  lexicon: HALOT
  rationale: The term commonly refers to an inheritance or allotted possession, often God's covenant people/land. 'Your inheritance' is the most transparent and traditional rendering without over-specifying whether people or land is primary.
- source_word: וְנִלְאָה
  chosen: your inheritance was weary
  alternatives:
  - and it was exhausted
  - when it languished
  lexicon: HALOT
  rationale: Keeps the coordinated clause without adding a temporal relation.
- source_word: כּוֹנַנְתָּהּ
  chosen: you sustained it
  alternatives:
  - you restored it
  - you made it firm
  - you sustained it
  lexicon: HALOT
  rationale: Expresses making firm or maintaining the weary inheritance without implying restoration.
