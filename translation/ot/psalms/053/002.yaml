  from: God looks down from heaven on the children of man to see whether there is anyone who has understanding[a], who seeks God.
  to: God looks down from heaven on humanity[a] to see whether there is anyone who has understanding, who seeks God.
  rationale: בְּנֵי אָדָם is a collective idiom for human beings, not a reference to a subset who are literally children. “Humanity” is a natural collective English equivalent; the note honestly retains the Hebrew image and possible Adam association.
