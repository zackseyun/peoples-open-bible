  to: 야훼여, 제가 주님을 기다려 왔으므로, 주님, 저의 하나님이시여, 주님께서 응답하실 것입니다.
  rationale: 원문의 כִּי는 앞 문맥에 대한 근거를 나타내는 ‘~으므로’로, לְךָ הוֹחָלְתִּי는 자연스러운 한국어 관용에 따라 ‘주님을 기다려 왔으므로’로 옮겼습니다. 완료형의 지속적·확립된 태도는 ‘기다려 왔습니다’로 반영했습니다. אַתָּה תַעֲנֶה의 강조된 2인칭은 ‘주님께서’로 드러냈고, 응답의 목적어는 원문처럼 밝히지 않았습니다. 기존 각주는 현 절과 무관하므로 남기지 않았습니다.
