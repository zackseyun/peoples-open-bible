  baseline_path: translation_simplified/extra_canonical/testaments_twelve_patriarchs/gad/005.yaml
  from: '1. Hatred is evil. It continually keeps company with falsehood and speaks against the truth. It makes small matters seem great, presents light as darkness, and calls what is sweet bitter. It teaches slander and stirs up anger and war. It fills the heart with insolence, every kind of greed, all kinds of evil, and devilish poison.


    2. So I tell you these things from my own experience, my children: drive out this devilish hatred and cling to the love of God. 3. Righteousness drives out hatred, and humility removes jealousy. A righteous and humble person is ashamed to act unjustly. This is not because someone else condemns him, but because his own heart does, for the Lord watches over his soul. 4. He does not speak against a holy person, because the fear of God lives in him. 5. He fears offending the Lord, so he does not want to wrong anyone—not even in his thoughts.


    6. I learned these things only later, after I changed my mind about Joseph. 7. True repentance according to God [removes ignorance and][a] drives darkness away. It enlightens the eyes, gives knowledge to the soul, and guides a person''s purpose toward salvation. 8. He did not learn this from human beings; through repentance he knows how to receive those who turn back.[b]


    9. God brought liver disease upon me. If my father''s prayers had not helped me, my spirit would almost have failed. 10. A person is punished through the very things by which he transgresses. 11. Because my liver had been pitilessly set against Joseph, I too was judged pitilessly: I suffered in my liver for ten months.[c]'
