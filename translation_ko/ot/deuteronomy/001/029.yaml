  source_fidelity: 히브리어는 모세의 과거 발화와 두 개의 병렬된 금지(לֹא תַעַרְצוּן, וְלֹא תִירְאוּן), 그리고 두 동사 모두에 걸리는 대상 ‘그들로 인하여/그들을’(מֵהֶם)을 담고 있습니다. 초안의 ‘그들 때문에’는 가능한 해석이지만, 원문의 직접적인 두려움의 대상을 원인절로 다소 풀어 씁니다.
  naturalness: ‘그들을 겁내지 말고 두려워하지 마십시오’는 현대 표준어 합쇼체로 자연스럽고, 두 금지 표현의 병렬과 점층을 유지합니다.
