  from: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
  to: Let the king appoint officials in every province of his kingdom to gather every beautiful young virgin to the harem in the citadel of Susa, into the custody of Hegai, the king’s eunuch in charge of the women. Let them be provided with beauty treatments.
  rationale: The lexical record already recognizes both the harem setting and the broader sense of beauty treatments, but kept them outside the main wording for formal transparency. I bring those meanings into the text while preserving the established rendering of Hegai as a eunuch and the women’s placement in his custody.
