translation:
  text: And when I awoke, I came to them, and they were all sitting together, weeping
    at Abälsyael, which is between Lebanon and Seniser, with their faces covered.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected printed spellings are አበልስያኤል, here rendered Abälsyael, and
      ሴኒሴር, Seniser. Both are starred; apparatus notes 32–33 list variant spellings.
      These are critical-edition selections, not fresh manuscript testimony or certain
      modern geographical identifications.
    reason: textual_variant
lexical_decisions:
- source_word: ነቂህየ
  chosen: when I awoke
  alternatives:
  - after I awoke
  rationale: Renders the awakening that precedes Enoch’s return without adding detail
    to the vision.
- source_word: መጻእኩ፡ ኀቤሆሙ
  chosen: I came to them
  alternatives:
  - I went to them
  rationale: Retains the verb of coming and its direction toward the group.
- source_word: ጉቡኣን፡ ይነብሩ
  chosen: were sitting together
  alternatives:
  - were seated in an assembly
  rationale: Conveys both their gathered state and the action of sitting in natural
    English.
- source_word: ይላሕዉ
  chosen: weeping
  alternatives:
  - lamenting
  rationale: Preserves the visible expression of grief without specifying its cause.
- source_word: አብልስያኤል
  chosen: Abelsyael
  rationale: Transliterates the place name in the supplied Ge’ez rather than substituting
    an uncertain identification.
- source_word: ሴኒሴር
  chosen: Seniser
  rationale: Transliterates the supplied place name without emendation.
- source_word: ግልቡባን፡ ገጾሙ
  chosen: with their faces covered
  alternatives:
  - covering their faces
  rationale: Preserves the covered-face image without assigning an agent or motive.
theological_decisions:
- issue: The meaning of the weeping and covered faces
  chosen_reading: Report the actions without explaining their motive.
  alternative_readings:
  - in shame
  - in repentance
  rationale: The verse depicts weeping and covered faces but does not explicitly say
    why; adding a motive would resolve more than the witness states.
