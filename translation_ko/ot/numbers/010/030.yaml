id: NUM.10.30
reference: Numbers 10:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו לֹ֣א אֵלֵ֑ךְ כִּ֧י אִם אֶל אַרְצִ֛/י וְ/אֶל מוֹלַדְתִּ֖/י אֵלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/030.yaml
  text: But he said to him, “I will not go. Rather, I will go to my own land and to my own kindred.”
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「저는 가지 않겠습니다. 오히려 제 고향과 제 친족에게로 가겠습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אֵלֵךְ
  english_pob_choice: I will not go
  chosen_korean: 저는 가지 않겠습니다
  alternatives_korean:
  - 나는 가지 않겠습니다
  - 가지 않겠습니다
  lexicon: לֹא + הלך
  rationale: 부정 의지 표현을 평서형 합쇼체로 옮겨, 단순한 미래가 아니라 ‘가지 않겠다’는 결의를 분명히 드러냈습니다.
- source_word: אֶל אַרְצִי
  english_pob_choice: to my own land
  chosen_korean: 제 고향으로
  alternatives_korean:
  - 제 땅으로
  - 제 나라로
  lexicon: ארץ
  rationale: 문맥상 단순한 토지보다 ‘자기 소속의 출신지’가 강조되므로, 한국어에서는 자연스럽고 포괄적인 ‘고향’으로 옮겼습니다.
- source_word: וְאֶל מוֹלַדְתִּי
  english_pob_choice: and to my own kindred
  chosen_korean: 제 친족에게로
  alternatives_korean:
  - 제 혈족에게로
  - 제 동족에게로
  lexicon: מולדת
  rationale: מוֹלַדְתִּי는 출생지/친족 집단을 함께 환기하므로, POB의 ‘kindred’를 따라 친족 관계를 직접 드러냈습니다.
- source_word: כִּי אִם
  english_pob_choice: Rather
  chosen_korean: 오히려
  alternatives_korean:
  - 다만
  - 그보다는
  lexicon: כי אם
  rationale: 단순 접속이 아니라 앞선 거절을 강하게 대비시키는 전환이므로, POB의 ‘Rather’를 반영해 ‘오히려’로 처리했습니다.
theological_decisions:
- issue: 발화의 강도와 태도
  chosen_reading: 직접 인용의 결의 표현을 살려, 완곡하게 줄이지 않고 분명한 거절로 유지했습니다.
  alternative_readings:
  - 부드러운 의사표현으로 완화
  - 미래형으로 중립화
  rationale: 히브리어의 לֹא אֵלֵךְ는 단순 정보 전달보다 의지적 거절이므로, 인물 발화를 약화시키지 않는 것이 원문 충실도에 부합합니다.
  doctrine_reference: 원문 서사어조 보존
