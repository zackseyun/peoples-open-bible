translation:
  text: '“The people who handed in rods that were half green and half dry are caught up in business affairs.
    They do not keep close to the holy ones. That is why half of them is alive and half is dead.”[a]


    2. “Many heard my commandments and repented. Their dwelling is in the tower. But some turned away
    completely. These have no repentance. Their business affairs led them to blaspheme and deny the Lord.
    They lost their life through the wickedness they committed.”[b]


    3. “Many wavered. These still have an opportunity to repent if they repent quickly. If they do, their
    dwelling will be in the tower. If they repent more slowly, they will dwell in the walls. If they do
    not repent, they too have lost their life.”


    4. “The people who handed in rods that were two-thirds green and one-third dry denied in various ways.”[c]


    5. “Many repented and went to dwell in the tower. But many turned away from God completely. They lost
    their life completely. Some wavered and were at odds. So these have an opportunity to repent if they
    repent quickly and do not keep pursuing their pleasures. If they keep doing their deeds, they too
    bring death upon themselves.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: 'Pragmateiai means business or practical affairs. “Holy ones” renders hagioi as the community’s
      people; alternative: “saints.” The half-alive/half-dead image remains distinct from complete death.
      Michigan loses about nine lines over most of this opening, Bonner printed p. 108, so cannot certify
      the whole paragraph.'
  - marker: b
    reason: textual_variant
    text: 'The working text says these people have no repentance; Michigan has “no longer,” Bonner printed
      p. 108. Alternative: “These no longer have repentance.” The statement concerns the group that turned
      away completely, blasphemed and denied the Lord; the following paragraph separately gives the wavering
      group a conditional opportunity.'
  - marker: c
    reason: textual_variant
    text: 'Two-thirds green and one-third dry is the 1891 edition’s version-supported correction. Athos
      reverses the colors: “Those who handed in rods that were two-thirds dry and one-third green are
      people who denied in various ways.” Michigan has a gap of about nine lines here, Bonner printed
      p. 109, and cannot decide the proportions. The draft provisionally retains the working correction,
      recording the Athos alternative rather than claiming unanimous Greek evidence. The object of denied
      is implicit in Greek; no new explicit object is inserted.'
  - marker: d
    reason: textual_variant
    text: 'The selected 1891 clause lacks explicit “still” (eti), unlike paragraph 3; the supplied comparison
      reports that Michigan explicitly has “still,” Bonner printed p. 109. Alternative: “So these still
      have an opportunity to repent if they repent quickly and do not keep pursuing their pleasures.”
      The main text retains the selected clause’s distinction from that reported alternative. Neither
      wording promises unconditional salvation. “Completely” preserves the repeated eis telos without
      selecting an unstated precise duration; alternative sense: “to the end.” The quick-repentance and
      no-continuing-pleasures conditions, and the warning about persistent deeds, remain explicit.'
lexical_decisions:
- source_word: μετάνοια / διψυχεῖν
  chosen: repentance / waver
  alternatives:
  - turning back / be double-minded
  rationale: 'Retain distinct groups, response conditions and warnings. An opportunity to repent is not
    the same as actual repentance or achieved salvation. Reconsideration of the prior lexical rendering
    in paragraph 5: retain “wavered” for ἐδιψύχησαν, but replace “caused divisions” with “were at odds”
    for ἐδιχοστάτησαν, which describes division or variance without explicitly assigning causative agency.
    Independent reconsideration of the prior lexical inclusion of “still” in paragraph 5 against the supplied
    Greek: omit it because the selected clause lacks ἔτι, and render οὖν with “So.” Retain “still” in
    paragraph 3, where ἔτι is explicit; disclose the reported Michigan wording separately in note d. Simplification
    preserves this source distinction.'
- source_word: πραγματεῖαι / εἰς τέλος
  chosen: business affairs / completely
  alternatives:
  - practical affairs / to the end
  rationale: Preserve the practical entanglement and the repeated finality language without imposing a
    precise duration not stated by the Greek.
