id: PRO.20.30
reference: Proverbs 20:30
source:
  edition: WLC
  text: חַבֻּר֣וֹת פֶּ֭צַע תמריק בְּ/רָ֑ע וּ֝/מַכּ֗וֹת חַדְרֵי בָֽטֶן־׃
translation:
  text: Wounding blows cleanse away evil, and beatings cleanse the innermost chambers[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the chambers of the belly,” meaning the hidden depths of a person's inner being.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַבֻּרוֹת
  chosen: bruises
  alternatives:
  - stripes
  - welts
  - wounds
  lexicon: HALOT
  rationale: The noun denotes marks left by blows, especially bruises or welts. 'Bruises' is natural modern English and fits the parallel with 'blows.' 'Stripes' is traditional but archaic in this context.
- source_word: פֶּצַע
  chosen: of a wound
  alternatives:
  - wound
  - injury
  lexicon: HALOT
  rationale: 'Taken as a genitive construction with חַבֻּרוֹת: ''bruises of a wound,'' intensifying the image of corrective injury. Rendering the second noun explicitly preserves the Hebrew compactness without flattening it into a single term.'
- source_word: תמריק
  chosen: cleanse away
  alternatives:
  - purge
  - scrub away
  - cleanse
  lexicon: HALOT
  rationale: Hiphil of מרק carries the sense of cleansing/polishing/scouring. In context, the idea is that painful correction removes evil. 'Cleanse away' captures both the causative force and the metaphor of removal.
- source_word: בְּרָע
  chosen: evil
  alternatives:
  - wickedness
  - what is bad
  lexicon: HALOT
  rationale: 'The preposition with רע is best taken as the object affected by the cleansing idea: evil is removed. ''Evil'' is concise and morally weighty, fitting Proverbs'' ethical register.'
- source_word: וּמַכּוֹת
  chosen: and beatings
  alternatives:
  - and beatings
  - and strokes
  lexicon: HALOT
  rationale: “Beatings” naturally renders the concrete plural noun and maintains the parallel disciplinary imagery.
- source_word: חַדְרֵי בָטֶן
  chosen: the innermost chambers of the belly
  alternatives:
  - the inner chambers of the belly
  - the depths of the inner being
  lexicon: HALOT
  rationale: This preserves the Hebrew's bodily-spatial image rather than substituting only its inferred sense.
- source_word: חַבֻּרוֹת פֶּצַע
  chosen: wounding blows
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The compact expression denotes injurious blows, welts, or marks; “wounding blows” is natural English and preserves its concrete force.
