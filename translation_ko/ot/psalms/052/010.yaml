  text: I will give thanks to you forever, because you have done it; I will hope in your name[a], for it is good[b], in the presence of your faithful ones.
  footnotes:
  - marker: a
    text: Or, “I will wait for your name.”
    reason: lexical_alternative
  - marker: b
    text: Or, “for your name is good.”
    reason: alternative_reading
translation:
  language: ko
  text: 주께서 행하셨으므로, 제가 영원히 주께 감사드리겠습니다. 주의 신실한 이들 앞에서 주의 이름에 소망을 두겠습니다.[a] 그것이 선하기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주의 이름을 기다리겠습니다’입니다. 히브리어 동사는 기다림과 소망의 뜻을 함께 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 이름이 선하기 때문입니다.’ 히브리어는 ‘선하다’의 주어를 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
