  category: footnotes
  tier: 1
  from: They are filled from the richness of your house[a][b], and you give them drink from the river of your delights.
  to: They are filled from the richness of your house, and you give them drink from the river of your delights.[a]
  rationale: The proposed first clause is possible, but it unnecessarily narrows יִרְוְיוּן ('they are sated/filled') to literal drinking and replaces the source image of דֶּשֶׁן ('fatness/richness') with the more abstract 'abundance.' The present wording is source-faithful and adequately natural in poetic English; the juxtaposition with 'give them drink' need not make the first verb literal. The footnote placement and removal of the now-redundant alternative are sound. The Eden claim is only a possible lexical resonance and should remain explicitly tentative.
