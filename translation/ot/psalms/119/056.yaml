id: PSA.119.56
reference: Psalms 119:56
source:
  edition: WLC
  text: זֹ֥את הָֽיְתָה לִּ֑/י כִּ֖י פִקֻּדֶ֣י/ךָ נָצָֽרְתִּי־׃
translation:
  text: This has been mine, because I have kept your precepts[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'Or, “This has been my practice: I have kept your precepts.”'
    reason: alternative_reading
lexical_decisions:
- source_word: פִקֻּדֶיךָ
  chosen: precepts
  alternatives:
  - orders
  - charges
  lexicon: HALOT
  rationale: פִּקּוּדִים are the specific charges God appoints. 'Precepts' keeps this term distinct from statutes and commandments.
