  meaning: Abram presses his complaint that God has given him no offspring and a member of his household will therefore become his heir.
  meaning_decisions:
  - source_phrase: וַיֹּאמֶר אַבְרָם
    prior_rendering: Then Abram said
    new_rendering: Abram continued
    rationale: Abram is continuing the same appeal, with no intervening response; English can make that continuity explicit.
  - source_phrase: הֵן ... וְהִנֵּה
    prior_rendering: Behold ... and behold
    new_rendering: You have given me no offspring, and now
    rationale: The direct accusation and “and now” carry the particles' emphatic presentation of Abram's predicament without repeated archaic attention commands.
  - source_phrase: בֶן בֵּיתִי
    prior_rendering: a son of my household
    new_rendering: a member of my household
    rationale: This household idiom denotes someone belonging to Abram's household, not his biological son; the distinction is central to Yahweh's answer.
  - source_phrase: יוֹרֵשׁ אֹתִי
    prior_rendering: will inherit me
    new_rendering: will be my heir
    rationale: The Hebrew uses Abram himself to stand for what passes to his successor; “will be my heir” conveys that meaning without suggesting that a person can be inherited.
