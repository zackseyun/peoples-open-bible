lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 합창 지휘자에게
  - 음악 감독에게
  - 인도자에게
  lexicon: HALOT
  rationale: 시편 표제에서 공연을 맡은 사람을 가리키는 관용 표현으로 보고, 현대 한국어로는 기능을 가장 간결하게 드러내는 ‘지휘자에게’가 자연스럽습니다.
- source_word: עַל הַגִּתִּית
  english_pob_choice: according to the Gittith
  chosen_korean: 깃딧에 따라
  alternatives_korean:
  - 깃딧에 맞추어
  - 깃딧 선율에 따라
  - 깃딧에
  lexicon: HALOT
  rationale: ‘깃딧’의 정확한 뜻이 확정되지 않아 음역을 유지하고, עַל의 음악적 지시 용법은 ‘~에 따라’로 옮겨 불확실성을 보존했습니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시입니다
  alternatives_korean:
  - 시편입니다
  - 노래입니다
  - 찬가입니다
  lexicon: HALOT
  rationale: 표제의 장르 표지를 한국어로는 가장 표준적인 ‘시’로 옮기되, 문장 형태를 자연스럽게 하기 위해 종결 표현을 붙였습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗이 지은
  - 다윗에게 속한
  - 다윗을 위한
  lexicon: HALOT
  rationale: לְ의 소유·귀속·헌정 가능성을 한 가지로 확정하지 않기 위해, 영어 POB의 ‘of David’에 맞춰 ‘다윗의’로 옮겨 관계의 유연성을 남겼습니다.
theological_decisions:
- issue: לְדָוִד의 관계를 저자 표시로 단정할지 여부
  chosen_reading: ‘다윗의’로 두어 저자성, 관련성, 헌정 가능성을 열어 둡니다.
  alternative_readings:
  - ‘다윗이 지은’으로 저자를 단정함
  - ‘다윗을 위한’으로 헌정 의미로 한정함
  rationale: 히브리어 표제가 허용하는 범위를 좁히지 않고, 본문이 남겨 둔 역사적 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
