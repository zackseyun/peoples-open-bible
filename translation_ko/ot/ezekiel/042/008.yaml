  yaml_path: translation/ot/ezekiel/042/008.yaml
  text: For the length of the chambers that were by the outer court was fifty cubits, and behold, the part facing the temple was a hundred cubits.
translation:
  language: ko
  text: 밖뜰 곁에 있는 방들의 길이는 오십 규빗이었고, 보십시오, 성전을 마주한 쪽은 백 규빗이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרֶךְ ... הַ/לְּשָׁכ֗וֹת
  english_pob_choice: the length of the chambers
  chosen_korean: 방들의 길이
  alternatives_korean:
  - 골방들의 길이
  - 방들의 장이
  lexicon: לְשָׁכוֹת
  rationale: 문맥상 성전 단지의 부속 방들을 가리키므로 자연스러운 표준어인 ‘방들’을 택하되, 건축적 구조라는 의미는 ‘길이’로 유지했습니다.
- source_word: לֶ/חָצֵ֥ר הַ/חִֽצוֹנָ֖ה
  english_pob_choice: by the outer court
  chosen_korean: 밖뜰 곁에 있는
  alternatives_korean:
  - 바깥뜰에 있는
  - 외뜰에 있는
  lexicon: חָצֵר / חִצוֹנָה
  rationale: 성전 문맥의 전문 용어를 살리기 위해 ‘뜰’을 유지하고, ‘חִצוֹנָה’는 직역적인 ‘밖’으로 풀어 바깥 구역임을 드러냈습니다.
- source_word: וְ/הִנֵּ֛ה
  english_pob_choice: and behold
  chosen_korean: 보십시오,
  alternatives_korean:
  - 보라,
  - 그리고 보니,
  lexicon: הִנֵּה
  rationale: 히브리어의 주의 환기 기능을 살리면서도 현대 한국어에서 자연스럽게 읽히는 감탄/전환 표현으로 옮겼습니다.
- source_word: עַל פְּנֵ֥י הַ/הֵיכָ֖ל
  english_pob_choice: the part facing the temple
  chosen_korean: 성전 앞쪽
  alternatives_korean:
  - 성전을 마주한 부분
  - 성전 앞면
  lexicon: עַל פְּנֵי
  rationale: ‘face/facing’의 공간 관계를 직접 살려, 단순한 위치 설명이 아니라 성전을 향해 놓인 방향성을 드러냈습니다.
theological_decisions:
- issue: 건축 측정 단위인 אַמָּה의 번역
  chosen_reading: ‘규빗’으로 옮겨 성전 환상 본문의 측량 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘자’
  - ‘큐빗’
  rationale: 본문은 제의적 건축 측정치에 관한 기술문이므로 전통적으로 통용되는 ‘규빗’을 사용해 정확성과 가독성을 함께 확보했습니다.
  doctrine_reference: 성전 환상 본문의 문자적·상징적 기술 유지
