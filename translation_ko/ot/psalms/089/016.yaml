lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed are
  chosen_korean: 복되다
  alternatives_korean:
  - 행복하다
  - 복이 있다
  lexicon: HALOT
  rationale: 히브리어 축복 선언의 시작을 한국어에서 문장형 감탄으로 살리기 위해 ‘복되다’를 택했습니다.
- source_word: תְרוּעָה
