base_translation:
  language: en
  yaml_path: translation/nt/luke/003/032.yaml
  text: the son of Jesse, the son of Jobed, the son of Boaz, the son of Sala, the son of Nahshon,
translation:
  language: yo
  text: ọmọ Jésè, ọmọ Jóbẹli, ọmọ Bóósì, ọmọ Sálà, ọmọ Náásónì,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: ọmọ
  rationale: Nínú àkọsílẹ̀ ìran yìí, ọ̀rọ̀ ìbátan náà túmọ̀ sí pé ẹni tí a mẹ́nu kàn tẹ̀ lé e jẹ́ baba tàbí baba ńlá ẹni ṣáájú; ‘ọmọ’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere tí ó sì bá ìṣètò gbolohun náà mu.
- source_word: Ἰεσσαὶ
  choice: Jésè
  rationale: Àkọsílẹ̀ orúkọ náà ní Yorùbá, pẹ̀lú àmì ohùn tó yẹ.
- source_word: Ἰωβὴλ
  choice: Jóbẹli
  rationale: A tẹ̀ lé kíkà SBLGNT Ἰωβὴλ (Iōbēl) dípò lílo ‘Óbédì’ láti inú àṣà àkọsílẹ̀ ìran Majẹmu Láéláé.
- source_word: Βόος
  choice: Bóósì
  rationale: Àkọsílẹ̀ Yorùbá tó sun mọ́ fọ́ọ̀mù Gíríìkì Βόος, tí ó ń tọ́ka sí Bóásì.
- source_word: Σαλὰ
  choice: Sálà
  rationale: A pa fọ́ọ̀mù orúkọ inú SBLGNT mọ́ láì fi ‘Sálmónì’ rọ́pò rẹ̀.
- source_word: Ναασσὼν
  choice: Náásónì
  rationale: Àkọsílẹ̀ Yorùbá tó sun mọ́ ìpè Gíríìkì náà.
theological_decisions:
- issue: Bóyá kí a mú àwọn orúkọ bá àkọsílẹ̀ Majẹmu Láéláé mu
  choice: 'A túmọ̀ àwọn fọ́ọ̀mù tí SBLGNT ní gẹ́gẹ́ bí wọ́n ṣe wà: Jóbẹli àti Sálà.'
  alternative: Óbédì àti Sálmónì, gẹ́gẹ́ bí àkọsílẹ̀ ìran Rúùtù 4 àti Mátíù 1.
  rationale: Ẹ̀rí orísun fún ẹsẹ yìí ní Ἰωβὴλ àti Σαλὰ; ṣíṣe àtúnṣe wọn sí àwọn orúkọ tí a mọ̀ jù lọ yóò yanjú ìyàtọ̀ inú ẹ̀rí náà láìjẹ́ pé ọrọ̀ Gíríìkì fúnra rẹ̀ ṣe bẹ́ẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. A pa àtòjọ ìran náà mọ́ ní ọ̀nà kúkúrú, láì tún ‘ẹni tí ó jẹ́’ ṣe lẹ́ẹ̀kọ̀ọ̀kan.
