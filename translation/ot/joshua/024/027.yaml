  from: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
  to: And Joshua said to all the people, “Look, this stone will be a witness against us, for it has heard all the words Yahweh spoke to us. It will be a witness against you, so that you do not prove false to your God[a].”
  rationale: I preserve the strongly supported personification of the stone as hearing and witnessing, along with the warning force of “against us” and “against you.” The history’s documented alternative “prove false to” better conveys covenant betrayal here, while “deny” remains in a note.
