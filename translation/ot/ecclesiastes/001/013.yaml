id: ECC.1.13
reference: Ecclesiastes 1:13
source:
  edition: WLC
  text: וְ/נָתַ֣תִּי אֶת לִבִּ֗/י לִ/דְר֤וֹשׁ וְ/לָ/תוּר֙ בַּֽ/חָכְמָ֔ה עַ֛ל כָּל אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁמָ֑יִם ה֣וּא עִנְיַ֣ן רָ֗ע נָתַ֧ן אֱלֹהִ֛ים לִ/בְנֵ֥י הָ/אָדָ֖ם לַ/עֲנ֥וֹת בּֽ/וֹ־־׀׃
translation:
  text: I devoted myself to using wisdom to investigate and explore all that is done under heaven. This is a burdensome task God has given human beings to occupy them[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “for them to be afflicted by it.” The Hebrew can suggest both occupation and affliction.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי אֶת לִבִּי
  chosen: And I set my heart
  alternatives:
  - And I gave my heart
  - And I applied my mind
  lexicon: HALOT
  rationale: The idiom literally reads 'I gave my heart,' but in English 'set my heart' preserves the deliberate inward resolve without sounding unnatural. 'Heart' is retained rather than 'mind' because Hebrew לֵב/לֵבָב includes intellect and will, and the idiom is important in Qoheleth.
- source_word: לִדְרוֹשׁ וְלָתוּר
  chosen: to seek and to explore
  alternatives:
  - to inquire and to search out
  - to investigate and to examine
  lexicon: HALOT
  rationale: 'The paired infinitives are near-synonyms but not redundant: דרש conveys seeking/inquiring, while תור suggests exploring or searching out. ''Seek and explore'' preserves the twofold investigative emphasis in readable English.'
- source_word: בַּחָכְמָה
  chosen: by wisdom
  alternatives:
  - with wisdom
  - wisely
  lexicon: HALOT
  rationale: The prefixed ב marks means or manner. 'By wisdom' best conveys that wisdom is the instrument or mode of investigation, while remaining natural.
- source_word: עַל כָּל אֲשֶׁר נַעֲשָׂה
  chosen: all that is done
  alternatives:
  - all that has been done
  - everything that is done
  lexicon: HALOT
  rationale: This phrase identifies the scope of inquiry. 'All that is done' is a straightforward rendering of the passive and fits the gnomic, generalizing tone of Ecclesiastes.
- source_word: תַּחַת הַשָּׁמָיִם
  chosen: under heaven
  alternatives:
  - under the heavens
  - under the sky
  lexicon: HALOT
  rationale: A standard Ecclesiastes expression for the human sphere. 'Under heaven' is idiomatic in English and preserves the book's repeated phrasing better than 'under the sky.'
- source_word: עִנְיַן
  chosen: task
  alternatives:
  - business
  - occupation
  - matter
  lexicon: HALOT
  rationale: In Ecclesiastes this noun often denotes an occupation or business that occupies human beings. 'Task' is concise and natural here, especially with the following infinitive about being occupied.
- source_word: רָע
  chosen: burdensome
  alternatives:
  - evil
  - bad
  - unhappy
  lexicon: HALOT
  rationale: In context the adjective characterizes the divinely given occupation as grievous or oppressive, rather than morally evil.
- source_word: לִבְנֵי הָאָדָם
  chosen: to human beings
  alternatives:
  - to humankind
  - to the children of man
  - to human beings
  lexicon: HALOT
  rationale: The phrase is a generic idiom for humanity; this rendering is natural English, and the literal source form is supplied in the note.
- source_word: לַעֲנוֹת בּוֹ
  chosen: to be occupied with
  alternatives:
  - to be afflicted by
  - to toil in
  - to be busied with
  lexicon: HALOT
  rationale: ענה in this stem can carry the sense of being occupied, busied, or afflicted. In this context, with עִנְיַן ('task/occupation'), the sense is that humanity is made to engage in or be burdened with this task. 'To be occupied with' captures the activity while allowing the burdened nuance to remain from 'grievous task.'
