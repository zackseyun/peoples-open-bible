  source_fidelity: 개정이 필요합니다. 히브리어는 실로의 위치를 세 가지 좌표(벧엘 북쪽, 벧엘에서 세겜으로 올라가는 길 동쪽, 레보나 남쪽)로 설명하는데, 초안은 이 관계들이 구두점 없이 연결되어 있어 ‘길 동편’과 ‘길 남쪽’의 수식 관계가 불명확합니다. 또한 레바나보다 통용 음역인 ‘레보나’가 적절합니다.
  naturalness: 초안의 ‘말하되’, ‘보라’, ‘있느니라’는 현대 표준어 합쇼체와 맞지 않습니다. 직접화법과 서술을 현대적인 합쇼체로 정리하고, 지리적 병렬 관계를 분명히 했습니다.
  terminology: יְהוָה는 제공된 POB 결정에 따라 ‘야훼’로 옮겼습니다. חַג는 문맥상 ‘절기’로 자연스럽고 충실합니다. 지명은 실로, 벧엘, 세겜, 레보나로 표기했습니다.
