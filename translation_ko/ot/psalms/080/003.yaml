  text: אֱלֹהִ֥ים הֲשִׁיבֵ֑/נוּ וְ/הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/003.yaml
  text: God, restore us[a], and make your face shine[c], that we may be saved[b].
  footnotes:
  - marker: a
    text: Or 'bring us back' or 'turn us back.' The Hebrew verb can mean to cause someone to return.
    reason: lexical_alternative
  - marker: b
    text: Or 'and we shall be saved.' The Hebrew form may be heard either as a prayer for the result or as a confident statement of the result.
    reason: alternative_reading
  - marker: c
    text: Literally 'make your face shine,' an image of divine favor and presence; compare the language of the priestly blessing in Numbers 6:25.
    reason: cross_reference
translation:
  language: ko
  text: 하나님, 우리를 회복시키시고[a] 주의 얼굴을 비추소서.[b] 그리하여 우리가 구원을 얻게 하소서.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 돌이키소서’ 또는 ‘우리를 돌아오게 하소서.’ 히브리어 동사는 ‘돌아오게 하다’라는 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘주의 얼굴을 빛나게 하소서.’ 이는 하나님의 은혜와 임재를 나타내는 비유이며, 민수기 6:25의 제사장 축복 표현과 비교할 수 있습니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘그러면 우리가 구원을 얻겠습니다.’ 히브리어 형태는 결과를 비는 기도로도, 확신에 찬 진술로도 이해될 수 있습니다.
    reason: alternative_reading
