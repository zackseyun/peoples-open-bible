id: PSA.91.1
reference: Psalms 91:1
source:
  edition: WLC
  text: יֹ֭שֵׁב בְּ/סֵ֣תֶר עֶלְי֑וֹן בְּ/צֵ֥ל שַׁ֝דַּ֗י יִתְלוֹנָֽן׃
translation:
  text: The one who dwells in the shelter[a] of the Most High will remain[b] in the shadow of the Almighty.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'hidden place,' a place of concealment and protection.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'will spend the night' or 'will lodge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  chosen: The one who dwells
  alternatives:
  - The one who dwells
  - Whoever dwells
  - He who sits
  lexicon: HALOT
  rationale: The participle describes a person characterized by ongoing residence. 'The one who' preserves the representative singular without making natural gender the point of the line.
- source_word: בְּסֵתֶר
  chosen: in the secret place
  alternatives:
  - in the secret place
  - in the hiding place
  - in the covert
  lexicon: HALOT
  rationale: סֵתֶר denotes a concealed or hidden place and can function as a place of shelter. 'Secret place' preserves the concealment image; 'hidden place' and 'shelter' remain in the note.
- source_word: עֶלְיוֹן
  chosen: the Most High
  alternatives:
  - Most High
  lexicon: HALOT
  rationale: A divine title meaning 'Most High.' The article is natural in English with a title used substantivally. This is a standard, transparent rendering that preserves the exalted divine epithet.
- source_word: בְּצֵל
  chosen: in the shadow
  alternatives:
  - under the shadow
  - in the shade
  lexicon: HALOT
  rationale: The preposition is simply 'in,' and the noun is 'shadow.' 'In the shadow' is closer to the Hebrew than the familiar expansion 'under the shadow,' while still idiomatic. The image conveys protection and nearness.
- source_word: שַׁדַּי
  chosen: the Almighty
  alternatives:
  - Shaddai
  lexicon: HALOT
  rationale: Per translation philosophy, titles are translated rather than transliterated. 'The Almighty' is the established semantic rendering for שַׁדַּי in most contexts and communicates divine power clearly in English.
- source_word: יִתְלוֹנָן
  chosen: will remain
  alternatives:
  - will abide
  - will spend the night
  - will remain
  lexicon: HALOT
  rationale: The verb from לון concretely pictures spending the night or lodging and can extend to remaining. 'Will remain' gives that contextual force in natural English, while the concrete nighttime sense remains explicit in the note.
