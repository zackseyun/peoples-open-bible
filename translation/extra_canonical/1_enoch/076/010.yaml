  - that face east
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Relative phrase locating the seven openings. 'Toward the east' preserves the directional idiom without over-interpreting the spatial model.
- source_word: '[መንገለ አዜብ]'
