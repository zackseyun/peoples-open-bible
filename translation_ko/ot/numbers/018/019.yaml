  to: 이스라엘 자손이 주께 드리는[a] 거룩한 것들의 모든 헌물은 내가 너와, 너와 함께 있는 네 아들들과 네 딸들에게 영원한 규례로 주었습니다. 그것은 주 앞에서 너와 너와 함께 있는 네 후손에게 영원한 소금 언약입니다.
  rationale: 원문의 수여 대상에 붙는 ‘너와 함께’를 각각 아들들·딸들 및 후손에 연결해 의미를 보존하고, 중복되고 어색한 표현을 바로잡았습니다. 제의적 ‘들어 올림’ 주석 표지는 해당 동사 번역 직후로 옮겼습니다.
