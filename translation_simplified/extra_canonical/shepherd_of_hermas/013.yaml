  label: Vision 3, section v
  sequence: 13
translation:
  text: 'V.1. “Listen now about the stones that go into the building. The stones, then, that are square
    and white and fit together at their joints[a] are the apostles, bishops[b], teachers, and deacons[c].
    They walked in God’s reverent dignity[d]. They oversaw, taught, and served God’s chosen people with
    purity and reverence[e]. Some have fallen asleep[f], and some are still alive. They always agreed
    with one another, had peace among themselves, and listened to each other[v]. That is why their joints
    fit in the building of the tower.”


    V.2. “Who are the ones drawn up from the deep[g] and placed in the building, fitting at their joints
    with the other stones already built?” “They are the ones who suffered because of the name of the Lord[h].”


    V.3. “Lady, I want to know who the other stones carried from the dry land[i] are.” She said, “The
    Lord approved those that go into the building without being cut[j], because they walked in the Lord’s
    uprightness[k] and accomplished his commandments[l].”


    V.4. “Who are the ones being brought and placed in the building?” “They are new in the faith and faithful[m].
    But the angels admonish them[n] to do good, because evil was found in them[u].”


    V.5. “Who are those they were casting away and throwing aside[o]?” “They are people who have sinned
    and want to repent[p][t]. That is why they were not thrown far away outside the tower: they will be
    useful for the building[q] if they repent. So those who are going to repent, if they repent, will
    be strong in the faith, if they repent now while the tower is being built[w]. But if the building
    is completed, they no longer have a place and will be cast out[r]. They have only this: to lie beside
    the tower[s].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Joints renders harmogai, the joinings where stones meet. The agreement among the people and
      the fit among the stones are explicitly linked. The earlier fit-together-at-their-joints adjudication
      is retained; the old previous-rendering t note remains archived rather than being attached to repentance.
    reason: lexical_alternative
  - marker: b
    text: Bishops renders episkopoi, also overseers. The selected list gives four roles; this translation
      does not settle the later organization or hierarchy of church offices.
    reason: lexical_alternative
  - marker: c
    text: Deacons renders diakonoi, also ministers. Its service verb diakonēsantes is rendered served.
      These are distinct from doulos, which does not occur in this passage; no bonded-status claim is
      inferred from these service terms.
    reason: lexical_alternative
  - marker: d
    text: 'Reverent dignity renders semnotēs, also solemnity or gravity. God supplies the standard in
      the selected according-to phrase. The versions phrase this differently: Vulgata printed19 uses clemency
      and Palatina printed41 purity and holiness. The selected wording is retained.'
    reason: textual_variant
  - marker: e
    text: God’s elect are the people receiving the oversight, teaching and service; with purity and reverence
      describes the conduct of those serving. Palatina printed39/41 retains the role list but lacks the
      selected explicit oversight/teaching/service verb trio. The trio is retained in both editions here.
    reason: textual_variant
  - marker: f
    text: Have fallen asleep is the death metaphor in the selected paragraph1. The translation preserves
      it here; it does not add death to the selected paragraph2 merely because Athos and Vulgata printed19
      add fallen-asleep wording to that later answer.
    reason: textual_variant
  - marker: g
    text: The deep renders bythos. Sinaiticus13.2 first has two unreadable-character gaps among the set/fitting
      words; S1 gives the fuller corrected expressions. These corrected words are not claimed as wholly
      visible first-hand letters. The selected full description of being drawn up, placed and fitting
      with stones already built remains.
    reason: textual_variant
  - marker: h
    text: The selected text names suffering for the name of the Lord. Athos PlateII and both printed Latin
      versions retain Lord; Sinaiticus13.2 has God. Vulgata printed19 and Athos also say these people
      have fallen asleep, while the Ethiopic edition’s Latin rendering printed120 says killed for the
      Lord’s name. The selected answer says suffered and is not expanded to died or replaced by the technical
      label martyrs.
    reason: textual_variant
  - marker: i
    text: Dry land contrasts with the deep. Sinaiticus13.3 first has epi, on, changed by ca to apo, from.
      The selected from is retained without treating the corrected form as the first hand.
    reason: textual_variant
  - marker: j
    text: Without being hewn renders mē latomoumenous, without being quarried or cut. The selected Lord
      approved these differs from Sinaiticus13.3’s first this one/God, with a dotted theta, corrected
      by S1 to these/Lord. Vulgata printed19 also has God as approver; Palatina printed41 and the Ethiopic
      edition’s Latin rendering printed120 have Lord. The selected subject and plural object remain.
    reason: textual_variant
  - marker: k
    text: Uprightness renders euthytēs, the moral straightness image. The Lord’s uprightness and his commandments
      are separate source expressions; no additional test for admission is supplied.
    reason: lexical_alternative
  - marker: l
    text: Accomplished renders katorthōsanto, successfully carried out. The earlier doctrine-realignment
      decision restored accomplished after a revision to kept; that adjudication is retained. The versions’
      wording about directed ways or commandments is disclosed in the evidence record, not substituted
      silently.
    reason: lexical_alternative
  - marker: m
    text: Faithful renders pistoi, also believers. New in the faith and faithful are both retained; new
      does not remove the source’s assertion of faithfulness.
    reason: lexical_alternative
  - marker: n
    text: Admonished renders nouthetountai, corrective instruction or warning. Angels are the grammatical
      agents in the vision. The translation retains them rather than substituting unnamed human teachers.
    reason: lexical_alternative
  - marker: o
    text: The actual LH1891 print on physical323 has eripton, ἔριπτον; the import had eritton, ἔριττον.
      This one printed transcription error is corrected in raw, normalized and attached source. The old
      note that treated the malformed import as a manuscript variant is superseded and fully archived.
      No new manuscript-selection locus is introduced; the throwing action remains.
    reason: textual_variant
  - marker: p
    text: Repent renders metanoeō in the explicit have-sinned context. The clause preserves wanting to
      repent, usefulness if they repent, strength if they repent now, and the tower-building deadline.
      It does not reduce repentance to regret or add an automatic toward-God formula.
    reason: lexical_alternative
  - marker: q
    text: Useful renders euchrēstoi, serviceable or fit for use. Their future usefulness is conditional
      on repentance; it is not a present guarantee of incorporation.
    reason: lexical_alternative
  - marker: r
    text: Cast out renders ekboloi, also rejected or excluded. The selected completion clause says they
      no longer have a place; neither that denial nor the future exclusion is softened to a mere warning.
    reason: lexical_alternative
  - marker: s
    text: To lie beside the tower is the final selected infinitive. Near the tower is not the same as
      being built into it. Athos PlateIII instead has a finite they lie, and bracketed portions elsewhere
      in its paragraph5 are distinguished from preserved text.
    reason: textual_variant
  - marker: t
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: u
    text: The selected Greek positively says evil was found in them; Sinaiticus13.4 and Palatina printed43
      likewise have a positive clause. Athos PlateII has ouch, not; Vulgata printed19–20 and the Ethiopic
      edition’s Latin rendering printed120 also have no evil found. The selected positive is retained
      with the disagreement disclosed. Palatina printed41’s non in an apparatus note concerns new, not
      the evil clause, and is not evidence for a negative in that clause.
    reason: textual_variant
  - marker: v
    text: The selected agreement, peace and listening clauses all remain. Sinaiticus13.1 first has to
      where S1 supplies and listened to one another, therefore; the corrected expansion is not treated
      as wholly preserved first-hand wording. Athos and the versions retain agreement/peace/listening
      in their own formulations.
    reason: textual_variant
  - marker: w
    text: All repeated repentance conditions and now while the tower is being built remain. Sinaiticus13.5
      has an unreadable-character gap before this group and a dotted, differently worded first sequence;
      S1/ca give a fuller repentance/condition/strong-in-faith sequence. Athos PlateIII prints much of
      this sequence in brackets, including willing/if-repent and the no-place/cast-out continuation; those
      restorations are not unbroken visible Athos text. Both Latin versions and the Ethiopic edition’s
      Latin rendering retain conditions and the construction deadline. Palatina printed43’s usefulness-reason
      preposition is an editorial correction of non propter to propter; the codex wording and edited statement
      are not counted as identical.
    reason: textual_variant
lexical_decisions:
- source_word: οἰκοδομή
  chosen: building
  alternatives:
  - construction
  - structure
  lexicon: LSJ
  rationale: Concrete image of a work under construction fits the tower allegory; “building” is the natural
    English counterpart.
- source_word: ἁρμογαί
  chosen: joints
  alternatives:
  - joinings
  - fittings
  lexicon: LSJ
  rationale: Refers to the points where stones meet; “joints” conveys structural interlocking without
    over-technicality.
- source_word: τετράγωνοι
  chosen: square
  alternatives:
  - four-sided
  - quadrangular
  lexicon: LSJ
  rationale: Common English for stones dressed with square faces; keeps imagery clear.
- source_word: λευκοί
  chosen: white
  lexicon: LSJ
  rationale: Plain descriptive color term; no need to embellish.
- source_word: ἀπόστολοι
  chosen: apostles
  lexicon: BDAG
  rationale: Established title for commissioned envoys in early Christianity; retains ecclesial resonance.
- source_word: ἐπίσκοποι
  chosen: bishops
  alternatives:
  - overseers
  lexicon: BDAG
  rationale: Retain bishops as the chosen role label, with overseers in the note; the word alone does
    not settle later hierarchy.
- source_word: διδάσκαλοι
  chosen: teachers
  alternatives:
  - instructors
  lexicon: BDAG
  rationale: Straightforward rendering of didactic role in the community.
- source_word: διάκονοι
  chosen: deacons
  alternatives:
  - ministers
  - servants
  lexicon: BDAG
  rationale: Technical office in early churches; preserves ecclesial nuance.
- source_word: σεμνότης (κατὰ τὴν σεμνότητα τοῦ Θεοῦ)
  chosen: reverent dignity
  alternatives:
  - gravity
  - solemnity
  lexicon: LSJ
  rationale: Conveys both seriousness and reverence; genitive points to God as the standard/source.
- source_word: ἁγνῶς
  chosen: with purity
  alternatives:
  - purely
  - chastely
  lexicon: LSJ
  rationale: Moral purity in ministerial conduct; “with purity” fits adverbial force.
- source_word: τοῖς ἐκλεκτοῖς
  chosen: God’s chosen people
  alternatives:
  - God’s chosen ones
  lexicon: BDAG
  rationale: “Elect” preserves theological weight and established usage.
- source_word: κοιμάομαι (κεκοιμημένοι)
  chosen: have fallen asleep
  alternatives:
  - have died
  lexicon: BDAG
  rationale: Conventional Christian euphemism for death; matches tone without importing later doctrinal
    connotations.
- source_word: βυθός
  chosen: the deep
  alternatives:
  - the depth
  - the abyss
  - the sea-bed
  lexicon: LSJ
  rationale: Retains the imagistic quality of being drawn up from a profound depth, consistent with the
    vision’s maritime setting.
- source_word: πάσχω (παθόντες)
  chosen: suffered
  alternatives:
  - endured
  - underwent affliction
  lexicon: LSJ
  rationale: Neutral, broad verb for experiencing hardship; context supplies cause (the Lord’s name).
- source_word: λατομέω (μὴ λατομουμένους)
  chosen: without being cut
  alternatives:
  - being quarried
  - being cut
  lexicon: LSJ
  rationale: Stone-working term; “hewn” is idiomatic in English for dressed stone.
- source_word: εὐθύτης
  chosen: uprightness
  alternatives:
  - straightness
  - integrity
  lexicon: LSJ
  rationale: Moral rectitude metaphorically expressed as straightness; “uprightness” is standard.
- source_word: κατωρθόω
  chosen: accomplished
  alternatives:
  - set right
  - carried out
  lexicon: LSJ
  rationale: Successfully carry out the commandments; retain the prior accomplished adjudication. No separate
    causative claim is required.
- source_word: πίστις
  chosen: faith
  alternatives:
  - trust
  - faithfulness
  lexicon: BDAG
  rationale: Default Cartha rendering; no genitive ambiguity here.
- source_word: πιστοί
  chosen: faithful
  alternatives:
  - believers
  lexicon: BDAG
  rationale: Carries both believing and loyal connotations; suits paraenetic context.
- source_word: νουθετέω
  chosen: admonished
  alternatives:
  - instructed
  - warned
  lexicon: BDAG
  rationale: Moral corrective sense is primary here; “admonish” preserves that edge.
- source_word: ἀγαθοποιεῖν
  chosen: to do good
  alternatives:
  - to practice good
  - to do what is good
  lexicon: BDAG
  rationale: Common ethical expression; idiomatic in English.
- source_word: πονηρία
  chosen: evil
  alternatives:
  - wickedness
  lexicon: BDAG
  rationale: General moral badness; “evil” is concise.
- source_word: ἀποβάλλω
  chosen: casting away
  alternatives:
  - rejecting
  - discarding
  lexicon: LSJ
  rationale: Describes removal of stones not yet usable; physical image retained.
- source_word: ῥίπτω (ἔριπτον)
  chosen: throwing aside
  alternatives:
  - flinging away
  lexicon: LSJ
  rationale: Correct the imported malformed form to printed eripton; throwing aside retains the action.
    This is a print transcription correction, not an attested-variant claim.
- source_word: ἁμαρτάνω (ἡμαρτηκότες)
  chosen: have sinned
  lexicon: BDAG
  rationale: Basic moral term; perfect participle denotes resultant state.
- source_word: μετανοέω
  chosen: repent
  alternatives:
  - change disposition and conduct
  lexicon: BDAG
  rationale: Contextual moral repentance follows named sin and is repeatedly conditional; no uniform Godward
    formula or regret-only meaning is imposed.
- source_word: εὔχρηστος
  chosen: useful
  alternatives:
  - serviceable
  - fit for use
  lexicon: LSJ
  rationale: Describes suitability for building; “useful” is natural English.
- source_word: ἰσχυρός
  chosen: strong
  alternatives:
  - stalwart
  - firm
  lexicon: BDAG
  rationale: Common term for strength; collocates well with “in the faith.”
- source_word: τελεσθῇ
  chosen: is completed
  alternatives:
  - is finished
  - is brought to completion
  lexicon: LSJ
  rationale: Completion of the building project; eschatological nuance preserved in theological note.
- source_word: ἔκβολοι
  chosen: cast out
  alternatives:
  - expelled
  - thrown out
  lexicon: LSJ
  rationale: Violent removal; “cast out” keeps the concreteness and solemn tone.
- source_word: παρὰ τῷ πύργῳ κεῖσθαι
  chosen: to lie beside the tower
  alternatives:
  - to be laid by the tower
  lexicon: LSJ
  rationale: Literal phrasing preserves the bleak, marginal status of such stones.
