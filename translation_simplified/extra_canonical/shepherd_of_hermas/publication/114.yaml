  text: 'Ait deinde mihi: Viriliter in ministerio hoc conversare; omni homini indica magnalia Domini;
    et habebis gratiam in hoc ministerio. quicumque ergo in his mandatis ambulaverit, vivet et felix erit
    in vita sua; quicumque vero neglexerit, non vivet et erit infelix in vita sua. 2. dic omnibus ut non
    cessent, quicumque recte facere possunt, bona opera exercere; utile est illis. dico autem, omnem hominem
    de incommodis eripi oportere. et is enim qui eget et in cotidiana vita patitur incommoda, in magno
    tormento est ac necessitate. 3. qui igitur huiusmodi animam eripit de necessitate, magnum gaudium
    sibi adquirit. is enim, qui huiusmodi vexatur incommodo, pari tormento cruciatur atque torquet se
    qui in vincla est. multi enim propter huiusmodi calamitates, cum eas suffere non possunt, mortem sibi
    adducunt. qui novit igitur calamitatem huiusmodi hominis et non eripit eum, magnum peccatum admittit
    et reus fit sanguinis eius. 4. facite igitur opera bona, quicumque accepistis a Domino, ne, dum tardatis
    facere, consummetur structura turris. propter vos enim intermissum est opus aedificationis eius. nisi
    festinetis igitur facere recte, consummabitur turris, et excludemini. 5. postquam vero locutus est
    mecum, surrexit de lecto, et adprehenso pastore et virginibus abiit, dicens autem mihi, remissurum
    se pastorem illum et virgines in domum meam.'
