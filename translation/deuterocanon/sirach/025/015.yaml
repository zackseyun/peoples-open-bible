id: SIR.25.15
reference: Sirach 25:15
source:
  edition: lxx-swete-1909
  text: οὐκ ἔστιν κεφαλὴ ὑπὲρ κεφαλὴν ὄφεως, καὶ οὐκ ἔστιν θυμὸς ὑπὲρ θυμὸν ἐχθροῦ.
