id: ECC.8.8
reference: Ecclesiastes 8:8
source:
  edition: WLC
  text: אֵ֣ין אָדָ֞ם שַׁלִּ֤יט בָּ/ר֨וּחַ֙ לִ/כְל֣וֹא אֶת הָ/ר֔וּחַ וְ/אֵ֤ין שִׁלְטוֹן֙ בְּ/י֣וֹם הַ/מָּ֔וֶת וְ/אֵ֥ין מִשְׁלַ֖חַת בַּ/מִּלְחָמָ֑ה וְ/לֹֽא יְמַלֵּ֥ט רֶ֖שַׁע אֶת בְּעָלָֽי/ו־־־׃
translation:
  text: No man has power over the wind to restrain it[a], and there is no power over the day of death. There is no discharge in wartime, and wickedness will not deliver those who practice it[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “No man can keep his breath of life from departing.” Hebrew ruach can mean wind, breath, or spirit.
    reason: alternative_reading
  - marker: b
    text: Literally, “its owners.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  chosen: man
  alternatives:
  - humankind
  - person
  lexicon: HALOT
  rationale: Rendered 'man' because the Hebrew singular generic refers representatively to a human being in general, and the doctrine calls for gender-accurate rendering where the source uses masculine generic force.
- source_word: שַׁלִּיט
  chosen: has power
  alternatives:
  - is master of
  - has authority over
  lexicon: HALOT
  rationale: The adjective denotes having dominion or power. 'Has power' is idiomatic in English and fits the existential construction 'there is no man who...' without sounding wooden.
- source_word: רוּחַ
  chosen: wind
  alternatives:
  - spirit
  - breath
  lexicon: HALOT
  rationale: In this context the paired phrase 'over the wind to restrain the wind' and the surrounding statements about death and war favor the concrete sense 'wind' as an image of what humans cannot control. The alternative 'spirit' is possible and worth preserving in a footnote because the Hebrew term can bear both senses.
- source_word: לִכְלוֹא
  chosen: to restrain
  alternatives:
  - to hold back
  - to imprison
  - to shut in
  lexicon: HALOT
  rationale: The verb means to confine or hold back. 'Restrain' communicates the sense naturally with 'wind' in English.
- source_word: שִׁלְטוֹן
  chosen: authority
  alternatives:
  - power
  - dominion
  lexicon: HALOT
  rationale: This noun is cognate with שַׁלִּיט and denotes ruling power or authority. 'Authority' avoids repetition with the earlier 'power' while preserving the semantic field.
- source_word: בְּיוֹם הַמָּוֶת
  chosen: over the day of death
  alternatives:
  - on the day of death
  - against the day of death
  lexicon: HALOT
  rationale: The preposition with 'authority' is best represented as 'over.' The phrase refers to the time of one's death as something beyond human control.
- source_word: מִשְׁלַחַת
  chosen: discharge
  alternatives:
  - release
  - exemption
  lexicon: HALOT
  rationale: In military context the noun refers to being sent away or released from service. 'Discharge' is concise and idiomatic in English for military release.
- source_word: בַּמִּלְחָמָה
  chosen: in war
  alternatives:
  - in battle
  - during war
  lexicon: HALOT
  rationale: A straightforward rendering of the prepositional phrase; 'in war' is broad enough to match the Hebrew.
- source_word: רֶשַׁע
  chosen: wickedness
  alternatives:
  - evil
  - wrongdoing
  lexicon: HALOT
  rationale: 'The abstract noun is best kept abstract here: wickedness itself cannot rescue. This preserves the proverbial force better than personalizing it as ''the wicked.'''
- source_word: יְמַלֵּט
  chosen: will not deliver
  alternatives:
  - will not save
  - will not rescue
  lexicon: HALOT
  rationale: The verb means to bring to safety or rescue. 'Deliver' fits wisdom-style English and avoids overloading 'save' with theological associations not explicit here.
- source_word: בְּעָלָיו
  chosen: its owners
  alternatives:
  - its owner
  - those who practice it
  lexicon: HALOT
  rationale: The plural form is retained in English and the personified ownership image remains intact.
- source_word: לִכְלוֹא אֶת הָרוּחַ
  chosen: to restrain it
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: English naturally uses a pronoun for the immediately repeated noun.
- source_word: שִׁלְטוֹן בְּיוֹם הַמָּוֶת
  chosen: power over the day of death
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This clearly expresses unavailable control over death's day.
- source_word: מִשְׁלַחַת בַּמִּלְחָמָה
  chosen: release from war
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: It communicates exemption or release in the military context.
