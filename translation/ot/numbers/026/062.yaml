  category: meaning_retranslation
  from: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
  to: The Levites counted totaled twenty-three thousand, including every male one month old or older. Their census was separate from that of the other Israelites, because they were given no inheritance among them.
  rationale: The lexical record correctly preserves the male age threshold and the connection between separate enrollment and lack of inheritance. Its source-shaped national designation risks obscuring that the Levites themselves belong to Israel, so I clarified the relationship in the main text.
