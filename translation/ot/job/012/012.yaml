id: JOB.12.12
reference: Job 12:12
source:
  edition: WLC
  text: בִּֽ/ישִׁישִׁ֥ים חָכְמָ֑ה וְ/אֹ֖רֶךְ יָמִ֣ים תְּבוּנָֽה׃
translation:
  text: Wisdom is with the aged, and understanding with long life[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, as a question, “Is wisdom with the aged, and understanding with long life?”
    reason: alternative_reading
lexical_decisions:
- source_word: בִּישִׁישִׁים
  chosen: with the aged
  alternatives:
  - Among the aged
  - In old men
  - With old age
  lexicon: HALOT
  rationale: Preserves the association expressed by בְּ without unnecessarily specifying male referents.
- source_word: חָכְמָה
  chosen: wisdom
  lexicon: HALOT
  rationale: Standard rendering for חָכְמָה in wisdom literature; it fits the proverbial claim about insight associated with age.
- source_word: וְאֹרֶךְ יָמִים
  chosen: with long life
  alternatives:
  - and with long life
  - and with many days
  lexicon: HALOT
  rationale: '"Long life" is a natural English equivalent for the idiomatic "length of days."'
- source_word: תְּבוּנָה
  chosen: understanding
  alternatives:
  - discernment
  - insight
  lexicon: HALOT
  rationale: תְּבוּנָה commonly denotes understanding or discernment. 'Understanding' pairs naturally with 'wisdom' and preserves the semantic distinction without sounding technical.
