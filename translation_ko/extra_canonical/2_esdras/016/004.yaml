  source_fidelity: 라틴어 ‘uobis ignis’는 ‘너희에게/여러분에게 불이’, ‘et quis est qui extinguat illum?’은 ‘누가 그것을 끄겠습니까?’라는 수사적 질문입니다. 초안은 전반 의미를 잘 전달하지만, ‘보내졌는데’는 접속사 et의 단순 병렬보다 인과·전환의 뉘앙스를 더할 수 있고, ‘끌 자’는 현대 표준어에서 ‘끊다’와 혼동될 여지가 있어 수정이 안전합니다.
  naturalness: ‘불이 여러분에게 보내졌습니다. 그런데 누가 그것을 끄겠습니까?’는 현대 한국어 합쇼체로 자연스럽고, 경고의 수사적 힘도 유지합니다.
