translation:
  text: In those days I saw people in Judah treading grapes in winepresses on the Sabbath, bringing in heaps of grain, and loading donkeys with them, as well as with wine, grapes, figs, and all kinds of goods. They brought these loads into Jerusalem on the Sabbath day, so I warned them on the day they sold food.
