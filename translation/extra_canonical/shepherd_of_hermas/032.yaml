translation:
  text: 'I.1. “Be long-suffering[e] and sensible,” he says, “and you will gain mastery over every wicked
    deed and do every work of righteousness.”


    I.2. “For if you are long-suffering, the holy spirit dwelling in you will be pure, not clouded by
    another evil spirit. Instead, dwelling in a wide space, it will exult and rejoice with the vessel
    in which it dwells, and will minister to God with much cheerfulness, having vitality within itself.”


    I.3. “But if a quick temper comes on, at once the holy spirit, being tender, is cramped, without a
    clean place, and seeks to withdraw from that place. For it is choked by the evil spirit, without room
    to minister to the Lord as it desires, being defiled by quick temper. For the Lord dwells in long-suffering,
    but the devil in quick temper.”


    I.4. “So when both spirits dwell together, it is unprofitable and harmful to the person in whom they
    dwell.”


    I.5. “For if you take a little wormwood and pour it into a jar of honey, is not all the honey spoiled?
    So much honey is ruined by the smallest amount of wormwood, which destroys the honey’s sweetness.
    It no longer has the same favor with its master, because it has become bitter and lost its usefulness.
    But if the wormwood is not put into the honey, the honey is found sweet and becomes useful to its
    master.”[e]


    I.6. “You see, then, that long-suffering is sweeter than honey and useful to the Lord, and he dwells
    in it. But quick temper is bitter and useless. So if quick temper is mixed with long-suffering, long-suffering
    is defiled, and that person’s prayer is not useful to God.”[a]


    I.7. “Sir,” I say, “I wanted to know how quick temper works, so that I may guard against it.” “Indeed,”
    he says, “if you and your household do not guard against it, you have lost all your hope. But guard
    against it, for I am with you. Everyone who repents with their whole heart will also keep away from
    it, for I will be with them and will protect them; for they have all been justified by the most revered
    angel.”[b][c]


    II.1. “Now hear,” he says, “how quick temper works, how evil it is, how it overthrows God’s servants
    by its own activity, and how it leads them astray from righteousness. But it does not lead astray
    those who are full in faith, nor can it act upon them, because the Lord’s power is with them. It leads
    astray those who are empty and double-minded.”[d]


    II.2. “For when it sees such people standing firm, it inserts itself into a person’s heart. Out of
    nothing, the man or woman becomes bitter over everyday matters: food, some petty matter, a friend,
    giving or receiving, or foolish matters like these. For all these things are foolish, empty, senseless
    and unprofitable for God’s servants.”[f]


    II.3. “But long-suffering is great and strong, possessing mighty and vigorous power, flourishing in
    a wide space, cheerfully rejoicing, free from care, glorifying the Lord at all times. It has nothing
    bitter within itself, but always remains gentle and quiet. This long-suffering dwells with those whose
    faith is complete.”


    II.4. “But quick temper is first foolish, flighty and senseless. Then from senselessness comes bitterness,
    from bitterness anger, from anger wrath, and from wrath rage. Then rage, composed of so many evils,
    becomes a great and incurable sin.”


    II.5. “For when all these spirits dwell in one vessel, where the holy spirit also dwells, that vessel
    cannot contain them, but overflows.”


    II.6. “So the tender spirit, unaccustomed to dwelling with an evil spirit or with hardness, withdraws
    from such a person and seeks to dwell with gentleness and quiet.”


    II.7. “Then, when it departs from the person in whom it dwells, that person becomes empty of the righteous
    spirit. Afterward, filled with evil spirits, they are unstable in every deed, dragged here and there
    by the evil spirits, and are altogether blinded in their good understanding. This is what happens
    to all who are quick-tempered.”[g]


    II.8. “So keep away from quick temper, that most wicked spirit. Clothe yourself with long-suffering,
    and stand against quick temper and bitterness, and you will be found with the dignity beloved by the
    Lord. See, then, that you never forget this command. For if you master this command, you will also
    be able to keep the other commands I am going to give you. Be strong in them and be empowered, and
    let everyone who wishes to walk in them be empowered.”[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: 'The old source and English stopped before the prayer clause. The working printed Greek at i.6
      reads hē enteuxis autou, “his petition/prayer”; “that person’s prayer” makes the personal referent
      explicit. Lake1907 Plate VI line1 instead has autēs, “her/its petition,” referring grammatically
      to long-suffering. Alternative: “and its petition is not useful to God.” Vulgata, Hilgenfeld1873
      printed44–45, has oratio illius deo. The prayer clause is restored without replacing the normalized
      source with the Athos pronoun.'
  - marker: b
    reason: textual_variant
    text: The i.7 warning retains the working edition’s conditional guard-against wording and its whole-heart
      repentance promise. The 1891 apparatus identifies Gebhardt’s verb correction against its reported
      Athos form; Lake’s later diplomatic transcription, Plate VI line2, has the guard form too. Vulgata
      printed45 and Palatina printed89 likewise retain the warning to the person and household. Repentance
      denotes the moral change described here, including abandoning quick temper; no additional uniform
      Godward formula is inserted.
  - marker: c
    reason: lexical_alternative
    text: “Have been justified” retains edikaiōthēsan, with “have been made righteous” as an alternative.
      The most revered angel is not silently identified as God. Vulgata printed45 has iustificati and
      the most holy messenger; Palatina printed89 paraphrases acceptance among the approved. These versional
      renderings are not identical Greek readings or additional Greek manuscripts.
  - marker: d
    reason: textual_variant
    text: 'Working ii.1 has “the Lord’s power”; Lake1907 Plate VI line6 reads “my power.” Alternative:
      “because my power is with them.” Vulgata, Hilgenfeld printed45, has the power of God; Palatina,
      Gebhardt/Harnack printed89, has the power of the Lord. Retain the working wording provisionally
      and expose Athos’s substantive possessive alternative. Sinaiticus ends in Mandate4iii and supplies
      no vote here. The printed “now” at this opening is an editorial insertion reported absent from A
      in the 1891 apparatus; Lake’s transcription also lacks it.'
  - marker: e
    reason: cultural_note
    text: Long-suffering is patient endurance, not merely waiting; the simplified edition uses patience.
      Wormwood is the bitter ingredient in the teaching comparison. The honey’s master is its owner. A
      wide space and vessel retain the passage’s images; vitality retains the earlier English choice for
      euthēnia without claiming a new lexicon consultation.
  - marker: f
    reason: textual_variant
    text: The working edition prints man or woman in ii.2; its apparatus reports Athos woman or man. Lake1907
      Plate VI line8 has that reverse order. Vulgata printed45 and Palatina printed89 have man/husband
      or woman/wife. Both sexes and the entire list of everyday provocations are retained; no social rule
      is inferred from their order.
  - marker: g
    reason: textual_variant
    text: The working Greek at ii.7 calls this the righteous spirit. The printed Vulgata at46 calls it
      the holy spirit. The draft keeps the Greek description and the sequence of departure, emptiness,
      filling with evil spirits and impaired understanding, without making the Latin wording a replacement
      Greek reading.
  - marker: h
    reason: lexical_alternative
    text: Dignity renders semnotēs; reverence or gravity are alternatives. “Never forget” retains the
      earlier English for the warning against overlooking or neglecting the command. The strengthening
      exhortation includes everyone who wishes to walk in the commands. The complete second historical
      section remains in legacy reader032; reader033 remains Mandate6i.
lexical_decisions:
- source_word: μακροθυμία / ὀξυχολία
  chosen: long-suffering / quick temper
  alternatives:
  - patient endurance / irascibility
  rationale: Preserve the ethical contrast; simplify long-suffering as patience.
- source_word: εὐθηνία
  chosen: vitality
  alternatives:
  - abundance
  - well-being
  rationale: Retain the earlier recorded English choice while restoring the omitted context.
- source_word: ἡ ἔντευξις αὐτοῦ / αὐτῆς
  chosen: that person’s prayer
  alternatives:
  - his petition
  - its petition (Athos feminine)
  rationale: Retain working masculine source with explicit Athos alternative and Latin comparison in note
    a.
- source_word: μετανοήσωσιν ἐξ ὅλης τῆς καρδίας αὐτῶν
  chosen: repents with their whole heart
  alternatives:
  - wholeheartedly changes conduct
  rationale: Preserve repentance and the behavioral context without adding a formula absent from Greek.
- source_word: ἐδικαιώθησαν
  chosen: have been justified
  alternatives:
  - have been made righteous
  rationale: Retain difficult declaration and the stated agent; do not replace it with a different doctrine.
- source_word: ἡ δύναμις τοῦ Κυρίου / μου
  chosen: the Lord’s power (working reading)
  alternatives:
  - my power (Athos)
  rationale: Both printed Latin traditions support a divine-power referent, but Athos possessive is explicitly
    exposed.
- source_word: πνεύματος τοῦ δικαίου
  chosen: righteous spirit
  alternatives:
  - spirit of righteousness
  - holy spirit (Vulgata)
  rationale: Keep working Greek description and distinguish Latin rendering.
