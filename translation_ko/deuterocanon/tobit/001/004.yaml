base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/004.yaml
  text: And when I was in my own country[a], in the land of Israel, while I was still young, the whole tribe of my father Naphtali fell away from the house of Jerusalem, which had been chosen from all the tribes of Israel for all the tribes to sacrifice there; and the temple, the dwelling place of the Most High[c][b], was consecrated and built for all generations.
  footnotes:
  - marker: a
    text: The Greek text here distinguishes 'the house of Jerusalem' from 'the temple'; the first likely refers broadly to the Jerusalem sanctuary, while the second names the temple more specifically.
    reason: lexical_alternative
  - marker: b
    text: The final Greek words are textually difficult, ending with 'for all' (εἰς πάσας). The translation supplies 'for all generations' to make coherent sense of the clause; compare the longer Tobit tradition, which supports an enduring, generational reference.
    reason: textual_variant
  - marker: c
    text: Qumran Tobit fragments are known to align more often with the longer Greek tradition in this book, though this verse here is translated from Swete's Greek witness.
    reason: cross_reference
translation:
  language: ko
  text: 제가 아직 젊었을 때, 제 고향, 곧 이스라엘 땅에 있었을 때, 제 아버지 나프탈리의 온 지파는 예루살렘의 집[b]에서 떠났습니다. 그곳은 이스라엘의 모든 지파 가운데서 택함을 받아, 모든 지파가 그곳에서 제사를 드리도록 한 곳입니다. 또 지극히 높으신 분의 거처인 성전은 거룩하게 구별되었고 모든 세대를 위하여 세워졌습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘예루살렘의 집’(οἶκος Ἱεροσολύμων)은 뒤에 나오는 ‘성전’(ναός)과 구별되어 표현됩니다. 문맥상 예루살렘 성소를 넓게 가리키는 말로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어 본문은 ‘모든’(εἰς πάσας)에서 불완전하게 끝납니다. 본문은 문맥과 더 긴 토빗 전승에 비추어 ‘모든 세대’를 보충하여 번역했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν τῇ χώρᾳ μου ἐν τῇ γῇ Ἰσραήλ
  english_pob_choice: in my country, in the land of Israel
  chosen_korean: 내 고향, 곧 이스라엘 땅에서
  alternatives_korean:
  - 내 나라, 이스라엘 땅에서
  - 내 지역, 이스라엘 땅에서
  lexicon: χώρᾳ / γῇ
  rationale: χώρᾳ는 단순한 지리적 ‘지역’보다 자기 소속의 고향·거주지 뉘앙스가 있어 ‘내 고향’으로 살리고, 이어지는 γῇ Ἰσραήλ은 ‘이스라엘 땅’으로 분명히 했습니다.
- source_word: ἀπέστη ἀπὸ τοῦ οἴκου Ἱεροσολύμων
  english_pob_choice: departed from the house of Jerusalem
  chosen_korean: 예루살렘의 집에서 떠났습니다
  alternatives_korean:
  - 예루살렘의 집을 떠났습니다
  - 예루살렘 성전에서 떠났습니다
  lexicon: οἶκος Ἱεροσολύμων
  rationale: 직역하면 ‘예루살렘의 집’이지만, 문맥상 예루살렘 성소/성전 공동체를 가리키므로 본문을 지나치게 해석하지 않으면서도 자연스럽게 옮겼습니다.
- source_word: τῆς ἐκλεγείσης ἀπὸ πασῶν τῶν φυλῶν Ἰσραήλ εἰς τὸ θυσιάζειν πάσαις ταῖς φυλαῖς
  english_pob_choice: chosen from all the tribes of Israel for sacrificing by all the tribes
  chosen_korean: 이스라엘의 모든 지파 가운데서 택하신 곳으로, 모든 지파가 제사를 드리게 하려고 정해진 곳
  alternatives_korean:
  - 이스라엘의 모든 지파 가운데서 택하신 곳으로, 모든 지파를 위하여 제사를 드리게 한 곳
  - 이스라엘 모든 지파 중에서 택하셔서 모든 지파가 제사드리도록 하신 곳
  lexicon: ἐκλεγείσης / θυσιάζειν
  rationale: ‘택하신 곳’은 선택된 장소를 살리고, θυσιάζειν은 제의적 ‘희생하다’보다 문맥상 ‘제사를 드리다’가 더 정확하여 그 기능을 분명히 했습니다.
- source_word: ὁ ναὸς τῆς κατασκηνώσεως τοῦ ὑψίστου
  english_pob_choice: the temple of the dwelling place of the Most High
  chosen_korean: 지극히 높으신 이의 장막의 성전
  alternatives_korean:
  - 지극히 높으신 이의 거처의 성전
  - 지극히 높으신 분의 장막 곧 성전
  lexicon: ναὸς / κατασκηνώσεως / τοῦ ὑψίστου
  rationale: ναός는 ‘성전’, κατασκήνωσις는 하나님의 임재처를 가리키는 ‘장막/거처’의 이미지를 함께 살려 ‘장막의 성전’으로 옮겼고, ὕψιστος는 ‘지극히 높으신 이’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 예루살렘의 선택과 제사 장소의 독점성
  chosen_reading: 예루살렘은 이스라엘의 모든 지파 가운데서 택하신 곳이며, 모든 지파가 제사를 드리게 하려고 정해진 곳으로 표현했습니다.
  alternative_readings:
  - 예루살렘은 제사를 드리는 단일 성소로 옮길 수 있음
  - 문맥상 성전 제의 중심성을 약화시켜 일반적 예배 장소로 번역할 수 있음
  rationale: 본문은 예루살렘의 선택성과 제사 중심성을 강하게 말하므로, 이를 완화하지 않고 그대로 드러내는 쪽이 원문의 의도를 더 잘 반영합니다.
  doctrine_reference: 신명기적 성소 선택 전통 및 제의 중심성
- issue: 문장 끝의 불완전한 그리스어 전승
  chosen_reading: 끝의 εἰς πάσας는 한국어 본문에서는 생략 없이 ‘모든 세대를 위하여’로 마무리하고, 말줄임표로 전승의 끊김을 표시했습니다.
  alternative_readings:
  - 본문을 미완으로 남기지 않고 임의로 보충함
  - 문장 전체를 끊어 번역하지 않음
  rationale: 전승이 현저히 불완전하므로 의미가 확실한 범위까지만 옮기고, 독자가 결손을 알 수 있도록 표지를 두는 것이 가장 정직합니다.
  doctrine_reference: 사본 전승의 투명성
