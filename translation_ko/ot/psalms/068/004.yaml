id: PSA.68.4
reference: Psalms 68:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁ֤ירוּ לֵֽ/אלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥/וֹ סֹ֡לּוּ לָ/רֹכֵ֣ב בָּ֭/עֲרָבוֹת בְּ/יָ֥הּ שְׁמ֗/וֹ וְ/עִלְז֥וּ לְ/פָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/004.yaml
  text: Sing to God; sing praise to his name. Prepare the way for the one who rides through the deserts[a]; Yah is his name. Exult before him.
  footnotes:
  - marker: a
    text: Or “across the steppes”; some interpret the Hebrew as “upon the clouds.”
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께 노래하십시오. 그분의 이름을 찬양하여 노래하십시오. 광야 평원들을 타고 가시는 분을 위하여 길을 닦으십시오.[a] 그분의 이름은 야입니다. 그분 앞에서 크게 기뻐하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 본래 길을 돋우거나 닦는다는 뜻입니다. 문맥상 ‘높이 찬양하십시오’로 이해하는 번역도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘광야 평원들’로 옮긴 히브리어 낱말은 ‘구름들’로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַדִּיקִים
  english_pob_choice: But the righteous
  chosen_korean: 그러나 의인들은
  alternatives_korean:
  - 그리고 의인들은
  - 의로운 사람들은
  lexicon: HALOT
  rationale: צַדִּיקִים은 의로운 사람들로 이해하는 것이 자연스럽고, 문맥상 앞 절과의 대조를 살려 ו를 '그러나'로 옮겼습니다.
- source_word: יִשְׂמְחוּ
  english_pob_choice: will be glad
  chosen_korean: 기뻐할 것입니다
  alternatives_korean:
  - 즐거워할 것입니다
  - 환호할 것입니다
  lexicon: HALOT
  rationale: שׂמח의 기본 의미인 기쁨/즐거움을 평이한 현대 한국어로 옮겼습니다.
- source_word: יַעַלְצוּ
  english_pob_choice: will exult
  chosen_korean: 크게 기뻐하며
  alternatives_korean:
  - 환희에 차며
  - 열렬히 기뻐하며
  lexicon: HALOT
  rationale: עלץ의 고양된 기쁨을 단순한 '기뻐하다'보다 강한 '크게 기뻐하다'로 살려, 앞의 동사와 구별했습니다.
- source_word: לִפְנֵי אֱלֹהִים
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님의 면전에서
  - 하나님 앞에
  lexicon: HALOT
  rationale: 직역하면 '하나님 앞에/면전에'이므로, 하나님의 임재 앞이라는 뜻을 살려 '하나님 앞에서'로 자연스럽게 옮겼습니다.
- source_word: וְיָשִׂישׂוּ בְשִׂמְחָה
  english_pob_choice: and they will rejoice with gladness
  chosen_korean: 즐거움으로 즐거워할 것입니다
  alternatives_korean:
  - 기쁨으로 기뻐할 것입니다
  - 즐거움 가운데 기뻐할 것입니다
  lexicon: HALOT
  rationale: שׂוש와 שׂמחה가 겹쳐 쓰인 점을 살려, 같은 어근의 반복을 한국어에서도 '즐거움으로 즐거워하다'로 반영했습니다.
theological_decisions:
- issue: 앞 절과의 접속 ו의 의미
  chosen_reading: 문맥상 대조를 드러내는 '그러나'로 번역했습니다.
  alternative_readings:
  - 단순 연결의 '그리고'
  - 역접을 약화한 '또'
  rationale: 영어 POB도 앞 절의 악인과의 대비를 반영해 'But'를 택했으므로, 시편의 문맥적 대비를 한국어에서도 분명히 드러내는 것이 적절합니다.
  doctrine_reference: 시편 68편의 악인/의인 대비 구조
- issue: 기쁨 관련 동사들의 반복
  chosen_reading: 서로 다른 히브리어 기쁨 어휘를 중첩 표현으로 살렸습니다.
  alternative_readings:
  - 모두 '기뻐하다'로 평준화
  - 하나만 강하게 번역하고 나머지는 완화
  rationale: יִשְׂמְחוּ, יַעַלְצוּ, יָשִׂישׂוּ, שִׂמְחָה는 감정의 강도와 반복을 형성하므로, 한국어에서도 중복을 일부 감수해 시적 강조를 보존했습니다.
  doctrine_reference: 히브리 시편의 평행법과 강조법
