lexical_decisions:
- source_word: καὶ γὰρ
  chosen: For even
  alternatives:
  - and indeed
  - for also
  lexicon: LSJ
  rationale: The combination is connective and explanatory/emphatic. 'For even' preserves both the causal/explanatory force of γάρ and the added emphasis of καί in natural English.
- source_word: τοὺς παλαιοὺς
  chosen: the ancient
  alternatives:
  - the former
  - the people of old
  lexicon: LSJ
  rationale: παλαιός here describes those long-standing earlier inhabitants. 'Ancient' best fits the historical sense without overparaphrasing.
- source_word: οἰκήτορας
  chosen: inhabitants
  alternatives:
  - dwellers
  - settlers
  lexicon: LSJ
  rationale: The noun denotes those who live in a place. 'Inhabitants' is idiomatic and suitably formal; 'settlers' could imply a nuance not explicit in the Greek.
- source_word: τῆς ἁγίας σου γῆς
  chosen: of your holy land
  alternatives:
  - of your holy earth
  - of your sacred land
  lexicon: LSJ
  rationale: γῆ can mean 'earth' or 'land'; in this context of a specific territory, 'land' is the natural rendering. 'Holy' straightforwardly renders ἁγίας, and 'your' preserves the direct address to God.
