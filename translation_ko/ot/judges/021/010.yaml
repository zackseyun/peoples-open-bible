revisions:
- from: 그러므로 회중은 그곳에 용맹한 자손 가운데서 만 이천 명을 보내고, 그들에게 명령하여 말했습니다. 「가서 야베스-길르앗 주민들을 칼날로 치되, 여자들과 어린아이들까지 포함하라.」[a]
  to: 그러므로 회중은 그곳으로 용맹한 자들 가운데서 만 이천 명을 보내고, 그들에게 명령하여 말했습니다. 「가서 야베스-길르앗 주민들과 여자들과 어린아이들을 칼날로 치라.」
  rationale: ‘용맹한 자들’로 집단 구성원을 자연스럽게 옮기고, 여자들과 어린아이들을 ‘치라’의 병렬 목적어로 재구성하여 히브리어의 문법 관계와 폭력 명령의 범위를 모두 명확히 보존했습니다. 불필요한 대안 번역 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:26Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 ‘여자들과 어린아이들’은 별도의 ‘포함하라’ 명령이 아니라 ‘칼날로 치라’의 병렬 목적어입니다. 또한 מִבְּנֵי הֶחָיִל의 בְּנֵי는 여기서 혈통상 ‘자손’보다 집단 구성원을 가리키므로 ‘용맹한 자들’이 적절합니다.
  naturalness: ‘용맹한 자손 가운데서’는 현대 한국어에서 부자연스럽고 뜻이 혈통으로 오해될 수 있습니다. 명령문의 목적어들을 함께 배치하면 문장도 더 자연스럽고 원문의 통사도 보존됩니다.
  terminology: ‘회중’, ‘야베스-길르앗’, ‘칼날로’는 본문 문맥과 격식 있는 성경 문체에 적절합니다. עֵדָה에 관한 선택적 각주는 번역상 실질적 변이를 제공하지 않아 삭제하는 것이 낫습니다.
  issues:
  - severity: medium
    issue: מִבְּנֵי הֶחָיִל을 ‘용맹한 자손 가운데서’로 번역함
    rationale: בְּנֵי는 이 표현에서 집단의 구성원을 뜻하며, ‘자손’은 혈통적 의미를 부당하게 강하게 만듭니다.
  - severity: medium
    issue: ‘여자들과 어린아이들까지 포함하라’가 별도 명령처럼 처리됨
    rationale: וְהַנָּשִׁים וְהַטַּף은 ‘주민들을 칼날로 치라’에 이어지는 병렬 목적어입니다. 한국어에서도 그들을 ‘치라’의 목적어로 두어야 원문의 명령 구조를 보존합니다.
  - severity: low
    issue: עֵדָה의 대안 번역 각주
    rationale: ‘회중’과 ‘집회’는 이 문맥에서 번역 선택의 차이일 뿐 본문상 중요한 대안 독법이 아니며, 각주 앵커도 불필요합니다.
