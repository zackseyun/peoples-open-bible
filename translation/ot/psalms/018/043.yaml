  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: awkward_english
  tier: 1
  from: You rescue me from the strivings of the people[a]; you set me as the head of nations[b][c]; a people whom I have not known serve me.
  to: You rescue me from the disputes of the people[a]; you set me at the head of nations[b]; a people I have not known serve me[c].
  rationale: “Strivings” is genuinely unnatural here, and “set me at the head” is the ordinary English form while retaining the Hebrew image. The proposal’s singular “serves” is possible with collective “people,” but the Hebrew verb is plural and the existing collective plural sense should be retained in English. “Have not known” appropriately represents prior non-acquaintance without needlessly recasting the relation as a completed past event.
