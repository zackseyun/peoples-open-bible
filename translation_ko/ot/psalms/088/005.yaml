  yaml_path: translation/ot/psalms/088/005.yaml
  text: I am free among the dead[a], like the slain who lie in the grave, whom you remember no more[b], and they are cut off from your hand[c].
  footnotes:
  - marker: a
    text: 'The Hebrew adjective means “free” or “released,” likely used ironically: the speaker is as good as dead, removed from the sphere of the living.'
    reason: lexical_alternative
  - marker: b
    text: “Remember” here likely means more than mental recollection; it carries the sense of attending to or acting for someone.
    reason: lexical_alternative
  - marker: c
    text: Or “severed from your hand.” “Hand” is a Hebrew image for power, control, or care.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 죽은 자들 가운데서 자유로운 자 같고[a], 무덤에 누워 있는 죽임당한 자들과 같습니다. 그들은 주께서 더 이상 기억하지 않으시는 자들이며[b], 주의 손에서 끊어졌습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽은 자들 가운데서 풀려난 자’. 히브리어는 ‘자유로운, 풀려난’이라는 말을 사용합니다. 여기서는 죽은 자가 산 자들의 영역과 그 의무에서 벗어난 것처럼 보인다는 역설적인 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기억하다’는 단순히 마음속으로 떠올리는 것 이상으로, 누군가에게 관심을 두고 돌보거나 그를 위해 행동한다는 뜻을 내포할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘주의 손으로부터 잘려 나갔습니다’. ‘손’은 히브리어에서 능력, 다스림, 또는 돌봄을 나타낼 수 있는 비유입니다.
    reason: lexical_alternative
