review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 반영했으나, ‘신령한 능력’은 ‘신적인 영의 능력’이라는 원문의 표현을 충분히 드러내지 못하고, 대괄호 안의 이문을 본문에 무표지로 포함하여 본문 비평상의 불확실성이 사라졌습니다. μάγον은 여기서 오락적 ‘마술사’보다 점을 치고 미래를 묻는 ‘점술가’의 뜻이 자연스럽습니다.
  naturalness: 원문의 현재형 진행과 논리 관계를 현대 표준 한국어 합쇼체로 다듬을 필요가 있습니다. 특히 ‘무슨 일이 일어나겠느냐 물으니’는 주어와 인용 내용의 연결이 다소 부자연스럽습니다.
  terminology: ψευδοπροφήτης는 문맥과 현대 교회 한국어 관용을 고려하여 ‘거짓 예언자’로, πνεύματος θείου는 ‘신적인 영’으로 옮겼습니다. δίψυχοι는 해석을 과도하게 좁히지 않도록 ‘두 마음을 품은 사람들’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘마술사’
    rationale: μάγος는 이 문맥에서 미래를 묻는 점복 행위의 대상이므로, 현대 한국어에서 공연자를 주로 연상시키는 ‘마술사’보다 ‘점술가’가 문맥상 정확합니다.
  - severity: medium
    issue: ‘신령한 능력’
    rationale: δύναμιν πνεύματος θείου는 단순한 신비적 능력이 아니라 ‘신적인 영의 능력’을 가리킵니다.
  - severity: medium
    issue: 대괄호 이문의 무표지 처리
    rationale: ‘[그리고 그들의 사악함의 욕망에 따라]’는 제시된 그리스어 본문에서 대괄호로 표시된 이문이므로, 번역에서도 각주로 표시하여 본문 확정 여부의 불확실성을 보존해야 합니다.
  revised_text: 2. 그러므로 이 두 마음을 품은 사람들은 점술가에게 가듯 그에게 와서, 앞으로 자기들에게 무슨 일이 일어날지를 묻습니다. 그러면 그 거짓 예언자는 자기 안에 신적인 영의 능력이 전혀 없으면서도 그들의 물음에 맞추어 그들과 말하고〔a〕, 그들 자신이 원하는 대로 그들의 영혼을 채웁니다.
  revised_footnotes:
  - marker: a
    text: 일부 본문은 “그리고 그들의 사악한 욕망에 따라서도”를 덧붙입니다.
    reason: 그리스어 제시 본문의 대괄호 이문을 번역에서 투명하게 표시하여, 이 구절의 본문 비평상 불확실성을 보존합니다.
  revision_rationale: 점복 문맥에 맞게 μάγος를 ‘점술가’로 옮기고, ‘신적인 영의 능력’으로 원문의 구성과 의미를 보존했습니다. 문장을 현대 합쇼체로 정리했으며, 대괄호 이문은 본문에 단정적으로 포함하지 않고 각주로 처리했습니다.
