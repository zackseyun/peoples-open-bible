    text: Literally, “Tarshish ships”; this may describe ships equipped for long voyages or a fleet sailing to Tarshish.
    reason: alternative_reading
  - marker: b
    text: Or, “baboons”; the Hebrew animal name is uncertain.
    reason: alternative_reading
