simplification_decisions:
- pob_phrase: as we await
  simplified_phrase: as we eagerly wait
  preserved_meaning: The waiting continues and carries eager expectation.
  reasoning_layer_used: lexical decision for προσδεχόμενοι
  rationale: “Eagerly wait” makes the participle's expectant force clear in common English.
- pob_phrase: the blessed hope
  simplified_phrase: the blessed future we hope for
  preserved_meaning: Hope is the future reality Christians expect, not a mere wish.
  reasoning_layer_used: lexical decisions for μακαρίαν and ἐλπίδα
  rationale: The expanded wording prevents modern readers from mistaking hope for uncertainty.
- pob_phrase: the appearing of the glory
  simplified_phrase: the glory ... to appear
  preserved_meaning: God's glory will become visibly manifest.
  reasoning_layer_used: lexical decisions for ἐπιφάνειαν and δόξης
  rationale: The clause uses natural English while retaining glory as what appears.
interpretive_expansions:
- pob_phrase: hope
  rendering: future we hope for
  claim: The hope is an expected future reality rather than wishful thinking.
  evidence:
  - The POB lexical rationale identifies hope as the future object of Christian expectation.
  - The immediate phrase connects hope with the coming appearance of glory.
  confidence: high
  alternatives_preserved:
