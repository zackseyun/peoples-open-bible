id: PSA.18.43
reference: Psalms 18:43
source:
  edition: WLC
  text: תְּפַלְּטֵ/נִי֮ מֵ/רִ֪יבֵ֫י עָ֥ם תְּ֭שִׂימֵ/נִי לְ/רֹ֣אשׁ גּוֹיִ֑ם עַ֖ם לֹא יָדַ֣עְתִּי יַֽעַבְדֽוּ/נִי־׃
translation:
  text: You rescue me from the disputes of the people; you set me at the head of nations; a people previously unknown to me serve me.
  philosophy: dynamic
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  chosen: You rescue me
  alternatives:
  - You deliver me
  - You make me escape
  lexicon: HALOT
  rationale: From פלט in the Piel with 1cs suffix, expressing active deliverance/rescue by God. 'Rescue' is natural modern English and preserves the personal, saving action.
- source_word: מֵרִיבֵי עָם
  chosen: from the disputes of the people
  alternatives:
  - from the contentions of the people
  - from the quarrels of the people
  - from the disputes of the people
  lexicon: HALOT
  rationale: “Disputes” naturally renders the conflicts/contentions denoted by the plural construct.
- source_word: תְּשִׂימֵנִי
  chosen: you set me
  alternatives:
  - you place me
  - you appoint me
  lexicon: HALOT
  rationale: שׂים commonly means 'set/place.' 'Set me' is concise and idiomatic, while still allowing the exaltation nuance in context.
- source_word: לְרֹאשׁ גּוֹיִם
  chosen: at the head of nations
  alternatives:
  - as chief over nations
  - as leader of nations
  lexicon: HALOT
  rationale: This is idiomatic English and preserves the leadership metaphor of “head.”
- source_word: עַם
  chosen: a people
  alternatives:
  - people
  lexicon: HALOT
  rationale: 'The singular collective noun is indefinite here: ''a people I have not known.'' Including the article in English as ''a people'' reflects the indefinite sense more clearly.'
- source_word: לֹא יָדַעְתִּי
  chosen: I have not known
  alternatives:
  - I did not know
  - I have not been acquainted with
  lexicon: HALOT
  rationale: The perfect describes a people previously unknown to the speaker; the present-perfect wording preserves that relation naturally.
- source_word: יַעַבְדוּנִי
  chosen: serve me
  alternatives:
  - will serve me
  - are subject to me
  lexicon: HALOT
  rationale: The plural imperfect is suitably reflected by plural agreement in reference to the members of the collective “a people.”
