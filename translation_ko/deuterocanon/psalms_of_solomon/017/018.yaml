  text: Those who loved the assemblies of the holy ones fled from them; like sparrows they flew away from their nest.
translation:
  language: ko
  text: 거룩한 자들의 회중을 사랑하던 이들은 그들로부터 도망쳤습니다. 참새들처럼 그들은 자기 둥지에서 날아가 버렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγὰς ὁσίων
  english_pob_choice: assemblies of the holy ones
  chosen_korean: 거룩한 자들의 회중
  alternatives_korean:
  - 성도들의 모임
  - 거룩한 이들의 회중
  - 성인들의 집회
  lexicon: συναγωγή
  rationale: συναγωγαί는 단순한 추상적 ‘모임’보다 실제로 모인 공동체를 가리키므로 ‘회중’이 가장 직접적이며, ὁσίων은 도덕적/언약적 거룩함을 가진 ‘거룩한 자들’로 옮겼습니다.
- source_word: ἔφυγοσαν ἀπʼ αὐτῶν
  english_pob_choice: fled from them
  chosen_korean: 그들로부터 도망쳤습니다
  alternatives_korean:
  - 그들 앞에서 달아났습니다
  - 그들을 떠나 달아났습니다
  lexicon: φεύγω
  rationale: φεύγω의 핵심은 단순한 이동보다 ‘도망/도주’의 뉘앙스이므로, 문맥의 강한 이탈을 살려 ‘도망쳤습니다’로 옮겼습니다.
- source_word: ὡς στρουθία ἐξεπετάσθησαν ἀπὸ κοίτης αὐτῶν
  english_pob_choice: like sparrows they flew away from their nest
  chosen_korean: 참새들처럼 그들은 자기 둥지에서 날아가 버렸습니다
  alternatives_korean:
  - 참새들처럼 그들은 자기 보금자리에서 날아갔습니다
  - 참새들처럼 그들은 자기 쉼자리에서 날아갔습니다
  lexicon: στρουθία / κοίτη
  rationale: στρουθία는 보통 참새를 뜻하고, κοίτη는 ‘눕는 자리’에서 확장되어 새의 ‘둥지/보금자리’로 자연스럽게 읽히므로 POB의 ‘nest’를 반영해 ‘둥지’로 옮겼습니다.
theological_decisions:
- issue: ἅγιοι/ὅσιοι의 한국어 처리
  chosen_reading: ‘거룩한 자들’로 직역해 공동체의 경건성과 구별됨을 드러냈습니다.
  alternative_readings:
  - 성도들
  - 경건한 이들
  rationale: 본문은 교회 제도 용어보다 거룩함의 속성을 강조하므로, 전통 교회어인 ‘성도’보다 원문의 형용사적 힘을 살리는 표현이 더 적절합니다.
  doctrine_reference: 언약 공동체의 거룩함과 구별됨
