translation:
  language: en
  text: So that, just as sin ruled in death, grace also might rule through righteousness[a], leading to eternal life through Jesus Christ, our Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “through justice.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: sin reigned in death
  simplified_phrase: sin ruled in death
  preserved_meaning: Sin is personified as exercising royal power within the sphere of death.
  reasoning_layer_used: POB lexical decision for ἐβασίλευσεν and ἐν τῷ θανάτῳ
  rationale: “Ruled” makes the royal metaphor immediately clear while retaining “in death” as its sphere.
- pob_phrase: so also grace might reign
  simplified_phrase: grace also might rule
  preserved_meaning: Grace is personified as ruling in deliberate contrast with sin.
  reasoning_layer_used: POB lexical decision for ἡ χάρις and βασιλεύσῃ
  rationale: The simpler verb preserves both the personification and the purpose/result nuance.
- pob_phrase: Jesus the Messiah our Lord
  simplified_phrase: Jesus the Messiah, our Lord
  preserved_meaning: Messiah remains a title for Jesus, who is also identified as our Lord.
  reasoning_layer_used: POB theological decision for Χριστός and applied appositional revision
  rationale: The comma makes the two titles easier to distinguish in English.
interpretive_expansions:
- pob_phrase: to eternal life
  rendering: leading to eternal life
  claim: Eternal life is the direction and outcome of grace’s rule through righteousness.
  evidence:
  - The POB lexical decision says εἰς preserves directional force.
  - The clause links grace’s rule through righteousness with eternal life.
  confidence: high
  alternatives_preserved:
  - to eternal life
translation_notes:
  risk_flags:
  - risk: “Leading to” makes the directional relationship more explicit than the compact POB phrase.
    mitigation: It avoids making grace’s rule directly causative while preserving εἰς as movement toward an outcome.
