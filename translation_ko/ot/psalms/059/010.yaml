revisions:
- from: «나의 힘이신 분이여»[a], 제가 당신을 기다리겠습니다[b][c]. 하나님은 저의 높은 요새이십니다.
  to: 그의 한결같은 사랑의 하나님께서 나보다 앞서 가실 것입니다[a]. 하나님께서 내가 내 원수들을 보게 하실 것입니다.
  rationale: 원문과 불일치하는 초안을 제공된 WLC 본문에 맞게 전면 교정했습니다. 본문은 마소라 본문의 ‘그의 한결같은 사랑의 하나님’이라는 다소 어려운 구문을 유지하고, 널리 알려진 대안 독법은 각주에 보존했습니다. 하나님을 두 번 반복한 히브리어의 강조도 한국어 본문에서 유지했습니다.
  reviewer_model: gpt-5.6-terra
