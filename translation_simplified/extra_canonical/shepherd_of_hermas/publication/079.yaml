source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Εἰς μέσον δὲ τοῦ πεδίου ἔδειξέ μοι πέτραν μεγάλην λευκὴν ἐκ τοῦ πεδίου ἀναβεβηκυῖαν. ἡ δὲ πέτρα
    ὑψηλοτέρα ἦν τῶν ὀρέων, τετράγωνος, ὥστε δύνασθαι ὅλον τὸν κόσμον χωρῆσαι. 2. παλαιὰ δὲ ἦν ἡ πέτρα
    ἐκείνη, πύλην ἐκκεκομμένην ἔχουσα· ὡς πρόσφατος δὲ ἐδόκει μοι εἶναι ἡ ἐκκόλαψις τῆς πύλης· ἡ δὲ πύλη
    οὕτως ἔστιλβεν ὑπὲρ τὸν ἥλιον, ὥστε με θαυμάζειν ἐπὶ τῇ λαμπηδόνι τῆς πύλης. 3. κύκλῳ δὲ τῆς πύλης
    εἱστήκεισαν παρθένοι δώδεκα. αἱ οὖν τέσσαρες αἱ εἰς τὰς γωνίας ἑστηκυῖαι ἐνδοξότεραί μοι ἐδόκουν εἶναι·
    καὶ αἱ ἄλλαι δὲ ἔνδοξοι ἦσαν. εἱστήκεισαν δὲ εἰς τὰ τέσσαρα μέρη τῆς πύλης, ἀνὰ μέσον αὐτῶν ἀνὰ δύο
    παρθένοι. 4. ἐνδεδυμέναι δὲ ἦσαν λινοῦς χιτῶνας καὶ περιεζωσμέναι εὐπρεπῶς, ἔξω τοὺς ὤμους ἔχουσαι
    τοὺς δεξιοὺς ὡς μέλλουσαι φορτίον τι βαστάζειν. οὕτως ἕτοιμοι ἦσαν· λίαν γὰρ ἱλαραὶ ἦσαν καὶ πρόθυμοι.
    5. μετὰ τὸ ἰδεῖν με ταῦτα ἐθαύμαζον ἐν ἐμαυτῷ, ὅτι μεγάλα καὶ ἔνδοξα πράγματα βλέπω. καὶ πάλιν διηπόρουν
    ἐπὶ ταῖς παρθένοις, ὅτι τρυφεραὶ οὕτως οὖσαι ἀνδρείως εἱστήκεισαν ὡς μέλλουσαι ὅλον τὸν οὐρανὸν βαστάζειν.
    6. καὶ λέγει μοι ὁ ποιμήν· Τί ἐν σεαυτῷ διαλογίζῃ καὶ διαπορῇ, καὶ σεαυτῷ λύπην ἐπισπᾶσαι; ὅσα γὰρ
    οὐ δύνασαι νοῆσαι, μὴ ἐπιχείρει, συνετὸς ὤν, ἀλλ᾿ ἐρώτα τὸν Κύριον, ἵνα λάβῃς σύνεσιν νοεῖν αὐτά.
    7. τὰ ὀπίσω σου ἰδεῖν οὐ δύνῃ, τὰ δὲ ἔμπροσθέν σου βλέπεις. ἃ οὖν ἰδεῖν οὐ δύνασαι, ἔασον, καὶ μὴ
    στρέβλου σεαυτόν· ἃ δὲ βλέπεις, ἐκείνων κατακυρίευε, καὶ περὶ τῶν λοιπῶν μὴ περιεργάζου· πάντα δέ
    σοι ἐγὼ δηλώσω, ὅσα ἐάν σοι δείξω. ἔμβλεπε οὖν τοῖς λοιποῖς.
