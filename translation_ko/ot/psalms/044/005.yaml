base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/005.yaml
  text: Through you we push back[b] our foes; through your name[a] we trample those who rise against us.
  footnotes:
  - marker: a
    text: Or 'command deliverances for Jacob' or 'ordain salvations for Jacob.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님을 힘입어 우리는 대적들을 들이받고, 주님의 이름으로 우리에게 맞서는 자들을 짓밟습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들이받고’에 해당하는 히브리어는 본래 뿔로 들이받는 것을 뜻하며, 여기서는 대적을 세차게 물리치는 비유적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה הוּא
  english_pob_choice: You are
  chosen_korean: 주님은 ... 이십니다
  alternatives_korean:
  - 주님이십니다
  - 주님은 바로 ... 이십니다
  lexicon: HALOT
  rationale: 히브리어의 강조적 대명사 구조를 한국어에서는 자연스러운 서술문으로 살려, 대상의 확언을 분명하게 표현했습니다.
- source_word: מַלְכִּי
  english_pob_choice: my King
  chosen_korean: 저의 왕
  alternatives_korean:
  - 나의 왕
  - 저의 임금
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호칭이므로 존대형 소유 표현을 사용했고, מלך는 시편 문맥에서 왕을 뜻하는 기본어로 '왕'이 가장 직접적입니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님이시여
  - 오 하나님
  lexicon: HALOT
  rationale: 여기서는 나란히 놓인 호격으로 읽히므로 한국어에서도 직접 호칭을 유지했습니다. 합쇼체 기도문 어조를 살려 별도 감탄사 없이 '하나님'으로 처리했습니다.
- source_word: יְשׁוּעוֹת
  english_pob_choice: victories
  chosen_korean: 구원
  alternatives_korean:
  - 승리
  - 구원들
  - 구출
  lexicon: HALOT
  rationale: 복수형이지만 시의 병렬과 시편 전체 문맥에서 구원 행위들을 가리키므로, 군사적 뉘앙스를 과도하게 좁히지 않고 기본 의미를 살려 '구원'으로 옮겼습니다.
theological_decisions:
- issue: יְשׁוּעוֹת의 번역 범위
  chosen_reading: 군사적 상황을 반영하되 '승리'로 좁히지 않고 '구원'으로 번역했습니다.
  alternative_readings:
  - 승리
  - 구출
  - 구원들
  rationale: 시편 44편의 배경은 대적과 전투이지만, 히브리어 자체는 하나님의 구원 행위를 말합니다. '구원'은 본래 의미를 보존하면서도 문맥상 승리로 경험되는 구원의 성격을 충분히 담습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: אֱלֹהִים의 호격 처리
  chosen_reading: 문장 안에서 하나님을 직접 부르는 호격으로 읽었습니다.
  alternative_readings:
  - 서술문 '주님은 나의 왕이시며 하나님이십니다'
  - 동격문 '주님은 나의 왕, 하나님이십니다'
  rationale: 히브리어의 병렬과 시적 호흡은 기도체의 직접 호칭으로 읽는 것이 자연스럽고, 문맥의 탄원 어조를 가장 잘 살립니다.
  doctrine_reference: Translation philosophy §6
