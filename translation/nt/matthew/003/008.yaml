id: MAT.3.8
reference: Matthew 3:8
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
translation:
  text: Therefore[a], produce fruit worthy of reorientation toward God[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'fruit in keeping with repentance.'
    reason: lexical_alternative
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  chosen: produce
  alternatives:
  - bear
  - make
  lexicon: BDAG
  rationale: Aorist active imperative, second person plural, calling for decisive action. 'Produce' fits idiomatic English with 'fruit' better than the more wooden 'make,' while preserving the command's force. 'Bear' is possible in fruit imagery but is less directly tied to ποιέω here.
- source_word: οὖν
  chosen: Therefore
  alternatives:
  - then
  - so
  lexicon: BDAG
  rationale: Marks an inference from the preceding warning and exhortation. 'Therefore' preserves the logical connection clearly and naturally.
- source_word: καρπὸν
  chosen: fruit
  alternatives:
  - fruitage
  lexicon: BDAG
  rationale: Standard rendering for καρπός, here metaphorical for visible outcome or conduct. Singular is retained as a collective singular in English.
- source_word: ἄξιον
  chosen: worthy of
  alternatives:
  - fit for
  - in keeping with
  lexicon: BDAG
  rationale: ἄξιος with the genitive expresses correspondence or suitability. 'Worthy of' is the most direct formal equivalent, though the sense is that the fruit corresponds to genuine repentance.
- source_word: μετανοίας
  chosen: reorientationd mind
  alternatives:
  - that changed mind
  - a change of mind
  - turning
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
