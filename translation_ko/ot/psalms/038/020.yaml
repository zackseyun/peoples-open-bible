  - 살아 있는
  lexicon: HALOT
  rationale: 형용사로서 상태를 나타내므로 ‘살아 있고’가 현대 한국어에서 가장 자연스럽고, 뒤의 ‘강하며’와 병렬을 이룹니다.
- source_word: עָצֵמוּ
  english_pob_choice: are strong
  chosen_korean: 강하며
  alternatives_korean:
  - 힘이 세며
  - 강해지며
  lexicon: HALOT
  rationale: 히브리어는 현재의 강함을 진술하므로 ‘강하며’가 간결하게 대응합니다. ‘강해지며’는 진행적 뉘앙스를 불필요하게 더합니다.
- source_word: שֹׂנְאַי
  english_pob_choice: those who hate me
  chosen_korean: 나를 거짓되이 미워하는 자들
  alternatives_korean:
  - 나를 미워하는 자들
  - 나를 증오하는 자들
  lexicon: HALOT
  rationale: 분사형의 동작성을 살려 ‘미워하는 자들’로 옮기되, 뒤의 שָׁקֶר과 결합된 전체 표현을 반영해 ‘거짓되이’를 붙였습니다.
- source_word: שָׁקֶר
  english_pob_choice: falsely
  chosen_korean: 거짓되이
  alternatives_korean:
  - 헛되이
  - 아무 이유 없이
  - 속여서
  lexicon: HALOT
  rationale: שָׁקֶר의 기본 의미인 ‘거짓/허위’를 부사적으로 살려, 증오의 근거가 거짓되다는 뜻과 거짓된 태도라는 뜻을 함께 열어 둡니다.
theological_decisions:
- issue: שָׁקֶר의 의미 범위
  chosen_reading: ‘거짓되이’로 번역해, 그들의 미움이 거짓에 근거했거나 거짓된 성격을 지녔다는 중의성을 유지합니다.
  alternative_readings:
  - ‘아무 이유 없이’
  - ‘까닭 없이’
  rationale: 영어 POB 각주가 지적하듯 이 표현은 ‘거짓됨’과 ‘근거 없음’ 사이의 긴장을 지니므로, 하나로만 좁히지 않고 한국어에서도 그 여지를 남겼습니다.
  doctrine_reference: 시 38:20; 언어적 중의성 보존
