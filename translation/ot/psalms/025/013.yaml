id: PSA.25.13
reference: Psalms 25:13
source:
  edition: WLC
  text: נַ֭פְשׁ/וֹ בְּ/ט֣וֹב תָּלִ֑ין וְ֝/זַרְע֗/וֹ יִ֣ירַשׁ אָֽרֶץ׃
translation:
  text: He will dwell in well-being[a], and his offspring will inherit the land.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “he will lodge in well-being.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  chosen: He
  alternatives:
  - he himself
  - his life
  lexicon: HALOT
  rationale: Here נפש idiomatically represents the person; “his soul” is unnecessarily unnatural in English.
- source_word: בְּטוֹב
  chosen: in well-being
  alternatives:
  - in prosperity
  - in well-being
  - in good
  lexicon: HALOT
  rationale: The phrase denotes a favorable state and should not be narrowed to moral “goodness.”
- source_word: תָלִין
  chosen: will lodge
  alternatives:
  - will lodge
  - will spend the night
  - will abide
  lexicon: HALOT
  rationale: This retains the concrete lodging image while allowing the poetic sense of abiding.
- source_word: וְזַרְעוֹ
  chosen: and his offspring
  alternatives:
  - and his seed
  - and his descendants
  lexicon: HALOT
  rationale: זֶרַע can mean seed literally or offspring/descendants figuratively. Here the familial sense is clearly intended. 'Offspring' is concise and natural, while 'seed' would be too literal for most readers and 'descendants' slightly more expansive.
- source_word: יִירַשׁ
  chosen: will inherit
  alternatives:
  - will possess
  - will take possession of
  lexicon: HALOT
  rationale: ירשׁ often means inherit or possess. 'Will inherit' fits the covenantal and wisdom resonance of receiving the land, and matches common biblical idiom.
- source_word: אָרֶץ
  chosen: the land
  alternatives:
  - the earth
  lexicon: HALOT
  rationale: אֶרֶץ can mean land or earth. In this psalmic context, especially with ירשׁ, 'the land' best preserves the covenantal and territorial nuance familiar from the Hebrew Bible. 'The earth' is possible but broader and less contextually precise.
