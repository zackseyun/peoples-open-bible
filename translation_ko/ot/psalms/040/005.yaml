  text: You have done many things, O Yahweh my God—your wonders and your plans for us[a]; none can compare with you. Were I to declare and speak of them, they would be too many to recount.
  footnotes:
  - marker: a
    text: Or 'Happy is the man.' The Hebrew beatitude אַשְׁרֵי can express both happiness and blessedness; 'Blessed' better preserves the psalm's covenantal and wisdom tone.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the man' uses a masculine singular form with representative force.
    reason: cultural_note
  - marker: c
    text: Or 'the arrogant.' The Hebrew רְהָבִים is best understood here as proud people, not the proper name Rahab.
    reason: lexical_alternative
  - marker: d
    text: Or 'to lies' or 'to deception.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼, 나의 하나님, 주께서는 놀라운 일을 많이 행하셨고 우리를 위한 주의 계획도 많으십니다.[a] 주와 견줄 이는 없습니다. 제가 그것들을 선포하고 말하려 해도, 그것들이 너무 많아 셀 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 향한 주의 생각’.
    reason: lexical_alternative
