  - severity: high
    issue: 각주가 현 원문에 대응하지 않음
    rationale: 현 각주들은 ‘손과 발을 찔렀다/파헤쳤다’라는 다른 절의 본문 비평 문제를 다루며, 시편 22:17의 ‘세다’와 두 시각 동사의 병치에 대한 각주가 아닙니다.
  revised_text: 나는 내 모든 뼈를 셀 수 있습니다[a]. 그들은 나를 바라보고 쳐다봅니다[b].
