base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/006.yaml
  text: For exaltation[a][b] comes neither from the east nor from the west nor from the wilderness.
  footnotes:
  - marker: a
    text: The final Hebrew form can also be read as "mountains," yielding a sense such as "from the wilderness of mountains." The context favors "exaltation" or "lifting up."
    reason: alternative_reading
  - marker: b
    text: Or "lifting up" or, more idiomatically, "promotion." The Hebrew clause is elliptical; the following verse identifies God as the one who brings down and lifts up.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 높여짐[a]이 동쪽에서도 서쪽에서도 광야에서도 오지 않기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 생략적이고 해석이 어려운 표현입니다. 문맥상 ‘높여짐’ 또는 ‘높이 세워짐’으로 이해할 수 있으며, 마지막 말을 ‘산들’로 읽어 ‘산들의 광야에서’로 이해하는 견해도 있습니다. 다음 절에서 하나님께서 한 사람을 낮추시고 다른 사람을 높이신다고 말하는 문맥은 ‘높여짐’의 이해를 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרִימוּ
  english_pob_choice: Do not lift up
  chosen_korean: 높이 들지 마십시오
  alternatives_korean:
