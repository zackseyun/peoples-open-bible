  - 근거하여
  - 따라
  lexicon: HALOT
  rationale: 이 표현은 곡조나 연주 방식의 지시일 수 있으므로, 의미를 특정하지 않고 음악적 표지로 남기는 「에 따라」가 가장 무난합니다.
- source_word: אַיֶּלֶת הַשַּׁחַר
  english_pob_choice: The Doe of the Dawn
  chosen_korean: 「새벽 암사슴」
  alternatives_korean:
  - 「새벽의 암사슴」
  - 「새벽의 사슴」
  - 「새벽 암사슴」
  lexicon: HALOT
  rationale: 히브리어의 여성 단수 뉘앙스를 살리면서도 제목처럼 보이도록 표제어 표기인 따옴표를 사용했습니다. POB의 해석처럼 곡명/선율명일 가능성을 유지하려고 직역하되, 뜻을 단정하지는 않았습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗을 위한
  - 다윗이 쓴
  lexicon: HALOT
  rationale: ל의 의미가 저자성, 관련성, 헌정 등을 모두 열어 두므로, 특정하지 않는 소유격형 「다윗의」로 옮겨 POB가 보존한 모호성을 유지했습니다.
theological_decisions:
