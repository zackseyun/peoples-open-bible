source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶ֣בֶן אַחַ֗ת וַ/יָּ֤שֶׂם בֵּֽין הַ/מִּצְפָּה֙ וּ/בֵ֣ין הַ/שֵּׁ֔ן וַ/יִּקְרָ֥א אֶת שְׁמָ֖/הּ אֶ֣בֶן הָעָ֑זֶר וַ/יֹּאמַ֕ר עַד הֵ֖נָּה עֲזָרָ֥/נוּ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/012.yaml
  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: ko
  text: 사무엘은 돌 하나를 가져다가 미스바와 센 사이에 놓고, 그 돌의 이름을 에벤에셀[a]이라 불렀습니다. 그리고 말했습니다. “여기까지 야훼께서 우리를 도우셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에벤에셀’은 히브리어 אֶבֶן הָעָזֶר(‘도움의 돌’)의 음역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן אַחַת
  english_pob_choice: one stone
  chosen_korean: 돌 하나
  alternatives_korean:
  - 한 돌
  - 하나의 돌
  lexicon: אֶבֶן
  rationale: 히브리어의 수사 ‘하나’를 살려 단순히 ‘돌’을 일반화하지 않고 ‘돌 하나’로 옮겨, 사무엘이 실제로 특정한 돌을 취했다는 서술성을 유지했습니다.
- source_word: בֵּין ... וּבֵין ...
  english_pob_choice: between Mizpah and Shen
  chosen_korean: 미스바와 센 사이에
  alternatives_korean:
  - 미스바와 센 사이에
  - 미스바와 센 사이
  - 미스바와 샨 사이에
  lexicon: בֵּין
  rationale: 장소 관계를 분명히 드러내는 기본 구조를 따라 ‘사이’로 옮겼고, 지명은 현대 음역 관행에 맞춰 옮겼습니다.
- source_word: אֶבֶן הָעָזֶר
  english_pob_choice: Ebenezer
  chosen_korean: 에벤에셀
  alternatives_korean:
  - 에벤에셀
  - 에벤에제르
  lexicon: אֶבֶן הָעָזֶר
  rationale: 고유명사이므로 음역을 유지해 기념비의 명칭 자체를 드러냈습니다. 한국 교회 전통형 ‘에벤에셀’이 널리 알려져 있어 이를 채택했습니다.
- source_word: עַד הֵנָּה
  english_pob_choice: Up to this point
  chosen_korean: 지금까지
  alternatives_korean:
  - 이때까지
  - 여기까지
  - 이 시점까지
  lexicon: עַד הֵנָּה
  rationale: ‘지금까지’는 현재까지 이어진 하나님의 도우심의 경계를 자연스럽고 정확하게 나타내며, 축약이나 과장 없이 본문의 시간감을 살립니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 본문 히브리어의 신명사 표기를 따라 학술적 음역인 ‘야훼’를 사용해 원문 식별성을 보존했습니다.
theological_decisions:
- issue: 기념석의 의미를 이름과 진술로 어떻게 드러낼지
  chosen_reading: 돌의 이름을 ‘에벤에셀’로 보존하고, 뒤따르는 말을 하나님의 도우심에 대한 직접 진술로 옮겼습니다.
  alternative_readings:
  - ‘도우심의 돌’처럼 의미를 풀어 번역
  - 기념석의 명칭을 설명적으로 각주에만 처리
  rationale: 히브리어 본문은 돌 자체의 이름과 사무엘의 해석 진술을 함께 보이므로, 명칭을 보존하면서도 ‘야훼께서 우리를 도우셨습니다’라는 선언을 본문에서 분명히 유지하는 편이 원문의 신학적 강조를 가장 잘 전달합니다.
  doctrine_reference: 기념과 간증의 신학; 하나님의 구원 행위에 대한 공적 증언
