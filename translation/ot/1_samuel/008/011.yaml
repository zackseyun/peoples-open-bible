  from: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
  to: 'He said, “This is how the king who will reign over you will treat you[a]: he will take your sons and assign them to his chariot forces and cavalry, and some will run ahead of his chariot[b].'
