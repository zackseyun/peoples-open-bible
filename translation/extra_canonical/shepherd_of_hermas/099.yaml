    ἐστ⸣ιν ⸢ἡ αὐθάδεια⸣ καὶ ἡ κενὴ ⸢πεποίθησις⸣· ἐκ τούτων οὖν πολλοὶ ἀπεβλήθησαν, τινὲς δὲ μετενόησαν
    καὶ ἐπίστευσαν καὶ ὑπέταξαν ἑαυτοὺς τοῖς ἔχουσι σύνεσιν, γνόντες τὴν ἑαυτῶν ἀφροσύνην. 4. καὶ τοῖς
    λοιποῖς δὲ τοῖς τοιούτοις κεῖται μετάνοια· οὐκ ἐγένοντο γὰρ πονηροί, μᾶλλον δὲ ⸢μωροὶ⸣ καὶ ⸢ἀσύνετοι.
    οὗτοι οὖν ἐὰν⸣ μετανοήσωσι, ζήσονται τῷ Θεῷ· ἐὰν δὲ μὴ μετανοήσωσι, κατοικήσουσι μετὰ τῶν γυναικῶν
    τῶν πονηρευομένων εἰς αὐτούς.
