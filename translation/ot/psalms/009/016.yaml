  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: ambiguity
  tier: 1
  from: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
  to: Yahweh is known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
  rationale: 'The proposal rightly improves on the explicitly reflexive “has made himself known,” since נודע can be stative/passive. But “by the judgment he executes” makes the relation instrumental and explicitly causal, whereas the Hebrew presents the clauses paratactically: Yahweh is known; he has executed judgment. Retaining that sequence preserves both the contextual connection and the source’s syntactic reserve.'
