id: PSA.60.8
reference: Psalms 60:8
source:
  edition: WLC
  text: מוֹאָ֤ב סִ֬יר רַחְצִ֗/י עַל אֱ֭דוֹם אַשְׁלִ֣יךְ נַעֲלִ֑/י עָ֝לַ֗/י פְּלֶ֣שֶׁת הִתְרֹעָֽעִֽי׀־׃
translation:
  text: Moab is my washbasin; on Edom I cast my sandal[a]; Philistia, shout in triumph over me[b]!”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The sandal may signify a claim of possession or the contempt of treating Edom as a servant.
    reason: alternative_reading
  - marker: b
    text: The command can be read as an ironic challenge. An alternative reading, reflected in Psalm 108:9, is “Over Philistia I shout in triumph.”
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  chosen: my washbasin
  alternatives:
  - my washpot
  - my basin for washing
  lexicon: HALOT
  rationale: סִיר denotes a pot/basin, and רַחְצִי specifies washing. 'Washbasin' communicates the concrete image in modern English better than the traditional but archaic 'washpot,' while preserving the humiliating metaphor of subjugation.
- source_word: אַשְׁלִיךְ נַעֲלִי
  chosen: I cast my sandal
  alternatives:
  - I throw my shoe
  - I cast my shoe
  lexicon: HALOT
  rationale: The Hiphil of שלך means 'throw/cast.' נַעַל is footwear; 'sandal' better fits the ancient setting than 'shoe.' 'Cast' preserves the elevated poetic register.
- source_word: עַל אֱדוֹם
  chosen: on Edom
  alternatives:
  - over Edom
  - against Edom
  lexicon: HALOT
  rationale: עַל here is retained as 'on' to preserve the image of throwing the sandal onto Edom as a sign of dominance. 'Over' is possible, but 'on' is the more direct spatial equivalent.
- source_word: עָלַי פְּלֶשֶׁת
  chosen: over me, O Philistia
  alternatives:
  - against Philistia
  - concerning Philistia
  - over Philistia ... for me
  lexicon: HALOT
  rationale: The preposition is 'over me,' and Philistia is the feminine vocative addressed by the following imperative.
- source_word: הִתְרֹעָעִי
  chosen: shout in triumph
  alternatives:
  - raise a war cry
  - exult
  - shout aloud
  lexicon: HALOT
  rationale: The form is a feminine singular imperative addressed to Philistia. The alternative first-person reading requires a different textual construal.
- source_word: מוֹאָב / אֱדוֹם / פְּלֶשֶׁת
  chosen: Moab / Edom / Philistia
  rationale: These are place/national names and are transliterated per project philosophy. 'Philistia' reflects the land/nation name rather than the later ethnic term 'Philistines' in this form.
