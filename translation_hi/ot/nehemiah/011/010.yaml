- source_word: יְדַעְיָה
  choice: यदायाह
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בֶן יוֹיָרִיב
  choice: यहोयारीब का पुत्र
