  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Whether to preserve the repeated deliverance verb
  chosen_reading: 'Retain the repetition: ''delivers them; he delivers them'''
  alternative_readings:
  - Compress to a single clause such as 'helps and delivers them'
  rationale: The Hebrew repeats פלט in adjacent clauses for emphasis. Preserving the repetition maintains the poetic force and avoids smoothing away a significant feature of the source text.
