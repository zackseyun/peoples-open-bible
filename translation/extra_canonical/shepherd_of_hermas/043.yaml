  text: Ἤθελον, φημί, κύριε, γνῶναι ποίοις τρόποις με δεῖ δουλεῦσαι τῇ ἐπιθυμίᾳ τῇ ἀγαθῇ. Ἄκουε, φησίν·
    ἔργασαι δικαιοσύνην καὶ ἀρετήν, ἀλήθειαν καὶ φόβον Κυρίου, πίστιν καὶ πρᾳότητα, καὶ ὅσα τούτοις ὅμοιά
    ἐστιν ἀγαθά. ταῦτα ἐργαζόμενος εὐάρεστος ἔσῃ δοῦλος τοῦ Θεοῦ καὶ ζήσῃ αὐτῷ· καὶ πᾶς ὃς ἂν δουλεύσῃ
    τῇ ἐπιθυμίᾳ τῇ ἀγαθῇ, ζήσεται τῷ Θεῷ. 2. Συνετέλεσεν οὖν τὰς ἐντολὰς τὰς δώδεκα, καὶ λέγει μοι· Ἔχεις
    τὰς ἐντολὰς ταύτας· πορεύου ἐν αὐταῖς καὶ τοὺς ἀκούοντας παρακάλει ἵνα ἡ μετάνοια αὐτῶν καθαρὰ γένηται
    τὰς λοιπὰς ἡμέρας τῆς ζωῆς αὐτῶν. 3. τὴν διακονίαν ταύτην ἣν σοι δίδωμι ἐκτέλει ἐπιμελῶς, καὶ πολὺ
    ἐργάσῃ· εὑρήσεις γὰρ χάριν ἐν τοῖς μέλλουσι μετανοεῖν, καὶ πεισθήσονταί σου τοῖς ῥήμασιν· ἐγὼ γὰρ
    μετὰ σοῦ ἔσομαι, καὶ ἀναγκάσω αὐτοὺς πεισθῆναί σοι. 4. Λέγω αὐτῷ· Κύριε, αἱ ἐντολαὶ αὗται μεγάλαι
    καὶ καλαὶ καὶ ἔνδοξοί εἰσι καὶ δυνάμεναι εὐφρᾶναι καρδίαν ἀνθρώπου τοῦ δυναμένου τηρῆσαι αὐτάς. οὐκ
    οἶδα δὲ εἰ δύνανται αἱ ἐντολαὶ αὗται ὑπὸ ἀνθρώπου φυλαχθῆναι, διότι σκληραί εἰσι λίαν. 5. ἀποκριθεὶς
    λέγει μοι· Ἐὰν σὺ σεαυτῷ προθῇς ὅτι δύνανται φυλαχθῆναι, εὐκόλως αὐτὰς φυλάξεις, καὶ οὐκ ἔσονται σκληραί·
    ἐὰν δὲ ἐπὶ τὴν καρδίαν σου ἤδη ἀναβῇ μὴ δύνασθαι αὐτὰς ὑπὸ ἀνθρώπου φυλαχθῆναι, οὐ φυλάξεις αὐτάς.
    6. νῦν δέ σοι λέγω· ἐὰν ταύτας μὴ φυλάξῃς, ἀλλὰ παρενθυμηθῇς, οὐχ ἕξεις σωτηρίαν, οὔτε τὰ τέκνα σου
    οὔτε ὁ οἶκός σου, ἐπεὶ ἤδη σεαυτῷ κέκρικας τοῦ μὴ δύνασθαι τὰς ἐντολὰς ταύτας ὑπὸ ἀνθρώπου φυλαχθῆναι.
