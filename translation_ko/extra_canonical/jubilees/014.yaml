    20. 겐 사람들과 그니스 사람들과 갓몬 사람들과 브리스 사람들과 르바임과 라킷 사람들과 아위 사람들과 아모리 사람들과 가나안 사람들과 기르가스 사람들과 여부스 사람들입니다.

    21. 그리고 그날이 지나갔습니다. 아브람이 조각들과 새들과 그들의 소제와 그들의 전제를 드렸고, 불이 그것들을 삼켰습니다.

    22. 그리고 이날에 우리는 아브람과 언약을 맺었습니다. 이는 이 달에 노아와 언약을 맺었던 것과 같았습니다. 아브람은 그것을 자신을 위한 영원한 절기와 규례로 새롭게 하였습니다.

    23. 아브람은 기뻐했습니다. 그는 이 모든 일을 아내 사래에게 말했고, 사래가 아직 아이를 낳지 못하고 있었지만 자신에게 자손이 생기리라고 믿었습니다. 사래는 남편 아브람에게 권면하며 말했습니다. “내 이집트인 여종 하갈에게 들어가십시오. 어쩌면 내가 그녀에게서 당신을 위해 자손을 세울 수 있을지도 모릅니다.” 아브람은 아내 사래의 말을 듣고 그녀에게 말했습니다. “그렇게 하십시오.” 그리고 그녀는 하갈을 데려갔습니다.

    24. 사라가 자기 여종이자 이집트 여자인 하갈을 데려다가 자기 남편 아브람에게 아내로 주었습니다. 아브람이 하갈에게 들어갔고, 하갈이 임신하여 아들을 낳았으며, 아브람은 그의 이름을 이스마엘이라 불렀습니다. 그때는 이 주간의 다섯째 해였고, 그 해는 아브람이 여든여섯 살이 되던 해였습니다.'
