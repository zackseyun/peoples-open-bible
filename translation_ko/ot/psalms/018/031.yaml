base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is refined[b]; he is a shield to all who take refuge in him.
  footnotes:
  - marker: a
    text: Or 'tested' or 'purified'; the Hebrew evokes metal refined in fire, emphasizing the proven purity of the LORD's word.
    reason: lexical_alternative
  - marker: b
    text: Or 'who trust in him'; the Hebrew more literally means 'who take refuge in him,' preserving the image of God as protective shelter.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 외에 누가 하나님이겠으며, 우리 하나님 외에 누가 반석이겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 절의 ‘야훼 외에’는 ‘야훼를 제외하고’로, 둘째 절의 ‘우리 하나님 외에’는 ‘우리 하나님을 제외하고’로도 옮길 수 있습니다. 두 히브리어 표현 모두 배타성을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  english_pob_choice: As for God
  chosen_korean: 하나님은
  alternatives_korean:
  - 하나님께서는
  - 하나님
  lexicon: HALOT
  rationale: 문두의 주제 전환을 한국어에서는 주격 표지로 자연스럽게 살려, 하나님의 행위를 대비시키는 문장 구조를 유지했습니다.
- source_word: תָּמִים
  english_pob_choice: blameless
