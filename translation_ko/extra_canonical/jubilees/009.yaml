base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009.yaml
  text: '1[1]. And for the south there came out his lot, for Shem, to the middle of the sea; and for Ham there came out the second lot, beyond the Gihon toward the south, to the right of the Garden, and it extends toward the south.

    2. And it extends to all the mountains of fire, and it extends toward the west to the sea of Atel, and it extends westward until it reaches the sea of Mauk, that sea into which everything that is not destroyed descends.

    3. And it goes forth toward the north to the limits of Gadir, and it goes forth to the coast of the waters of the sea, to the great waters, until it approaches the river Gihon; and the river Gihon goes along the middle of this land.

    4. And this is the land that came out for Ham as the portion which he was to occupy forever for himself and for his sons through their generations forever[9].

    5. And for Japheth there came out the third portion beyond the river Tina toward the north of the outflow of its waters, and it extends northeasterly to the whole region of Gog and to all the country east of it.

    6. And it extends northerly to the north, and it extends to the mountains of Qelt toward the north, and toward the sea of Mauk; and it goes forth to the east of Gadir as far as the region of the waters of the sea.

    7. And it extends until it approaches the west of Fara, and it returns toward Aferag, and it extends easterly toward the waters of the sea of Me''at.

    8. And for Noah there came out a writing concerning all this, and he divided the earth among his sons for an inheritance according to their three portions; and they stretched out their hands and took the writing from the bosom of Noah their father.

    9. And there came the prince Mastema, and he said, "Lord, Creator, leave some of them to me, and let them listen to my voice and do everything that I tell them; for if none of them is left to me, I will not be able to exercise the authority of my will among the children of men, because they are for corrupting and leading astray before my judgment, for great is the evil of the sons of men."

    10. And he said, "Let a tenth of them remain before him, and let nine parts descend into the place of judgment." And one of us said that we should teach Noah all their remedies, for

    11. we knew that they would not walk in uprightness, nor strive in righteousness. And we acted according to all his words: all the evil ones who were cruel we bound in the place of judgment, and we left a tenth of them so that they might be subject before Satan on the earth.

    12. And we told Noah all their medicines together with their deceptions, so that he might heal by the plants of the earth. And Noah wrote down everything that we taught him in a book, all the kinds of remedies; and the evil spirits were restrained from following the sons of Noah.

    13. And he gave all that he had written to Shem, his eldest son, because he loved him much more than all his sons.

    14. And Noah slept with his fathers, and he was buried on Mount Lubar in the land of Ararat. Nine hundred and fifty years he completed in his life, nineteen jubilees and two weeks and five years. And in his life on earth he surpassed the sons of men, except Enoch, because of the righteousness in which he was perfect. For Enoch’s task was created as a testimony for the generations of the world, so that he should recount all the deeds of generation after generation until the day of judgment.

    15. And in the thirty-third jubilee, in the first year of the second week, Peleg took for himself a wife, whose name was Lomna, daughter of Sinaar; and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, "Look, the children of men have become evil through the wicked purpose to build for themselves a city and a tower in the land of Shinar."

    16. For they departed from the land of Ararat eastward into Shinar, for in his days they built the city and the tower, saying, "Come, let us go up by it into heaven."

    17. And they began to build, and in the fourth week they made brick with fire, and the bricks served them for stone, and the clay with which they plastered was asphalt that comes out from the sea and from the springs of water in the land of Shinar.

    18. And they built it for forty-three years. Its breadth was 203 bricks, and the height of a brick was the third of one; its height amounted to 5,433 cubits and 2 palms, and the extent of one wall was thirteen stades[18][14][10], and of the other thirty stades.'
  footnotes:
  - marker: '1'
    text: The opening land-allotment section is fragmentary in the supplied chapter rows. The English for vv. 1-8 follows the chapter's evident sequence of the divisions among Shem, Ham, and Japheth, but some place-names and boundaries remain textually uncertain.
    reason: segmentation_note
  - marker: '9'
    text: The Ethiopic reads 'angel/prince of spirits'; the adversarial figure is rendered as Mastema in light of Jubilees' recurring terminology and the immediate context of demonic spirits.
    reason: lexical_alternative
  - marker: '10'
    text: The phrase 'let a tenth of them remain' preserves the chapter's distinctive explanation for ongoing demonic activity after the flood.
    reason: cross_reference
  - marker: '14'
    text: '''Nineteen jubilees and two weeks and five years'' equals 950 years. The chapter intentionally preserves both the total and the jubilean reckoning.'
    reason: cultural_note
  - marker: '18'
    text: The tower measurements are textually difficult in Ethiopic transmission. The numbers are translated conservatively from the supplied text and may reflect a corrupt or compressed measurement tradition.
    reason: textual_variant
translation:
  language: ko
  text: '1. 셈에게는 남쪽의 몫이 나왔으니, 바다 한가운데에 닿는 곳까지였습니다. 마다이에게도 몫이 나왔으니, 그가 두 형제의 서쪽에서 차지할 몫은 섬들과 그 경계들에 이르기까지였습니다.

    2. 그리고 그것은 불의 모든 산들에 이르고, 서쪽으로 아텔의 바다를 향해 뻗어 있으며, 서쪽으로 계속 뻗어 그 안으로 내려가는 것은 무엇이든 멸망하지 않는 마우크의 바다에 이릅니다.

    3. 그 경계는 북쪽으로 뻗어 가디르의 경계에 이르고, 큰 바다의 물가로 뻗어 기혼 강에 가까이 이르며, 기혼의 물 남쪽을 따라 이 강의 강둑에 이릅니다.

    4. 이는 함에게 돌아간 땅이니, 그와 그의 자손이 대대로 영원히 차지할 몫입니다.

    5. 야벳에게는 티나 강 건너편, 그 물이 흘러나오는 곳의 북쪽에 있는 셋째 몫이 나왔습니다. 그것은 북동쪽으로 곡의 온 지역과 그 동쪽의 온 땅까지 뻗어 있습니다.

    6. 그리고 야완에게는 넷째 몫이 돌아갔습니다. 곧 모든 섬과 룻의 경계 쪽에 있는 섬들입니다.

    7. 그리고 그 경계는 파라 서쪽에 이르고, 아페라그 쪽으로 돌아가며, 동쪽으로 메아트 바다의 물을 향해 뻗어 갑니다.

    8. 그리고 영들의 천사 마스테마가 와서 말하였습니다. “주님, 창조주여, 그들 가운데 일부를 내게 남겨 주시어, 그들이 내 목소리를 듣고 내가 그들에게 말하는 모든 것을 행하게 하소서. 그들 가운데 일부를 내게 남겨 주지 않으시면, 저는 사람의 자손들에게 내 의지에 따른 권세를 행사할 수 없습니다. 그들은 내 심판 전에 사람의 자손들을 타락시키고 미혹시키기 위한 자들이며, 사람의 자손들의 악이 매우 크기 때문입니다.”

    9. 그리고 영들의 천사 마스테마가 와서 말하였습니다. “주님, 창조주님, 그들 가운데 얼마를 제게 남겨 주시고, 그들이 제 말을 듣고 제가 그들에게 말하는 모든 것을 행하게 해 주십시오. 그들 가운데 아무도 제게 남겨지지 않으면, 저는 사람들 가운데서 제 뜻에 따른 권세를 행사할 수 없을 것입니다. 그들은 제 심판 전에 타락시키고 미혹하게 할 자들이기 때문입니다. 사람의 자손들의 악이 크기 때문입니다.”

    10. 그리고 그는 말했습니다. “그들 중 십분의 일은 그의 앞에 남게 하시고, 아홉 몫은 심판의 자리로 내려가게 하십시오.” 그리고 그는 우리 중 한 사람에게 우리가 노아에게 그들의 모든 치료법을 가르치라고 말했습니다. 이는

    11. 그리고 두발에게는 룻의 몫 쪽으로 뻗어 있는 혀의 한가운데에서, 다른 혀에 이르고 그 다른 혀 너머의 지역에 이르는 다섯째 몫이 나왔습니다.

    12. 세 번째 언어입니다. 그리고 메섹에게는 여섯째 몫, 곧 세 번째 언어 너머의 모든 지역이 나왔습니다.

    13. 그리고 우리는 노아에게 그들의 속임수와 함께 일러 주어, 그들이 땅의 식물들로 치유를 받게 하였습니다. 노아는 우리가 그에게 가르친 모든 것을 온갖 치유에 관한 책에 적었고, 영들이 억제되었습니다.

