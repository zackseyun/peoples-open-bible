theological_decisions:
- issue: Rendering of the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Interpretation of the elliptical phrase לֹא הוּא
  chosen_reading: He is not there
  alternative_readings:
  - He is nothing
  - He will do nothing
  - Not he
  rationale: The phrase is ambiguous and could be taken as denial of the LORD's existence, presence, or effective action. Because the immediate context is their claim that no judgment will come, the translation preserves the personal denial without collapsing it into a more interpretive paraphrase like 'He will do nothing.' An alternative is preserved in a footnote.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
