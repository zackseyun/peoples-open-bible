revisions:
- from: 그들은 하나님이시여, 당신의 행렬들을 보았습니다 — 나의 하나님, 나의 왕의 행렬들을 성소로 들어가는 것을.[a]
  to: 노래하는 이들이 앞서가고, 악기를 연주하는 이들이 뒤따르며, 그 가운데에서 젊은 여성들이 소고를 치고 있습니다.
  rationale: 제시된 WLC 원문을 직접 번역했습니다. קִדְּמוּ는 ‘앞서가고’, שָׁרִים은 ‘노래하는 이들’, אַחַר נֹגְנִים은 ‘악기를 연주하는 이들이 뒤따르며’, בְּתוֹךְ עֲלָמוֹת תּוֹפֵפוֹת은 ‘그 가운데에서 젊은 여성들이 소고를 치고 있습니다’로 반영했습니다. 원문에 없는 하나님·왕·성소·행렬 관련 표현과 이에 딸린 무관한 각주는 제거했습니다.
