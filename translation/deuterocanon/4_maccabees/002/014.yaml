  meaning: A person governed by reason spares enemies’ cultivated trees, safeguards their lost property, and helps raise what has fallen.
  meaning_decisions:
  - source_phrase: μηδὲ δενδροτομῶν τὰ ἥμερα τῶν πολεμίων φυτά
    prior_rendering: nor cutting down the cultivated plants of enemies
    new_rendering: Such a person does not cut down an enemy’s cultivated trees
    rationale: The participle describes the conduct of the person whose hostility reason governs; supplying that subject makes the example intelligible. The tree-cutting verb and the allusion to Deuteronomy favor cultivated trees rather than plants generally.
  - source_phrase: τὰ δὲ τῶν ἐχθρῶν τοῖς ἀπολέσασιν διασώζων
    prior_rendering: but preserving those of foes who have been destroyed
    new_rendering: but safeguards enemies’ property for those who have lost it
    rationale: The active participle can describe people who have lost their property; it does not straightforwardly mean people who have been destroyed. This reading also fits the law’s command to return an enemy’s straying animal, while the serious alternative is noted.
  - source_phrase: τὰ πεπτωκότα συνεγείρων
    prior_rendering: raising up what has fallen
    new_rendering: helps lift up what has fallen
    rationale: The compound verb conveys assisting in raising something up. The object remains unspecified in the text, with the likely legal allusion supplied in a note.
