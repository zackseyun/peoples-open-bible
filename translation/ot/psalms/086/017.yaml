  review_summary: עֲשֵׂה עִמִּי אוֹת does not simply ask God to show the speaker an external sign; it asks him to act in the speaker’s case in a way that functions as a sign. “Do something for me as a sign of your favor” preserves the action, the beneficiary, and the sign function without wooden gloss-English. לְטוֹבָה is naturally understood as favorable benefit here.
