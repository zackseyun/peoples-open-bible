  meaning_decisions:
  - source_phrase: καθʼ ἃ ἐλογίσαντο ἕξουσιν ἐπιτιμίαν
    prior_rendering: will have punishment according to what they reasoned
    new_rendering: will receive the punishment their own reasoning deserves
    rationale: The punishment corresponds to the ungodly reasoning developed earlier in the book. The new wording expresses that fitting judgment naturally, while the note preserves the possible emphasis on hostile schemes.
  - source_phrase: οἱ ἀμελήσαντες τοῦ δικαίου
    prior_rendering: having neglected the righteous man
    new_rendering: who disregarded the righteous man
    rationale: The repeated article identifies the ungodly by their conduct. 'Disregarded' better conveys their refusal to take the righteous man seriously than 'neglected,' which can suggest failure to provide care.
