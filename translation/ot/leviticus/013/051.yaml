  chosen_reading: skin disease
  alternative_readings:
  - leprosy
  - defiling disease
  rationale: The Hebrew term does not map neatly onto modern Hansen's disease and in this chapter applies even to garments and leather. Therefore a non-medically specific rendering is preferable. 'Skin disease' is retained in the main text for accessibility, while the broader ritual-impurity sense is noted here.
