id: PSA.69.5
reference: Psalms 69:5
source:
  edition: WLC
  text: אֱֽלֹהִ֗ים אַתָּ֣ה יָ֭דַעְתָּ לְ/אִוַּלְתִּ֑/י וְ֝/אַשְׁמוֹתַ֗/י מִמְּ/ךָ֥ לֹא נִכְחָֽדוּ־׃
translation:
  text: God, you know my foolishness, and my guilt is not hidden from you.
  philosophy: dynamic
lexical_decisions:
- source_word: אֱלֹהִים
  chosen: God
  alternatives:
  - O God
  lexicon: HALOT
  rationale: Vocative address to God in prayer. English can render the direct address simply as 'God' without adding 'O,' though 'O God' is a possible stylistic alternative.
- source_word: אַתָּה
  chosen: you
  lexicon: HALOT
  rationale: 'Explicit 2ms pronoun adds emphasis in Hebrew; English naturally conveys this with ''you'' following the vocative: ''God, you know...''.'
- source_word: יָדַעְתָּ
  chosen: know
  alternatives:
  - have known
  lexicon: HALOT
  rationale: 'Qal perfect 2ms of ידע in a present-state sense: God''s knowledge is current and complete. English present ''know'' best captures the stative force in context.'
- source_word: לְאִוַּלְתִּי
  chosen: my foolishness
  alternatives:
  - my folly
  lexicon: HALOT
  rationale: The noun denotes folly/foolishness. 'My foolishness' is clear modern English and preserves the psalmist's confession of culpable moral folly rather than mere intellectual error.
- source_word: וְאַשְׁמוֹתַי
  chosen: my wrongs
  alternatives:
  - my guilt offerings
  - my trespasses
  - my wrongs
  lexicon: HALOT
  rationale: The plural denotes culpable offenses and is naturally rendered with a concrete English plural.
- source_word: מִמְּךָ
  chosen: from you
  alternatives:
  - before you
  lexicon: HALOT
  rationale: The preposition מן with suffix is most directly 'from you.' In the idiom with נכחד, it expresses concealment from someone's awareness; 'from you' is the most literal and still idiomatic English.
- source_word: לֹא נִכְחָדוּ
  chosen: are not hidden
  alternatives:
  - are not hidden
  - have not been concealed
  lexicon: HALOT
  rationale: The plural verb agrees directly with “wrongs.”
