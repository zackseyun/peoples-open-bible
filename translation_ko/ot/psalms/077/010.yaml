source:
  edition: WLC
  text: וָ֭/אֹמַר חַלּ֣וֹתִ/י הִ֑יא שְׁ֝נ֗וֹת יְמִ֣ין עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/010.yaml
  text: 'Then I said, “This is my grief: the right hand of the Most High has changed[a].”'
  footnotes:
  - marker: a
    text: 'Or ''This is my appeal: the years of the right hand of the Most High.'' The difficult Hebrew can read ''change'' as a verb or ''years'' as a plural noun.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 내가 말했습니다. “이것이 나의 고통[a]입니다. 곧 지극히 높으신 분의 오른손의 햇수[b]입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이것이 나의 약함입니다’ 또는 ‘이것이 나의 병입니다.’ 히브리어 낱말의 뜻이 어려우며, 고통·약함·질병을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘지극히 높으신 분의 오른손의 변화입니다.’ 어떤 이들은 여기의 히브리어를 ‘햇수’가 아니라 지극히 높으신 분의 오른손이 변했다는 뜻으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/שָׁכַח
  english_pob_choice: Has ... forgotten
  chosen_korean: 잊으셨습니까
  alternatives_korean:
  - 기억하지 않으셨습니까
  - 잊어버리셨습니까
  lexicon: HALOT
  rationale: 의문형 הֲ와 שׁכח의 수사적 질문을 자연스러운 한국어 의문문으로 옮겼습니다. '잊으셨습니까'는 하나님의 기억 상실을 뜻하기보다, 시편 화자의 탄식 어린 질문을 그대로 드러냅니다.
- source_word: חַנּוֹת
  english_pob_choice: to be gracious
  chosen_korean: 은혜를 베푸시는 것
  alternatives_korean:
  - 호의를 보이시는 것
  - 은총을 베푸시는 것
  lexicon: HALOT
  rationale: חנן의 핵심 의미인 '은혜/호의'를 살리되, 본문 앞뒤의 하나님의 행위와 잘 이어지도록 '은혜를 베푸시는 것'으로 옮겼습니다.
- source_word: קָפַץ בְּאַף
  english_pob_choice: shut up in anger
  chosen_korean: 진노하셔서 ... 가두셨습니까
  alternatives_korean:
  - 분노 가운데 ... 막으셨습니까
  - 진노 가운데 ... 거두셨습니까
  lexicon: HALOT
  rationale: קָפַץ의 구체적 '닫다/막다' 이미지를 살리면서, 한국어에서는 대상인 '긍휼'을 '가두다'로 받아들이는 것이 가장 자연스럽습니다. '진노하셔서'는 בְּאַף를 간결하게 반영합니다.
- source_word: רַחֲמָיו
  english_pob_choice: his compassion
  chosen_korean: 자신의 긍휼
  alternatives_korean:
  - 자비
  - 긍휼하심
  lexicon: HALOT
  rationale: רַחֲמִים 계열의 자애와 애끊는 긍휼의 뜻을 살리기 위해 교회적 관용 표현인 '긍휼'을 택했습니다. 소유격은 문맥상 '자신의'로 분명히 했습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 세라
  lexicon: HALOT
  rationale: 의미가 불확실한 히브리어 예식/음악 표지를 음역으로 보존했습니다.
theological_decisions:
- issue: 수사적 질문을 탄식의 실제 진술로 약화시키지 않을 것
  chosen_reading: 두 개의 수사적 질문으로 번역하여 시편 기자의 절박한 탄식을 유지했습니다.
  alternative_readings:
  - 하나님이 은혜를 베푸시는 것을 잊으셨다
  - 그분이 진노 중에 자신의 긍휼을 가두셨다
  rationale: 히브리어의 의문형과 시적 평행법이 질문 형식을 요구하므로, 단정문으로 바꾸면 탄식의 긴장과 신학적 불안이 희석됩니다.
  doctrine_reference: 애가의 신학적 긴장을 보존
