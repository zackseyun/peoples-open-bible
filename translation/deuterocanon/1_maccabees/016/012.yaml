lexical_decisions:
- source_word: ἦν
  chosen: was
  alternatives:
  - had been
  lexicon: BDAG
  rationale: Imperfect of εἰμί gives the simple past-state in context; English 'was' is the natural rendering.
- source_word: γὰρ
  chosen: for
  alternatives:
  - because
  - indeed
  lexicon: BDAG
  rationale: γάρ gives explanatory force connecting this clause to the prior context; 'for' preserves that relation compactly.
- source_word: γαμβρὸς
  chosen: son-in-law
  alternatives:
  - relative by marriage
  - bridegroom
  lexicon: LSJ
  rationale: In this context the kinship term most naturally means 'son-in-law,' indicating relation by marriage to the high priest. Broader affine meanings are possible lexically, but the specific familial sense is the clearest English equivalent here.
- source_word: τοῦ ἀρχιερέως
  chosen: of the high priest
  alternatives:
  - of the chief priest
  lexicon: BDAG
  rationale: ἀρχιερεύς is standardly 'high priest' in Jewish context; this is the established and accurate title.
