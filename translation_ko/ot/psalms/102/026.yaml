revisions:
- from: 오래전부터 주께서는 땅을 세우셨고, 하늘들은 주의 손의 작품입니다.[a]
  to: 그들은 없어지겠지만, 주께서는 그대로 계실 것입니다.[a] 그것들은 모두 옷처럼 낡아 갈 것입니다. 주께서는 옷처럼 그것들을 바꾸실 것이며,[b] 그것들은 사라질 것입니다.
  rationale: 제시된 WLC 본문과 영어 POB 감사 기록을 기준으로, 앞 절의 번역으로 잘못 대체된 초안을 해당 절 전체의 번역으로 수정했습니다. הֵמָּה와 וְכֻלָּם은 앞 문맥의 하늘과 땅을 가리키므로 ‘그들/그것들’로 유지했고, אבד와 בלה의 소멸·마모 이미지를 구별했습니다. תַחֲלִיפֵם의 ‘바꾸다/대신하다’ 가능성과 תַעֲמֹד의 문자적 ‘서다’는 본문을 과도하게 확정하지 않도록 각주에 보존했습니다.
