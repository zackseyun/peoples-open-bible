id: PSA.104.4
reference: Psalms 104:4
source:
  edition: WLC
  text: עֹשֶׂ֣ה מַלְאָכָ֣י/ו רוּח֑וֹת מְ֝שָׁרְתָ֗י/ו אֵ֣שׁ לֹהֵֽט׃
translation:
  text: He makes winds his messengers, a flaming fire his ministers[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'He makes his angels spirits, his ministers a flame of fire,' the reading reflected in Hebrews 1:7.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֶׂה
  chosen: makes
  alternatives:
  - who makes
  - fashiones
  lexicon: HALOT
  rationale: The participle of עשה functions predicatively in context, describing God's characteristic action. 'Makes' is natural modern English and preserves the verbal force without overformal awkwardness.
- source_word: מַלְאָכָיו
  chosen: his messengers
  alternatives:
  - his angels
  lexicon: HALOT
  rationale: In the contextual construal, winds are appointed as God's messengers.
- source_word: רוּחוֹת
  chosen: winds
  alternatives:
  - spirits
  lexicon: HALOT
  rationale: The surrounding creation hymn favors physical winds, though 'spirits' remains a lexical possibility.
- source_word: מְשָׁרְתָיו
  chosen: his ministers
  alternatives:
  - his servants
  - those who serve him
  lexicon: HALOT
  rationale: Flaming fire is appointed as God's minister or servant in the parallel clause.
- source_word: אֵשׁ
  chosen: fire
  lexicon: HALOT
  rationale: The noun straightforwardly means 'fire' and is retained literally to preserve the psalm's elemental imagery.
- source_word: לֹהֵט
  chosen: flaming
  alternatives:
  - blazing
  - burning
  lexicon: HALOT
  rationale: As a participial/adjectival form modifying 'fire,' 'flaming' is idiomatic and vivid in English. It preserves the active, fiery quality without sounding overly wooden.
