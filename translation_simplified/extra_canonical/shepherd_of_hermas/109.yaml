  text: '“So set yourselves right while the tower is still being built.”


    2. “The Lord dwells in people who love peace, for peace is dear to him. He stays far from those who
    quarrel and are lost in wickedness. Therefore return the spirit to him whole, just as you received
    it.”


    3. “If you give a cleaner a new, undamaged garment and want to receive it back undamaged, but the
    cleaner returns it torn, will you accept it? Will you not immediately grow angry and scold him, saying,
    ‘I gave you an undamaged garment. Why did you tear it and make it useless? Because of the tear you
    made, it cannot be used.’ Will you not say all these words to the cleaner about the tear he made in
    your garment?”


    4. “If, then, you grieve so over your garment and complain that you do not receive it back whole,
    what do you think the Lord will do to you? He gave you a whole spirit, and you have made it completely
    useless, so that it can be of no service to its Lord. Its usefulness has been lost because you have
    corrupted it. Will not the Lord of that spirit therefore punish you with death for what you have done?[a]”


    5. “Certainly,” I said. “He will punish all those whom he finds persisting in grudges.” “Do not trample
    on his mercy,” he said. “Rather, honor him, because he is so patient with your offenses and is not
    like you. Practice repentance that benefits you.”'
