translation:
  text: While I was still young, before I went astray, I sought wisdom openly in my prayer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verses 13–16 follow a Greek working form. The published Hebrew scroll 11Q5 reading also has the before-straying phrase, but here lacks the explicit wisdom noun and prayer phrase. Manuscript B begins with youth, desire and seeking, then places walking and learning before prayer; Kahana's loving-wisdom clause is bracketed. The earliest Hebrew wording remains unresolved.
    reason: textual_variant
lexical_decisions:
- source_word: Ἔτι ὢν νεώτερος
  chosen: While I was still young
  alternatives:
  - While I was still younger
  rationale: The participial phrase describes the speaker's youth; 'still young' gives readable English without inventing a specific comparison.
- source_word: πρὶν ἢ πλανηθῆναί με
  chosen: before I went astray
  alternatives:
  - before I wandered
  rationale: The infinitival construction gives the temporal limit before straying. This translates the Greek wording without resolving the different Hebrew textual forms.
- source_word: ἐζήτησα σοφίαν
  chosen: I sought wisdom
  rationale: The verb expresses seeking and has wisdom as its explicit object.
- source_word: προφανῶς
  chosen: openly
  alternatives:
  - publicly
  rationale: The adverb indicates manifest or open seeking; 'openly' preserves this without specifying an audience.
- source_word: ἐν προσευχῇ μου
  chosen: in my prayer
  rationale: The Greek has an explicit prayer noun and first-person possessive. This wording is translated as Greek, not supplied to the shorter 11Q5 Hebrew reading.
