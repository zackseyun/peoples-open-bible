  naturalness: 현대 표준어 합쇼체로 전반적으로 자연스럽습니다. 다만 인물 동격구는 '히위 사람 하몰의 아들 세겜'으로 배열하는 편이 명료합니다. 마지막 절은 앞 문장에 이어 '그녀는 어린 소녀였습니다'라고 처리하면 불필요한 접속 반복을 줄일 수 있습니다.
  terminology: '''더럽혔습니다''는 게에즈어의 오염·부정하게 함의 뜻과 영어 POB의 ''defiled her''를 정확히 반영합니다. ''히위 사람'', ''세겜'', ''하몰'', ''디나'', ''야곱''도 통용되는 성서 고유명사 표기입니다.'
