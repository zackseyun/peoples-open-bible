    reference: Sirach 8:4
translation:
  text: For gold has ruined many and leads the hearts of nobles[a] astray.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'generous men.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים
  chosen: many
  alternatives:
  - multitudes
  - many people
  lexicon: HALOT
  rationale: The adjective/substantive plainly denotes a large number of persons. 'Many' is the most natural concise English equivalent.
- source_word: הִפְחִיז
  chosen: has ruined
  alternatives:
  - has made reckless
  - has unsettled
  - has led astray
  lexicon: HALOT
  rationale: The verb is difficult and somewhat rare; in context with 'gold' as subject and the parallel colon about misleading the heart, it conveys destructive moral destabilization. 'Has ruined' captures the result in idiomatic English while remaining anchored to the Hebrew sense of causing reckless or disastrous behavior.
- source_word: זָהָב
  chosen: gold
  lexicon: HALOT
  rationale: Straightforward lexical rendering.
- source_word: יַשְׂגֶּה
  chosen: leads astray
  alternatives:
  - misleads
  - causes to err
  lexicon: HALOT
  rationale: From a verb of going astray/causing error. 'Leads astray' preserves the moral sense and fits the wisdom context.
- source_word: לֵב
  chosen: heart
  alternatives:
  - mind
  lexicon: HALOT
  rationale: In Hebrew anthropology 'heart' is the seat of thought and desire. Retaining 'heart' preserves the source imagery.
- source_word: נְדִיבִים
  chosen: nobles
  alternatives:
  - generous men
  - princes
  lexicon: HALOT
  rationale: The noun can denote nobles/princely persons and also the generous. In this context, with wealth and social status in view, 'nobles' best fits; the alternative nuance is worth preserving in a footnote.
