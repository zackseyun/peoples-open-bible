id: PSA.49.12
reference: Psalms 49:12
source:
  edition: WLC
  text: וְ/אָדָ֣ם בִּ֭/יקָר בַּל יָלִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ־׃
translation:
  text: But a man, for all his honor, does not endure[a]; he is like the beasts that perish.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “does not stay the night.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  chosen: man
  alternatives:
  - humankind
  lexicon: HALOT
  rationale: Rendered 'man' in keeping with the doctrine guideline for אָדָם as 'man / humankind (context)' and because the singular masculine form here presents humanity representatively through 'man.'
- source_word: בִּיקָר
  chosen: in honor
  alternatives:
  - in splendor
  - in wealth
  - in preciousness
  lexicon: HALOT
  rationale: The noun יָקָר denotes honor, value, or splendor. 'In honor' fits the psalm's theme of human status and prestige better than a narrower economic sense such as 'wealth.'
- source_word: בַּל
  chosen: does not
  alternatives:
  - will not
  - not
  lexicon: HALOT
  rationale: This particle negates the following verb. 'Does not' gives clear modern English in a proverbial statement.
- source_word: יָלִין
  chosen: last overnight
  alternatives:
  - abide
  - stay overnight
  - endure
  lexicon: HALOT
  rationale: Retains the night/lodging image while producing natural English in this mortality saying.
- source_word: נִמְשַׁל
  chosen: he is like
  alternatives:
  - he is compared to
  - he is likened to
  lexicon: HALOT
  rationale: The Niphal of משל here expresses comparison. 'He is like' is the most natural English rendering.
- source_word: כַּבְּהֵמוֹת
  chosen: the beasts
  alternatives:
  - the animals
  - beasts
  lexicon: HALOT
  rationale: בְּהֵמוֹת here refers generally to animals/beasts. 'Beasts' preserves the psalm's solemn and traditional wisdom tone.
- source_word: נִדְמוּ
  chosen: that perish
  alternatives:
  - that are destroyed
  - they have become like
  - they are silenced
  lexicon: HALOT
  rationale: The verb דמה in this form is commonly understood here as 'perish' or 'be destroyed,' especially in parallel with human mortality in the psalm. This yields the coherent sense that honored man is like beasts that perish. The alternative sense 'become like' would make the line awkwardly repetitive after נמשל.
