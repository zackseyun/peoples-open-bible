id: DAN.7.13
reference: Daniel 7:13
source:
  edition: WLC
  text: חָזֵ֤ה הֲוֵית֙ בְּ/חֶזְוֵ֣י לֵֽילְיָ֔/א וַ/אֲרוּ֙ עִם עֲנָנֵ֣י שְׁמַיָּ֔/א כְּ/בַ֥ר אֱנָ֖שׁ אָתֵ֣ה הֲוָ֑ה וְ/עַד עַתִּ֤יק יֽוֹמַיָּ/א֙ מְטָ֔ה וּ/קְדָמ֖וֹ/הִי הַקְרְבֽוּ/הִי־־׃
translation:
  text: I kept looking in the visions of the night, and behold, with the clouds of heaven[a] one like a son of man[b] was coming, and he came to the Ancient of Days[c], and they brought him near before him[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Aramaic has 'with the clouds.' The selected Rahlfs–Hanhart2006 Old Greek has 'upon the clouds'; this is a versional contrast, not the literal sense of the Aramaic preposition.
    reason: textual_variant
  - marker: b
    text: Or 'one like a human being.' The Aramaic expression is comparative and describes human likeness; it does not by itself name the figure or establish a later title.
    reason: lexical_alternative
  - marker: c
    text: The selected Rahlfs–Hanhart2006 Old Greek instead has an Ancient-of-Days comparison clause ('as/like an Ancient of Days'). Its subject and relation to the humanlike figure are uncertain. NETS's Old Greek rendering instead gives a destination at the Ancient. These are not a uniform reading of all Greek witnesses; earliest wording remains unresolved.
    reason: textual_variant
  - marker: d
    text: 'The Aramaic has unnamed plural agents: ''they brought him near.'' The consulted Theodotion text uses passive presentation; the selected Old Greek has attendants present rather than bringing him.'
    reason: textual_variant
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  chosen: I kept looking
  alternatives:
  - I was seeing
  - I watched
  lexicon: WLC/OSHB; chapter7 grammatical control
  rationale: The participle plus Aramaic הוה auxiliary expresses ongoing past observation. I kept looking retains that durative sense. The source is Aramaic, not the Hebrew היה construction named in the archived rationale.
- source_word: בְּחֶזְוֵי לֵילְיָא
  chosen: in the visions of the night
  alternatives:
  - in the night visions
  - in visions by night
  lexicon: HALOT
  rationale: A fairly formal rendering preserves the plural 'visions' and the genitival relation with 'night.' 'Of the night' is slightly more literal than the smoother traditional 'night visions' and remains clear.
- source_word: וַאֲרוּ
  chosen: and behold
  alternatives:
  - and look
  - and there was
  lexicon: HALOT
  rationale: This discourse marker introduces a striking new scene in the vision. 'And behold' preserves the vividness and apocalyptic tone.
- source_word: עִם עֲנָנֵי שְׁמַיָּא
  chosen: with the clouds of heaven
  alternatives:
  - with heaven's clouds
  lexicon: WLC/OSHB; CAL; named Greek-version comparison
  rationale: Aramaic עם means with. Upon clouds is the selected RH2006 OG wording, not an alternate literal gloss of unchanged Aramaic. Retain with provisionally without treating source-language primacy as proof of historical priority.
- source_word: כְּבַר אֱנָשׁ
  chosen: one like a son of man
  alternatives:
  - one like a human being
  - one like a man
  lexicon: WLC/OSHB; CAL
  rationale: Comparative prefix plus human/son-of-man expression. Main wording preserves the source idiom; one like a human being is a valid idiomatic alternative. Neither the grammatical singular nor this English idiom establishes the figure's identity or a later definite title.
- source_word: אָתֵה הֲוָה
  chosen: was coming
  alternatives:
  - came
  - was arriving
  lexicon: HALOT
  rationale: The participial verbal expression suggests an ongoing approach in the visionary scene. 'Was coming' preserves that aspect better than the simple past 'came'.
- source_word: וְעַד עַתִּיק יוֹמַיָּא
  chosen: to the Ancient of Days
  alternatives:
  - up to the Ancient of Days
  lexicon: WLC/OSHB; CAL; named Greek-version comparison
  rationale: The Aramaic preposition gives an endpoint with the separate reaching verb. The selected RH2006 OG has a nominative comparison clause, whose subject continuity remains uncertain; NETS's OG English instead has an endpoint. Disclose the contrast without promoting exact reconstructed Aramaic or identifying the figures.
- source_word: מְטָה
  chosen: he came
  alternatives:
  - he reached
  - he arrived
  lexicon: HALOT
  rationale: A simple past is appropriate for the completed arrival after the prior progressive approach. 'He came' is natural and fits the narrative sequence.
- source_word: וּקְדָמוֹהִי
  chosen: before him
  alternatives:
  - before his presence
  - in front of him
  lexicon: HALOT
  rationale: This prepositional phrase indicates presentation in the presence of the Ancient of Days. 'Before him' is concise and accurate.
- source_word: הַקְרְבוּהִי
  chosen: they brought him near
  alternatives:
  - they presented him
  - he was brought near
  lexicon: WLC/OSHB; CAL; named Greek-version comparison
  rationale: The causative perfect has plural masculine agents and a singular masculine object. They brought him near preserves that agency without naming angels or another giver. The consulted TH passive and selected OG attendants-present clauses are distinct versional constructions, not proof of the same source wording.
