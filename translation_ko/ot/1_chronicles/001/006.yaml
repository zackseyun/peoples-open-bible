  text: 고멜의 아들들은 아스그나스와 디밧과 도갈마입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 창세기 10:3의 평행 족보에는 ‘리밧’이 나오지만, 이곳 역대기의 히브리 본문은 ‘디밧’으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: ~의 아들들은
  alternatives_korean:
  - ~의 자녀들은
  - 그리고 ~의 아들들은
  lexicon: WLC
  rationale: 족보 문맥에서 בְּנֵי는 표준적으로 ‘아들들’로 옮기는 것이 가장 직접적이며, 목록 구조를 드러내기 위해 한국어에서는 주어 뒤에 서술을 두었습니다.
- source_word: גֹּמֶר
