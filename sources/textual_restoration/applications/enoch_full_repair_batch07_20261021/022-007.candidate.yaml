translation:
  text: He answered me, saying, “This is the spirit that came out of Abel, whom his brother Cain killed. It accuses
    him until his offspring is destroyed from the face of the earth and his offspring disappears from the descendants
    of humanity.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected text brackets and said to me as a doublet of saying (Charles printed58 note6); English represents
      the speech once. Abel is the source of the spirit, Cain the killer and target of its accusation; the repeated
      his offspring refers to Cain in this interpretation. Charles marks the came out wording as an emendation (printed58
      note7); the chosen critical wording is retained without claiming independent manuscript confirmation.
    reason: textual_variant
