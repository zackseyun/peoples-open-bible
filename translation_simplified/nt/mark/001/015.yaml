translation:
  language: en
  text: Jesus said, “The appointed time has come, and the kingdom of God[a] is near. Reorient toward God[c] and believe in the good news[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “the reign of God.”
    reason: lexical_alternative
  - marker: b
    text: Or, “believe in the gospel.”
    reason: lexical_alternative
  - marker: c
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and saying
  simplified_phrase: Jesus said
  preserved_meaning: Jesus remains the speaker, and the participle still continues the preceding narrative.
  reasoning_layer_used: Immediate context and POB lexical decision for λέγων
  rationale: A simple reporting clause avoids the hanging participle without adding a progressive sense.
- pob_phrase: The time has been fulfilled
  simplified_phrase: The appointed time has come
  preserved_meaning: The decisive time has reached fulfillment and now stands present.
  reasoning_layer_used: POB lexical decisions for καιρός and Πεπλήρωται
  rationale: This states the specific character of the time and its fulfilled arrival in natural English.
- pob_phrase: has drawn near
  simplified_phrase: is near
  preserved_meaning: God’s kingdom has approached and is now near.
  reasoning_layer_used: POB lexical decision for ἤγγικεν
  rationale: The direct present wording clearly conveys the perfect verb’s present result.
interpretive_expansions:
- pob_phrase: The time
  rendering: The appointed time
  claim: The time is the decisive time set for these events, not time in general.
  evidence:
  - The POB lexical rationale says καιρός refers to the decisive or appointed moment.
  confidence: high
  alternatives_preserved:
  - The time
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: “Has come” expresses fulfillment less explicitly than “has been fulfilled.”
    mitigation: “Appointed time” and the completed form “has come” together preserve the fulfilled arrival.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
