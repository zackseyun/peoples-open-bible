  rationale: 음식 관련 분리의 대상을 원문에 맞게 바로잡고, ‘혐오스럽게 여겼습니다’로 ἀπεχθεῖς ἐφαίνοντο의 평가적 의미를 자연스럽게 옮겼습니다. 원문 소유 표현을 그대로 살린 본문에 불필요하고 위치가 어긋난 각주는 삭제했습니다.
