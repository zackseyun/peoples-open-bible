lexical_decisions:
- source_word: λήγοντος ἄρτι
  chosen: just as ... was finishing
  alternatives:
  - had just finished
  - was just ending
  lexicon: LSJ
  rationale: The genitive absolute with ἄρτι marks the action as occurring at the very moment Eleazar's prayer was coming to its close. 'Just as ... was finishing' preserves the immediacy better than a simple pluperfect.
- source_word: προσευχῆς
  chosen: prayer
  lexicon: LSJ
  rationale: Standard rendering for προσευχή in this context; no contextual reason to expand or paraphrase.
- source_word: παρῆγεν
  chosen: came along
  alternatives:
  - passed by
  - proceeded
  lexicon: LSJ
  rationale: παράγω here denotes movement past or along a place. 'Came along' fits natural English while retaining the sense of approach/procession in context.
- source_word: κατὰ τὸν ἱππόδρομον
  chosen: by the hippodrome
  alternatives:
  - along the hippodrome
  - through the racecourse
  lexicon: LSJ
  rationale: κατά with the accusative here is best taken locally, indicating movement in relation to the hippodrome. 'By the hippodrome' is clear and avoids over-specifying whether the movement was inside or alongside it.
- source_word: θηρίοις
  chosen: the beasts
  alternatives:
  - the animals
  - the wild beasts
  lexicon: LSJ
  rationale: In this narrative the animals are the dangerous beasts prepared for execution. 'The beasts' preserves the ominous force without adding words absent from the Greek.
- source_word: παντὶ τῷ τῆς δυνάμεως φρύαγματι
  chosen: all the tumult of his forces
  alternatives:
  - all the blustering of the army
  - all the roaring arrogance of the troops
  lexicon: LSJ
  rationale: φρύαγμα conveys snorting, raging, or boastful uproar; τῆς δυνάμεως refers to the king's military force. 'Tumult' captures the noisy, threatening mass effect in idiomatic English without forcing a single metaphor such as 'snorting' or 'bluster'.
