id: 1CLEM.8.3
reference: 1 Clement 8:3
unit: verse
book: 1 Clement
source:
  edition: Funk 1901 (normalized OCR)
  text: Μετανοήσατε, οἶκος Ἰσραήλ, ἀπὸ τῆς ἀνομίας ὑμῶν· εἶπον τοῖς υἱοῖς τοῦ λαοῦ
    μου· Ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ καὶ ἐὰν ὦσιν πυρρότεραι
    κόκκου καὶ μελανώτεραι σάκκου, καὶ ἐπιστραφῆτε πρὸς με ἐξ ὅλης τῆς καρδίας καὶ
    εἴπητε· Πάτερ, ἐπακούσομαι ὑμῶν ὡς λαοῦ ἁγίου.
  language: Greek
translation:
  text: “Reorient[r1], O house of Israel, away from your lawlessness. I said to the sons of my people, ‘If your sins should be from the earth to heaven, and if they are redder than scarlet and blacker than sackcloth, and you turn to me with your whole heart and say, “Father,” I will listen to you as to a holy people.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
