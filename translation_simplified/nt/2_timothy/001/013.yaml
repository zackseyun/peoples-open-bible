translation:
  language: en
  text: Keep as your pattern the healthy teaching you heard from me. Do this in the faith and love found in Christ Jesus.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “in faithfulness and love.” The word translated “faith” can also mean faithfulness or trust.
    reason: lexical_alternative
  - marker: b
    text: The Greek may instead mean that the teaching itself concerns faith and love in Jesus the Messiah.
    reason: alternative_reading
  - marker: c
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
    reason: lexical_alternative
simplification_decisions:
