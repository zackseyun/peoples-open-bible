source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Καὶ ἀρξάμενοι πρῶτον τοὺς μέλανας κατενοοῦμεν λίθους. καὶ οἷοι ἐκ τῆς οἰκοδομῆς ἐτέθησαν, τοιοῦτοι
    καὶ εὑρέθησαν. καὶ ἐκέλευσεν αὐτοὺς ὁ ποιμὴν ἐκ τοῦ πύργου μετενεχθῆναι καὶ χωρισθῆναι. 2. εἶτα κατενόησε
    τοὺς ἐψωριακότας, καὶ λαβὼν ἐλατόμησε πολλοὺς ἐξ αὐτῶν, καὶ ἐκέλευσε τὰς παρθένους ἆραι αὐτοὺς καὶ
    βαλεῖν εἰς τὴν οἰκοδομήν. καὶ ἦραν αὐτοὺς αἱ παρθένοι καὶ ἔθηκαν εἰς τὴν οἰκοδομὴν τοῦ πύργου μέσους.
    τοὺς δὲ λοιποὺς ἐκέλευσε μετὰ τῶν μελάνων τεθῆναι· καὶ γὰρ καὶ οὗτοι μέλανες εὑρέθησαν. 3. εἶτα κατενόει
    τοὺς τὰς σχισμὰς ἔχοντας καὶ ἐκ τούτων πολλοὺς ἐλατόμησε καὶ ἐκέλευσε διὰ τῶν παρθένων εἰς τὴν οἰκοδομὴν
    ἀπενεχθῆναι· ἐξώτεροι δὲ ἐτέθησαν, ὅτι ὑγιέστεροι εὑρέθησαν. οἱ δὲ λοιποὶ διὰ τὸ πλῆθος τῶν σχισμάτων
    οὐκ ἠδυνήθησαν λατομηθῆναι· διὰ ταύτην οὖν τὴν αἰτίαν ἀπεβλήθησαν ἀπὸ τῆς οἰκοδομῆς τοῦ πύργου. 4.
    εἶτα κατενόει τοὺς κολοβούς, καὶ εὑρέθησαν πολλοὶ ἐν αὐτοῖς μέλανες, τινὲς δὲ σχισμὰς μεγάλας πεποιηκότες·
    καὶ ἐκέλευσε καὶ τούτους τεθῆναι μετὰ τῶν ἀποβεβλημένων. τοὺς δὲ περισσεύοντας αὐτῶν καθαρίσας καὶ
    λατομήσας ἐκέλευσεν εἰς τὴν οἰκοδομὴν τεθῆναι. αἱ δὲ παρθένοι αὐτοὺς ἄρασαι εἰς μέσην τὴν οἰκοδομὴν
    τοῦ πύργου ἥρμοσαν· ἀσθενέστεροι γὰρ ἦσαν. 5. εἶτα κατενόει τοὺς ἡμίσεις λευκούς, ἡμίσεις δὲ μέλανας·
    καὶ πολλοὶ ἐξ αὐτῶν εὑρέθησαν μέλανες. ἐκέλευσε δὲ καὶ τούτους ἀρθῆναι μετὰ τῶν ἀποβεβλημένων. †οἱ
    δὲ λοιποὶ [λευκοὶ] πάντες [εὑρέθησαν καὶ] ἤρθησαν ὑπὸ τῶν παρθένων· λευκοὶ γὰρ ὄντες ἡρμόσθησαν ὑπ᾿
    αὐτῶν [τῶν παρθένων] εἰς τὴν οἰκοδομήν†· ἐξώτεροι δὲ ἐτέθησαν, ὅτι ὑγιεῖς εὑρέθησαν, ὥστε δύνασθαι
    αὐτοὺς κρατεῖν τοὺς εἰς τὸ μέσον τεθέντας· ὅλως γὰρ ἐξ αὐτῶν οὐδὲν ἐκολοβώθη. 6. εἶτα κατενόει τοὺς
    σκληροὺς καὶ τραχεῖς, καὶ ὀλίγοι ἐξ αὐτῶν ἀπεβλήθησαν διὰ τὸ μὴ δύνασθαι λατομηθῆναι· σκληροὶ γὰρ
    λίαν εὑρέθησαν. οἱ δὲ λοιποὶ αὐτῶν ἐλατομήθησαν [καὶ ἤρθησαν ὑπὸ τῶν παρθένων] καὶ εἰς μέσην τὴν οἰκοδομὴν
    τοῦ πύργου ἡρμόσθησαν· ἀσθενέστεροι γὰρ ἦσαν. 7. εἶτα κατενόει τοὺς ἔχοντας τοὺς σπίλους, καὶ ἐκ τούτων
    ἐλάχιστοι ἐμελάνησαν, καὶ ἀπεβλήθησαν πρὸς τοὺς λοιπούς. οἱ δὲ περισσεύοντες λαμπροὶ καὶ ὑγιεῖς εὑρέθησαν·
    καὶ οὗτοι ἡρμόσθησαν ὑπὸ τῶν παρθένων εἰς τὴν οἰκοδομήν· ἐξώτεροι δὲ ἐτέθησαν διὰ τὴν ἰσχυρότητα αὐτῶν.
