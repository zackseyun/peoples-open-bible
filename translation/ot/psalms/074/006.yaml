  from: all its carved work together
  to: all its carved work
  rationale: 'The Hebrew adverb יָחַד (yāḥad) is rendered twice: once by adding ''all'' to the object (''all its carved work'') and again by adding the adverb ''together'' after the object. This is redundant. Furthermore, placing ''together'' immediately before ''with hatchet...'' creates a slight syntactic ambiguity (a ''together with'' construction). Removing the redundant ''together'' streamlines the sentence and resolves the awkwardness, leaving ''all'' to carry the semantic weight of יָחַד, a strategy adopted by several major translations (e.g., NIV, NRSV).'
