reference: Wisdom of Solomon 15:2
source:
  edition: lxx-swete-1909
  text: καὶ γὰρ ἐὰν ἁμάρτωμεν, σοὶ ἐσμεν, εἰδότες σου τὸ κράτος· οὐχ ἁμαρτησόμεθα, εἰδότες ὅτι σοὶ λελογίσμεθα.
  language: Greek
  pages:
