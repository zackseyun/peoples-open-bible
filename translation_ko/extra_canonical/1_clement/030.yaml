base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030.yaml
  text: 'Therefore, since we are a portion of the Holy One, let us do all the things that belong to sanctification, fleeing slander, foul and unclean entanglements, drunkenness, seditions, and detestable desires, loathsome adultery, and hateful pride.


    For God, he says, opposes the proud, but gives grace to the humble.


    Let us therefore cling to those to whom grace has been given from God. Let us clothe ourselves with concord, being humble-minded and self-controlled, keeping ourselves far from every whispering and slander, being justified by works and not by words.


    For he says, “He who says many things shall also hear in reply.” Or does the ready speaker think himself righteous?


    “Blessed is the short-lived one born of woman. Do not become excessive in words.”


    Let our praise be in God and not from ourselves, for God hates those who praise themselves.


    Let the testimony of our good conduct be given by others, just as it was given to our righteous fathers.


    Boldness and arrogance and recklessness belong to those cursed by God; but gentleness and humility and meekness are found among those blessed by God.'
translation:
  language: ko
  text: '그러므로 우리가 거룩한 몫에 속한 자들이니, 성화에 속한 모든 일을 행하며, 비방과 더럽고 부정한 얽힘들과 술 취함과 분열과 혐오스러운 욕망과 역겨운 간음과 미운 교만을 피합시다.


    하나님은 교만한 자들을 대적하시고 겸손한 자들에게 은혜를 주신다고 말씀하십니다.


    그러므로 하나님께 은혜를 받은 이들에게 우리도 굳게 붙어 있고, 한마음을 입으며, 겸손한 마음과 절제를 지니고, 모든 속삭임과 비방에서 자신을 멀리하며, 말이 아니라 행위로 의롭다 하심을 받읍시다.


    그가 말씀하십니다. 「많은 말을 하는 사람은 그에 대한 대답도 듣게 될 것이다.」 말을 쉽게 하는 사람이 자신을 의롭다고 여기겠습니까?


    「여자에게서 난 사람은 복되다. 짧은 생명을 살기 때문입니다. 말로 지나치게 굴지 마십시오.」


    우리의 자랑은 하나님 안에 있어야지 우리 자신에게서 나와서는 안 됩니다. 하나님은 스스로를 자랑하는 자들을 미워하십니다.


    우리의 선한 행실에 대한 증언은 다른 사람들에 의해 주어지게 하십시오. 의로운 우리 조상들에게도 그렇게 주어졌습니다.


    대담함과 오만과 무모함은 하나님께 저주받은 자들에게 속하지만, 온유와 겸손과 순함은 하나님께 복을 받은 자들에게 있습니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἅγια οὖν μερὶς ὑπάρχοντες
  english_pob_choice: since we are a portion of the Holy One
  chosen_korean: 우리가 거룩한 몫에 속한 자들이니
  alternatives_korean:
  - 우리가 거룩한 분의 몫이므로
  - 우리가 거룩한 부분에 속하므로
  lexicon: ἅγιος
  rationale: POB의 ‘portion’ 의미를 살리되, 한국어에서는 ‘몫’이 소유·소속의 감각을 가장 자연스럽게 전달합니다. ‘거룩한 자’보다 원문의 명사구 긴장을 덜 풀어 주는 방식으로 옮겼습니다.
- source_word: τὰ τοῦ ἁγιασμοῦ
  english_pob_choice: the things that belong to sanctification
  chosen_korean: 성화에 속한 모든 일
  alternatives_korean:
  - 성화에 속한 일들
  - 성결에 속한 모든 일
  lexicon: ἁγιασμός
  rationale: 영문 POB의 문법적 반복을 그대로 옮기기보다, 행위 목록과 연결되도록 ‘성화에 속한 모든 일’로 풀었습니다. 전통적 ‘성결’보다 ‘성화’가 여기의 과정적 의미를 더 잘 드러냅니다.
- source_word: καταλαλιάς, μιαράς τε καὶ ἀνάγνους συμπλοκὰς, μέθας τε καὶ νεωτεροποιΐας καὶ βδελυκτὰς ἐπιθυμίας, μυσερὰν μοιχείαν, βδελυκτὴν ὑπερηφανίαν
  english_pob_choice: slander, foul and unclean entanglements, drunkenness, seditions, and detestable desires, loathsome adultery, and hateful pride
  chosen_korean: 비방과 더럽고 부정한 얽힘들과 술 취함과 분열과 혐오스러운 욕망과 역겨운 간음과 미운 교만
  alternatives_korean:
  - 헐뜯음과 더럽고 부정한 얽힘들과 술 취함과 반역과 혐오스러운 욕망과 역겨운 간음과 미운 교만
  - 비방과 더럽고 부정한 다툼들과 술 취함과 혁신과 혐오스러운 욕망과 역겨운 간음과 미운 교만
  lexicon: καταλαλιά / συμπλοκή / νεωτεροποιΐα / μοιχεία / ὑπερηφανία
  rationale: ‘비방’은 κακία 계열보다 이 단어의 헐뜯기 의미를 직접 살렸고, νεωτεροποιΐα는 POB의 ‘seditions’를 따라 ‘분열’로 옮기되 과도한 정치화는 피했습니다. ‘미운 교만’은 ‘hateful pride’의 도덕적 혐오를 강하게 보존합니다.
- source_word: ἔργοις δικαιούμενοι καὶ μὴ λόγοις
  english_pob_choice: being justified by works and not by words
  chosen_korean: 말이 아니라 행위로 의롭다 하심을 받읍시다
  alternatives_korean:
  - 행위로 의롭다 하심을 받고 말로는 아닙시다
  - 말이 아니라 행위로 의롭다 하심을 받으며
  lexicon: δικαιόω
  rationale: 동사형의 공동 권면 구조를 한국어 명령형 청유로 자연스럽게 드러냈습니다. ‘행위’는 ἔργα의 직접 대응이고, ‘말’은 λόγοις의 대조를 유지합니다.
theological_decisions:
- issue: 1 Clement 30의 윤리 권면 어조
  chosen_reading: 공동체 전체를 향한 청유형 권면으로 옮기고, 금지 목록과 덕목 목록의 대조를 선명하게 유지했습니다.
  alternative_readings:
  - 서술형으로 완화해 옮기기
  - 명령형을 강하게 살리기
  rationale: 본문은 교리 진술보다 공동 윤리 훈계를 전개하므로, 한국어에서도 청유형이 공동체적 권면의 힘을 가장 잘 보존합니다.
  doctrine_reference: 교회론/성화
