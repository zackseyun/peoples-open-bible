    prior_rendering: No man crowds his brother
    new_rendering: No one jostles another
    rationale: This is a reciprocal idiom describing non-interference within the advancing force, not a statement about literal brothers.
  - source_phrase: גֶּבֶר בִּמְסִלָּתוֹ יֵלֵכוּן
    prior_rendering: each goes on his own path
    new_rendering: each advances along his own course
    rationale: The context concerns each member's uninterrupted line of advance rather than merely walking along a separate road.
  - source_phrase: וּבְעַד הַשֶּׁלַח יִפֹּלוּ לֹא יִבְצָעוּ
