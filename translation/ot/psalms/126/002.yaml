  meaning: The restored community burst into laughter and joyful cries, and people among the nations acknowledged Yahweh’s great deeds for them.
  meaning_decisions:
  - source_phrase: פִּינוּ וּלְשׁוֹנֵנוּ
    prior_rendering: our mouth ... our tongue
    new_rendering: our mouths ... our tongues
    rationale: The Hebrew uses singular body parts collectively; English plurals convey the community’s shared response naturally without suggesting a single mouth or tongue.
  - source_phrase: רִנָּה
    prior_rendering: joyful shouting
    new_rendering: shouts of joy
    rationale: This gives the jubilant vocal response a more natural poetic expression while retaining its audible exuberance.
