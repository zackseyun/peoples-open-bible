  naturalness: The proposed revision is modern, idiomatic, and appropriately dignified. “हम नाश हो रहे हैं” retains the ongoing imminent-peril sense without the less natural “नाश हुए जा रहे हैं.”
  terminology: “स्वामी” suitably renders Ἐπιστάτα as an authoritative respectful address, and “डाँटा” preserves the force of ἐπετίμησεν. “शान्ति हो गई” refers plainly to the calm of the weather.
  issues:
  - severity: medium
    issue: Aspectual overtranslation in “जगाने लगे और कहने लगे”
    rationale: διήγειραν is aorist (“woke”), while λέγοντες is a participle (“saying”). The Hindi progressive/inceptive forms suggest that they began repeatedly trying to wake and speak, which the Greek does not state.
  - severity: low
    issue: “उठती लहरों” is more specific than κλύδων τοῦ ὕδατος
    rationale: The Greek denotes the water’s surge, swell, or raging motion; it need not denote individual waves. “पानी के उफान” better preserves the broader image. An alternative may be noted in a footnote.
