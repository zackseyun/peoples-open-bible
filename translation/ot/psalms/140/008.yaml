  from: O Yahweh[a], do not grant the desires of the wicked; do not advance his scheme, lest they be exalted[b]. Selah
  to: O Yahweh, do not grant the desires of the wicked; do not let his scheme succeed[a], lest they be exalted[b]. Selah
  rationale: “Do not let his scheme succeed” naturally conveys the negative petition and the likely contextual force of the difficult תפֵק, without implying that Yahweh positively promotes evil. The proposal’s “or they will rise up” weakens the purpose/result relation expressed after the negative imperative and introduces a potentially misleading revolt sense. The plural ירומו should remain plural; “be exalted” fittingly expresses their becoming elevated or triumphant.
