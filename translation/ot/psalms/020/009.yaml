id: PSA.20.9
reference: Psalms 20:9
source:
  edition: WLC
  text: יְהוָ֥ה הוֹשִׁ֑יעָ/ה הַ֝/מֶּ֗לֶךְ יַעֲנֵ֥/נוּ בְ/יוֹם קָרְאֵֽ/נוּ־׃
translation:
  text: O Yahweh, save! May the King[a] answer us when we call.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Understood here as a title for Yahweh. Alternatively, 'O Yahweh, save the king! May he answer us when we call.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  chosen: O Yahweh
  alternatives:
  - O Yahweh
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: הוֹשִׁיעָה
  chosen: save!
  alternatives:
  - give salvation!
  - grant victory!
  lexicon: HALOT
  rationale: Imperative of ישׁע in direct prayer. 'Save!' is the most natural and broad English equivalent, preserving both deliverance and victory connotations without over-specifying.
- source_word: הַמֶּלֶךְ
  chosen: the king
  alternatives:
  - the King
  lexicon: HALOT
  rationale: The Hebrew is the common noun “the king.” Lowercase avoids deciding whether it refers to the human king or functions as a title for God; the alternative construals are documented in the footnote.
- source_word: יַעֲנֵנוּ
  chosen: may ... answer us
  alternatives:
  - let ... answer us
  - will answer us
  lexicon: HALOT
  rationale: Imperfect of ענה can express a jussive-like wish/prayer in context. 'May ... answer us' fits the prayerful parallelism better than a simple future.
- source_word: בְיוֹם
  chosen: in the day
  alternatives:
  - on the day
  - when
  lexicon: HALOT
  rationale: A relatively formal but still natural rendering that preserves the temporal idiom and poetic cadence. 'When' would be smoother but less formally transparent.
- source_word: קָרְאֵנוּ
  chosen: we call
  alternatives:
  - we cry out
  - our calling
  lexicon: HALOT
  rationale: From קרא, 'call' is the basic sense and suits prayer language. 'Cry out' is possible but adds emotional intensity not explicit in the verb itself here.
- source_word: בְיוֹם קָרְאֵנוּ
  chosen: when we call
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The Hebrew literally says “in the day of our calling,” an ordinary temporal idiom naturally rendered “when we call” in modern English.
