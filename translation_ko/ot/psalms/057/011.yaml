    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …이기 때문입니다
  - …이므로
  lexicon: HALOT
  rationale: 시편의 앞선 찬양을 받치는 이유절로서, 현대 한국어에서는 ‘이는 … 때문입니다’가 원인·근거를 자연스럽게 드러냅니다.
- source_word: חַסְדֶּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 인자하심
  alternatives_korean:
  - 주의 변함없는 사랑
  - 주의 언약적 사랑
  - 주의 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충성·자비·지속성을 함께 담는 한국어로, 전통적 교회어인 ‘인자하심’이 가장 간결하게 근거 의미를 살립니다.
- source_word: גָדֹל עַד שָׁמַיִם
  english_pob_choice: is great to the heavens
  chosen_korean: 하늘에까지 크시고
  alternatives_korean:
  - 하늘에까지 크며
  - 하늘만큼 크시고
  - 하늘에 이르도록 크시고
  lexicon: HALOT
  rationale: ‘크다’의 서술형을 유지하면서 ‘עַד’의 도달 범위를 ‘까지’로 살려, 하늘을 향한 수직적 확장 이미지를 자연스럽게 표현했습니다.
- source_word: אֲמִתֶּךָ
  english_pob_choice: your faithfulness
  chosen_korean: 주의 진실하심
  alternatives_korean:
  - 주의 신실하심
  - 주의 성실하심
  - 주의 진리
  lexicon: HALOT
  rationale: 하나님의 חֶסֶד와 평행을 이루는 אֱמֶת는 추상적 ‘진리’보다 관계적·언약적 신뢰성을 가리키므로, 한국어에서는 ‘진실하심’이 가장 균형 있게 대응합니다.
theological_decisions:
- issue: חֶסֶד와 אֱמֶת의 평행 구조를 한국어에서 어떻게 보존할지
  chosen_reading: ‘주의 인자하심’과 ‘주의 진실하심’을 대응시켜, 하나님의 언약적 사랑과 신실성을 함께 드러냈습니다.
  alternative_readings:
  - ‘주의 사랑’과 ‘주의 진리’
  - ‘주의 언약적 사랑’과 ‘주의 신실하심’
  rationale: 이 절은 하나님의 성품을 추상 명제가 아니라 언약적 신뢰의 관계 언어로 찬양하므로, 전통적으로도 익숙하면서 본문 의미를 해치지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
