  source_fidelity: 원문의 포위 지속 기간, 아시리아 군세의 구성, 그리고 베툴리아 주민들의 물 저장 용기가 고갈된 사실은 대체로 충실히 반영되었습니다. 다만 한국어에서 ‘물독이 바닥났습니다’는 용기 자체가 소진된다는 뜻으로도 읽힐 수 있으므로, 원문이 가리키는 용기 안의 물이 비었음을 더 분명히 하는 편이 안전합니다.
