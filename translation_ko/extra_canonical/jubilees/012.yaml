revisions:
- from: '5[a]. 그것은 손으로 만든 것이기 때문에 그 안에는 영이 없습니다. 그리고 당신은 그것을 어깨에 메고 다닙니다. 그것들은 네게 짐이 되고 큰 수치 외에는 네게 도움이 되지 아니하느니라.

    6. 그것을 만드는 자에게는 수치가 있고 그것을 숭배하는 자에게는 마음의 혼란이 있느니라. 그것들을 섬기지 말라." 그 아버지가 그에게 이르되, "내 아들아 나도 알거니와 나를 세운 백성을 위하여 내가 어찌하리요."

    7. 그 전에는? 내가 그들에게 옳게 말하면 그들이 나를 죽이리니 이는 그들의 혼이 그들에게 달라붙음이라

    8. 그리하여 그들에게 경배하고 찬양하게 하여라. 내 아들아, 그들이 너를 죽일까 두려워하라.” 그리고 그는 말했습니다.

    9. 이 일을 그의 두 형제에게 돌리니 그들이 그에게 화를 내매 그가 잠잠하니라. 마흔째 희년 곧 둘째 주 곧 일곱째 해에 아브람이 아내를 취하였으니 그 이름은 사래라 그 이름은 사래라

    10. 그의 아버지이며 그 여자가 그의 아내가 되었느니라 그 형 아란이 셋째 주 셋째 해에 아내를 맞이하였더니 그가 이번 주의 일곱째 해에 그에게 아들을 낳으매 그가 이름을 짓고

    11. 그의 이름은 롯. 그리고 그의 동생 나홀이 아내를 맞이했습니다.

    12. 아브람이 육십 세가 되던 해, 곧 넷째 주, 곧 넷째 해에 아브람이 밤에 일어나 우상들의 집을 불살랐고 그 집에 있는 모든 것을 불살랐으나 그것을 아는 사람이 없었더라.

    13. 그들은 밤에 일어나 그들의 신들을 불 가운데서 구출하려고 했습니다. 그리고 아란은 달렸다

    14. 그들을 구원하려 하였더니 불이 그 위에 붙어서 불에 타서 갈대아 우르에서 죽으니라

    15. 그의 아버지 데라 앞에서. 그리고 그를 갈대아 우르에 장사하였습니다. 데라가 그 아들들과 함께 갈대아 우르에서 나가서 레바논 땅과 가나안 땅으로 가고자 하더니 하란 땅에 거하였고 아브람은 그 아비 데라와 함께 하란에 거하니라

    16. 2주. 다섯째 해 여섯째 주에 아브람이 일곱째 달 초에 밤새도록 앉아서 저녁부터 새벽까지 별들을 관찰하여 그 해의 비에 대하여 어떻게 되는가를 알아보고자 하였더라. 그가 거기 혼자 앉아서 지켜보고 있을 때, 그의 마음속에 한 말씀이 떠올라 말했습니다.

    17. 별의 모든 이적과 일월의 이적은 다 주님의 손에 있느니라 왜 계속 검색해야 합니까?

    18. 하나님이 원하시면 아침저녁으로 비를 내리시며 그리고 그가 원하더라도 그것을 무너뜨리지 않을 것입니다. 그리고 모든 것이 그의 손에 달려있습니다."

    19. 그가 그 밤에 기도하여 이르되 나의 하나님, 지극히 높으신 하나님, 당신만이 나의 하나님이시니 당신께서 모든 것을 창조하셨고 존재하는 모든 것이 당신 손으로 지으신 것이니이다. 나는 당신과 당신의 호의를 선택했습니다.

    20. 사람의 마음의 생각을 주관하는 악령의 손에서 나를 구원하시고, 나의 하나님이여, 그들이 나로 하여금 당신을 따르지 못하게 하시고, 나와 내 자손을 영원히 견고하게 하여 우리가 이제부터 영원히 그릇되지 않게 하라.”

    21. 예수께서 이르시되 내가 그들에게로 돌아가려고 내 얼굴을 구하는 갈대아 우르로 돌아가리이까 아니면 여기 이 곳에서 무엇을 해야 할까요? 나의 하나님이여, 나의 의로운 길을 주의 앞에 곧게 하사 주의 종의 손으로 이루어지게 하시고 나로 내 마음의 미혹된 길로 행하지 않게 하소서 하시고 말하기를 마치시고 기도를 마치시매 사람을 보내심을 받아

    22. 주님의 말씀이 내 손으로 그에게 임하여 이르시되 너는 너의 본토 친척과 아버지 집을 떠나 내가 네게 지시할 땅으로 가라 내가 너로 크고 많은 나라를 이루게 하리라 하신지라

    23. 내가 네게 복을 주어 네 이름을 창대하게 하리니 너는 땅에서 복을 받을 것이요, 땅의 모든 족속이 너로 말미암아 복을 얻을 것이라. 그리고 너를 축복하는 자에게는 내가 축복하고 너를 저주하는 자에게는 내가 저주할 것이다.

    24. 그리고 나는 너와 네 아들, 네 손자, 네 모든 자손의 하나님이 될 것이다. 지금부터 영원까지 땅의 대대에 두려워하지 말라. 나는 너희 하나님이다.” 그리고 주 하나님께서 나에게 말씀하셨다.

    25. 그 입과 귀를 열어서 나타나는 언어로 듣고 그 입으로 말할 수 있게 하라. 이는 멸망하는 날부터 모든 사람의 입에서 그것이 없어졌음이니라.

    26. 그리고 나는 그의 입과 그의 귀와 그의 입술을 열고 히브리어로, 곧 창조의 언어로 그와 말하기 시작했습니다. 그리고 그는 그의 조상들의 책들을 가져다가 히브리어로 기록하여 복사하고 그때부터 연구하기 시작했습니다. 그리고 나는 그가 이해할 수 없는 모든 것을 그에게 알려 주었고, 그는 6개월 동안 우기 동안 그것을 공부했습니다.'
