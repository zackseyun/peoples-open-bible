  yaml_path: translation/ot/psalms/075/005.yaml
  text: Do not lift up your horn on high[b]; do not speak with an arrogant neck[a].
  footnotes:
  - marker: a
    text: Or 'do not speak with an insolent neck' / 'do not speak stiff-neckedly.' The Hebrew preserves a bodily metaphor for proud defiance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your horn' is a metaphor for strength, power, or self-exaltation.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분의 뿔을 높이 들지 마십시오. 거만한 목으로 말하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 ‘뿔’은 힘, 권세 또는 자기 과시를 가리키는 은유입니다. ‘거만한 목으로’는 교만하고 도전적인 태도를 나타내는 신체 은유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלְלִים
  english_pob_choice: the boastful
  chosen_korean: 오만한 자들
  alternatives_korean:
  - 자랑하는 자들
  - 교만한 자들
  - 허풍떠는 자들
  lexicon: HALOT
  rationale: 문맥상 הלל 계열의 ‘자기 과시/자랑’ 의미를 살려, 원문의 도덕적 대상을 드러내는 ‘오만한 자들’로 옮겼습니다.
- source_word: אַל תָּהֹלּוּ
  english_pob_choice: Do not boast
  chosen_korean: 오만하지 말라
  alternatives_korean:
  - 자랑하지 말라
  - 허세부리지 말라
  - 교만하지 말라
  lexicon: HALOT
  rationale: 앞의 ‘오만한 자들’과 어근 연결을 살리면서, 한국어에서 가장 자연스럽고 직접적인 금지형으로 옮겼습니다.
- source_word: קָרֶן
  english_pob_choice: the horn
  chosen_korean: 뿔
  alternatives_korean:
