  yaml_path: translation/ot/psalms/009/003.yaml
  text: When my enemies turn back, they stumble and perish before you.[a]
  footnotes:
  - marker: a
    text: Or 'I will be glad and rejoice in you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Most High,' a divine title for God.
