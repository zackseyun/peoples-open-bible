review_pass:
  verdict: revise
  source_fidelity: 원문의 핵심 의미는 대체로 잘 전달합니다. 다만 πρᾶξιν ... τὴν πονηράν은 ‘이 악한 일’을 뜻하며, 원문에는 ‘불법한’에 해당하는 말이 없습니다. 또한 ἐπιθάλπουσα는 선물과 온갖 즐거움으로 환심을 사거나 달래려 하는 지속적 행동을 나타냅니다.
  naturalness: 합쇼체는 일관되지만, ‘너를 내 남편으로 맞이하겠습니다’는 화자가 상대를 남편으로 ‘맞이한다’는 뜻으로 다소 어색합니다. ‘너를 내 남편으로 삼겠습니다’가 자연스럽고 원뜻에 맞습니다. 본문 끝의 [a][b]는 대응 주석이 없어 제거해야 합니다.
  terminology: ‘간음하기’, ‘독으로’, ‘하나님 앞에서 부끄러워하십시오’, ‘계책’은 문맥과 현대 표준어에 적절합니다. γύναι는 ‘여인이여’로 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘불법하고 악한 일’에 ‘불법한’이라는 원문에 없는 의미가 추가됨
    rationale: 그리스어는 πρᾶξιν ταύτην τὴν πονηράν(‘이 악한 행위/일’)이며, 이 구절에는 ‘불법한’을 뒷받침하는 형용사가 없습니다. 영어 감사본의 ‘lawless’도 그리스어보다 확장된 표현이므로, 원문 우선 원칙에 따라 제거하는 것이 안전합니다.
  - severity: low
    issue: ‘너를 내 남편으로 맞이하겠습니다’의 어색한 결합
    rationale: λήψομαί σε εἰς ἄνδρα는 상대를 자신의 남편으로 삼겠다는 뜻입니다. 한국어에서는 ‘남편으로 삼겠습니다’가 자연스럽습니다.
  - severity: medium
    issue: 본문의 [a][b] 표지에 대응하는 주석이 없음
    rationale: 제시된 translation_notes 및 주석 자료에 해당 표지의 내용이 없으므로, 독자에게 불완전한 주석 구조를 남깁니다. 표지를 삭제해야 합니다.
