theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Nature of forgiveness expressed by הֶעֱבִיר חַטָּאתְךָ
  chosen_reading: The LORD has taken away your sin
  alternative_readings:
  - The LORD has put away your sin
  - The LORD has caused your sin to pass over
  rationale: The text states divine removal of David's sin and consequent sparing from death, but it does not explain the mechanism of atonement here. The translation preserves that theological tension by rendering the removal plainly without importing later doctrinal categories.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
