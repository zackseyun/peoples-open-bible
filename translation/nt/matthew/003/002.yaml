id: MAT.3.2
reference: Matthew 3:2
source:
  edition: SBLGNT
  text: ⸀καὶ λέγων· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
translation:
  text: and saying, “Repent[c][a], for the kingdom of heaven has drawn near[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repent calls for changed disposition and conduct in response to the kingdom proclamation, not merely regret or a different opinion.
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'the kingdom of the heavens has come near.'
    reason: lexical_alternative
  - marker: c
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  chosen: and
  alternatives:
  - while
  - then
  lexicon: BDAG
  rationale: Standard coordinating conjunction linking this participial clause to the preceding narrative. 'And' is the most natural and sufficiently formal rendering.
- source_word: λέγων
  chosen: saying
  alternatives:
  - preaching
  - proclaiming
  lexicon: BDAG
  rationale: Present active participle of λέγω, modifying the implied subject from the previous verse. 'Saying' preserves the participial form and avoids importing the more specific idea of heralding unless context explicitly requires it.
- source_word: Μετανοεῖτε
  chosen: Repent
  alternatives:
  - Reorient toward God
  - Change your thinking
  - Repent
  - Change your mind
  - Rethink everything
  - Turn back
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Restore Repent in the kingdom summons. Remove the old claim that a supplied Godward phrase was the reader wording; retain a contextual explanation. Contextual editorial assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: ἤγγικεν
  chosen: has drawn near
  alternatives:
  - is near
  - has come near
  lexicon: BDAG
  rationale: 'Perfect active indicative of ἐγγίζω. ''Has drawn near'' best reflects the perfect aspect: the kingdom has approached and is now near. It is more aspectually precise than the simple present ''is near.'''
- source_word: γὰρ
  chosen: for
  alternatives:
  - because
  lexicon: BDAG
  rationale: Introduces the ground for the command to repent. 'For' is concise and natural in English proclamation style.
- source_word: ἡ βασιλεία
  chosen: the kingdom
  alternatives:
  - the reign
  - the kingship
  lexicon: BDAG
  rationale: βασιλεία can denote reign/rule or kingdom. In Matthew's formulaic expression, 'the kingdom' is the most idiomatic English rendering and preserves the broad semantic range of God's royal rule and realm without over-narrowing to abstraction.
- source_word: τῶν οὐρανῶν
  chosen: of heaven
  alternatives:
  - of the heavens
  lexicon: BDAG
  rationale: Genitive plural literally 'of the heavens,' but Matthew's Jewish reverential circumlocution is conventionally and accurately rendered 'of heaven' in idiomatic English. This preserves meaning without awkward literalism.
