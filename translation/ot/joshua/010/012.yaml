  to: Then Joshua spoke to Yahweh on the day Yahweh handed the Amorites over to the Israelites. In the presence of Israel he said, “Sun, stand still over Gibeon; moon, over the Valley of Aijalon.”
  rationale: I retain the established “stand still” because verse 13 confirms the cessation described, without explaining its physical mechanism. The earlier spatial and national renderings prioritized source form; the revisions clarify delivery into Israel's power and preserve the command's poetic parallelism.
