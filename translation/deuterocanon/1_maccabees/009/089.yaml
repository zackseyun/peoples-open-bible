  from: a gold buckle[a], as is customary to give to the kinsmen of kings[b]; and he gave him Accaron and all its territories as an inheritance.
  to: of gold, such as was customarily given to royal Kinsmen[a]. He also gave him Ekron and all its territory as a hereditary possession.
  rationale: The earlier lexical decisions preserve the courtly gift and hereditary grant but describe Kinsmen as family relations and supply a different noun for the same clasp. I retain the inheritance meaning, clarify the court title, and use the recognizable English name Ekron.
