  rationale: 주어진 WLC 본문을 처음부터 다시 번역했습니다. 첫 절은 적대자들이 화자의 재앙의 날에 그를 맞선 일을, 둘째 절은 그와 대조하여 야훼께서 그를 지탱하고 의지가 되어 주신 일을 나타냅니다. יְקַדְּמוּנִי의 문맥상 적대적 뉘앙스는 ‘맞섰다’로 옮기되, 더 문자적인 대안은 각주로 남겼습니다. 기존 본문 및 각주는 다른 절의 내용이므로 모두 교체했습니다.
