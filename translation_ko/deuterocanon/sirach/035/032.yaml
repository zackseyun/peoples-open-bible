    issue: Second-person register is inconsistent.
    rationale: ‘네’ is intimate/plain speech, whereas ‘주십시오’ is formal-polite 합쇼체. The required target register calls for ‘당신의’ with the formal imperative.
  - severity: low
    issue: The temporal clause is rendered conditionally and the footnote anchor is placed at the sentence end.
    rationale: ‘죽을 때가 되면’ is natural but introduces a conditional construction where Greek simply gives temporal phrases. Moving the anchor to the life-days completion phrase makes its scope clear, and revising the footnote wording better reflects the Greek construction.
  revised_text: 당신의 생애의 날들이 다 차는 날에[a], 죽을 때에 유산을 분배하십시오.
