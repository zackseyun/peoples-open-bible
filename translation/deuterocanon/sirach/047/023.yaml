translation:
  text: God gave Jacob a remnant and the house of David a root from David's line[a]. Solomon rested with his fathers[b] and left behind an heir[c].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'a root from him'; the root represents the continuing Davidic dynasty.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word is uncertain and may mean 'worn out' or 'aged'; 'with his fathers' follows the Greek.
    reason: textual_variant
  - marker: c
    text: The Hebrew term is uncertain but refers here to an heir from Solomon's own line.
    reason: lexical_alternative
lexical_decisions:
- source_word: שארית / κατάλιμμα
  chosen: a remnant
  alternatives:
  - what remains
  - survivors
  - a remainder
  lexicon: HALOT; BDAG
  rationale: Both the Hebrew שארית and Greek κατάλιμμα denote what is left over or preserved. 'Remnant' is the most natural biblical-English rendering and preserves the covenantal/dynastic nuance of a surviving line.
- source_word: שורש / ῥίζαν
  chosen: a root
  alternatives:
  - a rootstock
  - a descendant line
  lexicon: HALOT; BDAG
  rationale: The Hebrew שרש and Greek ῥίζα both literally mean 'root.' Here it is metaphorical for dynastic continuation from David through Solomon. 'Root' keeps the image rather than flattening it into interpretation.
- source_word: וישכב ... / ἀνεπαύσατο
  chosen: lay down with his fathers
  alternatives:
  - rested with his fathers
  - fell asleep with his fathers
  lexicon: HALOT; BDAG
  rationale: The Hebrew idiom וישכב with reference to death is well represented by 'lay down with his fathers.' The Greek parallel only preserves 'rested ... with the fathers,' supporting the death idiom. This rendering keeps the Hebrew flavor while remaining understandable.
- source_word: מיושש
  chosen: with his fathers
  alternatives:
  - worn out
  - aged
  - exhausted
  lexicon: HALOT
  rationale: The Hebrew form in Kahana is textually difficult and the verse is marked major_mismatch. The Greek parallel reads μετὰ τῶν πατέρων, strongly supporting a Vorlage meaning 'with his fathers' rather than an adjective such as 'aged' or 'worn out.' The translation therefore follows the better-supported sense while acknowledging uncertainty in a footnote.
- source_word: מנון
  chosen: one of his offspring
  alternatives:
  - an heir
  - a descendant
  - a son
  lexicon: HALOT
  rationale: The Hebrew term is uncommon/uncertain in this form, but context clearly points to a successor from Solomon's line. 'One of his offspring' is broad enough to reflect the lexical uncertainty while fitting the dynastic context. It avoids overcommitting to 'son' if the text is less specific.
