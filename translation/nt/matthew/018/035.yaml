  meaning: Jesus warns that his heavenly Father will likewise judge disciples who do not sincerely forgive one another.
  meaning_decisions:
  - source_phrase: Οὕτως καὶ ὁ πατήρ μου ὁ οὐράνιος ποιήσει ὑμῖν
    prior_rendering: So also my heavenly Father will do to you
    new_rendering: My heavenly Father will do the same to you
    rationale: The comparison explicitly points back to the master's action; 'do the same' completes the English expression while preserving the warning's gravity.
  - source_phrase: ἐὰν μὴ ἀφῆτε ἕκαστος
    prior_rendering: if each of you does not forgive
    new_rendering: unless you each forgive
    rationale: The obligation applies individually to every hearer; 'unless you each' avoids an English reading in which the warning applies only if everyone fails.
  - source_phrase: τῷ ἀδελφῷ αὐτοῦ
    prior_rendering: his brother
    new_rendering: your brother or sister
    rationale: The representative masculine refers to a fellow disciple, not only a male believer; the new wording preserves the family image and keeps the second-person address consistent.
