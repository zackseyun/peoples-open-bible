- source_word: בְחֶסֶד אֱלֹהִים
  english_pob_choice: in the steadfast love of God
  chosen_korean: 하나님의 변함없는 사랑
  alternatives_korean:
  - 하나님의 인자하심
  - 하나님의 신실한 사랑
