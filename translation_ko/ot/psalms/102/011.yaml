- source_word: וְקִצְפֶּךָ
  english_pob_choice: and your wrath
  chosen_korean: 진노
  alternatives_korean:
  - 노여움
  - 격노
  lexicon: HALOT
  rationale: קֶצֶף의 강한 심판적 분노 뉘앙스를 살리기 위해 ‘진노’를 사용해 앞의 ‘분노’와 구별했습니다.
- source_word: נְשָׂאתַנִי / וַתַּשְׁלִיכֵנִי
  english_pob_choice: you have lifted me up and cast me away
  chosen_korean: 저를 들어 올리셨다가 내던지셨습니다
  alternatives_korean:
  - 저를 들어 올리셨다가 버리셨습니다
