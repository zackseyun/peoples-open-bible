reference: Psalms 57:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ע֤וּרָ/ה כְבוֹדִ֗/י ע֭וּרָֽ/ה הַ/נֵּ֥בֶל וְ/כִנּ֗וֹר אָעִ֥ירָה שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/009.yaml
  text: I will give thanks to you among the peoples[a], Lord; I will sing praise to you among the nations.
  footnotes:
  - marker: a
    text: Or 'my soul' or 'my whole being' for 'my glory,' a poetic self-reference.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew names two ancient stringed instruments; exact modern equivalents are uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 주님, 내가 민족들 가운데서 주께 감사드리며, 나라들 가운데서 주를 찬양하여 노래하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주를 찬양하겠습니다.’ 히브리어 동사는 ‘노래하다, 음악으로 찬양하다’라는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרָה
  english_pob_choice: Awake!
  chosen_korean: 깨어나십시오
  alternatives_korean:
  - 일어나십시오
  - 깨십시오
  - 잠에서 깨십시오
  lexicon: HALOT
  rationale: 직접적인 각성 명령을 현대 합쇼체로 옮기되, 시적이고 격조 있는 어감을 살리기 위해 '깨어나십시오'를 선택했습니다.
- source_word: כְבוֹדִי
  english_pob_choice: my glory
  chosen_korean: 나의 영광이여
  alternatives_korean:
  - 나의 혼이여
  - 나의 온 존재여
  - 나의 존귀함이여
  lexicon: HALOT
  rationale: 히브리어의 직역인 '나의 영광'을 유지하여 시적 자기지시의 긴장을 보존했고, 호격으로 처리해 원문의 부름을 자연스럽게 살렸습니다.
- source_word: הַנֵּבֶל וְכִנּוֹר
  english_pob_choice: harp and lyre
  chosen_korean: 수금과 비파
  alternatives_korean:
  - 하프와 류트
  - 거문고와 비파
  - 수금과 류트
  lexicon: HALOT
  rationale: 두 고대 현악기의 정확한 현대 대응어는 불확실하므로, 한국어 성경에서 널리 통용되는 전통적 명칭을 사용해 두 악기의 구별을 유지했습니다.
- source_word: אָעִירָה שָּׁחַר
  english_pob_choice: I will awaken the dawn
  chosen_korean: 내가 새벽을 깨우겠습니다
  alternatives_korean:
  - 내가 새벽을 일으키겠습니다
  - 내가 새벽을 깨우겠습니다
  lexicon: HALOT
  rationale: 사역적 뉘앙스를 살려 '새벽을 깨우다'로 옮겼고, 미래/의지형의 결의를 한국어 합쇼체로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 시편의 의인화된 표현을 얼마나 직접 살릴 것인가
  chosen_reading: '''내가 새벽을 깨우겠습니다''로 번역해 화자의 찬양이 새벽을 깨우는 듯한 시적 과장을 그대로 유지했습니다.'
  alternative_readings:
  - '''내가 새벽을 맞이하겠습니다''처럼 완화된 표현'
  - '''내가 새벽을 깨우리이다''처럼 고전적 종결'
  rationale: 본문은 단순히 시간대를 언급하는 것이 아니라, 찬양의 적극성과 우주적 울림을 의인화로 드러내므로 그 긴장을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 시적 의인화 보존
- issue: כְבוֹדִי의 자기지시를 해석적으로 풀어쓸 것인가
  chosen_reading: 본문에는 '나의 영광'을 유지하고 해석은 주석으로 남기지 않았습니다.
  alternative_readings:
  - '''나의 혼'' 또는 ''나의 온 존재''로 의역'
  - '''나의 명예''로 도덕적 의미화'
  rationale: 히브리 시의 은유를 본문에서 보존하는 것이 우선이며, 해석을 본문에 흡수하면 원문의 다의성과 긴장이 사라집니다.
  doctrine_reference: 히브리 시어의 은유 보존
