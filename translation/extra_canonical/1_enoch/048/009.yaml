translation:
  text: I will put them into the hands of my chosen ones.[a] Like grass in the fire, they will burn before the holy
    ones. Like lead in water, they will sink before the righteous, and no trace of them will be found.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected verse shifts to my chosen ones and I will put. It does not introduce a newly named speaker
      at this point, and none is inserted into the English.
    reason: alternative_reading
  - marker: b
    text: The metal word can cover lead or tin in the primary lexicon; lead is used here in the sinking comparison.
      The fire verb belongs to the heat or burning range, not an unprinted detailed mechanism of annihilation. The
      negative no-trace clause is retained.
    reason: lexical_alternative
