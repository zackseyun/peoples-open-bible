id: JOB.21.19
reference: Job 21:19
source:
  edition: WLC
  text: אֱל֗וֹהַּ יִצְפֹּן לְ/בָנָ֥י/ו אוֹנ֑/וֹ יְשַׁלֵּ֖ם אֵלָ֣י/ו וְ/יֵדָֽע־׃
translation:
  text: You say, “God stores up a man’s punishment for his sons.” Let God repay it to the man himself, so that he experiences it.
  philosophy: dynamic
lexical_decisions:
- source_word: אֱל֗וֹהַּ
  chosen: God
  alternatives:
  - God Almighty
  - God
  lexicon: HALOT
  rationale: אֱלוֹהַּ is the common singular term for God in Job. 'God' is the natural English equivalent and avoids importing nuances not explicit in the form itself.
- source_word: יִצְפֹּן
  chosen: stores up
  alternatives:
  - lays up
  - reserves
  - hides away
  lexicon: HALOT
  rationale: The verb צפן commonly carries the sense of storing up or reserving. In this context, Job is voicing and rejecting the idea that punishment is reserved for a man's children; 'stores up' communicates that sense clearly in modern English.
- source_word: לְבָנָיו
  chosen: for his sons
  alternatives:
  - for his children
  lexicon: HALOT
  rationale: The Hebrew is explicitly masculine plural 'sons.' Per the gender-accurate policy, the translation preserves the masculine form rather than neutralizing it to 'children,' though the broader sense may include descendants in context.
- source_word: אוֹנוֹ
  chosen: a man's punishment
  alternatives:
  - his iniquity
  - his trouble
  - his wealth
  lexicon: HALOT
  rationale: The stored consequence that might fall on the man’s sons is his punitive trouble, not the act of wrongdoing itself.
- source_word: יְשַׁלֵּם
  chosen: let him repay
  alternatives:
  - he will repay
  - let him pay back
  lexicon: HALOT
  rationale: 'The verb שׁלם in the Piel means to repay or requite. In context, this is best taken jussively as Job''s corrective retort: not ''God stores up...'' but ''Let him repay...'' This fits the argumentative flow and the following clause.'
- source_word: אֵלָיו
  chosen: to the man himself
  alternatives:
  - to him
  - upon him
  lexicon: HALOT
  rationale: The pronoun refers back to the wicked man. 'To him' is literal, but 'to the man himself' makes the contrast with 'his sons' explicit in natural English without adding a new idea.
- source_word: וְיֵדָע
  chosen: so that he may know it
  alternatives:
  - and he will know
  - that he may feel it
  lexicon: HALOT
  rationale: 'ידע means ''know.'' The conjunction plus imperfect here expresses result/purpose in context: repayment should come to the man himself so that he experiences and knows it. Adding ''it'' makes the English idiomatic while preserving the implied object.'
- source_word: יְשַׁלֵּם אֵלָיו
  chosen: Let him repay it to the man himself
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Keeps the punishment as the object of requital and explicitly preserves the contrast between the offender and his sons.
