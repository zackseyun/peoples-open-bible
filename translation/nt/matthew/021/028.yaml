  from: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
  to: “But what do you think? A man had two sons. He went to the first and said, ‘Son, go and work in the vineyard today.’
  rationale: The earlier rationale preferred “children” because τέκνα is lexically broader, but the masculine references to each child in verses 29–30 identify sons in this narrative. I follow that contextual evidence rather than the noun’s range in isolation.
