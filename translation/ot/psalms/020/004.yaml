id: PSA.20.4
reference: Psalms 20:4
source:
  edition: WLC
  text: יִֽתֶּן לְ/ךָ֥ כִ/לְבָבֶ֑/ךָ וְֽ/כָל עֲצָתְ/ךָ֥ יְמַלֵּֽא־־׃
translation:
  text: May he grant you what your heart desires and fulfill all your plans.
  philosophy: dynamic
lexical_decisions:
- source_word: יִתֶּן
  chosen: May he grant
  alternatives:
  - May he give
  - He will grant
  lexicon: HALOT
  rationale: נתן commonly means 'give.' In this blessing/prayer context, English 'grant' better conveys a wished-for bestowal. The yiqtol is rendered jussively as 'May he grant,' matching the surrounding benedictory sense of the psalm.
- source_word: לְךָ
  chosen: you
  alternatives:
  - to you
  lexicon: HALOT
  rationale: The indirect object is naturally expressed in English as 'you' after 'grant'; 'grant to you' is possible but less idiomatic.
- source_word: כִלְבָבֶךָ
  chosen: according to your heart
  alternatives:
  - as your heart desires
  - according to your desire
  lexicon: HALOT
  rationale: Literally 'according to your heart.' Retaining 'heart' preserves the Hebrew anthropological expression for inner desire, will, or intention, while 'according to' reflects the prefixed כ.
- source_word: וְכָל
  chosen: and all
  alternatives:
  - and every
  lexicon: HALOT
  rationale: A straightforward rendering of the conjunction plus כל. 'All' is idiomatic with the following singular collective noun in English.
- source_word: עֲצָתְךָ
  chosen: your plans
  alternatives:
  - your plans
  - your purpose
  lexicon: HALOT
  rationale: Here עֵצָה denotes the addressee’s intended plans or purposes. “Plans” is natural modern English and fits the parallel reference to what is in the addressee’s heart.
- source_word: יְמַלֵּא
  chosen: fulfill
  alternatives:
  - bring to completion
  - make full
  lexicon: HALOT
  rationale: The Piel of מלא here means to fill up in the sense of bringing to full realization. 'Fulfill' is the most natural English equivalent in this context of prayer for success.
