  timestamp: '2026-07-13T08:22:29Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 πιστεύων εἰς ἐμέ(‘나를 믿는’)와 οὐ μὴ ... εἰς τὸν αἰῶνα(강한 영구적 부정)를 자연스럽게 옮겼습니다. 그러나 πᾶς ὁ ζῶν καὶ πιστεύων의 첫 분사 ζῶν(‘살아 있는/사는’)이 번역문에서 빠져, 두 분사로 이루어진 원문의 수식 구조가 완전히 반영되지 않았습니다.
  naturalness: ‘살아 있으면서 나를 믿는 사람은 누구나’는 현대 표준 한국어로 자연스럽고, 원문의 병렬 분사를 드러냅니다. ‘이것을 믿습니까?’는 마르다에게 하는 직접 질문으로 간결하며 합쇼체에 맞습니다.
  terminology: ‘나를 믿는’, ‘영원히 죽지 않을 것입니다’는 요한복음의 πιστεύω와 εἰς τὸν αἰῶνα를 일관되고 비교파적으로 옮깁니다. 원문에 명시되지 않은 ‘육체적’ 또는 ‘영적’ 죽음의 해석은 본문에 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: ζῶν(‘살아 있는/사는’)의 번역 누락
    rationale: 원문은 ‘살아 있는’과 ‘믿는’이라는 두 현재분사로 대상을 규정합니다. 초안의 ‘나를 믿는 사람은 누구든지’는 후자만 반영하므로, 전자를 포함해야 합니다.
  revised_text: 그리고 살아 있으면서 나를 믿는 사람은 누구나 영원히 죽지 않을 것입니다. 이것을 믿습니까?
