reference: Tobit 11:9
source:
  edition: lxx-swete-1909
  text: Καὶ προσδραμοῦσα Ἄννα ἐπέπεσεν ἐπὶ τὸν τράχηλον τοῦ υἱοῦ αὐτῆς, καὶ εἶπεν αὐτῷ Εἶδόν σε, παιδίον,
  language: Greek
