  yaml_path: translation/extra_canonical/shepherd_of_hermas/055.yaml
  text: 'And he says to me, “Do you see this shepherd?” “I do,” I say, “sir.”[a]


    “Those sheep you saw not skipping but grazing in one place—these are the ones who have handed themselves over to luxuries and deceptions,[b] yet they have not blasphemed the Lord at all.[c] These, then, have been corrupted away from the truth; in them there is hope for repentance, by which they can live.[d] Corruption, then, has hope of a certain renewal,[e] but death has eternal destruction.”[f]


    5. Again we went on a little, and he shows me a great shepherd, as if savage in appearance, wearing a white goatskin,[g] and he had a bag on his shoulders,[h] and a staff very hard and with knots,[i] and a great whip.[j] He had a very bitter look, so that I was afraid of him—such was his look.[k]


    6. This shepherd, then, took over the sheep from the shepherd who was a young man—those that were living profligately and living in self-indulgence, and not skipping—and he cast them into a certain place that was steep, thorny, and full of thistles,[m] so that, because of the thorns and thistles, the sheep were unable to disentangle themselves, but [were entangled in the thorns and thistles; these, then,] being entangled, grazed among the thorns and thistles.[o] They suffered greatly, being beaten by him;[p] he drove them here and there and gave them no rest, and those sheep were not at ease at all.[q]'
translation:
  language: ko
  text: '그리고 그가 제게 말했습니다. “이 목자를 보십니까?” “봅니다, 주인님.”[a]


    “네가 본, 뛰지 않고 한 곳에서 풀을 뜯고 있던 저 양들은, 사치와 속임수에 자신을 내맡긴 사람들이지만, 주님을 조금도 모독하지는 않은 사람들입니다.[b][c] 그러므로 이들은 진리에서 멀어져 타락한 사람들이지만, 그들 안에는 회개하여 살 수 있는 희망이 있습니다.[d] 그러니 부패에도 어떤 새로움의 가능성에 대한 희망이 있지만[e], 죽음에는 영원한 멸망이 있습니다.”[f]


    5. 다시 조금 더 가자 그가 제게 큰 목자를 보여 주었는데, 겉모습은 마치 거칠어 보였고, 흰 염소 가죽을 걸치고 있었으며,[g] 어깨에는 자루가 하나 있었고,[h] 아주 단단하고 마디가 많은 막대기와[i] 큰 채찍을 가지고 있었습니다.[j] 그는 매우 쓰디쓴 표정을 짓고 있어서 제가 그를 두려워할 정도였습니다 — 그의 얼굴은 그러했습니다.[k]


    6. 이 목자는 그 젊은 목자로부터 양들을 넘겨받았는데, 곧 낭비하며 방탕하게 살되 뛰지는 않던 그 양들을, 가파르고 가시투성이이며 엉겅퀴로 가득한 어떤 곳에 던져 넣었습니다.[m] 그래서 가시와 엉겅퀴 때문에 양들이 스스로 풀려날 수 없었고, 오히려 [가시와 엉겅퀴에 얽혀 있었으며; 그러므로] 얽힌 채 가시와 엉겅퀴 사이에서 풀을 뜯었습니다.[o] 그들은 그에게 맞으며 크게 고통받았고,[p] 그는 그들을 이리저리 몰아다니며 조금도 쉬지 못하게 했고, 그 양들은 전혀 편안하지 않았습니다.[q]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βλέπω, φημί, κύριε
  english_pob_choice: “I do,” I say, “sir.”
  chosen_korean: “봅니다, 주인님.”
  alternatives_korean:
  - “봅니다, 주님.”
  - “알고 있습니다, 주인님.”
  lexicon: κύριε
  rationale: 환시 장면의 응답으로서 1인칭 현재형을 살리고, English POB의 sir에 맞춰 대화 상대에 대한 공손한 호칭을 ‘주인님’으로 옮겼습니다.
- source_word: παραδεδωκότες μὲν ἑαυτοὺς ταῖς τρυφαῖς καὶ ἀπάταις
  english_pob_choice: have handed themselves over to luxuries and deceptions
  chosen_korean: 사치와 속임수에 자신을 내맡긴
  alternatives_korean:
  - 향락과 속임수에 자신을 내맡긴
  - 사치와 기만에 자신을 넘긴
  lexicon: τρυφαῖς / ἀπάταις
  rationale: τρυφαί의 ‘luxuries’를 단순 호사보다 윤리적 타락의 뉘앙스를 살려 ‘사치’로, ἀπάταις는 ‘deceptions’에 맞춰 ‘속임수’로 옮겼습니다.
- source_word: κατεφθαρμένοι ... ἐλπίς ἐστι μετανοίας ... ἀνανεώσεώς τινος
  english_pob_choice: have been corrupted away from the truth ... there is hope for repentance ... hope of a certain renewal
  chosen_korean: 진리에서 멀어져 타락한 ... 회개하여 살 수 있는 희망 ... 어떤 새로움의 가능성에 대한 희망
  alternatives_korean:
  - 진리에서 타락한 ... 회개의 희망 ... 어떤 회복의 희망
  - 진리에서 부패한 ... 회개할 희망 ... 어떤 새로워짐의 희망
  lexicon: κατεφθαρμένοι / μετανοίας / ἀνανεώσεως
  rationale: POB의 ‘corrupted away from the truth’를 따라 방향성을 드러냈고, ἀνανεώσις는 단순 회복보다 ‘renewal’의 갱신성을 살려 ‘새로움의 가능성’으로 풀었습니다.
- source_word: δάμανον / περίπικρον / λίαν ἐταλαιπώρουν δαιρόμενα
  english_pob_choice: very bitter look ... They suffered greatly, being beaten by him
  chosen_korean: 매우 쓰디쓴 표정 ... 그에게 맞으며 크게 고통받았고
  alternatives_korean:
  - 매우 매서운 표정 ... 그에게 심하게 맞아 고생했고
  - 몹시 잔인한 표정 ... 그에게 얻어맞으며 크게 고통받았고
  lexicon: περίπικρον / δαίρω
  rationale: 초상화적 묘사인 περίπικρον은 ‘쓴맛’ 계열의 직접 이미지를 살려 ‘쓰디쓴’으로, δαίρω는 반복적 구타의 감각을 드러내는 ‘맞다’로 옮겼습니다.
- source_word: οὐκ εὐσταθοῦσαν
  english_pob_choice: were not at ease at all
  chosen_korean: 전혀 편안하지 않았습니다
  alternatives_korean:
  - 전혀 안정되지 않았습니다
  - 조금도 평안하지 않았습니다
  lexicon: εὐσταθέω
  rationale: 문맥상 양들의 내적 평안/안정을 말하므로, 한국어에서는 자연스럽고 직접적인 ‘편안하지 않았다’로 옮겼습니다.
theological_decisions:
- issue: 회개 가능성과 영원한 멸망의 대비
  chosen_reading: 타락한 자들에게는 회개의 희망이 있어 살 수 있지만, 죽음에는 영원한 멸망이 있습니다.
  alternative_readings:
  - 회개 가능성은 있으나 죽음은 단지 소멸을 뜻한다
  - 멸망은 종말론적 판결이라기보다 상징적 표현이다
  rationale: 본문은 진리에서 벗어난 상태와 죽음의 최종성을 뚜렷이 대조하므로, 희망과 심판의 긴장을 약화시키지 않도록 직설적으로 옮겼습니다.
  doctrine_reference: 회개론/종말론
