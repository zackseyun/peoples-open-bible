source:
  edition: WLC
  text: יְֽהוָ֗ה בֹּ֭קֶר תִּשְׁמַ֣ע קוֹלִ֑/י בֹּ֥קֶר אֶֽעֱרָךְ לְ֝/ךָ֗ וַ/אֲצַפֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/003.yaml
  text: Yahweh, in the morning you hear my voice; in the morning I lay my prayer before you[a] and watch expectantly[b].
  footnotes:
  - marker: a
    text: Literally, “I arrange for you” or “I set in order before you”; the object is unstated, likely the psalmist’s prayer.
    reason: lexical_alternative
  - marker: b
    text: Or “and wait expectantly.” The Hebrew verb can convey watching, waiting, or looking out in hope.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 아침에 주께서 제 목소리를 들으십니다. 아침에 제가 주께 제 간구를 아뢰고[a] 기대하며 바라봅니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 주께 (간구를) 정돈하여 차려 놓고.’ 히브리어 동사는 ‘정돈하다, 배열하다’를 뜻하며, 여기서는 기도나 간구를 하나님 앞에 드리는 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기다립니다.’ 히브리어 동사는 바라봄, 지켜봄, 희망 가운데 기다림을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  english_pob_choice: Pay attention
  chosen_korean: 귀 기울여 주십시오
  alternatives_korean:
  - 들어 주십시오
  - 주의를 기울여 주십시오
  lexicon: HALOT
  rationale: קשׁב의 명령형은 단순 청취가 아니라 주의를 집중한 경청을 요구하므로, 한국어에서는 자연스럽고 간결한 ‘귀 기울여 주십시오’가 힘을 잘 살립니다.
- source_word: לְקוֹל שַׁוְעִי
  english_pob_choice: the sound of my cry for help
  chosen_korean: 제 도움의 외침 소리
  alternatives_korean:
  - 제 부르짖음의 소리
  - 제 간구의 소리
  lexicon: HALOT
  rationale: קוֹל과 שַׁוְעָה의 결합은 단순한 ‘소리’가 아니라 위기 속 도움을 구하는 외침이므로, ‘도움의 외침 소리’로 병렬 구조를 살렸습니다.
- source_word: מַלְכִּי וֵאלֹהָי
  english_pob_choice: my King and my God
  chosen_korean: 나의 왕이시며 나의 하나님이시여
