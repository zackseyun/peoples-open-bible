  from: In distress you called[a], and I rescued you; I answered you in the hiding place of thunder; I tested you at the waters of Meribah[b]. Selah
  to: In distress you called, and I rescued you; I answered you from the hiding place of thunder[a]; I tested you at the waters of Meribah[b]. Selah
  rationale: Though the Hebrew preposition is formally locative, “from” is the natural English way to express the concealed place whence the divine answer issued. It preserves, rather than explains away, the image. The marker is correctly moved to the phrase under discussion, and the Meribah note remains useful contextual identification.
