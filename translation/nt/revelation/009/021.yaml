theological_decisions:
- issue: Semantic scope of φαρμάκων in an apocalyptic vice list
  chosen_reading: sorceries
  alternative_readings:
  - magic arts
  - witchcrafts
  - poisonings
  rationale: The immediate context lists moral evils and idolatrous rebellion; in Revelation, cognate terms regularly carry the sense of sorcery or magical deception. Rendering it as 'sorceries' avoids anachronistically narrowing the term to modern pharmaceuticals while acknowledging the broader lexical range in a footnote.
  doctrine_reference: Translation philosophy §1, §5
- issue: Context-sensitive reorientation terminology
  chosen_reading: And they did not reorient away from their murders[a], or from their sorceries, or from their sexual immorality, or from their thefts.
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
  rationale: Use reorient/reorientation without automatically inserting God. The sentence supplies a departure, destination, interpersonal setting, or the work's own conceptual framework. Preserve distinct turning verbs and named wrongdoing.
