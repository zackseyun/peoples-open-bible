translation:
  text: '1. While I was walking in the field and observing an elm and a vine, and considering them and
    their fruits, the shepherd appears to me and says, “What are you seeking within yourself?” “I am discussing
    the elm and the vine,” I say, “sir[a], because they suit one another most beautifully.”


    2. “These two trees,” he says, “are set as a pattern for the servants of God.” “I would like,” I say,
    “sir, to know the pattern of these trees of which you speak.” “Do you see,” he says, “the elm and
    the vine?” “I see them,” I say, “sir.”


    3. “This vine,” he says, “bears fruit, but the elm is a fruitless tree. Yet unless this vine climbs
    onto the elm, it cannot bear much fruit while lying on the ground; and the fruit it does bear is rotten
    because it does not hang on the elm. So when the vine is laid upon the elm, it bears fruit both from
    itself and from the elm.”


    4. “You see, then, that the elm also gives much[b] fruit, no less than the vine, but rather even more.”
    “How,” I say, “sir, more[c]?” “Because,” he says, “the vine hanging on the elm gives much good fruit,
    but lying on the ground it bears rotten and little fruit. So this parable is set before the servants
    of God, for the poor and the rich.”


    5. “How so, sir?” I say. “Make it known to me.” “Listen,” he says. “The rich man has much money, but
    toward the Lord he is poor, being distracted about his wealth; he has very little confession and intercession
    toward the Lord, and what he has is small and feeble and has no power to go up above[d]. So when the
    rich man goes up to the needy and supplies him with what is necessary, believing that for what he
    does for the needy he will be able to find his wage from God—for the needy is rich in intercession
    [and in confession][e], and his intercession has great power with God—the rich man supplies the needy
    with everything without doubting.”


    6. “The needy man, being supplied by the rich man, intercedes for him, giving thanks to God on behalf
    of the one who gives to him. And that one is still more eager concerning the needy man, so that he
    may be unceasing in his life[f]; for he knows that the intercession of the needy is acceptable and
    abundant with God.”


    7. “Therefore both complete the work. The needy man performs the intercession in which he is rich,
    [which he received from the Lord][g]; this he renders to the Lord for the one who supplies him. Likewise
    the rich man, without doubting, provides to the needy the wealth he received from the Lord. This is
    a great work and acceptable with God, because he understood concerning his wealth, worked for the
    needy out of the Lord’s gifts, and fulfilled the Lord’s ministry rightly.”


    8. “Among people, therefore, the elm seems not to bear fruit. They do not know or understand that
    if there is a drought, the elm, having water, nourishes the vine; and the vine, having unceasing water,
    gives double fruit, both for itself and for the elm. In the same way, the needy, interceding toward
    the Lord on behalf of the rich, make their wealth complete; and in turn the rich, supplying the needy
    with what they need, make their souls complete[h].”


    9. “Thus both become partners in the work of righteousness. Therefore the one who does these things
    will not be abandoned by God[i], but will be inscribed in the books of the living.”


    10. “Blessed are those who have and understand that they are made rich from the Lord; for the one
    who understands this will be able to render some good service[j].”'
