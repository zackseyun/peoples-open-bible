id: JON.1.1
reference: Jonah 1:1
source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל יוֹנָ֥ה בֶן אֲמִתַּ֖י לֵ/אמֹֽר־־־׃
translation:
  text: 'The word of Yahweh came to Jonah son of Amittai:'
  philosophy: dynamic
lexical_decisions:
- source_word: וַיְהִי
  chosen: '... Came'
  alternatives:
  - And it happened
  - And the word ... came to pass
  - Now ... came
  lexicon: HALOT
  rationale: 'The waw-consecutive of היה is a common Hebrew narrative opener. In English, a wooden ''and it happened'' is possible but less natural. Rendering it with ''Now'' preserves the discourse function of introducing the narrative while allowing the following verb ''came'' to carry the main predication. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: דְּבַר
  chosen: the word
  alternatives:
  - a word
  - message
  lexicon: HALOT
  rationale: In the construct phrase דְּבַר יְהוָה, 'the word of the LORD' is the standard prophetic formula and preserves the concrete lexical sense of דָּבָר. 'Message' is possible dynamically, but 'word' better maintains intertextual and prophetic resonance.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: אֶל
  chosen: to
  alternatives:
  - unto
  lexicon: HALOT
  rationale: The preposition marks direction toward the recipient of revelation. 'To' is the natural modern English equivalent.
- source_word: יוֹנָה
  chosen: Jonah
  lexicon: HALOT
  rationale: Personal names are transliterated by standard English convention.
- source_word: בֶן אֲמִתַּי
  chosen: son of Amittai
  alternatives:
  - the son of Amittai
  lexicon: HALOT
  rationale: The patronymic identifies Jonah in standard Hebrew form. 'Son of Amittai' is the most direct and idiomatic rendering.
- source_word: לֵאמֹר
  chosen: saying,
  alternatives:
  - 'thus:'
  - 'with these words:'
  lexicon: HALOT
  rationale: This infinitive introduces the following divine speech in the next verse. 'Saying,' is the conventional and sufficiently natural way to preserve the linkage without paraphrase.
