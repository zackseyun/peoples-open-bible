  text: But he would feed him with the finest wheat[a][b], and with honey from the rock I would satisfy you.
  footnotes:
  - marker: a
    text: 'The Hebrew shifts person: ''he would feed him ... I would satisfy you.'' The singular likely refers to Israel as a people.'
    reason: alternative_reading
  - marker: b
    text: Or 'with the fat of wheat'; the Hebrew idiom means the richest or choicest wheat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 그에게 가장 좋은 밀을 먹이고, 나는 바위에서 나는 꿀로 너를 만족하게 했을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘밀의 기름진 부분’입니다. 이는 가장 좋고 풍성한 밀을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그는 그에게 먹이고’에서 ‘나는 너를 만족하게 하고’로 인칭을 바꿉니다. 단수 대명사는 이스라엘을 집단적으로 가리킬 수 있습니다.
    reason: alternative_reading
