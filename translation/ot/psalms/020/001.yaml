id: PSA.20.1
reference: Psalms 20:1
source:
  edition: WLC
  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
translation:
  text: May Yahweh answer you in the day of trouble; may the name of the God of Jacob protect you[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'set you securely on high'; the verb pictures being placed beyond danger's reach.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ
  chosen: May ... answer you
  alternatives:
  - let ... answer you
  - will answer you
  lexicon: HALOT
  rationale: ענה in the Hiphil commonly means 'answer, respond to.' In this psalmic/jussive context, English 'May ... answer you' best conveys the wish/prayer force of the form, rather than a simple future.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: בְּיוֹם צָרָה
  chosen: in the day of trouble
  alternatives:
  - in a day of distress
  - when trouble comes
  lexicon: HALOT
  rationale: The phrase is idiomatic and temporal. 'Day of trouble' preserves the Hebrew imagery and remains natural English; 'trouble' is broad and fitting for צָרָה.
- source_word: יְשַׂגֶּבְךָ
  chosen: protect you
  alternatives:
  - protect you
  - defend you
  - exalt you
  lexicon: HALOT
  rationale: In context the Piel describes protection by placing someone beyond danger. “Protect you” is natural English, while the concrete image is retained in the footnote.
- source_word: שֵׁם
  chosen: the name
  alternatives:
  - the renown
  - the authority
  lexicon: HALOT
  rationale: Hebrew 'name' can imply reputation, authority, or invoked presence, but the literal 'name' should be retained here because it is theologically and poetically significant and natural in English.
- source_word: אֱלֹהֵי יַעֲקֹב
  chosen: the God of Jacob
  alternatives:
  - Jacob's God
  lexicon: HALOT
  rationale: The construct phrase is straightforward. 'The God of Jacob' preserves the covenantal and historical resonance of the Hebrew expression.
