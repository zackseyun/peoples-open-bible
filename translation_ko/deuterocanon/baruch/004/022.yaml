translation:
  language: ko
  text: 나는 너희의 구원을 바라며 영원하신 분을 의지하였습니다. 그리고 거룩하신 분께로부터 내게 기쁨이 왔습니다. 이는 너희의 영원하신 구원자께로부터 너희에게 속히 임할 자비 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῷ αἰωνίῳ
  english_pob_choice: in the Eternal One
  chosen_korean: 영원하신 분께
  alternatives_korean:
  - 영원하신 이에게
  - 영원하신 분을 의지하여
  lexicon: αἰώνιος
  rationale: 영원하신 분을 인격적 호칭으로 살리면서도, 이어지는 구원과 자비의 문맥에 맞게 신뢰의 대상을 분명히 드러냅니다.
- source_word: τὴν σωτηρίαν ὑμῶν
