translation:
  text: I took root among a people made glorious, Yahweh’s own portion, his inheritance[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Echoes Deuteronomy 32:9, where Jacob is Yahweh’s portion and inheritance.
