theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Sense of Balaam's limitation
  chosen_reading: Balaam cannot act or speak independently of the LORD's word
  alternative_readings:
  - Balaam cannot alter the LORD's command specifically in blessing/curse terms
  rationale: The verse itself emphasizes inability to go beyond the LORD's word and inability to do good or evil from his own heart. The translation preserves that direct claim without importing broader doctrinal conclusions about prophecy beyond the immediate context.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
