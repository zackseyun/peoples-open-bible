id: PSA.63.5
reference: Psalms 63:5
source:
  edition: WLC
  text: כְּמ֤וֹ חֵ֣לֶב וָ֭/דֶשֶׁן תִּשְׂבַּ֣ע נַפְשִׁ֑/י וְ/שִׂפְתֵ֥י רְ֝נָנ֗וֹת יְהַלֶּל פִּֽ/י־׃
translation:
  text: My soul will be satisfied as with rich, abundant food[a]; with joyful lips my mouth will praise you.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “fat and fatness,” an image of rich, plentiful food.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ
  chosen: as with
  alternatives:
  - like
  - as
  lexicon: HALOT
  rationale: Introduces comparison. 'As with' fits idiomatic English with the following food imagery better than a bare 'like.'
- source_word: חֵלֶב
  chosen: fat
  alternatives:
  - fatness
  - rich food
  lexicon: HALOT
  rationale: The noun literally denotes fat. In poetic context it evokes rich, choice food and abundance. 'Fat' preserves the concrete Hebrew image better than immediately abstracting to 'rich food.'
- source_word: דֶּשֶׁן
  chosen: richness
  alternatives:
  - fatness
  - abundance
  - rich food
  lexicon: HALOT
  rationale: This term overlaps semantically with fertility, richness, and luxuriance. Rendering it 'richness' avoids an awkward doublet 'fat and fatness' while preserving the abundance imagery alongside חֵלֶב.
- source_word: תִּשְׂבַּע
  chosen: will be satisfied
  alternatives:
  - will be satisfied
  - is filled
  - is sated
  lexicon: HALOT
  rationale: In the sequence of imperfects following the vow of verse 4, the prospective rendering is the most natural contextual reading.
- source_word: נַפְשִׁי
  chosen: my soul
  alternatives:
  - my life
  - I myself
  lexicon: HALOT
  rationale: נֶפֶשׁ can denote soul, self, or life. Here 'my soul' is the most natural English equivalent in a psalm of desire for God and inner satisfaction, and it preserves the anthropological depth of the Hebrew.
- source_word: שִׂפְתֵי רְנָנוֹת
  chosen: with joyful lips
  alternatives:
  - with joyful lips
  - with lips of rejoicing
  - with singing lips
  lexicon: HALOT
  rationale: This preserves the lips image and does not add “songs,” which the Hebrew does not specify.
- source_word: יְהַלֶּל
  chosen: will praise
  alternatives:
  - will praise you
  - shall praise you
  - praises
  lexicon: HALOT
  rationale: Future English matches the parallel imperfect; the unexpressed object remains unmarked as in Hebrew.
- source_word: פִּי
  chosen: my mouth
  alternatives:
  - my lips
  - my speech
  lexicon: HALOT
  rationale: Retains the concrete bodily image paired with 'lips.' Hebrew poetry often uses parallel body-part imagery for praise; 'my mouth' preserves that parallelism.
- source_word: חֵלֶב וָדֶשֶׁן
  chosen: fat and rich food
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This retains the concrete paired image while avoiding the unnatural abstract noun “richness.”
