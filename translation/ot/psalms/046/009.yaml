id: PSA.46.9
reference: Psalms 46:9
source:
  edition: WLC
  text: מַשְׁבִּ֥ית מִלְחָמוֹת֮ עַד קְצֵ֪ה הָ֫/אָ֥רֶץ קֶ֣שֶׁת יְ֭שַׁבֵּר וְ/קִצֵּ֣ץ חֲנִ֑ית עֲ֝גָל֗וֹת יִשְׂרֹ֥ף בָּ/אֵֽשׁ־׃
translation:
  text: He makes wars cease to the ends of the earth; he breaks the bow and cuts the spear in pieces; he burns the war wagons[a] with fire.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'chariots'; the Hebrew word usually means wagons or carts.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁבִּית
  chosen: makes ... cease
  alternatives:
  - puts an end to
  - stops
  lexicon: HALOT
  rationale: Hiphil participle of שׁבת conveys causing something to cease. 'Makes ... cease' preserves the causative force while remaining natural English.
- source_word: מִלְחָמוֹת
  chosen: wars
  alternatives:
  - battles
  - warfare
  lexicon: HALOT
  rationale: Plural noun naturally refers to wars/conflicts broadly. 'Wars' is the most direct and idiomatic rendering.
- source_word: עַד קְצֵה הָאָרֶץ
  chosen: to the end of the earth
  alternatives:
  - to the ends of the earth
  - throughout the earth
  lexicon: HALOT
  rationale: Literally 'unto the end/extremity of the earth.' Singular construct with collective sense can be rendered idiomatically in English. 'To the end of the earth' stays close to the Hebrew while conveying universal extent.
- source_word: קֶשֶׁת
  chosen: the bow
  alternatives:
  - bows
  lexicon: HALOT
  rationale: Singular noun used generically for weaponry. English singular with article works well as a representative class term.
- source_word: יְשַׁבֵּר
  chosen: breaks
  alternatives:
  - shatters
  lexicon: HALOT
  rationale: Piel of שׁבר means to break/smash. 'Breaks' is straightforward and avoids over-intensifying beyond the Hebrew.
- source_word: וְקִצֵּץ
  chosen: cuts ... in pieces
  alternatives:
  - cuts in pieces
  - chops down
  lexicon: HALOT
  rationale: Conveys destructive cutting without the false precision of “in two.”
- source_word: חֲנִית
  chosen: the spear
  alternatives:
  - the lance
  lexicon: HALOT
  rationale: Standard term for spear. 'Spear' is the clearest modern equivalent.
- source_word: עֲגָלוֹת
  chosen: the wagons
  alternatives:
  - chariots
  lexicon: HALOT
  rationale: The Hebrew here is עֲגָלוֹת, ordinarily 'wagons/carts,' not the usual word for chariots. Although many traditional translations have 'chariots,' source-language primacy favors 'wagons.' In context these are military transport vehicles associated with war matériel.
- source_word: יִשְׂרֹף בָּאֵשׁ
  chosen: he burns ... in the fire
  alternatives:
  - he burns ... with fire
  lexicon: HALOT
  rationale: The idiom literally includes 'in/with the fire.' 'In the fire' is natural English and preserves the concrete image.
