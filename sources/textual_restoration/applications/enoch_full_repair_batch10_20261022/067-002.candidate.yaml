translation:
  text: Now the angels are working wood. When the angels have completed it, I will put my hand upon it and preserve
    it. A seed of life will come from it, and there will be a replacement so that dry land will not remain bare.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Working wood retains the selected wood material rather than adding the word ark or a described vessel.
      Actual primary1025–1026 gives wood/tree and wooden implements;525 supports entering/coming-from,889–890 change/exchange/replacement,
      and962 explicitly cites67:2 for bare. Angels finish the work before the first-person hand/preservation promise.
      Seed of life and the negative not-remain-bare are retained; the object is not supplied with an unprinted name.
    reason: lexical_alternative
