  naturalness: 문장은 현대 표준 한국어로 자연스럽고, 서술문은 합쇼체로 일관됩니다. 인용문 안의 ‘말라’, ‘안 된다’, ‘것이다’는 발화 내용의 직접 인용으로서 자연스럽습니다. 두 차례의 ‘말합니다/합니다’는 히브리어의 반복과 풍자적 효과를 보존합니다.
  terminology: ‘예언하다’는 이 문맥의 טפף를 가장 명료하게 전달하며, ‘치욕’은 כְּלִמּוֹת의 공개적 수치·모욕의 의미를 무리 없이 반영합니다. 핵심 신학 용어 및 인명은 해당하지 않습니다.
