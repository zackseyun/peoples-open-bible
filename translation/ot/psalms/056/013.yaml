  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: footnotes
  tier: 1
  from: For you have delivered my soul from death[a]; have you not also kept my feet from stumbling[b][c], that I may walk before God in the light of life?
  to: For you have delivered my life from death[a]; have you not also kept my feet from falling[b], so that I may walk before God in the light of life[c]?
  rationale: The contextual rendering "my life" is preferable beside "from death," and "falling" preserves the concrete feet-and-walking image. The current footnote markers are mismatched to their notes and need correction. However, הֲלֹא is an affirmative-answer rhetorical question; replacing it with "yes" suppresses that marked source form. "Kept my feet from falling" is a natural English realization of the Hebrew ellipsis and does not warrant a forced repetition of "delivered."
