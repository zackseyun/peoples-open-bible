translation:
  text: Seron, the commander of the Syrian army, heard that Judas had gathered a band—an assembly of faithful men who went out with him to war.
  philosophy: dynamic
lexical_decisions:
- source_word: ἤκουσεν
  chosen: heard
  alternatives:
  - learned
  - was informed
  lexicon: LSJ
  rationale: Standard aorist of ἀκούω meaning 'heard'; in narrative English, 'heard' is natural and sufficiently broad to include receiving report.
- source_word: ὁ ἄρχων τῆς δυνάμεως Συρίας
  chosen: the commander of the army of Syria
  alternatives:
  - the ruler of the Syrian force
  - the commander of the Syrian army
  lexicon: LSJ
  rationale: ἄρχων here denotes a military leader rather than a civil ruler; δύναμις in this context refers to armed force/army. 'of Syria' follows the genitive as given in the Greek source.
- source_word: ἤθροισεν
  chosen: had gathered
  alternatives:
  - assembled
  - collected
  lexicon: LSJ
  rationale: The verb indicates bringing people together. Pluperfect-like English 'had gathered' fits the reported content after 'heard that' in idiomatic narrative English.
- source_word: ἄθροισμα
  chosen: a company
  alternatives:
  - a band
  - a gathering
  - a force
  lexicon: LSJ
  rationale: ἄθροισμα denotes a collected body or group. 'Company' preserves the sense of an assembled body without overstating it as a formal army, especially since the next phrase adds 'assembly of the faithful'.
- source_word: ἐκκλησίαν
  chosen: an assembly
  alternatives:
  - a congregation
  - an assembly-community
  lexicon: LSJ
  rationale: In this pre-Christian Jewish context, ἐκκλησία is best rendered 'assembly' rather than the later ecclesial term 'church.'
- source_word: πιστῶν
  chosen: the faithful
  alternatives:
  - faithful ones
  - loyal men
  lexicon: LSJ
  rationale: πιστῶν here most naturally describes those loyal/faithful to the cause and covenant community. 'The faithful' is concise and preserves both religious and loyalty overtones.
- source_word: μεθʼ αὐτοῦ
  chosen: with him
  alternatives:
  - along with him
  lexicon: LSJ
  rationale: Straightforward accompaniment.
- source_word: ἐκπορευομένων εἰς πόλεμον
  chosen: going out to war
  alternatives:
  - marching out for battle
  - going forth into war
  lexicon: LSJ
  rationale: The participial phrase describes the assembled faithful as those going out for warfare. 'Going out to war' is idiomatic and close to the Greek.
