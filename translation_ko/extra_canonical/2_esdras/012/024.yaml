  naturalness: ‘그들보다 앞선 모든 이들보다’보다 ‘그들보다 앞서 있었던 모든 이들보다’가 비교의 대상을 더 자연스럽고 명료하게 나타냅니다. ‘심한 압제로 억누를 것입니다’는 현대 표준어 합쇼체로 자연스럽습니다.
