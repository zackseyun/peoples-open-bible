translation:
  text: “In this way a place was set apart for the souls of those who make accusation, who give testimony about
    their destruction when they were killed in the days of sinners.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A place is supplied with the impersonal was separated construction, as in22:9. The selected wording speaks
      of souls and accusation; the showing verb is rendered give testimony in the context of persons reporting their
      killing. It does not specify a philosophical definition of a soul or authorize changing the source noun to
      spirit. Their before destruction is contextual English, not an expressed possessive suffix.
