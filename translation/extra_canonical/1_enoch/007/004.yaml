lexical_decisions:
- source_word: ተመይጡ
  chosen: turned
  alternatives:
  - turned themselves
  rationale: The verb expresses a change of direction or disposition. In combination with ላዕሌሆሙ (“against them”), “turned”
    naturally conveys the hostile reversal without adding an action not stated in the witness.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ረዓይት
  chosen: the giants
  alternatives:
  - the great ones
  rationale: In the immediate narrative this plural designates the gigantic offspring previously described. “Giants” preserves
    the concrete apocalyptic beings rather than reducing the expression to a generic description of size or power.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ላዕሌሆሙ
  chosen: against them
  alternatives:
  - upon them
  - over them
  rationale: Literally spatial language such as “upon them” can carry a hostile sense after “turned.” English “against them”
    makes that contextual relation clear while retaining the pronoun and the reversal depicted.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ይበልዕዎሙ
  chosen: devoured
  alternatives:
  - ate
  - consumed
  rationale: “Devoured” preserves the violent force of the eating and the grotesque apocalyptic image. “Consumed” could obscure
    the literal anthropophagy, while “ate” understates its rhetorical force.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ሰብእ
  chosen: humankind
  alternatives:
  - human beings
  - people
  - men
  rationale: The collective noun refers to humanity as the giants’ prey, not specifically to adult males. “Humankind” is concise
    and preserves the collective scope.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
theological_decisions:
- issue: Literal violence of the giants against humanity
  chosen_reading: The giants physically devour humankind.
  alternative_readings:
  - The giants merely consume humanity’s resources
  - The giants destroy people in a nonliteral sense
  rationale: The eating verb and its human object present direct anthropophagic violence. Preserving “devoured” retains the
    Watchers narrative’s escalating corruption and judgment imagery without allegorizing it.
  doctrine_reference: 'Book context: preserve apocalyptic imagery and do not smooth it into generic modern prose.'
