translation:
  text: For the sun changes often, bringing blessing or curse, and the moon’s course is light for the righteous and darkness for sinners in the name of the Lord. He created a separation[a] between light and darkness, separated the spirits of humankind, and strengthened the spirits of the righteous in the name of his righteousness.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Ge'ez says “created between light and darkness,” without stating what was created; this apparently recalls the separation described in Genesis 1:4.
    reason: lexical_alternative
