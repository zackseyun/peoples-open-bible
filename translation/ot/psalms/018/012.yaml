id: PSA.18.12
reference: Psalms 18:12
source:
  edition: WLC
  text: מִ/נֹּ֗גַהּ נֶ֫גְדּ֥/וֹ עָבָ֥י/ו עָבְר֑וּ בָּ֝רָ֗ד וְ/גַֽחֲלֵי אֵֽשׁ־׃
translation:
  text: Out of the brightness before him, his clouds passed by, with hail and coals of fire[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “Out of the brightness before him, hail and coals of fire broke through his clouds.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִנֹּגַהּ
  chosen: Out of the brightness
  alternatives:
  - Out of the brightness
  - From the radiance
  lexicon: HALOT
  rationale: This conveys emergence from the radiance without adding a further interpretation.
- source_word: נֶגְדּוֹ
  chosen: before him
  alternatives:
  - in front of him
  - before his presence
  lexicon: HALOT
  rationale: נֶגֶד with 3ms suffix commonly means 'before him' or 'in front of him.' 'Before him' is idiomatic and preserves the spatial sense without overinterpreting it as an abstract 'presence.'
- source_word: עָבָיו
  chosen: his clouds
  alternatives:
  - his thick clouds
  - his storm clouds
  lexicon: HALOT
  rationale: The noun from עב refers to cloud-mass or thick cloud. 'His clouds' follows the suffix directly and keeps the imagery concise. 'Thick clouds' is possible, but the following context already supplies storm imagery.
- source_word: עָבְרוּ
  chosen: passed by
  alternatives:
  - passed through
  - moved on
  - went by
  lexicon: HALOT
  rationale: A natural English expression for the movement of the clouds in this context.
- source_word: בָּרָד
  chosen: hail
  lexicon: HALOT
  rationale: Standard rendering of the meteorological term; no ambiguity here.
- source_word: וְגַחֲלֵי אֵשׁ
  chosen: and coals of fire
  alternatives:
  - and burning coals
  - and fiery coals
  lexicon: HALOT
  rationale: The construct phrase literally means 'coals of fire.' This preserves the vivid poetic imagery and remains natural English. A more interpretive 'burning coals' is possible but less formally transparent.
