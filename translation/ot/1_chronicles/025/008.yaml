id: 1CH.25.8
reference: 1 Chronicles 25:8
source:
  edition: WLC
  text: וַ/יַּפִּ֜ילוּ גּוֹרָל֣וֹת מִשְׁמֶ֗רֶת לְ/עֻמַּת֙ כַּ/קָּטֹ֣ן כַּ/גָּד֔וֹל מֵבִ֖ין עִם תַּלְמִֽיד־׃פ
translation:
  text: They cast lots to assign their service duties, all on equal terms, whether of low or high rank[a], expert or student.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or 'young or old'; literally, 'small and great.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּפִּילוּ
  chosen: they cast
  alternatives:
  - they caused to fall
  - they assigned by lot
  lexicon: HALOT
  rationale: The Hiphil of נפל with גּוֹרָלוֹת is the idiom for casting lots. 'They cast' is natural English and preserves the action without over-paraphrasing.
- source_word: גּוֹרָלוֹת
  chosen: lots
  alternatives:
  - lot assignments
  lexicon: HALOT
  rationale: The plural noun directly denotes lots used for selection or assignment. 'Lots' is the standard and clearest rendering in context.
- source_word: מִשְׁמֶרֶת
  chosen: their duties
  alternatives:
  - service
  - division
  - charge
  lexicon: HALOT
  rationale: In this temple-musical context, מִשְׁמֶרֶת refers to an assigned duty or watch. 'Their duties' communicates the functional sense in readable English. The possessive is supplied from context because the lots determine the participants' respective assignments.
- source_word: לְעֻמַּת
  chosen: alike
  alternatives:
  - corresponding to
  - opposite
  - equally
  lexicon: HALOT
  rationale: Here the preposition introduces equivalence between groups rather than spatial opposition. 'Alike' captures the distributive sense succinctly in English.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  chosen: small and great
  alternatives:
  - the small as the great
  - the lesser as the greater
  - young and old
  lexicon: HALOT
  rationale: The phrase marks equal treatment irrespective of status. 'Small and great' preserves the Hebrew idiom better than interpretive expansions like 'young and old.'
- source_word: מֵבִין
  chosen: teacher
  alternatives:
  - the skillful one
  - the expert
  - the one who understands
  lexicon: HALOT
  rationale: Although the participle literally means 'one who understands,' in this context of organized musical service it likely denotes one who is knowledgeable or instructing others. 'Teacher' fits well with the following 'student' and reflects the relational pairing.
- source_word: עִם
  chosen: with
  alternatives:
  - together with
  lexicon: HALOT
  rationale: The preposition simply links the paired categories. 'With' is direct and sufficient.
- source_word: תַּלְמִיד
  chosen: student
  alternatives:
  - disciple
  - learner
  - apprentice
  lexicon: HALOT
  rationale: In this non-discipleship, instructional setting, 'student' is the most natural modern English equivalent. 'Disciple' would import later religious associations not required by the Hebrew.
