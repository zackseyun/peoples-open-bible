id: 1ES.3.14
reference: 1 Esdras 3:14
source:
  edition: lxx-swete-1909
  text: καὶ ἐξαποστείλας ἐκάλεσεν πάντας τοὺς μεγιστᾶνας τῆς Περσίδος καὶ τῆς Μηδείας καὶ σατράπας καὶ στρατηγοὺς καὶ τοπάρχας καὶ ὑπάτους,
  language: Greek
