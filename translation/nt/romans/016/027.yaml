id: ROM.16.27
reference: Romans 16:27
source:
  edition: robinson-pierpont-2005-byzantine
  digital_reference: Romans 14:26 (byztxt v2.0.3)
  text: μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας. Ἀμήν.
  language: Greek
translation:
  text: to the only wise God, through Jesus Christ, to whom be the glory forever.
    Amen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Conclusion of the supplementary doxology. The RP2005-era digital text has this wording at Romans 14:26, not at the end of chapter 16. POB's placement is explained at Romans 16:25.
    reason: textual_variant
lexical_decisions:
- source_word: μόνος
  chosen: only
  alternatives:
  - alone
  - sole
  lexicon: BDAG
  rationale: Functions attributively with 'wise God' (μόνῳ σοφῷ θεῷ), emphasizing
    God's exclusive possession of ultimate wisdom.
- source_word: αἰών
  chosen: forever
  alternatives:
  - the ages
  - eternity
  lexicon: BDAG
  rationale: The phrase 'εἰς τοὺς αἰῶνας' (literally 'into the ages') is the standard
    Greek idiom for 'forever' or 'for all eternity'.
- source_word: ὅς
  chosen: to whom
  alternatives:
  - to him
  lexicon: BDAG
  rationale: A dative relative pronoun (ᾧ). While it creates a slight grammatical
    ambiguity regarding whether the antecedent is God or Jesus Christ, 'to whom' preserves
    the Greek syntax accurately.
