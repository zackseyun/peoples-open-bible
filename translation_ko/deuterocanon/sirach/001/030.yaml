lexical_decisions:
- source_word: πῦρ φλογιζόμενον
  english_pob_choice: a blazing fire
  chosen_korean: 맹렬한 불길
  alternatives_korean:
  - 활활 타오르는 불
  - 불타오르는 불길
  lexicon: πῦρ
  rationale: 영어 POB의 'a blazing fire'를 따라 단순한 '불'보다 세기와 지속성을 드러내는 표현으로 옮겼습니다.
- source_word: ἀποσβέσει
  english_pob_choice: puts out
  chosen_korean: 꺼뜨리고
  alternatives_korean:
  - 끄고
  - 진화하고
  lexicon: ἀποσβέννυμι
  rationale: 불을 실제로 진압해 사라지게 한다는 동작을 자연스러운 한국어 동사로 옮겼습니다.
- source_word: ἐλεημοσύνη
  english_pob_choice: almsgiving
  chosen_korean: 구제
  alternatives_korean:
  - 자선
  - 구호
  lexicon: ἐλεημοσύνη
  rationale: 단순한 기부보다 가난한 이를 돕는 행위라는 종교적·윤리적 범위를 살려 '구제'를 택했습니다.
- source_word: ἐξιλάσεται ἁμαρτίας
  english_pob_choice: makes atonement for sins
  chosen_korean: 죄를 속합니다
  alternatives_korean:
  - 죄를 속죄합니다
  - 죄를 덮어줍니다
  lexicon: ἐξιλάσκομαι
  rationale: 속죄/화목의 의미를 유지하되, 현대 한국어에서 문맥에 맞게 직접적이고 간결한 '속하다' 계열로 옮겼습니다.
theological_decisions:
- issue: 지혜문학의 도덕적 진술을 제의적 속죄 언어로 옮기는 문제
  chosen_reading: 구제가 죄에 대해 속죄적 효과를 가진다는 진술로 그대로 반영했습니다.
  alternative_readings:
  - 비유적으로만 이해해 윤리적 선행의 결과로 완화하는 읽기
  - '''용서받는다''처럼 주체를 약화시키는 읽기'
  rationale: 본문과 영어 POB 모두 구제와 죄의 관계를 직접적으로 진술하므로, 그 긴장을 약화하지 않고 유지했습니다.
  doctrine_reference: 집회서 1:30의 지혜문학적 속죄 진술
- issue: 히브리어 본문과 그리스어 병행본의 차이
  chosen_reading: 그리스어 전승의 현재 본문을 따랐습니다.
  alternative_readings:
  - 히브리어 본문의 '가까이 와서 지체하지 말라'류 문장으로 옮기는 읽기
  - 혼합 번역
  rationale: 제시된 영어 POB 개정은 그리스어 병행본을 따르는 방향으로 확정되어 있으며, 번역 대상 본문도 이에 맞춰야 합니다.
  doctrine_reference: 집회서 본문 전승 및 편집사
