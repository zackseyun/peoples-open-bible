  text: Καὶ Τωβεὶτ ἔγραφεν προσευχὴν εἰς ἀγαλλίασιν καὶ εἶπεν Εὐλογητὸς ὁ θεὸς ὁ ζῶν εἰς τοὺς αἰῶνας καὶ ἡ βασιλεία αὐτοῦ·
  language: Greek
