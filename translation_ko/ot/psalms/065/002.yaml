  chosen_reading: 침묵 자체가 하나님께 드려지는 찬양으로 제시된다는 의미를 유지했습니다.
  alternative_readings:
  - 주님께는 침묵 속의 찬양이 있습니다
  - 침묵 가운데 찬양이 주님을 기다립니다
  rationale: 히브리어는 명시적 동사가 없는 생략 구조라서, 의미를 한쪽으로 단정하기보다 역설적 긴장을 보존하는 쪽이 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 시편의 시적 평행법과 축약 표현에 대한 번역 원리
