  naturalness: ‘사람이 자기 자신을 괴롭게 하는’은 ‘자기 자신’의 중복으로 다소 부자연스럽습니다. ‘사람이 자신을 괴롭게 하는’이 현대 표준 한국어로 더 자연스럽고 의미도 정확합니다. 각주 표지도 해당 어구와 마지막 질문에 직접 붙이는 편이 명료합니다.
