translation:
  text: The whole earth has been corrupted through the teaching of Azazel’s practices. Record every sin against him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “write every sin upon him,” an image of entering guilt into a heavenly judicial record.
    reason: lexical_alternative
lexical_decisions:
- source_word: ማሰነት
  chosen: has been corrupted
  alternatives:
  - was corrupted
  - has been ruined
  rationale: The verb depicts the earth as having been spoiled or corrupted, with a resulting condition relevant to the command
    that follows. The English present perfect preserves that resultative force without weakening the judgment language.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኵላ፡ ምድር
  chosen: the whole earth
  alternatives:
  - all the earth
  rationale: This retains the comprehensive cosmic scope of the Ge'ez expression and its apocalyptic force.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በትምህርተ፡ ግብሩ፡ ለአዛዝኤል
  chosen: through the teaching of Azazel’s practices
  alternatives:
  - through the teaching of the deeds of Azazel
  - through the teaching of Azazel’s works
  - by what Azazel taught people to do
  rationale: ትምህርት denotes teaching or instruction, while ግብር can denote work, deed, or practiced activity. “Practices” makes
    intelligible that Azazel taught actionable arts or behaviors while avoiding the paraphrastic expansion “what he taught
    people to do.” The possessive construction identifies the practices with Azazel.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ላዕሌሁ፡ ጸሐፍ
  chosen: record ... against him
  alternatives:
  - write ... upon him
  - ascribe ... to him
  - charge ... against him
  rationale: ጸሐፍ is the command “write,” and ላዕሌሁ is literally “upon him” but here has judicial force. “Record ... against
    him” preserves the concrete act of writing while communicating that the sins are entered to his account.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኵሎ፡ ኃጢአተ
  chosen: every sin
  alternatives:
  - all sin
  - the whole of sin
  rationale: The source uses a comprehensive expression with singular “sin.” “Every sin” is natural English and retains the
    emphatic totality of the accusation.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
