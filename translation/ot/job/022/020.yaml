id: JOB.22.20
reference: Job 22:20
source:
  edition: WLC
  text: אִם לֹ֣א נִכְחַ֣ד קִימָ֑/נוּ וְ֝/יִתְרָ֗/ם אָ֣כְלָה אֵֽשׁ־׃
translation:
  text: “Surely our adversary has been cut off[a], and fire has consumed what was left of them!”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew word rendered “our adversary” is uncertain and has also been related to “substance” or “possessions.”
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  chosen: Surely
  alternatives:
  - If not
  - Indeed not
  lexicon: HALOT
  rationale: In this idiom, אִם לֹא functions as an asseverative particle rather than introducing a real conditional. In context Eliphaz is making a forceful assertion, so 'Surely' best captures the emphatic sense in natural English.
- source_word: נִכְחַד
  chosen: have been cut off
  alternatives:
  - have been destroyed
  - have perished
  lexicon: HALOT
  rationale: The Niphal of כחד conveys being effaced, destroyed, or cut off. 'Have been cut off' preserves the passive/resultative force and fits the context of the wicked being removed.
- source_word: קִימָנוּ
  chosen: our adversary
  alternatives:
  - our substance
  - our risen ones
  - our opponents
  lexicon: HALOT
  rationale: The form is read as singular in conjunction with the singular verb נִכְחַד; the accompanying note preserves the lexical uncertainty.
- source_word: וְיִתְרָם
  chosen: and their remnant
  alternatives:
  - their remnant
  - their abundance
  lexicon: HALOT
  rationale: This directly renders יתר, “remainder/remnant,” and its plural suffix without smoothing the source’s number shift.
- source_word: אָכְלָה אֵשׁ
  chosen: fire has consumed
  alternatives:
  - fire devoured
  - a fire consumed
  lexicon: HALOT
  rationale: The verb אכל with אֵשׁ as subject is a standard idiom for destructive consumption. 'Fire has consumed' is clear, natural, and retains the vivid imagery.
