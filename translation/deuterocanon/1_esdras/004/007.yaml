translation:
  text: Because of his wisdom, he will sit beside Darius as second in rank and will be called Darius’s kinsman[a].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “Kinsman” was a court honor indicating privileged closeness to the king.
