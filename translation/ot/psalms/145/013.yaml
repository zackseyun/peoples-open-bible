id: PSA.145.13
reference: Psalms 145:13
source:
  edition: POB-critical
  language: Hebrew
  text: 'מלכותך מלכות כל עלמים וממשלתך בכל דור ודור׃

    נאמן אלוהים בדבריו וחסיד בכול מעשיו׃'
  note: Provisional editorial composite, not a transcription of one manuscript or a recovered autograph. The unpointed text retains the declared base except for the recorded changes; interpretive vocalization outside those changes follows the base.
  apparatus:
  - witness: WLC, Psalm 145:13–14
    reading: ∅
    note: The mem stanza is followed by samekh with no nun line. Exact pointed baseline is preserved in restoration_draft.baseline.source.
  - witness: 11Q5, XVII 2–3; Qumran-Digital version 2026-05-21
    reading: נאמן אלוהים בדבריו וחסיד בכול מעשיו
    note: No supplied or uncertain letters are marked in this published excerpt. God, not YHWH; no all before words. The adjacent recurring blessings are not imported. Published transcription, not new pixel reading.
  - witness: Swete II, Greek Psalm 144, printed p.409 / PDF427, nun couplet printed at 14
    reading: πιστὸς Κύριος ἐν τοῖς λόγοις αὐτοῦ, καὶ ὅσιος ἐν πᾶσι τοῖς ἔργοις αὐτοῦ.
    note: Vaticanus-oriented selected Greek has Lord and no all before words, without 11Q5's recurrent blessings. Its apparatus reports all before words in א c.a, R and T. Edition reports are not fresh manuscript collations or independent Hebrew votes.
translation:
  text: Your kingdom is a kingdom for all ages[a], and your dominion is throughout every generation. God is faithful in his words and loyal[c] in all his deeds[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Your kingdom is an everlasting kingdom.”
    reason: lexical_alternative
  - marker: b
    text: This draft provisionally includes the missing nun line of the alphabetic psalm using the published Hebrew of 11Q5. The Masoretic Text lacks it; the corresponding Greek line has 'the Lord' rather than 'God.' Early acrostic repair remains possible, and the earliest wording is unresolved. The scroll's recurring blessings are not included.
    reason: textual_variant
  - marker: c
    text: Or 'kind' or 'gracious.' Hebrew חסיד also occurs in verse 17; 'loyal' preserves the repeated expression and distinguishes it from נאמן, 'faithful,' earlier in this line.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַֽלְכוּתְךָ
  chosen: Your kingdom
  alternatives:
  - Your kingship
  - Your reign
  lexicon: HALOT
  rationale: מַלְכוּת can denote the realm, kingship, or reign. 'Kingdom' is the most natural English rendering here and fits the parallel with 'dominion,' while preserving the concrete and abstract sense of royal rule belonging to God.
- source_word: מַלְכוּת
  chosen: is a kingdom
  alternatives:
  - is kingship
  - is reign
  lexicon: HALOT
  rationale: 'The repeated noun creates emphasis: ''Your kingdom [is] a kingdom ...'' Retaining the repetition in English preserves the poetic force better than collapsing it into ''Your kingdom is eternal.'''
- source_word: כָּל עֹלָמִים
  chosen: for all ages
  alternatives:
  - for all ages
  - everlasting
  - of all eternities
  lexicon: HALOT
  rationale: Natural English for age-spanning, unbounded duration while retaining the source's plural-age imagery.
- source_word: וּמֶמְשֶׁלְתְּךָ
  chosen: and your dominion
  alternatives:
  - and your rule
  - and your government
  lexicon: HALOT
  rationale: מֶמְשָׁלָה refers to ruling authority or dominion. 'Dominion' matches the elevated poetic register and pairs well with 'kingdom' without implying merely administrative government.
- source_word: בְּכָל דּוֹר וָדֹר
  chosen: throughout every generation
  alternatives:
  - in every generation
  - from generation to generation
  lexicon: HALOT
  rationale: Naturally represents the idiom of continuing across successive generations.
- source_word: נאמן
  chosen: faithful
  alternatives:
  - trustworthy
  - reliable
  lexicon: Published Hebrew and local grammatical analysis; no new lexicon consultation
  rationale: Predicate before God; faithful in his words describes trustworthy speech. Promises would restrict the broader words without an explicit source noun for promises.
- source_word: אלוהים
  chosen: God
  alternatives: []
  rationale: This is the actual 11Q5 designation, not YHWH. Do not harmonize it to the Greek Lord or silently reconstruct Yahweh.
- source_word: בדבריו
  chosen: in his words
  alternatives:
  - with regard to his words
  rationale: Preserves the preposition, plural words and possessive. No all occurs before words in the imported Hebrew line.
- source_word: חסיד
  chosen: loyal
  alternatives:
  - kind
  - gracious
  - faithful
  lexicon: Published Hebrew and local comparison; no new lexicon consultation
  rationale: Denotes loyalty or kindness rather than duplicating נאמן's trustworthiness gloss. Use the same English phrase at verse 17 to reveal the repeated Hebrew colon. Greek hosios can render this adjective and does not itself require different consonants.
- source_word: בכול מעשיו
  chosen: in all his deeds
  alternatives:
  - in all his works
  rationale: Retains the actual scroll's plene spelling and every semantic component. Deeds is natural for acts in this praise context; the same Hebrew phrase in verse 17 receives the same English wording.
