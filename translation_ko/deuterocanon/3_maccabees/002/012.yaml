translation:
  language: ko
  text: 그러나 이제 보십시오, 거룩하신 왕이여. 우리의 많고 큰 죄들 때문에 우리는 압박을 당하고 있으며, 원수들에게 복속되었고, 무력한 상태에 놓여 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ δὲ νῦν
  english_pob_choice: But look now
  chosen_korean: 그러나 이제 보십시오
  alternatives_korean:
  - 보십시오, 이제
  - 보라, 이제
  lexicon: ἰδοὺ
  rationale: 감탄·호소를 현대 한국어의 정중한 명령형으로 살리면서, English POB의 ‘look’에 대응해 직역적 경계를 유지했습니다.
- source_word: ἅγιε Βασιλεῦ
  english_pob_choice: holy King
  chosen_korean: 거룩하신 왕이여
  alternatives_korean:
  - 거룩한 왕이여
  - 성스러운 왕이여
  lexicon: ἅγιος
  rationale: 호칭의 직접성을 살리되 왕에 대한 존칭을 붙여 한국어 호소문투에 맞게 옮겼습니다.
- source_word: καταπονούμεθα
  english_pob_choice: we are being oppressed
  chosen_korean: 우리가 압박을 당하고 있으며
  alternatives_korean:
  - 우리가 억압을 당하고 있으며
  - 우리가 고통받고 있으며
  lexicon: καταπονέω
  rationale: 단순한 심리적 ‘고통’보다 외적 압박과 짓눌림의 뉘앙스가 강해, 현재 진행형 수동의 강도를 살렸습니다.
- source_word: ὑπετάγημεν τοῖς ἐχθροῖς ἡμῶν
  english_pob_choice: we have been subjected to our enemies
  chosen_korean: 원수들에게 복종하게 되었고
  alternatives_korean:
  - 원수들에게 굴복하게 되었고
  - 원수들의 지배 아래 놓이게 되었고
  lexicon: ὑποτάσσω
  rationale: ‘subjected’의 종속·복속 의미를 살리되 한국어에서 자연스러운 상태 서술로 정리했습니다.
