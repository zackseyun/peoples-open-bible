translation:
  text: The moon in the sky among the stars is not as majestic as you. You lit the way to godliness for your seven sons—the equals of the stars—and now stand honored before God and are firmly established in heaven with them.
  philosophy: dynamic
lexical_decisions:
- source_word: σελήνη
  chosen: moon
  alternatives:
  - the moon
  lexicon: LSJ
  rationale: Straightforward celestial term; anarthrous in Greek but naturally definite in English. Kept as 'moon' within the comparison image.
- source_word: σεμνὴ
  chosen: in majesty
  alternatives:
  - noble
  - august
  - dignified
  lexicon: LSJ
  rationale: The adjective conveys dignity or august splendor. 'In majesty' fits the elevated comparison and reads naturally with 'stand' in English.
- source_word: καθεστήκεν / καθεστήκας
  chosen: stand / have come to stand
  alternatives:
  - are established
  - stand fixed
  - have been appointed
  lexicon: LSJ
  rationale: The verb can denote being set or established in a state. Because the verse uses it first of the moon and then of the mother, 'stand' preserves the rhetorical parallel while 'have come to stand' reflects the perfect sense in the second clause.
- source_word: ἰσαστέρους
  chosen: equal to the stars
  alternatives:
  - star-like
  - as many as the stars
  - peer to the stars
  lexicon: LSJ
  rationale: Compound adjective built on 'equal' and 'star'; in context it describes the seven sons by comparison with stars. 'Equal to the stars' is more transparent than a compressed English adjective.
- source_word: παῖδας
  chosen: sons
  alternatives:
  - children
  - boys
  lexicon: LSJ
  rationale: Although παῖδες can mean children broadly, the immediate referent is the woman's seven male offspring in the martyr narrative. 'Sons' is gender-accurate and contextually precise.
- source_word: φωταγωγήσασα
  chosen: having given light
  alternatives:
  - having illumined
  - having led to the light
  - having enlightened
  lexicon: LSJ
  rationale: The participle literally evokes bringing or leading by light. Here the mother is portrayed as directing her sons toward piety. 'Having given light' preserves the luminosity imagery that matches the moon/stars comparison.
- source_word: πρὸς τὴν εὐσέβειαν
  chosen: toward godliness
  alternatives:
  - to piety
  - toward reverence
  lexicon: LSJ
  rationale: εὐσέβεια in this book denotes reverent devotion to God expressed in faithful obedience. 'Godliness' is accessible English and preserves the explicitly religious sense.
- source_word: ἔντιμος
  chosen: honored
  alternatives:
  - precious
  - esteemed
  - held in honor
  lexicon: LSJ
  rationale: The adjective denotes honor or high esteem. 'Honored before God' captures both the predicate force and the dative θεῷ.
- source_word: ἐστήρισαι
  chosen: have been established
  alternatives:
  - have been fixed
  - have been made firm
  - have been set fast
  lexicon: LSJ
  rationale: The passive/perfect sense suggests being firmly set. In the heavenly context, 'have been established in heaven with them' conveys enduring placement.
- source_word: ἐν οὐρανῷ σὺν αὐτοῖς
  chosen: in heaven with them
  alternatives:
  - in the sky with them
  - among them in heaven
  lexicon: LSJ
  rationale: Although οὐρανός can mean sky, the final clause shifts from simile to exalted reward language. 'In heaven with them' best fits the martyrdom context and the contrast with the earlier literal sky imagery.
