translation:
  text: '1. “So clothe yourself with cheerfulness. It always has favor with God and is welcome to him.
    Delight in it. Every cheerful man does good, thinks what is good, and despises sorrow.”


    2. “But a sorrowful man always acts wickedly. First, he acts wickedly because he grieves the Holy
    Spirit given to the human being—a cheerful Spirit.[c] Second, by grieving the Holy Spirit, he does
    lawlessness, neither praying nor confessing to God.[e] The prayer of a sorrowful man never has power
    to ascend to God’s altar.”


    3. I ask, “Why does the prayer[b] of the sorrowful person not ascend to the altar?” He says, “Sorrow
    has settled in his heart. Mixed with the prayer, it does not allow the prayer to ascend pure to the
    altar. Vinegar and wine mixed together[a] do not have the same pleasure. In the same way, sorrow mixed
    with the Holy Spirit does not have the same prayer.”[f]


    4. “So cleanse yourself from this evil sorrow, and you will live to God.[d] Everyone who throws sorrow
    off themselves and clothes themselves with all cheerfulness will live to God.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Epi to auto means together, literally to the same place. The wine-and-vinegar comparison remains
      in the text.
  - marker: b
    reason: lexical_alternative
    text: Prayer renders enteuxis, a petition or supplication. The repeated prayer/ascend/altar imagery
      is retained.
  - marker: c
    reason: lexical_alternative
    text: The working adjective hilaron is rendered as describing the Holy Spirit as cheerful. Given cheerfully
      is an alternative grammatical reading. The text’s difficult moral contrast is preserved without
      inserting a doctrine of the Spirit’s nature.
  - marker: d
    reason: lexical_alternative
    text: Live to God retains the dative tō theō. Live for God is an alternative rendering.
  - marker: e
    reason: textual_variant
    text: Working mē entynchanōn is rendered neither praying, followed by nor confessing to God. Lake1907
      Plate VII lines58–59 instead has mē epitynchanōn, not obtaining/succeeding, and to the Lord. Vulgata
      printed58 describes a sorrowful person praying to the Lord without prior confession and not obtaining
      the request from God; Palatina printed109 has not confessing to God. These are substantial alternatives,
      not interchangeable copies of the working negative clause. The English God follows the current recorded
      source; the former Lord belongs to the retired attached source.
  - marker: f
    reason: textual_variant
    text: The working concluding comparison literally says does not have the same prayer. This difficult
      wording is retained. Vulgata printed58 adds pure to its prayer comparison, while Palatina printed111
      describes an incomplete petition. Those explanatory versional renderings are not inserted into the
      selected Greek translation.
lexical_decisions:
- source_word: ἔνδυσαι
  chosen: clothe yourself
  alternatives:
  - put on
  - wear
  lexicon: BDAG; LSJ
  rationale: Retains the clothing metaphor of the imperative middle voice, echoing the original's concrete
    imagery of adopting a disposition as a garment.
- source_word: ἱλαρότητα / ἱλαρός
  chosen: cheerfulness / cheerful
  alternatives:
  - gladness
  - joyfulness
  - merriness
  lexicon: LSJ; BDAG
  rationale: ἱλαρός/ἱλαρότης denotes a bright, cheerful disposition. "Cheerfulness" keeps moral-psychological
    tone and contrasts naturally with λύπη (sorrow).
- source_word: χάριν
  chosen: favor
  alternatives:
  - grace
  - kindness
  lexicon: BDAG
  rationale: In this context, χάρις is the standing or favor one has with God; "favor" is clearer than
    theological "grace" and fits Hermas's moral register.
- source_word: εὐπρόσδεκτον
  chosen: welcome
  alternatives:
  - acceptable
  - well-pleasing
  lexicon: BDAG
  rationale: Conveys receptivity by God without importing Pauline idiom of "well-pleasing"; "welcome"
    is idiomatic and keeps relational nuance.
- source_word: ἐντρύφα
  chosen: delight yourself
  alternatives:
  - revel
  - luxuriate
  - take pleasure
  lexicon: LSJ
  rationale: The imperative calls for taking pleasure; delight yourself retains that sense without claiming
    a Greek middle-voice form.
- source_word: ἀγαθὰ ἐργάζεται
  chosen: does good
  alternatives:
  - works good
  - does good deeds
  lexicon: BDAG
  rationale: Simple and idiomatic; keeps verbal aspect of active practice without adding "deeds" not in
    the text.
- source_word: ἀγαθὰ φρονεῖ
  chosen: thinks what is good
  alternatives:
  - sets his mind on good
  - has good thoughts
  lexicon: BDAG
  rationale: φρονείν concerns mindset/consideration; "thinks what is good" keeps the ethical-cognitive
    force.
- source_word: λύπη / λυπηρὸς
  chosen: sorrow / sorrowful
  alternatives:
  - grief / grievous
  - gloom / gloomy
  lexicon: BDAG
  rationale: Maintains moralized sorrow that contrasts with cheerfulness in this mandate; "gloom" risks
    modern moodiness rather than moral weight.
- source_word: πονηρεύεται
  chosen: acts wickedly
  alternatives:
  - does evil
  - behaves badly
  lexicon: BDAG
  rationale: Ponēreuomai denotes practicing evil; "acts wickedly" preserves moral gravity.
- source_word: λυπεῖ
  chosen: grieves
  alternatives:
  - distresses
  - makes sorrowful
  lexicon: BDAG
  rationale: Semantically precise for causing grief to the Spirit; also echoes the text's play on λύπη
    without importing foreign idiom.
- source_word: τὸ πνεῦμα τὸ ἅγιον … ἱλαρόν
  chosen: the Holy Spirit … a cheerful [Spirit]
  alternatives:
  - the holy spirit … cheerful (modifying the gift)
  - the holy spirit given to man in cheerfulness
  lexicon: BDAG; LSJ
  rationale: Attributive string most naturally has ἱλαρόν modify πνεῦμα; supplying "Spirit" makes English
    clear that cheerfulness characterizes the Spirit.
- source_word: ἀνομίαν ἐργάζεται
  chosen: works lawlessness
  alternatives:
  - does lawlessness
  - commits wrongdoing
  lexicon: BDAG
  rationale: Keeps the strong biblical-ethical term ἀνομία without dilution, matching Hermas's moral diction.
- source_word: μὴ ἐντυγχάνων
  chosen: not praying
  alternatives:
  - not making petition
  - not interceding
  lexicon: BDAG
  rationale: Given the repeated ἔντευξις, using the general term "praying" communicates the act succinctly;
    context is petitionary prayer.
- source_word: ἐξομολογούμενος
  chosen: confessing
  alternatives:
  - acknowledging (sins)
  - giving thanks
  lexicon: BDAG
  rationale: Confessing is retained with God as the working object; acknowledging or giving thanks remain
    lexical alternatives. No unstated sins object is inserted.
- source_word: ἔντευξις
  chosen: prayer
  alternatives:
  - petition
  - supplication
  - intercession
  lexicon: BDAG
  rationale: While technically a petition, in early Christian usage it overlaps with prayer; "prayer"
    is accessible and matches the altar/ascend imagery.
- source_word: ἀναβῆναι ἐπὶ τὸ θυσιαστήριον
  chosen: to ascend to the altar
  alternatives:
  - to go up to the altar
  - to reach the altar
  lexicon: BDAG
  rationale: '"Ascend" preserves cultic register and the vertical imagery of prayers rising to God''s
    altar.'
- source_word: ἐγκάθηται εἰς τὴν καρδίαν
  chosen: has settled into his heart
  alternatives:
  - sits within his heart
  - lurks in his heart
  lexicon: LSJ
  rationale: Conveys the entrenched, seated presence of sorrow within the heart; "settled" is idiomatic.
- source_word: μεμιγμένα / μεμιγμένη
  chosen: mixed
  alternatives:
  - mingled
  lexicon: BDAG
  rationale: Neutral, clear rendering of the perfect passive of μίγνυμι.
- source_word: ἡδονή
  chosen: pleasure
  alternatives:
  - pleasantness
  - enjoyment
  lexicon: BDAG; LSJ
  rationale: Refers to gustatory enjoyment in the analogy; "pleasure" is direct.
- source_word: ζήσῃ/ζήσονται τῷ θεῷ
  chosen: live to God
  alternatives:
  - live for God
  - live before God
  lexicon: BDAG
  rationale: Retains the dative construction familiar in early Christian idiom without smoothing it; Hermas
    uses this phrasing elsewhere.
- source_word: ἀποβάλωσιν ἀφ᾿ ἑαυτῶν
  chosen: throw off from themselves
  alternatives:
  - cast off from themselves
  - put away from themselves
  lexicon: BDAG
  rationale: Dynamic but literal; preserves reflexive sense and vigor.
- source_word: ἐνδύσωνται πᾶσαν ἱλαρότητα
  chosen: clothe themselves with all cheerfulness
  alternatives:
  - put on every kind of cheerfulness
  - put on full cheerfulness
  lexicon: BDAG; LSJ
  rationale: Echoes the initial clothing metaphor and keeps the intensifier πᾶσαν as "all."
