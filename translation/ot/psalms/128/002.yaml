id: PSA.128.2
reference: Psalms 128:2
source:
  edition: WLC
  text: יְגִ֣יעַ כַּ֭פֶּי/ךָ כִּ֣י תֹאכֵ֑ל אַ֝שְׁרֶ֗י/ךָ וְ/ט֣וֹב לָֽ/ךְ׃
translation:
  text: For you will eat the fruit of your labor[a]; blessed are you, and it will be well with you.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, the verse may read, “When you eat the fruit of your labor, you are blessed, and it is well with you.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְגִיעַ
  chosen: labor
  alternatives:
  - toil
  - fruit of labor
  - produce
  lexicon: HALOT
  rationale: The noun denotes the product or result of labor, often with the nuance of hard-earned toil. In English, 'eat your labor' is awkward, so the idiomatic sense is brought out with 'the fruit of your labor,' while preserving the concrete image of enjoying what one's hands have produced.
- source_word: כַּפֶּיךָ
  chosen: your
  alternatives:
  - your hands
  - your palms
  lexicon: HALOT
  rationale: Literally 'your hands/palms.' Because English naturally expresses the Hebrew genitive phrase as 'the fruit of your labor,' the explicit body-part term is absorbed into the idiom rather than translated woodenly. The sense remains that the labor is done by the person's own hands.
- source_word: כִּי
  chosen: When
  alternatives:
  - when
  - indeed
  - because
  lexicon: HALOT
  rationale: In this construction it introduces the circumstance of the blessing.
- source_word: תֹאכֵל
  chosen: you will eat
  alternatives:
  - you shall eat
  - you eat
  lexicon: HALOT
  rationale: The imperfect is rendered as a simple future in context, expressing the expected result of fearing the LORD and walking in his ways. 'Eat' preserves the concrete metaphor of enjoying provision.
- source_word: אַשְׁרֶיךָ
  chosen: you are blessed
  alternatives:
  - happy are you
  - fortunate are you
  lexicon: HALOT
  rationale: This renders the verbless beatitude in ordinary English while retaining its declarative force.
- source_word: וְטוֹב לָךְ
  chosen: it is well with you
  alternatives:
  - good will be yours
  - it is good for you
  - it will go well for you
  lexicon: HALOT
  rationale: The verbless clause states well-being and need not be made future.
- source_word: יְגִיעַ כַּפֶּיךָ
  chosen: the fruit of your labor
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The expression refers to the yield or product of one's work; this is the natural English idiom for eating/enjoying it.
