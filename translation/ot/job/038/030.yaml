id: JOB.38.30
reference: Job 38:30
source:
  edition: WLC
  text: כָּ֭/אֶבֶן מַ֣יִם יִתְחַבָּ֑אוּ וּ/פְנֵ֥י תְ֝ה֗וֹם יִתְלַכָּֽדוּ׃
translation:
  text: The waters become hard like stone[a], and the surface of the deep freezes solid.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the waters hide themselves like stone”; the Hebrew verb is unusual in this freezing context.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֶבֶן
  chosen: like stone
  alternatives:
  - as stone
  - into stone
  lexicon: HALOT
  rationale: The prefixed כ marks comparison, so the phrase is best rendered simile-wise as 'like stone' rather than a stronger transformational 'into stone.' 'Stone' is more natural than 'rock' here and matches the image of hardening/freezing.
- source_word: מַיִם
  chosen: the waters
  alternatives:
  - water
  lexicon: HALOT
  rationale: Though formally plural, מַיִם commonly functions as a mass noun. 'The waters' preserves the Hebrew plural form and suits the poetic, cosmic setting of Job 38.
- source_word: יִתְחַבָּאוּ
  chosen: become hard
  alternatives:
  - hide themselves
  - congeal
  - are hidden
  lexicon: HALOT
  rationale: Although the verb ordinarily means “hide themselves,” the stone comparison and parallel description of the deep indicate the contextual effect of freezing. The literal image is retained in the note.
- source_word: וּפְנֵי
  chosen: and the surface of
  alternatives:
  - and the face of
  lexicon: HALOT
  rationale: Hebrew 'face(s) of' often idiomatically means 'surface of' when used of waters or the deep. 'Surface' gives the natural English sense without losing the concrete imagery.
- source_word: תְהוֹם
  chosen: the deep
  alternatives:
  - the abyss
  - the primeval deep
  lexicon: HALOT
  rationale: '''The deep'' is the standard, contextually fitting rendering for תהום in cosmic and watery contexts. ''Abyss'' is possible but sounds more interpretive and less natural here.'
- source_word: יִתְלַכָּדוּ
  chosen: congeals
  alternatives:
  - is seized
  - is locked together
  - congeals
  lexicon: HALOT
  rationale: The verb depicts the surface being caught or joined fast. In this freezing context, “congeals” expresses the result naturally while preserving more of that binding sense than the generic “is frozen.”
