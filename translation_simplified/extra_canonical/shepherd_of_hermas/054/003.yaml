  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/003.yaml
  text: “These commandments are beneficial for those who are about to repent; for if they do not walk in them, their repentance is in vain.
translation:
  language: en
  text: These commandments help those who are ready to repent[a]. But if they do not live by them, their repentance is useless.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
