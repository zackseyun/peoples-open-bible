    rationale: 라틴어는 ‘끝은 드러나 있다’라고 독립적으로 진술합니다. ‘도’는 원문에 없는 병렬 강조를 약하게 보태므로 제거하는 편이 더 정확합니다.
  - severity: low
    issue: 각주가 대안 독법을 실질적으로 제시하지 못함
    rationale: 현 각주는 본문과 거의 같고 난해한 구문의 성격도 설명하지 못합니다. 본문 의미를 단정하지 않는 범위에서 해당 라틴어 구문이 불명확하다는 점을 밝혀야 합니다.
