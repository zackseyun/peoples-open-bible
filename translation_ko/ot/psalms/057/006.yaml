  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֶ֤שֶׁת הֵכִ֣ינוּ לִ/פְעָמַ/י֮ כָּפַ֪ף נַ֫פְשִׁ֥/י כָּר֣וּ לְ/פָנַ֣/י שִׁיחָ֑ה נָפְל֖וּ בְ/תוֹכָ֣/הּ סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/006.yaml
  text: They prepared a net for my steps[a]; my soul was bowed down[b]; they dug a pit before me; they fell into the midst of it[c]. Selah
  footnotes:
  - marker: a
    text: Or “a snare for my feet.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “my soul” can also mean “I” or “my life.” The Hebrew verb is formally active, though its subject is not explicit.
    reason: alternative_reading
  - marker: c
    text: Literally “they fell in its midst.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 걸음에 그물을 준비하였습니다. 내 영혼은 눌렸습니다. 그들은 내 앞에 구덩이를 팠습니다. 그들이 그 가운데에 떨어졌습니다. 셀라.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: רֶשֶׁת / net
  english_pob_choice: net
  chosen_korean: 그물
  alternatives_korean:
  - 올무
  - 함정
  lexicon: HALOT
  rationale: רֶשֶׁת은 포획용 그물을 가리키므로, 한국어에서는 구체적인 물체감이 살아 있는 ‘그물’이 가장 직접적입니다.
- source_word: לִפְעָמַי / for my steps
  english_pob_choice: for my steps
  chosen_korean: 내 걸음
  alternatives_korean:
  - 내 발
  - 내 길
  lexicon: HALOT
  rationale: 복수형 ‘steps’의 보폭/행로 이미지를 살리기 위해 ‘내 걸음’으로 옮겼습니다.
- source_word: כָּפַף נַפְשִׁי / my soul was bowed down
  english_pob_choice: my soul was bowed down
  chosen_korean: 내 영혼은 눌렸습니다
  alternatives_korean:
  - 내 영혼은 굽어졌습니다
  - 내 생명은 눌렸습니다
  - 나는 낙심했습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘영혼/생명/자기 자신’ 중 어디까지나 시적 표현을 보존하되, ‘눌리다’가 굽힘과 억눌림을 함께 살려 합쇼체 문맥에 자연스럽게 맞습니다.
- source_word: בְתוֹכָהּ / in the midst of it
  english_pob_choice: into the midst of it
  chosen_korean: 그 가운데에
  alternatives_korean:
  - 그 속에
  - 그 한가운데에
  lexicon: HALOT
  rationale: ‘in/into its midst’의 반전 효과를 유지하면서도 한국어 시어로 자연스러운 ‘그 가운데에’를 택했습니다.
theological_decisions:
- issue: סֶלָה의 처리
  chosen_reading: ‘셀라’로 음역해 본문에 남겼습니다.
  alternative_readings:
  - 의미를 추정해 생략
  - 음악적 지시로 풀어 번역
  rationale: 용례가 불확실한 시편의 표지이므로 추정 번역보다 음역 보존이 본문 충실성과 감사 가능성을 높입니다.
  doctrine_reference: 시편의 전례적/음악적 표지 보존 원칙
