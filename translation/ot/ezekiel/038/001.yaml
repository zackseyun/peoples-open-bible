id: EZK.38.1
reference: Ezekiel 38:1
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
translation:
  text: 'The word of Yahweh came to me:'
  philosophy: dynamic
lexical_decisions:
- source_word: וַיְהִי
  chosen: came
  alternatives:
  - was
  - happened
  lexicon: HALOT
  rationale: Although the clause is literally 'and it was,' in the prophetic formula ויהי דבר־יהוה אלי the idiomatic English equivalent is 'the word of the LORD came to me.' Rendering the verb as 'came' reflects the sense of the full expression in natural English without over-paraphrase.
- source_word: דְבַר
  chosen: the word
  alternatives:
  - message
  - matter
  lexicon: HALOT
  rationale: דבר in this prophetic formula commonly denotes the divine word/message. 'The word' preserves the established prophetic idiom and keeps the lexical connection to divine speech.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: אֵלַי
  chosen: to me
  alternatives:
  - unto me
  lexicon: HALOT
  rationale: The preposition plus first-person suffix straightforwardly indicates direction toward the prophet. 'To me' is clear modern English.
- source_word: לֵאמֹר
  chosen: saying
  alternatives:
  - to say
  lexicon: HALOT
  rationale: This infinitive construct regularly introduces the following divine speech. 'Saying' is the standard and natural English rendering in this formula.
