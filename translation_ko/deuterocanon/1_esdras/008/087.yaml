    rationale: 그리스어는 ‘뿌리로/뿌리 하나로 남겨졌다’라고 말할 뿐 ‘~처럼’에 해당하는 비교 표지가 없습니다. 따라서 비유 이미지는 유지하되 비교 표현은 제거하는 편이 정확합니다.
  - severity: low
