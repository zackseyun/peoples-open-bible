  from: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
  to: Look, before God I am like you[a]; I too was pinched from clay.[b]
  rationale: “Your mouthpiece before God” chooses a specific representative role from a compressed and disputed phrase; it is too interpretive for the main text. The immediate assertion that Elihu too is fashioned from clay favors the minimally interpretive comparison of Elihu and Job before God. “Pinched from clay” retains the concrete formative image of קֹרַצְתִּי and is natural English. The literal note should identify the phrase as uncertain rather than presenting a speculative gloss as its straightforward literal sense.
