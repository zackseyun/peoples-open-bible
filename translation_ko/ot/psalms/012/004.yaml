  text: 그들은 이렇게 말합니다. “우리 혀로 우리가 이길 것입니다.[a] 우리 입술은 우리 편이니,[b] 누가 우리를 다스릴 주인이겠습니까?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 혀로 우리가 강해질 것입니다.’ 히브리어의 전치사는 수단을 나타내는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우리 입술은 우리와 함께 있다’입니다. ‘우리 입술은 우리의 것이다’ 또는 ‘우리 입술은 우리 편이다’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘누가 우리의 주인이겠습니까?’ 여기의 ‘주인’은 하나님의 고유 칭호로 단정되지 않으며, 자신들을 지배할 권위자가 없다는 오만한 주장을 나타냅니다.
    reason: alternative_reading
