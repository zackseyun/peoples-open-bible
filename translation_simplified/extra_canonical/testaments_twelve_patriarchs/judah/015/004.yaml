base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/004.yaml
  text: And indeed, having repented concerning these things, I ate neither wine nor meat until my old age, and I saw no joy at all.
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:57:12Z'
    unchanged: false
    changes_summary: Replaced 'although I changed my mind' with 'indeed, having repented' to reflect μετανοήσας more accurately and Καίγε more naturally; retained the rest with minor smoothing.
translation:
  language: en
  text: Indeed, after reorienting[r1] away from these things, I did not drink wine or eat meat until I was old. I experienced no joy at all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I ate neither wine nor meat until my old age
  simplified_phrase: I did not drink wine or eat meat until I was old
  preserved_meaning: He consumed neither wine nor meat up to his old age.
  reasoning_layer_used: POB text and immediate Greek clause
  rationale: Separate verbs remove the unnatural idea of eating wine without changing the abstinence described.
- pob_phrase: I saw no joy at all
  simplified_phrase: I experienced no joy at all
  preserved_meaning: He had no experience of joy.
  reasoning_layer_used: POB text and source idiom
  rationale: Experienced states the idiomatic sense of saw in clear modern English.
translation_notes:
  risk_flags:
  - risk: Using separate verbs for wine and meat is less formally parallel to the Greek verb.
    mitigation: The rendering preserves the same two prohibited items in natural English.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
