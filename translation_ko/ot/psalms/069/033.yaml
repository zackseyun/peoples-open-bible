  lexicon: HALOT
  rationale: עֲנָוִים은 시편에서 겸손함과 낮아짐을 가리키며 때로는 억눌린 이들과 겹치므로, ‘겸손한 이들’이 본문의 핵심 의미를 가장 직접적으로 살립니다.
- source_word: רָאוּ ... יִשְׂמָחוּ
