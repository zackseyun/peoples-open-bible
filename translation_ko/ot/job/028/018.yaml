  - 산호와 빙정
  lexicon: רָאמ֣וֹת / גָבִישׁ
  rationale: 두 명사 모두 보석성·장식성의 광물/유사 광물을 가리키므로 한국어에서도 자연스럽고 문어적인 표준어인 ‘산호와 수정’으로 옮겼습니다.
- source_word: לֹא יִזָּכֵר
  english_pob_choice: are not worth mentioning
  chosen_korean: 언급할 가치도 없고
  alternatives_korean:
  - 기억되지 않고
  - 말할 만하지 않고
  lexicon: זכר
  rationale: 직역상 ‘기억되다’이지만 문맥상 지혜의 가치를 강조하는 비교절이므로, POB의 의미를 살려 ‘언급할 가치도 없다’로 자연스럽게 표현했습니다.
- source_word: מֶשֶׁךְ חָכְמָה
  english_pob_choice: the price of wisdom
  chosen_korean: 지혜의 값
  alternatives_korean:
  - 지혜의 값어치
  - 지혜의 대가
  lexicon: משך / חכמה
  rationale: English POB가 ‘price’를 채택했으므로, 매매·교환 가치의 대비를 살려 ‘값’으로 옮겼습니다.
- source_word: מִפְּנִינִים
  english_pob_choice: above pearls
  chosen_korean: 진주보다 높습니다
  alternatives_korean:
  - 진주보다 더 귀합니다
  - 진주를 능가합니다
  lexicon: פנינים
  rationale: 비교 구조를 그대로 살리면서, 가치의 우위를 현대 한국어로 분명히 드러내기 위해 ‘~보다 높습니다’로 번역했습니다.
