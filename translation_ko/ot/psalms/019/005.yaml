source:
  edition: WLC
  text: וְ/ה֗וּא כְּ֭/חָתָן יֹצֵ֣א מֵ/חֻפָּת֑/וֹ יָשִׂ֥ישׂ כְּ֝/גִבּ֗וֹר לָ/ר֥וּץ אֹֽרַח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/005.yaml
  text: It is like a bridegroom coming out of his wedding chamber[a]; it rejoices like a warrior running a course.
  footnotes:
  - marker: a
    text: Or 'from his canopy' or 'from his bridal chamber.' The Hebrew חֻפָּה can refer to a wedding canopy or a bridal chamber.
