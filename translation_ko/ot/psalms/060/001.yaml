  rationale: 이 표기는 저작, 연관, 헌정 모두 가능하므로, 영어 POB와 같이 소속/연관을 열어 두는 소유격 표현을 택했습니다.
- source_word: לְלַמֵּד
  english_pob_choice: for teaching
  chosen_korean: 교훈을 위해
  alternatives_korean:
