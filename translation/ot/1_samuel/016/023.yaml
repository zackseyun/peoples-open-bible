theological_decisions:
- issue: How to render רוּחַ אֱלֹהִים in the first clause in relation to the later רוּחַ הָרָעָה
  chosen_reading: Render the first phrase literally as 'the spirit of God' and the later phrase as 'the harmful spirit,' without harmonizing them in translation.
  alternative_readings:
  - Render the first phrase as 'the harmful spirit from God' for contextual clarity
  - Render the later phrase as 'the evil spirit'
  rationale: The Hebrew text itself uses different expressions in the two clauses. Preserving that distinction is more auditable and avoids importing an interpretive synthesis into the first clause. At the same time, 'harmful spirit' for רוּחַ הָרָעָה reflects the contextual sense of affliction rather than making an unnecessary doctrinal claim about the spirit's moral character.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
