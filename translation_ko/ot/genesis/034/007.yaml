  text: וּ/בְנֵ֨י יַעֲקֹ֜ב בָּ֤אוּ מִן הַ/שָּׂדֶה֙ כְּ/שָׁמְעָ֔/ם וַ/יִּֽתְעַצְּבוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹ֑ד כִּֽי נְבָלָ֞ה עָשָׂ֣ה בְ/יִשְׂרָאֵ֗ל לִ/שְׁכַּב֙ אֶת בַּֽת יַעֲקֹ֔ב וְ/כֵ֖ן לֹ֥א יֵעָשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: ko
  text: 야곱의 아들들은 그 소식을 듣고 들에서 돌아왔습니다. 그들은 몹시 근심하고 분노하였습니다. 그가 야곱의 딸과 동침하여 이스라엘에서 수치스러운 일을 저질렀기 때문입니다. 그런 일은 해서는 안 되는 일이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/יִּתְעַצְּבוּ
  english_pob_choice: the men were grieved
  chosen_korean: 그 사람들은 슬퍼하며
  alternatives_korean:
  - 그 사람들은 근심하며
  - 그 사람들은 마음 아파하며
  lexicon: עצב
  rationale: 문맥상 단순한 감정 표현이므로 과장하지 않고 ‘슬퍼하다’로 옮기되, 행위 주체를 분명히 하려고 서술형으로 처리했습니다.
- source_word: וַ/יִּחַר לָ/הֶ֖ם מְאֹ֑ד
  english_pob_choice: and very angry
  chosen_korean: 몹시 분노하였습니다
  alternatives_korean:
  - 크게 노하였습니다
  - 매우 화가 났습니다
  lexicon: חרה
  rationale: 히브리어 관용구의 강한 분노를 반영하여 ‘몹시 분노하다’로 옮겼습니다.
- source_word: נְבָלָה
  english_pob_choice: an outrageous thing
  chosen_korean: 부끄러운 일
  alternatives_korean:
  - 망령된 일
  - 수치스러운 일
  - 패륜적인 일
  lexicon: נבלה
  rationale: POB가 ‘outrageous thing’으로 유지한 도덕적·사회적 심각성을 살리되, 한국어에서는 문맥상 과도한 추상화를 피하고 ‘부끄러운 일’로 옮겼습니다.
- source_word: וְ/כֵן לֹ֥א יֵעָשֶֽׂה־־־־
  english_pob_choice: for such a thing must not be done
  chosen_korean: 그런 일은 해서는 안 되기 때문입니다
  alternatives_korean:
  - 그런 일은 결코 해서는 안 되기 때문입니다
  - 그런 일은 있어서는 안 되기 때문입니다
  lexicon: עשה
  rationale: 히브리어 수동/일반금지 표현을 한국어의 관용적 금지문으로 옮겨, 사건의 도덕적 금기성을 분명히 했습니다.
theological_decisions:
- issue: 야곱의 아들들의 감정과 평가를 서술하는 방식
  chosen_reading: 서술어를 평서형으로 유지해 본문이 그들의 실제 반응과 공동체적 판단을 그대로 말하게 했습니다.
  alternative_readings:
  - 감정 중심으로 완화하여 ‘마음이 아팠습니다’로 옮김
  - 도덕 판단을 약화해 ‘좋지 않은 일이었습니다’로 옮김
  rationale: 본문은 단순한 정서 반응을 넘어 이스라엘 가운데 벌어진 중대한 수치와 금기를 드러내므로, 그 강도를 약화하지 않았습니다.
  doctrine_reference: 공동체의 거룩함과 성적 범죄의 심각성에 관한 창세기 서술
