  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Metaphorical leadership term רֹעִים
  chosen_reading: shepherds
  alternative_readings:
  - leaders
  - pastors
  rationale: The Hebrew metaphor is retained rather than interpreted away as 'leaders.' This preserves the prophetic imagery and theological resonance of failed shepherding without importing later church-office terminology.
