  meaning_decisions:
  - source_phrase: דֹרֵשׁ דָּמִים
    prior_rendering: the one who calls bloodshed to account
    new_rendering: he who demands an accounting for bloodshed
    rationale: This preserves the judicial accounting established by the later review while avoiding the awkward English construction in which bloodshed itself is called to account.
  - source_phrase: אוֹתָם זָכָר לֹא שָׁכַח צַעֲקַת עניים
    prior_rendering: remembers them; he does not forget the cry of the afflicted
    new_rendering: remembers the afflicted; he does not forget their cry
    rationale: Naming the afflicted in the first clause prevents “them” from being mistaken for the peoples mentioned in verse 11; the second clause retains the same people and their cry.
