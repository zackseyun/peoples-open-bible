id: PSA.94.16
reference: Psalms 94:16
source:
  edition: WLC
  text: מִֽי יָק֣וּם לִ֭/י עִם מְרֵעִ֑ים מִֽי יִתְיַצֵּ֥ב לִ֝/י עִם פֹּ֥עֲלֵי אָֽוֶן־־־־׃
translation:
  text: Who will rise up for me against evildoers? Who will take a stand for me against those who practice iniquity?
  philosophy: dynamic
lexical_decisions:
- source_word: מִי
  chosen: Who
  lexicon: HALOT
  rationale: Interrogative pronoun introducing both parallel questions; straightforwardly rendered as 'Who'.
- source_word: יָקוּם
  chosen: will rise up
  alternatives:
  - will stand up
  - will arise
  lexicon: HALOT
  rationale: Qal imperfect of קום in a context of opposition/support. 'Rise up' preserves the vivid verbal image and the future-like/modal force of the imperfect in this rhetorical question.
- source_word: לִי
  chosen: for me
  alternatives:
  - to me
  - on my behalf
  lexicon: HALOT
  rationale: The preposition ל here marks advantage/benefit rather than simple direction. 'For me' is idiomatic and fits the plea for an advocate or ally.
- source_word: עִם
  chosen: against
  alternatives:
  - with
  - alongside ... against
  lexicon: HALOT
  rationale: Although עִם commonly means 'with,' in this adversarial context with hostile parties it carries the sense of confrontation or opposition. English 'against' best communicates the force of the psalmist's question.
- source_word: מְרֵעִים
  chosen: evildoers
  alternatives:
  - those who do evil
  - wrongdoers
  lexicon: HALOT
  rationale: Hiphil participial form from רעע/רוע, denoting people who do evil. 'Evildoers' is concise, natural, and preserves the moral category.
- source_word: יִתְיַצֵּב
  chosen: will take a stand
  alternatives:
  - will take a stand
  - will station himself
  lexicon: HALOT
  rationale: The Hitpael expresses taking or stationing oneself in a firm posture.
- source_word: פֹּעֲלֵי אָוֶן
  chosen: those who do wrong
  alternatives:
  - workers of evil
  - doers of wickedness
  lexicon: HALOT
  rationale: Natural English for people who practice morally harmful conduct.
- source_word: אָוֶן
  chosen: iniquity
  alternatives:
  - evil
  - wickedness
  - trouble
  lexicon: HALOT
  rationale: אָוֶן can denote wickedness, trouble, or harmful wrongdoing depending on context. Here, paired with 'workers of,' it most naturally denotes moral evil; 'iniquity' preserves that ethical sense and the traditional resonance of the phrase.
