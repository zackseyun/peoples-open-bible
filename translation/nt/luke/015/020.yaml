  - Expand the language to make explicit theological symbolism about God
  rationale: The verse itself presents the father's compassionate initiative with strong narrative verbs. The translation should preserve that force without importing doctrinal interpretation beyond the text. This aligns with preserving theological tension and avoiding paraphrastic expansion.
