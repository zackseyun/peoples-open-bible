id: JDT.11.7
reference: Judith 11:7
source:
  edition: lxx-swete-1909
  text: ζῇ γὰρ βασιλεὺς Ναβουχοδονόσορ πάσης τῆς γῆς καὶ ζῇ τὸ κράτος αὐτοῦ, ὃς ἀπέστειλέν σε εἰς κατόρθωσιν πάσης ψυχῆς, ὅτι οὐ μόνον ἄνθρωποι διὰ σὲ δουλεύσουσιν αὐτῷ, ἀλλὰ καὶ τὰ θηρία τοῦ ἀγροῦ καὶ τὰ κτήνη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ διὰ τῆς ἰσχύος σου ζήσονται Ναβουχοδονόσορ καὶ πάντα τὸν οἶκον αὐτοῦ.
  language: Greek
  pages:
