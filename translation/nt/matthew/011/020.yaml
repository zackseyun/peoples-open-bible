theological_decisions:
- issue: Rendering δυνάμεις in a miracle context
  chosen_reading: mighty works
  alternative_readings:
  - miracles
  - works of power
  rationale: The verse refers to Jesus' powerful deeds performed in the cities. 'Mighty works' preserves the Greek term's emphasis on power and avoids importing a narrower modern category where the source uses a broader expression.
  doctrine_reference: Translation philosophy §1, §5
- issue: Context-sensitive reorientation terminology
  chosen_reading: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not reorient toward God.
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
