translation:
  text: The cases involving the men who had married foreign women[a] were concluded by the first day[b] of the first month.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'The Greek wording is difficult: it describes the men as ''having been gathered together'' before mentioning foreign women; the marital sense follows the context and Ezra 10:17.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the new moon of the first month.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦχθη ἐπὶ πέρας
  chosen: was brought to an end
  alternatives:
  - was completed
  - came to an end
  - was concluded
  lexicon: LSJ
  rationale: The passive idiom literally means 'was brought to an end/limit.' 'Was brought to an end' preserves the passive sense and the idea of completion without sounding wooden.
- source_word: τὰ κατὰ τοὺς ἄνδρας
  chosen: the matter concerning the men
  alternatives:
  - the cases concerning the men
  - what concerned the men
  lexicon: LSJ
  rationale: The neuter plural with κατά is idiomatic for 'the matters/cases concerning.' Because the context is a judicial inquiry, 'the matter concerning the men' communicates the sense naturally in English while remaining close to the Greek.
- source_word: τοὺς ἐπισυναχθέντας
  chosen: who had taken
  alternatives:
  - who had been assembled
  - who had gathered together
  lexicon: LSJ
  rationale: The transmitted Greek form ordinarily suggests 'having been gathered together,' but in this context the MT parallel indicates the sense is about men who had married/taken foreign women. Given the verse-level major mismatch flag and the explicit instruction to use the parallel source as translation input, the English follows the contextual sense reflected by the Hebrew parallel rather than a wooden rendering that would produce awkward or likely corrupt sense in English.
- source_word: γυναῖκας ἀλλογενεῖς
  chosen: foreign women
  alternatives:
  - women of another race
  - women from other peoples
  lexicon: LSJ
  rationale: ἀλλογενής denotes someone of another people/foreign stock. 'Foreign women' is the standard clear rendering in this Ezra context and matches the Hebrew parallel נָשִׁים נָכְרִיּוֹת.
- source_word: ἕως τῆς νουμηνίας τοῦ πρώτου μηνός
  chosen: by the new moon of the first month
  alternatives:
  - until the new moon of the first month
  - up to the first day of the first month
  lexicon: LSJ
  rationale: νουμηνία is specifically 'new moon,' often marking the first day of the month. With the completion idiom, English 'by the new moon' expresses the deadline naturally while preserving the calendrical reference.
