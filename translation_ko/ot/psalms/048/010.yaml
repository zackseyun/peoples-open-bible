id: PSA.48.10
reference: Psalms 48:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/שִׁמְ/ךָ֤ אֱלֹהִ֗ים כֵּ֣ן תְּ֭הִלָּתְ/ךָ עַל קַצְוֵי אֶ֑רֶץ צֶ֝֗דֶק מָלְאָ֥ה יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/010.yaml
  text: As your name, O God, so your praise reaches to the ends of the earth[a]; your right hand is full of righteousness[b].
  footnotes:
  - marker: a
    text: Or “your praise is over the ends of the earth.” The Hebrew preposition is literally “upon/over.”
    reason: lexical_alternative
  - marker: b
    text: Or “justice.” The Hebrew צֶדֶק can denote righteousness or justice.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님, 주의 이름과 같이 주의 찬양도 땅 끝까지 이릅니다. 주의 오른손에는 의[a]가 가득합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의’. 히브리어 צֶדֶק은 ‘의’ 또는 ‘정의’를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דִּמִּינוּ
  english_pob_choice: We have reflected
  chosen_korean: 묵상하였습니다
  alternatives_korean:
  - 생각하였습니다
  - 되새겼습니다
  - 숙고하였습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 사고보다 마음에 깊이 머무르며 곱씹는 뜻을 살리므로, 예배 맥락에 어울리는 ‘묵상하다’가 가장 자연스럽습니다.
- source_word: חַסְדֶּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 주의 인자하심
  alternatives_korean:
  - 주의 변함없는 사랑
  - 주의 언약 사랑
  - 주의 긍휼
  lexicon: HALOT
  rationale: חֶסֶד의 핵심인 신실하고 언약적인 사랑을 살리면서, 한국어 성경에서 널리 이해되는 ‘인자하심’으로 품위를 유지했습니다. ‘긍휼’은 의미가 좁아지고, ‘사랑’만으로는 충성의 뉘앙스가 약합니다.
- source_word: בְּקֶרֶב הֵיכָלֶךָ
  english_pob_choice: in the midst of your temple
  chosen_korean: 주의 성전 한가운데서
  alternatives_korean:
  - 주의 성전 가운데서
  - 주의 성전 안에서
  - 주의 궁전 한가운데서
  lexicon: HALOT
  rationale: 공간적 한복판을 가리키는 표현이므로 ‘한가운데서’가 시적 강조를 가장 잘 보존합니다. הֵיכָל은 문맥상 ‘성전’이 분명합니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 오 하나님
  alternatives_korean:
  - 하나님
  - 오 하나님이여
  lexicon: HALOT
  rationale: 직접 호격이므로 한국어에서 기도·찬양의 자연스러운 호칭인 ‘오 하나님’으로 옮겨, 발화 대상이 분명히 드러나게 했습니다.
theological_decisions:
- issue: חֶסֶד의 의미 범위
  chosen_reading: ‘인자하심’으로 번역해 언약적·신실한 사랑의 무게를 살렸습니다.
  alternative_readings:
  - 긍휼
  - 사랑
  - 언약 사랑
  rationale: 이 시편의 문맥은 단순한 감정적 애정이 아니라 하나님 성품의 신실함을 묵상하는 자리이므로, 전통적이면서도 의미를 충분히 담는 ‘인자하심’을 채택했습니다.
  doctrine_reference: Translation philosophy §6; consistency of key terms §5
- issue: אֱלֹהִים의 호격 처리
  chosen_reading: 문맥상 직접 호칭이므로 ‘오 하나님’으로 처리했습니다.
  alternative_readings:
  - 하나님
  rationale: 호격을 드러내지 않으면 화자의 예배적 직접성이 약해지므로, 본문이 실제로 하나님께 말을 거는 구조를 한국어에서도 분명히 했습니다.
  doctrine_reference: Translation philosophy §6
