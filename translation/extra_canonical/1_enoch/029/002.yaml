translation:
  text: And there I saw trees of judgment[a], giving off[b] the fragrance of frankincense and myrrh; and
    their trees resembled nut-bearing trees[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The printed Charles 1906 Geʿez has †ኵነኔ, judgment, marked corrupt; the printed Greek parallel
      likewise has κρίσεως. Charles proposes fragrant in printed page 69 notes 14 and 27. That is an editorial
      conjecture, not the reading printed in either main text. Judgment remains semantically difficult.
    reason: textual_uncertainty
  - marker: b
    text: 'The Geʿez †ፈድፋደ is marked corrupt. Giving off follows the editor’s repair corresponding to
      the printed Greek πνέοντα, not an unproblematic Geʿez reading. The following bracketed [ቈስቍስ፡] is
      untranslated: printed note 29 calls it unintelligible and an intrusion if the Greek is right, while
      considering a corrupt tree name.'
    reason: textual_uncertainty
  - marker: c
    text: Only the final parenthesized comparison noun (ከርካዕ።) is editor-supplied in the Geʿez with assistance
      from the Greek; the preceding resemblance words are printed without parentheses. Charles 1906 printed
      page 69 notes 18 and 29 and page 70 note 2 explain the supply. Greek καρύαις means nut-bearing trees
      of several kinds; almond is one proposed identification, not a proven species or independently attested
      Ethiopic manuscript clause.
    reason: editorial_supply
