  source_fidelity: 'O rascunho transmite corretamente os elementos centrais: a filiação dirigida a Deus (αὐτῷ εἰς υἱούς), a qualificação ἐν ἀληθείᾳ, a metáfora de caminhar (πορεύεσθε) e a referência aos mandamentos primeiros e últimos. A revisão preserva essas relações sem resolver a ambiguidade de «em verdade».'
  naturalness: «Sereis para ele filhos» é excessivamente calcado na sintaxe grega e pouco natural no português moderno. «Sereis seus filhos» expressa idiomaticamente a mesma relação. Além disso, a repetição de «nos» antes de «primeiros e últimos» pesa a frase sem ser necessária.
  terminology: «Filhos», «em verdade», «andareis» e «mandamentos» são escolhas adequadas, de registro digno e bíblico, sem impor interpretação teológica adicional.
