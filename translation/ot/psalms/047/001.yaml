id: PSA.47.1
reference: Psalms 47:1
source:
  edition: WLC
  text: כָּֽל הָ֭/עַמִּים תִּקְעוּ כָ֑ף הָרִ֥יעוּ לֵ֝/אלֹהִ֗ים בְּ/ק֣וֹל רִנָּֽה־־׃
translation:
  text: Clap your hands, all peoples; shout to God with a cry of joy.
  philosophy: dynamic
lexical_decisions:
- source_word: כָּל הָעַמִּים
  chosen: all peoples
  alternatives:
  - all nations
  - all you peoples
  lexicon: HALOT
  rationale: כָּל with הָעַמִּים addresses the totality of the peoples. 'Peoples' preserves the plural ethnic/corporate sense better than the more political 'nations.'
- source_word: תִּקְעוּ כָף
  chosen: Clap your hands
  alternatives:
  - strike the palm
  - clap the hand
  lexicon: HALOT
  rationale: The idiom תקע כף means to strike or clap the hand/palm. In English the natural imperative is 'Clap your hands,' which conveys the plural addressees and the celebratory action.
- source_word: הָרִיעוּ
  chosen: shout
  alternatives:
  - raise a shout
  - cry out in triumph
  lexicon: HALOT
  rationale: The Hiphil imperative of רוע commonly denotes raising a loud shout, often in jubilation or acclamation. 'Shout' is concise and fits the parallel with clapping.
- source_word: לֵאלֹהִים
  chosen: to God
  alternatives:
  - for God
  lexicon: HALOT
  rationale: The preposition ל here marks direction of the acclamation. 'To God' is the most straightforward rendering in context.
- source_word: בְּקוֹל רִנָּה
  chosen: with a cry of joy
  alternatives:
  - with a joyful voice
  - with the sound of rejoicing
  - with a voice of triumph
  lexicon: HALOT
  rationale: This preserves the audible image of קוֹל and the jubilant cry/rejoicing sense of רִנָּה in natural English.
