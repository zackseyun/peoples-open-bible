translation:
  language: ko
  text: 그런데 유다가 자기 동족에게 벌어진 잔혹한 일을 알게 되자, 그와 함께 있던 사람들에게 명령한 뒤,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταλαβὼν
  english_pob_choice: learned of
  chosen_korean: 알게 되자
  alternatives_korean:
  - 전해 듣자
  - 알아차리자
  - 접하자
  lexicon: μεταλαμβάνω
  rationale: 여기서는 단순한 ‘받다’보다 사건을 인지하고 알게 된 뜻이므로, 영어 POB의 “learned of”에 맞춰 자연스러운 과거 인지 표현인 ‘알게 되자’로 옮겼습니다.
- source_word: τὴν γεγονυῖαν εἰς τοὺς ὁμοεθνεῖς ὠμότητα
  english_pob_choice: the cruelty that had been committed against his own people
  chosen_korean: 자기 민족에게 자행된 잔혹함
  alternatives_korean:
  - 자기 동족에게 일어난 잔인한 일
  - 자기 민족에게 저질러진 잔혹행위
  lexicon: ὠμότης / γίνομαι
  rationale: ‘γεγονυῖαν’은 이미 벌어진 상태를 가리키고, ‘εἰς τοὺς ὁμοεθνεῖς’는 대상이 된 ‘자기 민족’이므로, 행위의 가해성까지 드러내는 ‘자행된 잔혹함’으로 압축했습니다.
- source_word: τοῖς περὶ αὐτὸν ἀνδράσιν
  english_pob_choice: the men around him
  chosen_korean: 자기 곁의 부하들에게
  alternatives_korean:
  - 그 주위의 남자들에게
  - 주변의 사람들에게
  lexicon: ἀνήρ
  rationale: 문맥상 단순한 ‘남자들’이 아니라 유다를 따르며 함께 움직이는 수행 인원을 가리키므로, 현대 한국어에서 자연스러운 ‘부하들’로 옮겼습니다.
theological_decisions:
- issue: 행위의 책임성 표현
  chosen_reading: ‘자행된 잔혹함’으로 번역해 피해 사실과 가해 책임을 분명히 드러냈습니다.
  alternative_readings:
  - ‘일어난 잔혹함’
  - ‘벌어진 잔혹사건’
  rationale: 영어 POB가 “committed”를 채택해 단순 발생이 아니라 누군가가 저지른 행위임을 강조하므로, 한국어도 그 책임성을 약화하지 않도록 했습니다.
  doctrine_reference: 공의와 책임의 서술을 흐리지 않는 역사 서술 원칙
