id: SNG.6.12
reference: Song of Songs 6:12
source:
  edition: WLC
  text: לֹ֣א יָדַ֔עְתִּי נַפְשִׁ֣/י שָׂמַ֔תְ/נִי מַרְכְּב֖וֹת עַמִּ/י נָדִֽיב־׃
translation:
  text: Before I knew it, my soul[a] set me among the chariots of my noble people[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or 'my desire' or 'my heart.'
    reason: alternative_reading
  - marker: b
    text: 'The Hebrew is uncertain. Alternatively, ''made me like the chariots of my noble people.'' The final words may instead be the name Ammi-nadib: ''the chariots of Ammi-nadib.'''
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדַעְתִּי
  chosen: Before I knew it
  alternatives:
  - I did not know
  - I knew not
  lexicon: HALOT
  rationale: The Hebrew is literally 'I did not know,' but in context this idiom naturally conveys suddenness or unawareness of how the situation developed. 'Before I knew it' preserves the sense in readable modern English without excessive paraphrase.
- source_word: נַפְשִׁי
  chosen: my soul
  alternatives:
  - my soul
  - myself
  - my heart
  lexicon: HALOT
  rationale: נֶפֶשׁ may denote soul, self, inner being, or desire. “My soul” is source-near and leaves the poetic force unforced; the note records plausible contextual alternatives.
- source_word: שָׂמַתְנִי
  lemma: שׂוּם
  chosen: set me among
  alternatives:
  - placed me in
  - made me like
  - brought me to
  lexicon: HALOT
  rationale: The verb שׂוּם means 'to put, place, set.' 'Set me among' fits the image of being placed amid chariots. Some interpreters take the phrase more idiomatically ('made me like the chariots'), but the basic locative sense is preferable in the main text.
- source_word: מַרְכְּבוֹת
  chosen: the chariots
  alternatives:
  - chariots
  lexicon: HALOT
  rationale: The plural noun straightforwardly means 'chariots.' The English article helps the phrase read naturally as a definite poetic image.
- source_word: עַמִּי
  lemma: עַם
  chosen: my people
  alternatives:
  - my kinsmen
  lexicon: HALOT
  rationale: The noun עַם commonly means 'people.' The suffix is first person singular, so 'my people' is the most direct rendering.
- source_word: נָדִיב
  chosen: noble
  alternatives:
  - princely
  - willing
  - generous
  lexicon: HALOT
  rationale: נָדִיב can mean noble, princely, or generous. Here it most plausibly qualifies 'my people' as noble/princely, though the syntax is difficult. 'Noble' is concise and idiomatic; alternatives are preserved in a footnote because the phrase is notoriously uncertain.
