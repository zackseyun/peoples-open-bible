translation:
  text: '“The ninth mountain was desolate. It had reptiles and wild beasts that destroy people. Its believers
    are like this:


    2. “Those with spots are deacons[a] who served badly. They plundered what widows and orphans needed
    to live. They used the service entrusted to them to enrich themselves.[d] If they keep the same desire,
    they are dead and have no hope of life. But if they turn back and finish their service in purity,
    they will be able to live.”


    3. “Those covered with scabs denied and did not return to their own Lord. They became barren and desolate.
    They stay apart from God’s servants. By remaining alone, they destroy their own lives.”


    4. “A vine left inside a fence without care is ruined. Weeds overrun it. In time it grows wild and
    becomes useless to its owner. These people are like that vine. They have given themselves up as lost.
    They grow wild and become useless to their own Lord.”


    5. “They can repent if they are not found to have denied from the heart. But if anyone is found to
    have denied from the heart, I do not know whether that person can live.”


    6. “I am not saying this about these present days so that someone can deny and receive repentance.[b]
    Anyone who now intends to deny their own Lord cannot be saved. But repentance seems available to those
    who denied long ago. Anyone who intends to repent must hurry before the tower is finished. Otherwise,
    those women will destroy that person, bringing death.”


    7. “The chipped stones[c] are deceitful people and slanderers. They are the wild beasts you saw on
    the mountain.[e] Wild beasts use venom to ruin and destroy a person. These people’s words do the same.”


    8. “Their conduct cuts short their faith. Some repented and were saved. The others can also be saved
    if they repent. But if they do not repent, they will die through those women whose power they possess.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Diakonoi is rendered “deacons” in this community-service context. Their assigned care of vulnerable
      people is explicit; the term alone does not settle the structure of a later ordained hierarchy.
  - marker: b
    reason: lexical_alternative
    text: “Receive repentance” keeps the source’s expression and distinction between past denial and present
      intention. The draft retains both its severe impossibility statement and its stated uncertainty,
      rather than harmonizing them. The women are allegorical figures from the vision.
  - marker: c
    reason: lexical_alternative
    text: Koloboi means cut short or mutilated; “chipped stones” retains the stone allegory. The next
      paragraph applies the image to truncated faith; it is not an added description of physical disability.
  - marker: d
    reason: textual_variant
    text: The printed Greek service clause includes διακονῆσαι (“to perform/serve”). The supplied transcription
      of Lightfoot and Harmer’s apparatus says Gebhardt supplied this word as an editorial supplement.
      The simplified sentence follows that working reading; the supplied report does not establish the
      word as independently verified manuscript wording.
  - marker: e
    reason: textual_variant
    text: Here the translation keeps “the mountain.” The supplied transcription of Lightfoot and Harmer’s
      apparatus reports that L₁ and L₂ support this wording. It reports that A (Athos) apparently adds
      θʹ, meaning “ninth,” so the phrase reads “the ninth mountain.” It also reports E as deficient here,
      meaning it does not supply this passage. These reports come from the supplied apparatus transcription,
      not a fresh check of the witnesses.
lexical_decisions:
- source_word: μετάνοια / μετανοεῖν
  chosen: repentance / repent
  alternatives:
  - regret
  - penance
  rationale: Context requires turning back and changed service/conduct. Preserve possibility, uncertainty,
    urgency and the severe present-denial warning.
- source_word: τὴν ζωήν (widows/orphans)
  chosen: livelihood
  alternatives:
  - life
  rationale: Plundered resources sustain widows and orphans; distinguish their livelihood from the later
    life/death judgment without adding a specific fund.
- source_word: οὐκ οἶδα / ἀδύνατον ... σωθῆναι / δοκεῖ
  chosen: I do not know / impossible to be saved / seems
  alternatives:
  - will not live / difficult / certainly
  rationale: Keep each expression’s degree of certainty rather than resolving the passage by paraphrase.
