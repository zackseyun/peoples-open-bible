  text: So keep this commandment, as I have spoken to you, so that your repentance and that of your household may be found in simplicity, and your heart clean and unstained.
translation:
  language: en
  text: So obey this command, as I have told you, so that you and your household may be found to have reoriented[a] with sincere and undivided hearts, and so that your own heart may be clean and unstained.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: keep this commandment, as I have spoken to you
  simplified_phrase: obey this command, as I have told you
  preserved_meaning: The hearer must follow the command already given.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Obey” clearly expresses what it means to keep a command.
interpretive_expansions: []
translation_notes:
  risk_flags:
  - risk: “Undivided hearts” makes the moral force of “simplicity” more explicit than the POB.
    mitigation: It is paired with “sincere” to preserve the documented breadth without presenting a narrower claim.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
