theological_decisions:
- issue: Rendering the divine name יהוה
  chosen_reading: O Yahweh
  alternative_readings:
  - Yahweh
  - the LORD
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Semantic range of עָוֹן
  chosen_reading: iniquity
  alternative_readings:
  - guilt
  - sin
  rationale: The Hebrew term can refer to wrongdoing, guilt, or guilt-bearing consequence. 'Iniquity' preserves the text's moral gravity without narrowing it to only subjective guilt or flattening it to the broader 'sin.'
