translation:
  text: 'II.1. “What,” I said, “did they endure?” She says, “Listen: scourges, prisons, great afflictions,
    crucifixions[1], wild beasts[13]—for the sake of the Name[2]. For this reason the right-hand parts
    of the sanctuary[3] belong to them, and to whoever suffers because of the Name; but the left-hand
    parts belong to the rest. Yet for both, those sitting on the right and those on the left, the gifts
    are the same and the promises the same—only those on the right sit there and have some glory.”


    II.2. “But you are very eager to sit on the right with them; yet your shortcomings are many. Still,
    you will be cleansed from your shortcomings, and all who are not double-minded[4] will be cleansed
    from all their sins up to this day[5].”


    II.3. After she had said these things, she wanted to depart; but I fell at her feet and asked her
    by the Lord[a] to show me the vision that she had promised me.


    II.4. And again she took hold of my hand, raised me up, and seated me on the bench[6] on the left;
    and she herself sat on the right. And, lifting up a certain bright rod[b], she says to me, “Do you
    see a great thing?” I say to her, “Lady, I see nothing.” She says to me, “[You,][7] look—do you not
    see opposite you a great tower being built upon the waters with square-cut, shining stones?”


    II.5. The tower was being built foursquare[8] by the six young men[c] who had come with her; and myriads[9]
    of other men were bringing stones, some from the deep and others from the land, and were handing them
    to the six young men. They would take them and build.


    II.6. The stones hauled up from the deep they set, every one, into the building just as they were;
    for they were fitted and matched the jointing with the other stones, and so were cemented to one another[d],
    so that their joint was not visible. The construction of the tower appeared as if it had been built
    from a single stone.


    II.7. But of the other stones being brought from the dry land, some they were rejecting, and some
    they were putting into the building; others they were cutting and throwing[e] far from the tower.


    II.8. Many other stones lay around the tower, and they were not using them for the building—for some
    of them were scabby[10], others had cracks, others had been truncated[11], others were white and round,
    not fitting for the building.


    II.9. And I saw other stones being hurled far from the tower and coming into the road, and not remaining
    in the road but rolling into the trackless places[12]; others falling onto a fire and being burned[f];
    others falling near waters and not being able to roll into the water[g], though they wanted to roll
    and come into the water.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: Crucifixions renders staurous, literally crosses, as the ordeal in this list. Sinaiticus10.1
      first has taurous, bulls, corrected by S1 to staurous, crosses; the working source, Athos PlateII
      and the printed versions retain crosses or crucifixion language. The first-hand spelling is not
      silently treated as already corrected.
    reason: textual_variant
  - marker: '2'
    text: The selected Greek uses the Name without naming its referent. Athos PlateII and Sinaiticus10.1
      retain that bare expression. Vulgata printed14 and Palatina printed33 use his name and also name
      God in the corresponding qualifying clause; the Ethiopic edition’s Latin rendering printed118 uses
      his name. No Lord or Jesus expansion is inserted into the selected expression.
    reason: textual_variant
  - marker: '3'
    text: Sanctuary renders hagiasma, also holy place or sacred precinct. The source explicitly assigns
      right and left places, the same gifts and promises to both groups, and some glory to those on the
      right. No separate salvation ranking or building plan is supplied by the translation.
    reason: lexical_alternative
  - marker: '4'
    text: Not double-minded renders the selected negative mē with dipsychountes. Athos, Sinaiticus10.2
      and both Latin printed versions retain a negative. D’Abbadie1860’s Latin rendering of Ethiopic printed118
      instead says all who are doubtful in its main text; the footnote comments that a negative is often
      lost. That editorial suggestion is not counted as a preserved Ethiopic negative or direct Geʿez
      collation. The selected negative remains.
    reason: textual_variant
  - marker: '5'
    text: Up to this day renders eis tautēn tēn hēmeran, with as of this day or on this day as temporal
      alternatives. The selected promise says will be cleansed, including all their sins, with the not-double-minded
      qualification. It is not weakened to mere possibility or supplied with a numbered deadline or liturgical
      date.
    reason: lexical_alternative
  - marker: '6'
    text: Bench renders the actual printed sympselion. The import had symplesion, and the old English
      inferred plaited material from it. Raw320, normalized source and attached source are corrected to
      the print, corroborated by Athos PlateII and Sinaiticus10.4. The word here supplies no plaited material.
      The prior English and lexical decision remain in the history archive; this is a transcription-driven
      correction, not a stylistic reversal or new manuscript-selection locus.
    reason: textual_variant
  - marker: '7'
    text: The selected print brackets the emphatic You as supplied or uncertain editorial text. Athos
      PlateII likewise brackets it in the diplomatic transcription; Sinaiticus10.4 has an unbracketed
      sy in its main text. The Latin versions and Ethiopic edition’s Latin rendering have the look/do-you-not-see
      question without the same separate emphatic pronoun. No claim is made that every witness lacks it.
    reason: textual_variant
  - marker: '8'
    text: Foursquare renders en tetragōnō, also in a square. The tower’s shape and the square-cut stones
      are separate source descriptions; no dimensions or floor plan are invented.
    reason: lexical_alternative
  - marker: '9'
    text: Myriads literally indicates tens of thousands and here conveys a very large crowd; it is not
      converted into an exact census. The distinct six young builders receive stones from this other crowd.
    reason: lexical_alternative
  - marker: '10'
    text: Scabby renders epsōriakotes, a rough or scabbed-surface description. The source lists different
      kinds of unusable stones without identifying their human referents in this paragraph; that explanation
      is not added here.
    reason: lexical_alternative
  - marker: '11'
    text: Truncated renders kekolobōmenoi, also cut short or maimed. Athos and Sinaiticus10.8 retain this
      category. Vulgata printed16 lacks a separate truncated-stone category; Palatina printed35 has small/reduced
      stones. The Ethiopic edition’s Latin rendering printed119 separately lists shorter, white, and round
      stones, rather than combining white and round exactly as the selected Greek does.
    reason: textual_variant
  - marker: '12'
    text: Trackless places renders anodia, literally no-road or pathless country. Sinaiticus10.9 first
      has anomian, corrected by S1 to anodian; its first destination is transcribed auto where the working
      text has road. Athos and both Latin versions retain a road/path contrast; the Ethiopic edition’s
      Latin rendering printed119 instead has rolling toward upper roads. The selected road/no-road contrast
      remains.
    reason: textual_variant
  - marker: '13'
    text: Wild beasts renders thēria. The source lists them among ordeals but names no arena, venue, or
      specific manner of death in this clause.
    reason: lexical_alternative
  - marker: a
    text: By the Lord is explicit in the working source. Sinaiticus10.3 has one unreadable-character gap
      after to in the first-hand article slot; S1 supplies the article and Lord abbreviation. Its first
      vision word also has one unreadable character and a dotted letter, with S1 giving horama. These
      corrected forms are not counted as wholly preserved first-hand letters. Athos and the versions retain
      the appeal and promised vision.
    reason: textual_variant
  - marker: b
    text: Bright renders lampran. Vulgata printed15 has a splendid rod; the Ethiopic edition’s Latin rendering
      printed118 has a white rod. Palatina printed33 has a long rod, with that codex wording distinguished
      from an edited nominative form in its apparatus. The selected brightness is retained.
    reason: textual_variant
  - marker: c
    text: The selected Greek twice numbers the builders six. Athos PlateII, both Latin versions and the
      Ethiopic edition’s Latin rendering retain six. Sinaiticus10.5 first has exēkonta, sixty, in both
      places, changed by ca to hex, six. The two corrections are disclosed rather than counted as independent
      manuscript votes.
    reason: textual_variant
  - marker: d
    text: Cemented or joined renders ekollōnto, bonding together; the source does not name a mortar or
      construction process. The invisible jointing and appearance as one stone are both explicit. Athos,
      Sinaiticus10.6 and the versions retain this joined/single-stone imagery with different wording.
    reason: lexical_alternative
  - marker: e
    text: The selected text has cutting and throwing far from the tower. Sinaiticus10.7 instead has cutting
      and placing far, before its next verse continues from the tower. Athos and the printed versions
      retain casting or throwing wording. The selected action remains without making the witnesses identical.
    reason: textual_variant
  - marker: f
    text: Sinaiticus10.9 first lacks the words and burning, others falling; S1 and ca add forms of that
      clause with different falling verbs. The working text, Athos, both Latin versions and the Ethiopic
      edition’s Latin rendering retain fire, burning, and another group near water. Correctors are not
      additional codices.
    reason: textual_variant
  - marker: g
    text: The last group is near waters but cannot roll into the water despite wanting to roll and enter
      it. The inability and desire are both retained by the working Greek, Athos, Sinaiticus10.9 and the
      versions in different formulations. No cause of their inability or interpretation of the water is
      added in this paragraph.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάστιγες
  chosen: scourges
  alternatives:
  - whippings
  - floggings
  lexicon: LSJ; BDAG
  rationale: Retains concrete punitive sense in martyr contexts; more physical than generic “beatings.”
- source_word: φυλακάς
  chosen: prisons
  alternatives:
  - imprisonments
  - custody
  lexicon: LSJ; BDAG
  rationale: Plural captures multiple episodes or institutions of confinement.
- source_word: θλίψεις μεγάλας
  chosen: great afflictions
  alternatives:
  - great tribulations
  - severe pressures
  lexicon: BDAG; LSJ
  rationale: “Afflictions” keeps broad suffering domain without importing apocalyptic ‘tribulation’ jargon.
- source_word: σταυρούς
  chosen: crucifixions
  alternatives:
  - crosses
  lexicon: LSJ; BDAG
  rationale: In martyr lists, the referent is the act/punishment; “crucifixions” makes the ordeal explicit
    while preserving the concrete plural.
- source_word: θηρία
  chosen: wild beasts
  alternatives:
  - beasts
  - animals
  lexicon: LSJ; BDAG
  rationale: Retain the wild beasts named in the ordeal list; the clause specifies no venue or means of
    execution.
- source_word: τοῦ ὀνόματος
  chosen: the Name
  alternatives:
  - the name of the Lord
  - Jesus’ name
  lexicon: BDAG
  rationale: Retain the selected bare the Name without an added referent or possessive; note2 distinguishes
    the versions.
- source_word: τὰ δεξιὰ/τὰ ἀριστερὰ μέρη
  chosen: the right-hand/left-hand side
  alternatives:
  - the right/left parts
  - right/left places
  lexicon: LSJ
  rationale: “Side” fits spatial imagery of a sanctuary with seating; keeps symmetry with right/left motif.
- source_word: τοῦ ἁγιάσματος
  chosen: the sanctuary
  alternatives:
  - the holy place
  - the sacred precinct
  lexicon: LSJ; BDAG
  rationale: “Sanctuary” renders the sacred-space nuance and maintains temple imagery without over‑specifying.
- source_word: δῶρα
  chosen: gifts
  alternatives:
  - rewards
  - offerings
  lexicon: LSJ; BDAG
  rationale: Here contrasts status with equal divine bestowals; “gifts” better than “rewards,” which could
    skew to merit.
- source_word: ἐπαγγελίαι
  chosen: promises
  alternatives:
  - pledges
  lexicon: BDAG; LSJ
  rationale: Standard rendering; communicates divine assurances without legalistic overtones.
- source_word: δόξαν τινά
  chosen: some glory
  alternatives:
  - a certain glory
  - some honor
  lexicon: BDAG; LSJ
  rationale: Keeps doxa as ‘glory’ while acknowledging an undefined measure with ‘some’.
- source_word: κατεπίθυμος
  chosen: very eager
  alternatives:
  - intensely desirous
  - eagerly desirous
  lexicon: LSJ
  rationale: Conveys strong desire in accessible English.
- source_word: ὑστερήματα
  chosen: shortcomings
  alternatives:
  - deficiencies
  - lacks
  lexicon: BDAG; LSJ
  rationale: Moral‑spiritual lacks; “shortcomings” is idiomatic and non‑technical.
- source_word: καθαρισθήσῃ / καθαρισθήσονται
  chosen: be cleansed
  alternatives:
  - be purified
  - be made clean
  lexicon: BDAG; LSJ
  rationale: Cleansing imagery is consistent with Hermas’ penitential theology; passive voice retained.
- source_word: μὴ διψυχοῦντες
  chosen: not double-minded
  alternatives:
  - not wavering
  - not two‑souled
  lexicon: BDAG
  rationale: Hermas regularly attacks ‘double‑mindedness’; this preserves that stock vice term (cf. Jas
    1:8).
- source_word: ἁμαρτήματα
  chosen: sins
  alternatives:
  - wrongdoings
  - transgressions
  lexicon: BDAG; LSJ
  rationale: Baseline moral category; avoids euphemism.
- source_word: συμψέλιον
  chosen: bench
  alternatives:
  - woven seat
  - plaited couch
  lexicon: LSJ
  rationale: Correct the malformed imported symplesion to printed sympselion. Bench preserves the seating
    item without adding plaited material. The old inference is archived and explicitly reconsidered from
    the print.
- source_word: ῥάβδος λαμπρά
  chosen: bright rod
  alternatives:
  - shining staff
  - gleaming rod
  lexicon: LSJ
  rationale: “Rod” matches common prophetic/visionary implements; ‘bright’ renders λαμπρά.
- source_word: πύργος
  chosen: tower
  lexicon: LSJ
  rationale: Core symbol in Hermas; literal rendering preserved.
- source_word: οἰκοδομούμενον ἐπὶ ὑδάτων
  chosen: being built upon the waters
  alternatives:
  - being constructed on the waters
  lexicon: LSJ
  rationale: Preposition ἐπί with genitive conveys location ‘upon’; literal phrasing retains symbolic
    force.
- source_word: τετραγώνοις (λίθοις) / ἐν τετραγώνῳ
  chosen: square‑cut / foursquare
  alternatives:
  - four‑cornered / in a square
  lexicon: LSJ
  rationale: “Square‑cut” fits stones; “foursquare” preserves traditional architectural idiom for the
    tower.
- source_word: νεανίσκοι
  chosen: young men
  alternatives:
  - youths
  lexicon: LSJ
  rationale: Neutral, natural English; avoids modern connotations of ‘youths’.
- source_word: μυριάδες
  chosen: myriads
  alternatives:
  - tens of thousands
  - countless multitudes
  lexicon: LSJ
  rationale: Literal and evocative; preserves numerical hyperbole of the scene.
- source_word: βυθός
  chosen: the deep
  alternatives:
  - the depths
  - the sea‑bed
  lexicon: LSJ
  rationale: Aquatic depth without over‑specifying a sea‑bed.
- source_word: γῆ
  chosen: land
  alternatives:
  - ground
  - earth
  lexicon: LSJ
  rationale: Contrasts with ‘the deep’; ‘land’ fits the parallelism.
- source_word: ἡρμοσμένοι / ἁρμογῇ
  chosen: fitted / the jointing
  alternatives:
  - matched / the joint
  - in harmony / the fitting
  lexicon: LSJ
  rationale: Maintains building‑trade vocabulary; ‘jointing’ expresses the join as a system.
- source_word: ἐκολλῶντο
  chosen: were cemented
  alternatives:
  - were joined fast
  - were glued
  lexicon: BDAG; LSJ
  rationale: Cemented conveys bonding in this image without specifying mortar; joined is a simpler alternative,
    and the invisible joints/single-stone appearance remain.
- source_word: ξηρά
  chosen: dry land
  alternatives:
  - dry ground
  lexicon: LSJ
  rationale: Standard collocation; balances with ‘deep’.
- source_word: ἀπέβαλλον
  chosen: were rejecting
  alternatives:
  - were throwing away
  - were discarding
  lexicon: LSJ
  rationale: Captures evaluative and physical action implied by context.
- source_word: κατέκοπτον
  chosen: were cutting
  alternatives:
  - were hewing
  - were chopping
  lexicon: LSJ
  rationale: Stone‑shaping action; kept general to avoid over‑specifying technique.
- source_word: ἐψωριακότες
  chosen: scabby
  alternatives:
  - mangy
  - scurfy
  lexicon: LSJ
  rationale: Psōra denotes scab/mange; ‘scabby’ conveys defilement imagery.
- source_word: σχισμὰς ἔχοντες
  chosen: having cracks
  alternatives:
  - fissured
  - split
  lexicon: LSJ
  rationale: Plain description of flawed stones.
- source_word: κεκολοβωμένοι
  chosen: truncated
  alternatives:
  - maimed
  - cut short
  lexicon: LSJ
  rationale: Stone metaphor favors ‘truncated/cut short’ over bodily ‘maimed’.
- source_word: λευκοὶ καὶ στρογγύλοι
  chosen: white and round
  alternatives:
  - white and rounded
  lexicon: LSJ
  rationale: Literal; suggests aesthetic yet unsuitable stones.
- source_word: μὴ ἁρμόζοντες
  chosen: not fitting
  alternatives:
  - not suitable
  - not matching
  lexicon: LSJ
  rationale: Continues the building‑fit motif.
- source_word: ῥιπτομένους
  chosen: being hurled
  alternatives:
  - being thrown
  lexicon: LSJ
  rationale: More vivid for violent casting away.
- source_word: ὁδός
  chosen: road
  alternatives:
  - way
  - path
  lexicon: LSJ
  rationale: Contrasts with ‘trackless’ (no‑road); ‘road’ best preserves play on ὁδός/ἀνοδία.
- source_word: ἀνοδία
  chosen: trackless places
  alternatives:
  - pathless places
  - roadless ground
  lexicon: LSJ
  rationale: Alpha‑privative formation (‘no road’) preserved in English idiom.
- source_word: ἐπὶ πῦρ ἐμπίπτοντας
  chosen: falling onto a fire
  alternatives:
  - falling into fire
  lexicon: LSJ
  rationale: Prepositional nuance (ἐπί) retained; both convey peril.
