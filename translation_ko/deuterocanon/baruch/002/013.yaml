  - 우리는 얼마 남지 않았기 때문입니다
  lexicon: καταλείπω / ὀλίγοι
  rationale: ‘남겨지다’의 수동성과 ‘적은 수’를 함께 살리되, 한국어에서는 자연스럽게 ‘적은 수만 남다’로 옮기는 편이 원문의 상태를 잘 드러냅니다.
- source_word: ἐν τοῖς ἔθνεσιν
  english_pob_choice: among the nations
  chosen_korean: 이방 민족들 가운데서
  alternatives_korean:
