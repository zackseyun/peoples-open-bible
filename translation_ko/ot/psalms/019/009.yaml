source:
  edition: WLC
  text: יִרְאַ֤ת יְהוָ֨ה טְהוֹרָה֮ עוֹמֶ֪דֶת לָ֫/עַ֥ד מִֽשְׁפְּטֵי יְהוָ֥ה אֱמֶ֑ת צָֽדְק֥וּ יַחְדָּֽו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/009.yaml
  text: The fear of Yahweh is pure[a], enduring forever[d]; the judgments of Yahweh[c] are true; they are altogether righteous[b].
  footnotes:
  - marker: a
    text: Or 'clean' for 'pure.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'righteous altogether'; that is, completely righteous as a whole.
    reason: lexical_alternative
  - marker: c
    text: Or 'the ordinances of Yahweh.'
    reason: lexical_alternative
  - marker: d
    text: Literally 'standing forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 경외함은 정결하여[a] 영원히 지속되며,[b] 야훼의 판단들은[c] 참되며[d] 한결같이 의롭습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '깨끗하여'.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '영원히 서 있으며'.
    reason: lexical_alternative
  - marker: c
    text: 또는 '야훼의 법규들은'.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 이어서 '함께 의롭다'라고 합니다. 곧 야훼의 판단들은 전체로서 완전히 의롭다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקּוּדֵי
  english_pob_choice: precepts
  chosen_korean: 증거들
  alternatives_korean:
  - 법도들
  - 훈계들
