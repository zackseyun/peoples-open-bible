  to: Be gracious to me, O God, for mortals pursue me[a]; all day long they attack and oppress me.
  rationale: The latest revision rightly replaced the misleading “pants after me” with “pursues me.” I retain that correction but understand the singular human opponent representatively, following the surrounding description of numerous enemies rather than the earlier rationale's restriction to one individual.
