  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נ֤וֹרָא֨וֹת
  english_pob_choice: awesome deeds
  chosen_korean: 주의로운 일들
  alternatives_korean:
  - 경외로운 일들
  - 두려운 일들
  - 놀라운 일들
  lexicon: HALOT
  rationale: 이 어근은 경외와 두려움을 불러일으키는 일을 가리키므로, 한국어에서는 ‘주의로운’으로 처리해 경외감을 살리되 과도하게 설명적이지 않게 했습니다.
- source_word: בְּצֶדֶק
  english_pob_choice: in righteousness
  chosen_korean: 의의로써
  alternatives_korean:
  - 의 안에서
  - 의로
  - 정의로
  lexicon: HALOT
  rationale: 전치사 ב의 용법을 살려 방식/영역을 나타내는 ‘-로써’를 썼고, צֶדֶק은 이 시편 문맥에서 하나님의 올바르고 언약적인 성품을 가리키므로 ‘의’를 유지했습니다.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  english_pob_choice: O God of our salvation
  chosen_korean: 주의, 하나님이시여
  alternatives_korean:
  - 우리 구원의 하나님이시여
  - 우리의 구원이신 하나님이시여
  - 우리 구원의 주 하나님이시여
  lexicon: HALOT
  rationale: 히브리어의 호격 구조를 살리면서도 한국어 호칭으로 자연스럽게 옮기기 위해 ‘하나님이시여’로 처리했고, 뒤의 관계절이 이미 ‘우리에게 응답하시는’로 구원의 성격을 드러냅니다.
- source_word: מִבְטָח
  english_pob_choice: the confidence
  chosen_korean: 신뢰
  alternatives_korean:
  - 믿음의 대상
  - 의지할 분
  - 피난처
  lexicon: HALOT
  rationale: מִבְטָח은 ‘신뢰하는 대상, 의지처’의 뜻이므로 추상명사보다 인격적 대상성을 살리는 ‘신뢰’가 적절합니다. 한국어의 ‘신뢰’는 문맥상 주어적 서술어로도 자연스럽습니다.
theological_decisions:
- issue: ‘awesome deeds’의 경외성 보존
  chosen_reading: ‘주의로운 일들’로 옮겨 하나님의 행위가 단순히 놀랍기만 한 것이 아니라 경외를 불러일으키는 차원을 드러냈습니다.
  alternative_readings:
  - ‘놀라운 일들’은 의미가 지나치게 약해질 수 있음
  - ‘두려운 일들’은 현대 독자에게 부정적 뉘앙스가 강할 수 있음
  rationale: 시편의 문맥은 하나님의 구원 행위가 가져오는 경외를 강조하므로, 현대 한국어에서 그 긴장을 너무 완화하지 않는 표현이 필요합니다.
  doctrine_reference: 시편의 하나님의 행위 묘사에 대한 일반적 경외/심판 어휘 사용 원리
