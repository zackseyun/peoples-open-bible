review_pass:
  verdict: revise
  source_fidelity: 초안은 예언자의 표징 행위와 ‘그들 앞에서’의 반복을 대체로 잘 반영합니다. 그러나 וּגְלֵה와 וְגָלִיתָ는 에스겔이 포로로 끌려가는 것이 아니라 포로/유배의 모습을 보이도록 ‘유배 가듯’ 행하라는 명령인데, ‘포로로 끌려가듯’은 원문에 없는 강제 연행의 방식을 더합니다. 또한 두 번째 동사를 수동적 미래인 ‘옮겨질 것이다’로 옮기면 명령의 주체성과 표징 행위의 성격이 약해집니다.
  naturalness: ‘유배 갈 짐’, ‘유배 가듯이 떠나라’, ‘옮겨 가라’는 현대 표준 한국어의 합쇼체 명령문으로 자연스럽고, 예언 행위의 의도도 분명하게 전달합니다. ‘반역하는 집안’은 집단을 가리키는 비유적 ‘집’을 유지합니다.
  terminology: ‘인자야’는 에스겔에서 반복되는 בֶן־אָדָם의 한국어 성서 번역 전통과 호칭 기능에 부합합니다. כְּלֵי גוֹלָה는 실제 포로 생활을 위한 짐이라기보다 유배를 나타내는 짐이므로 ‘유배 갈 짐’으로 다듬었습니다. בֵּית מְרִי는 ‘반역하는 집안’으로 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘포로로 끌려가듯’이 원문에 없는 ‘끌려감’의 방식을 첨가합니다.
    rationale: גלה는 포로/유배로 떠나는 것을 가리키지만, 이 구절의 명령은 에스겔이 표징으로 그렇게 행동하라는 것입니다. ‘끌려가다’는 타인에 의한 연행을 명시하여 원문의 표현보다 좁고 강한 의미를 부가합니다.
  - severity: medium
    issue: ‘옮겨질 것이다’가 명령형 표징 행위를 수동적 서술로 바꿉니다.
    rationale: וְגָלִיתָ는 앞선 명령을 이어 에스겔이 자신의 장소에서 다른 장소로 옮겨 가야 함을 말합니다. 능동 명령으로 옮겨야 행위 주체와 문맥이 보존됩니다.
  - severity: low
    issue: 마지막 절의 접속 관계가 영어 POB 감사본의 ‘though’와 다릅니다.
    rationale: 감사본은 ‘비록 그들이 반역하는 집안일지라도’라는 양보 관계를 채택했으므로, 한국어도 이를 명시해 해당 결정과 일치시키는 편이 안전합니다.
  revised_text: 인자야, 너는 유배 갈 짐을 마련하고, 낮에 그들이 보는 앞에서 유배 가듯이 떠나라. 그들이 보는 앞에서 네가 있는 곳에서 다른 곳으로 옮겨 가라. 그들이 반역하는 집안일지라도, 혹시 보게 될지도 모른다.
