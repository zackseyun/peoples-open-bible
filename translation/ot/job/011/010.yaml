id: JOB.11.10
reference: Job 11:10
source:
  edition: WLC
  text: אִם יַחֲלֹ֥ף וְ/יַסְגִּ֑יר וְ֝/יַקְהִ֗יל וּ/מִ֣י יְשִׁיבֶֽ/נּוּ־׃
translation:
  text: If God passes through, imprisons someone, and gathers an assembly, who can turn him back[a]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “who can reverse what he does?”
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  chosen: If
  alternatives:
  - When
  lexicon: HALOT
  rationale: Introduces a conditional or hypothetical statement. 'If' best preserves the Hebrew particle's force here in Zophar's rhetorical assertion about God's irresistible action.
- source_word: יַחֲלֹף
  chosen: passes through
  alternatives:
  - he passes through
  - he sweeps by
  lexicon: HALOT
  rationale: A natural rendering of חלף here that does not add a specific object or destructive manner.
- source_word: וְיַסְגִּיר
  chosen: and shuts someone in
  alternatives:
  - and imprisons
  - and hands over
  lexicon: HALOT
  rationale: From סגר in Hiphil, commonly 'shut up, hand over, imprison.' In this context, paired with irresistible divine action, 'shuts someone in' preserves the concrete imagery and leaves the object implicit as in Hebrew, while making natural English sense.
- source_word: וְיַקְהִיל
  chosen: and gathers an assembly
  alternatives:
  - and gathers
  - and convenes
  lexicon: HALOT
  rationale: Represents the Hiphil sense of causing people to assemble without importing a specifically judicial nuance.
- source_word: וּמִי
  chosen: then who
  alternatives:
  - and who
  lexicon: HALOT
  rationale: The conjunction plus interrogative introduces the rhetorical consequence. 'Then who' brings out the logical force in smooth English.
- source_word: יְשִׁיבֶנּוּ
  chosen: can turn him back
  alternatives:
  - can restore him
  - can make him return
  - can reverse it
  lexicon: HALOT
  rationale: The 3ms suffix most naturally refers to the acting subject, God, while the broader possibility of reversing his action is noted.
