id: PSA.92.5
reference: Psalms 92:5
source:
  edition: WLC
  text: מַה גָּדְל֣וּ מַעֲשֶׂ֣י/ךָ יְהוָ֑ה מְ֝אֹ֗ד עָמְק֥וּ מַחְשְׁבֹתֶֽי/ךָ־׃
translation:
  text: How great are your works, O Yahweh! Your thoughts[a] are very deep.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “your plans” or “your purposes.”
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  chosen: How
  alternatives:
  - How greatly
  - How
  lexicon: HALOT
  rationale: Exclamatory מַה introduces admiration rather than a question here; 'How' in English naturally conveys the exclamation ('How great...').
- source_word: גָּדְלוּ
  chosen: are great
  alternatives:
  - have become great
  - are magnified
  lexicon: HALOT
  rationale: Qal perfect 3cp from גדל functions statively in this poetic exclamation. 'Are great' is idiomatic and reflects present admiration of God's works.
- source_word: מַעֲשֶׂיךָ
  chosen: your works
  alternatives:
  - your deeds
  lexicon: HALOT
  rationale: מַעֲשֶׂה commonly denotes deeds or works. 'Works' fits the psalm's praise context and preserves broad scope, including acts in creation and providence.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: מְאֹד
  chosen: very
  alternatives:
  - exceedingly
  - greatly
  lexicon: HALOT
  rationale: מְאֹד intensifies the following predicate. 'Very' is simple, natural modern English and preserves the degree without sounding archaic.
- source_word: עָמְקוּ
  chosen: are deep
  alternatives:
  - have become deep
  - are profound
  lexicon: HALOT
  rationale: Qal perfect 3cp from עמק is used statively. 'Are deep' is the most direct rendering; 'profound' is interpretive and slightly more abstract.
- source_word: מַחְשְׁבֹתֶיךָ
  chosen: your thoughts
  alternatives:
  - your plans
  - your purposes
  lexicon: HALOT
  rationale: מַחְשָׁבָה can mean thoughts, plans, or purposes. 'Thoughts' is the most transparent lexical match and preserves the poetic breadth, allowing both divine wisdom and intention to remain in view.
