translation:
  text: 'Say, ‘Hear the word of Yahweh, kings of Judah and people of Jerusalem! Thus says Yahweh of hosts, the God of Israel: I am bringing such disaster on this place that everyone who hears of it will shudder[a].'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the ears of everyone who hears of it will tingle,” an image of overwhelming shock.
    reason: lexical_alternative
