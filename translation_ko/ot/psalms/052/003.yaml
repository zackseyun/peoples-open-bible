  text: Your tongue devises destruction[a], like a sharpened razor, you who practice deceit[b].
  footnotes:
  - marker: a
    text: The Hebrew noun is plural, literally “destructions,” used collectively for ruinous harm.
    reason: lexical_alternative
  - marker: b
    text: The final phrase may address the man (“you who practice deceit”) or describe the razor as acting deceitfully.
    reason: alternative_reading
