id: PSA.26.8
reference: Psalms 26:8
source:
  edition: WLC
  text: יְֽהוָ֗ה אָ֭הַבְתִּי מְע֣וֹן בֵּיתֶ֑/ךָ וּ֝/מְק֗וֹם מִשְׁכַּ֥ן כְּבוֹדֶֽ/ךָ׃
translation:
  text: O Yahweh, I love the house where you dwell, the place where your glory resides.
  philosophy: dynamic
lexical_decisions:
- source_word: יְהוָה
  chosen: O Yahweh
  alternatives:
  - O Yahweh
  - LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: אָהַבְתִּי
  chosen: I love
  alternatives:
  - I have loved
  - I loved
  lexicon: HALOT
  rationale: The Hebrew perfect 1cs can be rendered as a present in poetic confession where it expresses a settled disposition rather than a merely past action. 'I love' is idiomatic and fits the psalm's present declaration.
- source_word: מְעוֹן
  chosen: dwelling
  alternatives:
  - habitation
  - dwelling place
  - abode
  lexicon: HALOT
  rationale: מְעוֹן denotes a dwelling or habitation. 'Dwelling' is concise, natural English and preserves the concrete sense without sounding archaic.
- source_word: בֵּיתֶךָ
  chosen: your house
  alternatives:
  - your temple
  - your household
  lexicon: HALOT
  rationale: Literally 'your house.' In Psalmic temple context this refers to the LORD's sanctuary, but 'your house' preserves the Hebrew image and avoids over-specifying beyond the text.
- source_word: וּמְקוֹם
  chosen: the place
  alternatives:
  - and the place
  - even the place
  - the location
  lexicon: HALOT
  rationale: מָקוֹם means 'place.' English apposition works smoothly as 'the dwelling of your house, the place...' without needing to repeat 'and' explicitly.
- source_word: מִשְׁכַּן
  chosen: dwells
  alternatives:
  - dwelling place of
  - tabernacle of
  - where ... resides
  lexicon: HALOT
  rationale: Although מִשְׁכַּן is a noun ('dwelling place/tabernacle'), the construct phrase 'place of the dwelling of your glory' is awkward in English. Rendering the sense as 'the place where your glory dwells' preserves the imagery with readable modern English, consistent with optimal equivalence.
- source_word: כְּבוֹדֶךָ
  chosen: your glory
  alternatives:
  - your honor
  - your splendor
  lexicon: HALOT
  rationale: כָּבוֹד commonly denotes glory, especially in relation to God's manifest presence. 'Your glory' is theologically and lexically appropriate here.
- source_word: מְעוֹן בֵּיתֶךָ
  chosen: the house where you dwell
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This gives natural English for the house as Yahweh’s dwelling while retaining the spatial image.
- source_word: מְקוֹם מִשְׁכַּן כְּבוֹדֶךָ
  chosen: the place where your glory resides
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The relative clause naturally conveys the place associated with the dwelling of divine glory.
