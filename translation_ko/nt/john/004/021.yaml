  verdict: revise
  source_fidelity: 핵심 의미는 대체로 보존되었지만, γύναι를 직접 호격으로 ‘여자’라고 옮긴 것은 현대 한국어에서 무례하게 들릴 가능성이 매우 크며, 원문의 비모욕적 호칭 기능을 충분히 전달하지 못합니다. 또한 ‘때가 오나니 … 때가 오리다’는 원문의 단일한 ἔρχεται ὥρα 구조를 한국어에서 불필요하게 중복합니다.
  naturalness: ‘말씀하셨다’, ‘오나니’, ‘아니할’, ‘오리다’는 요청된 현대 표준어 합쇼체와 맞지 않고 고어적 성경 문체가 혼합되어 있습니다. 현대 합쇼체로 일관되게 고치는 것이 필요합니다.
  terminology: προσκυνήσετε는 이 문맥에서 ‘예배하다’가 적절하고, τῷ πατρί는 신적 칭호로 ‘아버지께’가 적절합니다. γύναι는 ‘여인이여’로 옮기고 각주에서 당시의 예의 있는 호칭임을 밝혀, 원문의 표현과 화용론을 함께 보존합니다.
  issues:
  - severity: medium
    issue: 직접 호격 ‘여자’
    rationale: 현대 한국어에서 사람에게 직접 ‘여자’라고 부르는 표현은 대체로 무례하거나 대상화하는 어감을 냅니다. γύναι는 이 문맥에서 모욕적 호칭이 아니므로, ‘여인이여’와 문화 각주가 더 안전하게 원문의 기능을 보존합니다.
  - severity: medium
