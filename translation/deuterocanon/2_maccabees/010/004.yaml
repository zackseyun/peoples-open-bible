lexical_decisions:
- source_word: οὐδάμως
  chosen: not at all
  alternatives:
  - by no means
  - in no way
  lexicon: LSJ
  rationale: Strong adverb of complete negation; 'not at all' is idiomatic modern English and preserves the emphatic force.
- source_word: ἐπιλογιζόμενος
  chosen: taking into account
  alternatives:
  - considering
  - reckoning with
  lexicon: LSJ
  rationale: The participle conveys reflective consideration or calculation. 'Taking into account' fits the military context of failing to reckon with divine power.
- source_word: τὸ τοῦ θεοῦ κράτος
  chosen: the might of God
  alternatives:
  - the power of God
  - God's dominion
  lexicon: LSJ
  rationale: κράτος here denotes strength or might rather than abstract rule. 'Might' best suits the immediate contrast with military resources.
- source_word: πεφρονηματισμένος
  chosen: puffed up
  alternatives:
  - arrogant
  - emboldened
  - filled with pride
  lexicon: LSJ
  rationale: The perfect participle indicates a settled state of proud self-exaltation. 'Puffed up' captures the inflated arrogance implied by the verb family while remaining vivid and readable.
- source_word: μυριάσιν τῶν πεζῶν
  chosen: the tens of thousands of foot soldiers
  alternatives:
  - the myriads of infantry
  - the countless infantry
  lexicon: LSJ
  rationale: μυριάς can denote a literal ten-thousand unit or, more broadly, very large numbers. Given the paired numerical style with 'thousands of horsemen,' 'tens of thousands' preserves the Greek form without overcommitting to a technical military unit.
- source_word: χιλιάσι τῶν ἱππέων
  chosen: the thousands of horsemen
  alternatives:
  - the thousands of cavalry
  - the thousand horsemen
  lexicon: LSJ
  rationale: Plural dative with article naturally suggests multiple thousands rather than a single thousand. 'Horsemen' is a straightforward rendering of ἱππεῖς.
- source_word: ἐλέφασιν τοῖς ὀγδοήκοντα
  chosen: the eighty elephants
  alternatives:
  - eighty elephants
  lexicon: LSJ
  rationale: The article marks the known contingent in view; English may omit it, but retaining 'the' helps mirror the enumerated military assets.
