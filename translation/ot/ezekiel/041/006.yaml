  meaning_decisions:
  - source_phrase: צֵלָע אֶל צֵלָע שָׁלוֹשׁ וּשְׁלֹשִׁים פְּעָמִים
    prior_rendering: side chamber upon side chamber, three and thirty times
    new_rendering: arranged in three stories, one above another, with thirty chambers in each story
    rationale: Verse 7 explicitly describes three levels; the established architectural reading understands the expression as three stories with thirty chambers on each, rather than thirty-three repetitions.
  - source_phrase: וּבָאוֹת בַּקִּיר ... לִהְיוֹת אֲחוּזִים וְלֹא יִהְיוּ אֲחוּזִים בְּקִיר הַבָּיִת
    prior_rendering: they entered into the wall ... so that they might be supported, but they were not supported by the wall of the house
    new_rendering: Their supports rested on ledges all around the temple wall, rather than being embedded in the wall itself
    rationale: The distinction is between resting on the wall’s supporting ledges and having supports inserted into the wall, not between receiving and not receiving support from it; compare the construction in 1 Kings 6:6.
