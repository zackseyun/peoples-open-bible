base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/006.yaml
  text: My God, my soul is cast down within me; therefore I remember you[c] from the land of the Jordan and the Hermons[a], from Mount Mizar[b].
  footnotes:
  - marker: a
    text: Hebrew 'Hermons' is plural, possibly referring to the Hermon range or peaks of Hermon.
    reason: lexical_alternative
  - marker: b
    text: '''Mount Mizar'' may be a place-name; alternatively, ''the little mountain'' or ''the hill Mizar.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'I will remember you.' The Hebrew verb can express present resolve or future action in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 하나님이시여, 내 영혼이 내 안에서 낙심합니다. 그러므로 내가 요단 땅과 헤르몬 산지에서, 미살 산에서 주님을 기억합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘헤르몬들’은 복수형입니다. 헤르몬 산지 또는 헤르몬의 여러 봉우리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘미살 산’은 지명일 수 있습니다. 또는 ‘작은 산’ 혹은 ‘미살이라는 언덕’으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘기억합니다’는 문맥상 ‘기억하겠습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
