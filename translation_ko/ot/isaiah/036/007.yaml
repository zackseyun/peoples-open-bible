  naturalness: 수정안은 원문의 수사 의문문과 인용 구조를 자연스러운 현대 표준 한국어로 재구성합니다. 직접 인용 속 명령형 ‘절하라’는 본문 발화에 적합하며, 서술부는 합쇼체의 ‘아니겠습니까?’로 유지합니다.
