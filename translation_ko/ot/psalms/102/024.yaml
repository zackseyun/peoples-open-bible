base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/024.yaml
  text: I say, “My God, do not take me away[a] in the middle of my days; your years are through all generations[b].”
  footnotes:
  - marker: a
    text: Or, more literally, “do not bring me up.” The Hebrew verb can mean “bring up,” but here likely carries the sense of being taken away prematurely.
    reason: lexical_alternative
  - marker: b
    text: Or “from generation to generation.”
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 아룁니다. “나의 하나님, 제 날들이 한창일 때 저를 데려가지 마십시오.[a] 주님의 햇수는 대대로 이어집니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘저를 올라가게 하지 마십시오’입니다. 이 문맥에서는 생애가 다하기 전에 데려가거나 거두어 가는 것을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘세대에서 세대로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנָּה
  english_pob_choice: afflicted
  chosen_korean: 괴롭게 하셨고
  alternatives_korean:
