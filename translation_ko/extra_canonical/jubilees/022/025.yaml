  text: Do not fear, my son Jacob, and do not be dismayed, son of Abraham. The Most High God will keep you from corruption, and he will deliver you from every path of error.
  footnotes:
  - marker: a
    text: Or 'from corruption and from every path of error; he will deliver you.'.
    reason: previous_rendering
translation:
  language: ko
  text: 두려워하지 마십시오, 내 아들 야곱아, 그리고 낙심하지 마십시오, 아브라함의 아들이여. 지극히 높으신 하나님께서 당신을 부패에서 지켜 주시고, 모든 잘못의 길에서 당신을 건져 주실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 당신을 부패와 모든 잘못의 길에서 지켜 주시고, 당신을 건져 주실 것입니다.”
    reason: 게에즈어 전치사구와 두 동사의 연결을 달리 분석하는 가능한 구문을 보존합니다.
lexical_decisions:
- source_word: አትፍራህ / ወአትደንግፅ
  english_pob_choice: Do not fear / do not be dismayed
  chosen_korean: 두려워하지 마십시오 / 낙심하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오 / 당황하지 마십시오
  - 두려워하지 마십시오 / 놀라지 마십시오
  lexicon: fear / be dismayed
  rationale: 두 동사는 의미가 겹치지만 뉘앙스가 다르므로, 첫째는 ‘두려워하다’, 둘째는 내적 동요를 나타내는 ‘낙심하다’로 구분해 병렬성을 살렸습니다.
- source_word: ወልድየ፡ ያዕቆብ / ወልደ፡ አብርሃም
  english_pob_choice: my son Jacob / son of Abraham
  chosen_korean: 내 아들 야곱아 / 아브라함의 아들이여
  alternatives_korean:
  - 내 아들 야곱아 / 아브라함의 아들아
  - 야곱아 / 아브라함의 자손이여
  lexicon: vocative kinship address
  rationale: 호격을 분명히 드러내기 위해 첫 절은 친밀한 ‘내 아들 야곱아’, 둘째는 평행 구조를 유지하면서도 한국어 자연성을 살려 ‘아브라함의 아들이여’로 옮겼습니다.
- source_word: አምላከ፡ ልዑል
  english_pob_choice: The Most High God
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 지극히 높으신 하나님께서
  lexicon: Most High God
  rationale: ‘ልዑል’의 절대적 높으심을 자연스럽게 드러내는 관용적 표현으로 ‘지극히 높으신 하나님’을 택했습니다.
- source_word: ይዕቀብከ / ይባልሕከ
  english_pob_choice: will keep you / will deliver you
  chosen_korean: 지켜 주시고 / 건져 주실 것입니다
  alternatives_korean:
  - 보호해 주시고 / 구해 주실 것입니다
  - 지켜 주시고 / 풀어 주실 것입니다
  lexicon: keep / deliver
  rationale: 첫 동사는 보호의 지속성을 살려 ‘지켜 주시고’로, 둘째 동사는 오류의 길에서의 구출을 자연스럽게 드러내는 ‘건져 주시다’로 옮겼습니다.
- source_word: ሙስና / ፍኖተ፡ ስሕተት
  english_pob_choice: corruption / every path of error
  chosen_korean: 부패 / 모든 잘못의 길
  alternatives_korean:
  - 타락 / 모든 오류의 길
  - 썩어짐 / 모든 잘못의 길
  lexicon: corruption / path of error
  rationale: ‘ሙስና’는 도덕적·존재적 훼손을 가리키므로 신학적으로 약화되지 않도록 ‘부패’로, ‘path of error’는 직역을 살리되 한국어로 자연스러운 ‘잘못의 길’로 옮겼습니다.
theological_decisions:
- issue: 지극히 높으신 하나님의 보호와 구원 동사 배열
  chosen_reading: 하나님께서 당신을 부패에서 지켜 주시고, 모든 잘못의 길에서 당신을 건져 주실 것입니다.
  alternative_readings:
  - 하나님께서 당신을 부패와 모든 잘못의 길에서 지키시고 구원하실 것입니다.
  - 하나님께서 당신을 부패에서 지키시고, 모든 잘못의 길에서 구해 주실 것입니다.
  rationale: 게에즈 본문의 두 절이 평행하므로 ‘지켜 주시고 / 건져 주실 것입니다’로 나누어 번역해, 보존과 구출의 이중 동작을 모두 드러냈습니다.
  doctrine_reference: 문자적-평행 구조 보존; 보호와 구원의 이중 동사
- issue: 직접 호칭의 존대 수준
  chosen_reading: 내 아들 야곱아, 그리고 아브라함의 아들이여
  alternative_readings:
  - 내 아들 야곱아, 그리고 아브라함의 아들아
  - 야곱아, 아브라함의 아들이여
  rationale: 예언적/축복적 호칭의 친밀함을 보존하되, 한국어 합쇼체 본문과 충돌하지 않도록 호격만 자연스럽게 처리했습니다.
  doctrine_reference: 화자-청자 관계의 수사적 유지
