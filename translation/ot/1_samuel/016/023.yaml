  category: meaning_retranslation
  from: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
  to: Whenever the spirit from God came upon Saul, David would take the lyre and play it; Saul would find relief and feel better, and the harmful spirit[a] would depart from him.
  rationale: I preserve the earlier decision not to add “harmful” to the opening clause, while “from God” clarifies the relationship already expressed that way in verses 15–16. The prior preference for “harmful” is retained, and the instrumental action and improved condition are expressed in natural English.
