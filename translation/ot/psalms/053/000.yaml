id: PSA.53.0
reference: Psalms 53:0
source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ עַֽל מָחֲלַ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד־׃
translation:
  text: 'For the choir director: according to Mahalath[a]. A Maskil[b] of David[c].'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Probably a tune name or musical instruction; its precise meaning is uncertain.
    reason: lexical_alternative
  - marker: b
    text: A term used in psalm headings, perhaps for an instructive or contemplative song.
    reason: lexical_alternative
  - marker: c
    text: “Of David” may indicate authorship or association with David.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  chosen: For the choir director
  alternatives:
  - For the music director
  - To the choirmaster
  lexicon: HALOT
  rationale: In Psalm superscriptions, this term conventionally addresses the one overseeing musical performance. 'Choir director' is clear modern English and preserves the functional sense without archaic wording.
- source_word: עַל
  chosen: according to
  alternatives:
  - upon
  - 'on'
  - set to
  lexicon: HALOT
  rationale: In musical superscriptions, עַל commonly introduces the tune, style, or performance indication. 'According to' is a natural English rendering that leaves the exact technical nuance open.
- source_word: מָחֲלַת
  chosen: Mahalath
  alternatives:
  - Mahalat
  - sickness
  lexicon: HALOT
  rationale: Because the referent in the superscription is uncertain and likely a tune name or musical term, transliteration is preferable to a speculative semantic translation such as 'sickness.' This preserves auditability and avoids over-interpreting the heading.
- source_word: מַשְׂכִּיל
  chosen: A Maskil
  alternatives:
  - A contemplative psalm
  - An instructive song
  lexicon: HALOT
  rationale: The precise force of this technical psalm heading is debated. Retaining the traditional transliteration avoids false precision in the main text while preserving the category marker.
- source_word: לְדָוִד
  chosen: of David
  alternatives:
  - belonging to David
  - for David
  - by David
  lexicon: HALOT
  rationale: The preposition ל in psalm titles can indicate authorship, association, dedication, or collection. 'Of David' is the most transparent and least overdetermined English rendering, preserving the ambiguity of the Hebrew.
