translation:
  text: 'VI.1. “Do you want to know about those being cut down and hurled far from the tower? They are
    the sons of lawlessness[a]. They believed in hypocrisy, and no wickedness left them. That is why they
    have no salvation[i]: they are not useful for the building because of their wicked deeds. So they
    were cut away and flung far off because of the Lord’s anger, because they provoked him[j].”


    VI.2. “The many others you saw lying there, not going into the building, are the scabbed ones[h].
    They came to know the truth but did not remain in it or cling to the holy ones[k]. That is why they
    are useless.”


    VI.3. “Who are those with cracks[g]?” “They harbor things against each other in their hearts and are
    not at peace among themselves. They put on a face of peace[l], but when they leave each other, their
    evils remain in their hearts. These are the cracks the stones have.”


    VI.4. “Those cut short are people who have believed. They have the greater part in righteousness[m],
    but still have some parts of lawlessness. That is why they are truncated and not whole.”


    VI.5. “Who are the white, round stones that do not fit into the building, Lady?” Answering me, she
    says, “How long will you be foolish and without understanding, asking about everything and understanding
    nothing? They have faith, but also the wealth of this age[n]. When affliction comes, they deny their
    Lord because of their wealth and their business dealings.”


    VI.6. And answering her, I say, “Lady, when will they become useful for the building?” She says, “When
    the wealth that captivates their souls[f] is cut back[s], they will be useful to God[o]. Just as a
    round stone[p] cannot become square[e] unless it is trimmed and sheds something from itself, those
    who are rich in this age cannot become useful to the Lord unless their wealth is cut back[q].”


    VI.7. “[But][d] learn first from yourself: when you were rich[r], you were useless. Now you are useful
    and beneficial for life. All of you, become useful to God[b]; for you yourself are also used from
    among the same stones[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sons of lawlessness preserves the idiom for people characterized by lawlessness. It is not a
      claim about their biological parentage.
    reason: lexical_alternative
  - marker: b
    text: Become is plural in ginesthe, addressing more than Hermas alone; all of you makes that number
      clear without identifying a new group. Athos, Sinaiticus14.7 and Palatina printed45 retain a plural
      imperative to be useful to God. The Ethiopic edition’s Latin rendering printed121 addresses useful
      to the Lord. Vulgata printed22 lacks this separate imperative. Earlier decisions concerning the
      plural address are preserved in the history archive.
    reason: textual_variant
  - marker: c
    text: The selected chrāsai ek tōn autōn lithōn is difficult. The main text retains the earlier contextual
      passive interpretation, you are used from among the same stones; the active alternative is you yourself
      also make use of the same stones. The middle form is not itself unambiguous proof of a passive.
      Athos retains the Greek clause; Sinaiticus14.7 omits it. Vulgata printed22 says you yourself were
      of those stones; Palatina printed45 says you will be more useful from those stones; the Ethiopic
      edition’s Latin rendering printed121 says you are or will be of those stones. These are different
      formulations, not active-use corroboration. Palatina’s editorial commentary separately proposes
      a passive interpretation; that proposal is not another manuscript reading. Both interpretations
      remain disclosed without claiming unanimous witnesses or unique grammatical certainty.
    reason: textual_variant
  - marker: d
    text: The working print places de, but or and, in brackets as editorially supplied or uncertain. The
      bracketed But in English preserves that status. Athos PlateIII lacks de here; Sinaiticus14.7 first
      lacks it and ca adds it. The correction is not an independent codex.
    reason: textual_variant
  - marker: e
    text: Square renders tetragōnos, also four-cornered. The analogy explicitly requires trimming and
      shedding something from the round stone; it supplies no measurement or masonry plan.
    reason: lexical_alternative
  - marker: f
    text: Captivates their souls renders psychagōgōn, also charms or entertains them. The prior captivates-their-souls
      choice is retained. Palatina printed45 instead has wealth which strengthens them; Vulgata printed21
      has delights them; the Ethiopic edition’s Latin rendering printed121 has seduces their soul. These
      different renderings are not silently made identical.
    reason: textual_variant
  - marker: g
    text: Cracks renders the stone description schismas; divisions or schisms expresses its figurative
      communal force. The following heart grievances and outward peace explain that image here.
    reason: lexical_alternative
  - marker: h
    text: Scabbed renders epsōriakotes, from the scab or itch word. Scabby or scurfy are alternatives;
      no particular medical diagnosis or leprosy is specified. The prior scabbed choice remains.
    reason: lexical_alternative
  - marker: i
    text: Salvation renders sōtēria, also deliverance or rescue. The selected statement is they have no
      salvation because their wicked deeds make them unfit for building; the denial and its stated reason
      are retained without adding a remedy in this paragraph.
    reason: lexical_alternative
  - marker: j
    text: The selected opening includes cutting down and being thrown far; Sinaiticus14.1 lacks that first
      thrown-far clause but retains the later cutting/flinging, anger and exclusion. The selected no-wickedness-departed
      wording preserves the negative idiom; Sinaiticus and the Latin versions likewise retain all-wickedness/not-depart
      wording. The Ethiopic edition’s Latin rendering printed120 instead says they do not leave all their
      wickedness. The versions’ formulations are distinguished rather than used to erase the selected
      negative or anger.
    reason: textual_variant
  - marker: k
    text: Holy ones renders hagioi, also saints. The source says they did not cling to them, then therefore
      are useless. Sinaiticus14.2 first lacks the preceding not before going into the building; ca adds
      it. Sinaiticus also lacks the entire not-clinging/therefore-useless tail, as do Palatina printed43
      and the Ethiopic edition’s Latin rendering printed121. Athos and Vulgata printed20–21 retain that
      tail, with Athos’s bracketed portions distinguished in the evidence. The full selected text remains.
    reason: textual_variant
  - marker: l
    text: A face of peace describes an outward appearance of peace while heart grievances persist. The
      translation does not turn the selected absence of actual peace into a statement of genuine reconciliation.
    reason: lexical_alternative
  - marker: m
    text: Righteousness and some parts of lawlessness both remain; the people have believed but are not
      whole. In Vulgata printed21 the righteousness/some-iniquity words are printed in brackets, explicitly
      supplemented from Palatina by the editor. They are not claimed as unbroken Vulgata codex text. Athos
      PlateIII also brackets parts of this passage.
    reason: textual_variant
  - marker: n
    text: Faith renders pistis, with trust or faithfulness as lexical alternatives. Sinaiticus14.5 lacks
      the selected this-age/when-affliction/wealth-cause sequence and proceeds from their wealth to business
      dealings and denying their Lord. Athos and the versions retain the affliction and wealth clauses
      in their wording. Palatina printed45 says deny their God, rather than the selected their Lord. The
      selected faith, wealth, affliction, two reasons and denial are all retained.
    reason: textual_variant
  - marker: o
    text: Lord renders kyrios, also Master. The selected paragraph6 first says useful to God and later
      useful to the Lord. Sinaiticus14.6 retains those titles. Athos PlateIII has Christ in the later
      comparison rather than Lord. Vulgata printed21 has useful to the Lord for building in the first
      answer, and the Ethiopic edition’s Latin rendering printed121 has Lord in both corresponding formulations.
      Palatina printed45 has God then Lord. No title harmonization is made.
    reason: textual_variant
  - marker: p
    text: P.Oxy.4706 fragment2 covers only a small central strip of this comparison, seven lines of surviving
      word parts, matched to the edition and Oxford image. Most words on either side are restored. In
      the edition gar, for, in line1 is restored from spacing; the possible position of ti, something,
      and possible omission of kai, and, are editorial uncertainties. These are not certified visible
      complete words or adopted new readings. The fragment does not reach the later Lord/Christ title
      or the paragraph7 closing clause.
    reason: textual_variant
  - marker: q
    text: The stone cannot become square unless trimmed and shedding something; likewise the rich cannot
      become useful to the Lord unless their wealth is cut back. Both negative conditions remain. The
      source calls for a reduction here without specifying an amount or stating in this clause that every
      possession must be surrendered.
    reason: lexical_alternative
  - marker: r
    text: The selected contrast is when you were rich, you were useless; now useful and beneficial for
      life. Sinaiticus14.7 has two anonymous corr entries concerning the rich/useful-useless forms and
      punctuation; they are distinguished from its main reading and not counted as separate manuscripts.
      The Ethiopic edition’s Latin rendering printed121 instead has if you are rich in the present. The
      selected past/now contrast remains.
    reason: textual_variant
  - marker: s
    text: Cut back renders perikopē, retaining the earlier choice and the stone-trimming image. The word
      describes a reduction; its precise extent is not specified in this clause.
    reason: textual_variant
lexical_decisions:
- source_word: κατακοπτομένους
  chosen: cut down
  alternatives:
  - cut to pieces
  - hewn down
  - cut off
  lexicon: LSJ
  rationale: Maintains the violent image of stones being cut away, consistent with the tower-building
    metaphor.
- source_word: ῥιπτομένους
  chosen: hurled
  alternatives:
  - thrown
  - flung
  lexicon: LSJ
  rationale: Conveys force (not a gentle placing) and pairs well with ‘cut down’ to intensify the judgment
    image.
- source_word: υἱοὶ τῆς ἀνομίας
  chosen: sons of lawlessness
  alternatives:
  - children of lawlessness
  - lawless ones
  lexicon: BDAG
  rationale: Preserves Semitic idiom ‘sons of …’ and the moral characterization without smoothing into
    generic ‘lawless people.’
- source_word: ἐπίστευσαν ἐν ὑποκρίσει
  chosen: believed in hypocrisy
  alternatives:
  - believed in pretense
  - believed insincerely
  lexicon: BDAG
  rationale: Retains explicit mention of ‘hypocrisy’ rather than paraphrasing; this keeps Hermas’s moral
    register sharp.
- source_word: πᾶσα πονηρία οὐκ ἀπέστη
  chosen: no wickedness departed
  alternatives:
  - all wickedness did not leave
  - their evil did not withdraw
  lexicon: BDAG
  rationale: Retain the earlier adjudicated negative-idiom rendering rather than the potentially misleading
    literal every-wickedness-did-not-depart. Notej distinguishes the Ethiopic edition’s different wording.
- source_word: σωτηρίαν
  chosen: salvation
  alternatives:
  - deliverance
  - rescue
  lexicon: BDAG
  rationale: ‘Salvation’ is the established soteriological term; alternatives would understate the gravity
    in this context.
- source_word: εὔχρηστοι εἰς οἰκοδομήν
  chosen: useful for the building
  alternatives:
  - useful for the building
  - fit for construction
  lexicon: LSJ
  rationale: Keeps the construction metaphor explicit (‘building’) and uses ‘serviceable’ to match the
    utilitarian imagery of stones.
- source_word: συνεκόπησαν
  chosen: were cut away
  alternatives:
  - were hewn down
  - were cut off
  lexicon: LSJ
  rationale: In the stone-building context, ‘cut away’ fits well and ties to later ‘trimming’ language.
- source_word: πόρρω ἀπερίφησαν
  chosen: flung far off
  alternatives:
  - thrown far away
  - cast far off
  lexicon: LSJ
  rationale: Preserves both the rejection (‘cast off’) and the distance (‘far’), intensifying the exclusion
    image.
- source_word: ὀργὴ τοῦ Κυρίου
  chosen: anger of the Lord
  alternatives:
  - wrath of the Lord
  lexicon: BDAG
  rationale: ‘Anger’ conveys divine displeasure without importing later technical nuances of ‘wrath’;
    aligns with Cartha’s default for Kyrios as ‘Lord.’
- source_word: ἐψωριακότες
  chosen: scabbed (ones)
  alternatives:
  - scabby ones
  - mange-covered
  - scurfy
  lexicon: LSJ
  rationale: ψώρα denotes scab/itch; ‘scabbed’ retains the concrete, unflattering image without medical
    anachronism (‘leprous’).
- source_word: μὴ ἐπιμείναντες
  chosen: did not remain
  alternatives:
  - did not continue
  - did not persevere
  lexicon: BDAG
  rationale: ‘Remain’ is a direct, transparent rendering that preserves the simple aspect of staying in
    the truth.
- source_word: κολλώμενοι τοῖς ἁγίοις
  chosen: cling to the holy ones
  alternatives:
  - attach themselves to the holy ones
  - join the saints
  lexicon: BDAG
  rationale: ‘Cling’ mirrors the metaphor of adhesion and community bond; ‘holy ones’ retains the literal
    phrase instead of ecclesiastical ‘saints.’
- source_word: σχίσματα
  chosen: cracks
  alternatives:
  - splits
  - divisions
  - schisms
  lexicon: LSJ
  rationale: Within the stone imagery, ‘cracks’ is the most concrete; a footnote notes the ecclesial sense
    ‘divisions/schisms.’
- source_word: κατ᾽ ἀλλήλων ἐν ταῖς καρδίαις ἔχοντες
  chosen: harbor things against one another in their hearts
  alternatives:
  - having things against each other in their hearts
  - bearing hostility toward one another
  lexicon: BDAG
  rationale: ‘Harbor’ captures an ongoing inner posture consistent with the allegory’s interior focus.
- source_word: πρόσωπον εἰρήνης
  chosen: a face of peace
  alternatives:
  - appearance of peace
  - outward show of peace
  lexicon: LSJ
  rationale: Retains the vivid idiom (face/mask), highlighting duplicity.
- source_word: κεκολοβωμένοι / κολοβοί
  chosen: cut short / truncated
  alternatives:
  - maimed
  - mutilated
  - stunted
  lexicon: LSJ
  rationale: In the stone context, ‘cut short/truncated’ conveys incompleteness without medical connotations.
- source_word: ὁλοτελεῖς
  chosen: whole
  alternatives:
  - complete
  - entire
  lexicon: LSJ
  rationale: Simple, idiomatic opposite to ‘truncated’; matches the moral picture of integrity.
- source_word: λευκοί καὶ στρογγύλοι
  chosen: white and round
  lexicon: LSJ
  rationale: Direct description preserves the visual of clean, smooth stones that do not interlock.
- source_word: μὴ ἁρμόζοντες
  chosen: do not fit
  alternatives:
  - do not join
  - do not suit
  lexicon: LSJ
  rationale: ‘Fit’ is the standard building term for stones that interlock in construction.
- source_word: πλοῦτος τοῦ αἰῶνος τούτου
  chosen: the wealth of this age
  alternatives:
  - worldly wealth
  lexicon: BDAG
  rationale: Retains the temporal contrast (‘this age’) central to Hermas’s moral economy.
- source_word: θλῖψις
  chosen: affliction
  alternatives:
  - pressure
  - tribulation
  lexicon: BDAG
  rationale: ‘Affliction’ is natural English and matches the context of testing; ‘tribulation’ is heavier
    but more technical.
- source_word: πραγματεῖαι
  chosen: business dealings
  alternatives:
  - occupations
  - affairs
  - pursuits
  lexicon: LSJ
  rationale: Conveys mercantile/transactional nuance without archaic ‘traffickings.’
- source_word: περικοπῇ (πλοῦτος)
  chosen: be cut back
  alternatives:
  - be trimmed
  - be pared down
  lexicon: LSJ
  rationale: Echoes the stone-cutting metaphor and communicates reduction without suggesting total renunciation.
- source_word: ὁ ψυχαγωγῶν αὐτούς
  chosen: which captivates their souls
  alternatives:
  - which entertains them
  - which charms them
  lexicon: LSJ
  rationale: ψυχαγωγέω in classical usage means to lead/captivate the soul, often with entertainment;
    ‘captivates’ carries the pull/attraction idea.
- source_word: τετράγωνος
  chosen: square
  alternatives:
  - four-cornered
  lexicon: LSJ
  rationale: ‘Square’ is idiomatic; footnote notes literal ‘four-cornered,’ an ancient building ideal.
- source_word: πλουτοῦντες ἐν τούτῳ τῷ αἰῶνι
  chosen: those who are rich in this age
  alternatives:
  - those who prosper in this age
  lexicon: BDAG
  rationale: Keeps verbal aspect of ongoing wealth and the temporal frame.
- source_word: ἄχρηστος / εὔχρηστος
  chosen: useless / useful
  alternatives:
  - unserviceable / serviceable
  lexicon: LSJ
  rationale: Simple, direct antonyms that the passage repeatedly contrasts; fits the tool-like imagery.
- source_word: ὠφέλιμος τῇ ζωῇ
  chosen: beneficial for life
  alternatives:
  - profitable for life
  - helpful to life
  lexicon: BDAG
  rationale: ‘Beneficial’ captures moral/spiritual advantage without commercial overtones.
- source_word: χρᾶσαι ἐκ τῶν αὐτῶν λίθων
  chosen: are also used from among the same stones
  alternatives:
  - make use of the same stones
  lexicon: LSJ
  rationale: Retain the prior contextual passive interpretation while disclosing the active alternative
    in notec. Neither the middle form alone nor the versions establish unique grammatical certainty; their
    different formulations are recorded.
