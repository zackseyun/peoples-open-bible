  - severity: medium
    issue: 각주 표지가 해당 본문과 연결되지 않습니다.
    rationale: 초안의 각주는 거룩함 및 세겜 관련 표현을 다루지만, 이 절의 난해한 블레셋 외침과 ‘씻는 그릇’ 은유를 설명해야 합니다.
  revised_text: 모압은 내가 씻는 대야입니다. 에돔 위에 내가 내 신을 던지겠습니다. 블레셋아, 나를 위하여 승리의 함성을 지르십시오.[a]
  revised_footnotes:
  - marker: a
    text: 또는 전통적 번역을 따라, ‘블레셋 위에서 내가 승리의 함성을 지르겠습니다.’ 히브리어 동사 형태는 이해하기 어려우며, 블레셋에게 하는 명령으로도, 덜 가능하지만 화자가 하는 1인칭 선언으로도 이해될 수 있습니다.
    reason: alternative_reading
