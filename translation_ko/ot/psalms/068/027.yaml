translation:
  language: ko
  text: 그곳에는 작은 베냐민이 그들을 이끌고 있고,[a] 유다의 지도자들은 그 무리와 함께 있으며,[b] 스불론의 지도자들과 납달리의 지도자들도 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '그들을 다스리는' 또는 '그들에게 우위를 지닌'으로도 옮길 수 있습니다. 이 문맥에서는 행렬을 이끄는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 드문 단어는 '그들의 무리', '그들의 동료들', 또는 '그들의 군중'을 뜻할 수 있으며, 정확한 뉘앙스는 불확실합니다.
    reason: lexical_alternative
