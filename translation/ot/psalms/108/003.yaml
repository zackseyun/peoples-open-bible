  from: I will give thanks to you among the peoples[a], O Yahweh[b], and I will sing praise to you among the nations.
  to: I will give thanks to you[a] among the peoples, O Yahweh, and I will sing praise to you among the nations.
  rationale: The parallel terms for peoples and nations need no note. However, “I will praise you” is a legitimate alternative for אוֹדְךָ and should be retained at the phrase it qualifies. A new explanatory note on “Yahweh” is not needed merely because the name is transliterated, and the proposed note goes beyond resolving a translation issue in this verse.
