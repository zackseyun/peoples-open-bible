  - Explicitly render as angelic ranks
  rationale: The verse likely includes cosmic/spiritual authorities, but the Greek itself lists authority categories without explicit ontological specification. The translation preserves the breadth and does not import a narrower doctrinal claim than the text states.
  doctrine_reference: Preserve theological tension rather than resolve it.
