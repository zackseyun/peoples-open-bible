    2. “How, sir,” I say, “is it a sister of these? For quick temper seems to me one thing, double‑mindedness
    another, and sorrow another.” “You are senseless, man,” he says, “and do you not perceive that sorrow
    is more evil than all the spirits and most dreadful for the servants of God[c], and that beyond all
    the spirits it destroys a person and wears away the Holy Spirit[d]—and then saves again[g]?”


    3. “I, sir,” I say, “am senseless, and I do not understand these parables. For how can it wear away
    and then save? I do not understand.”


    4. “Listen,” he says. “Those who have never inquired about the truth nor sought concerning the divine,
    but have only believed, and are mixed up with business affairs and wealth and pagan friendships[f]
    and many other affairs of this age—so all who devote themselves to these do not understand the parables
    of the divine[e]; for they are darkened by these pursuits and are corrupted and become barren.”


    5. “Just as good vineyards[h], when they are neglected, become barren from thorns and various weeds,
    so also the people who have believed and fall into these many pursuits just mentioned are led astray
    from their understanding, and they understand nothing at all about righteousness. And even when they
    hear about the divine and the truth, their mind is occupied with their business, and they understand
    nothing at all.


    6. “But those who have the fear of God and inquire about the divine and the truth and have their heart
    toward the Lord more quickly understand and comprehend[i] everything spoken to them, because they
    have the fear of the Lord within themselves; for where the Lord dwells, there also is abundant understanding.
