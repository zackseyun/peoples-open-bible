base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/008.yaml
  text: Depart from me, all you workers of wickedness[a], for Yahweh has heard the sound of my weeping[b].
  footnotes:
  - marker: a
    text: Or 'My eye has grown dim from vexation; it has become worn out because of all my adversaries.'
    reason: lexical_alternative
translation:
  language: ko
  text: 악을 행하는 자들아, 모두 내게서 떠나가십시오. 야훼께서 제가 우는 소리를 들으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשְׁשָׁה
  english_pob_choice: has wasted away
  chosen_korean: 쇠하였고
  alternatives_korean:
  - 시들었고
  - 닳아 없어졌고
  - 쇠약해졌고
  lexicon: HALOT
  rationale: ‘쇠하다’는 몸이 기운을 잃고 약해지는 상태를 자연스럽게 드러내며, 눈의 소진이라는 시적 이미지를 비교적 직접적으로 살립니다.
- source_word: מִכַּעַס
  english_pob_choice: from grief
  chosen_korean: 슬픔으로
  alternatives_korean:
  - 분노로
  - 답답함으로
  - 비통함으로
  lexicon: HALOT
  rationale: 이 문맥은 원수들로 인한 개인적 탄식이므로, ‘슬픔’이 감정적 원인을 가장 자연스럽게 전달합니다.
- source_word: עָתְקָה
  english_pob_choice: has grown old
  chosen_korean: 늙어 버렸습니다
  alternatives_korean:
  - 낡아 버렸습니다
  - 지쳐 버렸습니다
  - 쇠약해졌습니다
  lexicon: HALOT
  rationale: ‘늙다’는 원문이 지닌 ‘오래되어 낡고 쇠한’ 느낌을 살리며, 눈을 의인화한 시적 표현을 한국어에서도 유지합니다.
- source_word: צֹרְרָי
  english_pob_choice: my enemies
  chosen_korean: 내 원수들
  alternatives_korean:
  - 내 적들
  - 나를 대적하는 자들
  - 내 적대자들
  lexicon: HALOT
  rationale: צורר는 단순한 반대자보다 해를 끼치며 적대하는 자들을 가리키므로, 시편의 탄식 어조에 맞는 ‘원수들’을 채택했습니다.
theological_decisions:
- issue: 히브리 시에서 원인 표현의 전달
  chosen_reading: ‘슬픔으로’와 ‘모든 내 원수들 때문에’로 원인과 결과를 분명히 드러냈습니다.
  alternative_readings:
  - ‘분노로’
  - ‘원수들 가운데서’
  - ‘모든 내 원수들로 인해’
  rationale: 이 절은 신학적 난점보다 시적-정서적 흐름이 핵심이므로, 몸의 쇠약과 원수들의 다중성을 한국어에서 자연스럽게 연결하는 쪽을 택했습니다.
  doctrine_reference: 시편 탄식 전통
