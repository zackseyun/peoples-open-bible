translation:
  text: 'II.1. After she said these words, the heavens closed. I was trembling all over and grieving.
    I said to myself, “If this sin is charged against me, how can I be saved? How can I make atonement
    to God for my completed sins[a][4]? What words can I use to ask the Lord to be favorable to me[3]?”


    II.2. While I was thinking these things over and weighing them in my heart, I saw a great white chair[2]
    in front of me, made of snowy wool[6]. An elderly woman[5] came in most radiant clothing, holding
    a book in her hands. She sat down alone and greeted me: “Greetings, Hermas[1]!” Grieving and weeping[b],
    I said, “Greetings, Lady.”


    II.3. She said to me, “Why are you gloomy, Hermas? You are patient, not given to contention[7], and
    always laughing. Why do you look so downcast and not cheerful?” I said to her, “Because a most excellent
    woman said that I sinned against her[c].”


    II.4. But she said, “By no means does this matter apply to the servant of God[d]. Yet surely a thought
    about her rose into your heart[e]. Such an intention brings sin upon God’s servants. It is an evil
    and startling intention for a most reverent spirit[8], already proven, if it desires an evil deed—especially
    Hermas, the self-controlled one, who abstains from every evil desire and is full of all simplicity
    and great innocence[f].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: “Greetings” translates chaire; literally, “rejoice.”
    reason: lexical_alternative
  - marker: '2'
    text: Chair renders kathedra; seat is an alternative. The word itself does not require throne. The
      chair is great, white and made of wool; the woman carries the book.
    reason: lexical_alternative
  - marker: '3'
    text: Make atonement to God renders exilasomai ton Theon; appease or propitiate God are alternatives.
      Be propitious or favorable to me renders hilateuthe moi; be gracious is another rendering. The source
      voices Hermas’s anxious questions, not a narrated act of atonement already performed. Vulgata printed4–5
      speaks of entreating the Lord for sins; Palatina printed9–11 also retains asking for propitiation.
      The working text’s God/Lord distinction is retained.
    reason: lexical_alternative
  - marker: '4'
    text: Completed sins renders hamartion mou ton teleion. Complete or fully developed sins are alternatives;
      the precise force is difficult, and grievous sins is an interpretive alternative. Athos and Sinaiticus2.1
      retain the adjective; Vulgata printed5 has plenissimis, very full, whereas Palatina printed9 has
      my sins without that intensifier. The translation does not silently change the modifier of sins
      into an adverb describing the completeness of atonement.
    reason: lexical_alternative
  - marker: '5'
    text: The “elderly woman” addressed as “Lady” will later be identified symbolically with the Church;
      see subsequent visions.
    reason: cross_reference
  - marker: '6'
    text: The working Greek and Athos describe snowy wool. Sinaiticus2.2 first hand has white chair made
      of wool but lacks chioninon, snowy; corrector ca adds it. Vulgata printed5 and Palatina printed11
      both retain the snow comparison. The material and color describe the chair, not the woman’s hair
      or her clothing.
    reason: textual_variant
  - marker: '7'
    text: The rare adjective astomachētos is the opposite of being irritable or quick‑tempered (cf. stomachomai,
      “to be angry”).
    reason: cultural_note
  - marker: '8'
    text: Spirit renders pneuma. The source describes a most reverent, already proven spirit desiring
      evil; in context this concerns personal moral character. It does not explicitly name the Holy Spirit
      here. The difficult connection of such desire with the tested spirit and self-controlled Hermas
      is preserved.
    reason: cultural_note
  - marker: a
    text: Or 'concerning my complete sins'.
    reason: lexical_alternative
  - marker: b
    reason: textual_variant
    text: The working Greek, Athos and both Latin versions have grieving and weeping. Sinaiticus2.2 first
      hand has grieving and rejoicing; corrector ca changes the latter to weeping. First hand and corrector
      are distinguished, not counted as two manuscripts.
  - marker: c
    reason: textual_variant
    text: The working Greek, Athos and Sinaiticus2.3 first hand give Hermas’s answer as because of a most
      excellent woman saying he sinned against her. Sinaiticus corrector ca adds Lady, a reproach has
      come upon me, with several letters marked supplied in the XML. Vulgata printed5 has an insult or
      reproach brought against him by the woman, with a different word reported for English manuscripts.
      Palatina printed11 lacks the added reproach phrase. The shorter working answer remains.
  - marker: d
    reason: lexical_alternative
    text: Servant renders doulos in both singular and plural. Bondservant and slave document the bonded-status
      and ownership nuance. The current project’s reader-facing policy uses servant; it does not mandate
      slave here. The full superseded decision record remains archived.
  - marker: e
    reason: textual_variant
    text: Surely follows working pantos and is also in Athos and Sinaiticus2.4. Both Latin printed passages
      instead have forte, perhaps. The working assertion is retained; the pronoun concerning her does
      not itself spell out the noun thought, which English supplies from the surrounding discussion of
      intention.
  - marker: f
    reason: textual_variant
    text: The working Greek, Athos and Sinaiticus2.4 retain abstention from every evil desire, fullness
      of all simplicity, and great innocence. Vulgata printed5 instead speaks of abstention from every
      wicked pollution while retaining fullness of simplicity and innocence. Palatina printed11 has every
      unjust desire, but its words plenus es, you are full, are an editorial supplement explicitly absent
      from the reported codex. That supplement is not counted as preserved Latin words.
lexical_decisions:
- source_word: πεφρικώς
  chosen: trembling all over
  alternatives:
  - shuddering all over
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Retain the bodily fear together with grieving.
- source_word: ἐξιλάσομαι τὸν Θεόν
  chosen: make atonement to God
  alternatives:
  - appease God
  - propitiate God
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Retain the question and its divine object; note3 gives alternatives.
- source_word: τελείων
  chosen: completed sins
  alternatives:
  - complete sins
  - fully developed sins
  - grievous sins (interpretive)
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: The adjective modifies sins; disclose its difficult force.
- source_word: ἱλατευθῇ μοι
  chosen: be favorable to me
  alternatives:
  - be favorable to me
  - be gracious to me
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Preserve Hermas’s request for divine favor.
- source_word: καθέδρα
  chosen: chair
  alternatives:
  - seat
  - throne (contextual interpretation)
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Do not require a throne where the selected noun is chair or seat.
- source_word: ἐξ ἐρίων χιονίνων
  chosen: made of snowy wool
  alternatives:
  - made of snow-white wool
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Retain working snowy, with the Sinaiticus correction disclosed.
- source_word: κλαίων
  chosen: weeping
  alternatives:
  - crying
  - rejoicing (Sinaiticus first hand reading)
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Follow working weeping and distinguish the substantive first-hand/corrector difference.
- source_word: ἀστομάχητος
  chosen: not given to contention
  alternatives:
  - not quick-tempered
  - not irritable
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Retain the rare negative adjective about temperament; note7 explains its lexical family.
- source_word: δοῦλος τοῦ Θεοῦ
  chosen: servant of God
  alternatives:
  - bondservant of God
  - slave of God
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Current reader policy uses servant. Bonded-status nuance remains explicit in note d.
- source_word: πάντως
  chosen: surely
  alternatives:
  - certainly
  - perhaps (Latin versional reading)
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Preserve the working degree of certainty rather than silently substituting the Latin alternative.
- source_word: πάνσεμνον πνεῦμα
  chosen: most reverent spirit
  alternatives:
  - most venerable spirit
  - most holy spirit
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Keep the superlative and spirit term without explicitly naming the Holy Spirit.
- source_word: δεδοκιμασμένον
  chosen: already proven
  alternatives:
  - already tested and approved
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Retain both prior testing and its completed force.
- source_word: ἀπεχόμενος πάσης ἐπιθυμίας πονηρᾶς
  chosen: abstains from every evil desire
  alternatives:
  - refrains from every evil desire
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Keep third-person description and complete every/all scope.
- source_word: ἁπλότης καὶ ἀκακία
  chosen: simplicity and great innocence
  alternatives:
  - simplicity and great guilelessness
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Preserve both virtues, all simplicity and the greatness of innocence in the sentence.
