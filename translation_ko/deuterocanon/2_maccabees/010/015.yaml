  text: But Maccabeus agreed to everything that Lysias urged, being concerned for the common good; for whatever Maccabeus submitted in writing to Lysias concerning the Jews, the secretary approved.
translation:
  language: ko
  text: 그러나 마카베오는 공동의 이익을 염두에 두고 리시아스가 촉구한 모든 것에 동의하였습니다.[a] 마카베오가 유다인들에 관하여 서면으로 리시아스에게 제시한 모든 것을 서기관이 허락하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘촉구한’은 παρακαλέω가 이 문맥에서 지닌 권유·요청의 뜻을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘서기관’(γραμματεύς)은 여기서 문서 업무를 맡은 행정 관리를 가리킬 수 있습니다. 정확한 현대 직함은 확정하기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπένευσε ... ἐπὶ πᾶσιν οἷς ὁ Λυσίας παρεκάλει
  english_pob_choice: agreed to everything that Lysias urged
  chosen_korean: 리시아스가 권하는 모든 일에 동의하였는데
  alternatives_korean:
  - 리시아스가 요구한 모든 일에 응하였는데
  - 리시아스가 제안한 모든 것에 동의하였는데
  lexicon: ἐπινεύω / παρακαλέω
  rationale: παρεκάλει는 단순 제안보다 간곡히 권하거나 촉구하는 뉘앙스가 있어 ‘권하다’로 옮겨 압박감과 협의의 성격을 함께 살렸습니다.
- source_word: τοῦ συμφέροντος φροντίζων
  english_pob_choice: being concerned for the common good
  chosen_korean: 공동의 이익을 염두에 두었기 때문입니다
  alternatives_korean:
  - 공동의 유익을 생각하고 있었기 때문입니다
  - 공적인 이익을 돌보고 있었기 때문입니다
  lexicon: συμφέρον
  rationale: συμφέρον은 개인적 이익이 아니라 ‘유익/이익’의 유익성을 가리키므로, 공동체적 방향을 분명히 하는 ‘공동의 이익’으로 옮겼습니다.
- source_word: ὁ γραμματεύς
  english_pob_choice: the secretary approved
  chosen_korean: 문서관이 모두 승인하였습니다
  alternatives_korean:
  - 서기관이 승인하였습니다
  - 비서가 승인하였습니다
  lexicon: γραμματεύς
  rationale: 이 문맥에서 γραμματεύς는 행정 문서 처리 책임자를 가리키므로, 교회적 용어 ‘서기관’보다 행정적 기능이 드러나는 ‘문서관’을 택했습니다.
theological_decisions:
- issue: 본문의 협상/승인 구조를 어떻게 드러낼지
  chosen_reading: 마카베오의 동의와 리시아스의 촉구, 그리고 문서상의 승인이라는 행정적 협의 구조를 그대로 드러냈습니다.
  alternative_readings:
  - 마카베오가 리시아스의 제안을 받아들였습니다
  - 마카베오가 리시아스의 요청을 승인했습니다
  rationale: 본문은 전투 서술이 아니라 협상과 문서 승인에 관한 역사 서술이므로, 행정적·외교적 절차를 평이하게 유지하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 역사서 본문 해석 원리
