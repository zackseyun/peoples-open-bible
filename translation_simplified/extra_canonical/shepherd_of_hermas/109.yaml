translation:
  text: '“Set yourselves right while the tower is still being built.”


    2. “The Lord lives in people who love peace. Peace is dear to him. He stays far from those who quarrel
    and are lost in wickedness. Return the spirit to him whole, just as you received it.”


    3. “Suppose you give a cleaner a new, undamaged garment. You want it back undamaged. But he returns
    it torn. Will you accept it? Will you not get angry at once and scold him? You will say, ‘I gave you
    an undamaged garment. Why did you tear it and make it useless? The tear you made means it cannot be
    used.’ Will you not say all this to the cleaner about the tear he made in your garment?”


    4. “You grieve over your garment. You complain that you did not get it back whole. What, then, do
    you think the Lord will do to you? He gave you a whole spirit. You have made it completely useless.
    It can no longer serve its Lord because you corrupted it. Will not the Lord of that spirit punish
    you with death for what you have done?[a]”


    5. “Certainly,” I said. “He will punish everyone he finds still holding grudges.” He said, “Do not
    trample on his mercy. Honor him instead. He is so patient with your offenses. He is not like you.
    Practice repentance that benefits you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: “The Lord of that spirit” follows the working edition’s conjectural dominus spiritus eius; its
      apparatus reports several different Latin constructions. “Punish you with death” translates adficiet
      with bracketed [morte te], an editorial supply absent from the cited Vulgata manuscripts, compared
      with Palatina “will hand you over to death” and Ethiopic “ought to kill you” in the edition’s Latin
      report. These supplied words are not unanimous Latin or preserved Greek. Without the supplement,
      the clause leaves the punishment less explicit. Bandini112 reports a Greek death verb in Lavra;
      this corroborates death wording without making the Latin supplement unanimous.
lexical_decisions:
- source_word: paenitentia
  chosen: repentance
  alternatives:
  - penance
  - change of mind
  rationale: Moral return and corrected conduct in context, without inserting a later penitential institution.
- source_word: memoria offensarum
  chosen: grudges / remembrance of offenses
  alternatives:
  - memory of wrongs
  rationale: Preserve the sustained resentment condemned here, not an instruction to erase all recollection
    of harm.
- source_word: spiritum integrum
  chosen: whole spirit
  alternatives:
  - undamaged spirit
  rationale: Keep the given spirit and torn-garment comparison; do not substitute generic emotional health
    or decide its full theology silently.
- source_word: '[morte te] adficiet'
  chosen: punish you with death
  alternatives:
  - punish
  rationale: Translate the bracketed working-edition supply while explicitly noting its absence from cited
    Vulgata manuscripts and the reported version support.
