id: EXO.1.8
reference: Exodus 1:8
source:
  edition: WLC
  text: וַ/יָּ֥קָם מֶֽלֶךְ חָדָ֖שׁ עַל מִצְרָ֑יִם אֲשֶׁ֥ר לֹֽא יָדַ֖ע אֶת יוֹסֵֽף־־־־׃
translation:
  text: A new king came to power in Egypt; he did not know Joseph[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'did not acknowledge Joseph.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  chosen: '... Arose'
  alternatives:
  - Then ... arose
  - came to power
  - rose up
  - Now ... arose
  lexicon: HALOT
  rationale: 'The wayyiqtol of קום advances the narrative. ''Arose'' preserves the verbal imagery and can idiomatically refer to the rise of a ruler. ''Now'' is a natural English discourse marker for the Hebrew narrative progression here. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: מֶלֶךְ
  chosen: king
  alternatives:
  - ruler
  lexicon: HALOT
  rationale: The noun straightforwardly denotes a king; 'ruler' would be broader and less precise than the Hebrew.
- source_word: חָדָשׁ
  chosen: new
  alternatives:
  - another
  lexicon: HALOT
  rationale: The adjective means 'new.' Some interpreters understand it as 'another' in the sense of a different dynasty, but the lexical value is still 'new,' and interpretation beyond that should not be imported into the main text.
- source_word: עַל מִצְרַיִם
  chosen: over Egypt
  alternatives:
  - in Egypt
  lexicon: HALOT
  rationale: עַל with a ruler naturally conveys authority over a realm. 'Over Egypt' better reflects the preposition and the king's dominion than the more generic 'in Egypt.'
- source_word: אֲשֶׁר לֹא יָדַע
  chosen: who did not know
  alternatives:
  - who did not acknowledge
  - who was not acquainted with
  lexicon: HALOT
  rationale: יָדַע commonly means 'know.' In context it may imply lack of regard or recognition of Joseph's significance, but 'did not know' preserves the Hebrew wording and leaves that nuance open.
- source_word: יוֹסֵף
  chosen: Joseph
  alternatives:
  - Yosef
  rationale: '''Joseph'' is the standard English transliteration of יוֹסֵף and matches the form used throughout the English POB Joseph narrative. The closer Hebrew form ''Yosef'' is preserved as an alternative.'
