  from: Her gates have sunk into the earth; he has destroyed and broken her bars[a]. Her king and her princes are among the nations; there is no law. Even her prophets have found no vision from Yahweh.
  to: Her gates have sunk into the earth; he has destroyed and shattered her gate bars. Her king and her princes are in exile among the nations; there is no teaching of the law[a]. Even her prophets have found no vision from Yahweh.
