id: PSA.5.7
reference: Psalms 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ/רֹ֣ב חַ֭סְדְּ/ךָ אָב֣וֹא בֵיתֶ֑/ךָ אֶשְׁתַּחֲוֶ֥ה אֶל הֵֽיכַל קָ֝דְשְׁ/ךָ֗ בְּ/יִרְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/007.yaml
  text: But as for me, by the abundance of your steadfast love[a] I will enter your house; I will bow down toward your holy temple in fear of you[b].
  footnotes:
  - marker: a
    text: Or “in the abundance of your covenant faithfulness.”
    reason: lexical_alternative
  - marker: b
    text: Or “with reverence for you” or “in awe of you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 주의 풍성한 한결같은 사랑으로 말미암아 주의 집에 들어가겠습니다[a]. 주를 경외함으로[b] 주의 거룩한 성전을 향하여 엎드리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 풍성한 언약의 신실하심으로 말미암아.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주를 두려워함으로’ 또는 ‘주를 경외하고 두려워하는 가운데.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאַבֵּד
  english_pob_choice: You destroy
  chosen_korean: 멸하십니다
  alternatives_korean:
  - 파멸시키십니다
  - 멸망시키십니다
  - 없애십니다
  lexicon: HALOT
  rationale: Piel의 ‘멸하다/파멸시키다’ 의미를 살리면서, 시편의 단정적 진술에 어울리는 자연스러운 합쇼체로 옮겼습니다.
- source_word: דֹּבְרֵי כָזָב
  english_pob_choice: those who speak lies
  chosen_korean: 거짓을 말하는 자들
  alternatives_korean:
  - 거짓말하는 자들
  - 거짓을 내뱉는 자들
  - 거짓말하는 사람들
  lexicon: HALOT
  rationale: 직역적 구조인 ‘거짓을 말하는 자들’을 유지해 동작성을 살리고, 단순한 낙인어로 압축하지 않았습니다.
- source_word: אִישׁ דָּמִים וּמִרְמָה
  english_pob_choice: a man of bloodshed and deceit
  chosen_korean: 피 흘리는 사람과 속이는 사람
  alternatives_korean:
  - 피 흘림의 사람과 속임의 사람
  - 피의 사람과 속이는 사람
  - 피를 흘리며 속이는 사람
  lexicon: HALOT
  rationale: 히브리어 관용구는 혈기·폭력과 배신을 가리키므로, POB의 설명을 반영해 ‘피 흘리는 사람’과 ‘속이는 사람’으로 풀어 의미를 분명히 했습니다.
- source_word: יְתָעֵב
  english_pob_choice: abhors
  chosen_korean: 미워하십니다
  alternatives_korean:
  - 혐오하십니다
  - 가증히 여기십니다
  - 싫어하십니다
  lexicon: HALOT
  rationale: 강한 도덕적 혐오를 나타내되, 한국어로는 시편의 병렬과 어울리는 ‘미워하다’가 가장 자연스럽고 강하게 전달됩니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  - 주
  lexicon: HALOT
  rationale: 테트라그라마톤을 고유명사로 보존하는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יהוה(야훼)와 κύριος 대용 번역의 일관성
  chosen_reading: 본문의 יְהוָה는 고유명사로서 ‘야훼’로 옮기고, 관용적 대치어인 ‘주’로 바꾸지 않았습니다.
  alternative_readings:
  - 주
  - 주님
  - 여호와
  rationale: 시편 본문은 하나님의 언약 이름을 직접 사용하므로, 이름의 신학적·문헌적 식별성을 보존하는 편이 원문 청취 효과에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אִישׁ דָּמִים의 관용구 처리
  chosen_reading: ‘피 흘리는 사람’으로 풀어 폭력과 혈guilt의 관용적 의미를 드러냈습니다.
  alternative_readings:
  - 피의 사람
  - 살인자
  - 피를 좋아하는 사람
  rationale: 문자적 ‘피의 사람’은 한국어에서 어색하고 의미가 좁아지므로, 시적 문맥에 맞게 폭력성과 책임성을 함께 드러내는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
