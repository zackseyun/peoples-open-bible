revisions:
- from: 그리고 불법한 그 사람들에게 화를 냈는데, 그들은 그에게 그 지방으로 들어오라고 सलाह한 사람들이었습니다. 그는 그들 가운데 많은 사람을 죽였고, 자기 땅으로 떠나기로 결심했습니다.[a]
  to: 그는 그 지방에 들어오라고 자기에게 권했던 무법한 사람들에게 화를 냈습니다. 그리고 그들 가운데 많은 사람을 죽였으며[a], 자기 땅으로 떠나기로 결심했습니다.
  rationale: 비한국어 낱말을 제거하고, 조언 행위를 자연스러운 관계절로 바로 연결했습니다. ἀνόμοις는 ‘무법한’으로, χώρα와 γῆ는 각각 ‘그 지방’과 ‘자기 땅’으로 옮겼습니다. 살해 동사의 복수형이라는 원문의 긴장은 본문에서 영어 POB의 문맥적 단수 처리를 유지하되, 각주에서 원문 형태와 번역 근거를 정확하게 밝혀 보존했습니다.
