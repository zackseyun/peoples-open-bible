source:
  edition: WLC
  text: בִּשַּׂ֤רְתִּי צֶ֨דֶק בְּ/קָ֘הָ֤ל רָ֗ב הִנֵּ֣ה שְׂ֭פָתַ/י לֹ֣א אֶכְלָ֑א יְ֝הוָ֗ה אַתָּ֥ה יָדָֽעְתָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/009.yaml
  text: I have proclaimed righteousness[a] in the great assembly; behold, I have not restrained my lips[b]; Yahweh, you know.
  footnotes:
  - marker: a
    text: Or “justice.” The Hebrew can carry both moral and judicial overtones.
    reason: lexical_alternative
  - marker: b
    text: Or “I have not held back my lips.”
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 큰 회중 가운데서 의를 선포하였습니다[a]. 보십시오, 제가 제 입술을 막지 않았습니다. 야훼여, 주께서 아십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의’. 히브리어 צֶדֶק은 도덕적 올바름과 사법적 정의의 의미를 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת רְצוֹנְךָ
  english_pob_choice: to do your will
  chosen_korean: 주의 뜻을 행하기를
  alternatives_korean:
  - 주의 뜻을 이루기를
  - 주의 뜻을 실행하기를
  lexicon: HALOT
  rationale: לַעֲשׂוֹת는 목적을 나타내는 부정사로 ‘행하다/하다’가 가장 직접적이며, רָצוֹן은 여기서 하나님의 ‘뜻’으로 옮기는 것이 한국어에서 자연스럽고 volitional sense를 잘 살립니다.
- source_word: חָפָצְתִּי
  english_pob_choice: I delight
  chosen_korean: 즐거워합니다
  alternatives_korean:
  - 기뻐합니다
  - 원합니다
  lexicon: HALOT
  rationale: חפץ는 단순한 의지보다 기쁨과 즐거움을 포함하므로, 현재형의 ‘즐거워합니다’가 시편 화자의 지속적인 기쁨을 현대 합쇼체로 잘 전달합니다.
- source_word: וְתוֹרָתְךָ
  english_pob_choice: and your law
  chosen_korean: 주의 율법은
  alternatives_korean:
  - 주의 가르침은
  - 주의 교훈은
  lexicon: HALOT
  rationale: תּוֹרָה는 넓게는 ‘가르침/교훈’까지 포함하지만, 시편의 언약적·성경적 무게를 살리기 위해 기본항목인 ‘율법’을 유지했습니다.
- source_word: בְּתוֹךְ מֵעָי
  english_pob_choice: within my inner being
  chosen_korean: 제 속 깊은 곳에
  alternatives_korean:
  - 제 내면에
  - 제 심장 깊은 곳에
  lexicon: HALOT
  rationale: מֵעֶה는 문자적으로는 내장/속사람을 가리키지만, 한국어에서는 ‘속 깊은 곳’이 신체적 은유를 과도하게 직역하지 않으면서 내면화의 뜻을 자연스럽게 드러냅니다.
theological_decisions:
- issue: תּוֹרָה의 의미 범위 보존
  chosen_reading: ‘율법’으로 옮기되, 내면화된 하나님의 가르침이라는 넓은 의미를 유지합니다.
  alternative_readings:
  - ‘가르침’으로 옮기기
  - ‘교훈’으로 옮기기
  rationale: 이 문맥에서 תּוֹרָה는 단순한 규정집을 넘어 하나님의 언약적 가르침을 포함하지만, POB의 일관된 용어 정책상 ‘율법’을 기본으로 두고 의미 범위는 본문 흐름이 보존합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
