  from: Whoever keeps the commandment keeps his life[b][a]; he who despises his ways will die.
  to: Whoever keeps the commandment preserves his life[a], but whoever is careless about his ways will die[b].
  rationale: The first colon is more natural as “preserves his life.” In the second, the literal “despises his ways” misleadingly suggests disapproval of one’s own conduct. בּוֹזֵה can express contemptuous neglect, and with דְרָכָיו the idiomatic sense is being careless or heedless about one’s conduct. The qere supports “will die,” while the ketiv is preserved in a note. The current claim that “his ways” may mean God’s ways is not well grounded by the suffix and should not be retained.
