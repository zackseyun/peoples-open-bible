  yaml_path: translation/deuterocanon/tobit/004/014.yaml
  text: Do not let the wages of any man who works for you stay overnight with you, but pay him at once. If you serve God, it will be repaid to you. Watch yourself, child, in all your works, and be disciplined in all your conduct.
translation:
  language: ko
  text: 네게서 일한 모든 사람의 품삯을 네 곁에 하룻밤 묵혀 두지 말고, 곧바로 그에게 주십시오. 하나님을 섬기면 그 보답을 받게 될 것입니다. 아이야, 네 모든 일에서 스스로를 살피고, 네 모든 행실에서 잘 훈련된 사람이 되십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισθὸς
  english_pob_choice: wages
  chosen_korean: 품삯
  alternatives_korean:
  - 삯
  - 임금
  lexicon: μισθός
  rationale: 노동에 대한 대가라는 감각을 살리면서, 고용 관계의 보상임을 분명히 하는 말로 ‘품삯’을 택했습니다.
- source_word: παρὰ σοὶ μὴ αὐλισθήτω, ἀλλὰ ἀπόδος αὐτῷ παραυτίκα
  english_pob_choice: stay overnight with you, but pay him at once
  chosen_korean: 하룻밤 너와 함께 머물게 하지 말고, 곧바로 그에게 갚아 주십시오
  alternatives_korean:
  - 밤새 너와 함께 두지 말고, 즉시 그에게 지급하십시오
  - 네 곁에 하룻밤 묵히지 말고, 당장 갚아 주십시오
  lexicon: αὐλίζω / παραυτίκα
  rationale: ‘머물다/묵다’와 ‘곧바로’로 원문의 시간적 긴급성을 살렸고, ‘갚다’는 단순 지급보다 도덕적 의무의 뉘앙스를 드러냅니다.
- source_word: ἐὰν δουλεύσῃς τῷ θεῷ
  english_pob_choice: If you serve God
  chosen_korean: 하나님을 섬기면
  alternatives_korean:
  - 하나님께 종노릇하면
  - 하나님께 봉사하면
  lexicon: δουλεύω
  rationale: 하나님에 대한 충성된 섬김을 자연스럽게 살리되, 한국어에서 과도하게 생경한 표현은 피했습니다.
- source_word: ἀποδοθήσεταί σοι
  english_pob_choice: it will be repaid to you
  chosen_korean: 그것은 당신에게 보상될 것입니다
  alternatives_korean:
  - 그것은 당신에게 갚아질 것입니다
  - 그에 대한 보답이 당신에게 돌아올 것입니다
  lexicon: ἀποδίδωμι
  rationale: 원문의 수동형 약속을 반영하면서, 단순 금전 상환을 넘어 하나님이 되돌려 주시는 보응의 뜻을 살렸습니다.
- source_word: πρόσεχε σεαυτῷ … καὶ ἴσθι πεπαιδευμένος
  english_pob_choice: Watch yourself ... and be disciplined
  chosen_korean: 너 자신을 조심하고, … 훈련된 사람이 되십시오
  alternatives_korean:
  - 자신을 살피고 … 절제된 사람이 되십시오
  - 스스로를 경계하고 … 단련된 사람이 되십시오
  lexicon: προσέχω / παιδεύω
  rationale: ‘조심하다’와 ‘훈련된 사람’은 자기 점검과 형성의 두 요소를 함께 드러내며, 원문의 교육적 권면을 반영합니다.
theological_decisions:
- issue: 하나님에 대한 봉사와 보상 약속의 표현
  chosen_reading: ‘하나님을 섬기면, 그것은 당신에게 보상될 것입니다’로 옮겨, 행위의 자동적 공로가 아니라 하나님이 갚아 주시는 약속으로 읽히게 했습니다.
  alternative_readings:
  - ‘하나님께 봉사하면, 그것은 당신에게 보상됩니다’
  - ‘하나님을 섬기면, 그에 대한 대가를 받게 됩니다’
  rationale: 본문은 노동 임금의 즉시 지급 명령과 병렬로, 하나님에 대한 섬김에도 보응이 있음을 말하므로 약속의 문법을 보존해야 합니다.
  doctrine_reference: 섭리와 보응에 관한 지혜문학적 권면
