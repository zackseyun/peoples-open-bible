  text: And the whole camp of Assyria remained around them—the foot soldiers and chariots and their horsemen—for thirty-four days; and all the water containers of all the inhabitants of Bethulia ran out,
translation:
  language: ko
  text: 그리고 아시리아의 온 진영, 곧 보병과 전차와 그 기병들이 삼십사 일 동안 그들 주위에 머물러 있었습니다. 그리고 베툴리아에 사는 모든 사람들의 물 저장 용기가 모두 비었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολὴ Ἀσσούρ
  english_pob_choice: the whole camp of Assyria
  chosen_korean: 아시리아의 온 진영
  alternatives_korean:
  - 아시리아의 모든 진영
  - 아시리아의 군대 전체
  lexicon: παρεμβολή
  rationale: 군사적 집결지를 뜻하는 어휘로, POB의 ‘camp’를 자연스럽게 살려 ‘진영’으로 옮겼습니다. ‘온’은 전체성 강조를 유지합니다.
- source_word: πεζοὶ καὶ ἅρματα καὶ οἱ ἱππεῖς
  english_pob_choice: the foot soldiers and chariots and their horsemen
  chosen_korean: 보병과 전차와 그 기병들
  alternatives_korean:
  - 보병과 병거와 기병들
  - 보병과 전차 부대와 말탄 병사들
  lexicon: πεζοί / ἅρματα / ἱππεῖς
  rationale: 세 부류의 전력을 병렬 구조로 보존했습니다. ἅρματα는 군사 장비이자 전투 단위이므로 ‘전차’가 가장 직역에 가깝습니다.
- source_word: ἡμέρας τριάκοντα τέσσαρες
  english_pob_choice: for thirty-four days
  chosen_korean: 삼십사 일 동안
  alternatives_korean:
  - 서른네 날 동안
  - 34일 동안
  lexicon: ἡμέρας + 수사 표현
  rationale: 서사문체에 맞춰 한자식 수사로 통일해, 기간 표현의 간결성과 격식을 유지했습니다.
- source_word: πάντα τὰ ἀγγεῖα αὐτῶν τῶν ὑδάτων
  english_pob_choice: all the water containers of all the inhabitants of Bethulia ran out
  chosen_korean: 베툴리아 모든 주민의 모든 물독이 바닥났습니다
  alternatives_korean:
  - 베툴리아 모든 주민의 물통이 모두 떨어졌습니다
  - 베툴리아의 모든 주민에게 있던 물항아리가 다 떨어졌습니다
  lexicon: ἀγγεῖα τῶν ὑδάτων
  rationale: ἀγγεῖα는 일반적으로 ‘그릇/용기’이지만 여기서는 물 저장 용기를 가리키므로 ‘물독’으로 옮겨 구체성을 살렸습니다. POB의 ‘ran out’는 한국어 관용인 ‘바닥나다’로 자연스럽게 대응했습니다.
theological_decisions:
- issue: 성경 외전 서술에서 군사 포위와 물 고갈의 인과를 과장 없이 전달하는 방식
  chosen_reading: 물의 고갈을 단순한 상황 묘사로 유지하여, 본문의 서사적 긴박감을 직접 드러냈습니다.
  alternative_readings:
  - 의역하여 ‘더는 버틸 수 없었습니다’처럼 심리적 결과를 앞세우는 방식
  - ‘물이 모두 사라졌습니다’처럼 추상화하는 방식
  rationale: 원문은 포위 지속 기간과 물 용기 고갈을 병렬로 제시합니다. 한국어에서도 서술 순서를 보존해 독자가 사건의 압박을 본문대로 느끼게 했습니다.
  doctrine_reference: 서사 문맥 보존 원칙
- issue: 아시리아 군대의 총체성 표현
  chosen_reading: πᾶσα παρεμβολή를 ‘온 진영’으로 옮겨 집단의 포위 상태를 강조했습니다.
  alternative_readings:
  - ‘모든 진영’처럼 분절된 느낌을 주는 표현
  - ‘전군’처럼 현대적 군사 용어로 재구성하는 표현
  rationale: 문맥상 하나의 포위 진영 전체가 움직이지 않고 둘러싼 상태이므로, ‘온 진영’이 총체성과 압박감을 가장 잘 전달합니다.
  doctrine_reference: 문맥 충실 번역 원칙
