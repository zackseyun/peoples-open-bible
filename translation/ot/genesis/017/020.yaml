  text: וּֽ/לְ/יִשְׁמָעֵ֘אל שְׁמַעְתִּי/ךָ֒ הִנֵּ֣ה בֵּרַ֣כְתִּי אֹת֗/וֹ וְ/הִפְרֵיתִ֥י אֹת֛/וֹ וְ/הִרְבֵּיתִ֥י אֹת֖/וֹ בִּ/מְאֹ֣ד מְאֹ֑ד שְׁנֵים עָשָׂ֤ר נְשִׂיאִם֙ יוֹלִ֔יד וּ/נְתַתִּ֖י/ו לְ/ג֥וֹי גָּדֽוֹל׀־׃
translation:
  text: As for Ishmael[a], I have heard you. Look, I have blessed him, and I will make him fruitful and multiply his descendants exceedingly. He will father twelve princes, and I will make him into a great nation.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Ishmael means “God hears,” echoed here by “I have heard you.”
    reason: lexical_alternative
