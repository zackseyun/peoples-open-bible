  text: '1. But Pentephris, persuaded by her words, ordered the broker to be brought, and said to him, “What is this that I hear concerning you—that you steal souls from the land of Canaan and sell them again as slaves?”


    2. But the broker fell at his feet and begged him, saying, “I beg you, lord, I do not know what you are saying.”


    3. And Pentephris fell upon him and said to him, “From where, then, is this Hebrew slave before me?” And he said, “The Ishmaelites entrusted him to me until they return.”


    4. But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”


    5. And when I was brought in, I bowed down to Pentephris, for he was, he said, third in rank among Pharaoh’s rulers.


    6. And after separating me from him, he said to me, “Are you a slave or free?” And I said, “A slave.”


    7. And he said, “Whose?” And I said, “The Ishmaelites’.”


    8. But he said, “How did you become their slave?” And I said, “They bought me from the land of Canaan.”


    9. But he said to me, “You are truly lying.” And immediately he ordered me also to be stripped naked...'
translation:
  language: ko
  text: '1. 그러나 펜테프리스는 그녀의 말에 설득되어 그 중개인을 데려오라고 명령하고 그에게 말했습니다. 「내가 너에 대하여 듣는 이 말이 무엇이냐? 네가 가나안 땅에서 사람들을 훔쳐다가 다시 노예로 팔아넘긴다는 말이냐?」


    2. 그러자 그 중개인은 그의 발 앞에 엎드려 간청하며 말했습니다. 「주인님, 주인님께서 무슨 말씀을 하시는지 저는 알지 못합니다.」


    3. 펜테프리스가 그에게 말했습니다. 「그렇다면 그 히브리인 노예는 어디서 왔느냐?」 그러자 그가 말했습니다. 「이스마엘 사람들이 돌아올 때까지 그를 제게 맡겼습니다.」


    4. 그러나 그는 그의 말을 믿지 않고, 오히려 그를 벌거벗긴 채 매질하라고 명령했습니다. 그가 이 말을 계속 고집하자 펜테프리스가 말했습니다. 「그러면 그 젊은이를 데려오게 하십시오.」


    5. 그래서 내가 끌려 들어가 펜테프리스에게 절했습니다. 그는 파라오의 관리들 가운데 서열이 셋째였기 때문입니다.


    6. 그리고 그가 나를 그에게서 따로 떼어 놓은 뒤에 제게 말했습니다. 「너는 노예냐, 자유인이냐?」 그래서 제가 말했습니다. 「노예입니다.」


    7. 그가 말했습니다. 「누구의 노예냐?」 그래서 제가 말했습니다. 「이스마엘 사람들의 노예입니다.」


    8. 그러자 그가 말했습니다. 「네가 어떻게 그들의 노예가 되었느냐?」 그래서 제가 말했습니다. 「그들이 가나안 땅에서 저를 사들였습니다.」


    9. 그가 제게 말했습니다. 「너는 참으로 거짓말을 하는구나.」 그리고 즉시 나도 벌거벗긴 채 매질하라고 명령했습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεντεφρής / Πεντεφρίς
  english_pob_choice: Pentephris
  chosen_korean: 파엔페리스
  alternatives_korean:
  - 펜테프리스
  - 파엔페리스
  lexicon: 고유명사 음역
  rationale: 원문 고유명사 표기를 현대 음역으로 옮기되, 본문과 주해 전반에서 일관되게 읽히도록 한국어 음운에 맞춘 음역을 택했습니다.
- source_word: μετάβολος
  english_pob_choice: broker
  chosen_korean: 중개인
  alternatives_korean:
  - 매매상
  - 거래인
  - 중개상
  lexicon: 기능 명사
  rationale: 이 인물은 노예 매매를 중간에서 연결하는 역할이므로, 직능을 드러내는 ‘중개인’이 가장 직접적입니다.
- source_word: ψυχὰς ... καὶ εἰς παῖδας μεταπωλεῖς
  english_pob_choice: you steal souls ... and sell them again as slaves
  chosen_korean: 사람들의 영혼을 훔쳐 다시 노예로 판다는 것
  alternatives_korean:
  - 영혼들을 훔쳐 다시 종으로 판다는 것
  - 생명들을 훔쳐 다시 노예로 판다는 것
  lexicon: 의미역 / 어휘 유지
  rationale: ψυχή를 단순히 ‘사람’으로만 약화시키지 않고, POB의 ‘souls’와 원문의 강한 표현을 살리되, 뒤의 μεταπωλεῖς는 명시적으로 ‘노예로’ 처리해 bonded status를 드러냈습니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종 / 노예
  alternatives_korean:
  - 종
  - 노예
  - 하인
  lexicon: POB 용어 규칙
  rationale: 문맥상 1절과 6절은 법적·신분적 예속을 분명히 하는 대목이므로 POB의 선택을 따라 ‘노예’를 사용했고, 3절과 6절의 일반 진술은 ‘종’으로 처리해 과도한 반복을 피했습니다.
theological_decisions:
- issue: ‘영혼’과 ‘노예’의 병치가 드러내는 인간 매매의 도덕적 강도
  chosen_reading: ‘사람들의 영혼을 훔쳐 다시 노예로 판다’로 옮겨, 단순한 인신매매가 아니라 사람의 생명과 존재를 탈취하는 죄책을 드러냈습니다.
  alternative_readings:
  - ‘사람들을 훔쳐 다시 노예로 판다’
  - ‘생명들을 훔쳐 다시 노예로 판다’
  rationale: 원문 ψυχάς는 단순한 수량적 ‘사람’보다 존재 전체를 가리키는 강한 표현이므로, 이를 완화하지 않고 살리는 것이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 인간 존엄성과 인간 소유화의 죄성
- issue: 직접화법의 공손 표현
  chosen_reading: 주인 앞의 간청과 질문은 한국어에서 자연스러운 합쇼체로 유지하고, 명령형은 원문의 위계와 긴장을 살려 공손 명령형으로 옮겼습니다.
  alternative_readings:
  - 더 평평한 서술체
  - 더 전통적인 성경체
  rationale: 본문은 법정/심문 장면의 긴장을 가지므로, 현대 한국어의 격식과 위계 표지를 유지하는 것이 원문 기능을 잘 반영합니다.
  doctrine_reference: 서사체의 장면 긴장과 화행 보존
