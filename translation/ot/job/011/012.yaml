  alternative_readings:
  - A wish or prediction that a senseless man may become wise
  - 'A less explicitly ironic statement: ''an empty man will get heart, and a wild donkey''s colt is born a man'''
  rationale: 'The Hebrew is terse and notoriously difficult, but the parallelism strongly suggests an absurd comparison: the fool becoming wise is as likely as a wild donkey being born human. The translation makes that logic explicit enough for readable English without adding content beyond the proverb''s force.'
