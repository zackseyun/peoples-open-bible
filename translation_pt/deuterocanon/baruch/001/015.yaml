review_pass:
  verdict: revise
  source_fidelity: 'A estrutura confessional é bem preservada: a retidão pertence ao Senhor, enquanto a vergonha cabe ao povo. Contudo, a ligação final da fórmula temporal com os dois grupos fica sintaticamente inadequada no português do rascunho. A revisão torna explícita a relação locativa/contextual já exigida pelo sentido da expressão grega.'
  naturalness: '“Como se vê neste dia — ao povo de Judá e aos habitantes de Jerusalém” não se encaixa naturalmente: “ver” pede ali uma construção como “entre” ou “em”. “Vergonha estampada no rosto” é compreensível, mas “vergonha que se vê em nossos rostos” comunica com mais naturalidade o idiomatismo semítico e mantém a referência de ἡμῖν.'
  terminology: δικαιοσύνη, neste contraste penitencial, é mais bem representado no texto principal por “retidão”, em consonância com “righteousness” no registro inglês. “Justiça” permanece uma alternativa lexical legítima e deve ser mantida em nota. “Senhor, nosso Deus”, “povo de Judá” e “habitantes de Jerusalém” são adequados.
  issues:
  - severity: medium
    issue: Construção final sintaticamente truncada
    rationale: A sequência “como se vê neste dia — ao povo de Judá e aos habitantes de Jerusalém” não expressa naturalmente em português que a vergonha é a realidade então manifesta entre esses grupos. A preposição “entre” resolve o problema sem acrescentar interpretação doutrinária.
  - severity: low
    issue: Termo principal para δικαιοσύνη
    rationale: “Justiça” é possível, mas “retidão” reproduz melhor, neste contexto de confissão penitencial, o contraste entre o caráter reto de Deus e a desonra humana; a alternativa “justiça” deve ser preservada na nota.
