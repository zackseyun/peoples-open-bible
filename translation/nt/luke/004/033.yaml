  from: an unclean demon-spirit
  to: an unclean spirit of a demon
  rationale: The Greek phrase is πνεῦμα δαιμονίου ἀκαθάρτου. While the drafter's intention to preserve both 'spirit' and 'demon' is commendable, the compound 'demon-spirit' is not a natural English construction and can sound awkward. Furthermore, the adjective ἀκαθάρτου ('unclean') most naturally modifies πνεῦμα ('spirit') in this construction (as supported by standard lexicons like BDAG). The rendering 'an unclean spirit of a demon' more accurately reflects this grammatical relationship in Greek and is more natural English, while still preserving all the original elements. This alternative is already present in the footnote.
