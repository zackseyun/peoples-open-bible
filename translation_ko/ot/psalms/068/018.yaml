    text: 또는 ‘사람들에게서’ 또는 ‘반역하는 자들에게서도’로 옮길 수 있습니다. ‘사람’ 및 ‘반역하는 자들’ 앞의 히브리어 전치사는 ‘가운데’라는 범위나 ‘에게서’라는 출처를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야 하나님께서 그들 가운데 거하시도록’ 또는 ‘야 하나님을 위한 거처로’로 이해할 수 있습니다. 히브리어 마지막 절은 매우 압축되어 있어, 거처의 위치와 목적 관계를 여러 방식으로 파악할 수 있습니다.
