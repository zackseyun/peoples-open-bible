theological_decisions:
- issue: Subject of the final clause וַיָּבֹא הָעִיר
  chosen_reading: Then he went into the city
  alternative_readings:
  - Then she went into the city
  rationale: This is a textual subject question, not a doctrinal preference. The masculine WLC reading is provisionally retained without claiming that it is the earliest wording. Both Boaz's continued actions and Ruth's return fit the surrounding narrative; modern translators' preferences are not independent manuscript evidence.
  doctrine_reference: Translation philosophy §1, §3
