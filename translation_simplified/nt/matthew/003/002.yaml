translation:
  language: en
  text: and said, “Repent[b],[a] because the kingdom of heaven has come near.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally translated “Repent.” The Greek calls for a fundamental change in how you think, not merely feeling guilty or apologizing. In this context, that change should result in a changed life.
    reason: simplification_note
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
