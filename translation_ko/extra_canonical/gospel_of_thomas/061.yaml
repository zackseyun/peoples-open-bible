base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/061.yaml
  text: 'Jesus said, "Two will rest on a couch; one will die, one will live."


    Salome said, "Who are you, man? As from one, you have gotten up onto my couch and eaten from my table."


    Jesus said to her, "I am he who exists from the Equal. I was given from the things of my Father."


    [Salome said,] "I am your disciple."


    [Jesus said,] "Because of this I say: whenever one becomes empty, he will be filled with light; but whenever one becomes divided, he will be filled with darkness."'
  footnotes:
  - marker: As from one
    text: Literally 'as from one' (ϩⲱⲥ ⲉⲃⲟⲗ ϩⲛ̄ⲟⲩⲁ). This could mean 'as if from someone [special]' or 'as from the One', reflecting Thomas's theology of unity.
    reason: lexical_alternative
  - marker: the Equal
    text: Coptic ⲡⲉⲧϣⲏϣ, 'that which is equal' or 'the Equal' (from ϣⲓϣ, 'to be equal, level').
    reason: theological_note
  - marker: '[Salome said,] ... [Jesus said,]'
    text: The Coptic text does not include speaker tags for the final two sentences. They are supplied here for clarity.
    reason: textual_variant
  - marker: empty
    text: The manuscript reads ϣⲏϥ (stative of ϣⲱϥ, 'to be empty, desolate'), which creates a wordplay with 'filled' (ⲙⲟⲩϩ). Many scholars emend this to ϣⲏϣ ('equal') to match 'the Equal' (ⲡⲉⲧϣⲏϣ) earlier in the saying and to contrast directly with 'divided' (ⲡⲏϣ).
    reason: textual_variant
translation:
  language: ko
  text: '예수께서 말씀하셨습니다. “두 사람이 한 침상에 누워 있으면, 한 사람은 죽고 한 사람은 살 것입니다.”


    살로메가 말했습니다. “당신은 누구십니까? 한 분에게서 온 이처럼[a] 제 침상에 올라와 제 상에서 드셨습니다.”


    예수께서 그녀에게 말씀하셨습니다. “나는 동등한 것에서 나온 이입니다.[b] 나는 내 아버지께 속한 것들 가운데서 내게 주어졌습니다.”


    [살로메가 말했습니다.] “나는 당신의 제자입니다.”


    [예수께서 말씀하셨습니다.] [c] “그러므로 내가 말합니다. 누구든지 비어 있으면[d] 빛으로 채워질 것이지만, 누구든지 나뉘면 어둠으로 채워질 것입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 분에게서 온 이처럼’입니다(ϩⲱⲥ ⲉⲃⲟⲗ ϩⲛ̄ⲟⲩⲁ). ‘어떤 한 사람에게서 온 이처럼’으로도, ‘그 하나에게서 온 이처럼’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 콥트어 ⲡⲉⲧϣⲏϣ는 문자적으로 ‘동등한 것’ 또는 ‘동등한 이’를 뜻할 수 있습니다. 본문은 그 지시 대상을 명시적으로 인격화하지 않습니다.
    reason: theological_note
  - marker: c
    text: 사본에는 이 마지막 두 발화의 화자 표지가 없습니다. 이해를 돕기 위해 살로메와 예수의 발화로 괄호 안에 보충했습니다.
    reason: textual_variant
  - marker: d
    text: 사본은 ϣⲏϥ, 곧 ‘비어 있다’를 읽습니다. 일부 연구자는 앞의 ⲡⲉⲧϣⲏϣ(‘동등한 것/이’)와 연결하여 ϣⲏϣ(‘동등하다’)로 교정하지만, 여기서는 사본 읽기를 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ϭⲗⲟϭ
  english_pob_choice: couch
  chosen_korean: 평상
  alternatives_korean:
  - 침상
  - 침대
  - 긴 의자
  lexicon: Crum 811b
  rationale: 식사와 휴식을 함께 암시하는 낮은 가구라는 점을 살려, 한국어에서 가장 자연스러운 고대-가정용 좌석 이미지인 ‘평상’으로 옮겼습니다.
- source_word: ⲡⲉⲧϣⲏϣ
  english_pob_choice: the Equal
  chosen_korean: ‘동등한 자’
  alternatives_korean:
  - 동등한 것
  - 평등한 이
  - 동등자
  lexicon: Crum 595b
  rationale: 본문의 핵심 개념인 ϣⲓϣ(같다, 동등하다)을 살리되, 인격적·실체적 뉘앙스를 유지하기 위해 ‘동등한 자’로 번역했습니다.
- source_word: ⲛⲁⲡⲁⲉⲓⲱⲧ
  english_pob_choice: the things of my Father
  chosen_korean: 내 아버지의 것들
  alternatives_korean:
  - 내 아버지께 속한 것들
  - 내 아버지의 일들
  - 내 아버지에게서 난 것들
  lexicon: Crum 153a / possessive morphology
  rationale: 복수 소유 접두사 ⲛⲁ-가 분명하므로 ‘아버지께로부터’로 단수화하지 않고, 소유 대상의 복수성을 드러내는 ‘것들’로 옮겼습니다.
- source_word: ⲡⲱϣ / ⲡⲏϣ
  english_pob_choice: divided
  chosen_korean: 나뉘면
  alternatives_korean:
  - 분열되면
  - 갈라지면
  - 분리되면
  lexicon: Crum 276b
  rationale: 대립항이 ‘비어 있음’과 ‘채워짐’이므로, 추상적인 종교용어보다 분할 상태를 직관적으로 보여 주는 ‘나뉘다’를 택했습니다.
theological_decisions:
- issue: ⲡⲉⲧϣⲏϣ의 의미를 철학적 실체로 살릴 것인가, 단순 형용사로 풀 것인가
  chosen_reading: ‘동등한 자’
  alternative_readings:
  - ‘동등한 것’
  - ‘평등한 존재’
  - ‘같은 분’
  rationale: 토마스복음서의 통일성/분열 대조를 해치지 않으면서도, 본문의 자기-정체 진술로 읽히는 힘을 유지하도록 인격적 표현을 선택했습니다.
  doctrine_reference: Thomasine unity theme; lexical-theological tension in ⲡⲉⲧϣⲏϣ
- issue: 마지막 대구를 manuscript reading ‘empty’에 따라 유지할 것인가, 일부 학자들의 ‘equal’로 emend할 것인가
  chosen_reading: ‘하나로 비어 있으면… 나뉘면…’
  alternative_readings:
  - ‘하나로 같아지면… 나뉘면…’
  - ‘비어 있으면…’ 대신 ‘동등하면…’
  rationale: 사본의 ϣⲏϥ(비어 있다)을 유지해 ‘채워지다’와의 어휘적 긴장과 토마스적 역설을 보존했습니다.
  doctrine_reference: Manuscript reading retained; wordplay with ⲙⲟⲩϩ
