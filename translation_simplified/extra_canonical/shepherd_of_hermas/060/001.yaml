  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/001.yaml
  text: …with their whole heart. So then, do you suppose that the sins of those who are repenting are immediately forgiven? Not entirely. Rather, the one who repents must afflict his own soul and be humble-minded in all his conduct, resolutely, and be distressed in all kinds of tribulations; and if he bears the tribulations that come upon him, the One who created all things and strengthened them will surely be moved with compassion and will grant some healing. And this, when [God] sees the heart of the one repenting clean from everything.
translation:
  language: en
  text: …with all their heart. So, do you think that people who reorient[a] have their sins forgiven immediately? Not completely. Instead, a person who reorients must humble and afflict his own soul, remain humble in everything he does, stand firm, and suffer distress through every kind of trouble. If he bears the troubles that come upon him, the One who created all things and made them strong will surely have compassion and grant him some healing—when God sees that the reoriented person’s heart is clean from everything.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: be humble-minded in all his conduct, resolutely, and be distressed in all kinds of tribulations
  simplified_phrase: remain humble in everything he does, stand firm, and suffer distress through every kind of trouble
  preserved_meaning: Humility, resolve, and distress in trouble remain distinct demands.
  reasoning_layer_used: POB translation and immediate syntax
  rationale: Separate coordinated phrases preserve each requirement in natural English.
interpretive_expansions:
