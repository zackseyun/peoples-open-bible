  text: Day and night they go around her on her walls, and wickedness and trouble are within her.
translation:
  language: ko
  text: 그들은 낮에도 밤에도 그 성벽 위를 두루 돌아다니며,[a] 그 성 안에는 악과 고난이 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 그 성벽 위에서 그 성을 둘러쌉니다.’ 히브리어 동사는 ‘돌아다니다’와 ‘둘러싸다’의 뉘앙스를 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악과 고난’은 ‘사악함과 억압’ 또는 ‘죄악과 재앙’으로도 옮길 수 있습니다. 히브리어 אָוֶן과 עָמָל은 도덕적 악뿐 아니라 그것이 낳는 해로움과 고통을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  english_pob_choice: Confuse them
  chosen_korean: 그들을 혼란에 빠뜨리십시오
  alternatives_korean:
  - 그들을 삼켜 버리십시오
  - 그들을 멸하십시오
  lexicon: HALOT
  rationale: 직역상 ‘삼키다/삼켜 버리다’의 의미가 있지만, 바로 뒤의 ‘말을 나누어 주십시오’와 병행할 때 적의 계획과 의사소통이 무너지는 혼란의 뜻이 더 분명합니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  lexicon: HALOT
  rationale: 하나님의 호칭이므로 현대 한국어 경어 표현인 ‘주님’이 자연스럽고, 본문이 יהוה가 아니라 אֲדֹנָי이므로 ‘야훼’가 아니라 ‘주님’으로 옮겼습니다.
- source_word: פַּלַּג לְשׁוֹנָם
  english_pob_choice: divide their speech
  chosen_korean: 그들의 말을 나누어 주십시오
  alternatives_korean:
  - 그들의 혀를 나누어 주십시오
  - 그들의 언어를 갈라 주십시오
  lexicon: HALOT
  rationale: ‘혀’의 직역보다 문맥상 의사소통의 붕괴를 드러내는 ‘말’이 더 자연스럽고, ‘나누다’는 원문의 분열 이미지를 살립니다.
- source_word: חָמָס וְרִיב
  english_pob_choice: violence and strife
  chosen_korean: 폭력과 다툼
  alternatives_korean:
  - 폭력과 분쟁
  - 포악과 다툼
  lexicon: HALOT
  rationale: חָמָס는 폭력/포악을, רִיב은 다툼·분쟁을 뜻하므로, 시적 병행을 살리면서도 현대 독자가 즉시 이해할 수 있는 표현으로 옮겼습니다.
theological_decisions:
- issue: בַּלַּע를 본문에서 어떻게 살릴지
  chosen_reading: 주요 본문은 ‘혼란에 빠뜨리다’로 두고, 물리적 파괴보다 언어적·사회적 붕괴의 의미를 전면에 세웠습니다.
  alternative_readings:
  - 그들을 삼켜 버리십시오
  - 그들을 멸하십시오
  rationale: 바로 이어지는 ‘말을 나누어 주십시오’와의 긴밀한 병행이 바벨식 혼란을 가리키므로, 직접적 파괴보다 공동체 붕괴를 드러내는 번역이 문맥에 가장 부합합니다. 다만 단어 자체의 더 강한 파괴적 가능성은 번역 선택 안에 남겨 두었습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
