  text: οὐ γὰρ ἔπεσεν ὁ δυνατὸς αὐτῶν ὑπὸ νεανίσκων, οὐδὲ υἱοὶ Τιτάνων ἐπάταξαν αὐτόν, οὐδὲ ὑψηλοὶ γίγαντες ἐπέθεντο αὐτῷ· ἀλλὰ Ἰουδεὶθ θυγάτηρ Μεραρεί ἐν κάλλει προσώπου αὐτῆς παρέλυσεν αὐτόν.
  language: Greek
