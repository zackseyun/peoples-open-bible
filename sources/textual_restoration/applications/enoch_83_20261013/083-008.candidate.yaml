translation:
  text: And now, my son, rise and make your petition to the Lord of glory[a], since you are faithful, that a remnant may remain[b] upon the earth and that he may not wipe out the whole earth.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The title 'Lord of glory' is kept as a formal divine epithet rather than simplified to 'glorious Lord.'
    reason: cultural_note
  - marker: b
    text: The Ge'ez uses a doubled expression for what is left over ('remain a remnant' / 'be left as residue'), rendered here as 'a remnant may remain'.
    reason: lexical_alternative
  - marker: c
    text: Charles's apparatus, printed page 160 note 30, calls this final clause's authenticity doubtful because several cited manuscripts omit it, but also allows that it could have been lost through similar endings. It is retained here because it stands in the printed main text. This reports the edition's apparatus, not an independent examination of manuscripts.
    reason: textual_variant
