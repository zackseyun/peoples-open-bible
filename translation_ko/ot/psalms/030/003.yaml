id: PSA.30.3
reference: Psalms 30:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְֽהוָ֗ה הֶֽעֱלִ֣יתָ מִן שְׁא֣וֹל נַפְשִׁ֑/י חִ֝יִּיתַ֗/נִי מ/יורדי בֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh, you brought my life up from Sheol[a]; you kept me alive from among those going down to the pit[b].
  footnotes:
  - marker: a
    text: Sheol is the Hebrew term for the realm of the dead; alternatively, “the grave.”
    reason: lexical_alternative
  - marker: b
    text: Or “you revived me from among those going down to the pit”; by another construal, “you kept me alive so that I did not go down to the pit.”
    reason: alternative_reading
translation:
  language: ko
  text: 야훼여, 주께서 제 생명을 스올에서 끌어올리셨으며[a][b], 구덩이로 내려가는 이들 가운데서 저를 살려 두셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “스올”은 죽은 이들의 영역을 가리키는 히브리어 말입니다. “무덤”으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “제 생명”은 “제 영혼” 또는 “저 자신”으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “구덩이로 내려가는 이들 가운데서 저를 되살리셨습니다.” 다른 문법적 이해에 따르면, “제가 구덩이로 내려가지 않도록 저를 살려 두셨습니다”라고도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문에 직접 있는 여호와의 이름을 살리기 위해 프로젝트 기본값인 ‘야훼’를 사용했고, 호격 주소에서는 자연스럽게 ‘야훼 나의 하나님이여’로 옮겼습니다.
- source_word: אֱלֹהָי
  english_pob_choice: my God
  chosen_korean: 나의 하나님
  alternatives_korean:
  - 내 하나님
  - 나의 하나님이여
  lexicon: HALOT
  rationale: 1인칭 소유형이 붙은 호칭이므로 ‘나의 하나님’으로 직역하되, 시적 호격에 맞게 앞의 이름과 함께 부르게 했습니다.
- source_word: שִׁוַּעְתִּי
  english_pob_choice: I cried out / I cried for help
  chosen_korean: 부르짖었습니다
  alternatives_korean:
  - 도와 달라고 외쳤습니다
  - 간구했습니다
  lexicon: HALOT
  rationale: שׁוע의 긴급한 도움 요청을 한국어에서 가장 자연스럽게 드러내는 표현은 ‘부르짖다’이므로, 절박한 호소의 강도를 보존했습니다.
- source_word: וַתִּרְפָּאֵנִי
  english_pob_choice: and you healed me
  chosen_korean: 저를 고쳐 주셨습니다
  alternatives_korean:
  - 저를 치유하셨습니다
  - 저를 회복시켜 주셨습니다
  lexicon: HALOT
  rationale: רפא의 기본 의미는 ‘고치다/치유하다’이므로 ‘고쳐 주셨습니다’를 택했고, 시편 문맥의 신체적 치유와 더 넓은 회복 가능성을 둘 다 열어 두었습니다.
theological_decisions:
- issue: 야훼의 이름을 한국어 본문에 어떻게 표기할 것인가
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 원문 יְהוָה를 가리는 관습적 대체어보다, 프로젝트 기준에 따라 언약적 신명 자체를 드러내는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רפא의 의미를 의료적 치유로만 좁힐지 여부
  chosen_reading: ‘고쳐 주셨습니다’로 옮겨 물리적 치유와 회복의 여지를 함께 남겼습니다.
  alternative_readings:
  - ‘치유하셨습니다’
  - ‘회복시켜 주셨습니다’
  rationale: 시편의 문맥상 실제 병고의 치유일 수도, 더 넓은 구원/회복일 수도 있으므로, 원문의 신학적 긴장을 해치지 않는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
