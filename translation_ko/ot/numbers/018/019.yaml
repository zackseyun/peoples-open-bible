    rationale: 원문은 ‘너와, 너와 함께 있는 네 아들들과 네 딸들에게’ 및 ‘너와, 너와 함께 있는 네 후손에게’를 말합니다. 초안의 동격구와 ‘너와 너와’는 이 관계를 부자연스럽게 만듭니다.
  - severity: low
