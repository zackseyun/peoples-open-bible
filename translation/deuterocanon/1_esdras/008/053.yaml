    translation:
      text: For we had told the king that the strength of our Lord would be with those who seek him for every restoration[a][b].
      philosophy: optimal-equivalence
      footnotes:
      - marker: a
        text: Or 'for all restoration'; the Greek phrase is unusual, and some interpreters take it more broadly as 'for success'
          or 'for a good outcome.'
        reason: lexical_alternative
      - marker: b
        text: The Hebrew parallel at this point differs substantially, speaking of fasting and seeking God rather than repeating
          the report to the king. This translation follows the Greek text of 1 Esdras as the primary witness.
        reason: textual_variant
    lexical_decisions:
    - source_word: εἴπαμεν
      chosen: we had told
      alternatives:
      - we said
      - we told
      lexicon: BDAG
      rationale: 'A past perfect in English fits the narrative sequence naturally: this statement had already been made to
        the king before the present action. ''Told'' better reflects speech directed to a person than the flatter ''said.'''
    - source_word: Ἰσχὺς
      chosen: strength
      alternatives:
      - might
      - power
      lexicon: BDAG
      rationale: Ἰσχύς denotes strength or might. 'Strength' is clear modern English and preserves the sense of divine enabling
        without overstating into a more abstract 'power.'
    - source_word: τοῦ κυρίου ἡμῶν
      chosen: of our Lord
      alternatives:
      - of our master
      lexicon: BDAG
      rationale: κύριος is rendered by the project's default as 'Lord.' In this Jewish-Greek context it refers to God reverentially;
        'our Lord' is the most natural rendering.
    - source_word: μετὰ τῶν ἐπιζητούντων αὐτόν
      chosen: with those who seek him
      alternatives:
      - with those who diligently seek him
      - with those who look for him
      lexicon: BDAG
      rationale: ἐπιζητέω can intensify the idea of seeking, but English usually expresses this adequately with 'seek' unless
        the emphasis must be foregrounded. 'Those who seek him' is idiomatic and faithful.
    - source_word: εἰς πᾶσαν ἐπανόρθωσιν
      chosen: for every restoration
      alternatives:
      - for all restoration
      - unto complete restoration
      - for every good outcome
      lexicon: LSJ
      rationale: ἐπανόρθωσις literally concerns restoration, setting right, or reestablishment. The phrase is somewhat unusual,
        and the Greek source here is marked with source-validation tension against the MT parallel, which lacks this wording.
        'For every restoration' preserves the Greek's lexical content while remaining readable and avoids importing a broader
        sense like 'prosperity' not explicit in the text.
    theological_decisions:
    - issue: Rendering κύριος in reference to God
      chosen_reading: Lord
      alternative_readings:
      - Master
      rationale: The doctrine file specifies κύριος → 'Lord' as the default. Here the referent is Israel's God, and 'Lord'
        preserves both reverence and continuity with LXX usage.
      doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
    - issue: How specifically to render ἐπανόρθωσις in a difficult Greek phrase
      chosen_reading: restoration
      alternative_readings:
