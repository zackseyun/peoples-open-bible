  lexicon: LSJ
  rationale: φείδομαι는 ‘아끼다/삼가다/봐주다’의 폭을 가지지만, 여기서는 가해를 멈추지 않은 뜻이므로 문맥상 ‘아끼지 않았습니다’가 자연스럽습니다.
- source_word: ἐν ὀργῇ καὶ θυμῷ
  english_pob_choice: in anger and wrath
  chosen_korean: 분노와 격노로
  alternatives_korean:
  - 분노와 진노로
  - 분노와 분개로
  lexicon: LSJ
  rationale: ὀργή와 θυμός는 서로 겹치면서도 강도가 올라가는 이중어구이므로, 각각을 ‘분노’와 더 강한 ‘격노’로 살렸습니다.
- source_word: μετὰ μηνίσεως
  english_pob_choice: with fierce indignation
  chosen_korean: 격한 분개로
  alternatives_korean:
  - 원한을 품고
  - 분개하여
  lexicon: LSJ
  rationale: μήνις는 단순한 불쾌감이 아니라 지속적이고 응축된 분개를 가리키므로, 전통적 교회어보다 직접적인 ‘격한 분개’가 원문 긴장을 잘 드러냅니다.
