  terminology: ‘주 하나님’은 אדני יהוה의 한국어 번역으로 가능하며, 본 절 안에서 용어상 문제는 없습니다. ‘유다 집’은 בית יהודה의 전통적·직역적 표현으로 유지할 수 있습니다.
