id: PSA.119.149
reference: Psalms 119:149
source:
  edition: WLC
  text: ק֭וֹלִ/י שִׁמְעָ֣/ה כְ/חַסְדֶּ֑/ךָ יְ֝הוָ֗ה כְּֽ/מִשְׁפָּטֶ֥/ךָ חַיֵּֽ/נִי׃
translation:
  text: Hear my voice according to your steadfast love; give me life, Yahweh, according to your judgment.
  philosophy: dynamic
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: כְּֽמִשְׁפָּטֶךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone of 'judgments'; 'judgments/rules' preserved as alternatives.
- source_word: מִשְׁפָּטֶךָ
  chosen: judgment
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The singular noun here denotes Yahweh’s just ruling, judgment, or legal norm; “judgment” preserves this range more fully than “justice,” while correcting the current false plural.
