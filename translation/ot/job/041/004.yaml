id: JOB.41.4
reference: Job 41:4
source:
  edition: WLC
  text: לא אַחֲרִ֥ישׁ בַּדָּ֑י/ו וּ/דְבַר גְּ֝בוּר֗וֹת וְ/חִ֣ין עֶרְכּֽ/וֹ־־׃
translation:
  text: I will not keep silent about his limbs, his mighty strength, or the grace of his form.
  philosophy: dynamic
lexical_decisions:
- source_word: אַחֲרִישׁ
  chosen: I will not keep silent
  alternatives:
  - I will not be silent
  - I will not pass over in silence
  lexicon: HALOT
  rationale: From חרשׁ in Hiphil, here expressing refraining from speech. 'Keep silent' is idiomatic modern English and preserves the first-person resolve of the speaker.
- source_word: בַּדָּיו
  chosen: his limbs
  alternatives:
  - his parts
  - his members
  - his frame
  lexicon: HALOT
  rationale: בַּד can denote parts or members of the body. In the Leviathan description, 'limbs' fits the anatomical context better than the more wooden 'parts' while remaining concrete.
- source_word: דְבַר
  chosen: the account of
  alternatives:
  - the matter of
  - the word about
  - the description of
  lexicon: HALOT
  rationale: Construct with following nouns introduces what the speaker will speak concerning. 'The account of' is natural English and captures the descriptive force in context.
- source_word: גְּבוּרוֹת
  chosen: his mighty strength
  alternatives:
  - his mighty deeds
  - his powers
  - his strength
  lexicon: HALOT
  rationale: Though גבורות can mean mighty acts or displays of power, in this poetic description of Leviathan's physical form and force, 'mighty strength' best fits the immediate context.
- source_word: חִין
  chosen: the grace
  alternatives:
  - the beauty
  - the charm
  - the comeliness
  lexicon: HALOT
  rationale: “Grace” preserves the lexical core of חֵן and is apt for the aesthetically impressive quality of Leviathan’s form.
- source_word: עֶרְכּוֹ
  chosen: of his form
  alternatives:
  - his arrangement
  - his form
  - his frame
  lexicon: HALOT
  rationale: “Form” naturally conveys the ordered bodily arrangement without specifying proportions.
- source_word: דְבַר גְּבוּרוֹת
  chosen: his mighty strength
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Direct coordination after “keep silent about” supplies natural English without losing the reference to Leviathan’s power.
