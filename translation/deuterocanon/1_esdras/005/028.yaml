    is claimed.
- source_word: χίλιοι
  chosen: one thousand
  lexicon: LSJ
  rationale: Straightforward cardinal numeral attached to the immediately preceding family designation in the Greek text.
- source_word: υἱοὶ
  chosen: the sons of
  alternatives:
  - descendants of
  - members of the family of
  lexicon: LSJ
  rationale: In this census-style list, υἱοὶ functions as a standard genealogical/clan formula. 'The sons of' preserves the
    formal structure and matches the list format better than a more interpretive rendering.
- source_word: Τωβείς
  chosen: Tobeis
  alternatives:
  - Tobias
  - Tobies
  lexicon: LSJ
  rationale: This is a proper name and is therefore transliterated rather than translated. 'Tobeis' stays close to the Greek
    form in Swete.
- source_word: πάντες
  chosen: altogether
  alternatives:
  - all
  - in all
  lexicon: LSJ
  rationale: '''Altogether'' idiomatically conveys the summative force in an English census list. ''In all'' would also work;
    ''altogether'' is slightly smoother here.'
- source_word: ἑκατὸν τριάκοντα ἐννέα
  chosen: one hundred thirty-nine
