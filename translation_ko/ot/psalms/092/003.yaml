    text: 히브리어 악기 명칭의 정확한 동정은 불확실합니다. ‘비파’로 옮긴 나벨(נָבֶל)은 리라 또는 류트로, ‘수금’으로 옮긴 킨노르(כִּנּוֹר)는 하프로도 옮길 수 있습니다.
    reason: lexical_alternative
