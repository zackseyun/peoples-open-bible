revisions:
- from: '1 그리고 거기에서 나는 다시, 우리가 그곳에 칠십 일을 머문 뒤에, 이전 것과 같은 환상을 보았습니다. 2 또 나는 흰 옷을 입은 일곱 사람을 보았는데, 그들이 내게 말했습니다. “일어나 제사장의 옷과 의의 관과 이해의 신탁과 진리의 긴 옷과 믿음의 판과 머리의 관과 예언의 에봇을 입으십시오.” 3 그들 각 사람은 이 물건들을 들고 있었고, 그것들을 내게 입히며 내게 말했습니다. “이제부터 너와 너의 모든 씨가 제사장이 되십시오.”


    4 첫째는 거룩한 기름으로 나에게 기름을 바르고 제사장의 지팡이를 주었습니다. 5 둘째는 주님의 맑은 물로 나를 씻기고 거룩한 빵과 포도주를 먹였으며, 거룩하고 영광스러운 옷을 내게 둘러주었습니다. 6 셋째는 아마포 옷을 내게 입혔는데, 에봇과 같았습니다. 7 넷째는 보라색 같은 띠를 내게 둘렀습니다. 8 다섯째는 기름진 올리브 가지를 내게 주었습니다. 9 여섯째는 내 머리에 관을 씌웠습니다. 10 일곱째는 제사장의 왕관을 내게 씌우고 내 손들을 향으로 채웠으니, 내가 주 하나님 앞에서 제사장 직분을 행하게 하려는 것이었습니다.


    11 그리고 그들이 내게 말했습니다. “레위야, 너의 씨는 세 갈래로 나뉠 것이니, 오는 주님의 영광의 표징이 될 것이다. 12 첫째 몫은 클 것이며, 그보다 더 큰 것은 일어나지 않을 것이다. 13 둘째는 제사장직에 속할 것이다. 14 셋째는 새 이름으로 불릴 것인데, 유다에서 한 왕이 일어나 새 제사장직을 세울 것이기 때문이다. 그것은 민족들의 본을 따라, 모든 민족을 위한 것이다. 15 그의 임재는 사랑스러우니, 지극히 높으신 이의 예언자 같고, 우리 조상 아브라함의 씨에서 난 이와 같다. 16 그러므로 이스라엘의 모든 바라는 것은 너와 너의 씨에게 있을 것이며, 너의 씨는 보기에 아름다운 모든 것을 먹고 주님의 식탁을 나눌 것이다. 17 그들 가운데서 제사장들과 재판관들과 서기관들이 나올 것이며, 그들의 입을 통해 거룩한 것이 받아들여질 것이다. 18 그래서 내가 깨어났을 때, 이것이 첫 번째 환상과 같은 것임을 깨달았습니다.”'
  to: '1 그리고 այնտեղ에서 나는 다시, 우리가 그곳에 칠십 일을 머문 뒤에, 이전 것과 같은 환상을 보았습니다. 2 또 나는 흰 옷을 입은 일곱 사람을 보았는데, 그들이 내게 말했습니다. “일어나 제사장직의 옷과 의의 관과 이해의 신탁과 진리의 긴 옷과 믿음의 패와 머리 수건과 예언의 에봇을 입으십시오.” 3 그들은 각자 이 물건들을 들고 있었고, 그것들을 내게 입히며 내게 말했습니다. “이제부터 너와 네 모든 후손은 제사장이 되십시오.”


    4 첫째는 거룩한 기름으로 내게 기름을 바르고 지팡이를 주었습니다. 5 둘째는 주님의 깨끗한 물로 나를 씻기고 거룩한 빵과 포도주를 먹였으며, 거룩하고 영광스러운 옷을 내게 둘러주었습니다. 6 셋째는 에봇과 같은 고운 아마포 옷을 내게 입혔습니다. 7 넷째는 보라색 같은 띠를 내게 둘렀습니다. 8 다섯째는 풍성한 올리브 가지를 내게 주었습니다. 9 여섯째는 내 머리에 관을 씌웠습니다. 10 일곱째는 제사장직의 왕관을 내게 씌우고 내 손에 향을 가득 채워, 내가 주님 곧 하나님께 제사장으로 섬기게 했습니다.


    11 그리고 그들이 내게 말했습니다. “레위야, 네 후손은 오시는 주님의 영광의 표징으로 세 직분으로 나뉠 것이다. 12 첫째 몫은 클 것이며, 그보다 더 큰 다른 것은 생기지 않을 것이다. 13 둘째는 제사장직에 있을 것이다. 14 셋째에게는 새 이름이 주어질 것인데, 유다에게서 한 왕이 일어나 모든 민족을 위하여 민족들의 본을 따른 새 제사장직을 세울 것이기 때문이다. 15 그의 임재는 사랑받을 것이며, 그는 우리 조상 아브라함의 씨에서 난 지극히 높으신 이의 예언자와 같을 것이다. 16 그러므로 이스라엘의 모든 바람직한 것이 너와 네 후손에게 있을 것이며, 너희는 보기에 아름다운 모든 것을 먹고, 네 후손은 주님의 식탁을 분배할 것이다. 17 그들 가운데서 제사장들과 재판관들과 서기관들이 나올 것이며, 그들의 입을 통하여 거룩한 것이 받아들여질 것이다.”


    18 그래서 내가 깨어났을 때, 이것이 첫 번째 환상과 같은 것임을 깨달았습니다.'
  rationale: 원문의 불분명하거나 상징적인 표현은 해설로 좁히지 않았습니다. 14–15절의 왕·새 제사장직·예언자 표상은 본문의 연속성을 보존하되 특정 교리적 동일시를 추가하지 않았습니다. ‘후손’은 σπέρμα의 문맥상 자연스러운 한국어 표현으로 사용했고, 16절에서는 원문의 복수 청자와 단수 ‘후손’을 구별했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:15Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 제의 용어와 문장 흐름은 대체로 반영되었으나, 몇몇 의복·제의 용어의 정확성, 16절의 인칭, 그리고 18절의 인용부호를 바로잡을 필요가 있습니다. 특히 16절의 ἔδεσθε는 복수 청자에게 향하므로 ‘너의 씨는 ... 먹고’보다 ‘너희는 ... 먹고’가 원문에 충실합니다.
  naturalness: 초안은 전반적으로 이해 가능하나 ‘머리의 관’, ‘기름진 올리브 가지’, ‘사랑스러우니’ 등은 현대 한국어에서 다소 부자연스럽거나 의미가 흐립니다. 문체를 현대적 합쇼체로 통일하고, 직접 인용이 17절에서 끝난 뒤 18절에 남은 닫는 인용부호를 제거했습니다.
  terminology: ἐφοὺδ는 ‘에봇’, λόγιον은 ‘신탁’, πέταλον은 ‘패’, μίτρα는 ‘머리 수건’으로 옮겨 제의적 어휘의 구별을 유지했습니다. παρουσία는 교리적으로 특정 해석을 덧붙이지 않고 ‘임재’로, ἀρχαί는 문맥상 ‘세 직분’으로 번역했습니다.
  issues:
  - severity: medium
    issue: 16절의 주어 인칭이 변경되었습니다.
    rationale: 그리스어 ἔδεσθε는 복수형 ‘너희는 먹을 것이다’입니다. 후반의 ‘네 씨가 주님의 식탁을 분배할 것이다’와 구별해야 합니다.
  - severity: medium
    issue: 18절 끝에 직접 인용의 닫는 인용부호가 남아 있습니다.
    rationale: 직접 발화는 17절에서 끝나며 18절은 레위의 서술입니다. 남은 인용부호는 구조상 오류입니다.
  - severity: low
    issue: 일부 제의 용어가 부정확하거나 현대 한국어에서 어색합니다.
    rationale: μίτρα는 일반적인 ‘관’보다 ‘머리 수건/터번’에 가깝고, πέταλον은 ‘판’보다 ‘패’가 물건의 성격을 더 잘 드러냅니다. ‘기름진 올리브 가지’도 ‘풍성한 올리브 가지’로 다듬는 편이 자연스럽습니다.
  - severity: low
    issue: 15절의 ‘사랑스러우니’는 ἀγαπητή의 진술적 미래 문맥을 충분히 반영하지 못합니다.
    rationale: ‘그의 임재는 사랑받을 것이며’로 옮기면 의미와 문장 연결이 더 자연스럽습니다.
