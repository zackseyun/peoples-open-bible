id: SNG.5.6
reference: Song of Songs 5:6
source:
  edition: WLC
  text: פָּתַ֤חְתִּֽי אֲנִי֙ לְ/דוֹדִ֔/י וְ/דוֹדִ֖/י חָמַ֣ק עָבָ֑ר נַפְשִׁ/י֙ יָֽצְאָ֣ה בְ/דַבְּר֔/וֹ בִּקַּשְׁתִּ֨י/הוּ֙ וְ/לֹ֣א מְצָאתִ֔י/הוּ קְרָאתִ֖י/ו וְ/לֹ֥א עָנָֽ/נִי׃
translation:
  text: I opened the door to my beloved, but my beloved had slipped away and gone. My soul fainted when he spoke[a]; I sought him, but I did not find him. I called to him, but he did not answer me.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “my soul went out when he spoke,” expressing an overwhelming loss of strength or composure.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַחְתִּי אֲנִי
  chosen: I opened
  alternatives:
  - I myself opened
  lexicon: HALOT
  rationale: The independent pronoun אֲנִי adds emphasis, but English can carry this naturally without an explicit 'myself.' The simple 'I opened' preserves the action while avoiding overtranslation; the emphatic nuance is minor in English style.
- source_word: לְדוֹדִי
  chosen: to my beloved
  alternatives:
  - for my beloved
  lexicon: HALOT
  rationale: The preposition ל here is idiomatic with פתח, indicating the one to whom the door is opened. 'To my beloved' is the most natural English rendering and preserves the relational sense of דוֹד as lover/beloved in Song of Songs.
- source_word: וְדוֹדִי
  chosen: but my beloved
  alternatives:
  - and my beloved
  lexicon: HALOT
  rationale: 'Although ו normally means ''and,'' the discourse context is adversative: she opens, yet he is gone. Rendering it as ''but'' reflects the narrative contrast in natural English without distorting the Hebrew sequence.'
- source_word: חָמַק עָבָר
  chosen: had slipped away and gone
  alternatives:
  - had slipped away and passed on
  - had withdrawn and passed by
  lexicon: HALOT
  rationale: “Slipped away” represents חָמַק, and “gone” naturally conveys the further departure expressed by עָבָר without assigning motive.
- source_word: נַפְשִׁי יָצְאָה
  chosen: My soul went out
  alternatives:
  - I was beside myself
  - my life went out
  lexicon: HALOT
  rationale: A relatively formal rendering preserves the Hebrew idiom and emotional intensity. 'Soul' is retained rather than flattened to mere emotion, since נפשׁ in poetry can denote the inner self/life.
- source_word: בְדַבְּרוֹ
  chosen: when he spoke
  alternatives:
  - at his speaking
  - because of his speaking
  lexicon: HALOT
  rationale: The preposition ב with infinitive construct can express temporal nuance here. 'When he spoke' is the clearest idiomatic English and fits the remembered moment of his voice from the preceding context.
- source_word: בִּקַּשְׁתִּיהוּ
  chosen: I sought him
  alternatives:
  - I searched for him
  lexicon: HALOT
  rationale: בקשׁ commonly means seek/search for. 'Sought' is concise, literary, and well suited to the poetic register of Song of Songs.
- source_word: מְצָאתִיהוּ
  chosen: I did not find him
  alternatives:
  - I could not find him
  lexicon: HALOT
  rationale: The Hebrew is a straightforward negated perfect. 'I did not find him' is more formally aligned than 'could not find him,' which adds a nuance of inability not explicit in the text.
- source_word: קְרָאתִיו
  chosen: I called to him
  alternatives:
  - I called to him
  lexicon: HALOT
  rationale: The Hebrew has him as the object, but English idiom ordinarily uses “called to” for an attempted summons.
- source_word: עָנָנִי
  chosen: he did not answer me
  alternatives:
  - he did not respond to me
  lexicon: HALOT
  rationale: ענה in this context means answer/respond. 'Answer me' preserves the personal, relational sting of silence and matches the poetic tone.
