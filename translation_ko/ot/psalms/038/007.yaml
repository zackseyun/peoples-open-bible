source:
  edition: WLC
  text: נַעֲוֵ֣יתִי שַׁחֹ֣תִי עַד מְאֹ֑ד כָּל הַ֝/יּ֗וֹם קֹדֵ֥ר הִלָּֽכְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/007.yaml
  text: For my loins[a] are filled with burning[b], and there is no soundness in my flesh.
  footnotes:
  - marker: a
    text: Or 'in gloom' or 'darkly'; the Hebrew participle carries imagery of darkness as well as mourning.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 허리에는 타는 듯한 것이 가득하고[a], 내 살에는 성한 곳이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 표현은 뜻이 분명하지 않습니다. ‘염증’이나 ‘화끈거림’으로도 이해할 수 있습니다. ‘허리’는 ‘옆구리’ 또는 ‘골반 부위’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲוֵיתִי
  english_pob_choice: I am bent
  chosen_korean: 나는 심히 비뚤어지고
  alternatives_korean:
  - 나는 굽어지고
  - 나는 뒤틀리고
  - 나는 비틀어지고
  lexicon: HALOT
  rationale: עוה의 ‘굽다/뒤틀리다’ 계열 이미지를 살리되, 시편의 탄식 맥락에서 신체적·정서적 무너짐을 함께 드러내기 위해 ‘심히 비뚤어지고’로 옮겼습니다.
- source_word: שַׁחֹתִי
  english_pob_choice: bowed down
  chosen_korean: 아주 낮아졌습니다
  alternatives_korean:
  - 엎드러졌습니다
  - 굽어졌습니다
  - 낮아졌습니다
  lexicon: HALOT
  rationale: שׁחח의 ‘엎드리다, 낮아지다’ 의미를 반영해 첫 동사와 병렬을 이루는 낮아짐의 강도를 살렸습니다.
- source_word: עַד מְאֹד
  english_pob_choice: very low
  chosen_korean: 아주 낮아졌습니다
  alternatives_korean:
  - 심히
  - 지극히
  - 몹시
  lexicon: HALOT
  rationale: 앞의 두 동사를 한층 강화하는 표현이므로, 추상적 부사보다 ‘아주 낮아졌습니다’처럼 상태의 깊이를 드러내는 방식이 자연스럽습니다.
- source_word: קֹדֵר
  english_pob_choice: mourning
  chosen_korean: 애통하며
  alternatives_korean:
  - 침울하게
  - 그늘져
  - 어둡게
  lexicon: HALOT
  rationale: קדר는 어두움과 애통의 이미지를 함께 가지므로, 본문 맥락에서 체험적 의미를 드러내는 ‘애통하며’를 택하되, 어둠의 뉘앙스는 각주로 보완했습니다.
theological_decisions:
- issue: 시인의 자기 묘사를 현재형으로 살릴지 완료형으로 옮길지
  chosen_reading: 현재의 지속 상태를 드러내는 합쇼체 현재형으로 옮겼습니다.
  alternative_readings:
  - ‘나는 … 있었습니다’처럼 완료형으로 옮김
  - ‘나는 … 되어 있습니다’처럼 상태 완료를 강조함
  rationale: 히브리어 완료형이 탄식 시편에서는 현재적 상태 진술로 기능하므로, 한국어에서도 독자가 지금의 지속적 고통을 즉시 느끼도록 현재형을 유지했습니다.
  doctrine_reference: 시편 탄식 장르의 시적 현재
- issue: קֹדֵר의 의미 범위
  chosen_reading: ‘애통하며’로 본문을 번역하고, 각주로 ‘침울하게/어둡게’ 가능성을 밝혔습니다.
  alternative_readings:
  - ‘어둡게’
  - ‘침울하게’
  - ‘그늘져’
  rationale: 히브리어는 단순한 심리 상태를 넘어 어둠의 시각적 이미지를 포함하므로, 본문은 자연스러운 애통의 의미를 택하고 다의성은 각주로 보존했습니다.
  doctrine_reference: 히브리어 시적 어휘의 다층 의미
