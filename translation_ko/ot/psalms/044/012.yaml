  yaml_path: translation/ot/psalms/044/012.yaml
  text: You sell your people for nothing[a] and make no profit from their price.
  footnotes:
  - marker: a
    text: Or 'You hand us over like sheep as food.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'nations'; in this context it refers to foreign peoples among whom Israel has been dispersed.
    reason: cultural_note
translation:
  language: ko
  text: 주께서 주의 백성을 아무 대가도 없이 파시고, 그들의 값으로 이익을 늘리지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주의 백성을 재물 없이 파시고”라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנֵנוּ
  english_pob_choice: You give us over
  chosen_korean: 우리를 넘기시고
  alternatives_korean:
  - 우리를 주시고
  - 우리를 넘겨주시고
  - 우리를 내주시고
  lexicon: HALOT
  rationale: נתן의 기본 의미인 '주다'를 유지하되, 이 문맥의 버림·인도함의 뉘앙스를 살려 한국어에서는 '넘기시고'로 옮겼습니다.
- source_word: כְּצֹאן מַאֲכָל
  english_pob_choice: like sheep for food
  chosen_korean: 먹이로 삼을 양처럼
  alternatives_korean:
  - 식물로 삼을 양처럼
  - 먹을거리로서의 양처럼
  - 도살될 양처럼
  lexicon: HALOT
  rationale: מַאֲכָל은 '먹을 것, 먹이'의 뜻이므로 '도살될'처럼 의미를 더 강하게 만들지 않고, 피동적 희생 대상이 되는 이미지를 살려 옮겼습니다.
- source_word: וּבַגּוֹיִם
  english_pob_choice: and among the nations
  chosen_korean: 민족들 가운데
  alternatives_korean:
  - 열국 가운데
  - 나라들 가운데
  - 이방인들 가운데
  lexicon: HALOT
  rationale: גוים은 여기서 외국 민족들을 가리키므로, 시편 문맥에 자연스러운 '민족들'로 번역하되 NT적 뉘앙스가 강한 '이방인들'은 피했습니다.
- source_word: זֵרִיתָנוּ
  english_pob_choice: you have scattered us
  chosen_korean: 우리를 흩으셨습니다
  alternatives_korean:
  - 우리를 흩어버리셨습니다
  - 우리를 분산시키셨습니다
  - 우리를 흩으셨습니다
  lexicon: HALOT
  rationale: זרה의 핵심 의미인 '흩다'를 직접 살렸고, 완료형은 한국어에서 결과가 지속되는 과거로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 하나님의 행위와 수동적 고난의 표현
  chosen_reading: '''주께서 … 넘기시고 … 흩으셨습니다''로 옮겨, 시편의 탄식이 하나님께서 허용하신 처분을 직접 고발하는 강도를 유지했습니다.'
  alternative_readings:
  - '''주께서 우리를 버리시고'''
  - '''주께서 우리를 내주셨습니다'''
  rationale: 이 절은 단순한 패배 묘사가 아니라, 언약 백성이 하나님의 주권 아래 열국에게 넘겨진 상황을 탄식하는 말이므로, 원문의 직설성을 약화하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
