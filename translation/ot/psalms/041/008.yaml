id: PSA.41.8
reference: Psalms 41:8
source:
  edition: WLC
  text: דְּֽבַר בְּ֭לִיַּעַל יָצ֣וּק בּ֑/וֹ וַ/אֲשֶׁ֥ר שָׁ֝כַ֗ב לֹא יוֹסִ֥יף לָ/קֽוּם־־׃
translation:
  text: “A deadly affliction has taken hold of him[a]; now that he has lain down, he will not rise again.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “A vile charge has been fixed upon him”; the Hebrew expression is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר
  chosen: thing
  alternatives:
  - word
  - matter
  lexicon: HALOT
  rationale: The construct with בְּלִיַּעַל is idiomatic. Rendering דְּבַר as "thing" or "matter" better fits the sense of an evil condition or accusation than a spoken "word" in English. "Thing" is concise and natural here.
- source_word: בְּלִיַּעַל
  chosen: wicked
  alternatives:
  - worthless
  - base
  - evil
  lexicon: HALOT
  rationale: In the phrase דְּבַר בְּלִיַּעַל, the term denotes something vile, destructive, or morally corrupt. "Wicked" communicates the moral force in readable English. "Belial" is not used because this is not clearly a proper name here.
- source_word: דְּבַר בְּלִיַּעַל
  chosen: a destructive thing
  alternatives:
  - a vile matter
  - a destructive thing
  - an evil charge
  lexicon: HALOT
  rationale: The phrase denotes something ruinous or base but does not itself settle whether the referent is an affliction, accusation, curse, or other evil matter.
- source_word: יָצוּק
  chosen: is poured out
  alternatives:
  - is cast
  - is fixed
  - is poured
  lexicon: HALOT
  rationale: The passive sense of something being poured/cast upon someone is the most straightforward lexical value. Some take it metaphorically as something fastened firmly upon him, but "is poured out upon" preserves the image while remaining intelligible.
- source_word: בּוֹ
  chosen: upon him
  alternatives:
  - in him
  - on him
  lexicon: HALOT
  rationale: With the passive verb, English idiom prefers "upon him" or "on him." "Upon him" best matches the sense of something coming down on him.
- source_word: וַאֲשֶׁר
  chosen: now that
  alternatives:
  - and when
  - and as for the one who
  lexicon: HALOT
  rationale: Here the conjunction-relative introduces the consequence from the previous clause. "Now that" gives natural English linkage to the state described, though the Hebrew could also be rendered more formally as "and when."
- source_word: שָׁכַב
  chosen: he lies down
  alternatives:
  - he has lain down
  - he is laid low
  lexicon: HALOT
  rationale: The verb literally means "lie down." In context it likely refers to being bedridden or laid low, but the more literal rendering preserves the image and avoids importing an interpretation.
- source_word: לֹא יוֹסִיף לָקוּם
  chosen: he will not rise again
  alternatives:
  - he will not get up again
  - he will not rise again
  lexicon: HALOT
  rationale: This naturally represents the Hebrew idiom and avoids the more literary but less direct “will rise no more.”
- source_word: יָצוּק בּוֹ
  chosen: has been cast upon him
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: יצק can describe pouring or casting. This rendering avoids the awkward English “is poured out upon him” without asserting the interpretive sense “has fastened on him.”
- source_word: וַאֲשֶׁר שָׁכַב
  chosen: now that he has lain down
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: The perfect presents the lying down as an accomplished condition from which the enemies expect no recovery.
