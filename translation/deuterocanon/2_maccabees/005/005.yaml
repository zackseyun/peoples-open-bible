  text: Γενομένης δὲ λαλιάς ψευδοῦς, ὡς μετηλλαχότος Ἀντιόχου τὸν βίον, παραλαβὼν ὁ Ἰάσων οὐκ ἐλάττους τῶν χιλίων, ἐφνιδίως ἐπὶ τὴν πόλιν συνετελέσατο ἐπίθεσιν· τῶν δὲ ἐπὶ τῷ τείχει συνελασθέντων, καὶ τέλος ἤδη καταλαμβανομένης τῆς πόλεως, ὁ Μενέλαος εἰς τὴν ἀκρόπολιν ἐφυγάδευεν.
