    ܕܦܪܚ ܕܗܘܠܝܢ ܙܒܢܘܗܝ
    ܩܕܡܝܐ ܪ̈ܡܐ ܡܬܚܡܟܝܢ.
    ܘܚܬܝܢ ܙܒܢ̈ܐ ܥܝܪ̈ܒܐ
    ܘܒܝ̈ܫܐ ܒܥܕ̈ܢܐ. ܘܚܕ ܡܢ
    ܚܕ ܡܣܟܠܝܢ. ܘܗܘܝܝܢ ܓܘܘ..
    ܢܬܦܚܡ ܟܘܠ ܡܕܡ.
    ܐܝܟ ܡܫܘܚܬܐ ܕܐܒܕܐ.
    ܘܐܝܟ ܡܢ̈ܐ ܕܥܒܪܐ.
    ܕܟܕ ܓܝܪ ܚܒܠܐ ܠܐܝܠܝܢ
    ܕܕܝܠܗ ܐܢܘܢ ܢܚܛܦ
    ܠܐܝܠܝܢ ܕܕܝܠܘܗܝ ܐܢܘܢ.
    ܘܡܬܚܙܐ ܥܦܪܐ.
    ܘܡܬܬܡܕ ܥܘ. ܦܢܐ
    ܡܕܡ ܕܠܐ ܗܘܐ ܕܝܠܗ
    ܗܘ. ܘܐܡܝܪ ܡܟܝܪܘܬ
    43 .. ܕܠܛܝܒܘܬܐ ܒܙܒܢܘܗܝ. ܘܐܢܬ
    ܕܝܢ ܒܪܘܫ ܐܬܩܢ ܠܒܟ
    ܠܡܕܡ ܕܐܬܐܡܪ ܠܟ.
    ܘܐܣܬܟܠ ܐܝܠܝܢ ܕܐܬܚܘܝ
    ܠܟ. ܡܛܠ ܕܐܝܬ ܠܟ
    ܒܘܝܐܐ ܣܓܝܐܐ ܕܒܠܥܕܡ.
    ܐܢܬ ܓܝܪ ܡܢ ܗܫܐ
    ܬܘܒ ܠܐܢܫܝܢ ܕܒܝ̈ܫܐ
    ܀ ܝ.ܒ. ܡܘ̈ܬܐ ܐܬܚܙܝܘ. ܐܠܐ
    ܗܟܝܠ ܣܒܪܘ ܠܥܒܕܝ
    ܘܠܐ ܬܬܬܙܝܥܘܢ.
    ܠܡܕ ܗܟܝܢ ܒܬܪܟܝܢ ܨܒܘ ܚܒܒܐ
    ܝܘܡ̈ܬܐ. ܘܡ̇ܘܕܥ ܐܢܐ
    ܠܟܘܢ ܘܐܡ̇ܠܠ ܒܡ̈ܕܥܝܟܘܢ.
    44 ܘܐܙܠܬ ܡܢ ܬܡܢ ܐܢܐ
    ܒܪܘܟ. ܘܐܬܝܬ ܠܘܬ
    ܥܡܐ. ܘܩ̇ܪܝܬ ܠܒܘܟܪܝ
    ܥܡܘܪܝܗ. ܘܠܩܫ̈ܝܫܝ ܪ̈ܘܪܒܢܘܗܝ.
    ܘܠܡܟܝܟܐ ܡܢ ܣ̈ܒܐ ܕܥܡܐ.
    ܘܐܡܪ̇ܬ ܠܗܘܢ. ܫܡܥܘ
    ܐܢܐ ܐܢܐ ܐܢܐ ܒܪ
    ܥܡܐ ܙܥܘܪܐ ܐܝܟ
    ܪܒܐ. ܕܡܟܬܒ ܐܢܬܘܢ
    ܕܠܐ ܨܒ̇ܐ ܐܢܐ
    ܕܐܫܒܘܩ ܡܢ ܐܢܬܘܢ
    ܕܠܡܗܘܐ. ܐܠܐ ܢ̇ܛܪܘ
    ܘܗܘܘ ܠܥܡܐ ܕܐܫܬܚܪ.
    ܕܠܐ ܢܫܒܘܩ ܡܢ
    ܦܘܩ̈ܕܢܘܗܝ ܕܐܠܗܐ. ܚܕܝܘ
    ܕܐܦ ܚܢܢ ܕܐ
