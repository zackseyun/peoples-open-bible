id: PSA.78.60
reference: Psalms 78:60
source:
  edition: WLC
  text: וַ֭/יִּטֹּשׁ מִשְׁכַּ֣ן שִׁל֑וֹ אֹ֝֗הֶל שִׁכֵּ֥ן בָּ/אָדָֽם׃
translation:
  text: So he abandoned the tabernacle at Shiloh, the tent he had set among humanity.
  philosophy: dynamic
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  chosen: abandoned
  alternatives:
  - forsook
  - rejected
  - cast off
  lexicon: HALOT
  rationale: The verb נטשׁ conveys leaving behind or forsaking. 'Abandoned' is natural modern English and preserves the force of divine withdrawal from the sanctuary without adding interpretive nuance beyond the Hebrew.
- source_word: מִשְׁכַּן
  chosen: tabernacle
  alternatives:
  - dwelling place
  - sanctuary
  lexicon: HALOT
  rationale: מִשְׁכַּן commonly denotes the tabernacle/dwelling place of God. 'Tabernacle' preserves the cultic and historical sense here, especially in parallel with 'tent.'
- source_word: שִׁלֹה
  chosen: Shiloh
  rationale: Proper place name, transliterated according to the translation philosophy.
- source_word: אֹהֶל
  chosen: tent
  alternatives:
  - tabernacle
  lexicon: HALOT
  rationale: 'The parallelism with מִשְׁכַּן is best preserved by distinguishing the terms: ''tabernacle'' for מִשְׁכַּן and ''tent'' for אֹהֶל. This reflects the Hebrew poetic restatement rather than flattening both to the same English word.'
- source_word: שִׁכֵּן
  chosen: he had set
  alternatives:
  - caused to dwell
  - set up
  - resided
  lexicon: HALOT
  rationale: The Piel presents God as establishing the tent among humankind; “where he dwelt” changes the grammatical relationship and adds an interpretation.
- source_word: בָּאָדָם
  chosen: among humanity
  alternatives:
  - among mankind
  - among humanity
  - among men
  lexicon: HALOT
  rationale: אָדָם is collective and is naturally represented by “humanity” in this construction.
- source_word: מִשְׁכַּן שִׁלֹה
  chosen: the tabernacle at Shiloh
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The construct denotes the tabernacle associated with the location Shiloh; the locative English phrasing is natural.
