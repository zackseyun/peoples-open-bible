- from: 그것이 오면—보십시오, 그것이 오고 있습니다—그제야 그들은 자기들 가운데 한 예언자가 있었다는 것을 알게 될 것입니다.
  to: 그것이 오면—보라, 그것이 오고 있습니다—그러면 그들은 그들 가운데 한 예언자가 있었다는 것을 알게 될 것입니다.
  rationale: 원문의 동사 반복과 הִנֵּה의 예언적 주의 환기를 유지하되, ‘그제야’가 추가하는 배타적 시간 강조와 ‘자기들’의 재귀적 뉘앙스를 제거했습니다. 본문에 필요한 각주 사항은 없습니다.
