theological_decisions:
- issue: ‘진실’과 ‘지혜’의 내적 차원
  chosen_reading: 하나님이 외적 제의보다 사람의 내면에 있는 참됨을 원하시며, 그 안에서 지혜를 알게 하신다는 시적 병행을 그대로 드러냅니다.
  alternative_readings:
  - ‘진실’을 언약적 신실함으로 좁혀 읽기
  - ‘숨은 곳’을 단순히 ‘은밀히’라는 부사로 처리하기
  rationale: 시편의 평행법은 내면의 참됨과 하나님이 주시는 내적 지혜를 함께 말하므로, 후대의 체계적 용어로 좁히지 않고 본문의 이미지를 보존하는 것이 적절합니다.
  doctrine_reference: 시편 51편의 회개와 내면 정결 주제
