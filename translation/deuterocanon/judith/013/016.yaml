  meaning: Judith swears that God protected her, that her appearance deceived Holofernes to his destruction, and that he did not have sexual relations with her.
  meaning_decisions:
  - source_phrase: ἐν τῇ ὁδῷ μου ᾗ ἐπορεύθην
    prior_rendering: on the way by which I went
    new_rendering: on my journey
    rationale: The construction identifies the journey during which God protected her; repeating the motion in English adds no further meaning.
  - source_phrase: ἠπάτησεν αὐτὸν τὸ πρόσωπόν μου εἰς ἀπώλειαν αὐτοῦ
    prior_rendering: my face deceived him to his destruction
    new_rendering: my appearance deceived him and led to his destruction
    rationale: Her face stands for the outward appearance that misled him; the new wording conveys that sense while the footnote preserves the concrete source image.
  - source_phrase: οὐκ ἐποίησεν ἁμάρτημα μετʼ ἐμοῦ
    prior_rendering: he did not commit sin with me
    new_rendering: he did not commit sexual sin with me
    rationale: The encounter with Holofernes and the accompanying language of defilement and shame make the sexual reference clear to the first hearers; leaving it entirely general obscures Judith’s assurance.
  - source_phrase: εἰς μίασμα καὶ αἰσχύνην
    prior_rendering: resulting in defilement and shame
    new_rendering: which would have brought defilement and shame
    rationale: These are the consequences of the sin she denies occurred, not actual consequences of the encounter; the counterfactual wording correctly places them within that denial.
