translation:
  language: ko
  text: 나의 구원과 나의 영광은 하나님께 달려 있습니다.[a] 나의 힘이 되시는 반석과 나의 피난처는 하나님 안에 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘하나님 위에 나의 구원과 나의 영광이 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘나의 영광’은 문맥에 따라 ‘나의 명예’ 또는 ‘나의 존엄’으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ הוּא
  english_pob_choice: He alone
  chosen_korean: 오직 그분만이
  alternatives_korean:
  - 그분만이
  - 오직 그분이
  - 참으로 그분만이
  lexicon: HALOT
  rationale: אַךְ는 단순한 강조를 넘어 배타성을 띠므로, 주어를 분명히 드러내는 ‘그분만이’에 ‘오직’을 더해 하나님 외의 다른 의지처가 없다는 뜻을 살렸습니다.
- source_word: צוּרִי
  english_pob_choice: my rock
  chosen_korean: 나의 반석이시며
  alternatives_korean:
  - 나의 바위이시며
  - 나의 바위산이시며
  lexicon: HALOT
  rationale: צור는 하나님을 향한 정착된 보호 은유이므로, 한국어 성경에서 자연스럽고 상징이 선명한 ‘반석’을 택했습니다.
- source_word: וִישׁוּעָתִי
  english_pob_choice: and my salvation
  chosen_korean: 나의 구원이시요
  alternatives_korean:
  - 나의 구출이시요
  - 나의 구원
  lexicon: HALOT
  rationale: יְשׁוּעָה는 단회적 구출보다 포괄적 구원을 가리키므로, 신학적 범위를 유지하는 ‘구원’을 사용했습니다.
- source_word: מִשְׂגַּבִּי
  english_pob_choice: my stronghold
  chosen_korean: 나의 높은 피난처이시니
  alternatives_korean:
  - 나의 산성(山城)이시니
  - 나의 요새이시니
  - 나의 피난처이시니
  lexicon: HALOT
  rationale: מִשְׂגָּב은 ‘높은 곳의 안전한 피난처’라는 공간적 이미지를 담으므로, ‘피난처’에 ‘높은’을 보태 원문의 높이와 안전성을 함께 드러냈습니다.
- source_word: לֹא אֶמּוֹט
  english_pob_choice: I will not be shaken
  chosen_korean: 나는 흔들리지 않을 것입니다
  alternatives_korean:
  - 나는 옮겨지지 않을 것입니다
  - 나는 흔들리지 않겠습니다
  - 나는 움직이지 않을 것입니다
  lexicon: HALOT
  rationale: מוֹט의 ‘흔들리다/기울다/무너지다’의 폭을 살리되, 현대 한국어에서 가장 자연스럽고 시편의 신뢰를 잘 전달하는 표현을 선택했습니다.
theological_decisions:
- issue: 시편의 신뢰 고백을 나타내는 마지막 절의 뉘앙스
  chosen_reading: ‘흔들리지 않을 것입니다’는 절대적 무적이 아니라 하나님이 주시는 안정과 보존에 대한 신뢰를 나타냅니다.
  alternative_readings:
  - ‘옮겨지지 않을 것입니다’는 더 문자적이지만 한국어에서 다소 경직됩니다.
  - ‘움직이지 않을 것입니다’는 안정의 의미는 있으나 흔들림의 이미지가 약합니다.
  rationale: 히브리어는 하나님을 피난처로 삼는 자의 확신을 말하므로, 과장된 무오류성보다 신뢰의 안정성을 드러내는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §§5–6
