- source_word: לֹא יָשִׂים אֱלֹהִים מָעוּזוֹ
  english_pob_choice: did not make God his refuge
  chosen_korean: 하나님을 자기 피난처로 삼지 않고
  alternatives_korean:
  - 하나님을 자기 요새로 삼지 않고
  - 하나님을 자기 보호처로 삼지 않고
  lexicon: HALOT
  rationale: שׂים + 목적어 구문은 ‘~으로 삼다’가 가장 자연스럽고, מָעוֹז의 안전처 의미는 ‘피난처’가 현대 한국어에서 잘 전달합니다.
- source_word: בְּרֹב עָשְׁרוֹ
  english_pob_choice: in the abundance of his riches
  chosen_korean: 자기의 큰 재물에 의지하며
  alternatives_korean:
  - 자기의 재물의 풍성함을 의지하며
  - 자기의 많은 부에 의지하며
  lexicon: HALOT
  rationale: ‘풍성함/많은 부’보다 ‘큰 재물’이 본문의 반복적 대조를 간결하게 살리며, 문맥상 신뢰의 대상이 재물 자체임을 분명히 합니다.
- source_word: יָעֹז בְּהַוָּתוֹ
  english_pob_choice: sought strength in his destruction
  chosen_korean: 자기의 파멸 속에서 힘을 얻은
  alternatives_korean:
  - 자기의 파멸 가운데서 강해진
  - 자기의 파멸을 힘으로 삼은
  - 자기의 파멸 속에서 강함을 구한
  lexicon: HALOT
  rationale: 동사는 ‘강해지다/힘을 얻다’의 의미를 살려야 하므로, 결과적으로 파멸이 그의 힘의 자리였다는 역설을 드러내는 표현으로 옮겼습니다. הַוָּה는 ‘파멸/파괴’ 계열 의미가 문맥상 가장 적절해 이를 채택했습니다.
theological_decisions:
- issue: ‘하나님을 자기 피난처로 삼지 않고’의 수사적 대비
  chosen_reading: 신뢰의 대상을 하나님에서 재물로 옮긴 어리석음을 직접적으로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - ‘하나님을 의지하지 않고’로 완화
  - ‘하나님을 안전한 곳으로 삼지 않고’로 일반화
  rationale: 시편의 경구적 경고는 단순한 불신앙이 아니라 신뢰 대상의 전도(轉倒)를 비판하므로, ‘삼다’와 ‘피난처’의 대비를 보존하는 것이 본문 의도를 가장 잘 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: יָעֹז의 역설적 종결
  chosen_reading: ‘자기의 파멸 속에서 힘을 얻은’으로, 겉보기의 강함이 실제로는 멸망과 결부된다는 아이러니를 살렸습니다.
  alternative_readings:
  - ‘파멸 속에서 강해진’
  - ‘파멸을 힘으로 삼은’
  rationale: 본문은 재물에 대한 신뢰가 결국 자멸로 이어지는 역설을 말하므로, 강함/파멸의 긴장을 약화시키지 않도록 직역적 구조를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
