translation:
  text: From the time of the slaughter, destruction, and death of the giants, the spirits that came forth from the souls of their flesh[a] will wreak destruction without yet being judged; they will continue to do so until the day the great judgment is complete, when the great age comes to an end. Everything concerning the Watchers and the ungodly will be brought to completion[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Ge’ez wording about the spirits’ origin and destructive activity is uncertain.
    reason: textual_variant
  - marker: b
    text: The closing words are uncertain; they seem to refer to the completion of judgment concerning the Watchers and the ungodly.
    reason: alternative_reading
