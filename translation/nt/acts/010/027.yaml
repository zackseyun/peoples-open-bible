id: ACT.10.27
reference: Acts 10:27
source:
  edition: SBLGNT
  text: καὶ συνομιλῶν αὐτῷ εἰσῆλθεν, καὶ εὑρίσκει συνεληλυθότας πολλούς,
translation:
  text: While talking with Cornelius, Peter went inside and found many people gathered together.
  philosophy: dynamic
lexical_decisions:
- source_word: συνομιλῶν
  chosen: as he was talking with him
  alternatives:
  - while talking with him
  - conversing with him
  lexicon: BDAG
  rationale: Present participle indicating contemporaneous action with εἰσῆλθεν. 'Talking with him' is natural modern English and preserves the ongoing conversational sense without becoming overly formal.
- source_word: αὐτῷ
  chosen: with him
  alternatives:
  - to him
  lexicon: BDAG
  rationale: With συνομιλέω the dative naturally expresses the person with whom one is conversing. 'With him' best fits English idiom and the reciprocal sense of conversation.
- source_word: εἰσῆλθεν
  chosen: he entered
  alternatives:
  - he went in
  lexicon: BDAG
  rationale: Aorist main verb marking the next event. 'Entered' is slightly more formal but clear and concise; it fits the narrative movement into the house.
- source_word: εὑρίσκει
  chosen: found
  alternatives:
  - finds
  lexicon: BDAG
  rationale: Although the Greek uses the historical present, English narrative style commonly renders it with a simple past for smooth readability. This preserves the sense without awkwardness.
- source_word: συνεληλυθότας
  chosen: gathered together
  alternatives:
  - assembled
  - having come together
  lexicon: BDAG
  rationale: Perfect active participle of συνέρχομαι describes the state of the people as already assembled. 'Gathered together' communicates both the completed action and present result in idiomatic English.
- source_word: πολλούς
  chosen: many
  alternatives:
  - many people
  - a large number
  lexicon: BDAG
  rationale: The adjective functions substantivally, referring to many persons. English can naturally leave 'people' implicit after 'found many gathered together,' though the referent is clear from context.
