  text: Ἐγὼ δὲ ὑμῖν λέγω, ὁ ἄγγελος τῆς μετανοίας· μὴ φοβήθητε τὸν διάβολον. ἀπεστάλην γάρ, φησί, μεθ'
    ὑμῶν εἶναι τῶν μετανοούντων ἐξ ὅλης καρδίας αὐτῶν καὶ ἰσχυροποιῆσαι αὐτοὺς ἐν τῇ πίστει. 2. πιστεύσατε
    οὖν τῷ Θεῷ ὑμεῖς οἱ διὰ τὰς ἁμαρτίας ὑμῶν ἀπεγνωκότες τὴν ζωὴν ὑμῶν καὶ προστιθέντες ἁμαρτίαις καὶ
    καταβαρύνοντες τὴν ζωὴν ὑμῶν, ὅτι ἐὰν ἐπιστραφῆτε πρὸς τὸν Κύριον ἐξ ὅλης τῆς καρδίας ὑμῶν καὶ ἐργάσησθε
    τὴν δικαιοσύνην τὰς λοιπὰς ἡμέρας τῆς ζωῆς ὑμῶν καὶ δουλεύσητε αὐτῷ ὀρθῶς κατὰ τὸ θέλημα αὐτοῦ, ποιήσει
    ἴασιν τοῖς προτέροις ὑμῶν ἁμαρτήμασι, καὶ ἕξετε δύναμιν τοῦ κατακυριεῦσαι τῶν ἔργων τοῦ διαβόλου.
    τὴν δὲ ἀπειλὴν τοῦ διαβόλου ὅλως μὴ φοβήθητε· ἄτονος γάρ ἐστιν ὥσπερ νεκροῦ νεῦρα. 3. ἀκούσατε οὖν
    μου, καὶ φοβήθητε τὸν πάντα δυνάμενον, ϲῶϲαι καὶ ἀπολέϲαι, καὶ τηρεῖτε τὰς ἐντολὰς ταύτας, καὶ ζήσεσθε
    τῷ Θεῷ. 4. λέγω αὐτῷ· Κύριε, νῦν ἐνεδυναμώθην ἐν πᾶσι τοῖς δικαιώμασι τοῦ Κυρίου, ὅτι σὺ μετ' ἐμοῦ
    εἶ· καὶ οἶδα ὅτι συγκόψεις τὴν δύναμιν τοῦ διαβόλου πᾶσαν, καὶ ἡμεῖς αὐτοῦ κατακυριεύσομεν καὶ κατισχύσομεν
    πάντων τῶν ἔργων αὐτοῦ. καὶ ἐλπίζω, κύριε, δύνασθαί με νῦν τὰς ἐντολὰς ταύτας, ἃς ἐντέταλσαι, τοῦ
    Κυρίου ἐνδυναμοῦντος φυλάξαι. 5. Φυλάξεις, φησίν, ἐὰν ἡ καρδία σου καθαρὰ γένηται πρὸς Κύριον· καὶ
    πάντες δὲ φυλάξουσιν ὅσοι ἂν καθαρίσωσιν ἑαυτῶν τὰς καρδίας ἀπὸ τῶν ματαίων ἐπιθυμιῶν τοῦ αἰῶνος τούτου,
    καὶ ζήσονται τῷ Θεῷ.
