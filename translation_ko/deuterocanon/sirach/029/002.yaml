    rationale: ‘필요할 때에’도 문맥상 이해되지만, 헬라어 αὐτοῦ는 이웃의 필요를 가리킵니다. ‘이웃이 필요할 때’가 이를 더 분명히 합니다.
  - severity: low
    issue: 둘째 절의 시간 표현 중복
    rationale: ‘때가 되면’과 ‘제때’가 같은 내용을 연달아 표현합니다. εἰς τὸν καιρόν을 ‘정해진 때에’로 한 번만 옮기는 것이 자연스럽고 정확합니다.
  revised_text: 이웃이 필요할 때 그에게 빌려 주십시오. 그리고 정해진 때에 그 이웃에게 다시 갚으십시오.
