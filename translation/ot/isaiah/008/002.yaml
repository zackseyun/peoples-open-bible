  category: meaning_retranslation
  from: 'And I will take for myself faithful witnesses: Uriah the priest and Zechariah son of Jeberekiah[a][b].'
  to: 'I will call in reliable witnesses for myself[a]: Uriah the priest and Zechariah son of Jeberekiah.”'
  rationale: The earlier lexical decisions rightly emphasize formal attestation and reliability. Their attribution of the first-person action to Isaiah is less convincing than continuing Yahweh's speech, so I make the latter reading explicit and note the alternative.
