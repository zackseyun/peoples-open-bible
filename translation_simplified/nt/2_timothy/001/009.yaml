translation:
  language: en
  text: God saved us and called us with a holy calling.[a] He did not do this because of our works, but because of his own purpose and grace. He gave us this grace in Christ Jesus[b] before time began.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also mean “called us to a holy calling” or “called us by a holy calling.”
    reason: lexical_alternative
  - marker: b
    text: Or “Jesus the Messiah”; “Messiah” translates the title Christ.
    reason: alternative_reading
  - marker: c
    text: More literally, “before eternal ages.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: who saved us and called us with a holy calling
  simplified_phrase: God saved us and called us with a holy calling
  preserved_meaning: God is the one who saves and calls, while the Greek ambiguity in “holy calling” remains noted.
  reasoning_layer_used: Immediate context and theological decision on κλήσει ἁγίᾳ
  rationale: Naming God makes the verse readable on its own without narrowing the calling’s force.
- pob_phrase: not according to our works but according to his own purpose and grace
  simplified_phrase: He did not do this because of our works, but because of his own purpose and grace
  preserved_meaning: Our works are not the basis of salvation and calling; God’s purpose and grace are.
  reasoning_layer_used: Lexical decisions for κατά, ἔργα, πρόθεσις, and χάρις
  rationale: The causal wording states the same basis contrast in ordinary English while retaining key Pauline terms.
- pob_phrase: which was given to us in Messiah Jesus before eternal ages
  simplified_phrase: He gave us this grace in Messiah Jesus before time began
  preserved_meaning: God’s grace was given to believers in Messiah Jesus before temporal history began.
  reasoning_layer_used: Lexical decisions, theological title policy, and applied readability revision
  rationale: An active sentence clarifies that “which” refers to grace, and the approved idiom removes an opaque time expression.
interpretive_expansions:
- pob_phrase: who
  rendering: God
  claim: The saving and calling subject is God.
  evidence:
