lexical_decisions:
- source_word: אֹמַר
  english_pob_choice: I say
  chosen_korean: 저는 말합니다
  alternatives_korean:
  - 제가 말합니다
  - 말합니다
  lexicon: HALOT
  rationale: 히브리어 1인칭 미완료형의 현재적 발화를 살려, 시편 화자의 직접적인 탄식을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: אֵלִי
  english_pob_choice: My God
  chosen_korean: 나의 하나님
  alternatives_korean:
  - 내 하나님
  - 오 나의 하나님
  lexicon: HALOT
  rationale: 호격적 의미가 분명하지만, 합쇼체 본문에서는 ‘나의 하나님’이 가장 자연스럽고 경건한 직접 호칭입니다.
- source_word: תַּעֲלֵנִי
  english_pob_choice: take me away
  chosen_korean: 나를 데려가지 마십시오
  alternatives_korean:
  - 나를 끌어올리지 마십시오
  - 나를 제거하지 마십시오
  lexicon: HALOT
  rationale: עלה의 문자적 ‘올리다’보다 문맥상 생명에서 일찍 제거되는 뜻이 핵심이므로, 한국어에서도 의미를 드러내는 표현을 택했습니다.
- source_word: בְּדוֹר דּוֹרִים
  english_pob_choice: through all generations
  chosen_korean: 모든 세대를 지나 계속됩니다
  alternatives_korean:
  - 대대로
  - 세대에서 세대로
  lexicon: HALOT
  rationale: 히브리어 관용구가 하나님의 지속성을 강조하므로, 단순한 시간 부사보다 ‘계속됩니다’로 존재의 연속성을 살렸습니다.
theological_decisions:
- issue: 시편 화자의 생명 단축 탄원과 하나님의 영원성 대비
  chosen_reading: ‘내 생애의 한가운데에서 나를 데려가지 마십시오’로 번역해, 조기 죽음에 대한 간구를 분명히 했습니다.
  alternative_readings:
  - ‘내 생애의 한가운데에서 나를 올리지 마십시오’
  - ‘내 생애의 중간에 나를 제거하지 마십시오’
  rationale: 문맥상 시인은 자신의 짧은 생명과 하나님의 영원한 해를 대비하므로, ‘올리다’의 직역보다 ‘데려가다’가 원문 의도를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
