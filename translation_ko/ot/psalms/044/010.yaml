lexical_decisions:
- source_word: אַף
  english_pob_choice: Yet
  chosen_korean: 그러나
  alternatives_korean:
  - 그런데도
  - 그럼에도
  - 하지만
  lexicon: HALOT
  rationale: 문맥상 앞선 하나님의 도우심 회상을 뒤집는 대조를 나타내므로, 한국어에서는 담화 전환을 자연스럽게 보여 주는 ‘그러나’가 적절합니다.
- source_word: זָנַחְתָּ
  english_pob_choice: you have rejected
  chosen_korean: 우리를 버리시고
  alternatives_korean:
  - 우리를 거절하시고
  - 우리를 내치시고
  - 우리를 외면하시고
  lexicon: HALOT
  rationale: זנח은 관계적 거절·버리심의 뉘앙스를 가지므로, 하나님이 자기 백성을 저버리시는 느낌을 살리는 ‘버리시고’가 가장 직접적입니다.
- source_word: וַתַּכְלִימֵנוּ
  english_pob_choice: and put us to shame
  chosen_korean: 우리를 수치스럽게 하셨으며
  alternatives_korean:
  - 우리를 부끄럽게 하셨으며
  - 우리를 욕되게 하셨으며
  - 우리를 수치에 빠뜨리셨으며
  lexicon: HALOT
  rationale: הִכְלִים의 사역적 의미는 ‘수치/부끄러움에 이르게 하다’이므로, 직접적이고 현대적인 ‘수치스럽게 하셨으며’로 옮겼습니다.
- source_word: בְּצִבְאוֹתֵינוּ
  english_pob_choice: with our armies
  chosen_korean: 우리 군대와 함께
  alternatives_korean:
  - 우리 군대 안에서
  - 우리 군대 속에
  - 우리 군대 가운데
  lexicon: HALOT
  rationale: בְּ는 여기서 단순한 ‘안에’보다 동반/연합의 의미가 살아 있어, 전투에서 하나님이 동행하지 않으신다는 뜻을 자연스럽게 드러내는 ‘~와 함께’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 군사적 동행 부재를 어떻게 드러낼지
  chosen_reading: ‘우리 군대와 함께 나아가지 않으십니다’로 옮겨, 시편의 탄식이 전쟁에서의 하나님의 지원 철회라는 긴장을 보존했습니다.
  alternative_readings:
  - ‘우리 군대 안에서 나아가지 않으십니다’
  - ‘우리 군대와 함께 나서지 않으십니다’
  rationale: 히브리어는 단순한 위치가 아니라 전장에 동행하여 ‘나아감’의 부재를 말하므로, 하나님이 이스라엘의 전투에 함께하지 않으신다는 탄식의 힘을 살렸습니다.
  doctrine_reference: 시편의 탄식 장르와 언약적 심판의 표현
- issue: 주체를 직접 호칭하는 표현
  chosen_reading: 여기서는 시편 기자의 하나님 3인칭 고백이므로 ‘주께서는’으로 시작해 경건한 서술체를 유지했습니다.
  alternative_readings:
  - ‘주님께서는’
  - ‘하나님께서는’
  rationale: 본문의 대조와 탄식 어조를 살리기 위해, 너무 친밀한 직접화법보다 공적 서술체를 택했습니다.
  doctrine_reference: 시편 탄원시의 화법
