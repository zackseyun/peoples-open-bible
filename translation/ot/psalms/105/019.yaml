id: PSA.105.19
reference: Psalms 105:19
source:
  edition: WLC
  text: עַד עֵ֥ת בֹּֽא דְבָר֑/וֹ אִמְרַ֖ת יְהוָ֣ה צְרָפָֽתְ/הוּ־־׃
translation:
  text: Until his word was fulfilled[a], the word of Yahweh refined him[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “His word” most naturally refers to Joseph's prediction, but may refer to God's word concerning Joseph.
    reason: alternative_reading
  - marker: b
    text: Or “tested him”; the Hebrew evokes the refining or assaying of metal.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד
  chosen: Until
  alternatives:
  - Up to
  lexicon: HALOT
  rationale: Temporal preposition marking duration up to a point.
- source_word: עֵת
  chosen: the time
  alternatives:
  - the appointed time
  - the moment
  lexicon: HALOT
  rationale: Common noun for time/season; with עַד it yields the idiom 'until the time'.
- source_word: בֹּא
  chosen: came to pass
  alternatives:
  - came
  - arrived
  lexicon: HALOT
  rationale: Literally 'came,' but with דְבָרוֹ ('his word') the idiomatic sense is that the spoken matter came about or was fulfilled. 'Came to pass' preserves that sense in natural English without over-paraphrase.
- source_word: דְבָרוֹ
  chosen: his word
  alternatives:
  - his saying
  - his matter
  lexicon: HALOT
  rationale: 'דבר can mean word, matter, or event. Here ''his word'' best preserves the lexical form while allowing the following verb to convey fulfillment. The pronoun most naturally refers to Joseph in context: his interpretation/prediction proved true.'
- source_word: אִמְרַת
  chosen: the word
  alternatives:
  - the utterance
  - the saying
  lexicon: HALOT
  rationale: Near-synonym of דבר, often with the nuance of spoken utterance. 'The word' is idiomatic and keeps parallelism with the previous colon.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: צְרָפָתְהוּ
  chosen: refined him
  alternatives:
  - refined him
  - proved him
  - smelted him
  lexicon: HALOT
  rationale: The verb's concrete refining/assaying image is meaningful in the poetic line and should be retained in the main text.
