  from: In that day the Lord GOD of hosts called for weeping[a], for mourning, for baldness, and for putting on sackcloth.
  to: On that day the Lord Yahweh of Armies called you to weep and mourn, to shave your heads and put on sackcloth[a].
  rationale: The lexical discussion already identifies the head-shaving practice and the summons to lament, so I carry those meanings directly into the sentence. The standing Yahweh ruling overrides the older compound divine-name wording, while “sackcloth” retains its established cultural weight.
