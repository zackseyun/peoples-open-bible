translation:
  text: And you know everything before it happens. You know this and what concerns
    them,[a] yet you do not tell us what it is fitting for us to do to them concerning
    this.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The marked Geʽez phrase is literally close to “and what is theirs”; its
      precise sense is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: ዘእንበለ፡ ይኩን
  chosen: before it happens
  alternatives:
  - before it comes to be
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Preserves the temporal sense in clear English without implying that the
    events are predetermined.
- source_word: †ወዘዚአሆሙ†
  chosen: and what concerns them
  alternatives:
  - and what is theirs
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The marked phrase is uncertain. This rendering preserves its reference
    to them without specifying deeds or a fate that the wording does not clearly name.
- source_word: ወአልቦ፡ ዘትነግረነ
  chosen: yet you do not tell us
  alternatives:
  - and there is nothing that you tell us
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Renders the negative expression as direct address while retaining the
    contrast with the repeated statement that the addressee knows.
- source_word: መፍትው፡ ንረስዮሙ
  chosen: it is fitting for us to do to them
  alternatives:
  - we ought to do to them
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Keeps the question about appropriate action rather than turning it into
    an explicit request for punishment.
theological_decisions:
- issue: Foreknowledge and the requested response
  chosen_reading: The addressee knows events beforehand, but the speakers have not
    been told what action is fitting.
  alternative_readings:
  - The addressee has predetermined the events and commanded a judgment
  rationale: The verse states prior knowledge and asks about action; it does not itself
    assert predetermination or specify a judgment.
