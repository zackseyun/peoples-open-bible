id: JOB.23.15
reference: Job 23:15
source:
  edition: WLC
  text: עַל כֵּ֭ן מִ/פָּנָ֣י/ו אֶבָּהֵ֑ל אֶ֝תְבּוֹנֵ֗ן וְ/אֶפְחַ֥ד מִמֶּֽ/נּוּ־׃
translation:
  text: Therefore I am terrified before him; when I think about it, I am afraid of him.
  philosophy: dynamic
lexical_decisions:
- source_word: עַל כֵּן
  chosen: Therefore
  alternatives:
  - For this reason
  - So then
  lexicon: HALOT
  rationale: The phrase marks a logical conclusion from the preceding context. 'Therefore' is natural modern English and preserves the inferential force without unnecessary expansion.
- source_word: מִפָּנָיו
  lemma: מִן
  chosen: at his presence
  alternatives:
  - before him
  - because of him
  - from his face/presence
  lexicon: HALOT
  rationale: פָּנִים with the preposition מִן can denote reaction in relation to someone's presence. 'At his presence' captures the idiomatic sense of being overwhelmed in relation to God, while preserving the concrete notion of presence better than the more interpretive 'because of him.'
- source_word: אֶבָּהֵל
  chosen: I am terrified
  alternatives:
  - I am dismayed
  - I am troubled
  - I am confounded
  lexicon: HALOT
  rationale: The Niphal of בהל conveys being disturbed, alarmed, or terrified. In this context of fearful reaction before God, 'I am terrified' best conveys the intensity of Job's response in clear modern English.
- source_word: אֶתְבּוֹנֵן
  chosen: when I think about it
  alternatives:
  - I reflect
  - I contemplate
  - I understand
  lexicon: HALOT
  rationale: The reflexive/intensive form denotes reflective consideration; English naturally supplies the contextually implicit object.
- source_word: וְאֶפְחַד
  chosen: I am afraid
  alternatives:
  - I fear
  - I become afraid
  lexicon: HALOT
  rationale: The verb פחד denotes fear. 'I am afraid' gives idiomatic English parallel to the preceding clause and communicates Job's continuing state of fear.
- source_word: מִמֶּנּוּ
  chosen: of him
  alternatives:
  - before him
  - because of him
  lexicon: HALOT
  rationale: With פחד, the preposition naturally yields 'afraid of him' in English. This is the most direct and idiomatic rendering.
