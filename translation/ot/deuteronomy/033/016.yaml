  from: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
  to: and with the choicest gifts of the earth and all its abundance, and the favor of him who dwelt in the burning bush[a]—may these blessings rest on the head of Joseph, on the crown of the head of the one distinguished among his brothers[b].
  rationale: The lexical record rightly preserves the blessing’s bounty, the burning-bush allusion, and Joseph’s being set apart. I make the allusion and collective blessing explicit, while moving beyond the earlier lexical-core rendering of Joseph’s title to express its likely honorific force.
