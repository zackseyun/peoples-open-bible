id: PSA.18.26
reference: Psalms 18:26
source:
  edition: WLC
  text: עִם נָבָ֥ר תִּתְבָּרָ֑ר וְ/עִם עִ֝קֵּ֗שׁ תִּתְפַּתָּֽל־־׃
translation:
  text: With the pure you show yourself pure, and with the crooked you deal shrewdly[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'you show yourself twisted,' here describing a shrewd response to the crooked.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  chosen: pure
  alternatives:
  - blameless
  - clean
  lexicon: HALOT
  rationale: The adjective from ברר conveys purity/cleanness in a moral sense. 'Pure' gives a natural English rendering and preserves the wordplay with the following verb from the same root.
- source_word: תִּתְבָּרָר
  chosen: you show yourself pure
  alternatives:
  - you prove yourself pure
  - you are pure
  lexicon: HALOT
  rationale: 'The hitpael of ברר here is reflexive/resultative: God manifests himself as pure in relation to the pure. ''Show yourself pure'' preserves the relational sense and the Hebrew wordplay with נָבָר better than a flat stative rendering.'
- source_word: עִקֵּשׁ
  chosen: crooked
  alternatives:
  - perverse
  - twisted
  lexicon: HALOT
  rationale: The adjective denotes one who is morally bent or twisted. 'Crooked' is idiomatic, morally charged, and pairs well with the following verb.
- source_word: תִּתְפַּתָּל
  chosen: you deal shrewdly
  alternatives:
  - you show yourself shrewd
  - you contend
  - you are tortuous
  lexicon: HALOT
  rationale: The verb conveys wily, matching action here; this avoids falsely presenting God as morally twisted.
