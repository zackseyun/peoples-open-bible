id: ISA.17.4
reference: Isaiah 17:4
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִדַּ֖ל כְּב֣וֹד יַעֲקֹ֑ב וּ/מִשְׁמַ֥ן בְּשָׂר֖/וֹ יֵרָזֶֽה׃
translation:
  text: In that day Jacob's glory will grow thin, and his well-fed body[a] will waste away.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the fatness of his flesh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  chosen: And ... will
  alternatives:
  - And it will happen
  - And it shall be
  lexicon: HALOT
  rationale: Introduces a future circumstance or event formula. In English, the idiom is best carried by 'And in that day ... will' rather than the more wooden 'and it shall be.'
- source_word: בַּיּוֹם הַהוּא
  chosen: in that day
  alternatives:
  - on that day
  lexicon: HALOT
  rationale: Standard prophetic temporal formula. 'In that day' preserves the idiomatic and eschatological-prophetic feel common in Isaiah.
- source_word: יִדַּל
  chosen: will grow thin
  alternatives:
  - will become small
  - will be brought low
  - will be diminished
  lexicon: HALOT
  rationale: From דלל, conveying becoming thin, weak, or reduced. Because the parallel line uses bodily imagery ('fatness of his flesh'), 'will grow thin' preserves the metaphorical coherence better than the more abstract 'will be diminished.'
- source_word: כְּבוֹד
  chosen: glory
  alternatives:
  - honor
  - wealth
  - splendor
  lexicon: HALOT
  rationale: '''Glory'' is the broadest and most contextually fitting term, able to include status, splendor, and national prominence. The context of judgment implies loss of former prominence.'
- source_word: יַעֲקֹב
  chosen: Jacob
  alternatives:
  - Israel
  rationale: The Hebrew text names 'Jacob'; the translation preserves the proper name rather than interpreting it as 'Israel,' though the referent is the nation/people descended from Jacob.
- source_word: וּמִשְׁמַן
  chosen: and the fatness
  alternatives:
  - and the richness
  - and the stoutness
  lexicon: HALOT
  rationale: Literally 'fatness' or 'richness.' Here it is paired with 'his flesh' and a verb of wasting away, so the bodily image should be retained rather than abstracted.
- source_word: בְּשָׂרוֹ
  chosen: of his flesh
  alternatives:
  - of his body
  lexicon: HALOT
  rationale: Literal bodily term. 'Flesh' preserves the concrete metaphor and matches the Hebrew more closely than 'body.' This is not a theological 'flesh' term in the Pauline sense, but a physical image of emaciation.
- source_word: יֵרָזֶה
  chosen: will waste away
  alternatives:
  - will become lean
  - will be made thin
  lexicon: HALOT
  rationale: From רזה, to become lean or emaciated. 'Will waste away' communicates the result naturally in English while preserving the image of bodily wasting under judgment.
