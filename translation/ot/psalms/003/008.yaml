id: PSA.3.8
reference: Psalms 3:8
source:
  edition: WLC
  text: לַ/יהוָ֥ה הַ/יְשׁוּעָ֑ה עַֽל עַמְּ/ךָ֖ בִרְכָתֶ֣/ךָ סֶּֽלָה־׃
translation:
  text: Salvation belongs to Yahweh; may your blessing be on your people[a]. Selah
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “your blessing is on your people”; the Hebrew clause has no expressed verb and can be understood as either a declaration or a prayer.
    reason: alternative_reading
lexical_decisions:
- source_word: לַיהוָה
  chosen: belongs to Yahweh
  alternatives:
  - to Yahweh
  - is the LORD's
  lexicon: HALOT
  rationale: In the verbless opening clause, the prefixed ל expresses possession or attribution, naturally rendered “belongs to Yahweh.”
- source_word: הַיְשׁוּעָה
  chosen: salvation
  alternatives:
  - deliverance
  - victory
  lexicon: HALOT
  rationale: The noun denotes rescue/deliverance. 'Salvation' is the most natural English rendering in this prayer context and preserves both immediate deliverance and broader theological resonance without over-paraphrasing.
- source_word: עַל
  chosen: 'on'
  alternatives:
  - upon
  - over
  lexicon: HALOT
  rationale: With 'your people' and 'your blessing,' the preposition expresses blessing resting upon the people. 'On' is idiomatic modern English.
- source_word: עַמְּךָ
  chosen: your people
  alternatives:
  - your nation
  lexicon: HALOT
  rationale: עם commonly means 'people' in covenantal and communal contexts. 'Your people' preserves the relational sense between God and Israel/the worshiping community.
- source_word: בִרְכָתֶךָ
  chosen: your blessing
  alternatives:
  - your favor
  lexicon: HALOT
  rationale: The noun ברכה is straightforwardly 'blessing.' 'Favor' is interpretive and narrower, so 'blessing' is preferred.
- source_word: סֶּלָה
  chosen: Selah
  lexicon: HALOT
  rationale: The term's precise force is uncertain, likely a liturgical or musical marker. Standard practice is to transliterate rather than conjecturally translate.
- source_word: עַל עַמְּךָ בִרְכָתֶךָ
  chosen: your blessing be on your people
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: The verbless clause permits petitionary or declarative force. The main text follows the prayer context, while the note preserves the declarative reading.
