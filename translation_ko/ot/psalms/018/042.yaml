base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/042.yaml
  text: I beat them fine like dust before the wind[a][b][c]; like mud in the streets I poured them out.
  footnotes:
  - marker: a
    text: Or 'like mire in the streets I emptied them out.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'upon the face of the wind,' a Hebrew idiom for being driven/scattered by the wind.
    reason: lexical_alternative
  - marker: c
    text: Or 'I crushed them like dust before the wind.' The Hebrew verb can carry the sense of grinding or pulverizing.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들을 바람 앞의 티끌처럼 가루가 되도록 짓이겼습니다.[a][b] 나는 그들을 거리의 진흙처럼 내쏟았습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 그들을 바람 앞의 티끌처럼 갈아 버렸습니다.’ 히브리어 동사는 갈거나 가루가 되도록 부수는 뜻을 낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘바람의 얼굴 위에’입니다. 바람에 날려 흩어지는 모습을 나타내는 히브리어 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나는 그들을 거리의 진흙처럼 비워 냈습니다.’
    reason: lexical_alternative
