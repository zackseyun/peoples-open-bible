  terminology: ‘산당’은 בָּמוֹת의 통용되고 적절한 번역이며, ‘제사를 드리다’와 ‘분향하다’는 מְזַבְּחִים וּמְקַטְּרִים의 제의 행위를 과도한 해석 없이 잘 전달합니다.
  issues:
