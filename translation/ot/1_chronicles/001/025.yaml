  lexicon: HALOT
  rationale: Proper noun in a genealogy; transliterated rather than translated per translation philosophy. 'Eber' follows standard English convention for this patriarchal name, while 'Heber' is a possible alternative transliteration in some traditions.
- source_word: פֶּלֶג
  chosen: Peleg
  lexicon: HALOT
  rationale: Proper noun in a genealogical sequence; transliterated by standard English convention. Although the common noun can mean 'division' or 'channel,' here it functions as a personal name and should not be translated semantically in the main text.
- source_word: רְעוּ
  chosen: Reu
  alternatives:
  - Reu/Re'u
  lexicon: HALOT
  rationale: Proper noun; transliterated in keeping with the treatment of names. The form 'Reu' is the standard English biblical spelling; a more explicitly marked transliteration such as 'Re'u' is possible but less natural in readable modern English.
