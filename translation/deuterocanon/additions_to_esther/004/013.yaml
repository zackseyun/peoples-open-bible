  text: καὶ εἶπεν αὐτῷ Εἶδόν σε, κύριε, ὡς ἄγγελον θεοῦ, καὶ ἐταράχθη ἡ καρδία μου ἀπὸ φόβου τῆς δόξης σου·
  language: Greek
