  text: '1. Ἔδειξέ μοι δένδρα πολλὰ μὴ ἔχοντα φύλλα, ἀλλ᾽ ὡσεὶ ξηρὰ ἐδόκει μοι εἶναι· ὅμοια γὰρ ἦν πάντα.
    καὶ λέγει μοι· Βλέπεις τὰ δένδρα ταῦτα; Βλέπω, φημί, κύριε, ὅμοια ὄντα καὶ ξηρά. ἀποκριθείς μοι λέγει·
    Ταῦτα τὰ δένδρα, ἃ βλέπεις, οἱ κατοικοῦντες εἰσὶν ἐν τῷ αἰῶνι τούτῳ. 2. Διατί οὖν, φημί, κύριε, ὡσεὶ
    ξηρά εἰσι καὶ ὅμοια; Ὅτι, φησίν, οὔτε οἱ δίκαιοι φαίνονται οὔτε οἱ ἁμαρτωλοὶ ἐν τῷ αἰῶνι τούτῳ, ἀλλ᾽
    ὅμοιοί εἰσιν· ὁ γὰρ αἰὼν οὗτος τοῖς δικαίοις χειμών ἐστι, καὶ οὐ φαίνονται μετὰ τῶν ἁμαρτωλῶν κατοικοῦντες.
    3. ὥσπερ γὰρ ἐν τῷ χειμῶνι τὰ δένδρα ἀποβεβληκότα τὰ φύλλα ὅμοιά εἰσι, καὶ οὐ φαίνονται τὰ ξηρὰ ποῖά
    εἰσιν ἢ τὰ ζῶντα, οὕτως ἐν τῷ αἰῶνι τούτῳ οὐ φαίνονται οὔτε οἱ δίκαιοι οὔτε οἱ ἁμαρτωλοί, ἀλλὰ πάντες
    ὅμοιοί εἰσιν.


    1. Ἔδειξέ μοι πάλιν δένδρα πολλά, ἃ μὲν βλαστῶντα, ἃ δὲ ξηρά, καὶ λέγει μοι· Βλέπεις, φησί, τὰ δένδρα
    ταῦτα; Βλέπω, φημί, κύριε, τὰ μὲν βλαστῶντα, τὰ δὲ ξηρά. 2. Ταῦτα, φησί, τὰ δένδρα τὰ βλαστῶντα οἱ
    δίκαιοί εἰσιν οἱ μέλλοντες κατοικεῖν εἰς τὸν αἰῶνα τὸν ἐρχόμενον· ὁ γὰρ αἰὼν ὁ ἐρχόμενος θέρος ἐστὶ
    τοῖς δικαίοις, τοῖς δὲ ἁμαρτωλοῖς χειμών. ὅταν οὖν ἐπιλάμψῃ τὸ ἔλεος τοῦ Κυρίου, τότε φανερωθήσονται
    οἱ δουλεύοντες τῷ Θεῷ, καὶ πάντες φανερωθήσονται· 3. ὥσπερ γὰρ τῷ θέρει ἑνὸς ἑκάστου δένδρου οἱ καρποὶ
    φανεροῦνται καὶ ἐπιγινώσκονται ποταποί εἰσιν, οὕτω καὶ τῶν δικαίων οἱ καρποὶ φανεροὶ ἔσονται, καὶ
    γνωσθήσονται πάντες εὐθαλεῖς ὄντες ἐν τῷ αἰῶνι ἐκείνῳ. 4. τὰ δὲ ἔθνη καὶ οἱ ἁμαρτωλοί, οἷα εἶδες τὰ
    δένδρα τὰ ξηρά, τοιοῦτοι εὑρεθήσονται ξηροὶ καὶ ἄκαρποι ἐν ἐκείνῳ τῷ αἰῶνι, καὶ ὡς ξύλα κατακαυθήσονται
    καὶ φανεροὶ ἔσονται· ὅτι ἡ πρᾶξις αὐτῶν πονηρὰ γέγονεν ἐν τῇ ζωῇ αὐτῶν. οἱ μὲν γὰρ ἁμαρτωλοὶ καυθήσονται,
    ὅτι ἥμαρτον καὶ οὐ μετενόησαν· τὰ δὲ ἔθνη καυθήσονται, ὅτι οὐκ ἔγνωσαν τὸν κτίσαντα αὐτούς. 5. σὺ
    οὖν καρποφόρησον, ἵνα ἐν τῷ θέρει ἐκείνῳ γνωσθῇ σου ὁ καρπός. ἀπέχου δὲ ἀπὸ τῶν πολλῶν πράξεων, καὶ
    οὐδὲν διαμαρτήσεις. οἱ γὰρ τὰ πολλὰ πράσσοντες πολλὰ καὶ ἁμαρτάνουσι, περισπώμενοι περὶ τὰς πράξεις
    αὐτῶν καὶ μηδὲν δουλεύοντες τῷ Κυρίῳ ἑαυτῶν. 6. Πῶς οὖν, φησίν, ὁ τοιοῦτος δύναταί τι αἰτήσασθαι παρὰ
    τοῦ Κυρίου καὶ λαβεῖν, μὴ δουλεύων τῷ Κυρίῳ; οἱ [γὰρ] δουλεύοντες αὐτῷ, ἐκεῖνοι λήψονται τὰ αἰτήματα
    αὐτῶν, οἱ δὲ μὴ δουλεύοντες τῷ Κυρίῳ, ἐκεῖνοι οὐδὲν λήψονται. 7. ἐὰν δὲ μίαν τις πρᾶξιν ἐργάσηται,
    δύναται καὶ τῷ Κυρίῳ δουλεῦσαι· οὐ γὰρ διαφθαρήσεται ἡ διάνοια αὐτοῦ ἀπὸ τοῦ Κυρίου, ἀλλὰ δουλεύσει
    αὐτῷ ἔχων τὴν διάνοιαν αὐτοῦ καθαράν. 8. ταῦτα οὖν ἐὰν ποιήσῃς, δύνασαι καρποφορῆσαι εἰς τὸν αἰῶνα
    τὸν ἐρχόμενον· καὶ ὃς ἂν ταῦτα ποιήσῃ, καρποφορήσει.'
