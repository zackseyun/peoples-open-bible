lexical_decisions:
- source_word: σὺ πάντα γινώσκεις, σὺ οἶδας
  english_pob_choice: You know all things; you know
  chosen_korean: 주께서 모든 것을 아십니다. 주께서 아시나이다.
  alternatives_korean:
  - 주님, 모든 것을 아십니다. 주님께서도 아십니다.
  - 주께서 모든 것을 알고 계십니다. 주께서도 아십니다.
  lexicon: BDAG
  rationale: 두 지식 동사를 모두 살려 반복을 유지했고, 기도체에 맞게 호격과 존칭 동사를 사용했습니다. "아시나이다"는 두 번째 동사의 강조를 살리면서도 공손한 기도문 어조를 유지합니다.
- source_word: οὐκ ἐν ὕβρει οὐδὲ ἐν ὑπερηφανείᾳ οὐδὲ ἐν φιλοδοξίᾳ
  english_pob_choice: not in insolence or in pride or in ambition
  chosen_korean: 오만이나 교만이나 야심 때문이 아니라
  alternatives_korean:
  - 오만이나 교만이나 명예욕 때문이 아니라
  - 무례나 교만이나 야심 때문이 아니라
  lexicon: LSJ
  rationale: 세 단어의 병렬을 한국어에서도 명확히 살렸습니다. "오만"은 ὕβρις의 인격적 무례와 거만함을, "교만"은 ὑπερηφανία를, "야심"은 φιλοδοξία의 자기추구를 비교적 자연스럽게 드러냅니다.
- source_word: τὸ μὴ προσκυνεῖν τὸν ὑπερήφανον Ἁμάν
  english_pob_choice: refusing to bow down to the proud Haman
  chosen_korean: 교만한 하만에게 절하지 않기 위함이었습니다
  alternatives_korean:
  - 교만한 하만 앞에 엎드리지 않기 위함이었습니다
  - 교만한 하만에게 절하지 않으려 한 것이었습니다
  lexicon: BDAG
  rationale: προσκυνεῖν은 예배적·경배적 몸짓까지 포함할 수 있어 문맥상 단순한 인사보다 "절하다"가 적절합니다. 형용사 ὑπερήφανον은 인물 평가로 유지했습니다.
theological_decisions:
- issue: 행위의 동기 진술 범위
  chosen_reading: 본문은 그 거절이 죄된 자기과시에서 나온 것이 아니라고만 말하며, 그 긍정적 동기는 이 절에서 더 풀지 않습니다.
  alternative_readings:
  - 순수하게 종교적 이유였다
  - 정치적·개인적 이유였다
  rationale: 헬라어는 오만·교만·야심을 부정할 뿐, 대체 동기를 명시하지 않습니다. 한국어도 그 절제된 범위를 그대로 유지했습니다.
  doctrine_reference: 본문이 말하는 범위를 넘어서 동기를 단정하지 않음
- issue: 두 번째 지식 동사의 어조
  chosen_reading: 두 번째 문장은 기도체의 강조로 보아 존칭 종결을 살렸습니다.
  alternative_readings:
  - 두 문장을 모두 평서형으로 통일
  - 둘째 문장을 단순 반복으로 처리
  rationale: σὺ πάντα γινώσκεις / σὺ οἶδας의 중복 강조를 한국어에서 기도적 존호 반복으로 옮기면 원문의 간청성과 강조가 살아납니다.
  doctrine_reference: 기도문에서의 직접호칭과 존칭 표현
