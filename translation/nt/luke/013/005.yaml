theological_decisions:
- issue: Force of ὡσαύτως ἀπολεῖσθε
  chosen_reading: Translate as 'likewise perish' and preserve that this refers to a comparable kind of judgment without over-specifying whether the comparison is manner, certainty, or suddenness.
  alternative_readings:
  - perish in the same way
  - die likewise
  rationale: The context compares the hearers with those mentioned in the preceding incidents, but the exact dimension of the comparison is not fully explicit. The translation should preserve the warning's tension rather than resolve it too narrowly.
  doctrine_reference: Translation philosophy §3
- issue: Context-sensitive reorientation terminology
  chosen_reading: No[a], I tell you; but unless you reorient toward God, you will all likewise perish.
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
