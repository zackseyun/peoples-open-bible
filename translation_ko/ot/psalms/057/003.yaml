revisions:
- from: 내가 지극히 높으신 하나님께 부르짖습니다. 나를 위해 일들을 이루시는 하나님께 부르짖습니다.[a]
  to: 하나님께서 하늘에서 보내시고 나를 구원하실 것입니다.[a] 나를 헐떡이며 뒤쫓는 자를 꾸짖으실 것입니다.[b] 셀라. 하나님께서 자신의 한결같은 사랑과 신실하심을 보내실 것입니다.
  rationale: 안전한 수정이 아니라 필수적인 본문 교체입니다. 번역을 WLC 시편 57:3에 맞추어 다시 작성했습니다. 첫 ‘보내시고’의 목적어는 원문처럼 밝히지 않았으며, חֵרֵף는 본문에서 ‘꾸짖으실 것입니다’로 직역적 의미를 유지했습니다. 하나님의 적대자 수치라는 해석을 본문에 덧붙이지 않았고, 적대자를 주어로 보는 대안은 각주에 남겼습니다. 각주 표지는 실제로 설명하는 구절 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:09:10Z'
