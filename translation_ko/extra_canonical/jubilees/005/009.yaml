  text: And he sent a sword among them so that each might kill his fellow, and they began to kill one another until they all fell by the sword and were wiped out from the earth.
translation:
  language: ko
  text: 그리고 그들 가운데에 칼을 보내어 각 사람이 자기 동료를 죽이게 하셨습니다. 그들은 서로를 죽이기 시작하여 모두 칼에 쓰러지고 마침내 땅에서 쓸려 없어졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ፡
  english_pob_choice: a sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 도검
  lexicon: Common noun
  rationale: 게에즈 원문과 POB 영어의 'sword'는 문자 그대로의 무기를 가리키며, 한국어에서는 서사 문맥에서 자연스러운 '칼'이 가장 직접적입니다.
- source_word: ይቅትል / ይቅትሉ
  english_pob_choice: might kill / began to kill
  chosen_korean: 죽이게 하셨습니다 / 서로 죽이기 시작하여
  alternatives_korean:
  - 살해하게 하셨습니다 / 서로 살해하기 시작하여
  - 죽이도록 하셨습니다 / 서로 죽이기 시작했습니다
  lexicon: Verb
  rationale: 반복 동작과 상호 살해의 진행을 드러내기 위해 '죽이게 하셨습니다'와 '서로 죽이기 시작하여'로 옮겼습니다.
- source_word: ወተደምሰሱ
  english_pob_choice: were wiped out
  chosen_korean: 쓸려 없어졌습니다
  alternatives_korean:
  - 전멸했습니다
  - 완전히 사라졌습니다
  lexicon: Verb phrase
  rationale: 원문의 전면적 소멸을 살리면서도, '땅에서'와 결합할 때 자연스러운 결과를 위해 '쓸려 없어졌습니다'를 택했습니다.
theological_decisions:
- issue: 행위 주체와 심판적 표현
  chosen_reading: 하나님께서 칼을 보내어 그들 내부의 상호 살육을 일으키시는 심판 서술로 읽었습니다.
  alternative_readings:
  - 단순한 전투 묘사로 읽기
  - 사건의 직접 원인을 약화시켜 중립적으로 번역하기
  rationale: 본문은 단순한 폭력 사건이 아니라 신적 심판의 서술로 읽히므로, 원문의 인과를 흐리지 않도록 보존했습니다.
