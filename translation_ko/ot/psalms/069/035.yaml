  text: For God will save Zion and build the cities of Judah, and they will dwell there and possess it[a][b].
  footnotes:
  - marker: a
    text: The Hebrew says 'possess her,' with a feminine singular pronoun that may refer to Zion, Jerusalem/the restored city, or the land; English naturally uses 'it' here.
    reason: alternative_reading
  - marker: b
    text: Or 'inherit it' or 'take possession of it.' The Hebrew verb can carry the sense of inheriting or taking possession, especially of land.
