  - 전율
  lexicon: HALOT
  rationale: 이 단어는 극도의 두려움과 소름 끼침을 가리키므로, ‘공포’가 문맥의 강도를 잘 전달합니다. 영어 POB의 ‘horror’와도 대응됩니다.
theological_decisions:
- issue: 감정의 중첩 표현을 어떻게 살릴지
  chosen_reading: ‘두려움과 떨림’과 ‘공포가 나를 덮습니다’를 병렬로 유지해, 시편 화자의 압도되는 상태를 그대로 드러냈습니다.
  alternative_readings:
  - ‘두려움이 밀려오고 떨림이 나를 덮습니다’처럼 동사를 분산하는 방식
  - ‘두려움과 전율’처럼 더 문학적으로 다듬는 방식
  rationale: 본문은 감정이 단계적으로 누적되는 이미지를 주므로, 의미를 약화시키지 않기 위해 직선적으로 병렬과 덮음의 이미지를 유지했습니다.
  doctrine_reference: 시편의 탄원과 공포의 묘사
