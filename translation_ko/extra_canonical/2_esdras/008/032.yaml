id: 2ES.8.32
reference: 2 Esdras 8:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter nos peccatores misericors uocatus es. Si enim desideraueris ut nostri miserearis tunc misericors uocaberis, nobis enim
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/032.yaml
  text: For if you desire to have mercy on us, then you will be called merciful, for we are sinners.
translation:
  language: ko
  text: 죄인인 우리 때문에 주께서는 자비로우신 분이라 불리셨습니다. 주께서 우리에게 자비를 베풀고자 하신다면, 그때에는 자비로우신 분이라 불리실 것입니다. 우리는 죄인들이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misericors
  english_pob_choice: merciful
  chosen_korean: 자비로우신
  alternatives_korean:
  - 긍휼하신
  - 은혜로우신
  lexicon: misericors → merciful
  rationale: 라틴어 misericors의 핵심 의미를 ‘자비롭다’로 옮겨 영어 POB의 merciful과 직접 대응시켰습니다. 교회 전통어 ‘긍휼’도 가능하지만, 본문이 ‘자비’의 동사적·형용사적 대응을 요구하므로 ‘자비로우신’이 자연스럽습니다.
- source_word: uocaberis / uocatus es
  english_pob_choice: will be called
  chosen_korean: 불리실 것입니다
  alternatives_korean:
  - 불리게 될 것입니다
  - 호칭되실 것입니다
  lexicon: vocare → call / be called
  rationale: 본문의 수동적 호칭 의미를 살려 ‘불리실 것입니다’로 옮겼습니다. 인물에 대한 존칭을 유지하면서도 예언적 선언의 형식을 보존합니다.
- source_word: desideraueris ut nostri miserearis
  english_pob_choice: you desire to have mercy on us
  chosen_korean: 우리를 불쌍히 여기고자 하신다면
  alternatives_korean:
  - 우리에게 자비를 베풀고자 하신다면
  - 우리를 긍휼히 여기고자 하신다면
  lexicon: miserearis → have mercy / pity
  rationale: 라틴어 miserearis는 단순 감정이 아니라 자비를 베푸는 행위를 가리키므로, 영어 POB의 의미를 따라 ‘자비를 베풀다/불쌍히 여기다’ 범주로 옮겼습니다. 본문 흐름상 ‘만일 … 원하신다면’의 조건문을 분명히 드러냈습니다.
- source_word: peccatores
  english_pob_choice: sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 죄인
  - 죄 많은 사람들
  lexicon: peccator → sinner
  rationale: propter nos peccatores의 직접적 진술을 유지하기 위해 ‘죄인들’로 번역했습니다. 영어 POB의 최종 수정처럼 ‘의로운 행위가 없음’ 같은 해석을 덧붙이지 않고, 본문에 있는 이유절만 반영했습니다.
theological_decisions:
- issue: propter nos peccatores의 기능
  chosen_reading: ‘우리는 죄인들이기 때문입니다’로 옮겨, 자비 요청의 근거를 인간의 죄성으로 명시했습니다.
  alternative_readings:
  - ‘우리를 위하여 죄인인 우리가’
  - ‘죄인인 우리 때문에’
  rationale: 라틴어 propter nos peccatores는 단순 배경 설명이 아니라 자비를 구하는 이유를 밝히는 진술이므로, 영어 POB의 최종 수정에 맞춰 이유절을 명시적으로 살렸습니다.
  doctrine_reference: 인간의 죄성과 하나님의 자비에 관한 일반적 성서 진술
- issue: 주께서의 존칭
  chosen_reading: 하나님께 직접 말하는 문맥으로 보고 ‘주께서 … 하신다면’과 존칭형 종결을 사용했습니다.
  alternative_readings:
  - 비존칭 서술형
  - 기도체의 더 고전적인 ‘-옵소서’
  rationale: 본문은 기도 또는 간청의 어조이므로 한국어 합쇼체를 유지하되, 직접 호칭의 존중을 반영했습니다. 지나치게 고어적인 기도체는 현대 가독성을 해칠 수 있어 피했습니다.
  doctrine_reference: 기도문 및 간구의 한국어 문체 관행
