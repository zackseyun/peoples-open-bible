theological_decisions:
- issue: 보편적 소환의 범위
  chosen_reading: 시인은 이스라엘 내부만이 아니라 모든 백성과 세상의 모든 주민을 향해 공적으로 경청을 요구합니다.
  alternative_readings:
  - 일반적인 청중 호명으로만 약화시킬 수 있음
  - '''민족들''로 좁혀 정치적 집단만 가리키는 것으로 오해될 수 있음'
  rationale: כָּל הָעַמִּים / כָּל יֹשְׁבֵי חָלֶד의 이중 병행은 청중 범위를 의도적으로 최대화하므로, 한국어도 보편적 호소를 분명히 드러내야 합니다.
  doctrine_reference: 시편의 지혜시적 보편 호소
- issue: חָלֶד의 의미 범위
  chosen_reading: '''세상''으로 옮겨 인간이 사는 세계를 가리키는 POB의 해석을 따르되, ''땅''으로만 고정하지는 않았습니다.'
  alternative_readings:
  - '''땅'''
  - '''세계'''
  rationale: חָלֶד은 인간 삶의 세계 또는 지상의 영역을 가리킬 수 있어, 문맥상 보편적 청중을 부르는 표현인 '세상'이 가장 무난합니다.
  doctrine_reference: 어휘의 다의성 유지
