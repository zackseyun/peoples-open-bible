  yaml_path: translation/ot/psalms/062/003.yaml
  text: How long will you assail a man? Will you all murder him[a], like a leaning wall[b], a tottering fence?
  footnotes:
  - marker: a
    text: Or “Will you all break him down?” taking the verb in light of the structural-collapse imagery that follows.
    reason: lexical_alternative
  - marker: b
    text: The comparison may describe the attacked man as fragile and near collapse, though some understand it to describe the attackers as massing against him like a bulging wall.
    reason: alternative_reading
translation:
  language: ko
  text: 너희가 한 사람을 언제까지 들이치겠느냐? 너희가 모두 그를 무너뜨리려 하느냐? 그는 기울어진 담, 밀려난 울타리와 같다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그를 무너뜨리려 하느냐’로 옮긴 말은 직역하면 ‘그를 죽이려 하느냐’ 또는 ‘살해하려 하느냐’로 이해될 수 있습니다. 그러나 뒤따르는 담과 울타리의 붕괴 비유 때문에, 문맥상 비유적으로 ‘무너뜨리다’로 이해하는 견해도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기울어진 담, 밀려난 울타리’는 보통 공격받는 한 사람의 위태로운 처지를 가리키는 것으로 이해됩니다. 그러나 이를 공격자들이 한데 몰려드는 모습을 묘사하는 것으로 보는 해석도 있습니다.
    reason: alternative_reading
