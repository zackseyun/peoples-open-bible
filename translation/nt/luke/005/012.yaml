  category: meaning_retranslation
  from: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
  to: While Jesus was in one of the towns, a man covered with leprosy[a] saw him, fell facedown, and begged him, “Lord, if you are willing, you can cleanse me[b].”
  rationale: The lexical record itself offers 'covered with leprosy,' although it preferred the source-shaped 'full of.' I retain its important distinction between cleansing and merely medical healing, and clarify both the ancient disease terminology and the purity setting in short notes.
