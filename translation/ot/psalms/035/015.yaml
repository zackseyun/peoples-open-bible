id: PSA.35.15
reference: Psalms 35:15
source:
  edition: WLC
  text: וּ/בְ/צַלְעִ/י֮ שָׂמְח֪וּ וְֽ/נֶאֱ֫סָ֥פוּ נֶאֶסְפ֬וּ עָלַ֣/י נֵ֭כִים וְ/לֹ֣א יָדַ֑עְתִּי קָֽרְע֥וּ וְ/לֹא דָֽמּוּ־׃
translation:
  text: But when I stumbled, they rejoiced and gathered together; attackers[a] gathered against me without my knowledge. They tore at me and did not stop[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew word rendered “attackers” is uncertain; it may mean “strikers” or possibly “the afflicted.”
    reason: alternative_reading
  - marker: b
    text: Or, “They slandered me and would not be silent.” The Hebrew can describe a tearing attack or relentless abusive speech.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְצַלְעִי
  chosen: when I stumbled
  alternatives:
  - in my limping
  - at my halting
  - when I stumbled
  lexicon: HALOT
  rationale: Natural temporal English while retaining the image of limping or faltering.
- source_word: שָׂמְחוּ
  chosen: they rejoiced
  alternatives:
  - they were glad
  lexicon: HALOT
  rationale: Standard rendering of שמח in the Qal perfect; 'rejoiced' fits the hostile delight of the context.
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  chosen: and gathered together; they gathered
  alternatives:
  - and assembled; they assembled
  - and banded together
  lexicon: HALOT
  rationale: The repetition of אסף should be reflected in English rather than collapsed. The first with conjunction is rendered 'and gathered together,' followed by the repeated verb 'they gathered' to preserve the emphatic piling up of the Hebrew.
- source_word: עָלַי
  chosen: against me
  alternatives:
  - upon me
  - around me
  lexicon: HALOT
  rationale: Although literally 'upon me,' in hostile context English idiom prefers 'against me' to convey adversarial action.
- source_word: נֵכִים
  chosen: attackers
  alternatives:
  - smiters
  - the afflicted
  - cripples
  lexicon: HALOT
  rationale: A hostile-agent sense best fits the immediate context, while the note preserves the substantial lexical uncertainty.
- source_word: וְלֹא יָדַעְתִּי
  chosen: without my knowledge
  alternatives:
  - and I did not know
  - without my knowledge
  lexicon: HALOT
  rationale: Retains the clause’s natural adverbial force.
- source_word: קָרְעוּ
  chosen: they tore at me
  alternatives:
  - they tore me
  - they slashed
  lexicon: HALOT
  rationale: קרע literally means 'tear/rend.' Because the object is implicit and the context is hostile speech or attack, 'tore at me' communicates repeated vicious assault without specifying more than the Hebrew does.
- source_word: וְלֹא דָמּוּ
  chosen: and did not stop
  alternatives:
  - and were not silent
  - and did not cease
  lexicon: HALOT
  rationale: דמם can mean be silent or cease. Here, following 'they tore,' the sense is that they kept on without relenting. 'Did not stop' is idiomatic and captures the ongoing action; 'were not silent' is possible if the tearing is metaphorical for verbal abuse, so that alternative is footnoted.
