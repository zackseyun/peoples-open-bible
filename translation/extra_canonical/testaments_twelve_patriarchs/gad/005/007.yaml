id: T12P.GAD.5.7
reference: Testament of Gad 5:7
unit: verse
book: Testament of Gad
collection: Testaments of the Twelve Patriarchs
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '7. Ἡ γὰρ κατὰ Θεὸν ἀληθὴς⁵¹ μετάνοια⁵² [ἀναιρεῖ *τὴν ἄγνοιαν⁵³ καὶ] φυγαδεύει τὸ σκότος, καὶ φωτίζει τοὺς ὀφθαλμοὺς καὶ γνῶσιν παρέχει τῇ ψυχῇ, καὶ ὁδηγεῖ *τὸ διαβούλιον⁵⁴ *πρὸς σωτηρίαν⁵⁵.'
  language: Greek
translation:
  text: For true reorientation[a] according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the mind toward salvation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
