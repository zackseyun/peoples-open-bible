translation:
  language: ko
  text: 원수들이 뒤로 물러갈 때, 그들은 주님 앞에서 비틀거리며 망할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשְׂמְחָה
  english_pob_choice: I will rejoice
  chosen_korean: 기뻐하며
  alternatives_korean:
  - 기뻐하겠습니다
  - 즐거워하겠습니다
  lexicon: HALOT
  rationale: 첫 번째 동사의 기쁨을 자연스러운 한국어로 옮기되, 뒤의 동사와 나란히 놓기 위해 동사적 연결형을 택했습니다.
- source_word: וְאֶעֶלְצָה
  english_pob_choice: and exult
  chosen_korean: 즐거워하겠습니다
  alternatives_korean:
  - 환호하겠습니다
  - 크게 기뻐하겠습니다
  lexicon: HALOT
  rationale: עָלַץ 계열의 더 강한 환희를 드러내기 위해 앞의 '기뻐하다'와 구별되는 표현을 사용했습니다.
- source_word: בָךְ
  english_pob_choice: in you
  chosen_korean: 주 안에서
  alternatives_korean:
  - 주 안에
  - 주를 두고
  lexicon: HALOT
  rationale: 히브리어 전치사 ב의 초점은 하나님을 기쁨의 대상/범위로 두는 것이어서, 한국어에서는 '주 안에서'가 가장 자연스럽고 직접적입니다.
- source_word: אֲזַמְּרָה
  english_pob_choice: I will sing praise
  chosen_korean: 노래로 찬양하겠습니다
  alternatives_korean:
  - 찬송하겠습니다
  - 노래하겠습니다
  lexicon: HALOT
  rationale: זמר의 예배적·찬양적 의미를 분명히 하면서도, 한국어에서 시편 문맥에 자연스러운 표현으로 옮겼습니다.
- source_word: עֶלְיוֹן
  english_pob_choice: Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지존자
  - 가장 높으신 분
  lexicon: HALOT
  rationale: עֶלְיוֹן이 하나님의 호칭으로 쓰였음을 살리기 위해 직역적 칭호보다 호칭성을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 시편 9:3의 병행법에서 기쁨의 두 동사를 어떻게 구분할지
  chosen_reading: 첫 동사는 일반적 기쁨('기뻐하며'), 둘째 동사는 더 고양된 환희('즐거워하겠습니다')로 구분했습니다.
  alternative_readings:
  - 두 동사를 모두 '기뻐하다'로 평준화
  - 두 동사를 모두 '환호하다'로 강화
  rationale: 히브리어 원문은 같은 의미를 반복하지 않고 기쁨의 강도를 누적합니다. 한국어에서도 이 차이를 보존해야 시적 병행이 살아납니다.
  doctrine_reference: 시편의 평행법과 정서 강도 보존
