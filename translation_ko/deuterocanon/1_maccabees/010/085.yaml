lexical_decisions:
- source_word: οἱ πεπτωκότες μαχαίρᾳ
  english_pob_choice: those who fell by the sword
  chosen_korean: 칼에 맞아 쓰러진 사람들
  alternatives_korean:
  - 칼에 쓰러진 사람들
  - 칼에 죽임당한 사람들
  lexicon: πεπτωκότες / μάχαιρα
  rationale: 직역적으로는 ‘칼에 떨어진 자들’이지만, 한국어에서는 자연스럽게 ‘칼에 맞아 쓰러진 사람들’로 옮겨 결과를 분명히 했습니다.
- source_word: σὺν τοῖς ἐμπυρισθεῖσιν
  english_pob_choice: together with those who were burned
  chosen_korean: 불탄 사람들과 합하여
  alternatives_korean:
  - 불에 탄 사람들과 함께
  - 불태워진 사람들과 함께
  lexicon: ἐμπυρισθεῖσιν
  rationale: σὺν의 결합 관계를 살려 ‘~과 합하여’로 처리했고, 수동 분사를 한국어 수동 표현으로 자연스럽게 옮겼습니다.
- source_word: εἰς ἄνδρας ὀκτακισχιλίους
  english_pob_choice: came to eight thousand men
  chosen_korean: 모두 팔천 명이었습니다
  alternatives_korean:
  - 팔천 명에 이르렀습니다
  - 팔천 명이 되었습니다
  lexicon: εἰς + accusative of total/result
  rationale: 전체 수를 나타내는 결과 표현이므로 ‘모두 …이었습니다’로 간결하게 처리했습니다.
