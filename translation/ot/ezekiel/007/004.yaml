  from: My eye will not spare you[a], nor will I have pity; for I will bring your ways upon you, and your abominations will be within you[b]. Then you will know that I am Yahweh.
  to: I will not spare you or have pity; I will repay you for your ways, and the consequences of your abominations will be in your midst[a]. Then you will know that I am Yahweh.
