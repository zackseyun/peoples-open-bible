- issue: Sense of the homeland's cleansing
  chosen_reading: '''the homeland should be purified'' preserves possible ritual and moral-national dimensions without narrowing the sense.'
  alternative_readings:
  - the homeland should be cleansed
  - the fatherland should be purified from defilement
  rationale: The passive infinitive καθαρισθῆναι could be heard as broader than mere physical liberation; in context of martyrdom and atonement themes in 4 Maccabees, a more open rendering is preferable to an overly concrete one.
  doctrine_reference: Preserve theological tension rather than resolve it.
