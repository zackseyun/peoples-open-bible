  from: And when Daniel knew that the document had been signed[a], he went to his house. Now the windows in his upper room were open toward Jerusalem, and three times a day he knelt on his knees and prayed and gave thanks before his God[c][b], just as he had been doing before this.
  to: When Daniel learned that the document had been signed, he went home. The windows in his upper room were open toward Jerusalem[a], and three times a day he knelt, prayed, and gave thanks before his God, just as he had done before.
