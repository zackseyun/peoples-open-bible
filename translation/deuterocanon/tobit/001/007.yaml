id: TOB.1.7
reference: Tobit 1:7
source:
  edition: lxx-swete-1909
  text: καὶ ἐδίδουν αὐτὰς τοῖς ἱερεῦσιν τοῖς υἱοῖς Ἀαρὼν πρὸς τὸ θυσιαστήριον τῶν γενημάτων· τὴν δεκάτην ἐδίδουν τοῖς υἱοῖς Λευεὶ τοῖς θεραπεύουσιν εἰς Ἱερουσαλήμ, καὶ τὴν δευτέραν δεκάτην ἀπεπρατιζόμην, καὶ ἐπορευόμην καὶ ἐδαπάνων αὐτὰ ἐν Ἱεροσολύμοις καθʼ ἕκαστον ἐνιαυτόν·
  language: Greek
  pages:
  - 832
  - 833
  - 834
  - 835
  - 836
  confidence: high
  validation: minor_mismatch
  note: Primary translation anchor remains the Greek; see parallel_sources for the Semitic / MT witness.
  parallel_sources:
  - edition: neubauer-tobit-1878
    text: ובמקום שיתאבלו ושיתענו לפני יי' על גזירת אחיהם ואשר קצף עליהם היו אוכלים ושותים ושמחים מתענגים בכלי שיר ובכנורות ובנבלים ולא נחלו על שבר יהודה בעונותינו ובעונות אבותינו ככתוב על יהודה "השותים במזרקי יין וראשי‏ שמנים ימשחו ולא נחלו על שבר יוסף" (עמוס ו, ו) וגם על זאת היה קצף מאת יי על יהודה וירושלם ויבא עליהם את מלך בבל עד השליכם מעל פניו ויגל את יהודה מעל אדמתו.
    kind: indirect_hebrew
    note: NOT an ancient Hebrew witness. Neubauer's 1878 Hebrew is a back-translation from an Aramaic Munich MS. The actual ancient evidence is Qumran 4Q196-200 (Aramaic), published in DJD XIX (not redistributable). Use for translation reference only; do not treat as Vorlage.
    reference: TOB 1:7
translation:
  text: I would give these offerings from the produce to the priests, the descendants of Aaron, for the altar. I would give the tithe to the Levites who ministered in Jerusalem, and I would sell the second tithe and go to Jerusalem each year to spend the proceeds.
  philosophy: dynamic
lexical_decisions:
- source_word: ἐδίδουν
  chosen: I would give
  alternatives:
  - I gave
  - I used to give
  lexicon: BDAG
  rationale: The imperfect indicates customary repeated action in past time. 'I would give' preserves the habitual sense in natural English.
- source_word: αὐτὰς
  chosen: them
  alternatives:
  - these things
  lexicon: BDAG
  rationale: The feminine plural pronoun refers back to the tithes/offerings implied by the context. 'Them' is idiomatic while still anchored to the Greek.
- source_word: τοῖς ἱερεῦσιν τοῖς υἱοῖς Ἀαρών
  chosen: to the priests, the sons of Aaron
  alternatives:
  - to the Aaronic priests
  lexicon: BDAG
  rationale: The appositional phrase is kept explicit rather than compressed, preserving the priestly lineage named in the Greek.
- source_word: πρὸς τὸ θυσιαστήριον τῶν γενημάτων
  chosen: for the altar from the produce
  alternatives:
  - for the altar, from the produce
  - for the altar offerings from the crops
  lexicon: BDAG
  rationale: The phrase is somewhat compressed in Greek. 'For the altar from the produce' preserves the relation of the gifts to altar use and their source in agricultural yield without over-paraphrasing.
- source_word: τὴν δεκάτην
  chosen: the tenth
  alternatives:
  - the tithe
  lexicon: BDAG
  rationale: Literally 'the tenth.' English readers may hear 'tithe,' but 'the tenth' stays closer to the Greek while remaining understandable in context.
- source_word: τοῖς υἱοῖς Λευεί
  chosen: to the sons of Levi
  alternatives:
  - to the Levites
  lexicon: BDAG
  rationale: The Greek explicitly says 'sons of Levi.' This is preserved formally, though it denotes the Levites.
- source_word: τοῖς θεραπεύουσιν εἰς Ἱερουσαλήμ
  chosen: who minister in Jerusalem
  alternatives:
  - who serve in Jerusalem
  lexicon: BDAG
  rationale: θεραπεύω in cultic context means to render service/minister. 'Minister' fits the temple-service setting.
- source_word: τὴν δευτέραν δεκάτην
  chosen: the second tenth
  alternatives:
  - the second tithe
  lexicon: BDAG
  rationale: Again, the Greek is literally 'the second tenth.' This likely refers to the second tithe known from Torah practice, but the translation keeps the literal wording.
- source_word: ἀπεπρατιζόμην
  chosen: I would sell
  alternatives:
  - I would convert into money
  - I sold
  lexicon: LSJ
  rationale: The verb denotes selling or disposing by sale. Given the following 'go and spend it in Jerusalem,' 'I would sell' best reflects the sequence without importing too much explanatory detail.
- source_word: ἐδαπάνων αὐτὰ
  chosen: spend it
  alternatives:
  - spend them
  - use it up
  lexicon: BDAG
  rationale: Although the Greek has plural 'them,' English naturally treats the proceeds of sale as a singular mass ('it'). This reflects the sense after conversion by sale.
- source_word: καθʼ ἕκαστον ἐνιαυτόν
  chosen: each year
  alternatives:
  - every year
  lexicon: BDAG
  rationale: A straightforward rendering of the distributive phrase; 'each year' is concise and natural.
