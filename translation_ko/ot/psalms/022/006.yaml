revisions:
- from: 주님께 부르짖으니 그들이 건짐을 받았고[a] — 주님을 신뢰하니 수치를 당하지 않았습니다[b].
  to: 그러나 저는 벌레요 사람이 아니며, 사람들의 조롱거리가 되고 백성에게 멸시를 받습니다.
  rationale: 절 참조와 히브리어 원문을 기준으로 본문 전체를 교체했습니다. וְאָנֹכִי의 대조 접속사는 ‘그러나’로, תוֹלַעַת וְלֹא־אִישׁ은 ‘벌레요 사람이 아니며’로 옮겼습니다. חֶרְפַּת אָדָם은 소유·대상 관계를 한국어에서 자연스럽게 나타내는 ‘사람들의 조롱거리’로, וּבְזוּי עָם은 ‘백성에게 멸시를 받습니다’로 번역했습니다. 기존 각주는 다른 절의 어휘를 대상으로 하므로 모두 삭제했습니다.
  reviewer_model: gpt-5.6-terra
