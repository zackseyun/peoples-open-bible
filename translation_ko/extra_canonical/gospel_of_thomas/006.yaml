revisions:
- from: '그의 제자들이 그에게 물었습니다. 「당신께서는 우리가 금식하기를 원하십니까? 그리고 우리는 어떻게 기도해야 합니까? 우리가 자선을 베풀어야 합니까? 그리고 먹는 일에 관해서는 무엇을 지켜야 합니까?」


    예수께서 말씀하셨습니다. 「거짓말하지 마십시오. 그리고 여러분이 미워하는 것은 행하지 마십시오. 모든 것은 하늘 앞에서 드러납니다. 숨겨져 있지만 드러나지 않을 것은 아무것도 없고, 덮여 있지만 벗겨지지 않은 채 남을 것도 아무것도 없습니다.」[a][b]'
  to: '그의 제자들이 그에게 물었습니다. 「우리가 금식하기를 원하십니까? 그리고 우리는 어떻게 기도해야 합니까? 우리가 자선을 베풀어야 합니까? 그리고 먹는 일에 관해서는 무엇을 지켜야 합니까?」


    예수께서 말씀하셨습니다. 「거짓말하지 마십시오. 그리고 여러분이 미워하는 것은 행하지 마십시오. 모든 것이 하늘 앞에 드러나 있습니다.[a] 숨겨져 있어도 드러나지 않을 것은 아무것도 없고, 덮여 있어도 드러나지 않은 채 남을 것도 아무것도 없습니다.[b]」'
  rationale: 각주 표지를 해당 변이 구절에 직접 붙여 앵커를 바로잡았습니다. 콥트어 본문의 ‘숨겨진 것/드러남’과 ‘덮인 것/벗겨짐’의 두 병행 표현을 한국어에서 무리 없이 구분하고, 기준 본문의 ‘덮임/드러남’을 유지했습니다. 그리스어의 ‘묻힘/일으켜짐’은 본문에 혼입하지 않고 각주에서만 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:16Z'
review_pass:
  verdict: revise
  source_fidelity: 질문의 네 항목(금식, 기도, 자선, 먹는 일에 관한 준수)과 예수의 응답은 콥트어 본문을 대체로 충실히 반영합니다. 다만 본문비평 각주의 표지가 해당 변이 구절이 아니라 문단 끝에 함께 놓여 있어, ‘진리 앞에서’ 변이가 ‘하늘 앞에서’에 대응한다는 관계가 불분명합니다. 마지막 대구는 ϩⲟⲃⲥ/ϭⲟⲗⲡ의 ‘덮임/벗겨짐’을 보존하되, 한국어 표현을 다듬을 수 있습니다.
  naturalness: 전반적으로 자연스러운 현대 한국어 합쇼체입니다. ‘하늘 앞에서 드러납니다’도 가능하나 ‘하늘 앞에 드러나 있습니다’가 콥트어 현재 서술과 한국어 문맥에 더 매끄럽습니다. ‘벗겨지지 않은 채 남을 것’은 다소 무거우므로 ‘드러나지 않은 채 남을 것’으로 하면 자연스럽고, 앞 절의 ‘숨겨져’와도 구별됩니다.
  terminology: ‘금식’, ‘자선을 베풀다’, ‘먹는 일에 관해서’, ‘거짓말하다’는 적절합니다. ‘하늘’은 원문의 ⲧⲡⲉ 및 영어 POB의 heaven에 충실합니다. 마지막 절은 ‘덮여/드러나다’로 옮겨 콥트어의 계시적 어휘 대조를 살렸습니다.
