  from: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
  to: Remember the whole journey on which Yahweh your God has led you through the wilderness these forty years. He did this to humble you and test you, to know what was in your heart—whether you would keep his commandments or not.
  rationale: The earlier deliberation rightly resisted replacing God's 'knowing' with an explanatory statement about revelation. I retain that tension while clarifying that 'the way' means Israel's whole wilderness journey.
