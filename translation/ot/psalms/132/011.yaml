id: PSA.132.11
reference: Psalms 132:11
source:
  edition: WLC
  text: נִשְׁבַּֽע יְהוָ֨ה לְ/דָוִ֡ד אֱמֶת֮ לֹֽא יָשׁ֪וּב מִ֫מֶּ֥/נָּה מִ/פְּרִ֥י בִטְנְ/ךָ֑ אָ֝שִׁ֗ית לְ/כִסֵּא לָֽ/ךְ־׀־־׃
translation:
  text: 'Yahweh swore a sure oath to David; he will not revoke it: “I will set one of your own descendants[a] on your throne.'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “from the fruit of your body.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבַּע
  chosen: swore
  alternatives:
  - has sworn
  - made an oath
  lexicon: HALOT
  rationale: Nifal of שבע here denotes taking an oath. Simple past 'swore' fits the poetic-historical assertion in English.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives: []
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: אֱמֶת
  chosen: a sure oath
  alternatives:
  - truth
  - faithfulness
  - a true oath
  lexicon: HALOT
  rationale: The noun “truth” qualifies the oath as reliable or certain; “a sure oath” expresses that force naturally.
- source_word: לֹא יָשׁוּב מִמֶּנָּה
  chosen: he will not turn back from it
  alternatives:
  - he will not retract it
  - he will not turn from it
  lexicon: HALOT
  rationale: שוב with מן conveys turning back or withdrawing. The feminine suffix most naturally refers to the oath/pledge. 'Turn back from it' preserves the metaphor while remaining clear.
- source_word: מִפְּרִי בִטְנְךָ
  chosen: From the fruit of your body
  alternatives:
  - From your offspring
  - From the fruit of your body
  lexicon: HALOT
  rationale: בֶּטֶן can denote the body/belly as the source of offspring; “body” avoids the inappropriate implication that David has a womb while retaining the image.
- source_word: אָשִׁית
  chosen: I will set
  alternatives:
  - I will place
  - I will appoint
  lexicon: HALOT
  rationale: שׁית commonly means put/place/set. 'Set' works well with enthronement language and keeps the divine first-person promise explicit.
- source_word: לְכִסֵּא
  chosen: on a throne
  alternatives:
  - on the throne
  - for the throne
  lexicon: HALOT
  rationale: The preposition with כסא indicates placement in royal rule. Because the Hebrew lacks the article, 'on a throne' is a defensible rendering, though contextually it refers to David's royal throne.
- source_word: לָךְ
  chosen: for you
  alternatives:
  - for yourself
  - for your line
  lexicon: HALOT
  rationale: The suffix is second masculine singular referring to David. 'For you' preserves the direct address and covenantal benefit without over-interpreting.
- source_word: לְכִסֵּא לָךְ
  chosen: on your throne
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The dynastic context identifies the throne as David’s; this is natural English for the enthronement expression.
