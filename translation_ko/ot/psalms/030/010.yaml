revisions:
- from: 내 피에 무슨 유익이 있습니까? 내가 구덩이로 내려가면 무슨 이익이 있습니까? 흙이 주님을 찬양하겠습니까? 그것이 주님의 신실하심을 전하겠습니까?[a][b][c]
  to: 야훼여, 들으시고 제게 은혜를 베풀어 주십시오. 야훼여, 저를 돕는 이가 되어 주십시오.[a]
  rationale: 번역 대상을 WLC 시편 30:10에 맞추어 전면 교정했습니다. 첫 명령형 שְׁמַע는 목적어를 보충하지 않은 ‘들으시고’로, וְחָנֵּנִי는 1인칭 목적어를 명시하여 ‘제게 은혜를 베풀어 주십시오’로 옮겼습니다. הֱיֵה עֹזֵר לִי는 단순한 추상명사 ‘도움’보다 분사 עֹזֵר의 인격적·지속적 의미를 보존하는 ‘저를 돕는 이가 되어 주십시오’로 번역했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:06:41Z'
