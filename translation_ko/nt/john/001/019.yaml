id: JHN.1.19
reference: John 1:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
  footnotes:
  - marker: a
    text: Or "the Jewish leaders" or "the Judeans." In John, "the Jews" often refers especially to the Judean religious authorities rather than to the Jewish people as a whole.
    reason: lexical_alternative
translation:
  language: ko
  text: 다음은 요한의 증언입니다. 유대인들이[a] 예루살렘에서 제사장들과 레위인들을 그에게 보내어 “당신은 누구십니까?” 하고 물었을 때의 일입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대 지도자들’ 또는 ‘유다 사람들’로 번역할 수 있습니다. 요한복음에서 ‘유대인들’은 종종 전체 유대 민족이 아니라, 특히 유다 지역의 종교 지도자들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  english_pob_choice: testimony
  chosen_korean: 증언
  alternatives_korean:
  - 증인
  - 증거
  lexicon: BDAG
  rationale: ἡ μαρτυρία는 공식적·법적 성격의 ‘증언’을 가리키는 명사입니다. 한국어 '증언'은 문맥상 요한이 제공하는 증거적 진술을 정확히 전달합니다.
- source_word: τοῦ Ἰωάννου
  english_pob_choice: of John
  chosen_korean: 요한의
  alternatives_korean:
  - 요한에 관하여
  - 요한에 대한
  lexicon: BDAG
  rationale: 그 소유격은 주격적(주체적) 소유로 읽어 요한이 증언을 '하는' 주체임을 나타냅니다. '요한의 증언'으로 직역했습니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대인 지도자들
  - 유다인들
  lexicon: BDAG
  rationale: 그리스어 표어를 문자적으로 살려 '유대인들'로 번역하되, 요한복음의 관행상 지칭 범위가 좁을 수 있음을 각주로 밝힙니다.
- source_word: ἱερεῖς καὶ Λευίτας
  english_pob_choice: priests and Levites
  chosen_korean: 제사장들과 레위 사람들
  alternatives_korean:
  - 제사장들과 레위인들
  lexicon: BDAG
  rationale: 두 집단은 성전과 관련된 구체적 그룹이므로 문자적이고 평이한 어휘로 옮겼습니다(제사장, 레위).
- source_word: Σὺ τίς εἶ
  english_pob_choice: Who are you?
  chosen_korean: 너는 누구냐?
  alternatives_korean:
  - 당신은 누구십니까?
  - 네가 누구냐?
  lexicon: BDAG
  rationale: 원문에 명시적 주어 Σὺ(’너’)가 있어 강조가 있으므로, 인용문 안에서는 2인칭을 명확하게 드러내는 반말형 '너는 누구냐?'로 옮겨 직접성과 강조를 살렸습니다. 본문 서술은 정중한 합쇼체를 유지했습니다.
theological_decisions:
- issue: Referent and rendering of οἱ Ἰουδαῖοι in John
  chosen_reading: 본문에서는 문자적으로 '유대인들'로 번역하고, 본문 하단 각주로 요한의 용법이 종종 유다 지역 종교 당국을 가리킬 수 있음을 밝힙니다.
  alternative_readings:
  - 유대인 지도자들
  - 유다인들
  rationale: 원문 우선주의를 따르며, 과도하게 범위를 좁히지 않고 원어 표현을 본문에 보존하는 것이 적절합니다. 그러나 본문의 상황(예루살렘에서 제사장들과 레위인들이 파견됨)을 고려하면 지칭범위가 종교적 권위자들로 한정될 가능성이 있어 각주로 설명합니다.
  doctrine_reference: Translation philosophy §§1,3,6
- issue: Register inside quoted question (Σὺ τίς εἶ)
  chosen_reading: 인용문 안에선 반말형 '너는 누구냐?'로 번역하여 Σὺ의 직접적 강조와 질문의 거침을 살립니다; 본문 서술 문장은 합쇼체로 유지했습니다.
  alternative_readings:
  - '격식적: ''당신은 누구십니까?'''
  - '완곡화: ''네가 누구냐?'''
  rationale: 개발 지침에 따라 인용 내에서 어조 전환을 허용하되, 변경을 명시적으로 문서화합니다. 이것은 원문의 대면적·직접적 성격을 독자에게 보다 충실히 전달합니다.
  doctrine_reference: Translation practice on quoted-register shifts
