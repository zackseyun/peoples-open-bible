  terminology: ‘왕국들’, ‘민족들’, ‘차지했습니다’, ‘바산 왕 옥’은 본문 및 현대 한국어의 격식 있는 성경 문체에 적절합니다. 고유명사도 통용 표기와 부합합니다.
