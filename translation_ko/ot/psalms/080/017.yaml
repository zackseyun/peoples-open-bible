  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 오른편에 있는 사람’. 히브리어 관용 표현은 하나님의 오른손과 특별히 관련되어 은총을 받거나 도움을 얻는 이를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인자’는 단순히 ‘사람’을 뜻할 수도 있으나, 성경 문맥에서는 왕적 또는 메시아적 울림을 지닐 수도 있습니다.
