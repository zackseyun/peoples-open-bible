reference: Psalms 18:50
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֤ן אוֹדְ/ךָ֖ בַ/גּוֹיִ֥ם יְהוָ֑ה וּ/לְ/שִׁמְ/ךָ֥ אֲזַמֵּֽרָה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/050.yaml
  text: He makes his king’s victories great and shows steadfast love to his anointed[a], to David and his offspring forever.[b]
  footnotes:
  - marker: a
    text: 'Hebrew: ''among the nations''; alternatively, ''among the Gentiles.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 자신의 왕에게 큰 구원을[a] 베푸시며, 자신의 기름부음 받은 이[b]에게 한결같은 사랑을 베푸십니다. 곧 다윗과 그의 후손[c]에게 영원토록 베푸십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 단어는 본문상·문법상 해석이 어려워 직역하면 ‘그의 왕의 구원들의 탑’에 가깝습니다. 사무엘하 22:51의 가까운 병행 본문은 ‘그의 왕의 구원을 크게 하시고’라고 읽습니다. 여기서는 그 뜻을 따라 ‘큰 구원을 베푸시며’로 옮겼습니다. ‘구원’은 문맥상 ‘승리’ 또는 ‘구원하시는 일들’로도 옮길 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘그의 기름부음 받은 이’는 ‘그의 메시아’로도 옮길 수 있습니다. 여기서는 직접적으로 다윗과 다윗 왕조를 가리키며, 더 넓은 메시아적 울림도 지닙니다.
    reason: alternative_reading
  - marker: c
    text: ‘후손’은 히브리어 단수 집합명사로, 다윗의 후손 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
