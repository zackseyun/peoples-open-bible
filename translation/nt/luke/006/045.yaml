  meaning_decisions:
  - source_phrase: ὁ ἀγαθὸς ἄνθρωπος ... ὁ πονηρός
    prior_rendering: The good man ... the evil man
    new_rendering: A good person ... an evil person
    rationale: The saying describes human character generally, not a distinction restricted to males. “Person,” with corresponding generic pronouns, communicates the actual scope of the contrast.
  - source_phrase: ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας αὐτοῦ ... ἐκ τοῦ πονηροῦ
    prior_rendering: out of the good treasure of his heart ... out of his evil treasure
    new_rendering: from the good stored up in their heart ... from the evil stored up within them
    rationale: The image concerns an inward reserve from which conduct emerges. “Stored up” retains that image while avoiding the misleading implication that the evil reserve is something valuable; a note preserves the treasure wording.
