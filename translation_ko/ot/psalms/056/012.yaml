  rationale: 대상 절의 WLC 본문에 맞추어 전체를 새로 번역했습니다. עָלַי는 서원이 화자에게 의무로 놓여 있음을 ‘제게 지워져 있습니다’로 반영했습니다. נְדָרֶיךָ의 직역상 소유 관계가 문맥에서 제기하는 문제는 본문을 부자연스럽게 ‘주의 서원’으로 고정하지 않고 각주에서 투명하게 밝혔습니다. אֲשַׁלֵּם은 서원의 이행과 연결되는 ‘드리겠습니다’로, תּוֹדוֹת는 가능한 제의적 의미를 보존한 ‘감사 제물’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
