id: JOB.11.3
reference: Job 11:3
source:
  edition: WLC
  text: בַּ֭דֶּי/ךָ מְתִ֣ים יַחֲרִ֑ישׁו וַ֝/תִּלְעַ֗ג וְ/אֵ֣ין מַכְלִֽם׃
translation:
  text: Will your empty talk silence people, and when you mock, will no one shame you?
  philosophy: dynamic
lexical_decisions:
- source_word: בַּדֶּיךָ
  chosen: your empty talk
  alternatives:
  - your boasts
  - your babblings
  - your idle talk
  - your lies
  lexicon: HALOT
  rationale: The noun בד means empty or idle speech, often with the sense of boastful or false talk. In context Zophar rebukes Job's many words, so 'empty talk' captures both the dismissive tone and the semantic range without overcommitting to 'lies.'
- source_word: מְתִים
  chosen: people
  alternatives:
  - mortals
  - people
  lexicon: HALOT
  rationale: Generic plural reference; “people” is ordinary English.
- source_word: יַחֲרִישׁו
  chosen: silence
  alternatives:
  - silence
  - make ... be quiet
  lexicon: HALOT
  rationale: The Hiphil denotes causing others to be silent; “silence people” is a natural causative.
- source_word: וַתִּלְעַג
  chosen: when you mock
  alternatives:
  - and you mock
  - when you deride
  - when you scoff
  lexicon: HALOT
  rationale: The verb לעג means to mock or deride. Although formally waw + imperfect, in this poetic rhetorical sequence 'when you mock' gives natural English and links the second clause conditionally to the first.
- source_word: מַכְלִם
  chosen: shame you
  alternatives:
  - humiliate you
  - put you to shame
  - rebuke you
  lexicon: HALOT
  rationale: Hiphil participle of כלם denotes causing shame or disgrace. 'Shame you' is concise and preserves the interpersonal force better than the more interpretive 'rebuke you.'
