  text: And he departed in haste and returned to Antioch, and he found Philip in control of the city, and he fought against him and took the city by force.
translation:
  language: ko
  text: 그는 급히 떠나 안티오키아로 돌아갔습니다. 그곳에서 빌립이 그 도시를 장악하고 있는 것을 발견하고, 그와 싸워 무력으로 그 도시를 차지했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σπουδὴν
  english_pob_choice: in haste
  chosen_korean: 급히
  alternatives_korean:
  - 서둘러
  - 급박하게
  lexicon: LSJ
  rationale: 속도와 긴급함을 나타내는 관용구이므로, 자연스러운 현대 한국어로는 '급히'가 가장 간결하고 본문의 긴박감을 잘 살립니다.
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  english_pob_choice: returned to Antioch
  chosen_korean: 안티오키아로 돌아갔습니다
  alternatives_korean:
  - 안티오키아로 되돌아갔습니다
  - 안티오키아로 돌아왔습니다
  lexicon: LSJ
  rationale: ἀποστρέφω + εἰς는 이전 목적지로의 복귀를 나타내므로, '돌아갔습니다'가 가장 자연스럽고 방향성을 정확히 반영합니다.
- source_word: κυριεύοντα τῆς πόλεως
  english_pob_choice: in control of the city
  chosen_korean: 도시를 장악하고 있는
  alternatives_korean:
  - 도시를 다스리고 있는
  - 도시의 주권을 쥐고 있는
  lexicon: LSJ
  rationale: κυριεύω는 지배·통제의 의미를 가지며, 여기서는 왕권보다 현실적 장악 상태를 가리키므로 '장악하고 있는'이 의미를 과장하지 않습니다.
- source_word: κατελάβετο τὴν πόλιν βίᾳ
  english_pob_choice: took the city by force
  chosen_korean: 무력으로 그 도시를 차지했습니다
  alternatives_korean:
  - 무력으로 그 도시를 점령했습니다
  - 힘으로 그 도시를 빼앗았습니다
  lexicon: LSJ
  rationale: καταλαμβάνω는 여기서 점유·획득의 결과를 나타내고, βίᾳ는 수단의 폭력성을 밝히므로 '무력으로 차지했습니다'가 결과와 방법을 함께 드러냅니다.
