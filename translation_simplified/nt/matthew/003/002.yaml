translation:
  language: en
  text: and said, “Reorient toward God[r1],[a] because the kingdom of heaven has come near.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally translated “Repent.” The Greek calls for a fundamental change in how you think, not merely feeling guilty or apologizing. In this context, that change should result in a changed life.
    reason: simplification_note
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: and saying
  simplified_phrase: and said
  preserved_meaning: John continued the preceding narrative by speaking these words.
  reasoning_layer_used: POB lexical decision for καὶ λέγων
  rationale: A finite past-tense verb gives natural English narrative flow.
- pob_phrase: for the kingdom of heaven has drawn near
  simplified_phrase: because the kingdom of heaven has come near
  preserved_meaning: The kingdom has approached and remains near, providing the reason for the command.
  reasoning_layer_used: POB lexical and theological decisions for γὰρ, ἤγγικεν, and βασιλεία τῶν οὐρανῶν
  rationale: “Because” clarifies the logic, while “has come near” naturally preserves the perfect force.
interpretive_expansions:
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
