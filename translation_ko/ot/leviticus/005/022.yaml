id: LEV.5.22
reference: Leviticus 5:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֽוֹ מָצָ֧א אֲבֵדָ֛ה וְ/כִ֥חֶשׁ בָּ֖/הּ וְ/נִשְׁבַּ֣ע עַל שָׁ֑קֶר עַל אַחַ֗ת מִ/כֹּ֛ל אֲשֶׁר יַעֲשֶׂ֥ה הָ/אָדָ֖ם לַ/חֲטֹ֥א בָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/022.yaml
  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: ko
  text: 또는 사람이 잃어버린 물건을 발견하고 그것에 관하여 거짓말하며 거짓으로 맹세하여, 사람이 행함으로 죄를 짓는 모든 일 가운데 어느 하나에 관하여—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֽוֹ מָצָ֧א אֲבֵדָ֛ה
  english_pob_choice: or he finds lost property
  chosen_korean: 또는 사람이 잃어버린 것을 주워 놓고
  alternatives_korean:
  - 또는 잃어버린 물건을 발견하고
  - 또는 분실물을 찾아내고
  lexicon: מָצָא / אֲבֵדָה
  rationale: אֲבֵדָה는 단순한 ‘분실물’보다 ‘잃어버린 것/물건’을 뜻하므로, 자연스러운 현대어로 옮기되 맥락상 ‘주워 놓고’로 이어져 뒤의 ‘숨기다’와 연결되게 했습니다.
- source_word: וְ/כִחֶשׁ בָּ֖/הּ
  english_pob_choice: and lies about it
  chosen_korean: 그것을 숨기며
  alternatives_korean:
  - 그것을 속이며
  - 그것을 부인하며
  lexicon: כחש
  rationale: כחש는 단순 진술 오류가 아니라 사실을 감추거나 부인하는 행위를 포함하므로, POB의 ‘lies about it’을 한국어로는 상황을 드러내는 ‘숨기며’로 처리했습니다.
- source_word: וְ/נִשְׁבַּ֣ע עַל שָׁ֑קֶר
  english_pob_choice: and swears falsely
  chosen_korean: 거짓으로 맹세하여
  alternatives_korean:
  - 거짓 맹세하며
  - 거짓 증언으로 맹세하여
  lexicon: נשבע על שקר
  rationale: 맹세의 거짓됨을 직접 드러내기 위해 ‘거짓으로 맹세하여’로 옮겼습니다. ‘거짓 맹세’도 가능하지만, 동사 구조를 살려 문장 흐름을 유지했습니다.
- source_word: הָ/אָדָ֖ם
  english_pob_choice: a man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 사람이
  - 인간이
  lexicon: אדם
  rationale: 이곳의 הָאָדָם은 특정 성별보다 일반적 인간을 가리키는 법문맥의 총칭이므로, POB의 ‘a man’을 한국어에서는 현대 독자가 포괄적으로 이해하는 ‘사람이’로 옮겼습니다.
theological_decisions:
- issue: 법조항의 총괄 종결 표현
  chosen_reading: ‘사람이 죄를 짓게 만드는 이 모든 일들 가운데 어느 하나’로 옮겨, 개인적 도덕 위반이 아니라 규정된 여러 위반 유형의 총칭임을 살렸습니다.
  alternative_readings:
  - ‘이 모든 일 중 하나’
  - ‘이 모든 것 가운데 하나’
  rationale: 히브리어 אַחַת מִכֹּל אֲשֶׁר יַעֲשֶׂה... לַחֲטֹא בָהֵנָּה는 목록 전체를 묶는 포괄적 법문 구조이므로, 한국어에서도 범주적 의미가 드러나도록 했습니다.
  doctrine_reference: 레위기 5:22의 속죄 규정 문맥
- issue: 죄를 짓게 하는 행위의 범위
  chosen_reading: ‘죄를 짓게 만드는’으로 번역해, 행위 자체가 죄의 결과를 낳는다는 법문맥을 유지했습니다.
  alternative_readings:
  - ‘죄를 범하는’
  - ‘죄를 짓는’
  rationale: 원문은 단순한 행위 나열이 아니라 그 행위들을 통해 죄에 이르게 되는 구조를 보여 주므로, 결과성을 드러내는 표현이 더 적합합니다.
  doctrine_reference: 율법의 범죄 규정
