    issue: ‘들어 보십시오’
    rationale: שְׁמָעֶנָּה는 단순한 명령 ‘그것을 들으라’이며, ‘-어 보다’는 시도·권유의 부가 뉘앙스를 낳습니다.
  - severity: low
    issue: ‘알아 두십시오’
    rationale: דַע는 직접적인 ‘알라’입니다. ‘알아 두다’는 장래를 위한 기억·유지의 의미를 더할 수 있습니다.
  - severity: low
    issue: ‘그리고 당신은’
    rationale: 원문의 접속과 2인칭 강조를 살리려는 장점은 있으나, 현대 표준 한국어에서는 ‘그대도’가 더 자연스럽고 직접 호칭 ‘당신’의 불필요한 어감을 피합니다.
  revised_text: 보십시오, 우리가 이것을 탐구해 보았으니 참으로 그렇습니다. 그것을 들으십시오. 그대도 스스로 아십시오.
