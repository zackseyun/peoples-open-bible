translation:
  text: These and all the others with them took wives, each choosing one for himself.[a]
    They began having sexual relations with them and joined themselves to them.[b]
    They taught them charms, incantations, and root-cutting, and introduced them to
    plants.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening “these” is parenthesized in Charles 1906; the conjunction before
      “took” is bracketed. The wives and choosing are retained without a claimed change
      in the actors.
    reason: textual_variant
  - marker: b
    text: The printed joining verb is starred. Charles notes that it may be corrupt
      and discusses a Greek comparison meaning “become defiled.” The main text retains
      the supplied Geʿez joining reading rather than silently importing that comparison.
    reason: textual_variant
  - marker: c
    text: Charles 1906 marks the incantation wording with a star and discusses manuscript
      variants; his apparatus explains the final tree word here as plants or shrubs.
      These items are not silently reduced to a generic teaching statement.
    reason: textual_variant
