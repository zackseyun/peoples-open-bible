id: PSA.78.25
reference: Psalms 78:25
source:
  edition: WLC
  text: לֶ֣חֶם אַ֭בִּירִים אָ֣כַל אִ֑ישׁ צֵידָ֬ה שָׁלַ֖ח לָ/הֶ֣ם לָ/שֹֽׂבַע׃
translation:
  text: People ate the bread of angels[a]; he sent them enough food to satisfy them.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, 'the finest bread'; literally, 'bread of mighty ones.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֶחֶם
  chosen: bread
  alternatives:
  - food
  lexicon: HALOT
  rationale: The basic sense is 'bread,' and in this poetic context it works naturally in English while preserving the concrete imagery. 'Food' is possible but less vivid and less formally aligned with the Hebrew.
- source_word: אַבִּירִים
  chosen: the mighty
  alternatives:
  - angels
  - mighty ones
  - nobles
  lexicon: HALOT
  rationale: The noun commonly denotes strong or mighty ones. In Psalm 78:25 it has traditionally been rendered 'angels' under the influence of ancient interpretation and the manna context, but the Hebrew itself more directly means 'mighty ones.' To preserve original-language primacy, the main text keeps the more literal sense, while the traditional interpretive rendering is preserved in a footnote.
- source_word: אָכַל
  chosen: ate
  alternatives:
  - has eaten
  lexicon: HALOT
  rationale: The qatal form here is best rendered as a simple past in English narrative-poetic style.
- source_word: אִישׁ
  chosen: People
  alternatives:
  - each man
  - people
  - humanity
  lexicon: HALOT
  rationale: Natural collective rendering of the generic human noun.
- source_word: צֵידָה
  chosen: food
  alternatives:
  - food
  - provision
  - victuals
  lexicon: HALOT
  rationale: Contextually natural expression for supplied edible provisions.
- source_word: שָׁלַח
  chosen: sent
  alternatives:
  - dispatched
  - gave
  lexicon: HALOT
  rationale: The verb straightforwardly means 'sent.' 'Gave' would be interpretive and less precise.
- source_word: לָהֶם
  chosen: them
  alternatives:
  - to them
  lexicon: HALOT
  rationale: The indirect object is naturally expressed in English as 'them' after 'sent,' though 'to them' would also be acceptable.
- source_word: לָשֹׂבַע
  chosen: until they were satisfied
  alternatives:
  - in abundance
  - to satisfaction
  - until satisfied
  lexicon: HALOT
  rationale: Expresses provision to satiety in ordinary English.
