  text: Οἱ δὲ κατὰ τὴν πόλιν Ἕλληνες οὐδὲν ἠδικημένοι, ταραχὴν ἀπροσδόκητον περὶ τοὺς ἄνδρας θεωροῦντες καὶ συνδρομὰς ἀπροκόπους γινομένας, βοηθεῖν μὲν οὐκ ἔσθενον· παρακλῆσιν γὰρ ἡ διάθεσις παρεκάλουν· οἱ δὲ καὶ συνδρόμως εἶχον, καὶ μεταπεσεῖσθαι ταῦτα ὑπελάμβανον.
