  chosen_reading: Rendered as 'at the time of your presence'
  alternative_readings:
  - at the time of your appearing
  rationale: This preserves the Hebrew sense of divine manifestation without over-specifying a technical eschatological 'appearing.' The verse speaks of the king's enemies being judged in connection with God's manifest presence.
  doctrine_reference: Translation philosophy §3
- issue: Divine name rendering
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
