translation:
  text: 'IX.1. Listen to me, children. I reared you in great simplicity, innocence and dignity. I did
    this through the mercy of the Lord, who caused righteousness to drip upon you[a]. He did this so that
    you might be made righteous and holy, free from all wickedness and crookedness[b]. But you do not
    want to leave your wickedness.


    IX.2. Now listen to me. Be at peace among yourselves. Look after and support one another. Do not enjoy
    an overflow of God’s created things all by yourselves. Share also with those in need[c].


    IX.3. Some people weaken and ruin their flesh by eating so much food. Others have no food. Their flesh
    wastes away because they do not have enough to eat, and their body is destroyed.


    IX.4. This imbalance harms you who have enough but do not share with those in need.


    IX.5. Look to the judgment that is coming. You who are well-off, seek out the hungry while the tower
    is still unfinished. After the tower is finished, you will want to do good, but you will have no place
    to do it.


    IX.6. You who take pride in your wealth, watch out. Those in need may groan, and their groaning may
    go up to the Lord. Then you may be shut out with your goods [which you cannot keep], outside the door
    of the tower[d].


    IX.7. Now I speak to you who lead the church and to those who occupy the first seats. Do not become
    like poisoners. Poisoners carry their drugs in boxes. But you carry your drug and your poison in your
    heart[e].


    IX.8. You are encrusted. You do not want to cleanse your hearts or bring your understanding together
    as one in a pure heart. Do this so that you may receive mercy from the great King[f].


    IX.9. Watch out, children. These divisions of yours may deprive you of life.


    IX.10. How can you want to teach the Lord’s chosen ones when you yourselves have not been taught?
    Teach one another and be at peace among them. Then I too may stand joyfully before the Father and
    give an account for all of you to your Lord[g].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Guilelessness can also be innocence, and dignity can be modesty or reverence. The dripping image
      translates staxantos. Sinaiticus17.1 first-hand has a different, difficult spelling/wording; S1/ca
      corrections approach the dripping reading. Palatina51has the Lord who dripped his righteousness;
      Vulgata25has mercy of God which dripped in righteousness. The working Greek wording is retained.
  - marker: b
    reason: textual_variant
    text: Made righteous may also be justified; no exclusively forensic or impartation theory is inserted.
      Lake1907PlateIIIline43Athos lacks and made holy; Sinaiticus17.1 and both Latin versions include
      both verbs (Vulgata reverses their order). Working paenai is printed on311 and reflected in Sinaiticus17.1
      correction, not an OCR error to modernize silently; Athos transcription has pausai. Palatina51instead
      commands depart from your wickedness where working/Sinaiticus/Vulgata say you do not wish to depart.
  - marker: c
    reason: lexical_alternative
    text: Overflow of abundance preserves ek katachymatos, not a separate instruction to give only surplus.
      Vulgata25connects abundantius with sharing, while Palatina51has receiving endlessly; their different
      syntax is not imported into the Greek. IX.3working weakness differs from AthosPlateIIIline45abundance,
      while Sinaiticus17.3 and both Latin versions have weakness. IX.4imbalance renders asynkrasia; the
      contrast condemns having without sharing, not hunger itself.
  - marker: d
    reason: textual_variant
    text: 'Which you cannot keep renders the bracketed ascheton as goods that cannot be retained; the
      older useless gloss is archived, not treated as manuscript evidence. The bracket belongs to the
      working1891 edition: it is not punctuation in an ancient manuscript. Sinaiticus17.6 and Vulgata26have
      your goods without that adjective; Palatina53has all your riches. AthosPlateIIIline50has adelphon
      before goods, a different difficult reading. The bracketed working wording remains disclosed rather
      than harmonized to those witnesses.'
  - marker: e
    reason: lexical_alternative
    text: Those who occupy the first seats translates protokathedritais without adding loves or seeks
      to the Greek body. Both Latin versions paraphrase loving the first seats. Pharmakoi may mean sorcerers,
      but drugs in boxes and poison in the heart support poisoners here. The metaphor is retained without
      identifying any present-day leaders.
  - marker: f
    reason: textual_variant
    text: Encrusted retains the difficult eneskiromenoi, also in Sinaiticus17.8; hardened is an alternative.
      AthosPlateIIIline52has eskirommenoi. Sinaiticus first-hand lacks synkerasai hymon (bring together
      your); ca adds it. Vulgata26and Palatina53retain the blending/unity instruction without the working
      encrusted opening. The purpose clause seeking mercy from the great King is explicit.
  - marker: g
    reason: textual_variant
    text: The working IX.10prints en autois, literally among them, as does Sinaiticus17.10; AthosPlateIIIline55has
      en heautois, among yourselves, and both Latin versions give a reciprocal/in-yourselves sense. Among
      themselves/yourselves is also a possible contextual understanding of the working pronoun. We retain
      among them with this ambiguity disclosed. Sinaiticus first-hand has on behalf of us and our Lord
      at the close; ca changes the first us to you. Working and Palatina53have all of you/your Lord; Vulgata26has
      your Father and no joyful adjective. No words from IX remain in reader018.
