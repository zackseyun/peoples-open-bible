theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: Follows the project's stated default for the Tetragrammaton, preserving reverential convention and broad Christian readability.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Nuance of fear language in the final cola
  chosen_reading: fear/dread rather than reverential awe
  alternative_readings:
  - awe
  - reverence
  rationale: Although ירא can include reverence, the immediate parallel with פחד and the context of humbled nations support a primary sense of dread-filled fear before God's power.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: preserve theological tension rather than resolve it'
