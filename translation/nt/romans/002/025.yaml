id: ROM.2.25
reference: Romans 2:25
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
translation:
  text: For circumcision has value if you obey the law; but if you are a transgressor of the law, your circumcision now counts as uncircumcision[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “your circumcision has become uncircumcision.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιτομὴ
  chosen: Circumcision
  alternatives:
  - the circumcision
  lexicon: BDAG
  rationale: Rendered with the abstract noun 'Circumcision' rather than a paraphrase, preserving Paul's covenantal category and the parallel with ἀκροβυστία.
- source_word: μὲν γὰρ
  chosen: indeed
  alternatives:
  - for indeed
  - certainly
  rationale: The combination marks an affirming setup to the contrast that follows. 'Indeed' preserves the discourse force without overloading the English with multiple particles.
- source_word: ὠφελεῖ
  chosen: is beneficial
  alternatives:
  - profits
  - is of value
  lexicon: BDAG
  rationale: This expresses real benefit or usefulness. 'Is beneficial' is clear modern English and avoids the slightly archaic 'profits' while preserving the claim of conditional value.
- source_word: ἐὰν νόμον πράσσῃς
  chosen: if you practice the law
  alternatives:
  - if you keep the law
  - if you do the law
  lexicon: BDAG
  rationale: πράσσω is more literally 'do/practice' than the more idiomatic but slightly interpretive 'keep.' 'Practice the law' preserves the verbal nuance while remaining readable.
- source_word: παραβάτης νόμου
  chosen: a transgressor of the law
  alternatives:
  - a lawbreaker
  - one who breaks the law
  lexicon: BDAG
  rationale: This keeps the formal forensic/covenantal sense of παράβατης and preserves the explicit relation to νόμος. 'Lawbreaker' is possible but slightly more compressed and less transparent to the Greek structure.
- source_word: ἡ περιτομή σου
  chosen: your circumcision
  lexicon: BDAG
  rationale: A straightforward possessive rendering that preserves Paul's direct address and rhetorical force.
- source_word: ἀκροβυστία
  chosen: uncircumcision
  alternatives:
  - foreskin
  lexicon: BDAG
  rationale: Although the term can denote foreskin literally, here it functions as the covenantal opposite of circumcision. 'Uncircumcision' best preserves the theological contrast in context.
- source_word: γέγονεν
  chosen: has become
  alternatives:
  - has turned into
  - has become as
  lexicon: BDAG
  rationale: The perfect tense indicates a resulting state. 'Has become' preserves both the transformation idea and the present resultant force.
