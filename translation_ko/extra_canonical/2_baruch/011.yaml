  rationale: 본문의 대조 대상 도시명을 현대 표기 기준에 맞춰 옮기되, 서사적 지시성을 유지하기 위해 통용 가능한 음역형을 사용했습니다.
- source_word: ܐܬܬܥܝܪܘ ܘܐܣܗܕܘ ܚܝ̈ܝܟܘܢ ܠܡܘܡܬܐ
  english_pob_choice: spoke also against you / complained
