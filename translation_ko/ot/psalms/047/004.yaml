- from: 그가 만민을 우리 아래에, 여러 민족을 우리 발 아래에 굴복시키십니다.[a]
  to: 그분은 우리를 위하여 우리의 유산, 곧 그가 사랑하시는 야곱의 자랑을 택하십니다.[a][b] 셀라.[c]
  rationale: 원문과 다른 절을 번역한 구조적 오류를 바로잡기 위해 본문을 시편 47:4의 히브리어에 따라 전면 교체했습니다. 하나님의 주어는 히브리어 동사에 내포되어 있으므로 한국어에서 ‘그분’으로 명시했습니다. 불완료형의 현재적/일반적 뉘앙스는 본문에서 ‘택하십니다’로 옮기고, 미래적 가능성과 ‘영광’이라는 어휘 대안은 각주에 남겼습니다. 관계절이 야곱 또는 유산/땅을 수식할 수 있는 해석상 여지는 단정하지 않고 각주로 보존했습니다.
