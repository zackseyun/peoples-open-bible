id: JOB.32.19
reference: Job 32:19
source:
  edition: WLC
  text: הִנֵּֽה בִטְנִ֗/י כְּ/יַ֥יִן לֹא יִפָּתֵ֑חַ כְּ/אֹב֥וֹת חֲ֝דָשִׁ֗ים יִבָּקֵֽעַ־־׃
translation:
  text: Look, my belly is like wine in a sealed wineskin[a]; like new wineskins[b], it is about to burst.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “wine that is not opened.”
    reason: lexical_alternative
  - marker: b
    text: Fermenting wine produces gas that can burst even a new wineskin.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  chosen: Look
  alternatives:
  - Behold
  - See
  lexicon: HALOT
  rationale: Discourse particle drawing attention to Elihu's vivid comparison. 'Look' is natural modern English while preserving the deictic force.
- source_word: בִטְנִי
  chosen: my belly
  alternatives:
  - my inward parts
  - my stomach
  lexicon: HALOT
  rationale: בטן literally denotes the belly/womb and can refer to the inner self or inward pressure. Here the image is physical and metaphorical at once; 'my belly' preserves the concrete Hebrew imagery better than the more interpretive 'my heart' or 'my spirit'.
- source_word: כְּיַיִן
  chosen: like wine
  alternatives:
  - like fermenting wine
  lexicon: HALOT
  rationale: Simple comparison marker plus 'wine.' The context suggests wine under pressure, but the Hebrew does not explicitly add 'fermenting,' so the main text stays closer to the source.
- source_word: לֹא יִפָּתֵחַ
  chosen: unopened
  alternatives:
  - that is not opened
  - that cannot be opened
  lexicon: HALOT
