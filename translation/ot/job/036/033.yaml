id: JOB.36.33
reference: Job 36:33
source:
  edition: WLC
  text: יַגִּ֣יד עָלָ֣י/ו רֵע֑/וֹ מִ֝קְנֶ֗ה אַ֣ף עַל עוֹלֶֽה־׃
translation:
  text: His thunder declares his coming[a]; the cattle also signal the approaching storm[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, “Its thunder announces it,” referring to the storm; the Hebrew more literally says, “His noise declares concerning him,” with uncertain pronoun referents.
    reason: alternative_reading
  - marker: b
    text: Literally, “the cattle also, concerning what is rising”; the verb is supplied from the first line, and the rising thing is not named.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַגִּיד
  chosen: declares
  alternatives:
  - tells
  - announces
  - proclaims
  lexicon: HALOT
  rationale: Hiphil of נגד commonly means 'declare, announce, make known.' 'Declares' preserves the elevated tone and fits the poetic context better than the more colloquial 'tells.'
- source_word: עָלָיו
  chosen: his coming
  alternatives:
  - about him
  - against him
  lexicon: HALOT
  rationale: With a verb of announcing, the phrase can idiomatically signify giving notice of someone’s approach; the more literal and uncertain wording is retained in the note.
- source_word: רֵעוֹ
  chosen: His thunder
  alternatives:
  - his friend
  - his noise
  - its sound
  lexicon: HALOT
  rationale: Uses the masculine singular suffix and a contextual storm sense, while the note preserves “noise/crashing” and the possible reading “his friend.”
- source_word: מִקְנֶה
  chosen: the cattle
  alternatives:
  - livestock
  - possession
  lexicon: HALOT
  rationale: The noun most commonly denotes cattle/livestock. Although it can more broadly refer to possessions, the animal sense is preferable here, especially in a weather context where animals are portrayed as sensing an approaching storm.
- source_word: אַף
  chosen: also
  alternatives:
  - even
  - indeed
  lexicon: HALOT
  rationale: The particle adds emphasis or extension. 'Also' fits the line's parallel development naturally in English.
- source_word: עַל
  chosen: concerning
  alternatives:
  - about
  - against
  - at
  lexicon: HALOT
  rationale: As with the earlier על, a neutral 'concerning/about' best preserves the ambiguity of the Hebrew in this difficult verse.
- source_word: עוֹלֶה
  chosen: what is rising
  alternatives:
  - the one who rises
  - the storm rising
  - ascending vapor
  lexicon: HALOT
  rationale: The Qal participle of עלה means 'going up, rising, ascending.' Because the object is not explicit, 'what is rising' preserves the Hebrew's open-endedness. In context this likely refers to the storm-cloud or rising tempest, but the translation avoids specifying more than the text states.
- source_word: מִקְנֶה אַף עַל עוֹלֶה
  chosen: the cattle also announce what is rising
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Supplies the verbal ellipsis for grammatical English while leaving the unidentified rising phenomenon unspecified.
