  from: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
  to: Your territory will extend from the wilderness and Lebanon as far as the great river, the Euphrates, including all the land of the Hittites, and as far as the Mediterranean Sea[a] to the west.
