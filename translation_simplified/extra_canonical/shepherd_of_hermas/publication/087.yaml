    ἄσβεστον καὶ ὄστρακον λεπτόν, ἵνα τοὺς τύπους τῶν λίθων τῶν ἠρμένων καὶ εἰς τὴν οἰκοδομὴν βεβλημένων
    ἀναπληρώσω· δεῖ γὰρ τοῦ πύργου τὰ κύκλῳ πάντα ὁμαλὰ γενέσθαι. 2. καὶ ἐποίησα καθὼς ἐκέλευσε, καὶ ἤνεγκα
    πρὸς αὐτόν. Ὑπηρέτει μοι, φησί, καὶ ἐγγὺς τὸ ἔργον τελεσθήσεται. ἐπλήρωσε οὖν τοὺς τύπους τῶν λίθων
    τῶν εἰς τὴν οἰκοδομὴν ἀπεληλυθότων, καὶ ἐκέλευσε σαρωθῆναι τὰ κύκλῳ τοῦ πύργου καὶ καθαρὰ γενέσθαι.
    3. αἱ δὲ παρθένοι λαβοῦσαι σάρους ἐσάρωσαν, καὶ πάντα τὰ κόπρια ἦραν ἐκ τοῦ πύργου, καὶ ἔρραναν ὕδωρ,
    καὶ ἐγένετο ὁ τόπος ἱλαρὸς καὶ εὐπρεπέστατος τῷ πύργῳ. 4. λέγει μοι ὁ ποιμήν· Πάντα, φησί, κεκαθάρισται·
    ἐὰν ἔλθῃ ὁ κύριος ἐπισκέψασθαι τὸν πύργον, οὐκ ἔχει ἡμῖν οὐδὲν μέμψασθαι. ταῦτα εἰπὼν ἤθελεν ὑπάγειν.
    5. ἐγὼ δὲ ἐπελαβόμην αὐτοῦ τῆς πήρας καὶ ἠρξάμην αὐτὸν ὁρκίζειν κατὰ τοῦ Κυρίου ἵνα [πάντα] μοι ἐπιλύσῃ
    ἃ ἔδειξέ μοι. λέγει μοι· Μικρὸν ἔχω ἀκαιρεθῆναι, καὶ πάντα σοι ἐπιλύσω· ἔκδεξαί με ὧδε ἕως ἔρχομαι.
    6. λέγω αὐτῷ· Κύριε, μόνος ὢν ὧδε ἐγὼ τί ποιήσω; Οὐκ εἶ, φησί, μόνος· αἱ γὰρ παρθένοι αὗται μετὰ σοῦ
    εἰσί. Παράδος οὖν, φημί, αὐταῖς με. προσκαλεῖται αὐτὰς ὁ ποιμὴν καὶ λέγει αὐταῖς· Παρατίθεμαι ὑμῖν
    τοῦτον ἕως ἔρχομαι· καὶ ἀπῆλθεν. 7. ἐγὼ δὲ ἤμην μόνος μετὰ τῶν παρθένων· ἦσαν δὲ ἱλαρώτεραι, καὶ πρὸς
    ἐμὲ εὖ εἶχον· μάλιστα δὲ αἱ τέσσαρες αἱ ἐνδοξότεραι αὐτῶν.
