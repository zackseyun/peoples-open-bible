translation:
  text: It puts king and orphan, servant[a] and free, poor and rich in the same state of mind.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Greek term refers to a household slave, here contrasted with a free person.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  chosen: makes
  alternatives:
  - renders
  - causes to be
  lexicon: LSJ
  rationale: A straightforward present-tense verb of causing or making. 'Makes' preserves the simple force without over-interpreting.
- source_word: τὴν διάνοιαν μίαν
  chosen: the mind ... one
  alternatives:
  - one mind
  - the understanding the same
  - the thinking one
  lexicon: LSJ
  rationale: διάνοια refers to mind, thought, or disposition. The construction with μίαν emphasizes making differing persons alike in mental state. English idiom is smoothed slightly while preserving the predicate idea of oneness.
- source_word: βασιλέως
  chosen: king
  alternatives:
  - ruler
  lexicon: LSJ
  rationale: The ordinary sense is 'king'; no contextual reason to generalize to 'ruler'.
- source_word: ὀρφανοῦ
  chosen: orphan
  alternatives:
  - fatherless one
  lexicon: LSJ
  rationale: ὀρφανός commonly means orphan or fatherless child. 'Orphan' is the most natural modern English rendering, even though the contrast is social-status based.
- source_word: οἰκέτου
  chosen: slave
  alternatives:
  - servant
  - household servant
  lexicon: LSJ
  rationale: Although οἰκέτης can denote a household servant/slave, the social-status contrast with ἐλευθέρου favors 'slave' here. This aligns with the project's guidance to use 'slave' where bonded status is salient.
- source_word: ἐλευθέρου
  chosen: free
  alternatives:
  - free person
  - freeman
  lexicon: LSJ
  rationale: The adjective denotes one who is free in contrast to enslavement. 'Free' is concise and preserves the paired contrast with 'slave'.
- source_word: πένητος
  chosen: poor
  alternatives:
  - needy
  - pauper
  lexicon: LSJ
  rationale: The term denotes a poor or needy person. 'Poor' is the most natural and broad English equivalent in this status-pairing.
- source_word: πλουσίου
  chosen: rich
  alternatives:
  - wealthy
  lexicon: LSJ
  rationale: The ordinary antonym to 'poor' in this rhetorical sequence is 'rich'; it preserves the concise parallelism.
