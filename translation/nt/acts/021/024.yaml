  from: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
  to: Take these men with you, undergo ritual purification with them, and pay their expenses so that they can shave their heads[a]. Then everyone will know that the reports about you are unfounded and that you yourself also live in obedience to the law.
