  source_fidelity: 첫 세 절의 기본 의미는 대체로 원문에 충실합니다. 다만 יָמִים רַבִּים는 ‘여러 날’보다 기간의 길이를 나타내는 ‘오랫동안’이 적절합니다. 끝의 וְגַם אֲנִי אֵלָיִךְ는 동사가 생략된 채 관계의 방향을 남겨 둔 표현이므로, ‘너를 향할 것입니다’보다 ‘너를 향해 있을 것입니다’가 한국어에서 더 자연스럽게 그 방향성과 의도적인 미완결성을 보존합니다.
  naturalness: ‘여러 날 동안’은 현대 한국어에서 ‘several days’로도 쉽게 들려 원문의 ‘many days/long time’보다 약합니다. 또한 ‘나도 또한 너를 향할 것입니다’는 한국어에서 다소 부자연스럽고 물리적으로 몸을 돌리는 뜻으로 읽힐 수 있습니다. 수정문은 합쇼체를 유지하면서도 자연스럽습니다.
  terminology: ‘음행하다’는 זנה의 성적 부정·매춘 행위를 포괄하는 전통적이며 격식 있는 표현으로 유지할 수 있습니다. ‘남자에게 속하다’는 לְאִישׁ의 귀속 관계를 결혼으로 한정하지 않고 반영합니다. 마지막 표현에는 원문에 없는 ‘충실하다’나 ‘속하다’를 보충하지 않았습니다.
