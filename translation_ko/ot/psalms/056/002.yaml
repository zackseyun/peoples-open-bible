translation:
  language: ko
  text: 나의 원수들이 온종일 나를 헐떡이며 뒤쫓습니다. 많은 이가 높은 곳에서[a] 나를 대적하여 싸웁니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지극히 높으신 이여’. 히브리어 마지막 말은 대적들이 ‘교만하게’ 싸운다는 뜻으로도 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָנֵּנִי
  english_pob_choice: Be gracious to me
  chosen_korean: 은혜를 베푸소서
  alternatives_korean:
  - 자비를 베푸소서
  - 은총을 내려주십시오
  - 호의를 베푸소서
  lexicon: HALOT
  rationale: פּiel 형태의 간구를 현대 합쇼체로 자연스럽게 살리면서, 단순한 감정적 용서보다 ‘은혜’의 청원을 드러냅니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 하나님
  alternatives_korean:
  - 오 하나님
  - 하나님이여
  lexicon: HALOT
  rationale: 기도문의 직접 호칭이므로 한국어에서는 호격을 과도하게 붙이지 않고 자연스러운 직접 부름으로 처리했습니다.
- source_word: שְׁאָפַנִי
  english_pob_choice: pants after me
  chosen_korean: 열심히 찾고
  alternatives_korean:
  - 저를 덮치고
  - 저를 몰아붙이고
  - 저를 삼키려 하고
  lexicon: HALOT
  rationale: 히브리어의 ‘헐떡이며 덮쳐 오다/갈망하며 추적하다’라는 비유를 직역보다 의미 중심으로 살려, 적대적 추적의 긴박함을 한국어에서 자연스럽게 표현했습니다.
- source_word: לֹחֵם יִלְחָצֵנִי
  english_pob_choice: fighting, he oppresses me
  chosen_korean: 싸우며 저를 압박합니다
  alternatives_korean:
  - 싸우며 저를 억압합니다
  - 전투적으로 저를 괴롭힙니다
  - 싸우며 저를 누릅니다
  lexicon: HALOT
  rationale: 분사 לֹחֵם의 지속적 적대 행동과 יִלְחָץ의 ‘압박하다/억누르다’는 뜻을 합쳐, 한 사람의 지속적인 공격성을 압축적으로 옮겼습니다.
theological_decisions:
- issue: 아들/인류 일반이 아닌 단수의 적대적 인간을 가리키는 אֱנוֹשׁ의 처리
  chosen_reading: 사람
  alternative_readings:
  - 한 인간
  - 한 필멸의 인간
  - 인류
  rationale: 시편 화자의 대적이 구체적 한 사람으로 그려지므로, 성별을 지우지 않으면서도 자연스러운 한국어인 ‘사람’을 사용했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
