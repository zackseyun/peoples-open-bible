  - marker: d
    text: Hebrew 'righteous altogether'; that is, completely righteous as a whole.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들은 금보다, 많은 순금보다도 더 탐나며[a], 꿀보다, 벌집에서 흐르는 꿀보다도 더 답니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금보다, 많은 순금보다도 더 탐낼 만하며’로 옮길 수 있습니다. 히브리어는 수동분사형을 사용하며, 뒤따르는 비교 구문이 ‘더’의 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 야훼를 경외하는 것
  alternatives_korean:
  - 야훼에 대한 두려움
  - 야훼를 두려워함
  lexicon: HALOT
  rationale: 지혜문학의 관용구를 살리면서도 단순 공포보다 경외와 신실한 태도를 함께 드러내기 위해 ‘경외하는 것’으로 옮겼습니다.
- source_word: טְהוֹרָה
  english_pob_choice: pure
  chosen_korean: 깨끗하며
  alternatives_korean:
  - 순수하며
  - 정결하며
  lexicon: HALOT
  rationale: 문맥상 윤리적·예배적 순결을 가리키므로 현대 한국어에서 자연스러운 ‘깨끗하다’로 옮기되, 주석으로 ‘pure/clean’의 여지를 남겼습니다.
- source_word: עוֹמֶדֶת לָעַד
  english_pob_choice: enduring forever
  chosen_korean: 영원히 서 있습니다
  alternatives_korean:
  - 영원히 지속됩니다
  - 영원히 존속합니다
  lexicon: HALOT
  rationale: 직역하면 ‘영원히 서 있다’이므로, 지속성과 안정성을 함께 살리는 한국어 표현으로 옮겼습니다.
- source_word: מִשְׁפְּטֵי יְהוָה
  english_pob_choice: the judgments of Yahweh
  chosen_korean: 야훼의 판단들
  alternatives_korean:
  - 야훼의 율례들
  - 야훼의 규례들
  - 야훼의 판결들
  lexicon: HALOT
  rationale: משׁפט의 재판적 의미를 보존하되, 한국어 ‘판단’이 하나님의 결정과 판결을 모두 포괄할 수 있어 본문 흐름에 맞게 선택했습니다.
- source_word: אֱמֶת
  english_pob_choice: 'true'
  chosen_korean: 참되며
  alternatives_korean:
  - 진실하며
  - 진리이며
  lexicon: HALOT
  rationale: 서술적 형용사로서 판단들의 성격을 자연스럽게 드러내는 ‘참되다’를 사용했습니다.
- source_word: צָדְקוּ יַחְדָּו
  english_pob_choice: they are altogether righteous
  chosen_korean: 모두가 의롭습니다
  alternatives_korean:
  - 완전히 의롭습니다
  - 함께 의롭습니다
  - 전체적으로 의롭습니다
  lexicon: HALOT
  rationale: יַחְדָּו의 전체성은 ‘모두가’로, צָדַק의 משפט적·윤리적 의미는 ‘의롭다’로 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 전통적 ‘여호와’ 대신 학술적 음역 ‘야훼’를 본문에 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본어휘에 따라 신명기적 본명성을 보존하는 쪽이 원문과 번역투명성에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
