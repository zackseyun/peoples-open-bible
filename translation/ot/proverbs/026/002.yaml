  category: meaning_retranslation
  from: Like a bird in its wandering, like a swallow in its flight, so an undeserved curse does not come.[a]
  to: Like a bird flitting about, like a swallow in flight, so an undeserved curse does not come to rest[a][b].
  rationale: I retain the audit's correction from “sparrow” to the generic “bird,” but restore the implied landing that makes the comparison meaningful in English. The earlier textual note misstated the traditional Hebrew reading and is corrected.
