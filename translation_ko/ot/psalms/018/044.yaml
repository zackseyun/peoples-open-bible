theological_decisions:
- issue: גּוֹיִם과 עַם의 번역 범주
  chosen_reading: 이 구절은 ‘민족들’과 ‘백성’을 정치·집단적 범주로 읽고, 후대의 종족-구원 구분을 미리 들여오지 않습니다.
  alternative_readings:
  - ‘이방인들’
  - ‘열방’
  rationale: 시편 18편의 문맥에서 왕권적 승리와 통치의 확장이 핵심이므로, 본문의 집단적·정치적 대비를 보존하는 번역이 가장 직접적입니다.
  doctrine_reference: '번역 원칙: 원문 우선, 본문이 말하는 범위를 넘어서 신학적 범주를 과잉 주입하지 않음.'
