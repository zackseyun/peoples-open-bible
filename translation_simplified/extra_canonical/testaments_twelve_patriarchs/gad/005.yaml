  rationale: The wording makes the moral exaggeration clear while preserving the contrast.
- pob_phrase: the righteous man, being humble, is ashamed to do what is unjust
  simplified_phrase: A righteous and humble person is ashamed to act unjustly
  preserved_meaning: Righteousness and humility create inward restraint against injustice.
  reasoning_layer_used: Lexical decision for αἰδεῖται and immediate context
  rationale: The recast sentence uses ordinary English without weakening moral shame.
- pob_phrase: by the very things through which a man transgresses, through those he is punished
  simplified_phrase: A person is punished through the very things by which he transgresses
  preserved_meaning: The means or bodily sphere of wrongdoing corresponds to the punishment.
  reasoning_layer_used: POB maxim and its application to Gad's liver
  rationale: Removing repeated wording makes the principle easier to follow.
