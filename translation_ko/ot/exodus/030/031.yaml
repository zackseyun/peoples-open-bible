  yaml_path: translation/ot/exodus/030/031.yaml
  text: And you shall speak to the sons of Israel, saying, ‘This shall be a holy anointing oil to me throughout your generations.’
translation:
  language: ko
  text: 그리고 이스라엘 자손에게 이렇게 말하십시오. ‘이것은 너희 대대로 나에게 거룩한 관유가 될 것입니다.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל
  english_pob_choice: And you shall speak to the sons of Israel
  chosen_korean: “이스라엘 자손에게 말하여라”
  alternatives_korean:
  - “이스라엘 자손에게 말하십시오”
  - “이스라엘의 아들들에게 말하여라”
  lexicon: בְּנֵי יִשְׂרָאֵל
  rationale: 출애굽기의 명령문 구조를 살려 직접 화법으로 옮겼고, בְּנֵי יִשְׂרָאֵל은 POB의 ‘sons of Israel’에 맞춰 관용적이면서도 원문 직결적인 ‘이스라엘 자손’을 택했습니다.
- source_word: שֶׁ֠מֶן מִשְׁחַת קֹ֨דֶשׁ
  english_pob_choice: a holy anointing oil
  chosen_korean: “거룩한 관유”
  alternatives_korean:
  - “거룩한 도유 기름”
  - “성별된 기름”
  lexicon: מִשְׁחַת קֹדֶשׁ
  rationale: מִשְׁחַת은 ‘anointing’의 결과물인 기름 자체를 가리키므로, 한국어 성경에서 널리 쓰이되 너무 교회 전통에 치우치지 않는 ‘관유’를 택해 מקור의 기능을 분명히 했습니다.
- source_word: לְ/דֹרֹתֵי/כֶם
  english_pob_choice: throughout your generations
  chosen_korean: “너희 대대로”
  alternatives_korean:
  - “너희 세대마다”
  - “너희 모든 세대에 걸쳐”
  lexicon: דֹּר
  rationale: 시간의 연속성과 언약적 전승을 간결하게 드러내는 표현으로, POB의 의미를 자연스럽게 반영하는 ‘너희 대대로’를 사용했습니다.
theological_decisions:
- issue: לִי의 방향성
  chosen_reading: ‘나에게’
  alternative_readings:
  - ‘나를 위하여’
  - ‘내 몫으로’
  rationale: POB의 최종 수정처럼 לִי는 목적보다는 소유·귀속의 뉘앙스가 강하므로, ‘to me’에 맞춰 ‘나에게’로 유지했습니다. 이는 성별된 기름이 야훼께 속한다는 점을 직접 드러냅니다.
  doctrine_reference: 성별/귀속의 언어
