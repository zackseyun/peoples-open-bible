  to: 그들이 흘러가 버리는 물처럼 사라지게 하시며[a], 그가 화살을 겨눌 때 그의 화살이 꺾인 것처럼 되게 하소서.[b][c]
  rationale: 제시된 원어 본문과 영어 POB 감사 기록을 우선하여, 잘못 들어간 58:6 번역과 관련 주석을 모두 58:7에 맞게 교체했습니다. יִתְהַלְּכוּ לָמוֹ의 소멸·유출 이미지는 ‘흘러가 버리는 물처럼 사라지게’로, יִדְרֹךְ חִצּוֹ의 궁술 관용구는 ‘화살을 겨눌 때’로 옮겼습니다. 마지막 난해 구절은 ‘꺾인 것처럼’으로 신중히 번역하고 대안 해석을 주석에 남겼습니다.
