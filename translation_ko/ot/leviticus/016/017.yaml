- from: 아무도 회막 안에 있지 못해야 합니다. 그가 지성소에서 속죄하려고 들어갈 때부터 나올 때까지 그러해야 합니다. 그가 자신과 자기 집안과 이스라엘 온 회중을 위해 속죄해야 합니다.[a]
  to: 그가 성소에서 속죄하려고 들어갈 때부터 나올 때까지, 아무도 회막 안에 있어서는 안 됩니다. 그는 자신과 자기 집안과 이스라엘의 온 회중을 위해 속죄해야 합니다.
