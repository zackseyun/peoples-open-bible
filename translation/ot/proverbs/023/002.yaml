  from: and put a knife to your throat if you are a man of appetite[a].
  to: and put a knife to your throat if you are given to appetite.[a]
  rationale: “A man of appetite” is awkward literalizing English. “Have a strong appetite” is more natural, but can describe an ordinary healthy appetite and somewhat weakens the בעל construction's sense of being governed by appetite. “Are given to appetite” is idiomatic English and retains that force without requiring “glutton.”
