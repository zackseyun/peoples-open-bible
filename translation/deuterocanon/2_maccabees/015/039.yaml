source:
  edition: lxx-swete-1909
  text: καὶ εἰ μὲν καλῶς, εὐθίκτως τῇ συντάξει, τοῦτο καὶ αὐτὸς ἤθελον· εἰ δὲ εὐτελῶς καὶ μετρίως, τοῦτο ἐφικτὸν ἦν μοι.
