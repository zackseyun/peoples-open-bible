- from: '1[v5]. 그리고 우리는 사라가 일곱째 달에 임신했다는 것을 아브라함에게 알렸습니다. 그리고 우리가 사라에게 돌아가 보니 그가 우리보다 먼저 임신했다는 것을 알게 되었습니다. 우리가 그에게 축복하고 그에게 명령한 모든 것을 그에게 고하였나니 그가 여섯 아들을 낳고 이삭을 보기 전에는 죽지 아니하고 이삭에게서 이름과 씨를 받을 수 있을 것이라 하였느니라

    2. 사라는 우리가 아브라함에게 이 말을 한 것을 듣고 웃었고 우리는 그를 꾸짖었습니다.

    3. 그리고 그녀는 그 말 때문에 웃었다는 사실을 두려워하며 부인했습니다. 그리고 우리는 그가 정한 대로 그 아들의 이름을 그에게 말하였습니다.

    4. 이삭아, 하늘 판에 기록되었느니라. 그리고 우리가 정해진 기한에 그에게 이르렀을 때, 그가 임신하여 아들을 낳았습니다.

    5[v9]. 이 달에 주님께서 소돔과 고모라와 소알과 요단강 온 지역에 형벌을 내리사 불과 유황으로 그들을 살라서 오늘까지 멸하셨으니 그들의 모든 행위대로 그들이 심히 불법하고 죄가 있었음이라

    6. 그들은 자기들을 더럽히고 육체로 음행하며 땅에 더러운 일을 행하였느니라. 그리하여 주님께서는 소돔을 심판하신 것과 같이 소돔의 부정함을 따라 행한 모든 곳에 심판을 집행하실 것이라.

    7. 그러나 롯은 구원하였으니 이는 하나님이 아브라함을 생각하사 그를 그 패역한 가운데서 인도하여 내셨음이라.

    8. 그와 그의 딸들도 땅에 없던 죄를 땅에서 행하였느니라

    9. 아담의 때부터 그 때까지 이는 사람이 그 딸들과 동침하였음이라. 보라, 그의 모든 씨에 대하여 하늘 판에 명령하고 기록하였으니 곧 그들을 제거하고 뽑아내어 소돔의 심판 같이 심판하여 심판 날에 그 사람의 후손을 땅에 남기지 아니하리라 하였느니라.

    10. 그리고 이 달에 아브라함은 헤브론에서 이사하여 갔다.

    11. 그는 그랄 산지 가데스와 술 사이에 살았습니다. 그리고 다섯째 달 중순에 그는 그곳을 떠나 맹세의 우물에 살았다.

    12. 여섯째 달 중순에 주님께서 사라를 방문하시니라

    13. 그리고 그 말씀대로 그 여자에게 행했습니다. 그가 잉태하여 아들을 낳은 것은 셋째 달 곧 그 달 중순이었는데, 그 때는 주님께서 아브라함에게 말씀하신 그 때 곧 추수의 첫 열매를 바치는 날에 이삭이 태어났다.

    14. 아브라함이 그 아들에게 여덟째 날에 할례를 행하니라 그가 먼저 할례를 받은 자니라

    15. 영원히 정한 언약이라 그리고 넷째 주 여섯째 해에 우리가 맹세의 우물에 있는 아브라함에게 이르렀습니다. 우리가 사라에게 말한 대로 그에게 나타났습니다. 우리가 그에게로 돌아오면 그가 아들을 낳을 것입니다.

    16. 일곱째 달에 우리가 돌아와서 사라가 우리보다 먼저 임신한 것을 보고, 그의 종을 돌아보시며 그의 말씀을 이루신 만세의 하나님 주님를 우리가 송축하였느니라.

    17. 그리고 우리는 그에게 축복하고, 그가 여섯 아들을 더 낳고, 죽기 전에 이삭의 아들들을 보기 전까지는 죽지 않을 것이라고, 그에 관해 정해진 모든 것을 그에게 말했습니다. 그러나 이삭 안에서는 그의 이름과 씨가 불릴 것입니다.

    18. 한 사람이 거룩한 씨가 되어 열방 가운데로 간주되지 아니할 것은 그가 지극히 높으신 이의 분깃이 될 것이며 그의 모든 씨가 다 하나님의 제비에 속하였음이라 그로 만민 중에서 주님의 기업의 백성이 되고 나라를 이루게 되리라

    19. 제사장과 거룩한 백성이니라 그가 자기 길을 가며 우리가 그에게 말한 모든 것을 인하여 기뻐하며 주님를 송축하였더라.

    20. 그는 자기를 구원하시고 그가 우거하는 땅에서 그를 기쁘게 하신 주님를 위하여 그곳에 제단을 쌓았습니다.

    21. 그리고 그는 이 달에 그가 맹세의 우물에 쌓은 제단 근처에서 칠일 동안 기쁨의 절기를 지켰습니다. 그리고 자기와 자기 종들을 위해 초막을 지었습니다.

    22. 이 절기에 그는 지상에서 초막절을 지키는 첫 번째 사람이 되었습니다. 이 칠일 동안에 그는 매일 소 두 마리와 숫양 두 마리와 양 일곱 마리와 속죄제물로 숫염소 한 마리를 제단에 주님께 드렸으며

    23. 자기와 자기 자손을 위하여 속죄하기 위하여 화목제물로는 수양 일곱 마리와 염소 일곱 마리와 양 일곱 마리와 어린 수컷 일곱 마리와 그 소제물과 전제물을 드릴 것이며 그리고 그 기름을 모두 제단에 태워 주님께 향기로운 냄새로 드렸습니다.

    24. 그는 아침저녁으로 향품을 태웠으니 곧 유향과 풍향과 스탁과 나드와 몰약과 코스투스와 육계 일곱이라. 그는 그것들을 모두 혼합하여 순수하게 바쳤습니다.

    25. 그는 칠 일 동안 이 절기를 지키며 자기와 자기 집에 있는 모든 사람이 마음을 다하고 뜻을 다하여 기뻐하였고 그와 함께 있는 사람은 외국인도 없고 할례받지 않은 사람도 없었다.

    26. 그리고 그는 자기 세대에 자기를 창조하신 창조주를 찬미하였으니 이는 하나님이 자기의 기쁘신 뜻으로 그를 창조하셨음이니라. 그는 그에게서 영원한 세대를 위한 의의 나무가 나오고 그에게서 거룩한 씨가 나와 만물을 만드신 분과 같이 되리라는 것을 알고 이해하였기 때문입니다.

    27. 그가 축복하고 기뻐하여 이 절기의 이름을 주님의 절기라 일컬었느니라

    28. 지극히 높으신 하나님이 받으실 만한 우리가 그와 그 뒤를 잇는 모든 자손이 땅의 대대에 영원히 축복하였으니 이는 그가 하늘의 판의 증거대로 그 절기를 제때에 지켰음이라.

    29. 그러므로 이스라엘을 위하여 하늘의 돌판에 정한 것은 일곱째 달에 칠일 동안 즐겁게 초막절을 지킬 것이라 정하였으니 이는 주님 앞에 받으실 만한 것이니라

    30. 해마다 대대로 지킬 영원한 규례니라 이 날에는 기한이 없나니 이는 이스라엘이 이를 기념하여 초막에 거하며 머리에 면류관을 씌우고 시내에서 무성한 가지와 버드나무를 취하는 것이 이스라엘에게 영원히 정한 일임이니라.

    31. 아브라함은 종려나무 가지와 아름다운 나무 열매를 가져다가 매일 일곱 번씩 그 가지를 가지고 제단 주위를 돌았습니다. 아침에 그는 모든 일에 대해 기쁨으로 그의 하나님께 찬양과 감사를 드렸습니다.'
  to: '1. 그녀는 아들을 잉태했습니다. 그리고 우리는 일곱째 달에 사라에게로 돌아가, 사라가 우리 앞에 임신한 상태로 있었음을 발견했습니다. 우리는 그를 축복했고, 그에게 명령된 모든 것을 그에게 말했습니다. 곧 그가 죽기 전에 여섯 아들을 낳고 그들을 보게 될 것이며, 이삭 안에서 그의 이름과 씨가 불리게 될 것이라는 것입니다.

    2. 사라는 우리가 아브라함과 이 말씀을 나누었다는 것을 듣고 웃었습니다. 그리고 우리는 사라를 꾸짖었습니다.

    3. 그녀는 두려워하여 그 말 때문에 자기가 웃었다는 것을 부인했습니다. 그리고 우리는 정해진 대로 그녀의 아들의 이름을 알려 주었습니다.

    4. 그리고 그의 이름, 이삭이 하늘의 서판들에 기록되어 있었습니다. 그리고 우리가 정해진 때에 그녀에게 돌아갔을 때, 그녀는 잉태하여 아들을 낳았습니다.

    5. 그녀는 아들을 잉태하였습니다. 이 달에 주께서는 소돔과 고모라와 돔과 요르단의 모든 지역에 심판을 집행하셨으며, 불과 유황으로 그들을 태우시고 오늘날까지 멸망시키셨습니다. 내가 이제 너희에게 그들의 모든 행위를 밝혀 알린 바와 같이, 그들은 지극히 사악하고 죄가 많았습니다.

    6. 그들은 자신들을 더럽히고 자기 육체로 음행하며 땅에서 부정을 저질렀습니다. 이와 같이 주님께서는 그들이 소돔의 부정에 따라 행한 그 곳들에 심판을 내리실 것이며, 소돔을 심판하신 것과 같이 하실 것입니다.

    7. 그러나 우리는 롯을 구해 냈습니다. 하나님께서 아브라함을 기억하시고 롯을 멸망의 한가운데서 이끌어 내셨기 때문입니다.

    8. 그가 그것을 뒤엎었습니다. 그리고 그와 그의 딸들도 땅 위에서 죄를 지었는데, 그것은 땅 위에 전례가 없었던 죄였습니다.

    9. 아담 시대부터 그때까지, 한 사람이 자기 딸들과 동침하였기 때문입니다. 보십시오, 하늘의 판들에는 그의 모든 씨에 관하여, 그들을 제거하고 뿌리 뽑고, 그들의 심판을 소돔의 심판처럼 집행하며, 정죄의 날에 그의 씨를 땅에 하나도 남기지 말라고 명령되고 결정되어 있었습니다.

    10. 그리고 그 달에 아브라함은 헤브론을 떠나 그랄 산지에서 가데스와 수르 사이에 머물렀습니다.

    11. 그는 가데스와 술 사이인 그랄 산지에 머물렀습니다. 그리고 다섯째 달 중순에 그곳을 떠나 맹세의 우물에 머물렀습니다.

    12. 그곳에서 그는 맹세의 우물 곁에 거하였고, 여섯째 달 한가운데에 주께서 사라를 찾아오셨습니다.

    13. 그리고 그는 사라에게 말씀하신 대로 해 주셨습니다. 사라는 잉태하여 셋째 달, 그 달 중순에, 주께서 아브라함에게 말씀하신 때에 아들을 낳았습니다. 추수의 첫 열매 절기에 그가 태어났습니다.

    14. 아브라함은 여드레째 되는 날에 그의 아들 이삭에게 할례를 행하였습니다. 그는 영원히 제정된 규례에 따라 할례를 받은 첫 사람이었습니다.

    15. 영원히 확립된 언약입니다. 그리고 넷째 주의 여섯째 해에 우리는 ‘맹세의 우물’에서 아브라함에게 갔고, 우리가 다시 사라에게 올 것이며 사라가 아들을 잉태할 것이라고 사라에게 말한 대로 그에게 나타났습니다.

    16. 우리는 일곱째 달에 돌아와 우리 앞에서 사라가 임신한 것을 발견했습니다. 그리고 주님을 찬송하고, 하나님께서 아브라함에 관하여 말씀하신 모든 것을 그에게 알렸습니다. 하나님께서는 그 일들을 반드시 이루실 것이었습니다.

    17. 우리는 그를 축복하고, 그가 여섯 아들을 더 낳고 죽기 전에 그들을 볼 때까지 죽지 않을 것과 이삭에게서 그의 이름과 씨가 불릴 것이라고, 그에 관하여 정해진 모든 것을 그에게 말하였습니다.

    18. 그리고 이삭만이 거룩한 씨가 될 것이며, 그는 민족들 가운데 셈에 들지 않을 것입니다. 이는 그가 지극히 높으신 분의 몫이 될 것이기 때문입니다. 그의 모든 자손은 하나님의 몫으로 돌아가, 모든 백성 가운데서 주님의 소유가 될 백성이 되고 한 왕국이 되도록 하려는 것입니다.

    19. 제사장직과 거룩한 백성이 되었습니다. 그는 길을 떠났고, 기뻐하며 우리가 그에게 말해 준 것 때문에 만물의 창조주를 찬양했습니다.

    20. 그는 그곳에서 야훼께 제단을 쌓았습니다. 야훼께서는 그를 구원하시고, 그가 나그네로 살아가는 땅에서 그를 기쁘게 하셨습니다. 그리고 그는 이 달에 자신이 맹세의 우물에 쌓은 제단 곁에서 기쁨의 절기를 칠 일 동안 지켰습니다.

    21. 그가 서약의 우물 곁에 세운 제단 가까이에, 자신과 그의 종들을 위하여 초막들을 지었습니다.

    22. 이 절기 때에 그는 땅에서 초막절을 처음으로 지켰습니다. 그리고 이 일곱 날 동안 그는 날마다 제단 위에서 주님께 수소 두 마리와 숫양 두 마리와 양 일곱 마리와 속죄제를 위한 숫염소 한 마리를 바쳤습니다.

    23. 그것으로 죄를 속죄하여 자기와 자기의 자손을 위하고, 평안제물로 숫양 일곱, 어린 염소 일곱, 양 일곱, 숫염소 일곱을 드렸습니다. 또 그에 딸린 곡식제물과 전제를 드렸습니다. 그는 그것들의 모든 기름을 제단 위에서 불살랐습니다. 그것은 주님께 드리는, 향기로운 냄새가 나는 선택된 제물이었습니다.

    24. 그는 아침과 저녁에 유향, 풍자향, 스타크테, 나르드, 몰약, 계피, 코스투스로 만든 향기로운 향을 피웠습니다. 이 일곱 가지를 모두 함께 섞어 순수하게 바쳤습니다.

    25. 그는 온 마음과 온 영혼으로 기뻐하며 이 절기를 이레 동안 지켰습니다. 그와 그의 집에 있는 모든 사람이 그러했습니다. 그와 함께 있는 이방인이나 할례받지 않은 사람은 아무도 없었습니다.

    26. 그는 자신을 그의 세대 가운데 창조하신 자기 창조주를 송축하였습니다. 그분께서 자신의 기뻐하심에 따라 그를 창조하셨기 때문입니다. 그는 자기에게서 영원한 세대들을 위한 의의 심긴 것이 나올 것이며, 자기에게서 거룩한 씨가 나와 모든 것을 만드신 분과 같이 될 것을 알고 깨달았습니다.

    27. 그는 축복하고 기뻐하며, 이 절기의 이름을 ‘주님의 절기, 기쁨’이라고 불렀습니다.

    28. 둘 모두에게 매우 큰 기쁨이 있었습니다. 그는 거기에 자신에게 복을 주시고 자신이 나그네로 머무는 땅에서 기뻐하게 하신 주님께 제단을 세웠습니다. 그리고 그는 이 달에 칠 일 동안 기쁨의 잔치를 열었습니다.

    29. 그러므로 이스라엘이 일곱째 달에 기쁨으로 칠 일 동안 초막절을 지키는 것이 주 앞에서 받아들여지도록 하늘의 판들에 규정되어 있습니다.

    30. 그것은 그들의 모든 세대에 걸쳐 해마다 지켜야 할 영원한 규례입니다. 또 이 일에는 정해진 날수의 한계가 없습니다. 이스라엘이 그것을 지키고 초막에 거하며, 머리에 관을 쓰고, 잎이 무성한 가지와 버드나무를 취하도록 영원히 제정된 것이기 때문입니다.

    31. 아브라함은 종려나무 가지들과 아름다운 나무의 열매를 가져다가, 날마다 그 가지들을 가지고 제단 주위를 일곱 번 돌았으며, 아침에는 기쁨으로 자기 하나님께 모든 것에 대하여 찬양하고 감사드렸습니다.'
