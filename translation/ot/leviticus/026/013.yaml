  from: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
  to: I am Yahweh your God, who brought you out of the land of Egypt so that you would no longer be their slaves. I broke the bars of your yoke and made you walk with your heads held high[a].
