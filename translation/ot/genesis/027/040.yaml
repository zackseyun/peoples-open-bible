  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
  to: you will live by your sword and serve your brother; but when you grow restless[a], you will throw his yoke off your neck.”
  rationale: The prior discussion correctly preserved the sword, service, and yoke as images of livelihood and domination. I adopt its documented alternative 'grow restless' because it better distinguishes resistance from its outcome, while retaining 'break loose' in a footnote.
