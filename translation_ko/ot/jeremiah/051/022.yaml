  yaml_path: translation/ot/jeremiah/051/022.yaml
  text: And with you I will shatter man and woman; and with you I will shatter old man and youth; and with you I will shatter young man and virgin.
translation:
  language: ko
  text: 그리고 내가 너로 남자와 여자를 산산이 부수며, 내가 너로 노인과 젊은이를 산산이 부수며, 내가 너로 젊은 남자와 처녀를 산산이 부수겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִפַּצְתִּי / אִישׁ וְאִשָּׁה
  english_pob_choice: I will shatter man and woman
  chosen_korean: 내가 남자와 여자를 산산이 부수겠습니다
  alternatives_korean:
  - 내가 사람과 여자를 산산이 부수겠습니다
  - 내가 남성과 여성을 산산이 부수겠습니다
  lexicon: נפץ
  rationale: נפץ는 단순한 파괴보다 강한 ‘산산이 부수다’가 가장 직접적이므로 이를 반복해 원문의 강도를 살렸습니다. אִישׁ/אִשָּׁה는 성중립적 ‘사람’보다 성별 대비가 분명한 ‘남자/여자’가 원문 구조를 더 잘 드러냅니다.
- source_word: זָקֵן וָנָעַר
  english_pob_choice: old man and youth
  chosen_korean: 늙은이와 젊은이
  alternatives_korean:
  - 노인과 청년
  - 늙은 남자와 젊은이
  lexicon: זקן, נער
  rationale: 영문 POB가 'old man and youth'로 잡은 대비를 따라, 연령 대비를 가장 자연스럽게 드러내는 ‘늙은이와 젊은이’를 택했습니다. 문맥상 특정 직분이 아니라 나이 대비가 핵심입니다.
- source_word: בָּחוּר וּבְתוּלָה
  english_pob_choice: young man and virgin
  chosen_korean: 젊은 남자와 처녀
  alternatives_korean:
  - 청년과 처녀
  - 젊은이와 처녀
  lexicon: בחור, בתולה
  rationale: בָּחוּר는 단순 ‘젊은이’보다 미혼의 젊은 남성을 가리킬 수 있어, 원문 대비를 살려 ‘젊은 남자’로 옮겼습니다. בְתוּלָה는 ‘처녀’가 가장 직설적이고 전통적 의미를 유지합니다.
theological_decisions:
- issue: 심판의 반복과 점층적 열거
  chosen_reading: 동일 동사를 세 번 반복해 남녀, 연령, 혼인 상태 전반을 포괄하는 총체적 심판으로 읽고 번역했습니다.
  alternative_readings:
  - 한 번만 ‘부수다’를 두고 나머지는 생략적으로 처리
  - 서술을 완만하게 만들어 폭력성을 약화시키는 번역
  rationale: 원문은 וְנִפַּצְתִּי를 반복해 심판의 전면성을 강조하므로, 반복을 유지해야 청자에게 전달되는 예언적 충격과 범위를 보존할 수 있습니다.
  doctrine_reference: 예언서의 총체적 심판 선포
