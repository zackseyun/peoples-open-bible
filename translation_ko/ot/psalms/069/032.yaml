  - marker: b
    text: Hebrew 'let your heart live,' an idiom for renewed courage, vitality, or hope.
    reason: cultural_note
translation:
  language: ko
  text: 겸손한 이들이 보고 기뻐할 것입니다. 하나님을 찾는 여러분, 여러분의 마음이 살아나기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘겸손한 이들’은 ‘고난받는 이들’ 또는 ‘온유한 이들’로도 옮길 수 있습니다. 히브리어의 ‘너희 마음이 살다’는 용기와 생기, 희망을 되찾는다는 비유적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
