base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/019.yaml
  text: 'The LORD, my Lord, is my strength; he makes my feet like the deer’s, and he causes me to tread on my heights.


    For the choir director: with my stringed instruments.'
translation:
  language: ko
  text: '야훼, 나의 주님께서는 나의 힘이십니다. 그분은 나의 발을 암사슴의 발처럼 하시고, 나의 높은 곳들을 밟게 하십니다.


    지휘자에게. 나의 현악기로.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוִהּ אֲדֹנָי
  english_pob_choice: The LORD, my Lord
  chosen_korean: 주 야훼, 나의 주님
  alternatives_korean:
  - 야훼, 나의 주님
  - 주님, 나의 주님
  - 주 야훼 하나님, 나의 주님
  lexicon: יהוה / אֲדֹנָי
  rationale: 첫 호칭은 고유신명 야훼로, 둘째 호칭은 주권적 호칭으로 구분하여 원문의 이중 호칭을 살렸습니다. 영어 POB의 'The LORD, my Lord'도 이 구분을 반영합니다.
- source_word: חֵילִי
  english_pob_choice: is my strength
  chosen_korean: 나의 힘은…입니다 / 나의 힘이십니다
  alternatives_korean:
  - 나의 능력
  - 나의 요새
  - 나의 강함
  lexicon: חֵיל
  rationale: 문맥상 보호자이자 의지처의 의미를 담는 '힘'이 가장 자연스럽고 간결하여 채택했습니다.
- source_word: כָּאַיָּלוֹת
  english_pob_choice: like the deer’s
  chosen_korean: 암사슴의 발과 같게
  alternatives_korean:
  - 사슴의 발과 같게
  - 암사슴처럼
  - 노루의 발과 같게
  lexicon: אַיָּלָה
  rationale: 다음 절의 '발'과 직접 연결되므로 '암사슴의 발'로 구체화해 원문의 생동감을 보존했습니다.
- source_word: לַמְנַצֵּחַ בִּנְגִינוֹתָי
  english_pob_choice: 'For the choir director: with my stringed instruments'
  chosen_korean: 지휘자에게. 현악기로.
  alternatives_korean:
  - 음악 감독에게. 내 현악기로.
  - 지휘자를 위하여. 나의 현악기들과 함께.
  lexicon: לַמְנַצֵּחַ / בִּנְגִינוֹת
  rationale: 전형적 표제어를 한국어로 간결하게 옮기되, '현악기'로 악기군을 드러내며 소유격 뉘앙스는 과도하게 풀지 않았습니다.
theological_decisions:
- issue: יהוה와 אֲדֹנָי의 이중 호칭
  chosen_reading: 주 야훼, 나의 주님
  alternative_readings:
  - 야훼, 나의 주님
  - 주님, 나의 주님
  rationale: 원문의 두 호칭이 서로 다른 기능을 하므로 하나로 합치지 않고 병기해, 신적 이름과 주권 호칭의 긴장을 유지했습니다.
  doctrine_reference: 하나님 이름의 계시성과 주권적 호칭의 구분
