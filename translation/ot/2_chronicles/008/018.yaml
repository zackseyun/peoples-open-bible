id: 2CH.8.18
reference: 2 Chronicles 8:18
source:
  edition: WLC
  text: וַ/יִּֽשְׁלַֽח ל/וֹ֩ חוּרָ֨ם בְּ/יַד עֲבָדָ֜י/ו אוניות וַ/עֲבָדִים֮ י֣וֹדְעֵי יָם֒ וַ/יָּבֹ֜אוּ עִם עַבְדֵ֤י שְׁלֹמֹה֙ אוֹפִ֔ירָ/ה וַ/יִּקְח֣וּ מִ/שָּׁ֔ם אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים כִּכַּ֣ר זָהָ֑ב וַ/יָּבִ֖יאוּ אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־־־־׃פ
translation:
  text: Through his servants, Huram sent Solomon ships and servants experienced at sea. They sailed with Solomon’s servants to Ophir, obtained four hundred and fifty talents[a] of gold there, and brought it to King Solomon.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: A talent was a unit of weight of roughly 30–35 kilograms (66–77 pounds); 450 talents amounted to about 14–16 metric tons.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  chosen: sent
  alternatives:
  - dispatched
  lexicon: HALOT
  rationale: Standard rendering of שלח in narrative prose. 'Sent' is natural and sufficiently formal.
- source_word: חוּרָם
  chosen: Huram
  alternatives:
  - Hiram
  rationale: Personal names are transliterated. 'Huram' follows the Hebrew form here, though 'Hiram' is a familiar conventional variant.
- source_word: בְּיַד עֲבָדָיו
  chosen: by the hand of his servants
  alternatives:
  - through his servants
  - by his servants
  lexicon: HALOT
  rationale: The idiom literally means agency mediated through persons. 'By the hand of' preserves the Hebrew flavor while remaining understandable.
- source_word: אֳנִיּוֹת
  chosen: ships
  alternatives:
  - boats
  - vessels
  lexicon: HALOT
  rationale: Refers to seagoing craft in this context; 'ships' best fits the maritime expedition to Ophir.
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  chosen: servants knowledgeable about the sea
  alternatives:
  - sailors
  - servants experienced at sea
  - men who knew the sea
  lexicon: HALOT
  rationale: Literally 'servants knowing the sea.' I retained both their status as servants and their maritime expertise. 'Sailors' is possible but would omit the explicit עבדים.
- source_word: עִם עַבְדֵי שְׁלֹמֹה
  chosen: with Solomon’s servants
  alternatives:
  - with the servants of Solomon
  rationale: Straightforward construct relationship; possessive form is natural English.
- source_word: אוֹפִירָה
  chosen: to Ophir
  alternatives:
  - Ophirward
  rationale: The directional he indicates motion toward Ophir. English idiom is simply 'to Ophir.'
- source_word: וַיִּקְחוּ מִשָּׁם
  chosen: took from there
  alternatives:
  - obtained from there
  lexicon: HALOT
  rationale: Common narrative verb לקח. 'Took' is direct and does not overinterpret the manner of acquisition.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  chosen: four hundred and fifty talents of gold
  alternatives:
  - 450 talents of gold
  lexicon: HALOT
  rationale: Keeps the ancient unit 'talents' rather than converting to modern weight, preserving historical specificity.
- source_word: וַיָּבִיאוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  chosen: and brought them to King Solomon
  alternatives:
  - and brought it to King Solomon
  lexicon: HALOT
  rationale: The object is the gold just mentioned. English may treat 'gold' as mass singular ('it'), but 'them' can refer to the talents/amount taken. I chose 'them' to reflect the plural verbal flow of the narrative and the countable unit 'talents.'
