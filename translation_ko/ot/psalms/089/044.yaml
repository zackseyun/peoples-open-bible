  rationale: 왕좌가 낮아지는 굴욕의 이미지를 살리면서도, POB의 관용적 표현을 한국어에서 자연스럽게 재현했습니다.
- source_word: מִגַּֽרְתָּה
  english_pob_choice: cast ... to the ground
  chosen_korean: 던져 버리셨습니다
