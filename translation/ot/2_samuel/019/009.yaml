  category: meaning_retranslation
  from: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
  to: Then the king got up and took his seat at the city gate. All the troops were told, “Look, the king is sitting at the gate.” Then they all came before the king. But the men of Israel who had followed Absalom had fled, each man to his home.
  rationale: I retain the earlier recognition that “had fled” supplies background to the immediate scene and that “but” marks a contrast. The documented public role of the gate and the explanation of “to his tent” support clearer main-text wording rather than source-transparent phrasing.
