  alternative_readings:
  - Use more interpretive renderings such as 'frustrate' or 'bring to nothing'
  rationale: The verse is a scriptural citation supporting God’s overthrow of human wisdom. A restrained rendering preserves the text’s force without importing extra doctrinal nuance.
