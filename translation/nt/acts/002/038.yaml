id: ACT.2.38
reference: Acts 2:38
source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
translation:
  text: And Peter said to them[a], “Repent[c], and let each of you be baptized in the name of Jesus Christ for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
    reason: alternative_reading
  - marker: b
    text: The phrase 'for the forgiveness of your sins' translates the Greek directly. Interpreters differ on how baptism relates to forgiveness here; the translation does not resolve that debate beyond the wording of the text.
    reason: lexical_alternative
  - marker: c
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετανοήσατε
  chosen: Repent
  alternatives:
  - Reorient toward God
  - Repent
  - Change your mind
  - Turn back
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Restore Repent alongside baptism and forgiveness; do not recast the conjunction or decide baptismal causality through the terminology change. Contextual editorial assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: βαπτισθήτω
  chosen: let ... be baptized
  alternatives:
  - be baptized
  lexicon: BDAG
  rationale: Third-person aorist passive imperative singular, coordinated with the second-person plural imperative. 'Let each of you be baptized' reflects the distributive singular ἕκαστος and preserves the imperative force in natural English.
- source_word: ἕκαστος ὑμῶν
  chosen: each of you
  alternatives:
  - every one of you
  lexicon: BDAG
  rationale: Distributive expression emphasizing individual response within the group. 'Each of you' is natural modern English and preserves the singular force.
- source_word: ἐπὶ τῷ ὀνόματι
  chosen: in the name of
  alternatives:
  - upon the name of
  - on the basis of the name of
  lexicon: BDAG
  rationale: The prepositional phrase with ἐπί + dative here is idiomatic in baptismal context. 'In the name of' is the clearest English equivalent and avoids over-specifying whether the nuance is basis, authority, or confession.
- source_word: Ἰησοῦ Χριστοῦ
  chosen: Jesus Messiah
  alternatives:
  - Jesus Christ
  lexicon: BDAG
  rationale: Per doctrine, Χριστός is translated as 'Messiah' where it functions as a title rather than a name-like element. In this proclamation context the titular sense is still active, so 'Jesus Messiah' preserves the messianic meaning.
- source_word: εἰς ἄφεσιν
  chosen: for the forgiveness
  alternatives:
  - for forgiveness
  - into forgiveness
  - with a view to forgiveness
  lexicon: BDAG
  rationale: ἄφεσις denotes release/forgiveness. 'For the forgiveness' is idiomatic and preserves the telic/result-oriented force of εἰς without forcing a narrower sacramental or merely symbolic interpretation.
- source_word: τῶν ἁμαρτιῶν ὑμῶν
  chosen: of your sins
  alternatives:
  - of your sin
  lexicon: BDAG
  rationale: Plural in Greek; 'sins' should be retained rather than flattened to singular.
- source_word: λήμψεσθε
  chosen: you will receive
  alternatives:
  - you shall receive
  lexicon: BDAG
  rationale: Future middle indicative, straightforward predictive promise. 'Will receive' is readable modern English.
- source_word: δωρεὰν
  chosen: gift
  alternatives:
  - free gift
  lexicon: BDAG
  rationale: The noun already carries the sense of a gift freely given; 'gift' is sufficient in English without redundancy.
- source_word: τοῦ ἁγίου πνεύματος
  chosen: the Holy Spirit
  alternatives:
  - the Holy Ghost
  lexicon: BDAG
  rationale: Standard contemporary rendering for the personal divine Spirit; avoids archaic diction while preserving theological weight.
