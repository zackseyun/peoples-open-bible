  source_fidelity: The translation accurately represents the sequence and direct address in the Greek. “보십시오, 네 어머니입니다” preserves the deictic force of Ἴδε and the elliptical identification “your mother,” while “그때부터” appropriately conveys ἀπ’ ἐκείνης τῆς ὥρας. “자기 집으로 맞아들였습니다” is a natural formal Korean rendering of taking her εἰς τὰ ἴδια, consistent with the English audit trail’s “into his own home.”
  naturalness: The wording is clear and idiomatic in modern formal-polite Korean. The short direct quotation retains the solemn, immediate character of the scene without importing archaic diction.
  terminology: “어머니,” “제자,” and the respectful narrative verb “말씀하셨습니다” fit established Korean biblical usage and the requested register. No doctrinally loaded interpretation is introduced.
