id: JOB.38.5
reference: Job 38:5
source:
  edition: WLC
  text: מִי שָׂ֣ם מְ֭מַדֶּי/הָ כִּ֣י תֵדָ֑ע א֤וֹ מִֽי נָטָ֖ה עָלֶ֣י/הָ קָּֽו־־׃
translation:
  text: Who set its dimensions—surely you know—or who stretched a measuring line over it?
  philosophy: dynamic
lexical_decisions:
- source_word: מִי
  chosen: Who
  lexicon: HALOT
  rationale: Interrogative pronoun introducing the divine rhetorical question.
- source_word: שָׂם
  chosen: set
  alternatives:
  - fixed
  - appointed
  lexicon: HALOT
  rationale: Qal perfect of שׂים commonly means 'set, place, fix.' 'Set' is natural English and fits the context of establishing the earth's dimensions.
- source_word: מְמַדֶּיהָ
  chosen: its dimensions
  alternatives:
  - its dimensions
  - its measures
  lexicon: HALOT
  rationale: “Dimensions” is a natural English expression for the earth’s measured extent in this architectural image.
- source_word: כִּי תֵדָע
  chosen: surely you know
  alternatives:
  - for you know
  - since you know
  lexicon: HALOT
  rationale: The clause is an ironic assertion in the rhetorical question, rather than a genuine conditional.
- source_word: אוֹ
  chosen: or
  lexicon: HALOT
  rationale: Simple disjunctive conjunction linking the parallel question.
- source_word: נָטָה
  chosen: stretched
  alternatives:
  - extended
  - spread out
  lexicon: HALOT
  rationale: In construction imagery, נָטָה with קו refers to stretching out a measuring line. 'Stretched' is the most idiomatic rendering.
- source_word: עָלֶיהָ
  chosen: upon it
  alternatives:
  - over it
  - across it
  lexicon: HALOT
  rationale: Preposition על with the earth as antecedent. 'Upon it' preserves the spatial image without over-specifying direction.
- source_word: קָּו
  chosen: a line
  alternatives:
  - a measuring line
  - a cord
  lexicon: HALOT
  rationale: The term denotes a measuring line/cord in building contexts. Main text uses the concise 'line' for readability, while the more explicit alternative is preserved in a footnote.
- source_word: עָלֶיהָ קָּו
  chosen: a measuring line over it
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: קָו denotes a measuring line in this context, and “over it” naturally expresses the spatial image of stretching it across the earth.
