lexical_decisions:
- source_word: ἐχώρισα
  chosen: I set apart
  alternatives:
  - I separated
  - I selected
  lexicon: BDAG
  rationale: The verb means to separate or appoint out from a group. 'Set apart' preserves both the physical/separative sense
    and the formal appointing nuance in context.
- source_word: φυλάρχων
  chosen: leaders
  alternatives:
  - heads of families
  - tribal chiefs
  - chiefs
  lexicon: LSJ
  rationale: Literally 'tribe/clan leaders' or 'chiefs.' In this context with τῶν ἱερέων, it refers to leading men among the
    priestly group. 'Leaders' is clear modern English without overcommitting to a specific social structure.
- source_word: τῶν ἱερέων
  chosen: of the priests
  alternatives:
  - among the priests
  - from the priests
  lexicon: BDAG
  rationale: 'The genitive most naturally qualifies the preceding leaders: these are leaders belonging to the priests. ''Of
    the priests'' keeps the Greek structure and avoids adding interpretive specificity.'
- source_word: ἄνδρας δέκα δύο
  chosen: twelve men
  alternatives:
  - twelve men of them
  - twelve persons
  lexicon: BDAG
  rationale: ἄνδρας is specifically male, and the context concerns priestly representatives. 'Twelve men' is gender-accurate
    and straightforward.
- source_word: Ἐσερεβίαν
  chosen: Eserebias
  alternatives:
  - Sherebiah
  rationale: The Greek expression is rendered 'Eserebias' in this unit. The selected Greek, not an approximate cross-reference,
    controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: Ἀσοαμίαν
  chosen: Asoamias
  alternatives:
  - Hashabiah
  rationale: The Greek expression is rendered 'Asoamias' in this unit. The selected Greek, not an approximate cross-reference,
    controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: μετʼ αὐτῶν ... ἄνδρας δέκα
  chosen: and with them, from among their brothers, ten men
  alternatives:
  - And with them ten men from their brothers
  - And with them, ten of their brothers
  lexicon: LSJ
  rationale: Active rendering synchronized with this printed Greek unit and its main English; the prior lexicon label is historical,
    not a new consultation.
