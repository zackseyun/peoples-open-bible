id: JOB.21.29
reference: Job 21:29
source:
  edition: WLC
  text: הֲ/לֹ֣א שְׁ֭אֶלְתֶּם ע֣וֹבְרֵי דָ֑רֶךְ וְ֝/אֹתֹתָ֗/ם לֹ֣א תְנַכֵּֽרוּ׃
translation:
  text: Have you not asked travelers, and will you not acknowledge the evidence they give?
  philosophy: dynamic
lexical_decisions:
- source_word: הֲלֹא
  chosen: Have you not
  alternatives:
  - Surely
  - Is it not so that
  lexicon: HALOT
  rationale: Introduces a rhetorical question expecting agreement. 'Have you not' preserves the interrogative force and the rebuking tone better than a flat assertion.
- source_word: שְׁאֶלְתֶּם
  chosen: asked
  alternatives:
  - inquired of
  - questioned
  lexicon: HALOT
  rationale: The verb means to ask or inquire. 'Asked' is natural modern English and fits the direct appeal to common testimony.
- source_word: עֹבְרֵי דָרֶךְ
  chosen: those who travel the road
  alternatives:
  - travelers
  - wayfarers
  - those passing along the way
  lexicon: HALOT
  rationale: This rendering naturally preserves the singular 'road/way' in the Hebrew phrase.
- source_word: וְאֹתֹתָם
  chosen: their signs
  alternatives:
  - their tokens
  - their marks
  - their testimony
  lexicon: HALOT
  rationale: אוֹת commonly means 'sign' or 'token.' In context Job appeals to the evidence or indicators known by travelers. 'Their signs' keeps the lexical sense; 'testimony' captures the idea but moves further from the Hebrew noun.
- source_word: לֹא תְנַכֵּרוּ
  chosen: do you not recognize
  alternatives:
  - do you not acknowledge
  - do you not examine
  - can you not discern
  lexicon: HALOT
  rationale: From נכר in the piel, here likely 'recognize' or 'acknowledge.' The sense is that Job's hearers should not fail to recognize the evidentiary signs reported by travelers. 'Recognize' is the most straightforward fit with 'signs.'
