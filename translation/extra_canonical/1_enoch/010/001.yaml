translation:
  text: Then the Most High, the Great and Holy One, spoke and sent Asaryalyur to the son of Lamech, and said to him:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected printed24form divides the messenger’s name as Asaryalyur. Charles records variant/corrupt forms and
      discusses Istrael/Uriel in note23; the presented Ethiopic form is retained rather than silently replaced with Uriel.
    reason: textual_variant
  - marker: b
    text: Charles places a supplied “said” in parentheses, noting Greek support in printed24note20. This English renders the
      speech once with “spoke”; the selected critical-edition supply is not claimed as independent Ethiopic manuscript testimony.
    reason: textual_variant
lexical_decisions:
- source_word: አሜሃ
  chosen: Then
  alternatives:
  - At that time
  rationale: Marks the next event in the narrative sequence; “Then” is concise and natural while preserving the temporal transition.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ልዑል
  chosen: the Most High
  alternatives:
  - the Exalted One
  rationale: The adjective denotes exalted or supreme status and here functions as a divine title; “the Most High” preserves
    that titular force.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዓቢይ፡ ወቅዱስ
  chosen: the Great and Holy One
  alternatives:
  - great and holy
  rationale: These coordinated adjectives further identify the Most High. Rendering them substantivally preserves the elevated
    divine titulary and makes the Ge'ez syntax clear in English.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ተናገረ
  chosen: spoke
  alternatives:
  - declared
  rationale: A direct and formally corresponding rendering that retains the narrative speech formula without adding rhetorical
    force.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወፈነወ
  chosen: and sent
  alternatives:
  - and dispatched
  rationale: Preserves the coordinated verbal sequence and the commission of the angelic messenger.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: አሰርየ፡ ልዩር
  chosen: Asaryalyur
  alternatives:
  - Uriel
  - Arsayalalyur
  rationale: The supplied OCR presents a divided and apparently unstable angelic name. The main text conservatively transliterates
    its visible Ge'ez form as a single proper name rather than silently replacing it with the familiar Uriel from the wider
    textual tradition.
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኀበ፡ ወልደ፡ ላሜክ
  chosen: to the son of Lamech
  alternatives:
  - to Lamech’s son
  rationale: Retains the source's relational designation and formal narrative register; the son is not named in this verse.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወይቤሎ
  chosen: and said to him
  alternatives:
  - and told him
  rationale: Preserves both the speech verb and its masculine singular object. The colon signals that the message continues
    in the following verse.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
