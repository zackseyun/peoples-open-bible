translation:
  text: 'I passed the beast and walked on for about thirty feet. A virgin met me. She was adorned as though
    coming from a bridal chamber. She wore all white, including white sandals. Her veil reached her forehead.
    Her covering was a head-wrap, and her hair was white.[a]


    2. I recognized her from the earlier visions. She was the church. I became more cheerful. “Greetings,
    man!” she said. “Greetings, lady!” I replied.


    3. She asked, “Did nothing meet you?” I said, “Lady, an enormous beast met me. It could destroy whole
    peoples! But I escaped it through the Lord’s power and abundant mercy.”


    4. She said, “You escaped safely because you cast your care upon God and opened your heart toward
    the Lord. You believed you could be saved through nothing except the great and glorious name.[b] So
    the Lord sent his angel who oversees the beasts. His name is Thegri. The Lord shut the beast’s mouth
    so it would not harm you.[c] You escaped great affliction through your faith and because you did not
    waver when you saw such an enormous beast.”


    5. “Go and tell the Lord’s chosen ones about his mighty deeds. Tell them this beast is a sign of the
    great affliction to come. Prepare yourselves and repent toward the Lord with your whole heart. Then
    you will be able to escape it, if your heart becomes pure and without blemish and you serve the Lord
    without blame for the rest of your life. Cast your cares upon the Lord. He will set them right.”[d]


    6. “Trust in the Lord, you who waver. He can do all things. He turns his anger away from you and sends
    scourges upon you who waver.[e] Woe to those who heard these words and disobeyed! It would have been
    better for them not to have been born.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: 'White hair follows the working 1891 text and Athos, Lake (1907), Plate IV line 28. Primary
      Sinaiticus project XML, chapter23.1 word42, has chiras, “hands,” with an adjacent verb corrected
      to “had” by S1. Alternative: “She had white hands.” The project marks a letter of the earlier verb
      uncertain; no fresh manuscript photograph collation is claimed. Reconsideration of the prior lexical
      rendering: “head-wrap” renders mitra in the covering description. “Headband” and “turban” remain
      alternative covering terms; “turban” is retained in the archived reader history. The Greek says
      that her covering was “in a mitra”; its precise arrangement is not specified, and no separate binding
      or fastening action is expressly stated.'
  - marker: b
    reason: textual_variant
    text: 'The working text and Athos say “the great and glorious name.” Primary Sinaiticus23.4 words30–34
      has “the holy angel and glorious name.” Full alternative: “Believing that you could be saved through
      nothing except the holy angel and glorious name.” The draft retains the working construction without
      inserting Jesus as an explicit name or silently dropping the angel from the alternative.'
  - marker: c
    reason: textual_variant
    text: 'Thegri follows the bounded Athos reading Θεγρί, Lake (1907), Plate IV line33. Sinaiticus’s
      S1 and ca readings have corresponding thegrei, while its earlier name apparatus has an extra gamma
      and thegei with an overlined core. These hands belong to one manuscript. Segri is Harris’s conjecture
      printed in the 1891 body, not the Athos spelling. Alternative: “The Lord sent his angel who oversees
      the beasts, whose name is Segri, and shut its mouth so that it would not harm you.” Beasts is plural
      in the print, Athos and Sinaiticus; the former singular transcription is corrected. No Hebrew etymology
      is made part of the translation.'
  - marker: d
    reason: textual_variant
    text: 'The warning’s missing beginning is restored: prepare, repent with the whole heart, and the
      conditional ability to escape. The old “I knew that I would escape it” joined the beginning of paragraph2
      to the end of paragraph5 across the lost text; it was not an independent first-person prediction.
      “It” here refers to the affliction, not the neuter beast. The working text and primary Sinaiticus23.5
      word62 have cares; Athos, Plate IV line37, has hearts. Alternative closing: “Cast your hearts upon
      the Lord, and he himself will set them right.”'
  - marker: e
    reason: lexical_alternative
    text: “Scourges” renders mastigas; alternatives include lashes or plagues. The source coordinates
      the turning away of anger and the sending of scourges; it does not state a new motive here. The
      draft retains both clauses and the warning to those who heard and disobeyed, without adding “refused.”
lexical_decisions:
- source_word: κύρια
  chosen: lady
  alternatives:
  - madam
  rationale: Respectful address to the woman identified as the visionary church, not a divine title identifying
    her as God.
- source_word: θηρίων
  chosen: beasts
  alternatives:
  - wild animals
  rationale: Restore the printed plural, corroborated by Athos and primary Sinaiticus; do not narrow the
    angel’s scope to this one beast.
- source_word: Θεγρί
  chosen: Thegri
  alternatives:
  - Segri (1891 conjecture)
  - Thegrei (corrected Sinaiticus spelling)
  rationale: Prefer the attested Athos name over an etymological conjecture; keep the disturbed earlier
    Sinaiticus name and correcting hands distinct.
- source_word: μετανοήσητε / θλῖψις / τύπος
  chosen: repent / affliction / sign
  alternatives:
  - turn back / tribulation / figure
  rationale: Restore the complete communal warning and its conditions. Repenting is directed toward the
    Lord; the beast signifies the coming affliction. No modern timetable is supplied.
