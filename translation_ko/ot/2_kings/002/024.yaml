revisions:
- from: 그가 뒤로 돌아서서 그들을 보고, 야훼의 이름으로 그들을 저주했습니다. 그러자 숲에서 암곰 두 마리가 나와 그들 가운데서 마흔두 명의 소년을 물어뜯었습니다.[a][b]
  to: 그가 돌아서서 그들을 보고 야훼의 이름으로 그들을 저주했습니다. 그러자 암곰 두 마리가 숲에서 나와 그 아이들 중 마흔두 명을 물어뜯었습니다.
  rationale: 아이들의 수식 관계를 명료하게 하고 성별 비특정 원어 표현을 보존했습니다. 기존 각주는 번역문 이해나 본문 충실성에 필수적이지 않으며, 특히 영어 POB의 표기를 설명하는 각주는 한국어 본문 주석으로 남길 필요가 없어 제거했습니다.
  reviewer_model: gpt-5.6-terra
