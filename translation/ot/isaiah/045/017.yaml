theological_decisions:
- issue: Rendering the divine name יהוה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Agency/sphere nuance of ב in ביהוה
  chosen_reading: by the LORD
  alternative_readings:
  - in the LORD
  - through the LORD
  rationale: The Hebrew preposition permits more than one nuance, but with the passive verb 'is saved' the agentive sense is strongest in English. The choice avoids doctrinal overreading while making the clause idiomatic.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
