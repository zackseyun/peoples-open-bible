translation:
  text: The earth will be cleansed of all corruption, all sin, all plague, and all suffering; and never again will I send
    these things upon it, from generation to generation and forever.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Plague” may also be rendered “scourge” or “punishment”; the Ge'ez term can denote a punitive affliction.
    reason: lexical_alternative
  - marker: b
    text: The Ge'ez does not state the object of “send”; “these things” refers back to the preceding list.
    reason: alternative_reading
lexical_decisions:
- source_word: ትነጽሕ
  chosen: will be cleansed
  alternatives:
  - will become clean
  - will be purified
  rationale: The verb denotes becoming or being made clean. The passive English wording fits the earth as the recipient of
    cleansing and preserves the judgment-and-restoration imagery.
  model_suggested_lexicon_unverified: Leslau, Comparative Dictionary of Ge'ez
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ሙስና
  chosen: corruption
  alternatives:
  - ruin
  - decay
  rationale: “Corruption” captures moral and destructive spoilage without reducing the term either to physical decay alone
    or to sin, which is named separately in the next phrase.
  model_suggested_lexicon_unverified: Leslau, Comparative Dictionary of Ge'ez
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኃጢአት
  chosen: sin
  alternatives:
  - offense
  - transgression
  rationale: “Sin” is the direct and contextually appropriate rendering in this list of evils removed from the earth.
  model_suggested_lexicon_unverified: Leslau, Comparative Dictionary of Ge'ez
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: መቅሠፍት
  chosen: plague
  alternatives:
  - scourge
  - punishment
  rationale: The noun can denote a plague, scourge, or punitive affliction. “Plague” retains the concrete calamity imagery
    and distinguishes it from the broader suffering named next.
  model_suggested_lexicon_unverified: Leslau, Comparative Dictionary of Ge'ez
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ጻዕር
  chosen: suffering
  alternatives:
  - toil
  - distress
  - affliction
  rationale: The term covers hardship, toil, and distress. In this comprehensive removal formula, “suffering” communicates
    the broad afflictive sense while remaining distinct from plague.
  model_suggested_lexicon_unverified: Leslau, Comparative Dictionary of Ge'ez
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወኢይደግም፡ ከመ፡ እፈኑ
  chosen: and never again will I send
  alternatives:
  - and it will not happen again that I send
  - and I will not again send
  rationale: The construction is literally close to “it will not again be that I send.” Idiomatic English places “never again”
    with the first-person verb while preserving the emphatic non-recurrence.
  model_suggested_lexicon_unverified: Leslau, Comparative Dictionary of Ge'ez
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዲቤሃ
  chosen: upon it
  alternatives:
  - upon her
  - over it
  rationale: The feminine suffix refers back to the grammatically feminine “earth.” English naturally uses “it,” while “upon”
    preserves the directional force of calamities being sent against the earth.
  model_suggested_lexicon_unverified: Leslau, Comparative Dictionary of Ge'ez
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ለትውልደ፡ ትውልድ፡ ወእስከ፡ ለዓለም
  chosen: from generation to generation and forever
  alternatives:
  - for generation after generation and forever
  - throughout the generations and forever
  rationale: This keeps both duration formulas and their cumulative, solemn force rather than compressing them into a single
    “forever.”
  model_suggested_lexicon_unverified: Leslau, Comparative Dictionary of Ge'ez
  consultation_status: No independently consulted lexicon entry is claimed by this application.
