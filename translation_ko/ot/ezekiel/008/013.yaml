  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: Then he said to me
  chosen_korean: 그러자 그가 제게 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 제게 말했습니다
  - 그러자 그가 제게 이르셨습니다
  lexicon: אמר
  rationale: 서술 연결은 ‘그러자’로 자연스럽게 옮기고, 화자에 대한 존대는 예언자에게 말하는 장면의 문체를 살려 ‘말씀하셨습니다’를 택했습니다.
- source_word: עוֹד
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 한번 더
  lexicon: עוד
  rationale: 반복을 나타내는 기본 의미를 직역성 있게 반영했습니다.
- source_word: גְּדֹל֖וֹת
  english_pob_choice: greater
  chosen_korean: 더 큰
  alternatives_korean:
  - 더 심한
  - 더 위대한
  lexicon: גדול
  rationale: EN POB의 수정판이 ‘greater’를 확정하므로, 비교급을 분명히 살리는 ‘더 큰’으로 옮겼습니다.
- source_word: תּוֹעֵב֥וֹת
  english_pob_choice: abominations
  chosen_korean: 가증한 일들
  alternatives_korean:
  - 가증스러운 것들
  - 역겨운 행위들
  lexicon: תועבה
  rationale: 의례적·윤리적 혐오를 드러내는 המקרא 용례를 따라, 대상이 ‘행위’임을 자연스럽게 보이도록 ‘가증한 일들’로 옮겼습니다.
theological_decisions:
- issue: ‘greater abominations’의 비교 강조
  chosen_reading: ‘더 큰 가증한 일들’로 옮겨, 앞선 환상보다 심각성이 더해지는 누적 구도를 드러냈습니다.
  alternative_readings:
  - ‘더 가증한 일들’
  - ‘심각한 가증한 일들’
  rationale: 본문의 비교급 גְּדֹלֹת을 약화하지 않고, 독자가 계속 악화되는 환상의 흐름을 이해하도록 하기 위함입니다.
  doctrine_reference: '문맥신학: 에스겔 8장의 성전 내 우상숭배 고발'
