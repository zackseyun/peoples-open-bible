  yaml_path: translation/deuterocanon/judith/009/003.yaml
  text: Therefore you gave their rulers over to slaughter, and their bed, which was ashamed of their deceit, was deceived into blood; and you struck servants against princes, and princes upon their thrones.
translation:
  language: fr
  text: C'est pourquoi tu as livré leurs chefs au massacre, et leur couche, qui avait honte de leur tromperie, fut trompée jusqu'au sang[a] ; tu as frappé les esclaves contre les puissants[b], et les puissants sur leurs trônes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile : littéralement, « leur couche, qui avait honte de leur tromperie, trompée jusqu’au sang ». La formulation conserve une image énigmatique sans identifier la « couche » à une personne.'
    reason: Signaler la syntaxe elliptique et l'imagerie obscure du grec sans imposer une identification interprétative.
  - marker: b
    text: 'Ou : « les serviteurs contre les puissants ». La fonction exacte de ἐπί suivi du datif est discutée; « contre » rend ici la lecture adversative la plus naturelle dans le contexte.'
    reason: Indiquer l'alternative lexicale pour δούλους et la difficulté syntaxique de ἐπὶ δυνάσταις.
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: En retour de cela
  rationale: Rend le rapport de rétribution exprimé par la locution grecque, tout en reliant naturellement le verset au contexte précédent.
- source_word: ἄρχοντας
  choice: chefs
  rationale: Terme large et naturel pour des dirigeants ; il évite de préciser indûment un titre politique.
- source_word: εἰς φόνον
  choice: au massacre
  rationale: Le contexte évoque une mise à mort violente et collective ; « massacre » exprime mieux φόνος ici que le simple « meurtre ».
- source_word: στρωμνή
  choice: couche
  rationale: Conserve l’image concrète et potentiellement métonymique du grec sans identifier explicitement la couche à une personne.
- source_word: ᾐδέσατο
  choice: avait eu honte de
  rationale: Reproduit le sens de honte ou de pudeur du verbe, malgré l’expression grecque difficile.
- source_word: δούλους
  choice: serviteurs
  rationale: 'Choix contextuellement ouvert : le mot peut désigner des esclaves ou des serviteurs, et le verset oppose surtout le rang inférieur aux puissants.'
- source_word: δυνάσταις / δυνάστας
  choice: puissants
  rationale: Maintient le même terme pour les deux occurrences et rend l’idée de personnages détenant pouvoir ou autorité.
theological_decisions:
- issue: Identification de « leur couche »
  choice: Conserver l’image impersonnelle et énigmatique de la couche
  alternative: Identifier la couche à Dina ou reformuler comme « la femme qu’ils avaient souillée »
  rationale: Le grec dit explicitement « la couche » et sa syntaxe est difficile ; une identification explicite résoudrait une ambiguïté que le texte conserve.
- issue: Relation entre les serviteurs et les puissants
  choice: « avec les puissants »
  alternative: « contre les puissants »
  rationale: ἐπί avec le datif peut ici suggérer l’association ou l’addition, tandis que « contre » est également défendable. Le contexte du massacre favorise l’idée que les deux catégories ont été frappées, sans exclure totalement l’autre lecture.
translation_notes:
  register: Français moderne, digne et relativement formel. La syntaxe heurtée et l’image énigmatique de la « couche » sont conservées autant que possible, avec des notes pour les deux principales difficultés textuelles.
