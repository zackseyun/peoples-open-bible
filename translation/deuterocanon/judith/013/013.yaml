  from: And they all ran together[a], from the least to the greatest among them, because it seemed astonishing to them that she had come; and they opened the gate and welcomed them. After lighting a fire for light, they gathered around them.
  to: Everyone, from the least to the greatest, came running, astonished that she had returned. They opened the gate and welcomed Judith and her servant. Then they lit a fire to give light and gathered around them.
  rationale: The lexical record rightly preserves the inclusive “least to greatest” and the welcoming sense of the gathering. Although it previously resisted naming the two women, its own explanation establishes their identity, which the main text can now carry without a footnote.
