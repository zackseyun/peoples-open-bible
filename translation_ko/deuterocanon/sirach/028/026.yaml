lexical_decisions:
- source_word: πρόσεχε
  english_pob_choice: Take care
  chosen_korean: 주의하십시오
  alternatives_korean:
  - 조심하십시오
  - 유의하십시오
  lexicon: πρόσεχω
  rationale: 경계와 주의를 요청하는 직설적 권고를 표준적 합쇼체 명령으로 옮겼습니다.
- source_word: μὴ πῶς ὀλισθήσῃς ἐν αὐτῇ
  english_pob_choice: lest you slip by it
  chosen_korean: 그것으로 미끄러지지 않도록
  alternatives_korean:
  - 그 안에서 미끄러지지 않도록
  - 그것에 의해 미끄러지지 않도록
  lexicon: ὀλισθαίνω
  rationale: POB의 ‘by it’에 맞춰 원인/매개보다 ‘그것으로’라는 도구적 표현을 택해, 대상을 지나치며 비틀리는 이미지를 살렸습니다.
- source_word: κατέναντι ἐνεδρεύοντος
  english_pob_choice: before one lying in wait
  chosen_korean: 그 앞에 숨어 있는 자 앞에서
  alternatives_korean:
  - 매복한 자 앞에서
  - 기다리고 있는 자 앞에서
  lexicon: ἐνεδρεύω
  rationale: ἐνεδρεύοντος의 ‘매복하다/숨어 기다리다’ 뜻을 드러내되, 한국어에서 자연스러운 서술로 풀어 옮겼습니다.
theological_decisions:
- issue: 경고문의 수사적 긴급성
  chosen_reading: 지혜문학의 훈계체로서 두 번의 부정 목적절을 살려 경계의 긴박함을 유지했습니다.
  alternative_readings:
  - 단순한 주의 권고로 완화
  - 첫 절만 명령형으로 처리
  rationale: 원문은 연속된 μὴ 절로 위험을 강하게 경고하므로, 한국어에서도 반복 구조를 보존하는 편이 의미 전달에 더 충실합니다.
  doctrine_reference: 지혜문학 수사와 경고의 보존
- issue: in/ by의 관계
  chosen_reading: ἐν αὐτῇ를 ‘그것으로’로 옮겨, 대상에 ‘걸려 넘어지는’ 뉘앙스를 살렸습니다.
  alternative_readings:
  - 그 안에서
  - 그 속에서
  rationale: 영어 POB가 확정한 ‘by it’는 단순 위치보다 매개/계기로서의 관계를 시사하므로, 한국어도 그 긴장을 반영했습니다.
  doctrine_reference: 어휘-통사적 충실성
