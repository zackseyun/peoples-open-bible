  to: And the Levitical priests will never lack a man before me to offer burnt offerings, burn grain offerings, and make sacrifices continually[a].
  rationale: Corrects the covenantal idiom from the apparent survival of one individual to the priesthood never lacking a serving representative. The sacrificial series is made grammatical in English, and the major Old Greek edition difference is documented.
