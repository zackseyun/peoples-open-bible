id: LAM.3.22
reference: Lamentations 3:22
source:
  edition: WLC
  text: חַֽסְדֵ֤י יְהוָה֙ כִּ֣י לֹא תָ֔מְנוּ כִּ֥י לֹא כָל֖וּ רַחֲמָֽי/ו־־׃
translation:
  text: Because of Yahweh’s steadfast love we are not consumed[a], for his mercies never come to an end.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: An alternative textual reading gives, “Yahweh’s steadfast love never ceases.”
    reason: textual_variant
lexical_decisions:
- source_word: חַסְדֵי יְהוָה
  chosen: Yahweh’s steadfast love
  alternatives:
  - Yahweh’s acts of covenant love
  - Yahweh’s loving kindnesses
  lexicon: HALOT
  rationale: The plural construct can denote repeated acts of loyal covenant love; the English abstract singular is idiomatic and preserves the established semantic range.
- source_word: כִּי לֹא תָמְנוּ
  chosen: Because ... we are not consumed
  alternatives:
  - because ... we have not come to an end
  - Yahweh’s steadfast love never ceases
  lexicon: HALOT
  rationale: As vocalized in the supplied WLC, תָמְנוּ is first-person plural. The main text therefore follows the Masoretic reading while the ancient/versional alternative is preserved in a footnote.
- source_word: כִּי לֹא כָלוּ
  chosen: for ... never come to an end
  alternatives:
  - because ... are not finished
  - for ... do not fail
  lexicon: HALOT
  rationale: The second causal particle grounds the first clause, and the negated verb says Yahweh's mercies are never exhausted.
- source_word: רַחֲמָיו
  chosen: his mercies
  alternatives:
  - his compassion
  - his compassions
  lexicon: HALOT
  rationale: The plural expresses abundant or repeated compassionate acts. 'Mercies' remains readable and fits the poetic line.
