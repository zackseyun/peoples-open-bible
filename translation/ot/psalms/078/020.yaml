id: PSA.78.20
reference: Psalms 78:20
source:
  edition: WLC
  text: הֵ֤ן הִכָּה צ֨וּר וַ/יָּז֣וּבוּ מַיִם֮ וּ/נְחָלִ֪ים יִ֫שְׁטֹ֥פוּ הֲ/גַם לֶ֭חֶם י֣וּכַל תֵּ֑ת אִם יָכִ֖ין שְׁאֵ֣ר לְ/עַמּֽ/וֹ־׀־־׃
translation:
  text: True, he struck the rock, and water gushed out; streams surged. But can he also give bread? Can he provide meat for his people?”
  philosophy: dynamic
lexical_decisions:
- source_word: הֵן
  chosen: Indeed
  alternatives:
  - Behold
  - Indeed
  lexicon: HALOT
  rationale: Conveys the emphatic concession in the skeptical argument.
- source_word: הִכָּה
  chosen: struck
  alternatives:
  - smote
  - hit
  lexicon: HALOT
  rationale: Past verbal action describing God's striking of the rock. 'Struck' is natural modern English and suitably forceful.
- source_word: צוּר
  chosen: the rock
  alternatives:
  - a rock
  lexicon: HALOT
  rationale: The noun refers to the specific wilderness rock episode known from Israel's history, so the definite sense is appropriate in English.
- source_word: וַיָּזֻבוּ מַיִם
  chosen: water gushed out
  alternatives:
  - water flowed out
  - waters poured forth
  lexicon: HALOT
  rationale: Uses idiomatic English mass-noun syntax while retaining abundant outflow.
- source_word: וּנְחָלִים יִשְׁטֹפוּ
  chosen: and streams surged
  alternatives:
  - and torrents flooded
  - and wadis swept along
  lexicon: HALOT
  rationale: Preserves forceful flow without adding bank-overflow imagery.
- source_word: הֲגַם
  chosen: Can he also
  alternatives:
  - Can he even
  - Will he also
  lexicon: HALOT
  rationale: Introduces the people's skeptical rhetorical question, with גם adding 'also/even' to extend from water to food provision.
- source_word: לֶחֶם
  chosen: bread
  alternatives:
  - food
  lexicon: HALOT
  rationale: The Hebrew specifically says 'bread.' Retaining 'bread' preserves the concrete wording and the parallel with 'meat' in the next clause.
- source_word: יוּכַל תֵּת
  chosen: give
  alternatives:
  - be able to give
  lexicon: HALOT
  rationale: The modal sense is already carried by 'Can he'; rendering the infinitive simply as 'give' avoids redundancy in English.
- source_word: אִם
  chosen: Can he
  alternatives:
  - if
  lexicon: HALOT
  rationale: Naturally continues the rhetorical interrogation in a second English question.
- source_word: יָכִין
  chosen: provide
  alternatives:
  - prepare
  - establish
  lexicon: HALOT
  rationale: In context of food for the people, the Hiphil carries the sense of making ready/providing. 'Provide' is the clearest contextual rendering.
- source_word: שְׁאֵר
  chosen: meat
  alternatives:
  - flesh
  - food
  lexicon: HALOT
  rationale: The noun literally denotes flesh, here in the sense of edible meat. 'Meat' communicates the intended contrast with bread in natural English; 'flesh' would sound overly literal and potentially misleading.
- source_word: לְעַמּוֹ
  chosen: for his people
  alternatives:
  - for his nation
  lexicon: HALOT
  rationale: עם in this covenantal-historical context is best rendered 'people,' referring to Israel as God's people.
