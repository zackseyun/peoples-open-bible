  language: ko
  text: 그는 수송아지와 함께 반 힌의 기름에 섞은 고운 가루 에바 삼분의 일을 곡식 제물로 드릴지니라[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘세 십분의 일’이다. 제사 규례의 문맥에서는 에바의 십분의 일 세 단위, 곧 에바 삼분의 일을 뜻한다.
    reason: 원문의 수량 표현을 설명하고, 생략된 기준 단위인 에바를 번역에서 보충한 근거를 밝힘.
