  naturalness: 수정문은 현대 표준 한국어의 자연스러운 서술체이며, 합쇼체 종결도 일관됩니다. ‘…에서 올라온 자들이며’와 ‘…가 그들을 이끌었습니다’의 연결도 매끄럽습니다.
  terminology: Θερμέλεθ의 어말 θ는 ‘트’로, Χαρααθαλάν의 χ 및 θ는 각각 ‘카’ 및 ‘타’로 반영하는 것이 그리스어 원문 우선 원칙에 더 부합합니다. Θελερσάς는 ‘테렐사스’로 유지할 수 있습니다.
