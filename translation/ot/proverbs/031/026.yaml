  from: She opens her mouth with wisdom[b][a], and the instruction of kindness is on her tongue.
  to: She opens her mouth with wisdom, and kind instruction is on her tongue[a].
  rationale: “The instruction of kindness” is unnaturally formal and can wrongly make kindness merely the subject of instruction. In context, חֶסֶד characterizes the instruction she habitually offers. “Kind instruction” is a modest, natural rendering that retains both the instructional and benevolent elements; the note supplies a plausible broader nuance.
