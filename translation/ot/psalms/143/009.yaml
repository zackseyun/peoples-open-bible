id: PSA.143.9
reference: Psalms 143:9
source:
  edition: WLC
  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י יְהוָ֗ה אֵלֶ֥י/ךָ כִסִּֽתִי׀׃
translation:
  text: Deliver me from my enemies, O Yahweh; to you I flee for shelter[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew wording is uncertain; possibly, “to you I have hidden myself.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  chosen: Deliver me
  alternatives:
  - Rescue me
  - Save me
  lexicon: HALOT
  rationale: Hiphil imperative of נצל with 1cs suffix, a direct plea for rescue. 'Deliver me' is idiomatic, weighty, and fits psalmic prayer language without over-specifying the manner of rescue.
- source_word: מֵאֹיְבַי
  chosen: from my enemies
  alternatives:
  - from those hostile to me
  lexicon: HALOT
  rationale: The preposition מִן marks separation/source, and אֹיֵב in plural with 1cs suffix is straightforwardly 'my enemies.' A more interpretive paraphrase is unnecessary.
- source_word: יְהוָה
  chosen: O Yahweh
  alternatives:
  - O Yahweh
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: אֵלֶיךָ
  chosen: to you
  alternatives:
  - to you
  lexicon: HALOT
  rationale: Retains the directional force of the preposition rather than assimilating it to the English expression “take refuge in.”
- source_word: כִסִּתִי
  chosen: I flee for shelter
  alternatives:
  - I have hidden myself
  - I have sought shelter
  lexicon: HALOT
  rationale: Gives intelligible English for the likely protective sense while avoiding the awkward and potentially false precision of “I have hidden myself”; the concrete hiding analysis remains in the note.
