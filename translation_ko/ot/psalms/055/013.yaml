  - 자기를 높였다면
  lexicon: HALOT
  rationale: 히필의 גדל은 상대를 향한 자기 과시·교만의 의미를 가지므로, 과도한 장식 없이 ‘스스로를 높이다’로 옮겼습니다.
- source_word: מְשַׂנְאִי
  english_pob_choice: one who hates me
  chosen_korean: 나를 미워하는 자
  alternatives_korean:
  - 나를 미워하는 사람
  - 나를 증오하는 자
  lexicon: HALOT
  rationale: 분사형을 개인적 적대자를 가리키는 자연스러운 한국어 명사구로 옮겼습니다.
theological_decisions:
- issue: 시적 평행구의 조건적·가정법 뉘앙스
  chosen_reading: 두 절 모두 ‘~라면 …할 수 있었을 것입니다’로 옮겨, 실제 상황이 아니라 가정적 대비를 분명히 했습니다.
  alternative_readings:
  - 직설적으로 ‘참을 수 있었습니다’
  - 단순 미래적 어감의 ‘참겠습니다’
  rationale: 시편의 탄식 구조는 실제가 아닌 대비를 강조하므로, 한국어에서도 가정법적 완곡함을 유지하는 것이 의미를 더 정확히 드러냅니다.
  doctrine_reference: 시적 담화의 수사적 구조
