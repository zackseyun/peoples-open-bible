id: JOB.14.4
reference: Job 14:4
source:
  edition: WLC
  text: מִֽי יִתֵּ֣ן טָ֭הוֹר מִ/טָּמֵ֗א לֹ֣א אֶחָֽד־׃
translation:
  text: Who can bring what is clean out of what is unclean? No one.
  philosophy: dynamic
lexical_decisions:
- source_word: מִי
  chosen: Who
  alternatives:
  - Who is it that
  - Who can
  lexicon: HALOT
  rationale: Interrogative pronoun introducing a rhetorical question. English 'Who' preserves the directness of the Hebrew; the modal force is supplied by context and the following verb.
- source_word: יִתֵּן
  chosen: can bring
  alternatives:
  - gives
  - can produce
  - can bring forth
  lexicon: HALOT
  rationale: נתן literally means 'give,' but in this idiom with the rhetorical question and result phrase ('a clean thing from an unclean') it carries the sense of producing or bringing forth. 'Can bring' captures both the idiomatic sense and the implied impossibility.
- source_word: טָהוֹר
  chosen: what is clean
  alternatives:
  - what is clean
  - clean
  lexicon: HALOT
  rationale: The substantival adjective is deliberately nonspecific; this rendering preserves that scope naturally.
- source_word: מִטָּמֵא
  chosen: out of what is unclean
  alternatives:
  - from an unclean thing
  - from what is unclean
  lexicon: HALOT
  rationale: This naturally renders the substantival adjective without adding a person, object, or type of impurity.
- source_word: לֹא אֶחָד
  chosen: No one
  alternatives:
  - Not one
  - There is not one
  lexicon: HALOT
  rationale: Hebrew idiom expressing absolute negation in answer to the rhetorical question. 'No one' is the most natural modern English equivalent; 'Not one' is slightly more formal and is preserved as an alternative.
