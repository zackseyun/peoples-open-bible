lexical_decisions:
- source_word: προχειρισάμενος
  chosen: selected
  alternatives:
  - appointed
  - chose beforehand
  - designated
  lexicon: LSJ
  rationale: The participle denotes choosing or appointing for a task. 'Selected' fits the immediate context and avoids redundancy with the later explicit appointment verb ἀναδείξας.
- source_word: εὐθέως
  chosen: immediately
  alternatives:
  - at once
  - straightway
  lexicon: LSJ
  rationale: Marks prompt action; 'immediately' is clear modern English.
- source_word: τὸν γενόμενον ἐλεφαντάρχην
  chosen: who had become commander of the elephants
  alternatives:
  - who had become elephant commander
  - who had served as commander of the elephant corps
  lexicon: LSJ
  rationale: ἐλεφαντάρχης refers to an officer over war elephants. 'Commander of the elephants' is a natural rendering that preserves the military title without over-paraphrase.
- source_word: στρατηγὸν
  chosen: governor
  alternatives:
  - general
  - commander
  - military governor
  lexicon: LSJ
  rationale: Although στρατηγός often means 'general,' here it is followed by τῆς Ἰουδαίας and describes an office over a region. 'Governor' best conveys the administrative-military role in context.
- source_word: ἀναδείξας
  chosen: appointed
  alternatives:
  - designated
  - installed
  - made
  lexicon: LSJ
  rationale: The verb indicates public designation or appointment to office. 'Appointed' is idiomatic and suits the official context.
- source_word: ἐξαπέστειλεν
  chosen: sent him out
  alternatives:
  - sent him
  - dispatched him
  lexicon: LSJ
  rationale: The compound verb can intensify simple sending. 'Sent him out' preserves that force without sounding overly technical.
