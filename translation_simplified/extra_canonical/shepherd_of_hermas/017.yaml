  yaml_path: translation/extra_canonical/shepherd_of_hermas/017.yaml
  text: 'IX.1. Listen to me, children. I reared you in great simplicity and guilelessness and dignity,
    through the mercy of the Lord, who caused righteousness to drip upon you[a], so that you might be
    made righteous and made holy from all wickedness and from all crookedness[b]. But you do not want
    to depart from your wickedness.


    IX.2. Now then, listen to me and be at peace among yourselves, and look after one another and support
    one another. Do not alone partake of God’s creatures in an overflow of abundance, but share also with
    those who are in want[c].


    IX.3. For some, from their many foods, bring weakness upon the flesh and ruin their flesh; but the
    flesh of those who do not have food is ruined because they do not have enough nourishment, and their
    body is destroyed.


    IX.4. This imbalance, then, is harmful to you who have and do not share with those who lack.


    IX.5. Look to the judgment that is coming. Therefore, you who are well-off, seek out the hungry while
    the tower is not yet finished; for after the tower has been finished you will want to do good, and
    you will not have a place.


    IX.6. So watch, you who pride yourselves in your wealth, lest those in need should groan, and their
    groaning go up to the Lord, and you be shut out together with your goods [which you cannot keep] outside
    the door of the tower[d].


    IX.7. Now I say to you who lead the church and to those who occupy the first seats: do not become
    like poisoners. Poisoners carry their drugs in boxes; but you carry your drug and your poison in your
    heart[e].


    IX.8. You are encrusted and do not wish to cleanse your hearts and to bring your understanding together
    as one in a pure heart, so that you may receive mercy from the great King[f].


    IX.9. Watch then, children, lest these dissensions of yours deprive you of life.


    IX.10. How can you wish to train the Lord’s chosen ones when you yourselves do not have training?
    Train one another and be at peace among them, so that I also, standing joyfully before the Father,
    may give an account on behalf of you all to your Lord[g].'
