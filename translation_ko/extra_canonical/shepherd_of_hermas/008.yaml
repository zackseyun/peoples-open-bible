  text: 'And it was revealed to me, brothers[a], while I was asleep, by a very handsome young man who said to me: “The old woman[c], from whom you received the little book—who do you suppose she is?” I said, “The Sibyl[b].” “You are mistaken,” he says; “she is not.” “Then who is she?” I say. “The Church,” he says. I said to him, “Why then an old woman?” “Because,” he says, “she was created first of all; for this reason she is old, and for her sake the world was set in order[d][g].”


    2. Afterward I saw a vision in my house. The old woman came and asked me whether I had already given the book to the elders[j]. I denied having given it. “You have done well,” she says; “for I have words to add. When, therefore, I complete all the words, through you they will be made known to all the elect.


    3. “So you will write two little booklets, and you will send one to Clement[h] and one to Grapte[i]. Then Clement will send it to the cities outside[e], for this has been entrusted to him; but Grapte will admonish the widows and the orphans. But you will read it aloud[f] in this city together with the elders[j] who preside over the church.”'
translation:
  language: ko
  text: '그리고 내가 잠들어 있을 때, 형제들아, 매우 잘생긴 한 젊은이를 통해 내게 계시가 주어졌습니다. 그가 내게 말했습니다. “네가 그 작은 책을 받은 그 늙은 여자[c]가 누구라고 생각하느냐?” 내가 말했습니다. “무녀 시빌[b]입니다.” “그렇지 않다”고 그가 말했습니다. “그는 그녀가 아니다.” “그렇다면 그녀가 누구입니까?” 내가 말했습니다. “회중입니다”라고 그가 말했습니다. 내가 그에게 말했습니다. “그렇다면 왜 늙은 여자입니까?” “왜냐하면” 그가 말했습니다, “그녀는 만물보다 먼저 창조되었기 때문입니다. 그러므로 그녀는 늙은 여자인 것이며, 그녀를 위해 세상이 질서 있게 마련되었습니다[d][g].”


    2. 그 뒤에 나는 내 집에서 환상을 보았습니다. 그 늙은 여자가 와서 내가 이미 그 책을 장로들[j]에게 주었는지 물었습니다. 나는 그것을 준 적이 없다고 부인했습니다. “잘하셨습니다”라고 그녀가 말했습니다. “내가 덧붙일 말들이 있기 때문입니다. 그러므로 내가 모든 말을 마치면, 너를 통해 그것들이 모든 선택된 자들에게 알려질 것입니다.


    3. “그러니 너는 작은 책 두 권을 써서, 하나는 클레멘트[h]에게, 하나는 그랍테[i]에게 보내십시오. 그러면 클레멘트는 그에게 맡겨진 일이므로 바깥 도시들[e]로 보낼 것입니다. 그러나 그랍테는 과부들과 고아들을 권면할 것입니다. 너는 이 도성에서 교회를 다스리는 장로들과 함께 그것을 소리 내어 읽으십시오[f].”[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ Ἐκκλησία
  english_pob_choice: The Church
  chosen_korean: 회중
  alternatives_korean:
  - 교회
  - 공동체
  lexicon: ἐκκλησία
  rationale: 원문은 제도적 조직보다 ‘불려 모인 회집체’라는 감각이 강하므로, POB의 문맥에 맞춰 ‘회중’으로 옮겨 집합적 의미를 살렸습니다.
- source_word: πρεσβυτέρα
  english_pob_choice: the old woman
  chosen_korean: 늙은 여자
  alternatives_korean:
  - 늙은 여인
  - 노파
  lexicon: πρεσβυτέρα
  rationale: 성별과 연령을 직접 드러내는 표현으로, 비유적 상징을 흐리지 않기 위해 직역에 가깝게 ‘늙은 여자’로 두었습니다.
- source_word: κατηρτίσθη
  english_pob_choice: was set in order
  chosen_korean: 질서 있게 마련되었습니다
  alternatives_korean:
  - 세워졌습니다
  - 정돈되었습니다
  - 갖추어졌습니다
  lexicon: καταρτίζω
  rationale: 단순한 ‘창조’가 아니라 세계가 그녀를 위해 ‘정돈/구성’되었다는 뉘앙스를 살리기 위해 ‘질서 있게 마련되었습니다’로 옮겼습니다.
- source_word: ἀναγνωσῇ
  english_pob_choice: read it aloud
  chosen_korean: 소리 내어 읽으십시오
  alternatives_korean:
  - 낭독하십시오
  - 읽으십시오
  lexicon: ἀναγινώσκω
  rationale: 공적 낭독의 의미를 드러내기 위해 ‘소리 내어 읽으십시오’로 옮겼습니다.
theological_decisions:
- issue: The Church를 어떻게 한국어로 처리할지
  chosen_reading: 회중으로 번역해, 교회 제도보다 ‘모인 하나님의 백성’이라는 의미를 앞세웠습니다.
  alternative_readings:
  - 교회
  - 공동체
  rationale: 본문의 상징은 건물·제도보다 실재적 집합체를 가리키므로, 문맥상 더 직접적인 ‘회중’이 원문의 의도를 잘 드러낸다고 보았습니다.
  doctrine_reference: ecclesiology
- issue: “she was created first of all”와 “for her sake the world was set in order”의 관계
  chosen_reading: ‘만물보다 먼저 창조되었기 때문입니다. 그러므로 그녀는 늙은 여자인 것이며, 그녀를 위해 세상이 질서 있게 마련되었습니다’로 두 문장을 분리해 상징의 이유와 결과를 모두 보존했습니다.
  alternative_readings:
  - ‘모든 것보다 먼저 창조되었으므로 세상이 그녀를 위해 세워졌다’
  - ‘먼저 창조되었기 때문에 세상은 그녀를 위해 만들어졌다’
  rationale: 원문은 선행 창조와 우주 질서의 목적을 나란히 제시하므로, 인과를 분명히 하되 상징적 진술을 과도하게 평탄화하지 않았습니다.
  doctrine_reference: creation theology
