  to: 죽음 가운데에는 주를 기억함이 없으니, 스올[a]에서 누가 주께 감사하겠습니까?
  rationale: 지정된 WLC 본문에 따라 כִּי를 이유를 나타내는 ‘-으니’로, אֵין בַּמָּוֶת זִכְרֶךָ를 ‘죽음 가운데에는 주를 기억함이 없으니’로 옮겼습니다. 이어지는 בִּשְׁאוֹל מִי יוֹדֶה לָּךְ의 수사적 질문을 ‘스올에서 누가 주께 감사하겠습니까?’로 재현했습니다. 이는 사후 상태에 관한 본문의 시적·탄원적 전제를 확대하거나 특정 교리로 해소하지 않습니다.
