  - 왜냐하면 또
  lexicon: nam / et
  rationale: 개정된 영어가 유지한 설명·덧붙임의 연결을 반영해, 단순 병렬보다 이어짐을 보여 주는 ‘또’를 택했습니다.
- source_word: aliquae ex eis
  english_pob_choice: some of them
  chosen_korean: 그들 중 일부는
