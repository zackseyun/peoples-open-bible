translation:
  text: Blessed are you, O Lord, great King and mighty in your greatness, Lord of all heavenly creation[a], King
    of kings and God of all the world. Your sovereign power[b], your kingdom, and your greatness endure forever
    and ever, and your authority endures through every generation. All the heavens are your throne forever, and
    the whole earth is the footstool of your feet forever and ever.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally all the creation of heaven; heavenly creation is a compact rendering of the selected wording.
    reason: lexical_alternative
  - marker: b
    text: Sovereign power renders the selected printed መለኮትከ. Dillmann’s1865 lexicon,column152, gives divine dominion/power
      and directly cites84:2; it also lists divinity/deity as another sense. The present LOW-confidence reading
      of Charles’s edited print follows direct letter-form comparison, not replacement of unclear letters by the
      dictionary head. It does not certify an ancient manuscript spelling. The authority clause has no second written
      verb; English carries endures over from the preceding clause.
    reason: lexical_alternative
  - marker: c
    text: The source preserves the photographed throne form ምንበርከ, beginning with ም rather than normalized initial
      መ; Charles’s printed161note37 records alternative forms. Throne follows the seat/place noun family in Dillmann,columns654-655.
      Footstool follows the actual lexical entry in column873, which directly cites84:2; the wording of another
      biblical passage has not been used to fill this text. The forever-and-ever formulas are retained from both
      printed pages. These are bounded interpretations of the selected edited print, not claims of independent manuscript
      certainty.
    reason: lexical_alternative
