  - 요셉을 양 떼처럼 몰아가시는 분
  lexicon: HALOT
  rationale: נֹהֵג의 목양적 ‘인도하다’를 유지했고, POB의 ‘Joseph’ 보존을 따라 고유명사를 그대로 두었습니다. ‘양 떼 같이’는 집합적 비유를 자연스럽게 살립니다.
- source_word: יֹשֵׁב הַכְּרוּבִים
  english_pob_choice: you who are enthroned above the cherubim
  chosen_korean: 그룹들 위에 좌정하신 분
  alternatives_korean:
  - 그룹들 사이에 좌정하신 분
  - 그룹들 위에 앉으신 분
  lexicon: HALOT
  rationale: יושב은 단순한 ‘앉다’보다 왕권적 좌정의 뜻이 강해 ‘좌정하다’로 옮겼습니다. POB의 주석처럼 공간관계를 과도하게 단정하지 않기 위해 ‘위에’로 두었습니다.
- source_word: הוֹפִיעָה
  english_pob_choice: shine forth
  chosen_korean: 빛나소서
  alternatives_korean:
  - 나타나소서
  - 광채를 드러내소서
  lexicon: HALOT
  rationale: 신현적 동사 הופיע의 발광·현현 의미를 짧고 시적인 한국어로 압축했습니다. ‘빛나소서’는 임재의 드러남과 영광의 광휘를 함께 전달합니다.
theological_decisions:
