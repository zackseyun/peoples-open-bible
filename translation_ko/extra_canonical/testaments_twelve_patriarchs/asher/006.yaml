revisions:
- from: 그러므로 여러분도, 내 자녀들아, 단 한 얼굴로 주님의 계명을 따르며 진리를 따르도록 주의하십시오. 왜냐하면 두 얼굴을 가진 자들은 두 배로 벌을 받기 때문입니다. 그들은 악을 행할 뿐 아니라 그것을 행하는 자들을 승인하며, 속임수의 영들을 본받아 사람들과 맞서 싸웁니다. 그러므로 여러분, 내 자녀들아, 주님의 율법을 지키십시오. 그리고 악을 선으로 여기지 마십시오. 오히려 참으로 선한 것을 바라보고, 주님의 모든 계명 안에서 그것을 지키며, 그 안에서 행하고 그 안에서 쉬십시오. 사람의 마지막은 그들의 의를 드러내며, 주님의 천사들과 벨리알의 천사들에게 알려집니다. 악한 혼이 떠날 때에는, 그것이 욕정과 악한 행위들 가운데서 섬겼던 악한 영에게서 고통을 받습니다. 그러나 그것이 기쁨 가운데 평온하면, 평화의 천사를 알고 그 안에서 기뻐하며, 죽을 때 그가 그것을 영원한 생명으로 인도합니다. 그리고 그것은 죄인들의 혼처럼 벨리알의 멸망에 이르지 않습니다. 그러므로 여러분은 마지막 때에 진리의 아들들이 속임수의 영들과 벨리알에게서 벗어나지만, 불법의 아들들은 멸망할 것임을 보십시오. 뒤의 자들은 혼들을 혼란 속에서 벨리알에게 넘겨줄 것이나, 앞의 자들은 기쁨 가운데 발견될 것입니다. 단 한 얼굴을 가진 자들마다 「나는 주 편이다」라고 말할지라도 벨리알을 섬기며, 그의 일들은 악한 자에게로 갑니다. 그러므로 내 자녀들아, 모든 것에는 두 길이 있다는 것을 확신하십시오. 하나는 선의 길이고 다른 하나는 악의 길입니다. 그리고 이 길들 안에는 그것들을 분별하는 우리의 가슴에 있는 두 성향이 있습니다. 그러므로 혼이 선을 기뻐하면 그 모든 행위는 의 안에 있습니다. 그리고 죄를 지으면 곧바로 회개합니다. 왜냐하면 의에 마음을 두고 악을 미워하여, 악을 내던지고 죄를 뿌리째 뽑기 때문입니다. 그러나 그것이 악으로 기울면 그 모든 행위는 악함 가운데 있으며, 선을 밀어내고 악에 매달리며, 벨리알의 지배를 받습니다. 심지어 선한 일을 하더라도 그것을 악을 향해 비틀어
    버립니다. 그것이 선을 행하기 시작할 때에는 행위의 끝을 악으로 가져가니, 그 성향의 보물이 악한 영으로 가득 차 있기 때문입니다. 어떤 이는 도둑질하고, 불의하게 대하고, 약탈하고, 속이고도 가난한 이들을 불쌍히 여길 수 있습니다. 이것도 두 얼굴이지만, 전체는 악합니다. 이웃을 속이는 자는 하나님을 격동시키고 지극히 높으신 분으로 거짓 맹세하면서도 가난한 이를 불쌍히 여깁니다. 율법을 주신 주님을 업신여기고 격동시키면서도, 가난한 이를 시원하게 해 줍니다. 그는 혼을 더럽히고 몸을 즐겁게 하며, 많은 사람을 죽이고 몇몇에게는 자비를 베풉니다. 이것도 두 얼굴입니다. 또 어떤 이는 간음도, 음행도 하지 않고 음식도 삼가지만, 금식할 때 악을 행하며 자기 권력과 재산으로 많은 사람을 무너뜨리고, 지나친 선함을 보이면서도 불법을 행합니다. 이것도 두 얼굴입니다. 그런 사람들은 발굽이 갈라진 것처럼 깨끗해 보이는 토끼이지만, 실제로는 부정합니다. 왜냐하면 하나님께서 계명의 판들에 말씀하셨기 때문입니다. 그러나 내 자녀들아, 주님의 천사들을 알아보지 못하고 영원히 멸망한 소돔처럼 되지 마십시오. 내가 알기에는, 너희가 죄를 짓고 원수들의 손에 넘겨질 것입니다. 너희 땅은 황폐해지고, 너희 성소들은 파괴되며, 너희는 땅 사방으로 흩어질 것입니다. 그리고 너희는 흩어진 곳에서 사라지는 물처럼 여겨질 것입니다. 그러나 지극히 높으신 분이 땅을 방문하실 때까지는 그럴 것입니다. 그분은 사람으로 오셔서, 사람들이 먹고 마시는 가운데 물속에서 용의 머리를 치실 것입니다. 그분은 이스라엘과 모든 민족을 구원하실 것이니, 하나님께서 사람의 모습으로 말씀하시는 것입니다. 그러므로 이런 일들을 너희 자녀들에게도 말하여, 그들로 하여금 그에게 불순종하게 하십시오. 내가 알기에는 그들이 반드시 불법을 행하고 하나님의 율법이 아니라 사람들의 계명에 귀를 기울이지 않을 것이며, 바람에 날리는 잎처럼, 그리고 물이 흩어지듯 흩어질 것입니다. 그러나 내 자녀들아, 너희가 주님의 계명에 따라
    거룩함 가운데 행하면, 다시 안전하게 거주하게 될 것이며, 온 이스라엘이 주님께 모일 것입니다.[a]
