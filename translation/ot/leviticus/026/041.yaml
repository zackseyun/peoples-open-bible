  from: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
  to: so that I in turn acted in hostility toward them and brought them into the land of their enemies—if then[a] their uncircumcised heart[b] is humbled and they accept the punishment for their iniquity[c],
  rationale: The existing wording preserves the Hebrew’s difficult sequence but leaves its logic unclear in English. The literary connection between confession and remembrance warrants a clearer conditional reading, while the history’s covenant-heart metaphor and judicial sense of accepting punishment are retained.
