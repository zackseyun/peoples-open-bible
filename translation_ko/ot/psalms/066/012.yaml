base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/012.yaml
  text: You made a man ride over our heads; we went through fire and through water, yet you brought us out into abundance.
translation:
  language: ko
  text: 주께서는 우리 머리 위로 사람이 타고 지나가게 하셨습니다.[a] 우리는 불과 물을 지나갔으나,[b] 주께서는 우리를 풍성한 곳으로 이끌어 내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “한 사람이 우리 머리 위로 타고 지나가게 하셨습니다”입니다.
    reason: source_note
  - marker: b
    text: “불과 물”은 환난의 대표적 병렬 이미지입니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֱנוֹשׁ
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 사람
  - 인간
  lexicon: אֱנוֹשׁ
  rationale: POB가 단수 표현인 “a man”으로 되돌린 점을 따라, 특정한 인물 한 명을 가리키는 단수성을 살리되 한국어에서는 가장 자연스러운 ‘사람’으로 옮겼습니다.
- source_word: לְרֹאשֵׁנוּ
  english_pob_choice: over our heads
  chosen_korean: 우리 머리 위로
  alternatives_korean:
  - 우리 위로
  - 우리 머리 위에
  lexicon: רֹאשׁ
  rationale: 머리(=정수리) 위를 지나가는 압박 이미지를 살리기 위해 직역에 가까운 ‘우리 머리 위로’를 택했습니다.
- source_word: בָּאנוּ בָאֵשׁ וּבַמַּיִם
  english_pob_choice: we went through fire and through water
  chosen_korean: 우리는 불과 물을 지나갔으나
  alternatives_korean:
  - 우리는 불과 물을 통과했으나
  - 우리는 불과 물 가운데로 들어갔으나
  lexicon: בּוֹא + אֵשׁ/מַיִם
  rationale: 병행 구조를 보존하면서 시적 관용인 ‘지나가다’를 사용해 고난의 통과 이미지를 자연스럽게 전달했습니다.
- source_word: לָרְוָיָה
  english_pob_choice: into abundance
  chosen_korean: 풍성한 곳으로
  alternatives_korean:
  - 넉넉한 곳으로
  - 풍요로움으로
  lexicon: רְוָיָה
  rationale: 히브리어는 단순한 ‘결과 상태’보다 물로부터 건져 충분히 채워진 상태를 암시하므로, 한국어에서는 장소성도 살려 ‘풍성한 곳으로’로 옮겼습니다.
theological_decisions:
- issue: 단수 표현 אֱנוֹשׁ의 보존
  chosen_reading: ‘사람’으로 단수성을 유지해 고난의 주체를 일반화하지 않고 한 사람으로 제시했습니다.
  alternative_readings:
  - ‘사람들’로 복수화
  - ‘인간’으로 일반화
  rationale: English POB의 복구된 단수 표기를 따라 본문이 말하는 압제의 강도를 흐리지 않도록 했습니다.
  doctrine_reference: 시편 66:12 본문 관찰
- issue: ‘풍성한 곳’의 의미
  chosen_reading: ‘풍성한 곳으로’는 해방 이후의 넉넉함과 회복을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘풍요로움으로’
  - ‘넉넉함으로’
  rationale: 히브리어의 רְוָיָה는 단순한 생존 회복을 넘어 충만한 상태를 가리킬 수 있어, 시편의 구원-회복 대조를 살렸습니다.
  doctrine_reference: 시편의 구원-회복 묘사
