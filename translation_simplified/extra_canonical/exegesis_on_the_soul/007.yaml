translation:
  language: en
  text: 'In the beginning, God would not have come to Israel’s aid and rescued them from Egypt, where they were enslaved, if they had not groaned and cried out to him because of their cruel oppression.


    Again, it is written in the Psalms:


    “I am worn out from groaning.

    Every night I soak my bed

    and drench my couch with tears.

    I have grown old among all my enemies.


    Go away from me, all you who do evil,

    for the Lord has heard my weeping.

    The Lord has accepted my prayer.”

    (Psalm 6:6–9)


    If we repent[a], God will surely hear us. He is patient and full of mercy. Glory belongs to him forever and ever. Amen!


    The Exegesis on the Soul'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Restore repentance in the souls return, preserving its explicit sorrow, confession and distinctive allegory; this is English-witness editing, not fresh ancient-language certification.
    reason: lexical_alternative
