id: PSA.20.6
reference: Psalms 20:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְרַנְּנָ֤ה בִּ֘/ישׁ֤וּעָתֶ֗/ךָ וּ/בְ/שֵֽׁם אֱלֹהֵ֥י/נוּ נִדְגֹּ֑ל יְמַלֵּ֥א יְ֝הוָ֗ה כָּל מִשְׁאֲלוֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/006.yaml
  text: Now I know that Yahweh saves his anointed; he answers him from his holy heaven with the mighty saving deeds of his right hand.
  footnotes:
  - marker: a
    text: Or 'in your victory' or 'in your deliverance.' The Hebrew term can refer to salvation in a broad sense, including rescue or military victory.
    reason: lexical_alternative
  - marker: b
    text: Or 'we will set up our banner.' The Hebrew verb likely evokes the raising or displaying of banners in celebration.
    reason: lexical_alternative
  - marker: c
    text: Or 'The LORD will fulfill all your requests.' The Hebrew form may be read as either a wish/prayer or a future statement, though the prayer sense fits the context well.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 나는 압니다. 야훼께서 그의 기름부음 받은 이를 구원하셨습니다. 그분은 자신의 거룩한 하늘에서 그의 오른손으로 이루시는 능력 있는 구원으로 그에게 응답하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְרַנְּנָה
  english_pob_choice: We will shout for joy
  chosen_korean: 기뻐 외치고
  alternatives_korean:
  - 기뻐 노래하고
  - 기뻐 소리치고
  lexicon: HALOT
  rationale: רנן의 기쁨에 찬 외침을 현대 한국어로 자연스럽게 옮기기 위해 ‘기뻐 외치다’를 택했습니다. ‘노래하다’는 본문이 요구하지 않는 요소를 덧붙일 수 있습니다.
- source_word: בִּישׁוּעָתֶךָ
  english_pob_choice: in your salvation
  chosen_korean: 주의 구원으로 인해
  alternatives_korean:
  - 주의 승리로 인해
  - 주의 구원 안에서
  lexicon: HALOT
  rationale: ישועה는 구원, 구출, 승리를 모두 포괄할 수 있으므로, 시편의 군사적 맥락을 살리되 의미를 지나치게 좁히지 않기 위해 ‘구원’으로 옮겼습니다. 한국어에서는 결과 원인을 드러내는 ‘~로 인해’가 자연스럽습니다.
- source_word: נִדְגֹּל
  english_pob_choice: we will raise our banners
  chosen_korean: 우리 깃발을 세우겠습니다
  alternatives_korean:
  - 우리 깃발을 들어 올리겠습니다
  - 우리 깃발을 높이겠습니다
  lexicon: HALOT
  rationale: דגל의 깃발/표준을 들어 올리는 이미지를 살려 ‘깃발을 세우다’로 옮겼습니다. 한국어 ‘세우다’는 기념적·공적 표시의 뉘앙스를 함께 담을 수 있습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다. 이는 주(主)라는 대체어보다 원문 고유명을 더 직접적으로 드러냅니다.
- source_word: כָּל מִשְׁאֲלוֹתֶיךָ
  english_pob_choice: all your requests
  chosen_korean: 당신의 모든 요청
  alternatives_korean:
  - 당신의 모든 간구
  - 당신의 모든 소원
  lexicon: HALOT
  rationale: מִשְׁאֲלוֹת은 ‘요청된 것들’에 가깝기 때문에, 기도문맥을 유지하면서도 뜻을 분명히 하는 ‘요청’이 적절합니다.
theological_decisions:
- issue: יְמַלֵּא의 문법 기능과 화용
  chosen_reading: 청원적/축복적 뉘앙스의 현재적 기원 — ‘야훼께서 … 이루시기를 빕니다’
  alternative_readings:
  - 단순 미래 — ‘야훼께서 … 이루실 것입니다’
  rationale: 시편의 예배적·간구적 문맥에서는 예언적 선언보다 축복과 기원의 말로 읽는 것이 더 자연스럽습니다. 한국어에서도 이를 드러내기 위해 ‘빕니다’를 사용했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve discourse force without flattening the Hebrew imperfect.'
