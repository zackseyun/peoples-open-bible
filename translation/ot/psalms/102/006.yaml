id: PSA.102.6
reference: Psalms 102:6
source:
  edition: WLC
  text: דָּ֭מִיתִי לִ/קְאַ֣ת מִדְבָּ֑ר הָ֝יִ֗יתִי כְּ/כ֣וֹס חֳרָבֽוֹת׃
translation:
  text: I am like a desert bird[a]; I have become like an owl among the ruins.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The bird’s identity is uncertain; traditional renderings include 'pelican' and 'desert owl.'
    reason: alternative_reading
lexical_decisions:
- source_word: דָּמִיתִי
  chosen: I am like
  alternatives:
  - I resemble
  - I have become like
  lexicon: HALOT
  rationale: From דמה in the qal, here expressing comparison/similitude. English present 'I am like' reads naturally in poetic parallelism, though the perfect can also carry a stative/resultative nuance.
- source_word: לִקְאַת
  chosen: a desert bird
  alternatives:
  - a pelican
  - a jackdaw
  lexicon: HALOT
  rationale: A generic bird term avoids unsupported identification while retaining the modifier supplied by the context.
- source_word: מִדְבָּר
  chosen: desert
  alternatives:
  - wilderness
  lexicon: HALOT
  rationale: מִדְבָּר denotes uncultivated open land; 'desert' is concise and idiomatic here, though 'wilderness' is also possible.
- source_word: הָיִיתִי
  chosen: I have become like
  alternatives:
  - I was like
  - I am like
  lexicon: HALOT
  rationale: From היה, the perfect here can mark resultant state. 'I have become like' preserves the sense of entering into this condition and gives slight variation matching the Hebrew parallelism.
- source_word: כְּכוֹס
  chosen: an owl
  alternatives:
  - a little owl
  - an owl of the waste places
  lexicon: HALOT
  rationale: כּוֹס here is the bird name, not the common noun 'cup.' The exact species is uncertain; a general 'owl' is clear modern English and suits the nocturnal, solitary image.
- source_word: חֳרָבוֹת
  chosen: among the ruins
  alternatives:
  - of the ruins
  - in ruined places
  - of desolations
  lexicon: HALOT
  rationale: Plural of חָרְבָּה/חורבה, denoting ruins or desolate places. 'Among the ruins' makes the image natural in English while preserving the setting of devastation.
