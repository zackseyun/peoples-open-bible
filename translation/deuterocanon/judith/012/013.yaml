  text: καὶ ἐξῆλθεν Βαγώας ἀπὸ προσώπου Ὀλοφέρνου, καὶ εἰσῆλθεν πρὸς αὐτὴν καὶ εἶπεν Μὴ ὀκνήσῃς δὴ ἡ παιδίσκη ἡ καλὴ αὕτη ἐλθοῦσα πρὸς τὸν κύριόν μου δόξασθῆναι κατὰ πρόσωπον αὐτοῦ, καὶ πίεσαι μεθʼ ἡμῶν εἰς εὐφροσύνην οἴνου, καὶ γενηθήναι ἐν τῇ ἡμέρᾳ ταύτῃ ὡς θυγάτηρ μία τῶν υἱῶν Ἀσσούρ αἱ παρεστηκυῖαι ἐν οἴκῳ Ναβουχοδονόσορ.
