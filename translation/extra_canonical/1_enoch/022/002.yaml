translation:
  text: Within it were four places, “beautiful,” deep, wide, and very smooth.[a] (Three of them were dark and one
    bright, with a spring of water in its midst. I said:)[b] How smooth—rolling—and deep and dark to look at![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected main text explicitly says four. Its daggered adjective ሠናያት means beautiful or fine (Dillmann1865
      cols251–252), but Charles printed56 note12 regards it as corrupt and explains it through a Greek confusion
      involving hollows. This English retains the actual adjective in quotation marks rather than silently changing
      it to a hollow or compartment.
    reason: textual_variant
  - marker: b
    text: The parenthesized sentence, including I said, is printed in the selected main text but supplied by the
      editor from the Greek (Charles printed56 note15). Parentheses here preserve that editorial status; this is
      not an independently witnessed Ethiopic sentence.
    reason: textual_variant
  - marker: c
    text: The rolling expression is daggered as corrupt in the selected text (Charles printed56 note16). The root
      relates to rolling or causing to roll (Dillmann1865 col838, including Hen22:2); the short English rolling
      is only a qualified rendering of the damaged clause, not a restoration of its syntax or a claim that this
      means a cavern.
    reason: textual_variant
