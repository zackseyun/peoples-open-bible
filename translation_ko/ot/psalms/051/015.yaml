base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/015.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation, and my tongue will sing aloud of your righteousness[b].
  footnotes:
  - marker: a
    text: Or 'will turn to you' or 'will turn back to you.' The Hebrew verb can express both turning and returning.
