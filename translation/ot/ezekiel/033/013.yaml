  meaning_decisions:
  - source_phrase: בְּאָמְרִי לַצַּדִּיק חָיֹה יִחְיֶה
    prior_rendering: When I say to the righteous man, ‘He shall surely live,’
    new_rendering: If I tell a righteous man that he will surely live
    rationale: The verse presents a conditional warning. Indirect speech makes clear that the assurance concerns the man being addressed, while retaining the emphatic certainty of ‘surely live.’
  - source_phrase: וְהוּא בָטַח עַל צִדְקָתוֹ וְעָשָׂה עָוֶל
    prior_rendering: and he trusts in his righteousness and does injustice
    new_rendering: but he trusts in his righteousness and commits injustice
    rationale: ‘But’ expresses the contrast between the assurance of life and the man’s subsequent conduct; ‘commits injustice’ is natural English for the wrongdoing described.
  - source_phrase: כָּל צִדְקֹתָו לֹא תִזָּכַרְנָה
    prior_rendering: none of his righteous deeds will be remembered
    new_rendering: none of his righteous deeds will be remembered in his favor
    rationale: The context concerns whether earlier righteousness will deliver him from judgment, not whether those deeds will literally be forgotten. ‘In his favor’ clarifies that judicial meaning while preserving the language of remembrance.
  - source_phrase: וּבְעַוְלוֹ אֲשֶׁר עָשָׂה בּוֹ יָמוּת
    prior_rendering: but by the injustice that he has done he shall die
    new_rendering: he will die because of the injustice he has committed
    rationale: The injustice is the basis for his death. ‘Because of’ states that relationship clearly without reproducing the Hebrew’s redundant reference to it.
