  text: καὶ ἐπορεύθησάν τινες μισοῦντες τὸ ἔθνος αὐτῶν, ἄνδρες παράνομοι, πρὸς τὸν βασιλέα, καὶ ἀπήγγειλαν αὐτῷ ὅτι Ἰωνάθαν περικάθηται τὴν ἄκραν.
