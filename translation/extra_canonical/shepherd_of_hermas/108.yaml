translation:
  text: '“The others, who remained round and were not fitted into that structure because
    they had not yet received the seal, were put back in their own place, for they
    were found to be very round.”


    2. “This world and the vanities of their wealth must be cut away from them. Then
    they will fit into God’s kingdom. They must enter God’s kingdom, for the Lord
    has blessed this innocent kind. No one of this kind, therefore, will perish. Even
    if one of them, tempted by the utterly wicked devil, commits some offense, that
    person will quickly return to their Lord.”


    3. “I, the messenger of repentance, declare all of you blessed who are innocent
    like infants, for your portion is good and honored before God.”


    4. “I tell all of you who have received this seal to be sincere, to hold no grudges,
    and not to persist in your wickedness or in bitter remembrance of offenses. Become,
    each of you, of one spirit,[a] heal these evil divisions and remove them from
    among you, so that the Lord of the flock may rejoice over them.”


    5. “He will rejoice if he finds them all healthy. But if he finds any of them
    ruined,[b] woe to the shepherds!”


    6. “And if the shepherds themselves are found ruined, what answer will they give
    for this flock?[c] Will they say that the flock mistreated them? They will not
    be believed. It is incredible that a shepherd could suffer at the hands of the
    flock, and the shepherd will be punished more severely for lying. I too am a shepherd,
    and I must give a most exacting account of you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: The unusual printed Latin in unum quemque spiritum fieri is rendered as
      each becoming of one spirit. “Be united in spirit” is another way to express
      the contextual sense. The source wording has not been silently emended. Permediare
      is also retained in Latin; “heal” renders its remedial force beside removing
      divisions.
  - marker: b
    reason: lexical_alternative
    text: Dissipata/dissipati can describe being scattered, broken up or ruined. The
      healthy flock and accountable shepherds give the image a moral force; “ruined”
      retains that force without making this simply a report of geographically missing
      sheep.
  - marker: c
    reason: textual_variant
    text: “For” corresponds to bracketed [pro], supplied in the working edition from
      the reported pseudo-Cyprian De aleatoribus 2 quotation and absent from the cited
      Vulgata manuscripts. The quotation is an indirect witness; no fresh collation
      of its manuscripts is claimed.
lexical_decisions:
- source_word: paenitentia
  chosen: repentance
  alternatives:
  - penance
  - change of mind
  rationale: Moral return and corrected conduct in context, without inserting a later
    penitential institution.
- source_word: memoria offensarum
  chosen: grudges / remembrance of offenses
  alternatives:
  - memory of wrongs
  rationale: Preserve the sustained resentment condemned here, not an instruction
    to erase all recollection of harm.
- source_word: ex hoc genere non intercidet quisquam
  chosen: no one of this kind will perish
  alternatives:
  - none will perish
  rationale: Keep the explicit innocent-kind restriction; do not expand it into a
    claim about all humanity.
- source_word: sigillum
  chosen: seal
  alternatives:
  - baptism
  rationale: Preserve the allegorical term here rather than replacing it with its
    sacramental interpretation.
