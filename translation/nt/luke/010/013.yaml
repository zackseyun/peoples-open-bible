  chosen_reading: Rendered as "mighty works" rather than the more interpretive "miracles."
  alternative_readings:
  - miracles
  - works of power
  rationale: The verse refers to extraordinary acts evidencing divine power, but the Greek term itself emphasizes power/deeds. "Mighty works" preserves that nuance without reducing the term to a later technical category.
  doctrine_reference: Translation philosophy §1, §5
- issue: Contextual repentance reassessment
  chosen_reading: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Restore repented in the counterfactual response of Tyre and Sidon; keep sackcloth and ashes so sorrow is not excluded.
