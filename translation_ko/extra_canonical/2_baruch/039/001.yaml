  english_pob_choice: interpretation
  chosen_korean: 해석
  alternatives_korean:
  - 풀이
  - 설명
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 환상 자체를 푸는 행위라는 점을 가장 직접적으로 드러내는 표준어입니다.
- source_word: ܚܙܘܐ / vision
  english_pob_choice: vision
  chosen_korean: 환상
  alternatives_korean:
  - 묵시
  - 계시
  - 이상
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 이 단락은 종말론적 장면을 보여 주는 묵시 문맥이지만, 한국어에서는 본문이 말하는 ‘보인 장면’을 자연스럽게 살리기 위해 ‘환상’을 택했습니다.
- source_word: ܥܢܐ ܘܐܡܪ ܠܝ / answered and said to me
  english_pob_choice: he answered and said to me
  chosen_korean: 그가 내게 대답하며 말했습니다
  alternatives_korean:
  - 그가 내게 응답하여 말했습니다
  - 그가 내게 답하여 말했습니다
  lexicon: Syriac narrative formula
  rationale: 서술 공식의 반복을 살리되, 현대 한국어에서 가장 자연스러운 연결 구조로 옮겼습니다.
- source_word: ܒܪܡ / But
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그런데
  - 다만
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 앞선 문맥과 대비를 분명히 하는 접속으로 기능하므로 ‘그러나’가 가장 무난합니다.
theological_decisions:
- issue: 환시 해석이라는 화자의 자기지시적 도입을 어떻게 처리할 것인가
  chosen_reading: 본문의 화법을 그대로 따라, 해석을 시작하는 도입문으로만 옮기고 추가 설명은 넣지 않았습니다.
  alternative_readings:
  - '''이것이 네가 본 환상의 뜻이다''처럼 풀어 설명하는 번역'
  - '''환시의 의미는 이러하다''처럼 의역하는 번역'
  rationale: 원문은 해석의 서두만 제시하므로, 본문이 말하는 범위를 넘겨 해설체로 확장하지 않았습니다.
  doctrine_reference: 원문 우선, 과잉설명 회피
