  to: But I tell you that everyone who is angry with a brother or sister[a] will be subject to judgment. Whoever says to a brother or sister, ‘You good-for-nothing[b]!’ will be answerable to the Jewish council, and whoever says, ‘You fool!’ will be subject to the fire of hell[c].
