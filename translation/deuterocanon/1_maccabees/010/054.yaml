translation:
  text: let us establish friendship with one another[a]. Now give me your daughter in marriage, and I will become your son-in-law. I will give both you and her gifts worthy of your rank.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “let us establish friendship with him,” apparently referring to Ptolemy, who is addressed directly in the rest of the verse.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνστήσωμεν
  chosen: let us establish
  alternatives:
  - let us make
  - let us confirm
  lexicon: LSJ
  rationale: The hortatory subjunctive calls for a volitional proposal. 'Establish' fits the sense of setting up or forming a relationship and reads naturally in English with 'friendship.'
- source_word: φιλίαν
  chosen: friendship
  alternatives:
  - alliance
  - friendly relations
  lexicon: LSJ
  rationale: The core sense is 'friendship.' In this diplomatic context it carries political overtones, but the Greek noun itself is not more technical than that, so 'friendship' preserves the wording while allowing the context to imply alliance.
- source_word: δός μοι τὴν θυγατέρα σου εἰς γυναῖκα
  chosen: give me your daughter as a wife
  alternatives:
  - give me your daughter in marriage
  - give your daughter to me as wife
  lexicon: LSJ
  rationale: This reflects the idiomatic marriage formula literally enough to preserve the transactional and dynastic tone of the Greek while remaining clear in modern English.
- source_word: ἐπιγαμβρεύσω
  chosen: I will become related by marriage to you
  alternatives:
  - I will marry into your family
  - I will make a marriage alliance with you
  lexicon: LSJ
  rationale: The verb denotes entering into an in-law relationship through marriage. 'Become related by marriage to you' is slightly fuller but accurately expresses the interpersonal and dynastic sense without reducing it merely to the act of marrying the daughter.
- source_word: δόματα
  chosen: gifts
  alternatives:
  - wedding gifts
  - presents
  lexicon: LSJ
  rationale: The noun broadly means gifts. 'Wedding gifts' is possible from context, but the Greek does not specify that explicitly, so the more general 'gifts' is preferred.
- source_word: ἄξιά σου
  chosen: worthy of you
  alternatives:
  - befitting you
  - appropriate to your rank
  lexicon: LSJ
  rationale: The phrase indicates gifts commensurate with the father's status or dignity. 'Worthy of you' is a close rendering that preserves the personal address and implied honor.
