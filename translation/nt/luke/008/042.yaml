  meaning: Jairus pleads because his only child, a daughter about twelve years old, is dying, and crowds press closely around Jesus as he goes.
  meaning_decisions:
  - source_phrase: θυγάτηρ μονογενὴς ἦν αὐτῷ
    prior_rendering: he had an only daughter
    new_rendering: his only child, a daughter
    rationale: In Luke's family narratives, μονογενής identifies an only child; 'only daughter' could misleadingly leave readers imagining that Jairus also had sons.
  - source_phrase: Ἐν δὲ τῷ ὑπάγειν αὐτόν
    prior_rendering: And as he went
    new_rendering: As Jesus went
    rationale: Naming Jesus makes the change of subject from Jairus unmistakable.
