id: PSA.73.7
reference: Psalms 73:7
source:
  edition: WLC
  text: יָ֭צָא מֵ/חֵ֣לֶב עֵינֵ֑/מוֹ עָ֝בְר֗וּ מַשְׂכִּיּ֥וֹת לֵבָֽב׃
translation:
  text: Their eyes bulge from fatness; the imaginings of their hearts know no bounds[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'the desires of their hearts know no bounds.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָצָא
  chosen: bulge out
  alternatives:
  - come out
  - protrude
  - go out
  lexicon: HALOT
  rationale: The verb literally means 'go out/come out,' but with 'eyes' and 'from fatness' the idiom describes protruding or bulging eyes caused by prosperity or grossness. 'Bulge out' conveys the concrete image in natural English better than a wooden 'come out.'
- source_word: מֵחֵלֶב
  chosen: from fatness
  alternatives:
  - from fat
  - from their fat
  - with fatness
  lexicon: HALOT
  rationale: חֵלֶב literally denotes 'fat.' In this poetic context it signifies excessive prosperity or corpulence. 'From fatness' preserves the metaphorical-corporeal image without over-interpreting it as merely wealth.
- source_word: עֵינֵימוֹ
  chosen: their eyes
  lexicon: HALOT
  rationale: Straightforward plural construct with 3mp suffix; rendered idiomatically as 'their eyes.'
- source_word: עָבְרוּ
  chosen: overflow
  alternatives:
  - surpass
  - go beyond
  - overflow their bounds
  lexicon: HALOT
  rationale: The verb denotes passing over or beyond. Used intransitively here with the preceding plural noun as its natural subject, “overflow” idiomatically expresses excess while the footnote gives the alternative “exceed all bounds.”
- source_word: מַשְׂכִּיּוֹת
  chosen: imaginings
  alternatives:
  - devices
  - fancies
  - thoughts
  - images
  lexicon: HALOT
  rationale: The rare noun can refer to images or mental conceptions and may contextually suggest thoughts, desires, or plans; “imaginings” preserves that breadth better than the narrower “fantasies.”
- source_word: לֵבָב
  chosen: their heart
  alternatives:
  - the heart
  - their mind
  lexicon: HALOT
  rationale: 'Though the suffix is not separately expressed on לֵבָב, the phrase is naturally understood in relation to the wicked under discussion: the imaginations belonging to their heart. Singular ''heart'' is retained as the Hebrew collective singular.'
- source_word: יָצָא מֵ/חֵלֶב עֵינֵ/מוֹ
  chosen: Their eyes bulge from fatness
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This naturally conveys the concrete Hebrew image of the eyes coming out or protruding because of fatness, without reducing fatness solely to wealth.
