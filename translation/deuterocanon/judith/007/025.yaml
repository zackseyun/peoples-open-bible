id: JDT.7.25
reference: Judith 7:25
source:
  edition: lxx-swete-1909
  text: καὶ νῦν οὐκ ἔστιν ὁ βοηθὸς ἡμῶν, ἀλλὰ πέπρακεν ἡμᾶς ὁ θεὸς εἰς τὰς χεῖρας αὐτῶν τοῦ καταστρωθῆναι ἐναντίον αὐτῶν ἐν δίψει καὶ ἀπωλείᾳ μεγάλῃ.
  language: Greek
