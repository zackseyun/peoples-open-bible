  from: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
  to: You put all things under his feet.” For in subjecting all things to him[a], God left nothing out. But at present we do not yet see all things subject to him.
