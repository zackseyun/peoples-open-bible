translation:
  text: Enoch, scribe of righteousness, go and tell the Watchers of heaven, who left the high heaven—the holy, eternal dwelling place—and defiled themselves with women, acted as human beings do, took wives for themselves,[a] and became deeply corrupt on the earth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Geʿez word can mean “women” or “wives.” Here, taking them for themselves supports “wives.”
    reason: lexical_alternative
  - marker: b
    text: The printed wording describes their own corruption. Charles suggests correcting the verb to give the sense “caused great corruption”; that correction is not adopted here.
    reason: textual_variant
lexical_decisions:
- source_word: ጸሓፌ፡ ጽድቅ
  chosen: scribe of righteousness
  alternatives:
  - righteous scribe
  rationale: Preserves the source’s noun-and-genitive construction.
- source_word: ትጉሃነ፡ ሰማይ
  chosen: Watchers of heaven
  alternatives:
  - heavenly watchers
  rationale: Retains the group designation and its explicit connection to heaven.
- source_word: ምቅዋመ፡ ቅዱሰ፡ ዘለዓለም
  chosen: the holy, eternal dwelling place
  alternatives:
  - the holy, eternal station
  rationale: Renders the heavenly place of abiding in readable English while noting the more literal spatial sense.
- source_word: ከመ፡ ይገብሩ፡ ውሉደ፡ ሰብእ
  chosen: as human beings do
  alternatives:
  - as the children of humankind do
  rationale: Keeps the contrast between the Watchers and humans without implying that only men are meant.
- source_word: አንስተ
  chosen: wives
  alternatives:
  - wives
  rationale: Taking women for themselves in this context describes taking wives.
- source_word: ማሰኑ … ማሰኑ፡ ዓቢየ፡ ሙስና
  chosen: became deeply corrupt
  alternatives:
  - corrupted themselves … wrought great corruption
  rationale: Keeps the printed reflexive corruption rather than adopting an editorial causative correction.
theological_decisions:
- issue: Identity of the Watchers
  chosen_reading: Retain “Watchers” as the passage’s designation for the heavenly beings.
  alternative_readings:
  - angels
  rationale: The verse identifies them by their heavenly origin; replacing their title with “angels” would obscure its wording.
- issue: Meaning of defilement with women
  chosen_reading: Describe the Watchers as defiling themselves through the conduct recounted here.
  alternative_readings:
  - Treat women themselves as inherently defiling
  rationale: The passage condemns the Watchers’ transgression; it does not state that women are inherently impure.
