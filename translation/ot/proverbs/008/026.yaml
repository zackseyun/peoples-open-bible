id: PRO.8.26
reference: Proverbs 8:26
source:
  edition: WLC
  text: עַד לֹ֣א עָ֭שָׂה אֶ֣רֶץ וְ/חוּצ֑וֹת וְ֝/רֹ֗אשׁ עָפְר֥וֹת תֵּבֵֽל־׃
translation:
  text: before he had made the earth and the open country, or the world's first dust.
  philosophy: dynamic
lexical_decisions:
- source_word: עַד לֹא
  chosen: before ... had
  alternatives:
  - until not
  - while not yet
  lexicon: HALOT
  rationale: In context with the perfect verb עָשָׂה, עַד לֹא functions idiomatically as 'before ... had' or 'before ... was yet,' marking priority in time. English 'before he had made' best captures the temporal sense naturally.
- source_word: עָשָׂה
  chosen: had made
  alternatives:
  - made
  - fashioned
  - prepared
  lexicon: HALOT
  rationale: The verb is the common 'make/do.' With the preceding temporal construction, English pluperfect 'had made' is the most natural rendering.
- source_word: אֶרֶץ
  chosen: the earth
  alternatives:
  - land
  lexicon: HALOT
  rationale: In this creation-context parallel with תֵּבֵל ('world'), the global sense 'earth' is preferable to localized 'land'.
- source_word: חוּצוֹת
  chosen: the open country
  alternatives:
  - the outdoors
  - the streets
  - the open places
  lexicon: HALOT
  rationale: In this creation context the plural denotes exterior or open spaces, not specifically cultivated fields or city streets.
- source_word: רֹאשׁ
  chosen: the first
  alternatives:
  - the beginning
  - the chief part
  - the sum
  lexicon: HALOT
  rationale: In construct with עָפְרוֹת, רֹאשׁ denotes the first or earliest part. 'The first' fits the temporal/primordial sense in this verse.
- source_word: עָפְרוֹת
  chosen: the dust
  alternatives:
  - clods
  - soil
  - masses of dust
  lexicon: HALOT
  rationale: From עפר ('dust, dry soil'). The plural likely has a collective sense. 'Dust' is idiomatic in English and suits the creation imagery.
- source_word: תֵּבֵל
  chosen: the world
  alternatives:
  - the inhabited world
  lexicon: HALOT
  rationale: תֵּבֵל commonly denotes the world, often the inhabited world in ordered-cosmic sense. 'World' is concise and natural here.
- source_word: רֹאשׁ עָפְרוֹת תֵּבֵל
  chosen: the world's first dust
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This naturally conveys the compact primordial-dust expression while leaving its unusual internal relation open; “dust” remains a mass noun rather than a falsely precise particle.
