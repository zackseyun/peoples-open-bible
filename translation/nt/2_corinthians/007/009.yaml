id: 2CO.7.9
reference: 2 Corinthians 7:9
source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
translation:
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a reorientation toward God[r1]; for you were grieved according to God[c][b], so that you might suffer no loss from us.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'to repentance.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in a godly manner' or 'as God wills.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you might not be harmed because of us.'
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  chosen: Now
  alternatives:
  - As it is
  - At present
  lexicon: BDAG
  rationale: Temporal adverb marking Paul's present perspective in contrast to the prior situation; 'Now' is the most natural concise rendering.
- source_word: χαίρω
  chosen: I rejoice
  alternatives:
  - I am glad
  lexicon: BDAG
  rationale: Retains the verbal force and slightly elevated tone appropriate to Paul; 'I am glad' is possible but somewhat flatter.
- source_word: ἐλυπήθητε
  chosen: you were grieved
  alternatives:
  - you were made sorrowful
  - you were saddened
  lexicon: BDAG
  rationale: Passive aorist is best preserved with 'were grieved.' This keeps the repeated verbal pattern across the verse and avoids overinterpreting agency.
- source_word: εἰς μετάνοιαν
  chosen: into a reorientation toward God
  alternatives:
  - into a change of mind
  - to repentance
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
- source_word: μετάνοιαν
  chosen: a reorientation toward God
  alternatives:
  - a change of mind
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
- source_word: κατὰ θεόν
  chosen: according to God
  alternatives:
  - in a godly manner
  - as God wills
  - godly
  lexicon: BDAG
  rationale: A relatively formal rendering that preserves the Greek expression without prematurely narrowing it. It conveys sorrow measured by or aligned with God, while alternatives like 'godly sorrow' are interpretive expansions.
- source_word: ζημιωθῆτε
  chosen: you might suffer no loss
  alternatives:
  - you might not be harmed
  - you might incur no loss
  lexicon: BDAG
  rationale: Passive subjunctive after ἵνα indicates intended result. 'Suffer no loss' captures the semantic range of ζημιόω here without overstating physical harm.
- source_word: ἐξ ἡμῶν
  chosen: from us
  alternatives:
  - through us
  - because of us
  lexicon: BDAG
  rationale: ἐκ/ἐξ marks source. 'From us' is the most direct rendering, while English readers can infer causative source from context.
