    - record
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: An imperative in a judicial pronouncement. 'Write down' conveys formal recording of guilt without becoming
      overly stiff.
  - source_word: ኵሎ ኃጢአተ
