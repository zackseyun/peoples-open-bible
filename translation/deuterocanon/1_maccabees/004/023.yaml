translation:
  text: Judas returned to plunder the camp and took much gold and silver, blue and purple cloth, sea-purple cloth[a], and great wealth.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The precise textile or color is uncertain; alternatively, “goods from the sea.”
