  category: footnotes
  tier: 1
  from: Turn to me and be gracious to me[a]; give your strength to your servant, and save the son of your maidservant.
  to: Turn to me and be gracious to me; give your strength to your servant, and save your maidservant’s son.[a]
  rationale: The possessive construction is natural English and faithfully represents the relationship in בן אמתך. The existing note belongs with that final phrase, not with “be gracious to me.”
