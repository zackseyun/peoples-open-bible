revisions:
- from: 야훼께서 당신의 이름을 “열매가 좋고 아름다운 푸른 감람나무”라고 부르셨습니다. 큰 소동이 일어나는 소리에 그 위에 불을 붙이시니, 그 가지들이 망가졌습니다.[a][b][c]
  to: 야훼께서 당신의 이름을 “열매와 모양이 아름다운 푸른 감람나무”라고 부르셨습니다. 큰 소동의 소리에 그 나무에 불을 지르셨고, 그 가지들은 부서졌습니다.
  rationale: 원문의 병렬 묘사인 ‘열매’와 ‘모양’을 모두 살려 감람나무의 아름다움을 표현했습니다. ‘큰 소동의 소리’는 הֲמוּלָּה גְדֹלָה의 소란스럽고 격렬한 음향을 유지하면서도 한국어 문장을 간결하게 했습니다. 불을 지른 결과 가지들이 부서졌다는 심판 비유의 직접성도 보존했습니다. 기존 각주들은 수정 후 본문에 이미 반영되거나 원문을 부정확하게 설명하므로 삭제했습니다.
