id: DAN.7.14
reference: Daniel 7:14
source:
  edition: WLC
  text: וְ/לֵ֨/הּ יְהִ֤יב שָׁלְטָן֙ וִ/יקָ֣ר וּ/מַלְכ֔וּ וְ/כֹ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ֛/א וְ/לִשָּׁנַיָּ֖/א לֵ֣/הּ יִפְלְח֑וּן שָׁלְטָנֵ֞/הּ שָׁלְטָ֤ן עָלַם֙ דִּֽי לָ֣א יֶעְדֵּ֔ה וּ/מַלְכוּתֵ֖/הּ דִּי לָ֥א תִתְחַבַּֽל־־׃פ
translation:
  text: And to him was given dominion and glory and a kingdom, and all peoples, nations, and languages[a] will serve him[b][c]. His dominion is an everlasting dominion, which will not pass away, and his kingdom is one that will not be destroyed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally 'languages'; here the expression includes the people who speak them.
    reason: cultural_note
  - marker: b
    text: Or 'that all ... should serve him,' expressing purpose or intended result. The Aramaic connects the clauses with 'and'; future service is a contextual rendering, not the verb's only possible force.
    reason: alternative_reading
  - marker: c
    text: Or 'worship him.' Elsewhere in Daniel 3 and 6, uses of this verb concern service to God or gods, supporting religious resonance here. Wider Aramaic also uses it for ordinary service; the word alone does not decide the recipient's identity.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִיב
  chosen: was given
  alternatives:
  - gave
  lexicon: HALOT
  rationale: The Aramaic verb here is passive in sense ('was given'), matching the syntax with the indirect object 'to him.' This preserves the implied divine bestowal without making the giver explicit.
- source_word: שָׁלְטָן
  chosen: dominion
  alternatives:
  - authority
  - rule
  - sovereignty
  lexicon: WLC/OSHB; CAL; chapter7 context
  rationale: Dominion preserves the repeated rule/authority noun and its contrast with transient kingdoms. Authority and sovereignty remain viable alternatives; this local comparison does not establish that they are inherently weaker or that dominion is uniquely optimal.
- source_word: וִיקָר
  chosen: glory
  alternatives:
  - honor
  - majesty
  lexicon: HALOT
  rationale: The term denotes honor/splendor accorded to the figure. 'Glory' is the most natural English rendering in a royal-theological setting and preserves the elevated tone.
- source_word: מַלְכוּ
  chosen: a kingdom
  alternatives:
  - kingship
  - royal power
  lexicon: HALOT
  rationale: The noun can denote reign or kingdom. Here, alongside 'dominion' and followed by universal service, 'a kingdom' best conveys the realm and royal rule granted to him.
- source_word: עַמְמַיָּא
  chosen: peoples
  alternatives:
  - nations
  - ethnic groups
  lexicon: HALOT
  rationale: Using 'peoples' here allows the following paired terms to retain their distinct force rather than collapsing all three into near-synonyms.
- source_word: אֻמַיָּא
  chosen: nations
  alternatives:
  - tribes
  - peoples
  lexicon: HALOT
  rationale: This term commonly denotes national groupings. Rendering it 'nations' preserves the triad's breadth.
- source_word: לִשָּׁנַיָּא
  chosen: languages
  alternatives:
  - tongues
  lexicon: HALOT
  rationale: The literal sense is languages/tongues. 'Languages' is clear modern English and preserves the universal scope across speech communities.
- source_word: יִפְלְחוּן
  chosen: will serve him
  alternatives:
  - should serve him
  - worship him
  - pay homage to him
  lexicon: WLC/OSHB; CAL; unfoldingWord Aramaic grammar; chapter7 context
  rationale: The imperfect allows future, durative and modal uses; future service is preferred moderately in the predicted universal and everlasting dominion context and repeated7:27 service/obedience. And preserves the coordinating conjunction without forcing purpose subordination. Purpose/result should-serve remains defensible and is noted. Daniel 3 and 6 plh uses strongly support religious resonance, but broader lexical service does not by itself identify the recipient.
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  chosen: His dominion is an everlasting dominion
  alternatives:
  - His dominion is an eternal dominion
  lexicon: HALOT
  rationale: The repeated noun is preserved for emphasis. 'Everlasting' is idiomatic biblical English for עָלַם here and suits the contrast with transient earthly kingdoms in the chapter.
- source_word: יֶעְדֵּה
  chosen: will not pass away
  alternatives:
  - will not be removed
  - will not cease
  lexicon: HALOT
  rationale: The verb conveys passing away or being removed. 'Will not pass away' is natural English and echoes the permanence theme.
- source_word: תִתְחַבַּל
  chosen: will not be destroyed
  alternatives:
  - will not be corrupted
  - will not be ruined
  lexicon: HALOT
  rationale: In context of kingdoms, the sense is destruction/ruin rather than moral corruption. 'Will not be destroyed' is the clearest contextual rendering.
