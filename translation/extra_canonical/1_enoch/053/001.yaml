translation:
  text: There my eyes saw a valley whose mouth was open and deep. All who dwell on dry land, the sea and the islands
    bring gifts, drink offerings[a] and offerings, yet the whole deep valley will not be filled.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected አስተያ belongs to drinking vocabulary (bibere/potio/potus) in actual primary Dillmann365–366.
      Drink offerings is a contextual rendering within this gift/offerings list, not an assertion that the lexicon
      establishes a particular libation ritual; generic presents obscures the drinking sense. The source piles up
      dwellers, gifts/drink offerings/offerings and people bringing them. English joins the clauses without adding
      a destination or naming recipients. The final not-be-filled negative and dry land, sea and islands are retained.
    reason: lexical_alternative
