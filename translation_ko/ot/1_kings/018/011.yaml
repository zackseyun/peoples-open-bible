  text: “이제 당신은 ‘가서 당신의 주인에게 ‘보십시오, 엘리야가 여기 있습니다’라고 말하십시오’라고 말씀하십니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַתָּ֖ה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 지금
  - 그러나 이제
  lexicon: עַתָּה
  rationale: 대조적 전환을 살리되 한국어에서는 간결한 시간 전환 표현 ‘이제’가 자연스럽습니다.
- source_word: אַתָּ֣ה אֹמֵ֑ר
  english_pob_choice: you are saying
  chosen_korean: 당신은 … 하고 있습니다
  alternatives_korean:
  - 당신이 …라고 말합니다
  - 당신은 …라고 말하고 있습니다
  lexicon: אמר
  rationale: 현재 진행의 발화 행위를 드러내기 위해 직접적인 서술형으로 옮겼습니다.
- source_word: לַ/אדֹנֶ֖י/ךָ
  english_pob_choice: to your lord
  chosen_korean: 당신의 주인에게
  alternatives_korean:
  - 당신의 주님에게
  - 당신의 주에게
  lexicon: אָדוֹן
  rationale: 문맥상 인간 상관을 가리키므로 ‘주인’이 원문의 위계 관계를 가장 분명히 드러냅니다.
- source_word: הִנֵּ֥ה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오, ...
  lexicon: הִנֵּה
  rationale: POB가 채택한 ‘Look’을 한국어의 직접 명령/주의 환기 표현으로 옮겨 시각적 주의를 살렸습니다.
- source_word: אֵלִיָּֽהוּ
  english_pob_choice: Elijah
  chosen_korean: 엘리야
  alternatives_korean:
  - 엘리야후
  lexicon: אֵלִיָּהוּ
  rationale: 한국어 성경에서 확립된 고유명사 형태를 따랐습니다.
theological_decisions:
- issue: 인용부호 안의 다중 대화 구조
  chosen_reading: ‘가서, 당신의 주인에게 ‘보십시오, 엘리야가 여기 있습니다.’라고 말하라고’
  alternative_readings:
  - ‘가서 당신의 주인에게 말하라, “보십시오, 엘리야가 여기 있습니다.”’
  - ‘가서 네 주인에게 말해, “보라, 엘리야가 여기 있다.”’
  rationale: 히브리어 원문은 명령-보고-직접 인용이 연쇄된 구조이므로, 화자 층위를 유지하는 방향으로 번역했습니다.
  doctrine_reference: 문맥적 서술 구조 보존
- issue: הִנֵּה의 직접성
  chosen_reading: ‘보십시오’
  alternative_readings:
  - ‘보라’
  - ‘봐’
  rationale: 원문의 경계/주의 환기 기능을 살리면서 현대 합쇼체의 공손성을 유지하기 위해 ‘보십시오’를 선택했습니다.
  doctrine_reference: 수사적 강조 보존
