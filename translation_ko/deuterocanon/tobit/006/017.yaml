translation:
  language: ko
  text: 그리고 네가 신방에 들어가면, 향의 재를 가져다가 그 위에 물고기의 심장과 간의 일부를 얹고, 그것들로 연기를 피우십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυμφῶνα
  english_pob_choice: bridal chamber
  chosen_korean: 신방
  alternatives_korean:
  - 혼인방
  - 신랑방
  lexicon: νυμφών
  rationale: 혼인 예식 후 들어가는 방이라는 구체적 장면을 간결하게 살리는 표준적 대응으로 신방을 택했습니다.
- source_word: τέφραν θυμιαμάτων
  english_pob_choice: incense ashes
  chosen_korean: 향의 재
  alternatives_korean:
  - 분향의 재
  - 향 재
  lexicon: τέφρα / θυμίαμα
  rationale: 향과 관련된 재라는 물질적 대상을 그대로 드러내기 위해 향의 재로 옮겼습니다.
- source_word: ἐπιθήσεις
  english_pob_choice: place
  chosen_korean: 얹고
  alternatives_korean:
  - 놓고
  - 두고
  lexicon: ἐπιτίθημι
  rationale: 재 위에 물질을 실제로 올려놓는 연속 동작을 자연스럽게 표현하기 위해 얹고를 사용했습니다.
- source_word: καπνίσεις
  english_pob_choice: fumigate
  chosen_korean: 연기를 피우십시오
  alternatives_korean:
  - 훈증하십시오
  - 향을 피우십시오
  lexicon: καπνίζω
  rationale: 소스가 요구하는 것은 해석이 아니라 실제로 연기를 내는 행위이므로, 현대 한국어에서 직관적인 연기를 피우십시오로 옮겼습니다.
theological_decisions:
- issue: 명령형의 공손체 사용
  chosen_reading: 지시문 전체를 공손한 명령형으로 옮겨, 서술이 아니라 수행 지침임을 분명히 했습니다.
  alternative_readings:
  - 평서형으로 바꾸어 설명적으로 옮김
  - 더 고전적인 성서체 명령형 사용
  rationale: 이 절은 혼인 방에서 따라야 할 구체적 절차를 전달하므로, 합쇼체 명령형이 의미와 기능을 가장 직접적으로 드러냅니다.
  doctrine_reference: 서사적 지시문 번역 원칙
