  yaml_path: translation/ot/ezekiel/039/029.yaml
  text: And I will no longer hide my face from them, when I have poured out my Spirit on the house of Israel, declares the Lord GOD.
translation:
  language: ko
  text: 내가 이스라엘 집 위에 내 영[b]을 부어 주었을 때, 다시는 그들에게서 내 얼굴[a]을 숨기지 않겠습니다. 주 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פָּנַי(‘내 얼굴’)는 여기서 하나님의 임재와 은총의 표지입니다.
    reason: theological_note
  - marker: b
    text: ‘내 영’은 본문 문맥상 하나님의 영을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וְלֹא אַסְתִּיר עוֹד פָּנַי מֵהֶם
  english_pob_choice: I will no longer hide my face from them
  chosen_korean: 다시는 그들에게서 내 얼굴을 숨기지 않겠습니다
  alternatives_korean:
  - 더 이상 그들에게서 내 얼굴을 감추지 않겠습니다
  - 이제는 그들에게서 내 얼굴을 숨기지 않겠습니다
  lexicon: פָּנִים → 얼굴
  rationale: 히브리어의 ‘얼굴’은 단순한 시선이 아니라 관계적 임재의 부재/회복을 가리키므로, 직역적이면서도 관계적 의미가 드러나게 옮겼습니다.
- source_word: אֲשֶׁר שָׁפַכְתִּי אֶת רוּחִי
  english_pob_choice: when I have poured out my Spirit
  chosen_korean: 내가 내 영을 ... 부어 주었을 때
  alternatives_korean:
  - 내가 내 영을 ... 쏟아 부었을 때
  - 내가 내 영을 ... 부을 때
  lexicon: רוּחַ → 영
  rationale: 여기서는 문맥상 하나님의 영을 가리키지만, 본문이 ‘성령’보다 일반형 ‘영’에 더 가깝기 때문에 기본값을 유지했습니다. ‘부어 주다’는 שָׁפַךְ의 이미지인 풍성한 부음을 살렸습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘 가문
  - 이스라엘 백성
  lexicon: בַּיִת → 집
  rationale: POB의 ‘house of Israel’을 그대로 반영해, 집/가문/백성 중에서도 언약 공동체를 가리키는 표지를 살렸습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 말입니다
  alternatives_korean:
  - 주 하나님이 말씀하십니다
  - 주 야훼께서 선언하십니다
  lexicon: אֲדֹנָי יְהוִה → 주 야훼
  rationale: 본문의 이중 칭호를 구별해, אֲדֹנָי를 ‘주’로, יהוה를 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 공인된 POB 선택 ‘when’의 시점/조건 관계
  chosen_reading: ‘내가 내 영을 ... 부어 주었을 때’로 옮겨, 얼굴을 숨기지 않겠다는 약속이 성령의 부으심과 함께 성취되는 시점을 드러냈습니다.
  alternative_readings:
  - ‘내가 내 영을 ... 부었기 때문에’로 인과화하는 번역
  - ‘내가 내 영을 ... 부은 뒤에’로 순차화하는 번역
  rationale: 영어 POB의 최종 확정본은 because가 아니라 when을 채택하므로, 원인보다 동시/조건적 성취 관계를 유지했습니다.
  doctrine_reference: 언약 회복과 성령 부으심의 종말론적 성취
