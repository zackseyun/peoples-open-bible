  source_fidelity: 원문의 세 병렬 서술(현재의 고난, 원수들에게 복속됨, 무력한 상태에 놓임)과 죄가 그 원인이라는 구조는 대체로 반영되었습니다. 그러나 “많은 크고 큰 죄들”은 원문의 πολλὰς καὶ μεγάλας(‘많고 큰’)를 잘못 중복해 옮긴 명백한 오류입니다.
