id: JOB.13.23
reference: Job 13:23
source:
  edition: WLC
  text: כַּ/מָּ֣ה לִ֭/י עֲוֺנ֣וֹת וְ/חַטָּא֑וֹת פִּֽשְׁעִ֥/י וְ֝/חַטָּאתִ֗/י הֹדִיעֵֽ/נִי׃
translation:
  text: How many iniquities and sins have I committed[a]? Show me my transgression and my sin.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “How great are my iniquities and sins?” The Hebrew can ask about extent as well as number.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּמָּה לִי
  chosen: How many are my
  alternatives:
  - How many do I have
  - How great are my
  lexicon: HALOT
  rationale: The interrogative with לִי idiomatically asks quantity/extent. 'How many are my' preserves the directness of Job's question and fits the following plural nouns better than a more paraphrastic 'How many do I have.' 'How great are my' is possible in some contexts but here the paired plural nouns favor numerical/quantitative force.
- source_word: עֲוֺנוֹת
  chosen: iniquities
  alternatives:
  - guilt
  - wrongdoings
  lexicon: HALOT
  rationale: עָוֹן often carries the sense of guilt/iniquity rather than a generic mistake. 'Iniquities' preserves the moral weight and distinguishes it from the following חַטָּאוֹת. 'Guilt' is semantically possible but less natural in the plural here.
- source_word: וְחַטָּאוֹת
  chosen: sins
  alternatives:
  - offenses
  lexicon: HALOT
  rationale: A straightforward rendering of חַטָּאת in the plural. 'Sins' is clear modern English and preserves the semantic distinction from עֲוֺנוֹת without unnecessary jargon.
- source_word: פִּשְׁעִי
  chosen: my transgression
  alternatives:
  - my rebellion
  - my offense
  lexicon: HALOT
  rationale: פֶּשַׁע commonly denotes transgression, often with a willful or rebellious nuance. 'My transgression' is the most standard and suitably weighty rendering; 'my rebellion' sharpens the nuance but risks over-specifying beyond what the immediate context requires.
- source_word: וְחַטָּאתִי
  chosen: my sin
  alternatives:
  - my offense
  lexicon: HALOT
  rationale: Singular חַטָּאת with 1cs suffix is best rendered simply as 'my sin.' Keeping 'sin' here maintains lexical transparency and mirrors the Hebrew pairing with פִּשְׁעִי.
- source_word: הֹדִיעֵנִי
  chosen: Show me
  alternatives:
  - show me
  - inform me of
  lexicon: HALOT
  rationale: This idiomatically conveys the Hiphil sense, “cause me to know,” without the potential permissive ambiguity of “let me know.”
- source_word: כַּמָּה לִי עֲוֺנוֹת וְחַטָּאוֹת
  chosen: How many wrongs and sins do I have?
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: English expresses the possessive לִי idiomatically with “do I have,” and “wrongs” avoids unnecessarily technical diction.
