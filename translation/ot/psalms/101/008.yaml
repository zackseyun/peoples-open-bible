  from: Morning by morning I will destroy all the wicked of the land[a][b], cutting off from the city of Yahweh all workers of iniquity.
  to: Morning by morning I will destroy all the wicked of the land[b], cutting off from the city of Yahweh[a] all who practice wickedness.
