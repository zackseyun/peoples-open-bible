id: GEN.24.35
reference: Genesis 24:35
source:
  edition: WLC
  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
translation:
  text: Yahweh has greatly blessed my master, and he has become a man of great wealth and standing. Yahweh has given him flocks and herds, silver and gold, male servants and female servants[a], camels and donkeys.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: These were enslaved household servants.
    reason: cultural_note
lexical_decisions:
- source_word: יהוה
  chosen: the LORD
  alternatives:
  - Yahweh
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine default for the divine name יְהוָה, render as 'the LORD' rather than transliterating, following established reverential convention and the pattern reflected in the LXX/English tradition.
- source_word: בֵּרַךְ
  chosen: has greatly blessed
  alternatives:
  - blessed greatly
  - has abundantly blessed
  lexicon: HALOT
  rationale: The verb means 'blessed'; combined with מְאֹד it conveys strong degree. Present perfect English ('has ... blessed') fits the servant's report of Abraham's present state resulting from past divine action.
- source_word: אֲדֹנִי
  chosen: my master
  alternatives:
  - my lord
  lexicon: HALOT
  rationale: In this narrative context the term refers to Abraham as the servant's human superior, not a divine title. 'My master' communicates the social relationship more clearly in modern English than 'my lord'.
- source_word: מְאֹד
  chosen: greatly
  alternatives:
  - very much
  - abundantly
  lexicon: HALOT
  rationale: Adverb of intensity modifying 'blessed'; 'greatly' is idiomatic and preserves the strong degree without sounding wooden.
- source_word: וַיִּגְדָּל
  chosen: he has become great
  alternatives:
  - he became great
  - he grew great
  - he became wealthy
  lexicon: HALOT
  rationale: The verb literally denotes becoming great. In context it refers to Abraham's increase in status and wealth. 'Has become great' preserves the broader sense better than reducing it only to wealth, while still sounding natural.
- source_word: וַיִּתֶּן לוֹ
  chosen: He has given him
  alternatives:
  - and gave him
  lexicon: HALOT
  rationale: The subject remains the LORD, and the indirect object refers to Abraham. Present perfect maintains the discourse sense of present possessions resulting from God's giving.
- source_word: צֹאן
  chosen: flocks
  alternatives:
  - small livestock
  - sheep and goats
  lexicon: HALOT
  rationale: A collective term for small livestock, often sheep/goats. 'Flocks' is the natural collective English equivalent and pairs well with 'herds' for בקר.
- source_word: בָּקָר
  chosen: herds
  alternatives:
  - cattle
  lexicon: HALOT
  rationale: Refers to bovine livestock. 'Herds' matches the collective style of 'flocks' and avoids over-specifying countable animals where the Hebrew is collective.
- source_word: כֶּסֶף
  chosen: silver
  alternatives:
  - money
  lexicon: HALOT
  rationale: The basic sense is 'silver'; here likely wealth in precious metal form. 'Silver' preserves the concrete lexical value rather than abstracting to 'money'.
- source_word: זָהָב
  chosen: gold
  lexicon: HALOT
  rationale: Straightforward rendering of the precious metal term.
- source_word: עֲבָדִם
  chosen: male servants
  alternatives:
  - servants
  - male slaves
  lexicon: HALOT
  rationale: The term can denote servants/slaves depending on context. Here it appears in a household-property list alongside female servants and livestock. 'Male servants' is readable and distinguishes gender explicitly because it is paired with שפחות; 'male slaves' is possible but the verse does not foreground bonded status as theologically salient.
- source_word: שְׁפָחֹת
  chosen: female servants
  alternatives:
  - maidservants
  - female slaves
  lexicon: HALOT
  rationale: Refers to female household servants/slaves. 'Female servants' is clear modern English and preserves the gender distinction in the Hebrew pair.
- source_word: גְמַלִּים
  chosen: camels
  lexicon: HALOT
  rationale: Standard rendering of the animal term.
- source_word: חֲמֹרִים
  chosen: donkeys
  alternatives:
  - asses
  lexicon: HALOT
  rationale: '''Donkeys'' is the standard modern English rendering; ''asses'' is archaic and potentially distracting.'
