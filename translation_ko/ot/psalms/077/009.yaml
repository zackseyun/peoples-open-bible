  rationale: 제공된 히브리어 본문과 영어 POB 감사 기록에 맞추어 절 전체를 교체했습니다. הֲשָׁכַח와 뒤따르는 אִם의 병렬을 두 수사 의문문으로 유지했고, חַנּוֹת의 부정사 의미를 ‘은혜 베푸시기’, קָפַץ의 닫고 가로막는 비유를 ‘긍휼을 막아 두시다’로 반영했습니다. 셀라는 번역하지 않고 음역하며 불확실성을 각주로 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:10:46Z'
