  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשֻׁע֪וֹת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב אֱ֭לֹהִים שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/006.yaml
  text: Oh, that the salvation of Israel would come out of Zion! When God restores the fortunes of his people[a], let Jacob rejoice; let Israel be glad.
  footnotes:
  - marker: a
    text: Or “When God brings back the captivity of his people” or “When God restores his captive people.” The Hebrew idiom can denote restoration from distress generally, often including return from captivity.
    reason: alternative_reading
translation:
  language: ko
  text: 아, 시온에서 이스라엘의 구원이 나오기를! 하나님께서 자기 백성의 형편을 회복하실 때[a], 야곱이 기뻐하고 이스라엘이 즐거워할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 ‘자기 백성의 포로됨을 돌이키실 때’ 또는 ‘포로 된 자기 백성을 돌아오게 하실 때’로도 옮길 수 있습니다. 그러나 이 표현은 포로 생활에서의 귀환을 포함할 수 있으면서도, 더 넓게는 곤경에 처한 백성의 형편을 회복하심을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פָּֽחֲדוּ פַחַד
  english_pob_choice: they were in great fear
  chosen_korean: 큰 두려움에 떨었습니다
  alternatives_korean:
  - 두려움을 두려워했습니다
  - 몹시 두려워했습니다
  lexicon: HALOT
  rationale: 히브리어의 동족어 반복으로 강조를 만들기 때문에, 직역의 뻣뻣함은 피하되 강조는 살려 ‘큰 두려움에 떨었습니다’로 옮겼습니다.
- source_word: לֹא הָיָה פָחַד
  english_pob_choice: where there was no fear
  chosen_korean: 두려워할 것이 없었는데도
  alternatives_korean:
  - 두려움이 없었는데도
  - 두려울 이유가 없었는데도
  lexicon: HALOT
  rationale: 원문은 두려움의 대상이나 근거가 없음을 말하므로, 장소 부사적 느낌을 살리면서도 한국어에서는 자연스러운 ‘두려워할 것이 없었는데도’로 표현했습니다.
- source_word: חֹנָךְ
  english_pob_choice: the one encamping against you
  chosen_korean: 주위에 진을 친 자
  alternatives_korean:
  - 당신을 에워싼 자
  - 당신을 포위하고 진 친 자
  lexicon: HALOT
  rationale: 동사 חנה의 기본 뜻은 ‘진을 치다/머물다’이지만, 문맥상 적대적 포위를 가리키므로 ‘주위에 진을 친 자’로 옮겼습니다. 한국어에서는 과도한 해석어를 덜어 의미를 보존했습니다.
- source_word: הֱבִשֹׁתָה
  english_pob_choice: You put them to shame
  chosen_korean: 당신께서 그들을 수치스럽게 하셨습니다
  alternatives_korean:
  - 당신께서 그들을 부끄럽게 하셨습니다
  - 당신께서 그들에게 수치를 주셨습니다
  lexicon: HALOT
  rationale: 히필형 בוש는 ‘수치를 당하게 하다/부끄럽게 하다’의 인과 의미이므로, 직접적이면서도 공적인 결과를 드러내는 ‘수치스럽게 하셨습니다’로 번역했습니다.
theological_decisions:
- issue: 시 안의 인칭 전환
  chosen_reading: 전반부는 하나님에 대해 말하다가, 중간에 하나님께 직접 ‘당신께서’라고 부르는 전환을 그대로 살렸습니다.
  alternative_readings:
  - 모든 동사를 3인칭으로 평준화하여 ‘하나님이 그들을 수치스럽게 하셨습니다’로 통일
  - 화자를 시온/예루살렘으로 돌려 읽음
  rationale: 히브리어 시의 급격한 인칭 전환은 의도된 수사이므로, 이를 매끈하게 정리하기보다 그대로 드러내는 편이 원문 구조를 더 잘 보존합니다. English POB도 이 전환을 유지합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: מאס의 신학적 뉘앙스
  chosen_reading: ‘버리셨습니다’로 옮겨, 단순한 감정적 혐오보다 판결적·언약적 거절의 뉘앙스를 남겼습니다.
  alternative_readings:
  - 무시하셨습니다
  - 멸시하셨습니다
  - 업신여기셨습니다
  rationale: 문맥상 하나님이 적들을 패배시키고 거절하시는 판단 행위가 핵심이므로, 한국어에서도 ‘버리셨습니다’가 가장 절제되면서도 강한 표현입니다.
  doctrine_reference: Translation philosophy §1, §5
