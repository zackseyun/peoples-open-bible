    rationale: Marks association in punishment. 'With them' is concise; the following 'bound together' carries the collective
      force.
  - source_word: ኅቡረ
    chosen: together
    alternatives:
    - in company
    - as one group
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
