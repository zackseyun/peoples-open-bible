  text: וַ/יָּק֨וּמוּ֙ שָׂרֵ֣י מוֹאָ֔ב וַ/יָּבֹ֖אוּ אֶל בָּלָ֑ק וַ/יֹּ֣אמְר֔וּ מֵאֵ֥ן בִּלְעָ֖ם הֲלֹ֥ךְ עִמָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/014.yaml
  text: So the officials of Moab got up and went to Balak, and said, “Balaam refused to go with us.”
translation:
  language: ko
  text: 모압의 관리들이 일어나 발락에게 가서, 「발람이 우리와 함께 가기를 거절했습니다」라고 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  english_pob_choice: the officials of Moab
  chosen_korean: 모압의 관리들
  alternatives_korean:
  - 모압의 방백들
  - 모압의 고관들
  lexicon: שַׂר / שָׂרִים
  rationale: 문맥상 왕의 명을 받아 움직이는 모압의 관원들이므로, 직역적이면서도 현대 한국어에서 자연스러운 ‘관리들’을 택했습니다.
- source_word: וַיָּק֨וּמוּ
  english_pob_choice: got up
  chosen_korean: 일어나
  alternatives_korean:
  - 일어나서
  - 자리에서 일어나
  lexicon: קוּם
  rationale: 히브리어 동작 동사 קוּם의 기본적 의미를 그대로 살려, 서술 흐름에 맞는 간결한 ‘일어나’로 옮겼습니다.
- source_word: מֵאֵן בִּלְעָם
  english_pob_choice: Balaam refused
  chosen_korean: 발람이 … 거절했습니다
  alternatives_korean:
  - 발람이 … 마다했습니다
  - 발람이 … 응하지 않았습니다
  lexicon: מֵאֵן
  rationale: מֵאֵן의 핵심은 단순 부재가 아니라 의도적 거절이므로, 그 강도를 분명히 드러내는 ‘거절했습니다’를 선택했습니다.
- source_word: הֲלֹךְ עִמָּנוּ
  english_pob_choice: to go with us
  chosen_korean: 우리와 함께 가기를
  alternatives_korean:
  - 우리와 동행하기를
  - 우리와 같이 가기를
  lexicon: הלך + עם
  rationale: 부정사구의 목적을 자연스럽게 풀어 ‘-기를’ 구조로 옮기되, 동행의 관계를 분명히 하기 위해 ‘함께 가기’를 택했습니다.
