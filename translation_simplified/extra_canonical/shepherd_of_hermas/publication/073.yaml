translation:
  text: '“Listen also about the people who handed in half-dry rods with cracks. The people whose rods
    were equally half dry waver. They are neither living nor dead.”[a]


    2. “The people whose rods were half dry and cracked both waver and slander. They are never at peace
    with one another. They are always divided. Yet repentance is offered to them too. You see that some
    of them have repented. They still have hope of repentance,” he says.


    3. “Those among them who have repented,” he says, “have their dwelling in the tower. Those who have
    repented more slowly will dwell in the walls. Those who do not repent and keep doing their deeds will
    surely die.”[b]


    4. “The people who handed in green rods with cracks have always been faithful and good. But they were
    jealous of one another over first place and honor. They are all foolish to be rivals over first place.”[c]


    5. “These people heard my commandments. They were good, so they cleansed themselves and quickly repented.
    Their dwelling was in the tower. But anyone who turns back to division will be thrown out of the tower
    and lose their life.”


    6. “Life belongs to everyone who keeps the Lord’s commandments. His commandments concern patience
    and humility. They do not concern first place or honor. The Lord’s life is in such people. Death is
    among people who cause divisions and act lawlessly.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: The opening names the cracked half-dry rods before explaining the equally half-dry group and
      then returning to cracked rods in paragraph 2. The slightly awkward sequence is preserved. “Waver”
      renders being double-minded, without changing neither-living-nor-dead into a judgment that they
      are already dead. In paragraph 2, the working edition brackets two editorial supplements meaning
      “he says,” after “repentance is offered to them too” and within “You see that some of them have
      repented.” These bracketed reporting expressions are not translated in the main text. The unbracketed
      “he says” expressions accompanying the hope of repentance in paragraph 2 and the tower dwelling
      in paragraph 3 are translated.
  - marker: b
    reason: textual_variant
    text: The supplied working Greek uses the perfect μετανενοήκασι for the first group and μετανενοήκασιν
      for the slower group, rendered “have repented” in both cases. An earlier drafting note reported
      future repentance verbs in Michigan, citing Bonner printed pp. 105–106 and mentioning damaged letters.
      The supplied comparison evidence does not transcribe those forms or distinguish their preserved
      letters from restorations, so which verbs differ cannot be established here. No Michigan-based alternative
      translation is presented without that evidence. The slower-repentance/walls distinction and persistent-deeds
      warning are retained. “Will surely die” represents the emphatic Greek cognate construction θανάτῳ
      ἀποθανοῦνται, literally “will die by death”; it does not specify a particular kind of death.
  - marker: c
    reason: textual_variant
    text: '“Be rivals” supplies the sense of the elliptical second phrase, which lacks a repeated jealousy
      noun in Athos and the working text. Michigan likely has the same omission; surrounding line ends
      are damaged, Bonner printed pp. 106–107. More literal alternative: “All these are foolish, having
      matters with one another over first place.” The first phrase explicitly has jealousy. “First place”
      can also mean precedence; no particular church office is named.'
  - marker: d
    reason: lexical_alternative
    text: “Patience” renders makrothymia, also long-suffering or forbearance; humility renders tapeinophrosynē.
      “Life belongs to all” expresses the Greek possessive construction. The statement connects life with
      keeping the commandments and retains the death warning for divisive and lawless people.
lexical_decisions:
- source_word: μετάνοια / δίψυχοί εἰσιν
  chosen: repentance / waver
  alternatives:
  - turning back / be double-minded
  rationale: Repentance renders metanoia. The Greek says they are double-minded, using an adjective with
    the verb to be; English “waver” expresses that condition verbally. Preserve the distinct groups and
    conditions without equating an opportunity to repent with actual repentance or achieved salvation.
- source_word: πρωτεῖα / μακροθυμία / ταπεινοφρονήσεως
  chosen: first place / patience / humility
  alternatives:
  - precedence / forbearance / lowliness of mind
  rationale: Retain the contrast in the source without naming a modern church office.
