id: PSA.38.3
reference: Psalms 38:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי חִ֭צֶּי/ךָ נִ֣חֲתוּ בִ֑/י וַ/תִּנְחַ֖ת עָלַ֣/י יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/003.yaml
  text: There is no soundness in my flesh because of your indignation[a]; there is no peace[b] in my bones because of my sin.
  footnotes:
  - marker: a
    text: Or 'have pierced me' / 'have struck me.' The Hebrew verb more literally means 'have gone down' or 'descended,' here used of arrows lodging in the psalmist.
    reason: lexical_alternative
  - marker: b
    text: Literally 'your hand.' A Hebrew image for God's active power, here in affliction or discipline.
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 진노 때문에 내 살에 성한 곳이 없고, 내 죄 때문에 내 뼈에 평안이 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִצֶּיךָ
  english_pob_choice: your arrows
  chosen_korean: 주의 화살들
  alternatives_korean:
  - 주의 화살
  - 당신의 화살들
  lexicon: HALOT
  rationale: 히브리어 복수형과 2인칭 소유격을 살려, 하나님의 공격적·징계적 이미지를 담은 ‘화살들’로 옮겼습니다.
- source_word: נִחֲתוּ בִי
  english_pob_choice: have sunk into me
  chosen_korean: 내게 박히게 하셨고
  alternatives_korean:
  - 내게 들어가게 하셨고
  - 내 안으로 내려오게 하셨고
  - 내게 꽂히게 하셨고
  lexicon: HALOT
  rationale: 동사 נחת의 문자값인 ‘내려가다/가라앉다’를 그대로 풀기보다, 화살이 몸에 자리 잡는 장면을 한국어로 자연스럽고 강하게 살려 주는 표현을 택했습니다. 영어 POB의 ‘have sunk into’와 같은 이미지를 반영합니다.
- source_word: וַתִּנְחַת עָלַי יָדֶךָ
  english_pob_choice: your hand has come down on me
  chosen_korean: 주의 손이 내게 내려오셨습니다
  alternatives_korean:
  - 주의 손이 내 위에 내려오셨습니다
  - 주의 손이 내게 임하셨습니다
  - 주의 손이 내게 닿으셨습니다
  lexicon: HALOT
  rationale: ‘손’은 하나님의 행하시는 힘을 가리키는 구체적 비유이므로 추상화하지 않고 유지했습니다. ‘내게 내려오다’는 원문의 하향 움직임과 압박감을 살립니다.
- source_word: יָדֶךָ
  english_pob_choice: your hand
  chosen_korean: 주의 손
  alternatives_korean:
  - 주의 권능
  - 주의 능력
  lexicon: HALOT
  rationale: 영어 POB가 지적한 바와 같이 이것은 하나님의 활동하시는 손이라는 신인동형적 표현이므로, 의미를 풀지 않고 직역에 가깝게 보존했습니다.
theological_decisions:
- issue: 하나님의 ‘손’과 ‘화살’의 징계 이미지
  chosen_reading: 이미지를 완화하지 않고, 고난 속에서 하나님의 능동적 개입을 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 주의 권능이 내게 임하셨습니다
  - 주의 징계가 내게 임했습니다
  rationale: 시편의 애가 문맥에서 원문은 고통의 원인을 추상화하지 않고 구체적 신체 이미지를 사용합니다. 따라서 한국어도 그 긴장을 보존하는 쪽이 원문에 충실합니다.
  doctrine_reference: 원문 우선 원칙; 신인동형적 표현 보존
- issue: 동사의 시제/서술 방식
  chosen_reading: 완료적 결과를 드러내기 위해 한국어는 과거 완료 느낌의 서술로 옮겼습니다.
  alternative_readings:
  - 내게 내려옵니다
  - 내게 내리셨습니다
  rationale: 히브리어 시제 체계는 한국어와 일대일 대응이 아니므로, 현재의 고통을 말하는 문맥에 맞게 결과 상태가 드러나도록 번역했습니다.
  doctrine_reference: 시적 문맥의 기능적 대응
