theological_decisions:
- issue: Meaning of εἰς τέλος ἀποστάντες
  chosen_reading: “Finally turned away” = a completed, definitive apostasy
  alternative_readings:
  - “Turned away to the end (of life)”
  rationale: εἰς τέλος commonly intensifies completeness. The vision contrasts temporary straying with
    a decisive abandonment of the living God.
- issue: Referent of ῥῆμα τοῦ δικαίου
  chosen_reading: 'Adjectival: “the righteous word” (the just/righteous message)'
  alternative_readings:
  - 'Substantival: the word of the Righteous One, whose identity is not named in this phrase.'
  rationale: Both adjectival and substantival interpretations remain disclosed in notef. Retaining the
    earlier choice does not identify a particular speaker or person beyond the phrase.
- issue: Torment and transfer to another place
  chosen_reading: Retain repentance but inability to fit this tower, definite lesser-place fitting after
    torment/days of sins, transfer because of sharing in the righteous word, and the full positive and
    negative conditions concerning release from torment.
  alternative_readings: []
  rationale: The selected text preserves these statements and conditions without naming a later doctrinal
    destination or fixing a before/after-death timetable. Omitting transfer or softening torment is not
    a viable equivalent rendering. Prior records remain archived.
- issue: Baptismal formula εἰς τὸ ὄνομα
  chosen_reading: “Baptized into the name” retains the early Christian initiation sense of entering allegiance
    and identity
  alternative_readings:
  - “Baptized in the name”
  rationale: εἰς + ὄνομα commonly marks movement into a new sphere/ownership. The phrasing fits Hermas’s
    catechetical milieu.
  doctrine_reference: 'Translation philosophy §2: Translate titles; retain meaningful idioms'
- issue: Contextual repentance reassessment
  chosen_reading: Repent in paragraph2, change their mind in paragraph3, and repentance in the paragraph5
    question and reply, retaining their different directions and all later conditions.
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. In section 2 use repent
    for refusal to leave evil, aligning the unit record; in section 3 retain change their mind for abandoning
    baptism. The same Greek family has opposite contextual directions.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
