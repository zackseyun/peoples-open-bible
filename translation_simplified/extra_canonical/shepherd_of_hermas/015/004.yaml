  text: So she finished the explanation of the tower. But, becoming bold again, I questioned her further whether all these stones that were cast away and did not fit into the building of the tower—whether there is repentance for them and whether they have a place in this tower. “They have repentance,” she says, “but they cannot fit into this tower.
translation:
  language: en
  text: 'Then she finished explaining the tower. I grew bold again and asked her, “What about all these stones that were thrown away and did not fit into the building of the tower? Is reorientation[r1] possible for them? Do they have a place in this tower?”


    She answered, “Reorientation is possible for them, but they cannot fit into this tower.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
