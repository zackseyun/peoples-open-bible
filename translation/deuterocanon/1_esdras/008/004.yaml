translation:
  text: The king honored him because he had found favor with the king in all his requests.
  philosophy: dynamic
lexical_decisions:
- source_word: ἔδωκεν ... δόξαν
  chosen: gave ... honor
  alternatives:
  - gave ... glory
  - granted ... distinction
  lexicon: LSJ
  rationale: δόξα can mean 'glory,' 'honor,' or 'reputation.' In this courtly context with a human king rewarding a subject, 'honor' fits idiomatic English better than the more theologically loaded 'glory.'
- source_word: εὑρόντος χάριν
  chosen: because he had found favor
  alternatives:
  - having found favor
  - since he found grace
  lexicon: LSJ
  rationale: The genitive absolute gives the reason for the king's action. 'Found favor' is a standard biblical idiom and preserves the relational sense of χάρις here better than the less natural 'found grace' in English.
- source_word: ἐναντίον αὐτοῦ
  chosen: before him
  alternatives:
  - in his sight
  - with him
  lexicon: LSJ
  rationale: Literally 'before him' or 'in his presence/sight.' 'Before him' keeps the biblical-court idiom and reads naturally in English.
- source_word: ἐπὶ πάντα τὰ ἀξιώματα αὐτοῦ
  lemma: ἐπί
  chosen: in regard to all his offices
  alternatives:
  - over all his dignities
  - concerning all his appointments
  - with respect to all his claims to office
  lexicon: LSJ
  rationale: ἀξίωμα commonly denotes rank, dignity, office, or position. In this administrative setting, 'offices' best captures official responsibilities or positions rather than abstract 'dignities.' The preposition ἐπί here is rendered broadly as 'in regard to.'
- source_word: δόξαν
  chosen: honor
  alternatives:
  - glory
  - distinction
  lexicon: LSJ
  rationale: Repeated separately because it is the verse's key reward term and carries a significant semantic choice; 'honor' avoids overstating the sense for a royal favor shown to a human official.
