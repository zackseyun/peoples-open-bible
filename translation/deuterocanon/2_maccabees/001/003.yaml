  text: καὶ δοίη ὑμῖν καρδίαν πίστιν εἰς τὸ σέβεσθαι αὐτὸν καὶ ποιεῖν αὐτοῦ τὰ θελήματα καρδίᾳ μεγάλῃ καὶ ψυχῇ βουλομένῃ·
