  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Force of לְבַדּוֹ in relation to divine action
  chosen_reading: who alone does wondrous things
  alternative_readings:
  - who by himself does wonders
  rationale: The verse attributes uniquely wondrous acts to the God of Israel without importing broader polemical claims not explicit in the text. 'Alone' preserves the exclusivity inherent in the Hebrew.
