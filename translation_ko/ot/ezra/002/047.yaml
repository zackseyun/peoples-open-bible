  source_fidelity: 히브리어는 세 가문을 같은 명부 형식으로 열거합니다. ‘자손’은 이 족보·명부 맥락에서 בְּנֵי를 자연스럽게 반영하며, 기델·가할·르아야의 음역도 본문 의미를 보존합니다.
  naturalness: 본문은 현대 표준어의 간결한 명부 문장으로 자연스럽습니다. 다만 각주 표지는 해당 이름 바로 뒤에 두는 편이 각주의 적용 범위를 분명히 합니다.
  terminology: ‘자손’은 특정 개인들의 남성 자녀만을 지칭하기보다 가문 집단을 나타내는 이 문맥에 적절합니다. 기존 각주는 본문과 동일한 ‘르아야’를 대안으로 제시하고 ‘히브리어 표기 변이’라고 설명하여 부정확합니다. 영어 감사 기록의 Raiah는 본문 이문이 아니라 음역 대안이므로 한국어 대안 ‘라야’로 제시합니다.
