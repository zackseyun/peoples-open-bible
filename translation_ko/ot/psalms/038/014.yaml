translation:
  language: ko
  text: 저는 듣지 않고 제 입에 대답할 말도 없는 사람처럼 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘대답할 말’에 해당하는 히브리어는 문맥에 따라 ‘책망’, ‘논박’, 또는 ‘응답’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But I
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 그리고 저는
  - 저는
  lexicon: HALOT
  rationale: 문맥상 앞선 공격적 발화와 대비되는 역접을 드러내므로, 자연스러운 한국어 역접 접속사 ‘그러나’를 택했습니다.
- source_word: כְחֵרֵשׁ
  english_pob_choice: like a deaf man
  chosen_korean: 귀머거리처럼
  alternatives_korean:
  - 청각장애인처럼
  - 듣지 못하는 사람처럼
  lexicon: HALOT
  rationale: 비유적 비교를 살리면서도 현대 한국어에서 통용되는 짧은 표현으로 옮겼습니다.
- source_word: לֹא אֶשְׁמָע
  english_pob_choice: do not hear
  chosen_korean: 듣지 않고
  alternatives_korean:
  - 듣지 않습니다
  - 귀담아듣지 않고
  lexicon: HALOT
  rationale: 히브리어의 청각적 ‘듣다’와 문맥상 반응하지 않음을 함께 살려, 단순한 청력 부재보다 ‘받아들이지 않음’의 뉘앙스를 담았습니다.
- source_word: כְאִלֵּם / לֹא יִפְתַּח פִּיו
  english_pob_choice: like a mute man / he does not open his mouth
  chosen_korean: 벙어리처럼 제 입을 열지 않습니다
  alternatives_korean:
  - 말 못하는 사람처럼 입을 열지 않습니다
  - 벙어리처럼 입을 열지 않습니다
  lexicon: HALOT
  rationale: 비유의 대상과 행동을 한국어 관용으로 자연스럽게 결합해, 입을 열지 않는 침묵의 이미지를 유지했습니다.
