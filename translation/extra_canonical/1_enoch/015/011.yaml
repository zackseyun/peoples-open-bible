translation:
  text: And the spirits of the giants—clouds[a]—are those who oppress, destroy, fall[b], fight,
    and crush upon the earth, and cause sorrow[c]. They eat no food[d], yet thirst[e] and are
    hindered[f].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected Ethiopic daggers “clouds,” and Gg likewise prints daggered νεφέλας. Gs
      has νεμόμενα, which Charles discusses as potentially “laying waste” or “pasturing.” His
      discussion spans p44 n3 and its continuation on p45. No secure repair is established here;
      “clouds” is retained as an unresolved reading, not a cosmological explanation.
    reason: textual_variant
  - marker: b
    text: This retains the selected Ethiopic verb's falling sense. Greek ἐμπίπτοντα can suggest
      falling upon or attacking; that interpretation is not silently substituted.
    reason: textual_variant
  - marker: c
    text: The selected Ethiopic has sorrow or grief. The Greek prints δρόμους ποιοῦντα, “making
      runs”; Charles, p45 n5, compares Ethiopic with τρόμους, “terrors.” These are not treated
      as identical readings.
    reason: textual_variant
  - marker: d
    text: The Greek additionally has ἀλλὰ ἀσιτοῦντα. Charles, p45 n6, questions whether this
      is a doublet or a mistranslation of hunger. No separate hunger clause is imported into
      the selected Ethiopic translation.
    reason: textual_variant
  - marker: e
    text: This follows the selected affirmative reading. Charles, p44 Ethiopic apparatus n21,
      records competing negative wording and cites Greek καὶ διψῶντα in support of the selected
      text.
    reason: textual_variant
  - marker: f
    text: The selected affirmative ending is an emendation attributed to Dillmann in p44 Ethiopic
      apparatus n22; negative readings, “are not hindered,” are also recorded. Greek προσκόπτοντα
      supports stumbling or encountering obstruction. The English follows the selected emendation,
      not an uncontested manuscript reading.
    reason: textual_variant
