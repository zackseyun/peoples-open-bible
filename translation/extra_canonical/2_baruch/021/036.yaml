  from: Let Sheol be stirred up, so that from now on it may not hold the dead.
  to: Let Sheol be sealed, so that from now on it may not receive the dead.
  rationale: The Syriac verb here is ܬܬܚܬܡ (tethkhtem), which means 'be sealed', not
    'be stirred up'. Additionally, the verb ܬܩܒܠ (tqabbel) means 'receive' or 'accept',
    rather than 'hold'.
