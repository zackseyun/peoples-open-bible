id: JOB.2.7
reference: Job 2:7
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/אֵ֖ת פְּנֵ֣י יְהוָ֑ה וַ/יַּ֤ךְ אֶת אִיּוֹב֙ בִּ/שְׁחִ֣ין רָ֔ע מִ/כַּ֥ף רַגְל֖/וֹ עד קָדְקֳדֽ/וֹ־׃
translation:
  text: So the Adversary went out from the presence of Yahweh and struck Job with severe sores[a] from the sole of his foot to the crown of his head.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The same phrases describe a covenant curse in Deuteronomy 28:35.
    reason: cross_reference
lexical_decisions:
- source_word: הַשָּׂטָן
  chosen: the Adversary
  alternatives:
  - the Satan
  - Satan
  lexicon: HALOT
  rationale: In Job's prologue the term functions with the article and reads as a title/role rather than yet clearly as a fixed personal name. 'The Adversary' preserves the Hebrew sense while remaining readable. The more traditional 'Satan' is preserved as an alternative.
- source_word: מֵאֵת פְּנֵי יְהוָה
  chosen: from the presence of Yahweh
  alternatives:
  - from before the LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: וַיַּךְ
  chosen: struck
  alternatives:
  - smote
  - afflicted
  lexicon: HALOT
  rationale: נכה commonly means strike/smite. 'Struck' is the most natural modern English choice and keeps the directness of the verb without archaic tone.
- source_word: בִּשְׁחִין רָע
  chosen: with severe sores
  alternatives:
  - with painful boils
  - with grievous boils
  lexicon: HALOT
  rationale: שְׁחִין denotes a skin affliction/sores and רָע means grievous or severe in this context; “painful” is plausible but less direct.
- source_word: מִכַּף רַגְלוֹ
  chosen: from the sole of his foot
  alternatives:
  - from the bottom of his foot
  lexicon: HALOT
  rationale: כַּף with foot refers to the sole. This is the idiomatic and precise English rendering.
- source_word: עַד קָדְקֳדוֹ
  chosen: to the crown of his head
  alternatives:
  - to his scalp
  - to the top of his head
  lexicon: HALOT
  rationale: קָדְקֹד refers to the crown/top of the head. 'Crown of his head' is a standard, clear English equivalent and preserves the full-body extent of the affliction.
