source:
  edition: WLC
  text: מִ/קְצֵ֤ה הַ/שָּׁמַ֨יִם מֽוֹצָא֗/וֹ וּ/תְקוּפָת֥/וֹ עַל קְצוֹתָ֑/ם וְ/אֵ֥ין נִ֝סְתָּ֗ר מֵֽ/חַמָּת/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/006.yaml
  text: Its rising[a] is from one end of the heavens, and its circuit[c] to their ends, and nothing is hidden from its heat[b].
  footnotes:
  - marker: a
    text: Or 'its going forth' for 'its rising.' The Hebrew term can denote the sun's emergence or departure point.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his heat'; English uses 'its' because the referent is the sun.
    reason: lexical_alternative
  - marker: c
    text: Or 'its course' for 'its circuit.' The Hebrew emphasizes the sun's traversing round across the heavens.
    reason: lexical_alternative
translation:
  language: ko
  text: 해의 떠오름은 하늘 한 끝에서 시작되고, 그 운행은 하늘의 끝들까지 이릅니다.[a][b] 그 열기에서 숨을 것은 아무것도 없습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 나아감’. 히브리어는 해가 떠오르는 것 또는 나아가 나오는 지점을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 길’. 히브리어는 해가 하늘을 가로질러 도는 운행을 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그의 열기’라고 합니다. 남성 단수 접미사는 해를 가리키며, 한국어에서는 자연스럽게 ‘그 열기’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
