review_pass:
  verdict: revise
  source_fidelity: 원문의 τηροῦσιν κύκλῳ περὶ αὐτόν은 그를 둘러 경계·호위하는 지속적 행동을, ἕκαστος ἀπελθεῖν καὶ ποιεῖν τὰ ἔργα αὐτοῦ는 각자가 떠나서 자기 일을 하는 것이 불가능함을, παρακούουσιν αὐτοῦ는 그에게 불복종하지 않음을 나타냅니다. 초안은 대체로 충실하나, ‘자기 일을 하러 떠날’은 ‘떠나고 그 일을 하다’라는 두 동작의 연결을 목적 표현으로 다소 좁힙니다.
  naturalness: ‘그 주위를 둘러 경비를 서고’는 현대 표준어에서 자연스럽게 호위·경계의 뜻을 전달합니다. ‘각자는 떠나 자기 일을 할 수 없고’는 원문의 동사 연결을 보존하면서도 자연스럽습니다.
  terminology: ‘경비를 서다’는 이 문맥의 τηρέω를 단순 관찰이 아닌 경계·호위로 옮긴 것입니다. παρακούω는 ‘그의 말에’라고 명시하지 않고 원문처럼 인칭 목적어를 유지하여 ‘그에게 불순종하다’로 번역하는 것이 더 직접적입니다.
  issues:
  - severity: low
    issue: ‘자기 일을 하러 떠날 수 없고’의 목적 표현
    rationale: 원문은 ‘떠나고 자기 일을 하다’(ἀπελθεῖν καὶ ποιεῖν)의 병렬이며, 떠나는 목적이 오직 일을 하기 위함이라고 한정하지 않습니다.
  - severity: low
    issue: ‘그의 말에 불순종하다’의 보충
    rationale: 원문은 αὐτοῦ(그에게)를 목적어로 두며 ‘말’은 명시하지 않습니다. 한국어에서는 ‘그에게 불순종하다’가 자연스럽고 원문에 더 가깝습니다.
  revised_text: 그들은 그 주위를 둘러 경비를 서고 있으며, 각자는 떠나 자기 일을 할 수 없고, 그에게 불순종하지도 않습니다.
