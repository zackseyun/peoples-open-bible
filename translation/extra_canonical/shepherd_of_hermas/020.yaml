id: HERM.V.3.xii
reference: Shepherd of Hermas — Vision 3, section xii
unit: section
book: Shepherd of Hermas
source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Τῇ δὲ δευτέρᾳ ὁράσει εἶδες αὐτὴν ἑστηκυῖαν καὶ τὴν ὄψιν νεωτέραν ἔχουσαν καὶ ἱλαρωτέραν παρὰ τὸ
    πρότερον, τὴν δὲ σάρκα καὶ τὰς τρίχας πρεσβυτέρας. ἄκουε, φησίν, καὶ ταύτην τὴν παραβολήν. 2. ὅταν
    πρεσβύτερός τις, ἤδη ἀφηλπικὼς ἑαυτὸν διὰ τὴν ἀσθένειαν αὐτοῦ καὶ τὴν πτωχότητα, οὐδὲν ἕτερον προσδέχεται
    εἰ μὴ τὴν ἐσχάτην ἡμέραν τῆς ζωῆς αὐτοῦ· εἶτα ἐξαίφνης κατελείφθη αὐτῷ κληρονομία, ἀκούσας δὲ ἐξηγέρθη
    καὶ περιχαρὴς γενόμενος ἐνεδύσατο τὴν ἰσχύν, καὶ οὐκέτι ἀνάκειται, ἀλλὰ ἕστηκεν, καὶ ἀνανεοῦται αὐτοῦ
    τὸ πνεῦμα τὸ ἤδη ἐφθαρμένον ἀπὸ τῶν προτέρων αὐτοῦ πράξεων, καὶ οὐκέτι κάθηται, ἀλλὰ ἀνδρίζεται· οὕτως
    καὶ ὑμεῖς, ἀκούσαντες τὴν ἀποκάλυψιν ἣν ὑμῖν ὁ Κύριος ἀπεκάλυψεν. 3. ὅτι ἐσπλαγχνίσθη ἐφ’ ὑμᾶς, καὶ
    ἀνενεώσατο τὰ πνεύματα ὑμῶν, καὶ ἀπέθεσθε τὰς μαλακίας ὑμῶν, καὶ προσῆλθεν ὑμῖν ἰσχυρότης καὶ ἐδυναμώθητε
    ἐν τῇ πίστει, καὶ ἰδὼν ὁ Κύριος τὴν ἰσχυροποίησιν ὑμῶν ἐχάρη· καὶ διὰ τοῦτο ἐδήλωσεν ὑμῖν τὴν οἰκοδομὴν
    τοῦ πύργου, καὶ ἕτερα δηλώσει, ἐὰν ἐξ ὅλης καρδίας εἰρηνεύετε ἐν ἑαυτοῖς.
  language: Greek
  pages:
  - 329
  unit_id: V.3.xii
  label: Vision 3, section xii
  sequence: 20
translation:
  text: 'XII.1. “But in the second vision you saw her standing, with a countenance[a] younger and more
    cheerful than before, though her flesh and her hair were older. Listen,” he says[g], “to this parable
    also.”


    XII.2. “When an old man, having already given up hope for himself because of his weakness and his
    poverty[h], expects nothing else but the last day of his life; then, all at once, an inheritance is
    left to him. On hearing of it he rises up[i], and, becoming overjoyed, he puts on strength; he no
    longer lies down, but stands; his spirit—already corrupted by his former deeds—is renewed[j]; and
    he no longer sits, but takes courage[b]. So also you, when you heard the revelation that the Lord
    revealed to you[k].”


    XII.3. “For he had compassion on you[n] and renewed your spirits[l], and you put away your softness[c];
    strength came to you and you were strengthened in faith[d]; and when the Lord saw your strengthening[m],
    he rejoiced. For this reason he made known to you the building of the tower[f], and he will make other
    things known, if, with a whole heart, you are at peace among yourselves[e].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Countenance renders opsis, also face or appearance. The selected contrast is a younger and more
      cheerful face but older flesh and hair; both sides remain. Sinaiticus20.1 and both Latin versions
      retain the contrast. Athos PlateIV includes bracketed wording at the opening of the more-cheerful
      continuation, so the complete diplomatic line is not treated as wholly preserved manuscript wording.
    reason: textual_variant
  - marker: b
    text: Takes courage renders andrizetai, acts bravely or, literally, acts like a man. The selected
      text says he no longer sits but takes courage, continuing the posture-and-strength image. Athos,
      Sinaiticus and both Latin versions retain the brave action in their formulations. It is not replaced
      with a second mere standing clause.
    reason: lexical_alternative
  - marker: c
    text: Softness retains the earlier choice for malakia, also weakness or lack of resolve, in contrast
      with the arrival of strength. The noun alone does not uniquely fix a moral nuance or a modern gendered
      label. Both you put it away and the past renewal statements remain. The Ethiopic edition’s Latin
      rendering printed125 instead has commands to renew the soul and leave weakness; those imperatives
      are not substituted for the selected past statements.
    reason: textual_variant
  - marker: d
    text: In faith retains the earlier rendering; in the faith and in trust are alternatives. The article
      with the abstract noun does not alone settle an institutional versus dispositional interpretation.
      Sinaiticus20.3 initially has pistin, with S1 giving pisti and adding the following and. The corrected
      construction is not counted as separate manuscript evidence.
    reason: textual_variant
  - marker: e
    text: If, with a whole heart, you are at peace among yourselves preserves the condition for further
      disclosure and the reciprocal peace of the community. Both Latin versions retain a whole-heart peace
      condition. Athos PlateIV prints part of the condition in brackets, not as unbroken preserved wording.
      The Ethiopic edition’s Latin rendering printed125 instead has whole-heart mutual love. Love is not
      silently substituted for the selected peace or treated as an exact lexical match.
    reason: textual_variant
  - marker: f
    text: The building of the tower retains the concrete visionary construction, which the earlier interpretation
      identifies with the church/community. The selected clause gives their strengthening and the Lord’s
      joy before for this reason he made known the building, followed by further disclosure subject to
      the peace condition. Those stated relationships are not made unconditional.
    reason: textual_variant
  - marker: g
    text: He says identifies the male interpreter introduced as a young man in V3x7 and continuing the
      explanation in V3xi. The earlier she says incorrectly made the woman being described the speaker.
      Greek phēsin itself does not mark gender; the continuing narrative supplies the English pronoun.
      The woman remains her in the description of the second vision.
    reason: textual_variant
  - marker: h
    text: His weakness and his poverty are both stated causes of the old man’s despair. The expectation
      is nothing else but the last day of his life, followed by a suddenly left inheritance. This is the
      comparison of an elderly man, not the appointment of a church elder. Athos PlateIV partly brackets
      the weakness phrase; both Latin versions and the Ethiopic edition’s Latin rendering retain weakness
      and poverty in their formulations.
    reason: textual_variant
  - marker: i
    text: 'He rises up retains the earlier adjudicated reading of exēgerthē and the bodily sequence: no
      longer lying down but standing, and no longer sitting but taking courage. He is roused or stirred
      up is an alternative, not silently substituted for that prior choice. Vulgata printed29 has exurrexit;
      the other versions also describe rising. No resurrection-from-death event is added to this living
      old-man comparison.'
    reason: lexical_alternative
  - marker: j
    text: The selected spirit, singular in the old-man comparison, was already corrupted by former deeds
      and is now renewed. Sinaiticus20.2 retains that sequence with corrections to the renewal wording.
      Athos PlateIV brackets part of from-former-deeds. Vulgata printed29 brackets renovatur eius spiritus,
      qui iam as an editorial supply from Greek; its continuation has prior sorrows rather than deeds.
      Palatina retains a spirit renewed from prior failings, with an editorial question about tense in
      its apparatus. The Ethiopic edition’s Latin rendering has a different weary-spirit sequence and
      a proposed correction in its footnote. These edited or differing clauses are not unbroken identical
      codex corroboration.
    reason: textual_variant
  - marker: k
    text: The selected relative clause says that the Lord revealed the revelation to you. Sinaiticus20.2
      places the entire relative clause, hēn hymin ho kyrios apekalypsen, in an S1 marginal addition over
      an empty first-hand reading. It is not treated as uninterrupted first-hand evidence. Vulgata printed29
      instead has God at this occurrence; Palatina and the Ethiopic edition’s Latin rendering have Lord.
      The selected title and repeated reveal expression remain.
    reason: textual_variant
  - marker: l
    text: Your spirits is plural in the community application, distinct from the old man’s singular spirit
      in paragraph2. Sinaiticus20.3 retains the plural, while both Latin versions use a singular spirit
      and the Ethiopic edition’s Latin rendering speaks of a singular soul. Those formulations do not
      replace the selected Greek number.
    reason: textual_variant
  - marker: m
    text: Your strengthening retains hymōn in the working source. Sinaiticus20.3 instead has autōn, their
      strengthening, without an encoded correction at that pronoun. Palatina printed59 retains your strength;
      Vulgata printed29 says God saw your strength. The Ethiopic edition’s Latin rendering printed125
      says the Lord saw your patience. The selected addressees, strengthening and joy remain without harmonizing
      the differing wording.
    reason: textual_variant
  - marker: n
    text: Had compassion retains the selected past action before renewal and the people’s putting away
      softness. Athos PlateIV brackets its opening compassion phrase. The Ethiopic edition’s Latin rendering
      retains the Lord’s compassion but follows it with commands and future strength, not the same sequence
      of Greek past actions. No new requirement to earn the earlier compassion is added.
    reason: textual_variant
lexical_decisions:
- source_word: ὄψιν
  chosen: countenance
  alternatives:
  - appearance
  - face
  lexicon: LSJ
  entry: s.v. ὄψις
  rationale: Conveys both facial look and demeanor; enables the contrast with “flesh” and “hair.”
- source_word: ἱλαρωτέραν
  chosen: more cheerful
  alternatives:
  - more gracious
  - brighter
  lexicon: BDAG
  entry: s.v. ἱλαρός
  rationale: Denotes glad, cheerful disposition; “cheerful” fits the moral tone of renewed hope.
- source_word: σάρκα
  chosen: flesh
  alternatives:
  - body
  lexicon: BDAG
  entry: s.v. σάρξ
  rationale: Here literal bodily flesh is in view; preserving “flesh” maintains the concrete imagery.
- source_word: τρίχας
  chosen: hair
  lexicon: BDAG
  entry: s.v. θρίξ
  rationale: Literal reference to the woman’s hair in the vision.
- source_word: παραβολήν
  chosen: parable
  alternatives:
  - figure
  - similitude
  lexicon: BDAG
  entry: s.v. παραβολή
  rationale: Hermas uses short illustrative comparisons; “parable” is established and accurate.
- source_word: πρεσβύτερός τις
  chosen: an old man
  alternatives:
  - an elderly man
  lexicon: BDAG
  entry: s.v. πρεσβύτερος 1
  rationale: Context is age in a parable, not church office; “old man” avoids ecclesiastical sense.
- source_word: ἀφηλπικὼς ἑαυτόν
  chosen: having already given up hope for himself
  alternatives:
  - having despaired of himself
  - having lost hope
  lexicon: BDAG
  entry: s.v. ἀφελπίζω
  rationale: Expresses total loss of hope; participial nuance kept in English.
- source_word: ἀσθένειαν
  chosen: weakness
  alternatives:
  - infirmity
  - illness
  lexicon: BDAG
  entry: s.v. ἀσθένεια
  rationale: General lack of strength suits the parable’s physical and moral tone.
- source_word: πτωχότητα
  chosen: poverty
  alternatives:
  - destitution
  - poverty of means
  lexicon: BDAG
  entry: s.v. πτωχότης
  rationale: Material poverty is the point of contrast with the sudden inheritance.
- source_word: ἐσχάτην ἡμέραν
  chosen: the last day
  alternatives:
  - the final day
  lexicon: BDAG
  entry: s.v. ἔσχατος
  rationale: Idiomatic expression for the end of life; “last day of his life” clarifies scope.
- source_word: κατελείφθη ... κληρονομία
  chosen: an inheritance is left to him
  alternatives:
  - an inheritance is bequeathed to him
  - he is left an inheritance
  lexicon: BDAG
  entry: s.v. καταλείπω; s.v. κληρονομία
  rationale: Legal-bequest sense is primary; passive renders the aorist passive nuance.
- source_word: ἐξηγέρθη
  chosen: he rises up
  alternatives:
  - he is roused
  - he got up
  lexicon: BDAG
  entry: s.v. ἐξεγείρω
  rationale: Retain the prior rises-up adjudication and posture chain, with roused/stirred-up alternatives
    disclosed; full historical decision archived.
- source_word: περιχαρής
  chosen: overjoyed
  alternatives:
  - very glad
  - exceedingly joyful
  lexicon: BDAG
  entry: s.v. περιχαρής
  rationale: Intensifies joy upon hearing of the inheritance.
- source_word: ἐνεδύσατο τὴν ἰσχύν
  chosen: he puts on strength
  alternatives:
  - he clothed himself with strength
  - he took on strength
  lexicon: BDAG
  entry: s.v. ἐνδύω; s.v. ἰσχύς
  rationale: Preserves the clothing metaphor, common in biblical-Greek idiom.
- source_word: ἀνάκειται
  chosen: lies down
  alternatives:
  - reclines
  lexicon: BDAG
  entry: s.v. ἀνάκειμαι
  rationale: In contrast with “stands”; “lies down” communicates inactivity.
- source_word: ἕστηκεν
  chosen: stands
  alternatives:
  - stands firm
  lexicon: BDAG
  entry: s.v. ἵστημι
  rationale: Simple physical stance, marking renewed vigor.
- source_word: ἀνανεοῦται
  chosen: is renewed
  alternatives:
  - is made new again
  - is refreshed
  lexicon: BDAG
  entry: s.v. ἀνανεόω
  rationale: Captures restoration after decay.
- source_word: τὸ πνεῦμα
  chosen: the spirit
  alternatives:
  - the inner self
  - the mind
  lexicon: BDAG
  entry: s.v. πνεῦμα 4
  rationale: Human spirit (not the Holy Spirit) suits plural in v.3 and individual context.
- source_word: ἐφθαρμένον
  chosen: corrupted
  alternatives:
  - decayed
  - worn down
  lexicon: BDAG
  entry: s.v. φθείρω
  rationale: Moral-spiritual deterioration from former deeds is in view.
- source_word: πράξεις
  chosen: deeds
  alternatives:
  - actions
  - doings
  lexicon: BDAG
  entry: s.v. πρᾶξις
  rationale: Standard moral term matching Hermas’s usage.
- source_word: κάθηται
  chosen: sits
  alternatives:
  - is seated
  lexicon: BDAG
  entry: s.v. κάθημαι
  rationale: Continues the posture contrast (lie/stand/sit).
- source_word: ἀνδρίζεται
  chosen: takes courage
  alternatives:
  - acts manfully
  - becomes manly
  lexicon: BDAG
  entry: s.v. ἀνδρίζομαι
  rationale: Idiomatic sense is moral courage; we avoid gendered phrasing while noting literal sense.
- source_word: ἀποκάλυψιν
  chosen: revelation
  alternatives:
  - unveiling
  lexicon: BDAG
  entry: s.v. ἀποκάλυψις
  rationale: Established term for divine disclosure.
- source_word: Κύριος
  chosen: the Lord
  alternatives:
  - the Master
  lexicon: BDAG
  entry: s.v. κύριος 2
  rationale: Divine referent; matches Cartha policy to render as “Lord.”
- source_word: ἐσπλαγχνίσθη
  chosen: had compassion
  alternatives:
  - took pity
  lexicon: BDAG
  entry: s.v. σπλαγχνίζομαι
  rationale: Denotes deep mercy; either alternative is accurate; “had compassion” is chosen for dignity.
- source_word: ἀνενεώσατο
  chosen: renewed
  alternatives:
  - made new again
  - restored
  lexicon: BDAG
  entry: s.v. ἀνανεόω
  rationale: Divine subject renews the people’s spirits.
- source_word: ἀπέθεσθε
  chosen: put away
  alternatives:
  - laid aside
  - cast off
  lexicon: BDAG
  entry: s.v. ἀποτίθημι 2
  rationale: Common moral metaphor for renouncing a vice or disposition.
- source_word: μαλακίας
  chosen: softness
  alternatives:
  - weakness
  - cowardice
  lexicon: LSJ
  entry: s.v. μαλακία
  rationale: Retain softness against strength, with weakness or lack-of-resolve alternatives. The noun
    alone does not establish a unique moral or modern gendered interpretation.
- source_word: ἰσχυρότης
  chosen: strength
  alternatives:
  - power
  - vigor
  lexicon: LSJ
  entry: s.v. ἰσχυρότης
  rationale: Abstract noun; personified arrival of strength fits the rhetoric.
- source_word: ἐδυναμώθητε
  chosen: were strengthened
  alternatives:
  - grew strong
  - were made strong
  lexicon: BDAG
  entry: s.v. δυναμόω
  rationale: Passive/middle nuance preserved; divine agency implied by context.
- source_word: πίστις
  chosen: faith
  alternatives:
  - trust
  - the faith
  lexicon: BDAG
  entry: s.v. πίστις 1
  rationale: Retain faith with trust/the-faith alternatives. The article alone does not uniquely establish
    a dispositional or institutional interpretation.
- source_word: ἰσχυροποίησιν
  chosen: strengthening
  alternatives:
  - being made strong
  - fortifying
  lexicon: LSJ
  entry: s.v. ἰσχυροποίησις
  rationale: Nominal form keeps the parallel with “strength.”
- source_word: ἐχάρη
  chosen: rejoiced
  alternatives:
  - was glad
  lexicon: BDAG
  entry: s.v. χαίρω
  rationale: Simple, fitting divine joy at their strengthening.
- source_word: ἐδήλωσεν
  chosen: made known
  alternatives:
  - revealed
  - showed
  lexicon: BDAG
  entry: s.v. δηλόω
  rationale: Different verb from ἀποκαλύπτω; “made known” preserves lexical distinction.
- source_word: οἰκοδομή
  chosen: building
  alternatives:
  - construction
  - edification
  lexicon: BDAG
  entry: s.v. οἰκοδομή 1
  rationale: Concrete act of building the tower is intended, not metaphorical “edification” in English
    here.
- source_word: πύργου
  chosen: tower
  lexicon: BDAG
  entry: s.v. πύργος
  rationale: Fixed image in Hermas for the church; we retain the concrete noun.
- source_word: δηλώσει
  chosen: he will make known
  alternatives:
  - he will show
  lexicon: BDAG
  entry: s.v. δηλόω
  rationale: Keeps verbal parallel with ἐδήλωσεν in previous clause.
- source_word: εἰρηνεύετε ἐν ἑαυτοῖς
  chosen: be at peace among yourselves
  alternatives:
  - live in peace with one another
  - be at peace within yourselves
  lexicon: BDAG
  entry: s.v. εἰρηνεύω
  rationale: Idiomatic plural reflexive points to mutual peace within the community.
- source_word: ἐξ ὅλης καρδίας
  chosen: with a whole heart
  alternatives:
  - from your whole heart
  - wholeheartedly
  lexicon: BDAG
  entry: s.v. καρδία
  rationale: Hebraic idiom preserved; “with a whole heart” keeps solemn register.
