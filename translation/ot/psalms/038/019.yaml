id: PSA.38.19
reference: Psalms 38:19
source:
  edition: WLC
  text: וְֽ֭/אֹיְבַ/י חַיִּ֣ים עָצֵ֑מוּ וְ/רַבּ֖וּ שֹׂנְאַ֣/י שָֽׁקֶר׃
translation:
  text: But my enemies are vigorous and strong, and many hate me without cause[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'hate me in falsehood'; the phrase may describe their hatred as false, wrongful, or baseless.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  chosen: my enemies
  alternatives:
  - those hostile to me
  - my foes
  lexicon: HALOT
  rationale: The noun denotes personal enemies/adversaries. 'My enemies' is the most direct and natural rendering in English.
- source_word: חַיִּים
  chosen: vigorous
  alternatives:
  - alive
  - vigorous
  lexicon: HALOT
  rationale: It expresses the enemies' vitality in contrast to the speaker's weakness.
- source_word: עָצֵמוּ
  chosen: are strong
  alternatives:
  - have grown strong
  - are mighty
  lexicon: HALOT
  rationale: The verb conveys becoming strong/mighty. In English, 'are strong' communicates the present force of the statement smoothly, while still reflecting the Hebrew perfect in context.
- source_word: רַבּוּ
  chosen: are many
  alternatives:
  - have multiplied
  - have become many
  lexicon: HALOT
  rationale: The verb means to become many/increase. 'Are many' is concise and idiomatic, preserving the psalmist's complaint about their number.
- source_word: שֹׂנְאַי
  chosen: those who hate me
  alternatives:
  - my haters
  - my enemies
  lexicon: HALOT
  rationale: 'The participial form functions substantivally: ''those who hate me.'' This preserves the verbal force better than collapsing it into another noun like ''enemies.'''
- source_word: שָׁקֶר
  chosen: falsely
  alternatives:
  - without cause
  - wrongfully
  - for falsehood
  lexicon: HALOT
  rationale: The noun 'falsehood/lie' is used adverbially here. 'Falsely' best captures the sense that their hatred is grounded in falsehood or is deceitful. 'Without cause' is interpretive and better treated as an alternative.
- source_word: שֹׂנְאַי שָׁקֶר
  chosen: hate me without cause
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This is natural English for the contextual sense, while the note retains the broader lexical ambiguity.
