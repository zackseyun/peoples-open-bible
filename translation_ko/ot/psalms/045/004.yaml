base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/004.yaml
  text: In your majesty ride on victoriously for the cause of truth and meekness and righteousness[a]; and your right hand will teach you awesome things[b].
  footnotes:
  - marker: a
    text: Or 'Gird your sword on your thigh, mighty one.'
    reason: lexical_alternative
  - marker: b
    text: The paired terms 'splendor' and 'majesty' express royal magnificence; they may also be taken appositionally with the warrior, e.g., 'in your splendor and majesty.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 위엄을 지니고 승리하며 말을 타고 나아가십시오. 진리와 온유와 의를 위하여[a] 나아가십시오. 당신의 오른손이 당신에게 두려운 일들을 가르칠 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축되어 있어 ‘진리와 겸손한 의를 위하여’로 읽을 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘당신의 오른손이 당신에게 경외심을 일으키는 일들을 가르칠 것입니다.’ ‘두려운’은 공포뿐 아니라 경외를 불러일으키는 뜻도 지닙니다.
    reason: lexical_alternative
