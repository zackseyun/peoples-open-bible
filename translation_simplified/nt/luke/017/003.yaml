translation:
  language: en
  text: Watch yourselves. If your brother[b] sins,[a] speak to him firmly about it. If he repents[c], forgive him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read, “If your brother sins against you, speak to him firmly about it.”
    reason: textual_variant
  - marker: b
    text: The Greek says “brother” in the singular, but here it may refer more broadly to a fellow disciple.
    reason: cultural_note
  - marker: c
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Pay attention to yourselves
  simplified_phrase: Watch yourselves
  preserved_meaning: Jesus calls the disciples to ongoing vigilance concerning themselves.
  reasoning_layer_used: Lexical decision for προσέχετε ἑαυτοῖς
  rationale: The shorter wording keeps the warning force and the reflexive plural open-ended.
- pob_phrase: rebuke him
  simplified_phrase: speak to him firmly about it
  preserved_meaning: The sinner must receive direct verbal correction rather than mild advice.
  reasoning_layer_used: Lexical decision for ἐπιτίμησον
  rationale: This wording explains the less familiar term “rebuke” without weakening its force.
interpretive_expansions:
- pob_phrase: rebuke him
  rendering: speak to him firmly about it
  claim: The rebuke is direct verbal correction concerning the sin.
  evidence:
  - The lexical rationale describes ἐπιτίμησον as direct verbal correction with greater force than advice.
  confidence: high
  alternatives_preserved:
  - rebuke him
translation_notes:
  risk_flags:
  - risk: “Watch yourselves” may be heard as only individual self-examination.
    mitigation: The reflexive plural is retained so personal and communal vigilance remain possible.
  - risk: “Speak firmly” could be mistaken for permission to be harsh.
    mitigation: The wording conveys forceful correction without adding anger or hostility.
