  chosen_reading: Yahweh / O Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Scope of 'save me'
  chosen_reading: save me
  alternative_readings:
  - deliver me
  rationale: The Hebrew ישׁע can denote rescue/deliverance broadly. 'Save' is retained in the main text because it preserves the lexical connection and theological breadth without narrowing the sense to merely temporal deliverance.
