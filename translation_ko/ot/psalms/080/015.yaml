translation:
  language: ko
  text: 주님의 오른손으로 심으신 그 포도나무의 그루터기[a]와 주님을 위하여 강하게 하신 아들[b]을 돌보소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘싹’, ‘가지’, ‘포도나무 줄기’. 히브리어 단어는 드물게 쓰이며, 이 시편의 포도나무 비유 안에서 사용됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가지’. 히브리어는 ‘아들’이라고 읽히지만, 어떤 이들은 포도나무 비유 안에서 이를 비유적으로, 또는 이스라엘을 가리키는 집합적 표현으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  english_pob_choice: God of hosts
  chosen_korean: 만군의 하나님
  alternatives_korean:
  - 만군의 주 하나님
  - 하나님의 군대의 하나님
  lexicon: HALOT
  rationale: צְבָאוֹת의 군대/하늘 군대 이미지를 살리기 위해 ‘만군’으로 옮기고, 호격에서는 한국어 관용에 맞게 ‘-이시여’를 붙였습니다.
- source_word: שׁוּב נָא
  english_pob_choice: please return
  chosen_korean: 제발 돌아오십시오
  alternatives_korean:
  - 돌아와 주십시오
  - 부디 돌아오십시오
  lexicon: HALOT
  rationale: 직접 요청의 완곡한 호소를 ‘נָא’에 맞게 ‘제발’로 살리고, 합쇼체 호격에 맞춰 ‘돌아오십시오’로 옮겼습니다.
- source_word: הַבֵּט מִשָּׁמַיִם וּרְאֵה
  english_pob_choice: look down from heaven and see
  chosen_korean: 하늘에서 굽어보시고 살펴보시며
  alternatives_korean:
  - 하늘에서 내려다보시고 보십시오
  - 하늘에서 바라보시고 보아 주십시오
  lexicon: HALOT
  rationale: ‘굽어보다’는 위에서 아래로 주의 깊게 보는 뜻을 살려 ‘look down from heaven’에 대응하고, ‘see’를 단순 반복보다 자연스러운 ‘살펴보다’로 받아 문맥의 주의 깊은 관찰을 드러냈습니다.
- source_word: וּפְקֹד גֶּפֶן זֹאת
  english_pob_choice: and visit this vine
  chosen_korean: 이 포도나무를 찾아돌보소서
  alternatives_korean:
  - 이 포도나무를 방문하소서
  - 이 포도나무를 살펴보소서
  - 이 포도나무를 돌보소서
  lexicon: HALOT
  rationale: פקד의 ‘방문’보다 여기서는 개입하여 유익을 도모하는 뜻이 핵심이므로, ‘찾아돌보다’로 옮겨 돌봄과 돌이킴의 뉘앙스를 함께 살렸습니다.
theological_decisions:
- issue: 호격 기도문의 공손한 명령형 처리
  chosen_reading: 하나님께 직접 드리는 간구이므로 표준 합쇼체를 유지하되, ‘돌아오십시오/굽어보시고/찾아돌보소서’처럼 기도체에 자연스러운 공손한 명령을 사용했습니다.
  alternative_readings:
  - 중립적 서술형으로 완화
  - 더 전통적인 하옵소서체
  rationale: 시편의 탄원문은 하나님께 직접 호소하는 기도이므로, 합쇼체를 유지하면서도 간절한 청원성을 분명히 드러내는 형식이 가장 적합합니다.
  doctrine_reference: 시편 기도문의 خطاب(직접 호소)과 한국어 경어 체계
- issue: ‘פקד’의 신학적 중의성
  chosen_reading: ‘찾아돌보소서’로 번역해 단순 방문이 아니라 개입과 돌봄을 함께 드러냈습니다.
  alternative_readings:
  - 방문하소서
  - 돌보소서
  - 살펴보소서
  rationale: POB의 주석처럼 פקד은 단순 방문 이상으로 공동체의 복리를 위한 개입을 뜻할 수 있으므로, 본문이 가진 탄원적 긴장을 유지하는 표현을 택했습니다.
  doctrine_reference: 시편 80편의 회복 간구와 פקד의 의미 범위
