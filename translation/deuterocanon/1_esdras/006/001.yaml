translation:
  text: In the second year of the reign of Darius, Haggai and Zechariah son of Iddo, the prophets, prophesied to the Jews
    who were in Judea[a] and Jerusalem in the name of the Lord God of Israel, to them[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'Judah' for 'Judea'; the Greek regional name is Ἰουδαία.
    reason: lexical_alternative
  - marker: b
    text: The closing ἐπ’ αὐτούς may also be understood as 'over them' or 'concerning them.' The main wording 'to them' is
      retained; the compressed phrase is not resolved by this source-import repair.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν δὲ τῷ δευτέρῳ ἔτει
  chosen: In the second year
  alternatives:
  - And in the second year
  - In the second year
  - Now in the second year
  lexicon: LSJ
  rationale: The temporal phrase is retained as 'In the second year'; connective δέ is carried by the narrative context.
- source_word: τῆς Δαρείου βασιλείας
  chosen: of the reign of Darius
  alternatives:
  - of Darius's reign
  - of King Darius
  lexicon: LSJ
  rationale: βασιλεία here denotes kingship/reign rather than the abstract 'kingdom.' The genitive construction is most naturally
    rendered 'of the reign of Darius.'
- source_word: ἐπροφήτευσεν
  chosen: prophesied
  alternatives:
  - spoke as prophets
  - uttered prophecy
  lexicon: BDAG
  rationale: The aorist verb is the standard term for prophetic activity. English 'prophesied' is both accurate and natural.
- source_word: Ἀγγαῖος καὶ Ζαχαρίας ὁ τοῦ Ἐδδεὶν
  chosen: Haggai and Zechariah son of Iddo
  alternatives:
  - Haggai and Zechariah the son of Iddin/Iddo
  - Haggai and Zechariah, son of Iddo
  lexicon: LSJ
  rationale: The singular patronymic most naturally modifies Zechariah. The existing English name form Iddo is retained; this
    repair does not adjudicate a separate Hebrew parallel.
- source_word: οἱ προφῆται
  chosen: the prophets
  alternatives:
  - the prophet(s)
  lexicon: LSJ
  rationale: The directly checked printed body has one article and identifies Haggai and Zechariah as the prophets. The modern
    duplicate article is not evidence of an ancient scribal variant.
- source_word: ἐπὶ τοὺς Ἰουδαίους
  chosen: to the Jews
  alternatives:
  - against the Jews
  - over the Jews
  - concerning the Jews
  lexicon: BDAG
  rationale: With the verb of prophesying, the phrase can express the audience addressed. The existing 'to the Jews' is retained;
    alternative prepositional senses are not resolved by this import repair.
- source_word: τοὺς ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  chosen: who were in Judea and Jerusalem
  alternatives:
  - who were in Judah and Jerusalem
  - in Judea and in Jerusalem
  lexicon: LSJ
  rationale: The existing regional rendering Judea is retained for Ἰουδαία; Judah is a possible English alternative for the
    regional name. No separate Hebrew parallel is adjudicated here.
- source_word: ἐπὶ τῷ ὀνόματι Κυρίου θεοῦ Ἰσραήλ
  chosen: in the name of the Lord God of Israel
  alternatives:
  - by the name of the Lord God of Israel
  - under the name of the Lord, God of Israel
  lexicon: BDAG
  rationale: The phrase expresses prophetic authorization. The existing English 'in the name of' and the divine title Lord
    are retained.
- source_word: ἐπ’ αὐτούς
  chosen: to them
  alternatives:
  - over them
  - upon them
  - concerning them
  lexicon: BDAG
  rationale: The closing ἐπ’ αὐτούς is compressed and permits different construals. The existing main-text 'to them' is preserved,
    with over/concerning alternatives disclosed; this narrow source-import repair does not establish a preferred syntactic
    or source-priority judgment.
