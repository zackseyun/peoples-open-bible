- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Anthropomorphic expression 'light of your face'
  chosen_reading: Retain the metaphor rather than interpret it as 'favor' or 'presence' in the main text
  alternative_readings:
  - the light of your presence
  - your favor
  rationale: The Hebrew image communicates divine favor through the metaphor of God's shining face. Preserving the metaphor maintains the poetic and theological texture without flattening it into interpretation.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3 and #6'
