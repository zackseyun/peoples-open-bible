- timestamp: '2026-08-28T22:22:19Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: awkward_english
  tier: 1
  from: And who knows whether he will be wise or foolish? Yet he will rule over all my labor in which I labored and used wisdom under the sun[a]. This too is vanity.
  to: And who knows whether he will be wise or foolish? Yet he will rule over all that I labored for and applied wisdom to under the sun. This too is vanity.[a]
  rationale: The proposed “everything” expands the explicit object, “all my toil/labor,” into an unrestricted totality. In this context the heir rules over the results of Qoheleth's toil, so “all that I labored for” gives natural English without erasing that limitation. “Applied wisdom to” is idiomatic for ושחכמתי and retains the source's connection to the work. The hebel note belongs after “vanity.”
