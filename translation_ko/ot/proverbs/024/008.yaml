base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/008.yaml
  text: Whoever plans to do evil—to him they will call, “master of schemes.”
translation:
  language: ko
  text: 악을 꾸미는 자는—그를 가리켜 “음모의 대가”라 부를 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “계략의 주인”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְחַשֵּׁב לְהָרֵעַ
  english_pob_choice: Whoever plans to do evil
  chosen_korean: 악을 꾸미는 자
  alternatives_korean:
  - 악을 계획하는 자
  - 악을 도모하는 자
  - 해를 꾀하는 자
  lexicon: חשב / רע
  rationale: חשב는 단순한 생각보다 의도적 계획을 가리키므로 ‘꾸미다’로 옮겨 계획성과 음모성을 살렸고, לְהָרֵעַ는 ‘악을 행하다’의 목적 표지로 보아 ‘악을 꾸미는 자’로 응축했습니다.
- source_word: ל֝וֹ
  english_pob_choice: to him
  chosen_korean: 그를 가리켜
  alternatives_korean:
  - 그에게
  - 그에게는
  - 그를
  lexicon: לְ + pronominal suffix
  rationale: 문맥상 평판이나 호칭의 대상이 되는 방향을 드러내므로, 직역적 ‘그에게’보다 한국어에서 더 자연스러운 ‘그를 가리켜’로 처리했습니다.
- source_word: בַּעַל מְזִמּוֹת
  english_pob_choice: master of schemes
  chosen_korean: 꾀 많은 사람
  alternatives_korean:
  - 계략의 주인
  - 음모의 사람
  - 책략가
  lexicon: בעל + מזמות
  rationale: בעל은 ‘주인/소유자’의 관용적 관계를 나타내지만, 한국어에서 ‘주인’ 직역은 어색하므로 반복적 책략을 지닌 사람이라는 소속·특성을 살려 ‘꾀 많은 사람’으로 옮겼습니다.
theological_decisions:
- issue: 속담적 경구의 화자/주어 처리
  chosen_reading: 일반적 진술로서 ‘~할 것입니다’라는 미래형 경구체를 유지했습니다.
  alternative_readings:
  - '현재형 직설: ‘…라고 부릅니다’'
  - '무인칭 표현: ‘…라 불립니다’'
  rationale: 히브리어 잠언의 일반 진술을 한국어에서 자연스럽게 보이도록 하면서도, 인과적 결과 진술의 힘을 살리기 위해 미래형 경구체를 사용했습니다.
  doctrine_reference: 잠언의 지혜 문학적 일반 진술
- issue: 반복되는 호칭의 뉘앙스
  chosen_reading: ‘master of schemes’를 ‘꾀 많은 사람’으로 완화하되, 도덕적 평가를 흐리지 않았습니다.
  alternative_readings:
  - ‘계략의 달인’
  - ‘음모가’
  - ‘책략의 주인’
  rationale: 본문은 악을 계획하는 자가 그런 평판을 얻게 된다는 역설을 말하므로, 한국어에서 과도하게 현대적이거나 지나치게 강한 표현보다 관용적이면서도 부정적 뉘앙스를 유지하는 선택이 적절합니다.
  doctrine_reference: 잠언 24장의 지혜적 경고
