id: 2MA.15.35
reference: 2 Maccabees 15:35
source:
  edition: lxx-swete-1909
  text: ἐξέδησεν δὲ τὴν τοῦ Νικάνορος προτομὴν ἐκ τῆς ἄκρας ἐπίδηλον πᾶσιν, καὶ φανερὸν τῆς τοῦ κυρίου βοηθείας σημεῖον.
