  alternative_readings:
  - Expanded paraphrase such as 'fled to the altar for refuge'
  rationale: The Hebrew states the physical act; while the act implies appeal for sanctuary, importing that explanation into the main text would go beyond the wording. The cultural significance is better preserved in a footnote.
