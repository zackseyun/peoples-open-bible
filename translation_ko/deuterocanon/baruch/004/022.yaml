  - 성스러운 분에게서
  lexicon: ἅγιος
  rationale: 하나님을 가리키는 칭호로서 ‘거룩하신 분’을 택해, 인격적 출처를 유지하면서도 공경의 뉘앙스를 살렸습니다.
