  text: Enoch was found blameless, and he walked with the LORD, and he was taken away—an example of knowledge for generation after generation.
translation:
  language: ko
  text: 에녹은 흠 없는 사람으로 인정받았고, 야훼와 함께 걸었으며, 옮겨졌습니다. 그는 대대로 지식의 표징이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 병행본문은 ‘회개의 본보기’(ὑπόδειγμα μετανοίας)로 읽습니다.
    reason: cross_reference
lexical_decisions:
- source_word: נמצא תמים
  english_pob_choice: was found blameless
  chosen_korean: 흠이 없는 자로 밝혀졌고
  alternatives_korean:
  - 흠이 없는 것으로 드러났고
  - 완전한 사람으로 밝혀졌고
  lexicon: תמים
  rationale: תמים은 도덕적 흠없음을 가리키므로, 인물 평가를 살려 ‘흠이 없는 자’로 옮겼고, נמצא의 수동 결과를 자연스럽게 ‘밝혀졌고’로 처리했습니다.
- source_word: והתהלך עם יהוה
  english_pob_choice: he walked with the LORD
  chosen_korean: 야훼와 함께 걸었으며
  alternatives_korean:
  - 주님과 함께 걸었으며
  - 여호와와 함께 걸었으며
  lexicon: יהוה
  rationale: 히브리어 본문이 יהוה를 직접 쓰므로, 이 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다. ‘함께 걸다’는 יחס적 친밀성과 삶의 지속성을 보존합니다.
- source_word: ונלקח
  english_pob_choice: he was taken away
  chosen_korean: 옮겨졌습니다
  alternatives_korean:
  - 데려가졌습니다
  - 취하여졌습니다
  lexicon: לקח
  rationale: 문맥상 하나님께서 에녹을 이 세상에서 옮기신 사건을 가리키므로, 수동성을 유지하면서도 한국어에서 자연스러운 ‘옮겨졌습니다’로 옮겼습니다.
- source_word: אות דעת
  english_pob_choice: an example of knowledge
  chosen_korean: 지식의 본보기였습니다
  alternatives_korean:
  - 지식의 표징이었습니다
  - 지식의 모범이었습니다
  lexicon: אות / דעת
  rationale: 영어 POB의 ‘example’을 따르되, אות의 ‘표징’ 뉘앙스와 דעת의 ‘지식’을 함께 살려 ‘지식의 본보기’로 정리했습니다.
theological_decisions:
- issue: 에녹의 ‘옮겨짐’과 지식의 성격
  chosen_reading: 본문은 에녹의 의인의 삶과 그가 ‘옮겨진’ 사건을 연결하여 후대에 지식의 본보기로 제시합니다.
  alternative_readings:
  - ‘지식의 표징’으로 더 강하게 표상하는 읽기
  - ‘회개’(그리스어 병행본문 ὑπόδειγμα μετανοίας)를 따라 옮기는 읽기
  rationale: 히브리어 본문은 דעת를 말하며, 병행하는 헬라어가 회개를 보이지만 이 구절의 히브리어 본문과 영어 POB의 확정 본문을 우선하여 ‘지식’으로 유지했습니다.
  doctrine_reference: Sirach 44:16 parallel-text alignment
