  simplified_phrase: master our own desires by refusing to satisfy their evil cravings
  preserved_meaning: Believers must resist and overcome their sinful desires.
  reasoning_layer_used: POB text and immediate context
  rationale: This clarifies the inner struggle while retaining the force of overcoming desire.
- pob_phrase: almsgiving
  simplified_phrase: giving to the poor
  preserved_meaning: Material generosity toward people in need is commended.
  reasoning_layer_used: POB text and witness terminology
  rationale: The unfamiliar religious term is expressed in ordinary English.
interpretive_expansions:
- pob_phrase: the secret and open works of human beings shall appear
  rendering: everything people have done, whether secret or public, will be revealed
  claim: Judgment will reveal both concealed and openly performed deeds.
  evidence:
  - The paired terms contrast secret deeds with open or public deeds.
  - The judgment setting supports understanding their appearance as disclosure.
  confidence: high
  alternatives_preserved:
  - hidden or public deeds
  - secret and open works
