  meaning: Judith invokes Nebuchadnezzar’s life and enduring dominion to assure Holofernes that his power will bring both people and animals into the king’s service and benefit.
  meaning_decisions:
  - source_phrase: ζῇ γὰρ βασιλεὺς Ναβουχοδονόσορ πάσης τῆς γῆς καὶ ζῇ τὸ κράτος αὐτοῦ
    prior_rendering: For King Nebuchadnezzar, of all the earth, lives, and his dominion lives
    new_rendering: For as surely as Nebuchadnezzar, king of all the earth, lives and his dominion endures
    rationale: The repeated declaration of life functions as a solemn assurance, not merely a report that the king is alive; a dominion ‘living’ means that its ruling power continues.
  - source_phrase: εἰς κατόρθωσιν πάσης ψυχῆς
    prior_rendering: for the success of every living soul
    new_rendering: to bring prosperity to every living being
    rationale: The flattery presents the expedition as producing favorable outcomes for every life; ψυχή here denotes a living being rather than specifically the soul’s inner or spiritual life.
  - source_phrase: ἄνθρωποι
    prior_rendering: men
    new_rendering: people
    rationale: The contrast is between humans and animals, not between men and women.
  - source_phrase: τὰ κτήνη
    prior_rendering: the cattle
    new_rendering: the livestock
    rationale: The term includes domesticated animals generally, not only cattle.
  - source_phrase: διὰ τῆς ἰσχύος σου ζήσονται Ναβουχοδονόσορ καὶ πάντα τὸν οἶκον αὐτοῦ
    prior_rendering: will live under your strength for Nebuchadnezzar and all his house
    new_rendering: through your power ... will live for Nebuchadnezzar and his whole house
    rationale: The instrumental expression identifies Holofernes’ power as the means, while ‘live for’ retains the compressed claim that even animal life will belong to the king’s interests.
  footnote_kinds:
    a: literal_wording
