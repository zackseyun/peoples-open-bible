  rationale: 원문이 제시하는 긴장을 풀지 않고, 신적 분노와 개인의 죄를 동시에 드러내어 시편의 회개적 탄식을 보존합니다.
  doctrine_reference: 시편의 탄식이 말하는 죄-고통-하나님 관계의 긴장 보존
