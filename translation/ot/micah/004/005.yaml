theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Gendered distributive אִישׁ
  chosen_reading: each
  alternative_readings:
  - each man
  - every man
  - each one
  rationale: The source is grammatically masculine, but here it functions distributively with collective 'all the peoples,' not as a statement about male persons specifically. Rendering it as 'each' preserves the source intent rather than flattening it into an unnecessarily male-specific English phrase.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
