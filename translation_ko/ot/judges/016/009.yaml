revisions:
- from: 그리고 매복한 자는 내실에 그를 기다리고 있었습니다. 그러자 그녀가 그에게 말했습니다. 「블레셋 사람들이 당신에게 들이닥쳤습니다, 삼손!」 그는 새끼줄을 불에 탄 삼실처럼 끊어 버렸습니다. 그의 힘은 드러나지 않았습니다.[a][b]
