  from: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
  to: But he answered them, “You yourselves give them something to eat.” They said to him, “Are we to go and spend two hundred denarii[a] on bread and give it to them to eat?”
  rationale: I retain the recorded emphasis “You yourselves,” the sum of two hundred denarii, and the repeated language of giving food. The earlier wage note is attached to the currency and expresses the sum's scale, while the paired reply verbs are translated idiomatically.
