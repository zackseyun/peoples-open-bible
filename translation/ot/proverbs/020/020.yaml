id: PRO.20.20
reference: Proverbs 20:20
source:
  edition: WLC
  text: מְ֭קַלֵּל אָבִ֣י/ו וְ/אִמּ֑/וֹ יִֽדְעַ֥ךְ נֵ֝ר֗/וֹ ב/אישון חֹֽשֶׁךְ׃
translation:
  text: Whoever curses his father or mother—his lamp[a] will go out in deepest darkness.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The lamp is an image of a person's life and well-being.
    reason: cultural_note
lexical_decisions:
- source_word: מְקַלֵּל
  chosen: Whoever curses
  alternatives:
  - He who curses
  - One who reviles
  lexicon: HALOT
  rationale: The participle functions substantivally to denote a general person characterized by this action. 'Whoever curses' gives natural modern English while preserving the proverbial generality. 'Curses' is preferred over 'reviles' because קלל in this stem commonly denotes speaking a curse against, especially in parent-honor contexts.
- source_word: אָבִיו וְאִמּוֹ
  chosen: his father or mother
  alternatives:
  - his father or his mother
  lexicon: HALOT
  rationale: Natural English expresses that either offense incurs the consequence.
- source_word: יִדְעַךְ
  chosen: will go out
  alternatives:
  - will go out
  - will be extinguished
  lexicon: HALOT
  rationale: Retains the intransitive sense of a lamp being extinguished without specifying an agent.
- source_word: נֵרוֹ
  chosen: his lamp
  alternatives:
  - his light
  lexicon: HALOT
  rationale: נֵר is literally 'lamp.' Retaining 'lamp' preserves the concrete metaphor common in wisdom literature for life, prosperity, or posterity. 'Light' is possible but less precise.
- source_word: בְאִישׁוֹן חֹשֶׁךְ
  chosen: in deepest darkness
  alternatives:
  - in the pupil of darkness
  - in utter darkness
  - in blackest darkness
  lexicon: HALOT
  rationale: The idiom literally involves the 'pupil' or 'apple' of darkness, a Hebrew expression for the deepest or blackest darkness. A literal rendering would be obscure in English, so the idiomatic sense is brought into the main text. 'Deepest darkness' is vivid, readable, and faithful to the superlative force.
