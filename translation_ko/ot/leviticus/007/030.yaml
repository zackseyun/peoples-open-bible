revisions:
- from: 그의 손이 여호와의 화제물을 가져와야 합니다. 곧 그는 기름과 가슴을 가져와, 그 가슴을 여호와 앞에서 요제물로 흔들어야 합니다.[a]
  to: 그가 자기 손으로 여호와께 불살라 드리는 제물을 가져와야 합니다. 그는 가슴 위에 기름을 얹어 가져와서, 그 가슴을 여호와 앞에서 요제로 흔들어 바쳐야 합니다.
  rationale: ‘자기 손으로’로 원문의 직접성 강조를 자연스럽게 반영하고, ‘가슴 위에’로 עַל의 관계를 보존했습니다. 화제와 요제의 제의적 의미는 각각 ‘불살라 드리는 제물’과 ‘요제로 흔들어 바치다’로 전달했습니다. 불필요하고 잘못 배치된 어휘 각주는 삭제했습니다.
