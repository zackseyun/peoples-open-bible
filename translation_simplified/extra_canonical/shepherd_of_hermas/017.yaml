source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Ἀκούσατέ μου, τέκνα. ἐγὼ ὑμᾶς ἐξέθρεψα ἐν πολλῇ ἁπλότητι καὶ ἀκακίᾳ καὶ σεμνότητι διὰ τὸ ἔλεος
    τοῦ Κυρίου τοῦ ἐφ᾽ ὑμᾶς στάξαντος τὴν δικαιοσύνην, ἵνα δικαιωθῆτε καὶ ἁγιασθῆτε ἀπὸ πάσης πονηρίας
    καὶ ἀπὸ πάσης σκολιότητος. ὑμεῖς δὲ οὐ θέλετε παῆναι ἀπὸ τῆς πονηρίας ὑμῶν. 2. νῦν οὖν ἀκούσατέ μου
    καὶ εἰρηνεύετε ἐν ἑαυτοῖς καὶ ἐπισκέπτεσθε ἀλλήλους καὶ ἀντιλαμβάνεσθε ἀλλήλων, καὶ μὴ μόνοι τὰ κτίσματα
    τοῦ Θεοῦ μεταλαμβάνετε ἐκ καταχύματος, ἀλλὰ μεταδίδοτε καὶ τοῖς ὑστερουμένοις· 3. οἱ μὲν γὰρ ἀπὸ τῶν
    πολλῶν ἐδεσμάτων ἀσθένειαν τῇ σαρκὶ ἐπισπῶνται καὶ λυμαίνονται τὴν σάρκα αὐτῶν· τῶν δὲ μὴ ἐχόντων
    ἐδέσματα λυμαίνεται ἡ σάρξ αὐτῶν διὰ τὸ μὴ ἔχειν τὸ ἀρκετὸν τῆς τροφῆς, καὶ διαφθείρεται τὸ σῶμα αὐτῶν.
    4. αὕτη οὖν ἡ ἀσυνκρασία βλαβερὰ ὑμῖν τοῖς ἔχουσιν καὶ μὴ μεταδιδοῦσιν τοῖς ὑστερουμένοις. 5. βλέπετε
    τὴν κρίσιν τὴν ἐπερχομένην. οἱ ὑπερέχοντες οὖν ἐκζητεῖτε τοὺς πεινώντας ἕως οὔπω ὁ πύργος ἐτελέσθη·
    μετὰ γὰρ τὸ τελεσθῆναι τὸν πύργον θελήσετε ἀγαθοποιεῖν, καὶ οὐχ ἔξετε τόπον. 6. βλέπετε οὖν ὑμεῖς
    οἱ γαυρούμενοι ἐν τῷ πλούτῳ ὑμῶν, μήποτε στενάξουσιν οἱ ὑστερούμενοι, καὶ ὁ στεναγμὸς αὐτῶν ἀναβήσεται
    πρὸς τὸν Κύριον, καὶ ἐκκλεισθήσεσθε μετὰ τῶν [ἀσχέτων] ἀγαθῶν ὑμῶν ἔξω τῆς θύρας τοῦ πύργου. 7. νῦν
    οὖν ὑμῖν λεγω τοῖς προηγουμένοις τῆς ἐκκλησίας καὶ τοῖς πρωτοκαθεδρίταις· μὴ γίνεσθε ὅμοιοι τοῖς φαρμακοῖς.
    οἱ φαρμακοὶ μὲν οὖν τὰ φάρμακα ἑαυτῶν εἰς τὰς πυξίδας βαστάζουσιν, ὑμεῖς δὲ τὸ φάρμακον ὑμῶν καὶ τὸν
    ἰὸν εἰς τὴν καρδίαν. 8. ἐνεσκιρωμένοι ἐστὲ καὶ οὐ θέλετε καθαρίσαι τὰς καρδίας ὑμῶν καὶ συνκεράσαι
    ὑμῶν τὴν φρόνησιν ἐπὶ τὸ αὐτὸ ἐν καθαρᾷ καρδίᾳ, ἵνα σχῆτε ἔλεος παρὰ τοῦ βασιλέως τοῦ μεγάλου. 9.
    βλέπετε οὖν, τέκνα, μήποτε αὐται αἱ διχοστασίαι ὑμῶν ἀποστερήσουσιν τὴν ζωὴν ὑμῶν. 10. πῶς ὑμεῖς παιδεύειν
    θέλετε τοὺς ἐκλεκτοὺς Κυρίου, αὐτοὶ μὴ ἔχοντες παιδείαν; παιδεύετε οὖν ἀλλήλους καὶ εἰρηνεύετε ἐν
    αὐτοῖς, ἵνα κἀγὼ κατέναντι τοῦ πατρὸς ἱλαρὰ σταθεῖσα λόγον ἀποδῶ ὑπὲρ ὑμῶν πάντων τῷ Κυρίῳ ὑμῶν.
