translation:
  text: '“The tenth mountain had trees that sheltered some sheep. Its believers are like this:


    2. “They are hospitable overseers.[a] They always gladly welcomed God’s servants into their homes
    without hypocrisy. The overseers[b] continually used their service to shelter people in need and widows.
    They always lived in purity.”


    3. “The Lord will shelter all these people forever. God honors those who have done these things. Their
    place is already with the angels, if they keep serving the Lord to the end.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: '“Hospitable overseers” follows Harmer’s printed conjecture. The apparatus reports Athos “overseers
      and hospitable people”; the Latin has a corrupt stones/hospitality phrase, with “hosts of deacons”
      proposed by the editor. Reported Palatina/Ethiopic support is not fresh version collation. Alternative:
      “They are overseers and hospitable people, who always gladly welcomed God’s servants into their
      homes without hypocrisy.”'
  - marker: b
    reason: textual_variant
    text: “The overseers” translates bracketed wording in the printed edition. “All” in the next paragraph
      is also bracketed. “Overseers” renders episkopoi without specifying a later single-bishop office
      or claiming every witness has the same office description.
lexical_decisions:
- source_word: ἐπίσκοποι φιλόξενοι
  chosen: hospitable overseers
  alternatives:
  - overseers and hospitable people
  - hospitable bishops
  rationale: Follow the declared printed working choice with Athos alternative exposed. The role word
    alone does not establish a later church structure.
- source_word: ἐὰν ἐπιμείνωσιν ἕως τέλους
  chosen: if they persevere to the end
  alternatives:
  - because they persevered
  rationale: Retain the condition attached to their place with angels, not an unconditional claim.
