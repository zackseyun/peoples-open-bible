translation:
  language: en
  text: But I will never boast about anything except the cross of our Lord Jesus Christ.[a] Through that cross,[b] the world has been crucified to me, and I have been crucified to the world.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek title is often rendered “Christ.”
    reason: lexical_alternative
  - marker: b
    text: Or “Through him,” if this refers to the Lord Jesus the Messiah rather than to the cross.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: far be it from me to boast except
  simplified_phrase: I will never boast about anything except
  preserved_meaning: Paul strongly rejects every ground for boasting other than the cross.
  reasoning_layer_used: Lexical decisions for μὴ γένοιτο, καυχᾶσθαι, and εἰ μή
  rationale: The direct wording makes the strong personal rejection clear in modern English.
- pob_phrase: through which
  simplified_phrase: Through that cross
  preserved_meaning: The cross remains the primary antecedent and the means of the changed relationship.
  reasoning_layer_used: Lexical and theological decision for δι’ οὗ
  rationale: Repeating “cross” removes an unclear pronoun without resolving away the noted alternative.
- pob_phrase: and I to the world
  simplified_phrase: and I have been crucified to the world
  preserved_meaning: The supplied verb preserves the reciprocal crucifixion image and its continuing result.
  reasoning_layer_used: Lexical decision for κἀγὼ κόσμῳ and ἐσταύρωται
  rationale: Supplying the omitted verb makes the Greek parallel understandable while keeping its force.
translation_notes:
