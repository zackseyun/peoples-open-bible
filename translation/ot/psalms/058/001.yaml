    prior_rendering: Do you judge uprightly, sons of man?
    new_rendering: Do you judge people fairly?
    rationale: Taking 'sons of man' as the object of judgment best fits the address to corrupt authorities, and 'people' carries the Hebrew idiom naturally; the vocative interpretation is retained as an alternative.
