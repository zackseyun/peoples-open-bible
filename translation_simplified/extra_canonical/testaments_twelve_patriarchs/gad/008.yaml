translation:
  language: en
  text: 'Tell your children these things too:


    They must honor Levi and Judah, because from them the Lord will raise up salvation for Israel.[a] Tell them also to love Joseph. He remained innocent through every hardship and obeyed God’s command instead of returning evil for evil. Although his brothers made him suffer greatly and plotted against him, he loved them and spoke peaceably to them.


    Now, my children, I command you to love one another sincerely. If someone sins against you, speak peaceably to him without hiding deceit in your heart. If he admits his sin and reorients[d], forgive him. But if he denies it, do not let the dispute become heated. Otherwise, he may take in the quarrel’s poison, begin to swear, and add a second sin to the first.[b]


    If someone prospers more than you do, do not resent it. Instead, pray that he may receive every good thing in full. If someone is honored, do not envy him; if someone becomes rich, do not be jealous. Bless the Lord, who gives good things to everyone. A poor person who is free from envy is rich in the Lord’s sight.


    Do not hate a beautiful woman because of her appearance, or a man because he receives great honor. God gives the good things of the earth to whomever he chooses.


    Act with integrity, and pray for your neighbor so that you will not become jealous when things go well for him. A jealous person is always troubled, and a hateful person is always darkened within. Love one another in what you do, what you say, and what you intend in your heart. I myself spoke peaceably to Joseph while secretly intending to kill him.


    The spirit of hatred is evil. It is never at peace with anyone but always desires their downfall. It weakens the body, disturbs the soul, and fills the mind with anger.


    Therefore, when someone does evil to you, do good to him and pray for him. Then the Lord will redeem you from every evil. If a shameless or lawless person prospers, do not be jealous. Wait to see what outcome the Lord brings.[c] He may receive his reward in this life, or he may be kept for punishment and repaid at the judgment.


    A poor person who is free from envy is blessed above everyone else, even without wealth, because he possesses treasure that cannot perish. So cast away hatred and love one another with upright hearts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The reference to Levi and Judah may concern Israel’s priestly and royal lines broadly or may point to a more specific future hope.
    reason: cross_reference
  - marker: b
    text: The poison image shows how a heated quarrel can draw a person into further sin.
    reason: simplification_note
  - marker: c
    text: This may refer to the outcome the Lord assigns either in this life or at the final judgment.
    reason: lexical_alternative
  - marker: d
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in your soul hold no deceit
  simplified_phrase: without hiding deceit in your heart
  preserved_meaning: Peaceful words must not conceal inward dishonesty.
  reasoning_layer_used: The lexical decision for deceit and the contrast between speech and inward hatred.
  rationale: The wording makes inner duplicity clear in ordinary English.
- pob_phrase: love one another in deed and in word and in the intention of the soul
  simplified_phrase: love one another in what you do, what you say, and what you intend in your heart
  preserved_meaning: Love must govern actions, speech, and inward purpose as distinct areas.
  reasoning_layer_used: The lexical decision for the intention of the soul.
  rationale: The three-part command is retained in concrete language.
- pob_phrase: wait for the end from the Lord
  simplified_phrase: wait to see what outcome the Lord brings
  preserved_meaning: The prosperous wrongdoer’s final outcome belongs to the Lord.
  reasoning_layer_used: The lexical and theological decisions preserving providential and final-judgment possibilities.
  rationale: Outcome is clearer than end without resolving the documented ambiguity.
