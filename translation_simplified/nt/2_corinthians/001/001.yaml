simplification_decisions:
- pob_phrase: Paul ... and Timothy our brother, to the church
  simplified_phrase: From Paul ... and from Timothy, our brother. To God’s church
  preserved_meaning: Paul and Timothy are the senders, and the church is the recipient.
  reasoning_layer_used: source syntax and POB address structure
  rationale: Adding “from” and dividing the salutation makes its roles immediately clear.
- pob_phrase: by the will of God
  simplified_phrase: by God’s will
  preserved_meaning: God’s will is the basis of Paul’s apostleship.
  reasoning_layer_used: POB lexical decision for διὰ θελήματος θεοῦ
  rationale: The shorter possessive form expresses the same divine agency in natural English.
- pob_phrase: in all Achaia
  simplified_phrase: throughout Achaia
  preserved_meaning: The greeting includes believers across the whole region.
  reasoning_layer_used: POB lexical alternative for ἐν ὅλῃ τῇ Ἀχαΐᾳ
  rationale: “Throughout” communicates regional scope more naturally.
interpretive_expansions:
- pob_phrase: Paul ... and Timothy our brother, to the church
  rendering: From Paul ... and from Timothy, our brother. To God’s church
  claim: Paul and Timothy are explicitly identified as the senders.
  evidence:
  - The Greek names the senders before the dative recipient.
  - The POB already presents this as an epistolary address.
  confidence: high
  alternatives_preserved:
