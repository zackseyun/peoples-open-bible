  category: meaning_retranslation
  from: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
  to: Jesus was eating at Levi’s house[a], and many tax collectors and sinners were sharing the meal with him and his disciples, for many of them were following him.
  rationale: The earlier work deliberately left the house’s owner unnamed. I follow the stronger narrative connection to Levi, supported by Luke 5:29, while retaining Jesus’ house as a serious alternative.
