  from: In his eyes a contemptible person is rejected[a], but he honors those who fear Yahweh; he swears to his own harm[b] and does not go back on it.
  to: He despises a contemptible person, but honors those who fear Yahweh; he keeps his oath even when it brings him harm[a].
  rationale: The latest revision rightly made “contemptible” an ethical assessment rather than a report of others' treatment, and identified the oath as what he refuses to change. I preserve both gains while expressing the assessment actively and the costly oath-keeping directly.
