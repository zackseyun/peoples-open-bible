id: PSA.33.13
reference: Psalms 33:13
source:
  edition: WLC
  text: מִ֭/שָּׁמַיִם הִבִּ֣יט יְהוָ֑ה רָ֝אָ֗ה אֶֽת כָּל בְּנֵ֥י הָ/אָדָֽם־־׃
translation:
  text: From heaven Yahweh looks down; he sees all humanity.
  philosophy: dynamic
lexical_decisions:
- source_word: מִשָּׁמַיִם
  lemma: מִן
  chosen: From heaven
  alternatives:
  - From the heavens
  lexicon: HALOT
  rationale: The preposition מִן marks source ('from'), and שָׁמַיִם can be rendered 'heaven' or 'heavens.' In English, 'from heaven' is the more natural idiom here while still conveying the celestial vantage point.
- source_word: הִבִּיט
  chosen: looks down
  alternatives:
  - looked
  - gazes
  lexicon: HALOT
  rationale: With מִשָּׁמַיִם and the following verse’s heavenly dwelling, “looks down” naturally expresses the direction of the observation.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives: []
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: רָאָה
  chosen: he sees
  alternatives:
  - he saw
  - he observes
  lexicon: HALOT
  rationale: 'ראה is the common verb ''to see.'' As with הִבִּיט, the perfect is best rendered here as a present gnomic statement in poetry: the LORD sees humanity continually.'
- source_word: כָּל
  chosen: all
  alternatives:
  - every
  lexicon: HALOT
  rationale: כָּל with a following plural construct naturally means 'all' in a collective sense.
- source_word: בְּנֵי הָאָדָם
  chosen: humanity
  alternatives:
  - the children of man
  - humankind
  - humanity
  lexicon: HALOT
  rationale: This is a Hebrew collective expression for human beings; “humanity” renders its sense in ordinary English, with the literal form noted.
