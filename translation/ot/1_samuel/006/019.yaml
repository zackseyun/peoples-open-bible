  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Handling the difficult casualty number in the Masoretic Text
  chosen_reading: Provisionally retain both MT numerical phrases in the main text and identify the inspected contrary evidence in the note; do not settle the earliest count.
  alternative_readings:
  - seventy men out of fifty thousand men
  - fifty thousand and seventy men
