base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/018.yaml
  text: And among the priests there were found some who had taken foreign women[a].
translation:
  language: fr
  text: Parmi les prêtres, on trouva ceux qui avaient été rassemblés et qui avaient des femmes étrangères.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « ceux qui avaient été rassemblés, ayant des femmes étrangères ». La formulation transmise est difficile. Le parallèle hébreu porte : « Tous ceux-là avaient pris des femmes étrangères » et indique que certains d’entre eux avaient des enfants.'
    reason: Signaler la difficulté textuelle du grec et l’éclairage, sans substitution silencieuse, du parallèle hébreu.
lexical_decisions:
- source_word: εὑρέθησαν
  choice: on trouva
  rationale: Rend naturellement en français le passif aoriste grec tout en conservant l’idée d’un constat ou d’un recensement.
- source_word: τῶν ἱερέων
  choice: Parmi les prêtres
  rationale: Exprime clairement la valeur partitive du génitif.
- source_word: οἱ ἐπισυναχθέντες
  choice: ceux qui s’étaient réunis
  rationale: Conserve le participe transmis par le grec, malgré son articulation difficile dans ce contexte, plutôt que de l’omettre sur la seule base du parallèle hébreu.
- source_word: ἀλλογενεῖς γυναῖκας
  choice: des femmes étrangères
  rationale: ἀλλογενής désigne une personne appartenant à un autre peuple; « étrangères » est exact, courant et non archaïque.
- source_word: ἔχοντες
  choice: qui avaient
  rationale: Suit directement le sens de « avoir » dans le grec, sans imposer dans le texte principal l’interprétation matrimoniale plus explicite du parallèle hébreu.
theological_decisions:
- issue: Rapport entre le grec transmis et le parallèle hébreu concernant les femmes étrangères
  choice: Conserver dans le texte le sens littéral grec « avaient des femmes étrangères »
  alternative: « avaient pris pour femmes des étrangères » ou « avaient épousé des femmes étrangères »
  rationale: Le contexte et le parallèle hébreu indiquent vraisemblablement une union matrimoniale, mais le grec dit simplement ἔχοντες. La note signale cette précision sans effacer l’ambiguïté du témoin grec.
- issue: Traitement de ἐπισυναχθέντες, absent du sens principal du parallèle massorétique
  choice: Traduire explicitement « ceux qui s’étaient réunis »
  alternative: Omettre le participe et rendre « certains avaient pris des femmes étrangères »
  rationale: Le grec de Swete est l’ancrage primaire. Même si la formulation paraît difficile ou perturbée, une traduction formelle assortie d’une note respecte mieux la donnée textuelle transmise.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe reste lisible tout en conservant les éléments du grec primaire; la note explique la formulation inhabituelle et le témoignage parallèle.
