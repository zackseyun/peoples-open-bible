id: PRO.7.26
reference: Proverbs 7:26
source:
  edition: WLC
  text: כִּֽי רַבִּ֣ים חֲלָלִ֣ים הִפִּ֑ילָה וַ֝/עֲצֻמִ֗ים כָּל הֲרֻגֶֽי/הָ־־׃
translation:
  text: For many have fallen slain because of her; her slain are a vast multitude[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “and all her slain were mighty”; the Hebrew adjective can mean either “numerous” or “mighty.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - Because
  lexicon: HALOT
  rationale: Introduces the ground or explanation for the warning in the surrounding context. 'For' preserves the explanatory force naturally in English.
- source_word: רַבִּים
  chosen: many
  alternatives:
  - numerous
  lexicon: HALOT
  rationale: Common quantitative adjective meaning 'many' or 'numerous.' 'Many' is idiomatic and concise.
- source_word: חֲלָלִים
  chosen: the slain
  alternatives:
  - slain
  - pierced ones
  lexicon: HALOT
  rationale: In this context the noun refers to persons struck down fatally; “wounded” misleadingly implies nonfatal injury.
- source_word: הִפִּילָה
  chosen: has brought down
  alternatives:
  - has caused to fall
  - has brought down
  lexicon: HALOT
  rationale: This idiomatically represents the Hiphil causative, “caused to fall/felled.”
- source_word: וַעֲצֻמִים
  chosen: and numerous
  alternatives:
  - strong
  - powerful
  lexicon: HALOT
  rationale: The adjective plausibly has a quantitative sense in synonymous parallelism with רַבִּים; this best fits the line’s enumeration of victims.
- source_word: כָּל
  chosen: all
  alternatives:
  - every one of
  lexicon: HALOT
  rationale: Straightforward universal term; 'all' is the most natural rendering in this poetic line.
- source_word: הֲרֻגֶיהָ
  chosen: her slain
  alternatives:
  - those killed by her
  - her victims
  lexicon: HALOT
  rationale: This concise English preserves the passive participle and possessive suffix without supplying a more explicit verbal paraphrase.
