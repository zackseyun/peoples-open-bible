id: ECC.7.19
reference: Ecclesiastes 7:19
source:
  edition: WLC
  text: הַֽ/חָכְמָ֖ה תָּעֹ֣ז לֶ/חָכָ֑ם מֵֽ/עֲשָׂרָה֙ שַׁלִּיטִ֔ים אֲשֶׁ֥ר הָי֖וּ בָּ/עִֽיר׃
translation:
  text: Wisdom gives a wise man more strength than ten rulers in the city.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: הַחָכְמָה
  chosen: Wisdom
  alternatives:
  - the wisdom
  lexicon: HALOT
  rationale: Definite article is present, but English proverbial style commonly omits the article for an abstract noun. Capitalization is not theological personification, only sentence-initial.
- source_word: תָּעֹז
  chosen: gives strength
  alternatives:
  - strengthens
  - makes strong
  - prevails for
  lexicon: BDB, עזז, Hebrew College enhanced PDF pages 1781–1782
  rationale: תָּעֹז is Qal imperfect third-person feminine singular, with wisdom as subject. BDB places this verse under Qal be strong and renders the construction as wisdom being strong for the wise. 'Gives strength' interprets that predication and its beneficiary in natural English; it does not preserve a causative Hebrew stem. No fresh HALOT consultation is claimed.
- source_word: לֶחָכָם
  chosen: to a wise man
  alternatives:
  - for a wise man
  - the wise man
  lexicon: HALOT
  rationale: The prefixed ל marks advantage/dative. 'To a wise man' is straightforward; 'wise man' preserves the singular masculine form in keeping with the gender-accurate policy and the proverb-like individual reference.
- source_word: מֵעֲשָׂרָה
  chosen: more than ten
  alternatives:
  - beyond ten
  - than ten
  lexicon: HALOT
  rationale: 'The preposition מ here marks comparison: wisdom gives greater strength than that represented by ten rulers.'
- source_word: שַׁלִּיטִים
  chosen: rulers
  alternatives:
  - powerful men
  - governors
  - authorities
  lexicon: HALOT
  rationale: שַׁלִּיט denotes one exercising authority or dominion. 'Rulers' is broad, natural English and fits the civic setting of the verse.
- source_word: אֲשֶׁר הָיוּ בָּעִיר
  chosen: in the city
  alternatives:
  - who were in the city
  - in the city
  lexicon: HALOT
  rationale: Naturally incorporates the rulers’ location and retains the definite form of the Hebrew.
- source_word: תָּעֹז לֶחָכָם
  chosen: gives a wise man more strength
  alternatives: []
  lexicon: BDB, עזז, Hebrew College enhanced PDF page 1782
  rationale: Represents wisdom being strong for the wise and the comparative phrase idiomatically. The Hebrew verb is Qal, not Hifil; the beneficiary construction permits this English interpretation without a morphological causative claim. This rationale repair neither changes the pointed source nor settles priority over the published scroll's helping verb.
