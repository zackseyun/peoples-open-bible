  text: 그들은 새 노래를 부르며 말합니다. 「주께서는 두루마리를 받으시고 그 인들을 떼시기에 합당하십니다. 주께서 죽임을 당하셨고, 주의 피로 모든 족속과 언어와 백성과 나라에서 사람들을 사서 하나님께 드리셨기 때문입니다,
