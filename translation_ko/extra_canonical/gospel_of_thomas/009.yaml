base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/009.yaml
  text: 'Jesus said, "Behold, the sower went out; he filled his hand and cast seed. Some indeed fell on the path; the birds came and gathered them. Others fell on the rock, and they did not cast root down to the ground, and they did not send ears of grain up to the sky. And others fell on the thorns; they gathered them, choked the seed, and the worm ate them. And others fell on the good ground, and it gave good fruit up to the sky: it yielded sixty measures and one hundred twenty measures."'
  footnotes:
  - marker: he filled his hand
    text: Thomas adds this physical detail of the sower filling his hand, which is absent from the synoptic parallels.
    reason: textual_variant
  - marker: they gathered them
    text: Thomas uses the verb ⲕⲱⲧϥ ('gather, pluck') rather than 'devour' as found in the canonical gospels.
    reason: textual_variant
  - marker: cast root down... send ears of grain up
    text: This vertical imagery (down to the ground, up to the sky) is unique to Thomas's version of the parable.
    reason: textual_variant
  - marker: the worm ate them
    text: A detail unique to Thomas, adding an extra layer of destruction to the seed among the thorns.
    reason: textual_variant
  - marker: sixty measures and one hundred twenty measures
    text: Coptic ⲉⲥⲟⲧⲉ means 'measure' or 'yield'. Thomas diverges from the synoptic thirty/sixty/hundredfold, using specific measures and doubling the sixty to one hundred twenty.
    reason: textual_variant
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「보십시오, 씨 뿌리는 사람이 나가서 손에 가득 쥐고 씨를 뿌렸습니다. 어떤 것들은 길가에 떨어졌는데, 새들이 와서 그것들을 모았습니다. 다른 것들은 바위 위에 떨어졌는데, 뿌리를 땅으로 내리지 못했고 하늘로 이삭을 올리지도 못했습니다.[a] 또 다른 것들은 가시덤불에 떨어졌는데, 가시덤불이 그것들을 모아 씨를 질식시켰으며 벌레가 그것들을 먹었습니다. 또 다른 것들은 좋은 땅에 떨어졌는데, 그 땅이 하늘까지 좋은 열매를 맺었습니다. 그것은 예순 단위와 백스물 단위의 수확을 냈습니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문은 뿌리를 ‘땅으로’ 내리고 이삭을 ‘하늘로’ 올리는 상하 방향의 이미지를 사용합니다. 이 표현은 공관복음의 평행 이야기와 다른 토마스복음의 특징입니다.
    reason: textual_variant
  - marker: b
    text: 콥트어 ⲉⲥⲟⲧⲉ는 측량 단위 또는 수확량과 관련된 말로 이해됩니다. 본문은 이 말을 예순과 백스물 뒤에 각각 반복하므로, 특정 한국 도량형으로 정하지 않고 ‘단위’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁϥⲙⲉϩⲧⲟⲟⲧϥ / he filled his hand
  english_pob_choice: he filled his hand
  chosen_korean: 손에 가득 쥐고
  alternatives_korean:
  - 손을 가득 채우고
  - 손에 가득 담아
  lexicon: Crum 223a
  rationale: 씨 뿌리는 동작 앞에 덧붙는 토마스 고유의 육체적 세부를 살리되, 한국어에서는 자연스럽게 ‘손에 가득 쥐다’로 옮기는 것이 가장 직접적입니다.
- source_word: ⲕⲱⲧϥ
  english_pob_choice: gathered
  chosen_korean: 모았습니다
  alternatives_korean:
  - 거두었습니다
  - 낚아챘습니다
  lexicon: Crum 128b
  rationale: 복음서 평행본문의 ‘삼켜 버리다’가 아니라 ‘모으다/줍다’라는 토마스의 동사를 따라, 새들이 씨를 집어 모으는 그림을 유지했습니다.
- source_word: ⲧⲉⲩⲉϩⲙⲥ
  english_pob_choice: send ears of grain
  chosen_korean: 이삭을 올리지도 못했습니다
  alternatives_korean:
  - 이삭을 내지 못했습니다
  - 곡식을 올리지도 못했습니다
  lexicon: Crum 436a, 60b
  rationale: 위로 향하는 이미지가 핵심이므로 ‘이삭을 올리다’로 옮겨, ‘땅으로 뿌리를 내리다’와의 상하 대비를 살렸습니다.
- source_word: ϥⲛⲧ
  english_pob_choice: worm
  chosen_korean: 벌레
  alternatives_korean:
  - 구더기
  - 벌레류
  lexicon: Crum 624a
  rationale: 씨를 먹는 존재를 일반적이고 직역에 가까운 ‘벌레’로 처리해, 토마스 본문의 파괴적 추가 요소를 과장 없이 유지했습니다.
- source_word: ⲉⲥⲟⲧⲉ
  english_pob_choice: measures
  chosen_korean: 되
  alternatives_korean:
  - 말
  - 측량
  lexicon: Crum 60b
  rationale: 토마스의 결실량은 공관복음의 ‘배’식 표현이 아니라 구체적 ‘측량 단위’이므로, 한국어에서도 고정된 단위어 ‘되’로 옮겨 수량성을 드러냈습니다.
theological_decisions:
- issue: 토마스 특유의 수직 이미지 보존
  chosen_reading: ‘뿌리를 땅으로 내리지 못했고, 하늘로 이삭을 올리지도 못했습니다’로 직역해 수직 대비를 유지했습니다.
  alternative_readings:
  - ‘뿌리를 내리지 못했고 열매를 맺지 못했습니다’
  - ‘땅에 뿌리내리지 못했고 위로 자라지 못했습니다’
  rationale: 이 말씀은 단순한 실패 서술이 아니라 아래/위의 대비로 작동하므로, 의미를 평준화하지 않고 토마스의 독특한 상징 구조를 보존해야 합니다.
  doctrine_reference: 본문 내 수사 구조 보존 원칙
- issue: ‘감쌌고’의 주체 처리
  chosen_reading: 가시덤불이 씨를 ‘감쌌고’로 옮겨, 원문의 집합적·능동적 포획감을 살렸습니다.
  alternative_readings:
  - ‘씨를 끌어당겼고’
  - ‘씨를 덮었고’
  rationale: Coptic 동사는 단순히 둘러싸는 것보다 포획·포위의 뉘앙스가 있어, 한국어에서도 파괴 행위를 강하게 드러내는 표현을 택했습니다.
  doctrine_reference: 본문 이미지의 보존
