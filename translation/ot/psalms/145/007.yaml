id: PSA.145.7
reference: Psalms 145:7
source:
  edition: WLC
  text: זֵ֣כֶר רַב טוּבְ/ךָ֣ יַבִּ֑יעוּ וְ/צִדְקָתְ/ךָ֥ יְרַנֵּֽנוּ־׃
translation:
  text: They will pour forth praise in remembrance of your abundant goodness; they will sing for joy of your righteousness.
  philosophy: dynamic
lexical_decisions:
- source_word: זֵכֶר
  chosen: the remembrance
  alternatives:
  - remembrance
  - mention
  lexicon: HALOT
  rationale: The noun denotes remembered or commemorative mention in this praise context, for which “remembrance” is more accurate and natural than “memory.”
- source_word: רַב
  chosen: abundant
  alternatives:
  - great
  - much
  lexicon: HALOT
  rationale: As an attributive adjective modifying טובך, רַב conveys greatness in quantity or extent. 'Abundant' fits the collocation 'abundant goodness' idiomatically while retaining the sense of plentitude.
- source_word: טוּבְךָ
  chosen: your goodness
  alternatives:
  - your bounty
  - your good
  lexicon: HALOT
  rationale: טוּב commonly denotes goodness, goodness expressed in beneficence, or bounty. In praise context, 'your goodness' is the broadest and most natural rendering, avoiding narrowing the term to material bounty alone.
- source_word: יַבִּיעוּ
  chosen: will pour forth
  alternatives:
  - will utter
  - will gush out
  lexicon: HALOT
  rationale: The Hiphil of נבע evokes something bubbling up or pouring out. 'Pour forth' preserves the vivid metaphor of abundant speech better than the flatter 'utter.'
- source_word: וְצִדְקָתְךָ
  chosen: your righteousness
  alternatives:
  - your justice
  lexicon: HALOT
  rationale: צדקה can denote righteousness or justice. In this psalm's praise setting, 'righteousness' best captures God's morally right character and acts. 'Justice' is a viable alternative but is narrower in English. Because this is a theologically weighty term analogous to contested δικαιοσύνη, the alternative is preserved in a footnote.
- source_word: יְרַנֵּנוּ
  chosen: they will sing for joy
  alternatives:
  - they will shout joyfully
  - they will sing aloud
  lexicon: HALOT
  rationale: The Piel of רנן often expresses ringing cries of joy, whether shouted or sung. 'Sing for joy' is idiomatic in English psalmic style and fits the parallelism with verbal praise in the first colon.
