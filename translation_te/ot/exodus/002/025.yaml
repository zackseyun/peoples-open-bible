  text: וַ/יַּ֥רְא אֱלֹהִ֖ים אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֵּ֖דַע אֱלֹהִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/025.yaml
  text: God saw the sons of Israel, and God knew.
translation:
  language: te
  text: దేవుడు ఇశ్రాయేలీయులను చూశాడు; దేవుడు తెలుసుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులను
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఆధునిక తెలుగులో మొత్తం ఇశ్రాయేలు ప్రజలను సహజంగా సూచించే రూపం.
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: హీబ్రూ క్రియ యొక్క సూటి అర్థాన్ని నిలుపుతుంది.
- source_word: וַיֵּדַע
  choice: తెలుసుకున్నాడు
  rationale: ‘తెలుసుకొను/ఎరుగుట’ అనే మూలార్థాన్ని నిలుపుతూ, దేవుడు వారి పరిస్థితిని గుర్తించాడని విపులీకరించకుండా మూలంలోని సంక్షిప్తత మరియు భావ ఉద్రిక్తతను కాపాడుతుంది.
theological_decisions:
- issue: ‘దేవుడు తెలుసుకున్నాడు’ అనే అసంపూర్ణంగా అనిపించే వాక్యభాగం
  choice: కర్మను చేర్చకుండా ‘దేవుడు తెలుసుకున్నాడు’ అని ఉంచడం
  alternative: ‘దేవుడు వారి పరిస్థితిని పట్టించుకున్నాడు’ లేదా ‘వారిని జ్ఞాపకం చేసుకున్నాడు’
  rationale: మూల హీబ్రూలో יָדַע క్రియకు స్పష్టమైన కర్మ లేదు. దాని ఉద్దేశాన్ని ఒకే విధంగా వివరించడం మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను, అర్థవిస్తృతిని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైన, గౌరవప్రదమైన శైలి. రెండుసార్లు వచ్చిన ‘దేవుడు’ను మూలంలోని బలమైన పునరుక్తికి అనుగుణంగా నిలిపాం.
