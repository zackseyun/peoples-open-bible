id: PRO.24.34
reference: Proverbs 24:34
source:
  edition: WLC
  text: וּ/בָֽא מִתְהַלֵּ֥ךְ רֵישֶׁ֑/ךָ וּ֝/מַחְסֹרֶ֗י/ךָ כְּ/אִ֣ישׁ מָגֵֽן־׃פ
translation:
  text: and your poverty will come like a traveler, and your need like a warrior with a shield.
  philosophy: dynamic
lexical_decisions:
- source_word: וּבָא
  chosen: and ... will come
  alternatives:
  - so ... comes
  - then ... will come
  lexicon: HALOT
  rationale: 'Qal perfect of בוא with prefixed conjunction continues the consequence from the previous verse; in English a future sense fits the proverbial warning: poverty ''will come.'''
- source_word: מִתְהַלֵּךְ
  chosen: traveler
  alternatives:
  - walking about
  - prowling
  - roaming
  lexicon: HALOT
  rationale: Preserves the image of one who goes about or travels without adding the stealth of “prowler.”
- source_word: רֵישֶׁךָ
  chosen: your poverty
  alternatives:
  - your poverty/penury
  - your destitution
  lexicon: HALOT
  rationale: The noun denotes poverty or impoverishment. 'Poverty' is the most natural modern English equivalent and matches the warning context.
- source_word: וּמַחְסֹרֶיךָ
  chosen: and your need
  alternatives:
  - and your lack
  - and your want
  lexicon: HALOT
  rationale: The noun מחסור denotes lack or need. Singular 'need' is idiomatic in English even though the Hebrew form is plural/collective with suffix; it parallels 'poverty' smoothly without sounding wooden.
- source_word: כְּאִישׁ
  chosen: like a man
  alternatives:
  - as a man
  - like someone
  lexicon: HALOT
  rationale: The comparative כ plus איש is straightforward. Because the following noun specifies the kind of man, the full phrase is rendered together as 'like an armed man.'
- source_word: מָגֵן
  chosen: armed
  alternatives:
  - with a shield
  - shield-bearing
  lexicon: HALOT
  rationale: Literally 'shield.' In the idiom איש מגן, the sense is a man equipped for attack or confrontation. 'Armed man' communicates the force of the image in clear modern English; the more literal 'man with a shield' is possible and preserved in a footnote.
- source_word: אִישׁ מָגֵן
  chosen: a man with a shield
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Retains the explicit shield image rather than generalizing it to “armed man.”
