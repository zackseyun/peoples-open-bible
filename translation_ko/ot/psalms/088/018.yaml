  lexicon: HALOT
  rationale: 지속성을 나타내는 시간 표현으로, 히브리어의 반복적·지속적 뉘앙스를 현대 한국어에서 가장 자연스럽게 전달합니다.
- source_word: הִקִּיפוּ ... יָחַד
  english_pob_choice: they closed in on me ... together
  chosen_korean: 함께 저를 둘러쌌습니다
  alternatives_korean:
  - 한데 저를 둘러쌌습니다
  - 일제히 저를 둘러쌌습니다
  lexicon: HALOT
  rationale: 두 번째 동사는 첫 절의 ‘에워쌌습니다’와 어휘를 달리하되, 병행구가 보여 주는 집단적 합류와 압박을 ‘함께’와 ‘둘러싸다’로 살렸습니다.
theological_decisions:
- issue: 병행구의 중첩된 포위 이미지
  chosen_reading: 두 동사를 모두 포위·압박의 이미지로 살리되, 첫 번째는 ‘에워싸다’, 두 번째는 ‘둘러싸다’로 어휘를 구분했습니다.
  alternative_readings:
  - 두 동사를 모두 ‘에워쌌습니다’로 통일
  - 두 번째를 ‘몰려들었습니다’로 완화
  rationale: 히브리어는 서로 다른 동사로 반복적 포위를 강조하므로, 한국어에서도 중복을 완전히 평준화하지 않고 긴박한 압박감을 유지하는 편이 본문 의도에 더 가깝습니다.
  doctrine_reference: 시편 88편의 탄식시적 이미지와 병행법
