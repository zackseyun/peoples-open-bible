  source_fidelity: 원문의 발화자와 원인절(כִּי)은 대체로 잘 반영했습니다. 그러나 “이집트에서 올라올 때부터”의 ‘부터’는 원문이 말하는 ‘이집트에서 올라올 때/올라온 뒤’를 시간의 기점처럼 바꾸므로 삭제해야 합니다. 또한 אַרְצִי는 단순한 소유 표현인 ‘내 땅’으로 옮기는 것이 정확합니다.
  naturalness: 합쇼체와 인용문 형식은 자연스럽습니다. 다만 지명 범위는 ‘아르논에서부터 야복과 요단까지’보다 ‘아르논에서 야복까지, 또 요단까지’가 병렬 경계를 더 분명히 드러냅니다. ‘그 땅들을’은 원문의 여성 복수 목적어를 반영하면서 한국어 문맥에서도 이해 가능합니다.
