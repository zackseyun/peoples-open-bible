review_pass:
  verdict: revise
  source_fidelity: ‘그들처럼’과 ‘완전히’는 게에즈 본문에 없는 비교·강조를 더합니다. 또한 아모리 사람들에 관한 ‘악하고 죄를 지었습니다’는 원문의 성격 묘사를 별도의 행위 진술로 바꿉니다. 원문의 ‘악하고 죄 있는/죄 많은’이라는 병렬 서술을 유지해야 합니다.
  naturalness: 전반적인 합쇼체와 지명 표기는 자연스럽습니다. 다만 ‘자기 죄를 모두 완전히 채운’은 ‘모두’와 ‘완전히’가 중복되고, ‘자기’가 지시를 불필요하게 강화합니다. ‘자기들의 죄를 모두 채운’이 더 자연스럽고 원문에 가깝습니다.
  terminology: ‘주님’, ‘멸하셨습니다’, ‘아모리 사람들’, ‘죄’는 적절합니다. ‘그들도 악하고 죄를 지었습니다’는 ‘그들도 악하고 죄 많은 자들이었습니다’로 고쳐 원문의 도덕적 وصف을 보존합니다. 기존 각주 a와 b는 각각 ‘심판’ 및 ‘그들처럼’을 대안으로 제시하지만, 현 게에즈 본문과 최신 감사 기록에 맞지 않으므로 삭제합니다.
  issues:
  - severity: high
    issue: 원문에 없는 비교 표현 ‘그들처럼’이 추가되었습니다.
    rationale: 게에즈 본문의 ‘오늘날 자기들의 죄를 모두 완성한 백성이 없다’에는 ‘그들이 한 것처럼’에 해당하는 비교구가 없습니다. 영어 감사 기록도 이 확장을 제거했습니다.
  - severity: medium
    issue: ‘모두 완전히’가 원문의 ‘모두’를 중복·강화합니다.
    rationale: ኵሎ는 ‘모두/all’이며, 별도의 ‘완전히’에 해당하는 강조를 더하지 않는 것이 좋습니다.
  - severity: medium
    issue: 아모리 사람들에 대한 성격 묘사가 행위 진술로 바뀌었습니다.
    rationale: ‘악하고 죄를 지었습니다’는 죄를 범한 사건을 말하지만, 원문과 영어 감사문은 ‘evil and sinful’이라는 상태·성격 묘사입니다.
  - severity: medium
    issue: 각주 a와 b가 현 본문 및 원문 근거와 맞지 않습니다.
    rationale: a의 ‘judged them’은 አሕጐለ의 ‘destroyed’와 다르며, b의 ‘as they did’는 원문에 없는 비교를 되살립니다. 두 각주는 삭제해야 합니다.
  revised_text: 그들의 왕국은 가르나임과 아스타롯과 에드레이와 미수르와 브온이었습니다. 주님께서는 그들의 악한 행위 때문에 그들을 멸하셨습니다. 그들이 매우 악했기 때문입니다. 또 그들의 자리에 아모리 사람들을 살게 하셨는데, 그들도 악하고 죄 많은 자들이었습니다. 오늘날 자기들의 죄를 모두 채운 백성은 없으며, 그들은 더 이상 존재하지 않습니다.
  revised_footnotes: []
