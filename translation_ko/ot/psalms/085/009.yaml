source:
  edition: WLC
  text: אַ֤ךְ קָר֣וֹב לִ/ירֵאָ֣י/ו יִשְׁע֑/וֹ לִ/שְׁכֹּ֖ן כָּב֣וֹד בְּ/אַרְצֵֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/009.yaml
  text: Surely his salvation is near to those who fear him[b], so that glory may dwell in our land[a].
  footnotes:
  - marker: a
    text: '''Glory'' may refer to God''s manifest presence or to honor restored to the land.'
    reason: alternative_reading
  - marker: b
    text: Or 'Indeed, his deliverance is near those who fear him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 그분의 구원은 그분을 경외하는 이들에게 가까이 있습니다. 영광이 우리 땅에 머물도록 하려는 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영광’은 하나님의 나타난 임재를 가리킬 수도 있고, 그 땅에 회복되는 존귀를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשְׁמְעָה
  english_pob_choice: I will hear
  chosen_korean: 제가 들을 것은
  alternatives_korean:
  - 나는 들을 것입니다
  - 들어 보겠습니다
  lexicon: HALOT
  rationale: 코호르타티브의 결의/의도를 한국어에서 자연스럽게 드러내되, 뒤따르는 내용절을 앞세워 시편 화자의 태도를 살렸습니다.
- source_word: הָאֵל יְהוָה
  english_pob_choice: God Yahweh
  chosen_korean: 하나님 야훼
  alternatives_korean:
  - 하나님, 야훼
  - 하나님 주님
  lexicon: HALOT
  rationale: אֵל과 여호와의 결합을 두 요소로 모두 보존했습니다. 본문이 별칭이 아니라 병치를 이루므로 ‘하나님 야훼’로 직접적으로 옮겼습니다.
- source_word: חֲסִידָיו
  english_pob_choice: his faithful ones
  chosen_korean: 자기에게 신실한 이들
  alternatives_korean:
  - 그의 성도들
  - 그의 경건한 이들
  lexicon: HALOT
  rationale: חסיד의 언약적 충실함을 살리면서, ‘성도’의 교회적 관습어로 좁아지지 않도록 관계적·윤리적 의미를 유지했습니다.
- source_word: וְאַל יָשׁוּבוּ לְכִסְלָה
  english_pob_choice: but let them not turn back to folly
  chosen_korean: 그러나 그들이 어리석음으로 돌아가지 않게 하십시오
  alternatives_korean:
  - 그리고 그들이 어리석음으로 돌아가지 않게 하십시오
  - 그렇지만 그들이 어리석음으로 돌아가지 않게 하십시오
  lexicon: HALOT
  rationale: אַל + 미완료형의 금지/권고 기능을 반영해 단순 예측이 아니라 경고성 청유로 옮겼습니다. לְכִסְלָה는 문맥상 ‘어리석음’이 가장 자연스럽습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 표기할 것인가
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה를 음역으로 보존해 언약적 이름을 드러냈습니다. 일반적인 한국 교회어 ‘주님’은 본문상의 고유한 신명성을 약화시킬 수 있습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 마지막 절의 문장 힘
  chosen_reading: '금지/권고: ‘돌아가지 않게 하십시오’'
  alternative_readings:
  - '서술: ‘돌아가지 않을 것입니다’'
  - '희망: ‘돌아가지 않기를 바랍니다’'
  rationale: אַל이 붙은 형태는 단순 진술보다 금지적·권면적 뉘앙스가 강하므로, 시편의 경고를 살리기 위해 청유형으로 처리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
