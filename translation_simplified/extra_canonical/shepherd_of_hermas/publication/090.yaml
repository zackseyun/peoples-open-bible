    [καὶ ἓν ἔνδυμα]· τὰ γὰρ αὐτὰ ἐφρόνουν καὶ δικαιοσύνην εἰργάζοντο. 8. μετὰ οὖν χρόνον τινὰ ἀνεπείσθησαν
    ὑπὸ τῶν γυναικῶν ὧν εἶδες μέλανα ἱμάτια ἐνδεδυμένων, τοὺς ὤμους ἔξω ἐχουσῶν καὶ τὰς τρίχας λελυμένας
    καὶ εὐμόρφων. ταύτας ἰδόντες ἐπεθύμησαν αὐτῶν, καὶ ἐνεδύσαντο τὴν δύναμιν αὐτῶν, τῶν δὲ παρθένων ἀπεδύσαντο
    τὴν δύναμιν. 9. οὗτοι οὖν ἀπεβλήθησαν ἀπὸ τοῦ οἴκου τοῦ Θεοῦ καὶ ἐκείναις παρεδόθησαν. οἱ δὲ μὴ ἀπατηθέντες
    τῷ κάλλει τῶν γυναικῶν τούτων ἔμειναν ἐν τῷ οἴκῳ τοῦ Θεοῦ. ἔχεις, φησί, τὴν ἐπίλυσιν τῶν ἀποβεβλημένων.
