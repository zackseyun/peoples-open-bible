  from: A king’s heart is like channels of water in the hand of Yahweh[b][a]; he turns it wherever he desires.
  to: A king’s heart is like channels of water[a] in Yahweh’s hand; he directs it wherever he pleases.
  rationale: The possessive recast is natural English and retains the Hebrew hand image. “Directs” appropriately renders the Hiphil in the water-channel simile, and “wherever he pleases” is a natural contextual rendering of the volitional clause. The retained lexical note must be anchored to “channels of water,” rather than left orphaned.
