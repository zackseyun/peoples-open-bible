base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/001.yaml
  text: And after that I saw another host of chariots, and men riding in them; and they were coming upon the winds from the east and from the west, as far as the south.
translation:
  language: ko
  text: 그 후에 나는 다른 수레 무리와 그 안에 탄 사람들을 보았는데, 그들은 동쪽과 서쪽에서 불어오는 바람 위를 타고 와서 남쪽까지 이르렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወርኢኩ / I saw
  english_pob_choice: I saw
  chosen_korean: 나는 보았습니다
  alternatives_korean:
  - 내가 보았습니다
  - 나는 보았는데
  lexicon: 시각 동사
  rationale: 예언적 환상 서술의 직접 보고를 자연스럽게 드러내기 위해 1인칭 과거형으로 옮겼습니다.
- source_word: ካልእተ ትዕይንተ ሠረገላት
  english_pob_choice: another host of chariots
  chosen_korean: 다른 수레 무리
  alternatives_korean:
  - 또 다른 수레 떼
  - 또 다른 병거 무리
  lexicon: 수레 / 병거 / 무리
  rationale: 기본 이미지는 전차·병거 계열이지만, 본문은 집합체를 강조하므로 ‘무리’로 옮기고, 고전적 종교어인 ‘병거’보다 직역적이고 현대적인 ‘수레’를 택했습니다.
- source_word: ወእገዚ፡ ይጼዐኑ፡ ሰብእ፡ ውስቴቶሙ
  english_pob_choice: and men riding in them
  chosen_korean: 그 안에 탄 사람들
  alternatives_korean:
  - 그 안에서 타고 있는 사람들
  - 그 수레들에 탄 사람들
  lexicon: ride / in them
  rationale: 행위의 지속보다 장면의 상태를 간결하게 보여 주는 표현으로 옮겼으며, ‘사람들’은 원문의 ሰብእ을 충실히 반영합니다.
- source_word: ዲበ፡ ነፋሳት፡ እምስራቅ፡ ወእምዕራብ
  english_pob_choice: coming upon the winds from the east and from the west
  chosen_korean: 동쪽과 서쪽에서 불어오는 바람 위를 타고 와서
  alternatives_korean:
  - 동쪽과 서쪽 바람을 타고 와서
  - 동쪽과 서쪽에서 오는 바람 위로 와서
  lexicon: winds / upon
  rationale: ‘위를 타고’는 ἐπὶ/‘upon’에 해당하는 이동 이미지를 살리면서 한국어로 자연스럽게 만들며, ‘불어오는 바람’은 출발 방향을 분명하게 합니다.
theological_decisions:
- issue: 시각 환상 묘사의 번역 톤
  chosen_reading: 예언적 환상을 과장하지 않고, 본문의 장면 전개를 있는 그대로 서술하는 평이한 문장으로 옮겼습니다.
  alternative_readings:
  - 문학적으로 더 장중한 표현
  - 상징 해석을 덧붙이는 표현
  rationale: 본문은 해석보다 관찰이 중심이므로, 독자가 장면을 직접 보듯 이해하도록 최소한의 해설만 두는 것이 원문에 충실합니다.
  doctrine_reference: 본문 충실성 / 환상 서술
