id: PRO.28.25
reference: Proverbs 28:25
source:
  edition: WLC
  text: רְחַב נֶ֭פֶשׁ יְגָרֶ֣ה מָד֑וֹן וּ/בוֹטֵ֖חַ עַל יְהוָ֣ה יְדֻשָּֽׁן־־׃
translation:
  text: A greedy person[a] stirs up strife, but the one who trusts in Yahweh will flourish.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “An arrogant person”; literally, “one broad of soul.”
    reason: alternative_reading
lexical_decisions:
- source_word: רְחַב נֶפֶשׁ
  chosen: a greedy person
  alternatives:
  - one broad of soul
  - the broad-souled person
  - the proud person
  - the one of large appetite
  lexicon: HALOT, BDB
  rationale: The idiom describes expansive, grasping desire; the contextual English equivalent is “greedy person.”
- source_word: יְגָרֶה
  chosen: stirs up
  alternatives:
  - provokes
  - incites
  lexicon: HALOT, BDB
  rationale: The Hiphil form conveys causing or provoking. 'Stirs up' is idiomatic English for causing conflict and fits the proverb's concise style.
- source_word: מָדוֹן
  chosen: strife
  alternatives:
  - contention
  - quarreling
  lexicon: HALOT, BDB
  rationale: A common wisdom-term for interpersonal conflict. 'Strife' is concise, natural, and suitably weighty.
- source_word: וּבֹטֵחַ
  chosen: but the one who trusts
  alternatives:
  - and the one who trusts
  - but whoever trusts
  lexicon: HALOT, BDB
  rationale: The conjunction here is best taken adversatively in the proverb's antithetical parallelism. 'The one who trusts' preserves the participial, character-describing force.
- source_word: עַל יְהוָה
  chosen: in Yahweh
  alternatives:
  - on the LORD
  lexicon: HALOT, BDB
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: יְדֻשָּׁן
  chosen: will prosper
  alternatives:
  - will be enriched
  - will be made fat
  - will thrive
  lexicon: HALOT, BDB
  rationale: Literally 'will be made fat,' a Hebrew image for flourishing, abundance, or well-being. 'Will prosper' communicates the metaphor's sense in readable modern English without importing materialistic excess; 'thrive' was possible, but 'prosper' better matches the wisdom contrast.
- source_word: יְדֻשָּׁן
  chosen: will flourish
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Literally “will be made fat,” this is an image of abundance and well-being, naturally conveyed by “will flourish.”
