id: SNG.1.17
reference: Song of Songs 1:17
source:
  edition: WLC
  text: קֹר֤וֹת בָּתֵּ֨י/נוּ֙ אֲרָזִ֔ים רחיט/נו בְּרוֹתִֽים׃
translation:
  text: The beams of our houses are cedars; our rafters[a] are cypresses[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “paneling” or “galleries”; the Hebrew architectural term is uncertain.
    reason: alternative_reading
  - marker: b
    text: Or “junipers” or “firs”; the exact tree species is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: קֹרוֹת
  chosen: beams
  alternatives:
  - rafters
  - boards
  lexicon: HALOT
  rationale: Refers to structural timbers of a building, especially roof beams. 'Beams' is natural modern English and fits the parallel with the second colon.
- source_word: בָּתֵּינוּ
  chosen: our houses
  alternatives:
  - our houses
  - our home
  lexicon: HALOT
  rationale: The Hebrew form is plural; English can preserve that number without becoming unnatural.
- source_word: אֲרָזִים
  chosen: cedars
  alternatives:
  - cedar wood
  lexicon: HALOT
  rationale: The plural noun denotes cedar timbers. 'Cedars' is the most direct rendering and works idiomatically in English predicate position.
- source_word: רַחִיטֵנוּ
  chosen: our rafters
  alternatives:
  - our paneling
  - our galleries
  lexicon: HALOT
  rationale: The noun is somewhat uncertain, but in architectural context and parallel with 'beams' it most likely refers to roof members or rafters. This yields a coherent image of the lovers' dwelling framed by fine wood.
- source_word: בְּרוֹתִים
  chosen: cypresses
  alternatives:
  - junipers
  - firs
  lexicon: HALOT
  rationale: The tree identification is debated. 'Cypresses' is a common modern rendering for בְּרוֹתִים/בְּרוֹשִׁים in architectural contexts and suits the pairing with cedars. Alternative identifications are preserved in a footnote.
