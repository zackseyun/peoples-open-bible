    22. “내가 그것을 네 자손에게 주겠습니다.” 아브람은 헤브론으로 가서 거기서 살았습니다. 그리고 그 해에 엘람 왕 그돌라오멜과 시날 왕 아므라벨과 엘라살 왕 아리옥이 왔습니다.

    23. 그리고 민족들의 왕 타르갈과 그들은 고모라의 왕을 죽였고, 소돔의 왕은 도망쳤으며, 많은 사람이 소금 바다 곁에 있는 소돔 사람들의 골짜기의 역청 속으로 떨어졌습니다 그들은 소돔과 아드마와 스보임을 사로잡았고, 아브람의 형제의 아들인 롯과 그의 모든 재산도 사로잡아 단까지 갔습니다.

    24. 그리고 도망쳐 온 한 사람이 와서 아브람에게 그의 형제의 아들이 사로잡혔다고 알렸습니다. 아브람은 자기 집에서 태어난 종들을 무장시켰습니다. … 아브람과 그의 자손에게는 여호와께 드릴 첫 십일조가 있으며, 여호와께서는 그것을 영구한 규례로 세우셔서, 그들이 그분 앞에서 섬기는 제사장들에게 그것을 주게 하셨습니다.

    25. 그들이 그것을 영원히 소유하게 하려는 것이었습니다.

    26. 이 율법에는 기한이 없으니, 하나님께서 그것을 모든 세대를 위하여 영원히 정하셨기 때문입니다. 곧 그들이 모든 것에서 십분의 일을 야훼께 드리도록 하신 것입니다. 곧 씨앗과 포도주와 기름에서 말입니다.

    27. 또한 소와 양에서 나온 것이 있었습니다. 그는 그것을 자기 제사장들에게 주어, 그들이 기뻐하며 먹고 마시게 하였습니다.

