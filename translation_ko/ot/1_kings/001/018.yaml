  text: And now, look, Adonijah has become king, and now, my lord the king, you do not know it.
translation:
  language: ko
  text: 이제 보십시오. 아도니야가 왕이 되었고, 이제 내 주 왕께서는 그것을 알지 못하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה / And now
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 지금
  - 이제는
  lexicon: עתה
  rationale: 화자의 긴급한 현재 상황 제시를 간결하게 살리되, 문장 시작의 전환성을 자연스럽게 표현했습니다.
- source_word: הִנֵּה / look, behold
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: הנה
  rationale: 직접 호소의 감탄적 주의를 한국어 합쇼체로 옮겨, 구어적이되 공적인 경고 뉘앙스를 유지했습니다.
- source_word: אֲדֹנִיָּה מָלָךְ
  english_pob_choice: Adonijah has become king
  chosen_korean: 아도니야가 왕이 되었고
  alternatives_korean:
  - 아도니야가 왕이 되었습니다
  - 아도니야가 통치하게 되었고
  lexicon: מלך
  rationale: מלך의 결과 상태를 한국어 완료 표현으로 자연스럽게 옮겼고, ‘왕이 되다’가 왕권 획득의 사실을 가장 सीधे하게 드러냅니다.
- source_word: לֹא יָדָעְתָּ
  english_pob_choice: you do not know it
  chosen_korean: 그것을 알지 못하십니다
  alternatives_korean:
  - 그 사실을 모르십니다
  - 알지 못하십니다
  lexicon: ידע
  rationale: 발화 대상인 왕에게 직접 말하는 존대형을 유지하면서, 왕위 찬탈의 ‘그것’을 목적어로 보충해 한국어 문장을 분명하게 했습니다.
theological_decisions:
- issue: Direct royal address to the king in reported speech
  chosen_reading: “내 주 왕께서는 … 알지 못하십니다”로 존대형을 유지했습니다.
  alternative_readings:
  - 평서형으로 낮추기
  - 더 고전적인 왕대접 표현 사용
  rationale: 본문은 궁정 보고의 정중한 호칭을 담고 있으므로, 합쇼체와 ‘내 주 왕’으로 화자의 경어 수준을 살렸습니다.
  doctrine_reference: 서사체 화자-청자 관계의 사회적 위계 재현
