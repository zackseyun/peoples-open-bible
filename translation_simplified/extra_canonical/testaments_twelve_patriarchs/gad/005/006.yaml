translation:
  language: en
  text: I finally understood these things after I changed my attitude[a] toward Joseph.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims. Retain changed my attitude toward Joseph for the personal reversal in 5:6, matching the paired record, while using repentance for 5:7-8.
    reason: lexical_alternative
