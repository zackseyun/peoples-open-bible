theological_decisions:
- issue: Rendering the repeated temple formula
  chosen_reading: 'The repeated phrase is kept verbatim: ''The temple of Yahweh, the temple of Yahweh, the temple of Yahweh are these.'''
  alternative_readings:
  - '''This is the temple of the LORD...'''
  - '''The LORD''s temple...'''
  rationale: The Hebrew repeats the phrase three times for rhetorical force, exposing Judah's superstitious confidence in the sanctuary. Preserving the repetition maintains the prophetic critique without softening it into paraphrase.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
