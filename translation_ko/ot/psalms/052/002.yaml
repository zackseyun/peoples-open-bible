translation:
  language: ko
  text: 강한 자여, 왜 악을 자랑합니까? 하나님의 한결같은 사랑은 온종일 계속됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹוא
  english_pob_choice: when ... came
  chosen_korean: ~했을 때
  alternatives_korean:
  - 오는 동안
  - 들어올 때
  lexicon: HALOT
  rationale: בְּ + 부정사구는 시간 부사절을 이루므로, 현대 한국어에서는 자연스러운 ‘~했을 때’로 옮기는 것이 가장 직접적입니다.
- source_word: דּוֹאֵג הָאֲדֹמִי
  english_pob_choice: Doeg the Edomite
  chosen_korean: 도엑이 에돔 사람으로
  alternatives_korean:
  - 도엑 곧 에돔 사람
  - 도엑, 에돔 사람
  lexicon: HALOT
  rationale: 고유명사와 민족 표지를 함께 살리되, 서술적으로 ‘에돔 사람’이라 옮겨 인물 식별 기능을 분명히 했습니다.
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 말하다
  alternatives_korean:
  - 알리다
  - 전하다
  lexicon: HALOT
  rationale: נגד의 히필은 ‘알리다/말하다/보고하다’의 의미를 가지며, 여기서는 사울에게 한 보고를 자연스럽게 드러내는 ‘말하다’가 적절합니다.
- source_word: בָּא דָוִד אֶל בֵּית אֲחִימֶלֶךְ
  english_pob_choice: David has come to the house of Ahimelech
  chosen_korean: 다윗이 아히멜렉의 집에 왔습니다
  alternatives_korean:
  - 다윗이 아히멜렉의 집에 왔습니다/왔습니다
  - 다윗이 아히멜렉의 집으로 갔습니다
  lexicon: HALOT
  rationale: 보고문 안의 완료형은 결과의 현재성을 가질 수 있으므로, EN POB의 ‘has come’에 맞춰 ‘왔습니다’로 옮겼습니다. ‘집에’는 אֶל בֵּית의 도착 방향을 살립니다.
theological_decisions:
- issue: 보고 속 인용문의 시제 처리
  chosen_reading: 직접인용 안에서는 ‘왔습니다’로 현재 관련성을 살려, 사울이 들은 보고의 완료성을 드러냈습니다.
  alternative_readings:
  - ‘왔습니다’ 대신 ‘왔습니다/왔어요’
  - ‘왔습니다’ 대신 단순 과거 ‘왔다’
  rationale: 히브리어 완료형은 문맥상 단순 과거로도, 현재 관련성을 띤 완료로도 읽힐 수 있어, 한국어에서는 정중한 보고체로 그 여지를 보존했습니다.
  doctrine_reference: 서술 시제와 담화 관점
- issue: 직접화법의 문체
  chosen_reading: 사울에게 전하는 보고의 문체는 평서형 정중체를 유지하고, 인용문은 사울의 전달 내용을 직접적으로 드러내는 평서형으로 처리했습니다.
  alternative_readings:
  - 인용문을 간접화법으로 완화
  - 인용문을 더 성경적 어휘로 치환
  rationale: 원문의 보고-인용 구조를 보존하면서도, 한국어 독자가 자연스럽게 읽을 수 있도록 합쇼체를 유지했습니다.
  doctrine_reference: 서사 담화 शैली
