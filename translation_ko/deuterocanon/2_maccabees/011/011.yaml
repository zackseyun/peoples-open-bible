  text: But springing at the enemies like lions, they struck down eleven thousand of them, and sixteen hundred cavalry; and they forced them all to flee.
translation:
  language: ko
  text: 그들은 사자처럼 적군에게 달려들어 그들 가운데 만 천 명과 기병 천육백 명을 쓰러뜨리고, 그들 모두가 달아나게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεόντινων δὲ ἐντινάξαντες εἰς τοὺς πολεμίους
  english_pob_choice: springing at the enemies like lions
  chosen_korean: 사자처럼 적군을 향해 돌진하여
  alternatives_korean:
  - 사자처럼 적들에게 뛰어들어
  - 사자들처럼 원수에게 달려들어
  lexicon: ἐντινάσσω; λέων
  rationale: 사자 같은 맹렬함을 살리면서도 한국어에서 자연스러운 군사적 동작인 ‘돌진하여’로 압축했습니다.
- source_word: κατέστρωσαν αὐτῶν χιλίους πρὸς τοῖς μυρίοις
  english_pob_choice: they struck down eleven thousand of them
  chosen_korean: 만천 명과
  alternatives_korean:
  - 열한 천 명과
  - 일만 천 명과
  lexicon: χιλία; μυριάς
  rationale: πρὸς τοῖς μυρίοις는 ‘만에 더하여 천’을 뜻하므로 ‘만천 명’으로 수치를 직역해 분명히 했습니다.
- source_word: ἱππεῖς δὲ ἑξακοσίους πρὸς χιλίοις
  english_pob_choice: and sixteen hundred cavalry
  chosen_korean: 육백 명의 기병
  alternatives_korean:
  - 천육백 명의 기병
  - 1,600명의 기병
  lexicon: ἱππεύς
  rationale: ἑξακοσίους πρὸς χιλίοις는 합계 1,600명을 가리키므로, POB의 ‘cavalry’를 자연스럽게 ‘기병’으로 옮겼습니다.
- source_word: τοὺς δὲ πάντας ἠνάγκασαν φεύγειν
  english_pob_choice: and they forced them all to flee
  chosen_korean: 그들 모두를 도망하게 만들었습니다
  alternatives_korean:
  - 그들 모두를 도망치게 했습니다
  - 모두 달아나게 했습니다
  lexicon: ἀναγκάζω; φεύγω
  rationale: 강제성을 드러내는 ἠνάγκασαν을 살려 ‘도망하게 만들었습니다’로 옮겼습니다.
