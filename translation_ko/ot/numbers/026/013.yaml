  rationale: The revision preserves the Hebrew's two balanced genealogical entries while using conventional Korean biblical names, precise clan terminology, natural Korean syntax, and formal-polite 합쇼체. The supplied verb is required for a complete Korean sentence and does not add a theological or historical claim beyond the source's genealogical classification.
