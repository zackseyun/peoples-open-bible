revisions:
- from: 그리고 재판관들은 철저히 조사할 것입니다. 그리고 보십시오, 그 증인이 거짓 증인이고 자기 형제에게 거짓으로 증언한 것이 드러나면[a]
  to: 재판관들은 철저히 조사해야 합니다. 그러면 그 증인이 거짓 증인, 곧 자기 형제에 대하여 거짓으로 증언한 자임이 드러날 것입니다.
  rationale: 법적 지시로서의 동사 형태를 ‘조사해야 합니다’로 옮기고, וְהִנֵּה의 발견·확인 기능은 부자연스러운 감탄적 직역 대신 결과 연결인 ‘그러면’으로 반영했습니다. 반복되는 ‘거짓’과 증언의 내용은 유지했으며, ‘형제에 대하여’로 증언의 불리한 방향을 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:09Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 재판관들의 철저한 조사 뒤 거짓 증인임이 확인되는 결과를 제시합니다. 초안의 조건절 자체는 문맥상 가능하지만, ‘그리고 보십시오’는 현대 한국어 법률·서사 문맥에서 부자연스럽고, ‘자기 형제에게’는 בְאָחִיו의 불리한 방향(‘그의 형제에 대하여/against’)을 충분히 나타내지 못합니다.
  naturalness: ‘그리고 보십시오’와 ‘드러나면’의 결합은 현대 표준어 합쇼체에서 어색합니다. 조사 결과를 자연스럽게 이어 주는 ‘그러면 … 드러날 것입니다’가 적절합니다.
  terminology: ‘재판관’, ‘거짓 증인’, ‘증언’은 적절합니다. ‘자기 형제에 대하여 거짓으로 증언한’으로 하여 원문의 대적·불리한 방향을 보존합니다.
  issues:
  - severity: medium
    issue: ‘그리고 보십시오’의 직역적 삽입
    rationale: וְהִנֵּה는 발견·확인의 담화 전환을 나타내지만, 이를 ‘그리고 보십시오’로 옮기면 현대 한국어에서 부자연스럽고 본문의 법정 진술 흐름을 끊습니다.
  - severity: medium
    issue: ‘자기 형제에게 거짓으로 증언한’의 방향성
    rationale: בְאָחִיו는 이 문맥에서 형제를 상대로, 곧 그에게 불리하게 한 증언을 뜻합니다. ‘에게’는 수혜·상대의 의미로도 읽혀 불리한 방향을 충분히 나타내지 못합니다.
  - severity: low
    issue: 조사 결과의 표현
    rationale: ‘드러나면’은 다음 절과의 조건적 연결을 예상하게 하지만, 이 절 자체는 조사 후 드러나는 사실을 진술합니다. 결과를 평서로 표현하는 편이 원문 구조와 한국어 흐름에 더 가깝습니다.
  revised_text: 재판관들은 철저히 조사해야 합니다. 그러면 그 증인이 거짓 증인, 곧 자기 형제에 대하여 거짓으로 증언한 자임이 드러날 것입니다.
