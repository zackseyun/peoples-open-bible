  rationale: The rendering 'before yourself' for the Greek 'ἔμπροσθέν σου' is grammatically correct but sounds slightly stiff and unnatural in English. The more common and idiomatic phrase is 'before you'. While the choice to use 'yourself' understandably aims to emphasize the reflexive nature of the action, this is already clear from the context. Opting for 'before you' would improve the English flow without any loss of meaning.
