  - severity: low
    issue: ‘들어와서’가 원문의 비한정적 ‘오라/와서’를 좁힙니다.
    rationale: בּוֹא에는 이 절에서 명시된 ‘안으로 들어감’의 보어가 없으므로 ‘와서’가 원문과 영어 감사본에 더 직접적으로 대응합니다.
  - severity: low
