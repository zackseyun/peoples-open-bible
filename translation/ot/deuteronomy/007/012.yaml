  from: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
  to: If you listen to these ordinances, keep them, and carry them out, Yahweh your God will keep his covenant with you and show you steadfast love, as he swore to your fathers.
  rationale: The recorded deliberation explicitly recognizes a consequence conditioned on obedience, supporting 'if' rather than an assumption that Israel will obey. I retain the important repetition of 'keep' between Israel’s observance and Yahweh’s covenant faithfulness, and preserve 'steadfast love.'
