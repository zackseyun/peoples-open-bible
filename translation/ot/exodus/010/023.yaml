  meaning_decisions:
  - source_phrase: לֹא רָאוּ אִישׁ אֶת־אָחִיו
    prior_rendering: They did not see one another
    new_rendering: the Egyptians could not see one another
    rationale: The preceding darkness identifies the Egyptians as the subject and explains their inability to see, rather than merely reporting that they did not look at one another.
  - source_phrase: וְלֹא קָמוּ אִישׁ מִתַּחְתָּיו שְׁלֹשֶׁת יָמִים
    prior_rendering: and no one rose from his place for three days
    new_rendering: For three days ... and no one moved from where they were
    rationale: The expression describes remaining immobilized in one’s location, not simply failing to stand up; placing the duration first makes its scope over both effects clear.
  - source_phrase: בְּנֵי יִשְׂרָאֵל
    prior_rendering: the sons of Israel
    new_rendering: the Israelites
    rationale: The designation includes the whole Israelite community, not only males.
  - source_phrase: בְּמוֹשְׁבֹתָם
    prior_rendering: in their dwellings
    new_rendering: where they lived
    rationale: The term can include dwelling places or settlements; the new wording preserves that breadth rather than limiting the light to individual homes.
