  from: Nevertheless[a], although so many impulses of motherly affection were drawing the mother toward sympathy, the all-varied tortures were not able, by any of them, to turn aside her reason.
  to: Nevertheless, although so many impulses of motherly affection drew the mother toward sympathy, the many kinds of torture could not sway her reason in the case of any of her sons[a].
