translation:
  text: And when confidence falters within, ignorance seems worse than the very cause of the torment[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, 'not knowing the cause of the torment seems all the worse.' The Greek can describe ignorance of the cause or compare ignorance with the cause.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔνδοθεν
  chosen: from within
  alternatives:
  - inwardly
  - inside
  lexicon: LSJ
  rationale: Adverb indicating an internal source or inward condition. 'From within' preserves the image that the weakness arises internally rather than from an external assault.
- source_word: ἥττων
  chosen: weaker
  alternatives:
  - inferior
  - less strong
  lexicon: LSJ
  rationale: Comparative adjective describing expectation as diminished or enfeebled. 'Weaker' is natural English and fits the psychological context.
- source_word: προσδοκία
  chosen: expectation
  alternatives:
  - anticipation
  - apprehension
  lexicon: LSJ
  rationale: The noun denotes expectation or anticipation. In context it refers to the mind's anticipatory state under fear. 'Expectation' is broad enough to preserve the Greek without over-interpreting it as specifically hopeful or fearful.
- source_word: πλείονα λογίζεται
  chosen: counts ... as a greater thing
  alternatives:
  - considers ... greater
  - reckons ... more serious
  lexicon: LSJ
  rationale: The idiom means to regard something as greater or weightier. 'Counts ... as a greater thing' stays close to the Greek structure while remaining intelligible.
- source_word: ἄγνοιαν
  chosen: ignorance
  alternatives:
  - not knowing
  - uncertainty
  lexicon: LSJ
  rationale: The term is straightforwardly 'ignorance' or 'lack of knowledge.' Here it refers to not knowing the cause behind the suffering. 'Ignorance' is concise and faithful, though the object is specified by the following genitive phrase.
- source_word: τῆς παρεχούσης τὴν βάσανον αἰτίας
  chosen: of the cause that brings the torment
  alternatives:
  - of the cause producing the torture
  - of the cause that affords the distress
  lexicon: LSJ
  rationale: The participle παρεχούσης modifies αἰτίας, 'cause,' and βάσανον denotes severe distress/torment. 'Brings the torment' is idiomatic and preserves the causal relation without softening the intensity.
