  issues:
  - location: Second paragraph
    issue: “tried to persuade him to deny it” makes the proposed denial appear to concern his identity as Polycarp. The witness says he tried to persuade him “to a denial,” in the context of swearing by Caesar and reviling Christ; the apostasy/renunciation sense must remain visible.
  - location: Second paragraph
    issue: “whether he was Polycarp” narrows “whether he were the man.” While likely intended as identification, the witness’s wording should not be made more specific than necessary.
  - location: Second paragraph
    issue: “lawless Gentiles” can be read as an ethnic or religious designation broader than the witness’s “lawless heathen.” Retain the witness’s pejorative cultic designation or render it explicitly as “lawless pagans/heathen.”
