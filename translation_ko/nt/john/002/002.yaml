lexical_decisions:
- source_word: ἐκλήθη
  english_pob_choice: was invited
  chosen_korean: 초대받았습니다
  alternatives_korean:
  - 초대되었습니다
  - 불려왔습니다
  lexicon: BDAG
  rationale: καλέω의 수동형은 사회적 모임에 초대되는 의미로 읽히며, 한국어에서는 '초대받다'가 가장 자연스럽고 원문 의미를 직접 전달합니다.
- source_word: δὲ / καὶ (the connectives)
  english_pob_choice: also / along with
  chosen_korean: 도 / 함께
  alternatives_korean:
  - 또
  - 그리고
  lexicon: BDAG
  rationale: δὲ와 이어지는 καὶ는 덧붙임(addition)을 표시하므로 한국어에서 '도'와 '함께'로 풀어 직역적 의미를 유지했습니다.
- source_word: ὁ Ἰησοῦς
  english_pob_choice: Jesus
  chosen_korean: 예수
  alternatives_korean:
  - 예수님
  - 이르수(비표준)
  lexicon: BDAG / POB naming policy
  rationale: 현대 한국어 성경 전통을 따라 고유명사 '예수'를 사용했습니다. 본문 서술문이므로 경어형 접미사 대신 서술어로 표현했습니다.
- source_word: οἱ μαθηταὶ αὐτοῦ
  english_pob_choice: his disciples
  chosen_korean: 그의 제자들
  alternatives_korean:
  - 제자들
  - 제자들(제자들로서의 추종자들)
  lexicon: BDAG
  rationale: μαθηταί는 복합적 의미(학습자·추종자)를 내포하지만 복음서 문맥에서 표준 한국어 번역은 '제자들'이며, αὐτοῦ의 소유격은 '그의'로 명시했습니다.
- source_word: εἰς τὸν γάμον
  english_pob_choice: to the wedding
  chosen_korean: 결혼식
  alternatives_korean:
  - 혼인
  - 혼인 잔치
  lexicon: BDAG
  rationale: γάμος는 결혼 행사 전체를 가리키므로 현대 한국어 독자에게 분명한 '결혼식'을 선택했습니다. 원문이 '잔치'를 명시하지 않으므로 '잔치'는 덧붙이지 않았습니다.
theological_decisions:
- issue: honorifics for Jesus in narrative
  chosen_reading: 서술문으로 단순 서술형 사용(예수도 ... 초대받았습니다)
  alternative_readings:
  - 예수님/예수께서 + honorific verbs(오셨다, 초청을 받으셨다)
  rationale: POB의 북스타 원칙에 따라 원문 서술자의 관점을 그대로 전달하기 위해 불필요한 경어미를 첨가하지 않았습니다. 이는 본문의 문법적 서술 태도를 유지하면서 독자가 원문 의미를 판단하도록 돕습니다.
  doctrine_reference: translation style (honorifics are stylistic, not doctrinal)
