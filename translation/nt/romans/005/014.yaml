  meaning_decisions:
  - source_phrase: τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
    prior_rendering: those who did not sin in the likeness of Adam’s transgression
    new_rendering: those who did not sin by transgressing an explicit command as Adam did
    rationale: In the argument about the period before the law, Adam’s distinctive transgression was his violation of an explicit command. Making that understood distinction explicit clarifies the comparison without identifying a particular group of people.
  - source_phrase: ὅς ἐστιν τύπος τοῦ μέλλοντος
    prior_rendering: who is a type of the coming one
    new_rendering: Adam was a foreshadowing of the one who was to come
    rationale: Naming Adam removes the uncertain English antecedent of “who.” “Foreshadowing” conveys the anticipatory correspondence, while “was to come” locates the expectation from Adam’s perspective.
