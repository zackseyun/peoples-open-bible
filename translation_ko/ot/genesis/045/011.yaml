    issue: ‘당신에게 속한 모든 것이 빈궁에 빠지지 않게’라는 표현
    rationale: 히브리어는 ‘당신과 당신의 집안과 당신에게 속한 모든 것’이 궁핍해지는 결과를 포괄하지만, 한국어에서는 ‘모든 것’ 자체가 ‘빈궁에 빠진다’고 하면 의미 결합이 어색합니다. 전체를 포괄하는 ‘궁핍하게 되지 않도록’으로 다듬는 것이 자연스럽습니다.
  revised_text: 그곳에서 내가 아버지를 부양하겠습니다. 아직 기근이 다섯 해 더 남아 있으니, 아버지와 아버지의 집안과 아버지께 속한 모든 것이 궁핍하게 되지 않도록 하겠습니다.
