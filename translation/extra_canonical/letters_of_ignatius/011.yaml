  heading: IgnEph. 10
  authoritative_division: false
  note: This editorial section label is a modern navigation aid and is not presented as an ancient verse division.
source:
  text: |-
    And pray ye also without ceasing for the rest of mankind (for there is in them a hope of repentance), that they may find God. Therefore permit them to take lessons at least from your works.

    Against their outbursts of wrath be ye meek; against their proud words be ye humble; against their railings set ye your prayers; against their errors be ye steadfast in the faith; against their fierceness be ye gentle. And be not zealous to imitate them by requital.

    Let us show ourselves their brothers by our forbearance; but let us be zealous to be imitators of the Lord, vying with each other who shall suffer the greater wrong, who shall be defrauded, who shall be set at nought; that no herb of the devil be found in you: but in all purity and temperance abide ye in Christ Jesus, with your flesh and with your spirit.
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'And pray ye also without ceasing for the rest of mankind (for there is in them a hope of repentance), that they may find God. Therefore permit them to take lessons at least from your works.


    Against their outbursts of wrath be ye meek; against their proud words be ye humble; against their railings set ye your prayers; against their errors be ye steadfast in the faith; against their fierceness be ye gentle. And be not zealous to imitate them by requital.


    Let us show ourselves their brothers by our forbearance; but let us be zealous to be imitators of the Lord, vying with each other who shall suffer the greater wrong, who shall be defrauded, who shall be set at nought; that no herb of the devil be found in you: but in all purity and temperance abide ye in Christ Jesus, with your flesh and with your spirit.'
translation:
  text: 'And pray also without ceasing for the rest of humanity, for there is in them a hope of repentance[a], that they may find God. Therefore, permit them to learn at least from your works.


    Against their outbursts of anger, be meek; against their proud words, be humble; against their insults, set your prayers; against their errors, be steadfast in the faith; against their fierceness, be gentle. And do not be zealous to imitate them by requital.


    Let us show ourselves to be their brothers by our forbearance; but let us be zealous to be imitators of the Lord, competing with one another over who shall suffer the greater wrong, who shall be defrauded, and who shall be set at nothing; that no herb of the devil may be found in you. But in all purity and self-control abide in Christ Jesus, with your flesh and with your spirit.'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - Provisional bridge rendering based on the supplied public-domain English witness.
  - Direct review of the Greek manuscript tradition remains necessary.
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in these appeals to reconciliation and ecclesial unity; keep distinct return expressions and the authors own claims about the bishop. This reader text remains an adaptation of the recorded English witness, not a verbatim quotation or a newly verified translation of the ancient-language text. The witness is unchanged.
    reason: lexical_alternative
