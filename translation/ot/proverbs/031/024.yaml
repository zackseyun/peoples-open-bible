id: PRO.31.24
reference: Proverbs 31:24
source:
  edition: WLC
  text: סָדִ֣ין עָ֭שְׂתָה וַ/תִּמְכֹּ֑ר וַ֝/חֲג֗וֹר נָתְנָ֥ה לַֽ/כְּנַעֲנִֽי׃
translation:
  text: She makes linen garments[a] and sells them, and supplies sashes to the merchant[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “linen cloth”; the precise form of the linen item is uncertain.
    reason: alternative_reading
  - marker: b
    text: The Hebrew term is “Canaanite,” also used in the sense of merchant or trader.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָדִין
  chosen: linen garments
  alternatives:
  - linen cloth
  - sheet
  - fine linen garment
  lexicon: HALOT
  rationale: Plural English is idiomatic for the merchandise and does not assert a grammatically incompatible Hebrew plural; the note preserves the item’s uncertain precise form.
- source_word: עָשְׂתָה
  chosen: makes
  alternatives:
  - made
  - produces
  - fashioned
  lexicon: HALOT
  rationale: 'Although the Hebrew perfect can be rendered past, the poem describes the woman''s characteristic activities, so an English present habitual fits the discourse well: ''makes''.'
- source_word: וַתִּמְכֹּר
  chosen: and sells them
  alternatives:
  - and sold
  - then sells
  lexicon: HALOT
  rationale: The waw-consecutive continues the description of her customary industrious actions. English present habitual preserves the portrait style. 'Them' is supplied naturally in English to refer back to the garments.
- source_word: חֲגוֹר
  chosen: sashes
  alternatives:
  - sashes
  - girdles
  - waistbands
  lexicon: HALOT
  rationale: In this textile-production and trade context, “sashes” better evokes the likely waist-worn textile article than modern fastening belts.
- source_word: נָתְנָה
  chosen: supplies
  alternatives:
  - gives
  - delivers
  - provides
  lexicon: HALOT
  rationale: Literally 'gives,' but in a trade setting the sense is commercial provision or delivery. 'Supplies' conveys the market-oriented action without overstating the mechanics.
- source_word: לַכְּנַעֲנִי
  chosen: to the merchant
  alternatives:
  - to the Canaanite
  - to the trader
  lexicon: HALOT
  rationale: In wisdom and poetic contexts, 'Canaanite' can function metonymically for a trader or merchant. Here the commercial context strongly favors the occupational sense over ethnic identity, so 'merchant' is the clearest rendering.
