source:
  edition: SBLGNT
  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
  footnotes:
  - marker: a
    text: Or 'grace upon grace' or 'one grace after another.' The Greek phrase can suggest successive grace as one gift follows another, though ἀντί more literally means 'in place of.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 우리 모두가 그의 충만함에서 은혜 대신 은혜를 받았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은혜 위에 은혜’ 또는 ‘한 은혜 다음에 또 다른 은혜’로 번역할 수 있습니다. 그리스어 어구는 한 선물이 다른 선물을 뒤따르는 연속적인 은혜를 시사할 수도 있습니다. 그러나 ἀντί는 문자적으로 ‘대신에’를 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 때문에
  lexicon: BDAG
  rationale: 문맥상 앞 구절들의 내용을 설명하는 접속사이므로, 간결하고 설명적인 한국어 접속사 '이는'을 사용하여 원문의 인과·설명적 기능을 보존했습니다.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  english_pob_choice: from his fullness
  chosen_korean: 그의 충만에서
  alternatives_korean:
  - 그의 충만으로부터
  - 그에게 속한 충만에서
  lexicon: BDAG
  rationale: πλήρωμα는 '충만'·'충만함'을 뜻하므로, 소유격 관계를 그대로 살려 '그의 충만에서'로 직역했습니다.
- source_word: ἡμεῖς πάντες ἐλάβομεν
  english_pob_choice: we have all received
  chosen_korean: 우리 모두가 받았고
  alternatives_korean:
  - 우리는 다 받았습니다
  - 우리 모두가 받았습니다
  lexicon: BDAG
  rationale: 그리스어의 인칭·전 권격 강조(ἡμεῖς πάντες)와 완료적 수용을 반영하여 '우리 모두가 받았고'로 병렬 구조를 유지하면서 자연스러운 한국어 시제를 택했습니다.
- source_word: χάριν ἀντὶ χάριτος
  english_pob_choice: grace in place of grace
  chosen_korean: 은혜가 은혜로 대신되었습니다
  alternatives_korean:
  - 은혜 위의 은혜
  - 한 은혜 다음 또 다른 은혜
  - 은혜 대신 은혜
  lexicon: BDAG
  rationale: ἀντί의 기본 의미는 '대신'이므로, 신학적 긴장을 보존하기 위해 누적적·관용적 번역('은혜 위에 은혜') 대신 '대신되었습니다'라는 문자적 어휘를 유지했습니다.
theological_decisions:
- issue: 해당구(χάριν ἀντὶ χάριτος)의 해석 — 대체(대신)인가 누적(연속)인가
  chosen_reading: '문자적 ἀντί(''대신'')의 의미를 보존: ''은혜가 은혜로 대신됩니다'''
  alternative_readings:
  - '관용적·누적적 해석: ''은혜 위에 은혜''(grace upon grace)'
  - '연속적 강조: ''한 은혜 다음 또 다른 은혜'''
  rationale: 원문 어휘(ἀντί)의 기본 의미가 '대신'이므로, 본문은 신학적 긴장을 해결하지 않고 그대로 드러내는 편이 원저자의 모호성을 보존하는 원칙에 부합합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
