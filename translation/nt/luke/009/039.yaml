  from: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
  to: Look, a spirit seizes him, and he suddenly cries out[a]. It throws him into convulsions, and he foams at the mouth. It scarcely leaves him alone, battering him[b].
  rationale: I retain “a spirit,” “seizes,” and the earlier understanding that the boy cries out, while noting the serious alternative subject of that verb. The earlier commitment to “with foaming” and “crushing” preserved source forms but obscured the bodily description in English.
