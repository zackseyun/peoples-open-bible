  meaning_decisions:
  - source_phrase: διακατασχεῖν
    prior_rendering: to seize
    new_rendering: to take control of
    rationale: The instruction concerns securing and holding the routes, not merely capturing them in a momentary action.
  - source_phrase: διακωλῦσαι αὐτοὺς προσβαίνοντας
    prior_rendering: to hold them back as they came up
    new_rendering: The enemy could ... be held back as they advanced uphill
    rationale: The pronoun refers to the invading force, not the recipients of Joakim's letter; the new wording makes that distinction explicit and retains the uphill movement.
