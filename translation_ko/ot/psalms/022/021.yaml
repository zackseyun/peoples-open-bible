id: PSA.22.21
reference: Psalms 22:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֭וֹשִׁיעֵ/נִי מִ/פִּ֣י אַרְיֵ֑ה וּ/מִ/קַּרְנֵ֖י רֵמִ֣ים עֲנִיתָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/021.yaml
  text: Save me from the mouth of the lion, and from the horns of the wild oxen[b]—you have answered me.[a]
  footnotes:
  - marker: a
    text: 'The final clause can be understood as a sudden declaration of answered prayer: “you have answered me,” marking the turn from plea to confidence.'
    reason: alternative_reading
  - marker: b
    text: Or “wild bulls”; the Hebrew refers to powerful wild bovines.
    reason: lexical_alternative
translation:
  language: ko
  text: 사자의 입에서 나를 구원하소서. 들소들의 뿔에서—주께서 내게 응답하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들소들’은 ‘야생 황소들’ 또는 ‘오록스’로도 옮길 수 있습니다. 히브리어는 힘센 야생 소과 동물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘주께서 내게 응답하셨습니다’라는 갑작스러운 응답 기도의 선언으로 이해할 수 있으며, 청원에서 확신으로 전환됨을 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילָה
  english_pob_choice: Deliver
  chosen_korean: 건지소서
  alternatives_korean:
  - 구원하소서
  - 구해 주소서
  - 건져 주소서
  lexicon: HALOT
  rationale: נצל의 긴급한 구해 달라는 청원을 살려, 시편 탄원체에 자연스러운 간청형인 ‘건지소서’를 택했습니다.
- source_word: מֵחֶרֶב
  english_pob_choice: from the sword
  chosen_korean: 칼에서
  alternatives_korean:
  - 칼로부터
  - 검에서
  lexicon: HALOT
  rationale: 전치사 מן의 분리 의미를 살려 ‘-에서’로 옮겼고, 현대 한국어에서 더 자연스러운 무기 명칭으로 ‘칼’을 사용했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my life
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 영혼
  - 나 자신
  lexicon: HALOT
  rationale: נפשׁ는 여기서 추상적 ‘영혼’보다 생명/자기 자신을 가리키므로, 죽음의 위협과 평행을 이루는 ‘내 생명’이 가장 직접적입니다.
- source_word: מִיַּד כֶּלֶב
  english_pob_choice: from the power of the dog
  chosen_korean: 개의 권세에서
  alternatives_korean:
  - 개의 손에서
  - 개의 힘에서
  lexicon: HALOT
  rationale: ‘손’의 관용적 의미인 권세/장악력을 드러내면서도, 원문의 이미지인 ‘개’의 단수형을 유지했습니다.
- source_word: יְחִידָתִי
  english_pob_choice: my only one
  chosen_korean: 내 외로운 생명
  alternatives_korean:
  - 내 유일한 생명
  - 내 소중한 생명
  - 내 하나뿐인 생명
  lexicon: HALOT
  rationale: 유일성을 뜻하는 יחידה를 단순한 수적 의미로만 두지 않고, 문맥상 생명에 붙는 절박한 정서를 살려 ‘외로운 생명’으로 옮겼습니다.
theological_decisions:
- issue: יְחִידָתִי의 정서적 뉘앙스
  chosen_reading: ‘내 외로운 생명’으로 옮겨, 유일성과 취약성을 함께 드러냈습니다.
  alternative_readings:
  - 내 유일한 생명
  - 내 하나뿐인 생명
  rationale: 시편 탄원에서는 단순한 수량보다 상실 위기의 절박함이 중요하므로, 원문의 희귀성과 단독성을 한국어에서 감각적으로 드러내는 번역을 택했습니다.
  doctrine_reference: 시편 탄원시의 시적 평행법과 어휘 의미 범위
- issue: ‘개의 권세’의 표현 방식
  chosen_reading: 관용구를 직역하되 의미를 풀어 ‘권세’로 처리했습니다.
  alternative_readings:
  - 개의 손에서
  - 개의 힘에서
  rationale: יד의 관용적 의미를 반영하면서도, 원문의 폭력적 위협을 덜어내지 않도록 ‘권세’를 사용해 지배/장악의 뉘앙스를 살렸습니다.
  doctrine_reference: 히브리어 관용구 번역 원칙
