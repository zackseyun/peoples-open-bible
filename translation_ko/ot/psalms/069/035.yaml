  text: For God will save Zion and build the cities of Judah, and they will dwell there and possess it[a][b].
  footnotes:
  - marker: a
    text: 'Or ''May heaven and earth praise him''; the Hebrew verb may be heard as a jussive summons. Some take it more predictively: ''heaven and earth will praise him.'''
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the heavens'; rendered 'heaven' here as a collective in the common pairing 'heaven and earth.'
    reason: lexical_alternative
  - marker: c
    text: Or 'everything that creeps in them.' The Hebrew term can denote creatures that move, creep, or swarm.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 하나님께서 시온을 구원하시고 유다의 성읍들을 세우실 것이며, 그곳에 살며 그것을 차지할 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그녀를’이라는 여성 단수 목적어를 사용합니다. 이는 시온이나 의인화된 땅을 가리킬 수 있습니다. ‘상속하다’ 또는 ‘차지하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
