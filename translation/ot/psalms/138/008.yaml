id: PSA.138.8
reference: Psalms 138:8
source:
  edition: WLC
  text: יְהוָה֮ יִגְמֹ֪ר בַּ֫עֲדִ֥/י יְ֭הוָה חַסְדְּ/ךָ֣ לְ/עוֹלָ֑ם מַעֲשֵׂ֖י יָדֶ֣י/ךָ אַל תֶּֽרֶף־׃
translation:
  text: Yahweh will complete his work on my behalf[a]. Yahweh, your steadfast love endures forever. Do not abandon the works of your hands.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “Yahweh will complete on my behalf”; the object of “complete” is unstated.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: יִגְמֹר
  chosen: will fulfill
  alternatives:
  - will complete
  - will bring to an end
  - will accomplish
  lexicon: HALOT
  rationale: The verb גמר can mean to complete or bring to completion. In this context with בַּעֲדִי, 'will fulfill' naturally conveys God's bringing his intention for the psalmist to completion without sounding abrupt or terminal.
- source_word: בַּעֲדִי
  chosen: for me
  alternatives:
  - on my behalf
  - concerning me
  lexicon: HALOT
  rationale: The preposition בעד with 1cs suffix can mean 'for, on behalf of, concerning.' 'For me' is concise and idiomatic in English, while still allowing the sense that the LORD acts on the psalmist's behalf.
- source_word: חַסְדְּךָ
  chosen: your steadfast love
  alternatives:
  - your lovingkindness
  - your covenant love
  - your mercy
  lexicon: HALOT
  rationale: חסד commonly denotes loyal, covenantal love. 'Steadfast love' is a well-established and accurate English rendering that preserves both affection and durability better than the broader 'mercy'.
- source_word: לְעוֹלָם
  chosen: endures forever
  alternatives:
  - is forever
  - is everlasting
  lexicon: HALOT
  rationale: Linked with חסד, this phrase expresses enduring permanence. Rendering the clause as 'your steadfast love endures forever' produces natural English while preserving the temporal force.
- source_word: מַעֲשֵׂי יָדֶיךָ
  chosen: the works of your hands
  alternatives:
  - the works of your hands
  - what your hands have made
  lexicon: HALOT
  rationale: The construct noun is plural, and “works” maintains the phrase’s open reference.
- source_word: אַל תֶּרֶף
  chosen: Do not abandon
  alternatives:
  - Do not abandon
  - Do not let go of
  - Do not cease from
  lexicon: HALOT
  rationale: In this plea, “abandon” naturally expresses the sense of not letting go of or leaving off God's works.
- source_word: יִגְמֹר בַּעֲדִי
  chosen: will complete what concerns me
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The verb denotes completion, while בעדי can express concern for, action for, or action on behalf of the psalmist. The rendering does not insert an explicit object such as “purpose.”
