id: PRO.13.5
reference: Proverbs 13:5
source:
  edition: WLC
  text: דְּבַר שֶׁ֭קֶר יִשְׂנָ֣א צַדִּ֑יק וְ֝/רָשָׁ֗ע יַבְאִ֥ישׁ וְ/יַחְפִּֽיר־׃
translation:
  text: A righteous man hates falsehood, but a wicked man becomes odious[a] and is put to shame[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'stinks' or 'causes a stench.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'brings disgrace.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר שֶׁקֶר
  chosen: a false word
  alternatives:
  - falsehood
  - a false matter
  - a false word
  lexicon: HALOT
  rationale: Natural English that preserves the concrete singular construct phrase.
- source_word: יִשְׂנָא
  chosen: hates
  alternatives:
  - detests
  lexicon: HALOT
  rationale: Standard rendering of the Qal of שׂנא. 'Hates' is direct and idiomatic, matching the moral aversion expressed in wisdom literature.
- source_word: צַדִּיק
  chosen: a righteous man
  alternatives:
  - the righteous
  - a righteous person
  lexicon: HALOT
  rationale: The adjective is masculine singular used substantivally. Per translation philosophy, gender-accurate rendering is preferred where the source is grammatically masculine and representative. 'A righteous man' preserves the singular proverbial type.
- source_word: רָשָׁע
  chosen: a wicked man
  alternatives:
  - the wicked
  - a wicked person
  lexicon: HALOT
  rationale: Masculine singular substantive parallel to צַדִּיק. 'A wicked man' keeps the antithetical proverb balanced and preserves the singular representative figure.
- source_word: יַבְאִישׁ
  chosen: becomes odious
  alternatives:
  - gives off a bad odor
  - acts disgustingly
  - causes a stench
  lexicon: HALOT
  rationale: Conveys the verb's foulness/stench imagery in natural English.
- source_word: וְיַחְפִּיר
  chosen: and is put to shame
  alternatives:
  - and is put to shame
  - and acts shamefully
  - and causes disgrace
  lexicon: HALOT
  rationale: Better reflects the likely causative force of the Hiphil while avoiding an invented object.
