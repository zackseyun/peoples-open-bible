id: PSA.17.7
reference: Psalms 17:7
source:
  edition: WLC
  text: הַפְלֵ֣ה חֲ֭סָדֶי/ךָ מוֹשִׁ֣יעַ חוֹסִ֑ים מִ֝/מִּתְקוֹמְמִ֗ים בִּֽ/ימִינֶֽ/ךָ׃
translation:
  text: Show the wonder of your steadfast love, you who save by your right hand[a] those who take refuge in you from their adversaries.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'The phrase may instead describe the refuge: “you who save from their adversaries those who take refuge at your right hand.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  chosen: Show ... wondrous
  alternatives:
  - Make wonderful
  - Distinguish
  - Display wonderfully
  lexicon: HALOT
  rationale: Hiphil imperative of פלא can mean to make distinct/wonderful or to show something as extraordinary. In prayer context, an imperative asking God to display his covenant love in an extraordinary way is best captured by 'Show ... wondrous' rather than the less natural 'make wonderful your steadfast love.'
- source_word: חֲסָדֶיךָ
  chosen: your steadfast love
  alternatives:
  - your lovingkindness
  - your covenant love
  - your loyal love
  lexicon: HALOT
  rationale: חסד denotes covenantal loyalty, mercy, and faithful love. 'Steadfast love' is established, readable English that preserves the covenantal weight better than the archaic 'lovingkindness.'
- source_word: מוֹשִׁיעַ
  chosen: you who save
  alternatives:
  - you who save
  - saving
  lexicon: HALOT
  rationale: A natural verbal rendering of the participle in direct address, without unnecessarily turning it into a title.
- source_word: חוֹסִים
  chosen: those who take refuge
  alternatives:
  - those who seek refuge
  - those who trust
  lexicon: HALOT
  rationale: The verb חסה commonly means to seek or take refuge, often in God. 'Take refuge' preserves the protective imagery more concretely than the more abstract 'trust.'
- source_word: מִמִּתְקוֹמְמִים
  chosen: from their adversaries
  alternatives:
  - from adversaries
  - from those who rise up against you
  lexicon: HALOT
  rationale: The hostile participle denotes those rising up in opposition; “adversaries” is concise English and makes the contextually implicit relation to the refugees clear.
- source_word: בִּימִינֶךָ
  chosen: by your right hand
  alternatives:
  - at your right hand
  - with your right hand
  lexicon: HALOT
  rationale: This retains the likely instrumental sense and the concrete image of divine power; the alternative attachment is noted.
- source_word: הַפְלֵה חֲסָדֶיךָ
  chosen: Show the wonder of your steadfast love
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This naturally expresses a request that God display his steadfast love in an extraordinary way.
