  text: הוֹשִׁ֣יעָ/ה יְ֭הוָה כִּי גָמַ֣ר חָסִ֑יד כִּי פַ֥סּוּ אֱ֝מוּנִ֗ים מִ/בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/002.yaml
  text: They speak falsehood[a], each man to his neighbor; with flattering lips[b], with duplicity in their hearts[c] they speak.
  footnotes:
  - marker: a
    text: Or 'the godly one has come to an end' or 'the faithful man is no more.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from among the sons of man,' an idiom for the human community.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 각자 자기 이웃에게 헛된 말을 하며, 아첨하는 입술로[a] 두 마음으로 말합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매끄러운 입술로’. 히브리어 표현은 매끄러움의 이미지를 통해 아첨하며 속이는 말을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마음과 마음으로’. 이는 속이거나 내면의 뜻이 나뉘어 있음을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעָה
  english_pob_choice: Save
  chosen_korean: 구원하소서
  alternatives_korean:
  - 살려 주십시오
  - 건져 주소서
  lexicon: HALOT
  rationale: 하나님께 드리는 탄원 시에서는 단순한 ‘도와주십시오’보다 구조적·구원적 요청을 드러내는 ‘구원하소서’가 מקור의 긴박한 간청을 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문은 여호와의 이름표현인 테트라그람마톤을 직접 사용하므로, 프로젝트 기본값에 따라 제목어가 아닌 고유명사 ‘야훼’로 옮겼습니다.
- source_word: חָסִיד
  english_pob_choice: the godly man
  chosen_korean: 경건한 자
  alternatives_korean:
  - 경건한 사람
  - 신실한 자
  lexicon: HALOT
  rationale: חָסִיד는 언약에 충실하고 하나님께 경외를 보이는 사람을 가리키므로, 자연스러운 한국어로는 ‘경건한 자’가 가장 직접적입니다.
- source_word: אֱמוּנִים
  english_pob_choice: the faithful
  chosen_korean: 신실한 자들
  alternatives_korean:
  - 믿음직한 자들
  - 충실한 자들
  lexicon: HALOT
  rationale: 복수형이므로 집합적 복수를 분명히 드러내기 위해 ‘자들’을 넣었고, אמן 계열의 신뢰·충실의 뜻은 ‘신실한’이 잘 전달합니다.
theological_decisions:
- issue: 인간 공동체를 가리키는 관용구 מִבְּנֵי אָדָם의 처리
  chosen_reading: ‘사람의 자손들 가운데서’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 인류 가운데서
  - 사람들 가운데서
  rationale: 히브리어 관용의 인간 공동체 지시를 보존하면서도, 한국어가 과도하게 자연화해 원문의 표상을 지우지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: source-proximate idiom retention'
