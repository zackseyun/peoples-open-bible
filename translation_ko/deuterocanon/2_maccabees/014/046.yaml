  yaml_path: translation/deuterocanon/2_maccabees/014/046.yaml
  text: Already becoming completely drained of blood, he pulled out his entrails and, taking them in both hands, hurled them at the crowds; and calling on the Master of life and spirit to give these back to him again, in this way he died.
translation:
  language: ko
  text: 이미 피가 완전히 빠져나가고 있던 그는 내장을 꺼내어 두 손에 들고 군중을 향해 흔들어 보였습니다. 그리고 생명과 영의 주권자께 그것들을 다시 그에게 돌려주시기를 부르짖고, 이와 같이 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντελῶς ἔξαιμος ἤδη γινόμενος
  english_pob_choice: Already becoming completely drained of blood
  chosen_korean: 이미 온몸의 피가 완전히 빠져나가고 있던
  alternatives_korean:
  - 이미 피가 완전히 빠져나가던
  - 이미 온몸이 피로 말라가던
  lexicon: ἔξαιμος
  rationale: ‘drained of blood’의 신체적·점진적 의미를 살려 ‘온몸의 피가 완전히 빠져나가고 있던’으로 옮겼습니다.
- source_word: προβαλὼν τὰ ἔντερα
  english_pob_choice: he pulled out his entrails
  chosen_korean: 창자를 끄집어내어
  alternatives_korean:
  - 내장을 꺼내어
  - 장기를 끄집어내어
  lexicon: ἔντερα
  rationale: 그로테스크한 신체 행위를 직접적으로 드러내는 표현을 유지하되, 현대 한국어에서 자연스럽고 이해 가능한 ‘창자’를 택했습니다.
- source_word: ἐνέσεισε τοῖς ὄχλοις
  english_pob_choice: hurled them at the crowds
  chosen_korean: 군중에게 내던졌으며
  alternatives_korean:
  - 군중에게 집어던졌으며
  - 군중들 앞에 흔들어 보였으며
  lexicon: ὄχλοι
  rationale: POB의 ‘hurled’에 맞추어 단순한 제시가 아니라 공격적 투척의 동작을 살렸습니다.
- source_word: τὸν δεσπόζοντα τῆς ζωῆς καὶ τοῦ πνεύματος
  english_pob_choice: the Master of life and spirit
  chosen_korean: 생명과 영의 주권자
  alternatives_korean:
  - 생명과 영의 주인
  - 생명과 영을 다스리시는 분
  lexicon: δεσπόζω
  rationale: δεσπόζοντα의 지배·주권 뉘앙스를 살리기 위해 ‘주권자’를 택했고, πνεῦμα는 이 문맥에서 인간의 생명 원리로도 읽혀 ‘영’으로 직역했습니다.
theological_decisions:
- issue: δεσπόζοντα τῆς ζωῆς καὶ τοῦ πνεύματος의 신학적 표현
  chosen_reading: 하나님을 생명과 영의 주권자로 직접 부르는 순교자의 호소로 옮겼습니다.
  alternative_readings:
  - 생명과 영의 주인
  - 생명과 영을 주관하시는 분
  rationale: 문맥상 죽음 직전의 신앙 고백이므로, 지배적 소유권을 드러내는 표현을 유지하는 것이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 순교 신앙과 하나님의 주권
