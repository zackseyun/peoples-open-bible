  category: footnotes
  tier: 1
  from: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
  to: I am poured out like water, and all my bones are out of joint; my heart has become like wax, melted within me.[a]
  rationale: “Out of joint” is a natural, contextually appropriate expression for bones that have come apart; “separated” is flatter and not more source-faithful. The participle נָמֵס is well represented by the resultant-state wording “melted,” not necessarily by an ongoing active “melting.” “Within my inward parts” is overly gloss-like in the main text; “within me,” with a literal note, preserves both natural English and the concrete Hebrew. The real needed correction is moving the note to the phrase it explains.
