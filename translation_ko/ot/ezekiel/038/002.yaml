  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל גּוֹג֙ אֶ֣רֶץ הַ/מָּג֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֣שֶׁךְ וְ/תֻבָ֑ל וְ/הִנָּבֵ֖א עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/002.yaml
  text: Son of man, set your face toward Gog, of the land of Magog, the chief prince of Meshech and Tubal, and prophesy against him.
translation:
  language: ko
  text: “인자야, 네 얼굴을 마곡 땅의 곡, 곧 메섹과 두발의 우두머리 통치자에게로 향하십시오. 그리고 그를 거슬러 예언하십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인자여
  lexicon: 인자
  rationale: 에스겔서의 정형적 호칭으로서 히브리어 בֶּן אָדָם을 직접 반영하며, 현대 한국어 문맥에서도 예언자 소명 호칭의 기능을 살리기 위해 ‘인자야’로 옮겼습니다.
- source_word: שִׂים פָּנֶיךָ אֶל
  english_pob_choice: set your face toward
  chosen_korean: 네 얼굴을 …에게로 향하고
  alternatives_korean:
  - 네 얼굴을 …에게 두고
  - …을 향하여 얼굴을 세우고
  lexicon: 관용구
  rationale: 직역보다 행동 명령의 관용적 의미를 살려, 목표를 향해 단호히 맞서는 태도를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: נְשִׂיא רֹאשׁ
  english_pob_choice: chief prince
  chosen_korean: 우두머리 통치자
  alternatives_korean:
  - 최고의 군주
  - 수위 군주
  - 머리된 통치자
  lexicon: נשׂיא
  rationale: 문맥상 단순한 ‘왕자’가 아니라 지휘적·수위적 직분을 가리키므로, POB의 ‘chief prince’ 취지를 살려 계층적 우위와 통치성을 함께 드러냈습니다.
- source_word: וְהִנָּבֵא עָלָיו
  english_pob_choice: and prophesy against him
  chosen_korean: 그에게 대언하라
  alternatives_korean:
  - 그를 향하여 예언하라
  - 그를 대적하여 예언하라
  lexicon: נבא
  rationale: 예언 행위의 대상이 되는 방향성을 포함하되, 히브리어 전치사 עַל의 적대적 뉘앙스는 문맥상 ‘대언하다’로 충분히 반영됩니다.
theological_decisions:
- issue: ‘인자’ 호칭의 기능 유지
  chosen_reading: 에스겔의 소명 장면으로서 ‘인자야’를 유지해 예언자-하나님의 구도와 호칭의 정형성을 보존했습니다.
  alternative_readings:
  - ‘사람아’로 완화하는 번역
  - 호칭을 생략하는 번역
  rationale: 히브리어 המקרא에서 이 호칭은 에스겔서 전체의 중요한 소명 표지이므로, 의미를 일반화하지 않고 반복되는 문체 효과를 살렸습니다.
  doctrine_reference: Ezekiel prophetic call narrative
- issue: ‘메섹과 두발의 우두머리 통치자’ 해석
  chosen_reading: 최신 POB 결정을 따라 ‘머리(ראש)’를 지명 ‘로스’로 돌리지 않고 직분적 표현으로 이해해 ‘우두머리 통치자’로 옮겼습니다.
  alternative_readings:
  - ‘로스의 군주’
  - ‘로스, 메섹, 두발의 통치자’
  rationale: 본문의 최신 감사 수정이 ‘chief prince of Meshech and Tubal’로 확정되었고, 히브리어 רֹאשׁ는 이 문맥에서 지명보다 수위성/우두머리성의 의미가 더 적절합니다.
  doctrine_reference: Textual/doctrinal audit revision EZK.38.2
