  category: meaning_retranslation
  from: The beginning of the word of Yahweh through Hosea[a]. And Yahweh said to Hosea, “Go, take for yourself a wife of whoredom and children of whoredom[c][b], for the land utterly commits whoredom by turning away from Yahweh.”
  to: When Yahweh first spoke through Hosea, he said to him, “Go, marry a promiscuous woman and have children of promiscuity[a], for the land is utterly prostituting itself by turning away from Yahweh.”
  rationale: The earlier wording rightly preserves the sexual metaphor and distinguishes speaking through Hosea from speaking to him. I retain those gains while using the recorded temporal alternative and clarifying the marriage idiom without fixing the children's paternity.
