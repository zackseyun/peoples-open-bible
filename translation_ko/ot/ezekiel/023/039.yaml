source:
  edition: WLC
  text: וּֽ/בְ/שַׁחֲטָ֤/ם אֶת בְּנֵי/הֶם֙ לְ/גִלּ֣וּלֵי/הֶ֔ם וַ/יָּבֹ֧אוּ אֶל מִקְדָּשִׁ֛/י בַּ/יּ֥וֹם הַ/ה֖וּא לְ/חַלְּל֑/וֹ וְ/הִנֵּה כֹ֥ה עָשׂ֖וּ בְּ/ת֥וֹךְ בֵּיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/039.yaml
  text: For when they slaughtered their sons for their idols, they came into my sanctuary on that same day to defile it. Look—this is what they did within my house.
translation:
  language: ko
  text: 그들이 자기들의 우상들에게[a] 자기들의 아들들을 잡아 죽였을 때, 바로 그날 내 성소에 들어와 그것을 더럽혔습니다. 보십시오. 이것이 그들이 내 집 안에서 한 일입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לְגִלּוּלֵיהֶם는 문자적으로 “그들의 우상들에게” 또는 “그들의 우상들을 위하여”라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְשַׁחֲטָם אֶת בְּנֵיהֶם
  english_pob_choice: when they slaughtered their sons
  chosen_korean: 자기들의 아들들을 잡아 죽였을 때
  alternatives_korean:
  - 그들이 자기들의 아들들을 학살했을 때
  - 그들이 자기들의 아들들을 죽였을 때
  lexicon: שָׁחַט
  rationale: 문맥상 제의적·폭력적 살해를 가리키므로 단순한 ‘죽이다’보다 강한 ‘잡아 죽이다’로 살렸습니다.
- source_word: לְגִלּוּלֵיהֶם
  english_pob_choice: for their idols
  chosen_korean: 자기들의 우상들에게
  alternatives_korean:
  - 그들의 우상들을 위해
  - 그들의 우상들을 위하여
  lexicon: גִּלּוּלִים
  rationale: 전치사 לְ는 대상/목적 모두를 가질 수 있으나, 이 구절은 우상숭배 행위를 드러내므로 ‘~에게’로 연결해 제의적 헌납의 뉘앙스를 유지했습니다.
- source_word: וַיָּבֹאוּ אֶל מִקְדָּשִׁי ... לְחַלְּלוֹ
  english_pob_choice: they came into my sanctuary on that same day to defile it
  chosen_korean: 그날 바로 내 성소에 들어와 그것을 더럽혔습니다
  alternatives_korean:
  - 그날 내 성소에 들어와 그것을 더럽혔습니다
  - 그날 곧바로 내 성소로 들어와 그것을 모독했습니다
  lexicon: מִקְדָּשׁ / חִלֵּל
  rationale: מִקְדָּשׁ은 예배 공간을 뜻하므로 ‘성소’로, לְחַלְּלוֹ는 의례적 오염과 모독을 함께 담는 ‘더럽히다’로 옮겼습니다.
- source_word: בְּתוֹךְ בֵּיתִי
  english_pob_choice: within my house
  chosen_korean: 내 집 안에서
  alternatives_korean:
  - 내 집 안에서
  - 내 집 한가운데에서
  lexicon: בַּיִת
  rationale: 성전 맥락에서 ‘집’은 하나님의 집을 가리키므로, 직역성을 살리되 자연스러운 한국어 표현으로 ‘내 집 안에서’라고 했습니다.
theological_decisions:
- issue: ‘보십시오/Look—’의 화자적 수사 기능
  chosen_reading: 본문의 결말은 단순 정보 전달이 아니라 심판적 지적을 강조하는 수사이므로 ‘보십시오—’로 시작해 독자에게 현장을 직면하게 했습니다.
  alternative_readings:
  - 보십시오
  - 보라
  rationale: 영어 POB의 ‘Look—’을 그대로 반영하면서 현대 한국어의 공적인 경고 톤을 유지했습니다.
  doctrine_reference: 예언서의 고발 수사와 청중 소환 방식
- issue: ‘그날 바로’의 시간 강조
  chosen_reading: 히브리어의 ‘그날’ 강조를 살려 우상숭배와 성소 오염이 동일한 날에 일어난 악행임을 분명히 했습니다.
  alternative_readings:
  - 그날
  - 그 바로 그날
  rationale: 행위의 충격과 부정합을 강화하는 시간 부사구로 읽는 것이 문맥에 가장 부합합니다.
  doctrine_reference: 예언서의 언약 위반 고발
