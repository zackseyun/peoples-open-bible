source:
  edition: WLC
  text: וְ/ה֕וּא אֶת כָּל אֵ֖לֶּה לֹ֣א עָשָׂ֑ה כִּ֣י גַ֤ם אֶל הֶֽ/הָרִים֙ אָכַ֔ל וְ/אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ טִמֵּֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/011.yaml
  text: But he has done none of all these things; instead, he has even eaten on the mountains and defiled his neighbor’s wife.
translation:
  language: ko
  text: 그러나 그는 이 모든 것을 하나도 행하지 않았습니다. 도리어 그는 산들에서 먹고[a] 자기 이웃의 아내를 더럽혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘산들 위에서 먹었다’입니다. 에스겔의 문맥에서는 산당에서의 제의 식사와 관련될 가능성이 있으나, 본문은 먹은 대상이나 행위의 성격을 명시하지 않습니다.
    reason: 원문의 직역적 의미를 밝히면서 문맥상 가능한 제의적 함의를 단정하지 않고 제시하기 위해.
lexical_decisions:
- source_word: אֶת כָּל אֵלֶּה לֹא עָשָׂה
  english_pob_choice: he has done none of all these things
  chosen_korean: 이 모든 것을 하나도 행하지 않았습니다
  alternatives_korean:
  - 이 모든 일을 전혀 하지 않았습니다
  - 이 모든 것을 하나도 하지 않았습니다
  lexicon: עשה
  rationale: 히브리어 부정문은 행위의 전면적 부재를 말하므로, ‘행하다’로 동작의 수행을 살리고 ‘하나도’로 강한 부정을 드러냈습니다.
- source_word: גַּם אֶל הֶהָרִים אָכַל
  english_pob_choice: he has even eaten on the mountains
  chosen_korean: 오히려 그는 산 위에서 제사 음식을 먹고
  alternatives_korean:
  - 심지어 산에서 먹고
  - 산 위에서 먹었습니다
  lexicon: אכל / ההרים
  rationale: 문맥상 ‘산들’은 산당/우상 숭배의 장소를 가리키므로 단순 지리 정보로 약화하지 않고, 우상 제의의 맥락이 드러나도록 ‘제사 음식을 먹고’로 옮겼습니다.
- source_word: וְאֶת אֵשֶׁת רֵעֵהוּ טִמֵּא
  english_pob_choice: and defiled his neighbor’s wife
  chosen_korean: 자기 이웃의 아내를 더럽혔습니다
  alternatives_korean:
  - 이웃의 아내를 더럽혔습니다
  - 이웃의 아내와 더럽게 했습니다
  lexicon: טמא / רֵעַ
  rationale: טמא는 의례적·도덕적 오염을 함께 가질 수 있으므로 직설적으로 ‘더럽혔습니다’로 두어 간음의 언약적/도덕적 더러움을 살렸습니다.
- source_word: רֵעֵהוּ
  english_pob_choice: his neighbor's
  chosen_korean: 자기 이웃의
  alternatives_korean:
  - 그 이웃의
  - 자신의 이웃의
  lexicon: רֵעַ
  rationale: 대명사 접미사의 소유 관계를 자연스러운 한국어로 풀어, 행위의 피해자가 ‘그의 이웃’임을 분명히 했습니다.
theological_decisions:
- issue: ‘산 위에서 먹다’의 의미
  chosen_reading: 산당적 제사와 관련된 우상 숭배 행위로 읽었습니다.
  alternative_readings:
  - 단순히 산지에서 식사한 행위로 읽는 해석
  - 지리적 표현으로만 처리하는 해석
  rationale: 에스겔 문맥에서 ‘산들’은 반복적으로 산당과 우상 숭배의 장소를 가리키므로, 본절의 도덕적 고발을 약화하지 않도록 제의적 의미를 반영했습니다.
  doctrine_reference: 에스겔 18장 문맥 전체의 언약적 책임과 우상 숭배 금지
