revisions:
- from: 그때 사무엘이 온 이스라엘에게 말했습니다. “보십시오, 나는 여러분이 내게 한 모든 말을 들었고, 여러분 위에 왕을 왕으로 세웠습니다.”[a][b]
  to: 그때 사무엘이 온 이스라엘에게 말했습니다. “보십시오, 나는 여러분의 말을 듣고 여러분이 내게 말한 모든 것에 따라 여러분 위에 왕을 세웠습니다.”
  rationale: 원문의 서사적 도입, 청자 주의 환기, 백성의 요청을 들었다는 진술, 그리고 그들 위에 왕을 세운 결과를 유지했습니다. 다만 부자연스러운 ‘왕을 왕으로 세웠습니다’를 자연스러운 한국어 표현으로 고쳤고, 의미상 필수적이지 않으며 연결 범위가 불분명한 각주는 삭제했습니다.
