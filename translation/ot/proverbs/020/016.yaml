id: PRO.20.16
reference: Proverbs 20:16
source:
  edition: WLC
  text: לְֽקַח בִּ֭גְד/וֹ כִּי עָ֣רַב זָ֑ר וּ/בְעַ֖ד נכרים חַבְלֵֽ/הוּ־־׃
translation:
  text: Take his garment, for he has guaranteed a stranger’s debt; take it as security for a foreign woman[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The traditional Masoretic reading is “a foreign woman”; the written Hebrew text reads “foreigners.”
    reason: textual_variant
lexical_decisions:
- source_word: לְקַח
  chosen: Take
  alternatives:
  - Seize
  - Get
  lexicon: HALOT
  rationale: Qal imperative masculine singular from לקח, a direct command. 'Take' is the most natural imperative in English and fits the legal/wisdom setting without overstrengthening to 'seize'.
- source_word: בִּגְדוֹ
  chosen: his garment
  alternatives:
  - his cloak
  - his robe
  lexicon: HALOT
  rationale: בגד denotes an article of clothing broadly. 'Garment' preserves the general sense better than the more specific 'cloak' or 'robe'.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - indeed
  lexicon: HALOT
  rationale: Introduces the rationale for the command. 'For' gives smooth proverbial English while preserving the causal sense.
- source_word: עָרַב
  chosen: has guaranteed a stranger’s debt
  alternatives:
  - has become surety
  - has given a pledge
  lexicon: HALOT
  rationale: Makes the commercial surety sense explicit in natural English.
- source_word: זָר
  chosen: for a stranger
  alternatives:
  - for an outsider
  - for another
  lexicon: HALOT
  rationale: זָר commonly means a stranger/outsider, someone outside one's ordinary circle. 'Stranger' is concise and idiomatic in wisdom literature.
- source_word: וּבְעַד
  chosen: and ... for
  alternatives:
  - and on behalf of
  - and because of
  lexicon: HALOT
  rationale: בעד here marks representation or liability on behalf of others. Rendering with 'for' keeps the parallelism with the first colon and communicates assumed liability.
- source_word: נכרים
  chosen: a foreign woman
  alternatives:
  - strangers
  - unknown people
  lexicon: HALOT
  rationale: Follows the Masoretic qere נָכְרִיָּה.
- source_word: חַבְלֵהוּ
  chosen: take it as security
  alternatives:
  - take him as security
  - bind him
  - take a pledge from him
  lexicon: HALOT
  rationale: In context, the command directs the taking of collateral, naturally represented by the garment.
