id: SNG.2.2
reference: Song of Songs 2:2
source:
  edition: WLC
  text: כְּ/שֽׁוֹשַׁנָּה֙ בֵּ֣ין הַ/חוֹחִ֔ים כֵּ֥ן רַעְיָתִ֖/י בֵּ֥ין הַ/בָּנֽוֹת׃
translation:
  text: Like a lily among thorns, so is my love among the young women.
  philosophy: dynamic
lexical_decisions:
- source_word: כְּ/שׁוֹשַׁנָּה
  chosen: Like a lily
  alternatives:
  - Like a lotus
  - Like a flower
  lexicon: HALOT
  rationale: שׁוֹשַׁנָּה traditionally denotes a lily-like flower. 'Lily' is the standard and most recognizable English rendering, preserving the poetic image without over-specifying the exact botanical species. The prefixed כְ is rendered 'Like' to mark explicit comparison.
- source_word: בֵּין
  chosen: among
  alternatives:
  - between
  - in the midst of
  lexicon: HALOT
  rationale: Though literally 'between,' with a plural object in poetic comparison English 'among' is more natural and accurately conveys placement within a group.
- source_word: הַחוֹחִים
  chosen: thorns
  alternatives:
  - brambles
  - thornbushes
  lexicon: HALOT
  rationale: חוֹחִים refers to thorny plants. 'Thorns' is concise, idiomatic, and preserves the contrast between beauty and harshness in the poetic simile.
- source_word: כֵּן
  chosen: so is
  alternatives:
  - so
  - thus is
  lexicon: HALOT
  rationale: כֵּן introduces the second half of the comparison. 'So is' makes the English simile complete and readable.
- source_word: רַעְיָתִי
  chosen: my love
  alternatives:
  - my darling
  - my companion
  - my love
  lexicon: HALOT
  rationale: Natural English endearment for the speaker’s female beloved.
- source_word: הַבָּנוֹת
  chosen: the young women
  alternatives:
  - the young women
  - the girls
  - the maidens
  lexicon: HALOT
  rationale: Contextual idiom for female peers, rather than literal daughters.
