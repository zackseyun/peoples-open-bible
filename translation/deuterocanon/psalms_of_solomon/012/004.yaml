  meaning: The prayer asks that malicious speech bring turmoil to lawless households but be kept far from the innocent, and that slanderers perish away from those who fear the Lord.
  meaning_decisions:
  - source_phrase: συνταράξαι οἴκους παρανόμους ἐν πολέμῳ
    prior_rendering: May God throw lawless houses into turmoil in war
    new_rendering: May lawless households be thrown into turmoil and conflict
    rationale: The wish interpretation is retained, but the first clause does not explicitly name God as its subject. “Households” and “conflict” convey the social disruption caused by malicious speech without limiting the line to physical buildings or military warfare.
  - source_phrase: χείλεσι ψιθυροῖς … ὀστᾶ ψιθύρων
    prior_rendering: by whispering lips … the bones of whisperers
    new_rendering: by slanderous lips … the bones of slanderers
    rationale: These related terms denote malicious whispering or backbiting; the new wording makes their moral force clear while preserving the lips and bones images.
  - source_phrase: μακρύναι ὁ θεὸς ἀπὸ ἀκάκων χείλη παρανόμων ἐν ἀπορίᾳ
    prior_rendering: may God remove from the innocent the lips of the lawless in distress
    new_rendering: may God keep the lips of the lawless far from the innocent in distress
    rationale: The distance expressed by the verb is made explicit, and the reordered clause more naturally presents the innocent in distress as those needing protection.
