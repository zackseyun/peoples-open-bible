revisions:
- from: 그때 스가랴의 아들 시드기야가 철 뿔들을 만들어 자기에게 주고 말했습니다. “야훼께서 이렇게 말씀하십니다. ‘이것들로 너는 아람을 들이받아 그들을 끝장낼 것이다.’”[a][b]
  to: 그때 그나아나의 아들 시드기야가 자기를 위해 철 뿔들을 만들고 말했습니다. “야훼께서 이렇게 말씀하십니다. ‘이것들로 너는 아람을 들이받을 것이며, 그들을 멸할 때까지 그렇게 할 것이다.’”
  rationale: 계보의 인명과 순서를 원문대로 바로잡고, לּוֹ를 ‘자기를 위해’로 옮겨 무근거한 ‘주다’ 행위를 제거했습니다. ‘철 뿔들’과 ‘들이받다’는 상징 행위와 נגח의 뿔 이미지에 충실합니다. 마지막 절은 아람을 집합적 단수로, 뒤의 복수 대명사를 그 구성원들로 유지하면서, ‘그들을 멸할 때까지’라는 עַד כַּלּוֹתָם의 시간적 종결점을 보존했습니다.
  reviewer_model: gpt-5.6-terra
