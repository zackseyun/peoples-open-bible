  lexicon: Crum / POB audit trail
  rationale: 콥트어의 그리스어 차용어 νηστεύω는 ‘금식하다’가 가장 직접적이며, 현대 한국어 교회 용례와도 맞습니다.
- source_word: ⲉϣ ⲧⲉ ⲑⲉ
