lexical_decisions:
- source_word: συνελήμφθης μετὰ τῶν παίδων
  english_pob_choice: you were arrested with your children
  chosen_korean: 자녀들과 함께 붙잡혔을 때에도
  alternatives_korean:
  - 자녀들과 함께 체포되었을 때에도
  - 아이들과 함께 붙잡혔을 때에도
  lexicon: συλλαμβάνω
  rationale: 동사의 수동형은 단순한 ‘체포’보다 ‘붙잡히다/붙잡다’의 강한 구속감을 드러내므로, 문맥의 박해 상황을 살려 ‘붙잡혔을 때’로 옮겼습니다.
- source_word: τῶν παίδων
  english_pob_choice: your children
  chosen_korean: 자녀들
  alternatives_korean:
  - 아이들
  - 자식들
  lexicon: παῖς
  rationale: παίδων은 연령보다 관계를 강조하므로, 현대 한국어에서 가장 무난하고 포괄적인 ‘자녀들’을 택했습니다.
- source_word: εἱστήκεις
  english_pob_choice: you stood
  chosen_korean: 서 있었고
  alternatives_korean:
  - 서 있었으며
  - 버티고 있었고
  lexicon: ἵστημι
  rationale: 과거 완료적 상태를 보이는 ‘서 있었고’가 시각적 정지와 계속성을 함께 담아 주며, 단순한 위치 서기 이상의 긴장감을 유지합니다.
- source_word: ὁρῶσα βασανιζόμενον
  english_pob_choice: watching ... being tortured
  chosen_korean: 고문당하는 엘레아자르를 보며
  alternatives_korean:
  - 고문받는 엘레아자르를 보며
  - 괴롭힘당하는 엘레아자르를 보며
  lexicon: ὁράω / βασανίζω
  rationale: ὁρῶσα는 ‘보며’로 자연스럽게 옮기고, βασανιζόμενον은 본문의 가혹한 육체적·형벌적 뉘앙스를 살려 ‘고문당하는’으로 번역했습니다.
theological_decisions:
- issue: 문장 종결의 여운 처리
  chosen_reading: 끝을 ‘—’로 남겨 이어지는 다음 절과 긴장을 연결했습니다.
  alternative_readings:
  - 문장 마침표로 닫기
  - 쉼표로만 처리하기
  rationale: 영문 POB의 ‘and—’는 문장 미완결과 서술의 고조를 드러내므로, 한국어에서도 동일한 수사적 미완결성을 보존하는 것이 적절합니다.
  doctrine_reference: 문학적-수사적 보존 원칙
