- source_word: אִמַּצְתָּה
  english_pob_choice: made strong
  chosen_korean: 강하게 하신
  alternatives_korean:
  - 굳게 하신
  - 튼튼하게 하신
  - 견고하게 하신
  lexicon: HALOT
  rationale: 피엘형의 강화 의미를 자연스럽게 옮기되, 시편의 시적 문맥에 맞는 간결한 표현으로 처리했습니다.
- source_word: לָּךְ
  english_pob_choice: for yourself
  chosen_korean: 자신을 위해
  alternatives_korean:
  - 주님을 위해
  - 당신을 위해
  lexicon: HALOT
  rationale: 귀속·이익의 여격이 지닌 반사적 뉘앙스를 살려, 하나님의 목적을 드러내는 ‘자신을 위해’로 옮겼습니다.
theological_decisions:
- issue: ‘아들’의 비유적 정체를 어떻게 처리할 것인가
  chosen_reading: 주석 없이 본문에서는 ‘아들’을 그대로 유지했습니다.
  alternative_readings:
  - ‘가지’나 ‘새순’으로 식물 이미지에 맞추는 해석
  - 이스라엘 공동체를 가리키는 집단적 해석
  - 메시아적 예표로 명시하는 해석
  rationale: 히브리어는 분명히 ‘아들’이라고 말하므로, 비유를 평탄화하지 않고 원문의 긴장과 모호성을 보존하는 편이 본문 충실도에 부합합니다.
  doctrine_reference: 본문의 다의성과 신학적 긴장 보존
