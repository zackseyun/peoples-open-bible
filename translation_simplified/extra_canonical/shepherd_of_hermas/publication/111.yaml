translation:
  text: 'After I finished writing this book, the messenger who had put me in this shepherd’s care came
    to the house where I was. He sat on the couch. The shepherd stood at his right hand. Then he called
    me and spoke to me:


    2. “I put you and your household in this shepherd’s care,” he said, “so he could protect you.” “Yes,
    sir,” I said. “Do you want protection from every affliction and every cruelty? Do you want success
    in every good deed and word, and all the strength of righteousness? Then follow this one’s commandments,
    which I gave you. You will be able to master every evil.”


    3. “If you keep his commandments, you will have power over every desire and pleasure of this world.
    Success will follow you in every good undertaking. Make his patience and restraint your own.[a] Tell
    everyone that he has great honor and dignity before the Lord. Also tell them that he presides with
    great authority and is powerful in his role. He alone has been given authority over repentance throughout
    the whole world.[b] Does he seem powerful to you? Yet you all despise his patience and the consideration
    he shows you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Maturitas can denote mature gravity, deliberateness or patience. Here the shepherd’s restraint
      and consideration toward offenders favor “patience”; this remains a contextual lexical judgment,
      not a newly attested manuscript reading.
  - marker: b
    reason: lexical_alternative
    text: Paenitentia is rendered “repentance” in this moral-change context. The authority is assigned
      to the shepherd in the vision. This clause does not name a later church office or identify the shepherd
      with God.
lexical_decisions:
- source_word: domine
  chosen: Sir
  alternatives:
  - Lord
  - Master
  rationale: Respectful vocative to the visionary interlocutor; divine Dominum remains Lord.
- source_word: paenitentia
  chosen: repentance
  alternatives:
  - penance
  - change of mind
  rationale: Context concerns moral return after sins; no later penitential institution is inserted.
- source_word: successum in omni opere bono atque verbo
  chosen: success in every good deed and word
  alternatives:
  - prosperity
  rationale: Keep the explicit ethical scope; do not turn this into an unrestricted wealth promise.
- source_word: maturitatem / modestiam / verecundiam
  chosen: patience / restraint / consideration
  alternatives:
  - gravity / moderation / modesty
  rationale: Distinguish the three expressions in context; footnote exposes maturitas ambiguity.
