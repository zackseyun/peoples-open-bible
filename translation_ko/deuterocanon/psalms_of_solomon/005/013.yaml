  source_fidelity: 그리스어는 ‘왕들과 통치자들과 백성들을 먹이신다’는 진술 뒤에 명시적 호칭 ὁ θεός(‘하나님’)를 두고, 끝에서 다시 Κύριε(‘주님’)로 부릅니다. 초안은 전자의 명시적 호칭을 ‘주님’으로 바꾸어 사실상 생략하였으므로, 두 호칭을 모두 반영해야 합니다. τρέφεις는 여기서 ‘먹이십니다’로 적절하며, 후반의 수사 의문문도 충실합니다.
