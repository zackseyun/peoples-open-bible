revisions:
- from: 내 영혼을 그녀를 따라 두었습니다. 영원한 세대에 걸쳐 나는 그녀에게서 돌아서지 않겠습니다. 정결함 가운데서 나는 그녀를 찾았고, 처음부터 그녀를 위해 마음을 얻었습니다.
  to: 나는 내 영혼을 그녀를 따르는 데 바쳤습니다. 영원토록 나는 그녀에게서 돌아서지 않겠습니다. 정결함 가운데서 나는 그녀를 찾았고, 처음부터 그녀를 향한 마음을 얻었습니다.
  rationale: 원문의 여성 대명사, '영혼', 정결함, 그리고 마음이라는 핵심 어휘를 보존했습니다. 동시에 히브리어의 관용적 헌신 표현과 대상 지향적 마음이라는 관계를 현대 합쇼체 한국어에서 명료하게 다듬었습니다. 그리스어 병행본의 상이한 어순 및 결말은 히브리어 본문을 번역하는 본문에 반영하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T19:26:41Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문은 화자가 지혜를 가리키는 여성 대명사 대상에게 자신의 נפשׁ를 바치고 계속 그 대상을 따르며, 정결함 가운데서 그를 발견하고 처음부터 그를 향한 마음을 얻었다고 말합니다. 초안의 핵심 의미는 대체로 보존하지만, 첫 구절의 '그녀를 따라 두었습니다'는 נתן ... אחרי의 헌신·추종 의미를 한국어에서 부자연스럽고 불명확하게 만듭니다.
  naturalness: '''내 영혼을 그녀를 따라 두었습니다''와 ''그녀를 위해 마음을 얻었습니다''는 현대 표준 한국어에서 어색합니다. 각각 ''내 영혼을 그녀를 따르는 데 바쳤습니다'', ''그녀를 향한 마음을 얻었습니다''로 고치면 원문의 비유성과 문장 관계를 유지하면서 자연스럽습니다.'
  terminology: נפשׁ의 '영혼', טהרה의 '정결함', לֵב의 '마음'은 적절합니다. 대상의 여성 대명사는 원문의 문법적 성을 보존하므로 유지할 수 있습니다. '영원한 세대에 걸쳐'보다 נצח נצחים의 관용적 강조를 살린 '영원토록'이 더 자연스럽고 정확합니다.
  issues:
