  to: of all flesh
  rationale: The Hebrew phrase 'בְּכָל בָּשָׂר' (in/with/of all flesh) functions appositionally to specify the nature of the preceding 'כָּל נֶפֶשׁ חַיָּה' (every living creature). The current rendering 'among all flesh' creates a slightly clunky and redundant English phrase ('every living creature among all flesh'). Translating the preposition 'בְּ' as 'of' in this context ('every living creature of all flesh') is more idiomatic in English, aligns with standard renderings, and better captures the specifying relationship between the two Hebrew phrases.
