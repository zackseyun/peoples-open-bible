    changes_summary: Replaced 'does violence to ... as to the light' with 'insults' to reflect ὑβρίσει more accurately and removed unsupported wording not clearly represented in the source. Replaced 'changes his mind' with 'repents' for μετανοεῖ, while retaining the rest with minor smoothing.
translation:
  language: en
  text: If someone insults a holy man, the person who insulted him reorients[r1]. This is because the holy man shows mercy to those who speak abusively of him and remains silent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: those who revile him
  simplified_phrase: those who speak abusively of him
  preserved_meaning: The holy man has mercy on people who attack him with insulting speech.
  reasoning_layer_used: source wording and applied revision
  rationale: The common phrase explains “revile” while preserving its verbal hostility.
