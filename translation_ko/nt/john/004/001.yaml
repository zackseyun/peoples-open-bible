  naturalness: ‘제자를 만들고’ is understandable but less idiomatic in formal Korean biblical prose than ‘제자를 삼으시고.’ The revised wording is natural modern formal-polite Korean and preserves the syntactically incomplete transition marked by the dash.
  terminology: ‘바리새인들,’ ‘세례를 베푸시다,’ and ‘요한’ are appropriate standard terms. Honorific verbal forms properly agree with ‘예수께서’ in the reported content. The footnote is revised to state the comparative-scope alternative accurately and naturally.
