  source_fidelity: 시리아어 본문의 단수형 ‘이 보응’과 완료형 ‘임한/닥친’, 그리고 단수 소유 접미사의 ‘그 정해진 때’에 맞추어야 합니다. 현 초안은 이 핵심 의미를 대체로 반영하지만, 인용문의 도입과 호격 구성이 불완전하여 원문의 발화 구조를 충분히 전달하지 못합니다.
  naturalness: 현대 표준어 합쇼체에서는 ‘이르기를’만으로 직접 인용을 열기보다 ‘이렇게 말씀하십시오’로 도입하고, ‘본 사람들이여’는 ‘본 너희에게’로 정리하는 편이 자연스럽습니다.
  terminology: ‘보응’은 purʿānā(보복적 응보/보응)의 단수 의미를 보존하는 적절한 표현입니다. ‘성읍’은 고대 도시를 가리키는 문맥에 적합합니다.
  issues:
  - severity: medium
    issue: 직접 인용문의 도입과 문장 구조가 불완전합니다.
    rationale: ‘너는 … 이르기를’ 뒤에 인용 표지가 없고, ‘본 사람들이여’가 누구에게 말하는지와 명령문의 연결이 어색합니다. 원문의 ‘그들에게 말하라’와 이어지는 호소를 명확히 드러낼 필요가 있습니다.
  - severity: low
    issue: ‘이 재앙과 보응’에서 두 번째 지시어가 생략되었습니다.
    rationale: 영어 감사 이력 및 시리아어 단수 지시 표현은 ‘this calamity and this retribution’를 지지하므로, 한국어에서도 ‘이 재앙과 이 보응’이 더 충실합니다.
  revised_text: 당신은 그들과 그들과 같은 이들에게 이렇게 말씀하십시오. ‘그 정해진 때에 너희와 너희 성읍에 임한 이 재앙과 이 보응을 본 너희에게—’
  revised_footnotes:
  - marker: a
    text: 또는 ‘너희 백성’.
    reason: 영어 POB 감사 이력의 ‘your people’ 이문 가능성을 보존합니다.
  - marker: b
    text: 또는 ‘임하는 보응들’.
    reason: 영어 POB 감사 이력의 이전 복수·현재형 번역 가능성을 기록하되, 본문은 시리아어 단수·완료형을 따릅니다.
  - marker: c
    text: 또는 ‘그들의 정해진 때에’.
    reason: 영어 POB 감사 이력에 기록된 대안 소유격을 보존합니다. 본문은 시리아어 단수 접미사에 따라 ‘그 정해진 때에’로 번역합니다.
  revision_rationale: 단수 ‘이 보응’과 완료형 ‘임한’을 유지하고, 단수 소유격의 시간 표현을 ‘그 정해진 때’로 반영했습니다. 또한 직접 인용을 명시하고 호격을 현대 한국어에서 자연스러운 수신자 표현으로 정리했습니다. 대시와 열린 인용부호는 다음 절로 이어지는 미완의 발화를 보존합니다.
