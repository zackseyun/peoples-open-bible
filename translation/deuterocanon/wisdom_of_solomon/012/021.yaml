lexical_decisions:
- source_word: μετὰ πόσης ἀκριβείας
  chosen: with how much exactness
  alternatives:
  - with what great care
  - with what strictness
  - how precisely
  lexicon: LSJ
  rationale: The phrase is exclamatory/interrogative in form and emphasizes the precision or strict care of God's judgment. 'With how much exactness' stays close to the Greek while remaining intelligible in English.
- source_word: ἔκρινας
  chosen: you judged
  alternatives:
  - you governed
  - you decided
  lexicon: LSJ
  rationale: κρίνω here refers to God's judicial dealing with Israel in context. 'Judged' preserves the legal-moral sense without softening it to mere administration.
- source_word: τοὺς υἱούς σου
  chosen: your sons
  alternatives:
  - your children
  lexicon: LSJ
  rationale: The Greek is explicitly masculine plural, and the project's gender-accurate policy favors retaining 'sons' where that is the source wording. It also resonates with covenantal filial language for Israel.
- source_word: ὧν τοῖς πατράσιν
  chosen: to whose fathers
  alternatives:
  - whose fathers
  - to their fathers
  lexicon: LSJ
  rationale: This relative construction links 'your sons' with their ancestors. 'To whose fathers' reflects the dative and keeps the covenantal lineage explicit.
- source_word: ὅρκους
  chosen: oaths
  alternatives:
  - sworn pledges
  lexicon: LSJ
  rationale: ὅρκος is most directly 'oath.' Since συνθήκας follows, retaining distinct covenantal terms avoids collapsing the pair into one idea.
- source_word: συνθήκας
  chosen: covenants
  alternatives:
  - agreements
  - compacts
  lexicon: LSJ
  rationale: In biblical-religious context, 'covenants' best conveys solemn relational commitments made by God to the patriarchs. 'Agreements' would sound too contractual and weak.
- source_word: ἀγαθῶν ὑποσχέσεων
  chosen: of good promises
  alternatives:
  - full of good promises
  - promising good things
  - of beneficial promises
  lexicon: LSJ
  rationale: The genitive most naturally qualifies the oaths and covenants as involving good promises. 'Of good promises' is somewhat formal but preserves the compact Greek structure and positive content.
