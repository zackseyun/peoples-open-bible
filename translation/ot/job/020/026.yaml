id: JOB.20.26
reference: Job 20:26
source:
  edition: WLC
  text: כָּל חֹשֶׁךְ֮ טָמ֪וּן לִ/צְפּ֫וּנָ֥י/ו תְּ֭אָכְלֵ/הוּ אֵ֣שׁ לֹֽא נֻפָּ֑ח יֵ֖רַע שָׂרִ֣יד בְּ/אָהֳלֽ/וֹ־־׃
translation:
  text: Total darkness is stored up for his treasures; a fire not fanned will consume him; it will harm what remains in his tent[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The final clause may instead mean “it will harm the survivor in his tent.”
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל
  chosen: All
  alternatives:
  - Every
  lexicon: HALOT
  rationale: Quantifier governing חֹשֶׁךְ; 'all' is the most natural English rendering here.
- source_word: חֹשֶׁךְ
  chosen: darkness
  alternatives:
  - gloom
  lexicon: HALOT
  rationale: Retains the concrete/metaphorical force of the Hebrew; in context it likely denotes calamity/judgment, but 'darkness' preserves the imagery.
- source_word: טָמוּן
  chosen: is hidden up
  alternatives:
  - is stored up
  - is concealed
  lexicon: HALOT
  rationale: Passive participial sense of something concealed or reserved. 'Hidden up' preserves both concealment and reservation for future judgment.
- source_word: לִצְפּוּנָיו
  chosen: for his treasures
  alternatives:
  - for his hidden things
  - for his secret stores
  - in reserve for him
  lexicon: HALOT
  rationale: From צפן in a nominalized/plural form with 3ms suffix. The phrase is difficult; it can denote hidden stores or treasures. 'For his treasures' reflects the likely sense of what is laid up/reserved for him, while preserving the wordplay with hiddenness.
- source_word: תְּאָכְלֵהוּ
  chosen: will consume him
  alternatives:
  - will devour him
  - will eat him up
  lexicon: HALOT
  rationale: Subject is אֵשׁ, feminine singular. 'Consume' is idiomatic in English for destructive fire while preserving the verb's force.
- source_word: אֵשׁ
  chosen: a fire
  alternatives:
  - fire
  lexicon: HALOT
  rationale: Indefinite in Hebrew context; 'a fire' works naturally in English and introduces the agent of destruction.
- source_word: לֹא נֻפָּח
  chosen: not fanned
  alternatives:
  - unfanned
  - not kindled by human breath
  lexicon: HALOT
  rationale: This is ordinary English for a fire not supplied by blowing.
- source_word: יֵרַע
  chosen: it will feed on
  alternatives:
  - it will harm
  - it will consume
  - it will afflict
  lexicon: HALOT
  rationale: Though the root often means 'be evil/do harm,' in this context with fire and the object שָׂרִיד, the sense is destructive action upon what remains. 'Feed on' captures the fire imagery and parallelism with 'consume.'
- source_word: שָׂרִיד
  chosen: what remains
  alternatives:
  - the survivor
  - the remnant
  lexicon: HALOT
  rationale: Can denote a survivor or remnant. Because the phrase is located 'in his tent,' an impersonal rendering fits the likely reference to whatever is left of his household/property, while avoiding over-specification.
- source_word: בְּאָהֳלוֹ
  chosen: in his tent
  alternatives:
  - in his dwelling
  lexicon: HALOT
  rationale: '''Tent'' is the literal and vivid image in Job, often representing one''s household or dwelling. The literal rendering preserves the poetic setting.'
- source_word: כָּל חֹשֶׁךְ
  chosen: Total darkness
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This naturally conveys the comprehensive darkness while preserving the image.
- source_word: טָמוּן לִצְפּוּנָיו
  chosen: is stored up for his treasures
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: “Stored up” renders concealed/reserved naturally; the difficult reference to his hidden stores is retained.
- source_word: יֵרַע שָׂרִיד
  chosen: it will harm what remains
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The destructive context supports harm, but neither a consuming action nor an exclusively impersonal remnant should be imposed.
