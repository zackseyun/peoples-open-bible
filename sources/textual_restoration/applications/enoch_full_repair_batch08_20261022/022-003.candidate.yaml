translation:
  text: 'Then Raphael, one of the holy angels who was with me, answered and said to me, “These ‘beautiful’ places
    are for the spirits of the souls of the dead to gather in. For this they were created: to gather here every
    soul of the children of humanity.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The adjective is again daggered as corrupt; see22:2. The selected wording explicitly has spirits of their
      souls, of the dead, followed by every soul. These terms are retained without imposing a fixed philosophical
      distinction: Dillmann1865 cols707–709 shows overlapping life, soul and spirit uses and explicitly lists spirits
      of dead people with Hen22:3. The collection clause is syntactically awkward; for this supplies the sense of
      the printed literally for it, this.'
    reason: textual_variant
