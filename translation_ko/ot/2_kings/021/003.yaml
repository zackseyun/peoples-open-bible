source:
  edition: WLC
  text: וַ/יָּ֗שָׁב וַ/יִּ֨בֶן֙ אֶת הַ/בָּמ֔וֹת אֲשֶׁ֥ר אִבַּ֖ד חִזְקִיָּ֣הוּ אָבִ֑י/ו וַ/יָּ֨קֶם מִזְבְּחֹ֜ת לַ/בַּ֗עַל וַ/יַּ֤עַשׂ אֲשֵׁרָה֙ כַּ/אֲשֶׁ֣ר עָשָׂ֗ה אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יִּשְׁתַּ֨חוּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַֽ/יַּעֲבֹ֖ד אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: ko
  text: 그는 그의 아버지 히스기야가 없앤 산당들을 다시 세우고, 바알을 위한 제단들을 세우고, 이스라엘 왕 아합이 한 것처럼 아세라[b]를 만들고, 하늘의 모든 군상에게 절하며 그것들을 섬겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘아세라’는 가나안 종교의 여신 이름을 가리키거나, 그 숭배와 관련된 목상이나 기둥을 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן אֶת הַבָּמוֹת
  english_pob_choice: And he rebuilt the high places
  chosen_korean: 산당들을 다시 세우고
  alternatives_korean:
  - 높은 곳들을 다시 세우고
  - 산당을 복구하고
  lexicon: בָּמָה
  rationale: bāmôt는 우상 숭배와 결부된 종교적 제의 장소이므로 관용적이면서도 의미를 드러내는 ‘산당’이 적절합니다. ‘다시 세우다’는 재건의 동작을 자연스럽게 옮겼습니다.
- source_word: לַבַּעַל
  english_pob_choice: to Baal
  chosen_korean: 바알에게
  alternatives_korean:
  - 바알을 위해
  - 바알을 향해
  lexicon: בַּעַל
  rationale: 전치사 לְ는 대상/지향을 나타내므로 ‘바알에게’가 가장 सीधे하고 문맥상 제사적 헌납의 뉘앙스를 보존합니다.
- source_word: וַיַּעַשׂ אֲשֵׁרָה
  english_pob_choice: and made an Asherah
  chosen_korean: 아세라를 만들며
  alternatives_korean:
  - 아세라 목상을 만들며
  - 아세라를 세우며
  lexicon: אֲשֵׁרָה
  rationale: 본문은 단순히 ‘아세라’라고 하여 명칭 자체를 사용하므로, 구체화를 과도하게 넣지 않고 ‘아세라’를 유지했습니다.
- source_word: וַיִּשְׁתַּחוּ לְכָל צְבָא הַשָּׁמַיִם
  english_pob_choice: and he bowed down to all the host of heaven
  chosen_korean: 하늘의 온 군상에게 절하고
  alternatives_korean:
  - 하늘의 모든 군대에게 절하고
  - 하늘의 모든 별무리에게 절하고
  lexicon: צְבָא הַשָּׁמַיִם
  rationale: ‘host of heaven’은 천체/천상 존재를 아우르는 우상숭배 표현이므로, 군사적 어감의 ‘군상’으로 옮겨 집합적 전체성을 살렸습니다.
theological_decisions:
- issue: 산당과 바알 숭배를 현대 한국어에서 어떻게 드러낼지
  chosen_reading: ‘산당’, ‘바알’, ‘아세라’를 그대로 유지해 본문의 배교성을 완화하지 않았습니다.
  alternative_readings:
  - ‘제의소’로 완화
  - ‘우상 제단’으로 일반화
  rationale: 본문은 유다 왕의 노골적 우상숭배를 고발하므로, 전통적 교회어보다 원문의 종교사적 표지를 직접 드러내는 편이 적절합니다.
  doctrine_reference: 신명기 12장; 열왕기하 18:4
- issue: ‘하늘의 군상’이 가리키는 대상의 범위를 어떻게 유지할지
  chosen_reading: ‘하늘의 온 군상’으로 번역해 천체 숭배와 천상 존재 숭배의 중첩 가능성을 열어 두었습니다.
  alternative_readings:
  - ‘하늘의 모든 별들’
  - ‘하늘의 모든 천군’
  rationale: 히브리어 표현은 천문적 대상과 하늘의 군대를 함께 연상시킬 수 있어, 한쪽으로만 고정하지 않고 원문의 넓은 범위를 보존했습니다.
  doctrine_reference: 신명기 4:19; 열왕기하 17:16
