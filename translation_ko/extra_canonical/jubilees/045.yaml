  to: '1. 이스라엘은 넷째 달 초하루에 이집트 땅, 곧 고센 땅으로 들어갔습니다.

    2. 넷째 달, 마흔두 번째 희년의 셋째 주 둘째 해에, 요셉이 그를 맞으러 왔습니다.

    3. …그의 아버지 야곱을 고센 땅에서 만나 아버지의 목을 끌어안고 울었습니다. 이스라엘이 요셉에게 말했습니다. “내가 너를 보았으니, 이제는 죽어도 된다. 이제 야훼, 곧 이스라엘의 하나님, 아브라함의 하나님, 이삭의 하나님이 찬양받으시기를 바랍니다. 그분은 자비와 긍휼을 보이셨습니다.”

    4. 그의 종 야곱에게서입니다. 제가 아직 살아 있는 동안 당신의 얼굴을 보게 된 것은 제게 참으로 큰 일입니다. 제가 벧엘에서 본 그 환상이 참으로 이루어졌기 때문입니다. 야훼, 나의 하나님, 영원무궁토록 찬송을 받으소서. 그의 이름도 찬송을 받으소서.

    5. 요셉과 그의 형제들은 아버지 앞에서 떡을 먹고 포도주를 마셨습니다. 야곱은 요셉이 그의 형제들과 함께 먹고 아버지 앞에서 마시는 것을 보고 매우 크게 기뻐했습니다. 그는 야곱을 지켜 주시고 야곱을 위해 그의 열두 아들을 지켜 주신 만물의 창조주를 찬송했습니다.

    6. 요셉은 자기 아버지와 자기 형제들에게 소유지를 주어, 그들이 고센 땅과 라암셋, 곧 요셉이 바로 앞에서 다스리던 그 모든 지역에 거주하게 했습니다. 이스라엘과 그의 아들들은 애굽 땅에서 가장 좋은 곳인 고센 땅에 정착했습니다. 이스라엘은 애굽에 들어갔을 때 백삼십 세였습니다.

    7. 그리고 요셉은 기근이 든 일곱 해 동안 아버지와 형제들과 그들의 모든 가축을, 그들 모두에게 필요한 만큼 먹여 살렸습니다.

    8. 기근 때문에 이집트 땅이 고통을 겪었습니다. 요셉은 곡식을 대가로 이집트의 온 땅을 파라오를 위해 얻었고, 백성과 그들의 가축과 모든 것을 파라오를 위해 얻었습니다.

    9. 그리고 기근의 햇수는 끝났습니다. 요셉은 그 땅에 있던 백성에게 씨앗과 양식을 주어, 그들이 여덟째 해에 땅에 씨를 뿌리게 했습니다. 이는 강물이 이집트 온 땅에 범람했기 때문입니다.

    10. 기근이 든 일곱 해 동안 강은 넘쳐흐르지 않았고, 강둑의 몇몇 곳에서만 땅에 물을 대었습니다. 그러나 이제 강은 넘쳐흘렀고, 이집트는 그해에 땅에 씨를 뿌리고 아주 많은 곡식을 거두었습니다.

    11. 그리고 그 해는 마흔다섯 번째 희년의 넷째 주간의 첫째 해였습니다.

    12. 요셉은 생산된 모든 것 가운데 오분의 일을 왕을 위하여 거두고, 오분의 사는 그들에게 먹을 것과 씨앗으로 남겨 두었습니다.

    13. 요셉은 오늘날까지 이집트 땅에 이것을 규례로 삼았습니다. 이스라엘은 이집트 땅에서 십칠 년을 살았고, 그가 산 모든 날은 세 희년, 곧 백사십칠 년이었습니다. 그리고 그는 마흔다섯째 희년의 다섯째 주의 넷째 해에 죽었습니다.

    14. 그리고 이스라엘은 죽기 전에 자기 아들들을 축복하고, 그들에게 이집트 땅에서 닥칠 모든 일을 말해 주었으며, 또한 뒤날에 그들에게 닥칠 일을 알려 주었습니다.

    15. 그는 그들에게 복을 주고, 요셉에게는 그 땅에서 두 몫을 주었습니다. 그는 조상들과 함께 잠들었고, 가나안 땅에서 그의 아버지 아브라함 가까이에 있는 막벨라 굴에 묻혔습니다.

    16. 그가 스스로 파 놓은 무덤, 곧 헤브론 땅의 쌍굴에 있는 무덤 안에. 그리고 그는 자기 아들 레위에게 자기의 모든 책과 조상들의 책을 주어, 레위가 오늘날까지 자기 자녀들을 위하여 그것들을 보존하고 새롭게 하도록 하였습니다.'
