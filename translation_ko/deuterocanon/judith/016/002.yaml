  text: For the Lord is a God who shatters wars; for in his camp, in the midst of the people, he rescued me from the hand of those pursuing me.
translation:
  language: ko
  text: 주님은 전쟁을 깨뜨리시는 하나님이시기 때문입니다. 그분께서 그분의 진영, 곧 백성 가운데서 나를 뒤쫓는 자들의 손에서 구해 주셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεὸς συντρίβων πολέμους
  english_pob_choice: a God who shatters wars
  chosen_korean: 전쟁을 무너뜨리시는 하나님
  alternatives_korean:
  - 전쟁을 꺾으시는 하나님
  - 전쟁을 산산이 부수시는 하나님
  lexicon: θεός, συντρίβων, πόλεμος
  rationale: συντρίβων은 단순 종결보다 강한 파괴·분쇄의 뜻이 있어, POB의 “shatters wars”를 따라 ‘무너뜨리시는’으로 옮겼습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 본문이 하나님을 가리키는 호칭으로 쓰인 κύριος를 한국어 경어형 신앙어로 자연스럽게 살리되, 이 절은 인용 표지가 아니므로 본문에서는 주님으로 옮겼습니다.
- source_word: ἐν μέσῳ λαοῦ
  english_pob_choice: in the midst of the people
  chosen_korean: 백성 가운데서
  alternatives_korean:
  - 백성 한가운데서
  - 사람들 가운데서
  lexicon: ἐν μέσῳ, λαός
  rationale: 중앙성보다 공동체 내부성을 강조하는 구문이므로 ‘가운데서’로 옮겨, POB의 의미를 간결하게 반영했습니다.
- source_word: ἐξείλατό με ἐκ χειρὸς καταδιωκόντων με
  english_pob_choice: he rescued me from the hand of those pursuing me
  chosen_korean: 나를 나를 뒤쫓는 자들의 손에서 구해 주셨습니다
  alternatives_korean:
  - 나를 뒤쫓는 자들의 손에서 건져 주셨습니다
  - 나를 추격하는 자들의 손에서 구원해 주셨습니다
  lexicon: ἐξαιρέω, καταδιώκω, χείρ
  rationale: POB의 ‘rescued’를 따라 ‘구해 주셨습니다’로 했고, ἐκ χειρός는 위협의 권세에서 벗어남을 나타내므로 ‘손에서’로 유지했습니다.
theological_decisions:
- issue: 하나님이 전쟁을 무너뜨리신다는 진술의 성격
  chosen_reading: 전쟁 자체를 깨뜨리는 하나님의 주권적 구원 행위로 읽었습니다.
  alternative_readings:
  - 전쟁을 단순히 멈추게 하신다는 평화주의적 표현
  - 개별 전투만이 아니라 전쟁 질서 전체를 무너뜨린다는 묵시적 표현
  rationale: 문맥은 군사적 승리의 보고가 아니라 하나님이 전쟁의 힘을 꺾어 백성을 구원하신다는 찬양이므로, 과도하게 비유화하지 않고 원문의 강한 진술을 살렸습니다.
  doctrine_reference: 하나님의 주권과 구원(시 46:9의 개념적 유사성)
