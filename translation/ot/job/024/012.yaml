id: JOB.24.12
reference: Job 24:12
source:
  edition: WLC
  text: מֵ֘/עִ֤יר מְתִ֨ים יִנְאָ֗קוּ וְ/נֶֽפֶשׁ חֲלָלִ֥ים תְּשַׁוֵּ֑עַ וֶ֝/אֱל֗וֹהַּ לֹא יָשִׂ֥ים תִּפְלָֽה׀־־׃
translation:
  text: People groan in the city; the souls of the wounded cry out for help, yet God charges no one with wrongdoing[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: With different Hebrew vowel pointing, the final clause can read, “yet God pays no attention to their prayer.”
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר
  chosen: From the city
  alternatives:
  - In the city
  - Out of the city
  lexicon: HALOT
  rationale: The preposition מִן with עִיר most naturally means 'from the city,' marking the place from which the groaning arises. English 'from the city' preserves the Hebrew image without overinterpreting whether the sense is source or location.
- source_word: מְתִים
  chosen: men
  alternatives:
  - men
  - the dead
  - mortals
  lexicon: HALOT
  rationale: The plural human noun is rendered men or people according to whether natural gender is contextually relevant or generically representative.
- source_word: יִנְאָקוּ
  chosen: groan
  alternatives:
  - moan
  - lament
  lexicon: HALOT
  rationale: The verb denotes audible suffering or groaning. 'Groan' is natural modern English and preserves the visceral force of the Hebrew.
- source_word: וְנֶפֶשׁ
  chosen: and the soul
  alternatives:
  - and the life
  - and the person
  lexicon: HALOT
  rationale: נֶפֶשׁ can mean 'soul,' 'life,' or 'self/person.' Here 'the soul of the slain' is a conventional and intelligible rendering that preserves the Hebrew wording and emotional weight. The broader sense 'life' is possible but less idiomatic in this construction.
- source_word: חֲלָלִים
  chosen: the slain
  alternatives:
  - the wounded
  - the pierced
  lexicon: HALOT
  rationale: The noun commonly refers to those fatally struck down. 'The slain' fits the context of violent injustice in Job 24.
- source_word: תְּשַׁוֵּעַ
  chosen: cries out for help
  alternatives:
  - cries out
  - shouts
  - pleads
  lexicon: HALOT
  rationale: The Piel form conveys a desperate cry for aid. 'Cries out for help' makes the implied appeal explicit in idiomatic English.
- source_word: וֶאֱלוֹהַּ
  chosen: yet God
  alternatives:
  - but God
  - and God
  lexicon: HALOT
  rationale: The conjunction here is adversative in sense given the contrast between human suffering and divine non-response. 'Yet God' captures that tension well.
- source_word: לֹא יָשִׂים תִּפְלָה
  chosen: does not regard it as folly
  alternatives:
  - does not regard it as folly
  - does not lay blame
  - does not pay attention to the outrage
  lexicon: HALOT
  rationale: This preserves the difficult idiom and the semantic force of תִּפְלָה.
- source_word: וְנֶפֶשׁ חֲלָלִים
  chosen: and the wounded
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The expression can refer collectively to wounded persons/lives; this fits the following cry.
