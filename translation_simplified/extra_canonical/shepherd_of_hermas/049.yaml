  footnotes:
  - marker: a
    reason: textual_variant
    text: 'Project edition-comparison report: S3 is a complete distinct parable here, not a continuation
      of S2. Michigan printed40 omits this-age after sinners in III.2 and the final but all are alike
      in III.3, while the working Greek retains them with the printed Latin versions. These are actual
      wording differences, not proof of a whole missing parable. All nested and earlier reader records
      are archived for migration.'
  - marker: b
    reason: textual_variant
    text: 'Project edition-comparison report: Working IV.2 retains all will be made manifest. Michigan
      printed41 instead has they will be made manifest to all, with damaged final letters and a different
      verb. Palatina printed141 has to all (omnibus), while the Vulgata printed75 text has all (omnes),
      with to all reported in its apparatus. Michigan summer supports the corrected season against the
      reported Athos throne; this working summer already existed and is not a new selection.'
  - marker: c
    reason: textual_variant
    text: 'Bounded working selection: The earlier1891 Greek inserted those who are least in brackets,
      attributed to Harmer from Palatina. The working source now omits that phrase, following Michigan
      printed42 papyrus3lines4–6, where παντ[ες ε]υθαλεις οντες has supplied letters but no space or sign
      of the longer addition. Berlin5513 printed15column2lines40–41 also lacks least, though much is supplied
      and its continuation differs. Palatina printed141 retains who were least in this age; Vulgata printed75
      has rejoicing/restored language. The reported Athos repeats flourishing wording rather than least.
      Raw1891 brackets remain intact. This is a bounded edition-based selection, not new photograph certification.'
  - marker: d
    reason: textual_variant
    text: 'Project edition-comparison report: Working IV.4 says they will be manifest. Michigan printed42
      instead has they will be invisible (aphaneroi), and its commentary considers possible disappearance
      but also discusses the rare word and alternative syntax. Palatina printed141 and Vulgata printed75
      retain manifest language. The working visible assertion is retained; no conclusion about annihilation
      is silently added. Berlin5513 has much of this clause supplied. Nations renders ethnē without adding
      a requirement to become ethnically different.'
  - marker: e
    reason: lexical_alternative
    text: Repent follows current contextual project policy for the moral change demanded after sin. The
      two burning assertions and their different stated reasons are preserved without adding later doctrinal
      conditions or weakening the negative. Servant/serve follows current policy and retains belonging,
      bonded status and allegiance nuance.
  - marker: f
    reason: textual_variant
    text: 'Project edition-comparison report: Working IV.5 states that you will not err in anything. Its
      damaged Athos negative/form and Berlin’s partly supplied future differ; Michigan printed43 has a
      negative with a future-like subjunctive. Palatina printed141 has a prohibition-like nihil peccaveris,
      while Vulgata printed75 has nihil delinques. The positive result of abstaining from many activities
      is retained; it is not softened into merely reducing errors.'
  - marker: g
    reason: textual_variant
    text: The working source brackets for in IV.6 as an insertion. The1891 apparatus attributes it to
      Hollenberg with Latin support. Michigan printed44 and reported Athos lack it. The translation retains
      this disclosed editorial connection and both receive/nothing outcomes. Vulgata printed75–76 omits
      the negative-result clause between the affirmative request sentence and IV.7; the working Greek
      and Palatina retain the negative outcome.
  - marker: h
    reason: textual_variant
    text: 'Project edition-comparison report: Working IV.7 has his mind will not be corrupted away from
      the Lord. Michigan printed44 has a stronger emphatic negative construction; the Bonner apparatus
      reports Hamburg omits the following Lord/pure-mind stretch by similar-ending loss. Hamburg is an
      attributed report here, not a freshly read manuscript. Palatina printed141 has his mind will not
      be alienated from the Lord. The simplified led astray explains the working construction without
      changing its negative or pure-mind condition. Vulgata printed76 has serve God, with mind not alienated
      from the Lord; those divine titles are not silently made identical.'
  - marker: i
    reason: textual_variant
    text: 'Project edition-comparison report: Working IV.8 has you can, whereas Michigan printed44 has
      a future can/will-be-able form. Both retain the condition and the closing whoever does these things
      will bear fruit. Palatina printed141 expands the close with fruit of life; that extra life wording
      is not inserted into the selected Greek. Vulgata printed76 has a plain fruit ending without the
      extra life word.'
