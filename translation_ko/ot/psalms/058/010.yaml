id: PSA.58.10
reference: Psalms 58:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִשְׂמַ֣ח צַ֭דִּיק כִּי חָזָ֣ה נָקָ֑ם פְּעָמָ֥י/ו יִ֝רְחַ֗ץ בְּ/דַ֣ם הָ/רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/010.yaml
  text: The righteous will rejoice when he sees vengeance[a]; he will wash his feet in the blood of the wicked.
  footnotes:
  - marker: a
    text: Or “because he has seen vengeance.”
    reason: lexical_alternative
translation:
  language: ko
  text: 의인은 보복을 볼 때[a] 기뻐할 것입니다. 그는 악인의 피 속에서 자기 발을 씻을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보복을 보았기 때문에.’ 히브리어 접속사 כִּי는 시간적 의미(‘~할 때’)뿐 아니라 인과적 의미(‘~하기 때문에’)로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악인의 피 속에서 자기 발을 씻는다’는 표현은 심판이 철저함을 나타내는 시적 이미지이며, 개인적 폭력을 명령하는 말이 아닙니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּטֶרֶם
  english_pob_choice: Before
  chosen_korean: 깨닫기도 전에
  alternatives_korean:
  - 전에
  - 하기 전에
  lexicon: HALOT
  rationale: 시간의 선행성을 살리되, 본문이 매우 급작스러운 판단을 말하므로 한국어에서는 ‘깨닫기도 전에’로 자연스럽게 압축했습니다.
- source_word: יָבִינוּ
  english_pob_choice: can feel
  chosen_korean: 느끼지 못할 것이니
  alternatives_korean:
  - 알지 못할 것이니
  - 깨닫지 못할 것이니
  - 느낄 수 있을 것이니
  lexicon: HALOT
  rationale: ‘냄비’가 주어인 의인화된 표현이므로, 영어 POB의 감각적 해석을 따라 열기를 ‘느끼다’로 옮겼습니다.
- source_word: סִּירֹתֵיכֶם
  english_pob_choice: your pots
  chosen_korean: 너희 냄비는
  alternatives_korean:
  - 너희 솥은
