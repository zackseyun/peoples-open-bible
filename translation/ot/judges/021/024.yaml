  from: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
  to: At that time the Israelites dispersed from there, each man to his tribe and clan. They left that place, each man for the land of his inheritance.
  rationale: The lexical record recognizes dispersal, the clan-level meaning, and the territorial inheritance. I bring the latter two points into the text rather than leaving them in footnotes, while preserving the verse’s repeated departure language.
