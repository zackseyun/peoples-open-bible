translation:
  language: ko
  text: 그로 말미암아 주님께서 너희 가운데서 왕권을 택하시고 레위에게서 제사장 직분을 택하실 것입니다. 이는 주님께서 모든 민족과 이스라엘 족속을 위한 분이 되시게 하려는 것입니다.
