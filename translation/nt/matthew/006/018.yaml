  meaning: Jesus teaches that fasting should be evident to the Father rather than to other people, and that the Father will reward what is hidden from public view.
  meaning_decisions:
  - source_phrase: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου
    prior_rendering: so that you may not appear to men to be fasting, but to your Father
    new_rendering: so that your fasting will be seen not by others but by your Father
    rationale: The contrast concerns who observes the fasting, not whether the fasting is merely apparent. Restructuring makes that contrast natural in English, while 'others' conveys the generic reference to human observers without needing a gender clarification.
  - source_phrase: τῷ ἐν τῷ κρυφαίῳ
    prior_rendering: who is in secret
    new_rendering: who is unseen[a]
    rationale: This conveys the Father's hidden presence without suggesting that he acts secretively. The footnote preserves the source wording and its connection with the repeated reference to secrecy.
  - source_phrase: ὁ βλέπων ἐν τῷ κρυφαίῳ
    prior_rendering: who sees in secret
    new_rendering: who sees what is done in secret
    rationale: The context emphasizes the Father's awareness of hidden fasting, not a secretive manner of seeing. Making the understood object explicit carries that meaning clearly.
