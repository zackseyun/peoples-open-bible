id: JOB.37.23
reference: Job 37:23
source:
  edition: WLC
  text: שַׁדַּ֣י לֹֽא מְ֭צָאנֻ/הוּ שַׂגִּיא כֹ֑חַ וּ/מִשְׁפָּ֥ט וְ/רֹב צְ֝דָקָ֗ה לֹ֣א יְעַנֶּֽה־־־׃
translation:
  text: We cannot fathom the Almighty; he is great in power and abundant in justice and righteousness; he does not oppress[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “he does not afflict”; the clause has also been understood as “he does not answer.”
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  chosen: The Almighty
  alternatives:
  - Shaddai
  lexicon: HALOT
  rationale: Rendered as the title 'The Almighty,' the standard semantic value of שַׁדַּי in Job. Translating the title preserves meaning for English readers better than transliteration.
- source_word: לֹא מְצָאנֻהוּ
  chosen: we cannot find him out
  alternatives:
  - we do not find him
  - we cannot attain to him
  - we cannot comprehend him
  lexicon: HALOT
  rationale: The verb מצא with object suffix literally means 'find him,' but in this context of divine transcendence it carries the sense of being unable to discover, attain, or fully comprehend him. 'Find him out' preserves the idiomatic force without over-paraphrasing.
- source_word: שַׂגִּיא כֹחַ
  chosen: great in power
  alternatives:
  - exalted in power
  - abundant in strength
  - mighty in power
  lexicon: HALOT
  rationale: שַׂגִּיא denotes greatness or loftiness, and with כֹחַ expresses overwhelming power. 'Great in power' is natural English and close to the Hebrew structure.
- source_word: וּמִשְׁפָּט
  chosen: and justice
  alternatives:
  - and judgment
  lexicon: HALOT
  rationale: מִשְׁפָּט can mean 'judgment' or 'justice.' Here, paired with righteousness as a divine attribute, 'justice' better conveys the ethical quality rather than a specific judicial act.
- source_word: וְרֹב צְדָקָה
  chosen: and abundant righteousness
  alternatives:
  - and great righteousness
  - and fullness of righteousness
  lexicon: HALOT
  rationale: רֹב marks abundance or greatness; צְדָקָה here denotes righteousness in the sense of moral rectitude. 'Abundant righteousness' preserves both the noun and its intensification.
- source_word: לֹא יְעַנֶּה
  chosen: he does not oppress
  alternatives:
  - he does not afflict
  - he does not answer
  lexicon: HALOT
  rationale: The Piel most naturally denotes afflicting or oppressing here. “Violate” is an interpretive contextual expansion rather than the verb’s direct sense.
