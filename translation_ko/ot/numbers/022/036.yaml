  text: 발락은 블레암이 왔다는 말을 듣고, 아르논 경계에 있으며 그 경계의 끝에 있는 모압 성[a]으로 나가 그를 맞이하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 특정하게 알려진 ‘모압 성’을 가리킬 수도 있고, 일반적으로 모압에 속한 한 성을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘경계’는 이 문맥에서 ‘영토’ 또는 ‘지역’을 뜻할 수도 있습니다.
    reason: lexical_alternative
