  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤יד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יוֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/016.yaml
  text: And now, LORD, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man to sit on the throne of Israel before me shall not be cut off from you, if only your sons keep their way by walking in my law, as you have walked before me.’
translation:
  language: ko
  text: 이제 이스라엘의 하나님이신 주님, 주의 종 내 아버지 다윗에게 말씀하신 것을 지켜 주십시오. 곧 ‘네게서 이스라엘의 왕좌에 앉아 내 앞에 설 사람이 끊어지지 않을 것이다. 다만 네 자손들이 네가 내 앞에서 걸었던 것처럼 내 율법 안에서 걸어가도록 그들의 길을 지킨다면 그러할 것이다’ 하고 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 יְהוָה는 언약 이름이지만, 본문 내에서 호칭으로 자연스럽게 읽히도록 ‘주님’으로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: LORD, God of Israel
  chosen_korean: 이스라엘의 하나님이신 주님
  alternatives_korean:
  - 이스라엘의 하나님 야훼
  - 이스라엘의 하나님 여호와
  lexicon: יהוה
  rationale: 원문이 언약적 호칭으로 하나님을 부르므로 ‘주님’으로 옮기되, 한국어 문장 흐름상 ‘이스라엘의 하나님이신’으로 관계를 분명히 했습니다.
- source_word: שְׁמֹר לְעַבְדְּךָ דָוִיד
  english_pob_choice: keep for your servant David
  chosen_korean: 주의 종 내 아버지 다윗에게 말씀하신 것을 지켜 주십시오
  alternatives_korean:
  - 주의 종 다윗을 위하여 지켜 주십시오
  - 주의 종인 내 아버지 다윗을 지켜 주십시오
  lexicon: שׁמר
  rationale: 동사의 목적어가 ‘다윗에게 말씀하신 것’이므로 단순히 다윗을 지키기보다 ‘말씀하신 것을 지키다’로 살려 원문 관계를 반영했습니다.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לּוֹ
  english_pob_choice: what you spoke to him
  chosen_korean: 말씀하신 것을
  alternatives_korean:
  - 그에게 말씀하신 것
  - 그에게 하신 말씀
  lexicon: דבר
  rationale: 영어 POB의 ‘what you spoke to him’를 따라, 약속의 내용을 가리키는 표현으로 자연스럽게 옮겼습니다.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  english_pob_choice: A man ... shall not be cut off from you
  chosen_korean: 사람이 ... 너에게서 끊어지지 않을 것입니다
  alternatives_korean:
  - 한 사람이 ... 너에게서 끊이지 않을 것입니다
  - 사람이 ... 끊어지지 않을 것입니다
  lexicon: כרת
  rationale: ‘끊어지다’는 언약적 계열 단절을 비교적 직접적으로 드러내며, 수동형의 의미도 자연스럽게 담습니다.
- source_word: בְּתוֹרָתִי
  english_pob_choice: in my law
  chosen_korean: 내 율법 안에서
  alternatives_korean:
  - 내 율법대로
  - 내 법 안에서
  lexicon: תורה
  rationale: 토라의 기본 의미를 따라 ‘율법’으로 옮기고, ‘걸어가다’와 결합되는 문맥을 살려 ‘안에서’로 표현했습니다.
theological_decisions:
- issue: 아버지 다윗에 대한 호칭과 왕조 약속의 직접성
  chosen_reading: 다윗을 ‘주의 종 내 아버지’로 옮기고, 약속의 조건을 문장 안에서 분명히 유지했습니다.
  alternative_readings:
  - 주의 종 다윗
  - 내 아버지 다윗
  rationale: 히브리어는 다윗을 하나님의 종이면서 동시에 화자의 아버지로 부르므로 두 관계를 모두 드러내는 편이 원문의 신학적 무게를 보존합니다.
  doctrine_reference: 다윗 언약 / 왕조 약속
