  from: For it is a fire that devours as far as destruction[a], and it would uproot all my produce.
  to: For it is a fire that devours until nothing remains[a], and it would uproot all my produce.
  rationale: The latest revision preserved the fire's devouring action and the agricultural image of uprooting, both retained here. Its spatial wording remains opaque in English, so the main text expresses complete ruin while keeping the Abaddon alternative in a note.
