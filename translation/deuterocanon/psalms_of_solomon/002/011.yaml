  validation: swete_direct
translation:
  text: For no one on earth has done what they did.
  philosophy: dynamic
lexical_decisions:
- source_word: ὅτι
  chosen: For
  alternatives:
  - because
  lexicon: BDAG
  rationale: Introduces the grounds or explanation for the preceding statement; 'For' fits natural English while preserving the causal force.
- source_word: οὐκ ... πᾶς ἄνθρωπος
  chosen: no man
  alternatives:
  - not every man
  - no human being
  lexicon: BDAG
  rationale: With negation, the phrase is most naturally rendered as a universal negative in English. 'No man' preserves the singular masculine-generic form of the Greek in line with the project's gender-accurate policy.
- source_word: ἐποίησεν
  chosen: has done
  alternatives:
  - did
  lexicon: BDAG
  rationale: English present perfect conveys a completed act with present relevance and reads naturally in this comparative claim.
- source_word: ἐπ' αὐτῆς
  chosen: against her
  alternatives:
  - upon her
  - on her
  lexicon: BDAG
  rationale: Given the hostile context, the prepositional phrase is best expressed idiomatically as action directed against the city, rather than merely location upon it.
- source_word: ὅσα ἐποίησαν
  chosen: what they did
  alternatives:
  - the things they did
  - as much as they did
  lexicon: BDAG
  rationale: This preserves the comparative sense without over-literal awkwardness. 'What they did' is the clearest natural equivalent.
