id: PSA.105.18
reference: Psalms 105:18
source:
  edition: WLC
  text: עִנּ֣וּ בַ/כֶּ֣בֶל רגלי/ו בַּ֝רְזֶ֗ל בָּ֣אָה נַפְשֽׁ/וֹ׃
translation:
  text: They hurt his feet with shackles; he was put in irons[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “his soul came into iron”; the Hebrew may refer to his whole person or, more concretely, his throat or neck.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנּוּ
  chosen: They hurt
  alternatives:
  - They humbled
  - They oppressed
  - They hurt
  lexicon: HALOT
  rationale: With Joseph’s feet as the object and shackles as the means, the Piel describes pain or suffering inflicted on them; “hurt” is natural English.
- source_word: בַכֶּבֶל
  chosen: with shackles
  alternatives:
  - in fetters
  - with a chain
  - with bonds
  lexicon: HALOT
  rationale: כבל denotes a fetter or shackle. 'Shackles' is clear modern English and fits the instrumental sense with the prefixed ב.
- source_word: רַגְלָיו
  chosen: his feet
  alternatives:
  - his legs
  lexicon: HALOT
  rationale: The dual/plural form with suffix refers naturally to Joseph's feet; 'feet' is the standard and most precise rendering in context.
- source_word: בַּרְזֶל
  chosen: iron
  alternatives:
  - an iron collar
  - iron chains
  lexicon: HALOT
  rationale: The noun literally means 'iron.' The phrase is difficult, and the Hebrew does not explicitly supply 'collar' or 'chains,' so the main text keeps the more literal 'iron' while allowing interpretation through a footnote.
- source_word: בָּאָה
  chosen: came upon
  alternatives:
  - entered
  - came into
  lexicon: HALOT
  rationale: The verb בוא, feminine singular agreeing with נַפְשׁוֹ, is best rendered 'came upon' here in idiomatic English, expressing the onset of iron bondage or suffering.
- source_word: נַפְשׁוֹ
  chosen: his soul
  alternatives:
  - his neck
  - his life
  - his person
  lexicon: HALOT
  rationale: נפש often means 'soul, life, self.' In this difficult poetic line, retaining 'soul' preserves the Hebrew imagery and avoids importing a more interpretive reading into the main text. Because some understand the term here concretely as 'neck' or broadly as 'person,' that alternative is preserved in a footnote.
- source_word: בַּרְזֶל בָּאָה נַפְשׁוֹ
  chosen: he was put in irons
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This conveys the contextual sense of iron confinement without deciding whether נַפְשׁ refers to the person, soul, or throat/neck; the note preserves that uncertainty.
