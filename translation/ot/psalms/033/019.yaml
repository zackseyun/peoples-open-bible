  rationale: Here נַפְשָׁם concerns the lives of the plural persons threatened by death and famine, as the parallel clause confirms. “Their lives” gives the contextual sense naturally and avoids the misleading English implication of a single shared immaterial “soul.” No note is needed for this straightforward contextual rendering.
