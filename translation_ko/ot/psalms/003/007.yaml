base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/007.yaml
  text: Rise up, Yahweh; save me, my God. For you have struck all my enemies on the jaw[a]; you have broken the teeth of the wicked.
  footnotes:
  - marker: a
    text: Or “on the cheek.” The Hebrew word can mean “jaw” or “cheek.”
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나소서, 야훼여. 나를 구원하소서, 나의 하나님이여. 주께서 나의 모든 원수의 뺨을 치셨고[a] 악인들의 이를 부수셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 나의 모든 원수의 턱을 치시고 악인들의 이를 부수셨습니다.’ 히브리어 완료형 동사들은 완료된 행동으로 이해할 수 있으며, לֶחִי는 ‘뺨’ 또는 ‘턱’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא אִירָא
  english_pob_choice: I will not fear
  chosen_korean: 두렵지 않습니다
  alternatives_korean:
  - 두려워하지 않겠습니다
  - 무서워하지 않겠습니다
  lexicon: HALOT
  rationale: 미완료형의 결심/미래적 뉘앙스를 한국어에서 자연스럽게 드러내기 위해 ‘두렵지 않습니다’로 옮겼습니다. 시편의 고백체 문맥에서 현재형 부정으로 확신을 표현하는 것이 가장 자연스럽습니다.
- source_word: מֵרִבְבֹת עָם
  english_pob_choice: myriads of people
  chosen_korean: 사람들의 수만 명
  alternatives_korean:
  - 사람들의 만만
  - 무수한 사람들
  - 사람들의 무리
  lexicon: HALOT
  rationale: רִבְבֹת는 문자적으로 ‘만 단위의 무리들’을 가리키므로, 전통적 관용어보다 수량 이미지를 살리는 ‘수만 명’을 택했습니다. ‘사람들’은 עָם의 기본 의미를 직접 반영합니다.
- source_word: שָׁתוּ עָלָי סָבִיב
  english_pob_choice: have set themselves all around me
  chosen_korean: 사방으로 나를 에워싸도
  alternatives_korean:
  - 사방으로 나를 둘러섰어도
  - 내게 맞서 사방으로 둘러섰어도
  - 사방으로 나를 포위해도
  lexicon: HALOT
  rationale: סָבִיב의 둘러싼 이미지를 ‘사방으로’로 살리고, שָׁתוּ의 ‘자리를 잡다/배치되다’는 뜻을 적대적 포위 상황에서 자연스러운 ‘에워싸다’로 옮겼습니다. עָלָי의 대립성은 문맥상 내포되므로 본문은 공간 이미지를 유지했습니다.
theological_decisions:
- issue: 적대적 포위의 표현을 한국어에서 어떻게 처리할지
  chosen_reading: 전면 충돌을 전면에 내세우기보다, 포위·압박의 공간 이미지를 살린 ‘사방으로 나를 에워싸도’로 옮겼습니다.
  alternative_readings:
  - 내게 맞서 사방으로 둘러섰어도
  - 사방에서 나를 공격해도
  rationale: 히브리어 본문은 עָלַי와 סָבִיב로 적대성을 드러내지만, 핵심 이미지는 ‘사방으로 둘러싼 상태’입니다. 본문이 허용하는 범위 안에서 공간적 긴장을 보존했습니다.
  doctrine_reference: 시편 3편의 신뢰 고백 구조
