  meaning_decisions:
  - source_phrase: τὴν τοῦ φατινώματος κρυπτὴν θύραν
    prior_rendering: the hidden door of the smoke chamber
    new_rendering: the hidden door in the ceiling
    rationale: The architectural noun denotes a paneled or coffered ceiling, not a smoke chamber; the opening allows the priests to attack from above.
  - source_phrase: βάλλοντες πέτρους συνεκεραύνωσαν τὸν ἡγεμόνα
    prior_rendering: they threw stones and struck down the leader
    new_rendering: hurled stones down, crushing the leader
    rationale: The stones are the means of the violent killing, not an action separate from it; 'crushing' carries the verb’s force without suggesting literal lightning.
  - source_phrase: μέλη ποιήσαντες καὶ τὰς κεφαλὰς τοῖς ἔξω παρρίψαντες
    prior_rendering: after cutting him into pieces, they threw the heads to those outside
    new_rendering: they dismembered the bodies and flung the heads to those outside
    rationale: The plural heads imply multiple victims, whereas supplying only 'him' creates an unexplained singular-plural clash; the note makes the contextual inference explicit.
