id: PSA.49.19
reference: Psalms 49:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תָּ֭בוֹא עַד דּ֣וֹר אֲבוֹתָ֑י/ו עַד נֵ֝֗צַח לֹ֣א יִרְאוּ אֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/019.yaml
  text: You will go to the generation of his fathers[a]; they will never see the light.
  footnotes:
  - marker: a
    text: 'The Hebrew shifts in person and number: “you will go,” “his fathers,” and “they will never see.” The plural refers to the dead whom he joins.'
    reason: grammar_note
translation:
  language: ko
  text: 그는 자기 조상들의 세대에 이르게 되고[a], 그들은 영원토록 빛을 보지 못할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 동사에는 인칭·수의 긴장이 있습니다. 기록된 형태는 ‘너는 이르게 될 것이다’라는 2인칭 남성 단수이지만, 문맥에서는 앞 절의 부유한 사람을 가리켜 ‘그는’으로 이해하기도 합니다. 후반 동사는 3인칭 남성 복수입니다.
    reason: alternative_reading
  - marker: b
    text: ‘빛을 보다’는 생명을 경험한다는 뜻으로도 쓰이는 히브리어 표현입니다. 여기서는 죽은 이들이 이 세상의 생명으로 다시 돌아오지 못함을 가리킵니다. ‘조상들의 세대’는 ‘조상들의 무리’로도 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: נַפְשׁוֹ
  english_pob_choice: his soul
  chosen_korean: 그의 영혼
  alternatives_korean:
  - 그 자신
  - 그의 생명
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 단순히 ‘그 자신’이라는 뜻으로 풀 수도 있지만, POB가 ‘his soul’을 유지한 것을 따라 ‘영혼’으로 옮겨 히브리어의 표현력을 보존했습니다.
- source_word: יְבָרֵךְ
  english_pob_choice: blesses itself
  chosen_korean: 자신을 축복하며
  alternatives_korean:
  - 자신을 칭찬하며
  - 자신을 복되다 여기며
  lexicon: HALOT
  rationale: 동사의 반사적 의미를 드러내기 위해 직역적 구조를 유지하되, 한국어에서는 ‘축복하다’보다 ‘자신을 축복하다’가 더 자연스러워 그렇게 옮겼습니다.
- source_word: וְיוֹדֻךָ
  english_pob_choice: they praise you
  chosen_korean: 사람들이 … 당신을 찬양합니다
  alternatives_korean:
  - 사람들이 … 당신께 감사드립니다
  - 사람들이 … 당신을 높입니다
  lexicon: HALOT
  rationale: יָדָה의 문맥상 사회적 승인/찬양의 뜻을 살려 ‘찬양합니다’로 옮겼고, 복수 주어는 POB의 무정관 ‘they’에 맞춰 ‘사람들이’로 풀었습니다.
- source_word: תֵיטִיב לָךְ
  english_pob_choice: when you do well for yourself
  chosen_korean: 당신이 자신을 위해 잘될 때
  alternatives_korean:
  - 당신이 번영할 때
  - 당신이 스스로에게 유익할 때
  lexicon: HALOT
  rationale: יָטַב의 ‘잘되다/번영하다’의 폭을 살리면서, לָךְ의 반사적·이익 귀속 의미를 ‘자신을 위해’로 분명히 했습니다.
theological_decisions:
- issue: ‘당신’의 인칭과 시편의 일반적 서술 방식
  chosen_reading: 시편의 교훈적 진술로서 일반인을 가리키는 2인칭을 자연스럽게 살려 ‘당신’으로 옮겼습니다.
  alternative_readings:
  - ‘너’로 더 직접적으로 옮기기
  - ‘그’로 비인칭화하기
  rationale: 원문과 POB 모두 2인칭을 유지하므로, 한국어에서도 독자를 향해 말하는 듯한 효과를 보존하는 편이 적절합니다.
  doctrine_reference: 시편 49편의 지혜시적 경고 구조
- issue: ‘영혼’과 ‘자신’의 긴장
  chosen_reading: 문장 첫머리에서는 ‘영혼’을 유지하고 뒤에서는 반사적 의미를 한국어로 풀어, מקור의 표현성과 의미를 함께 살렸습니다.
  alternative_readings:
  - 전면적으로 ‘그 자신’으로 통일하기
  - 전면적으로 ‘영혼’으로 직역하기
  rationale: נֶפֶשׁ의 어휘적 질감을 지우지 않으면서도, 한국어 독자가 뜻을 오해하지 않도록 균형을 잡았습니다.
  doctrine_reference: 시편의 시적 평행법과 히브리어 관용
