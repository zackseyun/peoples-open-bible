  from: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
  to: I, John, am the one who heard and saw these things. When I had heard and seen them, I fell down at the feet of the angel who was showing them to me, to worship him.
  rationale: The earlier present-progressive rendering followed participial form more closely than John's retrospective witness claim warrants. I use natural retrospective English and idiomatic 'at the feet,' while retaining worship as the act the angel rejects.
