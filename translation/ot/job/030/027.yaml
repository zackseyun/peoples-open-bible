id: JOB.30.27
reference: Job 30:27
source:
  edition: WLC
  text: מֵעַ֖/י רֻתְּח֥וּ וְ/לֹא דָ֗מּוּ קִדְּמֻ֥/נִי יְמֵי עֹֽנִי־־׃
translation:
  text: My insides boil and do not rest; days of affliction have come upon me.
  philosophy: dynamic
lexical_decisions:
- source_word: מֵעַי
  chosen: my insides
  alternatives:
  - my bowels
  - my insides
  - my heart
  lexicon: HALOT
  rationale: This is natural modern English while retaining the concrete bodily image.
- source_word: רֻתְּחוּ
  chosen: boil
  alternatives:
  - are inflamed
  - seethe
  lexicon: HALOT
  rationale: From רתח, conveying boiling or seething. 'Boil' is vivid, concise, and preserves the bodily metaphor of internal turmoil.
- source_word: וְלֹא דָמּוּ
  chosen: and do not rest
  alternatives:
  - and are not still
  - and do not cease
  - and are not silent
  lexicon: HALOT
  rationale: דמם can mean be still, be silent, or cease. In this context of internal organs/personified inward turmoil, 'do not rest' best communicates ongoing agitation in natural English while remaining close to the semantic range.
- source_word: קִדְּמֻנִי
  chosen: have come upon me
  alternatives:
  - come upon me
  - meet me
  - precede me
  lexicon: HALOT
  rationale: The personified days meet or overtake Job; this English rendering conveys that without additional volitional force.
- source_word: יְמֵי עֹנִי
  chosen: days of affliction
  alternatives:
  - days of misery
  - days of suffering
  - days of poverty
  lexicon: HALOT
  rationale: עֹנִי can denote affliction, misery, or poverty depending on context. In Job's lament, the broader sense of suffering/affliction fits best, not merely economic poverty.
