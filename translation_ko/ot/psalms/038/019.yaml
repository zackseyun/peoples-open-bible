translation:
  language: ko
  text: 나의 원수들은 살아 있고 강하며, 거짓으로 나를 미워하는 자들이 많습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘까닭 없이 나를 미워하는 자들이’. 히브리어 ‘거짓/거짓됨’은 그들의 미움이 거짓되거나 부당함을 뜻할 수 있으며, 근거 없음을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺנִי
  english_pob_choice: my iniquity
  chosen_korean: 내 죄악
  alternatives_korean:
  - 내 죄
  - 내 불의
  - 내 죄책
  lexicon: HALOT
  rationale: עָוֹן은 단순한 실수보다 도덕적 무게가 있는 죄책·죄악을 가리키므로, 한국어에서는 ‘죄악’이 문맥의 무게를 잘 살립니다.
- source_word: אַגִּיד
  english_pob_choice: I confess
  chosen_korean: 고백하오니
  alternatives_korean:
  - 드러내오니
  - 말하오니
  - 알리오니
  lexicon: HALOT
  rationale: 동사 נגד의 기본뜻은 ‘말하다/알리다/선언하다’이지만, 회개의 문맥에서는 ‘고백하다’가 의미를 자연스럽게 드러내면서도 원문의 진술 행위를 보존합니다.
- source_word: אֶדְאַג
  english_pob_choice: I am anxious
  chosen_korean: 불안합니다
  alternatives_korean:
  - 근심합니다
  - 걱정합니다
  - 마음이 괴롭습니다
  lexicon: HALOT
  rationale: דאג는 내적 염려와 불안을 가리키므로, 현대 한국어에서 가장 직접적인 대응은 ‘불안하다’입니다.
- source_word: מֵחַטָּאתִי
  english_pob_choice: because of my sin
  chosen_korean: 내 죄 때문에
  alternatives_korean:
  - 내 죄로 인해
  - 내 죄로 말미암아
  - 내 죄를 두고
  lexicon: HALOT
  rationale: מִן은 여기서 원인/사유를 나타내므로, ‘때문에’가 관계를 분명하고 자연스럽게 드러냅니다.
theological_decisions:
- issue: 회개 문맥에서 אַגִּיד의 뉘앙스를 어떻게 옮길지
  chosen_reading: ‘고백하다’로 옮겨 죄를 드러내어 인정하는 행위를 분명히 했습니다.
  alternative_readings:
  - ‘말하다’로 더 중립적으로 옮길 수 있습니다.
  - ‘선언하다’로 더 문자적으로 옮길 수 있습니다.
  rationale: 히브리어는 단순 보고보다 죄를 스스로 밝혀 내놓는 행위를 가리키며, 시편의 참회적 분위기에서 ‘고백하다’가 그 의미를 가장 잘 전달합니다.
  doctrine_reference: 번역 철학 §§1, 3, 6
- issue: ‘innuiquity/죄악’과 ‘sin/죄’의 구분
  chosen_reading: 첫 절은 ‘죄악’, 뒤 절은 ‘죄’로 구분해 반복을 살리면서도 의미의 강도를 구별했습니다.
  alternative_readings:
  - 둘 다 ‘죄’로 통일할 수 있습니다.
  - 둘 다 ‘죄악’으로 통일할 수 있습니다.
  rationale: עָוֹן과 חַטָּאת는 서로 겹치지만 같은 단어는 아니므로, 한국어에서도 어감 차이를 남겨 원문의 반복과 대비를 보존했습니다.
  doctrine_reference: 번역 철학 §§1, 6
