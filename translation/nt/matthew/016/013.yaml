  from: Now when Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
  to: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
  rationale: Removed a leading English 'Now' that was functioning as a discourse marker rather than translating an explicit source-language now-word.
- timestamp: '2026-08-27T21:08:39Z'
  adjudicator: source-audit
  reviewer_model: gpt-5.6-sol
  source_review: state/reviews/gemini/v31_full_coverage/nt/matthew/016/013.job-57102.json
  category: source_correction
  tier: 1
  from: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
  to: When Jesus came into the region of Caesarea Philippi[a], he asked his disciples[b], “Who do people say the Son of Man is?”
  rationale: In Greek narrative, verbs of speaking and asking (like ἠρώτα) are frequently placed in the imperfect tense simply to introduce speech, without necessarily implying continuous or repeated action. Translating it as a past progressive ('was asking') combined with the participle ('saying') results in a slightly clunky English phrasing that over-translates the imperfect aspect. A simple past 'asked' is more natural for this single conversational event.
