translation:
  text: At the commander’s order, Judas’s men broke camp there at once and engaged the enemy near the village of Lessaou.
  philosophy: dynamic
lexical_decisions:
- source_word: προστάξαντος
  chosen: gave the order
  alternatives:
  - commanded
  - issued orders
  lexicon: LSJ
  rationale: Aorist participle of προστάσσω, indicating the leader's directive that triggers the action. 'Gave the order' is idiomatic English and preserves the military sense.
- source_word: τοῦ ἡγουμένου
  chosen: the commander
  alternatives:
  - the leader
  - the governor
  lexicon: LSJ
  rationale: ἡγούμενος can mean leader or commander. In this military context, 'commander' best reflects the role without over-specifying a civil office.
- source_word: ἀναζεύξας
  chosen: broke camp
  alternatives:
  - set out
  - marched off
  lexicon: LSJ
  rationale: Military verb for striking camp or moving out after encampment. 'Broke camp' captures the concrete military action better than the more generic 'set out'.
- source_word: συνμίσγει
  chosen: joined battle with
  alternatives:
  - engaged with
  - came to close quarters with
  - joined with
  lexicon: LSJ
  rationale: Though literally 'mingles with,' in battle narrative it denotes engagement in combat. 'Joined battle with' preserves the martial sense without paraphrasing beyond the context.
- source_word: ἐπὶ κώμην
  chosen: near the village of
  alternatives:
  - at the village of
  - toward the village of
  lexicon: LSJ
  rationale: ἐπί with accusative can indicate movement toward or location in the vicinity depending on context. Since the clash occurs in relation to a named village, 'near the village of' is a cautious rendering that fits the narrative.
- source_word: Λεσσαού
  chosen: Lessaou
  alternatives:
  - Lessau
  rationale: Proper name transliterated from the Greek form, following the project's policy to transliterate names rather than translate them.
