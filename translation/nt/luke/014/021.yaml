  from: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
  to: When the servant returned, he reported these excuses to his master. Then the master of the house became angry and said to his servant, ‘Go out quickly into the broad streets and lanes of the city, and bring the poor, the disabled, the blind, and the lame in here.’
  rationale: The earlier decisions preserve useful distinctions between broad streets and lanes and between the different physical impairments, so those gains remain. Their recognition that κύριος denotes a human superior supports using 'master' directly rather than explaining 'lord' in a footnote.
