  alternative_readings:
  - 죽을 자들
  - 사형 선고를 받은 자들
  - 죽음에 속한 자들
  rationale: 시편의 시적 병행 구조와 히브리어 관용을 드러내기 위해 직역을 본문에 두되, 독자가 의미를 오해하지 않도록 영어 POB의 주석 취지를 반영했습니다.
