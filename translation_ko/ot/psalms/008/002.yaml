  yaml_path: translation/ot/psalms/008/002.yaml
  text: From the mouths of infants and nursing babies you have established strength[a] because of your foes, to stop the enemy and the avenger.
  footnotes:
  - marker: a
    text: Or “praise,” following the Septuagint tradition reflected in Matthew 21:16; the Hebrew text reads “strength.”
    reason: alternative_reading
translation:
  language: ko
  text: 어린아이들과 젖먹이들의 입에서 주께서는 주의 대적들 때문에 능력을 세우셨으니, 원수와 보복하는 자를 그치게 하시려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “찬양.” 칠십인역 전통과 마태복음 21:16은 이와 같이 읽지만, 히브리어 본문은 “능력”이라고 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문이 여호와 이름표인 YHWH를 직접 쓰므로, 프로젝트 기본값에 따라 음역 ‘야훼’를 사용해 언약적 고유명을 드러냈습니다.
- source_word: אֲדֹנֵינוּ
  english_pob_choice: our Lord
  chosen_korean: 우리 주여
  alternatives_korean:
  - 우리 주님
  - 우리 주인
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호칭이므로 ‘우리 주여’가 가장 자연스럽고 예배적입니다. ‘주인’은 어감이 맞지 않습니다.
- source_word: מָה אַדִּיר
  english_pob_choice: how majestic
  chosen_korean: 어찌 그리 위엄이 있습니까
  alternatives_korean:
  - 얼마나 장엄하십니까
  - 얼마나 뛰어나십니까
  lexicon: HALOT
  rationale: 감탄문의 כוח을 살리면서 אַדִּיר의 장중함과 존귀함을 ‘위엄’으로 옮겼습니다. ‘장엄하다’보다 한국어 예배문맥에서 조금 더 직접적인 경외감을 줍니다.
- source_word: הוֹדְךָ
  english_pob_choice: your splendor
  chosen_korean: 주의 영광
  alternatives_korean:
  - 주의 광채
  - 주의 위엄
  lexicon: HALOT
  rationale: הוֹד는 위엄·영광·찬란함의 뜻이 있어, 시적 평행을 살려 ‘영광’으로 옮겼습니다. 문맥상 ‘위엄’과 완전히 같게 하기보다 구별되는 반향을 남겼습니다.
theological_decisions:
- issue: 하나님 이름 YHWH의 표기
