source:
  edition: WLC
  text: יַֽחְפְּֽשׂוּ עוֹלֹ֗ת תַּ֭מְנוּ חֵ֣פֶשׂ מְחֻפָּ֑שׂ וְ/קֶ֥רֶב אִ֝֗ישׁ וְ/לֵ֣ב עָמֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/006.yaml
  text: 'They devise injustices: “We have perfected a carefully devised plot.” A person’s inner self and heart are deep.'
translation:
  language: ko
  text: 그들은 불의를 찾아냅니다. “우리는 치밀하게 꾸민 계획을 완성했다.” 각 사람의 속마음과 마음은 깊습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְחַזְּקוּ לָמוֹ
  english_pob_choice: they strengthen for themselves
  chosen_korean: 자기들끼리 굳게 세우고
  alternatives_korean:
  - 자기들을 위해 강화하고
  - 자기들에게 단단히 붙들고
  lexicon: HALOT
  rationale: חזק의 ‘강하게 하다/굳게 하다’ 의미를 살려, 악한 계획을 의도적으로 확정하는 동작으로 옮겼습니다. לָמוֹ는 문맥상 자기들 쪽을 가리키므로 ‘자기들끼리’로 자연스럽게 반영했습니다.
- source_word: דָּבָר רָע
  english_pob_choice: an evil matter
  chosen_korean: 악한 일
  alternatives_korean:
  - 악한 계획
  - 악한 사건
  - 사악한 말
  lexicon: HALOT
  rationale: דָּבָר는 ‘말’만이 아니라 ‘일/사안/문제’까지 포괄하므로, 여기서는 함정과 음모의 문맥에 맞게 넓은 의미의 ‘일’로 옮겼습니다. ‘계획’은 해석을 조금 더 좁히는 표현이라 본문에는 두지 않았습니다.
- source_word: לִטְמוֹן מוֹקְשִׁים
  english_pob_choice: hiding snares
  chosen_korean: 숨겨 놓은 올무를
  alternatives_korean:
  - 올무를 숨기려
  - 올무를 몰래 놓은
  - 함정을 감춘
  lexicon: HALOT
  rationale: טמן은 ‘숨기다, 감추다’의 핵심을 가지며, מוֹקְשִׁים은 ‘올무/함정’입니다. 한국어에서는 ‘숨겨 놓은 올무’가 동작과 상태를 함께 가장 자연스럽게 보여 줍니다.
- source_word: מִי יִרְאֶה לָּמוֹ
  english_pob_choice: Who will see them?
  chosen_korean: 누가 그것들을 보겠느냐?
  alternatives_korean:
  - 누가 그들을 보겠느냐?
  - 누가 우리를 보겠느냐?
  lexicon: HALOT
  rationale: לָמוֹ의 3인칭 복수 지시를 따라 ‘그들’보다는 바로 앞의 숨겨진 올무를 가리키는 ‘그것들’로 풀어 주었습니다. 본문은 들키지 않을 것이라는 허세를 담으므로 의문문을 그대로 살렸습니다.
theological_decisions:
- issue: 시의 압축된 3인칭 복수 대명사 처리
  chosen_reading: ‘그것들을’로 옮겨 숨겨진 올무를 직접 가리키게 했습니다.
  alternative_readings:
  - ‘그들을’로 옮겨 사악한 자들을 가리키게 할 수 있음
  - ‘우리를’로 이해하는 대안 주석 가능
  rationale: 히브리어 לָמוֹ는 3인칭 복수이며, 문맥상 직전의 ‘올무들’과 자연스럽게 연결됩니다. 동시에 일부 해석이 말하는 화자 자신을 가리키는 가능성도 존재하므로, 본문에는 그 독해를 밀어붙이지 않고 각주 없이도 읽히는 최소한의 명료성을 택했습니다.
  doctrine_reference: 시편 64편의 시적 병행법과 대명사 선행사 해석
