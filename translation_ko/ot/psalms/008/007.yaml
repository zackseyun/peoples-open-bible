  to: 공중의 새와 바다의 물고기와 바다의 길을 지나가는 모든 것을 다스리게 하셨습니다.
  rationale: 절 자체의 히브리어 열거를 정확히 반영하도록 전면 교정했습니다. ‘바다의 길을 지나가는 모든 것’은 단수 분사 עֹבֵר의 집합적 용법을 한국어로 자연스럽게 나타내며, ‘바다의 길’은 אָרְחוֹת יַמִּים의 시적 이미지를 보존합니다. ‘다스리게 하셨습니다’는 바로 앞 절에서 이어지는 통치 표현을 한국어 완결문으로 드러낸 것입니다. 기존 각주는 다른 절에 관한 것이므로 삭제했습니다.
