  category: meaning_retranslation
  from: Perhaps they will listen[a], and each man will turn from his evil way[c][b], and I will relent concerning the disaster that I am planning to bring on them because of the evil of their deeds.
  to: Perhaps they will listen and repent, each turning from their evil way. Then I will relent concerning the disaster I am planning to bring on them because of their evil deeds.
  rationale: The lexical record correctly distinguishes human turning from divine relenting and disaster from moral evil, and those distinctions are retained. Its reluctance to use “repent” rested on source-transparency rather than contextual uncertainty; the standing ruling and the chapter’s argument support making repentance explicit.
