revisions:
- from: 그리고 그들은 모두 등록으로 자기들의 모든 소유를 되찾았으며, 그래서 무엇인가를 가지고 있던 사람들은 가장 큰 두려움으로 그것을 그들에게 돌려주었습니다. 이는 큰 하나님께서 그들의 구원을 위해 위대한 일들을 완전히 행하셨기 때문입니다.[a][b]
  to: 그들 모두는 등록부[a]에 기록된 자기들의 모든 소유를 되찾았습니다. 그래서 무엇이든 가지고 있던 사람들은 지극히 두려워하며 그것을 그들에게 돌려주었습니다. 이는 위대하신 하나님께서 그들의 구원을 위하여[b] 큰일들을 온전히 이루셨기 때문입니다.
  rationale: 공식 등록 기록에서 소유물이 회복되는 문맥을 분명히 하고, 매우 큰 두려움 속의 반환 및 하나님의 완전한 구원 행위를 자연스러운 현대 합쇼체로 옮겼습니다. σωτηρία의 의미 범위와 ἀπογραφή의 행정적 모호성은 각주로 보존했습니다.
