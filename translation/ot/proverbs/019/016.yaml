id: PRO.19.16
reference: Proverbs 19:16
source:
  edition: WLC
  text: שֹׁמֵ֣ר מִ֭צְוָה שֹׁמֵ֣ר נַפְשׁ֑/וֹ בּוֹזֵ֖ה דְרָכָ֣י/ו יומת׃
translation:
  text: Whoever keeps the commandment preserves his life, but whoever is careless about his ways will die[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Masoretic marginal reading is “will die”; the written consonantal text reads “will be put to death.”
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁמֵר
  chosen: keeps
  alternatives:
  - guards
  - observes
  lexicon: HALOT
  rationale: The participle denotes guarding/keeping in an ongoing sense. 'Keeps' is idiomatic in English for obeying a commandment while still preserving the sense of careful observance.
- source_word: מִצְוָה
  chosen: the commandment
  alternatives:
  - a commandment
  - command
  lexicon: HALOT
  rationale: 'The singular noun is rendered with the English definite article for a proverbial generic sense: keeping commandment/what is commanded. ''The commandment'' preserves the weight of the Hebrew singular better than the more abstract ''command''.'
- source_word: נַפְשׁוֹ
  chosen: his life
  alternatives:
  - his soul
  - himself
  lexicon: HALOT
  rationale: In Proverbs, נֶפֶשׁ often refers to one's life or self rather than the immaterial soul in a later technical sense. 'His life' best fits the wisdom contrast with death in the second colon.
- source_word: בּוֹזֵה
  chosen: despises
  alternatives:
  - scorns
  - shows contempt for
  lexicon: HALOT
  rationale: '''Despises'' clearly conveys contempt and matches the moral force of the participle in wisdom literature.'
- source_word: דְרָכָיו
  chosen: his ways
  alternatives:
  - his conduct
  - his path
  lexicon: HALOT
  rationale: The plural 'ways' is the most direct rendering. The suffix is third masculine singular; in context it most naturally refers back to the subject ('his own ways'), i.e., one who treats his conduct with contempt. This avoids importing an explicit divine object not stated in the Hebrew.
- source_word: יומת
  chosen: will die
  alternatives:
  - will die
  - will be killed
  lexicon: HALOT
  rationale: The main text follows the Masoretic qere יָמוּת; the passive reading represented by the ketiv is retained in the footnote.
- source_word: שֹׁמֵר נַפְשׁוֹ
  chosen: preserves his life
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: With נֶפֶשׁ as object and death in the parallel colon, שׁמר denotes guarding or preserving one’s life.
- source_word: בּוֹזֵה דְרָכָיו
  chosen: is careless about his ways
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: In this construction the phrase conveys contemptuous neglect or heedlessness regarding one’s conduct; a strictly compositional rendering creates the misleading sense of disapproving of one’s own ways.
