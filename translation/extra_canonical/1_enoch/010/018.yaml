lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  chosen: In those days
  alternatives:
  - During those days
  rationale: The preposition with the demonstrative and plural noun forms a temporal expression. “In those days” preserves
    the apocalyptic time formula without importing wording from a later canonical echo.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ትትገበር
  chosen: will be cultivated
  alternatives:
  - will be worked
  - will be tilled
  - will be made
  rationale: The verb derives from the broad root meaning “do, make, work,” but with the earth as subject and planting immediately
    following, agricultural cultivation is the contextually specific sense. The passive English form reflects the Ethiopic
    verbal form.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኵላ፡ ምድር
  chosen: the whole earth
  alternatives:
  - all the land
  rationale: The phrase denotes the earth in its entirety. The surrounding restoration imagery is cosmic in scope, so “earth”
    is preferable to the geographically narrower “land.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በጽድቅ
  chosen: in righteousness
  alternatives:
  - with righteousness
  - justly
  rationale: The abstract noun retains moral and theological weight. “In righteousness” preserves the source construction
    and presents cultivation as occurring within the restored righteous order rather than merely by a fair method.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እስንታሃ
  chosen: the whole of it
  alternatives:
  - all of it
  - entirely
  rationale: In context the expression resumes the feminine singular “earth” and indicates its total extent. Because the supplied
    OCR has medium confidence and this form is potentially uncertain, the rendering is kept transparent and the uncertainty
    is noted.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ትትከል፡ ዕጸወ
  chosen: will be planted with trees
  alternatives:
  - trees will be planted throughout it
  - will be planted with plants
  rationale: The feminine singular verb continues to take the earth as subject, while ዕጸወ denotes woody plants or trees collectively.
    The English passive construction preserves both the grammar and the concrete restoration image.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ትመልእ፡ በረከተ
  chosen: filled with blessing
  alternatives:
  - be full of blessing
  rationale: The phrase depicts the earth as becoming full of divine beneficence. “Blessing” preserves the theological content
    without expanding it into prosperity or fertility alone.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
