theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Rendering צָרַעַת-related language
  chosen_reading: leprous skin disease
  alternative_readings:
  - leprosy
  - skin disease
  rationale: To avoid importing a specific modern medical diagnosis while preserving the traditional semantic field, the translation uses 'leprous skin disease.' This is a lexical-theological caution rather than a doctrinal dispute.
