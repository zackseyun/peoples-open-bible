- from: 그들은 칼의 권세에 넘겨지며[a][b] — 여우들의 몫이 됩니다.
  to: 그러나 왕은 하나님 안에서 기뻐할 것이며, 그를 두고 맹세하는 모든 이는 자랑할 것입니다. 거짓을 말하는 자들의 입은 막힐 것이기 때문입니다.
  rationale: 지정된 WLC 본문을 처음부터 번역했습니다. 접속사 וְ는 앞 절의 악인들과 대조되는 흐름을 반영해 ‘그러나’로 옮겼습니다. ‘그를 두고 맹세하는’의 ‘그’는 가장 가까운 선행사이자 통상적 성경 용례에 따라 하나님을 가리킵니다. 히브리어의 단수 ‘입’은 집합적 표현으로 한국어에서도 ‘자들의 입은’으로 유지했습니다. 초안의 모든 각주는 다른 절에 관한 것이므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:09:09Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 시편 63:11의 히브리어 본문이 아니라 앞 절(63:10)의 ‘칼’과 ‘여우들’ 이미지를 번역하고 있어, 지정된 원문과 전혀 일치하지 않습니다. 63:11은 왕의 기쁨, 하나님을 두고 맹세하는 모든 이의 자랑, 거짓말하는 자들의 입이 막힘을 말합니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 문어적 시편 문체로 자연스럽습니다. ‘하나님 안에서 기뻐하다’와 ‘그를 두고 맹세하다’는 원문의 전치사적 관계와 맹세 표현을 무리 없이 살립니다.
  terminology: אֱלֹהִים은 ‘하나님’, הַמֶּלֶךְ는 해석을 덧붙이지 않고 ‘왕’으로 옮겼습니다. יִתְהַלָּל은 문맥상 ‘자랑할 것입니다’로, דֹבְרֵי שָׁקֶר는 행위의 뉘앙스를 보존하여 ‘거짓을 말하는 자들’로 번역했습니다. בּוֹ는 문맥상 하나님을 가리키는 것으로 번역하되, 별도 교리적 확대는 하지 않았습니다.
