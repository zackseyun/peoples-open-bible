    alternatives:
    - and says
    lexicon: BDAG
    rationale: Present participle expressing attendant manner; 'saying' preserves the participial linkage without over-paraphrasing.
  - source_word: Μετανοῶ
    chosen: I am changing my ways
    alternatives:
    - I reorient
    - I repent
    - I am repenting
    - I have repented
    - I change my mind
    lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
    rationale: 'Use natural first-person dialogue for metanoo: "I am changing my ways." This expresses the speaker''s stated change of disposition and conduct, not independently verified or completed moral transformation. Preserve the separate return-to-you verb and the command to forgive.'
    doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
  - source_word: ἀφήσεις
    chosen: you shall forgive
    alternatives:
    - forgive
    - you must forgive
    - you will forgive
    lexicon: BDAG
    rationale: Future indicative used imperativally in context. 'You shall forgive' preserves the form while clearly conveying Jesus' directive. 'Must forgive' is interpretive; bare 'forgive' would flatten the Greek form.
  - source_word: αὐτῷ
    chosen: him
    alternatives:
    - that person
    lexicon: BDAG
    rationale: Dative masculine singular pronoun referring back to the offender. 'Him' matches the grammatical gender and discourse reference.
