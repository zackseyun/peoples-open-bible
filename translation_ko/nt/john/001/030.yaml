id: JHN.1.30
reference: John 1:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
  footnotes:
  - marker: a
    text: Or 'has taken precedence over me.' The Greek can express precedence or superior rank, not only temporal sequence.
    reason: lexical_alternative
  - marker: b
    text: Or 'he existed before me.' The wording likely implies Jesus’ preexistence, though the Greek states it more compactly as 'he was before me.'
    reason: alternative_reading
translation:
  language: ko
  text: 이분이 바로 내가 말한 분입니다. 「내 뒤에 한 사람이 오시는데, 그분은 나보다 앞서 계십니다[a]. 이는 그분이 나보다 먼저 계셨기 때문입니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나보다 우위에 계십니다.’ 헬라어 표현은 앞섬이나 우선성을 나타내며, 단순한 시간적 순서만을 뜻하지 않을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분이 나보다 먼저 존재하셨기 때문입니다.’ 본문은 예수님의 선재를 시사하지만, 헬라어는 이를 ‘나보다 먼저 계셨다’고 간결하게 표현합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός
  english_pob_choice: This is he
  chosen_korean: 이분 / 그 사람
  alternatives_korean:
  - 이 사람
  - 그가 바로 그 사람입니다
  lexicon: BDAG
  rationale: 지시대명사 οὗτός는 인물 식별을 위해 사용됩니다. 존중과 증언의 어조를 살리기 위해 '이분'과 '그 사람'을 결합해 공식적 식별을 제공합니다.
- source_word: ὑπὲρ οὗ
  english_pob_choice: of whom
  chosen_korean: 내가 말한
  alternatives_korean:
  - 내가 말한 사람에 관하여
  - 내가 말했던 그에 대해
  lexicon: BDAG
  rationale: 문맥상 εἶπον 뒤에 오는 관용구로 '내가 말한(그 사람)'이라는 간결한 한국어가 자연스럽습니다. ὑπέρ의 우위(precedence) 의미는 본문 전체와 각주로 보존합니다.
- source_word: ἀνὴρ
  english_pob_choice: a man
  chosen_korean: 한 사람이
  alternatives_korean:
  - 한 남자
  - 한 남성
  lexicon: BDAG
  rationale: ὁ ἀνήρ은 남성 단수를 지시합니다. 현대 한국어에서는 '한 사람이'가 자연스럽지만 원어의 남성 지시를 존중하기 위해 대안으로 '한 남자'도 가능합니다.
- source_word: ἔμπροσθέν μου γέγονεν
  english_pob_choice: has come before me / ranks before me
  chosen_korean: 나보다 앞서 있습니다
  alternatives_korean:
  - 나보다 앞선 상태가 되었습니다
  - 나보다 우위에 섰습니다
  lexicon: BDAG
  rationale: γέγονεν의 완료적 상태와 ἔμπροσθεν의 '앞에 있음/우위' 의미를 반영해 현재 결과 상태를 나타내는 '나보다 앞서 있습니다'로 번역했습니다. 과도한 신학적 해석은 각주로 처리합니다.
- source_word: πρῶτός μου ἦν
  english_pob_choice: he was before me
  chosen_korean: 나보다 먼저 있었습니다
  alternatives_korean:
  - 나보다 먼저 존재했습니다
  - 나보다 앞서 계셨습니다
  lexicon: BDAG
  rationale: πρῶτός의 우선성·시간적 우위를 영어 POB가 보인 대로 '먼저 있었다'의 모호성을 살려 번역했습니다. 이는 예수의 선재(선존성)를 함축하지만 원문이 과도하게 규정하지 않으므로 한국어도 그 긴장을 남깁니다.
theological_decisions:
- issue: Final clause and Christ's preexistence (πρῶτός μου ἦν)
  chosen_reading: 나보다 먼저 있었습니다 (원문이 표현하는 시간적·우위적 긴장을 유지)
  alternative_readings:
  - 그가 나보다 먼저 존재했습니다 (직설적 선재 강조)
  - 그가 나보다 우위에 섰습니다 (위계적 우위 강조)
  rationale: 요한 복음의 문맥은 예수의 선재를 강하게 시사하지만 헬라어 문구 자체는 '먼저 있었다'라는 간결한 진술에 그칩니다. 번역은 원문이 제공하는 신학적 긴장(시간적 우위와 등급적 우위를 동시에 열어 둠)을 보존하도록 '나보다 먼저 있었습니다'로 처리했습니다.
  doctrine_reference: Affirmations; Translation philosophy §3 Preserve theological tension rather than resolve it
