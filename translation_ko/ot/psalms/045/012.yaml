base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/012.yaml
  text: The daughter of Tyre, with a gift[b], and the rich among the people will seek your favor[a].
  footnotes:
  - marker: a
    text: Literally “your face”; in this construction the Hebrew means to seek someone’s favor or entreat that person.
    reason: idiom
  - marker: b
    text: Or “with an offering” or “with tribute”; מִנְחָה can denote a gift, offering, or tribute.
    reason: lexical_alternative
translation:
  language: ko
  text: 두로의 딸도 예물을 가지고 올 것이며,[a] 백성 가운데 부한 자들이 당신의 은총을 구할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예물’(히브리어 מִנְחָה)은 문맥에 따라 ‘선물’, ‘공물’, 또는 ‘제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 얼굴’입니다. 히브리어 관용구는 상대의 은총을 구하거나 간청한다는 뜻입니다.
    reason: lexical_alternative
