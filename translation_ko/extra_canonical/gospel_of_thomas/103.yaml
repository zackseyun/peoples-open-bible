  - 영역
  rationale: 이 말씀은 도둑의 침입이라는 비유 속에서도 토마스가 즐겨 쓰는 왕국 어휘를 의도적으로 사용하므로, 이를 중화하지 않고 드러내는 편이 본문의 신학적 긴장을 유지합니다.
