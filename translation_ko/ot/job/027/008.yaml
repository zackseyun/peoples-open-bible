  source_fidelity: 수정이 필요합니다. חָנֵף는 단순히 도덕적으로 ‘악한 자’라기보다 하나님을 경외하지 않는 자를 가리키므로 ‘경건하지 않은 자’가 더 가깝습니다. 또한 יִבְצָע의 해석은 난해하지만, 본문은 그 사람이 이득을 얻는 경우(또는 얻었음)를 전제하고 하나님이 그의 생명을 거두시는 때에 남는 소망을 묻습니다. 초안의 ‘또 그가 이익을 얻을 때에 무엇이 남겠습니까?’는 질문을 중복하고 두 종속절의 관계를 불필요하게 재구성합니다.
  naturalness: ‘…얻는다 해도, …거두실 때 그에게 무슨 소망이 있겠습니까?’는 현대 표준어 합쇼체로 자연스럽고, 히브리어의 수사적 질문과 양보적 뉘앙스를 무리 없이 반영합니다.
  terminology: תִּקְוָה는 ‘소망’, אֱלוֹהַּ는 ‘하나님’, נַפְשׁוֹ는 이 문맥에서 ‘그의 생명’으로 옮기는 것이 적절합니다. חָנֵף는 본문 의미를 좁히지 않도록 ‘경건하지 않은 자’로 하고 ‘위선자’를 각주 대안으로 둡니다.
