translation:
  text: Iron will offer no protection, nor will they put on armor to protect their chests[a]. Copper will be of no use for it, and lead will be of no use for it and will have no value[b]; nor will lead be desired.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The wording about wearing armor is uncertain; what “it” refers to in the next sentence is also unclear.
    reason: alternative_reading
  - marker: b
    text: The Ge’ez verb translated “have no value” is unclear. The two occurrences of “lead” translate different words for lead-like metals.
    reason: alternative_reading
