translation:
  text: And Jechonias son of Jeelus, of the sons of Israel, cried out and said to Ezra, “We have sinned against the Lord,
    and foreign women from the nations of the land have dwelt among us[a]; and now there is still hope for all Israel[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek says that foreign women 'have dwelt'; the expression is not silently replaced with 'we have married'.
    reason: alternative_reading
  - marker: b
    text: The Greek final clause, literally something like 'and now all Israel is above,' is difficult. 'There is still hope
      for all Israel' is a contextual interpretation, not the literal wording.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνήσας
  lemma: φωνέω
  chosen: cried out
  alternatives:
  - called out
  - spoke up
  lexicon: LSJ
  rationale: The participle from φωνέω conveys raising the voice or calling aloud. 'Cried out' preserves the public, urgent
    force better than the flatter 'said' or 'spoke.'
- source_word: Ἰεχονίας Ἰεήλου
  chosen: Jechonias son of Jeelus
  alternatives:
  - Jechonias, of Jeelus
  - Jehoniah son of Jehiel
  rationale: The Greek expression is rendered 'Jechonias son of Jeelus' in this unit. The selected Greek, not an approximate
    cross-reference, controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: τῶν υἱῶν Ἰσραήλ
  chosen: of the sons of Israel
  alternatives:
  - of the Israelites
  - from the sons of Israel
  lexicon: LSJ
  rationale: A relatively formal rendering preserves the Greek phrase and its genealogical flavor. 'Sons of Israel' is retained
    rather than flattening to 'Israelites,' since the phrase marks covenant identity.
- source_word: ἡμάρτομεν εἰς τὸν κύριον
  chosen: We have sinned against the Lord
  alternatives:
  - We sinned against the Lord
  lexicon: LSJ
  rationale: The idiom means sinning against someone. 'Have sinned' reflects the Greek aorist in natural English within direct
    speech and matches the confessional tone.
- source_word: γυναῖκες ἀλλογενεῖς
  chosen: foreign women
  alternatives:
  - women of another people
  - alien women
  lexicon: LSJ
  rationale: ἀλλογενής denotes one of another race/people, here in the context of intermarriage. 'Foreign women' is clear
    modern English and fits the social-religious context without archaic wording.
- source_word: ἐκ τῶν ἐθνῶν τῆς γῆς
  chosen: from the nations of the land
  alternatives:
  - from the peoples of the land
  - from the Gentile peoples of the land
  lexicon: LSJ
  rationale: ἔθνη can mean nations or peoples. 'Nations of the land' stays close to the Greek while preserving the contrast
    with Israel. 'Gentile' would import later Christian associations not required here.
- source_word: κατῴκησαν
  chosen: have dwelt among us
  alternatives:
  - have settled
  - have lived
  lexicon: LSJ
  rationale: The Greek expression is rendered 'have dwelt among us' in this unit. The selected Greek, not an approximate cross-reference,
    controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: καὶ νῦν ἔστιν ἐπάνω πᾶς Ἰσραήλ
  chosen: and now there is still hope for all Israel
  alternatives:
  - and now all Israel is above
  - and now there is something remaining for all Israel
  lexicon: LSJ
  rationale: The Greek expression is rendered 'and now there is still hope for all Israel' in this unit. The selected Greek,
    not an approximate cross-reference, controls the active rendering; any prior lexicon label is historical, not a new consultation.
