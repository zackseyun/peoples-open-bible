  rationale: שׁוֹאָה는 파멸·황폐·재난의 뜻이 있으므로, 여기서는 생명을 겨냥한 의도를 드러내는 동사구로 자연스럽게 옮겼습니다.
- source_word: יְבַקְשׁוּ נַפְשִׁי
  english_pob_choice: who seek my life
  chosen_korean: 내 생명을 찾아
