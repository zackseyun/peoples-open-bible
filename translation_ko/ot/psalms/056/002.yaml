  naturalness: 수정문은 현대 표준 한국어와 합쇼체에 자연스럽습니다. ‘헐떡이며 뒤쫓습니다’는 שָׁאֲפוּ의 생생한 추격 이미지를 보존하면서도 한국어 문장으로 무리 없이 읽힙니다.
  terminology: ‘원수들’은 שׁוֹרְרַי의 적대적 대상을 정확히 나타냅니다. מָרוֹם은 논쟁적·압축적인 표현이므로 본문에서는 ‘높은 곳에서’로 공간적 이미지를 보존하고, ‘지극히 높으신 이여’ 및 ‘교만하게’라는 대안 해석을 각주로 남깁니다.
