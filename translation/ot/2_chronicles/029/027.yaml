theological_decisions:
- issue: Rendering the divine name יהוה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Sense of שִׁיר יְהוָה
  chosen_reading: the song of Yahweh
  alternative_readings:
  - the song to the LORD
  - the song for the LORD
  rationale: The Hebrew construct is preserved in the main text to avoid resolving whether the phrase emphasizes possession, dedication, or direction. Because English readers may hear ambiguity differently, an alternative is preserved in a footnote.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
