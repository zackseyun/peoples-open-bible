  rationale: 여성 단수 대명사의 지시를 바로잡고, 불과 삼의 실에 관한 비유를 원문에 맞게 회복했습니다. לָהּ의 관계적 기능은 본문에서 ‘그녀를 위해’로 옮기되 각주에서 가능한 뉘앙스를 밝혀 불확실성을 보존했습니다. ‘줄들’은 원문의 재질 비특정성을 유지합니다.
