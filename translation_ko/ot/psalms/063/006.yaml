lexical_decisions:
- source_word: חֵלֶב וָדֶשֶׁן
  english_pob_choice: fat and richness
  chosen_korean: 기름기와 풍성함
  alternatives_korean:
  - 기름진 음식과 풍성함
  - 기름과 풍요
  lexicon: HALOT
  rationale: 두 명사의 병렬이 육체적 풍요와 넉넉함의 이미지를 함께 내포하므로, 한국어에서는 ‘기름기’와 ‘풍성함’으로 구체성과 풍요감을 함께 살렸습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 내 생명
  - 나 자신
  lexicon: HALOT
  rationale: 시편의 내적 갈망과 만족을 표현하는 문맥이므로 ‘영혼’이 가장 자연스럽고, 히브리어 네페쉬의 인격적 내면을 잘 보존합니다.
- source_word: שִׂפְתֵי רְנָנוֹת
  english_pob_choice: with lips of joyful songs
  chosen_korean: 즐거운 노래의 입술로
  alternatives_korean:
  - 기쁨의 입술로
  - 환호의 입술로
  lexicon: HALOT
  rationale: 직역하면 ‘기쁨의 외침/노래의 입술’이므로, ‘즐거운 노래’로 노래·찬양의 소리를 드러내면서도 ‘입술’의 신체적 이미지를 유지했습니다.
- source_word: יְהַלֶּל פִּי
  english_pob_choice: my mouth praises you
  chosen_korean: 내 입은 … 당신을 찬양합니다
  alternatives_korean:
  - 내 입이 … 찬양합니다
  - 내 입은 … 찬양할 것입니다
  lexicon: HALOT
  rationale: 히브리어에는 대상어가 생략되어 있지만 문맥상 하나님을 가리키므로 한국어에서는 바로 이해되도록 ‘당신을’ 보충했고, 시적 현재를 반영해 ‘찬양합니다’로 옮겼습니다.
theological_decisions:
- issue: 본문의 생략된 찬양 대상 보충
  chosen_reading: 한국어 본문에 ‘당신을’을 넣어 하나님께 직접 드리는 찬양임을 분명히 했습니다.
  alternative_readings:
  - 대상을 드러내지 않고 ‘내 입은 찬양합니다’로 둘 수 있음
  rationale: 히브리어는 목적어를 명시하지 않지만, 시편 전체가 하나님께 드리는 직접 خطاب이므로 한국어에서는 문맥상 필수인 대상을 보충하는 편이 의미를 더 정확히 전달합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
- issue: 시적 미완료형의 시제
  chosen_reading: ‘만족합니다’, ‘찬양합니다’의 현재형으로 옮겼습니다.
  alternative_readings:
  - ‘만족할 것입니다’, ‘찬양할 것입니다’
  rationale: 히브리어 미완료형은 시에서 현재적·습관적 뉘앙스를 띨 수 있으므로, 현재형이 화자의 현재 경험과 찬양의 생동감을 가장 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
