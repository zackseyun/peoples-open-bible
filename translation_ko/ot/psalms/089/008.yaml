    issue: 절 내용 불일치
    rationale: 현 번역은 시편 89:7의 히브리어 내용과 어휘(בְּסוֹד קְדֹשִׁים, נַעֲרָץ, סְבִיבָיו)를 반영하지만, 검토 대상 원문은 시편 89:8입니다. 89:8에는 만군의 하나님, 야훼/야, 능하심, 신실하심이 나옵니다.
  - severity: high
    issue: 현 각주와 어휘 결정이 대상 원문에 부합하지 않음
    rationale: 소집단/거룩한 이들에 관한 각주와 אֵל, נַעֲרָץ, בְּסוֹד קְדֹשִׁים, עַל־כָּל־סְבִיבָיו 관련 결정은 89:8 원문에 존재하지 않는 어휘를 대상으로 합니다.
  - severity: low
    issue: 짧은 신명 יָהּ의 구별 필요
    rationale: 같은 절에서 יְהוָה와 יָהּ가 함께 쓰이므로, 번역에서 ‘야훼’와 ‘야’를 구별하고 후자를 각주로 설명하는 것이 원문의 형태적 구별을 보존합니다.
