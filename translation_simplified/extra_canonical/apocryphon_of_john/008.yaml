translation:
  language: en
  text: '1. Then the Perfect Human came forth from the Foreknowledge of the Perfect Mind. This happened through the revealed will of the unseen Spirit and of the Self-Generated One. He was the first revelation—the truth.


    2. The virgin Spirit named him Pigera-Adamas and appointed him over the first eternal realm[a], together with the Mighty One—the Self-Generated One, Christ—by Armozel, the first light, accompanied by Armozel’s powers.


    3. The unseen Spirit gave Pigera-Adamas spiritual strength that could not be overcome.


    4. Then he honored and praised the unseen Spirit, saying, “Because of you, the All came into being, and to you the All will return.


    5. I will praise and honor you, the Self-Generated One, the three eternal realms—the Father, the Mother, and the Son—and the perfect power.”


    6. He also appointed his son Seth over the second eternal realm, before Oroiel, the second light. Within the third eternal realm, Seth’s seed[b] was appointed over Daveithai, the third light. The souls of the holy ones were placed there.


    7. The souls placed in the fourth eternal realm did not know the Fullness. They did not reorient[r1] at once but remained unwilling to reorient for a time and reoriented later.


    8. These are the fourth light, Eleleth.[c]


    9. These are beings who praise the unseen Spirit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source term is “aeon,” which here refers to an eternal spiritual realm.
    reason: simplification_note
  - marker: b
    text: “Seed” may mean Seth’s offspring, lineage, or a group identified with Seth; the text does not specify further.
    reason: lexical_alternative
  - marker: c
    text: The POB reads, “These are the fourth light, Eleleth”; the exact referent of “these” is uncertain.
    reason: source_note
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
