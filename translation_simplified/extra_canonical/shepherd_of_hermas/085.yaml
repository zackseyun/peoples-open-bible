translation:
  text: 'We first examined the black stones. They were just as they had been when taken out of the building.
    The shepherd ordered them taken away from the tower and set apart.


    2. Next he examined the scabby stones. He cut many of them and told the virgins to lift them and put
    them into the building. They placed them inside the tower’s building. He told them to put the rest
    with the black stones, because these too were black.


    3. Next he examined the cracked stones. He cut many and told the virgins to carry them into the building.
    They were put outside because they were sounder. The rest had too many cracks to be cut, so they were
    rejected from the tower’s building.[a]


    4. Next he examined the chipped stones. Many were black, and some had large cracks. He ordered these
    put with the rejected stones. He cleaned and cut the others, then ordered them placed in the building.
    The virgins lifted them and fitted them inside the tower’s building, because they were weaker.


    5. Next he examined the stones that were half white and half black. Many were black. He ordered these
    taken away with the rejected stones. All the others were found white. The virgins lifted them and
    fitted them into the building because they were white.[b] They were sound, so they were placed outside
    to support those inside. Nothing at all had been chipped from them.


    6. Next he examined the hard, rough stones. A few were too hard to cut, so they were rejected. The
    rest were cut. The virgins lifted them and fitted them inside the tower’s building, because they were
    weaker.[c]


    7. Next he examined the spotted stones. Very few had become black. These were rejected with the rest.
    The others were bright and sound.[d] The virgins fitted them into the building. They were placed outside
    because they were strong.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: '“Many cracks” follows the working Greek multitude reading and the sense of both printed Latin
      traditions. The older apparatus reports Athos as thickness; Lake1907 PlateXI line45 prints multitude
      with a question mark. Alternative: “The rest could not be cut because of the thickness of their
      cracks.” The uncertain diplomatic reading does not amount to a decisive fresh manuscript-letter
      collation.'
  - marker: b
    reason: textual_variant
    text: This white/found/lifted/fitted sentence lies inside daggers in the working Greek. “White,” “were
      found and,” and the repeated “virgins” are bracketed editorial additions. Both printed Latin traditions
      support the sense that all remaining stones were white, lifted and fitted into the tower, but do
      not settle the exact disturbed Greek wording. This draft provisionally translates the repaired sense;
      the Greek crux and its critical marks remain unresolved in the source.
  - marker: c
    reason: textual_variant
    text: “Lifted by the virgins” is bracketed in the working Greek and is retained as an editorial addition.
      The source distinguishes inside weaker stones from outside stones supporting them; the draft does
      not reverse these placements.
  - marker: d
    reason: textual_variant
    text: “Sound” follows the printed conjecture. The apparatus reports Athos with a word meaning “those.”
      The draft retains the declared working adjective, without claiming unanimous Greek support.
