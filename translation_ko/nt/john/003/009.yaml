  source_fidelity: 본문 번역은 ἀπεκρίθη, εἶπεν αὐτῷ, ταῦτα, δύναται, γενέσθαι를 충실히 반영합니다. ‘이런 일들이 어떻게 일어날 수 있습니까?’는 복수 지시와 가능성의 물음을 자연스럽게 살립니다.
  naturalness: 합쇼체는 적절합니다. 다만 ‘그에게’를 ‘대답하여’ 앞에 두면 현대 한국어 문장 흐름이 더 자연스럽습니다.
  terminology: ‘니고데모’는 한국어 성경 전통에 맞는 통용 표기입니다. γίνομαι의 대안 번역은 ‘있을 수 있습니까?’로 제시할 수 있으나, 각주 설명에서 영어 번역 논의를 언급하고 ‘여러 번역가능성’이라고 한 표현은 한국어 각주로 부자연스럽고 불필요하게 메타적입니다.
