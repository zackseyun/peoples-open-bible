  from: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
  to: And a scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
  rationale: In Koine Greek, 'εἷς' frequently functions as an indefinite article ('a' or 'a certain') rather than a strict numeral. Translating it as 'one' can sound slightly unnatural in English by falsely implying a contrast (e.g., 'one scribe, as opposed to two'). 'A scribe' or 'A certain scribe' better captures the Greek idiom without losing the specificity.
