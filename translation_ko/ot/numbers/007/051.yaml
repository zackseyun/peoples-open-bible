  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: ko
  text: 수소 한 마리, 숫양 한 마리, 한 살 된 수컷 어린양 한 마리를 번제물로 드립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר + בֶּן בָּקָר
  english_pob_choice: one bull from the herd
  chosen_korean: 소 한 마리
  alternatives_korean:
  - 송아지 한 마리
  - 수소 한 마리
  lexicon: HALOT
  rationale: פַּר와 בֶּן־בָּקָר는 제물 목록에서 큰 우제류 한 마리를 가리키므로, 한국어에서는 자연스럽고 과도하게 좁히지 않는 '소 한 마리'로 옮겼습니다.
- source_word: אַיִל
  english_pob_choice: one ram
  chosen_korean: 숫양 한 마리
  alternatives_korean:
  - 양 한 마리
  - 어른 수양 한 마리
  lexicon: HALOT
  rationale: אַיִל은 제의 문맥에서 성체 수양을 뜻하므로, '숫양'이 의미를 가장 분명하게 드러냅니다.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  english_pob_choice: one male lamb a year old
  chosen_korean: 한 살 된 숫양 새끼 한 마리
  alternatives_korean:
  - 한 살 된 숫양 한 마리
  - 일 년 된 어린 양 한 마리
  lexicon: HALOT
  rationale: כֶּבֶשׂ와 'a year old'의 결합은 어린 양의 연령 조건을 붙인 표현이므로, '한 살 된 … 새끼'로 연령과 어린 짐승의 뉘앙스를 함께 살렸습니다.
- source_word: לְעֹלָה
  english_pob_choice: for a burnt offering
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제로
  - 번제 헌물로
  lexicon: HALOT
  rationale: עֹלָה는 전소 제사를 가리키므로, 제물 목록에 맞는 간결한 한국어 제사어 '번제물로'를 사용했습니다.
theological_decisions:
- issue: 제사 항목을 나열하는 어순과 문체
  chosen_reading: 히브리어의 간결한 목록 구조를 따라 항목별로 짧게 병렬하고, 서술어는 맨 끝에 두었습니다.
  alternative_readings:
  - 문장형으로 풀어 쓰는 방식
  - 각 항목에 조사와 수식을 더 늘리는 방식
  rationale: 본절은 제물 명세이므로 의미를 덧붙이기보다 항목의 수와 종류, 제사 목적을 명료하게 제시하는 쪽이 원문 기능에 가깝습니다.
  doctrine_reference: 민수기 7장 봉헌 제물 목록의 제의적 문맥
