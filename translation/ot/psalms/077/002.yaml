  from: In the day of my distress I sought the Lord[a]; my hand was stretched out in the night and did not grow numb; my soul refused to be comforted.
  to: In the day of my distress I sought the Lord; my hand[a] was stretched out at night and did not slacken; my soul refused to be comforted.
  rationale: “Did not grow numb” introduces a particular physiological outcome that פוג does not specify; “did not slacken” preserves the likely sense of weakening or relaxing. “Through the night,” however, adds durative force not explicit in לילה, which is adequately “at night.” Since the note concerns the difficult hand image, its marker should follow “hand,” rather than “Lord.”
