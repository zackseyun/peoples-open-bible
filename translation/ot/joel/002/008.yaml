  from: No man crowds his brother; each goes on his own path. Though they fall through the weapon[a], they do not break ranks.
  to: No one jostles another; each advances along his own course. They plunge through the weapons and are not halted[a].
  rationale: The documented alternatives acknowledge both the difficult weapon clause and the possible sense “not stopped.” I favor that reading in the movement toward the city's complete penetration in verse 9, while retaining the current formation-based understanding as an alternative.
