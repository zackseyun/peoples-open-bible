translation:
  text: But those who are complete in faith ask for all things, having put their trust in the Lord, and they receive, because they ask without doubting, not being at all double-minded. For every double-minded man, unless he reorients[r1], will be saved with difficulty.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
