translation:
  text: 'The virgins carried the stones in the positions they had taken around the gate. Those who seemed
    strong went under the stone’s corners. The others went under its sides. This was how they carried
    every stone. They brought them through the gate as ordered and handed them to the men at the tower.
    The men took them and built with them.


    2. The tower was built on the great rock and above the gate. The ten stones were fitted together.
    They filled the whole rock and became the tower’s foundation. The rock and the gate supported the
    whole tower.[a]


    3. After the ten stones, twenty-five more came up from the depth.[b] The virgins carried them like
    the first ones, and they were fitted into the tower’s building. Next came thirty-five, which were
    fitted into the tower in the same way. Then forty more came up. All were put into the building. These
    made four courses in the tower’s foundations.[c]


    4. Stones stopped rising from the depth. The builders paused briefly. The six men again told the crowd
    to bring stones from the mountains for the tower’s building.


    5. The men cut stones of different colors from all the mountains and handed them to the virgins. The
    virgins carried them through the gate and handed them over for the tower’s building. Once placed in
    the building, the different stones all became white and alike. Their varied colors changed.


    6. The men handed some stones into the building themselves. These did not become bright. They stayed
    as they had been when put there. They had not been handed over by the virgins, and they had not been
    brought through the gate. These stones looked out of place in the tower’s building.[d]


    7. The six men saw the stones that looked out of place. They ordered them removed and taken down to
    the place they came from.[e]


    8. They told the men bringing stones, “Do not hand stones into the building yourselves. Put them beside
    the tower. Let the virgins carry them through the gate and hand them into the building. The stones
    cannot change color unless these virgins carry them through the gate. So do not work in vain.”[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The clause “filled the whole rock, and became” is a bar-marked insertion in the working Greek,
      reported absent from Athos by similar endings; it is supplied with versional support. “Rock and
      the” before gate is separately bracketed. Printed Palatina (1877), p. 203 has rock-filling and both
      supports; Greek edition (1877), p. 202 also brackets the added clause. Michigan’s lost leaf covers
      this passage. No continuous preserved Greek agreement is claimed.
  - marker: b
    reason: textual_variant
    text: '“Twenty-five” follows the printed version-supported conjecture. The 1891 apparatus reports
      Athos twenty and Ethiopic fifteen. Alternatives: “After the ten stones, another twenty stones came
      up from the depth”; “After the ten stones, another fifteen stones came up from the depth.” Michigan’s
      lost leaf covers this number, so is not used to settle it.'
  - marker: c
    reason: textual_variant
    text: The four-courses sentence is a bar-marked insertion in the working Greek, supplied with versional
      support and absent from Athos as reported. It remains an explicit reconstruction. The four narrated
      groups are ten, twenty-five, thirty-five and forty under the declared working choice; their later
      explanation is not inserted into this scene.
  - marker: d
    reason: textual_variant
    text: '“Or brought through the gate” follows Athos in the working source. Michigan’s published transcription
      at Bonner, p. 122 has a shorter corresponding reason without that separate clause, though its later
      conditional passage does mention the gate. Alternative reason: “For they had not been handed over
      by the virgins.” The damaged papyrus has many supplied letters; this is a scoped edition-mediated
      comparison, not a new complete image collation.'
  - marker: e
    reason: textual_variant
    text: “Down” is bracketed in the working Greek. The draft retains it as an editorial addition, without
      claiming it survives in every witness.
  - marker: f
    reason: textual_variant
    text: The two repeated “they say” expressions are bracketed in the working Greek and represented by
      the continuing quotation. Michigan’s corresponding first instruction differs in grammar and is damaged
      after an eight-line gap. Bonner’s proposed participle and command are reconstructions, not a complete
      preserved sentence. The draft retains the declared working instruction and does not silently replace
      it with a new continuous papyrus reconstruction.
