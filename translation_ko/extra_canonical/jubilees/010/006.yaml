review_pass:
  verdict: revise
  source_fidelity: 영어 POB의 의미 단위를 충실히 반영하되, 본문은 관련 상위 원문 기록에 포함되어 있고 제시된 게에즈어 구절은 10:6 자체의 직접 대조에는 제한이 있습니다. 초안의 ‘멸하지 못하게’는 영어의 ‘bring corruption upon’(해를 끼치고 타락하게 하다)을 ‘멸하다’로 과도하게 좁혔으므로 수정이 필요합니다. ‘심판하시는 곳’도 ‘place of judgment’의 장소 명사를 하나님이 심판하시는 행위로 바꾸므로 ‘심판의 장소’가 적절합니다.
  naturalness: 초안은 문장부호가 없고 ‘가두어 … 가두사’가 반복되며, 호격과 청원 종결의 연결이 불안정합니다. 현대 표준어 합쇼체 기도문 문체로 문장을 나누고 ‘붙들어 두시며’, ‘허락하지 마옵소서’를 사용하면 자연스럽습니다.
  terminology: ‘감시자들’은 Watchers의 전통적 명칭으로 유지할 수 있습니다. ‘영혼들’보다 본문의 spirits에 일관되게 ‘영들’을 쓰는 편이 자연스럽습니다. ‘악한’은 malignant를 충분히 반영하며, ‘멸망시키기 위해’는 created in order to destroy의 목적을 보존합니다.
  issues:
  - severity: high
    issue: ‘그들로 주의 종의 아들들을 멸하지 못하게’
    rationale: 영어 POB의 ‘do not let them bring corruption upon’은 단순한 물리적 멸절보다 해악·타락을 초래함을 뜻합니다. ‘해를 끼치거나 타락시키지 못하게’로 옮겨 의미 범위를 보존해야 합니다.
  - severity: medium
    issue: ‘심판하시는 곳’
    rationale: ‘place of judgment’는 심판이 이루어지는 장소를 가리킵니다. 현재 표현은 하나님이 그곳에서 심판한다는 뜻으로 읽힐 수 있으므로 ‘심판의 장소’로 고칩니다.
  - severity: medium
    issue: ‘가두어 심판하시는 곳에 가두사’의 반복 및 문장부호 부재
    rationale: 원문의 imprison them and hold them fast를 한국어에서 반복 없이 ‘가두시고 굳게 붙들어 두시며’로 자연스럽게 옮기고, 호격·청원·진술을 문장으로 구분해야 합니다.
  revised_text: 또한 당신께서는 이 영들의 아버지인 당신의 감시자들이 내 시대에 어떻게 행했는지 알고 계십니다. 나의 하나님이여, 살아 있는 이 영들을 가두시고 심판의 장소에 굳게 붙들어 두시며, 그들이 당신의 종의 아들들에게 해를 끼치거나 타락시키지 못하게 하옵소서. 이들은 악한 자들이며 멸망시키기 위해 창조되었기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “당신의 종의 아들들이여, 나의 하나님이여, 이들은 …”
    reason: 영어 POB 감사 추적에 기록된 호격의 다른 연결 가능성을 보존합니다.
  revision_rationale: ‘부패를 가져오다’의 의미를 해악과 타락으로 풀어 초안의 ‘멸하다’가 만든 의미 축소를 피했습니다. Watchers와 spirits의 용어를 각각 ‘감시자들’과 ‘영들’로 일관되게 유지하고, 현대 합쇼체의 기도·청원 문체에 맞추어 문장 구조와 문장부호를 정비했습니다. 대안적 호격 연결은 각주로만 제시하여 본문을 불필요하게 확정하지 않았습니다.
