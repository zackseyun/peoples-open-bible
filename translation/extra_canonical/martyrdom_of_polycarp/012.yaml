    Then he said to him again, ''I will cause thee to be consumed by fire, if thou despisest the wild beasts, unless thou repent.'' But Polycarp said; ''Thou threatenest that fire which burneth for a season and after a little while is quenched: for thou art ignorant of the fire of the future judgment and eternal punishment, which is reserved for the ungodly. But why delayest thou? Come, do what thou wilt.'''
translation:
  text: 'Then the proconsul said, “I have wild beasts here, and I will throw you to them unless you reconsider[a].” But he said, “Call for them, for a change of mind from better to worse is a change not permitted to us. But it is a noble thing to change from wrongdoing to righteousness.”


    Then he said to him again, “I will have you consumed by fire if you despise the wild beasts, unless you reconsider.” But Polycarp said, “You threaten me with a fire that burns for a time and is quenched after a little while, for you are ignorant of the fire of the future judgment and eternal punishment that is reserved for the ungodly. But why do you delay? Come, do what you will.”'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - Provisional rendering based on the supplied public-domain English witness.
  - Direct review of the Greek manuscript tradition remains pending.
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Retain regret for the arrest and reconsider/change of mind for the demand to abandon faith; repentance toward God would reverse the direction of the scene. This reader text remains an adaptation of the recorded English witness, not a verbatim quotation or a newly verified translation of the ancient-language text. The witness is unchanged.
    reason: lexical_alternative
