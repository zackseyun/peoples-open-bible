  to: 하나님[a], 주의 보좌는 영원무궁합니다. 주의 왕국의 홀은 공의의 홀입니다.
  rationale: 제공된 WLC 본문을 직접 번역했습니다. כִּסְאֲךָ אֱלֹהִים은 주된 호격 읽기에 따라 ‘하나님, 주의 보좌는’으로 옮겼고, עוֹלָם וָעֶד의 지속성을 ‘영원무궁합니다’로 나타냈습니다. 둘째 행은 정관·소유 한정된 ‘주의 왕국의 홀’을 주어로 하여 한국어 문장으로 자연스럽게 구성했습니다. 기존 초안의 화살 관련 본문과 각주는 다른 절의 것이므로 의미를 변경한 것이 아니라 절 대조 오류를 바로잡기 위해 전면 교체했습니다.
