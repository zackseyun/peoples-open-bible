  text: וַ/יִּשְׁמַ֤ע הָ/עָם֙ הַ/חֹנִ֣ים לֵ/אמֹ֔ר קָשַׁ֣ר זִמְרִ֔י וְ/גַ֖ם הִכָּ֣ה אֶת הַ/מֶּ֑לֶךְ וַ/יַּמְלִ֣כוּ כָֽל יִ֠שְׂרָאֵל אֶת עָמְרִ֨י שַׂר צָבָ֧א עַל יִשְׂרָאֵ֛ל בַּ/יּ֥וֹם הַ/ה֖וּא בַּֽ/מַּחֲנֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/016.yaml
  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: ko
  text: 그리고 그곳에 진을 치고 있던 백성이 “시므리가 반역했고 왕도 죽였다”라는 말을 들었습니다. 그러자 온 이스라엘이 그날 진영에서 오므리—이스라엘의 군대 사령관—를 왕으로 세웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  english_pob_choice: the people who were camped there
  chosen_korean: 그곳에 진을 치고 있던 백성
  alternatives_korean:
  - 거기에 진을 친 백성
  - 그곳에 진영을 친 사람들
  lexicon: חנה
  rationale: 군사적 맥락의 ‘진을 치다’를 살리되, POB의 ‘camped there’에 맞춰 위치를 분명히 했습니다.
- source_word: קָשַׁר זִמְרִי
  english_pob_choice: Zimri has conspired
  chosen_korean: 시므리가 반역했고
  alternatives_korean:
  - 시므리가 모반했고
  - 시므리가 음모를 꾸몄고
  lexicon: קשר
  rationale: קשר는 단순한 음모보다 왕권에 대한 반역·모반의 뉘앙스가 강해, 서술의 정치적 성격을 드러내는 ‘반역’으로 옮겼습니다.
- source_word: שַׂר צָבָא עַל־יִשְׂרָאֵל
  english_pob_choice: the commander of the army over Israel
  chosen_korean: 이스라엘의 군대 사령관
  alternatives_korean:
  - 이스라엘 군대의 지휘관
  - 이스라엘 위에 있는 군대의 지휘관
  lexicon: שר צבא
  rationale: 직역을 유지하되 한국어에서 자연스럽고 위계가 분명한 관직 표현인 ‘군대 사령관’으로 처리했습니다.
- source_word: וַיַּמְלִכוּ
  english_pob_choice: made ... king
  chosen_korean: 왕으로 세웠습니다
  alternatives_korean:
  - 왕으로 삼았습니다
  - 왕으로 옹립했습니다
  lexicon: מלך
  rationale: 피동적 즉위가 아니라 백성이 주도해 왕권을 부여한 행위를 드러내기 위해 ‘세우다’를 사용했습니다.
theological_decisions:
- issue: ‘all Israel’의 범위와 정치적 의미
  chosen_reading: 온 이스라엘이 오므리를 왕으로 세웠습니다
  alternative_readings:
  - 이스라엘 모든 지파가 오므리를 왕으로 세웠습니다
  - 온 이스라엘이 오므리를 왕으로 삼았습니다
  rationale: 본문은 북왕국 전체의 정치적 결집을 서술하므로, 지파를 특정하지 않고 ‘온 이스라엘’로 유지해 서술의 범위를 과장하지 않았습니다.
  doctrine_reference: 본문 역사 서술의 정치적 범위 보존
