  from: Then Daniel was brought in before the king. The king answered and said to Daniel[a], “Are you that Daniel, one of the exiles of Judah, whom the king my father brought from Judah?”
  to: Then Daniel was brought before the king. The king said to him, “Are you that Daniel, one of the exiles of Judah, whom my predecessor[a], the king, brought from Judah?
  rationale: The earlier choices aptly render the exile idiom and preserve the king’s recognitional 'that Daniel.' I keep both, but translate the documented royal sense of 'my father' directly rather than leaving the possible biological misunderstanding in the main text.
