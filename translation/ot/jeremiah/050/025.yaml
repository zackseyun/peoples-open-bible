  from: Yahweh has opened his storehouse and brought out the weapons of his wrath[d][c][b][a], for this is a work of the Lord GOD of Armies in the land of the Chaldeans.
  to: Yahweh has opened his armory and brought out the weapons of his wrath, for the Lord Yahweh of hosts has work to do in the land of the Chaldeans.
