base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/023.yaml
  text: Jesus said to you, “I will choose you, one out of a thousand and two out of ten thousand, a single one; they will stand, and they will stand as a single one.”
  footnotes:
  - marker: you
    text: The Coptic uses the form ⲧⲏⲛⲉ, a Lycopolitan/regional variant of the standard Sahidic second-person plural pronoun ⲧⲏⲩⲧⲛ.
    reason: dialect_note
  - marker: they will stand
    text: The text shifts abruptly from the second person ('I will choose you') to the third person ('they will stand'). This grammatical shift is present in the Coptic and has been preserved.
    reason: textual_variant
  - marker: a single one
    text: Coptic ⲟⲩⲁ ⲟⲩⲱⲧ. A key theological concept in Thomas, referring to the spiritual integration of duality into unity.
    reason: theological_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “나는 너희[a] 가운데서 천 명 중 하나와 만 명 중 둘을 선택하겠습니다. 그들은[b] 서 있을 것이며, 하나, 곧 단 하나일 것입니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어는 표준 사히드어 2인칭 복수 대명사 ⲧⲏⲩⲧⲛ의 리코폴리탄(리코폴리스) 방언형인 ⲧⲏⲛⲉ를 사용합니다.
    reason: dialect_note
  - marker: b
    text: 본문은 ‘너희를 선택하겠다’라는 2인칭에서 ‘그들은 서 있을 것이다’라는 3인칭으로 갑자기 전환됩니다. 이 문법적 전환은 콥트어 본문에 그대로 있습니다.
    reason: textual_variant
  - marker: c
    text: 콥트어 ⲟⲩⲁ ⲟⲩⲱⲧ은 문자적으로 ‘하나, 단 하나’라는 반복적 강조 표현입니다. 여기서는 이를 ‘하나, 곧 단 하나’로 옮겼습니다.
    reason: terminology_note
lexical_decisions:
- source_word: ⲧⲏⲛⲉ / 너희
  english_pob_choice: you
  chosen_korean: 너희
  alternatives_korean:
  - 여러분
  - 당신들을
  lexicon: Crum dialectal pronoun variant; POB note on second-person plural
  rationale: 콥트어의 2인칭 복수형을 반영해 복수 호칭인 ‘너희’로 옮겼습니다. 예수의 직접 발화를 합쇼체 안에서 자연스럽게 유지합니다.
- source_word: ⲥⲱⲧⲡ
  english_pob_choice: choose
  chosen_korean: 선택할
  alternatives_korean:
  - 뽑을
  - 택할
  lexicon: Crum 365a
  rationale: 동사의 핵심 의미는 ‘선택하다’이므로 직역에 가깝게 ‘선택할’로 옮겼습니다. ‘뽑다’보다 구별·택정의 뉘앙스를 더 잘 살립니다.
- source_word: ϣⲟ / ⲧⲃⲁ
  english_pob_choice: thousand / ten thousand
  chosen_korean: 천 명 / 만 명
  alternatives_korean:
  - 천 / 만
  - 천 사람 / 만 사람
  lexicon: Crum 546b; Crum 398b
  rationale: 수사 표현을 한국어 자연어로 옮기되 ‘명’을 보충해 사람을 가리키는 수량 표현임을 분명히 했습니다.
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  english_pob_choice: a single one
  chosen_korean: 하나뿐인 하나
  alternatives_korean:
  - 한 사람
  - 오직 하나
  - 단 하나
  lexicon: Crum 492b
  rationale: 토마스복음에서 반복되는 통일성 표현을 약화시키지 않기 위해 단순히 ‘하나’로 풀지 않고, 단일성과 배타성을 함께 드러내는 ‘하나뿐인 하나’로 옮겼습니다.
- source_word: ⲱϩⲉ ⲉⲣⲁⲧⲟⲩ
  english_pob_choice: stand
  chosen_korean: 서 있을
  alternatives_korean:
  - 설
  - 자리를 지킬
  lexicon: Crum 534a
  rationale: 관용구의 기본 의미는 ‘서다’이므로 ‘서 있을’로 번역했습니다. 문맥상 자세를 묘사하는 동작을 그대로 유지합니다.
theological_decisions:
- issue: ⲟⲩⲁ ⲟⲩⲱⲧ의 단일성 표현
  chosen_reading: ‘하나뿐인 하나’로 반복해 단일성과 통합의 긴장을 살렸습니다.
  alternative_readings:
  - ‘한 사람’으로 완화
  - ‘연합된 하나’로 해석
  rationale: 이 표현은 토마스복음의 중요한 신학어이므로 단순한 인원수로 축소하지 않았습니다. 본문이 말하는 ‘하나 됨’의 압축감을 한국어에서도 최대한 보존했습니다.
  doctrine_reference: Thomasine unity motif; POB theological note on ⲟⲩⲁ ⲟⲩⲱⲧ
- issue: 동사 시제와 문장 전환
  chosen_reading: ‘나는 너희를 선택할 것입니다’ 뒤에 ‘그들은 서 있을 것이며’로 2인칭에서 3인칭으로의 급전환을 그대로 보존했습니다.
  alternative_readings:
  - 주어를 매끈하게 통일
  - 의미를 풀어 주어 전환 완화
  rationale: 콥트어 본문에 있는 인칭 전환을 삭제하면 원문의 문법적 긴장과 표면적 불연속이 사라집니다. POB의 문헌적 충실성을 따라 이를 보존했습니다.
  doctrine_reference: Textual preservation / grammatical shift in source
