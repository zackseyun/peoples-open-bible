  from: And when the nation was raging at the proposal and speaking against it[a], they considered it utterly dreadful if those who had entrusted their deposits to the sacred treasury should be deprived of them[b], since
  to: The nation was outraged by this announcement and protested. They considered it utterly dreadful that those who had entrusted their deposits to the sacred treasury should be deprived of them, and as
