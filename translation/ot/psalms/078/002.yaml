id: PSA.78.2
reference: Psalms 78:2
source:
  edition: WLC
  text: אֶפְתְּחָ֣ה בְ/מָשָׁ֣ל פִּ֑/י אַבִּ֥יעָה חִ֝יד֗וֹת מִנִּי קֶֽדֶם־׃
translation:
  text: I will open my mouth with a wisdom saying[a]; I will utter riddles[b] from ancient times—
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew term can denote a proverb, parable, or instructive figurative saying.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term includes enigmatic sayings whose meaning requires reflection.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְתְּחָה
  chosen: I will open
  alternatives:
  - I open
  - let me open
  lexicon: HALOT
  rationale: Qal imperfect/cohortative-like form of פתח with first person singular; in poetic parallelism it naturally carries a volitional-future sense, best rendered 'I will open.'
- source_word: בְּמָשָׁל
  chosen: with a saying
  alternatives:
  - with a proverb
  - in a proverb
  - in a saying
  lexicon: HALOT
  rationale: Retains the broad figurative/wisdom sense without false genre precision.
- source_word: פִּי
  chosen: my mouth
  alternatives:
  - my speech
  lexicon: HALOT
  rationale: Literal 'my mouth' is idiomatic and natural in English here; it preserves the Hebrew concrete expression rather than abstracting to 'my speech.'
- source_word: אַבִּיעָה
  chosen: I will utter
  alternatives:
  - I will pour forth
  - I will speak
  - I will declare
  lexicon: HALOT
  rationale: The Hiphil of נבע conveys causing to gush forth, hence figuratively 'utter' or 'pour forth.' 'Utter' is concise, idiomatic, and preserves the sense of spoken expression.
- source_word: חִידוֹת
  chosen: riddles
  alternatives:
  - dark sayings
  - enigmas
  lexicon: HALOT
  rationale: חִידָה commonly means riddle or enigmatic saying. 'Riddles' is the most direct lexical equivalent. Because 'dark sayings' is a traditional rendering with interpretive value, it is preserved in a footnote.
- source_word: מִנִּי קֶדֶם
  chosen: from ancient times
  alternatives:
  - from ancient times
  - from the beginning
  lexicon: HALOT
  rationale: Natural English for the phrase’s reference to antiquity.
