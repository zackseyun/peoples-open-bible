  to: And a horse will walk up to its chest in the blood of sinners, and chariots will sink up to their tops.
  rationale: 'The Ge''ez verb የሐውር (yaḥawwer) explicitly means ''will walk'' or ''will go'' (from ሐወረ), not just ''will be.'' Furthermore, እንግድዓ (enged''ā) means ''chest'' or ''breast'' (Leslau, CDG 32), not ''bridle'' (which would be ልጓም, legwām). The draft improperly harmonizes the anatomical term with the ''bridles'' (χαλινῶν) of Revelation 14:20. | Adjudicator: The reviewer is entirely correct on both lexical points. The Ge''ez noun እንግድዓ (enged''ā) means ''chest'' or ''breast,'' not ''bridle'' (which would be ልጓም, legwām). The current rendering improperly harmonize'
