  source_fidelity: 히브리어의 כי(이유를 나타내는 접속사), ‘그의 관리들/고관들’(שָׂרָיו), ‘그의 사절들’(מַלְאָכָיו), 소안과 하네스라는 지명, 그리고 하네스에 이르는 동작(יַגִּיעוּ)을 충실히 반영합니다. ‘그의’의 선행사를 본절 안에서 불필요하게 특정하지 않아 문맥상 지시의 여지도 보존합니다.
  naturalness: “그의 관리들은 소안에 있으며, 그의 사절들은 하네스에 이릅니다”는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽고, 예언서의 간결한 진술 방식에도 맞습니다.
  terminology: ‘관리들’은 שָׂרָיו의 행정·정치적 직위를 현대적으로 전달하며, ‘사절들’은 여기서 인간 파견자를 뜻하는 מַלְאָכָיו에 적절합니다. ‘소안’과 ‘하네스’의 음역도 일관되고 무난합니다.
