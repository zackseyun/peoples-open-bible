  text: And he opened his treasury and gave wages to his forces for a year, and he commanded them to be ready for every need for a year.
translation:
  language: ko
  text: 그는 자신의 금고를 열어 자신의 군대에 일 년분의 급료를 주고, 그들에게 일 년 동안 모든 필요에 대비해 준비하고 있으라고 명령했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ γαζοφυλάκιον
  english_pob_choice: treasury
  chosen_korean: 금고
  alternatives_korean:
  - 보물고
  - 창고
  - 국고
  lexicon: γαζοφυλάκιον
  rationale: 성전 용어가 아니라 재정을 보관하는 장소를 가리키므로, 현대 한국어에서 가장 직접적이고 과장되지 않은 ‘금고’로 옮겼습니다.
- source_word: ὀψώνια
  english_pob_choice: wages
  chosen_korean: 삯
  alternatives_korean:
  - 품삯
  - 급료
  - 월급
  lexicon: ὀψώνια
  rationale: 군대에 지급되는 보수를 가리키므로, ‘급료/월급’보다 원문의 대가성·지급성을 살릴 수 있는 ‘삯’을 선택했습니다.
- source_word: ταῖς δυνάμεσιν αὐτοῦ
  english_pob_choice: his forces
  chosen_korean: 자기 군대
  alternatives_korean:
  - 그의 군세
  - 그의 병력
  - 그의 부대들
  lexicon: δύναμις
  rationale: 여기서 δύναμις는 추상적 ‘능력’이 아니라 실제 전투 집단을 뜻하므로, 자연스러운 한국어 군사 표현인 ‘군대’로 옮겼습니다.
- source_word: πᾶσαν χρείαν
  english_pob_choice: every need
  chosen_korean: 모든 필요
  alternatives_korean:
  - 모든 필요 사항
  - 각종 필요
  - 필요한 모든 것
  lexicon: χρεία
  rationale: 원문의 포괄적 필요를 유지하기 위해 직역에 가까운 ‘모든 필요’를 사용했습니다.
theological_decisions:
- issue: 1년 반복 표현의 처리
  chosen_reading: ‘일 년 치 삯’과 ‘일 년 동안’으로 두 차례의 ἐνιαυτόν을 분명히 살렸습니다.
  alternative_readings:
  - 문맥상 한 번만 ‘일 년’으로 줄이는 번역
  - ‘1년분 급료’처럼 하나로 합치는 번역
  rationale: 원문은 지급 기간과 대비 기간을 각각 강조하므로, 두 번의 시간 표현을 분리해 유지하는 편이 본문 효과를 더 정확히 전달합니다.
  doctrine_reference: 본문 맥락 보존 원칙
