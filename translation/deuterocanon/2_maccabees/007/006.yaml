translation:
  text: The Lord God is watching, and he truly has compassion on us, just as Moses declared in the song that bears witness against the people to their faces[a], when he said, “And he will have compassion on his servants[b].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: See Deuteronomy 31:19–21, where Moses’ song is given to stand as a witness against Israel.
    reason: cross_reference
  - marker: b
    text: Deuteronomy 32:36.
    reason: cross_reference
lexical_decisions:
- source_word: ἐφορᾷ
  chosen: is watching
  alternatives:
  - looks on
  - sees
  - keeps watch over
  lexicon: LSJ
  rationale: The present tense suggests active, ongoing observation. “Is watching” preserves the vividness better than the flatter “sees,” while avoiding overinterpretation such as protective oversight.
- source_word: ταῖς ἀληθείαις
  chosen: in truth
  alternatives:
  - truly
  - by the truths
  - with true things
  lexicon: LSJ
  rationale: The dative plural is somewhat idiomatic here. “In truth” communicates the adverbial force naturally in English without forcing an awkward literal plural such as “by the truths.”
- source_word: παρακαλεῖται
  chosen: is being moved to compassion
  alternatives:
  - is comforted
  - is exhorted
  - is appeased
  - takes pity
  lexicon: LSJ
  rationale: In this context, confirmed by the quotation that follows (παρακληθήσεται), the verb carries the sense of relenting or being moved with pity toward his people, not receiving comfort. “Is being moved to compassion” preserves the passive form and the emotional nuance.
- source_word: καθάπερ
  chosen: just as
  alternatives:
  - even as
  - as
  lexicon: LSJ
  rationale: “Just as” gives a clear comparative link between the present claim and the scriptural citation.
- source_word: διεσάφησεν
  chosen: made clear
  alternatives:
  - explained clearly
  - declared plainly
  - set forth
  lexicon: LSJ
  rationale: The verb denotes clarifying or making something explicit. “Made clear” is concise and natural.
- source_word: κατὰ πρόσωπον
  chosen: openly
  alternatives:
  - to the face
  - face to face
  - plainly
  lexicon: LSJ
  rationale: In the phrase describing the song’s testimony, the idiom conveys directness or openness. “Openly” fits the rhetorical force in English better than a wooden “face to face.”
- source_word: ἀντιμαρτυρούσης
  chosen: that testifies
  alternatives:
  - bearing witness against
  - witnessing in opposition
  - giving counter-testimony
  lexicon: LSJ
  rationale: The participle likely echoes the biblical description of the song as a witness, with adversative force in the background. “That testifies” keeps the witness motif without overloading the English line; the stronger adversative nuance is preserved in the rationale.
- source_word: ᾠδῆς
  chosen: song
  alternatives:
  - ode
  lexicon: LSJ
  rationale: “Song” is the natural English equivalent and evokes the Mosaic song in Deuteronomy.
- source_word: δούλοις
  chosen: slaves
  alternatives:
  - servants
  lexicon: LSJ
  rationale: Per project guidance, δοῦλος-family terms should be rendered “slave/slaves” where bonded status is salient. In the scriptural quotation, “his slaves” preserves the literal social relation better than the softened “servants.”
- source_word: παρακληθήσεται
  chosen: will be moved to compassion
  alternatives:
  - will be comforted
  - will relent
  - will have compassion
  lexicon: LSJ
  rationale: The future passive in the citation is best understood in the Deuteronomic sense of God being moved with pity toward his people. “Will be moved to compassion” preserves both the passive form and the semantic link with the earlier παρακαλεῖται.
