  meaning: Meshech and Tubal do not share the burial of fallen warriors laid to rest with their weapons, and those warriors bear their iniquities even in death because they terrorized the living.
  meaning_decisions:
  - source_phrase: וְלֹא יִשְׁכְּבוּ אֶת גִּבּוֹרִים נֹפְלִים מֵעֲרֵלִים
    prior_rendering: And they do not lie with the mighty, the fallen from among the uncircumcised
    new_rendering: But they do not lie with the fallen uncircumcised warriors
    rationale: The military and burial context identifies the mighty as warriors. Joining “fallen” directly to “warriors” makes the relationship clear, while “uncircumcised warriors” naturally conveys the partitive sense. “But” brings out the contrast with the preceding description of Meshech and Tubal.
  - source_phrase: וַתְּהִי עֲוֺנֹתָם עַל עַצְמוֹתָם
    prior_rendering: and whose iniquities were upon their bones
    new_rendering: Their iniquities rest upon their bones
    rationale: 'The separate sentence gives the image its full force: death has not removed their iniquities. “Rest upon” makes the image intelligible without discarding the bones or narrowing iniquity exclusively to guilt or punishment.'
  - source_phrase: כִּי חִתִּית גִּבּוֹרִים בְּאֶרֶץ חַיִּים
    prior_rendering: for the terror of the mighty was in the land of the living
    new_rendering: for these warriors spread terror in the land of the living
    rationale: The surrounding verses repeatedly describe terror these nations inflicted. The new wording makes clear that the warriors caused terror, rather than experienced it, while retaining the contrast between the living world and Sheol.
