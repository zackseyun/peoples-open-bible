base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/020.yaml
  text: I gave my soul after her, and for everlasting ages I will not turn away from her. In purity I found her, and from the beginning I acquired a heart for her.
translation:
  language: ko
  text: 나는 내 영혼을 그녀를 따르는 데 바쳤습니다. 영원토록 나는 그녀에게서 돌아서지 않겠습니다. 정결함 가운데서 나는 그녀를 찾았고, 처음부터 그녀를 향한 마음을 얻었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 나 자신
  - 내 목숨
  - 나
  lexicon: נֶפֶשׁ
  rationale: 히브리어 נֶפֶשׁ을 POB의 본문 선택인 "my soul"에 맞추어 문자적으로 옮기되, 한국어에서는 자연스럽게 "내 영혼"으로 처리했습니다.
- source_word: נָתַתִּי אַחֲרֶיהָ
  english_pob_choice: I gave ... after her
  chosen_korean: 그녀를 따라 두었습니다
  alternatives_korean:
  - 그녀 뒤에 두었습니다
  - 그녀를 따랐습니다
  - 그녀를 좇아 내어 맡겼습니다
  lexicon: נתן + אחרי
  rationale: 직역하면 어색한 전치사구이므로, 대상을 향한 전적인 추종과 헌신을 드러내는 한국어로 옮겼습니다.
- source_word: בְּטָהֳרָה
  english_pob_choice: In purity
  chosen_korean: 정결함 가운데서
  alternatives_korean:
  - 순결 가운데서
  - 깨끗함 가운데서
  - 정결하게
  lexicon: טָהוֹר
  rationale: 명사형 부사구를 살리면서도 의례적·도덕적 순수의 뉘앙스를 유지하기 위해 "정결함 가운데서"로 번역했습니다.
- source_word: וְלֵב קָנִיתִי לָהּ מִתְּחִלָּתָהּ
  english_pob_choice: and from the beginning I acquired a heart for her
  chosen_korean: 처음부터 그녀를 위해 마음을 얻었습니다
  alternatives_korean:
  - 처음부터 그녀를 위한 마음을 얻었습니다
  - 처음부터 그녀를 사랑하는 마음을 얻었습니다
  - 처음부터 그녀에게 마음을 두었습니다
  lexicon: לֵב + קנה
  rationale: 영어 POB의 "acquired a heart"를 따라 לֵב를 단순히 신체기관이 아니라 의지·내면의 자리로 보고, 한국어에서는 "마음을 얻었습니다"로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: פרל렐리즘이 지혜/대상에 대한 전적 헌신을 어떻게 드러내는가
  chosen_reading: '"내 영혼"과 "그녀를 따라 두었습니다"를 유지하여, 단순 감정이 아니라 인격 전체의 헌신을 드러냈습니다.'
  alternative_readings:
  - '"나 자신을 그녀에게 내주었습니다"로 의역'
  - '"그녀를 따라 제 삶을 바쳤습니다"로 확장'
  rationale: 본문의 평행구조와 지혜 추구의 전인적 성격을 보존하는 쪽이 원문 의미를 가장 잘 드러냅니다.
  doctrine_reference: 잠언적 지혜 전통의 전인적 추구
