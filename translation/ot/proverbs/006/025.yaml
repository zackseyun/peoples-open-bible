id: PRO.6.25
reference: Proverbs 6:25
source:
  edition: WLC
  text: אַל תַּחְמֹ֣ד יָ֭פְיָ/הּ בִּ/לְבָבֶ֑/ךָ וְ/אַל תִּ֝קָּֽחֲ/ךָ֗ בְּ/עַפְעַפֶּֽי/הָ־־׃
translation:
  text: Do not desire her beauty in your heart; do not let her capture you with her seductive eyes[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “with her eyelids.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמֹד
  chosen: desire
  alternatives:
  - covet
  - lust after
  lexicon: HALOT
  rationale: חמד commonly denotes desiring or coveting. 'Desire' is broad enough to preserve the inner craving sense here without importing the specifically legal/decalogue resonance of 'covet' too strongly, while avoiding the narrower sexual explicitness of 'lust after' in the main text.
- source_word: יָפְיָהּ
  chosen: her beauty
  alternatives:
  - her attractiveness
  - her fair appearance
  lexicon: HALOT
  rationale: The noun יֹפִי refers to beauty or attractiveness. 'Her beauty' is the most direct and natural rendering.
- source_word: בִּלְבָבֶךָ
  chosen: in your heart
  alternatives:
  - within your heart
  lexicon: HALOT
  rationale: לֵבָב in wisdom literature commonly denotes the inner person, including desire and intention. 'In your heart' preserves the Hebrew anthropological idiom and the internal nature of the warning.
- source_word: תִּקָּחֲךָ
  chosen: let her capture you
  alternatives:
  - be taken by her
  - be seized by her
  - let her captivate you
  lexicon: HALOT
  rationale: The feminine verb takes the addressee as object; this rendering retains that syntax and the contextual force.
- source_word: בְּעַפְעַפֶּיהָ
  chosen: with her eyelids
  alternatives:
  - with her eyelids
  - by her glances
  lexicon: HALOT
  rationale: The noun denotes eyelids; the figurative implication may be noted without replacing the image in the text.
