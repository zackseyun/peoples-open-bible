  - severity: low
    issue: ‘그의 이름’은 하나님을 가리키는 현대 한국어 존칭 표현으로 다소 어색합니다.
    rationale: 원문의 남성 단수 소유격을 존칭 대명사 ‘그분의’로 옮겨 지시 대상을 명료하게 하면서 합쇼체의 공적 문체에 맞출 수 있습니다.
