      - when I gathered
      lexicon: LSJ
      rationale: Aorist participle of συνάγω, naturally rendered as a prior action leading into the main verbs. 'After gathering'
        gives clear English sequence without over-paraphrasing.
    - source_word: ἐπὶ τὸν λεγόμενον Ποταμόν
      chosen: to the river called the River
      alternatives:
      - to the so-called River
      - to the place called the River
      - to the river named Potamos
      lexicon: LSJ
      rationale: λεγόμενον means 'called/named.' Ποταμός is literally 'River' and appears here as a place designation. Retaining
        'the river called the River' preserves the Greek wording and the likely toponymic force better than smoothing it away.
    - source_word: παρενεβάλομεν
