id: PSA.89.12
reference: Psalms 89:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צָפ֣וֹן וְ֭/יָמִין אַתָּ֣ה בְרָאתָ֑/ם תָּב֥וֹר וְ֝/חֶרְמ֗וֹן בְּ/שִׁמְ/ךָ֥ יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/012.yaml
  text: The north and the south—you created them[a]; Tabor and Hermon sing for joy in your name.
  footnotes:
  - marker: a
    text: Literally “the north and the right side”; “right side” is a geographical idiom for south.
    reason: idiom
translation:
  language: ko
  text: 북쪽과 남쪽을 주님께서 창조하셨습니다[a]. 다볼과 헤르몬은 주님의 이름으로 기뻐 노래합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘북쪽과 오른쪽을’. ‘오른쪽’은 지리적 방향을 가리켜 ‘남쪽’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기뻐 외칩니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ / שָׁמַיִם
  english_pob_choice: The heavens are yours
  chosen_korean: 하늘은 주님의 것입니다
  alternatives_korean:
  - 하늘은 주님께 속합니다
  - 하늘은 주님의 것입니다
  lexicon: HALOT
  rationale: לְךָ는 소유를 나타내므로 한국어에서는 소유관계가 자연스러운 서술격으로 옮기는 것이 좋습니다. שָׁמַיִם은 복수형의 장엄한 우주적 표현이어서 단수형 ‘하늘’로 간결하게 살리되 의미는 보존했습니다.
- source_word: אַף לְךָ אָרֶץ
  english_pob_choice: the earth also is yours
  chosen_korean: 땅도 주님의 것입니다
  alternatives_korean:
  - 땅 역시 주님의 것입니다
  - 땅도 주님께 속합니다
  lexicon: HALOT
  rationale: אַף는 ‘또한/도’의 확장·강조 기능이므로 앞 절과의 병행을 살려 ‘도’로 옮겼습니다. אָרֶץ는 여기서 ‘땅/지구’의 우주적 범위를 가리키지만, 한국어에서는 ‘땅’이 더 자연스럽고 본문의 소유 진술도 분명하게 전달합니다.
- source_word: תֵּבֵל וּמְלֹאָהּ
  english_pob_choice: The world and its fullness
  chosen_korean: 세계와 그 안에 가득한 모든 것
  alternatives_korean:
  - 세상과 그 충만함
  - 세계와 그 충만함
  lexicon: HALOT
  rationale: תֵּבֵל은 거주하는 질서 있는 세계를 가리키므로 ‘세계’로 옮겼습니다. מְלֹאָהּ는 직역하면 ‘그 충만/가득 참’이지만, 한국어에서는 ‘그 안에 가득한 모든 것’이 의미를 분명하게 드러내면서도 함의를 과장하지 않습니다.
- source_word: יְסַדְתָּם
  english_pob_choice: you founded them
  chosen_korean: 주님이 세우셨습니다
  alternatives_korean:
  - 주님이 기초를 놓으셨습니다
  - 주님이 세우셨습니다
  lexicon: HALOT
  rationale: יסד는 기초를 놓고 세우는 창조적 स्थाप立의 이미지를 담으므로 ‘세우셨습니다’가 가장 자연스럽습니다. 대상은 앞의 세계와 그 충만한 것들에 걸쳐 있으므로 한국어에서는 중복 대명사 없이 간결하게 처리했습니다.
theological_decisions:
- issue: 소유와 창조의 이중 진술
  chosen_reading: 하늘과 땅이 모두 주님께 속하며, 세계와 그 안의 충만한 것이 주님에 의해 세워졌다는 두 진술을 모두 유지했습니다.
  alternative_readings:
  - 하나님의 주권만 강조해 소유 표현을 완화하는 해석
  - 창조를 일반적 ‘존재케 하심’으로 넓혀 표현하는 해석
  rationale: 히브리어 본문은 소유 진술(לְךָ)과 창조적 기초 놓음(יְסַדְתָּם)을 함께 제시합니다. 번역은 어느 한쪽으로 평탄화하지 않고 두 의미를 그대로 보존해야 합니다.
  doctrine_reference: 시 89:12의 본문 수준의 창조-소유 진술
