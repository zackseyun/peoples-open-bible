theological_decisions:
- issue: Meaning of God's 'Spirit' in relation to humanity
  chosen_reading: Rendered as 'My Spirit' referring to God's Spirit in a general OT sense.
  alternative_readings:
  - my breath
  - my life-breath
  rationale: Spirit/breath semantics remain disputed. The possessive does not decide between God's spirit and life-giving breath; both are disclosed. Retained capitalization does not import Trinitarian specificity or establish a personal-Spirit interpretation as exclusive.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
- issue: Scope of אָדָם
  chosen_reading: Generic singular 'man' representing humankind.
  alternative_readings:
  - humankind
  - humanity
  rationale: Generic singular man is retained with a humankind note. DOCTRINE.md's adam entry allows man/humankind according to context; it does not mandate the nonexistent gender rule asserted in the older rationale.
  doctrine_reference: Translation philosophy §4; Contested terms table for אָדָם
