  meaning: The creatures’ wings were joined to one another, and each moved straight ahead without turning its body.
  meaning_decisions:
  - source_phrase: חֹבְרֹת אִשָּׁה אֶל אֲחוֹתָהּ כַּנְפֵיהֶם
    prior_rendering: Their wings were joined, each to her sister
    new_rendering: Their wings were joined to one another
    rationale: The feminine expression is a conventional reciprocal idiom, not an assertion that the wings are sisters. Direct English conveys the joining without misleading personification.
  - source_phrase: לֹא יִסַּבּוּ בְלֶכְתָּן
    prior_rendering: As they moved, they did not turn
    new_rendering: As they moved, they did not turn their bodies
    rationale: The four faces and the later description of movement in four directions indicate movement without bodily rotation, not an inability to change their direction of travel.
