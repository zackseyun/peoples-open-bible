translation:
  text: '“The fifth mountain had green plants and was rugged. Its believers are faithful, but hard to
    teach. They are stubborn and pleased with themselves. They want to know everything, but know nothing
    at all.”


    2. “Their stubbornness drove understanding away, and senseless folly entered them. They praise themselves
    for having understanding. They want to set themselves up as teachers, though they are foolish.”


    3. “Many became empty through this pride as they exalted themselves.[a] Stubbornness and empty confidence
    are a great demon. So many of these people were rejected. But some repented and believed. They recognized
    their own folly and submitted to people who have understanding.”


    4. “The others can also repent. They did not become wicked. They became foolish[b] and lacked understanding.
    If they repent, they will live to God. If they do not, they will live with the women who work evil
    against them.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: “Became empty” keeps the source’s metaphor for the outcome of self-exaltation. “Were brought
      to nothing” is an alternative; no object such as wealth or knowledge is supplied in Greek.
  - marker: b
    reason: textual_variant
    text: “Foolish” follows Hilgenfeld’s printed conjecture, with reported Latin Vulgata/Palatina comparison.
      The apparatus says Gebhardt could read the beginning of a wickedness word in damaged Athos text.
      That partial report is not a complete alternative Greek clause or unanimous support for “foolish.”
lexical_decisions:
- source_word: μετάνοια / μετανοεῖν
  chosen: repentance / repent
  alternatives:
  - regret
  - penance
  rationale: 'Reconsideration of the prior lexical rationale: this section connects repentance with pride,
    recognition of one''s own folly, belief, and submission to those with understanding. Preserve its
    conditional contrast between living to God and dwelling with the women who work evil against them.'
- source_word: δυσμαθεῖς / αὐθάδεις / ἐθελοδιδάσκαλοι
  chosen: hard to teach / stubborn / set themselves up as teachers
  alternatives:
  - slow to learn / arrogant / self-appointed teachers
  rationale: 'Reconsideration of the prior lexical decision: ἐθελοδιδάσκαλοι characterizes people who
    want to assume the teaching role themselves, not teachers selected by them. Preserve the rebuke of
    resistant self-confidence without implying an institutional appointment procedure.'
