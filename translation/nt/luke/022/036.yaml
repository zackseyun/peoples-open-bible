  from: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
  to: He said to them, “But now, whoever has a money bag must take it along, and likewise a travel bag. Whoever has no sword[a] must sell his cloak and buy one.”
