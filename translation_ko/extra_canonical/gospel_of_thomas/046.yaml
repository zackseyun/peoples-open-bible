revisions:
- from: 예수께서 말씀하셨습니다. "아담부터 세례자 요한까지, 여자에게서 난 이들 가운데서는 세례자 요한보다 더 높은 이가 없습니다. 그러므로 그의 눈이 아래로 떨구어지지 않을 것입니다. 그러나 내가 말합니다. 여러분 가운데서 누구든지 어린아이가 되면 나라를 알게 될 것이며, 요한보다 더 높아질 것입니다."[a][b][c]
  to: 예수께서 말씀하셨습니다. “아담부터 세례자 요한까지, 여자에게서 태어난 이들 가운데 세례자 요한보다[a] 더 높은 이는 없습니다. 그의 눈이 숙여지지 않도록[b] 말입니다. 그러나 나는 말하였습니다. 여러분 가운데 누구든지 어린아이가 되면 나라를 알게 될 것이며, 요한보다 더 높아질 것입니다.”[c]
  rationale: 목적·결과를 나타내는 ϩⲓⲛⲁ와 ‘나는 말하였다’라는 원문의 시상을 반영하고, ‘눈’ 관용구를 자연스러운 현대 합쇼체로 다듬었습니다. 비교 표현 및 관용구의 각주 표지를 해당 본문 위치에 재배치했습니다. 원문이 명시하지 않는 신적 소유격이나 교리적 해석은 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:18Z'
review_pass:
  verdict: revise
  source_fidelity: 대체로 원문을 충실히 옮겼으나, 접속사 ϩⲓⲛⲁ는 앞 진술의 목적·결과를 나타내므로 ‘그러므로’보다 ‘…않도록’으로 옮기는 편이 정확합니다. 또한 ⲁⲁⲛⲟⲕϫⲱⲛⲧⲟⲥ ⲇⲉ는 현재 발화인 ‘내가 말합니다’가 아니라 ‘그러나 나는 말하였습니다’에 가깝습니다.
  naturalness: ‘그의 눈이 아래로 떨구어지지 않을 것입니다’는 한국어에서 부자연스럽고, 목적절과도 잘 맞지 않습니다. ‘그의 눈이 숙여지지 않도록’은 원문의 눈-숙임 관용을 보존하면서 자연스럽습니다. 각주 표지도 해당 표현 바로 뒤에 배치했습니다.
  terminology: ‘세례자 요한’, ‘어린아이’, ‘나라’는 현대 한국어의 격식 있는 성서 번역 문맥에서 무난합니다. ⲕⲟⲩⲉⲓ는 ‘작은 이’라는 뜻도 가능하지만, 본문에서는 ‘어린아이’가 안전한 문맥적 번역입니다. ‘나라’는 원문에 없는 ‘하나님’을 보충하지 않습니다.
  issues:
  - severity: medium
    issue: ϩⲓⲛⲁ의 의미가 ‘그러므로’로 약화됨
    rationale: 이 접속사는 ‘~하도록/그래서 ~하지 않게’라는 목적·결과 관계를 나타냅니다. 한국어 번역에서도 이를 직접 드러내야 합니다.
  - severity: medium
    issue: ‘내가 말합니다’가 원문의 완료적 과거 표현을 반영하지 못함
    rationale: 사본의 ⲁⲉⲓϫⲟⲟⲥ은 ‘나는 말하였다/말해 두었다’에 해당합니다. 현재형으로 바꾸지 않는 편이 원문에 충실합니다.
  - severity: low
    issue: 눈을 ‘떨구어지다’로 표현한 문장이 부자연스러움
    rationale: 한국어에서는 눈을 ‘숙이다’ 또는 ‘내리깔다’라고 하는 것이 자연스럽습니다. 수동형 ‘숙여지지 않도록’은 원문의 눈을 주어로 삼는 형태도 유지합니다.
  - severity: low
    issue: 각주 표지가 모두 문단 끝에 몰려 있음
    rationale: 각주 a와 b는 각각 눈을 숙이는 표현 및 비교 표현에 직접 붙여 독자가 지시 대상을 분명히 알 수 있게 해야 합니다.
