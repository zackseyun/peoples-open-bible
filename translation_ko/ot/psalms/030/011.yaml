  terminology: מִסְפֵּד는 장례 의례 자체로 한정하지 않고 개인적 ‘애통’으로, מָחוֹל은 ‘춤’으로 옮겼습니다. שַׂק은 애통의 표지인 ‘굵은 베 옷’으로, שִׂמְחָה는 ‘기쁨’으로 번역했습니다. ‘띠 띠우다’는 אָזַר의 허리에 두르다/입히다의 이미지를 유지하는 문어적이되 통용되는 표현입니다.
