source:
  text: |-
    # Source page p0197 (printed 145)
    ܡܦܩܢܗ ܓܝܪ ܡܣܟܝ
    ܐܢܘܢ ܗܢܝܢ ܠܡܘ̈ܬܐ
    ܕܡܫܟܠܐ. ܗܘܘ ܕܐܝܟ
    ܐܢܘܢ. ܟܕ ܡܕܡ ܠܐ
    ܡܚܠܦܝܢ ܒܨܘܪܬܗܘܢ.
    ܐܠܐ ܐܝܟ ܕܩܒܠܬ ܗܘܬ
    ܡܦܩܐ ܠܗܘܢ. ܘܐܝܟ
    ܕܐܫܠܡܬ ܐܢܘܢ ܠܗ̇.
    ܗܟܢܐ ܐܦ ܡܩܝܡܐ
    ܠܗܘܢ. ܗܢܝܢ ܡܬܒܥܐ
    ܓܝܪ ܠܡܚܘܝܘ ܠܐܝܠܝܢ
    ܕܚܝܝܢ. ܕܚܝܘ ܡ̈ܝܬܐ.
    ܘܐܬܘ ܗܢܘܢ ܕܐܙܠܘ
    ܗܘܘ. ܘܢܗܘܐ ܟܕ
    ܕܐܬܝܕܥܘ ܚܕ ܠܚܕ
    ܐܝܠܝܢ ܕܗܫܐ ܝܕܥܝܢ. ܗܝܕܝܢ
    ܢܒܛܠ ܕܝܢ ܚܙܘܗ
    ܕܐܝܠܝܢ ܕܡܩܕܡܝܢ ܐܡܝܢ.܀.
    ܘܗܘܘ ܡܢ ܒܬܪ ܕܒܥܘ
    ܗܘ ܝܘܡܐ ܕܡܘܬܐ. ܗܝܕܝܢ
    ܡܢ ܒܬܪ ܕܝܢ ܡܬܚܘܝܘ
    ܕܡܬܚܘܝܢ. ܕܐܢܘܢ
    ܕܡܬܚܙܝܢ. ܐܦ ܠܡܒܣܡܗܘܢ
    ܕܐܝܠܝܢ ܕܡܬܕܡܝܢ.
    ܡܠܟܒܕܐ ܓܝܪ ܕܡܘܬܗܘܢ
    ܐܝܠܝܢ ܕܗܘܐ ܩܕܡܝܟܝܢ
    ܒܝܫ ܡܢ ܡܐ ܕܐܝܬܝܗ̇.
    ܚܕ ܕܢܣܒܪܘܢ ܬܫܢܝܩܐ.
    ܦ ܬܫܒܘܚܬܗܘܢ ܕܐܝܠܝܢ
    ܕܗܘܐ ܐܙܕܩܘ ܒܙܒܢܗܘܢ.
    ܘܗܠܝܢ ܕܐܝܬ ܗܘܘ ܠܗܘܢ
    ܫܘܒܠܐ ܒܚܝ̈ܝܗܘܢ.
    ܘܗܠܝܢ ܕܢܨܒܘ ܒܠܒܗܘܢ
    ܥܩܪܐ ܕܚܟܡܬܐ. ܗ̇ܢܝܢ
    ܢܬܬܥܝܪ ܐܢܗܘܢ ܒܫܘܒ̈ܚܐ.
    ܘܬܬܢܗܪ ܨܘܪܬܗܘܢ
    ܕܐܦܝ̈ܗܘܢ ܒܢܘܗܪܐ
    ܕܐܝܩܪܗܘܢ ܕܢܫܒܚܘܢ
    ܕܢܣܒܘܢ ܘܢܩܒܠܘܢ ܥܠܡܐ
    ܕܠܐ ܡܐ̇ܬ. ܗ̇ܢܝܢ ܡܠܝܢ
    ܠܗܘܢ. ܒܘܕܐ ܓܝܪ ܝܬܝܪܐܝܬ
    ܢܬܬܙܝܥܘܢ ܐܝܠܝܢ ܕܐܝܟ
    ܗ̇ܢܝܢ. ܐܠܐ ܕܐܣܠܝܘ
    ܢܡܘܣܝ̈. ܘܣܟܪܘ ܐܕܢܝ̈ܗܘܢ
    ܕܠܐ ܢܫܡܥܘܢ ܚܟܡܬܐ.
    ܘܠܐ ܢܩܒܠܘܢ ܣܘܟܠܐ.
    ܟܕ ܗܟܝܠ ܢ

    # Source page p0196 (printed 146)
    ܕܡܝܟ ܡܬܬܢܝܚܝܢ
    ܘܡܫܬܒܚܝܢ ܥܡ ܡܢܝܘܗܝ.
    ܘܡܬܚܫܒܝܢ ܬܡܢ ܘܗܠܝܢ
    ܗܠܝܢ ܒܐܝܕܐ ܕܡܠܐܟܐ
    ܘܗܢܘܢ ܓܘܡܥܐ ܕܚ̈ܛܗܐ.
    ܘܒܝܫܬܐ ܕܕܡ̈ܘܬܐ
    ܝܬܝܪܐܝܬ ܢܫܘܚܘܢ. ܠܘܩܕܡ
    ܓܝܪ ܚܙܝܢ. ܘܒܬܪܟܢ ܐܙܠܝܢ
    ܕܢܫܬܢܩܘܢ. ܐܝܠܝܢ ܕܝܢ
    ܕܐܬܦܨܝܘ ܒܥ̈ܒܕܝܗܘܢ
    ܘܐܝܠܝܢ ܕܗܘܘ ܠܗܘܢ ܢܡܘܣܐ
    ܢܡܘܣܐ ܣܒܪܐ
    ܘܣܘܟܠܐ ܬܘܟܠܢܐ ܣܘܩܒܝܐ.
    ܘܚܟܡܬܐ ܡܚܡܣܢܘܬܐ.
    ܢܬܚܙܝܢ ܠܗܘܢ ܬܡܝ̈ܗܬܐ
    ܒܙܒܢܗܝܢ. ܚܙܝܢ ܓܝܪ ܗ̇ܘ
    .6 .v ܀ ܒܥܠܡܐ ܕܠܐ ܡܬܚܙܐ
    ܠܗܘܢ. ܘܗܘܐ ܙܒܢܐ ܗ̇ܘ ܕܝܠܗܘܢ
    ܕܗܘܐ ܒܣܝܡ ܡܢܗܘܢ.
    ܘܬܘܒ ܠܐ ܢܥܘܩ ܐܢܘܢ
    ܙܒܢܐ. ܒܡܚ̈ܫܒܬܗܘܢ ܓܝܪ
    ܕܗ̇ܘ ܥܠܡܐ ܢܥ
    ܢܬܦܩܕܘܢ ܓܝܪ ܩܕܡܝܗܘܢ
    ܦܠܝ̈ܛܘܗܝ ܕܦܪܕܝܣܐ܆
    ܘܬܚܘܐ ܠܗܘܢ ܫܘܦܪܐ
    ܕܪܒܘܬܐ ܕܚܝ̈ܐ ܕܐܝܬ
    ܬܚܘܬܝܗ. ܫܒܘܥܘܗܝ
    ܚܒܝ̈ܫܐ ܕܡܠܐܟ̈ܐ ܕܐܚܝܕܝܢ
    ܗܘܘ ܒܡܫܠܛܘ. ܐܢܘܢ
    ܕܠܐ ܢܬܚܙܘܢ. ܘܐܚܝܕܝܢ
    ܒܦܘܩܕܢܐ ܐܝܟ ܕܢܩܘܡܘܢ
    ܒܕܘ̈ܟܝܬܗܘܢ ܥܕܡܐ
    ܕܬܐܬܐ ܡܕܝܢܬܗܘܢ.
    ܘܡܬܚܙܝܐ ܕܝܢ ܬܘܒ
    ܗܝܕܝܢ ܒܕܡܘܬܐ ܝܬܝܪ
    ܡܢ ܕܡܠܐܟ̈ܐ. ܢܩܒܠܘܢ
    ܓܝܪ ܩܕܡܝܐ ܠܐܚܪ̈ܝܐ.
    ܠܗܢܘܢ ܕܡܣܟܝܢ ܗܘܘ
    ܠܗܘܢ. ܘܐܚܪ̈ܝܐ ܠܐܝܠܝܢ
    ܕܫܡܥܝܢ ܗܘܘ ܕܒܓܘܗ.
    ܐܬܦܨܝܘ ܓܝܪ ܡܢ ܗܢܐ
    ܥܠܡܐ ܕܐܘܠܨܢܐ. ܘܐܢܝܚܘ
    ܡܢܗܘܢ ܛܘܥܢܐ ܕܥܩ̈ܬܐ.
    ܒܡܢܐ ܗܟܝܠ ܐܘܒܕܘ
    ܚܝܝ̈ܗܘܢ ܚ̈ܝܝܗܘܢ. ܘ
