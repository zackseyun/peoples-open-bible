id: PRO.31.10
reference: Proverbs 31:10
source:
  edition: WLC
  text: אֵֽשֶׁת חַ֭יִל מִ֣י יִמְצָ֑א וְ/רָחֹ֖ק מִ/פְּנִינִ֣ים מִכְרָֽ/הּ־׃
translation:
  text: A capable wife[a]—who can find one? Her worth is far beyond jewels.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew expression includes strength, ability, and worth. Its key word is rendered “strength” in verse 3; “wife” can also mean “woman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת
  chosen: wife of
  alternatives:
  - woman of
  lexicon: HALOT
  rationale: Construct form of אִשָּׁה with following noun. In this acrostic context introducing the ideal household figure, 'wife of' fits the marital and domestic setting better than the more general 'woman of,' while still preserving the construct relationship.
- source_word: חַיִל
  chosen: noble character
  alternatives:
  - valor
  - excellence
  - worth
  - strength
  lexicon: HALOT
  rationale: חַיִל can denote strength, valor, capability, wealth, or excellence. Here it describes the exemplary wife not primarily as a warrior but as a woman of strength, competence, and moral worth. 'Noble character' captures the composite sense in idiomatic English, though 'valor' and 'excellent' are possible more formal alternatives.
- source_word: מִי יִמְצָא
  chosen: who can find?
  alternatives:
  - who will find?
  - who may find?
  lexicon: HALOT
  rationale: The imperfect here functions rhetorically, expressing rarity rather than simple future time. 'Who can find?' is natural English for the rhetorical question and conveys the sense of exceptional scarcity.
- source_word: וְרָחֹק
  chosen: is far beyond
  alternatives:
  - is far more distant than
  - is far above
  lexicon: HALOT
  rationale: Predicate adjective meaning 'far, distant.' In context it expresses surpassing worth by comparison, so 'is far beyond' communicates comparative excellence in clear modern English.
- source_word: פְּנִינִים
  chosen: jewels
  alternatives:
  - pearls
  - rubies
  - corals
  lexicon: HALOT
  rationale: The precise referent of פְּנִינִים is debated; it denotes precious gems or costly ornaments. Traditional English often uses 'rubies,' but the term is not certainly that specific. 'Jewels' preserves the sense of precious valuables without over-specifying the gemstone.
- source_word: מִכְרָהּ
  chosen: her worth
  alternatives:
  - her price
  - her worth
  lexicon: HALOT
  rationale: “Worth” naturally conveys the comparison of valuation in English.
- source_word: אֵשֶׁת חַיִל
  chosen: a capable wife
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The expression presents a wife marked by strength and practical capability, not moral character alone.
