  text: 니카노르는 큰 군대를 거느리고 예루살렘에 왔습니다. 그는 속임수를 품고 유다와 그의 형제들에게 평화로운 말을 보내며 이렇게 말했습니다:[a]
  philosophy: optimal-equivalence
