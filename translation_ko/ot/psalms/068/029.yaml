base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/029.yaml
  text: Because of your temple at Jerusalem, kings will bring tribute to you[a].
  footnotes:
  - marker: a
    text: Or 'gifts' or 'presents.' The opening Hebrew preposition can be causal here; a spatial 'from your temple' would misleadingly make the tribute originate there.
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘 위에 있는 주님의 성전에서 왕들이 주께 예물을 가져올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예루살렘에 있는 주님의 성전으로 말미암아 왕들이 주께 예물을 가져올 것입니다.” 히브리어의 전치사 표현은 성전에서 비롯됨을 나타낼 수도 있고, 성전 때문에 왕들이 예물을 가져옴을 나타낼 수도 있습니다. ‘예루살렘 위에’는 성전과 예루살렘의 관계를 나타내는 표현이며, ‘예루살렘에’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צִוָּה
  english_pob_choice: has commanded
  chosen_korean: 명령하셨습니다
  alternatives_korean:
  - 명하셨습니다
  - 지시하셨습니다
  lexicon: HALOT
  rationale: 완료형 동사의 강한 권위를 살리면서, 한국어에서는 ‘명령하다’가 가장 직접적으로 어울립니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 주님의 하나님
  alternatives_korean:
  - 당신의 하나님
  - 하나님
  lexicon: HALOT
  rationale: 2인칭 소유를 반영하되, 시편의 직접 호칭 맥락에서 한국어로는 ‘주님’이 자연스럽고 경건한 지시 대상이 됩니다.
- source_word: עֻזֶּךָ / עוּזָה
  english_pob_choice: your strength / Show strength
  chosen_korean: 당신의 힘 / 힘을 보이소서
  alternatives_korean:
  - 당신의 능력 / 능력을 나타내소서
  - 당신의 힘 / 강하소서
  lexicon: HALOT
  rationale: 첫 절의 ‘힘’과 뒤의 난해한 명령형을 구분해, 의미는 살리되 두 번째 절에서 소유격을 과도하게 되풀이하지 않도록 했습니다.
- source_word: פָּעַלְתָּ לָּנוּ
  english_pob_choice: you who have worked for us
  chosen_korean: 주께서 우리를 위해 일하셨습니다
  alternatives_korean:
  - 우리를 위해 행하셨습니다
  - 우리에게서 일하셨습니다
  lexicon: HALOT
  rationale: פָּעַל의 ‘행하다/일하다’ 의미를 살려, 하나님의 실제적 개입을 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 난해한 עוּזָה의 처리
  chosen_reading: ‘힘을 보이소서’로 읽어, 하나님께 힘의 প্রকাশ을 간구하는 기도로 유지했습니다.
  alternative_readings:
  - ‘강하소서’
  - ‘당신의 힘을 견고하게 하소서’
  - ‘우리를 위해 행하신 것을 강하게 하소서’
  rationale: 히브리어가 문법적으로 어렵기 때문에, 본문 내부의 청원성을 유지하면서도 다음 절의 내용을 미리 끌어오지 않는 방향을 택했습니다.
  doctrine_reference: 'Translation philosophy §3: 의미의 긴장을 보존하고 과도한 해소를 피함'
