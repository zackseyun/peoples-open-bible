id: ISA.39.3
reference: Isaiah 39:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹא֙ יְשַׁעְיָ֣הוּ הַ/נָּבִ֔יא אֶל הַ/מֶּ֖לֶךְ חִזְקִיָּ֑הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו מָ֥ה אָמְר֣וּ הָ/אֲנָשִׁ֣ים הָ/אֵ֗לֶּה וּ/מֵ/אַ֨יִן֙ יָבֹ֣אוּ אֵלֶ֔י/ךָ וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ מֵ/אֶ֧רֶץ רְחוֹקָ֛ה בָּ֥אוּ אֵלַ֖/י מִ/בָּבֶֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/039/003.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him, “What did these men say, and where did they come to you from?” And Hezekiah said, “They came to me from a distant land, from Babylon.”
translation:
  language: ko
  text: 그때 예언자 이사야가 히스기야 왕에게 와서 말했습니다. “이 사람들이 무슨 말을 했으며, 어디에서 왕께 왔습니까?” 히스기야가 말했습니다. “그들은 먼 나라 바빌론에서 제게 왔습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  english_pob_choice: Isaiah the prophet
  chosen_korean: 이사야 선지자
  alternatives_korean:
  - 이사야 예언자
  - 예언자 이사야
  lexicon: 이사야 / נָבִיא
  rationale: נָבִיא는 예언적 사역을 드러내므로 ‘선지자’로 옮기되, 현대 문체를 위해 이름 뒤에 붙였습니다.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  english_pob_choice: King Hezekiah
  chosen_korean: 히스기야 왕
  alternatives_korean:
  - 왕 히스기야
  - 히스기야 임금
  lexicon: 히스기야 / מֶלֶךְ
  rationale: 왕호를 이름 뒤에 두어 자연스러운 현대 한국어 어순을 유지하면서, מקור의 왕 칭호를 분명히 했습니다.
- source_word: מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה
  english_pob_choice: What did these men say
  chosen_korean: 이 사람들이 무슨 말을 했으며
  alternatives_korean:
  - 이 사람들은 무슨 말을 했으며
  - 이 사람들이 무엇을 말했으며
  lexicon: מָה / אָמַר
  rationale: 직접 화법의 질문 형식을 살리면서, 문맥상 ‘말하다’의 내용 질문을 자연스럽게 표현했습니다.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  english_pob_choice: and where did they come to you from?
  chosen_korean: 어디에서 당신에게 왔습니까?
  alternatives_korean:
  - 어디에서 당신에게 왔는지요?
  - 어디서 당신에게 왔습니까?
  lexicon: מֵאַיִן / בוא
  rationale: POB가 보존한 ‘to you’의 방향성을 한국어에 자연스럽게 반영하기 위해 ‘당신에게’로 옮겼습니다.
- source_word: מֵאֶרֶץ רְחוֹקָה
  english_pob_choice: from a distant land
  chosen_korean: 먼 나라
  alternatives_korean:
  - 먼 땅
  - 멀리 떨어진 나라
  lexicon: אֶרֶץ / רְחוֹקָה
  rationale: אֶרֶץ는 여기서 정치·지리적 ‘나라’의 뉘앙스가 자연스럽고, רְחוֹקָה는 ‘먼’으로 간결하게 살렸습니다.
- source_word: מִבָּבֶל
  english_pob_choice: from Babylon
  chosen_korean: 바빌론에서
  alternatives_korean:
  - 바벨론에서
  - 바빌론으로부터
  lexicon: בָּבֶל
  rationale: 고유명사는 현대 외래어 표기법에 맞춰 ‘바빌론’으로 옮겼습니다.
theological_decisions:
- issue: 예언자 호칭의 한국어 대응
  chosen_reading: נָבִיא를 ‘선지자’로 표기해 예언자의 공식적 직무를 드러냈습니다.
  alternative_readings:
  - 예언자
  - 선견자
  rationale: 본문은 단순 직함이 아니라 야훼의 말씀을 전달하는 공적 사역자를 가리키므로, 한국 독자에게 익숙하면서도 직무성을 지닌 표현을 선택했습니다.
  doctrine_reference: 예언자/선지자 직분의 성경적 용례
