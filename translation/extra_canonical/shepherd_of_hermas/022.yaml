    IDs changed. Follow-up2026-11-04: corrected the earlier manual transcription at V.4.ii.4 from singular
    τῷ θηρίῳ to printed plural τῶν θηρίων after renewed scan review. Lake1907PlateIVline33 and primarySinaiticusXML23.4words41–44
