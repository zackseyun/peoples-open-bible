  - source_phrase: Ἐκεῖνός ἐστιν ᾧ ἐγὼ βάψω τὸ ψωμίον καὶ δώσω αὐτῷ
    prior_rendering: It is he to whom I will dip the piece of bread and give it
    new_rendering: It is the one to whom I will give the piece of bread after dipping it
