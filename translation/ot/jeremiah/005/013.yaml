  from: And the prophets will become wind[a], and the word is not in them; thus it will be done to them.
  to: “The prophets will prove to be nothing but wind; they have no word from God[a]. Let what they predict happen to them[b]!”
  rationale: The lexical record rightly identifies wind as emptiness but leaves the speaker and final passive largely unexplained. The surrounding dialogue favors the people’s contemptuous continuation, while a note preserves the serious alternative of an oracle against false prophets.
