  value:
  - issue: Moral anthropology of 'two spirits'
    chosen_reading: The chapter is translated as presenting two real moral-spiritual agencies—truth and deceit—with an inner conscience between them.
    alternative_readings:
    - purely psychological tendencies
    - angelic/demonic beings in a strict ontological sense
    rationale: The Greek uses πνεύματα and frames the passage in paraenetic, moral terms. The translation preserves the spiritual language without forcing a later systematic interpretation.
    doctrine_reference: Preserve theological tension rather than resolve it.
  - issue: Judah's claim to have acted 'in ignorance'
    chosen_reading: Retained plainly alongside his confession of sin.
    alternative_readings:
    - softened to 'without realizing it'
    - omitted as exculpatory
    rationale: The Greek explicitly holds together culpability, blindness, and mercy. The translation preserves that tension rather than harmonizing it away.
    doctrine_reference: Preserve theological tension rather than resolve it.
  - issue: Context-sensitive reorientation terminology
    chosen_reading: '1[a]. For it leads astray, because in the delusion of silver they call those who are not gods gods, and it makes the one who has it fall into frenzy. 2. Because of silver I lost my children; and if my reorientation and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless. 3. But the God of my fathers had mercy on me, because I did this in ignorance[b]. 4. For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


      5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast. 9. And the spirit of truth testifies against all things, and the sinner is burned up by his own heart[c], and cannot lift up his face to the judge.'
    alternative_readings:
    - Traditional repent/repentance wording, preserved at the baseline commit.
    rationale: Use reorient/reorientation without automatically inserting God. The sentence supplies a departure, destination, interpersonal setting, or the work's own conceptual framework. Preserve distinct turning verbs and named wrongdoing.
    doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
