base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/016.yaml
  text: 'And they said to them[a], “Report to us about what has been written.” And the first, the one who had spoken about the strength of wine, began and said thus:'
  footnotes:
  - marker: a
    text: Or “about the power of wine.” The Greek word can mean strength, might, or power.
    reason: lexical_alternative
translation:
  language: ko
  text: '그들이 그들에게 말했습니다. 「기록된 것에 관하여 우리에게 보고하십시오.」 그러자 첫 번째 사람, 곧 포도주의 힘[a]에 관하여 말했던 사람이 말을 시작하여 이렇게 말했습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἰσχύς는 여기서 ‘힘’ 외에도 ‘능력’, ‘강함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπαγγείλατέ
  english_pob_choice: Report
  chosen_korean: 보고하십시오
  alternatives_korean:
  - 말하십시오
  - 알리십시오
  - 전달하십시오
  lexicon: LSJ
  rationale: 공적인 자리에서 사실을 정식으로 진술해 달라는 뉘앙스를 살려, 일상적인 '말하다'보다 격식 있는 '보고하다'를 살렸습니다.
- source_word: περὶ τῶν γεγραμμένων
  english_pob_choice: about what has been written
  chosen_korean: 기록된 것에 관하여
  alternatives_korean:
  - 쓰인 것에 관하여
  - 기록된 내용에 대하여
  - 기록된 것에 대해
  lexicon: LSJ
  rationale: γεγραμμένων의 완료분사적 결과 상태를 살려, 단순한 '쓴 것'보다 이미 문서로 남아 있는 '기록된 것'으로 옮겼습니다.
- source_word: ὁ πρῶτος ὁ εἴπας
  english_pob_choice: the first, who had spoken
  chosen_korean: 맨 먼저 말했던 이
  alternatives_korean:
  - 첫 번째로 말했던 이
  - 처음으로 말한 사람
  - 먼저 말한 자
  lexicon: LSJ
  rationale: 두 개의 관사와 분사구가 가리키는 동일 인물을 자연스럽게 풀어, 서열 표시를 유지하면서도 한국어 어순에 맞게 옮겼습니다.
- source_word: τῆς ἰσχύος τοῦ οἴνου
  english_pob_choice: the strength of wine
  chosen_korean: 포도주의 힘
  alternatives_korean:
  - 포도주의 강함
  - 포도주의 능력
  - 포도주의 세력
  lexicon: LSJ
  rationale: ἰσχύς의 의미 범위는 '힘/강함/능력'이지만, 여기서는 포도주의 우열을 말하는 문맥이므로 가장 직접적인 '힘'을 선택했습니다.
- source_word: καὶ ἔφη οὕτως
  english_pob_choice: and said thus
  chosen_korean: 이렇게 말했습니다
  alternatives_korean:
  - 그리하여 말했습니다
  - 이같이 말했습니다
  - 그렇게 말했습니다
  lexicon: LSJ
  rationale: οὕτως의 형식적 도입어를 한국어에서 자연스러운 서술 표지로 옮겨, 뒤의 직접 화법을 예고하도록 했습니다.
