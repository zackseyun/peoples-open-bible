base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: ko
  text: 그때 그나아나의 아들 시드기야가 자기를 위해 철 뿔들을 만들고 말했습니다. “야훼께서 이렇게 말씀하십니다. ‘이것들로 너는 아람을 들이받을 것이며, 그들을 멸할 때까지 그렇게 할 것이다.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/יַּ֥עַשׂ ל֛/וֹ
  english_pob_choice: made for himself
  chosen_korean: 자기에게 주고
  alternatives_korean:
  - 자기를 위해 만들고
  - 자기에게 만들어 주고
  lexicon: עשה
  rationale: עשה의 기본 동작인 ‘만들다’를 살리되, לֹו가 가리키는 수혜/귀속을 한국어에서 자연스럽게 ‘자기에게’로 드러냈습니다.
- source_word: צִדְקִיָּ֥ה בֶן כְּנַעֲנָה
  english_pob_choice: Zedekiah son of Chenaanah
  chosen_korean: 시드기야의 아들
  alternatives_korean:
  - 시드기야, 그 아들
  - 시드기야 아들
  lexicon: 고유명사/계보표현
  rationale: 히브리어 직계보를 반영해 ‘아들’을 유지했고, 인명은 현대 음역인 시드기야로 옮겼습니다.
- source_word: קַרְנֵ֣י בַרְזֶ֑ל
  english_pob_choice: horns of iron
  chosen_korean: 철 뿔들
  alternatives_korean:
  - 쇠뿔들
  - 철로 된 뿔들
  lexicon: קרן + ברזל
  rationale: 상징적 도상인 ‘뿔’을 그대로 살리면서 재료인 ברזל을 간결한 현대어 ‘철’로 옮겼습니다.
- source_word: תְּנַגַּ֥ח אֶת אֲרָ֖ם
  english_pob_choice: you will gore Aram
  chosen_korean: 아람을 들이받아
  alternatives_korean:
  - 아람을 받아들이쳐
  - 아람을 뿔로 받아
  lexicon: נגח
  rationale: נגח의 핵심 이미지인 ‘뿔로 들이받다’를 한국어 동사구 ‘들이받다’로 자연스럽게 재현했습니다.
- source_word: עַד כַּלֹּתָֽ/ם
  english_pob_choice: until you have finished them off
  chosen_korean: 그들을 끝장낼 것이다
  alternatives_korean:
  - 그들을 멸할 것이다
  - 그들을 완전히 끝낼 것이다
  lexicon: כלה
  rationale: כלה의 종결·소멸 의미를 강하게 드러내되, 전투적 맥락에 맞는 직설적 표현으로 옮겼습니다.
theological_decisions:
- issue: 야훼 신명 표기
  chosen_reading: 본문의 발화 주체를 ‘야훼’로 옮기고, 예언자적 인용문 안의 직접 발화 형식을 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 원문 יְהוָה에 대한 프로젝트 기본값을 따르면서, 선지자 선포의 권위를 분명히 드러내기 위해 직접 인용 형식을 보존했습니다.
  doctrine_reference: OT divine name rendering policy
