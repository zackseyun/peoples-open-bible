lexical_decisions:
- source_word: Μὴ εὑρήσομεν
  chosen: Will we find
  alternatives:
  - Shall we find
  - Can we find
  lexicon: LSJ
  rationale: 'The μή with future indicative is used rhetorically, expecting a negative answer: ''surely we will not find.'' In idiomatic English, ''Will we find...?'' preserves the rhetorical force without over-paraphrasing. A stronger expansion such as ''Surely we will not find'' would make the implied answer explicit beyond the Greek wording.'
- source_word: ἄνδρα
  chosen: man
  alternatives:
  - person
  lexicon: LSJ
  rationale: The Greek is explicitly masculine singular and refers to a specific male individual in context. Per gender-accurate policy, 'man' is preferred over the more neutral 'person'.
- source_word: τοιοῦτον
  chosen: like this
  alternatives:
  - such as this
  - such a one
  lexicon: LSJ
  rationale: This adjective points to a person of this sort or quality. 'Like this' is natural modern English and keeps the demonstrative force. 'Such a one' is more formal and archaic.
- source_word: ἕνα
  chosen: one
  alternatives:
  - even one
  lexicon: LSJ
  rationale: 'The numeral/adjectival force underscores uniqueness: ''one man like this.'' ''Even one'' is possible but slightly more interpretive in English.'
- source_word: ποιήσωμεν
  chosen: let us make
  alternatives:
  - let us appoint
  lexicon: LSJ
  rationale: The verb literally means 'let us make.' In this political context it can imply appointing or designating, but 'make' preserves the Greek while remaining intelligible.
- source_word: φίλον
  chosen: friend
  alternatives:
  - ally
  lexicon: LSJ
  rationale: The noun means 'friend,' often in Hellenistic political language for an officially recognized royal friend. Because σύμμαχον follows, rendering φίλον as 'friend' preserves the distinct pair rather than collapsing both into political terminology.
- source_word: σύμμαχον
  chosen: ally
  alternatives:
  - confederate
  - supporter
  lexicon: LSJ
  rationale: The term denotes one joined in alliance, especially political or military. 'Ally' is the clearest modern equivalent.
- source_word: ἡμῶν
  chosen: our
  alternatives:
  - of ours
  lexicon: LSJ
  rationale: Standard possessive rendering in English.
