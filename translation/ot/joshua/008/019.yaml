  from: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
  to: As soon as Joshua stretched out his hand, the men in ambush rose quickly from their position and ran into the city. They captured it and quickly set it on fire.
  rationale: The lexical record rightly treats 'the ambush' as a collective force and stresses the speed of its response. I retain that meaning but identify the men directly; the alternative 'when' does not require a note because it does not materially change the event.
