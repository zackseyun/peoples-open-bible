translation:
  text: Destroy all oppression from the face of the earth, and let every evil deed come to an end. Then the plant of righteousness
    and uprightness will appear and become a blessing; deeds of righteousness and uprightness will be planted forever in joy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez term can also be rendered “truth” or “rectitude”; here it emphasizes moral straightness alongside “righteousness.”
    reason: lexical_alternative
lexical_decisions:
- source_word: አሕጕል
  chosen: Destroy
  alternatives:
  - Cause to perish
  - Remove
  rationale: The causative imperative opens the verse as a command and governs the removal of oppression. “Destroy” preserves
    its judgment force without expanding the image.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ግፍዓ
  chosen: oppression
  alternatives:
  - wrongdoing
  - violence
  - injustice
  rationale: The noun denotes injurious wrong or oppressive violence. “Oppression” fits the Watchers context and remains distinct
    from the following general phrase “every evil deed.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እምገጸ፡ ምድር
  chosen: from the face of the earth
  alternatives:
  - from the surface of the earth
  rationale: This preserves the concrete Semitic-style expression rather than flattening it to “from the earth.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኵሉ፡ ምግባረ፡ እኩይ
  chosen: every evil deed
  alternatives:
  - every work of evil
  - all evil activity
  rationale: “Deed” gives natural English for the construct expression while retaining its comprehensive moral sense.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይኅልቅ
  chosen: let ... come to an end
  alternatives:
  - will perish
  - let ... perish
  - will cease
  rationale: Following the opening imperative, the jussive-like rendering carries forward the command concerning evil. “Come
    to an end” expresses cessation without suggesting that the abstract deed literally dies.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ያስተርኢ
  chosen: will appear
  alternatives:
  - will be revealed
  - will become visible
  rationale: The form conveys becoming visible or manifest. “Will appear” is direct and preserves the emergence of the apocalyptic
    plant image.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ተክለ፡ ጽድቅ
  chosen: the plant of righteousness
  alternatives:
  - the planting of righteousness
  - the shoot of righteousness
  rationale: “Plant” retains the concrete growth image and avoids specifying a shoot or the act of planting where the noun
    itself does not require that narrowing.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ርትዕ
  chosen: uprightness
  alternatives:
  - truth
  - rectitude
  - justice
  rationale: The term can express moral straightness, rightness, or truth. “Uprightness” best preserves its ethical force
    beside ጽድቅ (“righteousness”) without collapsing the two terms into one.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ለበረከት
  chosen: become a blessing
  alternatives:
  - be for a blessing
  - serve as a blessing
  rationale: The prepositional construction is idiomatically rendered “become a blessing”; the subject is most naturally the
    preceding plant of righteousness and uprightness.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ግብረ፡ ጽድቅ፡ ወርትዕ
  chosen: deeds of righteousness and uprightness
  alternatives:
  - the work of righteousness and uprightness
  - works of righteousness and truth
  rationale: Although ግብር is morphologically singular, the following plural verb supports a collective sense, naturally expressed
    by English “deeds.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ለዓለም
  chosen: forever
  alternatives:
  - for eternity
  - for the age
  rationale: In this judgment-and-restoration setting the expression indicates enduring duration; “forever” is clear and appropriately
    elevated.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በፍሥሓ
  chosen: in joy
  alternatives:
  - with joy
  - in gladness
  rationale: The prepositional phrase describes the joyful condition accompanying the enduring planting. “In joy” closely
    represents the source construction.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይተከሉ
  chosen: will be planted
  alternatives:
  - shall be planted
  - will take root
  rationale: The passive plural verb resumes and extends the plant imagery. “Will be planted” preserves both voice and metaphor
    rather than interpreting the outcome as merely taking root.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
