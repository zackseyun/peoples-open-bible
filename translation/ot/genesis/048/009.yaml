  from: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
  to: And Joseph said to his father, “They are my sons, whom God has given me here.” His father said, “Please bring them to me so that I may bless them.”
  rationale: I retain the documented understanding of 'here' as Joseph’s location in Egypt and of 'bring' as movement toward Jacob. The recorded alternative purpose construction better expresses the request’s connection to the blessing, making both earlier notes unnecessary.
