  - source_word: ወይማስን
    chosen: and their sons
    alternatives:
    - and their offspring
    - and their children
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: In context this likely refers to the descendants associated with the judged beings. 'Sons' keeps the more literal
      and genealogical force common in ancient judgment texts.
  - source_word: እምይእዜ
    chosen: they
    alternatives:
    - those who are from now
    - from this time
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: The transmitted form is difficult in OCR. The sense required by the clause is a resumptive subject before 'shall
