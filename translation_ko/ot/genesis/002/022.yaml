revisions:
- from: 그 사람이에게서 가져온 갈비뼈로 주 하나님께서 여자를 지으시고, 그녀를 그 사람에게로 이끌어 오셨습니다.
  to: 야훼 하나님께서는 그 사람에게서 가져오신 갈비뼈를 세워 여자로 만드시고, 그녀를 그 사람에게 데려오셨습니다.
  rationale: 문법 오류를 바로잡고, 야훼 표기 기본값을 적용했으며, בנה의 ‘세우다/짓다’ 어감을 ‘세워 여자로 만드시고’에 보존했습니다. 별도의 본문 각주가 필요한 이문, 인용, 문화 배경 문제는 없습니다.
  reviewer_model: gpt-5.6-terra
