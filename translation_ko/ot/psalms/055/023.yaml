  text: 그러나 하나님, 주께서는 그들을 멸망의 구덩이로 내려보내실 것입니다.[a] 피 흘리기를 일삼고 속이는 자들은 자기 날들의 절반도 살지 못할 것입니다.[b] 그러나 저는 주를 신뢰하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
