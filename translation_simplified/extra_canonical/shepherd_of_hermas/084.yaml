translation:
  text: 'The glorious man was lord of the whole tower. When he finished, he called the shepherd. He handed
    over all the rejected stones lying beside the tower and told him,[a]


    2. “Clean these stones carefully. Put into the tower’s building those that can fit with the rest.
    Throw the ones that do not fit far away from the tower.”


    3. After giving these orders, he left the tower with everyone who had come with him.[b] The virgins
    stood around the tower and guarded it.


    4. I asked the shepherd, “How can these rejected stones go back into the tower’s building?” He asked,
    “Do you see these stones?” I said, “I see them, sir.” He said, “I will cut most of them and put them
    into the building. They will fit with the others.”


    5. I asked, “Sir, how can they fill the same space after being cut down?” He answered, “The small
    ones will go inside the building. The larger ones will go outside and hold them together.”


    6. He said, “Let us go. In two days we will return, clean these stones and put them into the building.
    Everything around the tower must be cleaned. The master might come suddenly, find it dirty and be
    displeased. Then these stones will not go into the tower’s building, and the master will think I have
    been negligent.”


    7. Two days later we came to the tower. He said, “Let us examine all the stones and see which can
    go into the building.” I said, “Sir, let us examine them.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: “Lord” describes the glorious man’s authority over the tower; “master” later renders despotes.
      “Sir” is Hermas’s address to the shepherd. The draft keeps the roles distinct without treating every
      occurrence as the same named divine title. The later explanation identifies the glorious man as
      the Son of God.
  - marker: b
    reason: textual_variant
    text: “After giving these orders to the shepherd, he left the tower” is a bar-marked supplement in
      the working Greek, absent from Athos as reported. It is retained with its versional basis visible.
      The two-day interval and the shepherd’s concern about seeming negligent remain explicit.
