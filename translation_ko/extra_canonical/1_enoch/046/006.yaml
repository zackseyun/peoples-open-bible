base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/006.yaml
  text: And he will cast down the face of the strong ones[a], and he will fill them with shame; and darkness shall become their dwelling, and worms their bed. And they shall have no hope of rising from their beds[c][b], because they do not exalt the name of the Lord of Spirits.
  footnotes:
  - marker: a
    text: The word rendered 'worms' comes from an OCR form that is somewhat uncertain in this Ge'ez witness; the sense fits the judgment image of corruption in the grave-like bed.
    reason: textual_variant
  - marker: b
    text: '''Rising from their beds'' may simply mean getting up, but in this context it may also carry an implied denial of restoration after judgment.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And the face of the strong ones shall be struck down, and shame shall fill them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분은 강한 자들의 얼굴을 꺾으시고, 그들을 수치로 채우실 것입니다. 어둠이 그들의 거처가 되고, 벌레가 그들의 침상이 될 것입니다[a]. 그들은 자기 침상에서 일어날 희망이 없을 것입니다[b]. 이는 그들이 영들의 주님의 이름을 높이지 않기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벌레’로 옮긴 게으즈어는 이 전승의 OCR 판독상 다소 불확실합니다. 그러나 부패와 심판의 침상이라는 문맥에는 이 뜻이 잘 들어맞습니다.
    reason: textual_variant
  - marker: b
    text: ‘침상에서 일어날 희망이 없다’는 말은 단순히 일어나지 못한다는 뜻일 수 있으나, 이 문맥에서는 심판 뒤 회복되지 못함을 암시할 수도 있습니다.
    reason: lexical_alternative
