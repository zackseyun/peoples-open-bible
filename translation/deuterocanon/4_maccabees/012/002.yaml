  text: ὃν κατοικτειρήσας ὁ τύραννος, καίπερ δεινῶς ὑπὸ τῶν ἀδελφῶν αὐτοῦ κακισθείς, ὁρῶν ἤδη τὰ δεσμὰ περικείμενον,
