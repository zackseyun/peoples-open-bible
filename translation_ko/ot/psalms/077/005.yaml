id: PSA.77.5
reference: Psalms 77:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חִשַּׁ֣בְתִּי יָמִ֣ים מִ/קֶּ֑דֶם שְׁ֝נ֗וֹת עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/005.yaml
  text: I considered the days of old[a], the years of ages past.
  footnotes:
  - marker: a
    text: Or 'the years of ancient times.' The Hebrew עוֹלָמִים here refers to remote antiquity rather than necessarily to eternity in the absolute sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 옛날의 날들을, 오래전 시대들의 해들을 생각하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחַזְתָּ
  english_pob_choice: You have held
  chosen_korean: 붙들어 주시니
  alternatives_korean:
  - 붙드셨습니다
  - 잡아 두셨습니다
  - 붙잡으셨습니다
  lexicon: HALOT
  rationale: 하나님께 직접 말하는 문맥에서 אחז의 ‘붙들다/잡아 두다’ 뜻을 살리되, 뒤의 눈꺼풀/잠 이미지와 자연스럽게 이어지도록 했습니다.
- source_word: שְׁמֻרוֹת עֵינָי
  english_pob_choice: my eyelids open
  chosen_korean: 내 눈꺼풀
  alternatives_korean:
  - 내 눈의 파수들
  - 내 눈의 지킴
  - 내 눈의 경계
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘내 눈의 파수/감시’이지만 관용적으로 눈꺼풀이 잠들지 못하게 붙들린 이미지를 가리키므로, 자연스러운 한국어로 ‘눈꺼풀’을 택했습니다. 인위적인 직역은 피하되 감각적 긴장을 유지했습니다.
- source_word: נִפְעַמְתִּי
  english_pob_choice: I am troubled
  chosen_korean: 내가 괴로워
  alternatives_korean:
  - 내가 동요되어
  - 내가 불안하여
  - 내가 당황하여
  lexicon: HALOT
  rationale: 내적 동요와 압박을 폭넓게 담는 표현으로 옮겨, 감정의 강도는 유지하되 원문이 특정한 두려움이나 분노로 좁혀지지 않도록 했습니다.
- source_word: וְלֹא אֲדַבֵּר
  english_pob_choice: and cannot speak
  chosen_korean: 말을 할 수 없습니다
  alternatives_korean:
  - 말하지 못합니다
  - 아무 말도 하지 못합니다
  - 말이 나오지 않습니다
  lexicon: HALOT
  rationale: 단순한 의지적 침묵이 아니라 괴로움 때문에 말을 못 하는 상태를 드러내기 위해 ‘할 수 없습니다’를 선택했습니다.
theological_decisions:
- issue: 하나님이 잠을 막는 행위의 표현 방식
  chosen_reading: 주께서 시편 기자의 눈꺼풀을 붙드셔서 잠들지 못하게 하시는 것으로 번역했습니다.
  alternative_readings:
  - 주께서 내 눈의 파수들을 붙드셨습니다
  - 주께서 내 눈을 지키셨습니다
  rationale: 원문의 관용구가 실제로는 불면과 각성 상태를 묘사하므로, 한국어에서도 심리적 상태와 신적 주권을 함께 드러내는 방식이 가장 직접적입니다.
  doctrine_reference: 시편의 탄식시에서 하나님의 주권적 개입과 인간의 고통을 함께 묘사하는 문맥
