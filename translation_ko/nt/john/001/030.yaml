  verdict: revise
  source_fidelity: 현 초안은 ὑπὲρ οὗ를 두고 ‘우위’를 말하는 각주를 붙였는데, 이 구절에서 이는 εἶπον과 함께 ‘내가 말한/언급한 분’을 가리키는 표현입니다. 또한 각주 표지가 해당 원어 표현과 연결되지 않습니다. 본문은 Ὀπίσω μου의 시간적 ‘내 뒤에’, ἔμπροσθέν μου γέγονεν의 현재적 우선성, 그리고 πρῶτός μου ἦν의 시간적·위계적 여지를 모두 자연스럽게 보존하도록 다듬었습니다.
  naturalness: ‘이분이 바로 내가 말한 분입니다’와 ‘내 뒤에 한 사람이 오시는데’는 현대 표준 한국어의 격식 있는 증언 문맥에 자연스럽습니다. 예수님을 가리키는 후속 지시어에는 ‘그분’을 사용하고, 종결은 합쇼체로 유지했습니다.
  terminology: ‘앞서 계십니다’는 ἔμπροσθεν의 우선성/우위 가능성을 보존하며, ‘먼저 계셨기 때문입니다’는 πρῶτος의 선재 함의를 과도하게 해설하지 않습니다. ἀνήρ은 ‘한 사람’으로 옮겨 인물을 명시하되 현대 한국어에서 부자연스러운 ‘한 남자’는 피했습니다.
  issues:
  - severity: high
    issue: 각주 a가 ὑπὲρ οὗ에 ‘우위(precedence)’ 의미를 부여합니다.
