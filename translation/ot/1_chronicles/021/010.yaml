theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Implicit object of 'three I am setting before you'
  chosen_reading: Supply 'three things' rather than specifying 'judgments' or 'plagues'
  alternative_readings:
  - three judgments
  - three plagues
  - three options
  rationale: The Hebrew leaves the noun unstated in this verse. Supplying the minimal English placeholder 'things' preserves the ambiguity until the next verse names the options, avoiding interpretive overreach.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
