theological_decisions:
- issue: Addressing the shepherd as Κύριε
  chosen_reading: Render as “Sir” rather than “Lord.”
  alternative_readings:
  - Translate as “Lord.”
  rationale: In Hermas the interlocutor is an angelic or visionary figure, and the vocative Kύριε functions
    as respectful address rather than a divine title. “Sir” preserves the relational register without
    conferring divine status.
- issue: Adultery extended to idolatry
  chosen_reading: Render ὁμοιώματα + ποιέω τοῖς ἔθνεσιν as “makes images as the nations do,” keeping ‘adultery’
    metaphor for idolatry.
  alternative_readings:
  - Imitates the customs of the nations
  - Makes likenesses like the Gentiles (without idol nuance)
  rationale: The term ὁμοιώματα commonly denotes carved images; Hermas’s moral logic treats idolatry as
    covenant adultery. Maintaining ‘adultery’ preserves the theological metaphor.
- issue: δοῦλος τοῦ Θεοῦ
  chosen_reading: Translate as “servant of God.”
  alternative_readings:
  - bondservant of God (bonded-status nuance)
  rationale: Current reader wording is servant of God. Belonging and obligation may be discussed as source
    nuance without falsely attributing a slave default to current policy. The former decision is preserved
    in the full historical archive.
  doctrine_reference: 'DOCTRINE.md: Contested terms – δοῦλος'
- issue: Contextual repentance reassessment
  chosen_reading: Exact reader wording is recorded in config/terminology/repentance-contextual-2026-10-13.json#translation/extra_canonical/shepherd_of_hermas/029.yaml
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
