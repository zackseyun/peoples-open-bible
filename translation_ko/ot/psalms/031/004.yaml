revisions:
- from: 참으로 주는 나의 바위요 나의 요새이십니다[a][b]. 주의 이름을 위하여 나를 인도하시고 나를 이끄실 것입니다[c].
  to: 그들이 나를 겨냥하여 숨겨 둔 그물에서 나를 끌어내십시오. 주께서 나의 요새이시기 때문입니다.
  rationale: 히브리어 תּוֹצִיאֵנִי를 탄원의 요청으로 ‘나를 끌어내십시오’로 옮겼습니다. מֵרֶשֶׁת זוּ는 ‘그물에서’로, טָמְנוּ לִי의 적대적 의미는 ‘나를 겨냥하여 숨겨 둔’으로 명료하게 나타냈습니다. כִּי는 청원의 근거를 제시하므로 ‘…때문입니다’로, מָעוּזִי는 보호·방어의 이미지를 유지해 ‘나의 요새’로 번역했습니다. 원문의 쟁점 있는 의미를 확정하는 별도 각주는 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:06:42Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 제시된 히브리어 본문(시편 31:4)이 아니라 앞 절 계열의 내용(‘바위’, ‘요새’, ‘주의 이름을 위하여 인도하시고 이끄심’)을 번역하고 있습니다. 본절의 탄원 ‘나를 … 그물에서 끌어내십시오’와 근거 ‘주께서 나의 요새이시기 때문입니다’를 반영해야 합니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 시적 탄원으로 자연스럽습니다. ‘나를 겨냥하여 숨겨 둔 그물’은 히브리어의 적대적 여격 לִי를 한국어에서 오해 없이 전달합니다.
  terminology: רֶשֶׁת는 구체적 이미지를 보존하여 ‘그물’로, מָעוֹז는 방어적 보호의 은유를 보존하여 ‘요새’로 옮겼습니다. תּוֹצִיאֵנִי는 문맥상 간청으로 ‘끌어내십시오’로 번역했습니다.
  issues:
  - severity: high
    issue: 본문 절의 내용이 원문과 일치하지 않습니다.
    rationale: 초안은 ‘주는 나의 바위요 나의 요새이십니다… 주의 이름을 위하여 나를 인도하시고…’라고 하나, 이는 제공된 시편 31:4 히브리어 본문에 존재하지 않는 어휘와 절을 포함합니다. 제공된 본문은 숨겨 둔 그물에서의 구출을 청하는 탄원입니다.
  - severity: medium
