  from: Let a righteous man strike me—it is a kindness[a]; let him rebuke me—it is oil for the head; let my head not refuse it[b][c]. For still my prayer is against their evils.
  to: Let a righteous man strike me—it is a kindness[a]; let him rebuke me—it is oil for the head; let my head not refuse it[b]. Yet my prayer continues amid their calamities[c].
  rationale: The predicate reading of חֶסֶד is well established and yields natural English; the adverbial construal should remain an alternative rather than displace it. The difficult אַל יָנִי רֹאשִׁי is retained without pretending that its lexical analysis is certain. In the final clause, “against their evils” adds an adversative force not expressed by בְּ, while “in their calamities” is unnaturally opaque English. “Amid their calamities” preserves the circumstantial relation and a contextually plausible sense of רָעוֹת, with the major alternative that the prayer is for them stated in the note. The conjunction is rendered “Yet” because a bare “For” does not make the difficult discourse relation intelligible, though the exact relation remains uncertain.
