book: Shepherd of Hermas
source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: 1. ἣν εἶδον, ἀδελφοί, τοιαύτη. 2. νηστεύσας πολλάκις καὶ δεηθείς τοῦ Κυρίου ἵνα μοι φανερώσῃ τὴν
    ἀποκάλυψιν ἣν μοι ἐπηγγείλατο δεῖξαι διὰ τῆς πρεσβυτέρας ἐκείνης, αὐτῇ τῇ νυκτὶ ὤφθη μοι ἡ πρεσβυτέρα
    καὶ εἶπέν μοι· Ἐπεὶ οὕτως ἐνδεὴς εἶ καὶ σπουδαῖος εἰς τὸ γνῶναι πάντα, ἐλθὲ εἰς τὸν ἀγρὸν ὅπου χρονίζεις,
    καὶ περὶ ὥραν πέμπτην ἐμφανισθήσομαί σοι καὶ δείξω σοι ἃ δεῖ σε ἰδεῖν. 3. ἠρώτησα αὐτὴν λέγων· Κυρία,
    εἰς ποῖον τόπον τοῦ ἀγροῦ; Ὅπου, φησίν, θέλεις. ἐξελεξάμην τόπον καλὸν ἀνακεχωρηκότα. πρὶν δὲ λαλῆσαι
    αὐτῇ καὶ εἰπεῖν τὸν τόπον, λέγει μοι· Ἥξω ἐκεῖ ὅπου θέλεις. 4. ἐγενόμην οὖν, ἀδελφοί, εἰς τὸν ἀγρόν,
    καὶ συνεψήφισα τὰς ὥρας, καὶ ἦλθον εἰς τὸν τόπον ὅπου διεταξάμην αὐτὴν ἐλθεῖν, καὶ βλέπω συμπέλιον
    κείμενον ἐλεφάντινον, καὶ ἐπὶ τοῦ συμπελίου ἔκειτο κερβικάριον λινοῦν, καὶ ἐπάνω λεντίον ἐξηπλωμένον
    λινοῦν καρπάσιον. 5. ἰδὼν ταῦτα κείμενα καὶ μηδένα ὄντα ἐν τῷ τόπῳ ἔκθαμβος ἐγενόμην, καὶ ὡσεί τρόμος
    με ἔλαβεν, καὶ αἱ τρίχες μου ὀρθαί· καὶ ὡσεί φρίκη μοι προσῆλθεν, μόνου μου ὄντος. ἐν ἐμαυτῷ οὖν γενόμενος
    καὶ μνησθεὶς τῆς δόξης τοῦ Θεοῦ καὶ λαβὼν θάρσος, θεὶς τὰ γόνατα ἐξωμολογούμην τῷ Κυρίῳ πάλιν τὰς
    ἁμαρτίας μου ὡς καὶ πρότερον. 6. ἡ δὲ ἦλθεν μετὰ νεανίσκων ἕξ, οὓς καὶ πρότερον ἑωράκειν, καὶ ἐπεστάθη
    μοι καὶ κατηκροᾶτο προσευχομένου μου καὶ ἐξομολογουμένου τῷ Κυρίῳ τὰς ἁμαρτίας μου. καὶ ἁψαμένη μου
    λέγει· Ἑρμᾶ, παῦσαι περὶ τῶν ἁμαρτιῶν σου πάντα ἐρωτῶν· ἐρώτα καὶ περὶ δικαιοσύνης, ἵνα λάβῃς μέρος
    τι ἐξ αὐτῆς εἰς τὸν οἶκόν σου. 7. καὶ ἐξήγειρέ με τῆς χειρὸς καὶ ἄγει με πρὸς τὸ συμπέλιον, καὶ λέγει
    τοῖς νεανίσκοις· Ὑπάγετε καὶ οἰκοδομεῖτε. 8. καὶ μετὰ τὸ ἀναχωρῆσαι τοὺς νεανίσκους καὶ μόνων ἡμῶν
    γενομένων λέγει μοι· Κάθισον ὧδε. λέγω αὐτῇ· Κυρία, ἄφες τοὺς πρεσβυτέρους πρῶτον καθίσαι. Ὅ σοι λέγω,
    φησίν, κάθισον. 9. θέλοντος οὖν μου καθίσαι εἰς τὰ δεξιὰ μέρη οὐκ εἴασέν με, ἀλλ’ ἐνένευέ μοι τῇ χειρὶ
    ἵνα εἰς τὰ ἀριστερὰ μέρη καθίσω. διαλογιζομένου μου οὖν καὶ λυπουμένου ὅτι οὐκ εἴασέν με εἰς τὰ δεξιὰ
    μέρη καθίσαι, λέγει μοι· Λυπῇ, Ἑρμᾶ; ὁ εἰς τὰ δεξιὰ μέρη τόπος ἄλλων ἐστίν, τῶν ἤδη εὐαρεστηκότων
    τῷ θεῷ καὶ παθόντων εἵνεκα τοῦ ὀνόματος· σοὶ δὲ πολλὰ λείπει ἵνα μετ’ αὐτῶν καθίσῃς· ἀλλ’ ὡς ἐμμένεις
    τῇ ἁπλότητί σου, μεῖνον, καὶ καθῇ μετ’ αὐτῶν, καὶ ὅσοι ἐὰν ἐργάσωνται τὰ ἐκείνων ἔργα καὶ ὑπενέγκωσιν
    ἃ καὶ ἐκεῖνοι ὑπήνεγκαν.
  language: Greek
  pages:
  - 319
  - 320
  unit_id: V.3.i
  label: Vision 3, section i
  sequence: 9
translation:
  text: 'I.1. The vision[d] I saw, brothers, was like this.


    I.2. After fasting many times and pleading with the Lord to make known to me the revelation he had
    promised to show me through that aged woman, on that very night the aged woman appeared to me and
    said: “Since you are so needy and so eager to know everything, come to the field where you spend your
    time, and about the fifth hour[1] I will appear to you and show you what you must see.”


    I.3. I asked her, saying, “Lady[2], to what place in the field?” “Wherever you wish,” she says. I
    chose a good, secluded spot. But before I spoke to her and named the place, she says to me, “I will
    come there[l] where you wish.”


    I.4. So I went, brothers, into the field, and I counted the hours, and I came to the place where I
    had directed her to come; and I see an ivory seat[3] set there, and upon the seat there lay a linen
    cushion[e], and on top a spread-out towel of fine linen[4].


    I.5. Seeing these things set there and no one in the place, I was astonished, and a tremor, as it
    were, seized me, and my hair stood on end; and a shudder, as it were, came upon me, since I was alone.
    Then, coming to myself and remembering the glory of God, and taking courage, I knelt and again confessed
    my sins to the Lord, as before[f].


    I.6. And she came with six young men[g]—whom I had seen also before—and she stood near me[h] and listened
    closely while I was praying and confessing my sins to the Lord. And touching me she says, “Hermas,
    stop asking everything about your sins[c]; ask also about righteousness[5], so that you may receive
    some share of it for your household[6].”


    I.7. And she raised me by the hand and leads me to the seat, and she says to the young men, “Go and
    build.”


    I.8. And after the young men withdrew and we were alone, she says to me, “Sit here.” I say to her,
    “Lady, let the elders[7] sit first.” “What I tell you[a],” she says, “sit.”


    I.9. So when I wanted to sit on the right side, she did not permit me, but motioned to me with her
    hand that I should sit on the left side[j]. So as I reasoned and was grieved that she had not allowed
    me to sit on the right side, she says to me, “Are you grieved, Hermas? The place on the right side
    belongs to others—those who have already pleased God and suffered for the sake of the Name[8]; but
    you lack many things[b] to sit with them. But as you remain in your simplicity, remain[k], and you
    will sit with them, as will all who do their works and bear what they also bore.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The selected Greek says fifth hour; Athos PlateII, Sinaiticus9.2, Palatina printed29–31 and
      the Ethiopic edition’s Latin rendering printed117 also have fifth. Vulgata printed12 instead has
      sixth. The source gives no modern clock time, and the translation retains the selected ordinal rather
      than harmonizing the witnesses.
    reason: textual_variant
  - marker: '2'
    text: Lady renders the respectful address Kyria. Sinaiticus9.3 first has a masculine object pronoun,
      corrected by ca to her; the selected source addresses the woman. No different speaker is introduced.
    reason: textual_variant
  - marker: '3'
    text: Seat renders sympelion, a furniture term also rendered bench or couch. The selected material
      is ivory. Vulgata printed13 brackets the ivory-and-on-the-seat wording as an editorial supplement
      from Greek and Palatina, explicitly reporting its omission from its codices; that supplement is
      not preserved Vulgata agreement. Palatina printed31 and the Ethiopic edition’s Latin rendering printed117
      retain ivory seating.
    reason: textual_variant
  - marker: '4'
    text: Fine linen renders karpasion. The import twice printed the malformed double-accented linóûn
      in this paragraph; raw319 and normalized source now have the printed linoûn. These are accent transcription
      corrections, with the linen cushion and spread-out towel both retained. No exact weave or modern
      fabric grade is specified.
    reason: textual_variant
  - marker: '5'
    text: Righteousness can also be rendered justice. The selected clause asks about it in addition to
      sins; it does not cancel the prior confession or state that righteousness belongs only to Hermas
      himself. The Latin versions and Ethiopic edition’s Latin rendering use corresponding justice language.
    reason: textual_variant
  - marker: '6'
    text: For your household renders eis ton oikon sou. The selected source says receive some share of
      it. Athos PlateII additionally has with yourself, and Sinaiticus9.6 ca changes the preceding some-share-of-it
      wording to with yourself. Vulgata printed13 and Palatina printed31 have a share of it in your house;
      the Ethiopic edition’s Latin rendering printed117 says bring a share to your house. The working
      formulation is retained.
    reason: textual_variant
  - marker: '7'
    text: Elders renders presbyterous, which may refer to older men or community elders here; the selected
      clause itself does not describe an office. Vulgata printed13 and the Ethiopic edition’s Latin rendering
      printed117 retain a plural. Palatina printed31 prints seniors as an editorial emendation against
      reported singular senior forms; that edited plural is not counted as unchanged codex wording.
    reason: textual_variant
  - marker: '8'
    text: The selected Greek has the Name without a possessive, as already rendered in the prior English.
      Athos PlateII has his Name; Sinaiticus9.9 has my Name, with ca changing word order but retaining
      my. Vulgata printed14 and Palatina printed33 have his name; the Ethiopic edition’s Latin rendering
      printed118 has his name and describes those people as having met death, rather than the working
      suffered. The selected bare expression and suffered wording remain without an added referent.
    reason: textual_variant
  - marker: a
    text: An alternative order is What I say to you—sit, she says. This retains the woman’s command and
      the seating action, without adding an explanation of the elders’ absence.
    reason: lexical_alternative
  - marker: b
    text: An alternative is many things are lacking for you to sit with them. The following perseverance
      command, promise of sitting, and conditions of doing their works and bearing what they bore remain;
      no list of the lacking things is supplied here.
    reason: lexical_alternative
  - marker: c
    text: An alternative is stop asking all these things about your sins. The working Greek has asking,
      while Vulgata printed13 and the Ethiopic edition’s Latin rendering printed117 phrase this as praying
      only for sins and also for righteousness. Palatina printed31 has asking and adds a silence command.
      These versional formulations are not substituted for the selected asking wording.
    reason: lexical_alternative
  - marker: d
    reason: textual_variant
    text: The opening selected sentence is elliptical beneath the Vision III heading; vision makes its
      implied topic explicit in English. Athos PlateII, the printed Latin versions and the Ethiopic edition’s
      Latin rendering have an explicit vision noun. Sinaiticus9.1 lacks it in its short opening. No missing
      Greek word is silently inserted into the working source.
  - marker: e
    reason: textual_variant
    text: Cushion renders the printed kerbikarion. The import had kebridarion; raw319 and normalized source
      are corrected to the actual print kerbikarion after inspection at3200px. Athos PlateII likewise
      prints kerbikarion; Sinaiticus9.4 transcribes kerbikarion without accents as well. This is a printed
      transcription repair, not a new manuscript-selection locus.
  - marker: f
    reason: textual_variant
    text: As before is present in the working text and Athos PlateII. Sinaiticus9.5 ends after my sins
      without that separate final comparison. Vulgata printed13 and the Ethiopic edition’s Latin rendering
      printed117 retain a prior-sins comparison; Palatina printed31 has again confessing sins without
      the separate as-before phrase. The selected Lord as confession recipient remains; Vulgata and Palatina
      here use God, and the Ethiopic rendering uses Lord.
  - marker: g
    reason: textual_variant
    text: The selected text has the woman arriving with six young men previously seen, standing near and
      listening to confession. Athos PlateII and Vulgata printed13 retain that arrival block and six.
      Sinaiticus9.6 and Palatina printed31 start with touching and speaking, without that whole arrival-and-listening
      block in the passage. The Ethiopic edition’s Latin rendering printed117 retains arrival with previously
      seen young men and listening, but does not give six in this sentence. It later describes the tower
      builders as six. The fuller working narrative remains; no XML gap is invented for Sinaiticus’s shorter
      text.
  - marker: h
    reason: textual_variant
    text: Stood near me follows the working epestathē, explicitly marked as Hilgenfeld’s conjecture in
      LH1891 physical319/printed303. Athos PlateII has estathē, stood; Vulgata printed13 and the Ethiopic
      edition’s Latin rendering printed117 have stood behind me. Palatina and Sinaiticus lack this arrival/listening
      block here. The conjectural Greek form is disclosed rather than claimed as a preserved manuscript
      word.
  - marker: j
    reason: textual_variant
    text: The working paragraph includes the left-side hand gesture and Hermas reasoning and grieving.
      Sinaiticus9.9 first hand lacks the central gesture/reasoning clause; S1 and ca add forms of it,
      with ca also including grieved in its addition. Athos, both Latin versions and the Ethiopic edition’s
      Latin rendering retain gesture and grief, with differing phrasing. Correctors are not additional
      manuscripts.
  - marker: k
    reason: textual_variant
    text: Remain corrects the imported menòn to the printed meinon in raw320 and normalized source. Athos
      PlateII likewise has meinon. The selected clause retains remaining in simplicity, a command to remain,
      the future sitting promise, and the concluding works/endurance conditions. Sinaiticus9.9 has several
      first-hand/corrector differences in this clause; those layers are not flattened into one reading.
      Vulgata printed14 and Palatina printed33 retain an explicit perseverance command; the Ethiopic edition’s
      Latin rendering printed118 instead has a condition of patience and continuing in simplicity.
  - marker: l
    reason: textual_variant
    text: The working promise says I will come there where you wish. Sinaiticus9.3 first lacks the explicit
      I-will-come verb, supplied by ca. Athos PlateII repeats a place-selection phrase before its come-there
      reply; the working source has the shorter sequence. Both Latin versions retain the reply; the Ethiopic
      edition’s Latin rendering printed117 narrates choosing a deserted place and sitting rather than
      the same full anticipation-and-reply sequence.
lexical_decisions:
- source_word: ἣν εἶδον, ἀδελφοί
  chosen: The vision I saw, brothers
  alternatives:
  - brethren
  - brothers and sisters
  lexicon: BDAG
  rationale: ἣν refers back to ὅρασις (vision) from the heading; ἀδελφοί is the customary fraternal address
    in early Christian literature. We keep 'brothers' for historical texture; inclusive sense can be footnoted
    if needed.
- source_word: ἀποκάλυψιν
  chosen: revelation
  lexicon: BDAG
  rationale: Standard rendering for divine disclosure; preserves apocalyptic nuance without paraphrase.
- source_word: πρεσβυτέρας
  chosen: aged woman
  alternatives:
  - old woman
  - elder woman
  lexicon: LSJ
  rationale: πρεσβυτέρα here is the female figure already introduced in Visions 1–2; rendering as 'aged
    woman' preserves literal age connotation and avoids importing ecclesial office.
- source_word: Κυρία (vocative)
  chosen: Lady
  alternatives:
  - Madam
  lexicon: BDAG
  rationale: Κυρία as respectful address to a woman; 'Lady' maintains register and echoes the narrative's
    formal tone.
- source_word: χρονίζεις
  chosen: spend your time
  alternatives:
  - linger
  - stay long
  lexicon: LSJ
  rationale: Here denotes where he usually lingers; 'spend your time' is idiomatic without losing sense.
- source_word: ὥραν πέμπτην
  chosen: the fifth hour
  alternatives:
  - about eleven o’clock
  - late morning
  lexicon: BDAG
  rationale: We retain the ancient time reference; explanatory footnote gives modern equivalent.
- source_word: συνεψήφισα τὰς ὥρας
  chosen: I counted up the hours
  alternatives:
  - I reckoned the time
  - I kept count of the hours
  lexicon: LSJ
  rationale: Preserves concrete action of calculating the hours until the appointment.
- source_word: συμπέλιον
  chosen: seat
  alternatives:
  - bench
  - couch
  lexicon: LSJ
  rationale: Rare term likely indicating a low seat/bench; 'seat' is neutral. Footnote notes furniture
    uncertainty.
- source_word: ἐλεφάντινον
  chosen: ivory
  lexicon: LSJ
  rationale: Material descriptor; straightforward.
- source_word: κερβικάριον
  chosen: cushion
  alternatives:
  - pillow
  - small cushion
  lexicon: LSJ
  rationale: Cushion renders the actual printed kerbikarion, corrected from imported kebridarion; bounded
    witness spellings are distinguished in note e.
- source_word: λινόν / λεντίον
  chosen: linen … towel
  alternatives:
  - linen cloth
  - towel
  lexicon: BDAG
  rationale: λεντίον is a towel/cloth (cf. John 13); specifying 'towel' keeps concrete domestic sense.
- source_word: καρπάσιον
  chosen: fine linen
  alternatives:
  - carbasus (fine linen)
  lexicon: LSJ
  rationale: Refers to carbasus, fine linen; 'fine linen' communicates quality to modern readers.
- source_word: ἔκθαμβος
  chosen: astonished
  alternatives:
  - aghast
  - amazed
  lexicon: BDAG
  rationale: Captures sudden, unsettling amazement; context includes fear markers.
- source_word: θεὶς τὰ γόνατα
  chosen: I knelt
  alternatives:
  - having knelt down
  lexicon: BDAG
  rationale: Idiomatic English for the posture of prayer, preserving literal action.
- source_word: ἐξωμολογούμην
  chosen: confessed
  alternatives:
  - acknowledged
  - made confession
  lexicon: BDAG
  rationale: Cultic/moral term for open confession; 'confessed' keeps the penitential register.
- source_word: νεανίσκων
  chosen: young men
  alternatives:
  - youths
  lexicon: BDAG
  rationale: '''Young men'' reads naturally and is semantically precise.'
- source_word: ἐπεστάθη μοι
  chosen: she stood near me
  alternatives:
  - she stood over me
  - she came and stood by me
  lexicon: BDAG
  rationale: Stood near follows the selected epestathē, an explicitly reported editorial conjecture; note
    h distinguishes Athos and versional positions and the absent Sinaiticus block.
- source_word: κατηκροᾶτο
  chosen: listened closely
  alternatives:
  - listened attentively
  - was listening intently
  lexicon: BDAG
  rationale: Compound emphasizes attentive listening; 'closely' captures intensity.
- source_word: παῦσαι … ἐρωτῶν
  chosen: stop asking
  alternatives:
  - cease inquiring
  - do not keep asking
  lexicon: BDAG
  rationale: Imperative with durative nuance; 'stop asking' is concise and clear.
- source_word: δικαιοσύνης
  chosen: righteousness
  alternatives:
  - justice
  lexicon: BDAG
  rationale: Default Cartha rendering; moral quality in Hermas leans toward 'righteousness'. 'Justice'
    noted in footnote for semantic range.
- source_word: μερὸς … εἰς τὸν οἶκόν σου
  chosen: share … for your household
  alternatives:
  - portion … for your house
  lexicon: BDAG
  rationale: οἶκος here likely includes household; 'share' preserves meros as portion.
- source_word: οἰκοδομεῖτε
  chosen: build
  alternatives:
  - set to building
  - start building
  lexicon: BDAG
  rationale: Simple imperative; anticipates the tower imagery without explicating it.
- source_word: πρεσβυτέρους
  chosen: elders
  alternatives:
  - older men
  lexicon: BDAG
  rationale: Term can denote age or office; 'elders' preserves possible ecclesial nuance in Hermas.
- source_word: δεξιὰ/ἀριστερὰ μέρη
  chosen: right/left side
  lexicon: BDAG
  rationale: Literal spatial terms are theologically charged (honor at right hand); keep literal.
- source_word: εὐαρεστηκότων τῷ θεῷ
  chosen: have pleased God
  alternatives:
  - have been pleasing to God
  lexicon: BDAG
  rationale: Perfect participle indicates settled status; 'have pleased God' reads smoothly.
- source_word: παθόντων εἵνεκα τοῦ ὀνόματος
  chosen: suffered for the sake of the Name
  alternatives:
  - suffered on account of the Name
  lexicon: BDAG
  rationale: Preserve the selected bare the Name; note8 distinguishes Athos/Latin his and Sinaiticus my
    without adding either possessive.
- source_word: λείπει
  chosen: lack
  alternatives:
  - are lacking
  - fall short
  lexicon: BDAG
  rationale: Direct idiom for deficiency toward a standard.
- source_word: ἐμμένεις
  chosen: remain
  alternatives:
  - continue
  - abide
  lexicon: BDAG
  rationale: Covenantal perseverance nuance; 'remain' is simple and accurate.
- source_word: ἁπλότης
  chosen: simplicity
  alternatives:
  - sincerity
  - singleness (of heart)
  lexicon: BDAG
  rationale: Hermas uses ἁπλότης as a moral quality opposed to double-mindedness; 'simplicity' preserves
    his category.
- source_word: ἐργάσωνται τὰ ἐκείνων ἔργα
  chosen: do their deeds
  alternatives:
  - work their works
  lexicon: BDAG
  rationale: Avoids archaic phrasing while keeping the work/works lexical tie.
- source_word: ὑπενέγκωσιν
  chosen: bear
  alternatives:
  - endure
  - bear up under
  lexicon: BDAG
  rationale: Carries the sense of enduring trials; 'bear' is concise and evocative.
