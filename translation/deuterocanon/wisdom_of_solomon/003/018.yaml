lexical_decisions:
- source_word: ἐάν τε
  chosen: Even if
  alternatives:
  - if indeed
  - and if
  lexicon: LSJ
  rationale: Introduces a concessive conditional in context; 'Even if' best captures the force in natural English.
- source_word: ὀξέως
  chosen: quickly
  alternatives:
  - swiftly
  - prematurely
  lexicon: LSJ
  rationale: The adverb denotes speed. 'Quickly' is the most direct rendering; 'prematurely' is interpretive and therefore left as an alternative.
- source_word: τελευτήσωσιν
  chosen: they die
  alternatives:
  - they come to an end
  - they finish life
  lexicon: LSJ
  rationale: The verb here refers to dying or reaching life's end. 'They die' is clear and idiomatic.
- source_word: ἐλπίδα
  chosen: hope
  alternatives:
  - expectation
  lexicon: LSJ
  rationale: Standard rendering; the context is eschatological expectation, well conveyed by 'hope'.
- source_word: ἡμέρᾳ διαγνώσεως
  chosen: the day of judgment
  alternatives:
  - the day of decision
  - the day of discernment
  lexicon: LSJ
  rationale: διάγνωσις can denote decision or judgment. In this context of final reckoning, 'judgment' best communicates the sense to modern readers without unnecessary obscurity.
- source_word: παραμύθιον
  chosen: comfort
  alternatives:
  - consolation
  - encouragement
  lexicon: LSJ
  rationale: The noun denotes comfort or consolation. 'Comfort' is concise and natural; 'consolation' is a close alternative.
