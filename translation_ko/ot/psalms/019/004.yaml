base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/004.yaml
  text: Their line[a] has gone out through all the earth, and their words to the end of the world. In them[b] he has set a tent for the sun,
  footnotes:
  - marker: a
    text: Or 'Their sound/voice has gone out through all the earth.' The Hebrew consonantal text reads 'their line,' but some ancient versions and many interpreters understand the sense as 'sound' or 'voice' in this poetic context.
    reason: alternative_reading
  - marker: b
    text: '''In them'' likely refers to the heavens/skies mentioned in the preceding verse.'
    reason: cross_reference
translation:
  language: ko
  text: 그들의 줄[a]은 온 땅에 퍼져 나가고, 그들의 말은 세상 끝까지 이릅니다. 그분께서는 그들 안에[b] 해를 위한 장막을 세우셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 소리’ 또는 ‘그들의 음성’. 히브리어 자음 본문은 ‘그들의 줄’을 읽지만, 몇몇 고대 역본과 많은 해석자는 이 시적 문맥에서 ‘소리’ 또는 ‘음성’의 뜻으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: ‘그들 안에’는 앞 절에서 언급된 하늘들 또는 궁창을 가리키는 것으로 보입니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֵין אֹמֶר
  english_pob_choice: There is no speech
  chosen_korean: 말이 없고
  alternatives_korean:
  - 말이 없습니다
  - 발언이 없고
  lexicon: HALOT
  rationale: אֹמֶר는 시적 평행에서 일반적인 ‘말/발언’의 부재를 가리키므로, 현대 한국어에서 자연스러운 ‘말이 없고’로 옮겨 첫 절의 부정을 간결하게 살렸습니다.
- source_word: וְאֵין דְּבָרִים
  english_pob_choice: and there are no words
  chosen_korean: 언어도 없으며
  alternatives_korean:
  - 말들도 없으며
  - 단어들도 없으며
  lexicon: HALOT
  rationale: דְּבָרִים는 단순한 ‘단어’보다 말의 내용과 표현 전체를 가리킬 수 있어, 시적 병렬을 살리면서도 현대 한국어에서 자연스러운 ‘언어도 없으며’로 넓게 옮겼습니다.
- source_word: בְּלִי נִשְׁמָע קוֹלָם
  english_pob_choice: their voice is not heard
  chosen_korean: 그들의 소리도 들리지 않습니다
  alternatives_korean:
  - 그들의 음성도 들리지 않습니다
  - 그들의 목소리도 들리지 않습니다
  lexicon: HALOT
  rationale: קוֹל은 문맥상 ‘voice’와 ‘sound’ 둘 다 가능하므로, 청각적 울림까지 포함하는 중립적 ‘소리’로 번역해 영어 주석의 어휘적 긴장을 보존했습니다.
theological_decisions:
- issue: 자연의 증언을 ‘말 없는 선포’로 풀어 쓸지 여부
  chosen_reading: 겉으로는 말과 언어가 없고, 들리는 보통의 음성도 없다는 진술로 그대로 옮겼습니다.
  alternative_readings:
  - ‘말은 없지만 그들의 소리는 퍼집니다’처럼 무언의 선포를 강조하는 번역
  rationale: 히브리어의 부정문이 직접적으로 ‘말/언어/소리의 부재’를 말하므로, 시가 담은 역설을 해설적으로 풀어버리지 않고 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
