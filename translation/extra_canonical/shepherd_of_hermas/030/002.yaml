translation:
  text: Answering me, he says, "I," he says, "am appointed over reorientation[a], and I give understanding to all who reorient. Or does it not seem to you," he says, "that this very thing—to reorient—is understanding? To reorient," he says, "is great understanding. For the man who has sinned understands that he has done what is evil before the Lord, and the deed that he did rises up in his heart, and he reorients and no longer does evil, but does good abundantly, and he humbles his own soul and afflicts it, because he sinned. You see then that reorientation is great understanding."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
