  from: 'I adjure you[a], daughters of Jerusalem[c][b], by the gazelles or by the does of the field: do not stir up or awaken love until it pleases.'
  to: 'I adjure you[a], daughters of Jerusalem, by the gazelles or by the does of the field[b]: do not stir up or awaken love until it pleases[c].'
  rationale: “Adjure” is an appropriate formal English equivalent for this recurrent oath formula; replacing it with “put you under oath” is a stylistic preference, not a necessary correction. The proposal’s “until it desires to awaken” supplies an unexpressed complement and narrows the deliberately terse, ambiguous Hebrew. The needed correction is to attach the existing notes to the words or clause they explain.
