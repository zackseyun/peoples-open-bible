    in their own context.
- source_word: εὐσταθοῦντος δὲ σοῦ / βασανίσαι / ἴασις
  chosen: while you are at ease / afflict / healing
  alternatives:
  - while you are well established / torment / remedy
  lexicon: Working Greek and bounded primary witness comparison; no new lexicon lookup.
  rationale: Restore the explicit subject of the household contrast and retain the strong demand and healing
    image with alternatives disclosed.
