id: JOB.23.9
reference: Job 23:9
source:
  edition: WLC
  text: שְׂמֹ֣אול בַּ/עֲשֹׂת֣/וֹ וְ/לֹא אָ֑חַז יַעְטֹ֥ף יָ֝מִ֗ין וְ/לֹ֣א אֶרְאֶֽה־׃
translation:
  text: In the north, when he is at work, I cannot lay hold of him; he veils himself in the south[a], and I cannot see him.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “on the left ... on the right”; these are north and south when facing east.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאול
  chosen: on the left
  alternatives:
  - to the north
  - on the north side
  lexicon: HALOT
  rationale: The noun literally denotes 'left' and by extension can indicate 'north.' In this poetic context paired with 'right,' the directional contrast is best preserved as 'left ... right' rather than converting to compass points.
- source_word: בַּעֲשֹׂתוֹ
  chosen: when he is at work
  alternatives:
  - in his doing
  - when he acts
  lexicon: HALOT
  rationale: The preposition ב plus infinitive construct of עשה with 3ms suffix yields a temporal sense, 'in/when he does.' 'When he is at work' gives natural English while preserving the idea of God's activity.
- source_word: אָחַז
  chosen: I cannot lay hold of him
  alternatives:
  - I do not perceive him
  - I do not seize him
  lexicon: HALOT
  rationale: Retains the verb’s concrete grasping image in a context of failed encounter.
- source_word: יַעְטֹף
  chosen: he covers himself
  alternatives:
  - he wraps himself
  - he covers himself
  - he hides himself
  lexicon: HALOT
  rationale: Preserves the source image of covering/veiling rather than replacing it with an inferred turn.
- source_word: יָמִין
  chosen: to the right
  alternatives:
  - on the right side
  - to the south
  lexicon: HALOT
  rationale: As with שְׂמֹאול, the basic spatial contrast in the verse is left/right. Rendering with body-oriented directions preserves the Hebrew parallelism better than compass directions.
- source_word: אֶרְאֶה
  chosen: I do not see him
  alternatives:
  - I cannot see him
  - I do not perceive him
  lexicon: HALOT
  rationale: The verb ראה straightforwardly means 'see.' Supplying 'him' is required in English from the context of Job's inability to perceive God.
