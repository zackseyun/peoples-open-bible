  meaning_decisions:
  - source_phrase: ወትእዛዙ፡ በሐሊና፡ ልብክሙ
    prior_rendering: And command them in the thought of your hearts
    new_rendering: Give these commands with heartfelt resolve
    rationale: This preserves the command reading supplied in the record while expressing the heart's thought as inward deliberation and resolve. It avoids introducing unidentified people as the recipients of 'command them.'
  - source_phrase: ያሜክሮዎሙ፡ ኃጥኣን፡ ለሰብእ
    prior_rendering: sinners will tempt men
    new_rendering: sinners will entice people
