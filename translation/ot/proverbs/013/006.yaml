  from: Righteousness guards the blameless in the way[a], but wickedness overturns sin.
  to: Righteousness guards the one whose way is blameless, but wickedness overturns the sinner.[a]
  rationale: תם דרך is a compressed characterization of a person whose conduct is blameless; the current “the blameless in the way” is unclear and does not express the relation. In this antithetic proverb, חַטָּאת functions as a person characterized by sin. “Wickedness overturns sin” is semantically misleading, whereas “the sinner” gives the coherent parallel. The note candidly records the ordinary lexical sense and the contextual basis for the personal rendering.
