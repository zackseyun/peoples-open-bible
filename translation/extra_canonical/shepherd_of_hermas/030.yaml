translation:
  text: 'II.1. I asked him again, saying, "Since the Lord has counted me worthy that you should dwell
    with me always, bear with a few more words from me, since I understand nothing, and my heart has been
    hardened by my former deeds[b]. Give me understanding, for I am very foolish and altogether perceive
    nothing."


    II.2. Answering me, he says, "I," he says, "am over repentance[a][1], and I give understanding to
    all who repent. Or does it not seem to you," he says, "that this very thing—to repent—is understanding?
    To repent," he says, "is great understanding. For [the man] who has sinned[3] understands that he
    has done what is evil before the Lord, and the deed that he did comes up upon his heart[2], and he
    repents and no longer works the evil, but works the good lavishly[4], and he humbles his own soul
    and chastises it[d], because he sinned. You see then that repentance is great understanding."


    II.3. "For this reason then," I say, "sir,[5] I seek to learn everything exactly from you: first,
    because I am a sinner; then, because I do not know by doing what works I shall live, for my sins are
    many and manifold[c]."


    II.4. "You will live," he says, "if you keep my commandments and walk in them; and whoever, having
    heard these commandments, keeps them, will live to God[6]."'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: I am over repentance may also be I preside over repentance. The messenger claims to give understanding
      to all who repent; the source equates repenting itself with understanding rather than reducing it
      to feeling sorry. AthosPlateVlines34–37and both Latin versions retain the cognate understanding/repentance
      argument. Sinaiticus30.2retains the argument, but at its close the first-hand reading lacks the
      repeated understanding and has a difficult great spelling; S1/ca/d add understanding in that closing
      sentence. Correctors are not additional manuscripts.
    reason: lexical_alternative
  - marker: '2'
    text: Literally “goes up upon his heart,” an idiom for a deed coming forcibly to mind or weighing
      on one’s conscience.
    reason: cultural_note
  - marker: '3'
    text: The working II.2brackets ho aner, the man, before the one who has sinned; the English now displays
      that bracket. Sinaiticus30.2has the man without supplied markup at this point; AthosPlateVline35has
      the one who has sinned without the extra noun. Vulgata41prints qui peccavit as an editorial emendation
      against reported quia peccavit in its codices, so its printed correction is not an independent Latin
      noun witness. Palatina81has the one who has sinned. The working supplement is retained and disclosed.
    reason: textual_variant
  - marker: '4'
    text: Lavishly renders polyteleos; alternatives include abundantly or generously. AthosPlateVline36and
      Sinaiticus30.2retain the adverb. Palatina81has abundanter; Vulgata41has working well without a separate
      lavishly word. The stated sequence no longer evil, but good lavishly, self-humbling and chastising/tormenting
      is retained without adding a particular penitential practice.
    reason: lexical_alternative
  - marker: '5'
    text: Sir renders kyrie as respectful address to the messenger; Lord remains for the divine referent.
      Working II.3eita agnoo, then I do not know, is Harmer’s conjecture, explicitly reported on physical337against
      Athos/L1hina gno, so that I may know, with L2support for his change. Vulgata41has ut sciam, so that
      I may know; Palatina81has denique quia ignoro, then because I do not know. The English follows the
      working conjecture, with that alternative fully disclosed in note c.
    reason: lexical_alternative
  - marker: '6'
    text: “Will live to God” preserves the Greek dative; many would say “live for God.”
    reason: lexical_alternative
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: b
    reason: textual_variant
    text: The working II.1has Lord and has been hardened. Vulgata41has God, whereas Palatina81has Lord;
      Sinaiticus30.1has my Lord and a differently spelled/difficult heart verb (peperotai), with dotted
      letters elsewhere in the sentence. Palatina has blinded, while Vulgata has hardened. The working
      hardened reading is retained, not harmonized to the blinded alternative.
  - marker: c
    reason: textual_variant
    text: Working II.3reads first because I am a sinner; then I do not know by doing what works I shall
      live. The alternative reported Athos/L1reading would instead say first because I am a sinner, so
      that I may know by doing what works I shall live. AthosPlateVline38and Vulgata41support the purpose
      wording; Palatina81supports then because I do not know. Sinaiticus30.3preserves the opening through
      first, but its next column is severely damaged, generally only line-initial letters. The XML ab
      also contains supplied fragments of subsequent M4iii; it is not a complete II.3transcription and
      cannot decide this conjunction or attest all ofII.4. Working II.4keeps the condition of keeping
      the commandments and walking in them; no missing Greek/English extent is claimed.
  - marker: d
    reason: lexical_alternative
    text: Basanizei has the force of tormenting, afflicting or chastising the soul. Standard chastises
      and simplified torments retain that difficult statement; neither replaces it with mere regret nor
      adds a method. AthosPlateVline36and Sinaiticus30.2have the verb; Vulgata41and Palatina81use torquere.
lexical_decisions:
- source_word: ὁ Κύριος
  chosen: the Lord
  alternatives:
  - the Master
  lexicon: BDAG
  rationale: Here the referent is clearly God; rendering as “the Lord” preserves covenantal resonance
    and is consistent with our default for κύριος when used of God.
- source_word: ἀνασχοῦ
  chosen: bear (with)
  alternatives:
  - endure
  - put up with
  lexicon: LSJ
  rationale: Aorist imperative of ἀνέχω; ‘bear a few words from me’ retains the polite request nuance
    and early-Christian register.
- source_word: συνίω / σύνεσις / συνέτισόν
  chosen: understand / understanding / give me understanding
  alternatives:
  - comprehend / insight / make me wise
  lexicon: BDAG
  rationale: Keeping the cognate chain transparent strengthens the rhetorical link in the passage that
    repentance itself is ‘understanding’.
- source_word: πεπώρωται
  chosen: has been hardened
  alternatives:
  - has grown dull
  - has been calloused
  lexicon: BDAG
  rationale: Carries a moral-spiritual hardening sense; ‘hardened’ preserves biblical-ethical weight without
    over-interpretation.
- source_word: πράξεις
  chosen: deeds
  alternatives:
  - acts
  - works
  lexicon: BDAG
  rationale: ‘Deeds’ fits the moral context and allows ‘works’ later to render ἐργάζομαι without redundancy.
- source_word: ἐπὶ τῆς μετανοίας
  chosen: over repentance
  alternatives:
  - over reorientation
  - over repentance
  - in charge of repentance
  - concerning repentance
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial
    assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: μετανοέω / μετάνοια
  chosen: repent / repentance
  alternatives:
  - reorient / reorientation
  - repent / repentance
  - change one’s mind / change of mind
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial
    assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: σύνεσίς ἐστιν μεγάλη
  chosen: is great understanding
  alternatives:
  - is a great insight
  - is great prudence
  lexicon: BDAG
  rationale: Maintains lexical consistency with σύνεσις in the passage and emphasizes the evaluative ‘great’
    without importing ‘wisdom’ as a different concept.
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν
  chosen: comes up upon his heart
  alternatives:
  - comes to mind
  - weighs upon his heart
  lexicon: LSJ
  rationale: Literal rendering preserves Semitic/early-Christian idiom; a footnote explains the sense.
- source_word: ἐργάζεται (τὸ πονηρόν / τὸ ἀγαθόν)
  chosen: works (the evil / the good)
  alternatives:
  - does
  - practices
  lexicon: BDAG
  rationale: ‘Works’ preserves the habitual/active connotation and pairs with ‘deeds’ in the context.
- source_word: πολυτελῶς
  chosen: lavishly
  alternatives:
  - abundantly
  - generously
  - eagerly
  lexicon: LSJ
  rationale: Primary sense is ‘costly, splendidly, lavishly’; here it vividly underscores zeal and generosity
    in good works.
- source_word: ταπεινοῖ
  chosen: humbles
  alternatives:
  - makes low
  - brings low
  lexicon: BDAG
  rationale: Standard ethical sense of self-humbling fits the penitential context.
- source_word: βασανίζει
  chosen: chastises
  alternatives:
  - torments
  - punishes
  - afflicts
  lexicon: BDAG
  rationale: Conveys rigorous self-discipline without suggesting gratuitous self-harm; matches penitential
    nuance.
- source_word: ἐξακριβάζομαι
  chosen: seek to learn exactly
  alternatives:
  - ascertain carefully
  - inquire precisely
  lexicon: LSJ
  rationale: Captures the intensive idea of exact inquiry without wooden literalism.
- source_word: κύριε (vocative)
  chosen: sir
  alternatives:
  - lord
  - master
  lexicon: BDAG
  rationale: Here it is a respectful address to the heavenly messenger, not to God; ‘sir’ avoids confusion
    with ‘the Lord’ in the same context.
- source_word: ἐντολάς
  chosen: commandments
  alternatives:
  - commands
  - precepts
  lexicon: BDAG
  rationale: ‘Commandments’ preserves weight and echoes intra-Hermas moral instruction vocabulary.
- source_word: φυλάξῃς
  chosen: keep
  alternatives:
  - observe
  - guard
  lexicon: BDAG
  rationale: Standard ethical idiom ‘keep the commandments’ fits the context.
- source_word: πορευθῇς ἐν αὐταῖς
  chosen: walk in them
  alternatives:
  - conduct yourself in them
  - live by them
  lexicon: BDAG
  rationale: Idiomatic biblical-ethical phrasing; keeps the imagery of path/way.
- source_word: ζήσῃ / ζήσεται τῷ Θεῷ
  chosen: you will live / will live to God
  alternatives:
  - will live for God
  - will live with God
  lexicon: BDAG
  rationale: Preserves the dative ‘to God’ (orientation) rather than smoothing to ‘for’; maintains distinctive
    Hermas phrasing.
- source_word: πολλαί… ποικίλαι
  chosen: many and manifold
  alternatives:
  - many and various
  lexicon: BDAG
  rationale: ‘Manifold’ keeps the elevated tone and pairs well with ‘many’ to express diversity of sins.
