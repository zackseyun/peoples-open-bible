  meaning_decisions:
  - source_phrase: וְהִתְוַדּוּ ... וְהֵשִׁיב ... וְנָתַן
    prior_rendering: they shall confess ... he shall make full restitution ... and give it
    new_rendering: They must confess ... make full restitution ... and pay the total
    rationale: Consistent pronouns express the law's application to either the man or the woman named in verse 6, while 'must' makes the legal obligation clear.
  - source_phrase: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
    prior_rendering: make full restitution for his guilt
    new_rendering: make full restitution
    rationale: Here the noun denotes the compensation owed because of the wrong, not guilt as something repayable or a sacrificial offering.
  - source_phrase: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
    prior_rendering: adding a fifth to it
    new_rendering: add a fifth to the amount
    rationale: The added fifth is calculated on the full restitution amount.
  - source_phrase: לַאֲשֶׁר אָשַׁם לוֹ
    prior_rendering: to the one against whom he was guilty
    new_rendering: to the person they wronged
    rationale: This identifies the injured recipient directly in natural English; guilt is already established in verse 6.
