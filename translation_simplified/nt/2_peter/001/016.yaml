translation:
  language: en
  text: 'We did not tell you about the power and coming[a] of our Lord Jesus Christ[b] on the basis of cleverly invented myths. Instead, we spoke as eyewitnesses: we had seen his majesty with our own eyes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word can also mean “presence” or “arrival,” though here it likely refers to the Messiah’s future coming.
    reason: alternative_reading
  - marker: b
    text: Greek “Christ”; “Messiah” expresses the title’s meaning.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: we did not make known to you
  simplified_phrase: we did not tell you about
  preserved_meaning: Peter and the other witnesses communicated this message to their readers.
  reasoning_layer_used: Lexical decision for ἐγνωρίσαμεν
  rationale: “Tell you about” expresses disclosure in familiar English.
- pob_phrase: by following cleverly devised myths
  simplified_phrase: on the basis of cleverly invented myths
  preserved_meaning: Their message was not derived from artfully fabricated stories.
  reasoning_layer_used: Lexical decisions for σεσοφισμένοις μύθοις and ἐξακολουθήσαντες
  rationale: “On the basis of” clearly preserves the source’s instrumental contrast.
- pob_phrase: but by becoming eyewitnesses of his majesty
  simplified_phrase: 'Instead, we spoke as eyewitnesses: we had seen his majesty with our own eyes'
  preserved_meaning: Their proclamation rested on direct sight of Jesus’ majesty.
  reasoning_layer_used: Lexical decisions for ἐπόπται, γενηθέντες, and μεγαλειότητος
  rationale: The added explanation makes the evidentiary force of “eyewitnesses” immediately clear.
translation_notes:
  risk_flags:
  - risk: “Coming” could be understood only as Jesus’ first arrival.
    mitigation: Footnote [a] preserves the lexical range and identifies the likely future sense.
  - risk: Expanding “eyewitnesses” could overstate what the witnesses directly observed.
    mitigation: The wording remains limited to the source’s claim that they saw Jesus’ majesty.
