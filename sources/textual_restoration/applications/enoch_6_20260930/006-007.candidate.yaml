translation:
  text: 'And these are the names of their angels: Semiazaz—he was their angel[a]—Arakibaremeel,[b] Kokabiel, Tamiel, Ramiel, Danel, Ezeqeel, Baraqiyel, Asael, Armaros, Baterel, Ananel, Zaqeel, Samsapeel, Saterel, Turel, Yomyael, and Arazial.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The printed Geʿez has “their angels” and “their angel”; Charles places an asterisk before the word for “their angels.” Rendering these expressions as “their leaders” and “their leader” would be a contextual interpretation.
    reason: textual_variant
  - marker: b
    text: Charles prints Arakibaremeel as one asterisked name. His apparatus records variant forms and a division of the name. The combined printed form is retained here.
    reason: textual_variant
  - marker: c
    text: Charles encloses Arazial in daggers, marking a textual crux. The printed form is retained without reconstruction.
    reason: textual_variant
lexical_decisions:
- source_word: መላእክቲሆሙ / መልአኮሙ
  chosen: their angels / their angel
  alternatives:
  - their leaders
  rationale: Retains the source’s repeated angel terminology rather than replacing it with a contextual interpretation.
- source_word: አራኪበረሜኤል
  chosen: Arakibaremeel
  alternatives:
  - Arakiba, Remeel
  rationale: The supplied witness presents the letters as one name; the translation does not silently divide it.
- source_word: አራዝያል
  chosen: Arazial
  rationale: Transliterates the supplied reading without substituting a name from another textual tradition.
- source_word: printed Watcher names
  chosen: printed Geʿez transliterations
  rationale: Names remain in the printed edition’s form; variants are noted rather than harmonized to a later English list.
theological_decisions:
- issue: Whether to identify the named angels explicitly as leaders
  chosen_reading: Retain “angels” in the main text.
  alternative_readings:
  - Render the term contextually as “leaders.”
  rationale: The Ge'ez witness uses angel terminology; leadership may be implied by the surrounding account but is not made explicit in this verse’s wording.
