  text: '1 …that belong to corruption and its ways, ways that cannot be traced out. But if you endure and stand in his fear and do not go astray from his law, the times will be changed in their season for good, and you will see the consolation of Zion.


    2 For what exists now is nothing; but what is to come will be exceedingly great.


    3 For everything corruptible passes away and comes to nothing, and the time that has been is now forgotten; nor after this is it sought in remembrance.


    4 For what has been passes over into corruption, and what is corrupted falls and is forgotten. But what is to come is what is sought; what has passed from the hand is no longer reckoned.


    5 For when the time that does not pass away comes and its season arrives, it sets its deeds in order and examines its sins. Those who belong to it do not add anguish to destruction.


    6 And if there are any who are appointed for it, it is not withheld from them; and for those who live in it there is no leading to destruction.


    7 Therefore, let those who desire to see it beware of the time spoken of, and let them pass beyond the burden of the troubled time.


    8 But those who turned themselves toward anguish and received lies, and lost the settledness of hope, and were sought out in vanities, and did not spare mercy, nor keep the path of discipline—


    9 they desire to inquire into the hidden anguish of the people to come; but the visitation of that matter by which many were justified …'
translation:
  language: ko
  text: '그러므로 부패와 그 길에 속한 자들—그 길은 헤아려 찾을 수 없습니다. 그러나 여러분이 견디며 그의 두려움 안에 서고, 그의 율법에서 벗어나지 않는다면, 때가 이르렀을 때 시대는 선으로 바뀔 것이며, 여러분은 시온의 위로를 보게 될 것입니다.


    지금 있는 것은 아무것도 아니지만, 장차 올 것은 매우 클 것입니다.


    왜냐하면 썩을 것은 모두 사라져 아무것도 아니게 되고, 이미 있었던 때는 이제 잊혀지며, 그 뒤에도 기억 속에서 찾지 않기 때문입니다.


    이미 있었던 것은 부패로 넘어가고, 부패한 것은 쓰러져 잊혀집니다. 그러나 장차 올 것은 찾게 되며, 손에서 지나간 것은 더 이상 헤아려지지 않습니다.


    왜냐하면 지나가지 않는 때가 오고 그 시기가 이르면, 그 때가 자기 행위들을 바로잡고 자기 죄들을 살핍니다. 그 때에 속한 자들, 곧 그 때에 붙들린 자들은 멸망에 고통을 더하지 않습니다.


    그리고 만일 그 때를 위해 정해진 자들이 있다면, 그것은 그들에게서 가려지지 않으며, 그 안에 사는 자들에게는 멸망으로 이끄는 일이 없습니다.


    그러므로 그것을 보고자 하는 사람들은 말해진 때를 조심하고, 흔들리는 때의 무거운 짐을 넘어가야 합니다.


    그러나 고통으로 몸을 돌리고 거짓을 받아들였으며, 희망의 굳건함을 잃고, 헛된 것들 가운데서 찾아졌으며, 긍휼을 아끼지 않고 훈계의 길을 지키지 않은 자들은—


    [a] 그들은 장차 올 백성의 감춰진 고통을 캐묻고자 합니다. 그러나 많은 사람이 의롭다 하심을 받은 그 일의 방문은 …'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܗ
  english_pob_choice: his law
  chosen_korean: 그의 율법
  alternatives_korean:
  - 그의 법
  - 그의 계명
  lexicon: νόμος
  rationale: 본문은 순종에서 벗어나지 말아야 할 규범을 가리키므로, POB의 기본값인 ‘율법’을 유지했습니다.
- source_word: ܬܪ̈ܥܝܢ / ܙܒܢ̈ܐ
  english_pob_choice: the times
  chosen_korean: 때 / 시대
  alternatives_korean:
  - 시기들
  - 시간들
  lexicon: καιρός/χρόνος 계열
  rationale: 문맥상 단순한 시각이 아니라 역사적 전환의 ‘때들’을 말하므로, 앞뒤에서 ‘때’와 ‘시대’를 함께 써서 의미를 살렸습니다.
- source_word: ܒܘܝܐܐ ܕܨܝܘܢ
  english_pob_choice: the consolation of Zion
  chosen_korean: 시온의 위로
  alternatives_korean:
  - 시온의 위안
  - 시온의 위로하심
  lexicon: παράκλησις/נחמה 계열
  rationale: 시온을 주어로 하지 않고 소유격 구조를 따라 ‘시온의 위로’로 옮겨, 종말론적 구원 약속의 표현을 보존했습니다.
- source_word: ܡܘܣܪ
  english_pob_choice: discipline
  chosen_korean: 훈계
  alternatives_korean:
  - 징계
  - 단련
  lexicon: מוּסָר
  rationale: POB의 ‘the path of discipline’을 따라, 교육적·교정적 의미를 살릴 수 있는 ‘훈계’를 선택했습니다.
theological_decisions:
- issue: ‘his fear’의 번역에서 경외를 명시할지 여부
  chosen_reading: ‘그의 두려움 안에 서다’로 직역해 경외의 긴장감을 유지했습니다.
  alternative_readings:
  - 그를 경외하다
  - 그의 경외 안에 서다
  rationale: 본문은 단순 감정이 아니라 하나님 앞의 두려움/경외 상태를 말하지만, 원문의 어휘 긴장을 보존하기 위해 설명적 완화를 피했습니다.
  doctrine_reference: 신적 경외의 언어를 과도하게 순화하지 않음
- issue: ‘visitation’의 종말론적 심판/돌봄 뉘앙스
  chosen_reading: ‘방문’으로 남겨 두어 판단과 개입의 이중 의미를 열어 두었습니다.
  alternative_readings:
  - 권면
  - 심판
  - 돌보심
  rationale: 본문의 표현은 신적 개입의 정한 때를 가리키며, 영어 POB도 해석을 과도하게 고정하지 않았으므로 한국어도 중립적으로 보존했습니다.
  doctrine_reference: visitation의 심판-구원 양의성 유지
