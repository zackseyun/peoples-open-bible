  meaning_decisions:
  - source_phrase: גַּם מֵעוֹף הַשָּׁמַיִם שִׁבְעָה שִׁבְעָה
    prior_rendering: Also from the birds of the sky, seven and seven
    new_rendering: Also take seven pairs of every kind of bird
    rationale: The command to take animals continues from verse 2, and the same repeated numeral is best understood consistently as seven pairs; the alternative belongs in a note rather than an opaque English repetition.
  - source_phrase: לְחַיּוֹת זֶרַע עַל פְּנֵי כָל הָאָרֶץ
    prior_rendering: to keep offspring alive on the face of all the earth
