theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Force of anthropomorphic imperatives addressed to God
  chosen_reading: Retain the poetic imperatives literally ('Rise up... lift yourself up... awake')
  alternative_readings:
  - Paraphrase as 'take action' or 'intervene'
  rationale: The Hebrew uses vivid anthropomorphic prayer language. Preserving it maintains the psalm's rhetoric without importing a doctrinal claim about divine passivity or sleep.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source text''s plain sense; do not paraphrase beyond what the source warrants'
