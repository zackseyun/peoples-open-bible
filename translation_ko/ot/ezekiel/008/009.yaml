  yaml_path: translation/ot/ezekiel/008/009.yaml
  text: And he said to me, “Come and see the evil abominations that they are doing here.”
translation:
  language: ko
  text: 그가 내게 말했습니다. “와서, 그들이 여기에서 행하고 있는 악한 가증한 일들을 보십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: And he said to me
  chosen_korean: 그가 내게 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 내게 말했습니다
  - 그가 내게 이르셨습니다
  lexicon: אָמַר
  rationale: 서술문으로 자연스럽게 옮기되, 하나님의 권위 있는 발화를 암시하는 문맥이므로 평이한 '말했습니다'보다 '말씀하셨습니다'를 택했습니다.
- source_word: בֹּא וּרְאֵה
  english_pob_choice: Come and see
  chosen_korean: 들어와서 보아라
  alternatives_korean:
  - 와서 보아라
  - 오라, 보라
  lexicon: בוא + ראה
  rationale: 두 명령형을 연속된 초청으로 살리되, חזון의 현장 안으로 ‘들어오라’는 뉘앙스를 반영해 직역에 가깝게 옮겼습니다.
- source_word: הַתּוֹעֵבֹת הָרָעוֹת
  english_pob_choice: the evil abominations
  chosen_korean: 악한 역겨운 일들
  alternatives_korean:
  - 악한 가증한 일들
  - 악한 혐오스러운 일들
  lexicon: תּוֹעֵבָה + רַע
  rationale: תּוֹעֵבָה의 강한 혐오/가증 의미를 약화하지 않기 위해 '역겨운'을 택하고, 형용사 רָעוֹת는 별도로 '악한'으로 살렸습니다.
- source_word: הֵם עֹשִׂים פֹּה
  english_pob_choice: that they are doing here
  chosen_korean: 그들이 여기서 행하고 있는
  alternatives_korean:
  - 그들이 여기서 하고 있는
  - 그들이 이곳에서 저지르고 있는
  lexicon: עשה + פה
  rationale: 현재진행의 상황성과 장소 부사 'here'를 살려 '여기서 행하고 있는'으로 번역했습니다.
theological_decisions:
- issue: 의도적으로 강한 도덕적·예배적 혐오 표현을 유지할지 여부
  chosen_reading: '''역겨운 일들''로 옮겨 תּוֹעֵבָה의 성격을 완화하지 않았습니다.'
  alternative_readings:
  - 가증한 일들
  - 혐오스러운 일들
  rationale: 에스겔의 예언적 고발에서는 단순한 불쾌감이 아니라 언약 위반에 대한 강한 부정 평가가 핵심이므로, 현대어에서도 그 긴장을 유지했습니다.
  doctrine_reference: 언약적 거룩함과 우상숭배에 대한 예언자적 심판
