    τὴν οἰκοδομὴν [τοῦ πύργου] οἱ λίθοι οὗτοι, διαμενοῦσι λαμπροί, καὶ οὐδεὶς αὐτῶν μελανήσει. 3. quodsi
    de ceteris montibus adiecisset, necesse habuisset rursus visitare eam turrem atque purgare. hi autem
    omnes candidi inventi sunt, qui crediderunt et qui credituri sunt; ex eodem enim genere sunt. felix
    hoc genus, quia innocuum est. 4. audi nunc et de illis rotundis lapidibus et splendidis. hi omnes
    de hoc candido monte sunt. audi autem quare rotundi sunt reperti. divitiae suae eos pusillum obscuraverunt
    a veritate atque obfuscaverunt; a Deo vero numquam recesserunt, nec ullum verbum malum processit de
    ore eorum, sed omnis aequitas et virtus veritatis. 5. horum ergo mentem cum vidisset Dominus, †posse
    eos veritati favere,† bonos quoque permanere, iussit opes eorum circumcidi, non enim in totum eorum
    tolli, ut possint aliquid boni facere de eo quod eis relictum est, et vivent Deo, quoniam ex bono
    genere sunt. ideo ergo pusillum circumcisi sunt et positi sunt in structuram turris huius.
