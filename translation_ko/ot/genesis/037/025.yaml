    issue: צֳרִי를 ‘유향’으로 번역함
    rationale: צֳרִי는 발삼/향유성 수지(balm)이지 유향(frankincense)이 아닙니다. 따라서 물품 목록의 둘째 항목은 ‘발삼’으로 고쳐야 합니다.
  - severity: medium
    issue: לֹט를 단정적으로 ‘몰약’으로 번역함
    rationale: לֹט는 흔히 라다넘으로 이해되며 식물·수지의 정확한 식별에는 논의가 있습니다. 영어 POB의 myrrh는 히브리어 본문 자체보다 좁은 해석이므로, 본문에는 통상적 식별인 ‘라다넘’을 쓰고 각주로 대안 번역을 밝혀 불확실성을 보존하는 것이 안전합니다.
