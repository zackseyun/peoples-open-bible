revisions:
- from: 그의 아버지 집의 모든 영광이 그에게 달릴 것이니 곧 자손과 후손이며, 작은 그릇마다, 대접에서부터 모든 항아리에 이르기까지입니다.
  to: 그들이 그의 아버지 집안의 모든 영예를 그에게 매달 것입니다. 곧 자손과 곁가지들, 작은 그릇 하나하나, 대접들부터 온갖 항아리까지입니다.
  rationale: 능동 복수형을 명시하고, 가문의 ‘영예’ 아래 열거되는 자손·곁가지·작은 기물의 동격 구조를 유지했습니다. ‘곁가지들’은 원문의 식물적 파생 이미지를 보존하되, 특정 신학적 또는 사회사적 해석을 덧붙이지 않습니다.
