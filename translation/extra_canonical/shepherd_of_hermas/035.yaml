  from: '“I said to you,” he says, “that the things created by God are twofold; for self‑control is twofold
    as well. For with regard to some things one must hold back, and with regard to others one must not.


    “Make it known to me, Lord,” I say, “with respect to what things one must hold back, and with respect
    to what things one must not.” “Listen,” he says: “Hold back from what is evil and do not do it; but
    do not hold back from what is good—rather, do it. For if you hold back from doing the good, you work
    a great sin; but if you hold back from doing what is evil, you work great righteousness. Therefore
    restrain yourself from every wickedness, doing the good.”


    “What kinds, Lord,” I say, “are the wickednesses from which we must restrain ourselves?” “Listen,”
    he says: “From adultery and fornication, from lawless drunkenness,[2] from wicked luxury, from many
    foods[3] and the extravagance of wealth and boasting and haughtiness and arrogance, and from lying
    and slander and hypocrisy, resentment, and every blasphemy.


    “These deeds are the worst of all in the life of human beings. From these works, then, the slave of
    God must restrain himself; for the one who does not restrain himself from these is not able to live
    to God.[4] Listen, then, also to the things that follow these.”


    “Are there still,” I say, “Lord, evil works?” “And indeed there are many,” he says, “from which the
    slave of God must restrain himself: theft, falsehood, defrauding, false testimony, greed, evil desire,
    deceit, vainglory, boastful pretension, and whatever things are like these.”


    “Do these not seem to you to be evil?” “And very evil,” I say, “for the slaves of God.” “From all
    these the one who serves God must restrain himself. Restrain yourself, then, from all these, that
    you may live to God and be enrolled[5] with those who restrain themselves from them. These, then,
    are the things from which you must restrain yourself.


    “But the things from which you must not restrain yourself,” he says, “but rather do them—listen: Do
    not hold back from the good, but do it.”


    “And of the good things, Lord,” I say, “declare to me their power, so that I may walk in them and
    serve them, that by practicing them I may be able to be saved.” “Listen,” he says, “also to the works
    of the good, which you must do and not hold back from.


    “First of all: faith, fear of the Lord, love, concord, words of righteousness,[6] truth, endurance—there
    is nothing better than these in the life of human beings. If someone keeps these and does not hold
    back from them, he becomes blessed in his life.


    “Next, hear what follows these: to serve widows; to visit orphans and those in want; to redeem the
    slaves of God from distresses;[7] to be hospitable (for in hospitality one sometimes finds an opportunity
    for doing good[12]); to oppose no one; to be quiet;[8] to make yourself one who has less than all
    people;[9] to honor the elderly; to practice righteousness; to preserve the brotherhood; to endure
    insult; to be long‑suffering; to have no resentment; to encourage those who are weary in soul; not
    to cast off those who have been scandalized away from the faith,[10] but to turn them back and make
    them cheerful; to admonish those who sin; not to press debtors and the needy;[11] and if there is
    anything that is like these.”


    “Do these seem to you to be good?” “What, Lord, is better than these?” I say. “Go, then,” he says,
    “walk in them and do not hold back from them, and you will live to God.


    “Therefore guard this commandment. If you do the good and do not hold back from it, you will live
    to God—and all who act in this way will live to God. And again, if you do not do the evil and restrain
    yourself from it, you will live to God; and all will live to God—whoever keeps these commandments
    and walks in them.”'
  to: '“I said to you,” he says, “that the things created by God are twofold; for self‑control is twofold
    as well. For with regard to some things one must exercise self‑control, and with regard to others
    one must not.


    “Make it known to me, Lord,” I say, “with respect to what things one must exercise self‑control, and
    with respect to what things one must not.” “Listen,” he says: “Exercise self‑control with regard to
    what is evil and do not do it; but do not exercise self‑control with regard to what is good—rather,
    do it. For if you exercise self‑control so as not to do the good, you commit a great sin; but if you
    exercise self‑control so as not to do what is evil, you accomplish great righteousness. Therefore
    exercise self‑control from every wickedness, doing the good.”


    “What kinds, Lord,” I say, “are the wickednesses from which we must exercise self‑control?” “Listen,”
    he says: “From adultery and fornication, from lawless drunkenness,[2] from wicked luxury, from many
    foods[3] and the extravagance of wealth and boasting and haughtiness and arrogance, and from lying
    and slander and hypocrisy, resentment, and every blasphemy.


    “These deeds are the most evil of all in the life of human beings. From these works, then, the slave
    of God must exercise self‑control; for the one who does not exercise self‑control from these is not
    able to live to God.[4] Listen, then, also to the things that follow these.”


    “Are there still,” I say, “Lord, evil works?” “Indeed, there are many,” he says, “from which the slave
    of God must exercise self‑control: theft, falsehood, defrauding, false testimony, greed, evil desire,
    deceit, vainglory, boastfulness, and whatever things are like these.”


    “Do these not seem to you to be evil?” “Very evil,” I say, “for the slaves of God.” “From all these
    the one who serves God must exercise self‑control. Exercise self‑control, then, from all these, that
    you may live to God and be enrolled[5] with those who exercise self‑control from them. These, then,
    are the things from which you must exercise self‑control.


    “But the things from which you must not exercise self‑control,” he says, “but rather do them—listen:
    Do not exercise self‑control with regard to the good, but do it.”


    “And of the good things, Lord,” I say, “declare to me their power, so that I may walk in them and
    serve them, that by practicing them I may be able to be saved.” “Listen,” he says, “also to the works
    of the good, which you must do and not exercise self‑control from.


    “First of all: faith, fear of the Lord, love, concord, words of righteousness,[6] truth, endurance—there
    is nothing better than these in the life of human beings. If someone keeps these and does not exercise
    self‑control from them, he becomes blessed in his life.


    “Next, hear what follows these: to serve widows; to visit orphans and those in want; to redeem the
    slaves of God from distresses;[7] to be hospitable (for in hospitality one sometimes finds an opportunity
    for doing good[12]); to oppose no one; to be quiet;[8] to become lower than all people;[9] to honor
    the elderly; to practice righteousness; to preserve the brotherhood; to endure insult; to be long‑suffering;
    to have no resentment; to encourage those who are weary in soul; not to cast off those who have stumbled
    away from the faith,[10] but to turn them back and make them cheerful; to admonish those who sin;
    not to oppress debtors and the needy;[11] and if there is anything like these.


    “Do these seem to you to be good?” “What, Lord, is better than these?” I say. “Go, then,” he says,
    “walk in them and do not exercise self‑control from them, and you will live to God.


    “Therefore keep this commandment. If you do the good and do not exercise self‑control from it, you
    will live to God—and all who act in this way will live to God. And again, if you do not do the evil
    and exercise self‑control from it, you will live to God; and all will live to God—whoever keeps these
    commandments and walks in them.”'
  rationale: 'Revised the repeated rendering of ἐγκρατεύομαι from ''hold back/restrain yourself'' to the
    more lexically consistent ''exercise self-control,'' which better matches the noun ἐγκράτεια in this
    passage. Also adjusted several phrases for accuracy and register: ''work'' to ''commit/accomplish,''
    ''worst of all'' to ''most evil of all,'' ''And indeed'' to ''Indeed,'' ''boastful pretension'' to
    ''boastfulness,'' ''make yourself one who has less than all people'' to ''become lower than all people,''
    ''scandalized away from the faith'' to ''stumbled away from the faith,'' ''press debtors'' to ''oppress
    debtors,'' and ''guard this commandment'' to ''keep this commandment.'''
