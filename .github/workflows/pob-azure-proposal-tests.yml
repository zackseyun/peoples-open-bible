name: Azure POB proposal - offline only
on:
  pull_request:
    paths:
      - 'tools/pob_publisher/**'
      - 'tests/test_pob_azure_stage_proposal.py'
      - 'tests/fixtures/pob_publisher/**'
      - '.github/workflows/pob-azure-proposal-tests.yml'
      - '.github/workflow-proposals/publish-pob-azure.yml'
permissions:
  contents: read
jobs:
  offline-parity-and-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable corpus fixtures, never merge or publish
        run: |
          git fetch --no-tags --depth=1 origin a3681961d91c1eb1a609e12cec312a644148f9bb
          git fetch --no-tags --depth=1 origin 3ca33e73a8b5dc73b98852a1add96cbb58fb63a1
          git fetch --no-tags --depth=1 origin ab73737d415d953359073b63a8eea3878af75d8c
          git fetch --no-tags --depth=1 origin b9e9148f63b3396c13ef2502e14353a071e3b44b
      - run: npm ci --prefix tools/pob_publisher --ignore-scripts --no-audit --no-fund
      - name: Compile pinned complete datasets and verify exact parity
        run: npm test --prefix tools/pob_publisher
      - name: Fake-store tests only, no Azure SDK or cloud client
        run: python3 -m unittest discover -s tests -p test_pob_azure_stage_proposal.py -v
