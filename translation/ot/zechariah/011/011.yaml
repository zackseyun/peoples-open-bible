  - source_phrase: וַתֻּפַר בַּיּוֹם הַהוּא
    prior_rendering: So it was broken on that day
    new_rendering: So the covenant was broken that day
    rationale: The feminine verb refers to the covenant, not the masculine staff; naming the antecedent makes the symbolic action’s meaning clear.
  - source_phrase: עֲנִיֵּי הַצֹּאן
    prior_rendering: the afflicted of the flock
