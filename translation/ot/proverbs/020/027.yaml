id: PRO.20.27
reference: Proverbs 20:27
source:
  edition: WLC
  text: נֵ֣ר יְ֭הוָה נִשְׁמַ֣ת אָדָ֑ם חֹ֝פֵ֗שׂ כָּל חַדְרֵי בָֽטֶן־־׃
translation:
  text: The spirit of man[a] is Yahweh's lamp, searching every inner chamber[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “the breath of man.”
    reason: alternative_reading
  - marker: b
    text: Literally, “all the chambers of the belly,” an expression for the hidden depths of a person's inner being.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר
  chosen: lamp
  alternatives:
  - light
  lexicon: HALOT
  rationale: נֵר ordinarily denotes a lamp rather than an abstract 'light.' 'Lamp' preserves the concrete metaphor of illumination and examination.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: נִשְׁמַת
  chosen: spirit
  alternatives:
  - breath
  - soul
  lexicon: HALOT
  rationale: נשמה can denote breath or spirit/life-breath. In this proverb it refers to the inward animating principle by which a person is examined and examines; 'spirit' best captures that anthropological sense in idiomatic English while preserving the metaphorical force.
- source_word: אָדָם
  chosen: man
  alternatives:
  - humankind
  - a person
  lexicon: HALOT
  rationale: Here אָדָם is generic but singular, referring representatively to a human being. Per doctrine's gender-accurate principle, 'man' preserves the singular representative force better than the pluralizing 'humankind.'
- source_word: חֹפֵשׂ
  chosen: searching
  alternatives:
  - examining
  - seeking out
  lexicon: HALOT
  rationale: The participle conveys ongoing probing or searching. 'Searching' is natural English and fits the lamp metaphor of illumination that exposes what is hidden.
- source_word: כָּל
  chosen: all
  alternatives:
  - every
  lexicon: HALOT
  rationale: '''All'' straightforwardly renders the comprehensive scope of the search.'
- source_word: חַדְרֵי
  chosen: innermost chambers
  alternatives:
  - rooms
  - chambers
  - recesses
  lexicon: HALOT
  rationale: Literally 'chambers/rooms,' but in this figurative context the sense is the hidden inner recesses. 'Innermost chambers' preserves the spatial metaphor and clarifies the idiom in readable English.
- source_word: בָטֶן
  chosen: belly
  alternatives:
  - inner being
  - womb
  - abdomen
  lexicon: HALOT
  rationale: בטן literally means 'belly' or 'womb' and can idiomatically refer to the inward parts. Retaining 'belly' keeps the Hebrew imagery; 'innermost chambers of the belly' communicates the metaphor of the deepest interior. A more interpretive rendering like 'inner being' is preserved in a footnote.
- source_word: נֵר יְהוָה
  chosen: Yahweh's lamp
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The Hebrew construct is naturally rendered with an English possessive while retaining the concrete lamp metaphor.
- source_word: חֹפֵשׂ כָּל חַדְרֵי בָטֶן
  chosen: searching every inner chamber
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This gives natural English for the idiomatic expression while retaining the searching and chamber imagery; the note supplies the literal bodily wording.
