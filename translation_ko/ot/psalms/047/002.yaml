  - 즐거운 소리로
  lexicon: HALOT
  rationale: קוֹל은 ‘소리’, רִנָּה는 ‘기쁨의 환성/환희’이므로, 두 요소를 간결하게 살린 ‘기쁨의 소리로’로 옮겼습니다.
theological_decisions:
- issue: ‘all peoples’의 범위
  chosen_reading: 이 절은 이스라엘만이 아니라 모든 민족/백성을 하나님의 찬양으로 부릅니다.
  alternative_readings:
  - 주변 열국만을 수사적으로 부르는 표현으로 볼 수 있습니다.
  rationale: 히브리어 כָּל הָעַמִּים가 보편적 범위를 직접 말하며, 시편 47편의 왕권 신학과도 잘 맞습니다.
  doctrine_reference: 하나님의 सार्वജന적 왕권
