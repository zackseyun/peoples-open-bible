  source_fidelity: 핵심 계보 목록은 대체로 반영했으나, 관계절의 주어를 혼동했습니다. 히브리어 אֲשֶׁר לָקַח은 앞의 ‘바르질라이의 자손’이 아니라, 아내를 맞아들인 뒤 그 이름으로 불리게 된 조상 바르질라이를 가리킵니다. 또한 ‘그들의 이름’은 딸들 자체보다 길르앗 사람 바르질라이의 가문/이름을 가리키는 것으로 옮기는 편이 한국어에서 명확합니다.
  naturalness: ‘제사장들 가운데서는’과 계보 나열은 자연스럽습니다. 그러나 ‘바르질라이는 길르앗 사람으로서 바르질라이의 딸들’은 동일 이름의 두 인물을 구별하지 못해 의미가 불명확합니다. ‘길르앗 사람 바르질라이의 딸들 중 한 사람을 아내로 맞이하고 그 이름으로 불리게 된’으로 하면 문맥과 현대 표준어에 맞습니다.
  terminology: 고유명사는 호바야, 학고스, 바르실래로 통일하는 것이 한국어 성경의 널리 쓰이는 표기와 부합합니다. ‘자손’은 בְּנֵי의 계보적 용법에 적절합니다. ‘아내를 취하여’보다 ‘아내로 맞이하고’가 현대 합쇼체 문체에 자연스럽습니다.
  issues:
