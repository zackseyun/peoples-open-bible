  category: idiom
  tier: 1
  from: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
  to: O my strength, to you I will sing praises, for God is my stronghold, the God who shows me steadfast love.[a]
  rationale: The literal construct phrase “the God of my steadfast love” is markedly misleading in English, readily suggesting that the speaker is the source of the steadfast love. In this psalm’s immediate context, the phrase identifies God as the one who extends steadfast love to the psalmist. The revision states that relation naturally; the note preserves the literal compressed Hebrew and another plausible idiomatic rendering. Its marker correctly belongs with the phrase it explains.
