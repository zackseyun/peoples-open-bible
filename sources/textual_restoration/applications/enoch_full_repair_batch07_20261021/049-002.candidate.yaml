translation:
  text: For he is mighty in all the hidden things of righteousness. Unrighteousness passes like a shadow and does
    not remain.[a] The Chosen One has stood before the Lord of Spirits, and his glory is forever and ever, and his
    power from generation to generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The selected expression uses the noun ምቅዋመ followed by a negative: there is no remaining or abiding.
      Dillmann1865, column455, explicitly cites49:2 under commoratio, mansio (remaining, abiding). The separate
      adversary entries lower in that column are different derived forms, not this noun. Does not remain relates
      the negative nominal expression to the preceding unrighteousness; it does not introduce an opponent or an
      object of resistance.'
    reason: lexical_alternative
