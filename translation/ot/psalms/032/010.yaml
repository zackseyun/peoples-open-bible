  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Representative masculine singular רָשָׁע
  chosen_reading: the wicked
  alternative_readings:
  - the wicked man
  rationale: The Hebrew singular is generic/representative rather than focused on one male individual. Rendering it as 'the wicked' preserves the sense in natural English while respecting the gender-accurate principle at the level of intent rather than form alone.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
