revisions:
- from: 모든 창녀에게는 사례금이 주어집니다. 그러나 너는 네 연인들 모두에게 네 선물을 주었고, 또 네 음행 때문에 사방에서 네게 오게 하려고 그들을 매수하였느니라.[a][b][c]
  to: 사람들은 모든 창녀에게 대가를 주지만, 너는 네 연인들 모두에게 네 선물을 주었으며, 네 음행을 하려고 사방에서 네게 오도록 그들을 매수하였습니다.[a][b][c]
  rationale: 원문의 대조, 선물, 매수, 사방에서 찾아오는 행위, 음행의 목적을 유지하면서 ‘사례금’을 ‘대가’로 다듬고 문체를 현대 합쇼체로 일관되게 고쳤습니다. 각 주석 표지는 해당 어휘에 연결되도록 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:34Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 일반적으로 ‘모든 창녀에게는 대가를 준다’는 관행과, 예루살렘을 향한 ‘너는 네 연인들에게 선물을 주고 그들을 매수하여 사방에서 네게 오게 했다’는 대조를 이룹니다. 초안은 이 핵심 의미를 대체로 보존하지만, ‘주어집니다’와 ‘하였느니라’가 섞여 있어 지정된 현대 합쇼체에 맞추어 통일할 필요가 있습니다. 또한 ‘네 음행 때문에’는 בְּתַזְנוּתָיִךְ의 목적/관련의 뉘앙스보다 원인으로 좁힐 수 있으므로 ‘네 음행을 하려고’로 명시하는 편이 안전합니다.
  naturalness: ‘사례금’은 현대 한국어에서 감사의 뜻으로 주는 금품의 의미도 강하여 여기의 성적 거래에 대한 ‘대가’보다 덜 자연스럽습니다. ‘대가’를 쓰고 문장 종결을 ‘-습니다’로 통일하면 현대적이고 정중한 문체가 됩니다.
  terminology: ‘창녀’, ‘연인들’, ‘음행’, ‘매수하다’는 본문의 직설적인 예언적 성적 은유와 거래·매수의 어휘를 보존합니다. ‘창녀’는 זֹנוֹת의 직접적 표현이며, 대체어 ‘매춘부’를 주석으로 남길 수 있습니다.
  issues:
