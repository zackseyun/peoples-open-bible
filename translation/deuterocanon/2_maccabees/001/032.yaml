  text: ὡς δὲ τοῦτο ἐγενήθη, φλὸξ ἀνήφθη· τοῦ δὲ ἀπὸ τοῦ θυσιαστηρίου ἀντιλάμψαντος φωτὸς ἐδαπανήθη.
