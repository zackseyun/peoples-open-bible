id: JOB.22.29
reference: Job 22:29
source:
  edition: WLC
  text: כִּֽי הִ֭שְׁפִּילוּ וַ/תֹּ֣אמֶר גֵּוָ֑ה וְ/שַׁ֖ח עֵינַ֣יִם יוֹשִֽׁעַ־׃
translation:
  text: When people are brought low, you will say, “They will be lifted up[a]!” and God will save the one with downcast eyes[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew declaration is simply “Uplifting!” Another understanding is, “When people are humbled, you say, ‘It is because of pride.’”
    reason: alternative_reading
  - marker: b
    text: Downcast eyes express humility or dejection.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  chosen: For when
  alternatives:
  - For
  - When
  - Indeed
  lexicon: HALOT
  rationale: Introduces the ground or circumstance for the preceding promise. In this context it works naturally as a causal-temporal connector, 'For when,' rather than a bare 'for' or 'indeed.'
- source_word: הִשְׁפִּילוּ
  chosen: people are brought low
  alternatives:
  - they are humbled
  - they are cast down
  - they humble themselves
  lexicon: HALOT
  rationale: The plural verb lacks an expressed noun; indefinite “people” supplies an English subject without specifying a group.
- source_word: וַתֹּאמֶר
  chosen: you say
  alternatives:
  - then you will say
  - and you say
  lexicon: HALOT
  rationale: Addressed to the singular addressee in Eliphaz's speech. English present 'you say' fits the proverbial/future-result sense in context better than a rigid past narrative rendering.
- source_word: גֵּוָה
  chosen: Lift them up!
  alternatives:
  - Up!
  - Exaltation!
  - There is lifting up!
  lexicon: HALOT
  rationale: The noun is difficult and elliptical. In context it expresses the opposite of being brought low—uplift/exaltation. Rendering it as an exclamatory imperative-like statement in English captures the sense of declaring uplift for the humbled. The plural object 'them' is supplied from the preceding plural verb for coherent English.
- source_word: וְשַׁח עֵינַיִם
  chosen: the one with downcast eyes
  alternatives:
  - the lowly
  - him who has lowered eyes
  - the humble
  lexicon: HALOT
  rationale: Literally 'low/downcast of eyes,' an idiom for humility or dejection. 'The one with downcast eyes' preserves the imagery while remaining readable. 'The humble' is interpretive and is preserved as an alternative.
- source_word: יוֹשִׁעַ
  chosen: he will save
  alternatives:
  - he delivers
  - he will save
  - he will deliver
  lexicon: HALOT
  rationale: The imperfect follows the prospective promise sequence; the implied divine subject remains unstated in the English text.
- source_word: וַתֹּאמֶר גֵּוָה
  chosen: you will say, “There is lifting up!”
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The rendering retains the noun-like, elliptical force of גֵּוָה rather than supplying an imperative and object.
