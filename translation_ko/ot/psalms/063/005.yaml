  naturalness: ‘기름진 음식과 풍성한 음식으로 배부른 듯 만족하며’는 원문의 음식 비유와 비교 표현을 자연스러운 현대 한국어로 살립니다. ‘제 입은 환호하는 입술로’는 히브리어의 입/입술 병행을 보존한 시적 표현이며, 합쇼체 현재형으로 찬양의 지속적·생생한 뉘앙스를 나타냅니다.
  terminology: נַפְשִׁי는 문맥상 전통적이면서도 자연스러운 ‘제 영혼’으로, יְהַלֶּל은 ‘찬양합니다’로 옮겼습니다. חֵלֶב와 דֶּשֶׁן의 겹치는 풍성한 음식 이미지는 본문에서 ‘기름진 음식’과 ‘풍성한 음식’으로 구별하고, 각주에서 더 직역적인 표현을 제시했습니다.
