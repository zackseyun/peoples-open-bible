  naturalness: ‘전능하신 분’과 ‘데려가셨습니까?’는 현대 표준 한국어의 격식 있는 문체로 자연스럽습니다. 다만 ‘우리에게서’보다 이별·상실의 관계를 드러내는 ‘우리 곁에서’가 이 문맥에서 더 자연스럽습니다.
  terminology: ܚܝܠܬܢܐ는 ‘전능하신 분’으로 일관되게 옮길 수 있습니다. ܡܟܟ의 낮춤/굴욕의 뜻은 ‘그토록 낮추시어’가 보존합니다. ‘내 아들’은 본문 서술의 인물 관계이므로 생략해서는 안 됩니다.
  issues:
