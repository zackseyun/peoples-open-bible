revisions:
- from: 하나님, 주님은 나의 하나님이십니다. 내가 새벽에 주님을 찾습니다. 내 영혼이 주님을 목말라하고, 내 육체가 주님을 그리워합니다. 마른 땅과 지친 땅, 물 없는 곳에서 그렇게 합니다.[a][b]
  to: 이처럼 내가 성소에서 주님을 뵈었습니다. 주님의 능력과 영광을 보기 위해서입니다.[a]
  rationale: 원문의 כֵּן을 ‘이처럼’으로, בַּקֹּדֶשׁ을 ‘성소에서’로 옮겼습니다. חֲזִיתִיךָ는 하나님께 직접 드리는 기도체에 맞게 ‘주님을 뵈었습니다’로, 목적을 나타내는 לִרְאוֹת은 ‘보기 위해서’로 반영했습니다. ‘능력과 영광’은 עֻזְּךָ וּכְבוֹדֶךָ의 병렬을 그대로 보존합니다. 기존 초안의 모든 내용과 각주는 다른 절에 속하므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
