id: HOS.13.2
reference: Hosea 13:2
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יוֹסִ֣פוּ לַ/חֲטֹ֗א וַ/יַּעְשׂ֣וּ לָ/הֶם֩ מַסֵּכָ֨ה מִ/כַּסְפָּ֤/ם כִּ/תְבוּנָ/ם֙ עֲצַבִּ֔ים מַעֲשֵׂ֥ה חָרָשִׁ֖ים כֻּלֹּ֑/ה לָ/הֶם֙ הֵ֣ם אֹמְרִ֔ים זֹבְחֵ֣י אָדָ֔ם עֲגָלִ֖ים יִשָּׁקֽוּ/ן׀׃
translation:
  text: 'And now they keep on sinning: they make cast images for themselves from their silver, idols made according to their own skill—all of it the work of craftsmen. They say of these idols, “Those who sacrifice human beings[a] kiss calf-idols[b].”'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “Let those who offer sacrifices kiss calf-idols.” The Hebrew can refer either to human victims or to the people offering sacrifices.
    reason: alternative_reading
  - marker: b
    text: Kissing an idol was an act of worship.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  chosen: And now
  alternatives:
  - Now
  lexicon: HALOT
  rationale: Temporal/discourse marker introducing the present continuation of Israel's sin; 'And now' preserves the connective force of ו plus עתה.
- source_word: יוֹסִפוּ לַחֲטֹא
  chosen: they keep on sinning
  alternatives:
  - they continue to sin
  lexicon: HALOT
  rationale: The construction describes continued or repeated sin. 'Keep on sinning' is direct contemporary English.
- source_word: וַיַּעֲשׂוּ לָהֶם מַסֵּכָה
  chosen: they make cast images for themselves
  alternatives:
  - they make a cast image for themselves
  lexicon: HALOT
  rationale: The singular form has a collective sense alongside plural idols. Natural English pluralizes the manufactured cult objects consistently.
- source_word: מִכַּסְפָּם
  chosen: from their silver
  alternatives:
  - with their silver
  - out of their silver
  lexicon: HALOT
  rationale: מן marks material/source. 'From their silver' preserves the idea that the idols are fashioned out of their own wealth.
- source_word: כִּתְבוּנָם
  chosen: according to their own skill
  alternatives:
  - according to their own understanding
  - according to their own design
  lexicon: HALOT
  rationale: In the immediate fabrication context and before 'work of craftsmen,' the noun denotes human skill or ability, with ironic force.
- source_word: עֲצַבִּים
  chosen: idols made
  alternatives:
  - idols
  lexicon: HALOT
  rationale: The supplied participle ties the idols to the preceding act of human manufacture without adding a new claim.
- source_word: מַעֲשֵׂה חָרָשִׁים כֻּלֹּה
  chosen: all of it the work of craftsmen
  alternatives:
  - all of them are the work of artisans
  - the whole thing is a craftsman's work
  lexicon: HALOT
  rationale: Emphasizes the merely human manufacture of the idols. 'Craftsmen' is natural English and preserves the plural חָרָשִׁים.
- source_word: לָהֶם הֵם אֹמְרִים
  chosen: Of them they say
  alternatives:
  - To them they say
  - It is said of them
  lexicon: HALOT
  rationale: The conventional contextual rendering relates the saying to the idols while the formal and syntactic difficulty of 'to them' remains footnoted.
- source_word: זֹבְחֵי אָדָם
  chosen: Those who sacrifice human beings
  alternatives:
  - those who sacrifice
  - human sacrificers
  lexicon: HALOT
  rationale: The Masoretic syntax most naturally takes 'human' as the object of the participle. The alternative generic-subject construal remains footnoted.
- source_word: אָדָם
  chosen: human beings
  alternatives:
  - human
  - people
  lexicon: HALOT
  rationale: As the object of sacrifice, the collective noun denotes human beings rather than male-only 'men.'
- source_word: עֲגָלִים יִשָּׁקוּן
  chosen: kiss calves
  alternatives:
  - let them kiss calves
  lexicon: HALOT
  rationale: The Masoretic form is most naturally indicative. 'Calves' preserves Hosea's pointed image; the cultic referent is explained in a note.
