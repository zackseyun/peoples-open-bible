translation:
  text: '“The eighth mountain had many springs. All the Lord’s creation drank from them. The believers
    from that mountain are like this:


    2. “They are apostles and teachers. They proclaimed throughout the whole world and taught the Lord’s
    word with dignity and purity. They took nothing wrongfully to satisfy evil desire.[a] They always
    lived in righteousness and truth, just as they had received the Holy Spirit. Their path is therefore
    with the angels.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: The Greek says they appropriated nothing for evil desire. Its object is not specified beyond
      “nothing”; the translation does not add a particular payment, fund or doctrinal alteration.
  - marker: b
    reason: lexical_alternative
    text: Parodos can mean passage, way or access. “Path” retains the movement image and association with
      angels without inserting a detailed account of the afterlife.
lexical_decisions:
- source_word: ἀπόστολοι καὶ διδάσκαλοι
  chosen: apostles and teachers
  alternatives:
  - envoys and instructors
  rationale: Preserve the named teaching/proclamation roles without restricting apostles to an unexpressed
    list of twelve.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  chosen: the Holy Spirit
  alternatives:
  - the holy spirit
  rationale: Explicit holy-spirit wording retained; do not replace it with the spirit/seed variant from
    the preceding, different chapter.
