revisions:
- category: publication_review_correction
  rationale: 'Addresses both findings against the supplied Greek independently: καὶ διὰ τοῦτο καὶ μέλανές
    εἰσι explicitly connects blackness to the preceding denial of repentance and presence of death, while
    καὶ γὰρ retains lawlessness as an explanation. In paragraph 3, μετάνοιά ἐστι / οὐκ ἔστι and μετάνοια
    κεῖται concern repentance’s availability, not personal capacity to repent. Restore that distinction
    without weakening the denial, urgency, or penalty. Existing servant wording, note markers, paragraph
    prefixes, and paragraph divisions remain unchanged.; Reconcile the note’s quoted English with the
    simplified text’s rendering of τοῖς δὲ προτέροις. Preserve the existing textual disclosure and its
    qualification; no new witness claim or lexical reconsideration is introduced.'
- category: publication_review_correction
  rationale: Independently compared with the selected Greek and supplied apparatus, “the first group”
    contextually renders προτέροις, while the reported πρώτοις means “first ones”; καὶ αὗται means “and
    these,” not “according to these.” Correct the disclosure while preserving the simplified main text
    and the note’s interpretive qualification. This corrects an apparatus gloss, not a reconsideration
    of the main-text lexical decisions.
- category: publication_review_correction
  rationale: Independent comparison with the selected Greek supports “Each taught according to the desires
    of people who were sinning.” Complete note c’s disclosure of the editorial insertion and the reported
    omission affecting “Each,” without replacing the selected clause. This is a note-disclosure correction,
    not a reconsideration of prior lexical decisions; no servant-terminology change is proposed.
