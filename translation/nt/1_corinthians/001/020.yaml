  meaning: Paul challenges the intellectual authorities of the present age, declaring that God has exposed the world’s wisdom as foolish.
  meaning_decisions:
  - source_phrase: σοφός
    prior_rendering: the wise man
    new_rendering: the wise person
    rationale: The singular represents a class of people claiming wisdom; the challenge does not depend on their being male.
  - source_phrase: γραμματεύς
    prior_rendering: the scribe
    new_rendering: the scholar
    rationale: The rhetorical series concerns intellectual authorities, not merely people who copy documents. “Scholar” conveys that role directly, while the footnote preserves the possible specific reference to a Jewish scriptural expert.
  - source_phrase: ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ κόσμου
    prior_rendering: God made the wisdom of the world foolish
    new_rendering: God shown the wisdom of the world to be foolish
    rationale: The surrounding argument describes God overturning the world’s claims to wisdom through the cross. “Shown ... to be foolish” conveys this discrediting without suggesting that God changed genuine wisdom into stupidity; the footnote preserves the causative wording.
