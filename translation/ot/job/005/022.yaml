id: JOB.5.22
reference: Job 5:22
source:
  edition: WLC
  text: לְ/שֹׁ֣ד וּ/לְ/כָפָ֣ן תִּשְׂחָ֑ק וּֽ/מֵ/חַיַּ֥ת הָ֝/אָ֗רֶץ אַל תִּירָֽא־׃
translation:
  text: You will laugh at destruction and famine; do not fear the wild animals of the earth.
  philosophy: dynamic
lexical_decisions:
- source_word: שֹׁד
  chosen: destruction
  alternatives:
  - devastation
  - ruin
  lexicon: HALOT
  rationale: שֹׁד commonly denotes violent destruction, devastation, or ruin. 'Destruction' is concise, natural English and pairs well with 'famine' as calamities from which the addressee is protected.
- source_word: כָּפָן
  chosen: famine
  alternatives:
  - hunger
  lexicon: HALOT
  rationale: The noun refers to famine or severe hunger. 'Famine' best matches the disaster-category parallelism with שֹׁד and is the standard rendering in this context.
- source_word: תִּשְׂחָק
  chosen: you will laugh
  alternatives:
  - you will mock
  - you will smile at
  lexicon: HALOT
  rationale: From שׂחק, the verb can denote laughing, sometimes with a sense of derision or fearless triumph. 'You will laugh' preserves the vivid metaphor without over-interpreting the emotional nuance.
- source_word: מֵחַיַּת הָאָרֶץ
  chosen: the wild animals of the earth
  alternatives:
  - the wild animals of the land
  - the animals of the earth
  lexicon: HALOT
  rationale: This naturally conveys the usual sense of חַיָּה in this context.
- source_word: אַל תִּירָא
  chosen: do not fear
  alternatives:
  - do not fear
  - you need not fear
  lexicon: HALOT
  rationale: The form is a negative imperative/prohibition; its discourse setting is assuring.
