source:
  edition: WLC
  text: הַטֵּ֤ה אֵלַ֨/י אָזְנְ/ךָ֮ מְהֵרָ֪ה הַצִּ֫ילֵ֥/נִי הֱיֵ֤ה לִ֨/י לְֽ/צוּר מָ֭עוֹז לְ/בֵ֥ית מְצוּד֗וֹת לְ/הוֹשִׁיעֵֽ/נִי׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/002.yaml
  text: Incline your ear to me; quickly rescue me. Be for me a rock of refuge[a], a fortified house[b] to save me.
  footnotes:
  - marker: a
    text: Or “a strong rock.” The Hebrew phrase combines “rock” with a noun for strong protection or a stronghold.
    reason: lexical_alternative
  - marker: b
    text: Or “a fortress” or “a house of strongholds.” The Hebrew preserves house imagery while describing it as strongly fortified.
    reason: lexical_alternative
translation:
  language: ko
  text: 내게 귀를 기울이시고, 속히 나를 건져 주십시오. 나를 구원하시기 위하여 내게 피난처가 되는 반석, 요새 같은 집이 되어 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּךָ / בְּצִדְקָתְךָ
  english_pob_choice: In you / In your righteousness
  chosen_korean: 주님 안에 / 주님의 의로
  alternatives_korean:
  - 주님께 / 주님의 공의로
  - 주님 안에서 / 주님의 정의로
  lexicon: HALOT
  rationale: 첫째 ב־는 피난처의 대상을 가리키므로 ‘주님 안에’로 옮겨 시적 은유를 살렸고, 둘째 ב־צדקתך는 하나님의 উদ্ধার 근거를 나타내어 ‘주님의 의로’가 가장 सीधे하게 원문을 반영합니다.
- source_word: חָסִיתִי
  english_pob_choice: I have taken refuge
  chosen_korean: 제가 피하였습니다
  alternatives_korean:
  - 제가 피난하였습니다
  - 제가 주님께 피신하였습니다
  lexicon: HALOT
  rationale: חסה는 단순 신뢰보다 실제로 피난처에 몸을 의탁하는 이미지를 가지므로, 한국어에서는 ‘피하다/피신하다’ 계열이 원문의 은유를 더 잘 보존합니다.
- source_word: אַל אֵבוֹשָׁה לְעוֹלָם
  english_pob_choice: let me never be put to shame
  chosen_korean: 제가 결코 수치를 당하지 않게 하시고
  alternatives_korean:
  - 제가 영원히 부끄러움을 당하지 않게 하시고
  - 제가 절대로 수치를 당하지 않게 하시고
  lexicon: HALOT
  rationale: אַל은 간구형 부정 요청이므로 ‘-지 않게 하시고’로 옮겼고, אֵבוֹשׁ는 내적 감정보다 실패로 인한 공적 수치를 뜻하므로 ‘수치를 당하다’가 적절합니다.
- source_word: פַלְּטֵנִי
  english_pob_choice: deliver me
  chosen_korean: 저를 건져 주십시오
  alternatives_korean:
  - 저를 구해 주십시오
  - 저를 구원해 주십시오
  lexicon: HALOT
  rationale: פלט의 강한 구출 의미를 살리되, 시편 기도문에서 자연스러운 간구체인 ‘건져 주십시오’로 번역했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 본문은 시편 기도문이므로 예배적 한국어 수용성을 고려해 직접 호칭은 ‘주님’으로 두고, 원어 구분은 별도 주석 없이 문맥상 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
