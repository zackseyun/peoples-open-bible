id: PRO.29.10
reference: Proverbs 29:10
source:
  edition: WLC
  text: אַנְשֵׁ֣י דָ֭מִים יִשְׂנְאוּ תָ֑ם וִֽ֝/ישָׁרִ֗ים יְבַקְשׁ֥וּ נַפְשֽׁ/וֹ־׃
translation:
  text: Bloodthirsty men hate a blameless man, but the upright seek to preserve his life[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, “and seek to kill the upright”; the Hebrew expression is literally “seek his life.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי דָמִים
  chosen: Bloodthirsty men
  alternatives:
  - bloodthirsty men
  - murderous men
  - men of violence
  lexicon: HALOT
  rationale: Natural English equivalent for people characterized by bloodshed/violent killing.
- source_word: יִשְׂנְאוּ
  chosen: hate
  alternatives:
  - detest
  lexicon: HALOT
  rationale: Standard rendering of the verb 'to hate.' 'Hate' is direct and idiomatic here.
- source_word: תָם
  chosen: the blameless
  alternatives:
  - the innocent
  - the upright
  - the man of integrity
  lexicon: HALOT
  rationale: The adjective denotes one who is complete, innocent, or blameless in conduct. 'The blameless' fits wisdom-literature usage and avoids collapsing it into the later 'upright' in the second colon.
- source_word: וישרים
  chosen: the upright
  alternatives:
  - upright people
  - the just
  lexicon: HALOT
  rationale: A common wisdom term for morally straight/upright persons. 'The upright' preserves the plural sense as a class and pairs naturally with 'the blameless' without making the two cola identical.
- source_word: יְבַקְשׁוּ
  chosen: seek to preserve
  alternatives:
  - seek after
  - care for
  - protect
  lexicon: HALOT
  rationale: The verb is literally “seek,” but the antithetical context supplies the benevolent aim; this avoids the hostile English implication of “seek his life.”
- source_word: נַפְשׁוֹ
  chosen: his life
  alternatives:
  - his soul
  - him
  lexicon: HALOT
  rationale: Retains the concrete life/person sense in this context.
