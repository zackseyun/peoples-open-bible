translation:
  language: en
  text: Tear your hearts in sorrow[r1], not merely your garments, and return to Yahweh your God. He is gracious and compassionate. He is slow to anger, his steadfast love is great, and he relents from sending the disaster he has threatened.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Earlier reader wording used a form of "repent." SPOB had supplied repentance as an explanation of grief, torn hearts/clothing, or a broken spirit. Keep the supported sorrow/contrition rather than insert a claim about reorientation not separately stated here.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: abundant in steadfast love
  simplified_phrase: his steadfast love is great
  preserved_meaning: Yahweh possesses abundant loyal, covenantal love.
  reasoning_layer_used: Lexical decision for רַב חֶסֶד
  rationale: The simpler clause retains the important term “steadfast love.”
interpretive_expansions:
- pob_phrase: relenting concerning the disaster
  rendering: relents from sending the disaster he has threatened
  claim: The disaster is announced judgment that God may withhold.
  evidence:
  - The POB footnote defines the phrase as withholding threatened judgment.
  - The lexical rationale identifies the disaster as punitive calamity.
  confidence: high
  alternatives_preserved:
  - The language still presents God as relenting without implying error or ignorance.
translation_notes:
  risk_flags:
  - risk: “Relents from sending” could be read as resolving how divine relenting works.
    mitigation: The wording preserves the biblical description without saying that God erred or learned.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
