id: PRO.27.26
reference: Proverbs 27:26
source:
  edition: WLC
  text: כְּבָשִׂ֥ים לִ/לְבוּשֶׁ֑/ךָ וּ/מְחִ֥יר שָׂ֝דֶ֗ה עַתּוּדִֽים׃
translation:
  text: Lambs will provide your clothing, and male goats will pay for a field.
  philosophy: dynamic
lexical_decisions:
- source_word: כְּבָשִׂים
  chosen: Lambs
  alternatives:
  - Sheep
  lexicon: HALOT
  rationale: The source term specifically denotes lambs or young sheep; “lambs” is the more direct English rendering.
- source_word: לִלְבוּשֶׁךָ
  chosen: for your clothing
  alternatives:
  - for your garment
  - for your clothing needs
  lexicon: HALOT
  rationale: 'The preposition ל plus ''clothing/garment'' with 2ms suffix expresses purpose or use: the flock provides what is needed for clothing. ''For your clothing'' is natural English while staying close to the Hebrew.'
- source_word: וּמְחִיר
  chosen: and ... are the price
  alternatives:
  - and the price
  - and for the purchase price
  lexicon: HALOT
  rationale: 'מְחִיר means ''price, payment, purchase price.'' Because Biblical Hebrew often omits a copula, English supplies ''are'' to make the second clause intelligible: the goats function as the means of payment.'
- source_word: שָׂדֶה
  chosen: a field
  alternatives:
  - land
  - a piece of land
  lexicon: HALOT
  rationale: שָׂדֶה ordinarily means 'field.' 'A field' is the most direct rendering and fits the economic imagery of the proverb.
- source_word: עַתּוּדִים
  chosen: male goats
  alternatives:
  - male goats
  - he-goats
  lexicon: HALOT
  rationale: The Hebrew specifically refers to male goats, a distinction naturally retained in the main text.
