  from: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
  to: Peter was sitting outside in the courtyard[a], and a servant girl came up to him, saying, “You also were with Jesus the Galilean.”
  rationale: In Hellenistic Greek, the numeral εἷς, μία, ἕν is frequently used as an indefinite article ('a' or 'a certain'). Translating it strictly as 'one' can sound slightly unnatural in English, as it implies a numerical count rather than simply introducing a character. 'A servant girl' is more idiomatic and accurately reflects the Greek usage here.
