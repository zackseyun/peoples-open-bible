translation:
  language: ko
  text: 에브라임과 베냐민과 므낫세 앞에서 주님의 능력을 떨쳐 일으키시고,[b] 우리를 구원하러 오소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘가다/걷다’라는 뜻이며, ‘우리의 구원을 위하여 나아가소서’로도 옮길 수 있습니다. 이 문맥에서는 하나님께서 구원하시려고 오시기를 청하는 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘능력’은 ‘힘’ 또는 ‘권능’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֵה יִשְׂרָאֵל
  english_pob_choice: Shepherd of Israel
  chosen_korean: 이스라엘의 목자
