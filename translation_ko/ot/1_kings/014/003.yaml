  text: And take in your hand ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.
translation:
  language: ko
  text: 떡 열 개와 과자 몇 개와 꿀 한 단지를 손에 들고 그에게 가십시오. 그가 그 아이에게 무슨 일이 일어날지를 당신에게 알려 줄 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחַתְּ בְּיָדֵךְ
  english_pob_choice: And take in your hand
  chosen_korean: 당신의 손에 … 가지고
  alternatives_korean:
  - 당신의 손에 … 들고
  - 손에 … 들고 가십시오
  lexicon: יד / לָקַח
  rationale: 히브리어는 ‘손에 들고 가져가다’는 동작을 나타내므로, 단순한 소유보다 행위 중심의 표현으로 옮겼습니다.
- source_word: עֲשָׂרָה לֶחֶם
  english_pob_choice: ten loaves of bread
  chosen_korean: 떡 열 개
  alternatives_korean:
  - 빵 열 덩이
  - 빵 열 개
  lexicon: לחם
  rationale: POB의 ‘loaves of bread’에 맞추되, 히브리어 לחם의 기본 의미를 살려 한국어 성경문맥에서 자연스러운 ‘떡’으로 옮겼습니다.
- source_word: וְנִקֻּדִים
  english_pob_choice: some cakes
  chosen_korean: 과자
  alternatives_korean:
  - 낟알 과자
  - 단과자
  lexicon: נקד
  rationale: 정확한 제과 종류를 단정하기보다, POB의 불특정 복수 감각을 살려 무난한 식품명으로 처리했습니다.
- source_word: וּבַקְבֻּק דְּבַשׁ
  english_pob_choice: and a jar of honey
  chosen_korean: 꿀 단지
  alternatives_korean:
  - 꿀 항아리
  - 꿀병
  lexicon: בקבוק / דבש
  rationale: ‘jar’의 용기감과 דבש의 ‘꿀’을 함께 반영해, 한국어에서 가장 직관적인 용기 표현인 ‘단지’를 택했습니다.
- source_word: הוּא יַגִּיד לָךְ
  english_pob_choice: He will tell you
  chosen_korean: 그는 … 당신에게 알려 줄 것입니다
  alternatives_korean:
  - 그가 … 말해 줄 것입니다
  - 그가 … 알려 드릴 것입니다
  lexicon: נגד
  rationale: 예언적 통보의 성격을 살려 단순한 ‘말하다’보다 결과를 전하는 ‘알려 주다’로 옮겼습니다.
theological_decisions:
- issue: 목적지 인물에게 예물을 가져가라는 지시의 성격
  chosen_reading: 이 구절은 점술이 아니라, 하나님께서 이미 정하신 심판/미래에 대한 예언적 확인을 받기 위한 왕실 방문 지시로 읽었습니다.
  alternative_readings:
  - 단순한 예물 전달
  - 예언자에게 보답을 구하는 행위
  rationale: 다음 절의 문맥상 아이의 운명에 대한 계시가 핵심이므로, 행위 자체보다 예언적 응답이 중심이 되도록 번역했습니다.
  doctrine_reference: 1 Kings 14:1-18 문맥
