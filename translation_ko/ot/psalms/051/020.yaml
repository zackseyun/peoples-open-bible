  rationale: 성벽을 대상으로 할 때 한국어에서는 ‘성벽을 세우다’가 자연스럽고, 회복의 뉘앙스를 지나치게 특정하지 않으면서 ‘build up’을 전달합니다.
- source_word: חוֹמוֹת
