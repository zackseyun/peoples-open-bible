  rationale: The Hebrew formula indicates severe removal from the covenant community, but the text itself does not specify the mechanism here. To preserve theological and legal ambiguity rather than resolve it, the main text keeps the formal expression 'cut off,' with more interpretive alternatives reserved to a footnote.
