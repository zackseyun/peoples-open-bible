translation:
  text: Michael, Gabriel, Rufael and Phanuel will seize them on that great day and cast them into the burning furnace
    on that day, so that the Lord of Spirits may take vengeance on them for their wrongdoing, because they belonged
    to Satan and led astray those who dwell on dry land.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The four selected Ethiopic names are retained, including Rufael and Phanuel. Primary Dillmann1290 explicitly
      cites54:6 under strict holding, apprehending, restraining, supporting seize here rather than strengthen them.
      Belonged to Satan renders the selected became/were for Satan without adding the noun servants. The furnace/casting
      and dry-land-dwellers relations remain complete.
    reason: lexical_alternative
