name: Corpus integrity

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: corpus-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the reviewed Psalm 145 baseline
        run: git fetch --no-tags --depth=1 origin 6b9337f796dedecd4794b09451f712b9cfb3f6f8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4,<5' 'python-dotenv>=1,<2'
      - name: Validate catalog and numbering
        run: |
          python tools/extra_texts/validate_catalog.py --all
          python tools/lint_psalm_numbering.py --strict
      - name: Validate the complete reader corpus
        run: python tools/validate_reader_corpus.py --quiet --malformed-yaml error
      - name: Test reader notes and consultation policy
        env:
          PYTHONPATH: .
        run: |
          python tests/test_audit_footnotes.py
          python -m unittest discover -s tests -p 'test_reader_footnote_export.py'
          python -m unittest discover -s tests -p 'test_psalm145_critical_application.py'
          python -m unittest discover -s tests -p 'test_psalm145_check.py'
          python -m unittest discover -s tests -p 'test_psalms_source_context_map.py'
          python -m unittest discover -s tests -p 'test_yadin_masada_policy.py'
          python -m unittest discover -s tests -p 'test_sirach_print_collation.py'
