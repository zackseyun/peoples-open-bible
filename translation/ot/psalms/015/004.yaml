- timestamp: '2026-08-28T22:04:00Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: lexical
  tier: 1
  from: In his eyes a despised person is rejected[a], but he honors those who fear Yahweh[b]; he swears to his own harm and does not change.
  to: In his eyes a contemptible person is rejected[a], but he honors those who fear Yahweh; he swears to his own harm[b] and does not go back on it.
  rationale: Within the verse's ethical contrast, “contemptible person” better conveys the evaluative force of נִבְזֶה than “despised person,” which can merely report others' treatment of the person. “Does not go back on it” makes explicit only the oath already supplied by context and naturally expresses the sense of not changing it. The oath note must follow “harm,” rather than “Yahweh.”
- timestamp: '2026-11-09T18:36:58Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
