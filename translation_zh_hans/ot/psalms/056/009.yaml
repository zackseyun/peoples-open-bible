  text: אָ֥֨ז יָ֘שׁ֤וּבוּ אוֹיְבַ֣/י אָ֭חוֹר בְּ/י֣וֹם אֶקְרָ֑א זֶה יָ֝דַ֗עְתִּי כִּֽי אֱלֹהִ֥ים לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/009.yaml
  text: Then my enemies will turn back in the day I call. This I know[a], that God is for me.
translation:
  language: zh_hans
  text: 在我呼求的日子，我的仇敌必退后。这一点我知道[a]：神帮助我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“由此我知道神帮助我。”
    reason: 希伯来文“这一点”也可按工具性理解为“由此”，指前述仇敌退后成为诗人确认神帮助他的凭据。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示随后发生的结果；“那时”自然地保留了希伯来文的时间顺序。
- source_word: יָשׁוּבוּ…אָחוֹר
  choice: 必……退后
  rationale: שׁוב与אָחוֹר连用，表达转身后退或败退；“退后”简洁地传达敌人受挫撤退之意。
- source_word: אוֹיְבַי
  choice: 我的仇敌
  rationale: 直接保留名词及第一人称所属关系；“仇敌”符合诗篇庄重语体。
- source_word: בְּיוֹם אֶקְרָא
  choice: 在我呼求的日子
  rationale: 保留בְּיוֹם的具体时间表达，也按祷告语境将קרא译为“呼求”，不明说原文未出现的宾语。
- source_word: זֶה יָדַעְתִּי
  choice: 这一点我知道
  rationale: 采用指示性读法，即“我知道这件事”；同时以脚注保留工具性读法“由此我知道”。
- source_word: כִּי
  choice: ：
  rationale: 此处引出所知道的内容；中文用冒号自然呈现内容从句关系，无须机械译出“就是”。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本节指独一的神；“神”是现代中文圣经语体中自然、庄重的对应词。
- source_word: לִי
  choice: 是帮助我的
  rationale: 结合仇敌退后与呼求蒙应允的语境，לִי表达神对诗人的支持或眷顾；此译比表示所有关系的“是我的”更清楚，也避免口语化的“站在我这边”。
theological_decisions:
- issue: “אֱלֹהִים לִי”的含义
  choice: 神支持、帮助诗人
  alternative: 神是我的／神属于我
  rationale: 该省略式短句本身可容许所属意味，但上下文谈到诗人呼求后仇敌退后，主要强调神施予支持。译作“神是帮助我的”保留关系性表达，同时不引入宗派性解释。
- issue: “זֶה יָדַעְתִּי”的句法关系
  choice: “这一点我知道”，后句说明所知道的内容
  alternative: “由此我知道”，以前述仇敌退后作为认识神支持的凭据
  rationale: 指示代词זֶה既可直接指向后面的内容，也可能具有工具性。正文采用较直接的内容读法，脚注保留另一种真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗篇语体。“仇敌”“呼求”保持经文的祷告色彩；句法尽量贴近原文，又避免生硬直译。
