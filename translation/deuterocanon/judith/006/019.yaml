  - your holy ones
  rationale: The participle from ἁγιάζω can be rendered more dynamically as 'consecrated' or substantivally as 'holy ones.' The chosen wording preserves the holiness/set-apart concept without importing a narrower cultic or angelic sense not explicit in the text.
