translation:
  text: '… the times are close and already pressing in. The pitcher is near the well, the ship the harbor, the journey the city, and life its completion.


    So then receive his commandments, that you may not be cut off from the greatness of his mercy, but may find rest and not condemnation.


    For when the Most High brings these things to pass, there will no longer be room for repentance[b], or a boundary for the times, or an extension of the seasons, or a turning toward rest; nor will anyone be helped by prayer, or by the mediation of fathers, or by the petition of prophets, or by the aid of the righteous, or by the weeping of women, or by the tenderness of little children, or by the crying of infants, or by the innocence of newborns, or by the righteousness of their fathers. None of the things once thought and seen to be helpers will be able to help.


    For each of us will then be judged by himself alone.


    And he will preserve for his age those who have hope in him, but he will at once destroy those who are defiled with sins.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'stand by himself alone'.
    reason: previous_rendering
  - marker: b
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for the opportunity no longer available; preserve the texts own account of judgment.
    reason: lexical_alternative
status: draft
lexical_decisions:
- source_word: ܦܩ̈ܘܕܘܗܝ
  chosen: his commandments
  alternatives:
  - his decrees
  - his commands
  lexicon: Payne Smith
  rationale: The term naturally carries the sense of authoritative divine commands. “Commandments” preserves the covenantal and exhortatory force in this closing warning.
- source_word: ܢܝܚ / ܬܐܢܝܚܘܢ
  chosen: find rest
  alternatives:
  - be comforted
  - have relief
  lexicon: Payne Smith
  rationale: The immediate contrast is with condemnation at the judgment. “Find rest” preserves both relief and eschatological repose without flattening the image.
- source_word: ܒܒܟܝܐ ܕܢܫ̈ܐ
  chosen: the weeping of women
  alternatives:
  - women’s lamentation
  lexicon: Payne Smith
  rationale: A literal rendering keeps the lament rhetoric vivid and fits the surrounding list of ineffective appeals and intercessory gestures.
- source_word: ܒܛܝܒܘܬܐ ܕܛܠܝ̈ܐ
  chosen: the tenderness of little children
  alternatives:
  - the charm of children
  - the goodness of little ones
  lexicon: Payne Smith
  rationale: The noun suggests pleasantness, kindness, or endearing innocence. “Tenderness” best fits the emotional appeal implied by the list.
- source_word: ܒܕܟܝܘܬܐ ܕܝܠܝ̈ܕܐ
  chosen: the innocence of newborns
  alternatives:
  - the purity of infants
  - the cleanness of babies
  lexicon: Payne Smith
  rationale: The phrase points to childlike purity as something people might think could plead for mercy. “Innocence” communicates that idiomatically in English.
- source_word: ܐܪܙܐ
  chosen: room for repentance
  alternatives:
  - room for reorientation
  - room for repentance
  - mystery
  - sentence
  - proclamation
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for the opportunity no longer available; preserve the texts own account of judgment. Contextual editorial assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: ܡܦܠܓܝܢ ܒܚܛܝ̈ܬܐ
  chosen: defiled with sins
  alternatives:
  - divided by sins
  - entangled in sins
  lexicon: Payne Smith
  rationale: The literal force may suggest being split up or distributed among sins, but idiomatic English needs a moral-state expression. “Defiled with sins” communicates the resulting condition clearly.
theological_decisions:
- issue: Whether to compress the long catalogue of failed intercessions into a general statement about no one being able to help at the judgment
  chosen_reading: Retained the catalogue of prayers, prophets, righteous people, women, children, and fathers as separate elements.
  alternative_readings:
  - Summarize as 'no intercession will help then'
  rationale: The Syriac rhetoric is cumulative and severe. Keeping the list preserves the chapter’s emphasis on final individual accountability before divine judgment.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: How explicitly to render the final preservation clause
  chosen_reading: Rendered it as 'he will preserve for his age those who have hope in him.'
  alternative_readings:
  - '''those in whom there is hope'''
  - '''those whom he finds worthy'''
  rationale: The Syriac points to people whose hope is set in him; making that relation explicit yields clear English without adding a new theological idea.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
