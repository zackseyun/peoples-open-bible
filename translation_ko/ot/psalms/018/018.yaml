- source_word: מֵאֹיְבִי עָז
  english_pob_choice: from my strong enemy
  chosen_korean: 강한 원수에게서
  alternatives_korean:
  - 힘센 원수에게서
  - 사나운 원수에게서
  lexicon: HALOT
  rationale: עָז는 '강한, 힘센'의 뜻이므로 원수의 세기를 직접 드러내는 '강한'을 선택했습니다.
- source_word: וּמִשֹּׂנְאַי
  english_pob_choice: and from those who hated me
  chosen_korean: 저를 미워하는 자들에게서
  alternatives_korean:
  - 저를 미워하던 자들에게서
  - 저를 증오하는 자들에게서
  lexicon: HALOT
  rationale: 히브리어 분사형이 지속적인 적대 상태를 가리키므로, 자연스러운 한국어 관계절로 풀어 옮겼습니다.
- source_word: אָמְצוּ מִמֶּנִּי
  english_pob_choice: for they were too mighty for me
  chosen_korean: 그들이 저보다 더 강했기 때문입니다
  alternatives_korean:
  - 그들이 저보다 강했기 때문입니다
  - 그들이 저를 압도했기 때문입니다
  lexicon: HALOT
  rationale: אָמַץ의 '강하다'와 מן의 비교 의미를 합쳐, 원인절로 풀어 '저보다 더 강했다'고 옮겼습니다.
theological_decisions:
- issue: 시편 18:18의 동사 시제 처리
  chosen_reading: 과거 회고형으로 번역해 하나님의 구원 행위를 이미 이루어진 사건으로 제시했습니다.
  alternative_readings:
  - 현재적/상시적 의미를 살린 '건져 주십니다'
  - 시적 일반진리로 처리한 '건져 주시는 분이십니다'
  rationale: 문맥이 구원받은 경험을 회고하는 대목이므로, 과거 시제를 사용해 서사의 흐름과 구원의 체험적 증언을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
