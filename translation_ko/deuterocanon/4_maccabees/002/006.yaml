  yaml_path: translation/deuterocanon/4_maccabees/002/006.yaml
  text: And yet, when the law tells us not to desire, I could much more persuade you that reason is able to master desires, just as it also masters the passions that hinder righteousness.
translation:
  language: ko
  text: 그런데도 율법이 우리에게 욕망을 품지 말라고 말하였는데, 이성이 욕망들을 지배할 수 있다는 것은 이성이 의를 방해하는 정념들을 다스릴 수 있는 것과 마찬가지로, 제가 여러분을 훨씬 더 설득할 수 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘율법’은 여기서 유대 율법을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: ὁ νόμος
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 토라
  lexicon: νόμος
  rationale: 본문의 대상은 일반적 규범이 아니라 유대 율법을 가리키므로, POB 기본어인 ‘율법’을 유지했습니다.
- source_word: ἐπιθυμεῖν / ἐπιθυμιῶν
  english_pob_choice: desire / desires
  chosen_korean: 욕망하다 / 욕망들
  alternatives_korean:
  - 갈망하다 / 갈망들
  - 정욕하다 / 정욕들
  lexicon: ἐπιθυμέω
  rationale: 영문 POB의 ‘desire(s)’를 따라, 본문이 특정 성적 욕망보다 보다 넓은 욕구 일반을 말하므로 ‘욕망’으로 옮겼습니다.
- source_word: ὁ λογισμός
  english_pob_choice: reason
  chosen_korean: 이성
  alternatives_korean:
  - 이치
  - 생각
  - 이성적 판단
  lexicon: λογισμός
  rationale: 문맥상 욕망을 제어하는 인간의 합리적 능력을 가리키므로, 가장 직접적인 대응인 ‘이성’을 택했습니다.
- source_word: τῶν κωλυτικῶν τῆς δικαιοσύνης παθῶν
  english_pob_choice: the passions that hinder righteousness
  chosen_korean: 의를 방해하는 정념들
  alternatives_korean:
  - 의를 막는 감정들
  - 의를 저해하는 정욕들
  lexicon: πάθη / δικαιοσύνη
  rationale: πάθη는 단순 감정보다 정념·격정을 뜻하므로 ‘정념들’로 옮기고, δικαιοσύνη는 POB 기본어에 따라 ‘의’로 유지했습니다.
theological_decisions:
- issue: 이성의 지배력에 대한 진술의 강도
  chosen_reading: 본문은 이성이 욕망뿐 아니라 의를 방해하는 정념들까지도 지배할 수 있다고 긍정적으로 진술합니다.
  alternative_readings:
  - 윤리적 훈계 수준의 완곡한 진술
  - 단순한 비교 구문으로 약화된 이해
  rationale: 그리스어의 δυνατόν 진술과 비교구문(ὥσπερ καί)을 살려, 인간 이성의 도덕적 통제 가능성을 약화시키지 않았습니다.
  doctrine_reference: 헬라 헬레니즘 윤리 맥락에서의 인간 이성론
