id: ISA.51.21
reference: Isaiah 51:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֛ן שִׁמְעִי נָ֥א זֹ֖את עֲנִיָּ֑ה וּ/שְׁכֻרַ֖ת וְ/לֹ֥א מִ/יָּֽיִן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/021.yaml
  text: 'Therefore, please hear this, afflicted one, drunk, but not from wine:'
translation:
  language: ko
  text: 그러므로 고난받는 이여, 취하였으나 포도주로 취한 것은 아닌 이여, 부디 이 말을 들으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그러기에
  lexicon: 논리 연결어
  rationale: 원인-결과의 예언적 전환을 자연스럽게 연결하는 표준적인 합쇼체 표현입니다.
- source_word: שִׁמְעִי נָא
  english_pob_choice: please hear
  chosen_korean: 이 말을 들으십시오
  alternatives_korean:
  - 부디 들으십시오
  - 들어 보십시오
  lexicon: שׁמע
  rationale: 청유의 נָא를 살려 공손한 요청으로 옮기되, 대상이 단순히 '듣다'가 아니라 '이 말'을 듣는다는 점을 분명히 했습니다.
- source_word: עֲנִיָּה
  english_pob_choice: afflicted one
  chosen_korean: 학대받는 자여
  alternatives_korean:
  - 고난받는 자여
  - 괴로움당한 자여
  lexicon: עָנָה/עָנִי
  rationale: 문맥상 단순 감정 상태보다 압제와 고통을 입은 존재를 가리키므로, 수동적 피해성을 드러내는 표현을 택했습니다.
- source_word: וּשְׁכֻרַת
  english_pob_choice: drunk
  chosen_korean: 술에 취한 자여
  alternatives_korean:
  - 취한 자여
  - 만취한 자여
  lexicon: שׁכר
  rationale: 이미지의 충격을 유지하면서도 한국어에서 자연스럽게 읽히는 직설적 표현으로 옮겼습니다.
- source_word: וְלֹא מִיָּיִן
  english_pob_choice: but not from wine
  chosen_korean: 그러나 포도주로 취한 것이 아닌
  alternatives_korean:
  - 그런데 포도주로 인한 것이 아닌
  - 술로 인한 것이 아닌
  lexicon: יין
  rationale: יין을 일반적인 '술'보다 더 직접적으로 '포도주'로 옮겨 원문 대비를 살렸고, 부정 대조를 명시했습니다.
theological_decisions:
- issue: 예언적 호명에서의 직접 호칭과 공손한 청유의 긴장
  chosen_reading: 호칭은 감정적·수사적으로 직설적으로 두고, 명령은 합쇼체로 완화하지 않았습니다.
  alternative_readings:
  - 학대받고 술에 취했으나 포도주로 취한 것은 아닌 이여, 들어 주십시오
  - 억눌린 이여, 술에 취한 이여, 그러나 포도주로 취한 것은 아닌 이여, 들으십시오
  rationale: 원문의 강한 대조와 호소를 보존하기 위해 호칭적 반복을 살리되, 현대 한국어에서는 어색하지 않도록 정중한 요청형으로 정리했습니다.
  doctrine_reference: 예언서 수사와 직접 화법 보존
- issue: '''drunk, but not from wine''의 상징성'
  chosen_reading: 물리적 취함이 아니라, 비유적 혼미와 압제의 상태를 암시하는 표현으로 남겼습니다.
  alternative_readings:
  - 정신이 혼미한 자여
  - 비틀거리는 자여
  rationale: 문맥상 실제 음주보다 비참한 상태를 비유하는 표현이므로, 직유의 충격을 약화하지 않기 위해 원문의 역설을 그대로 살렸습니다.
  doctrine_reference: 이사야 51장의 예언적 풍자
