  - 기름지게 여기시기를
  lexicon: HALOT
  rationale: 직역의 '기름지게 여기다'는 현대 한국어에서 의미가 불명확하므로, 제물을 호의적으로 받으신다는 관용적 뜻을 살려 '받아 주시다'로 옮겼습니다.
