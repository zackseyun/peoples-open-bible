id: PSA.119.126
reference: Psalms 119:126
source:
  edition: WLC
  text: עֵ֭ת לַ/עֲשׂ֣וֹת לַ/יהוָ֑ה הֵ֝פֵ֗רוּ תּוֹרָתֶֽ/ךָ׃
translation:
  text: It is time for Yahweh to act[a], for they have broken your law.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “It is time to act for Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: לַיהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: תּוֹרָתֶֽךָ
  chosen: law
  alternatives:
  - instruction
  - teaching
  lexicon: HALOT
  rationale: תּוֹרָה is God's revealed instruction. 'Law' is the established English gloss and is kept consistent across the psalm's eight terms for God's word; 'instruction/teaching' preserved as alternatives.
- source_word: הֵפֵרוּ
  chosen: they have broken
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Third-person plural Hiphil perfect with an unnamed plural subject; “they have broken” preserves both voice and ambiguity.
