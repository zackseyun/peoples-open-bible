id: PSA.18.50
reference: Psalms 18:50
source:
  edition: WLC
  text: מגדל יְשׁוּע֪וֹת מַ֫לְכּ֥/וֹ וְ/עֹ֤שֶׂה חֶ֨סֶד לִ/מְשִׁיח֗/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֗/וֹ עַד עוֹלָֽם׀־׃
translation:
  text: He grants great victories to his king[a] and shows steadfast love to his anointed, to David and his offspring forever.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The same Hebrew consonants can also be read, “He is a tower of deliverance for his king.”
    reason: alternative_reading
lexical_decisions:
- source_word: מגדל
  chosen: makes ... great
  alternatives:
  - is a tower of
  - magnifies
  lexicon: HALOT
  rationale: The traditional reading takes the form as a causative participle, “making great.” This retains the verbal force lost in “gives great,” while the alternative noun reading is retained in a note.
- source_word: יְשׁוּעוֹת
  chosen: victories
  alternatives:
  - salvations
  - deliverances
  lexicon: HALOT
  rationale: Plural of יְשׁוּעָה can mean acts of salvation/deliverance. In royal-military context, 'victories' is the most natural English expression while preserving the sense of repeated saving acts.
- source_word: מַלְכּוֹ
  chosen: his king
  alternatives:
  - his kingly one
  lexicon: HALOT
  rationale: Straightforward construct with 3ms suffix. 'His king' preserves the covenantal royal relationship.
- source_word: וְעֹשֶׂה חֶסֶד
  chosen: and shows steadfast love
  alternatives:
  - and does covenant loyalty
  - and shows lovingkindness
  - and acts with faithful love
  lexicon: HALOT
  rationale: חֶסֶד is a key covenant term. 'Steadfast love' is established, readable, and preserves covenantal weight better than the vaguer 'kindness.' The participle with waw is rendered verbally in parallel with the first clause.
- source_word: לִמְשִׁיחוֹ
  chosen: to his anointed
  alternatives:
  - to his Messiah
  lexicon: HALOT
  rationale: Although משיח can underlie 'Messiah,' here the immediate referent is the Davidic king, clarified by the following apposition 'to David.' Therefore 'his anointed' is the most contextually precise main-text rendering, while preserving the messianic resonance in a footnote.
- source_word: לְדָוִד
  chosen: to David
  lexicon: HALOT
  rationale: Personal name transliterated per philosophy.
- source_word: וּלְזַרְעוֹ
  chosen: and his offspring
  alternatives:
  - and to his seed
  - and to his descendants
  lexicon: HALOT
  rationale: English naturally carries the preceding “to” over to the coordinated phrase; “offspring” retains the collective singular.
- source_word: עַד עוֹלָם
  chosen: forever
  alternatives:
  - for eternity
  - unto the age
  lexicon: HALOT
  rationale: Idiomatic English rendering of enduring duration; concise and natural.
- source_word: יְשׁוּעוֹת מַלְכּוֹ
  chosen: his king’s victories
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: “Victories” is a natural contextual rendering of plural deliverances in this royal setting, and the possessive construction clearly represents the Hebrew relation.
