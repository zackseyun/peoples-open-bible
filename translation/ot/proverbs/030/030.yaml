id: PRO.30.30
reference: Proverbs 30:30
source:
  edition: WLC
  text: לַ֭יִשׁ גִּבּ֣וֹר בַּ/בְּהֵמָ֑ה וְ/לֹא יָ֝שׁ֗וּב מִ/פְּנֵי כֹֽל־־׃
translation:
  text: a lion, mighty among the animals, which does not retreat from anything;
  philosophy: dynamic
lexical_decisions:
- source_word: לַיִשׁ
  chosen: a lion
  alternatives:
  - a lion
  lexicon: HALOT
  rationale: The anarthrous poetic noun functions as one member of the numerical list.
- source_word: גִּבּוֹר
  chosen: mighty
  alternatives:
  - strong
  - valiant
  lexicon: HALOT
  rationale: גִּבּוֹר denotes strength, might, or prowess. 'Mighty' is concise and idiomatic in English, preserving the elevated proverbial tone without overinterpreting toward military valor.
- source_word: בַּבְּהֵמָה
  chosen: among the animals
  alternatives:
  - among animals
  - among the beasts
  lexicon: HALOT
  rationale: This is a natural rendering of the broad animal-category term in this context.
- source_word: וְלֹא יָשׁוּב
  chosen: and does not turn back
  alternatives:
  - and does not retreat
  - and does not turn away
  lexicon: HALOT
  rationale: שׁוּב literally means 'turn back/return.' In context it describes fearless refusal to withdraw. 'Does not turn back' keeps the Hebrew image while remaining natural English; 'retreat' is interpretive and slightly more military.
- source_word: מִפְּנֵי כֹל
  chosen: before any
  alternatives:
  - before anyone
  - from before all
  - before anything
  lexicon: HALOT
  rationale: The idiom מִפְּנֵי means 'before' in the sense of in the presence of or in confrontation with, often with the nuance of shrinking back from. כֹל is broad ('any/all'). Because the verse concerns the lion among beasts, 'before any' preserves the concise, sweeping force without narrowing the object unnecessarily.
- source_word: וְלֹא יָשׁוּב מִפְּנֵי כֹל
  chosen: which does not retreat from anything
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The clause portrays refusal to turn back from any adversary or threat; this preserves the source image in complete natural English.
