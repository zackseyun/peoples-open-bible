  from: let your salvation, O God, set me on high
  to: O God, let your salvation set me on high
  rationale: The current placement of the vocative 'O God' between the subject ('your salvation') and the verb ('set me on high') mirrors the Hebrew poetic word order but feels slightly stilted in English. Moving the vocative to the beginning of the clause is a more common and natural construction for direct address in English prayer, which would improve the flow of the line without changing the meaning.
