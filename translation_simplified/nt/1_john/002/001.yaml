translation:
  language: en
  text: My dear children, I am writing these things to you so that you may not sin. But if anyone does sin, we have Jesus Christ[b], the Righteous One, as our advocate[a] with the Father, speaking on our behalf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek word translated “advocate” can also mean “helper,” “counselor,” or “comforter.”
    reason: lexical_alternative
  - marker: b
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: My little children
  simplified_phrase: My dear children
  preserved_meaning: John addresses his readers as children with pastoral affection.
  reasoning_layer_used: Lexical decision for Τεκνία μου.
  rationale: “Dear” naturally conveys the diminutive tenderness while retaining the family image.
- pob_phrase: I write these things to you
  simplified_phrase: I am writing these things to you
  preserved_meaning: John refers to what he is presently writing to his readers.
  reasoning_layer_used: Lexical decision for ταῦτα γράφω ὑμῖν.
  rationale: The progressive form is natural in a letter and preserves the unspecified referent.
- pob_phrase: we have an advocate with the Father—Jesus the Messiah the Righteous One
  simplified_phrase: we have Jesus the Messiah, the Righteous One, as our advocate with the Father, speaking on our behalf
  preserved_meaning: Believers have Jesus as their righteous representative and supporter with the Father.
  reasoning_layer_used: Lexical and theological decisions for παράκλητον, πρὸς τὸν πατέρα, Χριστός, and δίκαιον.
  rationale: The reordered clause identifies the advocate clearly while preserving the assurance that believers have him.
interpretive_expansions:
- pob_phrase: an advocate with the Father
  rendering: our advocate with the Father, speaking on our behalf
  claim: Jesus represents and supports believers in relation to the Father.
  evidence:
  - The POB rationale gives παράκλητος a representative and intercessory sense here.
  - The phrase “with the Father” places this advocacy in relation to the Father.
  confidence: high
  alternatives_preserved:
  - helper
  - counselor
  - comforter
  external_witnesses:
  - BDAG
translation_notes:
  risk_flags:
  - risk: “Speaking on our behalf” may sound narrower than the full range of “advocate.”
    mitigation: The main text retains “advocate,” and footnote [a] preserves its broader lexical range.
