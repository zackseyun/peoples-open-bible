id: PSA.9.13
reference: Psalms 9:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָֽנְנֵ֬/נִי יְהוָ֗ה רְאֵ֣ה עָ֭נְיִ/י מִ/שֹּׂנְאָ֑/י מְ֝רוֹמְמִ֗/י מִ/שַּׁ֥עֲרֵי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/013.yaml
  text: Be gracious to me[a], O Yahweh; see my affliction caused by those who hate me, you who lift me up from the gates of death[b].
  footnotes:
  - marker: a
    text: Or “Have mercy on me.”
    reason: lexical_alternative
  - marker: b
    text: “The gates of death” is a Hebrew image for being at the threshold or under the power of death.
    reason: cultural_note
translation:
  language: ko
  text: 야훼여, 제게 은혜를 베풀어 주십시오. 저를 미워하는 자들에게서 받는 제 고난을 살펴보십시오. 죽음의 문들에서 저를 들어 올리시는 분이여,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죽음의 문들’은 죽음의 경계 또는 죽음의 세력에 놓인 상태를 나타내는 히브리어 비유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: —
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 앞 절의 이유를 밝히는 접속으로 기능하므로, 한국어에서는 자연스러운 행 문맥으로 처리하고 별도 접속어를 과도하게 드러내지 않았습니다.
- source_word: דֹרֵשׁ דָּמִים
  english_pob_choice: the one who avenges bloodshed
  chosen_korean: 피 흘림을 심판하시는 분
  alternatives_korean:
  - 피를 요구하시는 분
  - 피값을 요구하시는 분
  - 피 흘림의 보복자
  lexicon: HALOT
  rationale: 문구는 단순히 ‘피를 찾는’ 뜻이 아니라 피 흘림에 대한 책임 추궁과 심판을 가리키므로, 신격적이고 재판적 의미를 살려 옮겼습니다.
- source_word: צַעֲקַת עניים
  english_pob_choice: the cry of the afflicted
  chosen_korean: 고난받는 이들의 부르짖음
  alternatives_korean:
  - 가난한 자들의 부르짖음
  - 억눌린 이들의 부르짖음
  - 고통받는 이들의 외침
  lexicon: HALOT
  rationale: עֲנִיִּים은 단순한 경제적 가난보다 억눌림과 고난을 포함할 수 있으므로, 피 흘림과 정의의 맥락에 맞게 넓은 의미를 살렸습니다.
theological_decisions:
- issue: 하나님의 혈흔 책임 추궁과 기억의 의미
  chosen_reading: 하나님은 피 흘림을 그냥 아시는 데 그치지 않고, 그것을 심판하고 억눌린 이들의 호소를 잊지 않으십니다.
  alternative_readings:
  - 그저 사건을 기억하신다는 뜻
  - 피를 문자적으로 찾으신다는 뜻
  rationale: 히브리어 관용구는 도덕적·법적 책임을 묻는 표현이므로, 단순한 인지나 물리적 복수로 약화시키지 않았습니다.
  doctrine_reference: 시편의 하나님의 न्याय/심판과 언약적 정의
