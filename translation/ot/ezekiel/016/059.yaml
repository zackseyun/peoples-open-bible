- issue: Rendering the divine name in the compound אֲדֹנָי יְהוִה
  chosen_reading: the Lord GOD
  alternative_readings:
  - the Lord Yahweh
  - Lord GOD
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Meaning of אָלָה in covenant context
  chosen_reading: oath
  alternative_readings:
  - curse
  - oath-curse
  rationale: The verse accuses Jerusalem of despising the binding covenantal oath and thereby breaking the covenant. Because אָלָה can also carry the sense of a curse sanction attached to an oath, that alternative is preserved in a footnote rather than resolved absolutely.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
