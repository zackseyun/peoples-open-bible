  text: Deliver me from all my transgressions; do not make me the reproach of a fool[a].
  footnotes:
  - marker: a
    text: Or “the disgrace of a fool.” The Hebrew may mean becoming an object of a fool’s reproach or becoming a disgrace associated with folly.
