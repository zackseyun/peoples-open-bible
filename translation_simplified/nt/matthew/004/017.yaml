translation:
  language: en
  text: From that time on, Jesus began to proclaim, “Reorient toward God[r1], for the kingdom of heaven[a] has come near[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Greek 'the kingdom of the heavens.' Matthew regularly uses this expression where other Gospels say 'the kingdom of God.'
    reason: simplification_note
  - marker: b
    text: Or 'is near.' The Greek verb suggests that the kingdom has arrived and remains close at hand.
    reason: simplification_note
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
