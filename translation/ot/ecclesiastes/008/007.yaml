id: ECC.8.7
reference: Ecclesiastes 8:7
source:
  edition: WLC
  text: כִּֽי אֵינֶ֥/נּוּ יֹדֵ֖עַ מַה שֶּׁ/יִּֽהְיֶ֑ה כִּ֚י כַּ/אֲשֶׁ֣ר יִֽהְיֶ֔ה מִ֖י יַגִּ֥יד לֽ/וֹ־־׃
translation:
  text: For he does not know what will happen—who can tell him how it will unfold[a]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “when it will happen.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - because
  lexicon: HALOT
  rationale: Used at the start as an explanatory conjunction linking this verse to the preceding statement. 'For' preserves the concise explanatory force better than 'because' in English style here.
- source_word: אֵינֶנּוּ
  chosen: he does not
  alternatives:
  - one does not
  - there is not for him
  lexicon: HALOT
  rationale: The form combines negation with a 3ms pronominal suffix. In context it refers to the generic human subject carried through the surrounding discourse; English naturally renders this as 'he does not.'
- source_word: יֹדֵעַ
  chosen: know
  alternatives:
  - understand
  lexicon: HALOT
  rationale: The participle of ידע denotes knowing rather than deeper interpretive understanding here; the point is ignorance of the future.
- source_word: מַה שֶּׁיִּהְיֶה
  chosen: what will be
  alternatives:
  - what will happen
  - what is to be
  lexicon: HALOT
  rationale: A relatively formal rendering of the interrogative plus היה. 'What will be' preserves the Hebrew idiom and echoes Qoheleth's style, while still being intelligible modern English.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - indeed
  lexicon: HALOT
  rationale: The second כִּי introduces the reason for the previous clause. 'For' keeps the parallel explanatory structure of the verse.
- source_word: כַּאֲשֶׁר יִהְיֶה
  chosen: how it will be
  alternatives:
  - when it will be
  - as it will be
  - what will happen
  lexicon: HALOT
  rationale: The phrase is somewhat idiomatic and can be rendered in several ways. Here it most naturally refers to the manner/course of what is coming, not merely its timing. 'How it will be' distinguishes it from the earlier 'what will be' and preserves the rhetorical progression.
- source_word: מִי יַגִּיד לוֹ
  chosen: who can tell him
  alternatives:
  - who will tell him
  - who can declare to him
  lexicon: HALOT
  rationale: Hiphil of נגד means to tell, declare, make known. 'Can tell him' brings out the rhetorical impossibility implied by the question better than a simple future 'will tell him.'
