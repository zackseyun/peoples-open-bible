id: PSA.132.18
reference: Psalms 132:18
source:
  edition: WLC
  text: א֭וֹיְבָי/ו אַלְבִּ֣ישׁ בֹּ֑שֶׁת וְ֝/עָלָ֗י/ו יָצִ֥יץ נִזְרֽ/וֹ׃
translation:
  text: I will clothe his enemies with shame, but his crown will blossom on him[a].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “his crown will shine on him.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֹיְבָיו
  chosen: his enemies
  alternatives:
  - those hostile to him
  lexicon: HALOT
  rationale: Straightforward plural noun with 3ms suffix; 'enemies' is the natural and consistent English rendering.
- source_word: אַלְבִּישׁ
  chosen: I will clothe
  alternatives:
  - I will dress
  lexicon: HALOT
  rationale: Hiphil of לבשׁ means 'cause to be clothed/clothe.' First person singular is explicit; retaining 'I will' preserves the speaker's agency.
- source_word: בֹּשֶׁת
  chosen: with shame
  alternatives:
  - with disgrace
  lexicon: HALOT
  rationale: The noun denotes shame/disgrace. 'Shame' is concise and idiomatic in the collocation 'clothe with shame,' while preserving the metaphor.
- source_word: וְעָלָיו
  chosen: but on him
  alternatives:
  - and upon him
  - while on him
  lexicon: HALOT
  rationale: The conjunction marks contrast with the prior colon in context, so 'but' brings out the adversative sense in English. 'On him' preserves the prepositional image.
- source_word: יָצִיץ
  chosen: will flourish
  alternatives:
  - will blossom
  - will shine forth
  lexicon: HALOT
  rationale: The verb can denote blossoming/sprouting and by extension flourishing. With 'crown' as subject, 'will flourish' communicates enduring vitality and royal prosperity in idiomatic English.
- source_word: נִזְרוֹ
  chosen: his crown
  alternatives:
  - his diadem
  - his consecration
  lexicon: HALOT
  rationale: In this Davidic royal context, “crown” is the most natural rendering; “diadem” is a valid noted alternative.
- source_word: וְעָלָיו יָצִיץ נִזְרוֹ
  chosen: but his crown will blossom on him
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: “Blossom” retains the verb’s botanical image, and placing “on him” after the subject produces intelligible English while preserving the prepositional relation.
