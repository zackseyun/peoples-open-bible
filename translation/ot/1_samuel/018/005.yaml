  from: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
  to: David went wherever Saul sent him and was successful[a]. So Saul put him in command of the fighting men, and this pleased all the people as well as Saul’s servants.
