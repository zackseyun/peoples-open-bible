id: PSA.68.28
reference: Psalms 68:28
source:
  edition: WLC
  text: צִוָּ֥ה אֱלֹהֶ֗י/ךָ עֻ֫זֶּ֥/ךָ עוּזָּ֥/ה אֱלֹהִ֑ים ז֝֗וּ פָּעַ֥לְתָּ לָּֽ/נוּ׃
translation:
  text: Your God has decreed strength for you. Strengthen, O God, what you have done for us[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “Show your strength, O God, you who have acted for us.” The Hebrew syntax is difficult.
    reason: alternative_reading
lexical_decisions:
- source_word: צִוָּה
  chosen: has commanded
  alternatives:
  - commands
  - ordains
  lexicon: HALOT
  rationale: The perfect verb can be rendered as a completed action with present relevance. 'Has commanded' preserves the verbal force of issuing an authoritative decree better than a weaker paraphrase.
- source_word: אֱלֹהֶיךָ
  chosen: your God
  alternatives:
  - your gods
  lexicon: HALOT
  rationale: Although morphologically plural in form, אֱלֹהִים with singular sense commonly refers to the God of Israel. The 2ms suffix yields 'your God.'
- source_word: עֻזֶּךָ
  chosen: your strength
  alternatives:
  - your might
  lexicon: HALOT
  rationale: The noun denotes strength or might. 'Strength' is the most natural and consistent English rendering here.
- source_word: עוּזָה
  chosen: Strengthen
  alternatives:
  - Be strong
  - Strengthen
  - Establish strength
  lexicon: HALOT
  rationale: A plausible transitive imperative that takes the following relative clause as its object.
- source_word: אֱלֹהִים
  chosen: O God
  alternatives:
  - God
  lexicon: HALOT
  rationale: Vocative sense is demanded by the surrounding petition. English naturally marks this with 'O God.'
- source_word: זוּ
  chosen: you who
  alternatives:
  - this
  - which
  lexicon: HALOT
  rationale: The relative particle introduces a clause describing God. 'You who' is idiomatic in direct address.
- source_word: פָּעַלְתָּ
  chosen: have done
  alternatives:
  - have acted
  - have done
  lexicon: HALOT
  rationale: Natural English for the effective action denoted here; “have worked for us” is awkward in this construction.
- source_word: לָּנוּ
  chosen: for us
  alternatives:
  - on our behalf
  - to us
  lexicon: HALOT
  rationale: 'The preposition here is best taken in a benefactive sense: God has acted for the people''s benefit.'
- source_word: זוּ פָּעַלְתָּ לָּנוּ
  chosen: what you have done for us
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: The relative clause can denote the work God has done and function as the object of “Strengthen.”
