  text: 내가 말하기를, “너희는 신들이며, 너희 모두는 지극히 높으신 이의 아들들입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: gods
  chosen_korean: 신들
  alternatives_korean:
  - 하나님들
  - 신적 존재들
  - 신
  lexicon: אֱלֹהִים
  rationale: 본문의 복수형 명사와 POB의 “gods”를 반영해, 단수의 참하나님(하나님)과 구별되는 복수 표현으로 옮겼습니다. 한국어에서는 문맥상 ‘신들’이 가장 직접적입니다.
- source_word: בְּנֵי עֶלְיוֹן
  english_pob_choice: sons of the Most High
  chosen_korean: 지극히 높으신 이의 아들들
  alternatives_korean:
  - 가장 높으신 분의 아들들
  - 높으신 이의 자녀들
  lexicon: בְּנֵי עֶלְיוֹן
  rationale: ‘sons’를 성중립화하지 않고 원문의 자녀-신분 비유를 살려 ‘아들들’로 유지했습니다. ‘Most High’는 하나님 칭호로서 ‘지극히 높으신 이’가 자연스럽습니다.
- source_word: כֻּלְּכֶם
  english_pob_choice: all of you
  chosen_korean: 너희 모두는
  alternatives_korean:
  - 너희는 모두
  - 너희 전부는
  lexicon: כֻּלְּכֶם
  rationale: 대상 전체를 강조하는 כֻּלְּכֶם을 한국어의 자연스러운 총칭 표현인 ‘너희 모두는’으로 옮겼습니다.
- source_word: אָמַרְתִּי
  english_pob_choice: I said
  chosen_korean: 제가 말하기를
  alternatives_korean:
  - 내가 말했습니다
  - 내가 말했노라
  lexicon: אָמַרְתִּי
  rationale: 시편의 직접 인용 도입을 현대 한국어 문장 흐름에 맞게 자연스럽게 처리하면서도, 화자가 선포한 발화임을 보존했습니다.
theological_decisions:
- issue: ‘gods’의 신격 표현을 약화하지 않을지
  chosen_reading: ‘신들’로 직역하여 본문의 충격적 진술을 유지했습니다.
  alternative_readings:
  - ‘신적 존재들’로 완화
  - ‘재판장들’로 해석적 번역
  rationale: 시편 82편 6절의 핵심은 호칭의 강도를 유지하는 데 있으므로, 해석으로 미리 좁히지 않고 원문이 말하는 복수 명칭을 그대로 드러냈습니다.
  doctrine_reference: 시 82:6 문맥과 요 10:34의 인용 논의
