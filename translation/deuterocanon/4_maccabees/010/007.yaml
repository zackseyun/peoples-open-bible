id: 4MA.10.7
reference: 4 Maccabees 10:7
source:
  edition: lxx-swete-1909
  text: καὶ κατὰ μηδένὰ τρόπον ἰσχύοντες αὐτὸν ἄγξαι, περισύραντες τὸ δέρμα σὺν ἄκραις ταῖς τῶν δακτύλων κορυφαῖς ἀπεσκύθισον, καὶ εὐθέως ἦγον ἐπὶ τὸν τροχόν.
