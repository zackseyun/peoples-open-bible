  text: לַ֭/מְנַצֵּחַ עַל שׁוּשַׁ֣ן עֵד֑וּת מִכְתָּ֖ם לְ/דָוִ֣ד לְ/לַמֵּֽד־׃ בְּ/הַצּוֹת֨/וֹ ׀ אֶ֥ת אֲרַ֣ם נַהֲרַיִם֮ וְ/אֶת־אֲרַ֪ם צ֫וֹבָ֥ה וַ/יָּ֤שָׁב יוֹאָ֗ב וַ/יַּ֣ךְ אֶת־אֱד֣וֹם בְּ/גֵיא־מֶ֑לַח שְׁנֵ֖ים עָשָׂ֣ר אָֽלֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/000.yaml
  text: 'For the choirmaster: according to “Lily of Testimony.”[a] A miktam[b] of David[c], for teaching when he fought against Aram-naharaim and Aram-zobah, and Joab returned and struck down twelve thousand of Edom in the Valley of Salt.'
  footnotes:
  - marker: a
    text: Or possibly, “to the tune of ‘Lily of Testimony.’” The Hebrew likely preserves a musical or liturgical title, but its exact sense is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The term “miktam” is a Hebrew genre label of uncertain meaning; some take it as a musical or literary designation rather than translating it.
    reason: lexical_alternative
  - marker: c
    text: “Of David” may also mean “by David” or “for David”; the Hebrew construction can indicate authorship, association, or dedication.
    reason: alternative_reading
translation:
  language: ko
  text: 지휘자에게. 「증언의 백합」에 맞추어.[a] 다윗의[c] 믹담.[b] 가르치기 위하여. 그가 아람나하라임과 아람소바와 싸우고, 요압이 돌아와 소금 골짜기에서 에돔 사람 만 이천 명을 쳤을 때의 일입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「증언의 백합」의 곡조로. 히브리어는 음악적 또는 예전적 표제를 보존하는 것으로 보이지만, 정확한 뜻은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘믹담’은 뜻이 분명하지 않은 히브리어 장르 표지입니다. 어떤 이들은 이를 음악적 또는 문학적 표지로 봅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘다윗의’는 ‘다윗이 지은’, ‘다윗을 위한’, 또는 ‘다윗과 관련된’이라는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
