id: T12P.GAD.7.5
reference: Testament of Gad 7:5
unit: verse
book: Testament of Gad
collection: Testaments of the Twelve Patriarchs
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '5. Εἰ²² ἀφαιρεῖται²³ †αὐτὰ²⁴ *ἐν κακοῖς²⁵, ἢ μετανοήσαντι²⁶, ἀφίησι²⁷, ἢ²⁸ ἀμετανόητος²⁹ τηρεῖται³⁰ εἰς *αἰωνίαν κόλασιν³¹.'
  language: Greek
translation:
  text: For if what was taken away in evil is taken from him, or if he reorients[r1], he is forgiven; but if he remains unwilling to reorient, he is kept for eternal punishment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
