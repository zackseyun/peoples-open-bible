- from: '1[1]. 그리고 여섯째 주 첫째 해 일곱째 달에 그가 평안히 세겜 동쪽에 있는 살렘으로 올라갔습니다.

    2. 거기서 그 땅의 통치자 히위 사람 하몰의 아들 세겜이 야곱의 딸 디나를 보고 그를 붙잡고 동침하여 그를 낮추니 그가 어린 소녀가 되었더라.

    3. 그리고 그녀는 열두 살이었습니다. 그리고 그는 그녀의 아버지와 그녀의 형제들에게 그녀를 자기에게 아내로 주도록 요청했습니다. 야곱과 그의 아들들은 세겜 사람들로 말미암아 노하였으니 이는 그들이 그 누이 디나를 더럽혔음이더라 [2].

    4. 그리고 그들은 그들에게 거짓 말을 하고 배신하며 그들을 속였습니다. 시므온과 레위는 홀연히 세겜에 들어가서 세겜의 모든 사람을 재판하고 그 곳에서 만나는 남자를 다 죽이고 거기에 한 사람도 남기지 아니하였더라. 그들이 그 누이 디나를 욕되게 하였으므로 그들을 다 칼날로 죽였느니라.

    5. 이제부터는 이같이 해서 이스라엘 딸을 더럽히지 말찌니 이는 세겜 모든 사람을 칼에 멸망시키기로 하늘에서 저희에게 작정하였음이니라

    6. 그들이 이스라엘 중에서 부끄러운 일을 행하였음이니라 주님께서 그들을 야곱의 아들들의 손에 붙이시어 그들이 칼로 그들을 심판하고 이런 일을 행하게 하여 다시는 이스라엘 처녀를 더럽히는 일이 이스라엘 중에서 다시는 일어나지 않게 하셨느니라.

    7. 이스라엘 중에 누구든지 그 딸이나 누이를 이방 사람에게 주고자 하면 그는 반드시 돌로 쳐죽일지니 이는 그가 이스라엘 중에서 수치를 행하였음이니라 그리고 그 여자도

    8. 그 여자가 그 아버지 집의 이름을 더럽혔으니 그들이 불사를지니 그가 이스라엘 중에서 끊어지리라 음행하는 자와 더러운 자를 천하 대대로 이스라엘 중에 용납하지 말라 이스라엘은 주님께 성물이니 그를 더럽히는 자는 다 반드시 죽으리라 그들은 그를 돌로 칠 것이다.

    9. 이는 이스라엘 온 자손을 위하여 이같이 정해졌고 하늘 판에 기록되었음이라

    10. 그것을 더럽히는 자는 반드시 죽임을 당하고 돌로 맞아질지니라 이 율법에는 기한이 없고 사면이나 속죄함이 없느니라 온 이스라엘 중에서 딸을 더럽힌 사람은 즉시 죽일 뿐이니라 그가 그의 자손을 몰렉에게 주고 악을 행하여 그것을 더럽혔음이니라

    11. 모세야 너는 이스라엘 자손에게 명령하여 그들에게 그들의 딸을 이방인에게 주지 말며 그 아들을 이방인의 딸 중에서 아내로 삼지 말 것을 그들에게 일러 주라

    12. 이는 주님 앞에 가증한 일이니라 그러므로 내가 세겜 사람들이 디나에게 행한 모든 일과 야곱의 아들들이 말한 모든 일을 율법의 말씀에 기록했습니다.

    13. 우리 딸을 포피 가진 사람에게 주지 아니하리니 이는 우리에게 욕이 됨이니라 이는 이스라엘 곧 이방인의 딸들에게 주는 자와 빼앗는 자에게 욕이 되는 것이니 이는 깨끗지 아니함이라

    14. 이스라엘에게는 가증한 일이니라 또 이방인의 딸들 중에 여자가 있을지라도 이스라엘이 이 더러움에서 정결함을 받지 못하리라

    15. 또는 그의 딸 중에서 하나님께서 각 나라의 남자에게 주신 사람이 있거든 이는 역병 위에 역병이요, 저주 위에 저주가니라. 그리고 모든 심판과 재앙과 저주가 닥칠 것입니다. 만일 그가 이 일을 행하거나 부정한 일을 행하는 자와 주님의 성소를 더럽히는 자와 그의 성호를 욕되게 하는 자를 보지 않고 눈을 감으면 모든 부정과 모독으로 말미암아 온 백성이 함께 심판을 받으리라. 사람을 차별하는 일이 없고, 그 손에서 과일이나 제물이나 번제물이나 기름이나 향기로운 냄새를 받아서 기쁘게 받아들이는 일이 없을 것입니다. 이스라엘의 남자나 여자나 다 그 성소를 더럽히는 자는 다 그와 같으니라

    16. 그러므로 내가 너희에게 명령하여 이르기를 이스라엘에게 이같이 증거하라 세겜 사람들과 그 아들들의 일을 보라 그들이 어떻게 야곱의 두 아들의 손에 넘겨져 고통을 받음으로 그들을 죽였더니 그것이 그들의 의로 여기고 그들의 의로 기록되었느니라

    17. 레위 자손은 제사장의 직분과 레위 사람을 삼으셨으니 이는 우리와 같이 항상 주님 앞에서 섬기게 하려 하심이니라 레위와 그의 아들들은 영원히 복을 받으리니 이는 그가 이스라엘을 대적하는 모든 자에게 공의와 공의와 보수를 행하기를 열심하였음이라.

    18. 그리하여 그들은 만유의 하나님 앞에서 그를 위해 하늘의 돌판에 축복과 의를 기록합니다.

    19. 우리는 그 사람이 일생 동안 일 년 동안 천 대까지 행한 의를 기억하리니 그들이 기록하여 그와 그 후손에게 미치리라 그는 친구와 의인으로 하늘 판에 기록되었느니라 내가 이 모든 일을 너희를 위하여 기록하고 너희에게 명하여 이스라엘 자손에게 범죄하지 말며 율례를 범하지 말며 저희를 위하여 정한 언약을 어기지 말찌니 그리하여 행하여 친구로 기록되게 하라. 그러나 만일 그들이 범죄하여 그 모든 부정한 일을 행하면 대적들로 하늘 판에 기록될 것이요 생명책에서 도말되고 땅 가운데서 뽑힐 자들과 멸망당할 자들의 책에 기록되리라.

    20. 야곱의 아들들이 세겜을 죽이던 날, 그들이 죄인에게 공의와 공의와 보복을 행한 일이 그들을 위하여 하늘에 올라가서 축복하도록 기록되었느니라.

    21. 그 누이 디나를 세겜 집에서 이끌어 내고 세겜에 있는 모든 것을 약탈하되 양과 소와 나귀와 모든 재물과 모든 재물을 약탈하고

    22. 그들은 그것을 모두 자기 아버지 야곱에게 가져왔습니다. 그리고 그 땅에 사는 가나안 사람들과 브리스 사람들을 두려워하여 그들이 그 성읍을 죽였다고 그들에게 말하였다. 주님께서 세겜 주변 성읍들에 크게 두려우셨으므로 그들이 일어나서 야곱의 아들들을 추격하지 못하였으니 이는 그들이 두려워함이었더라.'
  to: '1. 그리고 여섯째 주의 첫해, 넷째 달에 그는 평안히 세겜 동쪽에 있는 살렘으로 올라갔습니다.

    2. 그리고 그곳에서 하몰의 히위 사람 아들, 그 땅의 통치자인 세겜이 야곱의 딸 디나를 보고 그녀를 붙잡아 함께 동침하고 더럽혔습니다. 그리고 그녀는 어린 소녀였습니다.

    3. 그녀는 열두 살이었습니다. 그리고 그가 아버지와 형제들에게 그녀를 자기의 아내로 주어 달라고 요청했습니다. 야곱과 그의 아들들은 세겜의 남자들 때문에 분노했습니다. 그들이 그들의 누이 디나를 더럽혔기 때문입니다.

    4. 그들은 그들에게 거짓되이 말하고 배신적으로 대하며 그들을 잘못 이끌었습니다. 시므온과 레위는 뜻밖에 세겜에 들어가 세겜의 모든 남자들에게 판결을 집행했습니다. 그들은 그 안에서 찾은 모든 남자를 죽였고, 그 안에 아무도 남겨 두지 않았습니다. 그들은 누이 디나를 욕보였기 때문에, 고통 중에 있는 그들을 모두 죽였습니다.

    5. 그러므로 이제부터는 이스라엘의 딸을 더럽히는 일을 해서는 안 됩니다. 하늘에서 세겜의 모든 남자들이 칼로 멸망하도록 그들에 대하여 정해졌기 때문입니다.

    6. 그들이 이스라엘에서 수치를 저질렀기 때문입니다. 주님께서는 야곱의 아들들의 손에 그들을 넘기셔서, 그 아들들이 칼로 그들을 멸하고 그들에게 이 일을 행하게 하셨으며, 다시는 그런 일이 일어나지 않게 하셨습니다.

    7. 이와 같이 이스라엘에는 이스라엘 사람인 처녀를 더럽히는 자가 있어서는 안 됩니다. 또 이스라엘 안에서 어떤 사람이 자기 딸이나 심지어 자기 누이를 이방 민족의 후손인 어떤 남자에게 주려 하거든, 그는 반드시 죽어야 하며, 그들은 그를 돌로 쳐야 합니다. 이는 그가 이스라엘 가운데서 수치스러운 일을 행했기 때문입니다. 그리고 그 여자에 대해서는,

    8. 그들은 그녀를 불에 태워야 합니다. 이는 그녀가 그녀 아버지 집안의 이름을 더럽혔기 때문이며, 그녀는 이스라엘에서 끊어져야 합니다. 또한 이스라엘 가운데서는 땅의 세대들이 이어지는 모든 날 동안 음행하는 자나 부정한 자가 발견되어서는 안 됩니다. 이스라엘은 주님께 거룩하기 때문이며, 이스라엘을 더럽히는 모든 사람은 반드시 죽어야 합니다. 그들은 그를 돌로 쳐 죽여야 합니다.

    9. 이는 이스라엘의 모든 자손에 관하여 이와 같이 정해져 있고 하늘의 판들에 기록되어 있기 때문입니다:

    10. 그것을 더럽히는 자는 반드시 죽을 것이며, 돌로 쳐질 것입니다. 이 율법에는 기간 제한이 없고, 용서도 어떤 속죄도 없습니다. 오직 온 이스라엘 가운데서 딸을 더럽힌 그 사람은 뽑혀 나갈 것입니다. 이는 그가 자기 씨를 몰렉에게 주고 악을 행하여 그것을 더럽혔기 때문입니다.

    11. 그리고 너 모세야, 이스라엘 자손에게 명령하고 그들에게 엄중히 경고하여라. 그들이 자기 딸들을 민족들에게 주지 못하게 하고, 또 자기 아들들을 위해 민족들의 딸들 가운데서 아내를 맞이하지 못하게 하여라.

    12. 그것은 야훼 앞에서 가증한 일이기 때문입니다. 그러므로 나는 너를 위하여 율법의 말씀 속에 세켐 사람들이 디나에게 행한 모든 일과 야곱의 아들들이 어떻게 말했는지를 기록했습니다:

    13. “우리는 우리 딸을 포피가 있는 남자에게 주지 않을 것입니다. 그것은 우리에게 수치이기 때문입니다.” 그리고 그것은 이스라엘에게, 곧 이방 민족의 딸들을 주는 자들과 그들에게서 맞아들이는 자들에게 수치입니다. 그것은 부정한 일이기 때문입니다.

    14. 그리고 그것은 이스라엘에게는 가증한 일입니다. 그리고 이방 민족의 딸들 가운데 한 여자를 아내로 둔 이스라엘은 이 부정함에서 정결하게 되지 않을 것입니다.

    15. 또는 그의 딸들 가운데 하나를 여러 민족 가운데 한 남자에게 주는 경우가 있으면, 재앙 위에 재앙이요 저주 위에 저주입니다. 모든 심판과 재앙과 저주가 임할 것입니다. 그가 이 일을 행하거나, 부정한 일을 행하는 자들과 주님의 성소를 더럽히는 자들과 그분의 거룩한 이름을 모독하는 자들을 보고도 눈을 감으면, 온 백성이 함께 모든 부정과 모독 때문에 심판을 받을 것입니다. 편파도 없을 것이며, 받아들여질 수 있도록 그의 손에서 열매나 제물이나 번제나 기름이나 기쁨을 주는 향기로운 냄새를 받으시는 일도 없을 것입니다. 주님의 성소를 더럽히는 이스라엘의 모든 남자나 여자에게도 이와 같을 것입니다.

    16. 그러므로 내가 네게 명령하여 말하였다. ‘이스라엘에게 이 증언을 하라. 세겜 사람들과 그들의 아들들에게 무슨 일이 일어났는지 보아라. 그들이 야곱의 두 아들의 손에 넘겨졌고, 그 두 아들은 그들을 고통을 가하여 죽였다. 그 일이 그들에게 의로 여겨졌고, 그들을 위하여 의로 기록되었다.’

    17. 레위 자손은 제사장의 직분과 레위 사람을 삼으셨으니 이는 우리가 항상 하는 것 같이 그들도 주님 앞에서 섬기게 하려 하심이니_FN0__. 레위와 그의 아들들은 영원히 복을 받으리니 이는 그가 이스라엘을 대적하는 모든 자에게 공의와 공의와 보수를 행하기를 열심하였음이라.

    18. 그리하여 그들은 만유의 하나님 앞에서 그를 위하여 하늘의 판들에 축복과 의를 기록합니다.

    19. 이 때문에 그들은 하늘의 돌판들에 그를 위하여 호의의 증거, 곧 모든 하나님의 앞에서의 복과 의를 기록합니다.

    20. 야곱의 아들들이 세겜 사람들을 죽인 날, 그들이 의와 정직을 행하고 죄인들에게 보복하였다는 기록이 하늘에 그들을 위하여 기록되었고, 복을 위하여 기록되었습니다.

    21. 그들은 그들의 누이 디나를 세겜의 집에서 데리고 나왔습니다. 그리고 세겜에 있던 모든 것, 곧 그들의 양과 가축과 나귀와 모든 소유물과 모든 재물을 약탈하여, 그것을 모두 그들의 아버지 야곱에게 가져왔습니다.

    22. 그들은 그것을 모두 자기 아버지 야곱에게 가져왔습니다. 야곱은 그 땅에 사는 사람들, 곧 가나안 사람들과 브리스 사람들을 두려워했기 때문에, 그들이 그 성읍을 멸망시킨 일에 대하여 그들과 말했습니다. 야훼의 공포가 세겜 주변의 모든 성읍에 임하였으므로, 그들은 일어나 야곱의 아들들을 추격하지 않았습니다. 두려움이 그들에게 내렸기 때문입니다.'
