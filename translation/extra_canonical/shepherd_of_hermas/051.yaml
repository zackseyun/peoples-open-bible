  text: 'Λέγω· Κύριε, ἐγὼ ταύτας τὰς παραβολὰς οὐ γινώσκω οὐδὲ δύναμαι νοῆσαι, ἐὰν μή μοι ἐπιλύσῃς αὐτάς.
    2. Πάντα σοι ἐπιλύσω, φησί, καὶ ὅσα ἂν λαλήσω μετὰ σοῦ, δείξω σοι. τὰς ἐντολὰς | τοῦ Κυρίου φύλασσε,
    καὶ ἔσῃ εὐάρεστος τῷ Θεῷ καὶ ἐγγραφήσῃ εἰς τὸν ἀριθμὸν τῶν φυλασσόντων τὰς ἐντολὰς | αὐτοῦ. 3. ἐὰν
    δέ τι ἀγαθὸν ποιήσῃς ἐκτὸς τῆς ἐντολῆς τοῦ Θεοῦ, σεαυτῷ περιποιήσῃ δόξαν περισσοτέραν, καὶ ἔσῃ ἐνδοξότερος
    παρὰ τῷ Θεῷ οὗ ἔμελλες εἶναι. ἐὰν οὖν φυλάσσων τὰς ἐντολὰς τοῦ Θεοῦ προσθῇς καὶ τὰς λειτουργίας ταύτας,
    χαρήσῃ, ἐὰν τηρήσῃς αὐτὰς κατὰ τὴν ἐμὴν ἐντολήν. 4. λέγω αὐτῷ· Κύριε, ὃ ἐάν μοι ἐντείλῃ, φυλάξω αὐτό·
    οἶδα γὰρ ὅτι σὺ μετ᾽ ἐμοῦ εἶ. Ἔσομαι, φησί, μετὰ σοῦ, ὅτι τοιαύτην προθυμίαν ἔχεις τῆς ἀγαθοποιήσεως,
    καὶ μετὰ πάντων δὲ ἔσομαι, φησί, ὅσοι τοιαύτην προθυμίαν ἔχουσιν. 5. ἡ νηστεία αὕτη, φησί, τηρουμένων
    τῶν ἐντολῶν τοῦ Κυρίου λίαν καλή ἐστιν. οὕτως οὖν φυλάξεις τὴν νηστείαν ταύτην [ἣν μέλλεις τηρεῖν].
    6. πρῶτον πάντων φύλαξαι ἀπὸ παντὸς ῥήματος πονηροῦ καὶ πάσης ἐπιθυμίας πονηρᾶς, καὶ καθάρισόν σου
    τὴν καρδίαν ἀπὸ πάντων τῶν ματαιωμάτων τοῦ αἰῶνος τούτου. ἐὰν ταῦτα φυλάξῃς, ἔσται σοι αὕτη ἡ νηστεία
    τελεία. 7. οὕτω δὲ ποιήσεις· συντελέσας τὰ γεγραμμένα, ἐν ἐκείνῃ τῇ ἡμέρᾳ ᾗ νηστεύεις μηδὲν γεύσῃ
    εἰ μὴ ἄρτον καὶ ὕδωρ, καὶ ἐκ τῶν ἐδεσμάτων σου ὧν ἔμελλες τρώγειν συμψηφίσας τὴν ποσότητα τῆς δαπάνης
    ἐκείνης τῆς ἡμέρας ἧς ἔμελλες ποιεῖν, δώσεις αὐτὸ χήρᾳ ἢ ὀρφανῷ ἢ ὑστερουμένῳ, καὶ οὕτω ταπεινοφρονήσεις,
    ἵν᾽ ἐκ τῆς ταπεινοφροσύνης σου ὁ εἰληφὼς ἐμπλήσῃ τὴν ἑαυτοῦ ψυχὴν καὶ εὔξηται ὑπὲρ σοῦ πρὸς τὸν Κύριον.
    8. ἐὰν οὖν οὕτω τελέσῃς τὴν νηστείαν ὥς σοι ἐνετειλάμην, ἔσται ἡ θυσία σου δεκτὴ παρὰ τῷ Θεῷ, καὶ
    ἔγγραφος ἔσται ἡ νηστεία αὕτη, καὶ ἡ λειτουργία οὕτως ἐργαζομένη καλὴ καὶ ἱλαρά ἐστι καὶ εὐπρόσδεκτος
    τῷ Κυρίῳ. 9. ταῦτα οὕτω τηρήσεις σὺ μετὰ τῶν τέκνων σου καὶ ὅλου τοῦ οἴκου σου· τηρήσας δὲ αὐτὰ μακάριος
    ἔσῃ· καὶ ὅσοι ἂν ἀκούσαντες αὐτὰ τηρήσωσι, μακάριοι ἔσονται, καὶ ὅσα ἂν αἰτήσωνται παρὰ τοῦ Κυρίου
    λήψονται.


    Ἐδεήθην αὐτοῦ πολλὰ ἵνα μοι δηλώσῃ τὴν παραβολὴν τοῦ ἀγροῦ καὶ τοῦ δεσπότου καὶ τοῦ ἀμπελῶνος καὶ
    τοῦ δούλου τοῦ χαρακώσαντος τὸν ἀμπελῶνα [καὶ τῶν χαράκων] καὶ τῶν βοτανῶν τῶν ἐκτετιλμένων ἐκ τοῦ
    ἀμπελῶνος καὶ τοῦ υἱοῦ καὶ τῶν φίλων τῶν συμβούλων. συνῆκα γὰρ ὅτι παραβολή τίς ἐστι ταῦτα πάντα.
    2. ὁ δὲ ἀποκριθείς μοι εἶπεν· Αὐθάδης εἶ λίαν εἰς τὸ ἐπερωτᾶν. οὐκ ὀφείλεις, [φησίν,] ἐπερωτᾶν οὐδὲν
    ὅλως· ἐὰν γάρ σοι δέῃ δηλωθῆναι, δηλωθήσεται. λέγω αὐτῷ· Κύριε, ὅσα ἄν μοι δείξῃς καὶ μὴ δηλώσῃς,
    μάτην ἔσομαι ἑωρακὼς αὐτὰ καὶ μὴ νοῶν τί ἐστιν· ὡσαύτως καὶ ἐὰν μοι παραβολὰς λαλήσῃς καὶ μὴ ἐπιλύσῃς
    μοι αὐτάς, εἰς μάτην ἔσομαι ἀκηκοώς τι παρὰ σοῦ. 3. ὁ δὲ πάλιν ἀπεκρίθη μοι λέγων· Ὃς ἄν, φησί, δοῦλος
    ᾖ τοῦ Θεοῦ καὶ ἔχῃ τὸν Κύριον ἑαυτοῦ ἐν τῇ καρδίᾳ, αἰτεῖται παρ᾽ αὐτοῦ σύνεσιν καὶ λαμβάνει, καὶ πᾶσαν
    παραβολὴν ἐπιλύει, καὶ γνωστὰ αὐτῷ γίνονται τὰ ῥήματα τοῦ Κυρίου τὰ λεγόμενα διὰ παραβολῶν· ὅσοι δὲ
    βληχροί εἰσι καὶ ἀργοὶ πρὸς τὴν ἔντευξιν, ἐκεῖνοι διστάζουσιν αἰτεῖσθαι παρὰ τοῦ Κυρίου· 4. ὁ δὲ Κύριος
    πολυεύσπλαγχνός ἐστι, καὶ πᾶσι τοῖς αἰτουμένοις παρ᾽ αὐτοῦ ἀδιαλείπτως δίδωσι. σὺ δὲ ἐνδεδυναμωμένος
    ὑπὸ τοῦ ἁγίου ἀγγέλου καὶ εἰληφὼς παρ᾽ αὐτοῦ τοσαύτην ἔντευξιν καὶ μὴ ὢν ἀργός, διατί οὐκ αἰτῇ παρὰ
    τοῦ Κυρίου σύνεσιν καὶ λαμβάνεις παρ'' αὐτοῦ; 5. λέγω αὐτῷ· Κύριε, ἐγὼ ἔχων σὲ μεθ'' ἑαυτοῦ ἀνάγκην
    ἔχω σὲ αἰτεῖσθαι καὶ σὲ ἐπερωτᾶν· σὺ γάρ μοι δεικνύεις πάντα καὶ λαλεῖς μετ'' ἐμοῦ· εἰ δὲ ἄτερ σοῦ
    ἔβλεπον ἢ ἤκουον αὐτά, ἠρώτων ἂν τὸν Κύριον ἵνα μοι δηλωθῇ.'
