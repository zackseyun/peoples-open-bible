  to: 의인들은 보고 기뻐하고, 무죄한 이는 그들을 비웃습니다.[a]
  rationale: 히브리어에 명시되지 않은 ‘이것을’을 삭제하여 문맥적 지시를 본문에 과도하게 보충하지 않았습니다. 단수의 נָקִי는 일반적 인물을 가리키는 ‘무죄한 이’로 자연스럽게 옮겼으며, 각주는 중복 없이 유효한 어휘 대안을 제시하도록 수정했습니다.
