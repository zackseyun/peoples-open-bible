revisions:
- category: publication_review_correction
  rationale: In paragraph 5, δοξάζειν ὀφείλετε τὸν Θεόν expressly states an obligation to glorify God.
    Replace only “should” with “must” to retain that force in the simplified edition; preserve all paragraph
    divisions, markers, and other wording.; The supplied Greek text and bounded evidence identify this
    unit as exclusively Greek and place the Amherst overlap elsewhere. Remove the misleading mixed-source
    description while preserving the existing theological rationale.; The selected Greek section contains
    fruit imagery, suffering, denial and confession, healing of sins, and the gift of life—not infant
    innocence or stone/root/wealth imagery. Limit the fidelity record to features actually present in
    this unit and preserve its editorial-disclosure commitment.
- category: publication_review_correction
  rationale: 'Two localized corrections, independently checked against the supplied Greek: (1) καρπῶν
    πλήρη describes fullness, while ἄλλοις καὶ ἄλλοις καρποῖς κεκοσμημένα separately describes adornment
    with varied fruit; restore the omitted adornment. (2) εἰ introduces the conditional comparison about
    the nations, and ἐάν τις introduces the condition concerning an individual servant’s denial; preserve
    both rather than making the outer premise an unqualified assertion. Existing servant terminology,
    notes, paragraph prefixes, blank-line divisions, and difficult teachings remain unchanged.'
