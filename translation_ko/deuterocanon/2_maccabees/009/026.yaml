  text: Therefore I urge you and ask you, remembering the benefits shown both publicly and privately, each of you to maintain the goodwill that now exists toward me and my son.
translation:
  language: ko
  text: 그러므로 저는 여러분에게 권면하고 요청합니다. 공적으로나 사적으로 베풀어진 은혜들을 기억하여, 여러분 각자가 저와 제 아들에게 품고 있는 호의를 계속 지켜 주시기를 요청합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακαλῶ οὖν ὑμᾶς καὶ ἀξιῶ
  english_pob_choice: Therefore I urge you and ask you
  chosen_korean: 그러므로 저는 여러분에게 간청하며 권고합니다
  alternatives_korean:
  - 그러므로 저는 여러분에게 권면하며 요청합니다
  - 그러므로 저는 여러분에게 간청하고 청합니다
  lexicon: παρακαλέω, ἀξιόω
  rationale: 두 동사가 함께 나오는 점을 살려, 단순한 요청보다 강한 호소와 정중한 요구를 함께 드러냈습니다.
- source_word: τῶν εὐεργεσιῶν
  english_pob_choice: the benefits
  chosen_korean: 베풀어진 은혜
  alternatives_korean:
  - 선행
  - 호의
  - 은덕
  lexicon: εὐεργεσία
  rationale: 단순한 물질적 ‘이익’보다 은혜로운 베풂의 뉘앙스가 강하므로, 한국어에서는 ‘베풀어진 은혜’로 옮겨 감사의 맥락을 살렸습니다.
- source_word: κοινῇ καὶ κατʼ ἰδίαν
  english_pob_choice: both publicly and privately
  chosen_korean: 공적으로나 사적으로
  alternatives_korean:
  - 공개적으로나 개인적으로
  - 공적으로나 은밀히
  lexicon: κοινῇ, κατʼ ἰδίαν
  rationale: 대조 구조를 자연스러운 현대 한국어의 병렬로 옮겨, 공개적/비공개적 행위를 분명히 했습니다.
- source_word: συντηρεῖν τὴν οὖσαν εὔνοιαν
  english_pob_choice: to maintain the goodwill that now exists
  chosen_korean: 지금 있는 호의를 끝까지 지키십시오
  alternatives_korean:
  - 현재 있는 호의를 유지하십시오
  - 지금 존재하는 우호를 보존하십시오
  lexicon: συντηρέω, εὔνοια
  rationale: εὔνοια는 단순한 감정이 아니라 지속되는 우호와 호의이므로 ‘호의’로 옮기고, συντηρεῖν은 관계를 보전한다는 의미를 살려 ‘지키다’로 표현했습니다.
theological_decisions:
- issue: 왕권 요청문에서의 화법과 청중 직접 호칭
  chosen_reading: 공적 연설/탄원문으로서 1인칭 화자가 청중에게 정중히 요청하는 문체를 유지했습니다.
  alternative_readings:
  - 더 서정적인 권면체
  - 명령조에 가까운 번역
  rationale: 본문의 παρακαλῶ/ἀξιῶ는 청중을 압박하기보다 관계를 고려한 호소이므로, 합쇼체로 정중한 청원 톤을 살렸습니다.
  doctrine_reference: 문체/화행 보존
