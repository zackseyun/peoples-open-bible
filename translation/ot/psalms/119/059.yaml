  from: When I think on my ways, I turn my feet to your testimonies.
  to: I have considered my ways and turned my feet toward your testimonies.
  rationale: The current temporal-habitual construction (“When I think ... I turn”) is not marked in the Hebrew and weakens the completed reflective action. The proposal correctly removes the supplied temporal clause, but its simple present does not represent the Hebrew perfects as well as English present perfects do. “Toward” is a natural rendering of אֶל while retaining the bodily image of turning one’s feet.
