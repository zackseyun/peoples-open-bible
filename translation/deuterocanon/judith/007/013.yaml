translation:
  text: For all who live in Bethulia draw water from there. Thirst will destroy them, and they will surrender their city. We and our people will go up to the nearby mountain summits.
  philosophy: dynamic
lexical_decisions:
- source_word: διότι
  chosen: for
  alternatives:
  - because
  lexicon: BDAG
  rationale: Introduces the reason for the preceding strategy statement. 'For' preserves the explanatory force in a concise, natural way.
- source_word: ἐκεῖθεν
  chosen: from there
  alternatives:
  - from that place
  lexicon: BDAG
  rationale: Refers to the water source previously mentioned. 'From there' is the most direct contextual rendering.
- source_word: ὑδρεύονται
  chosen: draw water
  alternatives:
  - get water
  - fetch water
  lexicon: BDAG
  rationale: The verb specifically denotes obtaining or drawing water. 'Draw water' is idiomatic and slightly more concrete than 'get water.'
- source_word: πάντες οἱ κατοικοῦντες
  chosen: all who live
  alternatives:
  - all the inhabitants
  - all those dwelling
  lexicon: BDAG
  rationale: This participial phrase refers to the whole resident population. 'All who live' is natural English while preserving the universal scope.
- source_word: Βαιτυλουά
  chosen: Baithyloua
  alternatives:
  - Bethulia
  rationale: Personal/place names are transliterated by project policy. Since the Greek form here is Βαιτυλουά, 'Baithyloua' stays closer to the source than the traditional Anglicized 'Bethulia.'
- source_word: ἀνελεῖ
  chosen: will destroy
  alternatives:
  - will kill
  - will do away with
  lexicon: BDAG
  rationale: The future of ἀναιρέω can mean kill or destroy. With subject 'thirst,' the sense is that thirst will bring about their death/destruction. 'Will destroy' reads naturally with an abstract subject while retaining severity.
- source_word: ἡ δίψα
  chosen: thirst
  alternatives:
  - their thirst
  lexicon: BDAG
  rationale: The Greek has the noun with article, personified as the agent. English naturally omits the article here.
- source_word: ἐκδώσουσι
  chosen: will surrender
  alternatives:
  - will hand over
  - will give up
  lexicon: BDAG
  rationale: In military context with direct object 'their city,' the sense is capitulation to an enemy. 'Will surrender' communicates this clearly in modern English.
- source_word: τὴν πόλιν αὐτῶν
  chosen: their city
  alternatives:
  - the city
  - their town
  lexicon: BDAG
  rationale: The possessive is explicit and should be preserved. 'City' is the standard rendering of πόλις.
- source_word: ἀναβησόμεθα
  chosen: will go up
  alternatives:
  - will ascend
  - will march up
  lexicon: BDAG
  rationale: The verb literally means go up. 'Will go up' preserves the spatial sense without overinterpreting it as military movement, though that is implied by context.
- source_word: ἐπὶ τὰς πλησίον κορυφὰς τῶν ὀρέων
  chosen: to the nearby summits of the mountains
  alternatives:
  - onto the neighboring mountain peaks
  - to the nearest mountain tops
  lexicon: BDAG
  rationale: κορυφαί are peaks or summits; πλησίον indicates nearness. 'Nearby summits of the mountains' is a fairly literal rendering that preserves the topographical detail.
