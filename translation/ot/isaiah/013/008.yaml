  meaning: Terror will seize the people like childbirth pains, leaving them staring at one another with faces aflame.
  meaning_decisions:
  - source_phrase: וְנִבְהָלוּ
    prior_rendering: They will be dismayed
    new_rendering: They will be terrified
    rationale: The verb denotes alarm or panic, and the ensuing physical anguish calls for stronger English than the potentially mild 'dismayed.'
  - source_phrase: אִישׁ אֶל רֵעֵהוּ יִתְמָהוּ
    prior_rendering: Each man will stare at his neighbor
    new_rendering: They will stare aghast at one another
    rationale: The reciprocal idiom describes mutual astonishment; it neither requires next-door neighbors nor restricts the preceding universal terror to men.
  - source_phrase: פְּנֵי לְהָבִים פְּנֵיהֶם
    prior_rendering: their faces will be faces of flame
    new_rendering: their faces aflame
    rationale: The shorter expression preserves the fiery image without the unnatural repeated noun or an unsupported explanation of the faces’ precise appearance.
