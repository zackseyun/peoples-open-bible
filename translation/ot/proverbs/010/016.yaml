  review_summary: In this balanced economic parallel, פְּעֻלָּה is better understood as wages or recompense and תְּבוּאָה as income or yield. “Labor” and especially “produce” obscure that parallel and can misleadingly suggest an agricultural image. The notes are unnecessary, including the contextually irrelevant sacrificial sense of חַטָּאת.
