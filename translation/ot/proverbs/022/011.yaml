  rationale: 'The current rendering of טֹהַר־לֵב as “purity of heart” is sound and better preserves the likely abstract quality than “a pure heart,” which can suggest an object possessed by someone else. The proposal’s future “will have” unnecessarily changes the verbless proverbial predication. The real defect is the placement of both notes: the lips/grace note belongs with “speech is gracious,” and the indefinite-king alternative belongs with “the king.”'
