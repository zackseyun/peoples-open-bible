  lexicon: HALOT
  rationale: A place name rendered by standard English transliteration. 'Aijalon' is a familiar conventional spelling in English Bibles, while 'Ayalon' is a more directly phonetic alternative.
- source_word: יִתְלָה
  chosen: Ithlah
  alternatives:
  - Jethlah
  lexicon: HALOT
  rationale: A place name transliterated directly from the Hebrew. 'Ithlah' reflects the consonants well; 'Jethlah' is a traditional variant influenced by older English transliteration practices.
