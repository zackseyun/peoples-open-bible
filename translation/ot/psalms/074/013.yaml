  from: You split the sea by your strength[a][b]; you shattered the heads of the sea monsters on the waters.
  to: You split the sea by your strength;[a] you shattered the heads of the sea monsters[b] on the waters.
  rationale: “Split” is a sound, vivid rendering of פוררת and should not be displaced merely by the equally possible “divided.” Rendering עַל as “in” removes the Hebrew’s surface/over relation in favor of an inferred aquatic location; “on the waters” is deliberate poetic English and preserves the image. The lexical note on tanninim should be attached to “sea monsters,” rather than to “strength.”
