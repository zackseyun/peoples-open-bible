  rationale: Adjusted punctuation and syntax for clearer alignment with the Greek; rendered οἱ λεγόμενοι as “who are called,” and τῆς λεγομένης περιτομῆς more literally as “what is called ‘circumcision,’” while retaining “made by hands in the flesh.”
