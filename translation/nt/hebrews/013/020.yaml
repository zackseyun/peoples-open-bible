  rationale: The Greek placement allows some ambiguity, but in context the phrase most naturally qualifies the divine action in the benediction. The translation preserves this without expanding into a doctrinal paraphrase about atonement mechanics.
  doctrine_reference: Preserve theological tension rather than resolve it.
