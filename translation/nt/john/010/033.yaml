  from: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
  to: His Jewish opponents answered him, “We want to stone you not for a good work, but for blasphemy, because you, though a man, claim to be God[a].”
