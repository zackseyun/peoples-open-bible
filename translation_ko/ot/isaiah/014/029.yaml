  terminology: '''막대기'', ''뱀'', ''독사'', ''날아다니는 불뱀''은 원문의 비유적·동물상 어휘를 불필요하게 특정 역사적 또는 신학적 해석으로 좁히지 않고 잘 보존합니다.'
