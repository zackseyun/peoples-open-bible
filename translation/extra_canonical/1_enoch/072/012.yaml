lexical_decisions:
- source_word: ወእሜሃ
  chosen: and at that time
  alternatives:
  - and then
  - and in those days
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Temporal transition formula. 'At that time' preserves the sequential, observational style of the Astronomical Book without over-specifying.
- source_word: ይነኍኅ
  chosen: diminishes
  alternatives:
  - decreases
  - is reduced
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The verb marks reduction in extent. 'Diminishes' fits the measured decrease of daylight in this calendrical context.
- source_word: ዕለት
  chosen: the day
  alternatives:
  - daylight
  - day
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: In this context the term refers to the daylight period as measured in parts. 'The day' is idiomatic and keeps the repeated day/night contrast.
- source_word: †ክልኤ†
  chosen: two parts
  alternatives:
  - by two portions
  - two
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The marked form likely reflects a numerically significant but textually uncertain reading. Because the verse immediately speaks in numbered 'parts,' the English makes the implied unit explicit.
- source_word: ክፍለ
  chosen: parts
  alternatives:
  - portions
  - divisions
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: This technical term structures the luminary measurements throughout the chapter. 'Parts' is concise and consistent with the chapter's repeated reckoning.
- source_word: ወትከውን
  chosen: and becomes
  alternatives:
  - and it becomes
  - and comes to be
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Retains the repetitive formulaic style of the source, which narrates the changing lengths in sequence.
- source_word: ዓሠርተ ወአሐደ
  chosen: eleven
  alternatives:
  - ten and one
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Rendered as standard English numeral while preserving the measured total of daylight.
- source_word: ወተሐጽር ሌሊት
  chosen: and the night grows shorter
  alternatives:
  - and the night is shortened
  - and the night diminishes
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The verb explicitly indicates shortening. 'Grows shorter' is natural English while preserving the comparative sense.
- source_word: ሰብዓተ ክፍለ
  chosen: seven parts
  alternatives:
  - seven portions
  - seven divisions
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Keeps the chapter's technical measurement language and balances the eleven parts of the day.
