base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030.yaml
  text: '1[1]. And in the first year of the sixth week, he went up to Shalem, which is to the east of Shechem, in peace, in the seventh month.

    2. And there Hamor''s son Shechem, the Hivite, the prince of the land, saw Dinah, Jacob''s daughter, and he seized her and lay with her and humbled her, and she was a little girl.

    3. And she was twelve years old. And he asked from her father and from her brothers that she be given to him as a wife. And Jacob and his sons were angry because of the men of Shechem, because they had defiled Dinah their sister[2].

    4. And they spoke with them deceitfully and dealt treacherously with them and misled them. And Simeon and Levi entered Shechem unexpectedly and executed judgment on all the men of Shechem, and they killed every male whom they found in it, and they left none in it; they killed them all with the edge of the sword, because they had disgraced Dinah their sister.

    5. And thus it must not be done from now on, to defile a daughter of Israel, for in heaven it has been ordained against them that all the men of Shechem should be destroyed by the sword,

    6. because they had committed shame in Israel. And the LORD delivered them into the hand of Jacob''s sons so that they might execute judgment on them with the sword and do this to them, and so that it might never again be done in Israel, to defile an Israelite virgin.

    7. And if there is any man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed shame in Israel. And the woman also

    8. they shall burn with fire, because she has defiled the name of her father''s house, and she shall be rooted out from Israel. And let no fornicator or defiled person be found in Israel through all the generations of the earth, for Israel is holy to the LORD, and every man who defiles it shall surely die; they shall stone him with stones.

    9. For thus it has been ordained and written on the heavenly tablets concerning all the seed of Israel:

    10. whoever defiles it shall surely die, and he shall be stoned with stones. And there is no limit of days for this law, and no remission, nor any atonement, except that they should put to death at once the man who has defiled a daughter in the midst of all Israel, because he has given of his seed to Molech and has acted wickedly so as to defile it.

    11. And you, Moses, command the children of Israel and make it heard to them that they are not to give any of their daughters to the nations, and that they are not to take wives for their sons from the daughters of the nations,

    12. because this is abominable before the LORD. Therefore I have written for you in the words of the law all the deeds of Shechem that they did against Dinah, and how Jacob''s sons spoke, saying,

    13. ''We will not give our daughter to a man who has a foreskin, for that is a reproach to us.'' And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean

    14. and abominable for Israel. And Israel will not be cleansed from this uncleanness, if there is a woman from the daughters of the nations,

    15. or if there is one from his daughters whom he has given to a man from any of the nations. For it is plague upon plague, and curse upon curse; and every judgment and plague and curse will come. And if he does this thing, or if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together will be judged for all the uncleanness and profanation. And there will be no partiality, and no receiving from his hand fruit or sacrifice or burnt offering or fat or the fragrance of a pleasing aroma, so that it should be accepted. So it is with every man or woman in Israel who defiles his sanctuary.

    16. Therefore I have commanded you, saying, ''Bear this witness to Israel: See what happened to the Shechemites and to their sons, how they were delivered into the hands of the two sons of Jacob, and they killed them with torment, and it was reckoned to them as righteousness, and it was written to them for righteousness.

    17. And the seed of Levi was chosen for the priesthood and for the Levites, that they might minister before the LORD as we do at all times. And Levi and his sons will be blessed forever, because he was zealous to execute righteousness and judgment and vengeance on all who rose up against Israel.

    18. And so they inscribe for him on the heavenly tablets blessing and righteousness before the God of all.

    19. And we remember the righteousness that the man performed during his life at all the seasons of the year, up to a thousand generations: they will record it, and it will come to him and to his descendants after him, and he has been written down as a friend and a righteous man on the heavenly tablets. All this account I have written for you and commanded you to tell the children of Israel that they must not commit sin and must not transgress the ordinances or break the covenant that was ordained for them, so that they should perform it and be recorded as friends. But if they transgress and act in any of its ways with uncleanness, they will be recorded on the heavenly tablets as adversaries, and they will be blotted out of the book of life and written in the book of those who will be destroyed and with those who will be rooted out from the midst of the land.

    20. And on the day when Jacob''s sons killed Shechem, a record went up for them in heaven that they had performed righteousness and uprightness and vengeance on the sinners, and it was written down for blessing.

    21. And they brought out Dinah their sister from the house of Shechem, and they plundered everything that was in Shechem—their sheep and their cattle and their donkeys and all their possessions and all their wealth—

    22. and they brought it all to Jacob their father. And he spoke with them about their having killed the city, because he feared those who lived in the land, the Canaanites and the Perizzites. And the terror of the LORD was on all the cities around Shechem, and they did not rise up to pursue the sons of Jacob[19][17][16][15][10], because dread had fallen on them.'
  footnotes:
  - marker: '1'
    text: The opening clause is textually difficult. The Ge'ez appears to place the event in the first year of the sixth week and locates the movement in relation to Shalem and the region east of Shechem. The subject is Jacob, returning to Canaan.
    reason: segmentation_note
  - marker: '2'
    text: The final clause of v.2 literally indicates that Dinah was a young girl; v.3 then specifies that she was twelve years old.
    reason: lexical_alternative
  - marker: '10'
    text: The Molech clause is abrupt in context. The Ethiopic text preserves it, and it may function as a broader analogy between illicit seed and cultic defilement.
    reason: textual_variant
  - marker: '15'
    text: Verse 15 is unusually dense and likely compresses several legal and cultic statements. The translation preserves the sequence of uncleanness, public guilt, lack of partiality, and rejected offerings without heavy smoothing.
    reason: segmentation_note
  - marker: '16'
    text: '''With torment'' renders a difficult phrase that may also be understood as ''with distress'' or possibly ''with the sword'' in some textual traditions. The broader sense is that the Shechemites were violently struck down.'
    reason: lexical_alternative
  - marker: '17'
    text: '''As we do at all times'' reflects the angelic speaker''s perspective within Jubilees'' Sinai revelation framework.'
    reason: cross_reference
  - marker: '19'
    text: The surviving row numbering in the source jumps from v.15 to v.23. The English draft follows the chapter's narrative continuity and renumbers the remaining material as vv.20-22 to present a complete chapter.
    reason: segmentation_note
translation:
  language: ko
  text: '1. 그리고 여섯째 주의 첫해, 넷째 달에 그는 평안히 세겜 동쪽에 있는 살렘으로 올라갔습니다.

    2. 그리고 그곳에서 하몰의 히위 사람 아들, 그 땅의 통치자인 세겜이 야곱의 딸 디나를 보고 그녀를 붙잡아 함께 동침하고 더럽혔습니다. 그리고 그녀는 어린 소녀였습니다.

    3. 그녀는 열두 살이었습니다. 그리고 그가 아버지와 형제들에게 그녀를 자기의 아내로 주어 달라고 요청했습니다. 야곱과 그의 아들들은 세겜의 남자들 때문에 분노했습니다. 그들이 그들의 누이 디나를 더럽혔기 때문입니다.

    4. 그들은 그들에게 거짓되이 말하고 배신적으로 대하며 그들을 잘못 이끌었습니다. 시므온과 레위는 뜻밖에 세겜에 들어가 세겜의 모든 남자들에게 판결을 집행했습니다. 그들은 그 안에서 찾은 모든 남자를 죽였고, 그 안에 아무도 남겨 두지 않았습니다. 그들은 누이 디나를 욕보였기 때문에, 고통 중에 있는 그들을 모두 죽였습니다.

    5. 그러므로 이제부터는 이스라엘의 딸을 더럽히는 일을 해서는 안 됩니다. 하늘에서 세겜의 모든 남자들이 칼로 멸망하도록 그들에 대하여 정해졌기 때문입니다.

    6. 그들이 이스라엘에서 수치를 저질렀기 때문입니다. 주님께서는 야곱의 아들들의 손에 그들을 넘기셔서, 그 아들들이 칼로 그들을 멸하고 그들에게 이 일을 행하게 하셨으며, 다시는 그런 일이 일어나지 않게 하셨습니다.

    7. 이와 같이 이스라엘에는 이스라엘 사람인 처녀를 더럽히는 자가 있어서는 안 됩니다. 또 이스라엘 안에서 어떤 사람이 자기 딸이나 심지어 자기 누이를 이방 민족의 후손인 어떤 남자에게 주려 하거든, 그는 반드시 죽어야 하며, 그들은 그를 돌로 쳐야 합니다. 이는 그가 이스라엘 가운데서 수치스러운 일을 행했기 때문입니다. 그리고 그 여자에 대해서는,

    8. 그들은 그녀를 불에 태워야 합니다. 이는 그녀가 그녀 아버지 집안의 이름을 더럽혔기 때문이며, 그녀는 이스라엘에서 끊어져야 합니다. 또한 이스라엘 가운데서는 땅의 세대들이 이어지는 모든 날 동안 음행하는 자나 부정한 자가 발견되어서는 안 됩니다. 이스라엘은 주님께 거룩하기 때문이며, 이스라엘을 더럽히는 모든 사람은 반드시 죽어야 합니다. 그들은 그를 돌로 쳐 죽여야 합니다.

    9. 이는 이스라엘의 모든 자손에 관하여 이와 같이 정해져 있고 하늘의 판들에 기록되어 있기 때문입니다:

    10. 그것을 더럽히는 자는 반드시 죽을 것이며, 돌로 쳐질 것입니다. 이 율법에는 기간 제한이 없고, 용서도 어떤 속죄도 없습니다. 오직 온 이스라엘 가운데서 딸을 더럽힌 그 사람은 뽑혀 나갈 것입니다. 이는 그가 자기 씨를 몰렉에게 주고 악을 행하여 그것을 더럽혔기 때문입니다.

    11. 그리고 너 모세야, 이스라엘 자손에게 명령하고 그들에게 엄중히 경고하여라. 그들이 자기 딸들을 민족들에게 주지 못하게 하고, 또 자기 아들들을 위해 민족들의 딸들 가운데서 아내를 맞이하지 못하게 하여라.

    12. 그것은 야훼 앞에서 가증한 일이기 때문입니다. 그러므로 나는 너를 위하여 율법의 말씀 속에 세켐 사람들이 디나에게 행한 모든 일과 야곱의 아들들이 어떻게 말했는지를 기록했습니다:

    13. “우리는 우리 딸을 포피가 있는 남자에게 주지 않을 것입니다. 그것은 우리에게 수치이기 때문입니다.” 그리고 그것은 이스라엘에게, 곧 이방 민족의 딸들을 주는 자들과 그들에게서 맞아들이는 자들에게 수치입니다. 그것은 부정한 일이기 때문입니다.

    14. 그리고 그것은 이스라엘에게는 가증한 일입니다. 그리고 이방 민족의 딸들 가운데 한 여자를 아내로 둔 이스라엘은 이 부정함에서 정결하게 되지 않을 것입니다.

    15. 또는 그의 딸들 가운데 하나를 여러 민족 가운데 한 남자에게 주는 경우가 있으면, 재앙 위에 재앙이요 저주 위에 저주입니다. 모든 심판과 재앙과 저주가 임할 것입니다. 그가 이 일을 행하거나, 부정한 일을 행하는 자들과 주님의 성소를 더럽히는 자들과 그분의 거룩한 이름을 모독하는 자들을 보고도 눈을 감으면, 온 백성이 함께 모든 부정과 모독 때문에 심판을 받을 것입니다. 편파도 없을 것이며, 받아들여질 수 있도록 그의 손에서 열매나 제물이나 번제나 기름이나 기쁨을 주는 향기로운 냄새를 받으시는 일도 없을 것입니다. 주님의 성소를 더럽히는 이스라엘의 모든 남자나 여자에게도 이와 같을 것입니다.

    16. 그러므로 내가 네게 명령하여 말하였다. ‘이스라엘에게 이 증언을 하라. 세겜 사람들과 그들의 아들들에게 무슨 일이 일어났는지 보아라. 그들이 야곱의 두 아들의 손에 넘겨졌고, 그 두 아들은 그들을 고통을 가하여 죽였다. 그 일이 그들에게 의로 여겨졌고, 그들을 위하여 의로 기록되었다.’

    17. 레위 자손은 제사장의 직분과 레위 사람을 삼으셨으니 이는 우리가 항상 하는 것 같이 그들도 주님 앞에서 섬기게 하려 하심이니_FN0__. 레위와 그의 아들들은 영원히 복을 받으리니 이는 그가 이스라엘을 대적하는 모든 자에게 공의와 공의와 보수를 행하기를 열심하였음이라.

    18. 그리하여 그들은 만유의 하나님 앞에서 그를 위하여 하늘의 판들에 축복과 의를 기록합니다.

    19. 이 때문에 그들은 하늘의 돌판들에 그를 위하여 호의의 증거, 곧 모든 하나님의 앞에서의 복과 의를 기록합니다.

    20. 야곱의 아들들이 세겜 사람들을 죽인 날, 그들이 의와 정직을 행하고 죄인들에게 보복하였다는 기록이 하늘에 그들을 위하여 기록되었고, 복을 위하여 기록되었습니다.

    21. 그들은 그들의 누이 디나를 세겜의 집에서 데리고 나왔습니다. 그리고 세겜에 있던 모든 것, 곧 그들의 양과 가축과 나귀와 모든 소유물과 모든 재물을 약탈하여, 그것을 모두 그들의 아버지 야곱에게 가져왔습니다.

    22. 그들은 그것을 모두 자기 아버지 야곱에게 가져왔습니다. 야곱은 그 땅에 사는 사람들, 곧 가나안 사람들과 브리스 사람들을 두려워했기 때문에, 그들이 그 성읍을 멸망시킨 일에 대하여 그들과 말했습니다. 야훼의 공포가 세겜 주변의 모든 성읍에 임하였으므로, 그들은 일어나 야곱의 아들들을 추격하지 않았습니다. 두려움이 그들에게 내렸기 때문입니다.'
