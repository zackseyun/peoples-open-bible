  source_fidelity: ‘영이 나를 들어 올리셨고’의 높임은 히브리어 본문에 문법적으로 표지되지 않았으며, רוּחַ의 지시 대상도 문맥상 영적 주체이되 ‘성령’으로 특정되지 않습니다. 또한 מִמְּקוֹמוֹ는 ‘그분의 처소로부터’라는 출발점을 나타내므로, 기존의 ‘그 계신 곳에서’보다 이를 보존해야 합니다. בָּרוּךְ는 ‘찬양을 받으시기를’으로 기능상 옮길 수 있습니다.
  naturalness: ‘큰 요란한 소리’는 다소 중복적으로 들립니다. ‘큰 굉음’이 קוֹל רַעַשׁ גָּדוֹל의 크고 진동하는 소리를 자연스럽고 간결하게 전달합니다. ‘찬송받으시기를’은 송영 문맥에 맞는 현대 한국어 합쇼체입니다.
  terminology: ‘영’은 רוּחַ의 문맥상 의미를 과도하게 교리적으로 특정하지 않습니다. יהוה는 초안의 표기 원칙을 따라 ‘야훼’로 유지합니다. ‘찬송’은 בָּרוּךְ의 예배적 축복 선언을 보존하되, 원문에 없는 행위자나 교리적 해석을 덧붙이지 않습니다.
