theological_decisions:
- issue: Scope of בָּנַיִךְ in Zion-address language
  chosen_reading: your children
  alternative_readings:
  - your sons
  rationale: The addressee is feminine singular (Zion/Jerusalem), and the masculine plural noun can function collectively
    for offspring/descendants. In keeping with the project's gender-accurate principle, the English aims to match intended
    referent rather than mechanically preserve grammatical gender where the collective sense is primary. The more literal
    'your sons' is preserved in a footnote for auditability.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
