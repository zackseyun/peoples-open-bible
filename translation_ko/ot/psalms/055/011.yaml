  text: הַוּ֥וֹת בְּ/קִרְבָּ֑/הּ וְֽ/לֹא יָמִ֥ישׁ מֵ֝/רְחֹבָ֗/הּ תֹּ֣ךְ וּ/מִרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/011.yaml
  text: Destruction is within her[a][b]; oppression and deceit do not depart from her square.
  footnotes:
  - marker: a
    text: Or 'from her streets.' The Hebrew term can refer more specifically to a public square or open place within the city.
    reason: lexical_alternative
  - marker: b
    text: Or 'Destructive evils are within her.' The Hebrew noun is plural, but the translation uses a collective singular for natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 안에는 파괴[a]가 있고, 그 광장[b]에서는 압제와 속임수가 떠나지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파괴적인 악들이’. 히브리어 명사는 복수형이며, 파괴와 재앙을 일으키는 악한 일들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 거리들에서는’. 히브리어는 도시 안의 열린 공공 장소나 광장을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  english_pob_choice: Day and night
  chosen_korean: 낮과 밤에
  alternatives_korean:
  - 날마다 밤마다
  - 낮이든 밤이든
  lexicon: HALOT
  rationale: 지속적인 반복을 나타내는 관용적 시간 쌍이므로, 자연스러운 현대 한국어로 ‘낮과 밤에’라고 옮겨 unceasing action의 의미를 살렸습니다.
- source_word: יְסוֹבְבֻהָ
  english_pob_choice: they go around her
  chosen_korean: 돕니다
  alternatives_korean:
  - 둘러돕니다
  - 에워쌉니다
  lexicon: HALOT
  rationale: סבב의 핵심 이미지는 ‘돌아가다/둘러가다’이므로, 동작의 반복성과 순환을 살리는 ‘돕니다’를 택했습니다. ‘에워쌉니다’도 가능하지만, 본문이 강조하는 움직임 자체를 다소 평평하게 만들 수 있습니다.
- source_word: עַל חוֹמֹתֶיהָ
  english_pob_choice: on her walls
  chosen_korean: 그 성벽 둘레를
  alternatives_korean:
  - 그 성벽 위를
  - 그 성벽에
  lexicon: HALOT
  rationale: עַל의 기본값은 ‘~위에/~에’이지만, 여기서는 둘러도는 동작과 결합되어 ‘성벽 둘레를’이 한국어로 가장 자연스럽고 이미지도 분명합니다.
- source_word: אָוֶן וְעָמָל
  english_pob_choice: trouble and misery
  chosen_korean: 재난과 고통
  alternatives_korean:
  - 악과 압제
  - 불의와 고통
  lexicon: HALOT
  rationale: 두 어휘는 도덕적 악과 그로 인한 고통을 함께 가리킬 수 있으므로, 한국어에서는 그 파괴적 결과를 드러내는 ‘재난과 고통’으로 옮겼습니다. 영어 POB의 의미 범위를 과도하게 좁히지 않도록 했습니다.
- source_word: בְּקִרְבָּהּ
  english_pob_choice: are within her
  chosen_korean: 그 성읍 안에는
  alternatives_korean:
  - 그 가운데에는
  - 그 안에는
  lexicon: HALOT
  rationale: 직역하면 ‘그 중심/한가운데’이지만, 문맥상 도시의 내부를 가리키므로 ‘그 성읍 안에는’이 personification을 유지하면서도 가장 읽기 쉽습니다.
theological_decisions:
- issue: 의인화된 성읍을 여성 대명사로 유지할지 여부
  chosen_reading: ‘그 성읍 안에는’으로 처리해 여성 인칭을 한국어 문장 구조 안에 자연스럽게 흡수하되, 대상이 의인화된 성읍이라는 점은 유지했습니다.
  alternative_readings:
  - 그 안에는
  - 그 도성 안에는
  rationale: 히브리어의 여성 대명사 -הּ는 성읍을 의인화한 표현입니다. 한국어는 성별 대명사 체계가 다르므로, 불필요하게 성별을 드러내지 않고도 의인화 이미지를 보존하는 방식이 적절합니다.
  doctrine_reference: 시편의 시적 의인화 표현
