source:
  edition: WLC
  text: יִֽרַדֹּ֥ף אוֹיֵ֨ב נַפְשִׁ֡/י וְ/יַשֵּׂ֗ג וְ/יִרְמֹ֣ס לָ/אָ֣רֶץ חַיָּ֑/י וּ/כְבוֹדִ֓/י לֶ/עָפָ֖ר יַשְׁכֵּ֣ן סֶֽלָה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/005.yaml
  text: let the enemy pursue my life and overtake it[a]; let him trample my life to the ground and make my glory dwell in the dust[b]. Selah
  footnotes:
  - marker: a
    text: Or 'my soul' for 'my life' (נַפְשִׁי); the Hebrew term can denote the self, soul, or life depending on context.
