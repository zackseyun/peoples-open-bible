translation:
  language: ko
  text: 그러나 저는 가난하고 궁핍합니다. 하나님, 속히 제게로 오소서.[a] 주께서는 저의 도움이시며 저를 건지시는 분이십니다. 여호와여,[b] 지체하지 마소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘제게 속히 하소서’입니다. 문맥상 ‘제게로 속히 오소서’ 또는 ‘저를 위해 속히 행하소서’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 YHWH. ‘야훼’로 음역하기도 합니다.
    reason: alternative_reading
