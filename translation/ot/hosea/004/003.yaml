id: HOS.4.3
reference: Hosea 4:3
source:
  edition: WLC
  text: עַל כֵּ֣ן תֶּאֱבַ֣ל הָ/אָ֗רֶץ וְ/אֻמְלַל֙ כָּל יוֹשֵׁ֣ב בָּ֔/הּ בְּ/חַיַּ֥ת הַ/שָּׂדֶ֖ה וּ/בְ/ע֣וֹף הַ/שָּׁמָ֑יִם וְ/גַם דְּגֵ֥י הַ/יָּ֖ם יֵאָסֵֽפוּ־׀־־׃
translation:
  text: Therefore the land mourns, and everyone who dwells in it languishes, along with the beasts of the field and the birds of the sky; even the fish of the sea perish.
  philosophy: dynamic
lexical_decisions:
- source_word: תֶּאֱבַ֣ל
  chosen: mourns
  alternatives:
  - dries up
  - withers
  - laments
  lexicon: HALOT
  rationale: The verb אבל commonly denotes mourning or lamenting. With 'the land' as subject, the personification is intentional and should be preserved rather than flattened to a purely physical image like 'dries up.'
- source_word: הָ/אָ֗רֶץ
  chosen: the land
  alternatives:
  - the earth
  lexicon: HALOT
  rationale: In Hosea the reference is most naturally to the land of Israel under covenant judgment, though 'earth' is lexically possible. 'Land' best fits the immediate prophetic context.
- source_word: וְ/אֻמְלַל֙
  chosen: languishes
  alternatives:
  - withers
  - wastes away
  - is enfeebled
  lexicon: HALOT
  rationale: The passive sense conveys becoming weak or withered. 'Languishes' works well in English with human inhabitants and preserves the broad sense without forcing a botanical image.
- source_word: כָּל יוֹשֵׁ֣ב בָּ֔/הּ
  chosen: everyone who dwells in it
  alternatives:
  - every inhabitant in it
  - all who live in it
  lexicon: HALOT
  rationale: The singular participle with כל has a collective force. 'Everyone who dwells in it' is natural English and preserves the comprehensive scope.
- source_word: בְּ/חַיַּ֥ת הַ/שָּׂדֶ֖ה
  chosen: along with the beasts of the field
  alternatives:
  - with the wild animals
  - with the animals of the field
  lexicon: HALOT
  rationale: The preposition here links the fate of the inhabitants with that of the animals. 'Beasts of the field' is a clear, fairly literal rendering that preserves the traditional biblical category.
- source_word: וּ/בְ/ע֣וֹף הַ/שָּׁמָ֑יִם
  chosen: and the birds of the heavens
  alternatives:
  - and the birds of the sky
  lexicon: HALOT
  rationale: A literal rendering preserves the elevated biblical diction. 'Heavens' is slightly more formal than 'sky' but remains readable and matches the Hebrew plural form conceptually.
- source_word: וְ/גַם
  chosen: even
  alternatives:
  - also
  - indeed
  lexicon: HALOT
  rationale: The particle heightens the progression of judgment. 'Even' captures the climactic force better than a simple additive 'also.'
- source_word: דְּגֵ֥י הַ/יָּ֖ם
  chosen: the fish of the sea
  alternatives:
  - the fish of the waters
  lexicon: HALOT
  rationale: This is the straightforward lexical sense and preserves the triad of land animals, birds, and fish.
- source_word: יֵאָסֵֽפוּ
  chosen: are taken away
  alternatives:
  - are swept away
  - perish
  - are gathered
  lexicon: HALOT
  rationale: The Niphal of אסף can mean 'be gathered/removed.' In this judgment context, 'are taken away' communicates removal in death or disappearance without overinterpreting the mechanism. 'Are gathered' would be too opaque in English, while 'perish' is interpretive.
