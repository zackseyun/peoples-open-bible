id: PSA.13.3
reference: Psalms 13:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַבִּ֣יטָֽ/ה עֲ֭נֵ/נִי יְהוָ֣ה אֱלֹהָ֑/י הָאִ֥ירָ/ה עֵ֝ינַ֗/י פֶּן אִישַׁ֥ן הַ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/003.yaml
  text: Look and answer me, O Yahweh my God; give light to my eyes[a], lest I sleep the sleep of death[b].
  footnotes:
  - marker: a
    text: Or “brighten my eyes” or “enlighten my eyes.” The Hebrew image may refer to renewed vitality, clarity, or hope.
    reason: lexical_alternative
  - marker: b
    text: Literally “lest I sleep death” or “lest I sleep in death”; traditionally, “lest I sleep the sleep of death.”
    reason: lexical_alternative
translation:
  language: ko
  text: 살펴보시고 제게 응답하여 주십시오, 야훼, 저의 하나님이시여. 제 눈을 밝히소서[a]. 제가 죽음의 잠을 자지 않게 하소서[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 눈에 빛을 비추소서’ 또는 ‘제 눈을 깨우치소서’. 히브리어 이미지는 새 힘, 분명함, 또는 희망을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘제가 죽음을 자지 않게 하소서’ 또는 ‘제가 죽음 안에서 자지 않게 하소서’입니다. 전통적으로는 ‘제가 죽음의 잠을 자지 않게 하소서’라고 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אָ֨נָה
  english_pob_choice: How long
  chosen_korean: 언제까지
  alternatives_korean:
  - 얼마나 오래
  - 어느 때까지
  lexicon: HALOT
  rationale: 탄식 시편의 반복되는 시간 표현으로, 한국어에서는 '언제까지'가 가장 자연스럽고 절박한 호소를 살립니다.
- source_word: אָשִׁ֪ית עֵצ֡וֹת בְּנַפְשִׁי
  english_pob_choice: must I take counsel in my soul
  chosen_korean: 내 속에서 끝없이 계획을 세워야 합니까
  alternatives_korean:
  - 내 영혼 안에서 조언을 받아야 합니까
  - 내 안에서 생각을 세워야 합니까
  lexicon: HALOT
  rationale: '''set/put''와 ''counsels''의 결합을 한국어로 직역하기보다, 내면에서 궁리하며 대비책을 세우는 지속적 부담을 자연스럽게 드러내기 위해 ''계획을 세우다''를 택했습니다.'
- source_word: יָגוֹן בִּלְבָבִי יוֹמָם
  english_pob_choice: with sorrow in my heart all day
  chosen_korean: 온종일 내 마음에 슬픔이 가득한데
  alternatives_korean:
  - 낮 동안 내 마음에 슬픔이 있는데
  - 하루 종일 내 심장에 슬픔이 있는데
  lexicon: HALOT
  rationale: '''לבב''는 여기서 내적 중심을 가리키므로 ''마음''이 자연스럽고, ''יָגוֹן''은 탄식의 정서를 살리는 ''슬픔''으로 옮겼습니다.'
- source_word: יָרוּם אֹיְבִי עָלָי
  english_pob_choice: will my enemy be exalted over me
  chosen_korean: 내 원수가 언제까지 나보다 높아져야 합니까
  alternatives_korean:
  - 내 원수가 언제까지 내 위에 들려야 합니까
  - 내 원수가 언제까지 나를 넘어 높아져야 합니까
  lexicon: HALOT
  rationale: 히브리어의 '높아지다/높여지다' 이미지를 살리면서도 한국어에서 자연스러운 비교 표현으로 풀어, 지배적 우위를 드러냈습니다.
theological_decisions:
- issue: 탄식의 수사적 질문을 한국어에서 어떻게 보존할지
  chosen_reading: 두 번의 '언제까지'와 물음표를 유지해, 시편의 절규와 반복적 호소를 그대로 드러냈습니다.
  alternative_readings:
  - 서술형으로 완화하여 번역
  - 첫 질문만 물음표로 처리
  rationale: 이 절은 정보 전달보다 하나님 앞의 탄식이 핵심이므로, 질문형을 약화하지 않는 것이 본문의 정서와 기능에 충실합니다.
  doctrine_reference: 시편의 탄식 장르와 기도 언어
