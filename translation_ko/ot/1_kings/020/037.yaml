  terminology: ‘부디’, ‘치십시오’, ‘상처를 입혔습니다’는 현대 표준 한국어의 격식 있는 서술에 적절합니다. ‘남자’와 ‘그 남자’는 이 절에서 반복적으로 나타나는 אִישׁ의 남성 지시를 보존합니다. 각주에서 히브리어의 동사 반복과 강조를 설명하여 본문의 자연스러움과 어휘적 정보를 함께 유지합니다.
