  naturalness: ‘철 뿔들을 만들어 자기에게 주고’는 한국어에서 부자연스럽고 원문에도 없는 증여 행위를 뜻합니다. ‘자기를 위해 철 뿔들을 만들고’가 자연스럽습니다. 인용문은 ‘들이받을 것이며, 그들을 멸할 때까지 그렇게 할 것이다’로 하면 원문의 지속·종결 관계를 명료하게 보존합니다.
