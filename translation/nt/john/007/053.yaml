  text: Καὶ ἐπορεύθη ἕκαστος εἰς τὸν οἶκον αὐτοῦ.
  language: Greek
translation:
  text: And each went to his own home[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: John 7:53–8:11 is absent from the earliest surviving Greek manuscripts. Many later manuscripts include it here, while some place it elsewhere in John or in Luke.
    reason: textual_variant
lexical_decisions:
- source_word: πορεύομαι
  chosen: went
  alternatives:
  - departed
  - proceeded
  lexicon: BDAG
  rationale: The verb indicates movement or travel; in the context of a dispersed gathering, 'went' is the most natural English rendering for ἐπορεύθη.
- source_word: ἕκαστος
  chosen: each
  alternatives:
  - everyone
  - each one
  lexicon: BDAG
  rationale: A singular pronoun emphasizing the individual dispersal of the crowd or council.
- source_word: οἶκος
  chosen: home
  alternatives:
  - house
  - household
  lexicon: BDAG
  rationale: While literally 'house', the phrase 'εἰς τὸν οἶκον αὐτοῦ' is the standard Greek idiom for returning 'home'.
