  text: διέλθωμεν εἰς τὰς γενεὰς πάσας καὶ καταμάθωμεν, ὅτι ἐν γενεᾷ καὶ γενεᾷ μετανοίας
    τόπον ἔδωκεν ὁ δεσπότης τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν.
  language: Greek
translation:
  text: Let us pass through all the generations and learn carefully that in generation after generation the Master gave a place for repentance[a] to those willing to turn to him.
  philosophy: optimal-equivalence
  footnotes:
