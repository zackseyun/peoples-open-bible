id: PSA.21.12
reference: Psalms 21:12
source:
  edition: WLC
  text: כִּ֭י תְּשִׁיתֵ֣/מוֹ שֶׁ֑כֶם בְּ֝/מֵֽיתָרֶ֗י/ךָ תְּכוֹנֵ֥ן עַל פְּנֵי/הֶֽם־׃
translation:
  text: For you will make them turn their backs[a]; you will aim your bow at their faces[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'you will make them a shoulder,' probably depicting their backs turned in retreat; another interpretation is 'you will make them a target.'
    reason: alternative_reading
  - marker: b
    text: Literally, 'with your cords you will make ready against their faces'; the compressed Hebrew most likely describes preparing a bow or arrows to shoot.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - Surely
  - Because
  lexicon: HALOT
  rationale: Here כִּי introduces the reason or ground for the preceding praise/confidence, so 'For' fits the discourse flow better than an asseverative 'Indeed' or causal 'Because' in English verse style.
- source_word: תְּשִׁיתֵמוֹ
  chosen: you will make them turn
  alternatives:
  - you will set them
  - you will place them
  lexicon: HALOT
  rationale: From שׁית 'to set/place/make.' In this idiom with שׁכם, a more natural English rendering is not the overly literal 'set them shoulder' but 'make them turn,' expressing the effect of the action.
- source_word: שֶׁכֶם
  chosen: their backs
  alternatives:
  - shoulder
  - back/shoulder
  lexicon: HALOT
  rationale: The singular Hebrew shoulder/back image is applied collectively to plural enemies; plural “backs” is idiomatic English while the note preserves the singular concrete image.
- source_word: בְּמֵיתָרֶיךָ
  chosen: with your bowstrings
  alternatives:
  - with your cords
  - against your strings
  lexicon: HALOT
  rationale: מֵיתָר commonly means cord/string; in this martial context, especially with the following verb of aiming, 'bowstrings' best captures the likely referent rather than generic 'cords.'
- source_word: תְּכוֹנֵן
  chosen: you will aim
  alternatives:
  - you will make ready
  - you will prepare
  - you will establish
  lexicon: HALOT
  rationale: כון in the polel/related stem can mean prepare/make ready. In context of bowstrings and hostile targets, the preparation is specifically that of taking aim, so 'you will aim' is the most idiomatic contextual rendering.
- source_word: עַל־פְּנֵיהֶם
  chosen: at their faces
  alternatives:
  - against their faces
  - toward their faces
  - before them
  lexicon: HALOT
  rationale: פנים is literally 'face.' With עַל in this hostile context, 'at their faces' conveys direct confrontation and the target of the aim. It preserves the vividness of the Hebrew better than the vaguer 'before them.'
- source_word: בְּמֵיתָרֶיךָ ... תְּכוֹנֵן
  chosen: with your bowstrings you will aim
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This is a plausible contextual martial rendering, but the terms more literally concern cords/strings and making ready; the retained note records that interpretive compression.
