  from: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
  to: Be careful to keep every commandment I give you today, so that you may live and multiply and enter and take possession of the land Yahweh swore to give your fathers.
