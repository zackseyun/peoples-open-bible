  terminology: Это личные имена; богословской терминологии нет. «Келухи» согласует русскую передачу с чтением Keluhi, сохраняя начальное к, принятое в английском POB audit trail. Сноска не требуется, поскольку вариантность огласовки не влияет на структуру стиха и не может быть надёжно разрешена по неогласованной форме.
