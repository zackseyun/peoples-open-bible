    rationale: ‘날들이 오고 있으며’ 뒤에 곧바로 미래 수동문이 이어지면, 한국어에서는 무엇이 일어날 ‘날들’인지의 연결이 약합니다. ‘바빌론으로 옮겨질 날들이 오고 있습니다’로 하면 יָמִים בָּאִים의 예고 기능과 뒤 절의 사건이 자연스럽게 결합됩니다.
