  from: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
  to: Solomon rested in death with his ancestors[a] and was buried in the city of his father David. His son Rehoboam succeeded him as king.
  rationale: The lexical record rightly recognizes the sleep metaphor, but its earlier English wording can mislead modern readers. I preserve rest and ancestral continuity while making death explicit, without repeating the earlier note’s unwarranted implication of burial among all his ancestors.
