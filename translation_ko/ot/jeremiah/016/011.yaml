revisions:
- from: 「너희 조상들이 나를 버리고 — 여호와의 말씀이다 — 다른 신들을 따라가며 그들을 섬기고 그들에게 절하였기 때문이다. 그러나 나를 버리고 내 율법을 지키지 않았다.」[a][b]
  to: 그러면 너희는 그들에게 이렇게 말하십시오. 「너희 조상들이 나를 버리고, 야훼께서 말씀하신다, 다른 신들을 따라가 그들을 섬기고 그들에게 절하였으며, 나를 버리고 내 율법을 지키지 않았기 때문이다.」
  rationale: 누락된 도입 명령을 복원하고, נְאֻם יְהוָה를 원문의 삽입 선언으로 보존했습니다. ‘때문이다’가 조상들의 모든 배반 행위를 포괄하도록 접속과 종결을 정리했으며, 불필요하거나 본문에 정박하지 않은 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:23Z'
