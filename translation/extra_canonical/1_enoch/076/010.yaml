  alternatives:
  - go out from them
  - issue from them
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Verb of emergence repeated from the openings; 'them' refers back to the openings.
- source_word: ጤለ
  chosen: as dew
  alternatives:
  - dew
  - moisture
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Best taken as a meteorological result or manner. 'As dew' preserves the image that these southern winds emerge in a dew-bearing form.
