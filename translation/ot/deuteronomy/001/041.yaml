  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Nuance of וַתָּהִינוּ in Israel's attempted ascent
  chosen_reading: presumptuously set out
  alternative_readings:
  - rashly went up
  - were determined to go up
  rationale: The immediate context portrays Israel's action as disobedient and overconfident after divine judgment. The chosen rendering preserves that negative moral nuance without overstating beyond the Hebrew.
