  meaning_decisions:
  - source_phrase: לַעֲשֹׂתוֹ בָּעֵת הַהִיא
    prior_rendering: do it at that time
    new_rendering: keep it at the prescribed time
    rationale: Identifies the action as Passover observance and makes clear that the unavailable time was its normal appointed date, not the second month just selected.
  - source_phrase: הַכֹּהֲנִים לֹא הִתְקַדְּשׁוּ לְמַדַּי
    prior_rendering: the priests had not consecrated themselves sufficiently
