translation:
  language: en
  text: Or do you despise the riches of his kindness, restraint, and patience[a], not knowing that God's kindness is leading you to reorient toward God[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or "goodness" for both occurrences of "kindness."
    reason: simplification_note
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
