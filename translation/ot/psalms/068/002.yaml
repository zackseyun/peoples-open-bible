id: PSA.68.2
reference: Psalms 68:2
source:
  edition: WLC
  text: כְּ/הִנְדֹּ֥ף עָשָׁ֗ן תִּ֫נְדֹּ֥ף כְּ/הִמֵּ֣ס דּ֭וֹנַג מִ/פְּנֵי אֵ֑שׁ יֹאבְד֥וּ רְ֝שָׁעִ֗ים מִ/פְּנֵ֥י אֱלֹהִֽים־׃
translation:
  text: As smoke is driven away, so drive them away; as wax melts before fire, so let the wicked perish before God[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'The verbs may instead express a declaration or prediction: “you drive them away … the wicked perish,” or “you will drive them away … the wicked will perish.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/הִנְדֹּף
  chosen: As ... is driven away
  alternatives:
  - Like the driving away of
  - When ... is driven away
  lexicon: HALOT
  rationale: 'The prefixed כ marks comparison, and the infinitive construct of נדף functions adverbially: ''as/like [the] driving away of.'' In idiomatic English, ''As smoke is driven away'' best captures the simile naturally.'
- source_word: עָשָׁן
  chosen: smoke
  lexicon: HALOT
  rationale: Standard lexical sense is 'smoke.' No contextual reason to vary.
- source_word: תִּנְדֹּף
  chosen: you drive them away
  alternatives:
  - you scatter it
  - you blow it away
  lexicon: HALOT
  rationale: Preserves the root repetition and avoids specifying wind as the agent or instrument.
- source_word: כְּ/הִמֵּס
  chosen: as ... melts
  alternatives:
  - like the melting of
  - when ... melts
  lexicon: HALOT
  rationale: Again כ plus infinitive construct introduces a comparison. English finite verbal style, 'as wax melts,' is more natural while preserving the simile.
- source_word: דּוֹנַג
  chosen: wax
  lexicon: HALOT
  rationale: The noun denotes wax. This is the standard and contextually fitting rendering.
- source_word: מִ/פְּנֵי אֵשׁ
  lemma: מִפְּנֵי
  chosen: before fire
  alternatives:
  - from before the fire
  - at the presence of fire
  lexicon: HALOT
  rationale: מִפְּנֵי literally means 'from before' or 'because of the presence of.' In this idiom with melting, 'before fire' is the most natural English equivalent and preserves the imagery of exposure to fire's presence.
- source_word: יֹאבְדוּ
  chosen: perish
  alternatives:
  - be destroyed
  - vanish
  lexicon: HALOT
  rationale: Qal imperfect 3mp of אבד commonly means 'perish' or 'be destroyed.' 'Perish' fits the poetic parallel with smoke driven away and wax melting, without over-specifying the mode of destruction.
- source_word: רְשָׁעִים
  chosen: the wicked
  alternatives:
  - wicked people
  - the guilty
  lexicon: HALOT
  rationale: The adjective/substantive regularly denotes wicked persons. 'The wicked' is concise, idiomatic, and preserves the moral category.
- source_word: מִ/פְּנֵי אֱלֹהִים
  chosen: before God
  alternatives:
  - from before God
  - at the presence of God
  lexicon: HALOT
  rationale: As with the earlier phrase, מִפְּנֵי is literally 'from before the face/presence of.' In English poetry, 'before God' best conveys the sense of perishing in the face of his presence. 'God' is the straightforward rendering of אֱלֹהִים here.
