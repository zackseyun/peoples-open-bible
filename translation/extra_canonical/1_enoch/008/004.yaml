translation:
  text: And as humankind was being destroyed, they cried out, and their voice reached heaven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “in the destruction of humankind.” The phrase may also be rendered, “as people were perishing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: በሕጕሎተ፡ ሰብእ
  chosen: as humankind was being destroyed
  alternatives:
  - in the destruction of humankind
  - as people were perishing
  rationale: The prepositional phrase is formally “in the destruction of humankind.” In context, English naturally expresses
    the circumstance temporally (“as”), while the passive wording preserves the source’s image of human destruction without
    specifying an agent not named here. “Humankind” represents collective ሰብእ without restricting the reference to adult males.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ፀርሑ
  chosen: they cried out
  alternatives:
  - they shouted
  - they raised a cry
  rationale: The verb denotes an audible, urgent cry. “Cried out” preserves the distress and elevated narrative register without
    adding an explicit addressee.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ቃሎሙ
  chosen: their voice
  alternatives:
  - their cry
  - their sound
  rationale: ቃል is literally “voice,” “sound,” or “word,” and the possessive suffix is plural (“their”). The singular collective
    “their voice” closely reflects the Ge'ez and avoids replacing the noun with a repetition of “cry.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: በጽሐ፡ ... ሰማየ
  chosen: reached heaven
  alternatives:
  - came to heaven
  - went up to heaven
  rationale: The verb expresses arrival or reaching. “Reached heaven” is direct and does not insert an upward-motion verb
    absent from the supplied Ge'ez wording.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
theological_decisions:
- issue: Destination and implied recipient of the human outcry
  chosen_reading: their voice reached heaven
  alternative_readings:
  - their cry rose to God
  - their prayer reached heaven
  rationale: The witness names heaven, not God, and does not characterize the cry as prayer. The translation preserves the
    apocalyptic image while leaving the heavenly recipient unstated, as the source does.
  doctrine_reference: Preserve apocalyptic imagery and theological tension; do not import wording or implications not warranted
    by the local witness.
