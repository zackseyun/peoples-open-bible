lexical_decisions:
- source_word: וְיֵשׁ
  chosen: For
  alternatives:
  - And there is
  - Now there is
  lexicon: HALOT
  rationale: The Hebrew line as transmitted in Kahana is difficult and appears mismatched with the Greek parallel. Because the task requires using the Greek parallel as actual translation input, the main clause is rendered from οὐ γὰρ, which naturally gives explanatory 'for.' This also yields a coherent sense in context.
- source_word: οὐ γὰρ πάντα πᾶσιν συμφέρει
  chosen: not everything is beneficial for everyone
  alternatives:
  - not all things are advantageous to all
  - not everything is fitting for everyone
  lexicon: BDAG
  rationale: συμφέρει commonly means 'is beneficial, advantageous, profitable.' 'Beneficial' is clear modern English and preserves the general ethical sense without over-specifying material profit.
- source_word: πᾶσιν
  chosen: for everyone
  alternatives:
  - to all
  - for all people
  lexicon: BDAG
  rationale: The dative is naturally rendered in English with 'for' here. 'Everyone' is idiomatic and preserves the universal scope.
- source_word: οὐ πᾶσα ψυχὴ
  chosen: not every person
  alternatives:
  - not every soul
  - not everyone
  lexicon: BDAG
  rationale: Although ψυχή is literally 'soul,' in this idiom it refers to a person/self. 'Person' avoids misleading anthropological overtones in English while preserving the distributive sense.
- source_word: ἐν παντὶ εὐδοκεῖ
  chosen: delights in every kind of thing
  alternatives:
  - takes pleasure in everything
  - is pleased with everything
  lexicon: BDAG
  rationale: εὐδοκεῖ denotes taking pleasure or delight. 'Delights in' is natural English and fits wisdom-style observation. 'Every kind of thing' makes explicit the broad object of ἐν παντί without sounding wooden.
- source_word: פְּרִי דַעְתּוֹ
  chosen: beneficial
  alternatives:
  - fruit of his knowledge
  - result of his understanding
  lexicon: HALOT
  rationale: The extant Hebrew wording does not align straightforwardly with the Greek and seems textually unstable for this verse. I did not force a literal rendering of this phrase into the main text because doing so would produce a substantially different sense from the Greek witness. The Greek provides the coherent base text here, while the Hebrew mismatch is preserved in a footnote.
