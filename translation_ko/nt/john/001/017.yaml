source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus Messiah.
  footnotes:
  - marker: a
    text: Or, traditionally, 'through Jesus Christ.'
    reason: alternative_reading
translation:
  language: ko
  text: 율법은 모세를 통해 주어졌고, 은혜와 진리는 메시아 예수[a]를 통해 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘예수 그리스도를 통해’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ νόμος
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 율법(모세의 율법)
  - 법
  lexicon: BDAG
  rationale: νόμος는 문맥상 모세에게서 전해진 모세 율법을 가리키므로 한국어 표준어 '율법'을 사용해 원문 지시를 보존했습니다.
- source_word: ἡ χάρις
  english_pob_choice: grace
  chosen_korean: 은혜
  alternatives_korean:
  - 호의
  - 은총
  lexicon: BDAG
  rationale: χάρις는 요한 문헌에서 하나님의 은혜를 지시하므로 전통적이고 의미가 풍부한 '은혜'로 옮겼습니다.
- source_word: ἡ ἀλήθεια
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 참됨
  - 실재
  lexicon: BDAG
  rationale: ἀλήθεια는 예수 안에서 드러나는 진리를 가리키므로 한국어 '진리'가 요한의 의미를 충실히 전달합니다.
- source_word: Χριστοῦ (Ἰησοῦ Χριστοῦ)
  english_pob_choice: Jesus Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 그리스도(전통 표기)
  lexicon: BDAG; DOCTRINE.md
  rationale: 프로젝트 규정과 영어 POB 판정에 따라 Χριστός를 직역적 직함인 '메시아'로 번역해 헬라어 칭호의 유대적 의미를 보존했습니다.
theological_decisions:
- issue: Rendering Χριστοῦ in Ἰησοῦ Χριστοῦ
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  - 예수 그리스도
  rationale: DOCTRINE.md 정책에 따라 Χριστός를 이름형(그리스도)으로 음역하기보다 '메시아'로 번역해 칭호의 의미(기름부음을 받은 자, 유대적 메시아 기대)를 드러내는 편을 택했습니다. 전통적 표기는 주석(각주)으로 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; Contested terms table for Χριστός'
