id: PSA.107.12
reference: Psalms 107:12
source:
  edition: WLC
  text: וַ/יַּכְנַ֣ע בֶּ/עָמָ֣ל לִבָּ֑/ם כָּ֝שְׁל֗וּ וְ/אֵ֣ין עֹזֵֽר׃
translation:
  text: So he humbled their hearts with toil[a]; they stumbled, and there was no one to help.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “with hardship.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכְנַע
  chosen: he humbled
  alternatives:
  - he subdued
  - he brought low
  lexicon: HALOT
  rationale: The Hiphil of כנע here has God as the implied subject from the surrounding context and conveys causing humiliation or subduing. 'He humbled' is natural English and preserves the causative sense without overinterpreting.
- source_word: בֶּעָמָל
  chosen: with toil
  alternatives:
  - through toil
  - with trouble
  lexicon: HALOT
  rationale: עָמָל includes burdensome toil and may extend to hardship or trouble. “With toil” retains its primary concrete sense without specifying compulsory hard labor.
- source_word: לִבָּם
  chosen: their hearts
  alternatives:
  - their hearts
  - their inner being
  lexicon: HALOT
  rationale: The collective Hebrew singular is naturally rendered by a distributive plural in English.
- source_word: כָּשְׁלוּ
  chosen: they stumbled
  alternatives:
  - they fell
  - they tottered
  lexicon: HALOT
  rationale: כשל commonly means to stumble or totter, sometimes with the result of falling. 'They stumbled' preserves the verbal image without adding the stronger result unless context requires it.
- source_word: וְאֵין עֹזֵר
  chosen: and there was no one to help
  alternatives:
  - with no helper
  - and there was none helping
  lexicon: HALOT
  rationale: This clause states the absence of any helper. 'There was no one to help' is idiomatic modern English and retains the existential force of אֵין plus participle.
