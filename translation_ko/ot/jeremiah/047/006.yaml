  text: 아아, 야훼의 칼이여, 언제까지 잠잠하지 않겠습니까? 네 칼집으로 돌아가십시오. 쉬고 잠잠히 있으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶ֚רֶב
  english_pob_choice: sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  lexicon: חֶרֶב
  rationale: 전쟁 도구로서의 직역성을 살리기 위해 ‘칼’을 택했습니다. 한국어 성서 문맥에서 가장 자연스럽고 직접적인 대응입니다.
- source_word: לַֽיהוָ֔ה
  english_pob_choice: of the LORD
  chosen_korean: 야훼의
  alternatives_korean:
  - 주님의
  - 여호와의
  lexicon: יהוה
  rationale: 원어의 신명 표기를 따라 ‘야훼’를 사용했습니다. POB의 원문 지향성과 일치하며, 영어 본문의 LORD보다 더 직접적으로 원천 ভাষা를 반영합니다.
- source_word: הֵאָֽסְפִי
  english_pob_choice: Return
  chosen_korean: 칼집으로 돌아가십시오
  alternatives_korean:
  - 칼집에 다시 들어가십시오
  - 돌아오십시오
  lexicon: אסף
  rationale: 동사의 방향성을 한국어로 풀어, 칼이 ‘칼집으로’ 돌아가는 그림이 분명히 드러나도록 했습니다. 단순히 ‘돌아가십시오’보다 원문의 대상을 유지합니다.
- source_word: עַד אָ֖נָה לֹ֣א תִשְׁקֹ֑טִי
  english_pob_choice: how long will you not be quiet?
  chosen_korean: 언제까지 잠잠하지 않겠습니까?
  alternatives_korean:
  - 언제까지 가만히 있지 않겠습니까?
  - 언제까지 조용하지 않겠습니까?
  lexicon: שׁקט
  rationale: ‘잠잠하다’는 소란과 활동을 멈추는 의미를 잘 담아, 전쟁 칼의 멈춤을 자연스럽게 표현합니다. ‘quiet’의 단순 정적보다 문맥에 맞는 동작 중지를 반영합니다.
theological_decisions:
- issue: 야훼 호칭의 처리
  chosen_reading: 원문 יהוה를 ‘야훼’로 음역해 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명 표지를 가리고 일반 호칭으로 완화하지 않기 위해, 원천 ভাষা를 드러내는 표기를 유지했습니다.
