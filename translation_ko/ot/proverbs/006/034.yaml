  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי קִנְאָ֥ה חֲמַת גָּ֑בֶר וְ/לֹֽא יַ֝חְמ֗וֹל בְּ/י֣וֹם נָקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/034.yaml
  text: For jealousy is a man's fury, and he will show no mercy on the day of vengeance.
translation:
  language: ko
  text: 질투는 남자의 격분이므로, 그는 복수의 날에 자비를 베풀지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִנְאָה
  english_pob_choice: jealousy
  chosen_korean: 질투
  alternatives_korean:
  - 시기
  - 투기
  lexicon: קִנְאָה
  rationale: 원문의 감정·열정 상태를 가장 직접적으로 드러내는 표준어는 '질투'이며, POB의 'jealousy'와도 대응됩니다.
- source_word: חֲמַת גָּבֶר
  english_pob_choice: a man's fury
  chosen_korean: 남자의 분노
  alternatives_korean:
  - 한 남자의 격분
  - 사내의 격노
  lexicon: חֵמָה / חֲמַת + גֶּבֶר
  rationale: 문자적으로는 '남자의 분노/격분'이며, 소유격 뉘앙스를 살려 '남자의 분노'로 옮겼습니다.
- source_word: וְלֹא יַחְמוֹל
  english_pob_choice: he will show no mercy
  chosen_korean: 자비를 베풀지 않습니다
  alternatives_korean:
  - 긍휼을 베풀지 않습니다
  - 용서하지 않습니다
  lexicon: חמל
  rationale: חמל의 핵심은 '불쌍히 여겨 아끼다, 자비를 보이다'이므로 동사구를 자연스럽게 '자비를 베풀지 않습니다'로 옮겼습니다.
- source_word: בְּיוֹם נָקָם
  english_pob_choice: on the day of vengeance
  chosen_korean: 복수의 날
  alternatives_korean:
  - 원수 갚는 날
  - 보복의 날
  lexicon: נקם
  rationale: נָקָם은 보복/복수의 응보적 날을 가리키며, 본문 병행성을 살려 '복수의 날'로 간결하게 옮겼습니다.
theological_decisions:
- issue: 감정의 인격화된 파괴력
  chosen_reading: 질투가 남자를 사로잡아 복수로 치닫게 하는 파괴적 동력이라는 뜻을 직설적으로 살렸습니다.
  alternative_readings:
  - 질투는 단지 감정 상태일 뿐이라는 완화된 표현
  - 질투를 일반적 '시기'로 중화하는 읽기
  rationale: 문맥상 잠언은 질투의 격정적·폭력적 결과를 경고하므로, 도덕적 경고의 강도를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 잠언의 지혜 문학적 경고, 인간 죄성에 대한 일반 계시
