id: PSA.89.36
reference: Psalms 89:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֭חַת נִשְׁבַּ֣עְתִּי בְ/קָדְשִׁ֑/י אִֽם לְ/דָוִ֥ד אֲכַזֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/036.yaml
  text: His offspring will endure forever[a][b], and his throne will be like the sun before me.
  footnotes:
  - marker: a
    text: Hebrew literally, 'If I lie to David,' an oath formula meaning 'I will not lie to David' or 'surely I will not be false to David.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Once for all I have sworn by my holiness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 자손은 영원히 있을 것이며, 그의 왕위는 내 앞에서 해와 같을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַת
  english_pob_choice: Once
  chosen_korean: 한 번
  alternatives_korean:
  - 일단
  - 한 차례
  - 한 번만
  lexicon: HALOT
  rationale: 맹세 문맥에서 אַחַת은 단순 수사가 아니라 결정적이고 단회적인 맹세를 가리키므로, 한국어도 ‘한 번’으로 간결하게 옮기는 것이 자연합니다.
- source_word: בְקָדְשִׁי
  english_pob_choice: by my holiness
  chosen_korean: 내 거룩함으로
  alternatives_korean:
  - 나의 거룩함으로
  - 내 성소로
  - 내 거룩한 자로
  lexicon: HALOT
  rationale: ב + קדשׁ + 1인칭 접미사는 하나님의 성품 자체를 맹세의 근거로 삼는 표현이므로, ‘내 거룩함으로’가 직역성과 신학적 무게를 함께 살립니다.
- source_word: אִם לְדָוִד אֲכַזֵּב
  english_pob_choice: I will not lie to David.
  chosen_korean: 다윗에게 거짓말하지 않으십니다
  alternatives_korean:
  - 다윗에게 거짓말하지 않겠습니다
  - 다윗에게 불성실하지 않으십니다
  - 다윗에게 속이지 않으십니다
  lexicon: HALOT
  rationale: 히브리어의 אִם 절은 맹세 공식에서 생략된 부정을 드러내는 표현이므로, 한국어에서는 완결된 부정문으로 옮겨 의미를 분명히 했습니다.
theological_decisions:
- issue: 맹세 공식의 암시적 부정을 한국어에서 어떻게 처리할지
  chosen_reading: 맹세의 서약성과 부정을 함께 살려 ‘한 번 맹세하셨으니… 다윗에게 거짓말하지 않으십니다’로 옮겼습니다.
  alternative_readings:
  - '‘내 거룩함으로 맹세하셨으니: 다윗에게 거짓말하지 않으십니다’'
  - ‘내 거룩함으로 한 번 맹세하셨습니다. 다윗에게 거짓말하지 않으십니다’
  rationale: 히브리어는 조건문처럼 보이지만 실제로는 맹세의 관용구이므로, 한국어에서 조건감이 아니라 확정적 부정의 힘이 드러나도록 처리하는 것이 본문의 의도에 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
