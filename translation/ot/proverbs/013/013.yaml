id: PRO.13.13
reference: Proverbs 13:13
source:
  edition: WLC
  text: בָּ֣ז לְ֭/דָבָר יֵחָ֣בֶל ל֑/וֹ וִ/ירֵ֥א מִ֝צְוָ֗ה ה֣וּא יְשֻׁלָּֽם׃
translation:
  text: Whoever despises instruction will suffer for it, but whoever reveres a command[a] will be rewarded.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'fears a command.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  chosen: despises
  alternatives:
  - scorns
  - treats with contempt
  lexicon: HALOT
  rationale: The participle denotes one who holds something in contempt. 'Despises' is natural modern English and preserves the moral force better than the slightly more idiomatic 'scorns.'
- source_word: לְדָבָר
  chosen: a word
  alternatives:
  - the word
  - a matter
  lexicon: HALOT
  rationale: דָבָר can mean 'word,' 'matter,' or 'thing.' In this proverb it likely refers broadly to an instruction or spoken counsel. 'A word' keeps the Hebrew's lexical form and proverbial openness, while avoiding over-specification.
- source_word: יֵחָבֶל לוֹ
  chosen: will suffer for it
  alternatives:
  - will suffer for it
  - will be destroyed
  - brings ruin on himself
  lexicon: HALOT
  rationale: Expresses adverse consequence for the person without making the word an explicit instrument of ruin.
- source_word: וִירֵא
  chosen: he who fears
  alternatives:
  - whoever reveres
  - he who stands in awe of
  lexicon: HALOT
  rationale: The adjective/participle from ירא expresses reverent fear. 'Fears' preserves the Hebrew term directly and maintains the wisdom-literature theme of fear/reverence without softening it to mere respect.
- source_word: מִצְוָה
  chosen: a command
  alternatives:
  - the command
  - instruction
  lexicon: HALOT
  rationale: Reflects the generic indefinite noun without importing a particular covenantal command.
- source_word: יְשֻׁלָּם
  chosen: will be rewarded
  alternatives:
  - will be rewarded
  - will receive recompense
  lexicon: HALOT
  rationale: The contextual recompense is positive.
- source_word: הוּא
  chosen: he
  alternatives:
  - that one
  - such a person
  lexicon: HALOT
  rationale: The explicit pronoun adds emphasis. Rendering it as 'he' preserves the masculine singular form in line with the project's gender-accurate policy, while still functioning generically in proverbial style.
