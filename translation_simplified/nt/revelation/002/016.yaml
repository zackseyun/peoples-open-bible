translation:
  language: en
  text: So reorient toward God[r1]. If you do not reorient toward God, I am coming to you quickly, and I will make war against them[a] with the sword of my mouth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression can literally mean “with them,” but here it means “against them.”
    reason: lexical_alternative
  - marker: b
    text: The “sword of my mouth” is an apocalyptic image for Christ’s judicial word of judgment.
    reason: cross_reference
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: I am coming to you quickly, and I will make war against them
  simplified_phrase: I am coming to you quickly, and I will make war against them
  preserved_meaning: Christ addresses the church as “you” while directing the threatened warfare against “them.”
  reasoning_layer_used: theological decision on corporate address and targeted judgment
  rationale: The distinct pronouns are retained so the text’s deliberate tension is not erased.
interpretive_expansions:
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: Modern readers may take the sword as a literal weapon.
    mitigation: The footnote identifies it as Revelation’s image for Christ’s judicial pronouncement.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
