  category: meaning_retranslation
  from: He will speak words against the Most High[a], and he will wear out the saints of the Most High. He will intend to change times and law, and they will be given into his hand for a time, times[c][b], and half a time.
  to: He will speak against the Most High and wear out the holy ones of the Most High. He will plan to change the appointed times[a] and the law, and the holy ones will be handed over to him for a time, times, and half a time[b].
  rationale: The documented senses of sustained exhaustion, intention without assured success, and the holy ones as the implied subject guide the rendering. The apocalyptic time formula is retained rather than converted into a fixed chronology, with the calendrical understanding noted as an alternative.
