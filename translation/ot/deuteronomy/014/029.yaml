    new_rendering: the resident foreigner ... living in your towns
    rationale: The wording makes settled residence and the local community setting explicit, consistently with verse 21.
  - source_phrase: בְּכָל מַעֲשֵׂה יָדְךָ אֲשֶׁר תַּעֲשֶׂה
