  chosen_korean: 훨씬 더
  alternatives_korean:
  - 더욱
  - 훨씬
  lexicon: πολύ + πλέον
  rationale: 비교급 강조를 자연스러운 현대 한국어로 옮기되, POB의 'far more'가 가진 강한 정도 차이를 유지했습니다.
