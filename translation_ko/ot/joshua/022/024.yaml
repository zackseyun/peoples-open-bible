  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: ko
  text: 아닙니다.[a] 오히려 어떤 일이 염려되어 우리가 이렇게 한 것입니다. ‘앞으로 여러분의 자녀들이 우리 자녀들에게 이렇게 말할 것입니다. “너희가 이스라엘의 하나님 여호와와 무슨 상관이 있느냐?”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 וְאִם לֹא는 여기서 단순한 ‘아니요’보다 앞선 오해를 부정하고 이유를 밝히는 대조적 전환으로 기능합니다.
    reason: source_note
lexical_decisions:
- source_word: מִדְּאָגָה מִדָּבָר
  english_pob_choice: out of anxious concern
  chosen_korean: 불안한 염려 때문에
  alternatives_korean:
  - 염려 때문에
  - 근심 때문에
  - 불안한 마음 때문에
  lexicon: מדאגה / דבר
  rationale: 명사구의 중첩이 단순한 이유가 아니라 감정적 긴장과 우려를 함께 드러내므로, ‘불안한 염려’로 눌러 표현하되 지나치게 해석을 늘리지 않았습니다.
- source_word: מָחָר
  english_pob_choice: In time to come
  chosen_korean: 앞으로
  alternatives_korean:
  - 장차
  - 훗날
  - 내일
  lexicon: מחר
  rationale: 문맥상 문자적 ‘내일’이 아니라 미래의 어느 때를 가리키므로, POB의 시간적 완화를 살려 자연스러운 미래 표현으로 옮겼습니다.
- source_word: מַה לָּכֶם וְלַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: What have you to do with the LORD, the God of Israel?
  chosen_korean: 너희가 이스라엘의 하나님이신 여호와와 무슨 상관이 있느냐
  alternatives_korean:
  - 너희가 이스라엘의 하나님이신 여호와와 무슨 관계가 있느냐
  - 너희가 이스라엘의 하나님 여호와와 무슨 상관이 있느냐
  lexicon: מה לכם ויהוה אלהי ישראל
  rationale: 관용적 불편·단절의 질문으로서 ‘무슨 상관이 있느냐’가 מקור의 공격성을 가장 직접적으로 전달하며, 야훼는 본문 관례에 따라 ‘여호와’가 아니라 ‘야훼’를 기본으로 삼되 이 항목은 POB의 LORD 표기를 반영해 본문에서는 전통적 호칭을 유지했습니다.
theological_decisions:
- issue: 문장 첫머리의 부정·대조 구조
  chosen_reading: ‘아닙니다. 오히려…’로 시작해 단순 부정이 아니라 의도 설명으로 넘어가는 대조를 살렸습니다.
  alternative_readings:
  - ‘아니요’
  - ‘그렇지 않습니다’
  rationale: 히브리어 וְאִם לֹא는 앞선 추정을 강하게 부인하면서 이유를 제시하므로, 한국어에서도 대조 접속을 드러내야 논리 흐름이 보존됩니다.
  doctrine_reference: 서사 문맥의 수사 구조 보존
