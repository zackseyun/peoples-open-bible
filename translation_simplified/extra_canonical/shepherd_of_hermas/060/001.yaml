  previous_text: …with all their heart. So, do you think that people who repent have their sins forgiven immediately? Not completely. A person who repents must discipline his own soul, remain humble in everything he does, and firmly endure the distress of every kind of trouble. If he bears the troubles that come upon him, the One who created and strengthened all things will surely have compassion and grant him some healing. This will happen when God sees that the repentant person’s heart is clean from everything.
  previous_model: gpt-5.6-sol
  reviewer_model: gpt-5.6-terra
  review_verdict: revise
  review_output_hash: ae657def28af394bc8237825634739d4633bc3d290ed08441bf2ea1a46ea0b70
  review_summary: 'The draft is generally clearer and rightly retains the broad scope of “clean from everything.” However, it should be revised because “discipline his own soul” does not adequately carry the required self-affliction, and “firmly endure the distress” fuses two distinct demands: being distressed in tribulations and bearing the tribulations that come. The replacement keeps the passage’s severe, conditional account of repentance without adding a doctrinal mechanism or narrowing its ambiguity.'
