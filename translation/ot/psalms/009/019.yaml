  rationale: אֱנוֹשׁ commonly denotes humankind with an emphasis on human frailty or mortality. In this appeal to Yahweh, “mortals” conveys that contrast more fully and naturally than unqualified generic “man.” The plural generic is idiomatic English and does not materially alter the representative collective sense of the singular Hebrew.
