translation:
  text: “The whole order of the stars will be shut off from sinners. The thoughts of those on earth will go astray
    concerning them. [They will turn away from all their paths.][a] They will go astray and consider them gods.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The clause they-will-turn-away-from-all-their-paths is bracketed in the selected edition. Charles printed153
      note20 calls it an interpolation and explains the difficulty of attaching it to either people or stars. This
      English retains it visibly bracketed without deciding that disputed referent. The following consider-them-gods
      clause is not translated as genuine divine status. Dillmann1865 col1022 explicitly cites80:7 for the shut-off
      construction with the preposition used here.
    reason: textual_variant
