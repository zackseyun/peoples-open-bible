theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Sense of אִי in אִי כַפְתּוֹר
  chosen_reading: coastland
  alternative_readings:
  - island
  rationale: The Hebrew term can denote island or coastland. In this prophetic context, 'coastland' is a natural geographic rendering in English while preserving the association with Caphtor. Because 'island' is also viable, it is preserved in a footnote.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it (applied analogically to genuine lexical ambiguity)
