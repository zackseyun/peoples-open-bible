  text: Καὶ ἐζήτησεν Τρύφων βασιλεῦσαι τῆς Ἀσίας καὶ περιθέσθαι τὸ διάδημα καὶ ἐκτεῖναι χεῖρας ἐπ’ Ἀντίοχον τὸν βασιλέα.
