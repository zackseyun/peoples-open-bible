  to: 그때 압살롬이 왕에게 와서 말했습니다. “보십시오, 이 종에게는 양털을 깎는 사람들이 있습니다. 부디 왕과 왕의 신하들도 이 종과 함께 가 주십시오.”
  rationale: 왕 앞에서의 압살롬의 겸양적 자기호칭을 ‘이 종’으로, 왕의 수행자들을 ‘왕의 신하들’로 옮겨 현대 표준 한국어의 자연스러움과 궁정 예법의 어조를 함께 살렸습니다. 불필요한 각주는 제거했습니다.
