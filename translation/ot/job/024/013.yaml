id: JOB.24.13
reference: Job 24:13
source:
  edition: WLC
  text: הֵ֤מָּה הָיוּ֮ בְּֽ/מֹרְדֵ֫י א֥וֹר לֹֽא הִכִּ֥ירוּ דְרָכָ֑י/ו וְ/לֹ֥א יָ֝שְׁב֗וּ בִּ/נְתִיבֹתָֽי/ו׀־־׃
translation:
  text: There are those who rebel against the light; they do not acknowledge its ways, nor do they remain in its paths.
  philosophy: dynamic
lexical_decisions:
- source_word: הֵמָּה
  chosen: These
  alternatives:
  - They
  lexicon: HALOT
  rationale: Independent pronoun used for emphasis. 'These' preserves the demonstrative-like force in context, pointing out a class of people just described; 'they' is possible but less pointed.
- source_word: הָיוּ
  chosen: are
  alternatives:
  - were
  lexicon: HALOT
  rationale: Although formally qatal ('were'), Hebrew often uses היה with class-membership in a gnomic or present-descriptive sense in poetry. In context Job is characterizing a type of wicked person, so present 'are' reads naturally in English while preserving the ongoing description.
- source_word: בְּמֹרְדֵי
  chosen: among those who rebel
  alternatives:
  - among the rebels
  - with the rebels
  lexicon: HALOT
  rationale: 'The preposition ב plus participial noun is best taken as class inclusion: ''among those who rebel.'' Rendering the participle verbally keeps the active sense of מרד clear.'
- source_word: אוֹר
  chosen: the light
  alternatives:
  - light
  lexicon: HALOT
  rationale: Definite-sounding English fits the generic but conceptually definite Hebrew expression in context. Here 'light' likely carries both literal and moral/social overtones, so a straightforward rendering is preferred without over-interpreting.
- source_word: לֹא הִכִּירוּ
  chosen: do not recognize
  alternatives:
  - have not known
  - do not know
  - do not acknowledge
  lexicon: HALOT
  rationale: הכיר can mean recognize, know, or acknowledge. 'Recognize' fits the object 'its ways' well and preserves the sense of failing to perceive or admit them. Present tense matches the gnomic description.
- source_word: דְרָכָיו
  chosen: its ways
  alternatives:
  - his ways
  - their ways
  lexicon: HALOT
  rationale: The 3ms suffix most naturally refers back to אוֹר, a grammatically masculine singular noun, yielding 'its ways' in idiomatic English. 'His ways' would personify 'light' more strongly than the Hebrew requires.
- source_word: וְלֹא יָשְׁבוּ
  chosen: nor do they remain
  alternatives:
  - and they do not dwell
  - and they do not sit
  - nor do they remain
  lexicon: HALOT
  rationale: With paths, the verb has the sense of abiding or remaining.
- source_word: בִּנְתִיבֹתָיו
  chosen: in its paths
  alternatives:
  - in its tracks
  - on its paths
  - in its ways
  lexicon: HALOT
  rationale: נתיבה denotes a path or track. 'Paths' keeps the poetic parallel with 'ways' while preserving the distinct lexical item. The suffix is again best referred to 'light,' hence 'its.'
- source_word: הֵמָּה הָיוּ בְּמֹרְדֵי
  chosen: They are among those who rebel
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English preserves the class-description reading while the past-form alternative is noted.
