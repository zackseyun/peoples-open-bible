  language: ko
  text: 아르논 골짜기 가장자리에 있는 아로엘에서부터, 골짜기 한가운데에 있는 성읍과 메드바에서 디본까지의 온 평지에 이르는 곳입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵעֲרוֹעֵר
  english_pob_choice: from Aroer
  chosen_korean: 아로엘에서
  alternatives_korean:
  - 아로에르에서
  - 아로엘로부터
  lexicon: 고유명사
  rationale: 히브리어 지명 עֲרוֹעֵר는 한국어 성서에서 통용되는 아로엘로 옮기되, מקור의 출발점 표지 מִן/מֵ를 살려 ‘-에서’로 처리했습니다.
- source_word: עַל שְׂפַת נַחַל אַרְנוֹן
  english_pob_choice: on the edge of the Arnon Valley
  chosen_korean: 아르논 골짜기의 가장자리
  alternatives_korean:
  - 아르논 골짜기 언저리
  - 아르논 골짜기 가
  - 아르논 골짜기 둑
  lexicon: שְׂפָה / נַחַל
  rationale: שְׂפַת은 강·골짜기의 ‘가’나 ‘가장자리’에 해당하므로, 영어 POB의 edge of를 따라 ‘가장자리’로 직역에 가깝게 살렸습니다.
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  english_pob_choice: and the city that is in the middle of the valley
  chosen_korean: 골짜기 가운데 있는 성읍
  alternatives_korean:
  - 골짜기 속에 있는 성읍
  - 골짜기 한가운데 있는 성읍
  lexicon: בְּתוֹךְ
  rationale: בְּתוֹךְ은 내부를 가리키므로 ‘가운데 있는’으로 자연스럽게 옮겨, 지리적 위치를 분명히 했습니다.
- source_word: וְכָל הַמִּישֹׁר מֵידְבָא עַד דִּיבוֹן
  english_pob_choice: and all the tableland from Medeba to Dibon
  chosen_korean: 메드바에서 디본까지 이어지는 온 평지
  alternatives_korean:
  - 메드바에서 디본까지의 모든 평야
  - 메드바에서 디본까지의 온 고원
  lexicon: הַמִּישֹׁר
  rationale: מִישׁוֹר는 ‘평지/고원지대’로 옮길 수 있으나, 문맥상 광활한 지형 범위를 살리기 위해 ‘온 평지’로 간결하게 처리했습니다.
