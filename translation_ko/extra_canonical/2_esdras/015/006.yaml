    text: 또는 ‘그들의 해로운 일들’.
    reason: previous_rendering
  revision_rationale: 본문 라틴어의 어휘와 구문을 따라 ‘해로운’을 본문에서 제거하고, superposuit와 adimpletae sunt의 공간적·완료적 뉘앙스를 더 직접적으로 반영했습니다. 대안 표현은 본문 비평적 읽기라고 단정하지 않고 기존 POB 감사 기록에 맞추어 각주에만 유지했습니다.
