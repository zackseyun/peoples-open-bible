  from: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
  to: At that time we took from the two Amorite kings the land east of the Jordan, from the Arnon Valley as far as Mount Hermon.
  rationale: The lexical record recognizes both possession as the sense of “hand” and a valley or ravine as the sense of the Arnon term. I use those meanings directly and replace the relative “beyond” with the established eastern location.
