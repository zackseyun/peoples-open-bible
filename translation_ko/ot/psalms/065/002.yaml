lexical_decisions:
- source_word: לְךָ ... תְהִלָּה
  english_pob_choice: To you, silence is praise
  chosen_korean: 침묵이 주님께 드리는 찬양입니다
  alternatives_korean:
  - 주님께는 침묵이 찬양입니다
