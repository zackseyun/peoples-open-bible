source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἐὰν οὖν²⁶ ἡ ψυχὴ θέλει²⁷ *†καλῶς πορευθῆναι†, πάσας τὰς πράξεις αὐτῆς ποιεῖ²⁸ ἐν δικαιοσύνῃ, *κἂν ἁμάρτῃ²⁹ εὐθὺς³⁰ μετανοεῖ.
  language: Greek
translation:
  text: If, then, the soul wants to walk well, it does all its actions in righteousness; and even if it sins, it immediately repents[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims.
    reason: lexical_alternative
