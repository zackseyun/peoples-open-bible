- from: 하나님, 제 기도를 들으시고 제 입의 말들에 귀를 기울여 주십시오.[a]
  to: 낯선 자들이 나를 대적하여 일어났고, 포악한 자들이 내 목숨을 노리고 있습니다. 그들은 하나님을 자기들 앞에 두지 않습니다. 셀라.
  rationale: 원문 כִּי를 앞 절의 탄원에 대한 이유를 제시하는 연결로 자연스럽게 반영하고, קָמוּ עָלַי를 ‘나를 대적하여 일어났고’로, בִּקְשׁוּ נַפְשִׁי를 문맥상 살해 위협을 뜻하는 ‘내 목숨을 노리고 있습니다’로 옮겼습니다. ‘하나님을 자기들 앞에 두지 않습니다’는 לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם의 비유를 보존하며 해석을 과도하게 덧붙이지 않습니다. 기존 각주는 다른 절에 대한 것이므로 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:09:01Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 시편 54:4의 히브리어 본문이 아니라 앞 절에 해당하는 ‘하나님, 제 기도를 들으시고…’를 번역하고 있습니다. 따라서 주어진 원문(낯선 자들이 일어남, 포악한 자들이 생명을 찾음, 하나님을 앞에 두지 않음, 셀라)을 빠짐없이 옮기도록 전면 교정해야 합니다.
  naturalness: 교정문은 현대 표준 한국어의 합쇼체로, 시편의 탄원·고발 문맥을 자연스럽게 유지합니다. ‘내 목숨을 노리고 있습니다’는 ‘내 생명을 찾다’의 관용적 한국어 표현입니다.
  terminology: זָרִים은 민족적 의미를 확정하지 않기 위해 ‘낯선 자들’로, עָרִיצִים은 폭력성과 억압성을 담아 ‘포악한 자들’로 옮겼습니다. נֶפֶשׁ은 이 위협 문맥에서 ‘목숨’으로, סֶלָה는 의미가 불확실하므로 ‘셀라’로 보존했습니다.
