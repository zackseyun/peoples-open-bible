id: JOB.6.20
reference: Job 6:20
source:
  edition: WLC
  text: בֹּ֥שׁוּ כִּֽי בָטָ֑ח בָּ֥אוּ עָ֝דֶ֗י/הָ וַ/יֶּחְפָּֽרוּ־׃
translation:
  text: They were disappointed because they had trusted; they reached the stream and were put to shame.
  philosophy: dynamic
lexical_decisions:
- source_word: בֹּשׁוּ
  chosen: were disappointed
  alternatives:
  - were put to shame
  - are disappointed
  lexicon: HALOT
  rationale: In this context of an expected stream failing its seekers, the verb conveys disappointed expectation while retaining an association with shame.
- source_word: כִּי
  chosen: because
  alternatives:
  - for
  - indeed
  lexicon: HALOT
  rationale: 'Here כִּי most naturally introduces the reason for their shame: they are ashamed because they had trusted. ''Because'' gives the clearest causal sense in English.'
- source_word: בָטָח
  chosen: they had trusted
  alternatives:
  - he trusted
  - they were confident
  lexicon: HALOT
  rationale: The pluperfect naturally presents the confidence as preceding and causing the travelers’ disappointment; the plural is an English contextual smoothing of the Hebrew singular form amid plural verbs.
- source_word: בָּאוּ
  chosen: they came
  alternatives:
  - they arrived
  lexicon: HALOT
  rationale: Simple rendering of בוא in the Qal perfect 3cp. 'They came' is the most direct English equivalent.
- source_word: עָדֶיהָ
  chosen: to it
  alternatives:
  - to it
  - to her
  lexicon: HALOT
  rationale: This preserves the explicit feminine singular pronominal destination referring back to the stream or watercourse.
- source_word: וַיֶּחְפָּרוּ
  chosen: were put to shame
  alternatives:
  - were confounded
  - were humiliated
  - blushed with shame
  lexicon: HALOT
  rationale: The verb denotes being ashamed, confounded, or humiliated; this rendering preserves that force without denying its overlap with disappointment.
