  text: "Διὰ τὸ ἀργύριον ἐγὼ¹⁰ τέκνα μου ἀπώλεσα τὰ τέκνα μου¹², καὶ εἰ μὴ ἡ¹³ μετάνοιά μου¹⁵ καὶ¹⁶ ἡ ταπείνωσίς μου¹⁷ καὶ¹⁷ ηὐχαι¹⁸ τοῦ πατρός μου συνεδράμον¹⁹, ἄτεκνος εἶχον ἀποθανεῖν."
  language: Greek
translation:
  text: Because of silver I lost my children; and if my reorientation[r1] and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
