id: 1CLEM.7.7
reference: 1 Clement 7:7
unit: verse
book: 1 Clement
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰωνᾶς Νινευίταις καταστροφὴν ἐκήρυξεν· οἱ δὲ μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν ἐξιλάσαντο τὸν θεὸν ἱκετεύσαντες καὶ ἔλαβον σωτηρίαν, καίπερ ἀλλότριοι τοῦ θεοῦ ὄντες.
  language: Greek
translation:
  text: Jonah proclaimed destruction to the Ninevites; but they[a], having reoriented[r1] away from their sins, made atonement to God by their supplication and received salvation, though they were strangers to God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'made atonement before God'.
    reason: previous_rendering
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
