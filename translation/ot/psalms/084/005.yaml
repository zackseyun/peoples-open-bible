id: PSA.84.5
reference: Psalms 84:5
source:
  edition: WLC
  text: אַשְׁרֵ֣י אָ֭דָם עֽוֹז ל֥/וֹ בָ֑/ךְ מְ֝סִלּ֗וֹת בִּ/לְבָבָֽ/ם־׃
translation:
  text: Blessed are those whose strength is in you, who carry the pilgrim roads in their hearts[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “highways are in their hearts.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  chosen: Blessed is
  alternatives:
  - Happy is
  - Blessed are
  lexicon: HALOT
  rationale: The plural form functions idiomatically in beatitude style. English singular 'Blessed is' fits the following singular noun 'man' and preserves the elevated, wisdom-like tone better than 'happy.'
- source_word: אָדָם
  chosen: those
  alternatives:
  - the person
  - humankind
  lexicon: HALOT
  rationale: The singular noun is generic and collective in this beatitude; a collective English subject is natural in conjunction with the following plural suffix.
- source_word: עֹז
  chosen: strength
  alternatives:
  - might
  - stronghold
  lexicon: HALOT
  rationale: In this context the noun denotes empowering strength derived from God, not primarily a fortress. 'Strength' is the most natural and contextually fitting English equivalent.
- source_word: לוֹ
  chosen: whose
  alternatives:
  - to him
  - for him
  lexicon: Hebrew grammar
  rationale: 'The preposition plus pronoun literally means ''to him,'' but in English the clause is best rendered relatively: ''whose strength is in you,'' expressing possession and relation smoothly without loss of sense.'
- source_word: בָךְ
  chosen: in you
  alternatives:
  - from you
  - through you
  lexicon: HALOT
  rationale: 'The preposition ב retains its basic locative/metaphorical force here: the man''s strength is found in God. ''In you'' preserves the covenantal and devotional sense better than more interpretive expansions.'
- source_word: מְסִלּוֹת
  chosen: the highways
  alternatives:
  - roads
  - pilgrim ways
  - highways to Zion
  lexicon: HALOT
  rationale: The noun commonly denotes raised roads or highways. Because 'to Zion' is not explicit in this verse, it should not be imported into the main text, though the pilgrimage sense is likely from context and may be noted in a footnote.
- source_word: בִּלְבָבָם
  chosen: in whose hearts
  alternatives:
  - are in their heart
  - in their hearts are
  lexicon: HALOT
  rationale: The Hebrew suffix is third-person plural, and the revised English preserves that number.
