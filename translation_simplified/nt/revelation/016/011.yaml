translation:
  language: en
  text: Because of their pain and sores, they blasphemed the God of heaven—they spoke evil against him. But they did not reorient[a] away from what they had done.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And they blasphemed the God of heaven because of their pains and their sores
  simplified_phrase: Because of their pain and sores, they blasphemed the God of heaven—they spoke evil against him.
  preserved_meaning: Their suffering caused them to respond by speaking irreverently against God.
  reasoning_layer_used: Lexical decisions for ἐβλασφήμησαν, πόνος, and ἕλκος, with the theological decision on causal ἐκ.
  rationale: Fronting the cause and defining “blasphemed” makes the response clear while preserving the biblical title.
interpretive_expansions:
- pob_phrase: blasphemed
  rendering: blasphemed ...—they spoke evil against him
  claim: The added phrase explains blasphemy as hostile, irreverent speech directed against God.
  evidence:
  - The lexical audit lists “spoke evil of” as an alternative for ἐβλασφήμησαν.
  - The POB rationale identifies slanderous or irreverent speech against God.
  confidence: high
  alternatives_preserved:
  - reviled him
