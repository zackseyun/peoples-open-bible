  text: Wash me thoroughly[c] from my iniquity[b], and cleanse me from my sin[a].
  footnotes:
  - marker: a
    text: Or 'Have mercy on me, O God.' The Hebrew verb can be rendered with mercy language, but the main text keeps it distinct from the later terms for steadfast love and mercies.
