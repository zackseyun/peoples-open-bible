source:
  edition: WLC
  text: הָ֤/אֵ֣ל לָ/נוּ֮ אֵ֤ל לְֽ/מוֹשָׁ֫ע֥וֹת וְ/לֵ/יהוִ֥ה אֲדֹנָ֑/י לַ֝/מָּ֗וֶת תּוֹצָאֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/020.yaml
  text: God is for us a God of deliverances, and to Yahweh the Lord belong ways out from death.[a]
  footnotes:
  - marker: a
    text: Literally “goings out from death”; the phrase refers to ways of escape from death.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 우리에게 구원의 하나님이시며, 죽음에서 벗어날 길들은 주 여호와께 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’에 해당하는 히브리어는 복수형이며, 거듭되거나 다양한 구원의 행위를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘죽음에 대한 나감들’ 또는 ‘출구들’입니다. 문맥상 죽음에서 벗어나는 길들, 곧 죽음으로부터의 구출을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ / אֲדֹנָי
  english_pob_choice: Blessed be the Lord
  chosen_korean: 주님은 송축받으소서
  alternatives_korean:
  - 주님은 복되십니다
  - 주님을 찬송합니다
  lexicon: BDB/HALOT
  rationale: פעל형 축복 공식이므로 단순 서술보다 축복 선포형으로 옮겼습니다. 합쇼체 시편 문맥에서는 ‘송축받으소서’가 원문의 수동적 축복 의미를 가장 직접적으로 드러냅니다.
- source_word: יוֹם י֥וֹם
  english_pob_choice: day by day
  chosen_korean: 날마다
  alternatives_korean:
  - 매일
  - 날마다마다
  lexicon: HALOT
  rationale: 반복을 가진 분배적 표현이므로 한국어에서는 자연스러운 ‘날마다’로 옮기되, 의미는 ‘매일’보다 더 분배적으로 유지했습니다.
- source_word: יַֽעֲמָס לָ֗/נוּ
  english_pob_choice: who day by day bears us up
  chosen_korean: 우리를 지탱하십니다
  alternatives_korean:
  - 우리의 짐을 지십니다
  - 우리를 업어 가십니다
  - 우리에게 짐을 지워 주십니다
  lexicon: HALOT
  rationale: עמס는 ‘짐을 지다/나르다’의 뜻이지만 목적어가 생략되어 있어 직역하면 한국어에서 어색해집니다. POB의 보수적 독해에 따라 지속적 보호·지탱의 이미지를 살려 ‘지탱하십니다’로 옮겼습니다.
- source_word: הָאֵל יְשׁוּעָתֵנוּ
  english_pob_choice: God is our salvation
  chosen_korean: 하나님은 우리의 구원이십니다
  alternatives_korean:
  - 하나님은 우리의 구출이십니다
  - 하나님은 우리의 구원자이십니다
  lexicon: HALOT
  rationale: 명사구를 상태문으로 자연스럽게 풀어 ‘우리의 구원이십니다’로 옮겼습니다. ‘구원자’는 주어를 한 번 더 설명하는 느낌이 있어 원문보다 해석이 더 들어갑니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - (묵상)
  - (간주)
  lexicon: HALOT
  rationale: 의미가 확정되지 않은 표지이므로 음역을 유지했습니다.
theological_decisions:
- issue: יַעֲמָס לָנוּ의 의미가 ‘짐을 짐’인지 ‘우리를 들어 올림’인지
  chosen_reading: 하나님이 날마다 자기 백성을 지속적으로 붙들고 지탱하시는 분이라는 뜻으로 읽었습니다.
  alternative_readings:
  - 하나님이 날마다 우리에게 짐을 지워 주신다는 뜻
  - 하나님이 날마다 우리를 업어 가신다는 뜻
  rationale: 히브리어 동사는 ‘짐을 싣다/지다’의 물리적 이미지를 가지지만, 목적어가 분명하지 않아 문맥상 보호와 공급의 지속성을 표현하는 쪽이 더 적절합니다. POB의 ‘bears us up’ 취지를 따라 과도한 해석을 피하면서도 시의 이미지를 살렸습니다.
  doctrine_reference: 시편 68편의 찬양 문맥과 하나님의 지속적 섭리
- issue: 첫 절의 축복 공식을 한국어에서 어떻게 살릴지
  chosen_reading: 하나님께 대한 직접 축복 선언으로 읽고 ‘송축받으소서’를 사용했습니다.
  alternative_readings:
  - 주님을 찬송합니다
  - 주님은 복되십니다
  rationale: 원문은 단순 감정표현이 아니라 공동체가 하나님께 드리는 축복 선포입니다. 한국어 합쇼체에서는 ‘송축받으소서’가 이 예배적 기능을 가장 분명하게 드러냅니다.
  doctrine_reference: 시편의 예배 언어와 축복 선언
