    text: 또는 ‘숯불이 그들 위에 비처럼 내리게 하시고.’ 히브리어 동사는 무엇인가를 떨어지게 하거나 비처럼 쏟아지게 한다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘심연들’ 또는 ‘물 깊은 곳들.’ 히브리어 낱말은 드물게 쓰이며 정확한 뉘앙스가 확실하지 않습니다.
