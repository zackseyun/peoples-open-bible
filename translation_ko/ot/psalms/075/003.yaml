  lexicon: HALOT
  rationale: 여기서 כִּי는 앞선 진술의 근거를 잇는 접속사이지만, 한국어에서는 바로 이어지는 시간절로 자연스럽게 풀어 주는 편이 더 본문 흐름을 살립니다.
- source_word: אֶקַּח מוֹעֵד
  english_pob_choice: I choose the appointed time
  chosen_korean: 내가 정한 때
  alternatives_korean:
  - 내가 택한 정해진 때
  - 내가 appointed time을 취할 때
  - 내가 정해진 시간을 선택할 때
  lexicon: HALOT
  rationale: אֶקַּח의 문자적 '취하다'를 그대로 옮기면 어색하므로, POB의 해석처럼 '정한/정해진 때'를 '정하다'로 옮겨 시간 선택의 관용적 의미를 드러냈습니다.
- source_word: מֵישָׁרִים
  english_pob_choice: with uprightness
  chosen_korean: 올바름으로
  alternatives_korean:
  - 공의로
  - 의롭게
  - 공평하게
  lexicon: HALOT
  rationale: מֵישָׁרִים은 직선성·정직함·공평함의 뉘앙스를 가지므로, 한국어에서는 도덕적·재판적 색채를 함께 살리는 '올바름'이 가장 무리 없습니다.
- source_word: אֶשְׁפֹּט
  english_pob_choice: will judge
  chosen_korean: 심판하겠습니다
  alternatives_korean:
  - 판단하겠습니다
  - 판결하겠습니다
  - 재판하겠습니다
  lexicon: HALOT
  rationale: 하나님의 선언으로서 משפט의 재판적 강도를 살리기 위해 '심판하다'를 택했습니다. 단순한 판단보다 본문의 권위와 법정적 함의를 더 분명히 드러냅니다.
theological_decisions:
- issue: 하나님의 주체적 시기 결정과 심판 선언
  chosen_reading: 시기를 정하는 주체와 심판자가 분명히 하나님이시라는 점을 한국어에서도 직접적으로 드러냈습니다.
  alternative_readings:
  - 보다 중립적으로 '내가 때를 택하면'이라고만 옮기는 방식
  - 심판의 강도를 약화시켜 '판단하겠습니다'로 옮기는 방식
  rationale: 시편의 맥락에서 화자는 단순한 인간이 아니라 주권적으로 때를 정하고 심판하시는 분이므로, 본문의 신학적 긴장을 보존하려면 주체성과 재판적 권위를 약화시키지 않아야 합니다.
  doctrine_reference: 하나님의 주권과 의로운 심판
