source:
  edition: WLC
  text: הוֹשִׁ֣יעָ/ה יְ֭הוָה כִּי גָמַ֣ר חָסִ֑יד כִּי פַ֥סּוּ אֱ֝מוּנִ֗ים מִ/בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: Save, O Yahweh, for the godly are gone[a]; for the faithful have vanished from among the sons of man[b].
  footnotes:
  - marker: a
    text: Or “the godly one has come to an end” or “the faithful man is no more.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “from among the sons of man,” an idiom for the human community.
    reason: cultural_note
translation:
  language: ko
  text: 야훼여, 구원하소서. 경건한 이가 없어졌고, 신실한 이들이 사람들 가운데서 사라졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악감독에게
  - 회중찬양 인도자에게
  - 지도자에게
  lexicon: HALOT
  rationale: 시편 표제에서 예배·연주를 총괄하는 담당자를 가리키므로, 한국어에서는 기능을 드러내는 간결한 ‘지휘자’로 옮겼습니다.
- source_word: עַל הַשְּׁמִינִית
  english_pob_choice: according to The Eighth
  chosen_korean: 「여덟째」에 따라
  alternatives_korean:
  - 쉐미니트에 따라
  - 여덟째 곡조에 따라
  - 여덟째에 맞춰
  lexicon: HALOT
  rationale: 히브리어는 정확한 대상을 단정하기 어려운 음악·예식 표지이므로, 의미를 풀어쓴 ‘여덟째’와 ‘에 따라’를 사용해 표제의 기능적 의미를 살렸습니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시입니다
  alternatives_korean:
  - 시편입니다
  - 노래입니다
  - 찬가입니다
  lexicon: HALOT
  rationale: 장르 표지로서의 מִזְמוֹר는 표준적인 ‘시’가 가장 자연스럽고, 문장형 표제로 정리하기 위해 ‘입니다’를 덧붙였습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗을 위한
  - 다윗에 관한
  lexicon: HALOT
  rationale: לְדָוִד는 저자·헌정·소속을 모두 열어 두는 표현이므로, 한국어에서도 관계를 특정하지 않는 ‘다윗의’로 두어 원문의 유보성을 보존했습니다.
theological_decisions:
- issue: 시편 표제의 לְדָוִד 관계를 단정할지 여부
  chosen_reading: 다윗의
  alternative_readings:
  - 다윗이 지은
  - 다윗을 위한
  rationale: 이 표지는 저작, 헌정, 소속을 모두 가능하게 하므로, 본문이 허용하는 범위 안에서만 읽도록 관계를 열어 두었습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
