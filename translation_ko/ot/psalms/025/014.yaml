  - 그분의 언약을 그들에게 알게 하십니다
  rationale: 히브리어 병렬과 영어 POB의 수정 이력은 ‘그의 언약’이 주체처럼 문장에 남아 있음을 보여 주므로, 이를 삭제하지 않고 의도된 긴장을 살려 번역했습니다.
  doctrine_reference: syntactic-theological tension preservation
