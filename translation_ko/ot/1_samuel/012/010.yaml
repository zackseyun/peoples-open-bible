id: 1SA.12.10
reference: 1 Samuel 12:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ אֶל יְהוָה֙ ו/יאמר חָטָ֔אנוּ כִּ֤י עָזַ֨בְנוּ֙ אֶת יְהוָ֔ה וַ/נַּעֲבֹ֥ד אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּר֑וֹת וְ/עַתָּ֗ה הַצִּילֵ֛/נוּ מִ/יַּ֥ד אֹיְבֵ֖י/נוּ וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: ko
  text: 그들이 여호와께 부르짖으며 말했습니다. “우리가 죄를 지었습니다. 이는 우리가 여호와를 버리고 바알들과 아스다롯을 섬겼기 때문입니다. 이제 우리를 원수들의 손에서 구원해 주십시오. 우리가 여호와를 섬기겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/יִּזְעֲק֤וּ אֶל יְהוָה֙
  english_pob_choice: Then they cried out to the LORD
  chosen_korean: 그들이 야훼께 부르짖으며
  alternatives_korean:
  - 그들이 야훼께 외치며
  - 그들이 주께 부르짖으며
  lexicon: יְהוָה → 야훼
  rationale: 히브리어의 언약명칭을 본문에서 직접 살려, 단순한 ‘주’보다 원문 신호를 더 분명히 드러냈습니다.
- source_word: חָטָ֔אנוּ כִּ֤י
  english_pob_choice: We have sinned, because
  chosen_korean: 우리가 죄를 지었습니다. 이는
  alternatives_korean:
  - 우리가 죄를 지었습니다. 왜냐하면
  - 우리가 죄를 지었습니다.
  lexicon: כִּי → 이는/왜냐하면
  rationale: POB의 ‘because’를 한국어에서 자연스럽게 받되, 이유절의 인과를 분명히 하기 위해 ‘이는’으로 옮겼습니다.
- source_word: וַ/נַּעֲבֹ֥ד אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּר֑וֹת
  english_pob_choice: and have served the Baals and the Ashtaroths
  chosen_korean: 바알들과 아스다롯을 섬겼기 때문입니다
  alternatives_korean:
  - 바알들과 아스다롯을 섬겼기 때문입니다
  - 바알들과 아쉬토렛들을 섬겼기 때문입니다
  lexicon: בְּעָלִים / עַשְׁתָּרֹות → 바알들 / 아스다롯
  rationale: 복수형의 우상 집합을 반영해 ‘바알들’을 유지하고, 한국어 성경에서 널리 통용되는 ‘아스다롯’을 채택했습니다.
- source_word: וְ/נַעַבְדֶֽ/ךָּ
  english_pob_choice: and we will serve you
  chosen_korean: 그러면 우리가 주님을 섬기겠습니다
  alternatives_korean:
  - 그러면 우리가 당신을 섬기겠습니다
  - 그러면 우리가 주를 섬기겠습니다
  lexicon: עבד + 2ms suffix → 섬기겠습니다
  rationale: 청원문의 응답으로서 존대형 미래 의지를 살리기 위해 ‘섬기겠습니다’로 옮겼고, 대상은 한국어 기독교 용례에 맞게 ‘주님’으로 표현했습니다.
theological_decisions:
- issue: YHWH 표기와 화자-대상 구분
  chosen_reading: 서술과 인용 모두에서 יְהוָה는 ‘야훼’로 두고, 마지막 청원 대상만 ‘주님’으로 번역했습니다.
  alternative_readings:
  - 전 구간을 ‘주’로 통일
  - 전 구간을 ‘야훼’로 통일
  rationale: 원문에서 동일한 신명호칭이 반복되므로 본문 차원에서는 일관되게 드러내되, 인용 말미의 직접 청원은 한국어 공손 관습상 ‘주님’이 자연스럽습니다.
  doctrine_reference: 성경 본문 명칭 일관성 및 한국어 경어 관례
- issue: 회개 진술의 인과 관계
  chosen_reading: ‘죄를 지었습니다. 이는…’로 두 문장으로 나누어 인과를 선명하게 표현했습니다.
  alternative_readings:
  - 한 문장으로 길게 연결
  - ‘죄를 지었습니다. 왜냐하면…’
  rationale: 히브리어 כִּי의 이유 기능을 살리면서도 한국어에서 고백과 근거가 구분되도록 해석했습니다.
  doctrine_reference: 본문 인과 구조
