simplification_decisions:
- pob_phrase: For our citizenship is in heaven, from where
  simplified_phrase: For our citizenship is in heaven. From there
  preserved_meaning: Heaven remains both the believers’ true civic realm and the place from which the Savior comes.
  reasoning_layer_used: POB lexical decisions for πολίτευμα and ἐξ οὗ
  rationale: Two sentences make the relationship clear without the awkward relative clause.
- pob_phrase: we also eagerly await
  simplified_phrase: we also eagerly wait for
  preserved_meaning: The wording retains both the added connection marked by “also” and the sustained expectancy of the Greek verb.
  reasoning_layer_used: POB lexical decision for ἀπεκδεχόμεθα and grounding review
  rationale: “Eagerly wait for” is more common English than “eagerly await.”
- pob_phrase: the Lord Jesus the Messiah
  simplified_phrase: the Lord Jesus, the Messiah
  preserved_meaning: “Messiah” remains the governing rendering of Χριστός as Jesus’ title.
  reasoning_layer_used: POB theological decision and article-restoration revision
  rationale: The comma presents “the Messiah” naturally as a title describing Jesus.
