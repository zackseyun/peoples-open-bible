id: LJE.1.26
reference: Letter of Jeremiah 1:26
source:
  edition: lxx-swete-1909
  text: διὰ τό, μή ποτε ἐπὶ τὴν γῆν πέσῃ, δι' αὐτῶν ἀνίστασθαι· μήτε ἐὰν τις αὐτὸ ὀρθὸν στήσῃ, δι' ἑαυτοῦ κινηθήσεται, μήτε ἐὰν κλιθῇ, οὐ μὴ ὀρθωθῇ, ἀλλ' ὥσπερ νεκροῖς τὰ δῶρα αὐτοῖς παρατίθεται.
  language: Greek
