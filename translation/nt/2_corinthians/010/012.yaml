    rationale: The verb concerns including oneself in a class of people, not classifying oneself in the abstract.
  - source_phrase: ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς
    prior_rendering: they measure themselves by themselves and compare themselves with themselves
    new_rendering: they use themselves as their own measure and compare themselves only with one another
