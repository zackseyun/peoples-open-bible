translation:
  language: ko
  text: 나의 원수들에게서 나를 건져 주소서, 나의 하나님이시여. 나를 치고 일어나는 자들에게서 나를 높은 곳에 두소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 합창 지휘자에게
  - 음악 감독에게
  lexicon: HALOT
  rationale: 시편 표제 공식으로서 음악 책임자를 가리키므로, 기능을 살린 현대어인 ‘지휘자’로 옮겼습니다.
- source_word: אַל־תַּשְׁחֵת
  english_pob_choice: Do Not Destroy
  chosen_korean: ‘지워 버리지 마소서.’
  alternatives_korean:
  - ‘파괴하지 마소서.’
  - ‘없애지 마소서.’
  lexicon: HALOT
  rationale: 본문의 금지형을 자연스러운 한국어로 살리되, 표제에 붙은 곡명/표어일 수 있어 따옴표로 구분했습니다.
- source_word: מִכְתָּם
  english_pob_choice: miktam
  chosen_korean: 믹담
  alternatives_korean:
  - 각자
  - 금시
  - 표제어
  lexicon: HALOT
  rationale: 의미가 불확실하므로 번역어를 단정하지 않고 음역으로 투명하게 처리했습니다.
- source_word: בִּשְׁלֹחַ שָׁאוּל
  english_pob_choice: when Saul sent men
  chosen_korean: 사울이 보낸 때에
  alternatives_korean:
  - 사울이 보냈을 때
  - 사울이 사람들을 보냈을 때
  lexicon: HALOT
  rationale: 히브리어의 시간 부사적 용법을 살려 ‘~할 때에’로 옮겼고, 영어 POB가 암시한 ‘men’은 히브리어에 명시되지 않으므로 본문에서는 덧붙이지 않았습니다.
- source_word: וַיִּשְׁמְרוּ אֶת הַבַּיִת
  english_pob_choice: and they watched the house
  chosen_korean: 그들이 집을 지켜
  alternatives_korean:
  - 그들이 집을 감시하여
  - 그들이 집을 지키고
  lexicon: HALOT
  rationale: שׁמר는 여기서 보호보다 감시·감시하라는 뜻이 강하므로, 한국어도 그 뉘앙스를 담아 ‘지켜’로 옮겼습니다.
- source_word: לַהֲמִיתוֹ
  english_pob_choice: to kill him
  chosen_korean: 그를 죽이려 하였습니다
  alternatives_korean:
  - 그를 죽이기 위해서였습니다
  - 그를 죽이려 했습니다
  lexicon: HALOT
  rationale: 목적 부정사를 한국어 목적·의도 표현으로 자연스럽게 풀어, 계획된 살해 의도를 분명히 했습니다.
theological_decisions:
- issue: 표제의 명령형 ‘אַל־תַּשְׁחֵת’가 본문 내 직접 명령인지, 곡명/표어인지
  chosen_reading: 시편 표제의 음악적 표어 또는 곡명으로 처리하고, 본문 명령으로 읽히지 않도록 따옴표와 표제 배치를 유지했습니다.
  alternative_readings:
  - 시편 본문의 직접적인 금지 명령으로 읽는 해석
  - 단순한 장르 표지로만 처리하는 해석
  rationale: 영어 POB의 주석처럼 이 표현은 곡명일 가능성이 높아, 본문 내용과 구분해 오독을 막는 편이 원문 기능에 더 충실합니다.
  doctrine_reference: 시편 표제의 장르·음악 표지 이해
- issue: ‘보낸’의 대상인 agents를 본문에 명시할지 여부
  chosen_reading: 히브리어에 없는 ‘사람들’을 본문에 넣지 않고, 동사와 문맥이 암시하는 주체로만 남겼습니다.
  alternative_readings:
  - ‘사울이 사람들을 보냈을 때’로 보충 번역
  - ‘사울이 보낸 자들이’로 해석
  rationale: 영어 POB 주석은 ‘men’이 암시된 것이라고 설명하지만, 원문 자체는 명시하지 않으므로 한국어 본문은 원문의 절제성을 유지하는 것이 적절합니다.
  doctrine_reference: 원문 명시성과 암시의 구분
