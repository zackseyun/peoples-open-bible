translation:
  language: en
  text: 'Therefore, brothers and sisters, we have a great opportunity to reorient[r1]. While there is still time, let us return to God who called us, while he still receives us.


    If we turn away from these pleasures and master our own desires by refusing to satisfy their evil cravings, we will share in Jesus’ mercy.


    But you know that the day of judgment is already coming like a blazing furnace. The powers of heaven will melt, and the whole earth will melt like lead in a fire. Then everything people have done, whether secret or public, will be revealed.


    Therefore, giving to the poor is good, just as turning away from sin is good. Fasting is better than prayer, and giving to the poor is better than both. Love covers many sins, while prayer offered with a clear conscience rescues from death. Blessed is everyone whose life is full of these things, for giving to the poor lifts away the burden of sin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
