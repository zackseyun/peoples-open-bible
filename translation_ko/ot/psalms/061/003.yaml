id: PSA.61.3
reference: Psalms 61:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הָיִ֣יתָ מַחְסֶ֣ה לִ֑/י מִגְדַּל עֹ֝֗ז מִ/פְּנֵ֥י אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/003.yaml
  text: For you have been a refuge for me, a strong tower against the enemy.
translation:
  language: ko
  text: 주께서는 제게 피난처가 되셨고, 원수에게서 지켜 주는 견고한 망대가 되셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְצֵה הָאָרֶץ
  english_pob_choice: From the end of the earth
  chosen_korean: 땅 끝에서
  alternatives_korean:
  - 세상 끝에서
  - 땅의 끝에서
  - 세상 끝자락에서
  lexicon: HALOT
  rationale: קצה의 극단성과 दूरी감을 살리기 위해 간결한 「땅 끝」을 택했습니다. 시적 문맥에서 ‘땅’은 자연스러운 대응이며, 과도한 해설을 덧붙이지 않았습니다.
- source_word: אֵלֶיךָ אֶקְרָא
  english_pob_choice: I call to you
  chosen_korean: 당신께 부르짖습니다
  alternatives_korean:
  - 당신께 부릅니다
  - 당신께 외칩니다
  lexicon: HALOT
  rationale: קרא는 단순 ‘부르다’보다 간절한 호소를 포함할 수 있어, 시편의 기도 맥락을 살려 ‘부르짖습니다’로 옮겼습니다. 하나님께 직접 말하는 2인칭을 합쇼체로 유지했습니다.
- source_word: בַּעֲטֹף לִבִּי
  english_pob_choice: when my heart grows faint
  chosen_korean: 내 마음이 기운이 다할 때에
  alternatives_korean:
  - 내 마음이 기운을 잃을 때에
  - 내 마음이 지칠 때에
  - 내 마음이 압도될 때에
  lexicon: HALOT
  rationale: עטף는 ‘압도되다’도 가능하지만, 여기서는 내적 힘이 꺾이는 상태를 더 직접적으로 드러내는 ‘기운이 다하다’를 선택했습니다. 영어 POB의 ‘grows faint’와도 잘 맞습니다.
- source_word: בְּצוּר יָרוּם מִמֶּנִּי
  english_pob_choice: lead me to a rock higher than I
  chosen_korean: 나보다 높은 바위로
  alternatives_korean:
  - 나보다 너무 높은 바위로
  - 나보다 더 높은 바위로
  - 내가 닿을 수 없는 바위로
  lexicon: HALOT
  rationale: צוּר의 구체적 이미지를 살려 ‘바위’로 옮겼고, יָרוּם מִמֶּנִּי의 비교 구조를 그대로 반영해 ‘나보다 높은’으로 번역했습니다. ‘too high for me’의 해석을 본문에 넣지 않고 여지를 남겼습니다.
- source_word: תַנְחֵנִי
  english_pob_choice: lead me
  chosen_korean: 저를 인도해 주십시오
  alternatives_korean:
  - 저를 이끌어 주십시오
  - 저를 인도하십시오
  lexicon: HALOT
  rationale: נחה의 Hiphil은 ‘인도하다/이끌다’의 뜻이므로, 기도체에 자연스러운 「인도해 주십시오」를 택했습니다.
theological_decisions:
- issue: ‘바위’의 신학적 이미지
  chosen_reading: 본문의 구체적 은유를 유지해, 안전한 피난처라는 의미를 직접 풀어 쓰지 않았습니다.
  alternative_readings:
  - 저를 안전한 피난처로 인도해 주십시오
  - 저를 피난처로 데려가 주십시오
  rationale: 히브리어는 추상적 설명보다 ‘바위’라는 이미지 자체를 사용합니다. 시적 긴장과 하나님을 피난처로 경험하는 신학적 여운을 보존하기 위해 은유를 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 시적 은유 보존
- issue: 기도문의 높임말
  chosen_reading: 하나님께 드리는 직접 호소로 보고 합쇼체를 사용하되, 청유·명령 기능은 ‘-십시오’로 표현했습니다.
  alternative_readings:
  - 더 평이한 반말형 감탄체
  - 전면적 경어 완화
  rationale: 시편의 기도문은 하나님께 대한 직접 호소이므로 현대 한국어에서 가장 자연스럽고 공손한 기도체를 유지하는 것이 적절합니다.
  doctrine_reference: 한국어 문체 규범; 예배용 번역 스타일
