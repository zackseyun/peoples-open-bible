  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Sense of עֶלְיוֹן in a judgment context
  chosen_reading: understood contextually as desolation/ruin rather than literal 'high/exalted'
  alternative_readings:
  - high
  - exalted
  rationale: A literal rendering creates a sense that conflicts with the surrounding curse context. The broader canonical parallel and ancient versions have led many translators to understand the line as describing the temple's ruin. The textual-literary tension is preserved in a footnote rather than flattened silently.
