  source_fidelity: 히브리어의 명령 연쇄와 아로엘 거주자에 대한 호칭, 그리고 달아나는 남성과 피신하는 여성에게 사건을 묻는 구조는 대체로 반영되었습니다. 그러나 초안의 ‘달아나는 남자와 도망치는 여자를 물으십시오’는 한국어에서 사람을 직접 목적어로 하여 ‘묻다’를 쓰는 비문에 가깝고, 인용문이 질문의 내용으로 문법적으로 연결되지 않습니다.
