theological_decisions:
- issue: 'Typological framing: εἰς τύπον τῆς θλίψεως'
  chosen_reading: Render as 'as a pattern of the tribulation'
  alternative_readings:
  - as a type of the tribulation
  - as a symbol of the tribulation
  rationale: Hermas announces the vision as a prefigurative sketch. 'Pattern' communicates typology without
    requiring the reader to know the technical term; 'type' is preserved in a footnote.
- issue: δοῦλοι τοῦ Θεοῦ—'servants' or 'slaves'
  chosen_reading: '''servants'''
  alternative_readings:
  - slaves
  - bondservants
  rationale: Servants follows the consistent current reader-facing policy. Slaves and bondservants retain
    possible bonded-status, belonging and allegiance nuances in alternatives; pastoral intercession does
    not establish an exclusively honorific sense or exclude ownership.
  doctrine_reference: 'DOCTRINE.md: consistent reader-facing servant terminology'
- issue: Genitive in τὴν πίστιν τοῦ Κυρίου
  chosen_reading: Retain the faith of the Lord, leaving the genitive open in the main text.
  alternative_readings:
  - 'Objective: faith in the Lord'
  - 'Subjective: the Lord’s faith or faithfulness'
  rationale: Reconcile the stale objective-only metadata with the earlier revised main text; no new theological
    resolution of the genitive.
  doctrine_reference: Translation philosophy §Preserve theological tension (genitives)
- issue: Ἐκκλησία as visionary mediator
  chosen_reading: Capitalize 'Church' and retain 'holy'
  alternative_readings:
  - assembly
  - congregation
  rationale: In Hermas the Church appears as a personified figure who mediates revelation; 'Church' preserves
    this identity and ecclesial texture.
  doctrine_reference: 'What matters most #3, #4'
- issue: διψυχέω as spiritual vice
  chosen_reading: '''be double‑minded'''
  alternative_readings:
  - doubt
  - waver
  rationale: Hermas develops a vocabulary of interior duplicity vs. simplicity. 'Double‑minded' keeps
    this ethical category clear.
  doctrine_reference: 'What matters most #2'
- issue: Contextual repentance reassessment
  chosen_reading: Exact reader wording is recorded in config/terminology/repentance-contextual-2026-10-13.json#translation/extra_canonical/shepherd_of_hermas/022.yaml
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
