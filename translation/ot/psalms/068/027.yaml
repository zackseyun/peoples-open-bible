id: PSA.68.27
reference: Psalms 68:27
source:
  edition: WLC
  text: שָׁ֤ם בִּנְיָמִ֨ן צָעִ֡יר רֹדֵ֗/ם שָׂרֵ֣י יְ֭הוּדָה רִגְמָתָ֑/ם שָׂרֵ֥י זְ֝בֻל֗וּן שָׂרֵ֥י נַפְתָּלִֽי׀׃
translation:
  text: There is little Benjamin, in command; the princes of Judah with their throng[a]; the princes of Zebulun; the princes of Naphtali.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew word rendered “throng” is rare and uncertain; it may mean “company” or “multitude.”
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  chosen: There is
  alternatives:
  - there
  lexicon: HALOT
  rationale: Locative/deictic adverb meaning 'there.' In English poetic listing, 'There is' naturally introduces the tribes present in procession and avoids a fragment while preserving the demonstrative force.
- source_word: בִּנְיָמִן
  chosen: Benjamin
  lexicon: HALOT
  rationale: Proper tribal/personal name, transliterated according to standard English convention.
- source_word: צָעִיר
  chosen: little
  alternatives:
  - young
  - smallest
  lexicon: HALOT
  rationale: Adjective meaning 'small, little, young.' Here it likely highlights Benjamin's smallness/status among the tribes rather than age, so 'little' best preserves the compact poetic force and traditional tribal sense.
- source_word: רֹדֵם
  chosen: ruling them
  alternatives:
  - ruling them
  - having dominion over them
  - leading the procession
  lexicon: HALOT
  rationale: Retains the ordinary dominion force of the participle.
- source_word: שָׂרֵי
  chosen: princes
  alternatives:
  - leaders
  - chiefs
  lexicon: HALOT
  rationale: Construct plural of שַׂר, denoting officials, rulers, or princes. 'Princes' preserves the elevated poetic register and social rank better than the flatter 'leaders.'
- source_word: יְהוּדָה
  chosen: Judah
  lexicon: HALOT
  rationale: Proper tribal name, transliterated conventionally.
- source_word: רִגְמָתָם
  chosen: with their throng
  alternatives:
  - their company
  - their multitude
  - their crowd
  lexicon: HALOT
  rationale: Makes the terse relation natural in English while preserving lexical uncertainty in a note.
- source_word: זְבֻלֻון
  chosen: Zebulun
  lexicon: HALOT
  rationale: Proper tribal name, transliterated conventionally.
- source_word: נַפְתָּלִי
  chosen: Naphtali
  lexicon: HALOT
  rationale: Proper tribal name, transliterated conventionally.
