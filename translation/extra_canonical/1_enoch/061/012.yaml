translation:
  text: All who do not sleep in the height of heaven will bless him. All the holy ones in heaven will bless him,
    and all the chosen who dwell in the garden of life. Every spirit of light that can bless, praise, exalt and
    sanctify your blessed name, and all flesh, beyond its strength, will praise and bless your name for ever and
    ever.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source distinguishes those who do not sleep, the holy ones, the chosen in the garden of life and every
      spirit of light. The relative light-spirit phrase is a capacity expression, can, not a new negative. The bracketed
      relative before beyond-its-strength is kept in the source. The shift from him to your blessed name is retained
      rather than normalized throughout to third person.
    reason: textual_variant
