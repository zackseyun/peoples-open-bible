  to: 그가 그에게 말했습니다. “그대가 야훼의 음성에 귀를 기울이지 않았으므로, 보십시오. 그대가 내게서 떠나가면 사자가 그대를 칠 것입니다.” 그가 그에게서 떠나가자 사자가 그를 찾아내어 그를 쳤습니다.
