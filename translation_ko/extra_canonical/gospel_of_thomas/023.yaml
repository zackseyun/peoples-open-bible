  source_fidelity: 원문에는 예수께서 말씀하셨다는 도입 뒤에 “내가 너희를 선택하겠다, 천 명 가운데 하나와 만 명 가운데 둘을”이라는 선택 표현과, 2인칭에서 3인칭으로 바뀌는 “그들은 서 있을 것이며, 하나 곧 단 하나일 것이다”라는 절이 있습니다. 초안은 인칭 전환을 보존했지만, 첫 절의 수량구가 한국어 문장 안에서 불완전하며, 마지막 절에 원문에 없는 ‘서 있을 것입니다’의 반복을 넣었습니다.
  naturalness: ‘천 명 가운데 하나와 만 명 가운데 둘, 곧 하나뿐인 하나로’는 술어 연결이 불명확합니다. ‘하나뿐인 하나’도 현대 한국어에서는 부자연스럽고 의미를 과도하게 배타적으로 들리게 합니다. ‘하나, 곧 단 하나’는 반복성과 강조를 유지하면서 더 자연스럽습니다.
  terminology: ⲥⲱⲧⲡ는 ‘선택하다’로 적절합니다. ⲟⲩⲁ ⲟⲩⲱⲧ은 해석적으로 ‘통합’ 등의 교리를 본문에 넣지 않고 ‘하나, 곧 단 하나’로 직역적 강조를 유지하는 것이 안전합니다. 방언형 대명사 주석은 ‘리코폴리스 방언형’보다 통상적인 ‘리코폴리탄(리코폴리스) 방언형’으로 다듬을 수 있습니다.
