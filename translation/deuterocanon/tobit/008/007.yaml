translation:
  text: Now, Lord, I am marrying this sister of mine[a] not out of lust, but with sincere intent. Ordain that I may receive mercy and that we may grow old together[b].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “Sister” is kinship language for his bride, who is also his relative.
    reason: cultural_note
  - marker: b
    text: Or, “Ordain that mercy be shown to me and to her, and that we may grow old together.”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριε
  chosen: Lord
  alternatives:
  - Master
  lexicon: LSJ
  rationale: Direct address to God; 'Lord' matches the project's default rendering for κύριος and fits prayer language naturally.
- source_word: πορνείαν
  chosen: sexual immorality
  alternatives:
  - fornication
  - lust
  lexicon: LSJ
  rationale: The term denotes illicit sexual conduct broadly. 'Sexual immorality' is clear modern English and avoids the narrower or archaic feel of 'fornication.' In context Tobias denies entering the marriage for merely sexual motives.
- source_word: λαμβάνω
  chosen: am taking
  alternatives:
  - am marrying
  - take
  lexicon: LSJ
  rationale: The Greek verb is literally 'take/receive.' In marriage context it can imply taking as wife, but 'am taking' preserves the source wording while remaining intelligible.
- source_word: τὴν ἀδελφήν μου ταύτην
  chosen: this my sister
  alternatives:
  - this sister of mine
  - my kinswoman
  lexicon: LSJ
  rationale: In Tobit, 'sister' reflects kinship language used for a close female relative and prospective wife. Rendering it literally preserves the familial idiom of the source rather than flattening it to 'kinswoman' in the main text.
- source_word: ἐπʼ ἀληθείας
  chosen: in truth
  alternatives:
  - with sincerity
  - truly
  lexicon: LSJ
  rationale: The phrase contrasts with acting from πορνεία. 'In truth' preserves the formal contrast and can carry the sense of sincerity and upright intent.
- source_word: ἐπίταξον
  chosen: Command
  alternatives:
  - ordain
  - grant
  lexicon: LSJ
  rationale: The imperative is literally 'command/order.' 'Grant' would smooth the prayer but weaken the verbal force of the Greek.
- source_word: ἐλεῆσαί
  chosen: under mercy
  alternatives:
  - to have mercy on
  - to show mercy to
  lexicon: LSJ
  rationale: The infinitive depends on 'command' and asks for divine mercy. Because the Greek construction is awkward to reproduce directly with the following infinitive, 'under mercy' keeps mercy explicit while allowing natural English with the next clause.
- source_word: συγκαταγηρᾶσαι
  chosen: may grow old together
  alternatives:
  - may grow old with one another
  - may live to old age together
  lexicon: LSJ
  rationale: The compound verb clearly expresses growing old together. This is the heart of the petition for a long shared life.
