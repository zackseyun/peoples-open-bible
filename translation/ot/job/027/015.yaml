    rationale: The context concerns family members remaining after the sword and hunger of verse 14, not necessarily people who outlive the wicked man himself.
  - source_phrase: בַּמָּוֶת יִקָּבֵרוּ
    prior_rendering: will be buried by death
    new_rendering: The plague will bury
    rationale: The sequence of sword, hunger, and death supports deadly disease as the contextual sense. Active wording preserves the striking personification of the destructive power performing the burial, while the note retains the broader death reading.
  - source_phrase: וְאַלְמְנֹתָיו
    prior_rendering: and his widows
    new_rendering: and the widows of his household
    rationale: The possessive associates these women with the man's household; it need not mean that they were all his own wives.
