  rationale: The Hebrew phrase 'אַל יִחַר בְּעֵינֵי אֲדֹנִי' is an idiom best rendered as 'May it not displease my lord' or 'Let not my lord be angry with me.' The current draft's 'be angry in your sight' is a literalism that combines the translation of 'יִחַר' (be angry) with 'בְּעֵינֵי' (in the eyes/sight of) in a way that is unnatural in English. A more idiomatic rendering like 'angry with me' captures the intended meaning smoothly.
