  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: ko
  text: 사십 년이 끝날 때에 압살롬이 왕에게 말했습니다. “부디 제가 가서 헤브론에서 여호와께 서원한 제 서원을 갚게 해 주십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  english_pob_choice: at the end of forty years
  chosen_korean: 마흔 해가 끝날 무렵에
  alternatives_korean:
  - 마흔 해 끝에
  - 사십 년이 지난 뒤에
  lexicon: מִקֵּץ
  rationale: 시작점보다 ‘끝 무렵’이라는 시간 경과의 뉘앙스를 살려, 단순한 ‘뒤에’보다 원문의 시점 감각을 더 분명하게 옮겼습니다.
- source_word: אֲשַׁלֵּם אֶת נִדְרִי
  english_pob_choice: pay the vow
  chosen_korean: 제 서원을 … 갚게 해 주십시오
  alternatives_korean:
  - 제 서원을 … 이루게 해 주십시오
  - 제 서원을 … 완수하게 해 주십시오
  lexicon: שׁלם / נדר
  rationale: English POB의 ‘pay’에 맞추되, 서원을 ‘갚다’로 옮겨 원문의 의무 이행·상환 감각을 살렸습니다. ‘이루다’는 결과 중심으로 약해질 수 있어 덜 적합합니다.
- source_word: לַיהוָה
  english_pob_choice: the LORD
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: יהוה
  rationale: 본문의 신명사 표지를 한국어로는 통상적 성경 용례에 맞춰 ‘여호와’로 옮겼습니다. 이 절에서는 직접적인 야훼 표기보다 관용적 독해 가능성이 높습니다.
- source_word: נִדְרִי אֲשֶׁר נָדַרְתִּי
  english_pob_choice: the vow that I vowed
  chosen_korean: 제 서원… 제가 서원한
  alternatives_korean:
  - 제가 한 서원… 제가 서원한
  - 제가 맹세한
  lexicon: נדר
  rationale: 동일 어근의 반복을 살려 ‘서원’과 ‘서원한’을 함께 사용해 히브리어의 강조를 반영했습니다.
theological_decisions:
- issue: יהוה를 한국어로 어떻게 표기할지
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 절의 영어 POB가 LORD로 두고 있는 관행과 한국어 교회 독서 환경을 고려해, 본문 가독성을 우선하는 전통 표기를 채택했습니다.
  doctrine_reference: 성경 번역 관례 및 문맥상 신명사 표기
