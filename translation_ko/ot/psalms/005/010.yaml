theological_decisions:
- issue: 시편의 병렬적 신체 비유를 한국어에서 어떻게 유지할지
  chosen_reading: 입-속-목구멍-혀의 순차적 이미지를 그대로 살려, 말의 부패가 내면에서 발화 기관으로 드러난다는 점을 유지했습니다.
  alternative_readings:
  - 의미를 묶어 '말과 마음이 모두 부패했습니다'로 풀기
  - 신체 이미지를 줄이고 도덕적 진술로 평탄화하기
  rationale: 이 절은 부정직한 말의 본질을 신체 비유로 누적시키므로, 이미지를 약화시키지 않는 것이 원문 의미에 더 충실합니다.
  doctrine_reference: Translation philosophy §3, §5
