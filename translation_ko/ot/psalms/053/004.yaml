  text: Do not evildoers[a] know—those who eat up my people[c] as they eat bread[b]? They do not call on God.
  footnotes:
  - marker: a
    text: Literally, “workers of wickedness.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “those who eat my people; they eat bread.” The sense is that they consume the people as readily as ordinary food.
    reason: lexical_alternative
  - marker: c
    text: The phrase “my people” may be heard either as God speaking or as the psalmist speaking; the Hebrew does not identify the speaker explicitly here.
    reason: alternative_reading
translation:
  language: ko
  text: 악을 행하는 자들[a]이 알지 못합니까? 그들은 내[c] 백성을 빵 먹듯이 먹어 치우고[b] 하나님을 부르지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '악인들'. 직역하면 '악을 행하는 자들'입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '내 백성을 먹는 자들, 그들이 빵을 먹는다'입니다. 내 백성을 일상적인 음식을 먹듯이 삼킨다는 비유입니다.
    reason: lexical_alternative
  - marker: c
    text: '''내 백성''의 ''내''는 하나님이 말씀하시는 것으로도, 시편 기자가 자기 백성을 가리키는 것으로도 들릴 수 있습니다. 히브리어 본문은 여기서 화자를 명시하지 않습니다.'
