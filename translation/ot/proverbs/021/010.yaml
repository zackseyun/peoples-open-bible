id: PRO.21.10
reference: Proverbs 21:10
source:
  edition: WLC
  text: נֶ֣פֶשׁ רָ֭שָׁע אִוְּתָה רָ֑ע לֹא יֻחַ֖ן בְּ/עֵינָ֣י/ו רֵעֵֽ/הוּ־־׃
translation:
  text: The soul of a wicked person craves evil; he shows no mercy to his neighbor.
  philosophy: dynamic
lexical_decisions:
- source_word: נֶפֶשׁ
  chosen: soul
  alternatives:
  - inner being
  - appetite
  - self
  lexicon: HALOT
  rationale: נֶפֶשׁ here denotes the inner life or desire-center of the person. 'Soul' preserves the compact Hebrew expression and the anthropological weight of the proverb better than the flatter 'person' or the narrower 'appetite.'
- source_word: רָשָׁע
  chosen: the wicked
  alternatives:
  - a wicked man
  - the wicked person
  lexicon: HALOT
  rationale: The adjective functions substantivally. 'The wicked' is concise and idiomatic in English, preserving the representative singular sense without over-specifying gender.
- source_word: אִוְּתָה
  chosen: craves
  alternatives:
  - craves
  - longs for
  lexicon: HALOT
  rationale: The desire verb varies only for person, number, tense, and natural English syntax; desire and crave preserve the same contextual semantic core.
- source_word: רָע
  chosen: evil
  alternatives:
  - harm
  - what is evil
  lexicon: HALOT
  rationale: In wisdom context רָע commonly carries moral force, not merely misfortune or injury. 'Evil' best reflects the ethical sense of what the wicked person wants.
- source_word: יֻחַן
  chosen: finds no favor
  alternatives:
  - is not shown favor
  - receives no mercy
  - is not treated graciously
  lexicon: HALOT
  rationale: Hophal of חנן conveys being shown favor or grace. Because the subject is the neighbor, 'finds no favor' is idiomatic and preserves the passive sense in natural English.
- source_word: בְּעֵינָיו
  chosen: in his eyes
  alternatives:
  - in his sight
  - to him
  lexicon: HALOT
  rationale: The Hebrew idiom literally means 'in his eyes' and expresses evaluation from the wicked man's perspective. Retaining the idiom preserves the proverb's vividness.
- source_word: רֵעֵהוּ
  chosen: his neighbor
  alternatives:
  - his companion
  - his friend
  - his fellow
  lexicon: HALOT
  rationale: 'רֵעַ can mean friend, companion, or neighbor. ''Neighbor'' best fits the ethical-social sense here: even the person near to him receives no favor.'
- source_word: נֶפֶשׁ רָשָׁע
  chosen: A wicked person
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English for the person as characterized by his desire.
- source_word: לֹא יֻחַן בְּעֵינָיו
  chosen: he shows no favor to
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English rendering of the passive Hebrew favor idiom.
