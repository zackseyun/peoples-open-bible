id: NUM.2.3
reference: Numbers 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/חֹנִים֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה דֶּ֛גֶל מַחֲנֵ֥ה יְהוּדָ֖ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י יְהוּדָ֔ה נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: ko
  text: 동쪽, 곧 해 뜨는 쪽에 진을 칠 이들은 그들의 부대별로 유다 진영의 깃발 아래에 있을 것이며, 유다 자손의 지도자는 암미나답의 아들 나손입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֵדְמָה / מִזְרָחָה
  english_pob_choice: east side, toward the sunrise
  chosen_korean: 동쪽, 곧 해 뜨는 쪽
  alternatives_korean:
  - 동쪽, 해 뜨는 쪽으로
  - 동편, 일출 방향으로
  lexicon: 방위 표현
  rationale: 방향어는 본문이 병렬로 제시하는 두 표현을 모두 살려, ‘동쪽’과 ‘해 뜨는 쪽’으로 자연스럽게 옮겼습니다.
- source_word: דֶּגֶל
  english_pob_choice: banner
  chosen_korean: 깃발
  alternatives_korean:
  - 기
  - 표
  - 군기
  lexicon: 군사·진영 용어
  rationale: POB가 ‘banner’를 택한 것은 진영을 구분하는 표지라는 뜻을 살리기 위한 것이므로, 한국어에서는 가장 직접적인 ‘깃발’로 옮겼습니다.
- source_word: מַחֲנֵה ... לְצִבְאֹתָם
  english_pob_choice: the camp ... by their divisions
  chosen_korean: 진 ... 그 분대별로
  alternatives_korean:
  - 진영 ... 그 부대별로
  - 진영 ... 그 대열별로
  lexicon: 군사 조직 용어
  rationale: ‘camp’는 ‘진’으로, ‘divisions’는 지나치게 현대 군사화하지 않으면서도 분할된 편제를 드러내는 ‘분대’로 옮겼습니다.
- source_word: נָשִׂיא
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 우두머리
  - 족장
  - 통치자
  lexicon: 지도/대표 용어
  rationale: 지파 대표의 직분을 드러내기 위해 ‘leader’를 직역하되, 한국어에서는 자연스럽고 중립적인 ‘지도자’로 처리했습니다.
theological_decisions:
- issue: 이스라엘 진영의 동쪽 배치와 상징성
  chosen_reading: 본문의 핵심은 지파 편성의 질서이며, ‘해 뜨는 쪽’은 문자적 방위 표현으로 유지합니다.
  alternative_readings:
  - 상징적으로 ‘동편’만 강조하는 읽기
  - 예배적·우주론적 상징을 본문에 과도하게 부여하는 읽기
  rationale: 원문은 진영 배치 지시문이므로, 상징을 덧붙이기보다 방위와 편제의 사실성을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 민수기 2장 진영 배치 규정
- issue: ‘아들들’의 집합적 표현
  chosen_reading: ‘בְנֵי יְהוּדָה’는 집합적 혈연 집단으로서 ‘유다 자손’으로 옮깁니다.
  alternative_readings:
  - ‘유다의 아들들’
  - ‘유다 사람들’
  rationale: 한국어에서 ‘자손’은 지파 단위를 자연스럽게 지시하면서도 혈연적·언약적 연속성을 보존합니다.
  doctrine_reference: 이스라엘 지파 명칭 관례
