  text: וַֽ/יְהִי ל֞/וֹ שְׁלֹשִׁ֣ים בָּנִ֗ים רֹֽכְבִים֙ עַל שְׁלֹשִׁ֣ים עֲיָרִ֔ים וּ/שְׁלֹשִׁ֥ים עֲיָרִ֖ים לָ/הֶ֑ם לָ/הֶ֞ם יִקְרְא֣וּ חַוֺּ֣ת יָאִ֗יר עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ הַ/גִּלְעָֽד־־׀׃
translation:
  text: He had thirty sons who rode thirty donkeys[a], and they had thirty towns in Gilead. To this day these towns are called Havvoth-jair[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Donkeys were mounts used by people of rank in this setting.
    reason: cultural_note
  - marker: b
    text: Havvoth-jair means “Jair’s settlements.”
    reason: lexical_alternative
