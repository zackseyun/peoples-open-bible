revisions:
- from: “말하여라. 주 야훼께서 이렇게 말씀하십니다. ‘사람들의 팔목마다 마술 띠를 꿰매고, 키가 각기 다른 사람들의 머리를 위한 너울을 만들어 영혼을 사냥하는 여자들에게 화가 있다! 너희가 내 백성의 영혼들을 사냥하고, 너희 자신의 영혼은 살려 두겠느냐?’”[a][b][c]
  to: 너는 이렇게 말하십시오. ‘주 야훼[a]께서 이렇게 말씀하십니다. 모든 팔목에 주술용 띠[b]를 꿰매고, 키가 어떠하든 모든 사람의 머리에 씌울 덮개를 만들어 사람들의 생명[c]을 노리는 여자들에게 화가 있다! 너희가 내 백성의 생명을 노리고, 너희 자신의 생명은 살려 두겠느냐?’
  rationale: 원문의 반복되는 נפש와 ‘사냥하다/살려 두다’의 대조를 한국어에서 자연스럽게 유지하되, ‘영혼’이라는 협의의 해석을 피했습니다. 또한 논쟁적인 물건명은 번역 선택을 유지하면서 주석으로 불확실성을 드러냈고, 각 주석 표지를 해당 표현에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:40:42Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 구조와 수사적 질문은 대체로 충실합니다. 그러나 נפש는 여기서 비물질적 ‘영혼’으로 한정되지 않고 생명 또는 사람 자신을 가리킬 수 있으므로, 문맥상 더 자연스럽고 의미 범위를 좁히지 않는 ‘생명’으로 옮기는 것이 적절합니다. כְּסָתוֹת와 מִסְפָּחוֹת의 정확한 물건은 논쟁적이므로, 영어 POB의 ‘bands/veils’를 따르되 주석에서 불확실성을 밝혔습니다.
  naturalness: 초안의 ‘키가 각기 다른 사람들의 머리를 위한 너울’은 한국어로 다소 부자연스럽고, 모든 주석 표지가 문장 끝에 한꺼번에 붙어 어느 표현을 설명하는지 불명확합니다. 표지를 해당 낱말 가까이에 배치하고, ‘키가 어떠하든 모든 사람의 머리에 씌울 덮개’로 다듬었습니다.
  terminology: אֲדֹנָי יְהוִה의 ‘주 야훼’는 유지했습니다. ‘마술 띠’는 오락적 마술의 뉘앙스를 낼 수 있어 문맥의 주술성을 더 분명히 하는 ‘주술용 띠’로 고쳤습니다. נפש는 반복하여 ‘생명’으로 번역해 원문의 생명/인격 범위를 보존했습니다.
