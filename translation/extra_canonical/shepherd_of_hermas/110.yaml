translation:
  text: '“I, the shepherd, the messenger of repentance, have shown and spoken to God’s servant[b] all
    these things written above. If, then, you believe, listen to my words, walk in them and correct your
    ways, you will be able to live. But if you persist in wickedness and grudges, no one of that kind
    will live to God. I have told you everything I was to say.”


    2. The shepherd himself said to me, “Have you asked me everything?” I said, “Yes, sir.” “Why, then,
    did you not ask me about the marks on the stones placed in the structure, and why we filled in those
    marks?[a]” I said, “I forgot, sir.”


    3. “Now hear about them,” he said. “These are the people who have now heard my commandments and repented
    with all their hearts. When the Lord saw that their repentance was good and pure and that they could
    remain in it, he ordered their former sins to be erased. These marks were their sins, and they were
    smoothed away so they would not appear.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Formae is rendered “marks” in the stone image. “Indentations” or “shapes” are alternatives.
      The following passage says they were filled in/smoothed and identifies them as sins; no modern manufacturing
      molds are introduced.
  - marker: b
    reason: textual_variant
    text: Singular follows the reported Lavra/Paris Greek (Bandini112–114). Latin has “God’s servants.”
      The opening phrase’s placement differs; this draft retains the usual boundary.
lexical_decisions:
- source_word: paenitentia
  chosen: repentance
  alternatives:
  - penance
  - change of mind
  rationale: Moral return and corrected conduct in context, without inserting a later penitential institution.
- source_word: memoria offensarum
  chosen: grudges / remembrance of offenses
  alternatives:
  - memory of wrongs
  rationale: Preserve the sustained resentment condemned here, not an instruction to erase all recollection
    of harm.
- source_word: domine
  chosen: Sir
  alternatives:
  - Lord
  - Master
  rationale: Respectful address to the shepherd, distinct from divine Dominus.
- source_word: formae / explevimus / exaequata
  chosen: marks / filled in / smoothed away
  alternatives:
  - indentations
  - shapes
  rationale: Keep the linked material image and explicit identification of the marks with former sins.
- source_word: Dei servis (Latin plural); reported Greek singular
  chosen: God’s servant
  alternatives:
  - God’s servants
  rationale: Bounded singular selection; Latin source unchanged and plural alternative explicit.
