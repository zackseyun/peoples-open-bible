revisions:
- from: 주님께서 손으로 나라들을 쫓아내시고 그들을 심으셨으며, 민족들을 괴롭게 하시고 그들을 흩으셨습니다.[a]
  to: 그들이 자기 칼로 그 땅을 차지한 것도 아니고, 자기 팔이 그들을 구원한 것도 아니었습니다. 오직 주님의 오른손과 팔과 주님의 얼굴의 빛 때문이었습니다. 주님께서 그들을 기뻐하셨기 때문입니다.
  rationale: 제공된 히브리어 본문에 맞추어 절 전체를 새로 번역했습니다. 첫 כִּי는 앞 문맥에 대한 설명으로 별도 표지 없이 자연스럽게 처리했고, 마지막 כִּי는 ‘때문입니다’로 옮겼습니다. 긍정절에는 동사가 생략되어 있으므로, 한국어에서 앞의 두 결과 모두에 적용될 수 있는 ‘오직 … 때문이었습니다’로 보완했습니다. ‘주님의 얼굴의 빛’은 원문의 비유를 보존하며, 별도의 각주 없이도 자연스럽게 이해됩니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:07:18Z'
