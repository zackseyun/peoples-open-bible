  meaning_decisions:
  - source_phrase: כְּשָׁעָה חֲדָה
    prior_rendering: for about an hour
    new_rendering: for a while
    rationale: The expression need not specify a modern sixty-minute hour; the broader wording preserves the pause without imposing that precision.
  - source_phrase: עָנֵה מַלְכָּא וְאָמַר ... עָנֵה בֵלְטְשַׁאצַּר וְאָמַר
    prior_rendering: The king answered and said ... Belteshazzar answered and said
    new_rendering: The king said ... Belteshazzar replied
    rationale: These are conventional speech introductions; the king responds to Daniel’s distress, and Daniel replies to his reassurance.
  - source_phrase: מָרִי חֶלְמָא לְשָׂנְאָיִךְ וּפִשְׁרֵהּ לְעָרָיִךְ
    prior_rendering: My lord, may the dream be for those who hate you, and its interpretation for your enemies
    new_rendering: My lord, if only the dream applied to those who hate you, and its interpretation to your enemies!
    rationale: Daniel expresses a distressed wish about whom the dream concerns, not a claim that it actually concerns the king’s enemies.
