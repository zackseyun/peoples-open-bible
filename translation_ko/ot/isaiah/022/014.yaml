revisions:
- from: 만군의 야훼께서 내 귀에 이렇게 드러내셨습니다. “이 죄악은 너희에게서 속죄되지 않을 것이며, 너희가 죽을 때까지 그러할 것이다.” 만군의 주 하나님께서 말씀하십니다.[a][b]
  to: 만군의 야훼께서 내 귀에 이렇게 밝히셨습니다. “이 죄악은 너희가 죽을 때까지 결코 속죄되지 않을 것이다.” 만군의 주 야훼께서 말씀하십니다.
  rationale: 원문의 맹세적 부정과 시간 한계를 ‘죽을 때까지 결코 속죄되지 않을 것이다’로 결속해 옮겼습니다. 계시 관용구를 자연스럽게 다듬고, 신명 YHWH 표기를 일관되게 했습니다. 본문에 필수적이지 않으며 의미를 과도하게 규정할 수 있는 기존 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:33Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 עַד תְּמֻתוּן은 앞선 속죄 부정의 시간 한계를 이루므로, ‘죽을 때까지 그러할 것이다’보다 ‘죽을 때까지 결코 속죄되지 않을 것이다’로 한 문장 안에 연결하는 것이 원문 구조와 강조(אִם의 맹세적 부정)에 더 가깝습니다. 마지막 신명 호칭도 앞선 ‘야훼’ 표기와 일관되게 옮기는 편이 낫습니다.
  naturalness: ‘내 귀에 이렇게 드러내셨습니다’는 직역투로 다소 부자연스럽습니다. ‘내 귀에 이렇게 밝히셨습니다’는 히브리어 관용 표현을 유지하면서 현대 한국어로 자연스럽습니다. 또한 기존 문장의 ‘것이며 … 그러할 것이다’는 중복적입니다.
  terminology: עָוֹן의 ‘죄악’, כפר의 ‘속죄되다’, צְבָאוֹת의 ‘만군’은 적절합니다. 두 신명 호칭에서 YHWH를 각각 ‘야훼’와 ‘하나님’으로 달리 처리한 것은 일관성이 약하므로, אֲדֹנָי יְהוִה צְבָאוֹת는 ‘만군의 주 야훼’로 옮겼습니다. 기존 각주는 본문 이해에 필수적이지 않고, 특히 ‘덮음’ 이미지를 כפר의 직접적인 어휘 의미로 단정하므로 제거하는 것이 안전합니다.
  issues:
  - severity: medium
    issue: 시간 한계와 속죄 부정의 연결이 중복적으로 풀어짐
    rationale: ‘너희가 죽을 때까지 그러할 것이다’는 의미상 가능하지만, עַד תְּמֻתוּן이 יְכֻפַּר의 부정을 수식하는 원문 결속과 맹세적 부정의 힘을 약화합니다.
  - severity: low
    issue: ‘내 귀에 드러내셨습니다’의 직역투
    rationale: ‘내 귀에 밝히셨습니다’가 계시의 내용을 알리셨다는 뜻을 자연스럽게 전달합니다.
  - severity: medium
    issue: YHWH 표기의 비일관성
    rationale: 첫 호칭은 ‘야훼’, 마지막 호칭은 ‘하나님’으로 처리되어 동일한 신명의 표기가 달라집니다.
  - severity: low
    issue: כפר 각주의 어원적 이미지 단정
    rationale: ‘덮음’은 널리 알려진 설명이지만, 본문의 동사 의미를 그 이미지로 직접 환원하는 주석은 불필요하게 좁힐 수 있습니다.
  revised_text: 만군의 야훼께서 내 귀에 이렇게 밝히셨습니다. “이 죄악은 너희가 죽을 때까지 결코 속죄되지 않을 것이다.” 만군의 주 야훼께서 말씀하십니다.
