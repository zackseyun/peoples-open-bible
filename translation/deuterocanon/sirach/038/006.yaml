lexical_decisions:
- source_word: ויתן
  chosen: And he gave
  alternatives:
  - and he has given
  - and he grants
  lexicon: HALOT
  rationale: Simple waw-consecutive with נתן, best rendered as a past narrative statement. The Greek ἔδωκεν confirms a past giving.
- source_word: לאנוש
  chosen: man
  alternatives:
  - humankind
  - mortals
  lexicon: HALOT
  rationale: אֱנוֹשׁ commonly denotes man/mortal human being. Given the singular collective force and the project's gender-accurate policy, 'man' preserves the representative singular, while the sense is humanity in general. Greek ἀνθρώποις shows a plural collective, supporting a generic-human sense.
- source_word: בינה
  chosen: understanding
  alternatives:
  - discernment
  - knowledge
  - skill
  lexicon: HALOT
  rationale: בינה most naturally means understanding or discernment. The Greek parallel has ἐπιστήμην ('knowledge/skill'), which broadens the semantic field, but 'understanding' stays closest to the Hebrew while still fitting the context of medical knowledge in the surrounding verses.
- source_word: להתפאר
  chosen: to glory
  alternatives:
  - to boast
  - to be glorified
  - to take pride
  lexicon: HALOT
  rationale: The hitpael of פאר can mean to glorify oneself, boast, or glory. The Greek ἐνδοξάζεσθαι supports a sense of being glorified/glorying. 'To glory' preserves the elevated tone and leaves open whether the sense is reflexive boasting or exulting in praise.
- source_word: בגבורתו
  chosen: in his mighty deeds
  alternatives:
  - in his might
  - in his power
  - in his mighty work
  lexicon: HALOT
  rationale: גְּבוּרָה can denote might, strength, or mighty acts/deeds. In context, the pronoun most naturally refers to God, and the Greek ἐν τοῖς θαυμασίοις αὐτοῦ ('in his wondrous things') points toward manifested works rather than abstract power. 'Mighty deeds' captures the Hebrew root sense while aligning with the Greek contextual nuance.
