  - 저에게 대답하소서
  lexicon: HALOT
  rationale: 1인칭 단수 청원형을 살려 ‘저에게’와 ‘응답하소서’로 옮겼습니다. 예배적 기도 어조를 유지하기 위해 직접 청유형을 사용했습니다.
theological_decisions:
- issue: 공동체적 대상과 개인적 청원의 전환
  chosen_reading: ‘주의 사랑하는 이들’은 복수로, 뒤의 청원은 ‘저에게’로 유지했습니다.
  alternative_readings:
  - 공동체에 맞추어 ‘우리에게 응답하소서’로 평준화
  rationale: 히브리어가 공동체의 구원과 시편 화자의 개인적 응답 요청을 의도적으로 나누고 있으므로, 그 긴장을 한국어에서도 그대로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
