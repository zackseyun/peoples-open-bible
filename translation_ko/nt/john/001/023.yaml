- from: 그가 말했습니다. "나는 광야에서 외치는 이의 소리입니다[a]. '야훼의 길을 곧게 하라.' 이사야 선지자가 말한 대로입니다[b]."
  to: 그가 말했습니다. “나는 광야에서 외치는 이의 소리입니다[a]. ‘주님의 길을 곧게 하라’고 예언자 이사야가 말한 대로입니다.”
  rationale: ‘야훼’를 그리스어 본문과 영어 POB 감사 기록에 일치하는 ‘주님’으로 바로잡고, 그에 따른 각주 b를 삭제했습니다. 광야와 관련된 통사적 대안은 본문 의미를 바꾸지 않도록 간결한 각주 a로 유지했습니다. 나머지 표현은 원문의 은유, 명령, 인용 관계 및 합쇼체 문체를 보존합니다.
