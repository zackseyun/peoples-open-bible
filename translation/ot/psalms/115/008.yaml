id: PSA.115.8
reference: Psalms 115:8
source:
  edition: WLC
  text: כְּ֭מוֹ/הֶם יִהְי֣וּ עֹשֵׂי/הֶ֑ם כֹּ֭ל אֲשֶׁר בֹּטֵ֣חַ בָּ/הֶֽם־׃
translation:
  text: Those who make them will be like them[a], as will everyone who trusts in them.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “May those who make them be like them, and everyone who trusts in them.”
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹהֶם
  chosen: like them
  alternatives:
  - as they are
  lexicon: HALOT
  rationale: The preposition כְּ with the pronominal suffix expresses likeness/comparison. 'Like them' is the most natural English rendering and preserves the comparison with the idols mentioned in the preceding verses.
- source_word: יִהְיוּ
  chosen: will be
  alternatives:
  - will be
  lexicon: HALOT
  rationale: Natural prospective rendering of the imperfect without adding a transformation concept.
- source_word: עֹשֵׂיהֶם
  chosen: those who make them
  alternatives:
  - their makers
  - their makers/artisans
  lexicon: HALOT
  rationale: The participle of עשה with 3mp suffix refers to the people who manufacture the idols. 'Those who make them' is clear modern English and keeps the human-agent force of the participle.
- source_word: כֹּל אֲשֶׁר
  chosen: everyone who
  alternatives:
  - all who
  - everyone that
  lexicon: HALOT
  rationale: The construction means 'all/everyone who.' 'Everyone who' reads naturally in English while preserving the universal scope.
- source_word: בֹּטֵחַ
  chosen: trusts
  alternatives:
  - relies
  - has confidence
  lexicon: HALOT
  rationale: בטח commonly denotes trust or reliance, often with religious overtones. 'Trusts' is the most direct and idiomatic rendering here.
- source_word: בָּהֶם
  chosen: in them
  alternatives:
  - on them
  lexicon: HALOT
  rationale: With בטח, the preposition ב marks the object of trust. English idiom favors 'trust in them,' especially in a religious context involving idols.
