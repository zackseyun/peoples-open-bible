  meaning_decisions:
  - source_phrase: ἀνήγγειλαν αὐτῷ περὶ αὐτῆς
    prior_rendering: they reported her to him
    new_rendering: They told him about her
    rationale: The Greek means that they communicated information about her, not that they reported a person as though she were an offense.
  - source_phrase: ἐξῆλθεν εἰς τὸ προσκήνιον
    prior_rendering: he came out into the forecourt
    new_rendering: he came out to the front of his tent
    rationale: The term identifies the space at the front of the commander’s tent; this wording avoids imposing the particular architecture suggested by “forecourt.”
  - source_phrase: λαμπάδες ἀργυραῖ προάγον αὐτοῦ
    prior_rendering: with silver lamps going before him
    new_rendering: with silver lamps carried ahead of him
    rationale: The lamps precede him ceremonially because people carry them, an understood circumstance that English should make explicit.
