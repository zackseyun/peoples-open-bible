  chosen: Shephatiah
  alternatives:
  - Shephatya
  lexicon: HALOT
  rationale: Personal names are transliterated by standard conventions per translation philosophy. 'Shephatiah' is the conventional English transliteration of the Hebrew proper name.
- source_word: שְׁלֹשׁ מֵאוֹת שִׁבְעִים וּשְׁנָיִם
  chosen: three hundred seventy-two
  alternatives:
