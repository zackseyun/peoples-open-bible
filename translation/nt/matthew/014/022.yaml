  from: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
  to: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], while he dismissed the crowds.
  rationale: The conjunction ἕως οὗ can mean 'until' or 'while' (BDAG ἕως 2). In this context, translating it as 'until' creates a logical absurdity, implying the disciples' journey to the other side would terminate once Jesus dismissed the crowds. The concurrent sense 'while' is required here (as in Mt 26:36), and the English sequence of tenses following the past tense main verb (ἠνάγκασεν) makes 'while he dismissed' the most natural rendering.
- timestamp: '2026-11-09T17:14:42Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], while he dismissed the crowds.
  to: Immediately Jesus compelled the disciples to get into the boat and go on ahead of him to the other side, while he dismissed the crowds.
  rationale: The later source correction from 'until' to 'while' rightly establishes that the departure and dismissal occur concurrently. That gain and the strong force of 'compelled' are retained, with Jesus named explicitly at the narrative transition.
