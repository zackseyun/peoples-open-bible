base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025.yaml
  text: '1. And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be chiefs of the tribes in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and so all the rest in order.


    2. And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.


    3. And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.


    4. And those who died in sorrow will rise in joy, and the poor for the Lord’s sake will be made rich, and those dying for the Lord’s sake will awake to life.


    5. And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.'
translation:
  language: ko
  text: '1. 이런 일들이 지난 뒤에 아브라함과 이삭과 야곱이 생명으로 다시 일어날 것이며, 나와 내 형제들은 이스라엘에서 각 지파의 우두머리가 될 것입니다. 레위가 첫째이고, 나는 둘째이며, 요셉이 셋째, 베냐민이 넷째, 시므온이 다섯째, 잇사갈이 여섯째이고, 그렇게 모두 차례대로 될 것입니다.


    2. 주께서 레위를 복 주시고, 얼굴의 천사가 나를 복 주며, 영광의 권능들이 시므온을, 하늘이 르우벤을, 땅이 잇사갈을, 바다가 스불론을, 산들이 요셉을, 천막이 베냐민을, 빛들이 단을, 기쁨이 납달리를, 해가 갓을, 달이 아셀을 복 줍니다.


    3. 여러분은 주님의 백성이 될 것이며, 한 언어를 사용할 것이고, 그곳에는 벨리알의 속임수의 영이 없을 것입니다. 그것은 영원히 불에 던져질 것이기 때문입니다.


    4. 슬픔 가운데 죽은 사람들은 기쁨 가운데 다시 일어날 것이며, 주를 위해 가난한 사람들은 부요하게 될 것이고, 주를 위해 죽어 가는 사람들은 생명으로 깨어날 것입니다.


    5. 요셉의 사슴들은 환호하며 달릴 것이고, 이스라엘의 독수리들은 기쁨 가운데 날아오를 것이며, 모든 민족이 영원히 주를 찬양할 것입니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν Ἰσραὴλ ἐσόμεθα
  english_pob_choice: will be chiefs of the tribes in Israel
  chosen_korean: 이스라엘에서 각 지파의 우두머리가 될 것입니다
  alternatives_korean:
  - 이스라엘에서 각 지파의 장들이 될 것입니다
  - 이스라엘에서 각 지파의 수령이 될 것입니다
  lexicon: ἔξαρχοι
  rationale: POB의 핵심 해석인 “chiefs of the tribes”를 따라 ἔξαρχοι를 ‘각 지파의 우두머리’로 옮겨, 단순한 지도자 일반보다 지파 질서를 전면에 드러냈습니다.
- source_word: ἀναστήσεται ... εἰς ζωήν
  english_pob_choice: will rise to life
  chosen_korean: 생명으로 다시 일어날 것입니다
  alternatives_korean:
  - 생명으로 일어날 것입니다
  - 다시 살아날 것입니다
  lexicon: ἀνίστημι / ζωή
  rationale: ‘rise to life’의 부활적 의미를 살리면서도, 합쇼체 문맥에서 자연스러운 ‘다시 일어날 것입니다’로 표현했습니다.
- source_word: πνεῦμα πλάνης τοῦ Βελιάρ
  english_pob_choice: a spirit of Belial’s deceit
  chosen_korean: 벨리알의 속임수의 영
  alternatives_korean:
  - 벨리알의 기만의 영
  - 벨리알의 미혹의 영
  lexicon: πνεῦμα / πλάνη / Βελιάρ
  rationale: πλάνη를 단순한 추상명사보다 ‘속임수’로 옮겨, POB가 지적하는 벨리알의 기만적 성격을 분명히 했습니다.
- source_word: ἀγαλλιάσει / χαρᾷ
  english_pob_choice: exultation / joy
  chosen_korean: 환호하며 / 기쁨 가운데
  alternatives_korean:
  - 즐거움으로 / 기쁨으로
  - 환희하며 / 기뻐하며
  lexicon: ἀγαλλίασις / χαρά
  rationale: 두 개의 기쁨 표현을 구분해, 사슴과 독수리의 역동적 이미지에는 ‘환호하며’, 뒤의 평정된 상태에는 ‘기쁨 가운데’를 사용했습니다.
theological_decisions:
- issue: 벨리알의 영의 종말
  chosen_reading: 그것은 영원히 불에 던져질 것이기 때문입니다
  alternative_readings:
  - 그것은 영원한 불에 던져질 것이기 때문입니다
  - 그것은 영원히 소멸될 것이기 때문입니다
  rationale: 원문의 ἐμβληθήσεται εἰς τὸν αἰῶνα를 문자적으로 유지해, 벨리알의 속임수가 최종적으로 제거되는 종말론적 진술을 보존했습니다.
  doctrine_reference: 종말론 / 악의 최종 심판
- issue: 슬픔과 가난, 죽음의 반전
  chosen_reading: 슬픔 가운데 죽은 사람들은 기쁨 가운데 다시 일어날 것이며, 주를 위해 가난한 사람들은 부요하게 될 것이고, 주를 위해 죽어 가는 사람들은 생명으로 깨어날 것입니다
  alternative_readings:
  - 슬픔 속에서 죽은 자들은 기쁨 속에서 살아날 것이며…
  - 주를 위해 가난한 자들은 부유하게 될 것이고…
  rationale: 원문의 대조 구조(슬픔/기쁨, 가난/부요, 죽음/생명)를 평행적으로 보존해, 축복의 역전이라는 신학적 포인트를 드러냈습니다.
  doctrine_reference: 부활 / 보상 / 역전의 축복
