source:
  edition: WLC
  text: וּ/בְ/כָל מְדִינָ֨ה וּ/מְדִינָ֜ה וּ/בְ/כָל עִ֣יר וָ/עִ֗יר מְקוֹם֙ אֲשֶׁ֨ר דְּבַר הַ/מֶּ֤לֶךְ וְ/דָת/וֹ֙ מַגִּ֔יעַ שִׂמְחָ֤ה וְ/שָׂשׂוֹן֙ לַ/יְּהוּדִ֔ים מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וְ/רַבִּ֞ים מֵֽ/עַמֵּ֤י הָ/אָ֨רֶץ֙ מִֽתְיַהֲדִ֔ים כִּֽי נָפַ֥ל פַּֽחַד הַ/יְּהוּדִ֖ים עֲלֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/017.yaml
  text: And in every province and province, and in every city and city, wherever the king’s word and his decree reached, there was joy and gladness for the Jews, a feast and a good day. And many from the peoples of the land were becoming Jews, because the fear of the Jews had fallen on them.
translation:
  language: ko
  text: 왕의 명령과 그의 조서가 이른 모든 지방과 모든 성읍에는 유다 사람들에게 기쁨과 즐거움, 잔치와 좋은 날이 있었습니다.[a] 그 땅의 여러 민족 가운데 많은 사람이 유다인이 되어 가고 있었습니다.[b] 유다 사람들에 대한 두려움이 그들에게 임했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘지방과 지방’, ‘성읍과 성읍’이라고 반복하여 범위를 강조합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 직역하면 ‘유다인이 되어 가고 있었다’입니다. 이 표현이 가리키는 사회적·종교적 편입의 구체적 성격은 본절만으로 확정되지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: מְדִינָה / מְדִינָה
  english_pob_choice: province and province
  chosen_korean: 모든 지방
  alternatives_korean:
  - 각 지방마다
  - 지방마다
  lexicon: מְדִינָה
  rationale: POB의 반복 강조를 한국어에서는 자연스러운 ‘모든 지방’으로 옮겨, 분포의 전면성을 살렸습니다.
- source_word: עִיר / עִיר
  english_pob_choice: city and city
  chosen_korean: 모든 성읍
  alternatives_korean:
  - 모든 도시
  - 각 성읍마다
  lexicon: עִיר
  rationale: 문맥상 행정 구역의 대조를 살리면서도 현대 한국어에서 읽기 자연스러운 ‘성읍’을 택했습니다.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  english_pob_choice: the king’s word and his decree
  chosen_korean: 왕의 명령과 그의 조서
  alternatives_korean:
  - 왕의 말과 그의 법령
  - 왕의 명령과 그의 칙령
  lexicon: דָּבָר / דָּת
  rationale: דְּבַר은 단순한 ‘말’보다 효력을 가진 ‘명령’이 더 적절하고, דָּת는 법적 공문맥에서 ‘조서’가 본문의 공식성을 잘 드러냅니다.
- source_word: מִתְיַהֲדִים
  english_pob_choice: were becoming Jews
  chosen_korean: 유다인이 되었으니
  alternatives_korean:
  - 유대인이 되고 있었으니
  - 유다 편에 가담하고 있었으니
  lexicon: התיהד
  rationale: 동사의 변화 결과를 직접적으로 표현해, 단순한 동조가 아니라 유다 공동체로 편입되는 의미를 살렸습니다.
- source_word: עַמֵּי הָאָרֶץ
  english_pob_choice: the peoples of the land
  chosen_korean: 그 땅의 여러 민족
  alternatives_korean:
  - 그 땅의 백성들
  - 그 나라의 백성들
  lexicon: עַם
  rationale: 복수성과 이방 민족성을 분명히 하기 위해 ‘여러 민족’으로 옮겼습니다.
theological_decisions:
- issue: ‘유다인이 되었으니’의 정체성 전환 표현
  chosen_reading: 공포로 인한 사회적·정치적 편입을 드러내되, 본문이 말하는 실제 결과를 약화시키지 않고 그대로 옮깁니다.
  alternative_readings:
  - ‘유다 편에 섰으니’처럼 완화하기
  - ‘유다교로 개종했으니’로 종교화하기
  rationale: 히브리어는 실제로 ‘유다인 됨’이라는 결과를 말하므로, 본문의 긴장과 역사성을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: 본문 역사 서술의 표면 의미 보존
- issue: ‘두려움’의 중첩 표현
  chosen_reading: ‘유다 사람들을 두려워하는 두려움’으로 원문의 중첩을 살렸습니다.
  alternative_readings:
  - ‘유다 사람들에 대한 두려움’으로 평탄화하기
  - ‘유다 사람들을 향한 공포’로 의역하기
  rationale: 히브리어의 반복은 단순 정보보다 압도적 공포의 강도를 강조하므로, 의미를 매끈하게 지우지 않도록 했습니다.
  doctrine_reference: 수사적 반복의 의미 보존
