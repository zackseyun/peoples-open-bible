  lexicon: shame / darkness
  rationale: ‘수치’는 공동체적 모멸의 뉘앙스를 살리고, ‘어둠’은 곧바로 뒤따르는 거처 이미지와 연결되도록 간결하게 처리했습니다.
- source_word: ዕፀያት፡ ይከውኖሙ፡ ምስካቦሙ፡
  english_pob_choice: worms their bed
  chosen_korean: 벌레가 그들의 침상이 될 것입니다
  alternatives_korean:
  - 구더기가 그들의 침상이 될 것입니다
  - 벌레들이 그들의 잠자리가 될 것입니다
  lexicon: worms / bed
  rationale: 게으즈 본문의 부패·무덤 이미지를 그대로 드러내기 위해 ‘벌레’로 직역하되, 한국어에서는 자연스러운 심판 상징으로 읽히도록 했습니다.
- source_word: ኢይሴፈዉ፡ ከመ፡ ይትነሥኡ፡ እምስካቦቲሆሙ፡
  english_pob_choice: they shall have no hope of rising from their beds
  chosen_korean: 그들은 자기 침상에서 일어날 희망이 없을 것입니다
  alternatives_korean:
  - 그들은 자기 침상에서 일어날 수 있을 것이라 기대하지 못할 것입니다
  - 그들은 그들의 잠자리에서 다시 일어날 희망이 없을 것입니다
