  text: בְּנֵ֣י בֵבָ֔י שֵׁ֥שׁ מֵא֖וֹת עֶשְׂרִ֥ים וּ/שְׁלֹשָֽׁה׃ס
translation:
  text: 'The descendants of Bebai: 623.'
  philosophy: dynamic
lexical_decisions:
- source_word: בְּנֵי
  chosen: the sons of
  alternatives:
  - the descendants of
  - the children of
  lexicon: HALOT
  rationale: Construct plural of בֵּן in a genealogical/list context commonly denotes a family line or clan. 'The sons of' is the most direct and conventional rendering in Ezra's returnee list, preserving the source form while allowing representative descent.
- source_word: בֵבָי
  chosen: Bebai
  rationale: Proper personal/family name; transliterated according to the translation philosophy to preserve the name rather than translate it.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וּשְׁלֹשָׁה
  chosen: six hundred twenty-three
  alternatives:
  - six hundred and twenty-three
  lexicon: HALOT
  rationale: 'The Hebrew cardinal sequence is straightforward: 6 + 100s, 20, and 3 = 623. Rendered in contemporary readable English without ''and,'' consistent with modern style, while preserving the exact number.'
