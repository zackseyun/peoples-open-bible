    ܕܐܝܠܝܢ ܕܡܩܕܡܝܢ ܐܡܝܢ.܀.
    ܘܗܘܘ ܡܢ ܒܬܪ ܕܒܥܘ
    ܗܘ ܝܘܡܐ ܕܡܘܬܐ. ܗܝܕܝܢ
    ܡܢ ܒܬܪ ܕܝܢ ܡܬܚܘܝܘ
    ܕܡܬܚܘܝܢ. ܕܐܢܘܢ
    ܕܡܬܚܙܝܢ. ܐܦ ܠܡܒܣܡܗܘܢ
    ܕܐܝܠܝܢ ܕܡܬܕܡܝܢ.
    ܡܠܟܒܕܐ ܓܝܪ ܕܡܘܬܗܘܢ
    ܐܝܠܝܢ ܕܗܘܐ ܩܕܡܝܟܝܢ
    ܒܝܫ ܡܢ ܡܐ ܕܐܝܬܝܗ̇.
    ܚܕ ܕܢܣܒܪܘܢ ܬܫܢܝܩܐ.
    ܦ ܬܫܒܘܚܬܗܘܢ ܕܐܝܠܝܢ
    ܕܗܘܐ ܐܙܕܩܘ ܒܙܒܢܗܘܢ.
    ܘܗܠܝܢ ܕܐܝܬ ܗܘܘ ܠܗܘܢ
    ܫܘܒܠܐ ܒܚܝ̈ܝܗܘܢ.
    ܘܗܠܝܢ ܕܢܨܒܘ ܒܠܒܗܘܢ
    ܥܩܪܐ ܕܚܟܡܬܐ. ܗ̇ܢܝܢ
