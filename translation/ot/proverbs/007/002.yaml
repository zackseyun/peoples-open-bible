id: PRO.7.2
reference: Proverbs 7:2
source:
  edition: WLC
  text: שְׁמֹ֣ר מִצְוֺתַ֣/י וֶ/חְיֵ֑ה וְ֝/תוֹרָתִ֗/י כְּ/אִישׁ֥וֹן עֵינֶֽי/ךָ׃
translation:
  text: Keep my commandments and live; guard my instruction as you guard the pupil of your eye.
  philosophy: dynamic
lexical_decisions:
- source_word: שְׁמֹר
  chosen: Keep … and keep
  alternatives:
  - Guard
  - Observe
  lexicon: HALOT
  rationale: One Hebrew imperative syntactically governs both objects; repetition is needed for clear English.
- source_word: מִצְוֺתַי
  chosen: my commandments
  alternatives:
  - my commands
  lexicon: HALOT
  rationale: מִצְוָה is well rendered 'commandment' in wisdom and covenantal contexts. The plural with first-person suffix is preserved directly.
- source_word: וֶחְיֵה
  chosen: and live
  alternatives:
  - so that you may live
  - that you may live
  lexicon: HALOT
  rationale: The imperative/consecutive form is concise and naturally rendered 'and live.' This preserves the Hebrew parataxis while allowing the implied result nuance to be heard without over-explication.
- source_word: וְתוֹרָתִי
  chosen: and my instruction
  alternatives:
  - and my law
  - and my teaching
  lexicon: HALOT
  rationale: תּוֹרָה in Proverbs refers broadly to instruction or teaching, not narrowly statutory law. 'Instruction' best fits wisdom literature and avoids importing a purely legal sense.
- source_word: כְּאִישׁוֹן
  chosen: like the pupil
  alternatives:
  - as the apple
  - like the apple
  lexicon: HALOT
  rationale: אִישׁוֹן in this idiom refers to the pupil, the small dark center of the eye. Traditional English 'apple of the eye' is idiomatic but less transparent to modern readers; 'pupil' gives the plain sense.
- source_word: עֵינֶיךָ
  chosen: of your eye
  alternatives:
  - of your eyes
  lexicon: HALOT
  rationale: Though morphologically dual/plural in form, the idiom 'pupil of your eye' is standard English and reflects the singular sense of the expression in context.
- source_word: כְּאִישׁוֹן עֵינֶיךָ
  chosen: like the pupil of your eye
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This directly conveys the Hebrew comparison while retaining the traditional English idiom in a note.
