id: PRO.24.22
reference: Proverbs 24:22
source:
  edition: WLC
  text: כִּֽי פִ֭תְאֹם יָק֣וּם אֵידָ֑/ם וּ/פִ֥יד שְׁ֝נֵי/הֶ֗ם מִ֣י יוֹדֵֽעַ־׃ס
translation:
  text: For disaster will strike them suddenly; who knows what ruin Yahweh and the king can bring[a]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “who knows the ruin of them both?” The identity of the two and whether they cause or suffer the ruin are uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - indeed
  lexicon: HALOT
  rationale: Introduces the reason for the preceding exhortation in v.21; 'for' is the most natural causal connector in English here.
- source_word: פִתְאֹם
  chosen: suddenly
  alternatives:
  - in an instant
  - unexpectedly
  lexicon: HALOT
  rationale: Adverbial term indicating abruptness; 'suddenly' is clear, idiomatic, and preserves the warning tone.
- source_word: יָקוּם
  chosen: will arise
  alternatives:
  - will arise
  - will come
  lexicon: HALOT
  rationale: This preserves the arising image and is idiomatic with “disaster.”
- source_word: אֵידָם
  chosen: their disaster
  alternatives:
  - their calamity
  - their ruin
  lexicon: HALOT
  rationale: אֵיד denotes calamity/disaster. The suffix is 3mp, referring back to the king and those given to change/rebellion in the previous verse. 'Disaster' is natural modern English and suitably weighty.
- source_word: וּפִיד
  chosen: and ... the ruin
  alternatives:
  - and ... destruction
  - and ... calamity
  lexicon: HALOT
  rationale: פִיד is a near-synonym for destructive ruin or calamity. Rendering it as 'ruin' preserves the poetic parallelism while avoiding exact repetition of 'disaster.'
- source_word: שְׁנֵיהֶם
  chosen: of them both
  alternatives:
  - from both of them
  - belonging to both
  lexicon: HALOT
  rationale: 'The dual/plural form with suffix most naturally means ''the two of them/both of them.'' In context it likely refers to the two parties just mentioned in v.21: the LORD and the king, whose jointly sourced judgment is beyond human foresight.'
- source_word: מִי יוֹדֵעַ
  chosen: who knows
  alternatives:
  - who can know
  - who understands
  lexicon: HALOT
  rationale: A rhetorical question expressing human inability to foresee or comprehend. 'Who knows' is concise and idiomatic.
- source_word: וּפִיד שְׁנֵיהֶם
  chosen: the ruin from them both
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The genitive relation is ambiguous, but the contextual reading is ruin brought by the two authorities; the note candidly retains the ambiguity.
