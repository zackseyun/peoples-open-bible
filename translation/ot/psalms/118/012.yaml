  rationale: Azure substituted 'they were extinguished' (drafter's rejected alternative for דֹּעֲכוּ — drafter chose 'went out' for concision since fire image follows) and 'a fire of thorns' (rejected for chosen 'a fire among thorns' — drafter's flare-and-extinction idiom).
