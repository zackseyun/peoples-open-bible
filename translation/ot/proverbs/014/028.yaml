id: PRO.14.28
reference: Proverbs 14:28
source:
  edition: WLC
  text: בְּ/רָב עָ֥ם הַדְרַת מֶ֑לֶךְ וּ/בְ/אֶ֥פֶס לְ֝אֹ֗ם מְחִתַּ֥ת רָזֽוֹן־־׃
translation:
  text: A large population is a king’s splendor, but a lack of people is a ruler’s downfall[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “a ruler's terror”; the Hebrew word can denote dread or downfall.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרָב
  chosen: In a multitude of
  alternatives:
  - With many
  - In the abundance of
  lexicon: HALOT
  rationale: 'The preposition ב plus רָב expresses circumstance/location: ''in/with abundance.'' ''In a multitude of'' preserves the proverb''s compact parallelism and the sense of numerical abundance.'
- source_word: עָם
  chosen: people
  alternatives:
  - folk
  - subjects
  lexicon: HALOT
  rationale: עָם commonly means 'people' as a populace. 'Subjects' would narrow the sense interpretively; 'people' keeps the broader political-social sense suitable to a king.
- source_word: הַדְרַת
  chosen: splendor
  alternatives:
  - glory
  - majesty
  - honor
  lexicon: HALOT
  rationale: The noun denotes adornment, honor, or majesty. 'Splendor' communicates visible royal magnificence produced by a large populace, while remaining natural English.
- source_word: מֶלֶךְ
  chosen: king’s
  alternatives:
  - of a king
  lexicon: HALOT
  rationale: 'Construct relationship with הַדְרַת is best rendered possessively in English: the splendor belongs to the king.'
- source_word: וּבְאֶפֶס
  chosen: but without
  alternatives:
  - and in the absence of
  - but in the lack of
  lexicon: HALOT
  rationale: אֶפֶס here conveys nonexistence/lack. 'But without' captures the adversative parallel and reads idiomatically in English.
- source_word: לְאֹם
  chosen: a nation
  alternatives:
  - a people
  - a populace
  lexicon: HALOT
  rationale: לְאֹם is a people-group or nation. To avoid repeating 'people' from עָם while preserving the collective-political sense, 'nation' is suitable.
- source_word: מְחִתַּת
  chosen: downfall
  alternatives:
  - terror
  - dismay
  - destruction
  lexicon: HALOT
  rationale: The contextual contrast with royal splendor favors collapse or ruin, while dread remains a lexical alternative.
- source_word: רָזוֹן
  chosen: a ruler’s
  alternatives:
  - of a prince
  - of a noble
  lexicon: HALOT
  rationale: The term refers to one in authority, often a ruler or prince. 'Ruler' is broad and natural, and it pairs well with 'king' in the first colon without forcing a strict distinction the Hebrew may not intend.
- source_word: בְּרָב עָם
  chosen: A large population
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural equivalent for abundance of people in the royal-political context.
- source_word: וּבְאֶפֶס לְאֹם
  chosen: but a lack of people
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Expresses the parallel circumstance grammatically without importing a modern nation-state concept.
