  from: Let all my enemies be ashamed and greatly dismayed[a]; let them turn back and be ashamed in an instant.
  to: Let all my enemies be put to shame and greatly dismayed; let them turn back and be put to shame in an instant[a].
  rationale: I retain the later revision's “greatly dismayed,” which avoids making the distress exclusively terror. The existing petitionary reading remains in the text, with the serious alternative of a confident prediction noted.
