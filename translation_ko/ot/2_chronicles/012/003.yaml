- from: 천이백 대의 병거와 육만 명의 기병과 함께였으며, 그와 함께 애굽에서 온 사람들은 셀 수 없이 많았습니다. 곧 리비아 사람들과 수키 사람들과 구스 사람들이었습니다.[a][b][c]
  to: 그는 천이백 대의 병거와 육만 명의 기병을 거느리고 왔습니다. 그와 함께 이집트에서 온 백성은 셀 수 없이 많았으니, 리비아 사람들과 수키 사람들과 구스 사람들이었습니다.[a][b][c]
  rationale: 문법적으로 미완인 첫 문장을 자연스러운 합쇼체 서술로 고쳤습니다. ‘거느리고 왔습니다’는 원문의 בְּ(‘~와 함께’)가 나타내는 군사 동반 관계를 자연스럽게 표현하며, 본 절이 앞 절의 시삭을 이어 받는 점을 반영합니다. 나머지 열거와 각주 연결은 원문 및 영어 감사 기록에 충실하게 유지했습니다.
