    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: POB의 기본 원칙에 따라 신명은 야훼로 옮기고, 영어 본문의 LORD를 한국어 관례인 주님으로 바꾸지 않았습니다.
- source_word: כִּדְבַר מֹשֶׁה
  english_pob_choice: according to the word of Moses
  chosen_korean: 모세의 말대로
  alternatives_korean:
  - 모세의 말씀대로
  - 모세가 말한 대로
  lexicon: דָּבָר
  rationale: 히브리어 דָּבָר는 여기서 ‘말/말한 것’의 의미이므로, 자연스러운 한국어로 ‘말대로’라고 옮겼습니다.
- source_word: מִן הַבָּתִּים / מִן הַחֲצֵרֹת / וּמִן הַשָּׂדֹת
  english_pob_choice: out of the houses, out of the courtyards, and out of the fields
  chosen_korean: 집들에서, 뜰에서, 그리고 들에서
  alternatives_korean:
  - 집들로부터, 뜰로부터, 그리고 들로부터
  - 집 안에서, 마당에서, 그리고 들에서
  lexicon: מן + 장소명사
  rationale: 영어 POB의 out of를 따라 출발점을 드러내되, 한국어에서는 반복을 줄여 ‘-에서’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 야훼 이름 표기
  chosen_reading: 본문의 LORD를 한국어 본문에서 야훼로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본 프로젝트 기본어휘가 야훼이며, 출애굽기 본문에서 신명 שימוש을 가리거나 전통어로 순화하지 않기 위함입니다.
  doctrine_reference: YHWH name rendering policy
