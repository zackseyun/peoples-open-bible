translation:
  text: In those days the earth will give back what was entrusted to it,[a] and Sheol will give back what it was
    given, and Destruction[b] will give back what it owes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected noun means a deposit or entrusted charge, not a womb. Dillmann1865 columns138-139 explicitly
      cites51:1 under depositum, including entrusted persons as well as things. This does not supply an absent phrase
      from another text.
    reason: lexical_alternative
  - marker: b
    text: Sheol is the realm of the dead. Destruction renders the place-of-destruction noun; Dillmann1865 column19
      explicitly cites51:1 for that underworld sense (Abaddon), not a separate named being.
    reason: cultural_note
  - marker: c
    text: The debt/restitution verb is supported by Dillmann1865 column1379, which cites51:1 under owing something.
      All three return clauses are retained.
    reason: lexical_alternative
