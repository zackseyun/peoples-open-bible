  text: Οἱ δὲ ἐπιδεδωκότες τὰς ῥάβδους τὰ μὲν δύο μέρη ξηρά, τὸ δὲ τρίτον χλωρόν, οὗτοί εἰσι πιστοὶ μὲν
    γεγονότες, πλουτήσαντες δὲ καὶ γενόμενοι ἔνδοξοι παρὰ τοῖς ἔθνεσιν ὑπερηφανίαν μεγάλην ἐνεδύσαντο
    καὶ ὑψηλόφρονες ἐγένοντο, καὶ κατέλιπον τὴν ἀλήθειαν, καὶ οὐκ ἐκολλήθησαν τοῖς δικαίοις, ἀλλὰ κατὰ
    τὰ ἔθνη συνέζησαν, καὶ αὕτη ἡ ὁδὸς ἡδυτέρα αὐτοῖς ἐγένετο· ἀπὸ δὲ τοῦ Θεοῦ οὐκ ἀπέστησαν, ἀλλ᾿ ἐνέμειναν
    τῇ πίστει, μὴ ἐργαζόμενοι τὰ ἔργα τῆς πίστεως. 2. πολλοὶ οὖν ἐξ αὐτῶν μετενόησαν, καὶ ἐγένετο ἡ κατοίκησις
    αὐτῶν ἐν τῷ πύργῳ. 3. ἕτεροι δὲ εἰς τέλος μετὰ τῶν ἐθνῶν συζῶντες καὶ φθειρόμενοι ταῖς κενοδοξίαις
    τῶν ἐθνῶν ἀπέστησαν ἀπὸ τοῦ Θεοῦ, καὶ ἔπραξαν τὰς πράξεις τῶν ἐθνῶν. οὗτοι μετὰ τῶν ἐθνῶν ἐλογίσθησαν.
    4. ἕτεροι δὲ ἐξ αὐτῶν ἐδιψύχησαν μὴ ἐλπίσαντες σωθῆναι διὰ τὰς πράξεις ἃς ἔπραξαν· ἕτεροι δὲ ἐδιψύχησαν
    καὶ σχίσματα ἐν ἑαυτοῖς ἐποίησαν. τούτοις οὖν καὶ τοῖς διψυχήσασι διὰ τὰς πράξεις αὐτῶν μετάνοια ἔτι
    ἐστίν· ἀλλ᾿ ἡ μετάνοια αὐτῶν ταχινὴ ὀφείλει εἶναι, ἵνα ἡ κατοικία αὐτῶν γένηται ἐντὸς τοῦ πύργου·
    τῶν δὲ μὴ μετανοούντων, ἀλλ᾿ ἐπιμενόντων ταῖς ἡδοναῖς, ὁ θάνατος ἐγγύς.
