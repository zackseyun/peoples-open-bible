id: PSA.115.7
reference: Psalms 115:7
source:
  edition: WLC
  text: יְדֵי/הֶ֤ם וְ/לֹ֬א יְמִישׁ֗וּ/ן רַ֭גְלֵי/הֶם וְ/לֹ֣א יְהַלֵּ֑כוּ לֹֽא יֶ֝הְגּ֗וּ בִּ/גְרוֹנָֽ/ם׀־׃
translation:
  text: They have hands, but do not touch; feet, but do not walk; they make no sound in their throats.
  philosophy: dynamic
lexical_decisions:
- source_word: יְדֵיהֶם
  chosen: They have hands
  alternatives:
  - Their hands
  lexicon: HALOT
  rationale: The noun means 'hands of them/their hands.' English supplies the implied possession naturally as 'They have hands' to match the verbless Hebrew clause and the parallel structure of the verse.
- source_word: יְמִישׁוּן
  chosen: do not touch
  alternatives:
  - do not touch
  - cannot grope
  - cannot handle
  lexicon: HALOT
  rationale: Directly conveys the verb’s physical-contact sense in parallel with walking.
- source_word: רַגְלֵיהֶם
  chosen: feet
  alternatives:
  - their feet
  lexicon: HALOT
  rationale: The noun means 'their feet.' In English, the possessive is naturally implied after 'They have hands,' and the shorter 'feet' preserves the compact poetic parallelism.
- source_word: יְהַלֵּכוּ
  chosen: do not walk
  alternatives:
  - do not walk
  lexicon: HALOT
  rationale: Retains the Hebrew’s unqualified negation; incapacity is clear from context.
- source_word: יֶהְגּוּ
  chosen: make no sound
  alternatives:
  - mutter
  - speak
  - growl
  - utter
  lexicon: HALOT
  rationale: הגה can denote low utterance, muttering, or sound-making. Since the object is idols and the phrase specifies 'in their throat,' the point is that no vocal sound comes from them. 'Make no sound' is clear modern English and avoids overstating the verb as full speech.
- source_word: בִּגְרוֹנָם
  chosen: in their throat
  alternatives:
  - with their throat
  - in their throat(s)
  - from their throat
  lexicon: HALOT
  rationale: גרון is 'throat.' Retaining 'in their throat' stays close to the Hebrew imagery of vocalization originating in the throat, while remaining understandable in English.
- source_word: יֶהְגּוּ בִּגְרוֹנָם
  chosen: make no sound in their throats
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Preserves the broad low-vocalization/sound sense and the concrete throat image.
