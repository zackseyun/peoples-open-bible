  source_fidelity: 라틴어 "Tunc interrogaui angelum et dixi"의 두 과거 동작은 순차적으로 표현하는 편이 충실합니다. "hi"는 사람을 가리킬 수 있으나 본문 자체에는 명사가 없으므로 ‘이들’로 두어 지시의 개방성을 보존했습니다. "domine"는 소유격을 더하지 않은 호격 ‘주님’으로 적절히 옮겼습니다.
  naturalness: ‘천사에게 물어보며 말했습니다’는 동시 진행의 뉘앙스를 내며 한국어 문장으로도 다소 부자연스럽습니다. ‘천사에게 물어 말했습니다’가 문맥상 자연스럽고 원문의 발화 도입 공식을 보존합니다. 호격은 한국어 어순상 앞에 두는 것이 더 자연스럽습니다.
  terminology: ‘천사’, ‘주님’은 문맥과 현대 표준 한국어의 합쇼체에 적절합니다. ‘이들’은 원문의 무표지 지시대명사를 불필요하게 ‘사람들’로 한정하지 않습니다.
