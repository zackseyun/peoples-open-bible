review_pass:
  verdict: revise
  source_fidelity: 첫 두 절반행은 히브리어와 그리스어 병행 본문 및 영어 POB의 짧은 본문과 일치합니다. 그러나 현 초안의 첫 문장 첫머리 ‘무거운 것은’은 뒤의 ‘당신보다 더 무거운 짐’과 중복되어 문법적으로도 의미상으로도 잘못되었습니다. 또한 카하나 히브리어 제시문에는 그리스어/영어 POB보다 긴 항아리 비유 계열의 문구가 함께 제시되어 있으므로, 이 번역은 영어 POB가 채택한 짧은 본문 범위에 한정된 것임을 본문 확정 단계에서 확인할 필요가 있습니다.
  naturalness: ‘당신보다 더 무거운 것은 지지 마십시오’는 현대 표준어 합쇼체로 자연스럽고, 원문의 비교 표현과 נשא(지다/짊어지다)를 불필요하게 ‘짐’으로 한정하지 않습니다. ‘어울리지 마십시오’도 잠언적 권고의 평이한 격식에 맞습니다.
  terminology: ‘부유한 사람’은 עשיר의 일반적 의미를 정확히 옮깁니다. 원문에 없는 ‘짐’을 삭제하여 표현의 범위를 보존했습니다. 기존 각주는 본문과 사실상 같은 내용을 반복할 뿐 유의미한 대안 독법을 제공하지 않으므로 삭제하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: 첫 문장의 중복 및 비문
    rationale: ‘무거운 것은 당신보다 더 무거운 짐을’은 동일한 의미를 중복하고 문장 성분이 어색합니다. 또한 원문의 목적어는 일반적인 ‘것’이지 명시적으로 ‘짐’이 아닙니다.
  - severity: medium
    issue: 히브리어 제시문과 영어 POB 사이의 본문 범위 차이
    rationale: 카하나의 복합 히브리어 제시문에는 부유한 자와 가난한 자, 질그릇과 솥의 비유가 추가로 보이는 반면, 그리스어 병행 본문과 영어 POB는 첫 두 절반행만 제공합니다. 번역문에는 영어 POB의 범위를 유지하되, 출판 전 절 번호·본문 전승의 배정을 사람이 확인해야 합니다.
  - severity: low
    issue: 기존 각주의 불필요한 반복
    rationale: 각주는 수정 전 본문의 ‘짐’이라는 구체화를 전제로 한 직역 안내이나, 수정 본문이 이미 원문에 가까운 표현을 사용하므로 남길 필요가 없습니다.
  revised_text: 당신보다 더 무거운 것은 지지 마십시오. 당신보다 더 부유한 사람과는 어울리지 마십시오.
  revised_footnotes: []
  revision_rationale: 첫 문장의 명백한 중복을 제거하고, 원문의 비교 대상과 목적어의 열린 범위를 유지했습니다. 영어 POB가 채택한 짧은 그리스어 계열 본문을 넘어서 히브리어의 추가 문구를 본문에 임의로 보충하지 않았습니다.
