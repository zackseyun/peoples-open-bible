  - severity: low
    issue: ‘당신에게 나가겠습니다’의 조사
    rationale: 히브리어 אֵלֶיךָ는 ‘당신에게/당신에게로’를 뜻합니다. ‘당신에게로 나가겠습니다’가 이동 방향을 더 자연스럽게 드러냅니다.
