lexical_decisions:
- source_word: וָאֲשַׁלְּחֵהוּ
  english_pob_choice: So I gave him over
  chosen_korean: 넘겨주셨습니다
  alternatives_korean:
  - 버려두셨습니다
  - 내버려두셨습니다
  - 보내셨습니다
  lexicon: HALOT
  rationale: שלח의 사역적 용법을 문맥상 심판적 ‘내어줌/넘겨줌’으로 이해해, 단순한 ‘보내다’보다 하나님이 그들을 그 상태에 맡기신 뉘앙스를 살렸습니다.
- source_word: בִּשְׁרִירוּת
  english_pob_choice: to the stubbornness
  chosen_korean: 완고함
  alternatives_korean:
  - 고집
  - 강퍅함
  - 자기 뜻 고집
  lexicon: HALOT
  rationale: בִּשְׁרִירוּת는 마음의 완고하고 뻣뻣한 태도를 가리키므로, 현대 한국어에서 자연스럽고 의미가 분명한 ‘완고함’으로 옮겼습니다.
- source_word: מוֹעֲצוֹתֵיהֶם
  english_pob_choice: in their own counsels
  chosen_korean: 자기들의 계획을 따라
  alternatives_korean:
  - 자기들의 꾀를 따라
  - 자기들의 모의에 따라
  - 자기들의 의논을 따라
  lexicon: HALOT
  rationale: מוֹעֵצָה는 ‘조언’보다 ‘계획/의도’의 뜻이 여기서 더 강하므로, 행동 방향을 드러내는 ‘계획을 따라’로 번역해 문맥적 의미를 분명히 했습니다.
theological_decisions:
- issue: ‘gave him over’의 심판적 뉘앙스
  chosen_reading: 하나님이 단순히 떠나보내신 것이 아니라, 그들을 그들의 완고함에 넘겨주신 것으로 번역했습니다.
  alternative_readings:
  - 보내셨습니다
  - 내버려두셨습니다
  rationale: 문맥은 언약적 징계와 방임의 심판을 함께 보여 주므로, ‘넘겨주다’가 원문의 신학적 힘을 가장 잘 보존합니다.
  doctrine_reference: 시편 81편의 언약-심판 문맥
- issue: 히브리어의 단수/복수 전환
  chosen_reading: 한국어에서는 자연스럽게 복수로 옮기되, 본문의 집합적 대상을 유지했습니다.
  alternative_readings:
  - 단수 ‘그를’로 유지
  - 문법을 완전히 평준화
  rationale: 원문은 집합적 단수 표지와 복수 동사를 함께 사용하므로, 한국어에서는 어색한 단수 표지를 피하되 집합적 대상이라는 본문 긴장을 훼손하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
