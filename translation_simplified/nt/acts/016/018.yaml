  preserved_meaning: Paul was seriously distressed rather than mildly annoyed.
  reasoning_layer_used: Lexical decision for διαπονηθείς
  rationale: The finite verb removes an awkward participle while retaining its strong emotional force.
- pob_phrase: it came out that very hour
  simplified_phrase: The spirit came out of her immediately
  preserved_meaning: The spirit obeyed the command without delay and left the girl.
  reasoning_layer_used: Lexical rationale for ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  rationale: “Immediately” states the idiom’s time sense directly, and the explicit subject clarifies the pronoun.
