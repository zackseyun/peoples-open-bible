  to: 그가 주 그의 하나님 앞에 기도하여 아뢰었습니다. “모든 육체의 영들의 하나님이여, 저에게 자비를 베푸시고 저와 제 아들들을 홍수의 물에서 구원하셨으며, 멸망의 자녀들을 멸망하게 하신 것처럼 저를 멸망하게 하지 않으셨나이다—”
