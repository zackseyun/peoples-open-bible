  category: meaning_retranslation
  from: For he said[a], “Surely they are my people, children who will not deal falsely”; so he became their Savior.
  to: For he said, “Surely they are my people, children who will not prove false to me”; so he became their Savior.
  rationale: The earlier lexical discussion rightly understood falsehood as broader than lying and 'children' as the people as a whole. The revision makes the expected relational faithfulness explicit without removing the irony created by their rebellion in verse 10.
