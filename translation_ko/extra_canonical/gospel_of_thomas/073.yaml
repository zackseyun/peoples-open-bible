review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the plentiful harvest, few workers, the imperative to entreat, and ⲡϫⲟⲉⲓⲥ as the contextually possible ‘주인.’ However, ‘보내 주시도록’ adds a benefactive nuance not expressed in the Coptic and does not adequately convey ⲛⲟⲩϫⲉ … ⲉⲃⲟⲗ (‘send/cast out’). ‘내보내시도록’ better preserves the verb’s force. The inferential transition is acceptable in context.
  naturalness: The revised wording remains modern formal-polite Korean. ‘추수할 곳으로’ is more idiomatic than the draft’s ‘추수에’ while retaining the directional sense of ⲉⲡⲱϩⲥ.
  terminology: ‘추수,’ ‘일꾼,’ ‘간청하십시오,’ and ‘주인’ are appropriate. The lexical note is retained but stated neutrally, without treating the contextual choice as a doctrinal conclusion. The English audit trail’s textual-comparison note is also supplied and anchored at the relevant term.
  issues:
  - severity: medium
    issue: ‘보내 주시도록’ weakens and supplements the source verb.
    rationale: ⲛⲟⲩϫⲉ ⲉⲃⲟⲗ means to send/cast out. The Korean benefactive ‘-아/어 주다’ is not present in the source; ‘내보내시도록’ is both more precise and natural.
  - severity: low
    issue: The lexical footnote is anchored at the end of the quotation rather than at ‘주인.’
    rationale: A footnote about ⲡϫⲟⲉⲓⲥ should be attached directly to its Korean rendering.
  - severity: low
    issue: The English audit trail’s textual-comparison note is absent.
    rationale: A concise note records that this saying lacks wording found in the Matthean and Lukan parallels, without implying that those texts govern the translation.
