    prior_rendering: My eye will not spare you, nor will I have pity
    new_rendering: I will not spare you or have pity
    rationale: The eye construction is an idiom for sparing someone out of compassion; direct English preserves both the refusal to spare and the refusal of pity.
  - source_phrase: דְרָכַיִךְ עָלַיִךְ אֶתֵּן
    prior_rendering: I will bring your ways upon you
    new_rendering: I will repay you for your ways
    rationale: The expression announces recompense for conduct, not the imposition of a new manner of life.
