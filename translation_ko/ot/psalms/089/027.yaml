  rationale: 원문은 직접적인 신앙고백/호칭이므로, 한국어에서는 하나님께 드리는 말로서 경어를 유지하는 것이 화행과 경외감을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
