    15. 블레셋 사람에게서는 백 배나 가져왔느니라 이삭이 심히 커지매 블레셋 사람들이 그를 시기하여 그리고 아브라함의 종들이 아브라함 사는 동안에 판 모든 우물을 블레셋 사람들이 막았느니라.

    16. 아브라함이 죽은 후에 거기에 흙이 가득하였느니라 아비멜렉이 이삭에게 이르되 우리를 떠나라 네가 우리보다 훨씬 강하였으니 이삭이 일곱째 주의 첫째 해에 그곳을 떠나 그랄 골짜기에 장막을 치고 그 아버지 아브라함의 종들이 팠던 우물들을 다시 팠고, 그 아버지 아브라함이 죽은 후에 블레셋 사람들이 막았더라. 그리고 그들은 그의 아버지 아브라함이 부르던 이름으로 그들의 이름을 불렀습니다. 그리고 이삭의 종들은 시내에 우물을 파서 생수를 얻었습니다. 그랄 목자들이 이삭의 목자들과 다투어 이르되 이 물은 우리의 것이라 하매 그리고 이삭은 그 우물 이름을 다툼이라 불렀습니다. 그들이 우리와 다투었기 때문입니다. 그들이 또 다른 우물을 팠더니 그들이 또 그것으로 다투었으므로 그 이름을 원수라 불렀더라. 그가 거기서 옮겨 다른 우물을 팠더니 그들이 그것으로 인해 다투지 아니하였더라 그가 그 이름을 넓은 곳이라 불렀더라 이삭이 이르되 이제 주님께서 우리를 위하여 공간을 마련하셨으므로 우리가 이 땅에서 번성하게 되었느니라 그리고 그는 마흔넷째 희년 첫째 주의 첫째 해에 거기서 맹세의 우물로 올라갔다. 그 날 정월 초하루 밤에 주님께서 그에게 나타나 이르시되 나는 네 아버지 아브라함의 하나님이니 두려워하지 말라 내 종 아브라함을 위하여 내가 너와 함께 있어 네게 복을 주어 네 자손이 땅의 모래와 같이 크게 번성하게 하리라 하신지라 그리고 그는 그의 아버지 아브라함이 처음 쌓은 제단을 거기서 쌓고 주님의 이름을 부르고 그의 아버지 아브라함의 하나님께 희생을 바쳤습니다. 그리고 그들은 우물을 파서 생수를 얻었습니다. 이삭의 종들이 다른 우물을 팠으나 물을 얻지 못하여 와서 이삭에게 물을 얻지 못하였다고 말하니라. 이삭이 이르되 내가 오늘 블레셋 사람들에게 맹세하였더니 이런 일이 우리에게 일어났느니라. 그가 그 곳 이름을 맹세의 우물이라 불렀으니 이는 그가 거기서 아비멜렉과 그의 친구 아훗삿과 그의 군대 장관 비골에게 맹세하였음이더라. 이삭은 그 날에 자기가 그들과 화친하기로
    강제로 맹세한 줄을 알았더라. 그 날에 이삭이 블레셋 사람을 저주하여 이르되 블레셋 사람이 모든 나라 가운데서 진노와 분으로 저주를 받을지어다 주님께서 그들을 치욕과 저주와 분냄과 분으로 죄 많은 나라의 손 곧 깃딤의 손에 붙이시기를 원하며 원수의 칼과 깃딤의 칼을 피하는 자들은 의로운 자들이 그들을 천하에서 뽑아 버리게 하소서 그들은 원수요 미워함이 되리이다 블레셋 사람의 모든 자손은 다 멸망하여 땅에서 뽑힐 것이며 이 갑도리 사람의 이름이나 자손이 다시는 땅에 남지 아니하리라. 그가 열국 중에 숨어 거기서 뽑히리라 만일 그가 음부(히브리어: Sheol)에 떨어지면 거기서는 그의 심판이 더할 것이요 거기서는 그에게 평안이 없으리라 만일 그가 사로잡혀 가면 길에서 그의 생명을 노리는 자들의 손에 죽임을 당하고 온 땅에 이름도 없고 자손도 남지 않게 되리니 그가 영원한 저주를 받을 것임이니라 이에 대하여 그에 관하여 하늘 판에 기록되고 정해졌으니 심판 날에 그에게 행하여 땅에서 뽑히리라 하였느니라.'
  to: '1. 아브라함이 죽은 뒤에 주님께서 그의 아들 이삭에게 복을 주셨습니다. 이삭은 헤브론에서 일어나 가서 환시의 우물에 머물렀습니다. 때는 이 희년의 셋째 주 첫해였습니다.

    2. 그리고 넷째 주간의 첫해에, 아브라함 시대에 있었던 앞선 기근 외에도 그 땅에 기근이 임했습니다.

    3. 야곱은 렌틸콩 죽을 끓였고, 에서는 들에서 배고픈 채로 왔습니다. 그가 자기 형 야곱에게 말했습니다. 「이 밀죽을 좀 주십시오.」 그러자 야곱이 그에게 말했습니다. 「당신의 장자권을 나에게 파십시오.」

    4. “내가 너에게 빵과 이 렌틸콩 스튜도 주겠다.” 그리고 에서가 속으로 말했습니다. “나는 이제 죽게 생겼다;”

    5. “이 장자권이 내게 무슨 소용이 있겠습니까?”라고 말했습니다. 그는 야곱에게 “내가 그것을 드립니다”라고 하였습니다. 야곱이 말했습니다.

    6. “오늘 내게 맹세하십시오.” 에서가 야곱에게 맹세했습니다. 야곱은 자기 형 에서에게 빵과 죽을 주었고, 에서는 배부를 때까지 먹었습니다. 에서는 자기 장자권을 팔았습니다. 그러므로 야곱이 그의 장자권을 대가로 에서에게 준 밀죽 때문에, 에서의 이름은 에돔이라 불리게 되었습니다.

    7. 야곱은 자라서 아버지의 명령을 지켰습니다. 그러나 에서는 그 명령을 저버렸습니다. 그리고 그 땅에 기근이 있었습니다. 그가 와서…

    8. 이삭은 이 주간의 둘째 해에 이집트로 내려가려 했고, 그랄에 있는 블레셋 사람들의 왕 아비멜렉에게 갔습니다.

    9. 그리고 주님께서 그에게 나타나 말씀하셨습니다. “이집트로 내려가지 마십시오. 내가 당신에게 말하는 땅에 머무르십시오. 그 땅에서 나그네로 지내십시오. 내가 당신과 함께 있고 당신에게 복을 주겠습니다. 이는 당신에게….”

    10. 그리고 네 씨에게 이 모든 땅을 주며, 내가 네 아버지 아브라함에게 맹세한 나의 맹세를 굳게 세우겠습니다. 또 네 씨를 하늘의 별들처럼 많게 하며, 네 씨에게 이 모든 땅을 주겠습니다. 그리고 그들은 스스로 복을 빌 것입니다.

    11. “당신의 씨로 말미암아 땅의 모든 민족이 복을 받을 것입니다. 이는 당신의 아버지가 내 음성에 순종하고, 내가 맡긴 의무와 내 명령들과 내 법들과 내 규례들과 내 언약을 지켰기 때문입니다. 그리고 이제 내 음성에 귀를 기울이고 이 땅에 거주하십시오.” 그는 그랄에서 세 이레, 곧 스물한 해 동안 살았습니다. 아비멜렉은 그에 관하여 명령을 내렸습니다.

    12. 그리고 그에게 속한 모든 것에 관하여, 「그를 만지는 사람은 누구나, 또는 그에게 속한 어떤 것이든지」라고 말하면서,

    13. 그는 반드시 죽어야 합니다.” 그리고 이삭은 블레셋 땅에서 번성하여 많은 재산을 가졌습니다.

    14. 그에게는 가축과 양과 낙타와 나귀와 많은 재물이 있었고, 그는 그 땅에 씨를 뿌렸습니다.

    15. 그가 블레셋 사람들 가운데서 백 배를 거두었습니다. 이삭은 매우 크게 번성하였고, 블레셋 사람들은 그를 시기하였습니다. 그리고 블레셋 사람들은 아브라함의 종들이 아브라함 생전에 판 모든 우물을 메워 버렸습니다.

    16. 아브라함이 죽은 뒤에 블레셋 사람들이 그 우물들을 흙으로 메웠습니다. 아비멜렉이 이삭에게 말했습니다. “우리에게서 떠나가십시오. 당신이 우리보다 훨씬 더 강해졌기 때문입니다.” 이삭은 그곳을 떠나 제7주간의 첫해에 그랄 골짜기에 가서 진을 쳤습니다. 그들은 이삭의 아버지 아브라함의 종들이 팠고 블레셋 사람들이 아브라함이 죽은 뒤에 메워 버렸던 물의 우물들을 다시 팠습니다. 그리고 아브라함이 부르던 이름대로 그 우물들의 이름을 불렀습니다. 이삭의 종들은 골짜기에서 우물을 파고 살아 있는 물을 얻었습니다. 그랄의 목자들이 이삭의 목자들과 다투며 말했습니다. “그 물은 우리 것입니다.” 이삭은 그 우물의 이름을 “다툼”이라 불렀습니다. 그들이 이삭의 사람들과 다투었기 때문입니다. 그들은 또 다른 우물을 팠고, 그 우물 때문에도 다투었으므로 이삭은 그 이름을 “적대”라 불렀습니다. 이삭은 거기서 옮겨 가서 또 다른 우물을 팠는데, 그 일로는 다투지 않았으므로 그 이름을 “넓은 곳”이라 불렀습니다. 이삭이 말했습니다. “이제 야훼께서 우리를 위하여 자리를 넓혀 주셨으니, 우리는 이 땅에서 번성할 것입니다.”


    그는 거기서 올라가 제44희년의 첫째 주간 첫해에 맹세의 우물로 갔습니다. 그 밤, 곧 첫째 달 첫날 새벽에 야훼께서 그에게 나타나 말씀하셨습니다. “나는 당신의 아버지 아브라함의 하나님입니다. 두려워하지 마십시오. 내가 당신과 함께 있으며, 당신에게 복을 주고 당신의 씨를 땅의 모래처럼 크게 번성하게 하겠습니다. 이는 내 종 아브라함을 위함입니다.” 그는 거기에서 그의 아버지 아브라함이 처음 제단을 쌓았던 곳에 제단을 쌓았습니다. 그리고 야훼의 이름을 부르고, 그의 아버지 아브라함의 하나님께 제물을 드렸습니다. 그들이 우물을 파서 살아 있는 물을 얻었습니다. 이삭의 종들이 또 다른 우물을 팠으나 물을 얻지 못했습니다. 그들은 이삭에게 와서 물을 얻지 못했다고 알렸습니다. 이삭이 말했습니다. “오늘 내가 블레셋 사람들에게 맹세하였는데, 이런 일이 우리에게 일어났습니다.” 그래서 그는 그곳의 이름을 맹세의 우물이라 불렀습니다. 거기에서 아비멜렉과 그의 동료 아훗삿과 그의 군대 지휘관 피골에게 맹세하였기 때문입니다. 이삭은 그날 자기가 그들과 평화를 이루기 위하여 억지로 맹세하였음을 알게 되었습니다.


    그날 이삭은 블레셋 사람들을 저주하며 말했습니다. “블레셋 사람들은 모든 민족 가운데서 분노와 격노 아래 저주받을 것입니다. 야훼께서 그들을 수모와 저주와 분노와 격노를 당하도록 죄 많은 민족들의 손, 곧 깃딤의 손에 넘겨주시기를 바랍니다. 원수의 칼과 깃딤의 손에서 살아남는 자들은 의로운 백성이 심판으로 하늘 아래에서 그들을 뿌리째 뽑게 하십시오. 그들이 땅 위에서 대대로 내 자녀들의 원수와 미워하는 자들이 될 것이기 때문입니다. 분노의 심판 날에 그들에게는 살아남은 자도 피하는 자도 남지 않을 것입니다. 블레셋의 모든 씨는 멸망과 뿌리 뽑힘과 땅에서의 제거를 위하여 정해졌으며, 이 카프토르 사람들에게는 이제 땅 위에 남은 자나 씨가 더 이상 남지 않을 것입니다. 그가 하늘까지 올라간다 해도 거기서 끌려 내려올 것이며, 땅속으로 가라앉는다 해도 거기서 끌려 나올 것입니다. 그가 민족들 가운데 숨는다 해도 거기서 뿌리째 뽑힐 것이며, 스올로 내려간다 해도 거기서 그의 심판은 더욱 커질 것이고, 그에게는 거기에서도 평안이 없을 것입니다. 그가 포로로 끌려간다 해도, 길에서 그의 생명을 노리는 자들의 손에 죽임을 당할 것이며, 온 땅에 그에게는 이름도 씨도 남지 않을 것입니다. 그가 영원한 저주로 들어갈 것이기 때문입니다.”


    이와 같이 심판의 날에 그에게 행하시어 그를 땅에서 뿌리째 뽑으시도록, 하늘의 판에 그에 관하여 기록되고 명령되었습니다.'
