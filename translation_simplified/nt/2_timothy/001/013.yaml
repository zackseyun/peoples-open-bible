  preserved_meaning: Timothy must retain the apostolic model and continue to follow it.
  reasoning_layer_used: Lexical decision for ὑποτύπωσιν and ἔχε
  rationale: The new wording makes the relationship between keeping and following a pattern easier to grasp.
- pob_phrase: sound words
  simplified_phrase: healthy teaching
  preserved_meaning: Paul’s words provide reliable teaching that is spiritually sound.
  reasoning_layer_used: Lexical decision for ὑγιαινόντων λόγων
  rationale: “Healthy” preserves the Greek metaphor while “teaching” makes its intended sense clear.
- pob_phrase: in the faith and love that are in Messiah Jesus
  simplified_phrase: Do this in the faith and love found in Messiah Jesus
  preserved_meaning: Faith and love rooted in Messiah Jesus characterize how Timothy keeps the pattern.
  reasoning_layer_used: Theological decision on ἐν πίστει καὶ ἀγάπῃ
  rationale: A new sentence clearly connects faith and love with Timothy’s manner of obeying the command.
