translation:
  text: He shapes the clay with his arm and bends down over the work at his feet, putting his strength into it[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “before his feet he bends his strength”; the difficult expression can emphasize either his bent posture or his exertion.
