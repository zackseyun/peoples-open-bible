id: ACT.26.25
reference: Acts 26:25
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
translation:
  text: But Paul said, “I am not out of my mind, most excellent Festus, but I am speaking words of truth and sound judgment.”
  philosophy: dynamic
lexical_decisions:
- source_word: δὲ
  chosen: But
  alternatives:
  - And
  - Now
  lexicon: BDAG
  rationale: Marks contrast with Festus's accusation in the previous verse; 'But' best conveys the adversative force in natural English.
- source_word: μαίνομαι
  chosen: am not out of my mind
  alternatives:
  - am not insane
  - am not mad
  lexicon: BDAG
  rationale: The verb denotes being mad or insane. 'Out of my mind' is idiomatic modern English that preserves the sense without archaic tone.
- source_word: φησίν
  chosen: said
  alternatives:
  - says
  lexicon: BDAG
  rationale: Although formally present ('he says'), this is a historical present. English narrative style normally renders it as simple past here.
- source_word: κράτιστε
  chosen: most excellent
  alternatives:
  - most noble
  - your excellency
  lexicon: BDAG
  rationale: A superlative honorific used for high officials. 'Most excellent' is established and accurate in Acts for formal address to Roman governors, while remaining understandable.
- source_word: ἀληθείας
  chosen: of truth
  alternatives:
  - 'true'
  - truthful
  lexicon: BDAG
  rationale: The genitive is retained with 'words of truth' to reflect the Greek construction and emphasize the character of Paul's speech.
- source_word: σωφροσύνης
  chosen: sound judgment
  alternatives:
  - soberness
  - soundness of mind
  - reason
  lexicon: BDAG
  rationale: The noun conveys sanity, self-control, and sober-mindedness. 'Sound judgment' communicates rational, measured speech in clear modern English.
- source_word: ῥήματα
  chosen: words
  alternatives:
  - things
  - utterances
  lexicon: BDAG
  rationale: A straightforward rendering that preserves the concrete plural noun rather than paraphrasing.
- source_word: ἀποφθέγγομαι
  chosen: I am speaking
  alternatives:
  - I utter
  - I declare
  lexicon: BDAG
  rationale: The verb can denote speaking out or declaring. 'I am speaking' fits the immediate reply context and avoids overstating rhetorical force, while the object 'words' preserves the formal flavor.
