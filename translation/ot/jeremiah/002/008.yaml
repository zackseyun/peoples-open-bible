theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Whether to make the final object explicitly 'idols'
  chosen_reading: things that do not profit
  alternative_readings:
  - idols that do not profit
  - what is useless
  rationale: The Hebrew says literally 'after not-profiting [things/ones] they went.' Since the object is left implicit, the translation preserves that openness while still producing natural English. This avoids importing a more explicit object than the text states, even though idols are clearly implied in context.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy; never paraphrase beyond what the source text warrants'
