lexical_decisions:
- source_word: συναγαγών
  chosen: after gathering
  alternatives:
  - having gathered
  - when I gathered
  lexicon: LSJ
  rationale: Aorist participle of συνάγω, naturally rendered as a prior action leading into the main verbs. 'After gathering' gives clear English sequence without over-paraphrasing.
- source_word: ἐπὶ τὸν λεγόμενον Ποταμόν
  chosen: to the river called the River
  alternatives:
  - to the so-called River
  - to the place called the River
  - to the river named Potamos
  lexicon: LSJ
  rationale: λεγόμενον means 'called/named.' Ποταμός is literally 'River' and appears here as a place designation. Retaining 'the river called the River' preserves the Greek wording and the likely toponymic force better than smoothing it away.
- source_word: παρενεβάλομεν
  chosen: we camped
  alternatives:
  - we encamped
  - we made camp
  lexicon: LSJ
  rationale: The verb means to encamp. 'We camped' is idiomatic modern English; 'encamped' is possible but slightly more archaic.
- source_word: αὐτόθι
  chosen: there
  alternatives:
  - in that place
  - on the spot
  lexicon: LSJ
  rationale: Simple adverb of place; 'there' is the most natural equivalent.
- source_word: ἡμέρας τρεῖς
  chosen: for three days
  alternatives:
  - three days
  lexicon: LSJ
  rationale: Accusative of duration; 'for three days' makes the temporal force explicit in English.
- source_word: κατέμαθον αὐτούς
  chosen: I examined them
  alternatives:
  - I examined them
  - I took note of them
  - I reviewed them
  lexicon: LSJ
  rationale: Active rendering synchronized with this printed Greek unit and its main English; the prior lexicon label is historical, not a new consultation.
theological_decisions:
- issue: Narrative person shift
  chosen_reading: we camped ... I examined them
  alternative_readings:
  - we examined them
  rationale: The Greek distinguishes the group's camping from Ezra's personal examination; the repaired boundary does not regularize the persons.
