theological_decisions:
- issue: 무수함을 나타내는 표현
  chosen_reading: ‘셀 수 없이 많았습니다’로 옮겨 전쟁 동원 규모의 압도성을 살렸습니다.
  alternative_readings:
  - ‘헤아릴 수 없었습니다’
  - ‘무수했습니다’
  rationale: 본문은 실제로 수를 세지 못한다는 의미를 넘어, 매우 큰 다수임을 강조하는 문맥이므로 한국어 과장법으로 힘을 유지하는 것이 적절합니다.
  doctrine_reference: 문맥상 역사 서술의 수사이며 교리적 쟁점은 없습니다.
