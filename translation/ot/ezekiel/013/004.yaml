id: EZK.13.4
reference: Ezekiel 13:4
source:
  edition: WLC
  text: כְּ/שֻׁעָלִ֖ים בָּ/חֳרָב֑וֹת נְבִיאֶ֥י/ךָ יִשְׂרָאֵ֖ל הָיֽוּ׃
translation:
  text: Your prophets, O Israel, have been like foxes[a] among ruins.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “jackals.”
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשֻׁעָלִים
  chosen: like foxes
  alternatives:
  - like jackals
  lexicon: HALOT
  rationale: The term denotes foxes or a similar wild canid. 'Foxes' is the standard main rendering; the broader identification remains footnoted.
- source_word: בָּחֳרָבוֹת
  chosen: among ruins
  alternatives:
  - in the ruins
  - in waste places
  lexicon: HALOT
  rationale: The plural noun describes ruined or desolate places. 'Among ruins' preserves the setting and reads naturally with foxes.
- source_word: נְבִיאֶיךָ
  chosen: your prophets
  lexicon: HALOT
  rationale: Construct plural of 'prophets' with 2ms suffix, directly addressed to Israel/Jerusalem in the surrounding context. 'Your prophets' preserves the possessive force without implying divine endorsement.
- source_word: יִשְׂרָאֵל
  chosen: Israel
  rationale: 'Direct vocative/appositional address. Retaining ''Israel'' preserves the prophetic directness. In English, setting it off with commas clarifies that it is a form of address: ''your prophets, Israel.'''
- source_word: הָיוּ
  chosen: have been
  alternatives:
  - were
  lexicon: HALOT
  rationale: The perfect describes the prophets' established likeness in the accusation. The English present perfect fits the direct address.
