id: PSA.80.8
reference: Psalms 80:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גֶּ֭פֶן מִ/מִּצְרַ֣יִם תַּסִּ֑יעַ תְּגָרֵ֥שׁ גּ֝וֹיִ֗ם וַ/תִּטָּעֶֽ/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/008.yaml
  text: You brought a vine out of Egypt[a][b]; you drove out nations and planted it.
  footnotes:
  - marker: a
    text: The 'vine' is a metaphor for Israel.
    reason: cross_reference
  - marker: b
    text: Or 'you caused a vine to journey from Egypt' or 'you uprooted a vine from Egypt.' The Hebrew verb can carry the sense of causing to set out or removing/transplanting.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 이집트에서 포도나무를 옮겨 오시고[a], 민족들을 쫓아내시고 그것을 심으셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옮겨 오시고’로 옮긴 히브리어 동사는 ‘떠나게 하다, 이동시키다’ 또는 ‘뽑아 옮기다’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘포도나무’는 여기서 이스라엘을 가리키는 비유입니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  english_pob_choice: God of hosts
  chosen_korean: 만군의 하나님
  alternatives_korean:
  - 하늘 군대의 하나님
  - 군대들의 하나님
  lexicon: HALOT
  rationale: צְבָאוֹת의 폭넓은 의미를 살리면서 한국어 성경의 자연스러운 호칭으로는 ‘만군의 하나님’이 가장 직접적이고 익숙합니다.
- source_word: הֲשִׁיבֵנוּ
  english_pob_choice: restore us
  chosen_korean: 우리를 회복하여 주십시오
  alternatives_korean:
  - 우리를 돌이켜 주십시오
  - 우리를 되돌려 주십시오
  lexicon: HALOT
  rationale: שוב의 사역형은 ‘돌아오게 하다/회복하다’의 뜻을 함께 가지므로, 본문 반복구의 청원성을 살려 ‘회복하여 주십시오’로 옮겼습니다.
- source_word: פָּנֶיךָ
  english_pob_choice: your face
  chosen_korean: 주의 얼굴
  alternatives_korean:
  - 주의 임재
  - 주의 낯
  lexicon: HALOT
  rationale: 직역상 ‘얼굴’이지만, 하나님의 호의와 임재를 가리키는 관용구이므로 본문에서는 투명성을 위해 ‘주의 얼굴’을 유지했습니다.
- source_word: וְנִוָּשֵׁעָה
  english_pob_choice: and we will be saved
  chosen_korean: 그러면 우리가 구원을 얻겠습니다
  alternatives_korean:
  - 그러면 우리가 구원받겠습니다
  - 그러면 우리가 구출되겠습니다
  lexicon: HALOT
  rationale: נושע의 결과를 한국어로 자연스럽게 풀되, 히브리어가 지닌 넓은 ‘구출/구원’의 범위를 살려 ‘구원을 얻겠습니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 얼굴을 비추어 달라는 표현의 의미
  chosen_reading: 하나님의 호의와 임재를 구하는 청원으로 이해하여 ‘주의 얼굴을 비추어 주십시오’로 유지했습니다.
  alternative_readings:
  - 주의 임재를 나타내 주십시오
  - 주께서 우리를 기쁘게 바라보십시오
  rationale: 히브리어 관용구를 해석어로 완전히 바꾸지 않고, 본문의 시적·신학적 긴장을 보존하는 것이 더 적절합니다.
  doctrine_reference: 시편의 표상 언어와 언약적 호의
- issue: ‘구원을 얻겠습니다’의 범위
  chosen_reading: 역사적 구출과 종말론적 구원을 모두 배제하지 않는 넓은 표현으로 유지했습니다.
  alternative_readings:
  - 우리가 건짐을 받겠습니다
  - 우리가 구출되겠습니다
  rationale: 본문은 구원의 범위를 좁히지 않으므로, 시편의 전형적 구원 언어를 살리는 번역이 더 정확합니다.
  doctrine_reference: 시편의 구원 어휘
