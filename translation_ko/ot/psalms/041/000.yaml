  - 다윗을 위한
  lexicon: HALOT
  rationale: ל의 의미가 저자성·소속·헌정 사이에서 열려 있으므로, 영어 POB의 "of David"에 맞추어 한국어도 직접 확정하지 않는 "다윗의"로 처리했습니다.
