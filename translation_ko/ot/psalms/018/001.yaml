theological_decisions:
- issue: 시편 표제의 예배적 수신자와 발화 방향
  chosen_reading: 지휘자에게로 향하는 표제이지만, 핵심 내용은 다윗이 야훼께 드린 노래의 말입니다.
  alternative_readings:
  - 표제를 단순히 저자 표기로만 읽는 해석
  - 야훼께 직접 드린 기도문으로만 단정하는 해석
  rationale: 히브리어는 지휘자 지시문, 다윗의 소속/관련 표지, 그리고 야훼께 한 발화를 함께 담고 있으므로, 어느 한 요소만 지우지 않도록 문장 구조를 보존했습니다.
  doctrine_reference: 시편 표제의 문학적 기능에 대한 본문 우선 해석
- issue: ‘손’ 표현의 신학적 함의
  chosen_reading: ‘손에서’는 단순한 신체 부위가 아니라 권세와 통제 아래 있던 상태에서의 구원을 뜻합니다.
  alternative_readings:
  - 물리적 손에서의 탈출
  - 일반적 도움의 의미
  rationale: 영어 POB의 주석대로 히브리 관용구를 유지하여, 야훼의 구원이 دشمن의 지배로부터의 해방이라는 의미를 보존했습니다.
  doctrine_reference: 본문 관용구의 의미 범위
