  meaning_decisions:
  - source_phrase: καὶ κράξας φωνῇ μεγάλῃ λέγει
    prior_rendering: And crying out with a loud voice, he says
    new_rendering: He cried out loudly
    rationale: The outcry and speech introduction describe a single act; combining them preserves its force without an awkward participle or an unexplained tense shift.
  - source_phrase: Τί ἐμοὶ καὶ σοί
    prior_rendering: What have I to do with you
