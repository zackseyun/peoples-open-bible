  footnotes:
  - marker: a
    reason: cultural_note
    text: Station transliterates the Latin loanword statio. The following dialogue identifies it as fasting;
      no extra vigil or fixed weekday is asserted. The restored opening supplies the mountain, thanksgiving,
      shepherd and early-morning question absent from old reader50.
  - marker: b
    reason: textual_variant
    text: The working Greek brackets which you fast in I.2. Michigan917 printed45 partly preserves this
      phrase, while its apparatus reports the Latin versions omit it. The translation retains the disclosed
      working phrase, not unanimous wording.
  - marker: c
    reason: textual_variant
    text: Working I.3 retains to the Lord; Michigan printed45 has to God. The translation does not silently
      harmonize the two. Vocative sir addresses the shepherd; Lord and God otherwise name the divine referent.
  - marker: d
    reason: textual_variant
    text: 'Bounded restored reply, I.3: Michigan917 printed46 papyrus5 lines11–14 preserves Yes, I say,
      sir, you will make me happy if I learn the fast acceptable to God. At the end the damaged divine
      abbreviation is printed [theta]omega; the expanded [Theoi] in the working source marks that damage
      and editorial expansion. Palatina printed143 directly corroborates the reply’s sense. Bonner reports
      Hamburg and Coptic support. Athos and Vulgata printed76 omit the reply; no claim of unanimous support
      or fresh manuscript-photo collation is made.'
  - marker: e
    reason: textual_variant
    text: The working I.4 brackets to God. Michigan printed46 loses the lower part of this page, including
      this occurrence; its apparatus reports support from Athos, Hamburg and Coptic and omission in Latin.
      Vulgata printed76 and Palatina printed143 differ in the surrounding wording. Retained editorial
      brackets must not be counted as preserved Michigan letters.
  - marker: f
    reason: textual_variant
    text: Working I.5 you will complete is Gebhardt’s conjecture against reported Athos you do. Michigan
      printed47 has teleis, with an uncertain possible accent, and the Latin traditions have consummabis.
      The working future promise and all its ethical conditions are retained; no claim is made that Michigan
      preserves that exact future spelling. The final working God contrasts with Michigan Lord.
  - marker: g
    reason: textual_variant
    text: Michigan printed47 shows the words concerning fasting in II.1 marked for deletion by dots over
      the letters. The working Greek and both printed Latin versions retain the phrase. A dotted deletion
      is not a physical lacuna.
  - marker: h
    reason: textual_variant
    text: Working II.2 has faithful, pleasing, honored. Michigan printed47 has most faithful, pleasing
      to him, going away, with damage in the last word; its apparatus suggests that the Athos honored
      wording may be corrupt. The printed Latin versions include the journey and strongly commend the
      servant. This draft retains the working honored reading and does not conflate all forms. Servant
      follows current project policy while the ownership, promised freedom and inheritance remain explicit.
  - marker: i
    reason: textual_variant
    text: 'Working II.2 brackets that I planted and until I come. Much of this instruction is supplied
      in the Michigan edition: printed47 explicitly says no letters are legible in lines18–23. Both Latin
      versions describe attaching stakes to vines; this working Greek is rendered fence, as in the older
      reader, without claiming the Latin agricultural wording is identical.'
  - marker: j
    reason: textual_variant
    text: Working II.5 brackets and of the field. Michigan loses a whole leaf spanning the central story,
      roughly II.3–8, so it cannot supply a vote for every clause here. The complete working Greek and
      printed Latin traditions supply the narrative; a papyrus lacuna is not a witness omission.
  - marker: k
    reason: textual_variant
    text: Working II.5 brackets all and greatly. The English retains both disclosed editorial words. It
      also restores the vines flourishing, rather than joining the master’s inspection directly to the
      later food-sharing conclusion.
  - marker: l
    reason: textual_variant
    text: The1891 apparatus calls II.7 I gave him a Hollenberg conjecture against reported Athos I promised,
      with versional support. The printed Latin narratives directly distinguish the promised freedom from
      the command. This draft retains the disclosed working distinction and all conditions.
  - marker: m
    reason: textual_variant
    text: Working II.8 names the son’s agreement. Both printed Latin versions also name the friends here.
      Their additional subject is reported, not silently inserted into the working Greek. Co-heir means
      sharing the inheritance, not replacement of the son.
  - marker: n
    reason: textual_variant
    text: The1891 II.9 subject his master/householder was Hollenberg’s version-supported insertion, absent
      in reported Athos. Michigan printed48 independently preserves much of householder with damaged ends.
      The draft retains the working subject; the Vulgata also mentions calling friends, while Palatina
      has the householder dining. No extra gathering is added here.
  - marker: o
    reason: textual_variant
    text: Working II.9 brackets the food sent to him by the master. Michigan printed48 partly preserves
      this stretch and supplies other letters. Its received/took wording differs slightly from the working
      took up; printed Latin versions retain the taking-enough and sharing-rest sequence. Bracketed supplements
      are not presented as wholly preserved papyrus ink.
  - marker: p
    reason: textual_variant
    text: Working II.11 has his action and his food which he received. Michigan printed49 instead explicitly
      names the servant’s action, omits the food possessive, and still has received. Both Latin versions
      have food sent by the master. This draft makes the servant the actor and recipient from the working
      context; it does not add a second food distribution or substitute sent for received.
