  meaning_decisions:
  - source_phrase: וַיַּעֲבֹר יְהוֹרָם עִם שָׂרָיו וְכָל הָרֶכֶב עִמּוֹ
    prior_rendering: So Jehoram crossed over with his commanders and all the chariots with him
    new_rendering: So Jehoram set out with his commanders and his entire chariot force
    rationale: This describes a military expedition, without specifying a particular crossing; the collective noun denotes the accompanying chariot force.
  - source_phrase: וַיְהִי קָם לַיְלָה וַיַּךְ אֶת אֱדוֹם
    prior_rendering: And it happened that he arose by night and struck Edom
    new_rendering: He rose during the night and attacked the Edomites
    rationale: The narrative formula needs no separate English clause, and “attacked the Edomites” clearly conveys combat without claiming a decisive victory.
  - source_phrase: וְאֵת שָׂרֵי הָרָכֶב
    prior_rendering: and the commanders of the chariots
    new_rendering: as well as their chariot commanders[a]
    rationale: The direct-object marker favors taking these commanders as another group attacked, belonging to Edom; the serious alternative places Jehoram’s commanders within the encirclement.
  footnote_kinds:
