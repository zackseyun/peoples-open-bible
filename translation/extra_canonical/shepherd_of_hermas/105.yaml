source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Ἐκ δὲ τοῦ ὄρους τοῦ ἑνδεκάτου, οὗ ἦσαν δένδρα καρπῶν πλήρη, ἄλλοις καὶ ἄλλοις καρποῖς κεκοσμημένα,
    οἱ πιστεύσαντες τοιοῦτοί εἰσιν· 2. οἱ παθόντες ὑπὲρ τοῦ ὀνόματος [τοῦ υἱοῦ τοῦ Θεοῦ], οἳ καὶ προθύμως
    ἔπαθον ἐξ ὅλης τῆς καρδίας καὶ παρέδωκαν τὰς ψυχὰς αὐτῶν. 3. Διατί οὖν, φημί, κύριε, πάντα μὲν τὰ
    δένδρα καρποὺς ἔχει, τινὲς δὲ ἐξ αὐτῶν καρποὶ εὐειδέστεροί εἰσιν; Ἄκουε, φησίν· ὅσοι ποτὲ ἔπαθον διὰ
    τὸ ὄνομα, ἔνδοξοί εἰσι παρὰ τῷ Θεῷ, καὶ πάντων τούτων αἱ ἁμαρτίαι ἀφῃρέθησαν, ὅτι ἔπαθον διὰ τὸ ὄνομα
    τοῦ υἱοῦ τοῦ Θεοῦ. διατί δὲ οἱ καρποὶ αὐτῶν ποικίλοι εἰσίν, τινὲς δὲ ὑπερέχοντες, ἄκουε. 4. ὅσοι,
    φησίν, ἐπ᾿ ἐξουσίαν ἀχθέντες ἐξητάσθησαν καὶ οὐκ ἠρνήσαντο, ἀλλ᾿ ἔπαθον προθύμως, οὗτοι μᾶλλον ἐνδοξότεροί
    εἰσι παρὰ τῷ Κυρίῳ· τούτων ὁ καρπός ἐστιν ὁ ὑπερέχων. ὅσοι δὲ δειλοὶ καὶ ἐν δισταγμῷ ἐγένοντο καὶ
    ἐλογίσαντο ἐν ταῖς καρδίαις αὐτῶν πότερον ἀρνήσονται ἢ ὁμολογήσουσι, καὶ ἔπαθον, τούτων οἱ καρποὶ
    ἐλάττους εἰσίν, ὅτι ἀνέβη ἐπὶ τὴν καρδίαν αὐτῶν ἡ βουλὴ αὕτη· πονηρὰ γὰρ ἡ βουλὴ αὕτη, ἵνα δοῦλος
    κύριον ἴδιον ἀρνήσηται. 5. βλέπετε οὖν ὑμεῖς οἱ ταῦτα βουλευόμενοι, μήποτε ἡ βουλὴ αὕτη διαμείνῃ ἐν
    ταῖς καρδίαις ὑμῶν, καὶ ἀποθάνητε τῷ Θεῷ. ὑμεῖς δὲ οἱ πάσχοντες ἕνεκεν τοῦ ὀνόματος δοξ⸢άζειν⸣ ὀφείλετε
    τὸν Θεόν, ὅτι ἀξίους ὑμᾶς ἡγήσατο ὁ Θεὸς ἵνα τοῦτο τὸ ὄνομα βαστάζητε, καὶ πᾶσαι ὑμῶν αἱ ἁμαρτίαι
    ἰαθῶσιν. 6. ⸢οὐκοῦν⸣ μακα⸢ρίζετε⸣ ἑαυτούς· ἀλλὰ δοκεῖτε ἔργον μέγα πεποιηκέναι, ἐάν τις ὑμῶν διὰ τὸν
    Θεὸν πάθῃ. ζωὴν ὑμῖν ὁ Κύριος χαρίζεται, καὶ οὐ νοεῖ⸢τε⸣· αἱ γὰρ ἁμαρτίαι ὑμῶν κατεβάρυναν, καὶ εἰ
    μὴ πεπόνθατε ἕνεκεν τοῦ ὀνόματος [Κυρίου], διὰ τὰς ἁμαρτίας ὑμῶν τεθνήκειτε ⸢ἂν⸣ τῷ Θεῷ. 7. ταῦτα
    ὑμῖν λέγω τοῖς διστάζουσι περὶ ἀρνήσεως ἢ ὁμολογήσεως. ὁμολογεῖτε ὅτι Κύριον ἔχετε, μήποτε ἀρνούμενοι
    ⸢παραδοθῆσθε⸣ εἰς δεσμωτήριον. 8. εἰ τὰ ἔθνη τοὺς δούλους αὐτῶν κολάζουσιν, ἐάν τις ἀρνήσηται τὸν
    κύριον ἑαυτοῦ, τί δοκεῖτε ποιήσει ὁ Κύριος ὑμῖν, ὁς ⸢ἔχει⸣ πάντων τὴν ἐξουσίαν, ἄρατε τὰς βουλὰς ταύτας
    ἀπὸ τῶν καρδιῶν ὑμῶν, ἵνα διαπαντὸς ζήσητε τῷ Θεῷ.
