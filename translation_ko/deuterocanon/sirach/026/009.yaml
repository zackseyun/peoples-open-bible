translation:
  language: ko
  text: 술 취한 아내는 큰 분노입니다. 그녀는 자신의 수치를 가리지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυνὴ μέθυσος
  english_pob_choice: A drunken wife
  chosen_korean: 술 취한 아내
  alternatives_korean:
  - 술에 취한 아내
  - 만취한 아내
  lexicon: γυνή / μέθυσος
  rationale: 여성의 혼인 관계를 나타내는 γυνή를 자연스러운 한국어로 ‘아내’로 옮기고, μέθυσος는 상태를 직접 드러내는 ‘술 취한’으로 옮겨 원문의 평가적 뉘앙스를 살렸습니다.
- source_word: ὀργὴ μεγάλη
  english_pob_choice: great anger
  chosen_korean: 큰 분노
  alternatives_korean:
  - 큰 노여움
  - 엄청난 분노
  lexicon: ὀργή / μεγάλη
  rationale: ὀργή는 단순한 화보다 강한 분노이므로 ‘분노’로, μεγάλη는 정도를 드러내는 ‘큰’으로 옮겨 원문의 강조를 유지했습니다.
- source_word: ἀσχημοσύνην
  english_pob_choice: shame
  chosen_korean: 수치
  alternatives_korean:
  - 부끄러움
  - 망신
  lexicon: ἀσχημοσύνη
  rationale: ἀσχημοσύνη는 도덕적·사회적 수치를 가리키므로, POB의 ‘shame’에 맞춰 ‘수치’로 옮겨 보다 직접적인 의미를 반영했습니다.
- source_word: οὐ συγκαλύψει
  english_pob_choice: she will not cover
  chosen_korean: 가리지 못합니다
  alternatives_korean:
  - 덮지 못합니다
  - 숨기지 못합니다
  lexicon: συγκαλύπτω
  rationale: ‘cover’의 기본 의미를 살리되 한국어에서 자연스러운 결과 표현으로 ‘가리다’를 사용했고, 부정 미래는 현대 합쇼체로 정리했습니다.
theological_decisions:
- issue: 지혜문학의 경구적 단정 표현
  chosen_reading: 원문의 잠언적 경고를 그대로 살려 일반적 진술로 번역했습니다.
  alternative_readings:
  - 권면형으로 완화해 번역
  - 해설적으로 풀어 번역
  rationale: 시락의 경구는 도덕적 판단을 압축적으로 제시하므로, 의미를 약화시키지 않고 직설적으로 전달하는 것이 원문 의도에 가장 가깝습니다.
  doctrine_reference: 지혜문학의 수사와 도덕적 훈계
- issue: ‘아내’의 관계 설정
  chosen_reading: γυνή를 혼인 관계를 전제하는 ‘아내’로 옮겼습니다.
  alternative_readings:
  - 여자
  - 부인
  rationale: 영문 POB도 wife로 읽고 있으며, 본문은 일반 여성보다 배우자를 가리키는 의미가 분명하므로 ‘아내’가 가장 소스-정합적입니다.
  doctrine_reference: 문맥적 의미론과 서술어 선택
