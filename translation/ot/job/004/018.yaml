id: JOB.4.18
reference: Job 4:18
source:
  edition: WLC
  text: הֵ֣ן בַּ֭/עֲבָדָי/ו לֹ֣א יַאֲמִ֑ין וּ֝/בְ/מַלְאָכָ֗י/ו יָשִׂ֥ים תָּהֳלָֽה׃
translation:
  text: Indeed, he puts no trust in his servants and charges his angels with error[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “folly” or “fault”; the Hebrew word is rare and its precise meaning is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  chosen: Indeed
  alternatives:
  - Behold
  - Indeed
  - See
  lexicon: HALOT
  rationale: The particle marks emphatic assertion in this context.
- source_word: בַּעֲבָדָיו
  chosen: in his servants
  alternatives:
  - among his servants
  - with his servants
  lexicon: HALOT
  rationale: The preposition ב with אמן in the Hiphil commonly marks the object of trust or belief, so 'puts no trust in his servants' is the most natural English expression. 'Servants' fits עבדים here better than 'slaves,' since the point is not their bonded social status but their subordinate role in God's household.
- source_word: לֹא יַאֲמִין
  chosen: he puts no trust
  alternatives:
  - he does not trust
  - he does not believe
  lexicon: HALOT
  rationale: Hiphil of אמן here conveys trust/confidence rather than intellectual belief. 'Puts no trust' is idiomatic and preserves the relational nuance.
- source_word: וּבְמַלְאָכָיו
  chosen: his angels
  alternatives:
  - his angels
  lexicon: HALOT
  rationale: The immediate argument contrasts heavenly servants with frail mortals; “angels” gives the contextual referent.
- source_word: יָשִׂים
  chosen: he charges
  alternatives:
  - he puts
  - he places
  - he finds
  lexicon: HALOT
  rationale: The idiom שׂים + abstract noun here means to ascribe or attribute something to someone. 'Charges' communicates that God imputes or lays something to their account.
- source_word: תָּהֳלָה
  chosen: error
  alternatives:
  - folly
  - fault
  - imperfection
  lexicon: HALOT
  rationale: The noun is rare and denotes error, folly, or defect. 'Error' is concise and natural in English, while allowing the sense that even heavenly beings are not beyond fault in comparison with God.
