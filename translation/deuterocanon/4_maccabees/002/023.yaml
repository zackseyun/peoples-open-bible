  category: meaning_retranslation
  from: And to him he gave a law[a], according to which, by conducting himself as a citizen[b], he would rule a kingdom that was self-controlled and just and good and courageous.
  to: And he gave the mind a law, so that by living according to that law[a] it might reign with self-control, justice, goodness, and courage[b].
  rationale: The earlier decisions preserved the political imagery but leaned too heavily toward literal civic life and a territorial kingdom. In the flow from the mind’s enthronement, I read the law and reign as continuing the metaphor of inner government, while noting the civic wording and the 'kingdom' alternative.
