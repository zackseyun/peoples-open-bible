  source_fidelity: 히브리어의 보고 표현(“그들이 왕에게 말하였다”), 주의 환기 표현 הִנֵּה, ‘예언자 나단’, 왕 앞에 들어감, 그리고 얼굴을 땅에 대는 절의 동작을 모두 충실히 반영합니다. ‘여기 있습니다’는 הִנֵּה의 현장 제시 기능을 자연스럽게 풀어 쓴 것으로 문맥상 무리가 없습니다.
  naturalness: 현대 표준 한국어 합쇼체 서술로 자연스럽습니다. 직접 인용의 ‘보십시오’와 서술의 ‘말했습니다/절했습니다’도 일관된 격식을 유지합니다.
  terminology: ‘예언자 나단’은 נָתָן הַנָּבִיא를 정확하고 중립적으로 옮깁니다. ‘얼굴을 땅에 대고 왕에게 절했습니다’는 וַיִּשְׁתַּחוּ... עַל־אַפָּיו אַרְצָה가 묘사하는 깊은 복종의 자세를 충분히 보존합니다.
