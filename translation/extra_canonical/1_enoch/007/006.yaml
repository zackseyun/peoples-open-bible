lexical_decisions:
- source_word: አሜሃ
  chosen: Then
  alternatives:
  - At that time
  rationale: The temporal adverb advances the narrative; “Then” is concise and natural while preserving the sequence.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ምድር
  chosen: the earth
  alternatives:
  - the land
  rationale: The wider scene concerns violence and bloodshed affecting creation, and the earth is personified as an accuser;
    “earth” therefore fits better than the geographically narrower “land.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ሰከየቶሙ
  chosen: brought an accusation against
  alternatives:
  - accused
  - complained against
  rationale: The verb presents the earth as lodging a charge. The expanded English expression preserves its forensic force
    more clearly than the potentially general “complained.” The attached third-person plural suffix refers to those accused.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ለዓማፂያን
  chosen: the lawless ones
  alternatives:
  - the rebels
  - the transgressors
  rationale: The term denotes those acting in rebellion or violation of right order. “Lawless ones” preserves both moral transgression
    and defiance without identifying them more narrowly than this line does.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
theological_decisions:
- issue: The earth as an accusing agent
  chosen_reading: Retain the earth’s personification as bringing a formal accusation.
  alternative_readings:
  - Treat the wording as a generic statement that wrongdoing became known
  rationale: The source explicitly makes the earth the grammatical actor. Preserving that imagery sustains the passage’s apocalyptic
    portrayal of creation itself bearing witness against violence and bloodshed.
  doctrine_reference: Book-context instruction to preserve apocalyptic imagery and judgment formulas
- issue: Identity of the accused
  chosen_reading: Render the group generically as “the lawless ones.”
  alternative_readings:
  - Identify them explicitly as the giants
  - Identify them explicitly as the Watchers
  rationale: Although the preceding context concerns the giants’ violence, this verse uses a moral designation rather than
    an explicit group name. The translation therefore avoids supplying an identification not stated in the line.
  doctrine_reference: Original-language primacy and prohibition against paraphrase beyond the Ge'ez witness
