base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/001.yaml
  text: The fool says in his heart, “There is no God.” They are corrupt; they do detestable wrong[a]; there is no one who does good.
  footnotes:
  - marker: a
    text: Or possibly a musical or liturgical term; the meaning of 'Mahalath' is uncertain.
    reason: lexical_alternative
  - marker: b
    text: '''Maskil'' is a technical term in psalm headings, possibly indicating an instructive or contemplative composition.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew 'of David' may indicate authorship, association, dedication, or collection affiliation.
    reason: alternative_reading
translation:
  language: ko
  text: 어리석은 자는 마음속으로 “하나님은 없다”라고 말합니다. 그들은 부패하여 가증한 불의를 저지릅니다[a]. 선을 행하는 자가 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 가증하게 불의를 행합니다’ 또는 ‘그들은 자신들의 행위를 가증하게 만들었습니다.’ 히브리어는 가증함을 나타내는 동사와 ‘불의/잘못’을 뜻하는 명사를 결합합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
