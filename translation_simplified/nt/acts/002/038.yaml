    unchanged: false
    changes_summary: 'Changed “Jesus Messiah” to “Jesus Christ” for more natural formal English and closer consistency with standard rendering of Ἰησοῦ Χριστοῦ in this context. No other changes needed. [Regression fix applied: Messiah restored (revision_pass had changed Χριστός → Christ against DOCTRINE.md policy)]'
translation:
  language: en
  text: Peter said to them, “Reorient toward God[r1]. Every one of you must be baptized in the name of Jesus Christ[a] for the forgiveness of your sins.[b] You will receive the gift of the Holy Spirit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
    reason: alternative_reading
  - marker: b
    text: Christians differ on how baptism relates to forgiveness here; this wording does not settle that debate.
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And Peter said to them
  simplified_phrase: Peter said to them
  preserved_meaning: Peter directly addresses the people.
  reasoning_layer_used: source syntax and POB translation
  rationale: The opening “And” is unnecessary in clear modern English.
- pob_phrase: and you will receive
  simplified_phrase: You will receive
  preserved_meaning: Peter promises that they will receive the Holy Spirit's gift.
  reasoning_layer_used: lexical decision for λήμψεσθε
  rationale: A new sentence keeps the promise clear without changing its force.
translation_notes:
  risk_flags:
  - risk: “Must be baptized” may sound as though the translation settles how baptism relates to forgiveness.
    mitigation: Footnote b preserves the POB's deliberate theological openness.
  - risk: Some readers may expect the familiar title “Jesus Christ.”
    mitigation: Footnote a preserves that standard alternative while retaining the POB choice “Messiah.”
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
