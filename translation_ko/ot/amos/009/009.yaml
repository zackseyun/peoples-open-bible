  text: כִּֽי הִנֵּ֤ה אָֽנֹכִי֙ מְצַוֶּ֔ה וַ/הֲנִע֥וֹתִי בְ/כָֽל הַ/גּוֹיִ֖ם אֶת בֵּ֣ית יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֤ר יִנּ֨וֹעַ֙ בַּ/כְּבָרָ֔ה וְ/לֹֽא יִפּ֥וֹל צְר֖וֹר אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/009.yaml
  text: For look, I am commanding, and I will shake the house of Israel among all the nations, as one shakes with a sieve, yet not a pebble will fall to the ground.
translation:
  language: ko
  text: 보십시오, 내가 명령하고 있습니다. 내가 이스라엘 집을 모든 민족 가운데서 체로 흔들듯이 흔들겠으나, 돌멩이 하나도 땅에 떨어지지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  english_pob_choice: For look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이보십시오
  - 보세요
  lexicon: כִּי / הִנֵּה
  rationale: 경고와 주의를 끄는 예언문맥의 감탄을 현대 합쇼체로 자연스럽게 살리되, 구어체로 과도하게 낮추지 않기 위해 ‘보십시오’를 택했습니다.
- source_word: מְצַוֶּה
  english_pob_choice: I am commanding
  chosen_korean: 내가 명령하고 있습니다
  alternatives_korean:
  - 내가 명령합니다
  - 내가 지시하고 있습니다
  lexicon: צוה
  rationale: 현재 진행형의 긴박감을 살리면서도, 선지자적 선언의 직접성을 유지하기 위해 ‘명령하고 있습니다’로 옮겼습니다.
- source_word: הֲנִעוֹתִי / יִנּוֹעַ
  english_pob_choice: shake ... as one shakes with a sieve
  chosen_korean: 흔들어 놓을 것이니 … 체로 흔드는 것과 같아서도
  alternatives_korean:
  - 흔들어 버릴 것이니 … 체로 치는 것과 같이
  - 선별체로 흔드는 것처럼
  lexicon: נוע
  rationale: 히브리어의 ‘흔들다/요동시키다’와 체를 흔드는 선별 이미지를 함께 보존하기 위해 ‘흔들어 놓다’와 ‘체로 흔드는 것’을 병렬로 살렸습니다.
- source_word: צְר֖וֹר
  english_pob_choice: a pebble
  chosen_korean: 알갱이 하나
  alternatives_korean:
  - 조약돌 하나
  - 돌멩이 하나
  lexicon: צרור
  rationale: 문맥상 체에 남는 작은 덩어리/알갱이의 이미지를 전달하기 위해, 한국어에서 가장 중립적인 ‘알갱이 하나’를 택했습니다.
theological_decisions:
- issue: 이스라엘의 심판과 보존을 함께 말하는 마지막 절의 의미
  chosen_reading: 하나님이 이스라엘을 모든 민족 가운데서 흔드시지만, 그 과정에서 참된 언약 백성을 완전히 잃지 않으신다는 뜻을 드러냈습니다.
  alternative_readings:
  - 단순한 국가적 흩어짐의 예고
  - 심판만을 강조한 표현
  rationale: 체를 흔드는 비유와 ‘땅에 떨어지지 않을 것’의 병치를 함께 살려, 심판 속 보존이라는 문맥적 긴장을 보존했습니다.
  doctrine_reference: 언약 백성의 보존과 심판의 병행
