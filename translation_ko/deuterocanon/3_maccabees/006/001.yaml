  yaml_path: translation/deuterocanon/3_maccabees/006/001.yaml
  text: 'Now a certain Eleazar, a distinguished man among the Jews of the country, already advanced in age and adorned with every virtue in life, quieted the elders around him to call upon the holy God, and prayed as follows:'
translation:
  language: ko
  text: '그 땅의 유대인들 가운데 이름난 엘레아자르라는 사람이 있었는데, 그는 이미 나이가 많고 삶의 모든 덕으로 단장된 사람이었습니다. 그는 곁에 있던 장로들을 진정시키고 거룩하신 하나님을 부르며 다음과 같이 기도했습니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνὴρ ἐπίσημος
  english_pob_choice: a distinguished man
  chosen_korean: 이름난 사람
  alternatives_korean:
  - 저명한 사람
  - 유명한 사람
  lexicon: ἐπίσημος
  rationale: 사회적 명망을 나타내는 표현으로, 문맥상 단순한 개인 소개보다 공동체 안에서 두드러진 인물임을 자연스럽게 드러내는 ‘이름난 사람’이 적절합니다.
- source_word: ἀπὸ τῆς χώρας Ἰουδαίων
  english_pob_choice: among the Jews of the country
  chosen_korean: 나라의 유대인들 가운데서
  alternatives_korean:
  - 그 땅의 유대인들 가운데서
  - 시골 유대인들 가운데서
  lexicon: χώρα
  rationale: χώρα는 여기서 특정 지역 출신의 유대인 공동체를 가리키므로, ‘나라의’로 옮겨 지리적 소속을 살리되 과도한 지역색은 피했습니다.
- source_word: τὴν ἡλικίαν ἤδη λελογχὼς
  english_pob_choice: already advanced in age
  chosen_korean: 이미 나이가 많았고
  alternatives_korean:
  - 이미 연로했고
  - 이미 나이가 들어 있었고
  lexicon: ἡλικία
  rationale: 직역보다 한국어에서 자연스럽고 품위 있게 노년을 나타내는 표현을 택했습니다.
- source_word: πάσῃ τῇ κατὰ τὸν βίον ἀρετῇ κεκοσμημένος
  english_pob_choice: adorned with every virtue in life
  chosen_korean: 삶의 모든 덕으로 단장되어 있었습니다
  alternatives_korean:
  - 삶의 모든 덕으로 꾸며져 있었습니다
  - 인생의 모든 덕으로 장식되어 있었습니다
  lexicon: ἀρετή
  rationale: ἀρετή를 단순한 도덕성보다 ‘덕’으로 유지하고, κεκοσμημένος의 ‘장식되다’ 이미지는 ‘단장되어’로 살렸습니다.
- source_word: τοὺς περὶ αὐτὸν καταστείλας
  english_pob_choice: quieted the elders around him
  chosen_korean: 주위의 원로들을 잠잠하게 하여
  alternatives_korean:
  - 주위의 원로들을 진정시켜
  - 주위의 원로들을 조용하게 하여
  lexicon: καταστέλλω
  rationale: 이 동사는 단순히 말을 멈추게 하는 정도이므로, 의례적이고 공적인 분위기를 살리는 ‘잠잠하게 하여’를 택했습니다.
- source_word: ἐπικαλεῖσθαι τὸν ἅγιον θεόν
  english_pob_choice: to call upon the holy God
  chosen_korean: 거룩한 하나님께 부르짖게 하고
  alternatives_korean:
  - 거룩한 하나님을 부르짖게 하고
  - 거룩하신 하나님께 부르짖게 하고
  lexicon: ἐπικαλέω
  rationale: ἐπικαλεῖσθαι는 단순 호칭보다 간구와 호소를 포함하므로 ‘부르짖게 하다’로 옮겼고, ἅγιος θεός는 POB 관례에 따라 ‘거룩한 하나님’으로 유지했습니다.
theological_decisions:
- issue: ἅγιος θεός의 호칭 처리
  chosen_reading: ‘거룩한 하나님’으로 옮겨 하나님의 구별됨과 성결성을 직접 드러냈습니다.
  alternative_readings:
  - ‘거룩하신 하나님’
  - ‘성하신 하나님’
  rationale: 본문의 형용사-명사 구조를 살리면서도, 한국어에서 가장 직설적이고 자연스러운 신학적 호칭을 유지했습니다.
  doctrine_reference: 하나님의 거룩하심
- issue: ἐπικαλεῖσθαι의 행위 뉘앙스
  chosen_reading: 원로들이 하나님을 ‘부르짖게 하고’라고 옮겨 공적 예배의 간구성을 드러냈습니다.
  alternative_readings:
  - ‘부르게 하고’
  - ‘호소하게 하고’
  rationale: 문맥은 단순 호명보다 위기 속 간절한 호소에 가깝기 때문에, 기도문 서두의 긴박성과 진정성을 살리는 표현을 선택했습니다.
  doctrine_reference: 기도와 간구
