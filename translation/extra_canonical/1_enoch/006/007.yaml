translation:
  text: 'And these are the names of their angels: Shemiazaz—he was their angel—Arakibaremeel,
    Kokabiel, Tamiel, Ramiel, Daniel, Ezeqiel, Baraqiel, Asael, Armaros, Baterel,
    Ananel, Zaqiel, Samsapeel, Saterel, Turel, Yomyael, and Arazial.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez calls them “their angels”; “their leaders” is a contextual interpretation.
    reason: lexical_alternative
  - marker: b
    text: The supplied witness presents “Arakibaremeel” as one name. Its division
      into two names is uncertain.
    reason: textual_variant
  - marker: c
    text: The supplied OCR marks “Arazial” as textually uncertain; the name is retained
      as given.
    reason: textual_variant
