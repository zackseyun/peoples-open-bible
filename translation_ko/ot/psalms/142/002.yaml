  rationale: 향하는 대상을 표시하는 전치사는 한국어에서 여격 조사 ‘께’가 가장 자연스럽고, 기도/호소의 방향성을 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 표지어가 아닌 고유 신명 יְהוָה이므로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֶזְעָק
  english_pob_choice: I cry out
  chosen_korean: 부르짖습니다
  alternatives_korean:
  - 외칩니다
  - 소리칩니다
  lexicon: HALOT
  rationale: זעק의 강한 외침과 절박한 호소를 살리기 위해, 현대 한국어에서 시편 기도의 긴박감을 잘 담는 ‘부르짖다’를 택했습니다.
- source_word: אֶתְחַנָּן
  english_pob_choice: I plead for mercy
  chosen_korean: 자비를 간구합니다
  alternatives_korean:
  - 은혜를 구합니다
  - 긍휼을 빕니다
  lexicon: HALOT
  rationale: 히트파엘 חנן은 은혜/자비를 간청하는 뜻이므로, 본문 의미를 직접 드러내는 ‘자비를 간구하다’로 옮겼습니다.
theological_decisions:
- issue: 야훼를 향한 반복적 병렬 구조의 보존
  chosen_reading: 두 행 모두 ‘제 목소리로 …’와 ‘야훼께 …’를 반복해, 시적 강조와 절박한 기도의 병렬을 드러냈습니다.
  alternative_readings:
