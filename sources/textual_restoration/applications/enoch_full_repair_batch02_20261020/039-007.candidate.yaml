translation:
  text: I saw a dwelling place beneath the wings of the Lord of Spirits. All the righteous and chosen shine[a] before
    him like the light of fire. Their mouth is filled with blessing, and their lips praise the name of the Lord
    of Spirits. Righteousness never comes to an end before him, and uprightness never comes to an end before him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dillmann’s 1865 lexicon, column33, gives the meanings “be adorned” and “shine” for this verb and cites
      this verse’s comparison with the light of fire. Charles’s apparatus records variant forms; this rendering
      follows his selected printed verb, not an inferred meaning from the simile alone.
    reason: textual_variant
  - marker: b
    text: The final uprightness clause is printed by Charles, but the apparatus records its omission in several
      manuscripts.
    reason: textual_variant
