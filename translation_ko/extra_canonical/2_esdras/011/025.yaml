lexical_decisions:
- source_word: quattuor manserunt in loco suo
  english_pob_choice: four remained in their place
  chosen_korean: 넷은 자기 자리에 남아 있었습니다
  alternatives_korean:
  - 네 개가 제자리에 남아 있었습니다
  - 넷이 그 자리에 머물러 있었습니다
  lexicon: manere → 남아 있다 / 머물다; locus → 자리
  rationale: 라틴어는 단순히 ‘남다’의 사실을 말하므로, 의미를 과장하지 않고 자연스러운 현대 문체로 옮겼습니다.
- source_word: Et uidi et ecce
  english_pob_choice: And I looked, and behold
  chosen_korean: 내가 보니, 보십시오
  alternatives_korean:
  - 내가 보고 보니
  - 내가 보았더니, 보십시오
  lexicon: video → 보다; ecce → 보라/보십시오
  rationale: 시각적 관찰과 감탄의 전환을 살리면서, 합쇼체 서술에 맞게 ‘보십시오’로 처리했습니다.
- source_word: hae subalares
  english_pob_choice: these under-wings
  chosen_korean: 이 아래날개들은
  alternatives_korean:
  - 이 날개 아래의 것들은
  - 이 부날개들은
  lexicon: subalaris → 날개 아래의 / under-winged
  rationale: 라틴어 형용사 subalares는 직역하면 ‘날개 아래의’이므로, 독자가 구조를 바로 이해하도록 ‘아래날개들’로 옮겼습니다.
