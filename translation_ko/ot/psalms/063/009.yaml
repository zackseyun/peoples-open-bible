    reason: previous_rendering
translation:
  language: ko
  text: 그러나 제 목숨을 파멸시키려고 찾는 자들은[a] 땅의 깊은 곳으로 들어갈 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파멸을 위하여 제 목숨을 찾는 자들은’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘땅의 낮은 곳들로’입니다. 죽음이나 심판을 나타내는 시적 표현일 수 있으나, 특정한 사후 세계 교리를 단정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבְקָה נַפְשִׁי אַחֲרֶיךָ
  english_pob_choice: My soul clings to you / clings after you
  chosen_korean: 제 영혼이 주님께 매달립니다
  alternatives_korean:
  - 제 영혼이 주님을 뒤따릅니다
  - 제 영혼이 주님께 붙어 있습니다
  - 제 영혼이 주님을 따라 바짝 붙습니다
  lexicon: HALOT
  rationale: דבק는 단순 추종보다 강한 결속과 밀착을 뜻하므로, 한국어에서는 ‘매달리다’가 관계적 집착과 긴박함을 가장 자연스럽게 살립니다. ‘뒤따르다’는 אחרי의 방향성은 살리지만 דבק의 결속감을 약화시킵니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 저
  - 제 생명
  - 제 자신
  lexicon: HALOT
  rationale: נפש는 ‘영혼/생명/자기 자신’까지 포괄하지만, 시편의 경건한 시어에서는 ‘영혼’이 인격적·영적 뉘앙스를 가장 잘 보존합니다.
- source_word: תָּמְכָה יְמִינֶךָ
  english_pob_choice: your right hand upholds me
  chosen_korean: 주님의 오른손이 저를 붙드십니다
  alternatives_korean:
  - 주님의 오른손이 저를 받쳐 주십니다
  - 주님의 오른손이 저를 지탱하십니다
  - 주님의 오른손이 저를 붙들고 계십니다
  lexicon: HALOT
  rationale: תמך는 ‘붙들다/지탱하다/지지하다’의 의미이므로, 시적 평행을 살리면서도 현대 한국어로 자연스러운 ‘붙드십니다’를 택했습니다. ‘오른손’은 כוח의 추상화보다 히브리어의 구체적 이미지를 보존합니다.
theological_decisions:
- issue: אַחֲרֶיךָ의 관계적 방향성과 דבק의 결속을 어떻게 함께 살릴 것인가
  chosen_reading: ‘매달립니다’로 דבק의 밀착을 드러내고, 뒤따름의 방향은 문맥 전체의 이미지로 남겨 두었습니다.
  alternative_readings:
  - ‘주님 뒤를 바짝 따릅니다’
  - ‘주님께 바싹 붙어 있습니다’
  rationale: 히브리어는 ‘after you’라는 방향어와 ‘cling’의 결속을 함께 담고 있으므로, 한쪽만 과도하게 풀지 않고 시적 긴장을 유지하는 것이 더 충실합니다.
  doctrine_reference: '번역 원칙: 원문 이미지와 신학적 긴장을 보존하고, 해석적 확장을 최소화합니다.'
- issue: 하나님의 오른손을 추상적 힘으로 바꿀지 여부
  chosen_reading: ‘주님의 오른손’이라는 구체적 표현을 그대로 유지했습니다.
  alternative_readings:
  - 주님의 능력이
  - 주님의 힘이
  rationale: 본문은 의도적으로 신체적 은유를 사용하므로, 이를 추상화하면 시의 생동감과 보호의 친밀성이 약해집니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 범위를 넘어 신체 은유를 해설로 바꾸지 않습니다.'
