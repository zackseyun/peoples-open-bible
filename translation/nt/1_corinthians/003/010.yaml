  rationale: 'The Greek repeats the verb ἐποικοδομεῖ, which the draft correctly mirrors by repeating ''builds''. However, repeating the full phrase ''builds on it'' is slightly wooden in English. Since the object (''on it'', i.e., the foundation) is clear from the immediate context, omitting it in the second instance creates a more natural and punchy warning: ''...another builds on it. But let each one be careful how he builds.'' This small change improves the English flow without losing any of the original''s meaning or rhetorical force.'
