id: PSA.105.38
reference: Psalms 105:38
source:
  edition: WLC
  text: שָׂמַ֣ח מִצְרַ֣יִם בְּ/צֵאתָ֑/ם כִּֽי נָפַ֖ל פַּחְדָּ֣/ם עֲלֵי/הֶֽם־׃
translation:
  text: Egypt was glad when Israel departed, for dread of Israel had fallen upon the Egyptians.
  philosophy: dynamic
lexical_decisions:
- source_word: שָׂמַח
  chosen: was glad
  alternatives:
  - rejoiced
  lexicon: HALOT
  rationale: Qal perfect 3ms with collective subject מִצְרַיִם expresses a completed state of gladness. 'Was glad' is natural modern English and fits the narrative sense; 'rejoiced' is possible but slightly more elevated.
- source_word: מִצְרַיִם
  chosen: Egypt
  lexicon: HALOT
  rationale: 'The noun refers to the nation/people collectively. English commonly uses the singular national name with a singular verb here: ''Egypt was glad.'''
- source_word: בְּצֵאתָם
  chosen: when Israel departed
  alternatives:
  - at their going out
  - when they went out
  lexicon: HALOT
  rationale: The suffix refers contextually to Israel; naming it prevents an English pronoun collision.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  lexicon: HALOT
  rationale: Introduces the reason for Egypt's gladness. 'For' is concise and natural in English biblical narrative; 'because' would also be acceptable.
- source_word: נָפַל
  chosen: had fallen
  alternatives:
  - fell
  lexicon: HALOT
  rationale: The perfect verb describes the prior/resulting condition explaining Egypt's reaction. English past perfect clarifies that the dread had already come upon them by the time of Israel's departure.
- source_word: פַּחְדָּם
  chosen: dread of Israel
  alternatives:
  - fear of them
  - terror of them
  lexicon: HALOT
  rationale: The suffix is objective in sense, denoting dread caused by Israel; explicit reference removes ambiguity.
- source_word: עֲלֵיהֶם
  chosen: upon the Egyptians
  alternatives:
  - on them
  lexicon: HALOT
  rationale: The Hebrew plural suffix refers to Egypt’s people. This preserves that referent and makes the sentence clear.
