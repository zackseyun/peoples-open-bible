translation:
  text: When each round of feasting was over, Job would send for his children and consecrate them. He would rise early in the morning and offer a burnt offering for each of them, for he said, “Perhaps my sons have sinned and cursed God[a] in their hearts.” This was Job’s regular practice.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “blessed God”; here “bless” is used as a euphemism for “curse.”
    reason: lexical_alternative
