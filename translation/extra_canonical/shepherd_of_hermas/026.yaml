  unit_id: M.1
  label: Mandate 1
  sequence: 26
translation:
  text: 'I.1. First of all, believe that God is one[f]—the one who created and set in order all things[g],
    and brought all things into being from what was not[a], and who encompasses all things, while he alone
    is uncontainable[b].


    I.2. Therefore put your trust in him[h] and fear him; and having feared, practice self-control[c].
    Keep these things, and you will throw off every wickedness from yourself[j] and put on every virtue
    of righteousness[d], and you will live to God[e], if you keep this command[i].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: From what was not retains ek tou mē ontos eis to einai, literally from non-being into being.
      Out of nothing is another rendering, as in the Latin ex nihilo. The selected wording retains both
      the negative starting point and coming into being, without softening it to merely what was not yet
      present. All things remains repeated with creation, this bringing-into-being clause and encompassing.
    reason: lexical_alternative
  - marker: b
    text: Encompasses all things, while he alone is uncontainable retains the chōrōn/achōrētos word relation
      and alone. Contains all things, being himself uncontained is an alternative. Vulgata printed36 and
      Palatina printed71–73 add that he cannot be defined in words or conceived in the mind; that extra
      clause is not in the selected Greek and is not imported into the main text. Sinaiticus26.1 has an
      extra first-hand iota after achōrētos, deleted in correction; this is not a separate manuscript.
    reason: textual_variant
  - marker: c
    text: Practice self-control retains the earlier enkrateusai choice, also be self-controlled or practice
      restraint. The preceding fearing statement remains linked to this command. Vulgata and Palatina
      use abstinence language. The Ethiopic edition’s Latin rendering printed128 has patiens with continens
      parenthetically; this mediated wording is not a direct Geʿez transcription or an exact new Greek
      reading.
    reason: lexical_alternative
  - marker: d
    text: Put on every virtue of righteousness retains the clothing image, every and the of relationship.
      Clothe yourself with every virtue of justice is an alternative. The Ethiopic edition’s mediated
      Latin printed128 instead has perform every virtue and righteousness, a different image and conjunction.
      The selected text is not harmonized to that version or turned into an instruction about putting
      on literal clothing.
    reason: lexical_alternative
  - marker: e
    text: You will live to God retains the earlier explicit consistency adjudication for the repeated
      Hermas refrain zēsē tō theō. Live for God is an interpretive alternative. The old note merely repeating
      live to God as if it were a different reading is archived and removed. The Ethiopic edition’s Latin
      rendering printed128 has live to the Lord, not the selected God title. The following condition remains
      attached to the promise.
    reason: lexical_alternative
  - marker: f
    text: God is one retains heis estin ho theos, also there is one God. The Ethiopic edition’s mediated
      Latin printed128 has one Lord. Irenaeus’s quotation as transmitted in Eusebius, Historia ecclesiastica5.8.7,
      covers the opening believe/one-God/created-and-ordered clause, then says and so forth. That transmission
      chain is not two independent Hermas manuscript votes, and its short quotation does not attest the
      rest of this unit. No fresh Irenaeus or Eusebius manuscript photograph collation is claimed.
    reason: textual_variant
  - marker: g
    text: Created and set in order retains the prior ktisas/katartisas choices, also created and established
      or completed. Athanasius, De incarnatione3.1, in the Bodleian scan physical25/printed4, quotes through
      from non-being into being, stopping before the final all things and encompassing clause. The First1KGreek
      electronic text contains an extra tōn after pantōn; the inspected printed page does not. This digital
      duplication is not promoted to a manuscript variant. Through the Word in Athanasius’s surrounding
      prose is outside the Hermas quotation and is not added here. Neither short quotation covers the
      conduct paragraph.
    reason: textual_variant
  - marker: h
    text: Put your trust in him restores the earlier documented choice for pisteuson autō, also believe
      him or trust him, already reflected in the old theological decision and revision rationale but lost
      from the current main text. The earlier believe that introduces the one-God statement; the second
      imperative addresses reliance on him. The English keeps both without adding another object of faith
      or replacing the command to fear him.
    reason: lexical_alternative
  - marker: i
    text: If you keep this command retains the condition, this specific command and its second-person
      address. The preceding keep these things, throwing off wickedness, putting on virtue and living-to-God
      sequence remains. The promise is not presented as unconditional. Athos and Sinaiticus26.2 retain
      the conditional ending, and the consulted Latin versions also retain a keep-this-command condition.
    reason: lexical_alternative
  - marker: j
    text: You will throw off every wickedness from yourself retains the earlier future, every, and from-yourself
      wording. Cast off all wickedness is an alternative. The selected paragraph then adds putting on
      every virtue of righteousness. The Ethiopic edition’s mediated Latin printed128 instead commands
      departing from every evil; its imperative is not substituted for the selected future. Sinaiticus26.2’s
      fear-verb ending is corrected by S1/ca while the self-control/keep/throw-off/put-on/conditional-life
      sequence remains.
    reason: textual_variant
lexical_decisions:
- source_word: Πρῶτον πάντων
  chosen: First of all
  alternatives:
  - Before all things
  - First among all
  lexicon: LSJ
  rationale: Idiomatic adverbial phrase introducing the primary command; "First of all" preserves priority
    without sounding archaic.
- source_word: πίστευσον ὅτι
  chosen: believe that
  alternatives:
  - have faith that
  - trust that
  lexicon: BDAG
  rationale: With a content clause (ὅτι), pisteuō naturally means to accept a proposition as true.
- source_word: εἷς ἐστὶν ὁ Θεός
  chosen: God is one
  alternatives:
  - there is one God
  lexicon: BDAG
  rationale: Both are possible; "God is one" keeps the creedal ring and mirrors the Greek structure closely.
- source_word: κτίσας
  chosen: created
  alternatives:
  - made
  - brought into being
  lexicon: BDAG
  rationale: κτίζω commonly denotes divine creation; "created" is the standard, weighty term.
- source_word: καταρτίσας
  chosen: set in order
  alternatives:
  - established
  - arranged
  - fashioned
  - completed/perfected
  lexicon: BDAG
  rationale: καταρτίζω here complements κτίζω; "set in order" conveys arranging/ordering the created world
    without importing later technical nuances.
- source_word: ποιήσας ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι τὰ πάντα
  chosen: brought all things into being from what was not
  alternatives:
  - made all things from non-being into being
  - made all things out of nothing
  lexicon: LSJ
  rationale: The expression literally reads "from the not-being into being"; "brought ... into being from
    what was not" keeps the Greek structure and avoids overinterpretive phrasing while preserving the
    ex nihilo sense.
- source_word: πάντα χωρῶν
  chosen: encompasses all things
  alternatives:
  - contains all things
  - comprehends all things
  lexicon: LSJ
  rationale: χωρέω can mean "to have room for, contain"; "encompasses" captures the metaphysical scope
    without suggesting mere physical containment or the English sense of "comprehend=understand."
- source_word: ἀχώρητος
  chosen: uncontainable
  alternatives:
  - uncontained
  - incomprehensible
  lexicon: LSJ
  rationale: From χωρέω with alpha-privative; "uncontainable" maintains the lexical parallel. "Incomprehensible"
    is a later theological sense that could mislead in English.
- source_word: πίστευσον οὖν αὐτῷ
  chosen: put your trust in him
  alternatives:
  - believe him
  lexicon: BDAG
  rationale: With the dative (αὐτῷ), pisteuō often has the nuance of relational trust; the shift from
    "believe that" to "trust him" reflects the change in construction and sense.
- source_word: φοβήθητι αὐτόν
  chosen: fear him
  alternatives:
  - revere him
  - stand in awe of him
  - be afraid of him
  lexicon: BDAG
  rationale: Preserves the strong biblical/early Christian idiom of the fear of God without euphemizing.
- source_word: ἐγκράτευσαι
  chosen: practice self-control
  alternatives:
  - be self-controlled
  - be continent
  lexicon: BDAG
  rationale: Aorist middle imperative of ἐγκρατεύομαι; "practice self-control" communicates the active
    moral discipline called for.
- source_word: φύλασσε
  chosen: keep
  alternatives:
  - guard
  - observe
  lexicon: BDAG
  rationale: '"Keep" is the standard rendering of φυλάσσω in moral exhortation contexts; it keeps the
    imperative''s force crisp.'
- source_word: ἀποβαλεῖς
  chosen: you will throw off
  alternatives:
  - you will cast off
  - you will put away
  lexicon: LSJ
  rationale: ἀποβάλλω means to throw away/off; "throw off" is vivid and retains the metaphorical texture.
- source_word: πονηρίαν
  chosen: wickedness
  alternatives:
  - evil
  - malice
  lexicon: BDAG
  rationale: In general moral contexts, "wickedness" captures the broad scope of moral evil inherent in
    πονηρία.
- source_word: ἐνδύσῃ
  chosen: you will put on
  alternatives:
  - you will clothe yourself with
  lexicon: BDAG
  rationale: ἐνδύω in the middle voice frequently uses the clothing metaphor; "put on" is concise and
    transparent.
- source_word: ἀρετὴν
  chosen: virtue
  alternatives:
  - moral excellence
  lexicon: BDAG
  rationale: '"Virtue" is the most direct English equivalent and matches early Christian moral vocabulary.'
- source_word: δικαιοσύνης
  chosen: of righteousness
  alternatives:
  - of justice
  lexicon: BDAG
  rationale: Default project rendering; in this moral context "righteousness" is the better fit for personal
    ethical quality.
- source_word: ζήσῃ τῷ θεῷ
  chosen: you will live to God
  alternatives:
  - you will live for God
  - you will live with God
  lexicon: BDAG
  rationale: Retain the earlier explicit consistency adjudication for the recurrent Hermas refrain, with
    interpretive alternatives disclosed. The old for-God metadata no longer overrides the adjudicated
    main text.
- source_word: ἐντολὴν
  chosen: command
  alternatives:
  - mandate
  - commandment
  lexicon: BDAG
  rationale: '"Command" is plain and matches the internal diction; "mandate" is the section title but
    would be confusing in-line.'
- source_word: πίστευσον οὖν αὐτῷ
  chosen: Therefore put your trust in him
  alternatives:
  - Therefore believe him
  - Therefore trust him
  lexicon: Prior recorded adjudication and Greek dative construction
  rationale: Restore the previously documented trust wording consistently with the old theological decision,
    without changing the selected Greek.
