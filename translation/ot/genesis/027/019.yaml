  - source_phrase: קוּם נָא שְׁבָה
    prior_rendering: Please rise, sit
    new_rendering: Please sit up
    rationale: The combined commands ask Isaac to raise himself into a sitting position for the meal; 'sit up' conveys that movement naturally rather than suggesting that he must stand and then sit.
  - source_phrase: וְאָכְלָה מִצֵּידִי
    prior_rendering: and eat from my game
    new_rendering: and eat some of my game
    rationale: The preposition is partitive here, which English expresses naturally with 'some of.'
  - source_phrase: תְּבָרֲכַנִּי נַפְשֶׁךָ
    prior_rendering: your soul may bless me
    new_rendering: you may bless me
    rationale: The documented contextual sense of נֶפֶשׁ is the person performing the blessing. The personal pronoun communicates that meaning directly, while the footnote preserves the source expression.
