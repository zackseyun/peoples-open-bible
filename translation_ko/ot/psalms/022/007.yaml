source:
  edition: WLC
  text: כָּל רֹ֭אַ/י יַלְעִ֣גוּ לִ֑/י יַפְטִ֥ירוּ בְ֝/שָׂפָ֗ה יָנִ֥יעוּ רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/007.yaml
  text: All who see me mock me; they sneer with the lip[a]; they shake the head.[b]
  footnotes:
  - marker: a
    text: More literally, “they open the lip,” a contemptuous facial gesture; traditionally, “they shoot out the lip.”
    reason: lexical_alternative
  - marker: b
    text: Or “they wag the head,” a gesture of scorn.
    reason: lexical_alternative
translation:
  language: ko
  text: 저를 보는 사람은 모두 저를 조롱합니다. 그들은 입술을 내밀고[a] 머리를 흔듭니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘입술을 벌립니다’ 또는 전통적으로 ‘입술을 내밉니다’라고 옮길 수 있습니다. 히브리어 표현은 조롱하거나 경멸할 때 하는 입의 몸짓을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘머리를 까딱합니다.’ 이는 경멸이나 조롱을 나타내는 몸짓입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָנֹכִי
  english_pob_choice: But I
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 그리고 저는
  - 하지만 저는
  lexicon: WLC
  rationale: 문맥상 앞선 탄식과 대비를 이루는 전환이므로, 단순한 접속보다 역접의 힘을 살린 ‘그러나’를 택했습니다.
- source_word: תוֹלַעַת
  english_pob_choice: a worm
  chosen_korean: 벌레 같고
  alternatives_korean:
  - 한 벌레이고
  - 지렁이 같고
  - 구더기 같고
  lexicon: HALOT
  rationale: תוֹלַעַת의 비유적 겸손·비참을 한국어에서 자연스럽게 살리기 위해 직역보다 ‘벌레 같고’로 옮겼습니다.
- source_word: חֶרְפַּת אָדָם
  english_pob_choice: scorned by mankind / a reproach of men
  chosen_korean: 사람들의 수치요
  alternatives_korean:
  - 사람들의 조롱이요
  - 사람의 수치요
  - 인류의 수치요
  lexicon: HALOT
  rationale: חֶרְפָּה의 핵심 의미인 ‘수치, 모욕, 치욕’을 드러내기 위해 ‘수치’로 옮겼고, אָדָם은 문맥상 집합적 인간을 가리키므로 ‘사람들’로 처리했습니다.
- source_word: וּ/בְז֥וּי עָם
  english_pob_choice: despised by the people
  chosen_korean: 백성에게 멸시받는 자입니다
  alternatives_korean:
  - 백성에게 업신여김을 받는 자입니다
  - 사람들에게 멸시받는 자입니다
  - 백성에게 버림받은 자입니다
  lexicon: HALOT
  rationale: בְּזוּי의 수동적 ‘멸시받는’ 의미를 살리고, עָם은 집단적 ‘백성’으로 옮겨 병행구를 유지했습니다.
theological_decisions:
- issue: 시편 22편의 메시아적 연결을 본문 번역에 얼마나 드러낼지
  chosen_reading: 본문은 시인의 굴욕과 천대를 말하는 시적 진술로 그대로 옮기고, 메시아적 적용은 번역 외부의 정경적 읽기에 맡겼습니다.
  alternative_readings:
  - 메시아적 성취를 더 직접적으로 암시하는 확대 번역
  rationale: 히브리어 본문 자체는 극심한 수치와 경멸의 이미지를 말하므로, 번역문은 그 의미를 보존하고 신학적 연결은 주해에서 다루는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1 and §3
