id: DID.15
reference: Didache 15
unit: chapter
book: Didache
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Χειροτονήσατε οὖν ἑαυτοῖς ἐπισκόπους καὶ διακόνους ἀξίους τοῦ Κυρίου, ἄνδρας πραεῖς καὶ ἀφιλαργύρους καὶ ἀληθεῖς καὶ δεδοκιμασμένους· ὑμῖν γὰρ λειτουργοῦσι καὶ αὐτοὶ τὴν λειτουργίαν τῶν προφητῶν καὶ διδασκάλων. Μὴ οὖν ὑπερίδητε αὐτούς· αὐτοὶ γάρ εἰσιν οἱ τετιμημένοι ὑμῶν μετὰ τῶν προφητῶν καὶ διδασκάλων. Ἐλέγχετε δὲ ἀλλήλους μὴ ἐν ὀργῇ, ἀλλ' ἐν εἰρήνῃ, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ· καὶ παντὶ ἀστοχοῦντι κατὰ τοῦ ἑτέρου μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω, ἕως οὗ μετανοήσῃ. Τὰς δὲ εὐχὰς ὑμῶν καὶ τὰς ἐλεημοσύνας καὶ πάσας τὰς πράξεις οὕτω ποιήσατε, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ τοῦ Κυρίου ἡμῶν.
  language: Greek
  pages:
  - 40
  note: This chapter comes from the normalized Hitchcock & Brown 1884 OCR layer. Line-number noise and page segmentation were cleaned, but the translation must stay anchored in the Greek wording.
translation:
  text: Appoint[a], then, for yourselves overseers and deacons worthy of the Lord—men gentle and not lovers of money, and truthful and proven; for they too minister to you the ministry of the prophets and teachers. Therefore do not disregard them, for they are your honored ones together with the prophets and teachers. And reprove one another, not in anger but in peace[b], as you have it in the gospel; and let no one speak to anyone who goes wrong against another, nor let him hear from you, until he repents[e]. But perform your prayers and your acts of mercy and all your deeds in this way[d][c], as you have it in the gospel of our Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'Elect' or 'Ordain' for 'Appoint'; the Greek can include the sense of selecting leaders, possibly with election in view.
    reason: lexical_alternative
  - marker: b
    text: '''Overseers'' translates the Greek term directly; ''bishops'' reflects the later church title derived from the same word.'
    reason: lexical_alternative
  - marker: c
    text: '''Acts of mercy'' may also be rendered ''alms'' or ''almsgiving.'''
    reason: lexical_alternative
  - marker: d
    text: The phrase 'as you have it in the gospel' likely refers to the community's received gospel teaching as an authoritative norm for conduct.
    reason: cultural_note
  - marker: e
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repent in the communitys summons and reconciliation discipline, preserving its conditions rather than redefining them.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χειροτονήσατε
  chosen: Appoint
  rationale: The verb can denote appointing by selection, sometimes with the background of election by raised hand. 'Appoint' preserves the directive force without importing a later, more technical sacramental sense that 'ordain' may suggest.
  alternatives:
  - Elect
  - Ordain
  lexicon: LSJ; BDAG
- source_word: ἐπισκόπους
  chosen: overseers
  rationale: The basic sense is supervisory leaders. 'Overseers' translates the Greek meaning directly and avoids reading later monarchical episcopal structures back into the Didache.
  alternatives:
  - bishops
  lexicon: BDAG
- source_word: διακόνους
  chosen: deacons
  rationale: By this period the term functions as a recognizable church office alongside overseers. 'Deacons' preserves the early-Christian institutional texture better than the more generic 'servants' or 'ministers'.
  alternatives:
  - ministers
  - servants
  lexicon: BDAG
- source_word: δεδοκιμασμένους
  chosen: proven
  rationale: The participle denotes those whose character has been tested and shown genuine. 'Proven' is concise and natural.
  alternatives:
  - tested
  - approved
  lexicon: BDAG
- source_word: λειτουργοῦσι ... τὴν λειτουργίαν
  chosen: minister ... the ministry
  rationale: The repeated cognate language should be visible in English. 'Minister ... the ministry' preserves both the formal service sense and readable English, while avoiding an overly narrow liturgical technicality in the main text.
  alternatives:
  - perform service ... the service
  - carry out liturgy ... the liturgy
  lexicon: BDAG; LSJ
- source_word: ὑπερίδητε
  chosen: disregard
  rationale: The command concerns failing to give due regard to these officers. 'Disregard' fits the context of communal honor without overstating emotional contempt.
  alternatives:
  - despise
  - look down on
  lexicon: BDAG
- source_word: τετιμημένοι
  chosen: honored ones
  rationale: This preserves the honor-language explicitly and reads naturally in apposition to prophets and teachers.
  alternatives:
  - those held in honor
  - esteemed ones
  lexicon: BDAG
- source_word: ἀστοχοῦντι
  chosen: who goes wrong
  rationale: The verb literally suggests missing the mark or going astray. 'Who goes wrong' preserves the broader moral sense without forcing a more technical term than the Greek itself uses here.
  alternatives:
  - who sins
  - who errs
  - who misses the mark
  lexicon: BDAG
- source_word: μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω
  chosen: let no one speak ... nor let him hear from you
  rationale: 'The Greek construction prescribes a two-fold shunning: the community should not speak to the offender (μηδεὶς λαλειτώ), and consequently, the offender should not hear anything from the community (μηδὲ παρ'' ὑμῶν ἀκουέτω). The subject of ἀκουέτω (''let him hear'') is the offender, not the community. This rendering preserves the active voice and correct subject of the Greek command.'
  alternatives:
  - let no one address him, nor let him listen to anything from you
  - let no one speak with him, nor let him hear a word from you
  lexicon: BDAG
- source_word: ἐλεημοσύνας
  chosen: acts of mercy
  rationale: The word often denotes almsgiving, but 'acts of mercy' preserves the mercy-root and remains broad enough for the ethical context. The more specific alternative is noted in a footnote.
  alternatives:
  - alms
  - almsgiving
  lexicon: BDAG
theological_decisions:
- issue: Whether ἐπισκόπους should be rendered with later ecclesiastical terminology
  chosen_reading: overseers
  rationale: The Didache reflects early church order, but the Greek term's plain sense is supervisory leadership. Rendering it 'overseers' avoids importing later developed episcopal structures while preserving the office.
  alternative_readings:
  - bishops
- issue: Whether ἐλεημοσύνας should be narrowed to almsgiving
  chosen_reading: acts of mercy
  rationale: The term often means almsgiving specifically, but the broader rendering keeps the mercy dimension visible and suits the surrounding summary of Christian practice. The narrower alternative is preserved in a footnote.
  alternative_readings:
  - alms
  - almsgiving
- issue: Contextual repentance reassessment
  chosen_reading: Appoint[a], then, for yourselves overseers and deacons worthy of the Lord—men gentle and not lovers of money, and truthful and proven; for they too minister to you the ministry of the prophets and teachers. Therefore do not disregard them, for they are your honored ones together with the prophets and teachers. And reprove one another, not in anger but in peace[b], as you have it in the gospel; and let no one speak to anyone who goes wrong against another, nor let him hear from you, until he repents. But perform your prayers and your acts of mercy and all your deeds in this way[d][c], as you have it in the gospel of our Lord.
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repent in the communitys summons and reconciliation discipline, preserving its conditions rather than redefining them.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
