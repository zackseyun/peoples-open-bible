base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/001.yaml
  text: As a deer longs[a] for streams of water[c], so my soul[b] longs for you, O God.
  footnotes:
  - marker: a
    text: Or 'pants for'; the Hebrew verb can evoke intense thirst-like longing.
    reason: lexical_alternative
  - marker: b
    text: '''My soul'' may also be understood as ''my life,'' ''my self,'' or ''my inner being.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'watercourses' or 'channels of water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사슴이 시냇물을[a] 갈망하듯이, 하나님, 제 영혼[b]이 하나님을 갈망합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물길들’ 또는 ‘물의 수로들’. 히브리어는 물이 흐르는 시내나 수로를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영혼’은 여기서 ‘생명’, ‘자신’, 또는 ‘내면’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘헐떡입니다’. 히브리어 동사는 목마름처럼 절실하게 갈망하는 모습을 나타낼 수 있습니다.
    reason: lexical_alternative
