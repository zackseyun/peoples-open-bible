lexical_decisions:
- source_word: לב
  chosen: heart
  alternatives:
  - mind
  - inner self
  lexicon: HALOT
  rationale: Hebrew לב commonly denotes the inner person, including thought and feeling. 'Heart' preserves the Hebrew anthropological image and remains natural English.
- source_word: אנוש
  chosen: a man
  alternatives:
  - a human
  - a person
  - humankind
  lexicon: HALOT
  rationale: The singular noun denotes a human being, often with emphasis on frailty or mortality. Here the singular proverb is best carried by 'a man' under the project's gender-accurate policy, while still functioning generically.
- source_word: יגיד
  chosen: tells of
  alternatives:
  - declares
  - reports
  - makes known
  lexicon: HALOT
  rationale: The verb נגד in Hifil means to tell, declare, or make known. 'Tells of' fits the proverbial style and the object that follows.
- source_word: שעיותיו
  chosen: his troubles
  alternatives:
  - his anxieties
  - his concerns
  - his thoughts
  - his errors
  lexicon: HALOT
  rationale: The Hebrew form is difficult and likely reflects a noun for cares, troubles, or inward concerns; the source validation notes a minor mismatch, and the Greek parallel diverges sharply. 'His troubles' best fits the Hebrew line's sense that the heart reveals a person's inner distress, and it coheres with the comparison to vigilant watchmen who detect danger.
- source_word: משבעה
  chosen: more than seven
  alternatives:
  - beyond seven
  - from seven
  lexicon: HALOT
  rationale: The comparative מן is naturally rendered 'more than' in this context, setting the heart's testimony above that of multiple watchmen.
- source_word: צופים
  chosen: watchmen
  alternatives:
  - watchers
  - guards
  - lookouts
  lexicon: HALOT
  rationale: The participle from צפה refers to those who keep watch. 'Watchmen' is idiomatic and suits the proverb's imagery.
- source_word: על מצפה
  chosen: on a lookout
  alternatives:
  - on a watchtower
  - at a lookout post
  - on a height
  lexicon: HALOT
  rationale: מצפה is a lookout point or watchpost. 'On a lookout' keeps the image concise and avoids over-specifying a tower if the term is broader.
