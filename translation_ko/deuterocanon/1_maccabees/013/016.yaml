  text: And now send a hundred talents of silver, and two of his sons as hostages, so that, once released, he may not revolt from us; and we will release him.
translation:
  language: ko
  text: 이제 은 백 달란트와 그의 두 아들을 인질로 보내십시오. 그가 풀려난 뒤 우리에게 반역하지 않도록, 우리는 그를 놓아줄 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργυρίου ἑκατὸν τάλαντα
  english_pob_choice: a hundred talents of silver
  chosen_korean: 은 백 달란트
  alternatives_korean:
  - 은전 백 달란트
  - 은화 백 달란트
  lexicon: ἀργύριον
  rationale: 직역으로 ‘은’이 재료/가치를 나타내며, ‘달란트’는 당시 화폐 단위로 유지하는 것이 원문의 경제적 요구를 가장 직접적으로 드러냅니다.
- source_word: ὅμηρα
  english_pob_choice: hostages
  chosen_korean: 인질
  alternatives_korean:
  - 보증인
  - 담보
  lexicon: ὅμηρος
  rationale: 정치적 협상에서 억류된 사람을 뜻하므로 ‘인질’이 문맥과 어휘값을 가장 정확하게 반영합니다.
- source_word: ἀποστατήσῃ ἀφʼ ἡμῶν
  english_pob_choice: revolt from us
  chosen_korean: 우리에게서 배반하지
  alternatives_korean:
  - 우리에게서 반역하지
  - 우리에게서 떨어져 나가지
  lexicon: ἀποστατέω
  rationale: 동사의 핵심은 단순한 이탈보다 충성 이탈과 반역성을 포함하므로 ‘배반하다’가 한국어에서 가장 자연스럽고 의미를 보존합니다.
- source_word: ἀφήσομεν αὐτόν
  english_pob_choice: we will release him
  chosen_korean: 우리는 그를 놓아줄 것입니다
  alternatives_korean:
  - 우리는 그를 석방할 것입니다
  - 우리는 그를 풀어줄 것입니다
  lexicon: ἀφίημι
  rationale: 원문의 법적·실무적 맥락에서 단순히 ‘풀어주다’의 의미이므로 ‘놓아주다’가 평이하면서도 정확합니다.
theological_decisions:
- issue: 조건절의 시점 표현
  chosen_reading: ‘풀려난 뒤’로 옮겨, 영어 POB의 수정된 ‘once released’를 반영했습니다.
  alternative_readings:
  - 풀려나면
  - 석방되면
  rationale: ἁφεθείς의 수동 분사와 결과/시점 관계를 자연스럽게 드러내며, 단순 가정법보다 ‘일단 풀려난 뒤’라는 조건성·선후관계를 더 분명히 합니다.
  doctrine_reference: 없음(문법·시제 관계)
- issue: ‘배반하다’의 강도
  chosen_reading: ‘배반하지 않을 것이며’로 옮겨 반역적 이탈의 함의를 살렸습니다.
  alternative_readings:
  - 반역하지 않을 것이며
  - 떠나지 않을 것이며
  rationale: ἀποστατέω는 단순한 이동이 아니라 정치적·언약적 이탈을 가리키므로, 본문 상황에 맞는 강한 표현을 유지하는 것이 타당합니다.
  doctrine_reference: 없음(역사서 문맥)
