  meaning: The son risks having outsiders consume his resources and acquire what his toil has earned.
  meaning_decisions:
  - source_phrase: כֹּחֶךָ
    prior_rendering: your strength
    new_rendering: your wealth
    rationale: The parallel reference to the proceeds of toil passing into another household favors resources produced by the son’s strength. “Wealth” conveys that economic loss directly, while the note preserves the broader source expression.
  - source_phrase: וַעֲצָבֶיךָ בְּבֵית
    prior_rendering: and your labors go to the house of
    new_rendering: and the fruit of your toil ends up in
    rationale: What passes into another household is what the labor has produced, not the acts of labor themselves. The new wording carries the painful exertion implied by the noun and makes the resulting transfer clear.
  - source_phrase: נָכְרִי
    prior_rendering: a foreigner
    new_rendering: an outsider
    rationale: The contrast is between the son’s own household and someone outside it; foreign nationality is not required. “Outsider” avoids suggesting that ethnicity is the point of the warning.
