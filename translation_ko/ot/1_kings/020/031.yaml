source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: ko
  text: 그의 종들이 그에게 말했습니다. “보십시오, 우리가 듣기로는 이스라엘 왕가의 왕들은 자비로운 왕들입니다. 그러니 우리가 굵은 베옷을 허리에 두르고[a] 머리에 밧줄을 두른 채 이스라엘 왕에게 나아가도록 허락해 주십시오. 어쩌면 그가 당신의 목숨을 살려 줄지도 모릅니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘굵은 베옷’은 애통이나 항복의 표시로 몸에 두르던 거친 천으로 만든 옷을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 시종들
  - 그의 종된 자들
  lexicon: עֶבֶד / עֲבָדִים
  rationale: 문맥상 왕에게 속한 하인들이므로 기본값인 ‘종들’이 가장 직접적이며, 현대 한국어에서도 위계적 소속을 잘 드러냅니다.
- source_word: מַלְכֵי חֶסֶד
  english_pob_choice: merciful kings
  chosen_korean: 자비로운 왕들
  alternatives_korean:
  - 은혜로운 왕들
  - 긍휼이 많은 왕들
  lexicon: חֶסֶד
  rationale: חֶסֶד의 핵심을 통상적 덕목인 ‘자비’로 옮기되, 왕들의 성격을 묘사하는 형용사 구조를 유지했습니다.
- source_word: שַׂקִּים
  english_pob_choice: sackcloth
  chosen_korean: 굵은삼베
  alternatives_korean:
  - 베옷
  - 자루천
  lexicon: שַׂק
  rationale: 애통/굴복의 표지인 포대자루 계열 옷감을 한국어 성경에서 흔히 이해되는 ‘굵은삼베’로 옮겨, 상징성을 살렸습니다.
- source_word: חֲבָלִים בְּרֹאשֵׁנוּ
  english_pob_choice: ropes on our heads
  chosen_korean: 머리에는 밧줄을 매고
  alternatives_korean:
  - 머리에 밧줄을 두르고
  - 머리 위에 밧줄을 두르고
  lexicon: חֶבֶל
  rationale: 직역하면 ‘머리 위/에 밧줄’이지만, 한국어에서 자연스러운 도해는 ‘머리에 밧줄을 매다’이므로 동작을 그대로 전달했습니다.
- source_word: יְחַיֶּה אֶת נַפְשֶׁךָ
  english_pob_choice: he will let you live
  chosen_korean: 그가 당신의 목숨을 살려 줄지도 모릅니다
  alternatives_korean:
  - 그가 당신의 생명을 살려 줄지도 모릅니다
  - 그가 당신을 살려 줄지도 모릅니다
  lexicon: נֶפֶשׁ
  rationale: ‘목숨/생명’ 중에서 본문이 살릴 대상인 개인의 생명 보존을 분명히 하므로 ‘목숨’을 택했고, 가능성 부사어로 ‘perhaps’를 반영했습니다.
theological_decisions:
- issue: 이스라엘 왕들을 ‘자비로운 왕들’로 부르는 표현의 뉘앙스
  chosen_reading: 정치적/외교적 완곡어법으로서 왕들의 성향을 ‘자비로운’ 것으로 호소하는 진술로 옮겼습니다.
  alternative_readings:
  - ‘은혜로운 왕들’로 옮겨 신적 은혜 뉘앙스를 더 강하게 드러내는 읽기
  - ‘호의로운 왕들’로 보다 외교적 의미를 강조하는 읽기
  rationale: 히브리어 חֶסֶד는 언약적 자비까지 포함할 수 있으나, 이 장면에서는 포위된 아람 측 사신들의 유화 전략이므로 왕의 처분 성향을 가리키는 현실적 표현으로 유지하는 편이 본문에 충실합니다.
  doctrine_reference: 서사문맥 해석
- issue: ‘당신의 목숨을 살려 줄지도 모릅니다’의 가능성 표현
  chosen_reading: 예언적 확언이 아니라 정중한 추정으로 처리해 ‘-지도 모릅니다’로 옮겼습니다.
  alternative_readings:
  - ‘그가 당신을 살려 줄 것입니다’로 단정적으로 옮기는 읽기
  - ‘그가 당신의 생명을 건져 줄 수도 있습니다’로 더 완곡하게 옮기는 읽기
  rationale: 원문 אוּלַי는 가능성을 나타내므로, 협상 전략의 불확실성을 살려야 합니다.
  doctrine_reference: 서사 문법
