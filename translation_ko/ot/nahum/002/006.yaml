  text: He summons his nobles; they stumble in their march. They hurry to her wall, and the siege shelter is set up.
translation:
  language: ko
  text: 그는 자기 고관들을[a] 소집합니다. 그들이 행진 중에 비틀거립니다. 그들은 그 성벽을[b] 향해 서두르고, 공성 차폐물이 설치됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אַדִּירָיו는 ‘고관들’, ‘유력한 자들’, 또는 ‘용사들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 도시를 여성형으로 가리켜 직역하면 ‘그녀의 성벽’입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יִזְכֹּר֙ אַדִּירָ֔י/ו
  english_pob_choice: He summons his nobles
  chosen_korean: 그는 자기 귀족들을 부르니
  alternatives_korean:
  - 그는 자기 귀족들을 기억하니
  - 그는 자기 권세자들을 부르니
  - 그는 자기 고관들을 부르니
  lexicon: זכר + אַדִּיר
  rationale: 문맥상 단순한 ‘기억하다’보다 소집·호출의 결과를 드러내는 POB의 ‘summons’를 따라, אַדִּירָ֔יו는 ‘귀족들’로 옮겨 권세 있는 측근 집단을 살렸습니다.
- source_word: יִכָּשְׁל֖וּ
  english_pob_choice: they stumble
  chosen_korean: 비틀거립니다
  alternatives_korean:
  - 걸려 넘어집니다
  - 쓰러집니다
  - 비틀거립니다
  lexicon: כשׁל
  rationale: 전쟁 행진 중의 장애와 동요를 담아, 단순한 낙상보다 진행 중 흔들리고 주저앉는 뉘앙스를 가진 ‘비틀거리다’를 선택했습니다.
- source_word: חֽוֹמָתָ֔/הּ
  english_pob_choice: her wall
  chosen_korean: 성벽으로
  alternatives_korean:
  - 그녀의 성벽으로
  - 그 성벽으로
  - 성벽으로
  lexicon: חומה
  rationale: 히브리어 여성형 대명사를 그대로 풀면 어색해지므로, 도시를 가리키는 의인화는 유지하되 한국어 본문은 자연스럽게 ‘성벽으로’ 처리했습니다.
- source_word: וְ/הֻכַ֖ן הַ/סֹּכֵֽךְ
  english_pob_choice: and the siege shelter is set up
  chosen_korean: 포위 장비가 갖추어집니다
  alternatives_korean:
  - 포위용 차폐물이 설치됩니다
  - 공성차가 세워집니다
  - 포위 장비가 갖추어집니다
  lexicon: סכך
  rationale: 문맥의 공성전 장비를 살리면서도, 정확한 기계 명칭을 단정하기 어려워 POB의 중립적 의미를 따라 ‘포위 장비’로 넓게 옮겼습니다.
theological_decisions:
- issue: 도시를 여성 대명사로 받는 의인화
  chosen_reading: ‘성벽으로’로 옮기되, 문맥상 니느웨를 여성화한 표현은 한국어 본문에서 과도하게 드러내지 않았습니다.
  alternative_readings:
  - ‘그녀의 성벽으로’
  - ‘그 도시의 성벽으로’
  rationale: 히브리어는 도시를 여성형으로 다루지만, 한국어에서는 인칭대명사 노출이 어색해 문학적 의인화를 보존하면서도 독서 흐름을 해치지 않는 쪽을 택했습니다.
  doctrine_reference: 문체·수사 장치 처리
