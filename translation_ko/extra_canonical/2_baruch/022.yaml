  text: '1 And it happened after these things, and behold, I heard a voice, and I saw a might fixed upon me. And a voice was heard from on high and said to me:


    2 “Baruch, Baruch, why are you troubled?


    3 Does one who sets out on a road fail to find it? Or can one who sails on the sea find rest unless he reaches the harbor?


    4 Or if a treasure is given to someone, does he not take confidence from it, so that he is no longer shaken?


    5 Or if someone sows the earth, unless he loses instead of his fruits, is he afterward ruined by famine?


    6 Or if someone plants a vineyard, unless he takes from it fruit for nourishment, does not the one who planted it expect to take fruit from it?


    7 Or does a woman who is pregnant, if she gives birth without pains, expect a dead child in her womb?


    8 Or one who builds a house …”'
translation:
  language: ko
  text: '1 그 뒤에 이런 일들이 있은 후, 보라, 나는 한 음성을 들었고 내 위에 세워진 한 능력을 보았습니다. 그리고 높은 곳으로부터 음성이 들려와 내게 말했습니다:


    2 “바룩아, 바룩아, 왜 네가 괴로워합니까?


    3 길을 떠난 사람이 그 길을 찾지 못하겠습니까? 또는 바다를 건너는 사람이 항구에 이르지 않고서 쉼을 얻을 수 있겠습니까?


    4 또는 어떤 이에게 보물이 주어지면, 그가 그것을 믿고 의지하여 더는 흔들리지 않지 않겠습니까?


    5 또는 어떤 이가 땅에 씨를 뿌렸을 때, 열매 대신 그것을 잃지 않는다면, 그는 그 뒤에 기근으로 망하겠습니까?


    6 또는 어떤 이가 포도원을 심었을 때, 거기서 먹을 열매를 취하지 않는다면, 그것을 심은 이가 열매를 받을 것을 기대하지 않겠습니까?


    7 또는 임신한 여인이, 해산의 고통 없이 아이를 낳는다면, 그 뱃속에서 죽은 아이를 기대하겠습니까?


    8 또는 집을 짓는 사람…”[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܐ
  english_pob_choice: a might fixed upon me
  chosen_korean: 내 위에 세워진 한 능력
  alternatives_korean:
  - 내게 고정된 한 힘
  - 내 위에 놓인 한 힘
  - 내 위에 임한 한 능력
  lexicon: ܚܝܠܐ
  rationale: 영어 POB의 ‘might fixed upon me’를 따라 단순한 소리보다 ‘위에 세워진’ 상태를 살리고, 1인칭 수동 경험을 자연스럽게 옮겼습니다.
- source_word: ܡܬܚܘܐ
  english_pob_choice: why are you troubled?
  chosen_korean: 왜 네가 괴로워합니까?
  alternatives_korean:
  - 왜 네가 근심합니까?
  - 왜 네가 번민합니까?
  - 왜 네가 당황합니까?
  lexicon: ܐܬܚܘܐ / ܚܘܝ
  rationale: 문맥상 단순한 불안보다 안팎으로 흔들리는 상태를 묻는 말이어서 ‘괴로워합니까’로 옮겼습니다.
- source_word: ܠܐ ܬܫܬܐ / ܘܠܐ ܬܙܥܪ
  english_pob_choice: fail to find / find rest / shaken
  chosen_korean: 찾지 못하겠습니까 / 쉼을 얻을 수 있겠습니까 / 더는 흔들리지
  alternatives_korean:
  - 못 찾겠습니까 / 쉬지 못하겠습니까 / 더는 동요하지
  - 길을 발견하지 못하겠습니까 / 안식을 얻지 않겠습니까 / 더는 요동치지
  lexicon: ܫܟܚ / ܢܝܚܐ / ܙܥܪ
  rationale: 연속된 비유의 대비를 살리기 위해 ‘찾다-쉼-흔들리다’의 동사군을 일관되게 배치했습니다.
- source_word: ܒܟܐ̈ܐ / ܐܘܠܨܢܐ
  english_pob_choice: without pains
  chosen_korean: 해산의 고통 없이
  alternatives_korean:
  - 산통 없이
  - 고통 없이
  - 해산 진통 없이
  lexicon: ܒܟܐ̈ܐ
  rationale: 출산 비유의 통상적 한국어를 따르되, 본문의 ‘고통’이 해산 맥락임을 분명히 했습니다.
theological_decisions:
- issue: 하늘에서 들린 음성의 화법
  chosen_reading: 직접 신적 위로의 수사로 보고, 인물 호칭과 수사 질문을 현대 한국어의 공적·권위적 어조로 옮겼습니다.
  alternative_readings:
  - 단순한 내적 음성으로 완화
  - 서사적 설명체로 평이화
  rationale: 본문은 천상 음성이 연속 수사 질문으로 바룩을 격려하므로, 권위와 위로의 긴장을 유지하는 것이 중요합니다.
  doctrine_reference: apocryphal narrative register
- issue: ‘한 능력’의 실체
  chosen_reading: 음성 뒤에 선 ‘능력’을 인격적 존재로 단정하지 않고, 시각적으로 ‘세워진’ 힘/능력으로 남겼습니다.
  alternative_readings:
  - ‘힘’으로 축소
  - 천사적 존재로 구체화
  rationale: 원문과 POB 모두 실체의 정체를 열어 두므로, 불필요한 신학적 특정화를 피했습니다.
