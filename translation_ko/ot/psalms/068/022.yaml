theological_decisions:
- issue: אֹיְבָיו의 소유격이 가리키는 대상
  chosen_reading: ‘원수들의’로 옮겨, 소유격의 가장 자연스러운 선행사인 하나님을 가리키는 표현을 유지했습니다.
  alternative_readings:
  - ‘그의 원수들’로 일반화하는 읽기
  - 이스라엘의 원수들로 이해하는 읽기
  rationale: 주어가 단수형 하나님이므로 소유격을 하나님께 돌리는 것이 본문 흐름에 가장 가깝습니다. 문맥상의 신학적 확장을 절제하고 원문의 직설성을 보존했습니다.
  doctrine_reference: 원문 우선, 해석적 범위를 본문이 말하는 만큼만 유지
- issue: ‘머리/정수리’의 이중 병렬
  chosen_reading: 두 신체 이미지를 모두 살려 동일한 파괴 행위를 반복적으로 제시했습니다.
  alternative_readings:
  - 하나로 합쳐 ‘머리’를 반복하는 읽기
  - 두 표현을 모두 포괄하는 ‘두상’으로 통합하는 읽기
  rationale: 시적 평행법을 보존하기 위해 רֹאשׁ과 קָדְקֹד을 둘 다 드러냈습니다. 한국어에서는 다소 중복처럼 보일 수 있으나, 원문이 의도한 강조를 살리는 쪽을 택했습니다.
  doctrine_reference: 시적 평행 구조 보존
