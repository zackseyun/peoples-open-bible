  category: meaning_retranslation
  from: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: For your sake I have sent to Babylon and brought them all down as fugitives, even the Chaldeans[b], in the ships of their rejoicing.'
  to: 'This is what Yahweh says, your Redeemer, the Holy One of Israel: For your sake I will send a force against Babylon[a] and bring them all down, sending even the Chaldeans fleeing[b] in the ships they delight in.'
  rationale: The documented interpretation of fugitives and ships associated with rejoicing remains the basis of the rendering, with the alternative “bars” retained because the wording is genuinely difficult. I depart from the earlier defense of leaving “sent” without an object and from its past-tense presentation to make the hostile mission and promised deliverance intelligible in English.
