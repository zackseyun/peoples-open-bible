    rationale: Both Hebrew verbs in this verse are plural, referring to Moses and Aaron; naming Aaron makes that otherwise invisible distinction clear, and “broke faith” expresses the breach of trust directly.
  - source_phrase: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
    prior_rendering: among the sons of Israel
