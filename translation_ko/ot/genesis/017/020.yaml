id: GEN.17.20
reference: Genesis 17:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/לְ/יִשְׁמָעֵ֘אל שְׁמַעְתִּי/ךָ֒ הִנֵּ֣ה בֵּרַ֣כְתִּי אֹת֗/וֹ וְ/הִפְרֵיתִ֥י אֹת֛/וֹ וְ/הִרְבֵּיתִ֥י אֹת֖/וֹ בִּ/מְאֹ֣ד מְאֹ֑ד שְׁנֵים עָשָׂ֤ר נְשִׂיאִם֙ יוֹלִ֔יד וּ/נְתַתִּ֖י/ו לְ/ג֥וֹי גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: ko
  text: 이스마엘에 대해서도 내가 네 말을 들었습니다. 보십시오, 내가 그에게 복을 주었고, 그를 생육하게 하며, 그를 크게 번성하게 하겠습니다. 그는 열두 명의 족장을 낳을 것이며, 내가 그를 큰 민족이 되게 하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיִשְׁמָעֵאל / Ishmael
  english_pob_choice: And as for Ishmael
  chosen_korean: 그리고 이스마엘에 관해서는
  alternatives_korean:
  - 이스마엘에 대해서는
  - 이스마엘에 관하여는
  lexicon: 고유명사
  rationale: 문두의 전치사구는 대조적 화제 표지로 기능하므로, 한국어에서도 ‘~에 관해서는’으로 주제를 분명히 드러냈습니다.
- source_word: שְׁמַעְתִּיךָ
  english_pob_choice: I have heard you
  chosen_korean: 내가 너를 들었습니다
  alternatives_korean:
  - 내가 네 말을 들었습니다
  - 내가 네 청을 들었습니다
  lexicon: שׁמע
  rationale: 직접 말한 내용을 ‘들었다’로 단순화하지 않고, 하나님이 아브라함의 간구를 응답하셨다는 의미가 드러나도록 유지했습니다.
- source_word: בֵּרַכְתִּי / וְהִפְרֵיתִי / וְהִרְבֵּיתִי
  english_pob_choice: I have blessed him, and will make him fruitful, and will multiply him exceedingly
  chosen_korean: 내가 그를 복 주었고, 그를 번성하게 하고, 그를 매우 많이 번성하게 하겠습니다
  alternatives_korean:
  - 내가 그에게 복을 주었고, 그를 열매 맺게 하고, 그를 크게 늘리겠습니다
  - 내가 그를 복 주고 번성하게 하며 아주 크게 늘리겠습니다
  lexicon: ברך / פרה / רבה
  rationale: ‘복 주다’와 ‘번성하게 하다/많이 번성하게 하다’의 반복 구조를 살려, 축복과 생육·번성의 누적을 본문처럼 보여 주었습니다.
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם
  english_pob_choice: twelve princes
  chosen_korean: 열두 명의 지파 지도자들
  alternatives_korean:
  - 열두 통치자들
  - 열두 왕족 지도자들
  lexicon: נָשִׂיא
  rationale: נָשִׂיא는 단순한 ‘왕자’보다 지파를 이끄는 수장/족장 성격이 강하므로, POB의 ‘princes’를 한국어로 기능적으로 옮겼습니다.
- source_word: גּוֹי גָּדוֹל
  english_pob_choice: a great nation
  chosen_korean: 큰 민족
  alternatives_korean:
  - 큰 나라
  - 위대한 민족
  lexicon: גּוֹי
  rationale: גּוֹי는 정치국가보다 민족 집단을 가리키는 기본 의미가 있으므로, ‘민족’으로 옮겨 아브라함 언약의 집단적 후손 개념을 살렸습니다.
theological_decisions:
- issue: 하나님이 이스마엘에게 내리시는 약속의 범위
  chosen_reading: 본문은 언약 계승의 중심선이 아니라도, 이스마엘에 대한 실제적인 복과 번성의 약속을 분명히 전달합니다.
  alternative_readings:
  - 단순한 일반 축복
  - 장차 민족 형성에 대한 예언적 선언
  rationale: ‘복 주었고 / 번성하게 하고 / 큰 민족’이라는 연속은 최소한의 일반 축복을 넘어서, 후손과 민족 형성에 대한 구체적 약속을 나타냅니다.
  doctrine_reference: 창세기 17장 문맥의 언약 약속과 이삭-이스마엘 구별
