revisions:
- from: 거기에는 작은 베냐민이 그들을 이끌고 있고, 유다의 지도자들은 그들의 무리 가운데 있으며, 스불론의 지도자들과 납달리의 지도자들이 있습니다.[a][b]
  to: 당신의 하나님께서 당신의 힘을 명하셨습니다. 하나님, 능력을 나타내십시오[a]. 주께서는 우리를 위하여 행하셨습니다.
  rationale: 원문과 영어 POB 감사 기록에 맞추어, 잘못 삽입된 다른 절의 내용을 시편 68:28 전체 번역으로 교체했습니다. 첫 문장의 완료형은 ‘명하셨습니다’로, 호격 אֱלֹהִים은 ‘하나님’으로, לָנוּ의 수혜 의미는 ‘우리를 위하여’로 반영했습니다. 난해한 עוּזָה는 본문에서 ‘능력을 나타내십시오’로 번역하되, 가능한 대안들을 각주에 남겨 해석의 불확실성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
