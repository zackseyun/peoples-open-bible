theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Semantic force of קֹנֵה שָׁמַיִם וָאָרֶץ
  chosen_reading: possessor of heaven and earth
  alternative_readings:
  - creator of heaven and earth
  - maker of heaven and earth
  - owner of heaven and earth
  rationale: The Hebrew permits a range including possession and creation. To preserve theological tension rather than resolve it, the main text keeps 'possessor,' while a footnote preserves 'creator' as a significant alternative with contextual support from the title's meaning.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
revisions:
