translation:
  language: ko
  text: 딸아, 들으십시오[a]. 그리고 보십시오. 귀를 기울이시고, 당신의 백성과 아버지의 집을 잊으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “딸아, 귀 기울이고 살피십시오.”
