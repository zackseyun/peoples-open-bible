  source_fidelity: 현 번역의 ‘자기를 축복하면서’는 히브리어 בֵּרֵךְ에 재귀 목적어가 명시되지 않았음에도 이를 보충한 것으로, 원문의 난해한 어법을 한 해석으로 고정합니다. 이 문맥에서 בֵּרֵךְ는 완곡하게 ‘저주하다’로 쓰인 것으로 흔히 이해되며, 이어지는 ‘야훼를 멸시하다’와도 잘 연결됩니다. בֹּצֵעַ는 단순한 탐욕 일반보다 부당한 이득을 탐하는 사람을 가리킬 수 있습니다.
  naturalness: ‘악인은 … 자랑하며’와 ‘… 저주하며 멸시합니다’는 시적 병렬을 유지하면서 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘자기 마음의 욕망’은 ‘자기 욕망’으로 다듬어 중복을 줄였습니다.
  terminology: רָשָׁע는 ‘악인’, תַּאֲוַת נַפְשׁוֹ는 ‘자기 욕망’, בֹּצֵעַ는 ‘부당한 이득을 탐하는 자’로 옮겼습니다. יְהוָה는 초안의 표기 원칙을 유지하여 ‘야훼’로 표기했습니다. בֵּרֵךְ의 문자적 의미와 문맥적 완곡 용법은 각주로 밝혀 본문의 해석적 확정을 최소화했습니다.
