id: SNG.7.1
reference: Song of Songs 7:1
source:
  edition: WLC
  text: שׁ֤וּבִי שׁ֨וּבִי֙ הַ/שּׁ֣וּלַמִּ֔ית שׁ֥וּבִי שׁ֖וּבִי וְ/נֶחֱזֶה בָּ֑/ךְ מַֽה תֶּחֱזוּ֙ בַּ/שּׁ֣וּלַמִּ֔ית כִּ/מְחֹלַ֖ת הַֽ/מַּחֲנָֽיִם־־׃
translation:
  text: Come back[a], come back, Shulammite! Come back, come back, so that we may look at you. Why do you look at the Shulammite as though you were watching the dance of Mahanaim[b]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “Turn around.” The repeated Hebrew summons can mean returning or turning around.
    reason: alternative_reading
  - marker: b
    text: 'Alternatively, the closing words may form a question and answer: “What do you see in the Shulammite?”—“Like the dance of Mahanaim.” Mahanaim may be a place name or may refer to “two camps.” The Hebrew construction is uncertain.'
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוּבִי
  chosen: Come back
  alternatives:
  - Turn back
  - Come back
  lexicon: HALOT
  rationale: Natural direct English for the repeated summons, without fixing whether the return is physical or relational.
- source_word: הַשּׁוּלַמִּית
  chosen: Shulammite
  alternatives:
  - the Shulammite woman
  lexicon: HALOT
  rationale: A personal/designation term best transliterated under the project's policy to transliterate names. Retaining 'Shulammite' preserves the ambiguity of whether it is a gentilic, title, or poetic counterpart to Solomon.
- source_word: וְנֶחֱזֶה בָּךְ
  chosen: that we may look at you
  alternatives:
  - and let us gaze at you
  - that we may behold you
  lexicon: HALOT
  rationale: The cohortative-like first person plural expresses purpose/result after the repeated imperatives. 'Look at you' is natural modern English and preserves the visual focus. 'Behold' is too elevated; 'gaze' may imply a stronger intensity than the Hebrew requires.
- source_word: מַה
  chosen: Why
  alternatives:
  - What
  lexicon: HALOT
  rationale: 'Although מה commonly means ''what,'' in this idiom the sense is interrogative-explanatory: ''Why do you look...?'' This yields coherent English and matches the likely rhetorical force better than the more wooden ''What do you see...?'' in this immediate syntax.'
- source_word: תֶּחֱזוּ
  chosen: do you look
  alternatives:
  - do you see
  - do you gaze
  lexicon: HALOT
  rationale: The imperfect can express the direct present question; “would” introduces an unmarked modal qualification.
- source_word: כִּמְחֹלַת
  chosen: as at the dance of
  alternatives:
  - like the dance of
  - as though it were the dance of
  lexicon: HALOT
  rationale: The prefixed כ marks comparison. 'As at the dance of' fits the verbal phrase 'look at' and keeps the simile explicit.
- source_word: הַמַּחֲנָיִם
  chosen: Mahanaim
  alternatives:
  - the two camps
  lexicon: HALOT
  rationale: Best taken as the place name Mahanaim and transliterated as a proper name. The lexical meaning 'two camps' may underlie the name, but translating it in the main text would obscure the likely toponymic force and the traditional identification of the phrase.
