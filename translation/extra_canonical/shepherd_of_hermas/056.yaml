theological_decisions:
- issue: Addressing the angelic guide as Κύριε
  chosen_reading: Rendered 'Sir' rather than 'Lord'
  alternative_readings:
  - Render 'Lord' as in many NT contexts
  rationale: Here Hermas addresses the shepherd-guide respectfully, not the divine Lord. 'Sir' removes potential confusion with God/Christ while reflecting the polite vocative.
- issue: ἡ πίστις τοῦ Κυρίου (genitive construal)
  chosen_reading: 'Objective genitive: ''faith in the Lord'''
  alternative_readings:
  - 'Subjective genitive: ''the Lord’s faith/faithfulness'''
  rationale: Hermas consistently exhorts hearers to personal faith and moral steadfastness; immediate context is their strengthening to serve. Thus the genitive most naturally indicates the object of their faith.
- issue: δουλεύειν τῷ Κυρίῳ
  chosen_reading: Render as 'serve the Lord'
  alternative_readings:
  - '''Be enslaved to the Lord'''
  rationale: While the verb can carry slave imagery, here the emphasis is loyal service with a pure heart. 'Serve' preserves devotion without foregrounding chattel slavery imagery absent in context.
- issue: Contextual repentance reassessment
  chosen_reading: Exact reader wording is recorded in config/terminology/repentance-contextual-2026-10-13.json#translation/extra_canonical/shepherd_of_hermas/056.yaml
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
