  from: Praise Yah! I will give thanks to Yahweh with my whole heart[a][b], in the council of the upright and in the congregation.
  to: Praise Yah![b] I will give thanks to Yahweh with my whole heart, in the council[a] of the upright and in the congregation.
  rationale: 'The translation is sound, but the existing markers are falsely attached to “heart.” The semantic range of סוֹד is a real contextual ambiguity worth retaining: “council” may also suggest an intimate circle or assembly. The opening acclamation note may be retained as a rendering note, but it must attach to “Praise Yah.”'
