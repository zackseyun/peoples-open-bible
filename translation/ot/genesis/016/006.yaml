  from: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
  to: Then Abram said to Sarai, “Look, your servant woman is in your power[a]; do to her what seems good to you.” Then Sarai treated her harshly, and Hagar fled from her.
  rationale: The documented alternatives establish real harsh treatment while cautioning against specifying an unrecorded form of abuse. “Treated her harshly” carries that meaning directly, and the authority idiom is clarified without softening Hagar’s vulnerability.
