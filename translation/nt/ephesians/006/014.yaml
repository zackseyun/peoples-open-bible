  from: having fastened the belt around your waist in truth, and having put on
  to: fastening the belt of truth around your waist and putting on
  rationale: The current rendering uses the 'having + past participle' construction twice ('having fastened... and having put on'). While this is a literal translation of the Greek aorist participles, the construction is stilted in English and can feel like a list of prior actions rather than the manner of standing. Using English present participles ('fastening... and putting on...') is a more natural way to express contemporaneous action modifying the main verb 'Stand.' Additionally, rendering '...in truth' as 'the belt of truth' is a common and strong interpretation that makes the metaphor clearer and more forceful, which aligns well with an optimal-equivalence philosophy.
