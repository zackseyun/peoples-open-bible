id: 2KI.8.10
reference: 2 Kings 8:10
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱלִישָׁ֔ע לֵ֥ךְ אֱמָר לא חָיֹ֣ה תִחְיֶ֑ה וְ/הִרְאַ֥/נִי יְהוָ֖ה כִּֽי מ֥וֹת יָמֽוּת־־׃
translation:
  text: And Elisha said to him, “Go, say to him, ‘You will certainly recover’[a]; but Yahweh has shown me that he will certainly die.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: POB follows the Hebrew reading tradition (qere), which has לו, ‘to him,’ followed by the positive recovery message. The written form (ketiv) has לא, ‘not,’ making that message negative. These readings affect how Hazael's report in verse 14 relates to Elisha's instruction; their historical priority remains uncertain.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  chosen: And Elisha said to him
  alternatives:
  - And he said to him
  lexicon: HALOT
  rationale: 'The subject is explicitly named by the following proper noun אֱלִישָׁע, so English idiom naturally brings the name into the clause: ''And Elisha said to him.'''
- source_word: לֵךְ אֱמָר
  chosen: Go, say to him
  alternatives:
  - Go, tell him
  - Go and say
  lexicon: HALOT
  rationale: Two imperatives in sequence are preserved. 'Say to him' is slightly more formal than 'tell him' and stays closer to אמר while remaining natural English.
- source_word: לא חָיֹה תִחְיֶה
  chosen: You will certainly recover
  alternatives:
  - You shall surely live
  - You will surely survive
  rationale: The vendored WLC/OSHB explicitly marks ketiv לא (‘not’) and qere לו (‘to him’). POB's positive recovery message follows the qere, not merely a conjectural correction of an uninterpretable line. The ketiv makes the recovery statement negative and agrees with the following death announcement; verse 14's positive report then raises a different question about Hazael's faithfulness. Neither narrative smoothness nor a preference about prophetic truthfulness settles historical priority. The illness context supports recovery or survival language, and the infinitive absolute plus imperfect provides emphasis. No fresh HALOT consultation is claimed.
- source_word: וְהִרְאַנִי יְהוָה
  chosen: but the LORD has shown me
  alternatives:
  - and the LORD has shown me
  lexicon: HALOT
  rationale: The conjunction is rendered 'but' to express the adversative sense required by the contrast between the reported message and the prophetic revelation. יְהוָה is rendered 'the LORD' per doctrine guidelines.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Follows the project's mandated default rendering for the divine name.
- source_word: כִּי מוֹת יָמוּת
  chosen: that he will certainly die
  alternatives:
  - that he shall surely die
  - for he will surely die
  lexicon: HALOT
  rationale: The infinitive absolute + imperfect of מות expresses emphatic certainty. 'Will certainly die' is clear modern English and preserves the force of the Hebrew.
