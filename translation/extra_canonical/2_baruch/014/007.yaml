revisions:
- timestamp: '2026-04-28T09:36:33Z'
  adjudicator: claude-opus-4-7
  reviewer_model: gemini-3.1-pro-preview
  source_review: state/reviews/gemini/vertex_full_book_qc_2026_04/extra_canonical/2_baruch/014/007.job-77156.json
  category: mistranslation
  from: that knows what is not known to you? Or who can search out your way?
  to: who knows your judgment? Or who can search out the depth of your way?
  rationale: The draft contains a severe mistranslation. The Syriac reads 'd-yada`
    dinak' (who knows/comprehends your judgment), which was misread or hallucinated
    as 'what is not known to you'. Additionally, the draft omits '`umiqa' (the depth/profoundness)
    in the second clause ('d-baṣe `umiqa d-urḥak' - who searches out the depth of
    your way).
- timestamp: '2026-05-03T05:08:42Z'
  adjudicator: azure-gpt-5-revision-pass
  reviewer_model: gpt-5
  category: revision_pass
  from: Or who is there, O Lord, who knows your judgment? Or who can search out the
    depth of your way?
  to: Or who, O Lord, knows your judgment? Or who can search out the depth of your
    way?
  rationale: Streamlined the opening clause from “who is there, O Lord, who knows”
    to “who, O Lord, knows” for more natural English while preserving the Syriac sense;
    retained “judgment” and “the depth of your way” for lexical accuracy.
- timestamp: '2026-09-13T05:25:02Z'
  adjudicator: claude-opus-5-footnote-marker-cleanup
  reviewer_model: claude-opus-5
  category: footnote_marker_cleanup
  tier: 1
  from: Or who, O Lord, knows your judgment? Or who can search out the depth of your
    way?
  to: Or who, O Lord, knows your judgment? Or who can search out the depth of your
    way[a]?
  rationale: Footnote marker(s) declared but absent from the rendering, so the note
    never reached the reader. [a] the note comments on the verse as a whole rather
    than a single phrase, so it is anchored at the end of the verse. Rendering and
    footnote text unchanged.
