id: PSA.92.10
reference: Psalms 92:10
source:
  edition: WLC
  text: וַ/תָּ֣רֶם כִּ/רְאֵ֣ים קַרְנִ֑/י בַּ֝לֹּתִ֗י בְּ/שֶׁ֣מֶן רַעֲנָֽן׃
translation:
  text: But you have raised my horn[a] like that of a wild ox; I am refreshed with fresh oil[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: A raised horn is an image of strength and honor.
    reason: cultural_note
  - marker: b
    text: The unusual Hebrew verb may mean “moistened” or “mixed” with oil; traditionally, “anointed with fresh oil.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּרֶם
  chosen: you have raised
  alternatives:
  - you raised up
  - you lifted high
  lexicon: HALOT
  rationale: The verb means to raise or lift high; “raised” naturally retains the horn image.
- source_word: כִּרְאֵים
  chosen: like that of a wild ox
  alternatives:
  - like a wild ox
  - like a re'em
  lexicon: HALOT
  rationale: רְאֵם refers to a powerful wild bovine, traditionally 'wild ox' rather than the misleading older 'unicorn.' Because the comparison modifies 'my horn,' English idiom is clarified with 'like that of a wild ox.'
- source_word: קַרְנִי
  chosen: my horn
  lexicon: HALOT
  rationale: קֶרֶן literally means 'horn' and commonly symbolizes strength, dignity, or power. The metaphor should be preserved rather than interpreted away.
- source_word: בַּלֹּתִי
  chosen: I am moistened
  alternatives:
  - I am mixed
  - I am moistened
  - I am drenched
  lexicon: HALOT
  rationale: This preserves the likely oil-related image without the unsupported specificity of ceremonial anointing or the added force of “drenched.”
- source_word: בְּשֶׁמֶן
  chosen: with oil
  lexicon: HALOT
  rationale: Straightforward instrumental use of שֶׁמֶן, 'oil.' 'With oil' is the natural English rendering.
- source_word: רַעֲנָן
  chosen: fresh
  alternatives:
  - green
  - luxuriant
  - rich
  lexicon: HALOT
  rationale: רַעֲנָן often denotes freshness, luxuriance, or verdancy. With 'oil,' 'fresh' is the most natural English collocation and preserves the image of vitality and abundance.
