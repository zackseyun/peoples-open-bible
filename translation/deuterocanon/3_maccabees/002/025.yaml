  text: Διακομισθεὶς δὲ εἰς τὴν Αἴγυπτον, καὶ τὰ τῆς κακίας ἐπαύξων, διὰ τε τῶν προαποδεδειγμένων συνποτῶν καὶ ἑταίρων τοῦ παντὸς δικαίου κεχωρισμένων,
  language: Greek
