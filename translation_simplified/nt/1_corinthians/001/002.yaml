translation:
  language: en
  text: To God’s church in Corinth—to those who have been made holy in Christ Jesus and called to be holy people—together with everyone who calls on our Lord Jesus Christ in every place—theirs and ours.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “called saints” or “called holy ones”; traditionally, “called to be saints.”
    reason: lexical_alternative
  - marker: b
    text: This may mean every place where believers call on the Lord, or every place belonging both to them and to us.
    reason: alternative_reading
