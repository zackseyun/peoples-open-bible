  from: It therefore seemed good to us to write to the kings and the countries[a], that they should not seek harm against them, and should not make war against them and their cities and their countries[b], and that they should not join in alliance with those who are making war against them.
  to: We therefore decided to write to the kings and countries, directing them not to seek to harm the Jews, wage war against them or their cities or territories, or ally themselves with those waging war against them.
  rationale: I preserve the earlier understanding of the letter as diplomatic protection against both direct attacks and allied support for attackers. The notes about synonymous geographical terms and the stray printed 'A' do not represent meaningful alternatives or significant manuscript differences.
