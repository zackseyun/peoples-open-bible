translation:
  language: en
  text: You know that later, when he wanted to inherit the blessing, he was rejected because he found no opportunity for a change of mind[c].[a] Even though he sought it[b] with tears, the outcome did not change.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean that he could not reverse what had happened, or that Isaac would not change his mind.
    reason: alternative_reading
  - marker: b
    text: “It” may refer either to the blessing or to repentance and the opportunity for it.
    reason: lexical_alternative
  - marker: c
    text: Retain a change of mind and explanatory alternatives. The disputed referent and irreversibility of Esaus blessing must not be settled by a universal Godward formula.
    reason: lexical_alternative
