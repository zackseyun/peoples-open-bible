id: PSA.72.17
reference: Psalms 72:17
source:
  edition: WLC
  text: יְהִ֤י שְׁמ֨/וֹ לְֽ/עוֹלָ֗ם לִ/פְנֵי שֶׁמֶשׁ֮ ינין שְׁ֫מ֥/וֹ וְ/יִתְבָּ֥רְכוּ ב֑/וֹ כָּל גּוֹיִ֥ם יְאַשְּׁרֽוּ/הוּ־־׃
translation:
  text: May his name endure forever; may his name continue as long as the sun[a]. May all nations be blessed in him[b]; may they call him blessed.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “before the sun.” The rare verb rendered “continue” may also suggest flourishing or propagation.
    reason: lexical_alternative
  - marker: b
    text: Or “may all nations bless themselves by him,” invoking his name as an example of blessing; compare Genesis 22:18.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  chosen: May ... endure
  alternatives:
  - let ... be
  - may ... be
  lexicon: HALOT
  rationale: Jussive of היה expresses a wish/prayer. In context with שְׁמוֹ לְעוֹלָם, English 'May his name endure' conveys the optative force more idiomatically than a bare 'may his name be.'
- source_word: שְׁמוֹ
  chosen: his name
  lexicon: HALOT
  rationale: Standard rendering of שֵׁם with 3ms suffix. In royal/psalmic context it denotes reputation, renown, and enduring identity, but 'name' best preserves the Hebrew expression.
- source_word: לְעוֹלָם
  chosen: forever
  alternatives:
  - for ever
  - for eternity
  - throughout the age
  lexicon: HALOT
  rationale: Common temporal idiom meaning perpetual duration. 'Forever' is natural modern English and preserves the sense of enduring continuance.
- source_word: לִפְנֵי שֶׁמֶשׁ
  chosen: as long as the sun
  alternatives:
  - as long as the sun endures
  - in the presence of the sun
  lexicon: HALOT
  rationale: The phrase functions temporally in this context; the note retains its more literal wording and image.
- source_word: ינין
  chosen: continue
  alternatives:
  - increase
  - flourish
  - be propagated
  - produce offspring
  lexicon: HALOT
  rationale: With “his name,” “continue” is natural and preserves the likely sense without deciding among the rare verb’s possible nuances of continuance, flourishing, increase, or propagation.
- source_word: וְיִתְבָּרְכוּ בוֹ
  chosen: May all nations be blessed in him
  alternatives:
  - may all nations bless themselves by him
  - may all nations find blessing in him
  lexicon: HALOT
  rationale: Hitpael of ברך with בּוֹ echoes patriarchal blessing formulas and can be understood either reflexively ('bless themselves by him') or as passive/middle ('be blessed in him'). 'Be blessed in him' is clear, idiomatic, and preserves the Abrahamic resonance without forcing a narrower reflexive reading.
- source_word: כָּל גּוֹיִם
  chosen: all nations
  alternatives:
  - all peoples
  - all Gentiles
  lexicon: HALOT
  rationale: גוֹיִם in this royal-universal context refers to the nations/peoples of the world. 'All nations' is the most standard and contextually fitting rendering.
- source_word: יְאַשְּׁרוּהוּ
  chosen: may they call him blessed
  alternatives:
  - may they pronounce him happy
  - may they count him blessed
  lexicon: HALOT
  rationale: Piel of אשר means to declare someone blessed/happy. 'Call him blessed' is idiomatic English and matches biblical diction elsewhere without sounding archaic.
