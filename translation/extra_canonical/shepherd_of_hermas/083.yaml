  text: Καὶ ἰδοὺ μετὰ μικρὸν βλέπω παράταξιν πολλῶν ἀνδρῶν ἐρχομένων· καὶ εἰς τὸ μέσον
    ἀνήρ τις ὑψηλὸς τῷ μεγέθει, ὥστε τὸν πύργον ὑπερέχειν. 2. καὶ οἱ ἓξ ἄνδρες οἱ
    εἰς τὴν οἰκοδομὴν | ἐπιτάξαντες, ἐκ δεξιῶν καὶ ἀριστερῶν μετ᾿ αὐτοῦ περιεπάτουν.
    καὶ πάντες οἱ εἰς τὴν οἰκοδομὴν | ἐργασάμενοι μετ᾿ αὐτοῦ ἦσαν, καὶ ἕτεροι πολλοὶ
    κύκλῳ αὐτοῦ ἔνδοξοι. αἱ δὲ παρθένοι αἱ τηροῦσαι τὸν πύργον προσδραμοῦσαι κατεφίλησαν
    αὐτόν, καὶ ἤρξαντο ἐγγὺς αὐτοῦ περιπατεῖν κύκλῳ τοῦ πύργου. 3. κατενόει δὲ ὁ ἀνὴρ
    ἐκεῖνος τὴν οἰκοδομὴν ἀκριβῶς, ὥστε αὐτὸν καθ᾿ ἕνα λίθον ψηλαφᾶν. κρατῶν δέ τινα
    ῥάβδον τῇ χειρὶ κατὰ ἕνα λίθον τῶν ᾠκοδομημένων τρὶς ἔτυπτε. 4. καὶ ὅταν ἐπάτασσεν,
    ἐγένοντο αὐτῶν τινὲς μέλανες ὡσεὶ ἀσβόλη, τινὲς δὲ ἐψωριακότες, τινὲς δὲ σχισμὰς
    ἔχοντες, τινὲς δὲ κολοβοί, τινὲς δὲ οὔτε λευκοὶ οὔτε μέλανες, τινὲς δὲ τραχεῖς
    καὶ μὴ συμφωνοῦντες τοῖς ἑτέροις λίθοις, τινὲς δὲ σπίλους πολλοὺς ἔχοντες· αὗται
    ἦσαν αἱ ποικιλίαι τῶν λίθων τῶν σαπρῶν εὑρεθέντων εἰς τὴν οἰκοδομήν. 5. ἐκέλευσε
    οὖν πάντας τούτους ἐκ τοῦ πύργου μετενεχθῆναι καὶ τεθῆναι παρὰ τὸν πύργον, καὶ
    ἑτέρους ἐνεχθῆναι λίθους καὶ ἐμβληθῆναι εἰς τὸν τόπον αὐτῶν. 6. | καὶ ἐπηρώτησαν
    αὐτὸν οἱ οἰκοδομοῦντες, ἐκ τίνος ὄρους θέλῃ ἐνεχθῆναι λίθους καὶ ἐμβληθῆναι εἰς
    τὸν τόπον αὐτῶν. | καὶ ἐκ μὲν τῶν ὀρέων οὐκ ἐκέλευσεν ἐνεχθῆναι, | ἐκ δέ τινος
    πεδίου ἐγγὺς ὄντος ἐκέλευσεν ἐνεχθῆναι. | 7. καὶ ὠρύγη τὸ πεδίον, καὶ εὑρέθησαν
    λίθοι λαμπροὶ τετράγωνοι, τινὲς δὲ καὶ στρογγύλοι. ὅσοι δέ ποτε ἦσαν λίθοι ἐν
    τῷ πεδίῳ ἐκείνῳ, πάντες ἠνέχθησαν, καὶ διὰ τῆς πύλης ἐβαστάζοντο ὑπὸ τῶν παρθένων.
    8. καὶ ἐλατομήθησαν οἱ τετράγωνοι λίθοι καὶ ἐτέθησαν εἰς τὸν τόπον τῶν ἠρμένων·
    οἱ δὲ στρογγύλοι οὐκ ἐτέθησαν εἰς τὴν οἰκοδομήν, ὅτι σκληροὶ ἦσαν εἰς τὸ λατομηθῆναι
    αὐτούς, καὶ βραδέως ἐγένετο. ἐτέθησαν δὲ παρὰ τὸν πύργον, ὡς μελλόντων αὐτῶν λατομεῖσθαι
    καὶ τίθεσθαι εἰς τὴν οἰκοδομήν· λίαν γὰρ λαμπροὶ ἦσαν.
