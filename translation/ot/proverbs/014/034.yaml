id: PRO.14.34
reference: Proverbs 14:34
source:
  edition: WLC
  text: צְדָקָ֥ה תְרֽוֹמֵֽם גּ֑וֹי וְ/חֶ֖סֶד לְאֻמִּ֣ים חַטָּֽאת־׃
translation:
  text: Righteousness exalts a nation, but sin is a disgrace to peoples.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Hebrew word rendered “disgrace” usually means “steadfast love” or “kindness,” but here it has traditionally been understood in the rare sense “disgrace” or “reproach.” The Hebrew clause places “sin” last: literally, “but a disgrace to peoples is sin.” A published Qumran transcription reads a different word related to “lack,” but the decisive letter is disputed. Greek and Syriac readings have also been interpreted this way. POB provisionally retains the Masoretic wording.'
    reason: textual_variant
lexical_decisions:
- source_word: צְדָקָה
  chosen: Righteousness
  alternatives:
  - justice
  - right conduct
  lexicon: HALOT
  rationale: The noun denotes what is right or just in moral/social terms. 'Righteousness' best preserves the broad ethical sense in wisdom literature and aligns with the project's default rendering for cognate theological vocabulary, while 'justice' is a viable contextual alternative preserved here.
- source_word: תְרוֹמֵם
  chosen: exalts
  alternatives:
  - lifts up
  - raises high
  lexicon: HALOT
  rationale: From רום, 'to raise/highly elevate.' 'Exalts' is idiomatic and fitting for a proverb about the public standing of a nation, preserving both literal elevation imagery and figurative honor.
- source_word: גּוֹי
  chosen: nation
  alternatives:
  - people
  - gentile nation
  lexicon: HALOT
  rationale: Here the term refers generically to a political/ethnic collective, not specifically to non-Israelite nations in contrast with Israel. 'Nation' is the most natural English equivalent in this proverb.
- source_word: חֶסֶד
  chosen: a disgrace
  alternatives:
  - disgrace
  - shameful thing
  - loyalty/kindness (if repointed or interpreted differently)
  lexicon: HALOT
  rationale: In this difficult antithetical colon, the rare negative sense “reproach/disgrace” provides the predicate.
- source_word: לְאֻמִּים
  chosen: peoples
  alternatives:
  - nations
  lexicon: HALOT
  rationale: Plural of a people-group term. 'Peoples' preserves the plural and avoids flattening the poetic parallel with singular 'nation' in the first colon.
- source_word: חַטָּאת
  chosen: sin
  alternatives:
  - sin
  - an offense
  lexicon: HALOT
  rationale: This is the postposed subject of the colon and is the source of “sin,” not of “disgrace.”
