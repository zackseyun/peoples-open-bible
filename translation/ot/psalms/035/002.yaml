id: PSA.35.2
reference: Psalms 35:2
source:
  edition: WLC
  text: הַחֲזֵ֣ק מָגֵ֣ן וְ/צִנָּ֑ה וְ֝/ק֗וּמָ/ה בְּ/עֶזְרָתִֽ/י׃
translation:
  text: Take up the small shield and the large shield, and rise up to help me.
  philosophy: dynamic
lexical_decisions:
- source_word: הַחֲזֵק
  chosen: Take hold of
  alternatives:
  - Grasp
  - Seize
  lexicon: HALOT
  rationale: Imperative of חזק here calls on God to take up or grasp weapons in readiness. 'Take hold of' is idiomatic and preserves the concrete martial image better than a more abstract 'be strong.'
- source_word: מָגֵן
  chosen: shield
  alternatives:
  - small shield
  lexicon: HALOT
  rationale: מָגֵן is the common term for a shield. Rendering it simply as 'shield' is natural English and preserves the military metaphor.
- source_word: צִנָּה
  chosen: large shield
  alternatives:
  - large shield
  lexicon: HALOT
  rationale: This denotes the larger shield and should not be rendered “buckler,” which normally identifies a small shield.
- source_word: וְקוּמָה
  chosen: and rise up
  alternatives:
  - and stand up
  - and arise
  lexicon: HALOT
  rationale: Imperative of קום with paragogic he expresses urgent appeal for intervention. 'Rise up' is idiomatic in prayer language and fits the martial context of divine action.
- source_word: בְּעֶזְרָתִי
  chosen: to help me
  alternatives:
  - to help me
  - as my help
  lexicon: HALOT
  rationale: This is the natural English expression for rising to the psalmist's aid.
