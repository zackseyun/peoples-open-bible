    49. 주님께서 라헬을 기억하시고 라헬의 태를 여셨습니다. 라헬이 잉태하여 아들을 낳고 그의 이름을 불렀습니다.

    50. 요셉, 넷째 달 초하루, 여섯째 해, 이 넷째 주간에… 그리고 그가 태어난 날들에는…

    51. 요셉—야곱이 라반에게 말했습니다. “내 아내들과 내 자녀들을 내게 주십시오. 그러면 나는 내 아버지 이삭에게로 가겠습니다. 그리고 내가 만들겠습니다.”

    52. 저를 위한 집을 마련해 주십시오. 제가 당신의 두 딸을 얻기 위해 당신에게 일한 햇수를 다 채웠으니, 이제 가겠습니다.

    53. “아버지의 집으로 가겠습니다.” 라반이 야곱에게 말했습니다. “품삯을 받고 나와 함께 머무르며, 다시 나를 위하여 내 양 떼를 치시오.”

