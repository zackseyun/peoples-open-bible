id: JOB.7.5
reference: Job 7:5
source:
  edition: WLC
  text: לָ֘בַ֤שׁ בְּשָׂרִ֣/י רִ֭מָּה ו/גיש עָפָ֑ר עוֹרִ֥/י רָ֝גַ֗ע וַ/יִּמָּאֵֽס׃
translation:
  text: My flesh is clothed with worms and caked dust; my skin hardens, then breaks open again[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The final Hebrew verbs are difficult; they may describe the skin becoming hard or closing up, then becoming foul.
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  chosen: is clothed with
  alternatives:
  - has put on
  - is covered with
  lexicon: HALOT
  rationale: The verb literally means 'to clothe/put on.' With 'my flesh' as subject and 'worms and clods of dust' as what covers it, English idiom is best preserved by the passive-like expression 'is clothed with,' which retains the vivid metaphor without awkwardness.
- source_word: בְּשָׂרִי
  chosen: my flesh
  alternatives:
  - my body
  lexicon: HALOT
  rationale: '''Flesh'' is the direct lexical equivalent and preserves the physical, bodily emphasis of Job''s affliction better than the more generalized ''body.'''
- source_word: רִמָּה
  chosen: worms
  alternatives:
  - maggots
  lexicon: HALOT
  rationale: The noun denotes worms/grubs associated with decay. 'Worms' is the broader and more traditional rendering; 'maggots' is possible but narrower and more interpretive.
- source_word: גיש עפר
  chosen: clods of dust
  alternatives:
  - crusts of dirt
  - lumps of dust
  lexicon: HALOT
  rationale: The second noun is 'dust.' The first, a rare form, is commonly understood as a mass/clod/crust. 'Clods of dust' gives a natural English rendering that conveys caked earth or scabs like dirt on the skin while staying close to the Hebrew imagery.
- source_word: עוֹרִי
  chosen: my skin
  alternatives:
  - my hide
  lexicon: HALOT
  rationale: The ordinary sense is 'skin.' 'Hide' would be too animal-like in English for this context.
- source_word: רָגַע
  chosen: hardens
  alternatives:
  - heals over
  - closes up
  - settles
  lexicon: HALOT
  rationale: In this bodily context, the difficult verb is plausibly understood of the skin becoming still, firm, or crusted over; “hardens” is concise but remains contextually inferred.
- source_word: וַיִּמָּאֵס
  chosen: breaks open again
  alternatives:
  - festers again
  - is loathsome
  - dissolves
  lexicon: HALOT
  rationale: This is a contextual rendering of a difficult form. It avoids the false medical precision of “festers,” while the note preserves alternatives such as becoming foul.
