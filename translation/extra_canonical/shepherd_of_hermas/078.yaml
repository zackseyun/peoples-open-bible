  text: Μετὰ τὸ γράψαι με τὰς ἐντολὰς καὶ παραβολὰς τοῦ ποιμένος, τοῦ ἀγγέλου τῆς μετανοίας, ἦλθε πρὸς
    με καὶ λέγει μοι· Θέλω σοι δεῖξαι ὅσα σοι ἔδειξε τὸ πνεῦμα τὸ ἅγιον τὸ λαλῆσαν μετὰ σοῦ ἐν μορφῇ τῆς
    Ἐκκλησίας· ἐκεῖνο γὰρ τὸ πνεῦμα ὁ υἱὸς τοῦ Θεοῦ ἐστίν. 2. ἐπειδὴ γὰρ ἀσθενέστερος τῇ σαρκὶ ἦς, οὐκ
    ἐδηλώθη σοι δι᾿ ἀγγέλου. ὅτε οὖν ἐνεδυναμώθης διὰ τοῦ πνεύματος καὶ ἴσχυσας τῇ ἰσχύϊ σου, ὥστε δύνασθαί
    σε καὶ ἄγγελον ἰδεῖν, τότε μέν οὖν ἐφανερώθη σοι διὰ τῆς Ἐκκλησίας ἡ οἰκοδομὴ τοῦ πύργου· καλῶς καὶ
    σεμνῶς πάντα ὡς ὑπὸ παρθένου ἑώρακας. νῦν δὲ ὑπὸ ἀγγέλου βλέπεις, διὰ τοῦ αὐτοῦ μὲν πνεύματος· 3.
    δεῖ δέ σε παρ᾿ ἐμοῦ ἀκριβέστερον πάντα μαθεῖν. εἰς τοῦτο γὰρ καὶ ἐδόθην ὑπὸ τοῦ ἐνδόξου ἀγγέλου εἰς
    τὸν οἶκόν σου κατοικῆσαι, ἵνα δυνατῶς πάντα ἴδῃς, μηδὲν δειλαινόμενος ὡς καὶ τὸ πρότερον. 4. καὶ ἀπήγαγέ
    με εἰς τὴν Ἀρκαδίαν εἰς ὄρος τι μαστῶδες, καὶ ἐκάθισε με ἐπὶ τὸ ἄκρον τοῦ ὄρους, καὶ ἔδειξέ μοι πεδίον
    μέγα, κύκλῳ δὲ τοῦ πεδίου ὄρη δώδεκα, ἄλλην καὶ ἄλλην ἰδέαν ἔχοντα τὰ ὄρη. 5. τὸ πρῶτον ἦν μέλαν ὡς
    ἀσβόλη· τὸ δὲ δεύτερον ψιλόν, βοτάνας μὴ ἔχον· τὸ δὲ τρίτον ἀκανθῶδες καὶ τριβόλων πλῆρες· 6. τὸ δὲ
    τέταρτον βοτάνας ἔχον ἡμιξήρους, τὰ μὲν ἐπάνω τῶν βοτανῶν χλωρά, τὰ δὲ πρὸς τὰς ῥίζας ξηρά· τινὲς
    δὲ βοτάναι, ὅταν ὁ ἥλιος ἐπικεκαύκει, ξηραὶ ἐγίνοντο· 7. τὸ δὲ πέμπτον ὄρος ἔχον βοτάνας χλωράς, καὶ
    τραχὺ ὄν. τὸ δὲ ἕκτον ὄρος σχισμῶν ὅλον ἔγεμεν, ὧν μὲν μικρῶν, ὧν δὲ μεγάλων· εἶχον δὲ βοτάνας αἱ
    σχισμαί, οὐ λίαν δὲ ἦσαν εὐθαλεῖς αἱ βοτάναι, μᾶλλον δὲ ὡς μεμαραμέναι ἦσαν. 8. τὸ δὲ ἕβδομον ὄρος
    εἶχε βοτάνας ἱλαράς, καὶ ὅλον τὸ ὄρος εὐθηνοῦν ἦν, καὶ πᾶν γένος κτηνῶν καὶ ὀρνέων ἐνέμοντο εἰς τὸ
    ὄρος ἐκεῖνο· καὶ ὅσον ἐβόσκοντο τὰ κτήνη καὶ τὰ πετεινά, μᾶλλον καὶ μᾶλλον αἱ βοτάναι τοῦ ὄρους ἐκείνου
    ἔθαλλον. τὸ δὲ ὄγδοον ὄρος πηγῶν πλῆρες ἦν, καὶ πᾶν γένος τῆς κτίσεως τοῦ Κυρίου ἐποτίζοντο ἐκ τῶν
    πηγῶν τοῦ ὄρους ἐκείνου. 9. τὸ δὲ ἔννατον ὄρος ὅλως ὕδωρ οὐκ εἶχε, καὶ ὅλον ἐρημῶδες ἦν· εἶχε δὲ ἐν
    αὐτῷ θηρία καὶ ἑρπετὰ θανάσιμα, διαφθείροντα ἀνθρώπους. τὸ δὲ δέκατον ὄρος εἶχε δένδρα μέγιστα, καὶ
    ὅλον κατάσκιον ἦν, καὶ ὑπὸ τὴν σκέπην πρόβατα κατέκειντο ἀναπαυόμενα καὶ μαρυκώμενα. 10. τὸ δὲ ἑνδέκατον
    ὄρος λίαν σύνδενδρον ἦν, καὶ τὰ δένδρα ἐκεῖνα κατάκαρπα ἦν, ἄλλοις καὶ ἄλλοις καρποῖς κεκοσμημένα,
    ἵνα ἰδών τις αὐτὰ ἐπιθυμήσῃ φαγεῖν ἐκ τῶν καρπῶν αὐτῶν. τὸ δὲ δωδέκατον ὄρος ὅλον ἦν λευκόν, καὶ ἡ
    πρόσοψις αὐτοῦ ἱλαρὰ ἦν· καὶ εὐπρεπέστατον ἦν ἑαυτῷ τὸ ὄρος.
