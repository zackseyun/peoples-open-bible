id: PRO.16.10
reference: Proverbs 16:10
source:
  edition: WLC
  text: קֶ֤סֶם עַֽל שִׂפְתֵי מֶ֑לֶךְ בְּ֝/מִשְׁפָּ֗ט לֹ֣א יִמְעַל פִּֽי/ו׀־־־׃
translation:
  text: An oracle[a] is on a king’s lips; he does not betray justice when giving judgment[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew term usually means “divination”; here it describes the king’s authoritative pronouncement.
    reason: alternative_reading
  - marker: b
    text: Alternatively, “he must not betray justice when giving judgment.”
    reason: alternative_reading
lexical_decisions:
- source_word: קֶסֶם
  chosen: an oracle
  alternatives:
  - divination
  - oracle
  lexicon: HALOT
  rationale: This conveys the noun’s oracular force without adding an explicitly divine source or requiring its commonly illicit sense.
- source_word: עַל
  chosen: is on
  alternatives:
  - upon
  - 'on'
  lexicon: HALOT
  rationale: 'Rendered idiomatically with the verbless clause in English: ''is on the lips of.'' This preserves the locative image without awkwardness.'
- source_word: שִׂפְתֵי מֶלֶךְ
  chosen: the lips of a king
  alternatives:
  - a king's lips
  lexicon: HALOT
  rationale: A straightforward construct phrase. 'A king' rather than 'the king' keeps the proverb's generalizing force.
- source_word: בְּמִשְׁפָּט
  chosen: in judgment
  alternatives:
  - in judgment
  - when judging
  lexicon: HALOT
  rationale: The phrase identifies the judicial sphere or occasion rather than merely the abstract quality of justice.
- source_word: לֹא יִמְעַל
  chosen: does not act treacherously
  alternatives:
  - does not transgress
  - does not act treacherously
  - does not offend
  lexicon: HALOT
  rationale: This renders the negative imperfect directly and preserves מעל’s sense of faithless or treacherous conduct without forcing an explicitly prescriptive modal.
- source_word: פִּיו
  chosen: his mouth
  alternatives:
  - his lips
  - his speech
  lexicon: HALOT
  rationale: Retained distinctly from the first colon's 'lips' to mirror the Hebrew variation and to keep the focus on utterance.
