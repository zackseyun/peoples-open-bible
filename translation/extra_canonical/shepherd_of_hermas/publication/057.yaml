    ἡμέραν βασανισθῇ, ὅλον ἐνιαυτὸν ἰσχύει ἡ ἡμέρα τῆς βασάνου. ὅσας οὖν ἡμέρας τρυφήσῃ τις, τοσούτους
    ἐνιαυτοὺς βασανίζεται. βλέπεις οὖν, φησίν, ὅτι τῆς τρυφῆς καὶ ἀπάτης ὁ χρόνος ἐλάχιστός ἐστι, τῆς
    δὲ τιμωρίας καὶ βασάνου πολύς.
