- from: 이제 우리는 궁궐의 소금을 먹는 사람들이며, 왕의 수치를 보는 것은 우리에게 합당하지 않으므로, 우리는 왕에게 사람을 보내어 알렸습니다.[a][b]
  to: 우리는 궁궐의 소금을 먹고 있으며,[a] 왕의 수치를 보는 것이 우리에게 마땅하지 않으므로, 이에 왕께 보내어 알렸습니다.[b]
  rationale: 원문과 영어 POB의 인과 구조를 유지하되, 원문에 없는 ‘이제’와 ‘사람’을 제거했습니다. ‘보내고 알리다’의 두 동사는 목적어를 특정하지 않은 채 그대로 보존했으며, 기존 각주는 해당 관용구와 ‘수치’ 표현에 계속 연결되도록 유지·정리했습니다.
