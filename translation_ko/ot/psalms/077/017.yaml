base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/017.yaml
  text: The clouds poured out water; the skies gave voice; even your arrows[a] moved about.
  footnotes:
  - marker: a
    text: Or 'were in anguish,' 'twisted,' or 'trembled' for 'writhed.' The Hebrew verb can denote convulsive shaking or labor-like writhing.
    reason: lexical_alternative
  - marker: b
    text: Or 'the deeps.' The Hebrew refers to the deep waters or ocean depths.
    reason: lexical_alternative
translation:
  language: ko
  text: 짙은 구름들이 물을 쏟아 내고, 창공이 소리를 내었으며, 참으로 주님의 화살들이 이리저리 움직였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 번개들이 이리저리 움직였습니다.’ 히브리어는 ‘주님의 화살들’이라고 하며, 이 폭풍 현현의 문맥에서는 번개를 가리키는 무예적 이미지일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ / רָאוּךָ
  english_pob_choice: saw you
  chosen_korean: 주님을 보았고
  alternatives_korean:
