  from: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
  to: But when the tenant farmers saw him, they reasoned together, saying, ‘This is the heir. Let us kill him so that the inheritance will be ours.’
