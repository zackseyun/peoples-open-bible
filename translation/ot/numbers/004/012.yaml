  meaning_decisions:
  - source_phrase: כָּל כְּלֵי הַשָּׁרֵת אֲשֶׁר יְשָׁרְתוּ בָם בַּקֹּדֶשׁ
    prior_rendering: all the utensils of service with which they minister in the sanctuary
    new_rendering: all the utensils used for service in the sanctuary
    rationale: The noun and relative clause jointly identify the utensils by their sacred function; natural English can express this without repeating the service idea.
  - source_phrase: וְנָתְנוּ אֶל בֶּגֶד תְּכֵלֶת
    prior_rendering: and put them in a blue cloth
    new_rendering: wrap them in a blue cloth
    rationale: The packing context makes enclosing the utensils in the cloth the intended action.
  - source_phrase: בְּמִכְסֵה עוֹר תָּחַשׁ
    prior_rendering: with a covering of fine leather
    new_rendering: with a leather covering
    rationale: The neutral material description avoids adding an unestablished quality and retains the uncertainty in a note.
  - source_phrase: עַל הַמּוֹט
    prior_rendering: on the carrying frame
    new_rendering: on the carrying pole
    rationale: The same term as in verse 10 receives the same rendering; its pole or bar sense does not depend on the number of objects carried.
  footnote_kinds:
