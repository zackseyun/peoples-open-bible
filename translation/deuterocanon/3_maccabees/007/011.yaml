  text: προφερόμενοι τοὺς γαστρὸς ἕνεκεν τὰ θεῖα παραβεβηκότας προστάγματα μηδέποτε εὐνοήσειν μηδὲ τοῖς τοῦ βασιλέως προστάγμασιν.
