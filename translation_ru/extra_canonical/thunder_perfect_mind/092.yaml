base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/092.yaml
  text: 'I am the understanding of every person, my mind within.

    I am the knowledge of my name.

    I am the cry that goes out,

    and I am the one who hears.'
translation:
  language: ru
  text: 'Я — подготовка каждого человека,

    мой ум — внутри.[a]


    Я — произнесение моего имени.[b]


    Я — мой крик, звучащий вовне,


    и я — та, которая слышит.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В коптском тексте связка отсутствует. Слова «мой ум — внутри» можно понимать как отдельное фрагментарное высказывание либо как присоединённую характеристику к предшествующей строке.
    reason: syntactic_ambiguity
  - marker: b
    text: Буквально слово связано с «разделением» или «членением»; по отношению к имени оно может означать его артикуляцию, то есть произнесение.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ⲧⲥⲟⲃⲧⲉ
  choice: готовность
  rationale: Основное значение существительного связано с подготовленностью, готовностью или оснащением. «Готовность» естественнее в русской поэтической строке и не привносит неподтверждённого значения «понимание».
- source_word: ⲙⲡⲣⲱⲙⲉ ⲛⲓⲙ
  choice: каждого человека
  rationale: ⲣⲱⲙⲉ обозначает человека, а ⲛⲓⲙ при существительном имеет распределительное значение «каждый».
- source_word: ⲡⲁⲛⲟⲩⲥ
  choice: мой ум
  rationale: ⲡⲁ- — притяжательный показатель первого лица единственного числа, а ⲛⲟⲩⲥ — заимствованное греческое νοῦς, «ум» или «разум».
- source_word: ⲉϩⲟⲩⲛ
  choice: внутри
  rationale: Наречие указывает на движение или положение внутрь; краткое «внутри» сохраняет фрагментарную компактность коптской строки.
- source_word: ⲧⲡⲱϣⲥ ⲙ̄ⲡⲁⲣⲁⲛ
  choice: произнесение моего имени
  rationale: Слово связано с разделением и членением; применительно к имени оно может обозначать его артикуляцию, то есть произнесение. Перевод «знание» не подтверждается непосредственной лексикой строки.
- source_word: ⲧⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  choice: мой крик, раздающийся вовне
  rationale: ⲧⲁ- передаёт «мой», ϣⲕⲁⲕ — крик или возглас, а ⲉⲃⲟⲗ — направленность наружу. Сохранён необычный самотождественный оборот «я — мой крик».
- source_word: ⲉⲧⲥⲱⲧⲙ̄
  choice: та, которая слышит
  rationale: Относительная форма от обычного глагола «слышать». Женский род согласован с голосом говорящей и предшествующим ⲁⲛⲟⲕ ⲧⲉ.
theological_decisions:
- issue: Самоотождествление говорящей с внутренней готовностью, именем и голосом
  choice: Сохранить парадоксальные формулы без богословского пояснения
  alternative: Свести строки к абстрактному учению о познании или истолковать говорящую как конкретное божество
  rationale: Сам текст не разрешает личность говорящей и намеренно соединяет внутреннее и внешнее, голос и слышание. Конфессиональная конкретизация сузила бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаизованным ритмом. Повтор «Я —» и парадоксальное «Я — мой крик» сохранены ради формы оригинала. Синтаксическая шероховатость первой двустрочной формулы отмечена сноской, а не сглажена догматически.
