  text: 이것이 그들의 길, 곧 그들에게는 어리석음입니다. 그러나 그들 뒤에 오는 이들은 그들의 말을 좋게 여깁니다.[a][b] 셀라.
  philosophy: optimal-equivalence
  footnotes:
