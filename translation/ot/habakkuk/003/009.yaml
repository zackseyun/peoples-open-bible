  to: Your bow is laid bare; you command your arrows with an oath[a]. Selah. You split the earth with rivers.
  rationale: The earlier rendering deliberately preserved oaths, rods, and spoken command, but their relationship remained unintelligible in English. I retain those elements through a contextual martial reading rather than introduce a specific covenant promise, and make the substantial uncertainty explicit in the note.
