id: JOB.38.26
reference: Job 38:26
source:
  edition: WLC
  text: לְ֭/הַמְטִיר עַל אֶ֣רֶץ לֹא אִ֑ישׁ מִ֝דְבָּ֗ר לֹא אָדָ֥ם בּֽ/וֹ־־־׃
translation:
  text: to bring rain on uninhabited land, on a wilderness where no one lives,
  philosophy: dynamic
lexical_decisions:
- source_word: לְהַמְטִיר
  chosen: to make it rain
  alternatives:
  - to cause rain to fall
  - to rain
  lexicon: HALOT
  rationale: 'Hiphil infinitive construct of מטר expresses causation: ''to cause rain.'' English idiom favors ''make it rain'' or ''cause rain to fall.'' ''Make it rain'' is concise and natural while preserving the causative sense better than the simpler ''to rain.'''
- source_word: עַל
  chosen: 'on'
  alternatives:
  - upon
  - over
  lexicon: HALOT
  rationale: The preposition marks the surface/location receiving the rain. 'On' is the most natural modern equivalent here.
- source_word: אֶרֶץ
  chosen: a land
  alternatives:
  - the earth
  - a country
  lexicon: HALOT
  rationale: In context the term refers to a tract of land receiving rain, not the whole globe. The anarthrous Hebrew is well represented by 'a land.'
- source_word: לֹא אִישׁ
  chosen: with no one in it
  alternatives:
  - where there is no man
  - with no one
  lexicon: HALOT
  rationale: In this existential context, “no one” is natural English for the absence of inhabitants.
- source_word: מִדְבָּר
  chosen: a wilderness
  alternatives:
  - desert
  - wasteland
  lexicon: HALOT
  rationale: מִדְבָּר commonly denotes uncultivated steppe/wilderness rather than specifically sandy desert. 'Wilderness' best preserves the broader sense in Job's poetry.
- source_word: לֹא אָדָם בּוֹ
  chosen: with no human being in it
  alternatives:
  - where no man is in it
  - in which there is no person
  lexicon: HALOT
  rationale: “Human being” retains the explicit human reference, and “in it” represents the locative suffix.
