translation:
  text: In those days the angel Uriel answered me and said, “Look, Enoch, I have shown you everything and revealed
    it all to you, so that you may see this sun and this moon, those who lead the stars of heaven, and all who turn
    them—their activities, their periods, and their entrances.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The selected ending is compressed: all who turn them is followed by their activities, periods and entrances.
      This English keeps the turning verb and the plural possessives instead of silently replacing the agents with
      modern orbital forces. Entrances renders the noun of coming in, not a supplied named point of setting or rising.'
    reason: alternative_reading
