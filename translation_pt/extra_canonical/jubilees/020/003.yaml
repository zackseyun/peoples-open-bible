  source_fidelity: A tradução preserva adequadamente a enumeração de faltas, o paralelismo de «entregueis» e o objeto masculino singular em «amai-o». «Destruição pela espada» reproduz bem o uso contextual de ሙስና. A revisão proposta apenas torna inequívoca, em português, a extensão da negação ao remanescente.
  naturalness: O texto é geralmente fluente e mantém registro solene acessível. Contudo, «Eu vos dou testemunho» soa pouco idiomático em português moderno, e a construção «para que não vos torneis ... e todo o vosso remanescente» deixa elíptica demais a relação verbal do segundo membro.
  terminology: «Imoralidade sexual», «impureza», «corrupção», «contaminação do pecado», «opróbrio» e «remanescente» são escolhas adequadas, distintas e consistentes com o tom do texto. «Eu vos declaro» é uma formulação portuguesa mais natural para o valor declarativo/testemunhal de አሰምዕ, sem convertê-lo em imperativo.
