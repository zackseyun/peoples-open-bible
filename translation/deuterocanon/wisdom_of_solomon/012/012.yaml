  meaning: No one can challenge God’s judgment, accuse him over the destruction of nations he created, or confront him to avenge the unrighteous.
  meaning_decisions:
  - source_phrase: κατὰ ἐθνῶν ἀπολωλότων, ἃ σὺ ἐποίησας
    prior_rendering: concerning the nations that you destroyed
    new_rendering: over the destruction of nations you yourself created
    rationale: The relative clause identifies God as the creator of the nations that perished; it does not merely repeat their destruction. The new wording restores that distinction and the emphasis of the explicit pronoun σὺ.
  - source_phrase: εἰς κατάστασίν σοι ἐλεύσεται ἔκδικος κατὰ ἀδίκων ἀνθρώπων
    prior_rendering: will come before you as an avenger against unrighteous men
    new_rendering: will confront you to avenge the unrighteous
    rationale: The parallel questions concern challenges to God over those he has judged. The final challenger therefore acts on behalf of the unrighteous, not against them; “confront” also makes the adversarial force clearer than “come before.” A footnote preserves the serious alternative of a legal advocate rather than an avenger.
