  text: καὶ συνῆξεν δύναμιν ἰσχυρὰν σφόδρα, καὶ ἦρξεν χωρῶν καὶ ἐθνῶν καὶ τυραννιῶν, καὶ ἐγένοντο αὐτῷ εἰς φόρον.
