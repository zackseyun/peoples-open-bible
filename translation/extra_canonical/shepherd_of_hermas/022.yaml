    POB working selection follows Athos Θεγρί. See repair/vision-four-dialogue-20261104.v1.json.'
translation:
  text: 'I.1. The vision that I saw[t], brothers, came twenty days after the former vision; it was as
    a pattern[a] of the tribulation that is coming[n].


    I.2. I was going into the countryside by the Campanian road[b]. It is about ten stadia[c] from the
    public road, and the place is easy to travel[o].


    I.3. So, walking alone, I was beseeching the Lord to bring to completion the revelations and the visions
    that he had shown me through his holy Church[d], so that he would strengthen me and give repentance[m]
    to his servants who have stumbled, in order that his great and glorious name might be glorified, because
    he counted me worthy to show me his wonders.


    I.4. And while I was glorifying and giving thanks to him, something like the sound of a voice answered
    me: “Do not be double-minded[e], Hermas.” I began to reason within myself and say, “What do I have
    to be double-minded about, being so firmly established by the Lord and having seen glorious things?”


    I.5. I went on a little, brothers, and behold, I see dust rising as if to the sky, and I began to
    say within myself, “Perhaps cattle[f] are coming and stirring up dust?” For it was about a stadion
    away from me.


    I.6. As the dust grew greater and greater, I supposed it was something divine. The sun shone out a
    little, and behold, I see a very great beast, like some sea monster[g], and from its mouth fiery locusts[h]
    were coming out. The beast was about a hundred feet in length, and its head was like a jar[i].


    I.7. I began to weep[p] and to ask the Lord that he would deliver me[j] from it. And I remembered
    the word that I had heard: “Do not be double-minded, Hermas.”


    I.8. So then, brothers, having put on the faith of the Lord[k] and having remembered the mighty deeds
    that he had taught me, I took courage and gave myself over to the beast. Now the beast was coming
    with such a rushing sound that it could ravage a city[l].


    I.9. I came near it, and that huge sea monster stretched itself out on the ground and did nothing
    except thrust out its tongue[q]; it did not move at all until I had passed by it[s].


    I.10. Now the beast had four colors on its head: black, then fiery and blood-red[r], then golden,
    then white.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As a pattern translates eis typon, also as a type or as a symbol. This is the stated prefigurative
      purpose of the vision, not a new vision-title supplied by a manuscript.
    reason: lexical_alternative
  - marker: b
    text: Campanian road retains the selected Greek proper name. The name alone does not establish the
      precise Roman route or its direction; the earlier suggestion of a road from Rome toward Campania
      is not treated as verified topography. The Ethiopic edition’s Latin rendering omits this name and
      describes a deserted region; that is mediated evidence, not a fresh Geʿez reading.
    reason: lexical_alternative
  - marker: c
    text: Ten stadia is approximately 1.8 km or 1.1 miles; the later one-stadion dust distance is a separate
      measurement. Sinaiticus22.2 has a different first-hand distance form, tesseradiōs, corrected by
      ca to deka radiōs; corrected ten is not intact first-hand agreement. The Ethiopic edition’s Latin
      rendering uses ten arrow-flight distances, not an exact lexical match for stadia.
    reason: textual_variant
  - marker: d
    text: Through his holy Church retains the visionary mediation and both revelations and visions. The
      prayer also retains strengthen me, give repentance to his stumbled servants, glorification of his
      great and glorious name, and the reason that he counted the narrator worthy to see his wonders.
      Vulgata printed30 lacks the exact strengthen-me clause in the main request. Palatina printed59 instead
      has see repentance, viderem poenitentiam; its later me is editorially supplied. These are not exact
      corroboration of every selected purpose clause.
    reason: textual_variant
  - marker: e
    text: Do not be double-minded retains the Greek warning in both paragraphs4 and7 and the narrator’s
      related self-question in4. Doubt or waver are alternatives. The Ethiopic edition’s Latin rendering
      has no fear at the first warning and no despair at the second; those are disclosed rather than substituted.
      The personal name Hermas is absent from Palatina’s first warning.
    reason: lexical_alternative
  - marker: f
    text: Cattle retains ktēnē, also domestic animals, beasts or herds. The narrator only wonders whether
      animals caused the dust; he does not yet identify the approaching beast. The comparison as if to
      the sky and the separate one-stadion distance remain.
    reason: lexical_alternative
  - marker: g
    text: Sea monster retains kētos, also a large sea creature or whale. The beast is a simile, not a
      zoological identification. Its length of about one hundred feet remains distinct from the earlier
      road distances; the Vulgata uses statura and the Ethiopic edition’s mediated Latin has passus pedis,
      so these are not exact dimensional-unit agreement.
    reason: lexical_alternative
  - marker: h
    text: Fiery locusts retains both the creatures and fire imagery, coming from the beast’s mouth. Biblical
      comparisons such as Joel2 or Revelation9 are thematic parallels, not manuscript evidence or added
      narrative events.
    reason: lexical_alternative
  - marker: i
    text: Like a jar retains the prior main-text adjudication, replacing the stale note’s chosen label
      earthenware. Keramos may denote pottery, tile or a clay vessel; precise shape is uncertain. Sinaiticus
      has a first-hand keramou form corrected to keramiou. Vulgata’s urnalis suggests a chamber pot, while
      Palatina’s laguena and the Ethiopic edition’s Latin rendering have a bottle. The versions do not
      establish one identical vessel shape.
    reason: lexical_alternative
  - marker: j
    text: Deliver me retains the lytr- rescue or ransom word-group. P.Oxy.4706 fragment6 preserves only
      parts of this sequence with editorial restorations; it is not a complete intact verse. The papyrus
      edition reports a spelling difference from Sinaiticus, while the official Sinaiticus XML displays
      a different vowel from that report. The edition report and XML reading remain distinct evidence,
      not manufactured agreement.
    reason: lexical_alternative
  - marker: k
    text: The faith of the Lord retains the prior revised English and its genitive ambiguity. Faith in
      the Lord is an objective-genitive alternative; the Lord’s faith or faithfulness is another interpretation.
      The clothing image put on remains. Vulgata printed31 has faith of God, while Palatina has the Lord
      and the Ethiopic edition’s Latin rendering faith in the Lord. Those versions do not settle the selected
      genitive’s interpretation.
    reason: lexical_alternative
  - marker: l
    text: Such a rushing sound that it could ravage a city retains the degree/result adjudication of houtō
      ... hōste and the restored rushing/ravage choices, while explicitly reconsidering the earlier roar
      interpretation. Rhoizos can express rushing or whizzing noise or forceful motion; the selected wording
      does not specify an animal vocalization. Hissing is another possible sound interpretation. The earlier
      rushing roar and its rationale remain archived. Palatina has rudens, roaring, but Vulgata has in
      ictu, in a blow, and the Ethiopic edition’s Latin rendering describes furious raging. These versions
      do not settle the precise Greek sound. P.Oxy.4706 fragment7 has partial approach/noise/city wording;
      its reconstructed order and placement are conjectural, with missing lines, not complete surviving
      ink.
    reason: lexical_alternative
  - marker: m
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: n
    text: The selected singular coming tribulation remains. Athos PlateIV has a plural tribulations formulation.
      Sinaiticus22.1 omits the entire type/coming-tribulation tail, not a marked physical gap in that
      transcription. Palatina instead speaks of the prior day until the coming day. P.Oxy.4706 fragments4+5.14–15
      preserve only partial opening words, with much supplied; they do not independently certify the entire
      selected framing.
    reason: textual_variant
  - marker: o
    text: Easy to travel retains rhadiōs hodeuetai. Palatina printed59 instead describes rare travel,
      a materially different reading. Sinaiticus’s countryside phrase is absent first hand and added in
      correction; the selected countryside wording is not all-layer agreement.
    reason: textual_variant
  - marker: p
    text: Weep retains the selected Greek and Athos/Latin version wording. Sinaiticus22.7 first hand has
      klinai ta gonata, kneeling or bending the knees; ca replaces it with klaiein, weeping. P.Oxy.4706
      fragment6 is edited with the weeping construction, with damaged letters restored. The papyrus reconstruction
      and Sinaiticus correction are not both intact first-hand confirmation.
    reason: textual_variant
  - marker: q
    text: Tongue retains glōssan. Sinaiticus22.9 first hand has ton lithon, the stone; S1 replaces it
      with tēn glōssa, the tongue. Athos and the consulted Latin versions retain tongue. The corrected
      manuscript is one witness with separate hands, not independent votes. Palatina describes rolling
      on the ground rather than stretching out, another difference preserved in the comparison.
    reason: textual_variant
  - marker: r
    text: 'Four colors means four groups: black; fiery and blood-red together; golden; white. The fiery
      and blood-red terms belong to one group, not two extra colors. Palatina printed63 has fire or blood,
      ignea sive sanguinea, rather than the selected and; the other wording is not silently harmonized.'
    reason: textual_variant
  - marker: s
    text: Did nothing except thrust out its tongue and did not move at all until I had passed retain both
      restrictive statements and the full temporal boundary. Motion/reflexive corrections in Sinaiticus
      are distinguished from its first-hand stone reading. P.Oxy.4706 fragment7 reaches only part of the
      approach/beast sequence; it does not preserve this entire closing motion statement.
    reason: textual_variant
  - marker: t
    text: The Greek sentence begins which I saw, without a noun vision. The vision supplies the antecedent
      for intelligible English, consistent with the preceding Vision IV heading in the selected print.
      It is an editorial completion, not an extra noun preserved within this Greek sentence.
    reason: translation_note
lexical_decisions:
- source_word: εἰς τύπον
  chosen: as a pattern
  alternatives:
  - as a type
  - as a symbol
  lexicon: BDAG; LSJ
  rationale: τύπος in early Christian usage often denotes a foreshadowing or exemplar; “pattern” keeps
    the typological sense while remaining readable. Footnote preserves the technical term 'type'.
- source_word: τῆς θλίψεως
  chosen: the tribulation
  alternatives:
  - the affliction
  - the distress
  lexicon: BDAG
  rationale: θλῖψις commonly denotes eschatological or communal pressure; 'tribulation' retains that weight
    and apocalyptic register.
- source_word: εἰς ἀγρὸν
  chosen: into the countryside
  alternatives:
  - into a field
  lexicon: LSJ
  rationale: While ἀγρός can be a specific field, the Roman-road setting suggests the rural outskirts;
    'countryside' fits the scene.
- source_word: τῇ ὁδῷ τῇ Καμπανῇ
  chosen: the Campanian road
  alternatives:
  - the Campanian Way
  lexicon: LSJ
  rationale: Retain the proper route name without asserting unverified direction or topography.
- source_word: στάδια δέκα
  chosen: ten stadia
  alternatives:
  - about a mile and a quarter
  - ten furlongs
  lexicon: LSJ
  rationale: Retaining the ancient unit preserves texture; a footnote supplies the modern estimate.
- source_word: τῆς ὁδοῦ τῆς δημοσίας
  chosen: the public road
  alternatives:
  - the public road
  lexicon: LSJ
  rationale: Match the retained main-text road wording.
- source_word: ῥᾳδίως ὁδεύεται
  chosen: is easy to travel
  alternatives:
  - is easily traveled
  lexicon: LSJ
  rationale: Retain the selected ease of travel; Palatina’s rare travel is disclosed separately.
- source_word: ἀξιῶ
  chosen: I was beseeching
  alternatives:
  - I implore
  - I beg
  - I ask
  lexicon: BDAG; LSJ
  rationale: In prayerful context, 'beseech' captures earnest petition better than neutral 'ask'.
- source_word: ἀποκαλύψεις καὶ ὁράματα
  chosen: revelations and visions
  alternatives:
  - disclosures and visions
  - revelations and sights
  lexicon: BDAG
  rationale: Established pair; 'revelations' and 'visions' are distinct yet complementary; avoid flattening.
- source_word: τελειώσῃ
  chosen: bring to completion
  alternatives:
  - perfect
  - fulfill
  lexicon: BDAG
  rationale: Conveys the idea of completing what has been begun without the misleading connotations of
    'perfect' in modern English.
- source_word: διὰ τῆς ἁγίας Ἐκκλησίας
  chosen: through his holy Church
  alternatives:
  - by means of his holy assembly
  - through the holy congregation
  lexicon: BDAG
  rationale: Hermas personifies the Church as a visionary mediator; 'Church' with capitalization preserves
    that identity.
- source_word: ἰσχυροποιήσῃ
  chosen: strengthen me
  alternatives:
  - make me strong
  - empower me
  lexicon: LSJ
  rationale: '''Strengthen'' is the conventional and clear rendering in prayer contexts.'
- source_word: μετάνοιαν
  chosen: repentance
  alternatives:
  - reorientation
  - repentance
  - change of mind
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial
    assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: δοῦλοι
  chosen: servants
  alternatives:
  - slaves
  - bondservants
  lexicon: BDAG
  rationale: Use consistent reader-facing servants under current project policy. Slaves or bondservants
    preserve possible bonded-status, belonging and allegiance nuances; the prayer context does not exclude
    them.
- source_word: οἱ ἐσκανδαλισμένοι
  chosen: those who have stumbled
  alternatives:
  - those who have been scandalized
  - those who have been caused to fall
  lexicon: BDAG
  rationale: σκανδαλίζω in moral context denotes stumbling/falling; 'stumbled' is vivid and idiomatic.
- source_word: ὡς ἦχος φωνῆς
  chosen: a sound like a voice
  alternatives:
  - as the sound of a voice
  - something like the noise of a voice
  lexicon: LSJ
  rationale: Preserves simile and auditory ambiguity of the experience.
- source_word: Μὴ διψυχήσεις
  chosen: Do not be double‑minded
  alternatives:
  - Do not doubt
  - Do not waver
  lexicon: BDAG; LSJ
  rationale: Hermas uses a distinct term for divided interiority; 'double‑minded' keeps that nuance rather
    than general 'doubt'.
- source_word: κονιορτόν
  chosen: dust
  alternatives:
  - cloud of dust
  lexicon: LSJ
  rationale: Plain 'dust' fits the immediate description; the sense of a cloud is conveyed by the clause
    'as if up to the sky'.
- source_word: κτήνη
  chosen: cattle
  alternatives:
  - beasts
  - cattle
  lexicon: LSJ
  rationale: Retain the earlier revised main-text cattle with herds/domestic animals as alternatives.
- source_word: κῆτος
  chosen: sea‑monster
  alternatives:
  - whale
  - sea creature
  lexicon: LSJ
  rationale: κῆτος evokes something monstrous; 'sea‑monster' preserves the ominous, apocalyptic register
    better than zoological 'whale'.
- source_word: ἀκρίδες πύριναι
  chosen: fiery locusts
  alternatives:
  - locusts of fire
  - locusts like fire
  lexicon: BDAG
  rationale: Compact, vivid phrase that matches the visionary image and echoes biblical apocalyptic diction
    without importing NT wording.
- source_word: κεραμος
  chosen: jar
  alternatives:
  - tile
  - pottery
  - clay vessel
  lexicon: LSJ
  rationale: Retain the earlier jar adjudication with pottery/tile/vessel alternatives and versional shape
    differences explicit.
- source_word: λύτρωσαι/λυτρώσηται
  chosen: deliver
  alternatives:
  - rescue
  - ransom
  lexicon: BDAG
  rationale: Though from the 'ransom' family, here the sense is simple deliverance from danger.
- source_word: ἐνδυσάμενος … τὴν πίστιν τοῦ Κυρίου
  chosen: having put on the faith of the Lord
  alternatives:
  - putting on the faith of the Lord
  lexicon: BDAG
  rationale: Retain the revised genitive wording; objective faith in the Lord and subjective alternatives
    remain in the localized note.
- source_word: μεγαλείων
  chosen: mighty deeds
  alternatives:
  - majestic deeds
  - mighty things
  lexicon: LSJ
  rationale: Match the retained earlier revised main text.
- source_word: θαρσήσας
  chosen: taking courage
  alternatives:
  - being emboldened
  - having courage
  lexicon: BDAG
  rationale: Standard idiom for θαρσέω in narrative context.
- source_word: ἐμαυτὸν ἔδωκα εἰς τὸ θηρίον
  chosen: gave myself over to the beast
  alternatives:
  - I committed myself against the beast
  - I advanced toward the beast
  lexicon: LSJ
  rationale: Retain the unusual reflexive surrender/advance wording and disclosed alternatives.
- source_word: ῥοίζῳ
  chosen: with a rushing sound
  alternatives:
  - with a whizzing noise
  - with a hissing sound
  - with a rushing roar (prior contextual interpretation)
  lexicon: LSJ
  rationale: Explicitly reconsider the prior rushing-roar interpretation after fresh review. The selected
    Greek permits rushing noise or motion without establishing an animal vocalization. Sound retains the
    auditory rendering while leaving its precise character open; Palatina roaring remains versional evidence,
    not an added Greek word.
- source_word: λυμαίνεσθαι
  chosen: ravage
  alternatives:
  - lay waste
  - ruin
  lexicon: BDAG; LSJ
  rationale: In military/violent contexts, 'ravage' captures the destructive capacity envisaged.
- source_word: γλῶσσαν προέβαλλεν
  chosen: thrust out its tongue
  alternatives:
  - thrust forth its tongue
  - protrude its tongue
  lexicon: LSJ
  rationale: Match the retained main text; disclose Sinaiticus first-hand stone and S1 tongue.
- source_word: χρώματα … μέλαν … πυροειδὲς καὶ αἱματῶδες … χρυσοῦν … λευκόν
  chosen: colors … black; then fiery and blood‑red; then golden; then white
  alternatives:
  - hues … black; then fire‑colored and blood‑hued; then golden; then white
  lexicon: LSJ
  rationale: Simple, vivid color terms maintain the sequence and mounting intensity.
