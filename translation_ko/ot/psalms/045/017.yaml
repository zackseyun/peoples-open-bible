  text: I will cause your name to be remembered in every generation[a][b]; therefore the peoples will praise you forever and ever.
  footnotes:
  - marker: a
    text: Or 'the peoples will give thanks to you.' The Hebrew verb can denote praise or thanksgiving in worship contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will make mention of your name' or 'I will remember your name.' The Hebrew verb is causative, suggesting active commemoration.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 당신의 이름이 모든 세대에 기억되게 하겠습니다.[a] 그러므로 민족들이 영원히, 영원토록 당신을 찬양할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 모든 세대에 당신의 이름을 언급하겠습니다’ 또는 ‘내가 당신의 이름을 기억하겠습니다.’ 히브리어 동사는 사역형이어서, 이름이 기억되거나 기념되게 한다는 능동적 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘민족들이 당신께 감사할 것입니다.’ 히브리어 동사는 예배의 문맥에서 찬양이나 감사를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  english_pob_choice: in place of
  chosen_korean: ~ 대신에
  alternatives_korean:
  - ~을/를 대신하여
  - ~ 자리에
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 위치가 아니라 계승과 대체를 뜻하므로, 자연스러운 한국어로는 ‘~ 대신에’가 가장 직접적입니다.
- source_word: אֲבֹתֶיךָ
  english_pob_choice: your fathers
  chosen_korean: 당신의 조상들
  alternatives_korean:
  - 당신의 아버지들
  - 당신의 선조들
  lexicon: HALOT
  rationale: 직역하면 ‘아버지들’이지만, 왕조적 계승 문맥에서는 후손 대조가 분명한 ‘조상들’이 의미를 더 정확하게 드러냅니다.
- source_word: לְשָׂרִים
  english_pob_choice: as princes
  chosen_korean: 통치자들로
  alternatives_korean:
  - 왕자들로
  - 방백들로
  - 지도자들로
  lexicon: HALOT
  rationale: שָׂרִים은 궁정적 직함이지만, 한국어에서 ‘왕자들’은 의미가 어긋날 수 있어 통치 권한을 살린 ‘통치자들로’가 더 안전합니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: in all the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 온 땅과 나라
  - 온 그 땅
  lexicon: HALOT
  rationale: ‘אָרֶץ’는 ‘땅’과 ‘온 세상/온 땅’의 여지를 함께 가지므로, 시적 확장감을 살리면서도 과도하게 해석하지 않는 ‘온 땅’이 적절합니다.
theological_decisions:
- issue: 왕조 계승의 방향성과 시제 표현
  chosen_reading: 아들이 조상들을 대신하여 왕조를 잇고, 그들을 통치자로 세우는 약속으로 옮겼습니다.
  alternative_readings:
  - 조상들 대신에 아들들이 있을 것입니다
  - 아들들이 조상들의 자리를 대신할 것입니다
  rationale: 히브리어 어순은 계승의 결과를 강조하므로, 한국어에서도 왕조적 승계를 분명히 하되 과도한 신학적 확장 없이 원문 의미를 보존했습니다.
  doctrine_reference: 원문 우선, 왕조시의 계승 언어 보존
