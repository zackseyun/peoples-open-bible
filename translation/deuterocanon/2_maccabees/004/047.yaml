  from: So Ptolemy took him and moved the king into a colonnade[b][a], as though to revive him.
  to: So Ptolemy took the king aside into a colonnade, as though to refresh him, and persuaded him to change his mind.
  rationale: Earlier decisions read μετέθηκεν as physical movement and 'revive' as relief from distress. The promised persuasion in verse 46 and the judgment in verse 48 instead favor a change of mind, with refreshment serving as the pretext.
