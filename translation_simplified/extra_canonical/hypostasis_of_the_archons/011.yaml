translation:
  language: en
  text: 'When Sabaoth, Yaldabaoth’s son, saw the power of that angel, he reoriented[r1]. He sentenced his father and his mother, Matter, to judgment, and he reviled her.


    He sang songs of praise to Sophia above and to her daughter Zoe. Sophia and Zoe raised him to a high position and put him in charge of the seventh heaven. This heaven was beneath the veil separating the upper and lower realms. He is called “Sabaoth, God of Hosts” because Sophia appointed him over the armies of chaos.


    After this, Sabaoth made a huge chariot of cherubim with four faces. He also made countless angels to serve him, along with harps and lyres.


    Sophia brought her daughter Zoe and seated her at his right hand. There Zoe taught him about the eighth heaven. Sophia placed the angel of wrath at his left hand.


    From that day on, his right hand was called “life,” while his left hand represented the injustice of the Autocrat’s upper realm. All this happened before you existed.


    When Yaldabaoth saw Sabaoth in such great glory and raised so high, he became envious. His envy became a being that was both male and female. This was the origin of Envy, who gave birth to Death. Death then gave birth to offspring and appointed each one to rule its own heaven. Their multitudes filled all the heavens of chaos.


    Yet all this happened by the will of the Father of the All. It followed the pattern of everything above so that chaos could be brought to its full completion.


    Look, I have now taught you about the pattern from which the rulers were formed, the matter in which that pattern was revealed, and their parent and their world.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
