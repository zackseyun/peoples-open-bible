theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - the LORD
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Whether to preserve the repeated interrogative in the second colon
  chosen_reading: Explicitly repeat 'Why' in English
  alternative_readings:
  - 'Leave the second clause as a statement: ''you hide yourself in times of trouble'''
  rationale: Although the second colon lacks an explicit second לָמָה, the parallelism strongly implies the repeated question. Supplying 'Why' in English preserves the Hebrew poetic structure and lament force rather than flattening the line into a mere assertion.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy — optimal equivalence; preserve source sense over translation tradition'
