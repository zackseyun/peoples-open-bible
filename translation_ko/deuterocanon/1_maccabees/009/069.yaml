  terminology: ἀνόμοις는 이 문맥에서 ‘무법한 사람들’이 자연스럽고 원문의 법적·윤리적 함의를 유지합니다. χώρα는 ‘그 지방’, γῆ αὐτοῦ는 ‘자기 땅’으로 옮길 수 있습니다. 원문은 ἀπέκτειναν(그들이 죽였다)이라는 복수형이므로, 단수 본문 선택에는 정확한 본문 주석이 필요합니다.
