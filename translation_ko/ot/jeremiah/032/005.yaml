revisions:
- from: 그리고 바빌론으로 시드기야를 끌고 갈 것이며, 그는 내가 그를 돌볼 때까지 거기 머물 것입니다—야훼의 말씀입니다. 비록 여러분이 갈대아 사람들과 싸울지라도, 승리하지 못할 것입니다.[a][b]
  to: 바빌론 왕이 시드기야를 바빌론으로 데려갈 것이며, 그는 내가 그를 찾아볼 때까지 그곳에 머물 것입니다[a]—야훼의 말씀입니다. 너희가 갈대아 사람들과 싸워도 성공하지 못할 것입니다.[b]
  rationale: 바빌론 왕을 명시하여 원문의 문맥상 주어를 한국어에서 분명히 했습니다. פקד은 ‘찾아보다’로 번역하고 주석에서 가능한 심판적·개입적 의미를 보존했습니다. 마지막 동사는 ‘성공하지 못하다’로 옮겨 전투의 결과에만 의미를 한정하지 않았습니다.
