  meaning_decisions:
  - source_phrase: ἕως πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ αὐτῶν
    prior_rendering: until their fellow servants and their brothers ... should also be completed
    new_rendering: until the number of their fellow servants and their brothers and sisters ... was complete
    rationale: The completion concerns the group of martyrs, not the moral perfection of individual believers. Supplying 'number' communicates the contextual sense of the compressed Greek; the literal construction is retained in a note.
  - source_phrase: οἱ ἀδελφοὶ αὐτῶν
