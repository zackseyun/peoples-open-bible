  meaning_decisions:
  - source_phrase: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν
    prior_rendering: But Jesus cried out and said
    new_rendering: Jesus cried out
    rationale: The quotation itself supplies the act of saying, while 'cried out' retains the force of the public declaration; no stronger adversative connection is required.
  - source_phrase: Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με
    prior_rendering: The one who believes in me does not believe in me, but in the one who sent me
    new_rendering: Whoever believes in me believes not only in me but in the one who sent me
    rationale: The negation denies that faith terminates in Jesus independently of his sender, not that the believer believes in Jesus; 'not only' conveys that rhetorical relationship in English.
