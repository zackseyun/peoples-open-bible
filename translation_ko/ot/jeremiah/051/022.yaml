  naturalness: ‘너와 함께’는 한국어에서 공동 행위자로 읽혀 원문의 도구적 의미를 흐립니다. ‘너로’는 짧고 자연스럽게 수단성을 나타냅니다. ‘늙은이’는 다소 낮추거나 거칠게 들릴 수 있어 현대 공적 문체에는 ‘노인’이 더 적절합니다.
