translation:
  text: Accept whatever comes upon you, and be patient when you are brought low[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew says, 'in your brokenness'; the Greek reads, 'in the reversals of your humiliation.'
