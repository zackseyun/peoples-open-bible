  - Add interpretive qualifiers such as 'everyone who asks rightly'
  rationale: The Greek states an unqualified universal maxim in the context of prayer exhortation. The translation should preserve that tension and not import theological conditions not expressed in the verse itself.
  doctrine_reference: Preserve theological tension rather than resolve it.
