  revision_rationale: 원문의 공간적 진행(스올―심판의 장소―깊은 어둠)과 결말인 폭력적인 죽음을 모두 보존했습니다. 불필요한 본문 내 언어 표기를 각주로 옮기고 현대 합쇼체로 정리했습니다.
