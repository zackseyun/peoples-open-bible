id: ECC.8.2
reference: Ecclesiastes 8:2
source:
  edition: WLC
  text: אֲנִי֙ פִּי מֶ֣לֶךְ שְׁמ֔וֹר וְ/עַ֕ל דִּבְרַ֖ת שְׁבוּעַ֥ת אֱלֹהִֽים־׃
translation:
  text: I say, obey the king’s command because of the oath sworn before God[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “the oath made to God” or “God’s oath”; the Hebrew does not specify who swore it.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  chosen: I say
  alternatives:
  - I
  - I myself
  lexicon: HALOT
  rationale: The Hebrew begins abruptly with the independent pronoun 'I,' and many interpreters understand an implied verb from context. Rendering simply 'I' is too elliptical in English, so 'I say' supplies the minimal sense needed for readable modern English while preserving the speaker's personal assertion.
- source_word: פִּי מֶלֶךְ
  chosen: the king’s command
  alternatives:
  - the king’s mouth
  - the king’s word
  - the king’s order
  lexicon: HALOT
  rationale: Literally 'the mouth of a king,' an idiom for what the king says or commands. 'The king’s command' best conveys the idiomatic force in natural English without flattening the authority implied.
- source_word: שְׁמֹר
  chosen: keep
  alternatives:
  - obey
  - guard
  lexicon: HALOT
  rationale: The verb commonly means 'keep, guard, observe.' 'Keep' preserves the Hebrew's breadth and allows the object 'the king’s command' to carry the sense of obedience.
- source_word: וְעַל
  chosen: because of
  alternatives:
  - and because of
  - on account of
  - with regard to
  lexicon: HALOT
  rationale: The conjunction-preposition sequence is syntactically compressed. In context it introduces the ground or motive for keeping the king's command. 'Because of' gives the likely causal sense in smooth English; 'and because of' is possible but less natural in the compressed Hebrew construction.
- source_word: דִּבְרַת
  chosen: because of
  alternatives:
  - matter of
  - word of
  - account of
  lexicon: HALOT
  rationale: In construct with 'oath,' this noun contributes to the idiom 'because of / on account of the oath.' Rendering it separately as 'word' would sound wooden and obscure the phrase's function.
- source_word: שְׁבוּעַת אֱלֹהִים
  chosen: the oath of God
  alternatives:
  - the oath of God
  - God’s oath
  - an oath to God
  lexicon: HALOT
  rationale: This source-near rendering does not resolve the construct relationship by adding either “your” or “before.”
