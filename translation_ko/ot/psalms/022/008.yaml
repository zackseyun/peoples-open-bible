translation:
  language: ko
  text: “여호와께 맡기십시오[a]. 여호와께서 그를 구출하시게 하십시오. 여호와께서 그를 건져 내시게 하십시오. 여호와께서 그를 기뻐하시니!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하여 ‘여호와께 굴려라’입니다. 이 관용구는 자신이나 자신의 일을 여호와께 맡긴다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֹאַי
  english_pob_choice: All who see me
  chosen_korean: 나를 보는 모든 사람
  alternatives_korean:
  - 나를 보는 이들 모두
  - 나를 바라보는 모든 사람
  lexicon: HALOT
  rationale: 총칭 표현을 자연스러운 현대 한국어로 옮기되, ‘보는’이라는 현재분사적 의미를 살려 관찰자 전체를 가리키는 뉘앙스를 유지했습니다.
- source_word: יַלְעִגוּ לִי
  english_pob_choice: mock me
  chosen_korean: 나를 비웃습니다
  alternatives_korean:
  - 나를 조롱합니다
  - 나를 모욕합니다
  lexicon: HALOT
  rationale: לעג의 핵심 의미는 조롱과 멸시이므로, 현대 한국어에서 가장 직접적이고 간결한 ‘비웃다’로 옮겼습니다.
- source_word: יַפְטִירוּ בְשָׂפָה
  english_pob_choice: they sneer with the lip
  chosen_korean: 입술을 벌리고
  alternatives_korean:
  - 입술을 내밀고
  - 입술로 조롱하고
  - 입술을 내어 보이고
  lexicon: HALOT
  rationale: 히브리어 관용구는 경멸을 드러내는 입술의 몸짓을 가리키므로, 직역적이면서도 한국어에서 이해 가능한 동작 표현으로 옮겼습니다.
- source_word: יָנִיעוּ רֹאשׁ
  english_pob_choice: they shake the head
  chosen_korean: 머리를 흔듭니다
  alternatives_korean:
  - 고개를 젓습니다
  - 머리를 젓습니다
  lexicon: HALOT
  rationale: 경멸의 제스처를 나타내는 관용구이므로, 가장 자연스러운 한국어 관용 표현인 ‘머리를 흔들다’로 유지했습니다.
theological_decisions:
- issue: 시편 본문의 1차 의미와 신약적 연상 처리
  chosen_reading: 시편 화자의 고난 상황을 직접 드러내는 본문 의미를 우선 살리고, 그리스도론적 함의를 본문 안에 미리 주입하지 않았습니다.
  alternative_readings:
  - 독자가 복음서 수난 기사와의 연결을 떠올릴 수 있습니다.
  rationale: 이 절은 원래 히브리 시편의 조롱 장면이므로, 번역문은 먼저 시편 자체의 뜻을 전달해야 하며 신약의 재사용은 암시 수준으로 남겨 두는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
