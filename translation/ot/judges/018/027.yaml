    rationale: The clause resumes the Danites’ story by recalling the taking already narrated, rather than describing a second removal.
  - source_phrase: הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
    prior_rendering: the priest who belonged to him
    new_rendering: the priest who had served him
    rationale: The relationship is the priest’s attachment to Micah’s household shrine, not ownership of the priest as property.
  - source_phrase: וַיָּבֹאוּ עַל לַיִשׁ עַל עַם שֹׁקֵט וּבֹטֵחַ
    prior_rendering: came against Laish, against a people quiet and secure
    new_rendering: advanced against Laish, whose people were living quietly and securely
    rationale: The wording preserves the hostile approach and clearly identifies the vulnerable people as Laish’s inhabitants.
  - source_phrase: וַיַּכּוּ אוֹתָם לְפִי חָרֶב
    prior_rendering: They struck them with the edge of the sword
