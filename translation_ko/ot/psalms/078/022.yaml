id: PSA.78.22
reference: Psalms 78:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹ֣א הֶ֭אֱמִינוּ בֵּ/אלֹהִ֑ים וְ/לֹ֥א בָ֝טְח֗וּ בִּֽ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/022.yaml
  text: because they did not believe in God, and did not trust in his salvation.
translation:
  language: ko
  text: 그들이 하나님을 믿지 않았고, 그의 구원을 신뢰하지도 않았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ בֵּאלֹהִים
  english_pob_choice: did not believe in God
  chosen_korean: 하나님을 믿지 않았고
  alternatives_korean:
  - 하나님을 믿지 않았고
  - 하나님을 믿지 못했고
  lexicon: believe in
  rationale: 히브리어는 ב־를 동반한 ‘믿다’로, POB의 ‘in God’와 맞추어 목적어를 취하는 자연스러운 한국어 ‘하나님을 믿다’로 옮겼습니다.
- source_word: בָטְחוּ
  english_pob_choice: did not trust
  chosen_korean: 신뢰하지도 않았습니다
  alternatives_korean:
  - 신뢰하지도 않았습니다
  - 의지하지도 않았습니다
  lexicon: trust
  rationale: בטח는 단순 감정보다 기대어 맡기는 신뢰를 뜻하므로, 현대 문체에서 분명한 ‘신뢰하다’를 택했습니다.
- source_word: בִּישׁוּעָתוֹ
  english_pob_choice: in his salvation
  chosen_korean: 그의 구원을
  alternatives_korean:
  - 그의 구원을
  - 그의 구속을
  lexicon: salvation
  rationale: ישועה는 구원/구출의 의미이므로, POB의 ‘salvation’을 따라 신학적 의미를 보존하는 ‘구원’으로 옮겼습니다.
theological_decisions:
- issue: ‘믿다’와 ‘신뢰하다’의 병렬 관계
  chosen_reading: 전반부는 하나님에 대한 믿음의 거부, 후반부는 그의 구원에 대한 신뢰의 거부로 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘믿지 않았다’로 평준화
  - 둘 다 ‘의지하지 않았다’로 통일
  rationale: 히브리어 동사는 서로 다르며, 시편의 병행법은 같은 부정이 아니라 믿음과 신뢰의 두 측면을 구분해 강조합니다.
  doctrine_reference: 시편 78편의 불신 서술과 하나님에 대한 신뢰의 주제
