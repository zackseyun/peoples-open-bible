- from: 그리고 당신은 이 영혼들의 아버지인 당신의 감시자들이 내 시대에 어떻게 행동했는지 알고 있습니다. 나의 하나님이여 이 살아 있는 영들을 가두어 심판하시는 곳에 가두사 그들로 주의 종의 아들들을 멸하지 못하게 하옵소서 이들은 악한 자라 멸하기 위하여 창조된 것임이니이다
  to: 그리고 주님께서는 이 영들의 아버지인 주님의 감시자들이 제 시대에 어떻게 행하였는지 알고 계십니다. 살아 있는 이 영들을 가두시고 심판의 장소에 단단히 붙들어 두시어, 그들이 주님의 종의 아들들을 타락시키지 못하게 하십시오. 나의 하나님, 이들은 악한 자들이며 멸망시키려고 지어진 것들이기 때문입니다.
  category: register_archaic_repair
  rationale: 기도문에 「가두사… 못하게 하옵소서… 것임이니이다」라는 개역 계열 문어체가 남아 있었고 문장 부호가 거의 없었습니다. 합쇼체 존대형 「-십시오 / -습니다」로 통일하고 문장을 나누어 구두점을 넣었습니다. 하나님을 「당신」으로 부르던 것을 「주님」으로 바꾸어 기도의 수신자를 분명히 했고, 화자의 자기 지칭도 「내」에서 「제」로 낮췄습니다. 이 절의 source.text는 비어 있어 의미는 유지한 채 등록만 수정했습니다.
