base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/016.yaml
  text: So she kept his garment beside her until his master came home.
translation:
  language: ko
  text: 그녀는 그의 옷을 자기 곁에 놓아 두고, 그의 주인이 집으로 돌아올 때까지 그대로 두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּנַּח
  english_pob_choice: kept
  chosen_korean: 두고 있다가
  alternatives_korean:
  - 간직하고 있다가
  - 곁에 놓아두고 있다가
  lexicon: Hiphil/Qal narrative verb in context
  rationale: 단순히 한 번 ‘놓다’보다, 이어지는 상황이 끝날 때까지 소지 상태를 유지한 뉘앙스를 살려 ‘두고 있다가’로 옮겼습니다.
- source_word: בִּגְדֹו
  english_pob_choice: his garment
  chosen_korean: 그의 옷
  alternatives_korean:
  - 그의 겉옷
  - 그의 의복
  lexicon: בֶּגֶד
  rationale: 히브리어 בֶּגֶד의 일반적 의미를 따라 ‘옷’으로 옮겼고, 특별히 겉옷으로 한정할 근거는 없다고 보았습니다.
- source_word: אֶצְלָהּ
  english_pob_choice: beside her
  chosen_korean: 자기 곁에
  alternatives_korean:
  - 그녀 곁에
  - 자기 옆에
  lexicon: אֵצֶל
  rationale: 공간적 근접을 자연스러운 현대 한국어로 표현하되, ‘그녀 곁에’보다 주어의 지속적 소지 상태를 분명히 드러내는 ‘자기 곁에’를 택했습니다.
- source_word: עַד בּוֹא אֲדֹנָיו אֶל בֵּיתוֹ
  english_pob_choice: until his master came home
  chosen_korean: 그의 주인이 집으로 돌아올 때까지
  alternatives_korean:
  - 그의 주인이 집에 올 때까지
  - 그의 주인이 집 안으로 들어올 때까지
  lexicon: עד + בוא + בית
  rationale: POB의 ‘came home’를 따라, 히브리어의 ‘집에 들어오다’보다 자연스러운 ‘집으로 돌아오다’를 사용해 출입의 방향과 귀가의 의미를 함께 살렸습니다.
