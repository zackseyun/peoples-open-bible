translation:
  text: And the Lord said to Gabriel, “Go against the illegitimate offspring[a] and the outcasts, and against the children
    of fornication. Destroy the children of fornication[b] and the children of the Watchers from among humankind. Drive them
    out and send them[c] against one another, so that they destroy one another in battle, for they will have no length of
    days.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally a designation for illegitimate offspring; traditionally rendered “bastards.”
    reason: lexical_alternative
  - marker: b
    text: The supplied Ge'ez edition marks the repeated words “the children of fornication and” as textually uncertain; the
      repetition has been retained in the main text for transparency.
    reason: textual_variant
  - marker: c
    text: The words rendered “and send them” appear in editorial brackets in the supplied witness, indicating uncertainty
      in the edited text.
    reason: textual_variant
lexical_decisions:
- source_word: መንዝራን
  chosen: illegitimate offspring
  alternatives:
  - bastards
  - children born outside lawful union
  rationale: The term designates offspring regarded as illegitimate. “Illegitimate offspring” preserves that sense without
    using “bastards” as an unmarked modern insult; the traditional sharper gloss is retained in a note.
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ማኑናን
  chosen: outcasts
  alternatives:
  - reprobates
  - rejected ones
  rationale: The word characterizes the group as rejected or cast out. “Outcasts” is elevated but readable and avoids the
    later doctrinal associations that “reprobates” can carry.
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ውሉደ፡ ዘማ
  chosen: children of fornication
  alternatives:
  - offspring of fornication
  - children of illicit union
  rationale: The formally transparent rendering preserves both the kinship expression and the condemnatory sexual designation
    rather than replacing the phrase with a broader label such as “sinners.”
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ትጉሃን
  chosen: Watchers
  alternatives:
  - vigilant ones
  - wakeful ones
  rationale: Literally associated with wakefulness or vigilance, the term functions here as the established designation for
    the angelic Watchers in this section. Capitalization marks that group designation without importing further claims about
    their offspring.
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እምሰብእ
  chosen: from among humankind
  alternatives:
  - from among men
  - from humanity
  rationale: The phrase marks removal from the human sphere collectively; “humankind” communicates the generic force without
    implying adult males only.
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በበይናቲሆሙ
  chosen: against one another
  alternatives:
  - among themselves
  - each against the other
  rationale: In this battle command the distributive expression indicates mutual opposition, not merely location among the
    group.
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በቀትል፡ ይትሐጐሉ
  chosen: they destroy one another in battle
  alternatives:
  - they perish in battle
  - they annihilate one another in slaughter
  rationale: The reciprocal context supports mutual destruction, while “in battle” preserves the explicit martial setting
    without intensifying it into an unsupported description.
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኑሐ፡ መዋዕል፡ አልቦሙ
  chosen: they will have no length of days
  alternatives:
  - long life will not be theirs
  - they will not have many days
  rationale: The source’s idiom is retained because “length of days” is intelligible English and preserves the solemn judgment
    formula rather than reducing it to “they will die soon.”
  consultation_status: No independently consulted lexicon entry is claimed by this application.
