  text: 주님께서는 그들을 멸하신 아모리 족속의 왕 시혼과 옥 및 그들의 땅에 하신 것처럼, 그들에게도 하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: יהוה
  rationale: 본문의 발화 주체는 언약의 하나님의 고유명사이지만, 이 절의 POB English가 LORD로 정리되어 있어 한국어 본문에서는 합쇼체의 자연스러운 호칭인 ‘주님’으로 옮기고, 야훼 표기는 본문 내 역주가 없는 한 사용하지 않았습니다.
- source_word: עָשָׂה ... כַּאֲשֶׁר עָשָׂה
  english_pob_choice: will do ... just as he did
  chosen_korean: 하신 것처럼 하시고
  alternatives_korean:
  - 행하신 것처럼 행하시고
  - 하실 것이며 ... 하신 것처럼
  lexicon: עשה
  rationale: 동일 동사 반복을 한국어에서도 살려, 미래적 약속과 비교 구조를 간결하게 연결했습니다.
- source_word: הִשְׁמִיד
  english_pob_choice: destroyed
  chosen_korean: 멸하실 것입니다
  alternatives_korean:
  - 멸망시키실 것입니다
  - 진멸하실 것입니다
  lexicon: שמד
  rationale: 전멸·파멸의 강한 의미를 반영하되, 현대 한국어에서 본문이 과도하게 군사적 뉘앙스로만 읽히지 않도록 ‘멸하다’로 옮겼습니다.
theological_decisions:
- issue: 여호와/주님 표기
  chosen_reading: 본문에서는 신명기 서술의 하나님을 ‘주님’으로 처리했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 직접 인용된 하나님의 이름을 강조하기보다, 서술 문맥에서의 주님의 행위를 선포하는 형태이므로 POB의 English 본문과 맞추어 ‘주님’을 사용했습니다.
  doctrine_reference: 이름 번역 일관성과 한국어 예배 언어의 수용성
