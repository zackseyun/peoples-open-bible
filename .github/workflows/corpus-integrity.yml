      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4,<5' 'python-dotenv>=1,<2' 'Pillow>=11,<13'
      - name: Validate catalog and numbering
        run: |
          python tools/extra_texts/validate_catalog.py --all
          python -m unittest discover -s tests -p 'test_pseudo_clementine*.py'
          python tools/lint_psalm_numbering.py --strict
      - name: Validate the complete reader corpus
        run: python tools/validate_reader_corpus.py --quiet --malformed-yaml error
      - name: Test historical source-review boundaries
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_historical_archive_review.py'
          python -m unittest discover -s tests -p 'test_historical_scan_review.py'
