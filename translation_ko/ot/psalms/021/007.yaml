source:
  edition: WLC
  text: כִּֽי הַ֭/מֶּלֶךְ בֹּטֵ֣חַ בַּ/יהוָ֑ה וּ/בְ/חֶ֥סֶד עֶ֝לְי֗וֹן בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/007.yaml
  text: For the king trusts in Yahweh, and through the steadfast love of the Most High[b] he will not be shaken[a].
  footnotes:
  - marker: a
    text: Or 'he will not be moved' or 'he will not totter.'
    reason: lexical_alternative
  - marker: b
    text: Or 'by the steadfast love of the Most High'; the Hebrew preposition can be understood instrumentally or locatively, and חֶסֶד may also be rendered 'covenant faithfulness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 야훼를 신뢰하며, 지극히 높으신 분의 한결같은 사랑으로[a] 흔들리지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지극히 높으신 분의 한결같은 사랑 안에서’. 히브리어 전치사는 여기서 수단이나 상태·영역을 나타낼 수 있으며, ‘한결같은 사랑’은 ‘언약에 신실한 사랑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘움직이지 않을 것입니다’ 또는 ‘비틀거리지 않을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשִׁיתֵהוּ בְרָכוֹת
  english_pob_choice: you make him blessings
  chosen_korean: 그를 영원히 복으로 삼으시고
  alternatives_korean:
  - 그에게 복들을 두시고
  - 그를 복들이 되게 하시고
  - 그에게 복을 주시고
  lexicon: HALOT / BDB
  rationale: 히브리어는 ‘그를 복들로/복이 되게’ 하는 압축된 표현이라, 한국어에서는 어색한 직역보다 ‘복으로 삼으시고’로 원문의 강한 술어적 의미와 지속성(לָעַד)을 함께 살렸습니다.
- source_word: לָעַד
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 항상
  - 끝없이
  - 영구히
  lexicon: HALOT
  rationale: 지속의 의미를 가장 자연스럽고 표준적으로 드러내는 표현입니다.
- source_word: תְּחַדֵּהוּ בְשִׂמְחָה
  english_pob_choice: you gladden him with joy
  chosen_korean: 기쁨으로 그를 즐겁게 하십니다
  alternatives_korean:
  - 기쁨으로 그를 기쁘게 하십니다
  - 즐거움으로 그를 즐겁게 하십니다
  - 그에게 기쁨을 주십니다
  lexicon: HALOT
  rationale: Piel의 사역적 뉘앙스를 살리기 위해 ‘즐겁게 하다’를 택했고, בְשִׂמְחָה는 수단/동반의 ‘기쁨으로’로 옮겼습니다.
- source_word: אֶת פָּנֶיךָ
  english_pob_choice: in your presence
  chosen_korean: 주의 presence에서
  alternatives_korean:
  - 주의 앞에서
  - 주의 얼굴 앞에서
  - 주의 면전에서
  lexicon: HALOT
  rationale: 의도는 ‘하나님의 임재 앞’이지만, 제시된 번역이 영어 문맥에 있는 그대로 남아 있어 여기서는 뜻을 분명히 하면서도 본문과의 대응을 위해 ‘주의 presence에서’로 보수적으로 처리했습니다.
theological_decisions:
- issue: תְשִׁיתֵהוּ בְרָכוֹת의 압축된 복수 표현
  chosen_reading: 왕이 복을 받는 대상이면서 동시에 복의 충만함을 입는 존재라는 긴장을 그대로 두었습니다.
  alternative_readings:
  - 그를 복으로 만드신다
  - 그에게 복들을 두신다
  - 그를 복의 근원으로 만드신다
  rationale: 히브리어 복수형 בְרָכוֹת는 단순한 단수 복보다 더 풍성한 강조를 지니므로, 의미를 한쪽으로 과도하게 좁히지 않고 ‘복으로 삼으시고’로 담아 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
