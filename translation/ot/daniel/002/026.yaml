  from: The king answered and said to Daniel, whose name was Belteshazzar, “Are you able to make known to me the dream that I saw, and its interpretation?”
  to: The king asked Daniel, who was called Belteshazzar, “Can you tell me the dream I saw and its interpretation?”
  rationale: The lexical record supports retaining both the dream and its interpretation as the king’s demand. Its preference for doubled speech verbs and make known rests chiefly on formal correspondence, so these are expressed more naturally without changing the demand.
