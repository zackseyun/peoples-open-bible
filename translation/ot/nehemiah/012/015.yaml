  lexicon: HALOT
  rationale: The prefixed ל in this priestly list marks association/reference within the succession formula ('for X, Y' = for the house/clan of X, the representative was Y). 'Harim' is a proper name and is transliterated per project policy.
- source_word: עַדְנָא
  chosen: Adna
  alternatives:
