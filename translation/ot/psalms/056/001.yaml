  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: idiom
  tier: 1
  from: Be gracious to me[a], O God, for man pants after me; all day long, fighting, he oppresses me.
  to: Be gracious to me, O God, for a man pursues me[a]; all day long an attacker oppresses me.
  rationale: In current English, “pants after me” readily suggests a non-hostile or sexual desire and is therefore a misleading literalism here. “Pursues me” communicates the hostile force of שׁאף naturally, with the concrete image retained in the note. The participle לֹחֵם can be substantival; “an attacker” supplies a natural English subject without introducing a distinct person.
