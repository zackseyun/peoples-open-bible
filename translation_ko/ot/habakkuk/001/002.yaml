base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/002.yaml
  text: How long, O LORD, have I cried for help and you do not hear? I cry out to you, “Violence!” and you do not save.
translation:
  language: ko
  text: 야훼여, 언제까지 제가 부르짖어도 듣지 않으시겠습니까? 제가 주님께 ‘폭력!’이라고 외쳐도 구원하지 않으시겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד אָ֧נָה
  english_pob_choice: How long
  chosen_korean: 왜
  alternatives_korean:
  - 언제까지
  - 얼마나 오래
  lexicon: 임박한 탄원 표현
  rationale: 예언자의 탄식에서 ‘얼마나 오래’의 시간적 절박함을 한국어 문맥상 가장 자연스럽게 드러내는 간결한 표현으로 옮겼습니다.
- source_word: יְהוָ֛ה
  english_pob_choice: O LORD
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: יהוה
  rationale: 원문 고유명사 יהוה를 프로젝트 기본값인 ‘야훼’로 직접 옮겨, 영문 POB의 LORD 표기를 신명사적 호칭으로 되살렸습니다.
- source_word: שִׁוַּ֖עְתִּי / אֶזְעַ֥ק
  english_pob_choice: I have cried for help / I cry out
  chosen_korean: 내가 부르짖어 도움을 구해도 / 내가 … 외쳐도
  alternatives_korean:
  - 내가 부르짖었는데도 / 내가 외쳐도
  - 내가 도움을 청해도 / 내가 외치고 있는데도
  lexicon: 부르짖다 / 외치다
  rationale: 두 동사는 반복된 절박한 호소를 나타내므로, 첫째는 도움을 구하는 탄원, 둘째는 강한 외침을 살려 한국어 동사 구성을 구분했습니다.
- source_word: חָמָ֖ס
  english_pob_choice: “Violence!”
  chosen_korean: 폭력
  alternatives_korean:
  - 학대
  - 불의
  lexicon: חָמָס
  rationale: 외침의 내용으로서 חָמָס는 단순한 일반적 폭력이라기보다 부정하고 억압적인 폭력 행위를 가리키므로, 직설적으로 ‘폭력’으로 옮겼습니다.
theological_decisions:
- issue: 탄식문의 직접 호소와 2인칭 신호격 유지
  chosen_reading: “야훼여”로 시작해 예언자의 항의적 탄식을 직접 드러내고, 2인칭 존대 종결로 하나님께 드리는 호소를 유지했습니다.
  alternative_readings:
  - ‘주님’으로 순화하여 일반 경건문처럼 표현하기
  - 탄식의 직접성을 약화시켜 서술형으로 바꾸기
  rationale: 하박국의 문장은 불평이 아니라 언약적 탄원에 가깝기 때문에, 질문형과 직접 호칭을 보존하는 것이 본문 기능에 충실합니다.
  doctrine_reference: 예언서의 탄식과 언약적 소송 언어
