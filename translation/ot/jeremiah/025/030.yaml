  text: וְ/אַתָּה֙ תִּנָּבֵ֣א אֲלֵי/הֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם יְהוָ֞ה מִ/מָּר֤וֹם יִשְׁאָג֙ וּ/מִ/מְּע֤וֹן קָדְשׁ/וֹ֙ יִתֵּ֣ן קוֹל֔/וֹ שָׁאֹ֤ג יִשְׁאַג֙ עַל נָוֵ֔/הוּ הֵידָד֙ כְּ/דֹרְכִ֣ים יַֽעֲנֶ֔ה אֶ֥ל כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־־־׃
translation:
  text: 'As for you, prophesy all these words against them and say to them: Yahweh will roar from on high and raise his voice from his holy dwelling; he will roar mightily against his pasture[a]. Against all the inhabitants of the earth he will raise a shout like those who tread grapes[b].'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The pasture is an image for Yahweh’s own land and people.
    reason: cultural_note
  - marker: b
    text: Workers shouted rhythmically while treading grapes in a winepress.
    reason: cultural_note
