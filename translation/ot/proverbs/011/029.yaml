  from: Whoever troubles his own household will inherit wind[a], and the fool will be a servant to the wise in heart.
  to: Whoever brings trouble on his own household will inherit wind, and the fool will be a servant[a] to the wise in heart.
  rationale: The later audit's “household” and “wise in heart” are retained, as is the ironic image “inherit wind.” I clarify the force of the opening verb and note the potentially bonded status behind “servant,” which matters to the fool's loss of independence.
