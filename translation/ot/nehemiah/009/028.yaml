id: NEH.9.28
reference: Nehemiah 9:28
source:
  edition: WLC
  text: וּ/כְ/נ֣וֹחַ לָ/הֶ֔ם יָשׁ֕וּבוּ לַ/עֲשׂ֥וֹת רַ֖ע לְ/פָנֶ֑י/ךָ וַ/תַּֽעַזְבֵ֞/ם בְּ/יַ֤ד אֹֽיְבֵי/הֶם֙ וַ/יִּרְדּ֣וּ בָ/הֶ֔ם וַ/יָּשׁ֨וּבוּ֙ וַ/יִּזְעָק֔וּ/ךָ וְ/אַתָּ֞ה מִ/שָּׁמַ֧יִם תִּשְׁמַ֛ע וְ/תַצִּילֵ֥/ם כְּֽ/רַחֲמֶ֖י/ךָ רַבּ֥וֹת עִתִּֽים׃
translation:
  text: But when they had rest, they again did evil before you; so you left them in the power of their enemies, who ruled over them. Then they turned back to you and cried out, and from heaven you heard and delivered them many times according to your mercies.
  philosophy: dynamic
lexical_decisions:
- source_word: וּכְנוֹחַ
  chosen: But when they had rest
  alternatives:
  - But after they had rest
  lexicon: HALOT
  rationale: The temporal construction marks the circumstance of their relapse but does not itself encode immediacy.
- source_word: יָשׁוּבוּ
  chosen: they again did
  alternatives:
  - they returned to do
  lexicon: HALOT
  rationale: With the following infinitive, the verb functions idiomatically for repeating the evil action. 'Again did evil' avoids a wooden return phrase.
- source_word: לַעֲשׂוֹת רַע
  chosen: to do evil
  alternatives:
  - to do what was evil
  - to act wickedly
  lexicon: HALOT
  rationale: A standard Hebrew idiom for morally evil action. 'To do evil' is concise and natural while preserving the ethical force.
- source_word: לְפָנֶיךָ
  chosen: before you
  alternatives:
  - in your sight
  - against you
  lexicon: HALOT
  rationale: Literally 'before your face/presence.' 'Before you' keeps the relational and covenantal dimension without overinterpreting it as merely visual ('in your sight') or adversative ('against you').
- source_word: וַתַּעַזְבֵם
  chosen: so you left them
  alternatives:
  - and you abandoned them
  lexicon: HALOT
  rationale: The narrative consequence is clear from the sequence. 'Left them' is direct and avoids overstating permanent abandonment.
- source_word: בְּיַד אֹיְבֵיהֶם
  chosen: in the power of their enemies
  alternatives:
  - in the hand of their enemies
  lexicon: HALOT
  rationale: The hand idiom denotes control or power. The source image remains footnoted.
- source_word: וַיִּרְדּוּ בָהֶם
  chosen: who ruled over them
  alternatives:
  - and they subjugated them
  - and they oppressed them
  lexicon: HALOT
  rationale: רדד/רדה in context refers to exercising dominion. 'Ruled over them' is the most direct rendering; oppression is implied by context but not the core lexical meaning.
- source_word: וַיָּשׁוּבוּ
  chosen: Then they returned
  alternatives:
  - Then they turned back
  lexicon: HALOT
  rationale: Here the lexical return marks the people's turning back to God and crying out, distinct from the earlier idiom for repeated wrongdoing.
- source_word: וַיִּזְעָקוּךָ
  chosen: cried out to you
  alternatives:
  - called to you for help
  - cried to you
  lexicon: HALOT
  rationale: זעק often denotes a desperate cry for help. 'Cried out to you' communicates urgency without adding words absent from the text.
- source_word: מִשָּׁמַיִם תִּשְׁמַע
  chosen: from heaven you heard
  alternatives:
  - you heard from heaven
  lexicon: HALOT
  rationale: The fronted source phrase is retained naturally and marks the divine response.
- source_word: וְתַצִּילֵם
  chosen: and delivered them
  alternatives:
  - and rescued them
  - and saved them
  lexicon: HALOT
  rationale: נצל in this context is deliverance from enemies. 'Delivered' fits the historical setting and avoids importing fuller soteriological overtones that 'saved' may carry in English.
- source_word: כְּרַחֲמֶיךָ
  chosen: according to your mercies
  alternatives:
  - according to your compassion
  lexicon: HALOT
  rationale: The suffix phrase grounds the repeated deliverances in God's mercies; the following plural adjective belongs with 'times,' not with 'mercies.'
- source_word: רַבּוֹת עִתִּים
  chosen: many times
  alternatives:
  - on many occasions
  lexicon: HALOT
  rationale: The feminine plural adjective רַבּוֹת agrees with עִתִּים. This phrase, not 'mercies,' carries the sense 'many.'
