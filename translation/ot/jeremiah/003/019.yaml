    prior_rendering: the most beautiful inheritance of the nations' armies
    new_rendering: the most beautiful inheritance among all the nations
    rationale: The land-and-inheritance context favors praise of the land’s exceptional beauty among the nations, not an inheritance belonging to military forces. The difficult wording involving “hosts” is preserved in a note.
