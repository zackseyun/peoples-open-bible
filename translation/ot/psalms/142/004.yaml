  meaning: David asks Yahweh to witness his abandonment, with no one acknowledging him, no escape available, and no one concerned for him.
  meaning_decisions:
  - source_phrase: הַבֵּיט יָמִין
    prior_rendering: Look to the right
    new_rendering: Look to my right
    rationale: The implied vantage point is David’s right side, where he looks for someone to support him; supplying “my” makes that relationship clear.
  - source_phrase: וְאֵין לִי מַכִּיר
    prior_rendering: there is no one who recognizes me
    new_rendering: no one acknowledges me
    rationale: The lament concerns social abandonment, not failure to recognize David’s appearance; “acknowledges” better conveys the refusal to recognize a relationship with him.
  - source_phrase: אָבַד מָנוֹס מִמֶּנִּי
    prior_rendering: no refuge remains for me
    new_rendering: no escape remains for me
    rationale: The noun denotes flight, escape, or a place of escape; amid traps and pursuit, “escape” makes David’s predicament clear and distinguishes it from Yahweh as his refuge in the next verse.
