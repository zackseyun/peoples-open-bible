id: PSA.89.2
reference: Psalms 89:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אָמַ֗רְתִּי ע֭וֹלָם חֶ֣סֶד יִבָּנֶ֑ה שָׁמַ֓יִם תָּכִ֖ן אֱמוּנָתְ/ךָ֣ בָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/002.yaml
  text: For I said, “Steadfast love will be built up[a] forever; in the heavens you will establish your faithfulness.”
  footnotes:
  - marker: a
    text: Or “Steadfast love will be established forever.” The Hebrew verb can be rendered “built” or more generally “established”; the translation keeps the poetic building metaphor.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 제가 말하기를, “변함없는 사랑은 영원히 세워질 것이며, 주께서는 하늘에서 주의 신실하심을 굳게 세우실 것입니다” 하였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַסְדֵי
  english_pob_choice: steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 자비
  lexicon: HALOT
  rationale: חסד은 언약적 사랑, 인자, 자비의 폭을 가지므로, 시편의 문맥에서 하나님의 지속적이고 신실한 사랑을 드러내는 ‘인자하심’이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 신명은 POB의 원칙에 따라 ‘야훼’로 옮겨, 칭호가 아니라 고유한 언약 이름임을 드러냅니다.
- source_word: אֱמוּנָתְךָ
  english_pob_choice: your faithfulness
  chosen_korean: 주님의 신실하심
  alternatives_korean:
  - 주님의 믿음성
  - 주님의 성실하심
  - 주님의 진실하심
  lexicon: HALOT
  rationale: אֱמוּנָה는 하나님께 대해 ‘신실함, 신뢰할 만하심’을 뜻하므로, 한국어에서는 자연스럽고 신학적으로도 정확한 ‘신실하심’이 가장 잘 맞습니다.
- source_word: בְּפִי
  english_pob_choice: with my mouth
  chosen_korean: 제 입으로
  alternatives_korean:
  - 제 입을 통해
  - 제 입으로서
  - 제 입으로써
  lexicon: HALOT
  rationale: 직역적인 ‘입으로’는 한국어에서도 충분히 자연스러우며, 말로 선포한다는 육체적 이미지를 잘 보존합니다.
theological_decisions:
- issue: 언약적 사랑의 표현
  chosen_reading: ‘인자하심’으로 번역해 하나님의 지속적이고 언약적인 사랑을 드러냅니다.
  alternative_readings:
  - 변함없는 사랑
  - 자비
  - 인애
  rationale: 시편의 חסד는 단순한 감정이 아니라 반복되는 구원 행위로 나타나는 언약적 신실함을 포함하므로, 이를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 시편의 חסד/אֱמוּנָה 병행 구조
- issue: 하나님의 이름 표기
  chosen_reading: ‘야훼’로 표기합니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 יהוה를 직접 사용하므로, 신명 자체를 유지하는 것이 시의 고유한 신학적 강조를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
