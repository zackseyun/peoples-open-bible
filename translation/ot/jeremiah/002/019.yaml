  from: Your evil will discipline you[a], and your apostasies will reprove you. So know and see that it is evil and bitter for you to forsake Yahweh your God, and that my fear is not in you[c][b], declares the Lord GOD of hosts.
  to: Your evil will discipline you, and your apostasies will reprove you. So understand and see how evil and bitter it is to forsake Yahweh your God and have no fear of me, declares the Lord Yahweh of hosts.
