translation:
  text: 'He finished explaining all the rods. Then he told me, “Go and tell everyone to repent. They will
    live to God. The Lord took pity and sent me to give everyone an opportunity to repent. Some are unworthy
    because of their deeds.[a] But the Lord is patient. He wants those called through his Son to be saved.”[b]


    2. I said, “Sir, I hope everyone who hears this will repent. I am convinced that each person will
    recognize their own deeds, fear God and repent.”


    3. He answered, “Those who repent with their whole heart and cleanse themselves of their previously
    mentioned wickedness,[c] adding no more sins, will receive healing from the Lord for their former
    sins. They must not waver over these commandments. They will live to God. But those who add to their
    sins and live in this age’s desires will condemn themselves to death.”[d]


    4. “You must walk in my commandments and live to God. Everyone who walks in them and acts rightly
    will live to God.”[e]


    5. After showing and telling me all this, he said, “I will show you the rest in a few days.”[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: 'The working text says some are unworthy because of their deeds. Michigan also has a word meaning
      “to be saved” after unworthy, with damage in the surrounding wording. Alternative: “Although some
      are unworthy to be saved because of their deeds.” The Lord’s pity and the offer to everyone are
      kept together rather than making the invitation unconditional salvation.'
  - marker: b
    reason: lexical_alternative
    text: The Greek literally speaks of saving the calling that came through the Son. “Those called” expresses
      the people implied by that calling. It does not alter the stated agent or remove the Son. “Sir”
      in paragraph 2 addresses the shepherd, distinct from the Lord sending him.
  - marker: c
    reason: textual_variant
    text: '“Their previously mentioned wickedness” follows the bounded Athos/Michigan possessive auton.
      The1891 body conjectures pason, “all”; alternative: “Cleanse themselves of all the previously mentioned
      wickedness.” The possessive is outside restoration brackets in Michigan’s published text, Bonner
      printed p. 114, papyrus p. 54 line 14. The preceding “repent and” remains bracketed in the working
      edition; Michigan partly preserves the repentance verb and following conjunction, with missing letters.
      This is additional Greek evidence, not a full intact sentence.'
  - marker: d
    reason: textual_variant
    text: The self-condemnation warning is wholly bracketed in the 1891 working edition as a version-supported
      insertion absent from Athos. Michigan now partly preserves corresponding Greek, Bonner printed p.
      115; some line edges and intervening letters are supplied, and one line is particularly damaged.
      The warning is retained with that limited Greek support. Without it, the paragraph ends with “They
      will live to God.” The whole-heart, no-added-sins and no-wavering conditions remain explicit.
  - marker: e
    reason: textual_variant
    text: 'The working edition brackets the first “to God” and the extension to everyone walking and acting
      rightly. Michigan partly preserves the extension absent from Athos, but does not have the first
      “to God” after live, as reported in Bonner printed p. 115. Shorter alternative: “But you, walk in
      my commandments and live. Everyone who walks in them and acts rightly will live to God.” The draft
      provisionally retains the first version-supported phrase while exposing its absence from the Greek
      witnesses; it does not call the whole bracketed span preserved papyrus ink.'
  - marker: f
    reason: textual_variant
    text: “And telling” is bracketed in the working Greek. Michigan has a gap of about twelve lines across
      the end of this section and most of the next opening, so cannot certify this complete closing sentence.
lexical_decisions:
- source_word: μετάνοια / διψυχεῖν
  chosen: repentance / waver
  alternatives:
  - turning back / be double-minded
  rationale: Keep the concrete change of deeds, conditions and warnings. Do not erase the difference between
    an opportunity to repent and its actual acceptance.
- source_word: κλῆσιν / αὐτῶν
  chosen: those called / their
  alternatives:
  - calling / all (printed conjecture)
  rationale: Express the calling’s implied people while preserving the Son; prefer the possessed wickedness
    in two Greek codices without losing the whole-heart condition.
