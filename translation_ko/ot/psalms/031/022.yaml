  chosen_reading: 견고한 성읍에서
  alternative_readings:
  - 포위된 성읍에서
  - 성채 같은 성읍에서
  - 견고한 성읍 안에서
  rationale: 히브리어 표현은 '포위된 도시'와 '방비된 도시'를 모두 가리킬 수 있어, 본문이 허용하는 안전/위기의 긴장을 과도하게 풀지 않도록 비교적 중립적인 '견고한 성읍'을 채택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
