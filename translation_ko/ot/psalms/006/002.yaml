id: PSA.6.2
reference: Psalms 6:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥/נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/002.yaml
  text: Be gracious to me, O Yahweh, for I am weak[a]; heal me, O Yahweh, for my bones are troubled[b].
  footnotes:
  - marker: a
    text: Or “languishing”; the Hebrew describes a state of wasting or feebleness.
    reason: lexical_alternative
  - marker: b
    text: Or “are dismayed” or “are alarmed.” The Hebrew portrays the psalmist’s bones as sharing his distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 저에게 은혜를 베풀어 주십시오. 제가 쇠약합니다.[a] 야훼여, 저를 고쳐 주십시오. 제 뼈들이 떨고 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 쇠진해 있습니다.’ 히브리어는 쇠약해지거나 기력이 소진된 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 뼈들이 괴로워하고 있습니다’ 또는 ‘제 뼈들이 놀라고 있습니다.’ ‘뼈들’은 깊은 육체적·내적 고통을 나타내는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: 직접 호소하는 기도 형식이므로 호격을 살려 ‘야훼여’로 옮겼습니다. 프로젝트 기본값인 야훼를 따르며, 문맥상 절박한 간구의 어조를 보존합니다.
- source_word: בְּאַפְּךָ
  english_pob_choice: in your anger
  chosen_korean: 주의 분노로
  alternatives_korean:
  - 주의 노여움 가운데
  - 주의 화 안에서
  lexicon: HALOT
  rationale: אַף는 관용적으로 ‘분노/노여움’을 뜻하므로 자연스러운 한국어로 풀었습니다. 전치사 בְּ의 관계는 문맥상 원인·상태를 아우르는 ‘~로’가 가장 간결합니다.
- source_word: תוֹכִיחֵנִי
  english_pob_choice: rebuke me
  chosen_korean: 저를 책망하지 마시고
  alternatives_korean:
  - 저를 꾸짖지 마시고
  - 저를 견책하지 마시고
  - 저를 질책하지 마시고
  lexicon: HALOT
  rationale: 히필형 יכח는 여기서 ‘책망하다/꾸짖다’의 의미가 강하므로, 공적이고 단호한 어감을 가진 ‘책망하다’를 택했습니다.
- source_word: בַּחֲמָתְךָ
  english_pob_choice: in your wrath
  chosen_korean: 주의 진노로
  alternatives_korean:
  - 주의 분노로
  - 주의 격노로
  - 주의 성내심으로
  lexicon: HALOT
  rationale: חֵמָה는 ‘맹렬한 분노, 진노’의 색채가 있어 첫 행의 ‘분노’와 구별되는 강도를 살리기 위해 ‘진노’로 옮겼습니다.
- source_word: תְיַסְּרֵנִי
  english_pob_choice: discipline me
  chosen_korean: 저를 징계하지 마십시오
  alternatives_korean:
  - 저를 훈계하지 마십시오
  - 저를 교정하지 마십시오
  - 저를 징벌하지 마십시오
  lexicon: HALOT
  rationale: יסר의 기본 의미는 ‘훈육하다/징계하다’로, 단순 처벌보다 교정의 뉘앙스를 담습니다. 한국어 성경어휘로는 ‘징계하다’가 가장 정확합니다.
theological_decisions:
- issue: 두 평행행의 분노 표현을 어떻게 구별할지
  chosen_reading: ‘분노’와 ‘진노’로 구별하여 번역했습니다.
  alternative_readings:
  - 둘 다 ‘분노’로 통일
  - 둘 다 ‘진노’로 통일
  rationale: 히브리어의 אַף와 חֵמָה는 서로 관련되지만 같은 단어는 아니므로, 시적 평행과 점층을 살리기 위해 한국어도 의미를 약간 달리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (consistency of key terms, or documented exception)
