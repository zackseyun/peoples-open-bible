translation:
  language: en
  text: Stay in the love of God[a] as you wait for the mercy of our Lord Jesus Christ—the mercy that leads to eternal life.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may mean God’s love for you or your love for God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: keep yourselves in the love of God
  simplified_phrase: Stay in the love of God
  preserved_meaning: Believers are directly commanded to remain within the love of God.
  reasoning_layer_used: Lexical decision for τηρήσατε and theological decision on ἀγάπῃ θεοῦ
  rationale: “Stay” gives the command naturally while leaving “the love of God” open to both documented senses.
- pob_phrase: waiting for
  simplified_phrase: as you wait for
  preserved_meaning: Waiting is an ongoing posture that accompanies the main command.
  reasoning_layer_used: Lexical decision for προσδεχόμενοι
  rationale: “As you wait” clearly connects the continuing expectation to the command.
- pob_phrase: unto eternal life
  simplified_phrase: the mercy that leads to eternal life
  preserved_meaning: The Lord’s mercy has eternal life as its goal or result.
  reasoning_layer_used: Lexical decision for εἰς ζωὴν αἰώνιον
  rationale: “Leads to” replaces the archaic “unto” and makes the forward movement clear.
interpretive_expansions:
- pob_phrase: unto eternal life
  rendering: the mercy that leads to eternal life
  claim: The phrase presents eternal life as the goal or result of the awaited mercy.
  evidence:
  - The lexical rationale says εἰς marks goal or result.
  - The approved lexical choice explicitly gives “that leads to eternal life.”
  confidence: high
  alternatives_preserved:
  - for eternal life
  - unto eternal life
translation_notes:
  risk_flags:
  - risk: Readers may take “the love of God” in only one direction.
    mitigation: The footnote preserves both God’s love for believers and believers’ love for God.
