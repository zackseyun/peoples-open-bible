  - severity: medium
    issue: λέγει를 과거형 ‘말씀하셨습니다’로 번역함
    rationale: SBLGNT 본문은 현재형 λέγει이며, 영어 POB도 ‘Jesus says’로 이를 유지합니다. 한국어도 ‘말씀하십니다’로 서술 현재를 반영할 수 있습니다.
  - severity: low
    issue: ‘풀어 주어 가게 하십시오’의 연결 표현
    rationale: 의미는 전달되지만, 두 명령을 병렬적으로 나타내는 ‘풀어 주고 가게 하십시오’가 더 자연스럽고 명료합니다.
