  to: The LORD reigns; he is clothed with majesty; the LORD is clothed with strength; he has girded himself. Indeed, the world is established; it will not be moved.
  rationale: 'Reordered the middle clause to reflect the Hebrew more closely: ''clothed with strength; he has girded himself'' instead of ''is clothed and has girded himself with strength.'' This preserves both verbs and attaches ''with strength'' more naturally to ''clothed.'''
