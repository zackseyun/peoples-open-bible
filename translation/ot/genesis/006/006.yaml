id: GEN.6.6
reference: Genesis 6:6
source:
  edition: WLC
  text: וַ/יִּנָּ֣חֶם יְהוָ֔ה כִּֽי עָשָׂ֥ה אֶת הָֽ/אָדָ֖ם בָּ/אָ֑רֶץ וַ/יִּתְעַצֵּ֖ב אֶל לִבּֽ/וֹ־־־׃
translation:
  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'humankind' or 'humanity.' Hebrew 'adam' here refers collectively to the human race.
    reason: lexical_alternative
  - marker: b
    text: Or 'was sorry that he had made' or 'grieved over having made.' The Hebrew נחם (Niphal) expresses regret or sorrow over a prior action; it does not by itself say that God was surprised, lacked foreknowledge, or committed a moral error.
    reason: lexical_alternative
  - marker: c
    text: Or 'to his heart'.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּנָּחֶם
  chosen: regretted
  alternatives:
  - was sorry
  - grieved over
  - relented
  - repented
  lexicon: HALOT
  rationale: In the Niphal followed by a כִּי content clause naming a prior action, נחם here expresses retrospective regret or sorrow. 'Regretted' best preserves that evaluative force. The separate following verb וַיִּתְעַצֵּב carries the emotional pain, so using 'grieved' for both ideas would blur the Hebrew's two distinct verbs. 'Regretted' does not itself assert that Yahweh learned new information or made a moral mistake; those are interpretive questions rather than lexical content. 'Relented' fits judgment-withdrawal contexts (Exod 32:14; Jonah 3:10), not sorrow over the prior act of creation.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  rationale: Follows the project's default rendering for the divine name YHWH per DOCTRINE.md.
- source_word: כִּי
  chosen: that
  alternatives:
  - because
  lexicon: HALOT
  rationale: Here כִּי introduces the content/cause of the regret. With the verb rendered as 'regretted,' the clause is absorbed into a gerund construction ('regretted having made…'), which reads naturally while preserving the content relation.
- source_word: עָשָׂה
  chosen: had made
  alternatives:
  - made
  - had done
  lexicon: HALOT
  rationale: Refers to God's prior act of creating humanity. With 'regretted having made,' the gerund 'made' inside the gerund construction 'having made' carries the same temporal force as the past perfect.
- source_word: הָאָדָם
  chosen: man
  alternatives:
  - humankind
  - the man
  - humanity
  lexicon: HALOT
  rationale: אָדָם here is collective for the human race, not the individual Adam alone. Per the project's gender-accurate policy, 'man' can represent humanity in English when the source has representative force. 'Humankind' is possible, but 'made man on the earth' preserves the cadence and traditional collective sense.
- source_word: בָּאָרֶץ
  chosen: on the earth
  alternatives:
  - in the earth
  - in the land
  lexicon: HALOT
  rationale: In Genesis this commonly refers to the earth/world rather than a specific land. 'On the earth' is the most natural English rendering here.
- source_word: וַיִּתְעַצֵּב
  chosen: was pained
  alternatives:
  - was grieved
  - was hurt
  - was wounded
  - was saddened
  lexicon: HALOT
  rationale: The Hitpael of עצב conveys an inward wound — pain rather than mere sadness. 'Was pained' captures the wound-like force of the verb and remains distinct from the preceding retrospective regret. Together the pair preserves the Hebrew's two-beat structure (regret → inward pain).
- source_word: אֶל־לִבּוֹ
  lemma: אֶל
  chosen: to his heart
  alternatives:
  - in his heart
  - at his heart
  lexicon: HALOT
  rationale: The Hebrew preposition אֶל is literally 'to,' and the phrase conveys inward, profound grief. 'To his heart' preserves the Hebrew imagery more closely than the smoother but less literal 'in his heart.'
