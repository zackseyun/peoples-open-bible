  meaning: The oppressor who humiliated others will himself drink Yahweh’s cup and suffer exposure and disgrace instead of glory.
  meaning_decisions:
  - source_phrase: שָׂבַעְתָּ קָלוֹן מִכָּבוֹד
    prior_rendering: You have had your fill of shame instead of glory
    new_rendering: You will have your fill of shame instead of glory
    rationale: In the context of the approaching cup of judgment, the Hebrew perfect announces the coming reversal as certain; the English future makes its temporal sense clear.
  - source_phrase: וְהֵעָרֵל
    prior_rendering: show your uncircumcision
    new_rendering: expose your uncircumcision
    rationale: '''Expose'' makes the humiliating bodily exposure clear and preserves its connection with the nakedness imposed on others in verse 15.'
  - source_phrase: כּוֹס יְמִין יְהוָה
    prior_rendering: The cup from the LORD’s right hand
    new_rendering: The cup in Yahweh’s right hand
    rationale: The divine name follows the standing ruling, and 'in' presents the cup held in Yahweh’s right hand before it passes to the offender.
  - source_phrase: וְקִיקָלוֹן עַל כְּבוֹדֶךָ
    prior_rendering: and utter disgrace will be upon your glory
    new_rendering: and utter disgrace will fall upon your glory
    rationale: The supplied verb gives the impending disgrace its force in natural English while retaining the collision between disgrace and glory.
  footnote_kinds:
    a: textual_variant
  history_weighed: The automated revert carries little weight, so I prefer the first draft’s 'expose' and 'in Yahweh’s right hand' where they convey the scene more clearly. I retain the later reviewed disclosure of the alternative 'stagger' reading, shortened to the manuscript difference relevant to translation.
