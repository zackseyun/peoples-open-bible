  from: It is not the great who are wise, nor the old who understand judgment[a].
  to: The great[a] are not always wise, nor do the old always discern what is right.
  rationale: The later correction from “the many” to “the great” is retained, while the well-supported age-based reading is acknowledged in a note. The previous preference for broad “judgment” is weighed against the immediate dispute, where “discern what is right” communicates its judicial and moral force more clearly.
