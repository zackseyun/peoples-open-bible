  category: meaning_retranslation
  from: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
  to: For he recognizes deceitful people; when he sees wickedness, does he not take notice[a]?
  rationale: The documented rhetorical reading fits Zophar's insistence that wrongdoing does not escape God's notice, so it remains in the main text. The revised note presents the stronger contextual alternative to that reading rather than an unexplained claim that God does not notice evil.
