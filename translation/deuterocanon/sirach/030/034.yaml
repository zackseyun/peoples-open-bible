  category: meaning_retranslation
  from: Put him to work while he is a child[a], and you will find rest; let his hands go idle[b], and he will seek freedom.
  to: Put your servant to work, and you will find rest; let his hands go idle, and he will seek freedom.
  rationale: The earlier lexical decision interpreted the phrase temporally as childhood, but the uninterrupted servant context weighs against that reading. I also drop the note that narrowed freedom to mere lack of discipline, since escape from bondage is relevant here.
