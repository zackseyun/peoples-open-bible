  category: source_correction
  tier: 1
  from: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
  to: And when the Pharisees saw it[a], they said to his disciples, “Why does your teacher eat with tax collectors and sinners?”
  rationale: While ἔλεγον is morphologically imperfect, verbs of speaking that introduce direct discourse in Greek narrative frequently use the imperfect tense to set the stage for the quote, rather than to indicate continuous or repeated action. Translating it as 'they were saying' feels slightly unnatural in English for a single quoted question; 'they said' or 'they asked' is more idiomatic and standard for optimal equivalence.
