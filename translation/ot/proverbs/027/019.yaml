id: PRO.27.19
reference: Proverbs 27:19
source:
  edition: WLC
  text: כַּ֭/מַּיִם הַ/פָּנִ֣ים לַ/פָּנִ֑ים כֵּ֤ן לֵֽב הָ֝/אָדָ֗ם לָ/אָדָֽם־׃
translation:
  text: As a face is reflected in water, so a person’s heart reflects the person[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “so one person’s heart responds to another’s”; the Hebrew comparison is elliptical.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּמַּיִם
  chosen: As water
  alternatives:
  - Like water
  lexicon: HALOT
  rationale: The prefixed כ marks comparison, introducing a proverb simile. 'As water' fits natural English parallelism and preserves the comparative structure.
- source_word: הַפָּנִים לַפָּנִים
  chosen: a face is reflected in water
  alternatives:
  - the face to the face
  - faces answer to faces
  - face corresponds to face
  lexicon: HALOT
  rationale: The water setting supplies the visual-reflection sense; the passive form makes the image idiomatic in English.
- source_word: כֵּן
  chosen: so
  alternatives:
  - thus
  - in the same way
  lexicon: HALOT
  rationale: 'Standard correlative with the opening simile: ''as ... so ...''.'
- source_word: לֵב
  chosen: the heart
  alternatives:
  - heart
  - inner self
  - mind
  lexicon: HALOT
  rationale: Hebrew לֵב commonly denotes the inner person, including thought and disposition. 'Heart' is the standard and most transparent rendering in wisdom literature.
- source_word: הָאָדָם
  chosen: of man
  alternatives:
  - of a man
  - of humankind
  - of the human
  lexicon: HALOT
  rationale: With the article, the noun can be generic, but the proverb's parallelism favors a representative singular. Per doctrine, gender-accurate rendering is preferred where the source uses masculine/generic force; 'man' preserves that form.
- source_word: לָאָדָם
  chosen: reflects man
  alternatives:
  - to man
  - to a man
  - to humankind
  - corresponds to man
  lexicon: HALOT
  rationale: 'The preposition ל here is best taken in a relational/comparative sense within the proverb''s parallelism. Supplying ''reflects'' in the second colon mirrors the first colon''s implied verb and yields a coherent sense: a person''s heart reveals or reflects the person.'
- source_word: לֵב הָאָדָם לָאָדָם
  chosen: a person’s heart reflects the person
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This provides natural English for the elliptical correspondence without suppressing the alternative interpersonal construal, which is noted.
