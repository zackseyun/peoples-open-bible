  - severity: medium
    issue: 인용된 야곱의 명령에 존대 명령형이 사용됨
    rationale: ‘나를 장사하십시오’는 야곱이 요셉을 높이는 말처럼 들립니다. 원문은 요셉에게 주는 명령이므로 ‘너는 … 장사하여라’가 더 적절합니다.
