  text: Τῆς ἁγίας πόλεως κατοικουμένης μετὰ πάσης εἰρήνης, καὶ τῶν νόμων ὅτι κάλλιστα συντηρουμένων διὰ τὴν Ὀνίου τοῦ ἀρχιερέως
  language: Greek
  pages:
