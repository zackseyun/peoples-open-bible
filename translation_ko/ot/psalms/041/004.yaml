    rationale: 원문은 ‘나는 말하였다’ 뒤에 야훼를 향한 2인칭 명령형 간구와 1인칭 죄 고백이 이어집니다. 초안은 3인칭 서술과 2인칭 전환을 포함하나, 원문의 구조가 아닙니다.
  - severity: medium
    issue: 각주가 다른 절의 어휘를 설명함
    rationale: 현 각주는 הָפַכְתָּ 및 병상 관용구를 다루지만, 이 절의 관련 어휘는 נַפְשִׁי입니다. 본문 수정에 맞추어 각주도 교체해야 합니다.
