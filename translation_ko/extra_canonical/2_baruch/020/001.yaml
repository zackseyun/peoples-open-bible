  yaml_path: translation/extra_canonical/2_baruch/020/001.yaml
  text: Therefore, behold, days are coming when the times will hasten more than the former ones, and the seasons will pass more swiftly than those that have gone by, and the years will move faster than the present years.
translation:
  language: ko
  text: 그러므로 보십시오. 때가 이전의 때보다 더 빨리 지나가고, 계절이 지나간 계절보다 더 빨리 지나가며, 해가 현재의 해보다 더 빨리 흘러갈 날들이 올 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Therefore, behold
  english_pob_choice: Therefore, behold
  chosen_korean: 그러므로, 보십시오
  alternatives_korean:
  - 그러므로, 보라
  - 그리하여, 보십시오
  lexicon: 관용 접속/호출
  rationale: 따름말 ‘그러므로’와 주의를 끄는 ‘보십시오’를 살려서, 원문의 전환과 경고적 호소를 함께 드러냈습니다.
- source_word: days are coming
  english_pob_choice: days are coming
  chosen_korean: 날들이 올 것입니다
  alternatives_korean:
  - 날들이 다가올 것입니다
  - 날이 올 것입니다
  lexicon: 날
  rationale: 복수적 시간 감각을 살리기 위해 ‘날들이’로 옮겼고, 예언적 미래형은 합쇼체로 처리했습니다.
- source_word: times / seasons / years
  english_pob_choice: times / seasons / years
  chosen_korean: 때 / 계절 / 해
  alternatives_korean:
  - 시기 / 절기 / 연수
  - 때 / 시절 / 해
  lexicon: 시간 어휘
  rationale: 세 개의 서로 다른 시간 단위를 구분해, 원문의 점층적 비교를 한국어에서도 유지했습니다.
- source_word: will hasten / will pass more swiftly / will move faster
  english_pob_choice: will hasten / will pass more swiftly / will move faster
  chosen_korean: 더 빨리 지나가고 / 더 빠르게 흐르며 / 더 빨리 움직이는
  alternatives_korean:
  - 더 급히 지나가고 / 더 속히 흘러 / 더 빨리 달리는
  lexicon: 속도 표현
  rationale: 서로 다른 동사를 유지해 반복을 단조롭게 만들지 않고, 시간의 가속감을 점층적으로 살렸습니다.
theological_decisions:
- issue: 예언적 시간 가속의 표현
  chosen_reading: 미래에 닥칠 역사적 시간의 가속을 문자적으로 진술하는 예언으로 옮겼습니다.
  alternative_readings:
  - 종말론적 압축으로 풀어 쓰기
  - 상징적으로만 번역하기
  rationale: 원문은 시간 자체가 더 빨리 움직인다고 말하며, 이를 약화하지 않고 그대로 드러내는 것이 source-direct합니다.
  doctrine_reference: 종말론적 서술의 직설성 유지
