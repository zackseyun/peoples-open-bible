id: ISA.27.9
reference: Isaiah 27:9
source:
  edition: WLC
  text: לָ/כֵ֗ן בְּ/זֹאת֙ יְכֻפַּ֣ר עֲוֺֽן יַעֲקֹ֔ב וְ/זֶ֕ה כָּל פְּרִ֖י הָסִ֣ר חַטָּאת֑/וֹ בְּ/שׂוּמ֣/וֹ כָּל אַבְנֵ֣י מִזְבֵּ֗חַ כְּ/אַבְנֵי גִר֙ מְנֻפָּצ֔וֹת לֹֽא יָקֻ֥מוּ אֲשֵׁרִ֖ים וְ/חַמָּנִֽים־־׀־־־׃
translation:
  text: 'Therefore Jacob’s guilt will be atoned for by this, and this will be the full fruit of his sin’s removal: when he makes all the stones of the idolatrous altars like crushed chalkstones, no Asherah poles[a] or incense altars will remain standing.'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Asherah poles were wooden cult objects associated with the goddess Asherah.
    reason: cultural_note
