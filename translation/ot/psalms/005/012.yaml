id: PSA.5.12
reference: Psalms 5:12
source:
  edition: WLC
  text: כִּֽי אַתָּה֮ תְּבָרֵ֪ךְ צַ֫דִּ֥יק יְהוָ֑ה כַּ֝/צִּנָּ֗ה רָצ֥וֹן תַּעְטְרֶֽ/נּוּ־׃
translation:
  text: For you bless the righteous, O Yahweh; you surround them with favor as with a shield[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “you crown them with favor like a shield.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - Surely
  - Because
  lexicon: HALOT
  rationale: Introduces the ground or basis for the preceding petition/confidence. 'For' best preserves the causal/explanatory force in context.
- source_word: תְּבָרֵךְ
  chosen: bless
  alternatives:
  - will bless
  - do bless
  lexicon: HALOT
  rationale: The imperfect here expresses characteristic or assured divine action. English simple present fits the psalm's statement of confidence better than an explicitly future rendering, while preserving the verbal sense.
- source_word: צַדִּיק
  chosen: the righteous
  alternatives:
  - a righteous man
  - the just
  lexicon: HALOT
  rationale: The singular adjective functions substantivally for a representative righteous person/class. 'The righteous' preserves the generic singular without awkwardness and avoids narrowing to one individual.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Follows the project's default rendering for the divine name, preserving covenantal reference while matching established English Bible convention.
- source_word: כַּצִּנָּה
  chosen: like a shield
  alternatives:
  - as with a shield
  - like a large shield
  lexicon: HALOT
  rationale: The prefixed כ marks comparison. צִנָּה denotes a shield, often a large shield; 'like a shield' is clear and natural, while the more specific 'large shield' is possible but not necessary in the main text.
- source_word: רָצוֹן
  chosen: with favor
  alternatives:
  - goodwill
  - acceptance
  - favor
  lexicon: HALOT
  rationale: 'The noun expresses Yahweh''s goodwill toward the righteous. In this clause it functions as what surrounds him: ''with favor.'''
- source_word: תַּעְטְרֶנּוּ
  chosen: you surround him
  alternatives:
  - crowns him
  - encircles him
  - surrounds him
  lexicon: HALOT
  rationale: 'The verb is second-person masculine singular with a third-person suffix: ''you surround him.'' The shield image favors protective encirclement; ''crown him'' remains possible.'
