  to: And who knows whether he will be wise or foolish? Yet he will have control over all that I labored for and applied wisdom to under the sun. This too is vapor.
  rationale: The latest audit correctly limited the object to the results of the speaker's labor and retained the wisdom applied to that work; both gains stand. “Have control over” clarifies the contextual force of dominion, while “vapor” follows the image preserved elsewhere in the chapter.
