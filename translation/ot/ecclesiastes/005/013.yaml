id: ECC.5.13
reference: Ecclesiastes 5:13
source:
  edition: WLC
  text: וְ/אָבַ֛ד הָ/עֹ֥שֶׁר הַ/ה֖וּא בְּ/עִנְיַ֣ן רָ֑ע וְ/הוֹלִ֣יד בֵּ֔ן וְ/אֵ֥ין בְּ/יָד֖/וֹ מְאֽוּמָה׃
translation:
  text: That wealth was lost through misfortune. He had fathered a son, but was left empty-handed[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “but his son had nothing.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָבַד
  chosen: was lost
  alternatives:
  - perished
  - was destroyed
  - vanished
  lexicon: HALOT
  rationale: Qal perfect 3ms of אבד here takes הָעֹשֶׁר as subject; passive-like English ('was lost') is natural and preserves the result without overstating agency.
- source_word: הָעֹשֶׁר הַהוּא
  chosen: that wealth
  alternatives:
  - those riches
  - that riches
  lexicon: HALOT
  rationale: עֹשֶׁר denotes wealth/riches. 'That wealth' reflects the article + demonstrative and reads naturally in English.
- source_word: בְּעִנְיַן רָע
  chosen: through a harmful affair
  alternatives:
  - through a bad business matter
  - in an evil circumstance
  - through a grievous affair
  lexicon: HALOT
  rationale: This avoids narrowing the phrase to a financial venture or recasting it specifically as a turn of events, while preserving its causal role.
- source_word: וְהוֹלִיד
  chosen: he fathered
  alternatives:
  - he begot
  - he became the father of
  lexicon: HALOT
  rationale: Hiphil of ילד commonly means to beget/father. 'Fathered' is idiomatic modern English and preserves the male subject.
- source_word: בֵּן
  chosen: a son
  alternatives:
  - a child
  lexicon: HALOT
  rationale: The Hebrew specifically says 'son,' not a gender-neutral child. This follows the gender-accurate principle.
- source_word: וְאֵין בְּיָדוֹ מְאוּמָה
  chosen: and had nothing in his hand
  alternatives:
  - and there was nothing in his hand
  - and he had nothing at all
  lexicon: HALOT
  rationale: The idiom literally says 'there is nothing in his hand,' meaning he possesses nothing. 'Had nothing in his hand' keeps the concrete Hebrew image while remaining readable.
