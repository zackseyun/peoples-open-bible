  text: May he dwell before God forever[a]; appoint steadfast love and faithfulness[b] to guard him.
  footnotes:
  - marker: a
    text: Or “May he sit before God forever.” The verb can mean “sit,” “remain,” or “dwell.”
    reason: lexical_alternative
  - marker: b
    text: Or “truth.” In the Hebrew pair “steadfast love and faithfulness,” the second term emphasizes reliability or fidelity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 하나님 앞에서 영원히 왕위에 앉게 하소서.[a] 주께서 한결같은 사랑과 진실을 정하셔서 그를 지키게 하소서.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 하나님 앞에서 영원히 머물게 하소서.’ 히브리어 동사는 ‘앉다’, ‘머물다’, ‘살다’를 뜻할 수 있으며, 왕에 관한 이 문맥에서는 왕위에 앉는다는 뉘앙스가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진실’은 여기서 ‘신실함’ 또는 ‘믿음직함’으로도 옮길 수 있습니다. ‘한결같은 사랑과 진실’은 하나님의 변함없는 사랑과 신실함을 나타내는 익숙한 히브리어 표현입니다.
    reason: lexical_alternative
