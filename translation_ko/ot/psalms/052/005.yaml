  terminology: בָלַע의 ‘삼키다/파멸시키다’라는 심상은 본문에서 ‘파멸의 말’로 옮겼습니다. 이는 영어 POB의 ‘words of destruction’과도 부합하며, ‘간사한’은 מִרְמָה(속임, 기만)를 자연스럽게 반영합니다.
  issues:
  - severity: high
    issue: 본문이 지정된 히브리어 원문이 아니라 시편 52:3의 내용으로 번역되어 있습니다.
    rationale: 현 번역의 ‘악을 선보다 더 사랑하고 / 거짓을 의를 말함보다 더 사랑합니다. 셀라’는 제공된 시편 52:5 원문에 없는 어휘와 셀라를 포함합니다. 제공된 원문은 ‘모든 파멸의 말’과 ‘간사한 혀’를 말합니다.
