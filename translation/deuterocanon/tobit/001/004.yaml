  meaning: While Tobit was young in Israel, his ancestral tribe abandoned Jerusalem's sanctuary despite Jerusalem's election as the place of sacrifice and the temple's enduring consecration.
  meaning_decisions:
  - source_phrase: τοῦ Νεφθαλεὶμ τοῦ πατρός μου
    prior_rendering: of my father Naphtali
    new_rendering: of my ancestor Naphtali
    rationale: Naphtali is Tobit's tribal ancestor, not his immediate father, who is named Tobiel in verse 1.
  - source_phrase: ἀπέστη ἀπὸ τοῦ οἴκου Ἱεροσολύμων
    prior_rendering: fell away from the house of Jerusalem
    new_rendering: turned away from the sanctuary in Jerusalem
    rationale: The context concerns abandonment of Jerusalem worship; 'house of Jerusalem' could misleadingly suggest a household or dynasty.
  - source_phrase: τῆς ἐκλεγείσης ἀπὸ πασῶν τῶν φυλῶν Ἰσραὴλ εἰς τὸ θυσιάζειν πάσαις ταῖς φυλαῖς
    prior_rendering: which had been chosen from all the tribes of Israel for all the tribes to sacrifice there
    new_rendering: Jerusalem had been chosen from among all the tribes of Israel as the place where all the tribes were to offer sacrifices
    rationale: Naming Jerusalem as the subject makes the city's election and its purpose explicit without leaving the relative clause attached ambiguously to 'house.'
  - source_phrase: ἡγιάσθη ... καὶ ᾠκοδομήθη
    prior_rendering: was consecrated and built
    new_rendering: had been built and consecrated
    rationale: The temple's establishment is background to the tribe's later defection, not a new event following it; the reordered verbs avoid suggesting consecration preceded construction.
  footnote_kinds:
    a: textual_variant
