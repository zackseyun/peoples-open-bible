  attribution_note: Stored Greek is not verified against byztxt v2.0.3 csv-unicode/accents/no-variants. This does not establish absence from every RP print edition or apparatus.
  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
translation:
  text: They said this to trap him, so that they would have grounds to accuse him. But Jesus bent down and wrote on the ground with his finger, paying no attention to them.
  philosophy: dynamic
lexical_decisions:
- source_word: πειράζω
  chosen: to test
  alternatives:
  - to tempt
  - to trap
  lexicon: BDAG
  rationale: While often translated as 'tempt,' in this context the scribes and Pharisees are attempting to trap Jesus in a legal and theological dilemma, making 'test' the most accurate rendering of their malicious intent.
- source_word: κατηγορία
  chosen: accusation
  alternatives:
  - charge
  - complaint
  lexicon: BDAG
  rationale: Refers to a formal legal charge or accusation, fitting the context of the Mosaic law they had just cited to him.
- source_word: προσποιέομαι
  chosen: paying no attention
  alternatives:
  - as though he did not hear
  - ignoring them
  lexicon: BDAG
  rationale: The participle with the negative particle (μὴ) indicates acting as if one does not notice or hear something. 'Paying no attention' captures this deliberate ignoring naturally in English.
