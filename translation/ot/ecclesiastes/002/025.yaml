id: ECC.2.25
reference: Ecclesiastes 2:25
source:
  edition: WLC
  text: כִּ֣י מִ֥י יֹאכַ֛ל וּ/מִ֥י יָח֖וּשׁ ח֥וּץ מִמֶּֽ/נִּי׃
translation:
  text: For who can eat and enjoy more than I[a][b]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “who can eat, and who can enjoy, apart from me?” The first-person wording is understood here as a comparison with the speaker's exceptional experience of pleasure.
    reason: lexical_alternative
  - marker: b
    text: Some ancient witnesses read “apart from him,” referring to God.
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - For/because
  lexicon: HALOT
  rationale: Introduces the rationale for the preceding statement. 'For' best preserves the explanatory force in natural English.
- source_word: מִי
  chosen: who
  alternatives:
  - what person
  lexicon: HALOT
  rationale: Interrogative pronoun introducing a rhetorical question; 'who' is the natural English equivalent.
- source_word: יֹאכַל
  chosen: can eat
  alternatives:
  - eats
  - may eat
  lexicon: HALOT
  rationale: Though formally an imperfect 'will eat/can eat,' in this rhetorical context it expresses possibility or capacity. 'Can eat' fits the sense of ability/privilege in context.
- source_word: וּמִי
  chosen: and who
  alternatives:
  - or who
  lexicon: HALOT
  rationale: Simple conjunction plus interrogative. 'And who' preserves the parallel structure of the Hebrew.
- source_word: יָחוּשׁ
  chosen: can enjoy
  alternatives:
  - can hasten
  - can feel
  - can have enjoyment
  lexicon: HALOT
  rationale: This verb is difficult and has been understood variously. In the context of eating and enjoyment in Ecclesiastes 2:24–26, the sense 'enjoy' or 'experience pleasure' best fits the discourse. The more literal possibilities ('hasten,' 'feel') are less coherent here and are preserved in a footnote.
- source_word: חוּץ
  chosen: apart from
  alternatives:
  - outside
  - except
  lexicon: HALOT
  rationale: With the following preposition/pronominal suffix, the phrase means 'apart from' or 'except for/from.' 'Apart from' is idiomatic and clear in English.
- source_word: מִמֶּנִּי
  chosen: me
  alternatives:
  - me
  lexicon: HALOT
  rationale: The first-person suffix is the reading of the supplied WLC text; the third-person alternative belongs in a textual note.
