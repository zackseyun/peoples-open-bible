id: JOB.34.19
reference: Job 34:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֤ר לֹֽא נָשָׂ֨א פְּנֵ֥י שָׂרִ֗ים וְ/לֹ֣א נִכַּר שׁ֭וֹעַ לִ/פְנֵי דָ֑ל כִּֽי מַעֲשֵׂ֖ה יָדָ֣י/ו כֻּלָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/019.yaml
  text: who shows no partiality to princes and does not regard the rich above the poor, for all of them are the work of his hands.
translation:
  language: ko
  text: 그는 고관들에게 편파를 보이지 않으시며, 가난한 이보다 부유한 이를 더 높이 여기지 않으십니다. 그들 모두가 그의 손으로 지으신 것들이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא פְּנֵי
  english_pob_choice: shows no partiality
  chosen_korean: 편파를 보이지 않으시고
  alternatives_korean:
  - 사람을 차별하지 않으시고
  - 얼굴을 들어주지 않으시고
  lexicon: נָשָׂא פָּנִים
  rationale: 히브리어 관용구는 ‘편파를 보이다/차별하다’의 뜻이므로, 법정적·사회적 불공정을 드러내는 한국어로 간결하게 옮겼습니다.
- source_word: שָׂרִים
  english_pob_choice: princes
  chosen_korean: 고관들
  alternatives_korean:
  - 통치자들
  - 왕자들
  lexicon: שַׂר
  rationale: 문맥상 왕족보다 권세 있는 상류 관료층을 가리키므로, 현대 한국어에서 신분·권력을 드러내는 ‘고관들’이 적절합니다.
- source_word: שׁוֹעַ / דָל
  english_pob_choice: the rich above the poor
  chosen_korean: 가난한 사람보다 부유한 사람을 더 대하지도 않으십니다
  alternatives_korean:
  - 가난한 사람을 제쳐 두고 부유한 사람을 더 높이지도 않으십니다
  - 가난한 자보다 부자를 더 인정하지도 않으십니다
  lexicon: שׁוֹעַ / דָל
  rationale: POB의 ‘regard ... above’는 단순한 감정이 아니라 우선시함을 뜻하므로, ‘더 대하다’로 관계적 우대의 뉘앙스를 살렸습니다.
- source_word: מַעֲשֵׂה יָדָיו
  english_pob_choice: the work of his hands
  chosen_korean: 그의 손이 지으신 것들
  alternatives_korean:
  - 그의 손으로 만드신 것들
  - 그가 손수 지으신 일들
  lexicon: מַעֲשֵׂה יָדָיו
  rationale: 창조주-피조물 대비를 살리기 위해 ‘만드신 것들’보다 ‘지으신 것들’이 더 자연스럽고 엄숙합니다.
theological_decisions:
- issue: 하나님의 공정성의 표현
  chosen_reading: 하나님은 지위나 부유함에 따라 사람을 달리 대하지 않으십니다.
  alternative_readings:
  - 하나님은 사람을 차별하지 않으십니다.
  - 하나님은 왕후장상의 편을 들지 않으십니다.
  rationale: 본문의 요지는 신분과 재산에 대한 무편파성이며, 이를 현대 한국어로 명료하게 드러내되 원문의 범위를 넘지 않도록 했습니다.
  doctrine_reference: 하나님의 공의와 무편파성
- issue: ‘their hands’의 단수/복수 지시
  chosen_reading: 그의 손이 지으신 것들
  alternative_readings:
  - 그의 손으로 지으신 것들
  - 그들의 손으로 지은 것들
  rationale: 히브리어는 ‘그의 손들/손’로 하나님을 가리키며, 한국어에서는 자연스러운 단수 인칭으로 재현하는 것이 문맥상 가장 분명합니다.
  doctrine_reference: 창조주 하나님
