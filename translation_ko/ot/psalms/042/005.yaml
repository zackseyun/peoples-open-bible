  - 기쁜 외침과 감사의 소리
  lexicon: HALOT
  rationale: קוֹל의 ‘소리’와 רִנָּה의 기쁨의 외침, תּוֹדָה의 감사를 자연스러운 한국어 어순으로 유지했습니다.
- source_word: הָמוֹן חוֹגֵג
  english_pob_choice: a festal multitude
  chosen_korean: 곧 명절을 지키는 큰 무리
  alternatives_korean:
