translation:
  language: ko
  text: 나를 내 죄악에서 철저히 씻어 주시고[a][b], 내 죄에서 나를 정결하게 해 주십시오.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘풍성히’ 또는 ‘거듭하여’. 히브리어 강조 부사는 씻음의 풍성함 또는 철저함을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘죄악’은 ‘죄책’ 또는 ‘그릇됨’으로도 옮길 수 있습니다. 히브리어 עָוֹן은 행위 자체와 그에 따른 죄책을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 죄에서 나를 깨끗하게 해 주십시오’ 또는 ‘나를 내 죄에서 정결하게 하십시오’. 히브리어 동사는 정결 의례와 도덕적 깨끗함의 의미를 함께 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  english_pob_choice: Be gracious to me
  chosen_korean: 은혜를 베푸소서
  alternatives_korean:
  - 저를 불쌍히 여기소서
  - 저에게 은혜를 보여 주십시오
  - 저에게 자비를 베푸소서
  lexicon: HALOT
  rationale: חנן의 핵심은 호의와 은혜를 구하는 청원이며, 여기서는 뒤의 רחמים(긍휼)과 구별되도록 ‘불쌍히 여기소서’보다 ‘은혜를 베푸소서’가 더 적합합니다.
- source_word: כְּחַסְדֶּךָ
  english_pob_choice: according to your steadfast love
  chosen_korean: 주의 변함없는 사랑에 따라
  alternatives_korean:
  - 주의 인애에 따라
  - 주의 언약적 사랑에 따라
  - 주의 신실한 사랑에 따라
  lexicon: HALOT
  rationale: חסד는 언약적 충성, 자비, 사랑을 아우르므로 한국어에서는 교회 전통어를 기계적으로 따르기보다 의미를 드러내는 ‘변함없는 사랑’으로 옮겼습니다.
- source_word: כְּרֹב רַחֲמֶיךָ
  english_pob_choice: according to your abundant mercies
  chosen_korean: 주의 풍성한 긍휼에 따라
  alternatives_korean:
  - 주의 많은 긍휼에 따라
  - 주의 크신 자비에 따라
  - 주의 한없는 자비에 따라
  lexicon: HALOT
  rationale: רַחֲמִים의 복수성과 רֹב의 풍성함을 함께 살리기 위해 ‘풍성한 긍휼’로 옮겼습니다. ‘긍휼’은 חסד와 구별되는 깊은 연민의 뉘앙스를 유지합니다.
- source_word: מְחֵה
  english_pob_choice: blot out
  chosen_korean: 지워 주십시오
  alternatives_korean:
  - 말소해 주십시오
  - 지워 없애 주십시오
  - 도말해 주십시오
  lexicon: HALOT
  rationale: מחה는 지우다, 말소하다, 없애다의 뜻이므로, 죄책을 기록에서 삭제하는 이미지가 자연스럽게 드러나는 ‘지워 주십시오’를 택했습니다.
- source_word: פְשָׁעָי
  english_pob_choice: my transgressions
  chosen_korean: 내 허물
  alternatives_korean:
  - 내 범죄
  - 내 죄과
  - 내 반역
  lexicon: HALOT
  rationale: פשע는 반역적 위반을 뜻하지만, 회개의 시편 문맥에서는 한국어로 지나치게 법률화하기보다 관계 파괴를 드러내는 ‘허물’이 자연스럽습니다.
theological_decisions:
- issue: חסד와 רחמים의 병렬을 한국어에서 어떻게 구별할지
  chosen_reading: ‘변함없는 사랑’과 ‘풍성한 긍휼’로 구별하여 번역했습니다.
  alternative_readings:
  - 두 항목 모두 ‘자비’로 번역
  - 두 항목 모두 ‘사랑’으로 번역
  rationale: 히브리어는 유사하지만 동일하지 않은 은혜의 어휘를 병렬로 쌓아 올립니다. 한국어에서도 이를 하나의 단어로 평준화하지 않고, 각각의 결을 살려 시적 긴장과 신학적 풍성함을 유지했습니다.
  doctrine_reference: Translation philosophy items 1 and 5
