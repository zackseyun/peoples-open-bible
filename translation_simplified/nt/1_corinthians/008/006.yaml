  - and we for his sake
- pob_phrase: and we through him
  rendering: and we too exist through him
  claim: Believers’ existence is mediated through Jesus, without excluding the broader senses of life or salvation.
  evidence:
  - The POB lexical rationale identifies existence, life, or salvation as possible implied senses.
  - The parallel clause supports “exist” as a readable completion.
  confidence: moderate
  alternatives_preserved:
  - and we have life through him
  - and we are saved through him
