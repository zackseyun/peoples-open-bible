id: PSA.12.2
reference: Psalms 12:2
source:
  edition: WLC
  text: שָׁ֤וְא יְֽדַבְּרוּ֮ אִ֤ישׁ אֶת רֵ֫עֵ֥/הוּ שְׂפַ֥ת חֲלָק֑וֹת בְּ/לֵ֖ב וָ/לֵ֣ב יְדַבֵּֽרוּ׀־׃
translation:
  text: They speak falsehood to one another; they speak with flattering lips and duplicity in their hearts[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “with a heart and a heart,” an idiom for saying one thing while intending another.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  chosen: falsehood
  alternatives:
  - falsehood
  - vanity
  - lies
  lexicon: HALOT
  rationale: With דבר in this denunciation of deceitful social speech, “falsehood” gives the relevant sense naturally.
- source_word: יְדַבְּרוּ
  chosen: they speak
  alternatives:
  - they say
  lexicon: HALOT
  rationale: The Piel of דבר is the standard verb 'to speak.' 'They speak' is the most direct rendering and preserves the repeated verbal cadence in the verse.
- source_word: אִישׁ
  chosen: each man
  alternatives:
  - everyone
  - each one
  lexicon: HALOT
  rationale: The Hebrew is singular אִישׁ used distributively. Per the gender-accurate policy, 'each man' best reflects the source form and representative force without flattening it into a gender-neutral abstraction.
- source_word: רֵעֵהוּ
  chosen: his neighbor
  alternatives:
  - his companion
  - his friend
  lexicon: HALOT
  rationale: רֵעַ commonly means neighbor, companion, or associate. 'Neighbor' is idiomatic, broad, and preserves the interpersonal/social dimension of the psalm's complaint.
- source_word: שְׂפַת חֲלָקוֹת
  chosen: with flattering lips
  alternatives:
  - with smooth lips
  - with slippery lips
  lexicon: HALOT
  rationale: The construct phrase literally means 'a lip of smooth things/smoothness.' In English, 'flattering lips' best conveys the metaphorical sense of smooth, deceptive speech while remaining natural.
- source_word: בְּלֵב וָלֵב
  chosen: with duplicity in their hearts
  alternatives:
  - with a heart and a heart
  - with a divided heart
  - double-mindedly
  lexicon: HALOT
  rationale: This translates the idiom’s sense naturally while the note retains its concrete Hebrew wording.
- source_word: יְדַבֵּרוּ
  chosen: they speak
  alternatives:
  - they talk
  lexicon: HALOT
  rationale: Repeating 'they speak' mirrors the Hebrew repetition and reinforces the poetic structure and emphasis on corrupt speech.
