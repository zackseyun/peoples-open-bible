id: EZK.43.13
reference: Ezekiel 43:13
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה מִדּ֤וֹת הַ/מִּזְבֵּ֨חַ֙ בָּֽ/אַמּ֔וֹת אַמָּ֥ה אַמָּ֖ה וָ/טֹ֑פַח וְ/חֵ֨יק הָ/אַמָּ֜ה וְ/אַמָּה רֹ֗חַב וּ/גְבוּלָ֨/הּ אֶל שְׂפָתָ֤/הּ סָבִיב֙ זֶ֣רֶת הָ/אֶחָ֔ד וְ/זֶ֖ה גַּ֥ב הַ/מִּזְבֵּֽחַ־־׃
translation:
  text: 'These are the measurements of the altar in cubits, each cubit being a standard cubit plus a handbreadth[a]: the gutter[b] is one cubit deep and one cubit wide, with a rim of one handspan around its edge. This forms the base of the altar[c].'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The long cubit was about 21 inches (53 cm); a handbreadth was about 3 inches (7.5 cm), and a handspan about 9 inches (23 cm).
    reason: cultural_note
  - marker: b
    text: Alternatively, ‘the base is one cubit high.’ The precise form of this lower feature is uncertain.
    reason: alternative_reading
  - marker: c
    text: Alternatively, ‘This is the height of the altar,’ introducing the dimensions that follow.
    reason: alternative_reading
lexical_decisions:
- source_word: מִדּוֹת
  chosen: measurements
  alternatives:
  - dimensions
  lexicon: HALOT
  rationale: The noun refers to measured specifications. 'Measurements' is natural modern English and fits the technical architectural context.
- source_word: בָּאַמּוֹת אַמָּה אַמָּה וָטֹפַח
  chosen: in cubits (the cubit being a cubit and a handbreadth)
  alternatives:
  - by cubits, each cubit a cubit and a handbreadth
  - in cubits, each cubit measuring a cubit and a handbreadth
  lexicon: HALOT
  rationale: 'The phrase explains the unit of measure used here: a long cubit consisting of a standard cubit plus a handbreadth. The parenthetical rendering preserves the explanatory force while remaining readable.'
- source_word: חֵיק
  chosen: gutter
  alternatives:
  - base
  - bosom
  - trench
  lexicon: HALOT
  rationale: In this altar-description context, the term denotes the recessed lower area or surrounding trench-like base feature of the altar structure, not a figurative 'bosom.' 'Gutter' best captures the architectural sense here and aligns with the following dimensions.
- source_word: רֹחַב
  chosen: width
  alternatives:
  - broad
  lexicon: HALOT
  rationale: Standard dimensional term in construction descriptions; 'width' is the clear English equivalent.
- source_word: גְּבוּלָהּ
  chosen: border
  alternatives:
  - rim
  - ledge
  - edge
  lexicon: HALOT
  rationale: The word denotes a boundary edge or enclosing margin. 'Border' works well with the following phrase 'on its rim all around,' distinguishing the feature from the lip itself.
- source_word: שְׂפָתָהּ
  chosen: rim
  alternatives:
  - lip
  - edge
  lexicon: HALOT
  rationale: Literally 'lip,' but in English architectural description 'rim' is more idiomatic for the edge of a structure.
- source_word: זֶרֶת
  chosen: span
  alternatives:
  - handspan
  lexicon: HALOT
  rationale: A small unit of measure, commonly rendered 'span.' 'Handspan' is slightly more explicit, but 'span' is standard and concise.
- source_word: גַּב
  chosen: base
  alternatives:
  - height
  - back
  - elevation
  lexicon: HALOT
  rationale: In this context the term refers to the raised foundation or back-structure of the altar's lower section. 'Base' best fits the immediate architectural description and the sequence of measurements.
- source_word: הַמִּזְבֵּחַ
  chosen: altar
  lexicon: HALOT
  rationale: Standard rendering for the sacrificial structure described in the temple vision.
