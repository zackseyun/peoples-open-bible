id: GEN.8.21
reference: Genesis 8:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: ko
  text: 야훼께서 그 기분 좋은 향기를 맡으시고, 야훼께서 마음속으로 말씀하셨습니다. “내가 다시는 사람 때문에 땅을 저주하지 않겠습니다. 사람 마음의 뜻은 어릴 때부터 악하기 때문입니다. 또 내가 다시는 내가 한 것처럼 모든 생명 있는 것을 치지 않겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 본문의 신명칭을 프로젝트 기본값대로 음역해, 영어 POB의 LORD를 단순히 경건어로 완화하지 않고 원문 식별성을 유지했습니다.
- source_word: אֶת רֵיחַ הַנִּיחֹחַ
  english_pob_choice: the pleasing aroma
  chosen_korean: 그 향기로운 냄새
  alternatives_korean:
  - 기쁘게 하는 향기
  - 향기로운 제물의 냄새
  lexicon: רֵיחַ / נִיחֹחַ
  rationale: ‘נִיחֹחַ’의 수용되는 향기라는 뉘앙스를 살리되, 제사문맥의 관용구를 과도하게 신학화하지 않고 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וַיֹּאמֶר יְהוָה אֶל לִבּוֹ
  english_pob_choice: the LORD said to himself
  chosen_korean: 야훼께서 스스로 말씀하셨습니다
  alternatives_korean:
  - 야훼께서 마음속으로 말씀하셨습니다
  - 야훼께서 자기 자신에게 말씀하셨습니다
  lexicon: אֶל לִבּוֹ
  rationale: 직역상 ‘그의 마음에’이지만, 영어 POB의 해석을 따라 자가 대화를 분명히 하면서도 한국어로는 자연스러운 ‘스스로 말씀하셨습니다’로 표현했습니다.
- source_word: יֵצֶר לֵב הָאָדָם
  english_pob_choice: the intention of man’s heart
  chosen_korean: 사람의 마음의 의도
  alternatives_korean:
  - 사람 마음의 성향
  - 사람의 마음의 계획
  lexicon: יֵצֶר / לֵב
  rationale: POB가 ‘inclination’보다 ‘intention’을 채택한 해석을 반영해, 인간 내면의 형성된 의도라는 뜻을 살리면서도 ‘마음’과의 연결을 유지했습니다.
- source_word: בַּעֲבוּר הָאָדָם ... מִנְּעֻרָיו
  english_pob_choice: because of man ... from his youth
  chosen_korean: 사람 때문에 ... 어릴 때부터
  alternatives_korean:
  - 사람 때문에 ... 젊은 시절부터
  - 사람을 위해 ... 소년기부터
  lexicon: בַּעֲבוּר / מִנְּעֻרָיו
  rationale: 원인의 접속과 출생/성장 초기의 시점을 간결하게 살려, 보편적 인간 조건에 대한 진술을 현대 한국어로 매끄럽게 옮겼습니다.
theological_decisions:
- issue: 하나님의 자기 진술 방식
  chosen_reading: ‘스스로 말씀하셨습니다’로 옮겨, 하나님이 자신의 뜻을 내적 독백 형식으로 확정하시는 장면을 분명히 했습니다.
  alternative_readings:
  - ‘마음속으로 말씀하셨습니다’
  - ‘자기에게 말씀하셨습니다’
  rationale: 본절은 외부 청중에게 한 선포가 아니라 신적 결심의 서술이므로, ‘마음’의 심리적 이미지를 유지하면서도 주권적 결심의 성격을 드러내는 번역이 필요합니다.
  doctrine_reference: 창세기 8장 문맥의 언약 전환 및 신적 불변 결심
- issue: ‘모든 살아 있는 것’을 치는 행위
  chosen_reading: ‘쳐서 멸하지 않겠습니다’로 번역해, 포괄적 심판 행위의 강도를 유지했습니다.
  alternative_readings:
  - ‘죽이지 않겠습니다’
  - ‘멸망시키지 않겠습니다’
  rationale: 히브리어 ‘הכות’는 단순한 타격보다 재앙적 심판을 포함할 수 있어, 문맥상 보존된 생명에 대한 전면적 파괴 금지를 드러내는 표현이 적절합니다.
  doctrine_reference: 홍수 심판 이후의 보편적 재심판 보류
