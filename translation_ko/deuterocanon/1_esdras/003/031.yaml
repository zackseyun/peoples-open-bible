revisions:
- from: 그가 치라 하면, 그들은 칩니다. 그가 황폐하게 하라 하면, 그들은 황폐하게 합니다. 그가 건축하라 하면, 그들은 건축합니다.
  to: 그가 “치라”고 말하자, 그들은 칩니다. 그가 “황폐하게 하라”고 말하자, 그들은 황폐하게 합니다. 그가 “지으라”고 말하자, 그들은 짓습니다.
  rationale: 원문의 ‘εἶπε + 부정사, 현재형 동사’라는 세 차례의 병렬을 ‘…라고 말하자, 그들은 …합니다’로 유지했습니다. ‘명령하다’나 ‘복종하다’를 보태지 않았고, 말과 수행의 긴밀한 연속은 한국어의 ‘말하자’로만 드러냈습니다. 파괴와 건립의 대조 및 반복적 리듬도 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:03:52Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 반복은 ‘그가 말하였다/말하자’와 그에 뒤따르는 수행을 병렬로 제시합니다. 초안의 ‘그가 … 하면’은 조건을 나타내어, 과거의 발화와 그 효력을 조건문으로 바꾸는 경향이 있습니다. ‘…라고 말하자’는 εἶπε의 완료된 발화와 이어지는 현재형 수행을 더 충실히 반영합니다.
  naturalness: ‘그가 “…하라”고 말하자, 그들은 …합니다’는 현대 표준 한국어에서 자연스럽고, 짧은 반복 구조와 합쇼체 문장 종결을 유지합니다. ‘건축하다’보다 ‘짓다’가 οἰκοδομέω의 넓은 기본 의미에 더 자연스럽게 대응합니다.
  terminology: πατάξαι/τύπτουσιν은 ‘치라/칩니다’로 간결하게 대응시킬 수 있습니다. ἐρημόω는 ‘황폐하게 하라/황폐하게 합니다’로 보존합니다. οἰκοδομέω는 본문에 ‘재건하다’라는 의미를 덧붙이지 않고 ‘지으라/짓습니다’로 옮깁니다.
  issues:
  - severity: medium
    issue: ‘그가 … 하면’이라는 조건문 처리
    rationale: εἶπε는 조건을 제시하는 말이 아니라 완료된 발화입니다. 조건문은 원문에 없는 조건성 또는 일반적 반복의 뉘앙스를 낳을 수 있습니다.
  - severity: low
    issue: ‘건축하다’의 과도한 구체성 및 문체적 경직성
    rationale: οἰκοδομέω의 기본 뜻은 ‘짓다/build’이며, 문맥이 건축물에 한정된다고 명시하지 않습니다. ‘짓다’가 더 넓고 자연스럽습니다.
  revised_text: 그가 “치라”고 말하자, 그들은 칩니다. 그가 “황폐하게 하라”고 말하자, 그들은 황폐하게 합니다. 그가 “지으라”고 말하자, 그들은 짓습니다.
