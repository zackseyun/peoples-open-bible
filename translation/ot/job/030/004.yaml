id: JOB.30.4
reference: Job 30:4
source:
  edition: WLC
  text: הַ/קֹּטְפִ֣ים מַלּ֣וּחַ עֲלֵי שִׂ֑יחַ וְ/שֹׁ֖רֶשׁ רְתָמִ֣ים לַ/חְמָֽ/ם־׃
translation:
  text: They pluck salt plants[a] among the bushes, and broom roots are their food.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The plant’s exact identity is uncertain; saltwort and mallow have been suggested.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּטְפִים
  chosen: who pluck
  alternatives:
  - who gather
  - who pick
  lexicon: HALOT
  rationale: The participle from קטף denotes plucking or picking off, especially vegetation. 'Pluck' preserves the concrete, somewhat desperate action better than the broader 'gather.' The relative sense 'who pluck' fits the continuation of the description from the previous verse.
- source_word: מַלּוּחַ
  chosen: salt plants
  alternatives:
  - mallow
  - salt herb
  lexicon: HALOT
  rationale: A generic rendering preserves the probable association with saline vegetation without asserting an uncertain species; the plural is idiomatic for plants gathered as food.
- source_word: עֲלֵי שִׂיחַ
  chosen: from among the bushes
  alternatives:
  - by the bushes
  - upon shrubs
  lexicon: HALOT
  rationale: The preposition על in this idiom likely indicates location in relation to scrub growth. 'From among the bushes' gives natural English while preserving the picture of foraging in scrubland. A more literal 'upon shrubs' would be awkward and less clear in English.
- source_word: וְשֹׁרֶשׁ רְתָמִים
  chosen: and broom roots
  alternatives:
  - and broom-root
  - and the roots of broom bushes
  lexicon: HALOT
  rationale: This naturally conveys the Hebrew collective expression and avoids the awkward singular phrase “the root of broom shrubs.”
- source_word: לַחְמָם
  chosen: is their food
  alternatives:
  - is their bread
  - serves as their food
  lexicon: HALOT
  rationale: Though לחם is literally 'bread,' it often extends to food in general. Here the sense is not baked bread but sustenance. 'Is their food' communicates the idiomatic meaning clearly in modern English while retaining the stark note of survival.
