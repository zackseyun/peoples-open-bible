  rationale: 대상 원문의 כִּי는 앞 절의 진술을 뒷받침하는 말로 문맥상 별도 번역하지 않고 자연스럽게 연결했습니다. הֶחֱלִיק אֵלָיו בְּעֵינָיו는 자기 평가 안에서 자신을 매끄럽게 꾸미거나 아첨하는 행위로, ‘자기 눈에 자신을 좋게 보이게 하여’로 옮겼습니다. 마지막 두 부정사는 원문의 난해함을 각주에 밝혀 두면서, 널리 인정되는 결과적 의미인 죄의 발견과 미움이 저해됨을 본문에 반영했습니다.
