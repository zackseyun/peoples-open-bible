translation:
  language: ko
  text: 그들은 또한 자기들의 병기에 맞설 병기[a]를 만들었고, 여러 날 동안 싸웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공성기들’ 혹은 ‘기계들’로 옮길 수 있습니다. 이 그리스어는 특히 공성전에서 사용된 군사적 기계를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηχανὰς
  english_pob_choice: engines
  chosen_korean: 기계들
  alternatives_korean:
  - 공성기들
  - 전쟁 기계들
  lexicon: LSJ
  rationale: 이 단어는 여기서 공성전에서 쓰는 군사 장비를 가리키므로, 너무 좁힌 ‘공성기들’보다 원문 범위를 살리는 ‘기계들’이 적절합니다. 다만 현대 한국어에서 자연스럽게 읽히도록 복수 표지를 유지했습니다.
- source_word: πρὸς
  english_pob_choice: against
  chosen_korean: 맞서는
  alternatives_korean:
  - 대항하는
  - against
  lexicon: LSJ
  rationale: 전투 문맥에서 πρὸς + 대격은 상호 대립을 나타내므로, ‘맞서는’이 관계를 분명히 드러내면서도 자연스럽습니다.
- source_word: ἐπολέμησαν
  english_pob_choice: they fought
  chosen_korean: 싸웠습니다
  alternatives_korean:
  - 전쟁을 벌였습니다
  - 전투했습니다
  lexicon: LSJ
  rationale: 동사의 핵심 의미는 실제 교전이므로, 현대 한국어에서 간결하고 직접적인 ‘싸웠습니다’가 가장 자연스럽습니다.
- source_word: ἡμέρας πολλάς
  english_pob_choice: for many days
  chosen_korean: 여러 날 동안
  alternatives_korean:
  - 많은 날 동안
  - 오랫동안
  lexicon: LSJ
  rationale: 기간의 대격은 한국어에서 보통 ‘동안’으로 풀어 주며, ‘여러 날 동안’이 원문의 기간 감각을 무리 없이 옮깁니다.
