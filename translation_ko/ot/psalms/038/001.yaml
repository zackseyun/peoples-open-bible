  alternative_readings:
  - 하나님께 기억나게 하시려고
  - 기념하기 위해
  rationale: 히브리어는 기억의 주체를 명시하지 않으므로, 번역에서 이를 특정하면 본문의 여백을 좁히게 됩니다. 표제의 예전적 기능은 살리되 주체는 열어 두는 것이 원문에 더 충실합니다.
  doctrine_reference: 시편 표제 해석의 문법적·예전적 기능
