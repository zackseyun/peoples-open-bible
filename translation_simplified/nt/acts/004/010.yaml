translation:
  language: en
  text: 'All of you, and all the people of Israel, must know this: this man stands before you in good health by the power of the name of Jesus Christ from Nazareth.[a] You crucified Jesus; God raised him from the dead.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may mean “through Jesus himself” or, more specifically, “through his name.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: let it be known to all of you and to all the people of Israel
  simplified_phrase: All of you, and all the people of Israel, must know this
  preserved_meaning: Peter makes a forceful public declaration to both the council and Israel.
  reasoning_layer_used: lexical decision for γνωστὸν ἔστω and the twofold audience
  rationale: The direct wording is easier to understand while retaining the declaration’s force and full audience.
- pob_phrase: in the name of Jesus the Messiah the Nazarene
  simplified_phrase: by the power of the name of Jesus the Messiah from Nazareth
  preserved_meaning: The healing occurred through Jesus’ effective agency while Messiah remains a title.
  reasoning_layer_used: lexical and theological decisions for ἐν τῷ ὀνόματι, Χριστοῦ, and Ναζωραίου
  rationale: The wording explains the name idiom and replaces the less familiar demonym with its geographic meaning.
- pob_phrase: whom you crucified, whom God raised from the dead—by this name this man stands before you healthy
  simplified_phrase: this man stands before you in good health ... You crucified Jesus; God raised him from the dead
  preserved_meaning: The man’s visible health, the audience’s guilt, God’s action, and Jesus’ resurrection all remain explicit.
  reasoning_layer_used: lexical decisions for παρέστηκεν, ὑγιής, crucifixion, and resurrection
  rationale: Reordering the clauses removes the dense chain of relative clauses without weakening Peter’s accusation.
interpretive_expansions:
- pob_phrase: in the name of ... by this name
  rendering: by the power of the name
  claim: Jesus’ name represents the effective agency or power by which the man is well.
  evidence:
  - The POB lexical rationale says the phrase expresses effective agency or power.
  - The repeated instrumental phrases connect Jesus directly with the man’s restored health.
  confidence: high
  alternatives_preserved:
  - through Jesus himself
  - through his name
translation_notes:
  risk_flags:
  - risk: “By the power of the name” could be misunderstood as treating the name like a magical formula.
    mitigation: The wording identifies Jesus as the agent, and the footnote preserves the possible reference to Jesus himself.
