lexical_decisions:
- source_word: וְלֹא עָשׂוּ חֶסֶד
  english_pob_choice: did not show kindness
  chosen_korean: 친절을 베풀지 않았습니다
  alternatives_korean:
  - 은혜를 베풀지 않았습니다
  - 자비를 보이지 않았습니다
  - 호의를 베풀지 않았습니다
  lexicon: חֶסֶד
  rationale: חֶסֶד는 단순한 친절보다 언약적 호의까지 포함할 수 있으나, 이 절에서는 보답하지 않은 태도를 말하므로 ‘친절을 베풀다’가 영어 POB의 의미를 자연스럽게 살리면서도 과잉신학화하지 않습니다.
- source_word: בֵּית יְרֻבַּעַל גִּדְעוֹן
  english_pob_choice: the house of Jerubbaal (that is, Gideon)
  chosen_korean: 여룹바알의 집 — 곧 기드온에게 —
  alternatives_korean:
  - 여룹바알의 집(곧 기드온)의
  - 여룹바알 곧 기드온의 집
  - 기드온, 곧 여룹바알의 집
  lexicon: בַּיִת / 고유명사 표기
  rationale: ‘집’은 가문/가족을 뜻하는 집합적 표현이므로 그대로 살렸고, English POB의 동격 설명을 따라 ‘곧 기드온’으로 주석적 동격을 표시했습니다.
- source_word: כְּכָל הַטּוֹבָה אֲשֶׁר עָשָׂה
  english_pob_choice: in keeping with all the good that he had done
  chosen_korean: 그가 한 모든 선한 일에 맞갖게
  alternatives_korean:
  - 그가 행한 모든 선한 일에 따라
  - 그가 이룬 모든 선한 일에 맞게
  - 그가 베푼 모든 선한 일에 비추어
  lexicon: כְּ / כָּל / הַטּוֹבָה
  rationale: 직역적 ‘모든 선함’보다 결과적 평가를 드러내는 ‘모든 선한 일’이 한국어에서 더 자연스럽고, ‘in keeping with’는 상응 관계를 나타내므로 ‘맞갖게’로 옮겼습니다.
theological_decisions:
- issue: 여룹바알과 기드온의 동일인 지시
  chosen_reading: 여룹바알을 설명적으로 기드온과 동일시해, 본문이 같은 인물을 두 이름으로 가리킨다는 점을 드러냈습니다.
  alternative_readings:
  - 여룹바알의 집(즉, 기드온)의
  - 여룹바알 곧 기드온의 집의
  rationale: 히브리어 본문은 ‘여룹바알’과 ‘기드온’을 병기하여 동일 인물을 가리키므로, 독자가 가계와 인물을 함께 이해하도록 동격 설명을 유지했습니다.
  doctrine_reference: 본문 역사 서술의 인물 동일시
