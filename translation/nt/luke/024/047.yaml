id: LUK.24.47
reference: Luke 24:47
source:
  edition: SBLGNT
  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
translation:
  text: and that reorientation toward God[c] for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'and forgiveness of sins'; the Greek may be taken as two coordinated elements of the message proclaimed.
    reason: alternative_reading
  - marker: b
    text: Or 'to all nations.' The Greek term can also mean 'Gentiles' in some contexts.
    reason: lexical_alternative
  - marker: c
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  chosen: should be proclaimed
  alternatives:
  - be preached
  - be heralded
  lexicon: BDAG
  rationale: Aorist passive infinitive dependent on the preceding scriptural-fulfillment context ('that ... should be proclaimed'). 'Proclaimed' is clear modern English and preserves the public-announcement sense without restricting the action to formal preaching settings.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  chosen: in his name
  alternatives:
  - on the basis of his name
  - upon his name
  lexicon: BDAG
  rationale: The idiom with ἐπί + dative and 'name' here denotes authorization/grounding in the person and authority of Jesus. 'In his name' is the most natural English equivalent and preserves the theological force.
- source_word: μετάνοιαν
  chosen: a reorientation toward God
  alternatives:
  - a change of mind
  - a call to repentance
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
- source_word: καὶ ἄφεσιν ἁμαρτιῶν
  chosen: for the forgiveness of sins
  alternatives:
  - and forgiveness of sins
  - for release from sins
  lexicon: BDAG
  rationale: ἄφεσις commonly means release, pardon, or forgiveness. Here 'forgiveness of sins' is the established and contextually precise sense. Rendering the phrase as 'repentance for the forgiveness of sins' reflects the close relation of the two accusatives under the infinitive and communicates the message being proclaimed.
- source_word: εἰς πάντα τὰ ἔθνη
  chosen: to all the nations
  alternatives:
  - to all nations
  - among all the nations
  - to all the Gentiles
  lexicon: BDAG
  rationale: ἔθνη can mean nations or Gentiles. In this resurrection-commission context, the scope is universal peoples, not merely a Jew/Gentile contrast, so 'all the nations' best preserves the wording and allusive force of worldwide mission.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  chosen: beginning from Jerusalem
  alternatives:
  - starting from Jerusalem
  - beginning at Jerusalem
  lexicon: BDAG
  rationale: The participle is attendant to the commission and indicates the starting point of the proclamation. 'Beginning from Jerusalem' is natural English and preserves the directional nuance of ἀπό.
