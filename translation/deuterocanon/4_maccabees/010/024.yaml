  meaning: The martyr condemns the tyrant’s hatred of virtue and humanity and asks what wrongdoing could justify his abuse of them.
  meaning_decisions:
  - source_phrase: μισάρετε
    prior_rendering: hateful
    new_rendering: You who hate virtue
    rationale: The compound means a hater of virtue, not merely someone hateful; this specific accusation connects with the martyr’s defense of virtue in the surrounding verses.
  - source_phrase: μισάνθρωπε
    prior_rendering: misanthropic man
    new_rendering: and humanity
    rationale: Under the shared wording 'You who hate,' this conveys hatred of humankind directly and preserves the force of the accusation without an academic-sounding adjective.
  - source_phrase: τί δρῶντες ἡμᾶς τοῦτον προθεῖς τὸν τρόπον
    prior_rendering: what are you doing by exposing us in this way?
    new_rendering: what have we done that you subject us to such abuse?
    rationale: 'The plural participle δρῶντες concerns the victims’ conduct, not the singular tyrant’s actions: the question challenges what they have done to warrant this treatment. In the torture context, ''subject us to such abuse'' makes the hostile treatment clear.'
