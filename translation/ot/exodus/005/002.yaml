  from: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
  to: Pharaoh said, “Who is Yahweh, that I should obey him and let Israel go? I do not know Yahweh, nor will I let Israel go.”
  rationale: I retain the earlier choice “I do not know Yahweh” rather than narrowing it to “I do not acknowledge Yahweh,” preserving both Pharaoh’s ignorance and his refusal of recognition. The wording also preserves the knowledge motif that develops through the ensuing confrontation.
