  naturalness: ‘제게 평화롭게 지내던 사람’은 현대 표준 한국어에서 자연스럽고, ‘악으로 갚았거나’는 גמל의 상호적 보응 의미를 잘 전달합니다. ‘아무 까닭 없이 제 원수를 구해 주었다면’은 조건적 맹세의 미완 종결(대시)과 잘 어울립니다.
