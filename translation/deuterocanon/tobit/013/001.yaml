    reference: TOB 13:1
translation:
  text: 'Then Tobit wrote a prayer of rejoicing and said: “Blessed is God who lives forever, and blessed is his kingdom[a]!'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “and his kingdom endures forever”; the final Greek phrase leaves its predicate unstated.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγραφεν
  chosen: wrote
  alternatives:
  - composed
  - recorded
  lexicon: LSJ
  rationale: The imperfect of γράφω here introduces the written prayer. 'Wrote' is the most direct rendering; 'composed' is possible but adds literary nuance not required by the Greek.
- source_word: προσευχὴν
  chosen: a prayer
  alternatives:
  - prayer
  lexicon: LSJ
  rationale: Straightforward rendering of the accusative object. The indefinite article fits natural English.
- source_word: εἰς ἀγαλλίασιν
  chosen: of rejoicing
  alternatives:
  - for rejoicing
  - with exultation
  lexicon: LSJ
  rationale: The phrase modifies the kind or character of the prayer. 'Of rejoicing' preserves the celebratory sense without over-paraphrasing. 'With exultation' is possible but slightly more interpretive.
- source_word: Εὐλογητὸς
  chosen: Blessed
  alternatives:
  - Praised
  - Blessed be
  lexicon: LSJ
  rationale: Standard doxological rendering. 'Blessed' preserves the liturgical force and matches biblical English usage.
- source_word: ὁ θεὸς ὁ ζῶν
  chosen: the living God
  alternatives:
  - God who lives
  - the God who lives
  lexicon: LSJ
  rationale: This is a conventional biblical expression. 'The living God' is both natural and faithful to the Greek attributive construction.
- source_word: εἰς τοὺς αἰῶνας
  chosen: forever
  alternatives:
  - for the ages
  - unto the ages
  lexicon: LSJ
  rationale: Idiomatic English for the Greek expression of enduring duration. 'Forever' is clear and suitably elevated.
- source_word: βασιλεία
  chosen: kingdom
  alternatives:
  - reign
  - kingship
  lexicon: LSJ
  rationale: '''Kingdom'' is the default rendering and fits the doxological context. ''Reign'' is possible, but ''kingdom'' better preserves the nominal form and biblical resonance.'
