  source_fidelity: 조건절 εἰ ἐγνώκειτέ με와 귀결절 ἂν ᾔδειτε는 잘 반영되었습니다. 다만 후반부의 γινώσκετε와 ἑωράκατε는 같은 청자에게 이어지는 두 서술이므로, 한국어에서도 접속을 더 직접적으로 처리하는 편이 원문의 병렬을 충실히 드러냅니다.
  naturalness: 초안의 ‘알고 있으며, 그분을 보았습니다’도 이해되지만, ‘-며’가 뒤의 완료 서술에 종속·부연되는 인상을 줄 수 있습니다. ‘알고, … 보았습니다’가 현대 표준어 합쇼체에서 더 간결하고 자연스럽습니다.
  terminology: ‘내 아버지’는 원문의 직접적인 관계 호칭을 보존하며, ‘그분’은 한국어 성경 문맥에서 아버지를 가리키는 자연스러운 존칭 대명사입니다. 별도의 교리적 해석을 더하지 않습니다.
