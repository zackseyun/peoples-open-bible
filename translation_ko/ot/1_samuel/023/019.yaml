base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
  footnotes:
  - marker: a
    text: Or “in Horesh,” taking the term as a place name rather than “in the wooded area.”
    reason: alternative_reading
  - marker: b
    text: Literally “to the right of the Jeshimon”; in Hebrew geographical usage this likely means “south of the Jeshimon.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 십 사람들[a]이 기브아의 사울에게 올라가 말했습니다. 「다윗이 우리와 함께 호레스 숲의 요새들, 곧 여시몬 오른쪽에 있는 하길라 산[b]에 숨어 있지 않습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “호레쉬에”, 이 단어를 “숲”이 아니라 지명으로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 직역은 “여시몬의 오른쪽에”이며, 지리적 용례에서는 “여시몬의 남쪽에”를 뜻할 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 갔습니다
  - 올라왔습니다
  lexicon: HALOT
  rationale: עלה의 기본 이동 이미지를 살려, 사울에게 ‘올라갔다’는 지리적 방향성과 문맥을 자연스럽게 담았습니다.
- source_word: זִפִים
  english_pob_choice: the Ziphites
  chosen_korean: 십 사람들
  alternatives_korean:
  - 십 족속
  - 지프 사람들
  lexicon: HALOT
  rationale: 히브리어 지명 זִיף의 거주민 집단을 가리키므로, 한국어에서는 지명 음역보다 의미가 드러나는 ‘십 사람들’로 옮겼습니다.
- source_word: בַּחֹרְשָׁה
  english_pob_choice: in the wooded area
  chosen_korean: 호라에스의 들[or 숲]
  alternatives_korean:
  - 숲속에
  - 호레쉬
  lexicon: HALOT
  rationale: 본문은 일반 명사 ‘삼림/우거진 곳’으로도, 고유지명 ‘호레쉬’로도 읽힐 수 있어 본문에는 의미역을 두고 대안 읽기를 각주로 남겼습니다.
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  english_pob_choice: which is to the right of the Jeshimon
  chosen_korean: 여시몬의 오른쪽에 있는 곳
  alternatives_korean:
  - 여시몬의 남쪽에 있는 곳
  - 여시몬 오른편에 있는 곳
  lexicon: HALOT
  rationale: מִימִין의 문자적 의미인 ‘오른쪽’을 유지해 본문을 직접적으로 옮기고, 지리적 관례로서의 ‘남쪽’ 해석은 단정하지 않았습니다.
theological_decisions:
- issue: 지명 해석(בַּחֹרְשָׁה, מִימִין הַיְשִׁימוֹן)
  chosen_reading: 본문은 ‘오른쪽’과 ‘들/숲’의 직접 의미를 살리고, 대안 해석은 각주로 제시했습니다.
  alternative_readings:
  - 호레쉬(고유지명)
  - 여시몬의 남쪽
  rationale: 이 구절은 지형 묘사에 대한 번역 선택이 핵심이므로, 과도한 조정 없이 원문이 주는 표현을 유지하는 편이 독자에게 더 투명합니다.
  doctrine_reference: 본문 비평 및 지리 용어 처리 원칙
- issue: 직설화법 인용부의 등록
  chosen_reading: 인용문 안에서도 원문의 반문 형식을 유지해 보고성 발화의 긴박함을 살렸습니다.
  alternative_readings:
  - 완곡한 서술문으로 재진술
  rationale: 사울에게 전달된 정보의 의도적 설득력을 보존하기 위해 반문을 그대로 반영했습니다.
  doctrine_reference: 문맥 충실성 및 담화 구조 보존
