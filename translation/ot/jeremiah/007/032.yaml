id: JER.7.32
reference: Jeremiah 7:32
source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יֵאָמֵ֨ר ע֤וֹד הַ/תֹּ֨פֶת֙ וְ/גֵ֣יא בֶן הִנֹּ֔ם כִּ֖י אִם גֵּ֣יא הַ/הֲרֵגָ֑ה וְ/קָבְר֥וּ בְ/תֹ֖פֶת מֵ/אֵ֥ין מָקֽוֹם־־־־־׃
translation:
  text: Therefore, look, days are coming, declares Yahweh, when this place will no longer be called Topheth or the Valley of Ben-hinnom, but the Valley of Slaughter. They will bury the dead in Topheth because there will be no room elsewhere[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “they will bury in Topheth until there is no room left.”
    reason: alternative_reading
