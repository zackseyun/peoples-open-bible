theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Sense of אמת in covenantal parallelism
  chosen_reading: faithfulness
  alternative_readings:
  - truth
  rationale: The verse pairs חסד and אמת as covenant attributes that actively protect the psalmist. "Faithfulness" better conveys God's dependable covenant character in this context, while "truth" remains a viable lexical alternative preserved in a footnote.
