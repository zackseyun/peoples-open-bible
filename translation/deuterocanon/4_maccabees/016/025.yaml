translation:
  text: Moreover, they understood that after dying for God they would live in his presence[a], just as Abraham, Isaac, Jacob, and all the patriarchs do.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, 'they live for God'; literally, 'they live to God.'
