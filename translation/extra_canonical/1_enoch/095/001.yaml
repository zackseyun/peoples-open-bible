translation:
  text: Who will grant that my eyes become clouds of water, so that I may weep over you and shed tears like clouds
    of water, and rest from the sorrow of my heart?[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 'The selected Ethiopic repeats the water-cloud image. Literally the opening gives to my eyes that they
      become clouds of water; English recasts this as grant that my eyes become without adding a fountain. The weeping
      verb and tears noun are distinct: actual Dillmann1865 column658 supports both; column970 supports rest and
      cites95:1. Column1090 treats cloud as singular/collective, not an exact cloud count. Actual1907 grammar173–174
      and540–542 supports dependent subjunctives and placing a clause subject with the leading verb, with95:1 cited
      at542. Printed stars and raised apparatus references are edition marks, not lexical words or new manuscript
      evidence.'
