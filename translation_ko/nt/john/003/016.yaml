  source_fidelity: 원문의 핵심 구문은 대체로 잘 반영되었습니다. 그러나 μονογενῆ를 본문에서 ‘독생자’로 옮기면 현대 한국어에서 ‘유일성’보다 출생·발생의 뜻이 전면에 느껴질 수 있어, 원문의 어휘상 중심 의미를 더 직접적으로 드러내는 ‘유일한 아들’이 안전합니다. ὥστε의 사랑의 구체적 표현과 ἵνα의 목적도 문장 구조에서 분명히 드러내는 편이 좋습니다.
  naturalness: 초안은 합쇼체이며 전반적으로 자연스럽습니다. 다만 ‘주셨으니, 이는 … 하려 하심입니다’는 문어적이고 다소 경직되어 현대의 정중한 표준어 성경 문체로는 ‘곧 … 주셨습니다. 이는 … 하시려는 것입니다’가 더 매끄럽습니다.
  terminology: ‘영생’, ‘멸망’, ‘믿다’는 요한복음의 관용적 핵심 용어로 적절합니다. ‘독생자’는 전통 용어로 각주에 보존하되, 본문은 ‘유일한 아들’로 하여 μονογενής의 유일성·독특성의 의미를 명료하게 하는 것이 좋습니다. 현행 b 각주는 본문과 같은 ‘독생자’를 대안으로 제시하면서 ‘오직 독생자’라고 하여 대안의 관계가 불명확합니다.
