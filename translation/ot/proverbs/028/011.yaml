  from: A rich man is wise in his own eyes[a], but a poor man who has understanding searches him out.
  to: A rich man is wise in his own eyes, but a poor man of understanding examines him.
  rationale: The current “searches him out” can suggest locating the rich man rather than probing him. “Sees through him” gives a plausible contextual outcome, but it more strongly implies pretense or deception than חקר itself states. “Examines him” is natural English and retains the verb’s investigative force without resolving what the examination discovers.
