id: PSA.78.14
reference: Psalms 78:14
source:
  edition: WLC
  text: וַ/יַּנְחֵ֣/ם בֶּ/עָנָ֣ן יוֹמָ֑ם וְ/כָל הַ֝/לַּ֗יְלָה בְּ/א֣וֹר אֵֽשׁ־׃
translation:
  text: He led them by a cloud during the day, and all night by the light of fire.
  philosophy: dynamic
lexical_decisions:
- source_word: וַיַּנְחֵם
  chosen: He led them
  alternatives:
  - He guided them
  lexicon: HALOT
  rationale: From נחה in the Hiphil, with 3mp suffix, meaning to lead or guide. 'Led' is a natural, concise English rendering that preserves the concrete sense of divine direction in the wilderness; 'guided' is possible but slightly less direct.
- source_word: בֶּעָנָן
  chosen: by a cloud
  alternatives:
  - by a cloud
  - in a cloud
  lexicon: HALOT
  rationale: “By” naturally expresses the cloud's instrumental role in the guidance.
- source_word: יוֹמָם
  chosen: during the day
  alternatives:
  - in the daytime
  - during the day
  lexicon: HALOT
  rationale: Natural rendering of the temporal adverb.
- source_word: וְכָל הַלַּיְלָה
  chosen: and all night
  alternatives:
  - and all night
  - and through the whole night
  lexicon: HALOT
  rationale: Natural English that preserves the duration.
- source_word: בְּאוֹר אֵשׁ
  chosen: by the light of fire
  alternatives:
  - by the light of fire
  - with fiery light
  lexicon: HALOT
  rationale: Retains both nouns and naturally expresses the instrumental phrase.
