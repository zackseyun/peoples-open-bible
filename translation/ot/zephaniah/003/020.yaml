theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Idiomatic restoration formula שׁוּב שְׁבוּת
  chosen_reading: restore your fortunes
  alternative_readings:
  - restore your captivity
  - bring back your captives
  rationale: The Hebrew idiom can be rendered woodenly, but optimal equivalence favors the established idiomatic sense of comprehensive restoration. This avoids importing a narrower meaning while still fitting the exile-restoration context.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
