id: PSA.55.12
reference: Psalms 55:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לֹֽא אוֹיֵ֥ב יְחָֽרְפֵ֗/נִי וְ/אֶ֫שָּׂ֥א לֹֽא מְ֭שַׂנְאִ/י עָלַ֣/י הִגְדִּ֑יל וְ/אֶסָּתֵ֥ר מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/012.yaml
  text: For it is not an enemy who taunts me—then I could bear it[b]; it is not one who hates me who has exalted himself against me—then I could hide from him.[a]
  footnotes:
  - marker: a
    text: Or “has made himself great against me,” that is, “has acted arrogantly toward me.”
    reason: lexical_alternative
  - marker: b
    text: Or “reproaches me” or “reviles me.” The Hebrew verb denotes scornful verbal abuse.
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 모욕하는 이가 원수라면, 내가 그것을 견딜 수 있었을 것입니다. 나를 미워하는 자가 나를 대적하여 자신을 높이는 이라면, 내가 그에게서 숨을 수 있었을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַוּ֥וֹת
  english_pob_choice: Destruction
  chosen_korean: 파멸
  alternatives_korean:
  - 파괴
  - 멸망
  - 재앙
  - 악행
  lexicon: HALOT
  rationale: 복수형 명사가 도시 안에 가득한 파괴적 악을 가리키므로, 자연스러운 합쇼체 문맥에서는 집합적 단수로 ‘파멸’이 가장 잘 맞습니다.
- source_word: בְּקִרְבָּ֑הּ
  english_pob_choice: within her
  chosen_korean: 그 가운데에
  alternatives_korean:
  - 그 안에
  - 그 중심에
  - 그 한가운데에
  lexicon: HALOT
  rationale: 도시를 여성형으로 의인화한 표현이므로, 공간적 의미를 살리면서도 한국어에서 자연스러운 ‘그 가운데에’로 옮겼습니다.
- source_word: תֹּ֣ךְ וּ/מִרְמָֽה
  english_pob_choice: oppression and deceit
  chosen_korean: 압제와 속임수
  alternatives_korean:
  - 학대와 속임수
  - 억압과 기만
  - 압박과 사기
  lexicon: HALOT
  rationale: תֹּךְ는 사회적 억압·착취의 뉘앙스를 가지므로 ‘압제’로, מִרְמָה는 ‘속임수’로 옮겨 두 악을 짝지었습니다.
- source_word: מֵ֝/רְחֹבָ֗/הּ
  english_pob_choice: from her square
  chosen_korean: 그 광장에서
  alternatives_korean:
  - 그 거리에서
  - 그 거리들에서
  - 그 공터에서
  lexicon: HALOT
  rationale: רְחוֹב는 일반적인 ‘거리’보다 공적 열린 장소나 광장을 가리킬 수 있어, POB의 해석을 따라 ‘광장’으로 구체화했습니다.
theological_decisions:
- issue: 도시의 의인화 유지
  chosen_reading: 도시를 여성형 인칭대명사로 받아 ‘그 가운데에’, ‘그 광장’처럼 자연스럽게 유지했습니다.
  alternative_readings:
  - 도시 안에
  - 그 안에서
  rationale: 히브리어가 העיר를 여성으로 인칭화하므로, 이를 한국어에서 완전히 중성화하지 않고 공간성과 인격화가 함께 보이도록 처리했습니다.
  doctrine_reference: 시적 의인화 / 문학적 수사
