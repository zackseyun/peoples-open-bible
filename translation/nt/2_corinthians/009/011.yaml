  - sincerity
  - single-mindedness
  rationale: Although ἁπλότης can denote simplicity or sincerity in some contexts, the immediate context of financial provision and the resulting thanksgiving strongly favors generosity. This avoids importing a merely inward moral quality where Paul is emphasizing concrete liberality.
