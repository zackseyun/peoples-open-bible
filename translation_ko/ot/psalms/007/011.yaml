translation:
  language: ko
  text: 하나님은 의로우신 재판장이시며, 날마다 분노하시는 하나님이십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָגִנִּי
  english_pob_choice: My shield
  chosen_korean: 내 방패
  alternatives_korean:
  - 나의 보호
  - 나의 방어
  lexicon: HALOT
  rationale: 방패라는 구체적 이미지를 살려 시적 은유를 보존했습니다. 추상어로 바꾸면 מקור의 감각적 힘이 약해집니다.
- source_word: עַל אֱלֹהִים
  english_pob_choice: is with God
  chosen_korean: 하나님께 있습니다
  alternatives_korean:
  - 하나님 위에 있습니다
  - 하나님께 속해 있습니다
  lexicon: HALOT
  rationale: 히브리어는 동사가 생략된 압축된 구문이므로, 한국어에서는 자연스럽게 ‘~께 있습니다’로 옮겨 방패가 하나님 안/하나님께 의존해 있음을 나타냈습니다.
- source_word: מוֹשִׁיעַ
  english_pob_choice: who saves
  chosen_korean: 구원하시는 분이십니다
  alternatives_korean:
  - 구원하시는 이십니다
  - 구원자이십니다
  lexicon: HALOT
  rationale: 분사형의 지속적·서술적 성격을 살려 하나님의 특징적 행위를 나타내는 현재적 표현으로 옮겼습니다.
- source_word: יִשְׁרֵי לֵב
  english_pob_choice: the upright in heart
  chosen_korean: 마음이 바른 사람
  alternatives_korean:
  - 마음이 곧은 사람
  - 마음이 정직한 사람
  lexicon: HALOT
  rationale: יִשְׁרֵי는 도덕적으로 ‘곧다/바르다’는 뜻이므로, ‘마음이 바른 사람’이 가장 직접적입니다. ‘의인’은 어휘 범위를 넓혀 다른 신학적 뉘앙스를 덧씌울 수 있습니다.
theological_decisions:
- issue: 첫 절의 생략된 계사와 소유/의존 관계
  chosen_reading: ‘내 방패는 하나님께 있습니다’로 옮겨 방패의 근원이 하나님께 있음을 드러냈습니다.
  alternative_readings:
  - ‘하나님은 내 방패이십니다’
  - ‘내 방패는 하나님 위에 있습니다’
  rationale: 히브리어 압축을 그대로 드러내되 한국어에서 오해 없이 읽히도록 조정했습니다. 이렇게 하면 방패가 하나님께 의존한다는 뜻이 유지됩니다.
  doctrine_reference: Translation philosophy §1, §3, §6
