base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: pt
  text: que cada um de vocês saiba adquirir seu próprio vaso[a] em santidade e honra,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a interpretação da expressão grega, “seu próprio corpo” ou “sua própria esposa”. O termo traduzido por “vaso” também pode significar recipiente ou instrumento; o verbo “adquirir” pode, neste contexto, ser entendido como possuir ou manter sob controle.
    reason: A nota preserva a ambiguidade lexical e interpretativa de σκεῦος e κτᾶσθαι sem impor uma leitura específica ao texto principal.
lexical_decisions:
- source_word: εἰδέναι
  choice: saiba
  rationale: Expressa conhecimento prático — saber como agir — de maneira natural em português.
- source_word: ἕκαστον ὑμῶν
  choice: cada um de vocês
  rationale: Reproduz diretamente o sentido distributivo e dirige a exortação a cada integrante da comunidade.
- source_word: τὸ ἑαυτοῦ σκεῦος
  choice: seu próprio vaso
  rationale: Mantém a metáfora e a ambiguidade genuína de σκεῦος, que pode ser entendida como referência ao corpo, à esposa ou, em sentido mais geral, a um recipiente/instrumento.
- source_word: κτᾶσθαι
  choice: adquirir
  rationale: Conserva o sentido básico de obter ou adquirir, sem substituí-lo pela interpretação contextual possível de dominar, controlar ou possuir.
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  choice: em santidade e honra
  rationale: Tradução clara e digna, que preserva os dois substantivos e a esfera ou maneira em que a ação deve ocorrer.
theological_decisions:
- issue: Identidade do “vaso” (σκεῦος)
  choice: Preservar a expressão metafórica “seu próprio vaso” no texto e explicar a ambiguidade em nota.
  alternative: Interpretar diretamente como “seu próprio corpo” ou “sua própria esposa”.
  rationale: A expressão grega admite mais de uma interpretação historicamente defendida, e o versículo isolado não exige que a tradução elimine essa tensão.
- issue: Valor de κτᾶσθαι
  choice: Traduzir por “adquirir”.
  alternative: “possuir”, “dominar” ou “controlar”.
  rationale: “Adquirir” corresponde ao valor lexical básico e respeita a revisão fornecida, embora outros sentidos contextuais sejam possíveis.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação deliberadamente mantém a metáfora incomum do grego; a nota oferece as principais possibilidades sem resolver a ambiguidade.
