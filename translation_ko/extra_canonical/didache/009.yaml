base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009.yaml
  text: 'Now concerning the thanksgiving, give thanks in this way. First, concerning the cup:


    We give thanks to you, our Father,

    for the holy vine of David your servant,

    which you made known to us through Jesus your servant.

    To you be the glory forever.


    And concerning the broken bread:


    We give thanks to you, our Father,

    for the life and knowledge

    which you made known to us through Jesus your servant.

    To you be the glory forever.


    Just as this broken piece was scattered upon the mountains and, when gathered together, became one, so let your assembly be gathered together from the ends of the earth into your kingdom. For yours is the glory and the power through Jesus the Messiah forever.


    But let no one eat or drink from your thanksgiving except those who have been baptized into the name of the Lord. For also concerning this, the Lord has said: “Do not give what is holy to the dogs.”'
translation:
  language: ko
  text: '그런데 그 감사에 관하여는 이렇게 감사하십시오. 먼저 잔에 대하여:


    “우리 아버지이신 당신께 감사드립니다,


    다윗 당신의 종의 거룩한 포도나무를 위하여,


    그리고 그것을 당신의 종 예수를 통해 우리에게 알게 하셨기 때문입니다.


    영광이 당신께 영원토록 있습니다.”


    그리고 부서진 빵에 대하여:


    “우리 아버지이신 당신께 감사드립니다,


    생명과 지식을 위하여,


    그리고 그것을 당신의 종 예수를 통해 우리에게 알게 하셨기 때문입니다.


    영광이 당신께 영원토록 있습니다.”


    이 부서진 조각이 산들 위에 흩어져 있다가 함께 모여 하나가 된 것처럼, 당신의 회중도 땅의 끝들로부터 당신의 나라 안으로 함께 모이게 하십시오. 영광과 권능은 영원토록 예수 메시아를 통해 당신의 것입니다.


    그러므로 세례를 받아 주의 이름 안으로 들어간 사람들 외에는 아무도 당신의 감사의 식탁에서 먹거나 마시지 못하게 하십시오. 또한 이 일에 관하여 주께서 말씀하셨습니다. “거룩한 것을 개들에게 주지 말라.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘감사에 관하여’입니다. 여기서는 예식 자체를 가리키는 말로 읽었습니다.
    reason: source_note
  - marker: b
    text: ‘주’는 여기서 예수께 대한 호칭으로 읽을 수 있으나, 인용문은 구약적 출처를 가리킵니다.
    reason: ot_citation
lexical_decisions:
- source_word: εὐχαριστίας / εὐχαριστήσατε
  english_pob_choice: the thanksgiving / give thanks
  chosen_korean: 감사 / 감사하십시오
  alternatives_korean:
  - 성찬
  - 유카리스트
  lexicon: εὐχαριστία
  rationale: 본문은 예식의 명칭과 행위를 함께 가리키므로, 교회 전통 용어보다 더 직접적인 ‘감사’로 옮겨 감사의 행위와 식탁을 연결했습니다.
- source_word: ἄμπελος Δαβὶδ
  english_pob_choice: the holy vine of David
  chosen_korean: 다윗 당신의 종의 거룩한 포도나무
  alternatives_korean:
  - 다윗의 거룩한 포도나무
  - 다윗 당신의 종의 거룩한 포도나무
  lexicon: ἄμπελος
  rationale: POB의 ‘holy vine’은 유대적 메시아 표상을 유지하므로, ‘포도나무’를 살리고 ‘거룩한’도 그대로 반영했습니다.
- source_word: τοῦ παιδός σου / Ἰησοῦ τοῦ παιδός σου
  english_pob_choice: your servant / Jesus your servant
  chosen_korean: 당신의 종 / 당신의 종 예수
  alternatives_korean:
  - 당신의 종
  - 당신의 아들
  lexicon: παῖς
  rationale: 그리스어 παῖς는 ‘종’과 ‘아들’의 긴장을 담을 수 있으나, POB가 일관되게 servant로 읽는 점을 따라 ‘종’으로 두어 본문의 낮춤과 봉사성을 보존했습니다.
- source_word: ἐκκλησία
  english_pob_choice: your assembly
  chosen_korean: 당신의 회중
  alternatives_korean:
  - 당신의 모임
  - 당신의 교회
  lexicon: ἐκκλησία
  rationale: 여기서는 제도적 ‘교회’보다 모여진 공동체를 가리키므로, POB의 ‘assembly’에 맞춰 ‘회중’이 더 직접적입니다.
- source_word: Ἰησοῦ Χριστοῦ
  english_pob_choice: Jesus the Messiah
  chosen_korean: 예수 메시아
  alternatives_korean:
  - 예수 그리스도
  - 예수 메시아
  lexicon: Χριστός
  rationale: POB의 개정 선택을 따라 Χριστός를 직함적 의미가 살아 있는 ‘메시아’로 옮겨, 이름화된 ‘그리스도’보다 원뜻을 드러냈습니다.
theological_decisions:
- issue: 주님의 이름과 세례의 배타성
  chosen_reading: ‘주의 이름 안으로 들어간 사람들’로 옮겨, 세례가 단순한 의식이 아니라 주권 아래의 편입을 뜻함을 드러냈습니다.
  alternative_readings:
  - ‘주의 이름으로 세례를 받은 사람들’
  - ‘주의 이름 안에서 세례를 받은 사람들’
  rationale: ἰς ὄνομα는 목적지/편입의 뉘앙스를 가지므로, ‘안으로 들어가다’로 옮겨 본문의 방향성을 살렸습니다.
  doctrine_reference: 세례와 언약적 편입
