id: PSA.22.10
reference: Psalms 22:10
source:
  edition: WLC
  text: עָ֭לֶי/ךָ הָשְׁלַ֣כְתִּי מֵ/רָ֑חֶם מִ/בֶּ֥טֶן אִ֝מִּ֗/י אֵ֣לִ/י אָֽתָּה׃
translation:
  text: From birth I was entrusted to your care[a]; from my mother’s womb you have been my God.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “On you I was cast from the womb.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ
  chosen: On you
  alternatives:
  - On you
  - To you
  lexicon: HALOT
  rationale: Natural modern English retaining the spatial and dependence image.
- source_word: הָשְׁלַכְתִּי
  chosen: I was cast
  alternatives:
  - I was thrown
  - I was entrusted
  lexicon: HALOT
  rationale: Though morphologically Hoph'al perfect 1cs from שלך can be rendered literally as 'I was cast/thrown,' in context it refers to being placed onto God's care from birth. 'I was cast' keeps the vivid metaphor without over-interpreting; 'entrusted' captures sense but is more interpretive.
- source_word: מֵרָחֶם
  chosen: from the womb
  alternatives:
  - from birth
  lexicon: HALOT
  rationale: רֶחֶם literally means 'womb.' The concrete image should be preserved rather than generalized to 'birth.'
- source_word: מִבֶּטֶן אִמִּי
  chosen: from my mother’s belly
  alternatives:
  - from my mother's womb
  lexicon: HALOT
  rationale: Preserves the lexical distinction from רֶחֶם in the preceding phrase while remaining intelligible poetic English.
- source_word: אֵלִי
  lemma: אֵל
  chosen: my God
  alternatives:
  - God for me
  lexicon: HALOT
  rationale: 'The noun אֵל with 1cs suffix is straightforwardly possessive: ''my God.'' This is the natural English equivalent and preserves the covenantal/personal force.'
- source_word: אָתָּה
  chosen: you are
  alternatives:
  - you are
  lexicon: HALOT
  rationale: Directly represents the verbless nominal clause without adding present-perfect aspect.
