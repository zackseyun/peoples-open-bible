  yaml_path: translation/deuterocanon/psalms_of_solomon/004/018.yaml
  text: May sleep be taken from his temples in the night; may they fall away from every work of his hands.
translation:
  language: pt
  text: Que o sono lhe seja tirado das têmporas durante a noite; que se afastem de toda obra de suas mãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito de “se afastem” não está expresso no grego. A forma verbal é plural e pode retomar “têmporas”, embora a construção seja obscura; também se pode entender uma referência implícita às mãos ou aos resultados de seu trabalho.
    reason: Preservar a ambiguidade sintática do texto grego sem impor uma interpretação.
lexical_decisions:
- source_word: κροτάφων
  choice: têmporas
  rationale: Corresponde diretamente ao plural grego de κρόταφος, sem substituí-lo por “olhos”, leitura mais natural, porém não atestada no texto fornecido.
- source_word: ἀφαιρεθείη
  choice: seja tirado
  rationale: Mantém o optativo passivo de desejo ou imprecação.
- source_word: ἀποπέσοιεν
  choice: que se afastem
  rationale: Reproduz o optativo plural e o sentido básico de cair para longe, apartar-se ou desaparecer, evitando identificar silenciosamente o sujeito não expresso.
- source_word: παντὸς ἔργου χειρῶν αὐτοῦ
  choice: toda obra de suas mãos
  rationale: Preserva a formulação concreta e abrangente do grego.
theological_decisions:
- issue: Sujeito não expresso de ἀποπέσοιεν
  choice: Manter o sujeito implícito e assinalar a ambiguidade em nota
  alternative: Explicitar “suas têmporas” ou “suas mãos” como sujeito
  rationale: O verbo está no plural, mas o grego não declara inequivocamente o antecedente; explicitar um deles resolveria uma dificuldade real do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A construção optativa foi vertida como imprecação com “que”. “Durante a noite” soa natural sem enfraquecer o valor temporal de ἐν νυκτί.
