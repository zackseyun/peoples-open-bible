  from: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
  to: Yahweh said to Moses, “Go down and warn the people not to break through to see Yahweh, or many of them will die[a].
  rationale: The earlier rationale recognizes that 'fall' implies death but leaves the consequence unstated for source transparency. The explicit death warnings in verses 12–13 justify making that meaning clear here while retaining the literal expression in a footnote.
