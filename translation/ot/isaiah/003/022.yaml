id: ISA.3.22
reference: Isaiah 3:22
source:
  edition: WLC
  text: הַ/מַּֽחֲלָצוֹת֙ וְ/הַ/מַּ֣עֲטָפ֔וֹת וְ/הַ/מִּטְפָּח֖וֹת וְ/הָ/חֲרִיטִֽים׃
translation:
  text: the festal robes[a], the cloaks, the shawls, and the purses;
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or 'fine robes.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַּחֲלָצוֹת
  chosen: festal robes
  alternatives:
  - changeable suits of apparel
  - fine robes
  - holiday garments
  lexicon: HALOT, BDB
  rationale: The noun refers to costly or special garments, likely worn on festive or formal occasions. 'Festal robes' communicates distinctive, high-status clothing in clear modern English better than the traditional but opaque 'changeable suits of apparel.'
- source_word: מַּעֲטָפוֹת
  chosen: cloaks
  alternatives:
  - wraps
  - mantles
  lexicon: HALOT, BDB
  rationale: From a root associated with wrapping or enveloping, this term denotes an outer garment. 'Cloaks' is natural English and preserves the sense of a substantial outer wrap; 'wraps' is possible but slightly less specific.
- source_word: מִּטְפָּחוֹת
  chosen: shawls
  alternatives:
  - veils
  - scarves
  - kerchiefs
  lexicon: HALOT, BDB
  rationale: This term denotes a covering cloth or wrap. In this clothing/jewelry inventory, 'shawls' best fits a wearable textile accessory without overcommitting to face-covering implied by 'veils.'
- source_word: חֲרִיטִים
  chosen: purses
  alternatives:
  - bags
  - handbags
  lexicon: HALOT, BDB
  rationale: The noun denotes a bag or pouch for carrying valuables or money. 'Purses' fits the context of women's luxury items and is more precise than the generic 'bags.'
