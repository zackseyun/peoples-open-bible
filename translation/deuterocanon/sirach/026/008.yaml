translation:
  text: A wicked wife is an unsteady ox-yoke[a]; whoever takes hold of her is like someone who grasps a scorpion.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or 'a restless pair of yoked oxen'; the Greek agricultural term can refer to the yoke or the yoked pair.
    reason: alternative_reading
lexical_decisions:
- source_word: βοοζύγιον
  chosen: yoke for oxen
  alternatives:
  - ox-yoke
  - team of oxen under a yoke
  lexicon: LSJ
  rationale: The compound literally evokes oxen and yoking. In context it functions as the image compared to the wicked wife. 'Yoke for oxen' preserves the concrete agricultural metaphor without overcommitting to a more interpretive paraphrase.
- source_word: σαλευόμενον
  chosen: shaking
  alternatives:
  - shaken
  - unstable
  - tottering
  lexicon: BDAG
  rationale: The participle denotes being moved or shaken. 'Shaking' keeps the vivid instability of the image; 'unstable' is smoother but less concrete.
- source_word: γυνὴ πονηρά
  chosen: a wicked wife
  alternatives:
  - an evil woman
  - a bad wife
  lexicon: LSJ
  rationale: γυνή can mean 'woman' or 'wife'; in this domestic wisdom context 'wife' best fits. πονηρά is morally negative; 'wicked' preserves that stronger ethical sense better than 'bad'.
- source_word: ὁ κρατῶν αὐτῆς
  chosen: whoever takes hold of her
  alternatives:
  - he who restrains her
  - the one who seizes her
  lexicon: BDAG
  rationale: κρατέω can mean seize, grasp, or hold fast. Given the following simile of grabbing a scorpion, the tactile sense 'takes hold of' best matches the imagery. 'Restrains' is possible but more interpretive.
- source_word: δρασσόμενος
  chosen: grabs
  alternatives:
  - seizes
  - takes in hand
  lexicon: LSJ
  rationale: The verb refers to grasping with the hand. 'Grabs' is vivid, natural English and aligns with the warning image.
- source_word: σκορπίου
  chosen: a scorpion
  lexicon: LSJ
  rationale: Straightforward zoological term; the singular indefinite works naturally in English.
