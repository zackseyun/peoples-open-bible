translation:
  language: en
  text: They did not reorient[r1] away from the murders they committed, their sorcery,[a] their sexual immorality, or their thefts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “magic arts” or “witchcraft”; the Greek word may also refer to potions or poisonings.
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: their murders
  simplified_phrase: the murders they committed
  preserved_meaning: The murders were acts for which they were responsible.
  reasoning_layer_used: Lexical decision for φόνων
  rationale: The added verb makes the possessive relationship immediately clear.
- pob_phrase: their sorceries
  simplified_phrase: their sorcery
  preserved_meaning: They practiced occult or magical arts.
  reasoning_layer_used: Lexical and theological decisions for φαρμάκων
  rationale: The collective singular is more natural in modern English while retaining the chosen sense.
translation_notes:
  risk_flags:
  - risk: The Greek word rendered “sorcery” can also involve potions or poisonings.
    mitigation: The footnote preserves the broader lexical range without weakening the main contextual reading.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
