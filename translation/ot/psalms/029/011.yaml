id: PSA.29.11
reference: Psalms 29:11
source:
  edition: WLC
  text: יְֽהוָ֗ה עֹ֭ז לְ/עַמּ֣/וֹ יִתֵּ֑ן יְהוָ֓ה יְבָרֵ֖ךְ אֶת עַמּ֣/וֹ בַ/שָּׁלֽוֹם׀־׃
translation:
  text: Yahweh gives strength to his people; Yahweh blesses his people with peace[a][b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “Peace” translates Hebrew shalom, which includes wholeness and well-being.
    reason: lexical_alternative
  - marker: b
    text: 'Alternatively, “Yahweh will give strength to his people; Yahweh will bless his people with peace,” or a blessing: “May Yahweh give strength to his people; may Yahweh bless his people with peace.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: עֹז
  chosen: strength
  alternatives:
  - might
  - power
  lexicon: HALOT
  rationale: The noun denotes strength or might. 'Strength' is the most natural English object of 'gives' here and fits the psalm's theme of divine power without overstating the term.
- source_word: לְעַמּוֹ
  chosen: to his people
  alternatives:
  - for his people
  lexicon: HALOT
  rationale: 'The preposition ל commonly marks indirect object here: the LORD gives strength ''to'' his people. ''To'' is slightly more formal and direct than ''for'' in this construction.'
- source_word: יִתֵּן
  chosen: gives
  alternatives:
  - will give
  - may give
  lexicon: HALOT
  rationale: Although the imperfect can be rendered future, in poetic and proverbial contexts it often expresses a general or characteristic action. Present tense in English communicates the psalm's declarative confidence and parallels the second colon naturally.
- source_word: יְבָרֵךְ
  chosen: blesses
  alternatives:
  - will bless
  - may bless
  lexicon: HALOT
  rationale: As with יִתֵּן, the imperfect here is best taken as a declarative statement of what the LORD does for his people, not merely a wish. 'Blesses' preserves the verbal force and the parallelism.
- source_word: אֶת עַמּוֹ
  chosen: his people
  lexicon: HALOT
  rationale: 'Direct object marker plus noun with suffix: straightforwardly ''his people.'' Repeating the phrase in English preserves the Hebrew parallelism.'
- source_word: בַשָּׁלוֹם
  chosen: with peace
  alternatives:
  - in peace
  - with well-being
  lexicon: HALOT
  rationale: שָׁלוֹם includes peace, wholeness, and well-being. 'With peace' is idiomatic with 'blesses' in English and preserves the core sense without overexpanding the semantic range in the main text.
