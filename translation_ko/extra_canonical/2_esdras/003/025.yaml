  text: And this happened for many years. And those who lived in the city forsook it,
translation:
  language: ko
  text: 이 일은 여러 해 동안 일어났습니다. 그리고 그 도시에 살던 사람들은 그 도시를 버렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: factum est
  english_pob_choice: And this happened
  chosen_korean: 이 일이 … 계속되었습니다
  alternatives_korean:
  - 이 일이 … 일어났습니다
  - 이렇게 되었습니다
  lexicon: factum est
  rationale: 라틴어 factum est는 단순한 진행이 아니라 ‘일이 일어나다/되다’의 완료적 사건성을 가지므로, ‘계속되었습니다’로 여러 해에 걸친 지속을 자연스럽게 살리면서도 반복·진행의 뉘앙스를 반영했습니다.
- source_word: annis multis
  english_pob_choice: for many years
  chosen_korean: 여러 해 동안
  alternatives_korean:
  - 오랜 세월 동안
  - 많은 해 동안
  lexicon: annis multis
  rationale: 직역보다 자연스러운 표준어 표현으로 기간의 장구함을 전달했습니다.
- source_word: dereliquerunt
  english_pob_choice: forsook it
  chosen_korean: 그것을 버렸습니다
  alternatives_korean:
  - 그것을 떠났습니다
  - 그것을 저버렸습니다
  lexicon: derelinquere
  rationale: 라틴어 dereliquerunt는 단순 이탈보다 ‘버리다/내버려두다’의 뉘앙스가 강해, 문맥상 도시를 방치하고 떠난 의미를 살리기 위해 ‘버렸습니다’를 택했습니다.
- source_word: qui habitabant civitatem
  english_pob_choice: those who lived in the city
  chosen_korean: 그 도시에 살던 사람들
  alternatives_korean:
  - 그 도시에 거주하던 이들
  - 도시에 살고 있던 자들
  lexicon: habitare + civitas
  rationale: habitabant은 지속적 거주를 나타내므로 과거 관형절로 처리했고, civitatem을 ‘도시’로 옮겨 문맥의 대상이 분명히 드러나도록 했습니다.
theological_decisions:
- issue: 암시된 목적어 처리
  chosen_reading: ‘그것을’로 받아 앞의 ‘도시’를 자연스럽게 가리키게 했습니다.
  alternative_readings:
  - 목적어를 생략하여 ‘버렸습니다’만 둘 수 있음
  - ‘그 도시를 버렸습니다’로 명시할 수 있음
  rationale: 라틴어 dereliquerunt는 목적어가 생략된 채 문맥상 도성을 가리키므로, 한국어에서는 독자가 오해하지 않도록 대명사로 연결하되 과잉 해설은 피했습니다.
  doctrine_reference: source-level contextual ellipsis
- issue: 라틴어 factum est의 사건성
  chosen_reading: 단순 과거로 끝내지 않고 여러 해에 걸친 지속을 한 문장 안에서 드러냈습니다.
  alternative_readings:
  - ‘이 일이 여러 해 동안 있었습니다’처럼 더 직역할 수 있음
  - ‘오랜 세월 이 일이 일어났습니다’로 옮길 수 있음
  rationale: 본문은 사건이 ‘있었다’는 사실과 그 지속 기간을 함께 전달하므로, 한국어에서도 사건성과 지속성을 모두 보존하는 것이 적절합니다.
  doctrine_reference: narrative aspect
