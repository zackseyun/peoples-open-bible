  - they shall die and remain childless / without surviving offspring
  rationale: The Hebrew does not explicitly specify the mechanism of punishment, only the outcome/status. Rendering it 'die childless' preserves the terse legal formula and avoids importing a more detailed doctrinal or juridical explanation than the text states.
