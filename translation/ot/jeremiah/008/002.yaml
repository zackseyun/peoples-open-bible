  from: And they will spread them out before the sun and the moon and all the host of the heavens[a], which they loved and which they served and after which they walked and which they sought and to which they bowed down. They will not be gathered, and they will not be buried[c][b]; they will become dung on the surface of the ground.
  to: They will spread the bones out before the sun, the moon, and all the stars of heaven[a], which the dead had loved, served, followed, sought, and bowed down to. The bones will not be gathered up or buried; they will lie like dung on the ground.
  rationale: I retain the history’s five distinct acts of devotion and its insistence on the blunt dung image. The earlier preference for literal walking language and a plural “heavens” does not outweigh clear English meaning; unnecessary and misplaced notes are removed.
