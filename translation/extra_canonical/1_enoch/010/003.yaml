translation:
  text: And now instruct him, so that he may escape and establish his offspring for all generations forever.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “flee.” The verb describes going away from the approaching danger.
    reason: lexical_alternative
  - marker: b
    text: Literally, “make his offspring.” Some interpretations express the contextual result as “his offspring may be preserved,”
      but the supplied Ge'ez witness has an active construction; “establish” retains it.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  chosen: And now
  alternatives:
  - And now also
  rationale: The expression marks a transition to the next command. The enclitic nuance represented by “also” is not independently
    stressed in English, so the natural transitional wording “And now” is used.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: መሀሮ
  chosen: instruct him
  alternatives:
  - teach him
  - show him
  rationale: The imperative addresses the angel and takes a third-person masculine object. “Instruct him” suits the commissioning
    context without adding the content of the instruction.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይጐይዝ
  chosen: he may escape
  alternatives:
  - he may flee
  - he may go away
  rationale: The verb denotes going away or fleeing; in the setting of impending judgment, purposeful departure from danger
    is best expressed as “escape.”
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይገበር
  chosen: establish
  alternatives:
  - make
  - preserve
  - secure the continuation of
  rationale: The ordinary sense is “make/do,” but “make his offspring” is opaque English. “Establish” preserves the active
    Ge'ez construction while conveying the founding or continuation of a surviving line. “Preserve” expresses the likely contextual
    result but would turn the active wording into a passive idea not explicit in this witness.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዘርኡ
  chosen: his offspring
  alternatives:
  - his seed
  - his descendants
  rationale: The noun literally denotes seed and, here, the continuing family line. “Offspring” preserves the collective sense
    in readable modern English; “descendants” could imply only later generations.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ለኵሎሙ፡ ትውልድ፡ ለዓለም
  chosen: for all generations forever
  alternatives:
  - for all the generations of the age
  - for all generations of the world
  rationale: The sequence combines an all-generations expression with an enduring temporal phrase. “Forever” communicates
    the force of ለዓለም without importing the spatial sense “world” where the context is duration.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
