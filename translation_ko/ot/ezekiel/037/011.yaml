  text: Then he said to me, “Son of man, these bones are the whole house of Israel. Look, they are saying, ‘Our bones have dried up, and our hope has perished; we are cut off.’”
translation:
  language: ko
  text: 그러자 그가 제게 말씀하셨습니다. “인자야, 이 뼈들은 이스라엘의 온 집이다. 보아라, 그들이 이렇게 말한다. ‘우리 뼈들은 말라 버렸고, 우리의 희망은 사라졌으며, 우리는 끊어졌다.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  english_pob_choice: Son of man
  chosen_korean: 인자야
  alternatives_korean:
  - 사람아
  - 인자여
  lexicon: בן־אדם
  rationale: 에스겔의 예언자 호칭으로서 관용구를 살려 ‘인자’로 옮기되, 직접 호격을 자연스럽게 드러내기 위해 ‘-야’를 붙였습니다.
- source_word: הָעֲצָמוֹת הָאֵלֶּה
  english_pob_choice: these bones
  chosen_korean: 이 뼈들은
  alternatives_korean:
  - 이 뼈들
  - 이 마른 뼈들은
  lexicon: עצם
  rationale: 지시어와 복수를 간결하게 살려 본문이 말하는 특정한 ‘뼈들’을 직접 지시하도록 했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라,
  - 주목하십시오
  lexicon: הנה
  rationale: 화자의 주의를 끄는 감탄/지시 표현을 현대 한국어의 직접적 호명인 ‘보십시오’로 옮겼습니다.
- source_word: יָבְשׁוּ ... וְאָבְדָה תִקְוָתֵנוּ נִגְזַרְנוּ
  english_pob_choice: Our bones have dried up, and our hope has perished; we are cut off
  chosen_korean: 우리 뼈는 말라 버렸고, 우리의 희망은 사라졌으며, 우리는 끊어졌습니다
  alternatives_korean:
  - 우리 뼈는 마르고 우리의 희망은 없어졌으며 우리는 잘려 나갔습니다
  - 우리 뼈는 말라 버렸고, 우리의 소망은 끊겼으며, 우리는 제거되었습니다
  lexicon: יבש / אבד / גזר
  rationale: ‘말라 버렸고’로 시체 같은 소진 상태를 살리고, ‘희망’은 본문의 תִקְוָה를 직역하여 절망의 상실을 드러냈습니다. 마지막 표현은 단절의 상태를 살려 ‘끊어졌습니다’로 옮겼습니다.
