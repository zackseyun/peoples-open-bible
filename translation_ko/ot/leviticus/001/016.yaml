review_pass:
  verdict: revise
  source_fidelity: 초안의 영어 미번역어 "crop"은 반드시 한국어로 옮겨야 합니다. 또한 히브리어 מֻרְאָתוֹ는 새의 모이주머니/모이주머니 부분을, בְּנֹצָתָהּ는 문면상 깃털(또는 깃)과 함께를 가리킵니다. 제단 곁의 동쪽, 재가 있는 곳이라는 공간 관계도 유지했습니다.
  naturalness: '"제거하여 … 던지십시오"는 현대 표준 한국어 합쇼체의 절차 지시문으로 자연스럽습니다. "재가 있는 곳"은 불필요하게 관습적 처분 장소로 확대하지 않으면서 מְקוֹם הַדָּשֶׁן을 자연스럽게 번역합니다.'
  terminology: '"모이주머니"는 새의 crop에 해당하는 알기 쉬운 해부학 용어입니다. 논쟁적인 "그 깃털과 함께"는 본문에 두고, 전통적으로 "그 더러운 것과 함께"로 이해하는 대안을 각주로 보존했습니다.'
  issues:
  - severity: high
    issue: '"crop"이 영어로 남아 있습니다.'
    rationale: 한국어 완역이 아니며, 원문의 새의 모이주머니를 한국어 독자가 이해할 수 있도록 번역해야 합니다.
  - severity: medium
    issue: 초안의 "그의"는 선행하는 새의 신체 부위를 사람 남성 소유로 오해하게 할 수 있습니다.
    rationale: 히브리어 접미사는 제물인 새를 가리키므로, 한국어에서는 소유 대명사를 생략하거나 "그"로 처리하는 편이 자연스럽고 정확합니다.
  - severity: low
    issue: 난해한 בְּנֹצָתָהּ에 대한 대안 독법 각주가 없습니다.
    rationale: 문면의 "깃털"을 본문에 유지하되, "더러운 것"으로 옮기는 전통적 해석을 각주로 제시하면 본문의 논쟁성을 투명하게 보존할 수 있습니다.
  revised_text: 모이주머니를 그 깃털과 함께 제거하여, 제단 곁 동쪽에 있는 재가 있는 곳에 던지십시오.
  revised_footnotes:
  - marker: a
    text: 또는 “모이주머니”를 “모이주머니 부분” 또는 “모이주머니(크롭)”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “그 깃털과 함께”라고 합니다. 일부 번역은 이를 “그 더러운 것과 함께”로 옮깁니다.
    reason: alternative_reading
  revision_rationale: 미번역 영어를 한국어로 바로잡고, 새 제물의 모이주머니와 깃털이라는 문면의 뜻, 제단의 동쪽 및 재가 있는 곳이라는 위치 정보를 보존했습니다. 난해한 “깃털” 표현의 대안적 이해는 본문을 바꾸지 않고 각주로 제시했습니다.
