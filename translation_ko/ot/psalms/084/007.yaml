  rationale: 본문의 형태는 지명처럼 기능하므로 음역을 택해, ‘우는’이라는 해석 가능성을 본문에서 미리 확정하지 않았습니다.
- source_word: מַעְיָן יְשִׁיתוּהוּ
  english_pob_choice: they make it a spring
  chosen_korean: 그것을 샘으로 만들며
  alternatives_korean:
  - 그것을 샘으로 삼으며
  - 그것을 샘으로 바꾸며
  lexicon: HALOT
  rationale: שית의 ‘두다/만들다’ 의미를 따라, 골짜기를 생수의 샘으로 ‘만든다’는 변화를 간결하게 드러냈습니다.
- source_word: בְּרָכוֹת יַעְטֶה
  english_pob_choice: covers it with blessings
  chosen_korean: 복으로 덮습니다
  alternatives_korean:
  - 복들로 덮습니다
  - 복으로 둘러쌉니다
  lexicon: HALOT
  rationale: בְּרָכוֹת을 ‘복들’보다 한국어에서 더 자연스러운 집합적 명사 ‘복’으로 옮기고, עטה의 덮음 이미지를 살렸습니다.
theological_decisions:
- issue: מוֹרֶה의 의미를 어떻게 처리할지
  chosen_reading: ‘이른 비’로 번역하고 본문에 반영했습니다.
  alternative_readings:
  - 교사
  - 가을비
  rationale: 문맥이 샘, 물, 복의 이미지로 이어지므로 농경적 계절비가 가장 자연스럽고, ‘교사’라는 어휘적 가능성은 본문이 아니라 주석층에서만 남겨 두는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3, preserve theological/interpretive tension where the source is genuinely ambiguous.
