  to: 유다가 먼저 나갔고, 납달리와 갓과 종 오십 명이 그와 함께 탑의 남쪽으로 나갔습니다. 그들은 자기들 앞에서 만나는 모든 사람을 죽였으며, 그들 가운데서 그들에게서 달아난 사람은 단 한 사람도 없었습니다.
