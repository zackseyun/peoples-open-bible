  text: You will make them like a fiery furnace when you appear[a]; Yahweh in his anger will swallow them up, and fire will consume them.
  footnotes:
  - marker: a
    text: Or 'will reach' or 'will overtake'; Hebrew 'find' can imply successfully laying hold of enemies in context.
