  from: so that you may bathe your foot in blood, and the tongue of your dogs may have its share from the enemies.[a]
  to: so that you may bathe your foot in blood, and your dogs’ tongues may have their share from the enemies[a].”
  rationale: The latest review’s coherent blood-bathing image takes precedence over the earlier awkward attempts to make the foot crush an unstated object. I retain its cautious rendering of the obscure final phrase and preserve the verse’s violent imagery without softening it.
