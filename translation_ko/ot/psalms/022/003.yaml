  to: 그러나 주님은 거룩하십니다. 이스라엘의 찬양 위에 좌정하십니다.[a]
  rationale: וְאַתָּה의 앞선 탄식과의 대조는 ‘그러나’로, קָדוֹשׁ는 ‘거룩하십니다’로 옮겼습니다. יֹשֵׁב은 시적·왕권적 문맥에 따라 ‘좌정하십니다’로 번역하되, ‘거하다’라는 가능한 이해를 각주에 보존했습니다. תְּהִלּוֹת יִשְׂרָאֵל의 복수형과 소유 관계는 ‘이스라엘의 찬양’으로 자연스럽게 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:06:34Z'
