id: JOB.18.20
reference: Job 18:20
source:
  edition: WLC
  text: עַל י֭וֹמ/וֹ נָשַׁ֣מּוּ אַחֲרֹנִ֑ים וְ֝/קַדְמֹנִ֗ים אָ֣חֲזוּ שָֽׂעַר־׃
translation:
  text: Those in the west are appalled at the day of his downfall, and those in the east[a] are seized with horror.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'The paired terms can also be understood temporally: “those who come after” and “those who came before.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל
  chosen: at
  alternatives:
  - over
  - because of
  - concerning
  lexicon: HALOT
  rationale: 'With יוֹמוֹ and the following reaction verbs, the preposition introduces the occasion or object that provokes astonishment: ''at his day'' rather than a more spatial ''over his day.'' English smooths this as the cause of the reaction.'
- source_word: יוֹמוֹ
  chosen: his day
  alternatives:
  - his fate
  - his time
  - his downfall
  lexicon: HALOT
  rationale: Literally 'his day.' In Joban context this idiom points to the day of calamity/judgment that befalls the wicked. The main text preserves the concrete Hebrew sense through 'his day,' while the surrounding clause makes the ominous meaning clear.
- source_word: נָשַׁמּוּ
  chosen: are appalled
  alternatives:
  - are astonished
  - are desolated
  - are aghast
  lexicon: HALOT
  rationale: The verb conveys stunned desolation or appalled astonishment. 'Are appalled' fits the emotional force in context better than the weaker 'are astonished' and is idiomatic in English.
- source_word: אַחֲרֹנִים
  chosen: those in the west
  alternatives:
  - later generations
  - those after him
  - the westerners
  lexicon: HALOT
  rationale: In contrast with קַדְמֹנִים, the term can refer to those behind, hence in the west; the viable temporal sense is retained in the note.
- source_word: וְקַדְמֹנִים
  chosen: and those in the east
  alternatives:
  - former generations
  - those before him
  - the easterners
  lexicon: HALOT
  rationale: In contrast with אַחֲרֹנִים, the term can refer to those in front, hence in the east; the viable temporal sense is retained in the note.
- source_word: אָחֲזוּ
  chosen: are seized with
  alternatives:
  - grasp
  - take hold of
  - are overtaken by
  lexicon: HALOT
  rationale: The verb literally means 'seize, grasp.' With שׂער as the object, the idiom expresses being gripped by a strong emotion. English renders the idiom naturally as 'are seized with.'
- source_word: שָׂעַר
  chosen: horror
  alternatives:
  - shuddering
  - terror
  - hair-standing dread
  lexicon: HALOT
  rationale: This noun denotes a shudder or horror, likely related to the bodily reaction of hair bristling. 'Horror' communicates the emotional effect clearly in modern English; the more literal imagery is preserved in a footnote.
