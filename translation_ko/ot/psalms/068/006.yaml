  text: God settles the lonely in a home; he brings out prisoners into prosperity[a], but the rebellious live in a parched land.
  footnotes:
  - marker: a
    text: The Hebrew word is rare and uncertain; possible senses include “abundance,” “well-being,” or “with joyful songs.”
    reason: alternative_reading
translation:
  language: ko
  text: 하나님은 외로운 이들을 집에 살게 하시며, 갇힌 이들을 풍요로 이끌어 내십니다.[a] 그러나 거역하는 자들은 메마른 땅에 삽니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘풍성함으로’. 히브리어의 드문 표현은 ‘노래하며’ 또는 기쁨으로 풀려남을 나타내는 다른 표현으로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי יְתוֹמִים
  english_pob_choice: a father of the fatherless
  chosen_korean: 고아들의 아버지
  alternatives_korean:
  - 아버지 없는 자들의 아버지
  - 부모 없는 자들의 아버지
  lexicon: HALOT
  rationale: בְּנִיּוּת적 표현을 한국어로 자연스럽게 옮기되, 보호받지 못하는 사회적 취약성을 드러내는 뜻을 살려 '고아들'로 번역했습니다.
- source_word: דַיַּן אַלְמָנוֹת
  english_pob_choice: a judge of widows
  chosen_korean: 과부들의 재판장
  alternatives_korean:
  - 과부들의 심판자
  - 과부들의 판관
  lexicon: HALOT
  rationale: דַיַּן은 단순히 '보호자'보다 먼저 '재판하고 न्याय하는 이'를 뜻하므로, 법정 이미지를 유지하는 '재판장'을 택했습니다.
- source_word: בִּמְעוֹן קָדְשׁוֹ
  english_pob_choice: in his holy dwelling
  chosen_korean: 그의 거룩한 거처에
  alternatives_korean:
  - 그의 거룩한 거처에서
  - 그의 거룩한 처소 안에
  lexicon: HALOT
  rationale: 전치사 ב의 기본값인 '안에/에'를 살리면서, 'מָעוֹן'의 거처·거주지 의미를 현대 한국어로 자연스럽게 반영했습니다.
theological_decisions:
- issue: יתומים를 '고아들'로 옮길지, POB 각주처럼 '부모 없는 자들'로 풀어쓸지
  chosen_reading: 고아들
  alternative_readings:
  - 부모 없는 자들
  - 고아(곧 아버지 없는 자들)
  rationale: 시적·사회법적 맥락에서 יעדומים는 보호자 없는 취약한 자들을 가리키므로, 통상적 한국어 성경어휘인 '고아'를 쓰되 의미는 보존됩니다.
  doctrine_reference: '번역 원칙: 원어 우선, 그러나 한국어 관용이 원문의 사회적 함의를 충분히 전달할 때는 통용어를 허용함.'
