  meaning: A fool exhausts himself with labor while lacking even the practical sense to find his way to town.
  meaning_decisions:
  - source_phrase: עֲמַל הַכְּסִילִים תְּיַגְּעֶנּוּ
    prior_rendering: The labor of fools wearies him
    new_rendering: A fool's labor wears him out
    rationale: The Hebrew moves from fools collectively to an individual fool; a representative singular in English keeps that connection clear and avoids suggesting that other people's foolish labor exhausts an unrelated man.
  - source_phrase: אֲשֶׁר לֹא יָדַע לָלֶכֶת אֶל עִיר
    prior_rendering: who does not know how to go to a city
    new_rendering: he does not even know how to find his way to town
    rationale: Finding the way to town remains the concrete image, while “even” conveys its force as an example of elementary practical incompetence.
  footnote_kinds:
    a: literal_wording
  history_weighed: The latest audit rightly repaired the inconsistent plural object followed by a singular subject. I retain a consistent singular throughout, but make explicit that the exhausted worker and the incompetent fool are the same representative person.
