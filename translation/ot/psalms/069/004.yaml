id: PSA.69.4
reference: Psalms 69:4
source:
  edition: WLC
  text: רַבּ֤וּ מִ/שַּׂעֲר֣וֹת רֹאשִׁ/י֮ שֹׂנְאַ֪/י חִ֫נָּ֥ם עָצְמ֣וּ מַ֭צְמִיתַ/י אֹיְבַ֣/י שֶׁ֑קֶר אֲשֶׁ֥ר לֹא גָ֝זַ֗לְתִּי אָ֣ז אָשִֽׁיב׀־׃
translation:
  text: Those who hate me without cause are more numerous than the hairs of my head; those who seek to destroy me—those who oppose me on false grounds[a]—are mighty. I must restore[b] what I did not steal.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “my deceitful enemies.”
    reason: alternative_reading
  - marker: b
    text: Literally, “then I restore.” The context suggests compelled restitution.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוּ
  chosen: are more than
  alternatives:
  - have become many
  - are numerous
  lexicon: HALOT
  rationale: The verb means 'be/become many.' In English, with the comparative phrase 'than the hairs of my head,' 'are more than' best captures the idiomatic comparison.
- source_word: מִשַּׂעֲרוֹת רֹאשִׁי
  chosen: than the hairs of my head
  alternatives:
  - more numerous than the hairs of my head
  lexicon: HALOT
  rationale: The prefixed מ marks comparison here ('more than'), and the phrase is a standard hyperbolic image for innumerable quantity.
- source_word: שֹׂנְאַי חִנָּם
  chosen: those who hate me without cause
  alternatives:
  - my gratuitous haters
  - those who hate me for nothing
  lexicon: HALOT
  rationale: חִנָּם here denotes lack of cause or justification, not merely lack of payment. 'Without cause' is natural and preserves the forensic/moral sense.
- source_word: עָצְמוּ
  chosen: are mighty
  alternatives:
  - have become strong
  - are strong
  lexicon: HALOT
  rationale: The verb from עצם conveys strength or power. 'Are mighty' fits the poetic register and the threat posed by the enemies.
- source_word: מַצְמִיתַי
  chosen: those who would destroy me
  alternatives:
  - my destroyers
  - those who seek to annihilate me
  lexicon: HALOT
  rationale: The participial form denotes people intent on bringing the speaker to ruin. 'Those who would destroy me' makes the hostile intent explicit in idiomatic English.
- source_word: אֹיְבַי שֶׁקֶר
  chosen: my lying enemies
  alternatives:
  - my false enemies
  - my enemies falsely
  - my deceitful enemies
  lexicon: HALOT
  rationale: שֶׁקֶר can function adjectivally with 'enemies,' describing them as false/deceitful, or adverbially ('wrongfully'). Here an attributive rendering keeps the parallelism compact while preserving the sense of deceit and false accusation.
- source_word: אֲשֶׁר לֹא גָזַלְתִּי
  chosen: What I did not steal
  alternatives:
  - That which I did not rob
  - What I did not take by robbery
  lexicon: HALOT
  rationale: גזל refers to taking by force or robbery. 'Steal' is the most accessible English equivalent here, though somewhat broader than the Hebrew.
- source_word: אָז אָשִׁיב
  chosen: then I must restore
  alternatives:
  - then I restore
  - then I repay
  - then I give back
  lexicon: HALOT
  rationale: The phrase is difficult and likely expresses compelled restitution for something not actually stolen. 'Must restore' brings out the implied coercion in context, though the Hebrew verb itself is simply 'I restore/will restore.' This is a contextual, not lexical, expansion.
- source_word: רַבּוּ מִ/שַּׂעֲר֣וֹת רֹאשִׁ/י
  chosen: are more numerous than the hairs of my head
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This naturally and explicitly expresses the Hebrew comparison.
- source_word: מַ֭צְמִיתַ/י
  chosen: those who seek to destroy me
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: The participial expression denotes the speaker’s destroyers; “seek to destroy” conveys hostile intent without the potentially hypothetical force of “would.”
- source_word: אֹיְבַ֣/י שֶׁ֑קֶר
  chosen: my enemies wrongfully
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: The adverbial construal indicates that their enmity is false or unjustified and avoids the misleading phrase “false enemies”; the attributive reading is retained in the note.
- source_word: אָ֣ז אָשִֽׁיב
  chosen: I must restore
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: The context supports compelled restitution, though the modal force is implicit; the literal wording is documented in the note.
