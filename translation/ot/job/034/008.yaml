id: JOB.34.8
reference: Job 34:8
source:
  edition: WLC
  text: וְ/אָרַ֣ח לְ֭/חֶבְרָה עִם פֹּ֣עֲלֵי אָ֑וֶן וְ֝/לָ/לֶ֗כֶת עִם אַנְשֵׁי רֶֽשַׁע־־־׃
translation:
  text: He keeps company with evildoers and walks with wicked men.
  philosophy: dynamic
lexical_decisions:
- source_word: וְ/אָרַח
  chosen: and keeps company
  alternatives:
  - and travels
  - and goes in company
  - and associates
  lexicon: HALOT
  rationale: The verb from ארח in this context is idiomatic with לְחֶבְרָה, expressing association or companionship rather than literal travel. 'Keeps company' captures the social/moral alignment Elihu is describing and fits the parallel with 'walks with.'
- source_word: לְ/חֶבְרָה
  chosen: company
  alternatives:
  - companionship
  - association
  lexicon: HALOT
  rationale: The noun denotes companionship or fellowship. In English, 'keeps company' is a natural idiom that preserves the sense of associating oneself with others.
- source_word: עִם
  chosen: with
  lexicon: HALOT
  rationale: Standard preposition of association; 'with' is the direct and natural rendering in both clauses.
- source_word: פֹּעֲלֵי אָוֶן
  chosen: evildoers
  alternatives:
  - doers of iniquity
  - workers of trouble
  - evildoers
  lexicon: HALOT
  rationale: A natural English designation for those who do or practice evil.
- source_word: וְ/לָ/לֶכֶת
  chosen: and walks
  alternatives:
  - and goes
  - and proceeds
  lexicon: HALOT
  rationale: הלך often functions literally or metaphorically for one's course of life and associations. 'Walks' preserves the Hebrew imagery and moral nuance, especially in wisdom literature.
- source_word: אַנְשֵׁי רֶשַׁע
  chosen: wicked men
  alternatives:
  - wicked men
  - men of wickedness
  - evil men
  lexicon: HALOT
  rationale: This naturally renders the masculine construct and its moral characterization.
