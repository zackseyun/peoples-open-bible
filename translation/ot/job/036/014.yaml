id: JOB.36.14
reference: Job 36:14
source:
  edition: WLC
  text: תָּמֹ֣ת בַּ/נֹּ֣עַר נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם בַּ/קְּדֵשִֽׁים׃
translation:
  text: They die in youth, and their life ends among men consecrated to pagan worship[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Traditionally understood as “male cult prostitutes”; the precise role of these consecrated cult personnel is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹת
  chosen: die
  alternatives:
  - perish
  - comes to an end
  lexicon: HALOT
  rationale: Qal imperfect of מות, with נַפְשָׁם as the grammatical subject in sense. English uses the plural 'they die' to reflect the plural pronominal suffix on 'their soul/life' and the collective reference to the wicked under discussion.
- source_word: בַּנֹּעַר
  chosen: in youth
  alternatives:
  - while young
  - in their youth
  lexicon: HALOT
  rationale: נֹעַר denotes youth or early life. 'In youth' is concise and natural; the possessive 'their' is implied by context and need not be repeated in English.
- source_word: נַפְשָׁם
  chosen: they
  alternatives:
  - their soul
  - their life
  lexicon: HALOT
  rationale: נֶפֶשׁ can mean soul, life, or person. Here it functions idiomatically as the subject of dying. Rendering it woodenly as 'their soul dies' would sound unnatural and potentially misleading in English, so the sense is carried by 'they die'.
- source_word: וְחַיָּתָם
  chosen: and their life ends
  alternatives:
  - their life
  - their living being
  - their vitality
  lexicon: HALOT
  rationale: The predicate is supplied elliptically from “die” in the first colon, producing a complete and natural English clause.
- source_word: בַּקְּדֵשִׁים
  chosen: among the consecrated ones
  alternatives:
  - among the consecrated ones
  - among the sodomites
  - among temple prostitutes
  lexicon: HALOT
  rationale: This reflects the term’s form and cultic designation without presenting the disputed identification as prostitutes as certain; that interpretation is retained in the footnote.
