base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/004.yaml
  text: You have kept my eyes from closing[a]; I am troubled and cannot speak.
  footnotes:
  - marker: a
    text: Or 'I muse' / 'I complain' for 'I meditate'; the Hebrew verb can denote reflective musing or lamenting speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'my spirit is overwhelmed' for 'my spirit grows faint.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 제 눈꺼풀을 붙들어 열어 두셨습니다[a]. 제가 괴로워[b] 말할 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제 눈의 지킴이들’을 붙드셨다는 뜻입니다. 히브리어 관용구는 하나님께서 시편 기자가 잠들지 못하게 하셨음을 가리키는 듯합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘동요하여’, ‘불안하여’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה / I remember
  english_pob_choice: I remember
  chosen_korean: 하나님을 기억하고
  alternatives_korean:
  - 하나님을 떠올리고
  - 하나님을 생각하며
  - 하나님을 기억하며
  lexicon: HALOT
  rationale: זכר의 1인칭 화자는 단순한 회상보다 현재 진행되는 기억의 행위를 나타내므로, 문맥에 맞게 ‘기억하고’로 자연스럽게 옮겼습니다.
- source_word: וְאֶהֱמָיָה / and I groan
  english_pob_choice: and I groan
  chosen_korean: 제가 신음합니다
  alternatives_korean:
  - 제가 탄식합니다
  - 제가 신음하며
  - 제가 괴로워합니다
  lexicon: HALOT
  rationale: המה는 소리 내는 고통과 신음을 나타내므로, 시편의 애가 문맥에서는 ‘신음합니다’가 가장 직접적입니다.
- source_word: אָשִׂיחָה / I meditate
  english_pob_choice: I meditate
  chosen_korean: 제가 묵상하면
  alternatives_korean:
  - 제가 묵상하고
  - 제가 생각하면
  - 제가 한탄하면
  lexicon: HALOT
  rationale: שיח은 묵상과 되뇌임, 때로는 하소연을 포함할 수 있으나, 여기서는 앞뒤 평행 구조상 내적 숙고를 살려 ‘묵상하면’으로 옮겼습니다.
- source_word: וְתִתְעַטֵּף רוּחִי / my spirit grows faint
  english_pob_choice: my spirit grows faint
  chosen_korean: 제 영이 쇠약해집니다
  alternatives_korean:
  - 제 영이 기운이 빠집니다
  - 제 영이 압도됩니다
  - 제 영이 기절할 듯합니다
  lexicon: HALOT
  rationale: עטף의 히트파엘은 약해지다, 기운이 꺾이다, 압도되다의 뜻을 가질 수 있어, 시적·영적 내면의 쇠약을 담는 ‘쇠약해집니다’를 선택했습니다.
theological_decisions:
- issue: Selah의 처리
  chosen_reading: 음역하여 ‘셀라’로 유지했습니다.
  alternative_readings:
  - 의미를 추정해 번역하지 않음
  - ‘잠잠히’ 등 해석적 번역
  rationale: 셀라의 정확한 기능은 불확실하므로, 본문 증거에 충실하게 음역을 유지하는 것이 가장 안전합니다.
  doctrine_reference: 본문 비명령어/음악 용어의 불확실성에 대한 보수적 처리
