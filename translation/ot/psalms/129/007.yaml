id: PSA.129.7
reference: Psalms 129:7
source:
  edition: WLC
  text: שֶׁ/לֹּ֤א מִלֵּ֖א כַפּ֥/וֹ קוֹצֵ֗ר וְ/חִצְנ֥/וֹ מְעַמֵּֽר׃
translation:
  text: The reaper does not fill his hand with it, nor does the one who gathers sheaves fill the fold of his garment[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “his bosom”; the word can refer to the lap or a fold of clothing used for carrying things.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁלֹּא
  chosen: with which ... not
  alternatives:
  - that ... not
  - so that ... not
  lexicon: HALOT
  rationale: 'The relative particle with negation links back to the ''grass on the housetops'' of the previous verse: it is grass with which no harvester can fill himself. Rendering it as ''with which ... not'' makes the antecedent relationship explicit in natural English.'
- source_word: מִלֵּא
  chosen: does ... fill
  alternatives:
  - fills
  - filled
  lexicon: HALOT
  rationale: A gnomic present naturally expresses the characteristic uselessness of the rooftop grass in this description.
- source_word: כַפּוֹ
  lemma: כַּף
  chosen: his hand
  alternatives:
  - his palm
  lexicon: HALOT
  rationale: כַּף literally denotes the palm/hand. 'Hand' is the more idiomatic English expression in harvesting imagery while preserving the concrete picture.
- source_word: קוֹצֵר
  chosen: the reaper
  alternatives:
  - the harvester
  - one who reaps
  lexicon: HALOT
  rationale: A substantival participle referring to the one cutting the crop. 'Reaper' is concise, natural, and fits the agricultural parallelism.
- source_word: וְחִצְנוֹ
  chosen: his bosom
  alternatives:
  - his bosom
  - his lap
  - his garment-fold
  lexicon: HALOT
  rationale: This is the direct lexical sense and preserves the term's contextual range, including lap or a garment fold used for holding gathered stalks.
- source_word: מְעַמֵּר
  chosen: the one who gathers sheaves
  alternatives:
  - the binder of sheaves
  - the gatherer
  lexicon: HALOT
  rationale: The participle derives from gathering into heaps/sheaves. 'The one who gathers sheaves' makes the action explicit for modern readers and preserves the agricultural sense.
