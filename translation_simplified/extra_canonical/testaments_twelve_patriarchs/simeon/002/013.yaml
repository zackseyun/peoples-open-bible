  text: Καὶ ἔγνων, τέκνα⁸², ὅτι *περὶ Ἰωσὴφ⁸³ *τοῦτό μοι συνέβη⁸⁴. καὶ⁸⁵ μετανοήσας ἔκλαυσα⁸⁶ καὶ⁸⁷ ηὐξάμην *Κυρίῳ τῷ Θεῷ⁸⁸ ἵνα⁸⁹ *ἀποκατασταθῇ ἡ χείρ μου⁹⁰ καὶ⁹¹ ἀποσχῶ⁹² ἀπὸ *παντὸς μολυσμοῦ καὶ φθόνου⁹³ Γκαὶ ἀπὸ πάσης ἀφροσύνης⁷.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/013.yaml
  text: And I knew, my children, that this happened to me because of Joseph. And after repenting, I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:57:46Z'
    unchanged: false
    changes_summary: Replaced 'after changing my mind' with 'after repenting' to more naturally and accurately render μετανοήσας in this context; otherwise retained the draft.
translation:
  language: en
  text: I realized, my children, that this had happened to me because of Joseph. So I reoriented[a] and wept. I prayed to the Lord God to restore my hand and help me stay away from every kind of moral corruption, from envy, and from all foolishness.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And I knew
  simplified_phrase: I realized
  preserved_meaning: Simeon came to understand the cause of what happened to him.
  reasoning_layer_used: POB translation and immediate context
  rationale: “Realized” expresses this recognition more naturally in modern English.
- pob_phrase: that I might abstain from every defilement and envy and from all foolishness
  simplified_phrase: help me stay away from every kind of moral corruption, from envy, and from all foolishness
  preserved_meaning: He asked God to enable him to avoid defilement, envy, and foolish conduct.
  reasoning_layer_used: POB translation and Greek source structure
  rationale: The wording replaces formal “abstain” and opaque “defilement” while keeping the three distinct evils.
