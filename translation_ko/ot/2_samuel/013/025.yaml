source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל אַבְשָׁל֗וֹם אַל בְּנִ/י֙ אַל נָ֤א נֵלֵךְ֙ כֻּלָּ֔/נוּ וְ/לֹ֥א נִכְבַּ֖ד עָלֶ֑י/ךָ וַ/יִּפְרָץ בּ֛/וֹ וְ/לֹֽא אָבָ֥ה לָ/לֶ֖כֶת וַֽ/יְבָרֲכֵֽ/הוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: ko
  text: 그러나 왕이 압살롬에게 말했습니다. “아니, 내 아들아. 제발 우리 모두가 함께 가지 말자. 그러면 네게 짐이 될 것이다.” 왕이 그를 재촉했지만, 그는 가려고 하지 않았습니다. 그래서 왕이 그를 축복했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘짐이 될 것이다’는 히브리어의 ‘무겁다’에서 나온 표현으로, 여기서는 동행이 상대에게 부담이 됨을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא נֵלֵךְ כֻּלָּנוּ
  english_pob_choice: please let us not all go
  chosen_korean: 제발 우리 모두가 함께 가지 말자
  alternatives_korean:
  - 우리 모두 가지 말자
  - 부디 우리 모두 가지 말자
  lexicon: 'English_POB: please let us not all go'
  rationale: אַל נָא는 간청을 담은 금지 표현이므로 ‘제발’로 옮기고, נֵלֵךְ כֻּלָּנוּ는 단순한 동행 부정이므로 자연스럽게 ‘우리 모두가 함께 가지 말자’로 표현했습니다.
- source_word: וְלֹא נִכְבַּד עָלֶיךָ
  english_pob_choice: lest we be a burden on you
  chosen_korean: 그러면 네게 짐이 될 것이다
  alternatives_korean:
  - 네게 부담이 되지 않게 하자
  - 네게 폐가 되지 않게 하자
  lexicon: 'English_POB: lest we be a burden on you'
  rationale: נִכְבַּד עָלֶיךָ의 ‘무겁다/짐이 되다’라는 의미를 살려, 관계적 부담을 드러내는 ‘짐이 될 것이다’로 직역에 가깝게 옮겼습니다.
- source_word: וַיִּפְרָץ בּוֹ
  english_pob_choice: And he pressed him
  chosen_korean: 왕이 그를 재촉했지만
  alternatives_korean:
  - 왕이 그에게 강하게 आग्रह했지만
  - 왕이 그에게 간청했지만
  lexicon: 'English_POB: And he pressed him'
  rationale: וַיִּפְרָץ בּוֹ는 단순 요청보다 강한 압박·재촉의 뉘앙스가 있어, 한국어에서도 자연스러운 ‘재촉하다’로 옮겼습니다.
- source_word: וַיְבָרֲכֵהוּ
  english_pob_choice: so he blessed him
  chosen_korean: 그래서 왕이 그를 축복했습니다
  alternatives_korean:
  - 그래서 왕이 그에게 복을 빌어 주었습니다
  - 그래서 왕이 그에게 축복하였습니다
  lexicon: 'English_POB: so he blessed him'
  rationale: 동사의 기본 의미를 따라 ‘축복하다’를 유지해, 단순한 작별 인사로 약화시키지 않았습니다.
theological_decisions:
- issue: 왕의 ‘축복’의 성격
  chosen_reading: 본문은 결별 장면에서 왕이 압살롬에게 축복을 베푸는 행위를 간명하게 말하며, 그 의미를 해설적으로 확장하지 않았습니다.
  alternative_readings:
  - 단순한 인사 또는 작별 인사로 완화
  - 의례적 축복으로 상세 설명
  rationale: 히브리어 원문과 영어 POB가 모두 간단히 ‘축복했다’고만 말하므로, 서술을 넘어서지 않도록 그대로 두었습니다.
  doctrine_reference: 본문 서술 존중 / 해석 과잉 방지
