theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Concessive force in the clause introduced by כִּי
  chosen_reading: for though you were angry with me
  alternative_readings:
  - for you were angry with me
  - because you were angry with me
  rationale: The Hebrew does not use a separate concessive particle, but the sequence 'you were angry... your anger turned away... and you comfort me' strongly implies concession. Making that nuance explicit preserves the sense without importing extra theology.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source sense without paraphrase'
