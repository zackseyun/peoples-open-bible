translation:
  language: en
  text: But when the people believed Philip as he announced the good news about God’s kingdom and the name of Jesus Christ,[a] men and women alike were being baptized.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the name of Jesus the Messiah.” “Messiah” preserves the title expressed by the Greek word Christos.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: when they believed Philip as he proclaimed
  simplified_phrase: when the people believed Philip as he announced
  preserved_meaning: The people accepted Philip as a trustworthy messenger while he announced the good news.
  reasoning_layer_used: Lexical decision for ἐπίστευσαν τῷ Φιλίππῳ and immediate context
  rationale: The wording identifies the implied group and avoids suggesting faith placed in Philip himself.
- pob_phrase: the kingdom of God
  simplified_phrase: God’s kingdom
  preserved_meaning: Philip announced the kingdom belonging to and ruled by God.
  reasoning_layer_used: Lexical decision for τῆς βασιλείας τοῦ θεοῦ
  rationale: The possessive form is more natural while retaining the biblical concept.
- pob_phrase: both men and women
  simplified_phrase: men and women alike
  preserved_meaning: Both sexes were included among those being baptized.
  reasoning_layer_used: Lexical decision for ἄνδρες τε καὶ γυναῖκες
  rationale: This common expression preserves Luke’s explicit inclusion of both groups.
translation_notes:
  risk_flags:
  - risk: Readers could take the temporal link as defining a complete doctrine of baptism.
    mitigation: The wording reports the sequence in this event without adding a broader causal claim.
