translation:
  text: All the kings, the mighty, the exalted and those who rule the dry land will fall on their faces before him.
    They will bow down, petition that Son of Man, plead with him and ask him for mercy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The long plural subject is included rather than dropping a group between fall and on-their-faces. Charles
      printed113 note13 regards the intervening group list as syntactically suspicious; this proposal retains the
      selected edited sequence without deleting it. Petition/plead/ask-for-mercy are distinct printed verbs, and
      no unprinted recipient is supplied.
