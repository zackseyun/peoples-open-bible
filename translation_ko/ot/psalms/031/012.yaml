id: PSA.31.12
reference: Psalms 31:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִ֭שְׁכַּחְתִּי כְּ/מֵ֣ת מִ/לֵּ֑ב הָ֝יִ֗יתִי כִּ/כְלִ֥י אֹבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/012.yaml
  text: I am forgotten like a dead man, out of mind[a]; I have become like a vessel that is lost[b].
  footnotes:
  - marker: a
    text: Literally, “from the heart”; here the Hebrew idiom means no longer remembered.
    reason: literal_form
  - marker: b
    text: Or “a perishing vessel” or “a ruined vessel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 죽은 사람처럼 사람들의 기억에서 잊혔고, 망가져 가는 그릇처럼 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “잃어버린 그릇처럼”, “사라져 가는 그릇처럼”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל צֹרְרַי
  english_pob_choice: Because of all my enemies
  chosen_korean: 내 모든 원수들 때문에
  alternatives_korean:
  - 모든 원수들로부터
  - 내 모든 원수들보다
  lexicon: HALOT
  rationale: מִן + כָּל + 명사는 문맥상 원인/배경을 나타낼 수 있으므로, 한국어에서는 원인 관계를 드러내는 ‘때문에’가 자연스럽습니다. 비교적 읽기는 가능하지만 본문 흐름상 덜 유력합니다.
- source_word: הָיִיתִי חֶרְפָּה
  english_pob_choice: I have become a reproach
  chosen_korean: 나는 수치가 되었으며
  alternatives_korean:
  - 나는 수치가 되었습니다
  - 나는 조롱거리가 되었습니다
  lexicon: HALOT
  rationale: היה + 명사는 결과적 상태를 나타내므로 ‘되었다’로 옮겼습니다. חֶרְפָּה는 수치, 치욕, 조롱의 의미가 있어 ‘수치’가 가장 직접적으로 상태를 보여 줍니다.
- source_word: וְלִשֲׁכֵנַי מְאֹד
  english_pob_choice: especially to my neighbors
  chosen_korean: 내 이웃들에게는 더욱 그러하고
  alternatives_korean:
  - 내 이웃들에게는 매우 그러하고
  - 특별히 내 이웃들에게는
  lexicon: HALOT
  rationale: מְאֹד는 부사적으로 강도를 더하므로, 단순한 정도보다 관계적 강조를 살려 ‘더욱 그러하고’로 옮겼습니다. 이웃이라는 가까운 관계에서 수치가 더 크게 작용한다는 뉘앙스를 살립니다.
- source_word: וּפַחַד לִמְיֻדָּעָי
  english_pob_choice: and a terror to my acquaintances
  chosen_korean: 내 아는 사람들에게는 두려움이 되었습니다
  alternatives_korean:
  - 내 친지들에게는 공포가 되었습니다
  - 내 아는 이들에게는 두려운 존재가 되었습니다
  lexicon: HALOT
  rationale: פַחַד은 두려움/공포를 뜻하며, 서술적 용법에서는 타인에게 두려움의 대상이 되었다는 의미가 자연스럽습니다. מְיֻדָּעִים은 친밀한 친구라기보다 알고 지내는 사람들을 가리키므로 ‘아는 사람들’이 적절합니다.
- source_word: רֹאַי בַּחוּץ
  english_pob_choice: those who see me in the street
  chosen_korean: 밖에서 나를 보는 사람들은
  alternatives_korean:
  - 길에서 나를 보는 사람들은
  - 바깥에서 나를 보는 사람들은
  lexicon: HALOT
  rationale: בַּחוּץ는 문자적으로 ‘밖’이지만, 공개된 공간에서 마주치는 상황을 가리키므로 한국어에서는 문맥상 ‘밖에서’가 무난합니다. 공적 시야에서의 회피를 드러냅니다.
- source_word: נָדְד֥וּ מִמֶּנִּי
  english_pob_choice: flee from me
  chosen_korean: 나를 피하여 달아났습니다
  alternatives_korean:
  - 나에게서 달아났습니다
  - 나를 피해 멀어졌습니다
  lexicon: HALOT
  rationale: נָדַד은 달아남, 떠남, 멀어짐을 포함하므로 관계적 회피의 즉각성을 살려 ‘피하여 달아났다’로 옮겼습니다. 단순 이동보다 반응의 강도가 드러납니다.
