  category: meaning_retranslation
  from: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
  to: I fell at his feet to worship him. But he said to me, “Do not do that! I am a fellow servant[a] with you and your brothers and sisters who have the testimony from Jesus[b]. Worship God! For the testimony from Jesus is the spirit of prophecy[c].”
  rationale: The earlier deliberation correctly recognizes competing readings of “the testimony of Jesus”; the prophetic parallel in Revelation 22:9 favors testimony from Jesus, while the alternative remains explicit. I retain the openness of “spirit of prophecy,” translate the prohibition by its force, and follow the standing “servant” ruling.
