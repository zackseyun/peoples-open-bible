  meaning_decisions:
  - source_phrase: וּבָא הַלֵּוִי ... וְהַגֵּר וְהַיָּתוֹם וְהָאַלְמָנָה ... וְאָכְלוּ וְשָׂבֵעוּ
    prior_rendering: And the Levite shall come ... and the sojourner, the fatherless, and the widow ... and they shall eat and be satisfied
