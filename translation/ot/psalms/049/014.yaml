  review_summary: “Set for Sheol” renders שַׁתּוּ without the added formal nuance of “appointed.” The prior adjudication’s “with no dwelling for them” treats מִן as privative and converts the singular לוֹ into a plural reference too confidently; “Sheol will be their dwelling” is still more interpretive. The MT most directly permits the traditional construal in which their form wastes away in Sheol away from its dwelling, though the antecedent and syntax remain difficult. The final note therefore preserves a major alternative rather than manufacturing certainty. Footnotes are placed after the expressions they explain.
