  meaning_decisions:
  - source_phrase: እስመ፡ ያወድቆ፡ ስብሐቲከሙ
    prior_rendering: ''
    new_rendering: For God will bring down your glory
    rationale: God is the implied subject of the judgment actions. Naming him makes the connection clear in English while retaining the image of the sinners’ glory being brought down.
  - source_phrase: ወይወዲ፡ እኩየ፡ በልብክሙ
