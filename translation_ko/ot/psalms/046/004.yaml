    text: 또는 ‘한 강이 그 물줄기들로 하나님의 도성을 기쁘게 합니다.’ 히브리어는 동사 없이 ‘한 강’으로 시적으로 시작하며, 한국어에서는 문장을 자연스럽게 하기 위해 ‘있으니’를 덧붙일 수 있습니다.
    reason: lexical_alternative
