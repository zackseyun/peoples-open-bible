base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/008.yaml
  text: Understand, you brutish among the people; and you fools, when will you become wise?
translation:
  language: ko
  text: 깨달으십시오, 백성 가운데 우둔한 자들아. 미련한 자들아, 언제 지혜로워지겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּינוּ
  english_pob_choice: Understand
  chosen_korean: 깨닫으십시오
  alternatives_korean:
  - 이해하십시오
  - 분별하십시오
  lexicon: בין
  rationale: 지각을 요구하는 명령형으로서 단순 정보 이해보다 ‘깨닫다/분별하다’가 시편의 책망 어조를 더 잘 드러냅니다.
- source_word: בֹּעֲרִים
  english_pob_choice: brutish
  chosen_korean: 어리석은 자들
  alternatives_korean:
  - 우둔한 자들
  - 미련한 자들
  - 무지한 자들
  lexicon: בער
  rationale: 영어 POB의 'brutish'는 단순 지적 부족보다 감각 없고 거친 어리석음을 가리키므로, 한국어에서는 독자에게 자연스럽고 책망의 강도가 유지되는 ‘어리석은 자들’로 옮겼습니다.
- source_word: בָּעָם
  english_pob_choice: among the people
  chosen_korean: 백성 가운데 있는
  alternatives_korean:
  - 백성 가운데
  - 백성 중에 있는
  lexicon: עם
  rationale: 전치사 בְּ + עָם의 관계를 살려 ‘~가운데 있는’으로 옮겨 대상 집단 내부를 지칭하는 느낌을 보존했습니다.
- source_word: מָתַי תַּשְׂכִּילוּ
  english_pob_choice: when will you become wise?
  chosen_korean: 언제 지혜로워지겠습니까?
  alternatives_korean:
  - 언제 깨닫겠습니까?
  - 언제 지혜를 얻겠습니까?
  lexicon: שׂכל
  rationale: 동사 תַּשְׂכִּילוּ는 지혜·분별의 획득을 묻는 미래적 의문이므로, 상태 변화를 드러내는 ‘지혜로워지다’가 가장 직접적입니다.
theological_decisions:
- issue: 시적 책망의 호칭 반복
  chosen_reading: 첫 절반의 ‘백성 가운데 있는 어리석은 자들’과 둘째 절반의 ‘어리석은 자들’을 모두 살려, 시편 화자의 공개 책망 톤을 유지했습니다.
  alternative_readings:
  - 두 절반 모두 단순히 ‘미련한 자들’로 통일
  - 첫 절반을 완곡하게 처리
  rationale: 본문은 동일 계열의 호칭을 반복해 청중을 몰아세우므로, 반복 구조를 약화하지 않고 그대로 드러내는 것이 시적 효과와 수사적 압박을 보존합니다.
  doctrine_reference: 시편의 예언적/지혜문학적 책망 발화의 수사적 보존
