  meaning: Caleb’s enduring strength and his descendants’ inheritance show all Jacob’s descendants the good of wholeheartedly following Yahweh.
  meaning_decisions:
  - source_phrase: להדריכו על במתי ארץ, וגם זרעו ירש נחלה
    prior_rendering: Rendered in SIR.46.9 as “so that he went up into the highlands of the land, and his offspring took possession of an inheritance.”
    new_rendering: This enabled him to tread the highlands of the land, and his offspring also took possession of an inheritance
    rationale: Both clauses occur in this verse’s supplied Hebrew. “Tread” retains the image of Caleb’s vigorous movement over the land, while “also” preserves the explicit inclusion of his descendants.
  - source_phrase: למלא אחרי יהוה
    prior_rendering: to fully follow Yahweh
    new_rendering: to follow Yahweh wholeheartedly
    rationale: The idiom describes complete allegiance, not merely the extent of an action; the wording also echoes the same expression in verse 7.
  footnote_kinds:
    a: cross_reference
  history_weighed: The later history’s addition of “fully” rightly recovered the complete allegiance expressed by מלא אחרי, and that force is preserved. The highlands and descendants’ inheritance clauses are included here because they occur in this verse’s supplied Hebrew rather than being repeated in verse 9.
