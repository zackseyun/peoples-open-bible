  - Whoever dwells
  rationale: The Hebrew masculine singular participle has representative force. 'The one who' preserves the singular and its universal application in natural English; 'He who' remains a documented alternative.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: Rendering the divine title שַׁדַּי
  chosen_reading: the Almighty
  alternative_readings:
  - Shaddai
  rationale: The project philosophy prefers translating titles rather than transliterating them. 'The Almighty' preserves meaning for modern readers and avoids importing a name-like form where the Hebrew functions as a title.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2
