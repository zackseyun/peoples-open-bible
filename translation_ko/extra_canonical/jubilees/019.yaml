base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/019.yaml
  text: '1[1]. And in the first year of the first week in the forty-eighth jubilee, Abraham returned and dwelt opposite Hebron—that is, Kiriath-arba—for two weeks of years.

    2. And in the first year of the third week of this jubilee, the days of Sarah’s life were completed, and she died in Hebron.

    3. And Abraham went to mourn for her and to weep for her, and to remember her with restraint of spirit, and he did not become violent in the speech of his mouth.

    4. And he was composed in this patience of spirit, and he spoke with the sons of Heth

    5. so that they might give him a place in which to bury his dead there. And the LORD gave him favor before all who saw him, and he entreated courteously from the sons of Heth, and they gave him the land of the double cave which is opposite Mamre—

    6. that is, Hebron—for four hundred pieces of silver. And they urged him, saying, “We will give it to you for nothing,” but he did not take it from their hands, because he gave the full price of silver for the place.

    7. And he bowed down to them, and after this he buried his dead in the double cave[2]. And all the days of Sarah’s life were one hundred and twenty-seven years: two jubilees and four weeks of years

    8. and one year. These were the days of Sarah’s life. This was the tenth trial by which Abraham was tried,

    9. and he was found faithful, patient in spirit. And he did not speak a word concerning the report about the land, how the LORD had said he would give it to him and to his seed after him, yet he asked there for a place to bury his dead, because he was found faithful, and it was written down for him as a friend of the LORD on the heavenly tablets.

    10. And in the fourth year of it he took a wife for Isaac his son, and her name was Rebekah, daughter of Bethuel, son of Nahor, Abraham’s brother, sister of Laban, and granddaughter of Milcah, who was the wife of Nahor, Abraham’s brother.

    11. And Abraham took for himself a third wife, and her name was Keturah, from among the daughters of his household servants,

    12. for Hagar had died before Sarah. And she bore him six sons: Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah, in two weeks of years.

    13. And in the sixth week, in its second year, Rebekah bore to Isaac two sons, Jacob and Esau. And Jacob was smooth and upright, but Esau was a harsh man, a man of the field,

    14. and hairy. And Jacob dwelt in tents. And the youths grew, and Jacob learned writing, but Esau did not learn, because he was a man of the field and a hunter, and he learned war,

    15. and all his deeds were fierce. And Abraham loved Jacob, but Isaac loved Esau. And Abraham saw the deeds of Esau, and he knew that in Jacob his name and seed would be called. And he called Rebekah and gave command concerning Jacob, because he knew that she loved Jacob much more

    17. than Esau. And he said to her, “My daughter, keep my son Jacob, for he will be in my place on the earth, and for a blessing in the midst of the sons of men, and for the glory of all the seed of Shem.

    18. For I know that the LORD will choose him for himself as a people

    19. who will stand out from among all the nations that are on the face of the earth. And now Isaac my son

    20. loves Esau more than Jacob, but I see your righteous affection for Jacob. And continue still to show him kindness, and let your eyes be upon him in love, because he will be a blessing on the earth from now and through all the generations of the earth.

    21. Let your hands be strong, and let your heart rejoice in your son Jacob, because I have loved him far more than all

    22. my sons. Forever let him be blessed, and let his seed be one that fills the whole earth.

    23. If a man can count the sand of the earth, then his seed also will be counted. And all the blessings with which the LORD blessed me

    24. and my seed shall belong to Jacob and to his seed always. And in his seed my name and the name of my fathers—Shem and Noah and Enoch and Mahalalel and Enosh and Seth

    25. and Adam—shall be blessed. And they shall serve to support heaven and to strengthen the earth and to renew all

    26. the lights that are above the firmament.” And he called Jacob before the eyes of Rebekah his mother,

    27. and he kissed him and blessed him and said, “Jacob, my beloved son, whom my soul loves, may God Most High bless you and give you all the blessings with which he blessed Adam and Enoch and Noah; and whatever he has spoken to me and whatever he said he would give me, may it cling to you and to your seed forever, according to the days of heaven above the earth. And may the spirits of Mastema not rule over you or over your seed, to turn you away from the LORD, who is your God from now and forever. And may the LORD be a father to you, and you be his firstborn son and to the people always. Go, my son, in peace.” And the two of them went out together from Abraham. And Rebekah loved Jacob with all her heart and with all her soul, much more than Esau[5][4][3], but Isaac loved Esau much more than Jacob.'
  footnotes:
  - marker: '1'
    text: 'The chapter numbering in the source rows is slightly irregular: the material labeled verse 16 is absent, and the final long blessing is labeled 27. The translation preserves the supplied numbering rather than renumbering the chapter.'
    reason: segmentation_note
  - marker: '2'
    text: '''The double cave'' reflects the Ge''ez wording literally. It corresponds conceptually to the burial cave known from Genesis, but the translation avoids importing the familiar place-name into the main text where the Ethiopic phrase is descriptive.'
    reason: lexical_alternative
  - marker: '3'
    text: Verse 8 likely means that Sarah’s death constituted the tenth test by which Abraham was tested. The syntax is compressed in the source, so the English makes the implied connection explicit.
    reason: segmentation_note
  - marker: '4'
    text: In verse 9, 'the report about the land' is textually difficult. The sense appears to be that Abraham did not complain about the promise of the land even though he had to request a burial place within it.
    reason: textual_variant
  - marker: '5'
    text: 'Verses 24-26 use elevated cosmological language: ''support heaven,'' ''strengthen the earth,'' and ''renew all the lights above the firmament.'' This is preserved as-is rather than reduced to a mere metaphor for prosperity.'
    reason: cultural_note
translation:
  language: ko
  text: '1. 그리고 쉰여덟째 희년의 첫째 주의 첫해에 아브라함은 돌아와 헤브론 맞은편, 곧 기럇아르바에 또 한 주간의 해 동안 머물렀습니다.

    2. 그리고 이 희년의 셋째 주 첫해에 사라가 살았던 날들이 다하고, 그녀는 헤브론에서 죽었습니다.

    3. 아브라함은 그녀를 위해 애도하고 장사하려고 갔으며, 우리는 그의 영이 참을성 있는지 그를 시험했고, 그는 입술의 말에서 난폭해지지 않았습니다.

    4. 그는 마음속으로 인내하며 헷의 자손들에게 말했습니다.

    5. 그는 헷의 자손들과 말하여, 그들이 그에게 그의 죽은 이를 장사할 곳을 주도록 하였습니다. 야훼께서는 그를 보는 모든 사람 앞에서 그에게 호의를 베푸셨고, 그는 헷의 자손들에게 정중하게 간청하였습니다. 그들은 마므레 맞은편에 있는 두 굴의 땅을 그에게 주었습니다.

    6. 곧 헤브론, 은 사백 개였습니다. 그들은 그에게 권하며 말했습니다. “우리가 당신에게 그것을 거저 드리겠습니다.” 그러나 그는 그곳을 위해 은으로 온전한 값을 치렀으므로, 그것을 그들의 손에서 거저 받지 않았습니다.

    7. 그는 그들에게 다시 몸을 굽혔습니다. 그 뒤에 그는 죽은 이를 그 두 겹으로 된 동굴에 장사하였습니다. 사라가 산 날은 모두 백이십칠 년이었습니다. 곧 두 희년과 네 주간의 해였습니다.

    8. 그리고 한 해였습니다. 이것들이 사라가 살았던 날들이었습니다. 이것이 아브라함이 시험받은 열 번째 시험이었습니다.

    9. 이 일에서 아브라함은 신실하고 마음이 인내하는 이로 인정받았습니다. 그는 야훼께서 그 땅을 그와 그의 뒤를 이을 후손에게 주겠다고 말씀하신 약속에 관하여 한마디도 하지 않았습니다. 그러나 그는 거기서 자기 죽은 자를 묻을 곳을 청했습니다. 이는 그가 신실한 이로 인정받았기 때문이며, 그는 하늘의 돌판들에 야훼의 친구로 기록되었습니다.

    10. 그리고 그 넷째 해에 아브라함은 자기 아들 이삭을 위하여 아내를 맞이하게 하였는데, 그녀의 이름은 리브가였습니다. 리브가는 아브라함의 형제 나홀의 아들 브두엘의 딸이자 라반의 누이이며, 또 브두엘의 딸이었습니다. 브두엘은 아브라함의 형제 나홀의 아내 밀가의 아들이었습니다.

    11. 그리고 아브라함은 세 번째 아내를 맞이하였습니다. 그의 이름은 게두라였는데, 그는 자기 집안 종들의 딸들 가운데 한 사람이었습니다.

    12. 이는 하갈이 사라보다 먼저 죽었기 때문입니다. 그리고 그녀는 그에게 아들 여섯, 곧 시므란, 욕산, 므단, 미디안, 이스박, 수아를 두 이레의 해 동안 낳았습니다.

    13. 그리고 여섯째 주의 둘째 해에 리브가가 이삭에게 두 아들, 야곱과 에서를 낳았습니다. 야곱은 매끈하고 올곧은 사람이었지만, 에서는 사나운 사람이었고 들에서 사는 사람이었습니다.

    14. 그리고 털이 많았습니다. 야곱은 천막에서 살았습니다. 소년들이 자라났고, 야곱은 글쓰기를 배웠으나 에서는 배우지 않았습니다. 이는 그가 들판의 사람이자 사냥꾼이었고, 전쟁을 익혔기 때문입니다.

    15. 그리고 에서가 한 모든 일은 사나웠습니다. 아브라함은 야곱을 사랑했고, 이삭은 에서를 사랑했습니다. 아브라함은 에서가 한 일들을 보고, 야곱을 통하여 자신의 이름과 후손이 불리게 될 것을 알았습니다. 그래서 그는 리브가를 불러 야곱에 관하여 그에게 명령하셨습니다. 그가 리브가가 야곱을 더욱 사랑한다는 것을 알고 있었기 때문입니다.

    17. 에서보다 더하였습니다. 그리고 그가 그에게 말했습니다. 「내 딸아, 내 아들 야곱을 지키십시오. 그는 땅 위에서 나를 대신할 것이며, 사람들 가운데에서 복이 될 것이며, 셈의 모든 자손을 위할 것입니다.」

    18. 이는 내가 주께서 그를 자신을 위한 한 백성으로 택하실 것을 알기 때문입니다.

    19. 그는 땅 위의 모든 민족 가운데서 두드러지게 될 것입니다. 이제 내 아들 이삭아,

    20. 그는 에서를 야곱보다 더 사랑합니다. 그러나 나는 그대가 야곱을 향해 지닌 의로운 사랑을 봅니다. 계속해서 그에게 친절을 베풀고, 사랑으로 그를 바라보십시오. 그는 이제부터 땅의 모든 세대에 걸쳐 땅 위의 복이 될 것이기 때문입니다.

    21. 이제부터 땅 위에, 땅의 모든 세대에 이르기까지 복이 있게 하시기를 바랍니다. 당신의 손이 강건해지고, 당신의 마음이 당신의 아들 야곱으로 말미암아 기뻐하기를 바랍니다. 내가 그를 그들 모두보다 훨씬 더 사랑했기 때문입니다.

    22. “내 아들들아. 그가 영원토록 복을 받고, 그의 후손이 온 땅을 가득 채우기를 바랍니다.”

    23. 사람이 땅의 모래를 셀 수 있다면, 그의 자손도 헤아려질 것입니다. 그리고 그가 내게 복을 베푼 모든 복은

    24. 하나님께서 영원토록 저와 제 자손의 하나님, 야곱과 그의 자손의 하나님이 되게 하소서. 그리고 그의 자손 안에서 제 이름과 제 조상들의 이름, 곧 셈과 노아와 에녹과 마할랄엘과 에노스와 셋의 이름이 복을 받게 하소서.

    25. 그리고 아담. 그들은 하늘을 세우고 땅을 굳게 하며 모든 것을 새롭게 하기 위한 이들이 될 것입니다.

    26. “궁창 위에 있는 광명들.” 그리고 그는 야곱의 어머니 리브가가 보는 앞에서 야곱을 불렀습니다.

    27. 그가 그에게 입맞추고 축복하며 말했습니다. 「야곱아, 내 사랑하는 아들아, 내 영혼이 사랑하는 자야, 궁창 위에 계신 하나님께서 너를 복 주시고, 아담과 에녹과 노아와 셈에게 복 주신 모든 복을 너에게 주시기를 바랍니다. 또 그분께서 내게 말씀하신 모든 것과 내게 주시겠다고 말씀하신 모든 것이 하늘이 땅 위에 있는 날들과 같이 영원히 너와 네 씨 위에 머물기를 바랍니다. 마스테마의 영들이 너나 네 씨에게 닥쳐, 너의 하나님이신 주를 따르는 데서 너를 떠나게 하지 못하기를 바랍니다. 주 하나님께서 너에게 아버지가 되시고, 너는 그분의 맏아들이 되며, 그분께서는 모든 날 동안 백성에게도 아버지가 되시기를 바랍니다. 내 아들아, 평안히 가십시오.」 그 두 사람은 함께 아브라함에게서 나왔습니다. 리브가는 온 마음과 온 영혼으로 야곱을 사랑하여 에서보다 그를 훨씬 더 사랑했으나, 이삭은 야곱보다 에서를 훨씬 더 사랑했습니다.'
