  alternative_readings:
  - the rich person
  - the rich one
  rationale: The singular masculine is retained as a representative figure in keeping with the project's gender-accurate policy, without implying exclusion of women from the warning's scope.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: Scope of πορείαις in the warning to the rich
  chosen_reading: pursuits
  alternative_readings:
