  review_summary: “Buried by death” is unnatural and obscures the established use of מָוֶת for pestilential death or plague in judgment contexts, including the close sword-famine-plague sequence here. “Those who remain after him” also better identifies the remnant left after the preceding losses. The plural “his widows” is preserved without resolving whose deaths made them widows.
