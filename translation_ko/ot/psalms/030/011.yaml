translation:
  language: ko
  text: 주께서 나의 애통을 내게 춤으로 바꾸시고, 나의 굵은 베 옷을 벗기시며 나를 기쁨으로 띠 띠우셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע
  english_pob_choice: Hear
  chosen_korean: 들으소서
  alternatives_korean:
  - 들으십시오
  - 들어 주십시오
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 간구의 명령형으로, 한국어 기도문체에서는 ‘들으소서’가 간구의 긴박함과 호소성을 가장 자연스럽게 살립니다.
- source_word: וְחָנֵּנִי
  english_pob_choice: and be gracious to me
  chosen_korean: 제게 은혜를 베푸소서
  alternatives_korean:
  - 제게 자비를 베푸소서
  - 제게 은총을 베푸소서
  lexicon: HALOT
  rationale: חנן의 핵심 뜻을 ‘은혜를 베풀다’로 옮겨, 영어 POB가 유지한 은혜/은총의 뉘앙스를 한국어에서도 보존했습니다.
- source_word: עֹזֵר לִי
  english_pob_choice: my helper
  chosen_korean: 제 도움자가 되어 주십시오
  alternatives_korean:
  - 저를 돕는 분이 되어 주십시오
  - 제 도움이 되어 주십시오
  lexicon: HALOT
  rationale: 분사형 עֹזֵר의 지속적·인격적 도움의 의미를 살리되, ‘도움자’라는 표현이 한국어에서 다소 낯설 수 있어 기도문체로 자연스럽게 풀었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문맥상 동일한 신적 고유명사를 일관되게 ‘야훼’로 옮겨, 전통적 대체 호칭보다 원문 고유명을 드러냈습니다.
theological_decisions:
- issue: 신적 호칭의 직접 호명
  chosen_reading: ‘들으소서… 야훼여…’처럼 직설적 기도 호칭을 유지했습니다.
  alternative_readings:
  - 보다 완곡한 서술형 기도문
  - 전통적 ‘주여’ 호칭
  rationale: 시편의 탄원은 하나님께 직접 말하는 예배 언어이므로, 명령형 간구와 호격을 약화하지 않고 보존하는 것이 원문의 정서와 기능을 더 잘 전달합니다.
  doctrine_reference: 시편 탄원시의 기도 언어
