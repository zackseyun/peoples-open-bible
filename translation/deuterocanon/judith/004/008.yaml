    prior_rendering: the approach was narrow enough for all the men to go two abreast
    new_rendering: the approach was so narrow that men could pass only two abreast
    rationale: The point is a restriction on the enemy's frontage, not sufficient room for two men; 'only' conveys the defensive advantage.
