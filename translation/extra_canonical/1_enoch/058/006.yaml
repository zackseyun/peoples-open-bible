translation:
  text: There will be light that cannot be counted, and it will not be bounded by a number of days. For darkness
    was first examined, and light will stand firm before the Lord of Spirits. Upright light will stand firm for
    ever before the Lord of Spirits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The first denial concerns light that cannot be counted, followed by a denial of a limit measured in days.
      The darkness verb is from asking or examination, not another occurrence of passed away. The two following
      light-standing clauses are both retained.
    reason: lexical_alternative
