  lexicon: HALOT
  rationale: 히브리어의 משפט/דבר 병행을 한국어로도 법정·언어의 병행으로 살리되, ‘justified’의 부담을 ‘의로우시고’로, ‘blameless/pure’의 의미를 ‘흠 없음’으로 옮겨 판단 장면의 무결성을 유지했습니다.
theological_decisions:
- issue: ‘against you alone’의 절대적 하나님-향성
  chosen_reading: 인간 피해를 지우지 않되, 죄의 궁극적 상대가 하나님이라는 고백을 본문 그대로 유지했습니다.
  alternative_readings:
  - 주님께 가장 크게
  - 주님을 우선적으로
  rationale: 시편의 탄식-회개 문맥에서 본문은 죄의 최종적 성격을 하나님께 대한 반역으로 제시하므로, 이를 완화하는 해석어를 본문에 넣지 않았습니다.
  doctrine_reference: 죄의 신학적 궁극성
