base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/014.yaml
  text: I am not able, I alone, to carry all this people, because it is too heavy for me.
translation:
  language: ko
  text: 저 혼자서는 이 모든 백성을 감당할 수 없습니다. 제게는 너무 무겁습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אוּכַ֤ל אָנֹכִי֙ לְבַדִּי
  english_pob_choice: I am not able, I alone
  chosen_korean: 저는 혼자서는 감당할 수 없습니다
  alternatives_korean:
  - 저는 저 혼자서는 감당할 수 없습니다
  - 저는 홀로서는 이 일을 맡을 수 없습니다
  lexicon: לא + יכול + לבד
  rationale: אָנֹכִי/לְבַדִּי의 강조를 살려 ‘혼자서는’으로 옮기고, 능력 부정은 현대 한국어에서 자연스러운 ‘감당할 수 없습니다’로 표현했습니다.
- source_word: לָשֵׂאת
  english_pob_choice: to carry
  chosen_korean: 감당할 수 없습니다
  alternatives_korean:
  - 짊어질 수 없습니다
  - 메고 갈 수 없습니다
  lexicon: נשא
  rationale: 문맥상 물리적 운반보다 백성 전체를 맡아 감당하는 부담이므로, 한국어에서 더 정확한 책임·부담 표현을 선택했습니다.
- source_word: אֶת כָּל הָעָם הַזֶּה
  english_pob_choice: all this people
  chosen_korean: 이 모든 백성
  alternatives_korean:
  - 이 모든 사람들
  - 이 온 백성
  lexicon: עם
  rationale: 대상 전체를 가리키는 직역성을 유지하면서도 현대 독자가 이해하기 쉬운 집합 명사 ‘백성’을 택했습니다.
- source_word: כִּי כָבֵד מִמֶּנִּי
  english_pob_choice: because it is too heavy for me
  chosen_korean: 그것은 제게 너무 무겁습니다
  alternatives_korean:
  - 그것은 제게 과중합니다
  - 그 짐이 제게 너무 큽니다
  lexicon: כבד
  rationale: ‘무겁다’의 기본 의미를 살리되, 부담의 비유적 뜻이 분명하게 드러나도록 한국어 어순을 다듬었습니다.
theological_decisions:
- issue: 모세의 진술에서 ‘carry’의 의미를 어떻게 살릴지
  chosen_reading: 물리적 운반이 아니라 지도·책임의 감당이라는 함의를 살려 번역했습니다.
  alternative_readings:
  - 직역적으로 ‘짊어질 수 없습니다’
  - ‘맡아 처리할 수 없습니다’
  rationale: 문맥상 모세는 백성 전체를 이끌 책임의 무게를 말하므로, 한국어에서도 부담/책임의 의미가 함께 전달되도록 했습니다.
  doctrine_reference: 민수기 11장의 지도자 과중 부담 문맥
