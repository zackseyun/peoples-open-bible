theological_decisions:
- issue: Status of Abrahamic descent
  chosen_reading: John rejects reliance on physical descent from Abraham as sufficient grounds for security before God.
  rationale: The verse directly challenges confidence in ancestry while affirming God's freedom and power to create true children for Abraham apart from presumed lineage. The translation keeps this polemical force without adding later doctrinal formulations.
  doctrine_reference: Affirmations; Translation philosophy §3
- issue: Context-sensitive reorientation terminology
  chosen_reading: Therefore produce fruits worthy of reorientation toward God[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
