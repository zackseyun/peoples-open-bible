id: JOB.20.22
reference: Job 20:22
source:
  edition: WLC
  text: בִּ/מְלֹ֣אות שִׂ֭פְק/וֹ יֵ֣צֶר ל֑/וֹ כָּל יַ֖ד עָמֵ֣ל תְּבוֹאֶֽ/נּוּ־׃
translation:
  text: At the height of his abundance, he will be in distress; every hand of the afflicted[a] will come against him.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “every toiler's hand”; the Hebrew term can describe those who labor or suffer.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּמְלֹאות
  chosen: In the fullness of
  alternatives:
  - When ... is full
  - At the height of
  lexicon: HALOT
  rationale: 'The preposition ב plus infinitive/nominal form from מלא conveys a temporal-circumstantial sense: ''in/when there is fullness.'' ''In the fullness of'' preserves the Hebrew imagery and timing without over-paraphrasing.'
- source_word: שִׂפְקוֹ
  chosen: his abundance
  alternatives:
  - his sufficiency
  - his plenty
  - his prosperity
  lexicon: HALOT
  rationale: The noun from ספק here denotes sufficiency or plenty. In context of the wicked man's prosperity, 'abundance' is idiomatic modern English and fits the parallel with impending calamity. 'Sufficiency' is more literal but less natural.
- source_word: יֵצֶר לוֹ
  chosen: he will be in distress
  alternatives:
  - he will be in straits
  - it will be narrow for him
  - he will be distressed
  lexicon: HALOT
  rationale: The construction describes his being in constriction or distress.
- source_word: כָּל
  chosen: every
  alternatives:
  - all
  lexicon: HALOT
  rationale: '''Every'' works naturally with the singular collective expression ''hand'' and conveys distributive force.'
- source_word: יַד
  chosen: hand
  alternatives:
  - power
  - force
  lexicon: HALOT
  rationale: Hebrew 'hand' often metonymically denotes power or agency. Retaining 'hand' preserves the vivid idiom, while the following phrase 'come against him' makes the hostile agency clear.
- source_word: עָמֵל
  chosen: the afflicted
  alternatives:
  - the laborer
  - the toiler
  - the miserable
  - the troublemaker
  lexicon: HALOT
  rationale: This is a natural contextual rendering while the note preserves viable alternatives.
- source_word: תְּבוֹאֶנּוּ
  chosen: will come against him
  alternatives:
  - will come upon him
  - will overtake him
  lexicon: HALOT
  rationale: The verb בוא with pronominal object means 'come upon/to him.' Given the hostile context, 'against him' makes explicit the adversative force implied by 'every hand' without departing far from the Hebrew.
- source_word: בִּמְלֹאות שִׂפְקוֹ
  chosen: At the height of his abundance
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This naturally renders fullness of his sufficiency or plenty as the time of the calamity.
