  language: ko
  text: 그녀가 죽임을 당하러 끌려가고 있을 때, 하나님께서는 다니엘이라는 더 어린 소년의 거룩한 영을 일으키셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαγομένης ... ἀπολέσθαι
  english_pob_choice: being led away to be put to death
  chosen_korean: 죽임을 당하게 끌려가고 있을 때
  alternatives_korean:
  - 처형당하러 끌려가고 있을 때
  - 죽게 되도록 끌려가고 있을 때
  lexicon: ἀπάγω, ἀπόλλυμι
  rationale: 수동적 진행과 죽음에 이르는 목적을 함께 살려, 단순한 ‘데려가다’보다 사형 집행을 향한 끌려감임을 분명히 했습니다.
- source_word: ὁ θεός
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: θεός
  rationale: POB 기본 용례에 따라 표준 개신교 번역어인 ‘하나님’을 사용했습니다.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  english_pob_choice: the holy spirit
  chosen_korean: 거룩한 영
  alternatives_korean:
  - 성령
  - 거룩한 성령
  lexicon: πνεῦμα + ἅγιος
  rationale: 이 본문에서는 인격적 칭호로 굳어진 성령 표현보다, 그레코-헬라어 원문의 직설적인 ‘거룩한 영’을 살려 번역했습니다.
- source_word: παιδαρίου νεωτέρου
  english_pob_choice: a younger boy
  chosen_korean: 더 어린 소년
  alternatives_korean:
  - 어린 소년
  - 나이 어린 소년
  lexicon: παῖς/παιδάριον + νεώτερος
  rationale: POB의 ‘younger’를 반영해 단순히 ‘어린’이 아니라 비교급 뉘앙스가 드러나도록 ‘더 어린’으로 옮겼습니다.
theological_decisions:
- issue: τὸ πνεῦμα τὸ ἅγιον의 인격화 여부
  chosen_reading: 본문의 문법 형태를 따라 ‘거룩한 영’으로 두되, 한국 독자가 삼위일체적 성령 호칭으로 자동 치환하지 않도록 했습니다.
  alternative_readings:
  - 성령
  - 성스러운 영
  rationale: 이 구절은 서술형으로 ‘하나님께서 ... 영을 일으키셨다’고 말하므로, 본문의 표현을 과도하게 교회 용어로 평탄화하지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: 수산나 1:45의 서술 구조와 LXX 문체
