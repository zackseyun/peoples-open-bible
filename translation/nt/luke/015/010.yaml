id: LUK.15.10
reference: Luke 15:10
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
translation:
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who reorients toward God[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'Thus' or 'So' at the start of the sentence.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the presence of the angels of God.' The wording does not explicitly say that the angels themselves are the ones rejoicing.
    reason: alternative_reading
  - marker: c
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  chosen: In the same way
  alternatives:
  - Thus
  - So
  lexicon: BDAG
  rationale: Introduces an analogy/application from the preceding parable. 'In the same way' is natural English and preserves the comparative force better than the more abrupt 'thus'.
- source_word: λέγω ὑμῖν
  chosen: I tell you
  alternatives:
  - I say to you
  lexicon: BDAG
  rationale: A common discourse formula. 'I tell you' is idiomatic modern English while retaining the direct address and emphatic transition.
- source_word: γίνεται χαρά
  chosen: there is joy
  alternatives:
  - joy arises
  - joy happens
  - joy comes to be
  lexicon: BDAG
  rationale: γίνομαι with a nominative predicate here expresses occurrence/existence. 'There is joy' is clear, idiomatic, and captures the sense without woodenness.
- source_word: ἐνώπιον
  chosen: before
  alternatives:
  - in the presence of
  - in the sight of
  lexicon: BDAG
  rationale: The preposition denotes presence or sphere before someone. 'Before' is concise and natural; 'in the presence of' is possible but heavier.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  chosen: the angels of God
  alternatives:
  - God's angels
  lexicon: BDAG
  rationale: A straightforward genitival construction. 'The angels of God' preserves the formal phrasing and echoes biblical style without obscurity.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  chosen: over one sinner
  alternatives:
  - because of one sinner
  - concerning one sinner
  lexicon: BDAG
  rationale: ἐπί with the dative here marks the occasion or basis for rejoicing. 'Over one sinner' is the standard and most natural English expression for joy occasioned by someone.
- source_word: μετανοοῦντι
  chosen: who has a reorientation toward God
  alternatives:
  - who has a change of mind
  - repenting
  - who is repenting
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
