  from: I saw the ram charging westward and northward and southward[a], and no beasts could stand before him, and there was no one who could rescue from his hand. He did as he pleased and became great.
  to: I saw the ram charging westward, northward, and southward. No beast could withstand it, and no one could rescue anyone from its power. It did as it pleased and became great.
