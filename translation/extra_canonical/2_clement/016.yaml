translation:
  text: 'Therefore, brothers and sisters, since we have found no small opportunity for repentance[a], seeing that we have time, let us return to God who called us, while we still have One who receives us.


    For if we bid farewell to these enjoyments and conquer our soul by refusing to fulfill its evil desires, we shall be partakers of the mercy of Jesus.


    But you know that the day of judgment comes even now as a burning oven, and the powers of the heavens shall melt, and all the earth as lead melting on the fire; and then the secret and open works of human beings shall appear.


    Almsgiving, therefore, is a good thing, even as repentance from sin&gt; Fasting is better than prayer, but almsgiving better than both. And love covers a multitude of sins, but prayer out of a good conscience delivers from death. Blessed is everyone found full of these. For almsgiving lifts off the burden of sin.'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - Provisional rendering based on the supplied public-domain English witness; direct review of the Greek remains necessary.
  - The malformed “sin&gt;” in the witness was treated as a sentence break.
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in the exhortation to moral change while there is time; preserve the authors own baptismal and ethical claims rather than harmonizing them. This reader text remains an adaptation of the recorded English witness, not a verbatim quotation or a newly verified translation of the ancient-language text. The witness is unchanged.
    reason: lexical_alternative
