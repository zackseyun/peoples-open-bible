  text: But let this be said by way of reminder for us; now we must proceed with the narrative in a few words.
translation:
  language: ko
  text: 다만 이것은 우리에게 상기시키는 말로 해 둡시다. 이제 몇 마디로 서술을 이어 가야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν ἕως ὑπομνήσεως
  english_pob_choice: But let this be said by way of reminder for us
  chosen_korean: 다만 이것은 우리에게 상기시키는 말로 하게 하십시오
  alternatives_korean:
  - 그러나 이것은 우리를 위한 상기용으로 말하게 하십시오
  - 다만 이것은 우리를 기억나게 하는 말로 하십시오
  lexicon: ἔως ὑπομνήσεως / ὑπόμνησις
  rationale: ἕως ὑπομνήσεως는 ‘상기시키는 용도/차원에서’라는 부사적 표현이므로, 내용을 덧붙이는 것이 아니라 ‘상기시키는 말’로 기능을 살려 옮겼습니다.
- source_word: ἡμῖν
  english_pob_choice: for us
  chosen_korean: 우리에게
  alternatives_korean:
  - 우리를 위해
  - 우리에게로
  lexicon: dative of reference
  rationale: 여기서 여격 ἡμῖν은 ‘우리에게/우리를 위해’의 범위를 가리키므로, 한국어에서는 자연스러운 대상 표지인 ‘우리에게’로 옮겼습니다.
- source_word: εἰρήσθω
  english_pob_choice: let this be said
  chosen_korean: 말하게 하십시오
  alternatives_korean:
  - 말해지게 하십시오
  - 말해 두게 하십시오
  lexicon: λέγω, imperative passive
  rationale: 수동 명령형의 뉘앙스를 살리되 한국어에서는 무생물 주어에 ‘말해지게’보다 문체가 덜 거칠고 공적인 ‘말하게 하십시오’가 더 자연스럽습니다.
- source_word: διήγησις
  english_pob_choice: the narrative
  chosen_korean: 이야기
  alternatives_korean:
  - 서술
  - 서사
  lexicon: διήγησις
  rationale: διήγησις는 ‘서술/이야기/기록’의 범위를 가지지만, 본문 흐름상 이미 다루는 사건들을 간략히 이어 가는 뜻이므로 ‘이야기’를 택했습니다.
theological_decisions:
- issue: 저자가 독자를 포함해 말하는 1인칭 복수의 범위
  chosen_reading: ‘우리’는 서술자와 청중을 함께 포괄하는 수사적 1인칭 복수로 유지했습니다.
  alternative_readings:
  - 단순한 편집자적 ‘저희에게’로 축소
  - 일반적인 ‘사람들에게’로 비개인화
  rationale: 본문의 ἡμῖν은 독자와 공유되는 기억을 전제하는 서술 장치이므로, 한국어도 그 포괄성을 살려 ‘우리’로 유지하는 것이 원문의 기능을 가장 잘 드러냅니다.
  doctrine_reference: 서술자-청중 관계와 공동 기억의 수사학
