translation:
  language: en
  text: Sorrow[r1] aligned with God produces reorientation toward God leading to salvation without regret.[a] But worldly sorrow produces death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may describe the repentance more directly as something never to be regretted.
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: godly sorrow
  simplified_phrase: sorrow aligned with God
  preserved_meaning: This sorrow is measured by or in keeping with God, in contrast to worldly sorrow.
  reasoning_layer_used: lexical decision for κατὰ θεὸν
  rationale: The expanded wording makes the kind of sorrow clearer without changing the contrast.
translation_notes:
  risk_flags:
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
