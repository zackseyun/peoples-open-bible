  to: Then, when Judas, who had betrayed him, saw that he had been condemned, he regretted it and returned the thirty silver coins to the chief priests and elders.
  rationale: The current syntax, which stacks a subject, a relative clause, and a participial phrase before the main verbs, is grammatically valid but stylistically awkward. It slightly hinders readability by separating the subject 'Judas' from the action 'seeing'. Converting the temporal participle 'ἰδὼν' (seeing) into a subordinate temporal clause ('when... saw') is a standard translation technique that results in a more natural and immediately clear English sentence structure.
