base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/001.yaml
  text: My God, my God, why have you forsaken me? Why are you far from saving me, far from the words of my roaring?[a]
  footnotes:
  - marker: a
    text: Or “my groaning” or “my cry.” The Hebrew literally uses “my roaring” for the speaker’s anguished cries.
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 하나님, 나의 하나님, 어찌하여 저를 버리셨습니까? 제 울부짖음의 말들은 제 구원에서 멀리 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘내 구원에서 멀리, 내 울부짖음의 말들’입니다. 이 압축된 구문은 ‘하나님께서 구원에서 멀리 계신다’는 뜻으로도 이해되어 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
