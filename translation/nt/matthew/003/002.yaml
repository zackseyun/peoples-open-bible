id: MAT.3.2
reference: Matthew 3:2
source:
  edition: SBLGNT
  text: ⸀καὶ λέγων· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
translation:
  text: and saying, “Reorient toward God[c][a], for the kingdom of heaven has drawn near[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "Repent." The Greek calls for changed disposition and direction in response to the kingdom proclamation. "Toward God" makes the contextual direction explicit; it is not contained in the verb by itself. Sorrow is neither the whole meaning nor excluded.
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'the kingdom of the heavens has come near.'
    reason: lexical_alternative
  - marker: c
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  chosen: and
  alternatives:
  - while
  - then
  lexicon: BDAG
  rationale: Standard coordinating conjunction linking this participial clause to the preceding narrative. 'And' is the most natural and sufficiently formal rendering.
- source_word: λέγων
  chosen: saying
  alternatives:
  - preaching
  - proclaiming
  lexicon: BDAG
  rationale: Present active participle of λέγω, modifying the implied subject from the previous verse. 'Saying' preserves the participial form and avoids importing the more specific idea of heralding unless context explicitly requires it.
- source_word: Μετανοεῖτε
  chosen: Reorient toward God
  alternatives:
  - Change your thinking
  - Repent
  - Change your mind
  - Rethink everything
  - Turn back
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added. Anchor the existing terminology note to the changed term and the heavens note to the kingdom clause. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
- source_word: ἤγγικεν
  chosen: has drawn near
  alternatives:
  - is near
  - has come near
  lexicon: BDAG
  rationale: 'Perfect active indicative of ἐγγίζω. ''Has drawn near'' best reflects the perfect aspect: the kingdom has approached and is now near. It is more aspectually precise than the simple present ''is near.'''
- source_word: γὰρ
  chosen: for
  alternatives:
  - because
  lexicon: BDAG
  rationale: Introduces the ground for the command to repent. 'For' is concise and natural in English proclamation style.
- source_word: ἡ βασιλεία
  chosen: the kingdom
  alternatives:
  - the reign
  - the kingship
  lexicon: BDAG
  rationale: βασιλεία can denote reign/rule or kingdom. In Matthew's formulaic expression, 'the kingdom' is the most idiomatic English rendering and preserves the broad semantic range of God's royal rule and realm without over-narrowing to abstraction.
- source_word: τῶν οὐρανῶν
  chosen: of heaven
  alternatives:
  - of the heavens
  lexicon: BDAG
  rationale: Genitive plural literally 'of the heavens,' but Matthew's Jewish reverential circumlocution is conventionally and accurately rendered 'of heaven' in idiomatic English. This preserves meaning without awkward literalism.
