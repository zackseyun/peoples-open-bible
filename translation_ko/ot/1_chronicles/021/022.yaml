  - severity: low
    issue: 마지막 문장의 직설적 미래형
    rationale: וְתֵעָצַר는 다윗의 요청에 연결된 목적 또는 바람을 나타냅니다. ‘그치게 하십시오’로 옮기면 요청의 기능과 문맥상 인과를 더 잘 반영합니다.
  - severity: low
