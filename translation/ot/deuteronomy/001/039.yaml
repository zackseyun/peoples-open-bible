  meaning_decisions:
  - source_phrase: לָבַז יִהְיֶה
    prior_rendering: would become plunder
    new_rendering: would be taken as plunder
    rationale: The added verb makes clear that the feared outcome is capture by an enemy while preserving the image of vulnerable people treated as spoil.
  - source_phrase: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
    prior_rendering: who today do not know good or evil
    new_rendering: who today do not yet know good from evil
    rationale: The phrase describes immature discernment, not complete ignorance of everything good or evil; 'not yet' and 'good from evil' convey the childhood idiom without adding a doctrine of innocence.
