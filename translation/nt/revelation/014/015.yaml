id: REV.14.15
reference: Revelation 14:15
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
translation:
  text: Then another angel came out of the temple, crying out in a loud voice to the one seated on the cloud, “Swing your sickle[a] and reap, because the hour to reap has come and the harvest of the earth is fully ripe[b].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'Literally “Send your sickle.” The command echoes Joel 4:13 (3:13 in many English Bibles): “Swing the sickle, for the harvest is ripe.”'
    reason: cross_reference
  - marker: b
    text: Literally “has dried,” as grain does when it stands ready for harvest.
    reason: lexical_alternative
