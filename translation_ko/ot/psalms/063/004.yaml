  source_fidelity: 현 초안은 시편 63:4가 아니라 바로 앞 절인 63:3의 내용(‘주의 인애가 생명보다 낫습니다… 내 입술이 주님을 찬양합니다’)을 번역하고 있습니다. 63:4의 히브리어는 화자가 살아 있는 동안 하나님을 ‘송축하고’, 그 이름으로 손을 드는 서원을 말합니다. 개정문은 כֵּן의 앞 절 연결, בְחַיָּי의 지속 의미, בְּשִׁמְךָ의 해석상 여지를 보존합니다.
  naturalness: ‘이처럼’, ‘내가 사는 동안’, ‘주의 이름으로 내 손을 들겠습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 시편의 기도·찬양 문체에도 적절합니다. ‘송축하다’는 일상어는 아니지만 하나님을 향한 ברך의 방향성을 보존하는 한국어 성서 문체의 정착된 표현입니다.
  terminology: 하나님을 향한 אֲבָרֶכְךָ는 단순히 ‘찬양하다’로 평준화하지 않고 ‘송축하다’로 옮겼습니다. 이는 원문의 ‘복을 빌다/복되다 하다’라는 예배 언어를 비교적 투명하게 반영합니다. 대안인 ‘찬양하다’는 각주에 둡니다. ‘주의 이름으로’는 בְּ의 ‘이름 안에서/이름으로’라는 범위를 과도하게 한정하지 않습니다.
