  yaml_path: translation/ot/psalms/040/014.yaml
  text: Let those who seek to sweep away my life be put to shame and humiliated together; let those who delight in my harm turn back and be disgraced.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Be pleased, O LORD, to deliver me.'' The opening imperative can also be rendered ''Be willing'' or ''Take pleasure'' in delivering me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'make haste to help me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제 생명을 없애려 하는 자들이 모두 수치를 당하고 망신을 당하게 하십시오. 제가 해를 입기를 기뻐하는 자들은 물러가 수치를 당하게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְצֵה
  english_pob_choice: Be pleased
  chosen_korean: 기뻐하셔서
  alternatives_korean:
  - 기꺼이
  - 원하셔서
  - 기뻐해 주셔서
  lexicon: HALOT
  rationale: יהוה께 드리는 청원형으로, 단순한 부탁보다 하나님의 호의적 의지와 기꺼운 응답을 살려 ‘기뻐하셔서’로 옮겼습니다.
- source_word: לְהַצִּילֵנִי
  english_pob_choice: to deliver me
  chosen_korean: 저를 건져 주십시오
  alternatives_korean:
  - 저를 구해 주십시오
  - 저를 구원해 주십시오
  lexicon: HALOT
  rationale: נצל의 핵심은 위험에서 ‘건져내다/구해내다’이므로, 시편 청원의 긴박함을 살리면서도 ‘구원’의 신학적 확장을 과도하게 불러오지 않는 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명은 영어 POB의 ‘Yahweh’에 해당하지만, 한국어 본문에서는 예배 문체의 자연스러움과 가독성을 위해 ‘주님’을 사용했습니다. 다만 이는 신명 자체를 지우는 것이 아니라 한국어 호칭 관습에 따른 표기 선택입니다.
- source_word: חוּשָׁה
  english_pob_choice: hurry
  chosen_korean: 속히
  alternatives_korean:
  - 서둘러
  - 빨리
  - 급히
  lexicon: HALOT
  rationale: חוּשׁ의 급박한 속도감을 현대 한국어에서 가장 자연스럽게 전달하는 부사로 ‘속히’를 택했습니다.
theological_decisions:
- issue: 신명(יהוה)과 한국어 호칭의 처리
  chosen_reading: 본문에서는 ‘주님’으로 옮기되, 원문이 지시하는 인격적이고 언약적인 하나님의 이름을 지칭하는 청원으로 읽습니다.
  alternative_readings:
  - 야훼로 음역
  - 여호와로 음역
  - 주로 번역
  rationale: 시편의 기도문에서 직접 호명하는 호칭은 한국어 합쇼체에서 ‘주님’이 가장 자연스럽습니다. 다만 본문 의미는 일반적 ‘주’가 아니라 יהוה를 향한 직접 호소이므로, 번역상 호칭의 경건성과 원문의 인칭성을 함께 유지했습니다.
  doctrine_reference: POB Korean style note on divine address and YHWH rendering
