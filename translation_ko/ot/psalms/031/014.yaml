  yaml_path: translation/ot/psalms/031/014.yaml
  text: But as for me[a], I trust in you, O Yahweh; I say, “You are my God.”
  footnotes:
  - marker: a
    text: Or, 'I have trusted in you, O LORD; I have said, “You are my God.”' The Hebrew perfect forms can be rendered as past or present-perfect, but here they are expressed in English as present declarations of ongoing trust and confession.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는, 야훼여, 주님을 신뢰합니다. 저는 “주님은 저의 하나님이십니다”라고 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 완료형들은 ‘제가 주님을 신뢰했습니다’와 ‘저는 …라고 말했습니다’로도 옮길 수 있습니다. 여기서는 계속되는 신뢰와 현재의 고백을 나타내기 위해 현재형으로 번역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּת רַבִּים
  english_pob_choice: the whispering of many
  chosen_korean: 많은 사람의 속삭임
  alternatives_korean:
  - 많은 사람의 비방
  - 많은 사람의 소문
  - 많은 사람의 중상
  lexicon: HALOT
  rationale: דִּבָּה는 속삭임, 소문, 비방성 발언을 모두 포함할 수 있어, POB의 ‘whispering’을 살리면서도 한국어에서 음험한 밀담의 뉘앙스를 자연스럽게 전달했습니다.
- source_word: מָגוֹר מִסָּבִיב
  english_pob_choice: terror on every side
  chosen_korean: 사방이 공포였습니다
  alternatives_korean:
  - 사방이 두려움이었습니다
  - 온 사방에 공포가 있었습니다
  - 사방에서 공포가 밀려왔습니다
  lexicon: HALOT
  rationale: 이 표현은 주변을 에워싼 공포를 뜻하는 관용구이므로, 직역보다 한국어에서 같은 압박감을 주는 간결한 서술로 옮겼습니다.
- source_word: בְּהִוָּסְדָם יַחַד
  english_pob_choice: as they conspired together
  chosen_korean: 그들이 … 함께 음모를 꾸미며
  alternatives_korean:
  - 그들이 함께 모의하며
  - 그들이 함께 상의하며
  - 그들이 함께 결의하며
  lexicon: HALOT
  rationale: 문맥상 단순 협의가 아니라 적대적 모의이므로 ‘음모를 꾸미다’로 옮겼고, יַחַד의 결속을 ‘함께’로 분명히 했습니다.
- source_word: לָקַחַת נַפְשִׁי
  english_pob_choice: to take my life
  chosen_korean: 제 생명을 빼앗으려
  alternatives_korean:
  - 제 목숨을 빼앗으려
  - 제 생명을 취하려
  - 제 생명을 앗아가려
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 비물질적 ‘영혼’이 아니라 생명 자체를 가리키므로, 현대 한국어에서 직설적이고 분명한 ‘제 생명’을 선택했습니다.
theological_decisions:
- issue: 시편 화자의 박해 진술에서 감정 표현의 강도
  chosen_reading: ‘사방이 공포였습니다!’로 옮겨, 원문의 관용적 공포 표현이 주는 압박감을 유지했습니다.
  alternative_readings:
  - ‘사방이 두려움이었습니다’
  - ‘온 사방에 공포가 있었습니다’
  rationale: 히브리어 관용구를 완화하지 않고, 시편 화자가 실제로 둘러싸인 위협을 체감하는 정서를 살리는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 시편 31편의 탄식/박해 시편 문맥
- issue: נֶפֶשׁ의 번역
  chosen_reading: ‘생명’으로 번역해 공격의 표적이 ‘몸과 분리된 영혼’이 아니라 실제 삶 전체임을 드러냈습니다.
  alternative_readings:
  - ‘영혼’
  - ‘목숨’
  rationale: 시적 문맥에서 נֶפֶשׁ는 생명/자기 자신을 뜻하므로, 한국어 독자가 본문의 위협을 오해하지 않도록 했습니다.
  doctrine_reference: 히브리어 נֶפֶשׁ의 의미 범위
