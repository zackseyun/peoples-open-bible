  from: Take his garment, for he has put up security for a stranger; take a pledge from him for a foreign woman.[a]
  to: Take his garment as security, for he has guaranteed a stranger’s debt; take a pledge from him if he has done so for a foreign woman[a].
  rationale: The later audit corrected the personal suffix so that collateral is taken from the guarantor rather than the garment being treated as the suffix’s referent. That correction is preserved, and the financial transaction is clarified without narrowing “foreign woman” to an adulteress.
