translation:
  text: '1. “Remove sorrow from yourself,” he says,[a] “for it is a sister of double-mindedness and quick
    temper.”[b]


    2. “Sir,” I say, “how is it a sister of these? Quick temper seems to me one thing, double-mindedness
    another, and sorrow another.” He says, “You are a senseless man. Do you not understand that sorrow
    is more evil than all the spirits and most terrible for God’s servants?[c] More than all the spirits,
    it destroys a person, wears away the Holy Spirit,[d] and again saves.”[g]


    3. I say, “Sir, I am senseless. I do not understand these parables. I do not understand how it can
    wear away and again save.”


    4. He says, “Listen. Some people have never investigated the truth or sought the divine. They have
    only believed, and are mixed up with business, wealth, pagan friendships[f] and many other affairs
    of this age. All who devote themselves to these do not understand the parables of the divine.[e] These
    activities darken and corrupt them, and they become barren.”


    5. “Just as good vineyards[h] become barren from thorns and various weeds when neglected, so people
    who have believed and fall into the many activities already mentioned are led away from their understanding.
    They understand nothing at all about righteousness. Even when they hear about the divine and truth,
    their minds are occupied with their business, and they understand nothing at all.”


    6. “But those who fear God, investigate the divine and truth, and have their hearts toward the Lord
    understand and comprehend everything said to them more quickly.[i] They have the fear of the Lord
    within them. Where the Lord dwells, there is much understanding. So cling to the Lord, and you will
    understand and comprehend everything.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Sorrow renders lypē; grief or sadness are alternatives. The source personifies it as a sister
      of the other named vices.
  - marker: b
    reason: lexical_alternative
    text: Quick temper renders oxycholia; alternatives include irascibility or irritability.
  - marker: c
    reason: lexical_alternative
    text: Current DOCTRINE.md requires reader-facing servant. Bonded status, ownership and total allegiance
      remain part of the doulos metaphor; slave is recorded as a lexical alternative.
  - marker: d
    reason: lexical_alternative
    text: Ektrivein conveys wearing away or rubbing out. The translation retains the difficult assertion
      about the Holy Spirit without inserting an explanation of the Spirit’s nature.
  - marker: e
    reason: lexical_alternative
    text: The divine renders the abstract theotēs; alternatives include the Deity or God’s divine nature.
      The abstract wording is retained rather than replaced by a new doctrinal definition.
  - marker: f
    reason: lexical_alternative
    text: Pagan friendships renders philiais ethnikais, friendships of the nations. The phrase remains
      one named item among business, wealth and the other affairs in the source list.
  - marker: g
    reason: textual_variant
    text: The working Greek and Lake1907 Plate VII retain both wears away and again saves. Vulgata, Hilgenfeld1873
      printed56, and Palatina, Gebhardt/Harnack1877 printed107, also retain the saving assertion. Its
      object is not separately supplied in the Greek; the English does not insert a doctrinal explanation.
  - marker: h
    reason: textual_variant
    text: The working comparison begins kathōs, just as, a Hilgenfeld correction supported by versions
      according to the1891 apparatus. Lake1907 Plate VII line42 has kai hōs, and as. Working paragraph2
      likewise follows Harmer’s man/he-says reconstruction; Lake’s transcription has the vocative man
      without that attribution. Printed brackets around the conjunction and in the recorded source remain
      editorial marks, not unanimous manuscript wording.
  - marker: i
    reason: textual_variant
    text: Working paragraph6 reads more quickly understand and comprehend. Lake1907 Plate VII lines46–47
      instead prints tachinousi kai noousin; the1877 apparatus also reports differing transpositions and
      verb forms. Vulgata printed57 has perceive and immediately understand; Palatina printed107 has understand
      and quickly perceive. No complete verb-form or correcting-hand adjudication is claimed.
lexical_decisions:
- source_word: λύπη
  chosen: sorrow
  alternatives:
  - grief
  - sadness
  lexicon: LSJ
  rationale: Preserves the moral‑spiritual affect named, allowing personification (“she”) as in Greek;
    broader than “grief” and fits Hermas’s moral discourse.
- source_word: διψυχία
  chosen: double‑mindedness
  alternatives:
  - doubtfulness
  - two‑souledness
  lexicon: LSJ
  rationale: Standard rendering captures vacillation of mind central to Hermas; “two‑souledness” is transparent
    etymology but awkward.
- source_word: ὀξυχολία
  chosen: quick temper
  alternatives:
  - quick temper
  - irritability
  lexicon: LSJ
  rationale: The source names the quick-tempered disposition; irascibility is a lexical alternative.
- source_word: πνεύματα (τὰ)
  chosen: spirits
  alternatives:
  - influences
  - dispositions
  lexicon: LSJ
  rationale: Hermas treats moral forces as ‘spirits’; retain literal term to preserve his moral psychology.
- source_word: δοῦλοι (τοῦ θεοῦ)
  chosen: servants (of God)
  alternatives:
  - servants (of God)
  lexicon: LSJ
  rationale: Current DOCTRINE.md requires reader-facing servant; note c preserves bonded status, ownership
    and total allegiance.
- source_word: καταφθείρειν
  chosen: destroy
  alternatives:
  - destroy
  - corrupt
  lexicon: LSJ
  rationale: Destroy retains the force of the working verb; corrupt or ruin are alternatives.
- source_word: ἐκτρίβειν
  chosen: wear away
  alternatives:
  - rub out
  - grind away
  - extinguish
  lexicon: LSJ
  rationale: Wear away retains the source’s attrition image without adding an explanation of divine nature.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  chosen: the Holy Spirit
  alternatives:
  - the holy spirit
  lexicon: LSJ
  rationale: Retain traditional capitalization while recognizing Hermas’s focus on the Spirit dwelling
    in a person; see theological note.
- source_word: παραβολάς
  chosen: parables
  alternatives:
  - figures
  - comparisons
  lexicon: LSJ
  rationale: Hermas uses ‘parables’ for his figurative, allegorical teaching; retain established term
    with broader sense than Gospel parables.
- source_word: ἐπισκοτοῦνται
  chosen: are darkened
  alternatives:
  - are overshadowed
  - are benighted
  lexicon: LSJ
  rationale: Conveys loss of inner light/clarity due to worldly entanglements.
- source_word: κεχερσωμένοι
  chosen: barren
  alternatives:
  - made fallow
  - desolated
  lexicon: LSJ
  rationale: Barren retains the agricultural image; laid waste or made fallow are alternatives.
- source_word: πραγματείαις
  chosen: business affairs
  alternatives:
  - dealings
  - occupations
  lexicon: LSJ
  rationale: Context highlights worldly transactions and preoccupations; “business affairs” is concrete
    and contemporary.
- source_word: φιλίαις ἐθνικαῖς
  chosen: pagan friendships
  alternatives:
  - friendships with those of the nations
  - Gentile friendships
  lexicon: LSJ
  rationale: In a Roman Christian context, ‘ethnic’ friends are non‑Christians/pagans; ‘pagan’ communicates
    that cultural‑religious entanglement.
- source_word: αἰῶνος τούτου
  chosen: this age
  alternatives:
  - this world
  lexicon: LSJ
  rationale: Retains apocalyptic/temporal nuance of ‘age’ rather than spatial ‘world.’
- source_word: βοτανῶν
  chosen: weeds
  alternatives:
  - plants
  - herbs
  lexicon: LSJ
  rationale: In context, contrasts cultivated vines with encroaching unwanted growth; ‘weeds’ communicates
    the image.
- source_word: διάνοια
  chosen: understanding
  alternatives:
  - mind
  lexicon: LSJ
  rationale: Maintains cognitive nuance repeated with νοεῖν/συνιέναι; ‘understanding’ fits Hermas’s epistemic
    emphasis.
- source_word: δικαιοσύνη
  chosen: righteousness
  alternatives:
  - justice
  lexicon: LSJ
  rationale: Moral righteousness suits Hermas’s exhortation; ‘justice’ is more juridical and Pauline‑leaning.
- source_word: πρᾶξις
  chosen: business
  alternatives:
  - practice
  - activity
  - undertaking
  lexicon: LSJ
  rationale: Here refers to worldly dealings preoccupying the mind; ‘business’ captures the practical
    focus.
- source_word: κολλήθητι
  chosen: cling
  alternatives:
  - cling
  - be joined
  lexicon: LSJ
  rationale: Cling retains the joining/attachment imperative directed toward the Lord.
