id: JDT.14.4
reference: Judith 14:4
source:
  edition: lxx-swete-1909
  text: καὶ ἐπακολουθήσαντες ὑμεῖς καὶ πάντες οἱ κατοικοῦντες πᾶν ὅριον Ἰσραὴλ καταστρώσατε αὐτοὺς ἐν ταῖς ὁδοῖς αὐτῶν.
