theological_decisions:
- issue: Meaning of the final line ודרך גבר בעלמה
  chosen_reading: the way of a man with a young woman
  alternative_readings:
  - the way of a man in a maiden
  - the way of a man with a virgin
  rationale: The proverb lists mysterious or hard-to-trace 'ways.' The preposition ב with עלמה is best rendered relationally as 'with,' describing the enigmatic manner of male-female attraction or courtship. The wording avoids importing a more explicit sexual sense than the Hebrew itself states, while preserving the line's suggestive ambiguity.
  doctrine_reference: Translation philosophy §§1, 3, 4
