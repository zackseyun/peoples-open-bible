lexical_decisions:
- source_word: נְפוּג֣וֹתִי
  english_pob_choice: I am faint
  chosen_korean: 나는 기진맥진하고
  alternatives_korean:
  - 나는 기운이 빠지고
  - 나는 탈진하고
  lexicon: פוּג
  rationale: 시편의 상태 진술로서 단순한 ‘약함’보다 생기와 기운이 빠진 소모 상태를 살려 ‘기진맥진하다’로 옮겼습니다.
- source_word: וְנִדְכֵּ֣יתִי עַד מְאֹ֑ד
  english_pob_choice: and utterly crushed
  chosen_korean: 완전히 짓눌렸습니다
  alternatives_korean:
  - 극도로 꺾였습니다
  - 지극히 압도당했습니다
  lexicon: דכא
  rationale: 수동적 압박과 완전한 파괴감을 드러내는 동사이므로, 강도를 살려 ‘완전히 짓눌리다’로 렌더링했습니다.
- source_word: שָׁ֝אַ֗גְתִּי
  english_pob_choice: I roar
  chosen_korean: 내가 포효합니다
  alternatives_korean:
  - 내가 울부짖습니다
  - 내가 신음합니다
  lexicon: שׁאג
  rationale: 사자 같은 큰 울음의 이미지를 살려 ‘포효하다’를 택했습니다. POB의 ‘I roar’를 그대로 반영합니다.
- source_word: מִֽ/נַּהֲמַ֥ת לִבִּֽ/י
  english_pob_choice: because of the groaning of my heart
  chosen_korean: 내 마음의 신음 때문에
  alternatives_korean:
  - 내 마음의 울부짖음 때문에
  - 내 심장의 신음 때문에
  lexicon: נהם + לב
  rationale: ‘나함’의 낮고 깊은 신음 소리를 한국어의 ‘신음’으로 옮기고, 관용적으로 ‘마음’을 유지해 내적 고통의 원인을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 화자 내면의 고통을 드러내는 시적 과장
  chosen_reading: ‘포효합니다’와 ‘신음’의 대비를 유지해, 단순한 감정 진술이 아니라 몸과 마음 전체가 짓눌린 절규로 읽었습니다.
  alternative_readings:
  - ‘울부짖습니다’로 완화
  - ‘탄식합니다’로 일반화
  rationale: 히브리어 동사들의 강한 음성 이미지를 약화하지 않기 위해, 시적 긴장을 유지하는 쪽을 택했습니다.
  doctrine_reference: 시편의 탄원문학과 성서적 애가의 정서 표현
