id: PSA.81.5
reference: Psalms 81:5
source:
  edition: WLC
  text: עֵ֤דוּת בִּֽ/יה֘וֹסֵ֤ף שָׂמ֗/וֹ בְּ֭/צֵאת/וֹ עַל אֶ֣רֶץ מִצְרָ֑יִם שְׂפַ֖ת לֹא יָדַ֣עְתִּי אֶשְׁמָֽע׀־־׃
translation:
  text: 'God established it as a testimony among Joseph''s people[a] when he went out against the land of Egypt[b]. I hear an unfamiliar voice[c]:'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Joseph here represents the people of Israel.
    reason: lexical_alternative
  - marker: b
    text: Or 'when he went out over the land of Egypt.' The subject of 'went out' may be God or Israel, represented by Joseph.
    reason: alternative_reading
  - marker: c
    text: Or 'a language I did not know,' possibly recalling Israel's unfamiliarity with Egyptian speech.
    reason: alternative_reading
lexical_decisions:
- source_word: עֵדוּת
  chosen: testimony
  alternatives:
  - decree
  - statute
  lexicon: HALOT
  rationale: The noun commonly denotes a testimony or witness, and in cultic/legal contexts can extend to an ordinance. Here it refers to something God established in connection with the exodus; 'testimony' preserves the lexical sense while fitting the poetic context. 'Decree' is possible but less directly tied to the noun's usual sense.
- source_word: בִּיהוֹסֵף
  chosen: in Joseph
  alternatives:
  - against Joseph
  - for Joseph
  - in Israel
  lexicon: HALOT
  rationale: The preposition ב normally means 'in' or 'with.' 'Joseph' is retained as the tribal/patriarchal name, likely standing metonymically for Israel/Ephraim. Translating the name rather than interpreting it as 'Israel' keeps closer to the Hebrew while allowing readers to infer the representative sense.
- source_word: שָׂמוֹ
  lemma: שׂים
  chosen: he established it as
  alternatives:
  - he set it
  - he placed it
  lexicon: HALOT
  rationale: שׂים here conveys appointing or establishing the testimony; this is more precise and natural than “made it a.”
- source_word: בְּצֵאתוֹ
  chosen: when he went out
  alternatives:
  - at his going out
  - when he came out
  lexicon: HALOT
  rationale: The infinitive construct with prefixed ב conveys temporal sense, 'when he went out.' The 3ms suffix is ambiguous in referent, but most naturally points to God or Joseph/Israel in the exodus setting. English preserves the ambiguity with 'he.'
- source_word: עַל אֶרֶץ מִצְרָיִם
  lemma: עַל
  chosen: against the land of Egypt
  alternatives:
  - against the land of Egypt
  - upon the land of Egypt
  lexicon: HALOT
  rationale: The exodus context supports an adversative sense, while the viable spatial sense “over” remains noted.
- source_word: שְׂפַת
  chosen: a language
  alternatives:
  - speech
  - lip
  lexicon: HALOT
  rationale: Literally 'lip,' but idiomatically refers to speech or language. 'A language' communicates the sense naturally in English.
- source_word: לֹא יָדַעְתִּי
  chosen: I did not know
  alternatives:
  - I did not know
  lexicon: HALOT
  rationale: The perfect need not be forced into a pluperfect in this abrupt poetic shift.
- source_word: אֶשְׁמָע
  chosen: I hear
  alternatives:
  - I hear
  lexicon: HALOT
  rationale: The imperfect naturally permits a present rendering and preserves the transition into direct divine speech.
