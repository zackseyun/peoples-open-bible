id: PRO.4.14
reference: Proverbs 4:14
source:
  edition: WLC
  text: בְּ/אֹ֣רַח רְ֭שָׁעִים אַל תָּבֹ֑א וְ/אַל תְּ֝אַשֵּׁ֗ר בְּ/דֶ֣רֶךְ רָעִֽים־־׃
translation:
  text: Do not enter the path of the wicked; do not proceed along the way of evildoers.
  philosophy: dynamic
lexical_decisions:
- source_word: אֹרַח
  chosen: path
  alternatives:
  - way
  - track
  lexicon: HALOT
  rationale: אֹרַח commonly denotes a path or course of travel, often metaphorically for one's manner of life. 'Path' preserves the concrete metaphor and distinguishes it from the second colon's דֶּרֶךְ, rendered 'way' for stylistic and lexical differentiation.
- source_word: רְשָׁעִים
  chosen: the wicked
  alternatives:
  - wicked men
  - guilty ones
  lexicon: HALOT
  rationale: The adjective/substantive refers to wicked persons generally. 'The wicked' is natural English and preserves the collective force without over-specifying gender.
- source_word: אַל תָּבֹא
  chosen: do not enter
  alternatives:
  - do not come
  - do not go in
  lexicon: HALOT
  rationale: With בְּאֹרַח ('into/on the path'), בוא here carries the sense of entering onto a course. 'Do not enter' is idiomatic and fits the path metaphor better than the more general 'come'.
- source_word: תְּאַשֵּׁר
  chosen: do not proceed
  alternatives:
  - do not proceed
  - do not go straight
  - do not advance
  lexicon: HALOT
  rationale: In the travel metaphor, the Piel conveys going on or proceeding along the way.
- source_word: דֶּרֶךְ
  chosen: way
  alternatives:
  - path
  - road
  lexicon: HALOT
  rationale: דֶּרֶךְ is a common term for road/way and, metaphorically, manner of life. 'Way' is the most natural English equivalent here and pairs well with 'path' in the first colon.
- source_word: רָעִים
  chosen: evildoers
  alternatives:
  - evildoers
  - evil ones
  - the evil
  lexicon: HALOT
  rationale: The substantival masculine plural denotes evil people; “evildoers” is accurate natural English.
