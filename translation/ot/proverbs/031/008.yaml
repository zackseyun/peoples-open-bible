id: PRO.31.8
reference: Proverbs 31:8
source:
  edition: WLC
  text: פְּתַח פִּ֥י/ךָ לְ/אִלֵּ֑ם אֶל דִּ֝֗ין כָּל בְּנֵ֥י חֲלֽוֹף־־־׃
translation:
  text: Speak up for those who cannot speak for themselves; defend the cause of all who are facing ruin[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “all the destitute.” The rare Hebrew phrase is uncertain; literally, “all the sons of passing away.”
    reason: alternative_reading
lexical_decisions:
- source_word: פְּתַח
  chosen: Open
  alternatives:
  - Speak up
  lexicon: HALOT
  rationale: Imperative 2ms of פתח, literally 'open.' In context with 'your mouth,' English idiom 'Open your mouth' preserves the concrete metaphor and exhortational force better than a more interpretive 'Speak up.'
- source_word: פִּיךָ
  chosen: your mouth
  lexicon: HALOT
  rationale: Literal object of the imperative. Retaining 'mouth' preserves the Hebrew imagery rather than abstracting to 'voice' or 'speech.'
- source_word: לְאִלֵּם
  chosen: for the mute
  alternatives:
  - for the speechless
  - for those unable to speak
  lexicon: HALOT
  rationale: אִלֵּם denotes one who is mute or unable to speak. 'The mute' is concise and close to the Hebrew; alternatives are possible but slightly more interpretive.
- source_word: אֶל־דִּין
  chosen: for the cause
  alternatives:
  - for justice
  - for the legal case
  lexicon: HALOT
  rationale: The preposition plus דִּין points to advocacy in a judicial or forensic sense. 'For the cause' captures legal representation without over-specifying courtroom procedure; 'for justice' is broader and less tied to the noun's forensic nuance.
- source_word: כָּל
  chosen: all
  alternatives:
  - every
  lexicon: HALOT
  rationale: Straightforward rendering of the distributive/collective term. 'All' fits the collective phrase that follows.
- source_word: בְּנֵי
  chosen: the sons of
  alternatives:
  - those of
  - the children of
  lexicon: HALOT
  rationale: Construct form of 'sons of.' Here it functions idiomatically for a class of people. Because English 'sons of' would sound wooden in this context, the idiomatic force is absorbed into the full phrase in translation rather than represented woodenly.
- source_word: חֲלוֹף
  chosen: the passing away
  alternatives:
  - ruin
  - transience
  - those passing away
  - the destitute
  lexicon: HALOT
  rationale: This rare noun is difficult. Its core sense is connected with passing on/passing away, hence people who are perishing, transient, or socially disappearing. The translation keeps the verbal idea visible with 'passing away' while allowing the phrase to denote those whose case is otherwise neglected. Because the term is lexically uncertain, alternatives are preserved in a footnote.
- source_word: בְּנֵי חֲלוֹף
  chosen: all who are passing away
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: The construct denotes people characterized by the rare term חֲלוֹף, not the abstract process “the passing away”; the precise characterization remains uncertain.
- source_word: אֶל דִּין
  chosen: for the cause of
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: In this advocacy context, “cause” naturally conveys the judicial case or claim while avoiding the greater specificity of “rights.”
