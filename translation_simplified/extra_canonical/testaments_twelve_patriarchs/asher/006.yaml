  adjudicator: 'Codex: maintainer-authorized terminology application'
  category: terminology
  policy_id: reorientation-english-2026-10-11
  rationale: Use reorient/reorientation without automatically inserting God. The sentence supplies a departure, destination, interpersonal setting, or the work's own conceptual framework. Preserve distinct turning verbs and named wrongdoing.
  from_sha256: 02d2fec6d6d0e26080ffae9710b8cbe50a456132b63dee46d5ea4c66eb2f6899
  to_sha256: 719c180d8a19483b5ab94245a041777643fd4efddc56e09e26eb82f678b6862e
