id: PSA.77.19
reference: Psalms 77:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֤וֹל רַעַמְ/ךָ֨ בַּ/גַּלְגַּ֗ל הֵאִ֣ירוּ בְרָקִ֣ים תֵּבֵ֑ל רָגְזָ֖ה וַ/תִּרְעַ֣שׁ הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/019.yaml
  text: Your way was through the sea[a], and your paths through many waters, yet your footprints[b] were not known.
  footnotes:
  - marker: a
    text: Or 'in the wheel'; the Hebrew likely evokes a whirling storm, hence 'in the whirlwind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 길은 바다 가운데 있었고[a], 주의 오솔길들은 많은 물 가운데 있었으나, 주의 발자취는 알려지지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바다 안에 … 많은 물 안에’. 히브리어 전치사는 ‘안에’로도 옮길 수 있으나, 여기서는 물을 지나가는 길의 이미지를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 걸음’ 또는 ‘주의 자취’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל רַעַמְךָ
  english_pob_choice: The sound of your thunder
  chosen_korean: 주의 소리
  alternatives_korean:
  - 주의 천둥 소리
  - 주의 우렛소리
  lexicon: HALOT
  rationale: קול은 ‘소리’로 넓게 잡되, רעם(천둥)과 결합한 시적 표현이므로 자연스럽게 ‘주의 소리’로 옮겼습니다. 한국어에서 ‘천둥 소리/우렛소리’도 가능하지만, 본문 전체의 응축된 시적 호흡을 살리기 위해 명사구를 간결하게 처리했습니다.
- source_word: בַּ/גַּלְגַּל
  english_pob_choice: in the whirlwind
  chosen_korean: 회오리바람 속에
  alternatives_korean:
  - 바퀴 속에
  - 회오리 속에
  - 소용돌이 속에
  lexicon: HALOT
  rationale: גלגל은 문자적으로 ‘바퀴’이지만, 시적·기상학적 문맥에서는 회전하는 폭풍을 가리킬 수 있으므로, 영어 POB의 해석을 따라 ‘회오리바람’으로 옮겼습니다. 필요시 문자적 대안인 ‘바퀴’ 해석은 각주로 남겼습니다.
- source_word: הֵאִ֣ירוּ בְרָקִ֣ים
  english_pob_choice: lightning lit up
  chosen_korean: 번개가 세상을 비추었으며
  alternatives_korean:
  - 번개가 빛나게 하였으며
  - 번개가 환하게 하였으며
  lexicon: HALOT
  rationale: האיר의 사역형은 ‘비추다/밝히다’의 뜻이므로, 번개가 주변을 환히 드러내는 장면을 한국어 자연문으로 살려 ‘비추었습니다’로 옮겼습니다. 복수형 בְרָקִים은 한국어에서 통상 단수 집합명사처럼 처리했습니다.
- source_word: תֵּבֵל
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세상
  - 온 세계
  - 거주하는 땅
  lexicon: HALOT
  rationale: תֵּבֵל은 ‘거주하는 세계’에 가깝지만, 시적 병행에서 자연스럽고 현대적인 표현으로 ‘세상’을 택했습니다.
- source_word: רָגְזָה וַ/תִּרְעַשׁ
  english_pob_choice: trembled and quaked
  chosen_korean: 땅이 떨고 진동하였습니다
  alternatives_korean:
  - 땅이 떨고 요동하였습니다
  - 땅이 떨며 흔들렸습니다
  lexicon: HALOT
  rationale: 두 동사를 한국어에서도 구분해, רָגְזָה는 ‘떨다’, תִּרְעַשׁ는 더 강한 ‘진동하다/흔들리다’로 옮겨 시적 점층을 살렸습니다.
- source_word: הָ/אָֽרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 지구
  - 땅덩이
  lexicon: HALOT
  rationale: 이 신현 장면에서는 ‘땅’이 가장 자연스럽고, ‘지구’보다 성경 시어의 울림을 유지합니다.
theological_decisions:
- issue: 시편의 신현적 자연 묘사에서 ‘주의 소리’의 주체와 감각적 힘을 어떻게 살릴지
  chosen_reading: 하나님의 임재를 드러내는 시적 신현으로 이해하고, 청각적 이미지(소리)와 자연 현상(번개, 떨림)을 직설적으로 유지했습니다.
  alternative_readings:
  - 보다 해설적으로 ‘주의 천둥소리’로 풀어쓰는 해석
  - 자연 현상을 상징화하여 완곡하게 옮기는 해석
  rationale: 본문은 자연 현상을 통해 하나님의 위엄을 묘사하므로, 의미를 약화시키지 않도록 감각적 진술을 그대로 살리는 것이 적절합니다.
  doctrine_reference: 시편 77편의 신현 묘사
