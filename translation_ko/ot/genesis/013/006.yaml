    rationale: רְכוּשָׁם은 문맥상 그들이 보유한 재산과 가축을 포함하는 물적 소유를 뜻하므로, ‘그들이 가진 것’이 더 자연스럽게 그 범위를 보존합니다.
  - severity: low
