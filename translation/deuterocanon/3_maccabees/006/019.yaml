translation:
  text: The angels stood against the enemy army, filled the soldiers with confusion and cowardice, and bound them fast with fetters.
  philosophy: dynamic
lexical_decisions:
- source_word: ἀντέστησαν
  chosen: rose up
  alternatives:
  - stood up
  - resisted
  lexicon: LSJ
  rationale: Aorist of ἀνθίστημι can mean 'stand against/resist,' but in this narrative sequence the sense is that they sprang into action against the opponents. 'Rose up' preserves the vivid movement without overinterpreting the manner of resistance.
- source_word: δύναμιν
  chosen: force
  alternatives:
  - power
  - army
  - host
  lexicon: LSJ
  rationale: Here δύναμις refers to the body of opposing troops rather than abstract power. 'Force' is broad enough for a military body and fits the immediate context.
- source_word: ὑπεναντίων
  chosen: their adversaries
  alternatives:
  - their opponents
  - those set against them
  - their enemies
  lexicon: LSJ
  rationale: The genitive denotes those arrayed against them. 'Adversaries' preserves the oppositional sense without adding emotional coloring beyond the Greek.
- source_word: ἐπλήρωσαν ταραχῆς καὶ δειλίας
  chosen: filled ... with confusion and cowardice
  alternatives:
  - filled ... with turmoil and fear
  - threw ... into confusion and panic
  lexicon: LSJ
  rationale: The construction literally means 'filled with turmoil/confusion and cowardice/timidity.' 'Confusion and cowardice' stays close to the Greek. 'Panic' would be more idiomatic but slightly more interpretive than δειλία requires.
- source_word: ἀκινήτοις
  chosen: immovable
  alternatives:
  - unmovable
  - unshakable
  - fast
  lexicon: LSJ
  rationale: The adjective modifies πέδαις and emphasizes the fixed, inescapable nature of the restraints. 'Immovable' is natural modern English and preserves the force.
- source_word: πέδαις
  chosen: fetters
  alternatives:
  - shackles
  - chains
  lexicon: LSJ
  rationale: πέδαι commonly refers to bonds for the feet or shackling restraints. 'Fetters' is the most precise English term, though somewhat elevated; it best matches the specific image.
