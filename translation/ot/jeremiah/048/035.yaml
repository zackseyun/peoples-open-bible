theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Scope of what is ended in Moab
  chosen_reading: the one who goes up to the high place and burns incense to his god
  alternative_readings:
  - high-place worship in general
  - the act of offering on the high place
  rationale: The Hebrew uses masculine singular participles, naturally read as a representative worshiper rather than abstract worship. English preserves this singular representative form rather than flattening it into an abstract noun.
  doctrine_reference: DOCTRINE.md Translation philosophy §§3, 4, 5
