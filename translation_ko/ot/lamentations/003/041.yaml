  source_fidelity: 개정이 필요합니다. 히브리어 נִשָּׂא(‘들어 올리다’)의 직접 목적어는 ‘우리 마음’이며, אֶל־כַּפָּיִם은 마음을 드는 행위에 손을 동반시키는 표현입니다. 초안의 ‘손을 들어 … 나아갑시다’는 마음을 들어 올리는 핵심 동작을 손의 동작과 ‘나아가다’로 바꾸어 원문의 의미를 충분히 보존하지 못합니다.
  naturalness: ‘우리의 마음을 손과 함께 하늘에 계신 하나님께 들어 올립시다’는 현대 표준어 합쇼체로 자연스럽고, 기도·회개의 권면이라는 문맥에도 적절합니다. ‘손과 함께’는 한국어에서 다소 직역적으로 들릴 수 있으나, 마음과 손의 결합이라는 원문의 관계를 가장 안전하게 보존합니다.
