translation:
  text: And it resembled ḥamara ṣərāʾ,[a] and its fruit was like a cluster of grapes, very beautiful[b]; and the
    fragrance of that tree spread far away.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ḥamara ṣərāʾ retains the selected expression ሐመረ፡ ጽራእ untranslated in transliteration because its complete
      meaning is unresolved. Actual primary Dillmann1865 column76 discusses this compound and explicitly cites32:4;
      column1275 calls its second element uncertain and questions whether it is a tree name or a form related to
      a name for Greece. Those discussions do not establish pine, carob, tamarind, cherry, a modern species or one
      secure English gloss. This is an explicitly provisional critical treatment, not a claim that the lexical problem
      is solved. No different-edition reading or Greek height/leaf clause is silently supplied.
    reason: lexical_alternative
  - marker: b
    text: The selected fruit comparison uses the vine-cluster expression. The correct primary cross-reference is
      column752 to378, where the noun has collective and singular uses with plural forms separately listed. “A cluster
      of grapes” is a bounded rendering of that range, not a claim that the passage counts exactly one cluster.
      An earlier95 locator was a neighbouring-entry error and is not positive lexical proof. The selected good/beautiful
      expression is rendered once; no Greek leaf-comparison clause is added.
    reason: lexical_alternative
