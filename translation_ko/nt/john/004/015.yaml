  naturalness: ‘여기까지 와서 물을 긷지 않게 해 주십시오’가 현대 표준어 합쇼체로 자연스럽고, 목마르지 않는 것과 물을 길러 오는 일을 하지 않는다는 병렬 관계도 명료하게 드러냅니다.
  terminology: Κύριε를 본문에서 ‘주님’으로, 존칭적 독법을 각주에서 ‘선생님’으로 보존한 것은 프로젝트 방침 및 요한복음 문맥의 중층성을 잘 반영합니다. ἀντλεῖν은 문맥상 ‘물을 긷다’로 옮길 수 있습니다.
