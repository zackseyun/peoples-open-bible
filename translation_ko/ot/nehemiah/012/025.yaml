  yaml_path: translation/ot/nehemiah/012/025.yaml
  text: Mattaniah, Bakbukiah, Obadiah, Meshullam, Talmon, and Akkub were guards, gatekeepers, keeping watch at the storehouses of the gates.
translation:
  language: ko
  text: 맛다냐와 박부기야와 오바댜와 므술람과 달몬과 악굽은 파수꾼들, 곧 문지기들이었으며, 성문들의 창고에서 파수 임무를 맡고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמְרִים
  english_pob_choice: guards
  chosen_korean: 지키는 자들
  alternatives_korean:
  - 경비병들
  - 수비하는 자들
  - 파수꾼들
  lexicon: שמר
  rationale: 문맥상 단순한 ‘문지기’보다 상위 개념인 ‘지키는 자들’로 옮겨 POB의 guards를 반영하고, 뒤의 שׁוֹעֲרִים과 중복되지 않게 했습니다.
- source_word: שׁוֹעֲרִים
  english_pob_choice: gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 성문 지기들
  - 문을 지키는 자들
  lexicon: שער
  rationale: שער의 기본 뜻인 ‘문/성문’을 살려 직역적으로 ‘문지기들’로 옮겼습니다. 전통적 교회 용어를 그대로 쓰기보다 출입문을 지키는 직능을 드러냅니다.
- source_word: מִשְׁמָר
  english_pob_choice: keeping watch
  chosen_korean: 경계하고 있었습니다
  alternatives_korean:
  - 파수하고 있었습니다
  - 경비하고 있었습니다
  lexicon: שמר
  rationale: 명사형 ‘경계/보초’의 상태를 자연스러운 동작 서술로 풀어, POB의 keeping watch를 한국어 현재 진행형으로 반영했습니다.
- source_word: בַּ/אֲסֻפֵּי הַ/שְּׁעָרִים
  english_pob_choice: at the storehouses of the gates
  chosen_korean: 문고에서
  alternatives_korean:
  - 성문 창고에서
  - 문들의 창고에서
  lexicon: אסף
  rationale: 어절이 압축된 표현이어서 문맥상 ‘문에 딸린 저장소/문고’로 간결하게 옮겼습니다. 문지기 직무와 연결되는 장소 정보를 유지하려는 선택입니다.
