  from: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
  to: The border continued to the northern slope of Ekron, bent toward Shikkeron, crossed Mount Baalah, and reached Jabneel, ending at the sea.
  rationale: The documented alternative “the northern side of Ekron” correctly identifies the geographical relationship obscured by the current compact wording. I also apply the idiomatic treatment of boundary termination already accepted in verses 4 and 7.
