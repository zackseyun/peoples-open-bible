  lexicon: their Lord
  rationale: 문맥의 상징 구조에서 신적 지시가 우세하므로 '주님'을 택했고, 공간적·예배적 대비를 살리기 위해 '앞에서'를 유지했습니다.
theological_decisions:
- issue: 알레고리 안에서의 '주님'의 지시 대상
  chosen_reading: 이 표현은 양들의 탄식이 단순한 주인에게가 아니라 알레고리 안의 신적 주님께 향하는 것으로 읽습니다.
  alternative_readings:
