theological_decisions:
- issue: Referent of the plural suffix in 'their grain'
  chosen_reading: The suffix refers to the people who benefit from the earth's produce, rendered literally as 'their grain.'
  alternative_readings:
  - The suffix refers more generally to the earth's produce without specifying a human referent in English.
  rationale: The Hebrew suffix is plural masculine and is not identical with the feminine singular 'earth.' Retaining 'their' preserves the grammatical distinction and avoids flattening the text, while the broader context of divine provision for inhabited land makes a human referent plausible.
  doctrine_reference: Translation philosophy §5 (consistency/documented exception) and §1 (original-language primacy)
