theological_decisions:
- issue: Whether χρηστότης / χρηστόν should be rendered as "kindness" or "goodness" in a way that might affect the tone of God's action.
  chosen_reading: Rendered both occurrences as "kindness."
  alternative_readings:
  - Rendered as "goodness" in one or both occurrences.
  rationale: The context emphasizes God's gracious restraint toward the sinner, so "kindness" better captures the personal and relational force while remaining faithful to the Greek.
  doctrine_reference: Translation philosophy §§5–6
- issue: Contextual repentance reassessment
  chosen_reading: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance/repent as the response to Gods kindness, retaining its causal role without an added destination.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
