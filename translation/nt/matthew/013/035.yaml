  from: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
  to: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the beginning.”'
  rationale: The participle 'saying' (λέγοντος) modifies 'prophet' (προφήτου), but the English word order separates them with 'might be fulfilled,' creating a dangling participle. It is better to omit 'saying' and use a colon, or rephrase the clause (e.g., 'through the prophet, who said:'). While formally literal for ἀπὸ καταβολῆς, 'from the foundation' sounds incomplete in English without an object. Since the drafter wishes to avoid adding 'of the world' (κόσμου) which is absent in this manuscript tradition, translating the idiom as 'from the beginning' provides a natural English rendering that captures the meaning without importing the textual variant.
