    rationale: The second sentence focuses the indictment on Eli and makes clear how his participation in the benefits demonstrates his misplaced honor.
  - source_phrase: מֵרֵאשִׁית כָּל מִנְחַת יִשְׂרָאֵל לְעַמִּי
