id: PRO.6.27
reference: Proverbs 6:27
source:
  edition: WLC
  text: הֲ/יַחְתֶּ֤ה אִ֓ישׁ אֵ֬שׁ בְּ/חֵיק֑/וֹ וּ֝/בְגָדָ֗י/ו לֹ֣א תִשָּׂרַֽפְנָה׃
translation:
  text: Can a man scoop fire into his lap without his clothes being burned?
  philosophy: dynamic
lexical_decisions:
- source_word: יַחְתֶּה
  chosen: scoop
  alternatives:
  - scoop up
  - take
  - heap up
  lexicon: HALOT
  rationale: The verb depicts taking up or scooping fire, not merely transporting it.
- source_word: אִישׁ
  chosen: a man
  alternatives:
  - someone
  - a person
  lexicon: HALOT
  rationale: The Hebrew is grammatically masculine singular and functions generically in a wisdom saying. Per the translation philosophy, a gender-accurate rendering is preferred, so 'a man' is retained rather than neutralizing to 'someone'.
- source_word: אֵשׁ
  chosen: fire
  lexicon: HALOT
  rationale: Straightforward lexical equivalent.
- source_word: בְּחֵיקוֹ
  chosen: into his lap
  alternatives:
  - in his lap
  - against his chest
  - in the fold of his garment
  lexicon: HALOT
  rationale: “Lap” is a natural contemporary rendering of the body area meant, with alternatives retained in the note.
- source_word: וּבְגָדָיו
  chosen: and his clothes
  alternatives:
  - and his garments
  lexicon: HALOT
  rationale: '''Clothes'' is the natural modern English equivalent of בְּגָדִים. ''Garments'' is possible but sounds more formal without adding meaning.'
- source_word: לֹא תִשָּׂרַפְנָה
  chosen: not be burned
  alternatives:
  - not be scorched
  - not burn
  lexicon: HALOT
  rationale: 'The Niphal imperfect of שׂרף is passive/reflexive in sense here: the clothes would undergo burning. ''Not be burned'' matches the Hebrew voice and the rhetorical expectation.'
