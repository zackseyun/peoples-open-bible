base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/002.yaml
  text: And you will be to him sons in truth, and you will walk in his commandments, the first and the last.
translation:
  language: pt
  text: E vocês serão seus filhos, em verdade, e andarão nos seus mandamentos, primeiros e últimos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱούς
  choice: filhos
  rationale: Mantém o sentido filial direto do grego e sua força teológica, sem o diluir em uma expressão genérica como “descendentes”.
- source_word: ἐν ἀληθείᾳ
  choice: em verdade
  rationale: Reproduz a expressão grega e preserva sua possível relação tanto com a condição de filhos quanto com a sinceridade dessa relação.
- source_word: πορεύεσθε
  choice: andareis
  rationale: Conserva a metáfora bíblica de conduzir a vida como um caminhar, em vez de explicá-la como “vivereis” ou “obedecereis”.
- source_word: προστάγμασιν
  choice: mandamentos
  rationale: Expressa ordens estabelecidas com registro digno e corrente, adequado ao contexto religioso.
- source_word: πρώτοις καὶ ἐσχάτοις
  choice: nos primeiros e nos últimos
  rationale: A concordância grega liga os adjetivos a “mandamentos”; a repetição da preposição em português torna essa ligação clara sem explicar além do texto.
theological_decisions:
- issue: Natureza da filiação expressa por “filhos, em verdade”
  choice: Preservar a formulação filial e a locução “em verdade” sem definir se se trata de filiação espiritual, moral ou escatológica.
  alternative: Traduzir interpretativamente como “verdadeiros filhos dele”.
  rationale: O grego afirma a filiação e acrescenta ἐν ἀληθείᾳ, mas não explicita sua natureza; a tradução evita resolver essa abertura teológica.
- issue: Alcance de “os primeiros e os últimos”
  choice: Vincular a expressão aos mandamentos, mantendo a formulação temporal/ordinal.
  alternative: Parafrasear como “todos os seus mandamentos, do primeiro ao último”.
  rationale: A paráfrase totalizante é plausível, mas explicitaria uma implicação retórica que o original deixa na forma polar “primeiros e últimos”.
translation_notes:
  register: Português moderno, digno e amplamente inteligível. A construção “sereis para ele filhos” mantém de perto εἰς υἱούς, enquanto a vírgula antes de “em verdade” evita que a expressão seja reduzida sem necessidade ao simples qualificativo “filhos verdadeiros”.
