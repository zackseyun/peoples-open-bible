  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּקְרָ֛א אִשָּׁ֥ה חֲכָמָ֖ה מִן הָ/עִ֑יר שִׁמְע֤וּ שִׁמְעוּ֙ אִמְרוּ נָ֣א אֶל יוֹאָ֔ב קְרַ֣ב עַד הֵ֔נָּה וַ/אֲדַבְּרָ֖ה אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/016.yaml
  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: ko
  text: 그러자 그 성읍에서 한 지혜로운 여인이 외쳐 말했습니다. “들으십시오! 들으십시오! 요압에게 이렇게 전하십시오. ‘이리 가까이 오십시오. 내가 당신과 말하겠습니다.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  english_pob_choice: a wise woman
  chosen_korean: 한 지혜로운 여인
  alternatives_korean:
  - 한 슬기로운 여자
  - 지혜 있는 여인
  lexicon: חכם / חכמה
  rationale: 문맥상 특정한 ‘지혜로운 여인’이라는 인물을 가리키므로, 현대적이고 자연스러운 ‘지혜로운 여인’을 택했습니다.
- source_word: מִן הָעִיר
  english_pob_choice: from the city
  chosen_korean: 그 성읍에서
  alternatives_korean:
  - 도시에서
  - 그 도시에서
  lexicon: עיר
  rationale: 사무엘서의 서사 문맥에서 ‘성읍’이 보다 문맥적이며, 지시성도 살릴 수 있어 ‘그 성읍’으로 옮겼습니다.
- source_word: שִׁמְעוּ שִׁמְעוּ
  english_pob_choice: Listen! Listen!
  chosen_korean: 들으십시오! 들으십시오!
  alternatives_korean:
  - 들어라! 들어라!
  - 들으세요! 들으세요!
  lexicon: שמע
  rationale: 반복된 명령을 한국어에서도 직접적이고 긴박하게 살리기 위해 높임 명령형을 사용했습니다.
- source_word: קְרַב עַד הֵנָּה
  english_pob_choice: Come near to here
  chosen_korean: 이리 가까이 오십시오
  alternatives_korean:
  - 이리 오십시오
  - 여기까지 가까이 오십시오
  lexicon: קרב
  rationale: ‘가까이 오다’의 접근 의미를 살리면서, 영어 POB의 ‘to here’가 주는 근접 요청을 자연스럽게 담았습니다.
theological_decisions:
- issue: 직접 화법 안의 존대 수준
  chosen_reading: 여인이 요압에게 정중한 요청을 하므로, 한국어 서술은 합쇼체를 유지하고 직접 인용문도 요청형 존대(전하십시오, 오십시오, 말하겠습니다)로 옮겼습니다.
  alternative_readings:
  - 명령형 반말(전해라, 와라, 말하겠다)
  - 평서형 완곡 표현(말해 주세요)
  rationale: 원문의 급박한 호출을 훼손하지 않으면서도, 한국어 성경 문체의 공적·서사적 톤에 맞추기 위해 정중한 명령형을 선택했습니다.
  doctrine_reference: 서사체의 화법 재현과 대상 인물 간 예절 수준
