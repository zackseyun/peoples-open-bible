id: 1ES.8.13
reference: 1 Esdras 8:13
source:
  edition: lxx-swete-1909
  text: καὶ ἀπενεγκεῖν δῶρα τῷ κυρίῳ ἃ ηὔξαμην ἐγώ τε καὶ οἱ φίλοι εἰς Ἰερουσαλήμ, καὶ πᾶν χρυσίον καὶ ἀργύριον ὃ ἐὰν εὑρεθῇ
    ἐν τῇ χώρᾳ τῆς Βαβυλωνίας τῷ κυρίῳ εἰς Ἰερουσαλήμ, σὺν τῷ δεδωρημένῳ ὑπὸ τοῦ ἔθνους εἰς τὸ ἱερὸν τοῦ κυρίου αὐτῶν τὸ ἐν
    Ἰερουσαλήμ
  language: Greek
  pages:
  - 168
  - 169
  confidence: medium
  validation: scan_partition_correction_pending_full_review
  note: 'Printed partition correction: Swete II, printed pp. [151, 152], PDF pp. [169, 170], raw scan-leaf indices [168, 169].
    PDF SHA256 945c5b15bf0f9dfc93890b28ee5b66a388acbf4597f1f2be5430ac6cba9c30b0. Existing Greek retained by exact slices;
    only printed25b and92 restored. Not a new ancient reading, recovered Hebrew, or full verse review. Historical approximate
    Hebrew parallels and old review fields are archived, not newly verified. See docs/1ESDRAS_8_PARTITION_REPAIR_2026-10-19.md.'
translation:
  text: and to bring to Jerusalem gifts for the Lord[a], which I and my friends have vowed, and all the gold and silver that
    may be found in the land of Babylonia for the Lord in Jerusalem[b], together with what was freely given by the nation
    for the temple of their Lord in Jerusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'offerings' for 'gifts'; the Greek term can carry a cultic sense in this context.
    reason: lexical_alternative
  - marker: b
    text: 'The phrase is compressed in Greek: literally, ''for the Lord into/in Jerusalem.'' The sense is resources designated
      for the Lord at Jerusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπενεγκεῖν
  chosen: to bring
  alternatives:
  - to carry
  - to convey
  lexicon: LSJ
  rationale: The infinitive denotes carrying something away/to a destination. In English, 'to bring' best fits the movement
    of gifts toward Jerusalem and reads naturally without losing the directional sense.
- source_word: δῶρα
  chosen: gifts
  alternatives:
  - offerings
  - presents
  lexicon: LSJ
  rationale: '''Gifts'' is the broad, transparent sense and avoids prematurely narrowing the term to a technical sacrificial
    offering, though cultic overtones are present from the context and recipient (''for the Lord'').'
- source_word: τῷ κυρίῳ
  chosen: for the Lord
  alternatives:
  - to the Lord
  lexicon: LSJ
  rationale: κύριος is rendered by the doctrinal default 'Lord.' The dative here can be represented in English as 'for the
    Lord' because the gifts are intended for his service/worship at Jerusalem; this also matches the later repeated phrase
    in the verse.
- source_word: ἃ ηὔξαμην
  chosen: which ... have vowed
  alternatives:
  - which ... promised
  - which ... prayed
  lexicon: LSJ
  rationale: The verb εὔχομαι in the middle can mean to vow, especially with an object like gifts. 'Have vowed' captures the
    cultic and promissory force better than the broader 'promised' or the misleading 'prayed.'
- source_word: οἱ φίλοι
  chosen: my friends
  alternatives:
  - my companions
  - my associates
  lexicon: LSJ
  rationale: The plain lexical sense is 'friends.' While the referent may be court associates or supporters, the Greek does
    not require a more technical rendering.
- source_word: πᾶν χρυσίον καὶ ἀργύριον
  chosen: all the gold and silver
  alternatives:
  - every gold and silver contribution
  - all gold and silver
  lexicon: LSJ
  rationale: This straightforwardly denotes precious metals collectively. 'All the gold and silver' is idiomatic and preserves
    the comprehensiveness of πᾶν.
- source_word: ὃ ἐὰν εὑρεθῇ
  chosen: that may be found
  alternatives:
  - whatever is found
  - that might be found
  lexicon: LSJ
  rationale: The relative with ἐὰν and subjunctive expresses indefiniteness/contingency. 'That may be found' preserves that
    open-ended sense in smooth English.
- source_word: ἐν τῇ χώρᾳ τῆς Βαβυλωνίας
  chosen: in the land of Babylonia
  alternatives:
  - in the province of Babylonia
  - in the country of Babylon
  lexicon: LSJ
  rationale: χώρα commonly means land/region/country. 'Land of Babylonia' is geographically broad and fits the Greek better
    than the more administrative 'province.'
- source_word: εἰς Ἰερουσαλήμ
  lemma: εἰς
  chosen: to Jerusalem
  alternatives:
  - in Jerusalem
  lexicon: LSJ
  rationale: The preposition εἰς normally marks motion toward. The first occurrence clearly indicates destination, so 'to
    Jerusalem' is retained there.
- source_word: τῷ κυρίῳ εἰς Ἰερουσαλήμ
  chosen: for the Lord in Jerusalem
  alternatives:
  - for the Lord at Jerusalem
  - for the Lord, to Jerusalem
  lexicon: LSJ
  rationale: The Greek expression is rendered 'for the Lord in Jerusalem' in this unit. The selected Greek, not an approximate
    cross-reference, controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: σὺν
  chosen: together with
  alternatives:
  - with
  - along with
  lexicon: BDAG
  rationale: Introduces an accompanying item in the larger sentence. 'Together with' preserves the additive force clearly
    in English.
- source_word: τῷ δεδωρημένῳ
  chosen: what was freely given
  alternatives:
  - the gift
  - what was granted
  - what was donated
  lexicon: BDAG
  rationale: The perfect participle from δωρέομαι denotes something given as a gift. 'What was freely given' preserves the
    gift-character without over-specifying the donor beyond the following phrase.
- source_word: ὑπὸ τοῦ ἔθνους
  chosen: by the nation
  alternatives:
  - by the people
  - by the community
  lexicon: BDAG
  rationale: The Greek expression is rendered 'by the nation' in this unit. The selected Greek, not an approximate cross-reference,
    controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: εἰς τὸ ἱερὸν
  chosen: for the temple
  alternatives:
  - for the sanctuary
  - into the temple
  lexicon: BDAG
  rationale: ἱερόν commonly denotes the temple/sanctuary complex. 'For the temple' fits the donation context better than a
    strictly locative 'into the temple.'
- source_word: τοῦ κυρίου αὐτῶν
  chosen: of their Lord
  alternatives:
  - of their master
  - of the Lord their God
  lexicon: BDAG
  rationale: The Greek expression is rendered 'of their Lord' in this unit. The selected Greek, not an approximate cross-reference,
    controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: τὸ ἐν Ἰερουσαλήμ
  chosen: in Jerusalem
  alternatives:
  - that is in Jerusalem
  lexicon: BDAG
  rationale: The article-participle-like construction identifies the temple's location. Smooth English can compress this to
    'in Jerusalem' without loss of meaning.
