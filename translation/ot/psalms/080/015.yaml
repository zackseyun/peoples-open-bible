id: PSA.80.15
reference: Psalms 80:15
source:
  edition: WLC
  text: וְ֭/כַנָּה אֲשֶׁר נָטְעָ֣ה יְמִינֶ֑/ךָ וְ/עַל בֵּ֝֗ן אִמַּ֥צְתָּה לָּֽ/ךְ־־׃
translation:
  text: the plant that your right hand planted, the son[a] whom you made strong for yourself.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “branch,” continuing the vine image.
    reason: alternative_reading
lexical_decisions:
- source_word: כַנָּה
  chosen: plant
  alternatives:
  - shoot
  - branch
  - rootstock
  lexicon: HALOT
  rationale: It is a natural broad rendering of the rare plant term and avoids false botanical precision.
- source_word: נָטְעָה
  chosen: planted
  alternatives:
  - set
  - established
  lexicon: HALOT
  rationale: The verb נטע commonly means 'plant' and is the natural rendering in the vineyard metaphor. It preserves the agricultural imagery established in the surrounding context.
- source_word: יְמִינֶךָ
  chosen: your right hand
  alternatives:
  - your power
  lexicon: HALOT
  rationale: Rendered literally as 'your right hand' to preserve the anthropomorphic and theological imagery of God's powerful action, rather than flattening it into an abstract term like 'power'.
- source_word: וְעַל
  chosen: the son
  alternatives:
  - even upon
  - and upon
  - namely
  lexicon: HALOT
  rationale: The phrase continues the object of the preceding imperative without requiring a wooden reproduction of the Hebrew preposition.
- source_word: בֵּן
  chosen: son
  alternatives:
  - branch
  - child
  - man
  lexicon: HALOT
  rationale: The plain lexical sense is 'son.' Although some interpreters take it metaphorically within the vine image ('branch'), the Hebrew word itself is not the normal botanical term here. 'Son' preserves the personified/corporate metaphor and the theological tension of Israel as God's son without over-resolving the image.
- source_word: אִמַּצְתָּה
  chosen: made strong
  alternatives:
  - strengthened
  - established
  - made mighty
  lexicon: HALOT
  rationale: The piel of אמץ conveys strengthening or making firm/strong. 'Made strong' is idiomatic and keeps the causative force directed toward the 'son.'
- source_word: לָּךְ
  chosen: for yourself
  alternatives:
  - for you
  lexicon: HALOT
  rationale: The dative pronoun indicates relation or advantage. 'For yourself' brings out the reflexive nuance often conveyed in English when God appoints or strengthens someone for his own purpose.
