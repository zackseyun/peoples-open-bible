  from: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
  to: But Paul chose Silas and set out after the brothers and sisters had entrusted him to the grace of the Lord.
  rationale: The lexical history identifies entrusting to divine care as the meaning of “commended” and explicitly supports retaining “grace.” I preserve that theological weight and the unspecified “Lord,” while making the action and the community’s participation clearer in the main text.
