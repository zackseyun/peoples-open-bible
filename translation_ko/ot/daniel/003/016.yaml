  text: עֲנ֗וֹ שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ וְ/אָמְרִ֖ין לְ/מַלְכָּ֑/א נְבֽוּכַדְנֶצַּ֔ר לָֽא חַשְׁחִ֨ין אֲנַ֧חְנָה עַל דְּנָ֛ה פִּתְגָ֖ם לַ/הֲתָבוּתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/016.yaml
  text: Shadrach, Meshach, and Abed-nego answered and said to the king, Nebuchadnezzar, “We have no need to give you an answer concerning this matter.”
translation:
  language: ko
  text: 사드락, 메삭, 그리고 아벳느고가 대답하여 느부갓네살 왕에게 말했습니다. 「이 일에 관해서는 왕께 답변할 필요가 없습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנ֗וֹ ... וְ/אָמְרִ֖ין
  english_pob_choice: answered and said
  chosen_korean: 대답하여 … 말했습니다
  alternatives_korean:
  - 대답하고 말했습니다
  - 응답하여 말했습니다
  lexicon: ענה / אמר
  rationale: 히브리어의 이중 동사는 단순한 ‘말했다’보다 응답 행위를 강조하므로, 한국어에서도 ‘대답하여 말했습니다’로 반영했습니다.
- source_word: לְ/מַלְכָּ֑/א נְבֽוּכַדְנֶצַּ֔ר
  english_pob_choice: to the king, Nebuchadnezzar
  chosen_korean: 느부갓네살 왕에게
  alternatives_korean:
  - 왕 느부갓네살에게
  - 네부카드네자르 왕에게
  lexicon: מלך / נבוכדנצר
  rationale: 본문은 왕에게 직접 말하는 대상 표지이므로 ‘에게’로 옮겼고, 고유명사는 한국어 성경에서 널리 통용되는 ‘느부갓네살’을 택했습니다.
- source_word: לָֽא חַשְׁחִ֨ין ... פִּתְגָ֖ם לַ/הֲתָבוּתָֽ/ךְ
  english_pob_choice: We have no need to give you an answer concerning this matter.
  chosen_korean: 이 일에 관해서는 왕께 드릴 대답이 필요하지 않습니다
  alternatives_korean:
  - 이 일에 대해 왕께 답할 필요가 없습니다
  - 이 문제에 대해 왕께 응답할 필요가 없습니다
  lexicon: לא חשחין / פתגם / התבות
  rationale: 부정 표현과 ‘대답/응답’의 의미를 살리되, 문맥상 상대에게 예를 갖춘 현대 한국어로 ‘드릴 대답이 필요하지 않습니다’라고 옮겼습니다.
theological_decisions:
- issue: 왕에게 대한 정중한 거절의 어조
  chosen_reading: 직접적인 불복종이 아니라, 왕권 앞에서도 최종 책임이 하나님께 있음을 전제한 공손하지만 단호한 응답으로 읽었습니다.
  alternative_readings:
  - 단순한 정치적 항의로 읽을 수 있음
  - 무례한 거절로 약화시킬 수 있음
  rationale: 다니엘 3장의 서사에서 이 발언은 우상 숭배 명령에 대한 신앙적 거부이며, 한국어에서도 공손한 형식을 유지하되 결연한 거절을 드러내야 합니다.
  doctrine_reference: 신앙고백과 충성의 우선성
