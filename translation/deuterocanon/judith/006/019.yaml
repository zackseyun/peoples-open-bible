  meaning: The people ask the God of heaven to regard their enemies’ arrogance and show mercy to his consecrated people in their humiliation.
  meaning_decisions:
  - source_phrase: ἐλέησον τὴν ταπείνωσιν τοῦ γένους ἡμῶν
    prior_rendering: have mercy on the humiliation of our people
    new_rendering: have mercy on our people in their humiliation
    rationale: The appeal seeks mercy for the people suffering abasement, not for humiliation as an abstraction; the new construction preserves both mercy and humiliation.
  - source_phrase: τὸ πρόσωπον τῶν ἡγιασμένων σοι
    prior_rendering: the face of those sanctified to you
    new_rendering: the faces of those consecrated to you
    rationale: The collective singular “face” becomes a natural English plural while retaining the concrete image. “Consecrated to you” expresses the people’s holy, set-apart relationship to God more idiomatically than “sanctified to you.”
  - source_phrase: ἐν τῇ ἡμέρᾳ ταύτῃ
    prior_rendering: on this day
    new_rendering: on this day, look upon
    rationale: Placing the temporal phrase with the petition clarifies the appeal for God’s attention now, rather than suggesting that the people were consecrated only that day.
