id: PSA.64.9
reference: Psalms 64:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּכְשִׁיל֣וּ/הוּ עָלֵ֣י/מוֹ לְשׁוֹנָ֑/ם יִ֝תְנֹדֲד֗וּ כָּל רֹ֥אֵה בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/009.yaml
  text: Then everyone will fear[a], and they will declare the work of God; they will understand what he has done.
  footnotes:
  - marker: a
    text: Or, more formally, 'His/its tongue made him/it stumble upon them.' The Hebrew of the first clause is syntactically difficult, and translations differ on how the pronouns relate. The main text follows the sense that the wicked are undone by their own speech.
    reason: alternative_reading
  - marker: b
    text: The verb can also be rendered 'wag their heads,' 'shudder,' or in some contexts 'flee away.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모든 사람이 두려워하고[a], 하나님의 행하심을 선포하며, 그가 하신 일을 깨달을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 인류’. 히브리어 ‘모든 아담’은 사람들을 통틀어 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְשִׁילוּהוּ
  english_pob_choice: They are made to stumble
  chosen_korean: 그들을 넘어뜨립니다
  alternatives_korean:
  - 그들을 걸려 넘어지게 합니다
  - 그들을 쓰러뜨립니다
  - 그들이 넘어지게 됩니다
  lexicon: HALOT
  rationale: 히필형 כשׁל의 인과적 의미를 살려 ‘넘어뜨리다’로 옮겼습니다. 히브리어의 난해한 대명사 결속은 한국어에서 과도하게 풀지 않고, 문맥상 악인의 말이 그들을 무너뜨린다는 뜻을 자연스럽게 드러냈습니다.
- source_word: לְשׁוֹנָם
  english_pob_choice: their own tongue
  chosen_korean: 그들의 혀
  alternatives_korean:
  - 그들의 말
  - 그들의 혀가
  lexicon: HALOT
  rationale: 히브리어의 단수 명사 ‘혀’를 그대로 유지해 말이 파멸의 도구라는 구체적 이미지를 보존했습니다. 영어 POB가 문맥상 소유 관계를 강조한 점은 한국어의 ‘그들의’로 충분히 반영됩니다.
- source_word: יִתְנֹדֲדוּ
  english_pob_choice: shake their heads
  chosen_korean: 고개를 흔듭니다
  alternatives_korean:
  - 머리를 흔듭니다
  - 수군거립니다
  - 몸을 떱니다
  lexicon: HALOT
  rationale: 문맥상 ‘보는 자들의’ 가시적 반응을 나타내는 동작으로 이해하여, 현대 한국어에서 가장 자연스러운 관용 표현인 ‘고개를 흔들다’를 택했습니다.
- source_word: כָּל רֹאֵה בָם
  english_pob_choice: all who see them
  chosen_korean: 그것을 보는 모든 사람
  alternatives_korean:
  - 그들을 보는 모든 사람
  - 그들을 보는 자마다
  - 모든 목격자
  lexicon: HALOT
  rationale: 분사구의 보편성을 ‘모든 사람’으로 살리되, 직전 절의 ‘혀’에 맞춰 대명사 연결을 ‘그것’으로 받으면 한국어 문장 흐름이 더 분명해집니다.
theological_decisions:
- issue: 첫 절의 난해한 대명사 결속과 주어-목적어 관계
  chosen_reading: 악인의 혀가 결국 그들을 넘어뜨리는 것으로 읽었습니다.
  alternative_readings:
  - 그들이 혀로 인해 넘어집니다
  - 그의/그것의 혀가 그를 그들 위에 넘어뜨립니다
  rationale: 히브리어 본문은 대명사 결속이 압축적이고 모호하지만, 시 전체 문맥에서는 악인의 말이 자해적 심판의 도구가 된다는 뜻이 분명합니다. 한국어 본문은 이 주된 의미를 보존하되, 원문의 난해함은 각주로 최소한만 드러냅니다.
  doctrine_reference: 시편의 시적 평행법과 보응 사상
- issue: ‘고개를 흔듭니다’의 반응 의미
  chosen_reading: 조롱 또는 경악의 가시적 반응으로 이해했습니다.
  alternative_readings:
  - 단순한 기절 반응
  - 떠남/도피
  rationale: 동사 נוד는 흔들다, 흔들거리다, 머리를 젓다 등으로 다양하게 쓰이므로, 여기서는 ‘보는 자들’의 반응을 가장 자연스럽게 드러내는 해석을 택했습니다.
  doctrine_reference: 시편 64편의 탄식-보응 구조
