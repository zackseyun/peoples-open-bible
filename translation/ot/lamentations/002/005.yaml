  from: The Lord became like an enemy; he swallowed up Israel. He swallowed up all her palaces; he destroyed his strongholds[a], and he multiplied mourning and lamentation in Daughter Judah.
  to: The Lord became like an enemy; he swallowed up Israel. He swallowed up all her palaces; he destroyed her strongholds, and he multiplied mourning and lamentation in Daughter Judah.
