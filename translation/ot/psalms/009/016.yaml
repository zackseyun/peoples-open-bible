  to: Yahweh is known by the judgment he has executed; the wicked are snared by the work of their own hands. Higgaion[a]. Selah[b].
  rationale: The later review correctly avoided forcing an explicitly reflexive sense on “is known.” Its preference for separate clauses rested on preserving Hebrew syntax; the contextual connection between recognition and judgment is now made explicit in English.
