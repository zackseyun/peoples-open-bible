lexical_decisions:
- source_word: ויתם
  chosen: directed
  alternatives:
  - set
  - made straight
  - was blameless
  lexicon: HALOT
  rationale: The Hebrew form is somewhat uncertain in this composite Geniza text, but the Greek parallel κατεύθυνεν ('directed/straightened') strongly supports a sense of directing or setting aright rather than 'was blameless.' 'Directed' gives clear modern English and fits the object 'his heart.'
- source_word: אל אל
  chosen: to God
  alternatives:
  - toward God
  - to the Lord
  lexicon: HALOT
  rationale: The Hebrew reads 'to God' (אל אל), while the Greek has πρὸς Κύριον ('toward the Lord'). Since the Hebrew survives here, the main text follows it. 'To God' is straightforward and preserves the Hebrew witness; the Greek-based alternative is worth noting in a footnote because of the minor mismatch.
- source_word: לבו
  chosen: his heart
  alternatives:
  - his mind
  - his inner self
  lexicon: HALOT
  rationale: '''Heart'' is the standard biblical anthropological term and should be preserved rather than flattened to ''mind.'''
- source_word: ובימי חמס
  chosen: in days of violence
  alternatives:
  - in violent days
  - in days of lawlessness
  lexicon: HALOT
  rationale: חמס commonly denotes violence or wrongdoing. 'In days of violence' is idiomatic and preserves the social-moral force of the Hebrew. The Greek ἐν ἡμέραις ἀνόμων points toward 'in days of lawless men/wickedness,' which overlaps semantically but does not require abandoning the Hebrew wording.
- source_word: עשה חסד
  chosen: practiced faithful devotion
  alternatives:
  - did kindness
  - showed mercy
  - did piety
  - strengthened godliness
  lexicon: HALOT
  rationale: The Hebrew חסד often means covenantal kindness/loyalty, but the Greek renders with εὐσέβεια ('piety/godliness') and even has the stronger verb κατίσχυσεν ('prevailed/strengthened'). Given the parallel, the line likely commends Hezekiah's steadfast covenant loyalty toward God amid crisis. 'Practiced faithful devotion' preserves both the Hebrew's loyal-goodness nuance and the Greek's piety-oriented interpretation better than a merely horizontal 'did kindness.'
