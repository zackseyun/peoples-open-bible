  source_fidelity: 히브리어 명령형 הֵעָלוּ와 מִסָּבִיב의 이탈 지시를 보존하되, ‘주변에서 올라가십시오’가 한국어에서 다소 어색하고 이탈 의미가 희미해지는 점을 보완했습니다. מִשְׁכַּן은 문맥상 ‘거처’로 적절하며, 세 인명은 통상 표기와 일치합니다.
  naturalness: 초안의 ‘회중에게 말하여 이르라’는 현대 표준어 합쇼체와 맞지 않는 고어적 명령형입니다. ‘회중에게 이렇게 말하십시오’로 고쳐 현대적이고 자연스러운 합쇼체를 유지했습니다. 또한 ‘주변을 떠나 올라가십시오’로 공간적 이탈과 ‘올라가다’를 함께 자연스럽게 표현했습니다.
  terminology: ‘회중’, ‘거처’, ‘고라’, ‘다단’, ‘아비람’은 적절합니다. 본문에는 성막을 뜻하는 고유한 예배 용어로 번역해야 할 근거보다 해당 인물들의 거처를 가리키는 문맥이 우세하므로 ‘거처’를 유지합니다.
  issues:
