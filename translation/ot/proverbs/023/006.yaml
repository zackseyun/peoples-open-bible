id: PRO.23.6
reference: Proverbs 23:6
source:
  edition: WLC
  text: אַל תִּלְחַ֗ם אֶת לֶ֭חֶם רַ֣ע עָ֑יִן וְ/אַל תתאו לְ/מַטְעַמֹּתָֽי/ו־־־׃
translation:
  text: Do not eat the food of a stingy person[a], and do not crave his delicacies.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the food of one with an evil eye,” an idiom for stinginess.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּלְחַם
  chosen: eat
  alternatives:
  - consume
  - partake of
  lexicon: HALOT
  rationale: Though the verb לחם can be associated with eating bread/food, in this idiom with לֶחֶם it means 'eat' rather than the unrelated homograph 'fight.' English 'eat' best captures the plain sense in context.
- source_word: לֶחֶם
  chosen: food
  alternatives:
  - food
  - meal
  lexicon: HALOT
  rationale: In this meal setting, the word denotes food generally.
- source_word: רַע עָיִן
  chosen: a stingy person
  alternatives:
  - a stingy man
  - a begrudging host
  - one who is envious
  lexicon: HALOT
  rationale: This is the contextual English equivalent of the Hebrew idiom and avoids a misleading modern reading of “evil eye.”
- source_word: תתאו
  chosen: crave
  alternatives:
  - desire
  - long for
  lexicon: HALOT
  rationale: The Hitpael/imperfect form from אוה expresses strong desire. 'Crave' conveys the warning against inward appetite more vividly than the flatter 'desire.'
- source_word: לְמַטְעַמֹּתָיו
  chosen: his delicacies
  alternatives:
  - his tasty foods
  - his dainties
  lexicon: HALOT
  rationale: The noun refers to tasty dishes or delicacies. 'Delicacies' is natural modern English and preserves the sense of specially appealing food.
