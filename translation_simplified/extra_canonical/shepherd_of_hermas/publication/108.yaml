revisions:
- category: publication_review_correction
  rationale: 'Two source-based corrections are proposed. First, aliquid deliquerit explicitly includes
    actual wrongdoing by someone tempted by the devil; restoring it preserves the difficult promise of
    quick return even after an offense, rather than making temptation alone the condition. Second, reconsideration
    of the prior lexical rendering of validissime: it emphasizes the obligation expressed by oportet,
    not the rigor of rationem. The replacement retains that strong obligation. Existing paragraphs and
    notes are preserved.; The supplied Latin contains instructions concerning offenses, wickedness, bitter
    remembrance, and removing divisions, but no explicit blood-guilt language. This proposed metadata
    correction removes the imported claim and describes the content of this unit.'
- category: publication_review_correction
  rationale: 'Reconsideration of the prior lexical omission of reperti: the supplied Latin dissipati reperti
    fuerint says “are found ruined,” preserving the assessment language that continues the preceding invenerit
    clauses. Restore “found” without changing the difficult teaching, existing notes, or paragraph divisions.;
    The supplied attributed apparatus transcription reports “ps-Cypr. de Aleat. 3,” not section 2. Correct
    the locator while retaining the distinction between editorial supply and manuscript wording, without
    claiming fresh verification.'
