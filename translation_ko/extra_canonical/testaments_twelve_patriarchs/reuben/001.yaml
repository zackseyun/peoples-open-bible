revisions:
- from: '이는 르우벤의 유언서 사본으로, 그가 죽기 전에 자기 아들들에게 명한 것인데, 곧 그의 생애 백이십오 년째에 관한 기록입니다.


    2 요셉이 그의 형제였으므로, 그가 죽은 지 이 년 뒤에 르우벤이 병들자 요셉의 아들들과 그의 손자들의 아들들이 그를 방문하려고 모였습니다. 3 그가 그들에게 말했습니다. “내 자녀들아, 보십시오, 나는 죽어 가며 내 조상들의 길로 갑니다. 4 그런데 그곳에 유다와 갓과 아셀, 그의 형제들을 보고 그들에게 말했습니다. “나를 일으켜 세워 주십시오. 그러면 내가 내 형제들과 내 자녀들에게 내 마음속에 숨겨 둔 것들을 말하겠습니다. 보십시오, 지금도 나는 기력이 다해 갑니다.” 5 그가 일어나 그들에게 입을 맞추고 말했습니다. “내 형제들과 내 아들들아, 들으십시오. 내가 너희에게 명하는 일들에서 너희의 아버지 르우벤에게 귀를 기울이십시오.


    6 “보십시오, 오늘 나는 하늘의 하나님을 너희에게 대하여 증인으로 불러 세웁니다. 그러니 너희는 젊은 시절의 무지와 성적 부도덕 가운데 행하지 마십시오. 그 가운데서 나는 쏟아져 나오고 내 아버지 야곱의 침상을 더럽혔습니다. 7 내가 너희에게 말합니다. 그분은 내 넓적다리에 이레 동안 큰 매를 내리셨습니다. 그리고 내 아버지 야곱이 나를 위해 주님께 기도하지 않았더라면, 주님께서는 나를 멸하실 뜻이 있으셨을 것입니다. 8 나는 주님 앞에서 악한 일을 저질렀을 때 서른 살이었고, 이레 동안 죽음에 이를 만큼 약해졌습니다. 9 그 후에 나는 영혼의 결단으로 주님 앞에서 이레 해 동안 회개했습니다. 10 또 나는 포도주나 독주를 마시지 않았고, 고기도 내 입에 들어오지 않았으며, 욕망의 빵도 먹지 않았습니다. 그러나 나는 내 죄 때문에 슬퍼하고 있었습니다. 그것은 매우 큰 죄였기 때문입니다. 이스라엘 가운데서는 그런 일이 일어난 적이 없었습니다.”[a][b]'
  to: '이는 르우벤의 유언서 사본입니다. 곧 그가 죽기 전에 자기 아들들에게 명한 것으로, 그의 생애 백이십오 년째에 한 말입니다.


    2 그의 형제 요셉이 죽은 지 두 해 뒤, 르우벤이 병들자 요셉의 아들들과 그의 아들들의 아들들이 그를 찾아보려고 모였습니다. 3 그가 그들에게 말했습니다. “내 자녀들아, 보십시오. 나는 죽어 가며 내 조상들의 길로 갑니다. 4 그런데 그곳에 있는 자기 형제 유다와 갓과 아셀을 보고, 그들에게 말했습니다. ‘나를 일으켜 세워 주십시오. 그러면 내가 내 형제들과 내 자녀들에게 내 마음속에 숨겨 둔 것들을 말하겠습니다. 보십시오, 나는 이제 기력이 다해 갑니다.’ 5 그리고 일어나 그들에게 입을 맞추고 말했습니다. ‘내 형제들과 내 아들들아, 들으십시오. 내가 너희에게 명하는 것을 너희 아버지 르우벤에게서 잘 들으십시오.


    6 보십시오, 오늘 나는 하늘의 하나님을 너희에게 불리한 증인으로 부릅니다. 너희는 젊은 시절의 무지와 성적 부도덕 가운데 행하지 마십시오. 나는 그 가운데서 쏟아져 나왔고 내 아버지 야곱의 침상을 더럽혔습니다. 7 내가 너희에게 말합니다. 그분께서 일곱 달 동안 내 허리에 심한 타격을 주셨습니다. 내 아버지 야곱이 나를 위하여 주님께 기도하지 않았더라면, 주님께서는 나를 멸하셨을 것입니다. 8 나는 주님 앞에서 그 악한 일을 저질렀을 때 서른 살이었고, 일곱 달 동안 죽음에 이를 만큼 쇠약해졌습니다. 9 그 후 나는 내 영혼의 결단으로 주님 앞에서 일곱 해 동안 회개했습니다. 10 나는 포도주와 독주를 마시지 않았고, 고기는 내 입에 들어오지 않았으며, 욕망의 빵도 먹지 않았습니다. 오히려 나는 내 죄 때문에 슬퍼했습니다. 그 죄는 매우 컸으며, 이스라엘에서는 그와 같은 일이 일어난 적이 없었습니다.’”'
  rationale: 원문의 표제 형식, 시간 단위, 친족 관계의 문법적 기능, 신체 부위의 의미 범위를 바로잡았습니다. ἐξεχύθην은 본문 자체가 난해하므로 ‘방탕에 빠졌다’처럼 해석을 덧붙이지 않고 문자적 표현을 유지했습니다. 원문에 없는 각주 내용은 만들지 않았으며, 정의되지 않은 표지는 제거했습니다.
