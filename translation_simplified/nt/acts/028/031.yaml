simplification_decisions:
- pob_phrase: proclaiming the kingdom of God
  simplified_phrase: He proclaimed God’s kingdom
  preserved_meaning: Paul publicly announced the kingdom of God.
  reasoning_layer_used: lexical decision for κηρύσσων and βασιλείαν τοῦ θεοῦ
  rationale: The finite verb forms a complete English sentence while keeping proclamation distinct from teaching.
- pob_phrase: teaching the things concerning the Lord Jesus the Messiah
  simplified_phrase: taught about the Lord Jesus the Messiah
  preserved_meaning: Paul instructed others about Jesus while retaining Messiah as his title.
  reasoning_layer_used: lexical and theological decisions for τὰ περὶ and Ἰησοῦ Χριστοῦ
  rationale: The idiom “the things concerning” becomes natural English without weakening the chosen title.
- pob_phrase: with all boldness, unhindered
  simplified_phrase: with complete boldness and without being stopped
  preserved_meaning: Paul spoke fearlessly, and his ministry was not prevented.
  reasoning_layer_used: lexical decisions for μετὰ πάσης παρρησίας and ἀκωλύτως
  rationale: The closing ideas are expressed in common wording while preserving their climactic force.
translation_notes:
  risk_flags:
