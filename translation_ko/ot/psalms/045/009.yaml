- from: 모든 당신의 옷은 몰약, 알로에, 계수나무의 향기로 가득하며, 상아 궁전들에서 현악이 당신을 기쁘게 합니다.[a][b]
  to: 왕들의 딸들이 당신의 귀한 여인들 가운데 있고[a], 오빌의 금으로 단장한 왕비가 당신 오른편에 서 있습니다.[b]
  rationale: 제시된 WLC 본문을 직접 반영하여 절 전체를 새로 번역했습니다. ‘서 있습니다’는 נצבה의 시적 장면 묘사를 살렸고, ‘오빌의 금으로 단장한’은 전치사 בְּ가 나타내는 복식·장식을 자연스러운 한국어로 표현합니다. 난해한 ‘귀한 여인들’은 문맥상 왕실 여성 수행원들을 가리키는 것으로 번역하되, 각주에서 가능한 어휘적 대안을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:07:14Z'
