translation:
  text: “For look, I will give the command and sift the house of Israel among all the nations, as grain is shaken in a sieve[a], and not a single pebble will fall through[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: A coarse grain sieve lets kernels pass through while holding back stones.
    reason: cultural_note
  - marker: b
    text: Or, “not a single grain will fall to the ground,” an image of preserving the grain during sifting.
    reason: alternative_reading
