id: WIS.12.10
reference: Wisdom of Solomon 12:10
source:
  edition: lxx-swete-1909
  text: κρίνων δὲ κατὰ βραχὺ ἐδίδους τόπον μετανοίας, οὐκ ἀγνοῶν ὅτι πονηρὰ ἦ γένεσις αὐτῶν καὶ ἔμφυτος ἡ κακία αὐτῶν, καὶ ὅτι οὐ μὴ ἀλλαγῇ ὁ λογισμὸς αὐτῶν εἰς τὸν αἰῶνα,
  language: Greek
  pages:
  - 621
  - 640
  - 641
  - 642
  - 643
  - 644
  - 645
  - 661
  - 662
  - 663
  - 664
  confidence: high
  validation: agree
  note: This verse is being loaded from the normalized translation-ready override layer derived from the adjudicated corpus. Translation-ready override derived from final_corpus_adjudicated; dropped duplicate chapter 20 and spillover beyond Wisdom 19:22.
translation:
  text: But in judging them little by little[a], you were giving room for reorientation toward you[c], not being unaware that their origin was evil and their wickedness innate, and that their way of thinking would never change forever[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or "you were giving an opportunity for reorientation." Greek topos supplies the image of room/place; metanoia is traditionally rendered "repentance."
    reason: lexical_alternative
  - marker: b
    text: Or 'their generation was evil' or 'their stock was evil' for 'their origin was evil.' The Greek γένεσις can refer to origin, birth, or lineage.
    reason: lexical_alternative
  - marker: c
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνων
  chosen: in judging
  alternatives:
  - while judging
  - when judging
  - though judging
  lexicon: BDAG
  rationale: Present participle of κρίνω, here introducing the manner/circumstance of God's action. 'In judging' keeps the participial linkage without over-specifying temporal nuance.
- source_word: κατὰ βραχύ
  chosen: little by little
  alternatives:
  - gradually
  - bit by bit
  - by degrees
  lexicon: LSJ
  rationale: The phrase denotes gradualness or step-by-step action. 'Little by little' is idiomatic modern English and preserves the incremental sense better than the more abstract 'gradually'.
- source_word: ἐδίδους τόπον μετανοίας
  chosen: you were giving room for reorientation toward you
  alternatives:
  - you were giving room for repentance
  - you were giving an opportunity for repentance
  - you were allowing time for repentance
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use reorientation toward you because the speaker addresses God directly; do not switch the addressee to a detached third-person reference. The direction is contextual clarification, not a literal component of metanoia. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
- source_word: οὐκ ἀγνοῶν
  chosen: not being unaware
  alternatives:
  - not ignoring
  - knowing full well
  - not being ignorant
  lexicon: BDAG
  rationale: The participle indicates full awareness. 'Not being unaware' closely tracks the Greek form while sounding natural enough in context.
- source_word: πονηρὰ ἦ γένεσις αὐτῶν
  chosen: their origin was evil
  alternatives:
  - their generation was evil
  - their stock was evil
  - their nature from birth was evil
  lexicon: LSJ
  rationale: γένεσις can denote origin, birth, or lineage. 'Origin' is broad enough to preserve the statement without importing a stronger biological determinism than the Greek itself requires.
- source_word: ἔμφυτος ἡ κακία αὐτῶν
  chosen: their wickedness innate
  alternatives:
  - their wickedness inborn
  - their evil implanted within them
  - their malice native to them
  lexicon: LSJ
  rationale: ἔμφυτος means inborn/implanted by nature. 'Innate' is concise and communicates the sense clearly in modern English.
- source_word: ὁ λογισμὸς αὐτῶν
  chosen: their way of thinking
  alternatives:
  - their reasoning
  - their mind
  - their purpose
  lexicon: BDAG
  rationale: λογισμός can mean thought, reasoning, or mindset. 'Way of thinking' captures the dispositional sense here better than the narrower 'reasoning' or the overly broad 'mind'.
- source_word: οὐ μὴ ἀλλαγῇ
  chosen: would never change
  alternatives:
  - would by no means change
  - would not change at all
  lexicon: BDAG
  rationale: οὐ μή with the aorist subjunctive is emphatically negative. 'Would never change' conveys the force naturally in English.
- source_word: εἰς τὸν αἰῶνα
  chosen: never
  alternatives:
  - forever
  - for all time
  - unto the age
  lexicon: BDAG
  rationale: In this idiom the phrase intensifies the permanence of the negation. Rendering it with 'never' avoids awkwardness while preserving the sense of enduring impossibility.
