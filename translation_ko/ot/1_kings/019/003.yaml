    rationale: 문법상 이해할 수 있으나, 한국어에서는 목숨을 보전하려는 목적을 ‘목숨을 건지려고’로 표현하는 편이 자연스럽고 본문의 의미에도 충실합니다.
  revised_text: 그는 보고 일어나 자기 목숨을 건지려고 떠나, 유다에 속한 브엘세바에 이르러 그의 종을 այնտեղ 남겨 두었습니다.
