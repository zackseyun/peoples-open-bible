  terminology: «Oh Dios» reproduce naturalmente el vocativo אֱלֹהִים. «Profundidades» comunica תְהֹמוֹת en registro poético comprensible. No se añade una interpretación histórica, mitológica o doctrinal a la personificación de las aguas.
