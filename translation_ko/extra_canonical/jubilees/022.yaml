base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022.yaml
  text: '1[1]. And it came to pass in the first week, in the forty-second jubilee, in the second year of that week—the year in which Abraham died—that Isaac and Ishmael came from the Well of the Oath, to celebrate the feast of weeks, that first feast of the harvest, with Abraham their father.

    2. And Abraham rejoiced because both his sons had come.

    3. For Isaac had many possessions in Beer-sheba, and Isaac went and prepared a feast and brought it to his father.

    4. And in those days Ishmael came to see his father, and both of them came together; and Isaac slaughtered a sacrifice for a thank offering and offered it on the altar which his father had made in Hebron.

    5. And he brought a peace offering, and made a great feast of rejoicing before Ishmael his brother[5]. And Rebekah made fresh cakes from new grain and gave them to Jacob her son, so that he might bring them to Abraham his father’s father, from the firstfruits of the land, that he might eat and bless the Creator of all before he died.

    6. And Isaac also sent by the hand of Jacob the best of the thank offering to Abraham, that he might eat and drink.

    7. And he ate and drank, and blessed the Most High God, who created heaven and earth, who made all the fatness of the earth, and gave it to the children of men to eat and to drink and to bless their Creator.

    8. And now I give thanks to you, my God, because you have shown me this day. Behold, I am one hundred seventy-five years old, old and complete in days, and all my days have been peace.

    9. The sword of the adversary has not overcome me in all that you have given to me and to my children all the days of my life until this day.

    10. May your mercy and your peace be upon your servant and upon the seed of his sons, that they may be for you a chosen people and an inheritance from among all the nations of the earth, from now and for all the days of the generations of the earth, for all ages.

    11. And he called Jacob and said, “My son Jacob, may the God of all bless you and strengthen you to do righteousness and his will before him. And may he choose you and your seed, that you may be for him a people for inheritance according to his will for all the days.

    12. And you, my son Jacob, come near and kiss me.”

    13. And he came near and kissed him. And he said, “Blessed be my son Jacob and all his sons to the Lord Most High for all ages. May the Lord give you a seed of righteousness; and may he sanctify some of your offspring in the midst of all the earth. Nations will desire you, and all nations will bow down before your seed.

    14. Be strong before men, and while you rule among all the seed of Seth, then your ways and the ways of your sons will be justified, so that they may become a holy people.

    15. May the Most High God give you all the blessings with which he blessed me and with which he blessed Noah and Adam. May they rest upon the holy head of your seed from generation to generation and forever.

    16. And may he cleanse you from all uncleanness and impurity, so that he may forgive all your transgressions and your sins of ignorance. And may he strengthen you and bless you, and may you inherit the whole earth.

    17. And may he renew his covenant with you, that you may be for him a people for inheritance for all ages, and that he may be God to you and to your seed in truth and righteousness all the days of the earth.

    18. And you, my son Jacob, remember my words and keep the commandments of Abraham your father. Separate yourself from the nations, and do not eat with them, and do not act according to their deeds, and do not become their companion; for their deeds are defiled, and all their ways are pollution and abomination and uncleanness.

    19. They sacrifice their sacrifices to the dead, and they worship demons, and they eat over the graves, and all their works are vanity and nothingness.

    20. They have no heart to understand, and their eyes do not see what their works are, and how they go astray when they say to wood, ‘You are my god,’ and to stone, ‘You are my lord, and you are my deliverer.’ And they have no heart.

    21. But you, my son Jacob, may the Most High God help you, and may the God of heaven bless you and remove you from their uncleanness and from all their error.

    22. Take heed, my son Jacob, that you do not take a wife from any seed of the daughters of Canaan, for all his seed is destined for uprooting from the earth.

    23. For because of the transgression of Ham, Canaan erred, and all his seed will be destroyed from the earth; and there will be no remnant from him, nor one who escapes, on the day of judgment.

    24. And for all who worship idols and for the profane there is no hope in the land of the living; for they will go down to Sheol, and they will walk into the place of judgment, and they will have no memorial on the earth. As the sons of Sodom were taken away from the earth, so all who worship idols will be taken away.

    25. Do not fear, my son Jacob, and do not be dismayed, son of Abraham. The Most High God will preserve you from destruction, and he will rescue you from every path of error.

    26. This house I have built for myself, to put my name upon it in the earth. It is given to you and to your seed forever, and it will be called the house of Abraham. It is given to you and to your seed forever, for you will build my house and establish my name before God forever. Your seed and your name will stand throughout all the generations of the earth.”

    27. And he finished commanding him and blessing him.

    28. And both of them lay down together on one bed, and Jacob slept in the bosom of Abraham, his father’s father. And he kissed him seven times, and his affection and his heart rejoiced over him.

    29. And he blessed him with all his heart and said, “The Most High God, the God of all, and Creator of all, who brought me out from Ur of the Chaldeans to give me this land as an everlasting possession, and to establish a holy seed, may he be blessed forever.”

    30. And he blessed Jacob and said, “My son, in whom with all my heart and in all my affection I rejoice, may your grace and your mercy be upon him and upon his seed all the days.

    31. And do not forsake him and do not abandon him from now and forever. And let your eyes be open upon him and upon his seed, that you may keep him and bless him and sanctify him as a people for your inheritance. And bless him with all your blessings from now and for all the days forever[30][28][26][24][19][16][14], and renew your covenant and your mercy with him and with his seed according to all your will throughout all the generations of the earth.”'
  footnotes:
  - marker: '1'
    text: 'The opening chronology is literal: ''in the first week, in the forty-second jubilee, in the second year.'' Jubilees regularly dates events by jubilees and weeks of years; this should not be simplified away.'
    reason: cross_reference
  - marker: '5'
    text: The phrase 'that first feast of the harvest' likely identifies the Feast of Weeks as a firstfruits/harvest festival.
    reason: lexical_alternative
  - marker: '14'
    text: The wording is difficult. The Ge'ez explicitly says 'seed of Seth'; the clause about Jacob's status among them may also carry the sense of being exalted or ruling among humankind.
    reason: segmentation_note
  - marker: '16'
    text: The phrase rendered 'sins of ignorance' is textually difficult; the Ge'ez seems to distinguish deliberate transgressions from errors done without full knowledge.
    reason: lexical_alternative
  - marker: '19'
    text: '''They eat over the graves'' likely refers to funerary or necromantic cult meals.'
    reason: cultural_note
  - marker: '24'
    text: The term 'Sheol' is retained rather than translated as 'hell' or 'grave' because the text distinguishes descent to Sheol from entry into a 'place of judgment.'
    reason: alternative_reading
  - marker: '26'
    text: '''This house I have built for myself'' may refer to Abraham''s cultic site, but the following lines also sound dynastic (''house of Abraham''). The ambiguity is likely intentional.'
    reason: segmentation_note
  - marker: '28'
    text: The final clause is difficult; the sense is that Abraham's affection and inward disposition remained warmly fixed on Jacob.
    reason: segmentation_note
  - marker: '30'
    text: The wording shifts awkwardly between second and third person ('your grace ... upon him'). The translation preserves the prayer-like sense without forcing strict grammatical regularity.
    reason: textual_variant
translation:
  language: ko
  text: '1. 그리고 마흔넷째 희년 첫째 주의 둘째 해, 곧 아브라함이 죽은 해에, 이삭과 이스마엘은 맹세의 우물에서 와서 그들의 아버지 아브라함과 함께 추수의 첫열매를 드리는 이 절기, 곧 칠칠절을 지키려고 왔습니다.

    2. 아브라함은 그의 두 아들이 모두 왔으므로 기뻐하였습니다.

    3. 이삭에게는 베르세바에 많은 재산이 있었으므로, 이삭은 자기 재산을 보러 갔다가 아버지에게 돌아가곤 했습니다.

    4. 그때 이스마엘이 자기 아버지 아브라함을 찾아왔고, 그 두 사람이 함께 왔습니다. 이삭은 감사 제물로 희생 제물을 잡아, 아버지가 헤브론에 만든 제단 위에 바쳤습니다.

    5. 그는 화목제물을 바치고 그의 형제 이스마엘 앞에서 크게 기뻐하는 잔치를 베풀었습니다. 리브가는 새 곡식으로 갓 만든 과자를 만들어 아들 야곱에게 주었습니다. 이는 그가 땅의 첫 열매로 만든 그것들을 그의 아버지 아브라함에게 가져가, 아브라함이 먹고 죽기 전에 모든 것의 창조주를 찬송하게 하려는 것이었습니다.

    6. 이삭도 야곱의 손으로 감사 제물 가운데 가장 좋은 것을 아브라함에게 보내어, 아브라함이 먹고 마시도록 하였습니다.

    7. 그는 먹고 마시고, 하늘과 땅을 창조하시며 땅의 모든 소산을 만드신 지극히 높으신 하나님을 찬송하였습니다. 하나님께서는 사람들이 먹고 마시며 그들의 창조주를 찬송하도록 그것을 사람의 자손에게 주셨습니다.

    8. 이제 제가 제 하나님께 감사드립니다. 하나님께서 이 날을 제가 보게 해 주셨기 때문입니다. 보십시오, 저는 백칠십오 세로 나이가 많고 날수가 찼으며, 제 모든 날이 평안했습니다.

    9. 대적의 칼은 주께서 저와 제 자녀들에게 주신 모든 것에 있어서, 제 생애의 모든 날 동안 오늘에 이르기까지 저를 이기지 못하였습니다.

    10. 나의 하나님, 당신의 긍휼과 평강이 당신의 종과 그의 아들들의 씨 위에 있게 하셔서, 그들이 당신을 위한 택하신 백성이 되고 땅의 모든 민족 가운데서 당신의 기업이 되게 하소서. 이제부터 땅의 세대들이 이어지는 모든 날 동안, 모든 시대에 걸쳐 그러하게 하소서.

    11. 그가 야곱을 불러 말하였습니다. “내 아들 야곱아, 만물의 하나님께서 너를 복 주시고, 그의 앞에서 의를 행하고 그의 뜻을 행하도록 너를 강하게 하시기를 바랍니다. 또 그가 너와 네 씨를 택하셔서, 너희가 모든 날 동안 그의 뜻에 따라 그를 위한 기업의 백성이 되게 하시기를 바랍니다.”

    12. 그리고 너, 내 아들 야곱아, 가까이 와서 내게 입맞추십시오.

    13. 그가 가까이 와서 그에게 입맞추고 말했습니다. “지극히 높으신 주께서 내 아들 야곱과 그의 모든 아들을 영원토록 복되게 하시기를. 주께서 너에게 의로운 씨를 주시고, 온 땅 가운데에서 네 자손 가운데 일부를 거룩하게 하시기를. 민족들이 너를 섬기고, 모든 민족이 네 씨 앞에 엎드리게 하시기를.”

    14. 사람들 앞에서 굳세십시오. 셋의 모든 후손 가운데서 다스리시는 동안, 당신과 당신 아들들의 행로는 의롭다 인정받을 것이며, 그들은 거룩한 백성이 될 것입니다.

    15. 지극히 높으신 하나님께서 저와 노아와 아담에게 복 주신 모든 복을 당신에게 주시기를 빕니다. 그 복들이 당신의 후손의 거룩한 머리 위에 모든 세대에 걸쳐 영원히 머물기를 빕니다.

    16. 그분께서 모든 더러움과 부정함에서 당신을 정결하게 하셔서, 당신의 모든 허물과 모르고 지은 죄를 용서하시고, 당신을 강하게 하시며 복을 주시기를 바랍니다. 또 당신이 온 땅을 상속받기를 바랍니다.

    17. 그분께서 당신과 맺으신 언약을 새롭게 하시어, 당신이 모든 시대에 걸쳐 그분의 유업이 될 백성이 되게 하시고, 땅의 모든 날 동안 진실과 의로 당신과 당신의 씨에게 하나님이 되시기를 빕니다.

    18. 그리고 내 아들 야곱아, 내 말을 기억하고 네 아버지 아브라함의 명령들을 지키십시오. 민족들에게서 스스로를 구별하고, 그들과 함께 먹지 말며, 그들의 행실대로 행하지 말고, 그들의 벗이 되지도 마십시오. 그들의 행실은 부정하고, 그들의 모든 길은 더러움과 가증함과 불결함이기 때문입니다.

    19. 그들은 자기들의 제물을 죽은 자들에게 바치고, 귀신들을 숭배하며, 무덤들 안에서 먹습니다. 그들의 모든 행위는 헛됨과 공허함입니다.

    20. 그들은 깨달을 마음이 없고, 그들의 눈은 자기들이 만든 것을 보지 못하며, 나무에게는 “너는 나의 신이다”라고, 돌에게는 “너는 나의 주이며 나의 구원자다”라고 말할 때 그들이 어떻게 길을 잃는지도 보지 못합니다. 그들에게는 마음이 없습니다.

    21. 그러나 너, 내 아들 야곱아, 지극히 높으신 하나님께서 너를 도와주시고, 하늘의 하나님께서 네게 복을 주시고, 너를 그들의 부정함과 그들의 모든 잘못에서 벗어나게 해 주시기를 바랍니다.

    22. 내 아들 야곱아, 가나안의 딸들의 후손 가운데 누구도 아내로 맞지 않도록 주의하십시오. 가나안의 모든 후손은 땅에서 뿌리째 뽑힐 것이기 때문입니다.

    23. 함의 범죄 때문에 가나안이 잘못을 저질렀고, 그의 모든 후손은 땅에서 멸망될 것이며, 심판의 날에는 그에게서 남은 자도 피하여 벗어날 자도 없을 것입니다.

    24. 우상들을 섬기는 모든 이와 불경한 자들에게는 산 자들의 땅에서 아무 소망이 없습니다. 그들은 스올로 내려가며, 심판의 자리로 가고, 땅 위에서 아무 기념도 남기지 못할 것입니다. 소돔의 아들들이 땅에서 제거된 것처럼, 우상들을 섬기는 모든 이도 그렇게 제거될 것입니다.

    25. 두려워하지 마십시오, 내 아들 야곱아, 그리고 낙심하지 마십시오, 아브라함의 아들이여. 지극히 높으신 하나님께서 당신을 부패에서 지켜 주시고, 모든 잘못의 길에서 당신을 건져 주실 것입니다.

    26. 이 집은 내가 내 이름을 그 위에, 땅 위에 두려고 나 자신을 위해 지은 집입니다. 이것은 너와 네 자손에게 영원히 주어졌으며, 아브라함의 집이라 불릴 것입니다. 이것은 너와 네 자손에게 영원히 주어졌습니다. 이는 네가 내 집을 짓고 하나님 앞에서 내 이름을 영원히 세울 것이기 때문입니다. 네 자손과 네 이름은 땅의 모든 세대에 걸쳐 서 있을 것입니다.”

    27. 그는 명령하고 그를 축복하는 일을 마쳤습니다.

    28. 그리고 둘은 한 침상에 함께 누웠으며, 야곱은 자기 아버지의 아버지인 아브라함의 품에서 잠들었습니다. 아브라함은 야곱에게 일곱 번 입을 맞추었고, 그의 긍휼과 마음은 야곱을 두고 기뻐하였습니다.

    29. 그리고 그는 온 마음으로 그를 축복하고 말했습니다. “나를 갈대아인의 우르에서 이끌어 내셔서 이 땅을 영원한 소유로 내게 주시고, 내가 거룩한 씨를 세우도록 하신 지극히 높으신 하나님, 만물의 하나님 곧 만물의 창조주께서 영원히 찬송받으시기를 빕니다.”

    30. 그리고 그는 야곱에게 복을 주며 말했습니다. “내가 온 마음과 온 애정으로 기뻐하는 내 아들아, 당신의 은혜와 당신의 긍휼이 그에게와 그의 자손에게 언제나 머물기를 빕니다.”

    31. 그를 저버리지 마시고 그를 떠나지 마십시오. 이제부터 영원한 날들까지. 또한 주님의 눈이 그와 그의 씨 위에 열려 있게 하시어, 주님께서 그를 지키시고 복 주시며 거룩하게 하셔서 주님의 유산에 속한 한 백성이 되게 하십시오. 이제부터 영원한 모든 날 동안 주님의 모든 복으로 그를 복 주시고, 주님의 모든 뜻대로 그와 그의 씨와 맺으신 주님의 언약과 자비를 새롭게 하시며, 땅의 모든 세대에 걸쳐 그렇게 하십시오.'
