  rationale: 원문 הָבָה־לָנוּ עֶזְרָת מִצָּר를 간구형 ‘도움을 주소서’로 옮기고, 군사적 시편 문맥에 알맞은 개인적 독법 ‘원수’를 채택했습니다. 다만 צַר의 비인격적 독법은 각주에 보존했습니다. וְשָׁוְא תְּשׁוּעַת אָדָם은 인간에게서 기대하는 구원이 무익하다는 뜻이므로, 한국어에서 ‘사람의 구원’이 사람 자체의 구원으로 오해될 여지를 피하여 ‘사람에게서 오는 구원’으로 명료하게 번역했습니다.
