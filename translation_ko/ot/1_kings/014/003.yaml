  source_fidelity: 히브리어의 물품 목록(떡 열 개, 니쿠딤, 꿀 한 용기)과 아이에게 일어날 일을 그가 알려 준다는 내용은 대체로 반영했습니다. 다만 ‘당신의 손에 … 가지고’는 히브리어의 ‘손에 들고 가져가라’는 동작을 한국어로 부자연스럽게 옮긴 표현입니다.
  naturalness: ‘당신의 손에 떡 … 가지고’는 현대 표준 한국어에서 어색합니다. ‘…을 손에 들고 그에게 가십시오’로 정리하면 자연스럽고 명령문의 흐름도 분명해집니다.
  terminology: ‘떡’은 לֶחֶם에 적절하며, ‘꿀 한 단지’도 בקבוק דבש의 용기 표현을 무리 없이 반영합니다. נִקֻּדִים은 정확한 종류가 확정되지 않으므로 일반적인 ‘과자 몇 개’가 안전합니다.
