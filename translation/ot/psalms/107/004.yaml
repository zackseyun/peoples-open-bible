id: PSA.107.4
reference: Psalms 107:4
source:
  edition: WLC
  text: תָּע֣וּ בַ֭/מִּדְבָּר בִּ/ישִׁימ֣וֹן דָּ֑רֶךְ עִ֥יר מ֝וֹשָׁ֗ב לֹ֣א מָצָֽאוּ׃
translation:
  text: Some wandered in the wilderness, in a wasteland; they found no way to an inhabited city.
  philosophy: dynamic
lexical_decisions:
- source_word: תָּעוּ
  chosen: They wandered
  alternatives:
  - They went astray
  - They roamed
  lexicon: HALOT
  rationale: The verb from תעה denotes wandering or straying. In this context of travelers lacking direction, 'wandered' best captures both movement and lostness without overinterpreting moral error.
- source_word: בַמִּדְבָּר
  chosen: in the wilderness
  alternatives:
  - in the desert
  lexicon: HALOT
  rationale: מִדְבָּר commonly denotes wilderness/desert terrain. 'Wilderness' is preferred in Psalms for natural English and biblical resonance, while still conveying an uninhabited region.
- source_word: בִּישִׁימוֹן
  chosen: in a wasteland
  alternatives:
  - in the wasteland
  - in a desolate region
  - in the desolate way
  lexicon: HALOT
  rationale: The noun denotes a desolate or waste region and completes the first colon.
- source_word: דָּרֶךְ
  chosen: way to
  alternatives:
  - road
  - path
  - way
  lexicon: HALOT
  rationale: The noun begins the object phrase 'way to an inhabited city,' the very way supplied in verse 7.
- source_word: עִיר מוֹשָׁב
  chosen: an inhabited city
  alternatives:
  - inhabited city
  - city of habitation
  - settled city
  - city to dwell in
  lexicon: HALOT
  rationale: The construct describes a settled or inhabited city, the destination they could not find.
- source_word: לֹא מָצָאוּ
  chosen: they found no
  alternatives:
  - they did not find
  lexicon: HALOT
  rationale: The Hebrew negated perfect straightforwardly states failure to find. 'They found no' is concise and natural in English poetry.
