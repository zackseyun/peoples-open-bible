  from: O Yahweh[a], you brought up my soul from Sheol[b][c]; you kept me alive from among those going down to the pit.
  to: O Yahweh, you brought my life up from Sheol[a]; you kept me alive from among those going down to the pit[b].
  rationale: In this immediate Sheol/death context, נפשי denotes the speaker’s life and “my life” avoids importing a separable-soul sense not required by the Hebrew. “Brought ... up” preserves the vertical image, and the remaining note properly records the syntactic alternatives in the second colon.
