review_pass:
  verdict: revise
  source_fidelity: δίδωμι는 현재형이므로 ‘줍니다’가 적절합니다. οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα는 강한 미래 부정으로, ‘결코 멸망하지 않을 것입니다’가 그 강도를 자연스럽게 보존합니다. 원문의 εἰς τὸν αἰῶνα는 여기서 ‘결코/영원히’라는 관용적 영속 부정 표현이므로 ‘결코 영원히’처럼 두 번 중첩할 필요가 없습니다. ἁρπάσει는 미래형이므로 마지막 절도 미래형으로 맞추었습니다.
  naturalness: 현행 ‘결코 영원히 멸망하지’는 현대 한국어에서 중복 강조로 부자연스럽습니다. 또한 한 문장 안에서 ‘줍니다’와 ‘못합니다’가 함께 쓰인 현행도 의미는 통하지만, 마지막 동사를 미래형으로 고치면 원문의 시제와 약속의 진술이 더 명확해집니다.
  terminology: ‘영원한 생명’, ‘멸망하다’, ‘내 손에서 … 빼앗아 가다’는 요한복음의 문맥과 현대 표준어 합쇼체에 잘 맞습니다. ‘빼앗아 가다’는 ἁρπάζω의 강탈·탈취 의미를 자연스럽게 드러냅니다.
  issues:
  - severity: medium
    issue: ‘결코 영원히 멸망하지 않을 것이며’의 중복 강조
    rationale: οὐ μὴ와 εἰς τὸν αἰῶνα의 강한 부정은 한국어 ‘결코 … 않다’로 충분히 옮길 수 있습니다. ‘결코 영원히’는 번역투로 부자연스럽고, 두 표현을 기계적으로 중첩합니다.
  - severity: low
    issue: 마지막 절의 시제가 현재형 ‘못합니다’임
    rationale: ἁρπάσει는 미래 직설법이므로 ‘빼앗아 가지 못할 것입니다’가 원문의 문법적 형태와 더 정확히 대응합니다.
  revised_text: 그리고 나는 그들에게 영원한 생명을 줍니다. 그들은 결코 멸망하지 않을 것이며, 아무도 내 손에서 그들을 빼앗아 가지 못할 것입니다.
