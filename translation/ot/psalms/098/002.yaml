  from: Yahweh has made his salvation known[a][b]; before the eyes of the nations he has revealed his righteousness.
  to: Yahweh has made his salvation known; in the sight of the nations he has revealed his righteousness.[a]
  rationale: “In the sight of the nations” is a natural rendering of לְעֵינֵי, and the existing markers are attached to the wrong words. A note on righteousness may be retained for the genuine lexical alternative “justice”; “vindication” is more contextually interpretive and need not be presented as a coordinate lexical alternative.
