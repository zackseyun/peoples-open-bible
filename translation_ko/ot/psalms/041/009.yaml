revisions:
- from: 불량한 것이 그에게 쏟아졌고, 이제 그가 누워 있으니 다시는 일어나지 못합니다.[a]
  to: 나와 평화롭게 지내던 사람, 내가 신뢰하던 이, 내 빵을 먹던 이마저 나를 향해 자기 발꿈치를 높이 들었습니다.[a][b][c][d]
  rationale: 구절 식별과 원문 대조 결과, 현 초안은 시편 41:9가 아닌 41:8을 번역한 것이므로 본문 전체를 교체해야 합니다. 개정문은 גַּם의 강조를 ‘…이마저’로, אִישׁ שְׁלוֹמִי의 관계성을 ‘나와 평화롭게 지내던 사람’으로, בָּטַחְתִּי בוֹ를 ‘내가 신뢰하던 이’로, אוֹכֵל לַחְמִי를 ‘내 빵을 먹던 이’로 반영했습니다. 마지막 관용어는 본문에서 구체적 이미지로 유지하고 각주에서 설명했으며, 신약의 후대 인용은 본문의 직접적 의미에 덧붙이지 않고 상호참조 각주로만 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:07:29Z'
