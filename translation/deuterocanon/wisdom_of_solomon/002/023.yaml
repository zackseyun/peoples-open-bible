  text: ὅτι ὁ θεὸς ἔκτισε τὸν ἄνθρωπον ἐπʼ ἀφθαρσίᾳ, καὶ εἰκόνα τῆς ἰδίας ἰδιότητος ἐποίησεν αὐτόν·
