  text: וַ/יְהִי֙ כְּ/כַלֹּת֔/וֹ לְ/דַבֵּ֕ר אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/תִּבָּקַ֥ע הָ/אֲדָמָ֖ה אֲשֶׁ֥ר תַּחְתֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/031.yaml
  text: And as soon as he had finished speaking all these words, the ground beneath them split open.
translation:
  language: ko
  text: 그가 이 모든 말을 마치자, 그들 아래의 땅이 갈라졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/יְהִי כְּ/כַלֹּת/וֹ לְ/דַבֵּר
  english_pob_choice: And as soon as he had finished speaking
  chosen_korean: 그가 이 모든 말을 마치자
  alternatives_korean:
  - 그가 이 모든 말을 다 말하기를 마치자
  - 그가 이 모든 말을 끝내자마자
  lexicon: כָּל + דְּבָרִים / כָּלּוֹת
  rationale: כְּ/כַלֹּת + לְ/דַבֵּר는 ‘말하기를 마치다’의 완료 시점을 가리키며, POB의 as soon as를 반영해 자연스러운 즉시성 표현으로 옮겼습니다.
- source_word: אֵת כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  english_pob_choice: all these words
  chosen_korean: 이 모든 말
  alternatives_korean:
  - 이 모든 말씀
  - 이 모든 말들
  lexicon: דָּבָר
  rationale: דְּבָרִים은 문맥상 ‘말씀’보다 일반적인 ‘말/말들’이 적절하며, 바로 앞의 발화 내용을 가리키므로 ‘이 모든 말’로 간결하게 처리했습니다.
- source_word: וַ/תִּבָּקַע הָ/אֲדָמָה אֲשֶׁר תַּחְתֵּי/הֶם
  english_pob_choice: the ground beneath them split open
  chosen_korean: 그들 아래의 땅이 갈라졌습니다
  alternatives_korean:
  - 그들 밑의 땅이 갈라졌습니다
  - 그들의 아래 땅이 갈라졌습니다
  lexicon: תִּבָּקַע / אֲדָמָה
  rationale: בקע의 기본 의미인 ‘갈라지다/찢어지다’를 살려, 지각이 실제로 분열되는 장면을 직설적으로 표현했습니다.
theological_decisions:
- issue: 즉시성 표현의 강도
  chosen_reading: ‘마치자’로 완료 직후의 급격한 사건 전개를 살렸습니다.
  alternative_readings:
  - ‘끝나자마자’로 더 구어적으로 옮길 수 있음
  - ‘말을 마치고’로 완만하게 옮길 수 있음
  rationale: 히브리어 완료 동작 직후에 바로 땅이 갈라지는 서술 구조를 유지해야 하므로, 사건의 연속성과 긴박함을 약화하지 않는 번역을 택했습니다.
  doctrine_reference: 서사 본문의 문맥 충실성
