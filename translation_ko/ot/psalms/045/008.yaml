  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָהַ֣בְתָּ צֶּדֶק֮ וַ/תִּשְׂנָ֫א רֶ֥שַׁע עַל כֵּ֤ן מְשָׁחֲ/ךָ֡ אֱלֹהִ֣ים אֱ֭לֹהֶי/ךָ שֶׁ֥מֶן שָׂשׂ֗וֹן מֵֽ/חֲבֵרֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/008.yaml
  text: All your garments are fragrant with myrrh, aloes, and cassia; from ivory palaces, you are made glad.[a]
  footnotes:
  - marker: a
    text: Or, 'Therefore, O God, your God has anointed you with the oil of gladness more than your companions.' The first 'God' can be read as a vocative rather than the subject of the verb.
    reason: alternative_reading
  - marker: b
    text: Quoted in Hebrews 1:9.
    reason: cross_reference
translation:
  language: ko
  text: 몰약과 침향과 계피의 향기가 당신의 모든 옷에 배어 있고, 상아 궁전들에서 현악기가 당신을 기쁘게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘당신을 기쁘게 하였습니다’의 복수 주어를 명시하지 않습니다. ‘현악기’는 전통적인 해석이며, 음악·음악가 등으로 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘상아 궁전들에서’는 ‘상아 궁전들로부터’, ‘상아 궁전들 밖에서’ 또는 문맥에 따라 ‘상아 궁전들로 말미암아’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צֶּדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: 시적 대구에서 רֶשַׁע(악/악함)와 직접 대조되는 윤리·언약적 성격을 살리기 위해, POB의 ‘righteousness’를 한국어 성경 용례에 맞는 ‘의’로 옮겼습니다.
- source_word: רֶשַׁע
  english_pob_choice: wickedness
  chosen_korean: 악
  alternatives_korean:
  - 악함
  - 불의
  - 사악함
  lexicon: HALOT
  rationale: ‘의’와 짝을 이루는 도덕적 대비를 간결하게 살리기 위해 ‘악’을 선택했습니다.
- source_word: שֶׁמֶן שָׂשׂוֹן
  english_pob_choice: the oil of gladness
  chosen_korean: 즐거움의 기름
  alternatives_korean:
  - 기쁨의 기름
  - 환희의 기름
  lexicon: HALOT
  rationale: 시어의 상징적 표현을 유지하되, 한국어에서 자연스럽고 성경적인 문맥에 맞는 ‘즐거움의 기름’으로 옮겼습니다.
- source_word: מֵחֲבֵרֶיךָ
  english_pob_choice: beyond your companions
  chosen_korean: 당신의 동료들보다 더 많이
  alternatives_korean:
  - 당신의 동료들보다
  - 당신의 동무들보다
  lexicon: HALOT
  rationale: 비교전치사 מן의 우위를 분명히 드러내기 위해 ‘-보다 더 많이’로 비교를 명시했습니다.
- source_word: אֱלֹהִים אֱלֹהֶיךָ
  english_pob_choice: God, your God
  chosen_korean: 하나님, 당신의 하나님
  alternatives_korean:
  - 오 하나님, 당신의 하나님
  - 하나님이신 당신의 하나님
  lexicon: HALOT
  rationale: POB의 본문 선택을 따라 첫 번째 אֱלֹהִים을 주어로, 두 번째를 호칭 수식으로 유지하되 한국어에서는 쉼표로 구분해 문장 관계를 분명히 했습니다.
theological_decisions:
- issue: 첫 번째 אֱלֹהִים의 문법적 처리
  chosen_reading: 본문에는 ‘그러므로 하나님, 당신의 하나님이…’로 두고, 첫 번째 אֱלֹהִים을 주어로 읽었습니다.
  alternative_readings:
  - ‘그러므로, 오 하나님, 당신의 하나님이…’로 읽는 호격 해석
  rationale: 히브리어 문맥상 두 해석이 가능하지만, POB의 본문 선택을 따르면서도 한국어에서는 문장 구조가 가장 자연스럽게 들리도록 배치했습니다. 의미상 긴장은 각주로 보존합니다.
  doctrine_reference: 원문 다의성 보존; 시편 45편과 히브리서 1:9의 해석 전통을 열어 둠
- issue: 메시아적/왕적 기름부음의 표현
  chosen_reading: ‘즐거움의 기름’과 ‘동료들보다 더 많이’로 왕의 우월성과 기쁨의 표지를 유지했습니다.
  alternative_readings:
  - ‘기쁨의 기름’
  - ‘동료들 위에’
  rationale: 원문의 시적 과장과 축복의 뉘앙스를 살리기 위해 축약하지 않고 비교 표현을 분명히 했습니다.
  doctrine_reference: 시적·왕권적 표현을 보존하고, 신학적 적용은 본문 밖 해석에 맡김
