base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/034.yaml
  text: Laban said, “Good—let it be according to your word.”
translation:
  language: ko
  text: 라반이 말했습니다. “좋습니다. 당신의 말대로 하겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르렀습니다
  - 말하였습니다
  lexicon: אמר
  rationale: 서술문에서 פשוט한 발화 동사를 현대 합쇼체로 자연스럽게 옮겼습니다.
- source_word: הֵן
  english_pob_choice: Good
  chosen_korean: 좋습니다
  alternatives_korean:
  - 좋아요
  - 알겠습니다
  - 옳습니다
  lexicon: הֵן
  rationale: 감탄사적 동의 표현으로서, POB의 “Good”을 한국어에서 가장 직접적으로 살릴 수 있는 간결한 승인 표현으로 옮겼습니다.
- source_word: ל֖וּ יְהִ֥י
  english_pob_choice: let it be
  chosen_korean: 하겠습니다
  alternatives_korean:
  - 그렇게 되게 하겠습니다
  - 그대로 이루어지게 하겠습니다
  lexicon: היה
  rationale: 허용·승낙의 뜻을 한국어에서 행위자의 의지를 드러내는 미래/의지형으로 자연스럽게 표현했습니다.
- source_word: כִדְבָרֶךָ
  english_pob_choice: according to your word
  chosen_korean: 당신의 말대로
  alternatives_korean:
  - 당신의 말에 따라
  - 당신이 한 말대로
  lexicon: דָּבָר
  rationale: ‘말/언명’의 의미를 살리되, 한국어에서 가장 직관적인 관용 표현인 ‘말대로’로 옮겼습니다.
theological_decisions:
- issue: 라반의 승인 어조
  chosen_reading: 반대나 조건을 덧붙이지 않는 간단한 승낙으로 읽고, ‘좋습니다’로 옮겼습니다.
  alternative_readings:
  - ‘좋군요’처럼 보다 구어적인 승인
  - ‘옳습니다’처럼 판단적 승인
  rationale: 히브리어 הֵן은 대체로 동의·승낙의 짧은 응답으로 기능하므로, 장황한 해석을 덧붙이지 않고 직접적인 승인으로 처리했습니다.
  doctrine_reference: 본문의 담화 기능에 대한 문맥적 해석
- issue: 직접화법의 인칭 유지
  chosen_reading: ‘your word’를 2인칭 직접호칭 구조인 ‘당신의 말대로’로 유지했습니다.
  alternative_readings:
  - ‘네 말대로’
  - ‘당신이 말한 대로’
  rationale: 원문의 2인칭 خطاب을 보존하되, 현대 한국어 합쇼체의 대화체에 맞게 정중한 인칭을 사용했습니다.
  doctrine_reference: 문체 및 담화 재현
