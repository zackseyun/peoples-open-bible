  meaning: The wealth is lost through misfortune, leaving its owner with nothing despite having fathered a son.
  meaning_decisions:
  - source_phrase: בְּעִנְיַן רָע
    prior_rendering: through a harmful affair
    new_rendering: through misfortune
    rationale: The nature of the harmful matter is unspecified. “Misfortune” preserves that breadth without suggesting either a specifically commercial venture or, as “affair” may now suggest, a romantic scandal.
  - source_phrase: וְהוֹלִיד בֵּן וְאֵין בְּיָדוֹ מְאוּמָה
    prior_rendering: and he fathered a son but had nothing in his hand
    new_rendering: He had fathered a son, but was left empty-handed
    rationale: The son’s existence matters against the background of the owner’s loss; the English makes that relationship natural without specifying when the son was born relative to the loss. “Empty-handed” conveys the possession idiom while retaining its hand image.
