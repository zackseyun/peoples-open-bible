translation:
  text: And behold, a dream came to me, and visions fell upon me. I saw visions of
    punishment, and a word came[a] saying that I should tell the children of heaven
    and rebuke them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Charles 1906 places “and a word came, saying” in parentheses. His apparatus
      note 27 explicitly identifies this as an editorial restoration in accordance
      with Greek. It is retained as part of the selected critical edition, not claimed
      as directly preserved wording in all Ethiopic manuscripts.
    reason: textual_variant
lexical_decisions:
- source_word: ወደቁ
  chosen: fell upon
  alternatives:
  - came upon
  rationale: Preserves the striking image of visions falling upon the speaker.
- source_word: መቅሠፍት
  chosen: punishment
  alternatives:
  - chastisement
  rationale: Names the punitive content of the visions without specifying its form.
- source_word: ቃል
  chosen: word
  alternatives:
  - voice
  - message
  rationale: Keeps the source’s wording without identifying the speaker.
- source_word: እንግር ... ወእዝልፎሙ
  chosen: that I should tell ... and rebuke them
  alternatives:
  - that I might tell ... and rebuke them
  rationale: Treats the first-person forms as the task conveyed to Enoch, rather than
    recasting them as a second-person command.
theological_decisions:
- issue: Identity of ውሉደ ሰማይ
  chosen_reading: children of heaven
  alternative_readings:
  - heavenly beings
  - angels
  rationale: Retains the passage’s own designation for those Enoch must address; the
    Watchers context identifies them without requiring an interpretive replacement
    in the verse.
- issue: Nature of the envisioned punishment
  chosen_reading: visions of punishment
  alternative_readings:
  - visions of chastisement
  rationale: The verse does not specify the punishment’s duration or form, so the
    translation does not add either.
