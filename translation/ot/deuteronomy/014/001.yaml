  rationale: The source uses a masculine plural noun. In keeping with the project's gender-accurate policy, the main text preserves that form rather than neutralizing it. This does not deny that the covenant community includes women; it reflects the Hebrew wording.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: Rendering the divine name יהוה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
