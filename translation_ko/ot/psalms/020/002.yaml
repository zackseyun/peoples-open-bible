  verdict: revise
  source_fidelity: 현 초안은 시편 20:2가 아니라 앞 절(20:1)의 히브리어 어휘와 내용을 번역하고 있어, 제시된 WLC 본문(יִשְׁלַח ... יִסְעָדֶךָּ)을 반영하지 못합니다. 개정문은 두 미완료형을 축원/기원으로, מִקֹּדֶשׁ을 ‘성소에서’, יִסְעָדֶךָּ를 ‘붙들어 주시다’로 옮겼습니다.
  naturalness: ‘그분께서 … 보내시고, … 붙들어 주시기를 바랍니다’는 시편의 축원 문맥에 맞는 현대 표준 한국어 합쇼체입니다. ‘당신’은 2인칭 남성 단수 접미사를 자연스럽게 드러내는 문맥상 중립적인 표현입니다.
  terminology: צִיּוֹן은 고유명사 ‘시온’으로 유지했습니다. קֹדֶשׁ은 이 문맥에서 장소를 가리키는 ‘성소’가 가장 자연스럽지만, ‘거룩함/거룩한 곳’이라는 어휘적 가능성은 각주로 보존했습니다. 주어는 본 절에 명시되지 않으므로 ‘그분’으로만 나타내고 야훼라는 이름을 보충하지 않았습니다.
