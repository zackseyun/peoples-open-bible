id: EZK.7.6
reference: Ezekiel 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קֵ֣ץ בָּ֔א בָּ֥א הַ/קֵּ֖ץ הֵקִ֣יץ אֵלָ֑יִ/ךְ הִנֵּ֖ה בָּאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/006.yaml
  text: An end has come; the end has come. It has awakened against you; look, it is coming.
translation:
  language: ko
  text: 끝이 왔습니다. 끝이 왔습니다. 그것이 당신을 향해 깨어났습니다. 보십시오, 그것이 오고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֵץ / הַקֵּץ
  english_pob_choice: An end ... the end
  chosen_korean: 끝 ... 끝
  alternatives_korean:
  - 종말 ... 종말
  - 끝마침 ... 끝마침
  lexicon: קֵץ
  rationale: 히브리어의 반복을 그대로 살려 문장의 급박함과 단정성을 유지했습니다. '종말'은 해석적 뉘앙스가 강해 여기서는 더 직접적인 '끝'을 택했습니다.
- source_word: הֵקִיץ
  english_pob_choice: It has awakened
  chosen_korean: 깨어났습니다
  alternatives_korean:
  - 잠에서 깨어났습니다
  - 각성했습니다
  lexicon: הֵקִיץ
  rationale: 문자적으로는 '깨어나다'이지만, 대상이 의인화된 '끝'이므로 자연스럽고도 직역에 가까운 '깨어났습니다'로 옮겼습니다.
- source_word: אֵלָיִךְ
  english_pob_choice: against you
  chosen_korean: 당신을 향해
  alternatives_korean:
  - 당신에게 맞서
  - 당신을 거슬러
  lexicon: אֵל
  rationale: 영어 POB의 'against you'를 따라 대립 방향을 드러내되, 한국어에서는 '당신을 향해'가 더 직설적이고 문맥상 위협을 잘 살립니다.
- source_word: הִנֵּה
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  lexicon: הִנֵּה
  rationale: 독자에게 주의를 환기하는 감탄사로서, 현대 한국어 합쇼체에 맞는 '보십시오'를 선택했습니다.
theological_decisions:
- issue: 의인화된 '끝'의 표현 방식
  chosen_reading: 끝이 의인처럼 '깨어나' 예루살렘을 향해 오는 심판의 임박성을 유지했습니다.
  alternative_readings:
  - 끝이 다가왔습니다
  - 심판의 끝이 왔습니다
  rationale: 본문은 단순한 시간표시가 아니라 임박한 심판을 의인화된 동작으로 강조합니다. 이를 완화하지 않고 원문의 긴박감을 유지했습니다.
  doctrine_reference: 예언 문학의 심판 선언, 본문 문맥상 하나님의 심판 임박성
