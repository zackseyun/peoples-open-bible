theological_decisions:
- issue: Rendering David's claim of righteousness without overstating sinlessness
  chosen_reading: 'The verse is translated as a covenantal claim of faithful conduct: ''I have kept the ways of the LORD, and I have not acted wickedly by turning from my God.'''
  alternative_readings:
  - A more absolute-sounding rendering such as 'I was blameless' or 'I was not wicked' without relational nuance
  rationale: The Hebrew speaks of keeping the LORD's ways and not acting wickedly from/away from God. The translation preserves the psalm's strong claim of integrity while avoiding an interpretive flattening into absolute sinlessness. The relational nuance of departure from God is retained.
  doctrine_reference: Preserve theological tension rather than resolve it.
revisions:
- timestamp: '2026-04-21T16:17:36Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/low_agreement_recheck/ot/psalms/018/022.job-19688.json
  category: awkward_english
  tier: 1
  from: and I have not acted wickedly by turning from my God
  to: and have not wickedly departed from my God
  rationale: The Hebrew phrase וְלֹֽא רָשַׁעְתִּי מֵאֱלֹהָי combines the verb רשׁע ('to act wickedly') with the preposition מִן ('from'). As noted in lexicons (HALOT, BDB), this specific construction means 'to depart wickedly from.' The current rendering, 'acted wickedly by turning from my God,' is a correct but verbose paraphrase that separates the action from its modifier. The suggested rewrite, 'wickedly departed from my God,' is more concise, elegant, and directly renders the force of the Hebrew construction by using 'wickedly' as an adverb modifying 'departed.' This better reflects the integrated nature of the Hebrew phrase and is common in other major English translations (e.g., ESV, NASB).
