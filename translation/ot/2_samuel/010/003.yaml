  category: meaning_retranslation
  from: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
  to: The Ammonite officials said to Hanun their lord, “Do you think David is honoring your father by sending men to console you? Hasn’t David sent his servants to you to inspect the city, spy it out, and destroy it?”
  rationale: The lexical deliberation rightly treats these questions as the officials’ hostile accusation rather than the narrator’s endorsement. I preserve that distinction while translating the judgment idiom naturally and incorporating the envoys’ consoling role into the text.
