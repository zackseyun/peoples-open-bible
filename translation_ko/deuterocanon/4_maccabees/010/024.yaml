  rationale: 원문의 두 호격을 각각 보존하되, μισάρετε의 ‘덕을 미워하는’ 의미를 회복했습니다. 질문은 τί의 의미에 맞춰 ‘무엇을 하시는 것입니까?’로 고쳤고, προθεῖς는 문맥상 공개적 노출의 함의를 지니면서도 어휘적으로 더 넓은 ‘내세워’로 옮겼습니다. 각주는 ‘내세우다’와 ‘드러내다/내보내다’ 사이의 어휘적 여지를 제시합니다.
