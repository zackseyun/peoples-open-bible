  source_fidelity: 첫 절의 3인칭 소유 접미사(אַלְמְנֹתָיו)를 반영하여 ‘그들의 과부들’로 명시하는 것이 좋습니다. 또한 עָלֵיהָ는 여성 단수이므로 마지막 절은 ‘그녀에게’로 옮겨 앞의 ‘젊은이의 어머니’를 분명히 가리켜야 합니다. עִיר은 마소라 본문상 ‘성읍/도시’이지만 문맥과 결합이 난해하므로, 이를 ‘고난’ 등으로 본문에서 단정적으로 바꾸지 않고 그대로 유지하되 주석으로 밝혔습니다.
  naturalness: ‘그들 위에’와 ‘그 위에’는 각각 대적 관계와 여성 단수 지시를 충분히 드러내지 못합니다. ‘그들에게 맞서’와 ‘그녀에게’가 자연스럽고 정확합니다. ‘보내었습니다’는 현대 표준 합쇼체에서 ‘보냈습니다’로 다듬었습니다.
  terminology: שֹׁדֵד의 폭력적 파괴·약탈 의미를 ‘파괴자’로 유지했습니다. עיר은 전통적 성경 문체의 ‘성읍’으로 옮겼으며, 난해한 본문 상태는 각주에서 설명합니다.
