translation:
  language: ko
  text: 하나님, 주님의 피조물들이 그곳에 자리 잡았습니다[a]. 주께서는 주님의 선하심으로 가난한 이들을 위해 마련하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘주님의 생물’은 여기서 뜻이 분명하지 않습니다. ‘주님의 피조물들’ 외에 ‘주님의 무리’ 또는 ‘주님의 회중’으로 옮길 수도 있습니다.
