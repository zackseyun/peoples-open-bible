  text: Καὶ ἐξῆλθεν Νίκανωρ ἐξ Ἱερουσαλὴμ καὶ παρενέβαλεν ἐν Βεθωρὼν, καὶ συνήντησεν αὐτῷ δύναμις Συρίας.
