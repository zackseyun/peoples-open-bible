  to: 이분이 바로 내가 말한 분입니다. 「내 뒤에 한 사람이 오시는데, 그분은 나보다 앞서 계십니다[a]. 이는 그분이 나보다 먼저 계셨기 때문입니다[b].」
  rationale: 원문에 충실하도록 ὑπὲρ οὗ의 의미를 본문에서는 ‘내가 말한 분’으로 처리하고, 잘못된 우위 관련 각주를 ἔμπροσθέν μου γέγονεν에 연결했습니다. 최종절은 ‘먼저 계셨기 때문입니다’로 번역하여 선재를 암시하되 ‘존재하셨다’로 본문을 과도하게 한정하지 않았습니다. 인용문의 마침표와 각주 위치도 원어 단위에 맞게 정리했습니다.
