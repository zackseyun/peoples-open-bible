  source_fidelity: 현 초안은 시편 22편 5절이 아니라 앞 절의 내용(‘우리 조상들’, 하나님께서 그들을 구원하심)을 옮기고 있습니다. 본문의 זָעֲקוּ(그들이 부르짖었다), וְנִמְלָטוּ(그들이 구출되었다), בָטְחוּ(그들이 신뢰했다), וְלֹא בֹשׁוּ(그들이 수치를 당하지 않았다)를 모두 반영해야 합니다.
  naturalness: ‘주님께 부르짖어 구출되었고, 주님을 신뢰하여 수치를 당하지 않았습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 두 병행절의 전개를 명료하게 보존합니다.
  terminology: בָטַח는 ‘신뢰하다’로, בּוֹשׁ은 신뢰의 결과로서의 공적 수치·불명예의 뉘앙스를 살린 ‘수치를 당하다’로 옮기는 것이 적절합니다. 원문에는 ‘우리 조상들’이나 하나님의 직접 행위를 나타내는 2인칭 동사가 없습니다.
