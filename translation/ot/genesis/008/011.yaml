  from: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
  to: In the evening the dove returned to him, and there in its beak was a freshly plucked olive leaf. So Noah knew that the waters on the earth had subsided.
