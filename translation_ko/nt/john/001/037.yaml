translation:
  language: ko
  text: 그 두 제자[a]는 그가 말하는 것을 듣고 예수를 따랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 명시적으로, ‘그의 두 제자.’ 직전 맥락에서 세례 요한을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  english_pob_choice: the two disciples
  chosen_korean: 그 두 제자
  alternatives_korean:
  - 그의 두 제자
  - 두 제자들
  - 요한의 두 제자
  lexicon: BDAG
  rationale: 원문의 'αὐτοῦ'는 직전 문맥(요한의 위치)을 가리키므로 한국어에서는 소유표현을 생략한 '그 두 제자'로 자연스럽게 식별합니다. '그의 두 제자'라고 번역하면 영어·한국어 독자에게 소유자가 오해될 수 있어 문맥을 통해 이미 확정된 지시성을 유지합니다.
- source_word: λαλοῦντος
  english_pob_choice: speaking
  chosen_korean: 말하는
  alternatives_korean:
  - 말하고 있는
  - 말하는 소리
  lexicon: BDAG
  rationale: 현재 분사는 동시적 행위를 나타내므로 '그가 말하는 것을 듣고'로 처리해 '들이면서'의 동시성을 전달합니다(한시적 지속을 과잉 해석하지 않음).
- source_word: ἠκολούθησαν
  english_pob_choice: followed
  chosen_korean: 따랐습니다
  alternatives_korean:
  - 따라갔습니다
  - 뒤를 따랐습니다
  lexicon: BDAG
  rationale: ἀκολουθέω의 기본 의미인 물리적 추종을 유지하면서도 제자도로의 함의를 배제하지 않기 위해 중립적인 '따랐다'를 사용하여 양면을 반영합니다.
- source_word: τῷ Ἰησοῦ
  english_pob_choice: Jesus
  chosen_korean: 예수
  alternatives_korean:
  - 예수님
  - 주님
  lexicon: BDAG
  rationale: 고유명사로서의 'Ἰησοῦ'는 학문적·서술적 문맥에서 중립형 '예수'로 번역합니다. '예수님'은 한국어 경어를 추가하므로 원문의 중립적 서술성을 유지하기 위해 선택하지 않았습니다.
theological_decisions:
- issue: αὐτοῦ('his')의 지시대상
  chosen_reading: 세례 요한(요한)의 제자들을 가리키는 것으로 읽음
  alternative_readings:
  - 좀 더 모호하게 '그의 두 제자'(지시대상 불특정)
  - 본문 맥락에서 예수를 가리킨다고 볼 여지
  rationale: 직전 구절(요한복음 1:35–36)에서 세례 요한이 두 제자와 함께 서서 예수를 가리키므로, αὐτοῦ는 요한을 배경으로 한 지시로 이해하는 것이 문맥상 가장 자연스럽습니다. 따라서 한국어 본문은 소유대명사를 생략한 '그 두 제자'로 처리해 독자가 요한의 제자들이었음을 문맥으로 식별하게 했습니다.
  doctrine_reference: 요한복음 1:35–36 문맥
