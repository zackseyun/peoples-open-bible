translation:
  language: en
  text: '“When you praise God, pray in this way:


    Hear us, Father,

    as you heard your only Son

    and received him to yourself.

    [You] gave him rest from his many [labors].


    Our power [cannot be defeated],

    [because] your armies [cannot be defeated].

    [. . .] light [. . .] living [. . .] beyond reach [. . . living].


    The [true] word [has brought] the reorientation[a] that leads to life,

    [and this has come] from you.

    You are the thought and the perfect peace of the one who is alone.


    Hear us again,

    as you heard those you have chosen.

    Through your sacrifice, they will enter in.

    Through their good deeds, they have freed their souls

    from the body’s blind limbs,

    so that they may live [] forever.


    Amen.”†[†]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: †
    text: Brackets and ellipses mark uncertain restorations or missing words in the damaged manuscript.
    reason: source_note
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
