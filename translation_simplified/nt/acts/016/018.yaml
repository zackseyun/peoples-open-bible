translation:
  language: en
  text: She went on doing this for many days. Paul became deeply troubled. He turned around and said to the spirit, “In the name of Jesus Christ,[a] I command you to come out of her.” The spirit came out of her immediately.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “Jesus the Messiah.” “Messiah” preserves the meaning of the Greek title.
    reason: lexical_alternative
