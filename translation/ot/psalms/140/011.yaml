  adjudicator: claude-opus-4-7
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/140/012.json
  category: mistranslation
  tier: 2
  from: an evil violent man—may it hunt him down
  to: a man of violence—evil will hunt him down
  rationale: The Hebrew syntax `אִישׁ חָמָ֥ס רָ֑ע יְ֝צוּדֶ֗/נּוּ` is best read with `אִישׁ חָמָס` ('a man of violence') as the topic (casus pendens), and `רָע` ('evil') as the subject of the verb `יְצוּדֶנּוּ` ('will hunt him'). The current draft incorrectly makes `רָע` an adjective describing the man and then posits a vague, impersonal subject ('it'), losing the powerful personification of Evil as the hunter, which is central to the poetic structure.
- timestamp: '2026-04-23T11:31:00Z'
  adjudicator: azure-gpt-5.4-revision-pass
  reviewer_model: gpt-5.4
  category: revision_pass
  from: A man of the tongue will not be established in the land; a man of violence—evil will hunt him down to thrustings.
  to: A man of tongue will not be established in the land; evil will hunt down a man of violence to thrustings.
  rationale: Removed the awkward article in 'a man of the tongue' to better reflect the Hebrew idiom, and reordered the second clause so 'evil' is clearly the subject hunting down 'a man of violence.'
- timestamp: '2026-08-28T22:10:57Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: awkward_english
  tier: 1
  from: A man of tongue will not be established in the land[a][b]; evil will hunt down a man of violence to thrustings.
  to: A slanderer will not be established in the land; evil will hunt down a violent man to his ruin[a].
  rationale: “A man of tongue” is an unnatural literalism for the Hebrew idiom, whose contextual force is a malicious speaker or slanderer. “To thrustings” is not English. The difficult final plural supports a consequence of being driven down or ruined, but “blow after blow” unnecessarily specifies repeated physical strikes and should remain only a possible interpretation in the note. The established reading in which evil is the personified hunter and the violent man its object is retained.
- timestamp: '2026-11-09T18:47:16Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: A slanderer will not be established in the land; evil will hunt down a violent man to his ruin[a].
  to: A slanderer will not be established in the land[a]; calamity will hunt down a violent man to his ruin[b].
  rationale: The later revisions rightly replaced “man of tongue” and “to thrustings” with intelligible English and established the destructive force as the hunter rather than an adjective describing the man. Those gains remain, with the noun's contextual sense clarified and the serious prayer reading noted.
