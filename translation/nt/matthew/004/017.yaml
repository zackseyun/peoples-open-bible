- issue: Rendering Matthew's βασιλεία τῶν οὐρανῶν
  chosen_reading: the kingdom of heaven
  alternative_readings:
  - the kingdom of the heavens
  - the reign of heaven
  rationale: This preserves Matthew's distinctive wording while using natural English. It does not flatten the phrase into merely a location, but retains the established expression for God's eschatological royal rule. No doctrinally partisan interpretation is imposed.
  doctrine_reference: Translation philosophy §§1, 5
- issue: Context-sensitive reorientation terminology
  chosen_reading: From that time Jesus began to proclaim[a], saying, “Reorient toward God[b], for the kingdom of heaven has drawn near.”
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
