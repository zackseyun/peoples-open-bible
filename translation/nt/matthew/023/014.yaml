id: MAT.23.14
reference: Matthew 23:14
source:
  edition: unverified-supplementary-greek
  claimed_edition_before_audit: robinson-pierpont-2005-byzantine
  attribution_note: Stored Greek is not verified against byztxt v2.0.3 csv-unicode/accents/no-variants. This does not establish absence from every RP print edition or apparatus.
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
translation:
  text: Woe to you, scribes and Pharisees, hypocrites! For you devour widows’ property[a] and make long prayers for show; therefore you will receive greater condemnation[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “widows’ houses,” referring to their homes and possessions.
    reason: lexical_alternative
  - marker: b
    text: This verse is absent from the earliest Greek manuscripts of Matthew. Manuscripts that include it differ on whether it precedes or follows verse 13. Parallel statements appear in Mark 12:40 and Luke 20:47.
    reason: textual_variant
lexical_decisions:
- source_word: κατεσθίω
  chosen: devour
  alternatives:
  - consume
  - eat up
  - destroy
  lexicon: BDAG
  rationale: Metaphorically describes the ruthless exploitation and financial ruin of vulnerable widows' estates.
- source_word: πρόφασις
  chosen: as a pretext
  alternatives:
  - for a show
  - for a pretense
  - as an excuse
  lexicon: BDAG
  rationale: Denotes a false motive or outward show designed to conceal true, malicious intentions.
- source_word: περισσότερος
  chosen: greater
  alternatives:
  - more severe
  - stricter
  - more abundant
  lexicon: BDAG
  rationale: In the context of a punitive sentence (krima), it indicates a heavier or more severe penalty due to their hypocrisy.
- source_word: κρίμα
  chosen: condemnation
  alternatives:
  - judgment
  - sentence
  - verdict
  lexicon: BDAG
  rationale: While 'judgment' is the literal rendering, 'condemnation' fits the context of a negative punitive sentence resulting from their exploitative actions.
theological_decisions: []
