  - severity: low
    issue: saeculum을 ‘세상’으로 확정하고 각주가 그 범위를 부차화합니다.
    rationale: saeculum은 ‘시대/세대/세상’의 의미 범위를 지니므로, 문맥상 어느 한 신학적 범위로 확정하지 않는 번역이 안전합니다.
  revised_text: 대천사가 대답하여 말하였습니다. “너희와 같은 이들의 수가 다 차면, 그가 시대를 저울에 달아 보았기 때문이며,”
