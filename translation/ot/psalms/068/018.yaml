id: PSA.68.18
reference: Psalms 68:18
source:
  edition: WLC
  text: עָ֘לִ֤יתָ לַ/מָּר֨וֹם שָׁ֘בִ֤יתָ שֶּׁ֗בִי לָקַ֣חְתָּ מַ֭תָּנוֹת בָּ/אָדָ֑ם וְ/אַ֥ף ס֝וֹרְרִ֗ים לִ/שְׁכֹּ֤ן יָ֬הּ אֱלֹהִֽים׀׀׃
translation:
  text: You ascended on high; you took captives; you received gifts from people[a], even from the rebellious, so that Yah God might dwell there[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “among people.”
    reason: alternative_reading
  - marker: b
    text: Or, “so that Yah God might dwell among them.”
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ
  chosen: you ascended
  alternatives:
  - you went up
  lexicon: HALOT
  rationale: Qal perfect 2ms of עלה, here in elevated poetic diction. 'Ascended' fits both the vertical imagery and the triumphal context better than the plainer 'went up.'
- source_word: לַמָּרוֹם
  chosen: on high
  alternatives:
  - to the height
  - to the high place
  lexicon: HALOT
  rationale: מָרוֹם denotes height or exalted place. English idiom favors 'on high' in poetic context, preserving the elevated register without over-specifying location.
- source_word: שָׁבִיתָ שֶּׁבִי
  chosen: you took captives
  alternatives:
  - you took captives
  - you captured a band of captives
  lexicon: HALOT
  rationale: This expresses the cognate construction’s ordinary concrete sense without retaining an archaic English calque.
- source_word: לָקַחְתָּ
  chosen: you received
  alternatives:
  - you took
  lexicon: HALOT
  rationale: לקח commonly means 'take,' but in context with 'gifts' the sense 'receive' is natural in English and reflects the directionality implied by tribute brought to the victorious king.
- source_word: מַתָּנוֹת
  chosen: gifts
  alternatives:
  - tribute
  - offerings
  lexicon: HALOT
  rationale: The noun denotes gifts or presents. 'Gifts' is the most direct rendering; 'tribute' is interpretive, though contextually plausible, so it is preserved as an alternative rather than placed in the main text.
- source_word: בָּאָדָם
  chosen: among people
  alternatives:
  - from men
  - among humankind
  lexicon: HALOT
  rationale: “People” naturally renders generic אָדָם; the disputed force of the preposition is retained in the note.
- source_word: וְאַף
  chosen: even
  alternatives:
  - yes, even
  - and also
  lexicon: HALOT
  rationale: The particle adds emphasis or extension. 'Even' concisely conveys the climactic force in context.
- source_word: סוֹרְרִים
  chosen: the rebellious
  alternatives:
  - rebels
  - the stubborn
  lexicon: HALOT
  rationale: The participle denotes those who are rebellious or stubbornly resistant. 'The rebellious' reads naturally in English while preserving the adjectival force.
- source_word: לִשְׁכֹּן
  chosen: so that ... might dwell
  alternatives:
  - to dwell
  - for dwelling
  lexicon: HALOT
  rationale: The infinitive with ל here is best taken as expressing purpose/result in context. Rendering it with 'so that ... might dwell' makes the clause intelligible in English while preserving the likely telic sense.
- source_word: יָהּ אֱלֹהִים
  chosen: Yah God
  alternatives:
  - the LORD God
  - God, Yah
  lexicon: HALOT
  rationale: יָהּ is the short form of the divine name, distinct from the full tetragrammaton. Since the doctrine excerpt specifies 'the LORD' for יְהוָה, that default does not directly govern this shorter form. 'Yah' preserves the source form, and 'God' renders אֱלֹהִים straightforwardly.
