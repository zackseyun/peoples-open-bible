translation:
  text: Before pain there is fear, and after pain, grief.
  philosophy: dynamic
lexical_decisions:
- source_word: πρὸ
  chosen: before
  alternatives:
  - in advance of
  - prior to
  lexicon: LSJ
  rationale: Temporal preposition marking what precedes pain; 'before' is the plain and natural English equivalent.
- source_word: πόνου
  chosen: pain
  alternatives:
  - toil
  - suffering
  lexicon: LSJ
  rationale: πόνoς can denote toil or pain, but in this aphoristic sequence with fear before and grief after, the experiential sense 'pain' best fits the immediate context.
- source_word: φόβος
  chosen: fear
  alternatives:
  - dread
  lexicon: LSJ
  rationale: Standard rendering for φόβος. 'Dread' is possible but stronger and less neutral than the Greek requires.
- source_word: μετὰ
  chosen: after
  alternatives:
  - following
  lexicon: LSJ
  rationale: Temporal use with the accusative τὸν πόνον indicates sequence after the event/experience.
- source_word: λύπη
  chosen: grief
  alternatives:
  - sorrow
  - distress
  lexicon: LSJ
  rationale: λύπη denotes sorrow or grief. 'Grief' gives a weightier emotional aftermath that pairs well with 'fear' and 'pain' in concise English.
