id: PSA.136.16
reference: Psalms 136:16
source:
  edition: WLC
  text: לְ/מוֹלִ֣יךְ עַ֭מּ/וֹ בַּ/מִּדְבָּ֑ר כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
translation:
  text: to him who led his people in the wilderness, for his steadfast love endures forever.
  philosophy: dynamic
lexical_decisions:
- source_word: לְמוֹלִיךְ
  chosen: to him who led
  alternatives:
  - to him who caused to go
  - to him who guided
  lexicon: HALOT
  rationale: 'The Hiphil participle of הלך with prefixed ל in this psalm''s litany functions as a dative of reference: ''to him who ...'' The causative sense is ''caused to go/led.'' ''Led'' is idiomatic modern English and fits the repeated structure of Psalm 136 without losing the causative idea.'
- source_word: עַמּוֹ
  chosen: his people
  alternatives:
  - his nation
  lexicon: HALOT
  rationale: עם commonly means 'people' in covenantal/national sense. 'His people' is the natural English rendering here and preserves the relational sense between God and Israel.
- source_word: בַּמִּדְבָּר
  chosen: in the wilderness
  alternatives:
  - in the wilderness
  - through the desert
  lexicon: HALOT
  rationale: The Hebrew preposition directly locates the leading in the wilderness; “through” is contextually plausible but more explicit about movement.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - surely
  lexicon: HALOT
  rationale: 'In Psalm 136 the refrain uses כִּי to introduce the ground for praise: ''for his steadfast love ...'' ''For'' preserves the liturgical and poetic force better than ''because''.'
- source_word: לְעוֹלָם
  chosen: endures forever
  alternatives:
  - is forever
  - is everlasting
  lexicon: HALOT
  rationale: Literally 'for forever/everlasting duration.' In English the refrain is most naturally completed as 'endures forever,' making explicit the durative force in connection with the following noun.
- source_word: חַסְדּוֹ
  chosen: his steadfast love
  alternatives:
  - his covenant loyalty
  - his lovingkindness
  - his mercy
  lexicon: HALOT
  rationale: חֶסֶד is a rich covenantal term. 'Steadfast love' is the best established modern rendering that preserves both affection and loyalty without becoming overly technical. It fits the psalm's repeated refrain well.
