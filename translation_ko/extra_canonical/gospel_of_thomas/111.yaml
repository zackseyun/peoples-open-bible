review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 ‘땅도 그러하며’는 땅에도 ‘너희 앞에서’와 ‘말려 올라가다’를 명시적으로 적용하는 원문의 병렬 구조를 약화합니다. 또한 ⲡⲉⲧⲉⲣⲉⲱⲛϩ …의 현재적 표현은 ‘살아나는 이’보다 ‘사는 이’가 더 충실합니다. 후반의 ⲉⲣⲉ ⲓⲏⲥⲟⲩⲥ ϫⲱ ⲙ̄ⲙⲟⲥ는 현재형의 외부 인용으로, ‘예수께서 이렇게 말씀하시는 것이 아닙니까?’로 옮기는 것이 적절합니다. ⲁϩⲉ의 현재 분사도 ‘찾는 이’로 반영했습니다.
  naturalness: ‘하늘과 땅이 너희 앞에서 말려 올라갈 것이며’는 현대 한국어에서 자연스럽고, 하나의 미래 동사가 병렬 주어를 지배하는 원문의 구조도 보존합니다. ‘살아 있는 이로부터 사는 이는’은 다소 압축적이지만 원문의 의도적인 지시 대상의 모호성을 유지하는 정중한 문어체입니다.
  terminology: ‘하늘과 땅’, ‘죽음을 보다’, ‘세상이 그에게 합당하지 않다’는 원문의 종말론적·가치 판단 어휘를 과도한 교리적 해석 없이 반영합니다. ‘살아 있는 이’는 대문자화나 ‘하나님’ 등의 보충 없이 원문의 모호성을 보존합니다.
