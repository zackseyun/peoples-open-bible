translation:
  text: When the punishment of the Lord of Spirits rests upon them, it will rest so that the punishment of the Lord
    of Spirits does not come in vain. It will kill children with their mothers and children with their fathers.
    [When the punishment of the Lord of Spirits rests upon these,] afterward judgment will be in mercy and patience.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The printed square-bracketed when-punishment-rests clause is retained in English as a bracketed repetition.
      Charles printed108 note31 treats it as a possible repetition but also discusses whether it could introduce
      the following clause. No unbracketed reconstruction is adopted. The text explicitly includes children with
      mothers and children with fathers, the not-in-vain denial, and mercy and patience in the final judgment statement.
    reason: textual_variant
