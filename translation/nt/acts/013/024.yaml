id: ACT.13.24
reference: Acts 13:24
source:
  edition: SBLGNT
  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
translation:
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of reorientation toward God[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'before his arrival.' The Greek literally speaks of 'before the face of his entrance,' an idiom for preceding someone's coming.
    reason: lexical_alternative
  - marker: b
    text: Or 'a baptism for repentance.'
    reason: lexical_alternative
  - marker: c
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  chosen: had proclaimed
  alternatives:
  - had preached beforehand
  - had announced beforehand
  lexicon: BDAG
  rationale: Aorist participle in genitive absolute-like construction referring to prior public proclamation. 'Had proclaimed' is natural English and preserves the sense of public heralding without overloading the line with 'beforehand,' since temporal priority is already conveyed by the following phrase.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  chosen: before his coming
  alternatives:
  - before his arrival
  - before he appeared
  - before the face of his entrance
  lexicon: BDAG
  rationale: This idiomatic expression means 'before' or 'in advance of' someone's arrival/appearance. 'Before his coming' is concise, idiomatic, and fits the messianic context without woodenly reproducing 'before the face of.'
- source_word: εἰσόδου
  chosen: coming
  alternatives:
  - arrival
  - entrance
  lexicon: BDAG
  rationale: Although the noun literally denotes 'entrance' or 'entry,' in context it refers to the arrival/appearance of the one being spoken of. 'Coming' is the most natural English rendering here.
- source_word: βάπτισμα μετανοίας
  chosen: a baptism of reorientation toward God
  alternatives:
  - a baptism of repentance
  - a baptism for repentance
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  chosen: to all the people of Israel
  alternatives:
  - to all Israel's people
  - to the whole people of Israel
  lexicon: BDAG
  rationale: Dative of indirect object after the proclamation idea. 'All the people of Israel' preserves both πᾶς and λαός and makes explicit that the reference is to Israel as a people.
- source_word: Ἰωάννου
  chosen: John
  lexicon: BDAG
  rationale: Standard English transliteration of the personal name Ἰωάννης.
