  text: וַ/יָּבֹ֨אוּ כָל הָ/עָ֤ם בֵּית הַ/בַּ֨עַל֙ וַֽ/יִּתְּצֻ֔/הוּ וְ/אֶת מִזְבְּחֹתָ֥י/ו וְ/אֶת צְלָמָ֖י/ו שִׁבֵּ֑רוּ וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֥י הַֽ/מִּזְבְּחֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/017.yaml
  text: Then all the people went to the house of Baal and tore it down, and they smashed his altars and his images, and they killed Mattan the priest of Baal before the altars.
translation:
  language: ko
  text: 그러자 모든 백성이 바알의 집에 가서 그것을 허물어 버리고, 그 제단들과 우상들을 산산이 부쉈으며, 바알의 제사장 맛단을 제단들 앞에서 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַבַּעַל
  english_pob_choice: the house of Baal
  chosen_korean: 바알의 집
  alternatives_korean:
  - 바알 신전
  - 바알 성전
  - 바알의 집
  lexicon: בית + בעל
  rationale: קדושת/종교 시설을 지나치게 특정화하지 않고, POB의 직역 감각을 따라 소유격 구조를 살렸습니다.
- source_word: וַיִּתְּצוּהוּ
  english_pob_choice: tore it down
  chosen_korean: 그것을 허물어 버리고
  alternatives_korean:
  - 그것을 무너뜨리고
  - 그것을 헐어 버리고
  - 그것을 허물어 버리고
  lexicon: נתץ
  rationale: 파괴 동작을 분명히 하되 한국어에서 자연스럽고 강한 해체감을 주는 표현으로 옮겼습니다.
- source_word: מִזְבְּחֹתָיו ... צְלָמָיו
  english_pob_choice: his altars and his images
  chosen_korean: 그 제단들과 우상들을
  alternatives_korean:
  - 그 제단들과 형상들을
  - 그 제단들과 조각상들을
  - 그 제단들과 우상들을
  lexicon: מזבח / צלם
  rationale: צֶלֶם은 여기서 우상적 형상으로 이해되는 것이 문맥상 자연스러워, 기존 교회어법과 소스 의미를 함께 반영했습니다.
- source_word: הָרְגוּ לִפְנֵי הַמִּזְבְּחוֹת
  english_pob_choice: they killed ... before the altars
  chosen_korean: 제단들 앞에서 죽였습니다
  alternatives_korean:
  - 제단들 앞에서 죽였습니다
  - 제단 앞에서 죽였습니다
  - 제단들 앞에서 살해했습니다
  lexicon: לפני + מזבחות
  rationale: 복수형 ‘제단들’을 유지해 히브리어 형태를 반영했고, 마지막 행위는 서술체에 맞게 ‘죽였습니다’로 옮겼습니다.
theological_decisions:
- issue: 바알 숭배의 파괴를 어떻게 드러낼지
  chosen_reading: ‘허물어 버리고’, ‘산산이 부쉈으며’로 강한 우상 파괴의 폭력을 그대로 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘무너뜨리고’, ‘부쉈으며’
  - ‘철거하고’ 같은 행정적 표현
  rationale: 본문은 개혁의 상징적 정리 수준이 아니라 실제 우상 체제의 전면적 파괴를 말하므로, 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 우상숭배 청산 / 언약적 개혁
- issue: ‘제단들’의 복수 유지
  chosen_reading: 한국어에서도 복수 ‘제단들’을 유지했습니다.
  alternative_readings:
  - 단수로 일반화하여 ‘제단’
  rationale: 히브리어 복수형을 그대로 보존해, 여러 제단이 파괴되었다는 장면성을 살렸습니다.
  doctrine_reference: 원문 형태 보존
