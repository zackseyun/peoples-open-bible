  to: He also said to his host, “When you give a luncheon or a dinner, do not invite your friends, your brothers, your relatives, or rich neighbors, lest they invite you in return and so repay you.
  rationale: The lexical record correctly emphasizes reciprocal hospitality and distinguishes the earlier meal from dinner. I retain those meanings and the force of the prohibition without adding 'only' to soften it.
