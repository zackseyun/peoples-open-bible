  yaml_path: translation/ot/psalms/036/001.yaml
  text: 'Within my heart, transgression speaks to the wicked: there is no fear of God before his eyes.[a]'
  footnotes:
  - marker: a
    text: Or 'For the director of music.' The Hebrew term refers to the musical leader in the temple or liturgical setting.
    reason: lexical_alternative
  - marker: b
    text: Or 'of Yahweh’s servant, David.' The Hebrew preposition can mark attribution broadly, and 'of David' does not by itself settle whether the heading indicates authorship, dedication, or association.
    reason: alternative_reading
  - marker: c
    text: Or 'Of the LORD’s servant, of David.'.
    reason: previous_rendering
  - marker: d
    text: Or 'For the choirmaster. Of'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 마음속에서 죄악이 악인에게 말합니다[a]. 그의 눈앞에는 하나님을 두려워함이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘내 마음속에서’라고 읽습니다. 일부 고대 역본과 현대 번역은 문맥을 매끄럽게 하기 위해 ‘그의 마음속에서’로 읽거나, ‘악인에 관하여 내 마음속에 말씀이 있다’처럼 풀이합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 합창 인도자에게
  lexicon: HALOT
  rationale: 시편 표제의 관용구로서 음악적 책임자를 가리키므로, 기능을 살리되 현대 한국어에서 자연스러운 ‘지휘자’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 히브리어 원문에 나온 신명은 번역어로 대체하지 않고, 본 프로젝트 기준에 따라 ‘야훼’로 음역했습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗에 의한
  - 다윗의 것인
  lexicon: HALOT
  rationale: 시편 표제에서 לְדָוִד는 단순 저자 표시만이 아니라 귀속·연관을 넓게 나타낼 수 있으므로, 과도하게 좁히지 않는 소유격 표현을 택했습니다.
- source_word: עֶבֶד
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 섬기는 사람
  lexicon: HALOT
  rationale: 이 표제에서는 ‘야훼의 종’이라는 언약적 호칭이므로, bonded status를 강조하는 ‘노예’보다 공적·경건한 호칭으로서의 ‘종’이 적절합니다.
theological_decisions:
- issue: 시편 표제의 문체와 호칭 관계
  chosen_reading: 표제를 하나의 간결한 헌정/귀속 문구로 처리했습니다.
  alternative_readings:
  - 문장형으로 풀어 ‘지휘자를 위하여. 야훼의 종 다윗으로부터’
  - 저자성을 더 강하게 드러내는 ‘다윗이 지은’
  rationale: 히브리어는 연속된 전치사구로 구성된 표제이므로, 한국어에서도 분리된 두 문장보다 하나의 표제 형식으로 옮겨 원문의 기능을 보존했습니다.
  doctrine_reference: Psalm superscription usage; translation philosophy §1
