- issue: Context-sensitive reorientation terminology
  chosen_reading: '“And who are the ones they were rejecting and tossing aside?”


    “They are people who have sinned and want to reorient. They were not thrown far away from the tower, because if they reorient, they can still be used in its construction. Those who are going to reorient will be strong in the faith if they reorient now, while the tower is still being built. Once it is finished, there will be no place for them, and they will be cast out. The only thing left for them is to lie beside the tower.”'
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
  rationale: Use reorient/reorientation without automatically inserting God. The sentence supplies a departure, destination, interpersonal setting, or the work's own conceptual framework. Preserve distinct turning verbs and named wrongdoing.
