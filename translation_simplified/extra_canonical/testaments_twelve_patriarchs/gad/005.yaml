    Θεὸν ἀληθὴς⁵¹ μετάνοια⁵² [ἀναιρεῖ *τὴν ἄγνοιαν⁵³ καὶ] φυγαδεύει τὸ σκότος, καὶ φωτίζει τοὺς ὀφθαλμοὺς καὶ γνῶσιν παρέχει τῇ ψυχῇ, καὶ ὁδηγεῖ *τὸ διαβούλιον⁵⁴ *πρὸς σωτηρίαν⁵⁵. 8. *Καὶ οὐκ ἔμαθεν ἀπὸ ἀνθρώπων τοῦτο ἀλλ᾽ οἶδε διὰ μετανοίας τοὺς ἐπιστρέφοντας δέχεσθαι⁵⁶. 9. Ἐπήγαγε γάρ⁴¹ μοι ὁ Θεὸς νόσον ἥπατος, καὶ εἰ μὴ⁵⁷ *αἱ εὐχαὶ⁵⁸ τοῦ πατρός μου⁵⁹ *ἐβοήθησάν μοι⁶⁰, ὀλίγου δεῖν⁶¹ *ἐξέλειπε τὸ πνεῦμα μου⁶². 10. Δι’ ὧν γὰρ δ⁶³ ἄνθρωπος παρανομεῖ, δι’ ἐκείνων⁶⁴ κολάζεται. 11. Ἐπεὶ Γοὖν⌉ ἔκειτο⁶⁵ τὰ ἥπατα μου ἀνιλεως⁶⁶ κατὰ τοῦ Ἰωσήφ, *τῷ ἥπατι⁶⁷ πάσχων⁶⁸ ἀνιλεως ἐκρινόμην ἐπὶ *χρόνους δέκα⁶⁹, καθ’ *ὃν χρόνον⁷⁰ ἐπείχον⁷¹ τῷ Ἰωσήφ⁷².
