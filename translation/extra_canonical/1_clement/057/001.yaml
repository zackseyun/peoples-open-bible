id: 1CLEM.57.1
reference: 1 Clement 57:1
unit: verse
book: 1 Clement
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑμεῖς οὖν οἱ τὴν καταβολὴν τῆς στάσεως ποιήσαντες ὑποτάγητε τοῖς πρεσβυτέροις καὶ παιδεύθητε εἰς μετάνοιαν, κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν.
  language: Greek
translation:
  text: Therefore, you who laid the foundation of the rebellion, submit yourselves to the elders and be disciplined unto reorientation[r1], bending the knees of your heart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'uprising'.
    reason: previous_rendering
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
