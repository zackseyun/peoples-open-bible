  naturalness: 초안의 ‘그들은 분출한다’는 한국어에서 사람의 발화에 적용될 때 부자연스럽고 목적어가 없어 의미가 불분명합니다. ‘거만한 말을 쏟아 내고’가 시적 비유와 현대 표준어의 자연스러움을 함께 충족합니다.
  terminology: ‘악을 행하는 자들’은 פֹּעֲלֵי אָוֶן의 도덕적 의미를 보존합니다. ‘거만한’과 ‘자랑합니다’는 각각 עָתָק 및 יִתְאַמְּרוּ의 문맥상 의미에 적절합니다.
  issues:
  - severity: medium
    issue: ‘그들은 분출한다’는 발화의 비유적 대상을 드러내지 않아 부자연스럽고 의미가 불명확합니다.
    rationale: יַבִּיעוּ는 이 문맥에서 말이 샘솟듯 쏟아져 나오는 것을 가리키므로, 한국어에서는 ‘말을 쏟아 내다’처럼 표현하는 것이 자연스럽습니다.
  - severity: medium
    issue: 각주 a의 대안 문구는 ‘그들이 쏟아져나온다’라고 하여 주어가 실제로 흘러나오는 듯한 뜻이 되며, 종결 방식도 본문의 합쇼체와 일치하지 않습니다.
    rationale: 각주는 본문의 어휘적 대안을 제시해야 하며, 발화의 은유와 문체를 유지해야 합니다.
  - severity: low
    issue: 본문의 ‘악을 행하는 자는 다’는 집합 명사로 이해할 수 있으나, 히브리어의 복수형에 맞춰 ‘자들은 모두’로 하는 편이 더 분명합니다.
    rationale: פֹּעֲלֵי אָוֶן은 복수형이며, ‘모두’가 כָּל의 포괄성을 자연스럽게 나타냅니다.
  revised_text: 그들은 거만한 말을 쏟아 내고[a], 악을 행하는 자들은 모두 자랑합니다.
