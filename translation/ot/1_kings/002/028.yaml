  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Whether to preserve the literal political idiom נָטָה אַחֲרֵי or interpret it more dynamically
  chosen_reading: had turned after
  alternative_readings:
  - had sided with
  - had followed
  rationale: The verse repeats the same idiom for Adonijah and Absalom. Preserving the repeated wording maintains the narrative's rhetorical texture and avoids overexplaining the political allegiance in one clause but not the other.
