  text: But I, like a deaf man, do not hear; I am like a mute man who does not open his mouth.
translation:
  language: ko
  text: 그러나 나는 귀가 들리지 않는 사람처럼 듣지 않으며, 말하지 못하는 사람이 자기 입을 열지 않는 것처럼 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 두 번째 절은 문자적으로 ‘말하지 못하는 사람처럼, 그가 자기 입을 열지 않는다’라고 하여 3인칭을 사용합니다. 한국어에서는 비유의 관계를 자연스럽게 드러내기 위해 ‘말하지 못하는 사람이 자기 입을 열지 않는 것처럼 합니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַקְשׁוּ
  english_pob_choice: set traps
  chosen_korean: 올가미를 놓고
  alternatives_korean:
  - 덫을 놓고
  - 함정을 만들고
  - 올무를 놓고
