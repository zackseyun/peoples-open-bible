reference: 1 Clement 54:4
unit: verse
book: 1 Clement
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα οἱ πολιτευόμενοι τὴν ἀμεταμέλητον πολιτείαν τοῦ θεοῦ ἐποίησαν καὶ ποιήσουσιν.
  language: Greek
translation:
  text: These things those who live in God's unregretted[b] way of life have done and will do[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'live out the unrepented citizenship'.
    reason: previous_rendering
  - marker: b
    text: 'Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Retain unregretted: the negative adjective concerns absence of regret, not refusal to repent.'
    reason: lexical_alternative
