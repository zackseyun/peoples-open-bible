  source_fidelity: 현 초안은 지정된 본문인 시편 3:4가 아니라 시편 3:3(‘그러나 주님, 주님은 나를 둘러싼 방패이시며…’)을 번역하고 있습니다. 시편 3:4의 히브리어는 화자가 야훼께 자기 목소리로 부르짖고, 야훼께서 그의 거룩한 산에서 응답하신다는 내용입니다. 또한 יְהוָה는 프로젝트의 원어 우선 원칙 및 영어 POB 감사 기록에 따라 ‘야훼’로 옮겨야 합니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 시적·예배적 문체로 자연스럽습니다. ‘나의 목소리로’는 어순상 강조된 קוֹלִי를 보존하며, ‘부르짖습니다’는 기도 맥락의 אֶקְרָא에 적절합니다.
  terminology: יְהוָה는 ‘야훼’, מֵהַר קָדְשׁוֹ는 ‘그분의 거룩한 산’, סֶלָה는 의미를 단정하지 않고 ‘셀라’로 음역합니다. וַיַּעֲנֵנִי는 영어 POB의 현재형 선택을 따라 ‘응답하십니다’로 옮기되, 과거형 가능성은 각주로 보존합니다.
