    rationale: These natural English forms express the same inability without weakening the repeated assertion that divided service is impossible.
  - source_phrase: μισήσει … ἀγαπήσει … ἀνθέξεται … καταφρονήσει
    prior_rendering: he will hate … love … he will be devoted … despise
    new_rendering: they will hate … love … they will be devoted … despise
    rationale: Singular 'they' naturally refers back to 'no one' and makes clear that the saying applies to anyone, while preserving the force of all four verbs.
