  naturalness: 초안의 ‘제가 말하기를 … 했을 때’는 현대 한국어에서 다소 문어적이고 겹쳐 어색합니다. 또한 ‘사랑이 … 주셨습니다’는 주체가 ‘사랑’인 문장에 높임 선어말어미를 붙인 형태여서 자연스럽지 않습니다. ‘붙들어 주었습니다’가 합쇼체를 유지하면서 문법적으로 적절합니다.
