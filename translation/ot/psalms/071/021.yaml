id: PSA.71.21
reference: Psalms 71:21
source:
  edition: WLC
  text: תֶּ֤רֶב גְּֽדֻלָּתִ֗/י וְ/תִסֹּ֥ב תְּֽנַחֲמֵֽ/נִי׀׃
translation:
  text: You will increase my honor and turn to comfort me[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “May you increase my honor and turn to comfort me.”
    reason: alternative_reading
lexical_decisions:
- source_word: תֶּרֶב
  chosen: You will increase
  alternatives:
  - You will increase
  - Increase
  lexicon: HALOT
  rationale: In the immediate context of future confidence, the imperfect is most naturally rendered as indicative future; the optative possibility is retained in a note.
- source_word: גְּדֻלָּתִי
  chosen: my greatness
  alternatives:
  - my honor
  - my dignity
  - my greatness/majesty
  lexicon: HALOT
  rationale: From גְּדוּלָּה, denoting greatness, greatness of status, or dignity. 'My greatness' is the most direct rendering and preserves the lexical link to being made great. 'Honor' is interpretive and smoother in English, but slightly narrows the sense.
- source_word: וְתִסֹּב
  chosen: and turn to comfort me
  alternatives:
  - and turn around
  - and return
  lexicon: HALOT
  rationale: This retains the explicit verb “turn” and expresses its contextual orientation naturally in English, rather than substituting the inferred sense “again.”
- source_word: תְּנַחֲמֵנִי
  chosen: comfort me
  alternatives:
  - console me
  lexicon: HALOT
  rationale: Piel of נחם here means 'comfort, console.' 'Comfort me' is standard, natural English and preserves the pastoral force of the verb.
