id: EXO.34.5
reference: Exodus 34:5
source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בֶּֽ/עָנָ֔ן וַ/יִּתְיַצֵּ֥ב עִמּ֖/וֹ שָׁ֑ם וַ/יִּקְרָ֥א בְ/שֵׁ֖ם יְהוָֽה׃
translation:
  text: Yahweh came down in the cloud, stood there with Moses, and proclaimed the name of Yahweh[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or 'and Moses called on the name of Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: וַיֵּרֶד
  chosen: came down
  alternatives:
  - descended
  - went down
  lexicon: HALOT
  rationale: The verb ירד means 'go down/descend.' 'Came down' is natural modern English and fits the narrative perspective without losing the concrete downward movement.
- source_word: בֶּעָנָן
  chosen: in the cloud
  alternatives:
  - in a cloud
  - with the cloud
  lexicon: HALOT
  rationale: The prefixed ב marks location or accompaniment. With the article assimilated, the phrase is best rendered 'in the cloud,' referring to the known theophanic cloud associated with the LORD's presence in Exodus.
- source_word: וַיִּתְיַצֵּב
  chosen: stood
  alternatives:
  - stationed himself
  - took his stand
  lexicon: HALOT
  rationale: The hitpael of יצב conveys taking one's stand or presenting oneself. 'Stood' is concise, idiomatic, and preserves the narrative force without overformalizing.
- source_word: עִמּוֹ
  chosen: with him
  alternatives:
  - beside him
  lexicon: HALOT
  rationale: The preposition עם plus pronominal suffix straightforwardly means 'with him.' The referent is Moses in context.
- source_word: שָׁם
  chosen: there
  alternatives:
  - in that place
  lexicon: HALOT
  rationale: 'The adverb simply locates the action: ''there.'' Retaining it preserves the scene-setting emphasis of the Hebrew.'
- source_word: וַיִּקְרָא
  chosen: proclaimed
  alternatives:
  - called
  - declared
  lexicon: HALOT
  rationale: Although קרא often means 'call,' in this context with 'in/by the name of the LORD' and followed by the content of proclamation in the next verse, 'proclaimed' best captures the public declarative sense.
- source_word: בְשֵׁם יְהוָה
  chosen: the name of the LORD
  alternatives:
  - by the name of the LORD
  - in the name of the LORD
  lexicon: HALOT
  rationale: The phrase literally includes the preposition 'in/by' with 'name.' In English, after 'proclaimed,' the most natural rendering is 'proclaimed the name of the LORD,' expressing that the divine name and character were announced. The more literal prepositional alternatives are preserved in a footnote because the Hebrew construction can be understood that way.
