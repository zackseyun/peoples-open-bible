translation:
  text: '“The sixth mountain had large and small cracks, with withered plants in them. Its believers are
    like this:


    2. “Those with small cracks hold things against each other. Their slanders have withered their faith.
    Many repented of these things. The others will also repent when they hear my commandments. Their slanders
    are small, so they will quickly repent.”


    3. “Those with large cracks keep slandering others and holding grudges. They nurse anger against each
    other. So they were thrown out of the tower and rejected from its building. People like this will
    live only with difficulty.”


    4. “Our God and Lord[a] rules over all and has authority over all his creation. If he does not hold
    a grudge against people who confess their sins, but shows mercy, how can a mortal person full of sins
    hold a grudge against someone else? Does that person think they can destroy or save the other?”


    5. “I am the messenger of repentance. If you have this disposition, put it away and repent. The Lord
    will heal your former sins if you cleanse yourselves of this demon. Otherwise, you will be handed
    over to it for death.”'
  philosophy: optimal-equivalence
