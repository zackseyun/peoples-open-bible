translation:
  language: en
  text: Jesus said, “I stood in the middle of the world and appeared to them in flesh.[1] I found everyone drunk, and not one of them was thirsty. My soul was pained over the children of humanity because they are blind in their hearts. They do not see that they came into the world empty and are also seeking to leave it empty. For now they are drunk. But when they sober up, they will reorient[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: “Appeared” may also be translated “shone forth” or “was revealed.”
    reason: lexical_alternative
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
