lexical_decisions:
- source_word: שַׁסֻּהוּ
  english_pob_choice: have plundered him
  chosen_korean: 그를 약탈하였습니다
  alternatives_korean:
  - 그를 노략질하였습니다
  - 그를 탈취하였습니다
  - 그를 노략하였습니다
  lexicon: HALOT
  rationale: שׁסה의 핵심 의미는 강제로 빼앗고 약탈하는 행위이므로, 현대 한국어에서는 ‘약탈하다’가 가장 직접적이고 구체적인 대응입니다.
- source_word: כָּל עֹבְרֵי דָרֶךְ
  english_pob_choice: All who pass by the way
  chosen_korean: 길을 지나는 모든 이들
  alternatives_korean:
  - 길을 지나가는 모든 이들
  - 모든 길손들
  - 지나가는 모든 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘길의 지나가는 자들’이지만, 한국어에서는 ‘길을 지나는 모든 이들’이 원문의 포괄성과 이동 이미지를 자연스럽게 살립니다.
- source_word: חֶרְפָּה
  english_pob_choice: a reproach
  chosen_korean: 수치
  alternatives_korean:
  - 비방거리가
  - 치욕
  - 모욕거리
  lexicon: HALOT
  rationale: חֶרְפָּה는 단순 감정이 아니라 공개적으로 수치를 당하는 상태를 가리키므로, 시편의 탄식 문맥에서 ‘수치’가 가장 안정적인 대응입니다.
theological_decisions:
- issue: 대명사 ‘him’의 지시 대상
  chosen_reading: 대명사를 한국어에서도 ‘그’를 유지해 구체적 해석을 가하지 않았습니다.
  alternative_readings:
  - 다윗 왕
  - 기름부음 받은 자
  - 대표된 백성
  rationale: 문맥상 다윗 왕조의 몰락을 가리키지만, 본절 자체는 단순히 3인칭 단수 대명사만 사용하므로 해석을 앞당기지 않고 원문의 여지를 보존합니다.
  doctrine_reference: 본문의 지시 대상을 과도하게 특정하지 말고 문맥적 긴장을 유지합니다.
