translation:
  text: He did not gain power; instead, his plot ended in disgrace, and he fled again to Ammanitis[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Ammanitis was the region of the Ammonites, east of the Jordan.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχῆς
  chosen: the rule
  alternatives:
  - the government
  - the power
  - the office
  - the sovereignty
  lexicon: LSJ
  rationale: ἀρχή here refers to political rule or governing authority that Jason sought to seize, not merely a beginning. 'The rule' is concise and preserves the political sense without over-specifying.
- source_word: οὐκ ἐκρίτησεν
  chosen: did not gain control
  alternatives:
  - did not obtain
  - did not prevail over
  - did not secure judgment concerning
  lexicon: LSJ
  rationale: The verb is unusual in this context; from the narrative sense it conveys failure to secure or win the ruling power. 'Did not gain control' expresses the likely idiomatic force in clear English while staying close to the political context.
- source_word: τέλος
  chosen: the end
  alternatives:
  - the outcome
  - the result
  lexicon: LSJ
  rationale: τέλος can denote end or outcome. 'In the end' is natural English and captures the resultant sense of the phrase τὸ δὲ τέλος τῆς ἐπιβουλῆς.
- source_word: ἐπιβουλῆς
  chosen: the plot
  alternatives:
  - the scheme
  - the conspiracy
  lexicon: LSJ
  rationale: ἐπιβουλή denotes a hostile plan or intrigue. 'Plot' is idiomatic and suitably negative without adding more precision than the Greek requires.
- source_word: αἰσχύνην λαβών
  chosen: received shame
  alternatives:
  - met with disgrace
  - incurred shame
  - suffered humiliation
  lexicon: LSJ
  rationale: Literally 'having received shame.' The chosen rendering keeps the concrete verbal imagery of the Greek while remaining understandable. A smoother idiom could be used, but this preserves source texture.
- source_word: φυγάς
  chosen: fled away
  alternatives:
  - as a fugitive
  - in flight
  - an exile
  lexicon: LSJ
  rationale: φυγάς is adjectival/substantival, 'a fugitive' or 'in exile.' In context with ἀπῆλθεν, the sense is that he departed in flight. 'Fled away' communicates the force naturally in English; the fugitive nuance is preserved in the rationale and could be footnoted if needed.
- source_word: πάλιν
  chosen: again
  alternatives:
  - once more
  lexicon: LSJ
  rationale: Straightforward adverb indicating repeated flight.
- source_word: Ἀμμανῖτιν
  chosen: Ammanitis
  alternatives:
  - the land of the Ammonites
  - Ammonitis
  lexicon: LSJ
  rationale: This is a place-name/adjectival regional designation. Per project philosophy, names are transliterated by standard conventions. 'Ammanitis' stays close to the Greek form while remaining recognizable.
