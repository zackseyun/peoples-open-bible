id: EXO.17.15
reference: Exodus 17:15
source:
  edition: WLC
  text: וַ/יִּ֥בֶן מֹשֶׁ֖ה מִזְבֵּ֑חַ וַ/יִּקְרָ֥א שְׁמ֖/וֹ יְהוָ֥ה נִסִּֽ/י׀׃
translation:
  text: Moses built an altar and named it “Yahweh Is My Banner[a]”.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: A banner was a signal or standard around which troops rallied.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבֶן
  chosen: built
  alternatives:
  - constructed
  lexicon: HALOT
  rationale: The verb בנה in the waw-consecutive narrative form straightforwardly means 'built.' 'Built' is the natural modern English narrative equivalent and preserves the concrete action.
- source_word: מִזְבֵּחַ
  chosen: altar
  lexicon: HALOT
  rationale: מִזְבֵּחַ is the standard term for an altar, specifically a place of sacrifice or memorial worship. 'Altar' is the direct and established equivalent.
- source_word: וַיִּקְרָא שְׁמוֹ
  chosen: called its name
  alternatives:
  - named it
  - called the name of it
  lexicon: HALOT
  rationale: The Hebrew idiom literally reads 'called its name.' In English, 'called its name' preserves the naming formula more transparently than the smoother 'named it,' while remaining understandable.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: נִסִּי
  chosen: Is My Banner
  alternatives:
  - my banner
  - my standard
  lexicon: HALOT
  rationale: 'נֵס commonly denotes a banner, signal pole, or standard. In this naming formula, rendering the phrase as a verbless title in idiomatic English requires supplying ''is'': ''The LORD Is My Banner.'' ''Banner'' is more familiar than ''standard'' and preserves the metaphor of rallying and victory.'
