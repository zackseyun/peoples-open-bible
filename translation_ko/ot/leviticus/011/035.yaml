review_pass:
  verdict: revise
  source_fidelity: 초안은 제의적 부정의 기본 뜻과 화덕/화로를 파괴해야 한다는 명령을 대체로 담고 있습니다. 그러나 "그들의 시체 중 어느 것이나 그 위에 떨어지는 것은"은 히브리어의 관계절 구조를 자연스럽게 반영하지 못하며, "부정함이 되나니/하느니라"는 요청된 현대 합쇼체와 맞지 않습니다. "그들은 부정함이요"도 무생물인 화덕과 화로를 가리키는 표현으로 부자연스럽습니다.
  naturalness: 현대 표준어 합쇼체로 법규적 진술을 명료하게 옮기기 위해 "부정해집니다", "헐어 버려야 합니다", "부정합니다"를 사용했습니다. "사체"만으로도 앞 문맥의 동물 사체를 가리킬 수 있으나, 각주에서 정결 규례의 동물 사체라는 의미를 밝혔습니다.
  terminology: טמא는 일관되게 "부정하다"로 옮겨 도덕적 악을 뜻한다고 확대하지 않았습니다. תַּנּוּר는 "화덕", כִּירַיִם은 고대의 조리 설비를 과도하게 특정하지 않는 "화로"로 옮겼습니다. נִבְלָתָם의 부분적 용법은 "사체의 일부"로 드러냈습니다.
  issues:
  - severity: medium
    issue: 첫 절의 관계절 및 낙하 주체가 불명확함
    rationale: 히브리어는 ‘그들의 사체의 일부가 그 위에 떨어지는 모든 것’을 말합니다. 초안의 ‘그들의 시체 중 어느 것이나 그 위에 떨어지는 것은’은 무엇이 떨어지고 무엇이 부정해지는지 문법적으로 모호합니다.
  - severity: medium
    issue: 문체가 현대 합쇼체가 아님
    rationale: ‘되나니’, ‘하느니라’, ‘이니라’는 고전 성서체이며, 지정된 현대 정중체에 맞지 않습니다.
  - severity: low
    issue: ‘그들은 부정함이요’의 지시와 서술이 부자연스러움
    rationale: 화덕과 화로 같은 무생물 복수 대상에는 ‘그것들은 부정합니다’가 자연스럽고, 히브리어의 복수 서술도 보존합니다.
  revised_text: 그들의 사체의 일부가 그 위에 떨어지는 모든 것은 부정해집니다. 화덕이나 화로는 헐어 버려야 합니다. 그것들은 부정하며, 너희에게 부정한 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그들의 사체’. 히브리어는 정결 규례의 문맥에서 부정한 동물의 사체를 가리키며, 여기서는 사체의 일부가 떨어지는 경우를 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘화로’에 해당하는 히브리어는 조리용 화로, 솥을 거는 시설, 또는 난로와 비슷한 설비를 가리킬 수 있습니다.
    reason: cultural_note
  revision_rationale: 원문의 법규적 관계절을 ‘사체의 일부가 그 위에 떨어지는 모든 것’으로 명료하게 재구성하고, 고전 종결형을 현대 합쇼체로 바꾸었습니다. 화덕과 화로의 파괴 명령 및 그것들의 제의적 부정 상태를 유지했으며, 고대 조리 설비의 정확한 형태는 각주에서만 제한적으로 설명했습니다.
