id: PSA.27.8
reference: Psalms 27:8
source:
  edition: WLC
  text: לְ/ךָ֤ אָמַ֣ר לִ֭בִּ/י בַּקְּשׁ֣וּ פָנָ֑/י אֶת פָּנֶ֖י/ךָ יְהוָ֣ה אֲבַקֵּֽשׁ׀־׃
translation:
  text: 'When you say, “Seek my face,” my heart answers you[a]: “Your face, Yahweh, I seek.”'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew opening is compressed and difficult; another understanding is, “My heart says concerning you, ‘Seek his face.’”
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ
  chosen: to you
  alternatives:
  - To you
  - Of you
  - For you
  lexicon: HALOT
  rationale: The preposition is most directly rendered as a dative. This avoids the unsupported representative sense of “on your behalf” while preserving the difficult Masoretic syntax.
- source_word: אָמַר לִבִּי
  chosen: my heart says
  alternatives:
  - my heart said
  - my heart has said
  lexicon: HALOT
  rationale: Although the verb form is qatal ('said'), in poetic discourse it can function as a present-like statement of inner resolve. 'My heart says' reads naturally in English and fits the immediate quoted exhortation.
- source_word: בַּקְּשׁוּ
  chosen: Seek
  alternatives:
  - seek out
  - look for
  lexicon: HALOT
  rationale: Imperative plural from בקשׁ. 'Seek' is the standard concise rendering and preserves the force of the command.
- source_word: פָנָי
  chosen: my face
  alternatives:
  - my presence
  lexicon: HALOT
  rationale: Literally 'my face.' In Hebrew this often carries the sense of personal presence, but 'face' should be retained in the main text because the same noun recurs in the second colon and the idiom is central to the verse.
- source_word: אֶת פָּנֶיךָ
  chosen: Your face
  alternatives:
  - your presence
  lexicon: HALOT
  rationale: The direct-object marker plus 'your face' introduces the psalmist's response. Retaining 'face' preserves the lexical repetition and the relational imagery of seeking direct audience with God.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: אֲבַקֵּשׁ
  chosen: I seek
  alternatives:
  - I will seek
  - I am seeking
  lexicon: HALOT
  rationale: Imperfect 1cs can be rendered present or future. 'I seek' best matches the immediate responsive resolve in the poetic parallelism; future nuance is possible and worth preserving in a footnote.
