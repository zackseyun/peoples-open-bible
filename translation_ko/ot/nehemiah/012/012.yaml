id: NEH.12.12
reference: Nehemiah 12:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בִ/ימֵי֙ יֽוֹיָקִ֔ים הָי֥וּ כֹהֲנִ֖ים רָאשֵׁ֣י הָ/אָב֑וֹת לִ/שְׂרָיָ֣ה מְרָיָ֔ה לְ/יִרְמְיָ֖ה חֲנַנְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/012.yaml
  text: 'And in the days of Joiakim, there were priests, heads of the fathers’ houses: for Seraiah, Meraiah; for Jeremiah, Hananiah.'
translation:
  language: ko
  text: 요야김 시대에 제사장들, 곧 가문의 우두머리들이 있었습니다. 스라야 가문에는 므라야가, 예레미야 가문에는 하나냐가 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִימֵי יוֹיָקִים
  english_pob_choice: And in the days of Joiakim
  chosen_korean: 요야김의 시대에
  alternatives_korean:
  - 요야김 때에
  - 요야김의 날들에
  lexicon: 고유명사 음역
  rationale: 히브리어 관용구 ‘in the days of’는 단순한 시간표시이므로, 현대 한국어에서 자연스러운 ‘~의 시대에’로 옮겼습니다.
- source_word: כֹהֲנִים רָאשֵׁי הָאָבוֹת
  english_pob_choice: priests, heads of the fathers’ houses
  chosen_korean: 제사장들, 곧 조상들의 가문의 우두머리들
  alternatives_korean:
  - 제사장들, 곧 조상들의 집안의 우두머리들
  - 제사장들, 곧 조상의 집들의 우두머리들
  lexicon: 명사구
  rationale: ‘head of the fathers’ houses’는 단순한 혈연 장로가 아니라 가문 단위의 대표자이므로, 의미를 분명히 드러내는 ‘가문의 우두머리들’로 옮겼습니다.
- source_word: לְ/שְׂרָיָה ... לְ/יִרְמְיָה
  english_pob_choice: for Seraiah ... for Jeremiah
  chosen_korean: 사라야에게는 ... 예레미야에게는
  alternatives_korean:
  - 사라야를 위해 ... 예레미야를 위해
  - 사라야 쪽에는 ... 예레미야 쪽에는
  lexicon: 전치사 לְ
  rationale: 여기서 לְ는 소유나 소속을 나타내는 문맥으로, 족장 명단의 배당 관계를 한국어 조사 ‘-에게는’로 간결하게 드러냈습니다.
- source_word: מְרָיָה / חֲנַנְיָה
  english_pob_choice: Meraiah / Hananiah
  chosen_korean: 메라야 / 하나냐
  alternatives_korean:
  - 므라야 / 하나냐
  - 메라야 / 하나냐
  lexicon: 고유명사 음역
  rationale: 인명은 현대 음역 원칙에 따라 표기하되, 이미 통용되는 성서식 이름인 하나냐는 유지했습니다.
theological_decisions:
- issue: 명단형 역사 서술의 전달 방식
  chosen_reading: 직역에 가까운 평서문으로 유지하여 제사장 직분과 가문 대표성의 구조를 드러냈습니다.
  alternative_readings:
  - 의역하여 ‘사라야 가문에서는 메라야가, 예레미야 가문에서는 하나냐가 맡았습니다’로 풀어쓰기
  - 간결하게 ‘사라야 계열은 메라야, 예레미야 계열은 하나냐’로 축약
  rationale: 본문은 신학 논변보다 역사적/행정적 기록이므로, 설명을 덧붙이기보다 원문의 평행 구조를 보존하는 것이 적절합니다.
  doctrine_reference: 성경 본문의 역사 서술 보존 원칙
- issue: ‘heads of the fathers’ houses’의 사회적 의미
  chosen_reading: 가문 단위의 대표자라는 의미를 살려 공동체의 제사장 질서를 나타내도록 했습니다.
  alternative_readings:
  - 단순히 ‘족장들’로 처리
  - ‘가문의 수장들’로 현대화
  rationale: 이 표현은 제사장 공동체의 조직 구조를 가리키므로, 직분과 가문을 함께 보여 주는 번역이 문맥상 가장 정확합니다.
  doctrine_reference: 구약 공동체 질서에 대한 서술
