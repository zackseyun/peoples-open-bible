id: LJE.1.62
reference: Letter of Jeremiah 1:62
source:
  edition: lxx-swete-1909
  text: τό τε πῦρ ἐξαποσταλὲν ἄνωθεν ἐξαναλῶσαι ὄρη καὶ δρυμούς ποιεῖ τὸ συνταχθέν· ταῦτα δὲ οὔτε ταῖς ἰδέαις οὔτε ταῖς δυνάμεσιν αὐτῶν ἀφωμοιωμένα ἐστίν.
  language: Greek
