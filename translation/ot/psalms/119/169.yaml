  text: תִּקְרַ֤ב רִנָּתִ֣/י לְ/פָנֶ֣י/ךָ יְהוָ֑ה כִּ/דְבָרְ/ךָ֥ הֲבִינֵֽ/נִי׃
translation:
  text: Let my cry come before you, Yahweh; give me understanding according to your word.
  philosophy: dynamic
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: כִּדְבָרְךָ
  chosen: word
  alternatives:
  - matter
  - thing
  lexicon: HALOT
  rationale: דָּבָר is God's spoken word. Rendered 'word' consistently; paired with אִמְרָה ('promise') the two utterance-terms stay distinct.
