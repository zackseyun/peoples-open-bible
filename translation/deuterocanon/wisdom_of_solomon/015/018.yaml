translation:
  text: They even worship the most loathsome animals, for these are more senseless than the rest[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, the 'folly' may refer to the worshipers' foolish comparison rather than to the animals' lack of sense.
