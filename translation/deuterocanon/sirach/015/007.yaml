- issue: Use of Hebrew witness versus Greek parallel where the first colon is semantically difficult
  chosen_reading: Follow the Hebrew as primary, but render the difficult verb in light of the Greek parallel as 'attain' rather than a wooden 'guide.'
  alternative_readings:
  - Men of falsehood will not guide her
  - Senseless people will never grasp her
  rationale: The project philosophy gives primacy to the surviving Hebrew of Sirach where available, while also requiring the Greek parallel to be used as real translation input. Here the Hebrew wording is preserved, but the Greek helps clarify that the line concerns failure to gain Wisdom, not leading her. This yields an English rendering anchored in the Hebrew and informed by the Greek.
