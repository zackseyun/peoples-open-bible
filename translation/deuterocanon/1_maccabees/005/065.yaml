  category: meaning_retranslation
  from: And Judas and his brothers went out[a], and they fought the sons of Esau in the land to the south, and he struck Hebron and its daughter towns; he tore down its fortress[b], and he burned its towers all around.
  to: Judas and his brothers set out and fought the descendants of Esau[a] in the land to the south. He attacked Hebron and its dependent towns, tore down its fortress, and burned the towers surrounding it.
  rationale: The lexical notes establish both the Edomite identity and the dependent-settlement meaning of “daughters,” but retained source-shaped expressions. I carry those meanings into the main text while preserving the important connection to Esau and the shift to Judas as the leading actor.
