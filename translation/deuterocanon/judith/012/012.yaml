  - 824
  - 825
  confidence: high
  validation: agree
translation:
  text: Look, it would be a disgrace to us if we let such a woman go without having relations with her[a]; if we do not seduce her, she will laugh at us.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “without speaking with her”; the Greek verb can refer to conversation or sexual relations, and the context here points to the latter.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  chosen: For look
  alternatives:
  - Behold
  - Look
  lexicon: LSJ
  rationale: Introduces an emphatic explanation. 'For look' preserves both γάρ and the deictic force of ἰδού in readable modern English.
- source_word: αἰσχρὸν
  chosen: shameful
  alternatives:
  - disgraceful
  - base
  - ugly
  lexicon: LSJ
  rationale: In context the sense is social disgrace or embarrassment, not physical ugliness. 'Shameful' best fits the idiom with τῷ προσώπῳ ἡμῶν.
- source_word: τῷ προσώπῳ ἡμῶν
  chosen: for us
  alternatives:
  - to our face
  - in our sight
  - before us
  lexicon: LSJ
  rationale: Literally 'to our face,' an idiom for what reflects on one's honor or public standing. 'For us' communicates the idiomatic sense in natural English without wooden literalism.
- source_word: παρήσομεν
  chosen: we let ... go
  alternatives:
  - we pass by
  - we neglect
  - we allow to pass
  lexicon: LSJ
  rationale: Future of παρίημι here means to let someone pass on or go by. 'Let ... go' fits the immediate social situation.
- source_word: οὐχ ὁμιλήσαντες αὐτῇ
  chosen: without speaking with her
  alternatives:
  - without conversing with her
  - without approaching her in conversation
  lexicon: LSJ
  rationale: 'Aorist participle with negation expresses attendant circumstance: letting her go without first engaging her. ''Speaking with her'' is clear and natural.'
- source_word: ἐπισπάσωμεθα
  chosen: draw her in
  alternatives:
  - attract her
  - entice her
  - win her over
  lexicon: LSJ
  rationale: The verb suggests drawing someone toward oneself. In this context of attempted seduction or social capture, 'draw her in' preserves the manipulative nuance without over-specifying the method.
- source_word: καταγελάσεται ἡμῶν
  chosen: she will laugh at us
  alternatives:
  - she will mock us
  - she will ridicule us
  lexicon: LSJ
  rationale: The verb means to laugh at, mock, or deride. 'Laugh at us' is the most direct rendering and preserves the social-honor tone of the sentence.
