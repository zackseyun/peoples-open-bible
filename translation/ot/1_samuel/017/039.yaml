  from: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
  to: David strapped the sword on over his military clothing and tried to walk, because he was not used to the equipment. But David said to Saul, “I cannot go in these, because I am not used to them.” So David took them off.
