    text: 히브리어 ‘야훼’는 하나님의 고유한 이름이며, 한국어 성경 번역에서는 전통적으로 ‘여호와’로도 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: ‘셀라’는 뜻이 확실하지 않은 히브리어 예전 또는 음악 용어입니다. ‘쉼’이나 ‘간주’ 등을 뜻할 가능성이 제시됩니다.
    reason: lexical_alternative
