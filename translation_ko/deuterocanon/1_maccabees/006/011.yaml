  - severity: high
    issue: ὅτι를 ‘그러나’로 확정하여 양보 대조를 삽입함
    rationale: 원문은 ὅτι를 사용하며 명시적 양보 접속사가 없습니다. 한국어에서는 ‘나는 선하고 사랑받는 사람이었는데’처럼 원문의 연결을 과도하게 해석하지 않는 방식이 안전합니다.
  - severity: high
    issue: 각주가 원문에 없는 ‘סער’를 제시하고 κλύδων을 그에 대응하는 직역이라고 설명함
    rationale: 제시된 그리스어 원문은 κλύδων이며 히브리어 단어가 아닙니다. 각주는 본문 근거를 잘못 제시하므로 삭제해야 합니다.
