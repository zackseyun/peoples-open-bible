  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָ֭ם / by them
  english_pob_choice: by them
  chosen_korean: 그것들로 말미암아
  alternatives_korean:
  - 그것들로
  - 그것들을 통해
  lexicon: בְּ + 3mp suffix
  rationale: 도구·매개를 나타내는 בָּם을 한국어의 ‘말미암아’로 옮겨, 원인/수단의 관계를 자연스럽게 드러냈습니다.
- source_word: יָדִין / judges
  english_pob_choice: he judges
  chosen_korean: 심판하십니다
  alternatives_korean:
  - 판단하십니다
  - 재판하십니다
  lexicon: דין
  rationale: 문맥상 단순 판단보다 하나님의 공적 판결과 다스림을 가리키므로 ‘심판하다’를 선택했습니다.
- source_word: עַמִּים / peoples
  english_pob_choice: peoples
  chosen_korean: 민족들
  alternatives_korean:
  - 백성들
  - 나라들
  lexicon: עם
  rationale: 복수형 עַמִּים의 집합적 의미를 살려 여러 민족 집단을 뜻하는 ‘민족들’로 옮겼습니다.
- source_word: מַכְבִּיר / in abundance
  english_pob_choice: in abundance
  chosen_korean: 풍성한
  alternatives_korean:
  - 넉넉한
  - 넘치도록 많은
  lexicon: כבּר
  rationale: 양식의 양이 매우 많음을 간결하게 나타내기 위해 ‘풍성한’으로 처리했습니다.
theological_decisions:
- issue: 하나님의 공급이 심판과 병렬로 제시되는 구조
  chosen_reading: 하나님은 민족들을 심판하시는 동시에 풍성한 양식을 주시는 분으로 제시됩니다.
  alternative_readings:
  - 자연 현상을 통해 공급하신다는 일반 섭리 강조
  - 특정한 이스라엘만이 아니라 민족들 전체를 향한 보편적 주권 강조
  rationale: 히브리어 시구의 병렬을 따라 심판과 공급을 함께 보존하여, 하나님의 주권과 섭리의 긴장을 약화시키지 않았습니다.
  doctrine_reference: 욥기 36:31의 문맥적 신정론
