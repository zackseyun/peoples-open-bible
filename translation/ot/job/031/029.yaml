  from: If I rejoiced at the ruin of the one who hates me[d][c][b][a], and exulted when evil found him—
  to: If I rejoiced at the ruin of the one who hates me, and exulted when harm found him—[a]
  rationale: “Harm” better signals that רָע here is adversity befalling the hated person, rather than moral evil. But “gloated” is stronger and more interpretive than the verb requires; “exulted” suitably conveys the heightened rejoicing while leaving malicious gloating implicit. The Hebrew conjunction is “and,” and no natural-English necessity warrants changing it to “or.”
