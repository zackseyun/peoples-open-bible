translation:
  language: ko
  text: 이 두 가지가 저에게는 너무 벅찹니다. 저는 주님의 백성 절반을 버릴 수도 없고, 제 어머니가 멸망하는 것을 제 마음이 차마 볼 수도 없습니다.
