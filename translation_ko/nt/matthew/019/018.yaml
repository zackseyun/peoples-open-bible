  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: ko
  text: '그가 예수께 말했습니다. “어느 계명들입니까?” 예수께서 말씀하셨습니다. “다음과 같습니다: 살인하지 마십시오. 간음하지 마십시오. 도둑질하지 마십시오. 거짓 증언하지 마십시오.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας;
  english_pob_choice: Which ones?
  chosen_korean: 어느 것들입니까?
  alternatives_korean:
  - 무엇입니까?
  - 어느 계명들입니까?
  lexicon: ποῖος
  rationale: 복수형 의문에 맞게 ‘어느 것들’로 옮겨, 앞절의 계명 묶음 중 어떤 것인지 묻는 뉘앙스를 살렸습니다.
- source_word: Τὸ
  english_pob_choice: 'The:'
  chosen_korean: '곧:'
  alternatives_korean:
  - '바로:'
  - '즉:'
  lexicon: ὁ
  rationale: 본문의 특이한 정관사 용법을 한국어에서 자연스러운 도입 표지로 처리하되, 계명 인용이 시작됨을 드러냈습니다.
- source_word: Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις
  english_pob_choice: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness
  chosen_korean: 살인하지 마라. 간음하지 마라. 도둑질하지 마라. 거짓 증언하지 마라.
  alternatives_korean:
  - 살해하지 마라. 간음하지 마라. 훔치지 마라. 거짓 증언하지 마라.
  - 사람을 죽이지 마라. 간음하지 마라. 도둑질하지 마라. 거짓 증언하지 마라.
  lexicon: οὐ + 미래직설/금지형, φονεύω, μοιχεύω, κλέπτω, ψευδομαρτυρέω
  rationale: 계명 인용의 직접성을 살리되 현대 한국어 금지형으로 자연스럽게 옮겼습니다. ‘살인하다’가 전통적이면서도 본문 의미를 충분히 담고, ‘거짓 증언하다’는 법정적 어감을 유지합니다.
theological_decisions:
- issue: 계명 인용 앞의 특이한 정관사 ‘Τὸ’ 처리
  chosen_reading: 본문의 형태를 그대로 반영하되 한국어에서는 ‘곧:’로 처리해 인용 도입으로 읽히게 했습니다.
  alternative_readings:
  - ‘그:’처럼 직역
  - 아예 생략
  rationale: 이 표현은 문법적으로도 특이하고 한국어 직역이 매우 어색하므로, 본문에 있는 인용 개시 기능을 유지하는 쪽이 가장 충실합니다.
  doctrine_reference: 본문비평/문법 관찰
