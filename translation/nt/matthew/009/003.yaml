  from: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
  to: And behold[a], some of the scribes said to themselves, “This man is blaspheming.”
  rationale: While 'among themselves' is a valid translation of 'ἐν ἑαυτοῖς', in English it strongly implies spoken conversation between the scribes. However, the immediate context of verse 4 states that Jesus knew their 'thoughts' (ἐνθυμήσεις) and asked why they were thinking evil in their 'hearts' (ἐν ταῖς καρδίαις). This strongly indicates that 'εἶπαν ἐν ἑαυτοῖς' here refers to internal deliberation. 'Said to themselves' or 'said within themselves' better preserves this narrative reality.
