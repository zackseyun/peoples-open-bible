translation:
  language: en
  text: The men of Nineveh will rise up in the judgment with this generation and condemn it, because they reoriented toward God[b] at Jonah’s preaching. And look, something greater than Jonah is here.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or "one greater than Jonah is here." The Greek uses a neuter expression, literally "something greater than Jonah."
    reason: alternative_reading
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
