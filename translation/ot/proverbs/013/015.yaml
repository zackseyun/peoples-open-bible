id: PRO.13.15
reference: Proverbs 13:15
source:
  edition: WLC
  text: שֵֽׂכֶל ט֭וֹב יִתֶּן חֵ֑ן וְ/דֶ֖רֶךְ בֹּגְדִ֣ים אֵיתָֽן־־׃
translation:
  text: Good sense wins favor, but the way of the treacherous is hard[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “unyielding,” describing their stubborn course of conduct; the Hebrew word usually means “firm” or “enduring.”
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׂכֶל
  chosen: sense
  alternatives:
  - understanding
  - insight
  - prudence
  lexicon: HALOT
  rationale: The noun denotes understanding or sound judgment. In English, 'good sense' is natural and preserves the proverb's practical wisdom emphasis better than the more abstract 'understanding.'
- source_word: טוֹב
  chosen: good
  alternatives:
  - sound
  - fine
  lexicon: HALOT
  rationale: Used attributively with שֵׂכֶל, it qualifies the kind of discernment in view. 'Good' is the most direct and idiomatic rendering in this collocation.
- source_word: יִתֶּן
  chosen: gives
  alternatives:
  - produces
  - wins
  lexicon: HALOT
  rationale: The verb is literally 'gives.' In proverbial style, this can imply resulting in or obtaining, but 'gives' preserves the Hebrew image while remaining clear in English.
- source_word: חֵן
  chosen: favor
  alternatives:
  - grace
  - acceptance
  lexicon: HALOT
  rationale: Here the sense is social approval or gracious regard rather than specifically theological grace. 'Favor' best fits the wisdom context and common English usage.
- source_word: דֶרֶךְ
  chosen: way
  alternatives:
  - path
  - course
  lexicon: HALOT
  rationale: A standard wisdom term for manner of life or conduct. 'Way' is both literal enough and idiomatic in Proverbs.
- source_word: בֹּגְדִים
  chosen: the treacherous
  alternatives:
  - traitors
  - the faithless
  - the unfaithful
  lexicon: HALOT
  rationale: The participle refers to those who act deceitfully or treacherously. 'The treacherous' captures the character type in a concise, proverbial way.
- source_word: אֵיתָן
  chosen: hard
  alternatives:
  - rugged
  - enduring
  - impassable
  lexicon: HALOT
  rationale: Conveys the likely contextual sense of a firm, unyielding, or harsh way, while the note preserves the word’s broader lexical range and the line’s difficulty.
- source_word: יִתֶּן חֵן
  chosen: wins favor
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Idiomatic English for the favorable regard that good sense produces.
