id: PSA.78.9
reference: Psalms 78:9
source:
  edition: WLC
  text: בְּֽנֵי אֶפְרַ֗יִם נוֹשְׁקֵ֥י רוֹמֵי קָ֑שֶׁת הָ֝פְכ֗וּ בְּ/י֣וֹם קְרָֽב־־׃
translation:
  text: The Ephraimites, armed bowmen, turned back on the day of battle.
  philosophy: dynamic
lexical_decisions:
- source_word: בְּנֵי אֶפְרַיִם
  chosen: The Ephraimites
  alternatives:
  - The children of Ephraim
  - The Ephraimites
  lexicon: HALOT
  rationale: This is the natural English gentilic for the Hebrew expression with a tribal name.
- source_word: נוֹשְׁקֵי
  chosen: armed
  alternatives:
  - bearing arms
  - equipped
  lexicon: HALOT
  rationale: From נשׁק in the sense of arming/equipping oneself with weapons. In this construction it describes military readiness. 'Armed' is concise and natural in English.
- source_word: רוֹמֵי קָשֶׁת
  chosen: archers
  alternatives:
  - shooters of the bow
  - those who draw the bow
  - bowmen
  lexicon: HALOT
  rationale: Literally 'throwers/shooters of the bow,' an idiom for bowmen. 'Archers' captures the sense idiomatically in modern English without unnecessary stiffness.
- source_word: נוֹשְׁקֵי רוֹמֵי קָשֶׁת
  chosen: armed bowmen
  alternatives:
  - armed, shooting the bow
  - bearing arms, bowmen
  lexicon: HALOT
  rationale: This concise English expression represents both their being armed and their characterization as bow-shooters, while the note preserves the verbal alternative.
- source_word: הָפְכוּ
  chosen: turned back
  alternatives:
  - turned around
  - retreated
  - turned away
  lexicon: HALOT
  rationale: The verb conveys reversal or turning back. In a battle context, 'turned back' preserves the image and implies retreat without over-specifying beyond the Hebrew.
- source_word: בְּיוֹם קְרָב
  chosen: on the day of battle
  alternatives:
  - in the day of battle
  - on the day of combat
  lexicon: HALOT
  rationale: A straightforward temporal phrase. 'On the day of battle' is idiomatic modern English and retains the solemnity of the Hebrew.
