  source_fidelity: 그리스어 νιφετοί는 ‘소나기’가 아니라 ‘눈/눈발/강설’을 뜻합니다. 따라서 영어 POB 감사 이력의 ‘showers’는 원문과 맞지 않으며, 초안의 ‘소나기들’도 수정해야 합니다. 두 동사 ὑμνεῖτε와 ὑπερυψοῦτε는 모두 명령형이므로 각각을 명령으로 살렸습니다.
  naturalness: ‘이슬과 눈아’는 자연물을 부르는 찬양시의 의인화된 호격으로 자연스럽습니다. ‘노래하며 높이 들으십시오 영원히’는 두 번째 명령을 부사절처럼 약화하고 어순도 부자연스러워, ‘찬양하고 영원히 드높이십시오’로 다듬었습니다.
  terminology: κύριος는 문맥상 ‘주님’으로 유지했습니다. ὑπερυψόω는 단순히 물리적으로 ‘높이 들다’보다 예배적 의미의 ‘드높이다’가 적절합니다.
