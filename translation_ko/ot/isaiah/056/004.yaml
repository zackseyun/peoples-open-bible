revisions:
- from: 야훼께서 말씀하십니다. “안식일들을 지키며, 내가 기뻐하는 것을 선택하고, 내 언약을 굳게 지키는 내시들에게는…”[a]
  to: '야훼께서 내 안식일들을 지키고, 내가 기뻐하는 것을 택하며, 내 언약을 굳게 붙드는 내시들에게 이렇게 말씀하십니다:'
  rationale: 소유격 ‘내’를 복원하고, 수신자 구문을 한국어의 완결된 말씀 도입 형식으로 재구성했습니다. 복수형 ‘안식일들’, ‘내시들’, 그리고 언약을 ‘굳게 붙들다’라는 원문의 비유는 유지했습니다. 원문과 영어 감사본의 콜론처럼 다음 절로 이어지는 개방 구조를 콜론으로 보존했습니다. 초안의 주석은 본문 자체에 이미 복수형이 명시되어 있어 필수적이지 않으므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:24Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 수신자와 세 동작(안식일 준수, 하나님께서 기뻐하시는 것의 선택, 언약을 굳게 붙듦)을 대체로 충실히 옮겼습니다. 그러나 שַׁבְּתוֹתַי의 1인칭 소유 접미사 ‘내’가 본문에서 누락되었습니다. 또한 מַחֲזִיקִים בִּבְרִיתִי는 ‘언약을 굳게 붙드는’으로 옮기는 것이 ‘굳게 지키는’보다 원문의 ‘붙들다/굳게 지키다’라는 비유를 더 직접적으로 보존합니다.
  naturalness: ‘내시들에게는…’으로 끝나는 현재 문장은 한국어에서 문법적으로 미완성이며, 도입 공식인 כֹּה אָמַר יְהוָה는 ‘야훼께서 … 이렇게 말씀하십니다:’로 처리하는 것이 자연스럽습니다. ‘선택하고’보다 문어적 병렬 구조에 맞는 ‘택하며’가 더 매끄럽습니다. 이 절은 다음 절의 발화를 도입하므로 콜론으로 열어 두는 것이 적절합니다.
  terminology: ‘야훼’는 יהוה의 고유 신명을 반영하며, ‘내시들’은 이사야 56장의 문맥에서 סָרִיסִים의 통상적 의미를 적절히 전달합니다. ‘안식일들’은 복수형을 보존합니다.
  issues:
  - severity: medium
    issue: ‘내 안식일들’의 소유격 누락
    rationale: יִשְׁמְרוּ אֶת שַׁבְּתוֹתַי에는 ‘나의/내’(1인칭 단수 소유 접미사)가 명시되어 있습니다. 초안의 ‘안식일들을’은 이 의미 요소를 빠뜨립니다.
  - severity: medium
    issue: 수신자 구문의 문법적 미완성
    rationale: ‘내시들에게는…’은 뒤에 대응하는 서술어가 없이 끝납니다. 원문의 ‘이렇게 말씀하셨다/말씀하십니다’ 도입을 수신자 앞에 배치하여 완결해야 합니다.
  - severity: low
    issue: ‘내 언약을 굳게 지키는’의 비유적 동사 약화
    rationale: מַחֲזִיקִים은 문자적으로 ‘굳게 붙드는’입니다. ‘지키는’도 문맥상 가능하지만 앞의 안식일을 ‘지키며’와 중복되고, 원문의 표현을 덜 직접적으로 반영합니다.
