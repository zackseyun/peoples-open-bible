theological_decisions:
- issue: Reference of “spirit” (τὸ πνεῦμα ὑμῶν)
  chosen_reading: Human inner condition, singular spirit with plural addressees; a community dimension
    remains possible.
  alternative_readings:
  - A collective community disposition within this human reference.
  rationale: Preserve the selected singular/plural grammar and the aging/weakness image without asserting
    that a communal reading is excluded or that a divine spirit ages.
- issue: κύριος/Κύριος distinction
  chosen_reading: Translate vocative κύριε to the messenger as “sir,” but ὁ Κύριος as “the Lord” for God
  alternative_readings:
  - Render both as Lord
  - Render both as master/sir
  rationale: The same lemma appears with different referents; maintaining a distinction avoids blurring
    divine title with polite address.
- issue: κοίμησις as euphemism
  chosen_reading: Render κοίμησις as “sleep,” preserving the euphemism for death
  alternative_readings:
  - Render directly as death
  - Render as rest
  rationale: Early Christian idiom often speaks of death as sleep; preserving it maintains the texture
    and allows readers to note the metaphor.
- issue: 'πρεσβύτεροι: age vs. office'
  chosen_reading: Render πρεσβύτεροι here as “the aged,” not “elders” (office)
  alternative_readings:
  - elderly people
  - old men
  rationale: The comparison is with human aging and loss of vigor; not with church governance.
- issue: ἀκηδία rendering
  chosen_reading: Translate as “negligence,” noting the traditional term “acedia” in a footnote
  alternative_readings:
  - sloth
  - apathy
  - retain ‘acedia’ in text
  rationale: “Negligence” communicates the lack of care/concern in context; footnote preserves historical
    term.
