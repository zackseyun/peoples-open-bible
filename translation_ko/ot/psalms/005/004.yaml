lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 본문의 고유 신명은 보통 칭호가 아니라 고유명사이므로, POB의 원칙에 따라 한국어에서도 ‘야훼’로 옮겨 신명 자체를 보존했습니다.
- source_word: בֹּקֶר
  english_pob_choice: in the morning
  chosen_korean: 아침에
  alternatives_korean:
