id: ISA.18.2
reference: Isaiah 18:2
source:
  edition: WLC
  text: הַ/שֹּׁלֵ֨חַ בַּ/יָּ֜ם צִירִ֗ים וּ/בִ/כְלֵי גֹמֶא֮ עַל פְּנֵי מַיִם֒ לְכ֣וּ מַלְאָכִ֣ים קַלִּ֗ים אֶל גּוֹי֙ מְמֻשָּׁ֣ךְ וּ/מוֹרָ֔ט אֶל עַ֥ם נוֹרָ֖א מִן ה֣וּא וָ/הָ֑לְאָה גּ֚וֹי קַו קָ֣ו וּ/מְבוּסָ֔ה אֲשֶׁר בָּזְא֥וּ נְהָרִ֖ים אַרְצֽ/וֹ־־־׀־־־־־׃
translation:
  text: you who send envoys by water in papyrus boats over the waters! Go, swift messengers, to a nation of tall, smooth-skinned people[a], to a people feared far and wide, a nation that measures out territory and tramples others down[b], whose land rivers divide[c].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “stretched out and polished”; probably a description of the people’s appearance.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew epithet is obscure: literally, “a nation of line upon line and trampling.” The measuring-and-trampling description may refer to conquest.'
    reason: lexical_alternative
  - marker: c
    text: Or “whose land the rivers plunder” or “spoil.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  chosen: who sends
  alternatives:
  - sending
  lexicon: HALOT
  rationale: The article plus participle continues the description begun in the preceding verse. English naturally connects it with a relative clause.
- source_word: צִירִים
  chosen: envoys
  alternatives:
  - messengers
  - ambassadors
  lexicon: HALOT
  rationale: The term commonly denotes diplomatic messengers or envoys, especially in international contexts. 'Envoys' captures the political sense better than the more generic 'messengers' in the first colon.
- source_word: בַּיָּם
  chosen: by sea
  alternatives:
  - on the sea
  - into the sea
  lexicon: HALOT
  rationale: Idiomatic English for travel by water. The preposition with 'sea' here indicates the route or medium of sending.
- source_word: וּבִכְלֵי גֹמֶא
  chosen: in vessels of papyrus
  alternatives:
  - in papyrus boats
  - in reed vessels
  lexicon: HALOT
  rationale: The prepositional phrase describes the envoys' light watercraft. 'Vessels of papyrus' is precise and natural.
- source_word: עַל פְּנֵי מַיִם
  chosen: over the waters
  alternatives:
  - over the surface of the waters
  lexicon: HALOT
  rationale: The shorter English phrase preserves movement over the water without a wooden surface idiom.
- source_word: לְכוּ
  chosen: Go
  alternatives:
  - Depart
  - Proceed
  lexicon: HALOT
  rationale: Straightforward imperative plural addressed to the messengers.
- source_word: מַלְאָכִים קַלִּים
  chosen: swift messengers
  alternatives:
  - speedy messengers
  - light messengers
  lexicon: HALOT
  rationale: קַלִּים here denotes speed or swiftness, not lightness in weight. 'Swift messengers' is natural and precise.
- source_word: גּוֹי מְמֻשָּׁךְ וּמוֹרָט
  chosen: a nation tall and smooth-skinned
  alternatives:
  - a nation stretched out and polished
  - a nation drawn out and shaven
  lexicon: HALOT
  rationale: This difficult phrase likely describes the physical appearance of the people, traditionally identified with Cushites. 'Tall and smooth-skinned' reflects a common contextual understanding of מְמֻשָּׁךְ ('drawn out, extended') and מוֹרָט ('polished, smooth'), avoiding archaic 'terrible' style renderings while preserving the descriptive force.
- source_word: עַם נוֹרָא מִן הוּא וָהָלְאָה
  chosen: a people feared far and wide
  alternatives:
  - a people feared from here onward
  - a people awesome beyond all others
  lexicon: HALOT
  rationale: The phrase is idiomatic and difficult. The sense is of a people inspiring fear over a broad extent or over time. 'Feared far and wide' communicates the scope naturally without overcommitting to a single technical nuance.
- source_word: גּוֹי קַו קָו
  chosen: a nation that measures out
  alternatives:
  - a nation of line upon line
  - a powerful nation
  lexicon: HALOT
  rationale: The repeated noun is associated with a measuring line, but the epithet is genuinely obscure. The active construal is grammatically possible and remains explicitly qualified in a note.
- source_word: וּמְבוּסָה
  chosen: and tramples down
  alternatives:
  - and is trampled
  - and conquers
  lexicon: HALOT
  rationale: The form evokes trampling. The active coordination follows the main epithet construal while the note preserves uncertainty.
- source_word: אֲשֶׁר בָּזְאוּ נְהָרִים אַרְצוֹ
  chosen: whose land rivers divide
  alternatives:
  - whose land the rivers plunder
  - whose land rivers spoil
  lexicon: HALOT
  rationale: The contextual geographical reading depicts a river-cut land; the verb's ordinary plundering sense remains footnoted rather than hidden.
