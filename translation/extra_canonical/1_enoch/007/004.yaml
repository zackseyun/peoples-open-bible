translation:
  text: And the giants turned against them and devoured humankind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening conjunction is bracketed in the selected edition. “Turned against” follows the printed Ethiopic wording
      rather than replacing it with an alternative Greek verb.
