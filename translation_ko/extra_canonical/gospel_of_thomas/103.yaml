  naturalness: ‘그가 … 하려는 것입니다’는 선행 내용과 문법적으로 자연스럽게 연결되지 않고 현대 한국어로도 부자연스럽습니다. 원문의 목적/예상 결과를 ‘그러면 그는 … 할 것입니다’로 자연스럽게 표현할 수 있습니다. 각주 표지는 해당 어구 바로 뒤에 배치해야 합니다.
