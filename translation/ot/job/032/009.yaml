id: JOB.32.9
reference: Job 32:9
source:
  edition: WLC
  text: לֹֽא רַבִּ֥ים יֶחְכָּ֑מוּ וּ֝/זְקֵנִ֗ים יָבִ֥ינוּ מִשְׁפָּֽט־׃
translation:
  text: The great[a] are not always wise, nor do the old always discern what is right.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “Those advanced in years.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  chosen: It is not
  alternatives:
  - not
  lexicon: HALOT
  rationale: The particle negates the following clause. Rendering with the English cleft-like structure 'It is not...' produces natural English while preserving the emphatic negation of the Hebrew sentence.
- source_word: רַבִּים
  chosen: the great
  alternatives:
  - many
  - the great
  lexicon: HALOT
  rationale: In context this substantival plural is best read as people of greatness or prominence, while זְקֵנִים separately names the old.
- source_word: יֶחְכָּמוּ
  chosen: are wise
  alternatives:
  - become wise
  - show wisdom
  lexicon: HALOT
  rationale: From חכם in the Qal, the verb can denote being or becoming wise. In this gnomic context, 'are wise' communicates the general truth naturally in English without overstating process.
- source_word: וּזְקֵנִים
  chosen: nor the old
  alternatives:
  - and elders
  - and old men
  - and the aged
  lexicon: HALOT
  rationale: זְקֵנִים can mean 'old men,' 'elders,' or 'aged ones.' In context Elihu is contrasting age with true understanding, so an age-based rendering is preferable to the office-like 'elders.' 'The old' is concise and preserves the representative force without importing male-specific limitation beyond what the context requires.
- source_word: יָבִינוּ
  chosen: understand
  alternatives:
  - discern
  - have insight into
  lexicon: HALOT
  rationale: בין commonly means to understand or discern. 'Understand' is the most straightforward English equivalent and pairs well with the object that follows.
- source_word: מִשְׁפָּט
  chosen: judgment
  alternatives:
  - judgment
  - what is right
  lexicon: HALOT
  rationale: “Judgment” preserves the word's judicial and moral range without selecting only one contextual application.
