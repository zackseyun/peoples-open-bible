  - 원수의 권세에
  - 원수의 힘 아래
  lexicon: HALOT
  rationale: ‘손’은 히브리어 관용구에서 권세와 통제의 구체적 표현이므로, 직유를 살려 ‘손에’로 유지했습니다.
- source_word: בַמֶּרְחָב
  english_pob_choice: in a broad place
  chosen_korean: 넓은 곳
  alternatives_korean:
  - 넓은 자리
  - 탁 트인 곳
  - 광활한 곳
  lexicon: HALOT
  rationale: מֶרְחָב는 물리적 넓이만이 아니라 압박에서 풀려난 안전과 자유의 공간을 가리키므로, 문맥에 맞는 직관적 표현으로 ‘넓은 곳’을 택했습니다.
- source_word: הֶעֱמַדְתָּ
  english_pob_choice: you have set
  chosen_korean: 세우셨습니다
  alternatives_korean:
  - 서게 하셨습니다
  - 세워 두셨습니다
  lexicon: HALOT
  rationale: ‘서게 하다/세우다’의 사역 의미를 살리되, 발을 안정된 자리에 두신 이미지를 한국어로 간결하게 전달합니다.
theological_decisions:
- issue: 야훼의 보호와 구원의 이미지
  chosen_reading: 원수의 손에 넘기지 않으셨고... 넓은 곳에 세우셨습니다
  alternative_readings:
