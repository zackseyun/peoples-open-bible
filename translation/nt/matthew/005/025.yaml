  from: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
  to: Come to terms with your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
  rationale: Combining the stative phrase 'be well-disposed' with the adverb 'quickly' (ταχὺ) creates an awkward English construction, as one cannot 'be' in a state quickly (one can only 'become' so). BDAG explicitly glosses the periphrastic construction ἴσθι εὐνοῶν here as 'make friends with' or 'come to terms with,' which correctly captures the active, ingressive force required by the adverb.
