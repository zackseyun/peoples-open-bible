revisions:
- from: '1[3]. 이스라엘이 셋째 달 초하룻날에 하란과 그 집에서 발행하여 맹세의 우물 길로 행하고 이 달 칠일에 그의 아버지 이삭의 하나님께 제사를 드렸더라.

    2. 야곱은 벧엘에서 본 꿈을 기억하고 애굽으로 내려가기를 두려워하였더라.

    3. 그는 요셉에게 사람을 보내어 자기에게로 오라고 하고 내려가지 않을 생각하고 거기에 칠 일 동안 머물면서 그가 남을 것인지, 내려가야 하는지 환상을 보려고 하였더라. 그리고 그가 묵은 곡식의 첫 열매의 절기를 지켰으니, 이는 가나안 온 땅에 씨앗이 한 줌도 없었기 때문입니다. 그것은 모두 짐승과 가축과 새와 사람의 식물이 되었기 때문입니다.

    4. 그리고 열여섯째 날에 주님께서 그에게 나타나셔서 그에게 말씀하셨다. “야곱아, 야곱아.” 그리고 그는 “내가 여기 있습니다.”라고 말했습니다.

    5. 또 그에게 이르시되 나는 네 아버지의 하나님 곧 아브라함과 이삭의 하나님이니 두려워하지 말라 애굽으로 내려가라 내가 거기서 너로 큰 민족을 이루게 하리라

    6[11]. 내가 너와 함께 내려가겠고 반드시 너를 다시 일으키리라. 그리고 당신은 이 땅에 묻힐 것이며 요셉이 손으로 당신의 눈을 감기게 될 것입니다. 두려워하지 마십시오. 이집트로 내려가거라.”

    7. 그리고 그의 아들들과 그의 손자들이 일어나, 그들의 아버지와 그들의 소유물을 수레에 실었습니다. 이스라엘이 이 셋째 달 십육일에 맹세의 우물에서 발행하여 애굽 땅으로 갔더라.

    8. 이스라엘이 유다를 그의 아들 요셉에게 먼저 보내어 그가 고센 땅을 예비하게 하였으니 이는 요셉이 그 형들에게 와서 거주하여 자기 가까이에 있으라 하였음이더라. 애굽 땅과 그 가까이 있는 모든 사람과 그들의 가축이 다 평안하였더라

    9. 그리고 그들의 아버지 야곱과 함께 이집트로 내려간 야곱의 아들들의 이름은 이러하다. 이스라엘의 장자는 르우벤이요, 그의 아들들의 이름은 이러하니 에녹, 발루, 헤스론, 갈미 네 사람이더라.

    10. 시므온과 그의 아들들, 그의 아들들의 이름은 이러하니 여무엘과 야민과 오핫과 야긴과 소할과 가나안 여인의 아들 사울 여섯이요

    11. 레위와 그의 아들들, 그의 아들들의 이름은 이러하니 게르손과 고핫과 므라리 세 사람이요

    12. 유다와 그의 아들들, 그의 아들들의 이름은 이러하니 셀라와 베레스와 세라 세 사람이요

    13. 잇사갈과 그의 아들들, 그의 아들들의 이름은 이러하니 돌라와 부와와 야숩과 시므론 네 사람이더라

    14. 스불론과 그의 아들들, 그의 아들들의 이름은 이러하니 세렛과 엘론과 얄르엘 세 사람이요

    15. 이들은 메소보다미아에서 레아가 야곱에게 낳은 야곱의 아들들과 그들의 아들들이니 여섯 명과 그의 누이 디나가 하나이다. 그리고 레아의 아들들과 그들의 아버지 야곱과 함께 이집트로 온 그들의 아들들은 모두 삼십삼 명이었습니다. 그 아버지 야곱을 포함하여 그들의 나이는 삼십사 명이었더라

    16. 레아의 여종 실바가 야곱에게 낳은 아들들은 갓과 아셀이니라. 그와 함께 애굽으로 내려간 아들들의 이름은 이러하니라 갓의 아들들은 시브온, 학기, 수니, 에스본, 에리, 아로디, 아렐리 일곱이요

    17. 아셀의 아들들은 임나와 이스와와 브리아와 그들의 누이 세라 네 사람이요 모든 사람은 열여섯 명이요, 레아의 계열은 모두 마흔아홉 명이었습니다.

    18. 야곱의 아내 라헬의 아들들은 요셉과 베냐민이요

    19. 요셉의 아버지가 이집트로 오기 전에 이집트에서 아들들을 낳았는데, 헬리오폴리스의 제사장 보디발의 딸 아스낫이 그에게 낳아 준 므낫세와 에브라임 둘이더라.

    20. 베냐민의 아들들은 벨라, 베겔, 아스벨, 게라, 나아만, 에히, 로스, 뭇빔, 후빔, 아릇 열 명이었더라.

    21. 라헬의 가족은 모두 열네 명이었습니다.

    22. 라헬의 여종 빌하가 야곱에게 낳은 아들들은 단과 납달리이니라.

    23. 그들과 함께 이집트로 내려온 아들들의 이름은 이러합니다. 단의 아들은 후심과 사몬과 아스디와 야가와 솔로몬 다섯 사람이요

    24. 그들은 애굽에 들어간 해에 죽었고 후심만 단에게 남았더라.

    25. 납달리의 아들들의 이름은 이러하니 야스엘, 구니, 예셀, 살룸, 이브더라.

    26. 그리고 이브도 기근이 있던 해에 이집트에서 죽었습니다. 라헬의 모든 사람은 이십육 명이었더라.

    27. 그리고 이집트에 들어간 야곱의 사람은 모두 칠십 명이었습니다. 이는 그의 아들들과 손자들이니 모두 칠십오 명이요

    28. 그 중에 요셉과 그의 두 아들 외에 다섯 명이 애굽에서 죽었더라 그리고 가나안 땅에서 유다의 두 아들 엘과 오난이 죽고 자녀가 없었더라.

    29. 이스라엘 자손이 죽임을 당한 자들을 장사하였으니 그 수가 칠십 명 이내였더라.'
  to: '1. 이스라엘은 셋째 달 초하루에 하란의 자기 집에서 떠나 맹세의 우물 길로 갔습니다. 그리고 이 달 칠일에 자기 아버지 이삭의 하나님께 제사를 드렸습니다.

    2. 야곱은 벧엘에서 보았던 꿈을 기억하고, 이집트로 내려가기를 두려워했습니다.

    3. 그가 요셉에게 사람을 보내어 자기에게 오게 하고, 자신은 내려가지 않으려고 생각하는 동안, 그는 거기서 칠 일 동안 머물며 환상을 통해 자신이 머물러야 할지 내려가야 할지를 알아보려고 하였습니다. 그리고 그는 묵은 곡식의 첫 열매를 거두는 추수 절기를 지켰습니다. 이는 가나안 온 땅에 땅에 뿌릴 어떤 씨앗도 한 움큼조차 없었고, 기근이 모든 짐승과 가축과 새와 사람들에게 미쳤기 때문입니다.

    4. 그리고 십육일에 주님께서 그에게 나타나셔서 말씀하셨습니다. “야곱아, 야곱아.” 그가 말했습니다. “제가 여기 있습니다.”

    5. 또 그에게 말씀하셨습니다. “나는 네 조상들의 하나님, 곧 아브라함과 이삭의 하나님이다. 두려워하지 마십시오. 애굽으로 내려가십시오. 내가 거기서 당신을 큰 민족으로 만들겠습니다.”

    6. 내가 너와 함께 내려가겠고 반드시 너를 다시 일으키리라. 그리고 네가 이 땅에 장사되고 요셉이 네 눈에 손을 얹을 것이다. 두려워하지 마십시오. 이집트로 내려가거라.”

    7. 그의 아들들과 손자들이 일어나 그들의 아버지와 그들의 소유물을 수레에 실었습니다. 이스라엘은 이 셋째 달 십육일에 맹세의 우물에서 떠나 이집트 땅으로 갔습니다.

    8. 이스라엘은 자기 아들 요셉에게 유다를 앞서 보내어 고센 땅을 살펴보게 하였습니다. 그곳에서 요셉이 자기 형제들에게 와서 거주하여 자기 가까이에 살도록 말하였기 때문입니다. 그곳은 이집트 땅에서 가장 좋은 곳이었으며, 그들 모두와 그들의 가축이 요셉 가까이에 머물기에 가까운 곳이었습니다.

    9. 그들의 아버지 야곱과 함께 애굽으로 내려간 야곱의 아들들의 이름은 이러합니다. 이스라엘의 장자 르우벤과 그의 아들들의 이름은 하녹, 발루, 헤스론, 갈미, 이렇게 네 사람입니다.

    10. 시므온과 그의 아들들의 이름은 이러합니다. 여무엘, 야민, 오핫, 야긴, 소할, 그리고 가나안 여인에게서 난 사울, 모두 여섯 명입니다.

    11. 레위와 그의 아들들입니다. 그의 아들들의 이름은 게르손, 고핫, 므라리, 곧 세 사람입니다.

    12. 유다와 그의 아들들이며, 그 아들들의 이름은 이러하니 셀라와 베레스와 세라, 세 사람입니다.

    13. 잇사갈과 그의 아들들이며, 그의 아들들의 이름은 이러합니다. 돌라와 부아와 야숩과 시므론, 네 명입니다.

    14. 스불론과 그의 아들들이며, 그의 아들들의 이름은 이러하니 세렛과 엘론과 야흘르엘, 곧 세 사람입니다.

    15. 이들은 메소포타미아에서 레아가 야곱에게 낳은 아들들과 그들의 아들들입니다. 아들은 여섯 명이고, 그들의 누이 디나는 한 명입니다. 야곱 그들의 아버지와 함께 이집트로 온 레아의 아들들과 그들의 아들들은 모두 삼십삼 명이었습니다. 그들의 아버지 야곱을 그들 가운데 포함하면 모두 삼십사 명이었습니다.

    16. 그리고 레아의 여종 실바가 야곱에게 낳은 아들들은 갓과 아셀입니다. 야곱과 함께 이집트로 들어간 그들의 아들들의 이름은 이러합니다. 갓의 아들들은 시브온, 학기, 수니, 에스본, 에리, 아로디, 아렐리, 곧 일곱 명입니다.

    17. 아셀의 아들들은 임나, 이스와, 브리아였고, 그들의 누이는 세라였습니다. 모두 네 명이었습니다. 사람은 모두 열여섯 명이었고, 레아 쪽의 사람은 모두 마흔아홉 명이었습니다.

    18. 야곱의 아내 라헬의 아들들은 요셉과 베냐민입니다.

    19. 요셉의 아버지가 애굽에 오기 전에, 애굽에서 요셉에게 아들들이 태어났습니다. 헬리오폴리스 제사장 보디발의 딸 아스낫이 그에게 낳은 아들들은 므낫세와 에브라임, 곧 둘이었습니다.

    20. 베냐민의 아들은 벨라와 베골과 아스벨과 게라와 나아만과 에히와 로스와 뭅빔과 훔빔과 아릇, 열 명입니다.

    21. 라헬에게 속한 사람은 모두 열네 명이었습니다.

    22. 라헬의 여자 노예인 빌하가 야곱에게 낳은 아들들은 단과 납달리입니다.

    23. 단의 아들들은 후심, 사몬, 아수디, 이아카, 솔로몬, 다섯 명입니다.

    24. 그들은 이집트에 들어간 해에 죽었고, 단에게는 후심만 남았습니다.

    25. 납달리 아들들의 이름은 야스엘, 구니, 예셀, 살룸, 이브입니다.

    26. 열한 명입니다. 라헬에게 속한 모든 사람은 열네 명이었습니다. 그리고 라헬의 여종 빌하의 아들들은:

    27. 야곱의 식구들 가운데 이집트에 들어간 사람은 모두 칠십 명이었습니다. 이들은 그의 아들들과 그의 아들들의 아들들로서, 모두 칠십오 명이었습니다.

    28. [이들은 야곱의 아내 라헬의 여종 빌하가 야곱에게 낳은 아들들의 이름입니다. 곧 단과 납달리입니다.] 그리고 이들은 그들과 함께 이집트로 들어간 그들의 자녀들의 이름입니다. 단의 아들들은 후심과 사몬입니다.

    29. 아수디와 이약과 솔로몬까지 모두 여섯 명이었습니다. 그들은 이집트에 들어간 그 해에 죽었고, 다니에게는 남아 있었습니다.'
