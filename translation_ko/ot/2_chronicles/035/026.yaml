  lexicon: HALOT
  rationale: 왕 연대기 요약문에서 דִּבְרֵי는 문자적으로 ‘말들’이지만 실제로는 왕의 행위와 사건들을 가리키므로 ‘행적’이 가장 적절합니다.
- source_word: וַחֲסָדָיו
  english_pob_choice: his deeds of faithful love
  chosen_korean: 그의 신실한 사랑의 행위
  alternatives_korean:
  - 그의 충실한 행위
  - 그의 인애의 행위
  - 그의 언약적 신실함의 행위
  lexicon: HALOT
  rationale: חֶסֶד은 단순한 친절보다 언약적 충성/인애의 뉘앙스가 강하므로, ‘신실한 사랑’으로 옮겨 그 신학적 밀도를 살렸습니다.
- source_word: בְּתוֹרַת יְהוָה
  english_pob_choice: in the Law of Yahweh
  chosen_korean: 야훼의 율법에
  alternatives_korean:
  - 야훼의 가르침에
  - 야훼의 토라에
  lexicon: HALOT
  rationale: 이 역사 서술에서는 תּוֹרָה가 모세 율법을 가리키므로 ‘율법’이 가장 자연스럽고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 렌더링했습니다.
theological_decisions:
- issue: חֲסָדָיו의 신학적 뉘앙스
  chosen_reading: ‘신실한 사랑의 행위’로 옮겨 단순한 도덕적 선행보다 언약적 충성의 의미를 드러냈습니다.
  alternative_readings:
  - 그의 친절한 행위
  - 그의 충성스러운 행위
  - 그의 선행
  rationale: 요시야의 평가 문맥은 단순한 호의가 아니라 야훼와 율법에 대한 언약적 충실성을 가리키므로, 그 긴장을 보존하는 표현을 택했습니다.
