  rationale: קִדְּמוּ עֵינַי אַשְׁמֻרוֹת says literally that the psalmist’s eyes preceded the watches, expressing wakefulness before them; the current wording wrongly suggests wakefulness throughout the watches. “Before the night watches” preserves the temporal image. “To meditate” is preferable to “so that I could meditate,” which adds an explicit purpose/result nuance and unnecessarily shifts the compact Hebrew infinitive phrase.
