lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 인도자에게
  lexicon: HALOT
  rationale: 시 표제에서 이 표현은 음악적 수행을 맡은 책임자에게 주는 지시로 이해하는 것이 자연스러우므로, 기능을 살려 ‘지휘자에게’로 옮겼습니다.
- source_word: מִזְמ֥וֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  lexicon: HALOT
  rationale: 이 단어는 여기서 노래 일반보다 특정한 문학 형식인 시를 가리키므로, 표제의 간결함을 살려 ‘시’로 옮겼습니다.
- source_word: לְדָוִֽד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에 의한
  - 다윗을 위한
  lexicon: HALOT
  rationale: ל의 표제 용법은 저자, 관련성, 헌정의 가능성을 모두 열어 두므로, 영어 POB의 ‘of David’에 맞춰 한국어에서도 소속·관련의 여지를 남기는 ‘다윗의’로 옮겼습니다.
theological_decisions:
- issue: 다윗 표제의 의미 범위
  chosen_reading: ‘다윗의’로 두어 저작, 관련, 헌정의 가능성을 한 번에 열어 둡니다.
  alternative_readings:
  - ‘다윗이 지은’처럼 저작으로 확정
  - ‘다윗을 위한’처럼 헌정으로 확정
  rationale: 히브리어 표제는 이 중 하나로 단정할 근거가 없으므로, 해석적 과잉을 피하고 본문의 의도된 모호성을 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve genuine ambiguity rather than resolve it'
