id: DEU.6.20
reference: Deuteronomy 6:20
source:
  edition: WLC
  text: כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֑ר מָ֣ה הָ/עֵדֹ֗ת וְ/הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֶתְ/כֶֽם־׃
translation:
  text: When your son asks you in time to come, “What is the meaning of the decrees, statutes, and rulings that Yahweh our God commanded you to keep?”
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: When
  alternatives:
  - If
  - For
  lexicon: HALOT
  rationale: Here כִּי introduces a future eventuality in a legal-instructional setting; 'When' fits the expected scenario better than the more conditional 'If' or the explanatory 'For'.
- source_word: יִשְׁאָלְךָ
  chosen: asks you
  alternatives:
  - inquires of you
  - questions you
  lexicon: HALOT
  rationale: The verb שאל commonly means 'ask, inquire.' 'Asks you' is natural modern English and preserves the direct address to the father.
- source_word: בִנְךָ
  chosen: your son
  alternatives:
  - your child
  lexicon: HALOT
  rationale: The Hebrew is explicitly masculine singular. Per gender-accurate policy, 'your son' is retained rather than neutralizing to 'your child'.
- source_word: מָחָר
  chosen: in time to come
  alternatives:
  - tomorrow
  - later
  lexicon: HALOT
  rationale: Although literally 'tomorrow,' in idiomatic contexts like this it refers to the future generally. 'In time to come' captures the idiom in readable English without flattening the temporal sense.
- source_word: לֵאמֹר
  chosen: saying
  alternatives:
  - and says
  - asking
  lexicon: HALOT
  rationale: The infinitive introduces the content of the son's question. 'Saying' is a standard and sufficiently transparent rendering.
- source_word: מָה
  chosen: What is the meaning of
  alternatives:
  - What are
  - What do ... mean
  lexicon: HALOT
  rationale: A wooden 'What are the testimonies...?' is awkward in English. The question clearly asks for significance or explanation, so 'What is the meaning of' expresses the sense while staying close to the source.
- source_word: הָעֵדֹת
  chosen: the testimonies
  alternatives:
  - the decrees
  - the stipulations
  lexicon: HALOT
  rationale: עֵדוֹת is distinct from the following legal terms and often carries the sense of covenantal testimonies/witnessing ordinances. 'Testimonies' preserves that distinctiveness better than collapsing it into a generic legal term.
- source_word: הַחֻקִּים
  chosen: the statutes
  alternatives:
  - the decrees
  - the ordinances
  lexicon: HALOT
  rationale: '''Statutes'' is a standard rendering for חֻקִּים and maintains distinction from both ''testimonies'' and ''judgments.'''
- source_word: הַמִּשְׁפָּטִים
  chosen: the judgments
  alternatives:
  - the rules
  - the ordinances
  lexicon: HALOT
  rationale: מִשְׁפָּטִים often denotes judgments or legal decisions. 'Judgments' preserves the legal nuance and keeps the triad differentiated.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: אֱלֹהֵינוּ
  chosen: our God
  lexicon: HALOT
  rationale: Straightforward possessive construction; 'our God' preserves the covenantal relationship expressed in the Hebrew.
- source_word: צִוָּה ... אֶתְכֶם
  chosen: commanded you
  alternatives:
  - has commanded you
  - commanded you all
  lexicon: HALOT
  rationale: The verb is singular with a 2mp object. English 'you' can represent the plural addressees naturally. Simple past fits the narrative instruction context.
