    For what profit is it [to me], if someone praises me but blasphemes my Lord, not confessing that He was a bearer of flesh? Yet whoever does not affirm this thereby denies Him altogether, being himself a bearer of a corpse.


    But their names, being unbelievers, I have not thought fit to record in writing—nay, far be it from me even to remember them—until they repent[a] and return to the passion, which is our resurrection.'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - Provisional rendering based on the supplied public-domain English witness.
  - The square brackets in “[to me]” are preserved as a restoration signal.
