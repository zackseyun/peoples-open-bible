    ܘܗܢܘܢ ܓܘܡܥܐ ܕܚ̈ܛܗܐ.
    ܘܒܝܫܬܐ ܕܕܡ̈ܘܬܐ
    ܝܬܝܪܐܝܬ ܢܫܘܚܘܢ. ܠܘܩܕܡ
    ܓܝܪ ܚܙܝܢ. ܘܒܬܪܟܢ ܐܙܠܝܢ
    ܕܢܫܬܢܩܘܢ. ܐܝܠܝܢ ܕܝܢ
    ܕܐܬܦܨܝܘ ܒܥ̈ܒܕܝܗܘܢ
    ܘܐܝܠܝܢ ܕܗܘܘ ܠܗܘܢ ܢܡܘܣܐ
    ܢܡܘܣܐ ܣܒܪܐ
    ܘܣܘܟܠܐ ܬܘܟܠܢܐ ܣܘܩܒܝܐ.
    ܘܚܟܡܬܐ ܡܚܡܣܢܘܬܐ.
    ܢܬܚܙܝܢ ܠܗܘܢ ܬܡܝ̈ܗܬܐ
    ܒܙܒܢܗܝܢ. ܚܙܝܢ ܓܝܪ ܗ̇ܘ
    .6 .v ܀ ܒܥܠܡܐ ܕܠܐ ܡܬܚܙܐ
    ܠܗܘܢ. ܘܗܘܐ ܙܒܢܐ ܗ̇ܘ ܕܝܠܗܘܢ
    ܕܗܘܐ ܒܣܝܡ ܡܢܗܘܢ.
    ܘܬܘܒ ܠܐ ܢܥܘܩ ܐܢܘܢ
    ܙܒܢܐ. ܒܡܚ̈ܫܒܬܗܘܢ ܓܝܪ
    ܕܗ̇ܘ ܥܠܡܐ ܢܥ
    ܢܬܦܩܕܘܢ ܓܝܪ ܩܕܡܝܗܘܢ
    ܦܠܝ̈ܛܘܗܝ ܕܦܪܕܝܣܐ܆
    ܘܬܚܘܐ ܠܗܘܢ ܫܘܦܪܐ
    ܕܪܒܘܬܐ ܕܚܝ̈ܐ ܕܐܝܬ
    ܬܚܘܬܝܗ. ܫܒܘܥܘܗܝ
    ܚܒܝ̈ܫܐ ܕܡܠܐܟ̈ܐ ܕܐܚܝܕܝܢ
    ܗܘܘ ܒܡܫܠܛܘ. ܐܢܘܢ
    ܕܠܐ ܢܬܚܙܘܢ. ܘܐܚܝܕܝܢ
    ܒܦܘܩܕܢܐ ܐܝܟ ܕܢܩܘܡܘܢ
    ܒܕܘ̈ܟܝܬܗܘܢ ܥܕܡܐ
    ܕܬܐܬܐ ܡܕܝܢܬܗܘܢ.
    ܘܡܬܚܙܝܐ ܕܝܢ ܬܘܒ
    ܗܝܕܝܢ ܒܕܡܘܬܐ ܝܬܝܪ
    ܡܢ ܕܡܠܐܟ̈ܐ. ܢܩܒܠܘܢ
    ܓܝܪ ܩܕܡܝܐ ܠܐܚܪ̈ܝܐ.
    ܠܗܢܘܢ ܕܡܣܟܝܢ ܗܘܘ
    ܠܗܘܢ. ܘܐܚܪ̈ܝܐ ܠܐܝܠܝܢ
    ܕܫܡܥܝܢ ܗܘܘ ܕܒܓܘܗ.
    ܐܬܦܨܝܘ ܓܝܪ ܡܢ ܗܢܐ
    ܥܠܡܐ ܕܐܘܠܨܢܐ. ܘܐܢܝܚܘ
    ܡܢܗܘܢ ܛܘܥܢܐ ܕܥܩ̈ܬܐ.
    ܒܡܢܐ ܗܟܝܠ ܐܘܒܕܘ
    ܚܝܝ̈ܗܘܢ ܚ̈ܝܝܗܘܢ. ܘ
