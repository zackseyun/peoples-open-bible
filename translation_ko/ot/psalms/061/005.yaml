id: PSA.61.5
reference: Psalms 61:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אֱ֭לֹהִים שָׁמַ֣עְתָּ לִ/נְדָרָ֑/י נָתַ֥תָּ יְ֝רֻשַּׁ֗ת יִרְאֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you, O God, have heard my vows; you have given me[a] the inheritance of those who fear your name[b].
  footnotes:
  - marker: a
    text: The Hebrew leaves 'me' implicit; the context and English grammar require the recipient.
    reason: alternative_reading
  - marker: b
    text: Those who fear God's name live in reverent awe of him.
    reason: cultural_note
translation:
  language: ko
  text: 이는 주님, 제가 드린 서원을 들으셨고, 당신 이름을 경외하는 이들의 유업을 제게 주셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 ... 때문입니다
  alternatives_korean:
  - 왜냐하면 ...
  - '...이므로'
  lexicon: HALOT
  rationale: 이유를 밝히는 קשר는 한국어에서 ‘이는 … 때문입니다’가 가장 자연스럽고, 앞선 진술의 근거를 분명히 유지합니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 오 하나님
  lexicon: HALOT
  rationale: 히브리어 원문은 직접 호칭이지만, 이 구절의 문맥에서 화자가 하나님께 직접 말하는 것으로 자연스럽게 드러나므로 한국어 기도체로는 ‘주님’이 가장 유려합니다.
- source_word: לִנְדָרַי
  english_pob_choice: my vows
  chosen_korean: 제가 드린 서원
  alternatives_korean:
  - 내 서원들
  - 제가 한 서원
  lexicon: HALOT
  rationale: נדר는 단순한 말이 아니라 하나님께 드린 서원을 가리키므로, 한국어에서는 ‘드린’으로 제의적·언약적 성격을 살렸습니다.
- source_word: יְרֻשַּׁת
  english_pob_choice: the inheritance
  chosen_korean: 유업
  alternatives_korean:
  - 기업
  - 상속
  lexicon: HALOT
  rationale: 시편 문맥에서 상속의 개념은 개인 소유보다 하나님이 주시는 몫의 뉘앙스가 강하므로, 성경적 한국어에서 익숙하면서도 정서가 살아 있는 ‘유업’을 택했습니다.
theological_decisions:
- issue: 마지막 절의 수혜자 생략 여부(‘me’의 함의)
  chosen_reading: ‘유업을 제게 주셨습니다’로 수혜자를 명시하되, 문맥상 원문이 직접적으로 수혜 대상을 반복하지 않는 긴장도는 유지합니다.
  alternative_readings:
  - ‘이름을 경외하는 이들의 유업을 주셨습니다’
  - ‘그 유업을 주셨습니다’
  rationale: 히브리어는 영어 POB가 지적하듯 수혜 대상을 명시적으로 적지 않지만, 한국어는 목적어가 없는 ‘주셨습니다’보다 수혜자 ‘제게’를 넣는 것이 문장과 의미를 자연스럽게 완성합니다. 다만 본문 뜻을 넘지 않도록 ‘그들의 유업’으로 재구성하지는 않았습니다.
  doctrine_reference: 원문이 허용하는 범위 안에서 생략을 보완하되, 해석을 과도하게 확정하지 않습니다.
