  - your breath
  rationale: Psalm 139 emphasizes God's exhaustive knowledge and inescapable presence. The parallel with 'your presence' strongly favors a personal divine referent rather than a natural phenomenon. Rendering 'Spirit' preserves the theological weight without importing more than the text states.
