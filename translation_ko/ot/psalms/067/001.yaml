source:
  edition: WLC
  text: אֱלֹהִ֗ים יְחָנֵּ֥/נוּ וִֽ/יבָרְכֵ֑/נוּ יָ֤אֵ֥ר פָּנָ֖י/ו אִתָּ֣/נוּ סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/001.yaml
  text: May God be gracious to us and bless us; may his face shine upon us[a][b]. Selah[c]
  footnotes:
  - marker: a
    text: Or 'with us.' The Hebrew literally says 'with us,' but the idiom is commonly rendered 'shine upon us.'
    reason: lexical_alternative
  - marker: b
    text: This line echoes the priestly blessing in Numbers 6:24–26, especially 'the LORD make his face shine upon you.'
    reason: cross_reference
  - marker: c
    text: '''Selah'' is likely a liturgical or musical notation; its precise meaning is uncertain.'
    reason: cultural_note
translation:
  language: ko
  text: 하나님, 우리에게 은혜를 베푸시고 우리를 복되게 하시며, 주님의 얼굴을 우리에게[a] 비추어 주십시오.[b] 셀라.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리와 함께’입니다. 그러나 ‘얼굴을 비추다’라는 표현에서는 하나님의 은혜가 우리에게 향함을 나타내므로 ‘우리에게’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 민수기 6:24–26의 제사장 축복, 특히 ‘여호와는 그의 얼굴을 네게 비추사’라는 말씀을 떠올리게 합니다.
    reason: cross_reference
  - marker: c
    text: ‘셀라’는 예배 또는 음악과 관련된 표지로 보이나, 정확한 의미는 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 합창 지휘자에게
  - 인도자에게
  lexicon: HALOT
  rationale: 시편 표제의 기능적 용례를 따라, 예배 음악을 맡은 책임자를 가리키는 말로 간결하게 옮겼습니다. '에게'는 표제의 방향성을 살리며, 전통적 '인도자'보다 음악적 역할이 분명합니다.
- source_word: בִּנְגִינֹת
  english_pob_choice: with stringed instruments
  chosen_korean: 현악기에 맞추어
  alternatives_korean:
  - 현악기로
  - 현악기에 맞춰
  - 현악 반주로
  lexicon: HALOT
  rationale: נגינות는 현악기/현악 연주를 가리키므로, 도구성을 살리면서도 자연스러운 한국어 표제로 '현악기에 맞추어'라고 옮겼습니다. 영어 각주처럼 'on/with stringed instruments'의 가능성을 열어 둡니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시편
  alternatives_korean:
  - 한 시편
  - 시
  lexicon: HALOT
  rationale: 장르 표지로서의 מִזְמוֹר은 표준적으로 '시편'으로 옮기는 것이 가장 분명합니다. 앞의 관사를 한국어에서는 별도 표지 없이 처리했습니다.
- source_word: שִׁיר
  english_pob_choice: A song
  chosen_korean: 노래
  alternatives_korean:
  - 한 노래
  - 가락
  lexicon: HALOT
  rationale: מִזְמוֹר와 별도로 이어지는 두 번째 장르 표지를 구분하기 위해 '노래'를 유지했습니다. 두 명칭을 합쳐 하나로 만들지 않고 원문의 이중 표지를 보존했습니다.
