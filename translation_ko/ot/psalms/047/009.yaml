  - 그의 거룩한 왕좌
  lexicon: HALOT
  rationale: ‘כסּא’는 왕권의 좌소이므로 ‘보좌’가 적절하고, ‘거룩한’은 소유격 수식으로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 히브리어 완료형의 시적 기능
  chosen_reading: 과거 사건보다 현재적·공적 선포로 읽어 ‘다스리십니다 / 앉아 계십니다’로 번역했습니다.
  alternative_readings:
  - ‘다스리셨습니다 / 앉으셨습니다’ 같은 완료형 반영
  - ‘왕이 되셨습니다 / 자리에 앉으셨습니다’ 같은 ingressive 강조
  rationale: 이 시편은 하나님의 보편적 왕권을 예배적으로 선포하므로, 한국어에서도 현재형 선언이 원문의 기능을 가장 잘 전달합니다.
  doctrine_reference: 'translation philosophy: optimal-equivalence; poetic perfects as present proclamation'
