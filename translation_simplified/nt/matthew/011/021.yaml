translation:
  language: en
  text: Woe to you, Chorazin! Woe to you, Bethsaida! If the miracles done among you had happened in Tyre and Sidon, their people would have repented[b] long ago, wearing sackcloth and sitting in ashes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sackcloth and ashes were signs of mourning and repentance.
    reason: cultural_note
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
