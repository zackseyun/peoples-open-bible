id: JOB.34.6
reference: Job 34:6
source:
  edition: WLC
  text: עַל מִשְׁפָּטִ֥/י אֲכַזֵּ֑ב אָנ֖וּשׁ חִצִּ֣/י בְלִי פָֽשַׁע־־׃
translation:
  text: Would I lie about being in the right[a]? My arrow wound is incurable[b], though I have not transgressed.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “Despite being in the right, I am considered a liar.”
    reason: alternative_reading
  - marker: b
    text: Literally, “my arrow is incurable.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  chosen: concerning
  alternatives:
  - about
  - against
  - despite
  lexicon: HALOT
  rationale: 'With אכזב (''I lie''/''I am counted a liar'') and משפטי (''my right/case''), על is best taken in the sense ''concerning/about'' rather than a more spatial or adversative sense. This yields a coherent rhetorical question: ''Should I lie concerning my right?''.'
- source_word: מִשְׁפָּטִי
  chosen: my right
  alternatives:
  - my judgment
  - my case
  - my justice
  lexicon: HALOT
  rationale: מִשפט can denote legal judgment, justice, or one's legal right/case. In Job's self-defense context, 'my right' is concise modern English that preserves the juridical sense without sounding overly technical. 'My case' is possible and preserved as an alternative nuance.
- source_word: אֲכַזֵּב
  chosen: Would I lie
  alternatives:
  - I am counted a liar
  - I lie
  - shall I be false
  lexicon: HALOT
  rationale: The active form can be rendered as a rhetorical question in context; the difficult alternative construal should remain noted.
- source_word: אָנ֖וּשׁ
  chosen: is incurable
  alternatives:
  - is desperate
  - is grievous
  - is mortal
  lexicon: HALOT
  rationale: From אנשׁ, the adjective conveys something incurable or desperately sick. Applied to חצי ('my wound/arrow'), 'is incurable' best communicates the severity idiomatically in English.
- source_word: חִצִּי
  chosen: my arrow
  alternatives:
  - my arrow
  - my wound from the arrow
  lexicon: HALOT
  rationale: The literal image should remain in the text; “wound” is an interpretive contextual explanation.
- source_word: בְלִי
  chosen: though there is no
  alternatives:
  - without
  - apart from there being
  - with no
  lexicon: HALOT
  rationale: 'בלי introduces absence: ''without/no.'' In idiomatic English linked to the prior clause, ''though there is no'' clearly expresses the concessive force implied by the context.'
- source_word: פָשַׁע
  chosen: transgression
  alternatives:
  - rebellion
  - offense
  - wrongdoing
  lexicon: HALOT
  rationale: פשע often denotes transgression or rebellion, especially moral breach against God. 'Transgression' preserves the moral-legal weight better than the more generic 'wrongdoing'.
- source_word: בְלִי פָשַׁע
  chosen: though I have not transgressed
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The compressed phrase means “without transgression”; this supplies the implied first-person subject from the speaker’s protest.
