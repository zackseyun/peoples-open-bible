id: PSA.88.11
reference: Psalms 88:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/יְסֻפַּ֣ר בַּ/קֶּ֣בֶר חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ בָּ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/011.yaml
  text: Is your steadfast love declared in the grave, your faithfulness in Abaddon[a]?
  footnotes:
  - marker: a
    text: Or “in destruction” or “in the place of destruction.” Hebrew “Abaddon” is a poetic term for the realm of ruin or death.
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 한결같은 사랑이 무덤에서 선포되겠습니까? 주의 신실하심이 아바돈[a]에서 선포되겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파멸’ 또는 ‘파멸의 곳’. 히브리어 ‘아바돈’은 파멸 또는 죽음의 영역을 가리키는 시적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלַמֵּתִים
  english_pob_choice: for the dead
  chosen_korean: 죽은 자들을 위하여
  alternatives_korean:
  - 죽은 이들을 위하여
  - 죽은 자를 향하여
  lexicon: HALOT
  rationale: הֲ와 לַ의 결합이 ‘~를 위하여/향하여’라는 수사적 질문을 이루므로, ‘죽은 자들’을 자연스러운 복수로 옮겼습니다.
- source_word: תַּעֲשֶׂה פֶּלֶא
  english_pob_choice: do you work wonders
  chosen_korean: 기이한 일들을 행하십니까
  alternatives_korean:
  - 놀라운 일들을 행하십니까
  - 기적을 행하십니까
  lexicon: HALOT
  rationale: פֶּלֶא는 단순한 ‘기적’보다 하나님의 놀라운 행위를 넓게 가리키므로, ‘기이한 일들’로 옮겨 의미 범위를 보존했습니다.
- source_word: רְפָאִים
  english_pob_choice: the departed spirits
  chosen_korean: 떠난 영들
  alternatives_korean:
  - 그림자 같은 죽은 자들
  - 레파임
  lexicon: HALOT
  rationale: 시적 문맥에서 스올의 죽은 자들을 가리키는 표현이므로, ‘영들’을 써서 비가시적/저승적 뉘앙스를 살리고 ‘레파임’의 전문용어성은 본문이 아니라 각주로 처리했습니다.
- source_word: יוֹדוּךָ
  english_pob_choice: to praise you
  chosen_korean: 주를 찬양합니까
  alternatives_korean:
  - 주께 감사합니까
  - 주를 높입니까
  lexicon: HALOT
  rationale: ידה의 감사·찬양 의미 가운데 여기서는 예배적 평행법에 맞는 ‘찬양하다’를 택했습니다.
theological_decisions:
- issue: רְפָאִים의 번역이 저승의 죽은 자를 어떻게 드러낼지
  chosen_reading: ‘떠난 영들’로 옮겨 죽은 자들의 비인격적·저승적 상태를 암시합니다.
  alternative_readings:
  - ‘그림자들’
  - ‘죽은 자들’
  - ‘레파임’ 음역
  rationale: 시편의 수사학은 죽은 자들이 하나님을 찬양할 수 없음을 강조하므로, 현대 독자가 즉시 이해하면서도 사후 세계에 대한 세부 교리를 과도하게 단정하지 않는 표현을 선택했습니다.
  doctrine_reference: 시적 평행법과 스올 이미지 보존
- issue: 수사적 질문의 형식
  chosen_reading: 두 문장을 모두 의문문으로 유지해, 죽은 자에게는 하나님의 기이한 일과 찬양이 없다는 절망적 논지를 드러냅니다.
  alternative_readings:
  - 서술문으로 완화
  - 조건문처럼 해석
  rationale: 히브리어의 두 질문은 대답을 기대하기보다 부정적 수사 효과를 내므로, 한국어에서도 의문 형식을 유지해야 본문의 탄식이 보존됩니다.
  doctrine_reference: 시편 탄식시의 수사적 질문
