id: DASC.002
reference: 'Didascalia Apostolorum — Chapter 2: Teaching every man that he should please his wife alone; and that he should not adorn himself and become a cause of stumbling to women; and that he should not love idleness; and that he should occupy himself with the Scriptures of life, and avoid profane writings and the bonds of the Second Legislation; and that he should not bathe in a bath with women; and that he should not give himself to the vice of harlots.'
