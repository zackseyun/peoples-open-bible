  from: Then King Zedekiah sent and had him brought[a], and the king questioned him privately in his house, and said, “Is there any word from Yahweh?” Jeremiah said, “There is.” Then he said[b], “You will be given into the hand of the king of Babylon.”
  to: Then King Zedekiah sent for Jeremiah and had him brought to his palace, where he asked him in secret, “Is there any word from Yahweh?” “There is,” Jeremiah replied. “You will be handed over to the king of Babylon.”
  rationale: The lexical deliberation already recognized that the king ordered Jeremiah’s retrieval and that “hand” denotes power. I carry those meanings directly into the text, retain the terse “There is,” and follow the standing ruling to use “Yahweh.”
