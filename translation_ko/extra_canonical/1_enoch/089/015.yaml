  lexicon: cast + little ones
  rationale: 문맥상 짐승의 새끼를 가리키므로 '새끼들'이 가장 직접적이며, '던지다'는 잔혹한 투기를 그대로 드러냅니다.
- source_word: በውኂዘ፡ ማይ፡ ብዙኅ፡
