translation:
  language: ko
  text: 그가 그들에게 말했습니다. “여러분이 제가 제 죽은 이를 제 앞에서 치우기 위해 묻는 것을 원하신다면, 내 말을 들으시고 나를 위하여 소할의 아들 에브론에게 부탁해 주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
