  yaml_path: translation/ot/judges/004/003.yaml
  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: ko
  text: 그때 이스라엘 자손이 야훼께[a] 부르짖었습니다. 그에게는 철 병거가 아홉백 대가 있었고, 그는 이십 년 동안 이스라엘 자손을 혹독하게 억눌렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצְעֲקוּ ... אֶל יְהוָה
  english_pob_choice: cried out to the LORD
  chosen_korean: 야훼께 부르짖었습니다
  alternatives_korean:
  - 주님께 외쳤습니다
  - 여호와께 부르짖었습니다
  lexicon: יהוה
  rationale: 본문의 יְהוָה는 하나님의 고유명으로, 프로젝트 기본값에 따라 학술적 음역인 ‘야훼’를 사용했습니다. ‘부르짖다’는 संकट/압제 상황에서의 절박한 호소를 살립니다.
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  english_pob_choice: nine hundred iron chariots
  chosen_korean: 철 병거가 아흔두 대가 있었고
  alternatives_korean:
  - 철 병거가 아흔 대가 있었고
  - 철제 병거가 아흔두 대가 있었고
  lexicon: מספר + רכב ברזל
  rationale: ‘תְּשַׁע מֵאוֹת’는 수사 900이므로 ‘아흔두’로 반영했고, ‘רֶכֶב בַּרְזֶל’은 전투수단인 ‘철 병거’로 옮겼습니다. ‘대’는 한국어에서 병거 수량을 자연스럽게 받는 단위를 보충한 것입니다.
- source_word: וְהוּא לָחַץ ... בְּחָזְקָה
  english_pob_choice: he oppressed ... harshly
  chosen_korean: 그는 이십 년 동안 이스라엘 자손을 혹독하게 억눌렀습니다
  alternatives_korean:
  - 그는 ... 강하게 압박했습니다
  - 그는 ... 세게 눌렀습니다
  lexicon: לָחַץ + בְּחָזְקָה
  rationale: לָחַץ는 단순한 압박보다 억압·압제를 뜻하므로 ‘억눌렀습니다’로 옮겼고, בְּחָזְקָה는 POB의 ‘harshly’에 맞춰 ‘혹독하게’로 표현했습니다. 20년은 압제의 지속 기간으로 문장 뒤에 붙였습니다.
theological_decisions:
- issue: 야훼 호칭의 직역 여부
  chosen_reading: 본문의 יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 기본 원칙에 따라 원문 고유명성과 고대 이스라엘의 언약적 호칭을 가려내기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 출 3:15; 시 83:18
