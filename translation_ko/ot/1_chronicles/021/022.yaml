  source_fidelity: 원문의 명령형 요청과 목적/결과 구문, 오르난이라는 인명, 타작마당의 특정 부지, 야훼께 드릴 제단, 그리고 재앙이 백성 위에서 그치기를 바라는 뜻을 보존했습니다. מַגֵּפָה는 문맥상 넓은 의미의 ‘재앙’으로 옮길 수 있습니다.
  naturalness: 초안의 ‘온전한 값으로 주십시오’는 현대 한국어에서 대가를 지불하는 관계가 다소 불분명하고 어색합니다. ‘제값을 받고 내게 주십시오’가 ‘full price’와 거래 관계를 자연스럽게 드러냅니다. 마지막 절도 ‘재앙이 백성에게서 멈출 것입니다’보다 청원의 목적을 나타내는 표현이 더 자연스럽습니다.
  terminology: ‘타작마당’, ‘제단’, ‘야훼’, ‘재앙’은 적절합니다. יהוה는 초안의 표기 정책을 유지했습니다. 내용상 필요한 주석이 아니므로 오르난의 이름을 설명하는 임의의 주석 표지는 삭제합니다.
