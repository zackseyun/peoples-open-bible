translation:
  text: '“The seventh mountain had green, cheerful plants. The whole mountain flourished. Every kind of
    livestock and the birds of heaven grazed on its plants. The plants they ate grew even more lush. Its
    believers are like this:


    2. “They were always sincere, innocent and blessed. They held nothing against each other. They always
    rejoiced over God’s servants. They were clothed in the holy spirit of these virgins.[a] They always
    had compassion for everyone. From their labors, they provided for everyone without reproaching them
    or hesitating.”


    3. “The Lord saw their sincerity and complete childlike innocence.[b] He made them prosper in the
    work of their hands and gave them favor in everything they did.”


    4. “I am the messenger of repentance. I tell you who are like this to remain so. Your offspring will
    never be wiped out. The Lord tested you and enrolled you in our number. All your offspring will live
    with the Son of God, for you have received from his spirit.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: The source links the singular holy spirit with the allegorical virgins. The clothing and virgins
      imagery is retained; lowercase presentation here does not decide a later doctrinal identification.
      Some letters in this phrase are restored in damaged Greek.
  - marker: b
    reason: textual_variant
    text: '“Childlike innocence” follows Gebhardt’s printed conjecture, compared with the two Latin traditions
      and9.29.1. Athos is reported as “gentleness”; Ethiopic is uncertain in the apparatus. Alternative:
      “When the Lord saw their sincerity and complete gentleness, he made them prosper in the work of
      their hands and granted them favor in all they did.”'
  - marker: c
    reason: textual_variant
    text: 'The final “spirit” is Anger’s printed conjecture, compared with Latin Vulgata, Palatina and
      Ethiopic. Athos is reported as “seed.” Alternative: “All your offspring will dwell with the Son
      of God, for you have received from his seed.” The object of “received” is unstated; neither fuller
      Greek agreement nor a specific theory of spiritual descent is claimed.'
lexical_decisions:
- source_word: μετάνοια / μετανοεῖν
  chosen: repentance / repent
  alternatives:
  - regret
  - penance
  rationale: Context requires altered conduct, including abandoning grudges or pride. Preserve conditions
    and the stated life/death consequences.
- source_word: σπέρμα
  chosen: offspring
  alternatives:
  - seed
  - descendants
  rationale: Preserve the progeny image and promise without deciding whether its scope is biological or
    spiritual.
- source_word: τοῦ πνεύματος αὐτοῦ (printed conjecture)
  chosen: his spirit
  alternatives:
  - his seed (reported Athos)
  rationale: Provisional retention of the declared working choice; the full alternative and edition-mediated
    evidence remain explicit.
- source_word: ἐχαρίτωσεν
  chosen: granted them favor
  alternatives:
  - bestowed grace
  rationale: Retain favor in their activities without recasting the passage as a mechanically earned payment.
