  from: And they rose up against them from the ambush and killed them[a]; and many fell wounded, and the rest fled to the mountain[b], and they took all their equipment.
  to: They sprang from their ambush and attacked and killed them. Many fell wounded, and the rest fled to the mountain; Jonathan and his men took all their belongings.
