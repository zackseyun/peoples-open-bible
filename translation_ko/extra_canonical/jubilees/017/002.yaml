revisions:
- from: 그러자 주님께서 그에게 “아브라함아 아브라함아”라고 말씀하셨습니다. 그리고 그는 “내가 여기 있습니다.”라고 말했습니다. 그리고 주님께서는 “네 사랑하는 아들 이삭을 데리고 높은 곳으로 가서 내가 네게 지시하는 한 산에서 그를 드리라”고 말씀하셨습니다. 그리고 그는 아침에 일찍 일어나 당나귀에 안장을 지우고 두 종과 그의 아들 이삭을 데리고 갔다. 그리고 그는 제물의 나무를 쪼개어 제 삼일에 그 곳에 가다가 그 곳을 멀리서 보았습니다. 그가 우물에 이르러 그의 종들에게 이르되 당나귀와 함께 여기 있으라 나와 아이는 계속 가다가 예배한 후에 너희에게로 돌아오리라 하고 그리고 그는 희생의 나무를 가져다가 그의 아들 이삭에게 지우고 자기 손에는 불과 칼을 들고 있었습니다. 그리고 두 사람은 함께 그 곳으로 갔습니다.
