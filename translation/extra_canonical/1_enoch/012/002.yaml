translation:
  text: And all his work[a] was with the Watchers, and his days were with the holy ones.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “All” follows the printed Geʿez, but Charles marks this word as corrupt. His proposed correction would remove the explicit sense of “all”; the wording here retains the printed reading rather than silently correcting it.
    reason: textual_variant
lexical_decisions:
- source_word: ኵሉ፡ ግብሩ
  chosen: all his work
  alternatives:
  - all his deeds
  - all his activity
  rationale: Preserves the comprehensive force of ኵሉ and the singular, collective sense of ግብሩ.
- source_word: ምስለ
  chosen: with
  alternatives:
  - among
  rationale: Keeps the relational wording repeated in both clauses.
- source_word: ትጉሃን
  chosen: Watchers
  alternatives:
  - wakeful ones
  - vigilant ones
  rationale: Retains the established designation for these beings in 1 Enoch without replacing it with a judgment about them.
- source_word: ቅዱሳን
  chosen: holy ones
  alternatives:
  - saints
  - holy beings
  rationale: Preserves the designation without implying that the referents are human.
- source_word: መዋዕለ፡ ዚአሁ
  chosen: his days
  alternatives:
  - the days of his life
  rationale: Preserves the concrete plural 'days' rather than paraphrasing it as a lifetime.
theological_decisions:
- issue: Relationship between the Watchers and the holy ones
  chosen_reading: Retain both designations in parallel without identifying or separating their referents.
  alternative_readings:
  - They are two names for the same beings.
  - They are distinct groups.
  rationale: The verse states Enoch’s association with each but does not settle whether the groups overlap.
