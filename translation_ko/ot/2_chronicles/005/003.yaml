  text: And all the men of Israel assembled before the king at the feast, that is, in the seventh month.
translation:
  language: ko
  text: 이스라엘의 모든 사람이 그 절기, 곧 일곱째 달에 왕에게 모였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  english_pob_choice: assembled
  chosen_korean: 모였는데
  alternatives_korean:
  - 집결했는데
  - 모여들었는데
  lexicon: קהל / assemble
  rationale: 단순한 ‘모이다’보다 공동체가 한곳에 공식적으로 모이는 뉘앙스를 살리되, 한국어 문장 흐름은 자연스럽게 유지했습니다.
- source_word: אֶל הַמֶּלֶךְ
  english_pob_choice: before the king
  chosen_korean: 왕에게
  alternatives_korean:
  - 왕 앞에
  - 왕 앞으로
  lexicon: אֶל + מלך
  rationale: ‘before’의 장소적 방향을 살릴 수 있으나, 본문은 왕을 중심으로 한 집합 장면이어서 한국어에서는 ‘왕에게’로 간결하게 옮겼습니다.
- source_word: בֶּחָג
  english_pob_choice: at the feast
  chosen_korean: 그 절기
  alternatives_korean:
  - 그 명절
  - 그 잔치
  lexicon: חג
  rationale: חג는 단순한 잔치보다 절기/축제의 종교적·공적 맥락이 강하므로 ‘절기’가 더 직접적입니다.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  english_pob_choice: that is, in the seventh month
  chosen_korean: 즉 일곱째 달이었습니다
  alternatives_korean:
  - 곧 일곱째 달입니다
  - 이는 일곱째 달이었습니다
  lexicon: הוא + החודש השביעי
  rationale: 영어 POB의 ‘that is’에 맞춰 설명 동격을 분명히 했고, 절기와 달의 대응을 독자가 바로 이해하도록 했습니다.
theological_decisions:
- issue: 절기와 일곱째 달의 동격 설명 방식
  chosen_reading: ‘그 절기, 즉 일곱째 달’로 옮겨 달력 정보가 절기의 설명임을 드러냈습니다.
  alternative_readings:
  - ‘그 절기인 일곱째 달’
  - ‘곧 일곱째 달인 그 절기’
  rationale: 본문은 특정 절기를 정의하기보다, 그 모임이 ‘절기’와 ‘일곱째 달’이라는 두 방식으로 지시됨을 병렬적으로 보여줍니다.
  doctrine_reference: 본문 해석상 동격 관계의 명료화
- issue: ‘before the king’의 공간적 표현
  chosen_reading: 왕 앞에라는 직역 대신 ‘왕에게’로 자연스럽게 풀었습니다.
  alternative_readings:
  - 왕 앞에
  - 왕 앞으로
  rationale: 히브리어 전치사는 방향성을 지니지만, 한국어에서는 집합 대상이 왕임을 드러내는 표현이 더 읽기 자연스럽습니다.
  doctrine_reference: 서사 문체의 자연성
