id: PSA.62.9
reference: Psalms 62:9
source:
  edition: WLC
  text: אַ֤ךְ הֶ֥בֶל בְּנֵֽי אָדָם֮ כָּזָ֪ב בְּנֵ֫י אִ֥ישׁ בְּ/מֹאזְנַ֥יִם לַ/עֲל֑וֹת הֵ֝֗מָּה מֵ/הֶ֥בֶל יָֽחַד׀־׃
translation:
  text: Surely those of low rank are a breath; those of high rank are a lie. On the scales they rise; together they are lighter than a breath.
  philosophy: dynamic
lexical_decisions:
- source_word: אַךְ
  chosen: Surely
  alternatives:
  - Only
  - Indeed
  lexicon: HALOT
  rationale: אַךְ often marks emphasis or assertion in Psalms. 'Surely' preserves the emphatic force in natural English better than the more wooden 'only' here.
- source_word: הֶבֶל
  chosen: a breath
  alternatives:
  - vanity
  - vapor
  lexicon: HALOT
  rationale: הֶבֶל denotes something fleeting, insubstantial, or empty. 'A breath' captures the image concretely and avoids the archaic or potentially misleading 'vanity.' The same imagery is retained later in the verse for consistency.
- source_word: בְּנֵי אָדָם
  chosen: those of low estate
  alternatives:
  - men of low degree
  - humankind
  - the sons of man
  lexicon: HALOT
  rationale: Paired with 'sons of man,' this idiom denotes ordinary or low-status people.
- source_word: כָּזָב
  chosen: a lie
  alternatives:
  - falsehood
  - deception
  lexicon: HALOT
  rationale: The noun denotes falsehood or unreliability. 'A lie' is concise and forceful, matching the parallel with 'a breath' and preserving the psalm's stark evaluation of human status.
- source_word: בְּנֵי אִישׁ
  chosen: those of high estate
  alternatives:
  - men of high degree
  - human beings
  - the sons of men
  lexicon: HALOT
  rationale: In the established poetic pair, this phrase contrasts people of rank with commoners.
- source_word: בְּמֹאזְנַיִם
  chosen: In the balances
  alternatives:
  - On the scales
  - in a balance
  lexicon: HALOT
  rationale: The dual noun refers to weighing scales. 'In the balances' is idiomatic enough while preserving the image of being weighed.
- source_word: לַעֲלוֹת
  chosen: they go up
  alternatives:
  - they rise
  - they are weighed
  lexicon: HALOT
  rationale: The infinitive of עלה literally means 'to go up/rise.' In the weighing metaphor, the image is that they rise in the scales because they are weightless. 'They go up' preserves the metaphor more directly than the interpretive 'they are weighed.'
- source_word: מֵהֶבֶל
  chosen: lighter than a breath
  alternatives:
  - from a breath
  - than vanity
  lexicon: HALOT
  rationale: With the comparative sense in context, the phrase expresses that they are even less substantial than breath. Rendering it as 'lighter than a breath' makes the weighing metaphor explicit in English while remaining faithful to the Hebrew sense.
- source_word: יָחַד
  chosen: together
  alternatives:
  - altogether
  - as one
  lexicon: HALOT
  rationale: יָחַד indicates collective totality. 'Together' fits the poetic line and communicates that the judgment applies to all alike.
