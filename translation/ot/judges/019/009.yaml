id: JDG.19.9
reference: Judges 19:9
source:
  edition: WLC
  text: וַ/יָּ֤קָם הָ/אִישׁ֙ לָ/לֶ֔כֶת ה֥וּא וּ/פִילַגְשׁ֖/וֹ וְ/נַעֲר֑/וֹ וַ/יֹּ֣אמֶר ל֣/וֹ חֹתְנ֣/וֹ אֲבִ֣י הַֽ/נַּעֲרָ֡ה הִנֵּ֣ה נָא֩ רָפָ֨ה הַ/יּ֜וֹם לַ/עֲרֹ֗ב לִֽינוּ נָ֞א הִנֵּ֨ה חֲנ֤וֹת הַ/יּוֹם֙ לִ֥ין פֹּה֙ וְ/יִיטַ֣ב לְבָבֶ֔/ךָ וְ/הִשְׁכַּמְתֶּ֤ם מָחָר֙ לְ/דַרְכְּ/כֶ֔ם וְ/הָלַכְתָּ֖ לְ/אֹהָלֶֽ/ךָ־׃
translation:
  text: When the man rose to leave with his concubine and his attendant, his father-in-law, the young woman's father, said to him, “Look, the day is waning toward evening. Please stay the night. Look, the day is nearly over[a]. Spend the night here and enjoy yourself. Then rise early tomorrow for your journey, and go home[b].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the day is encamping,” an image of the day settling down or coming to an end.
    reason: lexical_alternative
  - marker: b
    text: Literally, “go to your tent,” a conventional expression for going home.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  chosen: the man
  alternatives:
  - the husband
  lexicon: HALOT
  rationale: אִישׁ is the ordinary term for 'man.' In context this refers to the Levite/husband figure, but 'the man' preserves the narrative style without importing a more specific relational label not used here.
- source_word: פִילַגְשׁוֹ
  chosen: his concubine
  alternatives:
  - his secondary wife
  lexicon: HALOT
  rationale: The standard sense is 'concubine.' This is the established social-legal category in the narrative and should not be softened to 'wife' alone.
- source_word: נַעֲרוֹ
  chosen: his attendant
  alternatives:
  - his servant
  - his young man
  lexicon: HALOT
  rationale: The term denotes the traveler's servant or attendant in this context; age is not the point of the clause.
- source_word: חֹתְנוֹ
  chosen: his father-in-law
  alternatives:
  - his relation by marriage
  lexicon: HALOT
  rationale: In this context the relational meaning is clearly father-in-law, confirmed by the apposition 'the young woman's father.'
- source_word: אֲבִי הַנַּעֲרָה
  chosen: the young woman’s father
  alternatives:
  - the girl's father
  lexicon: HALOT
  rationale: נַעֲרָה denotes a young woman/maiden. 'Young woman' is more natural and appropriate in English than 'girl' for this context.
- source_word: הִנֵּה נָא
  chosen: Look
  alternatives:
  - Look now
  lexicon: HALOT
  rationale: As a discourse marker, 'Look' is direct and natural; the pleading particle is carried by the following 'Please.'
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  chosen: the day is waning toward evening
  alternatives:
  - the day has slackened toward evening
  - the day is declining toward evening
  lexicon: HALOT
  rationale: The phrase presents daylight weakening as evening approaches. 'Waning' preserves the image naturally.
- source_word: לִינוּ נָא
  chosen: Please stay the night
  alternatives:
  - Please lodge
  - Please spend the night
  lexicon: HALOT
  rationale: לון means to lodge/spend the night. 'Stay the night' is natural modern English and fits the hospitable appeal.
- source_word: חֲנוֹת הַיּוֹם
  chosen: the day is nearly over
  alternatives:
  - the day is drawing to a close
  - the day is encamping
  lexicon: HALOT
  rationale: The unusual image depicts the day settling down. The main line states the temporal meaning, while the source image remains footnoted.
- source_word: לִין פֹּה
  chosen: Spend the night here
  alternatives:
  - Lodge here
  - Stay here tonight
  lexicon: HALOT
  rationale: A second imperative of לון. 'Spend the night here' is clear and avoids awkward repetition while preserving the invitation.
- source_word: וְיִיטַב לְבָבֶךָ
  chosen: let your heart be glad
  alternatives:
  - let your heart be merry
  - and it will be well with your heart
  lexicon: HALOT
  rationale: The idiom refers to inward cheer or gladness. 'Let your heart be glad' preserves the Hebrew imagery without sounding archaic.
- source_word: וְהִשְׁכַּמְתֶּם מָחָר
  chosen: Then rise early tomorrow
  alternatives:
  - Then tomorrow you may rise early
  lexicon: HALOT
  rationale: The plural form addresses the traveling group and carries imperative force in the host's proposal.
- source_word: לְדַרְכְּכֶם
  chosen: for your journey
  alternatives:
  - for your way
  - on your road
  lexicon: HALOT
  rationale: '''For your journey'' is idiomatic English for setting out on one''s way.'
- source_word: וְהָלַכְתָּ לְאֹהָלֶךָ
  chosen: and go home
  alternatives:
  - and go to your tent
  lexicon: HALOT
  rationale: Although literally 'to your tent,' the expression conventionally means returning home; the narrative locates the traveler in a house, not a tent.
