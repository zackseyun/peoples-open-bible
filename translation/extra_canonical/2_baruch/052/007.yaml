  rationale: Even when evaluating this as a translation of 51:3 (the actual source
    text here), 'awake' mistranslates the Syriac 'nštbḥ b-šwḥlp'' (will be glorified
    in transformations), and 'shine' mistranslates 'nšthlp' (will be changed).
