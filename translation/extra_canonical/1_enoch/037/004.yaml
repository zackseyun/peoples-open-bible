  meaning: Enoch says that he has now received wisdom from the Lord of Spirits according to his understanding and the Lord’s will, and that the Lord has given him a share in eternal life.
  meaning_decisions:
  - source_phrase: እስከ፡ ይእዜ፡ ኢተውህበኒ፡ እምቅድመ፡ እግዚአ፡ መንፈሳት፡ ዘነሣእኩ፡ ጥበብ
    prior_rendering: Until now, the wisdom I have received had not been given to me from the presence of the Lord of Spirits
    new_rendering: Not until now was I given this wisdom from the presence of the Lord of Spirits. I received it
    rationale: The negative with “until now” is understood as marking the arrival of this gift, rather than denying its divine source. Splitting the sentence clarifies that relationship without adding a claim about greater wisdom.
  - source_phrase: በከመ፡ ኃለይኩ፡ በከመ፡ ፈቀደ፡ እግዚአ፡ መንፈሳት
    prior_rendering: as I considered, as the Lord of Spirits willed
    new_rendering: according to my understanding and the will of the Lord of Spirits
    rationale: The two parallel expressions are rendered as qualifications of Enoch’s reception of wisdom. The connection with his own thought remains uncertain and is acknowledged in the footnote.
  - source_phrase: ዘተውህበኒ፡ እምኔሁ፡ ክፍለ፡ ሕይወት፡ ዘለዓለም
    prior_rendering: from whom a share of eternal life was given to me
    new_rendering: who has given me a share in eternal life
    rationale: The active construction makes the Lord’s role as giver explicit, while “a share in” conveys participation in eternal life.
  footnote_kinds:
    a: alternative_meaning
  history_weighed: The earlier rendering rightly preserved the negative and avoided supplying an explicit comparison about greater wisdom. Its warning about difficult syntax remains important, but the restored ending clearly identifies the Lord of Spirits as the giver of Enoch’s share in eternal life.
