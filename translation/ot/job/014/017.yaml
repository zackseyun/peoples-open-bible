id: JOB.14.17
reference: Job 14:17
source:
  edition: WLC
  text: חָתֻ֣ם בִּ/צְר֣וֹר פִּשְׁעִ֑/י וַ֝/תִּטְפֹּ֗ל עַל עֲוֺנִֽ/י־׃
translation:
  text: My transgression would be sealed up in a bag, and you would cover over my iniquity[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'Alternatively, as a present complaint: “My transgression is sealed up in a bag, and you add to my iniquity.” On this reading the bag preserves the offenses; the final Hebrew verb is uncertain.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָתֻם
  chosen: sealed up
  alternatives:
  - sealed
  - bound up
  lexicon: HALOT
  rationale: Passive participle from חתם conveys something closed and secured with a seal. 'Sealed up' preserves the passive/resultative sense and fits the image of sins being stored away.
- source_word: בִּצְרוֹר
  chosen: in a bag
  alternatives:
  - in a bundle
  - in a pouch
  lexicon: HALOT
  rationale: צְרוֹר denotes a wrapped bundle, pouch, or bag. 'Bag' is natural modern English and preserves the concrete image of something tied up and kept.
- source_word: פִּשְׁעִי
  chosen: my transgression
  alternatives:
  - my rebellion
  - my offense
  lexicon: HALOT
  rationale: פֶּשַׁע often carries the sense of transgression or rebellion. 'Transgression' is the most established and suitably weighty rendering here, while avoiding over-interpretation toward overt revolt in this poetic context.
- source_word: וַתִּטְפֹּל
  chosen: you cover over
  alternatives:
  - you plaster over
  - you sew up
  - you fasten over
  lexicon: HALOT
  rationale: The verb טפל is difficult here and has been understood as attaching, plastering, or covering over. In context with the preceding image of sealing sins away, 'you cover over' best communicates the likely sense that God adds a covering over Job's iniquity, while remaining readable and not overly technical. The more literal possibilities are preserved in a footnote because the exact nuance is debated.
- source_word: עַל
  chosen: over
  alternatives:
  - upon
  - to
  lexicon: HALOT
  rationale: With טפל, עַל naturally suggests something applied or laid over something else. 'Over' fits the imagery in idiomatic English.
- source_word: עֲוֺנִי
  chosen: my iniquity
  alternatives:
  - my guilt
  - my wrongdoing
  lexicon: HALOT
  rationale: עָוֹן can denote iniquity, guilt, or the consequences of guilt. 'Iniquity' preserves the moral weight and keeps distinction from פֶּשַׁע in the first colon; 'guilt' is possible but narrows the term.
- source_word: חָתֻם בִּצְרוֹר פִּשְׁעִי
  chosen: My transgression would be sealed up in a bag
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The sealed-bag image is retained while the English modal form carries forward the conditional discourse.
- source_word: וַתִּטְפֹּל עַל עֲוֺנִי
  chosen: and you would cover over my iniquity
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: “Cover over” preserves a viable broad sense for the difficult verb without deciding between competing concrete images.
