  rationale: 'The verse clearly evokes God''s deliverance through the waters, but the Hebrew text itself states the image poetically rather than naming the event. Preserving the imagery maintains the psalm''s theological tension: God truly acts in history, yet his traces remain beyond human grasp.'
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
