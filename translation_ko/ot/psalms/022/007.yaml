  terminology: ‘조롱하다’는 ילעגו의 경멸적 비웃음을 적절히 옮기며, ‘머리를 흔들다’는 ינועו ראש의 통상적 경멸 제스처를 보존합니다. יפטירו בשפה는 정확한 제스처의 세부 의미가 논쟁적이므로, 본문에서는 ‘입술을 내밀다’로 옮기고 각주에서 대안을 보존합니다.
