  to: 예수께서 나다나엘이 예수께로 다가오는 것을 보시고, 그를 두고 말씀하셨습니다. “보십시오, 참으로 속임수가 없는 이스라엘 사람입니다.”
  rationale: 예수를 가리키는 목적어의 지시 대상을 명확히 하고, 서술 문체를 현대 표준 합쇼체로 다듬었습니다. ‘참으로’, ‘이스라엘 사람’, ‘속임수’ 및 주의 환기 명령형을 유지하여 원문의 의미와 강조를 보존했습니다.
