translation:
  language: ko
  text: 그 다음 날에 요한은 다시 서 있었고, 그의 제자들 가운데 두 사람이 그와 함께 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον πάλιν
  english_pob_choice: On the next day / again
  chosen_korean: 그 다음 날에 다시
  alternatives_korean:
  - 다음 날
  - 이튿날에
  - 그 다음 날 다시
  lexicon: BDAG
  rationale: τῇ ἐπαύριον(문장절 관형구)은 '다음 날'의 시간적 관용을 이루고, πάλιν은 이전 장면의 반복을 표시합니다. 한국어에서는 '그 다음 날에 다시'가 시간성과 반복을 자연스럽게 전달합니다.
- source_word: εἱστήκει
  english_pob_choice: was standing there
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 서 있었다
  - 서 있다
  lexicon: BDAG
  rationale: εἱστήκει는 상태적 과거(서 있는 상태)를 나타내므로, 계속적·상태적 뉘앙스를 살려 '서 있었습니다'로 처리했습니다.
- source_word: ὁ Ἰωάννης
  english_pob_choice: John
  chosen_korean: 요한
  alternatives_korean:
  - 요한(세례자)
  - 세례 요한
  lexicon: BDAG
  rationale: 그리스어 원문은 단순히 이름만 제공하므로 원문 충실성을 위해 '요한'으로 번역하고, '세례자'라는 수식어는 덧붙이지 않았습니다.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  english_pob_choice: two of his disciples were with him
  chosen_korean: 그의 제자들 가운데 두 사람이 그와 함께 있었습니다
  alternatives_korean:
  - 제자들 중 두 사람
  - 그의 제자들 중에서 두 사람이 있었다
  lexicon: BDAG
  rationale: ἐκ는 부분(partitive)을 나타내므로 한국어의 '가운데/중' 표현으로 부분성을 살렸고, 영어와 마찬가지로 원문이 동사를 온전하게 갖추지 않아 '있었습니다'를 보충하여 자연스러운 판문을 만들었습니다.
theological_decisions:
- issue: '확정적 식별어(예: ''세례자'')의 추가 여부'
  chosen_reading: 원문을 확장하지 않고 '요한'으로 번역
  alternative_readings:
  - 요한 세례자
  - 세례 요한
  rationale: 본문은 단순히 이름만 제시하므로 '세례자'라는 식별어를 덧붙이면 원문에 없는 정보의 추가가 됩니다. POB의 원칙인 '저자가 청중에게 전달하려 한 것을 유지'하기 위해 확장을 피했습니다.
  doctrine_reference: 'translation principle: source-text fidelity'
