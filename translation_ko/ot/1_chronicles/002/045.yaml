  source_fidelity: 원문의 계보 연결 וּ, ‘샴마이의 아들’, 마온의 반복, 그리고 אֲבִי(‘아버지’)의 족보 표현을 보존해야 합니다. 초안의 ‘시므’는 שַׁמַּי(Shammai)에 해당하지 않는 인명 표기입니다. 또한 본문의 ‘조상’은 가능한 넓은 함의를 선취하여 אֲבִי의 기본 뜻인 ‘아버지’를 약화합니다.
