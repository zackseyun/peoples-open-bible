id: T12P.GAD.6.3
reference: Testament of Gad 6:3
unit: verse
book: Testament of Gad
collection: Testaments of the Twelve Patriarchs
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '3. Ἀγαπήσατε¹⁷ ἀλλήλους ἀπὸ καρδίας, καὶ ἐάν τις¹⁸ *ἁμαρτήσει εἰς σέ¹⁹, [α-text] εἰπὲ αὐτῷ εἰρήνην²⁰, καὶ ἐν τῇ ψυχῇ σου μὴ κρατήσῃς δόλον· καὶ ἐὰν μετανοήσας ὁμολογήσῃ²¹, ἄφες αὐτῷ²². [β, Α, S¹] εἰπὲ αὐτῷ *ἐν εἰρήνῃ²³, ἐξορίσας τὸν ἰὸν τοῦ μίσους, καὶ²⁴ ἐν τῇ²⁵ ψυχῇ σου μὴ κρατήσῃς δόλον· καὶ ἐὰν *ὁμολογήσας μετανοήσῃ²⁶ *ἄφες αὐτῷ²⁷.'
  language: Greek
translation:
  text: Love one another from the heart; and if anyone sins against you, speak peace to him, and in your soul hold no deceit; and if he confesses and reorients[r1], forgive him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
