  from: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
  to: Jacob replied, “My lord knows that the children are delicate, and that the flocks and herds with nursing young are under my care. If they are driven too hard for even one day, the whole flock will die.”
  rationale: I retained the documented interpretation of nursing young and responsibility resting on Jacob. Small refinements distinguish excessive driving from ordinary travel and express the children’s vulnerability without implying sickness.
