translation:
  language: ko
  text: 하나님이여, 제게 은혜를 베풀어 주십시오. 제게 은혜를 베풀어 주십시오. 제 영혼이 주님 안에 피하였으니,[a] 주님의 날개 그늘 아래에서 제가 피하겠습니다. 재앙들이 지나갈 때까지.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘제 영혼’은 문맥에 따라 ‘제 생명’ 또는 ‘저 자신’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 복수형으로, ‘파괴적인 재앙들’ 또는 ‘파멸들’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
