id: PSA.42.10
reference: Psalms 42:10
source:
  edition: WLC
  text: בְּ/רֶ֤צַח בְּֽ/עַצְמוֹתַ֗/י חֵרְפ֥וּ/נִי צוֹרְרָ֑/י בְּ/אָמְרָ֥/ם אֵלַ֥/י כָּל הַ֝/יּ֗וֹם אַיֵּ֥ה אֱלֹהֶֽי/ךָ׀־׃
translation:
  text: My adversaries' taunts are like a deadly wound in my bones[a], as they say to me all day long, “Where is your God?”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'with murder in my bones'; the difficult expression depicts mortal pain penetrating to the bones.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֶצַח
  chosen: Like a deadly wound
  alternatives:
  - With murder
  - As with a crushing
  - Like a deadly wound
  lexicon: HALOT
  rationale: רֶצַח normally denotes murder or slaying. In conjunction with “in my bones,” “a deadly wound” gives natural English for the violent comparison while the note preserves the unusual Hebrew form.
- source_word: בְּעַצְמוֹתַי
  chosen: in my bones
  alternatives:
  - to my bones
  lexicon: HALOT
  rationale: The phrase locates the pain/reproach at the deepest bodily level. 'In my bones' is idiomatic English and preserves the Hebrew image of inward, penetrating anguish.
- source_word: חֵרְפוּנִי
  chosen: taunt me
  alternatives:
  - reproach me
  - mock me
  - insult me
  lexicon: HALOT
  rationale: The verb חרף conveys reproach or scorn. 'Taunt me' fits the immediate context of hostile speech ('Where is your God?') and communicates active verbal derision in natural English.
- source_word: צוֹרְרַי
  chosen: my adversaries
  alternatives:
  - my enemies
  - my foes
  lexicon: HALOT
  rationale: The participial form from צרר denotes those hostile to the psalmist. 'Adversaries' is slightly broader and less flattened than 'enemies,' while still clear and natural.
- source_word: בְּאָמְרָם
  chosen: saying
  alternatives:
  - when they say
  - as they say
  lexicon: HALOT
  rationale: The preposition with infinitive/construct-like form introduces the content or circumstance of the taunt. 'Saying' is concise and natural in English, with the temporal nuance carried by context.
- source_word: אֵלַי
  chosen: to me
  alternatives:
  - against me
  lexicon: HALOT
  rationale: The preposition אֶל here marks direction of speech. 'To me' is the straightforward rendering.
- source_word: כָּל הַיּוֹם
  chosen: all day long
  alternatives:
  - all the day
  - continually
  lexicon: HALOT
  rationale: This idiom expresses ongoing repetition. 'All day long' is natural modern English and preserves the durative force.
- source_word: אַיֵּה אֱלֹהֶיךָ
  chosen: Where is your God?
  alternatives:
  - Where then is your God?
  lexicon: HALOT
  rationale: A direct challenge to the reality or help of the psalmist's God. The simple rendering preserves the force and rhetorical sting without embellishment.
