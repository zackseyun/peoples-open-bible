  from: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
  to: For calamity from God[a] was a terror to me, and because of his majesty I was powerless.[b]
  rationale: The first clause is sound, with the construct relation appropriately clarified in a note. In the second, מִן is naturally causal, but “I could not endure” supplies an unexpressed object and suggests bearing God's majesty. “I was powerless” gives idiomatic English for the absolute לֹא אוּכָל while preserving the unstated complement and Job's inability to commit the acts under discussion.
