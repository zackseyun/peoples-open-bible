id: PSA.89.30
reference: Psalms 89:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יַֽעַזְב֣וּ בָ֭נָי/ו תּוֹרָתִ֑/י וּ֝/בְ/מִשְׁפָּטַ֗/י לֹ֣א יֵלֵכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/030.yaml
  text: If his sons abandon my law and do not walk in my judgments[a][b],
  footnotes:
  - marker: a
    text: Or 'do not walk according to my ordinances.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my instruction.' The Hebrew torah can denote teaching or instruction as well as law; here 'law' is chosen because of the parallel with 'my judgments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그의 아들들이 나의 율법[a]을 버리고 나의 법규[b]대로 행하지 않는다면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나의 가르침’. 히브리어 토라(תּוֹרָה)는 율법뿐 아니라 가르침이나 교훈을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나의 규례를 따라’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  english_pob_choice: I will establish
  chosen_korean: 세우겠습니다
  alternatives_korean:
  - 정하겠습니다
  - 두겠습니다
  - 견고하게 하겠습니다
  lexicon: HALOT
  rationale: ‘שׂים’의 기본 뜻은 ‘두다/놓다’이지만, 왕조와 후손에 대한 언약적 약속에서는 ‘세우다’가 안정시키고 확립한다는 힘을 자연스럽게 드러냅니다.
- source_word: זַרְעוֹ
  english_pob_choice: his offspring
  chosen_korean: 그의 씨
  alternatives_korean:
  - 그의 자손
  - 그의 후손
  - 그의 씨앗
  lexicon: HALOT
  rationale: 히브리어 זֶרַע는 집합적·언약적 의미가 강해 ‘씨’가 원문의 압축성과 계보적 울림을 가장 직접적으로 살립니다.
- source_word: לָעַד
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  - 영원토록
  lexicon: HALOT
  rationale: 지속성과 영속을 나타내는 לָעַד는 현대 한국어에서 ‘영원히’가 가장 분명하고 자연스럽습니다.
- source_word: כִּימֵי שָׁמַיִם
  english_pob_choice: as the days of heaven
  chosen_korean: 하늘들의 날들처럼
  alternatives_korean:
  - 하늘의 날들처럼
  - 하늘이 있는 날처럼
  - 하늘이 지속되는 동안처럼
  lexicon: HALOT
  rationale: כִּימֵי는 비교를 나타내므로 ‘처럼’을 살리고, שָׁמַיִם의 복수형을 반영해 문자적으로는 ‘하늘들의 날들’로 옮겨 시적 긴장과 원문 이미지를 보존했습니다.
theological_decisions:
- issue: ‘하늘들의 날들’이라는 시적 비교를 자연스러운 한국어로 얼마나 풀어쓸지
  chosen_reading: 원문의 비교 구조를 유지한 채 다소 낯설더라도 ‘하늘들의 날들처럼’으로 옮겼습니다.
  alternative_readings:
  - ‘하늘이 지속되는 동안처럼’
  - ‘하늘이 있는 한처럼’
  rationale: 본문은 왕조의 지속성을 우주적 시간감각으로 비유하므로, 의미를 풀어 약화시키기보다 시적 긴장을 보존하는 것이 더 स्रोत 충실적입니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
