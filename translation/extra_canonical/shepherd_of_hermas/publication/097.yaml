  text: Ἐκ δὲ τοῦ ὄρους τοῦ τρίτου τοῦ ἔχοντος ἀκάνθας καὶ τριβόλους οἱ πιστεύσαντες τοιοῦτοί εἰσιν· οἱ
    μὲν πλούσιοι, οἱ δὲ πραγματείαις πολλαῖς ἐμπεφυρμένοι. οἱ μὲν τρίβολοί εἰσιν οἱ πλούσιοι, αἱ δὲ ἄκανθαι
    οἱ ἐν ταῖς πραγματείαις ταῖς ποικίλαις ἐμπεφυρμένοι. 2. οὗτοι [οὖν, οἱ ἐν πολλαῖς καὶ ποικίλαις πραγματείαις
    ἐμπεφυρμένοι, οὐ] κολλῶνται τοῖς δούλοις τοῦ Θεοῦ, ἀλλ᾿ ἀποπλανῶνται πνιγόμενοι ὑπὸ τῶν πράξεων αὐτῶν·
    οἱ δὲ πλούσιοι δυσκόλως κολλῶνται τοῖς δούλοις τοῦ Θεοῦ, φοβούμενοι μή τι αἰτιαθῶσιν ἀπ᾿ αὐτῶν· οἱ
    τοιοῦτοι οὖν δυσκόλως εἰσελεύσονται εἰς τὴν βασιλείαν τοῦ Θεοῦ. 3. ὥσπερ γὰρ ἐν τριβόλοις γυμνοῖς
    ποσὶ περιπατεῖν δύσκολόν ἐστιν, οὕτω καὶ τοῖς τοιούτοις δύσκολον ἐστιν εἰς τὴν βασιλείαν τοῦ Θεοῦ
    εἰσελθεῖν. 4. ἀλλὰ τούτοις πᾶσι μετάνοιά ἐστι, ταχυνὴ δέ, ἵν᾿ ὃ τοῖς προτέροις χρόνοις οὐκ εἰργάσαντο,
    νῦν ἀναδράμωσιν τὰς ἡμέρας καὶ ἀγαθόν τι ποιήσωσιν. | ἐὰν οὖν μετανοήσωσι καὶ ἀγαθόν τι ποιήσωσι,
    | ζήσονται τῷ Θεῷ· ἐὰν δὲ ἐπιμείνωσι ταῖς πράξεσιν αὐτῶν, παραδοθήσονται ταῖς γυναιξὶν ἐκείναις, αἵτινες
    αὐτοὺς θανατώσουσιν.
