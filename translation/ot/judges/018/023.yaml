  category: meaning_retranslation
  from: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
  to: They called out to the Danites, who turned around and said to Micah, “What is the matter with you, that you have gathered these men[a]?”
  rationale: The prior rendering understood the final verb as another reference to shouting. Its immediate connection with the mustering in verse 22 supports a question about Micah’s assembled company, while the recorded outcry interpretation remains a serious alternative.
