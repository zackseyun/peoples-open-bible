  from: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
  to: Surely our adversary has been cut off[a], and fire has consumed their remnant.[b]
  rationale: The received pointing and singular passive verb support a singular rendering for the difficult קִימָנוּ; the prior plural “our adversaries have” unnecessarily regularizes the form. “Their remnant” is a direct rendering of יתרם and honestly retains the Hebrew’s shift to a plural suffix. The note rightly identifies the first expression as difficult rather than treating the construal as certain.
