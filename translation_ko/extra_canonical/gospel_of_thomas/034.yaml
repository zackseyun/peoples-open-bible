base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/034.yaml
  text: Jesus said, “If a blind person leads a blind person, both of them fall down into a pit.”
  footnotes:
  - marker: fall
    text: The Coptic uses the aorist tense (ϣⲁⲩϩⲉ), which expresses a habitual or gnomic reality ('they habitually fall'), contrasting with the future tense ('will fall') found in the Synoptic parallel (Matthew 15:14).
    reason: textual_variant
  - marker: leads
    text: Literally 'draws before him' (ⲥⲱⲕ ϩⲏⲧϥ), a Coptic idiom for leading or guiding.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “눈먼 사람이 눈먼 사람을 이끌면, 둘 다 구덩이에 빠집니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ⲥⲱⲕ ϩⲏⲧ는 문자적으로 ‘앞으로 끌다’에 가깝지만, 관용적으로 ‘이끌다’ 또는 ‘인도하다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 콥트어 ϣⲁⲩϩⲉ는 단순 미래가 아니라 일반적·격언적 현재를 나타내므로, 한국어 현재형으로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲃⲗⲗⲉ
  english_pob_choice: blind person
  chosen_korean: 맹인
  alternatives_korean:
  - 눈먼 사람
  - 시각장애인
  lexicon: Crum 38b
  rationale: 콥트어 명사는 성별을 특정하지 않는 일반 명사이므로, 인물 유형을 그대로 드러내는 ‘맹인’이 간결하고 원문에 충실합니다.
- source_word: ⲥⲱⲕ ϩⲏⲧ
  english_pob_choice: leads
  chosen_korean: 이끌면
  alternatives_korean:
  - 끌어 가면
  - 인도하면
  lexicon: Crum 326b
  rationale: 직역하면 ‘앞으로 끌다/이끌다’의 관용구로, 한국어에서는 ‘이끌다’가 가장 자연스럽게 지도·인도 의미를 살립니다.
- source_word: ϣⲁⲩϩⲉ
  english_pob_choice: fall
  chosen_korean: 빠집니다
  alternatives_korean:
  - 떨어집니다
  - 넘어집니다
  lexicon: Crum 651a
  rationale: 이 형태는 단회 미래보다 일반적·격언적 현재에 가깝기 때문에, 한국어 현재형 ‘빠집니다’로 속담적 진술을 살렸습니다.
- source_word: ⲉⲟⲩϩⲓⲉⲓⲧ
  english_pob_choice: pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 웅덩이
  - 함정
  lexicon: Crum 736b
  rationale: 문맥상 사람을 빠뜨리는 실제 ‘pit’이므로, 한국어에서는 ‘구덩이’가 가장 직접적이고 평이합니다.
theological_decisions:
- issue: 격언적 현재의 표현
  chosen_reading: ‘둘 다 구덩이에 빠집니다’로 현재형 격언을 유지했습니다.
  alternative_readings:
  - ‘둘 다 구덩이에 빠질 것입니다’로 미래형으로 옮길 수 있습니다.
  rationale: 콥트어의 gnomic aorist는 반복적·보편적 진실을 말하므로, 미래보다 현재형이 원문의 일반 진술 효과를 더 잘 전달합니다.
  doctrine_reference: 본문은 교리 진술이 아니라 지혜격언입니다.
