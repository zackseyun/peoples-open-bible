id: PSA.77.4
reference: Psalms 77:4
source:
  edition: WLC
  text: אָ֭חַזְתָּ שְׁמֻר֣וֹת עֵינָ֑/י נִ֝פְעַ֗מְתִּי וְ/לֹ֣א אֲדַבֵּֽר׃
translation:
  text: You have kept my eyes from closing; I am troubled and cannot speak.
  philosophy: dynamic
lexical_decisions:
- source_word: אָחַזְתָּ
  chosen: You have held
  alternatives:
  - You seized
  - You grasped
  - You kept
  lexicon: HALOT
  rationale: Qal perfect 2ms of אחז, addressed to God in context. 'Held' fits the idiom with the following object better than the more abrupt 'seized,' while preserving divine agency.
- source_word: שְׁמֻרוֹת עֵינָי
  chosen: my eyes from closing
  alternatives:
  - the watches of my eyes
  - the guards of my eyes
  - my eyes' watchings
  lexicon: HALOT
  rationale: The rendering communicates the contextual idiom of enforced wakefulness without falsely identifying the phrase as an anatomical term for eyelids.
- source_word: נִפְעַמְתִּי
  chosen: I am troubled
  alternatives:
  - I am agitated
  - I am disturbed
  - I am dismayed
  lexicon: HALOT
  rationale: Niphal 1cs of פעם here conveys inner agitation or disturbance. 'Troubled' is idiomatic, readable, and broad enough to preserve the emotional intensity without over-specifying whether the sense is terror, shock, or restlessness.
- source_word: וְלֹא אֲדַבֵּר
  chosen: and cannot speak
  alternatives:
  - and I do not speak
  - and I will not speak
  lexicon: HALOT
  rationale: Although formally 'and I do not speak,' in context the line expresses inability caused by distress rather than simple refusal or habitual silence. 'Cannot speak' captures the likely force in natural English.
