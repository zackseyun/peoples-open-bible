  meaning: Unlike the enduring holy ones, sinners and the lawless loved a passing day of participation in sin and desired what was fleeting and decaying.
  meaning_decisions:
  - source_phrase: οἱ ἠγάπησαν ἡμέραν ἐν μετοχῇ ἁμαρτίας αὐτῶν
    prior_rendering: who loved a day of sharing in their sin
    new_rendering: who loved a day spent sharing in their sin
    rationale: The added 'spent' clarifies that the day is a brief span of participation in sin, while retaining both the temporal image and the verb 'loved,' which contrasts with loving God in verse 1.
  - source_phrase: ἐν μικρότητι σαπρίας ἡ ἐπιθυμία αὐτῶν
    prior_rendering: their desire lay in the brevity of corruption
    new_rendering: their desire was for what is fleeting and decaying
    rationale: The contrast with everlasting life supports short duration, while decay names the corruptible character of what they desire; the new wording conveys both without the opaque abstraction 'brevity of corruption.'
