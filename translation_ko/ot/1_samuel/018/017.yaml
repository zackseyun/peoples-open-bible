revisions:
- from: 그때 사울이 다윗에게 말했습니다. “보십시오, 내 큰딸 메랍을 내가 당신에게 아내로 주겠습니다. 다만 당신은 나를 위해 용맹한 사람이 되어 야훼의 전쟁들을 싸우십시오.” 사울이 이렇게 말한 것은 “내 손이 그에게 대하지 않게 하고, 블레셋 사람들의 손이 그에게 대하게 하려는 것”이었습니다.[a]
  to: 그때 사울이 다윗에게 말했습니다. “보십시오, 내 큰딸 메랍을 내가 당신에게 아내로 주겠습니다. 다만 당신은 나를 위해 용맹한 사람이 되어 야훼의 전쟁들을 치르십시오.” 사울은 말했습니다. “내 손은 그를 해치지 않고, 블레셋 사람들의 손이 그를 해치게 하리라.”
  rationale: 마지막 문장의 ‘손’ 관용구를 한국어에서 분명한 ‘해치다’로 옮겨 사울이 직접 다윗을 해치지 않고 블레셋 사람들을 통해 그를 해치려 한다는 대조를 보존했습니다. 또한 ‘전쟁들을 치르십시오’로 자연스러운 현대 한국어를 사용하면서 히브리어 복수형을 유지했습니다. 기존 주석은 번역 이해에 필수적이지 않아 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:26:37Z'
