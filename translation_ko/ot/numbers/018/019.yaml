    rationale: 각주는 יָרִימוּ(‘들어 올리다’)의 제의적 의미를 설명하지만 본문 표지가 마지막 문장 끝에 있어 독자가 ‘소금 언약’을 주석 대상으로 오해할 수 있습니다.
