revisions:
- from: 사람이 부유해질 때, 그의 집의 영광이 늘어날 때도 두려워하지 마십시오.[a]
  to: 이는 그가 죽을 때 아무것도[a] 가져가지 못하며, 그의 영광[b]도 그를 따라 내려가지[c] 않기 때문입니다.
  rationale: 원문 כִּי를 앞 문맥에 대한 이유를 나타내는 ‘이는 ... 때문입니다’로 옮겼습니다. בְּמוֹתוֹ는 ‘그가 죽을 때’, 부정 아래의 הַכֹּל은 ‘아무것도’, כְּבוֹדוֹ는 ‘그의 영광’으로 번역했습니다. יֵרֵד와 אַחֲרָיו의 하강·추종 이미지는 ‘그를 따라 내려가지’로 보존했으며, 목적지를 특정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:09:45Z'
