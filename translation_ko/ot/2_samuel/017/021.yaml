id: 2SA.17.21
reference: 2 Samuel 17:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י אַחֲרֵ֣י לֶכְתָּ֗/ם וַֽ/יַּעֲלוּ֙ מֵֽ/הַ/בְּאֵ֔ר וַ/יֵּ֣לְכ֔וּ וַ/יַּגִּ֖דוּ לַ/מֶּ֣לֶךְ דָּוִ֑ד וַ/יֹּאמְר֣וּ אֶל דָּוִ֗ד ק֣וּמוּ וְ/עִבְר֤וּ מְהֵרָה֙ אֶת הַ/מַּ֔יִם כִּי כָ֛כָה יָעַ֥ץ עֲלֵי/כֶ֖ם אֲחִיתֹֽפֶל׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/021.yaml
  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: ko
  text: 그들이 떠난 뒤, 우물에서 올라와 가서 다윗 왕에게 알렸습니다. 그들은 다윗에게 말했습니다. 「일어나 물을 급히 건너가십시오. 아히도벨이 여러분에게 불리하게 이렇게 조언했습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ מֵהַבְּאֵר
  english_pob_choice: they came up out of the well
  chosen_korean: 우물에서 올라와
  alternatives_korean:
  - 우물에서 나와
  - 우물에서 올라가
  lexicon: WLC עָלָה / בְּאֵר
  rationale: 히브리어 동작 순서를 살려 ‘올라와’로 옮기되, 현대 한국어에서 자연스럽게 읽히도록 ‘우물에서’와 결합했습니다.
- source_word: וַיַּגִּדוּ לַמֶּלֶךְ דָּוִד
  english_pob_choice: and went and told King David
  chosen_korean: 가서 다윗 왕에게 알렸습니다
  alternatives_korean:
  - 가서 다윗 왕에게 보고했습니다
  - 가서 다윗 왕에게 전했습니다
  lexicon: WLC נגד / מֶלֶךְ דָּוִד
  rationale: 왕에게 소식을 전달한다는 의미를 담아 ‘알렸습니다’를 택했고, דוד는 한국어 성서 관용에 따라 ‘다윗’으로 옮겼습니다.
- source_word: קוּמוּ וְעִבְרוּ מְהֵרָה אֶת הַמַּיִם
  english_pob_choice: Get up and cross over the water quickly
  chosen_korean: 일어나 물을 급히 건너가십시오
  alternatives_korean:
  - 일어나 물을 빨리 건너십시오
  - 일어나 물을 서둘러 건너가십시오
  lexicon: WLC קוּם / עָבַר / מְהֵרָה
  rationale: 명령형의 긴박함을 살려 ‘급히’로 옮겼고, ‘cross over the water’는 강이나 물길을 건너는 상황을 한국어로 자연스럽게 표현했습니다.
- source_word: אֲחִיתֹפֶל עֲלֵיכֶם
  english_pob_choice: this is what Ahithophel has advised against you
  chosen_korean: 아히도벨이 바로 당신을 해하려고 이렇게 조언했습니다
  alternatives_korean:
  - 아히도벨이 당신에게 이렇게 조언했습니다
  - 아히도벨이 당신을 향해 이렇게 조언했습니다
  lexicon: WLC יָעַץ + עַל
  rationale: עַל이 ‘~을 향하여/against’의 대립적 방향을 띠는 점을 살려 단순 중립적 ‘에게’보다 의도를 분명히 드러냈습니다.
theological_decisions:
- issue: 아히도벨의 조언을 번역할 때 ‘against you’의 적대성을 어떻게 드러낼지
  chosen_reading: ‘당신을 해하려고’로 옮겨, 단순한 조언이 아니라 다윗을 해치는 방향의 계책임을 드러냈습니다.
  alternative_readings:
  - ‘당신을 반대하여’
  - ‘당신에게 불리하게’
  rationale: 본문의 עֲלֵיכֶם은 중립적 정보 전달이 아니라 다윗을 겨냥한 계략임을 암시하므로, 한국어에서도 그 대립성을 명시하는 편이 원문 효과를 보존합니다.
  doctrine_reference: 서사 문맥상 정치적·군사적 적대 표현의 직역 원칙
