id: SIR.18.21
reference: Sirach 18:21
source:
  edition: lxx-swete-1909
  text: πρὶν ἀρρωστῆσαί σε ταπεινώθητι, καὶ ἐν καιρῷ ἁμαρτημάτων δεῖξον ἐπιστροφήν.
  language: Greek
  pages:
  - 681
  - 694
  - 695
