theological_decisions:
- issue: Scope of the 430 years in relation to Egypt alone or to a broader patriarchal sojourn
  chosen_reading: 'Provisionally retain the Masoretic wording: the residence of the sons of Israel in Egypt was 430 years. Confidence in earliest-wording priority is low.'
  alternative_readings:
  - The Samaritan Hebrew control includes the fathers and places Canaan before Egypt.
  - The Rahlfs Greek edition places Egypt before Canaan without the fathers; other Greek witnesses include the fathers, including Alexandrinus after Canaan in the Cambridge apparatus.
  rationale: The Samaritan Hebrew is direct-language evidence, not a translation subordinate to the Masoretic base by language alone. Adding Canaan and the fathers could clarify the chronology; loss from a hypothetical longer ancestor is also possible. Neither mechanism is established. In 2Q2 the geography is supplied; 4Q14 excludes Canaan after Egypt locally but cannot exclude it or the fathers in the missing beginning. These fragments cannot establish the entire Egypt-only form. Retention is provisional, not proof of Masoretic priority or a harmonization of biblical chronology. See docs/EXODUS_12_40_SOURCE_ADJUDICATION_2026-09-06.md for the distinct geographical, fathers and numeral units.
  doctrine_reference: Preserve textual uncertainty and theological tension; original-language primacy does not imply automatic Masoretic priority.
