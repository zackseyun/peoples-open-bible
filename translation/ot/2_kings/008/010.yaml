theological_decisions:
- issue: Rendering the difficult clause לא חיה תחיה
  chosen_reading: Provisionally retain POB's positive recovery message as a use of the attested Hebrew qere, while disclosing the negative ketiv without treating it as grammatically or contextually impossible.
  alternative_readings:
  - The formal qere has לו (‘to him’) and leaves the recovery statement positive.
  - The ketiv has לא (‘not’) and makes the recovery statement negative.
  rationale: Both Hebrew forms are explicit in the vendored edition. The negative ketiv is grammatically coherent and agrees with the following death announcement; it makes Hazael's positive report in verse 14 a changed message. The qere preserves a positive instruction alongside the death revelation. Recovery from illness versus death through a subsequent act is one possible explanation; a deceptive instruction or selective report is another. These are interpretive alternatives, not additional surviving Hebrew words or grounds to adjust a prophet's morality. POB's existing positive wording is retained provisionally without settling historical priority.
  doctrine_reference: Translation philosophy §§1, 3, 5; Contested terms table for יְהוָה
