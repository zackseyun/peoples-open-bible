- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Rendering divine נָחַם
  chosen_reading: relent
  alternative_readings:
  - change my mind
  - repent
  - be sorry
  rationale: To preserve orthodox theological clarity and the Hebrew idiom, 'relent' communicates cessation of announced judgment without suggesting moral error or sin in God. This preserves the text's force while avoiding misleading English implications of 'repent.'
