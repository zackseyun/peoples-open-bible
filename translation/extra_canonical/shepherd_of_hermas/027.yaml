id: HERM.M.2
reference: Shepherd of Hermas — Mandate 2
unit: section
book: Shepherd of Hermas
source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Λέγει μοι· Ἁπλότητα ἔχε καὶ ἄκακος γίνου καὶ ἔσῃ ὡς τὰ νήπια τὰ μὴ γινώσκοντα τὴν πονηρίαν τὴν
    ἀπολλύουσαν τὴν ζωὴν τῶν ἀνθρώπων. 2. πρῶτον μὲν μηδενὸς καταλάλει, μηδὲ ἡδέως ἄκουε καταλαλοῦντος·
    εἰ δὲ μή, καὶ σὺ ὁ ἀκούων ἔνοχος ἔσῃ τῆς ἁμαρτίας τοῦ καταλαλοῦντος, ἐὰν πιστεύσῃς τῇ καταλαλίᾳ ᾗ
    ἂν ἀκούσῃς· πιστεύσας γὰρ καὶ σὺ αὐτὸς ἕξεις κατὰ τοῦ ἀδελφοῦ σου. οὕτως οὖν ἔνοχος ἔσῃ τῆς ἁμαρτίας
    τοῦ καταλαλοῦντος. 3. πονηρὰ ἡ καταλαλία, ἀκατάστατον δαιμόνιόν ἐστιν, μηδέποτε εἰρηνεῦον, ἀλλὰ πάντοτε
    ἐν διχοστασίαις κατοικοῦν. ἀπέχου οὖν ἀπ’ αὐτοῦ, καὶ εὐθηνίαν πάντοτε ἕξεις μετὰ πάντων. 4. ἔνδυσαι
    δὲ τὴν σεμνότητα, ἐν ᾗ οὐδὲν πρόσκομμά ἐστιν πονηρόν, ἀλλὰ πάντα ὁμαλὰ καὶ ἱλαρά. ἐργάζου τὸ ἀγαθόν,
    καὶ ἐκ τῶν κόπων σου, ὧν ὁ Θεὸς δίδωσίν σοι, πᾶσιν ὑστερουμένοις δίδου ἁπλῶς, μὴ διστάζων τίνι δῷς
    ἢ τίνι μὴ δῷς. πᾶσιν δίδου· πᾶσιν γὰρ ὁ Θεὸς δίδοσθαι θέλει ἐκ τῶν ἰδίων δωρημάτων. 5. οἱ οὖν λαμβάνοντες
    ἀποδώσουσιν λόγον τῷ Θεῷ, διατί ἔλαβον καὶ εἰς τί· οἱ μὲν γὰρ λαμβάνοντες θλιβόμενοι οὐ δικασθήσονται,
    οἱ δὲ ἐν ὑποκρίσει λαμβάνοντες τίσουσιν δίκην. 6. ὁ οὖν διδοὺς ἀθῷός ἐστιν· ὡς γὰρ ἔλαβεν παρὰ τοῦ
    Κυρίου τὴν διακονίαν τελέσαι, ἁπλῶς αὐτὴν ἐτέλεσεν, μηθὲν διακρίνων τίνι δῷ ἢ μὴ δῷ. ἐγένετο οὖν ἡ
    διακονία αὕτη ἁπλῶς τελεσθεῖσα ἔνδοξος παρὰ τῷ Θεῷ. ὁ οὖν οὕτως ἁπλῶς διακονῶν τῷ Θεῷ ζήσεται. 7.
    φύλασσε οὖν τὴν ἐντολὴν ταύτην, ὥς σοι λελάληκα, ἵνα ἡ μετάνοιά σου καὶ τοῦ οἴκου σου ἐν ἁπλότητι
    εὑρεθῇ, καὶ ἡ καρδία [σου] καθαρὰ καὶ ἀμίαντος.
  language: Greek
  pages:
  - 334
  - 335
  unit_id: M.2
  label: Mandate 2
  sequence: 27
translation:
  text: 'II.1. He says to me: Have simplicity[q], and become guileless, and you will be like the little
    ones who do not know the wickedness that destroys the life of human beings.


    II.2. First of all, slander no one[f], and do not listen with pleasure to someone who slanders; otherwise
    you too, the hearer, will be guilty of the slanderer’s sin if you believe the slander you hear. For
    by believing it, you yourself also will have something against your brother[g]. Thus you will be guilty
    of the slanderer’s sin.


    II.3. Slander is evil; it is a restless demon[c], never at peace, but always dwelling amid divisions.
    So keep away from it, and you will always have well-being with all[a].


    II.4. But clothe yourself with dignity[d], in which there is no evil stumbling block, but all things
    are smooth and cheerful[r]. Do what is good, and from your labors, which God gives you, give simply
    to all who are in need[e], not hesitating as to whom you should give or to whom you should not give.
    Give to all[j], for God wants everyone to receive from his own gifts[o].


    II.5. Therefore those who receive will render an account to God why they received and for what; for
    those who receive while afflicted will not be judged, but those who receive in hypocrisy will pay
    the penalty[k].


    II.6. Therefore the one who gives is innocent[p]; for just as he received from the Lord the ministry
    to carry out[h], he carried it out simply, making no distinction as to whom he should give or not
    give. Thus this ministry, having been carried out simply, became glorious before God[i]. Therefore
    the one who thus ministers simply to God will live[n].


    II.7. So keep this commandment, as I have spoken to you, so that your repentance[b] and that of your
    household may be found in simplicity[m], and [your] heart clean and unstained[l].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Well-being renders euthēnia, also prosperity or flourishing. With all remains unqualified; it
      is not reduced to material wealth or one relationship. Vulgata printed37 instead has peace with
      your brother, Palatina printed73 quiet among all, and the Ethiopic edition’s mediated Latin printed128
      enduring joy. Sinaiticus27.3 has present have in the first hand and future have in ca; the selected
      future remains.
    reason: lexical_alternative
  - marker: b
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: c
    text: Demon retains daimonion and the earlier personified framing; evil spirit is an alternative.
      Restless, never at peace and always amid divisions all remain. Sinaiticus27.3 corrects the spelling
      of demon in ca; that correction is not a second manuscript. The selected description is not replaced
      with a psychological explanation.
    reason: lexical_alternative
  - marker: d
    text: Dignity retains semnotēs, also gravity or reverent seriousness, with the clothing image. Vulgata
      printed37 instead has holy constancy; Palatina printed73 expands into temperance, reverence and
      modesty. The Ethiopic edition’s Latin rendering printed128 has purification wording. Those versional
      differences are not silently inserted into the selected Greek virtue.
    reason: lexical_alternative
  - marker: e
    text: Give simply retains haplōs, also generously, with the paragraph’s single-heartedness theme rather
      than only the size of a gift. All who are in need, the labor God gives, and both to-give and not-to-give
      alternatives remain. The Latin versions retain giving but their first gift-sorting instruction does
      not express every selected alternative. No prudential exception is added to the main text.
    reason: lexical_alternative
  - marker: f
    text: Slander retains katalaleō/katalalia; backbite/backbiting or speak evil of are alternatives.
      The prohibition on listening with pleasure and the explicit if-you-believe condition both remain,
      as does the repeated liability. Palatina printed73 opens with think ill of no one and then retains
      listening, assent and belief. The selected speech instruction is not changed into a prohibition
      on every unfavorable thought.
    reason: lexical_alternative
  - marker: g
    text: Have something against your brother retains the Greek idiom for holding a grievance or a case
      against a brother. The selected causal link is that believing the slander produces this grievance;
      the hearer’s liability is not detached from the condition. Brother remains the communal term without
      supplying a biological relationship.
    reason: cultural_note
  - marker: h
    text: Ministry retains diakonia and the earlier ministry/minister decision; service/serve is another
      rendering. Carry out retains the earlier completion wording rather than inventing an ecclesiastical
      office. The giver received this ministry from the Lord, not an unnamed human authority. The selected
      paragraph repeats its simple performance and the refusal to sort give/not-give.
    reason: lexical_alternative
  - marker: i
    text: Glorious before God retains the earlier main-text choice for endoxos para tō theō. Glorious
      with God, retained in the old note, is an alternative. The selected completed ministry is described
      this way; the translation does not add a merit mechanism or a promise of public fame.
    reason: lexical_alternative
  - marker: j
    text: The selected Greek repeats Give to all after the earlier instruction to give simply to all in
      need. Athos and Sinaiticus27.4 retain that repetition, as do both printed Latin versions. P.Oxy.4706
      fragment8, printed7/physical23 of its edition, is reconstructed without this second instruction.
      The editor treats its absence as apparent and discusses possible copying omission or expansion;
      the narrow surviving groups do not provide a fully legible continuous sentence. Repetition remains
      selected, without claiming unanimous papyrus support or adding a new manuscript-selection locus.
    reason: textual_variant
  - marker: k
    text: 'The selected contrast is explicit: afflicted recipients will not be judged, while hypocritical
      recipients will pay the penalty. Afflicted is also hard-pressed or in distress. Vulgata printed37
      has fictitious need and accountability without the exact two-part contrast; Palatina printed75 has
      necessary receiving as innocent and deceitful receiving accountable. In the Ethiopic edition’s mediated
      Latin printed129 the main print says needy recipients are condemned, while the footnote proposes
      not-condemned. That proposed negative is editorial correction, not a preserved negative silently
      shared by every witness. No direct Geʿez collation is claimed.'
    reason: textual_variant
  - marker: l
    text: The selected printed Greek has heart as a conjectural restoration attributed in its apparatus
      to Hilgenfeld from the Latin versions; your is additionally bracketed. The English shows [your]
      and discloses the larger conjecture here. Athos PlateV has innocence/harmlessness rather than heart.
      Palatina printed75 has your heart but clean and unfailing before God; Vulgata printed37 closes with
      a clean-heart imperative. The Ethiopic edition’s mediated Latin printed129 has purity without impurity,
      without the selected heart noun. Sinaiticus27.7 cannot attest the heart wording across its gap.
      The selected conjecture remains disclosed rather than presented as unanimous preserved Greek.
    reason: textual_variant
  - marker: m
    text: The selected purpose includes both your repentance and that of your household being found in
      simplicity. Athos PlateV retains that household reference. Sinaiticus global27.7 contains only the
      ending antos and punctuation; the official XML marks a two-line gap immediately before its verse
      element at page93-7r column1 lines1–2. Verse extraction alone loses that context. Neither the whole
      purpose nor household repentance can be claimed as preserved there. Vulgata printed37 instead separates
      personal repentance from welfare of the house. The selected fuller wording remains, without a photograph-based
      diagnosis of the Sinaiticus gap’s cause.
    reason: textual_variant
  - marker: n
    text: 'The earlier one who ministers simply to God will live wording is retained after reconsidering
      the dative tō theō before zēsetai. The dative can instead be read with the recurrent life refrain:
      one who ministers simply will live to God. The main text preserves the earlier service-to-God attachment
      and unqualified will live; no eternal-life or merely present-life specification is inserted. Vulgata
      printed37 lacks this separate final sentence; Palatina printed75 prints lives to God and proposes
      will live in its apparatus. The proposal is not a preserved manuscript future. Athos brackets simply
      in this closing sentence; Sinaiticus27.6 marks a dotted duplicated simply for deletion before the
      following simply.'
    reason: lexical_alternative
  - marker: o
    text: God wants everyone to receive from his own gifts represents pasin as the recipients of giving,
      not the object or amount given. The earlier all to be given obscured that dative and is explicitly
      corrected after Azure r1 review. The selected clause repeats the universal recipient scope of Give
      to all and retains God and his own gifts, without specifying a quantity. The Ethiopic edition’s
      mediated Latin printed128 instead names Lord. Sinaiticus27.4 uses apo where the selected Greek and
      Athos have ek, both rendered from. In P.Oxy.4706 fragment8 line5 the edition restores apo as an
      example using Sinaiticus; it is not surviving papyrus ink independently supporting that preposition.
    reason: textual_variant
  - marker: p
    text: The giver’s innocence and recipient accountability remain distinct. The selected paragraph has
      received-from-the-Lord, carry-out/completed, simple performance and no discrimination between give/not-give.
      Athos PlateV has shorter completion/giving syntax with some restored letters, and Palatina printed75
      condenses the repeated discrimination instruction. The Ethiopic edition’s mediated Latin printed129
      marks its ministry wording as corrupt. These versions are not reported as word-for-word agreement
      with the selected full sequence.
    reason: textual_variant
  - marker: q
    text: Simplicity and guileless retain the earlier haplotēs/akakos choices, also single-heartedness
      and innocent or harmless. Little ones is also infants or children. The selected comparison says
      they do not know the wickedness that destroys human life; it does not supply a theory that children
      are incapable of wrongdoing. Sinaiticus27.1 corrects the simplicity and knowing spellings in ca,
      not in a separate codex.
    reason: lexical_alternative
  - marker: r
    text: Smooth retains the earlier main text for homala, also level or even. The old lexical metadata
      said level although the main text said smooth; it is reconciled to the retained wording. Cheerful
      and the absence of an evil stumbling block remain alongside smooth. Sinaiticus27.4 orders cheerful
      before smooth, while the selected print and Athos put smooth first. No literal road or physical
      construction is added.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁπλότης / ἁπλῶς
  chosen: simplicity / simply
  alternatives:
  - singleness
  - sincerity
  - generously
  lexicon: BDAG
  rationale: Hermas uses ἁπλότης as a moral quality of single-heartedness; retaining “simplicity/simply”
    preserves the thematic thread and avoids narrowing it to mere generosity.
- source_word: ἄκακος
  chosen: guileless
  alternatives:
  - innocent
  - harmless
  lexicon: BDAG
  rationale: Guileless captures absence of craftiness without implying naïveté; pairs well with ἁπλότης.
- source_word: νήπια
  chosen: little ones
  alternatives:
  - infants
  - children
  lexicon: BDAG
  rationale: “Little ones” conveys tender age and moral exemplar imagery without technicality.
- source_word: πονηρία
  chosen: wickedness
  alternatives:
  - evil
  - malice
  lexicon: BDAG
  rationale: Wickedness signals the moral quality that destroys life in this context.
- source_word: καταλαλέω / καταλαλία
  chosen: slander / slander
  alternatives:
  - speak evil of
  - backbite/backbiting
  lexicon: BDAG
  rationale: In moral paraenesis, καταλαλέω commonly denotes slanderous speech against someone; “slander”
    is clear and specific.
- source_word: ἡδέως
  chosen: with pleasure
  alternatives:
  - gladly
  - with delight
  lexicon: BDAG
  rationale: Conveys the culpable attitude in listening to slander.
- source_word: ἔνοχος
  chosen: guilty
  alternatives:
  - liable
  lexicon: BDAG
  rationale: Legal-moral liability is intended.
- source_word: ἕξεις κατὰ τοῦ ἀδελφοῦ σου
  chosen: you will have something against your brother
  alternatives:
  - you will hold a grudge against your brother
  - you will have a case against your brother
  lexicon: BDAG
  rationale: Keeps the Greek idiom transparent while remaining understandable; Hermas’ communal ethic
    favors the relational nuance.
- source_word: ἀκατάστατον
  chosen: restless
  alternatives:
  - unstable
  - disorderly
  lexicon: BDAG
  rationale: Restlessness fits the demon metaphor and contrasts with peace.
- source_word: δαιμόνιον
  chosen: demon
  alternatives:
  - evil spirit
  lexicon: BDAG
  rationale: Early Christian diction; avoids demythologizing the personified force behind slander.
- source_word: διχοστασίαι
  chosen: divisions
  alternatives:
  - factions
  - dissensions
  lexicon: BDAG
  rationale: “Divisions” is broad and matches the social fracture slander causes.
- source_word: εὐθηνία
  chosen: well-being
  alternatives:
  - prosperity
  - good relations
  lexicon: LSJ
  rationale: LSJ notes prosperity/comfort; here relational context (“with all”) suggests holistic well‑being
    rather than material prosperity.
- source_word: σεμνότης
  chosen: dignity
  alternatives:
  - gravity
  - reverent seriousness
  lexicon: BDAG
  rationale: Matches NT moral virtue lists (cf. 1 Tim 2:2); denotes a noble, orderly bearing suited to
    Hermas’ exhortation.
- source_word: πρόσκομμα
  chosen: stumbling block
  alternatives:
  - cause of stumbling
  - obstacle
  lexicon: BDAG
  rationale: Established moral metaphor; preserves offense-causing sense.
- source_word: ὁμαλός
  chosen: smooth
  alternatives:
  - level
  - even
  lexicon: LSJ
  rationale: Retain the earlier smooth main-text choice; reconcile the stale level metadata. Both the
    obstacle image and cheerful remain without adding a literal road.
- source_word: ἱλαρά
  chosen: cheerful
  alternatives:
  - pleasant
  - gracious
  lexicon: BDAG
  rationale: Cheerfulness fits the ethical tone and contrasts slander’s turbulence.
- source_word: ὑστερουμένοις
  chosen: those who are in need
  alternatives:
  - the needy
  - those lacking
  lexicon: BDAG
  rationale: Clarifies the participle’s sense without jargon.
- source_word: διστάζων
  chosen: hesitating
  alternatives:
  - doubting
  - wavering
  lexicon: BDAG
  rationale: “Hesitating” fits the practical decision about recipients.
- source_word: διακρίνων
  chosen: making distinctions
  alternatives:
  - discriminating
  - deciding between
  lexicon: BDAG
  rationale: Captures the evaluative sorting Hermas forbids in this context.
- source_word: δωρήματα
  chosen: gifts
  alternatives:
  - donations
  - benefits
  lexicon: BDAG
  rationale: Divine “gifts” preserves theological source of provision.
- source_word: ἀποδώσουσιν λόγον
  chosen: will render an account
  alternatives:
  - will give an account
  lexicon: BDAG
  rationale: Standard judicial idiom; keeps gravity.
- source_word: θλιβόμενοι
  chosen: afflicted
  alternatives:
  - hard‑pressed
  - in distress
  lexicon: BDAG
  rationale: Common Koine sense for material or circumstantial hardship.
- source_word: ὑπόκρισις
  chosen: hypocrisy
  alternatives:
  - pretense
  lexicon: BDAG
  rationale: Moral vice term in early Christian vocabulary; transparent here.
- source_word: τίσουσιν δίκην
  chosen: will pay the penalty
  alternatives:
  - will receive punishment
  - will suffer justice
  lexicon: BDAG
  rationale: Idiomatic rendering retaining judicial metaphor.
- source_word: ἀθῷος
  chosen: innocent
  alternatives:
  - blameless
  lexicon: BDAG
  rationale: Signals freedom from guilt in God’s sight.
- source_word: διακονία / διακονεῖν
  chosen: ministry / minister
  alternatives:
  - service / serve
  lexicon: BDAG
  rationale: Preserves ecclesial texture of almsgiving as a God‑given ministry.
- source_word: τελέσαι / ἐτέλεσεν
  chosen: to carry out / he carried it out
  alternatives:
  - to complete / he completed it
  lexicon: BDAG
  rationale: “Carry out” communicates performing an assigned task; fits διακονία.
- source_word: ἔνδοξος
  chosen: glorious
  alternatives:
  - honorable
  - esteemed
  lexicon: BDAG
  rationale: Theocentric approval; retains exalted tone.
- source_word: ζήσεται
  chosen: will live
  alternatives:
  - will have life
  lexicon: BDAG
  rationale: Leaves open both present vitality and eschatological life, matching Hermas’ parenetic promise.
- source_word: ἐντολή
  chosen: commandment
  alternatives:
  - command
  lexicon: BDAG
  rationale: Maintains the formal register of moral instruction.
- source_word: μετάνοια
  chosen: repentance
  alternatives:
  - reorientation
  - repentance
  - change of mind
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial
    assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: οἶκος
  chosen: household
  alternatives:
  - house
  - family
  lexicon: BDAG
  rationale: Ecclesial and social unit; common early Christian usage.
- source_word: ἀμίαντος
  chosen: unstained
  alternatives:
  - undefiled
  - unblemished
  lexicon: BDAG
  rationale: Moral purity image; “unstained” keeps the metaphor vivid.
- source_word: ἡ καρδία [σου]
  chosen: '[your] heart'
  alternatives:
  - innocence/harmlessness (Athos)
  lexicon: Selected printed text and its conjecture apparatus, compared with bounded primary versions
  rationale: Retain the selected editorial heart conjecture, disclose its versional basis and Athos difference,
    and represent the additional brackets around your. Sinaiticus cannot attest the whole phrase across
    its recorded gap.
