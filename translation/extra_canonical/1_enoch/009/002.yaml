translation:
  text: And they said among themselves, “The voice of their cry has ascended, and the earth has cried out as far as the gate
    of heaven.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to the gate of heaven.” The Ge'ez presents the earth itself as crying out and marks heaven’s gate as the limit
      reached by that cry.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤሉ፡ በበይናቲሆሙ
  chosen: And they said among themselves
  alternatives:
  - And they said to one another
  rationale: The construction introduces a shared declaration within the group. “Among themselves” closely preserves the distributive
    Ge'ez expression without adding an explicit reciprocal object.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ቃለ፡ ጽራኃቲሆሙ
  chosen: The voice of their cry
  alternatives:
  - the sound of their outcry
  - their cry
  rationale: The source explicitly includes “voice/sound” in a construct phrase with “their cry.” Retaining both nouns preserves
    its emphatic wording and avoids reducing it to the smoother “their cry.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዐረቀ
  chosen: has ascended
  alternatives:
  - went up
  - rose
  rationale: The verb depicts upward movement toward the heavenly realm. The English perfect suits the speakers’ report of
    a cry that has already risen while preserving the apocalyptic spatial image.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ጸርሐት፡ ምድር
  chosen: the earth has cried out
  alternatives:
  - the earth cried out
  - the earth raised a cry
  rationale: The feminine verb agrees with “earth,” making the earth the grammatical subject. The rendering preserves this
    personification rather than recasting the line as merely a cry arising from the earth.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እስከ፡ አንቀጸ፡ ሰማይ
  chosen: as far as the gate of heaven
  alternatives:
  - to the gate of heaven
  - up to heaven’s gate
  rationale: “As far as” represents the limit expressed by እስከ, while singular “gate” follows the supplied witness and retains
    the concrete heavenly-threshold imagery.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
