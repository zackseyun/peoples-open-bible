  yaml_path: translation/ot/psalms/049/003.yaml
  text: My mouth will speak wisdom[a], and the meditation of my heart will be understanding.
  footnotes:
  - marker: a
    text: Hebrew literally, 'both sons of Adam and sons of man'; here the paired expressions function idiomatically for people of low and high status.
    reason: lexical_alternative
  - marker: b
    text: Or 'together, rich and poor.'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 입이 지혜를 말하고, 내 마음의 묵상은 명철을 드러낼 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘지혜들’과 ‘명철들’은 복수형이지만, 여기서는 추상적 의미로 쓰여 ‘지혜’와 ‘명철’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם
  english_pob_choice: both ... and
  chosen_korean: 또한 ... 또한 / ...도 ...도
  alternatives_korean:
