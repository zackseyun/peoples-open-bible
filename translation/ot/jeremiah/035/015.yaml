  from: And I sent to you all my servants the prophets[a], rising early and sending them, saying, ‘Please turn back, each man from his evil way, and make your deeds good, and do not go after other gods to serve them[d][c][b]. Then dwell in the land that I gave to you and to your fathers.’ But you did not incline your ear or listen to me.
  to: I also sent you all my servants the prophets again and again, saying, ‘Each of you, please repent of your evil ways and amend your deeds. Do not follow other gods to serve them. Then you will remain in the land I gave you and your ancestors.’ But you did not pay attention or listen to me.
