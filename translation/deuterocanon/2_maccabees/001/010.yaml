lexical_decisions:
- source_word: ἔτους
  chosen: in the ... year
  alternatives:
  - year
  - of the year
  lexicon: LSJ
  rationale: Genitive of time/date formula; in English this is most naturally rendered adverbially as a dating phrase, 'in the ... year,' rather than a bare genitive.
- source_word: ὀγδοηκοστοῦ καὶ ὀγδόου
  chosen: eighty-eighth
  alternatives:
  - eighty and eighth
  - the eighty-eighth
  lexicon: LSJ
  rationale: The Greek expresses the ordinal analytically ('eightieth and eighth'), a standard way to mean 'eighty-eighth.' English idiom prefers the compounded ordinal.
- source_word: ἐν Ἱεροσολύμοις
  chosen: in Jerusalem
  alternatives:
  - at Jerusalem
  - among those in Jerusalem
  lexicon: LSJ
  rationale: Ἱεροσόλυμα is a plural-form place name in Greek, but standard English renders the toponym in the singular as 'Jerusalem.' The preposition ἐν is straightforwardly locative here.
