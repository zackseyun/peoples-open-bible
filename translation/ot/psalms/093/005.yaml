  from: O LORD, for length of days
  to: for length of days, O LORD.
  rationale: The current word order places the vocative 'O LORD' in the middle of a thought, separating the predicate 'holiness befits your house' from its temporal modifier 'for length of days.' This is grammatically awkward and slightly obscures the connection. In the Hebrew, the phrase 'לְאֹרֶךְ יָמִים' (for length of days) most naturally modifies the preceding clause about the house's holiness. Placing the vocative at the very end of the verse ('...for length of days, O LORD.') maintains the vocative force while creating a more natural and clear English sentence.
