id: PSA.76.5
reference: Psalms 76:5
source:
  edition: WLC
  text: אֶשְׁתּוֹלְל֨וּ אַבִּ֣ירֵי לֵ֭ב נָמ֣וּ שְׁנָתָ֑/ם וְ/לֹא מָצְא֖וּ כָל אַנְשֵׁי חַ֣יִל יְדֵי/הֶֽם׀־־־׃
translation:
  text: The stouthearted were plundered; they sank into sleep, and none of the men of valor could use their hands[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “none of the men of valor found their hands,” an idiom describing their inability to act.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתּוֹלְלוּ
  chosen: were plundered
  alternatives:
  - were stripped
  - were despoiled
  - became helpless/spoiled
  lexicon: HALOT
  rationale: From the root שלל in a reflexive/passive stem, the sense is that the mighty are themselves despoiled after God's rebuke. 'Were plundered' best fits the military context and parallels the loss of power in the next colon.
- source_word: אַבִּירֵי לֵב
  chosen: the stouthearted
  alternatives:
  - the mighty of heart
  - the strong-hearted
  - the courageous
  lexicon: HALOT
  rationale: Literally 'mighty of heart.' In context it refers to bold warriors or proud strong men. 'Stouthearted' preserves both courage and inner resolve without over-paraphrasing.
- source_word: נָמוּ שְׁנָתָם
  chosen: they slept their sleep
  alternatives:
  - they sank into sleep
  - they slept the sleep of death
  - they slumbered
  lexicon: HALOT
  rationale: 'The Hebrew is idiomatic but vivid: ''they slept their sleep.'' Retaining the cognate expression preserves the poetic force and leaves open whether the sleep is literal or death-like, though in context it strongly suggests defeat unto death.'
- source_word: אַנְשֵׁי חַיִל
  chosen: men of valor
  alternatives:
  - warriors
  - mighty men
  - valiant men
  lexicon: HALOT
  rationale: A standard Hebrew expression for strong or valiant fighting men. 'Men of valor' is concise, natural, and preserves the martial nuance.
- source_word: וְלֹא מָצְאוּ ... יְדֵיהֶם
  chosen: none of the men of valor could use their hands
  alternatives:
  - none of the warriors could use their hands
  - none of the valiant men found strength in their hands
  lexicon: HALOT
  rationale: The literal wording is a Hebrew idiom for inability to act. Natural English should communicate that sense, while the source image is retained in a note.
