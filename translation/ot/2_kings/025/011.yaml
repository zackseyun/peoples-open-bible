  from: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
  to: Nebuzaradan, the captain of the guard, carried into exile the remaining people in the city, those who had defected to the king of Babylon, and the rest of the population.
