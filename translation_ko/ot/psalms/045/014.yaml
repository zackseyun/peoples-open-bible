id: PSA.45.14
reference: Psalms 45:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/רְקָמוֹת֮ תּוּבַ֪ל לַ֫/מֶּ֥לֶךְ בְּתוּל֣וֹת אַ֭חֲרֶי/הָ רֵעוֹתֶ֑י/הָ מ֖וּבָא֣וֹת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/014.yaml
  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[b][c], are brought to you.
  footnotes:
  - marker: a
    text: Or 'In embroidered work she is brought to the king.'
    reason: lexical_alternative
  - marker: b
    text: The final 'to you' follows the Hebrew's feminine singular address, likely shifting directly to the bride; some translations smooth this toward the king instead.
    reason: alternative_reading
  - marker: c
    text: '''Virgins'' may also be rendered ''maidens'' or ''young women,'' but the Hebrew term more specifically denotes unmarried virgins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 수놓은 옷을 입고 왕께로 인도됩니다. 그녀의 뒤를 따르는 처녀들, 곧 그녀의 벗들도 당신께로 이끌려 옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘당신께로’는 여성 단수형입니다. 본문은 신부를 3인칭으로 묘사하다가 여기서 직접 신부에게 말을 거는 방식으로 전환합니다. 일부 번역은 이를 왕을 가리키는 말로 매끄럽게 처리하지만, 여기서는 히브리어의 전환을 유지했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל כְּבוּדָּה
  english_pob_choice: All glorious
  chosen_korean: 모두 영광스럽고
  alternatives_korean:
  - 온통 영광스럽고
  - 모든 면에서 영광스럽고
  - 영광으로 가득하고
  lexicon: HALOT
  rationale: כָּל과 כְּבוּדָּה의 결합은 단순 수량보다 총체적 찬란함을 나타내므로, 한국어에서도 판정적 표현으로 옮겼습니다.
- source_word: בַת מֶלֶךְ פְּנִימָה
  english_pob_choice: the king’s daughter within
  chosen_korean: 왕의 딸은 … 내실에 있으며
  alternatives_korean:
  - 왕의 딸은 안에 있으며
  - 왕의 딸은 안방에 있으며
  - 공주가 안에 있으며
  lexicon: HALOT
  rationale: בַת מֶלֶךְ은 직역해 왕의 딸로 두어 원문 이미지를 보존했고, פְּנִימָה는 ‘안/within’의 여지를 살려 내실에 있다로 옮겨 내적 아름다움과 실내 위치의 중의성을 남겼습니다.
- source_word: מִמִּשְׁבְּצֹת זָהָב
  english_pob_choice: of woven gold
  chosen_korean: 황금으로 짠
  alternatives_korean:
  - 황금으로 수놓은
  - 황금 장식이 있는
  - 금실로 짠
  lexicon: HALOT
  rationale: מִשְׁבְּצוֹת은 세공·짜임·장식의 뜻 폭이 있어, POB의 ‘woven gold’를 따라 의복의 직조된 금 장식을 자연스럽게 드러냈습니다.
- source_word: לְבוּשָׁהּ
  english_pob_choice: her clothing
  chosen_korean: 그 옷은
  alternatives_korean:
  - 그 의복은
  - 그 드레스는
  - 그 겉옷은
  lexicon: HALOT
  rationale: לְבוּשָׁהּ은 특정 한 벌로 한정하지 않는 일반적 의복 표현이므로, 현대 한국어의 자연스러운 총칭인 ‘옷’으로 옮겼습니다.
theological_decisions:
- issue: פְּנִימָה의 공간적·비공간적 중의성
  chosen_reading: ‘내실에 있으며’로 옮겨 왕궁 내부의 위치와 내적 아름다움의 여지를 함께 남겼습니다.
  alternative_readings:
  - ‘내면이’로 옮겨 내적 미를 강조하는 해석
  - ‘안방에’로 옮겨 물리적 공간을 강조하는 해석
  rationale: 시어의 중의성을 한쪽으로 닫지 않고 보존하는 것이 원문 청중의 이해 범위를 더 잘 반영합니다.
  doctrine_reference: 시편의 시적 이미지와 문맥 해석 원리
- issue: בַת מֶלֶךְ의 직역 유지
  chosen_reading: ‘왕의 딸’로 유지하여 왕실 혼인 이미지와 원문 어휘를 직접 보이게 했습니다.
  alternative_readings:
  - ‘공주’로 의역
  - ‘왕의 딸’ 대신 ‘왕녀’로 번역
  rationale: ‘공주’는 자연스럽지만 원문의 표현을 평준화할 수 있어, 본문 가시성을 우선했습니다.
  doctrine_reference: 원문 투명성 및 시편 수사 보존
