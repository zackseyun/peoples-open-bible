  text: God saw the sons of Israel, and God knew.
translation:
  language: ru
  text: Бог увидел сынов Израиля, и Бог знал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и Бог знал». В древнееврейском тексте глагол употреблён без названного дополнения; не сказано прямо, что именно Бог знал.'
    reason: Сохраняет буквальное значение глагола и неопределённость исходного текста, не приписывая Богу получение нового знания и не заменяя выражение толкованием.
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямо передаёт обычное значение ראה и сохраняет лаконичный параллелизм исходного текста.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально передаёт древнееврейское выражение и сохраняет связь с именем праотца Израиля.
- source_word: וַיֵּדַע
  choice: узнал
  rationale: Сохраняет широкий смысл ידע и намеренную недосказанность текста, не подменяя её толкованием вроде «обратил внимание» или «позаботился».
theological_decisions:
- issue: Смысл Божьего «знания»
  choice: и Бог узнал
  alternative: и Бог обратил на них внимание / и Бог позаботился о них
  rationale: Исходный текст не называет объект глагола и не поясняет характер знания. Буквальная формулировка сохраняет богословскую напряжённость и связь с предыдущим упоминанием завета.
translation_notes:
  register: Современный литературный русский с намеренно лаконичной, торжественной структурой. Повтор слова «Бог» сохранён вслед за оригиналом. Формула «сыны Израиля» традиционна, но форма косвенного падежа «сынов Израиля» остаётся понятной современному читателю.
