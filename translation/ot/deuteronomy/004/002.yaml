  category: meaning_retranslation
  from: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
  to: You must not add to what I command you or take anything away from it, so that you may keep the commandments of Yahweh your God that I am giving you.
  rationale: The lexical deliberation identifies the commanded 'word' as the whole content of Moses' instruction and preserves the purpose connection with keeping Yahweh's commandments. The rendering keeps both points while removing an unnatural English construction.
