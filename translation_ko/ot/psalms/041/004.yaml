  source_fidelity: 현 초안은 시편 41:4가 아니라 앞 절(41:3)의 내용(병상, 병상에서 붙드심)을 옮기고 있어, 본문 히브리어의 1인칭 고백·간구와 일치하지 않습니다. 41:4는 화자가 야훼께 은혜와 치유를 구하며 자신이 주께 죄를 지었다고 고백하는 절입니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 기도·시편 문체로 자연스럽습니다. ‘나는 말했습니다’는 명시된 독립 인칭대명사의 강조를 과도하지 않게 반영하며, 직접 인용 안의 ‘주십시오’는 간구의 높임말에 맞습니다.
  terminology: יהוה는 POB 방침에 따라 ‘야훼’로, חנן은 ‘은혜를 베풀다’로, רפא는 ‘고쳐 주다’로 옮겼습니다. נֶפֶשׁ의 넓은 뜻을 본문에서는 ‘영혼’으로 보존하되, 각주에서 ‘생명’ 또는 ‘나 자신’의 가능성을 밝혔습니다.
