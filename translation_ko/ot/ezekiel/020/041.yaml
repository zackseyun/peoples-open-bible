    rationale: 원문은 ‘땅들/지역들’을 말합니다. 정치적 국가를 뜻하는 ‘나라들’보다 ‘여러 땅들’이 적절합니다.
  - severity: low
    issue: 각주 a가 본문에 없는 ‘제의적 수용’ 설명을 단정적으로 제시합니다.
    rationale: 제의적 관용구라는 배경은 유익하지만, 본문에 ‘제물’을 삽입할 근거가 되지 않도록 ‘제의 언어에서 쓰이는 표현’으로 절제해 설명하는 것이 좋습니다.
