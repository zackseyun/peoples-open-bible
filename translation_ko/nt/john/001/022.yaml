id: JHN.1.22
reference: John 1:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: ko
  text: 그러자 그들이 그에게 말했습니다. 「당신은 누구십니까? 우리를 보낸 이들에게 대답을 할 수 있도록, 자신에 대하여 무엇이라고 하십니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 암시적으로 반영(생략)
  alternatives_korean:
  - 그러므로
  - 그래서
  lexicon: BDAG
  rationale: οὖν은 앞말과의 담화적 연결을 표시합니다. 한국어에서 같은 연결어를 덧붙이면 어색할 수 있어 본문 흐름을 해치므로, 서술문 '그들이 그에게 말했습니다'로 담화적 연속성을 암시적으로 반영하고 연결어는 생략했습니다.
- source_word: Τίς εἶ;
  english_pob_choice: Who are you?
  chosen_korean: 당신은 누구십니까?
  alternatives_korean:
  - 당신이 누구냐?
  - 네가 누구냐?
  lexicon: BDAG
  rationale: 정체를 묻는 간결한 질문입니다. 현대 한국어의 공손한 공식체(-십니까)를 사용하여 원문의 간결하고 조사적인 물음투를 보존했습니다.
- source_word: ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς
  english_pob_choice: so that we may give an answer to those who sent us
  chosen_korean: 우리를 보낸 이들에게 대답하기 위해
  alternatives_korean:
  - 우리를 보낸 이들에게 대답을 드리기 위해
  - 우리를 보낸 사람들에게 응답하기 위하여
  lexicon: BDAG
  rationale: ἵνα 목적 구문을 '…하기 위해(서)'로 자연스럽게 옮겼습니다. '대답'은 ἀπόκρισιν의 적절한 대응어이며, '우리를 보낸 이들'은 τοῖς πέμψασιν ἡμᾶς의 관형적 관념을 살렸습니다.
- source_word: τί λέγεις περὶ σεαυτοῦ
  english_pob_choice: What do you say about yourself?
  chosen_korean: 자신에 대해 무엇이라 하십니까?
  alternatives_korean:
  - 당신 자신에 대해 무엇이라고 말씀하십니까?
  - 자신에 관해 무엇이라 말합니까?
  lexicon: BDAG
  rationale: περὶ σεαυτοῦ의 재귀적 참조를 '자신에 대해'로, λέγεις의 현재형 질문을 공손한 의문형으로 옮겨 원문의 자기증언 요청을 충실히 전달했습니다.
theological_decisions:
- issue: direct-speech register (address to John the Baptist)
  chosen_reading: '공식적·정중한 화법(합쇼체: -십니까/-하십니까)으로 번역'
  alternative_readings:
  - 비공식적·반말(네가 누구냐?) — 많은 전통적 한국어 성경에서 사용됨
  - 중립적 문어체(당신이 누구냐?)
  rationale: 본문 서술부가 합쇼체를 요구하므로, 질문자들이 공적 직무를 수행하는 제사장·레위인으로 보이는 문맥을 반영하여 직접화법도 공손한 공식체로 통일했습니다. 이는 현대 한국어 독자에게 원문이 주는 공적·공식적 분위기를 보존합니다.
  doctrine_reference: POB Korean style guidelines
