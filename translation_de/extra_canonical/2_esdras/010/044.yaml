  text: als eine erbaute Stadt. Und weil sie dir sagte, dass sie unfruchtbar sei,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ut ciuitatem aedificatam
  choice: als eine Stadt, die gebaut wird
  rationale: Der überlieferte Ausschnitt setzt offenbar einen vorangehenden Satz fort. Die deutsche Fassung bewahrt den Vergleich und gibt das lateinische Perfektpartizip im Kontext als laufenden Aufbau wieder.
- source_word: sterilis
  choice: unfruchtbar
  rationale: Die übliche und sachlich passende Wiedergabe für eine Frau, die keine Kinder bekommen hat.
theological_decisions:
- issue: Abweichung zwischen lateinischem Ausschnitt und englischer Konsultationsfassung
  choice: Nur den tatsächlich vorgelegten lateinischen Wortlaut übersetzen und den abbrechenden Satz bewahren.
  alternative: Die englische Fassung mit der Identifizierung der Frau als Zion ergänzen.
  rationale: Die Identifizierung mit Zion steht nicht im angegebenen lateinischen Ausschnitt; sie darf nicht allein aus der englischen Konsultationsschicht in den Ausgangstext eingeführt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Anfang und das offene Satzende spiegeln den bereitgestellten lateinischen Ausschnitt.
