  terminology: ‘만군의 야훼’, ‘이스라엘의 하나님’, ‘하늘의 여왕’, ‘전제물’은 원문과 제의적 어휘를 적절히 반영합니다. ‘그 여왕에게’는 우상 숭배 대상의 여성성을 명확히 합니다.
