source:
  edition: WLC
  text: כִּ֣י כָל מִשְׁפָּטָ֣י/ו לְ/נֶגְדִּ֑/י וְ֝/חֻקֹּתָ֗י/ו לֹא אָסִ֥יר מֶֽנִּ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/022.yaml
  text: For all his judgments were before me, and I did not put his statutes away from me.
translation:
  language: ko
  text: 이는 그의 모든 판단이 내 앞에 있었기 때문이며, 나는 그의 규례들을 내게서 치워 버리지 않았습니다.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: מִשְׁפָּטָיו
  english_pob_choice: his judgments
  chosen_korean: 판단
  alternatives_korean:
  - 심판
  - 재판 결정
  - 규례
  lexicon: HALOT
  rationale: 시편 문맥에서 מִשְׁפָּט은 단순한 법령보다 하나님의 공의로운 판단과 판결을 함께 담을 수 있어, 영어 POB의 'judgments'를 살려 '판단'으로 옮겼습니다.
- source_word: לְנֶגְדִּי
  english_pob_choice: before me
  chosen_korean: 내 앞에
  alternatives_korean:
  - 내 앞에 늘
  - 내 앞에 계속
  - 내 눈앞에
  lexicon: HALOT
  rationale: 직역적으로는 '내 앞에'이며, 계속 의식하고 바라보는 상태를 자연스럽게 전달합니다.
- source_word: חֻקֹּתָיו
  english_pob_choice: his statutes
  chosen_korean: 규례들
  alternatives_korean:
  - 율례들
  - 법도들
  - 정하신 규정들
  lexicon: HALOT
  rationale: חֻקּוֹת은 고정된 제정 규범을 가리키므로 한국어 성경 어휘로는 '규례들'이 가장 직접적입니다.
- source_word: לֹא אָסִיר מֶנִּי
  english_pob_choice: I did not put away ... from me
  chosen_korean: 내게서 치워 버리지 않았습니다
  alternatives_korean:
  - 내게서 옮기지 않았습니다
  - 내게서 제거하지 않았습니다
  - 내게서 물리치지 않았습니다
  lexicon: HALOT
  rationale: 히필형의 타동적 뉘앙스를 살려, 스스로 '돌이킨다'보다 대상을 '내게서 치운다/제거한다'는 뜻을 분명히 했습니다.
theological_decisions:
- issue: moral-legal vocabulary for divine instruction
  chosen_reading: '''판단''과 ''규례들''을 병기해 하나님의 공의로운 판결과 지시된 규범의 두 측면을 함께 드러냈습니다.'
  alternative_readings:
  - '''판결''만 쓰기'
  - '''율례들''만 쓰기'
  - '''법규''로 평탄화하기'
  rationale: 히브리어 두 어휘가 같은 범주의 반복이지만, 하나는 판단/판결의 성격을, 다른 하나는 고정된 규범의 성격을 띠므로 한국어에서도 그 긴장을 보존하는 편이 좋습니다.
  doctrine_reference: 시 18편의 언약적 순종과 하나님의 공의
- issue: transitivity of the Hebrew verb
  chosen_reading: '''치워 버리지 않았습니다''로 옮겨, 규례를 자기에게서 제거하는 동작성을 살렸습니다.'
  alternative_readings:
  - '''돌아서지 않았습니다''로 해석하기'
  - '''따르지 않았습니다''로 완화하기'
  rationale: 본문의 동사형은 단순한 방향 전환보다 대상 제거의 의미가 더 직접적이므로, 영어 POB가 보존한 긴장을 한국어에서도 유지했습니다.
  doctrine_reference: 본문의 문법이 요구하는 순종의 적극성
