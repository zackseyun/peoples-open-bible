  text: You know, Lord, that I am pure from every sin and from a man,
translation:
  language: de
  text: Du weißt, Herr, dass ich rein bin von jeder Sünde und von einem Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung ist knapp und ungewöhnlich. Sie kann im Zusammenhang besagen, dass sie sich von jeder Sünde rein gehalten und keinen geschlechtlichen Umgang mit einem Mann gehabt hat; dies wird im Haupttext nicht ausdrücklich ergänzt.
    reason: Erläutert die Ellipse und die kontextnahe sexuelle Konnotation, ohne den griechischen Singular zu „jedem Mann“ auszuweiten oder die Deutung in den Haupttext einzutragen.
lexical_decisions:
- source_word: καθαρά
  choice: rein
  rationale: Bewahrt die Grundbedeutung körperlicher beziehungsweise sittlicher Reinheit, ohne die im Kontext mögliche sexuelle Bedeutung ausdrücklich festzulegen.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: von jeder Sünde
  rationale: Gibt die Präposition ἀπό und die umfassende Formulierung πάσης ἁμαρτίας eng am griechischen Wortlaut wieder.
- source_word: καὶ ἀνδρός
  choice: und von einem Mann
  rationale: Die knappe, ungewöhnliche griechische Wendung wird bewusst nicht zu »von Verkehr mit einem Mann« erweitert; so bleiben Bezug und Bedeutungsumfang offen.
theological_decisions:
- issue: Art der von Sara behaupteten Reinheit
  choice: 'Die Aussage bleibt allgemein: »rein … von jeder Sünde und von einem Mann«.'
  alternative: »Ich habe mich weder durch irgendeine Sünde noch durch einen Mann verunreinigt.«
  rationale: Der griechische Text verbindet ἁμαρτίας und ἀνδρός elliptisch mit ἀπό. Eine glättende Auslegung könnte sexuelle Enthaltsamkeit ausdrücklich machen, würde die Mehrdeutigkeit jedoch stärker auflösen als der Ausgangstext.
translation_notes:
  register: Die Anrede und Satzführung sind würdig und in modernem Standarddeutsch verständlich. Die leichte Fremdheit am Satzende folgt bewusst der ungewöhnlichen griechischen Formulierung.
