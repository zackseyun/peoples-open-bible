id: PSA.10.10
reference: Psalms 10:10
source:
  edition: WLC
  text: ו/דכה יָשֹׁ֑חַ וְ/נָפַ֥ל בַּ֝/עֲצוּמָ֗י/ו חלכאים׃
translation:
  text: He crouches and lies low, and the helpless fall by his might[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew is difficult. It may also mean, “The helpless are crushed, sink down, and fall by his strength”; the final phrase is more literally “by his strong ones.”
    reason: alternative_reading
lexical_decisions:
- source_word: ו/דכה
  chosen: He crouches
  alternatives:
  - He is crushed
  - He stoops
  - He lies low
  lexicon: HALOT
  rationale: The consonantal form is difficult, but in context with the following verbs it is best taken as describing the wicked man's low, predatory posture rather than passive crushing. 'He crouches' fits the hunting imagery of the surrounding verses and pairs naturally with 'he bows down.'
- source_word: יָשֹׁחַ
  chosen: he bows down
  alternatives:
  - he sinks down
  - he stoops
  lexicon: HALOT
  rationale: The verb commonly carries the sense of bowing low or sinking down. Here 'bows down' preserves the physical imagery and parallels the previous verb without overinterpreting.
- source_word: וְ/נָפַ֥ל
  chosen: and the helpless fall
  alternatives:
  - and he falls
  - and the weak fall
  lexicon: HALOT
  rationale: 'Although the verb is morphologically 3ms, the syntax of the verse is notoriously compressed. Taking ''the helpless'' as the understood subject of ''fall'' yields the most coherent sense in context: the wicked crouches, and the vulnerable fall into his power. This is supported by many interpreters and ancient-version-informed translations.'
- source_word: בַּ֝/עֲצוּמָ֗י/ו
  chosen: by his might
  alternatives:
  - into his strong claws
  - by his strength
  - under his powerful ones
  lexicon: HALOT
  rationale: This gives a natural collective or abstract sense to the difficult plural while avoiding the speculative specificity of “clutches.”
- source_word: חלכאים
  chosen: the helpless
  alternatives:
  - the unfortunate
  - the weak
  - the afflicted
  lexicon: HALOT
  rationale: This noun refers to those who are weak, unfortunate, or vulnerable. 'The helpless' communicates social vulnerability clearly in modern English and fits the psalm's concern for the oppressed.
- source_word: ו/דכה יָשֹׁחַ
  chosen: He crouches and lies low
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Within the surrounding ambush imagery, this preserves a plausible description of the wicked person’s low posture without presenting a disputed passive reading as certain.
