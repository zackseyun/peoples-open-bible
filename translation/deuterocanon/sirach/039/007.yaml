theological_decisions:
- issue: Referent of the repeated pronouns
  chosen_reading: The verse is rendered with a masculine singular subject throughout ('he himself ... his ... his'), preserving the Greek's grammatical cohesion without specifying beyond the text who the referent is.
  alternative_readings:
  - The pronouns could be understood more generically from context and rendered less explicitly in English.
  rationale: The immediate Greek presents a masculine singular subject with repeated αὐτοῦ. Since the verse itself does not name the referent, the translation preserves the syntax rather than resolving the broader contextual identification in the main text.
  doctrine_reference: Preserve theological tension rather than resolve it.
