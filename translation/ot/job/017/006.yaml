  from: He has made me a byword among the peoples[b][a], and I have become one before whom people spit.
  to: He has made me a byword among the peoples[a], and I have become one before whom people spit[b].
  rationale: The proposal's claim that the Hebrew explicitly requires spitting in Job's face is too strong. The phrase conveys spitting/open contempt “before faces,” but its exact construction is difficult; the current natural rendering and explanatory note preserve that image without over-specifying its direction. The markers do need correction.
