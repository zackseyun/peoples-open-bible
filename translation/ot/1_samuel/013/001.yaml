id: 1SA.13.1
reference: 1 Samuel 13:1
source:
  edition: WLC
  text: בֶּן שָׁנָ֖ה שָׁא֣וּל בְּ/מָלְכ֑/וֹ וּ/שְׁתֵּ֣י שָׁנִ֔ים מָלַ֖ךְ עַל יִשְׂרָאֵֽל־־׃
translation:
  text: Saul was [age unknown] when he became king, and he reigned [an unknown number] and two years over Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The preserved Hebrew reads literally, “Saul was a son of a year when he became king, and he reigned two years over Israel.” The age is not recoverable; “two years” may be a fragment of a longer reign total or may refer to a point during Saul’s reign. Some Greek manuscripts give his age as thirty, and Acts 13:21 gives forty years for his reign, but neither establishes the missing figures here.
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  chosen: '[age unknown]'
  alternatives:
  - was like a one-year-old
  - was a son of one year
  lexicon: HALOT
  rationale: The Hebrew idiom בן שנה normally means 'one year old,' but in this regnal formula the surviving text appears defective. An editorial gap avoids presenting Saul's accession age as one while the note preserves the literal Masoretic wording.
- source_word: שָׁאוּל
  chosen: Saul
  rationale: Standard English transliteration of the personal name.
- source_word: בְּמָלְכוֹ
  chosen: when he became king
  alternatives:
  - in his reigning
  - when he reigned
  lexicon: HALOT
  rationale: The preposition plus infinitive/verb form marks the time of accession. 'When he became king' is idiomatic English and fits the accession formula.
- source_word: וּשְׁתֵּי שָׁנִים
  chosen: '[an unknown number] and two years'
  alternatives:
  - and two years
  - and for two years
  lexicon: HALOT
  rationale: The Masoretic text preserves 'two years,' but the full reign length is uncertain. The editorial gap marks the likely missing part of the regnal total while retaining the surviving numeral; the note also acknowledges the alternative that two years marks a point during the reign.
- source_word: מָלַךְ
  chosen: he reigned
  alternatives:
  - he was king
  lexicon: HALOT
  rationale: The verb מלך in the qal commonly means 'reign' or 'be king.' 'He reigned' is the most natural English rendering in this regnal formula.
- source_word: עַל יִשְׂרָאֵל
  chosen: over Israel
  alternatives:
  - upon Israel
  lexicon: HALOT
  rationale: 'Standard rendering of על with a verb of ruling: ''over Israel.'''
