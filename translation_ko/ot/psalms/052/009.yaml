base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/009.yaml
  text: But as for me, I am like a flourishing olive tree[a] in the house of God; I trust in the steadfast love[b] of God forever and ever.
  footnotes:
  - marker: a
    text: Or 'green olive tree' or 'fresh olive tree.' The Hebrew adjective emphasizes verdant vitality.
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' renders Hebrew hesed, often referring to God''s loyal, covenantal love; alternatives include ''lovingkindness,'' ''mercy,'' or ''covenant love.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 하나님의 집에 있는 푸르른 감람나무[a] 같습니다. 나는 하나님의 한결같은 사랑을[b] 영원무궁토록 의지합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무성한 감람나무’, ‘싱싱한 감람나무’. 히브리어 형용사는 푸르고 생기 있는 모습을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 헤세드(חֶסֶד)를 옮긴 말입니다. 이는 자비, 인애, 신실한 사랑으로도 번역될 수 있으며, 특히 지속적이고 충실한 사랑을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
