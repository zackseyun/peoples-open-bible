id: PSA.55.21
reference: Psalms 55:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָלְק֤וּ מַחְמָאֹ֣ת פִּי/ו֮ וּֽ/קֲרָב לִ֫בּ֥/וֹ רַכּ֖וּ דְבָרָ֥י/ו מִ/שֶּׁ֗מֶן וְ/הֵ֣מָּה פְתִחֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/021.yaml
  text: The words of his mouth are smooth[a], but his heart is war; his words are softer than oil[b], yet they are drawn swords.
  footnotes:
  - marker: a
    text: Or 'flattering words come from his mouth'; the Hebrew expression is rare and may more specifically emphasize buttery or flattering speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'unsheathed swords.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 입에서 나오는 말은 매끄럽지만[a], 그의 마음에는 전쟁이 있습니다. 그의 말은 기름보다 부드러우나, 그 말들은 뽑힌 칼들입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 입에서는 아첨하는 말이 나옵니다.’ 히브리어 표현은 드물며, 매끄럽고 기름진 듯한 말을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘칼집에서 나온 칼들입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח יָדָיו
  english_pob_choice: He stretched out his hands
  chosen_korean: 손을 뻗었습니다
  alternatives_korean:
  - 손을 내밀었습니다
  - 손을 펼쳤습니다
  - 손을 뻗어 공격했습니다
  lexicon: HALOT
  rationale: יד와 יחד된 שׁלח는 문자적으로 ‘손을 뻗다’의 몸짓을 살리되, 문맥상 적대적 행위를 자연스럽게 드러냅니다. ‘공격했습니다’는 해석이 강해 원문의 이미지가 약해집니다.
- source_word: בִּשְׁלֹמָיו
  english_pob_choice: against those at peace with him
  chosen_korean: 자기와 평화로운 이들
  alternatives_korean:
  - 자기 친구들
  - 자기 동맹자들
  - 자기와 좋은 관계에 있던 이들
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 감정적 우정보다 평화적 관계를 가리키므로, ‘평화로운 이들’이 관계의 뉘앙스를 가장 잘 보존합니다. 전치사상의 적대 방향은 앞뒤 문맥이 분명히 드러냅니다.
- source_word: חִלֵּל
  english_pob_choice: profaned
  chosen_korean: 더럽혔습니다
  alternatives_korean:
  - 모독했습니다
  - 더럽혔습니다
  - 훼손했습니다
  lexicon: HALOT
  rationale: חלל의 핵심은 거룩하지 않은 것으로 ‘더럽히다/모독하다’입니다. 한국어에서는 ‘더럽혔습니다’가 언약의 신성한 성격을 살리면서도 ‘깨뜨렸습니다’보다 원문의 도덕·종교적 무게를 더 잘 드러냅니다.
- source_word: בְּרִיתוֹ
  english_pob_choice: his covenant
  chosen_korean: 자기 언약
  alternatives_korean:
  - 그의 언약
  - 자기 계약
  - 그가 맺은 언약
  lexicon: HALOT
  rationale: בְּרִית는 일반적인 ‘계약’보다 언약이란 종교적·관계적 어휘를 유지하는 것이 적절합니다. 소유격은 ‘자기’로 옮겨 원문의 압축성을 살렸습니다.
theological_decisions:
- issue: בְּשְׁלֹמָיו의 관계 의미
  chosen_reading: ‘자기와 평화로운 이들’로 옮겨, 단순한 친구 관계보다 평화적 관계의 배신이라는 의미를 살렸습니다.
  alternative_readings:
  - ‘자기 친구들’
  - ‘자기 동맹자들’
  rationale: 시편의 문맥은 개인적 호감의 배반보다 평화 관계의 파괴를 강조합니다. 따라서 관계의 질을 드러내되, 너무 좁은 사회적 범주로 제한하지 않았습니다.
  doctrine_reference: 시편 55편 문맥
