translation:
  text: 'III.1. I say, “Sir, I do not understand these parables, nor can I grasp them unless you explain
    them to me.”


    III.2. “I will explain everything to you,” he says, “and whatever I speak with you, I will show you.
    Keep the Lord’s commandments, and you will be pleasing to God and enrolled among those who keep his
    commandments[a].”


    III.3. “But if you do something good beyond God’s commandment[b], you will gain greater glory for
    yourself and be more glorious before God than you would have been. So if, while keeping God’s commandments,
    you add these services as well, you will rejoice, if you observe them according to my command.”


    III.4. I say to him, “Sir, whatever you command me, I will keep it, for I know that you are with me.”
    “I will be with you,” he says, “because you have such eagerness to do good. And I will also be with
    all who have such eagerness[c],” he says.


    III.5. “This fast,” he says, “is very good when the Lord’s commandments are kept. So this is how you
    will observe this fast that you are about to keep[d].”


    III.6. “First of all, guard yourself against every evil word and every evil desire, and cleanse your
    heart of all the vanities of this age. If you keep these things, this fast will be complete for you.”


    III.7. “This is what you will do: after carrying out what is written[e], on the day you fast, taste
    nothing except bread and water. Calculate the cost of the food you would have eaten—the expense you
    would have incurred that day—and give that amount to a widow, an orphan, or someone in need. In this
    way you will humble yourself, so that through your humility the recipient may fill his own soul and
    pray for you to the Lord[f].”


    III.8. “If, then, you complete the fast in this way as I commanded you, your sacrifice will be acceptable
    to God, and this fast will be recorded. Service performed in this way is good and cheerful and welcome
    to the Lord[g].”


    III.9. “Observe these things in this way, you with your children and your whole household. If you
    keep them, you will be blessed. All who hear them and keep them will be blessed, and whatever they
    ask from the Lord they will receive[h].”


    IV.1. I pleaded with him earnestly to explain to me the parable of the field, the master, the vineyard,
    the servant who fenced the vineyard, the stakes[i], the weeds pulled out of the vineyard, the son,
    and the friends who were advisers. For I understood that all these things formed a parable.


    IV.2. He answered me, “You are very insistent in your questioning. You ought not,” he says[j], “to
    ask anything at all. For if you need something explained, it will be explained.” I say to him, “Sir,
    whatever you show me without explaining it, I will have seen in vain, without understanding what it
    is. Likewise, if you tell me parables without explaining them to me, I will have heard something from
    you in vain.”


    IV.3. Again he answered me, saying, “Whoever is God’s servant and has his own Lord in his heart asks
    him for understanding and receives it[k]. He explains every parable, and the Lord’s words spoken through
    parables become known to him. But those who are weak and idle in prayer hesitate to ask from the Lord.”


    IV.4. “Yet the Lord is very compassionate and gives without ceasing to all who ask him[l]. But you
    have been strengthened by the holy angel and have received such intercession from him[m], and you
    are not idle. Why do you not ask the Lord for understanding and receive it from him?”


    IV.5. I say to him, “Sir, since I have you with me, I must ask you and question you. For you show
    me everything and speak with me. But if I were seeing or hearing these things apart from you, I would
    ask the Lord to have them explained to me[n].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The vertical bars in working III.2 mark a passage supplied by Gebhardt from versions against
      the reported Athos similar-ending omission. Michigan917 printed49–50 partly preserves this command-keeping,
      pleasing-to-God and enrollment passage, though damaged letters remain supplied. Both printed Latin
      versions contain its sense. A version-based restoration now has partial Greek corroboration; do
      not call all its letters preserved.
  - marker: b
    reason: lexical_alternative
    text: Beyond God’s commandment renders ektos in the extra-good-work context, not permission to break
      a command. The comparative glory and conditional joy are retained without adding a later theological
      system. No new lexicon lookup is claimed.
  - marker: c
    reason: textual_variant
    text: Working III.4 says all who have such eagerness. Michigan printed50 has all who have the same
      eagerness, with a different conditional construction; Vulgata printed80 likewise has such a purpose.
      The working source is retained without silently conflating the variants.
  - marker: d
    reason: textual_variant
    text: Working III.5 brackets that you are about to keep. Michigan printed50–51 lacks this phrase and
      the preceding this, judged by the edition’s page spacing; the Latin versions also differ in this
      transition. The disclosed bracketed phrase is retained in the working translation.
  - marker: e
    reason: textual_variant
    text: Working III.7 what is written differs from Michigan printed51 what was written before, partly
      supplied, and Palatina printed147 what you have heard. Vulgata printed80 has what is written above.
      The draft retains the working wording without naming an additional document or inventing its contents.
  - marker: f
    reason: lexical_alternative
    text: Working III.7 requires calculating the saved food expense and giving it to a widow, orphan or
      person in need. Tapeinophrosyne is humility, not the old reader’s prudence or an added set of instructions.
      Fill his own soul preserves the working image of the recipient being satisfied; satisfy himself
      is a contextual alternative. Michigan printed51–52 uses a different calculating verb, adds setting
      aside, and partly preserves this giving/humility passage. Its prayer verb is damaged; both Latin
      versions expand or recast the prayer, and Palatina has your prayer going to the Lord. These alternatives
      are not silently inserted.
  - marker: g
    reason: textual_variant
    text: Working III.8 has as I commanded; Michigan printed53 has as I command. Working God at the sacrifice
      differs from Lord in both printed Latin versions. The working good and cheerful service is retained;
      no claim of universal verb-tense or title agreement is made.
  - marker: h
    reason: textual_variant
    text: The1891 editor conjectured ask in III.9 against reported Athos will hear. Michigan printed53
      papyrus10 line12 partly preserves the ask form (final iota supplied), directly corroborating asking,
      and both Latin versions have ask/receive. This is corroboration of an existing working choice, not
      a new source-body selection. The old reader incorrectly joined this unrestricted whatever-they-ask
      promise to IV.4’s understanding clause. Vulgata printed80 also has saved for the first blessing,
      whereas the working Greek has blessed.
  - marker: i
    reason: textual_variant
    text: Working IV.1 brackets and the stakes. Michigan printed53 partly preserves that phrase; both
      printed Latin versions omit a separate stakes item in this list while retaining the vineyard work.
      The working Greek item is retained and disclosed.
  - marker: j
    reason: textual_variant
    text: Working IV.2 brackets he says; Michigan printed54 partly preserves this dialogue tag. The strong
      instruction not to ask anything at all and Hermas’s objection are both restored without softening
      or resolving the tension for him.
  - marker: k
    reason: textual_variant
    text: Working IV.3 retains Gebhardt’s from him correction against reported Athos with him; Michigan
      printed55 partly preserves from him. The same printed papyrus has other damaged differences around
      the Lord’s words and their becoming known; both Latin versions directly retain asks/receives and
      explaining every parable. This draft keeps the full working claim and the contrast with hesitation.
  - marker: l
    reason: textual_variant
    text: Working IV.4 has without ceasing; Michigan printed55 instead has without hesitation, preserved
      in the main word with a supplied initial tau in the preceding article. Both printed Latin versions
      have sine intermissione (without interruption), corroborating the working sense. The two adverbs
      have different meanings; the draft retains the working one and reports the alternative rather than
      silently harmonizing it.
  - marker: m
    reason: lexical_alternative
    text: Enteuxis in IV.3–4 can mean prayer/intercession or access/intercourse. The draft uses prayer
      for the activity and intercession for what is received from the angel; access is a contextual alternative.
      Both Latin versions render the received item as a powerful prayer, but that adjective is not added
      to the Greek translation. Working holy angel contrasts with Michigan printed56 glorious angel; Latin
      venerable does not establish the exact Greek adjective.
  - marker: n
    reason: textual_variant
    text: Working IV.5 retains seeing or hearing. Michigan printed56 partly preserves both; Palatina printed151
      omits hearing. Vulgata printed82 retains both. The hypothetical request is not made into a claim
      that Hermas has already acted without the shepherd.
lexical_decisions:
- source_word: ἐκτὸς τῆς ἐντολῆς
  chosen: beyond the commandment
  alternatives:
  - in addition to the commandment
  lexicon: Working Greek and bounded edition context; no new lexicon lookup.
  rationale: Preserve additional good work without implying violation of the command.
- source_word: ταπεινοφροσύνη / ψυχή
  chosen: humility / soul
  alternatives:
  - humbleness / self
  lexicon: Selected working source and direct Latin comparison; no new lexicon lookup.
  rationale: Remove the old prudence/instructions interpolation and preserve giving leading to satisfaction
    and prayer.
- source_word: ἔντευξις
  chosen: prayer / intercession
  alternatives:
  - access
  - intercourse
  lexicon: Working Greek and directly consulted Latin prayer wording; no new lexicon lookup.
  rationale: Keep the activity and received benefit while disclosing semantic alternatives and not adding
    Latin powerful.
- source_word: δοῦλος
  chosen: servant
  alternatives:
  - enslaved servant
  lexicon: Current project policy and working Greek.
  rationale: Preserve belonging to God and the parable’s bonded service without changing reader terminology
    policy.
