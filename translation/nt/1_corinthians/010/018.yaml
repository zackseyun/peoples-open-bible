theological_decisions:
- issue: Meaning of 'Israel according to the flesh'
  chosen_reading: A reference to ethnic/natural Israel in contrast to a more spiritual or typological category, without making a broader doctrinal claim beyond this context.
  alternative_readings:
  - Israel in merely outward terms
  - the Jewish people as distinguished from the church
  rationale: Paul's phrase most naturally denotes Israel by physical descent here, serving as an analogy from sacrificial practice. The translation preserves the phrase's tension rather than resolving larger theological debates about Israel and the church.
