  rationale: '“My mark” is preferable to the falsely precise modern term “my signature”; תָּו denotes a mark or sign, although it functions here as Job’s attestation. The proposed past-perfect final wish (“If only my accuser had written”) is not required by כָּתַב and is less suitable in this coordinated challenge. In context, the clause can naturally continue the volitive appeal: Job calls for the opposing party to produce a written charge. “Accuser” and “indictment” are defensible contextual renderings, but the more literal document-and-opponent wording should be noted.'
