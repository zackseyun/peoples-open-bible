  - strictly literal astronomical dissolution
  rationale: The verse uses elevated prophetic poetry describing divine judgment in cosmic terms. The translation should preserve the force and ambiguity of the imagery rather than resolve whether it is metaphorical, literal, or both.
  doctrine_reference: Preserve theological tension rather than resolve it.
