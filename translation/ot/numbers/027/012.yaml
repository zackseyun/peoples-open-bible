  from: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
  to: Then Yahweh said to Moses, “Go up this mountain in the Abarim range and see the land that I have given to the Israelites.”
  rationale: The earlier record treats Abarim as a place name and acknowledges both the range and the national sense of 'sons of Israel.' I retain the established divine grant, 'I have given,' while making the geography and recipients explicit.
