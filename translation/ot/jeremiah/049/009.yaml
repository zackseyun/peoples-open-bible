  meaning_decisions:
  - source_phrase: לֹא יַשְׁאִירוּ עוֹלֵלוֹת
    prior_rendering: would they not leave gleanings?
    new_rendering: would they not leave some grapes behind?
    rationale: The comparison depends on grapes remaining after harvest; stating that directly makes the point clear without requiring knowledge of agricultural terminology.
  - source_phrase: הִשְׁחִיתוּ דַיָּם
    prior_rendering: they would destroy only enough for themselves
    new_rendering: they would plunder only until they had enough
    rationale: The thieves’ destructive activity is limited by how much they take, not by an amount of destruction they need for themselves.
