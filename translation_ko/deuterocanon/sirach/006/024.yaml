review_pass:
  verdict: revise
  source_fidelity: 그리스어 병행본문은 ‘그녀의 족쇄에 네 발을, 그녀의 κλοιός에 네 목을 넣으라’고 하며 영문 POB와 일치합니다. 다만 제시된 히브리어 전승은 농경과 성향에 관한 전혀 다른 격언이므로, 본문이 그리스어 계열을 따름을 각주에서 명확히 밝혀야 합니다.
  naturalness: ‘목걸이’는 현대 한국어에서 장식용 장신구를 우선 뜻하므로 속박 도구인 κλοιός의 의미를 전달하지 못합니다. ‘목고리’는 목에 씌우는 구속용 고리라는 문맥을 자연스럽게 전달합니다.
  terminology: ‘족쇄’는 πέδας에 적절합니다. κλοιός에는 ‘목고리’를 사용하여 장식품인 ‘목걸이’와 구별합니다.
  issues:
  - severity: high
    issue: ‘목걸이’가 κλοιός의 구속 장치 의미를 장식용 목걸이로 바꿉니다.
    rationale: κλοιός는 목에 씌우는 고리·굴레·멍에 계열의 속박물을 뜻하며, 영어 ‘collar’도 이 문맥에서는 장식품이 아닙니다.
  - severity: high
    issue: 각주가 히브리어와 그리스어 전승 사이의 실질적인 본문 차이를 지나치게 완화합니다.
    rationale: 제시된 히브리어는 단지 ‘농경처럼 보이는 어휘’가 아니라, 족쇄와 목고리의 은유와 다른 농경·성향 격언을 전합니다. 독자가 본문 선택을 판단할 수 있도록 이를 밝혀야 합니다.
  revised_text: 그녀의 족쇄에 네 발을 넣고, 그녀의 목고리에 네 목을 넣으십시오.[a]
  revised_footnotes:
  - marker: a
    text: 제시된 히브리어 전승은 “나무를 가꾸는 수고에 열매가 있듯이, 한 사람의 생각은 그의 성향에 달려 있다”라는 이질적인 격언을 전합니다. 여기의 번역은 영문 POB를 따라, ‘그녀의 족쇄’와 ‘그녀의 목고리’를 읽는 그리스어 병행본문을 따릅니다.
    reason: textual_variant
  revision_rationale: 그리스어 및 영문 POB의 속박 은유를 유지하되, κλοιός를 장식품으로 오해하게 하는 ‘목걸이’를 ‘목고리’로 바로잡았습니다. 또한 히브리어와 그리스어 전승의 현저한 차이를 정확히 알리는 각주로 본문상의 불확실성을 보존했습니다.
