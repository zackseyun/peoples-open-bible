translation:
  text: In those days[a] the kings of the earth and the mighty who hold the dry land were downcast in face because
    of the work of their hands, for they will not save themselves in the day of their pressure and distress.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected opening actually prints the daggered በ†ክንቱ, not a sound phrase in those days. Charles printed91
      note15 calls it corrupt and reports በውእቱ for m, t and β. This English adopts that reported Ethiopic opening,
      in those days; the source preserves the damaged selected form unchanged. Charles also proposes that ክንቱ is
      corrupt for ዝንቱ, but this English does not pretend that conjecture is the selected main reading or a freshly
      collated manuscript. The rest of the verse retains the downward state and the negative future salvation clause.
    reason: textual_variant
