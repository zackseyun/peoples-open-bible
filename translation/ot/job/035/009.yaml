id: JOB.35.9
reference: Job 35:9
source:
  edition: WLC
  text: מֵ֭/רֹב עֲשׁוּקִ֣ים יַזְעִ֑יקוּ יְשַׁוְּע֖וּ מִ/זְּר֣וֹעַ רַבִּֽים׃
translation:
  text: People cry out under heavy oppression; they call for relief from the strong arm of the mighty.
  philosophy: dynamic
lexical_decisions:
- source_word: מֵרֹב
  chosen: Because of the multitude of
  alternatives:
  - From the abundance of
  - Because of the many
  lexicon: HALOT
  rationale: 'The preposition מִן with רֹב here expresses cause/source: the cries arise because of the abundance or multitude of something. ''Because of the multitude of'' is natural English while preserving the causal force.'
- source_word: עֲשׁוּקִים
  chosen: oppressions
  alternatives:
  - oppressed acts
  - extortions
  lexicon: HALOT
  rationale: The passive participial/plural form from עשק denotes acts or instances of oppression in context, not primarily the oppressed persons themselves. 'Oppressions' best fits the construction with מֵרֹב and explains why the following verbs are plural and indefinite.
- source_word: יַזְעִיקוּ
  chosen: people cry out
  alternatives:
  - they cry aloud
  - they cause a cry
  lexicon: HALOT
  rationale: Generic “people” naturally represents the indefinite third-person plural in English.
- source_word: יְשַׁוְּעוּ
  chosen: they call for help
  alternatives:
  - they cry for help
  - they implore
  lexicon: HALOT
  rationale: The verb שוע in Piel conveys a plea for aid. Using 'call for help' distinguishes it slightly from the previous 'cry out' while preserving the parallelism.
- source_word: מִזְּרֹעַ
  chosen: because of the arm of
  alternatives:
  - from the arm of
  - because of the power of
  lexicon: HALOT
  rationale: זְרוֹעַ literally means 'arm' and often metaphorically denotes strength or power. Retaining 'arm' preserves the Hebrew image; the preposition again is causal/source-like, hence 'because of' rather than a strictly spatial 'from'.
- source_word: רַבִּים
  chosen: the mighty
  alternatives:
  - the great
  - the many
  - great men
  lexicon: HALOT
  rationale: In this context רַבִּים refers not to a numerical many but to powerful people, those whose 'arm' oppresses. 'The mighty' captures the social-power sense and fits the verse's concern with oppression.
- source_word: מֵרֹב עֲשׁוּקִים
  chosen: Because of many oppressions
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This expresses the causal force of מִן with רֹב and retains the plural noun without adding the more specific “acts.”
- source_word: מִזְּרֹעַ רַבִּים
  chosen: because of the arm of the mighty
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The causal sense is fitting in context, while “arm” preserves the Hebrew image and “the mighty” conveys the contextual force of רַבִּים.
