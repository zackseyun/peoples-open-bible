id: ROM.8.6
reference: Romans 8:6
source:
  edition: SBLGNT
  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
translation:
  text: For the mind governed by the flesh is death, but the mind governed by the Spirit is life and peace.
  philosophy: dynamic
lexical_decisions:
- source_word: γὰρ
  chosen: For
  alternatives:
  - because
  - indeed
  lexicon: BDAG
  rationale: Retains the explanatory force linking this statement to the preceding argument without sounding overly formal.
- source_word: φρόνημα
  chosen: mindset
  alternatives:
  - mind
  - way of thinking
  - outlook
  lexicon: BDAG
  rationale: “Mindset” captures not merely intellect but a settled orientation or disposition, which fits Paul's ethical contrast here.
- source_word: σάρξ
  chosen: flesh
  alternatives:
  - sinful nature
  lexicon: BDAG
  rationale: The doctrine guidance gives “flesh” as the default literal rendering and allows “sinful nature” in metaphorical contexts. Here the term is metaphorical, but “flesh” better preserves Paul's key term and theological tension; the interpretive alternative is preserved in a footnote.
- source_word: θάνατος
  chosen: death
  alternatives:
  - deadness
  lexicon: BDAG
  rationale: “Death” is the direct and standard rendering, preserving both literal and theological weight without interpretive expansion.
- source_word: πνεῦμα
  chosen: Spirit
  alternatives:
  - spirit
  lexicon: BDAG
  rationale: In Romans 8 the contrast is not merely between two human dispositions but between the flesh and the Holy Spirit's sphere and influence. Capitalization reflects that contextual judgment while documenting the alternative.
- source_word: ζωή
  chosen: life
  lexicon: BDAG
  rationale: Direct rendering that preserves Paul's compact antithesis with “death.”
- source_word: εἰρήνη
  chosen: peace
  lexicon: BDAG
  rationale: Standard rendering that naturally pairs with “life” and preserves the clause's theological breadth.
