base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/005.yaml
  text: 'Go and say to Hezekiah, ‘Thus says the LORD, the God of David your father: I have heard your prayer; I have seen your tears. Look, I will add fifteen years to your days.’'
translation:
  language: ko
  text: 가서 히스기야에게 말하십시오. “야훼, 곧 네 조상 다윗의 하나님께서 이렇게 말씀하십니다. ‘내가 네 기도를 들었고 네 눈물을 보았습니다. 보십시오, 내가 네 날들에 열다섯 해를 더하겠습니다.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָל֞וֹךְ וְ/אָמַרְתָּ֣ אֶל
  english_pob_choice: Go and say to
  chosen_korean: 가서 …에게 말하십시오
  alternatives_korean:
  - 가서 …에게 말하시오
  - 가서 …에게 말하세요
  lexicon: הלך + אמר
  rationale: 명령형 연쇄를 현대 합쇼체로 자연스럽게 옮기되, 파송받은 전달 행위라는 직접성을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: יהוה
  rationale: 프로젝트 기본값에 따라 신명은 학술적 음역인 야훼로 옮겨, 본문의 직접적인 언약명 사용을 드러냈습니다.
- source_word: שָׁמַעְתִּי אֶת תְּפִלָּתֶךָ רָאִיתִי אֶת דִּמְעָתֶךָ
  english_pob_choice: I have heard your prayer; I have seen your tears
  chosen_korean: 나는 네 기도를 들었고, 네 눈물을 보았습니다
  alternatives_korean:
  - 네 기도를 들었으며 네 눈물을 보았다
  - 네 기도를 들었고 네 눈물을 살폈습니다
  lexicon: תפלה / דמעה
  rationale: 기도와 눈물을 각각 직접 목적어로 살려, 하나님의 응답과 연민이 병렬로 제시된 구조를 보존했습니다.
- source_word: הִנְנִי יוֹסִף עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  english_pob_choice: Look, I will add fifteen years to your days
  chosen_korean: 보십시오, 내가 네 수명에 열다섯 해를 더하겠습니다
  alternatives_korean:
  - 보라, 내가 네 날들에 열다섯 해를 더하겠습니다
  - 보십시오, 내가 네 날들에 열다섯 해를 더하겠습니다
  lexicon: הנני + יסף + ימים
  rationale: 히브리어 관용구를 자연스럽게 풀어 말하되, '날들'의 시간적 은유를 한국어에서 더 분명한 '수명'으로 옮겨 의미를 분명히 했습니다.
theological_decisions:
- issue: 야훼의 자기계시와 예언자적 전달 공식
  chosen_reading: ‘야훼께서, 네 아버지 다윗의 하나님께서 이렇게 말씀하십니다’로 옮겨, 신명과 관계적 호칭을 함께 보존했습니다.
  alternative_readings:
  - ‘주께서…’로 일반화
  - ‘여호와께서…’로 교회 전통 용어를 사용
  rationale: 본문은 단순한 호칭이 아니라 야훼의 언약적 발화임을 드러내므로, 신명과 ‘다윗의 하나님’을 함께 유지하는 편이 원문 의미를 가장 잘 전달합니다.
  doctrine_reference: 출 3:15; 사 38:5
