  meaning: Previously fearless enemies are overtaken by terror, defeat, and disgrace because God has rejected them.
  meaning_decisions:
  - source_phrase: לֹא הָיָה פָחַד
    prior_rendering: though there was nothing to fear
    new_rendering: where there had been no fear
    rationale: The narrative of divine defeat supports a sudden reversal from fearlessness to terror. This reading avoids asserting that there was objectively no danger even as God destroyed the attackers; the established alternative remains in a footnote.
  - source_phrase: חֹנָךְ
    prior_rendering: the one encamping against you
    new_rendering: the army encamped against you
    rationale: The hostile encampment and subsequent plural reference indicate an attacking force. Rendering the singular description collectively makes the military scene clear without losing the encampment image.
  - source_phrase: הֱבִשֹׁתָה
    prior_rendering: You put them to shame; the footnote identifies God as the likely addressee.
    new_rendering: You put them to shame; the footnote allows Israel or God as the addressee.
    rationale: The masculine address can refer to Israel following a feminine address to Zion, or mark a turn to God. The grammatical shift does not establish the speaker’s choice, so the translation preserves the uncertainty.
  footnote_kinds:
    a: alternative_meaning
    b: cultural_background
    c: alternative_meaning
