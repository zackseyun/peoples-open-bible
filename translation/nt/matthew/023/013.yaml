  meaning_decisions:
  - source_phrase: γραμματεῖς καὶ Φαρισαῖοι
    prior_rendering: scribes and Pharisees
    new_rendering: teachers of the law and Pharisees
    rationale: As in verse 2, this identifies the scribes’ relevant role as teachers and interpreters of the law.
  - source_phrase: κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων
    prior_rendering: you shut the kingdom of heaven before people
    new_rendering: you shut the door to the kingdom of heaven in people’s faces
    rationale: The source depicts closing off entrance to the kingdom; making the implied door explicit preserves the image and clarifies that people are being barred, not merely witnessing a closure.
  - source_phrase: ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε εἰσελθεῖν
    prior_rendering: for you do not enter, nor do you allow those who are entering to enter
    new_rendering: You yourselves do not enter, and you do not let those trying to enter go in
    rationale: “Yourselves” conveys the emphatic pronoun, while “trying to enter” expresses the ongoing approach frustrated by the leaders; the English no longer suggests that entry has already succeeded.
