  naturalness: ‘사태를 수습하려고 급히 와서’와 ‘고위직에 있던 사람들 가운데 한 사람인’은 현대 표준 한국어의 격식 있는 역사 서술에 자연스럽습니다. ‘자기 후임’은 선행 주어인 왕의 후계자라는 뜻으로 읽히기 쉬워 문맥상 부정확할 수 있으므로 피하는 것이 좋습니다.
