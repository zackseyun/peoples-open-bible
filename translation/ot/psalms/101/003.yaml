  meaning_decisions:
  - source_phrase: לֹא אָשִׁית לְנֶגֶד עֵינַי דְּבַר בְּלִיַּעַל
    prior_rendering: I will not set any worthless thing before my eyes
    new_rendering: I will not set my sights on anything wicked
    rationale: In this declaration of righteous conduct, setting something before one’s eyes concerns intentional attention and pursuit, not simply looking at an object. “Wicked” makes the moral force of beliyyaʿal clear, whereas “worthless” can suggest merely useless or trivial things.
  - source_phrase: עֲשֹׂה סֵטִים
    prior_rendering: the work of those who turn aside
    new_rendering: the deeds of those who turn from the right way
    rationale: The turning is moral deviation, not movement in an unspecified direction; the clarification preserves the way imagery while making its meaning explicit.
  - source_phrase: לֹא יִדְבַּק בִּי
    prior_rendering: it will not cling to me
    new_rendering: such evil will not cling to me
    rationale: Naming the rejected evil clarifies the reference of “it” while retaining the image of corrupt conduct attaching itself to the speaker.
