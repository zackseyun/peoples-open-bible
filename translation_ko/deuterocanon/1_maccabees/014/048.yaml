  text: And they said that this document should be put on bronze tablets and set up in the court of the sanctuary, in a secure place.
translation:
  language: ko
  text: 그리고 그들은 이 기록을 청동 판들[a]에 새기고, 그것들을 성소의 뜰[b] 안에 있는 안전한 곳[c]에 세워 두라고 말하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: δέλτοις χαλκαῖς는 ‘청동 판들’을 뜻합니다. 이 문맥에서는 기록을 판에 남기고 그 판들을 세우는 일을 가리킵니다.
    reason: source_note
  - marker: b
    text: περιβόλῳ τῶν ἁγίων은 성소 또는 성전 구역의 뜰을 가리키는 표현으로 이해했습니다.
    reason: source_note
  - marker: c
    text: τόπῳ πιστῷ는 믿을 만하고 안전한 장소를 뜻하는 표현으로, 여기서는 ‘안전한 곳’으로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: γραφὴν ταύτην
  english_pob_choice: this document
  chosen_korean: 그 문서
  alternatives_korean:
  - 이 기록
  - 이 문서
  lexicon: γραφὴ
  rationale: 여기서는 성문서가 아니라 앞선 결정문 자체를 가리키므로, 의미를 드러내는 ‘문서’가 가장 자연스럽습니다.
- source_word: θέσθαι ἐν δέλτοις χαλκαῖς
  english_pob_choice: be put on bronze tablets
  chosen_korean: 청동 판들에 놓고
  alternatives_korean:
  - 청동 판들에 새기고
  - 청동 판들에 적어 두고
  lexicon: θέσθαι
  rationale: 동사는 단순히 ‘두다/놓다’의 행위에 초점이 있어, POB의 ‘be put’을 살리며 새김 여부를 과도하게 단정하지 않도록 했습니다.
- source_word: ἐν περιβόλῳ τῶν ἁγίων
  english_pob_choice: in the court of the sanctuary
  chosen_korean: 성소 뜰 안
  alternatives_korean:
  - 성소의 뜰 안
  - 성전 뜰 안
  lexicon: περίβολος τῶν ἁγίων
  rationale: ἁγίων은 이 문맥에서 성전/성소 공간을 가리키므로 ‘성소 뜰’로 옮겨 장소성을 분명히 했습니다.
- source_word: τόπῳ πιστῷ
  english_pob_choice: in a secure place
  chosen_korean: 안전한 곳
  alternatives_korean:
  - 신실한 곳
  - 믿을 만한 곳
  lexicon: πιστός
  rationale: 장소를 수식하는 πιστός는 ‘믿을 수 있는/안전한’ 의미가 자연스러워, 보관 장소의 안전성을 드러내는 표현을 택했습니다.
