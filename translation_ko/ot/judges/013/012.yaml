  source_fidelity: 원문은 마노아가 천사에게 직접 말하며, 그의 말이 이루어지기를 바라거나 그때를 전제한 뒤 아이에게 적용될 규례와 그가 할 일을 묻는 내용입니다. 초안의 ‘대답하여’, ‘주께서’, ‘처사’, ‘어떻게 할 것이요’는 각각 원문의 발화 동사, 청자, 명사 의미, 의문문의 범위를 부정확하게 옮기거나 지나치게 고어적입니다.
  naturalness: 현대 표준어 합쇼체로 직접 인용을 구성하고, ‘규례’와 ‘그가 할 일’로 자연스럽고 분명하게 다듬었습니다.
  terminology: מִשְׁפָּט은 이 문맥에서 아이에게 적용될 정해진 규정 또는 방식이므로 ‘규례’로 옮겼습니다. מַעֲשֶׂהוּ는 넓게 ‘그가 할 일’로 옮겨 구체적 직업이나 사명으로 한정하지 않았습니다. 원문의 청자를 보존하여 ‘주께서’ 대신 ‘당신의’로 옮겼습니다.
  issues:
  - severity: high
    issue: 청자를 ‘주께서’로 변경함
    rationale: 원문은 마노아가 상대방에게 ‘당신의 말씀’이라고 직접 말합니다. 본문은 아직 그 상대를 ‘여호와’라고 명시하지 않으므로, ‘주께서’는 원문에 없는 신학적 식별을 도입합니다.
  - severity: medium
    issue: ‘대답하여’ 및 ‘처사와 그 행할 일을 어떻게 할 것이요’
    rationale: וַיֹּאמֶר는 단순히 ‘말하였다’이며, מִשְׁפַּט은 ‘처사’가 아니라 아이에게 적용될 규례·방식입니다. מַה יִּהְיֶה는 두 명사구에 관해 ‘무엇입니까’라고 묻습니다.
  - severity: medium
    issue: 현대 합쇼체와 맞지 않는 고어적 문체
    rationale: ‘이르되’, ‘이루어지리이다’, ‘것이요’는 지정된 현대 formal-polite 문체보다 고전 번역체에 가깝습니다.
  revised_text: 마노아가 말했습니다. “이제 당신의 말씀이 이루어지기를 바랍니다.[a] 그 아이에게 적용될 규례와 그가 할 일은 무엇입니까?”
  revised_footnotes:
