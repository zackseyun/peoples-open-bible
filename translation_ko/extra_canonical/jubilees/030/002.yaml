  text: And there Shechem[2], the son of Hamor the Hivite, the prince of the land, saw Dinah, Jacob's daughter, and he seized her and lay with her and defiled her, and she was a young girl.
  footnotes:
  - marker: '2'
    text: The final clause of v.2 literally indicates that Dinah was a young girl; v.3 then specifies that she was twelve years old.
    reason: lexical_alternative
  - marker: a
    text: Or 'humbled her'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그곳에서 하몰의 히위 사람 아들, 그 땅의 통치자인 세겜이 야곱의 딸 디나를 보고 그녀를 붙잡아 함께 동침하고 더럽혔습니다. 그리고 그녀는 어린 소녀였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሰላም፡ በ፮ብዕ፡ ወርኅ
  english_pob_choice: And there
  chosen_korean: 그리고 그곳에서
  alternatives_korean:
  - 거기서
  - 그곳에
  lexicon: 지명/서술 부사구
  rationale: 서술의 장면 전환을 자연스럽게 살리되, Ge'ez의 장소 지시를 과장하지 않고 간결하게 옮겼습니다.
- source_word: መስተዋ፡ ለዲና፡ ወሰተ፡ ያዕቆብ፡ ውስተ፡ ቤተ፡ ሴኬም፡ ወልደ፡ ኤሞር፡ ኤዋዊ፡ መኰንነ፡ ምድር፡
  english_pob_choice: Shechem, the son of Hamor the Hivite, the prince of the land, saw Dinah, Jacob's daughter
  chosen_korean: 하몰의 히위 사람 아들, 그 땅의 통치자인 세겜이 야곱의 딸 디나를 보고
  alternatives_korean:
  - 히위 사람 하몰의 아들 세겜이…
  - 하몰의 히위 사람인 그 땅의 통치자 세겜이…
  lexicon: 고유명사/수식어구
  rationale: 원문의 동격 구조를 유지해 세겜, 하몰, 히위 사람, 그 땅의 통치자라는 정보가 모두 드러나게 했습니다.
- source_word: ወሰከበ፡ ምስሌሃ፡ ወአርኰሳ
  english_pob_choice: and he seized her and lay with her and defiled her
  chosen_korean: 그녀를 붙잡아 함께 동침하고 더럽혔습니다
  alternatives_korean:
  - 그녀를 붙잡아 그녀와 동침하고 더럽혔습니다
  - 그녀를 붙잡아 그녀와 관계하고 더럽혔습니다
  lexicon: 동사 연속구
  rationale: Ge'ez의 폭력적·성적 행위 연쇄를 따라 '붙잡아', '동침하고', '더럽혔습니다'로 직역보다 명료하게 옮겼습니다. '더럽혔습니다'는 주석 전통의 'humbled'보다 오염/부정의 의미를 더 정확히 반영합니다.
- source_word: ወይእቲሰ፡ ንስቲት
  english_pob_choice: and she was a young girl
  chosen_korean: 그리고 그녀는 어린 소녀였습니다
  alternatives_korean:
  - 그리고 그녀는 젊은 소녀였습니다
  - 그리고 그녀는 어린 아이였습니다
  lexicon: 연령 묘사
  rationale: POB의 최신 판정처럼 연령을 'young girl'로 읽어, 과도한 축소 없이 나이 어린 상태를 자연스러운 현대 한국어로 표현했습니다.
theological_decisions:
- issue: 성적 폭력 서술의 의미 강도
  chosen_reading: '''더럽혔습니다''로 옮겨, 단순한 ''모욕''이 아니라 의식적/도덕적 오염의 결과를 드러냈습니다.'
  alternative_readings:
  - 희롱했습니다
  - 수치스럽게 했습니다
  - 굴욕을 주었습니다
  rationale: Jubilees의 문맥에서는 디나의 부정과 오염이 핵심이므로, 원문의 defilement 의미를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 정결/부정, 성적 죄의 오염 개념(창세기 34장 및 희년서 30장 맥락)
