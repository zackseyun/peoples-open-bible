id: PRO.6.31
reference: Proverbs 6:31
source:
  edition: WLC
  text: וְ֭/נִמְצָא יְשַׁלֵּ֣ם שִׁבְעָתָ֑יִם אֶת כָּל ה֖וֹן בֵּית֣/וֹ יִתֵּֽן־־׃
translation:
  text: But when he is caught, he must repay sevenfold, even if it costs him all the wealth of his household.
  philosophy: dynamic
lexical_decisions:
- source_word: וְנִמְצָא
  chosen: But when he is caught
  alternatives:
  - But when he is found
  - and being found
  lexicon: HALOT
  rationale: In this theft context, the Niphal of מצא refers to the thief being discovered or caught; the conjunction marks the contrast with the sympathy mentioned in verse 30.
- source_word: יְשַׁלֵּם
  chosen: he must repay
  alternatives:
  - he shall surely pay
  - he will make restitution
  lexicon: HALOT
  rationale: Piel of שלם here denotes making restitution or repayment. 'Must repay' conveys the legal/obligatory sense in idiomatic modern English better than a simple future.
- source_word: שִׁבְעָתָיִם
  chosen: sevenfold
  alternatives:
  - seven times
  lexicon: HALOT
  rationale: The adverbial numeral denotes restitution multiplied by seven; “sevenfold” is concise and idiomatic, while the note preserves the equivalent alternative expression.
- source_word: אֶת כָּל הוֹן בֵּיתוֹ
  chosen: all the wealth of his house
  alternatives:
  - all the substance of his house
  - all the goods of his household
  - all the wealth in his house
  lexicon: HALOT
  rationale: הוֹן denotes wealth, substance, or possessions. 'All the wealth of his house' preserves the genitive structure and communicates total forfeiture of his household assets.
- source_word: יִתֵּן
  chosen: he must give
  alternatives:
  - he shall give
  - he will give
  lexicon: HALOT
  rationale: נתן here specifies the concrete act of handing over payment. Rendering with 'must give' maintains the obligatory force parallel to 'must repay'.
