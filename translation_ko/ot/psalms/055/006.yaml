  lexicon: HALOT
  rationale: 히브리어의 ‘들어오다/오다’는 경험이 사람을 사로잡는 뉘앙스가 있어, ‘임하다’가 보다 근접하면서도 한국어로 자연스럽습니다.
- source_word: פַּלָּצוּת
  english_pob_choice: horror
  chosen_korean: 공포
  alternatives_korean:
