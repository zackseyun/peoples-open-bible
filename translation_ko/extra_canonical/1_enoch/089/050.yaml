base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/050.yaml
  text: And that house became great and broad, and it was built for those sheep; and a lofty and great tower was built upon the house for the Lord of the sheep. And that house was low, but the tower was raised up and became lofty; and the Lord of the sheep stood upon that tower, and they set a full table before him.
translation:
  language: ko
  text: 그리고 그 집은 크고 넓어졌으며, 그 양들을 위하여 지어졌습니다. 또 그 집 위에는 양들의 주님을 위하여 높고 큰 탑이 세워졌습니다. 그 집은 낮았으나, 그 탑은 높이 들려 높아졌고, 양들의 주님께서 그 탑 위에 서셨습니다. 그들은 그분 앞에 가득 찬 상을 차려 놓았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቤት / house
  english_pob_choice: house
  chosen_korean: 집
  alternatives_korean:
  - 건물
  - 성전
  - 집
  lexicon: בית
  rationale: 본문은 단순한 '집'이 아니라 비유적 환상 속 구조물을 가리키지만, POB의 영어가 house를 유지하므로 한국어도 과도한 해석을 피하고 '집'으로 옮겼습니다.
- source_word: ዐቢየ / great, broad
  english_pob_choice: great and broad
  chosen_korean: 크고 넓게
  alternatives_korean:
  - 크고 넓은
  - 웅대하고 넓은
  - 크고 광활한
  lexicon: גדול/רחב
  rationale: 두 형용사를 병렬로 살려 규모의 확장과 넓이를 함께 드러내되, 문장 흐름상 자연스러운 보어형으로 처리했습니다.
- source_word: እግዚአ፡ አባግዕ / Lord of the sheep
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양들의 주
  alternatives_korean:
  - 양들의 주님
  - 양들의 주인
  - 양들의 주 하나님
  lexicon: 주권 호칭
  rationale: 원문의 소유격 표현을 따라 '양들의 주'로 직역해 이미지와 상징 체계를 보존했습니다. '주님'은 문체상 가능하지만, 여기서는 호칭의 구조를 더 분명히 보이게 했습니다.
- source_word: ተሐንጸ / was built / built
  english_pob_choice: was built / was built
  chosen_korean: 지어졌습니다 / 세워졌습니다
  alternatives_korean:
  - 건축되었습니다
  - 건설되었습니다
  - 만들어졌습니다
  lexicon: 건축 어휘
  rationale: 집과 탑의 대비를 살리기 위해 집에는 '지어졌습니다', 탑에는 '세워졌습니다'를 사용해 각각의 건축 이미지를 구분했습니다.
- source_word: ማእደ፡ ምልእተ / a full table
  english_pob_choice: a full table
  chosen_korean: 가득 찼습니다
  alternatives_korean:
  - 가득한 상이 차려졌습니다
  - 풍성한 식탁이 놓였습니다
  - 차고 넘치는 식탁이 마련되었습니다
  lexicon: table/meal imagery
  rationale: 직역하면 '가득한 식탁'이지만 한국어에서는 '식탁은 가득 찼습니다'가 어색하지 않으면서도 만찬의 충만함을 보존합니다.
theological_decisions:
- issue: 양들의 주가 탑 위에 서는 장면의 존칭 처리
  chosen_reading: 직접 화법이 아니므로 일반 서술체로 옮기되, 메시아/하나님의 상징적 통치를 드러내는 호칭은 원문의 구조를 따라 '양들의 주'로 유지했습니다.
  alternative_readings:
  - '''양들의 주님''으로 경건하게 풀어 쓰는 방법'
  - '''양들의 주 하나님''으로 신학적 해석을 덧붙이는 방법'
  rationale: 본문은 환상 묘사이지 기도문이 아니므로 과도한 예배적 어조를 피하고, 상징적 호칭의 원형을 보존하는 것이 더 स्रोत-충실적입니다.
  doctrine_reference: apocalyptic symbolism; source transparency
- issue: '''그분 앞에''의 대상 지시'
  chosen_reading: 문맥상 탑 위의 주께 식탁이 차려지는 장면으로 이해하여 '그분 앞에'를 유지했습니다.
  alternative_readings:
  - '''그분 앞에''를 생략하는 방법'
  - '''그 앞에''로 축약하는 방법'
  rationale: 원문과 POB 영어가 모두 대상 앞에 음식을 차려 놓는 이미지를 분명히 하므로, 관계를 선명하게 드러내는 표현을 유지했습니다.
  doctrine_reference: narrative imagery fidelity
