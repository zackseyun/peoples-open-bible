  source_fidelity: 'Первые два имени переданы приемлемо: «Беная» соответствует בְּנָיָה, «Бедия» — בֵדְיָה. В третьем имени, כלהי, огласовка в представленном WLC не указана, поэтому следует сохранять осторожность; однако передача ה как «г» не соответствует ни еврейской букве, ни принятой русской передаче такого согласного. Английский контрольный текст также поддерживает чтение Keluhi, а не форму с «г».'
