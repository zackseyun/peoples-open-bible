id: PSA.73.8
reference: Psalms 73:8
source:
  edition: WLC
  text: יָמִ֤יקוּ וִ/ידַבְּר֣וּ בְ/רָ֣ע עֹ֑שֶׁק מִ/מָּר֥וֹם יְדַבֵּֽרוּ׀׃
translation:
  text: They mock and speak wickedly; haughtily they threaten oppression[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'from on high they speak oppression'; 'from on high' may also refer to an elevated position.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִיקוּ
  chosen: They mock
  alternatives:
  - They mock
  - They sneer
  - They are corrupt
  lexicon: HALOT
  rationale: The verb is difficult and its precise sense uncertain; “mock” fits the context of contemptuous speech without claiming greater lexical precision.
- source_word: וִידַבְּרוּ
  chosen: and speak
  alternatives:
  - and they speak
  lexicon: HALOT
  rationale: Simple conjunction plus imperfect verb continuing the description of the wicked's behavior. English omits the repeated subject naturally.
- source_word: בְרָע
  chosen: wickedly
  alternatives:
  - evil things
  - wickedly
  - in evil
  lexicon: HALOT
  rationale: The phrase functions adverbially; “wickedly” preserves the broad moral sense of רַע without importing the more specific motive conveyed by “maliciously.”
- source_word: עֹשֶׁק
  chosen: of oppression
  alternatives:
  - extortion
  - wrongdoing
  lexicon: HALOT
  rationale: English requires a content relation after “speak”; “of oppression” conveys the noun naturally without narrowing it to extortion.
- source_word: מִמָּרוֹם
  chosen: from on high
  alternatives:
  - from a height
  - loftily
  - from heaven
  lexicon: HALOT
  rationale: This retains the Hebrew spatial image and its ambiguity; the context may give it the figurative force “haughtily,” which is explained in the note.
- source_word: יְדַבֵּרוּ
  chosen: they speak
  alternatives:
  - they speak out
  - they utter
  lexicon: HALOT
  rationale: Repeated verb retained in English to preserve the Hebrew emphasis and parallel structure.
