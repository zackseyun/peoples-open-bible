  from: For without cause they hid their net's pit for me[a][b]; without cause they dug it for my life.
  to: For without cause they hid a pit for me—their net[a]; without cause they dug it for my life.
  rationale: The Hebrew explicitly contains both שַׁחַת and רִשְׁתָּם in the first colon, so omitting either is unwarranted. Yet “their net’s pit” and “a pit with their net” impose uncertain semantic relations. Apposition with a dash retains both trap terms and their close connection while avoiding false precision; the note acknowledges that the construction remains difficult. The nephesh note is unnecessary here because “my life” is already an apt contextual translation.
