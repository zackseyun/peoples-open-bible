    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים צְבָאֹות
  english_pob_choice: Yahweh God of hosts
  chosen_korean: 야훼 하나님, 만군의 하나님이시여
  alternatives_korean:
  - 야훼 만군의 하나님이시여
  - 주 하나님 만군의 하나님이시여
  - 야훼 하나님, 군대들의 하나님이시여
  lexicon: HALOT
  rationale: יהוה는 관례적 대체어보다 고유명사인 ‘야훼’로 옮기고, אֱלֹהִים צְבָאוֹת는 ‘만군의 하나님’으로 처리해 호칭의 장엄함과 군사적/우주적 뉘앙스를 보존했습니다.
- source_word: עַד מָתַי
  english_pob_choice: how long
  chosen_korean: 언제까지
  alternatives_korean:
  - 얼마나 더
  - 어느 때까지
  lexicon: HALOT
  rationale: 탄식문의 관용구를 자연스러운 현대 한국어 탄원 표현인 ‘언제까지’로 옮겨 긴박한 호소를 살렸습니다.
- source_word: עָשַׁנְתָּ
  english_pob_choice: will you smoke against
  chosen_korean: 분노하십니까
  alternatives_korean:
  - 연기하십니까
  - 피워 오르십니까
  - 노하십니까
  lexicon: HALOT
  rationale: 히브리어 동사는 문자적으로는 ‘연기/피어오름’의 이미지를 가지지만, 한국어에서는 그 이미지를 직역하면 뜻이 흐려지므로 문맥상 분명한 하나님의 격노를 직설적으로 드러내되, 주어를 ‘분노하십니까’로 정리했습니다.
- source_word: בִּתְפִלַּת עַמֶּךָ
  english_pob_choice: against the prayer of your people
  chosen_korean: 주의 백성의 기도에 대하여
  alternatives_korean:
  - 주의 백성의 기도에
  - 주의 백성의 기도와 맞서
  - 주의 백성의 기도를 향하여
  lexicon: HALOT
  rationale: ב의 관계를 한국어 조사로 단순화하지 않고 ‘대하여’로 옮겨, 기도에 대한 विरोध/대립적 관계를 지나치게 부드럽게 만들지 않도록 했습니다.
theological_decisions:
- issue: 히브리어의 ‘연기/피어오름’ 이미지 보존 여부
  chosen_reading: 한국어 본문은 ‘분노하십니까’로 의미를 전달하고, 기도문 전체의 탄식 어조를 유지했습니다.
  alternative_readings:
  - ‘주의 백성의 기도에 대하여 연기하십니까’
  - ‘주의 백성의 기도에 대하여 피어오르십니까’
  rationale: 한국어에서는 ‘smoke against’의 문자 이미지를 직역하면 의미가 불투명해져, 본문이 요구하는 핵심 감정인 하나님의 격노를 명료하게 전달하는 쪽을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: translation philosophy 1, 3, and 6'
- issue: 호칭의 경어 처리
  chosen_reading: 하나님께 직접 드리는 탄원으로서 높임말 ‘분노하십니까’와 호격 ‘-이시여’를 사용했습니다.
  alternative_readings:
  - ‘분노하십니까’ 없이 평서형으로 처리
  - ‘주님’만 사용
  rationale: 시편의 기도체를 한국어 합쇼체로 유지하면서도 하나님께 드리는 직접 호칭의 예법을 살리기 위한 선택입니다.
  doctrine_reference: 'POB Korean style guide: direct address to God'
