id: 2CO.11.9
reference: 2 Corinthians 11:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിരുന്നപ്പോൾ എനിക്കു കുറവുണ്ടായിരുന്നെങ്കിലും ഞാൻ ആർക്കും ഭാരമായില്ല; മക്കെദോന്യയിൽനിന്നു വന്ന സഹോദരന്മാർ എന്റെ കുറവു നികത്തി. എല്ലാ കാര്യത്തിലും ഞാൻ നിങ്ങൾക്കു ഭാരമാകാതെ എന്നെത്തന്നെ സൂക്ഷിച്ചു; ഇനിയും അങ്ങനെ ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിരുന്നപ്പോൾ
  rationale: സഹഭാഗിത്വപരമായ സാന്നിധ്യവും കാലസാഹചര്യവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑστερηθεὶς
  choice: എനിക്കു കുറവുണ്ടായിട്ടും
  rationale: സന്ദർഭത്തിലെ ഭൗതിക ആവശ്യകത സൂചിപ്പിക്കുമ്പോഴും, ഗ്രീക്കിലെ പൊതുവായ ‘കുറവ് അനുഭവിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: ഞാൻ ആരെയും ഭാരപ്പെടുത്തിയില്ല
  rationale: സാമ്പത്തികമായി മറ്റൊരാളുടെമേൽ ഭാരം ചുമത്തുക എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ ὑστέρημά μου
  choice: എനിക്കു കുറവായിരുന്നതു
  rationale: അമൂർത്തമായ ‘കുറവ്’ എന്നതിനേക്കാൾ, കുറവായിരുന്ന കാര്യം എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള രൂപം.
- source_word: προσανεπλήρωσαν
  choice: നികത്തി
  rationale: നിലവിലുണ്ടായിരുന്ന കുറവ് പൂർണീകരിച്ചു എന്ന സംയുക്തക്രിയയുടെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: οἱ ἀδελφοὶ
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; ഇവിടെ മക്കെദോന്യയിൽനിന്നു വന്ന നിർദിഷ്ട സഹപ്രവർത്തകരെയാകാം സൂചിപ്പിക്കുന്നത്.
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: മക്കെദോന്യയിൽനിന്നു വന്ന
  rationale: കർത്തൃവിശേഷണത്തെ സ്വാഭാവിക മലയാള ബന്ധപ്രയോഗമായി മാറ്റുകയും ഭൂമിശാസ്ത്രപരമായ ഉറവിടം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν παντί
  choice: എല്ലാ കാര്യത്തിലും
  rationale: പ്രയോഗത്തിന്റെ സമഗ്ര വ്യാപ്തി വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്കു ഭാരമാകാതെ എന്നെത്തന്നെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത ഘടനയെ വ്യക്തമായ മലയാളത്തിൽ നൽകുകയും സാമ്പത്തിക ഭാരത്തിന്റെ സന്ദർഭം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: സൂക്ഷിച്ചു; ഇനിയും അങ്ങനെതന്നെ സൂക്ഷിക്കും
  rationale: ഭാരമാകാതിരിക്കുന്ന നില മുൻകാലത്ത് പാലിച്ചതും ഭാവിയിലും പാലിക്കുമെന്നതും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀδελφοὶ എന്നതിലെ ലിംഗസൂചന
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ / സഹവിശ്വാസികൾ
  rationale: മൂലപദം പുല്ലിംഗ ബഹുവചനമാണ്; ഈ സന്ദർഭത്തിൽ മക്കെദോന്യയിൽനിന്നുള്ള നിർദിഷ്ട പുരുഷ സഹപ്രവർത്തകരെ സൂചിപ്പിക്കാനുള്ള സാധ്യതയുണ്ട്. അതിനാൽ പ്രധാനവാചകത്തിൽ പുല്ലിംഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സാമ്പത്തികസന്ദർഭം വ്യക്തമാകുന്ന വിധത്തിൽ ‘ഭാരം’ എന്ന രൂപകം നിലനിർത്തി; പൗലോസിന്റെ ആവർത്തനവും ഭാവിയിലെ ഉറച്ച തീരുമാനവും സംരക്ഷിച്ചു.
