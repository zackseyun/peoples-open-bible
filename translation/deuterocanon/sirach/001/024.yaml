translation:
  text: He will rejoice in her, and she will rejoice in him; she will never forsake him.
  philosophy: dynamic
lexical_decisions:
- source_word: ἐν θησαυροῖς
  chosen: In the treasures of
  alternatives:
  - Among the treasures of
  - Within the treasuries of
  lexicon: LSJ
  rationale: The Hebrew witness in Zone 1 is clearly mismatched to this verse, so the Greek parallel functions as the usable translation base. ἐν with the dative is naturally rendered 'in'; θησαυροῖς denotes treasures or storehouses. 'Treasures' is more idiomatic and preserves the metaphor.
- source_word: σοφίας
  chosen: wisdom
  lexicon: LSJ
  rationale: 'Standard rendering of σοφία. The genitive is possessive/descriptive: the treasures belong to or consist in wisdom.'
- source_word: παραβολαὶ
  chosen: sayings
  alternatives:
  - parables
  - proverbs
  - illustrations
  lexicon: LSJ
  rationale: Although παραβολαί can mean 'parables' or 'proverbs,' in wisdom literature a broader term like 'sayings' best fits the genre and avoids importing the later Gospel-specific sense of 'parable.'
- source_word: ἐπιστήμης
  chosen: insightful
  alternatives:
  - of knowledge
  - of understanding
  - knowledgeable
  lexicon: LSJ
  rationale: The genitive qualifies the sayings as characterized by knowledge/understanding. Rendering it adjectivally as 'insightful' gives natural English while preserving the sense that these sayings convey understanding.
- source_word: βδέλυγμα
  chosen: an abomination
  alternatives:
  - detestable
  - a disgust
  lexicon: LSJ
  rationale: βδέλυγμα is a strong term for something detestable or abhorrent. 'An abomination' preserves the moral and religious force typical of biblical usage.
- source_word: ἁμαρτωλῷ
  chosen: to a sinner
  alternatives:
  - for a sinner
  - in the eyes of a sinner
  lexicon: LSJ
  rationale: 'The dative here is best taken as reference: godliness is abhorrent from the sinner''s standpoint. ''To a sinner'' is concise and idiomatic.'
- source_word: θεοσέβεια
  chosen: godliness
  alternatives:
  - piety
  - reverence for God
  lexicon: LSJ
  rationale: θεοσέβεια denotes reverence toward God or piety. 'Godliness' is accessible modern English and preserves the religious-ethical sense without sounding overly technical.
