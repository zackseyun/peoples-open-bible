  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֭/כַנָּה אֲשֶׁר נָטְעָ֣ה יְמִינֶ֑/ךָ וְ/עַל בֵּ֝֗ן אִמַּ֥צְתָּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/015.yaml
  text: and the plant that your right hand planted[a], the son whom you made strong for yourself—
  footnotes:
  - marker: a
    text: The Hebrew term is rare and denotes the planted vine or plant here; it has also been rendered “stock” or “shoot.”
