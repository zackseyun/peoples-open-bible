id: PRO.9.7
reference: Proverbs 9:7
source:
  edition: WLC
  text: יֹ֤סֵ֨ר לֵ֗ץ לֹקֵ֣חַֽ ל֣/וֹ קָל֑וֹן וּ/מוֹכִ֖יחַ לְ/רָשָׁ֣ע מוּמֽ/וֹ׀׃
translation:
  text: Whoever corrects a scoffer brings disgrace on himself; whoever rebukes a wicked man brings harm on himself[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “his blemish”; the expression may refer to a stain on the rebuker's reputation, an injury, or abuse received from the wicked person.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵר
  chosen: Whoever corrects
  alternatives:
  - He who disciplines
  - One who instructs
  lexicon: HALOT
  rationale: The participle introduces a general principle, best rendered with an English indefinite relative ('whoever'). The verb יסר can mean discipline, chasten, or instruct/correct; here in wisdom context with parallel 'rebukes,' 'corrects' fits the sense of verbal correction without overstating punitive discipline.
- source_word: לֵץ
  chosen: a scoffer
  alternatives:
  - a mocker
  - a scorner
  lexicon: HALOT
  rationale: לץ in Proverbs denotes a contemptuous, arrogant rejecter of wisdom. 'Scoffer' is concise, current, and preserves the derisive nuance better than the more archaic 'scorner.'
- source_word: לֹקֵחַ לוֹ
  chosen: gets dishonor for himself
  alternatives:
  - takes disgrace to himself
  - acquires shame for himself
  lexicon: HALOT
  rationale: לקח with לּוֹ is idiomatic for incurring or receiving something upon oneself. 'Gets ... for himself' is natural English and preserves the reflexive sense.
- source_word: קָלוֹן
  chosen: dishonor
  alternatives:
  - shame
  - disgrace
  lexicon: HALOT
  rationale: קלון denotes public shame/disgrace. 'Dishonor' works well in parallel with the next colon and avoids over-psychologizing the term as inward shame alone.
- source_word: וּמוֹכִיחַ
  chosen: and whoever rebukes
  alternatives:
  - and one who reproves
  - and whoever corrects
  lexicon: HALOT
  rationale: The Hiphil participle of יכח commonly means to reprove or rebuke. 'Rebukes' gives a sharper verbal parallel to 'corrects' in the first colon while avoiding exact repetition.
- source_word: לְרָשָׁע
  chosen: a wicked man
  alternatives:
  - the wicked
  - a guilty man
  lexicon: HALOT
  rationale: רשע here is singular and generic. Per the project's gender-accurate policy, 'man' is retained because the Hebrew is grammatically masculine singular used representatively. 'Wicked man' is the most straightforward rendering.
- source_word: מוּמוֹ
  chosen: incurs a blemish
  alternatives:
  - his defect
  - abuse for himself
  - insult
  lexicon: HALOT
  rationale: The noun concretely denotes a blemish or defect, but its figurative force and suffix are difficult here. This rendering preserves the image, with the alternatives documented in the note.
- source_word: לֹקֵחַ לוֹ קָלוֹן
  chosen: brings disgrace on himself
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This naturally conveys taking or incurring disgrace for oneself while preserving the reflexive force of לוֹ.
