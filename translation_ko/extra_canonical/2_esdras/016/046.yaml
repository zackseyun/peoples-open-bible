review_pass:
  verdict: revise
  source_fidelity: 라틴어 uidui는 남성 복수 주격으로, 여기서는 ‘과부’가 아니라 ‘홀아비들/배우자를 잃은 남자들’을 뜻합니다. 초안의 여성형 ‘과부’는 원문의 문법적 성을 바꿉니다. nubunt와 sic quasi의 간결한 비교 구조 및 sine causa의 ‘까닭 없이’는 잘 보존되어 있습니다.
  naturalness: ‘마치 홀아비인 것처럼 결혼합니다’는 현대 한국어에서 다소 역설적으로 들리지만, 이는 원문의 의도적인 난해함과 비교 표현을 보존하는 번역입니다. ‘홀아비가 된 것처럼’보다 상태를 직접 나타내는 ‘홀아비인 것처럼’이 uidui에 더 가깝습니다.
  terminology: ‘결혼합니다’, ‘그러므로’, ‘아무 까닭 없이 수고합니다’는 현대적인 합쇼체이며 적절합니다. uidui만 ‘과부’에서 ‘홀아비’로 바로잡아야 합니다.
  issues:
  - severity: high
    issue: uidui를 ‘과부가 된 것처럼’으로 옮김
    rationale: uidui(=vidui)는 남성 복수형으로 ‘홀아비들’을 가리킵니다. 여성형 ‘과부’는 라틴어의 성을 반대로 바꾸므로 원문 충실성에 문제가 있습니다.
  revised_text: 그들은 마치 홀아비인 것처럼 결혼합니다. 그러므로 수고하는 자들은 아무 까닭 없이 수고합니다.
