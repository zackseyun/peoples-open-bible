  to: 이는 내가 주님을 힘입어 한 부대를 향해 달려가고, 나의 하나님을 힘입어 성벽을 뛰어넘기 때문입니다.
  rationale: 제공된 WLC 본문을 기준으로 전체를 새로 번역했습니다. כִּי의 설명적 기능은 ‘이는 ... 때문입니다’로, 두 ב 전치사구의 병행은 ‘힘입어’로 반영했습니다. אָרוּץ의 군사 문맥은 ‘부대를 향해 달려가고’로, אֲדַלֶּג שׁוּר는 구체적 장애물 이미지가 보존되도록 ‘성벽을 뛰어넘고’로 옮겼습니다. 원문의 직설적 시적 진술을 가능 표현으로 과도하게 풀어 쓰지 않았습니다.
