lexical_decisions:
- source_word: בְמוֹתוֹ
  english_pob_choice: at his death
  chosen_korean: 그의 죽을 때에는
  alternatives_korean:
  - 그가 죽을 때에는
  - 그의 죽음에서
  lexicon: HALOT
  rationale: ב + ‘death’의 시간적 용법을 살려, 죽는 순간을 가리키는 자연스러운 한국어로 옮겼습니다.
- source_word: יִקַּח הַכֹּל
  english_pob_choice: he will take nothing
  chosen_korean: 아무것도 가져가지 못하며
  alternatives_korean:
  - 아무것도 취하지 못하며
  - 그는 아무것도 가져가지 못하며
  lexicon: HALOT
  rationale: 부정 아래의 הַכֹּל은 관용적으로 ‘아무것도’가 되므로, 죽음에 맞닿은 ‘가지고 가다’의 뜻을 살려 번역했습니다.
- source_word: יֵרֵד אַחֲרָיו
  english_pob_choice: will go down after him
  chosen_korean: 그를 따라 내려가지 못합니다
  alternatives_korean:
  - 그를 뒤따라 내려가지 못합니다
  - 그 뒤로 내려가지 못합니다
  lexicon: HALOT
  rationale: ‘내려가다’의 구체적 이미지를 보존하되, 히브리어가 목적지를 명시하지 않는 점을 따라 ‘그를 따라’로만 처리했습니다.
- source_word: כְּבוֹדוֹ
  english_pob_choice: his glory
  chosen_korean: 그의 영광
  alternatives_korean:
  - 그의 존귀
  - 그의 명예
  - 그의 부와 위세
  lexicon: HALOT
  rationale: כבוד의 넓은 의미를 유지하기 위해 기본형인 ‘영광’을 택했고, 문맥상 사회적 지위와 현세적 영화까지 포괄할 수 있게 했습니다.
theological_decisions:
- issue: 죽음 이후의 행선지 암시
  chosen_reading: 주본문에서는 ‘내려가지 못합니다’만 두어, 무덤이나 스올을 구체화하지 않았습니다.
  alternative_readings:
  - 무덤으로 내려가지 못합니다
  - 스올로 내려가지 못합니다
  rationale: 히브리어가 목적지를 비워 두므로, 한국어도 그 긴장을 유지해 본문이 말하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: preserve implicit imagery without resolving the destination.'
