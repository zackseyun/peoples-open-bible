translation:
  text: 'II.1. The angel of the Lord commanded that crowns be brought. Crowns were brought, as if made
    from palms[a]. He crowned the men who had handed in rods with shoots and some fruit. He dismissed
    them into the tower.


    II.2. He also sent the others into the tower. They had handed in their rods green and with shoots,
    but their shoots had no fruit. He gave them a seal[b].


    II.3. All who were going into the tower had the same clothing. It was white as snow.


    II.4. He dismissed the people who had handed in their rods green, just as they had received them.
    He gave them [white] clothing and seals[c].


    II.5. After the angel finished these things, he says to the shepherd, “I am going. But you are to
    dismiss these people to the walls, as each one is worthy to dwell. Examine their rods carefully. Then
    dismiss them accordingly. Examine them carefully[d]. See that no one slips past you. But if anyone
    does slip past you, I will test them upon the altar[e].” After saying these things to the shepherd,
    he went away.


    II.6. After the angel had gone away, the shepherd says to me, “Let us take everyone’s rods and plant
    them. Let us see if any will be able to live.” I say to him, “Sir, how can these dry things live[f]?”


    II.7. He answers me, “This tree is a willow, and its kind loves life. If the rods are planted and
    receive a little moisture, many of them will live. Then let us also try pouring water on them. If
    any is able to live, I will rejoice with it. But if it does not live, I shall not be found negligent[g].”


    II.8. Then the shepherd commanded me to call the people just as each had been stationed. They came
    rank by rank and handed their rods to him. He took the rods and planted them according to their ranks.
    After planting, he poured so much water on them that the rods could not be seen because of the water[h].


    II.9. After he had watered the rods, he says to me, “Let us go. After a few days, let us return and
    inspect all the rods. For the one who created this tree desires all who have taken branches from this
    tree to live[i]. And I too hope that, after these rods have received moisture and been watered with
    water, the greater part of them will live[j].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: As if made from palms retains the comparative wording rather than asserting a particular material
      or identifying a later reward. Sinaiticus global68.1 has a partly supplied/dotted as-if word and
      singular palm form; some fruit is a ca-corrector reading against first-hand enegka. Michigan printed88
      partly preserves the working fruit/crown account. Palatina177prints be brought as an editorial addition
      absent its codex. These are version/transcription facts, not fresh manuscript photograph certification.
  - marker: b
    reason: textual_variant
    text: The working II.2 has singular a seal, not the old English seals. Michigan printed89 partly preserves
      the singular form; Sinaiticus global68.2 has singular sphragida without supply or correction markup.
      Both Latin versions have a singular seal. The shoots’ lack of fruit remains an explicit distinction;
      the seal is translated without adding its later interpretation to the vision.
  - marker: c
    reason: textual_variant
    text: White in II.4 is bracketed as Harmer’s version-supported insertion in the1891 working source
      against reported Athos omission. Michigan printed89 has white in the corresponding clothing phrase,
      and Sinaiticus global68.4 has white without supply/correction markup. Both Latin versions have white
      clothing. The English now shows the retained working bracket. The working II.4 has plural seals,
      unlike Michigan/Sinaiticus singular seal and Vulgata99’s differently worded closing; Palatina177has
      plural seals. Singular in2 and plural in4 are not silently harmonized.
  - marker: d
    reason: textual_variant
    text: The repeated examine carefully instruction in II.5 is retained. Michigan printed90 omits the
      second repetition; Palatina177also has one explicit careful inspection, while Vulgata100has a second
      careful consideration linked to the warning about deception. Sinaiticus global68.5 breaks after
      the first instruction, before the second could occur, so it cannot attest its absence. The literal
      walls image remains rather than being replaced by a doctrinal explanation of the tower.
  - marker: e
    reason: textual_variant
    text: The working II.5 explicitly conditions the altar test on someone slipping past the shepherd.
      Michigan printed90 has a shorter connection without the full repeated if-anyone clause; both Latin
      versions retain a conditional warning (Vulgata100and Palatina177). The altar remains an altar, without
      replacing it by a generic test or adding a new ritual. The plural them after singular anyone reflects
      the working source’s shift to autous. Sinaiticus stops earlier and cannot decide this wording.
  - marker: f
    reason: textual_variant
    text: The after-the-angel-had-gone-away opening is explicit in the full working II.6, as it is in
      Michigan printed90 and both Latin versions. The old English had already narrated the departure at
      the end of5 but left this repeated transition implicit. Hermas’s question about dry things living
      is retained; Palatina177omits the question. Sir addresses the shepherd. This small alignment does
      not amount to newly recovering a whole historical paragraph.
  - marker: g
    reason: textual_variant
    text: The willow’s life-loving kind, planting/moisture condition, many-will-live assertion, trial
      watering, conditional rejoicing and no-negligence negative all remain. The working singular rejoice
      with it follows Harmer’s version-supported conjecture; Michigan printed91 has plural with them,
      matching reported Athos. Both Latin versions use a singular recipient in this clause. Sinaiticus
      does not preserve this part. None of these differences licenses changing many to all or removing
      the failure contingency.
  - marker: h
    reason: lexical_alternative
    text: Rank by rank renders the repeated tagmata and keeps the people’s previous grouping and the corresponding
      planting order. Much water conceals the rods; the English retains this result rather than merely
      saying they were watered. Michigan printed91 and both Latin versions retain corresponding grouping,
      planting and abundant water, though the versions describe coverage rather than protruding. Earlier
      reader notes were piled up at the end of9; their complete original wording is archived, and the
      new notes are attached to their actual passages.
  - marker: i
    reason: textual_variant
    text: The working II.9 has the one who created this tree and desires all who received its branches
      to live. Michigan printed92 instead has an overlined Lord abbreviation in the Lord of this tree;
      both Latin versions have who created. The working creator wording is retained. This desire is stated
      for the branch recipients; the text is not rewritten as a guarantee that every rod will live.
  - marker: j
    reason: textual_variant
    text: The closing is explicitly the shepherd’s hope that the greater part will live after moisture
      and watering, not a universal prediction. Michigan printed92 partly preserves this hope with wording
      differences, and Vulgata101and Palatina179have hope that very many will live. Both Latin versions
      also retain let us go, a phrase inserted by Anger in the working1891 source against reported Athos
      omission and corroborated by Michigan’s printed agomen. This does not require a new working source-body
      change.
