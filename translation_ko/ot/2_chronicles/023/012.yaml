  terminology: 아달랴, 왕, 여호와의 집은 문맥과 영어 POB의 LORD 표기를 무리 없이 반영합니다. ‘찬양하다’는 왕을 높여 외치는 공적 환호를 이 문맥에서 자연스럽게 전달합니다.
