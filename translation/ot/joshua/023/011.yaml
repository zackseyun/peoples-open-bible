id: JOS.23.11
reference: Joshua 23:11
source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹֽׁתֵי/כֶ֑ם לְ/אַהֲבָ֖ה אֶת יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
translation:
  text: Therefore, take great care to love Yahweh your God.
  philosophy: dynamic
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  chosen: Therefore, take care
  alternatives:
  - So be careful
  - Guard yourselves
  lexicon: HALOT
  rationale: The verb calls for vigilant self-watchfulness, and the discourse connection supports 'Therefore.' English 'take care' expresses the idiom naturally.
- source_word: מְאֹד
  chosen: great
  alternatives:
  - very
  lexicon: HALOT
  rationale: With 'take care,' the intensifier is idiomatically represented by 'great care.'
- source_word: לְנַפְשֹׁתֵיכֶם
  chosen: reflexive force included in ‘take great care’
  alternatives:
  - for yourselves
  - for your lives
  lexicon: HALOT
  rationale: The phrase marks the persons exercising care for their own welfare. English already conveys this reflexive force in 'take great care,' so a separate calque would be distracting.
- source_word: לְאַהֲבָה
  chosen: to love
  alternatives:
  - for loving
  lexicon: HALOT
  rationale: 'The infinitive expresses purpose/result following the command: they are to guard themselves so as to love the LORD. ''To love'' is the most natural English rendering.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: אֱלֹהֵיכֶם
  chosen: your God
  lexicon: HALOT
  rationale: 'Construct with second person plural suffix identifies covenant relationship: ''your God.'' This is direct and standard.'
