  to: 이는 그의 모든 법도가 내 앞에 있었고, 나는 그의 율례들을 내게서 치워 버리지 않았기 때문입니다.[a]
  rationale: 제공된 WLC 본문과 영어 POB 감사 기록에 맞추어 절 전체를 새로 번역했습니다. כִּי는 앞 절의 근거를 나타내는 ‘이는 … 때문입니다’로, כָל־מִשְׁפָּטָיו는 ‘그의 모든 법도’, לְנֶגְדִּי는 ‘내 앞에’, חֻקֹּתָיו는 ‘그의 율례들’로 옮겼습니다. לֹא אָסִיר מֶנִּי는 목적어와 ‘내게서’를 보존하여 ‘내게서 치워 버리지 않았습니다’로 번역하고, 가능한 다른 이해는 각주에 남겼습니다.
