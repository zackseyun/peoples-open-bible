  reasoning_layer_used: POB translation and immediate context
  rationale: The direct command is clearer without the formal connective “then.”
- pob_phrase: revealed your wickedness to me
  simplified_phrase: showed me your wickedness
  preserved_meaning: God made her evil conduct known to Joseph.
  reasoning_layer_used: POB translation
  rationale: “Showed me” expresses the disclosure in common English.
