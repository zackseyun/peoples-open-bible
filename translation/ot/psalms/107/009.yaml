id: PSA.107.9
reference: Psalms 107:9
source:
  edition: WLC
  text: כִּי הִ֭שְׂבִּיעַ נֶ֣פֶשׁ שֹׁקֵקָ֑ה וְ/נֶ֥פֶשׁ רְ֝עֵבָה מִלֵּא טֽוֹב־־׃
translation:
  text: For he satisfies the longing soul and fills the hungry soul with good things.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  lexicon: HALOT
  rationale: Introduces the reason for the thanksgiving/praise context in the surrounding verse. 'For' fits natural English while preserving the explanatory force.
- source_word: הִשְׂבִּיעַ
  chosen: satisfies
  alternatives:
  - has satisfied
  - fills to satisfaction
  lexicon: HALOT
  rationale: Hiphil of שבע conveys causing to be satisfied or sated. Present tense in English works well in proverbial/poetic statement, preserving the general truth of God's action without awkwardness.
- source_word: נֶפֶשׁ
  chosen: soul
  alternatives:
  - person
  - life
  - self
  lexicon: HALOT
  rationale: In Hebrew poetry נֶפֶשׁ often denotes the whole inner life or person. 'Soul' preserves the poetic and anthropological weight better than the flatter 'person,' while not requiring a technical dualistic reading.
- source_word: שֹׁקֵקָה
  chosen: longing
  alternatives:
  - longing
  - parched
  lexicon: HALOT
  rationale: The participle denotes yearning or craving and does not itself specify thirst.
- source_word: וְנֶפֶשׁ
  chosen: and ... soul
  alternatives:
  - and the person
  - and the life
  lexicon: HALOT
  rationale: Retains the parallel repetition of נֶפֶשׁ across both cola, which is stylistically important in Hebrew poetry.
- source_word: רְעֵבָה
  chosen: hungry
  alternatives:
  - famished
  lexicon: HALOT
  rationale: Adjective meaning hungry; 'hungry' is direct and matches the parallel 'thirsty' in accessible modern English.
- source_word: מִלֵּא
  chosen: fills
  alternatives:
  - has filled
  - fills full
  lexicon: HALOT
  rationale: Piel of מלא means to fill. Present tense matches the first verb and expresses the verse's general truth in English poetry.
- source_word: טוֹב
  chosen: good things
  alternatives:
  - good
  - what is good
  - goodness
  lexicon: HALOT
  rationale: Object of 'fills' in this context is naturally rendered 'good things' in English, conveying beneficent provision rather than an abstract quality alone.
