id: JER.6.11
reference: Jeremiah 6:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֩ חֲמַ֨ת יְהוָ֤ה מָלֵ֨אתִי֙ נִלְאֵ֣יתִי הָכִ֔יל שְׁפֹ֤ךְ עַל עוֹלָל֙ בַּ/ח֔וּץ וְ/עַ֛ל ס֥וֹד בַּחוּרִ֖ים יַחְדָּ֑ו כִּֽי גַם אִ֤ישׁ עִם אִשָּׁה֙ יִלָּכֵ֔דוּ זָקֵ֖ן עִם מְלֵ֥א יָמִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/011.yaml
  text: But I am full of the wrath of Yahweh[a]; I am weary of holding it in. Pour it out on the child in the street, and on the company of young men together; for both man and woman will be taken[b], the old man along with the very aged.
  footnotes:
  - marker: a
    text: Or 'the fury of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'full of days,' an idiom meaning very old or advanced in years.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 야훼의 진노로 가득 차 있습니다. 나는 그것을 억누르기에 지쳤습니다. 그것을 거리의 어린아이와 함께 모인 젊은이들의 무리에게 쏟아부으십시오. 남자와 여자 모두 붙잡히며, 노인과 나이가 매우 많은 이[a]도 붙잡힙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘날들이 가득한’은 나이가 매우 많거나 고령이라는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת יְהוָה
  english_pob_choice: the wrath of Yahweh
  chosen_korean: 야훼의 진노
  alternatives_korean:
  - 야훼의 분노
  - 야훼의 노여움
  lexicon: HALOT
  rationale: חֵמָה/חֲמָה는 단순한 감정적 화보다 강한 심판적 진노를 가리키므로, 한국어에서는 격을 살린 ‘진노’가 가장 가깝습니다. יְהוָה는 본문 원어를 따라 야훼로 옮겼습니다.
- source_word: נִלְאֵיתִי הָכִיל
  english_pob_choice: I am weary of holding it in
  chosen_korean: 더는 그것을 억누를 수 없습니다
  alternatives_korean:
  - 그것을 참느라 지쳤습니다
  - 그것을 간직하는 데 지쳤습니다
  lexicon: HALOT
  rationale: ‘지치다/피곤하다’의 직역보다, 이어지는 문맥상 더 이상 안에 머물게 하지 못하는 상태를 한국어로 자연스럽게 드러내는 ‘억누를 수 없습니다’가 맞습니다.
- source_word: שְׁפֹךְ
  english_pob_choice: Pour it out
  chosen_korean: 쏟아부으십시오
  alternatives_korean:
  - 쏟으십시오
  - 부으십시오
  lexicon: HALOT
  rationale: 명령형의 급박함과 분노의 방출 이미지를 살리기 위해 ‘쏟아부으십시오’로 옮겼습니다. 대상이 이미 앞절의 진노이므로 대명사 ‘그것’을 살렸습니다.
- source_word: סוֹד בַּחוּרִים
  english_pob_choice: the company of young men
  chosen_korean: 젊은이들의 무리
  alternatives_korean:
  - 젊은이들의 모임
  - 젊은이들의 동아리
  lexicon: HALOT
  rationale: סוֹד는 ‘비밀/원로회의’보다 여기서는 모여 있는 집단을 뜻하므로, 형식적이면서도 자연한 ‘무리’가 적절합니다.
- source_word: יִלָּכֵדוּ
  english_pob_choice: will be taken
  chosen_korean: 붙잡히고
  alternatives_korean:
  - 사로잡히고
  - 잡히고
  lexicon: HALOT
  rationale: 포위·심판의 맥락에서 לכד의 수동 의미를 살리되, 한국어에서는 결과 상태를 간결하게 보여 주는 ‘붙잡히고’가 가장 무난합니다.
- source_word: מְלֵא יָמִים
  english_pob_choice: the very aged
  chosen_korean: 나이가 매우 많은 이
  alternatives_korean:
  - 연로한 이
  - 수일이 가득한 이
  lexicon: HALOT
  rationale: 직역인 ‘날이 가득한’은 한국어 관용으로는 어색하므로, ‘full of days’라는 관용을 의미대로 풀어 ‘나이가 매우 많은 이’로 옮겼습니다.
theological_decisions:
- issue: 화자의 발화 방식과 명령의 귀속
  chosen_reading: 예레미야가 야훼의 진노로 가득 차 더는 그것을 억누르지 못해, 그 진노를 쏟아부으라는 명령형으로 표현합니다.
  alternative_readings:
  - 야훼가 직접 쏟아부으라고 명령하시는 것으로 읽는 해석
  - 예레미야가 자기 판단으로 심판을 집행하겠다고 말하는 해석
  rationale: 히브리어는 압축되어 있어 명령의 화자와 귀속이 약간 중첩되지만, 문맥의 긴장과 예언자적 수사를 그대로 살리기 위해 과도하게 특정하지 않았습니다.
  doctrine_reference: 예언서 수사와 문맥 우선 원칙
