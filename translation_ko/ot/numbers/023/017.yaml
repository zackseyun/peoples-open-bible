    issue: ‘내게’가 1인칭 관찰자 시점을 도입함
    rationale: וַיָּבֹא אֵלָיו는 ‘그가 그에게 왔다’이며, 문맥상 발람이 발락에게 온 것입니다. 원문에는 ‘내게’에 해당하는 1인칭 접미사가 없습니다.
  - severity: high
    issue: 신명 ‘여호와’가 프로젝트의 확정된 렌더링과 불일치함
