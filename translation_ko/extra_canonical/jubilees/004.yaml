base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004.yaml
  text: '1[4]. And the LORD reproved Cain because of Abel, because he had killed him.

    2. And in the fifth week she bore him his daughter Awan. And in the first year of the third jubilee Cain killed Abel, because Abel’s offering was accepted, but his sacrifice was not accepted.

    3. And he killed him in the field, and his blood cried out from the ground to heaven, making accusation because of him.

    4. And therefore the LORD rebuked Cain because of Abel, because he had killed him; and he made him a fugitive upon the earth because of the blood of his brother, and he cursed him upon the earth.

    5. And because of this it is written on the heavenly tablets: “Cursed is he who strikes his neighbor maliciously”; and let all who see and hear say, “So be it”; and the man who has seen and reported, let him be cursed in the same way.

    6. And for this reason we declare, when we come before the LORD our God, all the sins

    7[6-7]. that are committed in heaven and on earth, and in light and in darkness, and in every place. And Adam and his wife mourned for Abel four weeks of years. And in the fourth year of the fifth week they became joyful, and Adam again knew his wife, and she bore him a son, and he called his name Seth; for he said, “The LORD has raised up for me another seed on the earth in place of Abel, because Cain killed him.” And in the sixth week he fathered his daughter Azura. And Cain took Awan his sister as a wife, and she bore him Enoch at the end of the fourth jubilee. And in the first year of the first week of the fifth jubilee, houses were built on the earth, and Cain built a city and named it after his son Enoch. And Adam knew Eve his wife, and she bore nine more sons. And in the fifth week of the fifth jubilee Seth took Azura his sister as a wife, and in the fourth year she bore him Enos. He was the first to call on the name of the LORD on the earth. And in the seventh jubilee, in the
    third week, Enos took Noam his sister as a wife, and she bore him a son in the third year of the fifth week, and he called his name Kenan. And at the end of the eighth jubilee Kenan took Mualeleth his sister as a wife, and she bore him a son in the ninth jubilee, in the first week, in the third year of that week, and they called his name Mahalalel. And in the second week of the tenth jubilee Mahalalel took Dinah, the daughter of Barakiel, his father’s brother’s daughter, as a wife, and she bore him a son in the third week, in its sixth year, and they called his name Jared. For in his days the angels of the LORD descended to the earth, those who are called the Watchers, so that they might instruct the children of men,

    8. and that they might do justice and uprightness on the earth.

    9. And in the eleventh jubilee Jared took for himself a wife, and her name was Baraka, the daughter of Rasujal, his father’s brother’s daughter, in the fourth week of this jubilee; and she bore him a son in the fifth week, in the fourth year of it,

    10. and he called his name Enoch.

    11. He was the first among those born on earth who learned writing and instruction and wisdom, and who wrote down the signs of heaven according to the order of their months in a book, so that the children of men might know the seasons of the years according to the order of each of their months.

    12. He was the first to write a testimony, and he testified to the children of men among the generations of the earth, and recounted the weeks of the jubilees, and made known the days of the years, and set in order the months,

    13. and recounted the sabbaths of the years, as we made it known to him. And what was and what will be he saw in a vision of his sleep, as it will happen among the children of men throughout their generations until the day of judgment; he saw and understood everything, and wrote his testimony, and placed the testimony on the earth against all the children of men and for their generations.

    14. And in the twelfth jubilee, in its seventh week, he took for himself a wife, and her name was Edni, the daughter of Danel, his father’s brother’s daughter; and in the sixth year of this week she bore him a son, and he called his name Methuselah.

    15. And he was still with the angels of God six jubilees of years, and they showed him everything that is on earth and in the heavens, the rule of the sun, and he wrote down everything.

    16. And he testified against the Watchers who had sinned with the daughters of men; for these had begun to join themselves with the daughters of men so as to defile themselves. And Enoch testified against them all. And he was taken from among the children of men, and we brought him into the garden of Eden for greatness and honor. And behold, he is there writing condemnation and judgment of the world, and all the wickedness of the children of men. And because of him the floodwaters did not come upon all the land of Eden, for there he was set as a sign and to testify against all the children of men, so that he might recount all the deeds of the generations until the day of judgment.

    17. And he burned the incense of the sanctuary, the acceptable incense before the LORD, on the mountain of incense. For there are four places of the LORD on the earth: the garden of Eden, and the mountain of the east, and this mountain on which you are today, Mount Sinai, and Mount Zion, which will be sanctified in the new creation for the sanctification of the earth. Therefore the earth will be sanctified from all guilt and from all uncleanness throughout the generations of the age. And in the fourteenth jubilee Methuselah took Edna, the daughter of Azrial, his father’s brother’s daughter, as a wife; and in the third week, in the first year of that week, she bore a son, and he called his name Lamech. And in the fifteenth jubilee, in the third week, Lamech took a wife, and her name was Betenos, the daughter of Barakiel, his father’s brother’s daughter; and in this week she bore him a son, and he called his name Noah, saying, “This one will comfort me for my sorrow and for all my work,
    and for the ground which the LORD has cursed.”

    18. And at the end of the nineteenth jubilee, in the seventh week, in its sixth year, Adam died, and all his sons buried him in the land of his creation; and he was the first to be buried in the earth.

    19. And he lacked seventy years of one thousand years, for one thousand years are like one day in the testimony of heaven. Therefore it is written concerning the tree of knowledge, “On the day you eat from it you will die.” For this reason he did not complete the years of this day, because in it he died.

    20. At the close of this jubilee Cain was killed after him in the same year; and his house fell upon him, and he died in the midst of his house, and he was killed by its stones, because with a stone he had killed Abel.

    21. And by a stone he was killed in righteous judgment. Therefore it was ordained on the heavenly tablets: “With the instrument by which a man kills his neighbor, by it he shall be killed; as he wounded him, so shall they do to him.”

    22. And in the twenty-fifth jubilee Noah took for himself a wife, and her name was Emzara, the daughter of Rake’el, his father’s brother’s daughter, in the first year of the fifth week; and in the third year she bore him Shem, and in the fifth year she bore him Ham[21][17][16][12][7], and in the first year of the sixth week she bore him Japheth.'
  footnotes:
  - marker: '4'
    text: Verse 4 is not separately preserved as a numbered row in the working corpus, but its sense is carried by the opening repetition and the continuation into verse 5. The translation supplies the likely intervening sense from the immediate Ge'ez context without over-expansion.
    reason: segmentation_note
  - marker: 6-7
    text: The sentence beginning 'And for this reason we declare...' is textually compressed across the row break. The translation keeps the sense of a formal declaration of sins before God, though the exact syntax is difficult.
    reason: segmentation_note
  - marker: '7'
    text: '''Week'' here and throughout the chapter refers to Jubilees’s chronological system, often a week of years. The main text keeps the shorter term while preserving ''jubilee'' explicitly.'
    reason: cultural_note
  - marker: '12'
    text: The phrase rendered 'write a testimony' could also be understood as 'write down a record/witness.'
    reason: lexical_alternative
  - marker: '16'
    text: The clause about the flood and 'the land of Eden' is difficult. The translation follows the Ethiopic as preserved, though the logic of the sentence may reflect a compressed or unstable textual tradition.
    reason: textual_variant
  - marker: '17'
    text: The place-name rendered 'the mountain of the east' is difficult in the Ethiopic sequence of the four holy places. The wording is kept close to the surviving text rather than harmonized.
    reason: segmentation_note
  - marker: '21'
    text: 'The legal maxim echoes talionic justice: the instrument and manner of violence return upon the killer.'
    reason: cross_reference
translation:
  language: ko
  text: '1. 그리고 둘째 희년의 셋째 주간에 그녀가 가인을 낳고, 넷째 주간에 아벨을 낳고, 다섯째 주간에 자기 딸 아완을 낳았습니다.

    2. 그리고 다섯째 주간에 그녀는 그에게 딸 아완을 낳았습니다. 그리고 세 번째 희년의 첫해에 카인이 아벨을 죽였습니다. 아벨의 제물은 받아들여졌지만 카인의 희생 제물은 받아들여지지 않았기 때문입니다.

    3. 그리고 그는 들판에서 그를 죽였습니다. 그의 피가 땅에서 하늘로 그를 두고 고발하며 부르짖었습니다.

    4. 그러므로 주님께서는 가인이 그의 형제 아벨을 죽였기 때문에 가인을 저주하셨습니다. 또 그 형제의 피 때문에 그가 땅에서 도망자가 되게 하셨고, 땅 위에서 그를 저주하셨습니다.

    5. 그리고 이 일 때문에 하늘의 서판들에 이렇게 기록되어 있습니다. “이웃을 악의로 치는 자는 저주를 받을 것입니다.” 그리고 보고 듣는 모든 사람은 “그리되기를”이라고 말해야 합니다. 또 보고도 알리지 않은 사람은 그와 같이 저주를 받을 것입니다.

    6. 이 때문에 우리는 주 우리 하나님 앞에 나아올 때 모든 죄를 …

    7. 하늘과 땅에서, 빛과 어둠 속에서, 그리고 모든 곳에서 행해지는 것들입니다. 아담과 그의 아내는 아벨 때문에 네 주 동안 슬퍼하였습니다. 다섯째 주의 넷째 해에 그들은 기뻐하게 되었고, 아담은 다시 그의 아내를 알았으며, 그녀는 그에게 아들을 낳았습니다. 그는 그 이름을 셋이라 하였습니다. 이는 그가 말하기를, “가인이 그를 죽였으므로, 하나님께서 아벨 대신에 땅 위에서 나를 위하여 또 다른 씨를 일으키셨다” 하였기 때문입니다. 여섯째 주에 아담은 딸 아주라를 두었습니다. 가인은 그의 누이 아완을 아내로 맞이하였고, 그녀는 넷째 희년이 끝날 때 그에게 에녹을 낳았습니다. 다섯째 희년의 첫째 주, 첫째 해에 땅 위에 집들이 세워졌고, 가인은 성읍을 건설하여 그의 아들 에녹의 이름을 따라 그 이름을 지었습니다. 아담은 그의 아내 하와를 알았고, 그녀는 아홉 자녀를 더 낳았습니다. 다섯째 희년의 다섯째 주에 셋은 그의 누이 아주라를 아내로 맞이하였고, 넷째 해에 그녀는 그에게 에노스를 낳았습니다. 그는 땅 위에서 주님의 이름을 부른 첫 사람이었습니다. 일곱째 희년의 셋째 주에 에노스는 그의 누이 노암을 아내로 맞이하였고, 그녀는 다섯째 주의 셋째 해에 그에게 아들을 낳았으며, 그는 그 이름을 가이난이라 하였습니다. 여덟째 희년이 끝날 때 가이난은 그의 누이 무알렐렛을 아내로 맞이하였고, 그녀는 아홉째 희년의 첫째 주, 그 주의 셋째 해에 그에게 아들을 낳았으며, 그들은 그 이름을 마할랄렐이라 하였습니다. 열째 희년의 둘째 주에 마할랄렐은 바라기엘의 딸이며 그의 아버지의 형제의 딸인 디나를 아내로 맞이하였고, 그녀는 셋째 주의 여섯째 해에 그에게 아들을 낳았으며, 그들은 그 이름을 야렛이라 하였습니다. 그의 시대에 주님의 천사들, 곧 감시자라 불리는 이들이 사람의 자녀들을 가르치려고 땅으로 내려왔습니다.

    8. 그리고 그들이 땅에서 정의와 올바름을 행하게 하려는 것이었습니다.

    9. 다섯째 희년의 다섯째 주간에 셋이 자기 누이 아수라를 아내로 맞이하였고, 그 넷째 해에 그녀가 그에게 아들 하나를 낳아 주었습니다. 그는 그 이름을 에노스라 하였습니다. 그가 땅에서 주의 이름을 부르기 시작한 첫 사람이었습니다.

    10. 가인은 도시를 건축하고, 자기 아들 에녹의 이름을 따라 그 도시의 이름을 지었습니다.

    11. 그는 땅에 태어난 이들 가운데 처음으로 글쓰기와 가르침과 지혜를 배우고, 하늘의 징조들을 그 달들의 순서에 따라 책에 기록하였습니다. 이는 사람의 자손들이 각 달의 순서에 따라 해들의 시기를 알게 하려는 것이었습니다.

    12. 그는 처음으로 증거서를 기록하고, 땅의 세대들 가운데 사람의 자녀들에게 증언하였으며, 희년들의 주간들을 말하고 해들의 날들을 알게 하며 달들을 정하였습니다.

    13. 열한 번째 희년의 넷째 주에 야렛은 바르카라는 아내를 맞이했습니다. 그녀는 라수얄의 딸, 곧 야렛의 아버지의 형제의 딸이었습니다. 그녀는 그 희년의 다섯째 주 넷째 해에 그에게 아들을 낳았고, 그는 그 이름을 에녹이라 지었습니다.

    14. 열두 번째 희년의 일곱째 주에 에녹이 아내를 맞이했습니다. 그의 이름은 에드니였으며, 그는 에녹의 아버지의 형제인 다넬의 딸이었습니다. 이 주의 여섯째 해에 에드니가 아들을 낳았고, 에녹은 그의 이름을 므두셀라라고 불렀습니다.

    15. 그는 여섯 희년 동안 하나님의 천사들과 함께 있었으며, 그들은 땅과 하늘에 있는 모든 것과 해의 권세를 그에게 보여 주었습니다. 그는 모든 것을 기록하였습니다.

    16. 그들은 땅 위에서 정의와 올바름을 행하였습니다. 열째 희년의 첫째 주, 이 주의 넷째 해에 야렛은 아내를 맞아들였습니다. 그의 아내의 이름은 바라카였으며, 그녀는 라수야알의 딸이자 야렛의 아버지의 누이의 딸이었습니다. 그녀는 다섯째 주의 넷째 해에 그에게 아들을 낳았습니다.

    17. …희년의 해에 그 이름을 에녹이라 불렀습니다. 그는 지상에 태어난 사람들 가운데 글과 지식과 지혜를 배운 첫 사람이었으며, 하늘의 표징들을 그 달들의 순서에 따라 책에 기록하여, 그들이 알도록 하였습니다…

    18. 그는 처음으로 증언을 기록하고, 땅의 여러 세대 가운데 사람의 자녀들에게 증언하였으며, 희년들의 주간들을 낱낱이 말하고 연도의 날들을 알렸으며, 달들을 차례대로 정하였습니다.

    19. 그는 우리가 그에게 알려 준 대로 안식년들을 헤아렸고, 잠의 환상 가운데서 있었던 일과 있을 일을 보았으며, 사람의 자손들에게 그들의 세대들 가운데서 심판의 날까지 어떻게 일이 일어날지를 보았습니다. 그는 모든 것을 보고 깨달았으며, 자신의 증언을 기록하고 그 증언을 땅 위에 두었습니다…

    20. 그리고 열두 번째 희년의 일곱째 주에 그는 아내를 맞이했습니다. 그의 아내의 이름은 에드니였으며, 그는 다니엘의 딸이자 그의 아버지의 누이의 딸이었습니다. 이 주의 여섯째 해에 그녀가 그에게 아들을 낳았고, 그는 그의 이름을 …이라고 불렀습니다.

    21. 그는 하나님의 천사들과 함께 여섯 희년 동안 계속 있었습니다. 그들은 땅 위와 하늘에 있는 모든 것과 해의 권세를 그에게 보여 주었습니다. 그리고 그는 모든 것을 기록했습니다.

    22. 그는 사람의 딸들과 함께 죄를 지은 감시자들에게 증언했습니다. 이는 그들이 사람의 딸들과 결합하여 자신들을 더럽히기 시작했기 때문입니다. 에녹은 그들 모두를 거슬러 증언했습니다.'
