  yaml_path: translation/ot/job/012/005.yaml
  text: A torch is despised in the thought of one who is at ease; it is ready for those whose foot slips.
translation:
  language: te
  text: నిశ్చింతగా ఉన్నవాని తలంపులో కాగడా అవహేళనకు గురవుతుంది; కాలు జారేవారికోసం అది సిద్ధంగా ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַפִּיד
  choice: జ్యోతి
  rationale: ఈ పదానికి సాధారణంగా ‘కాగడా/జ్యోతి’ అనే అర్థం ఉంది. రూపకంలోని వెలుగునిచ్చే వస్తువును సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: בּוּז
  choice: తృణీకరించబడుతుంది
  rationale: హీబ్రూ నామవాచకం సూచించే ‘అవహేళన, తృణీకారం’ భావాన్ని వాక్యనిర్మాణానికి తగిన క్రియారూపంలో వ్యక్తం చేస్తుంది.
- source_word: לְעַשְׁתּוּת
  choice: ఆలోచనలో
  rationale: అరుదైన పదానికి ‘ఆలోచనలు/తలంపులు’ అనే భావాన్ని అనుసరిస్తూ, మూలంలోని అసాధారణ నిర్మాణాన్ని సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: שַׁאֲנָן
  choice: సుఖంగా ఉన్నవాని
  rationale: నిశ్చింతగా, భద్రంగా లేదా సౌకర్యంగా ఉన్న వ్యక్తిని సూచిస్తుంది; సందర్భంలో కష్టాన్ని అనుభవించని వ్యక్తి భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: נָכוֹן
  choice: సిద్ధంగా ఉంటుంది
  rationale: ‘స్థిరపరచబడినది/సిద్ధంగా ఉన్నది’ అనే మూలభావాన్ని నేరుగా అందిస్తుంది.
- source_word: לְמוֹעֲדֵי רָגֶל
  choice: కాలు జారుతున్నవారికి
  rationale: ‘పాదం తూలడం/జారడం’ అనే భావాన్ని వ్యక్తం చేస్తుంది. ఏకవచన ‘కాలు’ను ఉంచి, వర్గాన్ని సూచించే బహువచన వ్యక్తీకరణను తెలుగులో సహజంగా రూపొందించింది.
theological_decisions:
- issue: జ్యోతి దేనికి లేదా ఎవరికి ‘సిద్ధంగా’ ఉందనే రూపక సంబంధం
  choice: సర్వనామమైన ‘అది’ను జ్యోతికే అనుసంధానించి, మూలంలోని సంక్షిప్త రూపకాన్ని అలాగే ఉంచడం
  alternative: జారిపడేవారికి అపహాస్యం లేదా విపత్తు సిద్ధంగా ఉందని వివరణాత్మకంగా చెప్పడం
  rationale: హీబ్రూ వాక్యం ఉద్దేశపూర్వకంగా కుదించబడి, కొంత అస్పష్టంగా ఉంది. వివరణను పాఠ్యంలో చేర్చి ఆ ఉద్రిక్తతను తొలగించకుండా మూల నిర్మాణాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని సామెతసదృశ సంక్షిప్తతను, అస్పష్టతను నిలిపేందుకు అర్ధవిరామ చిహ్నం ఉపయోగించబడింది.
