reference: 4 Maccabees 7:17
source:
  edition: lxx-swete-1909
  text: ἴσως δʼ ἂν εἴποιέν τινες, τῶν παθῶν οὐ πάντες περικρατοῦσιν· ὅτι οὐδὲ πάντες φρόνιμον ἔχουσιν τὸν λογισμόν.
  language: Greek
  pages:
