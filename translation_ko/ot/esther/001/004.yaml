  source_fidelity: 현 초안은 첫 명사구인 ‘그의 왕국의 영광의 부’를 ‘자기 나라의 풍성한 재물’로 축소하고, 둘째 명사구를 세 항목으로 분리하여 히브리어의 두 병렬 목적어 구조를 벗어납니다. ‘영광스러운 부’와 ‘위대함의 찬란한 위엄’은 כָּבוֹד, יְקָר, תִּפְאֶרֶת의 누적된 수식 효과를 자연스럽게 보존합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, ‘여러 날 동안, 곧 백팔십 일 동안’은 히브리어의 일반적 기간 표현 뒤에 정확한 일수를 덧붙이는 방식을 유지합니다.
  terminology: מַלְכוּת는 문맥상 ‘나라’보다 왕의 통치 영역과 왕권을 함께 시사하는 ‘왕국’이 적절합니다. עֹשֶׁר는 ‘부’, כָּבוֹד는 ‘영광’, יְקָר와 תִּפְאֶרֶת의 결합은 ‘찬란한 위엄’으로 옮겼습니다.
