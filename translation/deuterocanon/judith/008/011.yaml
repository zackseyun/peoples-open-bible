  text: καὶ ἦλθον πρὸς αὐτήν· καὶ εἶπεν πρὸς αὐτούς Ἀκούσατέ δή μου, ἄρχοντες τῶν κατοικούντων ἐν Βαιτυλουά· ὅτι οὐκ εὐθὺς ὁ λόγος ὑμῶν ὃν ἐλαλήσατε ἐναντίον τοῦ λαοῦ ἐν τῇ ἡμέρᾳ ταύτῃ, καὶ ἐστήσατε τὸν ὅρκον ὃν ἐλαλήσατε ἀνὰ μέσον τοῦ θεοῦ καὶ ὑμῶν, καὶ εἴπατε ἐκδώσειν τὴν πόλιν τοῖς ἐχθροῖς ἡμῶν ἐὰν μὴ ἐν αὐταῖς ἐπιστρέψῃ ὁ κύριος βοήθειαν ὑμῖν.
