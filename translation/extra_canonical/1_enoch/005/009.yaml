translation:
  text: And they will not sin again, nor will they be condemned all the days of their lives. They will not die from punishment or wrath[a]; instead, they will complete the full number of their days and grow old in peace[b]. Their years of joy will multiply in gladness and everlasting peace throughout all the days of their lives.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Geʿez term can refer to a scourge or punitive affliction; it does not require epidemic disease.
    reason: lexical_alternative
  - marker: b
    text: The Geʿez idiom describes their life growing old in peace; the English expresses the plural possessors as people growing old.
    reason: lexical_alternative
lexical_decisions:
- source_word: አብሶ
  chosen: sin
  alternatives:
  - wrongdoing
  - offense
  rationale: Retains the moral force of the noun without specifying a particular offense.
- source_word: ይትኴነኑ
  chosen: be condemned
  alternatives:
  - be judged
  - be punished
  rationale: Conveys the adverse judgment implied by the passive verb without adding an agent.
- source_word: መቅሠፍት
  chosen: punishment
  alternatives:
  - scourge
  - punishment
  rationale: Conveys the broad punitive sense without requiring a specific epidemic; the image of a scourge remains in the footnote.
- source_word: መዓት
  chosen: wrath
  alternatives:
  - anger
  rationale: Keeps the force of the judgment language without identifying whose wrath it is.
- source_word: ኍልቈ መዋዕለ ሕይወቶሙ
  chosen: the number of their days
  alternatives:
  - the count of the days of their lives
  rationale: Preserves the explicit idea of a counted lifespan.
- source_word: ይሌህቅ
  chosen: grow old
  alternatives:
  - grow old
  - increase
  rationale: In the context of completing one’s numbered days, the verb expresses advancing in age.
- source_word: ዘለዓለም
  chosen: everlasting
  alternatives:
  - perpetual
  - enduring
  rationale: Preserves the expansive duration of the peace rather than reducing it to ordinary tranquility.
