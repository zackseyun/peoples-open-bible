translation:
  language: ko
  text: 그것이 뿔이 나고 굽이 갈라진 수소 한 마리보다 야훼를 더 기쁘시게 할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲהַֽלְלָ֣ה
  english_pob_choice: I will praise
  chosen_korean: 찬양하고
  alternatives_korean:
  - 기리며
  - 찬송하고
  - 칭송하며
  lexicon: HALOT
  rationale: הלל의 결의적 1인칭 표현을 한국어에서는 예배 문맥에 자연스러운 ‘찬양하다’로 옮기되, 뒤의 병렬 동사와 맞게 연결형으로 처리했습니다.
- source_word: שֵׁם אֱלֹהִ֣ים
  english_pob_choice: the name of God
  chosen_korean: 하나님의 이름
  alternatives_korean:
  - 하나님 이름
  - 하나님의 명
  lexicon: HALOT
  rationale: ‘이름’과 ‘하나님’의 관용적 결합을 그대로 살려, 단순 소유격보다 원문의 경외적 표현을 보존했습니다.
- source_word: בְּ/שִׁ֑יר
  english_pob_choice: with song
  chosen_korean: 노래로
  alternatives_korean:
  - 노래와 함께
  - 노래로써
  - 노래 가운데
  lexicon: HALOT
  rationale: ב + שִׁיר의 수단/방식 용법을 한국어 자연성에 맞게 도구격 ‘-로’로 옮겨, 행위의 방식이 분명하게 드러나도록 했습니다.
- source_word: בְ/תוֹדָֽה
  english_pob_choice: with thanksgiving
  chosen_korean: 감사로
  alternatives_korean:
  - 감사함으로
  - 감사와 함께
  - 감사제물로
  lexicon: HALOT
  rationale: 문맥상 노래와 병렬되는 언어적 감사가 우선이므로 추상명사 ‘감사’로 옮겼고, 제의적 가능성은 각주로 남겼습니다.
theological_decisions:
- issue: תּוֹדָה의 의미를 감사 표현으로 볼지, 감사제물로 볼지
  chosen_reading: 여기서는 verbal thanksgiving, 즉 말/노래로 드리는 감사로 읽습니다.
  alternative_readings:
  - 감사제물
  - 감사 제사
  rationale: 직전의 ‘찬양’, ‘노래’, ‘높이다’가 모두 언어적·예배적 응답을 이루므로, 제의적 의미보다 감사 표현이 문맥상 더 직접적입니다.
  doctrine_reference: 시편의 예배 언어와 제의 언어는 때로 겹치지만, 본 절은 병렬 구조상 언어적 감사의 흐름이 우세합니다.
