- source_word: וַיֵּדַע
  choice: e Deus soube
  rationale: Mantém o sentido básico e a concisão deliberadamente aberta de ידע, sem explicitar um objeto ausente no hebraico nem reduzir o verbo a 'tomou conhecimento'.
theological_decisions:
- issue: Objeto e alcance do conhecimento de Deus
  choice: Deus soube
  alternative: Deus tomou conhecimento da situação deles
  rationale: O texto hebraico termina sem objeto expresso. A tradução preserva essa tensão e evita inserir uma explicação teológica ou narrativa que o versículo não declara.
translation_notes:
  register: Português moderno, conciso e digno. A repetição de “Deus” foi mantida por corresponder à estrutura enfática do hebraico; “filhos de Israel” conserva a formulação formal e coletiva do original.
