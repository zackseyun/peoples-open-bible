id: PRO.6.35
reference: Proverbs 6:35
source:
  edition: WLC
  text: לֹא יִ֭שָּׂא פְּנֵ֣י כָל כֹּ֑פֶר וְ/לֹֽא יֹ֝אבֶ֗ה כִּ֣י תַרְבֶּה שֹֽׁחַד־־־־׃פ
translation:
  text: He will accept no ransom[a] and will not be persuaded, no matter how large the bribe.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Here, a payment offered to avert vengeance.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִשָּׂא פְּנֵי
  chosen: He will accept no
  alternatives:
  - He will show no favor to
  - He will not lift the face of
  lexicon: HALOT
  rationale: The idiom describes refusing to show favor by accepting the following payment. 'Accept no' is the natural contextual equivalent.
- source_word: כָל כֹּפֶר
  chosen: ransom
  alternatives:
  - compensation
  - appeasement payment
  lexicon: HALOT
  rationale: כֹּפֶר denotes a compensatory payment intended to avert consequences. 'Ransom' retains the term's force, while the broader alternative is footnoted.
- source_word: לֹא יֹאבֶה
  chosen: will not be persuaded
  alternatives:
  - will not consent
  - will not be willing
  - will not yield
  lexicon: HALOT
  rationale: The verb concerns willingness rather than emotional satisfaction. In the context of attempted financial appeasement, 'will not be persuaded' supplies the natural English sense without claiming that the payment is accepted.
- source_word: כִּי תַרְבֶּה שֹׁחַד
  chosen: no matter how large the bribe
  alternatives:
  - though you multiply the bribe
  - even if you offer a great bribe
  lexicon: HALOT
  rationale: The clause is concessive and the Hebrew noun is singular. The selected wording preserves both facts in idiomatic English.
