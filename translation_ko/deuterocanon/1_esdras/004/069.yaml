base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/069.yaml
  text: Then King Darius stood up and kissed him, and he wrote letters for him to all the stewards and local rulers and generals and satraps, that they should send him on his way, along with all those with him who were going up to rebuild Jerusalem.
translation:
  language: ko
  text: 그때 다리오 왕이 일어나 그에게 입을 맞추고, 모든 청지기와 지방 통치자와 장군과 사트라프에게 그를 위하여 편지를 써서, 그와 함께 예루살렘을 다시 세우려고 올라가는 모든 사람을 떠나보내도록 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεφίλησεν αὐτόν
  english_pob_choice: kissed him
  chosen_korean: 그에게 입을 맞추고
  alternatives_korean:
  - 그를 입맞추고
  - 그에게 키스하고
  lexicon: καταφιλέω
  rationale: 입을 맞추다는 본문이 말하는 친밀한 입맞춤 행위를 직접적으로 드러내면서도 현대 한국어에서 과도하게 구어적이지 않습니다.
- source_word: οἰκονόμους
  english_pob_choice: stewards
  chosen_korean: 청지기들
  alternatives_korean:
  - 관리들
  - 집정관들
  lexicon: οἰκονόμος
  rationale: 행정적 관리자를 뜻하는 표준적 대응으로, 왕실 재정·행정 담당자라는 맥락을 유지합니다.
- source_word: τοπάρχας καὶ στρατηγοὺς καὶ σατράπας
  english_pob_choice: local rulers and generals and satraps
  chosen_korean: 지방 통치자들과 장군들과 사트라프들
  alternatives_korean:
  - 지역 통치자들과 군대 지휘관들과 총독들
  - 지방 관원들과 군대 장관들과 총독들
  lexicon: τοπάρχης / στρατηγός / σατράπης
  rationale: 세 직함의 병렬 구조를 살리되, σατράπας는 행정관 용어인 ‘총독’보다 원어 음차 ‘사트라프’가 본문의 제국 행정 체계를 더 직접적으로 보여 줍니다.
- source_word: ἀναβαίνοντας ... οἰκοδομῆσαι
  english_pob_choice: who were going up to rebuild Jerusalem
  chosen_korean: 올라가 예루살렘을 다시 세우려는
  alternatives_korean:
  - 올라가 예루살렘을 재건하려는
  - 올라가 예루살렘을 건축하려는
  lexicon: ἀναβαίνω / οἰκοδομέω
  rationale: rebuild의 함의를 반영해 ‘다시 세우다’를 택해 단순 건축보다 회복·재건의 의미를 살렸습니다.
theological_decisions:
- issue: 예루살렘 재건의 뉘앙스
  chosen_reading: ‘다시 세우다’로 번역해 폐허 이후의 회복과 재건을 함께 드러냈습니다.
  alternative_readings:
  - ‘재건하다’
  - ‘건축하다’
  rationale: 영어 POB의 rebuild를 반영해 단순 신축보다 역사적 회복의 의미를 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 역사 서술 본문이며 교리 쟁점은 크지 않지만, 포로기 이후 회복이라는 문맥을 보존합니다.
