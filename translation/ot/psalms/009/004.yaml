  from: For you have upheld my justice and my cause[a]; you sat on the throne[b], judging righteously.
  to: For you have upheld my right and my cause[a]; you sat on the throne, judging righteously.[b]
  rationale: In this paired legal context, מִשְׁפָּטִי denotes the psalmist’s right or claim; “my justice” is misleading English. “My right and my cause” preserves both legal terms without implying that the psalmist administers justice. The markers are also correctly relocated.
