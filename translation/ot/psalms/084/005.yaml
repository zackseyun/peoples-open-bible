  from: Blessed is the man whose strength is in you[a][b], in whose heart are the highways.
  to: Blessed are those whose strength is in you, in whose hearts are the highways[a].
  rationale: אָדָם is a generic singular, while בלבבם has a plural suffix. A collective English rendering with “those” and “hearts” naturally represents the saying’s generic scope and preserves the overt plural in the latter colon better than silently singularizing it. “Highways” keeps the concrete source image without importing Zion as the destination.
