    rationale: The new wording expresses complete accomplishment naturally while retaining ‘with you’ and the undertaking’s unspecified scope.
  - source_phrase: οὐκ ἀποστεῖται ὁ κύριός μου τῶν ἐπιτηδευμάτων αὐτοῦ
    prior_rendering: my lord will not depart from his purposes
