  from: Yet the children of your bereavement will still say in your hearing[a], ‘The place is too cramped for me[b]; make room for me so that I may dwell.’
  to: The children born during your bereavement[a] will yet say in your hearing, ‘This place is too cramped for me; make room for me to live here.’
