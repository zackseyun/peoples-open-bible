    lexicon: Dillmann
    rationale: Simple narrative verb; 'saw' is readable modern English without losing force.
  - source_word: ብዙሐ ደመ
    chosen: much blood
    alternatives:
    - a great quantity of blood
    - much bloodshed
    lexicon: Dillmann
    rationale: The text speaks literally of 'much blood'; 'bloodshed' would interpret the image, while 'much blood' preserves
      the stark apocalyptic concreteness.
  - source_word: ዘይትከዓው
    chosen: being poured out
    alternatives:
    - being shed
    - crying out
    lexicon: Dillmann
    rationale: Given the object 'blood' and the following phrase 'upon the earth,' the passive sense 'being poured out' fits
      the scene of violence. 'Being shed' is possible, but 'poured out' better preserves the vivid physical imagery. A minority
      interpretive possibility connects the verb with crying out, likely influenced by blood-cry motifs elsewhere; that is
      not adopted in the main text.
  - source_word: በዲበ ምድር
    chosen: upon the earth
    alternatives:
    - on the earth
    - over the earth
    lexicon: Dillmann
    rationale: Retains the repeated locative phrase and the elevated register appropriate to apocalyptic narrative.
  - source_word: ኵሎ ዓመፃ
    chosen: all the lawlessness
    alternatives:
    - all the violence
    - all the wrongdoing
    - all the injustice
    lexicon: Dillmann
    rationale: The noun denotes wicked transgression broadly, not only physical violence. 'Lawlessness' preserves the moral-juridical
