  text: Look[a], he comes up like clouds, and his chariots are like the whirlwind; his horses are swifter than eagles. Woe to us, for we are ruined!
  footnotes:
  - marker: a
    text: Or 'than vultures'; the Hebrew נְשָׁרִים can refer more broadly to large carrion birds or raptors, though 'eagles' is the traditional rendering here.
