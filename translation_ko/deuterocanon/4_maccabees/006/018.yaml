- from: 그리고 참으로 이치에 맞지 않습니다. 만일 우리가 늙음에 이를 때까지 진리 안에서 살아왔고, 그 위에 세워진 평판을 합당하게 지켜 왔는데, 이제 와서 돌이키려 한다면 말입니다.
