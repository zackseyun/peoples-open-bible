translation:
  text: Before the temple I asked for her, and to the end I will seek her[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This Greek working reading describes petition before the temple and continued seeking. Manuscript B instead has prayer in youth followed by finding knowledge, and orders the corresponding units 13, 15, 14, 16. The published 11Q5 opening here has been interpreted as coming in beauty, not as the same temple wording. The earlier Hebrew form remains under review.
    reason: textual_variant
lexical_decisions:
- source_word: ἔναντι ναοῦ
  chosen: Before the temple
  alternatives:
  - in front of the temple
  rationale: The phrase locates the request before the temple; 'before' has a spatial sense here, not a temporal one.
- source_word: ἠξίουν περὶ αὐτῆς
  chosen: I asked for her
  alternatives:
  - I made request concerning her
  rationale: The imperfect verb expresses making a request, with the feminine pronoun referring to wisdom. 'Asked for her' fits the prayer context without importing the former Hebrew line.
- source_word: καὶ ἕως ἐσχάτων
  chosen: and to the end
  alternatives:
  - and until the last
  rationale: The temporal expression gives the continuing extent of the pursuit without specifying a reconstructed Hebrew wording.
- source_word: ἐκζητήσω αὐτήν
  chosen: I will seek her
  alternatives:
  - I will seek her out
  rationale: The future verb commits to seeking personified wisdom. The feminine object remains explicit in English.
