- from: 저는 제 하소연을 그분 앞에 쏟아 놓습니다[a]; 제 고통을 그분 앞에 알립니다.
  to: 제 영이 제 안에서 기운을 잃을 때[a], 주님께서는 제 길을 아십니다. 제가 걷는 길에서 그들이 저를 노리고 덫을 숨겨 놓았습니다[b].
  rationale: 원문 절의 시간절(‘제 영이 … 기운을 잃을 때’), 하나님의 현재의 앎(‘주님께서는 제 길을 아십니다’), 그리고 적대자들이 숨긴 덫을 빠짐없이 반영했습니다. בְּהִתְעַטֵּף의 ‘쇠약해지다/짓눌리다’라는 의미 범위와 פַח의 ‘덫/올무’라는 대안은 각주에 보존했습니다. ‘저를 노리고’는 לִי가 나타내는, 시편 기자를 겨냥한 덫이라는 뜻을 자연스러운 한국어로 드러냅니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:36:54Z'
