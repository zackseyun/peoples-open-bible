id: JOB.6.17
reference: Job 6:17
source:
  edition: WLC
  text: בְּ֭/עֵת יְזֹרְב֣וּ נִצְמָ֑תוּ בְּ֝/חֻמּ֗/וֹ נִדְעֲכ֥וּ מִ/מְּקוֹמָֽ/ם׃
translation:
  text: When the weather warms, they vanish; in the heat, their beds run dry.
  philosophy: dynamic
lexical_decisions:
- source_word: בְּעֵת
  chosen: When
  alternatives:
  - At the time when
  - In the season when
  lexicon: HALOT
  rationale: Temporal preposition plus noun introduces a time clause. 'When' is the most natural modern English equivalent and preserves the clause relationship without unnecessary stiffness.
- source_word: יְזֹרְבוּ
  chosen: they grow warm
  alternatives:
  - they become warm
  - they are heated
  lexicon: HALOT
  rationale: The rare verb concerns becoming warm or heated; this intransitive wording is natural with the watercourses as subject.
- source_word: נִצְמָתוּ
  chosen: they vanish
  alternatives:
  - they are extinguished
  - they disappear
  - they come to an end
  lexicon: HALOT
  rationale: The Niphal form conveys being ended, destroyed, or disappearing. In the imagery of seasonal streams, 'they vanish' best fits the context of waters drying away while remaining vivid and readable.
- source_word: בְּחֻמּוֹ
  chosen: in the heat
  alternatives:
  - in its heat
  - by his heat
  - in the heat
  lexicon: HALOT
  rationale: This retains the compact nominal expression, while the note acknowledges the pronominal suffix and contextual possibilities.
- source_word: נִדְעֲכוּ
  chosen: they dry up
  alternatives:
  - they are quenched
  - they are extinguished
  - they are dried out
  lexicon: HALOT
  rationale: The verb can mean be extinguished or quenched, but in context of watercourses under heat, 'they dry up' brings out the concrete force of the metaphor more clearly than the more fire-oriented 'are extinguished.'
- source_word: מִמְּקוֹמָם
  chosen: from their place
  alternatives:
  - from their channel
  - from where they are
  - out of their place
  lexicon: HALOT
  rationale: The noun means place/location. 'From their place' is formally close and understandable. 'Channel' would interpret the image more specifically than the Hebrew states, so it is better preserved as a footnotable alternative rather than placed in the main text.
- source_word: נִדְעֲכוּ מִמְּקוֹמָם
  chosen: they disappear from their place
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This preserves the image of the watercourses ceasing at their location without specifying a physical mechanism more narrowly than the Hebrew does.
