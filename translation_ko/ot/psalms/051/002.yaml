  - marker: c
    text: Or 'according to the greatness or multitude of your mercies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 주의 한결같은 사랑에 따라 내게 은혜를 베풀어 주십시오.[a] 주의 크신 긍휼에 따라 나의 죄악들을 지워 주십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''내게 은혜를 베풀어 주십시오''는 ''내게 자비를 베풀어 주십시오''로도 옮길 수 있습니다. 히브리어 동사는 하나님의 호의와 은혜를 구하는 말입니다.'
    reason: lexical_alternative
  - marker: b
    text: '''크신 긍휼''은 ''풍성한 긍휼'' 또는 ''많은 긍휼''로도 옮길 수 있습니다. 히브리어는 긍휼을 복수형으로 표현합니다.'
    reason: lexical_alternative
