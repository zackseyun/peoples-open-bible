id: PRO.24.28
reference: Proverbs 24:28
source:
  edition: WLC
  text: אַל תְּהִ֣י עֵד חִנָּ֣ם בְּ/רֵעֶ֑/ךָ וַ֝/הֲ/פִתִּ֗יתָ בִּ/שְׂפָתֶֽי/ךָ־־׃
translation:
  text: Do not testify against your neighbor without cause. Would you deceive with your lips?
  philosophy: dynamic
lexical_decisions:
- source_word: אַל
  chosen: Do not
  alternatives:
  - must not
  lexicon: HALOT
  rationale: Standard negative prohibition particle introducing a direct prohibition.
- source_word: תְּהִי
  chosen: be
  alternatives:
  - become
  lexicon: HALOT
  rationale: 'Qal imperfect/jussive of היה after אַל functions as a prohibition: ''do not be.'''
- source_word: עֵד
  chosen: a witness
  alternatives:
  - a testimony-bearer
  lexicon: HALOT
  rationale: The noun denotes a witness, especially in a legal or quasi-legal setting; 'witness' is the natural English equivalent.
- source_word: חִנָּם
  chosen: without cause
  alternatives:
  - for nothing
  - gratuitously
  - without reason
  lexicon: HALOT
  rationale: Here the adverb modifies the witnessing as groundless or unjustified. 'Without cause' communicates the ethical/legal sense better than the more wooden 'for nothing.'
- source_word: בְּרֵעֶךָ
  chosen: against your neighbor
  alternatives:
  - concerning your neighbor
  - with respect to your neighbor
  lexicon: HALOT
  rationale: Although ב can be rendered broadly, with 'witness' in legal context English idiom is 'bear/be a witness against' someone. 'Neighbor' preserves the covenantal-social sense of רֵעַ.
- source_word: וַהֲפִתִּיתָ
  chosen: Would you deceive
  alternatives:
  - and deceive
  - and mislead
  - and entice
  lexicon: HALOT
  rationale: The prefixed interrogative marks a rhetorical question; “deceive” suits the context of misleading speech or testimony.
- source_word: בִּשְׂפָתֶיךָ
  chosen: with your lips
  alternatives:
  - by your speech
  - with your words
  lexicon: HALOT
  rationale: A concrete Hebrew idiom for speech. 'With your lips' preserves the imagery while remaining clear in English.
