lexical_decisions:
- source_word: συνῆξεν
  chosen: gathered
  alternatives:
  - assembled
  - collected
  lexicon: LSJ
  rationale: Aorist of συνάγω here refers to mustering military resources. 'Gathered' is natural modern English and preserves the concrete sense without overinterpreting.
- source_word: δύναμιν
  chosen: force
  alternatives:
  - power
  - army
  lexicon: LSJ
  rationale: In this military context, δύναμις most naturally denotes armed strength or forces. 'Force' preserves the military sense while allowing the phrase to include more than a formal standing army.
- source_word: ἰσχυρὰν σφόδρα
  chosen: very strong
  alternatives:
  - exceedingly strong
  - extremely powerful
  lexicon: LSJ
  rationale: The adjective-adverb combination intensifies the description. 'Very strong' is straightforward, readable English that reflects the emphatic force without sounding inflated.
- source_word: ἦρξεν
  chosen: began to rule over
  alternatives:
  - ruled over
  - began to reign over
  lexicon: LSJ
  rationale: ἄρχω with a genitive can mean 'rule over,' and the aorist here can mark the onset of his dominion. 'Began to rule over' preserves that ingressive nuance better than a simple 'ruled over.'
- source_word: χωρῶν
  chosen: lands
  alternatives:
  - regions
  - countries
  lexicon: LSJ
  rationale: χώρα commonly denotes land, territory, or region. 'Lands' fits the plural political-geographical sense here without implying modern nation-states.
- source_word: ἐθνῶν
  chosen: nations
  alternatives:
  - peoples
  - Gentile nations
  lexicon: LSJ
  rationale: ἔθνη here refers broadly to peoples/nations under conquest. 'Nations' is the most natural political rendering in this historical context.
- source_word: τυραννιῶν
  chosen: tyrannies
  alternatives:
  - principalities
  - despotisms
  - tyrant-realms
  lexicon: LSJ
  rationale: The Greek denotes realms or governments under tyrants, not merely the abstract quality of oppression. 'Tyrannies' is the closest formal rendering, though somewhat unusual in English; it preserves the political category named in the source better than smoothing it away.
- source_word: ἐγένοντο αὐτῷ εἰς φόρον
  chosen: became tributary to him
  alternatives:
  - became subject to tribute to him
  - paid tribute to him
  lexicon: LSJ
  rationale: The phrase indicates coming under tribute obligation. 'Became tributary to him' captures both the resulting state and the fiscal-political subjection more precisely than the simpler 'paid tribute.'
