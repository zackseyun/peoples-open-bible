id: 4MA.4.3
reference: 4 Maccabees 4:3
source:
  edition: lxx-swete-1909
  text: Σίμων ὢν τοῖς τοῦ βασιλέως πράγμασιν ἥκω, μηνύων πολλὰς ἰδιωτικῶν χρημάτων μυριάδας ἐν τοῖς Ἱεροσολύμων γαζοφυλακίοις τεθησαυρίσθαι τῷ ἱερῷ μὴ ἐπικοινωνούσας, ἀλλὰ προσήκειν ταῦτα Σελεύκῳ τῷ βασιλεῖ.
  language: Greek
  pages:
