source:
  edition: WLC
  text: לֹ֤א בִ/גְבוּרַ֣ת הַ/סּ֣וּס יֶחְפָּ֑ץ לֹֽא בְ/שׁוֹקֵ֖י הָ/אִ֣ישׁ יִרְצֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/010.yaml
  text: He does not delight in the strength of the horse; he takes no pleasure in the legs of the man.
translation:
  language: ko
  text: 그는 말의 힘을 기뻐하지 않으십니다. 사람의 다리도 기뻐하지 않으십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִגְבוּרַת הַסּוּס
  english_pob_choice: the strength of the horse
  chosen_korean: 말의 힘
  alternatives_korean:
  - 말의 강함
  - 말의 능력
  - 말의 위력
  lexicon: גְבוּרָה → 힘, סוּס → 말
  rationale: 원문은 말을 지탱하는 군사적 힘/능력을 가리키므로, 자연스러운 표준어로 압축해 '말의 힘'이라 옮겼습니다. '강함'보다 '힘'이 원문의 추상 명사를 더 सीधे 반영합니다.
- source_word: יֶחְפָּץ
  english_pob_choice: does not delight
  chosen_korean: 기뻐하지 않으십니다
  alternatives_korean:
  - 즐거워하지 않으십니다
  - 마음에 들어 하지 않으십니다
  - 좋아하지 않으십니다
  lexicon: חפץ → 기뻐하다/즐거워하다
  rationale: פָּצֵץ 계열의 '원하다/기뻐하다/즐기다' 뉘앙스를 반영해, 하나님의 선호가 없음을 분명히 하는 '기뻐하지 않으십니다'를 택했습니다.
- source_word: שׁוֹקֵי הָאִישׁ
  english_pob_choice: the legs of the man
  chosen_korean: 사람의 다리
  alternatives_korean:
  - 사람의 종아리
  - 사람의 다리들
  - 남자의 다리
  lexicon: שׁוֹק → 다리/정강이
  rationale: 직역하면 '정강이/다리' 범위의 표현이지만, 한국어에서 자연스럽고 본문 대비를 살리기 위해 '사람의 다리'로 옮겼습니다. 영어 POB의 'the man'을 따라 특정 남성보다 일반적 인간을 가리키는 말로 처리했습니다.
theological_decisions:
- issue: 대조 구조에서 인간의 군사력/신체 능력에 대한 하나님의 선호 부정
  chosen_reading: 말의 힘과 사람의 다리를 기뻐하지 않으신다는, 외형적 전력과 인간의 능력을 의지하지 않으시는 하나님을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 말의 힘을 좋아하지 않으신다
  - 군마와 사람의 다리를 기쁘게 여기지 않으신다
  rationale: 시편의 병행법은 전쟁력과 인간 능력을 모두 상대화합니다. 이를 완화하지 않고 두 항을 같은 강도로 보존해야 본문의 신학적 충격이 살아납니다.
  doctrine_reference: 시편 147편의 창조주·통치자 하나님 이해
