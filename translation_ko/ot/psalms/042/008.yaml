  text: By day Yahweh commands his steadfast love, and at night his song[a] is with me—a prayer to the God of my life[b].
  footnotes:
  - marker: a
    text: Or 'your cataracts'; older English versions often have 'your waterspouts.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all your breakers and your billows have swept over me.'
    reason: lexical_alternative
