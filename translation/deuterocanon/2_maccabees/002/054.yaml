id: 2MA.2.54
reference: 2 Maccabees 2:54
source:
  edition: lxx-swete-1909
  text: καθάπερ τῷ παρασκευάζοντι συμπόσιον, ἢ καὶ ζητοῦντι τὴν ἑτέρων ὠφέλειαν, οὐκ εὐχερές· ὅμως διὰ τὴν τῶν πολλῶν εὐχαριστίαν ἡδέως τὴν κακοπάθειαν ὑποίσομεν·
  language: Greek
