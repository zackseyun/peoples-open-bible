  source_fidelity: 초안은 마지막 절의 히브리어 3인칭 복수 청유형 וִיבָרְכוּ를 다시 직접 명령인 ‘찬송하라’로 바꾸어, 원문의 인칭과 양태를 잃었습니다. 또한 ‘감사’는 תְהִלָּה(찬양)의 번역이 아니며, ‘찬송을 받으실’은 원문에 없는 내용을 보탭니다. 개정문은 청유의 의미와 ‘모든 송축과 찬양 위에 높이 드러난’ 하나님의 이름이라는 구문을 보존합니다.
  naturalness: 초안에는 ‘예수[a],kadmiel’처럼 쉼표 뒤 띄어쓰기와 로마자 표기가 혼재되어 있고, 이름 표기도 일관되지 않습니다. 개정문은 표준적인 한국어 음역과 자연스러운 현대 문장부호를 사용하며, 인용문에는 합쇼체 명령형을 유지합니다.
  terminology: יְהוָה는 제공된 최신 영어 POB 결정에 따라 ‘야훼’로 옮겼습니다. בָּרַךְ의 반복은 ‘송축하다’로, תְהִלָּה는 ‘찬양’으로 옮겼습니다. שֵׁם כְּבוֹדֶךָ는 자연스럽게 ‘주의 영광스러운 이름’으로 번역하되 문자적 대안을 각주로 제시합니다.
  issues:
