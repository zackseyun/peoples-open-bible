lexical_decisions:
- source_word: ἐννοήθητε
  lemma: ἐννοέω
  chosen: consider
  alternatives:
  - understand
  - take to heart
  - reflect
  lexicon: LSJ
  rationale: Aorist imperative plural from ἐννοέω. In context Mattathias is urging reflective recognition based on Israel's history. 'Consider' is natural modern English and preserves the exhortational force without over-paraphrasing.
- source_word: κατὰ γενεὰν
  chosen: from generation to generation
  alternatives:
  - by generation
  - throughout generations
  lexicon: LSJ
  rationale: The phrase idiomatically points across successive generations rather than a single generation considered distributively. 'From generation to generation' best conveys the historical sweep being invoked.
- source_word: ἐλπίζοντες
  chosen: hope
  alternatives:
  - trust
  - set their hope
  lexicon: LSJ
  rationale: Present participle of ἐλπίζω. 'Hope' is the most direct rendering and fits the theological sense of confident reliance on God in this context. 'Trust' is possible but slightly shifts the semantic center.
- source_word: ἐπʼ αὐτόν
  chosen: in him
  alternatives:
  - on him
  lexicon: LSJ
  rationale: With ἐλπίζω, English idiom prefers 'hope in him' rather than the more wooden 'hope on him.' The referent is God from the surrounding context.
- source_word: ἀσθενήσουσιν
  chosen: will not grow weak
  alternatives:
  - will not be weak
  - will not fail
  - will not be powerless
  lexicon: LSJ
  rationale: Future of ἀσθενέω, literally 'be weak' or 'become weak.' 'Will not grow weak' preserves the verbal sense and avoids importing a stronger result such as 'fail' unless context requires it.
