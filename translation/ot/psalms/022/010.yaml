  meaning_decisions:
  - source_phrase: עָלֶיךָ הָשְׁלַכְתִּי מֵרָחֶם
    prior_rendering: On you I was cast from the womb
    new_rendering: From birth I was entrusted to your care
    rationale: The casting metaphor expresses being placed in dependence on God from birth, not being physically thrown onto him. The main text conveys that relationship, and the note preserves the meaningful source image.
  - source_phrase: מִבֶּטֶן אִמִּי אֵלִי אָתָּה
    prior_rendering: from my mother’s belly you are my God
    new_rendering: from my mother’s womb you have been my God
    rationale: Here “belly” means the mother’s womb, and the temporal phrase establishes a relationship continuing from birth to the present. English requires the present perfect to express that continuity naturally; the two Hebrew anatomical terms do not require different English referents.
