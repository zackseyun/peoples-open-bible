  text: ὁ δὲ βασιλεὺς ἔθυμος γενόμενος καὶ ταῖς τοῦ πανπονήρου διαβολαῖς ἐρεθισθεὶς ἔγραψεν Νικάνορι ὑπὲρ μὲν τῶν συνθηκῶν, φάσκων βαρέως φέρειν, κελεύων δὲ τὸν Μακκαβαῖον δέσμιον ἐξαποστέλλειν εἰς Ἀντιόχειαν ταχέως.
