id: EXO.4.24
reference: Exodus 4:24
source:
  edition: WLC
  text: וַ/יְהִ֥י בַ/דֶּ֖רֶךְ בַּ/מָּל֑וֹן וַ/יִּפְגְּשֵׁ֣/הוּ יְהוָ֔ה וַ/יְבַקֵּ֖שׁ הֲמִיתֽ/וֹ׃
translation:
  text: And it happened on the way, at the lodging place[a], that Yahweh[b] met him[c] and sought to put him to death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'at the night encampment'; the Hebrew refers to a place of lodging, not necessarily a commercial inn.
    reason: lexical_alternative
  - marker: b
    text: The selected Greek text and Targum Onkelos have 'an angel of the Lord' here. The Hebrew source used in this translation and the consulted Samaritan text name Yahweh directly; original priority remains uncertain.
    reason: textual_variant
  - marker: c
    text: The Hebrew does not name the threatened person here. Moses and his son are proposed interpretations, not explicit wording.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  chosen: And it happened
  alternatives:
  - Now it happened
  - And it came to pass
  lexicon: HALOT
  rationale: Narrative wayyiqtol of היה introducing a new episode. 'And it happened' preserves the Hebrew discourse function without archaic English.
- source_word: בַדֶּרֶךְ
  chosen: on the way
  alternatives:
  - along the way
  - during the journey
  lexicon: HALOT
  rationale: Straightforward locative phrase; 'on the way' is idiomatic and close to the Hebrew.
- source_word: בַמָּלוֹן
  chosen: at the lodging place
  alternatives:
  - at the night encampment
  - at the inn
  lexicon: HALOT
  rationale: מָלוֹן denotes a place of lodging for the night, not necessarily a commercial inn in the modern sense. 'Lodging place' avoids anachronism while remaining natural English.
- source_word: וַיִּפְגְּשֵׁהוּ
  chosen: met him
  alternatives:
  - encountered him
  - confronted him
  lexicon: WLC/OSHB source analysis and bounded published-source comparison
  rationale: The verb is פגש (pgš), Qal wayyiqtol with a masculine object suffix, as in 4:27; not פגע. The following death clause supplies hostility, not meeting alone. The object is not named.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: WLC/OSHB source analysis and bounded published-source comparison
  rationale: The declared WLC source explicitly has the divine name, also in the consulted Samaritan control. Render Yahweh on that source while disclosing actual Greek and Onkelos angelic agency. This is not proof of original priority or rejection of angels on theological grounds.
- source_word: וַיְבַקֵּשׁ
  chosen: sought
  alternatives:
  - tried
  - intended
  lexicon: HALOT
  rationale: בקש commonly means seek. 'Sought' preserves the verbal nuance and the narrative tension better than a more interpretive gloss.
- source_word: הֲמִיתוֹ
  chosen: to put him to death
  alternatives:
  - to kill him
  - to cause his death
  lexicon: HALOT
  rationale: Hiphil infinitive of מות with 3ms suffix. 'Put him to death' is slightly more formal and weighty than 'kill him,' fitting the gravity of divine action while remaining clear.
