simplification_decisions:
- pob_phrase: For certain men have slipped in unnoticed, who long ago were designated for this judgment
  simplified_phrase: Some men have slipped in unnoticed. Long ago, they were designated for this judgment.
  preserved_meaning: The men entered secretly and had already been identified for judgment long before.
  reasoning_layer_used: POB lexical decisions and theological decision on προγεγραμμένοι
  rationale: Two short sentences clarify the sequence while the footnote preserves the prior-written-about reading.
- pob_phrase: turn the grace of our God into sensuality
  simplified_phrase: use the grace of our God to justify shameless self-indulgence
  preserved_meaning: They distort God’s grace into permission for morally unrestrained behavior.
  reasoning_layer_used: POB lexical decisions for χάριτα, μετατιθέντες, and ἀσέλγειαν
  rationale: The wording explains the misuse of grace and the shameless excess conveyed by the source term.
- pob_phrase: deny our only Master and Lord, Jesus the Messiah
  simplified_phrase: deny Jesus the Messiah, our only Master and Lord
  preserved_meaning: Both distinct titles describe Jesus, whom these men deny.
  reasoning_layer_used: POB theological decision on the titles’ referent and lexical decision for Χριστός
  rationale: Reordering identifies Jesus immediately while retaining both titles and the chosen rendering “Messiah.”
