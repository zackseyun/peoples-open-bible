translation:
  language: en
  text: Every spirit that does not confess Jesus does not come from God.[a] This is the spirit of the antichrist. You have heard that it is coming, and it is already in the world.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read, “does not confess that Jesus the Messiah has come in the flesh.”
    reason: textual_variant
simplification_decisions:
- pob_phrase: is not from God
  simplified_phrase: does not come from God
  preserved_meaning: The spirit does not have its source or origin in God.
  reasoning_layer_used: Lexical decision for ἐκ τοῦ θεοῦ
  rationale: The verb “come” makes the source relationship immediately clear.
- pob_phrase: which you have heard is coming
  simplified_phrase: You have heard that it is coming
  preserved_meaning: The readers had already heard that the antichrist spirit would come.
  reasoning_layer_used: Lexical decision for ἀκηκόατε ὅτι ἔρχεται
  rationale: A new sentence removes the difficult relative clause without using the over-specific pronoun “he.”
- pob_phrase: and now is already in the world
  simplified_phrase: and it is already in the world
  preserved_meaning: The expected antichrist spirit is present in the world now.
  reasoning_layer_used: Lexical decisions for ἐν τῷ κόσμῳ and ἤδη
  rationale: The explicit subject produces natural English while keeping the emphasis on present reality.
