translation:
  language: en
  text: In Christ Jesus, there is no separation between Jew and Greek, servant and free, or male and female.[a] You are all one in him.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek literally says “male and female,” likely echoing Genesis 1:27.
