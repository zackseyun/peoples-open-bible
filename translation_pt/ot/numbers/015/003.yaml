  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: pt
  text: e apresentardes a Yahweh uma oferta queimada[a] — seja holocausto ou sacrifício — para cumprir um voto, como oferta voluntária ou em suas ocasiões determinadas[b], a fim de produzir aroma agradável a Yahweh, do gado ou do rebanho,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “oferta apresentada por fogo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em vossas festas determinadas”. O termo hebraico pode se referir, de modo amplo, a ocasiões marcadas ou, mais especificamente, a festas religiosas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם אִשֶּׁה
  choice: apresentarem [...] uma oferta consumida pelo fogo
  rationale: No contexto sacrificial, o verbo ‘fazer’ tem o sentido idiomático de apresentar uma oferta; אִשֶּׁה designa uma oferta entregue por meio do fogo.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama e conserva a direção da oferta.
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo português tradicional e preciso para o sacrifício inteiramente queimado.
- source_word: זֶבַח
  choice: outro sacrifício
  rationale: O substantivo é amplo; ‘outro’ torna natural o contraste com o holocausto sem especificar indevidamente uma modalidade.
- source_word: לְפַלֵּא נֶדֶר
  choice: para cumprir um voto
  rationale: Expressa naturalmente a realização da oferta prometida por voto.
- source_word: בִנְדָבָה
  choice: como oferta voluntária
  rationale: Preserva o uso técnico para uma oferta espontânea, não exigida por voto.
- source_word: בְּמֹעֲדֵיכֶם
  choice: em suas ocasiões determinadas
  rationale: Mantém a amplitude de מוֹעֵד, que pode indicar tempos marcados em geral ou, mais especificamente, festas religiosas.
- source_word: לַעֲשׂוֹת רֵיחַ נִיחֹחַ
  choice: a fim de produzir um aroma agradável
  rationale: Conserva a metáfora cultual e traduz diretamente a construção infinitiva sem acrescentar uma teoria de apaziguamento.
- source_word: מִן הַבָּקָר אוֹ מִן הַצֹּאן
  choice: tirando o animal do gado ou do rebanho
  rationale: Distingue bovinos de animais de pequeno porte, sobretudo ovelhas e cabras, com linguagem clara e coletiva.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; ‘Yahweh’ preserva o nome divino em vez de substituí-lo por um título.
- issue: Metáfora sacrificial רֵיחַ נִיחֹחַ
  choice: um aroma agradável
  alternative: um aroma apaziguador; um cheiro suave
  rationale: Mantém a imagem antropomórfica do hebraico sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem regionalismos marcados. A oração permanece ligada ao contexto iniciado no versículo anterior; por isso começa em minúscula e termina com vírgula.
