id: 2CH.3.3
reference: 2 Chronicles 3:3
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הוּסַ֣ד שְׁלֹמֹ֔ה לִ/בְנ֖וֹת אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים הָ/אֹ֡רֶךְ אַמּ֞וֹת בַּ/מִּדָּ֤ה הָ/רִֽאשׁוֹנָה֙ אַמּ֣וֹת שִׁשִּׁ֔ים וְ/רֹ֖חַב אַמּ֥וֹת עֶשְׂרִֽים־׃
translation:
  text: 'These were the dimensions of the foundation Solomon laid[a] for building the house of God: sixty cubits long and twenty cubits wide, measured by the older cubit standard[b].'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, These were Solomon's plans for building the house of God; the Hebrew opening is difficult.
    reason: alternative_reading
  - marker: b
    text: A cubit was a measure based on the length of a forearm; the exact length of this older standard is uncertain.
    reason: cultural_note
lexical_decisions:
- source_word: הוּסַד
  chosen: foundations
  alternatives:
  - foundation
  - plan
  - basis
  lexicon: HALOT
  rationale: 'The passive/perfect form from יסד is difficult in context. In this construction introducing the temple dimensions, it most naturally refers to the foundational specifications or foundation-laying for Solomon’s building work. Rendering with the plural ''foundations'' gives idiomatic English after ''these are'' and fits the sense of what follows as foundational measurements. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: לִבְנוֹת
  chosen: for building
  alternatives:
  - to build
  - in building
  lexicon: HALOT
  rationale: The infinitive construct with ל expresses purpose. 'For building' works smoothly with 'these are Solomon’s foundations' and preserves the purposive sense.
- source_word: בֵּית הָאֱלֹהִים
  chosen: the house of God
  alternatives:
  - God’s house
  - the temple of God
  lexicon: HALOT
  rationale: A formally close rendering preserves the temple idiom of the Hebrew. 'Temple' is interpretive but accurate; 'house of God' better reflects the source wording.
- source_word: הָאֹרֶךְ
  chosen: the length
  lexicon: HALOT
  rationale: Standard architectural term matching the measurement context.
- source_word: אַמּוֹת
  chosen: cubits
  lexicon: HALOT
  rationale: The ancient unit should be retained rather than converted, since the Hebrew explicitly gives dimensions in cubits.
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  chosen: by the former measure
  alternatives:
  - according to the former standard
  - by the old cubit
  lexicon: HALOT
  rationale: The phrase most naturally qualifies the cubit measurement as following an earlier standard. 'By the former measure' is concise and close to the Hebrew while leaving the exact historical referent open.
- source_word: שִׁשִּׁים
  chosen: sixty
  lexicon: HALOT
  rationale: Cardinal number for the temple length.
- source_word: וְרֹחַב
  chosen: and the width
  alternatives:
  - and width
  - its width
  lexicon: HALOT
  rationale: Supplying the article in English yields natural parallelism with 'the length.' The possessive 'its' is implied but not required.
- source_word: עֶשְׂרִים
  chosen: twenty
  lexicon: HALOT
  rationale: Cardinal number for the temple width.
