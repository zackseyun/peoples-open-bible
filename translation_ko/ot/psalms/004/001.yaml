source:
  edition: WLC
  text: בְּ/קָרְאִ֡/י עֲנֵ֤/נִי אֱלֹ֘הֵ֤י צִדְקִ֗/י בַּ֭/צָּר הִרְחַ֣בְתָּ לִּ֑/י חָ֝נֵּ֗/נִי וּ/שְׁמַ֥ע תְּפִלָּתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/001.yaml
  text: When I call, answer me, O God of my righteousness[a]. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
  footnotes:
  - marker: a
    text: Or “O my righteous God” or “O God who vindicates me.” The Hebrew literally reads “God of my righteousness.”
    reason: alternative_reading
  - marker: b
    text: 'Or “you have relieved me.” The Hebrew image is spatial: “you have made room for me” out of distress or constriction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 부를 때에 제게 응답해 주십시오, 제 의의 하나님이시여.[a] 고난 중에 제게 넓은 자리를 마련해 주셨습니다.[b] 제게 은혜를 베풀어 주시고 제 기도를 들어 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저의 의로우신 하나님이시여’ 또는 ‘저를 의롭다 하시는 하나님이시여.’ 히브리어는 직역하면 ‘내 의의 하나님’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘저를 구원해 주셨습니다.’ 히브리어는 고난이나 궁지에서 벗어나도록 ‘넓게 하다’라는 공간적 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 선창자에게
  - 지휘하는 사람에게
  lexicon: HALOT
  rationale: 시편 표제에서 이 표현은 음악을 맡은 책임자에게 주는 지시로 이해되므로, 현대 한국어에서는 문맥이 분명한 ‘지휘자에게’가 가장 자연스럽습니다.
- source_word: בִּנְגִינ֗וֹת
  english_pob_choice: with stringed instruments
  chosen_korean: 줄악기로
  alternatives_korean:
  - 현악기로
  - 현악 반주로
  - 줄로 된 악기로
  lexicon: HALOT
  rationale: 히브리어는 현악 계열의 반주를 가리키며, ‘줄악기’는 그 기능을 간명하게 살리면서도 과도하게 해석을 덧붙이지 않습니다.
- source_word: מִזְמ֥וֹר
  english_pob_choice: A psalm
  chosen_korean: 시입니다
  alternatives_korean:
  - 시편입니다
  - 노래입니다
  - 찬가입니다
  lexicon: HALOT
  rationale: 이 단어는 장르 표지이므로 한국어 성경에서 익숙한 ‘시’로 옮기되, 표제의 간결한 형식을 살리기 위해 ‘입니다’를 붙였습니다.
- source_word: לְ/דָוִֽד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗을 위한
  - 다윗이 지은
  lexicon: HALOT
  rationale: 이 전치사는 저작, 소속, 헌정 모두를 열어 두므로, ‘다윗의’로 옮겨 영어 POB의 ‘of David’와 같이 의미의 폭을 유지했습니다.
theological_decisions:
- issue: 시편 표제의 לְדָוִד가 요구하는 저작/소속/헌정의 모호성
  chosen_reading: ‘다윗의’로 두어 전통적 귀속 가능성을 열어 두되, 저작 확정으로 좁히지 않았습니다.
  alternative_readings:
  - 다윗이 지은
  - 다윗을 위한
  rationale: 본문 자체가 관계를 특정하지 않으므로, 번역도 그 긴장을 보존해야 합니다. 이는 역사적·신학적 단정을 피하면서 원문의 유연성을 살리는 처리입니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
