  to: 그러면 내가 그들의 반역을 막대기로 벌하고, 그들의 죄악을 매질로 벌하겠습니다.[a]
  rationale: 제시된 히브리어 본문에 맞추어 절 전체를 새로 번역했습니다. 접속사 ו의 앞선 조건절에 따른 결과를 ‘그러면’으로 드러냈고, פקד의 징벌 의미를 ‘벌하다’로 분명히 했습니다. ‘막대기/매질’과 ‘반역/죄악’의 두 병행을 유지했으며, פקד의 다른 가능한 의미는 각주에서만 제시하여 본문의 문맥상 의미를 흐리지 않았습니다.
