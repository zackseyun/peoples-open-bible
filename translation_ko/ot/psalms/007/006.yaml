  source_fidelity: 현 초안은 시편 7:6이 아니라 원문상 시편 7:5에 해당하는 내용(원수가 생명을 추격하고 영광이 티끌에 거하는 장면)을 번역하므로, 본문과 주석 모두 전면 교정이 필요합니다. 히브리어 시편 7:6은 야훼께 일어나시고, 원수들의 격분에 맞서 자신을 높이시며, 시인을 위하여 깨어 심판을 행하시기를 청하는 기도입니다.
  naturalness: 교정문은 현대 표준 한국어의 격식 있는 합쇼체 기도 문체를 사용합니다. ‘격분에 맞서’는 בְּעַבְרוֹת의 적대적 문맥을 자연스럽게 드러내며, ‘깨어나소서’는 시적 의인화 표현을 보존합니다.
