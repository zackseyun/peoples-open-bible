  to: 이제 나는 압니다. 야훼께서 그의 기름부음 받은 이를 구원하셨습니다. 그분은 자신의 거룩한 하늘에서 그의 오른손으로 이루시는 능력 있는 구원으로 그에게 응답하십니다.
