  from: And I also saw under the sun that in the place of justice[a], there was wickedness, and in the place of righteousness, there was wickedness.
  to: And I also saw under the sun that in the place of justice, there was wickedness, and in the place of righteousness, there was the wicked one.[a]
  rationale: The Masoretic pointing distinguishes הָרֶשַׁע, "wickedness," from הָרָשָׁע, the substantival "wicked one." The current rendering loses that distinction. "The wicked one" is preferable to "the wicked man," since the Hebrew substantival adjective need not specify male sex.
