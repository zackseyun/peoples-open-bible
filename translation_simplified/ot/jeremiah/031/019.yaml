translation:
  language: en
  text: For I turned back[a], and then I felt regret. When I was made to understand, I struck my thigh. I was ashamed and humiliated because I carried the disgrace of my youth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Earlier reader wording used a form of "repent." Preserve the contextual sense of regret/contrition rather than make every historical use of repent mean Godward reorientation. The source term and/or local context supports regret here; alternatives remain available in the notes.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: after I was instructed
  simplified_phrase: When I was made to understand
  preserved_meaning: The speaker received corrective understanding rather than reaching it unaided.
  reasoning_layer_used: Lexical decision for הִוָּדְעִי
  rationale: This wording makes the passive sense clear in common English.
- pob_phrase: I bore the disgrace of my youth
  simplified_phrase: I carried the disgrace of my youth
  preserved_meaning: The speaker lived under the burden of disgrace associated with youth.
  reasoning_layer_used: Lexical decisions for נָשָׂאתִי and חֶרְפַּת נְעוּרָי
  rationale: “Carried” expresses the burden image more plainly while retaining its force.
translation_notes:
  risk_flags:
  - risk: “Made to understand” is broader than the more specifically instructional POB wording.
    mitigation: It retains the passive reception of corrective understanding supported by the lexical rationale.
  - risk: “Disgrace of my youth” may refer to youthful conduct or the reproach resulting from it.
    mitigation: The broad POB wording remains unchanged so the ambiguity is not resolved.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
