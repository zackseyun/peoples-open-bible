  text: Then I left off the words in which I had still been engaged, and I answered in anger and said,
translation:
  language: ko
  text: 그러자 저는 아직 하고 있던 말을 그만두고, 분노하여 대답해 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et dereliqui sermones
  english_pob_choice: Then I left off the words
  chosen_korean: 아직 하던 말을 그만두고
  alternatives_korean:
  - 그 말을 중단하고
  - 말을 멈추고
  lexicon: derelinquo / sermones
  rationale: sermones는 단순한 ‘말들’보다 진행 중인 발화를 가리키므로, ‘아직 하던 말을 그만두고’로 자연스럽고 원문에 가깝게 옮겼습니다.
- source_word: in quibus adhuc eram
  english_pob_choice: in which I had still been engaged
  chosen_korean: 아직 하던
  alternatives_korean:
  - 여전히 몰두하던
  - 아직 종사하던
  lexicon: sum / adhuc
  rationale: adhuc은 ‘아직’으로, eram은 진행 중 상태를 나타내어 ‘아직 하던’으로 압축해 현재의 발화 상황을 살렸습니다.
- source_word: respondi cum ... in anger
  english_pob_choice: I answered in anger
  chosen_korean: 분노한 채로 대답하여
  alternatives_korean:
  - 화가 난 채로 대답하여
  - 노한 마음으로 대답하여
  lexicon: cum + affectus
  rationale: cum은 동반 상황을 나타내므로 ‘-한 채로’로 옮겨, 감정 상태를 부연하는 구조를 한국어에서 자연스럽게 재현했습니다.
theological_decisions:
- issue: 화자의 격앙된 응답을 어떻게 표시할지
  chosen_reading: ‘분노한 채로’와 ‘말했습니다’로, 화자의 정서와 발화 행위를 분명히 드러냈습니다.
  alternative_readings:
  - ‘성내어’로 더 간략히 처리
  - 감정 묘사를 약화해 ‘답하여 말했습니다’만 사용
  rationale: 본문은 단순한 응답이 아니라 분노 상태에서의 응답을 말하므로, 정서 강도를 보존하는 편이 원문 의미를 더 잘 드러냅니다.
  doctrine_reference: 서사 문맥 보존 원칙
