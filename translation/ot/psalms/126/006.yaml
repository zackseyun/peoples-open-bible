id: PSA.126.6
reference: Psalms 126:6
source:
  edition: WLC
  text: הָ֘ל֤וֹךְ יֵלֵ֨ךְ וּ/בָכֹה֮ נֹשֵׂ֪א מֶֽשֶׁךְ הַ֫/זָּ֥רַע בֹּֽ֬א יָב֥וֹא בְ/רִנָּ֑ה נֹ֝שֵׂ֗א אֲלֻמֹּתָֽי/ו׀־־׃
translation:
  text: He goes on his way weeping, carrying seed for sowing[a]; he will surely return with shouts of joy, carrying his sheaves.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew expression is uncertain; it may refer to a supply, measure, or bag of seed.
    reason: alternative_reading
lexical_decisions:
- source_word: הָלוֹךְ יֵלֵךְ
  chosen: he surely goes
  alternatives:
  - he goes on his way
  - he continually goes
  - he surely goes
  lexicon: HALOT
  rationale: The infinitive absolute with imperfect intensifies the act of going but does not require “out.”
- source_word: וּבָכֹה
  chosen: weeping
  alternatives:
  - and weeping
  - while weeping
  lexicon: HALOT
  rationale: The conjunction plus infinitive absolute of בכה functions adverbially, describing the manner of his going. 'Weeping' is concise and natural in English.
- source_word: נֹשֵׂא
  chosen: carrying
  alternatives:
  - bearing
  lexicon: HALOT
  rationale: The participle denotes accompanying action. 'Carrying' is readable modern English; 'bearing' is possible but slightly more formal.
- source_word: מֶשֶׁךְ הַזָּרַע
  chosen: seed for sowing
  alternatives:
  - the bag of seed
  - the measure of seed
  - the drawn-out trail of seed
  lexicon: HALOT
  rationale: This broad contextual rendering avoids falsely deciding the uncertain sense of מֶשֶׁךְ.
- source_word: בֹּא יָבֹא
  chosen: he will surely come
  alternatives:
  - he will surely come
  - he will indeed return
  lexicon: HALOT
  rationale: The construction emphatically affirms coming, without specifying either “in” or “back.”
- source_word: בְרִנָּה
  chosen: with joyful shouting
  alternatives:
  - with singing
  - with rejoicing
  lexicon: HALOT
  rationale: רִנָּה often denotes a ringing cry of joy rather than quiet inward gladness. 'Joyful shouting' preserves the audible celebratory sense.
- source_word: אֲלֻמֹּתָיו
  chosen: his sheaves
  alternatives:
  - bundles of grain
  lexicon: HALOT
  rationale: The noun refers specifically to harvested sheaves. 'His sheaves' is the standard and precise agricultural term.
