translation:
  text: For before him we did not believe, and we did not praise the name of the Lord of Spirits, [and we did not
    praise our Lord,][a] and our hope was in the scepter[b] of our kingdom and in our glory.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Charles identifies this bracketed clause as dittography in printed p.116 note 5. It is retained in brackets
      here rather than presented as an uncontested part of the text.
    reason: textual_variant
  - marker: b
    text: Scepter can also be rendered staff or rod; the royal image is retained.
    reason: lexical_alternative
