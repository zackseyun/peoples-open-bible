translation:
  text: May my soul rejoice in my old age[a], and may you not be put to shame by my song[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The collated working source restores Kahana's additional yod while retaining the editorial sin/tsere reading. His printed footnote explicitly interprets rejoicing in old age; the spelling alone does not compel a teaching-session interpretation. Unpointed B remains distinct evidence.
    reason: lexical_alternative
  - marker: b
    text: '''By my song'' interprets Hebrew ב instrumentally; ''in my song'' is also possible. Greek instead has your soul, his mercy and his praise. Its optatives support a wish, while Hebrew can also express assurance. Kahana''s printed note identifies the song with this book.'
    reason: textual_variant
lexical_decisions:
- source_word: תִּשְׂמַח נַפְשִׁי בְּישֵׂיבָתִי, וְלֹא תֵבוֹשוּ בְּשִׁירָתִי.
  chosen: May my soul rejoice in my old age, and may you not be put to shame by my song.
  rationale: תִּשְׂמַח is a feminine singular imperfect agreeing with 'my soul'; תֵבוֹשוּ addresses plural you and is Qal, not a Hebrew passive stem. The unusual printed spelling בְּישֵׂיבָתִי is restored. 'Old age' follows Kahana's explicit explanation and the retained editorial reading, not a conclusive analysis of unpointed B. A wish is contextually defensible; Greek does not compel it. 'By my song' matches the active English, with the preposition's alternatives disclosed. No ancient pointing is established.
