  from: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
  to: Whenever you enter a city or village, find out who there is a worthy host, and stay with that person until you move on.
  rationale: The lexical and theological record already understands “worthy” in relation to hosting the messengers and “there” as the chosen host’s home. I make those referents explicit and drop notes whose points the text now carries.
