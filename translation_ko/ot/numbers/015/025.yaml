revisions:
- from: 제사장은 이스라엘 자손의 온 회중을 위해 속죄를 해야 하며, 그들은 용서받을 것입니다. 그것은 부지중에 저지른 일이기 때문이며, 그들이 자기의 예물, 곧 야훼께 드리는 불로 드리는 제물과 야훼 앞에 드리는 자기의 속죄제물을 가져왔기 때문입니다. 그들의 부지중의 잘못을 위해서입니다.[a][b]
  to: 제사장은 이스라엘 자손의 온 회중을 위하여 속죄할 것이며, 그들은 용서받을 것입니다. 이는 부지중에 저지른 잘못이었고, 그들이 자기들의 예물, 곧 야훼께 드리는 화제[a]와 야훼 앞에 드리는 자기들의 속죄제물[b]을 그들의 부지중의 잘못을 위하여 가져왔기 때문입니다.
  rationale: 문장 끝에 분리되어 있던 ‘그들의 부지중의 잘못을 위해서입니다’를 속죄제물의 수식어로 복원하여 히브리어 구문과 의미 관계를 반영했습니다. 원문의 두 이유(잘못이 부지중의 일이었음, 필요한 제물을 가져왔음)는 ‘~이었고, ~가져왔기 때문입니다’로 보존했습니다. 화제와 속죄제물의 각주 표지도 해당 낱말 뒤로 옮기고, 화제 주석이 본문을 단순 반복하던 문제를 해결했습니다.
  reviewer_model: gpt-5.6-terra
