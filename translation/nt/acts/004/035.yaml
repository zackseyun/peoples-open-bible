id: ACT.4.35
reference: Acts 4:35
source:
  edition: SBLGNT
  text: καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων· διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν.
translation:
  text: and laying the money at the apostles’ feet[a]. It was being distributed to each person according to their need.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The gesture entrusted the money to the apostles for distribution.
    reason: cultural_note
lexical_decisions:
- source_word: ἐτίθουν
  chosen: they were laying
  alternatives:
  - they laid
  - they would place
  lexicon: BDAG
  rationale: Imperfect active indicates ongoing/repeated action in the narrative, so an English progressive best reflects the aspect. 'Laying' fits the concrete act of placing proceeds before the apostles.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  chosen: at the apostles’ feet
  alternatives:
  - before the apostles
  - beside the apostles’ feet
  lexicon: BDAG
  rationale: This is a conventional idiom for placing something before someone's authority or care, but the physical image should be preserved. 'At the apostles’ feet' is natural English and keeps the concrete wording.
- source_word: διεδίδετο
  chosen: it was being distributed
  alternatives:
  - it was distributed
  - distribution was made
  lexicon: BDAG
  rationale: The imperfect passive again suggests ongoing customary action. The singular passive verb naturally refers to the proceeds/money implied from the previous verse, so 'it was being distributed' preserves the impersonal/passive sense without over-specifying the subject.
- source_word: ἑκάστῳ
  chosen: to each one
  alternatives:
  - to each
  - to every person
  lexicon: BDAG
  rationale: Dative singular indicates individual distribution. 'Each one' is slightly more explicit and natural in English while preserving the distributive force.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  chosen: as anyone had need
  alternatives:
  - according as anyone had need
  - to the extent that anyone had need
  lexicon: BDAG
  rationale: The clause expresses proportion or correspondence to need. 'As anyone had need' is idiomatic modern English and closely matches the Greek sense without paraphrase.
- source_word: τις
  chosen: anyone
  alternatives:
  - someone
  - any person
  lexicon: BDAG
  rationale: Indefinite τις in this context is generic rather than specifically masculine. 'Anyone' conveys the generic force naturally in English.
- source_word: χρείαν
  chosen: need
  alternatives:
  - necessity
  lexicon: BDAG
  rationale: χρεία commonly denotes need or necessity. 'Need' is the clearest and most natural modern rendering.
