base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/008.yaml
  text: When the sun rose[a], God appointed a scorching east wind, and the sun beat down on Jonah’s head so that he grew faint. And he asked that he might die, and said[b], “My death is better than my life.”
  footnotes:
  - marker: a
    text: Or 'a sultry east wind' or 'a vehement east wind.' The Hebrew adjective is rare and difficult; 'scorching' is chosen because the context emphasizes oppressive heat.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'My death is better than my life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 해가 떠오를 때, 하나님께서 뜨거운 동풍을 예비하셨습니다[a]. 해가 요나의 머리 위로 내리쬐어 그가 기진하였습니다. 그는 죽기를 구하며 말했습니다. “내 죽음이 내 삶보다 낫습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뜨거운’으로 번역한 히브리어 형용사는 드물고 의미가 확실하지 않습니다. ‘무더운 동풍’ 또는 ‘사나운 동풍’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֤וּחַ קָדִים֙ חֲרִישִׁ֔ית
  english_pob_choice: a scorching east wind
  chosen_korean: 뜨거운 동풍
  alternatives_korean:
  - 동쪽 바람
  - 동풍
  - 사나운 동풍
  lexicon: רוּחַ, קָדִים, חֲרִישִׁית
  rationale: 본문은 하나님이 예비하신 동풍을 가리키며, חֲרִישִׁית는 맥락상 강하고 숨막히는 성격을 보이므로 ‘뜨거운’으로 자연스럽게 풀어 압박감을 살렸습니다.
- source_word: וַתַּךְ הַשֶּׁמֶשׁ
  english_pob_choice: the sun beat down
  chosen_korean: 태양이 …를 내리쳐
  alternatives_korean:
  - 해가 내리쬐어
  - 태양이 내리쳤습니다
  - 해가 머리를 쳤습니다
  lexicon: הַשֶּׁמֶשׁ
  rationale: 동사의 주어가 바람이 아니라 해/태양이라는 점을 분명히 하기 위해, 해가 요나의 머리를 강하게 ‘내리친다’는 역동적 표현을 사용했습니다.
- source_word: וַיִּתְעַלָּף
  english_pob_choice: he fainted
  chosen_korean: 기절하였습니다
  alternatives_korean:
  - 기운이 다해
  - 쓰러졌습니다
  - 혼절하였습니다
  lexicon: וַיִּתְעַלָּף
  rationale: 동사가 요나의 쇠약함과 실신 상태를 나타내므로, 너무 약한 표현보다 ‘기절하다’가 본문의 긴박성을 잘 드러냅니다.
- source_word: וַיִּשְׁאַל אֶת נַפְשׁוֹ לָמוּת
  english_pob_choice: he asked for his life to die
  chosen_korean: 자기 생명을 버리고 죽기를 구하며
  alternatives_korean:
  - 죽기를 간구하며
  - 자기 목숨을 잃기를 바라며
  - 죽음을 구하며
  lexicon: נַפְשׁוֹ, לָמוּת
  rationale: 직역은 어색하지만, “자기 생명을… 죽기를 구하다”라는 이중 구조를 살려 요나가 자신의 생명 유지보다 죽음을 원한다는 뜻을 드러냈습니다.
- source_word: טוֹב מוֹתִי מֵחַיָּי
  english_pob_choice: it is better for me to die than to live
  chosen_korean: 내가 사는 것보다 죽는 것이 더 좋습니다
  alternatives_korean:
  - 죽는 것이 사는 것보다 낫습니다
  - 차라리 죽는 편이 낫습니다
  - 내 죽음이 내 삶보다 좋습니다
  lexicon: טוֹב ... מֵ...
  rationale: 히브리어의 비교 구조를 한국어의 자연스러운 비교문으로 옮기되, 자기 삶보다 죽음을 더 낫게 여기는 고백을 분명히 했습니다.
theological_decisions:
- issue: 하나님의 주권적 ‘예비/지정’ 동사
  chosen_reading: 하나님이 뜨거운 동풍을 예비하셨고
  alternative_readings:
  - 하나님이 뜨거운 동풍을 보내셨고
  - 하나님이 뜨거운 동풍을 마련하셨고
  rationale: וַיְמַן의 주권적 배치를 살리기 위해 단순한 자연 현상보다 하나님이 상황을 주도적으로 ‘예비’하신 것으로 옮겼습니다.
  doctrine_reference: 하나님의 주권과 섭리
- issue: 요나의 죽음 요구를 완곡하게 누그러뜨리지 않음
  chosen_reading: 자기 생명을 버리고 죽기를 구하며 말하되
  alternative_readings:
  - 죽고 싶어 하며 말하되
  - 죽기를 바랐습니다
  rationale: 본문은 단순한 낙담이 아니라 실제로 죽음을 요청하는 표현이므로, 그 긴장과 무게를 유지했습니다.
  doctrine_reference: 인간의 절망과 본문의 수사적 강도
