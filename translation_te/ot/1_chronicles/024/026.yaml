  yaml_path: translation/ot/1_chronicles/024/026.yaml
  text: 'The sons of Merari: Mahli and Mushi. The sons of Jaaziah: his son.'
translation:
  language: te
  text: 'మెరారీ కుమారులు: మహ్లీ, మూషీ. యాజీయాహు కుమారులు: అతని కుమారుడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో సాధారణంగా ‘కుమారులు’ అని అర్థం; మూలంలోని పునరుక్తిని అలాగే ఉంచుతుంది.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: మసొరెటిక్ పాఠంలోని రెండు పదాల రూపాన్ని వ్యక్తిపేరు ‘బెనో’గా కాకుండా సహజ అర్థంలో అనువదించి, మూలపాఠపు అసంపూర్ణంగా అనిపించే నిర్మాణాన్ని పరిష్కరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: בְנוֹను వ్యక్తిపేరుగా పరిగణించాలా, సాధారణ నామవాచక పదబంధంగా పరిగణించాలా
  choice: అతని కుమారుడు
  alternative: బెనో
  rationale: WLCలోని విభజన మరియు స్వరచిహ్నాలు בְּנוֹ (‘అతని కుమారుడు’) అనే పఠనానికి మద్దతిస్తాయి; సందర్భం అస్పష్టంగా ఉన్నప్పటికీ దాన్ని ఊహాపూర్వకంగా వ్యక్తిపేరుగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి శైలి; వ్యక్తిపేర్లను తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించాం. మూలంలోని అకస్మాత్తుగా ముగిసే, అస్పష్టమైన వాక్య నిర్మాణాన్ని వివరణ జోడించకుండా కాపాడాం.
