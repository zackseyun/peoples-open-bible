id: PSA.77.3
reference: Psalms 77:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶזְכְּרָ֣ה אֱלֹהִ֣ים וְ/אֶֽהֱמָיָ֑ה אָשִׂ֓יחָה וְ/תִתְעַטֵּ֖ף רוּחִ֣/י סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/003.yaml
  text: I remember God[a], and I groan; I meditate, and my spirit grows faint[b]. Selah
  footnotes:
  - marker: a
    text: Or 'I muse' / 'I complain' for 'I meditate'; the Hebrew verb can denote reflective musing or lamenting speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'my spirit is overwhelmed' for 'my spirit grows faint.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님을 기억하고 신음합니다. 묵상하고,[a] 내 영은 쇠약해집니다.[b] 셀라
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘되뇌며 탄식하고’. 히브리어 동사는 묵상하거나 생각을 되뇌는 것, 또는 탄식하는 말을 하는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 영이 압도됩니다’. 히브리어 동사는 쇠약해지다 또는 압도되다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  english_pob_choice: In the day of my distress
  chosen_korean: 내가 환난 당하던 날에
  alternatives_korean:
  - 내 고통의 날에
  - 내 곤경의 날에
  - 내가 고난을 겪던 때에
  lexicon: HALOT
  rationale: בְּיוֹם은 단순한 날짜보다 ‘~하던 날/때’의 상황표현으로 옮기는 것이 자연스럽고, צָרָה는 문맥상 ‘환난’이 시편 탄식의 정서를 가장 잘 드러냅니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이신 분
  lexicon: HALOT
  rationale: 이 형태는 여호와 표기가 아니라 호칭 אֲדֹנָי이므로, 한국어에서는 예배적이지만 자연스러운 호칭인 ‘주님’으로 옮겼습니다.
- source_word: נִגְּרָה
  english_pob_choice: was stretched out
  chosen_korean: 뻗어 나가고
  alternatives_korean:
  - 퍼져 흘러가고
  - 펼쳐져 있고
  - 뻗어 있었고
  lexicon: HALOT
  rationale: 동사의 기본 이미지는 ‘흐르다/쏟아지다’이지만, 여기서는 ‘내 손’과 함께 지속적 기도 자세를 나타내므로 ‘뻗어 나가고’로 살려야 본문 의도에 가깝습니다.
- source_word: וְלֹא תָפוּג
  english_pob_choice: and did not grow numb
  chosen_korean: 굳어지지 않았으며
  alternatives_korean:
  - 시들지 않았으며
  - 느슨해지지 않았으며
  - 힘이 빠지지 않았으며
  lexicon: HALOT
  rationale: פוג는 맥락에 따라 풀리다, 약해지다, 무디어지다를 뜻할 수 있는데, 손의 지속된 자세라는 이미지에서는 ‘굳어지지 않았다’가 가장 직접적입니다.
- source_word: מֵאֲנָה הִנָּחֵם נַפְשִׁי
  english_pob_choice: my soul refused to be comforted
  chosen_korean: 내 영혼은 위로받기를 거부했습니다.
  alternatives_korean:
  - 내 영혼은 위로받으려 하지 않았습니다.
  - 내 영혼은 위로받는 것을 마다했습니다.
  lexicon: HALOT
  rationale: מֵאֲנָה는 강한 거부를 나타내며, נַפְשִׁי는 시적 문맥에서 ‘내 영혼’이 자연스럽고, הִנָּחֵם은 수동적 ‘위로받다’로 옮기는 것이 적절합니다.
theological_decisions:
- issue: אֲדֹנָי의 한국어 호칭 처리
  chosen_reading: ‘주님’으로 번역해 경외적 호칭을 살리되, 여호와 표기와 구분했습니다.
  alternative_readings:
  - 주
  - 주인이신 분
  rationale: 본문은 신적 고유명 YHWH가 아니라 호칭을 사용하므로, 전통적이면서도 현대 한국어에서 자연스러운 ‘주님’이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md: titles vs. divine name; POB glossary for אֲדֹנָי and YHWH'
