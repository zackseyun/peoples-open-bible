    14. 그는 그에게서 떠나 세일 땅으로 갔습니다. 그러나 야곱은 천막에서 살았습니다. 이 희년의 다섯째 주의 첫째 해에 그는 요르단을 건너 요르단 건너편에 머물렀고, 무더기의 바다에서 벧산까지, 또 도단까지, 또…에 이르는 곳에서 양 떼를 먹였습니다.

    15. 가을철에. 그는 자기의 모든 소유 가운데서 옷과 음식, 곧 고기를 아버지 이삭에게 보냈습니다.

    16. 그리고 마시고, 우유와 버터와 우유로 만든 빵과 모든 이의 가르침에서 비롯된 것을 주었습니다. 또한 그의 어머니 리브가를 위해서는 해의 사분의 일 동안, 달의 기간들 가운데 한가운데에서, 밭갈이와 거두기 사이의 때에, 곧 한가운데에 있었습니다.

    17. 봄과 비와 한겨울과 여름이 아브라함의 탑에 있었습니다. 이삭은 맹세의 우물에서 돌아와 자기 아버지 아브라함의 탑으로 올라갔습니다.

    18. 그리하여 그는 아들 에서와 떨어져 그곳에 거주하였습니다. 야곱이 메소포타미아로 갔을 때, 에서는 이스마엘의 딸 마할랏을 아내로 맞이하고, 아버지의 모든 가축과 자기 아내들을 모아 가지고 올라가 세일 산에 거주하였으며, 아버지 이삭을 맹세의 우물에 남겨 두었습니다.

    19. 맹세의 우물에서만. 이삭은 맹세의 우물에서 올라가, …의 탑에 거주했습니다.

    20. 그의 아버지 아브라함은 헤브론 산에 있었습니다. 그곳에서 야곱은 때때로 그의 아버지와 어머니에게 그들이 필요로 하는 모든 것을 계속 보냈습니다. 그들은 온 마음과 온 영혼을 다해 야곱을 축복했습니다.'
