    19. 그리고 욥압이 죽고, 데만 산지의 아삼이 그를 대신하여 다스렸습니다.

    20. 그리고 아삼이 죽고, 바랏의 아들 아닷이 그를 대신하여 다스렸습니다. 그는 모압 들판에서 미디안을 친 사람이었고, 그의 도시 이름은 아빗이었습니다.

