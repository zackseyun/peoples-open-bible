    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ / אָרֶץ
  english_pob_choice: possess the land
  chosen_korean: 그 땅을 차지하다
  alternatives_korean:
  - 그 땅을 소유하다
  - 그 땅을 차지하여 얻다
  lexicon: HALOT
  rationale: 정복 문맥의 ירשׁ는 단순한 상속보다 실제로 땅을 점유·획득하는 뜻이 강하므로, 한국어에서는 '차지하다'가 가장 자연스럽고 원문 이미지도 살립니다.
- source_word: זְרוֹעָם
  english_pob_choice: their arm
  chosen_korean: 자기들의 팔
  alternatives_korean:
  - 자기들의 힘
  - 자기들의 능력
  lexicon: HALOT
  rationale: 시적 병행을 위해 신체 은유를 그대로 유지했습니다. '힘'으로 풀면 대조 구조가 약해집니다.
- source_word: הוֹשִׁיעָה
  english_pob_choice: did not save them
  chosen_korean: 그들을 구원하지도 못했습니다
  alternatives_korean:
  - 그들을 구하지도 못했습니다
  - 그들을 건지지도 못했습니다
  lexicon: HALOT
  rationale: ישׁע의 기본 의미를 살리면서 군사적 문맥에서도 자연스러운 한국어로 옮겼습니다. '구원하다'가 본문의 동사적 힘을 가장 잘 보존합니다.
- source_word: יְמִינְךָ / זְרוֹעֲךָ / אוֹר פָּנֶיךָ
  english_pob_choice: your right hand, your arm, and the light of your face
  chosen_korean: 당신의 오른손과 당신의 팔, 그리고 당신의 얼굴의 빛
  alternatives_korean:
  - 당신의 오른손과 당신의 팔, 그리고 당신 얼굴의 빛
  - 당신의 오른손과 당신의 팔, 그리고 당신의 임재의 빛
  lexicon: HALOT
  rationale: 손·팔·얼굴의 빛이라는 병렬 이미지를 보존했습니다. '임재'로 바꾸면 해석이 앞서므로 본문 이미지를 우선했습니다.
- source_word: רְצִיתָם
  english_pob_choice: because you delighted in them
  chosen_korean: 당신께서 그들을 기뻐하셨기 때문입니다
  alternatives_korean:
  - 당신께서 그들을 좋게 여기셨기 때문입니다
  - 당신께서 그들을 기뻐하셨으므로
  lexicon: HALOT
  rationale: רצה는 여기서 하나님의 호의와 기쁨을 뜻하므로, '기뻐하셨다'가 관계적·감정적 뉘앙스를 살립니다.
theological_decisions:
- issue: 하나님의 행위와 인간 무력의 대조
  chosen_reading: 땅의 차지와 구원은 그들의 칼과 팔이 아니라 하나님의 오른손, 팔, 얼굴의 빛에서 비롯됩니다.
  alternative_readings:
  - 일반적인 신뢰 교훈으로 완화하는 읽기
  rationale: 히브리어는 인간 무기와 힘을 하나님의 주도적 행위와 직접 대조합니다. 번역에서도 이 대조를 약화시키지 않도록 유지했습니다.
  doctrine_reference: 'Translation philosophy #3'
- issue: אוֹר פָּנֶיךָ의 이미지 보존
  chosen_reading: '''당신의 얼굴의 빛''을 본문에 그대로 두었습니다.'
  alternative_readings:
  - '''당신의 임재의 빛'''
  - '''당신의 호의'''
  rationale: 이 표현은 하나님의 호의를 가리키지만, 시적 이미지는 신학적으로 풍부하므로 본문에서 풀지 않고 그대로 보존했습니다.
  doctrine_reference: 'Translation philosophy #3'
