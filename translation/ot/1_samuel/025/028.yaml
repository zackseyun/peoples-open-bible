id: 1SA.25.28
reference: 1 Samuel 25:28
source:
  edition: WLC
  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
translation:
  text: Please forgive your servant’s transgression, for Yahweh will surely establish a lasting royal house for my lord, because my lord fights Yahweh’s battles, and evil will not be found in you all your days[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “and no evil has been found in you throughout your life.”
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂא נָא
  chosen: Please forgive
  alternatives:
  - Please pardon
  - Bear, please
  lexicon: HALOT
  rationale: The idiom 'lift/bear, please' with לְפֶשַׁע means to forgive or pardon an offense. 'Please forgive' gives the idiomatic sense in natural English while preserving the plea force of נָא.
- source_word: לְפֶשַׁע
  chosen: the transgression of
  alternatives:
  - the offense of
  - the rebellion of
  lexicon: HALOT
  rationale: פשע denotes transgression/rebellion. In this interpersonal appeal, 'transgression' preserves the moral seriousness without overstating political rebellion.
- source_word: אֲמָתֶךָ
  chosen: your female servant
  alternatives:
  - your maidservant
  - your servant
  lexicon: HALOT
  rationale: אמה specifically refers to a female servant. 'Female servant' is clear modern English and preserves the gendered self-humbling form of Abigail's speech better than the archaic 'maidservant' or the flattened 'servant'.
- source_word: עָשֹׂה יַעֲשֶׂה
  chosen: will surely make
  alternatives:
  - will indeed make
  - will certainly make
  lexicon: HALOT
  rationale: The infinitive absolute with finite verb intensifies the action. 'Will surely make' is a standard English way to reflect that emphasis.
- source_word: לַאדֹנִי
  chosen: my lord
  alternatives:
  - my master
  lexicon: HALOT
  rationale: In context Abigail addresses David respectfully. 'My lord' fits the courtly address and avoids the harsher social connotations of 'master' here.
- source_word: בַּיִת נֶאֱמָן
  chosen: a lasting house
  alternatives:
  - a sure house
  - a faithful house
  - an enduring dynasty
  lexicon: HALOT
  rationale: '''House'' here is dynastic, not architectural. ''Lasting house'' preserves the metaphor while communicating durability and covenantal stability in accessible English. ''Dynasty'' is interpretive; ''sure house'' is more literal but less natural.'
- source_word: מִלְחֲמוֹת יְהוָה
  chosen: the LORD’s battles
  alternatives:
  - the battles of the LORD
  - the LORD's wars
  lexicon: HALOT
  rationale: This construct phrase refers to battles fought on the LORD's behalf or under his cause. 'The LORD's battles' is natural and sufficiently formal; 'wars' sounds broader and harsher than the immediate context requires.
- source_word: נִלְחָם
  chosen: fights
  alternatives:
  - is fighting
  - wages war
  lexicon: HALOT
  rationale: The participial form expresses characteristic or ongoing action. English simple present 'fights' captures this well in a gnomic statement.
- source_word: וְרָעָה
  chosen: evil
  alternatives:
  - wrongdoing
  - harm
  lexicon: HALOT
  rationale: רעה can denote evil, trouble, or harm. Here Abigail speaks of moral fault in David's life and conduct, so 'evil' best preserves the ethical dimension.
- source_word: לֹא תִמָּצֵא בְךָ
  chosen: will not be found in you
  alternatives:
  - will not be found with you
  - will not be found against you
  lexicon: HALOT
  rationale: The Niphal of מצא with ב indicates something being found in or attached to a person. 'In you' is the most direct rendering and suits the moral sense of evil not being present in David.
- source_word: מִיָּמֶיךָ
  chosen: all your days
  alternatives:
  - throughout your days
  - from your days
  lexicon: HALOT
  rationale: The phrase idiomatically means throughout one's lifetime. 'All your days' is concise and idiomatic in English.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives: []
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
