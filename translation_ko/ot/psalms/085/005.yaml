source:
  edition: WLC
  text: הַ/לְ/עוֹלָ֥ם תֶּֽאֱנַף בָּ֑/נוּ תִּמְשֹׁ֥ךְ אַ֝פְּ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/005.yaml
  text: Will you be angry with us forever?[a] Will you prolong your anger from generation to generation?[b]
  footnotes:
  - marker: a
    text: Or 'against us' for 'with us.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'draw out your anger.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 영원히 우리에게 노하시겠습니까?[a] 주의 진노를 대대로 계속하시겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 향하여’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘주의 진노를 끌어 늘이시겠습니까?’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבֵנוּ
  english_pob_choice: Restore us
  chosen_korean: 우리를 회복시키시고
  alternatives_korean:
  - 우리를 돌이키시고
  - 우리를 다시 돌아오게 하시고
  lexicon: HALOT
  rationale: 히필 명령형의 ‘돌아오게 하다’는 뜻을 합쇼체로 자연스럽게 옮기되, 시편의 간구 맥락에 맞는 언약적 회복의 의미를 살려 ‘회복시키시고’로 렌더링했습니다.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  english_pob_choice: God of our salvation
  chosen_korean: 우리의 구원의 하나님이시여
  alternatives_korean:
  - 우리의 구원하시는 하나님이시여
  - 우리의 구원의 하나님이십니다
  lexicon: HALOT
  rationale: אָסו절의 소유격 구조를 살려 ‘우리의 구원의 하나님’으로 옮겼고, 하나님께 드리는 직접 호소이므로 호격의 ‘-이시여’를 더했습니다.
- source_word: וְהָפֵר
  english_pob_choice: put away
  chosen_korean: 거두어 주십시오
  alternatives_korean:
  - 없애 주십시오
  - 폐하시고
  lexicon: HALOT
  rationale: פרר의 ‘깨뜨리다/무효화하다’ 의미를 현대 한국어에서 자연스럽고 기도문답게 표현하기 위해 ‘거두어 주십시오’로 옮겼습니다. 단순한 제거보다 진노를 멈추게 해 달라는 뉘앙스를 살립니다.
- source_word: כַּעַסְךָ
  english_pob_choice: your anger
  chosen_korean: 주의 진노
  alternatives_korean:
  - 주의 분노
  - 주의 노여움
  lexicon: HALOT
  rationale: 하나님께 대한 엄중한 심판적 정서를 반영해 ‘진노’를 택했습니다. 시적·예배적 문맥에서 전통적으로도 널리 쓰이지만, 여기서는 원문의 감정 강도를 분명히 하는 데 적합합니다.
theological_decisions:
- issue: שׁוּבֵנוּ를 도덕적 회개 촉구로 좁힐지, 하나님의 언약적 회복 간구로 볼지
  chosen_reading: ‘회복시키시고’로 번역해 하나님의 주도적 회복을 강조합니다.
  alternative_readings:
  - 우리를 돌이키시고
  - 우리를 다시 돌아오게 하시고
  rationale: 시편 문맥은 단순한 내면적 회개 촉구보다, 진노가 거두어진 상태로의 관계 회복을 구하는 기도입니다. 그래서 인간의 응답만이 아니라 하나님의 주권적 회복 행위를 드러냈습니다.
  doctrine_reference: Translation philosophy §3, §6
