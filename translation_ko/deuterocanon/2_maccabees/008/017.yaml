translation:
  language: ko
  text: 그들은 거룩한 곳에 그들이 불법하게 저지른 만행과 조롱당한 도시가 받은 학대와 조상들에게서 물려받은 삶의 질서가 무너진 일을 눈앞에 떠올렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸ ὀφθαλμῶν λαβόντας
  english_pob_choice: having set before their eyes
  chosen_korean: 자기들의 눈앞에 … 떠올렸습니다
  alternatives_korean:
  - 눈앞에 두었습니다
  - 마음에 새겼습니다
  lexicon: πρὸ ὀφθαλμῶν
  rationale: 직역보다 자연스러운 현대 한국어로, 전투 동기화 문맥에서 ‘눈앞에 두다/떠올리다’의 의미를 살렸습니다.
- source_word: τὴν ἀνόμως … συντελεσμένην ὑπʼ αὐτῶν ὕβριν
  english_pob_choice: the lawless outrage committed by them against the holy place
  chosen_korean: 거룩한 곳에 대해 불법적으로 저지른 만행
  alternatives_korean:
  - 거룩한 곳에 대한 법 없는 폭거
  - 거룩한 곳에 저지른 불법한 모욕
  lexicon: ὕβρις / ἀνόμως / συντελεσμένην
  rationale: ὕβρις는 단순 ‘모욕’보다 더 강한 폭력적·오만한 ‘만행’이어서, 앞의 ἀνόμως와 결합된 법질서 파괴를 함께 드러냈습니다.
- source_word: τὴν τῆς ἐμπεπαιγμένης πόλεως αἰκισμόν
  english_pob_choice: the abuse of the city that had been mocked
  chosen_korean: 조롱당한 도시의 학대
  alternatives_korean:
  - 조롱받은 도시의 학대
  - 희롱당한 도시의 수모
  lexicon: αἰκισμός / ἐμπεπαιγμένης
  rationale: ἐμπεπαιγμένης는 ‘조롱당한’의 상태를, αἰκισμόν은 단순 수치가 아니라 가혹한 학대·유린을 가리키므로 이를 구분해 옮겼습니다.
- source_word: τὴν προγονικῆς πολιτείας κατάλυσιν
  english_pob_choice: the overthrow of the ancestral way of life
  chosen_korean: 조상 대대로 이어온 삶의 방식의 파괴
  alternatives_korean:
  - 조상들의 삶의 질서의 전복
  - 조상 전통의 붕괴
  lexicon: προγονικῆς πολιτείας / κατάλυσις
  rationale: πολιτεία는 단순 관습보다 공동체의 삶의 방식·체제를 가리킬 수 있어, ‘조상 대대로 이어온 삶의 방식’으로 풀어 의미 범위를 보존했습니다.
theological_decisions:
- issue: 거룩한 곳(τὸν ἅγιον τόπον)의 범위
  chosen_reading: 성전 내부의 특정 성소보다, 침탈된 거룩한 장소 전체를 가리키는 표현으로 옮겼습니다.
  alternative_readings:
  - 성소
  - 성전
  rationale: 본문은 장소의 성별됨을 강조하면서도 구체적 성전 용어로 한정하지 않으므로, 더 넓은 범주의 ‘거룩한 곳’이 원문 긴장을 가장 잘 보존합니다.
  doctrine_reference: 성전/성소 표지의 문맥적 범위
