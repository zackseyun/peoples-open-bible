  text: 5. Then those who had the dry but not cut [rods] handed them in. And some of them handed in their rods green, but others dry and cut, as if worm-eaten. So those who had handed in green [rods] he ordered to stand apart, but those who had handed in dry and cut [rods] he ordered to stand with the first group.
translation:
  language: en
  text: 5. Then those whose rods were dry but uncut brought them forward. Some handed in green rods, but others handed in rods that were dry and cut, looking as though worms had eaten them. He ordered those who handed in green rods to stand apart. He told those who handed in dry and cut rods to stand with the first group.
