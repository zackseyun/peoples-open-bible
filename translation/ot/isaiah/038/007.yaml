id: ISA.38.7
reference: Isaiah 38:7
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֥ הָ/א֖וֹת מֵ/אֵ֣ת יְהוָ֑ה אֲשֶׁר֙ יַעֲשֶׂ֣ה יְהוָ֔ה אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה אֲשֶׁ֥ר דִּבֵּֽר־־׃
translation:
  text: 'And this will be your sign from Yahweh that Yahweh will fulfill what he has promised:'
  philosophy: dynamic
lexical_decisions:
- source_word: וְ/זֶה
  chosen: And this
  alternatives:
  - Now this
  - And this is
  lexicon: HALOT
  rationale: The conjunction plus demonstrative introduces the sign statement and naturally continues the discourse. 'And this' preserves the Hebrew linkage without over-paraphrasing.
- source_word: לְּ/ךָ
  chosen: to you
  alternatives:
  - for you
  lexicon: HALOT
  rationale: The preposition ל with second masculine singular suffix marks the recipient of the sign. 'To you' is idiomatic and fits the direct address to Hezekiah.
- source_word: הָ/אוֹת
  chosen: the sign
  alternatives:
  - a sign
  - the token
  lexicon: HALOT
  rationale: 'With the article, the noun is definite: a specific confirming sign from God. ''Sign'' is the standard rendering and best fits prophetic confirmation language.'
- source_word: מֵ/אֵת יְהוָה
  chosen: from the LORD
  alternatives:
  - from Yahweh
  - from the LORD himself
  lexicon: HALOT
  rationale: מֵאֵת indicates source or agency. Per doctrine, יְהוָה is rendered 'the LORD' rather than transliterated.
- source_word: אֲשֶׁר יַעֲשֶׂה יְהוָה
  chosen: that the LORD will do
  alternatives:
  - which the LORD will do
  - that the LORD is about to do
  lexicon: HALOT
  rationale: The relative clause explains the content or validating force of the sign. Rendering אֲשֶׁר here as 'that' produces natural English while preserving the clause's explanatory function.
- source_word: יַעֲשֶׂה
  chosen: will do
  alternatives:
  - will perform
  - will accomplish
  lexicon: HALOT
  rationale: עשה is broad and commonly rendered 'do' or 'make.' Here 'will do' is sufficiently natural and leaves the object 'this thing' explicit.
- source_word: אֶת הַ/דָּבָר הַ/זֶּה
  chosen: this thing
  alternatives:
  - this word
  - this matter
  - this promise
  lexicon: HALOT
  rationale: דבר can mean 'word,' 'matter,' or 'thing.' In this context it refers to the promised event the LORD has declared and will bring about. 'This thing' best captures the enacted reality without collapsing it merely into speech.
- source_word: אֲשֶׁר דִּבֵּר
  chosen: that he has spoken
  alternatives:
  - which he spoke
  - that he said
  - that he promised
  lexicon: HALOT
  rationale: The clause points back to the LORD's prior declaration. 'Has spoken' reflects the completed action with present relevance in English. 'Promised' would be interpretive beyond the lexical base of דבר.
