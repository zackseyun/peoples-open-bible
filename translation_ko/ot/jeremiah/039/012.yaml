review_pass:
  verdict: revise
  source_fidelity: 초안은 ‘그를 데려가라’, 그를 계속 살피라, 해를 입히지 말라, 그리고 그가 말하는 대로 그를 대하라는 히브리어 명령의 핵심 내용을 충실히 담고 있습니다. 다만 עֵינֶיךָ שִׂים עָלָיו는 한국어로 ‘눈을 그에게 두고’보다 ‘그를 지켜보고’가 더 자연스럽게 해당 관용을 전달합니다. כִּי אִם의 대조·제한 용법은 ‘다만’으로 보존했습니다.
  naturalness: ‘눈을 그에게 두고’와 ‘그에게 행하십시오’는 현대 표준어에서 다소 직역투입니다. ‘그를 지켜보고’ 및 ‘그를 대하십시오’로 고치면 명령문의 격식은 유지하면서 자연스러워집니다.
  terminology: 인명·신명 또는 전문 신학 용어는 없습니다. ‘아무 해도 입히지 마십시오’는 מְאוּמָה רָע(어떤 악/해도)의 전면 부정을 자연스럽게 나타냅니다. 호칭 ‘당신’은 원문의 단수 수신자를 유지하며, 합쇼체 명령문과도 조화됩니다.
  issues:
  - severity: medium
    issue: ‘눈을 그에게 두고’는 부자연스러운 직역투입니다.
    rationale: 히브리어의 ‘눈을 ... 위에 두다’는 여기서 그를 계속 주의하여 살피라는 뜻입니다. ‘그를 지켜보고’가 현대 한국어에서 이를 자연스럽게 전달합니다.
  - severity: medium
    issue: ‘그에게 행하십시오’는 현대 한국어에서 목적어 결합이 어색합니다.
    rationale: עֲשֵׂה עִמּוֹ는 그를 어떻게 대할지를 가리키는 넓은 표현입니다. ‘그를 대하십시오’는 의미 범위를 불필요하게 좁히지 않으면서 자연스럽습니다.
  - severity: low
    issue: ‘오히려’보다 ‘다만’이 접속의 제한·대조 기능에 더 적합합니다.
    rationale: כִּי אִם은 앞선 금지 뒤에 긍정 지시를 대조적으로 제시합니다. ‘다만’은 한국어에서 이 연결을 매끄럽게 나타냅니다.
  revised_text: 그를 데려가십시오. 그를 지켜보고, 그에게는 아무 해도 입히지 마십시오. 다만 그가 당신에게 말하는 대로 그를 대하십시오.
