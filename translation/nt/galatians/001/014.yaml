id: GAL.1.14
reference: Galatians 1:14
source:
  edition: SBLGNT
  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
translation:
  text: I was advancing in Judaism beyond many others my own age among my people, and I was far more zealous for the traditions of my ancestors.
  philosophy: dynamic
lexical_decisions:
- source_word: προέκοπτον
  chosen: was advancing
  alternatives:
  - was progressing
  - was excelling
  lexicon: BDAG
  rationale: Imperfect aspect suggests ongoing past progress. “Was advancing” preserves both the progressive sense and the comparative context without overstating success.
- source_word: Ἰουδαϊσμῷ
  chosen: Judaism
  alternatives:
  - the Jewish religion
  - the Judean way of life
  lexicon: BDAG
  rationale: “Judaism” is the standard concise rendering and fits Paul’s contrast in context. It preserves the identifiable religious system without adding explanatory wording into the main text.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  chosen: beyond many of my contemporaries
  alternatives:
  - beyond many of my peers
  - more than many of those my own age
  lexicon: BDAG
  rationale: ὑπέρ here marks comparison, and συνηλικιώτας refers to those of the same age. “Contemporaries” is natural English that preserves the age-peer idea in context.
- source_word: ἐν τῷ γένει μου
  chosen: among my people
  alternatives:
  - in my nation
  - among my own race
  lexicon: BDAG
  rationale: γένος can denote kin-group, people, or nation. “Among my people” communicates the social-ethnic reference clearly in modern English without the potential misunderstanding of “race.”
- source_word: περισσοτέρως
  chosen: far more
  alternatives:
  - more exceedingly
  - much more
  lexicon: BDAG
  rationale: This intensifies Paul’s zeal in comparison with others. “Far more” is idiomatic and preserves the comparative force.
- source_word: ζηλωτὴς ὑπάρχων
  chosen: being ... zealous
  alternatives:
  - being a zealot for
  - being especially devoted to
  lexicon: BDAG
  rationale: The participial construction is well represented by “being ... zealous.” Rendering ζηλωτής as the adjective “zealous” is more natural here than the noun “zealot,” which could sound overly technical or political in English.
- source_word: τῶν πατρικῶν μου παραδόσεων
  chosen: for my ancestral traditions
  alternatives:
  - for the traditions of my fathers
  - for the traditions handed down by my ancestors
  lexicon: BDAG
  rationale: πατρικός points to what is inherited from the fathers/ancestors. “Ancestral traditions” gives clear modern English while preserving the inherited, tradition-bound sense of the phrase.
