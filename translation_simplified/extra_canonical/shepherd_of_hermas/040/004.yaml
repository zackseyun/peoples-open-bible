  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/004.yaml
  text: 4. Therefore, as many as are strong in the faith of the Lord, having put on the truth, do not cling to such spirits, but keep away from them. But those who are double‑minded and often repent practice divination like the nations and bring a greater sin upon themselves by practicing idolatry; for the one who consults a false prophet about any matter is an idolater, empty of the truth and foolish.
translation:
  language: en
  text: 4. Therefore, all who are strong in their faith in the Lord and have clothed themselves with truth do not attach themselves to such spirits. They stay away from them. But those who are divided in mind and often change their minds[a] seek guidance through divination, as the nations do. By practicing idolatry, they bring an even greater sin on themselves. Anyone who consults a false prophet about any matter is an idolater, empty of truth and foolish.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Earlier reader wording used a form of "repent." Preserve reconsideration/change of mind without adding a Godward destination. Here the direction or referent is contested, vacillating, or explicitly contrary to faith; a uniform Godward rendering would misstate the passage.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: having put on the truth
  simplified_phrase: have clothed themselves with truth
  preserved_meaning: The clothing image remains while its action is made immediately clear.
  reasoning_layer_used: POB text and source-language image
  rationale: This preserves the concrete metaphor instead of reducing it to merely knowing truth.
- pob_phrase: do not cling to such spirits, but keep away from them
  simplified_phrase: do not attach themselves to such spirits. They stay away from them.
  preserved_meaning: Faithful people neither form ties with these spirits nor approach them.
  reasoning_layer_used: POB clause structure
  rationale: Two short sentences preserve both distinct actions in natural English.
- pob_phrase: practice divination like the nations
  simplified_phrase: seek guidance through divination, as the nations do
  preserved_meaning: They imitate the nations by using divination to obtain guidance.
  reasoning_layer_used: POB wording and immediate context
  rationale: The added verb phrase explains the unfamiliar practice without removing its name.
interpretive_expansions:
- pob_phrase: practice divination
  rendering: seek guidance through divination
  claim: Divination is being used as a way to seek guidance.
  evidence:
  - The following clause describes consulting a false prophet about a matter.
  confidence: high
  alternatives_preserved:
  - practice divination
