id: LUK.24.12
reference: Luke 24:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: ko
  text: 그러나 베드로는 일어나 무덤으로 달려갔습니다. 몸을 굽혀 들여다보니 세마포만 보았습니다. 그는 일어난 일을 놀라워하며 떠나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기에게로’입니다. 이 표현은 그가 자기 있는 곳이나 집으로 돌아갔다는 뜻으로도 이해될 수 있으나, 본문은 그 목적지를 명시하지 않습니다.
    reason: πρὸς ἑαυτόν의 관용적·해석상 열려 있는 의미를 보존하고, ‘집’이라는 특정 해석을 본문에 강제하지 않기 위함입니다.
lexical_decisions:
- source_word: ἀναστὰς ἔδραμεν
  english_pob_choice: got up and ran
  chosen_korean: 일어나 무덤으로 달려가서
  alternatives_korean:
  - 일어나서 달려가서
  - 일어나 달렸습니다
  lexicon: ἀνίστημι / τρέχω
  rationale: 두 동사의 연속 동작을 자연스러운 한국어로 살리되, 사건 전개를 빠르게 전달하기 위해 ‘달려가서’로 묶었습니다.
- source_word: τὸ μνημεῖον
  english_pob_choice: the tomb
  chosen_korean: 무덤
  alternatives_korean:
  - 묘
  - 장지
  lexicon: μνημεῖον
  rationale: 복음서 문맥의 무덤을 가장 직접적으로 드러내는 표준어로 옮겼습니다.
- source_word: τὰ ὀθόνια μόνα
  english_pob_choice: the linen cloths alone
  chosen_korean: 세마포만
  alternatives_korean:
  - 세마포들만
  - 베로 된 천만
  lexicon: ὀθόνια
  rationale: 부활 사건의 빈 무덤 표지를 간결하게 유지하면서, ‘only’의 배타성을 ‘만’으로 반영했습니다.
- source_word: θαυμάζων τὸ γεγονός
  english_pob_choice: marveling at what had happened
  chosen_korean: 일어난 일을 놀라며
  alternatives_korean:
  - 일어난 일을 경탄하며
  - 그 일에 놀라며
  lexicon: θαυμάζω / γίνομαι
  rationale: 놀람과 경이의 반응을 모두 담되, 한국어 서술 흐름에 맞게 과도한 해석 없이 표현했습니다.
theological_decisions:
- issue: 본문의 시제와 서술 거리
  chosen_reading: 베드로의 반응을 현재형이 아닌 과거 서술로 옮겨, 사건 전개의 연속성과 내적 반응을 담았습니다.
  alternative_readings:
  - 현재형 느낌을 살려 ‘보니’로 옮기는 방식
  - 직역에 가깝게 ‘그는 … 본다’로 옮기는 방식
  rationale: SBLGNT의 현재형 βλέπει는 서술적 생동감을 주지만, 한국어 본문에서는 어색한 혼합 시제를 피하면서도 장면의 현장감을 유지하는 쪽이 자연스럽습니다.
  doctrine_reference: 서사체 시제 전달
