    3. 파엔페리스가 그에게 말했습니다. 「그렇다면, 이 히브리인 종이 내 앞에서 어디서 온 것이냐?」 그러자 그가 말했습니다. 「이스마엘 사람들이 그를 그들이 돌아올 때까지 제게 맡겼습니다.」


