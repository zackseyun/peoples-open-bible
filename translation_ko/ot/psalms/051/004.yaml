revisions:
- from: 나를 내 죄악에서 철저히 씻어 주시고, 나를 내 죄에서 깨끗하게 씻어 주십시오.[a][b][c]
  to: 제가 제 범죄들을 알고 있으며, 제 죄가 언제나 제 앞에 있습니다.
  rationale: 원문 כִּי를 앞 문맥의 간구에 대한 이유를 제시하는 접속으로 ‘-으며’의 고백 흐름 안에 반영했습니다. 명시된 1인칭 대명사 אֲנִי는 ‘제가’로, פְשָׁעַי의 복수는 ‘제 범죄들을’로 보존했습니다. חַטָּאתִי의 단수 ‘제 죄’, נֶגְדִּי ‘제 앞에’, תָמִיד ‘언제나’를 직역적이면서도 자연스러운 한국어로 옮겼습니다. 현 각주는 다른 절의 어휘에 관한 것이므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:08:58Z'
