  yaml_path: translation/deuterocanon/1_esdras/003/034.yaml
  text: But they stand guard around him, and each one cannot go away and do his work, nor do they disobey him.
translation:
  language: ko
  text: 그들은 그 주위를 둘러 경비를 서고 있으며, 각자는 떠나 자기 일을 할 수 없고, 그에게 불순종하지도 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηροῦσιν κύκλῳ περὶ αὐτόν
  english_pob_choice: stand guard around him
  chosen_korean: 그를 둘러서서 지키고 있습니다
  alternatives_korean:
  - 그 주위를 지키고 있습니다
  - 그를 둘러 경계하고 있습니다
  lexicon: τηρέω, κύκλῳ
  rationale: English POB의 'stand guard'를 따라 단순히 '보다'가 아니라 경계·호위의 지속 상태를 드러내기 위해 '둘러서서 지키다'로 옮겼습니다.
- source_word: ἕκαστος ἀπελθεῖν καὶ ποιεῖν τὰ ἔργα αὐτοῦ
  english_pob_choice: each one cannot go away and do his work
  chosen_korean: 각자 자기 일을 하러 떠날 수 없고
  alternatives_korean:
  - 각 사람마다 가서 자기 일을 할 수 없고
  - 아무도 떠나 자기 일을 할 수 없고
  lexicon: ἕκαστος, ἀπελθεῖν, ποιεῖν τὰ ἔργα
  rationale: 각 개인의 제약을 살리기 위해 '각자'를 두고, 'go away and do his work'는 자연스러운 현대 한국어로 '자기 일을 하러 떠날 수 없다'고 옮겼습니다.
- source_word: οὐδὲ παρακούουσιν αὐτοῦ
  english_pob_choice: nor do they disobey him
  chosen_korean: 그의 말에 불순종하지도 않습니다
  alternatives_korean:
  - 그에게 불순종하지도 않습니다
  - 그의 명령을 거역하지도 않습니다
  lexicon: παρακούω
  rationale: παρακούω의 핵심은 단순한 '듣지 않음'이 아니라 권위에 대한 불복종이므로, 문맥상 자연스럽게 '그의 말에 불순종하다'로 옮겼습니다.
theological_decisions:
- issue: 이 구절의 주어인 존재들의 순종과 통제된 행동
  chosen_reading: 그들은 상시적으로 둘러 지키며, 각자 임의로 떠나 행동하지 못하고, 권위에 불순종하지도 않는 질서 아래 있습니다.
  alternative_readings:
  - 단순한 경비 묘사로만 읽기
  - 종교적 순종의 모범으로 확장해 읽기
  rationale: 문맥상 과장된 의인화가 아니라 질서와 종속의 생생한 묘사이므로, 의미를 도덕화하지 않고 서술된 통제 상태를 그대로 반영했습니다.
  doctrine_reference: 문맥 우선 해석; 의인화와 질서 묘사
