    οἷς οὐδεμία κακία ἀναβαίνει ἐπὶ τὴν καρδίαν, οὐδὲ ⸢ἔγνω⸣σαν τί ἐστι πονηρία, ἀλλὰ πάντοτε ἐν νηπιότητι
    διέμειναν. 2. οἱ τοιοῦτοι οὖν ἀδιστάκτως κατοικοῦσιν ἐν τῇ βασιλείᾳ τοῦ Θεοῦ, ὅτι ἐν οὐδενὶ πράγματι
    ἐμίαναν τὰς ἐντολὰς τοῦ Θεοῦ, ἀλλὰ μετὰ νηπιότητος διέμειναν πάσας τὰς ἡμέρας τῆς ζωῆς αὐτῶν ἐν τῇ
    αὐτῇ φρονήσει. 3. ὅσοι οὖν διαμενεῖτε, φησί, καὶ ἔσεσθε ὡς τὰ βρέφη, κακίαν μὴ ἔχοντες, [καὶ] πάντων
    τῶν προειρημένων ἐνδοξότεροι ἔσε⸢σ⸣θε· πάντα γὰρ τὰ βρέφη ἔνδοξά ἐστι παρὰ τῷ Θεῷ καὶ πρῶτα παρ᾿ αὐτῷ.
    μακάριοι οὖν ὑμεῖς, ὅσοι ἂν ἄρητε ἀφ᾿ ἑαυτῶν τὴν πονηρίαν, ἐνδύσησθε δὲ τὴν ἀκακίαν· πρῶτοι πάντων
    ζήσεσθε τῷ Θεῷ. 4. μετὰ τὸ συντελέσαι αὐτὸν τὰς παραβολὰς τῶν ὀρέων λέγω αὐτῷ· Κύριε, νῦν μοι δήλωσον
    περὶ τῶν λίθων ἠρμένων ἐκ τοῦ πεδίου καὶ εἰς τὴν οἰκοδομὴν τεθειμένων ἀντὶ τῶν λίθων τῶν ἠρμένων ⸢ἐκ⸣
    τοῦ πύργου, καὶ τῶν στρογγύλων τῶν τεθέντων εἰς τὴν οἰκοδομήν, καὶ τῶν ἔτι στρογγύλων ὄντων.
