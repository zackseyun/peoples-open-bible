id: PSA.62.11
reference: Psalms 62:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַחַ֤ת דִּבֶּ֬ר אֱלֹהִ֗ים שְׁתַּֽיִם ז֥וּ שָׁמָ֑עְתִּי כִּ֥י עֹ֝֗ז לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/011.yaml
  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
  footnotes:
  - marker: a
    text: Or, 'Once God has spoken; twice I have heard this.' The Hebrew idiom may be read adverbially ('once/twice') or as a numerical saying formula ('one thing/two things').
    reason: alternative_reading
translation:
  language: ko
  text: 하나님께서 한 가지를 말씀하셨고, 나는 두 가지를 들었습니다. 곧 능력은 하나님께 속해 있다는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 한 번 말씀하셨고, 나는 이것을 두 번 들었습니다’로 옮길 수 있습니다. 히브리어의 ‘하나/둘’은 ‘한 가지/두 가지’라는 수사적 표현으로도, ‘한 번/두 번’이라는 부사적 표현으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּבְטְחוּ בְעֹשֶׁק
  english_pob_choice: Do not trust in oppression
  chosen_korean: 압제에 의지하지 말고
  alternatives_korean:
  - 압제를 신뢰하지 말고
  - 억압에 भरो하지 말고
  lexicon: HALOT
  rationale: בטח의 기본 뜻인 ‘의지하다/신뢰하다’를 살리되, בְעֹשֶׁק은 단순한 폭력보다 불의한 착취·압제를 포괄하므로 ‘압제’로 옮겼습니다.
- source_word: וּבְגָזֵל
  english_pob_choice: in robbery
  chosen_korean: 탈취에
  alternatives_korean:
  - 강탈에
  - 강도질에
  lexicon: HALOT
  rationale: גָזֵל은 ‘빼앗음, 강탈, 탈취’의 폭을 가지므로, 현대어에서 뜻이 분명한 ‘탈취’가 가장 직접적입니다.
- source_word: תֶּהְבָּלוּ
  english_pob_choice: put vain hope
  chosen_korean: 헛된 희망을 두지
  alternatives_korean:
  - 헛되게 되지
  - 헛되이 행하지
  - 허망해지지
  lexicon: HALOT
  rationale: הבל 계열은 본문상 ‘헛됨/공허함’에 머무르거나 헛된 것에 기대는 의미가 가능하므로, POB의 ‘vain hope’를 따라 ‘헛된 희망을 두다’로 옮겨 긴장을 보존했습니다.
- source_word: חַיִל כִּי יָנוּב
  english_pob_choice: if wealth increases
  chosen_korean: 재물이 늘어나더라도
  alternatives_korean:
  - 재물이 불더라도
  - 재산이 자라더라도
  - 부가 증가하더라도
  lexicon: HALOT
  rationale: חַיִל은 여기서 재물·자산의 뜻이 자연스럽고, נוב는 ‘자라다/불어나다’의 이미지를 가지므로 현대적이면서도 비유를 살려 ‘재물이 늘어나더라도’로 처리했습니다.
- source_word: תָּשִׁיתוּ לֵב
  english_pob_choice: do not set your heart on it
  chosen_korean: 그것에 마음을 두지 마십시오
  alternatives_korean:
  - 그것에 마음을 두지 마십시오
  - 그것을 마음에 두지 마십시오
  - 그것에 마음을 쏟지 마십시오
  lexicon: HALOT
  rationale: שׁית לב의 관용구는 어떤 대상에 내적 주의와 의지를 두는 뜻이므로, 한국어 관용으로 자연스러운 ‘마음을 두다’를 택했습니다.
theological_decisions:
- issue: 중간 행의 난해한 동사 הבל 처리
  chosen_reading: ‘헛된 희망을 두지’로 옮겨, 재물이나 불의한 이득에 기대를 거는 행위를 경계하는 흐름을 살렸습니다.
  alternative_readings:
  - ‘헛되이 되지’
  - ‘헛되이 자랑하지’
  - ‘헛되이 행하지’
  rationale: 본문의 히브리어는 난해하며, English POB도 ‘put vain hope’로 의미를 좁혀 제시합니다. 그래서 본문이 가진 공허한 의존의 경고를 유지하되, 불필요한 해석 확정을 피했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
