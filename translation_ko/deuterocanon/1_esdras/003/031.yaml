  text: He said to strike, and they strike; he said to lay waste, and they lay waste; he said to build, and they build.
translation:
  language: ko
  text: 그가 “치라”고 말하자, 그들은 칩니다. 그가 “황폐하게 하라”고 말하자, 그들은 황폐하게 합니다. 그가 “지으라”고 말하자, 그들은 짓습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπε
  english_pob_choice: he said
  chosen_korean: 그가 … 하면
  alternatives_korean:
  - 그가 말했다고 하면
  - 그가 말하면
  lexicon: LSJ
  rationale: 반복되는 εἶπε를 단순한 ‘말하다’보다 명령의 효력이 드러나는 한국어 조건문 구조로 옮기되, 원문의 간결한 병렬성을 유지했습니다.
- source_word: πατάξαι / τύπτουσιν
  english_pob_choice: to strike / they strike
  chosen_korean: 치라 / 칩니다
  alternatives_korean:
  - 때리라 / 때립니다
  - 치다 / 칩니다
  lexicon: LSJ
  rationale: πατάσσω/τύπτω 계열의 폭력적 행위를 현대 한국어에서 자연스럽고 짧게 드러내는 ‘치다’ 계열을 택해, 같은 어근의 명령과 실행을 대응시켰습니다.
- source_word: ἐρημῶσαι / ἐρημοῦσιν
  english_pob_choice: to lay waste / they lay waste
  chosen_korean: 황폐하게 하라 / 황폐하게 합니다
  alternatives_korean:
  - 황폐시키라 / 황폐시킵니다
  - 폐허로 만들라 / 폐허로 만듭니다
  lexicon: LSJ
  rationale: ἐρημόω의 ‘황폐하게 만들다, 버려지게 하다’는 뜻을 살리면서도, 군사적 파괴의 결과를 분명히 하는 표현으로 옮겼습니다.
- source_word: οἰκοδομῆσαι / οἰκοδομοῦσιν
  english_pob_choice: to build / they build
  chosen_korean: 건축하라 / 건축합니다
  alternatives_korean:
  - 지으라 / 집니다
  - 건설하라 / 건설합니다
  lexicon: LSJ
  rationale: οἰκοδομέω의 기본 의미를 가장 직접적으로 반영하는 ‘건축하다’를 택해, 앞선 파괴와 대조되는 행위의 병렬을 유지했습니다.
theological_decisions:
- issue: 명령의 효력 표현 방식
  chosen_reading: ‘그가 … 하면, 그들은 … 합니다’로 옮겨, 반복되는 왕의 말이 곧 실행으로 이어지는 효력을 드러냈습니다.
  alternative_readings:
  - ‘그가 명령하면, 그들은 … 합니다’
  - ‘그가 말하면, 곧 그들은 … 합니다’
  rationale: 원문은 εἶπε + 부정사/현재동사 병렬로 왕의 발화와 수행을 간결하게 제시합니다. ‘명령하다’로 높이면 해석이 더해지므로, 말의 효력을 조건문으로 드러내면서도 원문의 절제된 어조를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
