  lexicon: HALOT
  rationale: '''לְ''가 저자·헌정·관련성을 모두 가질 수 있으므로, 한국어에서는 표제 관용에 맞게 ''다윗의 시''로 옮기되 단정적 저자 표시는 피했습니다.'
theological_decisions:
- issue: 시편 표제의 המקַּשְׂכִּיל과 לְדָוִד의 의미를 어디까지 확정할지
  chosen_reading: 장르 표지는 음역으로 남기고, לְדָוִד는 관계의 열림을 유지하는 표제로 처리했습니다.
  alternative_readings:
  - 훈계시/묵상시로 풀어 설명하기
  - 다윗이 지은 시로 단정하기
  rationale: 원문이 허용하는 범위를 넘지 않도록 하여, 표제의 기능과 저자성에 관한 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
