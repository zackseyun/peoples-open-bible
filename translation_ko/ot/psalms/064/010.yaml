  text: The righteous will rejoice in Yahweh and take refuge in him, and all the upright in heart will glory.[a]
  footnotes:
  - marker: a
    text: Or “will boast.” The Hebrew verb can denote boasting or exulting; here the sense is positive rejoicing in God and his saving action.
    reason: lexical_alternative
translation:
  language: ko
  text: 의인은 야훼 안에서 기뻐하고 그분께 피할 것이며, 마음이 올곧은 사람들은 모두 자랑할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기뻐 외칠 것입니다.’ 히브리어 동사는 ‘자랑하다’ 또는 ‘환희하다’를 뜻할 수 있으며, 여기서는 야훼의 구원 행위로 인한 긍정적인 자랑과 기쁨을 가리킵니다.
    reason: lexical_alternative
