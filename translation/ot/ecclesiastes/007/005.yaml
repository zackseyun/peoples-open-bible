id: ECC.7.5
reference: Ecclesiastes 7:5
source:
  edition: WLC
  text: ט֕וֹב לִ/שְׁמֹ֖עַ גַּעֲרַ֣ת חָכָ֑ם מֵ/אִ֕ישׁ שֹׁמֵ֖עַ שִׁ֥יר כְּסִילִֽים׃
translation:
  text: It is better to hear the rebuke[a] of a wise man than for a man[b] to hear the song of fools.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: A published transcription of Dead Sea Scroll 4Q109 has plural 'rebukes' and a corrected 'than hearing' construction,
      assuming its supplied wise-man wording and comparative prefix. Its crossed-out characters are unidentified, so they
      do not establish an erased 'man.' POB provisionally retains the Masoretic wording; earliest construction remains unresolved.
  - marker: b
    reason: lexical_alternative
    text: The Hebrew is literally 'than a man hearing the song of fools.' This is a generic listener, not necessarily a different
      person. 'For a man to hear' keeps the man explicit while expressing the participial construction idiomatically.
lexical_decisions:
- source_word: טוֹב
  chosen: It is better
  alternatives:
  - Better
  lexicon: HALOT
  rationale: The adjective functions predicatively in a comparative construction. English idiom is best expressed as 'It is
    better' rather than the more abrupt 'Better' in this standalone verse.
- source_word: לִשְׁמֹעַ
  chosen: to hear
  alternatives:
  - to listen to
  lexicon: HALOT
  rationale: The infinitive construct after טוֹב expresses the preferable action. 'Hear' preserves the Hebrew verbal link
    with the participle שֹׁמֵעַ later in the verse and keeps the comparison tight.
- source_word: גַּעֲרַת
  chosen: the rebuke
  alternatives:
  - the reproof
  - the reprimand
  lexicon: HALOT
  rationale: The noun denotes a verbal correction or scolding. 'Rebuke' is natural modern English and preserves the sharpness
    of the wise person's corrective speech.
- source_word: חָכָם
  chosen: a wise man
  alternatives:
  - a wise person
  - the wise
  lexicon: HALOT
  rationale: The Hebrew is grammatically masculine singular and here contrasts with אִישׁ later in the verse. Per the gender-accurate
    policy, 'wise man' best matches the source form and sense.
- source_word: מֵאִישׁ
  chosen: than for a man
  alternatives:
  - than a man
  - than for someone
  lexicon: HALOT
  rationale: Comparative min governs a man with a participle. 'Than for a man' keeps the generic listener explicit; it does
    not require a different hearer from the first clause. English reshapes the clause without pretending Hebrew has two infinitives.
    No fresh lexicon consultation is claimed.
- source_word: שֹׁמֵעַ
  chosen: to hear
  alternatives:
  - hearing
  - listening to
  lexicon: HALOT
  rationale: The Hebrew active participle describes the man hearing. English 'for a man to hear' expresses this as a clause
    while retaining the explicit participant. The tested alternative 'to be a man listening' makes being that kind of person
    more conspicuous and was not preferred. This is an English rendering decision, not a source change.
- source_word: שִׁיר
  chosen: the song
  alternatives:
  - the singing
  - a song
  lexicon: HALOT
  rationale: The singular noun likely functions collectively or generically for the fools' entertainment. 'The song' is a
    straightforward rendering and keeps the contrast with 'rebuke' vivid.
- source_word: כְּסִילִים
  chosen: of fools
  alternatives:
  - of foolish men
  - of the foolish
  lexicon: HALOT
  rationale: The plural adjective/substantive denotes morally dull or foolish people. 'Fools' is the standard concise rendering
    in wisdom literature and preserves the ethical tone.
