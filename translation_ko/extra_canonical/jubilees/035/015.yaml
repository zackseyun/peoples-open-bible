base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/015.yaml
  text: their uncleanness and after their error, he and his children. And you tell me to make him swear that he will not kill Jacob his brother. Even if he swears, he will not keep his oath, nor will he do anything but evil. And if he desires to kill Jacob his brother, he will be given into Jacob’s hand, and he will not escape from his hand, for he will fall into his hand.
translation:
  language: ko
  text: 그들의 부정함과 그들의 잘못 뒤에, 그와 그의 자손이. 그리고 당신은 그가 자기 동생 야곱을 죽이지 않겠다고 맹세하게 하라고 내게 말합니다. 그가 맹세하더라도 자기 맹세를 지키지 않을 것이며, 악 외에는 아무것도 하지 않을 것입니다. 또 그가 자기 동생 야곱을 죽이고자 하면, 그는 야곱의 손에 넘겨질 것이며, 그 손에서 벗어나지 못할 것입니다. 그가 야곱의 손에 떨어질 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርኵሶን / ስሕተቶን
  english_pob_choice: their uncleanness and after their error
  chosen_korean: 그들의 부정함과 그들의 잘못 뒤에
  alternatives_korean:
  - 그들의 더러움과 그들의 오류 뒤에
  - 그들의 불결함과 그들의 빗나감 뒤에
  lexicon: 부정함 / 잘못
  rationale: 부정함은 의례·도덕적 오염을 함께 담을 수 있고, ስሕተት은 단순 실수보다 ‘잘못’이 본문 흐름에 더 자연스럽습니다.
- source_word: እስለ
  english_pob_choice: make him swear
  chosen_korean: 맹세하게 하다
  alternatives_korean:
  - 서약하게 하다
  - 맹세하도록 하다
  lexicon: 맹세하다
  rationale: 이 절의 맥락은 법적·서약적 행위를 가리키므로 ‘맹세하게 하다’가 가장 직접적입니다.
- source_word: እኩይ
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 악한 것
  - 나쁜 일
  lexicon: 악
  rationale: 영문 POB의 대조가 ‘anything but evil’이므로, 반복을 살려 ‘악’으로 간결하게 옮겼습니다.
- source_word: ይትወሀብ / ውስተ እዴሁ
  english_pob_choice: he will be given into Jacob’s hand
  chosen_korean: 그는 야곱의 손에 넘겨질 것이며
  alternatives_korean:
  - 그는 야곱의 손에 주어질 것이며
  - 야곱의 손에 그가 맡겨질 것이며
  lexicon: 손에 넘겨지다
  rationale: ‘손’은 권세·지배의 관용구를 유지해야 하므로, 수동형을 살린 ‘넘겨지다’가 적절합니다.
- source_word: ይወርድ
  english_pob_choice: he will fall into his hand
  chosen_korean: 그 손에 떨어질 것입니다
  alternatives_korean:
  - 그 손에 빠질 것입니다
  - 그의 손으로 내려갈 것입니다
  lexicon: 떨어지다
  rationale: ‘fall into his hand’의 통제 불능 상태를 한국어로 자연스럽게 드러내는 표현입니다.
theological_decisions:
- issue: 야곱의 보호와 결정론적 보장
  chosen_reading: 야곱을 해치려는 시도는 결국 야곱의 손에 넘겨지는 결과로 끝난다는 확정적 진술로 옮겼습니다.
  alternative_readings:
  - 야곱이 우연히 이긴다는 식의 완화된 읽기
  - 단순한 도덕적 권고로 약화시키는 읽기
  rationale: 본문은 경고가 아니라 보호의 확정성을 말하므로, 미래형·수동형을 살려 결과의 필연성을 보존했습니다.
  doctrine_reference: 섭리 / 보호
- issue: ‘악 외에는 아무것도 하지 않을 것입니다’의 강도
  chosen_reading: 완전한 도덕적 타락을 뜻하는 반복 구조로 보아 ‘악 외에는 아무것도 하지 않을 것입니다’로 번역했습니다.
  alternative_readings:
  - ‘좋은 일을 하지 않을 것입니다’로 완화
  - ‘오직 악을 행할 것입니다’로 의역
  rationale: 영문 POB의 revised wording에 맞춰, 선행 행위를 단순히 부정하는 것이 아니라 악으로만 향하는 반복성을 살렸습니다.
  doctrine_reference: 인간의 악의성
