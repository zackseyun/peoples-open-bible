- from: 제 때들은 주님의 손 안에 있습니다[a]. 제 원수들의 손에서, 그리고 저를 쫓는 자들의 손에서 저를 건져 주십시오.
  to: 주님의 얼굴을 주님의 종에게 비추시고, 주님의 한결같은 사랑으로 저를 구원해 주십시오[a].
  rationale: 대상 원문(시편 31:16)에 맞추어 본문 전체를 교체했습니다. ‘얼굴을 … 비추시고’는 הָאִירָה פָנֶיךָ의 빛나는 얼굴이라는 비유를 보존하며, ‘주님의 종에게’는 עַל עַבְדֶּךָ의 호의가 향하는 대상을 자연스럽게 드러냅니다. חֶסֶד의 폭과 בְ의 해석 가능성은 본문과 각주로 각각 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:06:41Z'
