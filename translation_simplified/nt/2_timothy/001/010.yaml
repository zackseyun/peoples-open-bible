translation:
  language: en
  text: But God’s grace has now been revealed through the appearing of our Savior, Jesus Christ.[a] Through his appearing, he abolished death and brought life and freedom from decay to light through the gospel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Jesus the Messiah.” The Greek title Messiah can also be used as the name-like designation Christ.
    reason: alternative_reading
  - marker: b
    text: Or “immortality.” The Greek emphasizes freedom from decay or destruction.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: but has now been revealed
  simplified_phrase: But God’s grace has now been revealed
  preserved_meaning: God’s grace from the previous verse is what has now been disclosed.
  reasoning_layer_used: POB lexical decision for φανερωθεῖσαν and immediate context
  rationale: Naming grace makes the verse’s connection to the preceding sentence clear.
- pob_phrase: through the appearing ... who indeed abolished death and brought
  simplified_phrase: Through his appearing, he abolished death and brought
  preserved_meaning: Jesus’ appearing remains linked with his decisive defeat of death and disclosure of life.
  reasoning_layer_used: POB syntax and theological decision for καταργήσαντος
  rationale: Repeating “appearing” preserves the linkage while avoiding a dense relative clause.
- pob_phrase: incorruptibility
  simplified_phrase: freedom from decay
  preserved_meaning: The life disclosed through the gospel is imperishable and not subject to corruption.
  reasoning_layer_used: POB lexical and theological decisions for ἀφθαρσίαν
  rationale: The plain phrase communicates the source term’s central image more clearly.
interpretive_expansions:
- pob_phrase: has now been revealed
  rendering: God’s grace has now been revealed
  claim: The thing revealed is God’s grace from the preceding verse.
  evidence:
