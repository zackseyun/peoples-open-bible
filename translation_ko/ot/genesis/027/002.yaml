  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר הִנֵּה נָ֖א זָקַ֑נְתִּי לֹ֥א יָדַ֖עְתִּי י֥וֹם מוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/002.yaml
  text: And he said, “Look now, I have grown old; I do not know the day of my death.”
translation:
  language: ko
  text: 그가 말했습니다. 「보십시오, 이제 나는 늙었습니다. 나는 내 죽음의 날이 언제인지 알지 못합니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  english_pob_choice: Look now
  chosen_korean: 보십시오, 이제
  alternatives_korean:
  - 보소서, 이제
  - 이제 보십시오
  lexicon: הִנֵּה / נָא
  rationale: 감탄과 주의를 끄는 표현을 현대 합쇼체로 옮기기 위해 ‘보십시오’로 처리했고, נָא의 시간·태도 완화 기능은 ‘이제’로 반영했습니다.
- source_word: זָקַנְתִּי
  english_pob_choice: I have grown old
  chosen_korean: 나는 늙었습니다
  alternatives_korean:
  - 나는 나이가 들었습니다
  - 내가 늙었습니다
  lexicon: זקן
  rationale: 완료된 상태 변화를 자연스러운 한국어로 옮기되, 단순한 연령 언급이 아니라 노쇠의 상태를 드러내는 ‘늙었습니다’를 선택했습니다.
- source_word: י֥וֹם מוֹתִֽ/י־
  english_pob_choice: the day of my death
  chosen_korean: 내 죽음의 날
  alternatives_korean:
  - 내가 죽을 날
  - 내 죽는 날
  lexicon: יום + מות
  rationale: 히브리어의 직설적 소유구문을 보존해 ‘내 죽음의 날’로 번역하여, 개인의 죽음이 정해진 날로 인식되는 표현을 살렸습니다.
theological_decisions:
- issue: 죽음의 날을 아는 지식의 한계
  chosen_reading: 화자는 자신의 죽음의 날짜를 알지 못한다고 말하며, 인간 지식의 한계를 담담히 고백합니다.
  alternative_readings:
  - 단순한 나이 듦의 표현으로만 읽기
  - 임박한 죽음에 대한 예감으로 축소하기
  rationale: 본문은 죽음의 시점을 아는 지식 부재를 분명히 말하므로, 이를 약화하지 않고 그대로 살리는 것이 원문의 의미를 가장 잘 반영합니다.
  doctrine_reference: 창 27:2 문맥의 서술적 진술
