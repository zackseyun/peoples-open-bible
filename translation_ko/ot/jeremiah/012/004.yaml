  - 온 들의 풀이
  lexicon: עֵשֶׂב / שָׂדֶה
  rationale: 히브리어의 평행구에서 들판의 초목 전체를 가리키므로, 직역을 유지하되 한국어로는 간결하게 ‘들의 풀’로 옮겼습니다.
- source_word: סָפְתָ֤ה בְהֵמוֹת֙ וָ/ע֔וֹף
  english_pob_choice: beasts and birds are swept away
  chosen_korean: 들짐승과 새가 쓸려 가고 있습니다
  alternatives_korean:
  - 들짐승과 새가 사라지고 있습니다
  - 들짐승과 새가 없애지고 있습니다
  lexicon: סָפַת
  rationale: 수동적 소멸을 나타내는 동사를 한국어의 ‘쓸려 가다’로 옮겨 재앙의 강한 흐름을 살렸습니다.
- source_word: אַחֲרִיתֵֽ/נוּ
  english_pob_choice: our end
  chosen_korean: 우리의 끝
  alternatives_korean:
  - 우리의 마지막
  - 우리의 종말
  lexicon: אַחֲרִית
  rationale: 영어 POB의 revised audit trail에 따라 ‘our end’로 확정된 의미를 반영해, 과도하게 신학화하지 않고 가장 직접적인 한국어로 옮겼습니다.
theological_decisions:
- issue: 자연 파괴와 인과관계의 표현
  chosen_reading: 땅의 슬픔과 초목의 마름, 그리고 짐승·새의 소멸을 사람들의 악의 결과로 직접 연결했습니다.
  alternative_readings:
  - 자연 현상을 단순한 비유로 완화하는 읽기
  - 심판의 언어를 상징적으로만 처리하는 읽기
  rationale: 히브리어 본문은 원인(거주민의 악)과 결과(땅·초목·동물의 황폐)를 분명히 연결하므로, 그 긴장을 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 창세기 3장; 예레미야 12장 문맥
