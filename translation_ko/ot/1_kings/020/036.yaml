  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: ko
  text: 그가 그에게 말했습니다. “그대가 야훼의 음성에 귀를 기울이지 않았으므로, 보십시오. 그대가 내게서 떠나가면 사자가 그대를 칠 것입니다.” 그가 그에게서 떠나가자 사자가 그를 찾아내어 그를 쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּקוֹל יְהוָה
  english_pob_choice: the voice of the LORD
  chosen_korean: 야훼의 음성
  alternatives_korean:
  - 야훼의 목소리
  - 주님의 음성
  lexicon: יהוה
  rationale: 본문은 단순한 ‘말씀’이 아니라 ‘음성/소리’에 대한 청종 여부를 말하므로, source를 직접 반영해 ‘음성’으로 옮겼습니다.
- source_word: לֹא שָׁמַעְתָּ
  english_pob_choice: you have not listened
  chosen_korean: 귀를 기울이지 않았으므로
  alternatives_korean:
  - 듣지 않았으므로
  - 순종하지 않았으므로
  lexicon: שׁמע
  rationale: 히브리어 שׁמע는 단순 청취보다 ‘듣고 따름’의 의미를 포함하지만, 여기서는 앞의 ‘음성’과 결합한 청종 거부를 한국어로 자연스럽게 드러내기 위해 이 표현을 택했습니다.
- source_word: הִנְּךָ
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제
  lexicon: הנה
  rationale: 경고를 강조하는 감탄사로서, 현대 한국어에서 자연스러운 주의 환기 표현인 ‘보십시오’를 사용했습니다.
- source_word: הָאַרְיֵה ... וַיַּכֵּהוּ
  english_pob_choice: the lion ... struck him down
  chosen_korean: 사자가 너를 쳐 죽일 것입니다 ... 사자가 그를 쳤습니다
  alternatives_korean:
  - 사자가 너를 공격할 것입니다 ... 사자가 그를 공격했습니다
  - 사자가 너를 죽일 것입니다 ... 사자가 그를 죽였습니다
  lexicon: אַרְיֵה
  rationale: 문맥상 야수의 치명적 공격을 나타내므로, ‘치다’의 폭력성을 살리되 결과를 분명히 하는 방식으로 옮겼습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 기본 용례를 따라 히브리어 신명사 יהוה를 ‘야훼’로 옮겨 원문 식별성과 주석 가능성을 보존했습니다.
  doctrine_reference: translation policy / source transparency
