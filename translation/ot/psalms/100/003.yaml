theological_decisions:
- issue: Ketiv/Qere reading in the middle colon
  chosen_reading: 'Main text follows the ketiv sense: ''He made us, and not we ourselves.'''
  alternative_readings:
  - 'Follow the qere/traditional reading: ''He made us, and we are his.'''
  rationale: 'Both alternatives are recorded within the Hebrew source: written לא (not) and read לו (to him), the
    latter yielding we are his. Original-language primacy cannot decide between them. The consulted Greek/Greek-based
    Latin controls have negation, while the Hebrew-based Latin control expresses belonging. The selected written
    form remains provisionally retained; contextual parallelism favors taking the belonging alternative seriously
    but does not establish historical priority.'
  doctrine_reference: Translation philosophy §§1, 3, 5
