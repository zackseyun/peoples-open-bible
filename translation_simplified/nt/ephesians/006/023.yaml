  rendering: May God the Father and the Lord Jesus the Messiah give peace ... and love together with faith
  claim: God the Father and Jesus are the source and implied givers of all the named blessings.
  evidence:
  - The POB rationale for ἀπό says that peace, love, and faith come from God the Father and Jesus.
  - The POB treats the noun phrase as an elliptical benedictory wish.
  confidence: high
  alternatives_preserved:
