  source_fidelity: 히브리어 הֶרֶף לָנוּ שִׁבְעַת יָמִים은 공격·압박을 칠 일 동안 멈추고 그들을 그대로 두라는 요청입니다. ‘칠 일 동안 우리를 그냥 두십시오’는 이를 적절히 반영합니다. מַלְאָכִים은 사람 전령이며, ‘우리를 구할 자가 없으면’과 ‘당신에게로 나가겠습니다’도 각각 구조자가 없을 경우 항복/출두하겠다는 조건문을 충실히 보존합니다.
  naturalness: ‘이스라엘 온 지경’은 전통 성경체로는 가능하지만, 요청된 현대 표준어 합쇼체에서는 ‘이스라엘의 모든 지역’이 더 자연스럽고 분명합니다. 또한 이동의 대상을 나타내는 ‘당신에게로’가 ‘당신에게’보다 자연스럽습니다.
  terminology: ‘야베스’, ‘장로들’, ‘전령들’, ‘구할 자’는 문맥과 현대 성경 번역어로 적절합니다. ‘구할 자’는 군사적 구출의 뜻을 유지하며 불필요하게 교리화하지 않습니다.
  issues:
