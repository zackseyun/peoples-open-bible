base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/025.yaml
  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: ko
  text: 그러자 갓 자손과 르우벤 자손이 모세에게 말했습니다. “당신의 종들은 내 주께서 명령하시는 대로 행하겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  english_pob_choice: the sons of Gad and the sons of Reuben
  chosen_korean: 갓의 자손들과 르우벤의 자손들
  alternatives_korean:
  - 갓 지파와 르우벤 지파
  - 갓의 아들들과 르우벤의 아들들
  lexicon: 고유명사/족칭
  rationale: 지파 소속을 드러내는 המקרא적 표현을 살리되, 한국어에서는 자연스러운 ‘자손들’로 옮겨 혈연적·집단적 의미를 함께 전달했습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: Your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 노예들
  - 당신의 종자들
  lexicon: δοῦλος / servants
  rationale: 이 문맥에서 자기비하적 예속 표현은 ‘종’이 가장 직접적이며, POB의 예속 뉘앙스를 과도하게 약화시키지 않습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주
  alternatives_korean:
  - 주님
  - 내 주인
  lexicon: 호칭어
  rationale: 모세에게 대한 공손한 호칭으로서 ‘내 주’가 원문의 존칭 관계를 가장 가깝게 반영합니다.
- source_word: מְצַוֶּה
  english_pob_choice: commands
  chosen_korean: 명령하시는
  alternatives_korean:
  - 시키시는
  - 분부하시는
  lexicon: 명령 동사
  rationale: ‘명령하다’는 강한 지시를 유지하며, 현재형 분사적 뉘앙스를 살려 ‘명령하시는’으로 옮겼습니다.
theological_decisions:
- issue: 모세에 대한 존칭과 예속 자기표현의 균형
  chosen_reading: 직접 화법 안에서 예속적 자기호칭과 존칭 호칭을 함께 살려, 정치적 복종 선언의 강도를 보존했습니다.
  alternative_readings:
  - 완화해 ‘저희는 하겠습니다’로 옮기는 방식
  - 교회식으로 ‘주님’으로 바꾸는 방식
  rationale: 본문은 단순한 순응이 아니라 공식적 복종 서약에 가깝기 때문에, 관계의 위계를 흐리지 않는 번역이 필요합니다.
  doctrine_reference: 서술적 역사 본문에서 화자-수신자 관계를 보존하는 원칙
