translation:
  text: They not only destroy gratitude among people but, inflated by the boasts of those who are strangers to goodness[a], suppose they will escape the judgment of God, who always sees everything and hates evil.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The difficult Greek description has also been understood as “those regarded as exceptionally good.”
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχαριστίαν
  chosen: gratitude
  alternatives:
  - thankfulness
  - thanks
  lexicon: LSJ
  rationale: The noun denotes thankfulness or gratitude. 'Gratitude' fits the abstract object of 'taking away' better than the more idiomatic but less literal 'thanks'.
- source_word: ἀνταναιροῦντες
  chosen: taking away
  alternatives:
  - removing
  - destroying
  lexicon: LSJ
  rationale: The participle conveys depriving or taking away. 'Taking away' preserves the concrete force without overcommitting to a more violent sense such as 'destroying'.
- source_word: κόμποις
  chosen: boasts
  alternatives:
  - vaunts
  - arrogant claims
  - pretensions
  lexicon: LSJ
  rationale: κόμπος can denote boastfulness or bombast. 'Boasts' is clear modern English and matches the context of arrogant self-exaltation.
- source_word: ἐπαρθέντες
  chosen: being puffed up
  alternatives:
  - being exalted
  - becoming arrogant
  lexicon: LSJ
  rationale: The passive participle here expresses being lifted up in pride. 'Being puffed up' captures the moral nuance of arrogance in readable English.
- source_word: ἀπεράγἀθων
  chosen: those who are exceedingly good
  alternatives:
  - the supremely good
  - the very noble
  lexicon: LSJ
  rationale: The transmitted form is unusual, but in context it points to people regarded as exceptionally good or noble. The translation keeps the comparative-intensifying sense without pretending the form is unproblematic.
- source_word: κατοπτεύοντος
  chosen: who always sees all things
  alternatives:
  - who watches over all things
  - who observes everything
  lexicon: LSJ
  rationale: The participle denotes observing or watching. 'Sees all things' is idiomatic and preserves the universal scope marked by τὰ πάντα and ἀεί.
- source_word: μισοπόνηρον
  chosen: hates evil
  alternatives:
  - hating wickedness
  - enemy of evil
  lexicon: LSJ
  rationale: The adjective literally means 'hating evil' or 'evil-hating.' Rendering it verbally in apposition to God produces natural English while preserving the theological force.
- source_word: δίκην
  chosen: judgment
  alternatives:
  - justice
  - penalty
  - punishment
  lexicon: LSJ
  rationale: In this context the sense is the judicial reckoning they think they can avoid. 'Judgment' is broad enough to include punitive force without narrowing prematurely to 'punishment'.
