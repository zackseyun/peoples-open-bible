  rendering: for they think the same way about us as they do about Him
  claim: Their denial concerning Christ also shapes their view of Ignatius and his fellow sufferers.
  evidence:
  - The clause follows references to Christ and to each believer’s suffering.
  - The comparison links their view of the believers with their denial of Him.
  confidence: high
  alternatives_preserved:
