base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/057/001.yaml
  text: Therefore, you who laid the foundation of the rebellion, submit yourselves to the elders and be disciplined unto repentance, bending the knees of your heart.
  footnotes:
  - marker: a
    text: Or 'uprising'.
    reason: previous_rendering
translation:
  language: en
  text: So then, you who started this rebellion,[a] submit to the elders and accept correction that leads to reorientation[b]. Humbly bend the knees of your hearts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “uprising.”
    reason: lexical_alternative
  - marker: b
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: laid the foundation of the rebellion
  simplified_phrase: started this rebellion
  preserved_meaning: They were responsible for beginning the illegitimate disruption.
  reasoning_layer_used: applied lexical revision and immediate context
  rationale: “Started” states their responsibility directly while retaining “rebellion” as the controlling choice.
- pob_phrase: bending the knees of your heart
  simplified_phrase: Humbly bend the knees of your hearts
  preserved_meaning: They must inwardly humble and yield themselves, as though kneeling.
  reasoning_layer_used: source-language image, POB translation, and grounding review
  rationale: “Humbly” explains the unfamiliar image while preserving its force.
interpretive_expansions:
- pob_phrase: bending the knees of your heart
  rendering: Humbly bend the knees of your hearts
  claim: The inward kneeling signifies humility and submission.
  evidence:
  - The heart locates the act inwardly while the kneeling image conveys humble submission.
  confidence: high
  alternatives_preserved:
  - The bodily image of bending the knees remains in the text.
translation_notes:
  risk_flags:
  - risk: The metaphor “knees of your hearts” may still sound unfamiliar.
    mitigation: The added word “Humbly” supplies its intended sense while retaining the source image.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
