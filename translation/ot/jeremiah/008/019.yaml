theological_decisions:
- issue: Rendering of the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Referent of 'her King' in Zion
  chosen_reading: Capitalized 'King' as referring to the LORD
  alternative_readings:
  - lowercase 'king' as a generic or royal representative
  rationale: The paired questions 'Is the LORD not in Zion? Is her King not in her?' present parallel references to Zion's divine ruler. Capitalization in English helps signal the theological referent without adding content beyond the context.
