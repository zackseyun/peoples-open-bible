  text: For I have heard the slander of many—terror on every side!—as they conspired together against me, plotting to take my life.
translation:
  language: ko
  text: 이는 제가 많은 사람의 수군거림을 들었기 때문입니다[a]. “사방에 공포가 있다!” 그들이 함께 저를 대적하여 모의할 때에, 제 목숨을 빼앗으려고 꾀하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 사람의 비방’ 또는 ‘많은 사람의 헐뜯는 말’. 히브리어는 수군거림, 소문, 또는 명예를 훼손하는 말을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכַּחְתִּי
  english_pob_choice: I am forgotten
  chosen_korean: 나는 잊혀졌습니다
  alternatives_korean:
  - 나는 잊혔습니다
  - 나는 완전히 잊혀졌습니다
  lexicon: HALOT
  rationale: 니팔 완료 1인칭 단수는 ‘잊혀진 상태’의 결과를 나타내므로, 현대 한국어에서는 ‘잊혀졌습니다’가 시적이면서도 자연스럽습니다.
- source_word: כְּמֵת
  english_pob_choice: like a dead man
  chosen_korean: 죽은 사람처럼
  alternatives_korean:
  - 죽은 자처럼
  - 죽은 사람같이
  lexicon: HALOT
  rationale: 비교 표지 כְּ를 살려 ‘처럼’으로 옮기고, מֵת의 단수 인격 이미지를 반영해 ‘죽은 사람’을 택했습니다.
- source_word: מִלֵּב
  english_pob_choice: out of mind
  chosen_korean: 마음에서 사라진 사람처럼
  alternatives_korean:
  - 마음에서 벗어난 듯
  - 기억에서 사라진
  lexicon: HALOT
  rationale: 직역하면 ‘마음에서’이지만, 히브리 관용구가 ‘더는 기억되지 않음’을 뜻하므로 한국어에서는 그 의미를 드러내는 방향으로 풀었습니다.
- source_word: כִּכְלִי אֹבֵד
  english_pob_choice: like a vessel that is lost
  chosen_korean: 쓸모없는 그릇처럼
  alternatives_korean:
  - 잃어버린 그릇처럼
  - 망가진 그릇처럼
  - 버려진 그릇처럼
  lexicon: HALOT
  rationale: כְּלִי는 넓게 ‘그릇/도구’이며, אֹבֵד는 ‘잃은, 망한, 사라진’의 의미가 있어, 물건의 폐기·무용성을 드러내는 ‘쓸모없는 그릇’이 시적 문맥에 맞습니다.
theological_decisions:
- issue: ‘마음에서’라는 히브리 관용구의 처리
  chosen_reading: 직역을 그대로 두지 않고 ‘마음에서 사라진’으로 의미를 풀었습니다.
  alternative_readings:
  - ‘마음에서’
  - ‘기억에서’
  rationale: 이 표현은 한국어 독자에게는 문자 그대로보다 ‘기억되지 않음’의 뜻이 더 정확히 전달되므로, 시적 흐름을 해치지 않는 범위에서 관용적 의미를 살렸습니다.
  doctrine_reference: 시편의 탄식 시는 정서적 실상을 선명히 드러내는 것이 중요하므로, 관용구의 의미를 보존하는 번역 원칙을 따릅니다.
