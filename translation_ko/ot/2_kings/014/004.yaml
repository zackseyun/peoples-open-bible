  text: 그러나<a> 산당은 제거되지 않았습니다<b>. 백성은 여전히 산당에서 제사를 드리고 분향하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제의소들’. 히브리어는 흔히 높은 곳에 있는 지역 제의 장소를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘산당에서’.
    reason: lexical_alternative
