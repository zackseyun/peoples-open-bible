revisions:
- from: 예수께서 그녀에게 말씀하셨다[a]. “내 말을 믿으십시오, 여자[b]. 때가 오나니 이 산에서도 예루살렘에서도 아버지께 예배하지 아니할 때가 오리다.”
  to: 예수께서 그 여자에게 말씀하셨습니다. “여인이여, 내 말을 믿으십시오[a]. 이 산에서도 예루살렘에서도 아버지께 예배하지 않을 때가 옵니다[b].”
  rationale: 현대 표준어 합쇼체로 종결을 통일했습니다. γύναι의 문자적 형태와 당시의 공손한 화용론 사이의 긴장을, 본문의 ‘여인이여’와 각주로 처리했습니다. ἔρχεται ὥρα의 비정관적이고 함축적인 표현은 ‘… 않을 때가 옵니다’로 유지하되, 원문에 없는 ‘때’의 반복은 제거했습니다. 장소의 대조, 미래 시제, ‘아버지’에 대한 예배라는 핵심 의미는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:21:57Z'
