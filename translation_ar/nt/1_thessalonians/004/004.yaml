  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: ar
  text: أن يعرف كلُّ واحد منكم كيف يقتني إناءه الخاص في قداسة وكرامة.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«إناءه»: قد يُراد بها جسده، وقد تُفهم على أنها زوجته؛ والفعل المترجم «يقتني» يمكن أن يحمل معنى الاقتناء أو الامتلاك.'
    reason: لإظهار الغموض المعجمي والتفسيري الحقيقي في σκεῦος وκτᾶσθαι من غير حسمه مذهبيًا في المتن.
lexical_decisions:
- source_word: εἰδέναι
  choice: أن يعرف ... كيف
  rationale: يحافظ على معنى المعرفة العملية أو الدراية بكيفية الفعل، ويتصل نحويًا بسياق الآية السابقة.
- source_word: σκεῦος
  choice: إناءه
  rationale: ترجمة مباشرة للصورة المجازية في الأصل، من غير حسم المقصود المختلف عليه بأنه الجسد أو الزوجة.
- source_word: κτᾶσθαι
  choice: يقتني
  rationale: يعكس معنى الاكتساب أو الاقتناء في صيغة الفعل، بدل حصره في معنى السيطرة أو مجرد الامتلاك.
- source_word: ἁγιασμῷ καὶ τιμῇ
  choice: في قداسة وكرامة
  rationale: صياغة قريبة من الأصل تحفظ الاسمين ومعناهما الأخلاقي.
theological_decisions:
- issue: مدلول «الإناء» في العبارة
  choice: الإبقاء على المجاز «إناءه» مع بيان الاحتمالات في الحاشية
  alternative: تفسيره داخل المتن بـ«جسده» أو «زوجته»
  rationale: اللفظة اليونانية مجازية وموضع خلاف تفسيري حقيقي؛ وحسمها في المتن يزيل غموضًا أصيلًا.
- issue: دلالة κτᾶσθαι
  choice: «يقتني»
  alternative: «يمتلك» أو «يضبط»
  rationale: الفعل قد يدل على الاكتساب أو الاقتناء، كما يمكن في بعض السياقات فهمه بمعنى الامتلاك؛ واختيار «يقتني» يوافق الصيغة الفعلية والمراجعة المعتمدة من دون إدخال تفسير «ضبط الجسد» في المتن.
translation_notes:
  register: عربية فصحى واضحة ورصينة، مع التزام قريب ببنية الأصل والحفاظ على مجازه وغموضه المقصودين.
