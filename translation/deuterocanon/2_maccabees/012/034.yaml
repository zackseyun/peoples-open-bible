lexical_decisions:
- source_word: παραταξαμένους
  lemma: παρατάσσω
  chosen: when they had joined battle
  alternatives:
  - when they had drawn up in battle line
  - when they had engaged in battle
  lexicon: LSJ
  rationale: Aorist middle participle from παρατάσσω, used in military contexts for drawing up for battle or engaging in combat. In English, 'joined battle' preserves the military sense naturally without over-literal awkwardness. The participle is rendered temporally with 'when' to fit idiomatic English narrative flow.
- source_word: συνέβη
  chosen: it happened
  alternatives:
  - it came to pass
  - it occurred
  lexicon: LSJ
  rationale: Common narrative verb indicating an event came about. 'It happened' is straightforward modern English and preserves the impersonal construction.
- source_word: πεσεῖν
  chosen: fell
  alternatives:
  - to fall
  - were killed
  lexicon: LSJ
  rationale: Infinitive of πίπτω, literally 'to fall.' In battle narrative it can imply death, but the Greek here does not explicitly say 'were killed.' 'Fell' preserves the idiom and leaves the degree of implication at the same level as the source.
- source_word: ὀλίγους
  chosen: a few
  alternatives:
  - few
  - a small number
  lexicon: LSJ
  rationale: Accusative plural adjective functioning substantivally with the genitive phrase. 'A few' is the most natural English equivalent in this construction.
- source_word: τῶν Ἰουδαίων
  chosen: of the Jews
  alternatives:
  - among the Jews
  - of the Judeans
  lexicon: LSJ
  rationale: The genitive after ὀλίγους yields 'a few of the Jews.' 'Jews' is the standard rendering in 2 Maccabees; 'Judeans' is possible ethnogeographically, but here the conventional ethnic-religious sense is adequately represented by 'Jews.'
