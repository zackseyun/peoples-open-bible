  source_fidelity: 현 초안은 제시된 히브리어 본문(시편 22:21)이 아니라 바로 앞 절의 히브리어 본문(칼, 개, 나의 유일한 것)을 번역합니다. 따라서 사자, 들소, 그리고 완료형 ‘주께서 내게 응답하셨습니다’가 모두 누락되어 원문 충실성에 중대한 문제가 있습니다.
  naturalness: 현 초안 자체의 합쇼체 청원 표현은 대체로 자연스럽지만, 해당 절의 번역이 아니므로 사용할 수 없습니다. 수정안은 청원에서 응답의 확언으로 급전하는 히브리어의 시적 단절을 대시로 보존하고, 현대 표준 한국어 합쇼체를 사용합니다.
  terminology: אַרְיֵה는 ‘사자’, רֵמִים는 접근성 있는 현대어로 ‘들소들’로 옮깁니다. עֲנִיתָנִי는 완료형을 존중하여 ‘주께서 내게 응답하셨습니다’로 번역합니다. 하나님의 행위를 가리키는 문맥상 한국어 존대 표현 ‘주께서 …하셨습니다’를 사용합니다.
