revisions:
- from: 그가 저를 건강하게 당신에게로 돌아오게 했고, 제 아내를 고쳐 주었으며, 제 돈도 다시 가져다주었고, 당신도 그와 같이 고쳐 주었습니다.[a]
  to: 그가 저를 건강한 몸으로[a] 아버지께 데려다주었고, 제 아내를 치유해 주었으며, 제 돈을 가져다주었고, 아버지도 마찬가지로 치유해 주었습니다.
  rationale: 원문의 동사 병렬과 치유의 반복을 유지하면서, 원문에 명시되지 않은 ‘다시’를 제거했습니다. 또한 부자연스러운 2인칭 대명사를 문맥상 명확한 ‘아버지’로 바꾸고, ὑγιῆ 관련 각주를 해당 어구에 붙여 중립적으로 설명했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:55:03Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 네 동사(‘건강한 상태로 데려오다/인도하다’, ‘치유하다’, ‘돈을 가져오다’, ‘마찬가지로 치유하다’)와 병렬 구조는 대체로 충실히 반영되었습니다. 다만 ἤνεγκεν은 ‘다시’라는 접두 의미를 명시하지 않으므로, 문맥상 회수를 암시할 수 있어도 본문에서는 이를 보태지 않는 편이 더 정확합니다.
  naturalness: ‘당신에게로’는 이 문맥에서 아들이 아버지에게 말하는 한국어로 다소 어색하고 호칭·경어 관계도 불분명합니다. 문맥상 명백한 수신자인 아버지를 밝혀 ‘아버지께’로 옮기면 현대 한국어 합쇼체에서 자연스럽습니다. ‘고쳐 주었습니다’도 자연스럽지만, 같은 동사의 반복을 더 투명하게 유지하려면 ‘치유해 주었습니다’가 적절합니다.
  terminology: ὑγιῆ는 ‘건강한 몸으로’로, θεραπεύω는 ‘치유해 주었습니다’로 일관되게 옮겼습니다. ἀργύριον은 여기서 ‘돈’으로 충분하며, ‘다시’는 원문에 명시되지 않아 제외했습니다. ‘아버지’는 σοι의 어휘적 번역이 아니라 대화 문맥상 수신자를 자연스럽게 드러내는 호칭입니다.
  issues:
  - severity: medium
    issue: ‘제 돈도 다시 가져다주었고’의 ‘다시’
    rationale: 그리스어 ἤνεγκεν은 ‘가져왔다’이며, ‘다시/되돌려’는 동사 자체에 명시되어 있지 않습니다. 앞 문맥과 영어 감사 기록에는 brought back이 있으나, 원문 우선 원칙상 본문에서 명시적 반환 부사는 피하는 것이 안전합니다.
  - severity: low
    issue: ‘당신에게로’라는 호칭
    rationale: 화자는 아들 토비야이고 수신자는 아버지 토빗입니다. 한국어에서 아버지에게 ‘당신’이라고 부르는 것은 부자연스럽고 경어 관계를 흐립니다. ‘아버지께’는 문맥을 명료하게 하는 안전한 보완입니다.
  - severity: low
    issue: 각주 표지 위치와 각주 내용
    rationale: 각주가 설명하는 ὑγιῆ는 ‘건강하게’에 해당하므로 절 끝이 아니라 해당 어구 뒤에 붙여야 합니다. 또한 ‘안전보다 … 강조한다’는 표현은 어휘 의미를 지나치게 대비하므로, 상태를 나타낸다는 중립적 설명으로 다듬는 편이 좋습니다.
  revised_text: 그가 저를 건강한 몸으로[a] 아버지께 데려다주었고, 제 아내를 치유해 주었으며, 제 돈을 가져다주었고, 아버지도 마찬가지로 치유해 주었습니다.
  revised_footnotes:
