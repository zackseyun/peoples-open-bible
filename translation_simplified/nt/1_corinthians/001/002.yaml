  review_summary: 'The draft usefully explains “sanctified” and “saints” as “made holy” and “holy people,” preserving God’s action and the community’s holy calling. However, it overstates one possible syntactic construal by declaring that the letter is “also addressed” to all who call on the Lord. The replacement keeps the inclusive relation without converting it into a separate direct-address claim, while making the idiom of calling on the name more immediately understandable. Footnote a should read: “Or, ‘called saints’ or ‘called holy ones’; traditionally, ‘called to be saints.’” Footnote b may be retained unchanged.'
