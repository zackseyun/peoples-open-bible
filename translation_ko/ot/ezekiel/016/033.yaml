  - severity: medium
    issue: ‘네 음행 때문에’가 전치사구의 의미를 원인으로 한정합니다.
    rationale: בְּתַזְנוּתָיִךְ는 여기서 그들이 네게 오는 음행의 목적·관련을 나타내므로, ‘네 음행을 하려고’가 문맥을 더 정확히 드러냅니다.
  - severity: low
    issue: ‘사례금’의 현대적 의미가 다소 어긋납니다.
    rationale: ‘사례금’은 감사의 금품으로도 널리 쓰입니다. 성매매에 지급되는 보상이라는 문맥에는 ‘대가’가 더 자연스럽고 명확합니다.
