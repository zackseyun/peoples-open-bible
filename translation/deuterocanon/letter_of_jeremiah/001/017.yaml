reference: Letter of Jeremiah 1:17
source:
  edition: lxx-swete-1909
  text: καὶ ὥσπερ τινὶ ἠδικηκότι βασιλέα περιτετράχηλαι εἰσὶν αἱ αὐλαί, ὡς ἐπὶ θάνατον ἀπηγμένῳ, τοὺς οἴκους αὐτῶν ὀχυροῦσιν οἱ ἱερεῖς θυρώμασιν τε καὶ κλείθροις καὶ μοχλοῖς, ὅπως ὑπὸ τῶν λῃστῶν μὴ συληθῶσι.
