source:
  edition: WLC
  text: וְ/נִתַּ֣ן הַ/סֵּ֗פֶר עַל֩ אֲשֶׁ֨ר לֹֽא יָדַ֥ע סֵ֛פֶר לֵ/אמֹ֖ר קְרָ֣א נָא זֶ֑ה וְ/אָמַ֕ר לֹ֥א יָדַ֖עְתִּי סֵֽפֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/012.yaml
  text: And the book is given to one who does not know writing, saying, “Please read this,” and he says, “I do not know writing.”
translation:
  language: ko
  text: 그리고 그 책은 글을 모르는[a] 사람에게 주어지고, 「부디 이것을 읽어 보십시오」라고 하면, 그는 「저는 글을 모릅니다[b]」라고 대답합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘책을 알지 못하는’이라는 표현은 여기서 책 자체에 대한 지식이 아니라 글을 읽고 쓰는 능력, 곧 문해 능력이 없음을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 앞의 상태 진술과 이 응답에서 모두 ‘알다’와 ‘책’이라는 표현을 결합하여, 문해 능력이 없음을 되풀이합니다.
    reason: source_note
lexical_decisions:
- source_word: הַסֵּפֶר / book
  english_pob_choice: the book
  chosen_korean: 그 책
  alternatives_korean:
  - 책
  - 그 서책
  lexicon: סֵפֶר
  rationale: 히브리어 הַסֵּפֶר은 특정된 책을 가리키므로 관사성을 살려 ‘그 책’으로 옮겼습니다.
- source_word: לֹא יָדַע סֵפֶר
  english_pob_choice: does not know writing
  chosen_korean: 글을 모르는
  alternatives_korean:
  - 읽을 줄 모르는
  - 글자를 모르는
  lexicon: ידע + ספר
  rationale: 영문 POB가 ‘writing’으로 고정한 점을 따라, 문해 능력 전체를 가리키는 표현으로 ‘글을 모르는’을 택했습니다.
- source_word: קְרָא נָא זֶה
  english_pob_choice: Please read this
  chosen_korean: 제발 이것을 읽어 보십시오
  alternatives_korean:
  - 부디 이것을 읽어 주십시오
  - 이것을 읽어 보세요
  lexicon: קרא + נא + זה
  rationale: נא의 간청을 살리되, 공손한 명령형으로 자연스럽게 옮겼습니다.
- source_word: לֹא יָדַעְתִּי סֵפֶר
  english_pob_choice: I do not know writing
  chosen_korean: 나는 글을 모릅니다
  alternatives_korean:
  - 나는 글을 모릅니다
  - 나는 읽을 줄 모릅니다
  lexicon: ידע + ספר
  rationale: 앞부분과 동일하게 ‘글’을 유지해 반복되는 어구의 대응을 분명히 했습니다.
theological_decisions:
- issue: 문해 능력의 부재를 어떻게 표현할 것인가
  chosen_reading: ‘글을 모르는’ / ‘나는 글을 모릅니다’로 번역해, 단순한 읽기 기술보다 더 넓은 문해의 결핍을 드러냈습니다.
  alternative_readings:
  - ‘읽을 줄 모르는’로 제한하는 번역
  - ‘글자를 모르는’으로 축소하는 번역
  rationale: 원문의 סֵפֶר과 영문 POB의 ‘writing’은 문자 해독을 포함한 문해 능력 전체를 가리키는 방향이므로, 이를 좁혀서 ‘읽기’만으로 환원하지 않았습니다.
  doctrine_reference: 문해/지혜 대조라는 본문 맥락
