base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/049.yaml
  text: Jesus said[a], "Blessed are the solitary and chosen, for you will find the kingdom. For you are from it[b][c], and you will go there again."
translation:
  language: pt
  text: 'Jesus disse: “Felizes os solitários[a] e os escolhidos, pois vocês encontrarão o reino[c]. Pois vocês são provenientes dele[b] e para lá irão novamente.”


    [a] Aqui, “solitários” traduz o empréstimo grego μοναχός (monachos), que pode indicar pessoas “sós” ou “indivisas” em sentido espiritual; não tem necessariamente o sentido institucional posterior de “monges”.


    [b] Literalmente, “vocês são os que vêm de dentro dele” (isto é, “os que procedem dele”).


    [c] Depois do verbo “encontrar”, o copta emprega aqui a preposição ⲁ (a), em vez da forma saarídica padrão ⲉ (e), uma característica dialetal encontrada neste manuscrito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “solitários” traduz o empréstimo grego μοναχός (monachos), que pode indicar pessoas “sós” ou “indivisas” em sentido espiritual; não tem necessariamente o sentido institucional posterior de “monges”.
    reason: Registra a amplitude semântica de ⲙⲟⲛⲁⲭⲟⲥ e evita uma leitura institucional anacrônica.
  - marker: b
    text: Literalmente, “vocês são os que vêm de dentro dele” (isto é, “os que procedem dele”).
    reason: Explicita a construção copta de procedência, incluindo o matiz de saída/origem de ⲉⲃⲟⲗ, sem forçar essa forma literal no texto principal.
  - marker: c
    text: Depois do verbo “encontrar”, o copta emprega aqui a preposição ⲁ (a), em vez da forma saarídica padrão ⲉ (e), uma característica dialetal encontrada neste manuscrito.
    reason: Documenta a variante dialetal do manuscrito sem reproduzir em português uma irregularidade que não altera o sentido.
lexical_decisions:
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  choice: solitários
  rationale: Preserva a ideia primitiva de pessoas sós ou interiormente indivisas sem introduzir o sentido institucional posterior de “monges”; a nota mantém aberta a extensão semântica.
- source_word: ⲥⲟⲧⲡ
  choice: escolhidos
  rationale: A forma é passiva ou estativa, “os que foram escolhidos/eleitos”, e não ativa, “os que escolheram”.
- source_word: ϩⲉ
  choice: encontrarão
  rationale: É o sentido corrente do verbo neste complemento; a preposição incomum do manuscrito é explicada em nota como variante dialetal.
- source_word: ⲙⲛⲧⲉⲣⲟ
  choice: reino
  rationale: Equivalente tradicional e natural que preserva a linguagem régia do texto sem restringi-la a “governo” ou “soberania”.
- source_word: ⲟⲩⲉⲃⲟⲗ ⲛϩⲏⲧⲛⲧⲟⲥ
  choice: vocês vêm dele
  rationale: Expressa em português natural a origem indicada pela construção copta, enquanto a nota registra sua formulação mais literal.
- source_word: ⲡⲁⲗⲓⲛ
  choice: voltarão
  rationale: O verbo português “voltar” incorpora naturalmente a noção de ir novamente ao lugar de origem.
theological_decisions:
- issue: Sentido de ⲙⲟⲛⲁⲭⲟⲥ
  choice: solitários
  alternative: monges; unos; os que estão sós
  rationale: “Monges” pode projetar sobre o texto uma instituição posterior, enquanto “solitários” conserva a leitura concreta e permite, por meio da nota, a possível dimensão espiritual de inteireza ou indivisão.
- issue: Voz de ⲥⲟⲧⲡ
  choice: escolhidos
  alternative: os que escolheram; eleitos
  rationale: A construção copta é passiva/estativa e plural. “Escolhidos” evita transformar os destinatários em agentes da escolha e não acrescenta conotações doutrinárias além do texto.
- issue: Natureza do reino
  choice: reino
  alternative: reinado; soberania
  rationale: Mantém o termo sem decidir se ele designa lugar, domínio ou realidade espiritual. As expressões de origem e retorno permanecem intactas.
- issue: Relação de origem e retorno
  choice: vocês vêm dele e voltarão para lá
  alternative: vocês são provenientes dele e irão para lá novamente
  rationale: A formulação natural preserva tanto a procedência quanto o retorno, sem explicar teologicamente de que maneira os destinatários vêm do reino.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural de segunda pessoa e sintaxe direta. A tradução segue a leitura plural do manuscrito — “felizes ... solitários e escolhidos” — apesar da normalização automática singular fornecida. “Reino” permanece em minúscula por ser substantivo comum no original e para não impor uma convenção editorial teológica.
