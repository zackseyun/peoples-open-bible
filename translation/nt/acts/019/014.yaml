id: ACT.19.14
reference: Acts 19:14
source:
  edition: SBLGNT
  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
translation:
  text: Seven sons of a Jewish chief priest[a] named Sceva were doing this.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “high priest.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  chosen: There were
  alternatives:
  - And there were
  - But there were
  - Now there were
  lexicon: BDAG
  rationale: 'Renders the imperfect of εἰμί with δέ as scene-setting narrative continuation. ''Now'' gives natural English discourse flow without overstating contrast. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: τινος Σκευᾶ
  chosen: of a ... named Sceva
  alternatives:
  - of a certain Sceva
  - of someone named Sceva
  lexicon: BDAG
  rationale: The genitive τινος with the proper name introduces an otherwise unspecified individual. English idiom is smoother with 'named Sceva' rather than the more wooden 'a certain Sceva,' while preserving the indefiniteness with 'a.'
- source_word: Ἰουδαίου
  chosen: Jewish
  alternatives:
  - Judean
  lexicon: BDAG
  rationale: In Acts, Ἰουδαῖος commonly denotes ethnic-religious identity rather than strictly geographic origin. 'Jewish' best fits the context here.
- source_word: ἀρχιερέως
  chosen: chief priest
  alternatives:
  - high priest
  lexicon: BDAG
  rationale: ἀρχιερεύς can mean 'high priest' or more broadly a member of the high-priestly class/chief priest. Since Sceva is not otherwise known as the Jerusalem high priest, 'chief priest' avoids implying he held the singular official office while still reflecting the Greek term.
- source_word: ἑπτὰ υἱοὶ
  chosen: seven sons
  lexicon: BDAG
  rationale: Straightforward rendering of the numeral plus noun; preserves the familial designation in natural English order.
- source_word: τοῦτο ποιοῦντες
  chosen: doing this
  alternatives:
  - practicing this
  - doing these things
  lexicon: BDAG
  rationale: The present participle describes their ongoing action in the immediately preceding context. 'Doing this' is the most direct and idiomatic rendering of the singular demonstrative τοῦτο.
