translation:
  text: In those days the Lord said, “They will call and announce to the children of the earth through their wisdom.
    Show them that you are their guides, and show them a reward over the whole earth.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected edition shifts from third-person plural “they will call” and “make hear” to the plural command
      “show them.” The final “reward” phrase is compressed. This rendering understands it as another object of “show
      them,” supplying that verb a second time in English; the Ge’ez does not repeat it. Another possible attachment
      would link reward with the description of the addressees, but that is not stated as certain.
    reason: lexical_alternative
