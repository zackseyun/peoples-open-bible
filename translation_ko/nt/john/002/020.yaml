- from: 그러자 유대인들이[a] 말하였습니다. 「이 성전은 사십육 년 동안에 지어졌는데, 너는 삼일 만에 그것을 일으키겠느냐[b]?」
  to: 그러자 유대인들이[a] 말하였습니다. 「이 성전은 사십육 년에 걸쳐 지어졌는데, 당신이 삼 일 만에 그것을 일으키겠습니까[b]?」
  rationale: 문체 기준에 맞추어 직접 인용문을 합쇼체로 고치고, 강조된 2인칭 대명사는 「당신이」로 보존했습니다. 건축 기간은 현대적으로 자연스러우면서 원문의 기간 여격과 수동 동사를 반영하도록 「사십육 년에 걸쳐 지어졌는데」로 다듬었습니다. 각주 b의 시제 불일치를 바로잡되, 건축적 의미와 부활 연관의 중의성은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:47:31Z'
review_pass:
  verdict: revise
  source_fidelity: 본문은 전반적으로 원문을 충실히 반영합니다. 다만 직접 인용문의 종결형 「…겠느냐」와 2인칭 「너는」은 요청된 현대 정중체(합쇼체)와 일치하지 않습니다. 「당신이 … 일으키겠습니까?」로 고치면 σὺ의 강조와 수사적 의문을 유지하면서 문체 기준을 충족합니다. 「사십육 년에 걸쳐 지어졌는데」는 ἔτεσιν οἰκοδομήθη의 건축 기간과 수동 표현을 자연스럽게 보존합니다.
  naturalness: 「사십육 년 동안에」도 이해되지만, 현대 표준어에서는 「사십육 년에 걸쳐」가 건축에 소요된 기간을 더 자연스럽게 나타냅니다. 「삼 일」은 의존 명사 단위 표기에 따라 띄어 씁니다. 직접 화법도 합쇼체로 통일하는 것이 대상 변종에 적합합니다.
  terminology: 「성전」은 ναός에 적절하며, 「유대인들」은 οἱ Ἰουδαῖοι의 직접적 표현을 보존합니다. 각주에서 가능한 「유다인들」과 요한복음 내 문맥적 지시 범위를 밝히는 방식도 적절합니다. ἐγερεῖς는 「일으키다」로 유지하여 건축적 오해와 뒤이은 부활 연관을 미리 해소하지 않습니다. 다만 기존 b 각주의 「다시 지었을 것이다」는 본문 동사의 미래 의문문과 맞지 않으므로 삭제·정정해야 합니다.
  issues:
  - severity: medium
    issue: 직접 인용문이 비격식 해라체(「너는 … 일으키겠느냐」)이다.
    rationale: 번역의 명시된 목표 문체가 현대 공식-정중체(합쇼체)이므로, 서술문뿐 아니라 인용된 발화도 「…겠습니까?」로 통일하는 것이 필요합니다.
  - severity: low
    issue: b 각주의 대안 표현 「다시 지었을 것이다」가 시제와 문장 유형에 맞지 않는다.
    rationale: ἐγερεῖς는 미래 능동 직설법이며 본문은 의문문입니다. 대안은 「재건하겠습니까」 또는 「다시 세우겠습니까」처럼 제시해야 합니다.
