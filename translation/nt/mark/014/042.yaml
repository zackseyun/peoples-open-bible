  rationale: In Mark's passion narrative, παραδίδωμι can be rendered more literally as 'hand over,' but here the referent is Judas and the relational/moral force of betrayal is contextually prominent. 'Betraying' communicates the narrative sense without adding doctrinal interpretation beyond the scene itself.
