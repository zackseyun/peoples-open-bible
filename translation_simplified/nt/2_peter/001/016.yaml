  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  edition: POB
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus Christ by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
  footnotes:
  - marker: a
    text: Or 'presence' (or 'arrival') of our Lord Jesus the Messiah.' The Greek παρουσία can denote presence, arrival, or, in many New Testament contexts, the Messiah's coming.
    reason: alternative_reading
  - marker: b
    text: Greek 'Christ'; translated 'Messiah' here because Χριστός functions as a title.
    reason: lexical_alternative
