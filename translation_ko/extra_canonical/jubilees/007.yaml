revisions:
- from: '1[a]. 그리고 일곱째 주, 즉 첫 해 곧 이 희년에 노아가 방주가 멈췄던 산에 포도나무를 심었으니 그 산의 이름은 아라랏 산 중 하나인 루발이더라. 그리고 넷째 해에 열매를 맺었습니다.

    2. 그는 그 열매를 지켜 그 해 일곱째 달에 거두니라. 그리고 그것으로 포도주를 만들어 그릇에 담아 다섯째 해 첫째 달 첫째 날까지 보관했습니다.

    3. 그 날에 그는 기쁨으로 잔치를 베풀고 주님께 번제를 드렸으니 곧 어린 소 한 마리와 숫양 한 마리와 양 일곱 마리와 염소 새끼 한 마리였습니다.

    4. 그리고 그는 먼저 염소 새끼를 준비하고, 그 피 얼마를 자기가 만든 제단 위에 있는 고기에 발랐습니다. 그리고 모든 기름은 그가 번제를 드리는 제단 위에 올려 놓았고, 소와 숫양과 양도 가져왔습니다.

    5. 그리고 그는 그들의 모든 고기를 제단 위에 올려 놓고, 그들이 바친 모든 제물을 기름에 섞어 그 위에 올려 놓았습니다. 그런 다음 제단 위의 불에 포도주를 붓고, 제단 위에 유향을 놓아, 그 하나님 주님께서 기뻐하시는 향기가 올라가게 했습니다.

    6. 그와 그의 아들들은 기뻐하며 이 포도주를 마셨다. 저녁이 되매 그가 자기 천막에 들어가 술에 취하여 누워 자고 그 천막 안에서 잠을 자는 동안에 이불을 벗은지라.

    7. 함이 그의 아버지 노아의 벌거벗은 것을 보고 밖으로 나가서 밖에 있는 그의 두 형제에게 알렸더라.

    8. 셈이 옷을 취하니 그와 야벳이 그것을 취하여 자기들의 어깨에 메고 뒤로 돌아가서 그 아버지의 수치를 가리우고 얼굴을 돌이켰더라.

    9. 노아가 술이 깨어 그 작은 아들이 자기에게 행한 모든 일을 알고 그 아들을 저주하여 이르되 가나안은 저주를 받아 그 형제의 종이 되리라 하였더라

    10. 그가 셈을 축복하여 이르되 셈의 하나님 주님를 찬송하리로다 가나안은 셈의 종이 되게 하시고

    11. 주님께서 야벳을 창대케 하시고 주님께서 셈의 장막에 거하시기를 원하노라 가나안은 그의 종이 되게 하라.”

    12. 그리고 함은 그의 아버지가 그의 막내아들을 저주했다는 것을 알았고, 그가 그의 아들을 저주한 것을 불쾌하게 여겼습니다. 그와 그의 아들들 곧 구스와 미스라임과 붓과 가나안이 그 아버지와 헤어졌느니라.

    13. 그리고 그는 자신을 위해 도시를 건설하고 그의 아내의 이름을 따라 그 도시의 이름을 네엘라타마룩이라 불렀습니다.

    14. 야벳은 그것을 보고 자기 형을 시기하여 자기를 위하여 성을 쌓고 자기 아내의 이름을 따라 그 이름을 아다다네스라 불렀더라.

    15. 셈은 그의 아버지 노아와 함께 머물렀고 그의 아버지 근처 산 곁에 성을 건설하고 그 아내의 이름을 따라 그 성 이름을 세데게텔레밥이라 불렀느니라.

    16. 그리고 보라, 이 세 도시는 루바르 산 근처에 있다. 산 앞의 동쪽은 세데케텔레밥이고, 북쪽은 네엘라타마우크이고, 바다는 아다타네스이다.

    17. 셈의 아들들은 이러하니 엘람과 앗수르와 아르박삿이니 이 세대는 홍수 후에 이년에 났고 또 룻과 아람이니라

    18. 야벳의 아들들은 고멜과 마곡과 마대와 야완과 두발과 메섹과 디라스였습니다.

    19. 이들은 노아의 아들들이다. 그리고 제이십팔 희년이 되자 노아는 자기 손자들에게 율례와 계명과 자기가 아는 모든 법도를 명령하기 시작하였다. 그리고 그는 그의 아들들에게 그들이 의를 행하고, 그들의 육체의 부끄러움을 가리고, 그들의 창조주를 찬송하고 아버지와 어머니를 공경하며, 각각 자기 이웃을 사랑하고 음행과 더러움과 모든 불의에서 자신을 지켜야 한다고 증거했습니다.

    20. 이 세 사람 때문에 땅에 홍수가 났습니다. 감시자들이 사람의 딸들을 따라 자기들의 율례를 거스르고 음행을 행하여 자기들이 택한 모든 사람 중에서 아내를 삼아 더러움이 시작되었기 때문입니다.

    21. 그들은 나비딤을 낳았으며, 그들은 모두 서로 다르며, 서로 잡아먹었습니다. 거인은 나필을 죽였고, 나필은 엘리오 족과 엘리오 인류와 그의 이웃 한 사람을 죽였습니다.

    22. 그리고 모든 사람은 불의를 행하고 많은 피를 흘리려고 자기 자신을 팔았습니다.

    23. 그리고 땅은 불의로 가득 차 있었습니다. 그 후에 그들이 짐승과 새와 움직이는 모든 것과 땅에 기는 모든 것에 대하여 죄를 범하여 많은 피가 땅에 흘렸느니라.

    24. 사람의 모든 생각과 욕망은 항상 헛되고 악한 것을 상상합니다. 그리고 주님께서는 그들의 행위가 악하고 그들이 땅 가운데 쏟은 피 때문에 지면에서 모든 것을 멸하셨습니다. 그는 모든 것을 파괴했습니다.

    25. 그리고 나와 너, 내 아들들, 그리고 우리와 함께 방주로 들어간 모든 사람만 남았다. 보라, 내가 내 앞에 네 행위를 보오니 네가 의롭게 행하지 아니하는도다. 내 아들들아, 너희가 멸망의 길로 걷기 시작하여 서로 분리하며 서로 시기하여 연합하지 못하였느니라.

    26. 내가 보니, 보라, 귀신들이 너희와 너희 자녀를 잘못된 길로 인도하기 시작하였느니라. 이제 나는 너희를 두려워하노니 내가 죽은 후에 너희가 사람의 피를 땅에 흘리고 너희도 지면에서 멸망될까 두려워하노라.

    27. 사람의 피를 흘리는 사람과 모든 육체의 피를 먹는 사람은 모두 땅에서 멸망될 것입니다. 그리고 피를 먹는 사람이나 사람의 피를 땅에 흘린 사람은 하나도 남지 않을 것입니다. 하늘 아래 그에게는 자손이나 후손이 남아 있지 않을 것입니다. 그들은 음부(히브리어: Sheol)에 들어가고 심판의 장소로 내려가며 깊은 어두움에 모두 멸망을 당할 것임이니라. 너희가 짐승이나 가축이나 땅에 기는 모든 것을 도살하는 모든 날 동안에 모든 피가 네게서 피가 나지 않게 하라. 그리고 지면에 쏟아진 것을 흙으로 덮음으로써 여러분의 영혼을 위해 선한 일을 하십시오. 그리고 피와 함께 먹는 사람처럼 되지 마십시오. 그러나 당신 앞에서 피를 먹지 않도록 힘쓰십시오. 피를 덮어라. 이는 내가 너희와 너희 자녀와 모든 육체에게 증언하라는 명령을 받았음이라. 그리고 생명을 고기와 함께 먹지 말라. 그리하여야 너희 피, 곧 너희 생명을 땅에 흘린 육체의 손에서 빼앗길 수 없게 될 것이다. 땅은 땅을 쏟은 이의 피가 아니면 땅에 쏟아진 피로부터 정결함을 받지 못하리니, 땅은 대대로 정결함을 받을 것임이니라. 이제 내 자녀들아 들으라 공의와 공의를 행하라 그리하면 너희가 온 땅 위에 의로 심겨지고 나를 홍수에서 구원하신 내 하나님 앞에 너희 영광이 높아지리라 보라, 가서 너희를 위하여 성읍들을 건설하고 거기에 땅의 모든 풀과 열매 맺는 모든 나무를 심으라.

    28. 삼년 동안은 무엇을 먹더라도 그 열매를 거두지 못할 것이다. 넷째 해에는 그 열매를 거두어 천지와 만물을 창조하신 지극히 높으신 주님 앞에 기쁘게 받으실 첫 열매를 드릴 것이니라 그들은 첫 포도주와 기름을 첫 열매로 그것을 받는 주님의 제단에 넉넉히 바쳐야 합니다. 남은 것은 주님의 성전의 종들이 그것을 받는 제단 앞에서 먹을지니라.

    29. 다섯째 해에는 풀어주라 그리하면 네가 심은 것이 다 의롭고 형통하리로다

    30. 이같이 네 아버지 므두셀라의 아버지 에녹이 그의 아들에게 명령하였고, 므두셀라는 그의 아들 라멕에게 명령하였고, 라멕은 그의 조상들이 그에게 명령한 모든 것을 나에게 명령하였느니라.

    31. 그리고 내 아들들아 나도 너희에게 명하노니, 에녹이 칠 대째 살아 있는 첫 번째 희년에 에녹이 자기 아들에게 내린 명령대로, 그가 죽는 날까지 자기 아들과 손자들에게 명령하고 증거하였느니라.'
  to: '1. 그리고 이 희년의 일곱째 주 첫해에 노아는 방주가 머물렀던 산, 곧 아라랏의 산들 가운데 하나인 루바르 산에 포도나무를 심었습니다. 그리고 넷째 해에 그것이 열매를 맺었습니다.

    2. 그는 그 열매를 보관하고, 그 해 일곱째 달에 그것을 거두었습니다. 그리고 그것으로 포도주를 만들어 용기에 넣고, 다섯째 해의 첫날까지 보관하였습니다.

    3. 첫째 달 초하루에 그는 기쁨으로 잔치를 베풀고, 야훼께 번제를 드렸습니다. 곧 어린 수소 한 마리, 숫양 한 마리, 한 살 된 양 일곱 마리, 숫염소 한 마리를 드려 자신과 자기 아들들을 위하여 속죄하려고 하였습니다.

    4. 그리고 그는 먼저 새끼염소를 준비하고, 그가 만든 제단 위에 놓인 고기 위에 그것의 피를 조금 놓았습니다. 또 그가 번제를 드렸던 그 제단 위에 그것의 모든 기름을 올려 드렸고, 소와 숫양과 양도 드렸습니다.

    5. 그는 그 모든 고기를 제단 위에 올려놓고, 그들의 모든 제물을 기름에 섞어 그 위에 두었습니다. 그런 뒤 그는 제단 위의 불 속에 포도주를 부었고, 제단에 향을 놓았으며, 그의 하나님 야훼 앞에서 기쁘게 받아들여질 향기가 올라가게 했습니다.

    6. 그는 아들들과 함께 기뻐하며 이 포도주를 조금 마셨습니다. 저녁이 되자 그는 자기 천막으로 들어가 술에 취한 채 누워 잠들었습니다. 그는 자는 동안 자기 천막 안에서 몸이 드러났습니다.

    7. 함은 자기 아버지 노아가 벌거벗은 것을 보고 밖으로 나가, 밖에 있는 자기의 두 형제에게 알렸습니다.

    8. 함은 자기 아버지 노아가 벌거벗은 것을 보고, 밖으로 나가 밖에 있는 두 형제에게 알렸습니다. 셈은 옷을 가져왔고, 셈과 야벳은 그 옷을 어깨에 메었습니다.

    9. 노아가 술기운에서 깨어나 자기의 막내아들이 자기에게 한 모든 일을 알고, 그의 아들을 저주하며 말하였습니다. “가나안은 저주를 받아 그의 형제들에게 비천한 종이 될 것입니다.”

    10. 그리고 셈을 축복하여 말씀하셨습니다. “셈의 하나님이신 주님은 찬송을 받으시며, 가나안은 셈의 종이 되기를 바랍니다.”

    11. 하나님께서 야벳을 넓혀 주시고 셈의 장막에 거하시며, 가나안은 그의 종이 되게 하시기를 바랍니다.”

    12. 함은 자기 아버지가 그의 막내아들, 곧 가나안을 저주한 것을 알고, 아버지가 자기 아들을 저주한 일을 불쾌하게 여겼습니다. 그래서 그는 자기 아들들, 곧 구스와 미스라임과 붓과 가나안과 함께 아버지에게서 떠났습니다.

    13. 그는 자신을 위하여 한 도시를 세우고, 아내의 이름을 따라 그 이름을 네엘라타마우크라고 하였습니다.

    14. 야벳은 그것을 보고 자기 형제를 시기하여, 자신을 위해서도 성을 쌓고 자기 아내의 이름을 따라 그 성의 이름을 아다타네세스라고 불렀습니다.

    15. 셈은 아버지 노아와 함께 살면서 아버지 곁, 산 근처에 성읍을 세우고 아내의 이름을 따라 그 성읍의 이름을 세데케텔레밥이라 불렀습니다.

    16. 보십시오, 이 세 성읍은 루바르 산 가까이에 있습니다. 세데케텔레바브은 산 앞 동쪽에 있고, 네엘라타마우크는 남쪽에 있으며, 아다타네스는 바다 쪽에 있습니다.

    17. 셈의 아들들은 이러합니다. 엘람과 앗수르와 아르박삿인데, 아르박삿은 홍수 후 두 해에 태어났습니다. 또 룻과 아람입니다.

    18. 이들은 셈의 아들들입니다. 엘람과 앗수르와 아르박삿(그는 홍수 후 두 해에 태어났습니다)과 룻과 아람입니다.

    19. 이들은 노아의 아들들입니다. 제이십팔 희년에 노아는 자기 손자들에게 규례와 계명과 자기가 아는 모든 판결을 지키도록 명하기 시작하였습니다. 또 그는 자기 아들들에게 의를 행하고, 자기 육체의 수치를 가리며, 자기들을 창조하신 분을 송축하고 아버지와 어머니를 공경하며, 저마다 자기 이웃을 사랑하고 음행과 부정과 모든 불의에서 자신을 지켜야 한다고 증언하였습니다.

    20. 그리고 스물여덟째 희년에 노아는 자기 아들들의 자녀들에게 규례와 계명을, 또 자기가 알고 있는 모든 판결을 명하기 시작했습니다. 그는 자기 자녀들에게 증언하여, 의를 행하고 자기들의 육체의 수치를 가리며, 그들을 지으신 분을 찬송하고, 아버지와 어머니를 공경하며, 서로 이웃을 사랑하고, 음행과 부정함과 모든 불의에서 자기들의 영혼을 지키라고 하였습니다.

    21. 또 더러움과 온갖 불법이 있었습니다. 이 세 가지 때문에 홍수가 땅 위에 닥쳤습니다. 이는 감시자들이 사람의 딸들을 따라가 자기들에게 주어진 규례의 명령을 거슬러 음행하고, 그들이 택한 모든 여자들을 아내로 삼아 더러움의 시작을 만들어 냈기 때문입니다.

    22. 그리고 그들은 나피딤의 자손을 낳았으며, 그들 모두는 서로 같지 않았고 서로를 집어삼켰습니다. 그리고 거인들이 나필을 죽였으며, 나필이 엘요를 죽였고, 엘요가 인류를 죽였습니다.

    23. 그리고 사람은 이웃을 상대로 하였습니다. 또 모든 사람이 스스로를 팔아 불의를 행하고 많은 피를 흘리게 하였습니다.

    24. 그리고 땅은 폭력으로 가득 찼습니다. 그 후에 그들은 짐승들과 새들과 땅 위를 움직이는 모든 것과 땅 위를 걷는 모든 것에게 죄를 지었고, 많은 피가 땅 위에 쏟아졌습니다. 그리고 모든—

    25. 사람의 생각과 욕구는 늘 헛되고 악한 것을 상상합니다. 주님께서는 그들의 악한 행위와 피 때문에 땅 위에서 모든 것을 멸하셨습니다.

    26. 그들이 땅 한가운데에 흘린 피 때문에, 그분께서는 모든 것을 멸하셨습니다. 나와 너희, 곧 내 자녀들, 그리고 우리와 함께 방주에 들어온 모든 이들만 남았습니다. 보십시오, 나는 너희의 행위를 보고 있습니다. 너희는 의롭게 걷고 있지 않습니다. 너희는 부패의 길을 걷기 시작했고, 각자가 자기 이웃에게서 떨어져 나가고 있으며, 서로 싸우게 될 것이고, 하나로 연합하지 못할 것입니다.

    27. 내 자녀들아, [서로 사랑하십시오]. 내가 보니, 보십시오, 악한 영들이 너희와 너희 자녀들에게 죄를 짓기 시작하였습니다. 이제 나는 너희를 염려합니다. 내가 죽은 뒤에 너희가 땅 위에서 사람의 피를 흘리고, 너희 자신도 땅에서 멸망할까 두렵기 때문입니다. 사람의 피를 흘리는 자와 어떤 육체의 피든 먹는 자는 모두 땅에서 멸망할 것입니다. 피를 먹거나 땅 위에서 사람의 피를 흘리는 사람은 아무도 남지 않을 것이며, 하늘 아래 그에게는 씨도 후손도 남지 않을 것입니다. 그들은 스올로 들어가고, 심판의 장소로 내려가며, 모두 폭력적인 죽음으로 깊은 어둠 속에 들어갈 것입니다.


    너희가 짐승이나 가축이나 땅 위를 기어 다니는 어떤 것을 잡는 모든 날에, 그 모든 피에 대하여 너희에게 피 흘린 죄가 없게 하십시오. 땅 위에 흘린 피를 흙으로 덮어 너희 자신을 위하여 선한 일을 하십시오. 피와 함께 먹는 자처럼 되지 말고, 피를 먹지 않도록 굳게 힘쓰십시오. 피를 덮으십시오. 이렇게 하도록 내가 너희와 너희 자녀들에게, 모든 육체에 관하여 명령하였습니다. 생명, 곧 피를 육체와 함께 먹지 마십시오. 그러면 땅 위에서 피를 흘리는 어떤 육체의 손이 너희의 생명인 너희 피에 대한 책임을 묻지 못할 것입니다. 땅은 그 위에 흘린 피 때문에 정결해지지 않으며, 그 피를 흘린 자의 피로써만, 그 모든 세대에 걸쳐 정결해질 것입니다.


    이제 내 자녀들아, 들으십시오. 정의와 의를 행하십시오. 그러면 너희가 온 땅 위에 의 안에서 심길 것이며, 홍수의 물에서 나를 구원하신 나의 하나님 앞에서 너희의 영광이 높아질 것입니다. 보십시오, 가서 너희를 위하여 성읍들을 세우고, 그 안에 땅 위의 모든 식물과 열매 맺는 모든 나무를 심으십시오. 먹을 수 있는 모든 것 가운데서도 그 열매는 삼 년 동안 먹지 않은 것으로 두십시오. 넷째 해에는 그 열매를 먹되, 하늘과 땅과 만물을 지으신 지극히 높으신 주님 앞에 바칠 첫 열매를 올리십시오. 첫 열매의 포도주와 기름을 주님의 제단에 올리십시오. 주님께서 받으신 뒤에 남은 것은 주님의 집 앞뜰에서 먹으십시오.

    28. 먹을 수 있는 모든 것의 열매는 삼 년 동안 거두지 마십시오. 넷째 해에는 그 열매를 거두고, 하늘과 땅과 만물을 창조하신 지극히 높으신 주님 앞에 받아들여질 첫 열매를 바치십시오. 그들은 첫 포도주와 기름을 첫 열매로 풍성히, 그것을 받으시는 주님의 제단에 바쳐야 합니다. 남은 것은 주님의 집의 종들이 그것을 받는 제단 앞에서 먹어야 합니다.

    29. 다섯째 해에는 해제를 행하십시오. 그리하여 의와 정직함으로 그것을 해제하십시오. 그러면 여러분은 의롭게 되고, 여러분이 심은 모든 것이 번성할 것입니다.

    30. 이같이 너희 아버지의 아버지 에녹은 그의 아들 므두셀라에게 명령하였고, 므두셀라는 그의 아들 라멕에게 명령하였으며, 라멕은 그의 조상들이 그에게 명령한 모든 것을 내게 명령하였습니다.

    31. 내 아들들아, 나도 에녹이 첫 희년들에, 아직 살아 있던 일곱째 세대에 그의 아들들에게 명령한 대로 너희에게 명합니다. 에녹은 죽는 날까지 그의 아들들과 그 아들들에게 명령하고 증언하였습니다.'
