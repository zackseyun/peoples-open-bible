  - 무덤으로
  lexicon: HALOT
  rationale: שְׁאוֹל은 단순한 무덤보다 넓은 죽은 자의 영역이므로 음역 ‘스올’을 유지하고, ל의 방향성을 ‘향해’로 살렸습니다.
- source_word: שַׁתּוּ
  english_pob_choice: are appointed
  chosen_korean: 정해졌고
  alternatives_korean:
  - 배정되었고
  - 놓였고
  - 두어졌고
  lexicon: HALOT
  rationale: ‘놓이다/두어지다’의 수동적 지정 의미를 한국어에서 자연스럽게 드러내기 위해 ‘정해졌고’로 옮겼습니다.
- source_word: יִרְעֵם
  english_pob_choice: will shepherd them
  chosen_korean: 그들을 치리할 것입니다
  alternatives_korean:
  - 그들을 목양할 것입니다
  - 그들을 이끌 것입니다
  lexicon: HALOT
  rationale: 문맥상 죽음이 양의 목자처럼 그들을 다스리는 역설을 살리기 위해 ‘목양하다’보다 더 직설적인 ‘치리하다’ 계열을 택했으며, 원문 동사의 통치적 뉘앙스를 반영했습니다.
- source_word: יְשָׁרִים
  english_pob_choice: the upright
  chosen_korean: 정직한 이들
  alternatives_korean:
  - 의로운 이들
  - 올곧은 이들
  lexicon: HALOT
  rationale: ‘직선적/곧은’ 의미를 유지하면서 한국어에서 인격적 성향을 드러내는 ‘정직한 이들’로 옮겼습니다.
- source_word: וְצוּרָם
  english_pob_choice: Their form
  chosen_korean: 그들의 형상
  alternatives_korean:
  - 그들의 바위
  - 그들의 힘
  - 그들의 모습
  lexicon: HALOT
  rationale: 본문은 난해하지만 문맥상 쇠퇴해 가는 대상을 가리키는 표현으로 이해하여, English POB의 해석을 따라 ‘형상’으로 옮겼습니다.
- source_word: לְבַלּוֹת
  english_pob_choice: will waste away
  chosen_korean: 닳아 없어질 것이며
  alternatives_korean:
  - 소모될 것이며
  - 사라질 것이며
  - 쇠해질 것이며
  lexicon: HALOT
  rationale: ‘wear out/decay’의 감각을 살려, 물질이 마모되는 이미지를 주는 ‘닳아 없어지다’로 자연스럽게 옮겼습니다.
- source_word: מִזְּבֻל לוֹ
  english_pob_choice: far from its lofty dwelling
  chosen_korean: 그 높은 거처에서 멀리 떨어질 것입니다
  alternatives_korean:
  - 그 높은 거처에서부터일 것입니다
  - 그 장엄한 처소에서 멀리 떨어질 것입니다
  lexicon: HALOT
  rationale: 난해한 어구지만 זְבֻל의 ‘높은 거처’ 의미를 반영하고, 앞절과 연결되는 이격 관계를 한국어로 분명하게 했습니다.
theological_decisions:
- issue: שְׁאוֹל의 번역 처리
  chosen_reading: ‘스올’로 음역하여 죽은 자의 영역을 보존했습니다.
  alternative_readings:
  - 무덤
  - 죽은 자의 세계
  rationale: 시편의 어휘는 단순 매장지보다 넓은 사후 영역을 가리키므로, 교리적으로 축소하지 않기 위해 음역을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘죽음이 그들을 치리할 것입니다’의 의인화
  chosen_reading: 죽음을 인격적 통치자로 읽어 역설을 살렸습니다.
  alternative_readings:
  - 죽음이 그들을 먹이로 삼을 것입니다
  - 죽음이 그들을 이끌 것입니다
  rationale: 원문은 ‘죽음’이 목자처럼 행동하는 강한 의인화를 담고 있으므로, 이를 약화시키지 않도록 통치/지배의 뉘앙스를 유지했습니다.
  doctrine_reference: 원문 문학적 수사와 시적 병행 구조
