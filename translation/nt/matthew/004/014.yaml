  to: 'so that what was spoken through Isaiah the prophet might be fulfilled:'
  rationale: Because the English word order places 'might be fulfilled' between 'Isaiah the prophet' and 'saying', the participle 'saying' is left dangling and grammatically disconnected from its antecedent. It is standard and more natural in English to absorb 'λέγοντος' into the colon that introduces the quotation.
