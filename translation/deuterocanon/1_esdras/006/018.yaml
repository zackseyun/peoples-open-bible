  meaning_decisions:
  - source_phrase: ἐπετάγη αὐτῷ
    prior_rendering: he was commanded
    new_rendering: Sanabassar was given orders
    rationale: The singular recipient is the governor just named; identifying him prevents confusion between the two recipients in verse 17.
  - source_phrase: καὶ ἀπήνεγκεν πάντα τὰ σκεύη ταῦτα
    prior_rendering: to bring back all these vessels
    new_rendering: and he brought back all these vessels
    rationale: The supplied Greek has a finite past-tense verb reporting the return, rather than an infinitive stating only what he was commanded to do.
  - source_phrase: καὶ τὸν ναὸν τοῦ κυρίου οἰκοδομηθῆναι ἐπὶ τοῦ τόπου
    prior_rendering: and that the temple of the Lord should be built on its site
    new_rendering: the temple of the Lord was to be rebuilt on its site
    rationale: The clause expresses the authorized reconstruction; separating it clarifies the compressed syntax without claiming that construction was completed.
