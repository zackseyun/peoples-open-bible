    rationale: 의미상 큰 오류는 없으나, מֵשִׁיב … אָחוֹר의 ‘뒤로 돌리다’라는 직접적 사역 표현은 ‘뒤로 돌려세우시고’가 더 자연스럽고 명료합니다.
  revised_text: 그는 거짓말하는 자들의 표징들을 무효하게 하시고 점치는 자들을 어리석게 하시며, 지혜로운 자들을 뒤로 돌려세우시고 그들의 지식을 어리석게 하십니다.
