  timestamp: '2026-07-13T12:35:44Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 וְכִלְכַּלְתִּי는 기근 상황에서의 지속적인 생계 보장을 뜻하므로 ‘부양하겠습니다’는 적절합니다. כִּי와 פֶּן의 인과 및 예방 관계도 보존되어야 합니다. 다만 ‘당신에게 속한 모든 것이 빈궁에 빠지다’는 소유물이 빈궁의 주체가 되는 듯하여 한국어로 부자연스럽습니다.
  naturalness: ‘아버지’는 이 발화의 명시적 문맥상 수신자인 야곱을 자연스럽게 가리키며, 현대 한국어에서 ‘당신’보다 존중하는 아들의 발화로 적절합니다. ‘궁핍하게 되지 않도록’은 사람·집안·소유를 함께 포괄하는 원문의 결과를 자연스럽게 옮깁니다.
  terminology: ‘기근’, ‘부양하다’, ‘궁핍하게 되다’는 본문의 생계·빈곤 어휘를 현대의 격식 있는 합쇼체로 충실히 전달합니다. 신학적 해석을 덧붙이지 않았습니다.
  issues:
