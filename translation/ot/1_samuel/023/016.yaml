  chosen_reading: God
  alternative_readings:
  - the LORD
  rationale: The Hebrew text reads אֱלֹהִים, not the divine name YHWH. Therefore it should be translated 'God' rather than importing the covenant name 'the LORD.' This follows original-language primacy and avoids harmonization.
