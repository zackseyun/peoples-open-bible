  from: Her house is the way to Sheol[b][a], going down to the chambers of death.
  to: Her house is the way[a] to Sheol[b], going down to the chambers of death.
  rationale: 'Reject the proposed wording “Her house is the ways,” which is genuinely unnatural English: a singular subject cannot naturally take that plural predicate in this idiom. The Hebrew construct plural דַּרְכֵי is real, and יֹרְדוֹת agrees with it, but English may idiomatically use the collective singular “the way” without changing the warning or importing interpretation. The existing footnote candidly preserves the plural source form. The actual defect is the misplaced and reversed footnote placement: the plural-form note should mark “way,” and the Sheol note should mark “Sheol.” The participial image is adequately retained by “going down.”'
