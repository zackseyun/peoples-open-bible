  terminology: ‘와디’는 נְחָלִים의 계절성 물길/하상이라는 지리적 뜻에 가장 가깝고, 처음 쓰는 독자를 위해 각주에서 ‘계곡들/골짜기들’이라는 대안을 제시합니다. ‘아르’와 ‘모압’은 통용되는 음역을 유지했습니다.
