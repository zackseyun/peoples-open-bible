  preserved_meaning: Sudden anger takes hold and develops into intense bitterness.
  reasoning_layer_used: POB main text
  rationale: The natural English recasting retains both quick anger and deep bitterness.
- pob_phrase: the Spirit of God that was given to this flesh
  simplified_phrase: the Spirit of God, who was given to dwell in this human body
  preserved_meaning: God's Spirit was given to inhabit human flesh.
  reasoning_layer_used: POB main text and immediate indwelling context
  rationale: “Human body” clarifies “flesh,” while “dwell” preserves the image of the Spirit living within it.
