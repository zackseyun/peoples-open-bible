translation:
  language: en
  text: Paul said, “John’s baptism centered on repentance[a]. He told the people to believe in the one coming after him—that is, in Jesus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: telling the people to believe
  simplified_phrase: He told the people to believe
  preserved_meaning: John’s message accompanied his baptizing and called the people to faith.
  reasoning_layer_used: POB lexical decision for λέγων and ἵνα πιστεύσωσιν
  rationale: A separate sentence replaces the participial clause with ordinary English.
