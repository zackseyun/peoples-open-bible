base_translation:
  text: 'VIII.1. When, then, I had stopped questioning her about all these things, she says to me, “Do
    you want to see something else?” And because I was eager to behold it, I became very glad to see.


    VIII.2. Looking at me, she smiled and says to me, “Do you see seven women around the tower?” “I do,
    lady,” I said. “This tower is supported by these women at the Lord’s command.”


    VIII.3. “Now hear their functions[a]. The first of them, the one clasping her hands[b], is called
    Faith; through her the chosen of God are saved[d].”


    VIII.4. “And the second, the one girded about and acting bravely[c], is called Self-control; she is
    the daughter of Faith. Whoever, then, follows her becomes blessed in his life, because he will refrain
    from all evil works, believing that if he refrains from every evil desire he will inherit eternal
    life[e].”


    VIII.5. “But the others, lady, who are they?” “They are daughters of one another. And they are called
    Simplicity, Knowledge, Innocence, Dignity, and Love[f]. Whenever, then, you do all the works of their
    mother[g], you are able to live.”


    VIII.6. “I wanted,” I said, “to know, lady, what power each of them has.” “Hear,” she says, “the powers
    they have.”


    VIII.7. “Their powers are held together by one another[h], and they follow one another, just as they
    were born: from Faith is born Self-control, from Self-control Simplicity, from Simplicity Innocence,
    from Innocence Dignity, from Dignity Knowledge, and from Knowledge Love. So, then, the works of these
    are pure and dignified and divine[i].”


    VIII.8. “Whoever, then, serves these and proves able to hold fast to their works[j] will have his
    dwelling in the tower with the holy ones of God[k].”


    VIII.9. And I kept asking her about the times—whether it is already the end[l]. But she cried out
    with a loud voice, saying, “Senseless man, do you not see that the tower is still being built? Whenever,
    then, the tower is completed in its building, it comes to an end. But it will be built up quickly.
    Do not question me any further; this reminder and the renewal of your spirits are enough for you and
    for the holy ones[m].”


    VIII.10. “But it was not revealed to you alone, but so that you may make them known to all[n].”


    VIII.11. “After three days[r]—for first you must understand, and I first command you, Hermas, the
    words I am about to say to you—speak[o] them all[p] into the ears of the holy ones, so that, after
    hearing them and doing them, they may be cleansed from their evils[q], and you also with them.”'
