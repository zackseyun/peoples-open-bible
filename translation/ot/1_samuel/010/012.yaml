  category: meaning_retranslation
  from: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
  to: 'A local man replied, “And who is their[a] father[b]?” So the saying became a proverb: “Is Saul also among the prophets?”'
  rationale: The lexical record rightly retains the Hebrew plural, but its ancestry-based explanation is not the only serious understanding of “father.” I leave the question open and document the singular Greek reading rather than treating it merely as an English paraphrase.
