    rationale: 삯 can denote wages, but it often suggests laborers' or piece-work pay. For soldiers' ὀψώνια, '급료' is more natural and semantically fitting.
  - severity: low
    issue: The phrasing '자기 군대에게 일 년 치 삯' is stylistically awkward.
    rationale: Using '자신의 군대에 일 년분의 급료를' gives a standard Korean military-administrative expression while preserving the annual provision.
