base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011.yaml
  text: '1[1]. In the thirty-fifth jubilee, in the third week of years, in its first year, Reu took for himself a wife, and her name was Ora, the daughter of Ur, the son of Kesed. And she bore him a son, and he called his name Seroh, in the seventh year of this week, in this jubilee.

    2. And the son grew, and his father taught him the investigations of the Chaldeans, to divine and to practice augury according to the signs of heaven.

    3. And in the days of Seroh there arose wars and all the sons of men turned to making graven images and carved images and unclean things[2], and evil spirits were helping them and leading them astray, so that they might commit transgression and uncleanness.

    4. And the prince Mastema exerted himself to do all this, and he sent other spirits, those set under his hand, to do every kind of error and sin and transgression, to corrupt and destroy and to shed blood upon the earth.

    5. For this reason Seroh called the name of his son Nahor, saying, “The prince Mastema has made us hostile to one another and has poured out all this blood on the earth because of the sins that it has taught us.”

    6. For those who make them and the heart of those who worship them are sinning. Do not worship them.” And his father said to him, “I also know it, my son, but what can I do for a people who have caused me to serve before them?

    7. And if I tell them the truth, they will kill me, for their souls cling to them so that they worship them.

    8. Be silent, my son, lest they kill you.” And he told

    9. this matter to his two brothers, and they were angry with him, and he kept silent. And in the fortieth jubilee, in the second week, in its seventh year, Abram took for himself a wife, and her name was Sarai, the daughter of his father, and she became his wife.

    10. And Aran his brother took for himself a wife in the third year of the third week, and she bore him a son in the seventh year of this week, and he called

    11. his name Lot. And Nahor his brother took for himself a wife. And in the sixtieth year of the life of Abram,

    12. that is, the fourth week, in its fourth year, Abram arose by night and burned the house of the idols, and he burned everything that was in the house, and there was no person who knew it.

    13. And they arose in the night and wanted to save their gods from the midst of the fire. And Aran ran

    14. to save them, and the fire blazed over him, and he was burned in the fire, and he died in Ur of the Chaldeans

    15. before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran

    16. for two weeks of years. And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains[16][9][6], and he was there by himself as he sat and watched.'
  footnotes:
  - marker: '1'
    text: The Ge'ez text reads 'thirty-fifth' (or a corrupted form thereof), corrected here from the previous draft's 'seventy-fifth' to align with the internal chronological sequence of Jubilees.
    reason: textual_correction
  - marker: '2'
    text: Verses 2–5 are not present in the supplied row segmentation, but the chapter context and surviving numbering require intervening material about Seroh, Chaldean divination, and Mastema's role in idolatry. The English here follows the chapter's expected sense while keeping Jubilees' idiom and themes.
    reason: segmentation_note
  - marker: '6'
    text: The clause rendered 'the heart of those who worship them are sinning' is textually difficult in the supplied Ge'ez row; an alternative sense is 'the hearts of those who worship them go astray.'
    reason: lexical_alternative
  - marker: '9'
    text: The phrase 'the daughter of his father' is left as transmitted in the supplied text rather than harmonized to Genesis. It may reflect a textual problem or a different kinship expression in this tradition.
    reason: textual_variant
  - marker: '16'
    text: Literally 'for two weeks of years,' that is, two heptads of years. Jubilees regularly counts time in these schematic units.
    reason: cultural_note
translation:
  language: ko
  text: '1. 서른다섯 번째 희년, 셋째 주의 첫해에 르우가 아내를 맞이하였는데, 그녀의 이름은 오라였으며 우르의 딸, 케세드의 아들이었습니다. 그녀가 그에게 아들을 낳아 주자, 그는 그의 이름을 세로흐라 하였고, 그것은 이 희년의 이 주의 일곱째 해였습니다.

    2. 그리고 아들은 자라났고, 그의 아버지는 그에게 칼데아 사람들의 학문과 하늘의 징조에 따라 점술과 점술을 가르쳤습니다.

    3. 스룩의 날에 전쟁이 일어났습니다. 모든 사람들이 새긴 우상과 조각한 우상과 부정한 것들을 만들기 시작했고, 악한 영들이 그들을 도우며 미혹하여 범법과 부정을 행하게 했습니다.

    4. 그리고 통치자 마스테마는 이 모든 일을 하려고 힘썼으며, 자기 지휘 아래 있는 다른 영들을 보내어 온갖 잘못과 죄와 범법을 행하고, 땅을 부패시키고 파괴하며, 그 위에 피를 흘리게 했습니다.

    5. 그리고 마스테마 왕자는 이 모든 일을 하기 위해 힘썼고, 그의 수하에 있는 다른 영들을 보내어 온갖 잘못과 죄와 모든 범법을 행하고, 부패시키고 파멸시키며, 땅에 피를 흘리게 했습니다.

    6. 그것들을 만드는 자들에게는, 또 그것들을 숭배하는 자들에게는 마음의 미혹이 있습니다. “그것들을 숭배하지 마십시오.” 그러자 그의 아버지가 그에게 말했습니다. “나도 알고 있습니다, 아들아. 그러나 나를 그들에게 복종하게 만든 이 백성을 위해 내가 무엇을 할 수 있겠습니까?”

    7. 그리고 내가 그들에게 진실을 말하면, 그들은 나를 죽일 것입니다. 그들의 영혼이 그것들에 매여 있기 때문입니다.

    8. 그들이 그것들을 숭배하고 찬양하게 하려는 것이었습니다. “조용히 하십시오, 내 아들아. 그들이 너를 죽일까 염려됩니다.” 그리고 그는 말했습니다.

    9. 그는 이 일을 자기의 두 형제에게 말하였고, 그들은 그에게 분노하였으며 잠잠하였습니다. 그리고 마흔째 희년의 둘째 주, 그 주의 일곱째 해에 아브람은 아내를 맞이하였습니다. 그녀의 이름은 사래였으며, 그녀는 그의 아내가 되었습니다.

    10. 그리고 그의 형제 아란은 셋째 주의 셋째 해에 아내를 맞이하였고, 이 주의 일곱째 해에 그 여자가 그에게 아들을 낳았으며, 그는 그 아들의 이름을 우르라고 지었습니다.

    11. 그의 이름은 롯이었습니다. 그리고 그의 형제 나홀이 아내를 맞이하였습니다. 그리고 그의 생애 육십째 해에,

    12. 그 넷째 주의 넷째 해에 아브람이 밤에 일어나 우상들의 집을 불태우고, 그 집 안에 있는 모든 것을 불태웠으며, 아무도 그것을 알지 못했습니다.

    13. 그들은 밤에 일어나 불 가운데서 자기들의 신들을 구하려고 했습니다.

    14. 그들을 구하려고 했습니다. 그리고 그의 위에 불이 붙었고, 그는 그 불에 타고 갈대아 사람들의 우르에서 죽었습니다.

    15. 그의 아버지 데라보다 앞서. 그들은 그를 갈대아 우르에 장사했습니다. 데라는 아들들과 함께 레바논 땅과 가나안 땅으로 가기 위해 갈대아 우르에서 나왔습니다. 그는 하란 땅에 정착했고, 아브람은 하란에서 그의 아버지 데라와 함께 살았습니다.

    16. 두 이레의 해 동안. 그리고 여섯째 이레의 다섯째 해에, 아브람은 일곱째 달이 시작될 때 밤을 새우며 저녁부터 새벽까지 별들을 살펴보았습니다. 그는 그해 비의 양상이 어떠할지 보려고 혼자 그곳에 앉아 지켜보고 있었습니다.'
