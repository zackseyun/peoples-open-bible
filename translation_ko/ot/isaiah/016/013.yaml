  - severity: low
    issue: ‘오래전에’의 시간적 뉘앙스
    rationale: מֵאָז는 현재 시점보다 앞선 때를 가리킵니다. ‘일찍이’는 불필요하게 기간의 길이를 강조하지 않으면서 문맥상 ‘전에/옛적에’를 격식 있게 나타냅니다.
