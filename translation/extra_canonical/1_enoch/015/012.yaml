lexical_decisions:
- source_word: ነፍሳት
  chosen: spirits
  alternatives:
  - souls
  rationale: The surrounding passage concerns the spirits of the dead giants; “souls”
    could misleadingly suggest ordinary human souls.
- source_word: ይትነሥኡ፡ ዲበ
  chosen: will rise up against
  alternatives:
  - will rise upon
  rationale: “Against” conveys the hostile force of “rise up upon” in this context
    without adding an action not stated in the verse.
- source_word: ውሉደ፡ ሰብእ
  chosen: children of humankind
  alternatives:
  - sons of men
  - human beings
  rationale: This retains the source’s kinship expression while making its reference
    to humans readable in modern English.
- source_word: እንስሳ
  chosen: animals
  alternatives:
  - women
  lexicon: Dillmann, Lexicon linguae aethiopicae
  rationale: The supplied Ge’ez word means “animals.” “Women” may suit the surrounding
    narrative, but it is not the word in the supplied OCR witness.
- source_word: ወፅኡ፡ (እምኔሆሙ)
  chosen: they came forth from them
  alternatives:
  - they originated from them
  rationale: The rendering preserves the source’s emergence language and leaves the
    antecedent of “them” unresolved.
theological_decisions:
- issue: Identity and hostility of the spirits
  chosen_reading: The spirits of the preceding context rise against humans and animals.
  alternative_readings:
  - The verse refers to human souls generally.
  rationale: “These spirits” points back to the spirits discussed in the surrounding
    Watchers passage; no later demonological terminology is imported.
