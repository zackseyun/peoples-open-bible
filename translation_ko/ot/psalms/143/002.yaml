review_pass:
  verdict: revise
  source_fidelity: The draft conveys the plea not to judge the psalmist, but it does not adequately reflect the legal-process expression 'enter into judgment with.' Its second clause narrows כָּל־חָי ('all living [persons]') to 'living creatures,' which is unnatural here and may imply nonhuman life. The proposed revision retains the judicial sense of יִצְדַּק while preserving the moral-righteousness rendering as a footnoted alternative.
  naturalness: '''의로운 생명체'' is not natural Korean for human beings in this prayer context. ''어떤 살아 있는 자도'' is idiomatic, appropriately solemn, and retains the Hebrew universal scope under negation. ''심판을 시작하지 마소서'' clearly conveys the legal metaphor in modern formal-polite Korean.'
  terminology: '''주'' and ''주의 종'' suit the psalmic prayer register. ''의롭다고 판정받다'' expresses the forensic force of the Hebrew in its immediate judicial context without importing a denominational doctrinal formulation.'
  issues:
  - severity: medium
    issue: The legal idiom is underrepresented.
    rationale: '''주의 종을 심판하지 마소서'' gives the broad sense, but the Hebrew literally invokes entering into judicial proceedings. ''주의 종을 심판하는 일을 시작하지 마소서'' better preserves that process imagery.'
  - severity: high
    issue: '''의로운 생명체'' is semantically and stylistically unsuitable.'
    rationale: כָּל־חָי here denotes every living person, not living creatures generally. The phrase is unnatural in Korean and weakens the human confession intended by the verse.
  - severity: medium
    issue: The footnote's wording is needlessly future-oriented and uses an inconsistent divine address.
    rationale: The Hebrew imperfect can express a general inability to be in the right in judgment; '못할 것입니다' is less fitting in this prayer. '당신' also clashes with the elevated prayer register of '주.'
  revised_text: 또 주의 종을 심판하는 일을 시작하지 마소서. 어떤 살아 있는 자도 주 앞에서 의롭다고 판정받지 못하나이다[a].
  revised_footnotes:
  - marker: a
    text: 혹은 ‘어떤 살아 있는 자도 주 앞에 의로운 자가 없나이다.’
    reason: lexical_alternative
  revision_rationale: The revision restores the continued plea ('또'), makes the judicial-process metaphor explicit, renders כָּל־חָי naturally as living human beings, and uses a forensic main rendering for יִצְדַּק that fits the immediate context. The footnote preserves the equally viable broader rendering concerning righteousness.
