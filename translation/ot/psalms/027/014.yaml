theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Syntactical force of וְיַאֲמֵץ
  chosen_reading: jussive/exhortational sense within a chain of imperatives
  alternative_readings:
  - 'predictive: ''and he will strengthen your heart'''
  rationale: Although the verb form can be read as an imperfect with predictive force, the immediate context consists of direct exhortations and is commonly understood as continuing that exhortation. The chosen rendering preserves the poetic call to courage without importing a separate explicit promise into the main text. The predictive alternative is preserved in a footnote because it is a viable syntactical reading.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
revisions:
