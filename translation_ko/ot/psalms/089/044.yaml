  rationale: 시적 폭력성과 낮춤의 뉘앙스를 살리기 위해 단순한 '내리다'보다 강한 동작을 선택했습니다.
theological_decisions:
- issue: 시편의 왕적 대상이 누구인지의 명시 여부
  chosen_reading: 대상은 히브리어가 암시하는 대로 그의 왕좌로 두고, 다윗이나 메시아로 구체화하지 않았습니다.
  alternative_readings:
  - 그의 = 다윗 왕
  - 그의 = 언약의 메시아
  rationale: 원문은 3인칭 단수 소유격만 사용하며 대상을 명시하지 않으므로, 해석을 앞서서 고정하지 않고 시적 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
