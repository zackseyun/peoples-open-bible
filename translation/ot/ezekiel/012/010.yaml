- issue: Rendering the divine name in אֲדֹנָי יְהוִה
  chosen_reading: the Lord GOD
  alternative_readings:
  - the Lord Yahweh
  - Lord GOD
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Sense of מַשָּׂא
  chosen_reading: burden
  alternative_readings:
  - oracle
  - pronouncement
  rationale: The Hebrew term can denote a prophetic utterance/oracle, but its basic sense 'burden' is still intelligible and preserves prophetic texture. Because the phrase is syntactically compressed, the English adds 'concerns' to express the relation without over-paraphrasing.
