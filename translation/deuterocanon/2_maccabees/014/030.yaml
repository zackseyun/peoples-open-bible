  text: ὁ δὲ Μακκαβαῖος αἰσθητήριον διεξαγαγόντος συνιδὼν τὸν Νικάνορα τὰ πρὸς αὐτόν, καὶ τὴν ἠθισμένην ἀπάντησιν ἀγριωτέρως ἐσχηκότα, νοήσας οὐκ ἀπὸ τοῦ βελτίστου τὴν αὐστηρίαν εἶναι, συστρέψας οὐκ ὀλίγους τῶν περὶ αὐτὸν, συνεκρύπτετο τὸν Νικάνορα.
