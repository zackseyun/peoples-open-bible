reference: 4 Maccabees 7:14
source:
  edition: lxx-swete-1909
  text: τῷ πνεύματι τοῦ λογισμοῦ, καὶ τῷ Ἰσακείῳ λογισμῷ τὴν πολυκέφαλον στρέβλαν ἠκύρωσεν.
