translation:
  text: And all pleasant trees will be planted on it, and they will plant vines on
    it. The vine planted on it will yield wine in abundance. Every seed sown on it—one
    measure will yield a thousand; and one measure of olives will yield ten presses
    of oil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “trees of delight.”
    reason: lexical_alternative
  - marker: b
    text: The term rendered “vines” should be checked against the page image; the
      supplied OCR is uncertain.
    reason: textual_variant
  - marker: c
    text: “Presses” follows the Ge'ez wording; the amount of oil represented by a
      press is not specified.
    reason: cultural_note
lexical_decisions:
- source_word: ዕፀወ፡ ትሤት
  chosen: pleasant trees
  alternatives:
  - trees of delight
  - desirable trees
  rationale: Retains the positive quality attached to the trees without adding a species
    or symbolic meaning.
- source_word: አውያነ
  chosen: vines
  alternatives:
  - vineyards
  rationale: The following singular vine and its wine yield support this reading,
    though the OCR form warrants checking against the page image.
- source_word: ወይነ፡ ለጽጋብ
  chosen: wine in abundance
  alternatives:
  - wine to fullness
  rationale: Here ወይነ is the vine’s product, while ለጽጋብ expresses fullness or plentiful
    supply.
- source_word: መስፈርት፡ … እልፈ
  chosen: one measure … a thousand
  rationale: Preserves the stated measure and the extraordinary thousandfold yield
    without supplying an unstated unit.
- source_word: ኤልያስ፡ … ምክያደ፡ ዘይት
  chosen: olives … presses of oil
  alternatives:
  - olives … pressings of oil
  lexicon: Abyssinica Ge'ez Dictionary (ምክያድ)
  rationale: The context identifies ኤልያስ as olives; ምክያደ denotes a press or pressing
    place, not an explicitly defined liquid measure.
theological_decisions:
- issue: Meaning of the extraordinary harvest
  chosen_reading: The promised abundance remains concrete agricultural imagery.
  alternative_readings:
  - An allegory of spiritual fruitfulness
  rationale: The verse names trees, vines, seed, olives, and oil; it does not itself
    explain these as symbols.
