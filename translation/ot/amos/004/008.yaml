- issue: Repentance nuance in שׁוב
  chosen_reading: return to me
  alternative_readings:
  - turn back to me
  rationale: The Hebrew can denote physical return or covenantal turning/repentance. In Amos's prophetic context the covenantal sense is clearly active, but 'return to me' preserves the theological force without importing a more interpretive paraphrase such as 'repent.'
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
