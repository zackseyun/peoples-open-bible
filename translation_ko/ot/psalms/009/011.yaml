revisions:
- from: 그리고 주님의 이름을 아는 이들은 주님을 신뢰할 것입니다. 이는 주님, 주님을 찾는 이들을 버리지 않으셨기 때문입니다.[a][b][c]
  to: 야훼께 찬양을 노래하십시오, 시온에 거하시는 분께. 그분이 행하신 일들을 민족들 가운데 알리십시오.[a]
  rationale: 원문에 있는 두 복수 명령(זַמְּרוּ, הַגִּידוּ)을 각각 ‘찬양을 노래하십시오’와 ‘알리십시오’로 옮겼습니다. יֹשֵׁב צִיּוֹן은 하나님의 시온 거주를 본문에 반영하되, 왕적 좌정의 문맥상 가능한 뉘앙스는 각주로 보존했습니다. בָעַמִּים은 ‘민족들 가운데’로, עֲלִילוֹתָיו는 하나님이 행하신 일들을 가리키도록 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:46:18Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 시편 9:11이 아니라 시편 9:10에 해당하는 내용(‘주의 이름을 아는 이들…’)을 옮기고 있어, 주어진 히브리어 본문 및 영어 POB와 일치하지 않습니다. 9:11의 두 복수 명령, ‘시온에 거하시는’ 야훼, 그리고 민족들 가운데 그의 행적을 알리라는 명령을 모두 새로 반영해야 합니다.
  naturalness: 개정문은 현대 표준 한국어의 합쇼체 명령형을 사용하며, 시편의 예배적·시적 어조를 자연스럽게 유지합니다.
  terminology: יְהוָה는 프로젝트의 결정에 따라 ‘야훼’로 옮겼습니다. זמר는 ‘찬양을 노래하다’, עמים는 복수성을 살려 ‘민족들’, עלילות은 문맥상 ‘행하신 일들’로 옮겼습니다. יֹשֵׁב의 거주와 왕적 좌정의 가능성은 본문에서는 ‘거하시는’으로 보존하고 각주에 대안을 제시합니다.
  issues:
  - severity: high
    issue: 본문이 참조 구절 및 원문과 불일치합니다.
    rationale: 초안은 ‘그리고 주님의 이름을 아는 이들은…’으로 시작하는 시편 9:10의 내용이며, WLC 시편 9:11의 ‘야훼께 찬양을 노래하라… 그의 행적을 민족들 가운데 알리라’가 전혀 반영되지 않았습니다.
  - severity: medium
    issue: 신명 표기가 프로젝트의 명시된 결정과 불일치합니다.
    rationale: 제공된 신학 결정은 יְהוָה를 ‘Yahweh’로 옮기도록 정하고 있으므로, 한국어 본문에서는 통상적 음역인 ‘야훼’를 사용해야 합니다.
  - severity: medium
    issue: 기존 각주와 앵커가 현 구절에 해당하지 않습니다.
    rationale: ‘이름’, ‘버리지 않으셨습니다’, YHWH 관련 기존 각주는 시편 9:10을 전제로 하며, 9:11에는 יֹשֵׁב צִיּוֹן의 가능한 ‘좌정’ 뉘앙스를 위한 각주가 적절합니다.
