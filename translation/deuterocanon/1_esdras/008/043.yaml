translation:
  text: I sent for Eleazar, Iduel, Maasman, Enaathan, Shemaiah, Jorib, Nathan, Ennathan, Zechariah, and Mesholabon[a], the
    leaders and men of understanding,
  philosophy: optimal-equivalence
