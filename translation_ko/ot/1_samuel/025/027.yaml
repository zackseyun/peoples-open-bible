  - 현대적 완화 표현으로 평준화
  rationale: 본문은 단순 정보 전달이 아니라 아비가일의 외교적·윤리적 태도를 보여 주므로, 한국어에서도 위계와 예우의 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 문맥적 화행과 사회적 위계의 보존
