  category: meaning_retranslation
  from: He said[a], “If Esau comes to the one camp and strikes it, then the camp that remains will escape.”
  to: He said, “If Esau comes to one camp and attacks it, the other camp will escape.”
  rationale: The earlier rendering rightly verbalized the escape idiom as “will escape,” and I retain that result as Jacob’s stated reasoning. The revisions clarify the threatened action and the relationship between the two camps without adding certainty beyond Jacob’s own words.
