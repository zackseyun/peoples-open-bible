- source_word: הַכְּפִירָה
  chosen: Hakkephirah
  alternatives:
  - the Kephirah
  - Kephirah
  lexicon: HALOT
  rationale: Toponym; transliterated rather than translated. The prefixed article is represented in the English form as part of the name ('Hak-').
- source_word: הַמֹּצָה
  chosen: Hammozah
  alternatives:
  - the Mozah
  - Mozah
  lexicon: HALOT
  rationale: Toponym; transliterated in keeping with the stated philosophy. The article is retained in transliteration as part of the place name ('Ham-').
