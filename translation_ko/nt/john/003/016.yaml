  to: 하나님께서는 세상을 이와 같이[a] 사랑하셨습니다. 곧 자신의 유일한 아들[b]을 주셨습니다. 이는 그를 믿는 사람마다 멸망하지 않고 영생을 얻게 하시려는 것입니다.
  rationale: 본문은 원문의 의미 흐름을 따라 하나님께서 세상을 사랑하신 방식이 아들을 주신 일로 나타났음을 분명히 하고, 그 목적을 자연스러운 현대 합쇼체로 표현했습니다. ‘유일한 아들’은 μονογενής의 유일성·독특성을 본문에서 직접 전달하며, 역사적으로 중요한 ‘독생자/독생하신 아들’은 각주에 보존했습니다. 정도와 방식이라는 οὕτως의 가능한 뉘앙스도 어느 한쪽을 과도하게 배제하지 않도록 각주를 정비했습니다.
