id: PSS.7.8
reference: Psalms of Solomon 7:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: lxx-swete-1909
  text: ὅτι σὺ οἰκτειρήσεις τὸ γένος Ἰσραὴλ εἰς τὸν αἰῶνα καὶ οὐκ ἀπώσεις καὶ ἡμεῖς ὑπὸ ζυγόν σου τὸν αἰῶνα, καὶ μάστιγα παιδίας σου.
  language: Greek
  pages:
  - 797
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/008.yaml
  text: For you will have compassion on the people of Israel forever, and you will not cast them off; and we will be under your yoke forever, and under the whip of your discipline.
translation:
  language: ko
  text: 이는 당신께서 이스라엘 민족을[a] 영원히 불쌍히 여기시고 결코 버리지 않으실 것이며, 우리는 영원히 당신의 멍에 아래에, 또 당신의 징계의 채찍 아래에 있을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 γένος는 여기서 이스라엘의 민족 또는 족속을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: οἰκτειρήσεις
  english_pob_choice: you will have compassion
  chosen_korean: 불쌍히 여기시고
  alternatives_korean:
  - 긍휼을 베푸시고
  - 자비를 베푸시고
  lexicon: οἰκτείρω
  rationale: 사람을 가엾게 여기며 돌보는 지속적 긍휼을 드러내는 동사로 보고, 합쇼체 서술에서 자연스러운 ‘불쌍히 여기시다’를 택했습니다.
- source_word: τὸ γένος Ἰσραὴλ
  english_pob_choice: the people of Israel
  chosen_korean: 이스라엘의 نسل을
  alternatives_korean:
  - 이스라엘 백성을
  - 이스라엘 집안을
  lexicon: γένος
  rationale: 본문은 단순한 정치 공동체보다 혈통적·민족적 ‘족속/계통’을 가리키므로, 일반화된 ‘백성’보다 출생·계열의 뉘앙스를 살리는 방향을 취했습니다.
- source_word: οὐκ ἀπώσεις
  english_pob_choice: you will not cast them off
  chosen_korean: 결코 버리지 않으실 것이며
  alternatives_korean:
  - 내치지 않으실 것이며
  - 물리치지 않으실 것이며
  lexicon: ἀπωθέω
  rationale: 하나님께서 자기 백성을 밀어내어 관계에서 떼어 놓지 않으신다는 뜻을 살려, 관계적 배제를 드러내는 ‘버리다’를 사용했습니다.
- source_word: ὑπὸ ζυγόν σου
  english_pob_choice: under your yoke
  chosen_korean: 당신의 멍에 아래에
  alternatives_korean:
  - 당신의 멍에 밑에
  - 당신의 멍에 아래
  lexicon: ζυγός
  rationale: 복종과 통제의 이미지를 그대로 살리는 표준적 표현으로 ‘멍에’를 유지했습니다.
- source_word: μάστιγα παιδίας σου
  english_pob_choice: the whip of your discipline
  chosen_korean: 당신의 징계의 채찍 아래에
  alternatives_korean:
  - 당신의 징계의 매 아래에
  - 당신의 훈육의 채찍 아래에
  lexicon: μάστιξ + παιδεία
  rationale: POB가 ‘rod’에서 ‘whip’로 수정한 점을 반영해, 고통을 수반하는 교정 도구인 ‘채찍’을 살리고 παιδεία는 단순 훈련이 아닌 징계로 옮겼습니다.
theological_decisions:
- issue: 하나님의 징계와 언약적 소속의 병치
  chosen_reading: 이스라엘은 하나님께서 불쌍히 여기시고 결코 버리지 않으실 대상이면서 동시에 그의 멍에와 징계 아래에 있는 공동체로 제시했습니다.
  alternative_readings:
  - 긍휼만 강조해 징계 이미지를 완화하는 읽기
  - 징계만 강조해 긍휼과 보존의 약속을 약화하는 읽기
  rationale: 본문은 자비와 훈육을 함께 붙들어 하나님의 언약적 관계가 해체되지 않음을 보여 주므로, 둘 중 하나를 지우지 않고 함께 보존했습니다.
  doctrine_reference: 언약적 신실하심, 히브리서 12장 징계 주제
