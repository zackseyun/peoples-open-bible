  text: 'My heart grew hot within me; as I meditated[a], a fire burned[b]. Then I spoke with my tongue:'
  footnotes:
  - marker: a
    text: Or “while I was musing” or “in my meditation.” The Hebrew term can denote inward musing or meditation.
    reason: lexical_alternative
  - marker: b
