translation:
  text: 'XIII.1. “In the third vision you saw her younger[g], beautiful, and cheerful, and her appearance
    was beautiful.”


    XIII.2. “When some good message[a] comes to someone who is grieving, he immediately forgets his former
    sorrows. He accepts[h] nothing else except the message he heard. From then on he is strengthened for
    the good, and his spirit is renewed because of the joy he received[p]. So also you have received a
    renewal of your spirits[i] by seeing these good things.”


    XIII.3. “Because you saw her sitting on a stool[b], the position is firm[j]. The stool has four feet[o]
    and stands firmly. For the world is also held together by four elements[c].”


    XIII.4. “Therefore those who have repented[f] completely will be new[d] and firmly founded[l], those
    who have repented from their whole heart[k]. You have the revelation complete[e]. Do not ask anything
    more about revelation[m]. But if anything is needed[n], it will be revealed to you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Good message renders angelia agathē, also good news or good tidings. It is a welcome report
      in the comparison, not an added technical title Gospel. Sinaiticus21.2’s first-hand good word is
      truncated, with ca completing it; its good-message wording is not counted as wholly intact first
      hand.
    reason: textual_variant
  - marker: b
    text: Stool retains the earlier adjudicated choice for sympselion, also bench or seat. The same Greek
      noun occurs twice in paragraph3, so stool now appears consistently in both places; the old second
      bench did not mark another object or a manuscript difference. Four feet alone does not establish
      the seat’s precise size or exclude bench as an alternative.
    reason: lexical_alternative
  - marker: c
    text: Four elements retains stoicheia and the selected ancient cosmological illustration rather than
      modernizing it. Earth, water, air and fire are the usual four-element framework; those names are
      not added to the main text. Sinaiticus21.3, Athos and Vulgata printed30 retain elements. Palatina
      printed59 instead says four angles, angulos, and the Ethiopic edition’s Latin rendering printed125
      four walls, parietibus. Those versions are not exact lexical corroboration of elements.
    reason: textual_variant
  - marker: d
    text: Will be new renders neoi esontai, also will be young or youthful. New retains the prior renewal
      interpretation, with the age-related alternative explicit. Vulgata printed30 has viridiores, more
      vigorous or flourishing; Palatina and the Ethiopic edition’s Latin rendering describe renewal in
      their different constructions. The selected future assertion is not softened to a possibility.
    reason: textual_variant
  - marker: e
    text: You have the revelation complete retains apecheis with holotelē, also you have the revelation
      in full. The having-in-full idiom is not translated as being far away. Complete concerns the revelation
      being discussed and is followed by an explicit provision for anything further needed; it does not
      add universal cessation of revelation.
    reason: lexical_alternative
  - marker: f
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: g
    text: Younger, beautiful, cheerful and beautiful in appearance retain all four parts of the selected
      portrait. Sinaiticus21.1 retains the fuller description. Athos PlateIV has the first three but omits
      the repeated beautiful-form clause; the omission is disclosed rather than silently imported into
      the working text.
    reason: textual_variant
  - marker: h
    text: Accepts and for the good retain the earlier documented choices for prosdechetai and eis to agathon,
      with welcomes or awaits and toward the good as alternatives. The Greek says nothing else except
      the heard message, not merely a preference among messages. Sinaiticus21.2 has S1 corrections to
      the accepts/heard/you word forms; those corrections are not independent manuscript votes. Full prior
      revision history remains archived.
    reason: lexical_alternative
  - marker: i
    text: The comparison first has a person’s singular spirit, then the plural your spirits for the audience.
      Sinaiticus21.2, Athos and Vulgata printed29 retain the plural community expression. Palatina printed59
      instead has a singular spirit and the Ethiopic edition’s Latin rendering printed125 a singular soul.
      The selected Greek number is not harmonized to those versions.
    reason: textual_variant
  - marker: j
    text: The position is firm retains ischyra hē thesis, the stability of the setting or seat. P.Amh.II190
      b–c verso, printed197, has a damaged initial construction; the edition proposes an alternative about
      a firm place but calls the construction obscure. That proposed repair is not a fully preserved reading
      or a reason to rewrite the selected phrase. The consulted PlateXXIV is too indistinct here for independent
      complete letter-level certification.
    reason: textual_variant
  - marker: k
    text: The selected text repeats those who have repented from their whole heart after the first complete-repentance
      statement. Sinaiticus21.4 omits the second hoi, those who, but retains the participial whole-heart
      phrase. The P.Oxy.4706 fragments4+5 edition likewise reports no second hoi, with only parts of the
      surrounding words preserved and other letters restored. Athos and Vulgata printed30 retain the repeated
      formulation. Palatina printed59 has a different future whole-heart repentance construction; it is
      not unqualified corroboration of Sinaiticus’s syntax. The Ethiopic edition’s Latin rendering also
      has a different foundation-of-repenters construction. The source’s repeated repentance and whole-heart
      qualification remain.
    reason: textual_variant
  - marker: l
    text: Firmly founded renders tethemeliōmenoi, also established or set on a foundation, coordinated
      with will be new. P.Oxy.4706 fragments4+5 and P.Amh.II190 b–c verso have surviving parts of the
      repentance/new/founded sequence with missing letters restored by editors; they do not preserve every
      word uninterrupted. The selected complete repentance, newness and foundation assertion all remain
      without counting complete reconstructions as visible ink.
    reason: textual_variant
  - marker: m
    text: No longer ask anything about revelation retains both the prohibition and peri apokalypseōs.
      Sinaiticus21.4 and Palatina printed59 omit the about-revelation phrase, while Athos and Vulgata
      printed30 retain it. The P.Oxy.4706 fragments4+5 edition also reports its absence, based partly
      on reconstructed line length and spacing; that is not described as direct visibility of a missing
      phrase. Its ask-ending differs from the Sinaiticus and Athos forms reported in the edition. The
      selected phrase remains, with the disagreement open.
    reason: textual_variant
  - marker: n
    text: If anything is needed, it will be revealed to you retains necessity, condition, definite future
      and recipient. Sinaiticus21.4’s difficult first-hand conditional is replaced by S1 with ean ti de
      deē; it is not an intact first-hand match. Palatina printed59 instead says if you ask, rogaveris.
      The Ethiopic edition’s Latin rendering has an explanation promise and an editorial proposal about
      its tense. P.Oxy.4706 fragments4+5’s restored conditional order and fronted to-you are conjectural
      from spacing; the editor explicitly notes difficulty fitting the remaining verb ending. These are
      not certain visible papyrus words or a reason to replace the working promise.
    reason: textual_variant
  - marker: o
    text: The four feet and firm standing of the stool remain. In the P.Oxy.4706 fragments4+5 edition,
      feet-have and elements-held word order are restored exempli gratia, so the papyrus cannot securely
      decide their order against P.Amh.II190. The Amherst edition prints has-feet and held-elements in
      different order, with damaged or restored letters. Oxford photographs of4706 fragments4+5 permit
      a bounded match of surviving word-parts, not a full fresh diplomatic transcription of every restored
      sentence. Two fragments of one papyrus are not two independent witnesses.
    reason: textual_variant
  - marker: p
    text: The message recipient forgets former sorrows, is strengthened for the good and has his spirit
      renewed because of the joy he received. The audience then receives renewal by seeing these good
      things. Both the stated cause and the seeing comparison remain; the English does not add a new condition
      for hearing the good message or omit its effects.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁράσει
  chosen: vision
  alternatives:
  - appearance
  - sight
  lexicon: LSJ
  rationale: Standard term for a seen revelation; preserves apocalyptic register.
- source_word: νεωτέραν
  chosen: younger
  alternatives:
  - newer
  - more youthful
  lexicon: LSJ
  rationale: Comparative of νέος; in context of the woman's changing appearance, age/youth is foregrounded.
- source_word: καλήν (x2)
  chosen: beautiful
  alternatives:
  - fair
  - good
  lexicon: LSJ
  rationale: Here describes physical/visible comeliness rather than moral goodness; 'beautiful' keeps
    aesthetic sense.
- source_word: ἱλαράν
  chosen: cheerful
  alternatives:
  - gracious
  - bright
  - joyful
  lexicon: LSJ
  rationale: Describes demeanor; 'cheerful' conveys the pleasant, joyful bearing.
- source_word: μορφή
  chosen: appearance
  alternatives:
  - form
  - shape
  lexicon: LSJ
  rationale: Refers to outward look rather than metaphysical 'form'; 'appearance' is clear and natural.
- source_word: λυπουμένῳ
  chosen: grieving
  alternatives:
  - sorrowing
  - distressed
  lexicon: BDAG
  rationale: Captures the ongoing experience of sorrow in an English participial form.
- source_word: ἀγγελία ἀγαθή
  chosen: good message
  alternatives:
  - good news
  - good tidings
  lexicon: LSJ
  rationale: Avoids importing later technical sense of 'Gospel' while conveying positive report.
- source_word: εὐθύς
  chosen: immediately
  alternatives:
  - immediately
  - straightway
  lexicon: BDAG
  rationale: Common adverb of immediacy; idiomatic modern English.
- source_word: ἐπελάθετο
  chosen: forgets
  alternatives:
  - he ceased to remember
  - he let go of
  lexicon: BDAG
  rationale: Aorist of ἐπιλανθάνομαι; 'forgot' is the straightforward equivalent.
- source_word: προτέρων λυπῶν
  chosen: former sorrows
  alternatives:
  - earlier griefs
  - previous troubles
  lexicon: LSJ
  rationale: Genitive of the earlier afflictions; 'former sorrows' is concise and natural.
- source_word: προσδέχεται
  chosen: accepts
  alternatives:
  - awaits
  - welcomes
  - concerns himself with
  lexicon: BDAG
  rationale: In context after hearing the message, the sense is taking in / embracing nothing else; 'accepts'
    captures this succinctly.
- source_word: ἰσχυροποιεῖται
  chosen: is strengthened
  alternatives:
  - is made strong
  - is fortified
  lexicon: LSJ
  rationale: Causative/passive sense of being made strong; preserves the moral strengthening idea.
- source_word: εἰς τὸ ἀγαθόν
  chosen: for the good
  alternatives:
  - toward the good
  - for what is good
  lexicon: BDAG
  rationale: Prepositional phrase marking direction/purpose; 'for the good' is concise.
- source_word: ἀνανεοῦται (τὸ πνεῦμα)
  chosen: is renewed
  alternatives:
  - is made new again
  - is refreshed
  lexicon: BDAG
  rationale: Standard rendering of renewal language; keeps the spiritual/moral nuance.
- source_word: ἀνανέωσιν
  chosen: renewal
  alternatives:
  - a making new
  - refreshing
  lexicon: BDAG
  rationale: Abstract noun matching the verb 'renew'; consistent with the previous clause.
- source_word: πνευμάτων (ὑμῶν)
  chosen: spirits
  alternatives:
  - spirit (collective)
  - inner selves
  lexicon: BDAG
  rationale: Retains the plural as in Greek, respecting Hermas' idiom for the inner life of multiple persons.
- source_word: συμψέλιον
  chosen: stool
  alternatives:
  - bench
  - seat
  lexicon: LSJ
  rationale: Retain the earlier stool choice consistently for both occurrences, with bench/seat alternatives.
    Four feet alone does not uniquely establish size or seat type.
- source_word: ἰσχυρὰ ἡ θέσις
  chosen: the position is firm
  alternatives:
  - the seat is set firmly
  - the place is strong
  lexicon: LSJ
  rationale: Focuses on the firmness of the seating/setting as explanation of the symbol.
- source_word: ὁ κόσμος
  chosen: the world
  alternatives:
  - the cosmos
  lexicon: BDAG
  rationale: In a cosmological statement about elements, 'world' is idiomatic while retaining scope.
- source_word: κρατεῖται
  chosen: is held together
  alternatives:
  - is sustained
  - is maintained
  lexicon: BDAG
  rationale: Transmits the idea of being kept in its state by something; 'held together' suits the four-element
    motif.
- source_word: στοιχείων
  chosen: elements
  alternatives:
  - elemental principles
  lexicon: BDAG
  rationale: Refers to the classical four elements (earth, water, air, fire) in ancient cosmology.
- source_word: μετανοέω
  chosen: repent
  alternatives:
  - change disposition and conduct
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Retain contextual moral repentance, repeated complete/whole-heart expressions and the work’s
    own imagery; no regret-only or uniform Godward formula imposed. Full historical terminology contract
    is separately preserved.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: ὁλοτελῶς
  chosen: completely
  alternatives:
  - entirely
  - fully
  lexicon: LSJ
  rationale: Adverb of totality; 'completely' is clear and forceful.
- source_word: νέοι (ἔσονται)
  chosen: new
  alternatives:
  - young
  lexicon: LSJ
  rationale: Given the renewal theme, 'new' better conveys moral/spiritual newness; 'young' is a viable
    alternative but less fitting with 'founded' that follows.
- source_word: τεθεμελιωμένοι
  chosen: firmly founded
  alternatives:
  - established
  - set on a foundation
  lexicon: BDAG
  rationale: Perfect participle of θεμελιόω; building imagery suggests stability; 'firmly founded' keeps
    the metaphor.
- source_word: ἐξ ὅλης καρδίας
  chosen: from their whole heart
  alternatives:
  - with all their heart
  - wholeheartedly
  lexicon: BDAG
  rationale: Literal phrasing preserves biblical register and intensity of devotion.
- source_word: ἀπέχεις
  chosen: you have (in full)
  alternatives:
  - you possess fully
  - you are paid in full
  lexicon: BDAG
  rationale: Commercial idiom of having in full; here, 'have the revelation in full' captures the sense.
- source_word: ὁλοτελῆ (ἀποκάλυψιν)
  chosen: complete
  alternatives:
  - entire
  - full
  lexicon: LSJ
  rationale: Adjective of wholeness; 'complete' communicates the totality of the revelation given.
- source_word: ἀποκάλυψις
  chosen: revelation
  alternatives:
  - disclosure
  - unveiling
  lexicon: BDAG
  rationale: Standard theological term; also matches Hermas' visionary setting.
- source_word: μηκέτι μηδὲν αἰτήσεις
  chosen: No longer ask anything
  alternatives:
  - no longer ask anything
  - do not request anything more
  lexicon: BDAG
  rationale: Captures the prohibition of further inquiry; 'further' clarifies 'μηκέτι' without over-expansion.
- source_word: δέῃ
  chosen: is needed
  alternatives:
  - is necessary
  - should be required
  lexicon: BDAG
  rationale: Conditional necessity; 'is needed' keeps it succinct.
- source_word: ἀποκαλυφθήσεταί σοι
  chosen: it will be revealed to you
  alternatives:
  - it will be disclosed to you
  - it will be unveiled to you
  lexicon: BDAG
  rationale: Passive future of ἀποκαλύπτω; standard rendering remains clear.
