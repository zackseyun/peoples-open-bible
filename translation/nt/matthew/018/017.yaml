  category: source_correction
  tier: 1
  from: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
  to: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like a Gentile and a tax collector.
  rationale: The Greek definite article here is generic, representing a class or category. In English, this is most naturally and accurately rendered with the indefinite article 'a'. Translating it as 'the' sounds overly specific, as if referring to a particular individual, which misrepresents the generic force of the Greek article.
- timestamp: '2026-11-09T20:32:16Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like a Gentile and a tax collector.
  to: But if he refuses to listen to them, tell it to the congregation. If he refuses to listen even to the congregation, treat him as you would a Gentile or a tax collector[a].
  rationale: The later review rightly recognized the generic articles and replaced “the Gentile and the tax collector” with indefinite forms. I preserve that gain, use “congregation” to clarify the believing community, and retain the outsider comparison rather than adding a developed procedure of excommunication.
