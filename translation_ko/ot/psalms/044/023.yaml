revisions:
- from: 주님의 탓으로 우리는 종일 죽임을 당하며, 도살될 양처럼 여겨집니다.[a][b]
  to: 주님, 깨어나십시오! 어찌하여 주무십니까? 일어나십시오. 우리를 영원히 버리지 마십시오.
  rationale: 지정된 WLC 본문을 직접 반영하여 절 자체의 내용을 바로잡았습니다. 하나님의 잠과 각성이라는 의인화된 탄원을 완화하거나 해석적으로 바꾸지 않았습니다. 두 개의 각성 동사를 ‘깨어나십시오’와 ‘일어나십시오’로 달리 번역하여 히브리어의 병행과 강조를 유지했으며, לָנֶצַח는 ‘영원히’, תִּזְנַח는 문맥상 자연스러운 ‘버리지 마십시오’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:07:19Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 시편 44:23이 아니라 바로 앞 절(44:22)의 내용(‘우리는 종일 죽임을 당하며…’)을 번역하므로, 지정된 히브리어 본문 및 영어 POB와 일치하지 않습니다. 44:23의 하나님께 드리는 ‘잠에서 깨어나시라’는 탄원과 ‘영원히 버리지 마시라’는 간구를 번역해야 합니다.
  naturalness: 수정문은 현대 표준 한국어와 합쇼체에 맞으며, 탄원의 직접적이고 시적인 어조를 유지합니다. ‘어찌하여’는 시편의 격조를 지키면서도 현대 독자에게 자연스럽습니다.
  terminology: אֲדֹנָי는 호격 ‘주님’으로, עוּרָה와 הָקִיצָה는 각각 ‘깨어나십시오’와 ‘일어나십시오’로 옮겨 병행되는 각성 요청을 살렸습니다. זנח는 문맥상 ‘버리다’로 자연스럽게 번역했습니다.
  issues:
  - severity: high
    issue: 절 본문 불일치
    rationale: 제출된 한국어 본문과 어휘 결정은 시편 44:22(כִּי עָלֶיךָ...)에 관한 것이지만, 검토 대상 원문은 시편 44:23(עוּרָה לָמָּה תִישַׁן...)입니다. 따라서 본문과 각주를 해당 절에 맞게 전면 교체해야 합니다.
  - severity: medium
    issue: 각주 앵커 및 내용 불일치
    rationale: 현행 [a][b] 각주는 44:22의 ‘주님 때문에’와 ‘도살될 양’에 관한 것이므로 44:23에는 적용될 수 없습니다. 영어 감사 기록의 대안 ‘cast us off forever’는 한국어 본문에서 별도 각주 없이 ‘영원히 버리지 마십시오’로 자연스럽게 포괄됩니다.
  revised_text: 주님, 깨어나십시오! 어찌하여 주무십니까? 일어나십시오. 우리를 영원히 버리지 마십시오.
