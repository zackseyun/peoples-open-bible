source:
  edition: WLC
  text: אֱֽלֹהִ֗ים אַתָּ֣ה יָ֭דַעְתָּ לְ/אִוַּלְתִּ֑/י וְ֝/אַשְׁמוֹתַ֗/י מִמְּ/ךָ֥ לֹא נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/005.yaml
  text: God, you know my foolishness[a], and my wrongs[b] are not hidden from you.
  footnotes:
  - marker: a
    text: Or “my folly.”
    reason: lexical_alternative
  - marker: b
