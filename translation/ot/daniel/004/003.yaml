id: DAN.4.3
reference: Daniel 4:3
source:
  edition: WLC
  text: וּ/מִנִּ/י֙ שִׂ֣ים טְעֵ֔ם לְ/הַנְעָלָ֣ה קָֽדָמַ֔/י לְ/כֹ֖ל חַכִּימֵ֣י בָבֶ֑ל דִּֽי פְשַׁ֥ר חֶלְמָ֖/א יְהֽוֹדְעֻנַּֽ/נִי־׃
translation:
  text: Then I issued a decree that all the wise men of Babylon be brought before me to tell me the interpretation of the dream.
  philosophy: dynamic
lexical_decisions:
- source_word: וּמִנִּי
  chosen: And by me
  alternatives:
  - And from me
  - Then by me
  lexicon: HALOT
  rationale: The preposition מן with the 1cs suffix indicates source/origin, and in this royal-administrative context idiomatic English is 'by me,' expressing that the decree proceeded from the king. The prefixed conjunction is retained as 'And.'
- source_word: שִׂים
  chosen: was issued
  alternatives:
  - was set
  - was made
  - I made
  lexicon: HALOT
  rationale: Although the verb literally means 'set/place,' in Aramaic administrative usage with טעם it denotes the issuing or setting forth of a decree. English passive 'was issued' best captures the idiom naturally while preserving the formal sense.
- source_word: טְעֵם
  chosen: a decree
  alternatives:
  - an order
  - a command
  lexicon: HALOT
  rationale: In Imperial Aramaic this noun commonly refers to an official decision, decree, or command. 'Decree' fits the royal setting and pairs naturally with 'was issued.'
- source_word: לְהַנְעָלָה
  chosen: to bring
  alternatives:
  - to bring in
  - to cause to come up
  lexicon: HALOT
  rationale: 'The haphel infinitive of עלל/עלה here has a causative sense: causing persons to come before the king. ''To bring'' is concise and idiomatic; ''bring before me'' captures the full force with the following phrase.'
- source_word: קָדָמַי
  chosen: before me
  alternatives:
  - into my presence
  - in my presence
  lexicon: HALOT
  rationale: The noun for 'front/presence' with 1cs suffix means 'before me' or 'in my presence.' 'Before me' is the most direct and natural rendering in this court context.
- source_word: לְכֹל
  chosen: all
  alternatives:
  - to all
  lexicon: HALOT
  rationale: With the infinitive construction and object phrase, the sense is that all the wise men were to be brought. English expresses this naturally as 'all the wise men' rather than preserving the preposition woodenly.
- source_word: חַכִּימֵי בָבֶל
  chosen: the wise men of Babylon
  alternatives:
  - Babylon's wise men
  - the sages of Babylon
  lexicon: HALOT
  rationale: The construct phrase denotes the class of court experts in Babylon. 'Wise men' is the standard and sufficiently transparent rendering; 'sages' is possible but less tied to the court setting in Daniel.
- source_word: דִּי
  chosen: that
  alternatives:
  - so that
  - in order that
  lexicon: HALOT
  rationale: The particle introduces the purpose/result clause. 'That' is simple and natural in English, with purposive force supplied by the context.
- source_word: פְשַׁר
  chosen: the interpretation
  alternatives:
  - the meaning
  - the explanation
  lexicon: HALOT
  rationale: This noun in Daniel regularly refers to the interpretation of dreams or mysteries. 'Interpretation' preserves the technical sense used throughout the book.
- source_word: חֶלְמָא
  chosen: the dream
  alternatives:
  - my dream
  lexicon: HALOT
  rationale: The noun bears the emphatic state, 'the dream.' Although context makes it the king's dream, the possessive is not explicit here, so the translation avoids adding 'my' to remain closer to the source.
- source_word: יְהוֹדְעֻנַּנִי
  chosen: they might make known to me
  alternatives:
  - they might tell me
  - they might inform me
  lexicon: HALOT
  rationale: The causative/imperfect form of ידע with 1cs object means 'cause me to know,' hence 'make known to me.' This preserves both the verbal force and the indirect-object nuance.
