id: PSA.92.10
reference: Psalms 92:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּ֣רֶם כִּ/רְאֵ֣ים קַרְנִ֑/י בַּ֝לֹּתִ֗י בְּ/שֶׁ֣מֶן רַעֲנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/010.yaml
  text: But you have raised my horn like that of a wild ox[a]; I am moistened with fresh oil.[b]
  footnotes:
  - marker: a
    text: The Hebrew re'em denotes a powerful wild bovine, traditionally rendered “wild ox.” Older translations sometimes have “unicorn.”
    reason: cultural_note
  - marker: b
    text: The Hebrew verb is unusual; possible senses include “moistened” or “mixed” with oil. Traditionally, it has often been rendered “anointed.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주께서는 제 뿔을 들소[a]의 뿔처럼 높이 드셨으며, 저는 신선한 기름으로 기름 부음을 받았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רְאֵם은 힘센 야생 소를 가리킵니다. 전통적으로 ‘들소’ 또는 ‘야생 황소’로 옮기며, 오래된 번역들에는 ‘유니콘’이라는 표현도 있습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 동사는 드물고 정확한 뉘앙스가 논쟁적입니다. 더 문자적으로는 ‘신선한 기름으로 적셔졌다’ 또는 ‘섞였다’로 이해될 수 있습니다.
    reason: lexical_alternative
