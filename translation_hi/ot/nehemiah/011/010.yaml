  choice: इसे याजकों की सूची में यदायाह के बाद एक अलग नाम माना गया है।
  alternative: इसे यदायाह की वंशावली या उपाधि का हिस्सा समझना।
  rationale: मसोरेटिक विराम-चिह्न और पद की सूची-संरचना याकीन को समानांतर रूप से अगला नाम मानने का समर्थन करती है; इसलिए हिन्दी में 'और' जोड़कर संबंध स्पष्ट किया गया है।
