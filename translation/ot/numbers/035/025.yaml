  meaning: The assembly must protect the person who killed unintentionally, return him to refuge, and require him to remain there until the anointed high priest dies.
  meaning_decisions:
  - source_phrase: הָעֵדָה
    prior_rendering: the congregation
    new_rendering: the assembly
    rationale: The same communal judicial body named in verse 24 now carries out the protective decision.
  - source_phrase: הָרֹצֵחַ
    prior_rendering: the manslayer
    new_rendering: the one who killed
    rationale: The phrase identifies the person who caused the death without imposing the culpability conveyed by 'murderer' or relying on an older technical term.
  - source_phrase: מִיַּד ... וְהֵשִׁיבוּ אֹתוֹ
    prior_rendering: from the hand of ... shall return him
    new_rendering: from the power of ... bring him back
    rationale: The hand idiom denotes the avenger's power over the person, and the return is caused by the assembly.
  - source_phrase: וְיָשַׁב בָּהּ
    prior_rendering: he shall live in it
    new_rendering: He must remain there
    rationale: The residence is a binding restriction, not merely a description of where he will live, as verses 26–28 make clear.
  - source_phrase: אֲשֶׁר מָשַׁח אֹתוֹ בְּשֶׁמֶן הַקֹּדֶשׁ
    prior_rendering: whom he was anointed with the holy oil
    new_rendering: who was anointed with the holy oil
    rationale: The Hebrew leaves the anointing agent unstated; an English passive conveys the high priest's anointing without wrongly identifying an agent or reproducing an ungrammatical clause.
  footnote_kinds: {}
