translation:
  text: Tryphon welcomed Jonathan with honor, introduced him to all his court officials[a], and gave him gifts. He ordered his officials and troops to obey Jonathan as they obeyed him.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Greek 'friends,' a designation for members of a Hellenistic ruler's court or inner circle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξατο
  chosen: received
  alternatives:
  - welcomed
  - accepted
  lexicon: LSJ
  rationale: The middle of ἐπιδέχομαι here denotes receiving or welcoming a person. 'Received' is slightly more formal and pairs naturally with the adverb ἐνδόξως, while avoiding over-interpretation beyond the Greek.
- source_word: ἐνδόξως
  chosen: honorably
  alternatives:
  - gloriously
  - with honor
  - splendidly
  lexicon: LSJ
  rationale: The adverb conveys honorable or distinguished treatment. 'Honorably' gives clear modern English and fits the courtly context better than the more wooden 'gloriously.'
- source_word: συνέστησεν
  chosen: introduced
  alternatives:
  - presented
  - commended
  - made known
  lexicon: LSJ
  rationale: In context, with αὐτὸν πᾶσιν τοῖς φίλοις αὐτοῦ, the sense is that he presented or introduced Jonathan to his associates. 'Introduced' is the most idiomatic English for this social-political setting.
- source_word: φίλοις
  chosen: friends
  alternatives:
  - courtiers
  - allies
  - companions
  lexicon: LSJ
  rationale: The Greek literally says 'friends.' In Hellenistic royal contexts this can function as a court title, but the text itself uses the ordinary term. The literal rendering is retained, with the political nuance left implicit rather than imported into the main text.
- source_word: δόματα
  chosen: gifts
  alternatives:
  - presents
  lexicon: LSJ
  rationale: A straightforward rendering of the plural noun for gifts or presents. 'Gifts' is natural and sufficiently formal.
- source_word: δυνάμεσιν
  chosen: forces
  alternatives:
  - troops
  - military forces
  - power
  lexicon: LSJ
  rationale: Here the plural refers to military forces under the ruler's authority. 'Forces' is concise and accurate; 'power' would be too abstract.
- source_word: ὑπακούειν
  chosen: to obey
  alternatives:
  - to listen to
  - to submit to
  lexicon: LSJ
  rationale: The infinitive means to obey or heed. In this command context, 'to obey' best captures the force of the order.
- source_word: ὡσαύτως
  chosen: likewise
  alternatives:
  - also
  - in the same way
  lexicon: LSJ
  rationale: The adverb indicates that his friends and forces were to treat Jonathan in the same manner. 'Likewise' preserves that comparative sense compactly.
