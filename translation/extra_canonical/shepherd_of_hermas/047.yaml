translation:
  text: '1. He says to me, “You, the servants of God, know that you live in a foreign land; for your city
    is far from this city. If, then, you know your city in which you are going to live, why do you prepare
    fields, costly establishments, buildings and useless dwellings here?”


    2. “Therefore, whoever prepares these things for this city does not intend[a] to return to his own
    city.”


    3. “Foolish, double-minded and wretched man, do you not understand that all these things belong to
    another and are under the authority of another? For the lord of this city will say, ‘I do not want
    you to dwell in my city; rather, go out from this city, because you do not make use of my laws.’”


    4. “So then, you—having fields, dwellings and many other possessions[b]—when you are cast out by him,
    what will you do with your field, your house and the rest of the things you have prepared for yourself?
    For the lord of this land says to you rightly, ‘Either make use of my laws, or withdraw from my land.’”


    5. “So what are you going to do, having a law in your own city? For the sake of your fields and the
    rest of your property, will you altogether deny your law and walk by the law of this city? Watch lest
    denying your law be harmful. For if you wish to return to your city, you will certainly not be received,
    because you denied the law of your city[c], and you will be shut out from it.”


    6. “Look to yourself, then. As one living in a foreign land, prepare nothing more for yourself than
    the sufficient provision you need. Be ready, so that when the master of this city wishes to cast you
    out for opposing his law, you may leave his city and go to your own city, and use your own law without
    insult, rejoicing[d].”


    7. “So take care, you who serve God[e] and have him in your heart. Do the works of God, remembering
    his commandments and the promises he made; and believe him that he will fulfill them, if his commandments
    are kept.”


    8. “Therefore, instead of fields, buy afflicted souls[f], as each person is able. Visit widows and
    orphans and do not overlook them. Spend your wealth and all your establishments on such fields and
    houses, which you received from God.”


    9. “For to this end the Master has made you rich, that you might carry out these ministries for him.
    It is far better to buy such fields and estates[g] and houses, which you will find in your city when
    you arrive in it.”


    10. “This luxury is good and cheerful[h], having neither grief nor fear, but having joy. So do not
    practice the luxury of the nations, for it is unprofitable for you, the servants of God.”


    11. “Rather practice your own luxury, in which you can rejoice, and do not corrupt it[i]. Do not touch
    what belongs to another or desire it, for it is evil to desire another’s things. Do your own work,
    and you will be saved.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: 'Project edition-comparison report: Printed Lightfoot/Harmer 1891 p.341 has does not intend
      (διανοεῖται), attributed to Hollenberg with L1/L2/E support, against reported Athos can (δύναται).
      The earlier project transcription accidentally used the reported alternative in its printed body.
      Vulgata p.69 and Palatina p.133 read non cogitat, does not think of returning. The working transcription
      is corrected to the printed choice; no new Athos photograph collation is claimed.'
  - marker: b
    reason: textual_variant
    text: 'Project edition-comparison report: Printed p.342 attributes possessions (ὑπάρξεις) to Gebhardt,
      comparing property in paragraph5, against reported Athos actions (πράξεις). Palatina p.133 describes
      many other supplies or possessions (aliosque multos apparatus). The working editorial choice is
      retained; the Latin is not a second Greek manuscript.'
  - marker: c
    reason: textual_variant
    text: The printed working Greek places because you denied the law of your city in square brackets.
      The translation retains that editorially marked clause with this disclosure; the brackets are not
      a claim of unanimous preserved Greek wording. Palatina p.133 has a differently worded condition,
      if you depart from its law.
  - marker: d
    reason: textual_variant
    text: 'Project edition-comparison report: Printed p.342 discloses editorial choices wishes (θέλῃ)
      against reported Athos comes (ἔλθῃ), to your city against in your city, and rejoicing without the
      reported Athos and. Vulgata p.70 and Palatina p.133 have wishes and movement to the city. Both Latin
      editions retain the no-injury and joyful sense. These are bounded edition reports, not fresh manuscript
      authentication.'
  - marker: e
    reason: textual_variant
    text: 'Project edition-comparison report: Printed p.342 attributes God here to Harmer with L1/L2,
      against reported Athos/E Lord. Vulgata p.70 and Palatina p.133 have God (deo). This working reading
      is retained, with God/Lord distinguished. Servant/serve follows current project policy; bonded status,
      belonging and allegiance remain part of the source’s range.'
  - marker: f
    reason: lexical_alternative
    text: Buy afflicted souls preserves the pointed Greek buying metaphor (ἀγοράζετε ψυχὰς θλιβομένας),
      with care for widows and orphans immediately following. Vulgata p.70 and Palatina p.135 speak of
      redeeming souls from need. Rescue or redeem distressed people is a possible explanatory rendering;
      neither a literal slave purchase nor a wholly spiritual transaction is specified by this clause
      alone.
  - marker: g
    reason: textual_variant
    text: The printed working Greek marks and estates (καὶ κτήματα) in square brackets. The phrase is
      retained and its editorial uncertainty disclosed; it is not unqualified manuscript wording. Palatina
      p.135 instead lists such houses and fields. Vulgata p.70–71 has a substantially different explanation
      that material fields and houses perish but works for God will be found in one’s city.
  - marker: h
    reason: textual_variant
    text: 'Project edition-comparison report: Printed p.343 attributes cheerful (ἱλαρά) to Hilgenfeld
      with L2/E, against reported Athos holy (ἱερά); L1 differs. Palatina p.135 has good and cheerful
      joys (iucunditates bonae hilaresque), while Vulgata p.71 speaks of joy without sadness and fear.
      The working cheerful reading and the luxury metaphor are retained.'
  - marker: i
    reason: lexical_alternative
    text: Corrupt renders παραχαράσσετε, also counterfeiting or falsifying, here in the luxury/property
      contrast. The printed Palatina p.135 has adulterare, with a Greek gloss explaining corruption; this
      does not compel a sexual-adultery interpretation. The command against touching or desiring another’s
      property and the final salvation assertion remain explicit.
