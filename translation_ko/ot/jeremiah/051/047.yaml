source:
  edition: WLC
  text: לָ/כֵן֙ הִנֵּ֣ה יָמִ֣ים בָּאִ֔ים וּ/פָקַדְתִּי֙ עַל פְּסִילֵ֣י בָבֶ֔ל וְ/כָל אַרְצָ֖/הּ תֵּב֑וֹשׁ וְ/כָל חֲלָלֶ֖י/הָ יִפְּל֥וּ בְ/תוֹכָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/047.yaml
  text: Therefore, look, days are coming when I will punish the carved images of Babylon, and all her land will be put to shame, and all her slain will fall in her midst.
translation:
  language: ko
  text: 그러므로 보십시오, 날들이 오고 있습니다. 내가 바벨론의 조각한 우상들을 벌하겠습니다. 그 땅 전체가 수치를 당하고, 그 한가운데에 죽임을 당한 자들이 모두 쓰러질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה / english 'look'
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오
  lexicon: source discourse marker
  rationale: 예언적 경고의 청유/주목 표지를 한국어 합쇼체로 살리기 위해 ‘보십시오’를 선택했습니다. POB의 'look'을 단순 접속어로 약화시키지 않으면서도 현대 문체에 맞춥니다.
- source_word: פְּסִילֵי
  english_pob_choice: carved images
  chosen_korean: 조각한 우상들
  alternatives_korean:
  - 새긴 형상들
  - 새긴 우상들
  - 조각상들
  lexicon: 우상/형상 어휘
  rationale: פְּסִילִים은 단순 조형물이 아니라 우상 숭배 대상이므로 ‘우상’을 포함해야 하며, 조각 제작의 결과라는 점을 드러내기 위해 ‘조각한’으로 옮겼습니다.
- source_word: וּפָקַדְתִּי
  english_pob_choice: I will punish
  chosen_korean: 벌하겠습니다
  alternatives_korean:
  - 심판하겠습니다
  - 갚겠습니다
  - 찾아가겠습니다
  lexicon: 동사 פקד의 심판 문맥
  rationale: 여기서는 ‘돌보다’가 아니라 심판적 방문의 의미이므로, POB의 'punish'를 자연스럽게 반영하는 ‘벌하다’가 적절합니다.
- source_word: בְתוֹכָהּ
  english_pob_choice: in her midst
  chosen_korean: 그 한가운데에
  alternatives_korean:
  - 그 가운데에
  - 그들 가운데에
  - 안에
  lexicon: 공간 부사구
  rationale: ‘in her midst’의 중심적 공간 이미지를 살리기 위해 ‘한가운데에’로 옮겼습니다. 뒤의 ‘쓰러질 것입니다’와 결합해 전멸의 장면을 선명하게 합니다.
theological_decisions:
- issue: 바벨론의 우상과 땅의 수치, 그리고 죽은 자들의 붕괴 장면을 어떻게 함께 살릴 것인가
  chosen_reading: 우상 심판, 땅의 수치, 시체들의 붕괴를 각각 병렬로 유지했습니다.
  alternative_readings:
  - 우상 심판만 강조하고 나머지를 완화하는 번역
  - ‘수치’ 대신 ‘부끄러움’으로 약화하는 번역
  rationale: 히브리어는 세 개의 결과를 병렬로 제시하므로, 심판-수치-파멸의 강도를 줄이지 않고 그대로 유지해야 합니다.
  doctrine_reference: 예언서의 심판 선언과 우상 폐기의 직접성
