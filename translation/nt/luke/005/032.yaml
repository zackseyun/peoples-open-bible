theological_decisions:
- issue: Whether to imply that Jesus denies the existence of any truly righteous people or speaks phenomenologically/socially
  chosen_reading: Retain the literal categories 'the righteous' and 'sinners' without interpretive qualification.
  alternative_readings:
  - those who think they are righteous
  - those considered righteous
  rationale: The verse itself states the contrast without explicit irony markers. Adding qualification would import an interpretive conclusion from broader context rather than translate the Greek as given. This preserves theological tension rather than resolving it.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: Context-sensitive reorientation terminology
  chosen_reading: I have not come to call the righteous, but sinners to a reorientation toward God[a].
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
