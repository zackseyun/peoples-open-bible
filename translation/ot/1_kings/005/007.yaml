    rationale: Identifies their established administrative role without relying on the less informative modern term 'deputies.'
  - source_phrase: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
    prior_rendering: and for all who came near the table of King Solomon
