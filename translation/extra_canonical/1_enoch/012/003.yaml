translation:
  text: 'And I, Enoch, was blessing the Lord of majesty and the King of the ages.
    And behold, the Watchers called me, Enoch the scribe, and said to me:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ages” renders ዓለም, which can also mean “world” or “eternity.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ኮንኩ፡ እባርኮ
  chosen: was blessing
  alternatives:
  - blessed
  rationale: Retains the ongoing action expressed by the construction.
- source_word: እግዚአ፡ ዕበይ
  chosen: Lord of majesty
  alternatives:
  - Lord of greatness
  rationale: Preserves the title’s noun construction while expressing its elevated
    sense in readable English.
- source_word: ነጉሠ፡ ዓለም
  chosen: King of the ages
  alternatives:
  - King of the world
  - King of eternity
  rationale: ዓለም can denote an age, the world, or eternity; “ages” preserves the temporal
    sense without excluding the broader range.
- source_word: ትጉሃን
  chosen: Watchers
  alternatives:
  - wakeful ones
  rationale: Retains the distinctive designation for these beings rather than replacing
    it with the generic “angels.”
- source_word: ጸሓፊ
  chosen: scribe
  alternatives:
  - writer
  rationale: Identifies Enoch by his writing role in a concise, established English
    term.
theological_decisions:
- issue: The identity of those who call Enoch
  chosen_reading: Watchers
  alternative_readings:
  - angels
  rationale: The verse names the beings as Watchers; a generic designation would obscure
    its local apocalyptic terminology.
