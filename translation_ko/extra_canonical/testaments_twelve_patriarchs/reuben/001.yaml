base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001.yaml
  text: 'A copy of the testament of Reuben, what he commanded his sons before he died, in the one hundred and twenty-fifth year of his life.


    2 Two years after the death of Joseph his brother, when Reuben had fallen sick, the sons of Joseph and the sons of his sons were gathered to visit him. 3 And he said to them, “My children, behold, I am dying, and I am going the way of my fathers.” 4 Then, seeing there Judah and Gad and Asher, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am failing.” 5 And rising up, he kissed them and said to them, “Hear, my brothers and my sons; pay attention to Reuben your father in the things that I command you.


    6 “And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was poured out and defiled the bed of my father Jacob. 7 And I tell you that he struck me with a severe blow in my loins for seven months; and if my father Jacob had not prayed for me to the Lord, the Lord would have been willing to destroy me. 8 For I was thirty years old when I did the evil thing before the Lord, and for seven months I was weakened to the point of death. 9 And after this, with the resolve of my soul, I repented before the Lord for seven years. 10 And I drank no wine or strong drink, and meat did not enter my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great—such a thing had not happened in Israel.”'
translation:
  language: ko
  text: '이는 르우벤의 유언서 사본입니다. 곧 그가 죽기 전에 자기 아들들에게 명한 것으로, 그의 생애 백이십오 년째에 한 말입니다.


    2 그의 형제 요셉이 죽은 지 두 해 뒤, 르우벤이 병들자 요셉의 아들들과 그의 아들들의 아들들이 그를 찾아보려고 모였습니다. 3 그가 그들에게 말했습니다. “내 자녀들아, 보십시오. 나는 죽어 가며 내 조상들의 길로 갑니다. 4 그런데 그곳에 있는 자기 형제 유다와 갓과 아셀을 보고, 그들에게 말했습니다. ‘나를 일으켜 세워 주십시오. 그러면 내가 내 형제들과 내 자녀들에게 내 마음속에 숨겨 둔 것들을 말하겠습니다. 보십시오, 나는 이제 기력이 다해 갑니다.’ 5 그리고 일어나 그들에게 입을 맞추고 말했습니다. ‘내 형제들과 내 아들들아, 들으십시오. 내가 너희에게 명하는 것을 너희 아버지 르우벤에게서 잘 들으십시오.


    6 보십시오, 오늘 나는 하늘의 하나님을 너희에게 불리한 증인으로 부릅니다. 너희는 젊은 시절의 무지와 성적 부도덕 가운데 행하지 마십시오. 나는 그 가운데서 쏟아져 나왔고 내 아버지 야곱의 침상을 더럽혔습니다. 7 내가 너희에게 말합니다. 그분께서 일곱 달 동안 내 허리에 심한 타격을 주셨습니다. 내 아버지 야곱이 나를 위하여 주님께 기도하지 않았더라면, 주님께서는 나를 멸하셨을 것입니다. 8 나는 주님 앞에서 그 악한 일을 저질렀을 때 서른 살이었고, 일곱 달 동안 죽음에 이를 만큼 쇠약해졌습니다. 9 그 후 나는 내 영혼의 결단으로 주님 앞에서 일곱 해 동안 회개했습니다. 10 나는 포도주와 독주를 마시지 않았고, 고기는 내 입에 들어오지 않았으며, 욕망의 빵도 먹지 않았습니다. 오히려 나는 내 죄 때문에 슬퍼했습니다. 그 죄는 매우 컸으며, 이스라엘에서는 그와 같은 일이 일어난 적이 없었습니다.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ἔτη δύο τῆς τελευτῆς Ἰωσὴφ
  english_pob_choice: Two years after the death of Joseph his brother
  chosen_korean: “요셉이 그의 형제였으므로, 그가 죽은 지 이 년 뒤에”
  alternatives_korean:
  - “요셉이 그의 형제였으므로, 그가 죽은 후 이 년 뒤에”
  - “요셉의 죽음 후 이 년이 지나”
  lexicon: τελευτή
  rationale: τελευτή는 단순한 ‘죽음’보다 ‘임종/죽음’의 사건을 가리키므로, 사건성을 살리되 문맥상 자연스럽게 옮겼습니다.
- source_word: ἐν ἀγνοίᾳ νεότητος καὶ πορνείᾳ
  english_pob_choice: in the ignorance of youth and in sexual immorality
  chosen_korean: “젊은 시절의 무지와 성적 부도덕”
  alternatives_korean:
  - “젊은 시절의 무지와 음행”
  - “청년기의 무지와 성적 부도덕”
  lexicon: ἀγνοία / πορνεία
  rationale: ἀγνοία는 단순 무지가 아니라 도덕적 무지·분별 없음의 뉘앙스가 있어 ‘무지’로 두되, πορνεία는 본문이 요구하는 성적 행위의 부정을 분명히 드러내기 위해 ‘성적 부도덕’으로 옮겼습니다.
- source_word: ἐξεχύθην ἐγὼ καὶ ἐμίανα κοίτην τοῦ πατρός μου Ἰακώβ
  english_pob_choice: in which I was poured out and defiled the bed of my father Jacob
  chosen_korean: “그 가운데서 나는 쏟아져 나오고 내 아버지 야곱의 침상을 더럽혔습니다”
  alternatives_korean:
  - “그 가운데서 나는 쏟아져 흘러나와 내 아버지 야곱의 침상을 더럽혔습니다”
  - “그 가운데서 나는 쏟아졌고 내 아버지 야곱의 침상을 더럽혔습니다”
  lexicon: ἐκχέω / κοίτη
  rationale: POB의 ‘poured out’는 문자적이면서도 수치와 성적 타락의 이미지를 유지하므로 ‘쏟아져 나오고’로 살렸고, κοίτη는 단순 ‘침상’이 아니라 혼인/성적 침상을 포함할 수 있어 직역에 가깝게 ‘침상’으로 두었습니다.
- source_word: πληγῇ μεγάλῃ ἐπὶ τῆς λαγόνος μου
  english_pob_choice: with a severe blow in my loins
  chosen_korean: “내 넓적다리에 이레 동안 큰 매를 내리셨습니다”
  alternatives_korean:
  - “내 허리에 큰 매를 내리셨습니다”
  - “내 넓적다리에 심한 타격을 주셨습니다”
  lexicon: λαγών
  rationale: λαγών은 복부/허리보다 생식과 연결되는 하체를 가리킬 수 있어, 본문의 수치와 징계의 신체성을 살려 ‘넓적다리’로 옮겼습니다.
theological_decisions:
- issue: 하늘의 하나님과 주님(Κύριος) 호칭 처리
  chosen_reading: 본문의 Θεὸν τοῦ οὐρανοῦ는 ‘하늘의 하나님’으로, 이어지는 Κύριος는 문맥상 동일한 주님으로 옮기되 야훼 표기는 두지 않았습니다.
  alternative_readings:
  - ‘하늘의 하나님’/‘야훼’
  - ‘하늘의 하나님’/‘주’
  rationale: 이 문서는 외경/가명문헌의 번역이므로, 본문 자체의 Κυριος를 예수 관련 인용으로 처리할 근거는 없지만, 히브리어 원명 복원도 확정적이지 않아 보수적으로 ‘주님’으로 유지했습니다.
  doctrine_reference: 문헌비평 및 외경 번역 원칙
- issue: ‘나는 쏟아져 나오고’의 도덕적·육체적 이미지 유지
  chosen_reading: POB의 ‘I was poured out’를 설명적으로 순화하지 않고, 수치와 성적 타락을 함께 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘나는 무너졌고’
  - ‘나는 내던져졌고’
  rationale: 원문은 자기 비난의 강한 은유를 통해 죄의 오염성과 파괴성을 드러내므로, 이를 약화하지 않는 것이 문맥상 더 충실합니다.
  doctrine_reference: 본문의 자기고백적 회개 수사
