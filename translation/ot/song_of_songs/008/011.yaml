id: SNG.8.11
reference: Song of Songs 8:11
source:
  edition: WLC
  text: כֶּ֣רֶם הָיָ֤ה לִ/שְׁלֹמֹה֙ בְּ/בַ֣עַל הָמ֔וֹן נָתַ֥ן אֶת הַ/כֶּ֖רֶם לַ/נֹּטְרִ֑ים אִ֛ישׁ יָבִ֥א בְּ/פִרְי֖/וֹ אֶ֥לֶף כָּֽסֶף־׃
translation:
  text: Solomon had a vineyard at Baal-hamon; he entrusted the vineyard to keepers. Each one was to bring a thousand pieces of silver[a] for its fruit.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “a thousand silver”; the unit of silver is not specified.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּרֶם
  chosen: vineyard
  alternatives:
  - vine
  lexicon: HALOT
  rationale: The noun denotes a cultivated vineyard rather than a single vine; 'vineyard' fits both occurrences in the verse.
- source_word: הָיָה לִשְׁלֹמֹה
  chosen: Solomon had
  alternatives:
  - there was for Solomon
  - belonged to Solomon
  lexicon: HALOT
  rationale: 'The Hebrew construction literally means ''there was to Solomon,'' an idiom naturally rendered in English as possession: ''Solomon had.'' This is smoother than a wooden literalism while preserving the sense.'
- source_word: בְּבַעַל הָמוֹן
  chosen: at Baal-hamon
  alternatives:
  - in Baal-hamon
  lexicon: HALOT
  rationale: This is best taken as a place name and transliterated, per policy to transliterate names. 'At' is a natural locative preposition in English for a named site.
- source_word: נָתַן אֶת־הַכֶּרֶם לַנֹּטְרִים
  chosen: he entrusted the vineyard to keepers
  alternatives:
  - he gave the vineyard to the keepers
  - he leased the vineyard to caretakers
  lexicon: HALOT
  rationale: נתן is broadly 'give,' but in this agricultural-economic context the sense is assignment/entrustment to those who watch or manage it. 'Entrusted' communicates the functional relationship without over-specifying a legal lease.
- source_word: לַנֹּטְרִים
  chosen: to keepers
  alternatives:
  - to guards
  - to caretakers
  - to watchmen
  lexicon: HALOT
  rationale: From נטר, 'to keep/watch/guard.' In a vineyard context, 'keepers' is broad and idiomatic, preserving both guarding and tending aspects.
- source_word: אִישׁ
  chosen: Each one
  alternatives:
  - each one
  - every man
  lexicon: HALOT
  rationale: The singular is distributive here; “Each one” is natural English without changing the distributive sense.
- source_word: יָבִא
  chosen: was to bring
  alternatives:
  - would bring
  - brought
  - must bring
  lexicon: HALOT
  rationale: The imperfect here expresses customary or expected action in the arrangement. 'Was to bring' captures obligation/expectation without overstating command.
- source_word: בְּפִרְיוֹ
  chosen: for its fruit
  alternatives:
  - with its fruit
  - from its fruit
  - for his fruit
  lexicon: HALOT
  rationale: The suffix most naturally refers back to the vineyard in context, yielding 'its fruit.' The preposition is rendered 'for' to express payment in relation to the produce, rather than the more awkward literal 'in/with.'
- source_word: אֶלֶף כָּסֶף
  chosen: a thousand pieces of silver
  alternatives:
  - a thousand silver shekels
  - a thousand silver coins
  lexicon: HALOT
  rationale: This is natural English, but “pieces” and any particular unit are supplied rather than expressed and should be noted.
