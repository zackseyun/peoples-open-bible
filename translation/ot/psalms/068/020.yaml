id: PSA.68.20
reference: Psalms 68:20
source:
  edition: WLC
  text: הָ֤/אֵ֣ל לָ/נוּ֮ אֵ֤ל לְֽ/מוֹשָׁ֫ע֥וֹת וְ/לֵ/יהוִ֥ה אֲדֹנָ֑/י לַ֝/מָּ֗וֶת תּוֹצָאֽוֹת׀׃
translation:
  text: God is a God who delivers us; the ways of escape from death belong to Yahweh the Lord.
  philosophy: dynamic
lexical_decisions:
- source_word: הָאֵל
  chosen: God
  alternatives:
  - The God
  - the Mighty One
  lexicon: HALOT
  rationale: Definite article plus אֵל identifies God specifically. English idiom does not require repeating the article as 'The God,' though that is formally possible. 'Mighty One' is a possible lexical nuance of אֵל but here the referent is clearly God.
- source_word: לָנוּ
  chosen: for us
  alternatives:
  - for us
  lexicon: HALOT
  rationale: Natural benefactive English in this predicate.
- source_word: אֵל
  chosen: a God
  alternatives:
  - God
  - the mighty God
  lexicon: HALOT
  rationale: 'The second occurrence is rendered predicatively: ''God is to us a God of salvations.'' Keeping the repeated noun reflects the Hebrew emphasis rather than collapsing it into a single smoother English clause.'
- source_word: לְמוֹשָׁעוֹת
  chosen: of deliverances
  alternatives:
  - of deliverances
  - who saves
  - for salvation
  lexicon: HALOT
  rationale: Natural plural English that retains the repeated/manifold rescue sense.
- source_word: וְלֵיהוָה אֲדֹנָי
  chosen: and to the Lord GOD
  alternatives:
  - and to the LORD, the Lord
  - and to the Lord Yahweh
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: לַמָּוֶת
  chosen: from death
  alternatives:
  - for death
  - against death
  lexicon: HALOT
  rationale: Although the preposition is ל, in this idiom with תּוֹצָאוֹת the sense is egress with respect to death, i.e., escape from it. 'From death' best captures the idiomatic force in context.
- source_word: תּוֹצָאוֹת
  chosen: ways out
  alternatives:
  - goings out
  - issues
  - deliverances
  lexicon: HALOT
  rationale: Retains the exit/outlet image in idiomatic English.
- source_word: וְלֵיהוִה אֲדֹנָי
  chosen: and to Yahweh the Lord
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Preserves the Hebrew title-name sequence and renders יהוה as Yahweh.
