  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וַ/תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֥וֹד אוֹדֶ֗/נּוּ יְשׁוּע֥וֹת פָּנָֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: Why are you cast down, O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of his presence[a].
  footnotes:
  - marker: a
    text: Literally, 'the salvations of his face' or 'the help of his countenance.' Hebrew 'face' often means 'presence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영혼아, 어찌하여 네가 낙심하며, 어찌하여 내 속에서 불안해하느냐? 하나님을 바라라. 내가 다시 그분을 찬양하리니, 그분은 그분의 얼굴의 구원이신 분이시다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그분의 얼굴의 구원들’입니다. 히브리어 ‘얼굴’은 때때로 ‘임재’를 뜻하므로, ‘그분의 임재에서 오는 구원’ 또는 ‘그분의 얼굴에서 오는 도움’으로 이해할 수도 있습니다.
    reason: lexical_alternative
