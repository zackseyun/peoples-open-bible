id: JHN.1.33
reference: John 1:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
  footnotes:
  - marker: a
    text: Or 'to baptize with water' ... 'baptizes with the Holy Spirit.' The Greek uses the same preposition ('in') in both phrases, and the main text preserves that parallel.
    reason: lexical_alternative
  - marker: b
    text: Or 'did not recognize him.' The Greek can denote lack of acquaintance or lack of recognition in context.
    reason: lexical_alternative
  - marker: c
    text: '''Remaining'' translates a key Johannine verb often rendered ''abiding.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 나 역시 그를 알지 못했습니다[b]. 그러나 나를 물로 세례를 베풀도록 보내신 분이 내게 말씀하셨습니다. “네가 성령이 내려와 그 위에 머무는 것을 보는 이가 바로 성령으로 세례를 베푸는 분입니다[c].”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물 안에서 세례를 베풀도록’ 및 ‘성령 안에서 세례를 베푸는 분’으로 번역할 수 있습니다. 그리스어는 두 구문에서 동일한 전치사(ἐν)를 사용합니다. 본문은 한국어의 자연스러운 표현을 사용하면서도 두 구문을 모두 ‘-으로’로 옮겨 그 병행을 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 알아보지 못했습니다’로 번역할 수 있습니다. 원문은 친분이 없었음을 뜻할 수도 있고, 문맥상 그를 알아보지 못했음을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘머무는’은 요한복음에서 중요한 동사 μένω를 번역한 것입니다. ‘거하는’ 또는 ‘계속 머무는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  english_pob_choice: And I
  chosen_korean: 나는
  alternatives_korean:
  - 저는
  - 나도
  - 그리고 나는
  lexicon: BDAG
  rationale: καί + ἐγώ의 결합을 반영하는 계속적·대조적 화자 표지로 '나는'을 선택하여 문맥의 연결성을 유지하고 한국어 어순에 자연스럽게 맞췄습니다.
- source_word: οὐκ ᾔδειν αὐτόν
  english_pob_choice: did not know him
  chosen_korean: 그를 알지 못했습니다
  alternatives_korean:
  - 그를 알지 못하였습니다
  - 그를 알아보지 못했습니다
  - 그를 알아보지 못하였습니다
  lexicon: BDAG
  rationale: ἔδειν의 미완료형은 과거의 무지 또는 알아보지 못함을 나타내므로 한국어 정중체에서 흔히 쓰이는 '알지 못했습니다'로 직역했습니다; '알아보지 못했습니다'는 문맥적 대안입니다.
- source_word: βαπτίζειν ἐν ὕδατι
  english_pob_choice: to baptize in water
  chosen_korean: 물 안에서 세례 주다(세례를 베풀다)
  alternatives_korean:
  - 물로 세례 주다
  - 물로 세례를 베풀다
  lexicon: BDAG
  rationale: Greek ἐν을 반영하여 '물 안에서'를 선택해 후반의 '성령 안에서'와의 병행을 유지했습니다. 한국어 관용 표현인 '물로'는 대안으로 문헌적으로 가능하지만 병행성이 약화됩니다.
- source_word: τὸ πνεῦμα … ἐν πνεύματι ἁγίῳ
  english_pob_choice: the Spirit ... the Holy Spirit
  chosen_korean: 영 … 성령
  alternatives_korean:
  - 영 … 영(거룩한 영)
  - 성령 … 성령
  lexicon: BDAG
  rationale: 첫 등장 τὸ πνεῦμα은 문맥상 신적 영을 가리키지만 문법적 형식상 단순 표지이므로 '영'으로 처리하고, 마지막의 ἁγίῳ가 명시적으로 신적 이름을 부여하므로 '성령'으로 처리해 원문 대조를 보존했습니다.
theological_decisions:
- issue: πνεῦμα / ἐν πνεύματι ἁγίῳ 표기 일관성
  chosen_reading: 첫 언급은 '영', 명시적 표현은 '성령'으로 처리
  alternative_readings:
  - 모두 '성령'으로 표기
  - 모두 '영'으로 표기
  rationale: 원문은 처음에 τὸ πνεῦμα라 표지적 명사로 시작하고 끝에 ἁγίῳ로 명확히 거룩함을 밝히므로, 번역에서 첫 언급은 일반어 '영'으로 두고 최종 표지는 명확히 '성령'으로 표기함으로써 원문의 점층적 명시를 충실히 반영합니다.
  doctrine_reference: '번역 원칙: 성령 표기(프로젝트 용어집)'
- issue: 인용문 안의 2인칭 호칭
  chosen_reading: 인용구 안은 2인칭 단수 '네가'로 처리(화법 전환 표지)
  alternative_readings:
  - 정중한 2인칭 '당신이/너희가'로 처리
  - 3인칭 간접화법으로 바꿈
  rationale: 그리스어 원문은 2인칭 단수(ἂν ἴδῃς)를 사용해 직접 식별 표식을 제공하므로, 인용부의 즉시성과 지시적 힘을 살리기 위해 한국어에서는 화법 전환을 허용해 '네가'로 직접 번역했습니다. 이 어법 전환은 인용문의 지시성을 보존하기 위함입니다.
  doctrine_reference: '번역 방식: 인용 화법 보존 원칙'
