translation:
  text: '1. “I said to you,” he says, “that the things created by God are twofold; for self‑control is
    twofold as well.[a] For with regard to some things one must exercise self‑control, and with regard
    to others one must not.”


    2. “Make it known to me, sir,” I say, “with respect to what things one must exercise self‑control,
    and with respect to what things one must not.” “Listen,” he says: “Exercise self‑control with regard
    to what is evil and do not do it; but do not exercise self‑control with regard to what is good—rather,
    do it. For if you exercise self‑control so as not to do the good, you commit a great sin;[b] but if
    you exercise self‑control so as not to do what is evil, you accomplish great righteousness. Therefore
    exercise self‑control from every wickedness, doing the good.”


    3. “What kinds, sir,” I say, “are the wickednesses from which we must exercise self‑control?[c]” “Listen,”
    he says: “From adultery and fornication, from lawless drunkenness, from wicked luxury, from many foods
    and the extravagance of wealth and boasting and haughtiness and arrogance, and from lying and slander
    and hypocrisy, resentment, and every blasphemy.”


    4. “These deeds are the most evil of all in the life of human beings. From these works, then, the
    servant of God must exercise self‑control; for the one who does not exercise self‑control from these
    is not able to live to God. Listen, then, also to the things that follow these.”


    5. “Are there still,” I say, “sir, evil works?” “Indeed, there are many,” he says, “from which the
    servant of God must exercise self‑control: theft, falsehood, defrauding, false testimony, greed, evil
    desire, deceit, vainglory, boastful pretension, and whatever things are like these.”


    6. “Do these not seem to you to be evil—and very evil—for the servants of God?” he says.[d] “From
    all these the one who serves God must exercise self-control. Exercise self-control, then, from all
    these, that you may live to God and be enrolled with those who exercise self-control from them. These,
    then, are the things from which you must exercise self-control.”


    7. “But the things from which you must not exercise self‑control,” he says, “but rather do them—listen:
    Do not exercise self‑control with regard to the good, but do it.”


    8. “And of the good things, sir,” I say, “declare to me their power, so that I may walk in them and
    serve them, that by practicing them I may be able to be saved.” “Listen,” he says, “also to the works
    of the good, which you must do and not exercise self‑control from.”


    9. “First of all: faith, fear of the Lord,[e] love, concord, words of righteousness, truth, endurance—there
    is nothing better than these in the life of human beings. If someone keeps these and does not exercise
    self‑control from them, he becomes blessed in his life.”


    10. “Next, hear what follows these: to serve widows; to visit orphans and those in want; to redeem
    the servants of God from distresses; to be hospitable (for in hospitality one sometimes finds an opportunity
    for doing good); to oppose no one; to be quiet; to make yourself one who has less than all people;
    to honor the elderly; to practice righteousness; to preserve the brotherhood;[h] to endure insult;
    to be long‑suffering; to have no resentment; to encourage those who are weary in soul; not to cast
    off those who have stumbled away from the faith,[i] but to turn them back and make them cheerful;
    to admonish those who sin; not to press needy debtors;[f] and if there is anything like these.”


    11. “Do these seem to you to be good?” he says. “What, sir, is better than these?” I say. “Go, then,”
    he says, “walk in them and do not exercise self‑control from them, and you will live to God.”


    12. “Therefore keep this commandment. If you do the good and do not exercise self‑control from it,
    you will live to God—and all who act in this way will live to God. And again, if you do not do the
    evil and exercise self‑control from it, you will live to God; and all will live to God—whoever keeps
    these commandments and walks in them.”[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Twofold retains the paired moral categories introduced by the source. The standard edition retains
      exercise self-control; the simplified edition uses hold back to make the unusual instruction not
      to abstain from good understandable. Servant follows current DOCTRINE.md; bonded status, belonging
      and allegiance in doulos remain relevant background rather than changing the reader term to slave.
  - marker: b
    reason: textual_variant
    text: 'The working print marks the first good-withholding conditional with vertical bars: it is Hilgenfeld’s
      version-supported insertion, reported absent in Athos through repeated-ending loss. Lake1907 Plate
      VI lacks that intervening conditional. The Vulgata, Hilgenfeld1873 printed51, has the sin warning
      for abstaining from good; Palatina, Gebhardt/Harnack1877 printed97, also has that warning before
      its evil-abstention branch. Those versions support the sense, not identical preservation of every
      Greek word. Printed editorial bars remain in the recorded Greek; the English includes the working
      clause with this note.'
  - marker: c
    reason: textual_variant
    text: The working paragraph3 brackets us and the conjunction before resentment. Lake1907 Plate VI’s
      vice list lacks the working lawless-drunkenness and wicked-luxury clauses, while the Vulgata printed51
      has drunkenness and wicked banquets and Palatina printed99 has its own expanded list. No list is
      silently converted into unanimous Greek testimony. The first Hilgenfeld scan skips printed52–53;
      those pages were subsequently read in the second scan, hermaepastorvet01hermgoog, physical71–72.
      This supplies edition evidence, not another manuscript witness.
  - marker: d
    reason: textual_variant
    text: 'The continuous working paragraph6 is one question spoken by the shepherd: “Do these not seem
      evil, and very evil, for God’s servants?” It brackets phēsi, he says. Lake1907 Plate VII lines1–2
      instead prints a question followed by Hermas’s reply, “And very evil, I say, for God’s servants,”
      matching the former English division. That is a substantive dialogue alternative, not a newly recovered
      missing paragraph. The new English follows the working print and records the Athos alternative.
      At the paragraph’s closing relative, the printed aph hōn is Harmer’s correction of Athos hōn. The
      Vulgata printed52 also divides the question and the very-evil reply; it does not independently establish
      the Greek wording.'
  - marker: e
    reason: textual_variant
    text: 'Paragraph9 working Greek has fear of the Lord. Lake1907 Plate VII line6 has fear of God, as
      does Palatina’s timor dei on printed99–101. Alternative: “faith, fear of God, love, concord, words
      of righteousness, truth, endurance.” The working Lord is retained. No Sinaiticus vote is available:
      its surviving Hermas text ends in Mandate4iii. Vulgata printed53 has timor domini, fear of the Lord.'
  - marker: f
    reason: textual_variant
    text: 'The working paragraph10 has needy modifying debtors, without and between them: “not to press
      needy debtors.” Lake1907 Plate VII line11 includes and, yielding “not to press debtors and the needy,”
      the former English wording. Both readings are preserved explicitly. Press can also be rendered harass
      or oppress in this context. Palatina printed101–103 has a differing debt-related construction; it
      is not a second identical Greek text. Vulgata printed53 has debitores non premere, not to press
      debtors, without a separate needy term; it cannot decide the Greek conjunction by itself.'
  - marker: g
    reason: textual_variant
    text: 'The ending retains both conditions: doing good without abstaining, and not doing evil while
      abstaining. The second from it is a printed correction against Athos’s direct object, reported by
      the 1891 apparatus; Lake1907 Plate VII line14 prints that direct object. Palatina printed103 has
      a shorter combined ending. No condition is erased to harmonize the versions. Live to God retains
      the earlier standard phrase; live for God is an alternative. Vulgata printed53 also closes with
      a shorter command-keeping condition rather than the two separate working Greek conditions.'
  - marker: h
    reason: textual_variant
    text: Preserve the brotherhood follows the working adelphotēta. Lake1907 Plate VII line9 instead has
      agathotēta, “preserve goodness.” Palatina printed101 has fraternitatem custodire, supporting the
      brotherhood sense. Both full alternatives are disclosed; the normalized working reading is unchanged.
      The many practical services in paragraph10 are each retained. Vulgata printed53 has fraternitatem
      conservare, also supporting the brotherhood sense.
  - marker: i
    reason: lexical_alternative
    text: The Greek describes people who have been caused to stumble away from faith, not people who cause
      others to stumble. Stumbled away retains that image in readable English; the former scandalized
      away wording remains in the history archive. The following restore/cheer/admonish instructions are
      retained. Other existing choices—make yourself one who has less, boastful pretension and press—remain
      in the standard draft. No new lexicon lookup is claimed.
lexical_decisions:
- source_word: τὰ κτίσματα τοῦ θεοῦ
  chosen: the things created by God
  alternatives:
  - the creatures of God
  - the creations of God
  lexicon: LSJ; Lampe
  rationale: κτίσμα denotes what is created; “things created” avoids limiting the sense to living creatures
    and suits Hermas’s generic moral framing.
- source_word: ἐγκράτεια / ἐγκρατεύεσθαι
  chosen: self-control / exercise self-control
  alternatives:
  - self-control / hold back
  - self-control / abstain
  lexicon: BDAG; Lampe
  rationale: Retain current standard verb wording; use hold back in simplified edition to preserve the
    good/evil contrast.
- source_word: τὸ πονηρόν / πονηρία
  chosen: what is evil / wickedness
  alternatives:
  - the evil / evil deed
  - bad / badness
  lexicon: BDAG
  rationale: In this moral catalog context, “evil” and “wickedness” preserve the ethical weight without
    colloquial weakening.
- source_word: τὸ ἀγαθόν
  chosen: the good
  alternatives:
  - what is good
  - good deeds
  lexicon: BDAG
  rationale: Hermas contrasts “the evil” and “the good.” The definite form keeps the symmetry and weight.
- source_word: ζῆσαι τῷ θεῷ
  chosen: live to God
  alternatives:
  - live for God
  - live with God
  lexicon: BDAG; Lampe
  rationale: The dative with ζάω here matches idiomatic early-Christian phrasing. Retaining “to God” preserves
    Hermas’s distinctive diction and teleology.
- source_word: δοῦλος (τοῦ θεοῦ)
  chosen: servant (of God)
  alternatives:
  - bondservant
  - slave (of God)
  lexicon: BDAG
  rationale: Current DOCTRINE.md requires reader-facing servant; preserve bonded status in notes/audit
    rather than carrying forward superseded metadata.
- source_word: μεθύσμα ἀνομίας
  chosen: lawless drunkenness
  alternatives:
  - debauched drunkenness
  - drunken orgy
  lexicon: LSJ; Lampe
  rationale: μεθύσμα is a bout of drinking; with ἀνομίας it connotes unrestrained, unlawful excess. “Lawless
    drunkenness” is concise and faithful.
- source_word: τρυφὴ πονηρά
  chosen: wicked luxury
  alternatives:
  - evil self-indulgence
  - depraved indulgence
  lexicon: LSJ
  rationale: τρυφή is luxury/soft living; modifying with πονηρά marks morally corrupt indulgence.
- source_word: ἐδέσματα πολλὰ
  chosen: many foods
  alternatives:
  - many dishes
  - delicacies in excess
  lexicon: LSJ
  rationale: Literal many foods retains the concrete image of excess at table; many dishes or delicacies
    in excess are alternatives recorded in this lexical metadata.
- source_word: πολυτέλεια πλούτου
  chosen: the extravagance of wealth
  alternatives:
  - luxury of wealth
  - opulence
  lexicon: LSJ
  rationale: πολυτέλεια is costly display; “extravagance” captures conspicuous expense tied to wealth.
- source_word: καταλαλιὰ
  chosen: slander
  alternatives:
  - backbiting
  - evil speaking
  lexicon: BDAG
  rationale: Standard moral-catalog gloss retaining forensic and social harm nuances.
- source_word: μνησικακία
  chosen: resentment
  alternatives:
  - bearing a grudge
  - remembering wrongs
  lexicon: BDAG; Lampe
  rationale: Captures the sense of harboring ill will and not letting go of past wrongs.
- source_word: κλέμμα
  chosen: theft
  alternatives:
  - stealing
  lexicon: LSJ
  rationale: Concrete legal/moral term; “theft” is the standard noun form.
- source_word: ἀποστέρησις
  chosen: defrauding
  alternatives:
  - robbery by deprivation
  - depriving
  lexicon: BDAG
  rationale: Refers to wrongful deprivation of what is owed; “defrauding” fits well in vice lists.
- source_word: κενοδοξία
  chosen: vainglory
  alternatives:
  - empty pride
  - conceit
  lexicon: BDAG; LSJ
  rationale: Traditional rendering that preserves the nuance of glorying in emptiness; fits Hermas’s moral
    tone.
- source_word: ἀλαζονεία
  chosen: boastful pretension
  alternatives:
  - braggadocio
  - arrogant boasting
  lexicon: BDAG
  rationale: Conveys boastful swagger and false claims; paired with vainglory to avoid redundancy with
    “pride.”
- source_word: ὁμόνοια
  chosen: concord
  alternatives:
  - unity of mind
  - harmony
  lexicon: LSJ
  rationale: “Concord” is concise and preserves the sense of shared mind/peace among believers.
- source_word: ῥήματα δικαιοσύνης
  chosen: words of righteousness
  alternatives:
  - righteous speech
  - just words
  lexicon: LSJ; Lampe
  rationale: Literal words of righteousness retains the focus on speech that accords with righteousness;
    righteous speech or just words are alternatives recorded in this lexical metadata.
- source_word: ὑπομονή
  chosen: endurance
  alternatives:
  - patience
  - steadfastness
  lexicon: BDAG
  rationale: “Endurance” emphasizes active steadfast perseverance, fitting Hermas’s exhortational context.
- source_word: χήραις ὑπηρετεῖν
  chosen: to serve widows
  alternatives:
  - to assist widows
  - to minister to widows
  lexicon: BDAG
  rationale: Ὑπηρετεῖν implies practical service; “serve” is clear and concrete.
- source_word: ὀρφανοὺς… ἐπισκέπτεσθαι
  chosen: to visit orphans (and those in want)
  alternatives:
  - to look after orphans
  - to care for orphans
  lexicon: BDAG
  rationale: ἐπισκέπτομαι is to visit with care; “visit” preserves the idiom while implying concern.
- source_word: ἐξ ἀναγκῶν λυτροῦσθαι
  chosen: to redeem … from distresses
  alternatives:
  - to ransom from necessities
  - to deliver from hardships
  lexicon: LSJ; Lampe
  rationale: λυτρόω has the sense of ransoming; ἀνάγκαι are compulsions/distresses. The chosen rendering
    keeps the economic-rescue imagery.
- source_word: φιλόξενος / φιλοξενία
  chosen: hospitable / hospitality
  alternatives:
  - lover of strangers / hospitality
  lexicon: BDAG
  rationale: Standard Christian virtue term; retains early-church texture without paraphrase.
- source_word: ἀγαθοποίησις
  chosen: doing good
  alternatives:
  - benefaction
  - good deed
  lexicon: BDAG; Lampe
  rationale: The abstract noun denotes the practice of beneficence; “doing good” is idiomatic and clear.
- source_word: ἡσύχιος
  chosen: quiet
  alternatives:
  - peaceable
  - tranquil
  lexicon: BDAG; LSJ
  rationale: “Quiet” matches the moral tone and classical usage of ἡσύχιος as calm, not contentious.
- source_word: ἐνδεέστερον γίνεσθαι πάντων ἀνθρώπων
  chosen: to make yourself one who has less than all people
  alternatives:
  - to become poorer than everyone
  - to accept being in want more than others
  lexicon: LSJ; Lampe
  rationale: The rendering takes ἐνδεέστερον as having less or being more in need and retains the comparison
    with all other people. The instruction does not explicitly state its purpose or beneficiaries.
- source_word: πρεσβύτας σέβεσθαι
  chosen: to honor the elderly
  alternatives:
  - to revere elders
  - to respect old men
  lexicon: LSJ; Lampe
  rationale: πρεσβύτης here denotes age, not office. “Honor the elderly” captures deference to the aged.
- source_word: ἀδελφότητα συντηρεῖν
  chosen: to preserve the brotherhood
  alternatives:
  - to maintain the community
  - to keep the fellowship
  lexicon: Lampe
  rationale: “Brotherhood” reflects early Christian familial identity; “preserve” underscores active maintenance.
- source_word: ὕβρις
  chosen: insult
  alternatives:
  - outrage
  - abuse
  lexicon: LSJ
  rationale: Here as something to endure; “insult” captures affronts without importing legal nuance.
- source_word: μακρόθυμος
  chosen: long‑suffering
  alternatives:
  - patient
  - forbearing
  lexicon: BDAG
  rationale: Traditional rendering that keeps the rich, active sense of enduring provocation.
- source_word: κάμνοντας τῇ ψυχῇ
  chosen: weary in soul
  alternatives:
  - fainthearted
  - discouraged
  lexicon: BDAG; Lampe
