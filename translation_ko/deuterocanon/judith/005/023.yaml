revisions:
- from: 우리는 이스라엘 자손에게서 도움을 받지 못할 것입니다. 보십시오, 그들은 강한 전열을 갖춘 싸움에 나설 만한 힘도 능력도 없는 백성입니다.
  to: 우리가 이스라엘 자손에게서 도움을 받지 못할 것이기 때문입니다. 보십시오, 그들은 강력한 전열을 펼칠 힘도 능력도 없는 백성이기 때문입니다.
  rationale: 첫 문두의 γάρ는 앞 절에 의존하는 이유 제시이므로 한국어에서도 ‘…것이기 때문입니다’로 보존했습니다. 이어지는 γάρ는 이스라엘에게서 도움을 받지 못한다는 진술의 근거이므로 두 번째 이유절로 옮겼습니다. ‘강력한 전열을 펼칠’은 παράταξις의 군사적 진형·전열 의미와 ἰσχυράν의 수식을 자연스럽게 반영합니다.
