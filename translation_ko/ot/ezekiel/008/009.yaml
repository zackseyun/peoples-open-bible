  to: 그가 내게 말했습니다. “와서, 그들이 여기에서 행하고 있는 악한 가증한 일들을 보십시오.”
  rationale: 명령문을 합쇼체로 통일하고, ‘come’의 의미를 ‘와서’로 보존했으며, תּוֹעֵבוֹת를 예언서에서 널리 쓰이는 ‘가증한 일들’로 옮겼습니다. 원문의 복수형, 악함의 수식, 장소와 진행 중인 행위를 모두 유지했습니다.
