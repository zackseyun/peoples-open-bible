    rationale: ‘합류하였는데, 율법을 버리고 있던 사람들 모두였습니다’는 ‘많은 사람들’과 ‘모두’의 관계가 즉시 파악되지 않습니다. 원문의 πᾶς ὁ ἐγκαταλείπων이 앞선 πολλοί를 규정함을 한국어 문장 구조에서 명확히 하는 편이 좋습니다.
  revised_text: 그리고 백성 가운데 많은 사람이 그들에게 모여들었으니, 모두 율법을 버리고 있던 사람들이었습니다. 그들은 그 땅에서 악을 행하였습니다.
