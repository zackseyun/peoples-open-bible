  from: Look[a], Hanamel son of Shallum, your uncle, is coming to you, saying, ‘Buy my field that is in Anathoth, for the right of redemption to buy it belongs to you.’
  to: ‘Look, Hanamel, the son of your uncle Shallum, is coming to you. He will say, “Buy my field at Anathoth, for you have the right to redeem it by buying it[a].”’
