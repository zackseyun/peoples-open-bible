id: PSA.116.10
reference: Psalms 116:10
source:
  edition: WLC
  text: הֶ֭אֱמַנְתִּי כִּ֣י אֲדַבֵּ֑ר אֲ֝נִ֗י עָנִ֥יתִי מְאֹֽד׃
translation:
  text: I believed when I said[a], “I was greatly afflicted.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'The compressed Hebrew also permits “I believed, for I spoke; I was greatly afflicted,” or “I believed, so I spoke: ‘I was greatly afflicted.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  chosen: I believed
  alternatives:
  - I trusted
  - I had faith
  lexicon: HALOT
  rationale: From אמן in the Hiphil, expressing trust/belief. 'I believed' is the most direct and idiomatic rendering here, and it aligns with the traditional citation of this verse while remaining faithful to the Hebrew.
- source_word: כִּי
  chosen: when
  alternatives:
  - for
  - because
  - that
  lexicon: HALOT
  rationale: A temporal construal is possible in the compressed syntax and avoids adding the concessive force of “even”; explanatory and resultative construals are retained in the note.
- source_word: אֲדַבֵּר
  chosen: I said
  alternatives:
  - I speak
  - I will speak
  lexicon: HALOT
  rationale: In this construal the speech verb naturally introduces the following statement in English, though the Hebrew form and accentuation also permit an independent “I speak,” preserved in the note.
- source_word: אֲנִי
  chosen: I
  lexicon: HALOT
  rationale: The independent pronoun is explicit for emphasis. English does not need to repeat the pronoun separately outside the clause, but the emphasis is preserved by retaining a full clause in direct speech.
- source_word: עָנִיתִי
  chosen: I was afflicted
  alternatives:
  - I was afflicted
  - I was brought low
  - I was humbled
  lexicon: HALOT
  rationale: The perfect is represented as a past condition rather than shifted without explanation into the present.
- source_word: מְאֹד
  chosen: greatly
  alternatives:
  - very
  - exceedingly
  lexicon: HALOT
  rationale: An adverb of intensity. 'Greatly' is natural in elevated but readable English and fits the lament context.
