  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Nuance of יחל in exhortation
  chosen_reading: wait for the LORD
  alternative_readings:
  - hope in the LORD
  rationale: The Hebrew verb carries both waiting and hoping. The translation preserves the exhortational force without over-resolving the semantic overlap; the alternative is preserved in a footnote because it is a meaningful lexical option in context.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
