  lexicon: HALOT
  rationale: ‘올라가다’의 이미지를 한국어에서 자연스러운 계량 장면으로 풀어, 무게가 거의 없어 위로 뜨는 비유를 살렸습니다.
- source_word: מֵהֶבֶל
  english_pob_choice: lighter than a breath
  chosen_korean: 한숨보다도 가볍습니다
  alternatives_korean:
  - 숨결보다 가볍습니다
  - 헛것보다 가볍습니다
  - 한숨보다 가볍습니다
  lexicon: HALOT
  rationale: 마지막 비교는 저울 비유의 결론이므로, ‘보다도 가볍습니다’로 상대적 경중을 분명히 하되 앞의 הֶבֶל 이미지를 일관되게 유지했습니다.
theological_decisions:
- issue: בְּנֵי אָדָם / בְּנֵי אִישׁ의 의미를 계층 대조로 풀지 여부
  chosen_reading: 본문은 우선 ‘사람의 아들들’이라는 반복된 병렬로 유지하고, 사회적 계층 구분으로 확정하지 않았습니다.
  alternative_readings:
  - 낮은 자들 / 높은 자들
  - 평민 / 귀족
  rationale: 히브리어는 두 인간 지칭어를 병렬로 제시할 뿐이므로, 해석적 사회 계층화를 본문에 미리 넣기보다 여지를 남기는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it; Gender-accurate over gender-neutral.'
