  text: Ἔνδυσαι οὖν τὴν ἱλαρότητα τὴν πάντοτε ἔχουσαν χάριν παρὰ τῷ Θεῷ καὶ εὐπρόσδεκτον οὖσαν αὐτῷ, καὶ
    ἐντρύφα ἐν αὐτῇ. πᾶς γὰρ ἱλαρὸς ἀνὴρ ἀγαθὰ ἐργάζεται, καὶ ἀγαθὰ φρονεῖ, καὶ καταφρονεῖ τῆς λύπης·
    2. ὁ δὲ λυπηρὸς ἀνὴρ πάντοτε πονηρεύεται· πρῶτον μὲν πονηρεύεται, ὅτι λυπεῖ τὸ πνεῦμα τὸ ἅγιον τὸ
    δοθὲν τῷ ἀνθρώπῳ ἱλαρόν· δεύτερον δὲ λυπῶν τὸ πνεῦμα τὸ ἅγιον ἀνομίαν ἐργάζεται, μὴ ἐντυγχάνων μηδὲ
    ἐξομολογούμενος τῷ Θεῷ. πάντοτε γὰρ λυπηροῦ ἀνδρὸς ἡ ἔντευξις οὐκ ἔχει δύναμιν τοῦ ἀναβῆναι ἐπὶ τὸ
    θυσιαστήριον τοῦ Θεοῦ. 3. Διατί, φημί, οὐκ ἀναβαίνει ἐπὶ τὸ θυσιαστήριον ἡ ἔντευξις τοῦ λυπουμένου;
    Ὅτι, φησίν, ἡ λύπη ἐγκάθηται εἰς τὴν καρδίαν αὐτοῦ· μεμιγμένη οὖν ἡ λύπη μετὰ τῆς ἐντεύξεως οὐκ ἀφίησι
    τὴν ἔντευξιν ἀναβῆναι καθαρὰν ἐπὶ τὸ θυσιαστήριον. ὥσπερ γὰρ ὄξος οἴνῳ μεμιγμένον ἐπὶ τὸ αὐτὸ τὴν
    αὐτὴν ἡδονὴν οὐκ ἔχει, οὕτω καὶ ἡ λύπη μεμιγμένη μετὰ τοῦ ἁγίου πνεύματος τὴν αὐτὴν ἔντευξιν οὐκ ἔχει.
    4. καθάρισον οὖν σεαυτὸν ἀπὸ τῆς λύπης τῆς πονηρᾶς ταύτης, καὶ ζήσῃ τῷ Θεῷ· καὶ πάντες ζήσονται τῷ
    Θεῷ ὅσοι ἂν ἀποβάλωσιν ἀφ’ ἑαυτῶν τὴν λύπην καὶ ἐνδύσωνται πᾶσαν ἱλαρότητα.
