- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh / Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Sense of לִמְשָׁל בָּם גּוֹיִם
  chosen_reading: a byword among the nations
  alternative_readings:
  - for the nations to rule over them
  rationale: The immediate context emphasizes public shame and the nations' mocking speech ('Where is their God?'). This favors the semantic field of taunt/proverb/byword rather than dominion. The chosen reading preserves the theological concern for God's reputation among the nations.
