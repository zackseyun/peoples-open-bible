id: PRO.14.20
reference: Proverbs 14:20
source:
  edition: WLC
  text: גַּם לְ֭/רֵעֵ/הוּ יִשָּׂ֣נֵא רָ֑שׁ וְ/אֹהֲבֵ֖י עָשִׁ֣יר רַבִּֽים־׃
translation:
  text: A poor person is hated even by his neighbor[a], but those who love the rich are many.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “his friend”; the Hebrew word can mean neighbor, companion, or friend.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  chosen: even
  alternatives:
  - also
  lexicon: HALOT
  rationale: 'The particle intensifies the bitter result: rejection reaches even to the poor person''s own neighbor.'
- source_word: לְרֵעֵהוּ
  chosen: by his neighbor
  alternatives:
  - by his friend
  - by his companion
  lexicon: HALOT
  rationale: With the passive verb, the prefixed preposition marks the agent. 'Neighbor' is the broad main sense; 'friend' remains a live alternative.
- source_word: יִשָּׂנֵא
  chosen: is hated
  alternatives:
  - is rejected
  lexicon: HALOT
  rationale: The Niphal is passive. The former active 'hates' reversed the source grammar and meaning.
- source_word: רָשׁ
  chosen: a poor person
  alternatives:
  - a poor man
  - the poor
  lexicon: HALOT
  rationale: The noun identifies an impoverished person. Gender-neutral English communicates the generic proverb without changing its scope.
- source_word: וְאֹהֲבֵי
  chosen: but those who love
  alternatives:
  - but the lovers of
  - but the friends of
  lexicon: HALOT
  rationale: The participle remains verbal, preserving the contrast between being hated and people who love the rich.
- source_word: עָשִׁיר
  chosen: the rich
  alternatives:
  - a rich person
  - a rich man
  lexicon: HALOT
  rationale: The proverb contrasts the social experience of poor and rich persons. English generic 'the rich' is concise and natural.
- source_word: רַבִּים
  chosen: are many
  alternatives:
  - are numerous
  lexicon: HALOT
  rationale: רַבִּים predicates abundance. 'Are many' is the most natural and direct English rendering in proverbial style.
