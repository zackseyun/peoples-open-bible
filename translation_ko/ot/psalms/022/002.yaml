- source_word: עֲזַבְתָּנִי
  english_pob_choice: have you forsaken me
  chosen_korean: 저를 버리셨습니까
  alternatives_korean:
  - 저를 떠나셨습니까
  - 저를 버리셨습니까
  lexicon: HALOT
  rationale: ‘버리다’가 ‘떠나다/forsake’의 관계적·정서적 무게를 한국어에서 가장 강하게 전달하므로 선택했습니다.
- source_word: מִישׁוּעָתִי
  english_pob_choice: my salvation / my deliverance
  chosen_korean: 제 구원
  alternatives_korean:
  - 제 구해 주심
  - 제 건짐
  - 제 도움
  lexicon: HALOT
  rationale: 이 문맥의 יְשׁוּעָה는 구출·건짐의 뜻을 포함하지만, 시편의 탄식에서는 ‘구원’이 가장 응축된 표현이어서 본문에는 이를 두고, 의미의 여지를 보존했습니다.
- source_word: דִּבְרֵי שַׁאֲגָתִי
  english_pob_choice: the words of my roaring
  chosen_korean: 제 부르짖음의 말들
  alternatives_korean:
  - 제 울부짖음의 말들
  - 제 포효의 말들
  - 제 신음의 말들
  lexicon: HALOT
  rationale: שַׁאֲגָה의 문자적 ‘울부짖음/포효’ 이미지를 살리되 한국어에서는 하나님께 향한 탄식의 소리로 자연스럽게 들리도록 ‘부르짖음’을 선택했습니다. ‘말들’은 히브리어 복수 구조를 반영합니다.
theological_decisions:
- issue: 후반 절의 구문을 ‘구원에서 멀리 계시니’로 처리할지, ‘구원에서 멀리 있습니다’로 처리할지
  chosen_reading: ‘제 구원에서 멀리 계시니’로 두어, 하나님과의 거리감을 탄식 형식으로 압축했습니다.
  alternative_readings:
  - ‘제 구원에서 멀리 계십니다’
  - ‘제 구원을 멀리하십니다’
  rationale: 히브리어는 압축된 병렬 구문으로 읽을 수 있으며, 영어 POB의 최신 보정도 본문의 압축성을 되살렸습니다. 한국어에서는 문장 흐름을 유지하면서도 하나님께서 멀리 계신다는 탄식을 보존하는 표현이 가장 적절합니다.
  doctrine_reference: 시편 탄식의 수사 구조
