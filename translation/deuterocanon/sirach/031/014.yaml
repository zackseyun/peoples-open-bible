    reference: Sirach 31:14
translation:
  text: Do not say, “There is plenty here”; remember that a greedy eye[a] is evil.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, "an evil eye"; here, an eye greedy for food and resentful of others' share.
    reason: lexical_alternative
lexical_decisions:
- source_word: אל תאמר
  chosen: Do not say
  alternatives:
  - Do not think
  - Do not say to yourself
  lexicon: HALOT
  rationale: Straightforward negative imperative from אמר. English imperative preserves the direct admonition.
- source_word: ספוק
  chosen: there is enough
  alternatives:
  - sufficiency
  - satisfaction
  - plenty
  lexicon: HALOT
  rationale: The noun/idea denotes sufficiency or adequacy. In context of table manners and generosity, an idiomatic English clause is needed; 'there is enough' best captures the sense without over-paraphrasing.
- source_word: עליו
  chosen: for him
  alternatives:
  - for that person
  - for him/it
  lexicon: HALOT
  rationale: The preposition with pronominal suffix most naturally means 'for him' here, likely referring to another diner or recipient. 'For him' keeps the Hebrew's masculine singular and the likely interpersonal sense.
- source_word: זכור
  chosen: remember
  alternatives:
  - keep in mind
  - recall
  lexicon: HALOT
  rationale: Imperative retained directly; 'remember' is concise and natural.
- source_word: רעה עין רעה
  chosen: an evil eye is evil
  alternatives:
  - a grudging eye is bad
  - a stingy eye is wicked
  - a mean eye is harmful
  lexicon: HALOT
  rationale: The Hebrew repeats רעה with עין, producing a terse aphoristic warning. 'Evil eye' preserves the idiom and its moral force; the predicate 'is evil' keeps the repetition visible rather than flattening it into a single adjective like 'stingy.'
