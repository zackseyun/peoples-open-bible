  language: ko
  text: 보십시오, 그가 구름처럼 올라오며, 그의 병거들은 회오리바람 같고, 그의 말들은 독수리들[a]보다 빠릅니다. 아, 우리는 망했습니다!
  philosophy: optimal-equivalence
  footnotes:
