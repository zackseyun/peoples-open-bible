id: 4MA.14.9
reference: 4 Maccabees 14:9
source:
  edition: lxx-swete-1909
  text: νῦν ἡμεῖς ἀκούοντες τὴν θλῖψιν τῶν νεανιῶν ἐκείνων, φρίττομεν· οἱ δὲ οὐ μόνον ὁρῶντες, ἀλλʼ οὐδὲ μόνον ἀκούοντες τὸν παραχρῆμα ἀπειλῆς λόγον, ἀλλὰ καὶ πάσχοντες,
  language: Greek
