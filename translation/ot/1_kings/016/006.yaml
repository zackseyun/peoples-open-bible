  meaning: Baasha dies, is buried in Tirzah, and is succeeded by his son Elah.
  meaning_decisions:
  - source_phrase: וַיִּשְׁכַּב בַּעְשָׁא עִם אֲבֹתָיו
    prior_rendering: Baasha slept with his fathers
    new_rendering: Baasha rested with his ancestors
    rationale: This preserves the image of rest and association with earlier generations while avoiding the misleading sexual sense of “slept with” in contemporary English.
  - source_phrase: וַיִּמְלֹךְ אֵלָה בְנוֹ תַּחְתָּיו
    prior_rendering: Elah his son reigned in his place
    new_rendering: His son Elah became king in his place
    rationale: The succession notice describes Elah's accession, not simply the fact that he subsequently ruled.
