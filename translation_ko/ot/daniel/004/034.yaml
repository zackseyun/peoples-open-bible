  terminology: ‘하늘의 왕’, ‘찬양하다’, ‘높이다’, ‘낮추다’는 적절합니다. מְהַדַּר에는 ‘존귀하게 하다’를 사용하여 세 동사의 병렬을 보존합니다. דִּין은 여기서 ‘정의롭다’로 옮겨 한국어 문장 구조와 의미를 함께 살렸습니다.
