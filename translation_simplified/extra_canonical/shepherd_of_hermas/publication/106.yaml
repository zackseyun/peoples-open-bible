translation:
  text: '“The twelfth mountain was white. Its believers are like infants. No evil rises into their hearts.
    They have not known wickedness. They have always remained innocent like children.”[1]


    2. “People like this live without hesitation in God’s kingdom because they have not defiled God’s
    commandments in any matter. They have remained innocent like children all their lives, with the same
    disposition.”


    3. He says, “All of you who remain and become like infants, with no evil, will be more honored than
    all those already mentioned. God honors all infants. They hold first place with him. Blessed are you
    who remove wickedness from yourselves and put on innocence. You will be first of all to live to God.”


    4. After he finished the parables of the mountains, I say, “Sir, now explain to me the stones taken
    from the plain and put into the building. They replaced stones removed from the tower. Explain the
    round stones put into the building, and the stones that are still round.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The working Greek text prints ⸢ἔγνω⸣σαν (“have known”) in paragraph 1, ἔσε⸢σ⸣θε (“will be”)
      and [καὶ] (“and”) in paragraph 3, and ⸢ἐκ⸣ (“from”) in paragraph 4. The corner marks enclose only
      ἔγνω, σ, and ἐκ, not all the letters of the first two words; the square brackets enclose καὶ. This
      translation follows the printed working reading. The supplied report does not establish the precise
      editorial status of each marked portion; an explanation from the edition is still needed. These
      readings are not presented as independently verified manuscript text.
    reason: textual_variant
