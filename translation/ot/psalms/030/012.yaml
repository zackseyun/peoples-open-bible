  from: so that glory[a] may sing praise to you and not be silent. O Yahweh my God, I will give thanks to you forever.
  to: so that my soul[a] may sing praise to you and not be silent. O Yahweh my God, I will give thanks to you forever.
  rationale: The later edit correctly identified the unsuffixed “glory,” but its bare English noun obscures the speaker who sings. The first-person context and similar usage in Psalms 16:9 and 57:8 support the personal inner self, which I render “my soul” while preserving the difficult wording in a note.
