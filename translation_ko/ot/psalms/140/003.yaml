  text: They sharpen their tongue like a snake; the venom of a viper[a] is under their lips. Selah[b]
  footnotes:
  - marker: a
    text: Or “adder” or “asp”; the Hebrew names a venomous snake, but the exact species is uncertain.
    reason: lexical_alternative
  - marker: b
    text: “Selah” is likely a liturgical or musical notation; its precise meaning is uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 뱀처럼 자기 혀를 날카롭게 합니다.[a] 독사의 독이 그들의 입술 아래에 있습니다. 셀라[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “살무사” 또는 “아스프”. 히브리어는 독이 있는 뱀을 가리키지만, 정확한 종은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: “셀라”는 예배 또는 음악과 관련된 표지로 보이지만, 그 정확한 의미는 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: חָשְׁבוּ רָעוֹת
  english_pob_choice: devise evil things
  chosen_korean: 악한 일을 꾀하며
  alternatives_korean:
  - 악한 일을 계획하며
  - 악한 것을 도모하며
  - 악을 꾀하며
  lexicon: HALOT
  rationale: חָשַׁב는 단순한 생각이 아니라 의도적이고 계산된 기도를 뜻하므로, '꾀하다'가 악의적 설계의 뉘앙스를 살립니다.
- source_word: בְּלֵב
  english_pob_choice: in their heart
  chosen_korean: 마음속에
  alternatives_korean:
  - 그들의 마음에
  - 마음에
  - 속으로
  lexicon: HALOT
  rationale: 히브리어 '마음'은 사고·의지·내면 전체를 가리키므로, 현대 한국어에서 자연스러운 '마음속에'로 옮기되 단순한 지적 활동으로 축소하지 않았습니다.
- source_word: יָגוּרוּ מִלְחָמוֹת
  english_pob_choice: stir up wars
  chosen_korean: 전쟁을 부추깁니다
  alternatives_korean:
  - 전쟁을 일으킵니다
  - 전쟁을 모읍니다
  - 분쟁을 조장합니다
  lexicon: HALOT
  rationale: יָגוּר는 이 문맥에서 난해하지만, 뒤의 '전쟁들'과 병행될 때 갈등을 조성하는 적극적 의미가 가장 자연스러워 '부추기다'로 옮겼습니다.
- source_word: כָּל יוֹם
  english_pob_choice: all day
  chosen_korean: 온종일
  alternatives_korean:
  - 날마다
  - 늘
  - 하루 종일
  lexicon: HALOT
  rationale: 시적 반복성과 지속성을 살리면서도 한국어에서 가장 간결한 상시성을 나타내는 표현으로 옮겼습니다.
