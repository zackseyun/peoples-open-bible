base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/008.yaml
  text: And he tore down all their borders and cut down their sacred groves; and it had been granted to him to destroy all the gods of the land, so that all the nations might worship him alone—Nebuchadnezzar—and that all their tongues and all their tribes might call on him as god.
translation:
  language: ko
  text: 그가 그들의 모든 경계를 헐어 버리고 그들의 성스러운 숲들을 베어 내었습니다. 또 그에게는 이 땅의 모든 신들을 멸하도록 허락되었으니, 모든 민족이 오직 느부갓네살만을 섬기고, 모든 언어를 쓰는 사람들과 모든 지파가 그를 신으로 부르게 하려는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέσκαψεν πάντα τὰ ὅρια αὐτῶν
  english_pob_choice: he tore down all their borders
  chosen_korean: 그들의 모든 경계를 헐어 버리고
  alternatives_korean:
  - 그들의 모든 경계를 무너뜨리고
  - 그들의 모든 경계를 허물고
  lexicon: κατασκάπτω
  rationale: 공격적으로 경계를 파괴한다는 뜻을 살리되, 한국어로는 자연스럽고 문어적인 「헐어 버리다」가 구조적 파괴를 분명히 드러냅니다.
- source_word: τὰ ἄλση αὐτῶν
  english_pob_choice: their sacred groves
  chosen_korean: 그들의 거룩한 수목들을
  alternatives_korean:
  - 그들의 성스러운 숲들을
  - 그들의 신성한 수풀들을
  lexicon: ἄλσος
  rationale: ἄλσος는 단순한 숲이 아니라 우상 숭배와 관련된 신성한 수목/숲을 가리키므로, 문자성을 유지하면서도 종교적 성격을 드러내는 표현을 택했습니다.
- source_word: ἐξολοθρεῦσαι πάντας τοὺς θεοὺς τῆς γῆς
  english_pob_choice: to destroy all the gods of the land
  chosen_korean: 이 땅의 모든 신들을 멸하도록
  alternatives_korean:
  - 이 땅의 모든 신들을 멸절하도록
  - 그 땅의 모든 신들을 없애도록
  lexicon: ἐξολοθρεύω / θεοί
  rationale: ἐξολοθρεύω의 강한 소멸·멸절 뉘앙스를 「멸하다」로 옮겨, 단순한 제거보다 더 급진적인 파괴 의도를 살렸습니다.
- source_word: λατρεύσωσι πάντα τὰ ἔθνη
  english_pob_choice: all the nations might worship him alone
  chosen_korean: 모든 민족이 오직 그 느부갓네살만을 섬기고
  alternatives_korean:
  - 모든 민족이 오직 그 느부갓네살에게 예배하고
  - 모든 민족이 그 느부갓네살만을 섬기게 하고
  lexicon: λατρεύω
  rationale: λατρεύω는 종교적 봉사/예배를 뜻하므로 「섬기다」를 택해 숭배와 복종의 겹침을 함께 살렸습니다. POB의 영어는 이름을 동격처럼 강조하므로 한국어도 삽입으로 그 구조를 반영했습니다.
- source_word: πᾶσαι αἱ γλῶσσαι καὶ πᾶσαι αἱ φυλαὶ
  english_pob_choice: all their tongues and all their tribes
  chosen_korean: 그들의 모든 언어와 모든 지파
  alternatives_korean:
  - 그들의 모든 말과 모든 지파
  - 그들의 모든 언어집단과 모든 지파
  lexicon: γλῶσσαι / φυλαί
  rationale: γλῶσσα를 ‘혀’가 아니라 언어 집단으로 이해하여 POB의 ‘tongues’를 「언어」로 옮겼고, φυλή는 혈연·민족 단위를 포함하는 「지파」로 유지했습니다.
theological_decisions:
- issue: 느부갓네살에 대한 신격화 표현
  chosen_reading: 그를 신으로 부르게 하려는 의도 자체를 직설적으로 보존했습니다.
  alternative_readings:
  - 그를 신처럼 여기게 하려는
  - 그를 하느님으로 부르게 하려는
  rationale: 원문은 통치자의 과장된 신격화 선전을 드러내며, 이를 완화하면 본문의 정치-종교적 폭력성이 약해집니다.
  doctrine_reference: 우상숭배 비판과 제국 이데올로기 묘사
- issue: 본절의 주어와 목적어 배열
  chosen_reading: 동사의 목적을 분리하여 한국어에서도 파괴 행위와 종교적 강요가 각각 보이도록 했습니다.
  alternative_readings:
  - 한 문장 안에 더 압축적으로 연결하는 방식
  rationale: 그는 경계와 성소를 파괴하고, 이어 신들을 멸하며, 최종적으로는 보편적 강제 숭배를 추구합니다. 이 단계적 구조를 보존하는 것이 본문의 의미를 더 정확히 전달합니다.
  doctrine_reference: 서사적-수사적 구조 보존
