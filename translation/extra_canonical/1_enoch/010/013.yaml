translation:
  text: On that day they will take them into the depths of fire, into torment and a prison-house, and they will be shut up
    forever.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “in torment and in a prison-house”; the repeated English “into” carries forward the verb of motion and
      clarifies the coordinated judgment scene.
    reason: lexical_alternative
  - marker: b
    text: The supplied witness prints the conjunction before “in torment” in parentheses, indicating editorial or textual
      uncertainty. The sense of the sequence is not materially changed whether the conjunction is retained or omitted.
    reason: textual_variant
lexical_decisions:
- source_word: በውእቱ፡ መዋዕል
  chosen: On that day
  alternatives:
  - In that day
  rationale: The phrase marks the appointed time of judgment. “On that day” is natural modern English while preserving the
    apocalyptic temporal formula.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይወስድዎሙ
  chosen: they will take them
  alternatives:
  - they will lead them
  - they will carry them away
  rationale: The verb expresses taking or conducting persons to a destination. “Take” preserves the causative movement without
    specifying a manner not supplied by the witness; both subject and object remain the source text’s unspecified plural pronouns.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ውስተ፡ መትሕተ፡ እሳት
  chosen: into the depths of fire
  alternatives:
  - into the depth of fire
  - into the lower place of fire
  - into the abyss of fire
  rationale: ውስተ marks movement into, መትሕተ denotes a lower or deep region, and እሳት is fire. “Depths of fire” retains the spatial
    apocalyptic image while avoiding the more interpretive technical term “abyss.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በጻዕር
  chosen: into torment
  alternatives:
  - in torment
  - into anguish
  - with suffering
  rationale: The noun denotes distress, suffering, or torment. Although the Ge'ez uses the preposition በ-, English “into”
    carries forward the governing motion of “take them into” and makes the coordinated destinations or conditions intelligible.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በቤት፡ ሞቅሕ
  chosen: a prison-house
  alternatives:
  - a house of confinement
  - prison
  - a place of imprisonment
  rationale: The construction is literally a house associated with bonds or confinement. “Prison-house” preserves the concrete
    compound imagery more closely than the single word “prison.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይትዓፀዉ
  chosen: they will be shut up
  alternatives:
  - they will be confined
  - they will be closed in
  - they will be imprisoned
  rationale: The passive verb depicts being closed in or confined. “Shut up” retains the physical force and avoids replacing
    the source image with an abstract judicial term.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ለዓለም
  chosen: forever
  alternatives:
  - for eternity
  - for the age
  rationale: In this judgment context the idiom denotes confinement without an expressed endpoint. “Forever” is clear and
    preserves the force of the formula without importing later doctrinal terminology.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
