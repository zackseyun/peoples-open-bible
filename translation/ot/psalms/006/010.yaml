id: PSA.6.10
reference: Psalms 6:10
source:
  edition: WLC
  text: יֵבֹ֤שׁוּ וְ/יִבָּהֲל֣וּ מְ֭אֹד כָּל אֹיְבָ֑/י יָ֝שֻׁ֗בוּ יֵבֹ֥שׁוּ רָֽגַע׀־׃
translation:
  text: Let all my enemies be put to shame and greatly dismayed; let them turn back and be put to shame in an instant[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “All my enemies will be put to shame and greatly dismayed; they will turn back and be put to shame in an instant.”
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  chosen: let ... be ashamed
  alternatives:
  - be put to shame
  - be disappointed
  lexicon: HALOT
  rationale: The Qal imperfect in this poetic/jussive context is best rendered as a wish or petition, 'let ... be ashamed.' 'Ashamed' preserves the shame/disgrace sense of בוש without over-specifying the mechanism.
- source_word: וְיִבָּהֲלוּ
  chosen: and greatly dismayed
  alternatives:
  - and dismayed
  - and panic
  lexicon: HALOT
  rationale: בהל in this form conveys being alarmed or dismayed; “greatly” renders מְאֹד and forms a natural English collocation.
- source_word: מְאֹד
  chosen: greatly
  alternatives:
  - very
  - exceedingly
  lexicon: HALOT
  rationale: A straightforward intensifier. 'Greatly' reads naturally with 'terrified' in modern English while preserving the force of the Hebrew adverb.
- source_word: כָּל אֹיְבָי
  chosen: all my enemies
  alternatives:
  - every one of my enemies
  lexicon: HALOT
  rationale: Standard construct + pronominal suffix. 'All my enemies' is the natural and accurate English rendering.
- source_word: יָשֻׁבוּ
  chosen: let them turn back
  alternatives:
  - let them return
  - let them retreat
  lexicon: HALOT
  rationale: שׁוב commonly means 'turn back/return.' In this hostile context, 'turn back' conveys reversal/retreat without adding military imagery too strongly.
- source_word: יֵבֹשׁוּ
  chosen: and be ashamed
  alternatives:
  - and be put to shame
  lexicon: HALOT
  rationale: The repetition of בוש is preserved in English to reflect the Hebrew poetic emphasis.
- source_word: רָגַע
  chosen: in an instant
  alternatives:
  - suddenly
  - in a moment
  lexicon: HALOT
  rationale: Here רָגַע functions adverbially, indicating suddenness or immediacy. 'In an instant' captures the abrupt reversal and reads idiomatically in English.
