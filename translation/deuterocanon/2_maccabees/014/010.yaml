translation:
  text: For as long as Judas lives[a], there can be no peace.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'Judas surviving'; the supplied Greek has an irregular connective and opens with a repeated fragment from the end of verse 9.
