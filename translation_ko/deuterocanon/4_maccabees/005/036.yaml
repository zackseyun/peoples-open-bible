  source_fidelity: 원문의 οὐδέ ... οὐδέ는 두 목적어를 병렬로 부정합니다. 초안은 뜻을 대체로 전달하지만, ‘존엄한 노년의 입’은 σεμνὸν γήρως στόμα를 ‘노년 자체가 존엄하다’는 식으로 다소 어색하게 결속합니다. γῆρας는 화자의 노년(늙음)이고, σεμνόν은 그 노년으로 존귀해진 입을 수식하는 것으로 옮기는 편이 자연스럽고 영어 POB의 ‘made venerable by old age’에도 부합합니다. δεύτε 절의 ἡλικία는 ‘세월/나이’의 뜻으로, ‘율법을 지키며 살아온 세월’이 적절합니다.
  naturalness: ‘더럽힐 수 없고 ... 더럽힐 수 없습니다’는 같은 동사의 반복이 불필요하게 무겁습니다. 원문의 대등 병렬을 살려 ‘더럽히지도 못하며’로 처리하면 자연스럽고 단호한 합쇼체 발화가 됩니다. ‘노년으로 존귀해진 내 입’은 현대 표준어로도 의미가 명료합니다.
  terminology: μιαίνω는 여기서 ‘더럽히다’로 유지할 수 있습니다. νομίμου βίου는 이 유대교적 순교 서사의 문맥에서 ‘율법을 지키며 살아온’으로 옮겨 νόμιμος의 규범적·율법적 함의를 보존합니다. 해석적 각주는 필요하지 않으며, 현 각주 a는 문장 구조상 덜 정확한 대안을 제시하고 b는 본문과 사실상 같은 내용을 반복하므로 삭제합니다.
