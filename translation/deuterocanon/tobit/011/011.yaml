  text: καὶ ἐπελάβετο τοῦ πατρὸς αὐτοῦ, καὶ προσέπασεν τὴν χολὴν ἐπὶ τοὺς ὀφθαλμοὺς τοῦ πατρὸς αὐτοῦ λέγων
