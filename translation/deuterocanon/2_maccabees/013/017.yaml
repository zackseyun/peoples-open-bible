lexical_decisions:
- source_word: ὑποφαινούσης ... τῆς ἡμέρας
  chosen: when day was already beginning to appear
  alternatives:
  - when dawn was already breaking
  - as daylight was already showing
  lexicon: LSJ
  rationale: The genitive absolute with ὑποφαίνω conveys the first appearance of daylight. 'Beginning to appear' preserves the inceptive sense without over-paraphrasing.
- source_word: τοῦτο ἐγέγονει
  chosen: this had happened
  alternatives:
  - this happened
  - this had come about
  lexicon: BDAG
  rationale: The pluperfect-like form ἐγέγονει is best represented in English as a prior completed event, 'had happened,' in relation to the dawning of day.
- source_word: διὰ
  chosen: because
  alternatives:
  - through
  - on account of
  lexicon: BDAG
  rationale: With the accusative phrase following, διὰ here gives causal force. 'Because' is the most natural English rendering.
- source_word: ἐπαρήγορασιν
  chosen: had quickly come to his aid
  alternatives:
  - encouragement
  - succor
  - timely help
  lexicon: LSJ
  rationale: The noun is rare and contextually denotes prompt assistance or relief rather than mere verbal encouragement. The adverbial idea of speed is retained with 'quickly,' and the aid sense is made explicit in idiomatic English.
- source_word: αὐτῷ
  chosen: to his aid
  alternatives:
  - for him
  - to him
  lexicon: BDAG
  rationale: The dative pronoun marks the beneficiary of the Lord's intervention. 'To his aid' expresses that beneficiary relation naturally in English.
- source_word: τοῦ κυρίου
  chosen: the Lord’s
  alternatives:
  - of the Lord
  lexicon: BDAG
  rationale: κύριος is rendered by the project's default as 'Lord.' The possessive form reads naturally with the following noun.
- source_word: σκέπην
  chosen: protection
  alternatives:
  - shelter
  - covering
  - defense
  lexicon: LSJ
  rationale: σκέπη can denote covering or shelter, but in this military-deliverance context 'protection' best captures the protective intervention of the Lord without becoming too concrete.
