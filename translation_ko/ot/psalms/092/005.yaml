lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 히브리어 본문은 여호와의 고유명 יְהוָה를 쓰지만, 한국어 본문에서는 예배적 직접호칭의 자연스러움을 위해 ‘주님’으로 옮기고, 야훼는 각주에서 소급 확인하도록 했습니다.
- source_word: שִׂמַּחְתַּנִי
  english_pob_choice: you have made me glad
  chosen_korean: 저를 기쁘게 하셨으니
  alternatives_korean:
  - 저를 기쁘게 하셨습니다
  - 저를 즐겁게 하셨으니
  - 저를 기뻐하게 하셨으니
  lexicon: HALOT
  rationale: 피엘 완료형의 원인적 의미를 살려 ‘기쁘게 하셨다’로 옮기고, 시적 이유 절의 흐름에 맞게 연결형 ‘-시니’를 사용했습니다.
- source_word: בְּפָעֳלֶךָ
  english_pob_choice: by your work
  chosen_korean: 당신의 일로
  alternatives_korean:
  - 당신의 행위로
  - 당신의 일로 말미암아
  - 당신의 역사로
  lexicon: HALOT
  rationale: ‘작업/일, 행위’의 의미를 가진 פֹּעַל을 한국어로 간결하게 ‘일’로 옮겨, 앞 절의 원인과 수단의 뉘앙스를 자연스럽게 살렸습니다.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  english_pob_choice: at the works of your hands
  chosen_korean: 당신의 손이 하신 일들 앞에서
  alternatives_korean:
  - 당신의 손의 일들을 보고
  - 당신의 손으로 하신 일들에서
  - 당신의 손으로 하신 일들 때문에
  lexicon: HALOT
  rationale: ‘손의 일들’이라는 관용적 표현을 유지하되, רנן의 기쁨의 외침이 촉발되는 장면성을 살리기 위해 ‘앞에서’로 시적 위치감을 나타냈습니다.
- source_word: אֲרַנֵּן
  english_pob_choice: I sing for joy
  chosen_korean: 제가 기뻐 노래합니다
  alternatives_korean:
  - 제가 기쁨으로 노래합니다
  - 제가 기뻐 외칩니다
  - 제가 기쁨의 노래를 부릅니다
  lexicon: HALOT
  rationale: רנן의 ‘환희에 찬 노래/외침’ 범위를 살리면서도, 한국어 시어로는 ‘기뻐 노래합니다’가 노래와 환희를 함께 유지합니다.
theological_decisions:
- issue: 지시 호칭 יְהוָה의 한국어 처리
  chosen_reading: 본문에서는 ‘주님’으로 자연스럽게 읽고, 각주에서 ‘야훼’로 원형을 밝혔습니다.
  alternative_readings:
  - 본문에 야훼를 직접 표기
  - 전통 번역처럼 여호와/주
  rationale: 시편의 직접 호칭을 예배 문맥에 맞게 한국어로 자연화하되, 원문 고유명이라는 신학적·문헌학적 정보는 각주로 보존하는 것이 공시성과 가독성을 함께 살립니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רנן의 의미 범위
  chosen_reading: ‘기뻐 노래합니다’로 옮겨 환희의 노래와 외침을 함께 포함했습니다.
  alternative_readings:
  - ‘기쁨으로 외칩니다’
  - ‘기뻐 소리칩니다’
  - ‘환호하며 노래합니다’
  rationale: 본문은 단순한 감정 표출이 아니라 하나님의 일들을 향한 응답적 찬양이므로, 노래와 기쁨의 결합을 유지하는 번역이 가장 무난합니다.
  doctrine_reference: 'HALOT: רנן in praise contexts'
