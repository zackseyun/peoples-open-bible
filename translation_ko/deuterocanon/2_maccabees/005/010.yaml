base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/010.yaml
  text: And after casting out a multitude unburied, he himself became unwept, and shared in no burial at all, nor in his ancestral tomb.
translation:
  language: ko
  text: 그리고 장사되지 못한 많은 시신을 내던진 그는, 자신도 애도받지 못하게 되었으며, 어떠한 장례에도 조상에게서 전해진 관습에도 몫을 얻지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πλῆθος ἀτάφων
  english_pob_choice: a multitude unburied
  chosen_korean: 장례를 치르지 못한 많은 사람
  alternatives_korean:
  - 묻히지 못한 무리
  - 장사되지 않은 무리
  lexicon: πλῆθος, ἄταφος
  rationale: πλῆθος는 단순한 복수보다 ‘많은 사람/무리’의 집합을 나타내므로, 문맥의 비극성을 살려 ‘많은 사람’으로 옮겼습니다. ἄταφος는 ‘무덤에 안치되지 않은’ 상태를 가리키므로 자연스러운 현대어로 ‘장례를 치르지 못한’으로 풀었습니다.
- source_word: ἐκρίψας
  english_pob_choice: after casting out
  chosen_korean: 내던진 뒤
  alternatives_korean:
  - 던져버린 뒤
  - 내쫓은 뒤
  lexicon: ἐκρίπτω
  rationale: 시신들을 무정하게 ‘내던지다’는 폭력성을 드러내는 동사이므로, 문맥상 가장 직접적인 ‘내던진 뒤’가 적절합니다.
- source_word: ἀπένθητος ἐγενήθη
  english_pob_choice: he himself became unwept
  chosen_korean: 그는 애도받지 못한 채가 되었고
  alternatives_korean:
  - 그는 울음받지 못한 채가 되었고
  - 그 자신은 애도받지 못하게 되었습니다
  lexicon: ἀπένθητος
  rationale: ἀπένθητος는 ‘슬퍼할 사람이 없는’ 상태를 뜻하므로, 수동적 비애의 결핍을 자연스럽게 살려 ‘애도받지 못한 채’로 옮겼습니다.
- source_word: κηδείας οὐδ᾽ ἥτινος οὔτε πατρῴου νόμου μετέσχεν
  english_pob_choice: shared in no burial at all, nor in his ancestral tomb
  chosen_korean: 어떤 장례에도, 자기 조상의 묘에도 참여하지 못했습니다
  alternatives_korean:
  - 어떤 장례에도, 조상 대대로의 묘에도 끼지 못했습니다
  - 장례 의식에도, 조상의 무덤에도 참여하지 못했습니다
  lexicon: κηδεία, πατρῷος, νόμος
  rationale: κηδεία는 단순 매장이 아니라 장례 전체를 뜻하므로 ‘어떤 장례에도’로, πατρῴου νόμου는 조상에게 속한 관습적·가계적 장례 질서를 가리키므로 직역을 피하면서도 의미를 살려 ‘자기 조상의 묘’로 옮겼습니다.
theological_decisions:
- issue: 죽은 자에 대한 장례 배제의 도덕적 강조
  chosen_reading: 본문은 단순한 사실 보고를 넘어, 시신을 던져버리고 장례와 애도의 공동체적 질서를 끊어버린 폭력성을 드러냅니다.
  alternative_readings:
  - 중립적 역사 서술로만 읽는 방식
  - 개인의 불운을 강조하는 방식
  rationale: 헬라어 표현들의 조합(‘내던지다’, ‘애도받지 못한 채’, ‘어떤 장례에도 참여하지 못하다’)은 의도적으로 비인간화와 수치의 총체를 강조합니다.
  doctrine_reference: 장례와 애도에 대한 성경의 인간 존엄성 이해
