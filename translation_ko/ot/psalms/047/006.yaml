translation:
  language: ko
  text: 하나님께 찬양의 노래를 부르십시오,[a] 찬양의 노래를 부르십시오. 우리 왕께 찬양의 노래를 부르십시오, 찬양의 노래를 부르십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께 음악으로 찬양하십시오 … 우리 왕께 음악으로 찬양하십시오.” 히브리어 동사는 노래뿐 아니라 더 넓은 음악적 찬양을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  english_pob_choice: has gone up
  chosen_korean: 올라가십니다
  alternatives_korean:
  - 올라가셨습니다
  - 올라가십니다
  - 올라가십니다
  lexicon: HALOT
  rationale: עָלָה는 ‘올라가다/오르다’의 뜻이므로, 시적 현재감이 있는 합쇼체로 ‘올라가십니다’라고 옮겨 상승 이미지를 직접 살렸습니다.
- source_word: בִּתְרוּעָה
  english_pob_choice: with a shout
  chosen_korean: 환호성
  alternatives_korean:
  - 외침
  - 기쁨의 외침
  - 전쟁 함성
  lexicon: HALOT
  rationale: תְּרוּעָה는 예배와 승리의 큰 외침을 가리킬 수 있어, 좁은 의미의 전투 함성보다 넓고 축제적인 ‘환호성’이 시의 병행구를 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 문맥상 여호와/주님이 아니라 고유명사 יְהוָה이므로, 프로젝트 기본어인 ‘야훼’로 유지해 하나님의 언약적 이름을 드러냈습니다.
- source_word: שׁוֹפָר
  english_pob_choice: trumpet
  chosen_korean: 나팔 소리
  alternatives_korean:
  - 뿔나팔 소리
  - 트럼펫 소리
  lexicon: HALOT
  rationale: שׁוֹפָר는 의례적 신호 악기이므로, 한국어 성경 문맥에서 자연스럽고 음향을 잘 드러내는 ‘나팔 소리’로 옮기고 구체 악기는 그대로 노출하지 않았습니다.
theological_decisions:
- issue: 하나님의 이름을 번역할지 음역할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 시편 본문에 있는 Tetragrammaton을 대체 호칭이 아니라 고유 이름으로 드러내는 것이 원문 의미와 예배적 긴장을 가장 직접적으로 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 상승 동사가 후대의 특정 교리로 읽힐 가능성
  chosen_reading: 올라가십니다
  alternative_readings:
  - 올라가셨습니다
  - 승천하십니다
  rationale: 본문은 야훼의 왕권/즉위 이미지를 노래하므로, 신약적 승천 언어를 앞세우지 않고 원문 수준의 ‘올라감’ 이미지만 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
