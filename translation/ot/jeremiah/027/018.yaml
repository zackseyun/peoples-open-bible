- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Sense of יִפְגְּעוּ in prophetic/intercessory context
  chosen_reading: plead with
  alternative_readings:
  - intercede with
  - entreat
  rationale: The verse challenges alleged prophets to demonstrate genuine access to God through effective intercession. 'Plead with' preserves that intercessory force without importing a technical theological category beyond the Hebrew.
