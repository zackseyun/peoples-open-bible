  to: 그러나 야훼여, 주께서는 그들을 비웃으시며 모든 민족을 조롱하십니다.
  rationale: 접속사 וְ는 시편의 대조적 전환을 따라 ‘그러나’로 옮겼습니다. 독립 인칭대명사 אַתָּה와 호격의 יְהוָה는 ‘야훼여, 주께서는’으로 재현했습니다. לָמוֹ는 ‘그들을’, לְכָל גּוֹיִם은 포괄성을 보존하여 ‘모든 민족을’으로 옮겼습니다. 원문에 없는 내용을 보충하지 않았으며, 원문에 대응하지 않는 기존 각주는 삭제했습니다.
