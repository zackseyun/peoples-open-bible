  lexicon: בָּרַךְ / נָאַץ / יְהוָה
  rationale: 동사의 주어가 생략된 히브리어를 POB의 ‘blesses himself’에 맞춰 재구성했고, 마지막 신명은 관습적 ‘주님’이 아니라 원문 표지에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘blesses himself’의 행위 주체와 반어성
  chosen_reading: 악인이 스스로에게 복을 빌며 하나님을 경멸하는 반어적 자기축복으로 읽었습니다.
  alternative_readings:
  - 단순히 남을 축복하는 행위
  - 복을 빌어주는 종교적 제의
  rationale: 문맥상 이어지는 ‘야훼를 멸시합니다’와 결합되어 자기 기만과 신성 모독의 긴장을 드러내므로, POB의 해석을 그대로 반영했습니다.
  doctrine_reference: 시편 10편의 악인 묘사와 야훼 경외의 반대 개념
