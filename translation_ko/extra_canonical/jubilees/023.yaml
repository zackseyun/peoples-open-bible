base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023.yaml
  text: '1[v7]. And he placed the two fingers of Jacob upon his eyes, and he blessed the God of gods, and he covered his face and stretched out his feet and slept the sleep of eternity, and was gathered to his fathers.

    2. And Jacob was lying in his bosom through all this, and he did not know that Abraham, his father’s father, had died.

    3. And Jacob awoke from his sleep, and behold, Abraham was cold as ice; and he said, “Father, father!” But there was no one speaking, and he knew that he had died[v10].

    4. And he rose from his bosom and ran and told Rebekah his mother. And Rebekah went by night to Isaac and told him, and they went together, and Jacob also with them, and a torch was in his hand; and when they had gone, they found Abraham lying dead.

    5. And Isaac fell upon the face of his father and wept and kissed him.

    6. And a sound was heard in the house of Abraham, and Ishmael his son arose and went to Abraham his father, and he wept over Abraham his father, he and all the house of Abraham, and they wept with great weeping.

    7. And they buried him in the double cave, near Sarah his wife, his sons Isaac and Ishmael.

    8. And all the men of his house wept for him forty days, and Isaac and Ishmael and all their sons and all the sons of Keturah in their places; and the days of Abraham’s weeping were completed.

    9. And he lived three jubilees and four weeks of years, one hundred and seventy-five years, and he completed the days of his life, old and full of days.

    10. For the days of the former ones were nineteen jubilees for their lives; but after the flood they began to diminish from nineteen jubilees, and to grow old quickly, and to shorten the days of their lives because of many afflictions and because of the evil of their ways, apart from Abraham.

    11. For Abraham was perfect in all his deeds with the LORD, and he was well-pleasing in righteousness all the days of his life; and behold, he did not complete four jubilees in his life, until he had grown old in the presence of evil, and his days were cut short.

    12. And all the generations that will arise from now until the day of the great judgment will grow old quickly before they complete two jubilees, and their minds will be abandoned from their understanding, and all their knowledge will vanish.

    13. And in those days, if a man lives a jubilee and a half of years, they will say of him, “He has lived long”; yet most of his days are pain and toil and distress, and there is no peace.

    14. For blow upon blow, and wound upon wound, and distress upon distress, and evil report upon evil report, and sickness upon sickness, and every evil like these: disease and collapse and frost and fever and plague and sword-stroke and captivity and every affliction and sickness.

    15. And all this will come upon an evil generation that defiles the earth with uncleanness and fornication and pollution and abominable deeds.

    16. Then they will say, “The days of the former ones were many, even up to a thousand years, and good; but behold, the days of our life, if a man has lived long, are seventy years, and if he is strong, eighty years, yet they are evil, and there is no peace in the days of this evil generation.”

    17. And in that generation sons will reproach their fathers and their elders because of sin and because of injustice and because of the speech of their mouth and because of the great evils that they commit, and because they have forsaken the covenant that the LORD made between them and himself, that they should keep and do all his commandments and his ordinances and all his law, without turning aside to the right hand or to the left.

    18. For all of them have acted wickedly, and every mouth speaks guilt, and all their works are uncleanness and corruption, and all their ways are defilement and uncleanness and ruin.

    19. Behold, the earth will be destroyed because of all their deeds, and there will be no seed of the vine and no oil, because all their works are faithless; and they will all perish together—beasts and cattle and birds and all the fish of the sea—because of the sons of men.

    20. And they will strive, these with those, the young with the old, and the old with the young, the poor with the rich, the lowly with the great, and the needy with the ruler, concerning the law and concerning the covenant, because they have forgotten commandment and covenant and feast and month and sabbath and jubilee and all that is appointed.

    21. And they will stand with bow and with swords and with slaughter, to drive them from the way; and they will not return until much blood is poured out on the earth, these by those.

    22. And those who have escaped will not return from their wickedness into the way of righteousness, because all of them will rise up for deceit and wealth, each to seize all that belongs to his neighbor; and they will make a great name for themselves, but not in truth and not in righteousness; and they will profane the holy of holies with their uncleanness and with the corruption of their defilement.

    23. And a great punishment will come upon the deeds of that generation from the LORD, and he will give them over to sword and judgment and captivity and plundering and devouring.

    24. And he will stir up against them the sinners of the nations, who have no mercy or compassion for them, and who show no favor to old or young, to no one at all; for they are evil and strong, so as to do evil more than all the sons of men.

    25. And they will work oppression in Israel and sin in Jacob, and much blood will be poured out on the earth, and there will be none to gather and none to bury.

    26. In those days they will cry out and call and pray to be saved from the hand of the sinful nations, but there will be none to save.

    27. And the heads of the children will become white with gray hair, and a child of three weeks will appear old like one of a hundred years, and their stature will be destroyed by distress and affliction.

    28. And in those days the children will begin to search the law, and to seek the commandments, and to return to the way of righteousness.

    29. And the days will begin to grow many and increase among the children of men, generation by generation and day by day, until their days draw near to one thousand years and to many years beyond many days. And there will be no old man, nor one who is not satisfied with his days; for all of them will be like children and youths. And all their days they will complete in peace and joy, and they will live, and there will be no Satan and no evil destroyer, for all their days will be days of blessing and healing.

    30. And at that time the LORD will heal his servants, and they will rise up and see great peace, and they will drive out their enemies[v29][v27][v24][v22][v20][v19][v14][v12], and the righteous will see and give thanks and rejoice forever and ever with joy.'
  footnotes:
  - marker: v7
    text: Literally 'the double cave'; this corresponds to the ancestral burial cave associated with Sarah.
    reason: cross_reference
  - marker: v10
    text: The phrase 'from nineteen jubilees' is textually difficult in context; the sense is that the lifespans of the ancients were far longer, but after the flood they began to diminish rapidly.
    reason: textual_variant
  - marker: v12
    text: The clause about mind and understanding is awkwardly segmented in the source row; the translation keeps the overall sense that human understanding will fail or be abandoned.
    reason: segmentation_note
  - marker: v14
    text: Several items in this calamity list are lexically difficult in Ge'ez; the translation preserves the cumulative force of repeated disasters rather than over-claiming precision for each disease term.
    reason: lexical_alternative
  - marker: v19
    text: '''No seed of the vine and no oil'' likely means the land will fail to produce grapes and olive oil, not merely literal seed.'
    reason: lexical_alternative
  - marker: v20
    text: '''Month'' may specifically imply the new-moon observance within Jubilees'' sacred calendar.'
    reason: cultural_note
  - marker: v22
    text: The line about each person seizing what belongs to his neighbor is difficult, but the sense is acquisitive violence and fraud rather than simple ambition.
    reason: segmentation_note
  - marker: v24
    text: The wording denies pity to every age group; the compressed Ge'ez sequence is rendered expansively for clarity.
    reason: segmentation_note
  - marker: v27
    text: '''A child of three weeks'' is retained literally. Some interpreters understand it as an image of extreme premature aging rather than a biological description.'
    reason: lexical_alternative
  - marker: v29
    text: The restoration promise reverses the earlier decline in lifespan. 'There will be no Satan and no evil destroyer' is rendered concretely to preserve the apocalyptic worldview of the chapter.
    reason: cross_reference
translation:
  language: ko
  text: '1. 그리고 야곱의 두 손가락을 자신의 눈 위에 놓고, 신들의 하나님을 찬송하고, 자신의 얼굴을 가리고 발을 펴고, 영원의 잠을 잔 뒤 그의 조상들에게로 모였습니다.

    2. 이 모든 동안 야곱은 아브라함의 품에 누워 있었고, 아브라함, 그의 아버지의 아버지가 죽었다는 것을 알지 못했습니다.

    3. 야곱이 잠에서 깨어나 보니, 아브라함은 얼음처럼 차가워져 있었고, 야곱이 말했습니다. “아버지, 아버지!” 그러나 아무도 말을 하지 않았고, 야곱은 아브라함이 죽었다는 것을 알았습니다.

    4. 그가 품에서 일어나 달려가 자기 어머니 리브가에게 알렸습니다. 밤에 리브가는 이삭에게 가서 그에게 말했고, 그들은 함께 갔으며 야곱도 그들과 함께 갔습니다. 그의 손에는 횃불 하나가 있었습니다. 그들이 가서 보니 아브라함은 죽어 누워 있었습니다.

    5. 그리고 이삭은 아버지의 얼굴에 엎드려 울며 그에게 입맞추었습니다.

    6. 아브라함의 집에서 소리가 들렸습니다. 그의 아들 이스마엘이 일어나 자기 아버지 아브라함에게 갔고, 아버지 아브라함을 두고 울었습니다. 그와 아브라함의 온 집안이 울었고, 그들은 크게 통곡했습니다.

    7. 그의 아들 이삭과 이스마엘이 그를 그의 아내 사라 가까이에 있는 이중 동굴에 장사하였습니다.

    8. 그의 집에 속한 모든 남자들은 그를 위하여 마흔 날 동안 애곡하였으며, 이삭과 이스마엘과 그들의 모든 아들들, 그리고 그두라의 모든 아들들도 각자의 자리에서 애곡하였습니다. 아브라함을 위한 애도의 날들이 끝났습니다.

    9. 그는 세 희년과 네 주간의 해, 곧 백칠십오 년을 살았으며, 그의 생애의 날들을 마쳤습니다. 그는 늙고 날이 가득하였습니다.

    10. 옛 사람들의 수명은 열아홉 희년이었습니다. 그러나 홍수 뒤에는 아브라함을 제외하고, 그들이 열아홉 희년에서부터 줄어들기 시작했으며, 많은 고난과 그들의 행실의 악함 때문에 빨리 늙고 그들의 생애의 날수가 짧아졌습니다.

    11. 아브라함은 야훼와 함께하는 모든 행위에서 온전하였고, 그의 평생 동안 의롭게 행하여 기쁨을 드렸습니다. 보십시오, 그는 악 때문에 늙게 될 때까지도 자기 생애에 네 희년을 채우지 못하였고, 날들로 가득하였습니다.

    12. 그리고 지금부터 큰 심판의 날에 이르기까지 일어날 모든 세대는 두 희년을 채우기도 전에 급히 늙을 것이며, 그들의 영에서 그들의 이해력이 그들을 떠나고, 그들의 모든 이해력도 사라질 것입니다.

    13. 그 날들에, 사람이 희년 한 번 반에 이르는 세월을 살면, 사람들은 그를 두고 “오래 살았다”라고 말할 것입니다. 그러나 그의 날들 대부분은 고통과 수고와 곤경이며, 평안은 없습니다.

    14. 이는 타격 위에 타격, 상처 위에 상처, 고통 위에 고통, 악한 소식 위에 악한 소식, 병 위에 병이 더해지고, 이와 같은 모든 악이 서로 겹치기 때문입니다. 곧 질병과 붕괴와 서리와 우박과 눈과 열병과 오한과 혼미와 기근과 죽음과 칼과 포로가 됨과 모든 재앙과 병입니다.

    15. 그리고 이 모든 것은 땅에서 죄를 짓는 악한 세대 위에 임할 것입니다. 그들의 행위는 부정과 음행과 불결함과 가증함입니다.

    16. 그때 그들은 말할 것입니다. “옛사람들의 날수는 많아 천 년까지 이르렀고 좋았습니다. 그러나 보십시오, 우리 생애의 날수는 사람이 오래 살면 칠십 년이고, 강건하면 팔십 년이며, 그 날들은 악합니다. 이 악한 세대의 날들에는 평강이 없습니다.”

    17. 그리고 그 세대에는 자녀들이 죄와 불의와 그들이 하는 말과 그들이 행하는 큰 악들 때문에, 또 주께서 그들과 자신 사이에 세우신 언약을 그들이 버렸기 때문에 자기 아버지들과 자기 장로들을 꾸짖을 것입니다. 그 언약은 그들이 그의 모든 계명과 규례와 그의 모든 율법을 지키고 행하며, 오른쪽으로나 왼쪽으로나 치우치지 말아야 한다는 것이었습니다.

    18. 그들 모두가 악을 행하였기 때문입니다. 모든 입은 죄를 말하고, 그들의 모든 행위는 부정함과 가증함이며, 그들의 모든 길은 더러움과 부정함과 파멸입니다.

    19. 보십시오, 그들의 모든 행위 때문에 땅이 멸망할 것이며, 씨앗도 포도주도 기름도 없을 것입니다. 그들의 모든 행위가 배반적이기 때문입니다. 그리고 들짐승과 집짐승과 새와 바다의 모든 물고기가 사람의 아들들 때문에 모두 함께 멸망할 것입니다.

    20. 그리고 그들은 다투게 될 것입니다. 이들은 저들과, 젊은 자는 늙은 자와, 늙은 자는 젊은 자와, 가난한 자는 부한 자와, 비천한 자는 높은 자와, 궁핍한 자는 통치자와 율법과 언약을 두고 다투게 될 것입니다. 이는 그들이 계명과 언약과 절기와 달과 안식일과 희년과 정하여진 모든 것을 잊었기 때문입니다.

    21. 그들은 활과 칼과 살육을 가지고 일어나 그들을 길로 돌이킬 것이며, 땅 위에 많은 피가 서로의 손으로 쏟아질 때까지는 돌아서지 않을 것입니다.

    22. 그리고 살아남은 자들은 자기들의 악함에서 의의 길로 돌이키지 않을 것입니다. 그들 모두는 기만과 부를 위하여 일어날 것이며, 각자 자기 이웃의 모든 것을 빼앗을 것입니다. 그들은 큰 이름을 떨치겠지만, 그것은 진리나 의에 근거한 것이 아닐 것입니다. 또 그들은 자신들의 더러움과 그 더러움의 부패로 지성소를 더럽힐 것입니다.

    23. 그리고 야훼께로부터 그 세대의 행위들 위에 큰 형벌이 내릴 것이며, 그분은 그들을 살육과 심판과 포로됨과 약탈과 멸망에 넘기실 것입니다.

    24. 그리고 그는 그들을 대적하여 여러 민족 가운데 있는 죄인들을 일으키실 것입니다. 그들은 그들에게 자비도 동정도 베풀지 않고, 노인에게도 젊은이에게도, 아무에게도 호의를 보이지 않을 것입니다. 이는 그들이 악하고 강하여 모든 사람보다 더 악을 행할 수 있기 때문입니다.

    25. 그들은 이스라엘 안에서 폭력을 저지르고 야곱을 거슬러 죄를 지을 것이며, 땅 위에 많은 피가 쏟아질 것이고, 거두는 사람도 묻는 사람도 없을 것입니다.

    26. 그때에 그들은 죄 많은 민족들의 손에서 구원을 받으려고 부르짖고 외치며 기도할 것입니다. 그러나 구원을 받을 사람은 아무도 없을 것입니다.

    27. 그리고 아이들의 머리털은 백발이 될 것이며, 세 주 된 어린아이는 백 살 된 사람처럼 늙어 보일 것이고, 그들의 체구는 고난과 괴로움으로 쇠약해질 것입니다.

    28. 그 날들에 자녀들이 율법을 찾기 시작하고, 계명을 구하며, 의의 길로 돌아갈 것입니다.

    29. 그리고 사람들의 날수는 세대마다, 날마다 점점 많아지고 늘어나, 마침내 천 년에 가까워지고 날들의 수보다 해의 수가 훨씬 많아질 것입니다. 늙은 사람이 없고, 자기 날에 만족하지 못하는 사람도 없을 것입니다. 그들 모두가 어린아이들과 젊은이들처럼 될 것이기 때문입니다. 그들은 모든 날을 평안과 기쁨 가운데 마칠 것이며, 살 것입니다. 사탄도 없고 파괴하는 악한 자도 없을 것입니다. 그들의 모든 날이 복과 치유의 날들이 될 것이기 때문입니다.

    30. 그러고 나서 주께서 그의 종들을 고치실 것이며, 그들은 일어나 큰 평강을 보고 자기들의 원수들을 쫓아낼 것입니다. 의인들은 보고 감사하며, 기쁨으로 영원무궁토록 즐거워할 것입니다.'
