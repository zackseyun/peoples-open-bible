  from: his flesh becomes fresher than in youth[b][a]; he returns to the days of his youthful vigor.
  to: His flesh becomes fresher than a child’s[a]; he returns to the days of his youth[b].
  rationale: The comparative מן־נער is most naturally “than a child’s” (that is, than the flesh of a child), not “than in his youth.” The second colon does refer to the man’s own youth, and “his youth” avoids adding “vigor,” which is an inference rather than the noun’s stated meaning.
