- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Force of the conjunction before the second clause
  chosen_reading: adversative contrast ('but')
  alternative_readings:
  - simple coordination ('and')
  rationale: The Hebrew conjunction can be rendered simply as 'and,' but the semantic relationship between preserving the righteous and destroying the wicked is clearly contrastive. Using 'but' preserves the poetic antithesis without adding doctrinal content.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence'
