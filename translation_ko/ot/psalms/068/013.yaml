  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver, and her pinions with yellow gold[b].
  footnotes:
  - marker: a
    text: Or “between the saddlebags” or “between the hearthstones”; the Hebrew term is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Literally “with greenish gold” or “with a yellow-green sheen of gold.”
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분이 양 우리 사이에 누워 있더라도,[a] 비둘기의 날개는 은으로 덮여 있고, 그 날개깃은 누르스름한 금으로 덮여 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘샤프타임’의 뜻은 확실하지 않습니다. ‘양 우리들 사이에’로 옮길 수 있으며, ‘안장 가방들 사이에’ 또는 ‘화덕 돌들 사이에’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘녹황색 금으로’ 또는 ‘금의 누르스름한 녹색 빛으로’입니다.
    reason: lexical_alternative
