  rationale: The project philosophy gives primacy to the Hebrew where it survives in Sirach, but the source is flagged 'major_mismatch' and the Greek differs substantially. The English therefore stays anchored in the Hebrew wording while letting the Greek confirm that the warning concerns self-exaltation amid need/poverty. Because the divergence is substantial, the alternative should be preserved in a footnote rather than silently harmonized.
