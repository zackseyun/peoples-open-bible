  meaning: The king must speak on behalf of people unable to represent themselves and defend those facing ruin.
  meaning_decisions:
  - source_phrase: פְּתַח פִּיךָ לְאִלֵּם
    prior_rendering: Open your mouth for the mute
    new_rendering: Speak up for those who cannot speak for themselves
    rationale: The command calls for advocacy, not merely speaking aloud. The new wording conveys the idiom and includes people unable to present their own case, whether literally speechless or otherwise powerless.
  - source_phrase: אֶל דִּין
    prior_rendering: for the cause of
    new_rendering: defend the cause of
    rationale: Making the understood action explicit gives the judicial phrase its intended force while retaining the restrained forensic term “cause.”
  - source_phrase: כָּל בְּנֵי חֲלוֹף
    prior_rendering: all who are passing away
    new_rendering: all who are facing ruin
    rationale: “Passing away” now chiefly suggests dying and obscures the wider threatened condition of these people. “Facing ruin” preserves the destructive sense without specifying whether the danger is death or deprivation; the serious alternative remains in a note.
  footnote_kinds:
    a: alternative_meaning
  history_weighed: The latest audit rightly restored a reference to people and retained “cause” as a judicial term. I preserve those gains but translate the speaking idiom and clarify the threatened condition, rather than leaving modern readers with the death-euphemism “passing away.”
