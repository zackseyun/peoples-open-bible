lexical_decisions:
- source_word: לַ֭יְלָה לְ/י֣וֹם יָשִׂ֑ימוּ
  english_pob_choice: They make night into day
  chosen_korean: 밤을 낮으로 만들고
  alternatives_korean:
  - 밤을 낮으로 바꾸고
  - 밤을 낮으로 여기고
  lexicon: לַיְלָה / יוֹם
  rationale: 히브리어의 대조를 직접 살려 ‘밤’과 ‘낮’의 역전으로 옮겼습니다. ‘만들다’는 원문의 יָשִׂימוּ(두다, 만들다)에 대응합니다.
- source_word: א֝֗וֹר
  english_pob_choice: Light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 밝음
  lexicon: אוֹר
  rationale: 원문의 일반명사 ‘빛’을 가장 सीधे 반영하여, 비유적이지만 추상화되지 않게 유지했습니다.
- source_word: קָר֥וֹב מִ/פְּנֵי חֹֽשֶׁךְ־
  english_pob_choice: is near, in the face of darkness
  chosen_korean: 어둠의 앞에서도 그러합니다
  alternatives_korean:
  - 어둠 앞에서 가깝다고 말합니다
  - 어둠 앞에서도 가깝습니다
  lexicon: מִפְּנֵי חֹשֶׁךְ
  rationale: 문법적으로는 ‘어둠의 앞에서/앞에’라는 뜻이지만, 한국어에서는 관계를 자연스럽게 풀어 ‘어둠의 앞에서도’로 옮겨 긴장감을 살렸습니다.
theological_decisions:
- issue: 화자들의 왜곡된 인식과 선언을 어떻게 드러낼지
  chosen_reading: 본문의 말은 사실 진술이 아니라, 고난 중인 욥을 향해 현실을 뒤집어 말하는 사람들의 주장으로 읽히도록 따옴표 안의 발화로 처리했습니다.
  alternative_readings:
  - 직설적 서술로만 처리해 일반 진술처럼 보이게 함
  - ‘빛이 가깝다’만 두고 발화 주체를 약화함
  rationale: 히브리어 원문은 ‘그들이 말한다’는 동사와 직접 인용을 포함하므로, 발화 형식을 살려 화자들의 태도를 분명히 해야 합니다.
  doctrine_reference: 문맥 해석(욥기의 친구들 발화)
