theological_decisions:
- issue: Meaning of the final clause אַחַר יְהוָה אֱלֹהֵיכֶם
  chosen_reading: 'The clause is taken positively: ''both you and the king ... will follow Yahweh your God.'''
  alternative_readings:
  - The MT may be construed awkwardly as 'and you will be, both you and the king ... after the LORD your God,' leaving the exact force implicit.
  - Some ancient versions and many translations smooth the sense differently, sometimes supplying an idea such as 'it will be well' or reading the clause as continued loyalty without explicitly using 'follow.'
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'Translation philosophy #3, preserve theological tension rather than resolve it beyond what the source warrants.'
