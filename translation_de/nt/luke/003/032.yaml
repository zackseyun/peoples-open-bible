  verdict: revise
  source_fidelity: Die Genitivreihe gibt den Anschluss an den vorhergehenden Vers angemessen wieder. Isai, Boas, Sala und Nachschon sind als deutsche Namensformen vertretbar. Der griechische Wortlaut hat jedoch Ἰωβήλ mit abschließendem Lambda; „Jobed“ entspricht diesem Namen nicht, sondern setzt einen anderen Endkonsonanten voraus. Der englische Audit-Text übernimmt offenbar dieselbe Abweichung und ist gegenüber dem SBLGNT-Wortlaut nicht maßgeblich.
  naturalness: Die knappe Reihung „des …, des …“ ist als bewusst formale, kontextabhängige genealogische Fortsetzung natürlich genug. Das Schlusskomma ist wegen der Fortsetzung der Reihe sachgerecht.
  terminology: „Isai“, „Boas“ und „Nachschon“ sind etablierte deutsche Bibelnamen. „Sala“ bewahrt die vorgelegte griechische Form, ohne auf „Salmon“ zu harmonisieren. „Jobel“ gibt Ἰωβήλ formnah wieder und vermeidet die sachlich nicht gedeckte Gleichsetzung mit Obed beziehungsweise die nicht im Ausgangstext stehende Form „Jobed“.
  issues:
