review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 그리스어 본문 XVIII.6의 결말인 ‘그가 낮에도 밤처럼 다닌다’(ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται)가 초안에서 빠져 있습니다. 또한 원문의 단수 술어 흐름을 고려하여, 앞의 ‘음행과 재물 사랑’이 낳는 결과를 가리키는 주어는 불필요하게 반복하지 않고 자연스럽게 처리했습니다.
  naturalness: 현대 표준어 합쇼체로 문장을 다듬었습니다. ‘돈을 사랑하는 것에서’는 ‘재물 사랑을 경계하고’로, ‘서로 հակ하는’은 오탈자를 바로잡아 ‘서로 상반되는’으로 고쳤습니다. ‘잠을 … 몰아내고’ 등은 원문의 강한 인과를 유지하면서 자연스럽게 연결했습니다.
  terminology: πορνεία는 ‘음행’, φιλαργυρία는 ‘재물 사랑’, νόμος τοῦ θεοῦ는 ‘하나님의 율법’, πάθη는 ‘정욕’으로 유지했습니다. δουλεύει는 단순한 비유를 약화하지 않도록 ‘종노릇합니다’로 옮겼습니다. προσοχθίζει는 단순한 불호보다 강한 반감을 나타내도록 ‘못마땅하게 여깁니다’로 번역했습니다.
  issues:
  - severity: high
    issue: 18:6 후반의 ‘낮에도 밤처럼 다닌다’가 누락됨
    rationale: 그리스어 본문은 영혼이 눈멀었다는 진술 뒤에 ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται를 덧붙입니다. 영어 POB에도 누락되어 있으나, 원어 대조를 우선하면 한국어 번역에는 복원해야 합니다.
  - severity: medium
    issue: ‘서로 հակ하는’에 비한국어 문자 혼입
    rationale: ‘հակ하는’은 표준 한국어 표기가 아니며 독해를 방해합니다. ‘서로 상반되는’으로 바로잡아야 합니다.
  - severity: low
    issue: 문단 끝의 [a][b][c] 표지에 대응 각주가 없음
    rationale: 제공된 각주 자료에 해당 표지의 내용이 없으므로, 독자에게 근거 없는 각주 앵커를 남기지 않도록 제거합니다.
