  text: परमेश्वर ने इस्राएलियों को देखा, और परमेश्वर ने जाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप से ‘इस्राएल के पुत्र’, पर यहाँ यह पूरे इस्राएली समुदाय के लिए प्रचलित सामूहिक अभिव्यक्ति है; आधुनिक हिन्दी में ‘इस्राएलियों’ स्वाभाविक और अर्थ-सटीक है।
- source_word: וַיֵּדַע
  choice: जाना
  rationale: मूल क्रिया ידע के संक्षिप्त और जानबूझकर अनिर्दिष्ट प्रयोग को बनाए रखता है। ‘ध्यान दिया’ या ‘उनकी सुधि ली’ जैसी व्याख्याएँ अर्थ को आवश्यकता से अधिक स्पष्ट कर देतीं।
theological_decisions:
- issue: ‘परमेश्वर ने जाना’ का आशय
  choice: अपूर्णक ‘और परमेश्वर ने जाना’ रखा गया
  alternative: ‘और परमेश्वर ने उनकी सुधि ली’
  rationale: इब्रानी पाठ कर्म को व्यक्त नहीं करता। यह वाचा का स्मरण, उनकी दशा की पूर्ण पहचान और आगामी हस्तक्षेप की ओर संकेत कर सकता है; अनुवाद किसी एक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: संक्षिप्त, गरिमापूर्ण आधुनिक मानक हिन्दी। मूल पद की पुनरुक्ति (‘परमेश्वर… परमेश्वर’) और उसके प्रभावशाली, रहस्यपूर्ण अंतिम कथन को सुरक्षित रखा गया है।
