  text: '1[4]. And in the seventh week of the seventh year, in the forty-seventh jubilee, your father came from the land of Canaan, and you were born in the fourth week, in the sixth year, in the forty-eighth jubilee.

    2. That was a time of affliction upon the children of Israel, and the king of Egypt, Pharaoh, commanded concerning them that they should throw all their sons, every male that was born, into the river.

    3. And they kept throwing them in for seven months, until the day when you were born[3]. And your mother hid you for three months, and they became aware of her because of you. And she made for you a basket, and coated it with pitch and asphalt, and placed it among the reeds by the bank of the river, and put you in it for seven days. And your mother came by night and nursed you, and by day Miriam your sister guarded you from the birds.

    4. And in those days Tarmuth, the daughter of Pharaoh, came to bathe in the river, and she heard your voice as you were weeping, and she said to her maidservants,

    5. “Bring him to me.” And they brought you to her. And she took you out of the basket and had compassion on you.

    6. And your sister said to her, “Shall I go and call for you one of the Hebrew women, who will nurse him and wash him for you?”

    7. And she said to her, “Go.” And she went and called your mother, Jochebed, and she gave her wages, and she nursed you.

    8. And after that, when you had grown, they brought you to Pharaoh’s daughter, and you became her son. And Amram your father taught you writing, and when you had completed three weeks of years he brought you into the royal court.

    9. And you were in the court for three weeks of years until the time when you went out from the royal court and saw an Egyptian striking your companion, one of the children of Israel.

    10. And you killed him and hid him in the sand. And on the second day you found two men of the children of Israel fighting, and you said to the one who was acting unjustly, “Why are you striking your brother?”

    11. And he was angry and contentious, and he said, “Who appointed you a ruler and a judge over us? Do you mean to kill me as you killed the Egyptian yesterday?” And you were afraid and fled because of this matter.

    12. And in the sixth year of the third week of the forty-ninth jubilee, you departed and dwelt in the land of Midian for five weeks and one year[12][5], and you returned to Egypt in the week...'
  footnotes:
  - marker: '4'
    text: 'The Ge''ez row numbering is offset in the source extract: the narrative continues smoothly, and this line is translated as verse 4 following the chapter sequence.'
    reason: segmentation_note
  - marker: '3'
    text: The phrase about Miriam likely means she guarded the child by day, specifically from birds or other danger near the riverbank.
    reason: segmentation_note
  - marker: '5'
    text: The container is rendered 'basket.' An alternative is 'ark' or 'box,' but 'basket' avoids importing wording not explicit in the Ge'ez.
    reason: lexical_alternative
  - marker: '12'
    text: This verse corresponds to verse 48 in the source manuscript numbering. The Ge'ez text here ends abruptly at 'in the week' (በሱባዔ፡).
    reason: textual_note
translation:
  language: ko
  text: '1. 그리고 일곱 번째 주간, 일곱 번째 해, 마흔일곱 번째 희년에는 네 아버지가 가나안 땅에서 왔고, 너는 네 번째 주간, 여섯 번째 해, 마흔여덟 번째 희년에 태어났습니다.

    2. 그것은 이스라엘 자손에게 고난의 때였습니다. 이집트 왕 파라오는 그들에 관하여 명령을 내려, 그들의 자녀들, 곧 태어난 모든 남자아이를 강에 던지게 했습니다.

    3. 그리고 그들은 네가 태어난 날까지 칠 개월 동안 그것들을 계속 던져 넣었습니다. 그리고 네 어머니는 석 달 동안 너를 숨겼는데, 너 때문에 사람들이 그녀를 알아차렸습니다. 그리고 그녀는 너를 위해 바구니를 만들고, 역청과 아스팔트를 발라서, 강가의 갈대 사이에 그것을 두었고, 너를 그 안에 칠 일 동안 두었습니다. 그리고 네 어머니가 밤에 와서 너에게 젖을 먹였고, 낮에는 마리아가 너를 지켰습니다.

    4. 그 무렵, 바로의 딸 다르뭇이 강에서 목욕하려고 나왔다가 네가 우는 소리를 듣고 자기 여종들에게 말하였습니다.

    5. 그 무렵, 파라오의 딸 타르무트가 강에서 목욕하려고 나갔습니다. 그가 당신이 우는 소리를 듣고, 자기 시녀들에게 당신을 데리고 나오라고 말했습니다.

    6. …그가 당신을 데려오게 하였고, 그가 당신을 그녀에게 데려왔습니다. 그녀가 당신을 바구니에서 꺼내어 가엾게 여기셨습니다. 그러자 당신의 누이가 그녀에게 말했습니다. “제가 가서 당신을 위해 히브리 여자들 가운데 한 사람을 불러, 그 아이를 기르고 젖을 먹이게 할까요?”

    7. 그러자 왕의 딸이 그 여자에게 “가라” 하고 말했습니다. 그 여자가 가서 네 어머니 요게벳을 불렀습니다. 왕의 딸은 그에게 품삯을 주었고, 네 어머니는 너에게 젖을 먹였습니다.

    8. 그리고 그녀가 그녀에게 말했습니다. “가거라.” 그러자 그녀는 가서 당신의 어머니 요게벳을 불러왔고, 그녀에게 당신을 주었습니다.

    9. 그리고 삯이 지불되었고, 그녀는 당신에게 젖을 먹여 길렀습니다. 그 후 당신이 자라자 그들은 당신을 파라오의 딸에게 데려갔고, 당신은 그녀의 아들이 되었습니다. 당신의 아버지 암람은 당신에게 글을 쓰는 법을 가르쳤으며, 당신이 세 이레, 곧 스물한 해를 마쳤을 때 그는 당신을 궁정으로 데려갔습니다.

    10. 그리고 당신은 왕의 궁정에 세 주간의 해 동안 있었습니다. 그러다가 왕의 궁정에서 나가던 날, 한 이집트 사람이 당신의 동족, 곧 당신의 형제들 가운데 한 사람을 때리는 것을 보았습니다.

    11. 당신은 그를 죽여 모래 속에 숨겼습니다. 이튿날, 이스라엘 자손 둘이 싸우는 것을 보았고, 잘못을 저지르고 있던 사람에게 말했습니다. “왜 때립니까?”

    12. “네 형제.” 그리고 그는 분노하고 격분하여 말했습니다. “누가 너를 우리 위에 통치자와 재판관으로 세웠느냐? 네가 어제 이집트 사람을 죽인 것처럼 나를 죽이려 하느냐?” 그리고 그는 이 일 때문에 두려워하여 도망쳤습니다.'
