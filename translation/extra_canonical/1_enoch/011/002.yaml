translation:
  text: Peace and uprightness[a] will be companions through all the days of eternity and all the generations of
    eternity[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Uprightness represents the rectitude/truth range of ርትዕ, not an imported different source noun. Companions
      retains the association expressed by ሱቱፋን. Personally viewed Dillmann1865 columns291–292 (rectitude/truth),321–324
      (peace),365–368 (sharing/companions),861–862 (be/become),925–926 (days/time),951–952 (age/eternity),887–890
      (generation).
  - marker: b
    reason: textual_variant
    text: The final phrase reads generations of eternity in the selected Ethiopic. Charles discusses a different
      reading in the facing apparatus, but no replacement of the printed final ዓለም is adopted. There is no selected
      Ethiopic main-text star at the opening of11:2; a facing Greek star must not be transferred.
