  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: ko
  text: 에브라임에서는 그 뿌리가 아말렉에 있는 이들이 나왔습니다[a]. 그대 뒤를 따라 베냐민이 그대의 백성들 가운데서 나왔습니다[b]. 마길에게서 통치자들이 내려왔고[c][d], 스불론에게서는 서기관의 지팡이를 드는 자들이 나왔습니다[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 뿌리가 아말렉을 향하였다” 또는 “그들의 뿌리가 아말렉 산지에 있었다.” 히브리어 구절은 난해하며, 시적·지리적 표현일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “베냐민이 그대 뒤를 따라, 그대의 씨족들 가운데서 나왔다.” “그대의 백성들 가운데서”에 해당하는 히브리어 표현은 이례적입니다.
    reason: lexical_alternative
  - marker: c
    text: 마길은 므낫세의 주요 씨족입니다. 일부 번역은 더 넓은 부족 의미로 “므낫세”라고 옮깁니다.
    reason: cultural_note
  - marker: d
    text: “통치자들”은 또한 “법을 제정하는 이들” 또는 “지휘관들”로 옮길 수 있습니다. 히브리어 낱말은 다스리거나 명령을 내리는 이를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 “서기관의 지팡이를 끌어당기는 이들” 또는 “집결 지휘봉을 지닌 이들.” 이 드문 히브리어 표현은 군대를 소집하는 일이나 기록 업무를 가리킬 수 있습니다.
    reason: lexical_alternative
