    rationale: 게에즈어 ፍጹመ 및 영어 POB 감사 번역은 유다가 먼저 혹은 선두에서 나갔음을 명시합니다.
  - severity: medium
    issue: ‘탑’을 ‘성’으로 변경했습니다.
    rationale: 원문 및 영어 POB의 tower에 대응하는 장소를 더 넓거나 다른 의미의 ‘성’으로 바꾸면 지시 대상이 달라집니다.
  - severity: low
    issue: 동행 표현과 부정 강조가 어색합니다.
    rationale: ‘그와 함께 있던 …과 함께’는 중복이고, ‘하나도, 한 사람도’는 자연스러운 강조 구성이 아닙니다.
