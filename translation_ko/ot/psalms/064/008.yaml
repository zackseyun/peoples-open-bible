base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/008.yaml
  text: They are made to stumble[a]; their own tongue is against them; all who see them shake their heads[b].
  footnotes:
  - marker: a
    text: Or “Their tongue causes them to stumble.” The Hebrew of the first clause is syntactically difficult, and translations differ on how its pronouns and clauses relate. The main text follows the sense that the wicked are undone by their own speech.
    reason: alternative_reading
  - marker: b
    text: The verb can also be rendered “wag their heads,” “shudder,” or, in some contexts, “flee away.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 넘어지게 됩니다[a]. 그들 자신의 혀가 그들을 거슬러 섭니다. 그들을 보는 모든 이가 머리를 흔듭니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘그의/그것의 혀가 그들 위에서 그를/그것을 넘어지게 한다’로 옮길 수 있습니다. 히브리어 첫 절은 대명사들의 관계와 문장 구성이 난해하여 번역이 갈립니다. 본문은 문맥에 따라 악인들이 자기들의 말 때문에 넘어지는 뜻으로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: ‘머리를 흔듭니다’는 ‘흔들다’, ‘고개를 내젓다’, ‘몸을 떨다’로도 옮길 수 있으며, 문맥에 따라 ‘떠나가다’라는 뜻으로 이해되기도 합니다.
    reason: lexical_alternative
