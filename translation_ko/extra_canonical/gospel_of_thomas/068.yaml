review_pass:
  verdict: revise
  source_fidelity: 마지막 절의 두 ‘place’의 관계가 초안에서 뒤바뀌었습니다. 원문은 ‘그들이 너희를 박해한 곳(ⲙⲁ)에서 아무 장소/자리를(ⲧⲟⲡⲟⲥ) 찾지 못한다’는 구조입니다. 또한 3인칭 복수형은 능동으로 읽을 수 있으나 비인칭적 수동으로도 이해될 수 있으므로, 능동 번역을 유지할 경우 그 가능성을 주석으로 밝혀야 합니다.
  naturalness: ‘그들이 너희를 박해한 곳에서는, 그 장소 안에서 아무 곳도’는 지시 관계가 부자연스럽고 원문의 통사도 반영하지 못합니다. ‘그들이 너희를 박해한 그곳에서는 아무 장소도’가 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘복이 있습니다’, ‘미워하다’, ‘박해하다’는 적절합니다. ⲧⲟⲡⲟⲥ과 ⲙⲁ의 어휘적 구별은 보존할 수 있지만, 전자를 본질적으로 ‘영적 지위’, 후자를 ‘물리적 장소’로 규정하는 해석은 원문 자체가 확정하지 않으므로 피해야 합니다.
