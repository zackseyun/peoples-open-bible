translation:
  text: “Not only,” he says, “is it adultery if someone defiles his flesh, but whoever makes images as the nations do is committing adultery. Therefore, even in such works, if someone persists and does not reorient[a], keep away from him and do not live together with him; otherwise you too are a sharer in his sin. For this reason it was commanded you to remain by yourselves, whether man or woman, for in cases like these there can be reorientation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
