id: ISA.27.9
reference: Isaiah 27:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן בְּ/זֹאת֙ יְכֻפַּ֣ר עֲוֺֽן יַעֲקֹ֔ב וְ/זֶ֕ה כָּל פְּרִ֖י הָסִ֣ר חַטָּאת֑/וֹ בְּ/שׂוּמ֣/וֹ כָּל אַבְנֵ֣י מִזְבֵּ֗חַ כְּ/אַבְנֵי גִר֙ מְנֻפָּצ֔וֹת לֹֽא יָקֻ֥מוּ אֲשֵׁרִ֖ים וְ/חַמָּנִֽים־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/009.yaml
  text: 'Therefore by this the guilt of Jacob will be atoned for, and this will be the full fruit of the removal of his sin: when he makes all the stones of the altar like crushed chalkstones, the Asherah poles and incense altars will not stand.'
translation:
  language: ko
  text: 그러므로 이로 말미암아 야곱의 죄책은 속죄될 것이며, 이것이 야곱의 죄를 없애는 온전한 결과가 될 것입니다. 그가 제단의 모든 돌을 가루가 되도록 부순 석회돌처럼 만들 때, 아세라 기둥들과 태양 기둥들은 더 이상 서 있지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘죄책’(עָוֹן)은 단순한 죄의 행위뿐 아니라 그로 말미암은 허물과 책임을 포함할 수 있습니다. ‘태양 기둥들’(חַמָּנִים)은 태양 숭배와 관련된 제의 물건을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכֻפַּר עֲוֹן
  english_pob_choice: will be atoned for / the guilt ... will be atoned for
  chosen_korean: 죄책은 속죄될 것이며
  alternatives_korean:
  - 죄악은 속죄될 것이며
  - 허물은 속죄될 것이며
  - 죄는 속죄될 것이며
  lexicon: כפר / עון
  rationale: POB의 ‘guilt’는 단순한 행위의 죄보다 책임-부담으로서의 죄책을 드러내므로, 한국어에서는 ‘죄책’으로 옮기고 ‘속죄되다’로 כפר의 제의적 제거를 살렸습니다.
- source_word: הָסִיר חַטָּאתוֹ
  english_pob_choice: the removal of his sin
  chosen_korean: 그의 죄를 제거한
  alternatives_korean:
  - 그의 죄를 없앤
  - 그의 죄를 치운
  - 그의 죄를 씻은
  lexicon: סור / חטאת
  rationale: ‘제거’는 원문 동사의 물리적-제의적 제거감을 유지하며, 한국어에서도 죄를 단순히 용서받는 것보다 치워 없앤다는 뜻을 분명히 합니다.
- source_word: כָּל אַבְנֵי מִזְבֵּחַ כְּאַבְנֵי גִר מְנֻפָּצוֹת
  english_pob_choice: all the stones of the altar like crushed chalkstones
  chosen_korean: 제단의 모든 돌을 부서진 석회 조각들처럼
  alternatives_korean:
  - 제단의 모든 돌을 잘게 부순 석회돌처럼
  - 제단의 모든 돌을 부서진 백악석처럼
  - 제단의 모든 돌을 가루 난 석회 조각들처럼
  lexicon: אבנים / גיר / מנפצות
  rationale: ‘석회 조각들’은 chalkstones의 구체성을 살리되 한국 독자가 이해할 수 있는 자연어로 옮긴 것이며, ‘부서진’은 מנפצות의 파괴 상태를 반영합니다.
- source_word: אֲשֵׁרִים וְחַמָּנִים
  english_pob_choice: the Asherah poles and incense altars
  chosen_korean: 아세라 기둥과 분향 제단은
  alternatives_korean:
  - 아세라 목상과 분향 제단은
  - 아세라 상징물과 향단은
  - 아세라 기둥과 향 제단은
  lexicon: אֲשֵׁרִים / חַמָּנִים
  rationale: POB의 전통을 따라 ‘아세라 기둥’을 유지했고, חַמָּנִים은 제의적 기능이 드러나도록 ‘분향 제단’으로 옮겨 우상숭배 대상이라는 맥락을 살렸습니다.
theological_decisions:
- issue: 속죄의 수단과 결과를 어떻게 구분할지
  chosen_reading: ‘이로 말미암아… 속죄될 것이며’와 ‘이것이… 온전한 열매가 될 것입니다’로 제의적 정결과 그 결과를 분리해 표현했습니다.
  alternative_readings:
  - ‘이것으로… 사함을 받을 것이며’처럼 단순 용서 중심으로 통합
  - ‘이것으로… 정결해질 것입니다’처럼 의식적 정결만 강조
  rationale: 원문은 속죄의 원인(이로 말미암아)과 그 성취의 결과(죄 제거의 열매)를 병렬하므로, 둘을 분리해 제의적·윤리적 의미를 함께 보존해야 합니다.
  doctrine_reference: 속죄 / 제의적 정결 / 죄의 제거
- issue: חַמָּנִים의 한국어 화체
  chosen_reading: ‘분향 제단’으로 옮겨 우상숭배의 제의적 성격을 드러냈습니다.
  alternative_readings:
  - ‘태양 기둥’
  - ‘향 제단’
  - 음역 없이 단순히 ‘제단’
  rationale: 히브리어 용례와 문맥상 우상 제의와 관련된 물건이므로, 지나치게 일반적인 ‘제단’보다 기능이 드러나는 표현이 본문 이해에 더 유익합니다.
  doctrine_reference: 우상숭배 비판 / 제의 개혁
