  from: 'There is a grievous evil that I have seen under the sun: wealth kept by its owner to his harm[a].'
  to: 'There is a grievous evil that I have seen under the sun: wealth kept for its owner to his harm.'
  rationale: The passive participle שָׁמוּר does not state that the owner is the agent of keeping. The lamed in לִבְעָלָיו naturally marks the person concerned or benefited—though the result is harmful—so “for its owner” avoids the unmarked agency introduced by “by its owner.”
