id: PSA.89.22
reference: Psalms 89:22
source:
  edition: WLC
  text: לֹֽא יַשִּׁ֣א אוֹיֵ֣ב בּ֑/וֹ וּ/בֶן עַ֝וְלָ֗ה לֹ֣א יְעַנֶּֽ/נּוּ־־׃
translation:
  text: No enemy will outwit him[a], and no wicked person will afflict him.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “oppress him.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַשִּׁא
  chosen: will deceive
  alternatives:
  - will deceive
  - will impose on
  - will oppress
  lexicon: HALOT
  rationale: This rendering reflects the ordinary contextual sense of the Hiphil verb with the prepositional object.
- source_word: אוֹיֵב
  chosen: enemy
  alternatives:
  - foe
  lexicon: HALOT
  rationale: Standard rendering for the singular noun; 'enemy' is clear modern English and fits the psalm's royal/military setting.
- source_word: בּוֹ
  chosen: him
  alternatives:
  - upon him
  - against him
  lexicon: HALOT
  rationale: English idiom renders the Hebrew prepositional object as the direct object of "deceive."
- source_word: בֶן עַוְלָה
  chosen: wicked person
  alternatives:
  - wicked man
  - son of injustice
  - evildoer
  lexicon: HALOT
  rationale: The construct expression is an idiomatic designation for an evildoer, not a requirement to preserve the gloss "son of wickedness."
- source_word: עַוְלָה
  chosen: wickedness
  alternatives:
  - injustice
  - wrongdoing
  lexicon: HALOT
  rationale: The noun can denote injustice or wrongdoing; 'wickedness' best captures the broader moral evil in this poetic parallelism.
- source_word: יְעַנֶּנּוּ
  chosen: will afflict him
  alternatives:
  - will oppress him
  - will humble him
  lexicon: HALOT
  rationale: From ענה in the Piel, the sense here is to afflict or oppress. 'Afflict' is broad and natural in English, matching the promise that hostile powers will not subdue the king.
