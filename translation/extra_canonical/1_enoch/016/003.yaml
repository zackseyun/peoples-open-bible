translation:
  text: And now, you were in heaven, yet not all hidden things had been revealed to
    you. You knew trifling mysteries, and in the hardness of your hearts you made
    these known to the women. By this mystery, women and men have multiplied evils
    upon the earth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The expression rendered “trifling mysteries” is difficult; “insignificant
      mysteries” is another possible rendering.
    reason: lexical_alternative
  - marker: b
    text: The witness has singular “this mystery” here, after the earlier reference
      to “mysteries.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ኅቡአት
  chosen: hidden things
  alternatives:
  - secrets
  - mysteries
  rationale: Preserves the distinction between what remained hidden and the later
    term ምሥጢር, rendered “mystery.”
- source_word: ምኑናነ፡ ምሥጢረ
  chosen: trifling mysteries
  alternatives:
  - insignificant mysteries
  - worthless secrets
  rationale: Conveys the disparaging description without adding that these were the
    only mysteries the angels knew; the precise force of ምኑናነ remains uncertain.
- source_word: በጽንዐ፡ ልብክሙ
  chosen: in the hardness of your hearts
  alternatives:
  - with hardened hearts
  rationale: Retains the verse’s explicit moral judgment and its heart imagery.
- source_word: ያበዝኃ፡ ... እኪይተ
  chosen: have multiplied evils
  alternatives:
  - have increased evil
  rationale: Keeps the causative sense of increase and the plural “evils” rather than
    reducing the clause to generic wrongdoing.
theological_decisions:
- issue: Extent of revelation to the heavenly beings
  chosen_reading: Not all hidden things had been revealed to them.
  alternative_readings:
  - No hidden things had been revealed to them.
  rationale: The negation qualifies “all”; the charge is that they disclosed limited
    knowledge, not that they had received none.
- issue: Responsibility for evil on earth
  chosen_reading: The women and men multiplied evils by means of the disclosed mystery.
  alternative_readings:
  - The heavenly beings alone multiplied evils on earth.
  rationale: The closing clause names women and men while retaining the heavenly beings’
    culpability for making the mystery known.
