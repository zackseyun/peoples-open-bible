id: PRO.17.10
reference: Proverbs 17:10
source:
  edition: WLC
  text: תֵּ֣חַת גְּעָרָ֣ה בְ/מֵבִ֑ין מֵ/הַכּ֖וֹת כְּסִ֣יל מֵאָֽה׃
translation:
  text: A rebuke sinks deeper into one who understands than a hundred blows into a fool.
  philosophy: dynamic
lexical_decisions:
- source_word: תֵּחַת
  chosen: sinks deeper into
  alternatives:
  - sinks into
  - has more effect on
  - descends into
  lexicon: HALOT
  rationale: It preserves the image of descending or penetrating and yields natural comparative English.
- source_word: גְּעָרָה
  chosen: a rebuke
  alternatives:
  - reproof
  - scolding
  lexicon: HALOT
  rationale: The noun denotes a verbal reprimand or sharp correction. 'Rebuke' is concise, idiomatic, and fits wisdom-literature style better than the more formal 'reproof' or the narrower 'scolding'.
- source_word: בְמֵבִין
  chosen: into one who understands
  alternatives:
  - into one who understands
  - in a discerning man
  lexicon: HALOT
  rationale: This is an idiomatic English representation of the substantival participle.
- source_word: מֵהַכּוֹת
  chosen: than ... blows into
  alternatives:
  - more than striking
  - than beating
  - than ... lashes on
  lexicon: HALOT
  rationale: 'The prefixed מ marks comparison: the rebuke affects the discerning person more than beating affects the fool. The infinitive construct of נכה denotes striking/beating. ''Than a hundred blows into'' mirrors the comparative structure and keeps the image vivid.'
- source_word: כְּסִיל
  chosen: a fool
  alternatives:
  - a dullard
  - a stupid person
  lexicon: HALOT
  rationale: In Proverbs כְּסִיל is a stock wisdom term for a morally and intellectually obstinate fool, not merely someone unintelligent. 'Fool' is the standard and most faithful rendering.
- source_word: מֵאָה
  chosen: a hundred
  alternatives:
  - one hundred
  lexicon: HALOT
  rationale: The numeral intensifies the contrast hyperbolically. 'A hundred' is natural English and preserves the proverb's force.
