source:
  edition: WLC
  text: תַּאֲוַ֣ת לִ֭בּ/וֹ נָתַ֣תָּה לּ֑/וֹ וַ/אֲרֶ֥שֶׁת שְׂ֝פָתָ֗י/ו בַּל מָנַ֥עְתָּ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/002.yaml
  text: You have given him his heart’s desire, and you have not withheld the request of his lips[a]. Selah[b]
  footnotes:
  - marker: a
    text: Or 'the desire of his lips' or 'the petition of his lips.' The rare Hebrew noun וַאֲרֶשֶׁת likely refers to a spoken request, parallel to 'his heart’s desire.'
    reason: lexical_alternative
  - marker: b
    text: '''Selah'' is preserved as a transliteration because its exact meaning or function is uncertain, though it likely marks a musical or liturgical pause.'
    reason: cultural_note
translation:
  language: ko
  text: 그의 마음의 소원을 이루어 주셨고, 그의 입술의 간청을 거절하지 않으셨습니다.[a] 셀라.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 아레셰트(אֲרֶשֶׁת)는 드문 낱말입니다. 여기서는 ‘간청’ 또는 ‘청원’을 뜻하는 것으로 이해되며, 앞 행의 ‘마음의 소원’과 병행을 이룹니다.
    reason: lexical_alternative
  - marker: b
    text: ‘셀라’는 정확한 뜻이나 기능이 확실하지 않아 음역했습니다. 음악적 또는 예배적 표지였을 가능성이 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: 직접 호격이므로 한국어에서도 호격 어미를 살려 ‘야훼여’로 옮겼습니다. POB의 원칙에 따라 여호와 대신 야훼를 사용했습니다.
- source_word: בְּעָזְּךָ
  english_pob_choice: in your strength
  chosen_korean: 주의 능력으로
  alternatives_korean:
  - 주의 힘으로
  - 주의 능력 안에서
  - 주의 권능으로
  lexicon: HALOT
  rationale: ב는 여기서 근거/영역을 나타내는 뉘앙스로 읽히므로 ‘-으로’가 자연스럽습니다. עֹז의 의미를 살리되 시적 표현을 위해 ‘능력’을 택했습니다.
- source_word: יִשְׂמַח
  english_pob_choice: rejoices
  chosen_korean: 기뻐하며
  alternatives_korean:
  - 기뻐합니다
  - 즐거워하며
  - 기뻐하리다
  lexicon: HALOT
  rationale: 히브리어 시의 현재적·상시적 기쁨을 한국어 연결형으로 유려하게 살렸습니다.
- source_word: וּבִישׁוּעָתְךָ
  english_pob_choice: and in your salvation
  chosen_korean: 주의 구원으로
  alternatives_korean:
  - 주의 구원 안에서
  - 주의 구원으로 말미암아
  - 주의 구원과 함께
  lexicon: HALOT
  rationale: יְשׁוּעָה는 ‘구원/구출/승리’ 범위를 가지나, 본문에서는 왕의 찬양 대상인 하나님의 구원 행위를 포괄하는 ‘구원’이 가장 넓고 안정적입니다. 병행을 위해 두 번째 גם ב는 첫 절과 같이 ‘-으로’로 처리했습니다.
theological_decisions:
- issue: יְהוָה의 번역에서 공용어 ‘주’ 대신 고유 신명 ‘야훼’를 사용할지 여부
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 직접적으로 여호와의 이름을 사용하므로, 신명 자체를 드러내는 POB 원칙을 따랐습니다. 호격 ‘-여’는 시적 직접호출을 보존합니다.
  doctrine_reference: POB guideline on YHWH rendering; doctrinal default for יהוה → 야훼
