id: PRO.30.31
reference: Proverbs 30:31
source:
  edition: WLC
  text: זַרְזִ֣יר מָתְנַ֣יִם אוֹ תָ֑יִשׁ וּ֝/מֶ֗לֶךְ אַלְק֥וּם עִמּֽ/וֹ־׃
translation:
  text: a strutting rooster[a], or a he-goat, and a king whom no one opposes[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew expression is rare and uncertain; other renderings include “greyhound” and “warhorse.”
    reason: alternative_reading
  - marker: b
    text: The Hebrew expression is uncertain; other interpretations include “a king with his army” and “a king whose people are with him.”
    reason: alternative_reading
lexical_decisions:
- source_word: זַרְזִיר
  chosen: strutting rooster
  alternatives:
  - greyhound
  - war-horse
  - well-girded one
  lexicon: HALOT, BDB
  rationale: The noun is rare and uncertain. Traditional English often has 'greyhound,' but the immediate context lists impressive creatures in stately movement, and the collocation with 'loins' favors an animal marked by taut, proud bearing. 'Rooster' is a widely accepted modern rendering in this verse; 'strutting' brings out the stately gait implied by the context.
- source_word: מָתְנַיִם
  chosen: strutting
  alternatives:
  - of loins
  - well-girded in the loins
  lexicon: HALOT, BDB
  rationale: Literally 'loins.' In English, 'rooster of loins' is opaque, so the phrase is rendered idiomatically to express the sense of being sleek, taut, or well-set in the body, hence 'strutting' in context.
- source_word: תָּיִשׁ
  chosen: he-goat
  alternatives:
  - goat
  lexicon: HALOT, BDB
  rationale: The Hebrew specifically denotes a male goat. 'He-goat' preserves the lexical specificity and the masculine force of the image.
- source_word: מֶלֶךְ
  chosen: king
  lexicon: HALOT, BDB
  rationale: Straightforward rendering of the common noun for a ruler.
- source_word: אַלְקוּם עִמּוֹ
  chosen: against whom there is no rising up
  alternatives:
  - against whom there is no rising up
  - with whom is El/God
  - who rises up with him
  lexicon: HALOT, BDB
  rationale: A defensible construal of the difficult phrase, with alternatives retained in a note.
- source_word: זַרְזִיר מָתְנַיִם
  chosen: strutting rooster
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: A contextually well-supported rendering of a rare and uncertain expression; the uncertainty and major alternatives belong in a note rather than in an unnatural undefined English phrase.
- source_word: אוֹ
  chosen: or
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The disjunctive particle is explicit and should be represented.
