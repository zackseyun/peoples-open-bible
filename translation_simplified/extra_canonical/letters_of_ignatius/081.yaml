translation:
  language: en
  text: 'But some people deny Him because they do not understand. Or rather, He has denied them. They defend death instead of the truth. They have not been convinced by the prophets, the law of Moses, or even the Gospel up to this very hour. Nor have they been convinced by the suffering each of us has endured, for they think the same way about us as they do about Him.


    What good does it do me if someone praises me but blasphemes my Lord by refusing to confess that He truly had human flesh? Anyone who refuses to affirm this denies Him completely, while carrying around a corpse himself.


    Because they are unbelievers, I have chosen not to write down their names. Far be it from me even to remember them until they reorient[r1] and return to Christ’s suffering, which is our resurrection.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: being advocates of death rather than of the truth
  simplified_phrase: They defend death instead of the truth.
  preserved_meaning: Their teaching supports death in opposition to truth.
  reasoning_layer_used: POB translation and English witness
  rationale: A separate sentence makes the sharp contrast immediately clear.
- pob_phrase: not confessing that He was a bearer of flesh
  simplified_phrase: refusing to confess that He truly had human flesh
  preserved_meaning: They deny that the Lord genuinely possessed human flesh.
  reasoning_layer_used: POB translation and immediate context
  rationale: This explains the difficult image while preserving its bodily force.
- pob_phrase: I have not thought fit to record in writing—nay, far be it from me even to remember them
  simplified_phrase: I have chosen not to write down their names. Far be it from me even to remember them
  preserved_meaning: Ignatius deliberately withholds their names and strongly rejects remembering them.
  reasoning_layer_used: POB translation
  rationale: Two direct sentences replace archaic and densely connected wording.
