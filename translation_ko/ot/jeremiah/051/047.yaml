  to: 그러므로 보십시오, 날들이 오고 있습니다. 내가 바벨론의 조각한 우상들을 벌하겠습니다. 그 땅 전체가 수치를 당하고, 그 한가운데에 죽임을 당한 자들이 모두 쓰러질 것입니다.
