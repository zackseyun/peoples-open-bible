  source_fidelity: 원문의 Περὶ δέ가 나타내는 화제 전환은 유지하되, 강한 대조로 들릴 수 있는 ‘그런데’보다 ‘한편’이 더 절제되어 적절합니다. ‘복음의 규칙에 따라’는 κατὰ τὸ δόγμα τοῦ εὐαγγελίου 및 영어 audit trail의 ‘rule’을 충실히 반영합니다. οὕτω ποιήσατε는 ‘이와 같이 하십시오’로 자연스럽고 직접적으로 옮겼습니다.
