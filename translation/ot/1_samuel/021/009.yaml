  category: meaning_retranslation
  from: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
  to: David asked Ahimelech, “Do you have a spear or a sword here? I did not bring my sword or my other weapons, because the king’s mission was urgent.”
  rationale: The lexical discussion explicitly recognized availability and bringing equipment as the meanings of the hand idioms, despite retaining their literal forms. I follow those meanings while keeping its contextual judgment that the equipment here consists of weapons.
