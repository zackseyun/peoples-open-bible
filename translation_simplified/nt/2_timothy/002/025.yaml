translation:
  language: en
  text: The Lord’s servant must gently correct those who oppose him, in case God may grant them repentance[c] that leads them to know the truth.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek can also be translated “those who oppose”; “him” is supplied from the context.
    reason: lexical_alternative
  - marker: b
    text: Or “perhaps God may grant them repentance.”
    reason: alternative_reading
  - marker: c
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
