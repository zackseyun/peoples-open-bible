translation:
  text: For those who fashion silver with anxious care, whose works are beyond reckoning[a]—
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'whose works cannot be traced'; the Greek says there is 'no finding out their works.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  chosen: because
  alternatives:
  - for
  lexicon: BDAG
  rationale: Introduces an explanatory clause continuing the larger argument; 'because' gives clear causal force in modern English.
- source_word: οἱ ... τεκταίνοντες
  chosen: those who work
  alternatives:
  - those who craft
  - those who fashion
  lexicon: LSJ
  rationale: The participial construction identifies a class of people by their activity. 'Work' is concise and natural, while still reflecting manual production.
- source_word: τὸ ἀργύριον
  chosen: silver
  alternatives:
  - money
  - silverware
  lexicon: LSJ
  rationale: The direct object is literally 'silver.' Although ἀργύριον can sometimes mean money, the immediate sense here is the material being worked.
- source_word: μεριμνῶντες
  chosen: are anxious
  alternatives:
  - are concerned
  - toil with care
  - are occupied
  lexicon: BDAG
  rationale: The participle conveys anxious care or worry. 'Are anxious' preserves that nuance better than the flatter 'are concerned.'
- source_word: οὐκ ἔστιν ἐξεύρεσις
  chosen: there is no finding out
  alternatives:
  - there is no discovery
  - it is impossible to find
  lexicon: LSJ
  rationale: The noun ἐξεύρεσις denotes finding out or discovery. The somewhat literal phrase preserves the abstract construction of the Greek.
- source_word: τῶν ἔργων αὐτῶν
  chosen: their works
  alternatives:
  - their deeds
  - what they do
  - their products
  lexicon: BDAG
  rationale: ἔργα broadly means works/deeds. 'Works' keeps the lexical link with craftsmanship and activity without over-specifying whether the reference is to products or actions.
