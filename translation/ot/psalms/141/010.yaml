id: PSA.141.10
reference: Psalms 141:10
source:
  edition: WLC
  text: יִפְּל֣וּ בְ/מַכְמֹרָ֣י/ו רְשָׁעִ֑ים יַ֥חַד אָ֝נֹכִ֗י עַֽד אֶעֱבֽוֹר־׃
translation:
  text: Let the wicked fall into his nets[a] together[b], while I pass by.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “their own nets”; the Hebrew says “his nets,” but the owner is not identified.
    reason: alternative_reading
  - marker: b
    text: “Together” may instead mean “at the same time,” linking the wicked’s fall with the speaker’s passing.
    reason: alternative_reading
lexical_decisions:
- source_word: יִפְּלוּ
  chosen: Let ... fall
  alternatives:
  - they will fall
  - may ... fall
  lexicon: HALOT
  rationale: Qal imperfect 3mp of נפל can be read as jussive in context, continuing the psalmist's prayer/wish. English 'Let ... fall' best captures the volitional force in a prayer setting.
- source_word: בְּמַכְמֹרָיו
  chosen: into their own nets
  alternatives:
  - in his net
  - into their own net
  - into his traps
  - into his net
  lexicon: HALOT
  rationale: The noun is plural with a singular suffix; the plural wicked group makes a collective/reflexive English rendering natural.
- source_word: רְשָׁעִים
  chosen: the wicked
  alternatives:
  - wicked men
  - evil people
  lexicon: HALOT
  rationale: Plural adjective/substantive meaning wicked persons. 'The wicked' is idiomatic, concise, and preserves the collective moral category without over-specifying gender.
- source_word: יַחַד
  chosen: together
  alternatives:
  - all together
  - at the same time
  - together
  lexicon: HALOT
  rationale: Retains the ordinary adverbial sense and plausibly modifies the plural wicked, while the alternative attachment is acknowledged in the note.
- source_word: אָנֹכִי
  chosen: I
  alternatives:
  - as for me, I
  lexicon: HALOT
  rationale: Independent pronoun adds emphasis. English can convey this naturally with explicit 'I'; stronger emphasis is possible but not required in the main text.
- source_word: עַד
  chosen: let
  alternatives:
  - until
  - as long as
  - while
  lexicon: HALOT
  rationale: With the first-colon jussive and the simultaneous contrast, English supplies 'let' for the speaker's desired outcome.
- source_word: אֶעֱבוֹר
  chosen: me pass by
  alternatives:
  - I pass by
  - I pass over
  - I go on
  - I pass by safely
  lexicon: HALOT
  rationale: The verb simply means pass by or pass through; no word for 'safely' is present.
- source_word: בְמַכְמֹרָיו
  chosen: into his nets
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This preserves the plural noun and singular possessive suffix without inventing the reflexive plural “their own”; the suffix's antecedent remains uncertain.
- source_word: עַד אֶעֱבוֹר
  chosen: while I pass by
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Represents the compressed temporal clause naturally without supplying a second jussive or the unsupported notion of safety.
