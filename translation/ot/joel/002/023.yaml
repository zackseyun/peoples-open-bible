id: JOL.2.23
reference: Joel 2:23
source:
  edition: WLC
  text: וּ/בְנֵ֣י צִיּ֗וֹן גִּ֤ילוּ וְ/שִׂמְחוּ֙ בַּ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם כִּֽי נָתַ֥ן לָ/כֶ֛ם אֶת הַ/מּוֹרֶ֖ה לִ/צְדָקָ֑ה וַ/יּ֣וֹרֶד לָ/כֶ֗ם גֶּ֛שֶׁם מוֹרֶ֥ה וּ/מַלְק֖וֹשׁ בָּ/רִאשֽׁוֹן־־׃
translation:
  text: And you, children of Zion, rejoice and be glad in Yahweh your God, for he has given you the early rain[a] for righteousness[b]; and he causes the rain to come down for you—the early rain and the latter rain in the first month[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'the teacher for righteousness' or 'the teacher of righteousness.' The agricultural context provisionally favors rain. The selected Latin reads teacher, while Greek and Syriac use food language; these differences do not prove a different Hebrew noun.
    reason: alternative_reading
  - marker: b
    text: Or 'for your vindication' or 'for your prosperity'; also interpreted 'in just measure.' The relation between rain and righteousness is disputed. Prosperity here concerns agricultural restoration, not a general promise of wealth.
    reason: lexical_alternative
  - marker: c
    text: Or 'at first'; Greek and Syriac, 'as formerly.' The retained Hebrew has calendrical parallels, but Joel gives no explicit date formula; the calendar reference and its relation to both seasonal rains remain uncertain. A different Hebrew form has been proposed for the former-state sense; it is not adopted here.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי צִיּוֹן
  chosen: And you, children of Zion
  alternatives:
  - O children of Zion
  - sons of Zion
  lexicon: HALOT
  rationale: בְּנֵי literally means 'sons of,' but in direct address to the people of Zion it functions collectively. 'Children of Zion' preserves the familial/covenantal sense without implying only males. The prefixed conjunction is carried as 'And' to preserve discourse flow.
- source_word: גִּילוּ וְשִׂמְחוּ
  chosen: rejoice and be glad
  alternatives:
  - exult and rejoice
  - be glad and rejoice
  lexicon: HALOT
  rationale: The paired imperatives intensify joy. 'Rejoice and be glad' is idiomatic modern English and preserves the twofold exhortation without unnecessary archaism.
- source_word: בַּיהוָה אֱלֹהֵיכֶם
  chosen: in Yahweh your God
  alternatives:
  - in the LORD your God
  lexicon: HALOT
  rationale: Matches the retained main English and DOCTRINE's divine-name rule. The preposition expresses rejoicing in God. This corrects contradictory metadata, not the source or main divine-name wording; the historical HALOT label is retained without a fresh entry-consultation claim.
- source_word: כִּי נָתַן לָכֶם
  chosen: for he has given you
  alternatives:
  - because he has given you
  - for he gives you
  lexicon: HALOT
  rationale: 'כִּי here introduces the reason for rejoicing. The perfect נָתַן is best rendered as a completed act with present relevance: ''has given.'''
- source_word: אֶת הַמּוֹרֶה לִצְדָקָה
  chosen: the early rain for righteousness
  alternatives:
  - the teacher for righteousness
  - the early rain in just measure
  - the autumn rain for your vindication
  - the early rain for your prosperity
  lexicon: HALOT
  rationale: Rain is retained provisionally from the agricultural context, not because teacher must imply a Messiah. Selected Latin teacher and Greek/Syriac food are distinct versional interpretations, not uniquely recovered Hebrew nouns. Consulted BDB rain entries cite Joel; its צדקה sense6b supports prosperity in the broader vindication/salvation range. The main righteousness wording preserves a lexical association but does not establish an exclusively ethical sense, physical rainfall quantity or the best contextual English. Notes a/b keep these alternatives. No fresh HALOT entry is claimed.
- source_word: וַיּוֹרֶד לָכֶם
  chosen: and he causes rain to come down for you
  alternatives:
  - and he sends down for you
  - and he has poured down for you
  lexicon: HALOT
  rationale: 'The Hiphil of ירד is causative: ''cause to come down'' or ''send down.'' Because the direct object גֶּשֶׁם follows, ''causes rain to come down for you'' is explicit and natural.'
- source_word: גֶּשֶׁם
  chosen: rain
  alternatives:
  - showers
  lexicon: HALOT
  rationale: Generic term for rain/precipitation; 'rain' is the plain sense.
- source_word: מוֹרֶה וּמַלְקוֹשׁ
  chosen: the early rain and the latter rain
  alternatives:
  - the autumn rain and the spring rain
  lexicon: HALOT
  rationale: 'These are the standard agricultural terms for the seasonal rains in the land: the early/autumn rain and the latter/spring rain. ''Early'' and ''latter'' preserve the lexical pairing and traditional distinction.'
- source_word: בָּרִאשׁוֹן
  chosen: in the first month
  alternatives:
  - at first
  - as before
  lexicon: HALOT
  rationale: Provisional source-interpretation preference under exactly retained WLC pointing/consonants/segmentation. Seven other current local occurrences, including defective spelling, have explicit day-of-month contexts; Joel lacks that context. Consulted BDB classifies the retained form with month constructions, then recommends a different feminine form for a former-state sense. Keil's initial-stage reading and Greek/Syriac former-state interpretation remain counter-readings. One identity-masked English assessment narrowly prefers the month ellipsis, not a unique optimum. Its attachment to both seasonal rains and calendar identity remain unresolved; neither Nisan nor Tishri is added. The old minority characterization is unsupported and removed. No source emendation or fresh HALOT consultation is claimed.
