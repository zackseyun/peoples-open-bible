translation:
  text: '1. He says to me, “Remove double-mindedness from yourself.[a] Do not be double-minded at all
    when asking from God. Do not say to yourself, ‘How can I ask anything from the Lord and receive it,
    when I have sinned so much against him?’


    2. “Do not think these things. Turn to the Lord with your whole heart and ask him without doubting.
    You will know his great compassion.[l] He will certainly not abandon you. He will fulfill the request
    of your soul.[b]


    3. “God is not like people who hold grudges. He holds no grudge[j] and has compassion on what he has
    made.


    4. “So cleanse your heart from all the empty things of this age[c] and from the things previously
    spoken to you.[d] Ask from the Lord, and you will receive everything. None of your requests will be
    left unmet,[e] if you ask from the Lord without doubting.


    5. “But if you doubt in your heart, you will receive none of your requests. Those who doubt God are
    double-minded. They obtain none of their requests at all.


    6. “But those who are whole in faith ask for all things, trusting the Lord, and receive them. They
    ask without doubting and are not double-minded at all. Every double-minded man, unless he repents,[k]
    will be saved with difficulty.[m]


    7. “So cleanse your heart from double-mindedness. Put on faith, because it is strong. Believe God
    that you will receive all the requests you make. If you ask the Lord for something and receive it
    slowly, do not be double-minded because you did not quickly receive the request of your soul. You
    certainly receive your request slowly because of some testing or transgression that you do not know
    about.[f]


    8. “So do not stop asking for the request of your soul. You will receive it. But if you grow weary
    and become double-minded while asking, blame yourself, not the one who gives to you.


    9. “Look at this double-mindedness. It is evil and senseless. It uproots many from faith, even people
    who are very faithful and strong. This double-mindedness is a daughter of the devil[n] and acts very
    wickedly toward God’s servants.[g]


    10. “So despise double-mindedness and master it in every matter, having put on strong and mighty faith.
    Faith promises everything and accomplishes everything. But double-mindedness does not trust itself[o]
    and fails in all the works it does.


    11. “You see then,” he says, “faith is from above, from the Lord, and has great power. But double-mindedness
    is an earthly spirit[h] from the devil and has no power.


    12. “So serve faith, which has power. Keep away from double-mindedness, which has no power. You will
    live to God.[i] All who think these things[p] will live to God.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Double‑mindedness” (διψυχία) is a stock vice in Hermas, distinct from the act of doubting (διστάζειν).
    reason: lexical_alternative
  - marker: b
    text: “Bring the request of your soul to completion” renders πληροφορήσει; alternatives include “fully
      grant” or “fully assure.” Context favors fulfillment of the petition.
    reason: lexical_alternative
  - marker: c
    text: 'Vanities of this age retains the source’s wording. Alternative: empty or worthless things of
      this age. No specific catalogue of activities is supplied in this clause.'
    reason: cultural_note
  - marker: d
    text: The working Greek and Athos transcription say to cleanse the heart from the previously spoken
      words or matters (rhēmata). The difficult wording is retained. Vulgata, Hilgenfeld1873 printed54,
      instead says to observe the preceding words given by God; Palatina, Gebhardt/Harnack1877 printed103,
      has cleansing from the things previously commanded. These are differing versional renderings, not
      a unanimous instruction to discard all prior teaching.
    reason: alternative_reading
  - marker: e
    text: '“Not be left short” translates the rare ἀνυστέρητος; alternatives: “not deprived,” “not disappointed.”'
    reason: lexical_alternative
  - marker: f
    text: The working Greek and Lake1907 Plate VII lines26–27 say certainly because of some testing or
      transgression unknown to you. The Latin versions, Vulgata printed55 and Palatina printed105, have
      perhaps. Certainly remains the working assertion; it is not weakened to perhaps. Testing, trial
      or temptation are lexical alternatives; no added explanation of God’s educational purpose is stated
      here.
    reason: cross_reference
  - marker: g
    text: Reader-facing servant follows current DOCTRINE.md. Greek doulos can denote bonded status; belonging
      to God and total allegiance remain part of the metaphor. Slave is a lexical alternative recorded
      here, not the required main-text term.
    reason: lexical_alternative
  - marker: h
    text: “Earthly spirit” (ἐπίγειον πνεῦμα) contrasts with “from above” (ἄνωθεν); the imagery is vertical,
      not merely “worldly attitude.”
    reason: cultural_note
  - marker: i
    text: “Live to God” preserves the dative construction (τῷ θεῷ) common in early Christian texts; “live
      for God” is a possible paraphrase.
    reason: lexical_alternative
  - marker: j
    text: The Greek uses the bearing-a-grudge / not-bearing-a-grudge pair. The retained remember-wrongs
      wording describes this contrast; bear a grudge is an alternative idiomatic rendering.
    reason: cultural_note
  - marker: k
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: l
    reason: textual_variant
    text: The continuous working print has the compound polyeusplanchnia, abundant compassion. Lake1907
      Plate VII line18 has the two-word great compassion. The former attached source used the two-word
      form; the standard English great tender mercy conveys the working compound’s sense without claiming
      identical Greek wording.
  - marker: m
    reason: textual_variant
    text: The working Greek and Lake1907 Plate VII line24 retain unless he repents and will be saved with
      difficulty. Vulgata printed54 instead has will live to God with difficulty; Palatina printed105
      has will be saved with difficulty and expands the repentance object to this fault. The working salvation
      assertion and its repentance condition remain; no different doctrine or added object is inserted.
  - marker: n
    reason: textual_variant
    text: Working daughter (thygatēr) contrasts with sister (adelphē) in Lake1907 Plate VII line30. Vulgata
      printed55 and Palatina printed105 both have daughter (filia). The working clause also includes even
      very faithful and strong people; the Athos transcription has only very strong at this point, while
      both printed Latin versions include faithful and strong. The fuller working wording is retained.
      Athanasius, De decretis4.3, calls something attributed to the Shepherd offspring of the devil, but
      does not quote the same wording; that indirect allusion cannot independently establish daughter
      rather than sister.
  - marker: o
    reason: lexical_alternative
    text: The working text explicitly says double-mindedness does not trust itself (heautē). The prior
      English omitted itself. The personified reflexive is restored; both Vulgata printed55 and Palatina
      printed105 likewise have sibi, itself.
  - marker: p
    reason: textual_variant
    text: The working closing condition describes those who think these things (present participle). Lake1907
      Plate VII lines34–35 has an aorist participle, those who have thought thus. Palatina printed105
      describes those who think so; Vulgata printed55 describes those who do these things. The English
      retains the working mental verb rather than silently replacing it with doing.
lexical_decisions:
- source_word: δίψυχος / διψυχία
  chosen: double‑minded / double‑mindedness
  alternatives:
  - doubtful
  - wavering
  - in two minds
  lexicon: BDAG
  rationale: Hermas treats διψυχία as a named vice and personifies it; “double‑mindedness” preserves the
    moral category and imagery rather than reducing it to mere doubt.
- source_word: διστάζω / ἀδιστάκτως
  lemma: διστάζω
  chosen: waver / without doubting
  alternatives:
  - hesitate / unhesitatingly
  - doubt / without hesitation
  lexicon: BDAG
  rationale: Distinct from διψυχία, διστάζω denotes the act of wavering in a given moment of asking; rendered
    as “waver/without doubting” to keep the contrast clear.
- source_word: αἴτημα
  chosen: request / petition
  alternatives:
  - asking
  - prayer
  lexicon: BDAG
  rationale: Concrete term for a specific ask; “petition” or “request” keeps the transactional nuance
    and avoids generalizing to ‘prayer’ language.
- source_word: πληροφορήσει (πληροφορέω)
  chosen: bring … to completion
  alternatives:
  - fully grant
  - fully assure
  lexicon: BDAG
  rationale: In context of petitions, the verb’s sense of bringing to full measure/completion best fits;
    we avoid “assure” (internal certainty) in favor of God’s fulfilling action.
- source_word: πολυευσπλαγχνία
  chosen: tender mercy / great compassion
  alternatives:
  - pity
  - kindness
  lexicon: BDAG
  rationale: The working compound denotes abundant compassion; great tender mercy conveys its force. The
    Athos two-word alternative is recorded in note l. No new lexicon lookup is claimed.
- source_word: μνησικακέω / ἀμνησίκακος
  chosen: remember wrongs / one who does not remember wrongs
  alternatives:
  - bear a grudge / free from resentment
  - keep a record of wrongs / not keeping a record
  lexicon: BDAG
  rationale: Idiomatic rendering “remember wrongs” keeps the forensic/moral dimension without importing
    later doctrinal phrasing.
- source_word: ποίησις (αὐτοῦ)
  chosen: what he has made / his workmanship
  alternatives:
  - his creation
  - his handiwork
  lexicon: LSJ
  rationale: Here refers broadly to creatures; “what he has made” foregrounds God as maker, with “workmanship”
    as a stylistic equivalent.
- source_word: ματαιώματα τοῦ αἰῶνος τούτου
  chosen: vanities of this age
  alternatives:
  - empty things of this age
  - worthless things of this world
  lexicon: LSJ
  rationale: Echoes LXX vanity language (ματαιότης) and preserves the temporal contrast (‘this age’).
- source_word: τῶν προειρημένων σοι ῥημάτων
  chosen: the things previously spoken to you
  alternatives:
  - the words previously spoken to you
  - the matters mentioned before
  lexicon: LSJ
  rationale: Near‑literal; acknowledges that ῥήματα can mean ‘things/matters.’ The phrase likely points
    back to previously mentioned matters to purge from the heart.
- source_word: ὁλοτελής
  chosen: whole (in faith)
  alternatives:
  - entire
  - perfect
  lexicon: BDAG
  rationale: Describes undivided integrity of faith rather than sinless perfection; “whole in faith” captures
    the internal unity.
- source_word: μετανοέω
  chosen: repent
  alternatives:
  - reorient
  - repent
  - change one’s mind
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial
    assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: ἔνδυσαι / ἐνδυσάμενος
  chosen: put on
  alternatives:
  - clothe yourself with
  lexicon: BDAG
  rationale: Keeps the clothing metaphor intact, a common early‑Christian idiom for adopting a virtue.
- source_word: καταφρόνησον / κατακυρίευσον
  chosen: despise / master
  alternatives:
  - treat with contempt / subdue
  - disregard / gain dominion over
  lexicon: BDAG
  rationale: Strong imperatives match Hermas’s forceful paraenesis; ‘master’ reflects the dominion nuance
    of κατακυριεύω.
- source_word: ἐπίγειον πνεῦμα
  chosen: earthly spirit
  alternatives:
  - worldly spirit
  - spirit from the earth
  lexicon: BDAG
  rationale: Contrasts with ‘from above’ (ἄνωθεν); ‘earthly spirit’ preserves the vertical imagery.
- source_word: δοῦλος (τοῦ θεοῦ)
  chosen: servant (of God)
  alternatives:
  - slave (of God)
  lexicon: BDAG
  rationale: Current DOCTRINE.md requires reader-facing servant. Bonded status, belonging and total allegiance
    remain explicit in note g.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy1; Contested terms doulos'
- source_word: δούλευε
  chosen: serve
  alternatives:
  - be a slave to
  lexicon: BDAG
  rationale: In English, ‘serve the faith’ reads more naturally while preserving the verb’s force; the
    dative object is maintained.
- source_word: ἀπόσχου
  chosen: keep away from / abstain from
  alternatives:
  - refrain from
  - hold yourself back from
  lexicon: BDAG
  rationale: Middle voice reflexive sense (‘keep yourself away’) is preserved in phrasing.
- source_word: ζήσῃ τῷ θεῷ
  chosen: live to God
  alternatives:
  - live for God
  - live unto God
  lexicon: BDAG
  rationale: Dative ‘to God’ maintained to match early Christian idiom; “to” over “for” keeps the directional
    nuance.
- source_word: πειρασμός
  chosen: testing
  alternatives:
  - temptation
  - trial
  lexicon: BDAG
  rationale: Testing retains a contextual lexical choice; trial or temptation remain alternatives. The
    source does not explicitly state an educational purpose.
- source_word: παράπτωμα
  chosen: transgression
  alternatives:
  - offense
  - misstep
  lexicon: BDAG
  rationale: Moral lapse sense preserved; ‘misstep’ would understate the ethical weight.
- source_word: ἀνυστέρητος
  chosen: not be left short
  alternatives:
  - not deprived
  - not disappointed
  lexicon: LSJ
  rationale: Rare adjective; chosen rendering captures the idea of lacking nothing in the outcome of petitions.
- source_word: ἐκκακέω
  chosen: grow weary / lose heart
  alternatives:
  - give up
  - become discouraged
  lexicon: BDAG
  rationale: Grow weary renders the exhortation not to lose heart while asking; lose heart is an alternative
    recorded in this lexical entry.
- source_word: ἄνωθεν
  chosen: from above
  alternatives:
  - from on high
  lexicon: BDAG
  rationale: Maintains vertical provenance imagery in contrast to ‘earthly spirit.’
- source_word: ἐπαγγέλλεται / τελειοῖ
  chosen: promises / brings to completion
  alternatives:
  - professes / perfects
  - pledges / accomplishes
  lexicon: BDAG
  rationale: Personification of faith’s efficacy is preserved; ‘brings to completion’ mirrors τελειόω’s
    teleological force.
- source_word: ἀποτυγχάνει
  chosen: fails
  alternatives:
  - falls short
  - misses the mark
  lexicon: BDAG
  rationale: Plain, forceful rendering that matches the paraenetic tone.
