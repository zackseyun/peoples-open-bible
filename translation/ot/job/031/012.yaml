- timestamp: '2026-08-28T22:31:10Z'
  adjudicator: wisdom-source-audit-final
  reviewer_model: gpt-5.6-sol-2026-07-09
  source_review: WLC Hebrew, chapter context, prior Sol/Terra proposal and final high-scrutiny adjudication
  category: idiom
  tier: 1
  from: For it is a fire that consumes to destruction[a], and it would root out all my produce.
  to: For it is a fire that devours as far as destruction[a], and it would uproot all my produce.
  rationale: Both “consumes to destruction” and “devours to destruction” are unnatural English. The preposition עַד marks extent, so “as far as destruction” preserves the spatially conceived limit and leaves open whether אֲבַדּוֹן is the abstract destruction or the named realm Abaddon. “Uproot” is more idiomatic than “root out” with agricultural produce and retains the root metaphor of תְשָׁרֵשׁ.
