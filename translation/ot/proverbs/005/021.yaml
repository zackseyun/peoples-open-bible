id: PRO.5.21
reference: Proverbs 5:21
source:
  edition: WLC
  text: כִּ֤י נֹ֨כַח עֵינֵ֣י יְ֭הוָה דַּרְכֵי אִ֑ישׁ וְֽ/כָל מַעְגְּלֹתָ֥י/ו מְפַלֵּֽס׀־־׃
translation:
  text: For a man's ways are before the eyes of Yahweh, and he examines[a] all his paths.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “weighs” or “measures,” an image of assessing a person's course.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  lexicon: HALOT
  rationale: Introduces the ground or reason for the preceding warning. 'For' preserves the proverb's explanatory connection in concise English.
- source_word: נֹכַח
  chosen: before
  alternatives:
  - in front of
  - plain to
  - in the presence of
  lexicon: HALOT
  rationale: 'With ''eyes,'' the sense is spatial-metaphorical: a man''s ways lie openly before YHWH''s sight. ''Before'' is idiomatic and preserves the image of full visibility.'
- source_word: עֵינֵי יְהוָה
  chosen: the eyes of Yahweh
  alternatives:
  - the LORD's eyes
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Follows the project's default rendering for the divine name, preserving covenantal reference while matching established English Bible convention.
- source_word: דַּרְכֵי אִישׁ
  chosen: a man's ways
  alternatives:
  - the ways of a man
  - human ways
  lexicon: HALOT
  rationale: The singular אִישׁ here is generic rather than referring to one specific male individual. Per gender-accurate policy, 'a man's ways' best reflects the Hebrew form and representative force.
- source_word: וְכָל
  chosen: and all
  alternatives:
  - and every
  lexicon: HALOT
  rationale: Straightforward conjunctive plus totalizing term; 'all' reads naturally with the plural noun that follows.
- source_word: מַעְגְּלֹתָיו
  chosen: his paths
  alternatives:
  - his tracks
  - his courses
  lexicon: HALOT
  rationale: A near-synonym to 'ways' but with a slightly more concrete image of tracks or paths. 'Paths' preserves the poetic parallelism without awkwardness.
- source_word: מְפַלֵּס
  chosen: he examines
  alternatives:
  - he makes level
  - he weighs
  - he watches closely
  - he considers
  lexicon: HALOT
  rationale: The verb portrays Yahweh actively assessing a person's paths. “Examines” expresses that evaluative sense naturally; “weighs” is retained as a metaphorically closer alternative.
