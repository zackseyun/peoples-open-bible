lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  english_pob_choice: by the vision of
  chosen_korean: 환상 때문에
  alternatives_korean:
  - 보이는 것으로 인해
  - 환상을 보고서
  lexicon: ὅρασις
  rationale: 문맥상 ‘보는 행위’보다 꿈속에 나타나는 ‘환상/영상’의 내용이 원인으로 제시되므로, 현대 한국어에서 자연스러운 인과 표현으로 옮겼습니다.
- source_word: πονηρῶν ἐνυπνίων
  english_pob_choice: his evil dreams
  chosen_korean: 그의 악한 꿈
  alternatives_korean:
  - 그의 나쁜 꿈
  - 그의 악몽
  lexicon: πονηρός + ἐνύπνιον
  rationale: πονηρῶν은 도덕적으로 ‘악한’의 뉘앙스를 가지므로 단순한 ‘나쁜’보다 더 직접적으로 옮겼고, ἐνύπνια는 일반적인 ‘꿈’으로 번역하되 수식어로 성격을 드러냈습니다.
- source_word: οὐ ταραχθήσεται
  english_pob_choice: He will not be troubled
  chosen_korean: 불안해하지 않을 것입니다
  alternatives_korean:
  - 괴로워하지 않을 것입니다
  - 흔들리지 않을 것입니다
  lexicon: ταράσσω
  rationale: 타라쏘는 마음이 동요하거나 혼란스러워지는 뜻이므로, 현대 독자에게 자연스럽고 감정·심리 상태를 분명히 드러내는 ‘불안해하다’로 옮겼습니다.
