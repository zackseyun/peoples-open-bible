id: PSA.118.12
reference: Psalms 118:12
source:
  edition: WLC
  text: סַבּ֤וּ/נִי כִ/דְבוֹרִ֗ים דֹּ֭עֲכוּ כְּ/אֵ֣שׁ קוֹצִ֑ים בְּ/שֵׁ֥ם יְ֝הוָ֗ה כִּ֣י אֲמִילַֽ/ם׃
translation:
  text: They surrounded me like bees; they were extinguished like a fire of thorns[a]. In the name of Yahweh I destroyed them.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Dry thorns flare up fiercely but burn out quickly.
    reason: cultural_note
lexical_decisions:
- source_word: סַבּוּנִי
  chosen: They surrounded me
  alternatives:
  - They encircled me
  - They compassed me
  lexicon: HALOT
  rationale: From סבב, 'to surround/encircle.' 'Surrounded' is natural modern English and preserves the hostile encirclement image.
- source_word: כִדְבוֹרִים
  chosen: like bees
  alternatives:
  - as bees
  lexicon: HALOT
  rationale: The prefixed כ marks comparison. 'Like bees' is the straightforward simile and keeps the vivid swarm imagery.
- source_word: דֹּעֲכוּ
  chosen: they were extinguished
  alternatives:
  - they were extinguished
  - they died out
  - they were quenched
  lexicon: HALOT
  rationale: Directly represents the verb’s extinction sense while naturally extending the thorn-fire comparison to the enemies.
- source_word: כְּאֵשׁ קוֹצִים
  chosen: like a fire of thorns
  alternatives:
  - like the fire of thorns
  - like fire in thornbushes
  lexicon: HALOT
  rationale: Retains the construct relationship and conventional thorn-fire image.
- source_word: בְּשֵׁם יְהוָה
  chosen: In the name of Yahweh
  alternatives:
  - By the name of the LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: כִּי
  chosen: '[untranslated]'
  alternatives:
  - for
  - indeed
  lexicon: HALOT
  rationale: The exact force in the refrain is not certain enough to require “surely.”
- source_word: אֲמִילַם
  chosen: I cut them off
  alternatives:
  - I cut them off
  - I hewed them down
  - I struck them down
  lexicon: HALOT
  rationale: Avoids the added directional image of “cut them down.”
