  language: en
  text: This letter is from Jude, a servant of Jesus Christ and a brother of James. I am writing to those who have been called, who are loved in God the Father,[a] and who are kept for Jesus Christ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some manuscripts read “made holy in God the Father” instead of “loved in God the Father.”
    reason: textual_variant
  - marker: b
    text: Or “kept by Jesus the Messiah.” The Greek may mean either “for” or “by.”
    reason: alternative_reading
