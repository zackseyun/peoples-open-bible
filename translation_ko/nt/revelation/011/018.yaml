review_pass:
  verdict: revise
  source_fidelity: 초안은 주요 어휘를 대체로 반영하지만, καιρός가 이끄는 세 부정사(죽은 이들의 심판, 보상의 수여, 땅을 파괴하는 이들의 멸망)를 문법적으로 매끄럽게 연결하지 못합니다. 또한 「주의 노예들 예언자들」은 동격 관계가 불분명합니다.
  naturalness: 「…때, 곧 … 그들에게 상을 주실 때, 또 … 멸하실 때가 임하였나이다」는 중첩되고 비자연스러운 구조입니다. 현대 표준어 합쇼체로는 ‘…때가 왔습니다’ 아래에 병렬 행위를 연결하는 편이 명료합니다.
  terminology: δοῦλος는 이 문맥에서 존칭적 소속 표현인 「주의 종들」이 자연스럽고, 대안 「노예들」은 각주로 보존할 수 있습니다. ἅγιοι는 「성도들」, φοβουμένοις τὸ ὄνομά σου는 원문의 관용 표현을 살려 「주의 이름을 두려워하는 이들」로 옮깁니다. γῆ는 묵시적 문맥상 「땅」으로 번역하되 「지역/땅」의 어휘 범위는 각주로 보존합니다.
  issues:
  - severity: high
    issue: 부정사들의 통사적 연결이 불명확함
    rationale: κρινθῆναι, δοῦναι, διαφθεῖραι는 모두 「그 때가 왔다」에 연결됩니다. 초안은 ‘죽은 자들이 심판받을 때’와 ‘상을 주실 때’를 별개 절로 중첩하여 원문의 병렬 구조와 한국어 문법을 모두 흐립니다.
  - severity: medium
    issue: 「주의 노예들 예언자들」의 동격 표지가 없음
    rationale: τοῖς δούλοις σου τοῖς προφήταις는 ‘주의 종들, 곧 예언자들’이라는 관계입니다. 「종들인 예언자들」 또는 쉼표/대시로 동격을 밝혀야 합니다.
  - severity: medium
    issue: δοῦλος의 본문 선택이 문맥상 다소 부자연스러움
    rationale: 「노예」도 가능한 사전적 번역이나, 하나님께 속한 사람들의 호칭으로서 이 절에서는 현대 한국어의 「종」이 더 자연스럽습니다. 대안은 각주로 제시합니다.
  - severity: low
    issue: 영어 감사 추적의 각주 앵커가 내용과 일치하지 않음
    rationale: 제공된 영어 a는 ‘nations’ 뒤에 붙었으나 δοῦλος 각주이고, b는 ‘your name’ 뒤에 붙었으나 γῆ 각주입니다. 한국어 개정문에서는 해당 어휘에 각각 각주를 붙여 앵커를 바로잡습니다.
  revised_text: 또 민족들이 분노하였고, 주의 진노가 이르렀으며, 죽은 이들이 심판을 받고 주의 종들인 예언자들과 성도들과 주의 이름을 두려워하는 이들, 곧 작은 이들과 큰 이들에게 상을 주며, 땅을 파괴하는 자들을 멸망시키실 때가 왔습니다.
  revised_footnotes:
  - marker: a
    text: 「종들」은 문맥에 따라 「노예들」로도 옮길 수 있습니다. 그리스어 둘로스(δοῦλος)는 종 또는 노예를 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 「땅」은 「지역」으로도 옮길 수 있습니다. 그리스어 게(γῆ)는 땅 또는 지역을 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 시간 표현(ὁ καιρός)과 세 부정사의 병렬을 한국어 한 문장 안에서 명확히 재구성했습니다. 예언자들은 주의 종들과 동격임을 밝혔고, 작은 이들과 큰 이들은 앞선 수여 대상의 포괄성을 나타내도록 유지했습니다. δοῦλος와 γῆ의 가능한 대안은 해당 어휘에 올바르게 연결된 각주로 보존했습니다.
