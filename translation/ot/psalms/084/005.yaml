  from: Blessed are those whose strength is in you, in whose hearts are the highways[a].
  to: Blessed are those whose strength is in you, who carry the pilgrim roads in their hearts[a].
  rationale: I retain the latest audit's collective “those” and plural “hearts,” which accurately represent the Hebrew's shift in number. Its caution against inserting Zion remains useful, but identifying the roads as pilgrim roads conveys the contextual meaning without naming an unstated destination.
