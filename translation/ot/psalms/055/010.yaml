id: PSA.55.10
reference: Psalms 55:10
source:
  edition: WLC
  text: יוֹמָ֤ם וָ/לַ֗יְלָה יְסוֹבְבֻ֥/הָ עַל חוֹמֹתֶ֑י/הָ וְ/אָ֖וֶן וְ/עָמָ֣ל בְּ/קִרְבָּֽ/הּ־׃
translation:
  text: Day and night violence and strife[a] patrol the city's walls; wickedness and trouble are within it.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew says “they,” which may instead refer to the enemies.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  chosen: Day and night
  alternatives:
  - By day and by night
  - All day and all night
  lexicon: HALOT
  rationale: Idiomatic temporal pair indicating continual activity. 'Day and night' is natural modern English and preserves the sense of unceasing action.
- source_word: יְסוֹבְבֻהָ
  chosen: they go around her
  alternatives:
  - they surround her
  - they encircle her
  lexicon: HALOT
  rationale: From סבב, 'to go around, surround.' The plural verb has an unspecified subject carried from context; 'they go around her' preserves the verbal motion and avoids over-interpreting the subject. 'Surround' is possible but slightly flattens the iterative movement implied by the form and context.
- source_word: עַל חוֹמֹתֶיהָ
  chosen: on her walls
  alternatives:
  - upon her walls
  - around her walls
  lexicon: HALOT
  rationale: עַל normally means 'on/upon.' With the verb of circling, the image is of hostile or corrupt forces moving on the city's walls. 'On her walls' is the most direct rendering.
- source_word: אָוֶן
  chosen: wickedness
  alternatives:
  - wickedness
  - iniquity
  - evil
  lexicon: HALOT
  rationale: The moral and harmful sense is prominent in the surrounding catalogue of evils.
- source_word: עָמָל
  chosen: trouble
  alternatives:
  - oppression
  - toil
  - trouble
  lexicon: HALOT
  rationale: Conveys harmful distress/oppression while remaining broad enough for the term's range.
- source_word: בְּקִרְבָּהּ
  chosen: are within her
  alternatives:
  - are in her midst
  - are inside her
  lexicon: HALOT
  rationale: Literally 'in her midst.' Because the referent is the city personified as feminine, 'within her' is idiomatic English that preserves the personification.
