reference: Baruch 2:19
source:
  edition: lxx-swete-1909
  text: ὅτι οὐκ ἐπὶ τὰ δικαιώματα τῶν πατέρων ἡμῶν καὶ τῶν βασιλέων ἡμῶν ἡμεῖς καταβάλλομεν τὸν ἔλεον κατὰ πρόσωπόν σου, Κύριε ὁ θεὸς ἡμῶν,
  language: Greek
  pages: []
  confidence: high
