translation:
  language: en
  text: The people were scorched by intense heat. They blasphemed the name of God, who has authority over these plagues. But they did not reorient toward God[r1] so that they would give him glory.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: were scorched with great heat
  simplified_phrase: were scorched by intense heat
  preserved_meaning: The people suffered severe scorching caused by heat.
  reasoning_layer_used: Lexical decisions for ἐκαυματίσθησαν and καῦμα μέγα
  rationale: “By intense heat” states the cause naturally while preserving the plague’s severity.
