id: PSA.37.3
reference: Psalms 37:3
source:
  edition: WLC
  text: בְּטַ֣ח בַּֽ֭/יהוָה וַ/עֲשֵׂה ט֑וֹב שְׁכָן אֶ֝֗רֶץ וּ/רְעֵ֥ה אֱמוּנָֽה־־׃
translation:
  text: Trust in Yahweh and do good; dwell in the land and enjoy safe pasture[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “cultivate faithfulness.” The Hebrew expression can mean “feed on faithfulness” or “tend faithfulness,” and its sense is disputed.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח
  chosen: Trust
  alternatives:
  - Take refuge
  - Be confident
  lexicon: HALOT
  rationale: Imperative of בטח commonly denotes placing confidence or trust in someone. 'Trust' is the most natural English imperative here and fits the parallel exhortations.
- source_word: בַּיהוָה
  chosen: in Yahweh
  alternatives:
  - in Yahweh
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: וַעֲשֵׂה טוֹב
  chosen: and do good
  alternatives:
  - and do what is good
  lexicon: HALOT
  rationale: Straightforward imperative plus adjective functioning substantivally/objectively. 'Do good' is idiomatic and preserves the concise force of the Hebrew.
- source_word: שְׁכָן אֶרֶץ
  chosen: dwell in the land
  alternatives:
  - settle in the land
  - inhabit the land
  lexicon: HALOT
  rationale: שׁכן means dwell/settle. 'The land' is preferable to 'the earth' in this wisdom-psalm context, where stable possession of the land is a recurring covenantal motif.
- source_word: וּרְעֵה
  chosen: feed on
  alternatives:
  - feed on
  - graze on
  - shepherd
  lexicon: HALOT
  rationale: Retains the feeding/grazing image of the Hebrew rather than substituting an inferred agricultural-ethical action.
- source_word: אֱמוּנָה
  chosen: faithfulness
  alternatives:
  - security
  - truth
  - steadfastness
  lexicon: HALOT
  rationale: A well-supported sense in this difficult expression; the note preserves the possible security/reliability interpretation.
