- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Depiction of divine empowerment in Samson
  chosen_reading: the Spirit of the LORD rushed upon him
  alternative_readings:
  - the Spirit of the LORD came mightily upon him
  - the Spirit of the LORD came powerfully upon him
  rationale: The translation preserves the text's portrayal of sudden divine empowerment without importing later theological categories beyond the narrative's wording. 'Rushed upon' reflects the Hebrew idiom's force while remaining readable.
