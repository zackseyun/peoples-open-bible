  from: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
  to: Moses inspected all the work and saw that they had done it exactly as Yahweh had commanded. Then Moses blessed them.
  rationale: The lexical history recognizes that Moses’ seeing is an inspection, though it preferred the basic verb for source transparency. I make that contextual meaning explicit and preserve the repeated clauses’ force through “exactly,” while retaining the straightforward statement that Moses blessed them.
