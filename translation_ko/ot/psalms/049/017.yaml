    rationale: ‘집’의 의미에 관한 주석과 부유함·두려움 관련 결정은 49:17의 번역을 뒷받침하지 못합니다. 이 절의 ‘모든 것’, ‘영광’, ‘내려가다’에 대응하는 주석으로 교체해야 합니다.
