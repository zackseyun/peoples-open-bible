  - severity: medium
    issue: ‘있던 것을 내가 보았습니다’가 εἶδόν σε의 직접 목적어를 약화합니다.
    rationale: 그리스어는 ‘너를 보았다’라고 직접 진술합니다. 한국어에서도 ‘내가 너를 보았습니다’라고 하여 보인 대상이 나다나엘임을 분명히 하는 것이 안전합니다.
