theological_decisions:
- issue: Symbolic animal imagery in the Animal Apocalypse
  chosen_reading: Retain the concrete animal image 'black wild boar' rather than interpret it as a people-group or historical figure in the translation line.
  alternative_readings:
  - Translate interpretively as a hostile nation or ruler
  - Use a more generic 'black pig'
  rationale: The passage belongs to a symbolic dream vision whose imagery should remain visible in translation. Historical identification belongs in commentary, not in the main text.
  doctrine_reference: 'Translation philosophy: preserve apocalyptic imagery; do not flatten symbolic language into generic prose.'
