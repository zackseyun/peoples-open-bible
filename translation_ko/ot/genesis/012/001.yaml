base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Now the LORD said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: ko
  text: 야훼께서 아브람에게 말씀하셨습니다. “네 땅과 네 친족과 네 아버지의 집을 떠나, 내가 네게 보여 줄 땅으로 가십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 본문의 하나님의 이름을 POB 기본값인 ‘야훼’로 옮겨, 일반적인 호칭 ‘주님’과 구별했습니다.
- source_word: לֶךְ לְךָ
  english_pob_choice: Go out
  chosen_korean: 떠나
  alternatives_korean:
  - 가십시오
  - 나가십시오
  - 가서 떠나십시오
  lexicon: הלך
  rationale: 영어 POB가 ‘Go out’으로 잡은 분리·이탈의 뉘앙스를 살려, 단순 이동보다 관계와 거처에서의 이탈을 드러내는 ‘떠나’로 옮겼습니다.
- source_word: מֵאַרְצְךָ ... וּמִבֵּית אָבִיךָ
  english_pob_choice: from your land ... from your father’s house
  chosen_korean: 네 땅에서, 네 친족에게서, 네 아버지의 집에서
  alternatives_korean:
  - 네 땅에서, 네 족속에게서, 네 아버지의 집에서
  - 네 땅에서, 네 혈족에게서, 네 아버지의 집에서
  lexicon: ארץ / מולדת / בית אב
  rationale: ‘kindred’를 단순 혈연보다 넓은 소속 단위로 보아 ‘친족’으로 옮겼고, ‘father’s house’는 직접적 가족·가문 소속을 드러내는 ‘아버지의 집’으로 유지했습니다.
- source_word: אֶל הָאָרֶץ אֲשֶׁר אַרְאֶךָּ
  english_pob_choice: to the land that I will show you
  chosen_korean: 내가 네게 보여 줄 땅으로
  alternatives_korean:
  - 내가 네게 보여 주는 땅으로
  - 내가 네게 나타내 줄 땅으로
  lexicon: ראה
  rationale: ראה의 시각적·지시적 의미를 반영하여, 장차 안내받게 될 목적지를 분명히 하는 ‘보여 줄 땅’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 호칭 처리
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 기본 원칙에 따라 하나님의 고유 이름을 일반 호칭으로 바꾸지 않고 드러내어, 창세기 12장의 소명 명령이 야훼의 주권적 발화임을 보존했습니다.
  doctrine_reference: 하나님의 이름과 언약적 자기계시
- issue: 명령형의 한국어 공손도
  chosen_reading: 아브람에게 주어진 직접 명령은 합쇼체 명령형으로 처리했습니다.
  alternative_readings:
  - 반말형 명령
  - 서술형 완화
  rationale: 본문의 명령성을 유지하되 한국어 성경 문체에 맞게 공손한 서술·명령 혼합 형태로 옮겨, 소명의 절대성을 약화시키지 않았습니다.
  doctrine_reference: 소명과 순종
