  from: 'Thus says Yahweh of hosts: The sons of Israel and the sons of Judah alike are oppressed[a]; all their captors hold them fast[b]; they refuse to let them go.'
  to: 'Thus says Yahweh of Armies: The people of Israel and the people of Judah alike are oppressed; all their captors hold them fast and refuse to let them go.'
  rationale: The successive revisions correctly brought Israel and Judah into one shared condition and settled on the natural 'alike'; I preserve both gains. The earlier preference for 'sons' chiefly preserved Hebrew form, whereas 'people' conveys the national reference here.
