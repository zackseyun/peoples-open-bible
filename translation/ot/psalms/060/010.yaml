theological_decisions:
- issue: Divine rejection language in lament
  chosen_reading: Retain the psalm's direct claim that God has rejected his people and is not going out with their armies as covenant-lament language.
  alternative_readings:
  - Soften to 'allowed us to be rejected' or 'seemed to reject us'
  rationale: The Hebrew directly attributes rejection and non-participation in battle to God. The translation preserves the theological tension of lament rather than softening the statement.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
revisions:
- timestamp: '2026-04-21T00:17:07Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/060/012.json
  category: awkward_english
  tier: 1
  from: and do not go out
  to: and do you not go out
  rationale: 'The Hebrew construction is a single rhetorical question governed by ''hă/lōʾ'': ''Is it not [the case that] you have rejected us AND [that] you do not go out with our armies?'' The current English rendering, ''...and do not go out...'', breaks the interrogative syntax and can be misread as a negative command. Restoring the interrogative form with ''and do you not go out'' makes the English grammatical and accurately reflects the function of the Hebrew imperfect verb (tēṣēʾ) as part of the ongoing question.'
- timestamp: '2026-08-27T11:06:19Z'
  adjudicator: source-audit
  reviewer_model: gpt-5.6-sol
  source_review: WLC/OSHB morphology, existing multi-model review findings, and Psalms book-level audit reviewed 2026-08-27
  category: grammar
  tier: 1
  from: Have you not[a], O God, rejected us, and do you not go out, O God[b], with our armies?
  to: Have you not rejected us, O God[a]? You do not go out with our armies, O God[b].
  rationale: Separated the rhetorical question from the negative statement so English no longer implies that God does accompany the armies.
- timestamp: '2026-11-09T18:42:09Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: Have you not rejected us, O God[a]? You do not go out with our armies, O God[b].
  to: Have you not rejected us, O God[a]? You do not march out with our armies, O God.
  rationale: The latest revision correctly prevented the English question from implying that God does accompany the armies. I preserve that negative statement and document the serious alternative in which the opening question answers verse 9.
