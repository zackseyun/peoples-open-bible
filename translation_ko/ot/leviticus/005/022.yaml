  - severity: medium
    issue: ‘그것을 숨기며’
    rationale: וְכִחֶשׁ בָּהּ는 그 분실물에 관해 거짓말하거나 이를 부인하는 뜻입니다. ‘숨기다’는 가능한 상황적 귀결일 수 있으나 원문의 진술 행위를 대체합니다.
  - severity: medium
