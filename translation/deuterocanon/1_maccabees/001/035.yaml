  text: καὶ παρέθεντο ὅπλα καὶ τροφήν, καὶ συναγαγόντες τὰ σκῦλα Ἰερουσαλὴμ ἀπέθεντο ἐκεῖ, καὶ ἐγένετο εἰς μεγάλην παγίδα,
  language: Greek
