lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 왔습니다
  - 이르렀습니다
  - 이르게 되었습니다
  lexicon: HALOT
  rationale: 예언 공식에서 ‘말씀이 ... 오다’의 관용적 의미를 살리면서, 현대 한국어에서도 자연스럽고 격식을 갖춘 표현으로 옮겼습니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  - 일
  lexicon: HALOT
  rationale: 예언문맥의 정형 표현인 ‘야훼의 말씀’을 유지하여, 단순한 정보 전달보다 하나님의 선포라는 무게를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문이 여호와 대체 번역이 아닌 신명사 직접 표기를 요구하므로, 한국어도 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 저에게
  lexicon: HALOT
  rationale: 히브리어 1인칭 목적격을 자연스러운 현대 한국어로 옮기되, 예언자에게 직접 도달하는 방향성을 유지했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: ‘야훼의 말씀’으로 옮겨, 하나님의 언약 სახელ을 제목어가 아닌 고유명으로 드러냈습니다.
  alternative_readings:
  - ‘주님의 말씀’
  - ‘여호와의 말씀’
  rationale: 본문의 יְהוָה는 직설적으로 신명사를 사용하므로, 대체 тит울보다 고유명 번역이 원문 의도를 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
