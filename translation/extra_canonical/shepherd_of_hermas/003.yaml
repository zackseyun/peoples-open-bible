theological_decisions:
- issue: Epithet Θεὸς τῶν δυνάμεων
  chosen_reading: God of hosts
  alternative_readings:
  - God of the powers
  - God of armies
  rationale: δυνάμεις in LXX idiom denotes heavenly armies/hosts. “Hosts” captures the traditional biblical
    sense without imposing the Tetragrammaton title.
- issue: Translation of ἐκκλησία
  chosen_reading: church
  alternative_readings:
  - assembly
  rationale: Second-century context clearly intends the Christian community; “church” preserves ecclesial
    identity and continuity.
- issue: Plural “books of life”
  chosen_reading: 'retain plural: “books of life”'
  alternative_readings:
  - harmonize to singular “book of life”
  rationale: The Greek text reads the plural βίβλους; we preserve it rather than conform to later or familiar
    singular phrasing.
  doctrine_reference: Transparency policy — preserve source even against tradition
- issue: Rendering of νόμιμα
  chosen_reading: statutes
  alternative_readings:
  - commandments
  - ordinances
  - decrees
  rationale: Legal connotation is foregrounded; “statutes” aligns with LXX usage and maintains the juridical
    tone.
- issue: Translation of ἅγιοι
  chosen_reading: holy ones
  alternative_readings:
  - saints
  rationale: “Holy ones” is more literal and avoids ecclesiastical jargon while preserving the sanctity
    concept.
  doctrine_reference: 'DOCTRINE.md: Readable modern English without unnecessary ecclesiastical jargon'
- issue: Contextual repentance reassessment
  chosen_reading: Preserve turning the household and conditional whole-hearted repentance as distinct
    verbs, the plural books of life with the holy ones, and the final statutes/faith condition; source
    and versional alternatives remain in notes.
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
