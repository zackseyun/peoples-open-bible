  from: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
  to: In those days, while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs[a] who guarded the entrance, became angry and plotted to kill King Ahasuerus.
