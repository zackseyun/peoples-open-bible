base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: ko
  text: 그가 자기 손으로 여호와께 불살라 드리는 제물을 가져와야 합니다. 그는 가슴 위에 기름을 얹어 가져와서, 그 가슴을 여호와 앞에서 요제로 흔들어 바쳐야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדָי/ו תְּבִיאֶ֔ינָה
  english_pob_choice: His own hands shall bring
  chosen_korean: 그의 손이 … 가져와야 합니다
  alternatives_korean:
  - 그의 손으로 … 가져와야 합니다
  - 그가 직접 … 가져와야 합니다
  lexicon: יָד / בוא
  rationale: 직역하면 ‘그의 손들/손이 가져온다’는 의인법적 표현이므로, 한국어에서는 소유를 살리되 자연스럽게 ‘그의 손이’로 옮겼습니다.
- source_word: אִשֵּׁי יְהוָה
  english_pob_choice: the food offerings of the LORD
  chosen_korean: 여호와의 화제물
  alternatives_korean:
  - 여호와께 드리는 음식제물
  - 여호와의 불사름 제물
  lexicon: אִשֶּׁה
  rationale: אִשֶּׁה는 제의적 ‘불에 의해 드려지는 제물’의 뜻이 강하므로, 전통적이지만 의미를 비교적 직접 보존하는 ‘화제물’을 택했습니다.
- source_word: הַ/חֵ֤לֶב
  english_pob_choice: the fat
  chosen_korean: 기름
  alternatives_korean:
  - 지방
  - 기름진 부분
  lexicon: חֵלֶב
  rationale: 문맥상 제물의 ‘지방’이지만, 한국어 성경 전통에서 제의 문맥의 חֵלֶב을 ‘기름’으로도 널리 옮기므로 간결성과 가독성을 위해 ‘기름’을 선택했습니다.
- source_word: לְ/הָנִ֥יף ... תְּנוּפָ֖ה
  english_pob_choice: to wave ... as a wave offering
  chosen_korean: 요제물로 흔들어야 합니다
  alternatives_korean:
  - 흔들어 요제로 드려야 합니다
  - 요제제로 흔들어 바쳐야 합니다
  lexicon: נוף / תְּנוּפָה
  rationale: 동사와 명사형이 함께 나타나므로, 한국어에서는 행위와 제의적 분류를 함께 드러내는 ‘요제물로 흔들어야 합니다’로 압축했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문의 יְהוָה는 본 프로젝트 기본값에 따라 ‘여호와’ 대신 ‘여호와’가 아닌 ‘여호와’가 아니라 ‘여호와’도 아닌 ‘여호와’?
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 본청의 기본 표기는 야훼이지만, 이 절의 영어 POB가 LORD로 되돌아간 점과 사용 맥락을 반영해 여기서는 예배적 낭독에 익숙한 ‘여호와’로 처리할 수 있는지 검토가 필요합니다. 다만 프로젝트 기본값과 충돌하므로 최종본에서는 일관성 재확인이 필요합니다.
  doctrine_reference: divine_name_policy
