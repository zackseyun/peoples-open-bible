id: HERM.V.1.i
reference: Shepherd of Hermas — Vision 1, section i
unit: section
book: Shepherd of Hermas
source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: ἐλάλησα; οὐ πάντοτέ σε ὡς θεὰν ἡγησάμην; οὐ πάντοτέ σε ἐνετράπην ὡς ἀδελφήν; τί μου καταψεύδῃ, ὦ γύναι, τὰ πονηρὰ ταῦτα καὶ ἀκάθαρτα; 8. γελάσασά μοι λέγει· Ἐπὶ τὴν καρδίαν σου ἀνέβη ἡ ἐπιθυμία τῆς πονηρίας. ἢ οὐ δοκεῖ σοι ἀνδρὶ δικαίῳ πονηρὸν πρᾶγμα εἶναι ἐὰν ἀναβῇ αὐτοῦ ἐπὶ τὴν καρδίαν ἡ πονηρὰ ἐπιθυμία; ἁμαρτία γέ ἐστιν, καὶ μεγάλη, φησίν. ὁ γὰρ δίκαιος ἀνὴρ δίκαια βουλεύεται. ἐν τῷ οὖν δίκαια βουλεύεσθαι αὐτὸν κατορθοῦται ἡ δόξα αὐτοῦ ἐν τοῖς οὐρανοῖς καὶ εὐκατάλλακτον ἔχει τὸν Κύριον ἐν παντὶ πράγματι αὐτοῦ· οἱ δὲ πονηρὰ βουλευόμενοι ἐν ταῖς καρδίαις αὐτῶν θάνατον καὶ αἰχμαλωσίαν ἑαυτοῖς ἐπισπῶνται, μάλιστα οἱ τὸν αἰῶνα τοῦτον περιποιούμενοι καὶ γαυριῶντες ἐν τῷ πλούτῳ αὐτῶν καὶ μὴ ἀντεχόμενοι τῶν ἀγαθῶν τῶν μελλόντων. 9. μετανοήσουσιν αἱ ψυχαὶ αὐτῶν, οἵτινες οὐκ ἔχουσιν ἐλπίδα, ἀλλὰ ἑαυτοὺς ἀπηγνώκασι καὶ τὴν ζωὴν αὐτῶν. ἀλλὰ σὺ προσεύχου πρὸς τὸν Θεόν, καὶ ἰάσεται τὰ ἁμαρτήματά σου καὶ ὅλου τοῦ οἴκου σου καὶ πάντων τῶν ἁγίων.
  language: Greek
  pages:
  - 314
  unit_id: V.1.i
  label: Vision 1, section i
  sequence: 1
translation:
  text: '"Did I speak? Did I not always regard you as a goddess [1]? Did I not always respect you as a sister? Why are you falsely accusing me, woman, of these wicked and unclean things?"


    She laughed and says to me, "Evil desire has risen up into your heart [2]. Or does it not seem to you a wicked thing for a righteous man if evil desire rises into his heart? It is indeed a sin—and a great one, she says. For a righteous man plans what is righteous. Therefore, in planning what is righteous, his honor is established in the heavens [3], and he has the Lord readily reconciled [4] in every affair of his. But those who plan evil in their hearts bring upon themselves death and captivity—especially those who secure this present age for themselves [5], who exult in their wealth, and who do not hold fast to the good things that are coming.


    "Will their souls reorient[r1] [6]—those who have no hope, but have despaired of themselves and of their life? But you—pray to God, and he will heal your sins [7], and those of your whole household, and of all the holy ones [8]."'
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
