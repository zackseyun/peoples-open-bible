id: PRO.28.5
reference: Proverbs 28:5
source:
  edition: WLC
  text: אַנְשֵׁי רָ֭ע לֹא יָבִ֣ינוּ מִשְׁפָּ֑ט וּ/מְבַקְשֵׁ֥י יְ֝הוָ֗ה יָבִ֥ינוּ כֹֽל־־׃
translation:
  text: Evil men do not understand justice, but those who seek Yahweh understand it fully[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “understand everything,” referring here to comprehensive moral discernment, especially justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי רָע
  chosen: Evil men
  alternatives:
  - men of evil
  - evil people
  lexicon: HALOT
  rationale: Construct phrase literally means 'men of evil.' 'Evil men' preserves the masculine/generic form of the Hebrew while remaining natural English. 'Evil people' is possible, but the project prefers gender-accurate renderings where the source is grammatically masculine and representative.
- source_word: יָבִינוּ
  chosen: understand
  alternatives:
  - discern
  - comprehend
  lexicon: HALOT
  rationale: The verb בין commonly denotes understanding or discernment. 'Understand' is the most natural and sufficiently broad rendering here, and it works in both cola for consistency.
- source_word: מִשְׁפָּט
  chosen: justice
  alternatives:
  - judgment
  - what is right
  lexicon: HALOT
  rationale: In wisdom literature, מִשְׁפָּט often refers not merely to a legal verdict but to justice/right order. 'Justice' best fits the ethical contrast with evil men and the practical discernment in view.
- source_word: מְבַקְשֵׁי יְהוָה
  chosen: those who seek Yahweh
  alternatives:
  - seekers of the LORD
  - those who seek Yahweh
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: כֹל
  chosen: everything
  alternatives:
  - all things
  - it all
  lexicon: HALOT
  rationale: “Everything” is natural English for the absolute expression; the note explains its contextual, proverbial force.
