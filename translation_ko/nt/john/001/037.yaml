base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'his two disciples,' referring to John the Baptist.
