- field: translation.footnotes
  value:
  - marker: a
    text: The 'shepherd who was speaking with me' is the angelic guide figure in Hermas, often identified with the Shepherd/Angel of repentance.
    reason: cultural_note
  - marker: b
    text: '''Angel of punishment'' could also be rendered ''angel of retribution.'' The Greek τιμωρία denotes punitive justice.'
    reason: lexical_alternative
  - marker: c
    text: '''Torments of this present life'' clarifies that βιωτικαί refers to temporal, not eschatological, afflictions.'
    reason: cultural_note
  - marker: d
    text: '''Take on many projects'' could also be ''impose many burdens on themselves'' or ''attempt many things.'''
    reason: lexical_alternative
  - marker: e
    text: '''It does not rise upon their heart'' is a Semitic-style idiom for ''it does not occur to them'' or ''they do not realize.'''
    reason: lexical_alternative
  - marker: f
    text: '''Strengthened in faith in the Lord'' could also be taken as ''strengthened in the Lord’s faithfulness.'' The context favors faith directed toward the Lord.'
    reason: lexical_alternative
  - marker: g
    text: Or 'Seeing them being scourged'.
    reason: previous_rendering
  - marker: h
    text: Or 'He takes over those'.
    reason: previous_rendering
  - marker: i
    text: Or 'and they suffer many other such things'.
    reason: previous_rendering
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
  archived_by: reorientation-marker-compatibility
