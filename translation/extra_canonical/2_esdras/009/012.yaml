source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et cum adhuc esset eis apertum paenitentiae locus non intellexerunt sed spreverunt, hos oportet post mortem in cruciamento cognoscere.
  language: Latin
translation:
  text: and while a place of repentance[b] was still open to them[a], they did not understand but scorned it; these must know it after death in torment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'and while a place of repentance was still open to them did not understand but scorned it—for these it is necessary to know after death in torment.'.
    reason: previous_rendering
  - marker: b
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for the missed opportunity to live; do not change this works eschatological claims.
    reason: lexical_alternative
