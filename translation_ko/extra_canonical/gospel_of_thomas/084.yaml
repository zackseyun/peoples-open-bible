  to: 예수께서 말씀하셨습니다. “여러분이 자신의 닮은 모습을 보는 날에는 기뻐합니다. 그러나 여러분보다 먼저 생겨난[b] 여러분의 상(像)들[a]을 보게 되면, 그 상들은 죽지도 않고 드러나지도 않는데[c], 여러분은 얼마나 감당하겠습니까?”
  rationale: 미래형을 원문의 일반적·습관적 진술로 바로잡고, 두 핵심 명사의 어휘적 대조를 자연스러운 한국어로 유지했습니다. ‘상들’의 성격을 선재적 또는 신적 존재라고 단정하는 해석은 제거했습니다. 모든 각주는 설명 대상 어구에 직접 연결했고, 영어 POB 감사 기록에 있는 방언형 정보를 정확히 반영했습니다.
