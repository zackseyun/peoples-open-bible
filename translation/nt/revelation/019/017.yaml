  from: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
  to: Then I saw an angel standing in the sun. He cried out in a loud voice to all the birds flying high overhead, “Come, gather for the great supper of God[a],
  rationale: I retain the striking image of the angel standing in the sun and the 'supper' wording that contrasts with the Lamb’s wedding supper. The earlier preference for 'midheaven' preserved a Greek expression but left its ordinary spatial meaning unclear; the main text now carries that meaning.
