lexical_decisions:
- source_word: propter quod
  english_pob_choice: because
  chosen_korean: 그러므로
  alternatives_korean:
  - 그 까닭에
  - 왜냐하면
  lexicon: '-'
  rationale: 라틴어 propter quod의 인과 관계를 한국어 문장 흐름에 자연스럽게 옮겨, 앞뒤 절을 연결하는 결과적 표현으로 처리했습니다.
- source_word: superposuit iniquitas omnem terram
  english_pob_choice: iniquity has spread over the whole earth
  chosen_korean: 불의가 온 땅 위에 퍼졌고
  alternatives_korean:
  - 불의가 온 땅을 덮었고
  - 죄악이 온 땅에 퍼졌고
  lexicon: '-'
  rationale: iniquitas는 단순한 개인적 잘못보다 व्यापक한 도덕적 타락을 가리키므로 ‘불의’로 옮겼고, superposuit는 ‘퍼졌다/덮었다’의 이미지가 가능해 ‘퍼졌고’로 간결하게 살렸습니다.
- source_word: operationes eorum
  english_pob_choice: their deeds have been filled up
  chosen_korean: 그들의 행위도 가득 찼습니다
  alternatives_korean:
  - 그들의 행실도 다 차 올랐습니다
  - 그들의 일들도 채워졌습니다
  lexicon: '-'
  rationale: operationes eorum은 본문 제공 라틴어의 직역상 ‘그들의 행위/일들’이므로, POB 개정에서 배제된 ‘harmful’는 넣지 않고 ‘행위’로 유지했습니다.
theological_decisions:
- issue: iniquitas의 범위와 도덕적 강도
  chosen_reading: ‘불의’로 번역해 죄책의 추상적 개념보다 하나님 앞에서의 뒤틀린 상태와 행위의 총체성을 드러냈습니다.
  alternative_readings:
  - 죄악
  - 불법
  rationale: 본문은 개인적 실수보다 세상을 덮는 구조적·도덕적 타락을 말하므로, 문맥상 ‘불의’가 가장 직접적으로 원문의 강도를 반영합니다.
  doctrine_reference: 죄와 타락의 보편성
