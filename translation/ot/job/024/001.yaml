id: JOB.24.1
reference: Job 24:1
source:
  edition: WLC
  text: מַדּ֗וּעַ מִ֭/שַּׁדַּי לֹא נִצְפְּנ֣וּ עִתִּ֑ים ו/ידע/ו לֹא חָ֥זוּ יָמָֽי/ו־־׃
translation:
  text: Why does the Almighty not appoint times for judgment[a]? Why do those who know him not see the days when he acts?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, “Why, since times are not hidden from the Almighty, do those who know him not see the days when he acts?”
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  chosen: Why
  alternatives:
  - Why is it that
  - For what reason
  lexicon: HALOT
  rationale: Interrogative adverb introducing Job's complaint. Simple 'Why' is natural English and preserves the force of the question.
- source_word: מִשַּׁדַּי
  chosen: by the Almighty
  alternatives:
  - from the Almighty
  - with the Almighty
  lexicon: HALOT
  rationale: With the passive verb נִצְפְּנוּ, the prefixed מ can be understood in relation to the agent/source. 'By the Almighty' best conveys the sense that the hiding of appointed times would be under God's control. 'The Almighty' is the standard rendering of שַׁדַּי in Job.
- source_word: נִצְפְּנוּ
  chosen: are reserved
  alternatives:
  - are hidden
  - have been stored up
  - are reserved
  lexicon: HALOT
  rationale: The passive verb can denote being stored up or held in reserve; “reserved” is natural English in this context without adding concealment.
- source_word: עִתִּים
  chosen: times
  alternatives:
  - appointed times
  - seasons
  lexicon: HALOT
  rationale: עִתִּים commonly denotes times or appointed times. 'Times' is concise and leaves the phrase slightly open, matching the Hebrew's terseness; the nuance of appointed occasions is implicit in context.
- source_word: וְיֹדְעָיו
  chosen: those who know him
  alternatives:
  - his knowers
  - those who know the Almighty
  lexicon: HALOT
  rationale: The Qal participle with 3ms suffix refers to people who know God. 'Those who know him' is idiomatic English and preserves the relational sense.
- source_word: חָזוּ
  chosen: see
  alternatives:
  - behold
  - perceive
  lexicon: HALOT
  rationale: חזָה often means 'see' or 'behold,' sometimes with visionary nuance. Here plain 'see' fits the complaint about not perceiving God's days of judgment/action.
- source_word: יָמָיו
  chosen: his days
  alternatives:
  - his day
  - the days belonging to him
  - his appointed days
  lexicon: HALOT
  rationale: The plural with suffix is best rendered literally as 'his days.' In context this likely refers to God's days of judgment or intervention. Retaining the literal phrase preserves the poetic ambiguity rather than over-interpreting it.
