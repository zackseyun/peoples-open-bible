  from: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
  to: Herodias's daughter[a] came in and danced, pleasing Herod and his dinner guests. The king said to the girl, “Ask me for whatever you want, and I will give it to you.”
  rationale: I retain the recorded identification of the girl as Herodias's daughter, the textual alternative, and Mark's designation of Herod as king. The earlier preference for describing reclining posture gives way to the banquet relationship the expression communicates.
