  text: אֲנִ֤י יָדַ֨עְתִּי֙ נְאֻם יְהוָ֔ה עֶבְרָת֖/וֹ וְ/לֹא כֵ֑ן בַּדָּ֖י/ו לֹא כֵ֥ן עָשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/030.yaml
  text: I know his wrath[a], declares Yahweh, and it is not so; his boasts have accomplished nothing.
  footnotes:
  - marker: a
    text: Or, 'his lies are false; they have not done so,' or 'his empty talk has accomplished nothing.' The Hebrew of the final clause is difficult and compressed.
    reason: alternative_reading
translation:
  language: ko
  text: 나는 그의 분노를 알고 있습니다. 야훼의 말씀입니다. 그러나 그것은 그렇지 않습니다. 그의 헛된 말은 아무것도 이루지 못했습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 절은 난해하고 매우 압축적입니다. ‘그의 거짓말은 거짓되며, 그들은 그렇게 하지 않았다’ 또는 ‘그의 헛된 말은 아무것도 이루지 못했다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_korean: 나는 … 알고 있습니다
  alternatives_korean:
  - 나는 … 압니다
  - 나는 … 잘 알고 있습니다
  lexicon: HALOT
  rationale: 예언적 선언의 현재 확신을 살리기 위해 완료형을 한국어 현재형으로 옮겼습니다.
- source_word: עֶבְרָתוֹ
  english_pob_choice: his wrath
  chosen_korean: 그의 분노
  alternatives_korean:
  - 그의 진노
  - 그의 격노
  lexicon: HALOT
  rationale: עֶבְרָה의 기본 의미인 분노/진노를 반영하되, 한국어에서 자연스러운 표준어인 ‘분노’를 택했습니다.
- source_word: בַּדָּיו
  english_pob_choice: his boasts
  chosen_korean: 그의 헛된 말
  alternatives_korean:
  - 그의 허풍
  - 그의 거짓말
  - 그의 자랑
  lexicon: HALOT
  rationale: 문맥상 모압의 교만한 자기 주장과 공허함을 함께 드러내기 위해 ‘헛된 말’로 옮겼습니다.
- source_word: לֹא כֵן עָשׂוּ
  english_pob_choice: have accomplished nothing
  chosen_korean: 아무것도 이루지 못했습니다
  alternatives_korean:
  - 그렇게 되지 않았습니다
  - 그들은 그렇게 하지 않았습니다
  lexicon: HALOT
  rationale: 히브리어가 압축적이므로, 공허한 말이 실제 성취로 이어지지 않았다는 뜻을 한국어로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 예언 공식 נְאֻם יְהוָה의 한국어 처리
  chosen_reading: ‘야훼의 말씀입니다’로 옮겼습니다.
  alternative_readings:
  - ‘여호와의 말씀입니다’
  - ‘야훼께서 말씀하십니다’
  rationale: 이 프로젝트의 Tetragrammaton 기본값인 ‘야훼’를 따르면서, 예언 구문의 권위와 종결감을 현대 한국어로 분명히 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
