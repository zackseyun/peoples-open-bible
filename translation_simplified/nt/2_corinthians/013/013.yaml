translation:
  language: en
  text: May the grace of the Lord Jesus Messiah,[a] the love of God, and the fellowship of the Holy Spirit[b] be with every one of you.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
    reason: alternative_reading
  - marker: b
    text: This may also be translated “communion of the Holy Spirit” or “participation in the Holy Spirit.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The grace ... be with all of you
  simplified_phrase: May the grace ... be with every one of you
  preserved_meaning: The sentence remains a blessing explicitly intended for everyone addressed.
  reasoning_layer_used: Lexical decision for μετὰ πάντων ὑμῶν
  rationale: Adding “May” makes the blessing natural in modern English without changing its force.
- pob_phrase: Jesus Christ
  simplified_phrase: Jesus Messiah
  preserved_meaning: Christ is presented as Jesus’ title, meaning Messiah.
  reasoning_layer_used: Lexical and theological decisions for Ἰησοῦ Χριστοῦ
  rationale: “Messiah” follows the source-driven decision to translate the title rather than treat Christ as a surname.
- pob_phrase: fellowship of the Holy Spirit
  simplified_phrase: fellowship of the Holy Spirit
  preserved_meaning: The wording keeps both relational fellowship and shared participation without choosing only one sense.
  reasoning_layer_used: Lexical and theological decisions for κοινωνία
  rationale: The key term is retained because a simpler substitute would narrow the documented ambiguity.
translation_notes:
  risk_flags:
  - risk: Modern readers may understand “fellowship” only as social companionship.
    mitigation: The footnote preserves the broader senses of communion and participation.
