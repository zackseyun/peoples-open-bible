translation:
  text: And the earth shall be cleansed from all corruption, from all sin, from all
    punishment, and from all affliction; and it shall never again happen that I send
    such things[a] upon it, from generation to generation and forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez does not state an object for “send”; “such things” refers back
      to the preceding list.
    reason: alternative_reading
lexical_decisions:
- source_word: ወትነጽሕ
  chosen: and shall be cleansed
  alternatives:
  - and shall be pure
  lexicon: Dillmann, Lexicon linguae Aethiopicae
  rationale: The earth is the feminine subject; the rendering preserves the image
    of its purification.
- source_word: ሙስና
  chosen: corruption
  alternatives:
  - defilement
  lexicon: Dillmann, Lexicon linguae Aethiopicae
  rationale: Retains the broad sense of a spoiled or corrupted earth without reducing
    it to one kind of wrongdoing.
- source_word: መቅሠፍት
  chosen: punishment
  alternatives:
  - scourge
  - plague
  lexicon: Dillmann, Lexicon linguae Aethiopicae
  rationale: Conveys the term’s punitive force while leaving its precise form unspecified.
- source_word: ጻዕር
  chosen: affliction
  alternatives:
  - suffering
  - torment
  lexicon: Dillmann, Lexicon linguae Aethiopicae
  rationale: Preserves a distinct term for distress after the reference to punishment.
- source_word: ወኢይደግም፡ ከመ፡ እፈኑ
  chosen: and it shall never again happen that I send
  alternatives:
  - and I shall not again send
  lexicon: Dillmann, Lexicon linguae Aethiopicae
  rationale: Keeps the Ge'ez construction of nonrecurrence and its first-person speaker
    rather than silently recasting it as a general promise.
- source_word: ለትውልደ፡ ትውልድ፡ ወእስከ፡ ለዓለም
  chosen: from generation to generation and forever
  alternatives:
  - throughout the generations and forever
  lexicon: Dillmann, Lexicon linguae Aethiopicae
  rationale: Preserves the repeated generation formula and the additional expression
    of perpetuity.
theological_decisions:
- issue: Scope of the promise not to send affliction again
  chosen_reading: The first-person promise is retained without identifying the speaker
    by name or narrowing its scope to a particular later biblical event.
  alternative_readings:
  - A promise specifically about another flood
  rationale: Neither a divine name nor a flood appears in this verse; those interpretations
    should not be inserted into its wording.
