id: LUK.23.17
reference: Luke 23:17
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἀνάγκην δὲ εἶχεν ἀπολύειν αὐτοῖς κατὰ ἑορτὴν ἕνα.
  language: Greek
translation:
  text: Pilate was obliged to release one prisoner to them at the festival[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Several early Greek manuscripts omit this verse; it appears in other early witnesses and in most later Greek manuscripts.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνάγκη
  chosen: obligation
  alternatives:
  - necessity
  - duty
  - compulsion
  lexicon: BDAG
  rationale: 'The phrase ''ἀνάγκην ἔχειν'' is an idiom meaning ''to be under necessity'' or ''to be obligated.'' Translating it as ''had an obligation'' captures the legal or customary pressure Pilate faced better than the overly literal ''had a necessity.'' Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: ἀπολύω
  chosen: release
  alternatives:
  - set free
  - let go
  - pardon
  lexicon: BDAG
  rationale: In legal and penal contexts, this verb specifically denotes releasing a prisoner from custody or acquitting them.
- source_word: ἑορτή
  chosen: festival
  alternatives:
  - feast
  - holiday
  lexicon: BDAG
  rationale: While 'feast' is traditional, 'festival' better conveys the multi-day public and religious celebration of Passover to modern readers.
