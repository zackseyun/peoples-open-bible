  verdict: revise
  source_fidelity: 수정이 필요합니다. 첫머리의 ‘이제’는 아람어 본문에 명시된 시간 부사가 아니며, ‘사람을 보내어’는 שְׁלַחְנָא(‘우리가 보냈습니다’)에 없는 목적어를 보충합니다. 특히 본문은 무엇을 보냈는지 밝히지 않으므로 한국어에서도 이를 특정하지 않는 것이 안전합니다. ‘궁궐의 소금을 먹다’, ‘왕의 수치’, ‘보다’, ‘보내고 알리다’의 핵심 의미는 유지할 수 있습니다.
  naturalness: 합쇼체와 문어적 서신 문맥에 맞게 ‘마땅하지 않으므로’와 ‘이에’가 자연스럽습니다. ‘왕께 보내어 알렸습니다’는 보내진 대상의 생략을 유지하면서도 한국어 문장으로 가능합니다.
  terminology: ‘궁궐의 소금을 먹다’는 궁정의 부양·보수를 받는다는 관용을 보존합니다. עַרְוַת מַלְכָּא는 본문상 왕의 ‘수치/불명예’를 뜻하되 문자적 ‘벌거벗음’의 배경도 각주에서 밝혀 두는 것이 적절합니다.
  issues:
