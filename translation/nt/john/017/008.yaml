  doctrine_reference: Affirmations; Preserve theological tension rather than resolve it
- issue: Rendering πιστεύω in a ὅτι-clause
  chosen_reading: believed that
  alternative_readings:
  - trusted that
  rationale: Because the object is a proposition ('that you sent me'), the translation uses 'believed that' rather than a more relational rendering that could blur the syntax.
