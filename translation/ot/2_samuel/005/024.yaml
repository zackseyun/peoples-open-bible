  from: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
  to: When you hear the sound of marching in the tops of the balsam trees, then act decisively, for then Yahweh will have gone out ahead of you to strike down the Philistine army.”
  rationale: I preserve the earlier decisions to retain the mysterious marching sound and the command to act decisively, without explaining the sound as wind or identifying unseen marchers. The tree-identification note in verse 23 also covers this occurrence.
