  to: 다음 날 그는 예수께서 자기에게로 오시는 것을 보고 말합니다. 「보십시오. 세상의 죄를 없애시는 하나님의 어린양입니다。」
  rationale: 인용문의 문법 오류를 바로잡고, 원문의 Ἴδε가 지닌 주의 환기 기능을 현대 합쇼체 ‘보십시오’로 옮겼습니다. 이어지는 명사구는 한국어에서 자연스러운 지시적 선언문으로 구성했습니다. αἴρων의 의미는 ‘없애시는’으로 유지하여 ‘속죄하다’ 등 해석을 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
