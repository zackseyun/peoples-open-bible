  yaml_path: translation/ot/psalms/081/009.yaml
  text: You must have no foreign god among you, and you must not bow down to a god of a foreign land[a].
  footnotes:
  - marker: a
    text: 'The Hebrew uses two related expressions: “foreign god” and, more literally, “a god of a foreign land.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 가운데 다른 신이 있어서는 안 되며, 너희는 이방 신에게 절해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낯선 신’. 히브리어는 병행하여 ‘다른 신’과 ‘이방 신’이라는 두 유사한 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들으세요
  lexicon: HALOT
  rationale: 명령형의 직접적 호소를 살리면서 합쇼체로 옮겼습니다. 이어지는 ‘들으려면’과 같은 어근 반복도 자연스럽게 이어집니다.
- source_word: עַמִּי
  english_pob_choice: my people
  chosen_korean: 내 백성이여
  alternatives_korean:
  - 내 백성이여
  - 내 사람들아
  lexicon: HALOT
  rationale: 언약적 호칭을 보존하기 위해 ‘내 백성’으로 옮기고, 호격을 드러내는 ‘-이여’를 붙였습니다.
- source_word: וְאָעִידָה בָּךְ
  english_pob_choice: and I will testify against you
  chosen_korean: 내가 너희를 향하여 증언하겠습니다
  alternatives_korean:
  - 내가 너희를 향하여 증언하겠습니다
  - 내가 너희에게 증언하겠습니다
  lexicon: HALOT
  rationale: עוד의 법정적 의미를 살리되, 한국어에서는 ‘증언하다’와 함께 방향을 드러내는 표현으로 다소 긴장감을 유지했습니다. ‘against you’를 노골적으로 만들기보다 본문의 경고 성격을 반영했습니다.
- source_word: תִּשְׁמַע לִי
  english_pob_choice: if you would listen to me
  chosen_korean: 내 말을 들으려면 좋겠습니다
  alternatives_korean:
  - 내 말을 들으려면 좋겠습니다
  - 내게 귀를 기울인다면 좋겠습니다
  lexicon: HALOT
  rationale: אִם의 소원/탄원 뉘앙스를 한국어의 바람표현으로 옮겼습니다. 단순 조건문보다 시적이고 애원하는 어조를 드러냅니다.
theological_decisions:
- issue: אִם תִּשְׁמַע לִי의 기능
  chosen_reading: 조건문이라기보다 탄원 섞인 소원 표현으로 읽어 '내 말을 들으려면 좋겠습니다'로 옮겼습니다.
  alternative_readings:
  - 그대로 '내게 들으면'으로 옮김
  - '''아, 내 말을 들었으면!''처럼 감탄형으로 옮김'
  rationale: 시편의 시적 호소에서 אִם은 단순 조건을 넘어 소원·탄원으로 기능할 수 있습니다. 한국어에서도 그 긴장을 살려, 명령과 경고 사이의 간절한 호소를 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
