    prior_rendering: He came in to me to lie with me
    new_rendering: He came to me to sleep with me
    rationale: The first phrase describes his alleged approach, while the second is an idiom for sexual intercourse; the new wording makes that distinction clear in contemporary English.
  - source_phrase: וָאֶקְרָא בְּקוֹל גָּדוֹל
    prior_rendering: and I cried out with a loud voice
    new_rendering: but I cried out loudly
    rationale: Her claimed cry opposes his alleged intention; 'but' expresses that contextual relationship, and 'loudly' naturally conveys the Hebrew expression.
