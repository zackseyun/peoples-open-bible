id: PSA.89.39
reference: Psalms 89:39
source:
  edition: WLC
  text: נֵ֭אַרְתָּה בְּרִ֣ית עַבְדֶּ֑/ךָ חִלַּ֖לְתָּ לָ/אָ֣רֶץ נִזְרֽ/וֹ׃
translation:
  text: You have repudiated the covenant with your servant; you have defiled his crown[a] by casting it to the ground.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew word for “crown” also carries an association with consecration.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵאַרְתָּה
  chosen: have repudiated
  alternatives:
  - have rejected
  - have spurned
  - have abhorred
  lexicon: HALOT
  rationale: Conveys active covenantal rejection in natural English.
- source_word: בְּרִית
  chosen: covenant
  alternatives:
  - treaty
  - agreement
  lexicon: HALOT
  rationale: Standard rendering for בְּרִית, especially in theological and royal-Davidic contexts. 'Covenant' preserves the formal and theological weight of the term.
- source_word: עַבְדֶּךָ
  chosen: your servant
  alternatives:
  - your slave
  lexicon: HALOT
  rationale: Although עבד can denote slave/servant, in reference to the Davidic king as God's subordinate royal agent, 'servant' is the most natural and established contextual rendering without losing the relational sense.
- source_word: חִלַּלְתָּ
  chosen: have defiled
  alternatives:
  - have profaned
  - have dishonored
  lexicon: HALOT
  rationale: חלל in the Piel commonly means to profane or defile what is holy or honored. 'Defiled' works well with 'crown' in English while preserving the desecration sense. 'Profaned' is possible but slightly less idiomatic with a physical object like a crown in modern English.
- source_word: לָאָרֶץ
  chosen: to the ground
  alternatives:
  - to the earth
  lexicon: HALOT
  rationale: Literally 'to the earth,' but 'to the ground' is the more natural English idiom for casting down or bringing low, while preserving the image of humiliation.
- source_word: נִזְרוֹ
  chosen: his crown
  alternatives:
  - his consecration
  - his diadem
  lexicon: HALOT
  rationale: נזר can denote crown/diadem and is associated with consecration. In this royal psalm, 'crown' is the clearest contextual rendering. The consecration nuance remains in the background, which also explains the appropriateness of 'defiled/profaned' as the verb.
- source_word: בְּרִית עַבְדֶּךָ
  chosen: the covenant with your servant
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Clarifies the covenantal relationship in context without changing the referent.
- source_word: חִלַּלְתָּ לָאָרֶץ נִזְרוֹ
  chosen: have defiled his crown on the ground
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Retains both desecration and the groundward humiliation while avoiding an unidiomatic directional phrase and unexpressed “dust.”
