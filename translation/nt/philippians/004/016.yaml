  meaning: Their partnership had already taken practical form through repeated support for Paul's needs while he was in Thessalonica.
  meaning_decisions:
  - source_phrase: ὅτι καὶ ἐν Θεσσαλονίκῃ
    prior_rendering: because even in Thessalonica
    new_rendering: For even when I was in Thessalonica
    rationale: The verse explains the preceding claim by recalling an earlier occasion. Making Paul the explicit subject of the location prevents readers from locating the Philippians there.
  - source_phrase: εἰς τὴν χρείαν μοι ἐπέμψατε
    prior_rendering: you sent for my need
    new_rendering: you sent support to meet my needs
    rationale: The implied object is material support, and the phrase states its purpose. Natural English requires that implication rather than the unclear 'sent for my need.'
  - source_phrase: καὶ ἅπαξ καὶ δὶς
    prior_rendering: both once and twice
    new_rendering: more than once
    rationale: The expression emphasizes repeated assistance; it does not naturally communicate that meaning when reproduced word for word in English.
