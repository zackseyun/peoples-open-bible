    rationale: The clearer Greek reading identifies the people as the senders and the messengers as those who will bring the authorization; it also fits the expected report in verse 15.
  - source_phrase: τὴν ἄφεσιν παρὰ τῆς γερουσίας
    prior_rendering: the release from the council of elders
    new_rendering: permission from the council of elders
    rationale: In this context the council’s authorization is being sought before the people consume the sacred provisions; neither an unspecified release nor amnesty already granted conveys that sequence.
  - source_phrase: ὅτι καὶ ἐκεῖ κατοικοῦντες ἐποίησαν ταῦτα
    prior_rendering: that those living there also had done these things
    new_rendering: since the people living there have also done these things
    rationale: The clause gives the reason for seeking authorization in Jerusalem, rather than the content of a message sent there.
