  from: so that a godless man should not reign[a], nor be snares to the people.
  to: lest a godless man reign, because of the snares of the people.[a]
  rationale: 'The current text is ungrammatical: the singular “a godless man” cannot naturally govern “be snares,” and the Hebrew has no conjunction corresponding to “nor.” The prior rendering “lest the people be ensnared” reverses the expressed relation in מִמֹּקְשֵׁי עָם, whose straightforward form is “because of/from the snares of a people.” The revision follows the compressed Hebrew closely while the note preserves the plausible preventive reading.'
