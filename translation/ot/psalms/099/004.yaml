id: PSA.99.4
reference: Psalms 99:4
source:
  edition: WLC
  text: וְ/עֹ֥ז מֶלֶךְ֮ מִשְׁפָּ֪ט אָ֫הֵ֥ב אַ֭תָּה כּוֹנַ֣נְתָּ מֵישָׁרִ֑ים מִשְׁפָּ֥ט וּ֝/צְדָקָ֗ה בְּ/יַעֲקֹ֤ב אַתָּ֬ה עָשִֽׂיתָ׀׃
translation:
  text: The mighty King loves justice; you have established equity; you have done justice and righteousness among Jacob's people.
  philosophy: dynamic
lexical_decisions:
- source_word: וְ/עֹז
  chosen: the strength
  alternatives:
  - strength
  - might
  - strong one
  lexicon: HALOT
  rationale: עֹז commonly denotes strength or might. Here it stands at the head of a verbless-like clause linked with 'king' and the following verb 'loves.' Retaining 'strength' preserves the Hebrew wording, even though the syntax is compressed and somewhat difficult.
- source_word: מֶלֶךְ
  chosen: the King
  alternatives:
  - king
  lexicon: HALOT
  rationale: Rendered with capitalization because in context the psalm addresses God directly and speaks of his royal rule. Capitalization signals reverential reference in English without changing lexical meaning.
- source_word: מִשְׁפָּט
  chosen: justice
  alternatives:
  - judgment
  - justice
  lexicon: HALOT
  rationale: In this psalmic context מִשְׁפָּט refers to just rule and right judicial order rather than merely a legal verdict, so 'justice' is the most natural English rendering.
- source_word: אָהֵב
  chosen: loves
  alternatives:
  - loves
  - has loved
  lexicon: HALOT
  rationale: 'The qatal form here expresses a present characteristic in poetic discourse: the king loves justice. English present tense best conveys the gnomic sense.'
- source_word: אַתָּה
  chosen: you
  lexicon: HALOT
  rationale: Second-person pronoun retained explicitly because the Hebrew includes it for emphasis in direct address to God.
- source_word: כּוֹנַנְתָּ
  chosen: have established
  alternatives:
  - established
  - founded
  - made firm
  lexicon: HALOT
  rationale: כון in the polel/related stem often means to establish or make firm. 'Have established' fits the completed action with continuing result.
- source_word: מֵישָׁרִים
  chosen: equity
  alternatives:
  - equity
  - uprightness
  - straightness
  lexicon: HALOT
  rationale: The word denotes upright or equitable order; “equity” best fits the surrounding justice language.
- source_word: מִשְׁפָּט
  chosen: justice
  alternatives:
  - judgment
  lexicon: HALOT
  rationale: Repeated term kept consistently as 'justice' to reflect the psalm's emphasis on God's just governance.
- source_word: וּ/צְדָקָה
  chosen: and righteousness
  alternatives:
  - and righteousness
  - and justice
  lexicon: HALOT
  rationale: צְדָקָה commonly means righteousness, though in some contexts it overlaps with justice. Here preserving the pair 'justice and righteousness' reflects the Hebrew collocation and keeps both concepts distinct.
- source_word: בְּ/יַעֲקֹב
  chosen: in Jacob
  alternatives:
  - in Jacob
  - among Jacob
  - in Israel
  lexicon: HALOT
  rationale: The preposition is best rendered 'in,' and 'Jacob' is retained rather than interpreted as 'Israel' to preserve the poetic covenant name used in the Hebrew.
- source_word: עָשִׂיתָ
  chosen: have done
  alternatives:
  - have done
  - have worked
  - have accomplished
  lexicon: HALOT
  rationale: This preserves the breadth of עשׂה with the paired objects “justice and righteousness.”
- source_word: וְעֹז מֶלֶךְ
  chosen: The mighty King
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The compressed construct expression characterizes the king by strength; this avoids falsely presenting abstract “strength” as an agent in English.
