id: JOB.33.25
reference: Job 33:25
source:
  edition: WLC
  text: רֻֽטֲפַ֣שׁ בְּשָׂר֣/וֹ מִ/נֹּ֑עַר יָ֝שׁ֗וּב לִ/ימֵ֥י עֲלוּמָֽי/ו׃
translation:
  text: His flesh becomes fresher than a child’s[a]; he returns to the days of his youth.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “his flesh becomes fresh like a child’s.”
    reason: alternative_reading
lexical_decisions:
- source_word: רֻטֲפַשׁ
  chosen: becomes fresher
  alternatives:
  - is made fresh
  - grows youthful
  - is restored
  lexicon: HALOT
  rationale: The rare verb conveys becoming fresh or luxuriant again. 'Becomes fresher' preserves the concrete bodily sense and fits the restoration context better than a more interpretive 'is restored.'
- source_word: בְּשָׂרוֹ
  chosen: his flesh
  alternatives:
  - his body
  lexicon: HALOT
  rationale: '''Flesh'' is the direct lexical equivalent and keeps the physical, embodied emphasis of the Hebrew. ''Body'' is possible but slightly less literal.'
- source_word: מִנֹּעַר
  chosen: than a child’s
  alternatives:
  - from youth
  - more than a youth's
  lexicon: HALOT
  rationale: Preserves the comparative construction and does not supply an unsupported possessive referring to the restored man.
- source_word: יָשׁוּב
  chosen: he returns
  alternatives:
  - it returns
  - he is restored
  lexicon: HALOT
  rationale: The masculine singular verb most naturally refers back to the person rather than to 'flesh' alone, so 'he returns' best captures the subject continuity in the surrounding context.
- source_word: לִימֵי
  chosen: to the days of
  alternatives:
  - to the time of
  lexicon: HALOT
  rationale: A straightforward rendering of the construct phrase that preserves the idiom without unnecessary paraphrase.
- source_word: עֲלוּמָיו
  chosen: his youth
  alternatives:
  - his youth
  - his young manhood
  lexicon: HALOT
  rationale: Directly renders the noun without importing “vigor” into the text.
