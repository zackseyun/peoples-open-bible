    prior_rendering: who are about to be killed just as they were
    new_rendering: those who were to be killed just as they had been
    rationale: The construction identifies believers whose deaths still lie ahead in the vision. 'Were to be killed' preserves that prospect without suggesting a more precisely immediate timetable than the passage establishes.
