id: JOB.4.16
reference: Job 4:16
source:
  edition: WLC
  text: יַעֲמֹ֤ד וְֽ/לֹא אַכִּ֬יר מַרְאֵ֗/הוּ תְּ֭מוּנָה לְ/נֶ֣גֶד עֵינָ֑/י דְּמָמָ֖ה וָ/ק֣וֹל אֶשְׁמָֽע׀־׃
translation:
  text: 'It stood still, but I could not make out its appearance; a form was before my eyes; there was silence, and I heard a voice[a]:'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “I heard a hushed voice.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲמֹד
  chosen: stood still
  alternatives:
  - stood
  - stopped
  lexicon: HALOT
  rationale: The verb עמד means 'stand' or 'remain standing.' In this visionary context, 'stood still' brings out the sense that the figure halted and remained before the speaker, fitting the sequence of perception.
- source_word: וְלֹא אַכִּיר
  chosen: but I could not recognize
  alternatives:
  - and I did not recognize
  - but I did not discern
  lexicon: HALOT
  rationale: נכר in Hiphil commonly means 'recognize' or 'identify.' The conjunction is rendered adversatively ('but') because the sense contrasts the figure's presence with the speaker's inability to identify it. 'Could not recognize' expresses the practical force in idiomatic English.
- source_word: מַרְאֵהוּ
  chosen: its appearance
  alternatives:
  - his appearance
  - its form
  - what it looked like
  lexicon: HALOT
  rationale: מַרְאֶה refers to appearance or visible form. Because the referent is an unidentified apparition rather than a clearly personal male figure, 'its appearance' avoids overpersonalizing the Hebrew suffix while preserving the ambiguity of the vision.
- source_word: תְּמוּנָה
  chosen: a form
  alternatives:
  - an image
  - a likeness
  - a shape
  lexicon: HALOT
  rationale: תמונה denotes a form, likeness, or visible shape. 'A form' is natural English and suits the indistinct visual impression described here.
- source_word: לְנֶגֶד עֵינַי
  chosen: was before my eyes
  alternatives:
  - was in front of my eyes
  - was before me
  lexicon: HALOT
  rationale: The phrase literally means 'before/in front of my eyes.' 'Was before my eyes' preserves the vividness and remains idiomatic.
- source_word: דְּמָמָה
  chosen: there was silence
  alternatives:
  - silence
  - stillness
  - a hush
  lexicon: HALOT
  rationale: דממה can denote silence, stillness, or hushed quiet. 'There was silence' gives a complete English clause and preserves the eerie pause before the voice.
- source_word: וָקוֹל אֶשְׁמָע
  chosen: and I heard a voice
  alternatives:
  - then I heard a voice
  - and a voice I heard
  - and I heard a sound
  lexicon: HALOT
  rationale: קוֹל can mean 'voice' or 'sound.' Because the next verse contains spoken words, 'voice' is the best contextual choice. The clause is rendered in natural English order.
