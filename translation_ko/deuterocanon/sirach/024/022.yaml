  text: Whoever obeys me will not be put to shame, and those who work with me will not sin.
translation:
  language: ko
  text: 내게 순종하는 자는 수치를 당하지 않을 것이며, 내 안에서 일하는 자들은 죄를 짓지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὑπακούων μου
  english_pob_choice: Whoever obeys me
  chosen_korean: 저를 따르는 자
  alternatives_korean:
  - 저에게 순종하는 자
  - 저에게 복종하는 자
  lexicon: ὑπακούω
  rationale: ὑπακούω는 단순한 명령 수행보다 ‘귀 기울여 따르다/순종하다’의 뜻이므로, 문맥상 자연스러운 현대 한국어로 풀어 옮겼습니다.
- source_word: οὐκ αἰσχυνθήσεται
  english_pob_choice: will not be put to shame
  chosen_korean: 수치를 당하지 않을 것이며
  alternatives_korean:
  - 부끄러움을 당하지 않을 것이며
  - 부끄럽게 되지 않을 것이며
  lexicon: αἰσχύνω
  rationale: 수동 미래형의 결과를 한국어에서 관용적으로 드러내기 위해 ‘수치를 당하다’를 택했습니다.
- source_word: οἱ ἐργαζόμενοι ἐν ἐμοὶ
  english_pob_choice: those who work with me
  chosen_korean: 나와 함께 일하는 자들
  alternatives_korean:
  - 내 안에서 일하는 자들
  - 나 안에서 일하는 자들
  lexicon: ἐργάζομαι
  rationale: 영어 POB의 ‘with me’를 따라 ‘함께 일하다’로 옮기되, ἐν ἐμοὶ의 결합감을 살려 협력 관계를 자연스럽게 표현했습니다.
- source_word: οὐχ ἁμαρτήσουσιν
  english_pob_choice: will not sin
  chosen_korean: 죄를 짓지 않을 것입니다
  alternatives_korean:
  - 죄를 범하지 않을 것입니다
  - 죄를 짓지 않게 될 것입니다
  lexicon: ἁμαρτάνω
  rationale: ἁμαρτάνω의 기본 의미를 표준적인 한국어 성경어인 ‘죄를 짓다’로 옮겼습니다.
theological_decisions:
- issue: ‘in me’와 ‘with me’의 관계
  chosen_reading: 본문의 ἐν ἐμοὶ를 영어 POB의 최종본처럼 ‘나와 함께’로 이해했습니다.
  alternative_readings:
  - ‘내 안에서’
  - ‘나 안에서’
  rationale: 개정 기록이 ‘with me’를 확정한 점을 반영하여, 그리스어의 결합 표현을 협력/동행 관계로 읽는 번역을 택했습니다.
  doctrine_reference: 지혜문학의 의인화된 지혜 화자 구조
