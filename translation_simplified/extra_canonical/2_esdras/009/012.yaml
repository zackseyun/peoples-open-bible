base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/2_esdras/009/012.yaml
  text: and while a place of repentance was still open to them[a], they did not understand but scorned it; these must know it after death in torment.
  footnotes:
  - marker: a
    text: Or 'and while a place of repentance was still open to them did not understand but scorned it—for these it is necessary to know after death in torment.'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T19:48:03Z'
    unchanged: false
    changes_summary: Replaced the em dash with a semicolon for a more formal, natural connection between clauses while preserving the draft wording and meaning.
translation:
  language: en
  text: While the way was still open for them to reorient[a], they did not understand and instead treated it with contempt. After death, they must come to understand it while in torment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: but scorned it
  simplified_phrase: and instead treated it with contempt
  preserved_meaning: They responded to the open opportunity with scorn rather than understanding.
  reasoning_layer_used: POB text and Latin source
  rationale: This states the force of “scorned” in familiar language without weakening it.
- pob_phrase: these must know it after death in torment
  simplified_phrase: After death, they must come to understand it while in torment
  preserved_meaning: The same people will be compelled to recognize after death what they rejected before death.
  reasoning_layer_used: applied grammar revision
  rationale: The revision preserves “they” as the subject and keeps the implied object deliberately unspecified.
translation_notes:
  risk_flags:
  - risk: The object of “understand it” is implicit in the Latin and remains somewhat ambiguous.
    mitigation: The pronoun is retained rather than identifying its referent more narrowly than the POB does.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
