- field: lexical_decisions
  value:
  - source_word: ነፍሳት
    chosen: souls
    alternatives:
    - spirits
    - lives
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: In this context the term refers to the disembodied life-principle of the offspring
      after leaving the body. 'Souls' best preserves the anthropological distinction in the
      verse, while the final clause separately names them 'evil spirits.'
  - source_word: እኩያን
    chosen: the wicked
    alternatives:
    - evil ones
    - impious ones
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: Used substantivally with ነፍሳት, it describes the morally corrupt beings under
      discussion. 'The wicked' is idiomatic and preserves the ethical force.
  - source_word: ወጽኡ እምሥጋሆሙ
    chosen: came out from their flesh
    alternatives:
    - went forth from their bodies
    - departed from their flesh
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: A fairly direct rendering that preserves the concrete bodily imagery. 'Flesh'
      is retained rather than generalized to 'body' because the Ge'ez explicitly uses flesh-language.
  - source_word: እስመ
    chosen: because
    alternatives:
    - for
    - since
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: Introduces the explanatory ground for why these souls have the status described.
  - source_word: እመልዕልት
    chosen: from above
    alternatives:
    - from on high
    - from the upper realm
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: The phrase points to heavenly or supernal origin. 'From above' is concise and
      preserves the vertical cosmological imagery without over-specifying.
  - source_word: ተፈጥሩ
    chosen: they were created
    alternatives:
    - they were made
    - they were formed
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: Keeps the passive sense and the creaturely status of these beings. 'Created'
      better matches the theological weight of origin language here.
  - source_word: እምቅዱሳን ትጉሃን
    chosen: from the holy Watchers
    alternatives:
    - from the holy ones, the watchers
    - from the vigilant holy ones
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: The collocation likely identifies the angelic Watchers, not merely generic holy
      ones. Rendering the phrase as 'holy Watchers' preserves the technical Enochic designation
      and the immediate narrative context.
  - source_word: ቀዳሚቶሙ
    chosen: their beginning
    alternatives:
    - their first origin
    - their fore-part
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: Conveys source or initial origin. 'Beginning' is natural English and pairs well
      with the following foundation language.
  - source_word: ወቀዳሚ መሰረት
    chosen: and first foundation
    alternatives:
    - and primal foundation
    - and original basis
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: The repetition intensifies the statement of origin. 'First foundation' preserves
      the somewhat weighty, apocalyptic diction rather than smoothing it away.
  - source_word: መንፈሰ እኩየ
    chosen: evil spirits
    alternatives:
    - wicked spirits
    - spirits of evil
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: This is the climactic designation of the giants' postmortem state. Plural English
      is required by the subject, though the Ge'ez form as transmitted may appear singular or
      collective in OCR.
  certifies_this_candidate: false
- field: theological_decisions
  value:
  - issue: Identity of the beings described after death
    chosen_reading: The verse speaks of the disembodied offspring of the Watchers and women,
      whose souls become 'evil spirits.'
    alternative_readings:
    - The verse refers more generally to wicked human souls
    - The final phrase is only descriptive, not a naming formula
    rationale: Within the immediate context of 1 Enoch 15, God explains the origin and fate
      of the giants born from the union of Watchers and women. The language of heavenly origin
      and derivation from the holy Watchers fits that specific group, not ordinary humanity.
    doctrine_reference: Preserve local passage meaning and do not harmonize away apocalyptic
      categories.
  - issue: Force of 'from above'
    chosen_reading: It indicates a supernal/heavenly component in their origin, not moral approval.
    alternative_readings:
    - It means simply 'formerly' or 'at first'
    - It implies full angelic status
    rationale: 'The context distinguishes their mixed origin: bodily from earthly mothers, but
      with derivation from heavenly Watchers. The phrase should preserve cosmological origin
      without collapsing the beings into proper angels.'
    doctrine_reference: Preserve theological tension rather than resolve it.
  certifies_this_candidate: false
