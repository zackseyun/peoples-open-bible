translation:
  text: From the days of the slaughter, destruction, and death of the giants,[a] the spirits
    that came forth from the souls of their flesh[b] shall destroy without judgment;[c] thus
    they shall destroy until the day of the completion of the great judgment, when the great
    age shall be brought to its end.[d] All concerning the Watchers and the ungodly shall be
    completed.[e][f]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The giants” identifies those whose slaughter, destruction, and death are described;
      it does not identify the Watchers as the slain.
    reason: textual_variant
  - marker: b
    text: This wording follows Charles’s critically edited Ethiopic text. His apparatus records
      emendations in the wording concerning the spirits and their destructive activity; it is
      not an unqualified transcription of a single manuscript.
    reason: textual_variant
  - marker: c
    text: Literally, “without judgment.” “Without incurring judgment” is an interpretive expansion.
      The phrase must not be understood as a promise that these spirits will never face judgment.
    reason: textual_variant
  - marker: d
    text: The great judgment and the ending of the great age belong to the preceding completion
      statement. The following bracketed words and final completion clause are additional printed
      material, not replacements for this statement.
    reason: textual_variant
  - marker: e
    text: The selected printed Ethiopic includes [እምትጉሃን፡ ወረሰዓነ፡], “of/from the Watchers and
      the ungodly,” bracketed across PDF82/84. Charles labels it an Ethiopic interpolation;
      the Greek parallels omit it. “Concerning” is a provisional contextual connection of this
      bracketed phrase to the final completion clause, not an independently certain syntactic
      reading. The earlier OCR lost the Watchers word; it did not establish a sinners reading.
    reason: textual_variant
  - marker: f
    text: The final completion clause must be retained separately. Charles critically marks
      “all”; his apparatus reports omission of this clause in m and β and cites the additional
      completion wording in the Greek witness Gˢ as support.
    reason: textual_variant
