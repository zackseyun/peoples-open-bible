  rationale: 함정을 ‘설치하다’는 뜻의 شکار/덫 이미지가 필요하므로, 자연스러운 현대 한국어로 ‘올가미를 놓고’라고 옮겨 매복·포획의 뉘앙스를 살렸습니다.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  english_pob_choice: those who seek my life
  chosen_korean: 나를 해치려는 자들
  alternatives_korean:
  - 내 생명을 찾는 자들
  - 내 목숨을 찾는 자들
  - 내 생명을 노리는 자들
  lexicon: HALOT
  rationale: 직역인 ‘내 생명을 찾는’은 한국어에서 다소 부자연스러워, 적대적 문맥의 관용적 의미인 ‘해치려는 자들’로 옮겨 생명에 대한 위협을 분명히 했습니다.
- source_word: דִּבְּרוּ הַוּוֹת
  english_pob_choice: speak destruction
  chosen_korean: 멸망을 말하며
  alternatives_korean:
  - 파멸을 말하며
  - 파괴를 말하며
  - 파멸적인 말을 하며
  lexicon: HALOT
  rationale: הוות의 파괴·멸망·재앙의 의미를 반영하되, 영어 POB의 절제된 표현을 따라 ‘멸망을 말하며’로 간결하게 처리했습니다.
- source_word: וּמִרְמֹת
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 배신
  - 속이는 말
  lexicon: HALOT
  rationale: מיתרמֹות는 기만적 말의 성격을 가리키므로, 한국어에서 가장 자연스럽고 포괄적인 ‘속임수’로 옮겼습니다.
- source_word: יֶהְגּוּ
  english_pob_choice: mutter
  chosen_korean: 중얼거립니다
  alternatives_korean:
  - 속삭입니다
  - 읊조립니다
  - 되뇌입니다
  lexicon: HALOT
  rationale: 이 동사는 ‘묵상하다’도 가능하지만 여기서는 적대적이고 반복적인 낮은 소리의 말을 가리키므로, 문맥에 맞는 ‘중얼거립니다’를 선택했습니다.
