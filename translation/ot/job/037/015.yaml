id: JOB.37.15
reference: Job 37:15
source:
  edition: WLC
  text: הֲ֭/תֵדַע בְּ/שׂוּם אֱל֣וֹהַּ עֲלֵי/הֶ֑ם וְ֝/הוֹפִ֗יעַ א֣וֹר עֲנָנֽ/וֹ־׃
translation:
  text: Do you know how God commands the clouds[a] and makes lightning flash from his cloud?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “when God sets them in place.” The Hebrew wording is compressed.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲתֵדַע
  chosen: Do you know
  alternatives:
  - Do you understand
  - Are you aware
  lexicon: HALOT
  rationale: ידע in the Qal imperfect 2ms introduces a rhetorical question to Job. 'Do you know' is the most direct and natural rendering in English.
- source_word: בְּשׂוּם
  chosen: how ... lays
  alternatives:
  - when ... sets
  - in placing
  lexicon: HALOT
  rationale: The preposition ב with the infinitive construct of שום can mark circumstance ('when/in the placing of'), but in English after 'Do you know' the idiomatic sense is 'how ... lays/sets.' 'Lays' fits the implied object of meteorological phenomena better than the more wooden 'sets.'
- source_word: אֱלוֹהַּ
  chosen: God
  alternatives:
  - God Almighty
  lexicon: HALOT
  rationale: אֱלוֹהַּ is the common singular poetic form for 'God' in Job. No contextual warrant exists here to expand it beyond the lexical sense.
- source_word: עֲלֵיהֶם
  chosen: upon them
  alternatives:
  - over them
  - on them
  lexicon: HALOT
  rationale: The preposition על with 3mp suffix most naturally means 'upon/on them.' The referent is implicit from context, likely the clouds or weather phenomena mentioned in the surrounding verses; the translation preserves that ambiguity rather than specifying it.
- source_word: וְהוֹפִיעַ
  chosen: makes the light of his cloud shine
  alternatives:
  - and causes ... to flash
  - and brings forth
  lexicon: HALOT
  rationale: Natural rendering of causing light to appear or shine.
- source_word: אוֹר
  chosen: the light
  alternatives:
  - light
  - brightness
  lexicon: HALOT
  rationale: אוֹר denotes light/brightness. With the following construct relation to 'his cloud,' 'the light' is a natural English rendering.
- source_word: עֲנָנוֹ
  chosen: his cloud
  alternatives:
  - his clouds
  - his storm cloud
  lexicon: HALOT
  rationale: The singular noun with 3ms suffix is best rendered literally as 'his cloud.' English can use the singular collectively or concretely here. 'Storm cloud' is interpretive and 'clouds' would abandon the singular form.
- source_word: בְּשׂוּם אֱלוֹהַּ עֲלֵיהֶם
  chosen: when God lays his charge upon them
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Reflects the infinitival temporal construction and the על phrase while supplying only the minimal implied object needed for English.
