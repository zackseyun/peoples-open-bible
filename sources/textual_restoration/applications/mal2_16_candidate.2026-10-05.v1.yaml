id: MAL.2.16
reference: Malachi 2:16
source:
  edition: WLC
  text: כִּֽי שָׂנֵ֣א שַׁלַּ֗ח אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כִסָּ֤ה חָמָס֙ עַל לְבוּשׁ֔/וֹ אָמַ֖ר
    יְהוָ֣ה צְבָא֑וֹת וְ/נִשְׁמַרְתֶּ֥ם בְּ/רוּחֲ/כֶ֖ם וְ/לֹ֥א תִבְגֹּֽדוּ־־׃ס
translation:
  text: If he hates and divorces her[a][c], says Yahweh, the God of Israel, he covers his garment with violence[d],
    says Yahweh of Armies. So guard yourselves in your spirit, and do not act faithlessly[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew construction is disputed. Alternatives include 'For he hates divorce' with God as the
      subject, the traditional 'I hate divorce' through a different grammatical analysis or pointing, and 'If
      he hates her, send her away.' The main text takes the opening conditionally and the sending-away form
      as functioning like a finite verb. 'Her' is supplied from the wife mentioned in verses 14–15.
    reason: alternative_reading
  - marker: b
    text: Or 'do not deal treacherously' / 'do not be unfaithful.' The Hebrew speaks of acting faithlessly
      in covenant relationship.
    reason: lexical_alternative
  - marker: c
    text: The published transcription of Dead Sea Scroll 4Q76 preserves an explicit 'if' and a different form
      of the hate verb. Other wording also differs; most of its garment word is supplied and the surviving
      ending is doubtful. This supports considering a conditional reading, not the exact wording or earliest
      priority of the main text. These are published readings, not newly deciphered letters.
    reason: textual_variant
  - marker: d
    text: Or 'violence covers his garment.' The main text takes the man as the subject of both hating and covering;
      another interpretation makes divorce the subject of covering. The garment image is retained without identifying
      it with the wife.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: If
  alternatives:
  - For
  - Because
  rationale: Provisionally construed conditionally, introducing the conduct whose consequence follows in וְכִסָּה.
    A causal explanation remains serious. The repeated warning does not alone decide the conjunction; conditional
    support in a distinct published 4Q76 form does not attest this exact MT analysis.
- source_word: שָׂנֵא
  chosen: he hates
  alternatives:
  - God hates
  - I hate
  rationale: The pointed form is construed as Qal perfect third masculine singular with the husband as subject;
    present English expresses the generic condition. Third person alone does not identify the subject. Divine
    indirect discourse and first-person participial analyses remain alternatives, not categorically consonantally
    impossible.
- source_word: שַׁלַּח
  chosen: and divorces her
  alternatives:
  - sending away
  - send her away
  rationale: 'Explicit source-interpretation choice: following Hugenberger''s grammatical proposal, construe
    this alternative-form Piel infinitive absolute as replacing a finite verb. The usual infinitive-construct
    analysis and an imperative remain serious alternatives. No vowels or consonants change. English ''and''
    coordinates the asyndetic predicates; ''her'' supplies their contextual wife object, absent from this verse''s
    words. This is not a participle.'
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  chosen: Yahweh, the God of Israel
  alternatives:
  - Yahweh, God of Israel
  rationale: Render the divine name as Yahweh under the current declared policy; retain the title. Historical
    LORD rationale is archived, not silently treated as current.
- source_word: וְכִסָּה חָמָס עַל לְבוּשׁוֹ
  chosen: he covers his garment with violence
  alternatives:
  - violence covers his garment
  - divorce covers the divorcer’s garment
  rationale: וְכִסָּה is a finite Piel perfect third masculine singular, provisionally the conditional consequence
    with the same human subject. Do not nominalize it as 'the one who covers' without argument. Violence as
    subject or divorce as implicit subject are serious competing analyses; the latter also requires the human
    referent of 'his'. Preserve the garment image without asserting that it signifies the wife.
- source_word: חָמָס
  chosen: violence
  alternatives:
  - wrongdoing
  - violence and injustice
  lexicon: HALOT
  rationale: חָמָס commonly denotes violence, often with moral and social wrongdoing. 'Violence' is the standard
    concise rendering and preserves the severity of the accusation.
- source_word: לְבוּשׁוֹ
  chosen: his garment
  alternatives:
  - his clothing
  - his robe
  lexicon: HALOT
  rationale: A literal rendering preserves the metaphor and possible allusion to marriage imagery without overinterpreting
    it.
- source_word: יְהוָה צְבָאוֹת
  chosen: Yahweh of Armies
  alternatives:
  - Yahweh of hosts
  rationale: Preserve the divine name and the existing title rendering. No theological identity determination
    is made by this syntax decision.
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  chosen: So guard yourselves in your spirit
  alternatives:
  - Take heed in your spirit
  rationale: Niphal perfect second masculine plural with injunctive force, not morphologically an imperative.
    Retain the reflexive call and the wording about spirit; its English imperative expresses the injunction
    without repointing the Hebrew.
- source_word: וְלֹא תִבְגֹּדוּ
  chosen: and do not act faithlessly
  alternatives:
  - and do not deal treacherously
  - and do not be unfaithful
  lexicon: HALOT
  rationale: בגד in this context refers to covenantal betrayal, especially marital unfaithfulness. 'Act faithlessly'
    is readable modern English and preserves the covenantal dimension better than the more archaic 'deal treacherously.'
