  - severity: medium
    issue: ‘네가 … 기도하였으니’가 관계절을 인과절로 확정합니다.
    rationale: אֲשֶׁר는 여기서 ‘네가 기도한 것을’으로 읽는 것이 직접적입니다. 인과적 해석도 가능하지만, 한국어 번역은 문법적 연결을 보존하는 편이 안전합니다.
  revised_text: 그때 아모스의 아들 이사야가 히스기야에게 전갈을 보내어 말했습니다. “야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 네가 앗수르 왕 산헤립에 관하여 내게 기도한 것을 내가 들었다.”
