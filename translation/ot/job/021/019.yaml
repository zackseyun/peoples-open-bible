  from: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
  to: Does God store up a man's punishment for his sons? Let him repay it to the man himself, so that he may know it.[a]
  rationale: In context, אוֹנוֹ is the wicked man’s punitive trouble or punishment, not simply his moral iniquity; “punishment” prevents a misleading English sense. The rhetorical question is well supported. However, the proposal’s “repay the man himself” drops the necessary implied object and can mean compensating him. “Repay it to the man himself” preserves the explicit contrast with his sons and the punishment as the object of requital.
