reference: 1 Maccabees 15:26
source:
  edition: lxx-swete-1909
  text: καὶ ἀπέστειλεν αὐτῷ Σίμων διαχιλίους ἄνδρας ἐκλεκτοὺς συμμαχῆσαι αὐτῷ καὶ ἀργύριον καὶ χρυσίον καὶ σκεύη ἱκανά.
  language: Greek
  pages:
  - 681
  confidence: high
  validation: agree
translation:
  text: Simon sent Antiochus two thousand chosen men to fight alongside him, together with silver, gold, and sufficient equipment.
  philosophy: dynamic
lexical_decisions:
- source_word: ἀπέστειλεν
  chosen: sent
  alternatives:
  - dispatched
  lexicon: LSJ
  rationale: Standard narrative verb for sending; 'sent' is natural modern English and sufficiently formal.
- source_word: διαχιλίους ἄνδρας
  chosen: two thousand men
  alternatives:
  - two thousand soldiers
  lexicon: LSJ
  rationale: The compound numeral with ἄνδρας straightforwardly denotes 'two thousand men.' 'Soldiers' is contextually plausible but not explicit, so 'men' is retained.
- source_word: ἐκλεκτούς
  chosen: chosen
  alternatives:
  - picked
  - select
  lexicon: LSJ
  rationale: Conveys that these men were selected or elite. 'Chosen' preserves the adjectival force without overinterpreting military status.
- source_word: συμμαχῆσαι
  chosen: to fight alongside him
  alternatives:
  - to be his ally
  - to assist him in war
  - to join in alliance with him
  lexicon: LSJ
  rationale: In this military context, the infinitive implies giving armed support rather than merely entering a formal alliance. 'Fight alongside him' makes the practical sense explicit while remaining anchored in the Greek.
- source_word: ἀργύριον
  chosen: silver
  alternatives:
  - money
  lexicon: LSJ
  rationale: The noun literally denotes silver; although it can function as money, the paired list with gold favors the more concrete rendering.
- source_word: χρυσίον
  chosen: gold
  lexicon: LSJ
  rationale: Direct lexical equivalent.
- source_word: σκεύη ἱκανά
  chosen: enough equipment
  alternatives:
  - sufficient supplies
  - adequate vessels
  - enough gear
  lexicon: LSJ
  rationale: σκεύη is broad ('equipment, gear, implements, vessels'). In a military-support context, 'equipment' best fits; ἱκανά means sufficient or enough. 'Supplies' is possible but less directly tied to σκεύη.
