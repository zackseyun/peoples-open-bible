  from: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
  to: The Almighty—we cannot find him out—is great in power and abundant in justice and righteousness; he does not oppress.[a]
  rationale: 'The proposal rightly identifies that the current English is unintelligible: it makes abstract “justice and abundant righteousness” the direct objects of “afflict.” But “violate” is not the smallest or most lexically secure correction; it imports the more specific idiom of perverting/violating justice. In this difficult clause, the Piel of ענה is best retained in its ordinary sense, “oppress” (or “afflict”), with the preceding justice and righteousness functioning as descriptions of God rather than as objects he “violates.” Recasting those attributes as “abundant in justice and righteousness” yields coherent English while retaining the source’s ambiguity about the precise syntactic relation.'
