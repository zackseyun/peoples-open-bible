language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָ֘בֵ֤שׁ כַּ/חֶ֨רֶשׂ כֹּחִ֗/י וּ֭/לְשׁוֹנִ/י מֻדְבָּ֣ק מַלְקוֹחָ֑/י וְֽ/לַ/עֲפַר מָ֥וֶת תִּשְׁפְּתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/016.yaml
  text: For dogs have surrounded me; a company of evildoers has encircled me; like a lion—my hands and my feet.[a]
  footnotes:
  - marker: a
    text: Or 'my tongue sticks to my palate.' The Hebrew term for the part of the mouth is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 힘은 질그릇처럼 말라버리고, 제 혀는 제 턱에 붙어 있으며, 주께서는 저를 죽음의 먼지 속에 두십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 혀는 제 입천장에 붙어 있으며’로도 옮길 수 있습니다. 여기서 입 안의 어느 부분을 가리키는지는 히브리어가 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ כַּחֶרֶשׂ כֹּחִי
  english_pob_choice: My strength is dried up like a potsherd
  chosen_korean: 제 힘은 질그릇처럼 말라버리고
  alternatives_korean:
  - 제 힘은 깨어진 그릇처럼 말라버리고
  - 제 힘은 토기 조각처럼 말라버리고
  lexicon: HALOT
  rationale: כַּחֶרֶשׂ는 깨진 토기 조각/질그릇의 건조하고 부서진 이미지를 주므로, 한국어에서는 낡은 종교어투보다 현대적으로도 이해되는 ‘질그릇처럼’이 직유를 살립니다.
- source_word: וּלְשׁוֹנִי מֻדְבָּק מַלְקוֹחָי
  english_pob_choice: and my tongue sticks to my jaws
  chosen_korean: 제 혀는 제 턱에 붙어 있으며
  alternatives_korean:
  - 제 혀는 제 입천장에 붙어 있으며
  - 제 혀는 제 턱뼈에 달라붙어 있으며
  lexicon: HALOT
  rationale: מַלְקוֹחַי의 정확한 해부학적 지점이 불확실하므로, 본문 이미지를 유지하면서도 자연스러운 한국어인 ‘턱에 붙어’로 옮기고, 대안인 ‘입천장’ 계열은 주석으로 남길 수 있습니다.
- source_word: וְלַעֲפַר מָוֶת תִּשְׁפְּתֵנִי
  english_pob_choice: you lay me in the dust of death
  chosen_korean: 주께서는 저를 죽음의 먼지 속에 두십니다
  alternatives_korean:
  - 주께서는 저를 죽음의 티끌 속에 두십니다
  - 주께서는 저를 죽음의 흙먼지 속에 두십니다
  lexicon: HALOT
  rationale: לַעֲפַר מָוֶת의 ‘dust of death’를 직역하되, 현대 한국어에서 ‘먼지’가 시적·가시적 이미지를 유지하므로 ‘먼지 속에’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 주어와 신적 직접화법
  chosen_reading: 히브리어 2인칭 단수 동사를 따라 주님께 직접 아뢰는 말로 번역해, ‘주께서는 저를 … 두십니다’라고 했습니다.
  alternative_readings:
  - 주께서 저를 … 두셨습니다
  - 저는 … 두어졌습니다
  rationale: 시편의 탄식문맥에서 화자는 하나님께 직접 말하고 있으며, 수동적으로 중화하면 본문의 신학적 긴장—고난의 궁극적 주체를 하나님 앞에 토로하는 구조—이 약화됩니다.
  doctrine_reference: 하나님의 섭리와 고난의 긴장을 본문대로 보존
- issue: ‘죽음의 먼지’ 표현
  chosen_reading: 의역으로 풀지 않고 ‘죽음의 먼지’라는 직유를 보존했습니다.
  alternative_readings:
  - ‘무덤의 흙’으로 의미를 풀어씀
  - ‘죽음의 티끌’로 순화
  rationale: 히브리어의 시적 압축을 유지해야 하며, 죽음/무덤으로 지나치게 해석을 굳히지 않고 시어의 충격을 살리는 것이 본문에 더 충실합니다.
  doctrine_reference: 시적 이미지 보존
