translation:
  text: Then the king summoned Jehoiada the chief priest and asked him, “Why have you not required the Levites to bring in from Judah and Jerusalem the tax required by Moses, the servant of Yahweh, and the assembly of Israel[a] for the tent of the testimony[b]?”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “the tax Moses, the servant of Yahweh, imposed on the assembly of Israel.”
    reason: alternative_reading
  - marker: b
    text: The tabernacle, named for the covenant tablets kept there.
    reason: cultural_note
