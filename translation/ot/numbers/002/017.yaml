  category: meaning_retranslation
  from: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
  to: Then the tent of meeting shall be carried with the Levites’ camp in the middle of the other camps. The Israelites shall set out in the same order in which they camp, each man in his assigned place under his banner.
  rationale: The earlier decisions rightly understood the hand-or-side idiom as assigned placement and the camping–marching comparison as organizational order. I keep those gains while making the transported tent and the collective Israelite subject explicit, and omit redundant synonym notes.
