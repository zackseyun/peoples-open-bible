translation:
  language: en
  text: By acting in these ways, you taught your people that those who are righteous must be kind to others. You also filled your children with good hope,[a] because you give people the opportunity to reorient[b] away from sins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek specifically says “your sons.” This may refer representatively to God’s children or people.
    reason: lexical_alternative
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: by such deeds
  simplified_phrase: by acting in these ways
  preserved_meaning: God’s actions served as the means of teaching his people.
  reasoning_layer_used: lexical decision for διὰ τῶν τοιούτων ἔργων
  rationale: The verbal wording clearly connects the lesson with God’s preceding actions.
- pob_phrase: the righteous must be humane
  simplified_phrase: those who are righteous must be kind to others
  preserved_meaning: Righteous people are morally required to show kindness toward human beings.
  reasoning_layer_used: lexical decisions for δεῖ, τὸν δίκαιον, and φιλάνθρωπον
  rationale: The rewrite replaces the less familiar “humane” with an approved plain-language alternative.
- pob_phrase: made your children full of good hope
  simplified_phrase: filled your children with good hope
  preserved_meaning: God caused his children to possess abundant, positive hope.
  reasoning_layer_used: lexical decision for εὐέλπιδας and POB main text
  rationale: This natural expression preserves both abundance and the hope’s positive quality.
