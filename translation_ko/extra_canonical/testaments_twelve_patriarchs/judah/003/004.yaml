    rationale: 원문의 Ἀχὼρ 및 영어 감사 기록의 Achor에 대응하지 않는 표기이므로 ‘아코르’로 바로잡아야 합니다.
  - severity: medium
    issue: 본문에 [a] 각주 표지가 있으나 제공된 각주가 없습니다.
    rationale: 근거 없는 표지는 구조적으로 고립되어 있으며 원문 의미에도 필요하지 않으므로 삭제해야 합니다.
  - severity: low
    issue: τοὺς πόδας(복수)를 ‘그의 발’로 옮겼습니다.
    rationale: 한국어 집합적 단수도 가능하지만, ‘그의 두 발’은 원문의 복수와 신체 훼손의 대상을 더 정확히 드러냅니다.
