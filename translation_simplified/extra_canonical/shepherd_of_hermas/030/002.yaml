  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/002.yaml
  text: Answering me, he says, "I," he says, "am appointed over repentance, and I give understanding to all who repent. Or does it not seem to you," he says, "that this very thing—to repent—is understanding? To repent," he says, "is great understanding. For the man who has sinned understands that he has done what is evil before the Lord, and the deed that he did rises up in his heart, and he repents and no longer does evil, but does good abundantly, and he humbles his own soul and afflicts it, because he sinned. You see then that repentance is great understanding."
translation:
  language: en
  text: He answered me, “I have been appointed to oversee repentance[a], and I give understanding to everyone who repents. Do you not see that repentance itself is understanding? Indeed, to repent is great understanding. A person who has sinned recognizes that he has done evil before the Lord. What he did rises in his heart, and he repents. He stops doing evil and instead does much good. He humbles himself and afflicts his own soul because he sinned. So you see that repentance is great understanding.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the deed that he did rises up in his heart
  simplified_phrase: What he did rises in his heart
  preserved_meaning: His sinful act comes into his inward awareness while the heart image remains intact.
  reasoning_layer_used: POB translation and source image
  rationale: The wording clarifies the deed’s reference without adding repetition.
