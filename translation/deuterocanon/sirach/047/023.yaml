    text: καὶ τῷ Ἰακὼβ ἔδωκεν κατάλιμμα, καὶ τῷ Δαυεὶδ ἐξ αὐτοῦ ῥίζαν. καὶ ἀνεπαύσατο Σαλωμὼν μετὰ τῶν πατέρων,
