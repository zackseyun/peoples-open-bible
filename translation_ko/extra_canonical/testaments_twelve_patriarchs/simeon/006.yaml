base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006.yaml
  text: '1 Behold, I have told you everything, so that I may be cleared from your sin. 2 But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.


    3 Then the seed of Canaan will perish, and no remnant will remain for Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed. 4 Then the land of Ham will fail, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.


    5 Then a great sign will be glorified for Israel, because the Lord God, appearing on the earth, will come and save Adam in him. 6 Then all the spirits of deceit will be given over to be trampled down, and men will rule over the evil spirits. 7 Then I also will arise in gladness, and I will bless the Most High for his wonders.'
translation:
  language: ko
  text: '보십시오, 내가 너희에게 모든 것을 말하였습니다. 이는 너희의 죄에 대하여 내가 책임 없음을 인정받도록 하려는 것입니다. 2 그러나 너희가 너희에게서 시기와 모든 완악함을 없애면, 내 뼈는 이스라엘에서 장미처럼 피어나고 내 살은 야곱에서 백합처럼 피어날 것이며, 내 향기는 레바논의 향기와 같을 것입니다. 거룩한 이들이 나에게서 영원무궁토록 많아질 것이고, 그들의 가지는 멀리 뻗어 갈 것입니다.


    3 그러면 가나안의 씨가 멸망하고, 아말렉에는 남은 자가 없을 것이며, 모든 갑바도기아인이 멸망하고 모든 헷 사람이 완전히 멸절될 것입니다. 4 그러면 함의 땅이 사라지고 모든 백성이 멸망할 것입니다. 그러면 온 땅은 소란이 그치고, 하늘 아래 있는 모든 곳에서는 전쟁이 그칠 것입니다.


    5 그러면 이스라엘에게 큰 표적이 영화롭게 될 것입니다. 6 그러면 모든 미혹의 영들이 짓밟히도록 내어 주어지고, 사람들은 악한 영들을 다스릴 것입니다. 7 그러면 나도 기쁨 가운데 일어나 그분의 놀라운 일들로 말미암아 지극히 높으신 분을 찬송할 것입니다. [하나님께서 몸을 취하시고 사람들과 함께 식사하셔서 사람들을 구원하셨기 때문입니다.][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장은 제시된 그리스어 본문에서 대괄호로 표시되어 있습니다. 따라서 전승 또는 편집상의 유보를 나타내기 위해 번역에서도 대괄호를 유지했습니다.
    reason: 원어 본문의 대괄호 표지를 보존하고, 해당 구절을 확정된 본문으로 단정하지 않기 위해서입니다.
lexical_decisions:
- source_word: δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν
  english_pob_choice: I may be cleared from your sin
  chosen_korean: “너희의 죄에서 벗어난 사람으로 드러나게”
  alternatives_korean:
  - “너희의 죄에서 정당화되게”
  - “너희의 죄에서 의롭다 하심을 받게”
  - “너희의 죄에서 깨끗하게 되게”
  lexicon: δικαιόω
  rationale: 이 문맥에서는 법정적 ‘의롭다 하심’보다 화자 자신이 그들의 죄에 대해 책임이 없다는 의미가 더 분명하므로, 영어 POB의 ‘cleared’에 맞춰 ‘벗어난 사람으로 드러나게’로 옮겼습니다.
- source_word: φθόνον καὶ πᾶσαν σκληροκαρδίαν
  english_pob_choice: envy and every hardness of heart
  chosen_korean: “시기와 모든 완고한 마음”
  alternatives_korean:
  - “질투와 모든 마음의 완악함”
  - “시기와 모든 마음의 굳어짐”
  lexicon: φθόνος, σκληροκαρδία
  rationale: φθόνος는 단순한 경쟁심보다 ‘시기’가 자연스럽고, σκληροκαρδία는 관용적이지만 소스의 의미를 살리는 ‘완고한 마음’이 적절합니다.
- source_word: ἅγιοι
  english_pob_choice: Holy ones
  chosen_korean: “거룩한 이들”
  alternatives_korean:
  - “성도들”
  - “거룩한 자들”
  lexicon: ἅγιος
  rationale: 이 문헌은 정경 서신의 교회 용어보다 보다 직설적인 형용사적 의미가 살아 있으므로, 관용적 교회어 ‘성도들’보다 ‘거룩한 이들’로 옮겼습니다.
- source_word: πνεύματα τῆς πλάνης
  english_pob_choice: spirits of deceit
  chosen_korean: “속임의 영들”
  alternatives_korean:
  - “기만의 영들”
  - “미혹의 영들”
  lexicon: πνεῦμα
  rationale: 영적 존재의 성격을 그대로 드러내면서도 ‘속임’이 본문의 πλάνη를 가장 간결하게 반영합니다.
theological_decisions:
- issue: 5절의 메시아적 구원 진술과 ‘그 안에서’의 지시
  chosen_reading: 주 하나님께서 땅에 나타나셔서, 그 안에서 아담을 구원하실 것이기 때문입니다.
  alternative_readings:
  - “주 하나님께서 땅에 나타나셔서 아담 안에서 그를 구원하실 것이기 때문입니다.”
  - “주 하나님께서 땅에 나타나셔서 그를 통해 아담을 구원하실 것이기 때문입니다.”
  rationale: 영어 POB의 ‘appearing on the earth’와 ‘will come and save Adam in him’을 따라, 지시대명사 ‘그 안에서’의 모호함을 유지해 원문의 신학적 압축을 보존했습니다.
  doctrine_reference: apocalyptic/messianic salvation motif
