translation:
  text: Every delightful tree will be planted on it, and vineyards will be planted on it. The vines planted on it will produce wine in abundance. For every kind of seed sown on it, one measure will yield a thousand measures[a], and one measure of olives will yield ten press-measures of oil[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The word translated “a thousand” can also mean “ten thousand.”
    reason: alternative_reading
  - marker: b
    text: The amount of oil is expressed in terms of an olive press; its precise measure is uncertain.
    reason: lexical_alternative
