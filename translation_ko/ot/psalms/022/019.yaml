- source_word: בְגָדַי
  english_pob_choice: my garments
  chosen_korean: 내 옷
  alternatives_korean:
  - 내 의복
  - 내 옷가지
  - 내 겉옷
  lexicon: HALOT
  rationale: בגד의 기본 의미를 현대 한국어에서 가장 자연스럽게 전달하는 표현은 ‘옷’입니다. 시적 평행을 위해 뒤의 לְבוּשִׁי와 지나치게 겹치지 않도록 첫 항목은 더 일반적인 표현을 택했습니다.
- source_word: לְבוּשִׁי
  english_pob_choice: my clothing
  chosen_korean: 내 의복
  alternatives_korean:
  - 내 옷
  - 내 복장
  - 내 옷차림
  lexicon: HALOT
  rationale: 두 번째 용어는 첫 항목과 평행을 이루면서도 조금 더 포괄적인 ‘의복’이 מתאים합니다. 이렇게 하면 שני 표현의 미세한 구별을 한국어로도 어느 정도 유지할 수 있습니다.
- source_word: יַפִּילוּ גוֹרָל
  english_pob_choice: they cast lots
  chosen_korean: 제비를 뽑습니다
  alternatives_korean:
  - 제비를 던집니다
  - 제비를 가릅니다
  - 제비를 씁니다
  lexicon: HALOT
  rationale: יַפִּילוּ + גוֹרָל은 관용적으로 ‘제비를 뽑다’에 해당하므로, 히브리어의 관용을 그대로 살린 한국어 관용 표현을 사용했습니다.
