  - “여호와, 이스라엘의 하나님이 이렇게 말씀하십니다”
  lexicon: YHWH
  rationale: 본문의 신명(יהוה)을 공적·학술적 표준인 ‘야훼’로 옮겨 원천 표기를 드러내고, 이어지는 ‘이스라엘의 하나님’을 자연스럽게 붙였습니다.
- source_word: נֵבֶל
  english_pob_choice: jar
  chosen_korean: 항아리
  alternatives_korean:
  - 독
  - 그릇
  - 물항아리
  lexicon: jar
  rationale: 문맥상 액체를 담는 도기 용기를 가리키므로 일반 독보다 중립적이고 현대적인 ‘항아리’가 가장 직접적입니다.
- source_word: יִמָּלֵא יָיִן
  english_pob_choice: will be filled with wine
  chosen_korean: 포도주로 가득 차게 될 것이다
  alternatives_korean:
  - 포도주로 채워질 것이다
  - 포도주가 차게 될 것이다
  lexicon: fill with wine
  rationale: 수동태의 결과 상태를 살리되, 한국어에서 자연스러운 ‘가득 차게 될 것이다’로 옮겨 강조를 유지했습니다.
- source_word: הֲיָדֹעַ לֹא נֵדַע
  english_pob_choice: Do we not certainly know
  chosen_korean: 그것은 우리가 정말 잘 알고 있지 않습니까
  alternatives_korean:
  - 우리가 분명 알지 않습니까
  - 우리는 그것을 이미 잘 알고 있지 않습니까
  lexicon: intensified knowing
  rationale: 히브리어의 수사적 반문을 한국어의 확인 질문으로 살려, 당연한 사실을 말하는 빈정거림을 보존했습니다.
