  category: lexical
  from: if he destroys
  to: when he destroys
  rationale: The Syriac conjunction 'mā d-' is temporal ('when', 'as soon as') rather
    than conditional ('if', which would be 'en'). Sennacherib's arrogance is based
    on his confident expectation of when he destroys Zion, not merely a conditional
    possibility.
- timestamp: '2026-04-28T09:36:33Z'
