source:
  edition: SBLGNT
  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
  footnotes:
  - marker: a
    text: That is, John the Baptist.
    reason: cross_reference
translation:
  language: ko
  text: 이는 요한[a]이 아직 옥에 던져지지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉 세례 요한을 가리킵니다.
