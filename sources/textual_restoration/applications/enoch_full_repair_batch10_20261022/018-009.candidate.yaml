translation:
  text: I saw burning fire and what lay within all the mountains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected daggered clause literally has “and what was within all the mountains,” retained here as a
      second object of seeing. It is readable as a diplomatic construction but not certified as the earlier meaning.
      Charles printed48 note51, continued on49, identifies it as a corrupt rendering of the Greek κἀπέκεινα τῶν
      ὀρέων τούτων, “and beyond these mountains,” and calls “all” corrupt for “these.” That Greek location phrase
      also leads into the place description of18:10. This English does not silently replace within with beyond or
      all with these, or force the location phrase to modify the fire. The printed Greek is comparison evidence,
      not a newly collated manuscript.
    reason: textual_variant
