theological_decisions:
- issue: Remarriage after a spouse’s death
  chosen_reading: Remarriage is not sin; remaining unmarried gains greater honor and glory with the Lord.
  rationale: The dialogue states twice, “he does not sin,” while commending continence as more honorable;
    the translation preserves both the permission and the commendation without softening either.
- issue: Use of “Lord” for God vs. “sir” for the shepherd
  chosen_reading: Translate vocative κύριε addressed to the shepherd as “sir,” but retain “the Lord” for
    πρὸς τὸν Κύριον referring to God.
  alternative_readings:
  - Translate both as “Lord”
  - Translate both as “sir/master”
  rationale: Context distinguishes a respectful address to a messenger from the divine title; this maintains
    theological clarity and matches Cartha’s guidance on titles.
  doctrine_reference: 'Cartha Translation Philosophy — Contested terms: Kyrios'
- issue: Contextual repentance reassessment
  chosen_reading: 'Current contextual decision for the complete simplified passage, III.1–7 and IV.1–4:
    retain “repentance” and its distinction from forgiveness of former sins associated with going down
    into the water. Retain the requirement to sin no longer and live in purity; the denial of repentance
    of sins to people who have now believed or will believe; and the Lord’s establishment of repentance
    for people called before these days, grounded in his knowledge of human weakness and the devil’s schemes
    against God’s servants. Preserve the Lord’s compassion, the speaker’s granted authority over this
    repentance, and the one-repentance teaching after the great and solemn calling. Retain provisionally
    the working positive reading “repeatedly sin and repent,” its difficult-life warning, and the disclosed
    “do not repent” alternative without adjudicating the unresolved source choice. Preserve the assurance
    of salvation if no more sins are added and for everyone who does these things. In IV, retain both
    statements that the surviving partner’s remarriage is not sin, the greater honor and great glory of
    staying unmarried, the commands to keep purity and reverence, the promise to live to God, the entrustment
    and dwelling statements, and forgiveness conditioned on keeping the commandments and walking in this
    purity. The former truncated quotation was an incomplete historical draft, not the current chosen
    reading; its historical record remains in the supplied archives and review history.'
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- issue: Baptism, later repentance and remarriage
  chosen_reading: Retain all distinctions, the one-repentance teaching, the negation alternative and permission
    for the surviving partner to marry.
  rationale: Do not remove difficult clauses, supply a different doctrinal rule or lose the second historical
    section when repairing the first.
