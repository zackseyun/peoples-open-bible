translation:
  text: In those days the angels will gather and turn their heads eastward, toward the people of Parthia and Media.
    They will stir up the kings and rouse a spirit of turmoil in their hearts, and they will remove them from their
    thrones. They will go out like lions from their lairs, like hungry wolves in the midst of their pasture.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected verb says the angels gather. The names are the people of Parthia and Media, not a general
      reference to Persia. No modern country, campaign, or date is inserted. The complete unit continues onto the
      next page through both the lion and hungry-wolf comparisons.
