  yaml_path: translation/ot/psalms/142/001.yaml
  text: With my voice I cry out to Yahweh[a][b]; with my voice I plead to Yahweh for mercy.
  footnotes:
  - marker: a
    text: Hebrew Maskil, a technical term in psalm headings; possibly indicating a contemplative or instructive composition.
    reason: lexical_alternative
  - marker: b
    text: Or 'for David' or 'by David'; the Hebrew heading can denote authorship, dedication, or association.
    reason: alternative_reading
translation:
  language: ko
  text: 내 목소리로 내가 야훼께 부르짖습니다. 내 목소리로 내가 야훼께 은혜를 간구합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַשְׂכִּיל
  english_pob_choice: Maskil
  chosen_korean: 마스킬
  alternatives_korean:
  - 묵상
  - 교훈
  - 지혜로운 노래
  lexicon: HALOT
  rationale: 시편 표제의 전문 용어는 의미를 단정하기보다 음역으로 보존하는 것이 원문의 분류 표지를 가장 안전하게 살립니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗을 위한
  - 다윗에게 속한
  - 다윗이 지은
  lexicon: HALOT
  rationale: ל의 기능이 저작자·헌정·관련성을 모두 열어 두므로, 한국어에서는 ‘다윗의’로 옮겨 애매성을 유지했습니다.
- source_word: בִּהְיוֹתוֹ
  english_pob_choice: when he was
  chosen_korean: 그가 … 있을 때
  alternatives_korean:
  - 그가 … 하는 동안
  - 그의 있음에
  lexicon: HALOT
  rationale: 동사 היה의 부정사구는 여기서 시간 부사절로 읽히므로, 자연스러운 현대 한국어로 시점을 분명히 했습니다.
- source_word: בַמְּעָרָה
  english_pob_choice: in the cave
  chosen_korean: 동굴에
  alternatives_korean:
  - 그 동굴에
  - 한 동굴에
  lexicon: HALOT
  rationale: 정관사가 붙어 있으나 표제어 문맥상 특정 동굴을 한국어 본문에서 과도하게 특정하지 않기 위해 ‘동굴에’로 처리했습니다.
theological_decisions:
- issue: 표제문의 장르 표지 처리
  chosen_reading: 마스킬과 기도를 한 줄의 표제 구조로 유지했습니다.
  alternative_readings:
  - ‘교훈의 노래’처럼 뜻을 풀어 쓰는 방식
  - 둘을 문장으로 완전히 분리하는 방식
  rationale: 원문은 해설문이 아니라 표제이며, 장르 표지를 보존해야 독자가 시편의 형식을 오해하지 않습니다.
  doctrine_reference: 시편 표제의 문학적 기능 보존
- issue: 다윗의 소유격/연결성의 모호성
  chosen_reading: ‘다윗의’로 남겨 저작자·헌정·연관성의 여지를 보존했습니다.
  alternative_readings:
  - ‘다윗이 지은’
  - ‘다윗을 위한’
  rationale: 히브리어 ל는 한 가지 의미로 고정되지 않으므로, 본문에서 해석을 과도하게 좁히지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 본문 비평 및 표제 해석의 신중성
