id: PSA.5.6
reference: Psalms 5:6
source:
  edition: WLC
  text: תְּאַבֵּד֮ דֹּבְרֵ֪י כָ֫זָ֥ב אִישׁ דָּמִ֥ים וּ/מִרְמָ֗ה יְתָ֘עֵ֥ב יְהוָֽה־׀׃
translation:
  text: You destroy those who speak lies; Yahweh abhors those guilty of bloodshed and deceit.
  philosophy: dynamic
lexical_decisions:
- source_word: תְּאַבֵּד
  chosen: You destroy
  alternatives:
  - You will destroy
  - You make perish
  lexicon: HALOT
  rationale: Piel of אבד with second masculine singular addresses God directly and conveys causing to perish/destroy. Present English is a natural gnomic rendering in context, though a future sense is also possible.
- source_word: דֹּבְרֵי כָזָב
  chosen: those who speak lies
  alternatives:
  - liars
  - speakers of falsehood
  lexicon: HALOT
  rationale: The construct phrase is literally 'speakers of falsehood.' 'Those who speak lies' preserves the verbal force and avoids over-compressing the Hebrew into a simple label.
- source_word: אִישׁ דָּמִים
  chosen: a man of bloodshed
  alternatives:
  - a bloodthirsty man
  - a man of bloods
  - a murderer
  lexicon: HALOT
  rationale: The singular אִישׁ is retained as 'man' per gender-accurate policy, and דָּמִים in this idiom denotes bloodguilt/violence. 'Bloodshed' is idiomatic modern English that preserves the sense without narrowing it only to murder.
- source_word: וּמִרְמָה
  chosen: and deceit
  alternatives:
  - and treachery
  - and fraud
  lexicon: HALOT
  rationale: מִרְמָה commonly denotes deceit or treachery. 'Deceit' is the broadest and most natural pairing with 'bloodshed' here.
- source_word: יְתָעֵב
  chosen: abhors
  alternatives:
  - detests
  - loathes
  lexicon: HALOT
  rationale: Piel of תעב expresses strong revulsion. 'Abhors' preserves the moral intensity and suits the poetic register.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
