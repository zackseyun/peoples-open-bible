  text: And Yahweh will be a stronghold for the oppressed[a][b], a stronghold in times of trouble.
  footnotes:
  - marker: a
    text: Or 'for the crushed' or 'for the downtrodden.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a refuge' or 'a high refuge'; the Hebrew term denotes a secure, elevated place of protection.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 억눌린 이에게 요새가 되실 것이며, 환난의 때에 요새가 되실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피난처’ 또는 ‘높은 피난처’. 히브리어는 안전한 높은 곳에 있는 보호처를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘짓눌린 이’ 또는 ‘억압받는 이’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  english_pob_choice: And he
  chosen_korean: 그가
  alternatives_korean:
  - 그리고 그가
  - 또 그가
  lexicon: HALOT
  rationale: 접속사와 대명사가 이어지는 흐름을 한국어에서는 주어 표지로 자연스럽게 살려, 문맥의 연결성과 주어 강조를 과장하지 않게 유지했습니다.
- source_word: יִשְׁפֹּט
  english_pob_choice: will judge
  chosen_korean: 심판하시며
  alternatives_korean:
  - 심판하실 것이며
  - 판단하시며
  lexicon: HALOT
  rationale: 시편의 예언적 시제와 병행 구조를 살리면서, ‘judge’를 단순한 법정 판결보다 하나님의 통치적 심판으로 드러내기 위해 ‘심판하시며’로 옮겼습니다.
- source_word: תֵּבֵל
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 거주하는 세상
  lexicon: HALOT
  rationale: תֵּבֵל의 ‘거주하는 세계’라는 뉘앙스를 현대 한국어에서 가장 자연스럽게 넓은 보편성으로 드러내는 표현으로 ‘세상’을 택했습니다.
- source_word: בְּמֵישָׁרִים
  english_pob_choice: with fairness
  chosen_korean: 공평으로
  alternatives_korean:
  - 공의로
  - 정직하게
  - 공정하게
  lexicon: HALOT
  rationale: מֵישָׁרִים의 직선성·공평성·바름의 의미를 ‘공평으로’로 간결하게 살려, 전통적 교회어인 ‘의’와 구별되면서도 원문의 판단 기준을 드러냈습니다.
theological_decisions:
- issue: תֵּבֵל과 לְאֻמִּים의 포괄 범위
  chosen_reading: ‘세상’과 ‘민족들’로 옮겨, 하나님의 न्याय이 특정 집단이 아니라 모든 거주 세계와 여러 민족 전체에 미친다는 보편성을 유지했습니다.
  alternative_readings:
  - ‘인간 세상’으로 좁히는 해석
  - ‘나라들’로 국가 단위에 한정하는 해석
  rationale: 시의 평행법이 전 지구적·보편적 통치를 강조하므로, 범위를 좁히지 않고 원문이 지시하는 포괄성을 보존했습니다.
  doctrine_reference: 하나님의 보편적 통치와 공의로운 심판
