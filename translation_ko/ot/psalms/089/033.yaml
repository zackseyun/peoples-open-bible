translation:
  language: ko
  text: 그러나 나는 나의 한결같은 사랑을 그에게서 거두지 않겠고, 나의 신실함을 저버리지 않겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפָקַדְתִּי
  english_pob_choice: Then I will punish
  chosen_korean: 벌하겠습니다
  alternatives_korean:
  - 징계하겠습니다
  - 문책하겠습니다
  - 돌보겠습니다
  lexicon: HALOT
  rationale: פּקד는 ‘방문하다’부터 ‘벌하다’까지 폭이 넓지만, 여기서는 징벌 도구가 뒤따르는 문맥이므로 ‘벌하다’가 가장 직접적으로 대응합니다. ‘Then’의 순차성은 한국어에서는 앞뒤 문맥이 주어질 때 자연스럽게 드러나므로 본문에는 생략했습니다.
- source_word: בְשֵׁבֶט
  english_pob_choice: with the rod
  chosen_korean: 막대기로
  alternatives_korean:
  - 막대와 함께
  - 지팡이로
  - 왕홀로
  lexicon: HALOT
  rationale: שֵׁבֶט은 막대기, 지팡이, 왕홀까지 뜻할 수 있으나, 여기서는 훈육과 징벌의 도구이므로 ‘막대기’가 가장 적절합니다.
- source_word: פִּשְׁעָם
  english_pob_choice: their transgression
  chosen_korean: 그들의 반역은
  alternatives_korean:
  - 그들의 죄과는
  - 그들의 범죄는
  - 그들의 죄는
  lexicon: HALOT
  rationale: פֶּשַׁע는 단순한 실수보다 ‘반역/불충’의 강한 뉘앙스를 갖습니다. 시편의 언약적 배경을 살리기 위해 ‘반역’으로 옮겼습니다.
- source_word: וּבִנְגָעִים
  english_pob_choice: and with blows
  chosen_korean: 매질로
  alternatives_korean:
  - 타격으로
  - 때림으로
  - 재앙으로
  lexicon: HALOT
  rationale: נֶגַע는 재앙, 질병, 타격, 매질까지 폭이 있으나, 앞의 ‘막대기’와 평행을 이루는 징벌 문맥에서는 ‘매질’이 가장 자연스럽고 강합니다.
- source_word: עֲוֹנָם
  english_pob_choice: their iniquity
  chosen_korean: 그들의 죄악은
  alternatives_korean:
  - 그들의 불의는
  - 그들의 죄과는
  - 그들의 악은
  lexicon: HALOT
  rationale: עָוֹן은 죄악, 죄책, 불의를 뜻할 수 있으나, 앞의 פֶּשַׁע와의 병행을 살려 도덕적 무게가 있는 ‘죄악’으로 옮겼습니다.
theological_decisions:
- issue: 징벌적 언어의 강도
  chosen_reading: 하나님의 실제적인 징계를 드러내되, 이 절만으로 최종적인 버림까지 말하지는 않습니다.
  alternative_readings:
  - ‘징계’로 완화해 읽을 수 있습니다.
  - 언약 백성에 대한 최종 거절로 확대해 읽을 수 있습니다.
  rationale: 원문은 막대기와 매질이라는 구체적 형벌 이미지를 사용하므로 이를 약화시키지 말아야 합니다. 다만 시편 전체의 문맥상 최종적 배척을 이 절에 덧붙이지는 않습니다.
  doctrine_reference: 징계와 언약적 신실성의 긴장을 보존
