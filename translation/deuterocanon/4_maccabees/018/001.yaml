  text: Ὦ τῶν Ἀβραμιαίων σπερμάτων ἀπόγονοι παῖδες Ἰσραηλεῖται, πείθεσθε τῷ νόμῳ τούτῳ, καὶ πάντα τρόπον εὐσεβεῖτε·
