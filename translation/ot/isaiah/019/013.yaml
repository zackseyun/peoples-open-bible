  from: The princes of Zoan have become foolish; the princes of Noph are deceived. They have led Egypt astray[a], they who are the cornerstone of her tribes.
  to: The princes of Zoan have become foolish; the princes of Memphis are deceived. They—the cornerstone of Egypt’s tribes—have led Egypt astray.
