id: REV.2.21
reference: Revelation 2:21
source:
  edition: SBLGNT
  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
translation:
  text: And I gave her time to reorient[b][a], but she is not willing to reorient away from her sexual immorality.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, more literally, 'to repent from her sexual immorality.'
    reason: lexical_alternative
  - marker: b
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκα
  chosen: I gave
  alternatives:
  - I have given
  lexicon: BDAG
  rationale: Aorist indicative is best rendered as a simple past in this context, referring to a completed act of granting opportunity.
- source_word: αὐτῇ
  chosen: her
  lexicon: BDAG
  rationale: Dative feminine singular refers to the woman symbolically called Jezebel in the immediate context; English indirect object 'her' is straightforward.
- source_word: χρόνον
  chosen: time
  alternatives:
  - an opportunity
  - a period of time
  lexicon: BDAG
  rationale: χρόνος denotes time or a span of time. 'Time' is the most natural and sufficiently precise English rendering here, implying a period allowed for repentance.
- source_word: ἵνα μετανοήσῃ
  chosen: to reorient
  alternatives:
  - to repent
  - so that she might repent
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use reorient/reorientation without automatically inserting God. The sentence supplies a departure, destination, interpersonal setting, or the work's own conceptual framework. Preserve distinct turning verbs and named wrongdoing. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
- source_word: οὐ θέλει
  chosen: she is not willing
  alternatives:
  - she does not want
  - she refuses
  lexicon: BDAG
  rationale: θέλω here expresses volition rather than mere futurity. 'Is not willing' preserves the force of unwillingness without overinterpreting as an absolute act of refusal, though 'refuses' is contextually close.
- source_word: μετανοῆσαι
  chosen: to reorient
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use reorient/reorientation without automatically inserting God. The sentence supplies a departure, destination, interpersonal setting, or the work's own conceptual framework. Preserve distinct turning verbs and named wrongdoing. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  alternatives:
  - to repent
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
- source_word: ἐκ τῆς πορνείας αὐτῆς
  chosen: of her sexual immorality
  alternatives:
  - from her sexual immorality
  - of her immorality
  lexicon: BDAG
  rationale: πορνεία commonly denotes sexual immorality. With μετανοέω, English idiom often uses 'repent of' even though Greek has ἐκ ('from/out of'). 'Sexual immorality' preserves the lexical specificity better than the broader 'immorality'.
