source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Πρῶτον πάντων πίστευσον ὅτι εἷς ἐστὶν ὁ Θεός, ὁ τὰ πάντα κτίσας καὶ καταρτίσας, καὶ ποιήσας ἐκ
    τοῦ μὴ ὄντος εἰς τὸ εἶναι τὰ πάντα, καὶ πάντα χωρῶν, μόνος δὲ ἀχώρητος ὤν. 2. πίστευσον οὖν αὐτῷ καὶ
    φοβήθητι αὐτόν, φοβηθεὶς δὲ ἐγκράτευσαι. ταῦτα φύλασσε καὶ ἀποβαλεῖς πᾶσαν πονηρίαν ἀπὸ σεαυτοῦ καὶ
    ἐνδύσῃ πᾶσαν ἀρετὴν δικαιοσύνης καὶ ζήσῃ τῷ θεῷ, ἐὰν φυλάξῃς τὴν ἐντολὴν ταύτην.
  language: Greek
