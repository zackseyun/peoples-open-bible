id: PRO.14.1
reference: Proverbs 14:1
source:
  edition: WLC
  text: חַכְמ֣וֹת נָ֭שִׁים בָּנְתָ֣ה בֵיתָ֑/הּ וְ֝/אִוֶּ֗לֶת בְּ/יָדֶ֥י/הָ תֶהֶרְסֶֽ/נּוּ׃
translation:
  text: A wise woman builds her house[a], but a foolish woman tears it down with her own hands.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “House” includes the household or family, not only the building.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְמוֹת נָשִׁים
  chosen: a wise woman
  alternatives:
  - wise women
  - women's wisdom
  - every wise woman
  lexicon: HALOT
  rationale: The construction is idiomatically understood in this proverb as a representative wise woman; it does not demand an English superlative.
- source_word: בָּנְתָה
  chosen: builds
  alternatives:
  - has built
  - built
  lexicon: HALOT
  rationale: Though morphologically perfect, Hebrew proverbs commonly use the perfect for gnomic/general truth. Present tense in English best conveys proverbial force.
- source_word: בֵיתָהּ
  chosen: her house
  alternatives:
  - her household
  - her home
  lexicon: HALOT
  rationale: בַּיִת can denote either the physical house or the household/family establishment. 'House' preserves the Hebrew image and allows the proverb's metaphorical breadth; 'household' is interpretive and narrower.
- source_word: אִוֶּלֶת
  chosen: a foolish woman
  alternatives:
  - folly
  - a fool
  lexicon: HALOT
  rationale: Given the feminine singular verb and the contrast with the first colon, the noun is best rendered personally as 'a foolish woman' rather than abstract 'folly.' This makes the parallelism explicit in natural English.
- source_word: בְּיָדֶיהָ
  chosen: with her own hands
  alternatives:
  - with her hands
  - by her hands
  lexicon: HALOT
  rationale: The phrase is instrumental and emphasizes personal agency. 'With her own hands' brings out the emphatic sense naturally in English without adding foreign content.
- source_word: תֶהֶרְסֶנּוּ
  chosen: tears it down
  alternatives:
  - destroys it
  - pulls it down
  - overthrows it
  lexicon: HALOT
  rationale: The verb הרס means to tear down/demolish. 'Tears it down' matches the building/demolishing contrast with 'builds' and keeps the concrete metaphor vivid. The pronominal suffix refers back to 'house'.
