  - marker: b
    text: '''Selah'' is traditionally transliterated; its precise meaning is uncertain.'
    reason: cultural_note
  - marker: c
    text: Or 'have established its pillars.'
    reason: lexical_alternative
translation:
  language: ko
  text: 땅과 그 안에 사는 모든 이가 녹아내립니다[a]. 내가 그 기둥들을 굳게 세웠습니다. 셀라[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '녹아내리다'라는 이미지를 사용합니다. 문맥상 '흔들리다', '무너지다', 또는 '녹아 없어지다'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘셀라’는 전통적으로 음역합니다. 정확한 의미는 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 내가 정한 때에
  alternatives_korean:
  - 이는
  - 왜냐하면
