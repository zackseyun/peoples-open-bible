    rationale: 각주는 실제 대안을 제공하지 못하며, 제공된 영어 POB의 ‘Raiah’는 히브리어 본문의 표기 변이가 아니라 가능한 다른 로마자 음역입니다. 대안 한국어 음역을 제시하고 설명을 바로잡아야 합니다.
