  to: Look away from him, so that he may rest, until he enjoys his day like a hired worker[a].
  rationale: In the hired-worker comparison, יִרְצֶה conveys satisfaction or enjoyment, not the act of fulfilling a day. “Enjoys his day” is idiomatic and fits the parallel in Job 7:2. “Rest” remains an acceptable contextual rendering of the requested cessation in וְיֶחְדָּל.
