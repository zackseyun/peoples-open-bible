id: 2CO.2.4
reference: 2 Corinthians 2:4
source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
translation:
  text: For I wrote to you out of great affliction and anguish of heart, with many tears—not to grieve you, but to let you know how great my love for you is.
  philosophy: dynamic
lexical_decisions:
- source_word: ἐκ
  chosen: out of
  alternatives:
  - from
  lexicon: BDAG
  rationale: Marks source/origin; 'out of' preserves the sense that the writing arose from Paul's inner condition.
- source_word: θλίψεως
  chosen: affliction
  alternatives:
  - distress
  - trouble
  lexicon: BDAG
  rationale: Keeps the weight of pressure/suffering without narrowing it to external persecution alone.
- source_word: συνοχῆς καρδίας
  chosen: anguish of heart
  alternatives:
  - distress of heart
  - great anxiety of heart
  lexicon: BDAG
  rationale: The phrase expresses inward emotional constriction; 'anguish of heart' is natural English and preserves the emotional intensity.
- source_word: ἔγραψα
  chosen: I wrote
  alternatives:
  - I wrote previously
  lexicon: BDAG
  rationale: Simple aorist past is sufficient here; the broader context may imply a previous letter, but that implication need not be imported into the verb itself.
- source_word: διὰ πολλῶν δακρύων
  chosen: with many tears
  alternatives:
  - through many tears
  lexicon: BDAG
  rationale: Idiomatic English for accompaniment while preserving the picture of tearful writing.
- source_word: λυπηθῆτε
  chosen: be grieved
  alternatives:
  - be saddened
  - be pained
  lexicon: BDAG
  rationale: '''Be grieved'' reflects the passive sense and matches Paul''s concern about causing sorrow.'
- source_word: ἀγάπην
  chosen: love
  lexicon: BDAG
  rationale: Follows the project's default rendering for ἀγάπη.
- source_word: γνῶτε
  chosen: might know
  alternatives:
  - might come to know
  - might recognize
  lexicon: BDAG
  rationale: Retains the purpose clause and allows either recognition or fuller realization without over-translating.
- source_word: περισσοτέρως εἰς ὑμᾶς
  chosen: so abundantly for you
  alternatives:
  - especially for you
  - more abundantly toward you
  lexicon: BDAG
  rationale: περισσοτέρως intensifies the extent of Paul's love; 'so abundantly for you' is readable modern English while preserving the comparative force contextually.
