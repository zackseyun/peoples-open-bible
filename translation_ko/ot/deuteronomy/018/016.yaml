revisions:
- from: 호렙에서, 곧 모임의 날에 당신이 야훼 당신의 하나님께 구한 것과 같습니다. 곧 말하기를, “야훼 내 하나님의 음성을 다시는 듣지 않게 해 주십시오. 이 큰 불도 다시는 보지 않게 해 주십시오. 그러면 내가 죽을까 두렵습니다.”[a][b]
  to: 이는 호렙에서 모임의 날에 당신이 야훼 당신의 하나님께 요청한 모든 것과 같습니다. 곧 이렇게 말하였습니다. “야훼 내 하나님의 음성을 더 이상 듣지 않게 해 주십시오. 이 큰 불도 다시는 보지 않게 해 주십시오. 제가 죽을까 합니다.”[a][b]
  rationale: 원문의 비교 표현과 수식 관계를 명료하게 하고, 직접 인용의 청원체를 유지했습니다. 죽음에 관한 마지막 절은 원문이 명시하지 않는 감정 표현을 피하면서도 פן의 우려·회피 뉘앙스를 보존했습니다. 각주 b는 두 한국어 부사의 서로 다른 히브리어 근거를 정확히 구분하도록 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:47:02Z'
