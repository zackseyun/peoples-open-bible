  - futility
  - meaninglessness
  rationale: This is not a doctrinally contested term in the creed sense, but it is theologically and thematically significant for Ecclesiastes. 'Vanity' best preserves the book's recurring motif in readable English while allowing the metaphorical breadth of the Hebrew; alternatives are preserved in a footnote for transparency.
