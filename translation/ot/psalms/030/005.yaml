id: PSA.30.5
reference: Psalms 30:5
source:
  edition: WLC
  text: כִּ֤י רֶ֨גַע בְּ/אַפּ/וֹ֮ חַיִּ֪ים בִּ/רְצ֫וֹנ֥/וֹ בָּ֭/עֶרֶב יָלִ֥ין בֶּ֗כִי וְ/לַ/בֹּ֥קֶר רִנָּֽה׀׃
translation:
  text: For his anger lasts only a moment, but his favor lasts a lifetime[a]. Weeping may stay for the night[b], but a shout of joy comes in the morning.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “in his favor is life.”
    reason: alternative_reading
  - marker: b
    text: Literally, “In the evening weeping lodges”; weeping is pictured as an overnight guest.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - Surely
  - Because
  lexicon: HALOT
  rationale: Introduces an explanatory or grounding statement for the preceding context. 'For' fits the poetic flow and common discourse function here better than the more emphatic 'indeed' or causal 'because'.
- source_word: רֶגַע
  chosen: for a moment
  alternatives:
  - a moment
  - briefly
  lexicon: HALOT
  rationale: 'The noun denotes a brief instant. Rendering with the prepositional sense supplied by the following phrase gives idiomatic English: ''his anger is for a moment.'''
- source_word: בְּאַפּוֹ
  chosen: his anger
  alternatives:
  - in his anger
  - his wrath
  lexicon: HALOT
  rationale: אַף literally refers to 'nose' and idiomatically to anger/wrath. In this verbless clause, English requires a predicate relationship; 'his anger' is the natural idiomatic rendering. 'Wrath' is possible but sounds stronger and more elevated than the Hebrew likely requires here.
- source_word: חַיִּים
  chosen: life
  alternatives:
  - life lasts
  - there is life
  - lives
  lexicon: HALOT
  rationale: Though morphologically plural, חַיִּים commonly functions as the abstract noun 'life.' Here it stands in antithesis to the brevity of anger and the sorrow of the night.
- source_word: בִּרְצוֹנוֹ
  chosen: in his favor
  alternatives:
  - by his favor
  - in his goodwill
  - in his pleasure
  lexicon: HALOT
  rationale: רָצוֹן denotes favor, goodwill, or acceptance. 'In his favor' preserves the compact Hebrew parallelism and communicates that life is found within or by means of God's favorable disposition.
- source_word: בָּעֶרֶב
  chosen: for the evening
  alternatives:
  - in the evening
  - at evening
  lexicon: HALOT
  rationale: The phrase begins the temporal image of sorrow's limited duration. 'For the evening' works naturally with the following verb 'stay' and highlights temporariness.
- source_word: יָלִין
  chosen: may stay
  alternatives:
  - lodges
  - spends the night
  - remains overnight
  lexicon: HALOT
  rationale: The verb literally means to lodge or spend the night. Because the subject is the abstract noun 'weeping,' 'may stay' gives a natural personified English equivalent while preserving the overnight sense in context.
- source_word: בֶּכִי
  chosen: weeping
  alternatives:
  - crying
  - sorrow
  lexicon: HALOT
  rationale: The noun denotes weeping/crying. 'Weeping' best matches the poetic register and pairs well with 'rejoicing' in the next colon.
- source_word: וְלַבֹּקֶר
  chosen: but rejoicing comes in the morning
  alternatives:
  - and in the morning rejoicing
  - but in the morning comes a shout of joy
  lexicon: HALOT
  rationale: The conjunction marks contrast in the poetic parallelism, not mere addition, so 'but' is justified in English. 'In the morning' preserves the temporal contrast with evening.
- source_word: רִנָּה
  chosen: a shout of joy
  alternatives:
  - a shout of joy
  - joyful singing
  lexicon: HALOT
  rationale: רנה commonly denotes an audible joyful cry or ringing shout; this retains that concrete sound image.
- source_word: רֶגַע בְּאַפּוֹ
  chosen: his anger lasts only a moment
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: English requires an understood duration verb; “only” expresses the brevity of רגע in the parallel contrast.
- source_word: חַיִּים בִּרְצוֹנוֹ
  chosen: his favor lasts a lifetime
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The clause balances the moment of anger with life/lifetime associated with divine favor, making the temporal antithesis explicit in natural English.
