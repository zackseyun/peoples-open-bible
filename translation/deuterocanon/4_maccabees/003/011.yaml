  text: ἀλλὰ τις αὐτὸν ἀλόγιστος ἐπιθυμία τοῦ παρὰ τοῖς πολεμίοις ὕδατος ἐπιτείνουσα συνέφρυγε, καὶ λύουσα κατέφλεγεν.
