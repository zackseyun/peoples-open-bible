  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
translation:
  text: But now I am writing[a] to you not to associate with anyone who is called a brother or sister but is sexually immoral or greedy or an idolater or verbally abusive or a drunkard or a swindler—not even to eat with such a person.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “But what I wrote to you was ...,” clarifying the instruction in the earlier letter.
    reason: alternative_reading
