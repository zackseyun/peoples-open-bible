revisions:
- from: 그들은 자신들이 받은 이를 속였습니다. 그리고 심판 때에 그들이 무엇을 말하겠습니까, 혹은 마지막 때에 어떻게 대답하겠습니까?[a]
  to: 그들은 자신들이 받은 이를 속였습니다. 그리고 심판 때에 무슨 말을 하겠으며, 또는 마지막 때에 어떻게 대답하겠습니까?
  rationale: 근거를 잃은 ‘그렇다면’ 대안 각주와 그 앵커를 삭제했습니다. 본문은 라틴어의 paratactic Et, quid, uel 및 두 미래형 의문을 유지하면서 현대 표준 한국어 합쇼체로 다듬었습니다. ‘이를’은 원문의 여성 단수를 불필요하게 남성화하지 않으면서, 이 절만으로는 확인되지 않는 선행사를 단정하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:39Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어의 완료형 fraudauerunt, 여성 단수 목적어 eam quam acceperunt, 그리고 두 병렬 의문문을 전반적으로 잘 반영했습니다. 다만 본문의 Et quid는 최신 원문·영어 감사 기록에 따라 단순 접속의 ‘그리고 무엇을’로 처리해야 하며, 이를 ‘그렇다면 무엇을’으로 제시하는 각주는 더 이상 근거가 없습니다.
  naturalness: ‘무엇을 말하겠습니까’도 이해되지만, 심판의 자리에서 할 말을 묻는 한국어 관용에는 ‘무슨 말을 하겠으며’가 더 자연스럽습니다. 또한 병렬 의문은 ‘또는’으로 명시하면 원문의 uel을 더 분명히 살릴 수 있습니다.
  terminology: ‘속였습니다’, ‘심판 때’, ‘마지막 때’, ‘대답하겠습니까’는 문맥과 현대 합쇼체에 적절합니다. 여성 단수 목적어는 선행사가 제시되지 않은 절 단위에서는 한국어의 성별 비표지 표현 ‘이를’로 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: 각주 a가 최신 본문 결정과 맞지 않으며, 본문 전체 끝에 잘못 연결되어 있습니다.
    rationale: 각주는 ‘또는 그렇다면 무엇을’이라고 하나, 영어 감사 기록은 Et quid를 ‘And what’으로 확정하여 ‘then’의 보충을 배제했습니다. 따라서 이 각주는 본문 변이 또는 번역상 필요한 정보를 제공하지 않으며 삭제해야 합니다.
  - severity: low
