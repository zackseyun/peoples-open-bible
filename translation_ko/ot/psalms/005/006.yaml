  naturalness: 개정문은 현대 표준 한국어 합쇼체로 자연스럽게 읽히며, 히브리어의 시적 병렬을 두 문장으로 명료하게 살렸습니다.
  terminology: יְהוָה는 제공된 POB 방침과 일치하게 ‘야훼’로 옮겼습니다. אִישׁ의 남성 단수는 ‘사람’으로 자연스럽게 처리하되, ‘피를 흘리고 속이는’이라는 표현으로 ‘피 흘림과 속임수의 사람’이라는 히브리어 관용구의 의미를 보존했습니다. יְתָעֵב의 강한 혐오 의미는 ‘혐오하십니다’로 반영했습니다.
