  from: and while a place of repentance was still open to them did not understand but scorned it—for these it is necessary to know after death in torment.
  to: and while a place of repentance was still open to them, they did not understand but scorned it—these must know it after death in torment.
  rationale: The English draft lacks a subject for 'did not understand' (`intellexerunt`). Additionally, `hos oportet... cognoscere` uses the accusative `hos` as the subject of the infinitive ('these must know'), not as a dative ('for these it is necessary'). Finally, `cognoscere` requires an implied object in English ('know it') to complete the thought and connect back to the rejection described in the previous verses.
