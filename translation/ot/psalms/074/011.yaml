  from: Why do you hold back your hand[a], your right hand? Draw it out from your bosom and consume them.
  to: Why do you hold back your hand, your right hand? Draw it out from your bosom and consume them.[a]
  rationale: The proposed “from within your garment” is a possible interpretive explanation of חֵיק but weakens the source image of the bosom/fold; “finish them off” is materially more colloquial than the psalm’s register. The current main text preserves the compressed image naturally enough. Its note, however, belongs with the final imperative, not “hand.”
