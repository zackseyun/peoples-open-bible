base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/047.yaml
  text: Jesus said[1], "It is impossible for a person to mount two horses and to draw two bows. And it is impossible for a servant to serve two masters, or he will honor the one and insult the other. A person does not drink old wine and immediately desire to drink new wine. And they do not pour new wine into old wineskins, lest they burst. And they do not pour old wine into a new wineskin, lest it ruin it. They do not sew an old patch onto a festal garment[3][2], because a tear will result."
  footnotes:
  - marker: '1'
    text: 'The English singular/plural distinction reflects the Coptic pronouns: ⲛⲛⲟⲩⲡⲱϩ (''lest they [plural] burst'') versus ⲛⲉϥⲧⲉⲕⲁϥ (''lest it [singular] ruin it'').'
    reason: textual_variant
  - marker: '2'
    text: Another Thomasine inversion. The Synoptics state that *new* wine is put into *new* wineskins (Matt 9:17). Thomas adds the prohibition against putting *old* wine into a *new* wineskin.
    reason: cross_reference
  - marker: '3'
    text: Coptic ϣⲧⲏⲛ ⲛϣⲁⲓ (literally 'garment of a festival'). This functions as the equivalent of the 'new garment' in the Synoptic parallels, though Thomas uniquely reverses the parable by having an *old* patch sewn onto the *new* (festal) garment.
    reason: cultural_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「사람이 두 마리의 말을 타고 두 활을 동시에 당길 수는 없습니다. 또 종이 두 주인을 섬길 수는 없습니다. 그는 한 사람을 높이고 다른 사람을 모욕하게 될 것입니다. 사람은 묵은 포도주를 마시고서 곧바로 새 포도주를 마시고 싶어 하지 않습니다. 또 새 포도주를 묵은 가죽부대에 붓지 않습니다. 그렇게 하면 그것들이 터질 것이기 때문입니다.[1] 또 묵은 포도주를 새 가죽부대에 붓지도 않습니다. 그렇게 하면 그것을 망칠 것이기 때문입니다.[2] 사람은 묵은 헝겊 조각을 잔칫옷에 꿰매지 않습니다. 그러면 찢어짐이 생기기 때문입니다.[3]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 콥트어는 새 포도주를 묵은 가죽부대에 붓는 경우에 가죽부대들을 가리키는 복수형을 써서, ‘그것들이 터질 것’을 말합니다.
    reason: source_note
  - marker: '2'
    text: 토마스는 공관복음의 일반적인 표현과 달리, 묵은 포도주를 새 가죽부대에 붓는 것도 금합니다. 여기서는 단수형으로, 그것이 새 가죽부대를 망칠 것이라고 말합니다.
    reason: cross_reference
  - marker: '3'
    text: ϣⲧⲏⲛ ⲛϣⲁⲓ는 문자적으로 ‘잔치의 옷’입니다. 이 말은 공관복음의 ‘새 옷’에 대응하지만, 토마스는 묵은 헝겊 조각을 그 옷에 꿰매는 것으로 비유를 역전합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ⲙⲛϭⲟⲙ ⲛⲧⲉ-
  english_pob_choice: impossible
  chosen_korean: ~할 수는 없습니다
  alternatives_korean:
  - 불가능합니다
  - 할 수 없습니다
  lexicon: Crum 815b
  rationale: ⲙⲛϭⲟⲙ은 능력 부재를 나타내므로, 합쇼체에서는 단정적인 ‘불가능합니다’보다 자연스럽고 직접적인 ‘~할 수는 없습니다’로 옮겼습니다.
- source_word: ϫⲱⲗⲕ
  english_pob_choice: draw
  chosen_korean: 당기다
  alternatives_korean:
  - 끌다
  - 활을 당기다
  lexicon: Crum 763a
  rationale: 활(ⲡⲓⲧⲉ)과 결합할 때 ‘당기다’가 가장 정확하므로, 한국어 독자에게도 무리 없이 의미가 드러나도록 했습니다.
- source_word: ϣⲧⲏⲛ ⲛϣⲁⲓ
  english_pob_choice: festal garment
  chosen_korean: 잔칫옷
  alternatives_korean:
  - 축제의 옷
  - 새 옷
  lexicon: Crum 551a
  rationale: 직역하면 ‘잔치의 옷’이지만, 문맥상 Synoptic의 ‘새 옷’에 해당하는 Thomas의 고유 표현을 살리기 위해 ‘잔칫옷’으로 옮겼습니다.
- source_word: ⲁⲥⲕⲟⲥ
  english_pob_choice: wineskin
  chosen_korean: 가죽부대
  alternatives_korean:
  - 포도주 부대
  - 주머니
  lexicon: Greek loanword ἀσκός
  rationale: 그리스어 차용어 ἀσκός의 표준 의미를 반영해 ‘가죽부대’로 옮겼습니다. 한국어 교회어법의 ‘포도주 부대’보다 물질성을 더 분명히 드러냅니다.
- source_word: ⲥⲱⲏⲣⲡ
  english_pob_choice: drink wine
  chosen_korean: 포도주를 마시다
  alternatives_korean:
  - 포도주를 들이키다
  - 술을 마시다
  lexicon: Crum 530b
  rationale: 이 표현은 ‘포도주를 마시다’라는 뜻이므로, 포도주-새 포도주의 대조를 선명하게 유지하도록 직역에 가깝게 처리했습니다.
theological_decisions:
- issue: Thomas의 역전 구조 보존
  chosen_reading: ‘묵은 포도주를 새 가죽부대에 붓지 않습니다’와 ‘묵은 헝겊 조각을 새 잔칫옷에 꿰매지 않습니다’를 그대로 유지했습니다.
  alternative_readings:
  - 신약 공관복음과 맞추어 ‘새 포도주를 새 부대에’로 평준화
  - ‘새 헝겊 조각’을 ‘묵은 옷’에 꿰매는 형태로 조정
  rationale: 토마스는 공관복음의 비유를 일부러 뒤집고 있으므로, 이를 평준화하면 저자의 의도와 문맥상의 긴장을 지워버리게 됩니다.
  doctrine_reference: Thomasine inversion / Synoptic comparison
- issue: ‘한 사람을 높이고 다른 사람을 모욕하게 될 것입니다’의 대조 표현
  chosen_reading: ‘높이고’와 ‘모욕하게 될 것입니다’를 병치해 두 주인에 대한 충성 불가능성을 강하게 드러냈습니다.
  alternative_readings:
  - ‘사랑하고 미워하게 될 것입니다’
  - ‘기쁘게 하고 업신여기게 될 것입니다’
  rationale: 콥트어의 ϩⲩⲃⲣⲓⲍⲉ는 단순한 불쾌감보다 공개적 모욕에 가까우므로, 관계적 갈등을 약화시키지 않도록 ‘모욕하다’로 옮겼습니다.
  doctrine_reference: lexical sense of ϩⲩⲃⲣⲓⲍⲉ
