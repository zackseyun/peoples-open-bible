    prior_rendering: and your abominations will be within you
    new_rendering: and the consequences of your abominations will be in your midst
    rationale: In the surrounding recompense language, the offenses most plausibly stand for their consequences within the community; the serious alternative that the offenses themselves remain is preserved in a note.
