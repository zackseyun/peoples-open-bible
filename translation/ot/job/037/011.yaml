  meaning_decisions:
  - source_phrase: עָב ... עֲנַן
    prior_rendering: the thick cloud ... the cloud
    new_rendering: the thick clouds ... the clouds
    rationale: The singular cloud nouns describe clouds generically. English plurals convey that collective reference naturally and make the connection with the following verse clear.
  - source_phrase: עֲנַן אוֹרוֹ
    prior_rendering: the cloud of his light
    new_rendering: the clouds that carry his lightning
    rationale: The surrounding storm description, including the use of 'light' for lightning in verse 3, favors lightning here. The relative clause clarifies the compact relationship without changing the clouds into a location through which an independently stated lightning object is scattered.
