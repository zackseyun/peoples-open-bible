theological_decisions:
- issue: Context-sensitive reorientation terminology
  chosen_reading: Then he began to rebuke the cities where most of his mighty works had been done[a], because they did not reorient toward God.
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
