id: PSA.31.6
reference: Psalms 31:6
source:
  edition: WLC
  text: שָׂנֵ֗אתִי הַ/שֹּׁמְרִ֥ים הַבְלֵי שָׁ֑וְא וַ֝/אֲנִ֗י אֶל יְהוָ֥ה בָּטָֽחְתִּי־־׃
translation:
  text: I hate those who pay heed to worthless idols[a], but as for me, I trust in Yahweh.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “empty vanities.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  chosen: I hate
  alternatives:
  - I have hated
  - I hated
  lexicon: HALOT
  rationale: Qal perfect 1cs of שׂנא. In poetic discourse the perfect can express a present stance/resulting disposition, so 'I hate' reads naturally in English while preserving the psalmist's settled opposition.
- source_word: הַשֹּׁמְרִים
  chosen: those who regard
  alternatives:
  - those who keep
  - those who observe
  - those who regard
  lexicon: HALOT
  rationale: With הבלי שוא, שמר denotes giving heed or regard, rather than physical keeping; “regard” avoids the added force of “cling to.”
- source_word: הַבְלֵי שָׁוְא
  chosen: worthless idols
  alternatives:
  - vain idols
  - empty vanities
  - worthless things
  - false vanities
  lexicon: HALOT
  rationale: In the contrast with trusting Yahweh, the phrase plausibly denotes false objects of trust; the footnote preserves its literal imagery.
- source_word: וַאֲנִי
  chosen: but as for me
  alternatives:
  - but I
  - and I
  lexicon: HALOT
  rationale: The conjunction plus pronoun marks contrast with the previous clause. 'But as for me' brings out the emphatic contrast more clearly than a bare 'and I.'
- source_word: אֶל יְהוָה
  chosen: in Yahweh
  alternatives:
  - to the LORD
  - toward the LORD
  lexicon: HALOT
  rationale: Though the preposition is אֶל ('to/toward'), with בטח the idiomatic English expression is 'trust in.' The divine name follows the project's default rendering 'the LORD' for יְהוָה.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: בָּטָחְתִּי
  chosen: I trust
  alternatives:
  - I have trusted
  - I trusted
  lexicon: HALOT
  rationale: Qal perfect 1cs of בטח. In parallel with the first clause and in psalmic confession, the perfect expresses a settled present confidence. 'I trust' is the most natural English rendering here.
