  source_fidelity: 히브리어 본문은 에녹이 ‘흠 없는 사람으로 발견되었고’, 야훼와 동행했으며, ‘옮겨졌다’고 말합니다. 마지막 구문 אות דעת는 영어 감사본의 ‘example’보다 문자적으로는 ‘지식의 표징’에 가깝습니다. 그리스어 병행본문의 ‘회개의 본보기’는 본문 차이로서 각주에 보존하는 것이 적절합니다.
  naturalness: 초안의 ‘세대 또 세대’는 현대 한국어에서 부자연스럽습니다. ‘대대로’가 דור ודור의 반복·지속 의미를 자연스럽게 전달합니다. ‘흠이 없는 자로 밝혀졌고’도 가능하나, ‘흠 없는 사람으로 인정받았고’가 נמצא의 평가·판정을 더 자연스럽게 옮깁니다.
  terminology: יהוה는 초안의 프로젝트 용례를 따라 ‘야훼’로 유지합니다. תמים은 ‘흠 없는’, אות은 ‘표징’, דעת는 의미를 과도하게 해석하지 않고 ‘지식’으로 유지합니다.
  issues:
