  text: תְּמוֹתֵ֣ת רָשָׁ֣ע רָעָ֑ה וְ/שֹׂנְאֵ֖י צַדִּ֣יק יֶאְשָֽׁמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/022.yaml
  text: Yahweh redeems the life[a] of his servants, and none of those who take refuge in him will be held guilty[b].
  footnotes:
  - marker: a
    text: Or 'Calamity will slay the wicked.' The Hebrew רָעָה can mean 'evil,' 'harm,' or 'disaster/calamity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 자신의 종들의 생명을[a] 속량하시며, 그분께 피하는 사람은 아무도 유죄로 판정되지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영혼’. 히브리어 네페쉬(נֶפֶשׁ)는 여기서 살아 있는 존재 또는 생명을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죄책을 지지 않을 것입니다’ 또는 ‘정죄되지 않을 것입니다’. 히브리어 동사는 법정적 죄책 또는 유죄의 의미를 지닙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּמוֹתֵת / רָעָה
  english_pob_choice: Evil will put the wicked to death
  chosen_korean: 악이 악인을 죽이고
  alternatives_korean:
  - 재앙이 악인을 죽이고
  - 재난이 악인을 죽이고
  - 악이 악인에게 죽음을 가져오고
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 살려 단순히 ‘죽다’가 아니라 ‘죽이다’로 옮겼습니다. רָעָה는 문맥상 도덕적 악과 재앙/재난의 이중 가능성이 있어 ‘악’으로 두되, 영어 POB의 주석이 지시한 긴장을 유지했습니다.
- source_word: רָשָׁע
  english_pob_choice: the wicked
  chosen_korean: 악인
  alternatives_korean:
  - 악한 사람
  - 악한 자
  - 악한 이
  lexicon: HALOT
  rationale: 단수 형용사의 명사적 용법이므로 대표적 범주로서 ‘악인’이 가장 자연스럽고 간결합니다.
- source_word: שֹׂנְאֵי צַדִּיק
  english_pob_choice: those who hate the righteous
  chosen_korean: 의인을 미워하는 자들
  alternatives_korean:
  - 의를 미워하는 자들
  - 의로운 이를 미워하는 자들
  - 의인을 미워하는 사람들
  lexicon: HALOT
  rationale: 분사구를 관계절로 옮겨 지속적 성격을 드러냈고, צַדִּיק은 집합적/대표적 용법을 살려 ‘의인’으로 번역했습니다.
- source_word: יֶאְשָׁמוּ
  english_pob_choice: will be held guilty
  chosen_korean: 죄를 짓게 될 것입니다
  alternatives_korean:
  - 유죄 판결을 받게 될 것입니다
  - 죄책을 지게 될 것입니다
  - 유죄가 될 것입니다
  lexicon: HALOT
  rationale: אשם의 핵심은 단순한 처벌보다 ‘죄책/책임을 지다’에 있으므로, 한국어에서 법정적·도덕적 책임을 함께 전달할 수 있는 표현을 택했습니다. 다만 한국어 관용상 자연스러운 문장을 위해 ‘죄를 짓게 될 것입니다’로 옮겼습니다.
theological_decisions:
- issue: רָעָה의 의미를 ‘악’으로 둘지 ‘재앙/재난’으로 좁힐지
  chosen_reading: ‘악’으로 유지하되, 재앙/재난의 가능성은 주석으로 열어 둡니다.
  alternative_readings:
  - 재앙
  - 재난
  - 해악
  rationale: 시편의 병행과 의인화된 문맥에서 רָעָה는 파괴적 힘으로 기능하므로, 의미를 한쪽으로 고정하기보다 원문의 긴장을 보존하는 것이 좋습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
