  from: There they were in great fear[a], where there was no fear; for God scattered the bones of the one encamping against you. You put them to shame[b][c], for God rejected them.
  to: There they were terrified[a], though there was nothing to fear; for God scattered the bones of the one encamping against you[b]. You put them to shame[c], for God rejected them.
  rationale: “Were terrified” naturally represents the emphatic cognate construction פָּחֲדוּ פַחַד, and “though there was nothing to fear” clearly expresses the contrast with the absence of פחד. The revised placement and content of the notes accurately identify the feminine-singular suffix in חֹנָךְ and the subsequent masculine-singular address, without erasing the verse's abrupt shifts in person.
