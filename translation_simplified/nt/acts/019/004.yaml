translation:
  language: en
  text: Paul said, “John’s baptism centered on reorientation toward God[a]. He told the people to believe in the one coming after him—that is, in Jesus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: telling the people to believe
  simplified_phrase: He told the people to believe
  preserved_meaning: John’s message accompanied his baptizing and called the people to faith.
  reasoning_layer_used: POB lexical decision for λέγων and ἵνα πιστεύσωσιν
  rationale: A separate sentence replaces the participial clause with ordinary English.
translation_notes:
  risk_flags:
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
