  - 788
  validation: no_reference
translation:
  text: Yet although so many claims of motherly love drew the mother toward compassion, tortures of every kind could not turn her reason aside in the case of even one of her sons[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Greek 'not one of them' may instead refer to the many claims of motherly love.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  chosen: But even so
  alternatives:
  - Nevertheless
  - Yet still
  lexicon: LSJ
  rationale: Captures the adversative force with emphatic concession; idiomatic modern English while preserving the rhetorical turn.
- source_word: καίπερ
  chosen: although
  alternatives:
  - even though
  - despite the fact that
  lexicon: BDAG
  rationale: Standard concessive sense; 'although' is concise and natural in context.
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  chosen: so many claims of motherly love
  alternatives:
  - so many impulses concerning love for her children
  - so many considerations related to affection for her children
  lexicon: LSJ
  rationale: The genitive absolute introduces the many factors connected with φιλοτεκνία, affection for one's children. 'Claims of motherly love' conveys the pull exerted by maternal attachment without over-paraphrasing.
- source_word: φιλοτεκνίαν
  chosen: motherly love
  alternatives:
  - love for her children
  - maternal affection
  lexicon: LSJ
  rationale: Refers specifically to affection for one's children. 'Motherly love' is idiomatic here because the subject is explicitly the mother.
- source_word: εἰς συμπάθειαν ἑλκόντων
  chosen: were drawing ... toward sympathy
  alternatives:
  - were pulling ... into compassion
  - were attracting ... to fellow-feeling
  lexicon: BDAG
  rationale: Preserves the metaphor of being drawn/pulled and the emotional sense of συμπάθεια as sympathetic feeling.
- source_word: τὴν μητέρα
  chosen: the mother
  alternatives:
  - their mother
  lexicon: BDAG
  rationale: The Greek has the articular noun without possessive pronoun. 'The mother' preserves the formal style of the narrative.
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  chosen: by any one of them
  alternatives:
  - by none of them
  - on account of any of them
  lexicon: LSJ
  rationale: Expresses that not one of those appeals or factors succeeded. This fits the construction with ἴσχυσαν μετατρέψαι.
- source_word: τὸν λογισμὸν αὐτῆς
  chosen: her reason
  alternatives:
  - her resolve
  - her rational judgment
  - her mindset
  lexicon: BDAG
  rationale: In 4 Maccabees λογισμός is a key term for reason/rational control. 'Her reason' preserves the book's philosophical vocabulary better than the more interpretive 'resolve.'
- source_word: αἱ παντοίκιλοι βάσανοι
  chosen: the all-varied tortures
  alternatives:
  - the many-colored torments
  - the various tortures
  - the manifold torments
  lexicon: LSJ
  rationale: παντοίκιλοι intensifies variety in kind; 'all-varied' is slightly formal but preserves the rhetorical force. βάσανοι here are tortures, not merely trials.
- source_word: ἴσχυσαν μετατρέψαι
  chosen: were not able ... to turn aside
  alternatives:
  - did not prevail to change
  - could not turn
  - were unable to divert
  lexicon: BDAG
  rationale: Conveys both inability and attempted redirection. 'Turn aside' fits the moral-philosophical context of reason being deflected from its course.
