id: EXO.39.11
reference: Exodus 39:11
source:
  edition: WLC
  text: וְ/הַ/טּ֖וּר הַ/שֵּׁנִ֑י נֹ֥פֶךְ סַפִּ֖יר וְ/יָהֲלֹֽם׃
translation:
  text: The second row was turquoise, lapis lazuli[a], and diamond[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Traditionally “sapphire”; the ancient term probably refers to lapis lazuli rather than the stone now called sapphire.
    reason: alternative_reading
  - marker: b
    text: The gemstone identifications are uncertain; “diamond” may instead be jasper or jacinth, and “turquoise” may be emerald or carbuncle.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  chosen: and the ... row
  alternatives:
  - and the ... setting
  - and the ... line
  lexicon: HALOT
  rationale: טּוּר in the breastpiece-gem context refers to a row or tier of stones. 'Row' is the most natural English rendering here, and the conjunction וְ is carried as 'and.'
- source_word: הַ/שֵּׁנִי
  chosen: second
  alternatives:
  - the second
  lexicon: HALOT
  rationale: Ordinal adjective meaning 'second.' English idiom in this list naturally yields 'the second row.'
- source_word: נֹפֶךְ
  chosen: turquoise
  alternatives:
  - emerald
  - carbuncle
  lexicon: HALOT
  rationale: The precise identification of several breastpiece stones is uncertain. 'Turquoise' is a plausible modern equivalent used by many recent translations for נֹפֶךְ; traditional alternatives such as 'emerald' or 'carbuncle' are worth preserving in a footnote because the ancient gemstone term is not fully certain.
- source_word: סַפִּיר
  chosen: sapphire
  lexicon: HALOT
  rationale: Standard rendering for סַפִּיר. Although the ancient stone may not correspond exactly to modern sapphire in mineralogical terms, 'sapphire' is the established and most likely English equivalent.
- source_word: וְ/יָהֲלֹם
  chosen: and diamond
  alternatives:
  - and jacinth
  - and jasper
  lexicon: HALOT
  rationale: יָהֲלֹם is another uncertain gemstone identification. 'Diamond' is the common traditional rendering and fits the list structure; alternatives are preserved in a footnote because certainty is limited.
