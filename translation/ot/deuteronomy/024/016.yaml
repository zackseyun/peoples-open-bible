  from: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
  to: Parents[a] shall not be put to death for the sins of their children, nor children for the sins of their parents; each person may be put to death only for their own sin.
  rationale: The earlier decisions correctly restrict the verse to judicial execution rather than every consequence of sin. Although they favored masculine family wording, they also recognized the wider legal principle; I express that scope directly and preserve the literal family terms in a note.
