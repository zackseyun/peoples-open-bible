  from: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
  to: When Jehoram saw Jehu, he asked, “Do you come in peace, Jehu?” Jehu replied, “What peace can there be as long as your mother Jezebel’s idolatrous prostitution[a] and her many sorceries continue?”
