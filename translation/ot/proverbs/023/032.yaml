id: PRO.23.32
reference: Proverbs 23:32
source:
  edition: WLC
  text: אַ֭חֲרִית/וֹ כְּ/נָחָ֣שׁ יִשָּׁ֑ךְ וּֽ/כְ/צִפְעֹנִ֥י יַפְרִֽשׁ׃
translation:
  text: In the end it bites like a snake, and it stings[a] like a viper.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The final Hebrew verb is uncertain; alternatives include “strikes” and “spreads venom.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרִיתוֹ
  chosen: In the end
  alternatives:
  - Its end
  - Afterward
  lexicon: HALOT
  rationale: אַחֲרִית denotes the latter end, outcome, or final result. Given the preceding context about wine, English idiom is clearer with the adverbial phrase 'In the end' rather than the more wooden 'its end,' while preserving the sense of eventual outcome.
- source_word: כְּנָחָשׁ
  chosen: like a snake
  alternatives:
  - like a serpent
  lexicon: HALOT
  rationale: נָחָשׁ is the common term for snake/serpent. 'Snake' is more natural modern English; 'serpent' is possible but sounds more elevated and may import associations not required by the proverb.
- source_word: יִשָּׁךְ
  chosen: it bites
  alternatives:
  - it will bite
  lexicon: HALOT
  rationale: From נשׁך, 'to bite.' English present tense suits proverbial discourse, expressing a general truth. The subject is implicit from context (wine), so 'it bites' makes the clause complete in English.
- source_word: וּכְצִפְעֹנִי
  chosen: and like a viper
  alternatives:
  - and like an adder
  lexicon: HALOT
  rationale: צִפְעֹנִי refers to a venomous snake, commonly rendered 'viper' or 'adder.' 'Viper' is clearer and more current in modern English than 'adder.'
- source_word: יַפְרִשׁ
  chosen: it stings
  alternatives:
  - it strikes
  - it spreads venom
  lexicon: HALOT
  rationale: The verb is difficult and has been understood in context as the harmful action of a venomous snake. 'It stings' is the conventional and contextually fitting rendering in English, conveying the poisonous injury parallel to 'bites.' Alternatives such as 'strikes' or 'spreads venom' are possible but less idiomatic here.
