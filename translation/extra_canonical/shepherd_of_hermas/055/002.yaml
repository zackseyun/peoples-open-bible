translation:
  text: “Those sheep you saw not skipping but grazing in one place—these are the ones who have handed themselves over to luxuries and deceptions, yet they have not blasphemed the Lord at all. These, then, have been corrupted from the truth; in them there is hope of reorientation[a], by which they can live. Corruption, then, has hope of a certain renewal, but death has eternal destruction.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
