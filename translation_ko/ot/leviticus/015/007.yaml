base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
  footnotes:
  - marker: a
    text: Or 'the body of the man with the discharge.' The Hebrew literally says 'the flesh of the one with the discharge.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 유출병이 있는 사람의 몸에 닿으면 자기 옷을 빨고 물로 몸을 씻어야 하며[a], 저녁까지 부정합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유출이 있는 사람의 몸’을 뜻합니다. 히브리어는 문자적으로 ‘유출이 있는 자의 살’을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  english_pob_choice: Whoever touches
  chosen_korean: 누구든지 … 닿는 사람
  alternatives_korean:
  - 어떤 사람이 … 닿는 사람
  - 누구나 … 닿는 사람
  lexicon: HALOT
  rationale: 분사형이 법조문에서 일반인을 가리키는 기능을 하므로, 한국어에서도 보편 조건을 분명히 드러내는 표현을 택했습니다.
- source_word: בִּבְשַׂר
  english_pob_choice: the flesh of
  chosen_korean: 그 discharge가 있는 사람의 살
  alternatives_korean:
  - 그 discharge가 있는 사람의 몸
  - 그 유출이 있는 사람의 몸
  lexicon: HALOT
  rationale: בָּשָׂר의 직역인 ‘살’을 살리되, 법문 맥락에서 대상이 사람임을 분명히 했습니다. 영어 POB의 footnote가 지적하듯 ‘몸’도 가능하지만, 기본어인 ‘살’을 유지했습니다.
- source_word: יְכַבֵּס בְּגָדָיו
  english_pob_choice: shall wash his clothes
  chosen_korean: 자기 옷을 빨고
  alternatives_korean:
  - 자기 옷을 씻고
  - 자기 의복을 빨고
  lexicon: HALOT
  rationale: כִּבֵּס는 의복 세탁을 뜻하므로 ‘옷을 빨다’가 가장 자연스럽고 직접적입니다.
- source_word: וְרָחַץ בַּמַּיִם
  english_pob_choice: and bathe in water
  chosen_korean: 물로 몸을 씻어
  alternatives_korean:
  - 물로 목욕하여
  - 물에서 몸을 씻어
  lexicon: HALOT
  rationale: 라하츠는 몸을 씻는 행위이므로 한국어에서는 ‘물로 몸을 씻다’로 풀어, 의례적 정결 동작을 분명히 했습니다.
- source_word: וְטָמֵא
  english_pob_choice: and he shall be unclean
  chosen_korean: 부정할 것입니다
  alternatives_korean:
  - 부정하게 될 것입니다
  - 부정합니다
  lexicon: HALOT
  rationale: 레위기 정결법의 טָמֵא는 도덕적 죄책이 아니라 의례적 부정을 뜻하므로, ‘부정하다’ 계열로 옮겼습니다.
theological_decisions:
- issue: טָמֵא의 성격
  chosen_reading: 의례적 부정을 가리키는 표현으로 이해하고, 도덕적 죄악의 뉘앙스는 넣지 않았습니다.
  alternative_readings:
  - 더럽혀질 것입니다
  - 불결할 것입니다
  rationale: 이 문맥은 레위기 15장의 정결 규례에 속하므로, 접촉 자체를 죄로 만들지 않으면서도 상태 변화를 분명히 해야 합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
