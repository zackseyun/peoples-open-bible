  from: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
  to: So they summoned all the lords of the Philistines to meet with them and asked, “What shall we do with the ark of the God of Israel?” The lords replied, “Let the ark of the God of Israel be moved to Gath.” So they moved the ark of the God of Israel there.
