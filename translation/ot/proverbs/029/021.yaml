id: PRO.29.21
reference: Proverbs 29:21
source:
  edition: WLC
  text: מְפַנֵּ֣ק מִ/נֹּ֣עַר עַבְדּ֑/וֹ וְ֝/אַחֲרִית֗/וֹ יִהְיֶ֥ה מָנֽוֹן׃
translation:
  text: If a man pampers his slave from youth, the slave will become like a son[a] in the end.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The final Hebrew word, מָנוֹן (manon), is uncertain; other proposed meanings include 'insolent' and 'a source of trouble.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְפַנֵּק
  chosen: pampers
  alternatives:
  - indulges
  - spoils
  - coddles
  lexicon: HALOT
  rationale: The Piel participle of פנק conveys treating delicately or indulgently. 'Pampers' is concise, natural English and preserves the negative sense implied by the proverb better than the more neutral 'treats delicately.'
- source_word: מִנֹּעַר
  chosen: from youth
  alternatives:
  - from childhood
  - from his youth
  lexicon: HALOT
  rationale: The phrase marks the time from an early stage. 'From youth' is idiomatic and sufficiently literal; the possessive 'his' is not explicit in Hebrew and is unnecessary in English.
- source_word: עַבְדּוֹ
  chosen: his slave
  alternatives:
  - his servant
  lexicon: HALOT
  rationale: The proverb depends on the distinction between a household slave and a son; “slave” preserves that social and rhetorical contrast.
- source_word: וְאַחֲרִיתוֹ
  chosen: in the end
  alternatives:
  - afterward
  - at the end
  lexicon: HALOT
  rationale: אַחֲרִית denotes the latter end or outcome. 'In the end' communicates the proverb's focus on eventual result in readable modern English.
- source_word: יִהְיֶה
  chosen: will become
  alternatives:
  - will become
  - will be
  lexicon: HALOT
  rationale: The ordinary copular sense fits the slave as the understood subject and does not recast the clause as something the master “will have.”
- source_word: מָנוֹן
  chosen: like a son
  alternatives:
  - a son
  - one who acts like a son
  - insubordination
  - trouble
  lexicon: HALOT
  rationale: This presents a coherent traditional interpretation without claiming literal or legal sonship; because the hapax remains uncertain, competing negative senses are retained in the note.
