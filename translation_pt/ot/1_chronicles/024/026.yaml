  text: 'The sons of Merari: Mahli and Mushi. The sons of Jaaziah: his son.'
translation:
  language: pt
  text: 'Os filhos de Merari: Mali e Musi. Os filhos de Jaazias: seu filho.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é abrupto e pode refletir uma dificuldade textual. Algumas traduções entendem a expressão como o nome próprio “Beno”.
    reason: Sinaliza ao leitor a construção incomum e a alternativa textual legítima sem alterar silenciosamente o texto massorético.
lexical_decisions:
- source_word: בְּנֵי
  choice: filhos
  rationale: Mantém o sentido genealógico direto do hebraico nas duas ocorrências.
- source_word: מַחְלִי וּמוּשִׁי
  choice: Mali e Musi
  rationale: Transliteração portuguesa corrente dos nomes próprios.
- source_word: יַעֲזִיָּהוּ
  choice: Jaazias
  rationale: Forma portuguesa reconhecível do nome hebraico.
- source_word: בְנוֹ
  choice: seu filho
  rationale: Lê o texto consonantal com a vocalização massorética como substantivo com sufixo possessivo, em vez de tratá-lo como o nome próprio Beno.
theological_decisions:
- issue: Construção genealógica difícil no fim do versículo
  choice: seu filho
  alternative: Beno
  rationale: A vocalização massorética בְנוֹ significa literalmente “seu filho”. A formulação permanece abrupta, sem completar por conjectura a genealogia.
translation_notes:
  register: Português moderno, claro e digno, com estrutura genealógica concisa. A estranheza do hebraico foi preservada no texto e explicada em nota.
