id: JHN.3.23
reference: John 3:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: Now John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
  footnotes:
  - marker: a
    text: Or 'because much water was there'; literally, 'because many waters were there.'
    reason: lexical_alternative
  - marker: b
    text: The verb translated 'baptizing' can also be rendered 'immersing,' but 'baptizing' is retained here as the established term and does not by itself settle the question of mode.
    reason: lexical_alternative
translation:
  language: ko
  text: 요한도 살림 가까이에 있는 애논에서 세례를 베풀고 있었습니다[b]. 거기에는 물이 많았기 때문에[a] 사람들이 오고 있었고 세례를 받고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 복수형 ‘ὕδατα πολλὰ’로, 문자 그대로는 ‘많은 물들’입니다. 한국어에서는 통사상 자연스러운 ‘물이 많다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 동사 βαπτίζω는 ‘침수하다/침수되다’로도 번역될 수 있으나, 이 번역에서는 전통적으로 확립된 용어인 ‘세례’를 사용했습니다. 이 본문만으로는 세례의 방식을 단정할 수 없습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτίζων
  english_pob_choice: was baptizing
  chosen_korean: 세례를 베풀고 있었습니다
  alternatives_korean:
  - 침수시키고 있었습니다
  - 침례를 행하고 있었습니다
  lexicon: BDAG
  rationale: 그리스어 현재 분사 + ἦν의 반복적·진행적 의미를 한국어의 '…고 있었습니다'로 표현했습니다. 영어 POB가 'baptizing'을 택한 것과 같이 본문이 종교적 용어로 기능하므로, 한국어도 확립된 용어 '세례'로 옮겨 침수 방식(모드)을 단정하지 않았습니다.
- source_word: ἐν Αἰνὼν
  english_pob_choice: at Aenon
  chosen_korean: 아이논
  alternatives_korean:
  - 애논
  - 아인논
  lexicon: BDAG
  rationale: 고유지명은 외래어 표기법에 따라 음역했습니다. 현대 한국어 독자에게 읽기 쉬운 표기를 선택했으며(아이논), 기존 성서 전통(애논)도 가능한 대안으로 남깁니다.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  english_pob_choice: because there were many waters there
  chosen_korean: 거기에는 물이 많았기 때문에
  alternatives_korean:
  - 거기에는 많은 물이 있었기 때문에
  - 거기에는 물이 풍부했기 때문에
  lexicon: BDAG
  rationale: 원문은 문자 그대로 복수형 '많은 물들(ὕδατα πολλὰ)'이지만, 한국어는 통사적으로 단수형 표현('물이 많다')로 자연스럽게 옮깁니다. 복수형 원어를 그대로 살릴지에 관한 선택은 각주로 남겼습니다.
- source_word: παρεγίνοντο καὶ ἐβαπτίζοντο
  english_pob_choice: people were coming and being baptized
  chosen_korean: 사람들이 와서 세례를 받고 있었습니다
  alternatives_korean:
  - 사람들이 도착하여 세례를 받았습니다
  - 사람들이 계속 와서 세례를 받았습니다
  lexicon: BDAG
  rationale: 두 동사의 미완료상(imperfect)이 반복적·지속적 사건을 가리키므로 한국어에서는 '와서 … 받고 있었습니다'로 그 지속성을 전달했습니다.
theological_decisions:
- issue: Rendering βαπτίζω
  chosen_reading: 세례를 베풀다 / 세례를 받다 (baptize / be baptized)
  alternative_readings:
  - 침수하다 / 침수되다 (immerse / be immersed)
  rationale: βαπτίζω는 물에 잠그는 의미를 품을 수 있으나, 신약담론에서 종교적 전문어로 기능합니다. 영어 POB가 'baptizing'을 유지한 판단을 따랐으며, 한국어도 전통적인 번역어 '세례'를 사용해 주제어의 일관성을 지키되, 방식 문제는 각주로 표기했습니다.
  doctrine_reference: 'Translation philosophy: do not advocate a denominational distinctive unless the Greek unambiguously supports one reading over another.'
