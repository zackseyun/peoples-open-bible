id: JOB.36.25
reference: Job 36:25
source:
  edition: WLC
  text: כָּל אָדָ֥ם חָֽזוּ ב֑/וֹ אֱ֝נ֗וֹשׁ יַבִּ֥יט מֵ/רָחֽוֹק־־׃
translation:
  text: Everyone has seen it[a]; a mortal gazes from afar.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “has seen him”; the Hebrew pronoun may refer to God rather than to his work in the preceding verse.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל אָדָם
  chosen: Everyone
  alternatives:
  - Every man
  - All humanity
  lexicon: HALOT
  rationale: Natural distributive English for a comprehensive generic human expression.
- source_word: חָזוּ
  chosen: has seen
  alternatives:
  - have seen
  - has beheld
  lexicon: HALOT
  rationale: Directly renders the verb without importing a stronger contemplative sense.
- source_word: בוֹ
  chosen: it
  alternatives:
  - him
  - this
  lexicon: HALOT
  rationale: The pronominal suffix is masculine singular, but in context it most naturally refers to God's work/deed just mentioned rather than to a male person. English 'it' best reflects that likely impersonal antecedent without over-interpreting. 'Him' is grammatically possible but contextually less likely here.
- source_word: אֱנוֹשׁ
  chosen: a mortal
  alternatives:
  - a mortal
  - humanity
  lexicon: HALOT
  rationale: Preserves the singular poetic form and the term’s mortal-human nuance.
- source_word: יַבִּיט
  chosen: gazes
  alternatives:
  - looks
  - beholds
  lexicon: HALOT
  rationale: The Hiphil of נבט means to look, regard, or gaze. 'Gazes' conveys sustained looking and fits the poetic tone. 'Looks' is possible but less vivid; 'beholds' is more archaic than desired.
- source_word: מֵרָחוֹק
  chosen: from afar
  alternatives:
  - from far away
  - from a distance
  lexicon: HALOT
  rationale: מִן + רָחוֹק denotes distance. 'From afar' is concise, poetic, and natural in English, fitting the verse's elevated style.
