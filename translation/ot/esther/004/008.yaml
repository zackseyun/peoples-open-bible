id: EST.4.8
reference: Esther 4:8
source:
  edition: WLC
  text: וְ/אֶת פַּתְשֶׁ֣גֶן כְּתָֽב הַ֠/דָּת אֲשֶׁר נִתַּ֨ן בְּ/שׁוּשָׁ֤ן לְ/הַשְׁמִידָ/ם֙ נָ֣תַן ל֔/וֹ לְ/הַרְא֥וֹת אֶת אֶסְתֵּ֖ר וּ/לְ/הַגִּ֣יד לָ֑/הּ וּ/לְ/צַוּ֣וֹת עָלֶ֗י/הָ לָ/ב֨וֹא אֶל הַ/מֶּ֧לֶךְ לְ/הִֽתְחַנֶּן ל֛/וֹ וּ/לְ/בַקֵּ֥שׁ מִ/לְּ/פָנָ֖י/ו עַל עַמָּֽ/הּ־־־־־־־׃
translation:
  text: He also gave him a copy of the written decree issued in Susa for their destruction, to show it to Esther and explain it to her, and to charge her to go to the king, implore his favor, and plead before him on behalf of her people.
  philosophy: dynamic
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב
  chosen: a copy of the written decree
  alternatives:
  - the text of the document
  - a copy of the edict
  lexicon: HALOT
  rationale: The Persian loanword refers to an official document or its copy. The main line uses 'copy' and documents the range in a note.
- source_word: הַדָּת
  chosen: decree
  alternatives:
  - law
  - edict
  lexicon: HALOT
  rationale: In Esther, דָּת often denotes an official royal regulation or decree in the Persian court setting. 'Decree' fits the immediate context of a promulgated order better than the broader 'law'.
- source_word: נִתַּן
  chosen: issued
  alternatives:
  - given
  - published
  lexicon: HALOT
  rationale: In this administrative setting the passive describes the promulgation of the decree. English does not require the earlier pluperfect here.
- source_word: בְּשׁוּשָׁן
  chosen: in Susa
  alternatives:
  - at Susa
  lexicon: HALOT
  rationale: Standard English rendering of the place name; 'in Susa' is the natural locative expression.
- source_word: לְהַשְׁמִידָם
  chosen: for their destruction
  alternatives:
  - to destroy them
  - for destroying them
  lexicon: HALOT
  rationale: The infinitive with pronominal suffix expresses the purpose/content of the decree. 'For their destruction' reads smoothly in English while preserving the lethal intent of the edict.
- source_word: נָתַן לוֹ
  chosen: He also gave him
  alternatives:
  - And he gave him
  - He gave it to him
  lexicon: HALOT
  rationale: The second נָתַן resumes Hathach's receipt of the document. 'Also' captures the connective force in context, linking this action with the previous verse.
- source_word: לְהַרְאוֹת אֶת אֶסְתֵּר
  chosen: to show it to Esther
  alternatives:
  - to show Esther
  lexicon: HALOT
  rationale: English supplies the decree as the object of 'show' for clarity.
- source_word: וּלְהַגִּיד לָהּ
  chosen: and explain it to her
  alternatives:
  - and tell her
  - and inform her
  lexicon: HALOT
  rationale: In context Mordecai is to make the written order known to Esther. 'Explain it to her' supplies the document naturally without adding a new proposition.
- source_word: וּלְצַוּוֹת עָלֶיהָ
  chosen: and to charge her
  alternatives:
  - and to command her
  - and to instruct her
  lexicon: HALOT
  rationale: צוה is stronger than simple instruction here. 'Charge' preserves the urgent directive without treating Mordecai as a sovereign.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ
  chosen: to go to the king
  alternatives:
  - to go in to the king
  - to enter before the king
  lexicon: HALOT
  rationale: The surrounding court context supplies the dangerous access setting; 'go to the king' is clear modern English.
- source_word: לְהִתְחַנֶּן לוֹ
  chosen: to implore his favor
  alternatives:
  - to plead with him
  - to beg him for favor
  lexicon: HALOT
  rationale: The reflexive stem of חנן denotes earnest supplication for favor. The chosen rendering carries both the urgency and the favor sense.
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו
  chosen: and plead before him
  alternatives:
  - and request from him
  - and seek from before him
  lexicon: HALOT
  rationale: The source's courtly idiom describes making a petition in the king's presence. 'Plead before him' preserves that setting in natural English.
- source_word: עַל עַמָּהּ
  chosen: on behalf of her people
  alternatives:
  - concerning her people
  - for her people
  lexicon: HALOT
  rationale: In the petition context the preposition expresses advocacy on the people's behalf.
