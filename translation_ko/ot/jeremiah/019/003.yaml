base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/003.yaml
  text: 'And say, ‘Hear the word of the LORD, O kings of Judah and inhabitants of Jerusalem. Thus says the LORD of hosts, the God of Israel: Behold, I am bringing disaster on this place, at which everyone who hears of it—his ears will tingle.’'
translation:
  language: ko
  text: 그리고 말하십시오. “유다 왕들과 예루살렘 주민들아, 야훼의 말씀을 들으십시오. 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 보십시오, 내가 이곳에 재앙을 내릴 것입니다. 그것을 듣는 모든 사람의 귀가 울릴 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתָּ / 'And say'
  english_pob_choice: And say
  chosen_korean: 그리고 말하십시오
  alternatives_korean:
  - 또 말하십시오
  - 말하십시오
  lexicon: אמַר
  rationale: 명령형을 살리되, 뒤따르는 예언적 선언을 자연스럽게 이끄는 공손한 현대어로 옮겼습니다.
- source_word: יְהוָה / יְהוָה צְבָאוֹת
  english_pob_choice: the LORD / the LORD of hosts
  chosen_korean: 야훼 / 만군의 야훼
  alternatives_korean:
  - 여호와 / 만군의 여호와
  - 주 / 만군의 주
  lexicon: יהוה, צבאות
  rationale: 본문의 신명과 군대의 호칭을 소스 직결형으로 유지해, 평이한 ‘주’보다 고유한 언약명과 위엄을 분명히 드러냈습니다.
- source_word: רָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 화
  - 해
  lexicon: רעה
  rationale: 문맥상 일반적인 불운이 아니라 심판으로 임하는 파국을 가리키므로 ‘재앙’이 가장 직접적입니다.
- source_word: תִּצַּ֥לְנָה אָזְנָיו / 'his ears will tingle'
  english_pob_choice: his ears will tingle
  chosen_korean: 그 귀가 울릴 것입니다
  alternatives_korean:
  - 그의 귀가 먹먹해질 것입니다
  - 귀가 울릴 것입니다
  lexicon: צלל
  rationale: 관용적 표현을 한국어 관용으로 살리되, 개인화된 반응을 유지하려고 ‘그 귀가’로 옮겼습니다.
theological_decisions:
- issue: 예언 서두의 발화 대상과 공손도
  chosen_reading: 예언자에게 주어진 명령형을 ‘말하십시오’로, 하나님의 직접 발화는 존칭형으로 유지했습니다.
  alternative_readings:
  - 직설적인 명령형 ‘말하여라’
  - 전체를 평서형으로 완화
  rationale: 본문은 대언 명령과 하나님의 선언이 연속되므로, 한국어에서도 발화 층위를 구분해 예언적 권위를 보존하는 것이 적절합니다.
  doctrine_reference: 예언 발화의 매개성과 신적 권위 표현
