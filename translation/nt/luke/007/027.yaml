  from: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
  to: 'This is the one about whom it is written: ‘Behold, I am sending my messenger ahead of you; he will prepare your way before you[a].’'
