  category: meaning_retranslation
  from: And he himself and his people encamped opposite them; and when he saw the people afraid to cross the wadi[a], he crossed first, and the men saw him and crossed after him.
  to: John and his troops took up positions facing the enemy. When he saw that his men were afraid to cross the stream, he crossed first. His men saw him and crossed after him.
  rationale: The lexical rationale mistakenly attributes the leading action to Simon, although the chapter’s succession scene and verse 9 point to John. I preserve the earlier distinction between fear and moral cowardice, while clarifying the commander and the troops’ deployment.
