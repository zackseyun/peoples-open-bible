  rationale: 주어진 히브리어 본문과 영어 POB 감사 기록에 맞추어 절 전체를 새로 번역했습니다. 문맥상 단수 주어 ‘그는’을 채택하되, 전반의 2인칭 단수 형태와 후반의 3인칭 복수 형태 사이의 불일치를 주석에서 명시하여 논쟁 가능한 원문 특징을 평탄화하지 않았습니다. ‘영원토록 빛을 보지 못할 것입니다’는 부정문과 עד נצח의 영속성, 그리고 אור의 시적 표현을 함께 보존합니다.
