  meaning: After staying many more days, Paul said farewell to the Christian community and departed for Syria with Priscilla and Aquila, having his hair cut at Cenchreae before sailing because he was under a vow.
  meaning_decisions:
  - source_phrase: τοῖς ἀδελφοῖς
    prior_rendering: the brothers
    new_rendering: the brothers and sisters
    rationale: The expression addresses the Christian community, not exclusively its male members; the new wording carries that inclusive sense while retaining the familial language.
  - source_phrase: ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
    prior_rendering: sailed away for Syria, and with him were Priscilla and Aquila
    new_rendering: set sail for Syria with Priscilla and Aquila
    rationale: The Greek identifies his traveling companions; a single natural English clause conveys that relationship without the awkward additional clause.
  - source_phrase: κειράμενος ἐν Κεγχρεαῖς τὴν κεφαλήν
    prior_rendering: In Cenchreae he had his head shaved
    new_rendering: Before sailing, Paul[a] had his hair cut at Cenchreae
    rationale: The verb denotes cutting or shearing and does not require complete shaving. The participle presents the haircut as preceding his departure, and naming Paul makes the most natural grammatical referent clear while preserving the serious alternative in a note.
  - source_phrase: εἶχεν γὰρ εὐχήν
    prior_rendering: for he had a vow
    new_rendering: for he was under a vow
    rationale: The expression describes an ongoing obligation arising from a vow, not merely possession of one; it does not identify the vow or explicitly say that the haircut completed it.
  footnote_kinds:
    a: alternative_meaning
  history_weighed: There is no maintainer revision; the earlier review supports smoothing the companion clause, and the lexical record favors “under a vow” despite inconsistent later records. I retained the generic vow and Paul as the most natural subject, but declined the earlier inference of complete shaving because the Greek does not require it.
