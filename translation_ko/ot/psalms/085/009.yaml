- from: 제가 들을 것은 하나님 야훼께서 무슨 말씀을 하시는지입니다[a]. 그분은 자신의 백성과 자기에게 신실한 이들에게 평강을 말씀하실 것이니, 그러나 그들이 어리석음으로 돌아가지 않게 하십시오[b].
  to: 참으로 그분의 구원은 그분을 경외하는 이들에게 가까이 있습니다. 영광이 우리 땅에 머물도록 하려는 것입니다[a].
