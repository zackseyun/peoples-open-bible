id: JOB.12.23
reference: Job 12:23
source:
  edition: WLC
  text: מַשְׂגִּ֣יא לַ֭/גּוֹיִם וַֽ/יְאַבְּדֵ֑/ם שֹׁטֵ֥חַ לַ֝/גּוֹיִ֗ם וַ/יַּנְחֵֽ/ם׃
translation:
  text: He makes nations great and destroys them; he enlarges nations and leads them away[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “leads them” or “guides them”; the Hebrew does not specify a destination.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂגִּיא
  chosen: makes great
  alternatives:
  - magnifies
  - increases
  - makes prosper
  lexicon: HALOT
  rationale: The Hiphil participle of שׂגא conveys causing to become great or increasing. 'Makes great' is natural English and preserves the causative sense without over-specifying prosperity.
- source_word: לַגּוֹיִם
  chosen: nations
  alternatives:
  - peoples
  - Gentile nations
  lexicon: HALOT
  rationale: גּוֹיִם here refers broadly to political peoples or nations, not specifically non-Israelites in contrast to Israel. 'Nations' is the standard contextual rendering.
- source_word: וַיְאַבְּדֵם
  chosen: he destroys them
  alternatives:
  - he causes them to perish
  - he wipes them out
  lexicon: HALOT
  rationale: From אבד in the Hiphil/Qal causative sense of causing to perish or destroying. 'Destroys them' is concise and fits the parallelism with making nations great.
- source_word: שֹׁטֵחַ
  chosen: spreads nations out
  alternatives:
  - enlarges
  - extends
  - scatters
  lexicon: HALOT
  rationale: שטח denotes spreading out or extending. This translation retains its spatial image without specifying territorial mechanism.
- source_word: וַיַּנְחֵם
  chosen: leads them
  alternatives:
  - he guides them
  - he leads them
  - he carries them off
  lexicon: HALOT
  rationale: The Hiphil of נחה means lead or guide; the Hebrew supplies no “away.”
