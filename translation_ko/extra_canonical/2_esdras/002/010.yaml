base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/010.yaml
  text: 'Thus says the Lord to Ezra: Announce to my people that I will give them the kingdom of Jerusalem, which I was going to give to Israel.'
translation:
  language: ko
  text: “주께서 에스라에게 이렇게 말씀하십니다. ‘내 백성에게 알리십시오. 내가 그들에게 예루살렘의 왕국을 주겠습니다. 그것은 내가 이스라엘에게 주려고 했던 왕국입니다.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dicit dominus ad Ezram
  english_pob_choice: Thus says the Lord to Ezra
  chosen_korean: “주께서 에스라에게 이렇게 말씀하십니다”
  alternatives_korean:
  - “주님께서 에스라에게 말씀하십니다”
  - “주께서 에즈라에게 이렇게 말씀하십니다”
  lexicon: κύριος / dominus
  rationale: 라틴어 dominus는 문맥상 하나님을 가리키므로 ‘주께서’로 옮기고, 직접 화법 도입의 자연스러운 현대 문체를 살렸습니다.
- source_word: adnuntia populo meo
  english_pob_choice: Announce to my people
  chosen_korean: “내 백성에게 알리십시오”
  alternatives_korean:
  - “내 백성에게 선포하십시오”
  - '“내 백성에게 알리십시오: ...”'
  lexicon: adnuntia
  rationale: adnuntia는 단순 전달보다 공적 통지를 뜻하므로 ‘알리다’보다 다소 강한 ‘알리십시오’로 옮겨, 명령형의 지시성을 유지했습니다.
- source_word: regnum Hierusalem
  english_pob_choice: the kingdom of Jerusalem
  chosen_korean: “예루살렘의 나라”
  alternatives_korean:
  - “예루살렘 왕국”
  - “예루살렘의 왕국”
  lexicon: regnum
  rationale: regnum은 통치 영역/왕권을 가리키지만, 영어 POB의 ‘kingdom of Jerusalem’을 따라 ‘예루살렘의 나라’로 자연스럽게 옮겼습니다.
- source_word: quod daturus eram Israel
  english_pob_choice: which I was going to give to Israel
  chosen_korean: “그것은 본래 이스라엘에게 주려고 하던 나라입니다”
  alternatives_korean:
  - “내가 이스라엘에게 주려 했던 것입니다”
  - “내가 이스라엘에게 주려고 했던 나라입니다”
  lexicon: daturus eram
  rationale: 미완료적 미래의도(daturus eram)를 ‘주려고 하던’으로 옮겨, 단순 과거가 아니라 예정되었으나 여기서는 예루살렘으로 전환되는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 이스라엘에게 주려던 것이 예루살렘의 나라로 언표되는 점
  chosen_reading: 원문과 영어 POB를 따라 ‘본래 이스라엘에게 주려고 하던’으로 유지해, 약속의 대상이 예루살렘의 나라로 재지정되는 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - “이스라엘에게 주기로 했던”처럼 단순화
  - “이스라엘 대신” 같은 해석적 보완
  rationale: 본문은 약속의 연속성과 전환을 함께 말하므로, 평탄화하지 않고 대상의 이동을 보존하는 것이 소스 충실합니다.
  doctrine_reference: 약속-성취, 선택/재지정의 서술적 긴장
