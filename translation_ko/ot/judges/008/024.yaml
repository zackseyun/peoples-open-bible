  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: ko
  text: 기드온이 그들에게 말했습니다. “한 가지 청이 있습니다. 각 사람은 자기 전리품에서 귀고리 하나를 제게 주십시오.” 그들이 이스마엘 사람들이어서 금 귀고리를 가지고 있었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  english_pob_choice: Let me ask one request of you
  chosen_korean: 한 가지 청을 드리겠습니다
  alternatives_korean:
  - 한 가지 부탁을 드리겠습니다
  - 한 가지 요청을 드리겠습니다
  lexicon: שאול/שאלה
  rationale: 히브리어 반복 구조는 직역보다 ‘청’으로 자연스럽게 살리되, 화자의 정중한 청유를 유지했습니다.
- source_word: אִישׁ נֶזֶם שְׁלָלוֹ
  english_pob_choice: each man, give me an earring from his spoil
  chosen_korean: 너희는 각자 자기 전리품에서 귀고리 하나씩을 나에게 주십시오
  alternatives_korean:
  - 각 사람은 자기 전리품에서 귀고리 하나를 나에게 주십시오
  - 각자 전리품에서 귀고리 하나씩을 내게 주십시오
  lexicon: איש / נזם / שלל
  rationale: אִישׁ은 ‘각 사람/각자’로, נֶזֶם은 문맥상 장신구인 ‘귀고리’로, שְׁלָל은 전투 전리품인 ‘전리품’으로 옮겼습니다.
- source_word: נִזְמֵי זָהָב
  english_pob_choice: gold earrings
  chosen_korean: 금 귀고리
  alternatives_korean:
  - 금으로 된 귀고리
  - 황금 귀고리
  lexicon: נזם + זהב
  rationale: 소유품의 재질을 간결하게 드러내는 기본 한국어 표현을 택했습니다.
- source_word: כִּי יִשְׁמְעֵאלִים הֵם
  english_pob_choice: because they were Ishmaelites
  chosen_korean: 그들은 이스마엘 사람들입니다
  alternatives_korean:
  - 그들이 이스마엘 사람들이었기 때문입니다
  - 그들은 이스마엘 족속이기 때문입니다
  lexicon: ישמעאלים
  rationale: 이스마엘의 후손을 뜻하는 명칭은 한국어 성서 문맥에서 통용되는 ‘이스마엘 사람들’로 옮겼습니다.
