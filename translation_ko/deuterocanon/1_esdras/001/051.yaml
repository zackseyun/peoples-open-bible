base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/051.yaml
  text: But he handed everything over into their hands. And after taking all the holy vessels of the Lord, the great and the small, and the chests of the Lord and the royal storehouses, they carried them away to Babylon.
translation:
  language: ko
  text: 그러나 그는 모든 것을 그들의 손에 넘겨주었습니다. 그들은 주님의 모든 거룩한 기물, 곧 큰 것과 작은 것, 주님의 상자들과 왕실의 보관품들을 가져다가 바빌론으로 실어 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέδωκεν εἰς τὰς χεῖρας αὐτῶν
  english_pob_choice: he handed everything over into their hands
  chosen_korean: 모든 것을 그들의 손에 넘겨주었습니다
  alternatives_korean:
  - 그들의 손에 맡겼습니다
  - 그들의 손에 내주었습니다
  lexicon: παραδίδωμι
  rationale: 단순한 ‘전달’이 아니라 상대의 지배 아래 넘겨주는 뉘앙스를 살려 ‘넘겨주었습니다’로 옮겼습니다.
- source_word: τὰ ἱερὰ σκεύη
  english_pob_choice: the holy vessels
  chosen_korean: 거룩한 기물들
  alternatives_korean:
  - 성스러운 기물들
  - 거룩한 그릇들
  lexicon: σκεῦος
  rationale: σκεῦος는 일반적 ‘그릇’보다 성전 기구 전반을 가리킬 수 있어, 문맥을 살려 ‘기물들’로 옮겼습니다.
- source_word: τὰς κιβωτοὺς τοῦ κυρίου
  english_pob_choice: the chests of the Lord
  chosen_korean: 주님의 궤들
  alternatives_korean:
  - 주님의 상자들
  - 주님의 함들
  lexicon: κιβωτός
  rationale: POB의 ‘chests’를 직역하되, 성전 관련 맥락에서 단순 상자보다 더 격식을 갖는 ‘궤들’이 원문 범위를 잘 드러냅니다.
- source_word: τὰς βασιλικὰς ἀποθήκας
  english_pob_choice: the royal storehouses
  chosen_korean: 왕실 창고들
  alternatives_korean:
  - 왕의 저장고들
  - 왕실 곳간들
  lexicon: ἀποθήκη
  rationale: ἀποθήκη의 저장·보관 장소 의미를 살려, 현대 한국어에서 자연스러운 ‘창고들’로 옮겼습니다.
theological_decisions:
- issue: 주님의 거룩한 기물과 왕실 소유물의 병렬 관계
  chosen_reading: 성전의 거룩한 기물들과 왕실 창고들이 함께 약탈되어 바빌론으로 옮겨졌다고 직설적으로 표현했습니다.
  alternative_readings:
  - ‘보관소’처럼 완곡하게 옮기는 방식
  - 성전 물품만 강조하고 왕실 창고는 약화시키는 방식
  rationale: 원문은 성전과 왕실의 소유가 함께 이전되었음을 나열하므로, 약탈적 이동의 강도를 약화하지 않도록 그대로 유지했습니다.
  doctrine_reference: 본문 서술의 역사적-서사적 사실성
