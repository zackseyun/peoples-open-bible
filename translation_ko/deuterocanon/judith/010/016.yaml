  text: But if you stand before him, do not be afraid in your heart; instead, report according to your words, and he will treat you well.
translation:
  language: ko
  text: 그러나 그 앞에 서게 되면, 마음속으로 두려워하지 마십시오. 당신이 말한 대로[a] 알리십시오. 그러면 그가 당신을 잘 대해 줄 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “당신의 말들에 따라”입니다.
    reason: κατὰ τὰ ῥήματά σου의 복수형과 직역적 표현을 밝혀 줍니다.
lexical_decisions:
- source_word: ἀνάγγειλον
  english_pob_choice: report
  chosen_korean: 전하라
  alternatives_korean:
  - 보고하라
  - 말하라
  - 알리라
  lexicon: ἀναγγέλλω
  rationale: EN POB가 ‘report’를 채택한 것은 단순 발화보다 상대에게 상황을 전달하는 행위를 드러내기 때문이며, 한국어에서는 공손한 명령형으로 ‘전하라’가 가장 자연스럽고 그 뉘앙스를 살립니다.
- source_word: κατὰ τὰ ῥήματά σου
  english_pob_choice: according to your words
  chosen_korean: 네 말대로
  alternatives_korean:
  - 네 말에 따라
  - 네가 한 말에 따라
  - 네 말에 맞게
  lexicon: κατά + ῥήματα
  rationale: 직역보다 ‘네 말대로’가 본문이 요구하는 기준 준수의 의미를 간결하게 전달하며, 한국어에서도 자연스럽게 ‘네가 말한 바에 따라’라는 뜻을 유지합니다.
- source_word: εὖ σε ποιήσει
  english_pob_choice: he will treat you well
  chosen_korean: 그가 너를 잘 대해 줄 것입니다
  alternatives_korean:
  - 그가 너에게 호의를 베풀 것입니다
  - 그가 너를 좋게 여겨 줄 것입니다
  - 그가 너를 잘 처우할 것입니다
  lexicon: εὖ ποιέω
  rationale: εὖ ποιέω는 단순한 ‘좋게 하다’보다 상대를 호의적으로 대우하는 뜻이므로, 한국어에서는 관계적 뉘앙스를 살린 ‘잘 대해 주다’가 적절합니다.
theological_decisions:
- issue: 두려움의 대상과 내적 상태 표현
  chosen_reading: “마음으로 두려워하지 말고”로 옮겨, 외적 상황보다 내적 반응을 금하는 본문의 초점을 유지했습니다.
  alternative_readings:
  - “마음에 두려워하지 말고”
  - “마음속으로 두려워하지 말고”
  rationale: τῇ καρδίᾳ σου는 감정의 자리인 ‘마음’을 가리키므로, 한국어에서도 행위보다 내적 동요를 직접 금하는 표현이 본문의 권면을 더 정확히 드러냅니다.
  doctrine_reference: 성경의 권면 문맥에서 두려움은 내면의 신뢰 문제로 제시됩니다.
