  from: And if this is heard by the governor, we will persuade him and keep you out of trouble.
  to: And if this comes to a hearing before the governor, we will persuade him and keep you out of trouble.
  rationale: The preposition ἐπί with the genitive of a magistrate (ἐπὶ τοῦ ἡγεμόνος) carries a judicial nuance, meaning 'before' or 'in the presence of' (as in an official hearing), rather than simple agency ('by', which would typically be ὑπό). BDAG explicitly glosses this exact phrase (under ἐπί 1.a.γ and ἀκούω) as 'if this comes to a hearing before the governor.' Translating it as 'heard by' reduces the phrase to mere awareness and misses the formal legal threat the soldiers are facing.
