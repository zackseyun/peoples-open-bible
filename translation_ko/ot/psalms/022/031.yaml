  text: A seed will serve him; it will be proclaimed about the Lord to the generation.
translation:
  language: ko
  text: 그들이 와서 아직 태어날 백성에게 그분의 의[a]를 선포할 것입니다. 그분께서 이루셨음을[c] 말할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그분의 정의”. 히브리어는 의로움 일반뿐 아니라 의롭고 구원하는 행동을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “태어날 백성에게”. 또는 “태어날 백성 곧, 그분께서 이루셨음을 [말할 것입니다]”로 연결할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그분께서 이루셨기 때문에”. 마지막 히브리어 절은 짧으며, 선포의 내용 또는 선포의 이유로 이해될 수 있습니다. ‘이루셨다’의 목적어는 원문에 명시되어 있지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זֶ֥רַע
  english_pob_choice: A seed
  chosen_korean: 그의 씨
  alternatives_korean:
  - 한 후손
  - 씨 한 줄기
  - 자손
  lexicon: seed
  rationale: 히브리어 זֶרַע는 문자적으로 ‘씨’이지만, 문맥상 집단적 후손을 가리킬 수 있습니다. POB의 'A seed'를 따라 한국어도 직역을 유지하되, 소유격 '그의'로 문맥상 대상자를 분명히 했습니다.
- source_word: יַעַבְדֶּנּוּ
  english_pob_choice: will serve him
  chosen_korean: 그를 섬길 것이며
  alternatives_korean:
  - 그를 섬기게 될 것이며
  - 그에게 봉사할 것입니다
  - 그에게 복종할 것입니다
  lexicon: serve
  rationale: עבד의 기본 의미는 ‘섬기다’이므로, 종교적·관계적 충성의 뉘앙스를 살리면서도 과도하게 해석하지 않기 위해 ‘섬길 것입니다’로 옮겼습니다.
- source_word: יְסֻפַּר
  english_pob_choice: it will be proclaimed
  chosen_korean: 전해질 것입니다
  alternatives_korean:
  - 선포될 것입니다
  - 말해질 것입니다
  - 알려질 것입니다
  lexicon: proclaim
  rationale: 수동형 ספּר는 ‘이야기되다/전해지다’의 전달 뉘앙스를 가지며, POB의 'proclaimed'는 선포성과 전승성을 함께 담습니다. 한국어에서는 종교적 과장을 피하면서도 공개적 전달을 살려 ‘전해질 것입니다’로 했습니다.
- source_word: לַאדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주에 대해서는
  alternatives_korean:
  - 주님에 관해서는
  - 주에 관하여
  - 주에 대해
  lexicon: Lord
  rationale: 본문의 לַאדֹנָי는 직접 목적어가 아니라 전달의 내용 대상입니다. 한국어는 내용을 이끄는 조사구로 처리해 ‘주에 대해서는’으로 옮겨, 문장의 연결 관계를 드러냈습니다.
theological_decisions:
- issue: ‘posterity/seed’의 집합적 의미 유지
  chosen_reading: ‘씨’라는 단어를 유지하되, 한국어 독자가 집단적 후손을 염두에 두도록 문맥을 열어 두었습니다.
  alternative_readings:
  - ‘후손’으로 해석을 고정
  - 메시아적 단수로 단정
  rationale: 시편의 시어는 개별 인물보다 공동체적 후손을 가리킬 수 있으며, 본문 자체가 그 의미를 단정적으로 좁히지 않습니다. POB의 'A seed'도 이 긴장을 보존합니다.
  doctrine_reference: 시편 22편의 시적·예언적 다층성
- issue: ‘about the Lord’의 전달 방식
  chosen_reading: ‘주에 대해서는 세대에 전해질 것입니다’로 옮겨, 내용 전달과 세대 간 전승을 함께 드러냈습니다.
  alternative_readings:
  - ‘주에 관해 말해질 것입니다’
  - ‘주께서 세대에 선포될 것입니다’
  rationale: 원문은 단순한 정보 전달보다 공동체 안에서 이어질 증언을 가리키므로, 선포와 전승의 중간 지점을 살리는 표현을 택했습니다.
  doctrine_reference: 공동체적 증언과 전승의 언어
