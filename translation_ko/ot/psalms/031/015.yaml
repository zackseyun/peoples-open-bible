  text: בְּ/יָדְ/ךָ֥ עִתֹּתָ֑/י הַצִּ֘ילֵ֤/נִי מִ/יַּד א֝וֹיְבַ֗/י וּ/מֵ/רֹדְפָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/015.yaml
  text: My times are in your hand[a]; rescue me from the hand of my enemies and from my pursuers.
  footnotes:
  - marker: a
    text: Or 'my appointed times' or 'my circumstances.' The Hebrew 'my times' can refer broadly to the seasons and events of one's life.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 때는 주님의 손에 있습니다. 저를 제 원수들의 손과 저를 뒤쫓는 자들에게서 구해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 정해진 때들’ 또는 ‘제 처지들’. 히브리어 ‘제 때들’은 삶의 시기와 일어나는 일들을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 하지만 저는
  - 그런데 저는
  lexicon: BHS/WLC
  rationale: ראשׁית의 대비와 강조를 살리되, 한국어에서는 관용적인 대조 표현인 ‘그러나 저는’이 가장 자연스럽습니다.
- source_word: עָלֶיךָ בָטַחְתִּי
  english_pob_choice: I trust in you
  chosen_korean: 주님을 의지합니다
  alternatives_korean:
  - 주님 안에 믿습니다
  - 주님께 의지합니다
  lexicon: HALOT
  rationale: בטח의 핵심은 단순한 지적 동의가 아니라 의지와 신뢰이므로 ‘의지합니다’가 source-direct합니다. 전치사 על는 한국어에서 목적격/대상 표지로 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: POB의 표준을 따라 신명은 ‘야훼’로 옮겨, 칭호 ‘주님’과 구별했습니다.
- source_word: אֱלֹהַי אָתָּה
  english_pob_choice: You are my God
  chosen_korean: “주는 나의 하나님이십니다”
  alternatives_korean:
  - “당신은 나의 하나님이십니다”
  - “주는 나의 하나님입니다”
  lexicon: HALOT
  rationale: 1인칭 소유사 ‘나의’와 명시적 대명사 ‘주는’로 고백의 직접성을 살렸고, 하나님께 드리는 진술이므로 존칭 종결 ‘-십니다’를 사용했습니다.
theological_decisions:
- issue: 주님/야훼의 구분
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로, 인용문 안의 ‘my God’는 ‘나의 하나님’으로 구분해 옮겼습니다.
  alternative_readings:
  - 두 곳 모두 ‘주님’으로 통일
  - 둘 다 ‘하나님’으로 일반화
  rationale: 신명과 보통 호칭을 구별해야 본문이 드러내는 인격적 신뢰와 언약적 호칭의 차이가 보존됩니다.
  doctrine_reference: POB contested terms guidance
