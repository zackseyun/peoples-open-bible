  meaning: The people kept straining for foreign help, but the nation they watched for could not rescue them.
  meaning_decisions:
  - source_phrase: תִּכְלֶינָה עֵינֵינוּ אֶל עֶזְרָתֵנוּ הָבֶל
    prior_rendering: our eyes failed, looking in vain for our help
    new_rendering: our eyes failed as we looked in vain for help
    rationale: The explicit connection makes clear that prolonged, futile expectation exhausted their eyes; “our help” is unnatural English for the help they hoped to receive.
  - source_phrase: בְּצִפִּיָּתֵנוּ צִפִּינוּ
    prior_rendering: in our watching we watched
