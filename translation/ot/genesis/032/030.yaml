  rationale: The Hebrew construction `וַיִּשְׁאַל ... וַיֹּאמֶר` ('and he asked... and he said') is a common feature of Hebrew narrative. While the literal rendering 'asked and said' is faithful to the form, it is redundant and slightly unnatural in English. A smoother rendering would be 'Then Jacob asked,' as the following quotation makes it clear that he is speaking. This change improves readability while the meaning is fully preserved.
