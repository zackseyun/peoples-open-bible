  rationale: 원문의 성별 표지(ἀνδρῶν)를 보존하고, διηγήσεις와 συντηρήσει를 현대 한국어에서 자연스럽게 연결했습니다. στροφαῖς παραβολῶν의 의도적으로 복합적이고 비유적인 표현은 ‘비유의 굴곡’으로 유지하여 과도한 해석을 피했습니다.
