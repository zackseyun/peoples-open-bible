  to: 그들이 부르짖었고, 야훼께서[a] 들으셨으며, 그들의 모든 환난에서 그들을 건져 내셨습니다.
  rationale: 절 자체가 잘못 대조되어 있었으므로, 제시된 WLC 본문을 처음부터 다시 번역했습니다. צָעֲקוּ의 복수 주어를 ‘그들이’로 보존하고, יְהוָה를 ‘야훼’로, שָׁמֵעַ의 시적 연속 문맥을 완료 서술인 ‘들으셨으며’로, מִכָּל צָרוֹתָם을 ‘그들의 모든 환난에서’로, הִצִּילָם을 ‘그들을 건져 내셨습니다’로 옮겼습니다. 원문에 없는 ‘얼굴’, ‘악을 행하는 자들’, ‘기억’, ‘땅’ 및 관련 각주는 삭제했습니다.
