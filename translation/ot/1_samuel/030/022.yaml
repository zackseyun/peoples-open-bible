    prior_rendering: Then every wicked and worthless man from among the men ... answered and said
    new_rendering: Then all the wicked and worthless men among those ... said
    rationale: The Hebrew moves from a distributive singular to plural speech; natural English can express the speakers collectively without the conventional double speech formula.
  - source_phrase: יַעַן אֲשֶׁר לֹא הָלְכוּ עִמִּי
