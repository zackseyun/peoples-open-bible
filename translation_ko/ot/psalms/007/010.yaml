lexical_decisions:
- source_word: יִגְמָר נָא רַע רְשָׁעִים
  english_pob_choice: Please let the evil of the wicked come to an end
  chosen_korean: 부디 악인의 악함이 끝나게 하시고
  alternatives_korean:
  - 부디 악인들의 악이 끝나게 하시고
  - 부디 악한 자들의 악행이 끝나게 하시고
  lexicon: יִגְמָר / רַע / רְשָׁעִים
  rationale: 동사와 명사의 조합을 살려 ‘악함’이 ‘끝나게 하다’로 옮겼고, רְשָׁעִים은 문맥상 집단 전체를 가리키므로 ‘악인’으로 간결하게 처리했습니다.
- source_word: וּתְכוֹנֵן צַדִּיק
  english_pob_choice: but establish the righteous
  chosen_korean: 의인을 세워 주십시오
  alternatives_korean:
  - 의인을 견고하게 하소서
  - 의인을 확립해 주십시오
  lexicon: תְּכוֹנֵן / צַדִּיק
  rationale: ‘세우다’는 ‘견고하게 하다/확립하다’의 의미를 자연스럽게 담으면서도 시편의 간구체에 잘 맞습니다.
- source_word: וּבֹחֵן לִבּוֹת וּכְלָיוֹת
  english_pob_choice: O righteous God who examines hearts and kidneys
  chosen_korean: 마음을 살피시고 내장을 살피시는 의로우신 하나님이시여
  alternatives_korean:
  - 마음과 내장을 살피시는 의로우신 하나님이시여
  - 마음과 콩팥을 살피시는 의로우신 하나님이시여
  lexicon: בֹחֵן / לִבּוֹת / כְלָיוֹת
  rationale: English audit가 ‘kidneys’를 유지하므로, 한국어도 직역적으로 ‘내장’을 택해 신체적 표현의 충격과 상징성을 보존했습니다. ‘마음’과 병렬을 이루도록 같은 동사 ‘살피시다’를 반복했습니다.
theological_decisions:
- issue: 하나님의 호칭과 성품 절
  chosen_reading: ‘의로우신 하나님’과 ‘마음을/내장을 살피시는’ 표현을 함께 유지해, 재판하시는 하나님의 공의와 전인적 분별을 동시에 드러냈습니다.
  alternative_readings:
  - ‘공의로우신 하나님’으로 옮김
  - ‘속사람을 살피시는’으로 완화함
  rationale: 히브리어 צַדִּיק는 단순한 도덕성보다 판결적·언약적 의로움을 포함하므로 ‘의로우신’이 적절하며, כְלָיוֹת을 완곡하게 바꾸면 원문의 신체 은유가 약화됩니다.
  doctrine_reference: 시편 7편의 재판자-하나님 주제
- issue: 청원문의 직접 화행
  chosen_reading: ‘부디…하십시오’의 정중한 간구체를 유지했습니다.
  alternative_readings:
  - 서술형으로 완화
  - ‘하옵소서’의 전통 문체 사용
  rationale: 합쇼체를 유지하면서도 원문의 간구 성격을 보존하기 위해 현대적 공손 청유를 택했습니다.
  doctrine_reference: 시편의 기도 ভাষ체
