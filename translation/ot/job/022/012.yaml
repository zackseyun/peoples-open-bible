id: JOB.22.12
reference: Job 22:12
source:
  edition: WLC
  text: הֲֽ/לֹא אֱ֭לוֹהַּ גֹּ֣בַהּ שָׁמָ֑יִם וּ/רְאֵ֤ה רֹ֖אשׁ כּוֹכָבִ֣ים כִּי רָֽמּוּ־־׃
translation:
  text: Is not God in the heights of heaven? Look at the highest stars—how lofty they are!
  philosophy: dynamic
lexical_decisions:
- source_word: הֲלֹא
  chosen: Is not
  alternatives:
  - Isn't
  - Surely
  lexicon: HALOT
  rationale: Introduces a rhetorical question expecting agreement. 'Is not' preserves the formal interrogative force better than the more colloquial 'Isn't' and avoids importing the emphatic nuance of 'Surely' into the main text.
- source_word: אֱלוֹהַּ
  chosen: God
  alternatives:
  - God Almighty
  - God above
  lexicon: HALOT
  rationale: Standard singular term for God. 'God' is the plain lexical equivalent; the alternatives add interpretive or contextual nuance not explicit in the word itself.
- source_word: גֹּבַהּ שָׁמַיִם
  chosen: in the heights of heaven
  alternatives:
  - as high as heaven
  - in the heights of heaven
  - the height of the heavens
  lexicon: HALOT
  rationale: This is natural English for the elevated spatial expression; the note preserves the singular form of the Hebrew.
- source_word: וּרְאֵה
  chosen: Look
  alternatives:
  - And look
  - Look
  lexicon: HALOT
  rationale: “Look” is a natural rendering of the imperative in this direct observational appeal; English need not retain the conjunction mechanically.
- source_word: רֹאשׁ כּוֹכָבִים
  lemma: רֹאשׁ
  chosen: the highest stars
  alternatives:
  - the top of the stars
  - the stars' summit
  - the stars
  lexicon: HALOT
  rationale: רֹאשׁ literally means 'head/top,' here idiomatically referring to the uppermost height of the stars. English requires smoothing; 'the highest stars' conveys the sense naturally without wooden literalism. A more literal 'top of the stars' is awkward in English.
- source_word: כִּי
  chosen: how
  alternatives:
  - that
  - for
  lexicon: HALOT
  rationale: 'Here כִּי introduces an exclamatory observation about the stars'' elevation: ''how lofty they are.'' ''That'' is possible but less idiomatic in English; ''for'' would misrepresent the clause as causal.'
- source_word: רָמּוּ
  chosen: they are lofty
  alternatives:
  - they are high
  - they are exalted
  lexicon: HALOT
  rationale: From רום, 'to be high/exalted.' 'Lofty' fits the elevated poetic register and matches the astronomical imagery. 'Exalted' could suggest honor rather than physical height, so it is less suitable here.
