translation:
  language: en
  text: For God did not appoint us to face wrath. Instead, he appointed us to receive salvation[a] through our Lord Jesus Christ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may also suggest gaining, possessing, or being preserved for salvation.
    reason: lexical_alternative
  - marker: b
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: did not appoint us for wrath
  simplified_phrase: did not appoint us to face wrath
  preserved_meaning: God did not appoint believers to wrath as their final outcome.
  reasoning_layer_used: Lexical decision for ἔθετο with εἰς ὀργήν
  rationale: The infinitive phrase makes the intended outcome clear without strengthening “appoint” to “destine.”
- pob_phrase: but for obtaining salvation
  simplified_phrase: Instead, he appointed us to receive salvation
  preserved_meaning: God appointed believers for salvation rather than wrath.
  reasoning_layer_used: Lexical decision for περιποίησις σωτηρίας
  rationale: A new sentence and repeated verb make the contrast easy to follow while retaining “salvation.”
- pob_phrase: through our Lord Jesus the Messiah
  simplified_phrase: through our Lord Jesus the Messiah
  preserved_meaning: Salvation comes through Jesus, who bears the title Messiah.
  reasoning_layer_used: Theological decision for Χριστός
  rationale: The key title remains unchanged because replacing it would hide its meaning.
interpretive_expansions:
