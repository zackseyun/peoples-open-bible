simplification_decisions:
- pob_phrase: the law was given through Moses
  simplified_phrase: God gave the law through Moses
  preserved_meaning: God is the giver, while Moses remains the one through whom the law was given.
  reasoning_layer_used: POB lexical rationale and immediate context
  rationale: Making the implied divine giver explicit clarifies the passive without changing Moses’s mediating role.
- pob_phrase: For ...;
  simplified_phrase: God ... . Grace ...
  preserved_meaning: The statements still explain the preceding verse and contrast the law’s giving with the coming of grace and truth.
  reasoning_layer_used: POB lexical rationale and discourse context
  rationale: Two direct sentences are easier to read than the semicolon structure, and the explanatory link remains clear in context.
- pob_phrase: Jesus the Messiah
  simplified_phrase: Jesus the Messiah
  preserved_meaning: Messiah remains an intelligible title for Jesus rather than being reduced to a name.
  reasoning_layer_used: POB theological decision and regression fix
  rationale: The article makes the translated title natural in modern English while the footnote preserves the traditional wording.
