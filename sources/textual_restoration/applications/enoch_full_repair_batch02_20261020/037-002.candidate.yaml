translation:
  text: 'This is the beginning of the word of wisdom that I have taken up to speak[a] to those who dwell on dry
    land: “Hear, you former ones, and see, you latter ones[b], the holy words that I speak before the Lord of Spirits.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The edition brackets እብል, “I say,” as a duplicated expression. It is recorded in the source but is not
      translated as a second speaking clause.
    reason: textual_variant
  - marker: b
    text: The address distinguishes former and latter people, naturally understood as earlier and later generations;
      the translation preserves the temporal contrast.
    reason: cultural_note
