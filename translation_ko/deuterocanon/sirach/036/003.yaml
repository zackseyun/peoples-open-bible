  source_fidelity: ‘지혜 있는 사람’은 συνετός의 분별·통찰의 뜻을 다소 일반적인 지혜로 넓힙니다. 또한 πιστός를 법에 대해 ‘신실하다’로 옮기면 한국어에서는 인격적 충성의 뉘앙스가 강해져, 여기의 ‘믿을 수 있다/신뢰할 만하다’는 뜻이 충분히 드러나지 않습니다. ἐρώτημα는 문자적으로 물음·문의이나, 영어 POB의 ‘oracle’ 및 문맥상 신탁적 문의라는 함의를 반영할 수 있습니다.
  naturalness: ‘의인들의 질문처럼 그에게 신실합니다’는 한국어에서 무엇이 무엇에 비유되는지와 ‘질문’의 기능이 불분명합니다. ‘그에게 …만큼 신뢰할 만합니다’가 원문의 비교 구문과 현대 표준 한국어에 자연스럽습니다.
  terminology: νόμος는 ‘율법’으로 적절합니다. συνετός는 ‘분별 있는’, πιστός는 ‘신뢰할 만한’으로 옮기는 것이 적절합니다. ἐρώτημα의 해석상 여지는 본문에서 ‘신탁’으로 번역하고 각주에서 문자적 의미와 해석적 성격을 밝혀 보존합니다.
