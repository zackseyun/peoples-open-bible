  meaning_decisions:
  - source_phrase: ὅπως ... σωτηρία ἡμῖν
    prior_rendering: so that ... there may be deliverance for us
    new_rendering: so that ... this day may mean deliverance for us
    rationale: The elliptical clause continues the purpose of observing the festival; the supplied subject connects its meaning to the day without claiming that celebration mechanically causes rescue.
  - source_phrase: καὶ νῦν καὶ μετὰ ταῦτα
    prior_rendering: both now and after these things
    new_rendering: now and in the future
    rationale: The expression contrasts the present with the continuing future, not merely a subsequent stage of the immediate events.
  - source_phrase: τοῖς εὐνοοῦσιν Πέρσαις
    prior_rendering: the Persians who are well-disposed toward us
    new_rendering: the Persians who wish us well
    rationale: This conveys goodwill naturally without strengthening it into formal allegiance or loyalty.
  - source_phrase: μνημόσυνον τῆς ἀπωλείας
    prior_rendering: a memorial of destruction
    new_rendering: a reminder of destruction
    rationale: The festival serves as an enduring reminder to hostile plotters; the wording leaves open whether the destruction recalled is Haman's downfall or the fate awaiting similar conspirators.
