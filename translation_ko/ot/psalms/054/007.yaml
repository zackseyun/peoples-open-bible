  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[b], for it is good[c].
  footnotes:
  - marker: a
    text: Or, 'Evil will return upon my adversaries; in your faithfulness you will destroy them.' The first verb may be read as indicative rather than volitional, and 'destroy them' is a more literal rendering of the final verb.
    reason: alternative_reading
  - marker: b
    text: Or 'in your truth.' The Hebrew word can mean truth, reliability, or faithfulness.
    reason: lexical_alternative
