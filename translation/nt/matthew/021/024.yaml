  from: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
  to: But Jesus answered them[a], “I also will ask you one question, and if you answer me, I also will tell you by what authority I do these things.”
  rationale: Translating λόγον as 'question' creates a collocation clash with 'tell' in the relative clause. In English, one does not 'tell' a question; one answers it. Because the relative pronoun 'which' refers back to the antecedent, 'which if you tell me' inadvertently implies they are telling him the question. Rendering λόγον as 'thing' or 'matter' resolves this smoothly. Alternatively, if 'question' is retained, the clause should be restructured (e.g., 'one question, and if you answer me').
- timestamp: '2026-11-09T18:16:13Z'
