  text: 'Postquam perscripseram librum hunc, venit nuntius ille, qui me tradiderat huic pastori, in domum
    in qua eram, et consedit supra lectum, et adstitit ad dexteram hic pastor. deinde vocavit me et haec
    mihi dixit: 2. Tradidi te, inquit, et domum tuam huic pastori, ut ab eo protegi possis. Ita, inquam,
    domine. Si vis ergo protegi, inquit, ab omni vexatione et ab omni saevitia, successum autem habere
    in omni opere bono atque verbo, et omnem virtutem aequitatis, in mandatis huius ingredere, quae dedi
    tibi, et poteris dominari omni nequitiae. 3. custodienti enim tibi mandata huius subiecta erit omnis
    cupiditas et dulcedo saeculi huius; successus vero in omni bono negotio te sequetur. maturitatem huius
    et modestiam suscipe in te, et dic omnibus in magno honore esse eum et dignitate apud Dominum, et
    magnae potestatis eum praesidem esse et potentem in officio suo. huic soli per totum orbem paenitentiae
    potestas tributa est. potensne tibi videtur esse? sed vos maturitatem huius et verecundiam quam in
    vos habet dispicitis.'
