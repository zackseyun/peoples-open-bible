  text: Blessed are you in the temple of your holy glory, and highly praised and exceedingly glorious forever.
translation:
  language: ko
  text: 주님의 거룩한 영광의 성전에서 주님은 복되십니다. 또 영원토록 지극히 찬양받으시며 지극히 영광스러우십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένος εἶ
  english_pob_choice: Blessed are you
  chosen_korean: 복되십니다
  alternatives_korean:
  - 찬양받으십니다
  - 복되십니다
  lexicon: εὐλογέω
  rationale: 찬양의 응답이지만, 여기서는 하나님을 향한 선언적 축복문이므로 ‘복되십니다’로 옮겨 축복 선포의 힘을 살렸습니다.
- source_word: ἐν τῷ ναῷ
  english_pob_choice: in the temple
  chosen_korean: 성전에서
  alternatives_korean:
  - 성막에서
  - 성전 안에서
  lexicon: ναός
  rationale: ναός는 예배 공간으로서의 성전을 가리키므로, 한국어로는 자연스럽고 직접적인 ‘성전에서’가 적절합니다.
- source_word: τῆς ἁγίας δόξης σου
  english_pob_choice: your holy glory
  chosen_korean: 주의 성전
  alternatives_korean:
  - 주의 거룩한 영광
  - 주의 거룩한 영예
  lexicon: δόξα
  rationale: 본문은 ‘거룩한 영광’ 자체가 아니라 그 영광의 영역/장소 안에서의 찬양을 말하므로, 문맥을 살려 ‘주의 성전’으로 옮기고 ‘거룩한’은 이어지는 수식으로 반영했습니다.
- source_word: ὑπερυμνητός καὶ ὑπερένδοξος
  english_pob_choice: highly praised and exceedingly glorious
  chosen_korean: 지극히 찬양받으시며 지극히 영광스러우십니다
  alternatives_korean:
  - 크게 찬양받으시며 매우 영광스러우십니다
  - 극진히 찬양받으시며 지극히 영화로우십니다
  lexicon: ὑπερυμνητός / ὑπερένδοξος
  rationale: POB의 최종 영어를 따라 두 겹의 강조를 모두 살리되, 한국어에서는 ‘지극히’와 수동형 ‘찬양받으시며’로 높은 찬양의 강도를 표현했습니다.
theological_decisions:
- issue: ‘holy glory’와 예배 장소의 관계
  chosen_reading: 하나님의 거룩한 영광이 머무는 성전 안에서의 축복 선포로 읽었습니다.
  alternative_readings:
  - ‘주의 거룩한 영광’ 자체를 직접 수식하는 표현으로 읽을 수 있습니다.
  - ‘거룩한 영광의 성전’이라는 소유격적 구조로 읽을 수 있습니다.
  rationale: 그리스어 구조상 ‘거룩한 영광’은 성전의 성격을 규정하는 소유격으로 이해하는 것이 자연스럽고, 한국어에서도 예배적 장면을 분명히 전달합니다.
  doctrine_reference: 성전/영광 표상, 제의적 축복 언어
- issue: 찬양과 영광의 중복 강조
  chosen_reading: ‘지극히 찬양받으시며 지극히 영광스러우십니다’로 두 표현을 별도로 유지했습니다.
  alternative_readings:
  - 두 표현을 하나로 압축하여 ‘크나큰 영광을 받으십니다’로 옮길 수 있습니다.
  - ‘높이 찬양받으시며 영화로우십니다’로 완화할 수 있습니다.
  rationale: 본문은 동의적 병렬을 통해 하나님의 절대적 탁월함을 누적적으로 강조하므로, 한국어에서도 두 요소를 분리해 보존하는 편이 source-direct합니다.
  doctrine_reference: 찬양 송축의 병렬 강조
