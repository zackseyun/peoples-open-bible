  from: Whoever blesses his neighbor with a loud voice[a], rising early in the morning[c][b], it will be counted to him as a curse.
  to: Whoever loudly blesses his neighbor[a] early in the morning, it will be counted to him as a curse.[b][c]
  rationale: The current wording has an unintegrated participial phrase. The proposed “will have it counted as a curse” improves grammar but weakens the passive construction and does not represent לוֹ as directly as “counted to him.” This smaller revision gives a coherent English rendering while retaining the source’s impersonal reckoning and the existing legitimate notes.
