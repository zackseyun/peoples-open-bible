  - business activities
  rationale: The verse warns that the rich person fades amid his ongoing course of life and activity. Rendering the term broadly avoids narrowing the warning to literal travel while preserving the metaphorical force of life's undertakings.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
