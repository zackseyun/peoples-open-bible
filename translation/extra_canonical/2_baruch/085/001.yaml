- field: lexical_decisions
  archived_by: repentance-contextual-2026-10-13
  baseline_commit: 1c388ebf7b81430b6dbf56575de3b3604ba77804
  baseline_path: translation/extra_canonical/2_baruch/085/001.yaml
  sha256: 75b61fb44942c74b87f76177681b11dcc8f68d670a95bcf6fd144173867007b0
  certifies_this_candidate: false
  value:
  - source_word: ܦܩ̈ܘܕܘܗܝ
    chosen: his commandments
    alternatives:
    - his decrees
    - his commands
    lexicon: Payne Smith
    rationale: The term naturally carries the sense of authoritative divine commands. “Commandments” preserves the covenantal and exhortatory force in this closing warning.
  - source_word: ܢܝܚ / ܬܐܢܝܚܘܢ
    chosen: find rest
    alternatives:
    - be comforted
    - have relief
    lexicon: Payne Smith
    rationale: The immediate contrast is with condemnation at the judgment. “Find rest” preserves both relief and eschatological repose without flattening the image.
  - source_word: ܒܒܟܝܐ ܕܢܫ̈ܐ
    chosen: the weeping of women
    alternatives:
    - women’s lamentation
    lexicon: Payne Smith
    rationale: A literal rendering keeps the lament rhetoric vivid and fits the surrounding list of ineffective appeals and intercessory gestures.
  - source_word: ܒܛܝܒܘܬܐ ܕܛܠܝ̈ܐ
    chosen: the tenderness of little children
    alternatives:
    - the charm of children
    - the goodness of little ones
    lexicon: Payne Smith
    rationale: The noun suggests pleasantness, kindness, or endearing innocence. “Tenderness” best fits the emotional appeal implied by the list.
  - source_word: ܒܕܟܝܘܬܐ ܕܝܠܝ̈ܕܐ
    chosen: the innocence of newborns
    alternatives:
    - the purity of infants
    - the cleanness of babies
    lexicon: Payne Smith
    rationale: The phrase points to childlike purity as something people might think could plead for mercy. “Innocence” communicates that idiomatically in English.
  - source_word: ܐܪܙܐ
    chosen: room for reorientation
    alternatives:
    - room for repentance
    - mystery
    - sentence
    - proclamation
    lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
    rationale: Use reorient/reorientation without automatically inserting God. The sentence supplies a departure, destination, interpersonal setting, or the work's own conceptual framework. Preserve distinct turning verbs and named wrongdoing. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
    doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
  - source_word: ܡܦܠܓܝܢ ܒܚܛܝ̈ܬܐ
    chosen: defiled with sins
    alternatives:
    - divided by sins
    - entangled in sins
    lexicon: Payne Smith
    rationale: The literal force may suggest being split up or distributed among sins, but idiomatic English needs a moral-state expression. “Defiled with sins” communicates the resulting condition clearly.
