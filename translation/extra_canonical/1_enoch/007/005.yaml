translation:
  text: They began to sin against the birds and the wild animals, against every creeping thing and the fish, and to devour
    one another’s flesh and drink its blood.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final expression is bracketed as a possible doublet in the selected Charles edition; without it, the ending
      reads “and drink blood.” The eating and drinking forms also vary in the printed apparatus. The pronoun’s relation is
      not expanded into an invented scene.
    reason: textual_variant
lexical_decisions:
- source_word: ወወጠኑ፡ የአብሱ
  chosen: They began to sin against
  alternatives:
  - They began to offend against
  - They began to do wrong against
  rationale: ወጠኑ introduces the onset of the coordinated actions, while the following verb denotes sinning or wrongdoing.
    “Sin against” preserves the explicitly moral characterization rather than reducing it to generic violence.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: በአዕዋፍ፡ ወዲበ፡ አራዊት
  chosen: against the birds and the wild animals
  alternatives:
  - against birds and beasts
  - with the birds and upon the animals
  rationale: አዕዋፍ denotes birds, and አራዊት denotes nondomesticated animals or beasts. The varying prepositions are understood
    as carrying forward the relation governed by “sin against”; reproducing them mechanically would obscure the coordinated
    list.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ወበዘይትሐወሥ
  chosen: against every creeping thing
  alternatives:
  - against that which moves
  - against the reptiles
  rationale: The expression is literally built around “that which moves.” In this catalogue of animal classes, “every creeping
    thing” gives the likely category while retaining its biblical-apocalyptic register; “reptiles” would be narrower.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ወበዓሳተ
  chosen: and the fish
  alternatives:
  - and fishes
  rationale: ዓሳት is the plural of the ordinary term for fish and completes the catalogue of creatures.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ሠጋሆሙ፡ በበይናቲሆሙ፡ ይትባለዑ
  chosen: to devour one another’s flesh
  alternatives:
  - to eat their flesh among themselves
  - to consume each other’s flesh
  rationale: ሠጋ means flesh, and በበይናቲሆሙ supplies the reciprocal sense “among themselves/one another.” “Devour” conveys the
    predatory force of the eating verb in this violent context without adding imagery absent from the witness.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ወደመ፡ ይስተዩ፡ [እምኔሃ፡]
  chosen: and drink its blood
  alternatives:
  - and drink blood
  - and drink blood from it
  rationale: ደም is “blood” and ይስተዩ is “they drink.” The bracketed እምኔሃ means “from it/from her” and likely relates the blood
    to the flesh just mentioned. Idiomatic English expresses this as “its blood,” while a note preserves the witness uncertainty.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
theological_decisions:
- issue: Moral characterization of violence against the created orders
  chosen_reading: sin against
  alternative_readings:
  - harm
  - attack
  rationale: The Ge'ez verb explicitly frames these acts as sin or wrongdoing. Retaining that language preserves the passage’s
    judgment theology rather than presenting only predation.
- issue: Consumption of flesh and blood
  chosen_reading: literal violent consumption
  alternative_readings:
  - a generalized image of corruption
  rationale: The source directly names flesh, eating, and blood-drinking. The apocalyptic image should remain concrete and
    should not be softened into an abstract statement about corruption.
