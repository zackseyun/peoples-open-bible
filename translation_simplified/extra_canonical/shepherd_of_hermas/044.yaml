translation:
  text: '1. He spoke these things to me very angrily. I became confused and feared him greatly. For his
    appearance changed so much that a person could not endure his anger.[b]


    2. When he saw me wholly troubled and confused, he began to speak more gently and more cheerfully[c].
    He says, “Foolish, senseless, double-minded one, do you not understand God’s glory—how great, strong
    and wonderful it is? He created the world for the human being, subjected all his creation to him,
    and gave him all authority to master everything under heaven.”


    3. “If the human being is lord of all God’s creatures and masters them all,” he says, “can he not
    also master these commandments? The person who has the Lord in his heart,” he says, “can master everything
    and all these commandments.”


    4. “But those who have the Lord on their lips while their hearts are hardened and they are far from
    the Lord[d] find these commandments hard and difficult to walk in.”


    5. “So you who are empty and light in faith, place your Lord in your heart. You will know that nothing
    is easier, sweeter or gentler than these commandments.”


    6. “Turn back, you who walk in the devil’s difficult, bitter, savage and licentious commandments.
    Do not fear the devil, because he has no power against you.”


    7. “For I will be with you. I am the angel of repentance[a] who masters him. The devil has only fear[e],
    and his fear has no strength. So do not fear him, and he will flee from you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
  - marker: b
    reason: textual_variant
    text: After iv.1 Lake (1907) Plate VIII includes an additional creation passage about sun, moon, stars
      and other creatures. The1891 working edition calls it an Athos gloss and excludes it. Vulgata printed
      66 has no corresponding expansion. The printed Latin on Palatina127 is supplied from Vulgata, not
      independent support for omission.
  - marker: c
    reason: textual_variant
    text: More cheerfully is bracketed in the working Greek. Lake (1907) Plate VIII has only more gently;
      Vulgata printed 66 has moderately and cheerfully. The working editorial phrase is translated and
      disclosed, not treated as unanimously preserved Greek.
  - marker: d
    reason: textual_variant
    text: The working iv.4 has far from the Lord; Lake (1907) Plate VIII instead has far from God. The
      Lord wording is retained. Palatina printed 127 falls in its Vulgata-derived supplement.
  - marker: e
    reason: textual_variant
    text: The working iv.7 says the devil has only fear, whose fear has no strength. Vulgata printed 67
      and the supplied Latin on Palatina129 instead say he causes fear. The English retains the selected
      has wording, without silently replacing it by causes.
