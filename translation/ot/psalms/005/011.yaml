  from: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
  to: But let all who take refuge in you rejoice; let them shout for joy forever. Cover them[a], and let those who love your name exult in you.
  rationale: '“Cover them” is an appropriate source-near correction: it preserves the concrete protective-covering image of וְתָסֵךְ rather than replacing it with the abstract “Spread your protection.” A brief note can state its protective force. The proposed “so that” introduces a purpose/result relationship not explicitly marked by the coordinating waw; “and let” better preserves the sequence of petitions. “Exult” is neither materially unnatural nor a register mismatch in psalmic poetry and more adequately reflects the heightened joy of עלץ than the generic “rejoice.”'
