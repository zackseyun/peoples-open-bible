id: PSA.46.11
reference: Psalms 46:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/011.yaml
  text: Yahweh of Armies is with us[a]; the God of Jacob is a stronghold for us[b]. Selah[c]
  footnotes:
  - marker: a
    text: Or “Yahweh of hosts is with us.” The Hebrew term traditionally rendered “hosts” refers to armies or military companies and can include heavenly forces.
    reason: lexical_alternative
  - marker: b
    text: Or “a refuge” or “a high fortress.” The Hebrew word denotes a secure, elevated place of protection.
    reason: lexical_alternative
  - marker: c
    text: “Selah” is a Hebrew liturgical or musical term whose precise meaning is uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 만군의 야훼께서 우리와 함께하십니다[a]. 야곱의 하나님은 우리의 요새이십니다[b]. 셀라[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군의 야훼’는 히브리어 ‘여호와 체바오트’(יְהוָה צְבָאוֹת)를 옮긴 말입니다. ‘만군’은 군대 또는 군대들의 무리를 가리키며, 흔히 하늘의 군대라는 함의를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요새’(מִשְׂגָּב)는 안전한 높은 곳, 곧 견고한 피난처를 뜻합니다. ‘피난처’ 또는 ‘높은 요새’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘셀라’는 정확한 의미가 확정되지 않은 히브리어 예배·음악 용어이므로 음역했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַרְפּוּ
  english_pob_choice: Be still
  chosen_korean: 잠잠하십시오
  alternatives_korean:
  - 멈추십시오
  - 그만두십시오
  - 놓아버리십시오
  lexicon: HALOT
  rationale: 이 명령형은 단순한 정적 상태보다 ‘멈추다/놓다/그치다’의 뜻을 가지므로, 시편의 권면성과 합쇼체를 함께 살릴 수 있는 ‘잠잠하십시오’로 옮겼습니다.
- source_word: וּדְעוּ
  english_pob_choice: and know
  chosen_korean: 그리고 … 아십시오
  alternatives_korean:
  - 그리고 … 알십시오
  - 그리고 … 인식하십시오
  lexicon: HALOT
  rationale: ידע의 직접적인 명령을 살려 ‘아십시오’로 옮겼고, 앞의 명령과 자연스럽게 이어지도록 ‘그리고’를 덧붙였습니다.
- source_word: אָרוּם
  english_pob_choice: I will be exalted / I am exalted
  chosen_korean: 높임을 받겠습니다
  alternatives_korean:
  - 높임을 받습니다
  - 높아지겠습니다
  lexicon: HALOT
  rationale: 히브리어 완료/미완료의 문맥상 확실성과 선언성을 살리면서도, 능동적 자기를 높인다는 뉘앙스를 피하기 위해 수동형인 ‘높임을 받다’를 사용했습니다.
- source_word: בַּגּוֹיִם / בָּאָרֶץ
  english_pob_choice: among the nations / in the earth
  chosen_korean: 민족들 가운데서 / 땅에서
  alternatives_korean:
  - 나라들 가운데서 / 온 땅에서
  - 열방 가운데서 / 온 땅에서
  lexicon: HALOT
  rationale: גוים는 여기서 이방 ‘민족들’이라는 집합적 의미가 자연스럽고, ארץ는 시의 보편성을 살려 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: 첫 명령 הַרְפּוּ의 의미 범위
  chosen_reading: ‘잠잠하십시오’로 옮겨, 인간의 분주함과 저항을 멈추고 하나님의 주권 앞에 멈추라는 뜻을 열어 두었습니다.
  alternative_readings:
  - 전쟁을 중지하라는 뜻
  - 내적 묵상을 촉구하는 뜻
  rationale: 문맥상 열방과 땅 위에서의 하나님의 높아지심을 선포하므로, 단순한 침묵이나 전쟁 중지로만 좁히지 않고 행위의 중지를 포함하는 넓은 명령으로 유지했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
