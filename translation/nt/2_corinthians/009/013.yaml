  to: Because of the proof this ministry provides, they will glorify God for the obedience that accompanies your confession of the gospel of the Messiah[a] and for your generous sharing with them and with everyone.
  rationale: The first review correctly identified the need to clarify the relationship between confession and obedience; the later revision reversed that gain primarily for formal closeness. I restore the meaning-based clarification, retain 'Messiah,' and note the serious alternative relationship within the compressed construction.
