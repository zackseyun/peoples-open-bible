- from: '1[v7]. 그리고 그가 야곱의 두 손가락을 그의 눈에 대고 신들의 하나님을 찬송하고 그의 얼굴을 가리고 그의 발을 펴고 영원히 잠들매 그의 조상들에게로 돌아가니라.

    2. 야곱은 이 모든 일에도 불구하고 자기 품에 누워 있었고, 자기 아버지 아브라함이 죽은 줄도 알지 못했습니다.

    3. 그리고 야곱이 잠에서 깨어났습니다. 보라, 아브라함은 얼음처럼 차가웠습니다. 그러자 그는 “아버지, 아버지!”라고 말했습니다. 그러나 말하는 사람이 없었고 그는 자기가 죽은 줄 알았습니다[v10].

    4. 그리고 그는 품에서 일어나 달려가서 그의 어머니 리브가에게 말했습니다. 리브가가 밤에 이삭에게 가서 그에게 고하매 그들이 함께 가고 야곱도 그들과 함께 가는데 그의 손에는 횃불이 들려 있더라 그들이 가서 보니, 아브라함이 죽어 누워 있었습니다.

    5. 그리고 이삭은 그의 아버지의 얼굴에 엎드려 울며 그에게 입을 맞추었습니다.

    6. 아브라함의 집에 소리가 들리매 그 아들 이스마엘이 일어나 그의 아버지 아브라함에게로 가서 그 아버지 아브라함과 그와 아브라함의 온 집이 위하여 울니 그들이 크게 울더라.

    7. 그리고 그들은 그를 막다른 굴에 장사했는데, 그 곳은 그의 아내 사라와 그의 아들 이삭과 이스마엘 근처였습니다.

    8. 그의 집의 모든 사람들이 그를 위하여 사십일 동안 울었고, 이삭과 이스마엘과 그들의 모든 아들들과 그두라의 모든 아들들도 그들의 자리에서 울었다. 아브라함이 우는 날이 끝났다.

    9. 그는 삼 희년과 사 주를 지내며 일백칠십오 세를 지내며 늙고 날이 가득한 그 생명의 날을 다 살았느니라.

    10. 이전 사람들의 날에는 그들의 생명이 열아홉 희년이었으며 그러나 홍수 후에 그들은 열아홉 희년부터 쇠하고 속히 늙기 시작하였으며 아브라함 외에는 많은 환난과 악한 행위로 말미암아 그 수명이 짧아졌느니라.

    11. 아브라함은 주님 앞에서 행하는 모든 일에 완전하였고 그의 평생에 의로움을 기뻐하였음이니라 보라, 그는 악 앞에서 늙어 그의 날이 짧아지기까지 그의 생애에서 네 번의 희년을 마치지 못하였느니라.

    12. 그리고 이제부터 큰 심판의 날까지 모든 세대가 두 희년을 마치기 전에 속히 늙어갈 것이며, 그들의 마음은 그들의 총명에서 버림을 받고, 그들의 모든 지식은 사라지리라.

    13. 그 날에 사람이 희년 반을 살면 사람들이 그를 두고 이르기를 그는 오래 살았다 하리니 그러나 그의 날의 대부분은 고통과 수고와 고난이며 평안이 없느니라.

    14. 타격에 상처가 더해지고 상처에 상처가 더해지고 고난에 괴로움이 더해지고 악평에 악평이 더해지고 질병에 질병이 더해지며 온갖 악이 더해지니, 질병과 쓰러짐과 서리와 열병과 전염병과 칼에 맞고 포로가 되고 모든 환난과 질병이니라.

    15. 더러움과 음행과 더러움과 가증한 행위로 땅을 더럽히는 악한 세대에게 이 모든 일이 닥치리라.

    16. 그들이 말하기를 옛 사람들의 연수가 많아 천년까지 좋았으나 보라 우리의 연한이 장수하면 칠십이요 강건하면 팔십이라도 그 연한이 악하니 이 악한 세대의 날에는 평안이 없느니라 하리로다

    17. 그 세대에 아들들이 죄와 불의와 입의 말과 그들이 행하는 큰 악으로 말미암아 자기 조상과 장로들을 비방할 것이며 또 주님께서 그들과 자기 사이에 세우신 언약을 버리고 그의 모든 계명과 율례와 그의 모든 율법을 지켜 행하여 우로나 좌로나 치우치지 아니하였음이라.

    18. 그들은 다 악을 행하였으며 입마다 죄악을 말하며 그들의 행위는 다 부정하고 부패하며 그들의 행위는 다 더러운 것과 더러움과 파멸임이라.

    19. 보라, 그들의 모든 행위로 말미암아 땅이 파멸되고, 그들의 행위가 다 믿음이 없으므로 포도나무와 기름이 없을 것이라. 사람의 아들들 때문에 짐승과 가축과 새와 바다의 모든 물고기가 모두 함께 멸망할 것입니다.

    20. 그리고 그들이 율법과 언약에 관하여 젊은이와 노인, 늙은이가 젊은이와, 가난한 자가 부자와, 낮은 자가 관원과, 궁핍한 자가 관원과 더불어 다투리라 이는 그들이 계명과 언약과 절기와 달과 안식일과 희년과 모든 정한 것을 잊어버렸음이니라.

    21. 그들은 활과 칼과 살육을 가지고 서서 그들을 길에서 몰아내리라. 그리고 그들은 땅에 많은 피를 쏟을 때까지 돌아오지 못할 것입니다.

    22. 피한 자들은 그 악에서 떠나 의의 길로 돌이키지 못하리니 이는 그들이 다 일어나 속임수와 재물을 행하며 각기 이웃의 소유를 빼앗으려 할 것임이라 그들이 큰 이름을 얻으려니와 진실로나 의로 아니하리니 그들은 부정함과 더러운 부패로 지성소를 더럽힐 것이다.

    23. 그 세대의 행위에 주님께서 큰 형벌을 내리시리니 주님께서 그들을 칼과 심판과 포로와 약탈과 삼키는 손에 붙이시리라

    24. 그리고 그는 그들을 긍휼히 여기지 않고 불쌍히 여기지 않으며 노소에게나 아무에게도 은혜를 베풀지 아니하는 이방 죄인들을 충동하여 그들을 치게 하실 것이라 그들은 악하고 강해서 모든 사람보다 악을 더 많이 행하기 때문입니다.

    25. 그들이 이스라엘을 학대하고 야곱에게 죄를 짓게 하여 많은 피를 땅에 흘릴 것이며 모아둘 사람도 없고 묻을 사람도 없을 것이다.

    26. 그 날에 그들이 죄 많은 나라들의 손에서 구원해 달라고 부르짖고 부르짖을 것이지만 구원할 자가 아무도 없을 것입니다.

    27. 그 아이들의 머리는 희어지고 백발이 될 것이요, 삼 주일 된 아이는 백 살 같은 늙어 보이겠고, 그 키가 환난과 환난으로 말미암아 쇠하여지리라.

    28. 그 때에 자녀들이 율법을 연구하며 계명을 구하며 의의 길로 돌아오리라

    29. 그리고 사람의 자녀들 사이에 날이 많아지기 시작하여 대대로, 날마다 늘어나서 그들의 날이 천년에 가까워지고 많은 날보다 많은 해가 되리라. 그리고 노인도 없고 자기 수명에 만족하지 못하는 사람도 없을 것이다. 이는 그들 모두가 어린이와 청소년과 같을 것이기 때문이다. 그리고 그들의 모든 날은 평화와 기쁨으로 끝날 것이며, 그들은 살 것이며, 사탄도 없고 악한 멸망시키는 자도 없을 것입니다. 왜냐하면 그들의 모든 날은 축복과 치유의 날이 될 것이기 때문입니다.

    30. 그 때에 주님께서 그 종들을 고치시리니 그들이 일어나 큰 평안을 보고 그 대적들을 쫓아내리라 의인들은 보고 감사하며 영원무궁토록 기뻐하리로다'
