  source_fidelity: 히브리어 מֵעֶקְרוֹן וָיָמָּה는 ‘에그론에서 서쪽으로’로 정확합니다. כֹּל אֲשֶׁר עַל־יַד אַשְׁדּוֹד는 아스돗에 인접한 지리적 범위 전체를 가리키므로, 한국어에서는 ‘모든 것’보다 ‘모든 곳’이 문맥과 지시 대상을 더 충실히 드러냅니다. וְחַצְרֵיהֶן도 ‘그 마을들’로 옮길 수 있습니다.
  naturalness: 현 번역의 ‘아스돗 옆의 모든 것’은 한국어에서 지리적 목록으로 다소 부자연스럽고 무엇을 가리키는지 불분명합니다. ‘아스돗 곁에 있는 모든 곳’이 현대 표준어로 자연스럽고 의미도 명료합니다.
  terminology: 지명 ‘에그론’, ‘아스돗’은 통용 표기와 잘 맞습니다. 별도의 신학 용어 문제는 없습니다. 현 각주의 ‘손 옆’이라는 설명은 עַל־יַד의 관용적 전치사 용법을 부정확하게 문자화하므로 삭제하는 것이 좋습니다.
