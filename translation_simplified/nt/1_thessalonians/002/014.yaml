translation:
  language: en
  text: For you, brothers, came to follow the example of God’s churches in Judea in Christ Jesus.[a] You suffered the same things at the hands of people from your own country, just as those churches did at the hands of the Jews.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
    reason: lexical_alternative
  - marker: b
    text: Or “the Judeans.” Here “the Jews” refers to those who persecuted these churches, not to all Jewish people.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: became imitators
  simplified_phrase: came to follow the example
  preserved_meaning: The Thessalonians began to imitate the Judean churches in undergoing suffering.
  reasoning_layer_used: Lexical decision for μιμηταὶ ἐγενήθητε and the following causal clause
  rationale: This keeps both becoming and imitation while the next sentence identifies the shared experience.
- pob_phrase: the churches of God that are in Judea
  simplified_phrase: God’s churches in Judea
  preserved_meaning: The churches belong to God and are located in Judea.
  reasoning_layer_used: Lexical decisions for ἐκκλησιῶν τοῦ θεοῦ and τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  rationale: The possessive form and shorter location phrase convey the same identity and place.
- pob_phrase: from your own countrymen
  simplified_phrase: at the hands of people from your own country
  preserved_meaning: The suffering came from members of their own ethnic or civic community.
  reasoning_layer_used: Lexical decision for τῶν ἰδίων συμφυλετῶν
  rationale: This avoids dated, male-sounding wording without reducing the group to relatives.
translation_notes:
  risk_flags:
  - risk: “Follow the example” may suggest deliberate imitation rather than similarity through shared suffering.
    mitigation: The next sentence explicitly states that their common suffering is the point of comparison.
  - risk: “The Jews” could be misread as referring to every Jewish person.
    mitigation: The footnote limits the reference to the particular persecutors and preserves “the Judeans” as an alternative.
