id: JOB.3.3
reference: Job 3:3
source:
  edition: WLC
  text: יֹ֣אבַד י֭וֹם אִוָּ֣לֶד בּ֑/וֹ וְ/הַ/לַּ֥יְלָה אָ֝מַ֗ר הֹ֣רָה גָֽבֶר׃
translation:
  text: May the day on which I was born perish, and the night that said, “A male child has been conceived.”
  philosophy: dynamic
lexical_decisions:
- source_word: יֹאבַד
  chosen: May ... perish
  alternatives:
  - let ... perish
  - perish
  lexicon: HALOT
  rationale: The jussive/imprecatory force is best conveyed in English with 'May ... perish,' expressing Job's curse-wish rather than a simple future 'will perish.'
- source_word: יוֹם
  chosen: the day
  alternatives:
  - day
  lexicon: HALOT
  rationale: 'Definite in sense in context: the specific day of Job''s birth is in view.'
- source_word: אִוָּלֶד בּוֹ
  chosen: on which I was born
  alternatives:
  - in which I was born
  - when I was born
  lexicon: HALOT
  rationale: The Niphal of ילד is passive/reflexive in sense, 'I was born.' English idiom prefers 'on which' with 'day' rather than the more literal 'in which.'
- source_word: וְהַלַּיְלָה
  chosen: and the night
  alternatives:
  - even the night
  lexicon: HALOT
  rationale: Coordinates the second object of Job's curse, parallel to 'the day.'
- source_word: אָמַר
  chosen: that said
  alternatives:
  - which said
  - saying
  lexicon: HALOT
  rationale: The night is personified as making an announcement; 'that said' preserves the personification naturally in English.
- source_word: הֹרָה
  chosen: has been conceived
  alternatives:
  - has conceived
  - was brought forth
  lexicon: HALOT
  rationale: The perfect presents conception as an accomplished event in the night’s personified announcement.
- source_word: גָבֶר
  chosen: a male child
  alternatives:
  - a male child
  - a boy
  lexicon: HALOT
  rationale: In this conception/birth setting the term marks the offspring as male; “male child” avoids implying an adult while retaining the sex-specific force.
