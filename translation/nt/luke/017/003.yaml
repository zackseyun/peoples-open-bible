  rationale: The Greek is masculine singular. Per doctrine, gender-accurate rendering is preferred. Because the referent may be representative within the disciple community, an inclusive explanatory footnote is appropriate without altering the main text.
  doctrine_reference: Translation philosophy §4
- issue: Contextual repentance reassessment
  chosen_reading: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use if he repents in the interpersonal forgiveness instruction, not the artificial reflexive reorients himself; no test of completed reform is added.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
