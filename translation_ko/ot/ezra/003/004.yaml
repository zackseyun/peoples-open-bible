source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ אֶת חַ֥ג הַ/סֻּכּ֖וֹת כַּ/כָּת֑וּב וְ/עֹלַ֨ת י֤וֹם בְּ/יוֹם֙ בְּ/מִסְפָּ֔ר כְּ/מִשְׁפַּ֖ט דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/004.yaml
  text: They kept the Festival of Booths as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required.
translation:
  language: ko
  text: 그들은 기록된 대로 초막절을 지켰으며, 날마다 드리는 번제를 수대로, 규례에 따라 각 날에 요구되는 대로 드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכּוֹת
  english_pob_choice: Festival of Booths
  chosen_korean: 초막절
  alternatives_korean:
  - 초막 축제
  - 장막절
  lexicon: חַג / סֻכּוֹת
  rationale: 히브리어 절기명은 한국어 성경에서 널리 통용되는 ‘초막절’로 옮기되, 절기 자체를 드러내는 간결한 표현을 유지했습니다.
- source_word: כַּכָּתוּב
  english_pob_choice: as it is written
  chosen_korean: 기록된 대로
  alternatives_korean:
  - 기록된 그대로
  - 기록된 바와 같이
  lexicon: כָּתוּב
  rationale: 문자적으로 ‘기록된 대로’가 자연스럽고, 성경적 권위에 근거한 준수라는 뜻을 직접 살렸습니다.
- source_word: עֹלַת יוֹם בְּיוֹם
  english_pob_choice: the daily burnt offerings
  chosen_korean: 매일 드리는 번제물
  alternatives_korean:
  - 날마다 드리는 번제물
  - 일일 번제물
  lexicon: עֹלָה
  rationale: עֹלָה는 제의적으로 ‘번제물’이 적합하며, POB의 ‘daily’는 한국어에서 ‘매일 드리는’으로 풀어 자연스럽게 반영했습니다.
- source_word: כְּמִשְׁפַּט דְּבַר יוֹם בְּיוֹמוֹ
  english_pob_choice: according to the ordinance, as each day required
  chosen_korean: 각 날에 정해진 규례에 따라
  alternatives_korean:
  - 날마다 요구되는 대로
  - 각 날의 법도에 따라
  lexicon: מִשְׁפָּט / דְּבַר יוֹם בְּיוֹמוֹ
  rationale: ‘ordinance’의 규범적 의미를 ‘규례’로 살리고, 뒤의 관용적 표현은 ‘각 날에 정해진’으로 압축해 중복 없이 전달했습니다.
theological_decisions:
- issue: 절기 준수와 제사 집행의 동사 선택
  chosen_reading: ‘지켰으며… 드렸습니다’로 번역해 절기 준수와 제의 행위를 분명히 구분했습니다.
  alternative_readings:
  - ‘행하였으며… 바쳤습니다’
  - ‘지켰고… 바쳤습니다’
  rationale: 본문은 절기를 ‘지키다’와 번제를 ‘드리다’로 병렬 서술하므로, 한국어에서도 예배적 행위의 차이를 보존하는 것이 좋습니다.
  doctrine_reference: 출 12장, 레 1장과의 제의적 용례
- issue: ‘매일’과 ‘수대로’의 관계
  chosen_reading: ‘매일 드리는 번제물을 수대로’로 옮겨 반복성과 정량성을 모두 유지했습니다.
  alternative_readings:
  - ‘날마다 수대로 번제물을’
  - ‘매일의 번제물을 수대로’
  rationale: 본문의 강조점은 제사 종류와 수량, 그리고 날마다의 규정 준수에 있으므로 둘 다 살리는 구성이 적절합니다.
  doctrine_reference: 민 28:24의 절기 제사 규정
