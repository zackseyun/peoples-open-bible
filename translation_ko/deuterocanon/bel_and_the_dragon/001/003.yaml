  source_fidelity: 그리스어 τοῖς Βαβυλωνίοις는 단순히 ‘가운데에’라기보다 ‘바빌로니아 사람들에게/바빌로니아 사람들이 섬기는’이라는 귀속·소유의 여격으로 읽는 것이 더 직접적입니다. εἰς αὐτόν은 벨을 위해 지출된다는 뜻이므로 ‘그 우상에게’보다 비인격 대상에 맞는 표현이 적절합니다.
  naturalness: ‘바빌로니아 사람들에게는 … 우상이 있었고’와 ‘그것을 위해 … 소비되었습니다’가 현대 표준 한국어에서 자연스럽고, 본문의 공적·서술적 문체에도 맞습니다.
  terminology: εἴδωλον은 ‘우상’, Βήλ은 ‘벨’, σεμίδαλις는 ‘고운 가루’, ἀρτάβη는 음역한 ‘아르타바’로 유지합니다. 각주의 단위 설명은 근거 범위를 좁혀 ‘고대의 곡물 부피 단위’로 고칩니다.
