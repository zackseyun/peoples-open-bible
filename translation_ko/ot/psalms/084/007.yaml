base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/007.yaml
  text: They go from strength to strength[a]; each one appears before God[b] in Zion.
  footnotes:
  - marker: a
    text: Baca may echo the Hebrew word for 'weeping'; hence, 'the Valley of Weeping.'
    reason: alternative_reading
  - marker: b
    text: Or 'the autumn rain.' The Hebrew word can also mean 'teacher,' but in this context it is commonly understood as seasonal rain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 힘에서 힘으로[a] 나아가며, 저마다 시온에서 하나님 앞에 나타납니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무리에서 무리로’ 또는 ‘승리에서 승리로’라고 할 수 있습니다. 히브리어 ‘힘’은 힘, 용맹, 군대나 무리를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘하나님께 나타납니다’입니다. 예배와 순례의 문맥에서는 하나님 앞에 자신을 드러내거나 나아간다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבְרֵי / בְּעֵמֶק
  english_pob_choice: as they pass through the Valley
  chosen_korean: 그들이 바가의 골짜기를 지날 때에
  alternatives_korean:
