    prior_rendering: that she had come
    new_rendering: that she had returned
    rationale: She is coming back to her own city after entering the enemy camp; “returned” conveys what makes her arrival astonishing in this narrative.
  - source_phrase: ἀπεδέξαντο αὐτάς
