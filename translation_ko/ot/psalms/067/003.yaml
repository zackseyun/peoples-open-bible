  text: 하나님, 민족들이[b] 주를 찬송하게 하소서.[a] 모든 민족들이 주를 찬송하게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사형은 기원·청원의 뜻으로 ‘찬송하게 하소서’라고 옮겼습니다. 문법상 미래로도 옮길 수 있으나, 이 문맥에서는 청원으로 읽는 것이 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: ‘민족들’은 여러 백성 집단 또는 민족들을 통틀어 가리킵니다.
    reason: lexical_alternative
