  to: 'Then say to them, ‘This is what Yahweh of hosts, the God of Israel, says: I am sending for Nebuchadnezzar king of Babylon, my servant, and I will bring him here. I will set his throne over these stones that I have hidden, and he will spread his canopy[a] over them.'
