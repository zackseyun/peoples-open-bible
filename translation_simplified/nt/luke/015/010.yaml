translation:
  language: en
  text: 'The same is true, I tell you: there is joy in the presence of God’s angels when one sinner reorients toward God[r1].[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording does not explicitly say that the angels themselves are rejoicing.
    reason: alternative_reading
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: In the same way, I tell you
  simplified_phrase: The same is true, I tell you
  preserved_meaning: Jesus applies the preceding parable directly to his hearers.
  reasoning_layer_used: Lexical decision for οὕτως and its comparative force.
  rationale: The revised transition states the comparison in more natural English.
- pob_phrase: before the angels of God
  simplified_phrase: in the presence of God’s angels
  preserved_meaning: The joy occurs before the heavenly angels without naming them as its agents.
  reasoning_layer_used: Theological decision on the location and agent of the joy.
  rationale: The fuller phrase is clearer while preserving the documented ambiguity.
translation_notes:
  risk_flags:
  - risk: Readers may still assume that the angels are the ones rejoicing.
    mitigation: The main text uses “in the presence of,” and the footnote preserves the ambiguity.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
