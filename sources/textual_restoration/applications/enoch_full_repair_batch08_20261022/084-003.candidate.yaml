translation:
  text: For you made all things, and you rule over everything. No deed is too hard for you—not even one.[a] Wisdom
    does not depart from the place of your throne or turn away from your presence.[b] You know and see and hear
    everything, and nothing is hidden from you.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Not even one concludes the statement about deeds. Charles prints the duplicated and not one in square
      brackets and calls it dittography in printed162note11; it is not repeated as an uncontested clause in the
      English. Wisdom begins a distinct personified statement.
    reason: textual_variant
  - marker: b
    text: Place of your throne follows Charles’s explicitly reconstructed text, not an uncontested manuscript reading.
      Printed162notes12-13 identify an emended passing/departing verb and transposition of another verb, and change
      a state/condition form into a place/seat form. Primary Dillmann1865columns654-655 support the place/seat/throne
      sense family. The photographed terminal glyph of the first starred noun is transcribedት on direct print comparison;
      no expected construct vowel is silently supplied.
    reason: textual_variant
  - marker: c
    text: Charles prints the concluding for you see all things in square brackets and identifies it as a gloss in
      printed162note18. It remains in the source but is not repeated as an unqualified running-English clause.
    reason: textual_variant
