translation:
  text: 'I.1. I was fasting and sitting on a mountain. I was thanking the Lord for everything he had done
    with me. I see the shepherd sitting beside me. He says, “Why have you come here so early?” I say,
    “Because, sir, I am keeping a station[a].”


    I.2. He says, “What is a station?” I say, “Sir, I am fasting.” He says, “What is this fast that you
    keep[b]?” I say, “Sir, I fast as I usually do.”


    I.3. He says, “You do not know how to fast to the Lord[c]. This useless fast you keep for him is no
    fast.” I say, “Sir, why do you say this?” He says, “I tell you, what you think is fasting is no fast.
    But I will teach you what a complete fast acceptable to the Lord is.” I say, “Yes, sir. You will make
    me happy if I learn the fast acceptable to God[d].” He says, “Listen.”


    I.4. “God does not want such an empty fast. By fasting to God this way, you will do nothing for righteousness.
    Instead, keep this kind of fast to God[e]:”


    I.5. “Do nothing evil in your life. Serve the Lord with a pure heart. Keep his commandments and walk
    in his ordinances. Do not let an evil desire rise in your heart. Trust God. If you do these things,
    fear him, and keep yourself from every evil deed, you will live to God. If you do these things, you
    will complete a great fast acceptable to God[f].”


    II.1. “Listen to the parable I am about to tell you. It concerns fasting[g].”


    II.2. “Someone had a field and many servants. He planted a vineyard in part of the field. He chose
    a faithful, pleasing, honored servant[h] and called him. He says, ‘Take this vineyard that I planted.
    Fence it until I come[i], and do nothing else to it. Keep this command of mine, and you will be free
    with me.’ Then the servant’s master went away on a journey.”


    II.3. “After the master left, the servant set to work and fenced the vineyard. When he finished, he
    saw that it was full of weeds.”


    II.4. “The servant thought, ‘I have finished this command of my master. Now I will dig the vineyard.
    It will look better when dug. Without weeds to choke it, it will give more fruit.’ He set to work,
    dug the vineyard, and pulled out all its weeds. The vineyard became very beautiful and flourishing.
    It had no weeds to choke it.”


    II.5. “After a time, the master of the servant and of the field[j] came and entered the vineyard.
    He saw that it was well fenced and dug. All the weeds were pulled out, and the vines were flourishing.
    He rejoiced greatly[k] at the servant’s work.”


    II.6. “He called his beloved son, who was his heir, and his friends, who were his advisers. He tells
    them everything he had told the servant to do and everything he found done. They rejoiced with the
    servant because of what the master said about him.”


    II.7. “He says, ‘I promised this servant freedom if he kept the command I gave him[l]. He kept my
    command and did more good work in the vineyard. He has pleased me greatly. In return for this work,
    I want to make him co-heir with my son. When he thought of what was good, he did not neglect it. He
    did it.’”


    II.8. “The master’s son agreed with this decision: the servant should become co-heir with the son[m].”


    II.9. “A few days later, his master held a dinner[n]. He sent the servant many dishes from it. The
    servant received the food his master sent[o]. He took enough for himself and shared the rest among
    his fellow servants.”


    II.10. “His fellow servants received the food and rejoiced. They began to pray that he would find
    greater favor with the master, because he had treated them this way.”


    II.11. “The master heard everything that had happened. He again rejoiced greatly at the servant’s
    action. He called his friends and his son together again. He told them what the servant had done with
    the food he had received[p]. They approved all the more that the servant should become co-heir with
    his son.”'
