theological_decisions:
- issue: Context-sensitive reorientation terminology
  chosen_reading: Yet you judged them little by little, giving them room to reorient toward you. You knew that their origin[a] was evil, that their wickedness was inborn, and that their way of thinking would remain unchanged forever.
  alternative_readings:
