translation:
  language: en
  text: God’s righteousness[a] comes through faith in Jesus Christ[b], for all who believe. There is no distinction between people.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “God’s justice.”
    reason: lexical_alternative
  - marker: b
    text: Or “through the faithfulness of Jesus the Messiah.”
    reason: alternative_reading
  - marker: c
    text: In this context, Paul especially means there is no distinction between Jews and Gentiles.
    reason: simplification_note
simplification_decisions:
- pob_phrase: the righteousness of God
  simplified_phrase: God’s righteousness
  preserved_meaning: The wording retains righteousness as the main term and keeps justice as an alternative.
  reasoning_layer_used: POB lexical and theological decisions for δικαιοσύνη θεοῦ
  rationale: The possessive form is more natural in common English without narrowing what God’s righteousness means.
- pob_phrase: And the righteousness of God through faith
  simplified_phrase: God’s righteousness comes through faith
  preserved_meaning: The sentence still presents faith as the means through which God’s righteousness is received or manifested.
  reasoning_layer_used: Immediate context and POB chosen reading
  rationale: Adding a verb makes the continuing Greek clause understandable when read on its own.
- pob_phrase: there is no distinction
  simplified_phrase: There is no distinction between people
  preserved_meaning: All who believe stand without the distinction Paul has been discussing.
  reasoning_layer_used: Romans 3:9, 3:22–23, and 3:29
  rationale: Naming the people being compared prevents the statement from sounding undefined.
interpretive_expansions:
- pob_phrase: the righteousness of God through faith
  rendering: God’s righteousness comes through faith
  claim: The clause states that faith is the means through which God’s righteousness comes to believers.
  evidence:
  - The preceding verse says God’s righteousness has been revealed.
  - The POB renders διὰ πίστεως as “through faith.”
  confidence: high
  alternatives_preserved:
  - The phrase may include both God’s righteous action and the status he grants.
- pob_phrase: there is no distinction
  rendering: There is no distinction between people
  claim: The distinction concerns groups of people, especially Jews and Gentiles in Paul’s argument.
  evidence:
  - Romans 3:9 places Jews and Greeks alike under sin.
  - Romans 3:29 explicitly contrasts Jews and Gentiles.
  confidence: high
  alternatives_preserved:
  - The wording “between people” keeps the statement broader than the Jew-Gentile example alone.
translation_notes:
  risk_flags:
  - risk: “Comes” could be heard as making “of God” mean only “from God.”
    mitigation: The main phrase remains “God’s righteousness,” preserving its broader theological range.
  - risk: “Between people” makes the implied comparison explicit.
    mitigation: The footnote identifies the immediate Jew-Gentile context without limiting the main text to those labels.
