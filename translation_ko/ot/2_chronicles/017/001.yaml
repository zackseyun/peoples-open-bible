id: 2CH.17.1
reference: 2 Chronicles 17:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּמְלֹ֛ךְ יְהוֹשָׁפָ֥ט בְּנ֖/וֹ תַּחְתָּ֑י/ו וַ/יִּתְחַזֵּ֖ק עַל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/001.yaml
  text: And Jehoshaphat his son became king in his place, and he strengthened himself against Israel.
translation:
  language: ko
  text: 그리고 그의 아들 여호사밧이 그의 자리를 이어 왕이 되었고, 이스라엘에 맞서 자신의 세력을 강화했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 즉위했습니다
  - 통치하게 되었습니다
  lexicon: מלך
  rationale: 히브리어 동사 מלך의 기본 의미를 자연스러운 서술형 합쇼체로 옮겼습니다. 예식적 ‘즉위’도 가능하지만 본문은 간명한 왕위 계승 서술입니다.
- source_word: בְּנוֹ תַּחְתָּיו
  english_pob_choice: his son ... in his place
  chosen_korean: 그의 아들 ... 그의 자리를 이어
  alternatives_korean:
  - 그의 아들 ... 그를 대신하여
  - 그의 아들 ... 그 자리에
  lexicon: בן + תחת
  rationale: 직계 계승과 대체의 의미를 함께 살리기 위해 ‘그의 자리를 이어’로 옮겼습니다. ‘그를 대신하여’도 가능하지만 한국어에서는 계승의 연속성이 약간 더 분명합니다.
- source_word: וַיִּתְחַזֵּק עַל יִשְׂרָאֵל
  english_pob_choice: he strengthened himself against Israel
  chosen_korean: 이스라엘에 맞서 스스로 강해졌습니다
  alternatives_korean:
  - 이스라엘을 상대로 힘을 굳혔습니다
  - 이스라엘에 대항하여 세력을 강화했습니다
  lexicon: חזק + על
  rationale: עַל 이 전치사는 단순한 ‘위에’가 아니라 적대·대항의 방향을 띱니다. English POB의 ‘against’를 따라, 공격적 관계를 드러내는 ‘맞서’로 옮겼습니다.
theological_decisions:
- issue: 왕위 계승과 정치적 적대의 서술을 어떻게 처리할지
  chosen_reading: 본절은 유다 왕 여호사밧의 즉위와 이스라엘에 대한 정치적 대비/긴장 고조를 함께 서술하는 역사 서술로 읽었습니다.
  alternative_readings:
  - ‘강해졌다’를 일반적 번영으로 약화시켜 읽는 해석
  - ‘against’를 단순한 중립적 방향으로 완화하는 번역
  rationale: 히브리어 עַל 과 영어 POB의 against는 관계의 긴장과 대립성을 보존합니다. 이를 약화하면 본문의 정치적 뉘앙스가 사라집니다.
  doctrine_reference: 역사서 본문의 서술 정확성; 왕권 계승과 이스라엘-유다 관계의 문맥
