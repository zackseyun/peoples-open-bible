  from: But Jesus[a], turning and seeing her, said, “Take courage, daughter[b][c]; your faith has saved you.” And the woman was healed from that hour.
  to: But Jesus[a], turning and seeing her, said, “Take courage, daughter[b][c]; your faith has made you well.” And the woman was made well from that hour.
  rationale: The participial phrase 'turning and seeing her' interrupts the subject ('Jesus') and the verb ('said'), so it needs to be set off by commas on both sides. Alternatively, rendering with finite verbs ('But Jesus turned and saw her, and said') would be even more natural in English. The Greek uses the exact same verb (σῴζω) for Jesus' declaration and the narrator's confirmation. Translating it with two different English words ('saved' and 'healed') obscures the direct verbal link. Furthermore, the theological note claims this 'preserves rather than collapses the semantic tension,' but splitting the translation actually resolves the tension for the reader by assigning one specific meaning to each clause. Using a consistent rendering (like 'made well' or 'healed' or 'saved' for both) better preserves the author's deliberate repetition and the inherent dual meaning.
