  rationale: The current rendering "participants in the altar" is slightly awkward in English, as one is not typically "in" an altar. While the intended meaning (participation in the sacrificial system represented by the altar) is understandable, the preposition is not idiomatic. The genitive after κοινωνοί can imply association or partnership. Using "with" ("participants with the altar") better reflects this sense of partnership, treating the altar as the locus of the fellowship. This change maintains the drafter's choice of "participants" while improving the naturalness of the English phrase.
