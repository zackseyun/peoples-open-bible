  rationale: Revised 'lodging' to 'dwelling' for a more natural rendering of παροικία. Added a comma for clarity. Changed 'that sets the lawless ablaze' to 'flaming against the lawless' to more directly reflect φλογίζούσης without introducing an awkward relative clause not present in the Greek.
