  from: To those who make war on them they shall neither give nor supply grain[a], weapons, silver, or ships, as Rome has decided; and they shall keep their obligations, taking nothing.
  to: They shall neither give nor supply grain, weapons, money, or ships to those at war with Rome or its allies, as Rome has decided; they shall fulfill their treaty obligations without accepting anything in return.
  rationale: The earlier decisions correctly identify treaty obligations and explain that “taking nothing” concerns receiving something in return. I make those meanings explicit and prefer the financial sense of ἀργύριον over the earlier source-transparent “silver.”
