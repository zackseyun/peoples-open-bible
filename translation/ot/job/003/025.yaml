  from: For the dread I dreaded has come upon me[b][a], and what I feared has come to me.
  to: For the terror I feared[a] has come upon me, and what I feared has come to me[b].
  rationale: “The dread I dreaded” is an unnecessarily gloss-like English reproduction of the Hebrew cognate construction. “The terror I feared” retains both the noun and verb, conveys the heightened fear, and is natural English. The contrast between “came upon me” and “came to me” is real and may be noted, but its marker should attach to “me,” not stand after the sentence punctuation.
