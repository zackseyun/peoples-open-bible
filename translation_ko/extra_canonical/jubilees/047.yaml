revisions:
- from: '1[4]. 그리고 일곱째 해 일곱째 주, 곧 마흔칠째 희년에 네 아버지가 가나안 땅에서 오셨고, 네째 주 곧 여섯째 해, 마흔여덟째 희년에 네가 태어났느니라.

    2. 그 때가 이스라엘 자손에게 고난의 때였더라. 애굽 왕 바로가 그들에게 명하여 그들의 아들 곧 태어난 남자는 다 강에 던지라 하였더라.

    3. 그리고 그들은 네가 태어난 날까지 일곱 달 동안 그것들을 계속 던져 넣었다[3]. 그리고 네 어머니가 석 달 동안 너를 숨겨 두었는데, 너 때문에 사람들이 그 사실을 알게 되었다. 그리고 그녀는 당신을 위해 바구니를 만들어 역청과 역청을 바르고 그것을 강둑 갈대 사이에 두었습니다. 그리고 당신을 그 안에 7일 동안 두었습니다. 네 어미가 밤에 와서 너를 기르고 낮에는 네 누이 미리암이 새들로부터 너를 지켜 주었느니라.

    4. 그 때에 바로의 딸 달뭇이 나일강에 목욕하러 왔다가 너희가 우는 소리를 듣고 자기 여종들에게 이르되

    5. “그 사람을 나에게 데려오세요.” 그리고 그들은 당신을 그녀에게 데려왔습니다. 그리고 그 여자가 당신을 바구니에서 꺼내고 당신을 불쌍히 여겼습니다.

    6. 네 여동생이 그에게 말했다. “내가 가서 히브리 여인 중 한 사람을 불러다가 그를 젖 먹이고 씻어 줄 것입니까?”

    7. 그리고 그 여자가 그에게 “가십시오.”라고 말했습니다. 그 사람이 가서 네 어머니 요게벳을 불러 품삯을 주고 너를 먹여 주었느니라.

    8. 그 후에 네가 자라서 바로의 딸에게로 인도되어 네가 그의 아들이 되었느니라 그리고 네 아버지 아므람은 너에게 글쓰기를 가르쳤고, 네가 삼 주를 마친 후에 너를 데리고 왕궁에 들어갔다.

    9. 네가 삼 주 동안 뜰에 있으면서 왕궁에서 나오다가 애굽 사람이 네 동무 곧 이스라엘 자손 중 하나를 치는 것을 보았느니라.

    10. 그리고 당신은 그를 죽여 모래 속에 숨겨 두었습니다. 그리고 둘째 날에는 이스라엘 자손 중 두 사람이 싸우는 것을 보시고, 부당하게 행한 자에게 “네가 어찌하여 네 형제를 치느냐?”

    11. 그가 노하여 다투어 이르되 누가 너를 우리의 통치자와 재판관으로 세웠느냐 네가 어제 애굽 사람을 죽인 것 같이 나도 죽이려느냐 그리고 당신은 이 일 때문에 두려워서 도망쳤습니다.

    12. 그리고 마흔아홉째 희년 셋째 주 여섯째 해에 너희가 떠나 미디안 땅에 다섯 이레 일 년 동안 거하다가 그 이레에 너희가 애굽으로 돌아왔으니...'
  to: '1. 그리고 일곱 번째 주간, 일곱 번째 해, 마흔일곱 번째 희년에는 네 아버지가 가나안 땅에서 왔고, 너는 네 번째 주간, 여섯 번째 해, 마흔여덟 번째 희년에 태어났습니다.

    2. 그것은 이스라엘 자손에게 고난의 때였습니다. 이집트 왕 파라오는 그들에 관하여 명령을 내려, 그들의 자녀들, 곧 태어난 모든 남자아이를 강에 던지게 했습니다.

    3. 그리고 그들은 네가 태어난 날까지 칠 개월 동안 그것들을 계속 던져 넣었습니다. 그리고 네 어머니는 석 달 동안 너를 숨겼는데, 너 때문에 사람들이 그녀를 알아차렸습니다. 그리고 그녀는 너를 위해 바구니를 만들고, 역청과 아스팔트를 발라서, 강가의 갈대 사이에 그것을 두었고, 너를 그 안에 칠 일 동안 두었습니다. 그리고 네 어머니가 밤에 와서 너에게 젖을 먹였고, 낮에는 마리아가 너를 지켰습니다.

    4. 그 무렵, 바로의 딸 다르뭇이 강에서 목욕하려고 나왔다가 네가 우는 소리를 듣고 자기 여종들에게 말하였습니다.

    5. 그 무렵, 파라오의 딸 타르무트가 강에서 목욕하려고 나갔습니다. 그가 당신이 우는 소리를 듣고, 자기 시녀들에게 당신을 데리고 나오라고 말했습니다.

    6. …그가 당신을 데려오게 하였고, 그가 당신을 그녀에게 데려왔습니다. 그녀가 당신을 바구니에서 꺼내어 가엾게 여기셨습니다. 그러자 당신의 누이가 그녀에게 말했습니다. “제가 가서 당신을 위해 히브리 여자들 가운데 한 사람을 불러, 그 아이를 기르고 젖을 먹이게 할까요?”

    7. 그러자 왕의 딸이 그 여자에게 “가라” 하고 말했습니다. 그 여자가 가서 네 어머니 요게벳을 불렀습니다. 왕의 딸은 그에게 품삯을 주었고, 네 어머니는 너에게 젖을 먹였습니다.

    8. 그리고 그녀가 그녀에게 말했습니다. “가거라.” 그러자 그녀는 가서 당신의 어머니 요게벳을 불러왔고, 그녀에게 당신을 주었습니다.

    9. 그리고 삯이 지불되었고, 그녀는 당신에게 젖을 먹여 길렀습니다. 그 후 당신이 자라자 그들은 당신을 파라오의 딸에게 데려갔고, 당신은 그녀의 아들이 되었습니다. 당신의 아버지 암람은 당신에게 글을 쓰는 법을 가르쳤으며, 당신이 세 이레, 곧 스물한 해를 마쳤을 때 그는 당신을 궁정으로 데려갔습니다.

    10. 그리고 당신은 왕의 궁정에 세 주간의 해 동안 있었습니다. 그러다가 왕의 궁정에서 나가던 날, 한 이집트 사람이 당신의 동족, 곧 당신의 형제들 가운데 한 사람을 때리는 것을 보았습니다.

    11. 당신은 그를 죽여 모래 속에 숨겼습니다. 이튿날, 이스라엘 자손 둘이 싸우는 것을 보았고, 잘못을 저지르고 있던 사람에게 말했습니다. “왜 때립니까?”

    12. “네 형제.” 그리고 그는 분노하고 격분하여 말했습니다. “누가 너를 우리 위에 통치자와 재판관으로 세웠느냐? 네가 어제 이집트 사람을 죽인 것처럼 나를 죽이려 하느냐?” 그리고 그는 이 일 때문에 두려워하여 도망쳤습니다.'
