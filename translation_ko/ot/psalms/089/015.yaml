  to: 기쁨의 환호를 아는 백성에게는 복이 있습니다.[a] 야훼여, 그들은 주님의 얼굴 빛 가운데서 걸어갑니다.[b]
  rationale: 원문을 우선하여 89:15 전체를 새로 번역했습니다. אַשְׁרֵי는 ‘복이 있습니다’로, יוֹדְעֵי תְרוּעָה는 예배적·축제적 함의를 지나치게 한정하지 않는 ‘기쁨의 환호를 아는’으로 옮겼습니다. בְּאוֹר פָּנֶיךָ는 ‘주님의 얼굴 빛 가운데서’로 번역하여 빛과 얼굴의 이미지를 보존했습니다. ‘걸어갑니다’는 יְהַלֵּכוּן의 지속적 삶·행보의 비유를 유지합니다.
