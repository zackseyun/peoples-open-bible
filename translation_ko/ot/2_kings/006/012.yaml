revisions:
- from: 그러자 그의 종들 중 하나가 말했습니다. “아닙니다, 왕이시여. 오히려 이스라엘에 있는 예언자 엘리사가 이스라엘 왕에게 당신이 침실에서 하는 말들을 알려 줍니다.”
  to: 그러나 그의 신하들 가운데 한 사람이 말했습니다. “아닙니다, 왕이시여. 오히려 이스라엘에 있는 예언자 엘리사가 이스라엘 왕에게 임금님께서 침실에서 하시는 말씀을 알려 줍니다.”
  rationale: The revision replaces the overly consequential transition with an adversative one and uses appropriate honorific Korean for a servant addressing and referring to his king. It otherwise retains the draft’s faithful rendering of Elisha’s disclosure of words spoken in the king’s private chamber.
  reviewer_model: gpt-5.6-terra
