lexical_decisions:
- source_word: ἐνθυμηθῆναι περὶ αὐτῆς
  english_pob_choice: thinking about her
  chosen_korean: 그녀를 생각하는 것
  alternatives_korean:
  - 그녀를 마음에 두는 것
  - 그녀를 숙고하는 것
  lexicon: ἐνθυμέομαι
  rationale: 단순한 기억이 아니라 지혜를 향한 내적 숙고를 가리키므로, 과장하지 않으면서도 사유의 행위를 드러내는 ‘생각하는 것’으로 옮겼습니다.
- source_word: φρονήσεως τελειότης
  english_pob_choice: the perfection of understanding
  chosen_korean: 분별의 완성
  alternatives_korean:
  - 이해의 완전함
  - 지혜의 완성
  lexicon: φρόνησις
  rationale: φρόνησις는 단순 지식보다 실천적 분별을 뜻하므로, 한국어의 자연스러운 의미를 살려 ‘분별’로 옮겼고 τελειότης는 ‘완성’으로 처리했습니다.
- source_word: ἀγρυπνήσας δι' αὐτὴν
  english_pob_choice: stays awake because of her
  chosen_korean: 그녀 때문에 깨어 있는 사람
  alternatives_korean:
  - 그녀를 위해 깨어 있는 사람
  - 그녀를 위하여 밤을 새우는 사람
  lexicon: ἀγρυπνέω
  rationale: 영문 POB의 ‘because of her’를 반영해 목적보다 원인/동기를 살렸습니다. ‘깨어 있는’은 단순한 수면 부재가 아니라 지혜를 위해 깨어 경계하는 태도를 나타냅니다.
- source_word: ἀμέριμνος ἔσται
  english_pob_choice: will quickly be free from care
  chosen_korean: 곧 염려가 없게 될 것입니다
  alternatives_korean:
  - 곧 걱정이 사라질 것입니다
  - 머지않아 근심이 없을 것입니다
  lexicon: ἀμέριμνος
  rationale: ἀμέριμνος의 핵심은 근심/염려의 부재이므로 ‘염려가 없게 될 것입니다’로 직역 성격을 유지했습니다. 부사 ταχέως는 문맥상 ‘곧’으로 간결하게 처리했습니다.
theological_decisions:
- issue: 지혜를 여성 대명사로 유지할지 여부
  chosen_reading: 그녀
  alternative_readings:
  - 그것
  - 그분
  rationale: 본문의 αὐτῆς는 지혜를 여성화한 인칭을 유지하므로, 이를 한국어에서도 ‘그녀’로 살려 본문의 인격화와 시적 장치를 보존했습니다.
  doctrine_reference: Wisdom literature personification
