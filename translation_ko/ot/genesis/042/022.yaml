  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: ko
  text: 그러자 르우벤이 그들에게 대답하며 말했습니다. “내가 너희에게 ‘그 아이에게 죄를 짓지 말라’고 말하지 않았습니까? 그런데 너희는 듣지 않았습니다. 이제 보십시오, 그의 피도 요구되고 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן רְאוּבֵן אֹתָם לֵאמֹר
  english_pob_choice: Then Reuben answered them, saying
  chosen_korean: 그러자 르우벤이 그들에게 대답하며 말했습니다
  alternatives_korean:
  - 그때 르우벤이 그들에게 응답하여 말했습니다
  - 르우벤이 그들에게 대답했습니다
  lexicon: ענה
  rationale: ענה는 단순한 ‘대답하다’이지만 서술 흐름을 자연스럽게 살리기 위해 ‘대답하며 말했습니다’로 옮겼고, 아들들 ‘그들에게’를 분명히 드러냈습니다.
- source_word: אַל תֶּחֶטְא֥וּ בַּיֶּלֶד
  english_pob_choice: Do not sin against the boy
  chosen_korean: 그 아이에게 죄를 짓지 말라
  alternatives_korean:
  - 그 아이에게 죄를 범하지 말라
  - 그 소년에게 죄를 짓지 말라
  lexicon: חטא
  rationale: חטא는 단순한 실수보다 도덕적·관계적 죄책을 뜻하므로, POB의 직접적 어감을 따라 ‘죄를 짓지 말라’로 옮겼습니다.
- source_word: וְגַם דָּמוֹ ... נִדְרָשׁ
  english_pob_choice: And now, look, his blood is being required
  chosen_korean: 이제 보십시오. 그의 피가 요구되고 있습니다
  alternatives_korean:
  - 이제 보라. 그의 피가 찾고 있습니다
  - 이제 보십시오. 그의 피값이 요구되고 있습니다
  lexicon: דרשׁ + דם
  rationale: דרשׁ는 법적/신적 책임 추궁의 뜻을 담으므로 ‘요구되고 있습니다’로 옮겼고, ‘look’을 그대로 살려 경고의 전환점을 유지했습니다.
theological_decisions:
- issue: ‘his blood’의 책임 추궁 표현
  chosen_reading: 그의 피가 요구되고 있습니다
  alternative_readings:
  - 그의 피에 대한 책임이 추궁되고 있습니다
  - 그의 피값이 요구되고 있습니다
  rationale: 히브리어 수동형은 유혈의 책임이 하나님 앞에서 소환되는 장면을 나타내므로, 직접적이되 과도한 설명을 덧붙이지 않는 표현을 택했습니다.
  doctrine_reference: 창 4:10; 겔 3:18-19
