  from: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
  to: Very early in the morning, while it was still dark, Jesus got up, left the house, and went to a deserted place, where he prayed.
  rationale: The lexical decisions establish both the predawn timing and movement away from the lodging, which are retained. The earlier preference for a separate English expression for every movement and for a progressive prayer verb is not needed to convey the scene naturally.
