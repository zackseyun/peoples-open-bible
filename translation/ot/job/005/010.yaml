id: JOB.5.10
reference: Job 5:10
source:
  edition: WLC
  text: הַ/נֹּתֵ֣ן מָ֭טָר עַל פְּנֵי אָ֑רֶץ וְ/שֹׁ֥לֵֽחַ מַ֝יִם עַל פְּנֵ֥י חוּצֽוֹת־־־׃
translation:
  text: He gives rain on the face of the earth and sends water over the open country,
  philosophy: dynamic
lexical_decisions:
- source_word: הַנֹּתֵן
  chosen: who gives
  alternatives:
  - the one who gives
  - giving
  lexicon: HALOT
  rationale: Qal participle with article functions substantivally, continuing the description of God from the previous verse. 'Who gives' fits smooth English while preserving the participial, relative-clause force.
- source_word: מָטָר
  chosen: rain
  alternatives:
  - shower
  - rainfall
  lexicon: HALOT
  rationale: Standard term for rain/precipitation. 'Rain' is the natural and sufficiently formal English equivalent.
- source_word: עַל־פְּנֵי אָרֶץ
  chosen: on the face of the earth
  alternatives:
  - upon the earth
  - over the land
  lexicon: HALOT
  rationale: Literally 'on the face/surface of the earth/land.' Retaining 'face' preserves Hebrew imagery and parallelism with the second colon. 'Earth' is preferred here over 'land' because the statement is general rather than localized.
- source_word: וְשֹׁלֵחַ
  chosen: and sends
  alternatives:
  - and dispatches
  - sending
  lexicon: HALOT
  rationale: Qal participle parallel to הַנֹּתֵן. 'And sends' preserves the verbal parallelism and reads naturally in English.
- source_word: מַיִם
  chosen: water
  alternatives:
  - waters
  lexicon: HALOT
  rationale: Though morphologically plural in Hebrew, מַיִם is commonly rendered as the English mass noun 'water.' Singular English is idiomatic here.
- source_word: עַל־פְּנֵי חוּצוֹת
  chosen: over the open country
  alternatives:
  - upon the fields
  - over the countryside
  - on the face of the streets
  lexicon: HALOT
  rationale: In this natural setting, the phrase refers broadly to open outdoor areas; “open country” avoids the false precision of cultivated “fields.”
