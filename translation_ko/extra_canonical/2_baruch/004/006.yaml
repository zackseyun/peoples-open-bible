    issue: ‘그것을’(앞 절들에서 말한 도성)을 모세에게 보여 주었다는 절이 누락되었습니다.
    rationale: 원문에 보이는 ‘모세에게 그것을 보여 주었다’ 및 영어 감사 번역의 ‘showed it to Moses’를 반영하지 않아, 하나님이 모세에게 보여 주신 대상이 성막의 모형뿐인 것으로 축소됩니다.
  - severity: medium
    issue: ‘식양’은 현대 한국어에서 비자연적입니다.
    rationale: 원문의 pattern/likeness에는 ‘모형’이 현대적이며 의미도 명료합니다.
