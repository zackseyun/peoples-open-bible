translation:
  language: en
  text: 'I was deeply grieved about Valens, who once served as an elder among you, because he understands so little about the responsibility entrusted to him. So I warn you: stay away from greed. Be pure and truthful, and avoid every kind of evil.


    If someone cannot control himself in these matters, how can he tell others to do so? Anyone who does not stay away from greed will be polluted by idolatry and judged like the Gentiles who do not know the Lord’s judgment. Indeed, do we not know that God’s holy people will judge the world, as Paul teaches?


    But I have neither found nor heard of any such wrongdoing among you. The blessed Paul labored among you, and from the beginning you yourselves were his “letters.”[1] He speaks proudly of you in all the churches that knew God at that time, because we ourselves did not yet know God.


    Therefore, I am deeply grieved for Valens and his wife. May the Lord grant them true reorientation[a]. You also must be watchful in this matter. Do not treat people like them as enemies. Instead, restore them as weak members who have gone astray, so that you may save your whole body. By doing this, you build one another up.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The meaning of “you yourselves were his letters” is uncertain; it may describe the Philippians as evidence of Paul’s early ministry among them.
    reason: source_note
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
