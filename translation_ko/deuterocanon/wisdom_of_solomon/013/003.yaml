  text: If, then, delighting in their beauty, they supposed them to be gods, let them know how much better than these is their Master; for the creator of beauty created them.
translation:
  language: ko
  text: 만일 그것들의 아름다움을 즐기며 그것들을 신들로 여겼다면, 그것들의 주인이 그것들보다 얼마나 더 뛰어나신지를 알아야 합니다. 아름다움의 창조자께서 그것들을 지으셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεοὺς ὑπελάμβανον
  english_pob_choice: they supposed them to be gods
  chosen_korean: 그것들을 신들로 여겼다면
  alternatives_korean:
  - 그것들이 신들이라고 생각했다면
  - 그것들을 신으로 여겼다면
  lexicon: θεός
  rationale: 다신교적 인식의 내용을 직접 드러내기 위해 ‘신들’로 옮기되, 자연스러운 한국어를 위해 ‘여겼다면’을 사용했습니다.
- source_word: ὁ δεσπότης
  english_pob_choice: their Master
  chosen_korean: 그들의 주인
  alternatives_korean:
  - 그들의 주님
  - 그들의 주인님
  lexicon: δεσπότης
  rationale: δεσπότης의 소유·지배 뉘앙스를 살려 ‘주인’으로 옮기되, 관계 대명사 ‘그들의’로 대조를 분명히 했습니다.
- source_word: ὁ γὰρ τοῦ κάλλους γενεσιούργης
  english_pob_choice: the creator of beauty
  chosen_korean: 아름다움의 창조자
  alternatives_korean:
  - 아름다움을 지으신 분
  - 아름다움의 만드신 분
  lexicon: γενεσιούργης
  rationale: 영어 POB의 ‘creator’를 따르되, 원문의 ‘아름다움의 근원/생성자’라는 수식 관계를 살려 ‘아름다움의 창조자’로 자연스럽게 처리했습니다.
- source_word: ἔκτισεν αὐτά
  english_pob_choice: created them
  chosen_korean: 그것들을 지으셨기 때문입니다
  alternatives_korean:
  - 그것들을 창조하셨기 때문입니다
  - 그것들을 만드셨기 때문입니다
  lexicon: κτίζω
  rationale: κτίζω의 창조 행위를 분명히 드러내기 위해 ‘지으셨다’를 사용했고, 앞의 ‘창조자’와 어휘를 맞췄습니다.
theological_decisions:
- issue: ‘신들’과 유일신 신앙의 대조
  chosen_reading: 본문의 다신적 오인과 창조주-피조물 대비를 직설적으로 보존했습니다.
  alternative_readings:
  - ‘신’으로 단수화해 일반적 우상 개념으로 약화
  - ‘하늘의 존재들’처럼 완화
  rationale: 지혜서는 피조물을 신격화하는 오류를 비판하므로, 복수형 ‘신들’을 유지해야 논증의 날카로움이 살아납니다.
  doctrine_reference: 우상숭배 비판 / 창조주와 피조물의 구별
