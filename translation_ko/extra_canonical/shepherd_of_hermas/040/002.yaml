revisions:
- from: 2. 그러므로 이 두 마음을 품은 자들은 마술사에게 나아와 그들에게 무슨 일이 일어나겠느냐 물으니 그 거짓 선지자는 그 자신에게는 신령한 능력이 없으나 그들의 질문에 따라(그리고 그들의 사악함의 소망에 따라) 그들에게 말하고 그들이 원하는 대로 그들의 영혼을 채워 주느니라.
  to: 2. 그러므로 이 두 마음을 품은 사람들은 점술가를 찾아가듯 그에게 와서, 앞으로 자기들에게 무슨 일이 일어날지를 묻습니다. 그러면 그 거짓 예언자는 자기 안에 신적인 영의 능력이 전혀 없으면서도 그들의 물음에 맞추어[, 또 그들의 악한 욕망에 맞추어] 그들과 말하고, 그들이 바라는 대로 그들의 영혼을 채워 줍니다.
  category: register_archaic_repair
  rationale: 「물으니」의 연결과 「채워 주느니라」의 -느니라 종결은 개역 계열 문어체입니다. 같은 장 3·4절의 합쇼체에 맞추어 두 문장으로 나누고 「묻습니다」「채워 줍니다」로 고쳤습니다. 점복 문맥에 맞게 μάγος를 「점술가」로, πνεύματος θείου를 「신적인 영」으로 옮기고, 4절에 맞추어 「거짓 예언자」로 통일했습니다. 원문의 대괄호 이문은 각주 표지 대신 대괄호로 보존했습니다(52:3의 [주님] 표기와 같은 방식).
