translation:
  language: en
  text: Now, my children, listen as I tell you what I saw about the seven spirits of deceit.[a] This happened in my reorientation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spirits of error” or “spirits of delusion.”
