    issue: 각주 b가 문장 끝에 놓여 있어 ‘마을’이 아니라 전체 인용문에 걸리는 것처럼 보입니다.
    rationale: b는 ϯⲙⲉ/πατρίδι의 어휘적·본문비평적 차이를 설명하므로 ‘마을’ 바로 뒤에 두는 편이 각주 앵커의 범위를 정확히 합니다.
  - severity: low
    issue: 각주 a의 ‘Coptic ⲙⲁⲣⲉ-’라는 표현은 정규화 본문이 ⲙⲉⲣⲉ-임을 반영하지 않습니다.
    rationale: ⲙⲁⲣⲉ-는 제시된 원사본 표기이고, 정규화 텍스트는 ⲙⲉⲣⲉ-입니다. ‘사본의 ⲙⲁⲣⲉ-’라고 하면 필사본 철자와 문법 기능을 모두 정확히 설명합니다.
