translation:
  language: ko
  text: 그분이 나를 소란의 구덩이[a]에서, 진창의 진흙에서 끌어올리셨습니다. 내 발을 반석 위에 세우시고 내 걸음을 굳게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘소란/울부짖음의 구덩이’입니다. ‘소음의 구덩이’로도 옮길 수 있으며, 일부 번역은 이를 해석하여 ‘멸망의 구덩이’ 또는 ‘황량한 구덩이’로 옮깁니다.
    reason: lexical_alternative
