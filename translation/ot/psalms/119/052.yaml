id: PSA.119.52
reference: Psalms 119:52
source:
  edition: WLC
  text: זָ֘כַ֤רְתִּי מִשְׁפָּטֶ֖י/ךָ מֵ/עוֹלָ֥ם יְהוָ֗ה וָֽ/אֶתְנֶחָֽם׀׃
translation:
  text: I remember your ordinances from long ago[a], Yahweh, and I take comfort.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “your judgments from long ago,” which may include God's past acts of justice.
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁפָּטֶיךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone of 'judgments'; 'judgments/rules' preserved as alternatives.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
