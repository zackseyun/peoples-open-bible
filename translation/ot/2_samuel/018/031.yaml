  from: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
  to: Just then the Cushite arrived and said, “Let my lord the king receive the good news, for Yahweh has vindicated you today by delivering you from the power of all who rose up against you.”
