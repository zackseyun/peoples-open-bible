theological_decisions:
- issue: 의인들의 죽음에 대한 표현
  chosen_reading: “의인들은 땅에서 조용히 잠들어 있습니다”로 옮겨, 죽음을 완곡하게 표현하되 원문의 평온한 대조를 유지했습니다.
  alternative_readings:
  - 의인들은 평안히 땅에 누워 있습니다
  - 의인들은 고요히 땅에 잠들어 있습니다
  rationale: 본문은 의인들의 무고한 안식을 강조하므로, 죽음의 현실을 지우지 않으면서도 ‘조용히 잠들다’라는 완곡한 표현이 대비를 가장 잘 살립니다.
  doctrine_reference: 죽음/의인의 안식에 대한 서술적 표현
- issue: 하나님 호칭의 직접 호소
  chosen_reading: ‘주님, 어떻게 이 일을 참으셨습니까?’로 옮겨, 원문의 직접 탄식과 호소를 유지했습니다.
  alternative_readings:
  - 주님, 어떻게 이것을 견디셨습니까?
  - 주님, 어떻게 이를 참으셨습니까?
  rationale: 문맥상 단순 정보 전달이 아니라 감정이 실린 탄원이므로, 합쇼체 안에서 직접 호소의 긴장을 살렸습니다.
  doctrine_reference: 탄식 기도/항의의 수사
