theological_decisions:
- issue: Plural 'spirits' (πνευμάτων ὑμῶν)
  chosen_reading: 'Retained the plural: ''renewal of your spirits.'''
  alternative_readings:
  - 'rendered as a collective singular: ''renewal of your spirit'''
  rationale: Hermas addresses multiple hearers; the plural fits the addressees and preserves the idiom
    of individual inner life in each person without harmonizing to later theological usage.
- issue: '''The world is held together by four elements'''
  chosen_reading: Rendered literally, acknowledging ancient four-element cosmology as Hermas' illustrative
    framework.
  rationale: Maintains the symbolic explanation of the four-legged seat; translation should not modernize
    or correct the ancient cosmology that the text itself uses.
- issue: '"You have the revelation in full; ask nothing further"'
  chosen_reading: Understood as closure of this revelatory sequence for Hermas, not as a universal cessation
    claim.
  rationale: The command governs Hermas' immediate inquiry about this vision; the following clause ('if
    anything is needed, it will be revealed to you') leaves room for subsequent necessary disclosures.
- issue: Contextual repentance reassessment
  chosen_reading: Retain both repentance participles, completely and from their whole heart, with definite
    future newness/foundation and all closing revelation qualifications.
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
