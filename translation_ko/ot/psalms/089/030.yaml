    rationale: 현 초안에는 אִם(만일), בָנָיו(그의 아들들), תּוֹרָתִי(나의 율법), מִשְׁפָּטַי(나의 법규), לֹא יֵלֵכוּן(따라 행하지 않다)이 전혀 반영되지 않았습니다.
  - severity: low
