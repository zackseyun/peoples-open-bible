translation_notes:
  source_alignment_notes: The SBLGNT's structures are closely followed. The participle 'ἀγνοῶν' is translated as 'not knowing' to prevent over-translating it as an active or willful refusal to know. The repetition of 'kindness' matches the Greek repetition of the root.
  readability_notes: []
  compression_notes:
  - No clauses were deleted or heavily compressed, as the three-fold description of God's patience is a crucial theological emphasis that must not be flattened.
  risk_flags:
