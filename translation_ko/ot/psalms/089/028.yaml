  chosen_korean: 땅의 왕들 가운데서 가장 높게
  alternatives_korean:
  - 땅의 왕들 위에
  - 땅의 왕들보다 높게
  - 땅의 왕들 중 가장 높게
  lexicon: HALOT
  rationale: עֶלְיוֹן은 여기서 신적 칭호 ‘지극히 높으신’이 아니라 왕들에 대한 상대적 최상급이므로, 오해를 피하면서 비교 관계를 자연스럽게 드러내는 ‘가운데서 가장 높게’로 번역했습니다.
theological_decisions:
- issue: בְּכוֹר의 왕적·메시아적 긴장
  chosen_reading: ‘첫째’라는 지위를 그대로 살리되, 출생 순서나 메시아 해석을 번역문에 명시적으로 풀어 넣지는 않았습니다.
  alternative_readings:
  - ‘맏아들’로 구체화하기
  - ‘상속자’나 ‘으뜸가는 자’로 의미 번역하기
  rationale: 시편 본문은 다윗 왕조의 왕적 우월성을 말하며, 정경적 읽기에서는 메시아적 의미도 지닙니다. 그러나 히브리어 자체는 지위와 특권의 칭호를 말하므로, 해석을 번역에 과도하게 주입하지 않고 긴장을 보존하는 편이 source-grounded합니다.
  doctrine_reference: 왕적 칭호와 메시아적 성취의 긴장 보존
