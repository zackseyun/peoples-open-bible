id: PSA.76.12
reference: Psalms 76:12
source:
  edition: WLC
  text: יִ֭בְצֹר ר֣וּחַ נְגִידִ֑ים נ֝וֹרָ֗א לְ/מַלְכֵי אָֽרֶץ־׃
translation:
  text: He breaks the spirit of rulers[a]; he is fearsome to the kings of the earth.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “he cuts off the spirit of rulers”; this can also mean “he cuts off the breath of rulers.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְצֹר
  chosen: cuts down
  alternatives:
  - restrains
  - withholds
  - clips
  lexicon: HALOT
  rationale: Avoids the potentially over-specific implication that God removes rulers’ life or breath, while preserving the cutting metaphor and humbling sense.
- source_word: רוּחַ
  chosen: spirit
  alternatives:
  - breath
  - wind
  - temper
  lexicon: HALOT
  rationale: רוּחַ can denote wind, breath, or spirit/disposition. Here, with human rulers as its genitive complement, it most naturally refers to their spirit, courage, or proud inner disposition. 'Spirit' preserves the Hebrew's breadth better than narrowing to 'courage' in the main text.
- source_word: נְגִידִים
  chosen: rulers
  alternatives:
  - rulers
  - leaders
  - nobles
  lexicon: HALOT
  rationale: Naturally renders leaders in authority without adding an implication of princely or hereditary rank.
- source_word: נוֹרָא
  chosen: is fearsome
  alternatives:
  - is awesome
  - is fearsome
  - is to be feared
  lexicon: HALOT
  rationale: Preserves the adjective’s sense of inspiring fear without the modern weakening sometimes associated with “awesome.”
- source_word: לְמַלְכֵי אָרֶץ
  chosen: to the kings of the earth
  alternatives:
  - to the kings of the earth
  - for the kings of the earth
  - among the kings of the earth
  lexicon: HALOT
  rationale: Retains the Hebrew relational construction rather than making the kings’ response fully explicit.
