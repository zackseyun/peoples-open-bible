id: JOB.18.19
reference: Job 18:19
source:
  edition: WLC
  text: לֹ֘א נִ֤ין ל֣/וֹ וְ/לֹא נֶ֣כֶד בְּ/עַמּ֑/וֹ וְ/אֵ֥ין שָׂ֝רִ֗יד בִּ/מְגוּרָֽי/ו־׃
translation:
  text: He has neither child nor grandchild[a] among his people, and no survivor where he lived.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “offspring nor descendant”; the pair emphasizes the extinction of his family line.
    reason: alternative_reading
lexical_decisions:
- source_word: נִין
  chosen: child
  alternatives:
  - son
  - descendant
  lexicon: HALOT
  rationale: Within the paired expression, this naturally represents the nearer generation.
- source_word: נֶכֶד
  chosen: grandchild
  alternatives:
  - grandchild
  - descendant
  lexicon: HALOT
  rationale: Paired with the preceding term, it naturally represents the succeeding generation, though a broader descendant sense is possible.
- source_word: בְּעַמּוֹ
  chosen: among his people
  alternatives:
  - in his people
  - among his kin
  lexicon: HALOT
  rationale: עַם commonly means 'people.' With בְּ, the phrase indicates the sphere or community in which he belongs. 'Among his people' is idiomatic English and preserves the communal setting.
- source_word: שָׂרִיד
  chosen: survivor
  alternatives:
  - remnant
  - one left
  lexicon: HALOT
  rationale: שָׂרִיד refers to one who remains or survives after devastation. 'Survivor' is clear modern English; 'remnant' is possible but can sound collective or theologically loaded in ways not required here.
- source_word: בִּמְגוּרָיו
  chosen: where he lived
  alternatives:
  - in his dwellings
  - in his settlements
  - where he lived as an alien
  lexicon: HALOT
  rationale: This gives natural English for his places of residence without overstating the possible sojourner nuance.
