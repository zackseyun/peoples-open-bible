    rationale: ‘말씀하셨습니다’의 ‘-셨-’는 여자의 발화에 존칭을 부여합니다. 그리스어 εἶπας에는 그러한 존칭 표지가 없으며, 직접 상대에게 하는 현대 합쇼체는 ‘잘 말했습니다’로 충분합니다.
