  to: 죄인인 우리 때문에 주께서는 자비로우신 분이라 불리셨습니다. 주께서 우리에게 자비를 베풀고자 하신다면, 그때에는 자비로우신 분이라 불리실 것입니다. 우리는 죄인들이기 때문입니다.
  rationale: 라틴어의 첫 완결문을 빠짐없이 진술문으로 복원하고, 조건문(desideraueris ... miserearis)과 미래 수동 호칭(uocaberis)을 각각 ‘베풀고자 하신다면’과 ‘불리실 것입니다’로 반영했습니다. 마지막 nobis enim의 이유절도 ‘우리는 죄인들이기 때문입니다’로 보존했습니다. 기존 각주는 원문 의미를 추가로 설명하지 못하고 본문의 위치와도 맞지 않아 삭제했습니다.
