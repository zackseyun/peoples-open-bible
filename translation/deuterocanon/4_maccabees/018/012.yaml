lexical_decisions:
- source_word: ἔλεγεν
  chosen: was speaking
  alternatives:
  - said
  - kept saying
  - was telling
  lexicon: BDAG
  rationale: Imperfect tense suggests ongoing or repeated action rather than a simple punctiliar 'said.' 'Was speaking' preserves that aspect in natural English.
- source_word: ζηλωτὴν
  chosen: the zealot
  alternatives:
  - zealous one
  - the zealous man
  lexicon: BDAG
  rationale: The noun denotes one characterized by zeal. 'The zealot' is concise and preserves the appositional force with Phinehas, alluding to his exemplary zeal without importing later party associations as the main sense.
- source_word: Φινεές
  chosen: Phinehas
  alternatives:
  - Phinees
  lexicon: LSJ
  rationale: Standard English biblical transliteration is 'Phinehas.' This follows the project's policy to transliterate names by standard conventions.
- source_word: ἐδίδασκεν
  chosen: were teaching
  alternatives:
  - taught
  - were instructing
  lexicon: BDAG
  rationale: The imperfect again suggests ongoing or exemplary instruction. 'Were teaching' fits the rhetorical sense that their example continued to instruct the hearers.
- source_word: τοὺς ἐν πυρὶ
  chosen: in the fire
  alternatives:
  - those in the fire
  - while in the fire
  - amid the fire
  lexicon: LSJ
  rationale: 'The phrase modifies the three named youths. Because the names immediately follow, English can naturally render the modifier after the names'' referent is identified: ''Hananiah and Azariah and Mishael in the fire.'' This preserves the Greek sense without adding extra words beyond necessity.'
- source_word: Ἀνανίαν καὶ Ἀζαρίαν καὶ Μισαήλ
  chosen: Hananiah and Azariah and Mishael
  alternatives:
  - Ananias and Azarias and Misael
  lexicon: LSJ
  rationale: These are the standard English forms of the Hebrew names rather than more Hellenized forms, consistent with common biblical usage and the project's naming policy.
