  text: וַ/יֵּשְׁבוּ֮ לֶֽ/אֱכָל לֶחֶם֒ וַ/יִּשְׂא֤וּ עֵֽינֵי/הֶם֙ וַ/יִּרְא֔וּ וְ/הִנֵּה֙ אֹרְחַ֣ת יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִ/גִּלְעָ֑ד וּ/גְמַלֵּי/הֶ֣ם נֹֽשְׂאִ֗ים נְכֹאת֙ וּ/צְרִ֣י וָ/לֹ֔ט הוֹלְכִ֖ים לְ/הוֹרִ֥יד מִצְרָֽיְמָ/ה־׃
translation:
  text: Then they sat down to eat. They looked up and saw a caravan of Ishmaelites coming from Gilead, their camels loaded with aromatic gum, balm, and ladanum[a]. They were taking the cargo down to Egypt.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Ladanum is a fragrant resin from the rockrose shrub; the Hebrew term has also been understood as “myrrh.”
    reason: lexical_alternative
