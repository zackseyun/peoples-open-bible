  yaml_path: translation/ot/psalms/055/008.yaml
  text: I would hasten to a refuge[a] for myself from the rushing wind, from the storm.
  footnotes:
  - marker: a
    text: Or “I would hurry to an escape” or “let me hasten to a refuge.” The Hebrew form conveys urgent personal resolve or desire.
