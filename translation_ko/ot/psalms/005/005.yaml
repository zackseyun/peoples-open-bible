  to: 오만한 자들은 주의 눈앞에 설 수 없으며[a], 주께서는 모든 악을 행하는 자들을 미워하십니다[b].
  rationale: 제시된 히브리어 원문(시편 5:5)을 우선하여, 초안에 잘못 들어간 시편 5:4 본문을 교체했습니다. ‘오만한 자들’은 הוֹלְלִים의 도덕적·교만한 뉘앙스를 반영하며, ‘설 수 없다’는 하나님의 면전에서 굳게 서거나 나아갈 수 없다는 뜻을 보존합니다. 하나님이 악을 행하는 이들을 ‘미워하신다’는 직접적 진술도 원문대로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:46:46Z'
