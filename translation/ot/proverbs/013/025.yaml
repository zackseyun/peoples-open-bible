id: PRO.13.25
reference: Proverbs 13:25
source:
  edition: WLC
  text: צַדִּ֗יק אֹ֭כֵל לְ/שֹׂ֣בַע נַפְשׁ֑/וֹ וּ/בֶ֖טֶן רְשָׁעִ֣ים תֶּחְסָֽר׃פ
translation:
  text: A righteous man eats to satisfy his appetite, but the belly of the wicked goes hungry.
  philosophy: dynamic
lexical_decisions:
- source_word: צַדִּיק
  chosen: a righteous man
  alternatives:
  - the righteous
  - a righteous person
  lexicon: HALOT
  rationale: The singular adjective functions substantivally. 'A righteous man' preserves the masculine singular form in line with the gender-accurate policy while still conveying a representative proverb about the righteous person generally.
- source_word: אֹכֵל
  chosen: eats
  alternatives:
  - will eat
  - is eating
  lexicon: HALOT
  rationale: The participle expresses a gnomic or habitual action in proverbial style. Simple present English best captures the general truth.
- source_word: לְשֹׂבַע
  chosen: to satisfy
  alternatives:
  - to fullness of
  - until satisfied
  - to satiety of
  lexicon: HALOT
  rationale: The phrase expresses eating to fullness or satisfaction and is naturally rendered with an English infinitive.
- source_word: נַפְשׁוֹ
  chosen: his appetite
  alternatives:
  - his appetite
  - himself
  - his life
  lexicon: HALOT
  rationale: In the eating context, נפשׁ has its well-attested sense of appetite or desire rather than an English metaphysical “soul.”
- source_word: וּבֶטֶן
  chosen: but the belly
  alternatives:
  - but the stomach
  - but the womb
  lexicon: HALOT
  rationale: In contrast with 'soul,' 'belly' is the natural literal rendering and works idiomatically in English as a metonym for bodily need or appetite. The conjunction is adversative in context, hence 'but.'
- source_word: רְשָׁעִים
  chosen: of the wicked
  alternatives:
  - of wicked people
  - of the guilty
  lexicon: HALOT
  rationale: The plural substantive denotes wicked persons as a class. 'The wicked' is concise and standard in wisdom literature.
- source_word: תֶּחְסָר
  chosen: goes hungry
  alternatives:
  - will be in want
  - is lacking
  - comes up short
  lexicon: HALOT
  rationale: With “belly” as subject, this idiomatically expresses being in want while retaining the Hebrew body image.
