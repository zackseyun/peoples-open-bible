translation:
  text: Zechariah of the family of Iddo; Meshullam of the family of Ginnethon.
  philosophy: dynamic
lexical_decisions:
- source_word: ל/עדיא
  chosen: for Adaiah
  alternatives:
  - of Adaiah
  - to Adaiah
  lexicon: HALOT
  rationale: 'The prefixed ל in this priestly list marks association or representation within the sequence of names, best rendered idiomatically as ''for'' in English: ''for Adaiah, Zechariah.'' ''Adaiah'' is a personal name and is therefore transliterated rather than translated.'
- source_word: זְכַרְיָה
  chosen: Zechariah
  alternatives:
  - Zekariah
  lexicon: HALOT
  rationale: Personal name; standard English transliteration is preferred. In context this is the name corresponding to the family/clan named first in the pair.
- source_word: לְ/גִנְּתוֹן
  chosen: for Ginnethon
  alternatives:
  - of Ginnethon
  - to Ginnethon
  lexicon: HALOT
  rationale: As with the first ל-prefixed name, the preposition functions list-wise to indicate the house or clan represented by the following individual. 'Ginnethon' is transliterated as a proper name.
- source_word: מְשֻׁלָּם
  chosen: Meshullam
  alternatives:
  - Mesullam
  lexicon: HALOT
  rationale: Personal name; standard English biblical transliteration is used. The verse is a compact list entry naming the representative for Ginnethon.
