  source_fidelity: 히브리어 נְצִיבִים은 문맥상 에돔에 설치한 군사 주둔 거점/수비대를 가리키며, ‘수비대’는 가능한 번역입니다. עֲבָדִים은 다윗에 대한 에돔의 강한 예속을 나타내므로 ‘종’이 이를 보존합니다. וַיּוֹשַׁע의 기본 뜻은 ‘구원하다’이며, 전쟁 문맥에서 ‘승리를 주다’라는 영어 POB의 결과 중심 번역과 달리 ‘구원하셨습니다’는 원문의 어휘적 범위를 충실히 살립니다.
  naturalness: ‘다윗에게 종이 되었습니다’보다 ‘다윗의 종이 되었습니다’가 현대 표준 한국어에서 더 자연스럽고, 누구에게 예속되었는지도 명확합니다. ‘수비대를 두었습니다’도 자연스럽지만, 군사 배치의 동작을 분명히 하는 ‘배치하였습니다’를 사용했습니다.
