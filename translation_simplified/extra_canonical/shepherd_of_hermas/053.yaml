translation:
  text: 'VII.1. I say, “Sir[a], I rejoiced when I heard this explanation.” He says, “Listen now. Keep
    this flesh of yours clean and undefiled. This is so that the spirit that dwells in it may bear witness
    to it, and your flesh may be justified[b].”


    VII.2. “Be careful that you never think in your heart that this flesh of yours is perishable, and
    never misuse it in some defilement[c]. For[d] if you defile your flesh, you will also defile the Holy
    Spirit. If you defile the flesh, you will not live[e].”


    VII.3. I say, “But sir, if there was some earlier ignorance before these words were heard, how will
    the person who defiled his flesh be saved?” He says, “Only God can give healing for earlier offenses
    committed in ignorance[f]. All authority is his.”


    VII.4. “But now guard yourself. The Lord, the Almighty, is full of compassion. He will give healing
    for earlier offenses committed in ignorance[g], if from now on you do not defile your flesh or the
    spirit. Both are partners. One cannot be defiled apart from the other. So keep both clean, and you
    will live to God[h].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: Sir addresses the shepherd. The working VII.3 includes sir; Michigan printed59 lacks it by the
      edition’s space argument, while Palatina printed159 includes it. The old reader’s previous-rendering
      note attached the unrelated closing keep-both-clean sentence to I-rejoiced; that mistaken note is
      archived and removed.
  - marker: b
    reason: textual_variant
    text: Working VII.1 has the spirit that dwells in it; holy is not explicit there, though Holy Spirit
      is explicit in VII.2. The lower-case spirit preserves the wording without ruling out the contextual
      Holy Spirit identification. Michigan printed59 has the spirit that dwelt in it, with damage/supplied
      letters, rather than the working present dwells. Palatina printed159 has the present but saved for
      the flesh’s outcome, while Vulgata printed85 has a past indwelling and differently edited judgment
      wording. Justified preserves the working judicial assertion; vindicated is an alternative.
  - marker: c
    reason: lexical_alternative
    text: Rise in your heart is retained as an idiom for a thought occurring to someone. The working warning
      is about treating the flesh as perishable and misusing it; it does not insert an independent assertion
      that ordinary physical mortality is sinful. Clean is retained at both ends of the section, preserving
      the existing reader’s deliberate repeated wording.
  - marker: d
    reason: textual_variant
    text: Working VII.2 brackets for as Gebhardt’s version-supported insertion. Michigan printed59 lacks
      the connective by the edition’s line-length argument, and reported Athos also lacks it. The English
      retains the disclosed working connection, without claiming it is preserved Michigan ink.
  - marker: e
    reason: textual_variant
    text: The1891 working source daggers the flesh in the second warning clause. Michigan printed59 partly
      preserves flesh here (with a following your partly supplied), corroborating reported Athos flesh.
      Palatina printed159 has body/flesh here. Vulgata printed85 has both body and Holy Spirit in this
      clause, and its apparatus reports Spirit-only alternatives in some Latin copies. The draft keeps
      the working flesh and you-will-not-live assertion; it does not replace flesh with Spirit merely
      because an editor suggested that emendation. Raw and normalized critical marks remain intact.
  - marker: f
    reason: lexical_alternative
    text: Former offenses committed in ignorance renders agnoemata in the reply; the question uses singular
      agnoia. Neither is silently narrowed to accidental physical impurity. Only God’s ability to heal
      and his complete authority are both retained.
  - marker: g
    reason: textual_variant
    text: The working VII.4 brackets the full opening through the healing promise as Gebhardt’s version-supported
      restoration against reported Athos omission. Michigan printed60 partly preserves a shorter corresponding
      healing clause; it has pantos, whose force and possible confusion with Almighty are discussed by
      its editor, and it uses heal them rather than the full working former-offenses/give-healing wording.
      The Lord abbreviation at the line break is supplied/damaged. Vulgata printed86 explicitly has Almighty
      and a future healing promise. Palatina printed161 has perhaps and no Almighty. The source does not
      have unanimous wording here; this draft retains the disclosed working title/promise and its no-further-defilement
      condition without silently substituting one version.
  - marker: h
    reason: lexical_alternative
    text: Partners renders koina as shared participation, not profane/unclean. The working text expressly
      says flesh and spirit cannot be defiled apart from each other. Live to God retains the Greek dative;
      live for God is an alternative. Both negatives, the requirement to keep both clean, and the future
      life assertion remain unsoftened.
