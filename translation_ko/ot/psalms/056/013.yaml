source:
  edition: WLC
  text: כִּ֤י הִצַּ֪לְתָּ נַפְשִׁ֡/י מִ/מָּוֶת֮ הֲ/לֹ֥א רַגְלַ֗/י מִ֫/דֶּ֥חִי לְ֭/הִֽתְהַלֵּךְ לִ/פְנֵ֣י אֱלֹהִ֑ים בְּ֝/א֗וֹר הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/013.yaml
  text: For you have delivered my life from death[a]; have you not also kept my feet from falling[b], so that I may walk before God in the light of life[c]?
  footnotes:
  - marker: a
    text: Or “my soul” or “me.” Hebrew nephesh can denote the soul, the life, or the self.
    reason: Records the lexical range while allowing the death-context to govern the main-text choice.
  - marker: b
    text: Or “from stumbling.”
    reason: דֶּחִי can denote a fall or a stumble.
  - marker: c
    text: Or “in the light of the living.”
    reason: Preserves a plausible alternative understanding of the poetic phrase בְּאוֹר הַחַיִּים.
translation:
  language: ko
  text: 주님께서 제 생명을 죽음에서 건져 주셨으니[a], 제 발이 넘어지지 않도록 지켜 주신 것도 아니겠습니까[b]? 이는 제가 하나님 앞에서 생명의 빛 가운데 걸어가도록 하기 위함입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 영혼’, ‘저 자신’. 히브리어 네페쉬는 영혼, 생명, 또는 사람 자신을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘떨어짐에서’. 히브리어는 넘어뜨림이나 넘어짐을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘살아 있는 이들의 빛 가운데’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  english_pob_choice: are upon me
  chosen_korean: 제게 있습니다
  alternatives_korean:
  - 제 위에 있습니다
  - 제게 지워져 있습니다
  - 저를 누르고 있습니다
  lexicon: HALOT
  rationale: עַל + 1인칭 접미사는 의무가 ‘위에 놓인’ 상태를 나타낼 수 있어, 한국어에서는 자연스럽게 ‘제게 있습니다’로 옮겨 의무의 감각을 살렸습니다.
- source_word: נְדָרֶיךָ
  english_pob_choice: Your vows
  chosen_korean: 주님께 드려야 할 서원
  alternatives_korean:
  - 주님의 서원
  - 주님께 드린 제 서원
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘주님의 서원들’이지만, 문맥상 하나님께 지켜야 할 서원을 가리키므로 그 의미를 드러내되 본문의 책임성을 유지해 ‘드려야 할 서원’으로 옮겼습니다.
- source_word: תּוֹדֹת
  english_pob_choice: thank offerings
  chosen_korean: 감사제물
  alternatives_korean:
  - 감사
  - 감사제사
  - 감사의 제물
  lexicon: HALOT
  rationale: 이 명사는 감사의 표현이면서 제의적 제물을 가리킬 수 있으므로, 앞의 서원과 평행을 이루는 제의적 뉘앙스를 살려 ‘감사제물’로 번역했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 오 하나님
  lexicon: HALOT
  rationale: 직접 호격으로 부르는 문맥이므로 한국어 기도체에 맞는 직접 호칭으로 처리했습니다. 시편의 대화적 운율을 살리기 위해 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: ‘Your vows’의 문자성 유지와 의미 전달
  chosen_reading: 본문의 문자적 구조를 완전히 풀어쓰지 않고, 하나님께 대한 서원의 의무가 ‘제게 있습니다’라는 방식으로 의미를 드러냈습니다.
  alternative_readings:
  - 주님께 드린 제 서원
  - 주님의 서원
  rationale: 히브리어는 ‘주님의 서원들’이라는 형태를 유지하므로, 본문이 가진 소유격의 긴장을 지우지 않으면서 한국어로는 자연스러운 책임 표현을 제공했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
