  source_fidelity: 현 초안의 ‘그를 힘으로 빼앗지 못하는 사람은 없습니다’는 원문의 부정 가능 구문(‘누구도 … 할 수 없다’)을 반대로 옮겨 의미가 전도되었습니다. 또한 ‘다만 먼저’는 원문의 조건 접속사 ‘~하지 않고서는/…하지 않는 한’을 충분히 반영하지 못합니다. 목적어 대명사의 지시 대상은 원문에서 논쟁적이므로 한국어 본문에서도 목적어를 생략하여 단정하지 않는 것이 안전합니다. ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ은 ‘뒤엎다’로 유지할 수 있습니다.
