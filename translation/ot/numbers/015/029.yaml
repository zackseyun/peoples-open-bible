id: NUM.15.29
reference: Numbers 15:29
source:
  edition: WLC
  text: הָֽ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם תּוֹרָ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם לָ/עֹשֶׂ֖ה בִּ/שְׁגָגָֽה׃
translation:
  text: The same law shall apply to the native-born Israelite and to the resident foreigner living among you when either acts unintentionally.
  philosophy: dynamic
lexical_decisions:
- source_word: הָאֶזְרָח
  chosen: the native-born Israelite
  alternatives:
  - the native
  lexicon: HALOT
  rationale: The noun identifies a native member of Israel. The expanded English phrase states that legal-social identity clearly.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  chosen: Israelite
  alternatives:
  - among the Israelites
  - among the sons of Israel
  lexicon: HALOT
  rationale: English incorporates the construct's community identification into 'native-born Israelite' without loss.
- source_word: וְלַגֵּר
  chosen: and to the resident foreigner
  alternatives:
  - and to the sojourner
  lexicon: HALOT
  rationale: In this legal context the term denotes a settled nonnative member of the community, not a passing stranger.
- source_word: הַגָּר בְּתוֹכָם
  chosen: living among you
  alternatives:
  - residing among them
  lexicon: HALOT
  rationale: The participle describes settled residence, while English retains the law's direct address to the Israelite community.
- source_word: תּוֹרָה אַחַת
  chosen: The same law
  alternatives:
  - one law
  - the same instruction
  lexicon: HALOT
  rationale: The phrase emphasizes identical legal treatment for both groups. 'The same law' communicates that equality directly.
- source_word: יִהְיֶה לָכֶם
  chosen: shall apply
  alternatives:
  - shall be for you
  lexicon: HALOT
  rationale: In legal English the rule's applicability to the addressed community is naturally expressed with 'shall apply.'
- source_word: לָעֹשֶׂה
  chosen: when either acts
  alternatives:
  - for the one who acts
  lexicon: HALOT
  rationale: The singular generic participle applies to a member of either named group; 'either' makes that legal distribution clear.
- source_word: בִּשְׁגָגָה
  chosen: unintentionally
  alternatives:
  - in error
  - by mistake
  - unwittingly
  lexicon: HALOT
  rationale: The term denotes inadvertence or unintentional wrongdoing in sacrificial/legal contexts. 'Unintentionally' is clear modern English and matches the legal distinction in the passage.
