  from: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
  to: Joab said, “As God lives, if you had not spoken, the men would not have stopped pursuing their brothers until morning[a].”
  rationale: The lexical record correctly understands 'gone up' as withdrawal but leaves the time expression opaque. I follow the immediate exchange in verse 26 while preserving the alternative that Joab blames Abner’s earlier challenge.
