id: PRO.19.2
reference: Proverbs 19:2
source:
  edition: WLC
  text: גַּ֤ם בְּ/לֹא דַ֣עַת נֶ֣פֶשׁ לֹא ט֑וֹב וְ/אָ֖ץ בְּ/רַגְלַ֣יִם חוֹטֵֽא־־׃
translation:
  text: Also, desire without knowledge is not good[a]; whoever rushes headlong[b] sins.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'A person without knowledge is not good.'
    reason: alternative_reading
  - marker: b
    text: Literally, 'hurries with his feet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  chosen: Also
  alternatives:
  - Even
  - Moreover
  lexicon: HALOT
  rationale: Introduces an additional proverb or supporting observation. 'Also' is natural modern English and preserves the additive force without overemphasis.
- source_word: בְּלֹא דַעַת
  chosen: without knowledge
  alternatives:
  - without understanding
  - without discernment
  lexicon: HALOT
  rationale: The preposition plus negation and noun yields 'without knowledge.' 'Knowledge' is the most direct rendering of דַעַת and fits wisdom-literature usage, while allowing the moral-intellectual sense to remain broad.
- source_word: נֶפֶשׁ
  chosen: desire
  alternatives:
  - soul
  - appetite
  - person
  lexicon: HALOT
  rationale: In this construction, “desire” (or appetite) is a well-supported idiomatic sense; the person-reading is retained as an alternative.
- source_word: לֹא טוֹב
  chosen: is not good
  alternatives:
  - is no good
  - is not beneficial
  lexicon: HALOT
  rationale: A straightforward rendering of the predicate. 'Is not good' preserves the Hebrew's simplicity and proverbial tone.
- source_word: וְאָץ
  chosen: whoever hurries
  alternatives:
  - and he who is hasty
  - and one who rushes
  lexicon: HALOT
  rationale: The participle denotes a habitual or characteristic action. 'Whoever hurries' renders the generic force idiomatically in English while preserving the warning against haste.
- source_word: בְּרַגְלַיִם
  chosen: with his feet
  alternatives:
  - with the feet
  - in his steps
  lexicon: HALOT
  rationale: A concrete Hebrew expression for rushing headlong. 'With his feet' keeps the bodily imagery rather than abstracting it away.
- source_word: חוֹטֵא
  chosen: sins
  alternatives:
  - misses the way
  - acts wrongly
  lexicon: HALOT
  rationale: The participle ordinarily denotes wrongdoing/sinning here; hurried feet supply a concrete image for rash action, not an explicit path object.
