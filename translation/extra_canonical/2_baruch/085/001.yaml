  certifies_this_candidate: false
  value:
  - issue: Whether to compress the long catalogue of failed intercessions into a general statement about no one being able to help at the judgment
    chosen_reading: Retained the catalogue of prayers, prophets, righteous people, women, children, and fathers as separate elements.
    alternative_readings:
    - Summarize as 'no intercession will help then'
    rationale: The Syriac rhetoric is cumulative and severe. Keeping the list preserves the chapter’s emphasis on final individual accountability before divine judgment.
    doctrine_reference: DOCTRINE.md §Translation philosophy 3
  - issue: How explicitly to render the final preservation clause
    chosen_reading: Rendered it as 'he will preserve for his age those who have hope in him.'
    alternative_readings:
    - '''those in whom there is hope'''
    - '''those whom he finds worthy'''
    rationale: The Syriac points to people whose hope is set in him; making that relation explicit yields clear English without adding a new theological idea.
    doctrine_reference: DOCTRINE.md §Translation philosophy 1
  - issue: Context-sensitive reorientation terminology
    chosen_reading: '… the times are close and already pressing in. The pitcher is near the well, the ship the harbor, the journey the city, and life its completion.


      So then receive his commandments, that you may not be cut off from the greatness of his mercy, but may find rest and not condemnation.


      For when the Most High brings these things to pass, there will no longer be room for reorientation, or a boundary for the times, or an extension of the seasons, or a turning toward rest; nor will anyone be helped by prayer, or by the mediation of fathers, or by the petition of prophets, or by the aid of the righteous, or by the weeping of women, or by the tenderness of little children, or by the crying of infants, or by the innocence of newborns, or by the righteousness of their fathers. None of the things once thought and seen to be helpers will be able to help.


      For each of us will then be judged by himself alone.


      And he will preserve for his age those who have hope in him, but he will at once destroy those who are defiled with sins.'
    alternative_readings:
    - Traditional repent/repentance wording, preserved at the baseline commit.
    rationale: Use reorient/reorientation without automatically inserting God. The sentence supplies a departure, destination, interpersonal setting, or the work's own conceptual framework. Preserve distinct turning verbs and named wrongdoing.
    doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
