translation:
  text: 'I saw the storehouses of the sun and moon: where they come out and where they go in, their glorious return,
    and how one surpasses the other in glory. Their course is blessed. They do not overstep their course, add to
    it or take away from their course. They keep faith with one another by an oath—“who have dwelt.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The complete unit continues onto printed page83. Charles encloses the final words, literally “who have
      dwelt,” with daggers and calls the text corrupt. His apparatus proposes how a wording about swearing could
      have become one about dwelling, but that conjecture is not silently substituted here. The quoted ending is
      provisional and is not a claim of a coherent recovered clause.
    reason: textual_variant
