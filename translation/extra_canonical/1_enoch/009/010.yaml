translation:
  text: And now, behold, the souls of those who have died cry out and make their appeal as far as the gate of heaven. Their
    lament has ascended and cannot cease because of the lawlessness being committed upon the earth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The wording rendered “cannot cease because of” is more literally, “cannot go out from before the face of the lawlessness.”
      The Ge'ez idiom is difficult; the main text gives its likely contextual sense while preserving the literal form here.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ፡ ናሁ፡
  chosen: And now, behold
  alternatives:
  - And now, look
  rationale: Preserves the temporal transition and the apocalyptic attention formula without archaic wording.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ነፍሰ፡ እለ፡ ሞቱ፡
  chosen: the souls of those who have died
  alternatives:
  - the souls of the dead
  rationale: Keeps the explicit reference to souls and the relative clause, preserving the scene's portrayal of the dead as
    petitioners rather than reducing them to a generic reference to victims.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይጸርኁ፡ ወይስእዩ፡
  chosen: cry out and make their appeal
  alternatives:
  - cry out and plead
  - cry out and bring their complaint
  rationale: The paired verbs depict both an anguished cry and a directed petition. “Make their appeal” conveys the second
    verb's pleading or suit-making force without importing formal modern legal procedure.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እስከ፡ አንቀጸ፡ ሰማይ፡
  chosen: as far as the gate of heaven
  alternatives:
  - up to the gate of heaven
  - to the gates of heaven
  rationale: “As far as” retains እስከ and the spatial ascent of the appeal. The supplied Ge'ez supports singular “gate”; plural
    “gates” is not adopted without a checked secondary witness.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወዓርገ፡ ገዓሮሙ፡
  chosen: Their lament has ascended
  alternatives:
  - their outcry has ascended
  - their groaning has gone up
  rationale: The singular verbal construction treats the collective lament or outcry as ascending. “Lament” preserves both
    grief and vocal complaint.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወኢይክል፡ ወጺአ፡ እምቅድመ፡ ገጸ፡
  chosen: and cannot cease because of
  alternatives:
  - and cannot depart from before
  - and cannot go out from before the face of
  rationale: The clause is literally framed in terms of being unable to go out or depart “from before the face of.” In context,
    the idiom indicates that the lament does not pass away while the provoking lawlessness continues; the less idiomatic wording
    is retained in a footnote for auditability.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዓመፃ፡ ዘይትገበር፡ በዲበ፡ ምድር፡
  chosen: the lawlessness being committed upon the earth
  alternatives:
  - the injustice being done upon the earth
  - the violence being perpetrated upon the earth
  rationale: “Lawlessness” preserves the broad moral and judicial force of ዓመፃ in this judgment context. The passive participial
    wording reflects the ongoing acts rather than turning the term into an abstraction.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
