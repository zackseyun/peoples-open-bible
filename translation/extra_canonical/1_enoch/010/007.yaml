translation:
  text: Bring the earth, which the angels corrupted, back to life, and proclaim life to the earth, so that it may live and
    all the children of humanity may not perish because of all the mysteries[a] that the Watchers [disclosed] and taught to
    their children.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected source daggers the verb ዘቀተሉ, whose presented form gives “killed.” That does not fit the mysteries
      clause naturally. “[Disclosed]” is an explicitly bracketed contextual conjecture in this English, not a silently corrected
      Ethiopic source. Charles discusses the surrounding corruption in printed26notes18–23 and the following apparatus; the
      source marks remain intact.
    reason: textual_variant
lexical_decisions:
- source_word: አሕይዋ
  chosen: bring ... back to life
  alternatives:
  - revive
  - heal
  - restore
  rationale: The causative verb from the root for life means to make alive or revive. “Bring ... back to life” is idiomatic
    English while retaining the witness’s repeated life imagery; “heal” may reflect comparative traditions but is not imposed
    on this Ge'ez wording.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: አማሰኑ
  chosen: corrupted
  alternatives:
  - ruined
  - spoiled
  - defiled
  rationale: The verb describes the angels’ destructive corruption of the earth. “Corrupted” preserves both moral and material
    dimensions without reducing the apocalyptic charge to ordinary physical damage.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ሕይወታ
  chosen: life
  alternatives:
  - revival
  - healing
  - restoration
  rationale: The noun is the ordinary term for life and deliberately echoes the preceding and following verbs from the same
    semantic field. Translating it as “life” preserves that repetition.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: አይድዕ
  chosen: proclaim
  alternatives:
  - announce
  - make known
  rationale: In context this is an imperative of public declaration. “Proclaim” preserves the elevated register of the angelic
    commission.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ውሉደ ሰብእ
  chosen: children of humanity
  alternatives:
  - sons of men
  - human offspring
  - humankind
  rationale: Literally “children/sons of man.” The chosen wording is inclusive, keeps the filial expression, and distinguishes
    humanity from the angelic Watchers.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ምሥጢር
  chosen: mysteries
  alternatives:
  - secrets
  - secret knowledge
  rationale: “Mysteries” retains the apocalyptic and revelatory character of the forbidden knowledge rather than flattening
    it into generic information.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ትጉሃን
  chosen: Watchers
  alternatives:
  - vigilant ones
  - wakeful ones
  rationale: In the Book of the Watchers this is the established class designation for the wakeful angelic beings. Capitalization
    marks it as a group title, not a harmonization with later texts.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: መሀሩ
  chosen: taught
  alternatives:
  - instructed
  rationale: The verb straightforwardly denotes teaching and identifies transmission of forbidden knowledge as the means by
    which humanity is endangered.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
