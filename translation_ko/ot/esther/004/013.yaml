  to: 그러자 모르드개가 에스더에게 이렇게 답변을 전하라고 했습니다. “왕궁에 있다고 해서 당신만 모든 유대인 가운데서 살아남을 수 있다고 생각하지 마십시오.”
  rationale: 간접적으로 에스더에게 답변을 전달하게 한 히브리어 구문을 자연스러운 한국어로 재구성하고, 현대 합쇼체의 호칭과 종결을 일치시켰습니다. 왕궁에 있는 에스더만이 유대인 전체의 재앙에서 예외적으로 피할 수 있다는 잘못된 기대를 경고하는 원문의 의미를 보존했습니다.
