review_pass:
  verdict: revise
  source_fidelity: '현 초안은 시편 61:4(히브리어 절 구분에 따라 61:5로 표기되기도 하는 앞 절)의 ‘장막’과 ‘날개’ 본문 및 셀라를 번역하고 있어, 제시된 WLC 본문(시 61:5: 서원과 기업)과 일치하지 않습니다. 제시된 원문은 하나님께서 화자의 서원을 들으셨고, 하나님의 이름을 경외하는 이들과 관련된 기업을 주셨다고 말합니다. 마지막 절에는 ‘내게’라는 수여 대상이 명시되어 있지 않으므로 본문에 보충하지 않았습니다.'
  naturalness: 개정문은 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. ‘서원을 들으셨으며’는 히브리어의 완료형과 기도·감사의 문맥을 무리 없이 반영하며, ‘주의 이름을 경외하는 이들’은 시적이면서도 이해 가능한 표현입니다.
  terminology: אָהֶל, כְּנָפַיִם, סֵתֶר 등 현 초안의 어휘 결정은 이 절의 원문에 해당하지 않습니다. נְדָרַי는 ‘나의 서원’, יְרֻשַּׁת은 ‘기업/유산’으로 옮기는 것이 적절합니다. יִרְאֵי שְׁמֶךָ는 하나님의 이름을 경외하는 사람들을 가리키므로 ‘주의 이름을 경외하는 이들’로 번역했습니다.
  issues:
  - severity: high
    issue: 절 본문이 원문 및 지정 참조와 불일치합니다.
    rationale: 현 번역은 ‘당신의 장막에서 영원히 거하게 하시며 … 셀라’로, 제공된 WLC 시편 61:5의 ‘나의 서원을 들으셨고 … 기업을 주셨습니다’와 전혀 다른 절을 번역합니다.
  - severity: high
    issue: 현 각주와 어휘·신학 결정이 잘못된 절에 근거합니다.
    rationale: 장막, 날개, 영원히, 셀라에 관한 각주와 설명은 제공된 원문에 존재하지 않는 요소이므로, 해당 절의 번역 근거 및 각주로 유지될 수 없습니다.
  - severity: medium
    issue: 마지막 절에 ‘내게’를 본문으로 보충해서는 안 됩니다.
    rationale: 히브리어 נָתַתָּ יְרֻשַּׁת יִרְאֵי שְׁמֶךָ에는 수여 대상 ‘내게’가 명시되어 있지 않습니다. 문맥상 가능한 이해는 각주로만 제시하는 것이 원문의 문법적 여지를 보존합니다.
  revised_text: 하나님, 주께서는 나의 서원을 들으셨으며, 주의 이름을 경외하는 이들의 기업을 주셨습니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘제게 주의 이름을 경외하는 이들의 기업을 주셨습니다.’ 히브리어에는 ‘제게’에 해당하는 수여 대상이 명시되어 있지 않습니다.
    reason: alternative_reading
  - marker: b
    text: ‘주의 이름을 경외하는 이들’은 하나님을 경외하고 공경하며 사는 사람들을 가리킵니다.
    reason: cultural_note
  revision_rationale: 지정된 WLC 본문에 맞추어 번역 전체를 교체했습니다. 접속사 כִּי는 앞 절의 간구 또는 확신에 대한 근거를 나타내므로 한국어에서는 자연스럽게 생략하고, 직접 호격 ‘하나님’을 유지했습니다. ‘나의 서원’과 ‘기업’을 직역에 가깝게 보존했습니다. 마지막 구절의 수여 대상은 원문에 명시되지 않으므로 ‘제게’를 본문에서 제외하고 대안으로 각주 처리했습니다. 현 초안의 셀라 및 장막·날개 관련 요소와 각주는 이 절에 해당하지 않아 삭제했습니다.
