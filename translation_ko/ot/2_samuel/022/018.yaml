  lexicon: נצל
  rationale: 구출·구원의 능동성을 살리기 위해 ‘건져 내다’를 택했고, 합쇼체 서술로 마무리했습니다.
- source_word: אֹיְבִ֖/י עָ֑ז
  english_pob_choice: my strong enemy
  chosen_korean: 강한 원수
  alternatives_korean:
  - 힘센 원수
  - 막강한 원수
  lexicon: אויב + עז
  rationale: עָז의 힘·강함을 직접 반영해 ‘강한’으로 옮겨, 적의 위력을 강조하는 문맥을 보존했습니다.
- source_word: שֹּׂ֣נְאַ֔/י
  english_pob_choice: those who hated me
  chosen_korean: 나를 미워하는 자들
  alternatives_korean:
