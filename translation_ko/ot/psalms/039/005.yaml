source:
  edition: WLC
  text: הִנֵּ֤ה טְפָח֨וֹת נָ֘תַ֤תָּה יָמַ֗/י וְ/חֶלְדִּ֣/י כְ/אַ֣יִן נֶגְדֶּ֑/ךָ אַ֥ךְ כָּֽל הֶ֥בֶל כָּל אָ֝דָ֗ם נִצָּ֥ב סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/005.yaml
  text: Behold, you have made my days mere handbreadths, and my lifetime is as nothing before you. Surely every man[a], though standing firm[b], is altogether vapor[c]. Selah
  footnotes:
  - marker: a
    text: Hebrew uses the generic singular אָדָם, referring here to every human being or all humanity.
    reason: lexical_alternative
  - marker: b
    text: Or “while standing” or “though established.” The expression may portray a person who appears secure.
    reason: lexical_alternative
  - marker: c
    text: Or “mere breath” or “vanity.” Hebrew הֶבֶל evokes something insubstantial and fleeting.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 주께서 제 날들을 몇 뼘으로 정하셨으니, 제 삶의 기간은 주 앞에서 아무것도 아닙니다. 참으로 모든 사람은 굳게 서 있을 때에도 한낱 입김일 뿐입니다.[a] 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한낱 숨결’, ‘헛됨’. 히브리어 הֶבֶל은 입김이나 수증기처럼 실체 없고 덧없는 것을 가리킵니다. ‘굳게 서 있을 때에도’는 히브리어의 ‘서 있는’이라는 표현을 문맥상 옮긴 것이며, ‘서 있는’, ‘확고히 세워진’으로도 이해할 수 있습니다.
    reason: lexical_alternative
