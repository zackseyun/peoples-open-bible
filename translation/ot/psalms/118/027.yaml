id: PSA.118.27
reference: Psalms 118:27
source:
  edition: WLC
  text: אֵ֤ל יְהוָה֮ וַ/יָּ֪אֶר לָ֥/נוּ אִסְרוּ חַ֥ג בַּ/עֲבֹתִ֑ים עַד קַ֝רְנ֗וֹת הַ/מִּזְבֵּֽחַ׀־־׃
translation:
  text: Yahweh is God, and he has given us light. Bind the festival offering with cords to the horns of the altar[a][b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “Bind the festival with cords, up to the horns of the altar.” Another possible understanding is, “Join the festal procession with branches, up to the horns of the altar.”
    reason: alternative_reading
  - marker: b
    text: The altar’s “horns” were projections at its four corners.
    reason: cultural_note
lexical_decisions:
- source_word: אֵל יְהוָה
  chosen: Yahweh is God
  alternatives:
  - The LORD is God Almighty
  - God is the LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: וַיָּאֶר לָנוּ
  chosen: and he has given us light
  alternatives:
  - and he has shone on us
  - and he has made us shine
  lexicon: HALOT
  rationale: This maintains the Hiphil's causative illumination sense in idiomatic English.
- source_word: אִסְרוּ
  chosen: Bind
  alternatives:
  - Tie
  - Prepare by binding
  lexicon: HALOT
  rationale: The imperative plural from אסר straightforwardly means 'bind, tie.' 'Bind' is the most direct and formal rendering.
- source_word: חַג
  chosen: the festival offering
  alternatives:
  - the festival
  - the festal procession
  - the feast offering
  lexicon: HALOT
  rationale: The altar context and command to bind can support an associated offering, while “offering” avoids the unmarked specificity of “sacrifice”; the note preserves the competing festival/procession interpretation.
- source_word: בַּעֲבֹתִים
  chosen: with cords
  alternatives:
  - with thick ropes
  - with branches
  lexicon: HALOT
  rationale: The noun usually denotes cords/ropes. Some have proposed 'branches' by contextual association with festal processions, but the lexical evidence more naturally supports 'cords,' especially with the verb 'bind.'
- source_word: עַד קַרְנוֹת הַמִּזְבֵּחַ
  chosen: up to the horns of the altar
  alternatives:
  - as far as the horns of the altar
  - to the horns of the altar
  lexicon: HALOT
  rationale: This phrase is rendered quite literally. 'Horns' refers to the altar's projecting corners in sacrificial terminology. 'Up to' preserves עַד without forcing a more interpretive sense.
