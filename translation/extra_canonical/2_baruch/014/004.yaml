  from: like the rest,
  to: like the rest of the nations,
  rationale: The Syriac text typically includes 'of the nations' or 'of the peoples'
    here (e.g., 'ak sharqa d-'amme). Omitting it loses the specific contrast between
    the righteous and the Gentile nations.
