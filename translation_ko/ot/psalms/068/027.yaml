  rationale: 문맥상 텍스트는 여호와의 이름을 직접 가리키므로, 프로젝트 기본어인 학술 음역 '야훼'를 유지했습니다.
- source_word: מִמְּקוֹר יִשְׂרָאֵל
  english_pob_choice: from the fountain of Israel
  chosen_korean: 이스라엘의 샘에서 나온 분
  alternatives_korean:
  - 이스라엘의 샘에서
  - 이스라엘의 근원에서
  - 이스라엘의 샘에서 온 분
  lexicon: HALOT
  rationale: מָקוֹר의 핵심 이미지는 '샘/근원'이므로 이를 살렸고, 히브리어의 생략된 지시 대상을 반영해 '나온 분'을 덧붙여 문장을 한국어로 완결했습니다.
theological_decisions:
- issue: בָּרְכוּ의 한국어 동사 선택
  chosen_reading: 예배적 '찬양하십시오'로 옮겼습니다.
  alternative_readings:
  - 직역형 '축복하십시오'
  - 전통교회식 '송축하십시오'
  rationale: 히브리어에서 하나님이 대상일 때 ברך는 실제로 복을 주는 행위라기보다 경배와 찬송의 선언이므로, 한국어로는 의미가 자연스럽게 드러나는 표현을 택했습니다.
  doctrine_reference: 시편의 예배 언어와 ברך 용례
- issue: מִמְּקוֹר יִשְׂרָאֵל의 생략 처리
  chosen_reading: 엘립시스를 반영해 '이스라엘의 샘에서 나온 분'으로 풀었습니다.
  alternative_readings:
  - 단순 부사구 '이스라엘의 샘에서'
  - 주어를 드러내지 않는 직역
  rationale: 문구가 시적으로 압축되어 있어, 한국어에서는 문법상 생략된 호응 대상을 보충해 의미를 분명히 하되, 원문의 이미지인 '샘/근원'은 보존했습니다.
  doctrine_reference: 시적 엘립시스 처리
