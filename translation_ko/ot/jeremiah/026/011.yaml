source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ הַ/כֹּהֲנִ֤ים וְ/הַ/נְּבִאִים֙ אֶל הַ/שָּׂרִ֔ים וְ/אֶל כָּל הָ/עָ֖ם לֵ/אמֹ֑ר מִשְׁפַּט מָ֨וֶת֙ לָ/אִ֣ישׁ הַ/זֶּ֔ה כִּ֤י נִבָּא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את כַּ/אֲשֶׁ֥ר שְׁמַעְתֶּ֖ם בְּ/אָזְנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/011.yaml
  text: Then the priests and the prophets said to the officials and to all the people, saying, “A sentence of death is for this man, because he has prophesied against this city, just as you have heard with your own ears.”
translation:
  language: ko
  text: 그러자 제사장들과 예언자들이 관리들과 온 백성에게 말하였습니다. “이 사람은 사형 선고를 받아야 합니다.[a] 그가 여러분이 직접 귀로 들은 대로 이 성읍을 거슬러 예언하였기 때문입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁפַּט מָוֶת은 직역하면 ‘죽음의 판결’이며, 여기서는 법적 사형 선고를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֶל은 이 문맥에서 단순한 ‘대하여’보다 ‘거슬러/against’의 뉘앙스를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט מָוֶת
  english_pob_choice: A sentence of death
  chosen_korean: 사형 선고
  alternatives_korean:
  - 죽음의 판결
  - 사형
  lexicon: מִשְׁפָּט + מָוֶת
  rationale: 법적 판결의 결과를 가리키므로, ‘사형 선고’가 판결성과 형벌성을 함께 드러냅니다.
- source_word: לָאִישׁ הַזֶּה
  english_pob_choice: for this man
  chosen_korean: 이 사람에게는
  alternatives_korean:
  - 이 사람에게
  - 이 사람에게 해당합니다
  lexicon: לְ + אִישׁ + הַזֶּה
  rationale: 히브리어는 ‘이 사람에게 속한다/해당한다’는 귀속 표현에 가깝고, 한국어에서는 자연스럽게 ‘-에게는’으로 옮겼습니다.
- source_word: כִּי נִבָּא אֶל הָעִיר הַזֹּאת
  english_pob_choice: because he has prophesied against this city
  chosen_korean: 그가 이 성읍을 거슬러 예언하였으므로
  alternatives_korean:
  - 그가 이 성읍에 대하여 예언하였으므로
  - 그가 이 성읍을 향해 예언하였으므로
  lexicon: נבא + אֶל
  rationale: 여기서 אֶל은 단순 ‘대하여’보다 적대적 방향을 띠므로, 영어 POB의 ‘against’에 맞춰 ‘거슬러’로 옮겼습니다.
- source_word: וְאֶל כָּל הָעָם
  english_pob_choice: and to all the people
  chosen_korean: 그리고 온 백성에게
  alternatives_korean:
  - 그리고 모든 백성에게
  - 그리고 모든 사람에게
  lexicon: כָּל הָעָם
  rationale: 히브리어 관용구를 표준적인 성경 문체의 ‘온 백성’으로 옮겨 군중 전체를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 예언에 대한 법적·공동체적 반응의 표현
  chosen_reading: ‘사형 선고’로 옮겨, 예언자들의 발언이 단순한 비난이 아니라 사법적 처분 요구임을 드러냈습니다.
  alternative_readings:
  - ‘죽을 죄’
  - ‘죽음의 판결’
  rationale: 본문의 מִשְׁפַּט מָוֶת은 도덕적 평가보다 판결 선고를 강조하므로, 공동체 앞에서 내려진 사법적 주장이라는 긴장을 보존해야 합니다.
  doctrine_reference: 본문 해석상 문맥 보존 원칙
- issue: 예언의 방향성
  chosen_reading: ‘이 성읍을 거슬러 예언하였으므로’로, נגד/אל의 대립성을 반영했습니다.
  alternative_readings:
  - ‘이 성읍에 대해 예언하였으므로’
  - ‘이 성읍을 향해 예언하였으므로’
  rationale: 문맥상 문제는 중립적 발화가 아니라 도시를 향한 적대적 예언으로 규정된 점이므로, 한국어에서도 그 긴장을 유지했습니다.
  doctrine_reference: 본문 문맥 보존 원칙
