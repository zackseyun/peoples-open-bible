  from: But the chief of the eunuchs said to Daniel[a], “I fear my lord the king, who assigned your food and your drink[c][b]. Why should he see your faces looking worse than the youths who are of your own age? Then you would endanger my head with the king.”
  to: But the chief of the eunuchs said to Daniel, “I fear my lord the king, who assigned your food and drink. Why should he see you looking less healthy[a] than the other young men your age? Then you would put me in danger of losing my head to the king.”
