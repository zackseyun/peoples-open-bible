source:
  edition: WLC
  text: יְר֣אוּ אֶת יְהוָ֣ה קְדֹשָׁ֑י/ו כִּי אֵ֥ין מַ֝חְס֗וֹר לִ/ירֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/009.yaml
  text: Fear Yahweh, his holy ones[a], for those who fear him lack nothing.[b]
  footnotes:
  - marker: a
    text: Or “his saints.” Hebrew “his holy ones.”
    reason: lexical_alternative
  - marker: b
