revisions:
- from: 지휘자에게. 「‘지워 버리지 마소서.’」 다윗의 시[a]. 믹담. 사울이 보낸 때에[b], 그들이 집을 지켜 그를 죽이려 하였습니다.
  to: 나의 원수들에게서 나를 건져 주소서, 나의 하나님이시여. 나를 치고 일어나는 자들에게서 나를 높은 곳에 두소서.
  rationale: 원문 절의 두 명령형 청원을 모두 반영하도록 본문을 전면 교체했습니다. ‘나의 하나님이시여’는 אֱלֹהָי의 직접 호격을 보존하고, ‘치고 일어나는 자들’은 מתקוממי의 적대적 대항을 자연스럽게 드러냅니다. ‘높은 곳에 두소서’는 שגב의 구체적 높은 피난처 비유를 유지하며, 보호라는 함의를 과도하게 명시하지 않습니다. 원문에 없는 시편 표제와 그에 따른 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:09:04Z'
