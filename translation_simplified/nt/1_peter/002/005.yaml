translation:
  language: en
  text: Like living stones, you yourselves, too, are being built as a spiritual house to be a holy priesthood.[a] This is so that you may offer spiritual sacrifices acceptable to God through Jesus Christ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “for a holy priesthood” or “into a holy priesthood.” The Greek can describe either the goal or the result of this building.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: you yourselves also, as living stones
  simplified_phrase: Like living stones, you yourselves, too
  preserved_meaning: The readers are emphatically included with Christ in the living-stone image from the preceding context.
  reasoning_layer_used: POB lexical decisions for αὐτοὶ, καὶ, and ὡς λίθοι ζῶντες
  rationale: The comparison was moved to the front, and “too” was placed beside the emphasized subject, producing more natural English while retaining both “yourselves” and the additive connection to Christ.
- pob_phrase: are being built up as a spiritual house into a holy priesthood
  simplified_phrase: are being built as a spiritual house to be a holy priesthood
  preserved_meaning: The readers are undergoing an ongoing building process as a spiritual house, with their identity as a holy priestly body presented as its goal or result.
  reasoning_layer_used: POB lexical decisions for οἰκοδομεῖσθε, οἶκος πνευματικός, and εἰς ἱεράτευμα ἅγιον; POB alternative reading “to be a holy priesthood”; independent grounding review
  rationale: This removes the difficult sequence “as ... into” without coordinating the house and priesthood as two equally verbalized results. The documented wording “to be a holy priesthood” keeps their relationship clear, while the footnote preserves the Greek preposition’s goal-or-result range. The passive voice remains intact, and no agent is added.
- pob_phrase: to offer spiritual sacrifices acceptable to God
  simplified_phrase: This is so that you may offer spiritual sacrifices acceptable to God
  preserved_meaning: Offering spiritual sacrifices is the purpose or function associated with being built as a holy priesthood, and these sacrifices receive God’s acceptance.
  reasoning_layer_used: Source purpose infinitive ἀνενέγκαι; POB lexical decisions for ἀνενέγκαι, πνευματικὰς θυσίας, and εὐπροσδέκτους θεῷ; independent grounding review
  rationale: The long sentence was divided for readability, but “This is so that” explicitly carries the purpose relationship into the new sentence. “May offer” avoids turning the infinitive into a detached command. The sacrificial image and the unspecified nature of the sacrifices remain unchanged.
- pob_phrase: through Jesus the Messiah
  simplified_phrase: through Jesus the Messiah
  preserved_meaning: Jesus the Messiah is the mediator through whom the sacrifices are acceptable to God.
  reasoning_layer_used: POB lexical and theological decisions for διὰ Ἰησοῦ Χριστοῦ; regression fix restoring “Messiah” as a title with the English article
  rationale: The wording was retained because it is clear and preserves the project’s source-driven rendering of Χριστός as the title “the Messiah.”
interpretive_expansions:
- pob_phrase: to offer spiritual sacrifices
  rendering: This is so that you may offer spiritual sacrifices
  claim: The offering of spiritual sacrifices is the purpose or function connected with the community’s formation as a holy priesthood, rather than a detached command.
  evidence:
  - The source uses the infinitive ἀνενέγκαι after the construction concerning the holy priesthood.
  - The POB preserves the connection with the wording “into a holy priesthood, to offer spiritual sacrifices.”
  - The independent grounding review identifies the infinitive as expressing the purpose or function of the priesthood.
  confidence: high
  alternatives_preserved:
  - to offer spiritual sacrifices
retained_terms:
- term: living stones
  reason: The source’s central building image connects the readers with Christ, the living stone, and should not be flattened into a general statement about community.
- term: spiritual house
  reason: This is a key biblical metaphor in the source and remains understandable in context.
- term: holy priesthood
  reason: The term preserves the collective priestly identity expressed by ἱεράτευμα rather than reducing it to individual priests.
- term: spiritual sacrifices
  reason: The source deliberately leaves the exact nature of the sacrifices unspecified, so the biblical expression is retained.
- term: Messiah
  reason: POB’s theological policy treats Χριστός here as a title and renders it in English as “the Messiah.”
translation_notes:
  source_alignment_notes: The revision preserves the emphatic subject, the additive link with Christ, the living-stone comparison, and the ongoing passive building process without naming an agent. It no longer coordinates “spiritual house” and “holy priesthood” as two separately formed results. The main text uses a documented POB alternative for εἰς, while the footnote preserves its goal-or-result ambiguity. The purpose infinitive remains functionally connected to the priesthood, and the sacrificial language, God’s acceptance, mediation through Jesus, and the title “the Messiah” are all retained.
  readability_notes:
  - The comparison opens the verse in ordinary English word order.
  - The dense source sentence is divided into two sentences.
  - “This is so that you may offer” clearly preserves purpose without sounding like a separate command.
  - The awkward chain “as a spiritual house into a holy priesthood” is replaced with a documented, more understandable alternative.
  risk_flags:
  - risk: “To be a holy priesthood” can be heard mainly as a result, while εἰς can express either goal or result.
    mitigation: The footnote explicitly gives “for” and “into” alternatives and states the goal-or-result ambiguity.
  - risk: Dividing the verse into two sentences could detach the offering from the priesthood imagery.
    mitigation: The second sentence begins “This is so that,” explicitly preserving the offering as the purpose or function of the preceding building and priesthood statement.
