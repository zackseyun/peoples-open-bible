base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/003.yaml
  text: “When, then, they are afflicted with every affliction, then they are handed over to me for good discipline, and they are strengthened in the faith of the Lord; and the rest of the days of their life they serve the Lord with a pure heart. And if they repent, then the evil works that they did rise up into their heart; and then they glorify God, saying that he is a righteous judge and that each one suffered justly according to his deeds. Thereafter they serve the Lord with a pure heart, and they prosper in every work of theirs, receiving from the Lord whatever they ask for; and then they glorify the Lord because they were handed over to me, and they no longer suffer any of the evils.”
translation:
  language: en
  text: “After they have suffered every kind of affliction, they are handed over to me so that I may correct and train them. Their faith in the Lord grows stronger, and for the rest of their lives they serve him with pure hearts. When they repent[a], their evil deeds come back to mind. Then they glorify God and say that he judges rightly, and that each of them suffered justly for what they had done. From then on, they serve the Lord with pure hearts. They prosper in all they do and receive from the Lord whatever they ask. Then they glorify the Lord because they were handed over to me, and they no longer suffer any of those evils.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: handed over to me for good discipline
  simplified_phrase: handed over to me so that I may correct and train them
  preserved_meaning: They are entrusted to the speaker for beneficial discipline rather than mere punishment.
  reasoning_layer_used: POB translation and immediate context
  rationale: The active wording explains the purpose of the discipline in common English.
- pob_phrase: each one suffered justly according to his deeds
  simplified_phrase: each of them suffered justly for what they had done
  preserved_meaning: Each person’s suffering is presented as a just consequence of that person’s deeds.
  reasoning_layer_used: POB translation
  rationale: The revision replaces formal phrasing without weakening the claim of individual justice.
interpretive_expansions:
- pob_phrase: they are strengthened in the faith of the Lord
  rendering: Their faith in the Lord grows stronger
  claim: The discipline results in stronger trust and faithfulness toward the Lord.
  evidence:
  - The immediate clause presents strengthened faith as the result of discipline.
  - Their later service with pure hearts confirms a restored relationship to the Lord.
  confidence: high
  alternatives_preserved:
  - They are strengthened in the Lord’s faith.
translation_notes:
  risk_flags:
  - risk: “Come back to mind” makes the heart image less visible.
    mitigation: The wording preserves the image’s contextual force by expressing renewed inner awareness.
  - risk: “Those evils” may refer to afflictions, punishments, or evils more broadly.
    mitigation: The demonstrative remains deliberately broad rather than resolving the referent.
