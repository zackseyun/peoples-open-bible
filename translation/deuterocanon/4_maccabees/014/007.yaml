translation:
  text: O most holy company of seven brothers in harmony! For just as the days at the creation of the world circled around godliness[a],
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “just as at the creation of the world, days around godliness”; the circling motion is understood from the continuation of the comparison.
    reason: lexical_alternative
lexical_decisions:
- source_word: πανάγιε
  chosen: most holy
  alternatives:
  - all-holy
  - utterly holy
  lexicon: LSJ
  rationale: Vocative singular adjective used as an exalted address. 'Most holy' is idiomatic English that preserves the superlative force without sounding overly technical.
- source_word: συμφώνων
  chosen: harmonious
  alternatives:
  - of one accord
  - agreeing
  lexicon: LSJ
  rationale: The participial/adjectival sense conveys concord among the brothers. 'Harmonious' preserves the imagery of being in agreement while reading naturally in English.
- source_word: ἀδελφῶν
  chosen: brothers
  alternatives:
  - siblings
  lexicon: LSJ
  rationale: The Greek is explicitly masculine plural and refers to the seven brothers in the narrative. Per translation philosophy, gender-accurate rendering is preferred.
- source_word: ἑβδομάς
  chosen: seven
  alternatives:
  - heptad
  - group of seven
  lexicon: LSJ
  rationale: The noun denotes a group of seven. 'Seven' in apposition is the most natural English vocative here; 'heptad' would be too technical.
- source_word: κοσμοποιία
  chosen: creation of the world
  alternatives:
  - world-making
  - creation
  lexicon: LSJ
  rationale: The compound refers to the making of the cosmos. 'Creation of the world' is clear, natural, and preserves the cosmological reference.
- source_word: ἡμέραι
  chosen: days
  lexicon: LSJ
  rationale: Straightforward lexical rendering.
- source_word: περὶ τὴν εὐσέβειαν
  chosen: concern godliness
  alternatives:
  - have to do with piety
  - relate to reverence
  lexicon: LSJ
  rationale: εὐσέβεια in 4 Maccabees is a key virtue often rendered 'piety' or 'godliness.' 'Godliness' is accessible modern English and retains the religious-ethical force. The prepositional phrase is somewhat compressed; 'concern godliness' reflects the sense without over-paraphrasing.
