  rationale: The immediate genitive phrase 'of the church in Cenchreae' suggests an identifiable relationship to a local congregation beyond a vague description of helpfulness. Rendering it 'deacon' preserves the lexical possibility of an ecclesial role while not specifying later denominational structures. Because the term is contested in interpretation, alternatives are preserved in a footnote rather than erased.
