translation:
  text: So, walking alone, I was beseeching the Lord to bring to completion the revelations and the visions that he had shown me through his holy Church, so that he would strengthen me and give reorientation[a] to his servants who have stumbled, in order that his great and glorious name might be glorified, because he counted me worthy to show me his wonders.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
