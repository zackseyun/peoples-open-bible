  text: A father to the fatherless and a judge of widows is God in his holy dwelling.
translation:
  language: ko
  text: 하나님은 그의 거룩한 처소에 계시며, 고아들의 아버지이시고 과부들의 재판관이십니다[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
