  text: 저는 주님의 의를 제 마음속에 감추지 않았습니다[a]. 주님의 신실하심과 구원을 말했습니다[b]. 저는 주님의 한결같은 사랑[c]과 진리를 큰 회중에게 숨기지 않았습니다[d].
