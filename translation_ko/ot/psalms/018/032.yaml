id: PSA.18.32
reference: Psalms 18:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י מִ֣י אֱ֭לוֹהַּ מִ/בַּלְעֲדֵ֣י יְהוָ֑ה וּ/מִ֥י צ֝֗וּר זוּלָתִ֥/י אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/032.yaml
  text: God is the one who equips me with strength[a] and makes my way blameless[b].
  footnotes:
  - marker: a
    text: Or 'apart from the LORD' in the first clause and 'besides our God' in the second; both Hebrew expressions convey exclusivity.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 나에게 힘을 두르게 하시며 내 길을 온전하게 하시는 분이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 힘으로 띠우시는 분’. 히브리어는 본래 힘·능력·용맹을 ‘띠우는’ 것으로 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 길을 완전하게 하시는 분’, ‘내 길을 흠 없게 하시는 분’. 히브리어 ‘타밈’은 온전함, 완전함, 성실함 또는 흠 없음을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: “...이겠습니까?”로 이어지는 이유·근거를 자연스럽게 드러내는 연결로 처리
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞 절의 찬양을 받치는 논리적 근거를 제시하는 접속이므로, 한국어에서는 문두의 직접 번역보다 수사적 질문 구조 안에서 자연스럽게 살렸습니다.
- source_word: מִי אֱלֹהַּ
  english_pob_choice: who is God
  chosen_korean: 누가 하나님이겠습니까
  alternatives_korean:
  - 누가 신이겠습니까
  - 하나님이 누구이겠습니까
  lexicon: HALOT
  rationale: אֱלֹהַּ는 여기서 참 하나님을 가리키므로 ‘신’보다 ‘하나님’이 적절하며, 수사적 질문의 긴박함을 살리기 위해 종결형을 사용했습니다.
- source_word: מִבַּלְעֲדֵי יְהוָה
  english_pob_choice: besides Yahweh
  chosen_korean: 야훼 외에
  alternatives_korean:
  - 야훼 말고
  - 야훼를 제외하고
  lexicon: HALOT
  rationale: מִבַּלְעֲדֵי는 배제·독점성을 나타내므로 ‘외에’가 가장 간결하게 그 의미를 보존합니다. יְהוָה는 전통적 대체어인 ‘주님’이 아니라 고유한 신적 이름을 드러내기 위해 ‘야훼’로 옮겼습니다.
- source_word: צוּר זוּלָתִי אֱלֹהֵינוּ
  english_pob_choice: a rock except our God
  chosen_korean: 우리 하나님 외에 누가 반석이겠습니까
  alternatives_korean:
  - 우리 하나님 외에 누가 바위이겠습니까
  - 우리 하나님 말고 누가 반석이겠습니까
  lexicon: HALOT
  rationale: צוּר의 은유는 하나님의 견고함과 보호를 가리키므로 ‘반석’이 시편적 상징을 직접 살립니다. זוּלָתִי와 인칭접미사 ‘우리 하나님’은 배타성과 공동체적 소유를 함께 보존합니다.
theological_decisions:
- issue: 여호와/야훼의 고유명 표기
  chosen_reading: יְהוָה를 ‘야훼’로 옮겨, 일반 호칭이 아니라 언약적 고유명을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 신적 칭호가 아니라 Tetragrammaton을 직접 사용하므로, POB 원칙에 따라 고유명 보존이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: צוּר의 은유성
  chosen_reading: ‘반석’으로 번역해 하나님을 견고함과 보호의 근원으로 묘사하는 시적 은유를 유지했습니다.
  alternative_readings:
  - 바위
  - 견고한 피난처
  rationale: 히브리어는 직함보다 은유적 술어를 사용하므로, 표준적인 시편 어휘인 ‘반석’이 문맥과 신학적 힘을 가장 잘 보존합니다.
  doctrine_reference: 시편의 하나님 표상
