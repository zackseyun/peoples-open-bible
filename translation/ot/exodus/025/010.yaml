id: EXO.25.10
reference: Exodus 25:10
source:
  edition: WLC
  text: וְ/עָשׂ֥וּ אֲר֖וֹן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
translation:
  text: They shall make an ark[a] of acacia wood, two and a half cubits[b] long, a cubit and a half wide, and a cubit and a half high.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: A sacred chest.
    reason: lexical_alternative
  - marker: b
    text: A cubit was roughly the distance from the elbow to the fingertips, about 18 inches (45 centimeters).
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  chosen: They shall make
  alternatives:
  - And they shall make
  - They are to make
  lexicon: HALOT
  rationale: Qal waw-consecutive/imperfect 3cp of עשה in an instructional context is best rendered as a future-like command, 'they shall make.' The initial conjunction is absorbed into natural English rather than retained as a wooden 'and.'
- source_word: אֲרוֹן
  chosen: ark
  alternatives:
  - chest
  - box
  lexicon: HALOT
  rationale: אֲרוֹן denotes a chest or box, but in this tabernacle context 'ark' is the established and contextually precise English term for the sacred container, distinguishing it from ordinary furniture.
- source_word: עֲצֵי שִׁטִּים
  chosen: of acacia wood
  alternatives:
  - of acacia-wood
  - of shittim wood
  lexicon: HALOT
  rationale: The construct phrase literally means 'woods of acacia.' Idiomatic English renders the material as 'acacia wood.' 'Shittim wood' is a traditional transliteration but is less transparent for modern readers.
- source_word: אַמָּתַיִם וָחֵצִי
  chosen: two and a half cubits
  alternatives:
  - two cubits and a half
  lexicon: HALOT
  rationale: This is the standard English way to express the measure while preserving the source unit 'cubits' rather than converting it.
- source_word: אָרְכּוֹ
  chosen: its length
  alternatives:
  - the length of it
  lexicon: HALOT
  rationale: The noun with 3ms suffix refers back to the ark. 'Its length' is concise, natural, and formally accurate.
- source_word: וְאַמָּה וָחֵצִי
  chosen: a cubit and a half
  alternatives:
  - one and a half cubits
  lexicon: HALOT
  rationale: Either English form is possible. 'A cubit and a half' more closely mirrors the Hebrew singular-plus-half construction and reads naturally in a list of dimensions.
- source_word: רָחְבּוֹ
  chosen: its width
  alternatives:
  - the breadth of it
  lexicon: HALOT
  rationale: רֹחַב denotes width/breadth. 'Width' is clearer modern English than 'breadth' while preserving the dimensional sense.
- source_word: קֹמָתוֹ
  chosen: its height
  alternatives:
  - its stature
  lexicon: HALOT
  rationale: In an object-description context, קוֹמָה refers to vertical dimension. 'Height' is the natural English rendering.
