  meaning: Joseph's appointment empowered him to restrain the king's officials at his discretion and teach the king's elders wisdom.
  meaning_decisions:
  - source_phrase: לֶאְסֹר שָׂרָיו
    prior_rendering: to bind his princes
    new_rendering: Joseph had authority to bind the king's officials
    rationale: The infinitive describes the authority resulting from Joseph's appointment. Making the participants explicit prevents confusion, and “officials” conveys the courtly role without suggesting that these men were necessarily royal sons.
  - source_phrase: בְּנַפְשׁוֹ
    prior_rendering: at his pleasure
    new_rendering: as he wished
    rationale: The phrase denotes Joseph's own will or discretion, not enjoyment; the new wording states that sense directly.
  - source_phrase: וּזְקֵנָיו יְחַכֵּם
    prior_rendering: and to teach his elders wisdom
    new_rendering: and to teach the king's elders wisdom
    rationale: The possessive refers to the king, not Joseph; naming its referent makes the scope of Joseph's instructional role clear.
