translation:
  text: 'And Enoch went and said to Azazel[c], “You shall have no peace; a great sentence[a] has gone out against
    you: you will be bound.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or judgment/decree. The noun is juridical and the following clause announces binding, not an already enacted
      capture.
    reason: lexical_alternative
  - marker: b
    text: The selected GeEz finite clause is literally he/it will bind you. The passive English leaves the physical
      binder unstated rather than inventing one.
    reason: lexical_alternative
  - marker: c
    text: The selected GeEz prints Azazel and peace with critical stars. The Greek parallel in the same Charles
      volume spells Asael and has corrupt initial speech/going wording discussed at printed33note9; this rendering
      follows the selected GeEz, not a silent Greek replacement.
    reason: textual_variant
lexical_decisions:
- source_word: ኃሊፎ
  chosen: went
  alternatives:
  - passed on
  - departed
  rationale: The verb marks Enoch's movement before speaking. 'Went' is natural English and preserves the narrative
    sequence without overinterpreting the direction.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ይቤሎ
  chosen: said to
  alternatives:
  - spoke to
  - declared to
  rationale: A standard speech verb. 'Said to' keeps the directness of the address and avoids adding rhetorical
    force not explicit in the Ge'ez.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: አዛዝኤል
  chosen: Azazel
  alternatives: []
  rationale: Personal/supernatural name is transliterated rather than translated, following project policy for names.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ኢይከውከ ሰላም
  chosen: you shall have no peace
  alternatives:
  - peace shall not be yours
  - there will be no peace for you
  rationale: This is a denial of well-being or favorable outcome. 'You shall have no peace' preserves the solemn
    judgment formula and its apocalyptic force.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ዓቢይ
  chosen: great
  alternatives:
  - mighty
  - severe
  rationale: The adjective intensifies the following judgment term. 'Great' is the most direct rendering and leaves
    the nature of the greatness to the context.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ኵነኔ
  chosen: sentence
  alternatives:
  - judgment
  - decree
  - condemnation
  rationale: The context is a formal pronouncement against Azazel. 'Sentence' captures the juridical sense and fits
    the following clause about binding, while 'judgment' remains a viable alternative.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ወጽአ ላዕሌከ
  chosen: has gone out against you
  alternatives:
  - has come forth against you
  - has gone out upon you
  rationale: The idiom conveys an issued decree now directed at Azazel. 'Has gone out against you' preserves the
    image of a pronouncement proceeding forth.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ይእስርከ
  chosen: to bind you
  alternatives:
  - that one may bind you
  - for your binding
  rationale: The verb denotes binding or imprisonment. 'To bind you' gives clear English while retaining the punitive
    imagery central to the verse.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
