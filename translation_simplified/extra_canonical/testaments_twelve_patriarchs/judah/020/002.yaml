translation:
  language: en
  text: I lost my children because of money. If my reorientation[r1], my humility, and my father’s prayers had not helped me, I would have died without children.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Because of silver
  simplified_phrase: because of money
  preserved_meaning: Money was the cause of his loss.
  reasoning_layer_used: POB source text and immediate context
  rationale: “Money” gives the ordinary meaning of “silver” clearly here.
- pob_phrase: my humiliation
  simplified_phrase: my humility
  preserved_meaning: Judah’s humbled or lowly condition aided him without specifying how it arose.
  reasoning_layer_used: POB translation and grounding review
  rationale: “Humility” is clear while preserving the source-level ambiguity.
- pob_phrase: had not come to my aid
  simplified_phrase: had not helped me
  preserved_meaning: These factors prevented the stated outcome.
  reasoning_layer_used: POB sentence logic
  rationale: The simpler verb preserves the counterfactual meaning.
