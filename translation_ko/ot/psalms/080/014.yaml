  naturalness: 수정문은 현대 표준 한국어의 합쇼체 간구 문체로 자연스럽습니다. ‘하늘에서 굽어보시고 보시며’는 히브리어의 연속된 두 시각 동사를 다소 시적으로 보존하면서도 부자연스러운 중복을 피합니다.
