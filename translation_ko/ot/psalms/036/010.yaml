translation:
  language: ko
  text: 주님을 아는 이들에게 주님의 한결같은 사랑을 계속 베풀어 주소서.[a] 마음이 곧은 이들에게도 주님의 의를 베풀어 주소서.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 한결같은 사랑을 펼쳐 주소서’(직역하면 ‘주님의 한결같은 사랑을 끌어 늘이소서’).
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 정의를’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמְּךָ
  english_pob_choice: with you
  chosen_korean: 주님께 있고
  alternatives_korean:
  - 주님과 함께 있고
  - 주님 안에 있고
  lexicon: HALOT
  rationale: עִם + 2인칭 접미사는 관계적 소유와 존재를 함께 드러내므로, 한국어에서는 ‘~께 있고’로 옮겨 생명의 근원이 주님께 있음을 자연스럽게 표현했습니다.
- source_word: מְקוֹר
  english_pob_choice: fountain
  chosen_korean: 샘
  alternatives_korean:
  - 샘물
  - 근원
  lexicon: HALOT
  rationale: מְקוֹר은 샘/샘터의 이미지이므로 ‘샘’이 시적 생동감과 원문 은유를 가장 직접적으로 살립니다.
- source_word: חַיִּים
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 삶
  - 목숨
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 관용적으로 ‘생명’의 추상명사로 기능하므로, 시적 문맥에 맞게 ‘생명’으로 번역했습니다.
- source_word: בְּאוֹרְךָ / אוֹר
  english_pob_choice: in your light we see light
  chosen_korean: 주님의 빛 안에서 우리가 빛을 봅니다
  alternatives_korean:
  - 주님의 빛으로 우리가 빛을 봅니다
  - 주님의 빛으로 우리는 빛을 봅니다
  lexicon: HALOT
  rationale: בְ는 단순 도구성보다 시적 장면을 살리는 ‘안에서’가 적절하며, 반복된 אוֹר를 ‘빛’으로 유지해 원문의 어휘 반복을 살렸습니다.
theological_decisions:
- issue: 히브리 시의 은유를 해석으로 평면화할지 여부
  chosen_reading: ‘생명의 샘’과 ‘주님의 빛 안에서 우리가 빛을 봅니다’라는 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘주님은 생명의 근원이십니다’
  - ‘주님의 빛으로 우리가 진리를 압니다’
  rationale: 시편의 신학은 하나님을 생명과 인식의 근원으로 묘사하는 데 있으며, 이를 설명문으로 바꾸면 원문의 상징성과 긴장이 약해집니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
