translation:
  text: And the middle one reached to heaven, like the throne of the Lord, made of a stone called puk;[a] and the
    top of the throne was of sapphire stone.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Puk transliterates the uncertain printed stone name. The earlier English crystal is not established by
      this scan review; no precise mineral identification is claimed.
    reason: lexical_alternative
  - marker: b
    text: The first consonant of the word in this upper-part phrase is unclear in the selected photograph. POB marks
      that single source glyph with⟦?⟧; Charles did not print this marker. The earlier y-reading and a possible
      d-reading are not certified. Top or upper part is a provisional rendering supported by the actual Dillmann1865column1085
      lexical entry, which includes a throne and cites18:8; that meaning does not settle the printed glyph. Sapphire
      remains in this phrase, not an invented foundation. No fresh manuscript collation or all-glyph resolution
      is claimed.
    reason: textual_variant
