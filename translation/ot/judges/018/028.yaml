  from: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
  to: There was no one to rescue them, because Laish was far from Sidon and its people had no ties with anyone else. The city was in the valley belonging to Beth-rehob[a]. Then the Danites rebuilt the city and lived in it.
