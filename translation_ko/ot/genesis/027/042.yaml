revisions:
- from: 리브가에게 맏아들 에서의 말이 전해졌습니다. 그래서 그녀는 사람을 보내어 막내아들 야곱을 불러 그에게 말했습니다. "보십시오, 네 형 에서가 너에 대해 스스로 위로하며 너를 죽이려고 계획하고 있습니다."[a]
  to: 리브가에게 그의 큰아들 에서의 말이 전해졌습니다. 그래서 그녀는 사람을 보내어 작은아들 야곱을 불러오게 하고 그에게 말했습니다. “보아라, 네 형 에서가 너를 죽일 생각으로 스스로를 달래고 있다.”
  rationale: 연령의 상대적 대비를 ‘큰아들/작은아들’로 보존하고, 직접화법을 자연스러운 가족 간 발화로 조정했습니다. 마지막 절은 에서가 야곱을 죽이려는 생각으로 자신을 달래는 의미를 명료하게 옮겼습니다. 기존 각주는 번역문에 필수적인 본문 이문이나 해석상 불확실성을 다루지 않으며, 개정 번역은 재귀적 의미를 본문에서 충분히 드러내므로 삭제했습니다.
