  from: A righteous man eats to the satisfaction of his soul[a], but the belly of the wicked lacks.
  to: A righteous man eats to satisfy his appetite, but the belly of the wicked goes hungry.
  rationale: In this immediate food context, נפשׁ denotes appetite/desire, so “to the satisfaction of his soul” is misleadingly literal. “To satisfy his appetite” is direct and natural. “The belly of the wicked goes hungry” is an idiomatic rendering of the concrete Hebrew image and of חסר's state of want; it does not introduce false precision. The former footnote is no longer needed because the revised English expresses the contextual lexical sense.
