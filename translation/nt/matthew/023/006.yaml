id: MAT.23.6
reference: Matthew 23:6
source:
  edition: SBLGNT
  text: φιλοῦσι ⸀δὲ τὴν πρωτοκλισίαν ἐν τοῖς δείπνοις καὶ τὰς πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
translation:
  text: And they love the place of honor at banquets and the seats of honor in the synagogues,
  philosophy: dynamic
lexical_decisions:
- source_word: φιλοῦσι
  chosen: they love
  alternatives:
  - they are fond of
  - they delight in
  lexicon: BDAG
  rationale: Present active indicative plural of φιλέω here expresses strong liking or preference, not covenantal/theological love. 'They love' is the most natural and direct English rendering and preserves the moral force of Jesus' critique.
- source_word: δὲ
  chosen: And
  alternatives:
  - Now
  - But
  lexicon: BDAG
  rationale: δέ is mildly connective here, continuing the description of the scribes and Pharisees' behavior. 'And' fits the flow in English without overstating contrast.
- source_word: πρωτοκλισίαν
  chosen: the places of honor
  alternatives:
  - the place of honor
  - the chief place at table
  - the seats of honor
  lexicon: BDAG
  rationale: πρωτοκλισία refers to the most honored reclining places at a meal. Because English readers may not grasp the ancient dining custom from a literal rendering, 'places of honor' communicates the social meaning while remaining close to the source.
- source_word: ἐν τοῖς δείπνοις
  chosen: at banquets
  alternatives:
  - at dinners
  - at feasts
  lexicon: BDAG
  rationale: δεῖπνον denotes a dinner/meal, and in this social-status context likely formal meals or feasts. 'At banquets' best conveys the public, honor-laden setting implied by the verse.
- source_word: πρωτοκαθεδρίας
  chosen: the best seats
  alternatives:
  - the chief seats
  - the seats of honor
  - the front seats
  lexicon: BDAG
  rationale: πρωτοκαθεδρία denotes seats of highest status or precedence. 'The best seats' is idiomatic modern English and clearly communicates the desire for prominence.
- source_word: ἐν ταῖς συναγωγαῖς
  chosen: in the synagogues
  alternatives:
  - in synagogues
  lexicon: BDAG
  rationale: A straightforward locative phrase. Retaining the article in English sounds natural here and reflects the institutional setting of Jewish assembly life.
