id: JOB.26.9
reference: Job 26:9
source:
  edition: WLC
  text: מְאַחֵ֥ז פְּנֵי כִסֵּ֑ה פַּרְשֵׁ֖ז עָלָ֣י/ו עֲנָנֽ/וֹ־׃
translation:
  text: He covers the face of the full moon[a], spreading his cloud over it.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “the throne.”
    reason: alternative_reading
lexical_decisions:
- source_word: מְאַחֵז
  chosen: covers
  alternatives:
  - seizes
  - holds fast
  - shuts in
  lexicon: HALOT
  rationale: Though its basic sense concerns grasping or holding, the following cloud image supports “covers” as the natural contextual rendering.
- source_word: פְּנֵי
  chosen: the face of
  alternatives:
  - the surface of
  - the front of
  lexicon: HALOT
  rationale: Hebrew פָּנִים often means 'face' literally or metaphorically 'surface/front.' Retaining 'face of' preserves the vivid Hebrew image while remaining intelligible in English.
- source_word: כִסֵּה
  chosen: the full moon
  alternatives:
  - the throne
  - his seat
  lexicon: HALOT
  rationale: This reading best fits the form and the immediate celestial-cloud imagery; it does not contain a possessive suffix.
- source_word: פַּרְשֵׁז
  chosen: spreading
  alternatives:
  - spreads
  - spreading out
  lexicon: HALOT
  rationale: The verb denotes spreading or extending. Rendering it as 'spreading' coordinates well with the participial opening and preserves the poetic flow of the Hebrew.
- source_word: עָלָיו
  chosen: over it
  alternatives:
  - upon it
  - over him
  lexicon: HALOT
  rationale: The suffix most naturally refers back to 'throne' rather than to a personal antecedent. English uses 'it' for the throne, and 'over it' clearly expresses the spatial relation.
- source_word: עֲנָנוֹ
  chosen: his cloud
  alternatives:
  - his clouds
  - a cloud of his
  lexicon: HALOT
  rationale: The singular with suffix is best rendered 'his cloud.' In context it evokes the divine cloud that conceals heavenly glory.
