  from: The rivers have lifted up[a], O Yahweh; the rivers have lifted up their voice[b]; the rivers lift up their pounding waves.
  to: The rivers have risen, O Yahweh; the rivers have raised their voice; the rivers raise their pounding.[a]
  rationale: The first נָשְׂאוּ has no expressed object, making “have lifted up” incomplete English; “have risen” gives its contextual intransitive force. The second line naturally uses the idiom “raised their voice.” The rare דָּכְיָם should not be made falsely precise as “waves” or reduced with certainty to sound as “roar.” “Their pounding” preserves the force and ellipsis, with the lexical uncertainty documented in the note.
