  preserved_meaning: Paul addresses the Corinthian community as belonging to God.
  reasoning_layer_used: POB lexical decision for ἐκκλησίᾳ
  rationale: The possessive form is shorter and more natural without changing the church’s identity.
- pob_phrase: to those sanctified in Messiah Jesus, called to be saints
  simplified_phrase: to those who have been made holy in Messiah Jesus and called to be holy people
  preserved_meaning: God has made them holy in Messiah Jesus and called them as his holy people.
  reasoning_layer_used: POB lexical decisions for ἡγιασμένοις and κλητοῖς ἁγίοις
  rationale: Common wording explains both “sanctified” and “saints” while preserving God’s action and the two distinct descriptions.
- pob_phrase: together with all those who call on the name of our Lord Jesus the Messiah
  simplified_phrase: together with everyone who calls on our Lord Jesus the Messiah
  preserved_meaning: The Corinthian believers are linked with all who appeal to and worship Jesus as Lord.
  reasoning_layer_used: POB lexical decision for ἐπικαλουμένοις τὸ ὄνομα and the independent grounding review
  rationale: Removing the opaque words “the name of” clarifies the idiom without turning the wider group into a separate addressee.
