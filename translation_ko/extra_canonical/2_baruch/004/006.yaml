  verdict: revise
  source_fidelity: 현 초안은 성막과 기구의 ‘식양’을 모세에게 보여 주었다는 부분만 옮기며, 선행 문맥의 대상인 ‘그것’(사람 손으로 지은 것이 아닌 하늘의 도성)을 모세에게 보여 주었다는 핵심 목적어를 빠뜨립니다. 시리아어의 ‘다시 또한 모세에게 그것을 보여 주었다’와 영어 감사 번역의 관계절을 반영해야 합니다.
  naturalness: ‘식양’은 현대 표준 한국어에서 매우 드물고 의미가 즉시 분명하지 않습니다. 여기서는 성막과 기구의 본보기/형상을 뜻하므로 ‘모형’이 자연스럽고 정확합니다. ‘시내산’은 통상 표기입니다.
  terminology: ‘성막’과 ‘기구’는 적절합니다. ‘모형’은 성막 및 기구의 heavenly pattern/likeness를 교파적으로 과도하게 해석하지 않고 옮깁니다.
  issues:
