source:
  edition: WLC
  text: וְ/כִי תֹאמְר֣וּ/ן אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵי֙ הַ/מִּזְבֵּ֣חַ הַ/זֶּ֔ה תִּֽשְׁתַּחֲו֖וּ בִּ/ירוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: ko
  text: 그러나 당신들이 내게 ‘우리는 야훼 우리 하나님을 신뢰합니다’라고 말한다면, 히스기야가 그의 산당들과 그의 제단들을 제거하고 유다와 예루살렘 사람들에게 ‘너희는 예루살렘에서 이 제단 앞에 경배해야 한다’라고 말하게 한 분이 바로 그분이 아니겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵל־יְהוָה אֱלֹהֵינוּ / LORD our God
  english_pob_choice: We trust in the LORD our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 주 우리 하나님
  - 여호와 우리 하나님
  lexicon: יהוה / יְהוָה
  rationale: POB의 영어 본문이 LORD를 사용하지만, 히브리어 본문이 직접 가리키는 고유명은 야훼이므로 본문에는 야훼를 두고 의미를 분명히 했습니다.
- source_word: בָּטָחְנוּ
  english_pob_choice: We trust
  chosen_korean: 신뢰한다
  alternatives_korean:
  - 믿는다
  - 의지한다
  lexicon: בטח
  rationale: 문맥상 단순 지식 동의보다 ‘의지하여 भरो하다’는 의미가 강하므로, 현대 한국어에서 가장 직접적인 동사를 택했습니다.
- source_word: בָּמֹתָיו וְאֶת־מִזְבְּחֹתָיו
  english_pob_choice: his high places and whose altars
  chosen_korean: 그의 산당들과 그의 제단들
  alternatives_korean:
  - 그의 높은 곳들과 그의 제단들
  - 그의 산당들과 제단들
  lexicon: בָּמָה / מִזְבֵּחַ
  rationale: 산당은 고유한 성경 용례로 굳어진 표현이라 유지했고, 병렬 구조를 살리기 위해 ‘그의’를 반복해 원문의 소유격을 드러냈습니다.
- source_word: תִּשְׁתַּחֲו֖וּ
  english_pob_choice: You shall worship
  chosen_korean: 예배해야 한다
  alternatives_korean:
  - 엎드려 절해야 한다
  - 경배해야 한다
  lexicon: שׁחה
  rationale: 히브리어 동사는 몸을 굽혀 경배하는 행위를 포함하지만, 문맥상 예루살렘 성전 중심의 공적 예배를 지시하므로 ‘예배하다’로 옮겼습니다.
theological_decisions:
- issue: 히스기야의 개혁을 산당 제거로 서술하는 아이러니를 어떻게 드러낼지
  chosen_reading: 히스기야가 제거한 대상이 ‘산당들’과 ‘제단들’이라는 비판적 관찰을 그대로 살려, 본문이 앗수르의 도발 논리를 전달하도록 했습니다.
  alternative_readings:
  - 히스기야가 우상숭배를 없앴다는 호의적 설명으로 순화
  - ‘예배해야 한다’를 ‘섬겨야 한다’로 완화
  rationale: 이 절은 적의 선전 발언을 기록하는 자리이므로, 본문의 정치·종교적 공격성을 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 열왕기하 18장 문맥의 앗수르 사신 연설
- issue: ‘before this altar in Jerusalem’의 공간·예배 지시를 어떻게 처리할지
  chosen_reading: ‘이 제단 앞에서 예루살렘에서 예배해야 한다’로 옮겨 제단과 장소의 이중 강조를 유지했습니다.
  alternative_readings:
  - ‘이 제단 앞에서 경배해야 한다’
  - ‘예루살렘의 이 제단 앞에서 절해야 한다’
  rationale: 원문은 제단과 예루살렘을 함께 지정하여 중앙성소 정책을 지적하므로, 두 요소를 모두 선명하게 살렸습니다.
  doctrine_reference: 신명기적 예배 중앙집중 주제
