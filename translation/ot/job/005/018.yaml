id: JOB.5.18
reference: Job 5:18
source:
  edition: WLC
  text: כִּ֤י ה֣וּא יַכְאִ֣יב וְ/יֶחְבָּ֑שׁ יִ֝מְחַ֗ץ ו/יד/ו תִּרְפֶּֽינָה׃
translation:
  text: For he causes pain, but he binds up the wounds; he wounds, but his hand heals.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - Because
  lexicon: HALOT
  rationale: Introduces the explanation for the preceding statement. 'For' fits the discourse flow in English and preserves the causal/explanatory force without over-specifying.
- source_word: הוּא
  chosen: he
  alternatives:
  - he himself
  lexicon: HALOT
  rationale: The independent pronoun adds emphasis, but standard English can convey this adequately with 'he' in context. 'He himself' would be possible but slightly heavier than needed.
- source_word: יַכְאִיב
  chosen: causes pain
  alternatives:
  - wounds
  - makes sore
  - afflicts
  lexicon: HALOT
  rationale: The Hiphil of כאב means to cause pain or hurt. 'Causes pain' is semantically direct and avoids importing the more concrete imagery of 'wounds,' which belongs more naturally to the next verb pair.
- source_word: וְיֶחְבָּשׁ
  chosen: but he binds up
  alternatives:
  - and he binds up
  - bandages
  lexicon: HALOT
  rationale: חבש in this context refers to binding up an injury. 'Binds up' is a natural English equivalent and preserves the healing imagery. The conjunction is rendered adversatively ('but') to reflect the clear contrast in the poetic parallelism.
- source_word: יִמְחַץ
  chosen: he wounds
  alternatives:
  - he crushes
  - he smites
  lexicon: HALOT
  rationale: Conveys severe harmful action in the immediate healing parallel without specifying shattering.
- source_word: וְיָדוֹ
  chosen: but his hand
  alternatives:
  - and his hand
  - yet his hands
  lexicon: HALOT
  rationale: Retains the explicit singular Hebrew noun.
- source_word: תִּרְפֶּינָה
  chosen: heals
  alternatives:
  - make whole
  - restore health
  lexicon: HALOT
  rationale: English singular agreement follows the retained explicit singular subject; the Hebrew plural verb is noted.
