translation:
  text: Go to Noah and say to him in my name, “Hide yourself!” Then reveal to him the end that is coming, for the whole earth
    will be destroyed. The waters of a flood are about to come over the whole earth and destroy everything that is in it.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The parenthesized opening “Go to Noah and” is an editorial supply in the chosen printing. Charles explains the Greek
      support in printed24note25. It is retained as part of this selected critical edition, not represented as independent
      recovered Ethiopic wording.
    reason: textual_variant
lexical_decisions:
- source_word: ሖር፡ ለኖኅ፡ ወበሎ፡
  chosen: Go to Noah and say to him
  alternatives:
  - Go to Noah and tell him
  rationale: Preserves the coordinated imperatives and explicitly retains Noah as the addressee. The opening words are parenthesized
    in the supplied OCR witness, so their textual presentation is noted separately.
  model_suggested_lexicon_unverified: Dillmann’s Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በስመ፡ ዚአየ፡
  chosen: in my name
  alternatives:
  - by my name
  - on my behalf
  rationale: The phrase literally invokes the speaker’s name and authorizes the angelic message. “In my name” preserves that
    agency formula without paraphrasing it merely as “on my behalf.”
  model_suggested_lexicon_unverified: Dillmann’s Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኅባእ፡ ርእሰከ፡
  chosen: Hide yourself
  alternatives:
  - Conceal yourself
  rationale: The imperative directs Noah to conceal himself. “Hide yourself” is direct, readable, and retains the reflexive
    force of “yourself.”
  model_suggested_lexicon_unverified: Dillmann’s Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወአግህድ፡ ሎቱ፡
  chosen: Then reveal to him
  alternatives:
  - and disclose to him
  - and make known to him
  rationale: The causative verb conveys making something manifest or known. “Reveal” suits the apocalyptic register, while
    “then” makes the sequence intelligible without changing the underlying coordination.
  model_suggested_lexicon_unverified: Dillmann’s Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ፍጻሜ፡ ዘይመጽእ፡
  chosen: the end that is coming
  alternatives:
  - the coming end
  - the consummation that is coming
  rationale: “End” transparently represents ፍጻሜ without importing a developed later eschatological formula. The relative clause
    preserves the witness’s repeated language of coming.
  model_suggested_lexicon_unverified: Dillmann’s Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይትኃጐል፡ ምድር፡ ኵሉ፡
  chosen: the whole earth will be destroyed
  alternatives:
  - all the earth will perish
  - the whole land will be ruined
  rationale: The verb denotes perishing or destruction. The flood’s worldwide scope in the following clause favors “earth”
    over the locally restricted “land.”
  model_suggested_lexicon_unverified: Dillmann’s Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ማየ፡ አይኅ፡
  chosen: the waters of a flood
  alternatives:
  - floodwaters
  - the water of the flood
  rationale: This keeps both the explicit water term and the flood noun rather than reducing the phrase to a generic disaster.
  model_suggested_lexicon_unverified: Dillmann’s Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይመጽእ፡ ሀሎ፡
  chosen: are about to come
  alternatives:
  - are coming
  - will come
  rationale: The construction presents the action as impending or in progress. “Are about to come” communicates the imminent
    warning given to Noah.
  model_suggested_lexicon_unverified: Dillmann’s Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዘሀሎ፡ ውስቴታ፡
  chosen: everything that is in it
  alternatives:
  - all that is within it
  - those who are in it
  rationale: The relative expression is broad and does not explicitly limit the objects of destruction to people. “Everything”
    preserves that comprehensive scope.
  model_suggested_lexicon_unverified: Dillmann’s Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
