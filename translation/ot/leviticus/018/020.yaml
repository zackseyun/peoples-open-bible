- issue: Nature of the prohibition and impurity language
  chosen_reading: A prohibition of sexual intercourse with a neighbor’s wife, resulting in the addressee's defilement.
  alternative_readings:
  - Retain the literal seminal-emission idiom in the main text
  - Render the result as becoming ritually unclean
  rationale: The Hebrew idiom clearly refers to intercourse and the final phrase names defilement. Translating the idiom is more faithful at the level of meaning than reproducing opaque anatomical wording; the literal source image remains auditable in the footnote.
