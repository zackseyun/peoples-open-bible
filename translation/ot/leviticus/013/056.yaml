  from: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
  to: But if the priest examines it and finds that the spot has faded after the item has been washed, he shall tear the affected portion out of the garment, the leather, or the warp or weft threads.
  rationale: The record already interprets the object of tearing as the contaminated section rather than the entire article. I make that important distinction explicit and retain its sound rendering “has faded,” while replacing the examination formula with natural English.
