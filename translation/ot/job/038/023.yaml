id: JOB.38.23
reference: Job 38:23
source:
  edition: WLC
  text: אֲשֶׁר חָשַׂ֥כְתִּי לְ/עֶת צָ֑ר לְ/י֥וֹם קְ֝רָ֗ב וּ/מִלְחָמָֽה־־׃
translation:
  text: I have reserved them for a time of distress, for a day of battle and war.
  philosophy: dynamic
lexical_decisions:
- source_word: אֲשֶׁר
  chosen: them
  alternatives:
  - that
  lexicon: HALOT
  rationale: The relative pronoun has snow and hail in the preceding question as its antecedent; “them” gives the necessary English continuation after verse-level punctuation.
- source_word: חָשַׂכְתִּי
  chosen: I have reserved
  alternatives:
  - I have withheld
  - I have stored up
  lexicon: HALOT
  rationale: “Reserved” suitably renders purposeful holding back in this meteorological-storehouse context.
- source_word: לְעֶת
  chosen: for a time of
  alternatives:
  - for the time of
  - for a season of
  lexicon: HALOT
  rationale: The preposition ל marks purpose or destination here, and עֵת denotes a time/occasion. 'For a time of' is idiomatic and preserves the temporal sense.
- source_word: צָר
  chosen: distress
  alternatives:
  - trouble
  - adversity
  - anguish
  lexicon: HALOT
  rationale: צָר here denotes a time of trouble or distress. 'Distress' is concise, natural, and suitably weighty in context.
- source_word: לְיוֹם
  chosen: for a day of
  alternatives:
  - for the day of
  lexicon: HALOT
  rationale: Parallel to לְעֶת; rendered consistently as a purposive/temporal phrase.
- source_word: קְרָב
  chosen: battle
  alternatives:
  - combat
  lexicon: HALOT
  rationale: A standard military term. 'Battle' is the clearest and most idiomatic English equivalent.
- source_word: וּמִלְחָמָה
  chosen: and war
  alternatives:
  - and warfare
  lexicon: HALOT
  rationale: Maintains the Hebrew pairing of near-synonyms rather than collapsing them. 'War' is more direct and readable than 'warfare' here.
