  yaml_path: translation/extra_canonical/1_clement/008/001.yaml
  text: The ministers of the grace of God spoke through the Holy Spirit concerning repentance,
translation:
  language: en
  text: God’s servants who ministered his grace spoke through the Holy Spirit about reorientation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: The ministers of the grace of God
  simplified_phrase: God’s servants who ministered his grace
  preserved_meaning: Their service was directly connected with God’s grace.
  reasoning_layer_used: POB base text and Greek source
  rationale: This keeps the grace-ministry relationship without adding recipients or a transfer image.
translation_notes:
  risk_flags:
  - risk: “Servants” is broader than “ministers.”
    mitigation: The clause “who ministered his grace” preserves their specific ministry.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
