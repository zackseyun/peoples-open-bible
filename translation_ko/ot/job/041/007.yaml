base_translation:
  language: en
  yaml_path: translation/ot/job/041/007.yaml
  text: Its proud rows of shields are shut up, sealed tightly.
translation:
  language: ko
  text: 그것의 자랑은 방패들이 줄지어 선 것이며, 그것들은 단단히 봉인한 것처럼 빈틈없이 닫혀 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּ֭אֲוָה
  english_pob_choice: proud
  chosen_korean: 자랑스러운
  alternatives_korean:
  - 교만한
  - 당당한
  - 우쭐한
  lexicon: גָּאוָה
  rationale: 문맥상 방패의 배열이 ‘자랑/위세’를 드러낸다는 점을 살리되, 현대 한국어에서는 ‘자랑스러운’이 가장 자연스럽게 proud의 시각적·상징적 뉘앙스를 전달합니다.
- source_word: אֲפִיקֵ֣י
  english_pob_choice: rows
  chosen_korean: 열
  alternatives_korean:
  - 줄
  - 배열
  - 칸
  lexicon: אֲפִיק
  rationale: 방패들이 나란히 놓인 구조를 가리키므로, 단순한 ‘줄’보다 정렬된 ‘열’이 원문 이미지에 더 가깝습니다.
- source_word: מָֽגִנִּ֑ים
  english_pob_choice: shields
  chosen_korean: 방패
  alternatives_korean:
  - 방패들
  - 방패의
  lexicon: מָגֵן
  rationale: 복수형의 방패를 가리키므로 기본형 ‘방패’를 쓰되, 문맥상 복수 의미는 ‘열’과 결합해 자연스럽게 드러냅니다.
- source_word: סָ֝ג֗וּר חוֹתָ֥ם צָֽר
  english_pob_choice: sealed tightly
  chosen_korean: 단단히 봉해져 있습니다
  alternatives_korean:
  - 빽빽하게 봉해져 있습니다
  - 굳게 봉인되어 있습니다
  - 촘촘히 닫혀 있습니다
  lexicon: סָגוּר / חוֹתָם / צַר
  rationale: ‘닫혀 있음’과 ‘도장/봉인’의 압박감을 함께 살리기 위해 ‘단단히 봉해져 있습니다’로 옮겼습니다. ‘봉인’보다 ‘봉해지다’가 현대어에서 더 매끄럽고, ‘tight’의 강도를 반영합니다.
theological_decisions:
- issue: 의인화된 전투 장비 묘사의 톤
  chosen_reading: 신학적 해설을 덧붙이지 않고, 리워야단의 방패 배열을 강한 시각적 이미지로 그대로 제시했습니다.
  alternative_readings:
  - 상징적 권세의 표현으로 풀어 설명하기
  - 비유적 의미를 약화시켜 중립적으로 번역하기
  rationale: 본문은 설명보다 묘사를 전면에 두므로, 독자가 원문의 압도적 이미지를 직접 느끼도록 유지하는 것이 적절합니다.
  doctrine_reference: 시적/지혜문학의 이미지 보존 원칙
