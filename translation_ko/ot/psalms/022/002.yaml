translation:
  language: ko
  text: 나의 하나님, 제가 낮에 부르짖으나 주께서는 응답하지 않으시고, 밤에도 제게는 잠잠함이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제게는 쉼이 없습니다.’ 히브리어는 문자적으로 ‘제게 잠잠함이 없다’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלִי אֵלִי
  english_pob_choice: My God, my God
  chosen_korean: 하나님, 나의 하나님
  alternatives_korean:
  - 나의 하나님, 나의 하나님
  - 하나님, 하나님
  lexicon: HALOT
  rationale: 반복되는 직접 호칭을 살리되, 한국어에서는 첫 호격을 ‘하나님’으로, 소유격을 ‘나의 하나님’으로 두어 반복과 절박함을 자연스럽게 표현했습니다.
- source_word: לָמָה
