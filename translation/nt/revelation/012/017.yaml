  meaning: Enraged at the woman, the dragon turns to war against her other offspring, who keep God’s commandments and hold to Jesus’ testimony.
  meaning_decisions:
  - source_phrase: ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν
    prior_rendering: to make war with the rest
    new_rendering: to wage war against the rest
    rationale: The construction is adversarial. 'Against' makes clear that the offspring are the dragon’s targets, not his allies, while 'wage war' is natural English for the idiom.
  - source_phrase: ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
    prior_rendering: hold to the testimony of Jesus
    new_rendering: hold to the testimony given by Jesus
    rationale: Revelation’s presentation of revelation from Jesus in 1:1–2 and its connection between Jesus’ testimony and prophecy in 19:10 favor understanding Jesus as the testimony’s source. The serious alternative, testimony borne about Jesus, remains in a footnote.
