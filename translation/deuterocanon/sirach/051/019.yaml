translation:
  text: My soul clung to her, and I will not turn my face away from her[a][b]. My hand opened her gates[c], and I will make my way to her and gaze upon her[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''I will not turn'' expresses continuing resolve. The Hebrew poetic imperfect can also be retrospective, ''I did not turn'' or ''I would not turn''; its form alone does not compel future English.'
    reason: lexical_alternative
  - marker: b
    text: '''Clung'' expresses strong attachment; ''longed for'' is also possible. Greek includes raised hands and lament over ignorance instead of this Hebrew face-turning/gates sequence.'
    reason: textual_variant
  - marker: c
    text: Restored from Kahana's printed 19-star unit, missing from the pinned digital base. Printed order is 19, 20, 19-star, 20-star; POB groups the content by verse. This is fidelity to an editorial edition, not a newly deciphered ancient line.
    reason: textual_variant
  - marker: d
    text: The entry/passage verb is followed by 'to/for her', not an explicitly printed 'into her'. 'Make my way to her' retains that direction. Continuing resolve is chosen; retrospective poetic tense remains possible. Wisdom is the contextual feminine referent.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַשְׁקָה נַפְשִׁי בָּהּ, וּפָנַי לֹא אַהֲפֹך מִמֶּנָּה.
  chosen: My soul clung to her, and I will not turn my face away from her.
  rationale: חַשְׁקָה Qal qatal 3fs agreeing with נַפְשִׁי; בָּהּ 3fs suffix; אַהֲפֹך Qal yiqtol 1cs with פָנַי fronted as object; מִמֶּנָּה 3fs suffix. 'Clung' remains a defensible expression of strong attachment. Continuing resolve in the second clause fits the surrounding vows, but retrospective poetic force remains possible; Greek's past verbs do not decide this Hebrew interpretation.
- source_word: יָדִי פָתְחָה שְׁעָרֶיהָ, וְלָהּ אֶחֱדַר וְאַבִּיט בָּהּ.
  chosen: My hand opened her gates, and I will make my way to her and gaze upon her.
  rationale: The printed hand-opening unit is restored, not inferred from a missing image. פָתְחָה is a feminine singular completed-action form agreeing with 'my hand'; gates has a feminine possessive suffix. אֶחֱדַר and וְאַבִּיט have first-person singular prefixes, the latter expressing looking/gazing. לָהּ supplies to/for her; the entry/passage imagery is rendered 'make my way to her', without asserting an explicit 'into her'. Continuing resolve is contextual, not mechanically compelled tense. Pointing belongs to the edition, not an ancient manuscript.
