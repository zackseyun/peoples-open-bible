- pob_phrase: Paul, a slave of God and an apostle of Jesus the Messiah
  simplified_phrase: I, Paul, am God’s slave and an apostle of Jesus the Messiah.
  preserved_meaning: Paul belongs to God as a slave and holds the commissioned office of apostle under Jesus the Messiah.
  reasoning_layer_used: POB lexical decisions for δοῦλος, ἀπόστολος, and Ἰησοῦ Χριστοῦ
  rationale: The first-person sentence turns the compressed letter opening into natural English while retaining its key titles.
- pob_phrase: for the faith of God’s chosen ones and the knowledge of the truth
  simplified_phrase: As an apostle, I work for the faith of those God has chosen and for their knowledge of the truth
  preserved_meaning: Paul’s apostleship is directed toward the faith and knowledge of people chosen by God.
  reasoning_layer_used: POB theological decision on κατὰ πίστιν and lexical decision on ἐκλεκτῶν θεοῦ
  rationale: The wording identifies Paul’s apostleship as the work in view without narrowing the flexible sense of “for.”
- pob_phrase: the truth that accords with godliness
  simplified_phrase: the truth that agrees with a life of devotion to God
  preserved_meaning: The truth corresponds to reverent living shaped by relationship with God.
  reasoning_layer_used: POB lexical decisions for τῆς κατ’ εὐσέβειαν and εὐσέβειαν
  rationale: The concrete phrase explains “godliness” in ordinary language while keeping the noncausal main reading.
