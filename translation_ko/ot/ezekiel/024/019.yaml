id: EZK.24.19
reference: Ezekiel 24:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ אֵלַ֖/י הָ/עָ֑ם הֲ/לֹֽא תַגִּ֥יד לָ֨/נוּ֙ מָה אֵ֣לֶּה לָּ֔/נוּ כִּ֥י אַתָּ֖ה עֹשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/019.yaml
  text: And the people said to me, “Will you not tell us what these things mean for us, that you are doing them?”
translation:
  language: ko
  text: 백성이 제게 말했습니다. “당신께서 이런 일들을 하시는 것이 우리에게 무엇을 뜻하는지, 우리에게 알려 주시지 않겠습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 그 백성
  alternatives_korean:
  - 그 사람들
  - 백성이
  lexicon: עם
  rationale: 문맥상 이스라엘 공동체를 가리키므로 단순한 군중보다 ‘백성’이 더 정확하며, 자연스러운 서술을 위해 관형사 ‘그’를 붙였습니다.
- source_word: תַגִּיד לָנוּ
  english_pob_choice: tell us
  chosen_korean: 우리에게 알려 주시지 않겠습니까
  alternatives_korean:
  - 말해 주시지 않겠습니까
  - 알려 주실 수 없겠습니까
  lexicon: נגד
  rationale: הגיד는 단순 발화보다 ‘알려 주다’의 뜻이 강하므로, 요청의 공손한 형태로 옮겼습니다.
- source_word: מָה אֵלֶּה לָּנוּ
  english_pob_choice: what these things mean for us
  chosen_korean: 이것이 우리에게 무엇을 뜻하는지
  alternatives_korean:
  - 이것들이 우리에게 무슨 의미인지
  - 이 일들이 우리에게 무엇인지
  lexicon: מה + אלה
  rationale: 히브리어는 직역하면 ‘이것들이 우리에게 무엇입니까’이지만, POB의 의미 해석을 따라 ‘무엇을 뜻하는지’로 풀어 자연스럽게 했습니다.
- source_word: כִּי אַתָּה עֹשֶׂה־
  english_pob_choice: that you are doing them
  chosen_korean: 당신이 이런 일들을 하고 계시는데
  alternatives_korean:
  - 당신이 이것들을 하고 계시기에
  - 당신이 그것들을 행하고 계시는데
  lexicon: עשה
  rationale: POB의 ‘that’에 맞춰 원인/배경을 나타내는 연결을 살리되, 현재 진행 중인 행위를 공손한 존대 표현으로 반영했습니다.
theological_decisions:
- issue: 문장 연결의 뉘앙스
  chosen_reading: ‘that you are doing them’을 원인 접속보다는 배경 진술로 처리했습니다.
  alternative_readings:
  - ‘because you are doing them’처럼 직접 원인으로 옮김
  - ‘since you are doing them’처럼 배경/이유를 더 노골적으로 표현
  rationale: 개정된 영어 POB가 ‘since’에서 ‘that’으로 되돌아간 점을 따라, 히브리어의 문장 흐름을 과도하게 인과적으로 만들지 않고 질문 전체의 배경으로 남겼습니다.
  doctrine_reference: 텍스트-표상 일치 원칙
- issue: 직접화법의 공손성
  chosen_reading: 예언자에게 말을 거는 장면이므로, 인용문 안에서는 공손한 요청형을 유지했습니다.
  alternative_readings:
  - 더 직설적인 명령형/평서형
  - 현대 구어체로 완전히 평준화
  rationale: 청중이 예언자에게 설명을 요구하는 상황을 보존하되, 현대 한국어 성경 문체에 맞게 공손한 요청으로 옮겼습니다.
  doctrine_reference: 화자-청자 관계 보존
