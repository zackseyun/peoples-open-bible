id: PSA.139.20
reference: Psalms 139:20
source:
  edition: WLC
  text: אֲשֶׁ֣ר יֹ֭אמְרֻ/ךָ לִ/מְזִמָּ֑ה נָשֻׂ֖א לַ/שָּׁ֣וְא עָרֶֽי/ךָ׃
translation:
  text: They speak of you maliciously; your adversaries invoke you falsely[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew of this clause is uncertain; it may instead mean “they lift up your adversaries in vain.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  chosen: who
  alternatives:
  - that
  - those who
  lexicon: HALOT
  rationale: Relative particle introducing the description of the wicked; 'who' fits smooth English in context.
- source_word: יֹאמְרֻךָ
  chosen: speak of you
  alternatives:
  - say to you
  - mention you
  lexicon: HALOT
  rationale: From אמר with 2ms suffix. In this context the sense is not direct address but speaking concerning God in a hostile way, as shown by the following phrase 'with evil intent.' 'Speak of you' captures the object suffix naturally in English.
- source_word: לִמְזִמָּה
  chosen: with evil intent
  alternatives:
  - for a scheme
  - for wickedness
  - deceitfully
  lexicon: HALOT
  rationale: מְזִמָּה can denote plan, device, or wicked scheme. Here it qualifies the manner/purpose of their speech against God. 'With evil intent' communicates both deliberateness and malice in readable English.
- source_word: נָשֻׂא
  chosen: take
  alternatives:
  - lift up
  - bear
  - carry
  lexicon: HALOT
  rationale: From נשׂא, literally 'lift/carry.' In idiom with לַשָּׁוְא it commonly means 'take ... in vain' or 'lift up ... falsely.' 'Take' preserves the familiar and likely idiomatic force.
- source_word: לַשָּׁוְא
  chosen: in vain
  alternatives:
  - for falsehood
  - falsely
  - for emptiness
  lexicon: HALOT
  rationale: שָׁוְא denotes emptiness, falsehood, or vanity. With נשׂא it forms an idiom well represented by 'in vain,' while still conveying misuse and falsehood.
- source_word: עָרֶיךָ
  chosen: your adversaries
  alternatives:
  - your cities
  - those hostile to you
  lexicon: HALOT
  rationale: The contextual and traditional construal is preferable in the main text, while the possible differently vocalized reading “your cities” is retained in the note.
- source_word: יֹאמְרֻךָ לִמְזִמָּה
  chosen: speak of you maliciously
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Natural English for hostile speech involving God and מְזִמָּה, without overdefining the precise construction.
- source_word: נָשֻׂא לַשָּׁוְא
  chosen: invoke you falsely
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: A plausible contextual construal of the difficult phrase that avoids adding the unexpressed noun “name”; the uncertainty is stated in the note.
