translation:
  language: en
  text: Some men have slipped in unnoticed. Long ago, they were designated for this judgment.[a] They are ungodly men who use the grace of our God to justify shameless self-indulgence. They also deny Jesus Christ, our only Master and Lord.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Long ago, they were written about as facing this judgment.”
