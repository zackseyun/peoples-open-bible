  text: For a cup is in the hand of Yahweh, and the wine foams, well mixed[a]; he pours from it, and surely all the wicked of the earth will drain its dregs[b] and drink.
  footnotes:
  - marker: a
    text: Or "full of mixture" or "fully mixed." The Hebrew describes wine that has been prepared by mixing but does not specify the ingredients.
    reason: lexical_alternative
  - marker: b
    text: '"Its dregs" refers to the sediment or lees at the bottom of the cup; the image is that the wicked drink it down to the last drop.'
    reason: cultural_note
translation:
  language: ko
  text: 이는 야훼의 손에 잔이 있기 때문입니다. 포도주가 거품을 일으키며 잘 섞여 있고[a], 그분께서 거기서 따라 내십니다. 땅의 모든 악인이 그 찌꺼기[b]까지 남김없이 들이켜 마실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '섞은 것이 가득하다', '충분히 섞였다'. 히브리어는 섞어서 준비한 포도주를 가리키며, 물을 탔다는 뜻으로 한정되지는 않습니다.
    reason: alternative_reading
  - marker: b
    text: '''찌꺼기''는 잔 바닥에 가라앉은 앙금을 가리킵니다. 악인이 그것까지 들이켠다는 심상입니다.'
    reason: lexical_alternative
