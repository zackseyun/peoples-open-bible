  yaml_path: translation/ot/psalms/042/011.yaml
  text: Why are you cast down, my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.[a]
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the help of my countenance'; Hebrew literally, 'the salvations of my face.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영혼아, 너는 어찌하여 낙심하며 어찌하여 내 속에서 요동합니까? 하나님을 바라십시오. 나는 다시 그분을 찬양할 것입니다. 그분은 내 얼굴의 구원이시며 나의 하나님이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “내 얼굴의 구원들, 그리고 나의 하나님”입니다. 이는 낙심한 이의 얼굴을 다시 들게 하시는 하나님의 구원이라는 시적 표현으로 이해될 수 있습니다. 또는 전통적으로 “내 얼굴을 도우시는 분”이라고 옮길 수 있습니다.
    reason: lexical_alternative
