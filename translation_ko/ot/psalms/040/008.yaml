source:
  edition: WLC
  text: אָ֣ז אָ֭מַרְתִּי הִנֵּה בָ֑אתִי בִּ/מְגִלַּת סֵ֝֗פֶר כָּת֥וּב עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/008.yaml
  text: I delight to do your will, my God, and your law[a] is within my inner being.
  footnotes:
  - marker: a
    text: Or 'written for me' or 'prescribed for me.' The Hebrew phrase can mean what is written concerning the speaker or what is laid down for him.
    reason: alternative_reading
  - marker: b
    text: Quoted in Hebrews 10:7 in connection with the Messiah.
    reason: cross_reference
translation:
  language: ko
  text: 나의 하나님, 저는 주님의 뜻을 행하기를 기뻐합니다. 주님의 율법[a]은 제 깊은 곳에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가르침.’ 히브리어 토라(תּוֹרָה)는 법규뿐 아니라 하나님의 가르침을 더 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז אָמַרְתִּי
  english_pob_choice: Then I said
  chosen_korean: 그때 내가 말했습니다
  alternatives_korean:
  - 그때 내가 말하였습니다
  - 그리하여 내가 말했습니다
  lexicon: HALOT
  rationale: אָז의 시간적·서술적 흐름을 살려 ‘그때’로 옮기고, first person perfect는 합쇼체의 자연스러운 회상 표현인 ‘말했습니다’로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  - 자
  lexicon: HALOT
  rationale: 시적·호소적 강조를 현대 한국어에서 가장 자연스럽게 드러내는 직접적 호명으로 ‘보십시오’를 택했습니다. 시편의 높임된 담화 분위기를 유지합니다.
- source_word: בָאתִי
  english_pob_choice: I have come
  chosen_korean: 내가 왔습니다
  alternatives_korean:
  - 내가 왔습니다
  - 제가 왔습니다
  - 내가 도착했습니다
  lexicon: HALOT
  rationale: 도착의 결과를 드러내는 완료형을 한국어 현재완료/완결의 ‘왔습니다’로 옮겨, 단순 과거보다 현재적 도착 상태를 보존했습니다.
- source_word: בִּמְגִלַּת סֵפֶר
  english_pob_choice: in the scroll of the book
  chosen_korean: 책 두루마리의 책에
  alternatives_korean:
  - 책의 두루마리 안에
  - 두루마리 책에
  - 책 두루마리에
  lexicon: HALOT
  rationale: מְגִלָּה의 두루마리 이미지를 살리면서도 한국어에서 과도하게 낯설지 않게 ‘책 두루마리’로 옮겼습니다. 구문상 ‘~에’는 뒤의 기록 위치를 받는 형태로 두었습니다.
- source_word: עָלַי
  english_pob_choice: about me
  chosen_korean: 나에 대하여
  alternatives_korean:
  - 나를 위하여
  - 나를 두고
  - 내게 대하여
  lexicon: HALOT
  rationale: 주된 뜻인 ‘about/concerning’의 의미를 분명히 드러내는 표현으로 ‘나에 대하여’를 선택했습니다. POB가 주석으로 보존한 ‘for me / prescribed for me’의 가능성은 본문에서 해소하지 않았습니다.
theological_decisions:
- issue: Hebrews 10:7의 메시아적 인용과 본 시편의 직접적 문맥 사이의 긴장
  chosen_reading: 본문은 우선 시편 화자의 말로서 ‘나에 대하여 기록되어 있습니다’를 유지하고, 메시아적 적용은 본문에 삽입하지 않았습니다.
  alternative_readings:
  - 메시아에 대하여 기록되어 있습니다
  - 나를 위하여 기록되어 있습니다
  rationale: 히브리서의 인용을 존중하되, 시편 본문의 1차 의미를 가리지 않도록 원문이 허용하는 가장 직접적 의미를 유지했습니다. 해석적 확장은 주석으로 남기는 편이 소스 충실도에 맞습니다.
  doctrine_reference: 본문의 1차 의미와 정경적 재적용의 구분을 보존합니다.
