source:
  edition: WLC
  text: וּ/בְנֵ֖י חֶלְאָ֑ה צֶ֥רֶת יצחר וְ/אֶתְנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/007.yaml
  text: 'And the sons of Helah: Zereth[a], Izhar[b], and Ethnan.'
  footnotes:
  - marker: a
    text: Or possibly 'Heleh' for the mother's name, depending on transliteration convention.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew genealogical formula: ''sons of'' may denote direct sons or more broadly descendants within a family line.'
    reason: cultural_note
translation:
  language: ko
  text: 또 헬라의 아들들은 세렛과 이스할과 에드난입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 족보 표현에서 ‘아들들’은 직계 아들뿐 아니라 가계의 후손을 넓게 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그런데 …의 아들들은
  - …의 아들들은
  lexicon: HALOT
  rationale: 족보 공식에서 בְנֵי는 직역상 ‘아들들’이지만, 한국어에서는 도치된 소유 구문으로 자연스럽게 풀어야 하므로 ‘…의 아들들’로 옮겼습니다. 앞의 ו는 단순한 연결이므로 ‘그리고’로 반영했습니다.
- source_word: חֶלְאָה
  english_pob_choice: Helah
  chosen_korean: 헬라
  alternatives_korean:
  - 헤라
  - 헬아
  lexicon: HALOT
  rationale: 고유명사는 음역을 따르며, 영어 POB의 Helah에 대응하는 표준적인 한글 음역은 ‘헬라’입니다.
- source_word: צֶרֶת
  english_pob_choice: Zereth
  chosen_korean: 제렛
  alternatives_korean:
  - 제로스
  - 제레트
  lexicon: HALOT
  rationale: 히브리어 어말 ת를 한국어로는 대체로 ‘트’로 옮기되, 음절 구조상 ‘제렛’이 가장 자연스럽고, 영어 POB의 Zereth에 대한 한국어 음역으로도 무리가 없습니다.
- source_word: יצחר
  english_pob_choice: Izhar
  chosen_korean: 이스할
  alternatives_korean:
  - 이즈하르
  - 이사르
  lexicon: HALOT
  rationale: 영어 POB의 Izhar를 그대로 따르기보다, 히브리어 자음열에 더 밀착한 한국어 음역을 택했습니다. 족보 고유명사는 통용형과 자음 대응형이 갈릴 수 있으므로, 여기서는 원어 표면형을 더 잘 드러내는 ‘이스할’을 선택했습니다.
- source_word: וְ/אֶתְנָן
  english_pob_choice: and Ethnan
  chosen_korean: 그리고 엣난
  alternatives_korean:
  - 엣난
  - 에트난
  lexicon: HALOT
  rationale: 마지막 항목의 ו는 역시 연결의 ‘그리고’로 옮겼고, 고유명사 אֶתְנָן은 자음과 모음값을 반영해 ‘엣난’으로 음역했습니다.
theological_decisions:
- issue: 족보 공식의 בְנֵי 의미 범위
  chosen_reading: ‘아들들’로 옮기되, 한국어 본문에서는 일반적인 족보 문장으로 처리했습니다.
  alternative_readings:
  - ‘자손들’
  - ‘후손들’
  rationale: 영어 POB도 ‘sons of’의 문자적 형식을 유지하면서 각주로 직계 아들/가계 후손 가능성을 열어 두었습니다. 본문은 원문 형식을 최대한 보존하고, 의미 범위는 주석이 없으므로 추가 확장하지 않았습니다.
  doctrine_reference: 족보·계보 본문 해석 원칙
