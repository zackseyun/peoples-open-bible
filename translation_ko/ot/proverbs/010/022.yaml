source:
  edition: WLC
  text: בִּרְכַּ֣ת יְ֭הוָה הִ֣יא תַעֲשִׁ֑יר וְ/לֹֽא יוֹסִ֖ף עֶ֣צֶב עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/022.yaml
  text: The blessing of the LORD makes rich, and he adds no sorrow with it.
translation:
  language: ko
  text: 여호와의 복은 사람을 부요하게 하며, 그분은 그 복과 함께 고통을 더하지 않으십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכַּת יְהוָה
  english_pob_choice: The blessing of the LORD
  chosen_korean: 여호와의 복
  alternatives_korean:
  - 야훼의 복
  - 주님의 복
  lexicon: בְּרָכָה → 복; יְהוָה → 야훼/여호와
  rationale: 원문은 언약적 주체인 יהוה의 복을 말하므로 ‘복’으로 직역하고, 본문 전통과 오디오빌리티를 고려해 여기서는 관용적 성경형인 ‘여호와’를 사용했습니다.
- source_word: תַעֲשִׁיר
  english_pob_choice: makes rich
  chosen_korean: 사람을 부요하게 하고
  alternatives_korean:
  - 부유하게 하고
  - 풍성하게 하고
  lexicon: עָשַׁר Hiphil → 부요하게 하다
  rationale: 동사의 인과적 의미를 살려 단순 상태가 아니라 ‘부요하게 하다’로 옮겼고, 한국어에서 자연스러운 목적어를 보완해 뜻을 분명히 했습니다.
- source_word: וְלֹא יוֹסִף עֶצֶב עִמָּהּ
  english_pob_choice: and he adds no sorrow with it
  chosen_korean: 그분은 그것에 슬픔을 더하지 않으십니다
  alternatives_korean:
  - 그것과 함께 근심을 더하지 않으십니다
  - 그것에 고통을 보태지 않으십니다
  lexicon: יוֹסִף + עֶצֶב → 더하다 + 슬픔/고통
  rationale: 영문 POB의 ‘sorrow’를 따라 ‘슬픔’을 택하되, 히브리어 עֶצֶב의 정서적·고통적 뉘앙스를 해치지 않도록 문맥상 자연스럽게 표현했습니다.
theological_decisions:
- issue: 원문의 3인칭 주체를 한국어에서 어떻게 처리할지
  chosen_reading: ‘그분은’으로 받아 여호와를 주체로 분명히 드러냈습니다.
  alternative_readings:
  - ‘그것은’으로 받아 축복 자체를 주체처럼 표현
  - 주어를 생략하고 ‘슬픔을 더하지 않으십니다’로 처리
  rationale: 히브리어는 동사의 주어가 문맥상 여호와로 읽히므로, 한국어에서도 인칭을 명시해 하나님 행위의 주체성을 분명히 했습니다.
  doctrine_reference: 언약적 복의 수여자이신 하나님
