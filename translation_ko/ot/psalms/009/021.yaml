source:
  edition: WLC
  text: שִׁ֘יתָ֤/ה יְהוָ֨ה מוֹרָ֗ה לָ֫/הֶ֥ם יֵדְע֥וּ גוֹיִ֑ם אֱנ֖וֹשׁ הֵ֣מָּה סֶּֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/021.yaml
  text: Put fear in them, O LORD; let the nations know that they are only man. Selah
translation:
  language: ko
  text: 그들 가운데 두려움을 두십시오, 야훼여. 민족들이 자신들이 다만 사람이란 것을 알게 하십시오. 셀라.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָ/ה ... מוֹרָה לָהֶם
  english_pob_choice: Put fear in them
  chosen_korean: “두려움을 두십시오”
  alternatives_korean:
  - “두렵게 하십시오”
  - “무서움을 주십시오”
  lexicon: שׁית + מוֹרָה
  rationale: 원문은 ‘두려움/공포’를 그들 안에 두게 해 달라는 청원으로 읽히므로, 한국어에서는 상태를 ‘두렵게 하다’보다 더 직접적으로 ‘두려움을 두다’로 옮겨 원문의 조성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: O LORD
  chosen_korean: “야훼여”
  alternatives_korean:
  - “주님”
  - “여호와여”
  lexicon: יהוה
  rationale: 시편의 YHWH는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기며, 호격 조사 ‘-여’를 붙여 기도문 호칭을 자연스럽게 반영했습니다.
- source_word: אֱנוֹשׁ הֵמָּה
  english_pob_choice: they are only man
  chosen_korean: “자신들이 다만 사람이란 것”
  alternatives_korean:
  - “그들이 한낱 인간뿐이란 것”
  - “그들이 단지 사람에 불과하다는 것”
  lexicon: אֱנוֹשׁ
  rationale: enosh는 유한하고 연약한 ‘인간/사람’을 가리키므로, ‘다만’으로 한계를 살리고 ‘사람’으로 원문의 보편적 인간성을 유지했습니다.
theological_decisions:
- issue: ‘사람’의 존재론적 겸손과 민족의 교만 억제
  chosen_reading: 이 절은 열방이 하나님 앞에서 피조물인 인간에 불과함을 깨닫게 해 달라는 청원으로 읽었습니다.
  alternative_readings:
  - 민족들이 권세의 한계를 알게 해 달라는 정치적 경고
  - 단순한 인간성에 대한 일반 선언
  rationale: 문맥상 심판 청원과 연결되며, ‘다만 사람’은 인간의 비천함을 드러내어 열방의 교만을 꺾는 기능을 합니다.
  doctrine_reference: 시편 9편의 심판-구원 주제
