  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  - 그 주님
  lexicon: BDAG
  rationale: 그리스어 본문이 Κύριος를 사용하므로, 프로젝트 기본값에 따라 ‘주님’으로 옮겨 신적 칭호를 자연스럽게 드러냈습니다.
- source_word: φωνῆς
