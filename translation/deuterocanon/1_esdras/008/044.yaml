      text: I sent for Eleazar[a], Iduel, Maasman, Enaathan, Shemaiah, Jorib, Nathan, Ennathan, Zechariah, and Mesholabon,
        the leaders and men of understanding,
      philosophy: optimal-equivalence
      footnotes:
      - marker: a
        text: Several personal names in this verse are preserved in Greek forms that are difficult to align exactly with the
