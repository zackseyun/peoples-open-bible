revisions:
- from: 이것이 그들의 길이며—그들의 어리석음입니다. 그러나 그들 뒤를 따르는 이들은 그들의 말을 좋게 여깁니다. 셀라.[a][b]
  to: 양 떼처럼 그들은 스올[a]에 놓였고, 죽음이 그들의 목자가 될 것입니다. 올바른 이들이 아침에 그들을 다스릴 것이며, 그들의 형상은 스올에서 쇠하여 그들의 높은 거처에서 멀어질 것입니다.[b]
  rationale: 제시된 WLC 본문을 처음부터 번역했습니다. ‘놓였고’는 שַׁתּוּ의 수동적 배치를, ‘죽음이 그들의 목자가 될 것입니다’는 양 떼 비유를 뒤집는 יִרְעֵם의 의인화를 반영합니다. וַיִּרְדּוּ בָם은 문맥상 ‘다스리다’로, יְשָׁרִים은 ‘올바른 이들’로 옮겼습니다. וְצוּרָם ... מִזְּבֻל לוֹ는 본문 자체가 난해하므로 영어 감사 기록의 문맥상 독법을 본문에 반영하되, 주요 대안을 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:09:04Z'
