  category: meaning_retranslation
  from: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
  to: There, in the presence of the Israelites, Joshua wrote on the stones a copy of the law of Moses[a].
  rationale: The lexical record takes the relative clause as referring to Moses’ prior writing, but Joshua’s continuing role as subject and the public ceremony support reading it as his inscription before Israel. I adopt that reading while preserving the recorded understanding as an alternative, and leave the extent of the copied law unspecified.
