revisions:
- from: 또 저녁과 아침의 환상은 참된 것입니다. 그러나 당신은 그 환상을 봉인하십시오. 그것은 먼 여러 날에 관한 것입니다.[a]
  to: 또 저녁과 아침에 관한 환상에 대해 말해진 것은 참됩니다. 그러나 당신은 그 환상을 봉인하십시오. 이는 앞으로 오랜 뒤의 일에 관한 것이기 때문입니다.
  rationale: 누락된 ‘말해진 것’을 보완하고, ‘많은 날’이라는 히브리어 관용 표현의 먼 미래 지시를 자연스러운 한국어로 옮겼습니다. ‘환상’과 ‘봉인하십시오’는 유지했으며, 본문이 명시하지 않은 해석을 덧붙이는 각주는 삭제했습니다.
