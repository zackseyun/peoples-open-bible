  text: May sleep be taken from his temples in the night; may they fall away from every work of his hands.
translation:
  language: de
  text: In der Nacht werde der Schlaf von seinen Schläfen genommen; mögen sie von jedem Werk seiner Hände abfallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wer mit „sie“ gemeint ist, wird im griechischen Text nicht ausdrücklich gesagt; das Verb steht im Plural.
    reason: Die Fußnote macht die im Ausgangstext vorhandene syntaktische Unbestimmtheit transparent, ohne sie im Haupttext stillschweigend zu beseitigen.
lexical_decisions:
- source_word: ἀφαιρεθείη
  choice: werde … genommen
  rationale: Der passive Optativ drückt hier einen Verwünschungs- oder Wunschcharakter aus; die Formulierung bewahrt Passiv und Modus.
- source_word: κροτάφων
  choice: Schläfen
  rationale: Wörtliche Wiedergabe des griechischen Plurals; die konkretere Körperbezeichnung wird nicht zu „Augen“ geglättet.
- source_word: ἀποπέσοιεν
  choice: mögen sie abfallen
  rationale: Der pluralische Optativ wird formal bewahrt. Da im überlieferten Satz kein eindeutiges pluralisches Bezugswort genannt ist, bleibt auch die deutsche Wiedergabe offen.
- source_word: παντὸς ἔργου χειρῶν αὐτοῦ
  choice: jedem Werk seiner Hände
  rationale: Bewahrt die umfassende Aussage sowie die geläufige semitisch geprägte Wendung für das, was jemand mit seinen Händen tut.
theological_decisions:
- issue: Unbestimmtes Subjekt des zweiten Segens- beziehungsweise Fluchwunsches
  choice: Das pluralische „sie“ bleibt ohne ergänztes Bezugswort stehen.
  alternative: „Mögen seine Hände bei all ihrer Arbeit versagen“ oder eine singularische Angleichung an die betroffene Person.
  rationale: Der griechische Text hat ein Verb im Plural, nennt dessen Subjekt hier aber nicht ausdrücklich. Eine Konkretisierung auf die Hände oder auf die Person würde die echte textliche Mehrdeutigkeit auflösen.
translation_notes:
  register: Gehobene, aber gegenwärtige Standardsprache. Die beiden Optative werden als Verwünschungswünsche wiedergegeben. „Schläfen“ folgt bewusst dem konkreten griechischen Ausdruck; die ungewöhnliche Offenheit von „sie“ entspricht der Grammatik des überlieferten Textes.
