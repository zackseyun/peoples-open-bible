  lexicon: 고유명사 표기 관례
  rationale: 표준 외래어 표기 관례에 따라 음역하되, 한국어 음운에 맞게 표기했습니다.
- source_word: דִיפַת
  english_pob_choice: Diphath
  chosen_korean: 디밧
  alternatives_korean:
  - 리밧
