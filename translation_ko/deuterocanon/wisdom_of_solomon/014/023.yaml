review_pass:
  verdict: revise
  source_fidelity: 원문의 세 병렬 목적어(‘아이를 죽이는 의례들 / 은밀한 비의들 / 낯선 관습에 따른 광란의 향연들’)와 이를 이끄는 ἄγοντες의 의미는 대체로 반영되었습니다. 그러나 γὰρ를 ‘곧’으로 옮긴 것은 근거를 제시하는 접속사 기능을 살리지 못하며, 원문의 종결되지 않은 분사구문도 한국어에서 이유를 나타내는 완결 문장으로 처리하는 편이 정확합니다.
  naturalness: ‘그들은 곧’은 현대 한국어에서 이 문맥에 자연스럽지 않고 ‘곧’이 시간 또는 동격의 뜻으로 읽힐 수 있습니다. ‘이는 그들이 … 했기 때문입니다’가 앞 문맥을 받는 γὰρ에 자연스럽습니다. 또한 κῶμοι는 단순한 ‘축제’보다 방탕하고 흥청거리는 성격을 지닌 ‘향연’이 더 알맞습니다.
  terminology: τελεταί는 ‘의례’, μυστήρια는 문맥상 은밀한 종교 의례인 ‘비의’로 옮겨 구별했습니다. ‘비의’가 다소 전문적일 수 있으나, ‘비밀스러운 신비 의식’의 중복을 피하면서 μυστήρια의 제의적 의미를 보존합니다. θεσμοί는 영어 감사 번역의 ‘customs’와 원문의 제도·관습 범위를 따라 ‘관습’으로 유지했습니다.
  issues:
  - severity: medium
    issue: γὰρ가 ‘곧’으로 번역됨
    rationale: γὰρ는 여기서 앞 진술의 근거를 드는 ‘왜냐하면/이는 … 때문입니다’의 기능입니다. ‘곧’은 그 기능을 나타내지 못합니다.
  - severity: low
    issue: ‘축제’가 κῶμοι의 향연·흥청거림의 뉘앙스를 약화함
    rationale: κῶμοι는 일반적인 축제보다 광란적·방탕한 잔치 또는 향연을 가리킵니다.
  - severity: low
    issue: ‘비밀스러운 신비 의식’의 표현 중복
    rationale: κρύφια와 μυστήρια를 모두 살리려는 의도는 타당하지만, ‘은밀한 비의’가 더 간결하게 제의적 의미를 전달합니다.
  revised_text: 이는 그들이 아이를 죽이는 의례를 행하거나, 은밀한 비의를 거행하거나, 낯선 관습에 따른 광란의 향연을 벌였기 때문입니다.
