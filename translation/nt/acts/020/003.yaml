  - some Jews
  rationale: The source text explicitly uses τῶν Ἰουδαίων. Replacing it in the main text would mute the wording of the Greek. At the same time, because modern readers may overgeneralize the phrase ethnically, a footnote preserves contextual accuracy without altering the text.
