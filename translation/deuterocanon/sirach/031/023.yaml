lexical_decisions:
- source_word: הלא
  chosen: Is not
  alternatives:
  - Surely
  - Is it not
  lexicon: HALOT
  rationale: Introduces a rhetorical question expecting agreement. 'Is not' preserves the interrogative force more directly than a flat affirmative like 'surely'.
- source_word: די
  chosen: enough
  alternatives:
  - sufficient
  - sufficiency
  lexicon: HALOT
  rationale: די denotes sufficiency. 'Enough' is idiomatic modern English and fits the proverb-like statement.
- source_word: אנוש
  chosen: man
  alternatives:
  - person
  - human being
  - mortal
  lexicon: HALOT
  rationale: The Hebrew term denotes a human/mortal person. Because the phrase is singular and proverbial, 'man' best preserves the gender-accurate representative force per project philosophy, while 'person' would flatten the source's form.
- source_word: נבון
  chosen: intelligent
  alternatives:
  - understanding
  - discerning
  - wise
  lexicon: HALOT
  rationale: נבון emphasizes discernment or understanding. 'Intelligent' communicates practical good sense in this context of moderation at table and rest.
- source_word: מזער
  chosen: a little
  alternatives:
  - a small amount
  - very little
  lexicon: HALOT
  rationale: The term points to a small quantity. 'A little' is concise and natural with 'enough' in English.
- source_word: יצועיו
  chosen: his bed
  alternatives:
  - his couch
  - his sleeping place
  lexicon: HALOT
  rationale: The noun refers to a bed or couch. 'Bed' is the clearest modern equivalent in a context about what follows after eating.
- source_word: לא ישיק
  chosen: he does not pant
  alternatives:
  - he does not gasp
  - he does not retch
  - he does not choke
  lexicon: HALOT
  rationale: The Hebrew form is difficult and the source validation flags a mismatch; in context, with the parallel Greek tradition elsewhere in this section about moderate eating and restful sleep, the sense appears to be that the moderate eater is not distressed on his bed. 'Pant' preserves bodily distress without over-specifying vomiting, which the Hebrew here does not clearly state.
