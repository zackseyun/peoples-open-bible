  text: Now Abner had spoken with the elders of Israel, saying, “For some time you have been seeking David to be king over you.”
translation:
  language: ko
  text: 아브넬은 이스라엘의 장로들과 이야기하면서 이렇게 말했습니다. “한동안 여러분은 다윗이 여러분의 왕이 되기를 바라 왔습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/דְבַר אַבְנֵר הָיָה עִם זִקְנֵי יִשְׂרָאֵל
  english_pob_choice: Now Abner had spoken with the elders of Israel
  chosen_korean: 이제 아브넬이 이스라엘의 장로들에게 말하여 이르렀습니다
  alternatives_korean:
  - 아브넬의 말이 이스라엘의 장로들에게 있었습니다
  - 아브넬이 이스라엘의 장로들과 말했습니다
  lexicon: 말하여 이르다
  rationale: 히브리어는 ‘아브넬의 말/사건’이 장로들에게 향했음을 나타내므로, 단순한 ‘함께 말하다’보다 발화 사실을 드러내는 표현이 자연스럽습니다.
- source_word: גַּם תְּמוֹל גַּם שִׁלְשֹׁם
  english_pob_choice: For some time
  chosen_korean: 오랫동안
  alternatives_korean:
  - 어제도 그제도
  - 며칠 전부터
  - 한동안
  lexicon: 시간 부사구
  rationale: 직역하면 ‘어제도 그제도’지만, POB가 채택한 의미는 기간의 지속성으로 보이며 문맥상 다윗을 왕으로 세우려는 지속된 의도를 자연스럽게 살려 ‘오랫동안’으로 옮겼습니다.
- source_word: הֱיִיתֶם מְבַקְשִׁים
  english_pob_choice: you have been seeking
  chosen_korean: 여러분은 구해 왔습니다
  alternatives_korean:
  - 여러분은 찾고 있었습니다
  - 여러분은 구하고 있었습니다
  lexicon: seek / seek to appoint
  rationale: 히브리어 ‘찾다/구하다’는 단순 탐색보다 왕으로 세우려는 정치적 의도를 포함하므로, 목적어가 ‘다윗을 왕으로’인 문맥을 반영해 ‘구해 왔습니다’로 옮겼습니다.
- source_word: לְמֶלֶךְ עֲלֵיכֶם
  english_pob_choice: to be king over you
  chosen_korean: 여러분 위의 왕으로
  alternatives_korean:
  - 여러분을 다스릴 왕으로
  - 여러분의 왕이 되도록
  lexicon: 왕권 표현
  rationale: ‘over you’의 지배 관계를 직접 드러내되 한국어 어순에 맞게 ‘여러분 위의 왕’으로 처리해 왕권의 방향성을 보존했습니다.
theological_decisions:
- issue: 다윗 왕권의 성격
  chosen_reading: 본문은 다윗의 즉위가 이미 장로들의 오랜 의도였음을 보여 주며, 아브넬의 발언은 그 정치적 현실을 공적으로 상기시키는 말로 옮겼습니다.
  alternative_readings:
  - 예언적 성취를 더 강하게 암시하는 읽기
  - 단순한 정치 협상으로만 보는 읽기
  rationale: 히브리어 본문 자체는 정치적 합의와 장래의 왕권 지향을 말할 뿐, 이 절 단독으로 추가적인 신학적 해석을 강요하지 않습니다.
  doctrine_reference: 사무엘하 3장 문맥의 다윗 왕권 서술
