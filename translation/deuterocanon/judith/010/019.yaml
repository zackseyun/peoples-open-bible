  category: meaning_retranslation
  from: And they marveled at her beauty[a], and because of her they marveled at the sons of Israel; and each said to his neighbor, “Who would despise this people, who have such women among them? For it is not good to leave even one man from among them[b], because those who are left would be able to outwit the whole earth.”
  to: They marveled at her beauty, and because of her they marveled at the Israelites. Each said to his neighbor, “Who would despise a people with women like this among them? It is not wise to leave even one of their men alive, for any survivors could outwit the whole world.”
  rationale: The lexical record recognizes that “sons of Israel” is a collective idiom, that the judgment is chiefly strategic, and that those left are survivors. I bring those meanings into the text while retaining the explicitly male reference in the threat to leave no man alive.
