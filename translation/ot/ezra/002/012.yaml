  text: בְּנֵ֣י עַזְגָּ֔ד אֶ֕לֶף מָאתַ֖יִם עֶשְׂרִ֥ים וּ/שְׁנָֽיִם׃ס
translation:
  text: 'The descendants of Azgad: 1,222.'
