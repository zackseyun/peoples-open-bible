  to: Each year they entrust one man with ruling over them and exercising authority over all their territory. Everyone obeys him, and there is no envy or jealousy among them.
  rationale: I retain the lexical record’s delegated 'entrust,' annual recurrence, one man, and paired envy and jealousy. The earlier note already recognized obedience as the governing-context meaning, so that meaning now appears directly in the text without revising the account to match external descriptions of Roman offices.
