  from: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
  to: He trusts in God[a]; let God rescue him now, if he delights in him, for he said[b], ‘I am the Son of God.’
  rationale: While 'θέλω' often means 'want' or 'wish', when used with a personal object in this Septuagintal idiom (reflecting Hebrew חפץ, quoting Ps 22:8), it specifically means 'to take pleasure in' or 'delight in' (see BDAG, θέλω 4). 'If he wants him' sounds awkward in English and misses the established lexical meaning of the phrase in this context. The perfect tense of πείθω (πέποιθα) is intransitive and functions with a present meaning ('I trust, rely on'). 'He trusts' accurately reflects this present state, whereas 'He has trusted' over-translates the perfect morphology in a way that is less natural in English.
