translation:
  language: ko
  text: 그리고 그녀가 침상 가까이 다가가 그의 머리카락을 움켜잡고 말하였습니다. 「이스라엘의 하나님이시여, 이 날에 저를 강하게 하소서.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  english_pob_choice: when she came near
  chosen_korean: 다가가서
  alternatives_korean:
  - 가까이 와서
  - 다가왔을 때
  lexicon: LSJ
  rationale: 분사로서 앞선 동작을 나타내므로, 문맥에 맞게 자연스러운 순차 표현인 ‘다가가서’로 옮겼습니다.
- source_word: κλίνη
  english_pob_choice: bed
  chosen_korean: 침상
  alternatives_korean:
  - 침대
  - 소파
  lexicon: LSJ
  rationale: 문학적이지만 현대 한국어에서도 무리가 없고, 이야기 속 장면의 실내 맥락을 잘 살릴 수 있어 ‘침상’을 선택했습니다.
- source_word: ἐδράξατο
  english_pob_choice: she seized
  chosen_korean: 붙잡고
  alternatives_korean:
  - 움켜잡고
  - 붙들고
  lexicon: LSJ
  rationale: 중간태의 강한 동작을 반영하되, 한국어에서 과도하게 거칠게 들리지 않도록 ‘붙잡고’로 처리했습니다.
- source_word: Κραταίωσόν με
  english_pob_choice: Strengthen me
  chosen_korean: 저를 강하게 하소서
  alternatives_korean:
  - 저에게 힘을 주소서
  - 저를 강하게 해 주십시오
  lexicon: LSJ
  rationale: κραταιόω의 핵심 의미인 ‘강하게 하다/강화하다’를 직접 살리면서, 하나님께 드리는 기도체로 자연스럽게 표현했습니다.
- source_word: ὁ θεὸς Ἰσραήλ
  english_pob_choice: O God of Israel
  chosen_korean: 이스라엘의 하나님이시여
  alternatives_korean:
  - 이스라엘의 하나님
  - 이스라엘 하나님이시여
  lexicon: LSJ
  rationale: 직접 호격의 기도 어조를 살리기 위해 ‘-이시여’를 사용했고, 소유 관계는 한국어 관용에 맞게 ‘이스라엘의 하나님’으로 옮겼습니다.
theological_decisions:
- issue: 기도의 직접 호칭과 청원 어조
  chosen_reading: 하나님께 직접 드리는 호격 기도로 처리해 ‘이시여’와 종결형 ‘-하소서’를 유지했습니다.
  alternative_readings:
  - 서술형으로 ‘이스라엘의 하나님, 오늘 이 날에 저를 강하게 해 주십시오’
  - 더 평이한 청원형으로 ‘저를 강하게 해 주시기를 바랍니다’
  rationale: 그리스어의 직접 부름과 간구를 약화시키지 않기 위해, 현대 한국어에서도 기도문 체를 분명히 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: direct address in prayer should remain explicit and reverent'
