id: NUM.15.25
reference: Numbers 15:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַֽל כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְ/נִסְלַ֣ח לָ/הֶ֑ם כִּֽי שְׁגָגָ֣ה הִ֔וא וְ/הֵם֩ הֵבִ֨יאוּ אֶת קָרְבָּנָ֜/ם אִשֶּׁ֣ה לַֽ/יהוָ֗ה וְ/חַטָּאתָ֛/ם לִ/פְנֵ֥י יְהוָ֖ה עַל שִׁגְגָתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
  footnotes:
  - marker: a
    text: Or 'an offering by fire to the LORD.' The Hebrew term can emphasize an offering made by fire; 'food offering' is a common contextual rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'their purification offering.' The Hebrew term often rendered 'sin offering' can also be understood as an offering for purification in sacrificial contexts.
    reason: lexical_alternative
  - marker: c
    text: Or 'because it was an unintentional error; and they have brought'.
    reason: previous_rendering
translation:
  language: ko
  text: 제사장은 이스라엘 자손의 온 회중을 위하여 속죄할 것이며, 그들은 용서받을 것입니다. 이는 부지중에 저지른 잘못이었고, 그들이 자기들의 예물, 곧 야훼께 드리는 화제[a]와 야훼 앞에 드리는 자기들의 속죄제물[b]을 그들의 부지중의 잘못을 위하여 가져왔기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불로 드리는 제물’. 히브리어 용어는 불로 드리는 제물을 가리키며, 문맥에 따라 ‘음식 제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정결제물’. 제사 문맥에서 חַטָּאת는 죄를 위한 제물, 곧 정결을 위한 제물로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר הַכֹּהֵן
  english_pob_choice: shall make atonement / the priest
  chosen_korean: 제사장은 … 속죄를 해야 하며
  alternatives_korean:
  - 제사장은 … 속죄할 것입니다
  - 제사장이 … 속죄합니다
  lexicon: HALOT
  rationale: כפר의 제사장적 용례를 살려 단순한 ‘용서’가 아니라 속죄 행위로 옮겼습니다. 합쇼체의 법문체에 맞춰 의무·결과를 드러냈습니다.
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: for all the congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 온 회중을 위해
  alternatives_korean:
  - 이스라엘 자손의 온 공동체를 위해
  - 이스라엘 사람들의 전체 회중을 위해
  lexicon: HALOT
  rationale: עֲדָה는 ‘회중/공동체’로, עַל כּפר의 관용구는 ‘~을 위해’로 자연스럽게 살렸습니다. ‘이스라엘 자손’은 원문 형식을 유지해 출처의 집단성을 보존했습니다.
- source_word: וְנִסְלַח לָהֶם
  english_pob_choice: and they shall be forgiven
  chosen_korean: 그들은 용서받을 것입니다
  alternatives_korean:
  - 그들에게 용서가 있을 것입니다
  - 그들은 사함을 받을 것입니다
  lexicon: HALOT
  rationale: 니팔 סלח의 결과를 한국어에서는 수동형으로 자연스럽게 옮겼습니다. ‘사함’보다 현대 독자가 즉시 이해하는 ‘용서’가 적절합니다.
- source_word: אִשֶּׁה לַיהוָה
  english_pob_choice: an offering made by fire to Yahweh
  chosen_korean: 야훼께 드리는 불로 드리는 제물
  alternatives_korean:
  - 야훼께 드리는 화제
  - 야훼께 드리는 불살라 드리는 제물
  lexicon: HALOT
  rationale: אִשֶּׁה는 전통적 ‘화제’보다 의미가 더 분명한 ‘불로 드리는 제물’로 풀어, 제사적 성격과 소각 제물의 뉘앙스를 함께 살렸습니다.
- source_word: וְחַטָּאתָם
  english_pob_choice: and their sin offering
  chosen_korean: 자기의 속죄제물
  alternatives_korean:
  - 자기의 죄제
  - 자기의 속죄 제물
  lexicon: HALOT
  rationale: 제사 문맥에서 חַטָּאת은 죄 자체보다 제물로 이해되어야 하므로 ‘속죄제물’로 옮겼습니다. ‘죄제물’은 낯설어 가독성이 떨어집니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문의 신명사ון을 제목어로 대체하지 않고 학술적 음역 ‘야훼’로 옮겨, POB의 명명 원칙을 따랐습니다.
theological_decisions:
- issue: חטאת의 의미를 ‘죄’가 아니라 제사 용어로 유지할지 여부
  chosen_reading: 속죄제물
  alternative_readings:
  - 죄
  - 정결제물
  rationale: 이 절에서는 חַטָּאת가 가져오는 대상이므로 도덕적 ‘죄’가 아니라 희생 제물을 가리킵니다. 다만 학계에서 ‘정결제물’ 해석도 가능하므로 용어는 주석 없이 단정하지 않고 번역어만 선택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
