  revised_text: 그들이 말했습니다. “보십시오, 실로에는 해마다 야훼의 절기[a]가 있습니다. 그곳은 벧엘 북쪽에 있고, 벧엘에서 세겜으로 올라가는 큰길의 동쪽에 있으며, 레보나 남쪽에 있습니다.”
