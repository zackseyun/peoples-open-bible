translation:
  language: ko
  text: 자, 자녀들아[a], 내 말을 들으십시오. 내가 너희에게 야훼를 경외하는 것을 가르치겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아들들아’. 히브리어는 남성 복수형이지만, 여기서는 지혜 교훈을 받는 이들을 부르는 호칭으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로 ‘야훼를 경외함’. 이는 하나님 앞에서의 경외, 순종, 그리고 마땅한 두려움을 아우르는 지혜문학의 표현입니다.
    reason: lexical_alternative
