id: PSA.69.29
reference: Psalms 69:29
source:
  edition: WLC
  text: וַ֭/אֲנִי עָנִ֣י וְ/כוֹאֵ֑ב יְשׁוּעָתְ/ךָ֖ אֱלֹהִ֣ים תְּשַׂגְּבֵֽ/נִי׃
translation:
  text: But I am afflicted and in pain; O God, let your salvation set me safely on high[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “your salvation, O God, will set me safely on high.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  chosen: But I
  alternatives:
  - But I
  - Yet I
  lexicon: HALOT
  rationale: Carries the contrastive force naturally and concisely.
- source_word: עָנִי
  chosen: afflicted
  alternatives:
  - poor
  - humble
  - needy
  lexicon: HALOT
  rationale: Though the adjective can denote economic poverty, in Psalms it often carries the broader sense of being oppressed, afflicted, or brought low. Here, paired with 'in pain,' the experiential sense 'afflicted' best fits the parallelism.
- source_word: וְכוֹאֵב
  chosen: and in pain
  alternatives:
  - and hurting
  - and sorrowful
  - and wounded
  lexicon: HALOT
  rationale: The participle from כאב denotes being in pain or suffering. 'In pain' is idiomatic and preserves the present state expressed by the participle.
- source_word: יְשׁוּעָתְךָ
  chosen: your salvation
  alternatives:
  - your deliverance
  - your help
  lexicon: HALOT
  rationale: The noun ישועה commonly denotes salvation/deliverance. 'Salvation' preserves the theological breadth of the Hebrew, while 'deliverance' is a viable contextual alternative.
- source_word: אֱלֹהִים
  chosen: O God
  alternatives:
  - God
  lexicon: HALOT
  rationale: The vocative sense is clear in context, addressing God directly. 'O God' reflects the prayerful appeal naturally in English.
- source_word: תְּשַׂגְּבֵנִי
  chosen: let your salvation, O God, set me on high
  alternatives:
  - will set me on high
  - protect me
  - make me secure
  lexicon: HALOT
  rationale: From שגב in the Piel, the verb conveys setting someone inaccessibly high, hence protecting or exalting to safety. Because the Hebrew form can function jussively in prayer, 'let ... set me on high' best fits the psalm's petitionary context. 'Set me on high' preserves the metaphor better than flattening it to 'protect me,' while still communicating rescue.
