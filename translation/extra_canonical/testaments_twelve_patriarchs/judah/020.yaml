  - marker: b
    text: Or 'in the delusion of money.' The Greek literally has 'silver,' a traditional idiom for wealth.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'cannot lift up his face to the judge' is implied by the surviving Greek context and preserves the forensic imagery of accusation and inward burning.
    reason: alternative_reading
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
