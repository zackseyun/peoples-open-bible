id: PSA.95.6
reference: Psalms 95:6
source:
  edition: WLC
  text: בֹּ֭אוּ נִשְׁתַּחֲוֶ֣ה וְ/נִכְרָ֑עָה נִ֝בְרְכָ֗ה לִֽ/פְנֵי יְהוָ֥ה עֹשֵֽׂ/נוּ־׃
translation:
  text: Come, let us worship[a] and bow down; let us kneel before Yahweh, our Maker.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “let us prostrate ourselves.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  chosen: Come
  alternatives:
  - Come on
  - Enter
  lexicon: HALOT
  rationale: Imperative plural inviting the congregation to approach; 'Come' is the natural English summons and fits the liturgical tone.
- source_word: נִשְׁתַּחֲוֶה
  chosen: let us worship
  alternatives:
  - let us worship
  - let us prostrate ourselves
  - let us bow down in worship
  lexicon: HALOT
  rationale: The verb denotes prostrating oneself in worship; 'worship' carries the act's meaning while the note preserves its physical image.
- source_word: וְנִכְרָעָה
  chosen: and bow down
  alternatives:
  - and bow down
  - and bend the knee
  - and kneel
  lexicon: HALOT
  rationale: 'The cohortative continues the physical descent in worship: let us bow down.'
- source_word: נִבְרְכָה
  chosen: let us kneel
  alternatives:
  - let us praise
  - let us bless
  lexicon: HALOT
  rationale: This is the Qal cohortative of barak, meaning to kneel, not the Piel meaning to bless.
- source_word: לִפְנֵי
  chosen: before
  alternatives:
  - in the presence of
  lexicon: HALOT
  rationale: '''Before'' is the standard and concise rendering for the preposition here, expressing worship in the LORD''s presence.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: עֹשֵׂנוּ
  chosen: our Maker
  alternatives:
  - the one who made us
  - our creator
  lexicon: HALOT
  rationale: The participle with first person plural suffix means 'the one making us' or 'our maker.' 'Our Maker' is idiomatic, concise, and preserves the covenantal-creational emphasis of the line.
