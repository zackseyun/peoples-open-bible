source:
  edition: WLC
  text: כִּֽי הָי֥וּ בְ/צֹ֖עַן שָׂרָ֑י/ו וּ/מַלְאָכָ֖י/ו חָנֵ֥ס יַגִּֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/004.yaml
  text: For his officials are in Zoan, and his envoys reach Hanes.
translation:
  language: ko
  text: 그의 관리들은 소안에 있으며, 그의 사절들은 하네스에 이릅니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרָיו
  english_pob_choice: his officials
  chosen_korean: 그의 관리들
  alternatives_korean:
  - 그의 관료들
  - 그의 방백들
  - 그의 대신들
  lexicon: שַׂר
  rationale: 문맥상 국가 행정 책임자들을 가리키므로, 현대 독자가 이해하기 쉬운 ‘관리들’로 옮겼습니다. ‘방백들’은 전통적이지만 현대어 감각이 약하고, ‘관료들’은 약간 더 제도적 뉘앙스가 있습니다.
- source_word: וּמַלְאָכָיו
  english_pob_choice: his envoys
  chosen_korean: 그의 사절들
  alternatives_korean:
  - 그의 사신들
  - 그의 전령들
  - 그의 메신저들
  lexicon: מַלְאָךְ
  rationale: 사람으로 파견된 대표자라는 점을 살려 ‘사절들’로 옮겼습니다. ‘전령들’은 메시지 전달에 더 치우치고, ‘사신들’도 가능하지만 외교적 색채가 더 강합니다.
- source_word: חָנֵס
  english_pob_choice: Hanes
  chosen_korean: 하네스
  alternatives_korean:
  - 한네스
  - 하네스
  lexicon: 고유명사
  rationale: 지명 חָנֵס는 음역상 ‘하네스’가 가장 무난합니다. 본문은 도착점/도달점을 가리키는 동사와 함께 쓰이므로 지명 자체는 그대로 음역했습니다.
- source_word: יַגִּיעוּ
  english_pob_choice: reach
  chosen_korean: 이릅니다
  alternatives_korean:
  - 도착합니다
  - 닿습니다
  - 이르러 갑니다
  lexicon: נגע/גיע
  rationale: 영어 POB가 ‘reach’를 유지한 것은 단순 도착보다 ‘미치다/이르다’의 도달성을 살리기 위해서입니다. 한국어 ‘이릅니다’가 가장 직접적으로 그 도달 의미를 반영합니다.
theological_decisions:
- issue: 문장의 평서적 행정/외교 상황 묘사
  chosen_reading: 종교적 해석을 덧붙이지 않고, 관원과 사절의 실제 이동을 묘사하는 평서문으로 옮겼습니다.
  alternative_readings:
  - 유다의 불신앙을 드러내는 예언적 풍자로 강조하기
  - 외교 사절단의 상징적 의미를 더 풀어 쓰기
  rationale: 히브리어 본문은 정보 전달형 진술이며, 본절 자체는 사상적 설명보다 지명과 도달 동작을 통해 상황을 제시합니다. 따라서 문장 구조를 최대한 보존했습니다.
  doctrine_reference: 본문 우선 원칙; 예언서 서술의 직접성 유지
