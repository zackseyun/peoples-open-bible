- from: 그때 베드로가 예수께 대답하여 말했습니다. 「보십시오, 우리는 모든 것을 버리고 주님을 따랐습니다. 그러면 우리에게 무엇이 있겠습니까?」
  to: 그때 베드로가 예수께 대답하여 말했습니다. 「보십시오, 우리는 모든 것을 버리고 당신을 따랐습니다. 그러면 우리에게 무엇이 있게 되겠습니까?」
  rationale: 원문의 직접 지시(σοι)를 보존하기 위해 ‘주님을’을 ‘당신을’로 바꾸고, 마지막 질문의 미래 의미를 ‘있게 되겠습니까’로 명시했습니다. 나머지 표현은 원문의 강조, 완료된 떠남과 따름, 그리고 현대 합쇼체 문체를 충실히 반영하므로 유지했습니다.
