  text: Μετὰ δὲ τὸ παρελθεῖν με τὸ θηρίον καὶ προελθεῖν ὡσεὶ πόδας τριάκοντα, ἰδοὺ ὑπαντᾷ μοι παρθένος
    κεκοσμημένη ὡς ἐκ νυμφῶνος ἐκπορευομένη, ὅλη ἐν λευκοῖς καὶ ὑποδήμασιν λευκοῖς, κατακεκαλυμμένη ἕως
    τοῦ μετώπου, ἐν μίτρᾳ δὲ ἦν ἡ κατακάλυψις αὐτῆς· εἶχεν δὲ τὰς τρίχας αὐτῆς λευκάς. 2. ἔγνων ἐγὼ ἐκ
    τῶν προτέρων ὁραμάτων ὅτι ἡ Ἐκκλησία ἐστίν, καὶ ἱλαρώτερος ἐγενόμην. ἀσπάζεταί με λέγουσα· Χαῖρε σύ,
    ἄνθρωπε· καὶ ἐγὼ αὐτὴν ἀντησπασάμην· Κυρία, χαῖρε. 3. ἀποκριθεῖσά μοι λέγει· Οὐδέν σοι ἀπήντησεν;
    λέγω αὐτῇ· Κυρία, τηλικοῦτο θηρίον, δυνάμενον λαοὺς διαφθεῖραι· ἀλλὰ τῇ δυνάμει τοῦ Κυρίου καὶ τῇ
    πολυσπλαγχνίᾳ αὐτοῦ ἐξέφυγον αὐτό. 4. Καλῶς ἐξέφυγες, φησίν, ὅτι τὴν μέριμνάν σου ἐπὶ τὸν Θεὸν ἐπέρριψας
    καὶ τὴν καρδίαν σου ἤνοιξας πρὸς τὸν Κύριον, πιστεύσας ὅτι δι᾽ οὐδενὸς δύνῃ σωθῆναι εἰ μὴ διὰ τοῦ
    μεγάλου καὶ ἐνδόξου ὀνόματος. διὰ τοῦτο ὁ Κύριος ἀπέστειλεν τὸν ἄγγελον αὐτοῦ τὸν ἐπὶ τῶν θηρίων ὄντα,
    οὗ τὸ ὄνομά ἐστιν Θεγρί, καὶ ἐνέφραξεν τὸ στόμα αὐτοῦ, ἵνα μή σε λυμάνῃ. μεγάλην θλῖψιν ἐκπέφευγας
    διὰ τὴν πίστιν σου, καὶ ὅτι τηλικοῦτο θηρίον ἰδὼν οὐκ ἐδιψύχησας· 5. ὕπαγε οὖν καὶ ἐξήγησαι τοῖς ἐκλεκτοῖς
    τοῦ Κυρίου τὰ μεγαλεῖα αὐτοῦ, καὶ εἰπὲ αὐτοῖς ὅτι τὸ θηρίον τοῦτο τύπος ἐστὶν θλίψεως τῆς μελλούσης
    τῆς μεγάλης· ἐὰν οὖν προετοιμάσησθε καὶ μετανοήσητε ἐξ ὅλης καρδίας ὑμῶν πρὸς τὸν Κύριον, δυνήσεσθε
    ἐκφυγεῖν αὐτήν, ἐὰν ἡ καρδία ὑμῶν γένηται καθαρὰ καὶ ἄμωμος, καὶ τὰς λοιπὰς τῆς ζωῆς ἡμέρας ὑμῶν δουλεύσητε
    τῷ Κυρίῳ ἀμέμπτως. ἐπιρίψατε τὰς μερίμνας ὑμῶν ἐπὶ τὸν Κύριον, καὶ αὐτὸς κατορθώσει αὐτάς. 6. πιστεύσατε
    τῷ Κυρίῳ, οἱ δίψυχοι, ὅτι πάντα δύναται καὶ ἀποστρέφει τὴν ὀργὴν αὐτοῦ ἀφ' ὑμῶν καὶ ἐξαποστέλλει μάστιγας
    ὑμῖν τοῖς διψύχοις. οὐαὶ τοῖς ἀκούσασιν τὰ ῥήματα ταῦτα καὶ παρακούσασιν· αἱρετώτερον ἦν αὐτοῖς τὸ
    μὴ γεννηθῆναι.
