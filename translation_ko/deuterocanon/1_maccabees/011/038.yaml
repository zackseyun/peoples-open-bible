base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/038.yaml
  text: And King Demetrius saw that the land was quiet before him and that nothing opposed him[a], so he dismissed all his forces, each to his own place, except for the foreign forces that he had recruited from the islands of the nations[b]; and all the forces from his fathers became hostile to him.
  footnotes:
  - marker: a
    text: Or 'mercenary forces' for 'foreign forces'; the Greek specifically refers to non-native troops and may imply hired foreign soldiers.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'all the forces from the time of his fathers' likely means the traditional troops inherited from his forefathers' rule, in contrast to the foreign troops he retained.
    reason: cultural_note
translation:
  language: ko
  text: 데메트리우스 왕은 그의 앞에서 땅이 평온해지고 그에게 맞서는 것이 아무것도 없음을 보고, 자기의 모든 군대를 각 부대가 저마다 제자리로 돌아가도록 돌려보냈습니다. 다만 여러 민족의 섬들에서 모집한 외국 군대[a]만은 남겨 두었습니다. 그런데 그의 선조들에게서 이어져 온 모든 군대는 그에게 적대하게 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외국 군대’는 비토착 병력을 뜻하며, 문맥에 따라 ‘용병들’로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 선조들에게서 이어져 온 모든 군대’는 외국 군대와 대조되는, 조상 대부터 내려온 전통적 병력을 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἡσύχασεν ἡ γῆ ἐνώπιον αὐτοῦ
  english_pob_choice: the land was quiet before him
  chosen_korean: 그 앞에서 그 땅이 잠잠하고
  alternatives_korean:
  - 그 앞에서 그 땅이 평온하고
  - 그 앞에서 그 땅이 조용하고
  lexicon: ἡσυχάζω → 잠잠하다
  rationale: 정세가 진정된 상태를 나타내는 말로, 단순한 소음의 부재보다 정치·군사적 ‘잠잠함’을 더 잘 살립니다.
- source_word: οὐθὲν αὐτῷ ἀνθεστήκει
  english_pob_choice: nothing opposed him
  chosen_korean: 그에게 맞서는 것이 아무것도 없음을
  alternatives_korean:
  - 그를 대적하는 것이 아무것도 없음을
  - 그에게 저항하는 것이 아무것도 없음을
  lexicon: ἀνθίστημι → 맞서다/대적하다
  rationale: 전면적 저항 부재를 뜻하므로 ‘맞서는 것’으로 옮겨 문맥의 군사적 긴장을 유지했습니다.
- source_word: πάσας τὰς δυνάμεις αὐτοῦ
  english_pob_choice: all his forces
  chosen_korean: 자기의 모든 군대
  alternatives_korean:
  - 자기의 모든 병력
  - 자기의 모든 전력
  lexicon: δυνάμεις → 군대/병력
  rationale: 여기서 δυνάμεις는 추상적 ‘힘’이 아니라 실제 군사 집단을 가리키므로 ‘군대’가 가장 자연스럽습니다.
- source_word: τῶν ξένων δυνάμεων ὧν ἐξενολόγησεν ἀπὸ τῶν νήσων τῶν ἐθνῶν
  english_pob_choice: the foreign forces that he had recruited from the islands of the nations
  chosen_korean: 여러 민족의 섬들에서 모아 들인 외국 군대
  alternatives_korean:
  - 열방의 섬들에서 징집한 외국 군대
  - 이방 민족의 섬들에서 모집한 용병들
  lexicon: ξένοι δυνάμεις / ἐξενολόγησεν → 외국 군대 / 모아 들이다
  rationale: ξένοι는 비토착적 군대를 뜻하므로 ‘외국 군대’로 두되, ἐξενολόγησεν의 수집·모집 뉘앙스를 살려 ‘모아 들이다’로 옮겼습니다.
- source_word: πᾶσαι αἱ δυνάμεις αἱ ἀπὸ τῶν πατέρων
  english_pob_choice: all the forces from his fathers became hostile to him
  chosen_korean: 그의 선조 때부터 있던 모든 군대는 그에게 적대하게 되었습니다
  alternatives_korean:
  - 그의 조상들에게서 이어진 모든 군대는 그에게 적이 되었습니다
  - 선조들로부터 내려온 모든 군대는 그에게 등을 돌렸습니다
  lexicon: αἱ ἀπὸ τῶν πατέρων → from his fathers
  rationale: 직역하면 ‘아버지들에게서 온/부터 온’이지만, 문맥상 왕조의 전통 군대를 가리키므로 ‘선조 때부터 있던’으로 풀었습니다.
theological_decisions:
- issue: 해당 절은 신학적 교리 쟁점보다 역사 서술과 군사 정세 묘사가 중심입니다.
  chosen_reading: 본문의 역사·정치적 의미를 우선 살려, 추가적인 신학적 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 도덕적 교훈을 강조하는 독법
  - 섭리적 해석을 전면에 두는 독법
  rationale: 맥락상 본문은 데메트리우스의 군사 재편을 서술할 뿐이므로, 원문의 정보 이상을 신학적으로 확장하지 않는 것이 적절합니다.
  doctrine_reference: 문맥 우선 원칙
- issue: ξένοι δυνάμεις의 성격
  chosen_reading: ‘외국 군대’로 옮기되, 용병 가능성은 주석 수준의 대안으로 열어 두었습니다.
  alternative_readings:
  - 용병들
  - 외국인 부대
  rationale: 그리스어 자체는 비토착 외군을 분명히 가리키지만, 반드시 ‘용병’으로 한정하지는 않으므로 본문은 더 넓은 표현을 유지했습니다.
  doctrine_reference: 어휘 의미 범위 보존
