lexical_decisions:
- source_word: ΚΑΙ
  chosen: Now
  alternatives:
  - And
  lexicon: LSJ
  rationale: 'Sentence-initial καί often simply continues narrative. ''Now'' gives natural English narrative onset while preserving continuity better than a bare ''And'' for modern readers. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: ἦν
  chosen: there was
  alternatives:
  - was
  lexicon: BDAG
  rationale: Combined with ἀνήρ, the idiom introduces a character into the narrative. 'There was' reflects the presentational force in English.
- source_word: ἀνὴρ
  chosen: a man
  alternatives:
  - a husband
  - a male
  lexicon: BDAG
  rationale: In this context ἀνήρ introduces an adult male person, not specifically a husband. 'A man' is the natural and gender-accurate rendering.
- source_word: οἰκῶν
  chosen: living
  alternatives:
  - dwelling
  - residing
  lexicon: BDAG
  rationale: The participle denotes habitation. 'Living' is clear modern English; 'dwelling' is more formal and archaic, while 'residing' is stiffer than the narrative requires.
- source_word: ἐν Βαβυλῶνι
  chosen: in Babylon
  alternatives:
  - at Babylon
  lexicon: LSJ
  rationale: Standard locative rendering. 'Babylon' is the established English form of the place name Βαβυλών.
- source_word: ὄνομα αὐτῷ
  chosen: his name was
  alternatives:
  - the name to him was
  - he was named
  lexicon: BDAG
  rationale: This is a common Greek naming formula. 'His name was' is idiomatic English and preserves the straightforward narrative style.
- source_word: Ἰωακείμ
  chosen: Joakim
  alternatives:
  - Joachim
  lexicon: LSJ
  rationale: Personal names are transliterated. 'Joakim' more directly reflects the Greek form Ἰωακείμ, while 'Joachim' reflects a more traditional Anglicized form.
