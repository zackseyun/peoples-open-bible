translation:
  language: ko
  text: 그분께서 성소[b]에서 당신에게 도움을 보내시고, 시온에서 당신을 붙들어 주시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 지탱하시기를’ 또는 ‘당신을 도우시기를’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘거룩함’ 또는 ‘거룩한 곳’으로도 옮길 수 있습니다. 여기서는 하나님이 계신 성소를 가리키는 뜻으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ / יַעֲנְךָ
  english_pob_choice: May ... answer you
  chosen_korean: 응답하시고
  alternatives_korean:
  - 대답하시고
  - 들으시고
  lexicon: HALOT
  rationale: הִפְעִיל형의 ‘응답하다/대답하다’ 의미를 살려, 시편의 축복·기도문 맥락을 반영하는 -시기를 바랍니다 구조로 옮겼습니다.
- source_word: יְהוָה
