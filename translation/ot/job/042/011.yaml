  to: Then all his brothers, all his sisters, and all who had known him before[a] came to him, and they ate bread[b] with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him. And each one gave him one qesitah[c] and one gold ring[d].
