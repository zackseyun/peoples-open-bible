review_pass:
  verdict: revise
  source_fidelity: 첫 경고와 ‘덫에 걸리다’의 비유, 이방 민족이 제거된 뒤 그들의 종교 관행을 탐문하고 모방하려는 말을 경계하는 구조는 대체로 잘 반영했습니다. 다만 현행문은 ‘그들 뒤를 따라가다 그들이 … 멸망한 뒤에’의 시간 관계와 수식 범위가 한국어에서 불명확합니다. 히브리어는 ‘그들이 네 앞에서 멸망한 뒤에, 그들을 따라가다가 덫에 걸리지 않도록’이라는 순서입니다. ‘앞에서’는 단순 위치보다 그들 앞에서 제거됨을 나타내므로 문맥상 유지하되 문장 순서를 바로잡는 것이 안전합니다.
  naturalness: ‘그들의 신들에 대해 묻기를 … 말하지 않도록’은 인용문이 탐문의 내용을 밝히는 히브리어 구문을 한국어에서 다소 부자연스럽게 만듭니다. ‘그들의 신들에 대하여 알아보면서 …라고 말하지 않도록’으로 하면 원문의 연계와 현대 표준어의 흐름을 함께 살릴 수 있습니다. ‘스스로 삼가십시오’는 합쇼체에서 간결하고 자연스럽게 자기 경계의 뉘앙스를 전달합니다.
  terminology: ‘덫에 걸리다’, ‘멸망하다’, ‘신들’, ‘섬기다’는 각각 נקש, שמד, אֱלֹהִים, עבד의 문맥상 의미를 무리 없이 전달합니다. ‘그렇게’는 כֵּן(그와 같이)을 자연스럽게 옮긴 표현입니다.
  issues:
  - severity: medium
    issue: 첫째 경고절의 시간·수식 관계가 불명확함
    rationale: 현행 ‘그들 뒤를 따라가다 그들이 여러분 앞에서 멸망한 뒤에’는 멸망 이후에 그들을 따른다는 원문의 순서를 매끄럽게 드러내지 못합니다. 시간절을 앞에 두어 ‘그들이 … 멸망한 뒤에 그들을 따라가다가’로 고쳐야 합니다.
  - severity: low
    issue: 탐문과 인용문의 연결이 다소 부자연스러움
    rationale: ‘묻기를 … 말하지 않도록’보다 ‘알아보면서 …라고 말하지 않도록’이 לֵאמֹר로 이어지는 탐문 내용의 인용을 자연스럽게 반영합니다.
  revised_text: 스스로 삼가십시오. 그들이 여러분 앞에서 멸망한 뒤에 그들을 따라가다가 덫에 걸리지 않도록 하십시오. 또 그들의 신들에 대하여 알아보면서, “이 민족들이 자기들의 신들을 어떻게 섬겼는가? 나도 그렇게 하겠다”라고 말하지 않도록 하십시오.
