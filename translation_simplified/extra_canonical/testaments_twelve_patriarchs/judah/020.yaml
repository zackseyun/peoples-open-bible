translation:
  language: en
  text: '1. Silver leads people astray. Deceived by it, they call those who are not gods “gods,” and it drives those who possess it into a frenzy.[a] 2. Because of silver, I lost my children. If my repentance[d] and humiliation, together with my father’s prayers, had not helped me, I would have died without children. 3. But the God of my fathers had mercy on me, because I acted in ignorance. 4. The ruler of deceit had blinded me. I was an ignorant man—flesh corrupted by sins. I recognized my own weakness, yet thought I was invincible.


    5. So understand this, my children: two spirits attend each person—the spirit of truth and the spirit of deceit. 6. A person’s conscience stands between them and may lean toward either one.[b] 7. The deeds of truth and the deeds of deceit are written on a person’s breast, and the Lord knows every one of them. 8. No human deed can ever escape his notice, for each is inscribed before the Lord upon the breast. 9. The spirit of truth testifies against everything. The sinner is burned up inside by his own heart and cannot raise his face before the judge.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Silver” is the traditional image for money or wealth and its power to deceive.
    reason: cultural_note
  - marker: b
    text: The Greek witnesses vary in verses 5–8, especially in their wording about conscience and what is written on the breast.
    reason: textual_variant
  - marker: c
    text: The surviving Greek context implies the final image of being unable to face the judge.
    reason: alternative_reading
  - marker: d
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: in the delusion of silver
  simplified_phrase: Deceived by it
  preserved_meaning: Silver, meaning wealth, blinds people and leads them into false worship.
  reasoning_layer_used: Lexical decisions for ἀργύριον and πλάνη
  rationale: The rewrite makes the cause clear while retaining silver as the controlling image.
- pob_phrase: the conscience of the mind, to which it may incline as it wills
  simplified_phrase: A person’s conscience stands between them and may lean toward either one
  preserved_meaning: The inner moral faculty stands between truth and deceit and can incline toward either.
  reasoning_layer_used: Textual footnote and lexical decision for συνείδησις
  rationale: The wording is natural without resolving the witnesses’ uncertainty about the faculty’s exact description.
- pob_phrase: there is no time when the works of men can escape his notice
  simplified_phrase: No human deed can ever escape his notice
  preserved_meaning: The Lord always knows every human deed.
  reasoning_layer_used: POB contextual rendering of verses 7–8
  rationale: The compact wording removes an awkward time clause while preserving its absolute force.
interpretive_expansions:
- pob_phrase: the sinner is burned up by his own heart
  rendering: The sinner is burned up inside by his own heart
  claim: The burning portrays inward torment arising from the sinner’s own heart or conscience.
  evidence:
  - The lexical rationale identifies the image as consuming inner judgment.
  - The inability to face the judge places the burning in a forensic setting.
  confidence: high
  alternatives_preserved:
