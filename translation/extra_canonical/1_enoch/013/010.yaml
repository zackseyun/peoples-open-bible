translation:
  text: And I recounted before them all the visions I had seen while asleep, and I
    began to speak those words of righteousness and to rebuke the Watchers of heaven.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተናገርኩ
  chosen: recounted
  alternatives:
  - spoke
  - told
  rationale: The verb means 'spoke'; 'recounted' expresses its use with the visions
    as its object without adding content.
- source_word: በንዋም
  chosen: while asleep
  alternatives:
  - in sleep
  - in a dream
  rationale: Retains the explicit reference to sleep without asserting that the word
    itself means 'dream'.
- source_word: ቃላተ፡ ጽድቅ
  chosen: words of righteousness
  alternatives:
  - righteous words
  - words of justice
  rationale: Preserves the source's noun construction and its moral weight.
- source_word: እዝልፍ
  chosen: rebuke
  alternatives:
  - reprove
  - reproach
  rationale: Conveys the force of Enoch's address to the Watchers without weakening
    it to mere advice.
- source_word: ትጉሃነ፡ ሰማይ
  chosen: Watchers of heaven
  alternatives:
  - wakeful ones of heaven
  rationale: Retains the passage's designation for these heavenly beings rather than
    substituting the broader term 'angels'.
theological_decisions:
- issue: The identity and status of those rebuked
  chosen_reading: Watchers of heaven
  alternative_readings:
  - angels
  - fallen angels
  rationale: The verse identifies them as Watchers and locates them in relation to
    heaven; the translation does not add a broader label or resolve their status within
    this line.
- issue: The character of Enoch's speech
  chosen_reading: words of righteousness
  alternative_readings:
  - a declaration of divine judgment
  rationale: The source describes the words as belonging to righteousness and separately
    says that Enoch rebukes the Watchers. It does not explicitly call the speech a
    divine judgment decree here.
