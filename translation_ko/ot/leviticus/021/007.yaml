  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִשָּׁ֨ה זֹנָ֤ה וַ/חֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְ/אִשָּׁ֛ה גְּרוּשָׁ֥ה מֵ/אִישָׁ֖/הּ לֹ֣א יִקָּ֑חוּ כִּֽי קָדֹ֥שׁ ה֖וּא לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: ko
  text: 그들은 창녀나 부정한 여자를 아내로 맞아서는 안 되고, 남편에게서 이혼한 여자도 아내로 맞아서는 안 됩니다. 이는 그가 자기 하나님께 거룩하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה זֹנָה
  english_pob_choice: a woman who is a prostitute
  chosen_korean: 창녀
  alternatives_korean:
  - 매춘부
  - 음녀
  lexicon: זֹנָה
  rationale: 출처의 성적 부도덕성을 직접 드러내는 기본 의미를 살리되, 현대 한국어에서 즉시 이해되는 표준어를 택했습니다.
- source_word: וַחֲלָלָה
  english_pob_choice: defiled
  chosen_korean: 부정해진
  alternatives_korean:
  - 더럽혀진
  - 속된
  lexicon: חָלַל / חֲלָלָה
  rationale: POB가 'defiled'로 돌린 점을 따라 의례적/언약적 부정을 간결하게 옮겼습니다. '부정하다' 계열이 레위기의 정결 문맥에 가장 잘 맞습니다.
- source_word: גְּרוּשָׁה מֵאִישָׁהּ
  english_pob_choice: divorced from her husband
  chosen_korean: 남편에게서 이혼한 여자
  alternatives_korean:
  - 남편과 이혼한 여자
  - 남편에게서 버림받은 여자
  lexicon: גָּרַשׁ
  rationale: 이별의 주체와 관계 단절을 분명히 하되, 본문이 말하는 법적 이혼 상태를 한국어로 자연스럽게 표현했습니다.
- source_word: קָדֹשׁ הוּא
  english_pob_choice: he is holy
  chosen_korean: 그가 자기 하나님께 거룩하기 때문입니다
  alternatives_korean:
  - 그는 자기 하나님께 거룩합니다
  - 그가 그의 하나님께 성결하기 때문입니다
  lexicon: קָדוֹשׁ
  rationale: 문맥상 이유절을 살려 ‘거룩하다’와 그 대상(자기 하나님)을 함께 드러냈습니다. '성결'보다 '거룩'이 POB 용례와 더 일관됩니다.
theological_decisions:
- issue: 남성 복수 주어와 결혼 금지 규정의 범위
  chosen_reading: ‘그들은… 맞아서는 안 됩니다’로 복수 명령을 유지하되, 뒤의 이유절은 제사장 개인의 거룩함을 설명하는 것으로 옮겼습니다.
  alternative_readings:
  - 단수로 풀어 ‘그는… 맞아서는 안 됩니다’
  - 중성화하여 ‘제사장들은…’
  rationale: 히브리어는 복수 명령과 단수 이유절이 함께 나타나므로, 한국어에서도 문법 차이를 유지해 본문의 긴장을 보존했습니다.
  doctrine_reference: 레 21:7의 제사장 정결 규정
