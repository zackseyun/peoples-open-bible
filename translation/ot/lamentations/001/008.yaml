id: LAM.1.8
reference: Lamentations 1:8
source:
  edition: WLC
  text: חֵ֤טְא חָֽטְאָה֙ יְר֣וּשָׁלִַ֔ם עַל כֵּ֖ן לְ/נִידָ֣ה הָיָ֑תָה כָּֽל מְכַבְּדֶ֤י/הָ הִזִּיל֨וּ/הָ֙ כִּי רָא֣וּ עֶרְוָתָ֔/הּ גַּם הִ֥יא נֶאֶנְחָ֖ה וַ/תָּ֥שָׁב אָחֽוֹר־־־־׃ס
translation:
  text: Jerusalem has sinned grievously; therefore she has become unclean[a][c]. All who honored her despise her, because they have seen her nakedness. She herself also groans and turns backward.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: "Or 'has become an impurity' or 'like a menstruant.' The uncommon Masoretic form is also interpreted through a root associated with wandering or shaking, yielding banishment or derision. 'Unclean' provisionally retains the defilement interpretation; ritual impurity is not its only possible sense here."
    reason: lexical_alternative
  - marker: c
    text: "Published 4Q111 preserves לנוד where the Masoretic text has לנידה. The scroll form permits wandering, instability or derision interpretations; it does not uniquely require 'wanderer.' Swete's selected Greek has 'shaking/unsteadiness,' which could interpret either Hebrew spelling. This draft retains the Masoretic source provisionally; historical priority remains unresolved."
    reason: textual_variant
lexical_decisions:
- source_word: חֵטְא חָטְאָה
  chosen: has sinned grievously
  alternatives:
  - has sinned a sin
  - has grievously sinned
  - has surely sinned
  lexicon: HALOT
  rationale: "The retained Masoretic pointing has the noun חֵטְא as an internal object with the finite verb, not an infinitive absolute. Published 4Q111 instead has חטוא, an infinitive-absolute form. Both constructions can intensify the clause; 'has sinned grievously' remains unchanged."
- source_word: לְנִידָה
  chosen: unclean
  alternatives:
  - as an impurity
  - as a menstruant
  - as something removed
  - as a wanderer
  - as an object of derision
  lexicon: HALOT
  rationale: "This uncommon Masoretic form is interpreted either as a form of נדה, impurity, or through נוד, wandering/shaking. Nakedness here and impurity in 1:9 and 1:17 favor retaining the defilement interpretation provisionally, not declaring the lexeme settled. Sin-produced moral/general defilement answers the objection that ordinary menstruation is not caused by sin. Published 4Q111's לנוד and Greek σάλον keep displacement, instability and derision alternatives open; Greek alone cannot select the Hebrew spelling. HALOT is an inherited attribution, not newly verified in this comparison; see the Lamentations dossier for consulted evidence."
- source_word: מְכַבְּדֶיהָ
  chosen: who honored her
  alternatives:
  - who esteemed her
  - who glorified her
  lexicon: HALOT
  rationale: From כבד in the sense of honoring/showing respect. 'Honored' is natural English and fits the contrast with present contempt.
- source_word: הִזִּילוּהָ
  chosen: despise her
  alternatives:
  - treat her with contempt
  - make light of her
  - disdain her
  lexicon: HALOT
  rationale: The Hiphil of זלל/related form here conveys treating as worthless or contemptible. 'Despise' is concise and matches the reversal from prior honor.
- source_word: עֶרְוָתָהּ
  chosen: her nakedness
  alternatives:
  - her shame
  - her private parts
  lexicon: HALOT
  rationale: The noun literally denotes nakedness and often carries connotations of shame/exposure. 'Her nakedness' preserves the metaphor of public humiliation without over-interpreting.
- source_word: נֶאֶנְחָה
  chosen: groans
  alternatives:
  - sighs
  - moans
  lexicon: HALOT
  rationale: The Niphal expresses lamenting with audible distress. 'Groans' best conveys deep suffering in contemporary English.
- source_word: וַתָּשָׁב אָחוֹר
  chosen: turns backward
  alternatives:
  - turns away
  - turns back
  lexicon: HALOT
  rationale: "'Turns backward' preserves the motion in the retained source and matches the actual English. Recoiling in shame or withdrawal remains a contextual interpretation, not an extra predicate supplied to the verse. The former literal-wording note repeated the main text and has been removed."
