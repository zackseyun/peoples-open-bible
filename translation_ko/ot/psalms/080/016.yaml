  lexicon: HALOT
  rationale: 신체 은유를 추상화하지 않고, 하나님의 능동적 행위를 드러내는 직설적 표현을 유지했습니다.
- source_word: בֵּן
  english_pob_choice: son
  chosen_korean: 아들
  alternatives_korean:
  - 가지
  - 새순
