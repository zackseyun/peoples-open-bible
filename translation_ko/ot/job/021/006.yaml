  naturalness: ‘내가 기억하면, 나는 당황하고’는 주어 반복과 쉼표 때문에 다소 번역투이며, ‘내 살’은 현대 한국어에서 문맥 없이 쓰면 부자연스럽습니다. ‘내가 기억할 때면 나는 소스라치게 놀라고, 떨림이 내 몸을 사로잡습니다’가 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘소스라치게 놀라다’는 בהל의 강한 경악·동요를 자연스럽게 반영합니다. בשר는 여기서 신학적 의미의 ‘육체’라기보다 몸의 신체적 반응을 가리키므로 ‘몸’이 적절합니다. פלצות는 영어 POB의 ‘trembling’을 따라 ‘떨림’으로 유지합니다.
