lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그것은
  lexicon: HALOT
  rationale: 앞 구절의 이유를 잇는 접속으로, 시적 문맥에서 자연스러운 원인 제시를 위해 ‘이는’으로 옮겼습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 노예들
  - 당신의 하인들
  lexicon: HALOT
  rationale: 하나님께 드리는 호칭 문맥에서 עבד의 기본 의미를 살리되, 본절은 봉건적 종속보다 신분적 소속을 말하므로 ‘종들’이 적절합니다.
- source_word: רָצוּ ... אֶת אֲבָנֶיהָ
  english_pob_choice: delight in her stones
  chosen_korean: 그 돌들을 기뻐하고
  alternatives_korean:
  - 그 돌들을 즐거워하고
  - 그 돌들을 좋아하고
  lexicon: HALOT
  rationale: רצה의 긍정적 애호/기쁨의 의미를 살려, 예루살렘의 돌에 대한 애착을 ‘기뻐하다’로 표현했습니다.
- source_word: וְאֶת עֲפָרָהּ יְחֹנֵנוּ
  english_pob_choice: and show favor to her dust
  chosen_korean: 그 흙을 은혜롭게 여기기
  alternatives_korean:
  - 그 흙을 불쌍히 여기기
  - 그 흙에게 은혜를 베풀기
  lexicon: HALOT
  rationale: חנן의 ‘호의/은혜를 베풀다’라는 뜻을 살리면서, 먼지·잔해를 향한 정서를 한국어로 자연스럽게 드러내기 위해 ‘은혜롭게 여기다’로 옮겼습니다.
theological_decisions:
- issue: 예루살렘의 여성 인칭 지시를 한국어에서 어떻게 유지할지
  chosen_reading: ‘그 돌들’, ‘그 흙’으로 옮기되, 직전 문맥의 시적 대상인 시온/예루살렘을 전제하도록 유지했습니다.
  alternative_readings:
  - ‘그녀의 돌들’, ‘그녀의 흙’
  - 중성적 ‘그것의 돌들’, ‘그것의 흙’
  rationale: 히브리어의 여성 어미가 도시를 의인화하지만, 한국어에서는 반복적 ‘그녀의’가 다소 부자연스러워 문맥상 지시를 유지하는 방식으로 의인화를 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve source meaning and poetic texture without needless awkwardness'
