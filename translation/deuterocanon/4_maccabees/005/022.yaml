translation:
  text: But you mock our philosophy, as though we lived by it without sound judgment.
  philosophy: dynamic
lexical_decisions:
- source_word: χλευάζεις
  chosen: you mock
  alternatives:
  - you ridicule
  - you scoff at
  lexicon: LSJ
  rationale: The verb denotes derision or scorn. 'Mock' is concise, natural English and preserves the direct insult better than the slightly more formal 'ridicule.'
- source_word: φιλοσοφίαν
  chosen: philosophy
  alternatives:
  - way of life
  - teaching
  lexicon: LSJ
  rationale: In 4 Maccabees the term refers to the Jewish rational-ethical way of life centered on reason and piety. 'Philosophy' preserves the author's own category and rhetorical framing better than interpretive paraphrases like 'way of life.'
- source_word: ὥσπερ
  chosen: as though
  alternatives:
  - as if
  - just as if
  lexicon: LSJ
  rationale: Introduces a comparison expressing the king's false assumption. 'As though' fits idiomatic English in this rebuke.
- source_word: εὐλογιστίας
  chosen: with blessedness
  alternatives:
  - with good repute
  - with happiness
  - with a blessed condition
  lexicon: LSJ
  rationale: The noun is rare and built on the idea of being spoken well of / blessed. In context it describes the quality of life produced by their philosophy. 'With blessedness' preserves the positive, morally freighted sense without reducing it merely to subjective happiness.
- source_word: ἐν αὐτῇ βιούντων
  chosen: live by it
  alternatives:
  - live in it
  - conduct our life in it
  lexicon: LSJ
  rationale: Literally 'living in it,' referring back to philosophy. In English, 'live by it' better conveys ordering one's life according to that philosophy while remaining faithful to the sense.
