source:
  edition: Lightfoot & Harmer 1891 (edited Latin Vulgata ending)
  text: 'Haec omnia quae supra scripta sunt, ego pastor nuntius paenitentiae ostendi et locutus sum Dei
    servis. si credideritis ergo et audieritis verba mea et ambulaveritis in his et correxeritis itinera
    vestra, vivere poteritis. sin autem permanseritis in malitia et memoria offensarum, nullus ex huiusmodi
    vivet Deo. haec omnia a me dicenda dicta sunt vobis. 2. ait mihi ipse pastor: Omnia a me interrogasti?
    et dixi: Ita, domine. Quare ergo non interrogasti me de forma lapidum in structura repositorum, quod
    explevimus formas? et dixi: Oblitus sum, domine. 3. Audi nunc, inquit, de illis. hi sunt qui nunc
    mandata mea audierunt et ex totis praecordiis egerunt paenitentiam. cumque vidisset Dominus bonam
    atque puram esse paenitentiam eorum et posse eos in ea permanere, iussit priora peccata eorum deleri.
    hae enim formae peccata erant eorum, et exaequata sunt, ne apparerent.'
