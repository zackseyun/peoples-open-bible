  source_fidelity: 초안은 시편 6:3의 내용(‘제 영혼은 매우 불안합니다… 얼마나 더입니까?’)과 그에 따른 주석을 담고 있어, 주어진 원문 시편 6:4(‘돌아오소서… 내 생명을 건지소서…’)를 번역하지 못했습니다. 원문의 세 명령형과 חֶסֶד에 근거한 간구를 모두 복원해야 합니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 기도·호소 문맥에 자연스럽습니다. ‘여호와여’는 히브리어 호격을 드러내며, ‘돌아오십시오/건져 주십시오/구원해 주십시오’는 원문의 연속된 간구를 명료하게 보존합니다.
  terminology: יְהוָה는 영어 POB의 ‘LORD’에 맞추어 한국어 성경의 관용적인 ‘여호와’로 옮겼습니다. נַפְשִׁי는 이 문맥에서 ‘제 생명’, חַסְדֶּךָ는 ‘주의 한결같은 사랑’으로 옮겨 영어 POB 및 원문의 의미 범위를 충실히 반영합니다.
