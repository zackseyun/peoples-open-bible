source:
  edition: WLC
  text: עֹבְרֵ֤י בְּ/עֵ֣מֶק הַ֭/בָּכָא מַעְיָ֣ן יְשִׁית֑וּ/הוּ גַּם בְּ֝רָכ֗וֹת יַעְטֶ֥ה מוֹרֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/006.yaml
  text: As they pass through the Valley of Baca[a], they make it a spring; even the early rain[b] covers it with blessings.
  footnotes:
  - marker: a
    text: Baca may echo the Hebrew word for “weeping”; hence, “the Valley of Weeping.”
    reason: alternative_reading
  - marker: b
    text: Or “the autumn rain.” The Hebrew word can also mean “teacher,” but seasonal rain best fits the water imagery here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 바카[a] 골짜기를 지나갈 때, 그곳을 샘으로 만듭니다. 이른 비[b]도 그곳을 복으로 덮습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바카’는 지명으로 보입니다. 히브리어 ‘울다’와 관련되어 ‘울음의 골짜기’라는 뜻을 암시할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘가을비’. 히브리어 낱말은 ‘교사’라는 뜻도 될 수 있으나, 여기서는 물의 이미지와 문맥상 계절의 비로 이해하는 것이 일반적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복되도다
  alternatives_korean:
  - 복이 있는 사람은
  - 복된 사람은
  lexicon: HALOT
  rationale: 시편의 복 선언을 현대 표준어로 자연스럽게 옮기면서도, 평가적·선언적 어조를 살리기 위해 ‘복되도다’를 택했습니다.
- source_word: אָדָם
  english_pob_choice: the man
  chosen_korean: 사람은
  alternatives_korean:
  - 그 남자는
  - 그 사람은
  lexicon: HALOT
  rationale: 히브리어의 남성형 단수이지만 대표적 일반인을 가리키므로, 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람’으로 옮겼습니다.
- source_word: עֹז ל֥וֹ בָךְ
  english_pob_choice: whose strength is in you
  chosen_korean: 주님께 힘을 두는
  alternatives_korean:
  - 주님 안에 힘이 있는
  - 주님께서 힘이 되시는
  lexicon: HALOT
  rationale: 직역의 소유 관계보다 문맥상 ‘힘의 근원/의탁’을 드러내는 표현이 자연스러워, 힘을 하나님께 두는 의탁의 의미를 살렸습니다.
- source_word: מְסִלּוֹת
  english_pob_choice: the highways
  chosen_korean: 길들
  alternatives_korean:
  - 대로들
  - 순례길들
  - 고속도로들
  lexicon: HALOT
  rationale: 구약의 ‘높은 길/대로’라는 기본 의미를 살리되, 본절에서 목적지가 명시되지 않으므로 ‘시온으로 가는 길’처럼 풀지 않고 일반적인 ‘길들’로 옮겼습니다.
theological_decisions:
- issue: Generic masculine אָדָם의 한국어 처리
  chosen_reading: 사람은
  alternative_readings:
  - 남자는
  - 인간은
  rationale: 히브리어는 문법상 남성 단수이지만 대표적 일반 진술이므로, 성별을 불필요하게 좁히지 않는 ‘사람’으로 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 순례 맥락의 암시 처리
  chosen_reading: 길들
  alternative_readings:
  - 시온으로 가는 길들
  - 순례의 길들
  rationale: 시편 84편 전체 맥락상 순례길을 시사하지만, 본절 자체는 목적지를 밝히지 않으므로 본문에는 과잉 해석을 넣지 않고 의미만 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
