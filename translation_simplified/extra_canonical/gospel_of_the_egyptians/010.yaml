translation:
  language: en
  text: 'Five thousand years later, the great light Eleleth said, “Let there be a ruler over Chaos and Hades.” Then a cloud appeared [] [named] Sophia of Matter [. . .].


    [She] looked out over the regions [of Chaos]. Her face looked like [. . .], and her form [. . .] blood. Then [the great] angel Gamaliel spoke [to the great Gabriel], who served [the great light] Oroiael. He [said, “Let an] angel come forth [to] rule over Chaos [and Hades].”


    The cloud [obeyed and produced] two single beings, each [having] light. [. . . the throne] she had set up in the cloud [above].


    Then Sakla, the great [angel, saw] the great demon [who was with him, Nebr]uel. [Together] they became an earthly spirit that could produce offspring. [They brought forth] attendant angels.


    Sakla [said] to the great [demon] Nebruel, “Let [the] twelve realms come into being in [the . . .] realm, worlds [. . .].”


    [. . .] By the will of the one who generated himself, the great angel [Sakla] said, [] “There shall [be] the [. . .] number seven [. . .].” Then he told the [great angels], “Go, and [let each] of you rule over his [own world].”


    Each [of these] twelve [angels] came forth:


    [The first] angel is Ath[oth]. [He is the one] whom [the great] generations of humanity call [. . .].


    [The] second is Harmas, [who] is [Fire-Eye].


    The third [is Galila].


    [The] fourth is Yobel.


    [The fifth is] Adonaios, who is [called] Sabaoth.


    The sixth [is Cain, whom] the [great generations of] humanity call the sun.


    The [seventh is Abel].


    The eighth is Akiressina.


    The [ninth is Yubel].


    The tenth is Harm[oupiael].


    [The] eleventh is Arch[ir-Adonin].


    The twelfth [is Belias].


    [These are] the ones placed over Hades [and Chaos]. After the world was founded, Sakla said to his [angels], “I, yes I, am a [jealous] God, and apart from me nothing has [come into being.” He said this because he] [] depended on his own substance.


    Then a voice from above said, “The Man exists, and so does the Son of the Man.”


    The first form was made because the image from above descended. This image echoed its voice in the heights and looked out through the act of looking out performed by the image above. Because of this, Repentance[a] came into being.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Restore capitalized Repentance as the term in the recorded mythic narrative; do not reinterpret the entity/event as a canonical doctrinal definition.
    reason: lexical_alternative
