id: LUK.15.1
reference: Luke 15:1
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸂αὐτῷ ἐγγίζοντες⸃ πάντες οἱ τελῶναι καὶ οἱ ἁμαρτωλοὶ ἀκούειν αὐτοῦ.
translation:
  text: All the tax collectors and sinners were drawing near to Jesus to listen to him.
  philosophy: dynamic
lexical_decisions:
- source_word: Ἦσαν δὲ
  chosen: '... Were'
  alternatives:
  - And ... were
  - Then ... were
  - Now ... were
  lexicon: BDAG
  rationale: 'Imperfect εἰμί with δέ sets the scene in ongoing past time. ''Now'' is natural modern English for the discourse transition without over-translating δέ. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: αὐτῷ ἐγγίζοντες
  chosen: drawing near to him
  alternatives:
  - coming near to him
  - approaching him
  lexicon: BDAG
  rationale: The periphrastic construction (Ἦσαν + present participle) conveys ongoing/repeated action. 'Drawing near' preserves the aspect and the slightly marked wording of ἐγγίζω better than the flatter 'coming'.
- source_word: πάντες
  chosen: all
  alternatives:
  - all of the
  lexicon: BDAG
  rationale: πάντες modifies the grouped subjects and is naturally rendered 'all,' emphasizing the breadth of those coming to Jesus.
- source_word: οἱ τελῶναι
  chosen: the tax collectors
  alternatives:
  - the toll collectors
  - the tax farmers
  lexicon: BDAG
  rationale: τελώναι refers to those collecting taxes/revenues under Roman administration. 'Tax collectors' is the standard clear English rendering.
- source_word: οἱ ἁμαρτωλοὶ
  chosen: sinners
  alternatives:
  - the sinners
  lexicon: BDAG
  rationale: Used substantivally for those regarded as sinful or morally disreputable. English idiom prefers 'sinners' without repeating the article.
- source_word: ἀκούειν αὐτοῦ
  chosen: to hear him
  alternatives:
  - to listen to him
  lexicon: BDAG
  rationale: The infinitive expresses purpose. Although ἀκούω with genitive can mean 'hear/listen to,' 'to hear him' is concise and idiomatic while preserving the sense of coming to hear his teaching.
