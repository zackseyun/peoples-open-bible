reference: 3 Maccabees 7:10
source:
  edition: lxx-swete-1909
  text: Λαβόντες δὲ τὴν ἐπιστολὴν ταύτην, οὐκ ἐσπούδασαν εὐθέως περὶ τὴν ἄφοδον, ἀλλὰ τὸν βασιλέα προσηξίωσαν τοὺς ἐκ τοῦ γένους τῶν Ἰουδαίων τὸν ἅγιον θεὸν αὐθαιρέτως παραβεβηκότας τοῦ θεοῦ τὸν νόμον, τυχεῖν διʼ αὐτῶν τῆς ὀφειλομένης κολάσεως.
  language: Greek
  pages:
  - 734
  - 746
  - 747
  - 748
  - 749
  - 750
