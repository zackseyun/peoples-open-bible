  meaning_decisions:
  - source_phrase: οὐκ ἀπεκρίθησαν αὐτοῖς
    prior_rendering: they did not answer them
    new_rendering: the fugitives did not fight back
    rationale: After the attack, the surrounding clauses describe refusal to resist; answering here most naturally means responding to the attack, though a verbal reading remains possible.
  - source_phrase: οὐδὲ λίθον ἐνετίναξαν αὐτοῖς
    prior_rendering: nor did they hurl a stone at them
    new_rendering: They did not hurl even a stone at the attackers
    rationale: The singular stone underscores the complete absence of resistance, while naming the attackers clarifies the pronoun’s referent.
  - source_phrase: οὐδὲ ἐνέφραξαν τοὺς κρυφούς
    prior_rendering: nor did they block up the hiding places
    new_rendering: or block the entrances to their hiding places
    rationale: The defensive action would have been obstructing access to their refuges, not filling the places themselves; entrances are implicit in that action.
