source:
  edition: WLC
  text: רֶ֤כֶב אֱלֹהִ֗ים רִבֹּתַ֣יִם אַלְפֵ֣י שִׁנְאָ֑ן אֲדֹנָ֥/י בָ֝֗/ם סִינַ֥י בַּ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/017.yaml
  text: The chariots of God are twice ten thousand, thousands upon thousands[a]; the Lord is among them, as at Sinai, in the holy place.[b]
  footnotes:
  - marker: a
    text: Hebrew “thousands of shin'an”; the meaning of the final word is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is highly compressed. Other possible renderings include “the Lord is among them—Sinai in holiness” and “the Lord has come from Sinai into the holy place.”
    reason: alternative_reading
translation:
  language: ko
  text: 하나님의 병거는 만만이요, 천천이니 주께서 그들 가운데 계시며, 시내는 거룩함 가운데 있도다.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  english_pob_choice: the chariots of God
  chosen_korean: 하나님의 병거
  alternatives_korean:
  - 하나님의 전차들
  - 하나님의 전차 부대
  lexicon: HALOT
  rationale: רֶכֶב은 집합적으로 ‘병거/전차’의 군사 이미지를 가리키므로, 현대 한국어에서는 복수성을 살리면서도 시적인 압축을 유지하는 ‘병거’가 적절합니다.
- source_word: רִבֹּתַיִם
  english_pob_choice: myriads
  chosen_korean: 만만
  alternatives_korean:
  - 수만수만
  - 무수히 많아
  lexicon: HALOT
  rationale: 시적 과장과 대량성을 살리기 위해 ‘만만’으로 옮겼습니다. 수량을 산술적으로 고정하기보다 ‘myriads’의 장엄한 울림을 전달합니다.
- source_word: אַלְפֵי שִׁנְאָן
  english_pob_choice: thousands upon thousands
  chosen_korean: 천천
  alternatives_korean:
  - 천만수천
  - 헤아릴 수 없는 천들
  lexicon: HALOT
  rationale: 희귀어 שִׁנְאָן의 반복·다중성 뉘앙스를 직접 풀기보다, 관용적으로 ‘천천’이라 하여 ‘thousands upon thousands’의 응축된 반복감을 살렸습니다.
- source_word: בָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 안에
  - 그들과 함께
  lexicon: HALOT
  rationale: ב + 대명사 접미사는 문맥상 ‘among/in/with’가 가능하지만, 천상 군대 한가운데 계신 하나님의 현존을 가장 자연스럽게 드러내는 표현은 ‘그들 가운데’입니다.
- source_word: בַּקֹּדֶשׁ
  english_pob_choice: in holiness
  chosen_korean: 거룩함 가운데
  alternatives_korean:
  - 거룩한 곳에
  - 성소 안에
  lexicon: HALOT
  rationale: קֹדֶשׁ은 추상적 거룩함과 장소적 성소를 모두 가질 수 있으나, 여기서는 시적 압축을 살려 구체적 장소를 단정하지 않는 ‘거룩함 가운데’로 옮겼습니다.
theological_decisions:
- issue: 압축된 마지막 절구 אֲדֹנָי בָם סִינַי בַּקֹּדֶשׁ의 해석
  chosen_reading: 주께서 그들 가운데 계시며, 시내는 거룩함 가운데 있도다
  alternative_readings:
  - 주께서 그들 가운데 계시며, 시내에서 거룩함 가운데 계시도다
  - 주께서 그들 가운데 계시니, 시내는 성소에 있도다
  rationale: 히브리어는 매우 압축적이어서 여러 해석이 가능하지만, 본문의 시적 긴장과 현존 이미지를 과도하게 풀어 쓰지 않으면서도 한국어로 의미가 끊기지 않게 했습니다. ‘시내는 거룩함 가운데’는 시내산의 거룩한 계시를 암시하되, 본문에 없는 동작어를 덧붙이지 않습니다.
  doctrine_reference: 본문의 긴장을 보존하고 과잉 해석을 피함.
