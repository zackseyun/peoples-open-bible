  from: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
  to: There was another battle at Gath, where a man of great size had six fingers on each hand and six toes on each foot—twenty-four in all. He too was a descendant of Rapha.
