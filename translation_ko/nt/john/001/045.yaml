  revised_text: 빌립은 나다나엘을 찾아 그에게 말했습니다. “우리는 모세가 율법에서 기록하고 선지자들도 기록한 그분[a], 곧 요셉의 아들이며 나사렛 출신인 예수[b]를 찾았습니다.”
  revised_footnotes:
