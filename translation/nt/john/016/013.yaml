  from: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
  to: But when the Spirit of truth comes, he will guide you into all the truth[a]. For he will not speak on his own, but will speak whatever he hears, and he will make known to you what is to come.
  rationale: The recorded revision correctly repaired the awkward apposition; naming the Spirit directly preserves that clarity without a redundant opening pronoun. I retain 'into all the truth' with the source preposition noted, and adopt the already documented idiomatic alternative 'on his own.'
