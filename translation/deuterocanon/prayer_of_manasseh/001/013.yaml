theological_decisions:
- issue: Rendering of κύριος in divine address
  chosen_reading: Lord
  alternative_readings:
  - Master
  rationale: The doctrinal guidance specifies 'Lord' as the default rendering for κύριος, matching biblical usage and preserving the prayer's address to God.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: Force of ἀνομία
  chosen_reading: lawless deeds
  alternative_readings:
  - sins
  rationale: The text's penitential theology is sharpened by retaining the stronger nuance of lawlessness rather than flattening to the broader 'sins.' This preserves the moral gravity without importing extra doctrinal claims.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
- issue: Context-sensitive reorientation terminology
  chosen_reading: 'I beg you[a], pleading with you: forgive me, Lord, forgive me, and do not destroy me along with my lawless deeds, nor, being angry forever, keep my evils against me, nor condemn me in the lowest parts of the earth; for you, Lord[b], are the God of those who reorient toward you[c],'
  alternative_readings:
