  naturalness: ‘당신의 구원의 기쁨을 제게 되돌려 주시고’와 ‘자원하는 영이 저를 붙들게 하십시오’는 현대 표준어 합쇼체 기도 문맥에서 자연스럽습니다. 후반은 히브리어가 ‘영’을 지탱하는 주체로 두는 점을 살려, 도구격으로 바꾸지 않았습니다.
