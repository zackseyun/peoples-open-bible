  from: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
  to: Dread of God[a] fell upon all the kingdoms of the surrounding lands when they heard that Yahweh had fought against Israel’s enemies.
  rationale: The lexical rationale already identifies this fear as dread arising from Yahweh’s action and understands the lands as surrounding territories. I make those contextual judgments clearer while retaining the recorded alternative that God sends the terror.
