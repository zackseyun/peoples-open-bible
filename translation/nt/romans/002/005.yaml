theological_decisions:
- issue: Whether to make the temporal phrase more interpretive ('when God’s righteous judgment is revealed') or preserve the nominal structure of the Greek.
  chosen_reading: 'Preserve the nominal structure: ''on the day of wrath and the revelation of God’s righteous judgment.'''
  alternative_readings:
  - '''on the day of wrath when God’s righteous judgment is revealed'''
  rationale: The interpretive clause is contextually sound, but the Greek presents coordinated nouns rather than an explicit finite verb. Preserving that structure better reflects the source while remaining understandable in English.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: Context-sensitive reorientation terminology
  chosen_reading: But because of your hardness and your heart unwilling to reorient toward God, you are storing up wrath for yourself on the day of wrath and the revelation of God[a]’s righteous judgment,
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
