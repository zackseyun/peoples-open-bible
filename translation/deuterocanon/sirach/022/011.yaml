translation:
  text: But a fool’s evil life[a] is worse than death.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'wretched life'; the Greek can describe moral evil or a grievous condition.
    reason: alternative_reading
lexical_decisions:
- source_word: μωροῦ
  chosen: a fool
  alternatives:
  - the foolish man
  - the senseless person
  lexicon: LSJ
  rationale: μωρός denotes a foolish or dull-witted person. 'A fool' is concise, idiomatic, and matches wisdom-literature usage in English.
- source_word: ὑπὲρ θάνατον
  chosen: worse than death
  alternatives:
  - beyond death
  - more than death
  lexicon: LSJ
  rationale: With a comparative sense, ὑπέρ can mean 'more than' or 'beyond'; in this aphoristic construction it naturally yields 'worse than death,' expressing that such a life is more grievous than death itself.
- source_word: ζωὴ πονηρά
  chosen: an evil life
  alternatives:
  - a miserable life
  - a wicked life
  - a bad life
  lexicon: LSJ
  rationale: The phrase is literally 'evil life.' πονηρά can denote moral evil or grievous badness. In context, the saying contrasts the fool's life with death; 'evil life' preserves the Greek wording while allowing both moral and miserable connotations. 'Miserable life' would narrow the sense too much to suffering alone.
- source_word: τοῦ δὲ
  chosen: But for
  alternatives:
  - and for
  - but as for
  lexicon: LSJ
  rationale: δὲ marks a mild contrast with the preceding context. 'But for' gives natural English while preserving the adversative turn.
