  category: meaning_retranslation
  from: Take the waistband that you bought[a], which is on your waist, and arise, go to Perath, and hide it there in a crevice of the rock.
  to: “Take the sash you bought and are wearing around your waist. Set out for the Euphrates[a] and hide it there in a crevice in the rock.”
  rationale: The earlier choice of “Perath” rested chiefly on transliterating names, whereas verse 5 already used “Euphrates.” I adopt the usual identification consistently, preserve the geographical uncertainty in a footnote, and retain the deliberately broad verb “hide.”
