id: NAM.1.12
reference: Nahum 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם שְׁלֵמִים֙ וְ/כֵ֣ן רַבִּ֔ים וְ/כֵ֥ן נָגֹ֖זּוּ וְ/עָבָ֑ר וְ/עִ֨נִּתִ֔/ךְ לֹ֥א אֲעַנֵּ֖/ךְ עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/012.yaml
  text: 'Thus says the LORD: Though they are whole, and likewise many, even so they will be cut down and pass away. Though I have afflicted you, I will afflict you no more.'
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “그들이 온전하고[a] 또한 많다 하더라도, 베어지고 사라질 것입니다. 내가 너를 괴롭혔지만[b], 다시는 너를 괴롭히지 않겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘온전하고’에 해당하는 표현을 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어 본문은 ‘괴롭히다/고난을 주다’ 계열의 동사를 앞 절과 뒷절에서 반복합니다.
    reason: source_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says the LORD
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주께서 이렇게 말씀하십니다
  - 여호와께서 이렇게 말씀하십니다
  lexicon: יהוה
  rationale: 예언문 서두의 공식 표현을 살리면서, 본문 מקור의 신명칭은 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: שְׁלֵמִים
  english_pob_choice: they are whole
  chosen_korean: 온전하고
  alternatives_korean:
  - 멀쩡하고
  - 완전하고
  - 건강하고
  lexicon: שלם
  rationale: 문맥상 군사력이나 상태의 충족/온전함을 가리키므로, 단순한 신체적 ‘건강’보다 넓은 의미를 갖는 ‘온전하다’가 적절합니다.
- source_word: וְכֵן רַבִּים
  english_pob_choice: and likewise many
  chosen_korean: 또한 많다 할지라도
  alternatives_korean:
  - 그와 같이 많아도
  - 그리고 또한 많아도
  - 많고도 많아도
  lexicon: רב
  rationale: ‘많다’는 양적 우세를 유지하되, 앞뒤 역접 구조를 드러내기 위해 양보적 표현으로 자연스럽게 정리했습니다.
- source_word: נָגֹזּוּ וְעָבָר
  english_pob_choice: they will be cut down and pass away
  chosen_korean: 베어지고 사라질 것입니다
  alternatives_korean:
  - 잘려 나가고 지나갈 것입니다
  - 잘리고 지나가 버릴 것입니다
  - 도려내어져 사라질 것입니다
  lexicon: גזז / עבר
  rationale: 두 동사의 연속성을 살려 ‘베어지다’와 ‘사라지다’로 옮겼습니다. ‘pass away’를 단순한 죽음이 아니라 소멸·퇴장을 포함한 시적 표현으로 반영했습니다.
- source_word: עִנִּתִיךְ ... לֹא אֲעַנֵּךְ עוֹד
  english_pob_choice: Though I have afflicted you, I will afflict you no more
  chosen_korean: 내가 너를 괴롭혔지만, 다시는 너를 괴롭히지 않겠습니다
  alternatives_korean:
  - 내가 너를 고난스럽게 했지만, 다시는 그렇게 하지 않겠습니다
  - 내가 너를 학대했지만, 다시는 너를 학대하지 않겠습니다
  lexicon: ענה
  rationale: 원문의 반복 동사를 유지하되, 문맥상 언약적 징벌의 성격을 드러내면서도 현대 한국어에서 의미가 분명한 ‘괴롭히다’로 옮겼습니다. ‘학대하다’는 과도하게 강할 수 있어 기본 본문에는 두지 않았습니다.
theological_decisions:
- issue: 하나님 명칭의 표기
  chosen_reading: 본문의 יְהוָה는 야훼로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 용례를 따라 본문의 신명칭을 직접 드러내고, 예언서의 선포 화자를 분명히 했습니다.
  doctrine_reference: LORD/YHWH naming convention
- issue: ‘괴롭히다’의 정서적 강도
  chosen_reading: עָנָה를 문맥상 ‘징계/고난을 주다’의 의미를 포괄하는 ‘괴롭히다’로 처리했습니다.
  alternative_readings:
  - 학대하다
  - 고난을 주다
  - 압박하다
  rationale: 이 절은 열방에 대한 심판과 유다에 대한 징계를 함께 대비하므로, 지나치게 법정적이거나 신체적 폭력을 상정하는 표현보다 예언적 징계의 폭을 살리는 번역이 적합합니다.
  doctrine_reference: prophetic judgment and discipline
