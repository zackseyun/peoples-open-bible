    issue: ‘암몬 자손의 왕’이라는 표현
    rationale: בְּנֵי עַמּוֹן은 문자적으로는 ‘암몬의 아들들’이나 통상 민족 집단인 암몬 사람들을 가리킵니다. 한국어에서는 ‘암몬 자손’이 혈통상의 후손을 좁게 뜻하는 듯 들릴 수 있으므로 ‘암몬 사람들’이 더 정확하고 자연스럽습니다.
