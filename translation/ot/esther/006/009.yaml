translation:
  text: Let the robe and the horse be entrusted to one of the king’s noble officials. Let them clothe the man whom the king delights to honor, lead him on horseback through the city square, and proclaim ahead of him, ‘This is what is to be done for the man whom the king delights to honor.’”
