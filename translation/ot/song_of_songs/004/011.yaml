  from: Your lips drip honeycomb[a], bride; honey and milk are under your tongue[b], and the fragrance of your garments is like the fragrance of Lebanon.
  to: Honey from the comb drips from your lips[a], bride; honey and milk are under your tongue[b], and the fragrance of your garments is like the fragrance of Lebanon.
  rationale: 'The revision correctly repairs the unnatural and potentially misleading “Your lips drip honeycomb”: נֹפֶת is the sweet substance associated with the comb, not the comb itself. “Honey from the comb drips from your lips” is natural English and retains the distinction from the general דְּבַשׁ later in the verse. However, the Hebrew vocative כַּלָּה has no first-person possessive; immediate-context usage cannot supply “my” here without marking an addition.'
