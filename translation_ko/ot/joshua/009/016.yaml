source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קְצֵה֙ שְׁלֹ֣שֶׁת יָמִ֔ים אַחֲרֵ֕י אֲשֶׁר כָּרְת֥וּ לָ/הֶ֖ם בְּרִ֑ית וַֽ/יִּשְׁמְע֗וּ כִּי קְרֹבִ֥ים הֵם֙ אֵלָ֔י/ו וּ/בְ/קִרְבּ֖/וֹ הֵ֥ם יֹשְׁבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/016.yaml
  text: And it happened at the end of three days, after they had made a covenant with them, that they heard that they were near to them and were living among them.
translation:
  language: ko
  text: 그들이 그들과 언약을 맺은 지 사흘이 지난 뒤, 그들이 자기들에게 가까이 있고 자기들 가운데 살고 있다는 것을 들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/יְהִ֗י מִ/קְצֵה֙ שְׁלֹ֣שֶׁת יָמִ֔ים
  english_pob_choice: And it happened at the end of three days
  chosen_korean: 그리고 그 일이 삼 일 끝에 일어났습니다
  alternatives_korean:
  - 삼 일이 지난 뒤에 이런 일이 있었습니다
  - 사흘이 지난 끝에 그런 일이 일어났습니다
  lexicon: וַיְהִי; מִקְצֵה + temporal expression
  rationale: 서사 시작 공식인 וַיְהִי를 자연스럽게 옮기되, מקור의 시간표현 ‘three days’를 직역해 사건 전개의 시점을 분명히 했습니다.
- source_word: כָּרְת֥וּ לָ/הֶ֖ם בְּרִ֑ית
  english_pob_choice: after they had made a covenant with them
  chosen_korean: 그들이 그들과 언약을 맺은 뒤에
  alternatives_korean:
  - 그들이 그들과 계약을 맺은 뒤에
  - 그들이 그들과 조약을 맺은 뒤에
  lexicon: כרת ברית
  rationale: בְּרִית는 문맥상 ‘언약’이 가장 직접적이며, POB의 ‘covenant’에 대응해 종교·역사적 뉘앙스를 살렸습니다.
- source_word: קְרֹבִ֥ים הֵם֙ אֵלָ֔י/ו
  english_pob_choice: they were near to them
  chosen_korean: 그들이 자기들에게 가까이 있으며
  alternatives_korean:
  - 그들이 그들에게 가까웠으며
  - 그들이 그들 가까이에 있음을
  lexicon: קרוב + pronominal relation
  rationale: כינוי가 지시하는 방향 관계를 분명히 하기 위해 ‘자기들에게’로 옮겨, 근접성의 대상이 되는 ‘to them’ 의미를 유지했습니다.
- source_word: וּ/בְ/קִרְבּ֖/וֹ הֵ֥ם יֹשְׁבִֽים
  english_pob_choice: and were living among them
  chosen_korean: 자기들 가운데 살고 있다는 것을
  alternatives_korean:
  - 그들 가운데 거주하고 있다는 것을
  - 그들 안에 함께 살고 있다는 것을
  lexicon: בקרב + ישב
  rationale: בקרב는 단순한 근접이 아니라 ‘가운데/한복판’의 공동거주를 뜻하므로 ‘자기들 가운데’로 옮겼습니다.
theological_decisions:
- issue: 언약의 성격을 ‘조약’이 아니라 ‘언약’으로 유지할지 여부
  chosen_reading: ‘언약’으로 유지했습니다.
  alternative_readings:
  - 조약으로 중립화함
  - 계약으로 현대화함
  rationale: 여호수아 9장의 서술은 단순한 외교문서보다 신학적으로 중대한 언약 체결을 가리키므로, 원문의 ברית를 표준적 성서 용어인 ‘언약’으로 보존하는 것이 적절합니다.
  doctrine_reference: 성경의 언약 신학
