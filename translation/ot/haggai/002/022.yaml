  source_word: וְרֹכְבֶיהָ
  chosen: its rider
  alternatives:
  - its riders
  lexicon: HALOT
  rationale: The form is plural construct with a 3fs suffix, literally 'its riders,' referring back to the singular collective 'chariot.' English often smooths such collective constructions; however, to match the paired singular imagery in the clause, 'its rider' is used. The following plural clause then broadens to 'horses and their riders.'
theological_decisions:
- issue: Gendered language in אִישׁ ... אָחִיו
  chosen_reading: each by the sword of his brother
  alternative_readings:
  - each by his brother's sword
  - each by the sword of another
  rationale: The Hebrew uses masculine singular terms אִישׁ and אָחִיו in an idiomatic distributive expression. Per the project's gender-accurate policy, the masculine form is preserved rather than neutralized, while the sense remains representative of combatants generally.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
