  category: meaning_retranslation
  from: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
  to: Then he spread the tent fabric[a] over the tabernacle and placed the tent’s outer covering on top, just as Yahweh had commanded Moses.
  rationale: The earlier analysis rightly distinguished the tent layer from its protective covering but retained technical wording that could suggest two separate tents. I make that distinction explicit while keeping the full obedience formula and the prior-command tense.
