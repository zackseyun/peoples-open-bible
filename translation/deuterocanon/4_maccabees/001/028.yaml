  text: καθάπερ οὖν δυοῖν τοῦ σώματος καὶ τῆς ψυχῆς φυτῶν ὄντων ἡδονῆς τε καὶ πόνου, πολλαὶ τούτων τῶν παθῶν εἰσι παραφυάδες·
  language: Greek
