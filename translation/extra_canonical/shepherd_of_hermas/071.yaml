  text: Εἶτα ἐπεδίδουν οἱ τὰς ῥάβδους χλωρὰς μὲν ἔχοντες, σχισμὰς δὲ ἐχούσας· οὗτοι πάντες χλωρὰς ἐπέδωκαν,
    καὶ ἔστησαν εἰς τὸ ἴδιον τάγμα. ἐχάρη δὲ ὁ ποιμὴν ἐπὶ τούτοις, ὅτι πάντες ἠλλοιώθησαν καὶ ἀπέθεντο
    τὰς σχισμὰς αὐτῶν. 2. ἐπέδωκαν δὲ καὶ οἱ τὸ ἥμισυ χλωρόν, τὸ δὲ ἥμισυ ξηρὸν ἔχοντες· τινῶν οὖν εὑρέθησαν
    αἱ ῥάβδοι ὁλοτελῶς χλωραί, τινῶν ἡμίξηροι, τινῶν ξηραὶ καὶ βεβρωμέναι, τινῶν δὲ χλωραὶ καὶ παραφυάδας
    ἔχουσαι. οὗτοι πάντες ἀπελύθησαν ἕκαστος πρὸς τὸ τάγμα αὐτοῦ. 3. εἶτα ἐπέδωκαν οἱ τὰ δύο μέρη χλωρὰ
    ἔχοντες, τὸ δὲ τρίτον ξηρόν· πολλοὶ ἐξ αὐτῶν χλωρὰς ἐπέδωκαν, πολλοὶ δὲ ἡμιξήρους, ἕτεροι δὲ ξηρὰς
    καὶ βεβρωμένας· οὗτοι πάντες ἔστησαν εἰς τὸ ἴδιον τάγμα. [4. εἶτα ἐπέδωκαν οἱ τὰ δύο μέρη ξηρὰ ἔχοντες,
    τὸ δὲ τρίτον χλωρόν. πολλοὶ ἐξ αὐτῶν ἡμιξήρους ἐπέδωκαν, τινὲς δὲ ξηρὰς καὶ βεβρωμένας, τινὲς δὲ ἡμιξήρους
    καὶ σχισμὰς ἐχούσας, ὀλίγοι δὲ χλωράς. οὗτοι πάντες ἔστησαν εἰς τὸ ἴδιον τάγμα.] 5. ἐπέδωκαν δὲ οἱ
    τὰς ῥάβδους αὐτῶν χλωρὰς ἐσχηκότες, ἐλάχιστον δὲ [ξηρὸν] καὶ σχισμὰς ἐχούσας. ἐκ τούτων τινὲς χλωρὰς
    ἐπέδωκαν, τινὲς δὲ χλωρὰς καὶ παραφυάδας ἐχούσας. ἀπῆλθον καὶ οὗτοι εἰς τὸ τάγμα αὐτῶν. 6. εἶτα ἐπέδωκαν
    οἱ ἐλάχιστον ἔχοντες χλωρόν, τὰ δὲ λοιπὰ μέρη ξηρά· τούτων αἱ ῥάβδοι εὑρέθησαν τὸ πλεῖστον μέρος χλωραὶ
    καὶ παραφυάδας ἔχουσαι καὶ καρπὸν ἐν ταῖς παραφυάσι, καὶ ἕτεραι χλωραὶ ὅλαι. ἐπὶ ταύταις ταῖς ῥάβδοις
    ἐχάρη ὁ ποιμὴν λίαν [μεγάλως], ὅτι οὕτως εὑρέθησαν. ἀπῆλθον δὲ οὗτοι ἕκαστος εἰς τὸ ἴδιον τάγμα.
