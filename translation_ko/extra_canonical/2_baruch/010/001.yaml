translation:
  language: ko
  text: '그리고 일곱 날이 지난 뒤에, 하나님의 말씀이 내게 임하여 내게 말씀하셨습니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the word of God
  english_pob_choice: the word of God
  chosen_korean: 하나님의 말씀
  alternatives_korean:
  - 하나님 말씀
  - 말씀
  lexicon: θεοῦ λόγος / ܡܠܬܐ ܕܐܠܗܐ
  rationale: 원문의 ‘하나님의 말씀’은 발화 주체를 분명히 드러내므로, 합쇼체 본문에서는 가장 직접적인 표준 표현인 ‘하나님의 말씀’으로 옮겼습니다.
- source_word: came to me
  english_pob_choice: came to me
  chosen_korean: 내게 임하여
  alternatives_korean:
  - 내게 왔습니다
  - 내게 이르렀습니다
  lexicon: ܐܬܐ / ܐܬܡܠܠ
  rationale: 예언적 수신 공식을 살려 단순한 도착보다 계시의 도래 뉘앙스를 지닌 ‘임하다’를 택했습니다.
- source_word: said to me
  english_pob_choice: and said to me
  chosen_korean: 내게 말씀하셨습니다
  alternatives_korean:
  - 내게 말하셨습니다
  - 내게 이르셨습니다
  lexicon: ܐܡܪ
  rationale: 신적 화자의 존대 표현을 유지하면서도, 직설적 발화인 ‘말씀하셨습니다’로 공적·문어적 톤을 살렸습니다.
- source_word: after seven days
  english_pob_choice: after seven days
  chosen_korean: 일곱 날이 지난 뒤에
  alternatives_korean:
  - 칠 일이 지나서
  - 일주일 뒤에
  lexicon: ܒܬܪ ܫܒܥܐ ܝܘܡܝ̈ܢ
  rationale: 원문의 시간표현을 과도하게 현대화하지 않고, 서사적·성서적 어감을 유지하는 직역형으로 처리했습니다.
theological_decisions:
- issue: 계시 발화의 주체와 수신 방식
  chosen_reading: ‘하나님의 말씀’이 ‘내게 임하여…말씀하셨습니다’라는 예언적 공식으로 이해되도록 옮겼습니다.
  alternative_readings:
  - ‘하나님의 말씀이 내게 와서 말했다’
  - ‘하나님께서 내게 말씀하셨습니다’
  rationale: 본문은 단순한 정보 전달이 아니라 계시의 도래를 말하므로, 말씀의 ‘임함’과 직접 발화를 함께 보존하는 것이 가장 충실합니다.
  doctrine_reference: 예언서/묵시문학의 계시 수용 공식
- issue: 직접 인용 시작의 절제
  chosen_reading: 절 끝의 콜론으로 다음 발화가 이어지는 구조를 유지했습니다.
  alternative_readings:
  - 따옴표를 열어 다음 절로 넘김
  - 문장부호 없이 마침
  rationale: 현존 영어 POB와 원문의 서술 흐름이 ‘그리고…말씀하셨습니다:’로 다음 명령문을 예고하므로, 본절에서는 인용 시작만 예고하는 방식이 적절합니다.
  doctrine_reference: 문학적 구조 보존
