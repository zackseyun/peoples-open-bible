translation:
  text: And as for Semyaza, you gave him authority to rule over those who were together with him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Semyaza is a readable transliteration of the selected Ethiopic name, consistent with this edition’s earlier Watcher
      passage. The parenthesized conjunction at the beginning is an editorial supply in Charles; no new evil deed is attributed
      to a different named figure.
    reason: textual_variant
lexical_decisions:
- source_word: (ወዘ)ስምያዛ
  chosen: And as for Semjaza
  alternatives:
  - And Semjaza
  - And concerning Semjaza
  rationale: The construction introduces Semjaza as a further subject in the angels’ report. “As for” makes the topic shift
    intelligible without altering the proper name.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዘአንተ ወሀብኮ ስልጣነ
  chosen: you gave him authority
  alternatives:
  - to whom you gave authority
  - you granted him dominion
  rationale: The Ge'ez attributes the authority directly to the addressed deity. English requires the pronominal object “him”
    for a natural rendering of the resumptive construction.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይኵንን
  chosen: to rule over
  alternatives:
  - to govern
  - to exercise authority over
  - to judge
  rationale: In this context the verb denotes exercising leadership or dominion over Semjaza’s associates. “Rule over” preserves
    the hierarchical sense; “judge” would suggest a specifically judicial act not demanded here.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እለ ምስሌሁ ኅቡረ
  chosen: those who were together with him
  alternatives:
  - those who were with him
  - his companions
  - his associates
  rationale: A relatively literal rendering preserves both the relative phrase “those who were with him” and the collective
    force of ኅቡረ. “Companions” is smoother but could understate their organized association.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
