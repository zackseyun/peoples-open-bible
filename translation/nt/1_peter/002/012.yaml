    text: Literally, 'the Gentiles,' here referring to those outside the believing community.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'on the day of visitation.' This may refer to God’s coming in judgment or to his gracious intervention.
    reason: alternative_reading
