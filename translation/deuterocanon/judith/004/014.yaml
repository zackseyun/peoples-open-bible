translation:
  text: The Lord heard their cry and looked upon their affliction. The people throughout Judea and Jerusalem kept fasting for many days before the sanctuary[a] of the Lord Almighty.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'holy things'; the Greek plural can refer to the sanctuary or to sacred objects.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσήκουσεν
  chosen: heard
  alternatives:
  - listened to
  - heard favorably
  lexicon: BDAG
  rationale: The verb commonly means 'hear' or 'listen to,' often with the nuance of hearing favorably in response to prayer. 'Heard' is natural English and preserves the likely implication without over-interpreting it as explicit intervention.
- source_word: τῆς φωνῆς αὐτῶν
  chosen: their voice
  alternatives:
  - their cry
  - what they said
  lexicon: BDAG
  rationale: φωνή is literally 'voice.' In a prayer context 'cry' is possible, but the Greek does not require the more emotive rendering, so the more transparent 'their voice' is retained.
- source_word: ἐπεῖδεν
  chosen: looked upon
  alternatives:
  - saw
  - took notice of
  lexicon: BDAG
  rationale: The compound verb suggests more than bare visual perception; 'looked upon' preserves the idiomatic sense of attentive regard while remaining close to the Greek.
- source_word: θλίψιν
  chosen: affliction
  alternatives:
  - distress
  - tribulation
  lexicon: BDAG
  rationale: θλῖψις here refers to the people's suffering or pressure. 'Affliction' is idiomatic, weighty, and suitable in a prayer-deliverance context.
- source_word: ἦν ὁ λαὸς νηστεύων
  chosen: the people were fasting
  alternatives:
  - the people kept fasting
  - the people were in fasting
  lexicon: BDAG
  rationale: The periphrastic construction conveys ongoing action. 'Were fasting' captures the durative sense in readable English.
- source_word: ἡμέρας πλείους
  chosen: for many days
  alternatives:
  - for several days
  - for more days
  lexicon: BDAG
  rationale: The phrase idiomatically indicates an extended period. 'For many days' is the clearest natural rendering.
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  chosen: throughout all Judea and Jerusalem
  alternatives:
  - in all Judea and Jerusalem
  - throughout Judea and Jerusalem
  lexicon: BDAG
  rationale: ἐν with the distributive phrase indicates the extent of the fasting across the region and city. 'Throughout all' reflects the breadth emphasized by πάσῃ.
- source_word: κατὰ πρόσωπον
  chosen: before
  alternatives:
  - in the presence of
  - before the face of
  lexicon: BDAG
  rationale: This idiom means 'before' or 'in the presence of.' 'Before' is concise and natural while preserving the cultic setting.
- source_word: τῶν ἁγίων
  chosen: the holy things
  alternatives:
  - the sanctuary
  - the holy places
  - the sacred things
  lexicon: BDAG
  rationale: The plural adjective used substantivally most naturally refers to sacred objects or holy things rather than a singular sanctuary. Because the Greek is plural, 'the holy things' best preserves the form and avoids collapsing it into a more interpretive singular.
- source_word: Κυρίου Παντοκράτορος
  chosen: the Lord Almighty
  alternatives:
  - the Almighty Lord
  - the Lord, the Almighty
  lexicon: BDAG
  rationale: κύριος is rendered 'Lord' per project doctrine, and παντοκράτωρ is conventionally and accurately 'Almighty.' The phrase functions as a divine title.
