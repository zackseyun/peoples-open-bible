  from: They are unconquerable on behalf of virtue. While he was still saying these things, they spread fire beneath him, and, by intensifying the wheel, they tightened it further.
  to: They are unconquerable for the sake of virtue. While he was still saying these things, they piled on more fire, and, by turning the wheel more violently, they tightened it further.
  rationale: Revised 'on behalf of virtue' to 'for the sake of virtue' for more natural rendering of ὑπὲρ ἀρετῆς. Changed 'spread fire beneath him' to 'piled on more fire' to better reflect ἔτι πῦρ ἐπέστρωσαν. Rendered διερεθίζοντες τὸν τροχὸν as 'turning the wheel more violently' for clearer, more natural English while preserving the sense, and kept the final clause as tightening it further.
