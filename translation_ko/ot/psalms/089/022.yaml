  rationale: 시적 병행에서 하나님의 지지와 능력을 나타내는 몸의 이미지를 평탄화하지 않고 유지하는 것이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
