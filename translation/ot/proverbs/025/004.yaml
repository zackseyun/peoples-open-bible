  human_or_scholar_review: false
  review_summary: 'כֶּלִי here is best understood as material fit for fashioning rather than a vessel already produced: removal of dross yields usable silver for the artisan. The current “a vessel comes out for the refiner” misleadingly suggests that refining itself produces a completed vessel and uses stiff English. “Silversmith” fits the artisan who will make an object from the purified silver.'
