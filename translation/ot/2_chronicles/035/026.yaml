id: 2CH.35.26
reference: 2 Chronicles 35:26
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וַ/חֲסָדָ֑י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה׃
translation:
  text: The rest of Josiah’s acts and his deeds of faithful love in accordance with what is written in the Law of Yahweh,
  philosophy: dynamic
lexical_decisions:
- source_word: וְיֶתֶר
  chosen: The rest of
  alternatives:
  - And the rest of
  - The remainder of
  - Now the rest of
  lexicon: HALOT
  rationale: 'יֶתֶר introduces the remaining material about Josiah. ''Now'' gives natural English discourse flow while preserving the conjunctive sense of וְ. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: דִּבְרֵי
  chosen: the acts of
  alternatives:
  - the words of
  - the matters concerning
  lexicon: HALOT
  rationale: Though literally 'words of,' in royal-summary formulas דִּבְרֵי commonly refers to the deeds/events of a king. 'Acts' best matches the historiographical idiom in English.
- source_word: יֹאשִׁיָּהוּ
  chosen: Josiah
  rationale: Personal name transliterated by standard English convention.
- source_word: וַחֲסָדָיו
  chosen: his deeds of covenant faithfulness
  alternatives:
  - his faithful deeds
  - his acts of loyalty
  - his good deeds
  - his kindnesses
  lexicon: HALOT
  rationale: חֶסֶד can denote kindness, loyalty, or covenant faithfulness. In this royal evaluation context, it points to Josiah's loyal, pious actions in relation to the LORD and the law. 'Deeds of covenant faithfulness' preserves the theological weight better than the flatter 'kindnesses' or merely moral 'good deeds'.
- source_word: כַּכָּתוּב
  chosen: as written
  alternatives:
  - according to what is written
  - as it is written
  lexicon: HALOT
  rationale: The comparative preposition כ plus passive participle means 'as written' or 'according to what is written.' 'As written' is concise and natural here.
- source_word: בְּתוֹרַת
  chosen: in the Law of
  alternatives:
  - in the instruction of
  - in the Torah of
  lexicon: HALOT
  rationale: תּוֹרָה here refers specifically to the authoritative written Mosaic law. 'Law' is the most idiomatic rendering in this historical context; alternatives are viable but less natural in standard English Bible style.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
