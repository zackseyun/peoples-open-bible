id: PRO.22.12
reference: Proverbs 22:12
source:
  edition: WLC
  text: עֵינֵ֣י יְ֭הוָה נָ֣צְרוּ דָ֑עַת וַ֝/יְסַלֵּ֗ף דִּבְרֵ֥י בֹגֵֽד׃
translation:
  text: The eyes of Yahweh guard knowledge[a], but he overturns the words of the treacherous.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “guard those who have knowledge.”
    reason: alternative_reading
lexical_decisions:
- source_word: עֵינֵי יְהוָה
  chosen: The eyes of Yahweh
  alternatives:
  - The LORD's eyes
  lexicon: HALOT
  rationale: A literal rendering preserves the anthropomorphic imagery of divine watchfulness. 'the LORD' follows the doctrinal default for יְהוָה.
- source_word: נָצְרוּ
  chosen: guard
  alternatives:
  - guard
  - keep
  - watch over
  lexicon: HALOT
  rationale: A direct and idiomatic rendering of the verb’s guarding/keeping sense.
- source_word: דָעַת
  chosen: knowledge
  alternatives:
  - understanding
  lexicon: HALOT
  rationale: דעת is most naturally 'knowledge' in Proverbs and pairs well with the verb 'preserve.' This keeps the wisdom-literature emphasis on true knowledge rather than a more interpretive gloss.
- source_word: וַיְסַלֵּף
  chosen: overturns
  alternatives:
  - he subverts
  - he distorts
  - he overthrows
  lexicon: HALOT
  rationale: A defensible contextual rendering; “distorts” is retained as an alternative.
- source_word: דִּבְרֵי
  chosen: the words of
  alternatives:
  - the matters of
  - the speech of
  lexicon: HALOT
  rationale: Although דבר can mean 'matter' as well as 'word,' 'words' is the most straightforward sense here and matches the immediate object of divine overturning.
- source_word: בֹגֵד
  chosen: the treacherous
  alternatives:
  - the faithless
  - the betrayer
  - the unfaithful man
  lexicon: HALOT
  rationale: בוגד denotes one who acts treacherously or faithlessly. 'The treacherous' is concise, natural English and avoids over-specifying whether the focus is covenantal, interpersonal, or general deceit.
