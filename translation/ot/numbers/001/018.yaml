  from: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
  to: They assembled the whole congregation on the first day of the second month. The men twenty years old and over registered themselves by name, one by one, declaring their ancestry by clan and ancestral household.
  rationale: The earlier lexical decision and note correctly recognize registration on the basis of declared descent; that fuller meaning now appears in the main text. The clan and paternal-household structure is retained, while the split sentence clarifies the change of subject and removes the need for the earlier idiom notes.
