translation:
  text: “When the day, the power, the punishment and the judgment come, which the Lord of Spirits has prepared for
    those who do not bow to righteous judgment, who deny righteous judgment and take his name in vain—that day has
    been prepared as an oath for the chosen and an inquiry for sinners…”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected source negates bowing to righteous judgment, includes denial of that judgment, and says taking
      his name in vain. The final selected nouns are oath for the chosen and inquiry for sinners; they are not replaced
      by a different promise. Four printed dots after the final sentence are represented by an ellipsis. Charles’s
      note on printed104 says verse25 should follow immediately, but this proposal keeps the printed unit order
      and does not invent a connecting conclusion.
    reason: textual_variant
