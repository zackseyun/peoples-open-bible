  source_fidelity: 히브리어의 대명사는 문맥상 하나님을 가리키며, כָל־דְּבָרָיו는 ‘그의 모든 말/일’에 관하여 하나님이 답하지 않으심을 말합니다. 초안의 ‘그의 모든 말에 대하여 대답하지’는 ‘그의 말에 응답하지 않는다’처럼 읽힐 여지가 있어, 소유 관계를 분명히 하는 편이 안전합니다.
  naturalness: ‘어찌하여’와 합쇼체 문체는 자연스럽습니다. ‘자신의 모든 말씀에 대해’로 고치면 한국어 문장 관계가 더 명료해집니다.
  terminology: 문맥의 신적 지시를 존중하여 ‘그분’과 높임말을 유지했습니다. 원문의 דָּבָר가 지닌 ‘말’과 ‘일/사안’의 폭은 있으나, 영어 POB의 audit trail이 ‘words’를 채택하므로 본문에서는 ‘말씀’을 사용했습니다.
  issues:
