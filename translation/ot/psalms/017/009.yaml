  human_or_scholar_review: false
  review_summary: “Devastate me” overstates the imperfective hostile action and sounds resultative, while שׁדד here can naturally describe violent assault. More importantly, בְּנֶפֶשׁ should not be compressed into the adjective “deadly,” which obscures the explicit life/soul element. The revised wording preserves the life-threatening intent without claiming that the enemies themselves are lethal by nature.
