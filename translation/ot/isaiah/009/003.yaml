  meaning: God has broken the oppressor's yoke, bar, and rod from his people as decisively as he defeated Midian in Gideon's day.
  meaning_decisions:
  - source_phrase: עֹל סֻבֳּלוֹ ... מַטֵּה שִׁכְמוֹ ... הַנֹּגֵשׂ בּוֹ
    prior_rendering: the yoke of his burden, and the staff on his shoulder, the rod of his oppressor
    new_rendering: the yoke that burdened them, the bar across their shoulders, the rod of their taskmaster
    rationale: The singular suffix refers to the people as a whole (the nation of verse 2), so English 'them' avoids a confusing 'his'. The staff on the shoulder is the yoke-bar, and נֹגֵשׂ is the slave-driver of the Egyptian bondage (Exodus 3:7; 5:6), which 'taskmaster' carries better than 'oppressor'.
  - source_phrase: הַחִתֹּתָ
    prior_rendering: you have shattered them
    new_rendering: you have shattered them all
    rationale: Gathers the three fronted objects under the one verb, keeping the Hebrew's emphatic order.
