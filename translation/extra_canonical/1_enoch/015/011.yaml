translation:
  text: 'And the spirits of the giants are like clouds: they oppress and corrupt,
    fall and fight, and are crushed upon the earth. They cause sorrow; they eat no
    food, yet they thirst and grapple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The supplied Ethiopic reads “clouds,” marked as doubtful in the printed
      text. “Like” is supplied to express the apparent comparison; the reading remains
      uncertain.
    reason: textual_variant
  - marker: b
    text: The final verb is difficult; it may suggest embracing or seizing rather
      than “grappling.”
    reason: lexical_alternative
lexical_decisions:
- source_word: መንፈሰ፡ ረዐይት
  chosen: spirits of the giants
  alternatives:
  - spirits of the mighty ones
  rationale: The surrounding passage identifies these spirits with the giants; the
    rendering preserves that identification.
- source_word: ደመናት
  chosen: like clouds
  alternatives:
  - clouds
  - omit as corrupt
  rationale: The supplied witness reads 'clouds.' English 'like' makes the apparent
    comparison intelligible without suppressing the difficult word.
- source_word: ይገፍዑ፡ ወያማስኑ
  chosen: oppress and corrupt
  alternatives:
  - afflict and ruin
  rationale: Retains two distinct harmful actions rather than collapsing them into
    a general description of evil.
- source_word: ይወድቁ፡ ወይትበአሱ፡ ወይደቅቁ
  chosen: fall and fight, and are crushed
  alternatives:
  - attack, fight, and crush
  rationale: Keeps the repeated verbs and the witness’s surprising 'fall' rather than
    replacing them with a conventional list of assaults. The force of the final verb
    is uncertain.
- source_word: ወኃዘነ፡ ይገብሩ
  chosen: They cause sorrow
  alternatives:
  - they make grief
  rationale: Renders the causative expression in readable English while preserving
    its distinct statement.
- source_word: ወኢምንተኒ፡ ዘይበልዑ፡ እክለ፡ ወይጸምኡ
  chosen: they eat no food, yet they thirst
  alternatives:
  - they eat nothing of food and thirst
  rationale: Preserves the contrast between not eating and thirsting without adding
    hunger, which is not stated in the supplied wording.
- source_word: ወይትዐቀፉ
  chosen: and grapple
  alternatives:
  - and embrace one another
  - and are seized
  rationale: The form suggests embracing or grasping, but its sense here is uncertain.
    'Grapple' conveys physical contact in the context of fighting without importing
    an unrelated action.
theological_decisions:
- issue: Identity and activity of the giants’ spirits
  chosen_reading: The spirits remain identified as those of the giants and are described
    through the witness’s concrete actions.
  alternative_readings:
  - Identify them explicitly as demons
  rationale: The verse does not use an unambiguous term for demons; that identification
    should not replace its local wording.
