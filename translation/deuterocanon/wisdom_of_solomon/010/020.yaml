  text: διὰ τοῦτο δίκαιοι ἐσκύλευσαν ἀσεβεῖς, καὶ ὕμνησαν, Κύριε, τὸ ὄνομα τὸ ἅγιόν σου, τήν τε ὑπέρμαχόν σου χεῖρα ᾔνεσαν ὁμοθυμαδόν.
  language: Greek
  pages:
