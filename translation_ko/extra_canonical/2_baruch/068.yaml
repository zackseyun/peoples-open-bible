base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/068.yaml
  text: '1 And the twelfth waters that you saw, which were bright—this is the word:

    2 After these things a time will come when your people will fall into such distress that they will all be in danger of perishing together.

    3 Yet they will be saved, and their enemies will fall before them.

    4 And in time they will have much joy.

    5 And then, after a short interval, Zion will be rebuilt, its offerings restored, and the priests will return to their ministry.

    6 The nations also will come to honor it, but not as fully as before.

    7 But after these things many nations will fall.

    8 These are the bright waters that you saw.'
translation:
  language: ko
  text: '1 네가 본 그 열두 번째 물은, 곧 밝은 물들입니다. 이것이 그 말씀입니다.


    2 그 뒤에 때가 오면, 네 백성이 큰 환난에 떨어져 모두 함께 멸망할 위기에 놓일 것입니다.


    3 그러나 그들은 구원을 받을 것이고, 그들의 원수들은 그들 앞에서 무너질 것입니다.


    4 그리고 때가 되면 그들은 큰 기쁨을 누릴 것입니다.


    5 그러고 나서 잠시 뒤에 시온이 다시 세워지고, 그 제사가 회복되며, 제사장들은 다시 자기 직무로 돌아올 것입니다.


    6 또한 여러 민족이 와서 그곳에 경의를 표할 것이나, 이전만큼은 아닐 것입니다.


    7 그러나 그 뒤에는 많은 민족이 무너질 것입니다.


    8 이것이 네가 본 밝은 물들입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܪܬ ܢܦܫܗ / ܐܬܬܙܝܥ
  english_pob_choice: a time will come when your people will fall into such distress
  chosen_korean: “큰 환난에 떨어져”
  alternatives_korean:
  - “흔들릴”
  - “동요될”
  - “고난을 겪을”
  lexicon: ܐܬܬܙܝܥ = be shaken/moved; contextually distress, upheaval
  rationale: 시적인 원문이 ‘흔들림’의 이미지를 쓰지만, 문맥상 백성이 겪는 재난을 분명히 드러내기 위해 ‘큰 환난’으로 풀었습니다.
- source_word: ܢܫܟܘܚ ... ܘܐܘ ܡܕܡ ܚܕܬܐ
  english_pob_choice: so that ... no one will find anything new
  chosen_korean: “모두 함께 멸망할 위기에 놓일 것입니다”
  alternatives_korean:
  - “아무도 질문 하나도 찾지 못할 것입니다”
  - “새로운 어떤 것도 찾지 못할 것입니다”
  lexicon: ܢܫܟܘܚ = find/obtain; ܫܘܐܠܐ = question; idiomatic and textually difficult
  rationale: 시리아어 문장이 파손·압축된 상태라 직역하면 의미가 불분명해져, 영어 POB가 복원한 재난 문맥을 따라 핵심 의미를 한국어로 자연스럽게 드러냈습니다.
- source_word: ܐܬܒܨܪܘ ... ܒܟܠ ܐܬܪ
  english_pob_choice: will fall ... be restored / will return to their ministry
  chosen_korean: “다시 세워지고 … 회복되며 … 다시 자기 직무로 돌아올 것입니다”
  alternatives_korean:
  - “재건되고 … 회복되고 … 봉사로 돌아올 것입니다”
  - “세워지고 … 돌려지고 … 섬김으로 돌아올 것입니다”
  lexicon: ܐܬܒܨܪ / ܐܬܥܒܕ ܚܕܬܐ / ܦܘܪܩܢܐ = restored/rebuilt; ministry/service
  rationale: 시온, 제사, 제사장의 세 요소를 각각 살리면서, 영어 POB의 ‘rebuilt / restored / return to their ministry’에 맞춰 공적·성전적 회복의 흐름을 유지했습니다.
- source_word: ܐܬܚܙܝܬ ܠܐܒܗܝܟܘܢ / ܣܓܝ̈ܐܐ
  english_pob_choice: The nations also will come to honor it
  chosen_korean: “여러 민족이 와서 그곳에 경의를 표할 것이나”
  alternatives_korean:
  - “민족들도 와서 그것을 존귀하게 할 것이나”
  - “이방들도 와서 그것을 공경할 것이나”
  lexicon: ܐܒܗܝܟܘܢ/ܐܝܩܪܐ = honor, respect; nations
  rationale: ‘경의를 표하다’는 현대 한국어로 존중의 행위를 분명히 보여 주며, 전통적 교회어 ‘영화롭게 하다’보다 원문의 사회적 경의 뉘앙스를 더 잘 살립니다.
theological_decisions:
- issue: 시온의 회복과 제사장 직무의 재개
  chosen_reading: 미래에 시온이 다시 세워지고 제사가 회복되며 제사장들이 다시 직무를 수행하는 역사적·종말론적 회복으로 옮겼습니다.
  alternative_readings:
  - 상징적 공동체 회복으로 완화
  - 성전 제도 비판을 반영해 비유적으로만 번역
  rationale: 본문은 구체적 장소·제사·제사장 직무를 연쇄적으로 말하므로, 상징화하지 않고 원문이 가진 성전 회복의 실재성을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: Second Temple restoration imagery in apocalyptic literature
