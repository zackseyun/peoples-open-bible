  from: The one who had received the five talents went and worked with them[a][b], and gained another five.
  to: Immediately, the one who had received the five talents went and worked with them[a][b], and gained another five.
  rationale: The draft adds 'at once' to translate the aorist participle πορευθεὶς ('having gone' / 'went'). The lexical notes admit this is 'supplied to reflect... prompt action.' However, πορευθεὶς contains no temporal immediacy. Furthermore, the adverb εὐθέως ('immediately') appears at the end of verse 15 in the SBLGNT and was already translated in the draft's verse 15 ('went away immediately'). Adding 'at once' in verse 16 is an unwarranted addition to the source text.
