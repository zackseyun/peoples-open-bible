  from: your foot may crush in blood
  to: your foot may crush them in blood
  rationale: The Hebrew verb 'timḥaṣ' (crush) is transitive. The current English rendering uses it intransitively, resulting in the awkward phrase 'crush in blood,' which is unidiomatic. Supplying the implied object 'them' (the enemies), as the existing footnote already suggests, resolves the awkwardness and clarifies the meaning without departing from the sense of the Hebrew.
- timestamp: '2026-04-23T21:04:12Z'
  adjudicator: gemini-gemini-3.1-pro-preview-revision-pass
  reviewer_model: gemini-3.1-pro-preview
  category: revision_pass
  from: so that your foot may crush them in blood, and the tongue of your dogs may have its portion from the enemies, from him.
  to: so that your foot may crush them in blood, and the tongue of your dogs may have its portion from the enemies.
  rationale: Removed the redundant 'from him', which was a double translation of the Hebrew word 'minnehu' (often translated contextually here as 'its portion').
- timestamp: '2026-08-28T22:06:58Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: mistranslation
  tier: 1
  from: so that your foot may crush them in blood[a], and the tongue of your dogs may have its portion from the enemies.
  to: so that you may bathe your foot in blood, and the tongue of your dogs may have its share from the enemies.[a]
  rationale: With “foot” as the object, the clause depicts the foot being dipped or bathed in blood; the current rendering instead makes the foot the subject of “crush” and supplies an unexpressed object. The final phrase is genuinely elliptical. “Its share from the enemies” is more faithful to the source relation than “share of the enemies,” while retaining a note for the difficult final element.
- timestamp: '2026-11-09T18:43:01Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
