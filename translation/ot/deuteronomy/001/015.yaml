  from: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
  to: So I took the leaders of your tribes—wise and well-known men—and appointed them over you as leaders of groups of a thousand, a hundred, fifty, and ten, and as officials for your tribes.
  rationale: I gave the passive Hebrew participle and its identical use in verse 13 greater weight than the recorded preference for 'knowledgeable.' The judicial context also supports describing the hierarchy as leadership and administration rather than solely military command.
