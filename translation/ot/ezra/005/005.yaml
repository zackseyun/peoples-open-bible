  from: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
  to: But the eye of their God was on the Jewish elders, so the officials did not stop their work while the matter was referred to Darius and a written reply concerning it was awaited.
  rationale: I preserve the history's concrete 'eye' image and its recognition that the referral and response are pending. The letter in verses 6–17 clarifies what goes to Darius, while naming the officials resolves the earlier pronoun ambiguity.
