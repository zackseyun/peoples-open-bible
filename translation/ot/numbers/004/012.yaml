    b: alternative_meaning
  history_weighed: The recorded revisions chiefly concern an unnecessary article and carry little interpretive weight. I retain the sacred-service meaning but do not accept the earlier argument that plural utensils require 'frame'; the alternative is noted consistently with verse 10.
