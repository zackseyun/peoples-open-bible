  from: But they lie in wait for their own blood[b][a]; they set an ambush for their own lives.
  to: But they lie in wait for their own blood[a]; they lie concealed for their own lives[b].
  rationale: The proposal rightly avoids treating יִצְפְּנוּ as though it explicitly meant “set an ambush”; its core image is concealment. But “hide in ambush for their own lives” is awkward English. “Lie concealed for their own lives” naturally preserves the distinct concealment image, while the context and parallel first clause retain the ambush setting and the intended irony. The wording does not make “for their lives” mean that they are protecting themselves; it remains the parallel target phrase.
