translation:
  text: 'I opened my mouth and spoke of her[a]: acquire wisdom for yourselves without silver[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew's 'of her' has a feminine singular suffix, contextually referring to Wisdom. Stored Greek says only 'I spoke' in this clause; it does not share that pronoun.
    reason: textual_variant
  - marker: b
    text: Hebrew explicitly names wisdom and says 'for yourselves'. Stored Swete leaves the acquisition object unstated and has masculine/neuter plural dative αὐτοῖς, not a feminine singular pronoun. This reports the stored form without emending it.
    reason: textual_variant
lexical_decisions:
- source_word: פִּי פָתַחְתִי וְדִבַּרְתִּי בָהּ, קְנוּ לָכֶם חָכְמָה בְּלֹא כָסֶף.
  chosen: 'I opened my mouth and spoke of her: acquire wisdom for yourselves without silver.'
  rationale: פָתַחְתִּי Qal qatal 1cs; דִבַּרְתִּי Piel qatal 1cs; בָהּ preposition with 3fs suffix; קְנוּ Qal imperative 2mp; לָכֶם preposition with 2mp suffix; חָכְמָה explicit noun. The speech verbs and feminine suffix follow Hebrew, as do the plural acquisition command, beneficiaries and explicit wisdom noun. Silver preserves the economic image. Greek contextual reference does not create a pronoun absent from its speaking clause.
