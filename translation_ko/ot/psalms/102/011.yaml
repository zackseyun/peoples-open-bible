  lexicon: HALOT
  rationale: ‘들어 올리다’는 נשא의 형상을 살리고, ‘내던지다’는 שלך의 거칠고 배척하는 동작을 한국어로 강하게 드러냅니다.
theological_decisions:
- issue: 하나님의 분노를 두 개의 동의어로 병행하는 표현
  chosen_reading: ‘분노’와 ‘진노’를 둘 다 살려, 시적 병행과 강도를 유지했습니다.
  alternative_readings:
  - 둘을 모두 ‘노여움’으로 평준화함
  - 한 단어로 요약해 해석적 설명을 덧붙임
  rationale: 히브리어는 두 개의 근접하지만 동일하지 않은 분노 어휘를 병렬로 사용하므로, 이를 구별해 옮겨 원문의 긴장과 강조를 보존했습니다.
  doctrine_reference: 원문의 시적-신학적 긴장을 보존합니다.
