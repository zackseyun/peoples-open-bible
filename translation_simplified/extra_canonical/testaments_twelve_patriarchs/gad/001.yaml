  - marker: a
    text: Parts of the surviving Greek text behind the opening are difficult; they concern Gad’s strength as a shepherd and the beginning of his resentment toward Joseph.
    reason: textual_variant
  - marker: b
    text: This Greek witness reads “thirty pieces of gold”; other versions of Joseph’s story more commonly have twenty pieces.
    reason: textual_variant
  - marker: c
    text: The work appeals here to the Enochic tradition as an authoritative warning.
    reason: cross_reference
  - marker: d
    text: The references to the interceding “angel of peace” and the “Savior of the nations” may come from different stages of transmission, but the Greek wording is preserved without harmonizing it.
    reason: alternative_reading
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
