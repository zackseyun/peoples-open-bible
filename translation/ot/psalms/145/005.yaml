id: PSA.145.5
reference: Psalms 145:5
source:
  edition: WLC
  text: הֲ֭דַר כְּב֣וֹד הוֹדֶ֑/ךָ וְ/דִבְרֵ֖י נִפְלְאוֹתֶ֣י/ךָ אָשִֽׂיחָה׃
translation:
  text: I will meditate on the glorious splendor of your majesty and on the accounts of your wonders[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “I will speak of the glorious splendor of your majesty and the accounts of your wonders.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֲדַר
  chosen: splendor
  alternatives:
  - majesty
  - honor
  - beauty
  lexicon: HALOT
  rationale: הדר denotes splendor, majesty, or stately beauty. Here it stands in construct with כבוד and modifies הודך, creating a stacked expression of royal magnificence. 'Splendor' best captures the aesthetic-radiant sense without becoming archaic.
- source_word: כְּבוֹד
  chosen: glorious
  alternatives:
  - glory
  - honor
  - weight
  lexicon: HALOT
  rationale: Although literally 'glory,' כבוד here functions within a chain ('splendor of the glory of your majesty'). To avoid an overly wooden and cumbersome English sequence while preserving the intensifying force, it is rendered adjectivally as 'glorious' modifying 'splendor.'
- source_word: הוֹדֶךָ
  chosen: your majesty
  alternatives:
  - your honor
  - your splendor
  lexicon: HALOT
  rationale: הוד commonly refers to majesty, splendor, or stately honor, especially of divine kingship. 'Your majesty' is idiomatic and preserves the regal sense in context.
- source_word: וְדִבְרֵי
  chosen: and on the accounts of
  alternatives:
  - and the words of
  - and concerning the words of
  lexicon: HALOT
  rationale: The construct noun must be represented; “accounts of” gives its content/report sense naturally in English.
- source_word: נִפְלְאוֹתֶיךָ
  chosen: your wonders
  alternatives:
  - your wonders
  - your marvelous deeds
  - your wonderful acts
  lexicon: HALOT
  rationale: “Wonders” directly represents the plural noun and does not unnecessarily add “works.”
- source_word: אָשִׂיחָה
  chosen: I will meditate
  alternatives:
  - I will speak
  - I will muse
  - I will recount
  lexicon: HALOT
  rationale: The reflective sense remains viable in context; the footnote honestly preserves the verb’s speech-related alternatives.
