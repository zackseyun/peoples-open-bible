id: PRO.10.31
reference: Proverbs 10:31
source:
  edition: WLC
  text: פִּֽי צַ֭דִּיק יָנ֣וּב חָכְמָ֑ה וּ/לְשׁ֥וֹן תַּ֝הְפֻּכ֗וֹת תִּכָּרֵֽת־׃
translation:
  text: The mouth of the righteous bears wisdom as fruit, but a perverse tongue will be cut off.
  philosophy: dynamic
lexical_decisions:
- source_word: פִּי
  chosen: mouth
  alternatives:
  - mouth of
  - speech of
  lexicon: HALOT
  rationale: Literal 'mouth' is retained as the concrete source of speech, fitting Hebrew wisdom style and the construct phrase 'mouth of the righteous.'
- source_word: צַדִּיק
  chosen: the righteous
  alternatives:
  - a righteous man
  - the just
  lexicon: HALOT
  rationale: Rendered substantivally as 'the righteous' to reflect the singular adjective used as a class representative in Proverbs, avoiding an unnecessary gendered singular while preserving the moral category.
- source_word: יָנוּב
  chosen: bears ... as fruit
  alternatives:
  - brings forth
  - produces
  - buds
  lexicon: HALOT
  rationale: The verb commonly denotes sprouting or bearing fruit. 'Bears ... as fruit' preserves the organic metaphor more clearly than the flatter 'produces' while remaining natural English.
- source_word: חָכְמָה
  chosen: wisdom
  alternatives:
  - wise speech
  lexicon: HALOT
  rationale: The direct object is the abstract noun 'wisdom'; no expansion is needed. The metaphor implies speech characterized by wisdom, but the text itself says 'wisdom.'
- source_word: לְשׁוֹן
  chosen: tongue
  alternatives:
  - speech
  - language
  lexicon: HALOT
  rationale: Literal 'tongue' is a standard Hebrew metonym for speech and pairs well antithetically with 'mouth' in the first colon.
- source_word: תַּהְפֻּכוֹת
  chosen: perverse
  alternatives:
  - perversity
  - crookedness
  - deceit
  lexicon: HALOT
  rationale: 'The plural abstract noun in construct naturally functions attributively in English: “a perverse tongue.” This avoids unnatural “tongue of perversity” without imposing a more specific kind of perverse speech.'
- source_word: תִּכָּרֵת
  chosen: will be cut off
  alternatives:
  - will be cut out
  - will be removed
  - will be silenced
  lexicon: HALOT
  rationale: The Niphal of כרת is well rendered 'be cut off.' This preserves the severity and passive sense without over-interpreting whether the tongue is silenced, destroyed, or removed.
