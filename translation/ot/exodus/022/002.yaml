  rationale: The concrete wording about the sun rising is retained in the main text, while the legal implication is expressed through 'bloodguilt.' This preserves the text's own distinction without overextending it into a broader ethical principle not explicitly stated here.
  doctrine_reference: Preserve theological tension rather than resolve it.
