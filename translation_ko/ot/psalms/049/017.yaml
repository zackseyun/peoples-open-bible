  verdict: revise
  source_fidelity: 현 초안은 시편 49:17이 아니라 바로 앞절(49:16)의 내용(부자가 될 때 두려워하지 말라)을 번역하고 있어, 주어진 히브리어 본문 및 영어 POB와 일치하지 않습니다. 49:17의 죽음, 아무것도 가져가지 못함, 영광이 뒤따라 내려가지 않음이라는 두 병행절을 모두 복원해야 합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체의 설명적·시적 문맥에 자연스럽습니다. ‘그를 따라 내려가지’는 히브리어의 하강 이미지를 유지하면서 목적지(무덤·스올)를 본문에 보충하지 않습니다.
  terminology: כָּבוֹד는 문맥상 사회적 위상과 화려함·부를 포괄할 수 있으므로 ‘영광’으로 유지하고 주석에서 의미 범위를 밝힙니다. הַכֹּל은 부정문 아래에서 ‘아무것도’로 자연스럽게 옮기되 직역 가능성을 주석으로 제시합니다.
