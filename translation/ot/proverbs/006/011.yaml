id: PRO.6.11
reference: Proverbs 6:11
source:
  edition: WLC
  text: וּ/בָֽא כִ/מְהַלֵּ֥ךְ רֵאשֶׁ֑/ךָ וּ֝/מַחְסֹֽרְ/ךָ֗ כְּ/אִ֣ישׁ מָגֵֽן־׃פ
translation:
  text: and poverty will come upon you like a prowler[a], and need like a man armed with a shield.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “a traveler”; the Hebrew describes someone walking or roaming about.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָא
  chosen: and ... will come
  alternatives:
  - and ... comes
  lexicon: HALOT
  rationale: Qal perfect of בוא in a proverbial sequence can express future/resultative force in English. 'Will come' fits the warning context and natural English style.
- source_word: כִמְהַלֵּךְ
  chosen: like a traveler
  alternatives:
  - like one who walks about
  - like a vagabond
  - like a traveler
  lexicon: HALOT
  rationale: This supplies a natural English referent for the participial image without encoding stealth.
- source_word: רֵאשֶׁךָ
  chosen: your poverty
  alternatives:
  - your destitution
  - your want
  lexicon: HALOT
  rationale: Though the form reflects a noun for poverty/need with 2ms suffix, the sense here is material poverty. 'Poverty' is the clearest modern English rendering and pairs well with the following synonym.
- source_word: וּמַחְסֹרְךָ
  chosen: and your lack
  alternatives:
  - and your need
  - and your want
  lexicon: HALOT
  rationale: מַחְסוֹר denotes lack or deficiency. 'Lack' preserves the concise parallelism with 'poverty' without overinterpreting.
- source_word: כְּאִישׁ
  chosen: like a ... man
  alternatives:
  - like a person
  lexicon: HALOT
  rationale: The Hebrew is grammatically masculine singular and refers to a male figure in the simile. Per gender-accurate policy, 'man' is retained.
- source_word: מָגֵן
  chosen: with a shield
  alternatives:
  - with a shield
  - shield-bearing
  lexicon: HALOT
  rationale: The noun denotes a shield; retaining it preserves the source image.
