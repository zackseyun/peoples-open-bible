  from: and let your heart be courageous
  to: and let your heart take courage
  rationale: The current rendering is understandable but slightly stiff. The English idiom 'take courage' is more natural than 'be courageous' in this exhortational context. The suggested rewrite, 'and let your heart take courage,' preserves the explicit mention of 'your heart' from the Hebrew while using a more fluid and common English expression. The drafter's own lexical notes mention 'take courage' as a valid option.
