  meaning: Eleazar asks that the destruction of God's beloved people not become an occasion for foolish idol worshipers to praise their gods and mock God's failure to rescue.
  meaning_decisions:
  - source_phrase: οἱ ματαιόφρονες
    prior_rendering: the empty-headed
    new_rendering: the foolish
    rationale: The source condemns futile thinking; 'the foolish' carries that judgment in dignified English without the casual sound of 'empty-headed.'
  - source_phrase: τοῖς ματαίοις ... εὐλογησάτωσαν
    prior_rendering: bless the empty things
    new_rendering: praise their worthless idols
    rationale: In the contrast with Israel's God, the objects receiving praise are idols; 'worthless' preserves the polemic, and 'praise' clarifies the action intended by blessing them.
  - source_phrase: τῶν ἠγαπημένων σου
    prior_rendering: those beloved by you
    new_rendering: your beloved
    rationale: The concise expression retains the people's identity as those loved by God without an unnecessary passive construction.
