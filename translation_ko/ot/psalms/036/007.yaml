translation:
  language: ko
  text: 하나님, 주님의 한결같은 사랑이 얼마나 귀한지요![b] 사람들은 주님의 날개 그늘 아래로 피합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람의 아들들’입니다. 여기서는 일반적으로 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 헤세드(חֶסֶד)를 옮긴 말로, 신실한 사랑, 인애, 자비의 뜻을 함께 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
