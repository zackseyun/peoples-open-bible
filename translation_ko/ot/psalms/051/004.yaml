    reason: lexical_alternative
translation:
  language: ko
  text: 제가 제 범죄들을 알고 있으며, 제 죄가 언제나 제 앞에 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְבֵּה
  english_pob_choice: thoroughly
  chosen_korean: 철저히
  alternatives_korean:
  - 충분히
  - 거듭하여
  - 넉넉히
  lexicon: HALOT
  rationale: בּ רבה 계열의 강조를 한국어에서 가장 자연스럽게 살리면서, 단순한 반복보다 강한 정도의 강조를 나타냅니다.
- source_word: כַּבְּסֵנִי
  english_pob_choice: wash me
  chosen_korean: 씻어 주시고
  alternatives_korean:
  - 빨아 주시고
  - 정결하게 해 주시고
  lexicon: HALOT
  rationale: 히브리어 כבס의 씻음 이미지를 살리되, 한국어에서 죄의 정결 맥락에 자연스럽게 들리는 동사를 택했습니다.
- source_word: מֵעֲוֺנִי
  english_pob_choice: from my iniquity
  chosen_korean: 내 죄악에서
  alternatives_korean:
  - 내 죄책에서
  - 내 불의에서
  - 내 죄과에서
  lexicon: HALOT
  rationale: עָוֹן의 도덕적 무게를 반영하면서도, '죄악'이 '죄'와 나란히 놓일 때 두 용어의 대비가 유지됩니다.
- source_word: וּמֵחַטָּאתִי
  english_pob_choice: and from my sin
  chosen_korean: 내 죄에서
  alternatives_korean:
  - 내 범죄에서
  - 내 허물에서
  lexicon: HALOT
  rationale: חַטָּאת을 가장 직접적인 대응어인 '죄'로 옮겨, 앞의 '죄악'과의 병렬을 분명하게 했습니다.
- source_word: טַהֲרֵנִי
  english_pob_choice: cleanse me
  chosen_korean: 깨끗하게 씻어 주십시오
  alternatives_korean:
  - 정결하게 해 주십시오
  - 정화해 주십시오
  lexicon: HALOT
  rationale: טהר의 정결·깨끗함 의미를 살리되, 앞의 '씻어 주시고'와 병행되는 한국어로 자연스럽게 중복 강화를 구현했습니다.
theological_decisions:
- issue: 두 개의 회개 용어 עָוֹן과 חַטָּאת의 병렬 보존
  chosen_reading: '''죄악''과 ''죄''를 구별하여 옮겨, 시적 병렬의 긴장과 폭을 유지했습니다.'
  alternative_readings:
  - 둘 다 '죄'로 평준화함
  - '''죄악''과 ''허물''로 완화함'
  rationale: 원문은 동의어 반복이 아니라 관련되지만 동일하지 않은 두 용어를 병렬로 배치합니다. 이를 구별해 옮겨 다윗의 간구가 가리키는 도덕적 오염의 넓이를 드러냅니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
