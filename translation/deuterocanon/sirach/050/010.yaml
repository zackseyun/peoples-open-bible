lexical_decisions:
- source_word: כְּזַיִת
  chosen: like an olive tree
  alternatives:
  - like an olive
  lexicon: HALOT
  rationale: The prefixed כ marks comparison. Although זית can denote the olive or olive tree, the parallel with עֵץ in the second colon and the Greek ἐλαία support the arboreal sense here.
- source_word: רַעֲנָן
  chosen: flourishing
  alternatives:
  - fresh
  - luxuriant
  - green
  lexicon: HALOT
  rationale: Conveys vigorous, verdant life in poetic description. 'Flourishing' fits idiomatic English while preserving the image of vitality.
- source_word: מָלֵא גַרְגַּר
  chosen: heavy with berries
  alternatives:
  - full of fruit
  - filled with kernels/grains
  lexicon: HALOT
  rationale: Literally 'full of gargar.' The noun is rare and likely refers here to olive berries/fruit rather than generic grain. The Greek parallel explicitly has 'bearing fruits,' which supports a fruiting sense. 'Heavy with berries' preserves the concrete image without overgeneralizing.
- source_word: וּכְעֵץ שָׁמֵן
  chosen: and like a rich tree
  alternatives:
  - and like a luxuriant tree
  - and like an oil tree
  - and like a fat tree
  lexicon: HALOT
  rationale: The Hebrew literally reads 'like a fat/rich tree.' In biblical Hebrew שָׁמֵן can denote richness or luxuriance, especially of fertile growth. 'Rich tree' is concise modern English for a luxuriant, well-nourished tree. The Greek parallel instead reads 'like a cypress rising into the clouds,' indicating a divergent Vorlage or interpretive rendering; the Hebrew witness is primary here.
- source_word: מְרַוֶּה עָנָף
  chosen: drenching its branches
  alternatives:
  - watering its branches
  - saturating its boughs
  - with well-watered branches
  lexicon: HALOT
  rationale: From רוה, 'to water, saturate, drench.' The participial form depicts abundant moisture or sap nourishing the branches. 'Drenching its branches' keeps the vividness, though the exact mechanism is metaphorical.
