  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Nature of the sign involving מַעֲלוֹת אָחָז
  chosen_reading: steps of Ahaz
  alternative_readings:
  - stairway of Ahaz
  - stair-dial of Ahaz
  - dial of Ahaz
  rationale: The Hebrew text itself speaks of 'steps/ascents' and does not explicitly identify a dial. The translation preserves the textual wording rather than resolving the historical reconstruction in the main text.
