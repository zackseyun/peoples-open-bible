  from: But while the bridegroom was delayed[a][b], they all became drowsy and fell asleep.
  to: But while the bridegroom was delayed[a][b], they all became drowsy and slept.
  rationale: The Greek deliberately contrasts the aorist ἐνύσταξαν (became drowsy / nodded off) with the imperfect ἐκάθευδον (slept / were sleeping). Translating ἐκάθευδον as 'fell asleep' treats it as an ingressive aorist, flattening the aspectual shift. 'Slept' accurately reflects the ongoing state of sleep that followed their initial drowsiness.
