    text: τοῦτό τὸ κρίμα παρὰ Κυρίου πάσῃ σαρκί, καὶ τί ἀπαναίνῃ ἐν εὐδοκίᾳ Ὑψίστου; εἴτε δέκα εἴτε ἑκατὸν εἴτε χίλια ἔτη, οὐκ ἔστιν ἐν ᾅδου ἔλεγμὸς ζωῆς.
