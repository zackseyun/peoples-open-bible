    rationale: 이 문맥의 통용 한국어 성경 인명 표기는 ‘스라야’와 ‘므라야’입니다. 기존 성경 인명 체계와의 일관성을 위해 수정하는 것이 안전합니다.
  - severity: medium
    issue: ‘사라야에게는 … 예레미야에게는’의 관계 표현
    rationale: 원문의 לְ는 명단에서 가문 또는 계열 아래에 대표자를 제시하는 용법입니다. 한국어 ‘-에게’는 사람에게 주거나 향하는 관계로 읽히기 쉬우므로 ‘-가문에는’이 더 자연스럽고 정확합니다.
  - severity: low
    issue: ‘조상들의 가문의 우두머리들’의 어색한 중첩
    rationale: ‘아버지들의 집’이라는 히브리어 관용구는 가문 단위를 뜻하므로 ‘가문의 우두머리들’로 간결하게 옮겨도 의미가 보존됩니다.
