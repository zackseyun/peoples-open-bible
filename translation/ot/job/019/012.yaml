  review_summary: “Build up their road against me” is source-shaped but misleadingly awkward English. In the coordinated military image—troops approaching and encamping around Job's tent—סלל דרך depicts raising an approach embankment for attack. “Build a siege ramp” gives the contextual force while the note preserves the literal road imagery and its interpretive basis.
