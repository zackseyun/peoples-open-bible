translation:
  text: 'I asked, “What is the tower?” He said, “The tower is the church.”


    2. I asked, “Who are these virgins?” He said, “They are holy spirits.[a] No one can be found in God’s
    kingdom unless they clothe that person in their garment. Receiving only the name will do you no good
    if you do not also receive their garment. These virgins are powers of the Son of God. If you bear
    his name but do not wear his power, you bear his name in vain.”


    3. “The stones you saw cast out are people who bore the name but did not put on the virgins’ clothing.”[f]
    I asked, “What is their clothing, sir?” He said, “Their names are their clothing. Whoever bears the
    name of the Son of God must also bear their names. The Son himself bears these virgins’ names.”


    4. “All the stones you saw enter the tower’s building, be handed over through their hands and remain
    in the building are clothed in the power of these virgins.”[b]


    5. “That is why you see that the tower has become one stone with the rock.[c] In the same way, those
    who have believed in the Lord through his Son and put on these spirits will become one spirit and
    one body. Their garments will have one color. People who bear the virgins’ names have their dwelling
    in the tower.”


    6. I asked, “Then why, sir, were the rejected stones cast out? They passed through the gate. The virgins’
    hands placed them in the tower’s building.” He said, “Since everything concerns you and you examine
    it closely, listen to the explanation about the rejected stones.”


    7. “They all received the name of the Son of God and the virgins’ power. After receiving these spirits,
    they were strengthened. They were with God’s servants and had one spirit, one body and one garment,[d]
    because they thought the same things and practiced righteousness.”


    8. “Later, the women you saw persuaded them. These women wore black garments, had bare shoulders and
    loose hair, and were beautiful. When the people saw these women, they desired them. They put on the
    women’s power and took off the virgins’ power.”


    9. “They were cast out of God’s house and handed over to those women. But those who were not deceived
    by their beauty stayed in God’s house. Now you have the explanation about those cast out.”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: The Greek explicitly identifies the virgins as plural “holy spirits,” then as powers of the
      Son of God. That plural is retained. The draft does not replace them with the singular Holy Spirit
      or eliminate the garment/name image. The Greek connective οὖν, meaning “so” or “therefore,” is bracketed
      in the printed source and is not separately rendered in this simplified edition. The supplied project
      transcription of the Lightfoot and Harmer apparatus identifies ἄλλως as Anger’s conjecture against
      reported Athos ἄλλος, and ὠφελήσῃ as Gebhardt’s conjecture against reported Athos ὠφελεῖς. The simplified
      translation follows the selected working reading’s necessary condition and lack of benefit; ἄλλως
      is not separately rendered as “otherwise.” These attributions come from the supplied apparatus transcription,
      not fresh manuscript verification; no English rendering of the reported alternatives is established
      here.
  - marker: b
    reason: textual_variant
    text: 'The Greek span from τοῦ πύργου through μείναντας εἰς τὴν οἰκοδομήν is marked with bars in the
      working source. The supplied project comparison reports it as an insertion by Gebhardt compared
      with Latin Vulgata, Palatina and Ethiopic, absent in Athos by similar endings. That comparison reports
      the shorter rendering: “All the stones you saw in the building are clothed in the power of these
      virgins.” The underlying shorter witness wording and its syntactic analysis are not supplied. Since
      “having entered” (εἰσεληλυθότας) is itself inside the marked span, this reported English alternative
      is not presented as an independently established translation obtained simply by deleting the span.
      The main text retains the working supplement. No Sinaiticus or Amherst fragment is claimed to preserve
      this entire supplied span.'
  - marker: c
    reason: textual_variant
    text: “With” (μετὰ) is bracketed in the working Greek. The draft retains this bracketed reading and
      the tower/rock unity without replacing the metaphor with a later theological formulation.
  - marker: d
    reason: textual_variant
    text: “And one garment” is bracketed in the printed source, as is the preceding introductory “he said.”
      The spirit, body and garment are kept distinct. The draft does not infer that the bracketed garment
      clause is legible in every witness.
  - marker: e
    reason: lexical_alternative
    text: These women are allegorical figures whose names are supplied later in the vision. Their physical
      description and the exchange of powers remain in the narrative; the text is not generalized into
      a claim about women as a class.
  - marker: f
    reason: textual_variant
    text: The supplied project transcription of the Lightfoot and Harmer apparatus identifies οὗτοι in
      this clause as Hilgenfeld’s conjecture and reports αὐτοῖς for Athos. The translation retains οὗτοι
      from the working Greek. This is an attributed apparatus report, not fresh manuscript verification.
      The syntax and English rendering of the reported alternative remain unresolved here.
