  rationale: The term may denote a written witness to covenantal obligations, possibly the law given to the king, but the Hebrew itself does not specify beyond 'the testimony.' To avoid importing a more specific institutional interpretation than the text states, the main text keeps the broader rendering while preserving explanatory alternatives in a footnote.
