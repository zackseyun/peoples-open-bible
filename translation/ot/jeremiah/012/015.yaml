  from: And it will happen[a], after I have uprooted them, that I will return and have compassion on them, and I will bring them back[c][b], each man to his inheritance and each man to his land.
  to: After I have uprooted them, I will again have compassion on them and bring them back, each to their own inheritance and their own land.
  rationale: The earlier notes rightly insist on concrete territorial restoration, which I preserve. I depart from their separate-action reading of “I will return” because the construction expresses compassion shown again, and I render the distributive אִישׁ as “each.”
