id: 2MA.2.35
reference: 2 Maccabees 2:35
source:
  edition: lxx-swete-1909
  text: καὶ τότε ὁ κύριος ἀναδείξει ταῦτα, καὶ ὀφθήσεται ἡ δόξα τοῦ κυρίου καὶ ἡ νεφέλη, ὡς ἐπὶ Μωσῇ ἐδηλοῦτο, ὡς καὶ ὁ Σαλωμὼν ἠξίωσεν, ἵνα ὁ τόπος καταγιασθῇ μεγάλως.
  language: Greek
  pages:
