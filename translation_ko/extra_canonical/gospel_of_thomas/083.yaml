base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/083.yaml
  text: Jesus said[1], "The images are manifest to humanity, and the light that is within them is hidden in the image of the light of the Father. He will be revealed[2], and his image is hidden by his light."
  footnotes:
  - marker: '1'
    text: 'The Coptic masculine singular pronoun ϥ- (''he/it'') could refer either to the Father (ⲡⲉⲓⲱⲧ) or to the light (ⲡⲟⲩⲟⲉⲓⲛ), as both are masculine nouns. Thus, an alternative translation is: ''It will be revealed, and its image is hidden by its light.'''
    reason: textual_variant
  - marker: '2'
    text: Coptic ⲡⲣⲱⲙⲉ (literally 'the person' or 'the human'), functioning as a collective.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “형상들은 사람들에게 드러나 있으며, 그들 안에 있는 빛은 아버지의 빛의 형상 안에 숨겨져 있습니다. 드러날 것이며,[a] 그 형상은 그 빛에 의해 숨겨져 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 두 절의 콥트어 남성 단수 대명사 ϥ-와 그에 딸린 소유 표현은 문법적으로 ‘아버지’와 ‘빛’ 어느 쪽을 가리킬 수도 있습니다. 따라서 ‘드러날 것’과 ‘그 형상’, ‘그 빛’의 지시 대상은 원문에서 확정되지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲛϩⲓⲕⲱⲛ
  english_pob_choice: the images
  chosen_korean: 이미지들
  alternatives_korean:
  - 형상들
  - 모습들
  lexicon: Crum / Greek loanword εἰκών
  rationale: Coptic loanword가 가리키는 것은 눈에 보이는 외형이나 나타난 상(像)이라서, 본문 대비를 살리기 위해 일반적인 ‘형상’보다 직접적인 ‘이미지들’을 택했습니다.
- source_word: ⲥⲉⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  english_pob_choice: are manifest
  chosen_korean: 드러나 있으며
  alternatives_korean:
  - 보여 있으며
  - 명백하게 보이며
  - 나타나 있으며
  lexicon: Crum 485a
  rationale: 단순한 시각적 ‘보이다’보다, 숨겨짐과 대비되는 ‘드러남’의 상태를 나타내므로 현재 상태를 살리는 표현으로 옮겼습니다.
- source_word: ⲡⲣⲱⲙⲉ
  english_pob_choice: to humanity
  chosen_korean: 사람들에게
  alternatives_korean:
  - 인류에게
  - 인간에게
  - 사람들에게
  lexicon: Crum 294a
  rationale: 단수형이 집합적으로 쓰인 점을 살려, 추상적인 ‘인류’보다 문맥상 자연스러운 집합적 복수 ‘사람들’로 옮겼습니다.
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  english_pob_choice: be revealed
  chosen_korean: 드러날 것이며
  alternatives_korean:
  - 계시될 것이며
  - 나타날 것이며
  - 공개될 것이며
  lexicon: Crum 815a
  rationale: Thomas의 반복되는 숨김/드러남 대비를 보존하기 위해, 신학적으로 덜 해석적인 ‘드러나다/드러날 것이다’를 사용했습니다.
- source_word: ϩⲱⲡ
  english_pob_choice: is hidden
  chosen_korean: 숨겨져 있습니다
  alternatives_korean:
  - 감추어져 있습니다
  - 은폐되어 있습니다
  - 숨겨져 있습니다
  lexicon: Crum 695a
  rationale: 현재 상태를 나타내는 stative이므로 미래형이 아니라 현재 완료적 상태를 드러내는 ‘숨겨져 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 대명사 ϥ-의 지시 대상
  chosen_reading: ‘그’는 아버지를 가리키는 것으로 두되, 원문의 모호성은 번역문에서도 그대로 유지했습니다.
  alternative_readings:
  - ‘그것’은 빛을 가리킨다
  - 대명사를 회피하고 중립적으로 옮긴다
  rationale: 남성형 대명사는 ‘아버지’와 ‘빛’ 둘 다 문법적으로 가리킬 수 있으므로, 해석을 단정하지 않고 문맥상 가장 자연스러운 ‘그’로 두어 모호성을 보존했습니다.
  doctrine_reference: 본문 비평/해석상의 지시 대상 모호성 보존
- issue: ‘빛의 이미지’와 ‘그의 이미지’의 반복 구조
  chosen_reading: 이미지/빛/숨김의 대조를 그대로 살려, 상징을 평탄화하지 않았습니다.
  alternative_readings:
  - 의미를 풀어 설명한다
  - 영적 의미로 재해석하여 의역한다
  rationale: 토마스복음의 핵심 대비인 드러남과 숨겨짐을 약화시키지 않기 위해, 독자가 원문 구조를 느낄 수 있도록 직결된 표현을 유지했습니다.
  doctrine_reference: 서술 구조 보존 원칙
