revisions:
- category: publication_review_correction
  rationale: The supplied Latin places belief, hearing, walking in the words and correcting one's ways
    together under si, with vivere poteritis as the consequence; restore that explicit condition rather
    than independent commands. Separately, ipse in ait mihi ipse pastor explicitly emphasizes the shepherd
    himself; restore that emphasis. Existing paragraph divisions, markers and the disclosed singular servant
    reading are preserved.; This unit contains no blood-guilt assertion. Replace that inaccurate metadata
    claim with features present in the supplied Latin and retained in the corrected translation, including
    the conditional construction and ipse emphasis.
- category: publication_review_correction
  rationale: 'Independent comparison with Quare ergo non interrogasti me ... quod explevimus formas shows
    that the simplified second question makes an unstated causal inquiry definite. Keep the question about
    Hermas’s failure to ask and the reference to filling, without adding a question about why the filling
    occurred. Retain paragraph divisions, speaker emphasis, teaching and existing markers.; Reconsideration
    of the prior rendering of quod explevimus formas: retain the same disclosed construction and lexical
    alternatives as the proposed standard correction, rather than letting simplification silently settle
    the ambiguity.'
