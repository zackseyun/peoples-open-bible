translation:
  text: He said to me, “These are prepared for the host of Azazel, so that they may be handed over and cast into
    that condemnation. Crooked stones will cover their jaws, as the Lord of Spirits commanded.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The actual jaw form is መልታሒሆሙ; first-draft መልታሕቶሙ was a transcription error. Primary Dillmann45 explicitly
      cites54:5 for the jaw noun. The selected adjective has the primary1241 curved/twisted range, rendered crooked
      rather than inventing a rough texture or replacing jaws with faces. Primary225 supports the passive hand-over
      sense;1007 supports host/group. No fresh manuscript or extra textual reading is claimed.
    reason: lexical_alternative
