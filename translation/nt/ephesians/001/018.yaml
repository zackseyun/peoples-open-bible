  chosen_reading: his inheritance among the saints
  alternative_readings:
  - his inheritance in the saints
  - the inheritance he gives among the saints
  rationale: The Greek genitives and prepositional phrase allow more than one nuance. The main text preserves the wording without resolving the theological question beyond what the Greek states. This follows the doctrine principle of preserving theological tension rather than forcing a denominationally favored interpretation.
