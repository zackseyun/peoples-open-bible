  lexicon: HALOT
  rationale: חַיִל은 여기서 ‘힘’보다 경제적 소유를 가리키므로, 현대 한국어에서 직접적으로 이해되는 ‘재산’으로 옮겼습니다.
- source_word: וּבְרֹב עָשְׁרָם
  english_pob_choice: and boast in the abundance of their riches
  chosen_korean: 자기의 많은 부를 자랑하는
  alternatives_korean:
  - 자기의 부유함이 넘침을 자랑하는
  - 자기 재물의 풍성함을 자랑하는
  lexicon: HALOT
  rationale: רֹב은 ‘많음/풍성함’의 의미를 살리되, ‘부’와 결합해 자연스러운 한국어 표현이 되도록 ‘많은 부’로 처리했습니다.
- source_word: יִתְהַלָּלוּ
  english_pob_choice: boast
  chosen_korean: 자랑하는
  alternatives_korean:
  - 영광을 돌리는
  - 뽐내는
  lexicon: HALOT
  rationale: 히트파엘 형태의 הלל은 여기서 자기 과시적 ‘자랑하다’의 뜻이 분명하므로, 현대 독자가 바로 이해할 수 있는 ‘자랑하다’로 옮겼습니다.
theological_decisions:
- issue: 시편 49:7의 화자 성격
  chosen_reading: 지혜시적 경고의 대상이 되는 부자들의 태도를 직접 서술하는 진술로 유지했습니다.
  alternative_readings:
  - 일반적인 도덕 훈계로 완화하는 읽기
