source:
  edition: WLC
  text: אֶשְׂמְחָ֣ה וְ/אֶעֶלְצָ֣ה בָ֑/ךְ אֲזַמְּרָ֖ה שִׁמְ/ךָ֣ עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/002.yaml
  text: I will rejoice and exult in you[a]; I will sing praise to your name, Most High.[b]
  footnotes:
  - marker: a
    text: Or “I will be glad and rejoice in you.”
    reason: lexical_alternative
  - marker: b
    text: “Most High” is a divine title for God.
    reason: cultural_note
translation:
  language: ko
  text: 제가 주님 안에서 기뻐하고 크게 즐거워하겠습니다. 지극히 높으신 분이시여[a], 주님의 이름을 노래로 찬양하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘엘리욘’은 하나님을 가리키는 호칭으로, 문자적으로는 ‘지극히 높으신 분’입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אוֹדֶה
  english_pob_choice: I will give thanks
  chosen_korean: 감사드리겠습니다
  alternatives_korean:
  - 찬양하겠습니다
  - 감사하겠습니다
  lexicon: HALOT
  rationale: 히필형 ידה는 예배 맥락에서 감사를 드리다의 뜻이 자연스럽고, ‘찬양하다’보다 감사의 초점을 더 분명히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms / divine name
  rationale: 원문의 여호와 신명은 호칭이 아니라 고유한 언약 이름이므로, POB 기준에 따라 ‘야훼’로 옮겨 신명성을 보존합니다.
- source_word: בְּכָל לִבִּי
  english_pob_choice: with all my heart
  chosen_korean: 온 마음으로
  alternatives_korean:
  - 전심으로
  - 마음을 다해
  lexicon: HALOT
  rationale: 히브리어 관용구의 전적·전인적 헌신을 한국어로 자연스럽게 살리면서, ‘all’의 총체성을 유지합니다.
- source_word: נִפְלְאוֹתֶיךָ
  english_pob_choice: your wondrous deeds
  chosen_korean: 주님의 모든 놀라운 일들
  alternatives_korean:
  - 주님의 놀라운 일들
  - 주님의 기이한 일들
  - 주님의 기적들
  lexicon: HALOT
  rationale: פלא 계열은 경이로움을 자아내는 하나님의 행위를 가리키므로, ‘놀라운 일들’로 옮기고 앞선 ‘모든’으로 포괄성을 살렸습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 시편 본문은 신명 자체를 직접 사용하므로, 한국어 본문에서도 대체 호칭 대신 고유 이름을 유지하는 것이 स्रोत의 식별성을 지킵니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
