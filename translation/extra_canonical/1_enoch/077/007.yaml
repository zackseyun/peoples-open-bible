translation:
  text: 'The four remaining rivers go out along the north side to their own sea: two to the Eritrean Sea[a] and two to the Great Sea, where their waters mingle. Some say, ''Into the desert[b]''.'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: This is the same sea called the Erythraean Sea in verse 6.
    reason: lexical_alternative
  - marker: b
    text: The closing words are uncertain; they appear to give another destination, 'the desert' or 'dry land.'
    reason: alternative_reading
lexical_decisions:
- source_word: እለ ተርፉ
  chosen: the remaining ones
  alternatives:
  - those that were left
  - the rest
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The phrase marks the residual group after a prior numerical division in the surrounding context. 'Remaining ones' preserves the counted, schematic sense better than the looser 'the rest.'
- source_word: አርባዕቱ
  chosen: four
  alternatives:
  - the four
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The numeral is explicit and should remain explicit in English because the astronomical schema depends on counted groups.
- source_word: ይወፅኡ
  chosen: go out
  alternatives:
  - come forth
  - issue forth
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: A straightforward motion verb fits the luminary-gate context. 'Go out' is clear modern English while preserving the directional imagery.
- source_word: በገቦ መስዕ
  chosen: by the north side
  alternatives:
  - at the northern quarter
  - through the north side
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The phrase points to the northern region/side. 'By the north side' keeps the spatial orientation without over-specifying a technical astronomical term not certain from this witness alone.
- source_word: እስከ ባሕረ ዚአሆሙ
  chosen: to their own sea
  alternatives:
  - as far as their sea
  - unto their sea
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: እስከ here is best taken as directional extent, and ዚአሆሙ indicates possession or association. 'To their own sea' preserves the odd, schematic wording rather than smoothing it away.
- source_word: ባሕረ ኤርትራ
  chosen: the Eritrean Sea
  alternatives:
  - the Red Sea
  - the Erythraean Sea
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The Ge'ez form is a transliterated geographical name cognate with Erythraean/Eritrean. 'Eritrean Sea' stays close to the witness and avoids prematurely collapsing the ancient term into the narrower modern 'Red Sea.'
- source_word: ባሕር ዓቢይ
  chosen: the Great Sea
  alternatives:
  - the great sea
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: A conventional ancient geographical designation, likely the Mediterranean, but the translation should preserve the source expression rather than substitute the modern name in the main text.
