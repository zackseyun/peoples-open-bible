lexical_decisions:
- source_word: ካዕበ
  chosen: again
  alternatives:
  - further
  - then again
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Marks continuation in the sequence of the luminary's movements; 'again' preserves the repetitive procedural style of the Astronomical Book.
- source_word: ይገብእ
  chosen: it enters
  alternatives:
  - it goes in
  - it comes in
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The verb denotes entering; in this context of the sun's movement through gates, 'enters' is the most direct and spatially concrete rendering.
- source_word: ሰቡዐ መዋዕለ
  chosen: for seven days
  alternatives:
  - seven days
  - during seven days
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The phrase expresses duration. 'For seven days' reads naturally in English while preserving the calendrical precision.
- source_word: በራብዕት ኆኅት
  chosen: by the fourth gate
  alternatives:
  - through the fourth gate
  - into the fourth gate
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The preposition with 'fourth gate' indicates the gate associated with this stage of movement. 'By' is slightly broader and fits the paired clause 'from which the sun comes out,' though 'through' remains possible.
- source_word: እንተ እምኔሃ
  chosen: from which
  alternatives:
  - from it
  - from that gate
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: This relative expression points back to the gate just mentioned. 'From which' keeps the syntax clear and links the gate to the sun's emergence.
- source_word: ይወፅእ ፀሐይ
  chosen: the sun comes out
  alternatives:
  - the sun goes forth
  - the sun emerges
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The verb means to go out or come forth. 'Comes out' is idiomatic and preserves the concrete image of the sun emerging from a cosmic gate.
