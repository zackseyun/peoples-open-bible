base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/002.yaml
  text: “Those sheep you saw not skipping but grazing in one place—these are the ones who have handed themselves over to luxuries and deceptions, yet they have not blasphemed the Lord at all. These, then, have been corrupted from the truth; in them there is hope of repentance, by which they can live. Corruption, then, has hope of a certain renewal, but death has eternal destruction.”
translation:
  language: en
  text: '“The sheep you saw staying in one place and grazing instead of skipping about represent people who have given themselves over to luxury and deception. Yet they have never blasphemed the Lord. They have been corrupted from the truth, but they still have hope: they can reorient[r1] and live. Corruption still holds the hope of renewal, but death leads to eternal destruction.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Those sheep you saw not skipping but grazing in one place—these are the ones
  simplified_phrase: The sheep you saw staying in one place and grazing instead of skipping about represent people
  preserved_meaning: The sheep’s behavior symbolizes this group of people.
  reasoning_layer_used: POB translation and immediate image
  rationale: The wording states the symbolism directly while preserving the contrasting actions.
- pob_phrase: have handed themselves over to luxuries and deceptions
  simplified_phrase: have given themselves over to luxury and deception
  preserved_meaning: They willingly surrendered themselves to indulgence and falsehood.
  reasoning_layer_used: POB translation
  rationale: Common singular nouns make the phrase natural without weakening willing surrender.
