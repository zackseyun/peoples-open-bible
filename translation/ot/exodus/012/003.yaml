  meaning: The whole congregation must select a Passover animal on the tenth day, with one animal allotted to each household within its family grouping.
  meaning_decisions:
  - source_phrase: שֶׂה
    prior_rendering: a lamb
    new_rendering: a lamb or a young goat
    rationale: The term includes both kinds of flock animal, as verse 5 expressly confirms; established English usage does not justify restricting the main text to sheep.
  - source_phrase: לְבֵית אָבֹת שֶׂה לַבָּיִת
    prior_rendering: according to his fathers’ house, a lamb for the household
    new_rendering: for his family group, one animal for each household
    rationale: The Hebrew distinguishes the ancestral family grouping from the individual household; the new wording communicates that social organization without the obscure English phrase “fathers’ house.”
  - source_phrase: דַּבְּרוּ ... לֵאמֹר
    prior_rendering: Speak ... saying
    new_rendering: 'Tell ...:'
    rationale: This is an instruction to communicate the ensuing command, which English expresses naturally with “Tell” and a colon.
