theological_decisions:
- issue: Scope of the promise in context
  chosen_reading: Render the statement straightforwardly without adding qualifiers about prayer, church discipline, or divine will beyond what the Greek explicitly states.
  alternative_readings:
  - Restrict the saying explicitly to church-discipline decisions
  - Expand it into a general blank-check promise about any prayer request
  rationale: The immediate context includes communal discipline and authority, and αἰτέω suggests asking/requesting, likely in prayerful agreement. But the verse itself does not explicitly insert limiting or expanding doctrinal qualifiers. The translation preserves the text's breadth and contextual tension rather than resolving it interpretively.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
