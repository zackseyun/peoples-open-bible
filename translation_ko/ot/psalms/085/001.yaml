translation:
  language: ko
  text: 야훼여, 주께서 주의 땅에 은혜를 베푸셨고, 야곱의 형편을 회복시키셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱의 포로 상태를 되돌리셨습니다’ 또는 ‘야곱의 포로들을 돌아오게 하셨습니다.’ 히브리어 표현은 포로 생활에서의 귀환을 가리킬 수도 있고, 더 넓게는 형편의 회복을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 최고 음악가에게
  - 합창 지휘자에게
  lexicon: HALOT
  rationale: 시편 표제의 기능을 살려, ל의 방향·헌정 뉘앙스를 한국어의 여격으로 간결하게 옮겼습니다. ‘지휘자’는 현대 한국어에서 음악 수행을 책임지는 사람을 자연스럽게 드러냅니다.
- source_word: לִבְנֵי קֹרַח
