  text: ס֣וֹד יְ֭הוָה לִ/ירֵאָ֑י/ו וּ֝/בְרִית֗/וֹ לְ/הוֹדִיעָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/014.yaml
  text: The counsel of the LORD is for those who fear him, and his covenant is to make it known to them.
translation:
  language: hi
  text: 'यहोवा का गुप्त परामर्श उसके भय माननेवालों के लिए है,

    और वह उन्हें अपनी वाचा से अवगत कराता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוֹד
  choice: गुप्त सम्मति
  rationale: यह शब्द गोपनीय विचार-विमर्श, अंतरंग परामर्श या रहस्य का अर्थ दे सकता है। ‘गुप्त सम्मति’ यहाँ गोपनीयता और परामर्श—दोनों भावों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: לִירֵאָיו
  choice: उसके डरवैयों के लिए
  rationale: ‘डरवैये’ उन लोगों को दर्शाता है जो श्रद्धापूर्ण भय रखते हैं; ‘के लिए’ हिब्रू לְ के संबंध को सीधे बनाए रखता है।
- source_word: בְרִיתוֹ
  choice: उसकी वाचा
  rationale: ‘वाचा’ बाइबिलीय covenant के लिए स्थापित हिन्दी शब्द है और संबंधपरक, बाध्यकारी प्रतिज्ञा का भाव रखता है।
- source_word: לְהוֹדִיעָם
  choice: उन्हें प्रकट करने के लिए
  rationale: हिफ़ील infinitive में ‘उन्हें ज्ञात कराने’ का भाव है। स्त्रीलिंग ‘प्रकट करने’ का निहित कर्म निकटतम ‘वाचा’ है; यह हिब्रू वाक्य की संक्षिप्त और कुछ हद तक तनावपूर्ण रचना को सुरक्षित रखता है।
theological_decisions:
- issue: दूसरी पंक्ति में क्रिया का निहित कर्ता/कर्म
  choice: ‘उसकी वाचा उन्हें प्रकट करने के लिए है’ के अनुरूप वाचा को प्रकट की जाने वाली वस्तु माना गया
  alternative: ‘वह अपनी वाचा उन्हें प्रकट करता है’ अथवा ‘उन्हें अपनी वाचा सिखाता है’
  rationale: हिब्रू में ‘उसकी वाचा’ के बाद infinitive construct है और स्पष्ट finite verb नहीं है। चुना गया रूप मूल की व्याकरणिक संक्षिप्तता तथा संभावित अस्पष्टता को अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: भाषा औपचारिक, काव्यात्मक और आधुनिक मानक हिन्दी की है। ‘गुप्त सम्मति’ सामान्य ‘सलाह’ से अधिक मूल के अंतरंग/गोपनीय परामर्श का भाव देता है। समानांतर पंक्तियों की संरचना सुरक्षित रखी गई है।
