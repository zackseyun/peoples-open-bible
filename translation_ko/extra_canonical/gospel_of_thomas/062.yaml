revisions:
- from: 예수께서 말씀하셨습니다. 「나는 내 비밀들을 내 비밀들에 합당한 이들에게 말합니다. 네 오른손이 하는 일을 네 왼손이 알지 못하게 하십시오」.[a][b]
  to: 예수께서 말씀하셨습니다. “나는 내 비밀들에 [합당한] 이들에게 [내] 비밀들을 말합니다.[a] 네 오른손이 할 일을 네 왼손이 모르게 하십시오.”[b]
  rationale: 사본 훼손부의 복원을 대괄호와 주석으로 투명하게 표시하고, 오른손 절의 미래/예정 표현을 ‘할 일’로 바로잡았습니다. 교차참조 주석은 본문 배치와 마태복음의 차이만 기술하도록 절제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:20Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 복수 ‘비밀들’과 오른손/왼손의 대구는 대체로 정확합니다. 그러나 ⲛⲉ[ⲧⲙⲡϣⲁ]와 ⲛ[ⲛⲁ]는 사본 훼손부에 대한 복원이므로 번역에서 복원 표지를 보존하는 편이 원문 상태에 충실합니다. 또한 ⲡⲉⲧⲉⲣⲉⲡⲉⲕⲟⲩⲛⲁⲙ ⲛⲁⲉⲓⲣⲉ는 ‘네 오른손이 할 일’로 미래/예정의 뉘앙스를 지니므로, 현 번역의 ‘하는 일’보다 이를 반영하는 것이 적절합니다.
  naturalness: ‘네 오른손이 할 일을 네 왼손이 모르게 하십시오’는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 반복을 한국어 관용적 생략으로 처리하면서 뜻을 유지합니다. ‘비밀들’은 다소 낯설 수 있으나 원문의 복수와 μυστήριον의 기술적 어감을 보존하는 선택으로 허용됩니다.
  terminology: ‘비밀들’, ‘합당한 이들’, ‘오른손’, ‘왼손’은 모두 적절합니다. 다만 ‘합당한’ 및 두 번째 ‘내’는 훼손부 복원에 근거하므로 대괄호와 주석으로 밝혀야 합니다. 교차참조 주석은 마태복음의 구제 맥락이 토마스 본문에 명시되어 있지 않다는 사실까지만 말하고, 본문이 특정한 ‘비밀 보존’ 교훈으로 재해석한다고 단정하지 않는 것이 좋습니다.
