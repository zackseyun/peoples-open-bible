    rationale: ‘보라’ and ‘서 있어라’ are not 합쇼체, contrary to the requested Korean variant. The speech should be consistently formal-polite.
  - severity: low
    issue: Added durative force in ‘서 있어라’
    rationale: The Hebrew imperfect in this directive calls for standing/positioning oneself; ‘서 있어라’ can imply remaining in that state. ‘서십시오’ conveys the instruction without that added aspect.
  revised_text: 야훼께서 말씀하셨습니다. “보십시오, 내 곁에 한 곳이 있습니다. 그 바위 위에 서십시오.”
