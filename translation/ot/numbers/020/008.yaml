  category: meaning_retranslation
  from: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
  to: “Take the staff. You and your brother Aaron are to assemble the congregation and speak to the rock in their sight, and it will yield its water. In this way you will bring water out of the rock for them and give the congregation and their livestock water to drink.”
  rationale: The earlier decisions rightly emphasized both leaders and the public nature of the command, and those gains are retained. I clarify the command’s flow without identifying the staff more specifically than the verse does or explaining the later failure in advance.
