id: GEN.6.3
reference: Genesis 6:3
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
translation:
  text: Then Yahweh said, “My Spirit[a] will not remain[b] in man[c] forever, for he is flesh[d]; his days will be one hundred and twenty years[e].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or ‘my spirit’ or ‘my life-giving breath.’ Capitalization is an English interpretive choice, not a distinction marked in the Hebrew.
    reason: lexical_alternative
  - marker: b
    text: Or ‘contend with man.’ The Hebrew verb is uncertain. The selected ancient Greek and Latin texts use a remaining sense; a reworked Hebrew quotation in 4Q252 has a dwelling verb, but does not establish the original Genesis spelling.
    reason: alternative_reading
  - marker: c
    text: ‘Man’ translates Hebrew adam, a singular term used generically for humankind.
    reason: lexical_alternative
  - marker: d
    text: Or ‘because he also is flesh.’
    reason: lexical_alternative
  - marker: e
    text: The days may refer to a limit on human lifespan or the time until the flood. The reworked quotation in 4Q252 explicitly adopts the flood deadline; the Hebrew verse itself does not say ‘120 more years.’
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: יָדוֹן
  chosen: will not remain
  alternatives:
  - will not contend
  - will not strive
  - will not judge
  - will not abide
  lexicon: BDB, electronic reproduction of Gen6:3 note; no fresh HALOT consultation
  rationale: Provisional remaining sense connects the spirit/flesh/days clauses and takes the following preposition locatively. Actual selected Greek/Latin render remaining; 4Q252 publishes a dwelling verb in a reworked quotation. The judicial derivation remains possible despite the unusual form; WLC lemma1777 is editorial analysis, not decisive meaning evidence. Exact WLC letters remain unchanged, and the contending alternative is reader-visible.
- source_word: רוּחִי
  chosen: My Spirit
  alternatives:
  - my breath
  - my spirit
  lexicon: HALOT, BDB
  rationale: First-person possession identifies the divine speaker's spirit but does not exclude life-giving spirit/breath. Local Genesis6:17 and7:22 link spirit/breath and living flesh without proving identical senses. Retained English capitalization is an interpretive style choice, not Hebrew grammatical proof of later doctrinal specificity; alternatives are now reader-visible.
- source_word: בָאָדָם
  chosen: in man
  alternatives:
  - with man
  - in humankind
  - with humankind
  lexicon: HALOT, BDB
  rationale: The preposition is read locatively with the provisional remaining sense. The contention interpretation would produce 'with man.' Generic singular adam is retained as man with an explicit humankind note, not as an exclusively male referent.
- source_word: לְעֹלָם
  chosen: forever
  alternatives:
  - for ever
  - indefinitely
  - perpetually
  lexicon: HALOT, BDB
  rationale: Standard rendering for עוֹלָם in this context; clear modern English.
- source_word: בְּשַׁגַּם
  chosen: for
  alternatives:
  - inasmuch as
  - for that
  - since indeed
  lexicon: HALOT, BDB
  rationale: The composite causal expression is represented idiomatically as for. Its also/even element is preserved in the alternative note rather than silently treated as absent; the rare form's exact force remains uncertain.
- source_word: הוּא בָשָׂר
  chosen: he is flesh
  alternatives:
  - he is flesh
  - they are flesh
  - humankind is flesh
  lexicon: HALOT, BDB
  rationale: Singular he follows generic adam. Flesh is retained rather than paraphrased as mortal. The causal expression's possible also force is disclosed in the reader note; this records the actual main English rather than the earlier superseded wording.
- source_word: וְהָיוּ יָמָיו
  chosen: his days will be
  alternatives:
  - and his days will be
  - therefore his days will be
  - yet his days will be
  lexicon: HALOT, BDB
  rationale: The coordinated days clause follows the pronouncement; English punctuation represents the sequence without making therefore a compulsory inference. This neutral formulation neither adds a flood countdown nor declares an immediately universal lifespan ceiling. Both interpretive possibilities are reader-visible.
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  chosen: one hundred and twenty years
  alternatives:
  - 120 years
  lexicon: HALOT, BDB
  rationale: Fully spelled out for literary readability in Bible style.
