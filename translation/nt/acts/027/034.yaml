  chosen_reading: physical preservation/survival rather than spiritual salvation
  alternative_readings:
  - salvation
  rationale: The immediate context is Paul's assurance during a storm at sea that all aboard will survive. Rendering σωτηρία as 'salvation' in the main text could misleadingly suggest soteriological content not intended by the narrative. The translation preserves the contextual physical sense.
