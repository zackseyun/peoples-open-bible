  to: 그런데 당신은 그들을 두고 이 모든 말을 예언하고, 그들에게 이렇게 말해야 합니다. 「야훼께서 높은 곳에서 포효하시고, 그의 거룩한 처소에서 그의 목소리를 내실 것입니다. 그는 자기 목초지를 향하여 거듭 포효하시며, 포도 밟는 자들처럼 함성을 지르시고 땅의 모든 주민에게 응답하실 것입니다.」[a][b]
  rationale: 예언의 대상과 발화 수신자를 구별하고, 야훼께서 포도 밟는 자들의 함성과 같은 외침으로 땅의 모든 주민에게 응답하신다는 마지막 절의 동사·주체·대상을 모두 회복했습니다. 반복된 포효 표현은 히브리어의 강조를 반영하여 ‘거듭’으로 살렸습니다.
