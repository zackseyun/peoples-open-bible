- from: '1[a]. 그리고 마흔두째 희년 곧 일곱째 주의 첫 해에 아브라함이 이스마엘과 그의 열두 아들과 이삭과 그의 아들들과 그두라의 여섯 아들과 그 자손들을 불렀더라. 또 그들에게 명령하여 주님의 도를 지켜 의를 행하며 각각 자기 형제를 사랑하고 모든 사람 가운데서 서로 대하며 땅에 공의와 공의를 실천하라고 명령하셨습니다.

    2. 그들과 세운 언약대로 그 아들들에게 할례를 행하고 이에서 떠나 좌로나 우로나 주님께서 명하신 모든 길에서 떠나지 말라고 하였느니라 그리고 우리는 모든 음행과 더러움에서 자신을 지켜야 하며, 우리 가운데서 모든 음행과 더러움을 멀리해야 합니다. 만일 네게 속한 여자나 딸이라도 행음하였거든 그를 불로 살라르고 그 눈과 마음대로 음행하지 말며 가나안 여자 중에서 아내를 취하지 말라 가나안 자손이 땅에서 뿌리째 뽑힐 것임이니라 그리고 그는 감시자들의 심판에 대해 그들에게 말했습니다.

    3. 소돔에 대한 심판이라 그들이 그들의 악함과 그들 가운데의 음행과 더러움과 부패로 말미암아 심판을 받았으니 그들은 음행으로 죽었느니라. 또 모든 음행과 더러움과 모든 더러움에서 자신을 지켜 네 이름이 저줏거리가 되게 하며 네 평생에 욕을 당하게 하여 네 아들이 다 칼에 멸망되며 너도 소돔과 같이 저주를 받게 되며 네 남은 자도 고모라 자손과 같이 저주를 받을까 하노라 내 말을 들어라, 내 아이들아, 사랑해라

    4. 하늘의 하나님을 삼고 그의 모든 계명을 지키며 그들의 우상과 더러운 것을 좇지 말라 너희를 위하여 부어 만든 신들과 조각한 형상을 만들지 말라 그것들은 공허하고 그 안에 영이 없음이니라 그것은 손으로 만든 것이므로 그것을 신뢰하는 사람은 아무것도 신뢰하지 않습니다. 그것들을 섬기지 말며 그것들에게 절하지도 말라. 그러나 하나님을 섬기라

    5. 지극히 높으신 자 그에게 절하고 항상 그 얼굴을 항상 구하며 그 앞에서 공의와 공의를 행하라 그리하면 네 길을 지도하시며 너를 긍휼히 여기시고 너를 위하여 조석으로 비를 내리시며 네가 땅에 하는 모든 일에 복을 주시고 네 곡식에 복을 주시리라

    6. 네 태를 축복하고 네 몸의 자손과 네 땅의 자손과 네 가축의 자손과 땅의 자손에게 복을 주어

    7. 당신의 양 떼. 그러면 너는 땅에서 복을 받게 될 것이며 땅의 모든 민족이 너를 사모할 것이다.

    8. 그들은 내 이름으로 너희 자녀에게 복을 주어 그들도 나와 같이 복을 받게 하리라 그리고 그는 이스마엘과 그의 아들들과 그두라의 아들들에게 선물을 주고, 그들을 그의 아들 이삭에게서 떼어 놓았습니다. 하지만 그가 준 모든 것은

    9. 그 아들 이삭에게. 이스마엘과 그의 아들들과 그두라의 아들들과 그들의 자손이 함께 가서 바란에서 바벨론 어귀까지 동쪽을 향한 온 땅에 정착하였으니

    10. 사막. 그리고 이들이 FN2__[b][b]와 섞여서 그들의 이름을 아라비아인과 이스마엘인이라 불렀더라.'
  to: '1. 그리고 마흔두 번째 희년, 곧 일곱째 주간의 첫해에 아브라함은 이스마엘과 그의 열두 아들, 이삭과 그의 두 아들, 그리고 그두라의 여섯 아들과 그들의 자녀들을 불러 모았습니다. 그는 그들에게 주의 길을 지키고 의를 행하며, 각 사람이 자기 형제를 사랑하고 모든 사람 가운데서 그렇게 지내며, 그들이 서로 함께 걸어 땅에서 정의와 의를 행하라고 명령했습니다.

    2. 그는 그들에게, 그들과 맺어진 언약에 따라 자기 아들들에게 할례를 행하고, 이것에서 벗어나지 않으며, 하나님께서 명하신 모든 길에서 오른쪽으로도 왼쪽으로도 치우치지 말고, 우리가 모든 음행과 더러움에서 자신을 지키며 우리 가운데서 모든 음행과 더러움을 없애도록 명하였습니다. 또 너희 가운데 여자가 음행을 범하거나 딸이라도 그러하면, 그 여자를 불로 태우고, 그들이 자기 눈과 마음을 따라 음행하지 않게 하며, 가나안의 딸들 가운데서 아내를 맞이하지 않게 하라고 하였습니다. 가나안의 씨가 땅에서 뿌리째 뽑힐 것이기 때문입니다. 그리고 그는 그들에게 감시자들의 심판에 관하여 말하였습니다.

    3. 그리고 소돔의 심판은 이러했습니다. 그들은 자기들의 악함과 음행과 부정함과 서로 간의 타락 때문에 심판을 받았으며, 음행으로 죽었습니다. 너희도 모든 음행과 부정함과 모든 죄의 더러움에서 자신을 지키십시오. 그리하여 너희 이름을 저주에 내주고, 너희 평생을 치욕에 내주고, 너희 모든 아들들을 칼로 멸망에 넘기며, 소돔처럼 저주받은 자들이 되고, 너희 남은 자들이 모두 고모라의 자손들처럼 되지 않도록 하십시오. 내가 너희에게 증언합니다, 내 자녀들아: 그를 사랑하십시오.

    4. 하늘의 하나님을 섬기고, 그분의 모든 명령을 굳게 붙드십시오. 그들의 우상들과 그들의 부정함을 따라가지 마십시오. 또 너희 자신을 위하여 주조한 신들이나 새긴 형상을 만들지 마십시오. 그것들은 헛것이며 그 안에 영이 없기 때문입니다. 그것들은 손으로 만든 것이며, 그것들을 신뢰하는 모든 사람은 아무것도 아닌 것을 신뢰하는 것입니다. 그것들을 섬기지도 말고 그것들에게 절하지도 마십시오. 그러나 하나님을 섬기십시오.

    5. 지극히 높으신 분께 경배하고, 언제나 그의 얼굴을 구하며, 그의 앞에서 바름과 의를 행하십시오. 그러면 그가 여러분을 바르게 하시고 자비를 베푸시며, 아침과 저녁의 비를 여러분에게 내리시고, 여러분이 땅에서 하는 모든 일을 복을 주시며, 여러분의 곡식도 복을 주실 것입니다.

    6. 그리고 태를, 또 그분께서 당신 몸의 씨와 당신 땅의 씨와 당신 가축의 떼와 떼를 복 주시기를…

    7. 당신의 양 떼를. 그리고 당신은 땅에서 복이 될 것이며, 땅의 모든 민족이 당신을 원할 것입니다.

    8. 그리고 그들은 나와 같이 복을 받도록 내 이름으로 너희 자녀들을 축복할 것입니다. 그리고 그는 이스마엘과 그의 아들들, 그리고 그두라의 아들들에게 선물을 주고, 그들을 자기 아들 이삭에게서 떠나보냈습니다. 그러나 그는 모든 것을 그에게 주었습니다.

    9. 그의 아들 이삭에게. 이스마엘과 그의 아들들과 그두라의 아들들과 그들의 자녀들이 함께 가서 바란에서 바빌론으로 들어가는 길목까지, 동쪽을 향한 온 땅에 정착하였습니다.

    10. 광야였습니다. 그리고 이들은 저들과 뒤섞였으며, 그들의 명칭은 ‘아랍인들’과 ‘이스마엘 사람들’이라는 명칭으로 결합되었습니다.'
