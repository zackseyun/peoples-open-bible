  from: Lord[a], God of heaven, look upon their arrogance, and have mercy on the humiliation of our people, and look upon the face of those sanctified to you on this day.
  to: “Lord, God of heaven, look upon their arrogance; have mercy on our people in their humiliation; on this day, look upon the faces of those consecrated to you.”
