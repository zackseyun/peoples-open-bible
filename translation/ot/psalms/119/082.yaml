id: PSA.119.82
reference: Psalms 119:82
source:
  edition: WLC
  text: כָּל֣וּ עֵ֭ינַ/י לְ/אִמְרָתֶ֑/ךָ לֵ֝/אמֹ֗ר מָתַ֥י תְּֽנַחֲמֵֽ/נִי׃
translation:
  text: My eyes are worn out watching for your promise; I ask, “When will you comfort me?”
  philosophy: dynamic
lexical_decisions:
- source_word: לְאִמְרָתֶךָ
  chosen: promise
  alternatives:
  - word
  - saying
  lexicon: HALOT
  rationale: אִמְרָה in this psalm repeatedly denotes God's committed utterance on which the psalmist stakes his life; rendered 'promise' to distinguish it from דָּבָר ('word'), with 'word/saying' as alternatives.
