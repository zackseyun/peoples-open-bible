    issue: ‘용사들’은 אֵלִים의 의미 범위를 군사적 인물로 좁힙니다.
    rationale: 이 말은 일반적으로 강하고 위력 있는 자들을 뜻할 수 있으므로, 문맥상 ‘힘센 자들’이 더 중립적이고 포괄적입니다.
  - severity: medium
