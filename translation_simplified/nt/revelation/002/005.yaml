translation:
  language: en
  text: So remember where you have fallen from.[a] Reorient toward God[r1], and do what you did at first. If you do not reorient toward God, I am coming to you and will remove your lampstand from its place.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “remember the height from which you have fallen.” The Greek says “where you have fallen from” and may imply a former height.
    reason: lexical_alternative
  - marker: b
    text: In Revelation 1:20, a lampstand represents a church.
    reason: cross_reference
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Therefore remember from where you have fallen
  simplified_phrase: So remember where you have fallen from
  preserved_meaning: The command follows the previous rebuke and retains the image of falling from a former place.
  reasoning_layer_used: Lexical decisions for οὖν, πόθεν, and πέπτωκας
  rationale: Natural word order clarifies the command without making the implied height explicit.
- pob_phrase: do the works you did at first
  simplified_phrase: do what you did at first
  preserved_meaning: They must resume the deeds that marked their earlier faithfulness.
  reasoning_layer_used: Lexical decision for τὰ πρῶτα ἔργα
  rationale: Common wording preserves the command to return to their earlier actions.
translation_notes:
  risk_flags:
  - risk: Readers may understand the lampstand literally or define its removal too narrowly.
    mitigation: The footnote identifies the church symbolism without resolving the precise judgment.
  - risk: “Where you have fallen from” may sound less natural than an explicit height metaphor.
    mitigation: The wording preserves the Greek ambiguity, while the footnote gives the possible height sense.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
