  text: καθὼς ἐπηγγείλατο διὰ τοῦ νόμου· ἐλπίζομεν γὰρ ἐπὶ τῷ θεῷ, ὅτι ταχέως ἡμᾶς ἐλεήσει, καὶ ἐπισυνάξει ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὸν ἅγιον τόπον· ἐξείλατο γὰρ ἡμᾶς ἐκ μεγάλων κακῶν, καὶ τὸν τόπον ἐκαθάρισεν.
