  yaml_path: translation/ot/psalms/022/012.yaml
  text: Many bulls surround me; mighty bulls of Bashan encircle me.[a]
  footnotes:
  - marker: a
    text: Or 'distress is near.' The Hebrew noun can denote trouble, distress, or affliction.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 황소들이 저를 에워쌉니다. 바산[a]의 힘센 황소들이 저를 둘러쌉니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 바산은 요단강 동쪽의 지역으로, 기름진 목초지와 힘세고 잘 먹인 가축으로 알려져 있었습니다. 이 표현은 강력하고 위협적인 대적들의 모습을 불러일으킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּרְחַק מִמֶּנִּי
  english_pob_choice: Do not be far from me
  chosen_korean: 나에게서 멀리하지 마십시오
  alternatives_korean:
  - 나에게서 멀지 마십시오
  - 나에게서 떨어져 있지 마십시오
  lexicon: WLC; HALOT
  rationale: אַל + תִּרְחַק의 공간적 거리 표현을 살려, 단순한 감정적 소외가 아니라 실제 ‘멀리 있음’의 요청을 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: צָרָה
  english_pob_choice: trouble
  chosen_korean: 고난
  alternatives_korean:
  - 환난
  - 괴로움
  - 재난
  lexicon: HALOT
  rationale: צָרָה는 trouble/distress/affliction을 아우르므로, 시편의 탄원 맥락에서 너무 협소하지 않게 ‘고난’으로 옮겼습니다.
- source_word: קְרוֹבָה
  english_pob_choice: is near
  chosen_korean: 가깝기 때문입니다
  alternatives_korean:
  - 가깝기 때문입니다
  - 다가오기 때문입니다
  - 가까이 있기 때문입니다
  lexicon: HALOT
  rationale: 형용사 ‘가깝다’의 상태를 이유절로 살려, 앞의 간청에 대한 근거를 한국어 어순에 맞게 표현했습니다.
- source_word: אֵין עוֹזֵר
  english_pob_choice: there is no helper
  chosen_korean: 도와줄 이가 없습니다
  alternatives_korean:
  - 돕는 이가 없습니다
  - 도울 자가 없습니다
  - 돕는 사람이 없습니다
  lexicon: HALOT
  rationale: עוֹזֵר의 능동 분사적 명사 용법을 ‘도와줄 이’로 옮겨, 단순한 추상명사 ‘도움’이 아니라 ‘도와주는 사람’의 부재를 드러냈습니다.
theological_decisions:
- issue: 시편 탄원에서의 하나님의 거리 표현
  chosen_reading: ‘나에게서 멀리하지 마십시오’로 직역에 가깝게 유지해, 하나님이 실제로 멀리 계신다는 탄원의 긴장을 보존했습니다.
  alternative_readings:
  - 저를 버리지 마십시오
  - 저를 떠나지 마십시오
  rationale: 원문은 רחק + מן의 공간적 거리 언어를 사용하므로, ‘버리다’로 옮기면 원문의 의미보다 강한 신학적 결론을 미리 넣게 됩니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
