  rationale: 문맥상 단순 감정이 아니라 언약 위반에 대한 심판적 분노를 구체적으로 가리키므로, 현대어로도 신학적 무게를 유지하는 표현을 택했습니다.
  doctrine_reference: 구약 탄원과 심판 언어의 직역 원리
- issue: ‘흩으신’의 주어를 하나님으로 분명히 드러낼지 여부
  chosen_reading: ‘우리가 흩으신 그곳’으로 두어, 원문의 주어가 이어지는 문맥상 하나님임을 문장 흐름 안에서 읽히게 했습니다.
  alternative_readings:
  - 우리를 흩으신 그곳
  - 우리를 거기 흩으신 곳
  rationale: 원문은 관계대명사절로 흩으심의 주체를 하나님께 돌리며, 이를 한국어에서도 유지해야 바룩서의 포로 신학이 흐려지지 않습니다.
  doctrine_reference: 포로와 흩으심에 대한 하나님의 주권
