  from: For while he was waging war against Ptolemy in Egypt[a], he also heard that, when a report had spread that he was dead, the people of Jerusalem were rejoicing as much as possible; so he quickly marched up against them.
  to: For while Antiochus was waging war against Ptolemy in Egypt, he heard that the people of Jerusalem were overjoyed because a report of his death had spread. So he quickly marched against them.
  rationale: The established geographic setting and military language are retained, as is the neutral word 'report.' The earlier rationale for 'as much as possible' identifies intensification, which is conveyed more accurately in English by 'overjoyed.'
