translation:
  language: en
  text: 'Paul and Timothy, servants[a] of Messiah[b] Jesus, to all God’s holy people in Philippi who are in Christ Jesus, together with the overseers[c] and deacons:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “servants” or “bondservants.” The Greek word refers to people who belong to a master.
    reason: lexical_alternative
  - marker: b
    text: Or “Christ.” “Messiah” translates the Greek title Christos (“Anointed One”), often rendered “Christ” in English.
    reason: alternative_reading
  - marker: c
    text: Or “bishops.” “Overseers” directly translates the Greek term.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: all the saints
  simplified_phrase: all God’s holy people
  preserved_meaning: The whole congregation is identified as a people set apart for God.
  reasoning_layer_used: POB phrase-level lexical alternative
  rationale: This avoids suggesting that only exceptional believers are being addressed.
- pob_phrase: the saints in Messiah Jesus who are in Philippi
  simplified_phrase: God’s holy people in Philippi who are in Messiah Jesus
  preserved_meaning: The recipients live in Philippi and remain identified by their union with Messiah Jesus.
  reasoning_layer_used: POB lexical decisions for ἐν and τοῖς οὖσιν ἐν Φιλίπποις
  rationale: Placing Philippi beside the people makes their physical location immediately clear.
- pob_phrase: overseers and deacons
  simplified_phrase: overseers[c] and deacons
  preserved_meaning: Both recognized ministry roles remain distinct in the greeting.
  reasoning_layer_used: POB lexical decisions for ἐπισκόποις and διακόνοις
  rationale: A brief note explains the less familiar title without adding unsupported duties.
interpretive_expansions:
- pob_phrase: all the saints
  rendering: all God’s holy people
  claim: “Saints” refers to the entire addressed community as people set apart for God.
