  rationale: The current wording awkwardly coordinates “is struck” with bare “withered.” The revision forms a natural compound predicate and preserves the heart’s afflicted, dried-up condition and the grass comparison. Rendering וַיִּבַשׁ as resultant “withered” is preferable here to shifting to the present “withers.”
