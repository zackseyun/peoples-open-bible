  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tunc
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후에
  - 그리하여
  lexicon: source_note
  rationale: 라틴어 tunc의 시간적 전환을 자연스러운 한국어 담화 표지로 옮겼습니다.
- source_word: interrogaui angelum et dixi
  english_pob_choice: I asked the angel and said
  chosen_korean: 나는 천사에게 물어보며 말했습니다
  alternatives_korean:
  - 나는 천사에게 질문하고 말했습니다
  - 나는 천사에게 물었고 말했습니다
  lexicon: source_note
  rationale: interrogaui와 dixi의 두 동작을 모두 살리되, 한국어에서는 연동형으로 매끄럽게 연결했습니다.
- source_word: qui sunt hi
  english_pob_choice: Who are these
  chosen_korean: 이 사람들은 누구입니까
  alternatives_korean:
  - 이들은 누구입니까
  - 이 사람들은 누구예요
  lexicon: source_note
  rationale: hi를 지시 대명사만이 아니라 화자의 시선 앞에 있는 집단을 가리키는 표현으로 받아 자연스러운 현대 한국어로 옮겼습니다.
- source_word: domine
  english_pob_choice: lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인이여
  - 나의 주님
  lexicon: source_note
  rationale: domine는 소유격이 없는 호격이므로 ‘나의’를 넣지 않고, 공손한 호칭인 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: 호격 domine의 한국어 존칭 수준
  chosen_reading: 천사에게 묻는 화자의 경어를 유지해 「주님」으로 번역했습니다.
  alternative_readings:
  - ‘주여’
  - ‘나의 주님’
  rationale: 라틴어 호격은 관계의 소유를 뜻하지 않으므로, 경어는 유지하되 소유 의미는 추가하지 않았습니다.
