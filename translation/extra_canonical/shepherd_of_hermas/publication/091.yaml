theological_decisions:
- issue: Moral responsibility and differentiated repentance
  chosen_reading: Retain each group’s stated responsibility, possibility or exclusion of repentance, and
    the life/death consequences.
  rationale: The visionary explanation makes distinct claims about different groups. Do not erase the
    distinctions or turn difficult entry into impossibility. Expose conjectures and supplied conditions.
