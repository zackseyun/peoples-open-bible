id: GEN.37.8
reference: Genesis 37:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ אֶחָ֔י/ו הֲ/מָלֹ֤ךְ תִּמְלֹךְ֙ עָלֵ֔י/נוּ אִם מָשׁ֥וֹל תִּמְשֹׁ֖ל בָּ֑/נוּ וַ/יּוֹסִ֤פוּ עוֹד֙ שְׂנֹ֣א אֹת֔/וֹ עַל חֲלֹמֹתָ֖י/ו וְ/עַל דְּבָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: ko
  text: 그의 형들이 그에게 말했습니다. 「네가 정말로 왕이 되어 우리를 다스리겠습니까? 네가 정말로 우리를 통치하겠습니까?」 그래서 그들은 그가 꾼 꿈들과 그가 한 말들 때문에 그를 더욱더 미워했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  english_pob_choice: Will you really reign over us?
  chosen_korean: 네가 정말로 우리를 다스리겠느냐?
  alternatives_korean:
  - 네가 정말로 우리를 왕으로 다스리겠느냐?
  - 네가 정말 우리 위에 군림하겠느냐?
  lexicon: מלך
  rationale: 히브리어의 왕권/지배를 드러내되, 자연스러운 현대 한국어로는 ‘다스리다’가 가장 직접적이며 과장 없이 원문 질문의 강세를 살립니다.
- source_word: מָשׁוֹל תִּמְשֹׁל
  english_pob_choice: Will you really rule over us?
  chosen_korean: 네가 정말로 우리를 통치하겠느냐?
  alternatives_korean:
  - 네가 정말로 우리를 지배하겠느냐?
  - 네가 정말로 우리를 다스리겠느냐?
  lexicon: משל
  rationale: 두 번째 동사는 첫 번째보다 통치 행위를 더 넓게 가리키므로, 반복을 피하면서도 권세의 의미를 분명히 하는 ‘통치하다’를 택했습니다.
- source_word: שְׂנֹא אֹתוֹ
  english_pob_choice: they hated him
  chosen_korean: 그를 더욱더 미워했습니다
  alternatives_korean:
  - 그를 더 미워했습니다
  - 그를 한층 더 미워했습니다
  lexicon: שנא
  rationale: 히브리어의 ‘추가로/더욱’의 강조를 반영해 증감이 분명한 ‘더욱더’로 옮겼습니다.
- source_word: חֲלֹמֹתָיו וְעַל דְּבָרָיו
  english_pob_choice: because of his dreams and because of his words
  chosen_korean: 그의 꿈들과 그의 말들 때문에
  alternatives_korean:
  - 그의 꿈과 그의 말 때문에
  - 그의 꿈들과 말들 때문에
  lexicon: חלם / דבר
  rationale: 복수형을 살려 요셉의 여러 꿈들과 발언들을 가리키는 느낌을 보존했습니다.
theological_decisions:
- issue: 형들의 반응에 담긴 왕권 거절의 뉘앙스
  chosen_reading: ‘다스리다/통치하다’의 이중 표현으로, 단순한 가족 갈등이 아니라 장차의 권세에 대한 거부를 드러냈습니다.
  alternative_readings:
  - ‘왕이 되다’로 단순화
  - 둘 다 ‘지배하다’로 통일
  rationale: 원문은 동의 반복으로 강한 반발을 표현하므로, 두 동사를 구분해 번역하되 과도한 해석을 피했습니다.
  doctrine_reference: 창세기 37장의 서사적 예고와 형제들의 거부
- issue: ‘말들’의 범위
  chosen_reading: ‘그의 말들’로 그대로 두어, 꿈 해석이든 발언이든 포함할 수 있는 원문의 넓은 범위를 보존했습니다.
  alternative_readings:
  - ‘그가 한 말들’
  - ‘그의 발언들’
  rationale: 원문은 꿈과 함께 그의 발화 전체를 묶어 미워한 이유를 제시하므로, 의미를 좁히지 않았습니다.
  doctrine_reference: 본문의 서사적 범위 보존
