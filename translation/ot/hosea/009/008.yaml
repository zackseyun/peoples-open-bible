theological_decisions:
- issue: Speaker perspective in 'my God' versus 'his God'
  chosen_reading: 'Retain the pronominal contrast: ''with my God'' ... ''in the house of his God.'''
  alternative_readings:
  - Smooth to 'with God' to reduce abruptness
  - Emend or interpret both references as the same perspective
  rationale: The Masoretic text presents a striking shift in pronouns. Preserving it respects original-language primacy and maintains the prophetic tension rather than harmonizing it away. The contrast may underscore alienation between Hosea and Ephraim's prophetic establishment.
  doctrine_reference: Translation philosophy §§1, 3
- issue: Referent of 'the prophet'
  chosen_reading: Negative reference to the prophet associated with Ephraim in context
  alternative_readings:
  - Positive self-reference to Hosea as watchman with God, followed by a separate accusation against others
  rationale: The immediate context is strongly condemnatory, so the line is rendered as part of the indictment. Still, the syntax is difficult enough that an alternative interpretive construal is worth preserving in a footnote.
  doctrine_reference: Translation philosophy §3
