revisions:
- from: 그때에 만군의 주께 예물이 드려질 것입니다. 키가 크고 매끈한 백성에게서, 멀리까지 두려움이 되는 백성에게서, 명령 위에 명령이 있고 짓밟히는 나라에게서 — 그들의 땅을 강들이 나누는 — 만군의 주의 이름이 있는 곳, 곧 시온 산으로 말입니다.[a]
  to: 그때에 키가 크고 살갗이 매끈한 백성, 그곳에서 멀리까지 두려움의 대상인 백성, 명령에 명령을 거듭하고 짓밟는 나라, 곧 강들이 그 땅을 가르는 백성에게서 만군의 주께 예물이 드려져, 만군의 주의 이름이 있는 곳, 곧 시온 산으로 옮겨질 것입니다.[a][b]
  rationale: 원문의 예물-출처-수령자-목적지 구조를 한국어 문장 안에서 명확히 पुन구성했습니다. ‘예물’과 ‘만군의 주’는 유지하되, ‘짓밟히는’을 원문의 명사적·비한정적 표현에 더 가까운 ‘짓밟는’으로 고치고, קַו קָו의 대안적 이해는 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:48:24Z'
review_pass:
  verdict: revise
  source_fidelity: ‘짓밟히는 나라’는 וּמְבוּסָה(‘짓밟음/짓밟는 것’)를 수동 상태로 한정하여 원문의 압축된 명사구와 영어 POB의 ‘trampling’에 충분히 맞지 않습니다. 또한 예물이 드려지는 대상 백성을 가리키는 수식들의 병렬 관계와 예물의 도착지(시온 산)를 더 분명히 해야 합니다.
  naturalness: 현 번역의 ‘시온 산으로 말입니다’는 현대 한국어 합쇼체 성경 문체에서 부자연스럽고, 대시로 삽입한 ‘그들의 땅을 강들이 나누는’도 문장 연결이 매끄럽지 않습니다. 수정문은 긴 수식열을 유지하면서도 예물의 출처와 목적지를 자연스럽게 연결합니다.
  terminology: שַׁי는 ‘예물’로 옮길 수 있으며, 대안 ‘공물’을 각주로 남기는 것이 적절합니다. יהוה צבאות는 영어 POB의 LORD of Armies 및 한국어의 관용적 성경 용례에 맞추어 ‘만군의 주’로 유지합니다. קַו קָו는 의미가 논쟁적인 표현이므로 영어 POB의 ‘command upon command’를 본문에서 따르되, ‘측량줄’ 가능성을 각주로 밝혀 모호성을 보존합니다.
  issues:
  - severity: medium
    issue: וּמְבוּסָה를 ‘짓밟히는’으로 번역함
    rationale: 히브리어는 ‘짓밟음’ 또는 ‘짓밟는 것’이라는 압축된 명사 표현이며, 수동태로만 확정되지 않습니다. 영어 POB도 능동·수동을 확정하지 않은 ‘trampling’을 사용합니다.
  - severity: medium
    issue: 예물의 목적지와 문장 종결이 부자연스러움
    rationale: ‘만군의 주의 이름이 있는 곳, 곧 시온 산으로 말입니다’는 원문의 목적지 구문을 설명체 종결로 바꾸어 어색합니다. 예물이 시온 산으로 ‘옮겨질 것’임을 문장 안에서 밝혀야 합니다.
  - severity: low
    issue: קַו קָו의 해석상 모호성이 본문에서 고정됨
    rationale: 영어 POB의 ‘command upon command’를 따를 수 있으나, 히브리어 קַו는 ‘줄/측량줄’로도 이해될 수 있으므로 각주가 필요합니다.
