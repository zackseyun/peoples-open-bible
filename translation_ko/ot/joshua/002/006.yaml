  - severity: medium
    issue: 본문에서 לָהּ(‘그녀를 위해/자신을 위해’)가 생략되고, 각주만 대안을 제시함
    rationale: 영어 POB의 확정 본문과 원문의 여격 표현을 따라 이 의미는 본문에 반영해야 합니다. 현 각주는 본문에 없는 요소를 ‘또는’으로 제시하여 본문-각주 관계도 부정확합니다.
