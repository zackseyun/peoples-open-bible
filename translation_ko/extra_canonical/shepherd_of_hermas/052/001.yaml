revisions:
- from: “내가 아까 너희에게 이르기를 너희는 간교하고 고집이 세서 비유를 구하느니라 그러나 너희가 참을성이 있으므로 내가 밭과 나머지 비유를 해석하여 주리라 하나님이 그것을 천사들에게 맡겨 지키게 하시고 친히 그들의 죄를 깨끗하게 하시려고 애쓰고 많이 참으셨으니 수고하지 않고는 땅을 파는 자가 없느니라.
  to: 그가 말했습니다. “조금 전에 당신에게 말했듯이, 당신은 비유들의 해석을 캐묻는 교활하고 고집 센 사람입니다. 그러나 당신이 이토록 끈질기니, 밭의 비유와 나머지 것들을 해석해 드리겠습니다. 그분께서는 그들을 천사들에게 맡겨 지키게 하셨고, 친히 많은 수고를 하시고 많은 고생을 견디시며 그들의 죄를 깨끗하게 하셨습니다. 수고와 고생 없이는 아무도 땅을 팔 수 없기 때문입니다.”
  category: register_archaic_repair
  rationale: 「이르기를」「구하느니라」「해석하여 주리라」「없느니라」는 개역 계열 문어체이며 문장 부호도 없었습니다. 같은 장 2절의 합쇼체 대화(「보십시오」「들으십시오」)에 맞추어 문장을 나누고 종결을 고쳤습니다. 원문의 2인칭 단수(σοι, εἶ)를 「당신」으로 회복하고, παράμονος를 「참을성이 있는」이 아닌 「끈질긴」으로, 목적형 「깨끗하게 하시려고」를 원문의 완료 행위 「깨끗하게 하셨습니다」로 바로잡았습니다. 주체는 2절과 같이 「그분」으로 표기했습니다.
