  from: For after I turned back[d][a], I felt regret; and after I was instructed, I struck my thigh. I was ashamed, and also humiliated[c][b], because I bore the disgrace of my youth.
  to: For after I turned away[a], I was sorry for what I had done[d]; and after I was instructed, I struck my thigh. I was ashamed, and also humiliated[c][b], because I bore the disgrace of my youth.
  rationale: Use the maintainer-selected turning-away reading of shuv, retaining turning back as an alternative. Render nacham as sorrow over wrongdoing; "for what I had done" is contextual clarification, not a separate Hebrew phrase. No added degree of sorrow is intended.
