reference: Zephaniah 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ בָּ/עֵ֣ת הַ/הִ֔יא אֲחַפֵּ֥שׂ אֶת יְרוּשָׁלִַ֖ם בַּ/נֵּר֑וֹת וּ/פָקַדְתִּ֣י עַל הָ/אֲנָשִׁ֗ים הַ/קֹּֽפְאִים֙ עַל שִׁמְרֵי/הֶ֔ם הָ/אֹֽמְרִים֙ בִּ/לְבָבָ֔/ם לֹֽא יֵיטִ֥יב יְהוָ֖ה וְ/לֹ֥א יָרֵֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/012.yaml
  text: 'And it will happen at that time: I will search Jerusalem with lamps, and I will punish the men who have grown thick on their dregs, who say in their hearts, ''The LORD will not do good, nor will he do harm.'''
translation:
  language: ko
  text: 그때에 나는 예루살렘을 등불로[a] 샅샅이 수색하고, 마음속으로 ‘야훼께서는 좋은 일도 하지 않으시고 나쁜 일도 하지 않으실 것이다’라고 말하며 자기 포도주 찌꺼기 위에 굳어 있는 사람들을 벌하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘등불들’이라고 합니다. 이는 예루살렘을 철저히 수색하시는 모습을 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: אֲחַפֵּשׂ אֶת יְרוּשָׁלִַם בַּנֵּרוֹת
  english_pob_choice: I will search Jerusalem with lamps
  chosen_korean: 예루살렘을 등불로 샅샅이 뒤지고
  alternatives_korean:
  - 예루살렘을 등불로 찾고
  - 예루살렘을 등불로 수색하고
  lexicon: חפש / נר
  rationale: 문맥상 단순한 ‘찾다’보다 철저한 탐색과 조사를 드러내므로 ‘샅샅이 뒤지다’로 옮기고, בַּנֵּרוֹת는 도구/수단을 드러내는 ‘등불로’로 처리했습니다.
- source_word: וּפָקַדְתִּי עַל הָאֲנָשִׁים
  english_pob_choice: and I will punish the men
  chosen_korean: 사람들을 벌하겠습니다
  alternatives_korean:
  - 남자들을 벌하겠습니다
  - 그 남자들을 징벌하겠습니다
  lexicon: פקד
  rationale: 여기서 פקד는 심판적 방문/벌을 뜻하므로 ‘벌하다’가 가장 직접적이며, הָאֲנָשִׁים은 문맥상 특정한 ‘남자들’보다는 ‘사람들’로 자연스럽게 옮겼습니다.
- source_word: הַקֹּפְאִים עַל שִׁמְרֵיהֶם
  english_pob_choice: who have grown thick on their dregs
  chosen_korean: 자기 찌꺼기 위에 눌어붙어 있는
  alternatives_korean:
  - 찌꺼기 위에 굳어 있는
  - 밑동 찌꺼기 위에 고여 있는
  lexicon: קפא / שׁמרים
  rationale: POB의 ‘grown thick’는 포도주 찌꺼기 위에서 굳어 버린 상태를 가리키며, 한국어에서는 ‘눌어붙다’가 비유적·물질적 이미지를 함께 살립니다.
- source_word: לֹא יֵיטִיב יְהוָה וְלֹא יָרֵעַ
  english_pob_choice: The LORD will not do good, nor will he do harm
  chosen_korean: ‘야훼께서는 선을 행하지도 않으시고, 악을 행하지도 않으실 것이다’
  alternatives_korean:
  - ‘야훼께서는 좋게도 나쁘게도 하지 않으실 것이다’
  - ‘주께서는 선도 악도 하지 않으실 것이다’
  lexicon: ייטיב / ירע / יהוה
  rationale: יתיב/ירע의 대비를 도덕적 행위로 분명히 드러내기 위해 ‘선을 행하다 / 악을 행하다’로 직역했고, יהוה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 적극적 개입 부정 발언의 뉘앙스
  chosen_reading: ‘선도 악도 하지 않으실 것이다’가 아니라 ‘선을 행하지도, 악을 행하지도 않으실 것이다’로 번역해 냉소적 무감각과 신적 무관심 주장을 드러냈습니다.
  alternative_readings:
  - 하나님은 아무 일도 하지 않으실 것이다
  - 하나님은 좋지도 나쁘지도 않으실 것이다
  rationale: 본문은 하나님의 중립성 주장이라기보다 도덕적 판단과 섭리를 부정하는 말이므로, 행위 동사를 유지해 심판 맥락의 신학적 긴장을 보존했습니다.
  doctrine_reference: 하나님의 섭리와 심판에 대한 선지자적 책망
