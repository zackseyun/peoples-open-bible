id: JOB.31.8
reference: Job 31:8
source:
  edition: WLC
  text: אֶ֭זְרְעָה וְ/אַחֵ֣ר יֹאכֵ֑ל וְֽ/צֶאֱצָאַ֥/י יְשֹׁרָֽשׁוּ׃
translation:
  text: then let me sow and another eat, and let my offspring be uprooted[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “my produce be uprooted.” The Hebrew word can refer to descendants or to what springs from the ground.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶזְרְעָה
  chosen: let me sow
  alternatives:
  - may I sow
  - I would sow
  lexicon: HALOT
  rationale: 'Qal cohortative 1cs of זרע in the imprecatory context of Job 31 is best rendered volitionally as part of a self-malediction: ''let me sow.'' This preserves the oath-curse force better than a simple future.'
- source_word: וְאַחֵר
  chosen: and another
  alternatives:
  - and someone else
  lexicon: HALOT
  rationale: אַחֵר means 'another' or 'someone else.' 'Another' is concise and preserves the contrast between Job and the one who benefits from his labor.
- source_word: יֹאכֵל
  chosen: eat
  alternatives:
  - consume
  lexicon: HALOT
  rationale: The verb אכל literally means 'eat.' In context it refers to enjoying the produce of what Job has sown. 'Eat' keeps the agricultural concreteness of the Hebrew.
- source_word: וְצֶאֱצָאַי
  chosen: and let my offspring
  alternatives:
  - my descendants
  - my produce
  lexicon: HALOT
  rationale: “Offspring” is the ordinary personal sense in this self-curse; the possible agricultural sense is retained in the note.
- source_word: יְשֹׁרָשׁוּ
  chosen: be uprooted
  alternatives:
  - be rooted out
  - be torn out by the roots
  lexicon: HALOT
  rationale: Piel 3mp of שׁרשׁ here is causative/intensive in sense, referring to being rooted out/uprooted. An English passive best conveys the imprecatory result on 'my offspring.' 'Be uprooted' is idiomatic and preserves the root imagery.
