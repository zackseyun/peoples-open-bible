    issue: ‘무엇이 해주어집니까’는 비문이며 מַה יֵּעָשֶׂה לָאִישׁ의 수동 구문을 제대로 전달하지 못합니다.
    rationale: ‘해 주다’는 보통 행위자와 수혜자를 요구하므로, 여기서는 ‘그 사람에게는 무엇을 해 줍니까?’처럼 수혜자를 명시해야 합니다.
