  terminology: ‘야훼’, ‘사무엘’, ‘엘리’, ‘내 아들아’는 원문 및 한국어 성서 번역 문맥에 적절합니다. 신명 표기를 바꾸거나 교리적으로 해석할 이유는 없습니다.
