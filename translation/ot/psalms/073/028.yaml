  human_or_scholar_review: false
  review_summary: In contrast with “those far from you” in verse 27, קִרֲבַת אֱלֹהִים most naturally denotes approaching or being near to God. “The nearness of God” is awkward and can misleadingly suggest that God is the one who draws near. The dynamic English preserves the relational contrast. With the main-text clarification, the existing footnote is no longer needed.
