source:
  edition: WLC
  text: חֶבְלֵ֣י שְׁא֣וֹל סְבָב֑וּ/נִי קִ֝דְּמ֗וּ/נִי מ֣וֹקְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/006.yaml
  text: In my distress I call on Yahweh, and to my God I cry for help. He hears my voice from his temple[a], and my cry before him comes into his ears.[b]
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead' for 'Sheol.'
    reason: lexical_alternative
  - marker: b
    text: Or 'came before me' or 'met me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 고난 가운데서 야훼[a]를 부르고, 나의 하나님께 도움을 청하여 부르짖습니다. 그분께서는 자신의 성전[b]에서 내 목소리를 들으시며, 나의 부르짖음은 그분 앞에서 그분의 귀에 이릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그분께서 자신의 성전에서 내 목소리를 들으시고, 나의 부르짖음이 그분 앞에서 그분의 귀에 이를 것입니다.” 히브리어 미완료형들은 미래의 의미로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘성전’은 ‘궁전’ 또는 ‘성소’로도 옮길 수 있습니다. 히브리어는 왕이나 하나님의 거처를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵ֣י
  english_pob_choice: cords of
  chosen_korean: 올가미가
  alternatives_korean:
