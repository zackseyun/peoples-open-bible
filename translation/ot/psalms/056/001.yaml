id: PSA.56.1
reference: Psalms 56:1
source:
  edition: WLC
  text: חָנֵּ֣/נִי אֱ֭לֹהִים כִּֽי שְׁאָפַ֣/נִי אֱנ֑וֹשׁ כָּל הַ֝/יּ֗וֹם לֹחֵ֥ם יִלְחָצֵֽ/נִי־־׃
translation:
  text: Be gracious to me, O God, for mortals pursue me[a]; all day long they attack and oppress me.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “trample me”; the Hebrew verb's precise image is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: חָנֵּנִי
  chosen: Be gracious to me
  alternatives:
  - Show me favor
  - Have mercy on me
  lexicon: HALOT
  rationale: Piel imperative of חנן with 1cs suffix asks for divine favor/grace. 'Be gracious to me' is a natural modern rendering that preserves the plea without importing the stronger penitential nuance that 'have mercy' can sometimes suggest.
- source_word: אֱלֹהִים
  chosen: O God
  alternatives:
  - God
  lexicon: HALOT
  rationale: Direct address in prayer; 'O God' reflects vocative force idiomatically in English.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - since
  lexicon: HALOT
  rationale: Introduces the ground for the plea. 'For' is concise and fits psalmic style.
- source_word: שְׁאָפַנִי
  lemma: שׁאף
  chosen: pursues me
  alternatives:
  - tramples me
  - snaps at me
  - would swallow me up
  lexicon: HALOT
  rationale: In this hostile context the verb conveys eager pursuit or attack. “Pursues me” is natural English; the more concrete and disputed imagery is preserved in the note.
- source_word: אֱנוֹשׁ
  chosen: a man
  alternatives:
  - a mortal
  - humanity
  lexicon: HALOT
  rationale: The indefinite singular needs an English article here; “a man” naturally represents the human attacker.
- source_word: כָּל הַיּוֹם
  chosen: all day long
  alternatives:
  - all the day
  lexicon: HALOT
  rationale: Standard idiomatic rendering of the temporal phrase in readable modern English.
- source_word: לֹחֵם
  chosen: an attacker
  alternatives:
  - as he fights
  - an attacker
  lexicon: HALOT
  rationale: The participle can function substantivally and supplies the subject of יִלְחָצֵנִי. “An attacker” is clearer English than the dangling participle “fighting.”
- source_word: יִלְחָצֵנִי
  chosen: he oppresses me
  alternatives:
  - he presses me
  - he harasses me
  lexicon: HALOT
  rationale: לחץ denotes pressing, oppressing, or afflicting. 'Oppresses me' best captures the hostile pressure in natural English while preserving the singular subject.
