id: GEN.49.24
reference: Genesis 49:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֵּ֤שֶׁב בְּ/אֵיתָן֙ קַשְׁתּ֔/וֹ וַ/יָּפֹ֖זּוּ זְרֹעֵ֣י יָדָ֑י/ו מִ/ידֵי֙ אֲבִ֣יר יַעֲקֹ֔ב מִ/שָּׁ֥ם רֹעֶ֖ה אֶ֥בֶן יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: ko
  text: 그러나 그의 활은 굳건히 버티고 있었으며, 그의 팔은 야곱의 능하신 이의 손으로 민첩해졌습니다. 거기에서 이스라엘의 목자, 이스라엘의 돌이 나옵니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּשֶׁב ... קַשְׁתּוֹ
  english_pob_choice: his bow remained steady
  chosen_korean: 그의 활은 굳건히 서 있었고
  alternatives_korean:
  - 그의 활은 튼튼히 서 있었고
  - 그의 활은 견고했습니다
  lexicon: תָּשַׁב / קָשַׁת
  rationale: POB의 ‘steady’를 활의 상태를 단순 정적이 아니라 전투 맥락에서 흔들리지 않는 상태로 살려, 자연스러운 현대 한국어로 ‘굳건히 서 있었다’고 옮겼습니다.
- source_word: וַיָּפֹזּוּ זְרֹעֵי יָדָיו
  english_pob_choice: and his arms were made agile
  chosen_korean: 그의 팔은 … 민첩하게 되었습니다
  alternatives_korean:
  - 그의 팔은 … 활력 있게 되었습니다
  - 그의 팔은 … 유연하게 되었습니다
  lexicon: פּוּז
  rationale: 히브리어 동사는 ‘가벼워지다/활발해지다’의 뉘앙스를 가지므로, 물리적 움직임의 민첩성을 드러내는 ‘민첩하게 되었습니다’로 옮겼습니다.
- source_word: מִידֵי ... אֲבִיר יַעֲקֹב
  english_pob_choice: by the hands of the Mighty One of Jacob
  chosen_korean: 야곱의 능하신 이의 손으로
  alternatives_korean:
  - 야곱의 전능자의 손으로
  - 야곱의 강하신 이의 손으로
  lexicon: אֲבִיר
  rationale: אֲבִיר는 단순한 ‘강한 자’보다 ‘능하신 이’가 한국어 성경 문체에서 더 잘 대응하며, 손의 도구성을 자연스럽게 나타내기 위해 ‘손으로’를 유지했습니다.
- source_word: רֹעֶה אֶבֶן יִשְׂרָאֵל
  english_pob_choice: the Shepherd, the Stone of Israel
  chosen_korean: 이스라엘의 목자, 이스라엘의 반석
  alternatives_korean:
  - 이스라엘의 목자, 이스라엘의 돌
  - 이스라엘의 목자이신, 이스라엘의 반석
  lexicon: רֹעֶה / אֶבֶן
  rationale: ‘Shepherd’는 지도·보호의 목자 이미지를 직접 살리고, ‘Stone’은 한국어 성경의 관용을 따르되 POB의 직역성을 유지하기 위해 ‘반석’으로 옮겼습니다.
theological_decisions:
- issue: 야곱의 능하신 이와 이스라엘의 목자/반석의 연결
  chosen_reading: 문맥상 힘을 주시는 분과 이후 호칭들이 하나님의 보존과 통치를 가리키는 한 흐름으로 유지했습니다.
  alternative_readings:
  - 이를 단순 시적 병렬로만 처리하는 읽기
  - 마지막 두 호칭을 인간 지칭으로 약화하는 읽기
  rationale: 원문의 병행 구조를 살리면서도, POB가 유지한 신학적 긴장을 흐리지 않기 위해 세 호칭을 하나님의 돌보심과 왕권의 이미지로 번역했습니다.
  doctrine_reference: 창세기 49장의 야곱 축복, 하나님의 보호와 인도에 대한 성경적 증언
- issue: ‘이스라엘의 반석’의 표현
  chosen_reading: 고정된 교회용 관용구로 풀지 않고, 원문의 메타포를 그대로 드러내는 ‘반석’을 유지했습니다.
  alternative_readings:
  - ‘견고한 바위’로 풀어 쓰는 읽기
  - 전통 번역처럼 더 익숙한 종교어로 치환하는 읽기
  rationale: 원문이 요구하는 상징적 무게를 유지해야 하므로, 출처가 허용하는 범위 안에서 가장 직역적인 표현을 선택했습니다.
  doctrine_reference: 시편과 토라의 ‘반석’ 이미지에 대한 성경적 메타포
