translation:
  text: '“The first mountain was black. Its believers are apostates, blasphemers against the Lord, and
    betrayers of God’s servants. Repentance is not available to them. Death is. That is also why they
    are black, for their kind is lawless.”


    2. “The second mountain was bare.[a] Its believers are hypocrites and teachers of evil. They resemble
    the first group. They bear no fruit of righteousness, just as their mountain bears no fruit. They
    have a name, but are empty of faith. There is no fruit of truth in them. Repentance is available if
    they repent quickly. If they delay, they will die along with the first group.”


    3. “Sir,” I said, “why is repentance available to these people but not to the first group? Their actions
    are almost the same.”[b] He said, “Repentance is available to these people because they did not blaspheme
    their Lord or betray God’s servants. They acted hypocritically because they wanted gain. Each taught
    according to the desires of people who were sinning.[c] They will still pay some penalty. But repentance
    is available because they did not become blasphemers or betrayers.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: '“Bare” follows Anger’s printed conjecture compared with Latin Vulgata. The apparatus reports
      Athos and Ethiopic “high,” and Latin Palatina “dry.” Alternatives: “The believers from the second
      mountain, the high one” or “the dry one.” The following fruitlessness is retained under each choice.'
  - marker: b
    reason: textual_variant
    text: The selected Greek uses προτέροις (“former ones”), rendered here as “the first group.” This
      is Hilgenfeld’s printed conjecture compared with the Latin and Ethiopic versions; the apparatus
      reports Athos πρώτοις (“first ones”). “The same” translates αἱ αὐταί, Anger’s printed conjecture
      compared with those versions; the apparatus reports Athos καὶ αὗται (“and these”). These reported
      alternatives are not reconstructed here as a complete clause. The near-equivalence is Hermas’s question,
      not a denial of the shepherd’s following distinction.
  - marker: c
    reason: textual_variant
    text: “According to” translates [κατά], Hilgenfeld’s bracketed editorial insertion. The supplied edition-apparatus
      transcription reports support from Latin Vulgata, Latin Palatina, and Ethiopic, and omission in
      Athos. It also reports that Latin Palatina and Ethiopic omit the preceding ἕκαστος (“each”), retained
      in the selected Greek and translated here. These are edition-reported readings, not fresh witness
      verification. Desire for gain, the continuing penalty, and the stated difference between available
      and unavailable repentance remain explicit.
lexical_decisions:
- source_word: μετάνοια / μετανοεῖν
  chosen: repentance / repent
  alternatives:
  - regret
  - penance
  rationale: Preserve changed conduct and the passage-specific availability, urgency and conditions; do
    not harmonize the severe distinctions between groups.
- source_word: ἀποστάται / λῆμμα / τίσουσι δίκην τινά
  chosen: apostates / gain / will pay some penalty
  alternatives:
  - deserters / profit / receive some punishment
  rationale: Retain the severe denial of repentance for the first group and the nonzero penalty for the
    second; do not infer a later system of imposed penance.
