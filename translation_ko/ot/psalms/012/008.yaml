  rationale: 제시된 WLC 본문(시편 12:8)을 처음부터 번역하도록 전면 교정했습니다. סָבִיב רְשָׁעִים יִתְהַלָּכוּן은 ‘악인들이 사방을 활보합니다’로, זֻלּוּת는 ‘비천한 것’으로, לִבְנֵי אָדָם은 포괄적 인간 지시를 반영하여 ‘사람들 가운데’로 옮겼습니다. כְּרֻם의 논쟁 가능한 관계는 ‘…받을 때에’라는 절제된 상황적 번역으로 처리했습니다.
