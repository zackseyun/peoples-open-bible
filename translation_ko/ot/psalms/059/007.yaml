  yaml_path: translation/ot/psalms/059/007.yaml
  text: Look, they gush forth with their mouths[a]; swords are on their lips, for they say, “Who hears?”[b]
  footnotes:
  - marker: a
    text: The Hebrew verb pictures speech bubbling or pouring out.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew reads simply, 'Who hears?' The object is unstated, leaving the arrogant claim open-ended.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 그들의 입에서는 말이 쏟아져 나오고, 그들의 입술에는 칼들이 있습니다. 그들은 ‘누가 듣겠는가?’ 하고 말합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 입에서 거품처럼 터져 나오고’입니다. 히브리어 동사는 액체가 솟거나 쏟아지는 모습을 가리키며, 여기서는 거침없이 쏟아 내는 말을 비유적으로 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단지 ‘누가 듣는가?’라고만 합니다. 무엇을, 또는 누구가 듣는지는 밝히지 않아 그들의 오만한 말이 열린 채로 남습니다.
    reason: alternative_reading
