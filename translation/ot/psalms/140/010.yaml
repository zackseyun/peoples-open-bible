id: PSA.140.10
reference: Psalms 140:10
source:
  edition: WLC
  text: ימיטו עֲלֵי/הֶ֗ם גֶּֽחָ֫לִ֥ים בָּ/אֵ֥שׁ יַפִּלֵ֑/ם בְּ֝/מַהֲמֹר֗וֹת בַּֽל יָקֽוּמוּ־׃
translation:
  text: May burning coals be rained down on them; may God cast them into the fire, into deep pits[a], never to rise again.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “into abysses” or “into watery depths”; the Hebrew term is rare and its precise sense is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: ימיטו
  chosen: May they rain
  alternatives:
  - May ... rain down
  - Let ... be hurled down
  lexicon: HALOT
  rationale: Preserves the Hiphil third-person plural and its imprecatory force while leaving the agents unspecified.
- source_word: עֲלֵיהֶם
  chosen: on them
  alternatives:
  - upon them
  lexicon: HALOT
  rationale: Standard preposition על with pronominal suffix; 'on them' is natural modern English.
- source_word: גחלים
  chosen: coals
  alternatives:
  - coals
  - live coals
  lexicon: HALOT
  rationale: The noun denotes coals or embers; “burning” is unnecessary, especially beside the explicit fire imagery.
- source_word: בָּאֵשׁ
  chosen: into the fire
  alternatives:
  - in fire
  - into fire
  lexicon: HALOT
  rationale: 'With the following verb יפילם, the phrase is best taken with directional/resultative force in English: being cast into the fire. This avoids a choppy asyndetic rendering while preserving the imagery.'
- source_word: יפלם
  chosen: may he cast them
  alternatives:
  - may he make them fall
  - let him throw them down
  lexicon: HALOT
  rationale: Naturally represents the singular Hiphil verb with its plural object suffix without identifying the implied subject.
- source_word: במהמרות
  chosen: into deep pits
  alternatives:
  - into pits
  - into abysses
  - into watery depths
  lexicon: HALOT
  rationale: A defensible contextual rendering of the rare noun; other possible senses are retained in the note.
- source_word: בל
  chosen: never
  alternatives:
  - so that not
  - not
  lexicon: HALOT
  rationale: Negative particle introducing the result/purpose that they do not rise. 'Never' gives idiomatic force in English to the finality of the judgment.
- source_word: יקומו
  chosen: to rise again
  alternatives:
  - to get up
  - to stand
  - to arise
  lexicon: HALOT
  rationale: קום commonly means rise/stand. In this context of being cast down into pits, 'rise again' communicates irreversible downfall.
