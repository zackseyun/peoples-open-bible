id: JHN.2.13
reference: John 2:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: Now the Passover of the Jews was near[a], and Jesus went up to Jerusalem.
  footnotes:
  - marker: a
    text: Or, 'the Passover of the Judeans.' In John, Ἰουδαῖοι can in some contexts mean 'Judeans' rather than 'Jews,' but here it most naturally identifies the Jewish festival.
    reason: lexical_alternative
translation:
  language: ko
  text: 유대인의 유월절[a]이 가까웠고, 예수께서 예루살렘으로 올라가셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다인들의 유월절’. 요한복음에서 Ἰουδαῖοι는 문맥에 따라 ‘유대인’ 또는 지역적 의미의 ‘유다인’을 가리킬 수 있습니다. 여기서는 유월절이 유대인의 절기임을 나타내므로 ‘유대인의 유월절’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς
  english_pob_choice: was near
  chosen_korean: 가까웠고
  alternatives_korean:
  - 임박했다
  - 다가오고 있었다
  lexicon: BDAG
  rationale: 그리스어 부사는 시간적 근접을 뜻하므로 현대 한국어로 ‘가까웠다’가 자연스럽고 과하게 해석하지 않습니다. 서술체 형식에 맞추어 공손한 종결로 처리했습니다.
- source_word: πάσχα
  english_pob_choice: Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 유다인의 유월절(문맥적 표기)
  - 유대인의 절기
  lexicon: BDAG
  rationale: 유월절은 본문의 명시적 유대인 축제를 가리키므로 한국어 성경에서 통용되는 '유월절'로 옮겼습니다.
- source_word: τῶν Ἰουδαίων
  english_pob_choice: of the Jews
  chosen_korean: 유대인들의
  alternatives_korean:
  - 유다인들의
  lexicon: BDAG
  rationale: 요한복음에서 Ἰουδαῖοι는 문맥에 따라 '유대인들' 또는 지역적 의미의 '유다인들'로 해석될 수 있습니다. 여기서는 절기를 한정하는 일반적 식별어로서 '유대인들의'를 선택했습니다(대체 해석은 각주로 표기).
- source_word: ἀνέβη
  english_pob_choice: went up
  chosen_korean: 올라가셨습니다
  alternatives_korean:
  - 올라갔다
  - 참석하려 올라갔다
  lexicon: BDAG
  rationale: εἰς + 장소의 동사로서 방향을 나타내는 '올라가다'가 관용적입니다. 인물(예수)에 대한 한국어 서술에는 존칭을 사용하는 전통을 따랐습니다.
theological_decisions:
- issue: Rendering Ἰουδαῖοι in John
  chosen_reading: 유대인들의 (the Jews)
  alternative_readings:
  - 유다인들의 (the Judeans)
  rationale: 이 구절은 유월절이라는 보편적 유대인 축제를 가리키므로 '유대인들의 유월절'이 본문 의미를 가장 직접적으로 전달합니다. 그러나 요한복음의 Ἰουδαῖοι 번역 문제(광범위한 민족적 의미 vs. 지역적 의미)는 실제 신학적 논점이므로 대체 해석을 각주로 남깁니다.
  doctrine_reference: '원문 우선 번역 원칙: 모호성이 있을 경우 본문 의미를 보존하되 신학적 긴장은 문헌적 근거와 함께 표기합니다.'
- issue: Honorific for Ἰησοῦς in narrative
  chosen_reading: 예수께서 ... 올라가셨습니다 (존칭)
  alternative_readings:
  - 예수는 예루살렘으로 올라갔다 (중립 서술)
  rationale: 한국어의 현대 성경 전통은 예수에 대해 서술문에서도 존칭을 사용하는 경향이 있습니다. 본 번역은 정중한 서술체(합쇼체)를 유지하면서 독자 기대에 부합하도록 존칭을 적용했습니다.
  doctrine_reference: '번역 스타일: 현대 한국어 합쇼체와 전통적 경어 사용을 조화시킵니다.'
