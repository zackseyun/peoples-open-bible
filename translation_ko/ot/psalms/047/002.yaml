  lexicon: HALOT
  rationale: 이 어근은 단순한 소리침보다 기쁨과 찬양이 섞인 높은 환성을 뜻하므로, 문맥상 ‘환호하다’가 가장 잘 맞습니다.
- source_word: בְּקוֹל רִנָּה
  english_pob_choice: with a voice of joy
  chosen_korean: 기쁨의 소리로
  alternatives_korean:
  - 기뻐 외치는 소리로
