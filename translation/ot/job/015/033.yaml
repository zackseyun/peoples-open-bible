  from: He will shake off his unripe grapes like a vine[b][a], and cast off his blossom like an olive tree.
  to: Like a vine, he will strip off his unripe grapes, and like an olive tree, he will cast off his blossom.
  rationale: “Shake off” specifies a mechanism not conveyed by חמס and weakens its force. “Strip off” better reflects the verb's violent/removal sense in this vegetal comparison. Fronting each simile makes the parallel comparison clear in natural English and does not alter the source image.
