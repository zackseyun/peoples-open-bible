id: JOB.34.31
reference: Job 34:31
source:
  edition: WLC
  text: כִּֽי אֶל אֵ֭ל הֶ/אָמַ֥ר נָשָׂ֗אתִי לֹ֣א אֶחְבֹּֽל־־׃
translation:
  text: For has anyone said to God, “I have borne punishment[a]; I will not do wrong.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “I have borne”; the unstated object is understood here as punishment.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - Surely
  lexicon: HALOT
  rationale: Introduces the reason or explanation for the preceding argument. 'For' best preserves the connective force in context.
- source_word: אֶל אֵל
  lemma: אֶל
  chosen: to God
  alternatives:
  - to God Almighty
  - to God as mighty one
  lexicon: HALOT
  rationale: The preposition אֶל with אֵל naturally yields 'to God.' Since אֵל here functions as the common noun/title for God rather than a proper name, 'God' is the clearest English rendering.
- source_word: הֶאָמַר
  chosen: has anyone said
  alternatives:
  - has he said
  - would one say
  lexicon: HALOT
  rationale: 'Although morphologically 3ms perfect (''he said''), in context this clause is commonly understood rhetorically: ''For has anyone said...?'' English idiom benefits from making the implied indefinite subject explicit as ''anyone.'' This captures the generic force without over-literal awkwardness.'
- source_word: נָשָׂאתִי
  chosen: I have borne punishment
  alternatives:
  - I have borne
  - I have endured
  - I have lifted up
  lexicon: HALOT
  rationale: The verb means bear/carry, while its object is unexpressed; the contextual completion is retained but marked.
- source_word: לֹא
  chosen: not
  lexicon: HALOT
  rationale: Standard negation.
- source_word: אֶחְבֹּל
  chosen: I will not do wrong
  alternatives:
  - I will not act corruptly
  - I will not do wrong
  - I will not destroy
  lexicon: HALOT
  rationale: This gives the ethical force without adding “again.”
