id: PRO.24.5
reference: Proverbs 24:5
source:
  edition: WLC
  text: גֶּֽבֶר חָכָ֥ם בַּ/ע֑וֹז וְ/אִֽישׁ דַּ֝֗עַת מְאַמֶּץ כֹּֽחַ־־־׃
translation:
  text: A wise man is strong[a], and a man of knowledge increases strength[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew is compact, literally, “A wise man in strength.” In this clause, Greek and Syriac read “A wise man is better than a strong one.” This may reflect a different Hebrew reading or interpretation; which Hebrew wording came first remains uncertain. POB provisionally retains the Masoretic text.
    reason: textual_variant
  - marker: b
    text: Or “makes power strong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  chosen: man
  alternatives:
  - strong man
  - mighty man
  lexicon: HALOT
  rationale: Although גבר can emphasize a strong or vigorous male, here the following adjective חכם defines the figure by wisdom rather than physical prowess. 'Man' preserves the masculine singular form and representative proverb style without overloading the noun with 'strong' before the contrastive point is made by בעוז.
- source_word: חָכָם
  chosen: wise
  alternatives:
  - skillful
  lexicon: HALOT
  rationale: In Proverbs, חכם regularly denotes wisdom in the moral-practical sense. 'Wise' is the standard and contextually appropriate rendering.
- source_word: בַּעֹז
  chosen: is strong
  alternatives:
  - in strength
  - with strength
  lexicon: HALOT
  rationale: The preposition ב plus עז is compressed idiomatically. A wooden rendering 'in strength' is possible, but English reads more naturally with the predicative sense 'is strong,' which captures the proverb's assertion that wisdom confers strength.
- source_word: אִישׁ
  chosen: a man
  alternatives:
  - one
  - a person
  lexicon: HALOT
  rationale: The Hebrew is grammatically masculine and proverbial. Per translation philosophy, gender-accurate language is preferred where the source uses masculine representative forms.
- source_word: דַּעַת
  chosen: knowledge
  alternatives:
  - understanding
  lexicon: HALOT
  rationale: דעת in wisdom literature commonly refers to knowledge or discernment. 'Knowledge' is the most direct and consistent gloss here.
- source_word: מְאַמֶּץ
  chosen: increases
  alternatives:
  - increases
  - makes firm
  lexicon: HALOT
  rationale: In context the causative participle denotes augmenting or making strong; “increases” is idiomatic with “strength.”
- source_word: כֹּחַ
  chosen: strength
  alternatives:
  - strength
  - might
  lexicon: HALOT
  rationale: Directly renders personal or practical strength/capacity and avoids an unexpressed possessive.
