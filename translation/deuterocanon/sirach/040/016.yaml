translation:
  text: Like brushwood among streamside plantings, they perish with every rain[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew wording, including the plant term rendered “brushwood,” is uncertain; the Greek instead describes reeds beside water or a riverbank being uprooted before other grass.
    reason: textual_variant
lexical_decisions:
- source_word: כקרדמות
  chosen: like brushwood
  alternatives:
  - like thistles
  - like undergrowth
  - like cut brush
  lexicon: HALOT
  rationale: The Hebrew term is rare/uncertain in this form. The Greek parallel depicts vegetation that is quickly uprooted before other grass, suggesting low, expendable growth rather than a cultivated plant. 'Brushwood' preserves the image of scrub growth without overclaiming a precise botanical identification.
- source_word: על מטעי נחל
  chosen: on a streamside planting
  alternatives:
  - by plantings of a wadi
  - upon a riverbank plantation
  - beside a brook planting
  lexicon: HALOT
  rationale: מטעי is 'plantings/plantation' and נחל is a streambed/wadi. The phrase likely evokes vegetation growing along a watercourse. 'Streamside planting' is natural English while retaining the agricultural image.
- source_word: מפני כל מטר
  chosen: before every rain
  alternatives:
  - at the face of every rain
  - before any rainfall
  - in the face of every shower
  lexicon: HALOT
  rationale: מפני commonly means 'before' or 'because of/in the face of.' In context of fragile vegetation, the sense is that each rain causes its collapse or disappearance. 'Before every rain' follows the Hebrew closely and matches the Greek sense of being removed quickly.
- source_word: נדעכו
  chosen: are withered away
  alternatives:
  - are extinguished
  - fade away
  - are blotted out
  lexicon: HALOT
  rationale: The verb commonly carries the sense of dying down, being quenched, or fading out. For vegetation imagery, 'withered away' fits the metaphor better than 'extinguished,' while still conveying disappearance under adverse conditions.
