  text: ὅτι ἡ δούλη σου θεοσεβής ἐστιν, καὶ θεραπεύουσα νυκτὸς καὶ ἡμέρας τὸν θεὸν τοῦ οὐρανοῦ· καὶ νῦν μενῶ παρὰ σοί, κύριε μου, καὶ ἐξελεύσεται ἡ δούλη σου κατὰ νύκτα εἰς τὴν φάραγγα καὶ προσεύξομαι πρὸς τὸν θεόν, καὶ ἐρεῖ μοι πότε ἐποίησαν τὸ ἁμάρτημα αὐτῶν.
  language: Greek
