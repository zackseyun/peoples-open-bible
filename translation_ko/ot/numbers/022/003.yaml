    reason: lexical_alternative
  revision_rationale: 두 히브리어 동사의 차이를 보존하기 위해 첫 반절은 ‘두려워하였습니다’로, 둘째 반절은 공포에 찬 반감과 괴로움을 포괄하는 ‘몹시 괴로워하였습니다’로 옮겼습니다. 또한 현대 표준어 합쇼체에 맞추어 종결과 문장 연결을 정리했습니다.
