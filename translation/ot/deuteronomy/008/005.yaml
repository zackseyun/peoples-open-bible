id: DEU.8.5
reference: Deuteronomy 8:5
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֖ עִם לְבָבֶ֑/ךָ כִּ֗י כַּ/אֲשֶׁ֨ר יְיַסֵּ֥ר אִישׁ֙ אֶת בְּנ֔/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מְיַסְּרֶֽ/ךָּ־־׃
translation:
  text: So know in your heart that Yahweh your God disciplines you just as a father disciplines his son.
  philosophy: dynamic
lexical_decisions:
- source_word: וְיָדַעְתָּ
  chosen: So know
  alternatives:
  - And you shall know
  - And know
  lexicon: HALOT
  rationale: Qal perfect 2ms with prefixed conjunction functions here as an exhortatory/resultative statement flowing from the preceding context. 'So know' gives natural English while preserving the imperative-like force better than a flat past tense.
- source_word: עִם לְבָבֶךָ
  chosen: in your heart
  alternatives:
  - with your heart
  - within your heart
  lexicon: HALOT
  rationale: The idiom denotes inward recognition or acknowledgment. English normally expresses this as 'in your heart' rather than the more wooden 'with your heart.'
- source_word: כִּי
  chosen: that
  alternatives:
  - for
  - because
  lexicon: HALOT
  rationale: Introduces the content of what is to be known rather than a causal clause in English, so 'that' is the clearest rendering.
- source_word: כַּאֲשֶׁר
  chosen: just as
  alternatives:
  - as
  - according as
  lexicon: HALOT
  rationale: Marks a comparison between human paternal discipline and the LORD's discipline; 'just as' makes the comparison explicit and natural.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  chosen: disciplines
  alternatives:
  - chastens
  - corrects
  - trains
  lexicon: HALOT
  rationale: The root יסר can denote correction, instruction, or chastening. 'Disciplines' best preserves the dual sense of corrective training without narrowing it to punitive chastisement alone. Using the same English gloss for both occurrences preserves the Hebrew repetition.
- source_word: אִישׁ
  chosen: a man
  alternatives:
  - someone
  - a father
  lexicon: HALOT
  rationale: The Hebrew explicitly says 'a man,' not 'a father,' though the paternal relationship is supplied by 'his son.' Per gender-accurate policy, the masculine form is retained rather than neutralized.
- source_word: בְּנוֹ
  chosen: his son
  alternatives:
  - his child
  lexicon: HALOT
  rationale: The noun is specifically 'son,' not the more general 'child.' Retaining 'son' matches the source and preserves the father-son comparison.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives: []
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: אֱלֹהֶיךָ
  chosen: your God
  lexicon: HALOT
  rationale: Standard covenantal designation in construct with the divine name; 'the LORD your God' is the natural and accurate English rendering.
