base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/058.yaml
  text: And I said[a], “O Lord, ruler, what is more abundant is of less value[b], for what is rarer is more precious.”
  footnotes:
  - marker: a
    text: Or 'O Lord who rules'.
    reason: previous_rendering
  - marker: b
    text: Or 'cheaper'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 제가 말했습니다. “오 주님, 통치자이신 분이여,[a] 더 많이 있는 것은 더 가치가 낮고,[b] 더 드문 것은 더 귀합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 dominator domine는 ‘통치자’와 ‘주님’이라는 두 호칭으로 이루어져 있습니다.
    reason: source_note
  - marker: b
    text: vilius는 상업적 의미의 ‘더 싸다’보다 ‘가치가 더 낮다’ 또는 ‘덜 값지다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: dominator domine
  english_pob_choice: O Lord, ruler
  chosen_korean: 오 주님, 통치자님
  alternatives_korean:
  - 오 주님, 다스리시는 분
  - 오 주님, 통치자이신 분
  lexicon: dominator / domine
  rationale: 라틴어의 이중 호칭을 두 개의 호격으로 살려, 단순 설명절보다 직접적이고 예전적인 주소를 유지했습니다.
- source_word: abundat
  english_pob_choice: what is more abundant
  chosen_korean: 더 많이 있는 것은
  alternatives_korean:
  - 더 풍부한 것은
  - 더 많은 것은
  lexicon: abundare
  rationale: 양의 많음을 말하는 비교 구조를 한국어에서 자연스럽게 옮기되, 추상적 가치판단과 섞이지 않도록 했습니다.
- source_word: vilius
  english_pob_choice: of less value
  chosen_korean: 덜 값지고
  alternatives_korean:
  - 더 값어치가 없고
  - 더 싸고
  lexicon: vilis
  rationale: POB의 수정 취지대로 상업적 ‘싼’ 뉘앙스보다 일반적 가치 하락을 드러내는 표현을 택했습니다.
- source_word: pretiosius
  english_pob_choice: more precious
  chosen_korean: 더 귀합니다
  alternatives_korean:
  - 더 값집니다
  - 더 소중합니다
  lexicon: pretiosus
  rationale: 대조되는 후반부는 단순 가격보다 존귀함의 대비가 강하므로 ‘귀하다’로 마무리했습니다.
theological_decisions:
- issue: 호칭의 격식과 직역성
  chosen_reading: ‘오 주님, 통치자님’으로 두 호칭을 병렬로 살려, 기도체의 존중과 통치권 강조를 함께 드러냈습니다.
  alternative_readings:
  - ‘오 주님, 다스리시는 분’
  - ‘오 주권자 주님’
  rationale: 이 절의 핵심은 하나님께 드리는 공식적 호칭이므로, 풀어쓴 관계절보다 호격 명사를 유지하는 편이 원문의 예전적 긴장을 보존합니다.
  doctrine_reference: 기도/호칭의 번역 원칙
