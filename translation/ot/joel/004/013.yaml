  text: שִׁלְח֣וּ מַגָּ֔ל כִּ֥י בָשַׁ֖ל קָצִ֑יר בֹּ֤אֽוּ רְדוּ֙ כִּֽי מָ֣לְאָה גַּ֔ת הֵשִׁ֨יקוּ֙ הַ/יְקָבִ֔ים כִּ֥י רַבָּ֖ה רָעָתָֽ/ם־׃
translation:
  text: Swing the sickle, for the harvest is ripe. Come, tread the grapes[a], for the winepress is full; the vats overflow, for their wickedness is great.
