  from: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
  to: Then I brought you into the land of the Amorites who lived east of the Jordan. They fought against you, but I gave them into your hands, and you took possession of their land. I destroyed them before you.
  rationale: I preserve the documented insistence on the force of 'destroyed' and Yahweh’s direct agency in giving Israel the land. The earlier discussions acknowledge the hostile meaning of 'fought with' and the geographic context, so those meanings now appear in the main text.
