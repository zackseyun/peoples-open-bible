  text: 'II.1. After she had spoken these words, the heavens were shut, and I was wholly trembling and
    grieving. And I said within myself, “If this sin is charged against me, how will I be able to be saved?
    Or how shall I make atonement to God for my completed sins[a][4]? Or with what words shall I ask the
    Lord, that he may be propitious to me[3]?”


    II.2. While I was considering these things and pondering them in my heart, I see before me a great
    white chair[2] made of snowy wool[6]. And an elderly woman[5] came in most radiant clothing, holding
    a book in her hands, and sat down alone and greeted me, “Hermas, greetings[1].” And I, grieving and
    weeping[b], said, “Lady, greetings.”


    II.3. And she said to me, “Why are you gloomy, Hermas—you who are patient and not given to contention[7],
    always laughing? Why are you so downcast in appearance and not cheerful?” And I said to her, “Because
    of a most excellent woman, who said that I sinned against her[c].”


    II.4. But she said, “By no means does this matter apply to the servant of God[d]. Yet surely a thought
    concerning her rose up in your heart[e]. For such an intention brings sin upon the servants of God.
    For it is an evil and startling intention for a most reverent spirit[8], and one already proven, if
    it should desire an evil deed—especially Hermas, the self-controlled one, who abstains from every
    evil desire and is full of all simplicity and great innocence[f].”'
