  source_fidelity: ‘자기 곁의 부하들’은 τοῖς περὶ αὐτὸν ἀνδράσιν(그와 함께 있던 사람들/부하들에게)의 가능한 문맥적 해석이지만, 이 절 자체에는 위계 관계가 명시되지 않았습니다. 또한 γεγονυῖαν은 ‘자행된’보다 ‘일어난/벌어진’에 가까우므로 행위 주체를 불필요하게 확정하지 않는 편이 원문에 더 충실합니다.
  naturalness: ‘유다가 … 알게 되자, … 명령한 뒤’는 자연스러운 한국어이며, 절이 다음 구절로 이어지는 미완결 문장임을 쉼표로 적절히 보존합니다.
  terminology: ‘동족’은 ὁμοεθνεῖς를 정확하고 현대적으로 옮깁니다. ‘잔혹한 일’은 ὠμότης의 구체적 사건 지시를 자연스럽게 살립니다.
