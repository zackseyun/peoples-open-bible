id: JOB.13.17
reference: Job 13:17
source:
  edition: WLC
  text: שִׁמְע֣וּ שָׁ֭מוֹעַ מִלָּתִ֑/י וְ֝/אַֽחֲוָתִ֗/י בְּ/אָזְנֵי/כֶֽם׃
translation:
  text: Listen carefully to my words, and let my declaration reach your ears.
  philosophy: dynamic
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  chosen: Listen carefully
  alternatives:
  - Hear, hearing
  - Surely hear
  - Listen intently
  lexicon: HALOT
  rationale: The finite verb plus infinitive absolute of שׁמע intensifies the command. In idiomatic English, 'listen carefully' or 'listen intently' best conveys the emphatic force without wooden repetition. 'Hear, hearing' is too literal for natural English.
- source_word: מִלָּתִי
  chosen: my words
  alternatives:
  - my speech
  - what I say
  lexicon: HALOT
  rationale: Although morphologically singular, the noun here denotes Job’s speech; “my words” is idiomatic English and avoids suggesting one isolated word.
- source_word: וַאֲחֲוָתִי
  chosen: my declaration
  alternatives:
  - my utterance
  - my explanation
  - what I declare
  lexicon: HALOT
  rationale: “Declaration” preserves the broad sense of what Job sets forth; “explanation” would narrow the expression unnecessarily.
- source_word: בְּאָזְנֵיכֶם
  chosen: reach your ears
  alternatives:
  - to your ears
  - in your hearing
  lexicon: HALOT
  rationale: This naturally renders the verbless Hebrew continuation while retaining its concrete reference to the hearers’ ears.
