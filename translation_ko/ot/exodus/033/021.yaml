  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה הִנֵּ֥ה מָק֖וֹם אִתִּ֑/י וְ/נִצַּבְתָּ֖ עַל הַ/צּֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/021.yaml
  text: And the LORD said, “Look, there is a place by me, and you shall stand on the rock.”
translation:
  language: ko
  text: 야훼께서 말씀하셨습니다. “보십시오, 내 곁에 한 곳이 있습니다. 그 바위 위에 서십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: יהוה
  rationale: 원문 고유명사 יהוה를 음역해 POB 기본어인 야훼를 유지하고, 영어 POB의 LORD는 관용적 대체 표기이므로 한국어에서도 신명 자체를 드러냈습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 여기 보십시오
  lexicon: הנה
  rationale: 감탄적 주의를 환기하는 히브리어 הנה를 직설적 명령형 ‘보라’로 옮겨, 영어 POB의 Look이 가진 즉시성 있는 주목 요청을 살렸습니다.
- source_word: מָקוֹם אִתִּי
  english_pob_choice: there is a place by me
  chosen_korean: 내 곁에 한 곳이 있으니
  alternatives_korean:
  - 내 옆에 자리가 있으니
  - 나와 함께 있는 장소가 있으니
  lexicon: מקום
  rationale: מָקוֹם을 추상적 ‘장소’보다 관계적 위치감이 드러나는 ‘한 곳’으로, אִתִּי를 ‘내 곁에’로 옮겨 친밀한 동반 위치를 반영했습니다.
- source_word: וְנִצַּבְתָּ עַל הַצּוּר
  english_pob_choice: and you shall stand on the rock
  chosen_korean: 너는 그 바위 위에 서 있어라
  alternatives_korean:
  - 너는 그 반석 위에 서 있어라
  - 너는 바위 위에 서야 한다
  lexicon: צור
  rationale: צור를 문맥상 단일한 지정 대상의 ‘그 바위’로 옮기고, 명령/예언적 지시를 현대 한국어의 자연스러운 지속 명령 ‘서 있어라’로 표현했습니다.
theological_decisions:
- issue: 야훼의 자기현현 자리와 보호의 의미
  chosen_reading: ‘내 곁에 한 곳’은 단순한 지리 정보가 아니라, 야훼의 임재 가까이에서 모세가 안전하게 서게 하시는 장면으로 읽었습니다.
  alternative_readings:
  - 중립적 장소 안내로만 읽기
  - 의미를 약화시켜 단순한 위치 설명으로 처리하기
  rationale: 문맥상 앞뒤 절에서 하나님의 영광과 보호가 이어지므로, מקום אִתִּי를 관계적·신학적 공간으로 살리는 것이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: 출애굽기 33:19-23 문맥상 하나님의 임재와 보호
