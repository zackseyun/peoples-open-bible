  text: ὁ δὲ ἕτερος Κἀγώ, φησίν, δυνάστης ἐπὶ τῆς γῆς, ὁ προστατάσσων αἴρειν τὰ ὅπλα καὶ τὰς βασιλικὰς χρείας ἐπιτελεῖν. ὅμως οὐ κατέσχεν ἐπιτελέσαι τὸ σχέτλιον αὐτοῦ βούλημα.
