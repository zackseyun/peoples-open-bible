id: PSA.134.2
reference: Psalms 134:2
source:
  edition: WLC
  text: שְׂאֽוּ יְדֵ/כֶ֥ם קֹ֑דֶשׁ וּ֝/בָרֲכוּ אֶת יְהוָֽה־־׃
translation:
  text: Lift up your hands toward the sanctuary[a] and bless Yahweh.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “in the sanctuary” or “in holiness.”
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאוּ
  chosen: Lift up
  alternatives:
  - Raise
  lexicon: HALOT
  rationale: Imperative masculine plural of נשׂא, here calling the worshipers to an intentional physical action. 'Lift up' is idiomatic and preserves the concrete sense better than a more interpretive rendering.
- source_word: יְדֵיכֶם
  chosen: your hands
  lexicon: HALOT
  rationale: Direct object of the imperative; the plural 'hands' is literal and natural in English.
- source_word: קֹדֶשׁ
  chosen: toward the sanctuary
  alternatives:
  - toward the sanctuary
  - in the sanctuary
  - holy hands
  - in holiness
  lexicon: HALOT
  rationale: In the context of worshipers standing in Yahweh's house, the noun denotes the holy place. The preposition or direction is supplied from the lifting of hands.
- source_word: וּבָרֲכוּ
  chosen: and bless
  alternatives:
  - and praise
  lexicon: HALOT
  rationale: Imperative plural of ברך in a doxological context. 'Bless' is the standard and theologically weighty rendering for speech directed toward God; 'praise' is interpretive and narrower.
- source_word: אֶת
  chosen: '[object marker, untranslated]'
  lexicon: HALOT
  rationale: Hebrew direct-object marker has no direct English equivalent and is therefore not represented in the translation.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
