  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 γνήσιον은 명사화된 중성 형용사이므로 ‘아무런 진실한 것을’보다 ‘진실한 것은 아무것도’가 한국어에서 더 자연스럽고 원문의 부정 범위를 명료하게 보존합니다. ὡς μονώτατοι τῶν ἐθνῶν의 강조도 ‘모든 민족 가운데서 유일하게’로 분명히 드러낼 수 있습니다.
  naturalness: 초안의 ‘적의를 드러내 보이면서, 그들은’은 분사절 뒤에 주어를 거듭 제시하여 다소 늘어집니다. 주절과 연결해 ‘적의를 분명히 드러내며’로 처리하면 현대 표준 한국어 합쇼체에서 더 매끄럽습니다. ‘아무런 진실한 것을 내놓다’도 어색하므로 어순을 조정하는 것이 좋습니다.
  terminology: ‘적의’, ‘왕들’, ‘은인들’, ‘거만하게 굴다’는 적절합니다. γνήσιον은 여기서 물질적 ‘진품’으로 한정하지 않고 ‘진실한 것’으로 보존하는 것이 영어 감사 기록의 ‘sincere’ 및 본문의 넓은 표현과 잘 맞습니다.
