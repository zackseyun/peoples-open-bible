translation:
  language: en
  text: True reorientation[r1]—the kind God desires—drives away darkness.[a] It brings light to the eyes, gives knowledge to the soul, and leads the mind toward salvation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek edition marks “removes ignorance and” as uncertain before “drives away darkness.”
    reason: textual_variant
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
