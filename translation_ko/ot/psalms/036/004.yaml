- from: 그의 입의 말들은 악함과 속임수이며, 그는 지혜롭게 행하는 일과 선을 행하는 일을 그쳤습니다.
  to: 그는 침상에서 악을 꾀하고, 좋지 않은 길에 굳게 서며, 악을 버리지 않습니다.
  rationale: 히브리어 원문을 기준으로 세 절을 모두 반영했습니다. ‘침상에서’는 עַל מִשְׁכָּבוֹ, ‘악을 꾀하고’는 אָוֶן יַחְשֹׁב, ‘좋지 않은 길에 굳게 서며’는 reflexive 형태인 יִתְיַצֵּב עַל דֶּרֶךְ לֹא טוֹב, ‘악을 버리지 않습니다’는 רָע לֹא יִמְאָס에 대응합니다. 영어 감사 기록의 의미 범위와도 일치합니다. 영어 주석은 번역 대안에 관한 것이며, 한국어 본문에 별도 주석이 반드시 필요한 본문상 불확실성은 없습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:07:49Z'
