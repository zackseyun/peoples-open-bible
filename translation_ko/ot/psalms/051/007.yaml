  text: הֵן בְּ/עָו֥וֹן חוֹלָ֑לְתִּי וּ֝/בְ/חֵ֗טְא יֶֽחֱמַ֥תְ/נִי אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/007.yaml
  text: Behold[a], you desire truth in the inward parts, and in the hidden place you make wisdom known to me.
  footnotes:
  - marker: a
    text: Or 'Surely' or 'Indeed' for the opening particle.
    reason: lexical_alternative
  - marker: b
    text: Or 'I was born' for 'I was brought forth.'
    reason: lexical_alternative
  - marker: c
    text: This verse is often understood either as confessing sinfulness from conception or as poetic hyperbole in penitence; the Hebrew itself does not fully resolve the debate.
    reason: alternative_reading
translation:
  language: ko
  text: 참으로[a] 주께서는 내면[b]의 진실을 원하시며, 감추어진 곳에서 제게 지혜를 알게 하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「참으로」는 히브리어 הֵן의 강조를 옮긴 것입니다. 문맥에 따라 「보십시오」 또는 「과연」으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 내면을 가리키는 시적 표현들은 「속사람」 또는 「은밀한 곳」으로도 옮길 수 있습니다. 두 표현의 정확한 구분은 확정하기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 참으로
  - 과연
  lexicon: HALOT
  rationale: 강조하는 감탄/주의 환기 표지로서, 한국어에서는 문맥상 자연스럽고 합쇼체와도 맞는 「보십시오」가 원문의 엄숙한 호소를 잘 살립니다.
- source_word: בְּעָוֹן
  english_pob_choice: in iniquity
  chosen_korean: 죄악 가운데서
  alternatives_korean:
  - 죄 가운데서
