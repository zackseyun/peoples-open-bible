translation:
  text: And they began to sin against the birds, the wild animals, the creatures that
    move, and the fish; they devoured one another’s flesh and drank blood.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Charles 1906 brackets a final feminine “from it/her” expression; apparatus
      note 21 treats it as a doublet of the connective beginning verse 6. It is therefore
      excluded from the main rendering as an editorially rejected doublet, not silently
      overlooked. The flesh and blood verbs also have manuscript form variants discussed
      in the apparatus.
    reason: textual_variant
lexical_decisions:
- source_word: የአብሱ
  chosen: sin against
  alternatives:
  - act wickedly toward
  rationale: Preserves the moral force of the verb without specifying the offense.
- source_word: ዘይትሐወሥ
  chosen: creatures that move
  alternatives:
  - creeping creatures
  - reptiles
  rationale: The expression describes movement without naming a precise class of animals.
- source_word: ሠጋሆሙ፡ በበይናቲሆሙ፡ ይትባለዑ
  chosen: they devoured one another’s flesh
  alternatives:
  - they ate their flesh among themselves
  rationale: Retains the reciprocal wording and violent eating imagery.
theological_decisions:
- issue: Nature of the sin against the animals
  chosen_reading: Leave the offense unspecified.
  alternative_readings:
  - A sexual offense
  - A violation of food laws
  rationale: The witness names sin against the animals but does not define the offense.
    The subsequent flesh-and-blood imagery is retained without imposing an interpretation.
