  - marker: b
    text: 이 말씀은 예수의 십자가 처형과 관련하여 요한복음 19:36에서 인용됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: צַדִּיק
  english_pob_choice: the righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의로운 자
  lexicon: HALOT
  rationale: 히브리어 남성 단수 형식을 한국어에서 대표적 표현으로 자연스럽게 살리되, 현대 한국어에서는 성별을 불필요하게 강조하지 않는 '의인'이 가장 정확합니다.
- source_word: רָעוֹת
  english_pob_choice: afflictions
  chosen_korean: 고난
  alternatives_korean:
  - 재앙
  - 환난
  - 악
  lexicon: HALOT
  rationale: 문맥상 의인에게 닥치는 해악이나 도덕적 '악'이 아니라 겪게 되는 어려움을 가리키므로, 의미를 왜곡하지 않는 '고난'이 적절합니다.
- source_word: יַצִּילֶנּוּ
  english_pob_choice: delivers him
  chosen_korean: 건지십니다
  alternatives_korean:
  - 구원하십니다
  - 구출하십니다
  - 살려내십니다
  lexicon: HALOT
  rationale: נצל의 기본 의미인 '건지다/구하다'를 살리면서도 문맥의 반복적 보호·구출 행위를 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사역 본문이 신명기를 포함한 전통적 대치어가 아니라 고유명사를 직접 표기하므로, 프로젝트 기본값에 따라 '야훼'를 사용합니다.
theological_decisions:
- issue: צַדִּיק의 남성 단수 형태를 한국어에서 어떻게 반영할지
  chosen_reading: 의인
  alternative_readings:
  - 의로운 사람
  - 의로운 자
  rationale: 히브리어 형태는 남성 단수이지만, 시편 문맥에서는 대표적·포괄적 의미가 강하므로 한국어에서는 성별 표지를 드러내지 않는 '의인'이 원문 의도를 가장 잘 전달합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 4
- issue: רָעוֹת의 의미를 도덕적 악이 아니라 어떤 종류의 어려움으로 볼지
  chosen_reading: 고난
  alternative_readings:
  - 악
  - 재앙
  - 환난
  rationale: 의인이 겪는 것으로 제시되므로 도덕적 악으로 번역하면 신학적 오해가 생깁니다. '고난'은 원문의 긴장과 실제적 피해를 보존합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, points 1 and 3
