  edition: WLC
  text: וְ֭/חַסְדִּ/י לֹֽא אָפִ֣יר מֵֽ/עִמּ֑/וֹ וְ/לֹֽא אֲ֝שַׁקֵּ֗ר בֶּ/אֱמוּנָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/033.yaml
  text: But I will not withdraw my steadfast love[a] from him, nor prove false to my faithfulness.[b]
  footnotes:
  - marker: a
    text: Or “my covenant love” or “my lovingkindness.”
    reason: lexical_alternative
  - marker: b
    text: Or “nor deal falsely in my faithfulness.”
