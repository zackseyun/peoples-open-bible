translation:
  text: Here their souls are kept apart in this great torment until the great day of judgment—a day of scourging and torment for those who curse forever[a], and of vengeance against their souls. There he will bind them forever, though this is from before eternity[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Greek form describes these people as “accursed forever.”
    reason: textual_variant
  - marker: b
    text: The final phrase is unclear in the Ge'ez, including what “this” refers to.
    reason: alternative_reading
