  text: Ὅσοι δὲ ἡμιξήρους ἐπέδωκαν καὶ ἐν αὐταῖς σχισμὰς εἶχον, ἄκουε καὶ περὶ αὐτῶν. ὅσων ἦσαν αἱ ῥάβδοι
    κατὰ τὸ αὐτὸ ἡμίξηροι, δίψυχοί εἰσιν· οὔτε γὰρ ζῶσιν οὔτε τεθνήκασιν. 2. οἱ δὲ ἡμιξήρους ἔχοντες καὶ
    ἐν αὐταῖς σχισμάς, οὗτοι καὶ δίψυχοι καὶ κατάλαλοί εἰσι, καὶ μηδέποτε εἰρηνεύοντες εἰς ἑαυτούς, ἀλλὰ
    διχοστατοῦντες πάντοτε. ἀλλὰ καὶ τούτοις, [φησίν,] ἐπίκειται μετάνοια. βλέπεις, [φησί,] τινὰς ἐξ αὐτῶν
    μετανενοηκότας. καὶ ἔτι, φησίν, ἐστὶν ἐν αὐτοῖς ἐλπὶς μετανοίας. 3. καὶ ὅσοι, φησίν, ἐξ αὐτῶν μετανενοήκασι,
    τὴν κατοικίαν εἰς τὸν πύργον ἔχουσιν· ὅσοι δὲ ἐξ αὐτῶν βραδύτερον μετανενοήκασιν, εἰς τὰ τείχη κατοικήσουσιν·
    ὅσοι δὲ οὐ μετανοοῦσιν, ἀλλ᾿ ἐμμένουσι ταῖς πράξεσιν αὐτῶν, θανάτῳ ἀποθανοῦνται. 4. οἱ δὲ χλωρὰς ἐπιδεδωκότες
    τὰς ῥάβδους αὐτῶν καὶ σχισμὰς ἐχούσας, πάντοτε οὗτοι πιστοὶ καὶ ἀγαθοὶ ἐγένοντο, ἔχοντες [δὲ] ζῆλόν
    τινα ἐν ἀλλήλοις περὶ πρωτείων καὶ περὶ δόξης τινός· ἀλλὰ πάντες οὗτοι μωροί εἰσιν, ἐν ἀλλήλοις ἔχοντες
    περὶ πρωτείων. 5. ἀλλὰ καὶ οὗτοι ἀκούσαντες τῶν ἐντολῶν μου, ἀγαθοὶ ὄντες, ἐκαθάρισαν ἑαυτοὺς καὶ
    μετενόησαν ταχύ. ἐγένετο οὖν ἡ κατοίκησις αὐτῶν εἰς τὸν πύργον. ἐὰν δέ τις πάλιν ἐπιστρέψῃ εἰς τὴν
    διχοστασίαν, ἐκβληθήσεται ἀπὸ τοῦ πύργου, καὶ ἀπολέσει τὴν ζωὴν αὐτοῦ. 6. ἡ ζωὴ πάντων ἐστὶ τῶν τὰς
    ἐντολὰς τοῦ Κυρίου φυλασσόντων· ἐν ταῖς ἐντολαῖς δὲ περὶ πρωτείων ἢ περὶ δόξης τινὸς οὐκ ἔστιν, ἀλλὰ
    περὶ μακροθυμίας καὶ περὶ ταπεινοφρονήσεως ἀνδρός. ἐν τοῖς τοιούτοις οὖν ἡ ζωὴ τοῦ Κυρίου, ἐν τοῖς
    διχοστάταις δὲ καὶ παρανόμοις θάνατος.
