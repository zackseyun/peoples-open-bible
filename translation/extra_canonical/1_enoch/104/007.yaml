translation:
  text: Because you sinners say, “You are not called to account, and all our sins are not written down”—all your
    sins are being written down every day.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected Ge’ez shifts from addressing “you sinners” to the second-person “you are not called to account,”
      then to “our sins” inside the saying, and back to “your sins.” These person shifts are retained rather than
      silently replacing the second person with “we.” The following assertion contradicts the sinners’ denial.
