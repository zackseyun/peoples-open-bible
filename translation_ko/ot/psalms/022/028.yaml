revisions:
- from: 땅의 끝마다 있는 모든 이가 기억하고 야훼께 돌아올 것이며, 모든 민족의 족속들이 당신 앞에 엎드려 경배할 것입니다.[a][b]
  to: 왕권[b]은 야훼께[a] 속해 있으며, 야훼께서는 민족들을 다스리시기 때문입니다.
  rationale: 대상 절의 원문과 다른 절을 번역한 초안을, 원문 순서와 의미에 맞추어 전면 교정했습니다. כִּי는 앞 절의 예배·찬양에 대한 근거를 제시하므로 문장 끝의 ‘때문입니다’로 옮겼습니다. הַמְּלוּכָה는 본문에서는 ‘왕권’으로 번역하되 가능한 의미 범위는 각주에 보존했습니다. וּמֹשֵׁל은 야훼를 가리키는 분사이므로 한국어 문장에서는 주어를 명시하여 자연스럽게 표현했습니다.
