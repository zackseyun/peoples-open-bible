review_pass:
  verdict: revise
  source_fidelity: 초안은 시편 59:10의 히브리어 본문과 전혀 다른 구절(‘나의 힘이여… 내가 기다리겠습니다… 나의 요새’)을 번역하고 있습니다. WLC 본문은 ‘그의 헤세드의 하나님께서 나보다 앞서 가실 것이다; 하나님께서 내가 내 원수들을 보게 하실 것이다’라는 내용입니다. 수정문은 히브리어의 반복된 ‘하나님’, 3인칭 남성 단수 접미사 ‘그의’, 피엘 קדם, 히필 ראה를 반영합니다.
  naturalness: ‘그의 한결같은 사랑의 하나님’은 한국어에서 다소 낯설지만, 마소라 본문의 구성 관계와 3인칭 접미사를 보존하는 데 필요한 표현입니다. 나머지는 현대 표준어 합쇼체로 자연스럽게 다듬었습니다.
  terminology: חֶסֶד는 문맥상 ‘한결같은 사랑’으로 옮겼습니다. 이는 충성스럽고 지속적인 사랑의 뜻을 담되 본문에 특정 교리적 해석을 더하지 않습니다. מְשֹׁרְרַי는 ‘내 원수들’로 옮겼습니다.
  issues:
