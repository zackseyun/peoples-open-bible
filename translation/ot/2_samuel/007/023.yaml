  meaning: Israel is unique because God redeemed it as his own people and displayed his greatness by overcoming nations and their gods.
  meaning_decisions:
  - source_phrase: וּמִי כְעַמְּךָ כְּיִשְׂרָאֵל גּוֹי אֶחָד בָּאָרֶץ
    prior_rendering: And who is like your people, like Israel, the one nation on the earth
    new_rendering: And who is like your people Israel? They are the one nation on earth
    rationale: The repeated comparison identifies Israel emphatically rather than comparing God's people with a separate Israel; the split makes that identification clear.
  - source_phrase: וְלַעֲשׂוֹת לָכֶם
    prior_rendering: and to do for you
    new_rendering: and to do … for them
    rationale: The Hebrew plural beneficiary is Israel, not God. Third-person English preserves that beneficiary without leaving an unexplained shift of address.
  - source_phrase: לְאַרְצְךָ מִפְּנֵי עַמְּךָ … מִמִּצְרַיִם גּוֹיִם וֵאלֹהָיו
    prior_rendering: for your land before your people, whom you redeemed for yourself from Egypt, from nations and their gods
    new_rendering: for your land by driving out nations and their gods before your people, whom you redeemed for yourself from Egypt
    rationale: The recorded lexical interpretation connects the nations and gods with displacement before Israel. Making the implied action explicit conveys that reading coherently; the serious alternative is noted.
  footnote_kinds:
    a: literal_wording
    b: alternative_meaning
  history_weighed: The policy correction rightly observed that לָכֶם is present; I preserve its benefit to Israel as “for them” and note the literal address. The recorded interpretation of the closing words as displaced nations becomes explicit, with the competing exodus reading retained in a note.
