  from: And Judas sent men to spy out the camp[a], and they reported to him, saying, “All the nations around you have gathered together against them—a very great force.”
  to: Judas sent scouts to investigate the camp. They reported to him, “All the nations around you have joined them—a very large force.
  rationale: The earlier rationale preserved the pronoun but treated πρὸς as necessarily hostile, creating a coalition opposed to the wrong party. I retain 'them' while correcting the relationship in light of Timothy's mustering and the hired assistance described next.
