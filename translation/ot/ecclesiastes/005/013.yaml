  from: And that wealth was lost in a bad venture[b][a], and he fathered a son and had nothing in his hand.
  to: And that wealth was lost through a harmful affair[a], and he fathered a son but had nothing in his hand.[b]
  rationale: The proposed correction rightly removes the undue commercial specificity of “venture” and correctly relocates both notes. But “a bad turn of events” recasts עִנְיָן, an affair, matter, or undertaking, as an externally occurring sequence of events. “Through a harmful affair” retains the source noun’s breadth and the causal force in natural English.
