  source_fidelity: 현 초안은 시편 47:3(히브리어 본문 기준)의 정복 언어를 번역하고 있어, 제시된 원문인 시편 47:4(יִבְחַר לָנוּ אֶת־נַחֲלָתֵנוּ...)와 전혀 일치하지 않습니다. 따라서 본문 전체를 47:4에 맞게 교체해야 합니다. 개정문은 불완료형 יִבְחַר의 현재적 용법을 ‘택하십니다’로, נַחֲלָתֵנוּ를 ‘우리의 유산’으로, גְּאוֹן יַעֲקֹב을 긍정적 의미의 ‘야곱의 자랑’으로 옮기며, 관계절의 가능한 다른 수식 관계는 각주로 보존합니다.
