      a staff in his hand, he struck each of the stones built into it.” The count
      is a narrative detail, without an added numerical interpretation; no fresh photograph
      letter-level certification is claimed.'
  - marker: c
    reason: textual_variant
    text: The builders’ question and the nearby-field command are two bar-marked supplements
