id: PSA.40.12
reference: Psalms 40:12
source:
  edition: WLC
  text: כִּ֤י אָפְפ֥וּ עָלַ֨/י רָע֡וֹת עַד אֵ֬ין מִסְפָּ֗ר הִשִּׂיג֣וּ/נִי עֲ֭וֺנֹתַ/י וְ/לֹא יָכֹ֣לְתִּי לִ/רְא֑וֹת עָצְמ֥וּ מִ/שַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗/י וְ/לִבִּ֥/י עֲזָבָֽ/נִי־׀־־׃
translation:
  text: For troubles beyond number have surrounded me; my iniquities have overtaken me, so that I cannot see. They are more numerous than the hairs of my head, and my heart fails me.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  - Indeed
  lexicon: HALOT
  rationale: Introduces the reason or grounds for the plea in the surrounding context. 'For' preserves the explanatory force in natural English.
- source_word: אָפְפוּ עָלַי
  chosen: have surrounded me
  alternatives:
  - have encompassed me
  - have encircled me
  lexicon: HALOT
  rationale: The verb conveys being enclosed or hemmed in. 'Have surrounded me' is clear modern English and preserves the image of being beset on all sides.
- source_word: רָעוֹת
  chosen: troubles
  alternatives:
  - troubles
  - calamities
  - disasters
  lexicon: HALOT
  rationale: The surrounding adversities are calamities/troubles rather than moral evils.
- source_word: עַד אֵין מִסְפָּר
  chosen: beyond number
  alternatives:
  - without number
  - too many to count
  lexicon: HALOT
  rationale: This idiom expresses innumerability. 'Beyond number' is concise and literary while remaining accessible.
- source_word: הִשִּׂיגוּנִי
  chosen: have overtaken me
  alternatives:
  - have caught up with me
  - have reached me
  lexicon: HALOT
  rationale: The verb often means to reach, overtake, or catch up with. 'Have overtaken me' preserves both the pursuit imagery and the sense of being overcome.
- source_word: עֲוֹנֹתַי
  chosen: my iniquities
  alternatives:
  - my sins
  - my guilt
  lexicon: HALOT
  rationale: עָוֹן can denote iniquity, guilt, or guilt-bearing wrongdoing. 'My iniquities' keeps the moral weight and avoids flattening the term to a generic 'troubles'; it also fits the psalm's confession-like turn.
- source_word: וְלֹא יָכֹלְתִּי לִרְאוֹת
  chosen: so that I cannot see
  alternatives:
  - and I cannot see
  - so that I cannot see
  lexicon: HALOT
  rationale: The clause naturally states the overwhelming result of the iniquities overtaking him.
- source_word: עָצְמוּ
  chosen: are more numerous than
  alternatives:
  - They have become more numerous than
  - They are mighty beyond
  lexicon: HALOT
  rationale: With the comparison to the hairs of his head, numerical abundance is the relevant sense.
- source_word: מִשַּׂעֲרוֹת רֹאשִׁי
  chosen: the hairs of my head
  alternatives:
  - the hair of my head
  lexicon: HALOT
  rationale: A standard Hebrew comparison for innumerability. The plural 'hairs' is idiomatic in English.
- source_word: לִבִּי עֲזָבָנִי
  chosen: my heart fails me
  alternatives:
  - my heart has forsaken me
  - my courage fails me
  lexicon: HALOT
  rationale: Literally 'my heart has left/forsaken me,' an idiom for loss of strength or courage. 'My heart fails me' preserves the metaphor in idiomatic English without over-interpreting it as merely emotional courage.
