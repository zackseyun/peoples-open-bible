  text: ⸢Δήλωσόν μοι⸣, φημί, κύριε, τῶν παρθένων ⸢τὰ⸣ ὀνόματα | καὶ τῶν γυναικῶν τῶν τὰ μέλανα ἱμάτια
    ἐνδεδυμένων. Ἄκουε, φησίν, τῶν παρθένων τὰ ὀνόματα | τῶν ἰσχυροτέρων, τῶν εἰς τὰς γωνίας σταθεισῶν.
    2. ἡ μὲν πρώτη Πίστις, ἡ δὲ δευτέρα Ἐγκράτεια, ἡ δὲ ⸢τρίτη⸣ Δύναμις, ἡ δὲ ⸢τετάρτη⸣ Μακροθυμία· αἱ
    δὲ ἕτεραι ἀνὰ μέσον τούτων σταθεῖσαι ταῦτα ἔχουσι τὰ ὀνόματα· Ἁπλότης, Ἀκακία, Ἁγνεία, Ἱλαρότης, Ἀλήθεια,
    Σύνεσις, Ὁμόνοια, Ἀγάπη. ταῦτα τὰ ὀνόματα ὁ φορῶν καὶ τὸ ὄνομα τοῦ υἱοῦ τοῦ Θεοῦ δυνήσεται εἰς τὴν
    βασιλείαν τοῦ Θεοῦ εἰσελθεῖν. 3. ἄκουε, φησί, καὶ τὰ ὀνόματα τῶν γυναικῶν τῶν τὰ ἱμάτια μέλανα ἐχουσῶν.
    καὶ ἐκ τούτων τέσσαρές εἰσι δυνατώτεραι· ἡ πρώτη Ἀπιστία, ἡ δευτέρα Ἀκρασία, ἡ δὲ τρίτη Ἀπείθεια,
    ἡ δὲ τετάρτη Ἀπάτη. αἱ δὲ ἀκόλουθοι αὐτῶν καλοῦνται Λύπη, Πονηρία, Ἀσέλγεια, Ὀξυχολία, Ψεῦδος, Ἀφροσύνη,
    Καταλαλία, Μῖσος. ταῦτα τὰ ὀνόματα ὁ φορῶν τοῦ Θεοῦ δοῦλος τὴν βασιλείαν μὲν ὄψεται τοῦ Θεοῦ, εἰς
    αὐτὴν δὲ οὐκ εἰσελεύσεται. 4. Οἱ λίθοι δέ, φημί, κύριε, οἱ ἐκ τοῦ βυθοῦ ἡρμοσμένοι εἰς τὴν οἰκοδομὴν
    τίνες εἰσίν; Οἱ μὲν πρῶτοι, φησίν, οἱ δέκα οἱ εἰς τὰ θεμέλια τεθειμένοι, πρώτη γενεά· οἱ δὲ εἴκοσι
    πέντε δευτέρα γενεὰ ἀνδρῶν δικαίων· οἱ δὲ τριάκοντα πέντε προφῆται τοῦ Θεοῦ καὶ διάκονοι αὐτοῦ· οἱ
    δὲ τεσσαράκοντα ἀπόστολοι καὶ διδάσκαλοι τοῦ κηρύγματος τοῦ υἱοῦ τοῦ Θεοῦ. 5. Διατί οὖν, φημί, κύριε,
    αἱ παρθένοι καὶ τούτους τοὺς λίθους ἐπέδωκαν εἰς τὴν οἰκοδομὴν τοῦ πύργου, διενέγκασαι διὰ τῆς πύλης;
    6. Οὗτοι γάρ, φησί, πρῶτοι ταῦτα τὰ πνεύματα ἐφόρεσαν, καὶ ὅλως ἀπ᾿ ἀλλήλων οὐκ ἀπέστησαν, οὔτε τὰ
    πνεύματα ἀπὸ τῶν ἀνθρώπων, οὔτε οἱ ἄνθρωποι ἀπὸ τῶν πνευμάτων, ἀλλὰ παρέμειναν τὰ πνεύματα αὐτοῖς
    μέχρι τῆς κοιμήσεως αὐτῶν. καὶ εἰ μὴ ταῦτα τὰ πνεύματα μετ᾿ αὐτῶν ἐσχήκει⸢σαν⸣, ⸢οὐκ ἂν⸣ εὔχρηστοι
    γεγόνεισαν τῇ οἰκοδομῇ τοῦ πύργου τούτου.
