  - decrees
  - covenant stipulations
  lexicon: HALOT
  rationale: עֵדוּת/עֵדֹת denotes the solemn covenant testimony God attests. Rendered 'testimonies' consistently to distinguish it from the other seven synonyms.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: אַל תְּבִישֵׁנִי
  chosen: do not put me to shame
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The Hiphil imperative/jussive construction asks Yahweh not to cause the speaker shame.
