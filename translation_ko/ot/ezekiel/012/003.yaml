revisions:
- from: 인자야, 너는 스스로를 위해 포로의 짐을 준비하고, 낮에 그들 앞에서 포로로 끌려가듯 떠나라. 네가 있던 곳에서 다른 곳으로 그들 앞에서 옮겨질 것이다. 그들은 반역하는 집안이므로, 혹시 보게 될지 모른다.
  to: 인자야, 너는 유배 갈 짐을 마련하고, 낮에 그들이 보는 앞에서 유배 가듯이 떠나라. 그들이 보는 앞에서 네가 있는 곳에서 다른 곳으로 옮겨 가라. 그들이 반역하는 집안일지라도, 혹시 보게 될지도 모른다.
  rationale: 원문의 반복되는 ‘그들 앞에서’, 유배를 나타내는 표징 행위, 그리고 에스겔 자신에게 주어진 연속 명령을 보존했습니다. 원문에 명시되지 않은 강제 연행과 수동적 미래 진술은 제거했으며, 영어 POB 감사본이 채택한 마지막 절의 양보적 관계를 반영했습니다.
  reviewer_model: gpt-5.6-terra
