  category: meaning_retranslation
  from: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
  to: You, Ezra, must appoint magistrates and judges in accordance with the wisdom of your God that you possess[a], to judge all the people in Beyond the River[b] who know the laws of your God. You must teach those who do not know them.
  rationale: The earlier lexical discussion recognizes possession as the sense of 'in your hand' and identifies the regional administrative name. I make those meanings clearer while preserving the text's qualification concerning people who know God's laws, rather than adding an ethnic limitation not explicitly stated.
