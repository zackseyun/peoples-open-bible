  review_summary: Reading מוּסַר as literal “bonds” makes the verse depict God first freeing kings and then belting them, which poorly fits the surrounding catalogue of rulers being brought low. In construct with “kings,” the noun more plausibly denotes their restraint or authority—the power by which they impose discipline. The second colon should remain concrete; the translation must not resolve the belt image into captivity, humiliation, or readiness.
