  from: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
  to: Trust in Yahweh and do good; dwell in the land and feed on faithfulness.[a]
  rationale: “Cultivate” replaces רעה’s feeding/grazing image with an unmarked interpretive application. Although “feed on faithfulness” is deliberately unusual because the Hebrew phrase is difficult, it is intelligible English and preserves the concrete source image and ambiguity better. Moving the note marker to the disputed expression is necessary.
