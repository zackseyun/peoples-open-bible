  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתָּ֣ה מ֭וֹשֵׁל בְּ/גֵא֣וּת הַ/יָּ֑ם בְּ/שׂ֥וֹא גַ֝לָּ֗י/ו אַתָּ֥ה תְשַׁבְּחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/009.yaml
  text: You rule over the swelling of the sea[a]; when its waves rise, you still them[b].
  footnotes:
  - marker: a
    text: Or “the pride” or “the majesty of the sea.” The Hebrew term can denote exaltation or swelling; here the context favors the image of the sea’s surging.
    reason: lexical_alternative
  - marker: b
    text: Or “you calm them” or “you subdue them.”
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 바다의 솟구침을 다스리시고[a], 그 물결들이 일어날 때에 그것들을 잠잠하게 하십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바다의 위엄’ 또는 ‘바다의 교만’. 히브리어는 높아짐, 위엄, 또는 물결의 솟구침을 뜻할 수 있으며, 여기서는 바다의 거센 움직임이라는 이미지가 문맥에 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들을 가라앉히십니다’ 또는 ‘그것들을 제압하십니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유한 언약 이름 יְהוָה를 직역 관습인 ‘주’로 바꾸지 않고, POB의 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֱלֹהֵי צְבָאֹות
  english_pob_choice: God of hosts
  chosen_korean: 만군의 하나님
  alternatives_korean:
  - 하늘 군대의 하나님
  - 군대들의 하나님
  lexicon: HALOT
  rationale: צְבָאֹות는 ‘군대/만군’의 관용적 복수형이므로, 한국어 성경 문체에서 자연스럽고 의미 범위도 넓은 ‘만군의 하나님’을 택했습니다.
- source_word: חֲסִין
  english_pob_choice: mighty
  chosen_korean: 강하십니다
  alternatives_korean:
  - 힘이 있으십니다
  - 능하십니다
  - 강력하십니다
  lexicon: HALOT
  rationale: 형용사 חֲסִין의 힘/강함을 한국어에서 시적이고 존대형으로 자연스럽게 전달하기 위해 ‘강하십니다’를 선택했습니다.
- source_word: יָהּ
  english_pob_choice: O Yah
  chosen_korean: 야
  alternatives_korean:
  - 여호와
  - 야훼
  lexicon: HALOT
  rationale: 본문의 קצר형 신명 יָהּ를 יְהוָה와 구별해 보존하기 위해 ‘야’로 음역했고, 호격은 문맥상 ‘야’만으로 처리했습니다.
- source_word: וֶאֱמוּנָתְךָ סְבִיבוֹתֶיךָ
  english_pob_choice: Your faithfulness surrounds you
  chosen_korean: 주의 신실하심이 주를 둘러싸고 있습니다
  alternatives_korean:
  - 주의 신실하심이 주를 에워싸고 있습니다
  - 주의 믿음직하심이 주위를 둘러싸고 있습니다
  lexicon: HALOT
  rationale: אֱמוּנָה는 하나님께 대한 인간의 ‘믿음’보다 여기서는 하나님의 신뢰 가능성과 견고함을 뜻하므로 ‘신실하심’이 가장 적절합니다. סְבִיבוֹתֶיךָ는 ‘주를 둘러싸고 있습니다’로 이미지와 문장 흐름을 살렸습니다.
theological_decisions:
- issue: יְהוָה와 יָהּ의 구별을 한국어에서 어떻게 보존할지
  chosen_reading: 본문의 두 형식을 각각 ‘야훼’와 ‘야’로 구별해 옮겼습니다.
  alternative_readings:
  - 둘 다 ‘주님’으로 통일
  - 둘 다 ‘야훼’로 통일
  rationale: 시편은 같은 절 안에서 긴 신명과 짧은 신명형을 함께 사용하므로, 두 형태의 차이를 지워버리면 본문이 강조하는 호칭의 변주가 약해집니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
