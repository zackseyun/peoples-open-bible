  from: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
  to: But he said, “Far be it from me to do this. Only the man with whom the cup was found will be my servant[a]; the rest of you may go up in peace to your father.”
