review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the distributive force, kinship restriction, prohibition, and divine name, but it mistranslates עֶרְוָה ('nakedness') as '음란함' and uses awkwardly repetitive wording for the approach idiom.
  naturalness: '''너희 각 사람은'' is unnatural with the following plural imperative, and ''가까운 친족에게 가까이하여'' is stylistically redundant. A modern formal Korean legal formulation can preserve the Hebrew idiom more clearly.'
  terminology: '''야훼'' appropriately renders יהוה. ''자기 살붙이인 가까운 친족'' preserves the flesh/kinship imagery. ''벌거벗은 몸을 드러내다'' retains the source idiom without importing a denominational interpretation; a note explains its legal-sexual sense.'
  issues:
  - severity: high
    issue: '''음란함'' for עֶרְוָה'
    rationale: The Hebrew means 'nakedness' in the fixed idiom 'uncover nakedness'; '음란함' means obscenity/indecency and changes the lexical image and legal idiom.
  - severity: medium
    issue: Awkward distributive and approach phrasing
    rationale: '''너희 각 사람은'' does not fit smoothly with ''말라,'' and ''친족에게 가까이하여'' repeats ''가까이'' without naturally expressing the Hebrew construction.'
  revised_text: 너희는 각자 자기 살붙이인 어떤 가까운 친족에게도 가까이 가서 그 벌거벗은 몸을 드러내지 마십시오. 나는 야훼입니다.
  revised_footnotes:
  - marker: a
    text: ‘벌거벗은 몸을 드러내다’는 이 장에서 가까운 친족과 관련된 금지된 성적 노출 또는 성관계를 가리키는 법률적 관용 표현입니다.
    reason: lexical_alternative
  revision_rationale: The revision renders the doubled איש איש distributively as '너희는 각자,' retains the kinship imagery in '자기 살붙이,' and replaces the inaccurate '음란함' with wording that preserves the Hebrew 'uncover nakedness' idiom. The note supplies the idiom's legal context without flattening it in the main text.
