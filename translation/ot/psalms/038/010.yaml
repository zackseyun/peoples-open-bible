id: PSA.38.10
reference: Psalms 38:10
source:
  edition: WLC
  text: לִבִּ֣/י סְ֭חַרְחַר עֲזָבַ֣/נִי כֹחִ֑/י וְֽ/אוֹר עֵינַ֥/י גַּם הֵ֝֗ם אֵ֣ין אִתִּֽ/י־־׃
translation:
  text: My heart reels; my strength has left me, and even the light of my eyes is gone.
  philosophy: dynamic
lexical_decisions:
- source_word: לִבִּי
  chosen: my heart
  alternatives:
  - my mind
  - my inner being
  lexicon: HALOT
  rationale: לֵב/לֵבָב commonly denotes the heart as the inner seat of emotion and vitality. In this context of bodily distress, 'my heart' is the most natural and idiomatic rendering.
- source_word: סְחַרְחַר
  chosen: reels
  alternatives:
  - pounds
  - palpitates
  - reels
  lexicon: HALOT
  rationale: It retains the verb's image of whirling agitation rather than specifying palpitating.
- source_word: עֲזָבַנִי
  chosen: has left me
  alternatives:
  - has forsaken me
  - has abandoned me
  lexicon: HALOT
  rationale: The verb עזב means 'leave, forsake.' With כֹּחִי as subject, 'has left me' is the most idiomatic English for strength failing a person, without overstating covenantal or relational overtones.
- source_word: כֹחִי
  chosen: my strength
  alternatives:
  - my power
  - my vigor
  lexicon: HALOT
  rationale: כֹּחַ here refers to bodily strength or vitality. 'My strength' best fits the lament context and standard English usage.
- source_word: וְאוֹר עֵינַי
  chosen: and the light of my eyes
  alternatives:
  - and the brightness of my eyes
  - and the light in my eyes
  lexicon: HALOT
  rationale: The Hebrew expression is retained fairly literally. It can denote eyesight itself or the brightness/liveliness visible in the eyes. Keeping 'the light of my eyes' preserves the poetic image and its ambiguity.
- source_word: גַּם הֵם
  lemma: גַּם
  chosen: even they
  alternatives:
  - they too
  - even it
  lexicon: HALOT
  rationale: The plural pronoun agrees with the plural 'eyes.' 'Even they' gives emphasis and reflects the Hebrew particle גַּם plus pronoun.
- source_word: אֵין אִתִּי
  chosen: are not with me
  alternatives:
  - is gone from me
  - have failed me
  lexicon: HALOT
  rationale: The phrase literally means 'are not with me.' This preserves the Hebrew wording and allows the poetic sense of lost eyesight or lost brightness to remain open.
- source_word: וְאוֹר עֵינַי גַּם הֵם אֵין אִתִּי
  chosen: and even the light of my eyes is gone
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English retains the eye-light image and its loss.
