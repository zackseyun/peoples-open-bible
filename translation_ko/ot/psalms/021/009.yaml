  to: 당신께서 모습을 드러내실 때에 그들을 불타는 화덕처럼 만드실 것입니다.[a] 야훼께서 진노하셔서 그들을 삼키시고, 불이 그들을 태워 버릴 것입니다.
  rationale: 원문의 절 번호와 내용을 바로잡아, תְּשִׁיתֵמוֹ를 ‘그들을 …처럼 만드실 것입니다’로, כְּתַנּוּר אֵשׁ을 ‘불타는 화덕처럼’으로 옮겼습니다. לְעֵת פָּנֶיךָ는 본문의 자연스러움을 위해 ‘모습을 드러내실 때’로 번역하고, 문자적 ‘얼굴’ 및 가능한 의미 범위는 각주에 보존했습니다. 주어의 정체를 본문에서 ‘왕’ 또는 ‘하나님’으로 단정하지 않고 원문의 직접 2인칭을 유지했으며, 이어지는 יהוה는 별도로 ‘야훼’로 옮겼습니다.
