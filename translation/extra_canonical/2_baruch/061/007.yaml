source:
  text: |-
    # Source page p0189 (printed 153)
    ܫܪܒܐ ܕܝܢ ܕܣܘܓܐܐ
    ܕܡܠܐܟ̈ܐ ܕܡܢܝܢ ܠܗܘܢ
    ܠܐܝܠܝܢ. ܘܐܝܠܝܢ ܕܥܡ̈ܝܩܢ
    ܗܘܘ ܟܐܢܘܬܐ ܐܒ̣ܕܘ.
    ܐܚܝܕܐ. ܟܕ ܡ̈ܝܐ ܕܣܘܓܐܐ
    ܘܐܠܝܢ ܐܢܘܢ ܡ̈ܝܐ ܚܫ̈ܟܐ
    ܕܐܬܚܙܝܘ ܠܟ. ܘܒܬܪ
    ܐܝܠܝܢ ܚܙܝܬ ܡ̈ܝܐ ܢܗܝܪ̈ܐ.
    ܗܢܘܢ ܕܐܬܚܠܛܘ ܒܗܘܢ
    ܬܘܒ ܡ̈ܝܐ ܚܫ̈ܟܐ ܘܐܬܚܠܛܘ
    ܒܗܘܢ. ܗܢܘ ܫܘܪܝܐ
    ܕܡܐܬܝܬܗ ܕܡܫܝܚܐ. ܘܒܬܪ
    ܗܠܝܢ ܢܬܓܠܐ. ܘܬܗܘܐ
    ܙܒܢܐ ܕܝܠܗ ܟܕ ܫܠܡܐ
    ܘܬܬܦܬܚ ܬܘܒ ܚܙܬܐ
    ܕܚܟܡܬܐ. ܘܬܬܝܗܒ ܠܐܝܠܝܢ
    ܕܗܝܡܢܘ. ܘܬܬܚܕܬ
    ܐܪܥܐ. ܘܗܢܘܢ ܕܐܬܕܒܪܘ
    ܒܗ ܢܬܢܗܪܘܢ. ܘܗܢܘܢ
    ܕܐܬܡܟܘ ܒܗ ܒܣܒܪܐ
    ܕܗܢܐ ܢܩܘܡܘܢ. ܘܗܘܐ
    ܣܘܓܐܐ ܕܢܦ̈ܫܬܐ ܕܐܝ
    ܕܝܐܝܬܝܗܘܢ. ܘܫ̈ܪܝܐ ܕܥ̈ܡܡܐ
    ܘܗܘ. ܕܝܐܝܬܝܗܘܢ ܘܩܫܝܐ
    ܡܢ. ܕܗ̈ܘܝܘ ܟܠܗܝܢ ܕܒܒܠ
    ܘܒܩܘܫܬܐ ܬܒܥܝܢ ܬܘܒ
    ܗܢܘܢ. ܕܐܬܬܣܝܡܘ ܬܘܒ ܡܢ
    ܕܐܒܕܘ ܝܘܡܢܐ ܘܗܘ ܙܒܢܐ
    ܘܗܘ ܚܫܒܘܢܐ ܕܙܒܢܐ.
    ܘܗܘ ܡܬܚܫܒܢܐ ܕܙܒܢܐ
    ܕܝܢ ܡܪܝ. ܗܢܘܢ ܕܒܙܒܢܐ
    ܐܬܝܠܕܘ ܐܝܟܢܐ ܢܥܒܕܘܢ ܐܘ
    ܐܝܠܝܢ ܕܡܩܕܡܝܢ ܢܗܘܘܢ
    ܕܝܐܝܬܝܗܘܢ ܗܢܘܢ ܗܟܝܠ
    ܘܐܬܪܘܪܒܘ ܘܐܬܩܪܒܘ
    ܘܐܙܠܘ ܘܐܬܟܢܫܘ ܘܐܬܚܙܝܘ
    ܘܐܝܠܝܢ ܕܐܬܟܢܫܘ ܘܐܙܠܘ
    ܐܝܟ ܗܢܘܢ. ܘܗܘܘ ܝܬܝܪ
    ܘܗܘܘ ܕܡܝܩܪܝܢ ܝܬܝܪ
    ܘܐܝܠܝܢ ܕܒܟܠ ܙܒܢ ܡܬܒܥܝܢ
    ܘܡܫܬܒܚܝܢ ܘܗܘܘ ܝܬܝܪ
    ܘܐܝܠܝܢ ܕܡܬܩܒܠܝܢ ܝܬܝܪ
    ܘܐܝܠܝܢ ܕܡܬܩܒ

    # Source page p0188 (printed 154)
    ܐܦ ܝܡܝܢܐ ܒܪܘܬ ܙܒܢܐ
    ܕܐܬܚܙܝܬ ܡܢ ܬܪ̈ܘܝܗܝܢ.
    ܘܐܬܚܙܝܬ ܬܘܒܘܗܝ
    ܕܚܒܠܬܐ ܕܐܬܚܙܝܬ. ܟܕ
    ܐܚܝܕ ܗܘܐ ܠܡܘܫܐ
    ܠܘܬܗ. ܝܘܡܝܢ ܣܓܝ̈ܐܐ
    ܗܘܘ ܣܓܝ̈ܐܐ ܥܡ
    ܕܒܪܐ ܕܝܘܩܦܘܪ ܘܝܘܠܦܢܐ
    ܕܐܒܝܐ ܐܚܝܕ ܕܐܦ ܠܝ.
    ܘܬܘܒ ܚܕ ܕܫܡܘܐܝܠ
    ܕܐܝܟܢ. ܘܡܘܫܚ̈ܬܗ̇.
    ܕܡܬܒܥܝܐ ܒܕܡܘܬܐ
    ܕܥܝܪ ܡܩܕܫܐ ܕܗܘܐ.
    ܐܠܐ ܐܦ ܗܢܝܢ ܚܘܝܬ
    ܗܘܐ ܡܘܫܚ̈ܬܗ̇ ܕܢܘܪܐ.
    ܐܦ ܒܘ̈ܩܘܗܝ ܕܬܗܘܡܐ.
    ܘܡܫܪ̈ܘܝ ܕܪ̈ܘܚܐ. ܘܡܢܝܢܐ
    ܕܢܛ̈ܦܐ ܡܛܪܐ. ܘܐܚܝܕܘܬ
    ܕܪ̈ܘܓܙܐ. ܘܣܓܝܘ̈ܬܐ
    ܕܓܝܓ̈ܠܐ ܪܘܚܐ. ܘܫܪܪܗ
    ܕܕܝܢܐ. ܘܥܘܪܒܐ ܕܚܟܡܬܐ.
    ܘܥܘܬܪܐ ܕܣܘܟܠܬܢܘܬܐ.
    ܕܒܥ̈ܠܕܒܒܐ܂ ܘܪܢܝܐ ܝܘܡܢܐ
    ܕܕܝ̈ܢܐ܂ ܘܡܥܒܕܐ ܕܡܘ̈ܬܒܐ܂
    ܘܐܬܒܥܝܐ ܕܥܕܟܝܠ ܠܐ
    ܐܬܝ̈ܝ܂ ܘܦܘܡܟܢܐ ܕܐܓܘܢܐ܂
    ܘܚ
