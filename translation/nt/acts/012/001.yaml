id: ACT.12.1
reference: Acts 12:1
source:
  edition: SBLGNT
  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
translation:
  text: About that time King Herod began persecuting some members of the church.
  philosophy: dynamic
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  chosen: About that time
  alternatives:
  - At that time
  - Around that time
  - Now about that time
  lexicon: BDAG
  rationale: 'κατά with the accusative time expression idiomatically means ''about/around'' a time; δέ is rendered with a light transitional ''Now'' to mark narrative development without overtranslating. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  chosen: laid hands on
  alternatives:
  - stretched out his hands against
  - arrested
  lexicon: BDAG
  rationale: The expression is idiomatic. Literally it is 'laid the hands,' but in context it denotes hostile action against persons. 'Laid hands on' preserves the idiom and leaves room for the following infinitive to specify the harmful intent. 'Arrested' is too narrow here because the infinitive κακῶσαί indicates broader mistreatment.
- source_word: Ἡρῴδης ὁ βασιλεύς
  chosen: Herod the king
  alternatives:
  - King Herod
  lexicon: BDAG
  rationale: Both are natural in English. 'Herod the king' follows the Greek appositional order more closely while remaining readable.
- source_word: κακῶσαί
  chosen: to mistreat
  alternatives:
  - to harm
  - to persecute
  lexicon: BDAG
  rationale: κακόω here means to cause harm or ill-treatment. 'Mistreat' captures the personal hostile action without importing the more technical or broader religious sense of 'persecute,' which the verb itself does not require.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  chosen: some from the church
  alternatives:
  - some of those from the church
  - some belonging to the church
  lexicon: BDAG
  rationale: The phrase identifies certain people associated with the Christian assembly. 'From the church' is concise and natural; 'of those from the church' is more literal but less idiomatic in English.
