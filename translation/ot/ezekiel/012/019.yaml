  meaning: Ezekiel must tell his fellow Israelites that Jerusalem’s inhabitants will eat and drink in fear as violence brings devastation and emptiness upon their land.
  meaning_decisions:
  - source_phrase: וְאָמַרְתָּ אֶל עַם הָאָרֶץ
    prior_rendering: And say to the people of the land
    new_rendering: Say to your fellow Israelites
    rationale: In the chapter’s setting, Ezekiel addresses fellow Israelites in exile about Jerusalem; the prior wording can misleadingly suggest that his immediate audience lives in Jerusalem or its surrounding land.
  - source_phrase: אֲדֹנָי יְהוִה
    prior_rendering: the Lord GOD
    new_rendering: the Lord Yahweh
    rationale: The standing ruling requires Yahweh wherever the Old Testament source uses the divine name, including this compound title.
  - source_phrase: לְמַעַן תֵּשַׁם
    prior_rendering: so that ... may be made desolate
    new_rendering: for ... will be laid desolate
    rationale: In context, the impending devastation explains the inhabitants’ fearful eating and drinking; eating anxiously is not itself the means of emptying the land. The purpose-or-result understanding remains in a footnote.
  - source_phrase: אַרְצָהּ מִמְּלֹאָהּ
    prior_rendering: her land ... of its fullness
    new_rendering: the land ... stripped of all that fills it
    rationale: The feminine suffix refers to Jerusalem rather than introducing a new female figure, and “fullness” means everything that fills the land. The new wording preserves the image of desolation while making its extent intelligible.
  footnote_kinds:
    a: alternative_meaning
