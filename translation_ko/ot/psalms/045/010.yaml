lexical_decisions:
- source_word: בְּנוֹת מְלָכִים
  english_pob_choice: Daughters of kings
  chosen_korean: 왕들의 딸들
  alternatives_korean:
  - 왕자들
  - 공주들
  lexicon: HALOT
  rationale: 히브리어의 소유·관계 구문을 그대로 살려 왕실 출신 여성들을 직역적으로 드러내는 편이 본문의 병렬과 시각적 이미지를 더 잘 보존합니다.
- source_word: בְּיִקְּרוֹתֶיךָ
  english_pob_choice: among your honored women
  chosen_korean: 당신의 귀한 여성들 가운데
  alternatives_korean:
  - 당신의 소중한 이들 가운데
  - 당신의 고귀한 부인들 가운데
  lexicon: HALOT
  rationale: 어근 יקר의 기본 의미인 ‘귀한, 존귀한’을 살리면서도, 문맥상 왕궁의 여성들을 가리키는 어감이 드러나도록 했습니다.
- source_word: שֵׁגַל
  english_pob_choice: the queen
  chosen_korean: 왕후
  alternatives_korean:
  - 여왕
  - 왕비
  lexicon: HALOT
  rationale: 이 단어는 왕의 배우자/왕비를 가리키므로, 현대 한국어에서는 ‘왕후’가 문맥상 가장 자연스럽고 품위 있는 대응입니다.
- source_word: בְּכֶתֶם אוֹפִיר
  english_pob_choice: in gold of Ophir
  chosen_korean: 오빌의 금으로
  alternatives_korean:
  - 오빌의 황금으로
  - 오빌산 금으로
  lexicon: HALOT
  rationale: כֶּתֶם은 정금, او피르는 금의 산지로 알려진 지명이라서, ‘오빌의 금으로’라고 옮겨 왕후의 장식/광휘를 간결하게 드러냈습니다.
theological_decisions:
- issue: 시적 병렬의 존칭과 화자의 직접 대면
  chosen_reading: 시편의 왕궁 묘사를 살리면서도 2인칭을 ‘당신’으로 유지해 장엄한 직접 호칭을 보존했습니다.
  alternative_readings:
  - 왕의
  - 임금님의
  rationale: 본절은 시적 선언문이므로 한국어에서도 2인칭 직설을 유지하는 편이 원문의 거리감과 의례적 분위기를 더 잘 전달합니다.
  doctrine_reference: 시편의 왕실 찬가/메시아적 독법이 함께 가능한 본문으로서, 번역은 우선 문면의 궁정 장면을 보존합니다.
