  from: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
  to: The thin ears swallowed up the seven plump, full ears. Then Pharaoh awoke and realized it was a dream.
  rationale: I retain the documented preference for 'swallowed up,' which preserves the dream’s impossible image. The earlier alternative 'plump' better matches the physical contrast and the wording of verse 5.
