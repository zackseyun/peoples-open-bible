id: JHN.1.29
reference: John 1:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: ko
  text: 다음 날 그는 예수께서 자기에게로 오시는 것을 보고 말합니다. 「보십시오. 세상의 죄를 없애시는 하나님의 어린양입니다。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  english_pob_choice: Look
  chosen_korean: 보라
  alternatives_korean:
  - 보라라
  - 보라요
  - 보시오
  lexicon: ἴδε
  rationale: Ἴδε는 지시·주의를 끄는 감탄적 어휘입니다. 영어 POB 'Look'에 따라 전통적이고 짧은 한국어 명령형 '보라'를 선택하여 원문의 즉각적 호소성을 살렸습니다. 인용문 안이므로 문체는 고전적 어조를 허용합니다.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  english_pob_choice: the Lamb of God
  chosen_korean: 하나님의 어린양
  alternatives_korean:
  - 하나님의 양
  - 하나님의 어린 양(어린양)
  - 하나님의 어린 양(메시아적 칭호로 번역)
  lexicon: ἀμνός; θεός
  rationale: θεός는 신약 문맥에서 일반적으로 '하나님'(하나님)으로 번역합니다. 'ἀμνὸς'는 문화적·신학적 함의를 가진 명칭으로, 한국어 전통어 '어린양'을 사용해 영어 POB 'Lamb of God'을 충실히 반영했습니다.
- source_word: ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου
  english_pob_choice: who takes away the sin of the world
  chosen_korean: 세상의 죄를 없애는 이
  alternatives_korean:
  - 세상의 죄를 지고 가는 이
  - 세상의 죄를 담당하는 이
  - 세상의 죄를 속죄하는 이
  lexicon: αἴρω; ἁμαρτία; κόσμος
  rationale: αἴρων은 현재능동분사로 '짐을 들어 옮기다/제거하다'의 의미를 드러냅니다. 영어 POB의 'takes away'를 문자적으로 반영해 한국어로 중립적이고 직역에 가까운 '없애는'을 선택했습니다. 이는 원문의 동작성을 살리되, '속죄'라는 신학적 해석을 자동으로 단정하지 않도록 합니다.
theological_decisions:
- issue: αἴρων ('takes away')의 신학적 무게 — 속죄(atonement) 번역 여부
  chosen_reading: 중립적 서술어 '없애는'으로 번역하여 원문 동사를 유지하되 특정 속죄신학 용어를 도입하지 않음
  alternative_readings:
  - 속죄하는 이(명시적 속죄어)
  - 죄를 지고 가는 이(대속 이미지 강조)
  - 죄를 제거하는 이(현대적 표현)
  rationale: 그리스어 αἴρω는 문자적으로 '들어 옮기다/제거하다'를 의미하며, 요한복음의 전체 신학적 맥락에서 속죄적 해석이 가능하나(신학적 독해) 동사 자체가 '속죄'라는 기술어를 포함하지는 않습니다. POB의 원칙(원문이 독자에게 의미하는 바를 보존)을 따라 중립적 번역어를 선택해 독자가 문맥과 신학적 주석을 통해 해석할 수 있도록 했습니다.
  doctrine_reference: 신약 그리스어 용법·요한복음 전체 신학적 해석 관례
