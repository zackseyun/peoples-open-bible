translation:
  text: May all the children of humanity be righteous; may all the nations worship and bless me, and may they all bow down
    to me.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Children of humanity” translates a phrase that can be rendered more literally “sons of humanity”; it is a collective
      expression here, not the title “Son of Man.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ውሉደ፡ ሰብእ
  chosen: the children of humanity
  alternatives:
  - the sons of humanity
  - the children of humankind
  rationale: The construct phrase literally denotes the offspring or children of humanity. The inclusive collective sense
    is represented without turning the expression into the distinct apocalyptic title “Son of Man.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ጻድቃነ
  chosen: righteous
  alternatives:
  - just
  rationale: “Righteous” preserves the moral and theological force of the plural predicate and fits the prayer-like wish introduced
    by the verbal form “may ... be.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: አሕዛብ
  chosen: nations
  alternatives:
  - peoples
  - Gentiles
  rationale: The plural refers collectively to the nations. “Gentiles” would introduce an Israel-versus-nations contrast not
    explicit in this line.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ያምልኩ
  chosen: worship
  alternatives:
  - serve
  - revere
  rationale: In combination with blessing and bowing down before the first-person speaker, the verb denotes cultic reverence;
    “worship” best preserves that force.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይባርኩ
  chosen: bless
  alternatives:
  - praise
  rationale: “Bless” retains the source verb’s conventional religious sense and avoids collapsing it into the adjacent act
    of worship.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይሰግዱ
  chosen: bow down
  alternatives:
  - prostrate themselves
  - worship
  rationale: The verb depicts bodily obeisance. “Bow down” preserves the concrete action and avoids duplicating the preceding
    verb rendered “worship.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወይኩኑ ... ወይኩኑ
  chosen: May ... be ...; may ...
  alternatives:
  - Let ... be ...; let ...
  - They shall be ...; ... shall
  rationale: The repeated imperfect form is read with jussive or optative force. Repeating “may” preserves the parallel wish
    while rendering the second clause idiomatically with its following verbs.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
