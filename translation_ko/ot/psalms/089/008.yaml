revisions:
- from: 하나님은 거룩한 이들의 회중에서 크게 두려움의 대상이시며, 그를 둘러선 모든 이들보다 두렵고 경외로우십니다.[a][b]
  to: 만군의 하나님 야훼여, 주님처럼 강하신 이가 누구입니까, 야여? 주님의 신실하심이 주님을 둘러싸고 있습니다.[a]
  rationale: 대상 절의 히브리어 본문을 처음부터 다시 반영했습니다. ‘야훼’(יְהוָה)와 ‘야’(יָהּ)를 구별하고, מִי כָמוֹךָ חֲסִין의 수사적 질문 및 וֶאֱמוּנָתְךָ סְבִיבוֹתֶיךָ의 시적 이미지를 보존했습니다. 기존 본문과 각주는 다른 절에 관한 것이므로 삭제·교체했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:13:49Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 제시된 히브리어 본문(시편 89:8)이 아니라 앞 절인 시편 89:7의 내용(거룩한 이들의 회의, 두려움)을 번역하고 있습니다. 따라서 본문과 어휘 결정 및 각주가 모두 해당 절의 원문에 맞지 않습니다. 수정안은 יְהוָה를 ‘야훼’, יָהּ를 구별하여 ‘야’로 옮기고, ‘만군의 하나님’, 비교 질문, 하나님의 신실하심이 그분을 둘러싼다는 시적 진술을 반영합니다.
  naturalness: ‘만군의 하나님 야훼여’는 한국어 성서 문체에서 자연스럽고, ‘주님처럼 강하신 이가 누구입니까?’는 수사 의문문의 힘을 자연스럽게 전달합니다. 짧은 신명 ‘야’의 호격은 한국어에서 낯설 수 있으므로 각주로 설명합니다.
  terminology: יְהוָה는 ‘야훼’로, יָהּ는 그 짧은 형태를 보존하여 ‘야’로 구별했습니다. אֱלֹהֵי צְבָאוֹת는 범위를 과도하게 한정하지 않는 관용적 표현 ‘만군의 하나님’으로, חֲסִין은 ‘강하신’으로, אֱמוּנָה는 ‘신실하심’으로 옮겼습니다.
  issues:
