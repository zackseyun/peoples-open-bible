source:
  edition: WLC
  text: וְ/יִשְׂמְח֨וּ כָל ח֪וֹסֵי בָ֡/ךְ לְ/עוֹלָ֣ם יְ֭רַנֵּנוּ וְ/תָסֵ֣ךְ עָלֵ֑י/מוֹ וְֽ/יַעְלְצ֥וּ בְ֝/ךָ֗ אֹהֲבֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/011.yaml
  text: But let all who take refuge in you rejoice; let them shout for joy forever. Cover them[a], and let those who love your name exult in you.
  footnotes:
  - marker: a
    text: Or “shelter them”; the image is of protective covering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님께 피하는 모든 이가 기뻐하게 하시고[a], 영원히 기쁨으로 외치게 하십시오. 그들 위에 주님의 보호를 펼치셔서[b], 주님의 이름을 사랑하는 이들이 주님 안에서 크게 기뻐하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원히 노래하며 기뻐하게 하십시오.’ 히브리어 동사는 기쁨에 찬 우렁찬 외침을 가리키며, 노래를 포함할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 덮으십시오’ 또는 ‘그들을 보호하십시오.’ 히브리어는 보호를 위해 덮는 모습을 비유적으로 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  english_pob_choice: Declare them guilty
  chosen_korean: 그들을 유죄로 선언하십시오
  alternatives_korean:
  - 그들을 유죄로 판정하십시오
  - 그들을 죄인으로 단정하십시오
  lexicon: HALOT
  rationale: 히필 명령형 אשם의 법정적 의미를 살려, 단순한 감정적 비난이 아니라 하나님께 판결을 구하는 표현으로 옮겼습니다.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  english_pob_choice: by their own counsels
  chosen_korean: 그들 스스로의 계획으로
  alternatives_korean:
  - 그들 자신의 꾀로
  - 그들 자신의 계략으로
  lexicon: HALOT
  rationale: מוֹעֲצוֹת는 ‘계획들/모략들’의 뜻이므로, 자기 계획이 자기 파멸의 원인이 된다는 반어를 드러내도록 처리했습니다.
- source_word: הַדִּיחֵמוֹ
  english_pob_choice: Drive them away
  chosen_korean: 그들을 쫓아내십시오
  alternatives_korean:
  - 그들을 내쫓으십시오
  - 그들을 추방하십시오
  lexicon: HALOT
  rationale: נדח의 사역형 명령은 ‘몰아내다, 내쫓다’의 강한 동작을 담으므로, 임재에서 밀어내는 사법적 어조를 유지했습니다.
- source_word: מָרוּ בָךְ
  english_pob_choice: they have rebelled against you
  chosen_korean: 그들이 주님을 거슬러 반역하였기 때문입니다
  alternatives_korean:
  - 그들이 주님께 반역하였기 때문입니다
  - 그들이 주님께 대항하였기 때문입니다
  lexicon: HALOT
  rationale: מרה + ב는 단순한 불순종보다 ‘거슬러 반역하다’가 더 정확하며, 직설적 관계를 살려 주어를 분명히 했습니다.
theological_decisions:
- issue: 탄원시의 심판 요청을 완화하지 않을지
  chosen_reading: 시편의 직접적인 심판 요청을 그대로 살려, 선언과 추방의 명령형을 유지했습니다.
  alternative_readings:
  - 예언적 진술처럼 완화하여 번역하기
  - 형벌의 결과만 묘사하는 식으로 바꾸기
  rationale: 히브리어는 하나님께 드리는 청원형 표현이며, 본문의 긴장과 공의 요청을 약화시키지 않는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 번역 철학 §3, 신학적 긴장 보존
