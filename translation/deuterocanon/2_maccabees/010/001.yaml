translation:
  text: A very short time later, Lysias, the king’s guardian, kinsman[a], and chief minister, was deeply distressed by what had happened.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “Kinsman” was a royal court title and did not necessarily indicate a blood relationship.
    reason: cultural_note
lexical_decisions:
- source_word: Μετʼ ὀλίγον ... χρονίσκον
  chosen: after a very short time
  alternatives:
  - after a little while
  - after a brief interval
  lexicon: LSJ
  rationale: The phrase combines Μετʼ ὀλίγον ('after a little') with παντελῶς χρονίσκον, intensifying the brevity. 'After a very short time' captures the cumulative force in natural English without over-literal awkwardness.
- source_word: παντελῶς
  chosen: very
  alternatives:
  - altogether
  - entirely
  - quite
  lexicon: LSJ
  rationale: Here παντελῶς functions adverbially to intensify χρονίσκον. 'Very' best conveys the idiomatic force in English.
- source_word: χρονίσκον
  chosen: short time
  alternatives:
  - little while
  - brief interval
  lexicon: LSJ
  rationale: The diminutive sense suggests a small span of time. 'Short time' is clear and idiomatic in context.
- source_word: ἐπίτροπος
  chosen: guardian
  alternatives:
  - regent
  - administrator
  - steward
  lexicon: LSJ
  rationale: In relation to 'the king,' ἐπίτροπος denotes one entrusted with oversight on the king's behalf. 'Guardian' preserves the personal-political sense without over-specifying a constitutional office; 'regent' is possible but may imply more formal status than the Greek itself states.
- source_word: συγγενὴς
  chosen: kinsman
  alternatives:
  - relative
  lexicon: LSJ
  rationale: The term denotes familial relation. 'Kinsman' is slightly more formal and suits the historical register.
- source_word: ἐπὶ τῶν πραγμάτων
  chosen: the one over affairs
  alternatives:
  - chief minister
  - in charge of state affairs
  - administrator of affairs
  lexicon: LSJ
  rationale: Literally 'over the affairs/matters.' The phrase likely denotes an administrative office, but the exact title is not transparent from the Greek alone. 'The one over affairs' stays close to the source while remaining intelligible.
- source_word: λίαν βαρέως φέρων
  chosen: taking ... very hard
  alternatives:
  - bearing ... very grievously
  - being deeply upset about
  - taking ... very badly
  lexicon: LSJ
  rationale: The idiom φέρειν βαρέως means to take something badly or be distressed/indignant over it. 'Taking the events very hard' preserves the emotional force in readable English.
- source_word: ἐπὶ τοῖς γεγονόσι
  chosen: the events
  alternatives:
  - what had happened
  - the things that had taken place
  lexicon: LSJ
  rationale: The perfect participle refers to the recent occurrences. 'The events' is concise and fits the sentence flow, though 'what had happened' is also viable.
