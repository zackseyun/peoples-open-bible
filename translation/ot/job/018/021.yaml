  from: Surely these are the dwellings of the unjust[b][a], and this is the place of one who does not know God.
  to: Surely these are the dwellings of a wrongdoer, and this is the place of one who does not know God.
  rationale: עַוָּל is singular and denotes a person marked by injustice or wrongdoing. “A wrongdoer” preserves that singular generic reference and is more idiomatic contemporary English than the substantival “the unjust.” The rendering otherwise retains the Hebrew’s deliberately parallel but nonidentical images (“dwellings” / “place”) and does not overinterpret “know God.” The existing footnote markers are misplaced in the current line, and neither listed alternative supplies a material textual or semantic clarification after this revision.
