id: WIS.15.10
reference: Wisdom of Solomon 15:10
source:
  edition: lxx-swete-1909
  text: σποδὸς ἡ καρδία αὐτοῦ, καὶ γῆς εὐτελεστέρα ἡ ἐλπὶς αὐτοῦ, πηλοῦ τε ἀτιμότερος ὁ βίος αὐτοῦ,
  language: Greek
  pages:
  - 649
  confidence: high
  validation: no_reference
  note: This verse is being loaded from the normalized translation-ready override layer derived from the adjudicated corpus. Translation-ready override derived from final_corpus_adjudicated; dropped duplicate chapter 20 and spillover beyond Wisdom 19:22.
translation:
  text: His heart is ashes, his hope is worth less than earth, and his life is held in less honor than clay,
  philosophy: dynamic
lexical_decisions:
- source_word: σποδός
  chosen: ashes
  alternatives:
  - ash
  - dust
  lexicon: LSJ
  rationale: Predicate nominative used metaphorically of the idolater's inner condition. English plural 'ashes' is the most natural idiom for something reduced to worthlessness and lifelessness.
- source_word: καρδία
  chosen: heart
  alternatives:
  - mind
  - inner self
  lexicon: LSJ
  rationale: Retains the common biblical anthropological term rather than interpreting it more narrowly. The verse speaks of the person's inner core, and 'heart' preserves that.
- source_word: γῆς
  chosen: earth
  alternatives:
  - soil
  - ground
  lexicon: LSJ
  rationale: 'The genitive after the comparative expresses the standard of comparison: his hope is ''more worthless than earth.'' ''Earth'' keeps the broad material sense and echoes the low-value imagery alongside clay.'
- source_word: εὐτελεστέρα
  chosen: more worthless
  alternatives:
  - cheaper
  - more paltry
  - more trivial
  lexicon: LSJ
  rationale: Conveys comparative lowness of value, not merely low monetary cost. 'More worthless' best fits the moral-poetic denunciation in context.
- source_word: ἐλπίς
  chosen: hope
  alternatives:
  - expectation
  lexicon: LSJ
  rationale: Standard rendering that fits both the abstract noun and the theological-poetic force of misplaced reliance.
- source_word: πηλοῦ
  chosen: clay
  alternatives:
  - mud
  lexicon: LSJ
  rationale: The immediate context concerns fashioned idols and materiality; 'clay' is more precise and dignified than 'mud' while preserving the earthy contrast.
- source_word: ἀτιμότερος
  chosen: more dishonored
  alternatives:
  - more contemptible
  - more worthless
  - more shameful
  lexicon: LSJ
  rationale: The adjective centers on lack of honor or esteem. 'More dishonored' preserves the honor-shame nuance better than flattening it into mere utility or value.
- source_word: βίος
  chosen: life
  alternatives:
  - way of life
  - livelihood
  lexicon: LSJ
  rationale: In this triad (heart, hope, life), 'life' is the most coherent rendering. 'Way of life' is possible, but the verse appears to summarize the person's whole existence.
