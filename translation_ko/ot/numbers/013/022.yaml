- from: 그들은 네겝으로 올라가 헤브론에 이르렀습니다. 거기에는 아낙의 자손인 아히만, 세새, 달매가 있었습니다. 헤브론은 이집트의 소안보다 일곱 해 먼저 세워졌습니다.
  to: 그들은 네겝으로 올라가, 그가 헤브론까지 이르렀습니다. 거기에는 아낙의 자손인 아히만, 세새, 달매가 있었습니다. 헤브론은 이집트의 소안보다 일곱 해 앞서 세워졌습니다.
  rationale: 히브리어 본문의 복수 ‘그들은 올라갔다’와 뒤이은 단수 ‘그가 이르렀다’를 그대로 구별하여 옮겼습니다. 단수 주어의 정체는 본문이 명시하지 않으므로 해석적으로 보충하지 않았습니다. 그 밖의 문장은 현 초안의 정확하고 자연스러운 표현을 유지했습니다.
