translation:
  language: ko
  text: 온 마음을 다해 지혜에게 다가가고, 온 힘을 다해 그 길을 지키십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόσελθε αὐτῇ
  english_pob_choice: Approach her
  chosen_korean: 그 길에 다가서고
  alternatives_korean:
  - 그 길에 가까이 가고
  - 그 길에 다가가고
  lexicon: προσέρχομαι
  rationale: 지혜를 여성 대명사로 받은 앞선 문맥을 살리되, 한국어에서는 대상에 대한 단순 접근을 자연스럽게 옮겨 ‘다가서다’로 표현했습니다.
- source_word: ἐν πάσῃ ψυχῇ σου
  english_pob_choice: with all your soul
  chosen_korean: 온 힘을 다해
  alternatives_korean:
  - 온 마음을 다해
  - 온 영혼을 다해
  lexicon: ψυχή
  rationale: ψυχή는 여기서 전인적 내면과 생명력을 가리키므로, 한국어의 관용적 종교어인 ‘영혼’보다 전체 역량을 나타내는 ‘온 힘’을 택해 의미를 과장 없이 담았습니다.
- source_word: ἐν ὅλῃ δυνάμει σου
  english_pob_choice: with all your strength
  chosen_korean: 온 힘을 다해
  alternatives_korean:
  - 모든 힘을 다해
  - 전력을 다해
  lexicon: δύναμις
  rationale: δύναμις의 물리적·능력적 강도를 살려 앞 절과 평행을 이루는 표현으로 옮겼습니다.
- source_word: συντήρησον τὰς ὁδοὺς αὐτῆς
  english_pob_choice: keep to her ways
  chosen_korean: 그 길을 지키십시오
  alternatives_korean:
  - 그 길을 따르십시오
  - 그 길에 머무르십시오
  lexicon: συντηρέω
  rationale: English POB의 수정된 ‘keep to’를 반영해 단순 보존보다 ‘그 길에 충실히 머물고 벗어나지 않음’의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 지혜를 여성 인격체로 부르는 표현
  chosen_reading: ‘그 길’로 받아 지혜의 가르침과 삶의 길을 한국어로 자연스럽게 연결했습니다.
  alternative_readings:
  - ‘그녀’로 직역하기
  - ‘그 길녀’ 같은 인격화 유지
  rationale: 한국어에서 지혜를 여성 대명사로 반복하면 어색하므로, 본문이 요구하는 인격화는 유지하되 지혜의 ‘길’이라는 내용적 초점을 선명하게 했습니다.
  doctrine_reference: 잠언·집회서의 지혜 문학 전통
- issue: ‘영혼’과 ‘힘’의 중복
  chosen_reading: 두 개의 전치사구를 모두 ‘온 힘을 다해’로 대응해 전인적 헌신을 강조했습니다.
  alternative_readings:
  - 첫 구는 ‘온 마음을 다해’, 둘째 구는 ‘온 힘을 다해’
  - 첫 구는 ‘온 영혼을 다해’, 둘째 구는 ‘온 힘을 다해’
  rationale: 원문은 ψυχή와 δύναμις를 병렬로 두어 전인성과 능력을 모두 요구하므로, 한국어에서도 중복된 헌신의 강도를 유지하는 쪽이 가장 충실합니다.
  doctrine_reference: 지혜문학의 평행법
