- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Force of the imperfect verbs in this prayer context
  chosen_reading: future-like petition ('You will pursue ... and destroy ...')
  alternative_readings:
  - jussive-like petition ('May you pursue ... and destroy ...')
  - past narrative ('You pursued ... and destroyed ...')
  rationale: In the lament-prayer context, the imperfects function as an appeal directed to God. English can represent this either with 'may you' or a future-like 'you will.' The latter keeps the directness and solemnity of the prayer while remaining idiomatic. The alternative volitive nuance is preserved in a footnote.
