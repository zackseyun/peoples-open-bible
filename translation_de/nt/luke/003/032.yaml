    issue: „Jobed“ gibt Ἰωβήλ nicht korrekt wieder.
    rationale: Das SBLGNT liest Ἰωβήλ (Iōbēl), also einen Namen mit finalem Lambda. „Jobed“ setzt demgegenüber ein finales Delta voraus. Die Korrektur ist zur Quelltexttreue erforderlich, auch wenn der englische Audit-Text „Jobed“ bietet.
