  to: When David had gone a little beyond the summit, Ziba, Mephibosheth’s servant, met him with a pair of saddled donkeys loaded with two hundred loaves of bread, a hundred cakes of raisins, a hundred portions of summer fruit, and a skin of wine.
  rationale: The lexical deliberation supports the summit, Ziba’s role as servant, saddled donkeys, and a skin-container of wine, all of which remain. I depart from its preference for 'clusters' because cakes better convey the counted provisions in this setting; no MAINTAINER revision is recorded.
