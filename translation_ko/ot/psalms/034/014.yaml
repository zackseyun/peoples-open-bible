  - 기만을 말하지 않게
  - 거짓을 말하지 않게
  lexicon: HALOT
  rationale: מִרְמָה는 단순한 거짓말보다 더 넓은 ‘속임수, 기만’의 뉘앙스를 가지므로 ‘속임수’가 적합합니다. 동사구는 한국어에서 자연스럽게 부정 목적형으로 옮겼습니다.
