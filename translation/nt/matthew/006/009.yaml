  from: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
  to: 'Therefore[a], pray like this: Our Father in the heavens, may your name be treated as holy[b],'
  rationale: The Greek `προσεύχεσθε` is a present imperative, not a modal or subjunctive verb. Translating it as 'should pray' weakens the direct command. While the pronoun `ὑμεῖς` is emphatic (contrasting the disciples with the hypocrites and Gentiles in the preceding verses), English imperatives typically drop the pronoun. If the emphasis must be retained, 'You, therefore, pray like this' preserves both the emphasis and the imperative mood better than 'should'.
