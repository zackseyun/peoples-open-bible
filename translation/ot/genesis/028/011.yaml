  from: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
  to: He came to a certain place and spent the night there because the sun had set. He took one of the stones there, put it at his head[a], and lay down in that place.
  rationale: I retain the earlier natural treatment of arrival, sunset, and the repeated significant place. Verse 18 supports a single stone, but the documented lexical alternatives show that “under his head” is more specific than the Hebrew requires; the unnecessary notes about the article and plural stones are dropped.
