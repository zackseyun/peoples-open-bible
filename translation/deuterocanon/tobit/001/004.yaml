id: TOB.1.4
reference: Tobit 1:4
source:
  edition: lxx-swete-1909
  text: καὶ ὅτε ἤμην ἐν τῇ χώρᾳ μου ἐν τῇ γῇ Ἰσραήλ, νεωτέρου μου ὄντος, πᾶσα φυλὴ τοῦ Νεφθαλεὶμ τοῦ πατρός μου ἀπέστη ἀπὸ τοῦ οἴκου Ἱεροσολύμων, τῆς ἐκλεγείσης ἀπὸ πασῶν τῶν φυλῶν Ἰσραὴλ εἰς τὸ θυσιάζειν πάσαις ταῖς φυλαῖς· καὶ ἡγιάσθη ὁ ναὸς τῆς κατασκηνώσεως τοῦ ὑψίστου καὶ ᾠκοδομήθη εἰς πάσας
  language: Greek
