  from: He blessed them[a], and they multiplied greatly; and he did not let their livestock decrease.
  to: He blessed them, and they multiplied greatly; he did not diminish their livestock.
  rationale: The singular Hiphil verb naturally continues the divine subject and takes “their livestock” as its object. “He did not diminish” is more direct than “he did not let ... decrease,” which adds an unneeded permissive nuance. The proposed alternative lacks sufficient grammatical basis to require a note.
