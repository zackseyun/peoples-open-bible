id: 1SA.19.10
reference: 1 Samuel 19:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְבַקֵּ֨שׁ שָׁא֜וּל לְ/הַכּ֤וֹת בַּֽ/חֲנִית֙ בְּ/דָוִ֣ד וּ/בַ/קִּ֔יר וַ/יִּפְטַר֙ מִ/פְּנֵ֣י שָׁא֔וּל וַ/יַּ֥ךְ אֶֽת הַ/חֲנִ֖ית בַּ/קִּ֑יר וְ/דָוִ֛ד נָ֥ס וַ/יִּמָּלֵ֖ט בַּ/לַּ֥יְלָה הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/010.yaml
  text: Saul sought to pin David to the wall with the spear, but he slipped away from Saul’s presence, and he drove the spear into the wall. Then David fled and escaped that night.
translation:
  language: ko
  text: 사울은 창으로 다윗을 벽에 박아 버리려고 하였으나, 다윗은 사울을 피해 몸을 피했고 사울은 창을 벽에 박았습니다. 다윗은 그날 밤 도망하여 벗어났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַכּוֹת ... בַּחֲנִית ... בַּקִּיר
  english_pob_choice: to pin David to the wall with the spear
  chosen_korean: 다윗을 창으로 벽에 박으려고 하였으나
  alternatives_korean:
  - 창으로 다윗을 벽에 꿰뚫으려고 하였으나
  - 창으로 다윗을 벽에 고정시키려 하였으나
  lexicon: הכה / חנית / קיר
  rationale: 동사의 결과를 ‘박다’로 살려, 창으로 사람을 벽에 붙들어 두려는 폭력적 의도를 자연스럽게 드러냈습니다.
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  english_pob_choice: he slipped away from Saul’s presence
  chosen_korean: 다윗은 사울의 앞에서 빠져나갔습니다
  alternatives_korean:
  - 사울의 앞에서 미끄러져 나갔습니다
  - 사울의 앞을 벗어났습니다
  lexicon: פטר
  rationale: ‘빠져나가다’로 이동과 탈출의 뉘앙스를 유지하면서, POB의 ‘slipped away’가 담는 급박함을 반영했습니다.
- source_word: וַיַּךְ אֶת הַחֲנִית בַּקִּיר
  english_pob_choice: he drove the spear into the wall
  chosen_korean: 사울은 창을 벽에 꽂았고
  alternatives_korean:
  - 사울은 창을 벽에 박았고
  - 사울은 창을 벽에 내리꽂았고
  lexicon: נכה / חנית / קיר
  rationale: 원문의 ‘쳤다/박았다’는 결과를 한국어에서 자연스럽게 풀어 ‘꽂다’로 옮겨, 창이 벽에 박히는 장면을 분명히 했습니다.
- source_word: וַיִּמָּלֵט בַּלַּיְלָה
  english_pob_choice: Then David fled and escaped that night
  chosen_korean: 다윗은 그날 밤 도망하여 피했습니다
  alternatives_korean:
  - 다윗은 그날 밤 달아나 벗어났습니다
  - 다윗은 그 밤에 도망쳐 살아났습니다
  lexicon: מלט / נס
  rationale: ‘도망하다’와 ‘피하다’를 함께 써서, 단순 이탈이 아니라 목숨을 건 탈출이라는 중첩된 의미를 살렸습니다.
theological_decisions:
- issue: 폭력 장면의 서술 방식
  chosen_reading: 의도와 결과를 모두 드러내되 과도하게 완곡하게 만들지 않았습니다.
  alternative_readings:
  - 직설적으로 ‘꿰뚫다’ 같은 표현을 써서 충격을 더 강조함
  - ‘공격하다’처럼 완화된 표현으로 일반화함
  rationale: 본문은 사울의 살해 의도를 분명히 보여 주므로, 폭력성을 유지하는 번역이 서사와 인물 평가를 더 정확히 전달합니다.
  doctrine_reference: 본문 서사 이해 / 인물 윤리 평가
- issue: ‘사울의 앞’ 표현
  chosen_reading: ‘사울의 앞에서’로 직역에 가까운 공간적·관계적 위협을 유지했습니다.
  alternative_readings:
  - ‘사울의 손에서’
  - ‘사울의 눈을 피해’
  rationale: מִפְּנֵי는 단순한 시선 회피보다 ‘~의 면전/앞’이라는 긴장감을 담으므로, 관계적 압박을 살리는 표현이 더 적절합니다.
  doctrine_reference: 서사적 문맥 / 히브리어 전치사 의미
