id: LEV.18.20
reference: Leviticus 18:20
source:
  edition: WLC
  text: וְ/אֶל אֵ֨שֶׁת֙ עֲמִֽיתְ/ךָ֔ לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/זָ֑רַע לְ/טָמְאָה בָֽ/הּ־־־׃
translation:
  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally 'You shall not give your lying for seed to your neighbor's wife.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  chosen: your neighbor’s wife
  alternatives:
  - the wife of your fellow
  - your associate’s wife
  lexicon: HALOT
  rationale: In this legal context עָמִית denotes another member of the community. 'Neighbor's wife' is specific and idiomatic.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  chosen: You shall not have sexual relations
  alternatives:
  - You shall not lie carnally
  - You shall not give a seminal emission
  lexicon: HALOT
  rationale: The collocation literally describes giving one's lying/emission as seed and functions as an idiom for sexual intercourse. Translating the idiom communicates the prohibition rather than obscuring it.
- source_word: לְטָמְאָה בָהּ
  chosen: and so defile yourself with her
  alternatives:
  - thereby make yourself unclean with her
  - to become unclean through her
  lexicon: HALOT
  rationale: This infinitive, not לְזָרַע, carries the defilement language and expresses the resulting or intended uncleanness of the addressee.
