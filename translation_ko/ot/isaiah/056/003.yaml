revisions:
- from: 낯선 사람이 야훼께 붙어 그분께 나아왔다고 해서 “야훼께서 반드시 나를 그의 백성에게서 갈라놓으실 것이다”라고 말하지 못하게 하십시오. 또한 내시는 “보십시오, 나는 마른 나무입니다”라고 말하지 못하게 하십시오.[a][b]
  to: 야훼께 붙은 이방인은 “야훼께서 반드시 나를 자기 백성에게서 갈라놓으실 것이다”라고 말하지 마십시오. 내시도 “보십시오, 나는 마른 나무입니다”라고 말하지 마십시오.
  rationale: 원문의 두 병행 금지문을 직접적인 합쇼체 금지로 재구성하고, ‘야훼께 붙은 이방인’이라는 분사 수식 관계를 보존했습니다. 신명, 내시, 마른 나무의 비유는 유지했으며, 본문에 없는 해석을 더하는 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:23Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 주어는 ‘야훼께 붙은 이방인’이며, 그가 말하지 않도록 하는 금지입니다. 초안의 ‘붙어 그분께 나아왔다고 해서’는 원문의 분사 수식과 금지 구문을 조건절 및 서술로 바꾸어 의미 관계를 흐립니다. יַבְדִּילַנִי의 강조는 ‘반드시’로 적절히 드러낼 수 있습니다.
  naturalness: ‘…라고 말하지 못하게 하십시오’는 누구에게 하는 명령인지 불명확하고 한국어 예언적 금지문으로도 부자연스럽습니다. 해당 당사자에게 직접 ‘말하지 마십시오’라고 하는 것이 현대 공적 합쇼체에 자연스럽습니다.
  terminology: יהוה는 초안의 표기 원칙에 따라 ‘야훼’로 일관되게 유지했습니다. בֶּן־הַנֵּכָר는 여기서 공동체 밖 출신인 사람을 가리키므로 ‘이방인’이 ‘낯선 사람’보다 정확합니다. הַסָּרִיס는 ‘내시’, עֵץ יָבֵשׁ는 ‘마른 나무’로 유지할 수 있습니다.
  issues:
  - severity: high
    issue: 첫 문장이 원문의 주어와 금지 구문을 ‘…나아왔다고 해서’라는 조건절과 비인칭적 통제 표현으로 바꿉니다.
    rationale: 히브리어는 ‘야훼께 붙은 이방인’이 스스로 말하지 않게 하는 두 개의 병행 금지(אַל־יֹאמַר)입니다. 수정은 이 구조를 보존합니다.
  - severity: medium
    issue: ‘낯선 사람’은 בֶּן הַנֵּכָר의 소속 밖 출신이라는 뜻을 충분히 전달하지 못합니다.
    rationale: 이 문맥에서는 단순히 낯선 사람이 아니라 이스라엘 공동체 밖의 외국 출신자를 뜻하므로 ‘이방인’이 더 정확합니다.
  - severity: low
    issue: 현행 각주는 본문 이해에 필수적이지 않고, 첫 각주의 ‘자발적으로 속하려는 상태’는 원문이 명시하지 않는 해석을 더합니다.
    rationale: 본문 자체로 의미가 충분하며, 불필요한 해석적 각주는 삭제하는 편이 안전합니다.
  revised_text: 야훼께 붙은 이방인은 “야훼께서 반드시 나를 자기 백성에게서 갈라놓으실 것이다”라고 말하지 마십시오. 내시도 “보십시오, 나는 마른 나무입니다”라고 말하지 마십시오.
