  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: ko
  text: 그때 랍사게가 그들에게 말했습니다. 「너희는 히스기야에게 이렇게 말하십시오. ‘큰 왕, 곧 앗수르 왕이 이렇게 말합니다. 네가 의지하고 있는 이 확신은 무엇입니까?’」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה / Rabshakeh
  english_pob_choice: the Rabshakeh
  chosen_korean: 랍사게
  alternatives_korean:
  - 라브사게
  - 랍사케
  lexicon: 고유명사
  rationale: 히브리어 관용 표기를 현대 음역으로 옮기되, 한국어 성경에서 널리 통용되는 형태를 우선했습니다.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  english_pob_choice: the great king
  chosen_korean: 큰 왕
  alternatives_korean:
  - 위대한 왕
  - 대왕
  lexicon: 고유명사/칭호
  rationale: 직역에 가깝게 옮겨 앗수르 왕의 과장된 자칭 권위를 드러냈습니다.
- source_word: בִּטָּחוֹן
  english_pob_choice: confidence
  chosen_korean: 신뢰
  alternatives_korean:
  - 믿음
  - 확신
  - 의지
  lexicon: 명사
  rationale: 문맥상 히스기야가 무엇을 근거로 버티는지 묻는 말이므로, 추상적 ‘confidence’보다 의지의 대상과 태도를 함께 드러내는 ‘신뢰’를 택했습니다.
- source_word: בָּטָחְתָּ
  english_pob_choice: you have trusted in
  chosen_korean: 네가 의지한
  alternatives_korean:
  - 네가 신뢰한
  - 네가 믿은
  lexicon: 동사
  rationale: 영어 POB의 수정된 ‘you have trusted in’을 반영해, 과거 완료적 뉘앙스를 살리면서도 한국어에서 자연스러운 현재 완료형 관형절로 처리했습니다.
theological_decisions:
- issue: 앗수르 왕의 자기호칭을 어떻게 드러낼 것인가
  chosen_reading: ‘큰 왕, 곧 앗수르 왕’으로 옮겨 그의 제국적 우월 주장과 오만한 선전을 그대로 살렸습니다.
  alternative_readings:
  - ‘위대한 왕’으로 완화
  - 호칭을 단순히 ‘앗수르 왕’만 표기
  rationale: 본문은 역사적 정보만이 아니라 조롱 섞인 권위 주장도 전하므로, 과장된 칭호를 보존하는 편이 원문 효과에 더 가깝습니다.
  doctrine_reference: 본문의 수사적/서사적 의도 보존
