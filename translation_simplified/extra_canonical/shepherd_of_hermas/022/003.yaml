base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/003.yaml
  text: So, walking alone, I was beseeching the Lord to bring to completion the revelations and the visions that he had shown me through his holy Church, so that he would strengthen me and give repentance to his servants who have stumbled, in order that his great and glorious name might be glorified, because he counted me worthy to show me his wonders.
translation:
  language: en
  text: As I walked alone, I pleaded with the Lord to complete the revelations and visions he had shown me through his holy Church. I asked him to strengthen me and grant repentance[a] to his servants who had stumbled, so that his great and glorious name would be honored. For he had considered me worthy to show me his wonders.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: So, walking alone, I was beseeching the Lord
  simplified_phrase: As I walked alone, I pleaded with the Lord
  preserved_meaning: He earnestly prayed to the Lord while walking by himself.
  reasoning_layer_used: POB translation and immediate syntax
  rationale: A direct finite clause replaces the awkward participial construction without weakening the plea.
- pob_phrase: bring to completion the revelations and the visions
  simplified_phrase: complete the revelations and visions
  preserved_meaning: He asks the Lord to finish the revelations and visions.
  reasoning_layer_used: POB source-driven wording
  rationale: The shorter wording retains both kinds of divine disclosure and the idea of completion.
- pob_phrase: in order that his great and glorious name might be glorified, because he counted me worthy to show me his wonders
  simplified_phrase: so that his great and glorious name would be honored. For he had considered me worthy to show me his wonders
  preserved_meaning: Honoring God's name remains the purpose, and God remains the one who shows the wonders.
  reasoning_layer_used: POB translation and independent grounding review
  rationale: The revised clauses preserve both the purpose relationship and God's revelatory action.
