  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: mistranslation
  tier: 1
  from: Take his garment[a], for he has put up security for a stranger[b]; and hold it in pledge for a foreign woman.
  to: Take his garment, for he has put up security for a stranger; take a pledge from him for a foreign woman.[a]
  rationale: The suffix on חַבְלֵהוּ is masculine singular and refers to the surety, not to “garment.” “Hold it in pledge” therefore supplies the wrong referent. “Take a pledge from him” naturally renders the pledge-taking verb while preserving the explicit personal suffix.
- timestamp: '2026-11-09T18:36:31Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
