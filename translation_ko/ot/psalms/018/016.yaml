  to: 그분은 높은 곳에서 손을 내밀어 나를 붙드셨고, 많은 물에서 나를 끌어내셨습니다.[a]
  rationale: 대상 히브리어 본문에 맞추어 본문을 전면 교체했습니다. ‘손을 내밀어’는 목적어가 명시되지 않은 יִשְׁלַח의 구출 문맥을 한국어로 자연스럽게 나타내며, ‘하늘’로 특정하지 않고 מִמָּרוֹם의 열린 이미지를 ‘높은 곳’으로 보존했습니다. 기존 18:15 관련 각주는 삭제하고, ‘많은 물’에 관한 유일한 관련 대안 각주를 올바른 위치에 배치했습니다.
