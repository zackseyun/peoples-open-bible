  to: But when the king came in to look at the guests reclining at the table[a][b], he saw there a man not wearing a wedding garment.
  rationale: The Greek phrase ἔνδυμα γάμου is singular and appears again in the very next verse (v. 12), where the draft translates it as 'a wedding garment.' Harmonizing to 'wearing a wedding garment' maintains lexical consistency across the immediate context and accurately reflects the singular noun. 'Wearing' is also a standard rendering for the perfect participle ἐνδεδυμένον with an accusative object. If the main text is updated to 'wearing a wedding garment' for consistency with verse 12, this alternative-reading footnote becomes redundant and should be deleted.
