    38. 그러므로 내가 네게 명령하고 네게 증언합니다. 네가 그들에게 증언하도록 하려는 것입니다. 네가 죽은 뒤에 네 자손이 그것을 훼손하여, 한 해를 364일로만 정하지 않을 것이기 때문입니다. 그러므로 그들은 새달과 때와 안식일과 절기에 관하여 잘못될 것이며, 모든 육체와 함께 모든 피를 먹을 것입니다.'
