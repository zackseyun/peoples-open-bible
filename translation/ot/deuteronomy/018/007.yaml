  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Gendered kinship term אֶחָיו
  chosen_reading: his brothers
  alternative_readings:
  - his fellow Levites
  rationale: The Hebrew uses a masculine kinship term. Per translation philosophy, gender-accurate rendering is preferred unless context clearly demands a generic paraphrase. Since the appositive 'the Levites' immediately clarifies the referent, 'his brothers' can be retained without confusion.
