id: PSA.135.11
reference: Psalms 135:11
source:
  edition: WLC
  text: לְ/סִיח֤וֹן מֶ֤לֶךְ הָ/אֱמֹרִ֗י וּ֭/לְ/עוֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן וּ֝/לְ/כֹ֗ל מַמְלְכ֥וֹת כְּנָֽעַן׀׃
translation:
  text: Sihon king of the Amorites, Og king of Bashan, and all the kingdoms of Canaan.
  philosophy: dynamic
lexical_decisions:
- source_word: לְ/סִיחוֹן
  chosen: Sihon
  alternatives:
  - Sihon
  - to Sihon
  lexicon: HALOT
  rationale: The prefixed lamed marks the direct object continuing the verbs from the preceding verse.
- source_word: מֶלֶךְ הָאֱמֹרִי
  chosen: king of the Amorites
  alternatives:
  - the Amorite king
  - king of the Amorite
  lexicon: HALOT
  rationale: Construct phrase naturally rendered 'king of the Amorites.' The gentilic with article refers to the people group, best expressed in English as the plural ethnic designation.
- source_word: וּלְ/עוֹג
  chosen: Og
  alternatives:
  - and Og
  - and to Og
  lexicon: HALOT
  rationale: The prefixed lamed marks the second direct object in the list.
- source_word: מֶלֶךְ הַבָּשָׁן
  chosen: king of Bashan
  alternatives:
  - the king of Bashan
  lexicon: HALOT
  rationale: Construct phrase rendered straightforwardly. English idiom does not require the article before 'king' here in a list of appositional titles.
- source_word: וּלְ/כֹל
  chosen: and all
  alternatives:
  - and all
  - and to all
  lexicon: HALOT
  rationale: 'The lamed continues to mark the direct objects: all the kingdoms of Canaan.'
- source_word: מַמְלְכוֹת
  chosen: kingdoms
  alternatives:
  - realms
  lexicon: HALOT
  rationale: מַמְלָכָה denotes a kingdom or royal domain. 'Kingdoms' is the standard and clearest rendering in this historical-geographical context.
- source_word: כְּנָעַן
  chosen: Canaan
  lexicon: HALOT
  rationale: Proper place name transliterated by standard English convention.
