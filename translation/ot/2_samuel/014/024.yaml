  from: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
  to: But the king said, “He must go to his own house, but he must not come into my presence[a].” So Absalom went to his own house and did not come into the king’s presence.
