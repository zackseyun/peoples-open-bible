  to: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust; you will seek me diligently, but I will be gone.[a]
  rationale: 'Retain “For now”: עַתָּה is formally “now,” and in this context it marks the present/immediate situation as the ground for Job’s expectation of death; “soon” is a plausible contextual implication but adds temporal precision not expressed by the word itself. The verse text is otherwise natural and source-faithful, including the burial image and the future-shaped “I will be gone.” The current first footnote is not actually misplaced: its marker after “dust” can validly signal a note on the preceding sentence, though it is unnecessary because the main renderings are clear idiomatic equivalents. The note on שִׁחֲרְתַּנִי is useful, but should be placed after the full final clause and should not make “but I will not be there” part of the alternative, since that changes the wording of וְאֵינֶנִּי rather than merely documenting the verb’s early-seeking nuance.'
