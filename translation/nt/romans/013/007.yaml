  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
translation:
  text: 'Pay everyone what you owe them: taxes to whom taxes are due, customs duties[a] to whom customs duties are due, respect[b] to whom respect is due, and honor to whom honor is due.'
