id: JOS.3.5
reference: Joshua 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוֹשֻׁ֛עַ אֶל הָ/עָ֖ם הִתְקַדָּ֑שׁוּ כִּ֣י מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה בְּ/קִרְבְּ/כֶ֖ם נִפְלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/005.yaml
  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: ko
  text: 그때 여호수아가 백성에게 말했습니다. “스스로를 성결하게 하십시오[a]. 내일 야훼께서 여러분 가운데에서 놀라운 일들[b]을 행하실 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스스로를 성결하게 하십시오’는 히브리어 הִתְקַדָּשׁוּ를 옮긴 말로, 야훼께서 행하실 일을 앞두고 자신을 거룩하게 구별하고 준비하라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נִפְלָאוֹת는 ‘이적’보다 넓게 ‘놀라운 일들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֶל הָעָם
  english_pob_choice: Then Joshua said to the people
  chosen_korean: 그때 여호수아가 백성에게 말했습니다
  alternatives_korean:
  - 그때 여호수아가 백성에게 말했습니다,
  - 그리고 여호수아가 백성에게 말했습니다
  lexicon: אמר
  rationale: 서사적 연결וַיֹּאמֶר를 자연스러운 과거 서술인 「그때」로 옮기고, אֶל הָעָם는 대상 표지를 살려 「백성에게」로 렌더링했습니다.
- source_word: הִתְקַדָּשׁוּ
  english_pob_choice: Consecrate yourselves
  chosen_korean: 자신을 거룩하게 하십시오
  alternatives_korean:
  - 스스로를 성별하십시오
  - 몸과 마음을 정결하게 하십시오
  lexicon: קדש
  rationale: קדש의 핵심인 ‘거룩하게 함/구별됨’을 직접 드러내되, 한국어에서 종교적 관용어인 ‘성별하다’보다 본문의 동사를 더 투명하게 보여 주는 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 이 번역은 본문의 고유명사 יהוה를 학술적 표기인 「야훼」로 직접 반영하며, POB 기본 용례를 따릅니다.
- source_word: נִפְלָאוֹת
  english_pob_choice: wonders
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 기이한 일들
  - 이적들
  lexicon: פלא
  rationale: פלא의 놀라움과 경이로움을 살리되, 과도하게 기술적이거나 전통교회 용어에 치우친 「이적」보다 일반 독자가 이해하기 쉬운 복수형 표현을 사용했습니다.
theological_decisions:
- issue: 거룩하게 하라의 의미 범위
  chosen_reading: 의례적 정결만이 아니라, 야훼의 임재와 행하실 일을 앞두고 자신을 구별하여 준비하라는 촉구로 옮겼습니다.
  alternative_readings:
  - 단순한 몸의 정결을 요구하는 말로 축소
  - 윤리적 자기개혁으로만 확장
  rationale: קדש는 문맥상 내일 야훼의 행위를 맞이할 준비로서의 ‘구별됨’을 포함하므로, 의미를 축소하지 않으면서도 과도한 확장도 피했습니다.
  doctrine_reference: 출 19:10-15의 거룩한 임재 준비와 연결되는 성화/준비의 문맥
- issue: 야훼께서 행하실 놀라운 일들
  chosen_reading: 미래의 단일 사건이 아니라, 야훼의 주권적 개입이 복수의 ‘놀라운 일들’로 나타날 수 있음을 살렸습니다.
  alternative_readings:
  - ‘놀라운 일’을 단수로 단정
  - 기적적 행위로만 제한
  rationale: 히브리어 복수형 נִפְלָאוֹת는 사건의 풍성함과 경이로움을 함께 암시하므로, 복수 표현을 유지하는 것이 더 충실합니다.
  doctrine_reference: 하나님의 주권적 행위와 표적의 복수적 표현
