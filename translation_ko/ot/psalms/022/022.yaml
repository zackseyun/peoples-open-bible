  text: ה֭וֹשִׁיעֵ/נִי מִ/פִּ֣י אַרְיֵ֑ה וּ/מִ/קַּרְנֵ֖י רֵמִ֣ים עֲנִיתָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/022.yaml
  text: I will declare your name to my brothers[a]; in the midst of the assembly I will praise you.
  footnotes:
  - marker: a
    text: Or 'wild bulls' or 'aurochs'; the Hebrew refers to a powerful wild bovine.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause can be understood as a sudden declaration of answered prayer: ''you have answered me,'' marking a turn from plea to confidence.'
    reason: alternative_reading
translation:
  language: ko
  text: 제가 제 형제들에게 주의 이름을 선포하고, 회중 가운데서 주를 찬양하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘제 형제들에게’입니다. 문맥에서 가족 호칭을 포괄적으로 이해할 경우 ‘제 형제자매들에게’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  english_pob_choice: Save me
  chosen_korean: 저를 구하소서
  alternatives_korean:
  - 저를 살려 주소서
  - 저를 건져 주소서
  lexicon: HALOT
  rationale: 히필 명령형 1인칭 목적어의 직접적 간구를 반영하되, 시편 기도문의 호소력을 살리기 위해 합쇼체 청원형으로 옮겼습니다.
- source_word: מִפִּי אַרְיֵה
  english_pob_choice: from the mouth of the lion
  chosen_korean: 사자의 입에서
  alternatives_korean:
  - 사자의 입으로부터
  - 사자의 턱에서
  lexicon: HALOT
  rationale: 히브리어의 ‘입’을 그대로 살려 포식자의 위협을 생생하게 보존했습니다.
- source_word: רֵמִים
  english_pob_choice: the wild oxen
  chosen_korean: 들소의 뿔들
  alternatives_korean:
  - 야생 황소의 뿔들
  - 들소들
  lexicon: HALOT
  rationale: POB의 각주처럼 רֵמִים은 힘센 야생 소과 동물을 가리키므로, 한국어에서는 본문 이미지인 ‘뿔’과 결합해 강한 위협의 장면을 유지했습니다.
- source_word: עֲנִיתָנִי
  english_pob_choice: you have answered me
  chosen_korean: 저를 건져 내셨습니다
  alternatives_korean:
  - 저에게 응답하셨습니다
  - 저를 응답하셨습니다
  lexicon: HALOT
  rationale: 완료형이지만 이 절에서는 갑작스러운 응답 선언으로 읽히는 긴장이 중요합니다. 한국어에서는 영어 POB의 ‘you have answered me’보다 시편의 구원 결과를 자연스럽게 드러내는 ‘건져 내셨습니다’로 그 전환을 보존했습니다.
theological_decisions:
- issue: 마지막 절의 완료형을 간구로 볼지, 응답 선언으로 볼지
  chosen_reading: 응답 선언과 구원 확신으로 읽었습니다.
  alternative_readings:
  - 계속되는 간구로 읽어 ‘저를 건지소서’로 옮길 수 있습니다.
  rationale: 히브리어 완료형 עֲנִיתָנִי는 동작이 이미 이루어진 응답을 가리키며, 시편의 급전환과 다음 절의 선포를 준비합니다. 따라서 단순한 반복 간구로 평평하게 만들지 않고 응답의 확신을 살렸습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
