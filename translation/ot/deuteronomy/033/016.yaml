  meaning_decisions:
  - source_phrase: וּמִמֶּגֶד אֶרֶץ וּמְלֹאָהּ
    prior_rendering: and with the choicest things of the earth and its fullness
    new_rendering: and with the choicest gifts of the earth and all its abundance
    rationale: The continuing blessing concerns the earth’s bestowed bounty; “gifts” and “abundance” convey that meaning more clearly than the abstract “things” and “fullness.”
  - source_phrase: שֹׁכְנִי סְנֶה
    prior_rendering: the one who dwelt in the bush
    new_rendering: him who dwelt in the burning bush
    rationale: Supplying “burning” makes the divine title’s unmistakable Exodus allusion recognizable without replacing its image.
  - source_phrase: תָּבוֹאתָה לְרֹאשׁ יוֹסֵף
    prior_rendering: may it come on the head of Joseph
    new_rendering: may these blessings rest on the head of Joseph
    rationale: The singular Hebrew verb gathers the preceding gifts into a collective blessing; the English now names that referent.
  - source_phrase: נְזִיר אֶחָיו
    prior_rendering: the one set apart from his brothers
    new_rendering: the one distinguished among his brothers
    rationale: The blessing’s honorific context, echoed in Genesis 49:26, favors Joseph’s distinction among his brothers rather than merely his physical separation from them; the serious alternatives remain in a note.
