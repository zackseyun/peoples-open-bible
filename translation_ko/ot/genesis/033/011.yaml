  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: ko
  text: “부디 당신께 가져온 이 제 예물을[a] 받아 주십시오. 하나님께서 제게 은혜를 베푸셨고, 제게는 모든 것이 있기 때문입니다.” 야곱이 에서에게 강권하니[b], 에서가 그것을 받았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예물’은 히브리어 בְּרָכָה(‘축복’)가 이 문맥에서 실제로 건네는 선물이나 예물을 가리키는 용법을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 야곱이 에서에게 선물을 받도록 강하게 권했다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: בִּרְכָתִי
  english_pob_choice: my gift
  chosen_korean: 내 예물
  alternatives_korean:
  - 내 선물
  - 내 축복
  lexicon: ברכה
  rationale: 문맥상 에서에게 보내는 물품이므로 ‘축복’의 문자적 의미를 그대로 살리기보다, POB의 영어 선택인 “gift”를 반영해 ‘예물’로 옮겼습니다.
- source_word: הֻבָאת לָךְ
  english_pob_choice: that has been brought to you
  chosen_korean: 당신에게로 가져온
  alternatives_korean:
