id: PRO.18.19
reference: Proverbs 18:19
source:
  edition: WLC
  text: אָ֗ח נִפְשָׁ֥ע מִ/קִּרְיַת עֹ֑ז ו/מדונים כִּ/בְרִ֥יחַ אַרְמֽוֹן־׃
translation:
  text: An offended brother[a] is harder to win than a fortified city, and quarrels are like the bar across a citadel's gate.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “A wronged brother.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָח
  chosen: brother
  alternatives:
  - a brother
  - a kinsman
  lexicon: HALOT
  rationale: The noun literally means 'brother.' In Proverbs it can denote a literal brother or a close relational counterpart. 'Brother' preserves the Hebrew image and the proverb's force better than broadening to 'kinsman' in the main text.
- source_word: נִפְשָׁע
  chosen: offended
  alternatives:
  - wronged
  - alienated
  - rebelled against
  lexicon: HALOT
  rationale: From פשע, here likely describing one who has been offended or estranged in relationship. 'Offended' is idiomatic in English proverb style and fits the context of relational breach. 'Wronged' is possible and preserved as an alternative nuance, but 'offended' better matches the traditional sense without overstating legal injury.
- source_word: מִקִּרְיַת עֹז
  chosen: harder to win than a fortified city
  alternatives:
  - than a strong city
  - more than a city of strength
  lexicon: HALOT
  rationale: The Hebrew comparison is elliptical; English requires a supplied comparative predicate, but “back” should not be added.
- source_word: וּמְדֹנִים
  chosen: and quarrels
  alternatives:
  - and contentions
  - and disputes
  lexicon: HALOT
  rationale: The plural noun denotes strifes or contentions. 'Quarrels' is clear, contemporary, and suits proverbial style.
- source_word: כִּבְרִיחַ
  chosen: are like the bar of
  alternatives:
  - are like a bar of
  - like the bolt of
  lexicon: HALOT
  rationale: The singular securing-bar image is retained without converting it to an English plural.
- source_word: אַרְמוֹן
  chosen: a citadel
  alternatives:
  - a palace
  - a fortress
  lexicon: HALOT
  rationale: The term can mean palace or fortified stronghold. In this context of defensive imagery ('fortified city,' 'bars'), 'citadel' best preserves the sense of an imposing, secured stronghold. 'Palace' is possible lexically but weaker in the immediate metaphor.
