  chosen_reading: righteousness
  alternative_readings:
  - justice
  rationale: The doctrine guidance notes that righteousness/justice can both be valid renderings for cognate terms. Here the psalm emphasizes God's morally right and faithful action in answering prayer, so 'righteousness' is retained in the main text, with 'justice' preserved as a lexical alternative.
