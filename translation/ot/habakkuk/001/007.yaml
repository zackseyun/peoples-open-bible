id: HAB.1.7
reference: Habakkuk 1:7
source:
  edition: WLC
  text: אָיֹ֥ם וְ/נוֹרָ֖א ה֑וּא מִמֶּ֕/נּוּ מִשְׁפָּט֥/וֹ וּ/שְׂאֵת֖/וֹ יֵצֵֽא׃
translation:
  text: It is dreadful and fearsome; it sets its own standards of justice and claims its own authority.
  philosophy: dynamic
lexical_decisions:
- source_word: אָיֹם
  chosen: dreadful
  alternatives:
  - terrible
  - awesome
  lexicon: HALOT
  rationale: Conveys something inspiring dread or terror. 'Dreadful' fits the threatening context of the Chaldeans better than modern 'awesome,' and avoids implying mere bad quality as in some uses of 'terrible'.
- source_word: וְנוֹרָא
  chosen: fearsome
  alternatives:
  - terrifying
  - to be feared
  lexicon: HALOT
  rationale: Paired with אָיֹם for intensification. 'Fearsome' preserves the adjectival force in natural English and avoids overtranslation.
- source_word: הוּא
  chosen: it is
  alternatives:
  - he is
  lexicon: HALOT
  rationale: Although grammatically masculine singular, the referent is the nation/people just described, best represented in English as a collective 'it' here rather than a personal 'he'.
- source_word: מִמֶּנּוּ
  chosen: from itself
  alternatives:
  - from him
  - from them
  - of itself
  lexicon: HALOT
  rationale: The preposition marks source/origin. 'From itself' captures the sense that this nation's standards arise internally rather than from any higher authority.
- source_word: מִשְׁפָּטוֹ
  chosen: its justice
  alternatives:
  - its judgment
  - its legal claim
  - its justice-system
  lexicon: HALOT
  rationale: מִשְׁפָּט can mean judgment or justice. Here it refers to the nation's exercise of judicial/political authority. 'Justice' is concise and idiomatic, though the sense includes its self-derived judgment.
- source_word: וּשְׂאֵתוֹ
  chosen: its authority
  alternatives:
  - its dignity
  - its eminence
  - its majesty
  lexicon: HALOT
  rationale: Here the noun denotes elevated standing or governing authority claimed by the nation itself. 'Authority' best communicates the political force in parallel with its self-derived justice; 'dignity' remains a live alternative.
- source_word: יֵצֵא
  chosen: come
  alternatives:
  - proceed
  - issue
  - come forth
  lexicon: HALOT
  rationale: The singular verb describes the paired qualities as arising from the nation itself. 'Come' is natural modern English.
