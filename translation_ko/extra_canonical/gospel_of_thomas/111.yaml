  rationale: 병렬된 ‘하늘과 땅’에 미래 동사와 ‘너희 앞에서’를 함께 적용하고, ‘사는 이’ 및 ‘찾는 이’의 현재적 표현을 복원했습니다. 두 번째 도입문은 콥트어의 현재형 외부 인용과 긍정 답변을 기대하는 수사의문문을 반영했습니다. 각주도 해당 표현에 맞추어 보완하되, 본문이 지닌 신학적·편집사적 불확실성을 단정하지 않도록 했습니다.
