translation:
  language: en
  text: 'Therefore, let us move beyond the basic teaching about the Messiah and be carried forward to maturity. Let us not lay the same foundation again: reorientation[r1] away from dead works[a] and putting our faith in God.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dead works” may mean works that are lifeless or works that lead to death.
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: leaving the elementary message about the Messiah
  simplified_phrase: move beyond the basic teaching about the Messiah
  preserved_meaning: The readers are to advance beyond foundational instruction without rejecting it.
  reasoning_layer_used: POB theological decision and lexical alternatives
  rationale: “Move beyond the basic teaching” makes progression, rather than abandonment, immediately clear.
- pob_phrase: let us be carried on to maturity
  simplified_phrase: be carried forward to maturity
  preserved_meaning: The passive image presents progress as something not achieved by self-effort alone.
  reasoning_layer_used: POB lexical and theological decisions
  rationale: “Carried forward” retains the Greek passive while sounding natural in modern English.
interpretive_expansions:
- pob_phrase: leaving
  rendering: move beyond
  claim: The command concerns advancing beyond the basics as the present focus, not rejecting them.
  evidence:
