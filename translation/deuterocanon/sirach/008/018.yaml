translation:
  text: Do not bring a case against a judge, for he will judge as he pleases.
  philosophy: dynamic
lexical_decisions:
- source_word: אַל
  chosen: Do not
  alternatives:
  - Do not ever
  - You shall not
  lexicon: HALOT
  rationale: Standard negative prohibition introducing wisdom instruction; simple imperative English best matches the concise Hebrew warning.
- source_word: תּשָּׁפֵט
  chosen: contend
  alternatives:
  - litigate
  - enter into judgment
  - dispute
  lexicon: HALOT
  rationale: Although the root שפט often means 'judge,' with עִם plus 'a judge' the sense is adversarial legal contention rather than the act of judging. 'Contend' preserves the warning against taking a case up against a judicial authority without over-specifying courtroom procedure.
- source_word: עִם שׁוֹפֵט
  chosen: with a judge
  alternatives:
  - against a judge
  lexicon: HALOT
  rationale: The preposition is literally 'with,' but in English the adversarial sense is carried by 'contend with.' This keeps the Hebrew construction visible while yielding natural English.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - since
  lexicon: HALOT
  rationale: Introduces the reason for the prohibition; 'for' is concise and fits wisdom style.
- source_word: כִּרְצוֹנוֹ
  chosen: according to his own will
  alternatives:
  - as he pleases
  - according to his desire
  lexicon: HALOT
  rationale: רָצוֹן here denotes personal will or pleasure. 'According to his own will' preserves the warning that the judge's decision follows his own preference or authority. 'As he pleases' is possible but slightly more idiomatic and less transparent.
- source_word: יִשְׁפֹּט
  chosen: he will judge
  alternatives:
  - he will decide
  - he will render judgment
  lexicon: HALOT
  rationale: The same root as earlier is retained for consistency. 'Judge' keeps the legal frame explicit.
