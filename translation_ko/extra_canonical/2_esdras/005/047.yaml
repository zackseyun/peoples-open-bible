  source_fidelity: 라틴어의 두 접속사(Et dixit, et ego) 가운데 인용문 내부의 et가 초안에서 반영되지 않았습니다. 또한 완료형 dedi는 한국어 과거형으로 옮기는 편이 정확합니다. ‘matricem’은 문맥상 ‘자궁’으로 직역한 것이 적절합니다.
