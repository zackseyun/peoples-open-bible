id: PRO.21.1
reference: Proverbs 21:1
source:
  edition: WLC
  text: פַּלְגֵי מַ֣יִם לֶב מֶ֭לֶךְ בְּ/יַד יְהוָ֑ה עַֽל כָּל אֲשֶׁ֖ר יַחְפֹּ֣ץ יַטֶּֽ/נּוּ־־־־־׃
translation:
  text: A king’s heart is like channels of water[a] in Yahweh’s hand; he directs it wherever he pleases.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The image is of irrigation channels whose flow can be redirected.
    reason: cultural_note
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  chosen: channels of water
  alternatives:
  - streams of water
  - watercourses
  lexicon: HALOT
  rationale: פֶּלֶג commonly refers to divided streams, channels, or watercourses rather than water in general. 'Channels of water' preserves the image of directed irrigation flow and fits the following verb 'turns.'
- source_word: לֶב מֶלֶךְ
  chosen: a king’s heart
  alternatives:
  - the heart of a king
  - the king’s heart
  lexicon: HALOT
  rationale: Construct phrase meaning 'heart of a king.' The indefinite 'a king’s heart' suits proverbial style, expressing a general truth rather than referring to one specific king.
- source_word: בְּיַד יְהוָה
  chosen: in Yahweh’s hand
  alternatives:
  - in the LORD’s hand
  lexicon: HALOT
  rationale: Natural English retains the source metaphor of control.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: עַל כָּל אֲשֶׁר
  chosen: wherever
  alternatives:
  - to whatever
  - toward all that
  lexicon: HALOT
  rationale: The phrase literally means 'upon all that/whatever,' but in context with נָטָה ('turn, incline') it idiomatically expresses direction toward any destination the subject chooses. 'Wherever' gives clear modern English while preserving the sense.
- source_word: יַחְפֹּץ
  chosen: he pleases
  alternatives:
  - he pleases
  - he wills
  lexicon: HALOT
  rationale: Idiomatic in this directional clause.
- source_word: יַטֶּנּוּ
  chosen: he directs it
  alternatives:
  - he directs it
  - he inclines it
  lexicon: HALOT
  rationale: Faithfully expresses the causative turning/directing sense and suits the image.
