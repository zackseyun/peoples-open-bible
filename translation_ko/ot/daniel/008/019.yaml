base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/019.yaml
  text: Then he said, “Look, I am making known to you what will happen in the latter part of the indignation, for the end is for the appointed time.”
translation:
  language: ko
  text: 그가 말했습니다. 「보십시오, 내가 당신에게 진노의 끝 무렵에 일어날 일을 알려 주고 있습니다. 이는 정해진 때에 끝이 있기 때문입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי / English POB 'Look'
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: הִנְנִי
  rationale: 예언적 화법의 주의를 끄는 감탄을 현대 합쇼체로 살리기 위해, 구어적이지만 공손한 '보십시오'를 택했습니다. 영어 POB의 'Look'을 기계적으로 따르되 한국어 어법에 맞게 다듬었습니다.
- source_word: מוֹדִיעֲךָ
  english_pob_choice: I am making known to you
  chosen_korean: 알려 주고 있습니다
  alternatives_korean:
  - 알리고 있습니다
  - 알려 드리고 있습니다
  lexicon: ידע/הודיע
  rationale: 지식 전달의 진행성을 드러내는 현재 진행형을 살리고, 수신자가 다니엘임을 고려해 자연스럽게 '알려 주고 있습니다'로 옮겼습니다.
- source_word: בְּאַחֲרִית הַזָּעַם
  english_pob_choice: in the latter part of the indignation
  chosen_korean: 진노의 끝 무렵에
  alternatives_korean:
  - 격노의 마지막에
  - 분노의 끝에
  lexicon: אַחֲרִית + זַעַם
  rationale: זַעַם은 단순 감정 분노보다 하나님의 심판적 '진노'를 가리키는 문맥이므로, 문어적이고 신학적으로 더 정확한 '진노'를 사용했습니다. 'latter part'는 시간적 종결감을 살려 '끝 무렵'으로 옮겼습니다.
- source_word: לְמוֹעֵד קֵץ
  english_pob_choice: for the end is for the appointed time
  chosen_korean: 끝이 정해진 때에 있기 때문입니다
  alternatives_korean:
  - 끝은 정해진 때를 위한 것이기 때문입니다
  - 끝이 예정된 때를 향하기 때문입니다
  lexicon: מוֹעֵד + קֵץ
  rationale: 히브리어의 전치사문을 자연스러운 이유절로 풀어, 'appointed time'의 정해진 시점을 '정해진 때'로 살렸습니다. POB의 수정된 영어 문장처럼 'for the appointed time'의 관념을 직접 반영했습니다.
theological_decisions:
- issue: '''indignation''의 신학적 뉘앙스'
  chosen_reading: 여기서 '진노'는 인간 일반 감정보다 하나님의 심판적 분노를 가리키는 예언적 표현으로 읽었습니다.
  alternative_readings:
  - 단순한 격분
  - 역사적 분노
  rationale: 다니엘 8장의 문맥은 역사 사건 뒤의 하나님의 심판 섭리를 말하므로, 일반 감정어보다 종말론적·심판적 의미를 유지하는 번역이 적절합니다.
  doctrine_reference: 다니엘 8장 문맥 및 예언서의 신적 진노 용례
