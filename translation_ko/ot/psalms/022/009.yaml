revisions:
- from: “야훼께 맡기십시오. 그러면 그분이 그를 건져 주실 것입니다. 그분이 그를 구원해 주실 것입니다. 그분은 그를 기뻐하시기 때문입니다!”[a]
  to: “참으로 주님은 나를 모태에서 나오게 하신 분이시며, 어머니의 젖을 먹을 때 나를 안전하게 하신 분이십니다.”[a]
  rationale: 히브리어의 강조된 2인칭 주어와 두 분사를 ‘주님은 … 하신 분이시며, … 하신 분이십니다’로 재현했습니다. גֹחִי는 출산의 구체적 이미지에 맞추어 ‘모태에서 나오게 하신’으로, מַבְטִיחִי는 유아기 문맥에서 ‘안전하게 하신’으로 옮겼습니다. 후자는 ‘신뢰하게 하신’으로도 해석될 수 있으므로 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:06:36Z'
