id: GEN.16.7
reference: Genesis 16:7
source:
  edition: WLC
  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
translation:
  text: The angel of Yahweh found her by a spring in the wilderness—the spring on the road to Shur.
  philosophy: dynamic
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  chosen: found her
  alternatives:
  - came upon her
  - encountered her
  lexicon: HALOT
  rationale: The verb מצא in the waw-consecutive narrative form most naturally means 'found.' The suffix marks a feminine singular object, referring to Hagar. 'Found her' is idiomatic and preserves the narrative sense without overinterpreting the encounter.
- source_word: מַלְאַךְ יְהוָה
  chosen: the angel of the LORD
  alternatives:
  - the messenger of the LORD
  lexicon: HALOT
  rationale: מַלְאַךְ can mean 'messenger' or 'angel.' In this narrative context, 'angel' is the established and contextually appropriate rendering for a divine messenger. יְהוָה is rendered 'the LORD' per doctrine guidelines for the divine name.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: עַל עֵין הַמַּיִם
  chosen: by a spring of water
  alternatives:
  - by a water spring
  - by a fountain of water
  - at a spring of water
  lexicon: HALOT
  rationale: עַיִן can denote an eye or a spring/source of water. Here, with הַמַּיִם and the wilderness setting, 'spring' is clearly intended. 'By' renders עַל idiomatically in English for location near a water source.
- source_word: בַּמִּדְבָּר
  chosen: in the wilderness
  alternatives:
  - in the desert
  lexicon: HALOT
  rationale: מִדְבָּר often denotes wilderness or steppe rather than a sand desert specifically. 'Wilderness' is the broader and more accurate English choice in biblical narrative.
- source_word: עַל הָעַיִן
  chosen: by the spring
  alternatives:
  - at the spring
  - by the fountain
  lexicon: HALOT
  rationale: The repeated עַיִן refers back to the same water source. Rendering it again as 'spring' preserves lexical consistency and the localizing function of the phrase.
- source_word: בְּדֶרֶךְ שׁוּר
  chosen: on the way to Shur
  alternatives:
  - on the road to Shur
  - by the way of Shur
  lexicon: HALOT
  rationale: דֶּרֶךְ commonly means 'way' or 'road.' 'On the way to Shur' is natural English and fits the directional/topographical sense. Shur is a place name and is transliterated.
