  meaning_decisions:
  - source_phrase: ἐπὶ τὴν παρθένον αὐτοῦ … γαμείτωσαν
    prior_rendering: toward his virgin … Let them marry
    new_rendering: his virgin daughter … Let the couple marry
    rationale: The causative marriage verb in verse 38 favors a father or guardian deciding about a daughter's marriage; identifying the couple prevents the plural command from being mistaken as referring to the father and daughter.
  - source_phrase: ἐὰν ᾖ ὑπέρακμος
    prior_rendering: if she is past her youth
    new_rendering: if she is past the prime of youth
    rationale: The adjective concerns being beyond youth's prime, not necessarily having ceased to be young; the alternative passion-related interpretation is noted.
  - source_phrase: καὶ οὕτως ὀφείλει γίνεσθαι
    prior_rendering: and it ought to be so
    new_rendering: and marriage ought to take place
    rationale: Marriage is the understood event, and naming it clarifies the condition without specifying what circumstances make it necessary.
