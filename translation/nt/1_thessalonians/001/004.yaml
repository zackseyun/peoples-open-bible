  chosen_reading: election
  alternative_readings:
  - being chosen
  - God's choice of you
  rationale: The verse affirms God's choosing of the Thessalonian believers, but the translation should not resolve broader Calvinist/Arminian debates beyond the text. Retaining 'election' preserves Paul's wording and theological tension without interpretive expansion.
