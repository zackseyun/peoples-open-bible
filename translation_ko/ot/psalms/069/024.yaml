  to: 주의 분노를 그들 위에 쏟으시고, 주의 타오르는 진노가 그들을 덮치게 하소서.
  rationale: 히브리어 명령/청원인 שְׁפָךְ를 ‘쏟으시고’로, זַעְמְךָ를 ‘주의 분노’로 옮겼습니다. חֲרוֹן אַפְּךָ의 불타는 열기 이미지는 ‘주의 타오르는 진노’로 보존했으며, 히필 יַשִּׂיגֵם의 ‘따라잡다/덮치다’라는 심판의 역동성은 ‘그들을 덮치게 하소서’로 옮겼습니다. 현 주석은 다른 절의 내용에 관한 것이므로 삭제했습니다.
