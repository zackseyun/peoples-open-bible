  to: 그리고 살아 있으면서 나를 믿는 사람은 누구나 영원히 죽지 않을 것입니다. 이것을 믿습니까?
  rationale: 첫 번째 현재분사 ζῶν을 ‘살아 있으면서’로 보충하여 원문의 병렬 수식 구조를 회복했습니다. 강한 부정과 영속성을 한국어의 자연스러운 표현인 ‘영원히 죽지 않을 것입니다’로 유지했으며, 죽음의 성격에 관한 해석은 추가하지 않았습니다.
