  text: He will bind up his wounds over the souls of his sons, and at every cry his inward parts will be troubled.
translation:
  language: ko
  text: 그는 아들들의 영혼을 두고[a] 자기 상처를 싸맬 것이며, 모든 부르짖음마다 그의 내장이[b] 동요할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 περὶ는 단순한 공간적 위치가 아니라 ‘~을 두고’, ‘~에 관하여’라는 관계를 나타냅니다. ψυχή(‘영혼’)는 문맥에 따라 생명이나 목숨을 뜻할 수도 있습니다.
    reason: source_note
  - marker: b
    text: σπλάγχνα는 문자적으로 ‘내장’이지만, 성서적 문맥에서는 깊은 정서의 중심을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ψυχῶν υἱῶν
  english_pob_choice: over the souls of his sons
  chosen_korean: 그의 아들들의 혼을 두고
  alternatives_korean:
  - 그의 아들들의 영혼 위에
  - 그의 아들들의 목숨을 두고
  lexicon: ψυχή
  rationale: source의 περὶ는 단순한 공간적 '위에'보다 ‘~을 두고/~에 관하여’의 관계를 드러내므로, POB의 over를 한국어 조사구로 옮겨 원문의 관여 대상을 살렸습니다.
- source_word: καταδεσμεύσει τραύματα αὐτοῦ
  english_pob_choice: he will bind up his wounds
  chosen_korean: 자기의 상처를 감싸매고
  alternatives_korean:
  - 자기의 상처를 묶고
  - 자기의 상처를 싸매고
  lexicon: καταδεσμεύω
  rationale: 동사는 상처를 ‘묶다’의 직접성보다 ‘붕대처럼 감싸매다’의 치료 행위를 가리키므로, 의미를 살리면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: ἐπὶ πάσῃ βοῇ
  english_pob_choice: at every cry
  chosen_korean: 모든 외침마다
  alternatives_korean:
  - 모든 부르짖음마다
  - 외침이 날 때마다
  lexicon: βοή
  rationale: βοή는 단순한 소리보다 고통이나 절박함이 섞인 외침을 가리킬 수 있어, ‘외침’으로 두되 반복성을 ‘-마다’로 분명히 했습니다.
- source_word: σπλάγχνα αὐτοῦ
  english_pob_choice: his inward parts
  chosen_korean: 그의 내장이 흔들릴 것입니다
  alternatives_korean:
  - 그의 내면이 흔들릴 것입니다
  - 그의 심장이 뒤흔들릴 것입니다
  lexicon: σπλάγχνον
  rationale: σπλάγχνα는 문자적으로는 몸의 깊은 장기이면서도 정서적 동요의 중심을 뜻하므로, POB의 inward parts를 따라 ‘내장’으로 두고 동요를 동사로 풀었습니다.
theological_decisions:
- issue: 감정/신체 어휘의 직역성
  chosen_reading: ‘내장’과 ‘흔들릴 것입니다’를 통해, 동정과 고통의 반응이 추상적 ‘마음’이 아니라 몸의 깊은 곳에서 일어나는 것으로 표현했습니다.
  alternative_readings:
  - ‘마음이 동요될 것입니다’로 완곡화
  - ‘속이 뒤집힐 것입니다’로 구어화
  rationale: 시락 30:7의 σπλάγχνα는 히브리적 감정-신체 통합을 반영하므로, 과도한 심리화나 속어화를 피하고 원문의 강도를 보존했습니다.
  doctrine_reference: 성서 인류학의 정서-신체 통합 표현
- issue: 관계 전치사 περὶ의 처리
  chosen_reading: ‘~을 두고’로 옮겨, 아들의 영혼을 위한/관련된 그의 행동이라는 관계를 살렸습니다.
  alternative_readings:
  - ‘~을 위해’
  - ‘~에 관하여’
  rationale: 영문 POB의 over를 단순 위치로 오해하지 않게 하면서도, 본문의 애도·염려의 방향성을 드러내는 표현이기 때문입니다.
  doctrine_reference: 문맥 충실 번역 원칙
