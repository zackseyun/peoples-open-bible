  source_fidelity: 히브리어 לְהַטּוֹת מִשְׁפַּט גָּבֶר는 ‘한 사람의 정의/재판을 굽히다, 왜곡하다’라는 뜻입니다. 현행안의 ‘굽게 하다’는 어근의 방향성은 반영하지만, ‘정의를 굽게 하다’는 현대 한국어에서 결합이 다소 부자연스럽습니다. ‘왜곡하다’는 משפט에 대한 부당한 사법적 처리라는 문맥을 정확히 전달합니다.
  naturalness: ‘지극히 높으신 이’보다 존칭 명사인 ‘지극히 높으신 분’이 현대 표준 한국어에서 더 자연스럽습니다. 절 자체는 앞뒤 문장에 이어지는 부정사적 열거이므로 ‘것입니다’ 같은 완결 서술보다 명사형과 줄표를 유지하는 편이 본문 구조에 맞습니다.
