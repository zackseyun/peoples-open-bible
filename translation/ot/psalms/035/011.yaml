id: PSA.35.11
reference: Psalms 35:11
source:
  edition: WLC
  text: יְ֭קוּמוּ/ן עֵדֵ֣י חָמָ֑ס אֲשֶׁ֥ר לֹא יָ֝דַ֗עְתִּי יִשְׁאָלֽוּ/נִי־׃
translation:
  text: Malicious witnesses[a] come forward; they question me about things I do not know.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “witnesses of violence,” describing witnesses whose testimony is wrongful and injurious.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקוּמוּן
  chosen: rise up
  alternatives:
  - stand up
  - arise
  lexicon: HALOT
  rationale: From קום, here describing hostile witnesses coming forward or taking their stand. 'Rise up' preserves the vivid legal/adversarial sense without over-paraphrasing.
- source_word: עֵדֵי חָמָס
  chosen: malicious witnesses
  alternatives:
  - false witnesses
  - witnesses of violence
  - malicious witnesses
  lexicon: HALOT
  rationale: Natural English for witnesses characterized by wrongful and injurious hostility, without limiting the phrase to false testimony.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  chosen: things I do not know
  alternatives:
  - what I did not know
  - matters unknown to me
  lexicon: HALOT
  rationale: The relative clause lacks an explicit object in Hebrew. English idiom requires one, so 'things' is supplied minimally. Present tense 'do not know' reads naturally in English while reflecting the psalmist's claim of ignorance regarding the accusations.
- source_word: יִשְׁאָלוּנִי
  chosen: they question me about
  alternatives:
  - they question me about
  - they interrogate me about
  - they demand of me
  lexicon: HALOT
  rationale: Fits the adversarial legal setting without making the verb more formal or forceful than the Hebrew.
