id: 4MA.15.13
reference: 4 Maccabees 15:13
source:
  edition: lxx-swete-1909
  text: Ὦ φύσις ἱερά, καὶ φίλτρα γονέων καὶ γονεύσιν φιλοστόργε, καὶ τροφεῖα, καὶ μητέρων ἀδάμαστα πάθη.
  language: Greek
