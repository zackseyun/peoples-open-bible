theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Force of the participle נֹתְשָׁם after הִנְנִי
  chosen_reading: I am about to uproot them
  alternative_readings:
  - I will uproot them
  - I am uprooting them
  rationale: The הִנְנִי + participle construction often signals imminent divine action. 'I am about to uproot' captures that aspect better than a simple future, while the second clause uses the finite verb naturally as future.
