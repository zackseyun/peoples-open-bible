  meaning_decisions:
  - source_phrase: וְהָיוּ עַמִּים מִשְׂרְפוֹת שִׂיד
    prior_rendering: And the peoples will become burnings of lime
    new_rendering: The peoples will be burned like limestone reduced to lime
    rationale: The compressed Hebrew evokes lime production through intense burning. Making the comparison explicit preserves the image while replacing an English phrase that does not communicate its meaning.
  - source_phrase: קוֹצִים כְּסוּחִים בָּאֵשׁ יִצַּתּוּ
    prior_rendering: like cut thornbushes, they will be burned in the fire
    new_rendering: like cut thornbushes, they will be set ablaze
    rationale: The verb emphasizes being kindled or set on fire. “Set ablaze” conveys that force directly, so the previous ignition alternative no longer needs a note.
