  - a prophet
  rationale: The crowd's confession likely alludes to the expected prophet of Deuteronomy 18, but the Greek text itself states only 'the Prophet.' The translation preserves the title and leaves fuller identification to context rather than importing interpretation into the main text.
  doctrine_reference: Preserve theological tension rather than resolve it.
