base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046.yaml
  text: '1[v1]. And it came to pass after Jacob died, the sons of Israel increased in the land of Egypt, and they became a numerous people; and they were all of one accord, each loving his brother, and a man helping his brother. And they increased abundantly and grew strong throughout all the days of Joseph''s life, for ten weeks of years.

    2[v6-7]. And there was no adversary and nothing evil through all the days of Joseph''s life after the death of his father Jacob, because all Egypt honored

    3. the sons of Israel throughout all the days of Joseph''s life. And Joseph died at the age of one hundred and ten years: seventeen years he lived in the land of Canaan, and ten years while he was serving, and three years in the prison-house, and eighty years

    4. under the king, ruling over all the land of Egypt. And he died, and all his brothers,

    5. and all that generation. And before he died he commanded the sons of Israel that they should carry

    6. his bones in the day when they went out from the land of Egypt. And he made them swear concerning his bones, for he knew that the Egyptians would not again bring out and bury him in the land of Canaan. For Makmaron, king of Canaan, while dwelling in the land of Assyria, fought in the valley with the king of

    7. Egypt and killed him there; and he pursued after the Egyptians as far as the entrance of Eromon. But he could not enter, because another new king had arisen for Egypt, stronger than he, and he took possession of the land of Canaan and shut the gate of Egypt, and there was none who went out and none who came in to Egypt.

    8. And Joseph died in the forty-sixth jubilee, in the sixth week of years, in the second year; and they buried him

    9. in the land of Egypt. And all his brothers died after him. And the king of Egypt went out to fight with the king of Canaan in the forty-seventh jubilee, in the second week of years, in the second year; and the sons of Israel brought out all the bones of the sons of Jacob, except the bones of Joseph, and they buried them in the field in the double cave in the mountain,

    10. and many returned to Egypt, but a few of them remained in the mountain of

    11. Hebron; and your father Amram remained with them. And the king of Canaan prevailed over the king of Egypt

    12. and shut the gate of Egypt. And he devised an evil plan against the sons of Israel, so as

    13. to afflict them, and he said to the people of Egypt, ''Look, the people of the sons of Israel are more and stronger than we are. Come, let us deal wisely with them before they multiply, and let us afflict them with servitude, lest war come upon us and they also join themselves to our enemies and go out from our land, for their hearts and their faces are toward the land of Canaan.''

    14. And he appointed over them taskmasters so that they might afflict them with oppression, and they built fortified cities for Pharaoh: Pithom and Raamses. And they built all the walls and all the embankments that had fallen

    15. in the land of Egypt. And they made them serve by force, and however much they dealt harshly with them, so much the more

    16. they increased and so much the more they multiplied[v16][v14-15][v14][v11][v10-11][v9]. And the Egyptians made the sons of Israel abominable.'
  footnotes:
  - marker: v1
    text: Literally 'ten weeks of years,' i.e., seventy years, throughout Joseph's lifetime after Jacob's death.
    reason: cultural_note
  - marker: v6-7
    text: The names 'Makmaron' and 'Eromon' are difficult and may reflect forms of place or royal names preserved in Ethiopic transmission.
    reason: textual_variant
  - marker: v9
    text: '''The double cave'' likely refers to the cave of Machpelah near Hebron; the Ge''ez here uses a descriptive expression rather than the familiar Hebrew place-name.'
    reason: cross_reference
  - marker: v10-11
    text: The clause about those who remained at Hebron and 'your father Amram' is abrupt in context, likely because the book continues addressing Moses within the Sinai revelation framework.
    reason: segmentation_note
  - marker: v11
    text: The Ge'ez text literally reads 'Abram' (አብራም), a known scribal error in the Ethiopic transmission for 'Amram', the father of Moses.
    reason: textual_variant
  - marker: v14
    text: The Ge'ez says 'fortified cities' rather than the more traditional English 'store-cities.'
    reason: lexical_alternative
  - marker: v14-15
    text: The phrase about building 'all the walls and all the embankments that had fallen' is textually difficult; it may refer broadly to reconstruction works throughout Egypt.
    reason: segmentation_note
  - marker: v16
    text: The final verb is difficult; the sense is that the Egyptians came to regard the Israelites with loathing or contempt.
    reason: lexical_alternative
translation:
  language: ko
  text: '1. 야곱이 죽은 뒤에 이스라엘 자손들은 이집트 땅에서 번성하여 수많은 백성이 되었습니다. 그들은 모두 마음이 하나가 되어, 사람마다 자기 형제를 사랑하고 도왔습니다. 그들은 모든 십 주간의 해 동안 크게 번성하고 더욱더 많아졌습니다.

    2. 아버지 야곱 이후에 요셉이 살았던 모든 날 동안에는 대적도 없었고 어떤 악도 없었습니다. 이는 온 이집트가 그를 존중하였기 때문입니다.

    3. 요셉은 생애의 모든 날 동안 이스라엘 자손을 다스렸습니다. 요셉은 백십 세에 죽었습니다. 그는 가나안 땅에서 십칠 년을 살았고, 섬기며 십 년을 지냈고, 감옥에서 삼 년을 지냈으며, 이집트 왕 바로의 통치 아래에서 팔십 년을 지냈습니다.

    4. 왕의 통치 아래에서, 그가 온 이집트 땅을 다스리고 있을 때였습니다. 그리고 그는 죽었고, 그의 모든 형제들도

    5. 그리고 그 세대 전체도 그러하였습니다. 그는 죽기 전에 이스라엘 자손에게 운반하도록 명령하였습니다.

    6. 그들의 뼈는 그들이 이집트 땅에서 나온 그 날에 있었습니다. 그는 자기 뼈에 관해 그들에게 맹세하게 하였는데, 이집트 사람들이 다시는 그를 데리고 나와 가나안 땅에 장사하지 않을 것을 알았기 때문입니다. 가나안 왕 마크마론은 아시리아 땅에 거주하면서 골짜기에서 왕과 함께 싸웠습니다.

    7. 그리고 그가 그곳에서 그를 죽였습니다. 그리고 그는 그들을 뒤쫓아 이집트로, 에로몬의 입구까지 갔습니다. 그러나 이집트에 다른 새 왕이 일어나 그보다 강했기 때문에, 그는 들어갈 수 없었습니다. 그는 가나안 땅으로 돌아갔고, 이집트의 문은 닫혔습니다. 나가는 자도 없고 이집트로 들어오는 자도 없었습니다.

    8. 요셉은 마흔여섯째 희년의 여섯째 주, 둘째 해에 죽었으며, 그를 장사했습니다.

    9. 이집트 땅에서였습니다. 그 뒤에 그의 모든 형제들도 죽었습니다. 이집트 왕은 제47희년의 둘째 주, 둘째 해에 가나안 왕과 싸우러 나갔습니다. 이스라엘 자손은 요셉의 뼈를 제외하고 야곱의 아들들의 모든 뼈를 꺼내어, 들판에, 산에 있는 이중 동굴 안에 장사했습니다.

    10. 많은 사람이 이집트로 돌아갔지만, 그들 가운데 몇 사람은 [헤브론] 산에 남아 있었습니다.

    11. 헤브론이었습니다. 그리고 당신의 아버지 아브람은 그들과 함께 남아 있었습니다. 그리고 가나안 왕이 이집트 왕을 물리쳤습니다.

    12. 그리고 그는 이집트의 문을 닫았습니다. 또 이스라엘 자손들을 대적할 악한 계책을 꾸몄습니다. 그리하여

