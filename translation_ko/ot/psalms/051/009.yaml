  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּחַטְּאֵנִי
  english_pob_choice: Purify me
  chosen_korean: 나를 정결하게 하시면
  alternatives_korean:
  - 나를 깨끗하게 하시면
  - 나를 정화하시면
  lexicon: HALOT
  rationale: 히브리어 חטא의 피엘형은 이 문맥에서 죄/부정에서 씻어내는 정결 행위를 가리키므로, 한국어로는 제의적 뉘앙스를 살린 ‘정결하게 하다’가 가장 적절합니다.
- source_word: בְאֵזוֹב
  english_pob_choice: with hyssop
  chosen_korean: 우슬초로
  alternatives_korean:
  - 우슬초를 사용하여
  - 히솝으로
  lexicon: HALOT
  rationale: יוּ슬초는 성경의 정결 의식에 쓰이는 식물이므로, 관용적으로 ‘우슬초로’라고 옮겨 제의적 도구 이미지를 직접 보존했습니다.
- source_word: וְאֶטְהָר
  english_pob_choice: and I will be clean
  chosen_korean: 내가 깨끗해지고
  alternatives_korean:
  - 내가 정결해지고
  - 내가 깨끗하게 될 것이고
  lexicon: HALOT
  rationale: טהר의 결과 상태를 자연스럽게 드러내기 위해 ‘깨끗해지고’로 옮겼으며, 앞선 ‘정결하게 하시면’과 병행을 이룹니다.
- source_word: אַלְבִּין
  english_pob_choice: I will be whiter than snow
  chosen_korean: 눈보다 더 희게 되겠습니다
  alternatives_korean:
  - 눈보다 희어지겠습니다
  - 눈보다 더 하얘지겠습니다
  lexicon: HALOT
  rationale: 비교 구문을 살려 ‘눈보다 더 희게’로 옮겼고, 시적 종결은 합쇼체에 맞게 ‘되겠습니다’로 처리했습니다.
theological_decisions:
- issue: 정결 의식 이미지의 보존
  chosen_reading: 죄 사함으로만 평탄화하지 않고, 우슬초와 정결 언어를 그대로 살렸습니다.
  alternative_readings:
  - 그저 저를 용서해 주십시오
  - 저를 씻어 깨끗하게 해 주십시오
  rationale: 이 절은 죄에 대한 회개를 이스라엘의 정결 의식 언어로 표현하므로, 의례적 상징과 도덕적 회복의 연결을 유지하는 편이 본문 의도에 더 가깝습니다.
  doctrine_reference: 시편 51편의 회개와 정결 표상
