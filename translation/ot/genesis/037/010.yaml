  from: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
  to: 'When he told it to his father and his brothers, his father rebuked him: “What is this dream you have had? Will I, your mother, and your brothers really come and bow down to the ground before you?”'
  rationale: I retain the documented strengths 'rebuked' and 'bow down to the ground,' including the explicitly named mother without explaining away the narrative tension. The earlier preference for Hebrew-shaped repetition and subject listing gives way to natural English with the same rhetorical force.
