    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמוּנָתִי
  english_pob_choice: my faithfulness
  chosen_korean: 제 충실함
  alternatives_korean:
  - 제 믿음
  - 제 신실하심
  - 제 신의
  lexicon: HALOT
  rationale: 여기서는 하나님의 믿음의 행위가 아니라 언약적 신실함이므로, 자연스러운 현대어로는 ‘충실함’이 가장 직접적입니다.
- source_word: חַסְדִּי
  english_pob_choice: my steadfast love
  chosen_korean: 제 변함없는 사랑
  alternatives_korean:
  - 제 언약적 사랑
  - 제 인자
  - 제 자비
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충성은 ‘변함없는 사랑’이 가장 잘 살리며, ‘자비’처럼 좁히거나 ‘인자’처럼 전통어에 기대지 않도록 했습니다.
- source_word: תָּרוּם קַרְנוֹ
  english_pob_choice: his horn will be exalted
  chosen_korean: 그의 뿔이 높이 들릴 것입니다
  alternatives_korean:
  - 그의 뿔이 높아질 것입니다
  - 그의 힘이 높여질 것입니다
  - 그의 뿔이 높이 세워질 것입니다
  lexicon: HALOT
  rationale: ‘뿔’ 이미지를 유지해 힘과 왕권의 상징성을 보존했고, רוּם은 동적인 ‘높이 들리다’로 옮겨 메타포를 살렸습니다.
- source_word: בִּשְׁמִי
  english_pob_choice: in my name
  chosen_korean: 제 이름으로
  alternatives_korean:
  - 제 이름 안에서
  - 제 이름에 의해
  - 제 이름을 따라
  lexicon: HALOT
  rationale: 직역하면 ‘내 이름 안에서’이지만, 한국어에서는 결과적/권위적 매개를 자연스럽게 나타내는 ‘제 이름으로’가 가장 읽기 좋습니다.
theological_decisions:
- issue: ‘horn’ 은유의 보존
  chosen_reading: ‘뿔’을 그대로 유지해 왕적 권세와 영광의 상징을 살렸습니다.
  alternative_readings:
  - ‘힘’으로 풀어 설명함
  - ‘권세’로 의역함
  rationale: 본문은 추상적 힘이 아니라 시적 상징을 사용하므로, 의미를 풀어버리기보다 은유를 보존하는 것이 원문의 신학적·문학적 효과에 더 충실합니다.
  doctrine_reference: 시편의 왕적 상징 해석, Translation philosophy §1, §5
