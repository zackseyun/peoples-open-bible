  text: ᾿Αντίγραφον² διαθήκης Ῥουβήμ³, ὅσα⁴ ἐνετείλατο τοῖς υἱοῖς⁵ αὐτοῦ, Γ*πρὶν ἢ⁶ ἀποθανεῖν αὐτόν, *ἐν ἑκατοστῷ⁷ *εἰκοστῷ πέμπτῳ⁸ ἔτει τῆς ζωῆς αὐτοῦ⁷. 2. *Μετὰ ἔτη δύο τῆς τελευτῆς⁹ Ἰωσὴφ Γτοῦ ἀδελφοῦ αὐτοῦ¹⁰, ἀρρωστή- β-d,A,S¹ σαντος¹¹ Ῥουβήμ¹², συνήχθησαν¹³ *ἐπισκέψασθαι αὐτὸν¹⁴ Ἰωσήφ. υἱοὶ¹⁵ αὐτοῦ καὶ υἱοὶ¹⁶ τῶν υἱῶν αὐτοῦ¹⁷. 3. Καὶ¹⁸ εἶπεν αὐτοῖς¹⁹. Τέκνα²⁰ μου, *ἰδοὺ ἐγὼ²¹ ἀπο- θνήσκω καὶ πορεύομαι ὁδὸν²² τῶν²³ πατέρων μου²⁴. 4 *Ἰδὼν δὲ²⁵ Γἐκεῖ] *Ἰούδαν καὶ Γὰδ καὶ ᾿Ασήρ²⁶, τοὺς β-dg, A, ἀδελφοὺς αὐτοῦ, εἶπεν αὐτοῖς· ᾿Αναστήσατέ²⁷ με²⁸, ὅπως S¹ με, εἴπω τοῖς *ἀδελφοῖς μου καὶ τοῖς τέκνοις²⁹ μου, ὅσα ἔχω ἀδελφοί μου (f, A ἐν τῇ καρδίᾳ μου κρυπτά³⁰. *ἰδοὺ γὰρ ἐκλείπω ἀπὸ τοῦ S¹ om.). νῦν ἐγώ³¹. 5. *Καὶ ἀναστὰς³² κατεφίλησεν αὐτοὺς καὶ β-d,A,S¹ *εἶπεν αὐτοῖς³³. ᾿Ακούσατε, *ἀδελφοί μου καὶ υἱοί μου³⁴, ἐνω- κλαύσας τίσασθε³⁵ Ῥουβὴμ³⁶ τοῦ πατρὸς ὑμῶν ὅσα Γἐγὼ]³⁷ ἐντέλλομαι εἶπεν. ὑμῖν³⁸. 6. Καὶ³⁹ *ἰδοὺ ἐπιμαρτύρομαι ὑμῖν τὸν Θεὸν τοῦ β-dg, οὐρανοῦ σήμερον⁴⁰, *ὅπως μὴ πορευθῆτε⁴¹ ἐν ἀγνοίᾳ νεότητος⁴² Ab*deg Γκαὶ πορνείᾳ, *ἐν ᾗ⁴³ ἐξεχύθην ἐγὼ καὶ ἐμίανα⁴⁴ κοίτην⁴⁵ ἀδελφοί μου. τοῦ πατρός μου Ἰακώβ⁴⁶. 7. *Λέγω δὲ ὑμῖν⁴⁷ ὅτι *ἔπληξέ με⁴⁸ *πληγῇ μεγάλῃ⁴⁹ *ἐπὶ τῆς λαγόνος⁵⁰ μου ἕως⁵¹ μῆνας⁵² ἑπτά· καὶ εἰ μὴ *ὁ πατήρ μου Ἰακὼβ⁵³ προσηύξατο⁵⁴ *περὶ ἐμοῦ πρὸς Κύριον⁵⁵ ἤθελε⁵⁶ Κύριος⁵⁷ ἀνελεῖν με. 8. Ἤμην γὰρ⁵⁸ ἐτῶν τριάκοντα ὅτε ἔπραξα τὸ πονηρὸν ἐνώπιον Κυρίου⁵⁹. καὶ ἐμαλακίσθην *μῆνας ἑπτὰ⁶⁰ ἕως θανάτου. 9. Καὶ *μετὰ τοῦτο⁶¹ ἐν προαιρέσει ψυχῆς μου *ἑπτὰ ἔτη⁶² μετενόησα *ἐνώπιον Κυρίου⁶³. 10. Καὶ⁶⁴ οἶνον καὶ σίκερα οὐκ ἔπιον, καὶ κρέας⁶⁵ οὐκ εἰσῆλθεν *ἐν τῷ στόματί⁶⁶ μου· καὶ πᾶν⁶⁷ ἄρτον ἐπι- θυμίας⁶⁸ οὐκ ἔφαγον⁶⁹ *ἀλλ᾽ ἤμην⁷⁰ πενθῶν ἐπὶ τῇ ἁμαρτίᾳ μου⁷¹, μεγάλη γὰρ ἦν, *οἷα οὐ γέγονεν ἐν Ἰσραὴλ οὕτως⁷².
