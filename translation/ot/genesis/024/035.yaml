theological_decisions:
- issue: Rendering the divine name יהוה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Rendering עֲבָדִם / שְׁפָחֹת in a property list
  chosen_reading: male servants and female servants
  alternative_readings:
  - male slaves and female slaves
  - servants and maidservants
  rationale: The translation philosophy allows 'servant / slave' context-dependently. Although these persons are listed among possessions, the verse itself is an inventory report rather than a theological statement about bondage, so 'servants' is retained in the main text while preserving the stronger alternative in a footnote.
  doctrine_reference: 'DOCTRINE.md Contested terms: δοῦλος servant / slave (context-dependent); applied analogically to Hebrew service terminology'
