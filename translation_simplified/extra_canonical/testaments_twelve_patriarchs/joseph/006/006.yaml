base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/006.yaml
  text: Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and by this I preserved it as evidence against you, in hope that perhaps, seeing it, you might repent.”
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T14:55:21Z'
    unchanged: false
    changes_summary: Revised 'for this reason I kept it as evidence against you, to expose you' to more closely reflect ἐν τούτῳ ἐφύλαξα αὐτὸ εἰς ἔλεγχόν σου as 'by this I preserved him for your conviction.' Also simplified the final clause to match ἰδοῦσα μετανοήσεις more directly as 'seeing it, you might repent.'
translation:
  language: en
  text: 'Understand this now: the God of my father showed me your wickedness through his angel. By this, I kept it as evidence against you, hoping that perhaps, when you saw it, you might reorient[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Know now, then
  simplified_phrase: Understand this now
  preserved_meaning: Joseph urgently calls her to recognize what follows.
  reasoning_layer_used: POB translation and immediate context
  rationale: The direct command is clearer without the formal connective “then.”
- pob_phrase: revealed your wickedness to me
  simplified_phrase: showed me your wickedness
  preserved_meaning: God made her evil conduct known to Joseph.
  reasoning_layer_used: POB translation
  rationale: “Showed me” expresses the disclosure in common English.
