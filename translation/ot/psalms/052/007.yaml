id: PSA.52.7
reference: Psalms 52:7
source:
  edition: WLC
  text: וְ/יִרְא֖וּ צַדִּיקִ֥ים וְ/יִירָ֗אוּ וְ/עָלָ֥י/ו יִשְׂחָֽקוּ׃
translation:
  text: 'The righteous will see this and fear; they will laugh at him:'
  philosophy: dynamic
lexical_decisions:
- source_word: וְיִרְאוּ
  chosen: will see
  alternatives:
  - shall see
  - see
  lexicon: HALOT
  rationale: Qal imperfect 3mp of ראה, here with future-like sense in poetic sequence. 'Will see' preserves the straightforward visual/perceptive force without overinterpreting as 'consider' or 'understand.'
- source_word: צַדִּיקִים
  chosen: the righteous
  alternatives:
  - righteous ones
  - the just
  lexicon: HALOT
  rationale: Plural adjective used substantivally. 'The righteous' is idiomatic English and preserves the moral category without unnecessary stiffness.
- source_word: וְיִירָאוּ
  chosen: fear
  alternatives:
  - be afraid
  - stand in awe
  lexicon: HALOT
  rationale: Qal imperfect 3mp of ירא. In this judgment context, 'fear' best preserves the terse Hebrew and allows the sense of reverent dread before God's justice; 'be afraid' is narrower and 'stand in awe' too positive.
- source_word: וְעָלָיו
  chosen: at him
  alternatives:
  - over him
  - concerning him
  lexicon: HALOT
  rationale: The preposition על with שׂחק commonly yields the sense 'laugh at/mock.' 'At him' is the most natural English rendering in this collocation.
- source_word: יִשְׂחָקוּ
  chosen: will laugh
  alternatives:
  - will mock
  - will laugh in scorn
  lexicon: HALOT
  rationale: Qal imperfect 3mp of שׂחק. The basic sense is 'laugh'; because the object is a judged wicked man, mockery is implied by context, but the main text keeps the simpler lexical value and lets context supply the scornful nuance.
