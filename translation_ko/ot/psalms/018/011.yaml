id: PSA.18.11
reference: Psalms 18:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָ֤שֶׁת חֹ֨שֶׁךְ סִתְר֗/וֹ סְבִֽיבוֹתָ֥י/ו סֻכָּת֑/וֹ חֶשְׁכַת מַ֝֗יִם עָבֵ֥י שְׁחָקִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/011.yaml
  text: He made darkness his hiding place, his shelter[a] around him—dark waters, thick clouds of the skies.
  footnotes:
  - marker: a
    text: Or “his canopy” or “his booth.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서는 어둠을 자신의 은신처[a]로 삼으셨습니다. 그분 주위의 초막[b]은 물의 어둠, 곧 하늘의 빽빽한 구름이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨은 곳’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘피난처’ 또는 ‘덮개’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב עַל כְּרוּב
  english_pob_choice: And he rode on a cherub
  chosen_korean: 그가 그룹 위를 타고
  alternatives_korean:
  - 그가 그룹 위에 올라타고
  - 그가 그룹을 타고
  lexicon: HALOT
  rationale: רכב는 ‘타다/말을 타다’의 기본 동작을 나타내므로, 시적 신현 장면을 살리면서도 한국어로 자연스러운 ‘타고’로 옮겼습니다. כְּרוּב는 복수형 ‘그룹들’이 아니라 단수의 ‘그룹’입니다.
- source_word: וַיָּעֹף
  english_pob_choice: flew
  chosen_korean: 날아오르시며
  alternatives_korean:
  - 날아가시며
  - 날으시며
  lexicon: HALOT
  rationale: עוף의 직접적 의미인 ‘날다’를 반영하되, 앞의 ‘타고’와 뒤의 ‘빠르게 나아가셨습니다’ 사이에서 연속 동작을 살리기 위해 ‘날아오르시며’로 다듬었습니다.
- source_word: וַיֵּדֶא
  english_pob_choice: sped
  chosen_korean: 빠르게 나아가셨습니다
  alternatives_korean:
  - 급히 가셨습니다
  - 내달리셨습니다
  - 급히 날아가셨습니다
  lexicon: HALOT
  rationale: 희귀 동사 ידה의 핵심은 빠른 이동이므로, 영어 POB의 ‘sped’처럼 속도감을 살리되 과도하게 특정한 비행 방식은 덧붙이지 않도록 했습니다.
- source_word: כַּנְפֵי רוּחַ
  english_pob_choice: the wings of the wind
  chosen_korean: 바람의 날개 위를
  alternatives_korean:
  - 바람의 날개를
  - 바람의 깃털 위를
  lexicon: HALOT
  rationale: רוּחַ는 이 문맥의 폭풍 신현 속에서 ‘바람’이 가장 자연스럽고, כַנְפֵי는 직역하여 ‘날개’로 옮겨 시적 이미지를 그대로 보존했습니다.
theological_decisions:
- issue: 신현적 전사 장면의 이미지 보존
  chosen_reading: 하나님이 그룹을 타고 이동하시는 구체적 시적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 그룹을 상징적 표현으로 완화하기
  - 천사 무리로 풀어 설명하기
  rationale: 본문은 신현의 장엄한 시적 묘사를 제시할 뿐, 이를 설명적으로 바꾸지 않습니다. 따라서 이미지 자체를 유지하는 것이 저자의 의도를 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: רוּחַ의 의미
  chosen_reading: 문맥상 ‘바람’으로 확정해 번역했습니다.
  alternative_readings:
  - 영
  - 숨
  rationale: 주변 문맥이 폭풍-신현의 자연 이미지이므로 ‘바람’이 가장 적절합니다. 다른 의미 가능성은 주석으로만 남기고 본문에서는 문맥 우선으로 처리했습니다.
  doctrine_reference: Translation philosophy §3
