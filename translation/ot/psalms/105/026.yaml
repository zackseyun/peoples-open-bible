id: PSA.105.26
reference: Psalms 105:26
source:
  edition: WLC
  text: שָׁ֭לַח מֹשֶׁ֣ה עַבְדּ֑/וֹ אַ֝הֲרֹ֗ן אֲשֶׁ֣ר בָּֽחַר בּֽ/וֹ־׃
translation:
  text: He sent Moses, his servant, and Aaron, whom he chose.
  philosophy: dynamic
lexical_decisions:
- source_word: שָׁלַח
  chosen: He sent
  alternatives:
  - He dispatched
  lexicon: HALOT
  rationale: Qal perfect 3ms of שלח, with implicit subject from context (God/the LORD in the surrounding psalm). 'He sent' is the natural and sufficiently formal English rendering; 'dispatched' is possible but less idiomatic here.
- source_word: מֹשֶׁה
  chosen: Moses
  rationale: Proper name, transliterated by standard English convention in keeping with the translation philosophy.
- source_word: עַבְדּוֹ
  chosen: his servant
  alternatives:
  - his slave
  lexicon: HALOT
  rationale: עֶבֶד with 3ms suffix means 'his servant/slave.' Although the term can denote a slave, in this royal-covenantal and honorific context for Moses, 'servant' is the most natural English rendering and matches the established biblical idiom without obscuring meaning.
- source_word: אַהֲרֹן
  chosen: Aaron
  rationale: Proper name, transliterated by standard English convention.
- source_word: אֲשֶׁר
  chosen: whom
  alternatives:
  - that
  lexicon: HALOT
  rationale: Relative particle introducing the clause modifying Aaron. 'Whom' fits the personal antecedent and standard modern literary English.
- source_word: בָּחַר בּוֹ
  chosen: he chose
  alternatives:
  - he chose
  lexicon: HALOT
  rationale: Simple past reflects the unmarked Hebrew perfect without imposing a past-perfect relationship.
