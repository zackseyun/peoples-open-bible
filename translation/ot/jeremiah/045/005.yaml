translation:
  text: But you—are you seeking great things for yourself? Do not seek them, for I am bringing disaster on all humanity, declares Yahweh. Yet wherever you go, I will let you escape with your life[a].’
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “I will give you your life as plunder.” The image is of coming away from disaster with one’s life as the prize carried away.
    reason: lexical_alternative
