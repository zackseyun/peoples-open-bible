  preserved_meaning: The deceivers are identified by what they refuse to confess.
  reasoning_layer_used: POB lexical decisions for πολλοὶ πλάνοι, ἐξῆλθον, and οἱ μὴ ὁμολογοῦντες
  rationale: Two sentences make the relationship clear without weakening the public sense of “confess.”
- pob_phrase: Jesus the Messiah coming in the flesh
