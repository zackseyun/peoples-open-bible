  from: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
  to: No one may touch the offender[a], who must be stoned or shot with arrows[b]. Whether animal or human, the offender must not be left alive. When the ram’s horn sounds a long blast, the people may go up the mountain[c].’”
  rationale: The earlier interpretation of the pronoun as the offender, execution without direct contact, and permission at the prolonged horn signal is retained. The legal referents and ancient shooting method are clarified, while serious alternatives are noted rather than resolving the tension with the chapter’s later restrictions by adding an unstated condition.
