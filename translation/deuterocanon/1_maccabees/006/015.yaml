lexical_decisions:
- source_word: διάδημα
  chosen: crown
  alternatives:
  - diadem
  lexicon: LSJ
  rationale: Refers to the royal headpiece; 'crown' is clearer modern English, while 'diadem' is a more formal alternative.
- source_word: στολή
  chosen: robe
  alternatives:
  - garment
  - state robe
  lexicon: LSJ
  rationale: In royal context this denotes a distinctive robe or official garment. 'Robe' preserves the regal sense without over-specifying.
- source_word: δακτύλιος
  chosen: ring
  alternatives:
  - signet ring
  lexicon: LSJ
  rationale: The word means 'ring'; in context it may imply authority, even a signet ring, but the Greek itself does not explicitly state 'signet,' so the simpler rendering is preferred.
- source_word: ἀγαγεῖν
  chosen: to bring
  alternatives:
  - to lead
  - to conduct
  lexicon: LSJ
  rationale: The infinitive expresses purpose. 'To bring' is the most natural English equivalent here and fits the likely sense of bringing the son forward for succession.
- source_word: διάδημα καὶ τὴν στολὴν αὐτοῦ καὶ τὸν δακτύλιον
  chosen: the crown and his robe and the ring
  alternatives:
  - the diadem and his robe and the ring
  - the crown, his robe, and his ring
  lexicon: LSJ
  rationale: The sequence lists royal insignia. The article before 'ring' is retained in sense, but English style smooths the list while preserving the three distinct items.
