lexical_decisions:
- source_word: לָמָּה
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 까닭에
  lexicon: HALOT
  rationale: 탄식시의 직접적인 질문을 자연스러운 현대 한국어로 옮기되, 단순한 정보 요청보다 탄원과 항의의 뉘앙스를 살리기 위해 '어찌하여'를 택했습니다.
- source_word: פָנֶיךָ
  english_pob_choice: your face
  chosen_korean: 당신의 얼굴
  alternatives_korean:
  - 당신의 얼굴빛
  - 당신의 임재
  lexicon: HALOT
  rationale: 히브리어의 직유적 표현을 그대로 살려 하나님의 호의와 가까움을 가리키는 몸의 언어를 유지했습니다.
- source_word: עָנְיֵנוּ
  english_pob_choice: our affliction
  chosen_korean: 우리의 고난
  alternatives_korean:
  - 우리의 환난
  - 우리의 고통
  lexicon: HALOT
  rationale: קהילת적 탄식에서 व्यापक한 고통을 가리키는 말로, '고난'이 한국어에서 가장 자연스럽고 포괄적인 대응입니다.
- source_word: וְלַחֲצֵנוּ
  english_pob_choice: our oppression
  chosen_korean: 우리의 압제
  alternatives_korean:
  - 우리의 억압
  - 우리에게 가해진 압박
  lexicon: HALOT
  rationale: 외부로부터 가해지는 적대적 दबింపు를 드러내기 위해 '압제'를 택해, 단순한 내적 불편보다 사회적·적대적 성격을 보존했습니다.
theological_decisions:
- issue: '''your face''의 직역 여부와 하나님의 임재 의미'
  chosen_reading: '''당신의 얼굴''로 직역을 유지하고, 의미를 본문 안에서 열어 두었습니다.'
  alternative_readings:
  - 당신의 임재
  - 당신의 얼굴빛
  rationale: 시편의 탄식은 하나님의 호의와 가까움이 거두어진 경험을 몸의 언어로 표현하므로, 이를 추상화하지 않고 그대로 옮기는 편이 시의 신학적 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3, §6
