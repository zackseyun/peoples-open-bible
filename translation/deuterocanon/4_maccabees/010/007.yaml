translation:
  text: Since they could in no way break him[a], they tore off his skin together with the very tips of his fingers[b] and scalped him[c], and at once they brought him to the wheel.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally 'strangle him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with the tips of their fingers', describing how the torturers tore the skin away.
    reason: alternative_reading
  - marker: c
    text: The Greek verb refers to scalping in the manner of the Scythians; some take it more generally as 'flayed him.'
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ μηδένὰ τρόπον
  chosen: in no way
  alternatives:
  - by no means
  - in no manner
  lexicon: LSJ
  rationale: Idiomatic negated expression indicating complete inability; 'in no way' is natural modern English while preserving the force.
- source_word: ἰσχύοντες
  chosen: were able
  alternatives:
  - were strong enough
  - prevailed
  lexicon: LSJ
  rationale: Here the participle expresses capability rather than mere strength; 'were able' best fits the infinitive that follows.
- source_word: ἄγξαι
  chosen: to strangle
  alternatives:
  - to throttle
  - to choke
  lexicon: LSJ
  rationale: The verb denotes constricting the throat; 'strangle' is the clearest standard English rendering in this torture context.
- source_word: περισύραντες
  chosen: dragged off
  alternatives:
  - pulled away
  - tore away
  lexicon: LSJ
  rationale: The participle conveys forceful pulling/stripping around or away. 'Dragged off' preserves the violent physical action without overparaphrasing.
- source_word: τὸ δέρμα
  chosen: the skin
  alternatives:
  - the hide
  lexicon: LSJ
  rationale: Literal bodily sense; 'skin' is the plain and appropriate English term.
- source_word: σὺν ἄκραις ταῖς τῶν δακτύλων κορυφαῖς
  chosen: with the very tips of his fingers
  alternatives:
  - together with the extremities of his fingers
  - with the fingertips
  lexicon: LSJ
  rationale: The phrase is graphic and specific, referring to the extremities/tips of the fingers. 'The very tips of his fingers' preserves the vividness and likely sense that the skin was pulled off down to the fingertips.
- source_word: ἀπεσκύθισον
  chosen: flayed him
  alternatives:
  - scalped him
  - stripped him raw
  lexicon: LSJ
  rationale: The verb refers to skinning or flaying. 'Flayed him' is the most precise English equivalent for this torture scene.
- source_word: εὐθέως
  chosen: immediately
  alternatives:
  - at once
  - straightway
  lexicon: LSJ
  rationale: Marks rapid succession; 'immediately' is clear modern English.
- source_word: ἦγον ἐπὶ τὸν τροχόν
  chosen: they led him to the wheel
  alternatives:
  - they brought him to the wheel
  - they took him to the wheel
  lexicon: LSJ
  rationale: Standard motion expression toward an instrument of torture. 'Led him to the wheel' is direct and readable.
