  from: Whether for correction[a], or for his land, or for steadfast love[c][b], he causes it to happen.
  to: Whether for a rod, or for his land, or for steadfast love, he causes it to come.[a]
  rationale: “Correction” replaces the concrete image of שֵׁבֶט with an inferred effect; “rod” should be retained. “Causes it to come” preserves the causative, event-arrival sense more closely and naturally than “causes it to happen.” “Steadfast love” remains a well-established, suitably broad rendering of חֶסֶד; “faithful love” is possible but not an improvement requiring change.
