  to: 제 때는 주님의 손에 있습니다. 저를 제 원수들의 손과 저를 뒤쫓는 자들에게서 구해 주십시오.[a]
  rationale: 대상 절의 히브리어를 처음부터 다시 번역했습니다. ‘제 때는 주님의 손에 있습니다’는 בְּיָדְךָ עִתֹּתָי의 소유·통제의 비유와 ‘손’의 표현을 보존합니다. 이어지는 청원에서는 ‘원수들의 손’과 ‘저를 뒤쫓는 자들’을 구별하여 מִיַּד אֹיְבַי וּמֵרֹדְפָי의 구조를 반영했습니다. 각주는 עִתֹּתַי의 의미 범위를 설명하되 이를 특정 교리적 의미로 제한하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:06:42Z'
