revisions:
- category: publication_review_correction
  rationale: 'Lexical reconsideration of prior “inside/outside” renderings: μέσους, εἰς μέσην and εἰς
    τὸ μέσον specify the middle in paragraphs 2, 4, 5 and 6. In paragraphs 3, 5 and 7, ἐξώτεροι describes
    the outer placement of stones incorporated into the building, not rejection outside it. Preserve that
    structural contrast without changing the declared textual readings or notes.; Reconcile the valid
    supplement note with the corrected middle-versus-outer placement. The Greek contrasts εἰς μέσην with
    ἐξώτεροι and explicitly states supporting capability in paragraph 5; it does not place the accepted
    supporting stones outside the building.'
- category: publication_review_correction
  rationale: 'Reconsideration of prior lexical decision: μετενεχθῆναι καὶ χωρισθῆναι specifies removal
    and separation, not reservation for later use. Remove the unsupported purpose while preserving the
    distinctions reflected in the reader text.'
