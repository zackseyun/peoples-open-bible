  from: My heart is steadfast[a], O God; I will sing and make music, even with my glory.
  to: My heart is steadfast, O God; I will sing and make music, even with my glory[a].
  rationale: The note belongs with “my glory,” not “steadfast.” The proposed “even my glory” is an unnaturally elliptical English rendering of the difficult final phrase; retaining “with” makes the implied instrumental relation readable without resolving the poetic referent. A dash is not required by the Hebrew.
