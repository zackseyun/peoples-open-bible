  from: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
  to: God brought him out of Egypt and is his strength, like the horns of a wild ox[a]. Israel will devour the nations that oppose him, gnaw their bones[b], and strike them down with his arrows.
  rationale: The lexical record's interpretation of God's strength acting for Israel is retained, but its awkward pronoun chain is clarified. The horns and gnawing images remain, with the documented uncertainties moved to correctly placed notes; naming corporate Israel does not exclude action through its king.
