translation:
  text: He himself and his army returned with them over a period of one hundred twenty days[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, “He himself and his army stayed with them for one hundred twenty days”; the verb can also describe remaining in a place.
