  from: Blessed is the man who fills his quiver with them[a][b][c]; they will not be put to shame when they speak with enemies in the gate.
  to: Blessed is the man who fills his quiver with them. They will not be put to shame when they speak with enemies at the gate.[a][b][c]
  rationale: “At the gate” is a natural English rendering of the location and the misplaced markers require correction. However, the perfect מִלֵּא functions naturally in this gnomic beatitude as “fills”; a present perfect is not required. More importantly, דבר remains semantically broad even in this setting. “Contend” is a plausible contextual implication, but it is too restrictive for the main text and should remain a footnoted alternative. The plural verbs must remain plural.
