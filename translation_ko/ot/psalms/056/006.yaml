  alternatives_korean:
  - 그들의 모든 계획은 … 해악입니다
  - 그들의 모든 생각은 … 해를 끼치려는 것입니다
  - 그들의 모든 꾀는 … 악한 것입니다
  lexicon: HALOT
  rationale: מַחְשְׁבוֹת은 ‘생각/계획/궁리’의 범위를 가지지만, 직역 가능한 ‘생각’을 유지하되 סוף절의 목적성을 ‘악’으로 살려 적대적 의도를 드러냈습니다.
