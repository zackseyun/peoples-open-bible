lexical_decisions:
- source_word: Ἰεσσαί
  choice: Isai
  rationale: Die im Deutschen etablierte biblische Namensform für den Vater Davids.
- source_word: Ἰωβήλ
  choice: Jobed
  rationale: Gibt die griechische Form des SBLGNT möglichst direkt wieder; sie unterscheidet sich hier von der geläufigen alttestamentlichen Form Obed.
- source_word: Βόος
  choice: Boas
  rationale: Die etablierte deutsche Form des Namens.
- source_word: Σαλά
  choice: Sala
  rationale: Nahe Wiedergabe der im SBLGNT bezeugten griechischen Namensform, ohne sie stillschweigend mit Salmon gleichzusetzen.
- source_word: Ναασσών
  choice: Nachschon
  rationale: Die etablierte deutsche Wiedergabe des Namens unter Beachtung des hebräischen Lautwerts.
- source_word: τοῦ
  choice: des
  rationale: Der wiederholte Genitiv setzt die Abstammungskette aus dem vorhergehenden Vers fort; die knappe deutsche Genitivreihe bewahrt Form und Anschluss.
theological_decisions:
- issue: Bezeichnung der genealogischen Beziehung
  choice: Fortgesetzte Genitivreihe „des …“
  alternative: „Sohn des …“ bei jedem Namen
  rationale: Im griechischen Text steht lediglich der wiederholte Genitiv; die Abstammungsbeziehung ergibt sich aus dem vorausgehenden Kontext. Die formale Wiedergabe vermeidet eine unnötige Explizierung.
- issue: Textliche Differenz bei Ἰωβήλ und Σαλά
  choice: Jobed und Sala nach dem vorgelegten SBLGNT-Text
  alternative: Obed und Salmon nach der alttestamentlichen Genealogie beziehungsweise anderen Überlieferungsformen
  rationale: Die Übersetzung folgt der angegebenen griechischen Ausgangsausgabe und harmonisiert die Namen nicht stillschweigend.
translation_notes:
  register: Knappe, würdige genealogische Reihung in modernem Standarddeutsch. Die Satzfortsetzung und das abschließende Komma entsprechen dem fragmentarischen Verszusammenhang.
