  from: The earth is defiled under its inhabitants[a], because they have transgressed laws, violated a statute[b], and broken the everlasting covenant.
  to: The earth is defiled by its inhabitants, because they have transgressed laws, violated statutes[a], and broken the everlasting covenant.
