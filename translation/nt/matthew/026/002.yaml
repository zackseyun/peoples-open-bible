  from: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
  to: You know that after two days the Passover is coming[a], and the Son of Man will be handed over to be crucified.
  rationale: The present tense παραδίδοται here is a futuristic present, explicitly located in the future by the temporal phrase 'after two days' (μετὰ δύο ἡμέρας). Rendering it with the English present progressive ('is being handed over') incorrectly implies the action is already in continuous progress. A future ('will be handed over') or simple present ('is handed over') correctly conveys the certainty of the impending event without distorting the aspect.
