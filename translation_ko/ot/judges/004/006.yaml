  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּשְׁלַ֗ח וַ/תִּקְרָא֙ לְ/בָרָ֣ק בֶּן אֲבִינֹ֔עַם מִ/קֶּ֖דֶשׁ נַפְתָּלִ֑י וַ/תֹּ֨אמֶר אֵלָ֜י/ו הֲ/לֹ֥א צִוָּ֣ה יְהוָ֣ה אֱלֹהֵֽי יִשְׂרָאֵ֗ל לֵ֤ךְ וּ/מָֽשַׁכְתָּ֙ בְּ/הַ֣ר תָּב֔וֹר וְ/לָקַחְתָּ֣ עִמְּ/ךָ֗ עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ מִ/בְּנֵ֥י נַפְתָּלִ֖י וּ/מִ/בְּנֵ֥י זְבֻלֽוּן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/006.yaml
  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: ko
  text: 그녀는 사람을 보내어 납달리의 게데스[a]에 있는 아비노암의 아들 바락을 불러오고, 그에게 말했습니다. “이스라엘의 하나님이신 야훼께서 명령하지 않으셨습니까? ‘가서 다볼 산[b][c]으로 진군하라. 그리고 납달리 자손과 스불론 자손 중에서 만 명을 데리고 가라.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게데스는 납달리 지파의 성읍입니다.
    reason: cultural_note
  - marker: b
    text: 원문은 ‘끌어 가다, 끌어 올리다’라는 동사를 사용하며, 여기서는 병력을 다볼 산 쪽으로 집결·전개하는 군사적 동작을 가리킵니다.
    reason: source_note
  - marker: c
    text: 다볼 산은 하갈릴리 남동부, 이스르엘 평야 북쪽에 있는 산입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  english_pob_choice: She sent and summoned
  chosen_korean: 사람을 보내어 … 부르고
  alternatives_korean:
  - 보내어 … 소집하고
  - 보내어 … 불러서
  lexicon: שלח / קרא
  rationale: 두 동사의 연속을 살려 ‘보내다’와 ‘부르다’를 함께 반영했습니다. ‘소집하다’는 다소 행정적 뉘앙스가 강해 서사 문맥에서는 ‘부르다’가 더 자연스럽습니다.
- source_word: מִקֶּדֶשׁ נַפְתָּלִי
  english_pob_choice: from Kedesh-naphtali
  chosen_korean: 납달리의 게데스
  alternatives_korean:
  - 납달리 게데스
  - 납달리의 거룩한 곳
  lexicon: קֶדֶשׁ + נַפְתָּלִי
  rationale: 지명으로 기능하는 결합형이므로 현대 한국어에서는 ‘납달리의 게데스’로 옮겨 소속 관계를 드러냈습니다.
- source_word: הֲלֹא צִוָּה
  english_pob_choice: Has not the LORD ... commanded
  chosen_korean: 명령하지 않으셨습니까
  alternatives_korean:
  - 명령하지 않으셨습니까
  - 명령하셨지 않습니까
  lexicon: צוה
  rationale: 수사적 반문을 한국어 자연스러운 공손체로 살리기 위해 질문형으로 옮겼습니다. ‘명령하셨지 않습니까’보다 문맥상 더 직접적이고 간결합니다.
- source_word: לֵךְ וּמָשַׁכְתָּ בְּהַר תָּבוֹר
  english_pob_choice: Go, draw up to Mount Tabor
  chosen_korean: 가서 다볼 산으로 올라가서
  alternatives_korean:
  - 가서 다볼 산으로 진군하여
  - 가서 다볼 산으로 올라가며
  lexicon: הלך / משך
  rationale: POB의 ‘draw up’를 군사적 배치로 풀되, 여기서는 실제 전개 동작을 담는 ‘올라가다’가 산지 지형과 명령의 방향성을 함께 보여 줍니다.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  english_pob_choice: ten thousand men
  chosen_korean: 만 명
  alternatives_korean:
  - 열만 명
  - 만 사람
  lexicon: עשר אלף איש
  rationale: 히브리어 수량 표현의 통상적 한국어 관용을 따르되, 전투 병력임을 유지하기 위해 ‘명’을 사용했습니다.
theological_decisions:
- issue: YHWH를 어떻게 표기할지
  chosen_reading: 야훼께서
  alternative_readings:
  - 여호와께서
  - 주께서
  rationale: 본문의 원문 신명 표기를 한국어 학술-직역 관행에 따라 ‘야훼’로 반영했습니다. POB의 audit trail이 LORD를 유지하더라도, 원문 중심 번역 원칙에 맞춰 본문은 야훼를 사용합니다.
  doctrine_reference: 테트라그라마톤 표기 관행
