  meaning_decisions:
  - source_phrase: ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης
    prior_rendering: the crowd that had been standing on the other side of the sea
    new_rendering: the crowd that had remained on the other side of the sea
    rationale: The participle identifies the crowd still located across the sea; their posture is not the point.
  - source_phrase: εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
    prior_rendering: saw that no other small boat had been there except one
    new_rendering: realized that only one boat had been there
    rationale: The crowd is taking account of the circumstances surrounding Jesus' departure, and the cumbersome negative construction simply establishes that there had been only one boat.
  - source_phrase: οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ πλοῖον
    prior_rendering: Jesus had not gone with his disciples into the boat
    new_rendering: Jesus had not boarded it with his disciples
    rationale: The compound verb specifically concerns entering the boat together, which explains why the crowd cannot account for Jesus' departure.
