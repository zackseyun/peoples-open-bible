    text: ‘욕되게 하다’는 히브리어 יְחַלֵּלוּ의 번역입니다. 이 말은 ‘더럽히다’, ‘속된 것으로 여기다’, 또는 문맥상 ‘범하다’로도 옮길 수 있습니다.
