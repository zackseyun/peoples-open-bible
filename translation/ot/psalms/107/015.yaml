  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Rendering of אדם in the idiom בני אדם
  chosen_reading: children of man
  alternative_readings:
  - humankind
  - sons of men
  rationale: The Hebrew is grammatically masculine but representative. The chosen rendering preserves the idiom and gender-accurate form without flattening it into a purely abstract collective.
