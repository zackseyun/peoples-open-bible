  from: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
  to: So Saul removed David from his presence and appointed him commander of a thousand men. David led the people out to battle and back again[a].
  rationale: The earlier lexical discussion and note recognize public or military leadership but leave the idiom untranslated in the main text. David’s appointment here and the people’s response in verse 16 support expressing military leadership directly, without adding a claim that Saul formally demoted him.
