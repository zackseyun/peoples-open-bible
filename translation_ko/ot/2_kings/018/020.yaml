  source_fidelity: 원문의 ‘입술의 말’이라는 비꼬는 표현과 ‘전쟁을 위한 계략과 힘’의 병렬, 신뢰의 대상과 반역을 추궁하는 질문을 대체로 잘 반영했습니다. 다만 본문은 ‘입술의 말’의 발화 범위가 문법적으로 논의될 수 있으므로, 현재 각주처럼 ‘빈말’이라는 단순 의미 풀이보다 이 구절의 문장/인용 범위에 관한 대안을 제시하는 편이 더 정확합니다. 또한 ‘계략’은 עֵצָה의 가능한 의미이나, 본문이 요구하지 않는 부정적 뉘앙스를 더할 수 있어 ‘모략’보다 중립적인 ‘계획’이 안전합니다.
  naturalness: 합쇼체 질문과 대결적인 어조는 자연스럽습니다. 다만 ‘당신은’은 현대 한국어에서 부부 사이 또는 감정적으로 맞서는 상황을 연상시킬 수 있어, 고대 왕에게 직접 말하는 문맥에서는 ‘그대는’이 더 중립적인 문어적 호칭입니다.
