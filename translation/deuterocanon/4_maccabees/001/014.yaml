id: 4MA.1.14
reference: 4 Maccabees 1:14
source:
  edition: lxx-swete-1909
  text: διακρίνωμεν δέ, τί ποτέ ἐστιν λογισμός, καὶ τί πάθος, καὶ πόσα παθῶν εἰδέα, καὶ εἰ πάντων ἐπικρατεῖ τούτων ὁ λογισμός.
  language: Greek
  pages:
  - 752
  - 753
  - 754
  - 755
  - 786
  - 787
  - 788
  - 789
  confidence: high
  validation: agree
translation:
  text: But let us determine what reason is, what a passion is, how many kinds of passions there are, and whether reason rules over them all.
  philosophy: dynamic
lexical_decisions:
- source_word: διακρίνωμεν
  chosen: let us determine
  alternatives:
  - let us distinguish
  - let us decide
  - let us examine
  lexicon: LSJ
  rationale: The hortatory subjunctive invites a shared inquiry. In context, the sense is not merely separating categories but carefully determining/defining them before argument proceeds.
- source_word: λογισμός
  chosen: reason
  alternatives:
  - reasoning
  - rational judgment
  - rational thought
  lexicon: LSJ
  rationale: In 4 Maccabees this term denotes the faculty of rational judgment central to the book's thesis. 'Reason' is concise and natural English, while still carrying the philosophical sense.
- source_word: πάθος
  chosen: passion
  alternatives:
  - emotion
  - passion/impulse
  - suffering
  lexicon: LSJ
  rationale: In this philosophical context πάθος refers to an affective impulse or passion rather than suffering. 'Passion' best preserves the Hellenistic ethical register and the contrast with reason.
- source_word: πόσα παθῶν εἰδέα
  chosen: how many kinds of passions there are
  alternatives:
  - how many forms of passions there are
  - how many species of passions there are
  lexicon: LSJ
  rationale: εἰδέα here means kinds/forms. 'Kinds' is clearer modern English than 'species' or 'forms' while preserving the classificatory sense.
- source_word: ἐπικρατεῖ
  chosen: rules over
  alternatives:
  - prevails over
  - has mastery over
  - controls
  lexicon: LSJ
  rationale: The verb conveys dominance or mastery. 'Rules over' preserves the governing metaphor and reads naturally in English; it is slightly more vivid than 'prevails over' and less reductive than 'controls'.
- source_word: τούτων
  chosen: all these
  alternatives:
  - all of them
  - all these things
  lexicon: LSJ
  rationale: The pronoun refers back to the passions just mentioned. 'All these' is idiomatic and keeps the demonstrative force.
