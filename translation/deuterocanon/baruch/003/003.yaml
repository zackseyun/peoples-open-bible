translation:
  text: For you sit enthroned forever[a], while we are perishing forever.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'you sit forever.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  chosen: for
  alternatives:
  - because
  lexicon: BDAG
  rationale: Introduces the ground or explanation for the plea in context; 'for' is concise and natural in English while preserving the causal force.
- source_word: σὺ
  chosen: you
  lexicon: BDAG
  rationale: Explicit pronoun retained for emphasis, contrasting God with 'we' in the second clause.
- source_word: καθήμενος
  chosen: remain seated
  alternatives:
  - sit enthroned
  - are seated
  - sit
  lexicon: BDAG
  rationale: The participle literally denotes sitting; in reference to God it can imply enthronement or abiding rule. 'Remain seated' preserves the posture image and the durative contrast with human perishing without importing 'throne' where the Greek does not state it.
- source_word: τὸν αἰῶνα
  chosen: forever
  alternatives:
  - for the age
  - for ever
  lexicon: BDAG
  rationale: Idiomatic accusative of duration meaning enduringly or forever. Modern English 'forever' best conveys the sense.
- source_word: ἡμεῖς
  chosen: we
  lexicon: BDAG
  rationale: Explicit pronoun retained to preserve the sharp contrast between divine permanence and human/corporate ruin.
- source_word: ἀπολλύμενοι
  chosen: are perishing
  alternatives:
  - are being destroyed
  - are wasting away
  - perish
  lexicon: BDAG
  rationale: Present middle/passive participle conveys an ongoing state/process. 'Are perishing' preserves the durative aspect and leaves open whether the emphasis is destruction, ruin, or wasting away.
- source_word: τὸν αἰῶνα
  chosen: forever
  alternatives:
  - for the age
  - continually
  lexicon: BDAG
  rationale: Repeated for rhetorical parallelism with the first clause; rendered consistently as 'forever'.
