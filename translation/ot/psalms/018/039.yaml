id: PSA.18.39
reference: Psalms 18:39
source:
  edition: WLC
  text: וַ/תְּאַזְּרֵ֣/נִי חַ֭יִל לַ/מִּלְחָמָ֑ה תַּכְרִ֖יעַ קָמַ֣/י תַּחְתָּֽ/י׃
translation:
  text: You equipped me with strength for battle[a]; you made those who rose against me bow beneath me.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “You girded me with strength for battle.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  chosen: you equipped me
  alternatives:
  - you girded me
  - you armed me
  lexicon: HALOT
  rationale: From אזר in the sense of girding or equipping. 'Equipped me' preserves the metaphorical sense of being furnished/prepared while using natural modern English. 'Girded me' is more formal/traditional but less transparent for contemporary readers; 'armed me' is possible but too narrow, since the object is strength rather than weapons.
- source_word: חַיִל
  chosen: strength
  alternatives:
  - might
  - valor
  - army
  lexicon: HALOT
  rationale: In this context חַיִל denotes martial strength or capacity rather than an army as a collective noun. 'Strength' fits the collocation with preparation for battle and avoids overstating a specifically moral nuance like 'valor.'
- source_word: לַמִּלְחָמָה
  chosen: for battle
  alternatives:
  - for war
  lexicon: HALOT
  rationale: The noun means war/battle. 'For battle' is idiomatic in English and suits the immediate combat context; 'for war' is possible but slightly broader and less natural here.
- source_word: תַּכְרִיעַ
  chosen: you made ... bow
  alternatives:
  - you caused ... to bow
  - you subdued
  lexicon: HALOT
  rationale: The Hiphil expresses causing the opponents to bend or bow, not merely the abstract result of subduing them.
- source_word: קָמַי
  chosen: those who rose against me
  alternatives:
  - my adversaries
  - those who stood up against me
  lexicon: HALOT
  rationale: From קום, participial sense 'those rising against me.' The chosen rendering preserves the verbal imagery of hostile uprising and the adversative force marked by context. 'My adversaries' is smoother but loses the participial vividness.
- source_word: תַּחְתָּי
  chosen: beneath me
  alternatives:
  - beneath me
  lexicon: HALOT
  rationale: This retains the spatial image of opponents brought into a subjugated position.
