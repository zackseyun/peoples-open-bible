  source_fidelity: ‘ፍጹመ’의 ‘먼저/선두에서’ 의미가 초안에서 빠졌고, ‘ማኅፈድ’은 영어 감사 번역과 어휘 결정이 지시하는 ‘탑’을 ‘성’으로 바꾸어 원문보다 다른 건축물을 지칭하게 합니다. 또한 ‘자기들 앞에 있는’은 발견의 동작을 충분히 드러내지 못합니다.
  naturalness: 초안의 ‘그와 함께 있던 …과 함께’는 중복적이며, ‘하나도, 한 사람도 없었습니다’는 한국어에서 부자연스럽습니다. 병렬 구문과 ‘단 한 사람도’로 자연스럽고도 강조를 보존할 수 있습니다.
  terminology: 고유명사 ‘유다, 납달리, 갓’와 ‘종’은 적절합니다. 장소는 해석적으로 ‘성’이 아니라 ‘탑’으로 유지해야 합니다.
