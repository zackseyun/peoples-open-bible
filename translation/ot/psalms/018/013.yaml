  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: idiom
  tier: 1
  from: Yahweh thundered in the heavens[a][b], and the Most High gave his voice—hailstones and coals of fire.
  to: Yahweh thundered in the heavens, and the Most High made his voice heard—hail and coals of fire.
  rationale: “Gave his voice” is an unnecessarily literal English calque of the Hebrew idiom. “Made his voice heard” gives its natural sense while retaining the image of a voice. בָּרָד is best rendered by the collective mass noun “hail”; “hailstones” is possible but more object-specific than the Hebrew requires.
