  from: Bless Yahweh[a], his angels, mighty in strength, who do his word, obeying the voice of his word.
  to: Bless Yahweh, his angels, mighty in strength, who carry out his word, heeding the voice of his word.
  rationale: “Carry out his word” is a justified natural-English improvement over “do his word.” The proposal’s “obeying his spoken command,” however, narrows דָּבָר to “command” and suppresses the deliberate קול (“voice”) image. In this context שׁמע בקול naturally means to heed or obey a voice; “heeding the voice of his word” preserves both that idiom and the Hebrew image without the proposal’s added precision. The existing note is attached to “Yahweh” although it concerns the final phrase and should not be retained.
