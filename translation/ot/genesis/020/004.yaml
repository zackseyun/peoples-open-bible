  rationale: The Hebrew uses a collective term, and the context in the surrounding passage shows judgment threatening more than the individual king. 'Nation' preserves that corporate dimension without overinterpreting the exact political scale.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
