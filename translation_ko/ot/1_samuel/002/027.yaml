    issue: 이집트에 있었던 주체가 불명확하게 번역됨
    rationale: ‘내가 이집트에 있었고’는 야훼가 이집트에 있었다는 뜻으로 읽히지만, 원문은 엘리의 조상 집안이 이집트에서 바로의 집에 속해 있던 때를 말합니다.
  - severity: medium
    issue: 강조된 수사 의문문의 뉘앙스가 약함
    rationale: ‘정말로 … 나타냈느냐?’보다 ‘분명히 … 나타내지 않았느냐?’가 히브리어 절대부정사와 유한동사의 반복이 나타내는 확언적 수사 질문을 더 잘 반영합니다.
  - severity: low
