  text: ἱκανὸς δὲ ⸂κλαυθμὸς ἐγένετο⸃ πάντων, καὶ ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου κατεφίλουν αὐτόν,
translation:
  text: They all wept a great deal, threw their arms around Paul’s neck, and kept kissing him.
  philosophy: dynamic
lexical_decisions:
- source_word: ἱκανὸς κλαυθμὸς ἐγένετο πάντων
  chosen: They all wept a great deal
  alternatives:
  - There was much weeping among them all
  - They all wept greatly
  lexicon: BDAG
  rationale: The construction describes substantial weeping by everyone present. The selected wording is natural modern English without reducing the intensity.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  chosen: threw their arms around Paul’s neck
  alternatives:
  - fell on Paul’s neck
  - embraced Paul
  lexicon: BDAG
  rationale: This idiomatically represents the conventional embrace while retaining the source's explicit neck imagery.
- source_word: κατεφίλουν αὐτόν
  chosen: kept kissing him
  alternatives:
  - kissed him again and again
  - were kissing him warmly
  lexicon: BDAG
  rationale: The imperfect presents continued or repeated kissing. 'Kept kissing' conveys that aspect plainly without adding an abstract adverb.
