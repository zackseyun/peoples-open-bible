translation:
  text: Fools speak whatever is in their hearts, but the wise let their hearts govern their mouths[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'In the mouth of fools is their heart, but the heart of the wise is their mouth.'
