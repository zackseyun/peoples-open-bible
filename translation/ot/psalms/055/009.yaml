id: PSA.55.9
reference: Psalms 55:9
source:
  edition: WLC
  text: בַּלַּ֣ע אֲ֭דֹנָ/י פַּלַּ֣ג לְשׁוֹנָ֑/ם כִּֽי רָאִ֨יתִי חָמָ֖ס וְ/רִ֣יב בָּ/עִֽיר־׃
translation:
  text: Swallow them up, Lord; confuse their speech[a], for I have seen violence and strife in the city.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “divide their tongue,” referring to disruption of their common speech or counsel.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  chosen: Swallow them up
  alternatives:
  - Swallow them up
  - Destroy them
  lexicon: HALOT
  rationale: The imperative preserves the verb’s literal engulfing image and its destructive force without reducing it to the inferred result of confusion.
- source_word: אֲדֹנָי
  chosen: Lord
  lexicon: HALOT
  rationale: This is the divine title 'Lord.' Per doctrine, titles are translated rather than transliterated. Since the source is אֲדֹנָי rather than YHWH, 'Lord' is appropriate, not 'the LORD'.
- source_word: פַּלַּג
  chosen: divide
  alternatives:
  - split
  lexicon: HALOT
  rationale: The imperative means 'divide' or 'split.' 'Divide' is the most natural English rendering and preserves the likely allusion to divided language at Babel.
- source_word: לְשׁוֹנָם
  chosen: their tongue
  alternatives:
  - their tongue
  - their language
  lexicon: HALOT
  rationale: The literal singular noun is retained in the text; its likely reference to speech or language is appropriately noted rather than substituted.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  lexicon: HALOT
  rationale: The conjunction introduces the reason for the plea. 'For' is concise and natural in English poetic style.
- source_word: רָאִיתִי
  chosen: I have seen
  alternatives:
  - I see
  lexicon: HALOT
  rationale: The perfect verb is well represented by the English present perfect, expressing the psalmist's observed reality as grounds for the prayer.
- source_word: חָמָס
  chosen: violence
  alternatives:
  - wrongdoing
  lexicon: HALOT
  rationale: חָמָס commonly denotes violence, brutality, or violent wrongdoing. 'Violence' is the clearest and strongest fit here.
- source_word: וְרִיב
  chosen: and strife
  alternatives:
  - and contention
  - and conflict
  lexicon: HALOT
  rationale: רִיב can denote dispute, contention, or strife. 'Strife' fits the poetic pairing with 'violence' and reads naturally.
- source_word: בָּעִיר
  chosen: in the city
  lexicon: HALOT
  rationale: A straightforward locative phrase. The article is naturally represented in English as 'the city.'
