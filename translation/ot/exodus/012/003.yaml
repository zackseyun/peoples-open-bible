  from: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
  to: 'Tell the whole congregation of Israel: On the tenth day of this month, each man shall select a lamb or a young goat for his family group, one animal for each household.'
