  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Generic masculine reference after נֶפֶשׁ
  chosen_reading: though he did not know it
  alternative_readings:
  - though the person did not know it
  - though they did not know it
  rationale: The Hebrew shifts to masculine singular verbs after the grammatically feminine נֶפֶשׁ. Per the gender-accurate policy, a masculine singular English pronoun is acceptable for representative force in legal discourse.
