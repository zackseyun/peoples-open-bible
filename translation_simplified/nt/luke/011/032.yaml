translation:
  language: en
  text: 'When the final judgment comes, the men of Nineveh will rise alongside the people of this generation and condemn them, because they reoriented toward God[b] in response to Jonah’s message. And take notice: something greater than Jonah is here.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “one greater than Jonah is here” or “more than Jonah is here.” The Greek may refer broadly to Jesus and the greater reality present in his ministry, not only to Jesus as a person.
    reason: alternative_reading
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will rise up in the judgment with this generation
  simplified_phrase: When the final judgment comes, ... will rise alongside the people of this generation
  preserved_meaning: The Ninevite men will arise together with this generation at the final judicial event.
  reasoning_layer_used: Lexical decisions for ἀναστήσονται, κρίσις, and μετά
  rationale: The reordered clause retains both the rising image and the shared judgment setting.
- pob_phrase: and behold, something greater than Jonah is here
  simplified_phrase: 'And take notice: something greater than Jonah is here'
  preserved_meaning: Jesus emphatically points to a present reality surpassing Jonah without limiting it to a personal comparison.
  reasoning_layer_used: Lexical and theological decisions for ἰδού and πλεῖον Ἰωνᾶ
  rationale: “Take notice” is clear modern English, while “something greater” preserves the documented breadth.
interpretive_expansions:
- pob_phrase: in the judgment
  rendering: When the final judgment comes
  claim: The judgment is the final judicial event.
  evidence:
  - The POB lexical rationale identifies κρίσις here as the final judicial event.
  - The future rising of both groups supplies an eschatological setting.
  confidence: high
  alternatives_preserved:
  - at the judgment
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: “The people of this generation” makes the collective referent more explicit than the POB.
    mitigation: It retains “this generation” while making the English pronoun reference clear.
  - risk: Readers may take “something greater” as excluding Jesus personally.
    mitigation: The footnote states that Jesus is in view while preserving the Greek neuter’s broader scope.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
