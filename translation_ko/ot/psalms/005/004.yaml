  to: 주님께서는 악을 기뻐하시는 하나님이 아니시며, 악[a]은 주님과 함께 머무를 수 없습니다.
  rationale: 절 내용이 다른 현 초안을 삭제하고, 시편 5:4의 두 병행 진술을 완전하게 번역했습니다. ‘머무를 수 없습니다’는 גור(잠시 머물다, 체류하다)의 거처 은유와 하나님과 악의 양립 불가능성을 드러내되, 단순한 미래 예언으로 한정하지 않습니다.
