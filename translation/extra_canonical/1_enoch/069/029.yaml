translation:
  text: From now on there will be nothing that brings destruction, for that Son of Man has appeared and taken his seat on the throne of his glory. All evil will pass away and depart from his presence. There will be strength through that Son of Man, and strength before the Lord of Spirits[a]. This is the third parable of Enoch.
