id: PSA.18.24
reference: Psalms 18:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּֽשֶׁב יְהוָ֣ה לִ֣/י כְ/צִדְקִ֑/י כְּ/בֹ֥ר יָ֝דַ֗/י לְ/נֶ֣גֶד עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/024.yaml
  text: Yahweh repaid me according to my righteousness, according to the cleanness of my hands before his eyes.[a]
  footnotes:
  - marker: a
    text: “The cleanness of my hands” is a Hebrew image for innocent or upright conduct.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 제 의로움에 따라 제게 갚아 주셨고,[a] 그분의 눈앞에서 제 손의 깨끗함에 따라 갚아 주셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갚아 주셨고’는 ‘돌려주셨고’ 또는 ‘보상하셨고’로도 옮길 수 있습니다. 히브리어 동사는 행실에 상응하여 되돌려 주거나 보응한다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손의 깨끗함’은 무고하고 정직한 행실을 가리키는 히브리어 비유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: תָמִים
  english_pob_choice: blameless
  chosen_korean: 흠이 없었고
  alternatives_korean:
  - 온전했고
  - 완전했고
  - 정결했고
  lexicon: HALOT
  rationale: 문맥상 תָמִים은 절대적 무죄보다 인격과 행실의 온전함을 가리키므로, 한국어로는 도덕적 결함이 없다는 뜻을 살린 ‘흠이 없었고’가 가장 자연스럽습니다.
- source_word: עִמּוֹ
  english_pob_choice: before him
  chosen_korean: 그분 앞에서
  alternatives_korean:
  - 그분과 함께
  - 그분 앞에
  - 그분과
  lexicon: HALOT
  rationale: 히브리어 עצמו는 직역하면 ‘그와 함께’이지만, 시편 문맥에서 야훼를 향한 평가·진술의 방향성을 드러내는 표현이므로 한국어에서는 관계적·법정적 뉘앙스를 살린 ‘그분 앞에서’로 옮겼습니다.
- source_word: וָאֶשְׁתַּמֵּר
  english_pob_choice: I kept myself
  chosen_korean: 제 자신을 지켰습니다
  alternatives_korean:
  - 저 자신을 지켰습니다
  - 스스로를 지켰습니다
  - 저를 지켰습니다
  lexicon: HALOT
  rationale: 반사적 뉘앙스를 살리되 현대 한국어에서 자연스럽게 읽히도록 ‘지켰습니다’로 옮겼습니다. ‘제 자신’은 스스로의 절제와 경계를 분명히 드러냅니다.
- source_word: מֵעֲוֺנִי
  english_pob_choice: from my iniquity
  chosen_korean: 제 죄악에서
  alternatives_korean:
  - 제 불의에서
  - 제 죄에서
  - 제 죄책에서
  lexicon: HALOT
  rationale: עָוֹן은 단순한 실수보다 윤리적 왜곡과 죄책을 함께 지니므로, 전통적이면서도 무게감이 있는 ‘죄악’이 적절합니다. מן은 분리·탈피를 나타내므로 ‘에서’로 처리했습니다.
theological_decisions:
- issue: תָמִים의 도덕적 범위
  chosen_reading: ‘흠이 없었다’는 죄 없는 완전무결이 아니라, 시편 화자의 실제 행실에 대한 진실한 무결성 진술로 읽습니다.
  alternative_readings:
  - 완전무결한 상태
  - 절대적 무죄
  rationale: 본문은 다윗의 변호와 구원 경험 속에서의 자기 진술이므로, 인간의 무흠성 교리를 세우는 방향으로 과장하지 않고 본문의 강한 윤리적 주장을 보존해야 합니다.
  doctrine_reference: 시적 진술은 신학적 긴장을 보존해야 하며, 본문이 말하지 않는 무죄 교리를 주입하지 않습니다.
