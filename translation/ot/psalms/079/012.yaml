id: PSA.79.12
reference: Psalms 79:12
source:
  edition: WLC
  text: וְ/הָ֘שֵׁ֤ב לִ/שְׁכֵנֵ֣י/נוּ שִׁ֭בְעָתַיִם אֶל חֵיקָ֑/ם חֶרְפָּ֘תָ֤/ם אֲשֶׁ֖ר חֵרְפ֣וּ/ךָ אֲדֹנָֽ/י־׃
translation:
  text: Return to our neighbors the insults they directed at you, O Lord—sevenfold into their laps[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The fold of a robe formed a pouch at the lap for receiving things; here it pictures the offenders receiving their repayment.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָשֵׁב
  chosen: return
  alternatives:
  - return
  - pay back
  - bring back
  lexicon: HALOT
  rationale: Preserves the Hebrew return image and its retaliatory force.
- source_word: לִשְׁכֵנֵינוּ
  chosen: our neighbors
  alternatives:
  - those who dwell around us
  - our neighboring peoples
  lexicon: HALOT
  rationale: שָׁכֵן means a neighbor or one dwelling nearby. In this psalm's national lament context it likely refers to surrounding nations, but 'our neighbors' preserves the lexical form without over-specifying beyond the Hebrew.
- source_word: שִׁבְעָתַיִם
  chosen: sevenfold
  alternatives:
  - seven times
  lexicon: HALOT
  rationale: The dual-like adverbial form means 'sevenfold' or 'seven times.' 'Sevenfold' is idiomatic in English for intensified retribution and fits the poetic register.
- source_word: אֶל חֵיקָם
  chosen: into their laps
  alternatives:
  - into their bosom
  - upon their breast
  lexicon: HALOT
  rationale: Retains the concrete idiom in clear English; plural laps follows the plural possessive naturally.
- source_word: חֶרְפָּתָם
  chosen: the reproach
  alternatives:
  - their reproach
  - the taunt
  - the disgrace
  lexicon: HALOT
  rationale: Although formally 'their reproach,' the following relative clause defines it as the reproach they directed against God. English reads more smoothly with 'the reproach,' while the possessive sense is still conveyed by context. 'Reproach' best preserves the verbal link with חֵרְפוּ.
- source_word: אֲשֶׁר חֵרְפוּךָ
  chosen: with which they reproached you
  alternatives:
  - that they hurled at you
  - with which they taunted you
  lexicon: HALOT
  rationale: Using 'reproached' for the verb preserves the cognate relationship with חֶרְפָּה ('reproach'). The prepositional English phrase 'with which' naturally renders the relative clause.
- source_word: אֲדֹנָי
  chosen: O Lord
  alternatives:
  - Lord
  lexicon: HALOT
  rationale: אֲדֹנָי is the divine title 'Lord.' The vocative particle is not separate in Hebrew, but English commonly marks direct address with 'O' in prayer language, which suits the psalmic style without becoming archaic.
- source_word: חֶרְפָּתָם אֲשֶׁר חֵרְפוּךָ
  chosen: the insults they directed at you
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Communicates their reproach of God without an unnatural English cognate repetition.
