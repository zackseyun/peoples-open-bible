  text: 악한 일이 그에게 쏟아졌으니,[a] 그가 누우면 다시는 일어나지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악한 일’(히브리어 ‘벨리알의 말/일’)은 뜻이 어려운 표현입니다. 그에게 닥친 악한 병을 가리킬 수도 있고, 그를 무너뜨리려는 악의적인 고발이나 비난을 가리킬 수도 있습니다.
    reason: alternative_reading
