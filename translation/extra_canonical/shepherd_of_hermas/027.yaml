theological_decisions:
- issue: Personified evil in speech ethics (δαιμόνιον for slander)
  chosen_reading: Render δαιμόνιον as “demon,” preserving Hermas’s demonological framing.
  alternative_readings:
  - Euphemize as “evil spirit” or metaphorical “evil power”
  rationale: Hermas explicitly characterizes slander as a restless δαιμόνιον; retaining “demon” fits early
    Christian worldview and the text’s personification.
- issue: Scope of almsgiving (“Give to all”) and moral responsibility
  chosen_reading: Imperative “Give to all” kept unsoftened; the recipient’s accountability to God balances
    the exhortation.
  alternative_readings:
  - Qualify with prudential limits in the translation
  rationale: The Greek repeats πᾶσιν δίδου without qualification and immediately assigns judgment to recipients,
    absolving the giver; the translation should reflect that structure.
- issue: Rendering ζήσεται (“will live”)
  chosen_reading: Leave the promise unqualified as “will live.”
  alternative_readings:
  - Specify “will live before God” or “will have eternal life”
  rationale: Retain unqualified will live and the earlier service-to-God attachment after explicit dative
    reconsideration. The alternative attachment will live to God is disclosed; no temporal or eschatological
    restriction is imposed.
- issue: διακονία for almsgiving
  chosen_reading: Translate as “ministry” to God, not merely “service.”
  alternative_readings:
  - Render as generic “service”
  rationale: Hermas frames almsgiving as a God‑given ministry received from the Lord; preserving “ministry”
    keeps ecclesial resonance.
- issue: Contextual repentance reassessment
  chosen_reading: Exact reader wording is recorded in config/terminology/repentance-contextual-2026-10-13.json#translation/extra_canonical/shepherd_of_hermas/027.yaml
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
