  rationale: ל의 관계가 저자·헌정·소속을 모두 열어 두므로, 해석을 한정하지 않는 ‘다윗의’가 원문의 유보를 가장 잘 보존합니다.
theological_decisions:
- issue: 시편 표제의 관계 표현 לְדָוִד의 모호성
