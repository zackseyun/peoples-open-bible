id: PSA.110.6
reference: Psalms 110:6
source:
  edition: WLC
  text: יָדִ֣ין בַּ֭/גּוֹיִם מָלֵ֣א גְוִיּ֑וֹת מָ֥חַץ רֹ֝֗אשׁ עַל אֶ֥רֶץ רַבָּֽה־׃
translation:
  text: He will judge among the nations; he will fill them with corpses; he will crush heads[a] throughout a vast land[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Hebrew “head,” understood collectively here; alternatively, “he will crush the ruler over a vast land.”
    reason: alternative_reading
  - marker: b
    text: Or, “the wide earth.”
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  chosen: he will judge
  alternatives:
  - he judges
  - he will execute judgment
  lexicon: HALOT
  rationale: Qal imperfect 3ms of דין naturally conveys future or modal action in this poetic context. 'Judge' preserves the judicial sense without over-specifying punitive action, though the context implies judgment in warfare.
- source_word: בַּגּוֹיִם
  chosen: among the nations
  alternatives:
  - among the Gentiles
  - against the nations
  lexicon: HALOT
  rationale: גּוֹיִם commonly means 'nations.' The preposition ב here is best rendered 'among' in the sense of exercising judgment in their midst. 'Gentiles' is possible but less natural in this psalmic royal context.
- source_word: מָלֵא גְוִיּוֹת
  chosen: he will fill them with corpses
  alternatives:
  - he will fill with corpses
  - it is full of corpses
  lexicon: HALOT
  rationale: The finite verb is represented as a parallel future clause. Hebrew leaves its object unstated; English “them” supplies an anaphoric object referring to the nations, and the addition is disclosed in a note.
- source_word: גְוִיּוֹת
  chosen: corpses
  alternatives:
  - dead bodies
  - bodies
  lexicon: HALOT
  rationale: '''Corpses'' most directly conveys the lifeless, battlefield sense of the noun and preserves the severity of the image better than the softer ''bodies.'''
- source_word: מָחַץ
  chosen: he will crush
  alternatives:
  - he shatters
  - he smites
  lexicon: HALOT
  rationale: The verb denotes violent striking that breaks or crushes. 'Crush' is vivid, current English and fits the martial context.
- source_word: רֹאשׁ
  chosen: the head
  alternatives:
  - a head
  - chief
  lexicon: HALOT
  rationale: The concrete singular image should remain in the main text. Its possible sense “chief” or “ruler” is appropriately documented in a note rather than imposed.
- source_word: עַל אֶרֶץ רַבָּה
  chosen: over a vast land
  alternatives:
  - over the wide earth
  - throughout a great land
  - over many lands
  lexicon: HALOT
  rationale: “Over” represents עַל, “vast” conveys the extensive sense of רַבָּה, and “land” retains the narrower sense of אֶרֶץ while “earth” is noted.
