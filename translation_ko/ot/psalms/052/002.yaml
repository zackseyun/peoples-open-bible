source:
  edition: WLC
  text: בְּ/ב֤וֹא דּוֹאֵ֣ג הָ/אֲדֹמִי֮ וַ/יַּגֵּ֪ד לְ/שָׁ֫א֥וּל וַ/יֹּ֥אמֶר ל֑/וֹ בָּ֥א דָ֝וִ֗ד אֶל בֵּ֥ית אֲחִימֶֽלֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/002.yaml
  text: Why do you boast in evil, mighty man? The steadfast love of God endures all day long.
  footnotes:
  - marker: a
    text: Or 'David came to the house of Ahimelech.' The Hebrew perfect in reported speech can be rendered either with simple past or with present relevance ('has come').
