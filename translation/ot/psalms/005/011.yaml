id: PSA.5.11
reference: Psalms 5:11
source:
  edition: WLC
  text: וְ/יִשְׂמְח֨וּ כָל ח֪וֹסֵי בָ֡/ךְ לְ/עוֹלָ֣ם יְ֭רַנֵּנוּ וְ/תָסֵ֣ךְ עָלֵ֑י/מוֹ וְֽ/יַעְלְצ֥וּ בְ֝/ךָ֗ אֹהֲבֵ֥י שְׁמֶֽ/ךָ־׃
translation:
  text: But let all who take refuge in you rejoice; let them shout for joy forever. Shelter them, and let those who love your name exult in you.
  philosophy: dynamic
lexical_decisions:
- source_word: וְיִשְׂמְחוּ
  chosen: let ... rejoice
  alternatives:
  - and they will rejoice
  - and may they rejoice
  lexicon: HALOT
  rationale: Qal imperfect 3mp of שׂמח can be read as jussive in this prayer context. English 'let ... rejoice' captures the volitional/prayer nuance better than a simple future.
- source_word: חוֹסֵי בָךְ
  chosen: who take refuge in you
  alternatives:
  - who seek shelter in you
  - who trust in you
  lexicon: HALOT
  rationale: The participle of חסה denotes seeking refuge/protection, not merely internal trust. 'Take refuge' preserves the concrete protective imagery.
- source_word: לְעוֹלָם
  chosen: forever
  alternatives:
  - for ever
  - continually
  lexicon: HALOT
  rationale: The phrase marks enduring duration. 'Forever' is idiomatic modern English and fits the poetic line.
- source_word: יְרַנֵּנוּ
  chosen: let them shout for joy
  alternatives:
  - let them sing for joy
  - let them cry out jubilantly
  lexicon: HALOT
  rationale: Piel of רנן often conveys ringing cries of joy. 'Shout for joy' preserves the vocal exuberance more clearly than the narrower 'sing.'
- source_word: וְתָסֵךְ עָלֵימוֹ
  chosen: Cover them
  alternatives:
  - and cover them
  - and shelter them
  - and hedge them about
  lexicon: HALOT
  rationale: This retains the Hebrew image of covering while the context and note make its protective force clear.
- source_word: וְיַעְלְצוּ בְךָ
  chosen: exult in you
  alternatives:
  - may rejoice in you
  - may triumph in you
  lexicon: HALOT
  rationale: עלץ denotes especially jubilant rejoicing; “exult” is idiomatic in this poetic register and preserves the stronger sense.
- source_word: אֹהֲבֵי שְׁמֶךָ
  chosen: those who love your name
  alternatives:
  - lovers of your name
  - those who love you
  lexicon: HALOT
  rationale: The Hebrew explicitly says 'your name,' a common covenantal expression for God's revealed character and reputation. It should not be flattened to simply 'you,' though the relational sense is included.
