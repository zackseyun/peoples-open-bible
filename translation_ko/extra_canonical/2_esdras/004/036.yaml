  naturalness: ‘대답하여 말하였습니다’는 성서 문체에서 자연스럽습니다. ‘저울에 달아 보았기 때문입니다’는 자연스럽지만, 이 구절의 문장 연결을 위해 종결형 대신 이어지는 표현으로 고치는 것이 좋습니다.
  terminology: ‘대천사’는 archangelus의 적절한 번역입니다. saeculum은 신학적 해석을 덧붙이지 않고 ‘시대’로 옮기며 각주에서 가능한 범위를 안내하는 편이 원문의 다의성을 더 잘 보존합니다.
  issues:
