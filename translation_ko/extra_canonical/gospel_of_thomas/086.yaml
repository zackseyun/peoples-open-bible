base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/086.yaml
  text: Jesus said, "The foxes have their holes, and the birds have their nest, but the Son of Man does not have a place to lay his head and rest."
  footnotes:
  - marker: holes
    text: The manuscript reads ⲛⲟⲩ[ⲃⲏ]ⲃ ('a hole/den'), but this is generally understood or emended as ⲛⲉⲩⲃⲏⲃ ('their holes') to parallel 'their nest' (ⲙⲡⲉⲩⲙⲁϩ) in the following clause.
    reason: textual_variant
  - marker: nest
    text: Thomas uses the singular 'nest' (ⲡⲉⲩⲙⲁϩ) and omits 'of the air', diverging from the canonical parallels (Matthew 8:20, Luke 9:58).
    reason: cross_reference
  - marker: and rest
    text: Thomas adds the phrase 'and rest' (ⲛϥⲙⲧⲟⲛ ⲙⲙⲟϥ), which is absent from the Synoptic versions of this saying.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “여우들에게는 굴이 있고[a], 새들에게는 둥지가 있으나[b], 인자에게는 머리를 기울여 쉴 곳이 없습니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사본에서 여우와 그 굴을 말하는 구절의 일부가 손상되어 있습니다. 여기의 ‘여우들에게는 굴이’는 손상된 본문을 보충한 정본의 읽기에 따른 번역입니다.
    reason: textual_variant
  - marker: b
    text: 토마스복음은 공관복음의 병행본문과 달리 새들을 ‘공중의 새들’이라고 하지 않으며, ‘둥지’는 단수형입니다.
    reason: cross_reference
  - marker: c
    text: 토마스복음은 공관복음의 병행본문에 없는 ‘쉬다’라는 표현을 덧붙입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲃⲁϣⲟⲣ / ⲃⲏⲃ
  english_pob_choice: foxes / holes
  chosen_korean: 여우들 / 굴
  alternatives_korean:
  - 여우들 / 구멍
  - 여우들 / 굴파기
  lexicon: Crum 46b; Crum 29a
  rationale: Coptic의 복수 주어와 ‘holes/den’ 뜻을 살려 여우들은 ‘굴’이 있다고 옮겼습니다. 한국어로는 ‘구멍’보다 ‘굴’이 자연스럽고 비유적 대조도 잘 드러납니다.
- source_word: ϩⲁⲗⲁⲧⲉ / ⲙⲁϩ
  english_pob_choice: birds / nest
  chosen_korean: 새들 / 둥지
  alternatives_korean:
  - 새들 / 집
  - 새들 / 보금자리
  lexicon: Crum 670b; Crum 208a
  rationale: 본문은 단순히 ‘새들’과 그들의 ‘둥지’를 말하며, 공중이라는 관형어는 없습니다. ‘둥지’가 가장 직접적이고, ‘보금자리’보다 원문 이미지에 가깝습니다.
- source_word: ⲣⲱⲙⲉ
  english_pob_choice: Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인간의 아들
  lexicon: 표준 복음서 관용 번역
  rationale: 인자 표현은 한국어 성경에서 널리 굳어진 관용형을 따랐습니다. 토마스 복음서의 지혜담화 맥락을 고려해 불필요한 해설적 풀이는 피했습니다.
- source_word: ⲣⲓⲕⲉ / ⲙⲧⲟⲛ
  english_pob_choice: lay his head and rest
  chosen_korean: 머리 둘 곳도 없이 자기 머리를 눕혀 쉴 곳도 없습니다
  alternatives_korean:
  - 머리를 둘 곳도 없이 쉬지도 못합니다
  - 머리를 뉘일 곳도 없이 쉬지 못합니다
  lexicon: Crum 292a; Crum 188b
  rationale: ⲣⲓⲕⲉ는 문자적으로 ‘굽히다/기울이다’이지만 한국어 관용으로는 ‘머리를 눕히다’가 자연스럽습니다. ⲙⲧⲟⲛ의 ‘rest’는 단순한 잠자리 부족을 넘어 쉼의 부재를 나타내므로 함께 살렸습니다.
theological_decisions:
- issue: ‘인자’의 격식과 의미 범위
  chosen_reading: ‘인자’로 유지하고, 소문자로 풀거나 설명을 덧붙이지 않았습니다.
  alternative_readings:
  - 사람의 아들
  - 인간의 아들
  rationale: 영문 POB가 토마스 전승의 지혜적 맥락을 반영해 ‘Son of Man’을 낮추어 읽은 점을 존중하되, 한국어 본문에서는 성경 독자가 즉시 알아볼 수 있는 ‘인자’를 사용해 과도한 주석화를 피했습니다.
  doctrine_reference: 토마스복음의 어록 전통과 공관복음 병행구의 수용사
