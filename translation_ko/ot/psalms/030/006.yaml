  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֭/אֲנִי אָמַ֣רְתִּי בְ/שַׁלְוִ֑/י בַּל אֶמּ֥וֹט לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/006.yaml
  text: As for me, I said in my security[a], “I will never be shaken.”[b]
  footnotes:
  - marker: a
    text: Or “in my ease” or “in my tranquility.”
    reason: lexical_alternative
  - marker: b
