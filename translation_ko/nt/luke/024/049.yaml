id: LUK.24.49
reference: Luke 24:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: ko
  text: 보십시오[a], 내가 내 아버지의 약속을 여러분에게 보내고 있습니다[b]. 그러나 여러분은 위로부터 오는 능력을 입을 때까지 그 도시에 머물러 있으십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἰδοὺ는 주의를 환기하는 감탄사입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘내 아버지의 약속’을 뜻합니다.
    reason: source_note
  - marker: c
    text: ‘위로부터 오는’은 ἐξ ὕψους를 반영하여 능력의 출처를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: καὶ ἰδοὺ / And look
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: ἰδοὺ
  rationale: 감탄사적 주의를 끄는 표현이므로, 현대 합쇼체에서 자연스럽고 직접적인 경계 표현인 「보십시오」로 옮겼습니다.
- source_word: ἐξαποστέλλω
  english_pob_choice: I am sending
  chosen_korean: 보내고 있습니다
  alternatives_korean:
  - 보냅니다
  - 파견하고 있습니다
  lexicon: ἐξαποστέλλω
  rationale: 현재 진행형으로 임박한 파송 행위를 드러내는 원문 뉘앙스를 살리면서도, 한국어 문장에서는 자연스러운 진행 표현으로 처리했습니다.
- source_word: ἐπαγγελίαν τοῦ πατρός μου
  english_pob_choice: the promise of my Father
  chosen_korean: 내 아버지의 약속
  alternatives_korean:
  - 아버지의 약속
  - 내 아버지의 약속하신 것
  lexicon: ἐπαγγελία
  rationale: ἐπαγγελία를 구체적인 ‘약속하신 것’으로 풀기보다, 간결하고도 원문 명사성을 살린 「약속」으로 옮겼습니다.
- source_word: ἐνδύσησθε ἐξ ὕψους δύναμιν
  english_pob_choice: you are clothed with power from on high
  chosen_korean: 위로부터 능력을 입게 될 때까지
  alternatives_korean:
  - 높은 곳으로부터 능력을 입을 때까지
  - 위로부터 오는 능력으로 옷입게 될 때까지
  lexicon: ἐνδύω / δύναμις / ἐξ ὕψους
  rationale: ‘옷 입다’의 비유를 유지하되 한국어에서 더 자연스럽고 의미가 분명한 「능력을 입다」로 옮겼고, ἐξ ὕψους는 출처를 드러내는 「위로부터」로 처리했습니다.
theological_decisions:
- issue: 예수의 자기 파송 표현과 아버지의 약속의 관계
  chosen_reading: 예수께서 아버지의 약속을 직접 보내시는 주체로 말하는 구조를 그대로 살렸습니다.
  alternative_readings:
  - 아버지께서 약속을 보내신다
  - 내가 아버지가 약속하신 것을 보낸다
  rationale: 원문은 ἐγὼ ἐξαποστέλλω의 직접 화법을 사용하므로, 주체성을 약화하지 않고 예수의 발화를 유지하는 번역이 적합합니다.
  doctrine_reference: 누가복음 24:49의 성령/능력 약속 문맥
- issue: ‘능력으로 옷 입다’의 은유
  chosen_reading: ‘입게 될 때까지’로 직역성을 유지하면서도 한국어에서 이해 가능한 은유로 제시했습니다.
  alternative_readings:
  - ‘능력으로 옷입게 될 때까지’
  - ‘능력으로 덧입을 때까지’
  rationale: 원문 동사는 의복 은유를 분명히 담고 있으므로, 이를 삭제하지 않으면서도 독자가 의미를 즉시 파악할 수 있는 표현을 택했습니다.
  doctrine_reference: 성령 강림/권능 수여에 대한 누가-행전의 연속성
