  english_witness: 'But certain persons ignorantly deny Him, or rather have been denied by Him, being advocates of death rather than of the truth; and they have not been persuaded by the prophecies nor by the law of Moses, nay nor even to this very hour by the Gospel, nor by the sufferings of each of us severally; for they are of the same mind also concerning us.


