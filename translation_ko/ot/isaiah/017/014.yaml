  source_fidelity: 시간 대조와 הִנֵּה의 주목 촉구, 그리고 אֵינֶנּוּ의 단수 지시를 대체로 충실히 반영했습니다. 그러나 חֵלֶק(몫)과 גּוֹרָל(제비/분깃)을 모두 ‘몫’으로 옮겨 원문의 병렬 어휘가 약화되었습니다. אֵינֶנּוּ는 완료된 부재 상태이므로 ‘없어집니다’보다 ‘더 이상 없습니다’가 더 가깝습니다.
  naturalness: ‘저녁때에’, ‘아침이 되기 전에’가 간결하고 자연스러우며, ‘보십시오—공포입니다!’는 현대 공적 합쇼체의 선포 어조를 유지합니다.
  terminology: ‘약탈하는 자들’과 ‘노략질하는 자들’은 שׁוֹסֵינוּ와 בֹזְזֵינוּ의 병렬을 무리 없이 구별합니다. ‘몫’과 ‘제비’를 구별하여 חֵלֶק/גּוֹרָל의 표현상 병렬도 보존했습니다.
  issues:
