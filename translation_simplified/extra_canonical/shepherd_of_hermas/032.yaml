translation:
  text: 'I.1. “Be patient[e] and sensible,” he says. “You will overcome every evil deed and do everything
    that is right.”


    I.2. “If you are patient, the holy spirit living in you will be pure. No other evil spirit will darken
    it. It will have plenty of room and rejoice with the vessel where it lives. It will serve God very
    gladly, with vitality within itself.”


    I.3. “But if a quick temper comes over you, the tender holy spirit is crowded at once. It has no clean
    place and wants to leave. The evil spirit chokes it. Quick temper defiles it and leaves it no room
    to serve the Lord as it wishes. The Lord lives in patience, but the devil in quick temper.”


    I.4. “When both spirits live together, it does no good and harms the person they live in.”


    I.5. “Put a little wormwood into a jar of honey. Does it not spoil all the honey? Even a tiny amount
    ruins so much honey and destroys its sweetness. Its owner no longer values it as before, because it
    has become bitter and useless. But without the wormwood, the honey stays sweet and useful to its owner.”[e]


    I.6. “You see that patience is sweeter than honey and useful to the Lord. He lives in it. But quick
    temper is bitter and useless. If quick temper mixes with patience, patience is defiled, and that person’s
    prayer is not useful to God.”[a]


    I.7. “Sir,” I say, “I wanted to know how quick temper works so I can guard against it.” He says, “If
    you and your household do not guard against it, you have lost all your hope. Guard against it, because
    I am with you. Everyone who repents with their whole heart will keep away from it. I will be with
    them and protect them. They have all been justified by the most revered angel.”[b][c]


    II.1. “Now hear how quick temper works,” he says. “It is evil. By its activity it overthrows God’s
    servants and leads them away from righteousness. But it cannot lead away or act on those who are full
    in faith, because the Lord’s power is with them. It leads away those who are empty and double-minded.”[d]


    II.2. “When it sees people like these standing firm, it puts itself into their heart. For no reason,
    a man or woman becomes bitter about everyday things: food, a small matter, a friend, giving or receiving,
    or other foolish matters. All these things are foolish, empty, senseless and no good for God’s servants.”[f]


    II.3. “Patience is great and strong. Its power is mighty and vigorous. It flourishes with plenty of
    room, rejoices gladly, is free from care and glorifies the Lord at all times. It has no bitterness
    inside. It always stays gentle and quiet. This patience lives with people whose faith is complete.”


    II.4. “Quick temper is foolish, flighty and senseless. Senselessness produces bitterness. Bitterness
    produces anger, anger produces wrath, and wrath produces rage. Rage, made up of so many evils, becomes
    a great sin that cannot be cured.”


    II.5. “When all these spirits live in one vessel, where the holy spirit also lives, the vessel cannot
    hold them. It overflows.”


    II.6. “The tender spirit is not used to living with an evil spirit or with hardness. It leaves that
    person and looks for gentleness and quiet to live with.”


    II.7. “When it leaves the person it lived in, that person is empty of the righteous spirit. Evil spirits
    then fill them. They are unstable in everything they do. The evil spirits pull them here and there,
    and they become completely blind in their good understanding. This happens to everyone with a quick
    temper.”[g]


    II.8. “Keep away from quick temper, that most evil spirit. Put on patience. Resist quick temper and
    bitterness. You will be found with the dignity that the Lord loves. Never forget this command. If
    you master it, you can also keep the other commands I will give you. Be strong in them and be empowered.
    Let everyone who wants to follow them be empowered.”[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: 'The old source and English stopped before the prayer clause. The working printed Greek at i.6
      reads hē enteuxis autou, “his petition/prayer”; “that person’s prayer” makes the personal referent
      explicit. Lake1907 Plate VI line1 instead has autēs, “her/its petition,” referring grammatically
      to long-suffering. Alternative: “and its petition is not useful to God.” Vulgata, Hilgenfeld1873
      printed44–45, has oratio illius deo. The prayer clause is restored without replacing the normalized
      source with the Athos pronoun.'
  - marker: b
    reason: textual_variant
    text: The i.7 warning retains the working edition’s conditional guard-against wording and its whole-heart
      repentance promise. The 1891 apparatus identifies Gebhardt’s verb correction against its reported
      Athos form; Lake’s later diplomatic transcription, Plate VI line2, has the guard form too. Vulgata
      printed45 and Palatina printed89 likewise retain the warning to the person and household. Repentance
      denotes the moral change described here, including abandoning quick temper; no additional uniform
      Godward formula is inserted.
  - marker: c
    reason: lexical_alternative
    text: “Have been justified” retains edikaiōthēsan, with “have been made righteous” as an alternative.
      The most revered angel is not silently identified as God. Vulgata printed45 has iustificati and
      the most holy messenger; Palatina printed89 paraphrases acceptance among the approved. These versional
      renderings are not identical Greek readings or additional Greek manuscripts.
  - marker: d
    reason: textual_variant
    text: 'Working ii.1 has “the Lord’s power”; Lake1907 Plate VI line6 reads “my power.” Alternative:
      “because my power is with them.” Vulgata, Hilgenfeld printed45, has the power of God; Palatina,
      Gebhardt/Harnack printed89, has the power of the Lord. Retain the working wording provisionally
      and expose Athos’s substantive possessive alternative. Sinaiticus ends in Mandate4iii and supplies
      no vote here. The printed “now” at this opening is an editorial insertion reported absent from A
      in the 1891 apparatus; Lake’s transcription also lacks it.'
  - marker: e
    reason: cultural_note
    text: Long-suffering is patient endurance, not merely waiting; the simplified edition uses patience.
      Wormwood is the bitter ingredient in the teaching comparison. The honey’s master is its owner. A
      wide space and vessel retain the passage’s images; vitality retains the earlier English choice for
      euthēnia without claiming a new lexicon consultation.
  - marker: f
    reason: textual_variant
    text: The working edition prints man or woman in ii.2; its apparatus reports Athos woman or man. Lake1907
      Plate VI line8 has that reverse order. Vulgata printed45 and Palatina printed89 have man/husband
      or woman/wife. Both sexes and the entire list of everyday provocations are retained; no social rule
      is inferred from their order.
  - marker: g
    reason: textual_variant
    text: The working Greek at ii.7 calls this the righteous spirit. The printed Vulgata at46 calls it
      the holy spirit. The draft keeps the Greek description and the sequence of departure, emptiness,
      filling with evil spirits and impaired understanding, without making the Latin wording a replacement
      Greek reading.
  - marker: h
    reason: lexical_alternative
    text: Dignity renders semnotēs; reverence or gravity are alternatives. “Never forget” retains the
      earlier English for the warning against overlooking or neglecting the command. The strengthening
      exhortation includes everyone who wishes to walk in the commands. The complete second historical
      section remains in legacy reader032; reader033 remains Mandate6i.
lexical_decisions:
- source_word: μακροθυμία / ὀξυχολία
  chosen: long-suffering / quick temper
  alternatives:
  - patient endurance / irascibility
  rationale: Preserve the ethical contrast; simplify long-suffering as patience.
- source_word: εὐθηνία
  chosen: vitality
  alternatives:
  - abundance
  - well-being
  rationale: Retain the earlier recorded English choice while restoring the omitted context.
- source_word: ἡ ἔντευξις αὐτοῦ / αὐτῆς
  chosen: that person’s prayer
  alternatives:
  - his petition
  - its petition (Athos feminine)
  rationale: Retain working masculine source with explicit Athos alternative and Latin comparison in note
    a.
- source_word: μετανοήσωσιν ἐξ ὅλης τῆς καρδίας αὐτῶν
  chosen: repents with their whole heart
  alternatives:
  - wholeheartedly changes conduct
  rationale: Preserve repentance and the behavioral context without adding a formula absent from Greek.
- source_word: ἐδικαιώθησαν
  chosen: have been justified
  alternatives:
  - have been made righteous
  rationale: Retain difficult declaration and the stated agent; do not replace it with a different doctrine.
- source_word: ἡ δύναμις τοῦ Κυρίου / μου
  chosen: the Lord’s power (working reading)
  alternatives:
  - my power (Athos)
  rationale: Both printed Latin traditions support a divine-power referent, but Athos possessive is explicitly
    exposed.
- source_word: πνεύματος τοῦ δικαίου
  chosen: righteous spirit
  alternatives:
  - spirit of righteousness
  - holy spirit (Vulgata)
  rationale: Keep working Greek description and distinguish Latin rendering.
