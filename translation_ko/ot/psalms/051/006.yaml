  text: הֵן בְּ/עָו֥וֹן חוֹלָ֑לְתִּי וּ֝/בְ/חֵ֗טְא יֶֽחֱמַ֥תְ/נִי אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/006.yaml
  text: Behold[a], in iniquity I was brought forth[b][c], and in sin my mother conceived me.
  footnotes:
  - marker: a
    text: Or 'Surely' or 'Indeed' for the opening particle.
    reason: lexical_alternative
  - marker: b
    text: This verse is often understood either as confessing sinfulness from conception or as poetic hyperbole in penitence; the Hebrew itself does not fully resolve the debate.
    reason: alternative_reading
  - marker: c
    text: Or 'I was born' for 'I was brought forth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 저는 죄악 가운데서 태어났고[c][b], 제 어머니는 죄 가운데서 저를 잉태하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘참으로’ 또는 ‘정녕’. 히브리어 강조사는 이어지는 진술을 힘주어 제시합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘낳음을 받았고’ 또는 ‘태어났고’. 히브리어는 출산과 관련된 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절은 잉태 때부터의 인간 죄성에 대한 고백으로, 어머니의 죄를 가리키는 말로, 또는 참회 속 시적 과장으로 이해되기도 합니다. 히브리어 본문 자체는 이 논의를 완전히 결정하지 않습니다.
    reason: alternative_reading
