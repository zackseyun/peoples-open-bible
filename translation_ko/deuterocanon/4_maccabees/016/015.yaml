  source_fidelity: καὶ γάρ의 근거·강조 용법은 문두의 ‘또’보다 ‘참으로’로 드러내는 편이 정확합니다. συνελήμφθης, μετὰ τῶν παίδων, εἱστήκεις, ὁρῶσα βασανιζόμενον의 핵심 의미와 미완결 접속은 유지했습니다.
  naturalness: ‘당신은 … 서 계셨고—’는 원문의 직접 호소를 유지하면서 표준 현대 한국어의 격식 있는 문체에 맞습니다. 대시 앞의 연결 미완결도 자연스럽습니다.
  terminology: ‘붙잡히다’, ‘자녀들’, ‘고문당하는’, ‘엘레아자르’는 적절합니다. 다만 συλλαμβάνω가 본문에서 반드시 ‘체포’보다 더 폭력적인 구속을 암시한다고 단정하기 어려우므로 해당 각주는 삭제하는 것이 안전합니다.
  issues:
