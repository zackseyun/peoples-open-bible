  to: For this reason the kingdom of heaven may be compared to a king who wanted to settle accounts with his servants[a][b].
  rationale: The aorist passive ὡμοιώθη in Matthean parable introductions (Mt 13:24; 18:23; 22:2) functions to introduce a comparison, meaning 'is like' or 'may be compared to' (BDAG). Translating it as 'has become like' incorrectly implies a temporal change of state, misrepresenting the comparative function of the verb.
