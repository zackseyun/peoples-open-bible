  meaning_decisions:
  - source_phrase: κατὰ μηδένα τρόπον ἰσχύοντες αὐτὸν ἄγξαι
    prior_rendering: since they were in no way able to strangle him
    new_rendering: Since they could in no way break him
    rationale: ἄγχω, 'throttle', is used here of crushing his resistance; the tortures aim to make him yield, not to choke him, so a literal 'strangle' misleads. The literal wording is kept in a note.
  - source_phrase: περισύραντες τὸ δέρμα σὺν ἄκραις ταῖς τῶν δακτύλων κορυφαῖς
    prior_rendering: they dragged off the skin with the very tips of his fingers
    new_rendering: they tore off his skin together with the very tips of his fingers
    rationale: σύν is 'together with', as the 2026-05-15 revert insisted; 'together with' removes the English ambiguity of 'with' (as if his fingers were the tool).
  - source_phrase: ἀπεσκύθισον
    prior_rendering: flayed him
    new_rendering: scalped him
    rationale: The verb means to treat 'in the Scythian manner', that is, to scalp (compare περισκυθίσαντας in 2 Maccabees 7:4). 'Flayed' is kept in the note as a broader reading.
