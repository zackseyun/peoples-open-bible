id: T12P.DAN.5.10
reference: Testament of Dan 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ ἀνατελεῖ ὑμῖν *ἐκ τῆς φυλῆς [Ἰούδα καὶ] τοῦ Λευὶ τὸ σωτήριον Κυρίου⁸³, *αὐτὸς γὰρ⁸⁴ ποιήσει πρὸς τὸν Βελίαρ πόλεμον⁸⁵, καὶ τὴν ἐκδίκησιν τοῦ νίκους δώσει τοῖς⁸⁶ †πατράσιν⁸⁷ ὑμῶν⁸⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/010.yaml
  text: And for you the salvation of the Lord will arise from the tribe of Judah and Levi. For he himself will make war against Beliar, and he will grant the vengeance of victory to your fathers.
translation:
  language: pt
  text: E para vocês surgirá, da tribo de Judá e de Levi,[a] a salvação do Senhor. Pois ele mesmo fará guerra contra Beliar e concederá a vingança da vitória aos pais de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “de Judá e” aparecem entre colchetes na edição grega, indicando incerteza textual.
    reason: A fonte assinala [Ἰούδα καὶ] como texto de autenticidade ou transmissão incerta.
  - marker: b
    text: A leitura “pais” é assinalada como textualmente incerta na edição grega.
    reason: A fonte marca πατράσιν com um sinal de possível corrupção textual.
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: surgirá
  rationale: Preserva a imagem de algo que desponta ou se levanta, sem tornar a formulação excessivamente literal.
- source_word: τὸ σωτήριον Κυρίου
  choice: a salvação do Senhor
  rationale: Expressa naturalmente o substantivo grego com seu genitivo, mantendo aberta a relação entre a salvação e o Senhor.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera o nome próprio grego tradicional sem substituir por uma interpretação teológica.
- source_word: ποιήσει ... πόλεμον
  choice: fará guerra
  rationale: Equivalência direta e idiomática para a expressão grega.
- source_word: τὴν ἐκδίκησιν τοῦ νίκους
  choice: a vingança da vitória
  rationale: Mantém a construção genitiva incomum e sua possível tensão sem a resolver como simples 'vitória' ou 'vindicação'.
- source_word: πατράσιν ὑμῶν
  choice: aos vossos pais
  rationale: Reproduz o referente ancestral do texto e conserva a segunda pessoa do plural.
theological_decisions:
- issue: Origem tribal da salvação
  choice: da tribo de Judá e de Levi
  alternative: da tribo de Judá e Levi
  rationale: A repetição de 'de' é natural em português e reflete a coordenação textual sem decidir se se trata de uma única designação tribal composta ou de duas linhagens relacionadas.
- issue: Identidade do agente masculino em αὐτὸς
  choice: ele mesmo
  alternative: o próprio Senhor
  rationale: Mantém o pronome do grego e não identifica explicitamente seu antecedente além do que o texto permite.
- issue: Sentido de ἐκδίκησις
  choice: vingança
  alternative: vindicação
  rationale: Conserva o sentido judicial e retributivo mais direto, sem eliminar a possibilidade contextual de vindicação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas plurais coerentes (“vós”, “vossos”) para representar explicitamente o grego. A ordem foi levemente ajustada para fluidez, mas as ambiguidades do agente, da origem tribal e da expressão “vingança da vitória” foram preservadas.
