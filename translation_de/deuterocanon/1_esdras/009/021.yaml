base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/021.yaml
  text: 'And from the sons of Emer: Ananias, Zabdaios, Manes, Thamaios, Jerel, and Azarias.'
translation:
  language: de
  text: 'Und von den Söhnen Emers: Ananias, Zabdaios, Manes, Thamaios, Jereel und Asarias.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἐμήρ
  choice: von den Söhnen Emers
  rationale: Gibt die griechische Zugehörigkeitsformel knapp und formal wieder; der Genitiv des eingedeutschten Namens vermeidet eine schwerfällige Konstruktion.
- source_word: Ζαβδαῖος
  choice: Zabdaios
  rationale: Nahe Transliteration der griechischen Namensform, da der gegebene MT-Paralleltext für diesen Vers keine verlässliche Namensliste bietet.
- source_word: Ἰερεήλ
  choice: Jerel
  rationale: Folgt einer gut lesbaren deutschen Wiedergabe der griechischen Namensform, ohne eine nicht gesicherte Identifizierung mit einer anderen Namensform vorzunehmen.
- source_word: Ἀζαρίας
  choice: Asarias
  rationale: Verwendet die im Deutschen etablierte Form des griechischen Namens Ἀζαρίας.
