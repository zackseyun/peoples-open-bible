id: TOB.6.1
reference: Tobit 6:1
source:
  edition: lxx-swete-1909
  text: καὶ ἐπαύσατο κλαίουσα.
  language: Greek
  pages:
  - 846
  literary_form: Greek I, Swete upper Vaticanus text
  validation: published_print_checked; historical_priority_unresolved
  note: Source and main English retained. The next unit (6:3–6) locally selects the longer form. Neubauer’s prior same-numbered indirect Hebrew is archived because
    it does not align with this content.
  numbering_note: Swete comparison numbering VI 1; content alignment governs, not another edition’s verse label.
translation:
  text: And she stopped weeping[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Both Greek forms printed by Swete end Anna’s weeping here and then continue with the journey and fish episode. Different verse divisions in Neubauer’s later
      Hebrew do not establish that the Greek lacks that narrative.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπαύσατο
  chosen: stopped
  alternatives:
  - ceased
  - desisted
  lexicon: BDAG
  rationale: Aorist middle of παύω here means to stop or cease an ongoing action. 'Stopped' is natural modern English and preserves the simple verbal force without
    sounding archaic.
- source_word: κλαίουσα
  chosen: weeping
  alternatives:
  - crying
  - lamenting
  lexicon: BDAG
  rationale: Present participle of κλαίω denotes weeping/crying. 'Weeping' fits the solemn tone slightly better than 'crying' and matches the participial sense of
    ongoing action that has now ceased.
- source_word: καὶ
  chosen: And
  alternatives:
  - Then
  - So
  lexicon: BDAG
  rationale: The conjunction simply links this clause to the preceding context. 'And' is the most transparent rendering from the Greek, while still reading naturally
    in narrative.
