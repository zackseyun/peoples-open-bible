revisions:
- from: 이 백성이나 예언자나 제사장이 당신에게 와서 말하기를 ‘야훼의 무게[부담]가 무엇입니까?’ 하면, 당신은 그들에게 ‘너희가 그 무게[부담]이다. 내가 너희를 버리겠다’라고 말하십시오. 야훼의 말씀이십니다.[a][b]
  to: 이 백성이나 예언자나 제사장이 당신에게 “야훼의 신탁이 무엇입니까?” 하고 물으면, 당신은 그들에게 “무슨 신탁이냐? 내가 너희를 내버리겠다” 하고 말하십시오. 야훼의 말씀이다.[a]
  rationale: 히브리어 마소라 본문의 반문을 보존하고, מַשָּׂא의 ‘짐’과 ‘신탁’의 말놀이는 각주에서 설명했습니다. 이로써 영어 감사 이력의 해석적 “You are the burden”를 원문보다 앞세우지 않으면서도 본문의 풍자적 효과를 드러냅니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:23:49Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문은 응답부를 직역하면 “무슨 마싸(신탁/짐)냐?”라고 하며, 이어 “내가 너희를 내버리겠다”라고 선언합니다. 현 초안의 “너희가 그 무게[부담]이다”는 영어 POB의 해석적 문구를 따르지만, 제시된 WLC의 אֶת־מַה מַשָּׂא를 그대로 반영하지 않습니다.
  naturalness: “무게[부담]”는 한국어 본문 안에서 부자연스럽고, 대괄호 병기는 성경 본문 문체에도 맞지 않습니다. מַשָּׂא의 예언적 용례는 본문에서는 “신탁”으로 자연스럽게 옮기고 각주에서 문자적 의미와 말놀이를 밝혀 주는 편이 좋습니다.
  terminology: מַשָּׂא는 이 문맥에서 ‘신탁’이라는 정착된 예언 용어이면서 문자적으로는 ‘짐/부담’이라는 뜻을 지녀, 그 이중 의미가 본문의 풍자에 기여합니다. נְאֻם יְהוָה는 “야훼의 말씀입니다”보다 선언 공식인 “야훼의 말씀이다”가 자연스럽고, 직접 인용 안에서는 존대 종결을 강제하지 않는 것이 합쇼체 성경 번역의 문체상 적절합니다.
  issues:
  - severity: high
    issue: 응답부가 히브리어 본문과 다릅니다.
    rationale: WLC의 אֶת מַה מַשָּׂא는 ‘너희가 그 부담이다’가 아니라 ‘무슨 신탁(짐)이냐?’라는 반문으로 읽힙니다. 영어 POB의 해석을 우선하여 이를 대체해서는 안 됩니다.
  - severity: medium
    issue: “무게[부담]”이라는 본문 표기가 부자연스럽습니다.
    rationale: 한국어에서 ‘야훼의 무게’는 의미가 불명확합니다. מַשָּׂא의 예언 용어 의미는 ‘신탁’으로 옮기고, 어원적 ‘짐’의 의미 및 말놀이는 각주로 제시하는 것이 정확하고 읽기 쉽습니다.
  - severity: low
    issue: 종결 공식의 문체가 다소 부자연스럽습니다.
    rationale: “야훼의 말씀이십니다”는 화자의 말로 오인되기 쉽습니다. 신탁 인용의 종결 공식은 “야훼의 말씀이다”가 간결하고 관례적입니다.
