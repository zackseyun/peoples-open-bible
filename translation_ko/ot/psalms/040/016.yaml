source:
  edition: WLC
  text: יָ֭שֹׁמּוּ עַל עֵ֣קֶב בָּשְׁתָּ֑/ם הָ/אֹמְרִ֥ים לִ֝֗/י הֶ֘אָ֥ח הֶאָֽח־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/016.yaml
  text: Let all who seek you rejoice and be glad in you; let those who love your salvation[a] say continually, “May Yahweh be magnified!”
  footnotes:
  - marker: a
    text: Or 'be desolate' / 'be stunned'; the Hebrew verb can denote devastation or appalled astonishment.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'upon the עקב of their shame,' an idiom expressing consequence or cause.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님을 찾는 모든 이가 주님 안에서 기뻐하고 즐거워하게 하시며, 주님의 구원을 사랑하는 이들이 언제나 “야훼께서 크게 높임을 받으시기를!”이라고 말하게 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원’에 해당하는 히브리어 תְּשׁוּעָה는 문맥에 따라 ‘구출’ 또는 ‘구원’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘야훼께서 크게 되시기를’입니다. 이는 야훼의 위대하심이 널리 인정되고 높임을 받으시기를 바라는 찬양의 외침입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  english_pob_choice: be appalled
  chosen_korean: 놀라게 하시며
  alternatives_korean:
  - 황망하게 하시며
  - 황폐하게 하시며
  - 놀라서 굳어지게 하시며
  lexicon: HALOT
  rationale: שׁמם의 ‘황폐해지다/경악하다’ 범위를 살리되, 시편의 저주·탄식 문맥에서 자연스럽게 읽히는 현대 한국어로는 ‘놀라게 하시며’가 가장 직접적입니다.
- source_word: עַל עֵקֶב
  english_pob_choice: because of
  chosen_korean: 때문에
  alternatives_korean:
  - 으로 인해
  - 그 결과로
  - 위에
  lexicon: HALOT
  rationale: 직역하면 ‘발뒤꿈치 위에’이지만, 문맥상 원인·결과를 나타내는 관용구이므로 한국어에서는 평이한 원인 표현으로 옮겼습니다.
- source_word: בָּשְׁתָּם
  english_pob_choice: their shame
  chosen_korean: 자기 수치
  alternatives_korean:
  - 그들의 수치
  - 그들의 부끄러움
  - 치욕
  lexicon: HALOT
  rationale: בֹּשֶׁת/בָּשְׁתָּם의 공개적 수치와 모욕의 뜻을 살리면서, 문맥상 주어와의 연결을 분명히 하기 위해 ‘자기 수치’로 자연화했습니다.
- source_word: הֶאָח הֶאָח
  english_pob_choice: Aha, aha!
  chosen_korean: “아하, 아하!”
  alternatives_korean:
  - “하하, 하하!”
  - “아, 아, 아!”
  - “좋다, 좋다!”
  lexicon: HALOT
  rationale: 조롱과 조소를 나타내는 감탄사로서, 한국어에서는 ‘아하’가 가장 관용적이고 경멸적 뉘앙스를 보존합니다.
theological_decisions:
- issue: 저주적 요청의 한국어 높임말 처리
  chosen_reading: 하나님께 드리는 간구이므로 ‘하시며/하소서’로 공손한 기도체를 사용했습니다.
  alternative_readings:
  - 서술형 평서로 처리
  - 명령형을 직설적으로 옮김
  rationale: 시편의 탄원·저주 문맥은 대상이 하나님이므로, 한국어 독자는 기도 발화를 인식하도록 높임과 간구형을 유지하는 것이 적절합니다.
  doctrine_reference: 시편의 기도 장르와 하나님 직접 호칭 관습
