  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘죽음 가운데에는’과 ‘스올에서’는 히브리어의 병행된 처소 표현을 보존하며, 수사의문문도 한국어에서 자연스럽게 살아납니다.
  terminology: שְׁאוֹל은 특정한 히브리 개념을 보존하도록 ‘스올’로 음역하고 각주에 가능한 대안을 제시했습니다. זִכְרֶךָ는 문맥상 ‘주를 기억함’, יוֹדֶה לָּךְ는 ‘주께 감사하겠습니까?’로 옮겼습니다. 원문의 신명 YHWH는 이 절에서 명시되지 않고 2인칭 접미사로만 지시되므로, 한국어에서는 경건한 호칭 ‘주’를 사용했습니다.
