translation:
  text: Again the Lord said to Raphael, “Bind Azazel by his hands and feet, and cast him into darkness. Make an opening in
    the wilderness that is in Dudael, and cast him there.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The word translated “Again” is bracketed in the supplied Charles Ge'ez witness, indicating textual uncertainty;
      without it, the verse begins, “The Lord said to Raphael.”
    reason: textual_variant
  - marker: b
    text: The wording indicates making or opening a cavity in the wilderness; the verse does not explicitly use a word meaning
      “pit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  chosen: Again
  alternatives:
  - then
  - further
  rationale: The adverb marks a renewed or additional divine command. “Again” preserves that discourse connection, though
    the word is bracketed in the supplied witness and therefore textually uncertain.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እግዚእ
  chosen: the Lord
  alternatives:
  - Lord
  - the Sovereign
  rationale: In this divine-command context the noun functions as a title for God. “The Lord” is elevated, readable, and does
    not introduce the divine name where the Ge'ez witness has a title.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እሰሮ
  chosen: Bind
  alternatives:
  - Tie up
  - Fetter
  rationale: The imperative requires physical restraint as part of Azazel’s judgment. “Bind” preserves the direct command
    without specifying chains or fetters not named here.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በእዴሁ፡ ወእግሩ
  chosen: by his hands and feet
  alternatives:
  - hand and foot
  - at his hands and feet
  rationale: The rendering retains the body-part imagery and the instrumental/prepositional force of በ rather than reducing
    the phrase to the English idiom “hand and foot.” English plural “feet” is required by natural usage in this paired expression.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወድዮ
  chosen: and cast him
  alternatives:
  - and throw him
  - and hurl him
  rationale: “Cast” maintains the force and elevated judgment register of the repeated command. The same English verb is retained
    at both occurrences to preserve the source repetition.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ጽልመት
  chosen: darkness
  alternatives:
  - the darkness
  - gloom
  rationale: “Darkness” directly preserves the apocalyptic place or condition of confinement without interpreting it as death,
    hell, or a merely figurative state.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: አብቅዋ
  chosen: Make an opening
  alternatives:
  - Open
  - Dig an opening
  rationale: In sequence with confinement in the wilderness, the command denotes creating or opening a cavity. “Make an opening”
    remains close to the witness while avoiding the unsupported specificity of “dig a pit” or “make a hole.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ገዳም
  chosen: wilderness
  alternatives:
  - desert
  - waste place
  rationale: The term denotes an uninhabited or desert region. “Wilderness” gives clear modern English while preserving the
    desolate setting; it does not imply a sandy desert specifically.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዱዳኤል
  chosen: Dudael
  alternatives:
  - Duda’el
  rationale: The place-name is transliterated rather than interpreted etymologically, since the Ge'ez witness presents it
    as the location of the wilderness.
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ህየ
  chosen: there
  alternatives:
  - in it
  - therein
  rationale: The locative adverb points back to the opening or wilderness in Dudael. “There” is clear and avoids archaic “therein”
    while leaving the exact immediate spatial antecedent open.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
