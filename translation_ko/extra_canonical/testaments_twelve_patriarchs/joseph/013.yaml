  rationale: 영어 POB 감사본의 3절 삽입(‘fell upon him’)은 따르지 않고 그리스어 원문을 우선했습니다. 본문에 근거 없는 ‘내 앞에서’를 삭제했으며, ψυχάς, κἀμέ, κύριε, 고유명사 음역, 노예 신분 용어를 원문과 현대 한국어 용법에 맞게 바로잡았습니다. 초안 끝의 [a][b]에는 제공된 각주가 없으므로 삭제했습니다.
