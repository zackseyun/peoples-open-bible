  meaning: God promises that David’s throne will remain secure forever, like the moon, which bears faithful witness in the sky.
  meaning_decisions:
  - source_phrase: כְּיָרֵחַ יִכּוֹן עוֹלָם
    prior_rendering: Like the moon, it will be established forever
    new_rendering: Like the moon ... his throne will stand firm forever
    rationale: Naming the throne supplies the subject understood from the preceding verse, while “stand firm” naturally conveys the verb’s sense of enduring stability.
  - source_phrase: וְעֵד בַּשַּׁחַק נֶאֱמָן
    prior_rendering: a faithful witness in the sky
    new_rendering: that faithful witness in the sky
    rationale: Placing this phrase directly beside “the moon” makes the preferred appositional reading clear rather than allowing the throne to appear to be the witness.
