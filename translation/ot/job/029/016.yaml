id: JOB.29.16
reference: Job 29:16
source:
  edition: WLC
  text: אָ֣ב אָ֭נֹכִֽי לָֽ/אֶבְיוֹנִ֑ים וְ/רִ֖ב לֹא יָדַ֣עְתִּי אֶחְקְרֵֽ/הוּ־׃
translation:
  text: I was a father to the poor, and I investigated a case unfamiliar to me[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “I investigated the case of someone I did not know.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָב
  chosen: father
  alternatives:
  - protector
  - patron
  lexicon: HALOT
  rationale: The noun literally means 'father.' In this context it is metaphorical, expressing protective care and advocacy toward the needy. 'Father' preserves the image and moral force better than a more interpretive gloss.
- source_word: אָנֹכִי
  chosen: I was
  alternatives:
  - I am
  lexicon: HALOT
  rationale: 'The independent pronoun adds emphasis: ''I myself.'' English normally does not retain the pronoun separately here, since the clause is verbless in Hebrew and the past-time frame of Job 29 favors ''I was.'''
- source_word: לָאֶבְיוֹנִים
  chosen: to the poor
  alternatives:
  - to the needy
  - for the poor
  lexicon: HALOT
  rationale: אֶבְיוֹן denotes the poor or needy. 'The poor' is idiomatic and concise in English, while still conveying socioeconomic vulnerability. The preposition ל is naturally rendered 'to' here with the predicate 'father to.'
- source_word: וְרִיב
  chosen: and ... the case
  alternatives:
  - and ... the dispute
  - and ... the legal claim
  - and ... the cause
  lexicon: HALOT
  rationale: רִיב can denote a dispute, lawsuit, or legal case. In context of advocacy and inquiry, 'case' best captures the judicial/social sense in natural English.
- source_word: לֹא יָדַעְתִּי
  chosen: I did not know
  alternatives:
  - I had not known
  - was unknown to me
  lexicon: HALOT
  rationale: The verb ידע here means personal acquaintance or prior knowledge. 'I did not know' is the most direct rendering and fits the sense that Job examined matters even for strangers.
- source_word: אֶחְקְרֵהוּ
  chosen: I investigated
  alternatives:
  - I searched out
  - I examined
  - I inquired into
  lexicon: HALOT
  rationale: The verb denotes searching out or investigating, and its suffix can refer back to the case.
- source_word: וְרִיב לֹא יָדַעְתִּי
  chosen: and ... a case unfamiliar to me
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This takes the fronted dispute/case as the thing Job did not know, without adding an unexpressed person.
