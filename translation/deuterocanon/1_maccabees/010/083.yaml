  from: And the cavalry was scattered in the plain[a], and they fled to Azotus and entered Beth-dagon, their idol temple, to save themselves.
  to: The cavalry was scattered across the plain, and the troops fled to Azotus and entered Beth-dagon, the temple of their idol, to save themselves.
  rationale: The lexical and theological deliberation rightly understands the compressed Greek as referring to an idol’s sanctuary, not an idol statue that people enter. That meaning and the term 'idol' are retained, so the earlier explanatory note is no longer needed.
