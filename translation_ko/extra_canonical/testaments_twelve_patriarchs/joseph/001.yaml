base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001.yaml
  text: '3. In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.

    4. My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers kept me safe. They lowered me into a pit, and the Most High brought me up.

    5. I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was gripped by famine, and the Lord himself nourished me.

    6. I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]

    7. Amid slanders he spoke in my defense. In the bitter talk of dreams he rescued me.'
translation:
  language: ko
  text: '3. 저는 제 삶에서 시기와 죽음을 보았지만, 미혹되지 않았고 주님의 진리 안에 머물렀습니다.


    4. 제 형제들은 저를 미워했지만, 주님께서는 저를 사랑하셨습니다. 그들은 저를 죽이려 했지만, 제 조상의 하나님께서는 저를 지켜 주셨습니다. 그들은 저를 구덩이에 던져 넣었지만, 지극히 높으신 분께서 저를 끌어올리셨습니다.


    5. 저는 노예로 팔렸지만, 만물의 주재께서 저를 자유롭게 하셨습니다. 저는 포로가 되었지만, 그분의 강한 손이 저를 도우셨습니다. 저는 기근에 사로잡혔지만, 주님께서 친히 저를 먹여 살리셨습니다.


    6. 저는 홀로 있었지만, 하나님께서 저를 위로하셨습니다. 저는 약했지만, 주님께서 저를 찾아오셨습니다. 저는 감옥에 있었지만, 구원자께서 저에게 은총을 베푸셨습니다. [저는 쇠사슬에 묶여 있었지만, 그분께서 저를 풀어 주셨습니다.]


    7. 중상을 당할 때 그분께서 저를 변호하셨습니다. 쓰라린 꿈의 말들 가운데서 그분께서 저를 구해 내셨습니다. 저는 종이었지만, 그분께서 저를 높이셨습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλήθεια Κυρίου
  english_pob_choice: the truth of the Lord
  chosen_korean: 주님의 진리
  alternatives_korean:
  - 주님의 참됨
  - 주님의 진실
  lexicon: ἀλήθεια
  rationale: 단순한 사실성보다 주님께 속한 참된 실재와 신실한 질서를 가리키므로 ‘진리’가 가장 직접적입니다.
- source_word: εἰς δουλείαν
  english_pob_choice: into slavery
  chosen_korean: 노예로
  alternatives_korean:
  - 종살이로
  - 노예 상태로
  lexicon: δουλεία
  rationale: 영어 POB가 bonded status를 드러내기 위해 slavery를 택했으므로, 이를 약화하지 않고 ‘노예로’로 옮겼습니다.
- source_word: ὁ πάντων δεσπότης
  english_pob_choice: the Master of all
  chosen_korean: 만물의 주재
  alternatives_korean:
  - 모든 것의 주인
  - 만유의 주인
  lexicon: δεσπότης
  rationale: δεσπότης의 지배적 주권을 살리되, 한국어에서 너무 일상적인 ‘주인’보다 ‘주재’가 더 장엄하고 통치적입니다.
- source_word: ἐχαρίτωσέ με
  english_pob_choice: showed me favor
  chosen_korean: 은총을 베푸셨습니다
  alternatives_korean:
  - 호의를 베푸셨습니다
  - 은혜를 베푸셨습니다
  lexicon: χαριτόω
  rationale: 단순한 친절보다 무상한 호의·은혜를 뜻하므로 ‘은총’이 어감상 더 가깝습니다.
- source_word: λόγοις ἐνυπνίων πικροῖς
  english_pob_choice: the bitter talk of dreams
  chosen_korean: 꿈에 관한 쓰라린 말들
  alternatives_korean:
  - 쓰라린 꿈의 말들
  - 꿈에 대한 쓰디쓴 말들
  lexicon: λόγος, ἐνύπνιον, πικρός
  rationale: POB의 해석을 따라 ‘꿈들에 대한’이 아니라 ‘꿈에 관한 말들’로 두어, 중상과 해몽 논쟁의 말을 함께 드러냈습니다.
theological_decisions:
- issue: 주님의 진리 안에 머묾(3절)과 ‘길을 벗어나지 않음’의 관계
  chosen_reading: ‘길을 벗어나지 않았고 주님의 진리 안에 머물렀습니다’로 직역보다 의미를 살려 병기했습니다.
  alternative_readings:
  - ‘미혹되지 않았고’
  - ‘진리 안에 거했습니다’
  rationale: 원문은 방황/이탈의 부정을 말하면서 동시에 지속적 충성을 강조하므로, 두 의미를 함께 보존했습니다.
  doctrine_reference: 성도의 인내와 진리 안에 거함
