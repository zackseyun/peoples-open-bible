id: PSA.116.13
reference: Psalms 116:13
source:
  edition: WLC
  text: כּוֹס יְשׁוּע֥וֹת אֶשָּׂ֑א וּ/בְ/שֵׁ֖ם יְהוָ֣ה אֶקְרָֽא־׃
translation:
  text: I will lift up the cup of salvation[a], and I will call on the name of Yahweh.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “cup of salvations”; the plural may emphasize Yahweh’s acts of deliverance.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  chosen: cup
  alternatives:
  - chalice
  lexicon: HALOT
  rationale: The noun denotes a drinking vessel. 'Cup' is the natural modern English equivalent and preserves the metaphorical resonance without importing liturgical overtones that 'chalice' might suggest.
- source_word: יְשׁוּעוֹת
  chosen: salvation
  alternatives:
  - deliverance
  - victories
  lexicon: HALOT
  rationale: The plural is naturally represented by singular English in “cup of salvation”; its form and possible distributive force are retained in the note.
- source_word: אֶשָּׂא
  chosen: I will lift up
  alternatives:
  - I will raise
  - I will carry
  lexicon: HALOT
  rationale: From נשׂא, the verb commonly means 'lift, raise, carry.' In context with 'cup,' 'lift up' best fits the poetic image and standard idiom of raising a cup in thanksgiving.
- source_word: וּ/בְ/שֵׁם
  chosen: and ... on the name
  alternatives:
  - and ... in the name
  - and ... by the name
  lexicon: HALOT
  rationale: The conjunction plus preposition ב with 'name' in the idiom קרא בשם means 'call on/upon the name.' English requires restructuring rather than a wooden rendering. 'On the name' captures the established biblical idiom of invocation.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: אֶקְרָא
  chosen: I will call
  alternatives:
  - I will invoke
  - I will proclaim
  lexicon: HALOT
  rationale: In the idiom with בשם יהוה, the sense is invocation/prayer rather than mere speaking. 'I will call' becomes 'I will call on' in English to express the full idiomatic meaning.
