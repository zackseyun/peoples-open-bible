translation:
  language: en
  text: 'From Peter, an apostle of Jesus Christ.[a]


    To the chosen people who live as outsiders, scattered throughout Pontus, Galatia, Cappadocia, Asia, and Bithynia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Messiah” is also traditionally rendered “Christ.”
    reason: lexical_alternative
  - marker: b
    text: The expression “live as outsiders, scattered” may evoke both the Jewish Diaspora and the broader idea of God’s people living away from their true homeland.
    reason: cultural_note
simplification_decisions:
- pob_phrase: Peter, an apostle of Jesus the Messiah, to
  simplified_phrase: From Peter, an apostle of Jesus the Messiah. To
  preserved_meaning: Peter identifies himself as the sender and as an apostle of Jesus the Messiah, then names the recipients.
  reasoning_layer_used: POB translation and lexical decisions for ἀπόστολος and Ἰησοῦ Χριστοῦ
  rationale: Presenting the sender and recipients on separate lines makes the letter opening immediately clear while preserving Peter’s authority claim and Jesus’ messianic title.
- pob_phrase: the chosen sojourners
  simplified_phrase: the chosen people who live as outsiders
  preserved_meaning: The recipients are chosen and live with the status of people who do not fully belong where they reside.
  reasoning_layer_used: POB lexical decisions for ἐκλεκτοῖς and παρεπιδήμοις; theological decision preserving both social and theological resonance
  rationale: “Sojourners” is uncommon in modern English. “People who live as outsiders” clearly expresses their non-belonging without deciding whether their status is only social, ethnic, or theological.
- pob_phrase: of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia
  simplified_phrase: scattered throughout Pontus, Galatia, Cappadocia, Asia, and Bithynia
  preserved_meaning: The recipients belong to a dispersed people and live across the five named regions.
  reasoning_layer_used: POB lexical decision for διασπορᾶς, geographical-name decision, cultural footnote, and theological decision preserving interpretive tension
  rationale: The abstract phrase “of the dispersion” becomes the concrete and understandable image “scattered throughout.” The footnote retains both its possible Jewish-Diaspora association and its broader theological resonance.
retained_terms:
- term: apostle
  reason: This is a recognized New Testament office and authority-bearing title, not merely a generic messenger.
- term: Messiah
  reason: POB’s source-driven policy preserves Χριστός as a title; the footnote gives the familiar traditional equivalent “Christ.”
- term: Pontus, Galatia, Cappadocia, Asia, and Bithynia
  reason: These standard geographical names identify the regions where the recipients lived.
translation_notes:
  source_alignment_notes: The draft preserves Peter as sender, his apostolic office, Jesus’ title as the Messiah, the recipients as chosen, their outsider status, the image of a dispersed people, and all five regions. The corrected cultural footnote explicitly restores the possible Jewish-Diaspora resonance while also preserving the broader idea of God’s people living away from their true homeland. Neither the main text nor the note forces a purely ethnic-Jewish, literal-social, or metaphorical-Christian reading.
  readability_notes:
  - The formal letter opening is divided into clear sender and recipient lines.
  - The uncommon word “sojourners” is expressed as “people who live as outsiders.”
  - The abstract expression “of the dispersion” is rendered with the concrete image “scattered throughout.”
  compression_notes:
  - 'The formal expression “sojourners of the dispersion” is recast as two connected ideas: living as outsiders and being scattered.'
  - Individual lexical alternatives for “sojourners” are omitted because the main wording communicates their shared core sense; the culturally and theologically important interpretive range is preserved in footnote b.
  risk_flags:
  - risk: “Scattered” could be understood as only a geographic description, obscuring the Jewish-Diaspora and spiritual-homeland resonances.
    mitigation: Footnote b explicitly preserves both the possible Jewish Diaspora association and the broader idea of God’s people living away from their true homeland.
  - risk: “People who live as outsiders” may sound less forceful than “exiles.”
    mitigation: The wording preserves social non-belonging without implying involuntary banishment, in keeping with POB’s revised preference for “sojourners.”
  - risk: Some readers will be more familiar with “Jesus Christ” than “Jesus the Messiah.”
    mitigation: The main text follows POB’s title policy, while footnote a supplies “Christ” as the traditional rendering.
