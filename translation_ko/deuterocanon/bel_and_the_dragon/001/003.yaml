    rationale: ‘바빌로니아 사람들 가운데에는’도 가능한 한국어 표현이지만, 원문의 여격이 나타내는 바빌로니아인들의 소유·숭배 관계를 ‘바빌로니아 사람들에게는’이 더 충실히 반영합니다.
  - severity: low
    issue: εἰς αὐτόν의 번역
    rationale: 무생물인 우상에 ‘에게’를 쓰기보다 ‘그것을 위해’로 옮기면 원문의 지출 대상 의미와 현대 한국어 용법을 함께 살립니다.
  - severity: low
    issue: 아르타바 각주의 범위
    rationale: ‘고대 근동의 도량형’보다 ‘고대의 곡물 부피 단위’가 단위의 기능을 명확히 하면서 역사적 지역 규정을 불필요하게 단정하지 않습니다.
