id: PSA.119.108
reference: Psalms 119:108
source:
  edition: WLC
  text: נִדְב֣וֹת פִּ֭/י רְצֵה נָ֣א יְהוָ֑ה וּֽ/מִשְׁפָּטֶ֥י/ךָ לַמְּדֵֽ/נִי־׃
translation:
  text: Please accept my freewill offerings of praise[a], Yahweh, and teach me your ordinances.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'the freewill offerings of my mouth.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: וּֽמִשְׁפָּטֶיךָ
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone of 'judgments'; 'judgments/rules' preserved as alternatives.
