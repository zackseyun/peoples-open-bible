  text: 'When the glorious man, the lord of the whole tower, had finished this, he called the shepherd
    and handed over to him all the stones lying beside the tower that had been rejected from the building.
    He said to him,[a]


    2. “Carefully clean these stones and put into the building of the tower those that can fit with the
    rest. Throw those that do not fit far away from the tower.”


    3. After giving these orders to the shepherd, he left the tower with everyone who had come with him.[b]
    The virgins stood around the tower, guarding it.


    4. I said to the shepherd, “How can these stones go back into the building of the tower after being
    rejected?” He answered me, “Do you see these stones?” “I see them, sir,” I said. “I will cut most
    of these stones,” he said, “and put them into the building. They will fit with the other stones.”


    5. “Sir,” I said, “how can they fill the same space after being cut down?” He answered me, “Those
    found to be small will be put inside the building. The larger ones will be placed outside and hold
    them together.”


    6. After telling me this, he said, “Let us go, and after two days let us return, clean these stones
    and put them into the building. Everything around the tower must be cleaned, in case the master suddenly
    comes, finds the area around the tower dirty and becomes displeased. Then these stones will not go
    into the building of the tower, and I will seem negligent to the master.”


    7. After two days we came to the tower. He said to me, “Let us examine all the stones and see which
    can go into the building.” I said to him, “Sir, let us examine them.”'
