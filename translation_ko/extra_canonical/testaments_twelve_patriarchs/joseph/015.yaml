review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 14:4의 여성 주어가 남성 대명사로 옮겨졌고, 14:6의 περὶ τοῦ μεταβόλου는 문맥과 그리스어상 ‘교환’보다 ‘그 상인/거래상’에 관한 말입니다. 15:5의 κινδύνου는 ‘위험한 보복’이 아니라 ‘위험에 대한 보복’으로 옮겨야 합니다. 15:4의 ‘그들의 손에 발견되다’도 단순히 붙잡히는 것보다 그들의 지배 아래 있음이 드러나는 뜻을 보존했습니다.
  naturalness: ‘큰 사람’은 현대 표준 한국어에서 다소 부자연스러워 ‘유력한 사람’으로 고쳤습니다. 직접화법의 높임말과 서술의 합쇼체를 일관되게 유지하고, ‘베옷과 재 가운데서’를 자연스러운 관용 표현인 ‘베옷을 입고 재를 뒤집어쓴 채’로 다듬었습니다.
  terminology: δοῦλος는 두 직접화법에서 모두 ‘노예’로 통일했습니다. μετάβολος는 14:6과 15:6에서 모두 ‘상인’으로 일관되게 옮겼습니다. ‘하나님’ 및 ‘보디발’ 표기는 유지했습니다.
  issues:
  - severity: high
    issue: 14:4의 ‘그는’
    rationale: 그리스어 문맥의 주어는 여성(보디발의 아내)인데 남성 대명사로 번역되었습니다.
  - severity: medium
    issue: 14:6의 ‘교환에 관해’
    rationale: περὶ τοῦ μεταβόλου는 ‘그 상인에 관하여’라는 뜻이며, 뒤의 15:6 ὁ μετάβολος(그 상인)와 연결됩니다.
  - severity: medium
    issue: 15:5의 ‘위험한 보복’
    rationale: κινδύνου는 보복 자체의 성질을 꾸미기보다 위험/위태로움에 관련된 보복이라는 관계를 나타냅니다.
  - severity: medium
    issue: 15:4의 ‘그들의 손에 붙잡히지 않게’
