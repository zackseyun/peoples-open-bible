id: PRO.23.30
reference: Proverbs 23:30
source:
  edition: WLC
  text: לַֽ/מְאַחֲרִ֥ים עַל הַ/יָּ֑יִן לַ֝/בָּאִ֗ים לַ/חְקֹ֥ר מִמְסָֽךְ־׃
translation:
  text: Those who linger over wine, those who come to search out mixed wine[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Wine mixed with other ingredients, such as spices; the Hebrew does not specify the mixture.
    reason: cultural_note
lexical_decisions:
- source_word: מְאַחֲרִים
  chosen: linger over
  alternatives:
  - stay long at
  - tarry over
  lexicon: HALOT
  rationale: The participle from אחר in this context refers to delaying or remaining long. 'Linger over' is idiomatic modern English that preserves the sense of prolonged indulgence without archaic tone.
- source_word: עַל הַיָּיִן
  lemma: עַל
  chosen: over wine
  alternatives:
  - at wine
  - with wine
  lexicon: HALOT
  rationale: The preposition עַל with wine here conveys being occupied with or lingering over wine. 'Over wine' fits the English idiom 'linger over' and keeps the Hebrew construction's force.
- source_word: בָּאִים
  chosen: come
  alternatives:
  - come
  - enter
  lexicon: HALOT
  rationale: The participle directly means “come” and agrees with the current source-near wording.
- source_word: לַחְקֹר
  chosen: to search out
  alternatives:
  - to seek
  - to investigate
  lexicon: HALOT
  rationale: The verb carries the sense of searching or exploring. In this context it suggests actively seeking a particular kind of drink, stronger than a simple 'seek.'
- source_word: מִמְסָךְ
  chosen: mixed wine
  alternatives:
  - spiced wine
  - blended drink
  lexicon: HALOT
  rationale: The noun refers to wine mixed, likely with spices or other ingredients, to enhance potency or flavor. 'Mixed wine' is the most direct rendering; the more specific possibilities are preserved as alternatives.
