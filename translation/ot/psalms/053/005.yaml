id: PSA.53.5
reference: Psalms 53:5
source:
  edition: WLC
  text: שָׁ֤ם פָּֽחֲדוּ פַחַד֮ לֹא הָ֪יָה֫ פָ֥חַד כִּֽי אֱלֹהִ֗ים פִּ֭זַּר עַצְמ֣וֹת חֹנָ֑/ךְ הֱ֝בִשֹׁ֗תָה כִּֽי אֱלֹהִ֥ים מְאָסָֽ/ם׀־־־־׃
translation:
  text: There they were terrified where there had been no fear[a], for God scattered the bones[b] of the army encamped against you. You[c] put them to shame, for God rejected them.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “though there was nothing to fear.”
    reason: alternative_reading
  - marker: b
    text: Leaving the dead unburied was a sign of defeat and disgrace.
    reason: cultural_note
  - marker: c
    text: The first “you” is feminine, probably addressing Zion; the second is masculine and may address Israel or God.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  chosen: There
  alternatives:
  - Thereupon
  lexicon: HALOT
  rationale: Locative adverb introducing the scene; simple 'There' is the plain sense and preserves the abrupt poetic force.
- source_word: פָּחֲדוּ פַחַד
  chosen: they were terrified
  alternatives:
  - they feared a fear
  - they were terrified
  lexicon: HALOT
  rationale: An idiomatic English rendering of the emphatic Hebrew cognate construction, with its literal form retained in the note.
- source_word: לֹא הָיָה פָחַד
  chosen: though there was nothing to fear
  alternatives:
  - when there was nothing to fear
  - though there was no fear
  lexicon: HALOT
  rationale: This communicates the intended contrast between their terror and the absence of fear's cause in natural English.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - indeed
  lexicon: HALOT
  rationale: Here the conjunction introduces the ground for the previous statement; 'for' best preserves the explanatory relation in elevated but readable English.
- source_word: אֱלֹהִים
  chosen: God
  lexicon: HALOT
  rationale: Common plural form with singular reference to Israel's God; translated straightforwardly as 'God'.
- source_word: פִּזַּר
  chosen: scattered
  alternatives:
  - dispersed
  - strewn
  lexicon: HALOT
  rationale: The piel verb conveys forceful scattering. 'Scattered' is the standard clear rendering and suits the image of defeated enemies' bones.
- source_word: עַצְמוֹת
  chosen: the bones
  alternatives:
  - bones
  lexicon: HALOT
  rationale: Definite in sense within the construct-like relation with the following participle/pronominal form; 'the bones' reads naturally in English.
- source_word: חֹנָךְ
  chosen: the one encamping against you
  alternatives:
  - your besieger
  - the one camping around you
  - the one encamping for you/against you
  lexicon: HALOT
  rationale: From חנה, 'to camp/encamp.' In this hostile context, the sense is an enemy laying siege or encamping against the addressee. Because the suffix points to second person feminine singular in the MT, an explicit singular 'you' is retained without over-specifying the addressee.
- source_word: הֱבִשֹׁתָה
  chosen: You put them to shame
  alternatives:
  - You shamed them
  - you will put them to shame
  lexicon: HALOT
  rationale: Hiphil of בוש commonly means 'cause to be ashamed/put to shame.' The form is best taken as a 2ms perfect in context, addressing God directly. English present-pastive style 'You put them to shame' fits Hebrew poetic perfect usage.
- source_word: מְאָסָם
  chosen: rejected them
  alternatives:
  - despised them
  - spurned them
  lexicon: HALOT
  rationale: מאס often means reject/reject with contempt. 'Rejected them' captures the covenantal/judicial sense without importing excess emotional coloring.
