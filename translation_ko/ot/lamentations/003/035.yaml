  text: to deny a man justice before the face of the Most High—
translation:
  language: ko
  text: 지극히 높으신 분 앞에서 한 사람의 정의를 왜곡하는 것—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַטּוֹת
  english_pob_choice: to deny
  chosen_korean: 굽게 하는 것입니다
  alternatives_korean:
  - 부정하는 것입니다
  - 외면하는 것입니다
  - 빗나가게 하는 것입니다
  lexicon: הטה
  rationale: 동사는 ‘정의’를 의도적으로 굽히거나 비틀어 빗나가게 한다는 뜻을 살리며, POB의 ‘deny’가 가리키는 부정적 억압을 한국어로 과도하게 추상화하지 않게 했습니다.
- source_word: מִשְׁפַּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 공의
  - 판결
  - 재판권
  lexicon: משפט
  rationale: 문맥상 개인의 권리와 공적 심판을 아우르는 법적·윤리적 의미이므로, 현대 한국어에서 가장 직접적으로 전달되는 ‘정의’를 택했습니다.
- source_word: גָּבֶר
  english_pob_choice: a man
  chosen_korean: 사람의
  alternatives_korean:
  - 남자의
  - 한 사람의
  - 인간의
  lexicon: גבר
  rationale: 히브리어 גבר는 여기서 특정 성별 강조보다 ‘한 인간/사람’의 개별 대상을 가리키므로, 자연스럽고 포괄적인 ‘사람의’로 옮겼습니다.
- source_word: עֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 지극히 높으신 분
  - 가장 높으신 분
  - 지극히 높으신 하나님
  lexicon: עליון
  rationale: ‘Most High’의 호칭적 뉘앙스를 살리되, 본문에 없는 ‘하나님’을 덧붙이지 않고 존칭형으로 표현했습니다.
theological_decisions:
- issue: ‘before the face of the Most High’의 공간적·법정적 이미지
  chosen_reading: ‘지극히 높으신 이 앞에서’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘지극히 높으신 이 보시기에’
  - ‘하나님 앞에서’
  rationale: 문맥은 단순한 감정 표현이 아니라 최고 재판관 앞에서 정의를 굽히는 행위의 엄중함을 드러내므로, ‘앞에서’의 법정적 긴장을 보존했습니다.
  doctrine_reference: 하나님의 전지와 공의에 대한 성경적 증언
- issue: ‘Most High’의 신칭 처리
  chosen_reading: 본문에는 ‘지극히 높으신 이’만 두고, ‘하나님’은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘지극히 높으신 하나님’
  - ‘가장 높으신 주님’
  rationale: 히브리어 원문은 עֶלְיוֹן의 칭호만 제시하므로, 전통적 신앙어를 자동 보강하지 않고 원문 호칭의 밀도를 유지했습니다.
  doctrine_reference: 원문 호칭 보존과 신명(神名) 구분
