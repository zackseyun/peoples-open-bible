  text: 낮에는 야훼께서 자신의 한결같은 사랑을 명하십니다. 밤에는 그분의 노래가 나와 함께 있으니[a], 내 생명의 하나님께 드리는 기도입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문의 케티브는 ‘그녀의 노래’로 읽힐 수 있으나, 케레는 ‘그분의 노래’로 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내게 생명을 주시는 하나님’. 히브리어는 더 직역하면 ‘내 생명의 하나님’입니다.
