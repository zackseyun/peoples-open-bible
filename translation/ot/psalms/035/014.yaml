  from: I walked about as though he were my friend[a], as though he were my brother; I bowed down in gloom[b], like one mourning for a mother.
  to: I went about as if for a friend or brother; I bowed down in gloom[b], like one mourning for a mother.
  rationale: 'The comparison describes the psalmist’s conduct toward the sick people, not an explicit individual who “were” his friend or brother. The revision reflects that relation without inventing a subject. The proposed note a is unnecessary: “for a mother” rightly leaves the Hebrew’s unmarked relation unexpanded, while “his mother” is merely one English contextual completion.'
