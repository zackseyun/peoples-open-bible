  meaning_decisions:
  - source_phrase: וְצַלְמֵי עַכְבְּרֵיכֶם הַמַּשְׁחִיתִם אֶת הָאָרֶץ
    prior_rendering: and images of your mice that are ravaging the land
    new_rendering: and of the mice that are ravaging the land
    rationale: The possessive associates the mice with the Philistines' affliction; it does not imply domesticated mice belonging to them. The relative clause carries that association clearly.
  - source_phrase: יָקֵל אֶת יָדוֹ מֵעֲלֵיכֶם וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
    prior_rendering: he will lighten his hand from upon you, and from upon your gods, and from upon your land
    new_rendering: he will ease the weight of his hand on you, on your gods, and on your land
    rationale: The source asks for the heavy afflicting hand to become lighter, not necessarily to be removed altogether. The new wording preserves that image and its repeated threefold scope without the unnatural 'from upon.'
