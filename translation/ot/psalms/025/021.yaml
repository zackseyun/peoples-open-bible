  from: Integrity and uprightness may preserve me[a][b], for I wait for you.
  to: May integrity and uprightness preserve me, for I wait for you.[a]
  rationale: The yiqtol יִצְּרוּנִי can be understood volitively in this prayer context. In contemporary English, clause-initial “May” properly marks that wish; the current “may preserve” more normally denotes possibility. The revision makes no unwarranted semantic change. The retained note accurately identifies the hope component of קוה and is placed on the relevant phrase. A separate note for the confident future reading is not required once the translation has selected the well-supported volitive reading.
