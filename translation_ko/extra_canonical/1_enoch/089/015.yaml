  source_fidelity: 개역이 필요합니다. 게에즈어 ይፈርህዎሙ는 ‘그들을 두려워하다’라는 뜻으로 보이며, 영어 POB 본문의 ‘terrify them’ 및 초안의 ‘두렵게 하다’는 이를 사역으로 바꾸어 원문의 역설적인 이미지를 바꿉니다. 또한 እስከ 이하의 결과 절은 두 번의 ‘~때까지’보다 하나의 병렬 동작으로 처리하는 편이 충실합니다.
  naturalness: 초안의 ‘그들의 새끼들을 멸망시킬 때까지, 또 … 던질 때까지 그러했습니다’는 한국어 문장 연결이 부자연스럽고 ‘그러했습니다’의 지시 대상도 불분명합니다. 수정문은 현대 표준어 합쇼체를 유지하면서 시간·결과 관계를 자연스럽게 드러냅니다.
  terminology: ‘이리들’, ‘양들’, ‘새끼들’, ‘주님’은 환상 알레고리의 동물 이미지를 보존합니다. ‘주님’은 문맥상 가능하지만 ‘주인’이라는 대안은 주석으로 보존합니다. 각 주석 표지는 해당 어구 바로 뒤에 배치합니다.
  issues:
  - severity: high
    issue: ‘두렵게 하고’가 원문의 ‘두려워하고’를 사역으로 변경함
    rationale: 원문 동사의 기본 의미와 제공된 영어 어휘 결정(‘began to fear them’)에 따르면, 이리들이 양들을 두려워한다는 역설적 표현을 보존해야 합니다. 영어 POB 본문의 ‘terrify’는 그 어휘 결정 및 원문과 충돌합니다.
