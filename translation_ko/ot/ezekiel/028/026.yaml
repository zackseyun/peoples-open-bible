  source_fidelity: ‘그 위에’는 עָלֶיהָ(그것/그 땅 위에)를 가리키므로, 현 각주의 ‘그들 위에’는 지시 대상이 잘못되었습니다. 또한 בַּעֲשׂוֹתִי는 시간적 ‘내가 ... 할 때’이며, ‘때에도’의 양보 의미는 원문에 없습니다.
  naturalness: ‘그 땅에 안전히 살며’와 ‘심판을 내릴 때’는 현대 표준 한국어 합쇼체에서 자연스럽고, 두 번째 ‘안전하게 살 것입니다’의 반복도 원문의 강조를 보존합니다.
  terminology: יְהוָה는 프로젝트 표기에 따라 ‘야훼’로 유지했습니다. שְׁפָטִים은 문맥상 ‘심판’을 내리는 것으로, הַשָּׁאטִים은 ‘멸시하는 자들’로 옮겼습니다.
