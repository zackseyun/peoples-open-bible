  from: And the matter became known to Judas[a], that he had come against him with deceit; and he was alarmed because of him, and no longer wished to see his face.
  to: Judas learned that Nicanor had come against him with deceit. He was alarmed by Nicanor and was no longer willing to meet him.
  rationale: The lexical notes already understand the opening as disclosure of the plot and the final face idiom as personal encounter. I make the two men’s roles explicit and convey Judas’s settled unwillingness to meet Nicanor again.
