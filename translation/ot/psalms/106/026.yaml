id: PSA.106.26
reference: Psalms 106:26
source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א יָד֣/וֹ לָ/הֶ֑ם לְ/הַפִּ֥יל א֝וֹתָ֗/ם בַּ/מִּדְבָּֽר׃
translation:
  text: So he lifted his hand and swore to them that he would make them fall dead in the wilderness,
  philosophy: dynamic
lexical_decisions:
- source_word: וַיִּשָּׂא
  chosen: lifted ... and swore
  alternatives:
  - lifted up
  - swore
  - raised
  lexicon: HALOT
  rationale: Lifting the hand is the oath-taking gesture. English makes the idiomatic act explicit.
- source_word: יָדוֹ
  chosen: his hand
  lexicon: HALOT
  rationale: Literal rendering preserves the Hebrew idiom and imagery. The singular with pronominal suffix naturally refers to God's hand in context.
- source_word: לָהֶם
  chosen: to them
  alternatives:
  - to them
  - against them
  lexicon: HALOT
  rationale: The preposition is 'to them,' marking the people to whom the oath was sworn, not physical action against them.
- source_word: לְהַפִּיל
  chosen: to make them fall
  alternatives:
  - to overthrow them
  - to cast them down
  lexicon: HALOT
  rationale: 'The hiphil infinitive of נפל is causative: ''to cause to fall.'' ''Make them fall'' preserves that causative sense in clear modern English.'
- source_word: אֹתָם
  chosen: them
  lexicon: HALOT
  rationale: Direct-object pronoun rendered straightforwardly.
- source_word: בַּמִּדְבָּר
  chosen: in the wilderness
  alternatives:
  - in the desert
  lexicon: HALOT
  rationale: '''Wilderness'' is the standard and contextually fitting rendering of מִדְבָּר in the Exodus/wandering setting; it preserves biblical resonance better than ''desert'' without overstating barrenness.'
