  - source_phrase: יֹאכַל גּוֹיִם צָרָיו
    prior_rendering: He will consume the nations that are his adversaries
    new_rendering: Israel will devour the nations that oppose him
    rationale: Naming Israel distinguishes the victorious people from God in the preceding sentence, while 'devour' strengthens the animal imagery continued by gnawing bones and the lion in the next verse.
