lexical_decisions:
- source_word: ἀφήσομεν
  chosen: we will grant
  alternatives:
  - we will remit
  - we will release
  lexicon: LSJ
  rationale: Future of ἀφίημι here introduces the granting of ἀφέματα. Because the object is not persons but fiscal concessions, 'grant' fits idiomatic English better than the more wooden 'leave' or 'release.'
- source_word: ἀφέματα
  chosen: remissions
  alternatives:
  - exemptions
  - pardons
  - cancellations
  lexicon: LSJ
  rationale: In this royal-fiscal context the noun refers to releases or remissions of obligations, not forgiveness of sins. 'Remissions' preserves the formal sense while fitting the administrative setting.
- source_word: δόματα
  chosen: gifts
  alternatives:
  - grants
  - presents
  lexicon: LSJ
  rationale: A straightforward term for things bestowed by the king. 'Gifts' is clear and sufficiently broad.
- source_word: ἀπολύω
  chosen: I release
  alternatives:
  - I set free
  - I discharge
  lexicon: BDAG
  rationale: The verb can mean release or set free. In context it introduces a legal freeing from obligations, so 'I release' keeps the official tone without overstating personal emancipation.
- source_word: ἀφίημι
  chosen: exempt
  alternatives:
  - forgive
  - release
  - remit
  lexicon: BDAG
  rationale: With πάντας τοὺς Ἰουδαίους ἀπὸ τῶν φόρων, the sense is exemption from dues. 'Exempt' makes the fiscal force explicit in natural English.
- source_word: φόρων
  chosen: taxes
  alternatives:
  - tributes
  - dues
  lexicon: LSJ
  rationale: General compulsory payments to the state are best rendered 'taxes' in contemporary English.
- source_word: τιμῆς τοῦ ἁλός
  chosen: salt duty
  alternatives:
  - salt tax
  - price of salt
  lexicon: LSJ
  rationale: τιμή can denote an assessed payment or charge, and with τοῦ ἁλός in this fiscal list it most naturally refers to a levy connected with salt. 'Salt duty' preserves the administrative nuance better than the more ambiguous 'price of salt.'
- source_word: στεφάνων
  chosen: crown levies
  alternatives:
  - crowns
  - crown tax
  lexicon: LSJ
  rationale: In Hellenistic royal finance, 'crowns' can denote tribute presented as honorary crowns or their monetary equivalent. Rendering simply 'crowns' would be opaque in English, so 'crown levies' makes the fiscal sense clear while retaining the underlying image.
