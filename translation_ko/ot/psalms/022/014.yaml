  source_fidelity: 개정이 필요합니다. 현 초안은 제시된 히브리어 본문(시편 22:14)이 아니라 앞 절의 사자 비유와 ‘입을 벌리다’ 이미지를 번역하고 있어, 본문 대조상 해당 절의 의미를 전혀 반영하지 못합니다. 본절의 물처럼 쏟아짐, 뼈가 서로 어그러짐, 밀랍 같은 마음, 내장 안에서 녹음의 이미지를 옮겨야 합니다.
  naturalness: 개정문은 현대 표준 한국어 합쇼체로 자연스럽게 읽히면서도 시편의 비유적·신체적 언어를 유지합니다. ‘내 속에서’는 מֵעַי의 문자적 신체성을 본문에서 과도하게 해설하지 않고 자연스럽게 전달하며, 각주로 직역을 보완합니다.
  terminology: ‘밀랍’은 דוֹנָג의 적절한 번역입니다. ‘모든 뼈가 어그러졌습니다’는 הִתְפָּרְדוּ의 분리·탈구 이미지를 자연스러운 한국어로 보존합니다. ‘내 속’은 מֵעַי(나의 속/내장)의 관용적 번역이며, 각주에서 ‘내장’이라는 문자적 대안을 제시합니다.
