source:
  edition: WLC
  text: הָפַ֣כְתָּ מִסְפְּדִ/י֮ לְ/מָח֪וֹל לִ֥/י פִּתַּ֥חְתָּ שַׂקִּ֑/י וַֽ/תְּאַזְּרֵ֥/נִי שִׂמְחָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/012.yaml
  text: You turned my mourning into dancing for me; you untied my sackcloth and clothed me with joy.
translation:
  language: ko
  text: 이는 제 영광이 주님을 찬양하고 잠잠하지 않게 하려 하심입니다. 오 야훼, 저의 하나님이시여, 제가 영원히 주님께 감사드리겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘제 영광’. 시적 표현으로, ‘제 온 존재’ 또는 ‘제 혀’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפְּדִי / לִי
  english_pob_choice: my mourning ... for me
  chosen_korean: 제 슬픔 ... 저에게
  alternatives_korean:
  - 제 애도 ... 제게
  - 제 통곡 ... 저를 위해
  lexicon: מִסְפֵּד
  rationale: 문맥상 단순 감정적 슬픔을 넘는 애통함이지만, 한국어로는 자연스럽고 현대적인 예배문체를 위해 ‘슬픔’을 택해 ‘for me’의 수혜 의미를 본문 안에서 살렸습니다.
- source_word: לְמָחוֹל
  english_pob_choice: dancing
  chosen_korean: 춤
  alternatives_korean:
  - 무도
  - 춤사위
  lexicon: מָחוֹל
  rationale: 히브리어의 신체적 기쁨 표현을 직역에 가깝게 살리기 위해 ‘춤’으로 옮겼습니다.
- source_word: שַׂקִּי
  english_pob_choice: my sackcloth
  chosen_korean: 제 베옷
  alternatives_korean:
  - 제 굵은 베옷
  - 제 삼베옷
  lexicon: שַׂק
  rationale: 통상 성서어휘인 ‘베옷’이 원어의 상징성(애통과 회개)을 가장 간결하게 드러내므로 이를 채택했습니다.
- source_word: וַתְּאַזְּרֵנִי שִׂמְחָה
  english_pob_choice: clothed me with joy
  chosen_korean: 저에게 기쁨을 입히셨습니다
  alternatives_korean:
  - 저를 기쁨으로 두르셨습니다
  - 저를 기쁨으로 띠 띠우셨습니다
  lexicon: אַזַר
  rationale: 동사 어근은 ‘허리에 띠를 두르다’이지만, 시적 병행법상 ‘기쁨으로 입히다’가 원문의 비유를 자연스럽게 전달합니다.
theological_decisions:
- issue: 수혜 표현 'for me'의 반영 여부
  chosen_reading: 슬픔이 춤으로 바뀌는 일과 베옷이 풀리는 일이 화자에게 베푸신 은혜임을 본문 안에 명시적으로 드러냈습니다.
  alternative_readings:
  - 단순히 '제 슬픔을 춤으로 바꾸셨습니다'처럼 수혜 표현을 생략
  - '''제 슬픔을 저를 위한 춤으로 바꾸셨습니다''처럼 과도하게 재구성'
  rationale: 영어 POB의 보정(‘for me’)이 시편 화자의 체험에 대한 하나님의 व्यक्तिगत적 개입을 강조하므로, 한국어에서도 ‘저에게’로 수혜 의미를 보존했습니다.
  doctrine_reference: 시편 30편의 감사 찬양, 하나님의 구원과 회복의 은혜
- issue: 의복 은유의 보존
  chosen_reading: ‘베옷을 풀어 주시며’와 ‘기쁨을 입히셨습니다’로 애통의 의복이 기쁨으로 대체되는 이미지를 유지했습니다.
  alternative_readings:
  - ‘베옷을 벗기셨고 기쁨으로 덮으셨습니다’처럼 설명적 재서술
  - ‘슬픔을 기쁨으로 바꾸셨다’로 은유 약화
  rationale: 원문은 슬픔의 상태 전환을 의복과 춤의 대비로 그리므로, 한국어도 은유를 과도하게 평문화하지 않고 살렸습니다.
  doctrine_reference: 시편의 시적 평행법과 감사의 역전 주제
