id: 1CLEM.8.2
reference: 1 Clement 8:2
unit: verse
book: 1 Clement
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ αὐτὸς δὲ ὁ δεσπότης τῶν ἁπάντων περὶ μετανοίας ἐλάλησεν μετὰ ὅρκου· Ζῶ γὰρ ἐγώ, λέγει κύριος, οὐ βούλομαι τὸν θάνατον τοῦ ἁμαρτωλοῦ ὡς τὴν μετάνοιαν, προστιθεὶς καὶ γνώμην ἀγαθήν.
  language: Greek
translation:
  text: 'And the Master of all things himself also spoke concerning reorientation[r1] with an oath: “For as I live,” says the Lord[b][a], “I do not desire the death of the sinner so much as his reorientation,” adding also a good judgment:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'and the Master himself of all things also spoke'.
    reason: previous_rendering
  - marker: b
    text: Or 'adding also a good intention:'.
    reason: previous_rendering
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
