id: PSA.140.12
reference: Psalms 140:12
source:
  edition: WLC
  text: ידעת כִּֽי יַעֲשֶׂ֣ה יְ֭הוָה דִּ֣ין עָנִ֑י מִ֝שְׁפַּ֗ט אֶבְיֹנִֽים־׃
translation:
  text: I know[a] that Yahweh will uphold the cause of the afflicted and secure justice for the needy.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Masoretic reading tradition gives “I know”; the written Hebrew form ordinarily means “you know.”
    reason: textual_variant
lexical_decisions:
- source_word: ידעת
  chosen: I know
  alternatives:
  - You know
  - I have known
  lexicon: HALOT
  rationale: The form is morphologically 2ms perfect ('you know'), but in context the psalm's closing confession is commonly understood and vocalized as 1cs sense ('I know'), matching the speaker's declaration. English present 'I know' best conveys the stative force of the perfect in context.
- source_word: כִּי
  chosen: that
  alternatives:
  - for
  - indeed
  lexicon: HALOT
  rationale: Introduces the content of what the speaker knows; 'that' is the most natural English complementizer here.
- source_word: יַעֲשֶׂה
  chosen: will uphold
  alternatives:
  - will do
  - will act for
  - will maintain
  lexicon: HALOT
  rationale: The verb עשה literally means 'do/make,' but with דין ('cause/case') it idiomatically means to act on behalf of, uphold, or secure justice for someone. 'Will uphold' captures the judicial-advocacy sense in clear English.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: דִּין
  chosen: the cause
  alternatives:
  - the case
  - justice
  - judgment
  lexicon: HALOT
  rationale: In this collocation with עשה, דין refers to the legal cause or case of the afflicted rather than abstract judgment. 'The cause' is idiomatic and preserves the forensic nuance.
- source_word: עָנִי
  chosen: the afflicted
  alternatives:
  - the poor
  - the humble
  lexicon: HALOT
  rationale: עָנִי can denote one who is poor, afflicted, or oppressed. In this psalm's context of violent oppression, 'the afflicted' better captures suffering and vulnerability, not merely economic status.
- source_word: מִשְׁפָּט
  chosen: justice
  alternatives:
  - judgment
  - the right
  lexicon: HALOT
  rationale: Here מִשְׁפָּט denotes the just decision or justice secured for the needy. 'Justice' is the clearest modern rendering in this parallel line.
- source_word: אֶבְיוֹנִים
  chosen: the needy
  alternatives:
  - the poor
  - the destitute
  lexicon: HALOT
  rationale: אֶבְיוֹן commonly refers to the needy or poor. 'The needy' fits the parallelism and avoids flattening the term to purely economic poverty.
- source_word: משפט
  chosen: secure justice
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: “Justice” renders the noun; “secure” supplies in English the governing verbal sense shared from יעשה.
