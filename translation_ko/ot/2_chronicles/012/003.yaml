base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/003.yaml
  text: 'with 1,200 chariots and 60,000 horsemen[a], and the people who came with him from Egypt were without number: Libyans, Sukkites[c][b], and Cushites.'
  footnotes:
  - marker: a
    text: Or 'innumerable'; literally, 'there was no number to the people.'
    reason: lexical_alternative
  - marker: b
    text: '''Sukkites'' renders a people-group name of uncertain precise identification; some translations transliterate it as ''Sukkiim.'''
    reason: cultural_note
  - marker: c
    text: Or 'Ethiopians' for 'Cushites,' though 'Cushites' more directly reflects the Hebrew ethnic-geographical term.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 천이백 대의 병거와 육만 명의 기병을 거느리고 왔습니다. 그와 함께 이집트에서 온 백성은 셀 수 없이 많았으니, 리비아 사람들과 수키 사람들과 구스 사람들이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헤아릴 수 없을 만큼 많았습니다’; 직역하면 ‘그 백성에게는 수가 없었습니다.’
    reason: alternative_reading
  - marker: b
    text: ‘수키’는 정확한 동일성이 확정되지 않은 민족명입니다. 일부 번역은 ‘수킷’처럼 음역합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘에티오피아 사람들’; 다만 ‘구스 사람들’이 히브리어의 민족·지리 용어를 더 직접적으로 반영합니다.
    reason: lexical_alternative
