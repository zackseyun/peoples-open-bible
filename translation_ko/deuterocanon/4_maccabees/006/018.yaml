  rationale: 생애 전체(βίον), 진리에 따른 삶(πρὸς ἀλήθειαν), 법에 맞는 보전(νομίμως φυλάσσω)을 보다 직접적으로 반영했습니다. ‘그에 바탕을 둔’은 ἐπ’ αὐτῶν의 복수 지시를 한국어에서 과도하게 특정하지 않으면서 문맥에 맞게 옮긴 것입니다. 원문이 쉼표로 끝나는 이어지는 조건절이므로 한국어도 이를 보존했습니다.
