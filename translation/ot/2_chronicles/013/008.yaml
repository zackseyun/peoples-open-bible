theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Chronicles' theology of the Davidic monarchy
  chosen_reading: the kingdom of the LORD in the hand of the sons of David
  alternative_readings:
  - the kingdom of the LORD under the sons of David
  - the LORD's kingdom ruled by the sons of David
  rationale: 'The wording preserves the text''s theological tension: the kingdom belongs to the LORD yet is administered through David''s line. The translation avoids collapsing either element into the other.'
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
