translation:
  text: They devoured all the produce of human labor[b], until[a] people were unable to feed them[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: “Until” translates the conjunction Charles prints between daggers. In apparatus note 11 he treats the
      Greek conjunction it represents as corrupt and proposes a different Ethiopic reading. This translation follows
      the printed body, not that proposal. The daggers mark disputed text, not a gap.
  - marker: b
    reason: lexical_alternative
    text: The source begins with “who,” referring to the giants in the preceding verse; “they” lets the English
      verse stand on its own. “Produce of human labor” takes the labor noun to mean what labor produces, a sense
      Dillmann gives in column 1272, citing Enoch 7:3. Charles’s apparatus note 10 questions the printed form rendered
      “all”; the translation retains it.
  - marker: c
    reason: lexical_alternative
    text: The printed feeding form is ሴስዮት. Dillmann’s feeding entry (column 393) cites Enoch 7:3, and his Grammar
      §125 explains the nominal infinitive endings -ōt and -ō. Here the ending belongs to the infinitive, not a
      plural pronoun. “Them” is expressed by the suffix on the preceding inability verb; Dillmann’s inability entry
      (column 377) describes that placement for a pronoun referring to the infinitive’s object.
