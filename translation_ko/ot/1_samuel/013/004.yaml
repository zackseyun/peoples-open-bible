theological_decisions:
- issue: 이스라엘이 블레셋에게 ‘미움을 받게 되었다’는 표현의 수위
  chosen_reading: 직설적인 혐오/적대감을 유지하여, 정치·군사적 갈등이 본문에 분명히 드러나도록 했습니다.
  alternative_readings:
  - 완곡하게 ‘관계가 악화되었다’고 낮추는 번역
  - ‘블레셋에게 역겨운 존재가 되었다’처럼 더 직역하는 번역
  rationale: 본문은 단순한 외교적 긴장보다 더 강한 적대감을 말하므로, 그 긴장을 희석하지 않는 번역이 필요합니다.
  doctrine_reference: 본문-의미 보존 원칙
