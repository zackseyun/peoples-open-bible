base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: ko
  text: 모세가 말했습니다. “오늘 야훼를 위하여 스스로를 성별하십시오.[a] 각 사람이 자기 아들과 자기 형제를 거슬렀으니, 오늘 야훼께서 너희에게 복을 내리시게 하려는 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘너희 손을 채우십시오.’ 이는 어떤 직무를 위하여 자신을 바치거나 성별하는 것을 가리키는 제의적 관용 표현입니다.
    reason: 원문의 ‘손을 채우다’라는 관용구와 번역된 제의적 의미를 함께 보존합니다.
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  english_pob_choice: ordain yourselves
  chosen_korean: 너희 손을 채우십시오
  alternatives_korean:
  - 스스로를 성별하십시오
  - 임직을 받으십시오
  lexicon: מלא + יד
  rationale: 히브리어 직역상 ‘손을 채우다’가 제사장 위임/성별 관용구이므로, 본문의 원형 이미지를 살리되 한국어에서는 이해 가능한 명령형으로 옮겼습니다. 영어 POB의 해석적 표현( ordain yourselves )은 의미를 반영하지만, 원어 관용구는 유지하는 편이 더 직접적입니다.
- source_word: לַיהוָה
  english_pob_choice: to the LORD
  chosen_korean: 야훼를 위해
  alternatives_korean:
  - 야훼께
  - 주님을 위해
  lexicon: יהוה
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로 옮겼고, 문맥상 ‘손을 채우다’의 목적/헌신 대상을 드러내기 위해 ‘를 위해’를 사용했습니다.
- source_word: בְּרָכָה
  english_pob_choice: a blessing
  chosen_korean: 복
  alternatives_korean:
  - 축복
  - 은혜
  lexicon: ברכה
  rationale: 히브리어 ברכה의 핵심 의미를 간결하게 살려 ‘복’으로 옮겼습니다. 여기서는 제의적·언약적 결과를 가리키므로 ‘축복’보다 짧고 본문 밀착적인 표현이 적합합니다.
theological_decisions:
- issue: ‘손을 채우다’ 관용구를 한국어에 어떻게 드러낼지
  chosen_reading: 원어 관용구를 보존하되, 문맥 이해를 위해 자연스러운 명령형으로 읽히게 했습니다.
  alternative_readings:
  - 의미 위주로 ‘임직을 받으십시오’로 풀기
  - 전통 용어처럼 ‘성별하십시오’로 완화하기
  rationale: 이 절은 레위인/제의 위임의 맥락을 담고 있어, 원문 이미지와 제의적 긴장을 지우지 않는 번역이 필요합니다.
  doctrine_reference: 출 32:29의 레위 지파 위임 맥락
