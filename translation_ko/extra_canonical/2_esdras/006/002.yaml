  source_fidelity: 라틴어의 세 병렬 시간절(antequam)과 각 동사의 미완료 접속법이 나타내는 ‘…하기 전’의 틀, 그리고 ‘낙원의 기초가 확립되기 전’이라는 의미는 충실히 반영되었습니다. 다만 voces의 복수는 ‘음성’보다 ‘소리들’이 자연스럽고, nitores coruscuum의 복수 광휘/섬광도 보다 분명히 드러낼 수 있습니다.
