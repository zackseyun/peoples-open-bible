  rationale: This verse concerns the ark's cover with cherubim attached. 'Mercy seat' is a conventional English rendering for כַּפֹּרֶת in this cultic setting and preserves continuity with the broader canonical context, while 'atonement cover' is a viable more transparent alternative. No doctrinal dispute is being resolved here, so the alternative is preserved as a lexical footnote rather than replacing the main text.
