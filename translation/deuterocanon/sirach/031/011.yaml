translation:
  text: Who has been tested by wealth and remained blameless throughout his life[a]? Such a man brings you honor. Who could have transgressed but did not, and could have done evil but refused?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The opening Hebrew is uncertain; a literal reading is, "Who blessed him, and he was whole in his life?" The translation adopts the contextual reading of testing and lasting integrity.
    reason: lexical_alternative
lexical_decisions:
- source_word: מי
  chosen: Who
  alternatives:
  - Who is the one who
  - Whoever
  lexicon: HALOT
  rationale: Interrogative opening is retained directly in English to preserve the verse's rhetorical question structure.
- source_word: ברכו
  chosen: was tested by it
  alternatives:
  - was examined by it
  - was refined by it
  - was blessed by him
  lexicon: HALOT
  rationale: The Hebrew consonants are difficult in this line and the source is marked major_mismatch; in context with the following וישלם בחייו ('and was complete in his life') and the Greek parallel for this section of Sirach about wealth-testing, the sense of being proved/tested fits better than a straightforward 'blessed him.' The pronominal sense 'by it' reflects the implied testing object from context.
- source_word: וישלם בחייו
  chosen: and was found complete
  alternatives:
  - and remained blameless in his life
  - and was at peace in his life
  - and was made whole in his lifetime
  lexicon: HALOT
  rationale: שלם here carries the sense of integrity/completeness rather than mere peace. 'Was found complete' gives idiomatic English while preserving the moral sense of proven integrity.
- source_word: הוא לך לתפארת
  chosen: Let it be for him a boast
  alternatives:
  - he will be for you a glory
  - this will be to him for glory
  - he is for you an honor
  lexicon: HALOT
  rationale: The Hebrew as transmitted is unstable ('for you' is awkward in context). The sense is that such a person's tested integrity becomes grounds for honorable boasting/praise. 'Let it be for him a boast' captures the commendatory force without overcommitting to a corrupt pronoun.
- source_word: יוכל לסור
  chosen: was able to transgress
  alternatives:
  - was able to turn aside
  - was able to go astray
  - was able to deviate
  lexicon: HALOT
  rationale: סור literally means 'turn aside,' but in this ethical context it denotes deviating into wrongdoing. 'Transgress' makes the moral force clear in natural English.
- source_word: ולא סר
  chosen: and did not transgress
  alternatives:
  - and did not turn aside
  - and did not go astray
  lexicon: HALOT
  rationale: Kept parallel with the previous clause for rhetorical balance and ethical clarity.
- source_word: ולהרע רעה
  chosen: and to do evil
  alternatives:
  - and to do harm
  - and to commit wrongdoing
  lexicon: HALOT
  rationale: The infinitive plus cognate object intensifies the idea of acting wickedly; 'to do evil' is concise and preserves the moral register.
- source_word: ולא אבה
  chosen: and did not desire it
  alternatives:
  - and did not consent
  - and was not willing
  - and did not choose to
  lexicon: HALOT
  rationale: אבה often denotes willingness or consent. 'Did not desire it' fits the inward moral refusal implied by the verse's praise of restraint.
