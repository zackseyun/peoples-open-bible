id: JOB.20.24
reference: Job 20:24
source:
  edition: WLC
  text: יִ֭בְרַח מִ/נֵּ֣שֶׁק בַּרְזֶ֑ל תַּ֝חְלְפֵ֗/הוּ קֶ֣שֶׁת נְחוּשָֽׁה׃
translation:
  text: He will flee from an iron weapon, but an arrow from a bronze bow[a] will pierce him through.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “a bronze bow will pass through him.” The bow stands for the arrow it shoots.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְרַח
  chosen: he will flee
  alternatives:
  - he flees
  - he will run away
  lexicon: HALOT
  rationale: 'Qal imperfect 3ms of ברח denotes fleeing/escaping. In this poetic judgment context, the imperfect is best rendered with future sense: ''he will flee.'''
- source_word: מִנֵּשֶׁק
  chosen: from a weapon
  alternatives:
  - from arms
  - from a missile
  lexicon: HALOT
  rationale: נשק here refers broadly to weaponry rather than specifically armor. Singular 'weapon' fits the construct with 'iron' and the immediate image of attempted escape from one deadly instrument.
- source_word: בַּרְזֶל
  chosen: iron
  lexicon: HALOT
  rationale: Standard rendering of the metal term; together with נשק it yields 'iron weapon.'
- source_word: תַּחְלְפֵהוּ
  chosen: will pierce him through
  alternatives:
  - will pass through him
  - will strike him
  - will replace him
  lexicon: HALOT
  rationale: The verb pictures passing through him; in this martial context “pierce him through” communicates the result without supplying an arrow.
- source_word: קֶשֶׁת
  chosen: bow
  lexicon: HALOT
  rationale: Standard rendering of the weapon term.
- source_word: נְחוּשָׁה
  chosen: bronze
  alternatives:
  - copper
  - brass
  lexicon: HALOT
  rationale: נחושה refers to bronze/copper alloy in biblical usage. 'Bronze' is the most idiomatic and historically appropriate English rendering in weapon imagery.
