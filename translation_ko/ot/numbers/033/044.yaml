translation:
  language: ko
  text: 그들은 오봇에서 떠나 모압 경계에 있는 이예아바림[a]에 진을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이예-아바림’. 히브리어 지명은 ‘폐허’와 ‘아바림/저편 지역들’과 관련된 요소를 반영할 수 있습니다.
    reason: 지명을 음역으로 유지하면서, 어원에 관한 가능한 이해를 확정하지 않고 제시합니다.
lexical_decisions:
- source_word: וַ/יִּסְע֖וּ
  english_pob_choice: set out
  chosen_korean: 떠나서
  alternatives_korean: 출발하여
  lexicon: סע
  rationale: 여러 번의 이동과 진 치기 과정을 강조하기 위해 '떠나다'를 사용하되, 문맥상 이동의 완성을 나타내는 '-서' 어미를 붙여 흐름을 유지함.
- source_word: וַֽ/יַּחֲנ֛וּ
  english_pob_choice: camped
  chosen_korean: 진 치니라
  alternatives_korean: 진 치고
  lexicon: חנה
  rationale: 성경적 진 치기 행위를 명확히 표현하기 위해 '진 치다'를 사용하며, 문장 종결을 위해 '-니라'를 사용하여 경건한 어조를 유지함.
- source_word: עִיֵּ֥י הָעֲבָרִ֖ים
  english_pob_choice: Iye-abarim
  chosen_korean: 이예아바림
  alternatives_korean: 아바림의 폐허
  lexicon: עִיֵּי הָעֲבָרִים
  rationale: 원어 발음을 최대한 보존하여 고유명사로 처리하되, 괄호 없이 본문에 직접 표기하여 번역의 일관성을 유지함.
theological_decisions:
- decision: 진 치다 (encamp)
  rationale: 이스라엘의 여정에서 '진 치다'는 단순한 숙박이 아니라 하나님의 인도하심 하에 안식하고 준비하는 신학적 행위를 의미하므로, 이를 명확히 표기함.
- decision: 모압의 경계 (border of Moab)
  rationale: 이스라엘의 여정이 가나안 땅의 경계와 인접한 모압 땅의 경계에서 멈췄음을 강조하여, 약속의 땅 진입 전 마지막 단계임을 시사함.
