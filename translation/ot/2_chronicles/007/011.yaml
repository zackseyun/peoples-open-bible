  category: meaning_retranslation
  from: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
  to: So Solomon completed the temple of Yahweh and the royal palace. He successfully accomplished everything he had intended to do for the temple of Yahweh and for his own palace.
  rationale: The lexical rationale rightly restricts 'success' to accomplishing Solomon’s intended building works rather than general prosperity. I retain that judgment while translating the heart idiom by its meaning and identifying the king’s house and Solomon’s own house as the same palace.
