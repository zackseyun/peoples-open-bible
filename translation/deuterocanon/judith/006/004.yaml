  to: For we will burn them up where they are. Their territory will be drunk with their blood, and their plains will be filled with their dead. Not even their footprints will survive our advance[a]; they will utterly perish, says King Nebuchadnezzar, lord of all the earth. For he has declared that his words will not prove empty.
