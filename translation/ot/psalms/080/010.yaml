  chosen_reading: Retain the literal expression 'cedars of God' in the main text
  alternative_readings:
  - mighty cedars
  rationale: This is not primarily a doctrinal issue but an interpretive one. Hebrew sometimes uses a divine term in genitival constructions to express greatness or majesty. Preserving 'of God' keeps the source-language imagery visible and avoids over-resolving whether the phrase is strictly superlative or evocative of God's own majestic cedars.
