  from: They built the high places of Baal that are in the Valley of Ben-hinnom[a], to make their sons and their daughters pass through the fire to Molech—something I had not commanded them, nor had it entered my heart that they should do this abomination[c][b], causing Judah to sin.
  to: They built shrines for Baal in the Valley of Ben-hinnom to sacrifice their sons and daughters to Molech[a], leading Judah into sin. I had not commanded them to commit this abomination, nor had it entered my mind that they should do it.
  rationale: The earlier deliberation explicitly recognized child sacrifice, so that meaning now governs the main text rather than remaining behind a ritual idiom. I retain 'abomination,' the divine disavowal, and the consequence for Judah, without turning that disavowal into a statement about divine knowledge.
