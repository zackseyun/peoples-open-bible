  source_fidelity: 히브리어의 두 명령형(‘오라/와서’와 ‘보라’) 및 ‘그들이 여기에서 하고 있는’이라는 현재적 행위를 유지해야 합니다. ‘들어와서’는 בּוֹא의 가능한 문맥적 해석이지만, 이 절 자체에는 ‘들어가다’를 한정할 표현이 없으므로 더 넓은 ‘와서’가 안전합니다.
  naturalness: 초안은 서술문이 합쇼체인 반면 인용된 명령이 반말형 ‘보아라’여서 지정된 현대 공손체와 일관되지 않습니다. ‘와서 … 보십시오’는 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: תּוֹעֵבוֹת는 예언서 문맥에서 ‘가증한 일들’이 안정적이고 자연스러운 대응어입니다. רָעוֹת의 ‘악한’을 별도로 보존합니다. 화자의 신원이 이 절의 표현만으로 확정되지 않으므로 ‘말했습니다’가 ‘말씀하셨습니다’보다 불필요한 높임 해석을 피합니다.
