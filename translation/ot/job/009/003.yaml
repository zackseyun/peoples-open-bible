id: JOB.9.3
reference: Job 9:3
source:
  edition: WLC
  text: אִם יַ֭חְפֹּץ לָ/רִ֣יב עִמּ֑/וֹ לֹֽא יַ֝עֲנֶ֗/נּוּ אַחַ֥ת מִנִּי אָֽלֶף־־־׃
translation:
  text: If anyone wished to argue a case against him, they could not answer him even once in a thousand.
  philosophy: dynamic
lexical_decisions:
- source_word: אִם
  chosen: If
  alternatives:
  - Though
  - When
  lexicon: HALOT
  rationale: Introduces a conditional clause. 'If' is the most straightforward rendering in context.
- source_word: יַחְפֹּץ
  chosen: wished
  alternatives:
  - desired
  - took pleasure
  - were willing
  lexicon: HALOT
  rationale: חפץ denotes desire or willingness. 'Wished' fits the hypothetical condition naturally in English without overstating emotional delight.
- source_word: לָרִיב
  chosen: to contend
  alternatives:
  - to dispute
  - to litigate
  - to argue a case
  lexicon: HALOT
  rationale: ריב can carry legal-dispute overtones. 'Contend' preserves both adversarial and potentially forensic nuance without becoming too technical.
- source_word: עִמּוֹ
  chosen: with him
  alternatives:
  - against him
  lexicon: HALOT
  rationale: The preposition is literally 'with him,' but in a dispute context it can imply opposition. Main text keeps the formal sense 'with him'; the adversarial nuance is carried by 'contend'.
- source_word: לֹא יַעֲנֶנּוּ
  chosen: he could not answer him
  alternatives:
  - he would not answer him
  - he could not respond to him
  - he could not answer him back
  lexicon: HALOT
  rationale: ענה here means 'answer/respond.' In context of disputing with God, the sense is inability rather than mere refusal, so 'could not answer him' best captures Job's point.
- source_word: אַחַת
  chosen: one time
  alternatives:
  - once
  - one thing
  lexicon: HALOT
  rationale: Here 'one' functions adverbially with the following phrase 'out of a thousand.' 'One time' makes the idiomatic force explicit in modern English.
- source_word: מִנִּי אָלֶף
  chosen: out of a thousand
  alternatives:
  - from a thousand
  - among a thousand
  lexicon: HALOT
  rationale: An idiom expressing extreme disproportion. 'Out of a thousand' is natural English and preserves the hyperbolic comparison.
- source_word: אַחַת מִנִּי אָלֶף
  chosen: once in a thousand
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This gives natural English to the Hebrew disproportion without falsely specifying repeated occasions or adding the redundant word “times.”
