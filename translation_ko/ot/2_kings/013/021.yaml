id: 2KI.13.21
reference: 2 Kings 13:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֞י הֵ֣ם קֹבְרִ֣ים אִ֗ישׁ וְ/הִנֵּה֙ רָא֣וּ אֶֽת הַ/גְּד֔וּד וַ/יַּשְׁלִ֥יכוּ אֶת הָ/אִ֖ישׁ בְּ/קֶ֣בֶר אֱלִישָׁ֑ע וַ/יֵּ֜לֶךְ וַ/יִּגַּ֤ע הָ/אִישׁ֙ בְּ/עַצְמ֣וֹת אֱלִישָׁ֔ע וַ/יְחִ֖י וַ/יָּ֥קָם עַל רַגְלָֽי/ו׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: ko
  text: 그들이 한 사람을 장사하고 있을 때였습니다. 그런데 그들이 약탈대를 보았습니다. 그래서 그 사람을 엘리사의 무덤에 던져 넣었습니다. 그 사람이 가서 엘리사의 뼈에 닿자 살아나서 자기 발로 일어났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/יְהִ֞י
  english_pob_choice: And it happened
  chosen_korean: 그들이 …하고 있는데
  alternatives_korean:
  - 그리고 …되었습니다
  - 그 일이 일어났습니다
  lexicon: וַיְהִי
  rationale: 히브리어 서술 관용구를 한국어에서 자연스럽게 풀어, 사건의 전개를 매끄럽게 시작하되 원문의 사건성은 유지했습니다.
- source_word: אֶת הַ/גְּד֔וּד
  english_pob_choice: the raiding band
  chosen_korean: 약탈대
  alternatives_korean:
  - 습격대
  - 침략 무리
  lexicon: גְּדוּד
  rationale: 문맥상 단순한 군대가 아니라 약탈·습격을 하는 무리를 가리키므로, POB의 의미를 살려 간결하게 옮겼습니다.
- source_word: קֶבֶר אֱלִישָׁע
  english_pob_choice: Elisha’s grave
  chosen_korean: 엘리사의 무덤
  alternatives_korean:
  - 엘리사의 묘
  - 엘리사의 장지
  lexicon: קֶבֶר
  rationale: קבר의 기본적 매장은 ‘무덤’이 가장 직접적이며, 한국어 독자가 즉시 이해할 수 있습니다.
- source_word: בְּ/עַצְמ֣וֹת אֱלִישָׁ֔ע
  english_pob_choice: Elisha’s bones
  chosen_korean: 엘리사의 뼈
  alternatives_korean:
  - 엘리사의 유골
  - 엘리사의 뼈들
  lexicon: עֶצֶם
  rationale: 복수형 뼈를 직역하되, 한국어에서는 자연스러운 단수 집합명사 ‘뼈’로 옮겨 원문 이미지와 충격성을 유지했습니다.
- source_word: וַ/יְחִ֖י וַ/יָּ֥קָם
  english_pob_choice: he came to life and stood up
  chosen_korean: 살아나서 자기 발로 일어났습니다
  alternatives_korean:
  - 생명을 얻어 일어났습니다
  - 되살아나 일어났습니다
  lexicon: חָיָה + קוּם
  rationale: 두 동작을 한국어에서 인과적으로 연결해 기적의 결과를 분명히 하되, ‘stood up on his feet’의 신체적 완결성을 살렸습니다.
theological_decisions:
- issue: 엘리사 뼈와 생명의 회복을 어떻게 표현할지
  chosen_reading: 기적의 즉각성과 충격을 약화하지 않도록, 살아 움직이는 회복을 직접적으로 서술했습니다.
  alternative_readings:
  - 상징적으로 되살아났습니다
  - 생명이 돌아왔습니다
  rationale: 본문은 엘리사의 뼈에 닿은 뒤 실제로 다시 살아나 일어서는 사건을 서술하므로, 해석적 완화 없이 서술적 기적 표현을 유지했습니다.
  doctrine_reference: 열왕기하 13:21의 서술 기적
