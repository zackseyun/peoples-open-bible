  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/004.yaml
  text: After you have made known to them these words which the Master commanded me to be revealed to you, then all their sins that they formerly committed are forgiven them, and also to all the holy ones who have sinned up to this day, if they repent with all their heart and remove from their heart their double‑mindedness.
translation:
  language: en
  text: Once you tell them the words the Master commanded me to reveal to you, all their former sins are forgiven. The same is true for all the holy people who have sinned up to now, if they reorient[b] with all their heart and put away the double-mindedness[a] in their hearts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Double-mindedness means being inwardly divided, doubtful, or wavering.
    reason: lexical_alternative
  - marker: b
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: After you have made known to them these words which the Master commanded me to be revealed to you
  simplified_phrase: Once you tell them the words the Master commanded me to reveal to you
  preserved_meaning: The words must be communicated as the Master commanded.
  reasoning_layer_used: POB text and clause relationships
  rationale: The nested passive wording becomes a direct statement without changing the roles.
- pob_phrase: then all their sins that they formerly committed are forgiven them, and also to all the holy ones
  simplified_phrase: all their former sins are forgiven. The same is true for all the holy people
  preserved_meaning: Forgiveness extends to both the first group and the holy people.
  reasoning_layer_used: POB text and cross-check agreement
  rationale: Two sentences make the scope of forgiveness easier to follow.
- pob_phrase: remove from their heart their double-mindedness
  simplified_phrase: put away the double-mindedness in their hearts
  preserved_meaning: They must reject their inward division, doubt, or wavering.
  reasoning_layer_used: POB wording and independent grounding review
  rationale: Retaining “double-mindedness” avoids narrowing the expression to divided loyalty.
interpretive_expansions:
- pob_phrase: double-mindedness
  rendering: Double-mindedness means being inwardly divided, doubtful, or wavering.
  claim: The footnote clarifies the expression without choosing only one aspect of it.
  evidence:
  - The POB preserves the broad expression “double-mindedness.”
  - The grounding review identifies inward division, doubt, and wavering as its live breadth.
  confidence: moderate
  alternatives_preserved:
  - divided commitment
  - inward doubt
  - wavering or instability
translation_notes:
  risk_flags:
  - risk: “Double-mindedness” may be unfamiliar to some readers.
    mitigation: The footnote explains its broad sense without narrowing it to one meaning.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
