  terminology: ‘야훼’, ‘약탈대’, ‘따라잡다’, ‘구출하다’는 각각 יהוה, גדוד, שׂיג, נצל의 문맥상 의미를 무리 없이 전달합니다. 목적어가 명시되지 않은 ‘구출할 것입니다’는 히브리어의 목적어 생략을 보존합니다.
