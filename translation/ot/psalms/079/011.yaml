  meaning: The community asks God to attend to the prisoners’ distress and use his great power to spare those facing death.
  meaning_decisions:
  - source_phrase: אֶנְקַת אָסִיר
    prior_rendering: the groaning of the prisoner
    new_rendering: the groaning of the prisoners
    rationale: The singular describes prisoners as a class within this communal lament, rather than introducing one particular prisoner. English plural wording makes that understood scope clear.
  - source_phrase: כְּגֹדֶל זְרוֹעֲךָ הוֹתֵר
    prior_rendering: according to the greatness of your arm, preserve
    new_rendering: by the might of your arm, spare
    rationale: The appeal asks God to exercise power commensurate with his mighty arm. “Spare” makes explicit that the requested preservation is preservation from death, while retaining the arm as the image of divine power.
