  yaml_path: translation/deuterocanon/judith/013/014.yaml
  text: And she said to them with a loud voice, “Praise God, praise him; praise God, who has not withdrawn his mercy from the house of Israel, but has shattered our enemies by my hand in this night.”
translation:
  language: ko
  text: 그녀가 큰 소리로 그들에게 말했습니다. “하나님을 찬양하십시오, 찬양하십시오. 이스라엘 집에서 그의 자비를 거두지 않으시고, 바로 이 밤에 내 손으로 우리의 원수들을 꺾으신 하나님을 찬양하십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνῇ μεγάλῃ
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 큰 음성으로
  - 높은 소리로
  lexicon: φωνή, μέγας
  rationale: 말하는 방식의 강도를 자연스럽게 드러내되, 현대 한국어에서 가장 직접적이고 읽기 쉬운 표현으로 옮겼습니다.
- source_word: Αἰνεῖτε τὸν θεόν, αἰνεῖτε· αἰνεῖτε τὸν θεόν
  english_pob_choice: Praise God, praise him; praise God
  chosen_korean: 하나님을 찬양하십시오, 찬양하십시오. … 하나님을 찬양하십시오
  alternatives_korean:
  - 하나님을 찬양하십시오, 찬양하십시오
  - 하나님을 송축하십시오, 송축하십시오
  lexicon: αἰνέω, θεός
  rationale: 반복 명령의 시적 호흡을 살리기 위해 동일 동사를 유지했고, θεόν은 프로젝트 기본어인 ‘하나님’으로 옮겼습니다.
- source_word: ὃς οὐκ ἀπέστησεν τὸ ἔλεος αὐτοῦ ἀπὸ τοῦ οἴκου Ἰσραήλ
  english_pob_choice: who has not withdrawn his mercy from the house of Israel
  chosen_korean: 이스라엘 집에서 그의 자비를 거두지 않으시고
  alternatives_korean:
  - 이스라엘 집에서 그의 자비를 거두어 가시지 않으시고
  - 이스라엘 집에 대한 그의 자비를 거두지 않으시고
  lexicon: ἀποστήσω, ἔλεος, οἶκος
  rationale: ‘자비’를 기본값으로 유지하고, ‘거두다’로 ἀπέστησεν의 철회·중단 의미를 자연스럽게 반영했습니다.
- source_word: ἔθραυσε τοὺς ἐχθροὺς ἡμῶν διὰ χειρός μου ἐν τῇ νυκτὶ ταύτῃ
  english_pob_choice: has shattered our enemies by my hand in this night
  chosen_korean: 바로 이 밤에 내 손으로 우리의 원수들을 꺾으신
  alternatives_korean:
  - 바로 이 밤에 내 손으로 우리의 원수들을 깨뜨리신
  - 이 밤에 내 손으로 우리의 원수들을 부수신
  lexicon: θραύω, ἐχθρός, χείρ
  rationale: θραύω의 강한 파괴 이미지를 한국어 동사 ‘꺾다’로 옮겨 승리를 드러내되, 과도하게 물리적 잔혹성을 덧붙이지 않도록 했습니다.
theological_decisions:
- issue: 하나님의 ‘자비’와 전승적 구원 행위의 연결
  chosen_reading: 구원의 원인을 인간의 공로가 아니라 하나님이 이스라엘 집에 남겨 두신 자비로 밝히는 구조를 살렸습니다.
  alternative_readings:
  - ‘인자’로 옮겨 더 전통적 신학어를 쓰는 방식
  - ‘긍휼’로 옮겨 감정적 뉘앙스를 강조하는 방식
  rationale: 원문의 ἔλεος는 자비/긍휼 범주이지만, 여기서는 역사적 구원 선언 안에서 하나님의 은혜로운 태도를 강조하므로 프로젝트 기본어 ‘자비’를 유지했습니다.
  doctrine_reference: 하나님의 자비, 구원 주도권
