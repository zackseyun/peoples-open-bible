  text: 'Νηστεύων καὶ καθήμενος εἰς ὄρος τι καὶ εὐχαριστῶν τῷ Κυρίῳ περὶ πάντων ὧν ἐποίησε μετ᾽ ἐμοῦ,
    βλέπω τὸν ποιμένα παρακαθήμενόν μοι καὶ λέγοντα Τί ὀρθρινὸς ὧδε ἐλήλυθας; Ὅτι, φημί, κύριε, στατίωνα
    ἔχω. 2. Τί, φησίν, ἐστὶ στατίων; Νηστεύω, φημί, κύριε. Νηστεία δέ, φησί, τί ἐστιν αὕτη[, ἣν νηστεύετε];
    Ὡς εἰώθειν, φημί, κύριε, οὕτω νηστεύω. 3. Οὐκ οἴδατε, φησί, νηστεύειν τῷ Κυρίῳ, οὐδέ ἐστιν νηστεία
    αὕτη ἡ ἀνωφελὴς ἣν νηστεύετε αὐτῷ. Διατί, φημί, κύριε, τοῦτο λέγεις; Λέγω σοι, φησίν, ὅτι οὐκ ἔστιν
    αὕτη νηστεία, ἣν δοκεῖτε νηστεύειν· ἀλλ᾽ ἐγώ σε διδάξω τί ἐστι νηστεία πλήρης καὶ δεκτὴ τῷ Κυρίῳ.
    ναί, φημί, κύριε, μακάριόν με ποιήσεις, ἐὰν γνῶ τὴν νηστείαν τὴν δεκτὴν τῷ [Θεῷ]. ἄκουε, φησίν. 4.
    ὁ Θεὸς οὐ βούλεται τοιαύτην νηστείαν ματαίαν· οὕτω γὰρ νηστεύων τῷ Θεῷ οὐδὲν ἐργάσῃ τῇ δικαιοσύνῃ.
    νήστευσον δὲ [τῷ Θεῷ] νηστείαν τοιαύτην· 5. μηδὲν πονηρεύσῃ ἐν τῇ ζωῇ σου, καὶ δούλευσον τῷ Κυρίῳ
    ἐν καθαρᾷ καρδίᾳ· τήρησον τὰς ἐντολὰς αὐτοῦ πορευόμενος ἐν τοῖς προστάγμασιν αὐτοῦ, καὶ μηδεμία ἐπιθυμία
    πονηρὰ ἀναβήτω ἐν τῇ καρδίᾳ σου· πίστευσον δὲ τῷ Θεῷ· καὶ ἐὰν ταῦτα ἐργάσῃ καὶ φοβηθῇς αὐτὸν καὶ ἐγκρατεύσῃ
    ἀπὸ παντὸς πονηροῦ πράγματος, ζήσῃ τῷ Θεῷ· καὶ ταῦτα ἐὰν ἐργάσῃ, μεγάλην νηστείαν τελέσεις καὶ δεκτὴν
    τῷ Θεῷ.


    Ἄκουε τὴν παραβολὴν ἣν μέλλω σοι λέγειν ἀνήκουσαν τῇ νηστείᾳ. 2. εἶχέ τις ἀγρὸν καὶ δούλους πολλούς,
    καί μέρος τι τοῦ ἀγροῦ ἐφύτευσεν ἀμπελῶνα. καὶ ἐκλεξάμενος δοῦλόν τινα πιστὸν καὶ εὐάρεστον ἔντιμον,
    προσεκαλέσατο αὐτὸν καὶ λέγει αὐτῷ· Λάβε τὸν ἀμπελῶνα τοῦτον [ὃν ἐφύτευσα] καὶ χαράκωσον αὐτὸν [ἕως
    ἔρχομαι], καὶ ἕτερον δὲ μὴ ποιήσῃς τῷ ἀμπελῶνι· καὶ ταύτην μου τὴν ἐντολὴν φύλαξον, καὶ ἐλεύθερος
    ἔσῃ παρ᾽ ἐμοί. ἐξῆλθε δὲ ὁ δεσπότης τοῦ δούλου εἰς τὴν ἀποδημίαν. 3. ἐξελθόντος δὲ αὐτοῦ ἔλαβεν ὁ
    δοῦλος καὶ ἐχαράκωσε τὸν ἀμπελῶνα. καὶ τελέσας τὴν χαράκωσιν τοῦ ἀμπελῶνος εἶδε τὸν ἀμπελῶνα βοτανῶν
    πλήρη ὄντα. 4. ἐν ἑαυτῷ οὖν ἐλογίσατο λέγων· Ταύτην τὴν ἐντολὴν τοῦ κυρίου τετέλεκα· σκάψω λοιπὸν
    τὸν ἀμπελῶνα τοῦτον, καὶ ἔσται εὐπρεπέστερος ἐσκαμμένος, καὶ βοτάνας μὴ ἔχων δώσει καρπὸν πλείονα,
    μὴ πνιγόμενος ὑπὸ τῶν βοτανῶν. λαβὼν ἔσκαψε τὸν ἀμπελῶνα, καὶ πάσας τὰς βοτάνας τὰς οὔσας ἐν τῷ ἀμπελῶνι
    ἐξέτιλλε. καὶ ἐγένετο ὁ ἀμπελὼν ἐκεῖνος εὐπρεπέστατος καὶ εὐθαλής, μὴ ἔχων βοτάνας πνιγούσας αὐτόν.
    5. μετὰ χρόνον ἦλθεν ὁ δεσπότης τοῦ δούλου [καὶ τοῦ ἀγροῦ], καὶ εἰσῆλθεν εἰς τὸν ἀμπελῶνα. καὶ ἰδὼν
    τὸν ἀμπελῶνα κεχαρακωμένον εὐπρεπῶς, ἔτι δὲ καὶ ἐσκαμμένον, καὶ [πάσας] τὰς βοτάνας ἐκτετιλμένας καὶ
    εὐθαλεῖς οὔσας τὰς ἀμπέλους, ἐχάρη [λίαν] ἐπὶ τοῖς ἔργοις τοῦ δούλου. 6. προσκαλεσάμενος οὖν τὸν υἱὸν
    αὐτοῦ τὸν ἀγαπητόν, ὃν εἶχε κληρονόμον, καὶ τοὺς φίλους, οὓς εἶχε συμβούλους, λέγει αὐτοῖς ὅσα ἐνετείλατο
    τῷ δούλῳ αὐτοῦ, καὶ ὅσα εὗρε γεγονότα. κἀκεῖνοι συνεχάρησαν τῷ δούλῳ ἐπὶ τῇ μαρτυρίᾳ ᾗ ἐμαρτύρησεν
    αὐτῷ ὁ δεσπότης. 7. καὶ λέγει αὐτοῖς· Ἐγὼ τῷ δούλῳ τούτῳ ἐλευθερίαν ἐπηγγειλάμην ἐάν μου τὴν ἐντολὴν
    φυλάξῃ ἣν ἐνετειλάμην αὐτῷ· ἐφύλαξέ δέ μου τὴν ἐντολὴν καὶ προσέθηκε τῷ ἀμπελῶνι ἔργον καλόν, καὶ
    ἐμοὶ λίαν ἤρεσεν. ἀντὶ τούτου οὖν τοῦ ἔργου οὗ εἰργάσατο θέλω αὐτὸν συνκληρονόμον τῷ υἱῷ μου ποιῆσαι,
    ὅτι τὸ καλὸν φρονήσας οὐ παρενεθυμήθη, ἀλλ᾽ ἐτέλεσεν αὐτό. 8. ταύτῃ τῇ γνώμῃ ὁ υἱὸς τοῦ δεσπότου συνηυδόκησεν
    αὐτῷ, ἵνα συνκληρονόμος γένηται ὁ δοῦλος τῷ υἱῷ. 9. μετὰ ἡμέρας ὀλίγας δεῖπνον ἐποίησεν ὁ οἰκοδεσπότης
    αὐτοῦ, καὶ ἔπεμψεν αὐτῷ ἐκ τοῦ δείπνου ἐδέσματα πολλά. λαβὼν δὲ ὁ δοῦλος [τὰ ἐδέσματα τὰ πεμφθέντα
    αὐτῷ παρὰ τοῦ δεσπότου] τὰ ἀρκοῦντα αὐτῷ ἦρε, τὰ λοιπὰ δὲ τοῖς συνδούλοις αὐτοῦ διέδωκεν. 10. οἱ δὲ
    σύνδουλοι αὐτοῦ λαβόντες τὰ ἐδέσματα ἐχάρησαν, καὶ ἤρξαντο εὔχεσθαι ὑπὲρ αὐτοῦ ἵνα χάριν μείζονα εὕρῃ
    παρὰ τῷ δεσπότῃ, ὅτι οὕτως ἐχρήσατο αὐτοῖς. 11. ταῦτα πάντα τὰ γεγονότα ὁ δεσπότης αὐτοῦ ἤκουσε, καὶ
    πάλιν λίαν ἐχάρη ἐπὶ τῇ πράξει αὐτοῦ. συγκαλεσάμενος πάλιν τοὺς φίλους ὁ δεσπότης καὶ τὸν υἱὸν αὐτοῦ
    ἀπήγγειλεν αὐτοῖς τὴν πρᾶξιν αὐτοῦ ἣν ἔπραξεν ἐπὶ τοῖς ἐδέσμασιν αὐτοῦ οἷς ἔλαβεν· οἱ δὲ ἔτι μᾶλλον
    συνευδόκησαν γενέσθαι τὸν δοῦλον συγκληρονόμον τῷ υἱῷ αὐτοῦ.'
