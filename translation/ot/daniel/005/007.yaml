  to: The king shouted for the enchanters, astrologers[a], and diviners to be brought in. He said to the wise men of Babylon, “Whoever reads this writing and tells me what it means will be clothed in purple, have a gold chain placed around his neck, and become the third-highest ruler in the kingdom[b].”
