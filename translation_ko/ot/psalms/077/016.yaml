base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/016.yaml
  text: The waters saw you, O God; the waters saw you and writhed[a]; even the depths[b] trembled.
  footnotes:
  - marker: a
    text: Or 'ransomed' or 'delivered' for 'redeemed.'
    reason: lexical_alternative
  - marker: b
    text: '''By your arm'' keeps the Hebrew image of God''s mighty power at work.'
    reason: lexical_alternative
  - marker: c
    text: '''The sons of Jacob and Joseph'' may function as a poetic way of referring to Israel, with ''Joseph'' possibly highlighting the tribes descended from him.'
    reason: alternative_reading
  - marker: d
    text: '''Selah'' is likely a liturgical or musical notation; its exact meaning is uncertain.'
    reason: cultural_note
translation:
  language: ko
  text: 하나님, 물들이 주를 보았습니다. 물들이 주를 보고 몸부림쳤습니다.[a] 깊은 물들도 떨었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몸부림쳤습니다’는 ‘떨었습니다’, ‘고통스러워했습니다’ 또는 ‘뒤틀렸습니다’로도 옮길 수 있습니다. 히브리어 동사는 경련하듯 흔들리거나 해산의 고통처럼 몸부림치는 모습을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘깊은 물들’은 바다의 깊은 곳 또는 심연의 물을 가리킵니다.
    reason: lexical_alternative
