translation:
  text: Then I wrote a record of their petition, and a supplication concerning their spirit and their deeds individually,[a]
    and concerning their request that forgiveness and forbearance might be theirs.[b]
  philosophy: formal
  footnotes:
  - marker: a
    reason: textual_variant
    text: The source has a singular noun for spirit with plural possessors; that literal number is retained. Individually
      represents the marked distributive expression, preserving its individualizing force without making its compressed
      attachment more specific than the selected text does. Charles places an asterisk before this expression and
      records variants. This follows his edited main line, not a new collation of manuscripts.
  - marker: b
    reason: lexical_alternative
    text: The final word is ኑሐተ. Dillmann’s complete photographed1865 Latin entry explicitly cites this verse for
      delay of punishment, that is, forbearance. This is not an unspecified addition of days. The request is that
      these things might be for them, not a statement that they were granted. Charles’s apparatus13 records an additional
      word and nominative-case variants; neither that addition nor those alternative case forms is imported into
      the selected source here. The printed accusatives are compatible with the verb of being.
