lexical_decisions:
- source_word: ሰማይ
  chosen: heaven
  alternatives:
  - the heavens
  - sky
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The singular form here works naturally as a collective/cosmic realm in apocalyptic context. 'Heaven' preserves the visionary register better than 'sky,' while avoiding an unnecessary plural unless the context clearly demands it.
- source_word: ነፋሳቲሆሙ
  chosen: their spirits
  alternatives:
  - their souls
  - their breaths
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The noun built from the Semitic root for breath/spirit can denote spirit or soul. In this judgment-vision setting, 'spirits' best fits the cosmological and postmortem sense without importing later technical distinctions.
- source_word: ለነፋሳት
  chosen: received ... spirits
  alternatives:
  - for spirits
  - the spirits
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The syntax is difficult in the OCR witness. The lamed-marked phrase appears to function with the preceding clause in a way that yields the sense of heaven taking or receiving spirits. Because the verse is elliptical, the English supplies 'received' to make the clause intelligible while staying close to the apparent sense.
- source_word: መንፈሳት
  chosen: spirits
  alternatives:
  - winds
  - spiritual beings
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Although the term can overlap with wind/breath language, the repeated use in this verse and the surrounding context favor 'spirits' as the governing sense.
- source_word: ወፍናዋቲሆሙ
  chosen: their paths
  alternatives:
  - their ways
  - their goings out
  - their courses
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The form is obscure, but likely refers to movements, ways, or courses. 'Paths' preserves the apocalyptic sense of ordered movement without overcommitting to a more technical cosmological term.
- source_word: እምኵሉ ኅብራት
  chosen: from every gathering
  alternatives:
  - from every company
  - from every assembly
  - from all associations
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The phrase appears to denote collective groupings or assemblages. 'Gathering' is broad enough to preserve ambiguity about whether these are classes of spirits, hosts, or assembled companies.
