base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/021.yaml
  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
  footnotes:
  - marker: a
    text: Or 'And Reu lived, after he fathered Serug, two hundred and seven years,'.
    reason: previous_rendering
translation:
  language: ko
  text: 르우는 스룩을 낳은 뒤 이백칠 년을 살았고, 아들들과 딸들을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살았고
  - 생존했습니다
  lexicon: HALOT
  rationale: 족보 공식에서 חיה의 완료 서술은 ‘살았다’가 가장 자연스럽고 간결합니다. 영어 POB의 ‘lived’를 반영하되, 한국어에서는 문맥상 현재적 지속보다 생애 총기간을 말하는 형태로 처리했습니다.
- source_word: רְעוּ
  english_pob_choice: Reu
  chosen_korean: 르우
  alternatives_korean:
  - 레우
  lexicon: 표준 음역 관례
  rationale: 히브리어 인명은 한국어 성경 관례에 맞게 음역했습니다. 기존 관용형이 뚜렷하지 않아 원음에 가까운 ‘르우’를 택했습니다.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שְׂרוּג
  english_pob_choice: after he fathered Serug
  chosen_korean: 세룩을 낳은 뒤
  alternatives_korean:
  - 세룩을 아버지가 된 뒤
  - 세룩을 낳은 후
  lexicon: HALOT
  rationale: 동사 ילד의 히필은 족보 문맥에서 ‘낳다/아버지가 되다’의 의미이므로, 한국어에서는 자연스럽고 직접적인 ‘낳은 뒤’로 옮겼습니다.
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  english_pob_choice: two hundred and seven years
  chosen_korean: 이백칠 년
  alternatives_korean:
  - 이백과 일곱 해
  - 칠 년과 이백 년
  lexicon: HALOT
  rationale: 히브리어 수사 배열을 한국어 관용에 맞게 재배열했습니다. 단위 ‘해/년’은 족보 공식에서 ‘년’이 더 자연스럽습니다.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  english_pob_choice: he fathered sons and daughters
  chosen_korean: 아들들과 딸들을 낳았습니다
  alternatives_korean:
  - 자녀들을 낳았습니다
  - 아들딸을 낳았습니다
  lexicon: HALOT
  rationale: 히브리어가 남녀 자녀를 분명히 구분하므로, 일반화한 ‘자녀들’보다 ‘아들들과 딸들’을 유지해 정보를 보존했습니다.
