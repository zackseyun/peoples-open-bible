  from: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
  to: Then Herod secretly summoned the magi and determined from them the exact time when the star had appeared,[a]
  rationale: The verb ἠκρίβωσεν (from ἀκριβόω) specifically means to ascertain or learn *exactly* or *accurately*. Translating it simply as 'determined' and χρόνον as 'the time' loses the emphasis on Herod's demand for precision, which is crucial for his later calculation to kill the boys in Bethlehem. Adding 'exact' captures this lexical nuance.
