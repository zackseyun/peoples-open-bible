translation:
  language: ko
  text: 요한이 그들에게 대답하여 말했습니다. “저는 물로 세례를 베풉니다. 여러분 가운데에 여러분이 알지 못하는 한 사람이 서 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
