    rationale: וְזֶה כָּל־פְּרִי הָסִיר חַטָּאתוֹ는 죄를 제거하는 일의 ‘모든 열매’, 곧 완전한 결과를 말합니다. 한국어에서는 ‘죄를 없애는 온전한 결과’로 표현하는 편이 자연스럽습니다.
  - severity: low
