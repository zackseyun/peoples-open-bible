  yaml_path: translation/ot/psalms/034/000.yaml
  text: Of David[a], when he changed his behavior before Abimelech, who drove him away, and he left.
  footnotes:
  - marker: a
    text: Abimelech is identified as Achish in 1 Samuel 21:10–15; 'Abimelech' here may be an alternate name or a royal title.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗의 시[a]. 그가 아비멜렉 앞에서 자기 처신을 바꾸었을 때, 아비멜렉이 그를 내쫓았고, 다윗은 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아비멜렉은 사무엘상 21:10–15에 나오는 아기스와 동일시되기도 합니다. 여기의 ‘아비멜렉’은 별칭이나 왕호일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 글
  alternatives_korean:
  - 다윗으로 말미암아
  - 다윗을 위한 글
  lexicon: HALOT
  rationale: 시편 표제의 לְ는 저자, 소속, 헌정의 범위를 모두 열어 두므로, 가장 자연스럽게는 ‘다윗의 글’로 옮겨 원문의 개방성을 보존합니다.
- source_word: בְּשַׁנּוֹתוֹ
  english_pob_choice: when he changed
  chosen_korean: 그가 … 바꾸었을 때
  alternatives_korean:
  - 그가 변했을 때
  - 그가 바꾸었을 때
  lexicon: HALOT
  rationale: 시간 부사절로 기능하는 구문이므로 ‘…했을 때’로 처리했고, 본문과 합쳐 ‘자기 태도’를 목적어로 두어 문맥상 행동 변화임을 드러냈습니다.
- source_word: טַעְמוֹ
  english_pob_choice: his behavior
  chosen_korean: 자기 태도
  alternatives_korean:
  - 자기 행동
  - 그의 분별
  - 그의 맛/취향
  lexicon: HALOT
  rationale: 직역하면 ‘맛/분별’이지만 여기서는 사울/아기스 앞에서의 외적 처신을 가리키므로, кли니컬한 뉘앙스를 피하면서도 문맥을 살리는 ‘태도’가 가장 적절합니다.
- source_word: לִפְנֵי אֲבִימֶלֶךְ
  english_pob_choice: before Abimelech
  chosen_korean: 아비멜렉 앞에서
  alternatives_korean:
  - 아비멜렉의 면전에서
  - 아비멜렉 앞에
  lexicon: HALOT
  rationale: ‘before’의 공간적·상황적 의미를 간결하게 살린 표현입니다. 이름은 본문대로 아비멜렉을 유지했습니다.
theological_decisions:
- issue: 아비멜렉과 아기스의 동일시 문제
  chosen_reading: 본문에는 ‘아비멜렉’을 유지하고, 역사적 연결은 각주로 처리합니다.
  alternative_readings:
  - 본문을 1사무엘 21장의 아기스로 바꾸기
  - 아비멜렉을 왕호 또는 별칭으로 이해하기
  rationale: 히브리어 표면형을 우선 보존하면서도, 1사무엘과의 연관을 독자가 놓치지 않도록 각주로만 제시하는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: Original-language primacy; preserve textual tension rather than harmonize it away.
