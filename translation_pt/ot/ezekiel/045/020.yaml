base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/020.yaml
  text: And so you shall do on the seventh day of the month for anyone who sins unintentionally or through simplicity[b][a]; thus you shall make atonement for the temple.
translation:
  language: pt
  text: E assim farás, no sétimo dia do mês, por todo aquele que errar sem intenção e pelo ingênuo[a]; assim farão expiação pelo templo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por um homem que erra e pelo simples”. O hebraico pode distinguir duas categorias de pessoas; פֶּתִי também pode ser traduzido por “inexperiente” ou “simples”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a casa”, isto é, o templo ou santuário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: E assim
  rationale: Retoma a instrução ritual anterior e introduz a ação correspondente de maneira natural em português.
- source_word: תַּעֲשֶׂה
  choice: você fará
  rationale: O singular hebraico é preservado e o verbo expressa a execução da ação ritual prescrita.
- source_word: בְּשִׁבְעָה בַחֹדֶשׁ
  choice: no sétimo dia do mês
  rationale: A expressão é elíptica no hebraico; acrescentar “dia” explicita seu sentido idiomático.
- source_word: מֵאִישׁ
  choice: por qualquer pessoa
  rationale: אִישׁ está no masculino singular, mas tem sentido genérico neste contexto.
- source_word: שֹׁגֶה
  choice: que tenha pecado sem intenção
  rationale: O particípio indica alguém que erra inadvertidamente; no contexto ritual, “pecado sem intenção” torna clara a natureza da transgressão sem sugerir deliber ação.
- source_word: וּמִפֶּתִי
  choice: ou por ingenuidade
  rationale: פֶּתִי pode designar alguém simples, ingênuo ou inexperiente. A formulação mantém a possível noção de uma falta decorrente de ingenuidade, sem reduzi-la simplesmente à ignorância.
- source_word: וְכִפַּרְתֶּם
  choice: desse modo, vocês farão expiação
  rationale: O plural verbal hebraico é preservado. “Fazer expiação” é uma expressão transparente para כפר no contexto sacerdotal.
- source_word: הַבָּיִת
  choice: o templo
  rationale: Literalmente “a casa”; na visão de Ezequiel, o referente é o templo ou santuário.
theological_decisions:
- issue: Escopo do rito de expiação
  choice: A expiação é feita pelo templo em razão de faltas humanas involuntárias ou decorrentes de ingenuidade.
  alternative: O rito é realizado diretamente em favor dessas pessoas.
  rationale: O objeto explícito de וְכִפַּרְתֶּם é “a casa”. A tradução mantém tanto a ocasião humana do rito quanto seu foco no templo.
- issue: Uma categoria ou duas em מֵאִישׁ שֹׁגֶה וּמִפֶּתִי
  choice: A frase descreve a falta de qualquer pessoa como não intencional ou decorrente de ingenuidade.
  alternative: “por um homem que erra e pelo ingênuo”, distinguindo duas categorias de pessoas.
  rationale: A sintaxe admite mais de uma análise. O texto principal oferece uma leitura natural em português, e a nota preserva a alternativa genuína.
- issue: Sentido genérico de אִישׁ
  choice: qualquer pessoa
  alternative: um homem
  rationale: Embora o substantivo seja masculino singular, seu uso aqui é genérico e não exige restringir o rito aos homens.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Preserva-se a mudança do singular “você fará” para o plural “vocês farão” presente no hebraico. As notas mantêm a ambiguidade sintática e lexical sem impor uma interpretação denominacional.
