translation:
  text: 'Then the proconsul said, “I have wild beasts here, and I will throw you to them unless you reconsider[a].” But he said, “Call for them, for a change of mind from better to worse is a change not permitted to us. But it is a noble thing to change from wrongdoing to righteousness.”


    Then he said to him again, “I will have you consumed by fire if you despise the wild beasts, unless you reconsider.” But Polycarp said, “You threaten me with a fire that burns for a time and is quenched after a little while, for you are ignorant of the fire of the future judgment and eternal punishment that is reserved for the ungodly. But why do you delay? Come, do what you will.”'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - Provisional rendering based on the supplied public-domain English witness.
  - Direct review of the Greek manuscript tradition remains pending.
  footnotes:
  - marker: a
    text: Earlier reader wording used a form of "repent." Preserve reconsideration/change of mind without adding a Godward destination. Here the direction or referent is contested, vacillating, or explicitly contrary to faith; a uniform Godward rendering would misstate the passage. This reader text adapts the recorded English translation witness; it is not a verbatim quotation or a newly verified translation of the ancient-language text. The source witness is unchanged.
    reason: lexical_alternative
