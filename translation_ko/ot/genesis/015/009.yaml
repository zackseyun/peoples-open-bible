- source_word: קְחָה לִי
  english_pob_choice: Bring me
  chosen_korean: 나를 위해 … 가져오십시오
  alternatives_korean:
  - 나를 위해 … 데려오십시오
  - 나를 위해 … 취하십시오
  lexicon: HALOT
  rationale: 직역하면 ‘나를 위해 취하라’이지만, 문맥상 제물을 준비해 가져오는 뜻이므로 합쇼체에서는 ‘가져오십시오’가 가장 자연스럽고 원문 의미에 가깝습니다.
- source_word: עֶגְלָה מְשֻׁלֶּשֶׁת / עֵז מְשֻׁלֶּשֶׁת / אַיִל מְשֻׁלָּשׁ
  english_pob_choice: a three-year-old heifer / a three-year-old female goat / a three-year-old ram
  chosen_korean: 세 살 된 암송아지 / 세 살 된 암염소 / 세 살 된 숫양
  alternatives_korean:
  - 세 살 된 송아지 암컷 / 세 살 된 염소 암컷 / 세 살 된 양 수컷
  - 삼세 된 암송아지 / 삼세 된 암염소 / 삼세 된 숫양
  lexicon: HALOT
  rationale: POB의 ‘three-year-old’를 따라 연령 표현으로 옮겼고, עֶגְלָה·עֵז·אַיִל의 성별과 종을 한국어에서 분명히 드러내기 위해 각각 암송아지·암염소·숫양으로 번역했습니다.
- source_word: תֹר וְגוֹזָל
  english_pob_choice: a turtledove and a young pigeon
  chosen_korean: 산비둘기와 새끼 비둘기
  alternatives_korean:
  - 흔치 않은 비둘기와 어린 비둘기
  - 산비둘기와 어린 비둘기
  lexicon: HALOT
  rationale: תֹר는 특정한 새 이름이므로 관용적으로 ‘산비둘기’로 옮겼고, גוֹזָל은 이 제의 목록에서 ‘새끼 비둘기’가 가장 분명한 대응입니다.
theological_decisions:
- issue: 제의용 동물 명령의 어조
  chosen_reading: 직접 명령문을 살려 아브람에게 제의 준비를 지시하는 말로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘준비해 주십시오’로 옮기는 읽기
  - 서술적으로 ‘가져오도록 하셨습니다’로 옮기는 읽기
  rationale: 원문은 명령형으로 제의 행위를 요구하므로, 이를 약화하지 않고 직접적인 지시로 유지하는 것이 서사와 언약 예식의 긴장을 보존합니다.
  doctrine_reference: 창 15장 언약 체결 예식
- issue: ‘세 살 된’ 표현
  chosen_reading: 반복되는 מְשֻׁלֶּשֶׁת/מְשֻׁלָּשׁ을 연령 표현으로 이해해 ‘세 살 된’으로 옮겼습니다.
  alternative_readings:
  - ‘삼중의’ 또는 ‘세 겹의’로 이해하는 읽기
  - 숫자적·상징적 의미를 불분명하게 남기는 읽기
  rationale: 본문의 제의용 동물 목록에서는 나이 표지가 가장 자연스러운 이해이므로, POB의 해석을 따라 그 의미를 한국어로 분명하게 드러냈습니다.
  doctrine_reference: 본문 주해상 어휘 결정
