  rationale: The verbal form can be read as imperfect/future, but in the psalm's prayer setting a petition to God is more contextually fitting and preserves the devotional force without overstating prophetic certainty.
  doctrine_reference: Translation philosophy §3 (preserve tension where ambiguity exists)
