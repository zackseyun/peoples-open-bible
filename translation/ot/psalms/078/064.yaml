id: PSA.78.64
reference: Psalms 78:64
source:
  edition: WLC
  text: כֹּ֭הֲנָי/ו בַּ/חֶ֣רֶב נָפָ֑לוּ וְ֝/אַלְמְנֹתָ֗י/ו לֹ֣א תִבְכֶּֽינָה׃
translation:
  text: His priests fell by the sword, and his widows did not weep[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The absence of weeping may mean that the devastation left no opportunity for customary mourning.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּהֲנָיו
  chosen: his priests
  alternatives:
  - his ministers
  lexicon: HALOT
  rationale: The noun כֹּהֵן ordinarily means 'priest.' 'Priests' is the plain and established sense in this context of national judgment; 'ministers' would be too interpretive and less tied to Israel's cultic office.
- source_word: בַּחֶרֶב
  chosen: by the sword
  alternatives:
  - with the sword
  lexicon: HALOT
  rationale: The preposition ב plus 'sword' here expresses means/instrument in an idiomatic way. 'By the sword' is natural English and preserves the Hebrew idiom of violent death in battle.
- source_word: נָפָלוּ
  chosen: fell
  alternatives:
  - were slain
  - died
  lexicon: HALOT
  rationale: The verb נפל literally means 'fell.' In battle contexts it can imply being struck down, but 'fell' preserves the Hebrew image while still communicating death when paired with 'by the sword.'
- source_word: וְאַלְמְנֹתָיו
  chosen: and his widows
  alternatives:
  - and their widows
  lexicon: HALOT
  rationale: The suffix is 3ms singular, matching the psalm's personification of Israel/Ephraim as a singular entity, so 'his widows' is the most formally accurate rendering. 'Their widows' would smooth the sense for English readers but obscure the singular possessive in the Hebrew.
- source_word: לֹא תִבְכֶּינָה
  chosen: did not weep
  alternatives:
  - did not weep
  - were not weeping
  - would not weep
  lexicon: HALOT
  rationale: The Hebrew directly negates weeping; inability is interpretive and belongs, if retained, in a note.
