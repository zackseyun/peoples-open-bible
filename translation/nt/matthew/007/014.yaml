id: MAT.7.14
reference: Matthew 7:14
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
translation:
  text: For narrow is the gate[a] and hard[b] is the road that leads to life, and few find it.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Some manuscripts read “How narrow is the gate and hard the road that leads to life!”
    reason: textual_variant
  - marker: b
    text: Literally “pressed in” or “constricted,” in contrast with the broad road of verse 13. The word is related to the Greek word for affliction or tribulation.
    reason: lexical_alternative
