revisions:
- from: 고레스에 대해 「그는 내 목자이며, 내 모든 뜻을 이루게 할 것이다」라고 말씀하시는 분이시며, 예루살렘에 대해 「그녀는 다시 세워질 것이다」, 성전에 대해 「그 기초가 놓일 것이다」라고 말씀하십니다.
  to: 고레스에 대하여 「그는 내 목자이며 내 모든 뜻을 이룰 것이다」라고 말씀하시고, 예루살렘을 향하여 「너는 재건될 것이다」라고, 성전을 향하여 「네 기초가 놓일 것이다」라고 말씀하시는 분이십니다.
  rationale: 고레스가 하나님의 뜻을 직접 이룬다는 히브리어 능동형을 보존하기 위해 ‘이룰 것이다’로 고쳤습니다. 예루살렘과 성전을 향한 발화라는 원문의 전치사 구성을 ‘향하여’로 드러내고, 한국어에서 부자연스러운 여성 대명사는 대상 자체와 2인칭 인용으로 대체했습니다. 성전의 수동형은 ‘네 기초가 놓일 것이다’로 구체화하여 원문의 기초 놓음 이미지를 유지했습니다.
