  text: שָׁ֤ם פָּֽחֲדוּ פַחַד֮ לֹא הָ֪יָה֫ פָ֥חַד כִּֽי אֱלֹהִ֗ים פִּ֭זַּר עַצְמ֣וֹת חֹנָ֑/ךְ הֱ֝בִשֹׁ֗תָה כִּֽי אֱלֹהִ֥ים מְאָסָֽ/ם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/005.yaml
  text: There they were terrified[a], though there was nothing to fear; for God scattered the bones of the one encamping against you[b]. You put them to shame[c], for God rejected them.
  footnotes:
  - marker: a
    text: More literally, “they feared a fear.” The Hebrew uses a verb and related noun together for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or “the one camping around you” or “your besieger.” The Hebrew “you” here is feminine singular, likely addressing Zion or Jerusalem.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew shifts here to masculine singular “you,” likely turning to address God directly before speaking of God again in the third person.
    reason: alternative_reading
translation:
  language: ko
  text: 거기에서 그들은 두려워할 일이 전혀 없었는데도 크게 두려워하였습니다.[a] 하나님께서 당신을 대적하여 진을 친 자의 뼈들을 흩으셨기 때문입니다.[b] 하나님께서 그들을 버리셨으므로, 당신께서 그들을 수치스럽게 하셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘두려워하다’와 같은 어근의 명사를 함께 써서 강조합니다. 직역하면 ‘그들은 두려움을 두려워하였다’와 같습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신을 대적하여 진을 친 자’는 직역에 가까운 표현입니다. 히브리어의 접미사는 여성 단수이지만, 본문은 그 대상을 이름으로 밝히지 않습니다. 문맥상 적대적인 포위자 또는 공격자를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절은 ‘하나님께서 뼈들을 흩으셨다’고 말하다가 ‘당신께서 그들을 수치스럽게 하셨다’고 하나님께 직접 말하는 방식으로 전환합니다. 이 시적 인칭 전환을 번역에서도 유지했습니다.
    reason: alternative_reading
