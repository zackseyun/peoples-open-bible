lexical_decisions:
- source_word: πολλὰ
  chosen: much
  alternatives:
  - many things
  - at length
  - repeatedly
  lexicon: LSJ
  rationale: Adverbial accusative with παραινέσαντος, indicating extent/intensity of urging. 'Much' in English idiomally conveys persistent urging without over-paraphrasing.
- source_word: παραινέσαντος
  lemma: παραινέω
  chosen: had urged
  alternatives:
  - had exhorted
  - had advised
  - had encouraged
  lexicon: LSJ
  rationale: Genitive absolute from παραινέω. In context the speaker is pressing the mother to influence her son; 'urged' best fits the forceful appeal better than the milder 'advised' or more formal 'exhorted'.
- source_word: ἐπεδέξατο
  chosen: agreed
  alternatives:
  - accepted
  - undertook
  - consented
  lexicon: LSJ
  rationale: Middle form conveying acceptance of the proposal/request. 'Agreed' is natural modern English and fits the infinitive complement πεῖσειν.
- source_word: πεῖσειν
  chosen: to persuade
  alternatives:
  - to convince
  - to win over
  lexicon: LSJ
  rationale: Future infinitive of πείθω after ἐπεδέξατο, expressing what she agreed to do. 'Persuade' is the most direct and standard rendering.
- source_word: τὸν υἱόν
  chosen: her son
  alternatives:
  - the son
  - his son
  lexicon: LSJ
  rationale: Although the Greek has the article plus noun, English idiom in this context requires the possessive. The referent is the mother's son, not the speaker's; 'her son' makes the relationship explicit from the narrative context.
