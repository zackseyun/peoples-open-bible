  from: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
  to: Then the Philistines seized him, gouged out his eyes, brought him down to Gaza, and bound him with bronze shackles. He ground grain in the prison.
