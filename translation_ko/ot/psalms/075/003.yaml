  text: The earth and all who dwell in it melt away[a]; I myself have set its pillars firm[c]. Selah[b]
  footnotes:
  - marker: a
    text: Or 'totter,' 'dissolve,' or 'are shaken' for 'melt away.' The Hebrew image is one of instability or collapse.
