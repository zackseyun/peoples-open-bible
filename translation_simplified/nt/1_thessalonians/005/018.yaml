translation:
  language: en
  text: Give thanks in every circumstance,[a] because this is what God wants for you in Christ Jesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This means giving thanks in every situation, not necessarily thanking God for evil itself.
    reason: simplification_note
  - marker: b
