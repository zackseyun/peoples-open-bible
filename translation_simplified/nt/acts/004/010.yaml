  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus Christ the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
  footnotes:
  - marker: a
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
