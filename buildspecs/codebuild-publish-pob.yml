version: 0.2

env:
  shell: bash
  variables:
    AWS_REGION: us-west-2
    LAMBDA_NAME: cartha-cob-publisher
    CDN_MANIFEST_URL: https://bible.cartha.com/manifest.json

phases:
  install:
    commands:
      - set -euo pipefail
      - aws --version
      - jq --version
      - python3 -m pip install --user pyyaml jsonschema
  pre_build:
    commands:
      - set -euo pipefail
      - export TARGET_SHA="${CODEBUILD_RESOLVED_SOURCE_VERSION:-$(git rev-parse HEAD)}"
      - export HEAD_MESSAGE="$(git log -1 --pretty=%B || true)"
      - echo "target_sha=$TARGET_SHA"
      - |
        if [[ "$HEAD_MESSAGE" == *"[skip ci]"* ]]; then
          echo "Skipping publish because commit message contains [skip ci]."
          touch .skip-publish
        fi
  build:
    commands:
      - |
        set -euo pipefail
        if [[ -f .skip-publish ]]; then
          echo "Publish skipped; not invoking Lambda or website pipeline."
          exit 0
        fi
        python3 tools/extra_texts/validate_catalog.py --all
        python3 tools/lint_psalm_numbering.py --strict
        python3 tools/validate_reader_corpus.py --quiet --malformed-yaml error
        export TARGET_SHA="${CODEBUILD_RESOLVED_SOURCE_VERSION:-$(git rev-parse HEAD)}"
        aws lambda invoke \
          --region "$AWS_REGION" \
          --function-name "$LAMBDA_NAME" \
          --invocation-type Event \
          --cli-binary-format raw-in-base64-out \
          --payload '{"force":true}' \
          publish-response.json
        cat publish-response.json
      - |
        if [[ -f .skip-publish ]]; then
          echo "Manifest wait skipped; publish was skipped for [skip ci]."
          exit 0
        fi
        for i in $(seq 1 30); do
          BODY="$(curl -sL --max-time 15 "$CDN_MANIFEST_URL" || true)"
          if [[ -n "$BODY" ]]; then
            SHA="$(printf '%s' "$BODY" | jq -r '.commit_sha // ""' 2>/dev/null || echo "")"
            echo "attempt=$i manifest_sha=$SHA target_sha=$TARGET_SHA"
            if [[ "$SHA" == "$TARGET_SHA" ]]; then
              echo "CDN manifest matches pushed commit."
              TARGET_SHA="$TARGET_SHA" scripts/trigger_website_pob_sync.sh
              exit 0
            fi
            if [[ -n "$SHA" ]] && git fetch --depth=100 origin "$SHA" >/dev/null 2>&1 && git merge-base --is-ancestor "$TARGET_SHA" "$SHA"; then
              echo "CDN manifest is a descendant of pushed commit; using manifest SHA for website sync."
              TARGET_SHA="$SHA" scripts/trigger_website_pob_sync.sh
              exit 0
            fi
          else
            echo "attempt=$i manifest unavailable"
          fi
          sleep 10
        done
        echo "CDN manifest did not reach $TARGET_SHA within the wait window." >&2
        exit 1
  post_build:
    commands:
      - echo "POB publish CodeBuild finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
