    text: 또는 ‘그 어떤 용사도 손을 쓸 수 없었습니다.’ ‘자기 손을 찾지 못했다’는 무력하여 행동할 수 없었다는 뜻의 히브리어 관용 표현입니다.
    reason: lexical_alternative
