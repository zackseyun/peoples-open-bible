base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/084.yaml
  text: Jesus said[a], "On the day you see your likeness, you rejoice. But whenever you see your images that came into being before you, which neither die nor become manifest—how much will you bear!"
  footnotes:
  - marker: a
    text: The Coptic uses the Greek loanword εἰκών (eikōn). The text contrasts the mortal 'likeness' (ⲉⲓⲛⲉ) with the pre-existent, immortal 'images' (ϩⲓⲕⲱⲛ).
    reason: theological_note
    anchor_ref: images
  - marker: b
    text: The Coptic ⲛ̄ⲧⲁϩϣⲱⲡⲉ uses a regional variant ϩ for the third-person plural pronoun ⲩ (ⲛⲧⲁ-ⲩ-ϣⲱⲡⲉ).
    reason: dialect_note
    anchor_ref: came into being
  - marker: c
    text: The Coptic ⲙⲁⲩⲙⲟⲩ and ⲙⲁⲩⲟⲩⲱⲛϩ use the prefix ⲙⲁ-, a regional variant of the negative habitual ⲙⲉⲣⲉ-.
    reason: dialect_note
    anchor_ref: neither die nor become manifest
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “여러분이 자신의 닮은 모습을 보는 날에는 기뻐합니다. 그러나 여러분보다 먼저 생겨난[b] 여러분의 상(像)들[a]을 보게 되면, 그 상들은 죽지도 않고 드러나지도 않는데[c], 여러분은 얼마나 감당하겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ϩⲓⲕⲱⲛ은 그리스어 εἰκών에서 온 차용어입니다. 앞의 ⲉⲓⲛⲉ(‘닮은 모습’)와 다른 낱말이므로, 여기서는 ‘상(像)’으로 구별하여 옮겼습니다.
    reason: 원문의 서로 다른 어휘를 구별하되 해석적 교리를 덧붙이지 않기 위해서입니다.
  - marker: b
    text: 사본의 ⲛ̄ⲧⲁϩϣⲱⲡⲉ에서 ϩ은 3인칭 복수 대명사 ⲩ의 지역형입니다. 따라서 ‘그것들이 생겨났다’라는 뜻입니다.
    reason: 사본의 방언적 형태가 복수 주어를 나타냄을 설명하기 위해서입니다.
  - marker: c
    text: 사본의 ⲙⲁⲩⲙⲟⲩ와 ⲙⲁⲩⲟⲩⲱⲛϩ에서 ⲙⲁ-는 부정 습관상 접두사 ⲙⲉⲣⲉ-의 지역형입니다.
    reason: ‘죽지도 않고 드러나지도 않는다’라는 반복적 부정의 문법 형태를 설명하기 위해서입니다.
lexical_decisions:
- source_word: ⲉⲓⲛⲉ
  english_pob_choice: likeness
  chosen_korean: 형상
  alternatives_korean:
  - 모습
  - 닮은꼴
  - 유사상
  lexicon: Crum 78a
  rationale: 대조되는 항목인 ϩⲓⲕⲱⲛ과 구별되도록, 눈에 보이는 현재의 자기 모습이라는 뜻을 살리면서도 문어체에 자연스러운 ‘형상’을 택했습니다.
- source_word: ϩⲓⲕⲱⲛ
  english_pob_choice: images
  chosen_korean: 이미지들
  alternatives_korean:
  - 형상들
  - 상들
  lexicon: BDAG 288; Crum 661b
  rationale: 본문이 그리스어 차용어 εἰκών 계열의 표현을 쓰며, POB의 신학적 대비(유한한 likeness vs 선재하는 images)를 유지해야 하므로 외래어 ‘이미지들’로 차이를 드러냈습니다.
- source_word: ϣⲱⲡⲉ
  english_pob_choice: came into being
  chosen_korean: 생겨난
  alternatives_korean:
  - 되어진
  - 존재하게 된
  - 창조된
  lexicon: Crum 583b
  rationale: 선재 이전의 발생을 가리키는 동사이므로, 존재의 기원과 생성성을 함께 드러내는 ‘생겨난’이 가장 간결합니다.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  english_pob_choice: become manifest
  chosen_korean: 드러나다
  alternatives_korean:
  - 나타나다
  - 현현하다
  lexicon: Crum 485b
  rationale: 숨겨짐의 반대인 ‘드러남’의 의미를 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: ϥⲓ ϩⲁ
  english_pob_choice: bear
  chosen_korean: 견디다
  alternatives_korean:
  - 감당하다
  - 짊어지다
  - 참다
  lexicon: Crum 621a
  rationale: 문맥상 무게를 ‘짊어짐’보다 역경을 ‘견딤’이 더 적절하므로, 감정적·육체적 감내를 모두 포괄하는 ‘견디다’로 옮겼습니다.
theological_decisions:
- issue: ‘likeness’와 ‘images’의 대조 보존
  chosen_reading: ‘형상’과 ‘이미지들’로 서로 다른 두 범주의 대조를 한국어에서도 분명히 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘형상’으로 통일
  - 둘 다 ‘모습’으로 통일
  rationale: 본문의 핵심 긴장은 죽을 수 있는 자기의 형상과, 그보다 앞서 존재한 선재적 이미지들의 대비에 있으므로 용어를 통일하지 않고 구별을 유지해야 합니다.
  doctrine_reference: Gospel of Thomas saying-level theological contrast between mortal likeness and pre-existent images
