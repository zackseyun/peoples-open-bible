  from: Hold fast to instruction; do not let go. Guard her[a], for she is your life.
  to: Hold fast to instruction; do not let go. Guard it[a], for it is your life.
  rationale: The feminine suffixes and pronoun refer back to מוסר, but grammatical gender in Hebrew does not require English personal pronouns. With the nonpersonal English noun “instruction,” “it” is the natural equivalent and does not suppress a necessary personification. The lexical note remains useful.
