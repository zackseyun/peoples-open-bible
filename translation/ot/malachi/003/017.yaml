  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Gendered language in אִישׁ ... בְּנוֹ
  chosen_reading: a man ... his son
  alternative_readings:
  - someone ... his child
  rationale: The Hebrew uses explicitly masculine singular terms in a representative simile. Per doctrine, gender-accurate rendering is preferred over gender-neutral smoothing unless context requires otherwise.
