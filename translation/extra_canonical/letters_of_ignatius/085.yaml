    May all things therefore abound unto you in grace, for ye are worthy. Ye refreshed me in all things, and Jesus Christ shall refresh you. In my absence and in my presence ye cherished me. May God recompense you; for whose sake if ye endure all things, ye shall attain unto Him.'
translation:
  text: 'From now on, it is reasonable for us to wake up and be sober-minded while we [still] have time to reorient[r1] and turn to God. It is good to recognize God and the bishop. Whoever honors the bishop is honored by God; whoever does anything without the bishop’s knowledge serves the devil.


    Therefore, may all things abound to you in grace, for you are worthy. You refreshed me in every way, and Jesus Christ will refresh you. Both in my absence and in my presence, you cherished me. May God repay you; for whose sake, if you endure all things, you will attain to him.'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - Provisional rendering based on the supplied public-domain English witness.
  - Square brackets preserve the witness’s restoration signal.
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation. This reader text adapts the recorded English translation witness; it is not a verbatim quotation or a newly verified translation of the ancient-language text. The source witness is unchanged.
    reason: lexical_alternative
