translation:
  text: There the voice of thunder and the light of lightning are kept. There are kept the storehouses of hail,
    the storehouses of snow, the storehouses of mist, and the storehouses of rain and dew.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The actual photograph has the voice of thunder and the light of lightning; the first draft’s light/appearance
      wording was a miscopy. Actual primary1205 supports thunder,1066–1067 storehouses and978 keeping. Snow provisionally
      represents አስሐትያ: actual primary331 gives the frozen-precipitation range snow, hoarfrost, hail, freezing and
      ice, not mist. Actual primary1194–1195 gives ጊሜ first as nebula, with an explicit69:23 citation continuing
      at1195; mist follows that primary sense. A second sense is snow or a snowstorm. The earlier frost claim for
      this different noun is withdrawn; the broad frozen-precipitation range for አስሐትያ is a separate control. The
      precise meteorological distinction remains broad; the selected list is inside the22–24 editorial bracket.'
