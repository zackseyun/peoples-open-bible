id: JOB.36.13
reference: Job 36:13
source:
  edition: WLC
  text: וְֽ/חַנְפֵי לֵ֭ב יָשִׂ֣ימוּ אָ֑ף לֹ֥א יְ֝שַׁוְּע֗וּ כִּ֣י אֲסָרָֽ/ם־׃
translation:
  text: But the godless at heart harbor anger; they do not cry for help when he binds them[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “because he binds them.”
    reason: alternative_reading
lexical_decisions:
- source_word: חַנְפֵי לֵב
  chosen: the godless at heart
  alternatives:
  - the hypocrites in heart
  - the impious at heart
  - the godless of heart
  lexicon: HALOT
  rationale: This keeps the impious/godless sense while rendering the heart expression naturally.
- source_word: יָשִׂימוּ אָף
  chosen: harbor anger
  alternatives:
  - set anger
  - harbor anger
  - heap up wrath
  lexicon: HALOT
  rationale: Natural English for maintaining anger without imposing an accumulation image.
- source_word: לֹא יְשַׁוְּעוּ
  chosen: they do not cry for help
  alternatives:
  - they do not cry out
  - they do not call for help
  lexicon: HALOT
  rationale: שׁוע in the Piel commonly means to cry out for help. 'Cry for help' makes the implicit distress explicit in natural English without over-paraphrasing.
- source_word: כִּי
  chosen: when
  alternatives:
  - because
  - for
  lexicon: HALOT
  rationale: 'Although כִּי often means ''for'' or ''because,'' in this context a temporal sense fits the flow well: they do not cry for help at the time of affliction. This also coheres with the following verb of binding/restraint. The causal sense remains possible and is preserved in a footnote.'
- source_word: אֲסָרָם
  chosen: he binds them
  alternatives:
  - he imprisons them
  - he fetters them
  - he has bound them
  lexicon: HALOT
  rationale: אָסַר means to bind, tie, imprison, or fetter. 'He binds them' is the most direct and flexible rendering, matching the likely reference to God restraining them through affliction in the surrounding context. The subject is singular in Hebrew and is naturally understood as God from context.
