  - the Judeans
  rationale: The translation philosophy prioritizes original-language primacy and avoids importing interpretive narrowing into the main text unless the wording unambiguously requires it. Because Ἰουδαίοις can carry contextual nuance in John, the alternatives are preserved in a footnote rather than resolved in the main text.
