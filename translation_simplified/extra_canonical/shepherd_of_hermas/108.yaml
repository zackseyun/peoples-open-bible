  text: Ceteri vero, qui adhuc rotundi remanserunt neque aptati sunt in eam structuram, quia nondum acceperunt
    sigillum, repositi sunt suo loco; valde enim rotundi reperti sunt. 2. oportet autem circumcidi hoc
    saeculum ab illis et vanitates opum suarum, et tunc convenient in Dei regnum. necesse est enim eos
    intrare in dei regnum; hoc enim genus innocuum benedixit Dominus. ex hoc ergo genere non intercidet
    quisquam. etenim licet quis eorum temptatus a nequissimo diabolo aliquid deliquerit, cito recurret
    ad dominum suum. 3. felices vos iudico omnes, ego nuntius paenitentiae, quicumque estis innocentes
    sicut infantes, quoniam pars vestra bona est et honorata apud Deum. 4. dico autem omnibus vobis, quicumque
    sigillum hoc accepistis, simplicitatem habere neque offensarum memores esse neque in malitia vestra
    permanere aut in memoria offensarum amaritudinis, in unum quemque spiritum fieri et has malas scissuras
    permediare ac tollere a vobis, ut dominus pecorum gaudeat de his. 5. gaudebit autem, si omnia invenerit
    sana. sin autem aliqua ex his dissipata invenerit, vae erit pastoribus. 6. quodsi ipsi pastores dissipati
    reperti fuerint, quid respondebunt [pro] pecoribus his? numquid dicunt a pecore se vexatos? non credetur
    illis. incredibilis enim res est, pastorem pati posse a pecore; et magis punietur propter mendacium
    suum. et ego sum pastor, et validissime oportet me de vobis reddere rationem.
