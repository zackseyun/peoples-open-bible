  source_fidelity: 히브리어는 ‘그가 유다 자손에게 활을 가르치도록/가르치라고 말하였다’와 ‘보라, 그것이 야살의 책에 기록되어 있다’라고 합니다. 초안은 대체로 충실하지만, 주절의 주어를 보완하고 ‘그것은’보다 선행 내용을 자연스럽게 가리키는 ‘이는’을 쓰는 편이 더 정확하고 자연스럽습니다. קשת는 일반 명사 ‘활’일 수도, 이 애가의 표제일 수도 있으므로 본문에서는 해석을 고정하지 않고 각주로 남기는 것이 적절합니다.
  naturalness: ‘그리고 그는 … 하였습니다. 보십시오, 이는 … 기록되어 있습니다.’는 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽습니다. ‘유다 자손에게’가 ‘유다 자손들에게’보다 집합 명사구에 간결하게 어울립니다.
  terminology: ‘유다’, ‘활’, ‘야살의 책’은 적절합니다. ‘야살의 책’은 ספר הישר의 고유명사적 전통 표기를 유지하며, 현존하는 정경 문헌으로 오인하지 않도록 본문에 추가 설명은 넣지 않습니다.
