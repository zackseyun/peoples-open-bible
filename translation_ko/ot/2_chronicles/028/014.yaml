base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/014.yaml
  text: So the armed men left the captives and the plunder before the officials and all the assembly[a][b].
  footnotes:
  - marker: a
    text: Or 'the whole assembly.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the spoil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 무장한 사람들은 포로와 노략물을 관리들과 온 회중 앞에 남겨 두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָלוּץ
  english_pob_choice: the armed men
  chosen_korean: 무장한 사람들
  alternatives_korean:
  - 전투원들
  - 무장 병사들
  lexicon: WLC lexeme חלץ in context
  rationale: 문맥상 전투에 참여한 사람들을 가리키며, 영어 POB의 'armed men'에 맞추어 자연스럽고 직접적으로 옮겼습니다.
- source_word: הַשִּׁבְיָה
  english_pob_choice: the captives
  chosen_korean: 포로
  alternatives_korean:
  - 사로잡힌 자들
  - 포로들
  lexicon: WLC lexeme שבי
  rationale: 사로잡혀 끌려간 사람들을 뜻하므로 한국어 성서 문맥에서 가장 직역에 가까운 '포로'를 사용했습니다.
- source_word: הַבִּזָּה
  english_pob_choice: the plunder / the spoil
  chosen_korean: 노략물
  alternatives_korean:
  - 전리품
  - 약탈물
  lexicon: WLC lexeme ביזה
  rationale: 전투에서 빼앗은 물건을 뜻하므로, 영어 POB의 양가적 선택을 반영해 '노략물'로 옮겼습니다.
- source_word: הַקָּהָל
  english_pob_choice: the assembly / the whole assembly
  chosen_korean: 회중
  alternatives_korean:
  - 온 회중
  - 집회
  lexicon: WLC lexeme קהל
  rationale: 사람들이 모인 공동체를 가리키는 말이므로, POB가 문맥상 'assembly'로 번역한 점을 따라 '회중'을 기본으로 했습니다.
theological_decisions:
- issue: קהל의 공동체성 표현
  chosen_reading: '''온 회중''이 아니라 본문에는 ''회중''을 두고, 문맥상 전체성을 드러내는 수식은 넣지 않았습니다.'
  alternative_readings:
  - 온 회중
  - 온 집회
  rationale: 히브리어에 '전체'를 뜻하는 표지가 명시되지는 않으므로, 영어 POB의 각주 가능성을 존중하되 본문은 과잉해석 없이 간결하게 유지했습니다.
  doctrine_reference: 본문 주해상 공동체 전체를 지칭하는 일반적 용례
