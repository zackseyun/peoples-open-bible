revisions:
- from: 그리고 그 일이 삼 일 끝에 일어났습니다. 그들이 그들과 언약을 맺은 뒤에, 그들이 자기들에게 가까이 있으며 자기들 가운데 살고 있다는 것을 들었습니다.
  to: 그들이 그들과 언약을 맺은 지 사흘이 지난 뒤, 그들이 자기들에게 가까이 있고 자기들 가운데 살고 있다는 것을 들었습니다.
  rationale: 서사 도입 공식을 한국어의 자연스러운 시간 부사절로 통합하여 원문의 문장 구조를 회복했습니다. 대명사의 집단 지시는 원문처럼 일반적으로 유지하고, ‘가까이 있고’와 ‘가운데 살고 있다’의 병렬 관계를 보존했습니다.
  reviewer_model: gpt-5.6-terra
