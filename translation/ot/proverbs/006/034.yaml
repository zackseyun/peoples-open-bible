  review_summary: The verbless clause קִנְאָה חֲמַת גָּבֶר is most naturally understood as “jealousy is the fury of a man/husband,” that is, jealousy arouses his fury. The current “jealousy is a man's fury” is formally close but unnatural and obscures the relationship between jealousy and wrath. In this immediate context גָּבֶר is the wronged husband, so naming him preserves the discourse referent without inventing an agent.
