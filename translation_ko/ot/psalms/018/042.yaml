  lexicon: מוֹשִׁיעַ
  rationale: POB의 ‘savior’를 따라 ‘구원자’로 두어 구원 행위의 주체 부재를 직설적으로 반영합니다.
- source_word: עַל יְהוָה
  english_pob_choice: to the LORD
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: יהוה
  rationale: 원문 고유명 יהוה를 프로젝트 기본값인 ‘야훼’로 옮기고, 전치사 עַל은 간청의 방향을 자연스럽게 나타내는 여격으로 처리했습니다.
- source_word: וְלֹא עָנָם
  english_pob_choice: but he did not answer them
  chosen_korean: 그러나 그분은 그들에게 응답하지 않으셨습니다
  alternatives_korean:
  - 그러나 그분은 그들에게 대답하지 않으셨습니다
  - 그들에게 응답하지 않으셨습니다
  lexicon: ענה
  rationale: 시편의 응답-불응 패턴을 살려 ‘응답하다’를 택했고, 하나님 직접 지칭에는 존대형을 사용했습니다.
theological_decisions:
