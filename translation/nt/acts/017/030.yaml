id: ACT.17.30
reference: Acts 17:30
source:
  edition: SBLGNT
  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
translation:
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[c][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'having overlooked' or 'passed over.' The sense is that God formerly bore with these times of ignorance rather than that he approved them.
    reason: lexical_alternative
  - marker: b
    text: Greek 'men' (anthrōpois), used here in a generic sense for human beings; hence 'people.'
    reason: lexical_alternative
  - marker: c
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους
  chosen: Therefore, although ... the times
  alternatives:
  - So then ... the times
  - Therefore ... the periods
  lexicon: BDAG
  rationale: τοὺς ... χρόνους is the object of ὑπεριδών, with μὲν οὖν marking a transitional, mildly contrastive setup to τὰ νῦν. 'Therefore, although' brings the discourse movement into natural English while preserving the contrast between former times and the present.
- source_word: τῆς ἀγνοίας
  chosen: of ignorance
  alternatives:
  - of not knowing
  - of ignorance about God
  lexicon: BDAG
  rationale: ἄγνοια is best rendered 'ignorance' here, referring to prior lack of knowledge of God among the nations in Paul's argument. The more expansive 'ignorance about God' is interpretively true in context but adds words not present in the Greek.
- source_word: ὑπεριδὼν
  lemma: ὑπεροράω
  chosen: overlooked
  alternatives:
  - having overlooked
  - passed over
  - disregarded
  lexicon: BDAG
  rationale: Aorist participle from ὑπεροράω conveys God's prior forbearance toward those times. 'Overlooked' is idiomatic and standard without implying moral approval. 'Passed over' is possible but can suggest a more technical theological category not demanded here.
- source_word: ὁ θεὸς
  chosen: God
  lexicon: BDAG
  rationale: Straightforward nominative subject.
- source_word: τὰ νῦν
  chosen: he now
  alternatives:
  - but now
  - at the present time he
  lexicon: BDAG
  rationale: The idiom marks the present situation in contrast to former times. English requires integration with the finite verb; 'he now' preserves the temporal contrast cleanly. The adversative force is already carried by 'although' earlier.
- source_word: παραγγέλλει
  chosen: commands
  alternatives:
  - declares
  - orders
  - instructs
  lexicon: BDAG
  rationale: παραγγέλλω commonly means to command or give orders/instructions. 'Commands' best preserves the force of divine imperative in this context.
- source_word: τοῖς ἀνθρώποις
  chosen: people
  alternatives:
  - men
  - human beings
  lexicon: BDAG
  rationale: Though grammatically masculine, ἄνθρωποι here is generic for humanity. 'People' accurately conveys the representative sense in natural English without narrowing to males.
- source_word: πάντας
  chosen: all
  alternatives:
  - everyone
  lexicon: BDAG
  rationale: Accusative complement with the infinitive, emphasizing universality. 'All' works naturally with 'people everywhere'.
- source_word: πανταχοῦ
  chosen: everywhere
  alternatives:
  - in every place
  lexicon: BDAG
  rationale: πανταχοῦ is an adverb of place meaning 'everywhere.' It underscores the universal scope of the command.
- source_word: μετανοεῖν
  chosen: to repent
  alternatives:
  - to reorient toward God
  - to change their thinking
  - to change their minds
  - to turn in repentance
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Restore the command to repent for all people everywhere; retain its urgency without an added lexical destination. Contextual editorial assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
