  from: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
  to: But the magicians of Egypt did the same by their secret arts. Pharaoh’s heart became hard, and he did not listen to Moses and Aaron, just as Yahweh had spoken.
  rationale: The earlier theological decision sought to avoid assigning an agent to the hardening; the intransitive became hard preserves that gain more accurately than the passive. The lexical notes also identify Moses and Aaron as the referents of them, which I now state explicitly.
