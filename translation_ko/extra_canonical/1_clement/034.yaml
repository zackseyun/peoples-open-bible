base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034.yaml
  text: 'The good worker receives with boldness the bread of his labor, but the sluggish and negligent man cannot look his employer in the eye.


    Therefore we must be eager for doing good, for from him are all things. For he says beforehand to us, “Behold, the Lord, and his reward is before his face, to repay each one according to his work.” Therefore he urges us, who believe on him with our whole heart, not to be idle or negligent in any good work.


    Let our boasting and our boldness be in him. Let us submit ourselves to his will. Let us consider the whole multitude of his angels, how they stand by and minister to his will. For the Scripture says, “Ten thousand times ten thousand stood by him, and thousands of thousands ministered to him,” and they cried out, “Holy, holy, holy is the Lord Sabaoth; all creation is full of his glory.”


    So then, let us also, gathered together in concord in our conscience, cry out to him earnestly as from one mouth, so that we may become sharers in his great and glorious promises. For he says, “Eye has not seen, and ear has not heard, and it has not arisen upon the heart of man, the things that he prepared for those who wait for him.”'
translation:
  language: ko
  text: '좋은 일꾼은 자기 수고의 빵을 담대하게 받지만, 게으르고 나태한 사람은 자기 고용주의 눈을 마주보지 못합니다.


    그러므로 우리는 선한 일에 열심을 내야 합니다. 만물이 그에게서 나왔기 때문입니다. 그가 우리에게 미리 이렇게 말씀하십니다. 「보라, 주께서 오시며, 그의 상이 그의 얼굴 앞에 있어 각 사람에게 그의 행위대로 갚으시리라.」 그러므로 그는 온 마음으로 그를 믿는 우리에게, 어떤 선한 일에도 나태하거나 게을러지지 말라고 권면하십니다.


    우리의 자랑과 담대함은 그 안에 있게 합시다. 그의 뜻에 우리 자신을 복종합시다. 그의 모든 천사들의 큰 무리를 생각해 봅시다. 그들이 어떻게 그의 뜻을 따라 서서 섬기는지 말입니다. 성경이 말합니다. 「만만이 그에게 서 있었고, 천천이 천천이 그를 섬겼으며, 그들은 외쳤습니다. ‘거룩하고, 거룩하고, 거룩하신 만군의 주여, 온 피조물이 그의 영광으로 가득합니다.’」


    그러므로 우리도 양심 안에서 한마음으로 함께 모여, 한 입으로부터 나온 듯 간절히 그에게 외쳐, 그의 크고 영광스러운 약속의 참여자들이 되게 해 달라고 해야 합니다. 성경이 말하기를 「눈은 보지 못했고, 귀는 듣지 못했으며, 사람의 마음에 오르지 못한 것들—그를 기다리는 자들을 위하여 그가 예비하신 것들이다」라고 합니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐργάτης / ἔργον
  english_pob_choice: worker / labor
  chosen_korean: 일꾼 / 수고
  alternatives_korean:
  - 노동자 / 일
  - 일하는 사람 / 노동
  lexicon: ἐργάτης, ἔργον
  rationale: 영문 POB의 ‘worker, labor’를 따라 직역적이되, 문맥상 ‘빵’을 얻는 생업의 뉘앙스를 살리기 위해 ‘일꾼’, ‘수고’로 옮겼습니다.
- source_word: παρρησία
  english_pob_choice: boldness
  chosen_korean: 담대하게 / 담대함
  alternatives_korean:
  - 자유롭게
  - 확신을 가지고
  lexicon: παρρησία
  rationale: 공개적·두려움 없는 태도를 가리키므로, 본문에서는 동사적으로 ‘담대하게’, 뒤에서는 명사적으로 ‘담대함’을 사용했습니다.
- source_word: κύριος
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 주 하나님
  lexicon: κύριος
  rationale: 인용문에서 직접 주어로 쓰인 κύριος를 자연스럽게 ‘주’로 옮겨, 성경 인용의 어조를 유지했습니다.
- source_word: ἄγγελοι / λειτουργοῦσιν
  english_pob_choice: angels / minister
  chosen_korean: 천사들 / 섬기다
  alternatives_korean:
  - 사자들 / 봉사하다
  - 천사들 / 수종들다
  lexicon: ἄγγελοι, λειτουργέω
  rationale: 천상의 존재를 가리키는 기본 의미를 살려 ‘천사들’로 두고, 공적 섬김의 동사를 ‘섬기다’로 옮겼습니다.
theological_decisions:
- issue: 원문 인용구의 ‘주’ 이해
  chosen_reading: 예언적/성경 인용 속 κύριος를 그대로 ‘주’로 옮겼습니다.
  alternative_readings:
  - 야훼로 옮겨 구약적 신명 참조를 드러내기
  - 주님으로 높임을 강화하기
  rationale: 이 단락은 1 Clement의 성경 인용 연쇄를 재현하는 문맥이므로, 본문 차원에서는 인용의 형식을 유지하는 것이 우선입니다. 필요한 구약 대응은 별도 인용 주석에서 추적할 수 있습니다.
  doctrine_reference: 성경 인용의 문맥 보존
