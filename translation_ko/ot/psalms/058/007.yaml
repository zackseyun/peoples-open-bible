  text: Let them melt away like water that runs off[a]; when he aims his arrows[b][c], let them be as though cut off.
  footnotes:
  - marker: a
    text: Or 'that flow away.' The Hebrew expression pictures water moving off and disappearing.
    reason: lexical_alternative
  - marker: b
    text: The final clause is textually and lexically difficult; alternatives include 'let them be blunted' or 'let them wither.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'his arrow' (singular); English may also render it collectively as 'his arrows.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 흘러가 버리는 물처럼 사라지게 하시며[a], 그가 화살을 겨눌 때 그의 화살이 꺾인 것처럼 되게 하소서.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “흘러가 버리는 물처럼.” 히브리어 표현은 물이 흘러가며 사라지는 모습을 그립니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “그의 화살”로 단수입니다. 시적·집합적 의미로 “그의 화살들”이라고 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 본문과 어휘가 난해합니다. “그것들이 무디어지게 하소서” 또는 “시들게 하소서”로 이해하기도 합니다.
    reason: alternative_reading
