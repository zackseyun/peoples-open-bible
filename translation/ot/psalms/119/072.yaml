id: PSA.119.72
reference: Psalms 119:72
source:
  edition: WLC
  text: טֽוֹב לִ֥/י תֽוֹרַת פִּ֑י/ךָ מֵ֝/אַלְפֵ֗י זָהָ֥ב וָ/כָֽסֶף־־׃
translation:
  text: The law from your mouth is better for me than thousands of pieces of gold and silver.
  philosophy: dynamic
lexical_decisions:
