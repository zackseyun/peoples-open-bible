  from: 'Then King Darius wrote to all the peoples[a], nations[b], and languages that dwell in all the earth: “May your peace abound.”'
  to: 'Then King Darius wrote to all peoples, nations, and language groups throughout the earth: “May your peace abound.'
  rationale: The lexical record identifies the triad as a comprehensive imperial address and rightly avoids restricting “all the earth” to an explicitly named kingdom. That breadth and the greeting of peace remain, while the people represented by “languages” are made explicit.
