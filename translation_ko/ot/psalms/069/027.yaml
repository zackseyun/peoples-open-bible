revisions:
- from: 그들이 주께서 치신 이를 박해하며, 주께서 상하게 하신 이들의 고통을 이야기합니다.[a]
  to: 그들의 죄악 위에 죄악을 더하시고,[a] 그들이 주의 의에 이르지 못하게 하소서.[b]
  rationale: 제시된 WLC의 절을 직접 번역하도록 전면 수정했습니다. תְּנָה는 하나님께 드리는 명령형 간구로 ‘더하시고’로, עָוֺן עַל עֲוֺנָם은 반복과 누적을 보존하여 ‘그들의 죄악 위에 죄악을’로 옮겼습니다. וְאַל יָבֹאוּ는 부정 기원으로 ‘이르지 못하게 하소서’로 번역했습니다. צִדְקָה의 의/정의/구원적 의로움의 범위는 본문과 각주를 통해 열어 두었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:09:46Z'
