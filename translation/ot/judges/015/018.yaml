- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Covenantal force of הָעֲרֵלִים
  chosen_reading: the uncircumcised
  alternative_readings:
  - the Philistines
  rationale: Samson's wording is not merely ethnic but covenantal, contrasting God's deliverance with the shame of falling into the power of those outside the covenant sign. The literal rendering preserves that theological tension without overexplaining it in the main text.
