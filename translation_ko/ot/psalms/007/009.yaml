  text: 악인들의 악이 끝나게 하시고 의인을 굳게 세워 주십시오. 마음과 콩팥을 살피시는 의로우신 하나님이시여.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 원문 고유명사 יְהוָה는 직역 대체어가 아니라 신명에 대한 음역이므로, 본문에서는 전통적 대치어인 ‘주님’보다 ‘야훼’를 사용해 이름 자체를 드러냅니다.
- source_word: יָדִין
  english_pob_choice: judges
  chosen_korean: 심판하십니다
  alternatives_korean:
  - 판단하십니다
  - 재판하십니다
  lexicon: HALOT
  rationale: 동사 דין은 법정적 심판을 뜻하므로, 시적 문맥에서 ‘심판하십니다’가 원문의 사법적 의미를 자연스럽게 드러냅니다.
- source_word: עַמִּים
  english_pob_choice: the peoples
  chosen_korean: 만민
  alternatives_korean:
  - 백성들
  - 여러 민족들
  lexicon: HALOT
  rationale: 복수명사 עַמִּים는 특정 민족보다 넓은 인간 집단 전체를 가리키므로, 한국어에서는 포괄성을 살리는 ‘만민’이 적절합니다.
- source_word: תֻמִּי
  english_pob_choice: integrity
  chosen_korean: 온전함
  alternatives_korean:
  - 정직함
  - 무흠함
  - 성실함
  lexicon: HALOT
  rationale: תֹּם/תֻּם은 도덕적·인격적 완전성을 가리키지만 무결함을 과도하게 단정하지 않도록, 현대 한국어에서 자연스러운 ‘온전함’을 선택했습니다.
theological_decisions:
- issue: 시편 화자의 자기의/온전함 진술을 죄 없는 절대적 무결성으로 완화할지 여부
  chosen_reading: 본문의 자기 진술을 그대로 유지하되, ‘온전함’으로 옮겨 절대적 무죄 주장처럼 들리지 않게 했습니다.
  alternative_readings:
  - ‘무죄함’ 또는 ‘결백함’으로 완화
  - ‘억울함/정당한 사정’으로 의역
  rationale: 히브리어는 분명히 ‘내 의’와 ‘내 온전함’을 말하므로, 본문이 가진 긴장을 보존하는 것이 우선입니다. 동시에 한국어 표현은 도덕적 완전무결성의 과잉 해석을 피하도록 조정했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
