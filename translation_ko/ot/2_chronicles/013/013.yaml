  naturalness: '"매복한 부대를 돌아서"는 여로보암 자신이 부대를 지나 돌아선 것처럼도 읽혀 한국어 문장 구조상 다소 어색합니다. "매복대를 돌려 ... 오게 하였습니다"가 자연스럽고 원문의 행위 주체와 사역 관계를 분명히 합니다.'
