  to: 제 영혼은 기름진 음식과 풍성한 음식으로 배부른 듯 만족하며[a], 제 입은 환호하는 입술로 주님을 찬양합니다.
  rationale: 주어진 WLC 본문을 직접 반영하도록 초안을 시편 63:5의 내용으로 교체했습니다. כְּמוֹ는 ‘…듯’으로, תִּשְׂבַּע는 시적 현재로 ‘만족하며’로 옮겼습니다. שִׂפְתֵי רְנָנוֹת의 문자적 입술 이미지는 ‘환호하는 입술’로 보존했습니다. 찬양의 목적어는 히브리어에 생략되어 있으나 시편의 즉각적인 하나님 호칭 문맥에 따라 ‘주님’으로 보충했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:09:13Z'
