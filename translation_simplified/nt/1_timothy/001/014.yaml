translation:
  language: en
  text: But our Lord’s grace overflowed even more, along with faith and love that are in Christ Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the grace of our Lord
  simplified_phrase: our Lord’s grace
  preserved_meaning: The grace belongs to and comes from the Lord.
  reasoning_layer_used: POB lexical decisions for χάρις and κυρίου
  rationale: The possessive form is shorter and more natural while retaining grace and the title Lord.
- pob_phrase: overflowed all the more
  simplified_phrase: overflowed even more
  preserved_meaning: The Lord’s grace was exceedingly abundant in contrast with Paul’s earlier sin and unbelief.
  reasoning_layer_used: POB lexical decision for ὑπερεπλεόνασεν and contextual decision for δέ
  rationale: The concrete overflow image and intensified contrast remain clear without the awkward phrase “all the more.”
- pob_phrase: with faith and love that are in Messiah Jesus
  simplified_phrase: along with faith and love that are in Messiah Jesus
  preserved_meaning: Faith and love accompany the overflowing grace without defining a causal or temporal sequence.
  reasoning_layer_used: POB theological decision on the relation of grace to faith and love
  rationale: “Along with” expresses accompaniment naturally while preserving the broad “in Messiah Jesus” relation.
translation_notes:
  risk_flags:
  - risk: “Our Lord’s grace” can express possession as well as source.
    mitigation: Both senses fit the genitive, and the wording does not alter the Lord’s relation to grace.
  - risk: “Messiah Jesus” may be unfamiliar to some readers.
    mitigation: The policy-required title is retained, with “Christ Jesus” supplied in the footnote.
