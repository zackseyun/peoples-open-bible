lexical_decisions:
- source_word: μεγιστᾶνες
  chosen: nobles
  alternatives:
  - magnates
  - great men
  - officials
  lexicon: LSJ
  rationale: The term denotes high-ranking men at court. 'Nobles' is natural modern English and preserves their elite status better than the less idiomatic 'magnates' or the broader 'officials'.
- source_word: ἔβλεπον
  chosen: looked
  alternatives:
  - were looking
  - gazed
  lexicon: LSJ
  rationale: Imperfect narrative sense is adequately conveyed in English by the simple past here. 'Looked' fits the reciprocal phrase that follows without over-translating aspect.
- source_word: εἷς τὸν ἕτερον
  chosen: at one another
  alternatives:
  - each at the other
  - one at the other
  lexicon: LSJ
  rationale: This reciprocal idiom is best rendered with standard English 'one another.' The preposition 'at' is supplied naturally in English with 'looked.'
- source_word: ἤρξατο λαλεῖν
  chosen: began to speak
  alternatives:
  - began speaking
  - started to speak
  lexicon: LSJ
  rationale: A straightforward rendering of the ingressive construction. 'Began to speak' preserves the narrative transition cleanly.
- source_word: περὶ τῆς ἀληθείας
  chosen: about the truth
  alternatives:
  - concerning the truth
  - about truth
  lexicon: LSJ
  rationale: The article supports a definite rendering, and in context the debate concerns 'the truth' as the subject under discussion, not merely truth in an abstract sense.
