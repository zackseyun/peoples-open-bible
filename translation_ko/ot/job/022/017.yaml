  to: 하나님께 「우리에게서 떠나십시오」라고 말하며, 「전능하신 분이 그들에게 무슨 일을 하실 수 있겠습니까?」라고 말하던 자들입니다.
  rationale: 마소라 본문의 3인칭 복수 여격 לָמוֹ를 ‘그들에게’로 보존하되, יפעל의 작용 대상임이 자연스럽게 드러나도록 ‘그들에게 무슨 일을 하실 수 있겠습니까’로 고쳤습니다. 또한 반복된 ‘말하다’를 원문의 관계절 흐름에 맞게 정리했습니다.
  reviewer_model: gpt-5.6-terra
