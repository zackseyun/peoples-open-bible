  terminology: ‘산당’은 בָּמוֹת의 확립된 성서 용어이며, ‘아사’와 ‘이스라엘’의 표기도 적절합니다. ‘마음’과 ‘온전했습니다’의 조합은 히브리어의 인격적·내적 평가 표현을 자연스럽게 보존합니다.
