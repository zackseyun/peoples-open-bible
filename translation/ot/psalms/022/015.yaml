  from: My strength is dried up like a potsherd[a], and my tongue sticks to my jaws; you lay me in the dust of death.
  to: My strength is dried up like a potsherd, and my tongue sticks to my jaws[a]; you lay me in the dust of death.
  rationale: The mouth-part note should follow “jaws,” the uncertain term it annotates. The proposed “pottery” is less vivid and less idiomatic in this simile. Although חֶרֶשׂ can have a broader earthenware sense, “potsherd” is a well-established and contextually apt rendering and does not constitute untenable false precision here.
