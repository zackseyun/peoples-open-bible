translation:
  text: They were two hundred in all, and they descended upon Ardis, which is the summit of Mount Hermon.[a] They called it Mount Hermon because they swore there and bound themselves together under a ban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Charles encloses the descent clause in daggers, marking a textual crux, and prints an asterisk before “two.” This translation follows his printed text without attempting a new reconstruction.
    reason: textual_variant
  - marker: b
    text: “Ban” here means a binding curse associated with their oath. The passage connects Hermon’s naming with their oath and curse. Charles also prints an asterisk before the word “mountain” in this naming clause.
    reason: textual_variant
lexical_decisions:
- source_word: ክልኤ፡ ምእት
  chosen: two hundred
  rationale: Preserves the number stated in the witness.
- source_word: አርዲስ
  chosen: Ardis
  rationale: Retains the place-name in the supplied Ge'ez rather than substituting a chronological reading.
- source_word: ድማኁ
  chosen: summit
  alternatives:
  - top
  - head
  rationale: Conveys the mountain imagery in natural English.
- source_word: አርሞን
  chosen: Hermon
  alternatives:
  - Armon
  rationale: Uses the conventional English form of the mountain's name.
- source_word: አውገዙ፡ በበይናቲሆሙ
  chosen: bound themselves together under a ban
  alternatives:
  - placed themselves under a mutual curse
  - pronounced a ban among themselves
  rationale: Preserves the group's reciprocal, self-binding act without implying that God imposed the ban.
