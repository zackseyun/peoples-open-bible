  meaning_decisions:
  - source_phrase: אִישׁ בַּעַר
    prior_rendering: A brutish man
    new_rendering: A senseless person
    rationale: In contemporary English, “brutish” commonly suggests cruelty or violence, whereas the Hebrew emphasizes animal-like lack of discernment. “Person” expresses the representative reference without suggesting that the statement concerns only men; the animal comparison remains in the note.
  - source_phrase: לֹא יֵדָע ... לֹא יָבִין אֶת זֹאת
    prior_rendering: does not know, and a fool does not understand this
    new_rendering: does not know this; a fool does not understand it
    rationale: Making the shared object explicit in both clauses gives natural English parallelism and clearly introduces the explanation that follows.
