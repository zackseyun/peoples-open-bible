translation:
  text: She said, "Many indeed will hear; and, having heard, some of them will rejoice, but some will weep. But even these, if they hear and reorient[a], they too will rejoice. Therefore listen to the parables of the tower, for I will reveal everything to you. And no longer cause me trouble about revelations, for these revelations have an end, for they have been completed. But you will not stop asking for revelations, for you are shameless."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
