    rationale: 히브리어 עֹדֵד(Oded)는 한국어로 ‘오뎃’으로 음역하는 것이 적절합니다. ‘오벳’은 원문 자음 ד(dalet)를 반영하지 못합니다.
  - severity: medium
    issue: ‘하늘에까지 닿는 분노로 죽였습니다’의 수식 범위
    rationale: עַד־לַשָּׁמַיִם הִגִּיעַ는 그들의 분노/격노가 하늘에까지 이르렀다는 술어 진술입니다. 현 번역은 ‘분노로’가 죽임의 방식만 수식하는 것으로 읽힐 수 있으므로, 별도 문장으로 옮겨 원문의 단언을 보존하는 것이 좋습니다.
