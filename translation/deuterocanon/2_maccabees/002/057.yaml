  text: τὸ μὲν ἐμβατείνειν καὶ περίπατον ποιεῖσθαι λόγῳ καὶ πολυπραγμονεῖν ἐν τοῖς κατὰ μέρος, τῷ τῆς ἱστορίας ἀρχηγενέτῃ καθῆκε·
