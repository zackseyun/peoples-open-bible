base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/009.yaml
  text: For know that if we devise any evil against these people, or grieve them in any way at all, we will have against us for vengeance in these matters, utterly without escape and forever, not a man but God Most High, the one who rules over all power. Farewell.
translation:
  language: ko
  text: 여러분은 알아 두십시오. 우리가 이들에게 어떤 악을 꾸미거나 조금이라도 그들을 괴롭게 한다면, 우리는 이 일들에 대한 보복으로 사람이 아니라 모든 권세를 다스리시는 지극히 높으신 하나님을 모든 면에서 결코 피할 수 없이 언제나 우리의 대적자로 맞게 될 것입니다. 안녕히 계십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακοτεχνήσωμεν πονηρόν
  english_pob_choice: devise any evil
  chosen_korean: 어떤 악한 꾀를 꾸미거나
  alternatives_korean:
  - 어떤 악을 행하거나
  - 어떤 악한 일을 꾸미거나
  lexicon: κακοτεχνέω / πονηρόν
  rationale: 행위 일반보다 ‘악한 꾀를 꾸미다’가 원문의 의도적 악모의 뉘앙스를 더 잘 드러내며, 뒤의 ‘그들을 괴롭게 한다’와 병렬도 자연스럽습니다.
- source_word: ἐπιλυπήσωμεν αὐτοὺς τὸ σύνολον
  english_pob_choice: grieve them in any way at all
  chosen_korean: 조금이라도 그들을 괴롭게 한다면
  alternatives_korean:
  - 전혀 그들을 슬프게 한다면
  - 조금이라도 그들을 슬프게 한다면
  lexicon: ἐπιλυπέω
  rationale: ‘슬프게 하다’보다 관계적·실질적 고통을 포괄하는 ‘괴롭게 하다’가 본문의 경고적 문맥에 더 적절합니다.
- source_word: τὸν πάσης δεσπόζοντα δυνάμεως θεὸν ὕψιστον
  english_pob_choice: God Most High, the one who rules over all power
  chosen_korean: 모든 권세를 다스리시는 지극히 높으신 하나님
  alternatives_korean:
  - 모든 능력을 주관하시는 지극히 높으신 하나님
  - 모든 권세를 지배하시는 지극히 높으신 하나님
  lexicon: δεσπόζω / θεὸς ὕψιστος
  rationale: ‘다스리시다’는 δεσπόζω의 주권성을 살리면서도 한국어에서 과도하게 폭력적인 인상을 줄이지 않고, ‘지극히 높으신 하나님’은 ὕψιστος의 표준적 대응입니다.
- source_word: ἀντικείμενον ἡμῖν
  english_pob_choice: against us
  chosen_korean: 우리에게 대적자로 두게 될 것입니다
  alternatives_korean:
  - 우리에게 대항하실 것입니다
  - 우리에게 맞서실 것입니다
  lexicon: ἀντίκειμαι
  rationale: 여기서는 단순한 위치 관계보다 ‘우리에게 대적하여 서 있음’의 법정·심판적 긴장이 강하므로 명시적으로 풀어 옮겼습니다.
theological_decisions:
- issue: 하나님을 심판의 대적자로 제시하는 표현
  chosen_reading: 본문의 위협은 사람이 아니라 하나님 자신이 그들에게 맞서 보복하신다는 경고로 유지했습니다.
  alternative_readings:
  - 하나님이 우리를 반대하실 것입니다
  - 하나님이 우리에게 불리하게 되실 것입니다
  rationale: 원문의 강한 경고를 완화하지 않고, ‘대적자’ 표현으로 심판적 대립을 드러내는 것이 서사 의도에 더 가깝습니다.
  doctrine_reference: 신명기적 보응 사상 / 심판 주권
