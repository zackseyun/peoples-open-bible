  text: Hold them guilty, O God; let them fall by their own plans[a]. Drive them away because of their many transgressions, for they have rebelled against you.
  footnotes:
  - marker: a
    text: Or “fall from their own counsels,” that is, be ruined by their own plans.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 그들에게 유죄를 선고해 주십시오[a]. 그들의 꾀로 그들이 넘어지게 하십시오. 그들의 죄가 많으니 그들을 내쫓아 주십시오[b]. 그들이 주님께 반역하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 유죄로 여기십시오.’ 히브리어 동사는 하나님께 그들을 유죄로 판정해 달라고 청하는 법정적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내쫓아 주십시오’는 ‘쫓아내다’, ‘추방하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
