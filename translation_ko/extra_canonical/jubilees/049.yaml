base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/049.yaml
  text: '1[2a]. Remember the command that the LORD commanded you concerning the Passover: that you should keep it at its appointed time, on the fourteenth day of the first month; that you should slaughter it before evening and that they should eat it.

    2. In the night, at the evening of the fifteenth, from the setting of the sun. For on this night the beginning of the feast came, and the beginning of rejoicing came. You were dwelling in Egypt, eating the Passover, while all the powers of Mastema were sent to strike all the firstborn in the land of Egypt, from the firstborn of Pharaoh to the firstborn of the captive maidservant who was in the mill-house, and upon the cattle. And this is the sign that the LORD gave them: in every house where they saw the blood of a year-old lamb on the doorposts, they should not enter that house to kill, but should pass over it so that all who were in the house might be saved[2b], because the sign of the blood was on its doorposts. And the powers of the LORD did everything just as the LORD commanded them, and they passed over all the sons of Israel, and no plague came upon them to destroy from among them any life, from livestock to man and even to dogs. And the plague in Egypt was very great, and there
    was no house in Egypt in which there was not one dead, and mourning and lamentation. But all Israel was dwelling while eating the flesh of the Passover and drinking wine and praising and blessing and giving thanks to the LORD, the God of their fathers, and they were ready to go out from under the yoke of Egypt and from the evil bondage. And you also, remember this day all the days of your life, and observe it from year to year all the days of your life, once each year, on its day, according to all its law; and do not move the day from day to day or from month to month. For it is an everlasting statute, and it is written and ordained on the heavenly tablets for all the children of Israel, that they should observe it in every year, year by year, on its day, once each year, throughout all their generations; and there is no end of days, for this is ordained forever. And the man who is clean and comes to observe it on its day, to bring an acceptable offering before the LORD and to eat and
    drink before the LORD on the day of its feast—if that man, being clean and near, neglects it because he did not bring the offering of the LORD at its appointed time, that man shall bear his sin. Therefore the children of Israel shall come and observe the Passover at its appointed day, on the fourteenth day of the first month, between the evenings, from the third part of the day to the third part of the night; for two parts of the day are given to the light, and a third part to the evening. This is what the LORD commanded you to observe in the middle of the evening. And it shall not be slaughtered during any time of the light except at the border of evening, and they shall eat it at the time of evening until the third part of the night; and whatever remains of all its flesh after the third part of the night they shall burn with fire. And they shall not eat it raw, nor shall they eat it boiled in water, but they shall eat it roasted with fire, with its head, with its inner parts, and with
    its feet they shall roast it with fire; and they shall not break any bone from it, for no bone of the children of Israel is to be crushed. Because of this the LORD commanded the children of Israel to observe the Passover at its appointed day, and no bone is to be broken from it, because it is a day of festival and a day commanded; and they are not to shift it from within the day to another day, or from month to month, but it is to be observed on the day of its feast. And you, command the children of Israel to observe the Passover in their days, in every year, once each year, on its appointed day; and it shall come as a memorial acceptable before the LORD, and no plague shall come upon them for slaughter or for smiting in that year when they observe the Passover

    16. at its appointed time, in every respect according to its command. And it shall not be lawful to eat it outside the sanctuary of the LORD, but opposite the sanctuary of the LORD, and all the assembly

    17. of the people of Israel shall observe it at its appointed time. And every man who has come on that day shall eat it in the sanctuary of your God before the LORD, from twenty years old and upward, because

    18. thus it is written and ordained that they should eat it in the sanctuary of the LORD. And when the children of Israel enter the land which they are to possess in the land of Canaan, and they set up the tent of the LORD in the midst of the land, in one of their tribes, until the sanctuary of the LORD is built in the land, they shall come and observe the Passover in the midst of the tent of the LORD, and they shall slaughter it before the LORD

    19. from year to year. And in the days when the house is built in the name of the LORD in the land of their inheritance, there they shall come and slaughter the Passover in the evening, at the going down of the sun,

    20. in the third part of the day. And they shall bring its blood to the threshold of the altar, and they shall place its fat on the fire that is upon the altar, and they shall eat its flesh roasted with fire in the court of the house

    21. that has been sanctified in the name of the LORD. And they shall not be able to observe the Passover in their cities, nor in any place except before the tent of the LORD, or before his house where his name dwells; and they shall not go astray after the LORD.

    22. And you, Moses, command the children of Israel to keep the ordinance of the Passover as it was commanded to you; tell them year by year, and day by day, and the feast of unleavened bread, that they should eat unleavened bread for seven days, that they should observe its feast, and that they should bring its offering day by day during those seven days of rejoicing

    23. before the LORD, upon the altar of your God. For this feast you observed with haste when you came out from Egypt until you entered the wilderness of Shur[23a][20a][16a][2d][2c], because at the shore of the sea you completed it.'
  footnotes:
  - marker: 2a
    text: 'The verse numbering in the source rows is irregular here: the long second row contains material corresponding to multiple conventional verse divisions before the text resumes at v. 16.'
    reason: segmentation_note
  - marker: 2b
    text: The phrase rendered 'firstborn of the captive maidservant who was in the mill-house' is textually difficult; some witnesses/traditions align more closely with Exodus's 'female slave behind the millstones.'
    reason: textual_variant
  - marker: 2c
    text: The clause 'and even to dogs' is difficult in context and may reflect a compressed or corrupt line in the transmitted text; the translation keeps the extant wording as literally as possible.
    reason: textual_variant
  - marker: 2d
    text: The wording about eating the Passover while 'drinking wine' is notable in Jubilees and should not be harmonized away to the Exodus account.
    reason: cross_reference
  - marker: 16a
    text: The phrase rendered 'opposite the sanctuary of the LORD' is somewhat uncertain; the sense is that the meal is to be eaten in relation to the central sanctuary, not in ordinary domestic space.
    reason: lexical_alternative
  - marker: 20a
    text: The expression translated 'to the threshold of the altar' is difficult; an alternative is 'to the base/foundation of the altar.'
    reason: lexical_alternative
  - marker: 23a
    text: The final clause likely means that the seven-day feast was completed at the sea-shore on the way to the wilderness of Shur; the syntax is compressed in the Ge'ez row.
    reason: segmentation_note
translation:
  language: ko
  text: '1. 유월절에 관하여 야훼께서 네게 명령하신 명령을 기억하십시오. 곧 정해진 때인 첫째 달 열넷째 날에 그것을 지키고, 저녁 전에 그것을 잡아 그들이 그것을 먹도록 하십시오.

    2. 밤, 곧 해가 진 뒤 열다섯째 날 저녁이었습니다. 그 밤에 절기가 시작되었고 즐거움도 시작되었습니다. 여러분은 이집트에 머물며 유월절을 먹고 있었고, 마스테마의 모든 세력이 이집트 땅의 모든 처음 난 것을 치도록 보내졌습니다. 바로의 처음 난 것부터 맷돌집에 있던 사로잡힌 여종의 처음 난 것까지, 또 가축까지였습니다. 주님께서 그들에게 주신 표는 이러했습니다. 문설주에 한 살 된 어린양의 피가 보이는 집에는 그들이 들어가 죽이지 말고 그 집을 지나쳐, 그 집 안에 있는 모든 사람이 구원을 받게 해야 했습니다. 피의 표가 그 집의 문설주에 있었기 때문입니다. 주님의 세력은 주님께서 명령하신 대로 모든 것을 행했습니다. 그들은 이스라엘의 모든 자손을 지나쳐 갔으며, 가축에서 사람에 이르기까지, 심지어 개에 이르기까지 그들 가운데 어떤 생명도 멸하려는 재앙이 닥치지 않았습니다. 이집트의 재앙은 매우 컸습니다. 이집트에는 죽은 사람이 없는 집이 하나도 없었고, 애곡과 통곡이 있었습니다. 그러나 온 이스라엘은 유월절 고기를 먹고 포도주를 마시며, 주님 곧 그들의 조상의 하나님을 찬양하고 찬송하며 감사드리고 있었습니다. 그들은 이집트의 멍에와 악한 종살이에서 벗어날 준비가 되어 있었습니다.


    여러분도 평생 이 날을 기억하고, 해마다 그 날에 그 모든 율법에 따라 매년 한 번씩 지키십시오. 그 날을 이 날에서 저 날로, 이 달에서 저 달로 옮기지 마십시오. 이것은 영원한 규례이며, 이스라엘의 모든 자손이 모든 세대에 걸쳐 해마다 그 날에 매년 한 번씩 지키도록 하늘의 돌판들에 기록되고 명령된 것입니다. 그 끝이 없으니, 이것은 영원히 정해진 규례입니다. 정결한 사람이 그 날에 와서 주님 앞에 받아들여질 제물을 드리고, 그 절기 날에 주님 앞에서 먹고 마시려 할 때, 그 사람이 정결하고 가까이 있음에도 정한 때에 주님의 제물을 드리지 않았다면, 그는 끊어질 것입니다. 그는 자기 죄를 짊어질 것입니다.


    그러므로 이스라엘 자손은 정해진 때에, 곧 첫째 달 열나흗날 두 저녁 사이, 낮의 중간부터 밤의 셋째 부분까지 유월절을 지켜야 합니다. 낮의 두 부분은 빛에 주어지고, 한 부분은 저녁에 속하기 때문입니다. 이것이 주님께서 여러분에게 저녁 한가운데 지키라고 명령하신 것입니다. 밝은 동안에는 저녁 때 외에는 그것을 잡아서는 안 되며, 저녁 때부터 밤의 셋째 부분까지 그것을 먹어야 합니다. 밤의 셋째 부분 뒤에 남은 고기는 모두 불에 태워야 합니다. 그것을 날것으로 먹어서도 안 되고 물에 삶아 먹어서도 안 되며, 불에 구워 먹어야 합니다. 머리와 내장과 발을 함께 불에 구워야 하며, 그것의 뼈를 하나도 꺾어서는 안 됩니다. 이스라엘 자손 가운데서는 어떤 뼈도 부서져서는 안 되기 때문입니다. 그러므로 주님께서는 이스라엘 자손에게 정해진 때에 유월절을 지키라고 명령하셨고, 그것에서 뼈를 하나도 꺾어서는 안 된다고 하셨습니다. 이는 그 날이 절기의 날이며 명령된 날이기 때문입니다. 그 날을 이 날에서 저 날로, 이 달에서 저 달로 옮겨서는 안 되며, 절기의 날에 지켜야 합니다. 여러분은 이스라엘 자손에게 명령하여, 해마다 정해진 때에 매년 한 번씩 유월절을 지키게 하십시오. 그러면 그것은 주님 앞에 기쁘게 받아들여질 기념이 될 것이며, 그들이 유월절을 지키는 그 해에는 죽이거나 치는 재앙이 그들에게 닥치지 않을 것입니다.

    16. 정해진 때에, 그 명령대로 모든 점에서 해야 합니다. 또한 그것을 야훼의 성소 밖에서 먹는 것은 허용되지 않으며, 오히려 야훼의 성소 앞에서 먹어야 합니다. 그리고 회중의 모든 백성은—

    17. 온 이스라엘은 정해진 때에 그것을 지켜야 합니다. 그리고 그 날에 오는 모든 사람, 곧 스무 살 이상인 사람은 너희 하나님의 성소의 집에서 주님 앞에 그것을 먹어야 합니다. 왜냐하면

    18. 이와 같이 그들이 그것을 주님의 성소에서 먹도록 기록되고 제정되었습니다. 이스라엘 자손이 차지하게 될 땅, 곧 가나안 땅에 들어가 그 땅 한가운데, 그들의 지파들 가운데 하나에 주님의 장막을 세우고, 주님의 성소가 그 땅에 세워질 때까지 그들이 와서 주님의 장막 한가운데에서 유월절을 지키며, 주님 앞에서 그것을 잡아야 합니다.

    19. 해마다. 그리고 야훼의 이름으로 그들의 기업의 땅에 성전이 세워지는 날들에는, 그들은 그곳으로 가서 저녁, 해가 질 무렵에 유월절 제물을 잡을 것입니다.

    20. 하루의 세 번째 부분에 그들은 그 피를 제단 밑에 가져오고, 그 기름을 제단 위에 있는 불에 올려놓으며, 그 고기를 불에 구워 집의 뜰에서 먹어야 합니다.

    21. 그것은 야훼의 이름으로 성별된 것입니다. 그들은 자기들의 도시에서나 다른 어느 곳에서나, 야훼의 장막 앞 또는 그분이 거하시는 집 앞에서가 아니면 유월절을 지킬 수 없습니다.

    22. 그리고 너, 모세여, 이스라엘 자손에게 네게 명령된 대로 유월절 규례를 지키라고 명하여라. 해마다, 날마다, 또 무교절에 관하여 그들에게 일러라. 그들이 이레 동안 무교병을 먹고 그 절기를 지키며, 그 기쁨의 이레 동안 날마다 제물을 드리게 하여라.

    23. 주님 앞에서, 여러분의 하나님 제단 위에서. 이는 여러분이 이집트에서 나와 수르 광야에 들어갈 때까지 이 절기를 서둘러 지켰고, 바닷가에서 그 절기를 마쳤기 때문입니다.'
