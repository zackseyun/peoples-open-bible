id: PRO.27.14
reference: Proverbs 27:14
source:
  edition: WLC
  text: מְבָ֘רֵ֤ךְ רֵעֵ֨/הוּ בְּ/ק֣וֹל גָּ֭דוֹל בַּ/בֹּ֣קֶר הַשְׁכֵּ֑ים קְ֝לָלָ֗ה תֵּחָ֥שֶׁב לֽ/וֹ׀׃
translation:
  text: A loud blessing to a neighbor early in the morning will be taken as a curse[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “it will be reckoned to him as a curse”; “him” may refer to the giver or the recipient of the blessing.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבָרֵךְ
  chosen: blesses
  alternatives:
  - greets with blessing
  - praises
  lexicon: HALOT
  rationale: From ברך in the Piel participial form, here denoting speaking a blessing over or to someone. 'Blesses' preserves the lexical sense without narrowing it to mere greeting, though the context suggests an overly effusive morning salutation.
- source_word: רֵעֵהוּ
  chosen: his neighbor
  alternatives:
  - his friend
  - his companion
  lexicon: HALOT
  rationale: רֵעַ can mean friend, companion, or neighbor. 'Neighbor' fits wisdom-literature usage broadly and preserves the interpersonal but not necessarily intimate relationship.
- source_word: בְּקוֹל גָּדוֹל
  chosen: loudly
  alternatives:
  - loudly
  - in a great voice
  lexicon: HALOT
  rationale: This is a natural English adverbial rendering of the manner phrase.
- source_word: בַּבֹּקֶר הַשְׁכֵּים
  chosen: early in the morning
  alternatives:
  - early in the morning
  - at daybreak, rising early
  lexicon: HALOT
  rationale: This naturally conveys the explicitly early timing without the dangling English participle.
- source_word: קְלָלָה
  chosen: a curse
  alternatives:
  - cursing
  - an insult
  lexicon: HALOT
  rationale: 'The noun plainly means ''curse.'' In context the point is ironic reversal: what is intended or presented as blessing is socially received as its opposite.'
- source_word: תֵּחָשֶׁב לוֹ
  chosen: it will be counted to him as
  alternatives:
  - it will be regarded by him as
  - it will be reckoned to him as
  lexicon: HALOT
  rationale: From חשב in the Niphal, 'to be reckoned/accounted/regarded.' 'Counted to him as' preserves the passive sense and leaves open whether the reckoning is by observers or in effect toward him.
