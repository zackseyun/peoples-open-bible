id: PSA.59.10
reference: Psalms 59:10
source:
  edition: WLC
  text: אֱלֹהֵ֣י חסד/ו יְקַדְּמֵ֑/נִי אֱ֝לֹהִ֗ים יַרְאֵ֥/נִי בְ/שֹׁרְרָֽ/י׃
translation:
  text: My God, in his steadfast love[a], will go before me; God will let me look in triumph on my enemies[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The written Hebrew has “his steadfast love”; the traditional reading has “my steadfast love,” understood as the steadfast love God shows the psalmist.
    reason: textual_variant
  - marker: b
    text: Literally, “will let me look on my enemies,” an idiom for witnessing their defeat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  chosen: My God
  alternatives:
  - God of
  - my God of
  - The God of
  lexicon: HALOT
  rationale: The Masoretic reading tradition supports the first-person relation 'my God,' which fits the speaker's 'me' in the same clause.
- source_word: חַסְדּוֹ
  chosen: in his steadfast love
  alternatives:
  - his mercy
  - his loyal love
  - his covenant faithfulness
  - his steadfast love
  lexicon: HALOT
  rationale: The written suffix is retained as God's own steadfast love and made adverbial so it has a clear antecedent in English.
- source_word: יְקַדְּמֵנִי
  chosen: will go before me
  alternatives:
  - will meet me
  - will come before me
  - will precede me
  lexicon: HALOT
  rationale: From קדם in the Piel, with sense of coming before, meeting, or going ahead. In context of divine aid anticipated in advance, 'will go before me' best captures proactive help while remaining faithful to the verb's spatial/temporal force.
- source_word: אֱלֹהִים
  chosen: God
  lexicon: HALOT
  rationale: Absolute form repeated for emphasis. Rendered simply as 'God' rather than a pronoun to preserve the Hebrew repetition.
- source_word: יַרְאֵנִי
  chosen: will let me look on
  alternatives:
  - will show me
  - will cause me to see
  - will let me see
  lexicon: HALOT
  rationale: 'Hiphil of ראה is causative: ''cause to see'' or ''let see.'' In this hostile context, the idiom often implies seeing one''s desire fulfilled against enemies. ''Will let me look on'' preserves the causative nuance without importing ''triumph'' explicitly.'
- source_word: בְשֹׁרְרָי
  chosen: my enemies
  alternatives:
  - those hostile to me
  - my foes
  - my watchers
  lexicon: HALOT
  rationale: From שׁורר, denoting hostile adversaries. 'My enemies' is the clearest natural English equivalent. A more literal nuance such as 'those lying in wait for me' is possible in some contexts, but here the broader adversarial sense fits best.
