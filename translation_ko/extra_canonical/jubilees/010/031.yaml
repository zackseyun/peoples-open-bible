    issue: The footnote anchor is placed after ‘거하지 마십시오.’
    rationale: The footnote supplies an alternate rendering for the opening repeated phrase and its ensuing clauses, not for the final prohibition. Its marker should therefore occur at the opening phrase.
  - severity: low
    issue: ‘영원히 뽑힐 것입니다’ lacks the explicit root image of uprooting and is less natural Korean.
    rationale: ‘영원히 뿌리 뽑힐 것입니다’ preserves the image and gives a standard formal Korean expression.
