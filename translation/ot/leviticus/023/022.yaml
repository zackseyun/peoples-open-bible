theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Rendering גֵּר in Israel's covenant law
  chosen_reading: sojourner
  alternative_readings:
  - resident foreigner
  - stranger
  rationale: The term denotes a non-native person residing within the land and protected by Israel's law. 'Sojourner' preserves the social and covenantal nuance without importing modern immigration categories.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
