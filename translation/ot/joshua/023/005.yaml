  from: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
  to: Yahweh your God himself will drive them back before you and dispossess them, and you will take possession of their land, just as Yahweh your God promised you.
