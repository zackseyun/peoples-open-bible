lexical_decisions:
- source_word: ὧν
  choice: которыми
  rationale: Относительное местоимение в родительном падеже связано с подразумеваемыми проступками или делами из контекста; творительный падеж естественно передаёт по-русски средство или предмет совершённого греха.
- source_word: ἡμάρτομεν
  choice: мы согрешили
  rationale: Прямая передача аориста глагола ἁμαρτάνω как завершённого действия в прошлом.
- source_word: ἔναντι Κυρίου
  choice: пред Господом
  rationale: Сохраняет пространственно-реляционное значение «перед, в присутствии» и не подменяет его более интерпретирующим «против Господа».
theological_decisions:
- issue: Направленность выражения ἔναντι Κυρίου
  choice: пред Господом
  alternative: против Господа
  rationale: Греческое ἔναντι буквально обозначает положение или действие перед кем-либо, в его присутствии. Перевод сохраняет эту формулировку и заложенную в ней нравственную напряжённость, не уточняя её как прямое противодействие.
translation_notes:
  register: Краткая, торжественная формулировка в современном литературном русском языке. «Пред Господом» выбрано вместо разговорного «перед Господом» ради достоинства библейского регистра без архаизации всего стиха.
