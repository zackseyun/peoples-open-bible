  from: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
  to: They must be silenced, because they are ruining whole households by teaching what they ought not to teach for the sake of shameful gain.
  rationale: The lexical record recognizes ruin and subversion but preferred “upsetting” to avoid implying total destruction. “Ruining households” carries the destructive force without suggesting demolished buildings, while “silenced” still leaves the method unspecified.
