  from: He will bring back on them their iniquity[a], and in their evil he will wipe them out[b][c]; Yahweh our God will wipe them out.
  to: He will bring their iniquity back on them[a], and in their evil he will wipe them out; Yahweh our God will wipe them out.
  rationale: Reordering the first clause produces idiomatic English while retaining the return-upon-them image. The proposed “by their own evil,” however, selects an instrumental reading for בְּרָעָתָם that is possible but not required; “own” also adds emphatic reflexive force beyond the suffix’s ordinary possessive sense. The close rendering “in their evil” is defensible in this poetic line and better leaves the preposition’s connection open. The divine-name footnote is factually inconsistent with the text and stated policy and must be removed; the remaining note should be attached to the opening clause.
