  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: ko
  text: 요나단이 다윗에게 말했습니다. 「평안히 가십시오.[a] 우리 둘이 야훼의 이름으로 맹세하며 이렇게 말했으니, ‘야훼께서 나와 당신 사이에, 또 내 자손과 당신 자손 사이에 영원히 계시기를 바랍니다.’[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평안히 가십시오’는 לְשָׁלוֹם의 관용적인 작별 인사를 합쇼체로 옮긴 것입니다.
    reason: korean_style_note; 원어 표기 오류를 바로잡음
  - marker: b
    text: ‘자손’은 זֶרַע의 문맥상 자연스러운 번역으로, 직역 ‘씨’보다 관계적 후손이라는 의미를 분명히 합니다.
    reason: lexical_alternative
