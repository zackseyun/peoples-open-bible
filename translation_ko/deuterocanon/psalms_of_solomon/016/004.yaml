  text: ἔνυξέν με ὡς κέντρον ἵππου ἐπὶ τὴν ἐγρήγορσίν αὐτοῦ, ὁ σωτὴρ καὶ ἀντιλήμπτωρ μου ἐν παντὶ καιρῷ ἔσωσέν με.
