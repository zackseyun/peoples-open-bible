id: PSA.45.13
reference: Psalms 45:13
source:
  edition: WLC
  text: כָּל כְּבוּדָּ֣ה בַת מֶ֣לֶךְ פְּנִ֑ימָה מִֽ/מִּשְׁבְּצ֖וֹת זָהָ֣ב לְבוּשָֽׁ/הּ־־׃
translation:
  text: All glorious is the princess inside the palace; her clothing is interwoven with gold[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “her clothing is adorned with gold settings.”
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל
  chosen: All
  alternatives:
  - Entirely
  - Wholly
  lexicon: HALOT
  rationale: 'Used adverbially/intensively with כְּבוּדָּה to express total splendor: ''all glorious'' rather than a simple quantifier.'
- source_word: כְּבוּדָּה
  chosen: glorious
  alternatives:
  - splendor
  - honor
  lexicon: HALOT
  rationale: From כבוד, denoting glory/splendor. 'Glorious' fits the predicative sense in English and matches the royal-wedding imagery.
- source_word: בַת מֶלֶךְ
  chosen: the king’s daughter
  alternatives:
  - the princess
  lexicon: HALOT
  rationale: A more literal rendering preserves the Hebrew expression and its courtly setting. 'Princess' is possible but less transparent to the source wording.
- source_word: פְּנִימָה
  chosen: inside the palace
  alternatives:
  - inside
  - in the inner chamber
  - within
  lexicon: HALOT
  rationale: The adverb is spatial, meaning inside or indoors. The palace is supplied from the royal setting; 'in her chamber' remains possible.
- source_word: מִמִּשְׁבְּצוֹת
  chosen: interwoven with
  alternatives:
  - with settings of
  - embroidered with
  - interwoven with
  - of woven
  lexicon: HALOT
  rationale: The term describes worked settings or interweaving. 'Interwoven with gold' gives a clear English picture without implying merely inward beauty.
- source_word: זָהָב
  chosen: gold
  lexicon: HALOT
  rationale: Straightforward lexical rendering.
- source_word: לְבוּשָׁהּ
  chosen: her clothing
  alternatives:
  - her garment
  - her robe
  lexicon: HALOT
  rationale: A collective or general term for what she wears. 'Clothing' is natural modern English and avoids narrowing the reference to a single robe unless context requires it.
