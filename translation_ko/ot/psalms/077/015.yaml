  terminology: גָּאַלְתָּ는 ‘속량하셨습니다’로 옮겨 구원·해방의 의미를 보존했습니다. בִּזְרוֹעַ의 신체 은유는 ‘주님의 팔로’로 유지했으며, בְּנֵי는 해석적으로 ‘이스라엘’이나 ‘후손들’로 평탄화하지 않고 ‘자손’으로 자연스럽게 번역했습니다.
