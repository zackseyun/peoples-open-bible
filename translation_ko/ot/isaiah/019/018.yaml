  source_fidelity: 본문의 ‘가나안의 언어를 말하고’와 ‘만군의 야훼께 충성을 맹세하는’은 각각 מְדַבְּרוֹת שְׂפַת כְּנַעַן 및 וְנִשְׁבָּעוֹת לַיהוָה צְבָאוֹת을 충실히 반영합니다. עִיר הַהֶרֶס는 WLC의 마소라 본문을 따라 ‘파멸의 성읍’으로 옮길 수 있으나, 고대 본문 전승에 중요한 이문이 있으므로 각주로 밝혀야 합니다.
  naturalness: ‘그날에’, ‘그중 한 성읍’이 현대 표준 한국어 문장으로 더 자연스럽고 간결합니다. 합쇼체의 미래 서술도 적절합니다.
  terminology: ‘야훼’, ‘만군’, ‘성읍’은 본문 및 프로젝트의 명명 방침과 조화됩니다. 기존 각주는 원문의 이문보다 영어 번역의 해석적 표현을 설명하고 있어, 본문비평적으로 더 중요한 이문 각주로 교체하는 것이 적절합니다.
  issues:
