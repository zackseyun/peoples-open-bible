    reason: lexical_alternative
lexical_decisions:
- source_word: archangelus
  english_pob_choice: the archangel
  chosen_korean: 대천사
  alternatives_korean:
  - 천사장
  - 대천사장
  lexicon: archangel
  rationale: 라틴어 archangelus의 직접 대응으로 ‘대천사’를 택해, 일반 천사와의 위계적 구분을 분명히 했습니다.
- source_word: dixit
  english_pob_choice: said
  chosen_korean: 말하였습니다
  alternatives_korean:
  - 말했습니다
  - 이르렀습니다
  lexicon: say
  rationale: 서술체 합쇼체에 맞춰 간결하고 직접적인 발화를 살렸습니다.
- source_word: quando impletus fuerit numerus similium uobis
  english_pob_choice: When the number of those like you is completed
  chosen_korean: 너희와 같은 이들의 수가 다 차면
  alternatives_korean:
  - 너희와 같은 자들의 수가 채워지면
  - 너희 같은 이들의 수가 충만해지면
  lexicon: be completed / number / like you
  rationale: numerus similium uobis의 수량적 완결을 살리기 위해 ‘수’와 ‘다 차면’을 사용했고, similium uobis는 자연스러운 직역으로 ‘너희와 같은 이들’로 옮겼습니다.
- source_word: in statera ponderauit saeculum
  english_pob_choice: he has weighed the age in a balance
  chosen_korean: 그가 세상을 저울에 달아 보았기 때문입니다
  alternatives_korean:
  - 그가 시대를 저울에 달아 보았기 때문입니다
  - 그가 세대를 저울에 달았기 때문입니다
  lexicon: weigh / age / balance
  rationale: saeculum을 문맥상 단순한 ‘시대’보다 더 넓은 의미의 ‘세상’으로 옮겨, 심판적 비유의 범위를 살렸습니다. ‘저울에 달아 보았다’는 라틴어 완료형의 결과성을 반영합니다.
theological_decisions:
- issue: saeculum의 범위
  chosen_reading: ‘세상’으로 옮겨, 시간의 한 구간보다 피조 세계 전체를 평가하는 심판적 이미지를 드러냈습니다.
  alternative_readings:
  - 시대
  - 세대
  rationale: 문맥상 단순 연대기적 ‘시대’보다 하나님(또는 천상 존재)이 세계를 계량해 판정한다는 이미지가 더 두드러지므로, 독자 오해를 줄이면서도 원문의 넓은 범위를 보존했습니다.
  doctrine_reference: 하나님의 심판과 세계에 대한 판정 이미지
