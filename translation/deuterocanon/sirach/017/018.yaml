translation:
  text: A person's almsgiving is like a seal in God's keeping[a]; he will guard a person's kindness like the pupil of his eye.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: A personal seal was a valuable possession used to authenticate documents and mark ownership.
