translation:
  language: en
  text: 'I beg you—I plead with you: forgive me, Lord, forgive me. Do not destroy me along with my lawless deeds. Do not remain angry forever and hold my wrongs against me. Do not condemn me in the deepest parts of the earth, for you, Lord, are the God of those who repent[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: 'I beg you, pleading with you:'
  simplified_phrase: 'I beg you—I plead with you:'
  preserved_meaning: The speaker makes an intense, humble plea to God.
  reasoning_layer_used: Lexical decisions for αἰτοῦμαι and δεόμενός
  rationale: Two direct verbs express the repeated plea more naturally than a participial phrase.
- pob_phrase: nor, being angry forever, keep my evils against me
  simplified_phrase: Do not remain angry forever and hold my wrongs against me.
  preserved_meaning: The speaker asks God not to retain his evil acts against him in lasting anger.
  reasoning_layer_used: Lexical decision for τηρήσῃς τὰ κακά μοι
  rationale: The documented idiom “hold ... against me” is clearer in modern English.
- pob_phrase: the lowest parts of the earth
  simplified_phrase: the deepest parts of the earth
  preserved_meaning: The concrete image of the lowest regions beneath the earth remains intact.
  reasoning_layer_used: Lexical decision for ἐν τοῖς κατωτάτοις τῆς γῆς
  rationale: “Deepest parts” makes the spatial image easier to grasp without explaining it away.
translation_notes:
  risk_flags:
  - risk: “Deepest parts of the earth” may be understood as a precise physical location.
    mitigation: The wording preserves the source image without identifying the region more specifically than the POB does.
