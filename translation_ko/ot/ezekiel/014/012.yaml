lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 그때 ... 임하여
  alternatives_korean:
  - 그리고 ... 오셨습니다
  - 그 일이 있어
  lexicon: HALOT
  rationale: 예언서의 전형적인 서술 도입을 살리기 위해 사건 발생의 관용적 표현으로 옮겼습니다. '임하다'는 말씀/계시가 도래하는 문맥에 자연스럽고, 기계적인 직역보다 원문의 기능을 잘 드러냅니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언적 공식에서 하나님의 דבר는 단순한 '말'보다 계시적 '말씀'이 더 정확하고 문맥에 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 신명기적 언약명 יְהוָה를 제목어로 대체하지 않고 고유명으로 드러내기 위해 '야훼'를 택했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내게로
  lexicon: HALOT
  rationale: 히브리어 전치사+1인칭 접미사는 예언자에게 향한 도착을 뜻하므로, 현대 한국어로 자연스러운 '내게'가 적합합니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시며
  - 말하여
  lexicon: HALOT
  rationale: 이 절은 뒤따를 직접화법을 여는 공식이지만, 한국어에서는 앞의 '말씀이 내게 임하여'와 결합해 자연스럽게 마무리되도록 동사형으로 정리했습니다.
theological_decisions:
