translation:
  text: Here their souls are separated for this great torment until the great day of judgment, scourging, and torment
    for those who curse forever, and vengeance for their souls. There he will bind them forever [even though it
    is from before eternity].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The selected text has souls here; Charles printed58 note38 considers possible corruption to spirits,
      but the overlapping lexical uses do not justify replacing the actual word. Those who curse is the printed
      active form: Charles proposes a passive correction in printed58 note41/printed59 note9, but it is not installed
      here. The final bracketed clause is regarded as an Ethiopic intrusion by printed58 note44, and remains explicitly
      bracketed. The source does not name the subject of he will bind; English does not identify him. The time-clause
      grammar and shift into vengeance remain awkward rather than being harmonized.'
    reason: textual_variant
