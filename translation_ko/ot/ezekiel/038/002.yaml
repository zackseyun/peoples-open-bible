    rationale: 초안의 ‘향하고’, ‘대언하라’는 합쇼체가 아닙니다. 직접 명령을 ‘향하십시오’, ‘예언하십시오’로 옮겨 목표 문체에 맞췄습니다.
  - severity: low
    issue: 각주가 번역문에 필요한 정보를 제공하지 않으며 해석을 단정적으로 제시함
    rationale: 영어 POB의 확정된 ‘chief prince’ 선택은 번역문 자체에 반영되어 있습니다. 해당 각주는 독자에게 필요한 본문상 변이나 대안 번역을 제시하지 않고, ‘문맥에 더 적절하다’는 편집 판단만 반복하므로 삭제하는 편이 낫습니다.
