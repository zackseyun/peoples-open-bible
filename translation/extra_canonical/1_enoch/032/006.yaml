translation:
  philosophy: optimal-equivalence
  text: Then Raphael, the holy angel who was with me, answered me and said to me, “This is the tree of wisdom from
    which your aged father and your mother ate—your ancestors who preceded you. They knew wisdom, their eyes were
    opened, they knew that they were naked, and they were driven from the garden.”[a]
  footnotes:
  - marker: a
    text: The complete selected Ethiopic unit is printed before XXXIII. It has a singular aged father and a singular
      mother, followed by the plural ancestral expression አበዋቲከ፡ እለ፡ ቀደሙከ. “Your ancestors who preceded you” is
      a bounded, explicitly provisional apposition to those two people, not a replacement by Adam and Eve or an
      invented additional group. The actual longer ancestral word corrects an earlier shortened draft transcription;
      the primary father entry permits plural parents and forebears. The selected plural opened-eyes, knowing, nakedness
      and expulsion clauses remain Ethiopic text, without a supplied agent. The facing Greek gives only the short
      father/eating clause followed by editorial dots; it does not attest the entire Ethiopic unit, and its dots
      do not mark a missing Ethiopic ending. Dillmann1851 was used only as an aligned edited-Geʽez comparison, not
      to replace Charles’s selected word order or claim fresh manuscripts.
    reason: textual_variant
