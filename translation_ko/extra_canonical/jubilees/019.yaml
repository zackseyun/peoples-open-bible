revisions:
- from: '1[1]. 그리고 마흔여덟째 희년 첫째 주의 첫째 해에 아브라함이 돌아와서 헤브론 맞은편 기럇 아르바에 거주하여 해 이레 동안을 지냈더라.

    2. 희년 셋째 주의 첫째 해에 사라가 향년을 다하여 헤브론에서 죽으니라.

    3. 아브라함은 가서 그를 위하여 애통하고 울며 절제된 마음으로 그녀를 기억하고 입으로 강포한 말을 하지 아니하였더라.

