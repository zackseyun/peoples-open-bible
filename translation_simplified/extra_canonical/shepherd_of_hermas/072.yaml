  text: 'After the shepherd had examined everyone’s rods, he said to me, “I told you that this tree loves
    life. Do you see how many repented and were saved?” “I see, sir,” I said. “This is so you may see,”
    he said, “that the Lord’s abundant mercy is great and glorious. He gave a spirit to those worthy of
    repentance.”[a]


    2. “Why then, sir,” I asked, “did they not all repent?” He said, “He gave repentance to those whose
    hearts he saw would become pure and serve him with their whole heart. But when he saw their deceit
    and wickedness, knowing they would repent hypocritically, he did not give them repentance, lest they
    again profane his name.”[b]


    3. I said to him, “Sir, now explain to me what sort of people handed in the rods and where they dwell.
    Then those who believed and received the seal, but broke it and did not keep it sound, may hear, recognize
    their own deeds and repent, receiving a seal from you. They may glorify the Lord because he took pity
    on them and sent you to renew their spirits.”[c]


    4. “Listen,” he said. “Those whose rods were found dry and eaten away by moths are the apostates and
    betrayers of the church. In their sins they blasphemed the Lord and were also ashamed of the Lord’s
    name that had been called over them. They were utterly lost to God.[d] You see that not one of them
    repented, although they heard the words you spoke to them, which I commanded you to speak.[e] Life
    has departed from such people.”


    5. “Those who handed in dry rods that had not rotted are close to them. They were hypocrites who introduced
    foreign teachings and led God’s servants astray, especially those who had sinned. They did not let
    them repent, but persuaded them with their foolish teachings. These people still have hope of repenting.”[f]


    6. “You see that many of them have repented since you spoke my commandments to them, and more will
    repent. Those who will not repent have lost their life. Those among them who repented became good,
    and their dwelling came to be in the outer walls; some even went up into the tower.[g] So you see,”
    he said, “that the repentance of sinners brings life, but not repenting brings death.”[h]'
