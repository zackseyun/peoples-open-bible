  lexical_decisions:
  - source_word: רַבִּים
    chosen: Many
    alternatives:
    - Many people
    - Multitudes
    lexicon: HALOT
    rationale: Straightforward quantitative adjective/pronoun; 'Many' is concise and natural English.
  - source_word: שָׁמְעוּ
    chosen: heard
    alternatives:
    - listened to
    - obeyed
    lexicon: HALOT
    rationale: The basic sense is auditory reception. 'Obeyed' would overread the verb; 'heard' preserves the Hebrew while allowing the instructional context to imply attentive hearing.
  - source_word: לִמּוּדִי
    chosen: my instruction
    alternatives:
    - my teaching
    - what I taught
    lexicon: HALOT
    rationale: From למד in a noun form referring to teaching/instruction. 'My instruction' keeps the didactic tone and aligns well with the wisdom context; 'my teaching' is possible but slightly less formal.
  - source_word: בִּנְעֻרוֹתָי
    chosen: in my youth
    alternatives:
    - in my younger years
    - when I was young
    lexicon: HALOT
    rationale: The plural abstract noun denotes the period of youth. 'In my youth' is idiomatic and compact.
  - source_word: וְכֶסֶף וְזָהָב
    chosen: silver and gold
    alternatives:
    - money and gold
    lexicon: HALOT
    rationale: The Hebrew names the precious metals directly; retaining 'silver and gold' preserves the concrete imagery and matches the Greek parallel's ἀργύριον and χρυσός.
  - source_word: תִּקְנוּ
    chosen: acquired
    alternatives:
    - obtained
    - bought
    - gained
    lexicon: HALOT
    rationale: The verb קנה commonly means acquire/get. Because the object is 'silver and gold,' 'acquired' fits the Hebrew syntax better than importing the Greek imperative sense ('acquire') as a command. 'Bought' would require an explicit object purchased, which the Hebrew does not supply.
  - source_word: בִּי
    chosen: through me
    alternatives:
    - by me
    - in me
    - because of me
    lexicon: HALOT
    rationale: 'The preposition with first-person suffix is difficult in context. The Hebrew most naturally indicates instrumentality or mediation: people gained wealth by means of the speaker''s instruction. The Greek parallel has ἐν αὐτῇ (''in it,'' i.e., in instruction/wisdom), which supports a mediating sense rather than a strictly locative one. ''Through me'' best captures the Hebrew wording while remaining intelligible.'
  theological_decisions:
  - issue: Relation between the Hebrew wording and the Greek parallel in the second colon
    chosen_reading: Translate the Hebrew as a statement about others gaining wealth through the speaker's instruction, while allowing the Greek to inform the mediating sense.
    alternative_readings:
    - 'Take the line imperatively from the Greek: ''Receive instruction for a great sum of silver, and acquire much gold by it.'''
    - Render בִּי more literally as 'in me' and leave the sense more opaque.
    rationale: Zone 1 gives a high-confidence Hebrew witness, which is primary for extant Hebrew Sirach. The Hebrew syntax is declarative ('Many heard... and they acquired...'), unlike the Greek imperative. Since the task requires keeping the Greek in view, the Greek parallel is used to clarify that the final prepositional phrase likely expresses means connected with instruction/wisdom. The main text therefore follows the Hebrew witness while preserving the notable Greek alternative in a footnote.
    doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use Greek parallel as actual input without displacing the more original extant witness.'
