translation:
  language: en
  text: He proclaimed God’s kingdom and taught about the Lord Jesus Christ.[a] He did all this with complete boldness and without being stopped.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Jesus the Messiah.” The Greek word can function as the title “Messiah” or as the familiar designation “Christ.”
