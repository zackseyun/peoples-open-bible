  rationale: WLC의 문장 구조와 POB 주석에 따르면 이 절은 노래 지시와 저작/관련 표지를 담은 표제입니다. 따라서 본문 의미를 앞서 해석하지 않고 표제의 기능을 유지했습니다.
  doctrine_reference: 원문 우선 번역 원칙; 표제의 문학적 기능 보존
