  temperature: 0.2
status: draft
theological_decisions:
- issue: Implicit divine subject in 'doing a work'
  chosen_reading: For I am doing a work
  alternative_readings:
  - For a work is being done
  - For one is doing a work
  rationale: The retained Hebrew lacks an explicit first-person pronoun. The following verse's divine-speaker context supports the existing English 'I,' but an impersonal rendering is also grammatical and remains in note c. This is a contextual interpretation, not a restoration of Hebrew pronoun letters or a requirement of English grammar.
  doctrine_reference: Translation philosophy §1, §3
- issue: Rendering the emphatic astonishment commands
  chosen_reading: be astonished, be astounded
  alternative_readings:
  - be astonished, be astonished
  - wonder marvelously
  rationale: The translation preserves the rhetorical shock of the Hebrew without archaic or unnatural duplication. This maintains the text's force while remaining readable modern English.
  doctrine_reference: Translation philosophy §§1, 5
