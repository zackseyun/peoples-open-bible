  category: mistranslation
  from: Yet they will be saved, and their enemies will fall before them.
  to: Nevertheless, not fully as in the beginning. But it will come to pass after
    these things that there will be the fall of many nations.
  rationale: The draft completely mistranslates the Syriac text. The Syriac reads
    "bram la shalmuth 'ayk d-b-qadmita. 'ela nehwa bathar haleyn d-nehwa mapulta d-'amame
    sagi'e" which translates to "Nevertheless, not fully as in the beginning. But
    it will come to pass after these things that there will be the fall of many nations."
    The draft appears to have hallucinated or confused this verse with another.
- timestamp: '2026-04-28T09:36:33Z'
