  meaning_decisions:
  - source_phrase: לְהַצִּילְךָ
    prior_rendering: to rescue you
    new_rendering: Wisdom will also rescue you
    rationale: The repeated infinitive introduces a second danger from which wisdom protects the son; the explicit subject and “also” clarify its connection with verse 12.
  - source_phrase: מֵאִשָּׁה זָרָה מִנָּכְרִיָּה
