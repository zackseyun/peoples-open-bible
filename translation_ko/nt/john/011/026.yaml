id: JHN.11.26
reference: John 11:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: ko
  text: 그리고 살아 있으면서 나를 믿는 사람은 누구나 영원히 죽지 않을 것입니다. 이것을 믿습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν καὶ πιστεύων
  english_pob_choice: everyone who lives and believes
  chosen_korean: 나를 믿는 사람은 누구든지
  alternatives_korean:
  - 살고 믿는 사람은 누구든지
  - 살아 있고 믿는 사람은 누구든지
  lexicon: πᾶς, ζῶν, πιστεύων
  rationale: πᾶς ὁ ζῶν καὶ πιστεύων은 두 분사로 대상을 규정하지만, 한국어에서는 자연스럽게 ‘나를 믿는 사람은 누구든지’로 옮겨 의미를 유지했습니다.
- source_word: εἰς ἐμὲ
  english_pob_choice: in me
  chosen_korean: 나를
  alternatives_korean:
  - 내 안에
  - 내게
  lexicon: εἰς + 인칭대명사
  rationale: εἰς ἐμέ는 단순한 방향성보다 인격적 신뢰의 대상을 나타내므로, 문맥에 맞게 ‘나를 믿다’로 자연화했습니다.
- source_word: οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα
  english_pob_choice: will certainly never die forever
  chosen_korean: 영원히 죽지 않습니다
  alternatives_korean:
  - 결코 영원히 죽지 않습니다
  - 절대로 죽지 않습니다
  lexicon: οὐ μή + aorist subj., εἰς τὸν αἰῶνα
  rationale: 강한 부정을 한국어의 자연스러운 부정으로 옮기되, English POB의 ‘forever’ 취지를 살려 ‘영원히’를 유지했습니다.
theological_decisions:
- issue: 죽음의 부정이 ‘육체적 죽음’인지 ‘궁극적/영원한 죽음’인지
  chosen_reading: 문맥상 예수를 믿는 자에게는 최종적이고 영원한 죽음이 없다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 육체적으로는 죽지 않는다
  - 죽음을 전혀 맛보지 않는다
  rationale: 앞선 절들과 장례 문맥에서 육체적 죽음은 남아 있으므로, 여기서는 최종적 사망의 권세가 없다는 약속으로 이해하는 것이 본문에 더 충실합니다.
  doctrine_reference: 요한복음 11장 전체 문맥
- issue: πιστεύεις τοῦτο;의 대화체
  chosen_reading: 예수의 직접 질문으로서 평이한 2인칭 단수 질문을 유지했습니다.
  alternative_readings:
  - 당신은 이것을 믿습니까?
  - 이것을 믿으십니까?
  rationale: 수신자는 마르다이므로 현대 한국어에서 예수의 질문을 공손한 2인칭으로 옮겨, 대화의 긴장과 존중을 함께 살렸습니다.
  doctrine_reference: 서사 대화의 화용론
