source:
  edition: WLC
  text: יָג֤וּרוּ יצפינו הֵ֭מָּה עֲקֵבַ֣/י יִשְׁמֹ֑רוּ כַּ֝/אֲשֶׁ֗ר קִוּ֥וּ נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/006.yaml
  text: They gather together; they hide themselves[a]; they watch my steps[b] as they lie in wait for my life[c].
  footnotes:
  - marker: a
    text: Or “they lurk”; the Hebrew verb can describe concealment in ambush.
    reason: lexical_alternative
  - marker: b
    text: Literally “my heels”; idiomatically, “my steps” or “my footsteps.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew verb normally means “wait” or “hope,” but here the surrounding hostile actions give it the sense of lying in wait.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 함께 모여[a] 숨어서 내 발걸음[b]을 지켜보며, 내 목숨을 노립니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소동을 일으킵니다’ 또는 ‘적대하여 모여듭니다’. 히브리어 동사의 정확한 뉘앙스에는 불확실성이 있으나, 여기서는 적대자들이 함께 모이는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 발꿈치들’입니다. 여기서는 ‘내 발걸음’ 또는 ‘내 움직임’을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘내 목숨을 기다립니다’입니다. 적대적인 문맥에서는 내 목숨을 빼앗을 기회를 기다리거나 나를 노린다는 뜻입니다.
    reason: lexical_alternative
