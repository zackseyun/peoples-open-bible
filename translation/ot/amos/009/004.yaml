  from: And if they go into captivity before their enemies[a], from there I will command the sword, and it will kill them; and I will set my eyes on them for harm and not for good.
  to: Though their enemies take them into captivity, even there I will command the sword, and it will kill them; I will fix my eyes on them for harm and not for good.”
  rationale: Kept the earlier personification of the sword and the important distinction between harmful judgment and moral evil. The earlier reluctance to identify the enemies as captors reflected word-level restraint; their role is already implicit in the captivity scene.
