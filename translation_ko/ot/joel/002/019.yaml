  yaml_path: translation/ot/joel/002/019.yaml
  text: Then the LORD answered and said to his people, “Look, I am sending you the grain, the new wine, and the fresh oil, and you will be satisfied with it; and I will no longer make you a reproach among the nations.”
translation:
  language: ko
  text: 그때 야훼[a]께서 그의 백성에게 응답하여 말씀하셨습니다. 「보십시오, 내가 너희에게 곡식과 새 포도주와 기름[b]을 보내겠다. 너희는 그것으로 배부르게 될 것이며, 내가 다시는 너희를 민족들 가운데서 수치거리가 되게 하지 않겠다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘야훼’는 히브리어 יְהוָה를 직접 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: 히브리어 הַיִּצְהָר는 기름, 곧 올리브기름을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן יְהוָה וַיֹּאמֶר
  english_pob_choice: Then the LORD answered and said
  chosen_korean: 그때 야훼께서 ... 응답하여 말씀하셨습니다
  alternatives_korean:
  - 그때 야훼께서 대답하여 말씀하셨습니다
  - 야훼께서 응답하여 말씀하셨습니다
  lexicon: ענה / אמר
  rationale: ענה와 אמר의 연속을 한국어에서 자연스럽게 ‘응답하여 말씀하셨습니다’로 풀어, 응답과 발화를 둘 다 살렸습니다.
- source_word: הִנְנִי
  english_pob_choice: Look, I am
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 이제 내가
  lexicon: הנני
  rationale: 선언적 주의를 끄는 הנני는 합쇼체에서 ‘보십시오’가 가장 자연스럽고, POB의 호소적 뉘앙스를 유지합니다.
- source_word: הַדָּגָן וְהַתִּירוֹשׁ וְהַיִּצְהָר
  english_pob_choice: the grain, the new wine, and the fresh oil
  chosen_korean: 곡식과 새 포도주와 햇기름
  alternatives_korean:
  - 곡식과 새 포도주와 기름
  - 곡식과 새 포도주와 신선한 기름
  lexicon: דגן / תירוש / יצהר
  rationale: דגן, תירוש, יצהר를 각각 농경 문맥의 기본 항목으로 대응시키되, POB의 ‘fresh oil’을 반영해 ‘햇기름’으로 옮겼습니다.
- source_word: חֶרְפָּה בַּגּוֹיִם
  english_pob_choice: a reproach among the nations
  chosen_korean: 여러 민족들 가운데서 수치거리가
  alternatives_korean:
  - 민족들 가운데서 수치
  - 열국 가운데서 치욕거리
  lexicon: חרפה / גוים
  rationale: חרפה는 단순한 감정보다 공개적 모욕·수치를 뜻하므로, ‘수치거리가’로 사회적 낙인을 드러냈습니다.
theological_decisions:
- issue: 야훼의 호칭을 어떻게 옮길 것인가
  chosen_reading: 야훼
