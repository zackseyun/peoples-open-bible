  naturalness: ‘نسل’은 표준 한국어 문장에 들어갈 수 없는 외국 문자 혼입 및 비자연스러운 표현입니다. ‘이스라엘 민족’으로 고치고, 두 ‘아래에’를 하나의 서술어에 병렬 연결하여 현대 한국어 합쇼체 문장으로 자연스럽게 정리했습니다.
