  lexicon: BDAG
  rationale: 복음서 지리 지명은 관습적으로 '유대'로 번역합니다. 간결하고 독자가 쉽게 식별할 수 있습니다.
- source_word: ἀφῆκεν / ἀπῆλθεν
  english_pob_choice: left / went
  chosen_korean: 떠나 ... 돌아가셨습니다
  alternatives_korean:
  - 떠났다
  - 갔다
  lexicon: BDAG
  rationale: 두 동사는 장소 이동을 나타내는 aorist 형태입니다. 한국어에서는 '유대를 떠나'와 '돌아가다'를 결합해 원문의 두 움직임(떠남과 귀환)을 자연스럽게 반영했습니다.
theological_decisions:
- issue: '예수(주어) 표기와 동사의 경어(예: 예수께서 ... 가셨습니다 vs 그가 ... 갔다)'
  chosen_reading: 예수께서 유대를 떠나 다시 갈릴리로 돌아가셨습니다
  alternative_readings:
  - 그가 유대를 떠나 다시 갈릴리로 갔습니다
  - 예수는 유대를 떠나 다시 갈릴리로 갔다
  rationale: '한국어 성경 전통은 복음서의 예수 서술에서 ''예수께서'' 같은 명시적 주어와 경어형을 자주 사용합니다. 이는 원문의 인물 지시를 분명히 하고 문화적 경의를 반영하는 서술적 선택입니다. 본 선택은 신학적 주장(예: 신성에 관한 표현)을 추가하지 않고 문체적·독자 지향적입니다.'
  doctrine_reference: Korean biblical style convention; not a doctrinal claim
