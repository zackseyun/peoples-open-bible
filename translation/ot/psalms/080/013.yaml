id: PSA.80.13
reference: Psalms 80:13
source:
  edition: WLC
  text: יְכַרְסְמֶ֣/נָּֽה חֲזִ֣יר מִ/יָּ֑עַר וְ/זִ֖יז שָׂדַ֣י יִרְעֶֽ/נָּה׃
  extraction_repair: Retains inline special letters from the vendored XML; see docs/HEBREW_INLINE_LETTER_REPAIR_2026-09-07.md.
translation:
  text: A boar from the forest ravages it[a], and the wild animals of the field feed on it.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The rare Hebrew verb describes destructive feeding or stripping; it may also be rendered “gnaws at it.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  chosen: ravages it
  alternatives:
  - ravages it
  - gnaws at it
  - strips it
  lexicon: HALOT
  rationale: It conveys destructive animal feeding without suggesting literal demolition.
- source_word: חֲזִיר
  chosen: boar
  alternatives:
  - pig
  - wild boar
  lexicon: HALOT
  rationale: חזיר denotes a pig/boar. Because the following phrase 'from the forest' specifies a wild setting, 'boar' is the most natural concise rendering; 'wild boar' would be slightly redundant.
- source_word: מִיָּעַר
  chosen: from the forest
  alternatives:
  - out of the forest
  lexicon: HALOT
  rationale: The preposition מן marks source/origin. 'From the forest' is straightforward and idiomatic.
- source_word: זִיז
  chosen: wild animals
  alternatives:
  - beasts
  - creatures
  - that which moves
  lexicon: HALOT
  rationale: In this field-animal context, this is a natural collective rendering.
- source_word: שָׂדַי
  chosen: of the field
  alternatives:
  - of the open country
  lexicon: HALOT
  rationale: The construct phrase זיז שדי is a standard wilderness/field-animal expression. 'Of the field' preserves the biblical imagery and is natural English.
- source_word: יִרְעֶנָּה
  chosen: feed on it
  alternatives:
  - graze on it
  - pasture on it
  - devour it
  lexicon: HALOT
  rationale: The verb רעה in the Qal commonly means 'graze/feed.' With the feminine suffix referring back to the vine/vineyard, 'feed on it' best captures the image of animals consuming vegetation. 'Graze on it' is possible, but 'feed on it' is slightly broader and more idiomatic with 'creatures'.
