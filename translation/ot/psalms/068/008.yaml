id: PSA.68.8
reference: Psalms 68:8
source:
  edition: WLC
  text: אֶ֤רֶץ רָעָ֨שָׁה אַף שָׁמַ֣יִם נָטְפוּ֮ מִ/פְּנֵ֪י אֱלֹ֫הִ֥ים זֶ֥ה סִינַ֑י מִ/פְּנֵ֥י אֱ֝לֹהִ֗ים אֱלֹהֵ֥י יִשְׂרָאֵֽל׀־׃
translation:
  text: The earth quaked; even the heavens poured down rain before God; Sinai itself trembled[a] before God, the God of Israel.
  footnotes:
  - marker: a
    text: Another understanding is “before God, the one of Sinai, before God, the God of Israel”; the Hebrew wording is compressed.
    reason: alternative_reading
  philosophy: dynamic
