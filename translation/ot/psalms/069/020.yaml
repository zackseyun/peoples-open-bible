  category: lexical
  tier: 1
  from: Reproach has broken my heart[a], and I am sick; I looked for sympathy, but there was none, and for comforters, but I found none.
  to: Reproach has broken my heart, and I am desperately ill; I looked for sympathy, but there was none, and for comforters, but I found none.
  rationale: אָנֻשָׁה denotes a grievous, serious condition; “desperately ill” better represents its force than unqualified “sick,” without asserting incurability. The existing note is attached to “heart” although it concerns “sympathy,” and no note is needed for the retained natural rendering.
