  meaning_decisions:
  - source_phrase: οἱ δύο υἱοὶ αὐτοῦ
    prior_rendering: his two sons
    new_rendering: two of the king’s sons
    rationale: The number identifies the two assassins, not the total number of the king’s sons; the following succession makes that distinction important.
  - source_phrase: Σαχερδονὸς ... Ἀχιάχαρον
    prior_rendering: Sacherdonos ... Achiacharos
    new_rendering: Esarhaddon ... Ahikar
    rationale: Use recognizable English forms and a consistent name for Ahikar across verses 21 and 22.
  - source_phrase: Ἀχιάχαρον τὸν Ἀναὴλ υἱὸν τοῦ ἀδελφοῦ μου
    prior_rendering: Achiacharos, the son of Anael, my brother’s son
    new_rendering: Ahikar, the son of my brother Anael
    rationale: The compressed Greek identifies Ahikar as the brother’s son, with the indeclinable name Anael naming that brother; it does not require an additional generation.
  - source_phrase: ἐβασίλευσεν ... ἀντʼ αὐτοῦ
    prior_rendering: reigned in his place
    new_rendering: succeeded him as king
    rationale: The narrative concerns accession after the king’s death rather than simply the duration of the successor’s reign.
  - source_phrase: ἐπὶ πᾶσαν τὴν ἐκλογιστείαν ... καὶ ἐπὶ πᾶσαν τὴν διοίκησιν
    prior_rendering: over all the accounts ... and over the whole administration
    new_rendering: to oversee all the accounts ... and its entire administration
    rationale: The construction describes comprehensive responsibility for financial accounting and general administration.
