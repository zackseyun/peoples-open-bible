id: PRO.5.14
reference: Proverbs 5:14
source:
  edition: WLC
  text: כִּ֭/מְעַט הָיִ֣יתִי בְ/כָל רָ֑ע בְּ/ת֖וֹךְ קָהָ֣ל וְ/עֵדָֽה־׃
translation:
  text: I was on the brink of utter ruin[a] among the assembled community.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “I was nearly immersed in utter evil.” The Hebrew can refer to moral evil rather than calamity.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּמְעַט
  chosen: nearly
  alternatives:
  - for a little while
  - nearly
  lexicon: HALOT
  rationale: It denotes proximity to the stated outcome.
- source_word: הָיִיתִי
  chosen: I was
  alternatives:
  - I came to be
  lexicon: HALOT
  rationale: Simple past of היה fits the speaker's retrospective confession. 'I was' preserves the Hebrew verbal simplicity.
- source_word: בְכָל רָע
  chosen: in utter ruin
  alternatives:
  - in utter evil
  - in all evil
  - in complete ruin
  lexicon: HALOT
  rationale: The phrase can express total calamity here; the footnote preserves the viable broader alternative.
- source_word: בְּתוֹךְ
  chosen: in the midst of
  alternatives:
  - among
  - before
  lexicon: HALOT
  rationale: The term literally means 'in the midst of.' This slightly more formal rendering preserves the spatial/public sense of the Hebrew, though 'among' is a viable smoother alternative.
- source_word: קָהָל
  chosen: assembly
  alternatives:
  - gathering
  lexicon: HALOT
  rationale: '''Assembly'' is a standard rendering for קהל and fits a formal gathered community context.'
- source_word: וְעֵדָה
  chosen: congregation
  alternatives:
  - community
  - assembly
  lexicon: HALOT
  rationale: Using 'congregation' alongside 'assembly' preserves the paired Hebrew terms rather than collapsing them into one English word. The near-synonymous pair likely heightens the public setting.
