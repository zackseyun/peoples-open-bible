id: PSA.139.4
reference: Psalms 139:4
source:
  edition: WLC
  text: כִּ֤י אֵ֣ין מִ֭לָּה בִּ/לְשׁוֹנִ֑/י הֵ֥ן יְ֝הוָ֗ה יָדַ֥עְתָּ כֻלָּֽ/הּ׃
translation:
  text: Even before a word is on my tongue, O Yahweh, you already know it completely.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: Even before
  alternatives:
  - Indeed
  - Surely
  - Because
  - For
  lexicon: HALOT
  rationale: In this context the clause explains God's foreknowledge of speech. English 'even before' expresses the relation that the compact Hebrew leaves implicit.
- source_word: אֵין
  chosen: a word is
  alternatives:
  - there is no
  - not
  - there is not
  lexicon: HALOT
  rationale: The Hebrew existential negative is recast within the temporal English clause without changing the claim.
- source_word: מִלָּה
  chosen: word
  alternatives:
  - speech
  - utterance
  - matter
  lexicon: HALOT
  rationale: '''Word'' is the most straightforward rendering in this context of spoken language and fits the singular Hebrew.'
- source_word: בִּלְשׁוֹנִי
  chosen: on my tongue
  alternatives:
  - in my tongue
  - on my lips
  lexicon: HALOT
  rationale: The idiom refers to speech not yet or just being uttered. 'On my tongue' is a natural English equivalent that preserves the bodily metaphor better than 'on my lips,' which would shift the image.
- source_word: הֵן
  chosen: behold
  alternatives:
  - indeed
  - surely
  - look
  lexicon: HALOT
  rationale: הֵן is an attention-getting particle. 'Behold' preserves the emphatic, solemn force in poetic diction without adding interpretation.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: יָדַעְתָּ
  chosen: you know
  alternatives:
  - you have known
  - you knew
  lexicon: HALOT
  rationale: The perfect here expresses the psalmist's confidence in God's complete knowledge; present English 'you know' best communicates the stative sense in context.
- source_word: כֻלָּהּ
  chosen: it completely
  alternatives:
  - it all
  - all of it
  - it altogether
  lexicon: HALOT
  rationale: The feminine singular suffix refers back to 'word.' 'It completely' conveys exhaustive knowledge in idiomatic English while keeping the singular antecedent in view.
