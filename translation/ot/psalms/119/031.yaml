  text: דָּבַ֥קְתִּי בְ/עֵֽדְוֺתֶ֑י/ךָ יְ֝הוָ֗ה אַל תְּבִישֵֽׁ/נִי־׃
translation:
  text: I cling to your testimonies, Yahweh; do not put me to shame.
  philosophy: dynamic
