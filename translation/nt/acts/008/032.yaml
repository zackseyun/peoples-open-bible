  rationale: The broader narrative identifies the referent christologically, but this verse itself presents the quoted Scripture. To avoid importing doctrinal explanation into the translation, the wording remains close to the Greek quotation while allowing the canonical connection to stand from context.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
