translation:
  language: ko
  text: 나는 야훼를 간절히 기다렸습니다.[a] 그분께서 내게로 몸을 돌리시고 나의 도움을 구하는 부르짖음을 들으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘기다리며 기다렸습니다’라는 강조 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 합창대장에게
  - 음악 감독에게
  - 인도자에게
  lexicon: HALOT
  rationale: 시편 표제의 ל- 전치사가 향유/전달 대상을 나타낼 수 있으므로, 간결하고 기능을 살리는 ‘-에게’로 옮겼습니다. ‘지휘자’는 예배 음악을 총괄하는 인물을 자연스럽게 드러냅니다.
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗이 지은
  - 다윗에게
  - 다윗을 위한
  lexicon: HALOT
  rationale: לְדָוִד는 저자, 관련, 헌정의 폭을 가질 수 있으므로, 한국어 소유격 ‘다윗의’로 옮겨 원문의 유보된 의미를 보존했습니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시입니다
  alternatives_korean:
  - 노래입니다
  - 찬송입니다
  lexicon: HALOT
  rationale: מִזְמוֹר는 장르 표지이므로, 낯설지 않으면서도 장르를 분명히 하는 ‘시’로 옮겼습니다. 표제 형식에 맞게 종결은 정중체로 처리했습니다.
theological_decisions:
- issue: 다윗 표제의 의미 범위
  chosen_reading: ‘다윗의’로 옮겨 저작, 관련, 헌정 가능성을 모두 열어 둡니다.
  alternative_readings:
  - ‘다윗이 지은’으로 저작을 단정하는 읽기
  - ‘다윗을 위한’으로 헌정만을 강조하는 읽기
  rationale: 본문은 다윗 저작 여부를 확정하지 않으므로, 번역도 그 긴장을 유지해야 합니다. 이는 원문 우선의 원칙에 부합합니다.
  doctrine_reference: 원문이 허용하는 범위 안에서 역사적 단정을 피함
- issue: 시편 표제의 문체
  chosen_reading: 명령문 대신 표제문으로 처리하여 문장 종결을 ‘-입니다’로 맞췄습니다.
  alternative_readings:
  - 명령형을 살린 표제식 번역
  - 더 전통적인 문어체 종결
  rationale: 히브리어 표제는 본문 내용이 아니라 머리말이므로, 현대 한국어 독자가 즉시 인지할 수 있는 표제 문체가 적절합니다.
  doctrine_reference: 문체는 의미 전달을 돕는 범위에서 조정
