id: MRK.12.13
reference: Mark 12:13
source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
translation:
  text: Then they sent some Pharisees and Herodians[a] to Jesus to trap him with his own words.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Herodians were supporters of the ruling house of Herod.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστέλλουσιν
  chosen: they sent
  alternatives:
  - they send
  - they dispatched
  lexicon: BDAG
  rationale: Although the Greek uses a historical present, English narrative style commonly renders it as a simple past for natural readability. 'Sent' preserves the action without adding nuance beyond the source.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  chosen: some of the Pharisees and some of the Herodians
  alternatives:
  - some Pharisees and Herodians
  - certain ones from the Pharisees and the Herodians
  lexicon: BDAG
  rationale: The partitive construction with τινας + genitive is best represented by 'some of the ... and some of the ...,' making clear that representatives from both groups were sent.
- source_word: Φαρισαίων
  chosen: Pharisees
  lexicon: BDAG
  rationale: Standard transliteration of the Jewish group name, in keeping with the philosophy of transliterating personal and group names rather than translating them.
- source_word: Ἡρῳδιανῶν
  chosen: Herodians
  lexicon: BDAG
  rationale: Standard transliteration of the political/religious group associated with Herod.
- source_word: ἵνα
  chosen: so that
  alternatives:
  - in order that
  - that
  lexicon: BDAG
  rationale: Expresses purpose clearly in modern English while preserving the subordinate purpose clause.
- source_word: ἀγρεύσωσιν
  chosen: might trap
  alternatives:
  - might catch
  - might ensnare
  lexicon: BDAG
  rationale: The verb literally evokes catching as in hunting, used metaphorically here for entrapping someone. 'Trap' is idiomatic and preserves the hostile intent.
- source_word: λόγῳ
  chosen: with a word
  alternatives:
  - by a statement
  - in his speech
  - in what he said
  lexicon: BDAG
  rationale: The dative indicates means or instrument. 'With a word' is a relatively formal but clear rendering that preserves the singular λόγῳ and the sense of entrapping him through his own spoken response.
