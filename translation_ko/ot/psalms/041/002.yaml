source:
  edition: WLC
  text: יְהוָ֤ה יִשְׁמְרֵ֣/הוּ וִֽ֭/יחַיֵּ/הוּ יאשר בָּ/אָ֑רֶץ וְ/אַֽל תִּ֝תְּנֵ֗/הוּ בְּ/נֶ֣פֶשׁ אֹיְבָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/002.yaml
  text: Yahweh will guard him and keep him alive[a]; he will be called blessed in the land, and do not give him over to the desire of his enemies[b].
  footnotes:
  - marker: a
    text: Or “preserve his life.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “to the desire of his enemies”; or “to the will of his enemies.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그를 지키시고 살려 주시며[a], 그는 땅에서 복되다 일컬어질 것입니다[b]. 주께서는 그를 그의 원수들의 뜻에 넘기지 마십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 살아 있게 하시며’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 땅에서 복을 받을 것입니다’. 히브리어 동사는 ‘복되다 일컬어지다’ 또는 더 일반적으로 ‘복을 받다’로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그의 원수들의 욕망에’입니다. ‘원수들의 뜻에’ 또는 ‘원수들이 바라는 대로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복 있는 사람은
  alternatives_korean:
  - 복되다
  - 행복한 사람은
  - 복을 받은 사람은
  lexicon: HALOT
  rationale: 히브리어 복의 선언형을 한국어에서는 자연스러운 축복 선언인 ‘복 있는 사람’으로 옮겨, 지혜시의 어조와 품격을 살렸습니다.
- source_word: מַשְׂכִּיל אֶל
  english_pob_choice: the one who considers
  chosen_korean: 헤아립니다
  alternatives_korean:
  - 잘 생각합니다
  - 지혜롭게 대합니다
  - 가련한 이를 살핍니다
  lexicon: HALOT
  rationale: מַשְׂכִּיל은 단순한 지적 이해가 아니라 분별 있게, 사려 깊게 대하는 뜻이므로 ‘헤아리다’로 옮겨 가난한 사람을 향한 신중한 관심을 드러냈습니다.
- source_word: דָּל
  english_pob_choice: the poor
  chosen_korean: 가난한 이
  alternatives_korean:
  - 가난한 사람
  - 약한 이
  - 궁핍한 이
  lexicon: HALOT
  rationale: דָּל은 경제적 가난뿐 아니라 사회적 취약성을 포함하므로, 한국어에서는 교회식 용어보다 직접적인 ‘가난한 이’가 본문 범위를 잘 드러냅니다.
- source_word: בְּיוֹם רָעָה
  english_pob_choice: in the day of trouble
  chosen_korean: 재난의 날
  alternatives_korean:
  - 환난의 날
  - 악한 날
  - 고난의 날
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악이 아니라 재난·곤란을 가리키므로, ‘재난의 날’이 오해를 줄이면서 원문의 긴박함을 전달합니다.
- source_word: יְמַלְּטֵהוּ
  english_pob_choice: will deliver him
  chosen_korean: 건져내십니다
  alternatives_korean:
  - 구해 주십니다
  - 도망하게 하십니다
  - 구출하십니다
  lexicon: HALOT
  rationale: 피엘형 מלט은 위험에서 건져내는 구출을 뜻하므로, 존대 종결을 사용한 ‘건져내십니다’가 시편의 강한 구원 약속을 자연스럽게 담습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 언약의 고유명사를 직역 관습어로 바꾸지 않고, 소스 원문에 따라 신명기적 전통을 드러내는 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 대표 단수와 대명사 유지
  chosen_reading: ‘복 있는 사람은 … 그를’처럼 단수형을 유지했습니다.
  alternative_readings:
  - 복 있는 사람들은 … 그들을
  - 복 있는 자는 … 그 사람을
  rationale: 히브리어가 대표 단수와 남성 단수 접미를 사용하므로, 한국어에서도 일반화한 복수로 바꾸지 않고 약속의 형식을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
- issue: ‘악’의 도덕화 방지
  chosen_reading: ‘재난의 날’로 옮겨 심판·곤란의 맥락을 살렸습니다.
  alternative_readings:
  - 악의 날
  - 악한 날
  rationale: 문맥상 רָעָה는 도덕적 악이 아니라 닥쳐오는 재앙이므로, 신학적으로 오해될 수 있는 도덕적 표현을 피했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, points 1 and 3
