  preserved_meaning: Paul uses his boasting concerning the Corinthians in an oath-like assurance.
  reasoning_layer_used: lexical and theological decisions for νὴ and καύχησις
  rationale: The recast wording explains the oath force and identifies Paul as the one boasting while retaining the debated construction in a footnote.
