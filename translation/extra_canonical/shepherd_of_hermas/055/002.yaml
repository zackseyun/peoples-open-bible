translation:
  text: “Those sheep you saw not skipping but grazing in one place—these are the ones who have handed themselves over to luxuries and deceptions, yet they have not blasphemed the Lord at all. These, then, have been corrupted from the truth; in them there is hope of repentance[a], by which they can live. Corruption, then, has hope of a certain renewal, but death has eternal destruction.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
