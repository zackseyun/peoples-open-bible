translation:
  text: What must you do? You will not have to hide on the day of great judgment, and you will not be found like
    sinners. Eternal judgment will be away from you for all the generations of the world.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The final expression is more literally “judgment ... will be from you.” “Away from you” expresses the
      separating force of “from”; no additional punishment of the righteous is supplied.
