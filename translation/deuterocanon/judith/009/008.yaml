    prior_rendering: to cast down with the sword the horn of your altar
    new_rendering: to strike down the horn of your altar with the sword
    rationale: “Strike down” conveys the violent destruction naturally, while retaining the concrete altar feature and the established interpretation of iron as a weapon.
