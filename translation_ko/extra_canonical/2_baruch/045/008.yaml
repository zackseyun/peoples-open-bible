review_pass:
  verdict: revise
  source_fidelity: 열거된 동사들과 목적어는 대체로 충실히 옮겼습니다. 다만 ܐܦܢܘ의 재귀적 ‘돌아서다’는 ‘치우치다’보다 직접적으로 옮기는 편이 좋습니다. 또한 제공된 시리아어 전사에는 ‘고난’으로 읽힐 가능성이 있는 형태가 보이지만, 영어 감사 기록은 원어를 ‘어둠’으로 판정하므로 본문은 ‘어둠’을 유지하고 그 이문 가능성은 각주로 보존합니다.
  naturalness: ‘스스로 흑암에 치우쳐’는 다소 문어적이고 ‘치우치다’가 원문의 방향 전환보다 편향의 뜻을 강하게 냅니다. ‘어둠으로 돌아서서’와 ‘소망의 확고함’이 현대 표준어 합쇼체의 문맥에서 더 자연스럽습니다. 절 끝의 ‘자들은’은 다음 절에 이어지는 원문의 미완결 열거를 보존합니다.
  terminology: ܪ̈ܚܡܐ는 현대어에서 ‘자비’가 자연스럽고, ܡܕܪܗ ܕܡܘܣܪ는 ‘훈계의 길’로 유지할 수 있습니다. ‘어둠’은 ‘흑암’보다 현대적이면서도 원문의 핵심 대조를 보존합니다.
  issues:
  - severity: medium
    issue: ‘스스로 흑암에 치우쳐’
    rationale: 원문의 ‘돌아서다/향하다’보다 ‘편향되다’라는 해석을 더하며, ‘흑암’은 현대 한국어에서는 불필요하게 고어적입니다.
  - severity: low
    issue: ‘소망의 굳건함’
    rationale: 의미는 통하지만 ‘소망의 확고함’이 ‘settledness’의 안정·확정의 뉘앙스를 더 자연스럽게 전달합니다.
  - severity: low
    issue: ‘긍휼’
    rationale: 전통 종교 어휘로는 가능하나, 원문의 일반적 ‘mercy’에는 ‘자비’가 현대 표준어로 더 직접적입니다.
  revised_text: 그러나 어둠으로 돌아서서 거짓을 받아들이고, 소망의 확고함을 잃고, 헛된 것을 추구하며, 자비를 베풀지 않고, 훈계의 길을 지키지 않는 자들은[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘고난으로 돌아서서’. 제공된 시리아어 전사의 해당 어형은 이렇게 읽힐 가능성도 있으나, 본문은 원어 검토 기록의 ‘어둠’ 판정을 따릅니다.
    reason: ‘어둠’과 ‘고난’ 사이의 전사·독해상 불확실성을 본문 의미를 바꾸지 않고 보존합니다.
  revision_rationale: 직역적이되 자연스러운 현대 합쇼체로 다듬었습니다. 원문의 연속된 분사/관계절 열거와 다음 절로 이어지는 미완결 구문을 유지했습니다. ‘어둠’은 영어 감사 기록의 원어 판정을 따르되, 제공된 원문 전사와의 긴장을 각주로 밝혔습니다.
