  from: Be exalted[a], O Yahweh, in your strength! We will sing and make music to your might.
  to: Be exalted[a], O Yahweh, in your strength! We will sing and make music of your might.
  rationale: The imperative of רום can idiomatically be rendered “Be exalted”; English passive form here does not constitute a source-level voice error, and it fittingly expresses the psalm’s petition that Yahweh be shown high. “Rise up” narrows the verb to spatial movement. The music celebrates Yahweh’s might, so “of your might” is natural poetic English; “to your might” wrongly presents the attribute as the recipient, while “about” is less suited to the psalmic register.
