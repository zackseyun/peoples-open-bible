  category: meaning_retranslation
  from: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
  to: When they measured it by the omer, those who had gathered much had no surplus, and those who had gathered little lacked nothing; each had gathered as much as they needed to eat.
  rationale: The record correctly treats the final clause as a statement of sufficient provision and recognizes the distributive expression as inclusive. I clarified surplus at measurement while leaving unexplained, as the verse does, how the differing quantities became sufficient.
