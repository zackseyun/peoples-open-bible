id: JOB.6.15
reference: Job 6:15
source:
  edition: WLC
  text: אַ֭חַ/י בָּגְד֣וּ כְמוֹ נָ֑חַל כַּ/אֲפִ֖יק נְחָלִ֣ים יַעֲבֹֽרוּ־׃
translation:
  text: My brothers[a] have dealt treacherously like a seasonal stream, like streams overflowing their channels,
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Here “brothers” is a term of close companionship, referring to Job's friends.
    reason: cultural_note
lexical_decisions:
- source_word: אַחַי
  chosen: my brothers
  alternatives:
  - my kin
  - my friends
  lexicon: HALOT
  rationale: The noun literally means 'my brothers.' In Job's lament it may extend beyond biological siblings to close companions, but the Hebrew term itself is familial. Per gender-accurate policy, 'brothers' is retained rather than neutralizing to 'siblings' or interpreting as 'friends' in the main text.
- source_word: בָּגְדוּ
  chosen: have dealt treacherously
  alternatives:
  - have acted deceitfully
  - have been faithless
  - have betrayed
  lexicon: HALOT
  rationale: The verb בגד commonly conveys acting treacherously or faithlessly, often in covenantal or relational contexts. 'Have dealt treacherously' preserves the moral force without over-specifying a single act of betrayal.
- source_word: כְמוֹ
  chosen: like
  alternatives:
  - as
  lexicon: HALOT
  rationale: Standard comparative particle; 'like' is natural modern English.
- source_word: נָחַל
  chosen: a wadi
  alternatives:
  - a brook
  - a streambed
  - a torrent
  lexicon: HALOT
  rationale: The surrounding description concerns a seasonal watercourse; “wadi” is contextually apt, with the broader rendering “stream” retained in the note.
- source_word: כַאֲפִיק
  chosen: like the channels of
  alternatives:
  - like the beds of
  - like the ravines of
  lexicon: HALOT
  rationale: אפיק refers to a channel, bed, or course through which water runs. 'Channels of' fits the hydrological metaphor and reads smoothly with the following plural noun.
- source_word: נְחָלִים
  chosen: wadis
  alternatives:
  - streams
  - brooks
  - torrents
  lexicon: HALOT
  rationale: The repeated term is rendered consistently within the seasonal-watercourse simile.
- source_word: יַעֲבֹרוּ
  chosen: overflow
  alternatives:
  - overflow
  - pass on
  - vanish
  lexicon: HALOT
  rationale: In the immediate cold-season scene, the verb depicts the watercourses running over or overflowing rather than their later disappearance under heat.
