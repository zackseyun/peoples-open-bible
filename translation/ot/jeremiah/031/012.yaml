  meaning: The returning people will rejoice at Zion over Yahweh’s abundant provision, and their whole life will flourish instead of languishing in sorrow.
  meaning_decisions:
  - source_phrase: וְנָהֲרוּ אֶל טוּב יְהוָה
    prior_rendering: they will stream to the goodness of Yahweh
    new_rendering: they will stream toward the bounty of Yahweh
    rationale: The following list identifies goodness here as Yahweh’s generous provision. Bounty makes that concrete sense immediately clear while retaining the streaming image.
  - source_phrase: יִצְהָר
    prior_rendering: fresh oil
    new_rendering: fresh olive oil
    rationale: Olive identifies the agricultural product that the first hearers understood, avoiding the broader modern meanings of oil.
  - source_phrase: וְהָיְתָה נַפְשָׁם כְּגַן רָוֶה
    prior_rendering: Their life will be like a well-watered garden
    new_rendering: Their souls will be like a well-watered garden
    rationale: The garden describes the flourishing of the whole living self, including its inner life. Souls preserves that depth and the weight of the image without implying a disembodied existence.
  - source_phrase: וְלֹא יוֹסִיפוּ לְדַאֲבָה עוֹד
    prior_rendering: they will never again waste away
    new_rendering: they will never again languish in sorrow
    rationale: The verb includes grief and pining, as the following verse’s mourning and comfort confirm. The new wording preserves the weakening effect of sorrow rather than suggesting only physical wasting.
