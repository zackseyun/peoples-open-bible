  yaml_path: translation/ot/jeremiah/016/009.yaml
  text: 'For thus says Yahweh of Armies[a], the God of Israel: Behold, I am about to put an end, from this place before your eyes and in your days, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride.'
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. “보십시오, 내가 곧 여러분의 눈앞에서, 여러분이 살아 있는 동안 이곳에서 기쁨의 소리와 즐거움의 소리, 신랑의 목소리와 신부의 목소리를 그치게 하겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘만군의 여호와’로도 옮깁니다.
    reason: lexical_alternative
