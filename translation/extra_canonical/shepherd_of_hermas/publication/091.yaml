- category: publication_review_correction
  rationale: Reconsideration of the prior lexical characterization of the reported Athos alternative.
    The supplied Greek selects ἀνενέωσε, while the attributed apparatus reports ἀνένευσε A. These are
    not established same-meaning grammatical variants. Retain the main-text reading and the distinction
    between renewal of spirit and life, but disclose the exact alternative and the evidentiary limit without
    claiming fresh manuscript access.
- category: publication_review_correction
  rationale: 'Reconsideration of the prior lexical characterization of repentance: paragraphs 1–2 connect
    repentance with abandoning desires and works, while paragraph 3 attributes renewal to the Lord. The
    Greek does not make restored hope a component of repentance. Preserve the valid singular/plural disclosure
    and distinguish renewal of the spirit from renewal of life under the stated condition of having no
    hope of living.'
