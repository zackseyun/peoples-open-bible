id: JOB.7.10
reference: Job 7:10
source:
  edition: WLC
  text: לֹא יָשׁ֣וּב ע֣וֹד לְ/בֵית֑/וֹ וְ/לֹא יַכִּירֶ֖/נּוּ ע֣וֹד מְקֹמֽ/וֹ־־׃
translation:
  text: He will not return to his house again, and his place will no longer recognize him.
  philosophy: dynamic
lexical_decisions:
- source_word: יָשׁוּב
  chosen: will not return
  alternatives:
  - go back
  - come back
  lexicon: HALOT
  rationale: The imperfect naturally carries forward the future-oriented description.
- source_word: עוֹד (first occurrence)
  chosen: again
  alternatives:
  - any longer
  - any more
  lexicon: HALOT
  rationale: Retains the temporal force in idiomatic English placement.
- source_word: לְבֵיתוֹ
  chosen: to his house
  alternatives:
  - to his home
  lexicon: HALOT
  rationale: בַּיִת is literally 'house,' and here likely refers concretely to the man's household dwelling. 'House' preserves the Hebrew image better than the more interpretive 'home.'
- source_word: יַכִּירֶנּוּ
  chosen: will ... recognize him
  alternatives:
  - recognizes him
  - acknowledges him
  lexicon: HALOT
  rationale: “Recognize” is the more precise natural sense with the personified subject.
- source_word: עוֹד (second occurrence)
  chosen: no longer
  alternatives:
  - again
  - any longer
  lexicon: HALOT
  rationale: Naturally renders the negated temporal expression.
- source_word: מְקֹמוֹ
  chosen: his place
  alternatives:
  - his dwelling place
  - the place where he was
  lexicon: HALOT
  rationale: מָקוֹם means 'place.' In this poetic context it refers to the location associated with the person, likely his accustomed dwelling or place in life. 'His place' is both faithful and concise, preserving the personification.
