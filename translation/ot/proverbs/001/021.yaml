id: PRO.1.21
reference: Proverbs 1:21
source:
  edition: WLC
  text: בְּ/רֹ֥אשׁ הֹמִיּ֗וֹת תִּ֫קְרָ֥א בְּ/פִתְחֵ֖י שְׁעָרִ֥ים בָּ/עִ֗יר אֲמָרֶ֥י/הָ תֹאמֵֽר׃
translation:
  text: 'At the head of the bustling streets[a] she cries out; at the entrances of the city gates she speaks:'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “at the height of the commotion”; the Hebrew may describe a prominent location in the busy streets or the most tumultuous part of a public gathering.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/רֹאשׁ
  chosen: At the head of
  alternatives:
  - On the top of
  - At the foremost part of
  lexicon: HALOT
  rationale: Preserves the phrase’s spatial sense of a head, foremost point, or prominent position rather than reducing it to intensity alone.
- source_word: הֹמִיּוֹת
  chosen: the bustling streets
  alternatives:
  - the tumultuous places
  - the crowds
  - the commotion
  lexicon: HALOT
  rationale: Represents the noisy or tumultuous public ways indicated by the feminine plural form and the urban context, while the note preserves the less concrete construal “commotion.”
- source_word: תִּקְרָא
  chosen: she cries out
  alternatives:
  - she calls
  - she proclaims
  lexicon: HALOT
  rationale: קרא commonly means 'call' or 'cry out.' In Wisdom's public address, the louder and more urgent 'cries out' best fits the context and parallels the following speech verb.
- source_word: בְּ/פִתְחֵי
  chosen: at the entrances of
  alternatives:
  - at the openings of
  - in the doorways of
  lexicon: HALOT
  rationale: פֶּתַח refers to an opening or entrance. 'Entrances' is idiomatic with city gates and preserves the locative force of the preposition.
- source_word: שְׁעָרִים
  chosen: the gates
  alternatives:
  - the gate complexes
  lexicon: HALOT
  rationale: שְׁעָרִים are city gates, the recognized public places of gathering and judgment. 'Gates' is the standard and sufficient rendering.
- source_word: בָּ/עִיר
  chosen: in the city
  alternatives:
  - within the city
  lexicon: HALOT
  rationale: The phrase locates the gates as belonging to the city sphere. Keeping 'in the city' reflects the Hebrew straightforwardly and reads naturally in English.
- source_word: אֲמָרֶי/הָ
  chosen: her words
  alternatives:
  - her sayings
  - what she says
  lexicon: HALOT
  rationale: The plural construct of אמר with suffix means 'her words/sayings.' 'Her words' is simple, direct, and preserves the lexical connection to speech.
- source_word: תֹאמֵר
  chosen: she speaks
  alternatives:
  - she says
  - she declares
  lexicon: HALOT
  rationale: אמר is the common verb 'to say.' Because 'says her words' is awkward in English, 'she speaks her words' preserves both the verbal action and the explicit object without over-paraphrasing.
- source_word: אֲמָרֶי/הָ תֹאמֵר
  chosen: she speaks
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Renders the Hebrew cognate-object speech expression in natural English before the direct quotation.
