lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 인도자에게
  - 찬양대장에게
  lexicon: HALOT
  rationale: 시편 표제의 מוסיק적 지시를 현대 한국어로 자연스럽게 옮기되, 특정 직분을 과도하게 좁히지 않기 위해 ‘지휘자에게’로 처리했습니다.
- source_word: בִּנְגִינ֗וֹת
  english_pob_choice: with stringed instruments
  chosen_korean: 현악기 반주로
  alternatives_korean:
  - 현악기로
  - 현악기와 함께
  - 줄악기 반주로
  lexicon: HALOT
  rationale: ‘נְגִינוֹת’은 현악기/현악 연주를 가리키므로, 공연 지시로서의 기능이 드러나도록 ‘반주로’라고 옮겼습니다.
- source_word: מִזְמ֥וֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  - 찬가
  lexicon: HALOT
  rationale: 표제어의 장르 표지를 한국어로 간결하게 살려 ‘시’로 옮겼습니다. 본문은 시편 전체의 장르 표기이므로 ‘시편’보다 제목 기능이 분명합니다.
- source_word: לְדָוִֽד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗이 지은
  - 다윗을 위한
  - 다윗에게
  lexicon: HALOT
  rationale: 히브리어 전치사 לְ는 저작, 귀속, 헌납을 모두 열어 두므로, 전통적이면서도 의미 범위를 좁히지 않는 ‘다윗의’로 처리했습니다.
theological_decisions:
- issue: לְדָוִד의 귀속 의미를 저작으로 단정할지 여부
  chosen_reading: ‘다윗의’로 두어 저작·귀속·헌납의 폭을 열어 둡니다.
  alternative_readings:
  - 다윗이 지은
  - 다윗을 위한
  rationale: 표제가 역사적 저자를 확정하는지 텍스트만으로 단정할 수 없으므로, 본문의 모호성을 보존하는 번역이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
