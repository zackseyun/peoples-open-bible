  source_fidelity: 원문의 수동 과거형 συνηθροίσθησαν은 백성 가운데 많은 이들이 ‘그들에게 모여든’ 사건을 나타내며, πᾶς ὁ ἐγκαταλείπων은 그들 모두가 율법을 버리고 있던 사람들이라는 동격적 규정을 이룹니다. 초안도 의미를 대체로 보존하지만, 문장 연결을 더 분명히 할 수 있습니다.
