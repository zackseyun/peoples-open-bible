id: PSA.24.10
reference: Psalms 24:10
source:
  edition: WLC
  text: מִ֤י ה֣וּא זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְהוָ֥ה צְבָא֑וֹת ה֤וּא מֶ֖לֶךְ הַ/כָּב֣וֹד סֶֽלָה׃
translation:
  text: Who is this King of glory? Yahweh of hosts[a]—he is the King of glory. Selah
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “Hosts” means armies or vast forces; the title presents Yahweh as their sovereign commander.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הוּא זֶה
  chosen: Who is this
  alternatives:
  - Who is he, this...?
  lexicon: HALOT
  rationale: The Hebrew interrogative plus pronoun and demonstrative forms an emphatic question. 'Who is this' is idiomatic English and preserves the rhetorical force without awkwardness.
- source_word: מֶלֶךְ
  chosen: King
  alternatives:
  - king
  lexicon: HALOT
  rationale: Standard gloss for מלך. Capitalized in English because it functions as a divine title here.
- source_word: הַכָּבוֹד
  chosen: of glory
  alternatives:
  - the glorious king
  - of honor
  lexicon: HALOT
  rationale: The construct phrase מֶלֶךְ הַכָּבוֹד is most naturally rendered 'King of glory.' This preserves the Hebrew genitival construction and the established sense of כבוד as glory, weight, honor.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: צְבָאוֹת
  chosen: of hosts
  alternatives:
  - of armies
  lexicon: HALOT
  rationale: In the title יְהוָה צְבָאוֹת, 'hosts' is the standard and suitably broad rendering, encompassing heavenly armies and ordered powers. 'Armies' is possible but narrower and less idiomatic in this divine title.
- source_word: הוּא
  chosen: he is
  alternatives:
  - he alone is
  lexicon: HALOT
  rationale: The pronoun is explicit and emphatic in Hebrew. Rendering it as 'he is' preserves the identification and emphasis without adding exclusivity not overtly marked in the text.
- source_word: סֶלָה
  chosen: Selah
  lexicon: HALOT
  rationale: The term's precise meaning is uncertain; retaining the transliteration is the most transparent and least interpretively loaded approach.
