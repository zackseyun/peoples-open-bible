review_pass:
  verdict: revise
  source_fidelity: 히브리어 원문은 ‘우리는 너를 묶어 블레셋 사람들의 손에 넘기려고 내려왔다’와 ‘너희가 바로 나를 치지 않겠다고 내게 맹세하라’라는 뜻입니다. 본문 번역은 두 절의 핵심 의미와 ‘너희’의 강조를 대체로 충실히 반영합니다. 다만 אַתֶּם의 강조는 한국어에서 ‘너희 자신들이’보다 ‘너희가 직접’이 더 자연스럽고 정확하게 전달합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘너희 자신들이’는 중복적이고 다소 부자연스러우므로 ‘너희가 직접’으로 고치는 것이 좋습니다. 각주 표지는 해당 표현 바로 뒤에 두어 적용 범위를 분명히 해야 합니다.
  terminology: ‘묶어’, ‘블레셋 사람들의 손에 넘기려는’, ‘맹세하십시오’, ‘공격하지 않다’는 문맥과 격식에 적절합니다. ‘공격하다’는 פגע의 이 문맥상 폭력적 의미를 무리 없이 반영합니다.
  issues:
  - severity: low
    issue: ‘너희 자신들이’의 표현
    rationale: אַתֶּם은 앞선 2인칭 복수 동사에 덧붙은 강조이지만, 한국어 ‘너희 자신들이’는 어색하고 행위자 강조가 과도하게 중복됩니다. ‘너희가 직접’이 원문의 대조적 강조를 자연스럽게 보존합니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 각주는 ‘블레셋 사람들의 손에 넘기다’라는 관용 표현을 설명하므로, 현재처럼 삼손의 발화 끝에 붙이기보다 해당 절 끝에 붙여야 합니다.
  revised_text: 그들이 그에게 말했습니다. “우리가 내려온 것은 당신을 묶어 블레셋 사람들의 손에 넘기려는 것입니다.”[a] 삼손이 그들에게 말했습니다. “너희가 직접 나를 공격하지 않겠다고 내게 맹세하십시오.”
