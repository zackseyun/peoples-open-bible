  rationale: The words ἀλλοτριότης and ἀλλοτρία here refer to the enemy's status as a Gentile foreigner (Pompey), not a fallen-away Jew. 'Estrangement' and 'estranged' strongly imply a previous covenant relationship that was broken. Translating with 'alien' or 'foreigner' correctly captures the author's emphasis on the invader's non-Jewish status (cf. PsSol 17:7, where Pompey is 'a man alien to our race').
