lexical_decisions:
- source_word: ηὐφράνθη
  chosen: rejoiced
  alternatives:
  - was gladdened
  - celebrated
  lexicon: LSJ
  rationale: Aorist passive of εὐφραίνω here functions naturally as an intransitive/passive sense, expressing the people's joyful response. 'Rejoiced' is idiomatic English and preserves the emotional force without overparaphrase.
- source_word: ὁ λαός
  chosen: the people
  alternatives:
  - the people of Israel
  - the populace
  lexicon: LSJ
  rationale: The Greek says simply 'the people.' While the narrative context identifies the Jewish people, the verse itself does not restate 'of Israel,' so the simpler rendering best matches the source.
- source_word: σφόδρα
  chosen: greatly
  alternatives:
  - very much
  - exceedingly
  lexicon: LSJ
  rationale: σφόδρα intensifies the rejoicing. 'Greatly' is natural in English and fits the elevated but readable style of the narrative.
- source_word: ἦγαγον
  chosen: they made
  alternatives:
  - they kept
  - they observed
  - they held
  lexicon: LSJ
  rationale: Literally 'they led/brought,' but in the idiom ἄγειν ἡμέραν it means to keep or celebrate a day. 'They made that day a day of great gladness' preserves the Hebrew/Greek idiomatic structure while remaining understandable.
- source_word: τὴν ἡμέραν ἐκείνην
  chosen: that day
  alternatives:
  - that very day
  lexicon: LSJ
  rationale: Straightforward demonstrative phrase; 'that day' is the natural English equivalent.
- source_word: ἡμέραν εὐφροσύνης μεγάλην
  chosen: a day of great gladness
  alternatives:
  - a day of great rejoicing
  - a great day of festivity
  lexicon: LSJ
  rationale: εὐφροσύνη denotes gladness, merriment, or festal joy. 'Gladness' avoids awkward repetition with the earlier 'rejoiced' while preserving the semantic field of joy.
