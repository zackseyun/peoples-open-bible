  alternative_readings:
  - 반말형 탄식
  - 더 격식적인 기도문 어투
  rationale: 시편의 탄식이면서도 야훼를 직접 호명하는 기도체이므로, 현대 합쇼체 안에서 하나님께 드리는 공손한 직접 화법을 유지했습니다.
  doctrine_reference: 시편 탄식의 기도적 발화 양식
