translation:
  text: The moon makes three months of thirty days each; at its appointed times, when it wanes, it makes three months of thirty-nine[a] days each. In these it completes its waning during nine first periods and eleven first portals, over twelve days—one hundred and seventy-seven[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Ge'ez gives thirty-nine days here. A total of 177 days would instead require three months of twenty-nine days alongside three of thirty.
    reason: alternative_reading
  - marker: b
    text: The closing numbers and the word rendered 'portals' are unclear in the Ge'ez; their relationship cannot be determined securely.
    reason: alternative_reading
lexical_decisions:
- source_word: ሠለስተ
  chosen: three
  alternatives: []
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Cardinal numeral; straightforwardly rendered as 'three'.
- source_word: ወርኀ
  chosen: months
  alternatives:
  - month
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The noun means 'month'; with the preceding numeral it is best rendered in English as plural, 'three months'.
- source_word: ይገብር
  chosen: make
  alternatives:
  - amount to
  - complete
  - produce
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The verb commonly means 'do/make'; in a calendrical calculation 'make' preserves the concrete idiom while still being intelligible in English.
- source_word: ፴መዋዕለ
  chosen: thirty days
  alternatives:
  - thirty day-periods
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The numeral-sign plus the plural of 'day' yields 'thirty days.' This keeps the calendrical precision of the Astronomical Book.
- source_word: በአዝማነ
  chosen: in its time
  alternatives:
  - in its seasons
  - at its appointed times
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The term can denote times or seasons. Here the singular English idiom 'in its time' fits the immediate reference to the cycle under discussion, while a footnote preserves the seasonal nuance.
- source_word: ዚአሁ
  chosen: its
  alternatives:
  - his
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The pronominal suffix refers back to the calendrical/luminary cycle, not a personal masculine referent, so 'its' is preferable.
- source_word: ሶበ
  chosen: when
  alternatives:
  - as
  - at the time that
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Temporal conjunction introducing the clause naturally rendered 'when'.
- source_word: ታኀጻጺተ
  chosen: reckoning is completed
  alternatives:
  - calculation is completed
  - account is arranged
  - computation is finished
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The form appears to denote an ordering, calculation, or reckoning brought to completion. In this astronomical context, 'reckoning is completed' best preserves the technical calendrical sense without over-paraphrase.
