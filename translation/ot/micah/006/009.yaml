id: MIC.6.9
reference: Micah 6:9
source:
  edition: WLC
  text: ק֤וֹל יְהוָה֙ לָ/עִ֣יר יִקְרָ֔א וְ/תוּשִׁיָּ֖ה יִרְאֶ֣ה שְׁמֶ֑/ךָ שִׁמְע֥וּ מַטֶּ֖ה וּ/מִ֥י יְעָדָֽ/הּ׃
translation:
  text: 'The voice of Yahweh cries out to the city—and it is sound wisdom to fear your name[a]: Heed the rod and him who appointed it[b].'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew text as vocalized reads “sound wisdom sees your name”. The ancient Greek translation and most interpreters read “fear”.
    reason: textual_variant
  - marker: b
    text: Or “Hear, O tribe, and who has appointed it?” The Hebrew word means both “rod” and “tribe”, and the end of this line is uncertain.
    reason: alternative_reading
