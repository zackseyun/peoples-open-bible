theological_decisions:
- issue: Rendering of כְּבַר אֱנָשׁ in a messianically significant vision
  chosen_reading: one like a son of man
  alternative_readings:
  - one like a human being
  - one like a man
  rationale: The comparative human likeness and singular grammar are retained without identifying the figure. Human-being wording is a valid idiomatic alternative, not a theological flattening. Main son-of-man wording preserves the source idiom but does not establish a later title or Christological conclusion.
  doctrine_reference: Translation philosophy §§1, 3, 4
- issue: Rendering of עִם עֲנָנֵי שְׁמַיָּא
  chosen_reading: with the clouds of heaven
  alternative_readings:
  - 'selected RH2006 Old Greek: upon the clouds'
  rationale: With represents the retained Aramaic preposition. The selected RH2006 OG instead has upon, disclosed as a versional contrast. This rendering choice does not demonstrate Aramaic historical priority or make all Greek forms uniform.
  doctrine_reference: Translation philosophy §§1, 3
