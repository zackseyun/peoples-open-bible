  rationale: The Hebrew presents God as the direct agent of covenant judgment through a sequence of predator images. The translation preserves this theological severity rather than resolving the tension by euphemism.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
