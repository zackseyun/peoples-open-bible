base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/002.yaml
  text: And lodging there[a], he tasted no bread and drank no water[b], mourning over the great lawless deeds of the multitude.
  footnotes:
  - marker: a
    text: Or 'camping there' or 'spending the night there.' The Greek participle denotes staying overnight in that place.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew parallel in Ezra 10 describes the specific offense as taking foreign wives; the Greek here summarizes it more generally as 'lawless deeds.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그는 그곳에 묵은 채[a] 빵을 맛보지도 않고 물을 마시지도 않으며, 그 무리가 저지른 중대한 불법 행위들을 슬퍼하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그곳에서 밤을 지내며’ 또는 ‘그곳에 머물며’. 그리스어 분사는 그곳에서 하룻밤을 지내거나 머문다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 병행본문인 에스라 10장은 이 죄들을 이방 아내들을 취한 일로 더 구체적으로 묘사하지만, 그리스어 본문은 이를 ‘중대한 불법 행위들’이라고 더 일반적으로 요약합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλισθεὶς
  english_pob_choice: lodging
  chosen_korean: 묵으면서
  alternatives_korean:
  - 잠자면서
  - 야영하면서
  - 그곳에서 밤을 지내면서
  lexicon: LSJ
  rationale: αὐλίζομαι는 어떤 곳에서 하룻밤 머무는 뜻이므로, 현대 한국어에서 자연스럽고 임시 체류의 뉘앙스를 살리는 ‘묵으면서’로 옮겼습니다.
- source_word: ἄρτον
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 음식
  lexicon: LSJ
  rationale: 직역하면 ‘빵’이며, 금식 문맥에서 구체적 먹을거리를 가리키는 표현을 유지하는 것이 원문에 가깝습니다.
- source_word: οὐκ ἐγεύσατο
  english_pob_choice: tasted no
  chosen_korean: 맛보지 않았고
  alternatives_korean:
  - 먹지 않았고
  - 입에 대지 않았고
  lexicon: BDAG
  rationale: γεύομαι의 기본 의미인 ‘맛보다’를 살리되, 한국어에서는 ‘맛보지 않았고’가 금식의 절제를 자연스럽게 드러냅니다.
- source_word: ἀνομιῶν τῶν μεγάλων
  english_pob_choice: the great lawless deeds
  chosen_korean: 큰 불법 행위
  alternatives_korean:
  - 큰 불법들
  - 큰 무법 행위
  - 중대한 불법 행위
  lexicon: BDAG
  rationale: ἀνομία는 단순한 잘못이 아니라 율법과 질서를 거스르는 행위를 뜻하므로, 전통적 종교어휘보다 원문의 법적·도덕적 긴장을 드러내는 ‘불법 행위’를 택했습니다.
theological_decisions:
- issue: 히브리어 병행본문이 더 구체적이지만 그리스어 본문은 일반화된 표현을 사용함
  chosen_reading: ‘큰 불법 행위’로 그리스어의 일반화된 서술을 따랐습니다.
  alternative_readings:
  - ‘이방 아내들을 취한 일’처럼 병행 히브리어의 구체 내용을 반영하는 읽기
  rationale: 이 절의 직접 원천은 그리스어 본문이며, 병행 히브리어는 여기서 더 구체적인 사례를 제시합니다. 본문은 원문이 일반화한 죄의 성격을 유지하면서도 각주로 병행 차이를 안내하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
