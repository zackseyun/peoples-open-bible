id: PRO.25.20
reference: Proverbs 25:20
source:
  edition: WLC
  text: מַ֥עֲדֶה בֶּ֨גֶד בְּ/י֣וֹם קָ֭רָה חֹ֣מֶץ עַל נָ֑תֶר וְ/שָׁ֥ר בַּ֝/שִּׁרִ֗ים עַ֣ל לֶב רָֽע׀־־׃פ
translation:
  text: Singing cheerful songs to a troubled heart is like taking away a garment on a cold day, and like vinegar on alkali[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The substance is natron, a naturally occurring mineral alkali used for washing; it reacts and foams when mixed with vinegar.
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲדֶה
  chosen: one who takes off
  alternatives:
  - one who removes
  - one who loosens
  lexicon: HALOT
  rationale: The form is best taken from עדה in the sense of removing or taking off clothing. In context with 'garment' and 'cold day,' the image is of stripping away needed warmth, an aggravating act. 'Takes off' is idiomatic modern English and preserves the concrete comparison.
- source_word: בֶּגֶד
  chosen: a garment
  alternatives:
  - clothing
  - a coat
  lexicon: HALOT
  rationale: A general term for clothing. 'Garment' keeps the proverb's concise, proverbial tone without over-specifying the item.
- source_word: בְּיוֹם קָרָה
  chosen: on a cold day
  alternatives:
  - in a day of cold
  - when it is cold
  lexicon: HALOT
  rationale: A straightforward temporal phrase. 'On a cold day' is natural English and preserves the situational force.
- source_word: חֹמֶץ
  chosen: vinegar
  lexicon: HALOT
  rationale: Standard lexical sense; no need to expand.
- source_word: נָתֶר
  chosen: alkali
  alternatives:
  - alkali
  - natron
  lexicon: HALOT
  rationale: A mineral alkaline substance; “alkali” avoids false precision associated with modern “soda.”
- source_word: וְשָׁר בַּשִּׁרִים
  chosen: one who sings songs
  alternatives:
  - one who sings a song
  - a singer of songs
  lexicon: HALOT
  rationale: The participle plus plural noun expresses the act/habit of singing songs. The plural is retained to reflect the Hebrew form and the generalized action.
- source_word: עַל לֶב רָע
  chosen: to a troubled heart
  alternatives:
  - to a sad heart
  - over an afflicted heart
  - to an unhappy heart
  lexicon: HALOT
  rationale: Literally 'upon an evil/bad heart,' but in wisdom usage the phrase refers to an inwardly distressed, sorrowful condition rather than moral evil. 'Troubled heart' communicates the emotional state in clear modern English without implying wickedness.
- source_word: מַעֲדֶה בֶּגֶד
  chosen: one who takes off a garment
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: A defensible contextual reading that retains the participial comparison; the lexical uncertainty is noted.
