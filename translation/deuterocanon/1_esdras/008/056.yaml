  text: And he handed over to them, after weighing it out, six hundred fifty talents of silver, and silver vessels worth a
    hundred talents, and a hundred talents of gold, and twenty golden bowls[a], and ten vessels of fine gleaming bronze[b].
  philosophy: optimal-equivalence
