id: PRO.6.33
reference: Proverbs 6:33
source:
  edition: WLC
  text: נֶֽגַע וְ/קָל֥וֹן יִמְצָ֑א וְ֝/חֶרְפָּת֗/וֹ לֹ֣א תִמָּחֶֽה־׃
translation:
  text: He will receive injury and disgrace, and his reproach will not be wiped away.
  philosophy: dynamic
lexical_decisions:
- source_word: נֶגַע
  chosen: injury
  alternatives:
  - wound
  - affliction
  - blow
  - plague
  lexicon: HALOT
  rationale: “Injury” retains the concrete adverse-consequence sense without falsely limiting the noun to visible wounds.
- source_word: קָלוֹן
  chosen: disgrace
  alternatives:
  - dishonor
  - shame
  - ignominy
  lexicon: HALOT
  rationale: קָלוֹן denotes public dishonor or disgrace. 'Disgrace' communicates the social and moral shame clearly in modern English and pairs naturally with the preceding consequence term.
- source_word: יִמְצָא
  chosen: will receive
  alternatives:
  - will get
  - will encounter
  - will meet with
  lexicon: HALOT
  rationale: This gives the contextual sense of adverse consequences coming upon the offender.
- source_word: חֶרְפָּתוֹ
  chosen: his reproach
  alternatives:
  - his shame
  - his disgrace
  - his scorn
  lexicon: HALOT
  rationale: חֶרְפָּה often denotes reproach, taunt, or enduring shame before others. 'Reproach' preserves the public, lasting dimension better than the more internal 'shame.'
- source_word: לֹא תִמָּחֶה
  chosen: will not be wiped away
  alternatives:
  - will not be blotted out
  - will not be erased
  - will not be removed
  lexicon: HALOT
  rationale: The Niphal of מחה means to be wiped out, blotted out, or erased. 'Will not be wiped away' is vivid, close to the Hebrew image, and suitable for enduring disgrace.
