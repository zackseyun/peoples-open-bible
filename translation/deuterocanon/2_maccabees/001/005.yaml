  text: καὶ ὑπακούσαι ὑμῶν τῶν δεήσεων, καὶ καταλλαγείη ὑμῖν, καὶ μὴ ὑμᾶς ἐγκαταλίποι ἐν καιρῷ πονηρῷ.
