  from: So the decree went out[a], and the wise men were being killed[b]; and they sought Daniel and his companions to kill them.
  to: So the decree was issued, and the wise men were being executed[a]. The executioners also searched for Daniel and his companions to put them to death.
  rationale: The lexical record favors executions already underway, and that reading remains in the main text. Because the participle can also describe the fate prescribed by the decree, the prospective understanding is included as an alternative rather than overstating certainty.
