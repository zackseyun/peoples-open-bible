  - 레위가 살아 있는 동안의 나이는 백서른일곱 해였습니다
  lexicon: חַיִּים / שָׁנָה
  rationale: 직역적이되 현대 한국어에서 자연스럽게 읽히도록 ‘산 햇수’와 ‘해’를 사용해 생애의 총년수를 분명히 했습니다.
