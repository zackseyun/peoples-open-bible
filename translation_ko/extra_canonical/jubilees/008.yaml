translation:
  language: ko
  text: '1. 스물아홉째 희년, 그 첫째 주의 첫해에 아르박삿이 아내를 맞이하였습니다. 그녀의 이름은 라수에야였으며, 수산의 딸, 엘람의 딸이었습니다. 그녀는 그에게 아이를 낳았습니다.

    2. 그녀는 이 주간의 셋째 해에 그에게 아들을 낳아 주었고, 그는 그의 이름을 카이남이라 불렀습니다. 그리고 그 아이는 자랐습니다.

    3. 그의 아버지가 그에게 글쓰기를 가르쳤습니다. 그는 자신을 위하여 성읍을 차지할 곳을 찾으러 갔습니다. 그는 옛사람들이 바위에 새겨 놓은 글을 발견하고 그 안에 적힌 것을 읽었습니다. 그리고 그것을 옮겨 적었습니다. 또 그는 그 안에서 감시자들의 가르침이 들어 있음을 알게 되었는데, 그들은 그것으로 해의 징조를 살피곤 하였습니다.

    4. …그리고 달과 별들이 하늘의 모든 징조들 가운데 있었습니다. 그리고 그는 그것을 적어 두고는 그것에 대해 아무 말도 하지 않았습니다…

    5. 그는 그것 때문에 노아에게 말하기를 두려워했습니다. 그것 때문에 노아가 그에게 화를 낼까 염려했기 때문입니다. 그리고 다섯째 희년, 첫째 주의 첫째 해에 그는 아내를 맞이했는데, 그의 아내의 이름은 야벳의 아들 마다이의 딸 멜카였습니다. 그리고 그 주의 넷째 해에 그는 아들을 얻었고, 그 이름을 살라라고 하였습니다.

    6. 그가 “나는 참으로 보냄을 받았습니다”라고 말하였기 때문입니다. 넷째 해에 셀라가 태어나 자랐습니다. 그는 아내를 맞이하였는데, 그 아내의 이름은 멜카였고 셀라의 아버지의 형제인 케베드의 딸이었습니다. 이는 제31희년 제5주 첫째 해였습니다.

    7. 그리고 여섯째 해에 그녀가 그에게 아들을 낳고, 그는 그의 이름을 「벨렉」이라 지었습니다. 그가 태어난 그 시대에 노아의 아들들이 서로 땅을 나누기 시작했기 때문입니다. 그러므로 그는 그의 이름을 「벨렉」이라 지었습니다.

    8. 여섯째 해에 그녀가 그에게 아들을 낳아 주었고, 그는 그의 이름을 벨렉이라 하였습니다. 그가 태어난 날에 노아의 아들들이 그들끼리 땅을 나누기 시작하였으므로, 그는 그의 이름을 벨렉이라 하였습니다.

    9. 그리고 그들은 그것을 서로 비밀리에 나누어 노아에게 알렸습니다.

    10. 제삼십삼 희년이 시작될 때에, 그들이 땅을 세 부분으로 나누어 셈과 함과 야벳에게, 각자 자기 기업에 따라 나누어 주었습니다. 이는 첫째 주간 첫째 해의 일이었으며, 보냄을 받은 우리 가운데 한 사람이 그들과 함께 거주하고 있었습니다.

    11. 그가 아들들을 부르니, 그들과 그들의 자녀들이 그에게 가까이 왔습니다. 그가 땅을 그의 세 아들이 차지할 제비뽑기로 정해진 몫에 따라 나누었습니다. 그들은 손을 뻗어 그들의 아버지 노아의 품에서 그 기록을 가져갔습니다.

    12. 제비뽑기로 셈에게 땅의 중앙이 돌아갔습니다. 이는 그와 그의 자손이 대대로 영원히 차지할 상속지였습니다. 그곳은 라파 산맥의 중앙에서, 티나 강에서 나오는 물의 어귀로부터였습니다.

    13. 그 절반은 이 강 한가운데를 지나 서쪽으로 이어져, 이 강이 흘러나오는 심연의 물에 이를 때까지 계속됩니다. 그 물은 메앗 바다로 흘러 들어가고, 이 강은 대해로 흘러 들어갑니다.

    14. 북쪽을 향한 모든 것은 야벳의 것이요, 남쪽을 향한 모든 것은 셈의 것이니라. 그리고 카라소에 가까워질 때까지 계속된다. 이것은 남쪽을 바라보는 혀의 품에 있다.

    15. 이 바다는 ‘애굽 바다의 혀’라고 불립니다. 그것은 그곳에서 북쪽으로 큰 바다의 어귀에 있는 물가까지 뻗어 나가고, 서쪽으로 아프라까지 이어지며, 기혼 강의 물에 가까이 이르기까지 나아가 그 물의 북쪽으로 갑니다.

    16. 그리고 그것은 이 강의 경계 쪽으로 향하고, 동쪽으로 가서 에덴 동산에 가까워지며, 그 북쪽을 향하여 북쪽으로 갑니다. 또 에덴 온 땅의 동쪽에서 모든 동쪽으로 나아가, 동쪽 안에서 돌아 그 산의 동쪽을 향하여 가까워지는데, 그 이름은

    17. 라파. 그리고 북쪽으로 내려가 티나 강의 둑에 이릅니다. 이 몫은 제비로 정해졌습니다.

    18. 셈과 그의 아들들이 그것을 영원히, 그들의 대대로 영원히 소유하도록 하셨습니다. 노아는 이 몫이 셈과 그의 아들들에게 돌아왔으므로 기뻐하였고, 예언으로 자기 입으로 말한 모든 것을 기억하였습니다. 그는 이렇게 말하였습니다. 「셈의 하나님이신 야훼는 찬송받으소서. 그분이 거하시기를…」

    19. “… 야훼께서 셈의 거처에 거하시기를.” 그리고 그는 에덴동산이 지성소, 곧 야훼의 거처이고, 시내산은 광야 한가운데에 있으며, 시온산은 땅의 배꼽 한가운데에 있다는 것을 알았습니다. 이 세 곳은 서로 마주하도록 거룩한 곳으로 창조되었습니다.

    20. 이들은 노아의 아들들입니다. 이십팔 번째 희년과 일곱째 주간에, 노아가 자기 아들들의 자녀들에게 규례와 계명과 자기가 알고 있는 모든 의를 명하고 있을 때, 그는 자기 아들들에게 그들이 의를 행하고, 자기 몸의 수치를 가리며, 그들을 지으신 분을 찬양하고, 아버지와 어머니를 공경하며, 각각 자기 형제를 사랑하고, 자기 영혼을 음행에서 지키도록 일러 주었습니다.

    21. 또 주님은 영원히 계십니다. 그리고 그가 셈과 그의 아들들에게 영원의 세대들을 위하여 복된 몫과 복이 이르렀음을 아셨습니다. 곧 에돔의 온 땅, 홍해의 온 땅, 동방과 인도의 온 땅, 홍해와 그 산들, 바산의 온 땅, 레바논의 온 땅과 갑돌의 섬들, 스닐과 아마나의 모든 산들, 남쪽의 앗수르 산들, 엘람과 앗수르와 바빌론과 수산과 메대의 온 땅, 아라랏의 모든 산들, 그리고 북쪽으로 앗수르 산들 너머에 있는 바다 건너편의 모든 지역입니다.

    22. 에덴의 온 땅과 홍해의 온 땅과 동쪽의 온 땅과 인도와 홍해와 그 산들, 바산의 온 땅과 레바논의 온 땅과 갑돌의 섬들, 세니르와 아마나의 모든 산들, 북쪽의 앗수르 산들, 엘람과 앗수르와 바빌론과 수사의 온 땅과 메디아, 아라랏의 모든 산맥, 그리고 앗수르 산맥 너머 바다 건너편, 북쪽을 향한 온 지역은 복되고 넓은 땅이며, 그 안에 있는 모든 것은 매우 좋습니다.

    23. 그리고 사람은 자기 이웃을 [속였습니다]. 그리고 모든 사람이 스스로를 팔아 악을 행하고 많은 피를 흘리게 하였습니다.

    24. 땅이 폭력으로 가득 찼습니다. 그 후에 그들은 들짐승과 새와 땅 위에서 움직이는 모든 것과 땅 위를 걷는 모든 것에게 죄를 지었고, 땅에는 많은 피가 흘렀습니다.

    25. 사람의 생각과 욕구는 늘 헛된 것과 악한 것을 상상하였고, 주께서는 그들의 악한 행위와 피 때문에 땅 위에서 모든 것을 멸하셨습니다.

    26. 그들이 땅 한가운데에 쏟은 피로 말미암아, 하나님께서는 모든 것을 멸하셨습니다. 나와 너희, 내 자녀들과 우리와 함께 방주에 들어온 모든 사람만 남았습니다. 이제 보십시오. 나는 너희의 행위가 내 앞에 드러나 있는 것을 봅니다. 너희는 의로 걷고 있지 않습니다. 너희는 부패의 길로 걷기 시작했고, 각자 자기 이웃과 갈라서며, 서로 시기하고, 함께 하나로 연합하지도 않습니다.

    27. 내가 보니, 보십시오, 악령들이 이미 너희와 너희 자녀들을 잘못된 길로 이끌기 시작했습니다. 이제 나는 너희가 걱정됩니다. 내가 죽은 뒤에 너희가 땅 위에서 사람의 피를 흘리고, 너희도 땅에서 멸망할까 염려합니다.

    28. 그는 주님의 말씀을 그의 입에 두신 신들의 하나님을 찬양했습니다.

    29. 야벳의 아들은 고멜, 마곡, 마대, 야완, 두발, 메섹, 디라스입니다.

    30. 함의 아들은 구스와 미스라임과 붓과 가나안이었습니다.

    31. 노아는 자기가 아는 율례와 계명과 모든 판결로 자기 아들들의 아들들에게 명하기 시작하였습니다. 또 자기 아들들에게 증언하여, 의를 행하고 자기 육체의 부끄러움을 가리며, 창조주를 찬양하고, 아버지와 어머니를 공경하며, 각 사람이 자기 형제를 사랑하고, 음행과 더러움과 모든 불의에서 자기 영혼을 지키라고 하였습니다.

    32. 이 세 가지 일 때문에 홍수가 땅에 닥쳤습니다. 곧 감시자들이 사람의 딸들과 더불어 자기를 더럽히고, 자기들이 택한 모든 여자를 아내로 삼아 부정을 시작한 그 음행 때문입니다.

    33. 그리고 그들은 아들들을 낳았는데, 곧 나피딤입니다. 그들은 모두 서로 달랐고, 서로를 잡아먹었습니다. 거인은 나필을 죽였고, 나필은 엘료를 죽였으며, 엘료는 인류를 죽였고, 사람들은 서로를 죽였습니다.

    34. 그리고 모든 사람이 불의를 행하고 많은 피를 흘리는 일에 자신을 내맡겼으며, 땅은 불의로 가득 찼습니다.

    35. 그 후에 그들은 짐승과 새와 움직이는 모든 것과 땅 위를 다니는 모든 것에게 죄를 범하였고, 땅에 많은 피를 흘렸습니다. 사람의 마음에 품는 모든 생각과 욕망은 언제나 헛되고 악한 것을 향했습니다.

    36. 그들의 악한 행위와 그들이 땅 한가운데에 흘린 피 때문에, 야훼께서는 지면에서 모든 것을 멸하셨습니다. 그분께서는 모든 것을 멸하셨습니다.

    37. 받아들여진 제단 앞에서. 그리고 다섯째 해에는 해제를 행하여 그것을 놓아주십시오.

    38. 여러분은 의와 올바름 가운데서 의롭게 될 것이며, 여러분이 심은 모든 것이 번성할 것입니다. 이는 여러분 아버지의 아버지인 에녹이 자기 아들 므두셀라에게 명하였고, 므두셀라가 자기 아들 라멕에게 명하였으며, 라멕이…

    39. 그는 자기 조상들이 그에게 명한 모든 것을 내게 명하였습니다. 나 역시 너희, 곧 내 자녀들에게 명합니다. 이는 에녹이 첫 희년들에, 그가 일곱째 세대에 살아 있을 때 자기 아들에게 명한 대로입니다. 그는 죽는 날까지 자기 아들과 그 아들의 자녀들에게 명하고 증언하였습니다.

    40. 사람의 피를 흘리는 자와 어떤 생물의 피든 먹는 자는 모두 땅에서 멸망될 것입니다.

    41. 그리고 피를 먹거나 땅에서 사람의 피를 흘리는 자는 아무도 남지 않을 것입니다. 그에게는 하늘 아래 자손이나 후예가 남지 않을 것입니다.

    42. 그들은 스올로 내려가고, 심판의 장소로 내려가며, 깊음의 어둠 속으로 들어가 모두 참혹한 죽음을 맞을 것입니다.

    43. 너희가 짐승이나 가축이나 새나 땅 위에서 움직이는 모든 것을 잡을 때마다, 그 피가 너희 앞에 드러나지 않게 하십시오.

    44. 그리고 지면에 쏟아진 것을 덮어 너희 영혼을 위해 선을 행하십시오.

    45. 그리고 피째 먹는 사람처럼 되지 마십시오. 그들이 여러분 앞에서 피를 먹지 않도록 조심하십시오. 피를 덮으십시오. 이는 내가 여러분과 여러분의 자녀에게, 그리고 모든 육체와 함께 증언하도록 명령받았기 때문입니다.

    46. 피를 고기와 함께 먹지 마십시오. 그러지 않으면 땅 위에서 피를 흘리는 모든 생물에게서 너희의 피, 곧 너희의 생명에 대한 책임을 물을 것입니다.

    47. 땅은 그 위에 흘려진 피에서 정결해지지 않을 것입니다. 오직 그 피를 흘린 자의 피로만 땅은 대대로 정결해질 것입니다.

    48. 이제 내 자녀들아, 들으십시오. 공의와 의를 행하십시오. 그리하면 너희가 온 땅 위에 의로 심겨지고, 홍수의 물에서 나를 구원하신 내 하나님 앞에서 너희의 영광이 높아질 것입니다.

    49. 보라, 너희는 가서 너희 자신을 위해 도시들을 세우고, 그곳에 땅 위의 모든 식물과 열매 맺는 모든 나무를 심으라.

    50. 삼 년 동안에는 먹을 수 있는 어떤 것의 열매도 거두어서는 안 됩니다. 넷째 해에는 그 열매가 거룩하며, 처음 익은 열매는 하늘과 땅과 만물을 창조하신 지극히 높으신 주님 앞에 바쳐져 받아들여질 것입니다.

    51. 그들은 포도주와 기름의 맏물을 풍성히 가져와, 그것을 받는 야훼의 제단에 첫 열매로 바쳐야 합니다. 남은 것은 야훼의 집의 노예들이 그것을 받는 제단 앞에서 먹어야 합니다.

    52. 다섯째 해에는 그것을 놓아주어야 합니다. 의와 정직으로 그것을 놓아주어야 합니다. 그러면 여러분은 의롭게 되고, 여러분이 심은 모든 것이 번성할 것입니다.

    53. 이처럼 네 아버지의 아버지인 에녹은 자기 아들 므두셀라에게 명령했고, 므두셀라는 자기 아들 라멕에게 명령했으며, 라멕은 그의 조상들이 그에게 명령한 모든 것을 내게 명령했습니다.

    54. 그리고 내 아들들아, 나도 너희에게 명합니다. 에녹이 첫 희년들에 자기 아들에게 명령한 것처럼 말입니다. 그가 아직 살아 있던 제칠 세대에 그는 죽는 날까지 자기 아들과 아들의 아들들에게 명령하고 증언하였습니다.'
