id: PSA.104.14
reference: Psalms 104:14
source:
  edition: WLC
  text: מַצְמִ֤יחַ חָצִ֨יר לַ/בְּהֵמָ֗ה וְ֭/עֵשֶׂב לַ/עֲבֹדַ֣ת הָ/אָדָ֑ם לְ/ה֥וֹצִיא לֶ֝֗חֶם מִן הָ/אָֽרֶץ׀־׃
translation:
  text: He causes grass to grow for livestock, and plants for human cultivation, to bring forth bread from the earth,
  philosophy: dynamic
lexical_decisions:
- source_word: מַצְמִיחַ
  chosen: He causes ... to grow
  alternatives:
  - makes ... sprout
  - causes ... to spring up
  lexicon: HALOT
  rationale: 'Hiphil participle of צמח expresses causation: God is the one causing vegetation to grow. English ''causes ... to grow'' is natural while preserving the causative force.'
- source_word: חָצִיר
  chosen: grass
  alternatives:
  - herbage
  - green plants
  lexicon: HALOT
  rationale: In this context the term refers to fodder vegetation for animals; 'grass' is the most idiomatic and contextually precise English rendering.
- source_word: לַבְּהֵמָה
  chosen: for livestock
  alternatives:
  - for the beasts
  - for livestock
  lexicon: HALOT
  rationale: Broad, natural term for domesticated animals.
- source_word: וְעֵשֶׂב
  chosen: and plants
  alternatives:
  - and vegetation
  - and herbs
  lexicon: HALOT
  rationale: עֵשֶׂב is broader than culinary 'herbs' and can denote vegetation useful to humans. 'Plants' is readable modern English and broad enough for the context.
- source_word: לַעֲבֹדַת הָאָדָם
  chosen: for human cultivation
  alternatives:
  - for man's cultivation
  - for human labor
  - for the use of man
  lexicon: HALOT
  rationale: Natural agricultural English that conveys the relation to human work without adding an explicit verbal subject to the following infinitive.
- source_word: הָאָדָם
  chosen: man
  alternatives:
  - humankind
  - humanity
  lexicon: HALOT
  rationale: אָאָדָם here is generic/representative rather than referring to a specific male individual. Per doctrine, gender-accurate rendering is preferred; thus 'man' is retained in the main text, with an inclusive alternative preserved in a footnote.
- source_word: לְהוֹצִיא
  chosen: to bring forth
  alternatives:
  - to produce
  - to bring out
  lexicon: HALOT
  rationale: The infinitive expresses result/purpose. 'To bring forth' is idiomatic, slightly elevated, and fits the poetic context while staying close to the Hebrew.
- source_word: לֶחֶם
  chosen: bread
  alternatives:
  - food
  lexicon: HALOT
  rationale: The concrete primary sense suits the agricultural image and should not be generalized without need.
- source_word: מִן הָאָרֶץ
  chosen: from the earth
  alternatives:
  - from the land
  - out of the ground
  lexicon: HALOT
  rationale: אֶרֶץ here refers to the earth/ground as the source of produce. 'From the earth' is both natural and faithful to the poetic scope.
