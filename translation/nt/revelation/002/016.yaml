id: REV.2.16
reference: Revelation 2:16
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
translation:
  text: Therefore reorient toward God[c][a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or ''with them''; here the sense is adversative: ''against them.'''
    reason: lexical_alternative
  - marker: b
    text: The 'sword of my mouth' is an apocalyptic image for Christ's judicial word or pronouncement of judgment.
    reason: cross_reference
  - marker: c
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετανόησον
  chosen: reorient toward God
  alternatives:
  - repent
  - change your mind
  - turn back
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
- source_word: οὖν
  chosen: therefore
  alternatives:
  - then
  - so
  lexicon: BDAG
  rationale: Marks inference from the preceding rebuke. 'Therefore' best preserves the logical connection and solemn tone.
- source_word: εἰ δὲ μή
  chosen: but if not
  alternatives:
  - otherwise
  - if not
  lexicon: BDAG
  rationale: Conditional warning formula. 'But if not' reflects both δέ and μή and keeps the sharp contrast explicit.
- source_word: ἔρχομαί σοι
  chosen: I am coming to you
  alternatives:
  - I am coming against you
  - I will come to you
  lexicon: BDAG
  rationale: Present middle indicative with imminent force. 'I am coming to you' is the plain sense; the hostile nuance is supplied by the following clause about making war, so it need not be imported here.
- source_word: ταχύ
  chosen: quickly
  alternatives:
  - soon
  - swiftly
  lexicon: BDAG
  rationale: Conveys nearness and speed. 'Quickly' preserves the adverb's force without over-specifying whether the emphasis is temporal imminence or suddenness.
- source_word: πολεμήσω
  chosen: I will make war against
  alternatives:
  - I will fight against
  - I will wage war against
  lexicon: BDAG
  rationale: Future active indicative of πολεμέω. 'Make war against' preserves the martial severity more strongly than the milder 'fight against.'
- source_word: μετ’ αὐτῶν
  chosen: against them
  alternatives:
  - with them
  lexicon: BDAG
  rationale: 'Although μετά with genitive commonly means ''with,'' in this context after πολεμήσω the idiomatic sense is adversative: Christ will wage war against the offenders. Rendering ''with them'' in English could sound allied rather than hostile.'
- source_word: ἐν τῇ ῥομφαίᾳ
  chosen: with the sword
  alternatives:
  - by the sword
  - by means of the sword
  lexicon: BDAG
  rationale: Instrumental sense. 'With the sword' is natural English and preserves the imagery of the means by which judgment is executed.
- source_word: ῥομφαίᾳ
  chosen: sword
  alternatives:
  - large sword
  - broadsword
  lexicon: BDAG
  rationale: ῥομφαία denotes a large sword, but 'sword' is the established and sufficiently accurate rendering in this apocalyptic image; more specific terms risk sounding interpretively embellished.
- source_word: τοῦ στόματός μου
  chosen: of my mouth
  alternatives:
  - from my mouth
  lexicon: BDAG
  rationale: The genitive is most naturally rendered literally here, preserving the established Johannine image of the judicial sword associated with Christ's mouth. 'From my mouth' is interpretive and less formally aligned with the Greek wording.
