  from: 'He made it a testimony in Joseph when he went out over the land of Egypt[a][b][c]. I heard a language I had not known:'
  to: 'He established it as a testimony in Joseph when he went out against the land of Egypt[a]. I hear a language I did not know:'
  rationale: “Established it as” better represents the appointing sense of שׂים than the weak English “made it a.” In the exodus setting, “against the land of Egypt” is a well-supported reading of עַל, with “over” appropriately retained as an alternative. Rendering the imperfect אֶשְׁמָע as present preserves the abrupt first-person transition rather than regularizing it into past narration. The note honestly retains both the prepositional and subject-reference uncertainties.
