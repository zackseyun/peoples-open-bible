id: JOB.7.6
reference: Job 7:6
source:
  edition: WLC
  text: יָמַ֣/י קַ֭לּוּ מִנִּי אָ֑רֶג וַ֝/יִּכְל֗וּ בְּ/אֶ֣פֶס תִּקְוָֽה־׃
translation:
  text: My days are swifter than a weaver’s shuttle; they come to an end without hope.
  philosophy: dynamic
lexical_decisions:
- source_word: יָמַי
  chosen: My days
  alternatives:
  - My lifetime
  - My time
  lexicon: HALOT
  rationale: The plural construct with 1cs suffix literally means 'my days.' In context Job speaks of the brevity of his life as experienced day by day, so the concrete expression is retained rather than abstracting to 'my life.'
- source_word: קַלּוּ
  chosen: are swifter
  alternatives:
  - are swifter
  - are light/quick
  lexicon: HALOT
  rationale: This directly and naturally renders the comparative construction; the contrary stored entry is stale.
- source_word: מִנִּי אָרֶג
  chosen: than a weaver’s shuttle
  alternatives:
  - than a weaver
  - than the weaver's loom
  lexicon: HALOT
  rationale: The noun אֹרֶג refers to weaving apparatus; in this verse the comparison is traditionally and contextually understood as the rapidly moving weaver's shuttle rather than the person or the whole loom. 'Shuttle' best captures the image of speed in natural English.
- source_word: וַיִּכְלוּ
  chosen: they come to an end
  alternatives:
  - they are finished
  - they vanish away
  lexicon: HALOT
  rationale: From כלה, 'be finished, come to an end.' The phrase refers to Job's days reaching their end. 'Come to an end' is clear modern English and preserves the temporal sense.
- source_word: בְּאֶפֶס תִּקְוָה
  chosen: without hope
  alternatives:
  - in hopelessness
  - with no hope
  lexicon: HALOT
  rationale: אפס conveys nonexistence/lack, and תקוה means hope. 'Without hope' is the most natural concise rendering in English and accurately reflects the Hebrew prepositional phrase.
