translation:
  text: Nevertheless, although so many impulses of motherly affection drew the mother toward sympathy, the many kinds of torture could not sway her reason in the case of any of her sons[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or 'could not sway her reason through any of these impulses of motherly affection.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  chosen: Nevertheless
  alternatives:
  - But still
  - Yet nevertheless
  lexicon: LSJ
  rationale: Marks a strong concessive transition from the preceding context; 'Nevertheless' is idiomatic and preserves the emphatic contrast.
- source_word: καίπερ
  chosen: although
  alternatives:
  - though
  - even though
  lexicon: LSJ
  rationale: Introduces the concessive clause naturally in English.
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  chosen: although so many impulses of motherly affection
  alternatives:
  - although there were so many things concerning love for children
  - although so many maternal feelings
  lexicon: LSJ
  rationale: φιλοτεκνία denotes affection for one's children, especially maternal attachment in this context. 'Impulses of motherly affection' renders the abstract phrase in readable English while keeping the emotional force.
- source_word: εἰς συμπάθειαν ἑλκόντων
  chosen: were drawing ... toward sympathy
  alternatives:
  - were pulling ... into compassion
  - were attracting ... to fellow-feeling
  lexicon: LSJ
  rationale: ἕλκω is literally 'draw/pull'; συμπάθεια here is compassionate fellow-feeling. 'Toward sympathy' preserves the directional sense without overparaphrase.
- source_word: τὴν μητέρα
  chosen: the mother
  alternatives:
  - their mother
  lexicon: LSJ
  rationale: The Greek has the article with 'mother' rather than an explicit possessive. 'The mother' preserves the formal style of the discourse.
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  chosen: by any of them
  alternatives:
  - in no case by them
  - through none of them
  lexicon: LSJ
  rationale: Refers back to the many emotional pulls just mentioned; the phrase means that none of these succeeded as means of persuasion.
- source_word: τὸν λογισμὸν αὐτῆς
  chosen: her reason
  alternatives:
  - her rational judgment
  - her resolve
  lexicon: LSJ
  rationale: In 4 Maccabees λογισμός is a key term for rational faculty/reasoned judgment. 'Her reason' is concise and preserves the book's philosophical emphasis better than the more volitional 'resolve,' though resolve is implicated.
- source_word: αἱ παντοίκιλοι βάσανοι
  chosen: the all-varied tortures
  alternatives:
  - the many kinds of torments
  - the manifold tortures
  lexicon: LSJ
  rationale: παντοίκιλος conveys great variety; βάσανοι are tortures/torments in the martyrdom context. 'All-varied tortures' keeps the vividness and breadth of the Greek.
- source_word: ἴσχυσαν μετατρέψαι
  chosen: were not able ... to turn aside
  alternatives:
  - did not prevail to change
  - were not strong enough to divert
  lexicon: LSJ
  rationale: ἰσχύω + infinitive expresses ability or prevailing power; μετατρέπω here means to turn away or divert. 'Were not able ... to turn aside' is clear and faithful.
