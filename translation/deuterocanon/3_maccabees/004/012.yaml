translation:
  text: When this happened, the king heard that the Jews living in the city were slipping out in secret more and more often because of their brothers’ suffering[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “to escape the suffering their brothers were enduring”; the closing clause is difficult in the supplied Greek.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  chosen: And when this happened
  alternatives:
  - Now when this took place
  - But when this happened
  lexicon: LSJ
  rationale: A natural temporal transition. ὡς with the aorist here introduces the circumstance/time, and δέ is carried by 'And' rather than a stronger adversative.
- source_word: ἀκούσας
  chosen: after hearing
  alternatives:
  - having heard
  - when he heard
  lexicon: LSJ
  rationale: The aorist participle is rendered adverbially to connect the report with the ensuing reaction. English needs an implicit subject; the Greek leaves it to context.
- source_word: τοὺς ἐκ τῆς πόλεως ὁμοεθνεῖς
  chosen: his fellow countrymen from the city
  alternatives:
  - those of the same nation from the city
  - his compatriots from the city
  lexicon: LSJ
  rationale: ὁμοεθνεῖς denotes people of the same ethnic/national stock. 'Fellow countrymen' is idiomatic and preserves the kinship/national sense. 'His' is supplied from context because English normally requires explicit anchoring.
- source_word: κρυβῇ ἐκπορευομένους
  chosen: were secretly going out
  alternatives:
  - were going out in secret
  - were departing secretly
  lexicon: LSJ
  rationale: κρυβῇ functions adverbially ('secretly'), and ἐκπορευομένους is a participial description of their movement out from the city.
- source_word: πυκνότερον
  chosen: more frequently
  alternatives:
  - more densely
  - in greater numbers
  - more often
  lexicon: LSJ
  rationale: In context the comparative adverb most naturally refers to repeated occurrence rather than physical density. 'More frequently' best fits the sense of repeated secret departures.
- source_word: ὑποδιδράσκειν
  chosen: slipping away
  alternatives:
  - escaping
  - stealing away
  lexicon: LSJ
  rationale: The verb suggests furtive withdrawal or escape. 'Slipping away' preserves the clandestine nuance without overstating a full successful escape.
- source_word: τὴν ... ταλαιπωρίαν
  chosen: because of the misery
  alternatives:
  - from the distress
  - on account of the suffering
  lexicon: LSJ
  rationale: The phrase is difficult as transmitted, but the sense is that the brothers' suffering was motivating the secret departures. 'Because of the misery' captures the causal force implied by the infinitive construction in context.
- source_word: τῶν ἀδελφῶν
  chosen: their brothers
  alternatives:
  - their brethren
  - their fellow Jews
  lexicon: LSJ
  rationale: ἀδελφῶν is kept as 'brothers' per gender-accurate policy and because it expresses kinship/solidarity. 'Their' makes explicit the relation in idiomatic English.
- source_word: ἰχθεῖ
  chosen: misery
  alternatives:
  - distress
  - affliction
  lexicon: LSJ
  rationale: The transmitted form ἰχθεῖ is textually/lexically problematic in this context; the clause as a whole clearly points to the brothers' suffering. The translation follows the contextual sense rather than forcing a wooden rendering of a difficult form.
