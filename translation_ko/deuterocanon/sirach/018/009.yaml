  lexicon: ἀριθμός
  rationale: 직역적으로 ‘수/숫자’의 개념을 살리되, 한국어에서 자연스러운 ‘날의 수’로 옮겨 기간의 셈을 분명히 했습니다.
- source_word: ἀνθρώπου
  english_pob_choice: of a man
  chosen_korean: 사람의
  alternatives_korean:
  - 한 사람의
  - 인간의
  lexicon: ἄνθρωπος
  rationale: 남성 한정이 아니라 보편적 인간을 가리키므로, 표준적이고 포괄적인 ‘사람의’를 택했습니다.
- source_word: πολλὰ ἔτη ἑκατόν
  english_pob_choice: 'many years: a hundred'
  chosen_korean: 많은 해입니다. 백 년입니다.
  alternatives_korean:
  - 많은 해입니다. 백 살입니다.
  - 많아야 백 년입니다.
  lexicon: πολλά / ἔτη / ἑκατόν
  rationale: '그리스어 원문의 병치와 단정적 어조를 살려 두 절로 나누었습니다. POB의 ‘many years: a hundred’을 따라 ‘많은 해’와 ‘백 년’을 모두 유지했습니다.'
theological_decisions:
- issue: 수명의 한계를 나타내는 격언적 진술의 강도
  chosen_reading: 본문의 ‘많은 해’와 ‘백 년’의 병치를 그대로 유지해, 인간 수명의 일반적 범위를 말하는 격언으로 읽었습니다.
  alternative_readings:
  - ‘많아야 백 년’처럼 한계를 분명히 하는 해석
  - ‘최대 백 년’으로 수치적 상한을 드러내는 해석
  rationale: '영어 POB가 원문의 단정과 긴장을 살려 ‘many years: a hundred’로 되돌린 점을 반영하여, 해석을 덧씌우지 않고 원문의 표현 자체를 보존했습니다.'
  doctrine_reference: 지혜문학의 격언적 표현은 교리적 정식화보다 문학적 진술을 우선해 읽어야 합니다.
