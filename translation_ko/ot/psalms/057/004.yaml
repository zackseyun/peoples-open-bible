  naturalness: 개정문은 히브리어의 압축된 병렬과 비유를 유지하면서도 현대 표준 한국어 합쇼체로 자연스럽게 연결합니다. ‘불붙은 자들’은 다소 낯선 시어이지만 לֹהֲטִים의 불타는 이미지를 보존하기 위해 유지했습니다.
