theological_decisions:
- issue: Divine judgment language
  chosen_reading: Retain strong personal language of God's indignation, wrath, and retributive justice without softening.
  alternative_readings:
  - Use less personal or less severe terms such as 'displeasure' or 'punishment'
  rationale: The Hebrew explicitly attributes judicial wrath and recompense to God. The translation should preserve the gravity of the prophetic judgment rather than dilute it.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: Rendering of the divine name in אֲדֹנָי יְהוִה
  chosen_reading: Lord GOD
  alternative_readings:
  - Lord the LORD
  - Lord Yahweh
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
