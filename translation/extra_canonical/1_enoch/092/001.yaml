  alternative_readings:
  - the elect
  - those who are chosen
  rationale: The term carries covenantal/apocalyptic weight in Enochic literature. 'Chosen ones' preserves that force without importing later doctrinal phrasing more strongly than the local passage warrants.
  doctrine_reference: Preserve theological tension rather than resolve it; keep major terms locally grounded in the passage.
