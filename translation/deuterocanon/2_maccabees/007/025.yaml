  text: τοῦ δὲ νεανίου μηδαμῶς προσέχοντος, προσκαλεσάμενος ὁ βασιλεὺς τὴν μητέρα παρῄνει γενέσθαι τοῦ μειρακίου σύμβουλον ἐπὶ σωτηρία.
