source:
  edition: WLC
  text: נִֽדֲר֣וּ וְ/שַׁלְּמוּ֮ לַ/יהוָ֪ה אֱֽלֹהֵ֫י/כֶ֥ם כָּל סְבִיבָ֑י/ו יוֹבִ֥ילוּ שַׁ֝֗י לַ/מּוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/011.yaml
  text: Make vows to Yahweh your God and fulfill them; let all who are around him bring tribute[a] to the Fearsome One.[b]
  footnotes:
  - marker: a
    text: Or, “a gift” or “a present.” The Hebrew term can denote a gift brought to an honored superior.
    reason: lexical_alternative
  - marker: b
    text: Or, “the one to be feared” or “the Awesome One.” The Hebrew title presents God as an object of fear or awe.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 너희 하나님 야훼께 서원하고 그것을 이행하십시오. 그분 주위에 있는 모든 이는 두려움의 대상이신 분께 예물을 가져오십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '선물' 또는 '조공'. 히브리어 샤이(שַׁי)는 존귀한 윗사람에게 드리는 선물이나 예물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, '두려워해야 할 분' 또는 '경외로우신 분'. 히브리어 명칭은 하나님이 두려움과 경외의 마땅한 대상이심을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: …할 것입니다
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - 참으로
  lexicon: HALOT
  rationale: 문맥상 앞절의 서원과 보상의 이유를 잇는 설명적 연결이므로, 한국어에서는 별도의 접속사보다 자연스러운 문장 흐름으로 반영했습니다.
- source_word: חֲמַת אָדָם
  english_pob_choice: the wrath of man
  chosen_korean: 사람의 분노
  alternatives_korean:
  - 인간의 분노
