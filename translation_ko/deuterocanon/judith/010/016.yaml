  source_fidelity: 그리스어의 조건절, 마음의 두려움 금지, ἀνάγγειλον의 전달·보고 의미, 그리고 εὖ ποιήσει의 호의적 대우의 뜻은 대체로 충실히 반영되었습니다. 다만 목표 문체인 현대 합쇼체에 맞추어 2인칭 표현과 명령형을 정비하는 것이 필요합니다.
