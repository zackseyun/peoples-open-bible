    8. 그들이 그것들을 예배하고 찬양하게 하려는 것이었습니다. “내 아들아, 잠잠하라. 그들이 너를 죽일지도 모른다.” 그리고 그가 이 말을 자기 두 형제에게 하니, 그들은 그에게 화를 냈고, 그는 잠잠하였습니다.

    9. 그는 이 일을 자기 두 형제에게 말하였고, 그들은 그에게 분노하였으며, 잠잠하였습니다. 그리고 사십 번째 희년, 둘째 주, 그 해의 일곱째 해에 아브람은 아내를 맞이하였는데, 그녀의 이름은 사라이였으며, 그의 아버지의 딸이었습니다.

    10. 그의 아버지였으며, 그녀는 그의 아내가 되었습니다. 그리고 그의 형제 아란은 셋째 주의 셋째 해에 자신을 위해 아내를 맞이했고, 그녀는 이 주의 일곱째 해에 그에게 아들을 낳았으며, 그는 이름을 지었습니다.

    11. 그의 이름을 롯이라 하였습니다. 그리고 그의 형제 나홀은 아내를 맞았습니다.

    12. 그리고 아브람의 생애 육십째 해, 곧 넷째 주간의 넷째 해에 아브람이 밤에 일어나 우상들의 집을 불태우고, 그 집 안에 있던 모든 것을 불살랐으며, 아무도 그 일을 알지 못했습니다.

    13. 그들은 밤에 일어나 불 가운데에서 자기들의 신들을 구해 내고자 했습니다. 그리고 하란이 급히 달려갔습니다.

    14. 그들을 건져 내려고 하였는데, 그의 위로 불이 타올랐고 그는 불에 타 갈대아 사람들의 우르에서 죽었습니다.

    15. 그의 아버지 데라보다 먼저였습니다. 그들은 그를 갈대아인의 우르에 묻었습니다. 데라는 그의 아들들과 함께 레바논 땅과 가나안 땅으로 가고자 갈대아인의 우르를 떠났으며, 하란 땅에 머물렀습니다. 아브람은 하란에서 그의 아버지 데라와 함께 살았습니다.

    16. 두 주간의 해였습니다. 그리고 여섯째 주의 다섯째 해에 아브람은 일곱째 달의 시작에 밤을 새우며, 해질 무렵부터 새벽까지 별들을 살펴보았습니다. 그는 비와 관련하여 그해의 형편이 어떠할지를 보려고 했습니다. 그는 그곳에 혼자 앉아 살피고 있었는데, 그의 마음에 한 말이 이르렀습니다. 그가 말했습니다. “별들의 모든 징조와 그 징조들…”

    17. …해와 달의 것은 모두 주님의 손에 있습니다. 내가 왜 찾습니까? 그가 원하시면…

    18. 그는 아침과 저녁에 비를 내리십니다. 그리고 그가 원하시면 비를 내리지 않으십니다. 또 모든 것이 그의 손에 있습니다.” 그리고 그는 기도하였습니다.

    19. 그날 밤에 그가 말했습니다. 「나의 하나님, 지극히 높으신 하나님, 오직 당신만이 나의 하나님이십니다. 당신은 모든 것을 지으셨고, 존재하는 모든 것은 당신의 손의 작품입니다. 저는 당신과 당신의 통치를 택했습니다. 저를 구원해 주십시오.」

    20. 사람의 마음속 생각을 지배하는 악한 영들의 손에서 저를 건져 주시고, 제 하나님, 제가 당신을 따르는 길에서 그들이 저를 미혹하지 못하게 해 주십시오. 또 저와 제 자손을 영원히 굳게 세워 주시어, 우리가 이제부터 영원까지 길을 잃지 않게 해 주십시오.” 그리고 그가 말했습니다.

    21. 그가 말했습니다. 「내가 갈대아인의 우르로 돌아가야 합니까? 내 얼굴을 찾아 내가 그들에게 돌아가게 하려 하는 그들에게 말입니까? 또 이곳에서 내가 무엇을 해야 합니까? 당신 앞에서 바른 길을 곧게 하시고, 당신의 종의 손으로 그가 그것을 행하도록 하시며, 나의 하나님, 내가 내 마음의 잘못을 따라 걷지 않게 하십시오.」 그리고 그는 말하기와 기도하기를 마쳤습니다. 보라, 한 사람이 보내졌습니다.

    22. 야훼의 말씀이 내 손을 통하여 그에게 이르렀습니다. 그 말씀은 이러했습니다. 「네 땅과 네 친족과 네 아버지의 집에서 나와, 내가 네게 보여 줄 땅으로 가십시오. 내가 너를 크고 많은 민족이 되게 하고, 너에게 복을 주겠습니다.」

    23. 내가 네 이름을 크게 하겠습니다. 너는 땅에서 복을 받을 것이며, 네 안에서 땅의 모든 민족이 복을 받을 것입니다. 또 너를 축복하는 이들은 내가 축복하겠고, 너를 저주하는 이들은 내가 저주하겠습니다.

    24. “내가 너와 네 아들과 네 아들의 아들과 네 모든 자손에게 하나님이 될 것입니다. 이제부터 땅의 모든 세대에 이르기까지 두려워하지 마십시오. 나는 너의 하나님입니다.” 그리고 그가 내게 말했습니다.

    25. 주 하나님께서 [말씀하셨습니다]. “그의 입과 귀를 여십시오. 그러면 그는 듣고, 드러난 언어로 자기 입으로 말할 것입니다. 그 언어는 무너짐의 날부터 모든 사람의 입에서 사라졌기 때문입니다.”

    26. 내가 그의 입과 귀와 입술을 열고, 그가 나와 히브리어로, 곧 창조의 언어로 말하도록 하였습니다. 그는 자기 조상들의 책들을 가져왔는데, 그것들은 히브리어로 기록되어 있었습니다. 그는 그것들을 베껴 쓰고 그때부터 그것들을 배우기 시작하였습니다. 또한 내가 그가 이해하지 못하는 모든 것을 그에게 알게 하였고, 그는 여섯 달의 우기 동안 그것들을 배웠습니다.'
