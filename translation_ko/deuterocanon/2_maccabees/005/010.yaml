  verdict: revise
  source_fidelity: 그리스어는 그가 ‘장사되지 못한’ 많은 이들을 내던진 뒤, 그 자신도 애도받지 못하고 장례와 πατρῷος νόμος에 몫을 얻지 못했다고 말합니다. 초안의 ‘자기 조상의 묘’는 πατρῴου νόμου(조상에게서 전해진 법·관습)를 ‘묘’로 바꾸어 원문에서 벗어납니다. 영어 감사본의 ‘ancestral tomb’도 이 단어 선택을 뒷받침하지 못합니다.
  naturalness: ‘애도받지 못한 채가 되었고’는 현대 한국어 문장으로 어색합니다. ‘애도받지 못하게 되었으며’가 자연스럽고 원문의 결과 표현도 보존합니다. ‘장사되지 못한 많은 시신’은 문맥상 내던져진 대상과 ἄταφος의 장례·매장 결핍을 더 명확히 합니다.
  terminology: κηδεία는 ‘장례’로, πατρῷος νόμος는 특정 묘지가 아니라 ‘조상에게서 전해진 관습’으로 옮깁니다. ‘참여하지 못했습니다’보다 ‘몫을 얻지 못했습니다’가 μετέσχεν의 ‘share/have a part’와 죽은 이의 장례 배제 문맥에 더 적합합니다.
  issues:
  - severity: high
    issue: ‘자기 조상의 묘’
    rationale: 원문의 πατρῴου νόμου는 문자상 ‘조상의 법/관습’이며 묘(τάφος 등)를 뜻하지 않습니다. 영어 감사본의 ‘ancestral tomb’도 원문과 긴장되므로 이를 따르지 않아야 합니다.
  - severity: medium
    issue: ‘애도받지 못한 채가 되었고’
    rationale: ‘채가 되다’는 비문법적·부자연스러운 결합입니다.
  - severity: low
