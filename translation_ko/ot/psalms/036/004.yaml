id: PSA.36.4
reference: Psalms 36:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֤וֶן יַחְשֹׁ֗ב עַֽל מִשְׁכָּ֫ב֥/וֹ יִ֭תְיַצֵּב עַל דֶּ֣רֶךְ לֹא ט֑וֹב רָ֝֗ע לֹ֣א יִמְאָֽס׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/004.yaml
  text: He devises wickedness on his bed[a]; he takes his stand on a path that is not good; he does not reject evil.
  footnotes:
  - marker: a
    text: Or 'He plans iniquity on his bed ... he does not abhor evil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 침상에서 악을 꾀하고, 좋지 않은 길에 굳게 서며, 악을 버리지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי פִיו
  english_pob_choice: The words of his mouth
  chosen_korean: 그의 입의 말들
  alternatives_korean:
  - 그의 입에서 나오는 말들
  - 그의 입의 말씀들
  lexicon: HALOT
  rationale: ‘말들’로 복수성을 살리고, ‘입’이라는 구체적 이미지도 유지했습니다. ‘말씀들’은 지나치게 격식적이어서 본문의 부정적 진술과 어울리지 않습니다.
- source_word: אָוֶן
  english_pob_choice: wickedness
  chosen_korean: 악함
  alternatives_korean:
  - 악
  - 불의
  - 죄악
  lexicon: HALOT
  rationale: 말의 내용이 도덕적으로 타락했음을 드러내는 일반적이고 직접적인 표현으로 옮겼습니다. ‘불의’는 법정적 뉘앙스가 강하고, ‘죄악’은 더 강한 신학적 어감을 더할 수 있습니다.
- source_word: וּמִרְמָה
  english_pob_choice: and deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 배신
  - 사기
  lexicon: HALOT
  rationale: ‘속임수’는 입에서 나오는 거짓되고 기만적인 말을 자연스럽게 드러냅니다. 본문의 평행 구조상 ‘악함과 속임수’가 가장 직관적입니다.
- source_word: לְהַשְׂכִּיל לְהֵיטִיב
  english_pob_choice: to act wisely, to do good
  chosen_korean: 지혜롭게 행하는 일과 선을 행하는 일
  alternatives_korean:
  - 지혜롭게 행동하는 것과 선을 행하는 것
  - 지혜롭게 살며 선을 행하는 일
  lexicon: HALOT
  rationale: 두 개의 부정사 연쇄를 분리해 평행성을 살렸습니다. ‘행하는 일’은 מקור의 실천적 의미를 유지하면서 한국어로 자연스럽게 들립니다.
- source_word: חָדַל
  english_pob_choice: he has ceased
  chosen_korean: 그는 … 그쳤습니다
  alternatives_korean:
  - 그는 … 멈췄습니다
  - 그는 … 중단했습니다
  lexicon: HALOT
  rationale: 완료형의 종결성을 살려 ‘그쳤습니다’로 옮겼습니다. 뒤따르는 부정사 두 항목을 받아 주는 구조를 위해 서술을 자연스럽게 구성했습니다.
theological_decisions:
- issue: ‘wise’와 ‘do good’의 관계를 분리할지, 결합할지
  chosen_reading: 지혜롭게 행하는 일과 선을 행하는 일을 그쳤습니다
  alternative_readings:
  - 지혜롭게 선을 행하는 일을 그쳤습니다
  - 지혜롭게 행하기를 그쳤습니다
  rationale: 히브리어 부정사 둘을 한국어에서도 둘로 드러내어, 지혜와 선행의 긴밀한 연관은 살리되 하나로 융합해 버리지 않았습니다. 이는 영어 POB가 수정한 ‘to act wisely, to do good’의 분리 취지와도 맞습니다.
  doctrine_reference: 시편 36:4의 평행법과 히브리어 부정사 연쇄
