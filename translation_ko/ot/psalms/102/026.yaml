  text: הֵ֤מָּה יֹאבֵדוּ֮ וְ/אַתָּ֪ה תַ֫עֲמֹ֥ד וְ֭/כֻלָּ/ם כַּ/בֶּ֣גֶד יִבְל֑וּ כַּ/לְּב֖וּשׁ תַּחֲלִיפֵ֣/ם וְֽ/יַחֲלֹֽפוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/026.yaml
  text: They will perish, but you will remain[a]; all of them will wear out like a garment. Like clothing you will change them[b], and they will pass away.
  footnotes:
  - marker: a
    text: Or “you will stand.” The Hebrew verb is literally “stand,” here expressing enduring permanence in contrast to creation’s perishing.
    reason: lexical_alternative
  - marker: b
    text: Or “you will replace them.” The Hebrew can suggest changing or replacing them, continuing the clothing metaphor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 없어지겠지만, 주께서는 그대로 계실 것입니다.[a] 그것들은 모두 옷처럼 낡아 갈 것입니다. 주께서는 옷처럼 그것들을 바꾸실 것이며,[b] 그것들은 사라질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서 계실 것입니다.’ 히브리어 동사는 직역하면 ‘서다’이며, 여기서는 피조물의 소멸과 대조되어 지속성을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들을 갈아 끼우실 것입니다.’ 히브리어는 의복의 비유 안에서 ‘바꾸다’ 또는 ‘대신하다’의 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
