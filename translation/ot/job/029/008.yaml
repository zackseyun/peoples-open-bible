  from: The young men saw me and withdrew[a], and the aged rose and stood.
  to: The young men saw me and hid themselves[a], and the aged rose and stood.
  rationale: The Niphal of חבא directly means “hide oneself.” “Withdrew” gives a plausible social inference but replaces the concrete source image. The explanatory note may state the likely deferential implication while the main text retains the image.
