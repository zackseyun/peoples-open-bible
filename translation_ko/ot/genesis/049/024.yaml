  to: 그러나 그의 활은 굳건히 버티고 있었으며, 그의 팔은 야곱의 능하신 이의 손으로 민첩해졌습니다. 거기에서 이스라엘의 목자, 이스라엘의 돌이 나옵니다.
  rationale: 활의 상태를 한국어 전투 이미지에 맞게 다듬고, 영어 POB의 ‘agile’을 유지했습니다. 마지막 두 호칭은 원문의 어휘대로 ‘목자, 돌’로 옮겼으며, 논의되는 구문 및 지시 대상을 존칭으로 확정하지 않았습니다. 불필요하거나 번역과 맞지 않는 각주는 삭제했습니다.
