    reason: source_note
lexical_decisions:
- source_word: εἰσάκουσον
  english_pob_choice: Hear
  chosen_korean: 들으소서
  alternatives_korean:
  - 들어 주십시오
  - 들으십시오
  lexicon: εἰσακούω
  rationale: 청원의 직접 호소문이므로 단순한 청취보다 응답을 기대하는 간청의 뉘앙스를 살려 공손한 명령형으로 옮겼습니다.
- source_word: τῆς προσευχῆς ἡμῶν καὶ τῆς δεήσεως ἡμῶν
  english_pob_choice: our prayer and our plea
  chosen_korean: 우리의 기도와 간청
  alternatives_korean:
  - 우리의 기도와 간구
  - 우리의 기도와 애원
  lexicon: προσευχή / δέησις
  rationale: POB의 'plea'를 반영해 δέησις를 단순 반복인 '간구'보다 더 절박한 '간청'으로 구분했습니다.
- source_word: ἐξελοῦ ἡμᾶς ἕνεκεν σοῦ
  english_pob_choice: deliver us for your own sake
  chosen_korean: 당신 자신을 위하여 우리를 구해 주시고
  alternatives_korean:
  - 당신의 이름을 위해 우리를 건져 주시고
  - 당신을 위하여 우리를 구출해 주시고
  lexicon: ἐξαιρέω / ἕνεκεν
  rationale: 구원의 근거가 '당신 자신을 위하여'라는 점을 보존하고, 동사는 문맥상 '구해 주시다'로 자연스럽게 옮겼습니다.
- source_word: δὸς ἡμῖν χάριν κατὰ πρόσωπον τῶν ἀποικισάντων ἡμᾶς
  english_pob_choice: grant us favor before those who carried us away captive
  chosen_korean: 우리를 사로잡아 간 사람들 앞에서 우리에게 호의를 베풀어 주십시오
  alternatives_korean:
  - 우리를 유배시킨 이들 앞에서 우리에게 은혜를 베풀어 주십시오
  - 우리를 끌어간 자들 앞에서 우리에게 호의를 주십시오
  lexicon: χάρις / ἀποικίζω
  rationale: χάρις는 하나님의 '은혜'가 아니라 상대에게서 얻는 '호의'이므로 문맥에 맞게 번역했고, ἀποικίζω는 포로·유배 상황을 드러내는 '사로잡아 간 사람들'로 옮겼습니다.
theological_decisions:
- issue: 청원문의 화자 정중어법
  chosen_reading: 하나님께 드리는 직접 청원으로서 명령형을 '들으소서', '구해 주시고', '베풀어 주십시오'의 공손한 기도체로 통일했습니다.
  alternative_readings:
  - 서술형 완화
  - 더 전통적인 '-옵소서' 기도체
  rationale: 현대 합쇼체를 유지하면서도 본문의 간청성과 하나님께 대한 직접 호소를 보존하기 위한 선택입니다.
  doctrine_reference: 기도와 간구의 문학적 형식
