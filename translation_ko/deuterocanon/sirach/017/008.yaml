  rationale: 영어 POB가 이미 ‘holy name’로 정리한 만큼, 한국어도 의미를 과잉 추상화하지 않고 직접적인 형용사구로 옮기는 것이 문맥상 가장 자연스럽습니다.
  doctrine_reference: 성호칭의 거룩성에 대한 일반 성서적 표현
