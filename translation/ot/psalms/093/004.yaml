  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Comparative force of the opening מִן-phrases
  chosen_reading: The verse states that the LORD is more majestic than the overwhelming waters and sea-breakers.
  alternative_readings:
  - The verse could be read more loosely as an exclamation about mighty waters followed by a separate assertion that the LORD is majestic on high.
  rationale: The repeated מִן naturally supports a comparative construction in Hebrew poetry. This preserves the theological emphasis on the LORD's supremacy over chaotic natural power without importing mythological speculation beyond the text.
