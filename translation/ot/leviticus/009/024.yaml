  from: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
  to: Fire came out from Yahweh’s presence and consumed the burnt offering and the fat portions on the altar. When all the people saw this, they shouted for joy and fell facedown.
  rationale: The lexical record supports both fire proceeding from Yahweh’s presence and the people’s jubilant shout, which I retain. The existing note already identifies 'presence' as the idiom’s meaning; I bring that into the main text and preserve the concrete image of prostration.
