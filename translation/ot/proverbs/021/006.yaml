id: PRO.21.6
reference: Proverbs 21:6
source:
  edition: WLC
  text: פֹּ֣עַל א֭וֹצָרוֹת בִּ/לְשׁ֣וֹן שָׁ֑קֶר הֶ֥בֶל נִ֝דָּ֗ף מְבַקְשֵׁי מָֽוֶת־׃
translation:
  text: Wealth gained by a lying tongue is a vapor blown away; those who gain it seek death[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Hebrew, “seekers of death”; some ancient versions support the reading “a snare of death.”
    reason: textual_variant
lexical_decisions:
- source_word: פֹּעַל
  chosen: Making
  alternatives:
  - The making of
  - Gain
  lexicon: HALOT
  rationale: The noun from פעל denotes work, deed, or product. In this proverb it functions verbally with 'treasures,' referring to the act/process of acquiring or producing wealth. 'Making' is concise and natural in English while preserving the Hebrew's focus on the activity.
- source_word: אֹצָרוֹת
  chosen: treasures
  alternatives:
  - storehouses
  - wealth
  lexicon: HALOT
  rationale: Though the noun can denote storehouses or treasuries, in wisdom context it commonly refers to stored wealth or riches. 'Treasures' preserves the concrete image while naturally conveying accumulated wealth.
- source_word: בִּלְשׁוֹן שָׁקֶר
  chosen: by a lying tongue
  alternatives:
  - with a false tongue
  - by deceitful speech
  lexicon: HALOT
  rationale: Literally 'with/by a tongue of falsehood.' 'By a lying tongue' keeps the vivid bodily metaphor and indicates the means by which the treasures are made.
- source_word: הֶבֶל
  chosen: a fleeting vapor
  alternatives:
  - vanity
  - breath
  - mere vapor
  lexicon: HALOT
  rationale: הבל often conveys breath-like transience or emptiness. 'A fleeting vapor' communicates both insubstantiality and brevity in readable modern English better than the traditional but potentially opaque 'vanity.'
- source_word: נִדָּף
  chosen: fleeting
  alternatives:
  - driven away
  - blown away
  - scattered
  lexicon: HALOT
  rationale: The participle means driven/blown away. Combined with הבל, the phrase depicts something insubstantial and quickly dispersed. Rendering it adjectivally as 'fleeting' produces idiomatic English while preserving the image of transience.
- source_word: מְבַקְשֵׁי מָוֶת
  chosen: sought by those who seek death
  alternatives:
  - those who seek death
  - seekers of death
  lexicon: HALOT
  rationale: 'The Hebrew sequence is compressed and syntactically difficult. The Masoretic wording most naturally apposes or relates the fraudulent gain to death-seekers. To preserve all elements without over-paraphrase, the translation renders the phrase in a way that reflects the Hebrew wording and its grim moral outcome. An alternative construal takes the phrase adverbially/predicatively: such gain is ''for those who seek death'' or identifies the makers as ''those who seek death.'''
- source_word: פֹּעַל א֭וֹצָרוֹת
  chosen: The getting of treasures
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: The nominal construction refers to producing or acquiring treasures; the articulated gerund phrase is idiomatic as the subject of the English sentence.
- source_word: הֶ֥בֶל נִ֝דָּ֗ף
  chosen: a vapor driven away
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Preserves the concrete vapor image and the passive participle rather than reducing the phrase to inferred transience.
- source_word: מְבַקְשֵׁי מָֽוֶת
  chosen: seekers of death
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This close rendering preserves the MT’s compressed plural participial phrase without supplying an unattested object or the noun “snare”; possible syntactic relations are noted.
