  source_fidelity: 현 초안은 첫 탄식형 질문인 τί ἐστιν Ἰσραήλ;을 ‘이스라엘이여’라는 호격으로만 처리하여, ‘무슨 일이냐/어찌된 일이냐’라는 질문의 핵심 의미가 빠졌습니다. 또한 συνεμιάνθης는 결과 상태를 나타내는 수동형이므로 ‘더러워졌습니다’보다 ‘더럽혀졌습니다’가 더 직접적입니다. τοῖς νεκροῖς는 죽은 이들과의 접촉에 따른 의례적 부정과 비유적 죽음의 영역에 속함을 함께 시사할 수 있으므로 그 모호성을 유지해야 합니다.
  naturalness: ‘이스라엘아, 어찌된 일입니까?’는 현대 한국어의 격식 있는 성서 문체에서 자연스럽게 첫 수사의문을 보존합니다. 이어지는 ‘어찌하여 네가’는 호격과 자연스럽게 연결되며, 본문의 이스라엘 의인화 خطاب을 살립니다. ‘낯선 땅’은 γῇ ἀλλοτρίᾳ의 ‘남의/외국의 땅’이라는 뜻을 현대적으로 명료하게 전달합니다.
  terminology: ‘원수들의 땅’은 명시되지 않은 ‘네’라는 소유를 보태지 않고 복수형 τῶν ἐχθρῶν을 충실히 반영합니다. ‘죽은 자들’과 ‘더럽혀졌습니다’는 정결·부정의 어휘적 울림을 보존하되, 의례적 접촉으로만 한정하지 않습니다.
