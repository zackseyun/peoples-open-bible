translation:
  language: ko
  text: 주님의 격분과 진노 때문입니다. 주님께서 저를 들어 올리셨다가 내던지셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - …해서입니다
  lexicon: HALOT
  rationale: 원문의 이유 제시 기능을 자연스러운 현대 한국어 원인 표현으로 옮기되, 시적 문맥의 흐름을 유지했습니다.
- source_word: אֵפֶר כַּלֶּחֶם אָכָלְתִּי
  english_pob_choice: I have eaten ashes like bread
  chosen_korean: 재처럼 먹었고
  alternatives_korean:
  - 재를 빵처럼 먹었고
  - 재를 음식처럼 먹었고
  lexicon: HALOT
  rationale: ‘재’를 ‘빵처럼’이라는 비교를 드러내면서도 한국어 시어로는 ‘재처럼 먹었다’가 가장 간결하고 이미지가 살아 있습니다.
- source_word: שִׁקֻּוַי
  english_pob_choice: my drink
  chosen_korean: 내 마실 것
  alternatives_korean:
  - 내 음료
  - 내 음료수
  - 내 마시는 것
  lexicon: HALOT
  rationale: 문맥상 일상적인 음료를 가리키므로, 성례적 뉘앙스를 피하면서도 시적 표현을 살리기 위해 ‘마실 것’으로 옮겼습니다.
- source_word: בִּבְכִי מָסָכְתִּי
  english_pob_choice: mixed my drink with weeping
  chosen_korean: 울음으로 섞었기 때문입니다
  alternatives_korean:
  - 눈물로 섞었기 때문입니다
  - 울음과 섞었기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘울음’(weeping)을 그대로 살려 정서적 상태를 보존했고, 영어 주석의 ‘tears’는 가능한 구체화이지만 본문 의미를 우선해 기본 본문에는 반영하지 않았습니다.
