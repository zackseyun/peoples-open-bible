  text: καὶ ἡμῖν μὲν τοῖς τὴν κακοπάθειαν ἐπιδεδειγμένοις τῆς ἐπιτομῆς οὐ ῥᾴδιον, ἱδρῶτος δὲ καὶ ἀγρυπνίας τὸ πρᾶγμα·
