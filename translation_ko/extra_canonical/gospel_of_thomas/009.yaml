  to: 예수께서 말씀하셨습니다. 「보십시오, 씨 뿌리는 사람이 나가서 손에 가득 쥐고 씨를 뿌렸습니다. 어떤 것들은 길가에 떨어졌는데, 새들이 와서 그것들을 모았습니다. 다른 것들은 바위 위에 떨어졌는데, 뿌리를 땅으로 내리지 못했고 하늘로 이삭을 올리지도 못했습니다.[a] 또 다른 것들은 가시덤불에 떨어졌는데, 가시덤불이 그것들을 모아 씨를 질식시켰으며 벌레가 그것들을 먹었습니다. 또 다른 것들은 좋은 땅에 떨어졌는데, 그 땅이 하늘까지 좋은 열매를 맺었습니다. 그것은 예순 단위와 백스물 단위의 수확을 냈습니다.[b]」
  rationale: 원문의 독특한 가시덤불 장면에서 ‘모으다’라는 동작을 복원하고, 기존 해설의 ‘포획·포위’ 주장은 삭제했습니다. 수직 이미지는 유지하되 한국어 문장을 다듬었으며, 수확량의 단위는 원문이 특정 한국 단위를 요구하지 않으므로 중립적으로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:21Z'
