lexical_decisions:
- source_word: כִּֽי אָ֭מַרְתִּי
  english_pob_choice: For I said
  chosen_korean: 제가 말하기를
  alternatives_korean:
  - 내가 말했습니다
  - 제가 말했습니다
  lexicon: אָמַר
  rationale: 도입절의 인용 표지를 자연스럽게 살리면서도, 본문이 직접 발화 내용을 이어 가므로 ‘말하기를’로 처리해 문장 흐름을 유지했습니다.
- source_word: פֶּן
  english_pob_choice: Otherwise
  chosen_korean: 그렇지 않으면
  alternatives_korean:
  - 아니면
  - 그렇지 아니하면
  lexicon: פֶּן
  rationale: POB가 채택한 ‘Otherwise’를 한국어로 직역에 가깝게 옮겨, ‘~할까 봐’의 추측보다 결과 회피의 뉘앙스를 드러냈습니다.
- source_word: יִשְׂמְחוּ לִי
  english_pob_choice: they would rejoice over me
  chosen_korean: 그들이 저를 보고 즐거워할 것입니다
  alternatives_korean:
  - 그들이 저를 두고 기뻐할 것입니다
  - 그들이 저를 보고 기뻐할 것입니다
  lexicon: שׂמח + ל
  rationale: 전치사 לִי를 단순한 목적어보다 ‘~을 보고/두고’의 반응 대상으로 이해해, 조롱 섞인 기쁨의 방향을 한국어로 분명히 했습니다.
- source_word: בְּמוֹט רַגְלִי עָלַי הִגְדִּילוּ
  english_pob_choice: when my foot slips, they boast against me
  chosen_korean: 제 발이 미끄러질 때 그들은 저를 향해 자만합니다
  alternatives_korean:
  - 제 발이 미끄러질 때 그들은 저를 향해 뽐냅니다
  - 제 발이 흔들릴 때 그들은 저를 거슬러 자랑합니다
  lexicon: מוט + נגד/על
  rationale: ‘boast against me’의 대립적 방향을 살리기 위해 ‘저를 향해’로 옮기고, הִגְדִּילוּ는 과장된 자기 높임의 의미를 담아 ‘자만합니다’로 처리했습니다.
theological_decisions:
- issue: 인용문 내부의 정서적 색채와 화자의 자기 언급
  chosen_reading: 시편 화자는 자신의 넘어짐을 적대자들이 조롱과 자만의 기회로 삼을 것을 염려하며 말합니다.
  alternative_readings:
  - 단순한 승리감의 표현으로 약화해 읽기
  - 도덕적 경고 일반으로 넓혀 읽기
  rationale: 히브리어 본문과 POB의 ‘boast against me’는 적대적 조롱을 가리키므로, 이를 약화시키지 않고 그대로 반영했습니다.
  doctrine_reference: 시편의 탄식/애가 문맥
