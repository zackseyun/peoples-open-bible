id: PSA.119.57
reference: Psalms 119:57
source:
  edition: WLC
  text: חֶלְקִ֖/י יְהוָ֥ה אָמַ֗רְתִּי לִ/שְׁמֹ֥ר דְּבָרֶֽי/ךָ׃
translation:
  text: Yahweh is my portion[a]; I have said that I will keep your words.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: A portion was one's allotted share, especially an inheritance of land.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - the LORD
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: דְּבָרֶֽיךָ
  chosen: word
  alternatives:
  - matter
  - thing
  lexicon: HALOT
  rationale: דָּבָר is God's spoken word. Rendered 'word' consistently; paired with אִמְרָה ('promise') the two utterance-terms stay distinct.
