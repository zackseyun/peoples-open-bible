base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/026.yaml
  text: 'The sons of Merari: Mahli and Mushi. The sons of Jaaziah: his son.'
translation:
  language: ta
  text: 'மெராரியின் மகன்கள்: மக்லி, மூஷி. யாசியாவின் மகன்கள்: அவனுடைய மகன்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இங்கு வம்சப் பட்டியலின் வழக்கமான சொல்லாகவும், எபிரெய மூலத்தின் பன்மை வடிவை நேரடியாகவும் பிரதிபலிக்கிறது.
- source_word: בְנוֹ
  choice: அவனுடைய மகன்
  rationale: மசோரா உரையில் இது இரண்டு சொற்களாக அல்லாமல் ‘அவனுடைய மகன்’ என்ற பொருளுடைய வடிவமாக உள்ளது; ‘பெனோ’ என்ற தனிப்பெயராக மாற்றவில்லை.
theological_decisions:
- issue: בְנוֹ என்பதைக் தனிப்பெயராகவா உறவுமுறையாகவா வாசிப்பது
  choice: அவனுடைய மகன்
  alternative: பெனோ
  rationale: WLC மசோரா உரையின் உயிர்க்குறியீடும் சொற்பிரிப்பும் இதை ‘அவனுடைய மகன்’ என்று ஆதரிக்கின்றன; உரையின் சற்றுக் கடினமான வம்சவழி அமைப்பை விளக்கிச் சீராக்காமல் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான வம்சப் பட்டியல் நடை பயன்படுத்தப்பட்டது. பெயர்கள் எபிரெய ஒலிப்புக்கு அண்மையாக ‘மெராரி’, ‘மக்லி’, ‘மூசி’, ‘யாசியா’ என வழங்கப்பட்டன; மூலத்தில் உள்ள இலக்கணத் தெளிவின்மை விரிவாக்கப்படவில்லை.
