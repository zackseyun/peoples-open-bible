id: PSA.55.13
reference: Psalms 55:13
source:
  edition: WLC
  text: וְ/אַתָּ֣ה אֱנ֣וֹשׁ כְּ/עֶרְכִּ֑/י אַ֝לּוּפִ֗/י וּ/מְיֻדָּֽעִ/י׃
translation:
  text: But you—a man, my equal, my companion[a], and my close friend.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “my guide.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  chosen: But you
  alternatives:
  - And you
  lexicon: HALOT
  rationale: The conjunction with the pronoun marks a sharp contrast with the preceding context; 'But you' brings out the adversative force naturally in English while preserving the direct address.
- source_word: אֱנוֹשׁ
  chosen: a man
  alternatives:
  - man
  - mortal
  lexicon: HALOT
  rationale: אֱנוֹשׁ commonly denotes a human being, often with an overtone of mortality or frailty. Here the emphasis is on the shocking betrayal by a fellow human rather than on mortality itself, so 'a man' is the most natural rendering. This also follows the gender-accurate principle, since the referent is an individual male associate.
- source_word: כְּעֶרְכִּי
  chosen: my equal
  alternatives:
  - of my rank
  - comparable to me
  - according to my estimation
  lexicon: HALOT
  rationale: Comparable standing is naturally expressed appositionally in English.
- source_word: אַלּוּפִי
  chosen: my companion
  alternatives:
  - my close associate
  - my friend
  - my guide
  lexicon: HALOT
  rationale: אַלּוּף can denote an intimate associate, companion, or leader/guide depending on context. In this verse, paired with 'my familiar friend,' the relational sense is primary. 'My companion' preserves closeness without overcommitting to the narrower 'guide,' though that traditional rendering is worth preserving in a footnote.
- source_word: וּמְיֻדָּעִי
  chosen: and my close friend
  alternatives:
  - and my acquaintance
  - and one known to me
  - and my intimate friend
  lexicon: HALOT
  rationale: The term denotes a personally known and intimate associate in this context.
