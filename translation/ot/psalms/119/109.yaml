id: PSA.119.109
reference: Psalms 119:109
source:
  edition: WLC
  text: נַפְשִׁ֣/י בְ/כַפִּ֣/י תָמִ֑יד וְ֝/תֽוֹרָתְ/ךָ֗ לֹ֣א שָׁכָֽחְתִּי׃
translation:
  text: My life is always in danger[a], yet I do not forget your law.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'my life is continually in my hand.'
    reason: lexical_alternative
lexical_decisions:
