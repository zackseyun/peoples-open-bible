base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/026.yaml
  text: '1[7]. And he said, “My son, I have grown old, and now my eyes are too dim to see, and I do not know the day of my death.

    2. And now take your hunting gear, your quiver and your bow, and go out to the field and hunt game for me, my son, and prepare food for me such as my soul loves, and bring it to me so that I may eat, and my soul may bless you before I die.”

    3. And Rebekah was listening while Isaac spoke to Esau.

    4. And Esau went to the open country to hunt game and bring it to his father.

    5. And Rebekah called Jacob her son and said to him, “Look, I heard Isaac your father speaking with Esau your brother, saying, ‘Hunt game for me and prepare food for me and bring it to me, and I will eat and bless you before the LORD before I die.’

    6. And now, my son, listen to my voice in what I command you: go to your flock and take for me two good young kids of the goats, and I will prepare them as food for your father, such as he loves, and you shall bring it to your father, and he will eat, and he will bless you before the LORD before he dies, and you shall be blessed.”

    7. And Jacob said to Rebekah his mother, “Mother, does not my father recognize everything that he eats and discerns it? But I am afraid, my mother[17], that he may hear my voice and not permit me to touch him. And you know that I am smooth, while Esau my brother is hairy, and I will appear in his eyes like one who mocks him, and I will do a deed that he did not command me, and he will be angry with me, and I will bring on myself a curse and not a blessing.”

    8. And Rebekah his mother said to him, “Your curse be on me, my son; only listen to my voice.”

    9. And Jacob listened to the voice of Rebekah his mother, and he went and took two good, fat young kids of the goats and brought them to his mother, and his mother prepared them as food, such as he loved.

    10. And Rebekah took the desirable garments of her elder son Esau, which were with her in the house, and clothed Jacob her younger son with them; and from the skins of the young kids she put them on his hands and on the bare part of his neck.

    11. And she gave the cooked dish and the bread that she had made into the hand of Jacob her son.

    12. And Jacob went in to his father and said, “I am your son; I have done as you told me. Rise, sit, and eat from what I have hunted, father, so that your soul may bless me.”

    13. And Isaac said to his son, “How is it that you found it so quickly, my son?”

    14. And Jacob said, “Because your God caused it to come before me.”

    15. And Isaac said to him, “Come near, and let me feel you, my son, whether you are my son Esau or not.”

    16. And Jacob came near to Isaac his father, and he felt him and said,

    17. “The voice is Jacob’s voice, but the hands are Esau’s hands.” And he did not recognize him, because it was a turn from heaven to remove his spirit,

    18. and Isaac did not recognize him, because his hands were hairy like his brother Esau’s hands, so that he might bless him.

    19. And he said, “Are you really my son Esau?” And he said, “I am your son.” And he said, “Bring it near to me, and I will eat

    20. from your game, my son, so that my soul may bless you.” And he brought it near to him, and he ate; and he brought him

    21. wine, and he drank. And Isaac his father said to him, “Come near and kiss me, my son.” And he came near and kissed him.

    22. And he smelled the smell of his garments and blessed him and said, “Look, the smell of my son is like the smell of a field

    23. full of blessing, which the LORD has blessed. And may the LORD give you—and multiply for you—from the dew of heaven and from the dew of the earth, and abundance of grain and oil may he multiply for you. Let nations serve you,

    24. and peoples bow down to you. Be lord over your brothers, and let your mother’s sons bow down to you. And all the blessing with which the LORD blessed me and blessed Abraham my father—let it be for you and for your seed

    25. forever. Whoever curses you will be cursed, and whoever blesses you will be blessed.” And it happened, after Isaac had finished blessing his son Jacob, and after Jacob had gone out from Isaac his father, that he hid himself;

    26. and Esau his brother came in from his hunting. And he also prepared food and brought it to his father, and said to his father, “Let my father rise and eat from my game, so that your soul may bless me.”

    27. And Isaac his father said to him, “Who are you?” And he said to him, “I am your firstborn, Esau your son; I have done

    28. as you commanded me.” And Isaac was seized with a very great trembling, and he said, “Who then was it that hunted game and brought it to me, and I ate from everything before you came, and I blessed him?

    29. He shall indeed be blessed, and all his seed forever.” And when Esau heard the words of his father Isaac,

    30. he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, father!” And he said to him, “Your brother came with deceit and has taken away your blessings.” And he said, “Now I know why his name was called Jacob: he has supplanted me these two times. First he took my birthright, and now he has taken my blessing.”

    31. And he said, “Have you not reserved a blessing for me, father?” And Isaac answered and said to Esau, “Look, I have made him lord over you, and I have given all his brothers to him as servants; and with abundance

    32. of grain and wine and oil I have strengthened him. And for you, what can I do now, my son?” And Esau said to Isaac his father, “Do you have only one blessing, father? Bless me too, father!”

    33. And Esau raised his voice and wept. And Isaac answered and said to him, “Look, from the dew of the earth

    34. shall be your dwelling, and from the dew of heaven above. And by your sword you shall live, and you shall serve your brother; and it shall be that when you become great and shake his yoke from your neck, then you will sin completely unto death,

    35. and your seed will be uprooted from under heaven.” And Esau hated Jacob because of the blessing with which his father had blessed him, and he said in his heart, “Let the days of mourning for my father come[34][25][23], and I will kill Jacob my brother.”'
  footnotes:
  - marker: '7'
    text: The verse is textually difficult. The Ge'ez seems to say Isaac would recognize or discern what he eats, then shifts to Jacob's fear that Isaac may detect him by his voice and touch. The translation preserves the sense without over-smoothing.
    reason: segmentation_note
  - marker: '17'
    text: The chapter's verse segmentation around vv. 17–21 is uneven in the source rows. The recognition formula and blessing sequence have been rendered in the most coherent order from the Ge'ez.
    reason: segmentation_note
  - marker: '23'
    text: The phrase rendered 'the dew of the earth' is unusual; some readers may expect 'fatness of the earth' from Genesis. The translation follows the Ge'ez wording here rather than harmonizing.
    reason: alternative_reading
  - marker: '25'
    text: The source includes a note-like element suggesting Jacob 'hid himself' after leaving Isaac. This detail is retained because it appears in the Ethiopic wording and is characteristic of Jubilees' retelling.
    reason: textual_variant
  - marker: '34'
    text: This verse is notably difficult and appears expanded in a way unlike Genesis 27:40. The Ge'ez includes language about sin unto death and the removal of Esau's seed from under heaven. The translation reflects that harder reading rather than normalizing it to the Genesis parallel.
    reason: textual_variant
translation:
  language: ko
  text: '1. “내 아들아, 나는 늙었고 이제 내 눈이 어두워져 보지 못합니다. 나는 내가 죽을 날을 알지 못합니다.”

    2. “그리고 이제 네 사냥 도구, 곧 네 화살통과 활을 가지고 들로 나가서 나를 위해 사냥하고 짐승을 잡으십시오, 내 아들이여. 그리고 내 영혼이 사랑하는 음식을 나를 위해 만들어 내게 가져오십시오. 그러면 내가 먹고, 내가 죽기 전에 내 영혼이 그대에게 복을 줄 것입니다.”

    3. 그리고 리브가는 이삭이 에서에게 말하는 동안 듣고 있었습니다.

    4. 에서는 사냥하고 잡은 것을 아버지에게 가져오기 위해 들판으로 나갔습니다.

    5. 리브가가 자기 아들 야곱을 불러 그에게 말했습니다. “보아라, 내가 네 아버지 이삭이 네 형 에서에게 이렇게 말하는 것을 들었다. ‘나를 위해 사냥감을 잡아라. 나를 위해 음식을 준비하여 내게 가져와라. 내가 먹고, 내가 죽기 전에 주님 앞에서 너를 축복하겠다.’”

    6. “이제 내 아들아, 내가 네게 명하는 바를 들으십시오. 네 가축 떼로 가서 나를 위해 좋은 어린 염소 두 마리를 가져오십시오. 그러면 내가 그것들로 네 아버지가 좋아하시는 음식을 만들겠습니다. 너는 그것을 네 아버지께 가져다 드리십시오. 그러면 아버지께서 잡수시고, 죽기 전에 주님 앞에서 너를 축복하실 것이며, 너도 복을 받을 것입니다.”

    7. 야곱이 어머니 리브가에게 말했습니다. “어머니, 아버지께서 드시고 좋아하시는 모든 것 가운데 제게 부족한 것이 있겠습니까? 그러나 어머니, 아버지께서 제 목소리를 알아보시고 저를 만지려고 하실까 두렵습니다. 어머니도 아시다시피 저는 털이 없고, 제 형 에서는 털이 많습니다. 그러면 저는 아버지 눈에 아버지를 조롱하는 사람처럼 보일 것이며, 아버지께서 제게 명령하지 않으신 일을 하게 될 것입니다. 아버지께서는 제게 화를 내시고, 저는 복이 아니라 저주를 스스로 불러오게 될 것입니다.”

    8. 그러자 그의 어머니 리브가가 그에게 말했습니다. “내 아들아, 네 저주가 내게 내리게 하십시오. 다만 내 말을 들으십시오.”

    9. 야곱은 자기 어머니 리브가의 말을 듣고 가서 좋고 살진 염소 새끼 두 마리를 잡아 어머니에게 가져왔습니다. 그의 어머니는 그것들을 그가 좋아하는 음식으로 준비했습니다.

    10. 리브가가 집에 있던 큰아들 에서의 아름답고 탐스러운 옷을 가져다가 작은아들 야곱에게 입혔습니다. 또 어린 염소 새끼들의 가죽을 야곱의 손과 목의 드러난 부분에 덮었습니다.

    11. 그녀는 익힌 음식과 자신이 만든 빵을 아들 야곱의 손에 주었습니다.

    12. 야곱이 아버지에게 들어가 말했습니다. “저는 아버지의 아들입니다. 아버지께서 제게 말씀하신 대로 했습니다. 일어나 앉으시고, 제가 사냥한 것을 드십시오, 아버지. 아버지의 영혼이 저를 축복하도록 하십시오.”

    13. 이삭이 자기 아들에게 말했습니다. “내 아들아, 어떻게 이렇게 빨리 그것을 찾았습니까?”

    14. 야곱이 말했습니다. “당신의 하나님께서 그것을 제 앞에 가져오셨기 때문입니다.”

    15. 이삭이 그에게 말했습니다. “내 아들아, 가까이 오십시오. 네가 내 아들 에서인지 아닌지, 내가 너를 만져 보겠습니다.”

    16. 야곱이 그의 아버지 이삭에게 가까이 가니, 이삭이 그를 만져 보고 말하였습니다:

    17. “목소리는 야곱의 목소리인데, 손은 에서의 손입니다.” 그는 그를 알아보지 못했습니다. 그것은 그의 영을 거두기 위한 하늘로부터의 전환이었기 때문입니다.

    18. 그리고 이삭은 야곱의 손이 그의 형 에서의 손처럼 털이 많았기 때문에 야곱을 알아보지 못하여, 그에게 복을 주었습니다.

    19. 그가 말했습니다. “정말 네가 내 아들 에서입니까?” 그가 말했습니다. “제가 아버지의 아들입니다.” 그가 말했습니다. “그것을 내게 가까이 가져오십시오. 그러면 제가 먹겠습니다.”

    20. “네가 사냥한 것 중에서, 내 아들아, 내 영혼이 너를 축복할 수 있도록.” 그리고 그는 그것을 그에게 가져왔고, 그는 먹었습니다. 또 그에게 가져왔습니다.

    21. 그는 포도주를 마셨습니다. 그의 아버지 이삭이 그에게 말했습니다. “가까이 와서 내게 입맞추어라, 내 아들아.” 그가 가까이 와서 그에게 입맞추었습니다.

    22. 그가 그의 옷의 향기로운 냄새를 맡고 그를 축복하며 말했습니다. 「보십시오, 내 아들의 냄새는 들판의 냄새와 같습니다.」

    23. 주께서 복 주신 가득 찬 [들]입니다. 주께서 하늘의 이슬과 땅의 이슬을 당신에게 주시고 당신을 번성하게 하시며, 곡식과 기름을 풍성하게 당신에게 더해 주시고, 그들이 당신을 섬기게 하시기를 빕니다.

    24. 민족들과 백성들이 당신에게 절하게 되기를 바랍니다. 당신이 형제들을 다스리시고, 당신의 어머니의 아들들이 당신에게 절하게 되기를 바랍니다. 하나님께서 저를 축복하시고 제 아버지 아브라함을 축복하신 모든 복이 당신과 당신의 후손에게 있기를 바랍니다.

    25. 영원토록. 당신을 저주하는 사람은 저주를 받을 것이고, 당신을 축복하는 사람은 복을 받을 것입니다.” 그 뒤에 이런 일이 있었습니다. 이삭이 자기 아들 야곱을 축복하기를 마치고, 야곱이 자기 아버지 이삭에게서 나간 뒤에, 야곱은 몸을 숨겼습니다.

    26. 그의 형 에서도 사냥에서 돌아왔습니다. 그도 음식을 준비하여 아버지에게 가져다드리고, 아버지에게 말했습니다. “아버지, 일어나셔서 제가 사냥한 것을 드십시오. 그러면 아버지의 영혼이 저를 축복할 것입니다.”

    27. 그의 아버지 이삭이 그에게 말했습니다. “당신은 누구십니까?” 그러자 그가 그에게 말했습니다. “저는 당신의 맏아들 에서, 당신의 아들입니다. 제가 했습니다.”

    28. “아버지께서 제게 명하신 대로입니다.” 그러자 이삭은 몹시 크게 떨며 말했습니다. “그렇다면 사냥하여 사냥감을 잡아 내게 가져온 이는 누구입니까? 내가 네가 오기 전에 그것을 모두 먹고 그를 축복했는데?”

    29. 그와 그의 모든 씨가 영원히 복을 받을 것입니다.” 그리고 에서가 그의 아버지 이삭의 말을 들었을 때,

    30. 그가 매우 크고 쓰라린 부르짖음을 터뜨리며 아버지에게 말했습니다. “저도 축복해 주십시오, 아버지!” 그러자 아버지가 그에게 말했습니다. “네 형이 속임수로 와서 네 축복들을 빼앗아 갔다.” 그가 말했습니다. “이제야 그의 이름이 야곱으로 불린 이유를 알겠습니다. 그는 나를 두 번이나 속였습니다. 처음에는 내 장자권을 빼앗았고, 이제는 내 축복을 빼앗았습니다.”

    31. 그가 말했습니다. “아버지, 제게도 복을 남겨 두지 않으셨습니까?” 이삭이 에서에게 대답하여 말했습니다. “보십시오, 나는 그를 당신의 주인으로 삼았고, 그의 모든 형제들을 그에게 종들로 주었습니다. 또 풍성함과 함께.”

    32. 곡식과 포도주와 기름으로 내가 그를 부양하였습니다. 너에게는 내가 이제 무엇을 해 줄 수 있겠습니까, 내 아들아?” 에서가 자기 아버지 이삭에게 말하였습니다. “아버지, 축복이 하나뿐입니까? 저도 축복해 주십시오, 아버지!”

    33. 에서가 목소리를 높여 울었습니다. 이삭이 대답하여 그에게 말했습니다. “보십시오, 땅의 이슬로부터…

    34. 네 거처는 위에 있는 하늘의 이슬에서 나올 것입니다. 또 네 칼로 살 것이며, 네 형제를 섬길 것입니다. 그리고 네가 반역하여 목에서 멍에를 벗을 때에는, 그때 네가 죽음에 이르는 완전한 죄를 지을 것입니다.

    35. 그리고 너의 씨는 하늘 아래에서 뿌리째 뽑힐 것입니다.” 에서는 아버지가 자기에게 베푼 복 때문에 야곱을 미워하였고, 마음속으로 말했습니다. “이제 내 아버지를 애도할 날들이 가까이 오기를 바랍니다. 그러면 내 아우 야곱을 죽이겠습니다.”'
