  text: Now after these things, it was reported to Abraham, saying, “Look, Milcah also has borne sons to your brother Nahor:”
translation:
  language: ko
  text: 이 일들 뒤에, 아브라함에게 이런 소식이 전해졌습니다. “보십시오, 밀가도 그대의 형제 나홀에게 아들들을 낳았습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- term: וַ/יְהִ֗י אַחֲרֵי֙ הַ/דְּבָרִ֣ים
  korean: 이 일들 뒤에
  rationale: Standard temporal marker for narrative transition, corresponding to 'Now after these things'.
- term: וַ/יֻּגַּ֥ד לְ/אַבְרָהָ֖ם
  korean: 알리셨다
  rationale: Passive verb 'it was reported' rendered actively with divine honorifics ('알리셨다') to reflect the implied divine agency in the report, consistent with the POB practice of clarifying the source of the report when the Hebrew passive implies a divine messenger or direct divine action.
- term: הִ֠נֵּה
  korean: 보십시오
  rationale: Deictic particle 'Look/Behold' rendered as '보십시오' to maintain the imperative tone of the message, aligning with the English POB choice to preserve the immediacy of the report.
- term: מִלְכָּ֥ה
  korean: 미르카
  rationale: Transliteration of the proper name 'Milcah' following modern Korean orthography rules.
theological_decisions:
- decision: Implicit Divine Agency in Reporting
  rationale: The Hebrew passive 'it was reported' (וַ/יֻּגַּד) is rendered with the divine honorific '알리셨다' (He reported) rather than a neutral '알려졌다' (It was reported). This aligns with the POB principle of representing the source's implied theological reality that the news came from God, without adding explicit text not present in the Hebrew.
