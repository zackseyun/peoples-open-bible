  text: Καὶ προσελθόντες αὐτῷ πάντες ἄρχοντες υἱῶν Ἠσαῦ καὶ πάντες οἱ ἡγούμενοι τοῦ λαοῦ Μωὰβ καὶ οἱ στρατηγοὶ τῆς παραλίας εἶπαν
