base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/012.yaml
  text: 'So you shall say to them this word: Thus says the LORD, the God of Israel, ‘Every jar will be filled with wine.’ And they will say to you, ‘Do we not certainly know that every jar will be filled with wine?’'
translation:
  language: ko
  text: 너는 그들에게 이렇게 말해야 합니다. “야훼, 이스라엘의 하나님이 이렇게 말씀하십니다. ‘모든 항아리는 포도주로 채워질 것입니다.’” 그러면 그들이 네게 말할 것입니다. “모든 항아리가 포도주로 채워질 것을 우리가 분명히 알고 있지 않습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Thus says the LORD, the God of Israel
  chosen_korean: “야훼, 이스라엘의 하나님이 이렇게 말씀하십니다”
  alternatives_korean:
