source:
  edition: WLC
  text: כִּ֤י לֹ֣א לָ֭/נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן תִּקְוַ֥ת ענוים תֹּאבַ֥ד לָ/עַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/018.yaml
  text: For the needy will not be forgotten forever[a][b]; the hope of the afflicted will not perish forever.
  footnotes:
  - marker: a
    text: Hebrew poetry uses two near-parallel expressions, 'forever' and 'for all time,' to stress that the needy are not abandoned permanently.
    reason: cultural_note
  - marker: b
    text: Or 'the humble' or 'the meek' for 'the afflicted' (Hebrew ענוים).
    reason: lexical_alternative
translation:
  language: ko
  text: 가난한 이는 영원히 잊히지 않을 것이며, 고난받는 이들의[a] 소망은 영원히 사라지지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘겸손한 이들’ 또는 ‘온유한 이들’. 히브리어 ענוים은 고난받거나 낮아진 이들을 가리킬 수 있으며, 겸손이나 온유의 뜻도 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리 시는 ‘영원히’와 ‘영원히’를 이루는 두 병행 표현을 사용하여, 가난한 이들과 고난받는 이들이 영구히 버려지지 않음을 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: יָשׁוּבוּ
  english_pob_choice: will return
  chosen_korean: 돌아갈 것이며
  alternatives_korean:
  - 되돌아갈 것이며
  - 돌아오게 될 것입니다
  lexicon: HALOT
  rationale: שוב의 기본 의미를 살려 ‘돌아가다’로 옮겼고, 시편의 하강/귀환 이미지를 자연스럽게 드러내도록 미래형으로 처리했습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들은
  alternatives_korean:
  - 악한 자들은
  - 죄인들은
  lexicon: HALOT
  rationale: 도덕적으로 악한 사람들을 가리키는 표준적 명사적 용법이므로 ‘악인들’이 가장 간결하고 원어의 범주를 잘 보존합니다.
- source_word: לִשְׁאוֹלָה
  english_pob_choice: to Sheol
  chosen_korean: 스올로
  alternatives_korean:
  - 음부로
  - 죽은 자들의 세계로
  - 무덤으로
  lexicon: HALOT
  rationale: 스올은 후대의 ‘지옥’과 동일시되지 않는 히브리어 개념이므로 음역을 유지해 의미 범위를 보존했습니다.
- source_word: שְׁכֵחֵי אֱלֹהִים
  english_pob_choice: that forget God
  chosen_korean: 하나님을 잊어버린
  alternatives_korean:
  - 하나님을 잊은
  - 하나님을 망각한
  lexicon: HALOT
  rationale: 현재적 성격을 지닌 분사구문을 한국어 관용에 맞는 관형절로 옮겼고, אֱלֹהִים은 이 문맥에서 ‘하나님’이 적절합니다.
theological_decisions:
- issue: שְׁאוֹל의 번역 범위
  chosen_reading: 스올로 음역하여, 후대의 교리적 의미가 강한 ‘지옥’으로 확정하지 않았습니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  - 지옥
  rationale: 본문은 악인의 심판적 운명을 말하지만, 히브리어 עצמו는 ‘지옥’의 후대적 정교한 개념을 요구하지 않으므로 용어의 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy; Preserve theological tension rather than resolve it.'
