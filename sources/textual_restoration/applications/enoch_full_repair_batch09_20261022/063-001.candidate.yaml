translation:
  text: In those days the mighty and the kings who hold the dry land will plead with the angels of punishment, to
    whom they have been handed over, to grant them a little rest, so that they may fall down and bow before the
    Lord of Spirits and acknowledge their sins before him.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The handed-over relation belongs to the punished people, not a new angelic punishment of the angels. A
      little rest is limited in extent, not pardon or release. Acknowledge their sins follows the selected confession
      construction and does not insert a claim that the request is granted.
    reason: lexical_alternative
