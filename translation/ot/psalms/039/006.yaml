id: PSA.39.6
reference: Psalms 39:6
source:
  edition: WLC
  text: אַךְ בְּ/צֶ֤לֶם יִֽתְהַלֶּךְ אִ֗ישׁ אַךְ הֶ֥בֶל יֶהֱמָי֑וּ/ן יִ֝צְבֹּ֗ר וְֽ/לֹא יֵדַ֥ע מִי אֹסְפָֽ/ם־׀־־־־׃
translation:
  text: Surely people walk about like phantoms[a]; surely they are in turmoil in vain. They heap up possessions but do not know who will gather them.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “in/as an image,” suggesting a passing semblance without lasting substance.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  chosen: surely
  alternatives:
  - only
  - indeed
  - surely
  lexicon: HALOT
  rationale: Used twice in the verse as an asseverative/adversative particle emphasizing the psalmist's observation. 'Surely' preserves the force and poetic repetition better than 'only' here.
- source_word: בְּצֶלֶם
  chosen: as an image
  alternatives:
  - in an image
  - as a mere semblance
  - as a phantom
  lexicon: HALOT
  rationale: Restores the lexical image rather than substituting “shadow.”
- source_word: יִתְהַלֶּךְ אִישׁ
  chosen: a man walks about
  alternatives:
  - man goes about
  - a person walks about
  lexicon: HALOT
  rationale: Hitpael of הלך conveys movement about or conduct. 'Walks about' fits the poetic image. 'A man' follows the gender-accurate policy for אִישׁ, which here represents humanity through the singular male form.
- source_word: הֶבֶל
  chosen: in vain
  alternatives:
  - vanity
  - mere breath
  - emptiness
  lexicon: HALOT
  rationale: Although הֶבֶל often means 'breath' or 'vanity,' here it functions adverbially with the tumult clause, expressing futility. 'In vain' best fits the syntax and idiomatic English.
- source_word: יֶהֱמָיוּן
  chosen: they are in turmoil
  alternatives:
  - they make an uproar
  - they bustle about
  - he is in turmoil
  lexicon: HALOT
  rationale: From המה, denoting noise, agitation, or tumult. The plural form is syntactically difficult after singular אִישׁ; an impersonal/generic plural sense is well represented by 'they are in turmoil,' conveying humanity's restless activity. This is a documented shift for readable English while preserving the Hebrew verbal number.
- source_word: יִצְבֹּר
  chosen: he heaps things up
  alternatives:
  - he gathers up
  - he stores up
  lexicon: HALOT
  rationale: Avoids unwarranted specification of the unstated object.
- source_word: וְלֹא יֵדַע
  chosen: and does not know
  alternatives:
  - but does not know
  lexicon: HALOT
  rationale: Straightforward conjunction plus negated ידע. 'And does not know' preserves the Hebrew coordination.
- source_word: מִי אֹסְפָם
  chosen: who will gather them
  alternatives:
  - who will gather them
  - who will collect it
  lexicon: HALOT
  rationale: Retains the plural suffix and leaves the accumulated items unspecified.
- source_word: הֶבֶל יֶהֱמָיוּן
  chosen: people are in turmoil in vain
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Idiomatic English reflects the plural verb and the adverbial contextual force of הבל without inventing a purposive object.
