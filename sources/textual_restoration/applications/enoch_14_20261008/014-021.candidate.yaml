translation:
  text: And no one among the angels could enter and see the face of the Honored and
    Praised One,[a] nor could anyone of flesh see him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Honored and Praised One” provisionally renders the selected printed Geʿez
      title construction. Apparatus12 calls the wording probably corrupt and proposes
      a reading corresponding to Greek διὰ τὸ ἔντιμον καὶ ἔνδοξον, an honor/glory
      explanation rather than this personal title. The body retains the selected Geʿez
      construction without treating it as certain or substituting Great Glory from
      verse20.
    reason: textual_variant
lexical_decisions: []
theological_decisions:
- issue: Identity of the enthroned figure
  chosen_reading: Retain the source's descriptors rather than insert 'God' into the
    verse.
  alternative_readings:
  - Identify the figure explicitly as God
  rationale: The surrounding vision may identify the figure, but this verse expresses
    the identity through its paired honorifics.
- issue: Meaning of 'flesh'
  chosen_reading: A fleshly being contrasted with angels
  alternative_readings:
  - Sinful human nature
  rationale: The contrast concerns who can behold the figure, not moral depravity.
