  to: 너는 그것을 보리 떡처럼 먹어야 하며, 사람의 배설물 위에서 그것을 구워야 합니다. 그들이 보는 앞에서 그렇게 해야 합니다.
  rationale: 마지막 문장을 ‘그들이 보는 앞에서’로 고쳐 히브리어의 ‘그들의 눈앞에서’를 정확하고 자연스러운 합쇼체 한국어로 옮겼습니다. ‘보리 떡처럼’은 본문의 비교적 용법을 자연스럽게 반영하므로 별도 대안 각주는 필요하지 않습니다.
