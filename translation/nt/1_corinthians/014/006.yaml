  rationale: Within 1 Corinthians 12–14, the term refers to the debated spiritual-speech phenomenon. The translation preserves the conventional and contextually specific sense without resolving broader theological debates about its nature.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
