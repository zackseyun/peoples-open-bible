  source_fidelity: 개정이 필요합니다. τελευτῆς에는 본문상 2인칭 소유격이 없으므로 ‘너의 마지막 날들’보다 ‘죽음의 날들’이 더 충실합니다. ἐν ἀποστροφῇ προσώπου는 주체를 보태지 않은 ‘얼굴을 돌리는 때에’로 옮겨, 얼굴을 돌이키는 행위와 그 주체의 암시성을 유지했습니다.
