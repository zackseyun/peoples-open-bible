  - source_phrase: בֶּקַע מִשְׁקָלוֹ
    prior_rendering: weighing a beka
    new_rendering: weighing half a shekel
    rationale: A beka means half a shekel; expressing the equivalent directly communicates the weight while the note preserves the source term and its scale.
  - source_phrase: עַל יָדֶיהָ עֲשָׂרָה זָהָב מִשְׁקָלָם
    prior_rendering: for her hands weighing ten shekels of gold
    new_rendering: for her wrists, together weighing ten shekels
    rationale: The bracelets are intended for her wrists, and the stated weight is their combined weight, not the weight of each bracelet.
