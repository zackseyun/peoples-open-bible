  rationale: 'The Hebrew sets up a conventional contrast between divine and human evaluation: ''God and man.'' Following the project''s gender-accurate policy, ''man'' is retained because it matches the source form and idiom here, while the broader human sense can be noted in a footnote.'
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral; Contested terms table for אָדָם'
