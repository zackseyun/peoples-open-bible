simplification_decisions:
- pob_phrase: the wages of sin is death
  simplified_phrase: Sin’s wages are death
  preserved_meaning: Death is the recompense that sin pays.
  reasoning_layer_used: POB lexical decision for ὀψώνια and ἁμαρτίας
  rationale: The possessive form makes the wage image natural while retaining the earned-recompense sense.
- pob_phrase: the gift of God
  simplified_phrase: God’s gift
  preserved_meaning: Eternal life is given by God rather than earned.
  reasoning_layer_used: POB lexical decision for χάρισμα
  rationale: The shorter possessive form clarifies the direct contrast between sin’s wages and God’s gift.
- pob_phrase: in Messiah Jesus our Lord
  simplified_phrase: in Messiah Jesus our Lord
  preserved_meaning: Eternal life is found in the sphere of or union with Messiah Jesus.
  reasoning_layer_used: POB theological decision on ἐν Χριστῷ Ἰησοῦ
  rationale: Retaining “in” preserves Paul’s relational wording without narrowing it to means or cause.
translation_notes:
  risk_flags:
