    rationale: The father metaphor itself conveys their moral derivation and relationship; the direct English statement preserves its confrontational force.
  - source_phrase: τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν
    prior_rendering: you want to do your father’s desires
