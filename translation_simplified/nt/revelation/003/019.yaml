translation:
  language: en
  text: I rebuke and discipline everyone I love. So be earnest and repent[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Here “discipline” means correction that trains a person, not merely punishment.
    reason: simplification_note
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Those whom I love, I rebuke and discipline
  simplified_phrase: I rebuke and discipline everyone I love
  preserved_meaning: Christ lovingly corrects all who belong to the group he loves.
  reasoning_layer_used: Lexical decisions for ὅσους ἐὰν, φιλῶ, ἐλέγχω, and παιδεύω
  rationale: The direct sentence order is easier to follow while preserving love, rebuke, and formative discipline.
- pob_phrase: Therefore
  simplified_phrase: So
  preserved_meaning: The command follows logically from Christ’s loving correction.
  reasoning_layer_used: Lexical decision for οὖν
  rationale: “So” expresses the same conclusion in more natural everyday English.
- pob_phrase: be zealous
  simplified_phrase: be earnest
  preserved_meaning: The hearers must respond with serious and active resolve.
  reasoning_layer_used: Lexical decision for ζήλευε
  rationale: The documented alternative “be earnest” communicates the command clearly without losing its intensity.
translation_notes:
  risk_flags:
  - risk: “Discipline” may be understood as punishment alone.
    mitigation: The footnote states its corrective and formative sense.
  - risk: “Be earnest” may sound slightly less intense than “be zealous.”
    mitigation: The wording retains a direct command and is supported by the POB lexical alternative.
