  naturalness: ‘공중의 새’, ‘바다의 물고기’, ‘바다의 길을 지나가는 모든 것’은 현대 표준어의 격식 있는 성경 문체로 자연스럽습니다. ‘바다의 길들’처럼 부자연스러운 복수 표기는 피하고, 한국어에서 자연스러운 단수형 ‘길’로 포괄했습니다.
  terminology: צִפּוֹר은 집합적 의미로 ‘새’, דְגֵי הַיָּם은 ‘바다의 물고기’로 옮겼습니다. עֹבֵר는 특정한 물고기에만 한정하지 않고 ‘지나가는 모든 것’으로 옮겨 집합적·총괄적 범위를 유지했습니다. 신학적 해석을 추가하지 않았습니다.
