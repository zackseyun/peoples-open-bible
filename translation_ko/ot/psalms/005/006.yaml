- from: 오만한 자들은 주님 앞에 서지 못하며, 주님께서는 모든 악을 행하는 자들을 미워하십니다.[a][b]
  to: 주님께서는 거짓을 말하는 자들을 멸하십니다.[a] 야훼께서는 피를 흘리고 속이는 사람을 혐오하십니다.
  rationale: 제시된 원문에 맞추어 번역을 전면 교체했습니다. תְּאַבֵּד는 문맥상 일반적 현재로 ‘멸하십니다’라고 옮기고 미래적 이해 가능성은 각주에 남겼습니다. דֹּבְרֵי כָזָב은 동작성을 유지해 ‘거짓을 말하는 자들’로, אִישׁ דָּמִים וּמִרְמָה는 자연스러운 한국어 관용에 맞춰 ‘피를 흘리고 속이는 사람’으로 옮겼습니다. 기존 절에 속한 각주 둘은 삭제하고 현 절에 실제로 관련된 각주 하나만 두었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:46:23Z'
