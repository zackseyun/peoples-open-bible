    rationale: '''Wealth'' conveys the familiar meaning of the Aramaic loanword to the first hearers, including possessions rather than money alone. The surrounding masters imagery and the verb ''serve'' preserve its personification as God''s rival; ''both'' makes the incompatible allegiance explicit.'
