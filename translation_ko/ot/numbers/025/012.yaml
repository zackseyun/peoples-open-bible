  source_fidelity: 히브리어 נֹתֵן(분사)은 이 문맥에서 하나님이 맺어 주시는 언약을 선언하는 용법입니다. 초안의 ‘주고 있습니다’는 진행 중인 행위로 들려 선언적·미래지향적 뉘앙스를 충분히 담지 못합니다. ‘주겠습니다’는 이 선언의 효력을 자연스럽게 반영합니다.
  naturalness: ‘그러므로 말하십시오’와 ‘보십시오’는 현대 표준어 합쇼체로 자연스럽습니다. 다만 ‘내 평화의 언약을 주고 있습니다’는 한국어에서 다소 부자연스럽고, 언약 수여의 선언으로는 ‘주겠습니다’가 더 적절합니다.
  terminology: בְּרִית는 ‘언약’, שָׁלוֹם은 ‘평화’로 유지하는 것이 원문 및 영어 POB의 ‘covenant of peace’에 충실합니다. ‘내 평화의 언약’은 소유·수식 관계도 보존합니다.
  issues:
