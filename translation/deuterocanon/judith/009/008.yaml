  - source_phrase: τὸ σκήνωμα τῆς καταπαύσεως τοῦ ὀνόματος τῆς δόξης σου
    prior_rendering: the tabernacle, the resting place of your glorious name
    new_rendering: the dwelling where your glorious name rests
    rationale: The threatened sanctuary is the temple in Jerusalem, not a portable tent; “dwelling” preserves the sacred habitation image, while the relative clause makes the compressed relationship clear.
