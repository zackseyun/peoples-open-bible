  to: 강한 자여, 왜 악을 자랑합니까? 하나님의 한결같은 사랑은 온종일 계속됩니다.
  rationale: 대상 히브리어 본문에 맞추어 번역을 전면 교체했습니다. מַה תִּתְהַלֵּל은 ‘왜 … 자랑합니까?’로, בְּרָעָה는 ‘악을’로, הַגִּבּוֹר는 호격 ‘강한 자여’로 옮겼습니다. 영어 POB의 문장 분할을 따라 חֶסֶד אֵל כָּל־הַיּוֹם은 ‘하나님의 한결같은 사랑은 온종일 계속됩니다’로 번역했습니다. 제공된 본문에는 이 구절 자체의 번역에 필요한 각주 근거가 없으므로 각주는 두지 않았습니다.
