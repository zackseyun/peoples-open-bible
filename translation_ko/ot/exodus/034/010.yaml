    issue: ‘네가 있는 그들 가운데 모든 백성’의 수식 관계가 어색하고 원문의 집합명사 구문을 불분명하게 함
    rationale: אַתָּה בְקִרְבּוֹ는 ‘네가 그 가운데 있는’으로, 뒤의 ‘모든 백성’을 수식합니다. ‘그들’이라는 별도 지시 대상을 넣지 않는 것이 자연스럽고 정확합니다.
  - severity: low
