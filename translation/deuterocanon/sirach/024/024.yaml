translation:
  text: Do not let your strength fail; cling to God[a], so that you may be strengthened[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'cling to the law'; the Greek pronoun can refer to God or to the law in verse 23.
    reason: alternative_reading
  - marker: b
    text: This verse is absent from the shorter Greek textual tradition.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκλίπητε
  chosen: fail
  alternatives:
  - cease
  - faint
  - grow weary
  lexicon: LEH
  rationale: The verb can mean fail, cease, or faint. With ἐν ἰσχύϊ, 'fail' best preserves the exhortation against losing strength without becoming paraphrastic.
- source_word: ἰσχύϊ
  chosen: strength
  alternatives:
  - might
  - vigor
  lexicon: LEH
  rationale: ἰσχύς denotes strength, might, or vigor. 'Strength' is the most direct and idiomatic English equivalent here.
- source_word: κολλᾶσθε
  chosen: cling
  alternatives:
  - hold fast
  - join yourselves
  lexicon: LEH
  rationale: The middle/passive form carries the sense of attaching oneself closely. 'Cling' preserves the deliberate, covenantal sense of close adherence.
- source_word: αὐτῷ
  chosen: him
  alternatives:
  - it
  lexicon: LEH
  rationale: The dative pronoun may be masculine or neuter, but in this exhortational setting 'him' is the most natural rendering for steadfast attachment to the Lord.
- source_word: κραταιωθῆτε
  chosen: be strengthened
  alternatives:
  - be made strong
  - grow strong
  lexicon: LEH
  rationale: The passive subjunctive expresses the result of clinging. 'Be strengthened' preserves that passive/resultative force naturally in English.
