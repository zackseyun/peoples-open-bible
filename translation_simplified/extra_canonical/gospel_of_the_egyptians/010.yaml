    The cloud [obeyed and produced] two single beings, each [having] light. [. . . the throne] she had set up in the cloud [above].


    Then Sakla, the great [angel, saw] the great demon [who was with him, Nebr]uel. [Together] they became an earthly spirit that could produce offspring. [They brought forth] attendant angels.


    Sakla [said] to the great [demon] Nebruel, “Let [the] twelve realms come into being in [the . . .] realm, worlds [. . .].”


