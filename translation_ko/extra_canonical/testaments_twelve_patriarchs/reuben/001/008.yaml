  rationale: 근거 없는 단독 각주 표지를 삭제하고, 마지막 구절을 기간과 죽음에 이를 정도의 쇠약을 자연스럽고 정확하게 나타내도록 다듬었습니다. ‘주님’과 ‘악을 행하였습니다’는 유지하여 원문의 호칭 및 비특정적 표현을 보존했습니다.
