- issue: Rendering the divine name יהוה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Force of the prohibition in context
  chosen_reading: A direct prohibition against treating the LORD as the nations treat their gods
  alternative_readings:
  - A narrower prohibition only against destroying Yahwistic worship objects
  rationale: The terse Hebrew depends on the immediately preceding context. The translation keeps the concise wording of the Hebrew ('do so') rather than importing the fuller explanation into the main text, preserving the text's compactness while allowing contextual clarification in a footnote.
