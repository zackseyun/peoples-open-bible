  - 다윗에 의한
  lexicon: HALOT
  rationale: לְדָוִד는 저작, 소속, 헌정의 가능성을 모두 열어 두는 표제 관용구이므로, 소유·관련을 비교적 중립적으로 나타내는 '다윗의'로 옮겼습니다.
- source_word: לְהַזְכִּיר
