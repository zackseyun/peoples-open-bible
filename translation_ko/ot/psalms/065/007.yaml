  lexicon: HALOT
  rationale: 히브리어 정관사는 특정 창조 세계의 산들을 가리키는 일반 명칭이므로, 한국어에서는 복수형 ‘산들을’로 옮겨 자연스럽게 처리했습니다.
- source_word: בְּכֹחוֹ
  english_pob_choice: by his power
  chosen_korean: 권능으로
  alternatives_korean:
  - 힘으로
  - 능력으로
  - 권세로
  lexicon: HALOT
  rationale: כֹּחַ는 힘/능력을 뜻하지만, 시편의 높임 있는 문맥에서 하나님의 주권적 능력을 드러내는 ‘권능’이 가장 어울립니다.
- source_word: נֶאְזָר בִּגְבוּרָה
  english_pob_choice: being girded with might
  chosen_korean: 능력으로 띠를 띠고 계십니다
  alternatives_korean:
  - 힘으로 띠를 띠고 계십니다
  - 능력으로 무장하고 계십니다
  - 능력으로 둘러싸여 계십니다
  lexicon: HALOT
  rationale: אזר의 ‘띠를 띠다’는 몸에 걸쳐 준비된 상태를 그리는 표현이므로, 이미지와 현재 분사를 살려 ‘띠를 띠고 계십니다’로 옮겼습니다.
theological_decisions:
- issue: 두 분사의 관계와 시적 이미지
  chosen_reading: 두 분사를 모두 하나님을 묘사하는 지속적 상태로 살려, ‘세우시고… 띠를 띠고 계십니다’로 옮겼습니다.
  alternative_readings:
  - ‘세우시며… 띠를 띠셨습니다’처럼 서술형으로 정리함
  - ‘세우시는 분이시며… 능력으로 입고 계십니다’처럼 해석적으로 풀어씀
  rationale: 히브리어는 연속된 분사로 하나님의 특징적 행위를 묘사하므로, 한국어에서도 그 반복성과 시적 흐름을 보존하는 것이 본문 효과를 가장 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
