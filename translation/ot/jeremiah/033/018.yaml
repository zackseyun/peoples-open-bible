  to: And for the Levitical priests, a man shall not be cut off from before me who offers up a burnt offering, who burns a grain offering, and who makes a sacrifice all the days.
  rationale: Added the article in 'makes a sacrifice' for more natural English while preserving the Hebrew sense. Kept the rest unchanged as accurate and complete.
