  yaml_path: translation/ot/psalms/041/006.yaml
  text: If one comes to see me[a], he speaks falsely; his heart gathers wickedness for him. Then he goes outside and tells it.
  footnotes:
  - marker: a
    text: Hebrew “to see”; “me” is supplied from the context.
    reason: ellipsis
translation:
  language: ko
  text: 그가 나를 보러 오면 거짓을 말합니다. 그의 마음은 속으로 악을 모으고, 밖으로 나가서는 그것을 말합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘보러 오면’이라고 하며, 목적어는 문맥상 화자(‘나’)로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거짓’으로 옮긴 히브리어 낱말은 ‘헛됨’ 또는 ‘속임’의 뜻도 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘밖으로’라고 합니다. ‘그것’은 그가 마음속에 모은 악한 내용을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹיְבַי
  english_pob_choice: My enemies
  chosen_korean: 내 원수들이
  alternatives_korean:
  - 내 적들이
  - 나를 대적하는 자들이
  lexicon: HALOT
  rationale: 1인칭 소유 접미사가 붙은 복수 명사로, 시편 문맥에서 직접적인 적대 관계를 가장 자연스럽게 드러내는 한국어는 ‘원수들’입니다.
- source_word: רַע לִי
  english_pob_choice: evil against me
  chosen_korean: 내게 악한 말을 합니다
  alternatives_korean:
  - 내게 해로운 말을 합니다
  - 나를 향해 악을 말합니다
  lexicon: HALOT
  rationale: 히브리어는 ‘악/해로운 것’을 ‘나에게’ 향하게 하는 표현이어서, 한국어에서는 어색한 직역보다 ‘악한 말을 하다’로 적대적 발화를 살렸습니다.
- source_word: וְאָבַד שְׁמוֹ
  english_pob_choice: and his name perish
  chosen_korean: 그의 이름이 사라질까
  alternatives_korean:
  - 그의 이름이 멸망할까
  - 그의 이름이 없어질까
  lexicon: HALOT
  rationale: ‘이름’은 단순 호칭뿐 아니라 기억과 명성을 포함할 수 있지만, 본문이 실제로 ‘이름’을 말하므로 본문어휘를 유지해 ‘사라질까’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시편의 적대적 독백을 인용 부호 안에서 어떻게 옮길지
  chosen_reading: 원수들의 발화를 그대로 인용해, 그들의 악의와 조롱이 드러나도록 했습니다.
  alternative_readings:
  - 설명문으로 풀어 ‘원수들이 나의 죽음과 망각을 바란다’고 옮김
  rationale: 시편의 시적 긴장과 적대적 직접 발화를 보존하는 것이 화자의 억울함과 위협감을 더 잘 드러냅니다.
  doctrine_reference: 시편의 시적 화법과 원문 수사 보존
