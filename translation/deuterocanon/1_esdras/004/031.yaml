  from: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she is offended with him[b], he flatters her so that she may be reconciled to him.
  to: Besides all this, the king stared at her open-mouthed. If she smiles at him[a], he smiles; but if she is angry with him, he flatters her so that she may be reconciled to him.
  rationale: The lexical record explicitly allows 'smiles at him' and recognizes that the dative need not imply mockery. I choose that relational sense, preserve the vivid open-mouthed gaze, and replace the awkward 'offended with him' with 'angry with him.'
