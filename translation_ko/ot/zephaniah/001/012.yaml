  verdict: revise
  source_fidelity: 전반적인 심판 선언과 예루살렘을 철저히 살피는 이미지는 충실합니다. 그러나 קֹפְאִים עַל־שִׁמְרֵיהֶם는 포도주가 찌꺼기 위에서 굳거나 농축되는 비유이므로 ‘눌어붙어 있는’보다 ‘포도주 찌꺼기 위에 굳어 있는’이 원문의 물질적 비유를 더 정확히 보존합니다. 또한 יֵיטִיב/יָרֵעַ은 문맥상 야훼께서 좋거나 나쁜 일을 행하지 않는다는 냉소적 주장으로, ‘선/악을 행하다’의 도덕화보다 넓은 표현이 적절합니다.
  naturalness: ‘등불로 샅샅이 뒤지고’는 자연스럽지만, 수색의 대상과 도구를 분명히 하는 ‘등불로 샅샅이 수색하고’가 현대 공적 문체에 더 알맞습니다. 관계절을 ‘마음속으로 …라고 말하며’로 구성하면 미래 심판 선언과 히브리어 분사의 묘사가 매끄럽게 연결됩니다.
  terminology: יהוה는 초안의 프로젝트상 표기인 ‘야훼’로 유지했습니다. שְׁמָרִים의 포도주 침전물 비유를 본문에서 명시하고, ‘등불들’의 복수 및 비유적 수색 기능은 해당 단어 바로 뒤의 각주로 처리했습니다.
