theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - the LORD
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Understanding the difficult opening clause לְךָ אָמַר לִבִּי
  chosen_reading: 'The heart speaks with reference to the LORD: ''On your behalf my heart says, “Seek my face.”'''
  alternative_readings:
  - To you my heart says, 'Seek my face'
  - My heart says of you, 'Seek his face'
  - On your behalf my heart says, 'Seek my face'
  rationale: The Hebrew is elliptical and famously difficult. The chosen reading preserves the Masoretic text without emendation and keeps the direct quotation 'Seek my face' as God's summons echoed in the psalmist's heart. Alternatives are preserved because the syntax admits more than one construal.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
