  text: 'Let grace come,

    and let this world pass away.

    Hosanna to the son of David.

    If anyone is holy, let him come;

    if anyone is not, let him repent.

    Maranatha. Amen.'
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T20:32:23Z'
    unchanged: true
    changes_summary: No changes needed.
translation:
  language: en
  text: 'May grace come,

    and may this world pass away.


    Hosanna to the Son of David.[a]


    Those who are holy, come.

    Those who are not, reorient[c].


    Our Lord, come![b] Amen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hosanna is an ancient plea for salvation that also became an acclamation of praise.
    reason: cultural_note
  - marker: b
    text: The source has the Aramaic word Maranatha, commonly understood here as “Our Lord, come!”
    reason: source_note
  - marker: c
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
