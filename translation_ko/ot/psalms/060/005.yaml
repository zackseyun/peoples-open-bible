  yaml_path: translation/ot/psalms/060/005.yaml
  text: So that your beloved ones may be delivered[b], save with your right hand and answer us.[a]
  footnotes:
  - marker: a
    text: Some construals read the final plea as 'and answer me' rather than 'and answer us.'
    reason: textual_variant
  - marker: b
