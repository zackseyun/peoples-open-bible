  meaning: The Kohathites were entrusted with the sanctuary’s principal sacred furnishings, its ministry vessels, the inner veil, and all associated service.
  meaning_decisions:
  - source_phrase: וּמִשְׁמַרְתָּם
    prior_rendering: And their duty was
    new_rendering: They were responsible for
    rationale: The noun introduces entrusted objects and their care, not merely a list of activities.
  - source_phrase: אֲשֶׁר יְשָׁרְתוּ בָהֶם
    prior_rendering: with which they minister
    new_rendering: used in ministry
    rationale: The clause identifies the vessels by their sacred use without misleadingly assigning the priestly use of every vessel to the Kohathites who cared for and transported them.
  - source_phrase: הַמָּסָךְ
    prior_rendering: the screen
    new_rendering: the inner veil
    rationale: The Gershonites already have the entrance screen, while Numbers 4:5 associates the veil screening the ark with the sacred furnishings carried by the Kohathites; this context outweighs the earlier note excluding the inner veil.
  - source_phrase: וְכֹל עֲבֹדָתוֹ
    prior_rendering: and all its service
    new_rendering: and all the service connected with these items
    rationale: This expresses the comprehensive service associated with the entrusted equipment without an unclear singular pronoun.
