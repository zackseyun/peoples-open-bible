id: JOB.20.3
reference: Job 20:3
source:
  edition: WLC
  text: מוּסַ֣ר כְּלִמָּתִ֣/י אֶשְׁמָ֑ע וְ֝/ר֗וּחַ מִֽ/בִּינָתִ֥/י יַעֲנֵֽ/נִי׃
translation:
  text: I hear a rebuke that shames me, and my spirit, drawing on my understanding, prompts me to answer[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “a spirit arising from my understanding answers me.”
    reason: alternative_reading
lexical_decisions:
- source_word: מוּסַר
  chosen: rebuke
  alternatives:
  - correction
  - discipline
  - instruction
  lexicon: HALOT
  rationale: מוּסַר can denote discipline, correction, or admonitory instruction. In this context Zophar is reacting to Job's words as a verbal affront, so 'rebuke' best captures an experienced verbal reproof rather than broader formative discipline.
- source_word: כְּלִמָּתִי
  chosen: that shames me
  alternatives:
  - of my humiliation
  - my disgrace
  - my insult
  lexicon: HALOT
  rationale: 'The construct phrase with first-person suffix expresses disgrace or humiliation connected to the rebuke. Rendering it as a relative clause in English (''that shames me'') preserves the sense naturally: the rebuke is one that brings shame upon the speaker.'
- source_word: אֶשְׁמָע
  chosen: I hear
  alternatives:
  - I am hearing
  - I listen to
  lexicon: HALOT
  rationale: Simple present best reflects the Hebrew imperfect in context, expressing Zophar's present reception of Job's reproach.
- source_word: רוּחַ
  chosen: the spirit
  alternatives:
  - a spirit
  - wind
  - breath
  - mind
  lexicon: HALOT
  rationale: רוּחַ here is metaphorical for the inner animating impulse or disposition rather than literal wind/breath. 'The spirit' preserves the Hebrew image and avoids over-interpreting it as merely 'mind,' while the following phrase specifies that it is the spirit associated with his understanding.
- source_word: מִבִּינָתִי
  lemma: מִן
  chosen: of my understanding
  alternatives:
  - from my understanding
  - because of my understanding
  - out of my understanding
  lexicon: HALOT
  rationale: The preposition מִן may be taken as source ('from/out of') or as closely linking spirit with the speaker's discernment. In idiomatic English, 'the spirit of my understanding' best conveys an inner impulse arising from his understanding without awkwardness. The source nuance is preserved conceptually.
- source_word: יַעֲנֵנִי
  chosen: answers me
  alternatives:
  - responds to me
  - makes me answer
  lexicon: HALOT
  rationale: ענה in the Qal commonly means 'answer, respond.' With the object suffix, the sense is that his inner spirit responds within him or prompts his reply. 'Answers me' is the most direct rendering, while the footnote preserves the possible nuance of prompting him to answer.
