translation:
  language: en
  text: 'Stay away from poisonous weeds. Jesus Christ did not cultivate them, because the Father did not plant them. I have not found division among you, but filtering.[a]


    All who belong to God and Jesus Christ stand with the bishop. Those who repent[b] and come into the unity of the Church will also belong to God, so that they may live according to Jesus Christ. My brothers and sisters, do not be deceived.


    Anyone who follows a person who causes a split will not inherit the kingdom of God. Anyone who follows a strange teaching has no fellowship with Christ’s suffering.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filtering” preserves the witness’s image; its precise Greek nuance awaits direct source-language review.
    reason: source_note
  - marker: b
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in these appeals to reconciliation and ecclesial unity; keep distinct return expressions and the authors own claims about the bishop.
    reason: lexical_alternative
