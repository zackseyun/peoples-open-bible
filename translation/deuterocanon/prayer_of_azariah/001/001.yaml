  text: Οὕτως οὖν προσηύξατο Ἀνανίας καὶ Ἀζαρίας καὶ Μισαήλ, καὶ ὕμνησαν τῷ κυρίῳ, ὅτε αὐτοὺς ὁ βασιλεὺς προσέταξεν ἐμβληθῆναι εἰς τὴν κάμινον.
  language: Greek
