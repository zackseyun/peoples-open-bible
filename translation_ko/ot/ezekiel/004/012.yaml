source:
  edition: WLC
  text: וְ/עֻגַ֥ת שְׂעֹרִ֖ים תֹּֽאכֲלֶ֑/נָּה וְ/הִ֗יא בְּ/גֶֽלְלֵי֙ צֵאַ֣ת הָֽ/אָדָ֔ם תְּעֻגֶ֖/נָה לְ/עֵינֵי/הֶֽם׃ס
base_translation:
