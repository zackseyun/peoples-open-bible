  source_fidelity: 히브리어는 제물 드리는 사람이 ‘자기 손으로’ 여호와의 אִשֵּׁי(불로 드리는 제물)를 가져오며, ‘가슴 위에’ 놓인 기름과 가슴을 가져와 그 가슴을 여호와 앞에서 요제로 흔들도록 합니다. 초안의 ‘그의 손이’는 히브리어의 강조를 보존하려 하나 한국어에서는 부자연스럽고, ‘기름과 가슴’은 עַל(위에)의 관계를 빠뜨립니다.
  naturalness: ‘그가 자기 손으로’가 자연스러우면서도 직접 행해야 한다는 강조를 살립니다. ‘가슴 위에 기름을 얹어’는 제의 동작을 과도하게 해석하지 않고 히브리어의 공간 관계를 명료하게 반영합니다. ‘요제로 흔들어 바치다’는 현대 한국어 문장 안에서 통용되는 제의 용어를 유지합니다.
  terminology: ‘여호와’, ‘화제’, ‘요제’는 본문 내에서 일관된 전통적 제의 용어입니다. אִשֵּׁי의 의미를 현대 독자에게 드러내기 위해 ‘불살라 드리는 제물’로 풀어 옮겼습니다. חֵלֶב은 이 문맥에서 제물의 ‘기름(지방)’을 가리키며, 본문에는 ‘기름’으로 충분합니다.
