id: 1KI.13.9
reference: 1 Kings 13:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי כֵ֣ן צִוָּ֣ה אֹתִ֗/י בִּ/דְבַ֤ר יְהוָה֙ לֵ/אמֹ֔ר לֹא תֹ֥אכַל לֶ֖חֶם וְ/לֹ֣א תִשְׁתֶּה מָּ֑יִם וְ/לֹ֣א תָשׁ֔וּב בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתָּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/009.yaml
  text: For this is what he commanded me by the word of the LORD, saying, ‘You shall not eat bread, nor drink water, nor return by the way that you went.’
translation:
  language: ko
  text: 이는 그가 여호와의 말씀으로 내게 명령한 바입니다. 이르시기를 “너는 떡을 먹지 말고, 물을 마시지 말며, 네가 갔던 길로 다시 돌아오지 마라.” 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּדְבַר יְהוָה
  english_pob_choice: by the word of the LORD
  chosen_korean: 여호와의 말씀으로
  alternatives_korean:
  - 여호와의 말씀에 의해
  - 여호와의 말씀을 따라
  lexicon: יהוה
  rationale: source의 『여호와의 말씀』이라는 관용을 살리되, 한국어에서는 자연스럽게 원인·근거를 나타내는 조사로 풀어『말씀으로』를 사용했습니다.
- source_word: לֹא תֹאכַל לֶחֶם וְלֹא תִשְׁתֶּה מָּיִם
  english_pob_choice: You shall not eat bread, nor drink water
  chosen_korean: 너는 떡을 먹지 말고, 물을 마시지 말며
  alternatives_korean:
  - 너는 빵을 먹지 말고, 물을 마시지 말며
  - 너는 음식도 먹지 말고, 물도 마시지 말며
  lexicon: לֶחֶם
  rationale: לֶחֶם을 직설적으로『떡』으로 옮겨 먹을 것 전반을 가리키는 성서적 표현을 유지했습니다; 『빵』은 현대적이지만 본문의 전통적 어감을 약화시킬 수 있습니다.
- source_word: וְלֹא תָשׁוּב בַּדֶּרֶךְ אֲשֶׁר הָלָכְתָּ
  english_pob_choice: nor return by the way that you went
  chosen_korean: 네가 갔던 길로 다시 돌아오지 마라
  alternatives_korean:
  - 네가 간 길로 돌아오지 마라
  - 네가 갔던 그 길로 돌아오지 마라
  lexicon: שׁוּב / דֶּרֶךְ
  rationale: 동사『돌아오다』로 재귀적 회귀를 분명히 하고, 영어 POB의『the way that you went』을 반영해 『갔던 길』로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 본절의 divine name은『여호와』가 아니라 프로젝트 기본값에 따라『여호와의 말씀』을 유지하지 않고, 원문 대응 표기는 다른 절의 일관성 규칙을 따르도록 설명하지 않았습니다.
  alternative_readings:
  - 야훼의 말씀
  - 여호와의 말씀
  rationale: 이 절의 source는 יְהוָה를 직접 포함하므로 원문 근거를 드러내는 표기가 필요합니다. 다만 제공된 영어 audit가 LORD로 정리되어 있어, 본문에서는 한국어 교회 문체에 익숙한 형태를 사용하되 원문과의 대응성을 lexical_decisions에 명시했습니다.
  doctrine_reference: 성경 본문 번역의 신명기적/언약적 고유명 표기 원칙
- issue: 명령문 종결 형식
  chosen_reading: 직접 명령은 한국어 자연문에 맞게『마라』형으로 옮겼습니다.
  alternative_readings:
  - 먹지 말라
  - 마시지 말라
  rationale: 히브리어 금지 명령의 연속을 한국어 합쇼체 안에서 그대로 보존하려면 종결은 서술체보다 금지형이 적절합니다.
  doctrine_reference: 명령/금지 법문의 직역 원칙
