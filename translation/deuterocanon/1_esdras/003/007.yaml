translation:
  text: He will rank second only to Darius[a] because of his wisdom and will be given the title ‘Kinsman of Darius[b]’.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “will be seated second to Darius.”
    reason: lexical_alternative
  - marker: b
    text: Kinsman was an honorary court designation expressing a close relationship with the king.
    reason: cultural_note
lexical_decisions:
- source_word: δεύτερος
  chosen: second
  alternatives:
  - next
  - in second place
  lexicon: LSJ
  rationale: The adjective denotes rank/order. In this court setting it most naturally indicates second place in status relative to Darius.
- source_word: καθιεῖται
  lemma: καθίζω
  chosen: will be seated
  alternatives:
  - will sit
  - will be appointed
  - will be established
  lexicon: LSJ
  rationale: Future passive/middle sense from καθίζω/καθίημι in context suggests being given a seat or position. 'Will be seated' preserves the concrete courtly image while implying appointment to rank.
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  chosen: because of his wisdom
  alternatives:
  - on account of his wisdom
  - for his wisdom
  lexicon: LSJ
  rationale: διά with the accusative here expresses reason or cause. 'Because of his wisdom' is clear modern English and preserves the causal force.
- source_word: συγγενής
  chosen: kinsman
  alternatives:
  - relative
  - kinsman/close associate
  lexicon: LSJ
  rationale: The word ordinarily means one of the same family or kin. In a royal court it may carry honorary overtones, but 'kinsman' best preserves the familial language of the Greek without overinterpreting it as merely political favor.
- source_word: κληθήσεται
  chosen: will be called
  alternatives:
  - will be named
  - will be proclaimed
  lexicon: LSJ
  rationale: Standard future passive of καλέω. 'Will be called' is the most direct and idiomatic rendering.
