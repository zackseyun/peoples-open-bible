  from: Who is wise? Let him heed these things and consider Yahweh’s acts of steadfast love.[a][b]
  to: Who is wise? Let him heed these things and consider Yahweh’s acts of steadfast love.
  rationale: The latest revision’s “heed” and “acts of steadfast love” convey attentive reflection and the multiple manifestations of Yahweh’s love more clearly than the earlier wording. I retain its natural coordination; the source’s number shift and plural noun need no notes because their contextual meaning is already conveyed.
