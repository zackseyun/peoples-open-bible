base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: ko
  text: 아말렉 사람들과 가나안 사람들이 너희 앞에 있습니다. 너희는 칼에 쓰러질 것입니다. 이는 너희가 야훼를 따르는 데서 돌아섰기 때문입니다. 야훼께서는 너희와 함께하지 않으실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲמָלֵקִ֨י
  english_pob_choice: Amalekites
  chosen_korean: 암살렉 사람들
  alternatives_korean: 암살렉인, 암살렉 족속
  lexicon: WLC
  rationale: 집합 명사로 사용되므로 '사람들'을 추가하여 명확성을 높임.
- source_word: לִ/פְנֵי/כֶ֔ם
  english_pob_choice: before you
  chosen_korean: 너희 앞에
  alternatives_korean: 너희 앞
  lexicon: WLC
  rationale: 공간적 위치를 나타내는 전치사 구로, 현대적 문맥에 맞게 '앞에'로 번역.
- source_word: נְפַלְתֶּ֖ם
  english_pob_choice: you will fall
  chosen_korean: 너희는 죽을 것이니
  alternatives_korean: 너희가 쓰러지리니
  lexicon: WLC
  rationale: 전쟁 맥락에서의 'fall'은 '죽다'의 의미로 해석하여 명확한 결과를 전달.
- source_word: שַׁבְתֶּם֙
  english_pob_choice: you have turned back
  chosen_korean: 따르기를 거절하였음이라
  alternatives_korean: 돌이켰음이라, 물러났음이라
  lexicon: WLC
  rationale: 여호와를 따르는 행위를 포기한 상태를 '거절'로 명시하여 신학적 의미를 강화.
theological_decisions:
- decision: 여호와께서 너희와 함께하지 아니하시리라
  rationale: 성경적 신학에 따라 '여호와'를 하나님 이름으로 고정하여 번역하며, 동행의 부재를 경고의 핵심으로 강조.
