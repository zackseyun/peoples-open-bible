translation:
  language: en
  text: I am afraid that when I return, my God may humble me in your presence[a] and that I will mourn over many who sinned before and still have not repented[b] of the impurity, sexual immorality, and shameless, unrestrained behavior they practiced.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “may humiliate me while I am among you.”
    reason: lexical_alternative
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: when I come again
  simplified_phrase: when I return
  preserved_meaning: Paul fears what may happen during his future return visit.
  reasoning_layer_used: Lexical decision for μὴ πάλιν ἐλθόντος μου.
  rationale: “When I return” expresses the same timing in natural English.
- pob_phrase: before you
  simplified_phrase: in your presence
  preserved_meaning: Paul's humbling would occur while he was with the Corinthians.
  reasoning_layer_used: Lexical decision for πρὸς ὑμᾶς.
  rationale: “In your presence” clarifies the setting without implying a public spectacle.
- pob_phrase: sensuality
  simplified_phrase: shameless, unrestrained behavior
  preserved_meaning: The term describes willfully unrestrained and often sexual misconduct.
  reasoning_layer_used: Lexical decision for ἀσελγείᾳ.
  rationale: The descriptive phrase explains an opaque vice term while keeping it distinct from sexual immorality.
interpretive_expansions:
- pob_phrase: sensuality
  rendering: shameless, unrestrained behavior
  claim: The vice involves openly and willfully unrestrained conduct, often sexual.
  evidence:
  - The POB lexical rationale defines ἀσέλγεια as shameless, unrestrained conduct, often sexual.
  confidence: high
  alternatives_preserved:
  - debauchery
  - licentiousness
translation_notes:
  risk_flags:
  - risk: “Shameless, unrestrained behavior” can be read more broadly than explicitly sexual conduct.
    mitigation: The wording follows the POB lexical range and remains distinct within the three-part vice list.
