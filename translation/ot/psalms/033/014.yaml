id: PSA.33.14
reference: Psalms 33:14
source:
  edition: WLC
  text: מִֽ/מְּכוֹן שִׁבְתּ֥/וֹ הִשְׁגִּ֑יחַ אֶ֖ל כָּל יֹשְׁבֵ֣י הָ/אָֽרֶץ־־׃
translation:
  text: From his dwelling place he watches all the inhabitants of the earth.
  philosophy: dynamic
lexical_decisions:
- source_word: מִמְּכוֹן
  chosen: From the place
  alternatives:
  - From the fixed place
  - From the foundation
  lexicon: HALOT
  rationale: מָכוֹן denotes an established place or fixed location. In context with 'his dwelling,' 'place' gives natural English while preserving the sense of a settled abode.
- source_word: שִׁבְתּוֹ
  chosen: of his dwelling
  alternatives:
  - where he dwells
  - of his seat
  lexicon: HALOT
  rationale: From ישׁב, here a noun-like form with suffix meaning 'his dwelling' or 'his sitting place.' 'Of his dwelling' fits the construct relationship with מִמְּכוֹן and keeps the locative sense.
- source_word: הִשְׁגִּיחַ
  chosen: he looks out on
  alternatives:
  - he gazes upon
  - he watches
  - he looks attentively toward
  lexicon: HALOT
  rationale: The Hiphil of שׁגח conveys looking attentively, gazing, or watching from above. 'Looks out on' captures both the directional sense from a dwelling place and the observational nuance in readable English.
- source_word: אֶל
  chosen: 'on'
  alternatives:
  - toward
  - at
  lexicon: HALOT
  rationale: Although אֶל commonly means 'to' or 'toward,' with verbs of looking English idiom often prefers 'on' or 'at.' 'On' works smoothly with 'looks out' and preserves the object-directed sense.
- source_word: כָּל
  chosen: all
  alternatives:
  - every
  lexicon: HALOT
  rationale: כָּל here has a comprehensive force over the following plural noun phrase. 'All' is the most direct rendering.
- source_word: יֹשְׁבֵי
  chosen: the inhabitants
  alternatives:
  - those who dwell
  - the dwellers
  lexicon: HALOT
  rationale: 'The participle of ישׁב functions substantivally: ''those dwelling.'' ''The inhabitants'' is idiomatic English and preserves the collective sense.'
- source_word: הָאָרֶץ
  chosen: the earth
  alternatives:
  - the land
  lexicon: HALOT
  rationale: In this universal context with 'all the inhabitants,' הָאָרֶץ is best taken as 'the earth' rather than a particular land.
- source_word: מִמְּכוֹן שִׁבְתּוֹ
  chosen: From his dwelling place
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This naturally renders the established place of Yahweh’s dwelling without losing either component of the Hebrew phrase.
