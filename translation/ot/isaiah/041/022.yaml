    prior_rendering: Let them bring them forward and tell us
    new_rendering: Let them come forward and tell us
    rationale: The courtroom summons calls for the claimants to appear and make their declarations; removing the unexplained second 'them' avoids an opaque object without naming an object the Hebrew leaves unstated.
  - source_phrase: הָרִאשֹׁנוֹת מָה הֵנָּה הַגִּידוּ
    prior_rendering: Tell us the former things—what they are
