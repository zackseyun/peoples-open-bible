  meaning: The eastern tribes leave the other Israelites at Shiloh to return to Gilead, the land they received at Yahweh's command through Moses.
  meaning_decisions:
  - source_phrase: בְּנֵי רְאוּבֵן וּבְנֵי גָד
    prior_rendering: the sons of Reuben and the sons of Gad
    new_rendering: the Reubenites, the Gadites
    rationale: These are tribal collectives, not the immediate sons of the ancestors Reuben and Gad.
  - source_phrase: מֵאֵת בְּנֵי יִשְׂרָאֵל
    prior_rendering: from the sons of Israel
    new_rendering: left their fellow Israelites
    rationale: The eastern tribes separate from the larger Israelite body but remain Israelites themselves; 'fellow' makes that understood relationship clear.
  - source_phrase: וַיָּשֻׁבוּ וַיֵּלְכוּ ... מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן לָלֶכֶת אֶל אֶרֶץ הַגִּלְעָד
    prior_rendering: returned and departed ... from Shiloh, which is in the land of Canaan, to go to the land of Gilead
    new_rendering: left ... at Shiloh in the land of Canaan and set out to return to Gilead
    rationale: The Hebrew sequence describes departure on a homeward journey; the reordered English avoids implying that their return was completed before they departed.
  - source_phrase: אֶל אֶרֶץ אֲחֻזָּתָם אֲשֶׁר נֹאחֲזוּ בָהּ
    prior_rendering: to the land of their possession, which they had taken possession of
    new_rendering: the land they had received as their possession
    rationale: The construction describes their established landholding, authorized through Moses; the received-possession sense is supported by the Niphal verb, with taking possession retained as an alternative.
