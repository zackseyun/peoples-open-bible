id: JOB.6.7
reference: Job 6:7
source:
  edition: WLC
  text: מֵאֲנָ֣ה לִ/נְגּ֣וֹעַ נַפְשִׁ֑/י הֵ֝֗מָּה כִּ/דְוֵ֥י לַחְמִֽ/י׃
translation:
  text: I refuse to touch such things; they are like sickening food to me[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew is compressed and difficult. “I” may also be understood as “my appetite,” and the final phrase is more literally “they are like the sickness of my food.”
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֲנָה
  chosen: refuses
  alternatives:
  - has refused
  - is unwilling
  lexicon: HALOT
  rationale: From מאן, 'to refuse/be unwilling.' English present 'refuses' fits the poetic, gnomic complaint in context better than a simple past, while preserving the volitional sense.
- source_word: לִנְגּוֹעַ
  chosen: to touch
  alternatives:
  - to lay hold of
  - to come into contact with
  lexicon: HALOT
  rationale: נגע commonly means 'touch.' Here it expresses aversion to contact with what has just been described, so 'to touch' is the most direct and natural rendering.
- source_word: נַפְשִׁי
  chosen: I
  alternatives:
  - I
  - my appetite
  - my throat
  lexicon: HALOT
  rationale: The noun can denote the person or self here; “my appetite” remains a plausible contextual alternative but should not be presented as uniquely literal.
- source_word: הֵמָּה
  chosen: they
  alternatives:
  - these things
  lexicon: HALOT
  rationale: The pronoun refers back to the repulsive things in the previous verse. 'They' is the natural English equivalent and preserves the anaphoric reference.
- source_word: כִּדְוֵי
  chosen: like the sickness of
  alternatives:
  - like sickness
  - like a diseased thing
  - like loathsome disease
  lexicon: HALOT
  rationale: From דוה, denoting sickness/illness. The construct relationship with 'my food' is difficult and metaphorical. 'Like the sickness of' preserves the Hebrew image without over-resolving whether the sense is 'sickening food,' 'diseased food,' or 'the sickness caused by food.'
- source_word: לַחְמִי
  chosen: my food
  alternatives:
  - my bread
  lexicon: HALOT
  rationale: לחם literally means 'bread,' but often broadly 'food.' In English, 'my food' better conveys the general sense in this metaphorical context and avoids an overly narrow literalism.
- source_word: הֵמָּה כִּדְוֵי לַחְמִי
  chosen: they are like sickening food to me
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This gives intelligible English for the difficult comparison while the note preserves the compressed wording and its uncertainty.
