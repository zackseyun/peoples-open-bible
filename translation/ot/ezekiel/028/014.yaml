id: EZK.28.14
reference: Ezekiel 28:14
source:
  edition: WLC
  text: אַ֨תְּ כְּר֔וּב מִמְשַׁ֖ח הַ/סּוֹכֵ֑ךְ וּ/נְתַתִּ֗י/ךָ בְּ/הַ֨ר קֹ֤דֶשׁ אֱלֹהִים֙ הָיִ֔יתָ בְּ/ת֥וֹךְ אַבְנֵי אֵ֖שׁ הִתְהַלָּֽכְתָּ־־׃
translation:
  text: You[a] were an anointed[b] guardian cherub[c][d], and I placed you on the holy mountain of God; you walked in the midst of stones of fire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Hebrew has a short form of 'you,' also used with male addressees elsewhere (Numbers11:15; Deuteronomy5:27). Its form alone does not establish an error.
    reason: alternative_reading
  - marker: b
    text: Or 'outspread' or 'extended.' The rare Hebrew word is disputed; the consulted Latin text has 'extended.' 'Anointed' is retained provisionally.
    reason: lexical_alternative
  - marker: c
    text: Or 'covering cherub' or 'cherub that covers'; 'guardian' expresses the protective imagery.
    reason: lexical_alternative
  - marker: d
    text: The selected Greek text instead has 'with the cherub I placed you.' It distinguishes the addressee from the cherub, as does its cherub-led removal in verse16. The Hebrew is retained provisionally; original priority is uncertain.
    reason: textual_variant
lexical_decisions:
- source_word: כְּר֔וּב
  chosen: cherub
  alternatives:
  - cherubim-being
  - cherub
  lexicon: HALOT
  rationale: The singular noun denotes the heavenly throne-guardian creature. 'Cherub' is the established English singular and preserves the specific imagery better than a generic paraphrase like 'angelic being'.
- source_word: מִמְשַׁ֖ח
  chosen: anointed
  alternatives:
  - outspread
  - extended
  - of anointing
  lexicon: BDB4473; bounded published Hebrew/Latin comparison
  rationale: The rare noun is disputed. Anointed remains a provisional working rendering, not an established passive-participle analysis. BDB discusses expansion/spreading as well as anointing, and the consulted Vulgate has extentus, extended. Neither the lexical choice nor modifier absence in the selected Greek settles earliest wording.
- source_word: הַ/סּוֹכֵ֑ךְ
  chosen: guardian
  alternatives:
  - covering
  - sheltering
  - that covers
  lexicon: HALOT
  rationale: From סכך, 'to cover/shelter.' In cherub imagery, the sense is protective/overshadowing, likely alluding to cherubim overshadowing sacred space. 'Guardian' communicates function in clear modern English; the more literal 'covering' is preserved in a footnote because it is a traditional rendering.
- source_word: וּ/נְתַתִּ֗י/ךָ
  chosen: and I placed you
  alternatives:
  - and I set you
  - and I appointed you
  lexicon: HALOT
  rationale: נתן commonly means 'give, set, place.' In this locative context with 'on the holy mountain of God,' 'placed' is the most natural English rendering.
- source_word: בְּ/הַ֨ר קֹ֤דֶשׁ אֱלֹהִים֙
  chosen: on the holy mountain of God
  alternatives:
  - upon God's holy mountain
  - in the mountain of God's holiness
  lexicon: HALOT
  rationale: A straightforward construct chain. 'Holy mountain of God' preserves the elevated, sacred locale without overinterpreting the image.
- source_word: הָיִ֔יתָ
  chosen: you were
  alternatives:
  - you came to be
  lexicon: HALOT
  rationale: Simple past of היה. 'You were' fits the descriptive sequence of the verse.
- source_word: בְּ/ת֥וֹךְ
  chosen: in the midst of
  alternatives:
  - among
  - within
  lexicon: HALOT
  rationale: '''In the midst of'' preserves the vivid spatial imagery more fully than the simpler ''among,'' though both are possible.'
- source_word: אַבְנֵי אֵ֖שׁ
  chosen: stones of fire
  alternatives:
  - fiery stones
  - stones blazing with fire
  lexicon: HALOT
  rationale: A literal rendering best preserves the striking and somewhat enigmatic Hebrew image. A smoother paraphrase like 'fiery stones' is possible but slightly reduces the text's poetic force.
- source_word: הִתְהַלָּֽכְתָּ
  chosen: you walked
  alternatives:
  - you moved about
  - you walked back and forth
  lexicon: HALOT
  rationale: The hitpael of הלך can suggest walking about, but 'you walked' is sufficient and idiomatic, leaving the poetic scene intact without over-specifying repeated motion.
- source_word: אַ֨תְּ
  chosen: You
  alternatives:
  - you
  lexicon: WLC/OSHB; BDB859; inspected masculine-address controls
  rationale: Short pointed אַתְּ is possible with masculine addressees, as actually read in WLC Numbers11:15 and Deuteronomy5:27. The feminine OSHB tag here does not by itself establish corruption. Retain you with the declared pointing; reading את as with is an explicit alternative source interpretation reflected in the selected Greek, not a new English gloss of unchanged pointed WLC.
