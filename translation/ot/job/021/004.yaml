lexical_decisions:
- source_word: לְאָדָם
  chosen: addressed to a man
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The lamed identifies the person to whom Job’s complaint is directed, rather than an adversary against whom it is lodged.
- source_word: וְאִם
  chosen: If it were
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The conditional is elliptical and refers back to the possibility that the complaint is addressed to a man; it cannot naturally be rendered “If not.”
- source_word: קְצַר רוּחַ
  chosen: my spirit ... be impatient
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The idiom denotes impatience; retaining “my spirit” preserves the Hebrew expression’s subject.
