  source_fidelity: 현 초안은 WLC 시편 92:1의 본문(‘야훼께 감사드리고 … 지극히 높으신 이여’)이 아니라 시편 표제(통상 92편 표제)를 번역하고 있습니다. 따라서 절 본문에 대한 번역으로는 원문 충실성이 없습니다. 수정안은 טוֹב의 비인칭 평가 표현, לְהוֹדוֹת의 ‘감사드리다’, זמר의 노래로 드리는 찬양, ‘주의 이름’, 그리고 עֶלְיוֹן의 호격을 모두 반영합니다.
  naturalness: 수정안은 현대 표준 한국어의 격식 있는 문장으로 자연스럽습니다. ‘지극히 높으신 이여’는 시적·예배적 호격으로 원문의 직접 호칭과 문체를 보존합니다.
  terminology: יהוה는 제공된 최신 신학 결정에 따라 ‘야훼’로 옮겼습니다. ‘감사드리다’, ‘주의 이름’, ‘찬양하며 노래하다’는 예배 문맥과 원문의 의미 구분에 적절합니다.
