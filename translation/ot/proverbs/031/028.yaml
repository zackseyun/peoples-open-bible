id: PRO.31.28
reference: Proverbs 31:28
source:
  edition: WLC
  text: קָ֣מוּ בָ֭נֶי/הָ וַֽ/יְאַשְּׁר֑וּ/הָ בַּ֝עְלָ֗/הּ וַֽ/יְהַֽלְלָ/הּ׃
translation:
  text: 'Her children rise and call her blessed; her husband also praises her:'
  philosophy: dynamic
lexical_decisions:
- source_word: קָמוּ
  chosen: rise
  alternatives:
  - stand up
  - arise
  lexicon: HALOT
  rationale: “Rise” directly renders the verb in natural English.
- source_word: בָנֶיהָ
  chosen: her children
  alternatives:
  - her sons
  lexicon: HALOT
  rationale: בנים can mean 'sons' specifically or 'children' more broadly. In wisdom literature and family commendation context, 'children' best captures the likely collective sense without unnecessary male restriction.
- source_word: וַיְאַשְּׁרוּהָ
  chosen: call her blessed
  alternatives:
  - pronounce her blessed
  - bless her
  - call her happy
  lexicon: HALOT
  rationale: From אשר in the Piel, meaning to declare someone blessed/happy/fortunate. 'Call her blessed' is idiomatic English and preserves the evaluative public commendation implied by the verb.
- source_word: בַּעְלָהּ
  chosen: her husband
  alternatives:
  - her master
  lexicon: HALOT
  rationale: Though בעל can denote owner/master in some contexts, in this domestic setting with a pronominal suffix it clearly means 'her husband.'
- source_word: וַיְהַלְלָהּ
  chosen: also praises her
  alternatives:
  - he commends her
  - he extols her
  lexicon: HALOT
  rationale: English expresses the husband’s additive participation naturally with “also” modifying his verb.
- source_word: ו
  chosen: also, and
  alternatives:
  - and
  lexicon: HALOT
  rationale: The conjunction before 'her husband' is rendered with slight expansion as 'also, and' to reflect the additive force and the shift from the children to the husband in smooth English.
