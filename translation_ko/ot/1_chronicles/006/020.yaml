lexical_decisions:
- source_word: בֶּן
  english_pob_choice: the son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - ~의 아들로 이어지는
  - ~의 아들이
  lexicon: HALOT
  rationale: 족보 문맥에서 בֶּן은 직계 계승을 표시하므로, 한국어에서도 반복되는 계보 구조를 살리는 '~의 아들'로 옮겼습니다.
- source_word: ציף
  english_pob_choice: Ziph
  chosen_korean: 시브
  alternatives_korean:
  - 집
  - 지프
  lexicon: 고유명사 표기
  rationale: 고유명사는 원어 이름을 현대 한국어 음역으로 옮겼고, 영어 POB의 Ziph에 해당하는 이름을 시브로 표기했습니다.
- source_word: אֶלְקָנָה
  english_pob_choice: Elkanah
  chosen_korean: 엘가나
  alternatives_korean:
  - 엘가나
  - 엘카나
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사를 한국어 성경에서 널리 쓰이는 표기에 맞춰 엘가나로 옮겼습니다.
- source_word: מַחַת
  english_pob_choice: Mahath
  chosen_korean: 마핫
  alternatives_korean:
  - 마핫
  - 마하트
  lexicon: 고유명사 표기
  rationale: 고유명사는 번역하지 않고 음역했으며, 영어 POB의 Mahath에 해당하는 이름을 마핫으로 옮겼습니다.
- source_word: עֲמָשָׂי
  english_pob_choice: Amasai
  chosen_korean: 아마새
  alternatives_korean:
  - 아마새
  - 아마사이
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사를 한국어 음역으로 옮겼고, 영어 POB의 Amasai에 해당하는 이름을 아마새로 표기했습니다.
