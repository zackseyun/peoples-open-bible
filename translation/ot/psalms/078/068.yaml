  to: But he chose the tribe of Judah, Mount Zion which he loved.
  rationale: Removed 'and' to reflect the appositional structure of the Hebrew, where 'Mount Zion' further specifies the choice rather than adding a separate object.
- timestamp: '2026-08-28T22:07:47Z'
