lexical_decisions:
- source_word: πατρῴας
  chosen: of their fathers
  alternatives:
  - ancestral
  - of their ancestors
  lexicon: LSJ
  rationale: The adjective means 'of one's fathers/ancestral.' 'Of their fathers' keeps the familial force explicit and reads naturally in English, while still conveying inherited tradition.
- source_word: τιμὰς
  chosen: honors
  alternatives:
  - privileges
  - distinctions
  lexicon: LSJ
  rationale: τιμή here refers to valued honors or prerogatives attached to ancestral customs/status. 'Honors' best fits the contrast with Greek δόξαι and avoids over-specifying legal privileges.
- source_word: ἐν οὐδενὶ τεθειμένοι
  chosen: placing no value at all on
  alternatives:
  - regarding as nothing
  - counting as of no account
  lexicon: LSJ
  rationale: The idiom means to treat something as nothing or of no importance. 'Placing no value at all on' expresses the contemptuous valuation in idiomatic modern English.
- source_word: Ἑλληνικὰς
  chosen: Greek
  alternatives:
  - Hellenic
  lexicon: LSJ
  rationale: '''Greek'' is the natural modern equivalent of Ἑλληνικός in this context of cultural practices and prestige.'
- source_word: δόξας
  chosen: distinctions
  alternatives:
  - glories
  - honors
  - reputations
  lexicon: LSJ
  rationale: Although δόξα often means 'glory,' here the plural in contrast with ancestral τιμαί points to marks of prestige or status in Greek culture. 'Distinctions' captures social prestige without sounding overly exalted.
- source_word: καλλίστας
  chosen: the finest
  alternatives:
  - most beautiful
  - best
  lexicon: LSJ
  rationale: Superlative of καλός. 'The finest' conveys evaluative preference in smooth English and fits the social-prestige context better than the more literal 'most beautiful'.
- source_word: ἡγούμενοι
  chosen: considering
  alternatives:
  - thinking
  - regarding
  lexicon: LSJ
  rationale: A participle of evaluation/judgment. 'Considering' is concise and idiomatic in English.
