translation:
  text: Until then I lay face down, covered and trembling[a]. The Lord called to me with his own mouth and said, “Come here, Enoch, to hear my holy word[b].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Ge'ez word translated “covered” is unclear; the Greek describes Enoch as lying prostrate.
    reason: textual_variant
  - marker: b
    text: The word “holy” is uncertain in the Ge'ez; the Greek instead says, “and hear my word.”
    reason: textual_variant
