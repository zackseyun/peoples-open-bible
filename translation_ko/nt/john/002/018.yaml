revisions:
- from: 그러자 유대인들이[a] 대답하여 그에게 말했습니다. 「당신이 이런 일들을 하신다는 것을 우리에게 어떤 표적으로 보이십니까?」
  to: 그러자 유대인들이[a] 대답하여 그에게 말했습니다. “당신이 이런 일을 하시니, 무슨 표적을 우리에게 보이십니까?”
  rationale: 직접 질문 τί σημεῖον δεικνύεις ἡμῖν을 ‘무슨 표적을 우리에게 보이십니까?’로 바로 옮겨 표적이 요구되는 대상임을 회복했습니다. ὅτι는 문맥상 표적 요구의 근거를 나타내므로 ‘당신이 이런 일을 하시니’로 자연스럽게 처리했습니다. 본문의 ‘유대인들’은 원문 문면을 유지하고, 가능한 문맥적 제한은 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:47:19Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘당신이 이런 일들을 하신다는 것을 우리에게 어떤 표적으로 보이십니까?’는 ‘어떤 표적’을 보이는 대상이 아니라 수단처럼 처리하여, τί σημεῖον δεικνύεις ἡμῖν의 직접 목적어 구조를 흐립니다. ὅτι는 이 문맥에서 예수께서 이러한 일을 행하시는 것을 근거로 표적을 요구하는 용법으로 자연스럽게 옮길 수 있습니다.
  naturalness: ‘무슨 표적을 우리에게 보이십니까?’가 현대 표준 한국어 합쇼체에서 자연스럽고, ‘당신이 이런 일을 하시니’가 질문의 근거를 분명히 합니다. ‘대답하여 말했습니다’는 원문의 응답·발화 도입을 무리 없이 보존합니다.
  terminology: ‘유대인들’과 ‘표적’은 각각 οἱ Ἰουδαῖοι와 σημεῖον의 문면 및 요한복음의 용례를 적절히 보존합니다. οἱ Ἰουδαῖοι의 문맥상 더 좁은 지시 가능성은 각주로만 제시하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘어떤 표적으로 보이십니까’가 τί σημεῖον의 문장 기능을 바꿉니다.
    rationale: 원문은 ‘우리에게 무슨 표적을 보이십니까?’라고 표적 자체를 요구합니다. 초안은 ‘표적으로’라는 부사격 처리로 ‘이런 일을 한다는 사실’을 무엇으로 보이는지 묻는 문장이 되어 원문의 직접 목적어와 논리 관계가 불명확해집니다.
  - severity: low
    issue: ὅτι절의 한국어 연결 방식이 부자연스럽고 의미 관계를 अस्पष्ट하게 합니다.
    rationale: ‘…하신다는 것을’은 ‘보이다’의 내용으로 읽히기 쉬우나, 여기서는 예수의 행위를 근거로 표적을 요구하는 도전의 맥락입니다. ‘…하시니’는 이를 자연스럽게 드러냅니다.
