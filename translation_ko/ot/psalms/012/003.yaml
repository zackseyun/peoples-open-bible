    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘큰 것들’. 여기서는 자랑스럽거나 교만한 주장을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  english_pob_choice: emptiness
  chosen_korean: 헛된 말
