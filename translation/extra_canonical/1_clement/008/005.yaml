id: 1CLEM.8.5
reference: 1 Clement 8:5
unit: verse
book: 1 Clement
source:
  edition: Funk 1901 (normalized OCR)
  text: πάντας οὖν τοὺς ἀγαπητοὺς αὐτοῦ βουλόμενος μετανοίας μετασχεῖν ἐστήριξεν τῷ παντοκρατορικῷ βουλήματι αὐτοῦ.
  language: Greek
translation:
  text: Therefore[a], desiring all his beloved ones to share in repentance[b], he established it by his almighty will.
  philosophy: optimal-equivalence
