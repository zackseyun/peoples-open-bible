  from: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
  to: Jesus was casting out a demon that had made a man mute. When the demon came out, the man spoke, and the crowds marveled.
  rationale: The lexical record rightly gives priority to muteness because the man speaks after the demon departs. I make that causal relationship explicit while retaining the actual exorcism and the crowds’ wonder; the deaf/mute note is unnecessary in this context.
