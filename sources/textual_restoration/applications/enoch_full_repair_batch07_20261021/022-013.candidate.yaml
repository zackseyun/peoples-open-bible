translation:
  text: “In this way a place was created for the souls of people who were not righteous but sinners, complete in
    wrongdoing, who will be with the wrongdoers, like them. But their soul will not be killed on the day of judgment,
    and they will not rise from here.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The full selected unit continues onto printed60/PDF98. Both negatives are explicit: their soul will not
      be killed and they will not rise from here. The source shifts from a singular soul expression to a plural
      verb; English preserves that shift. Rise may also mean get up or be raised; the clause does not by itself
      settle a systematic doctrine of resurrection, soul immortality, or annihilation. No affirmative killing or
      rising is substituted.'
    reason: lexical_alternative
