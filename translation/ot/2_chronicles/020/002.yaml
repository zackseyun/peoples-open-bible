  from: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
  to: Messengers came and reported to Jehoshaphat, “A vast army is coming against you from across the Dead Sea, from Edom[a]. They are already at Hazazon-tamar” (that is, En-gedi).
  rationale: The lexical record favored “Aram” as a direct rendering of the supplied Hebrew, but the chapter's geography and named peoples give a meaning-based reason to prefer the attested reading “Edom.” I also replace the ambiguous reporting subject and the misplaced, largely redundant earlier notes.
