revisions:
- from: '1[a]. 첫째 주의 첫째 해, 곧 마흔다섯째 희년에 리브가가 자기 아들 야곱을 불러 그 아버지와 형의 일을 명하여 평생에 그들을 공경하게 하였더라.

    2. 야곱이 이르되 당신이 내게 명하신 대로 내가 다 행하리이다 이 일이 내게는 영광이요 위대함이요 주님 앞에 의로움이니 내가 그들을 공경하게 하려 함이니이다

    3. “그리고 내 어머니, 당신도 아시다시피 제가 태어난 날부터 오늘까지 제가 행한 모든 일과

    4. 그것은 내 마음 속에 있습니다. 나는 모든 일을 모두에게 좋다고 생각합니다. 그런데 아버지께서 제게 명령하신 이 일, 곧 제 아버지와 형제를 공경하라고 제가 어찌 행하지 아니하겠습니까?

    5. 어머니여, 제게서 무슨 패역함을 보셨는지 말씀해 주십시오. 그러면 제가 그것에서 돌이켜 자비를 베풀어 드리겠습니다.”

    6. 그 여인이 그에게 이르되 내 아들아 내가 평생에 네에게서 패역한 일을 보지 못하고 오직 공의만 보았노라 그러나 내 아들아 내가 네게 진실을 말하노니 내가 금년에 죽고 올해도 지나지 아니하리니 내가 꿈에서 죽는 날을 보았나니 내가 백오십오 년을 넘지 못하리라 하였음이니이다

    7. 보라, 나는 내 평생의 모든 날을 다 마쳤다.” 야곱이 그의 어머니의 말을 비웃었으니 이는 그의 어머니가 자기는 죽을 것이라 그에게 말하였음이러라 그러나 그 어머니는 그의 맞은편에 앉아서 자기를 대하여 강건하여 그 힘으로 약해지지 아니하였으니 이는 그가 드나들며 보았음이니라

    8. 그 이는 이빨이 튼튼하고 평생에 병이 조금도 생기지 아니하였더라. 야곱이 그에게 이르되 어머니여 내 날이 어머니의 임할 날에 가까우고 어머니의 강하심을 따라 내 힘이 이같이 내게 남아 있으면 내겐 복이 있도다 어머니께서 어머니의 죽음에 관하여 헛되이 내게 말씀하시니 죽지 마소서

    9. 그가 이삭에게 들어가서 그에게 이르되 내가 네게 한 가지 부탁을 하노니 에서에게 야곱을 미워하지 아니하며 그를 적의로 따르지 아니할 것을 에서에게 맹세하게 하라 이는 에서의 생각을 네가 아나니 그가 어려서부터 완고하며 그에게 악한 뜻이 없음이라

    10. 당신이 죽은 후에 그를 죽이려고. 야곱의 형이 하란으로 갔던 날부터 오늘까지 그가 온 마음을 다하여 우리를 떠나 그 일을 어떻게 행하였는지를 너희가 다 아느니라

    11. 우리에게 재앙이 닥쳤으니 그가 너희의 양떼를 모았고 너희의 모든 소유를 너희 앞에서 떠났느니라. 그리고 우리가 우리의 것을 그분께 구하고 구할 때, 그분은 우리에게 자비를 베푸시는 분이십니다.

    12. 그리고 당신이 당신의 완전하고 정직한 아들 야곱을 축복하였으므로 그가 당신을 원망하고 있습니다. 그에게는 악이 전혀 없고 오직 우리의 선함만이 있을 뿐입니다. 그가 하란에서 오실 때부터 오늘까지 우리에게 아무 것도 빼앗지 아니하셨으니 이는 모든 것이 날마다 제때에 우리에게 옴이라 우리를 그 손에서 거두실 때마다 온 마음으로 기뻐하시고 우리에게 복을 주시느니라. 그 사람은 하란에서 올 때부터 오늘까지 우리를 떠나지 아니하시고 우리를 존경하시며 항상 그 집에 우리와 함께 계시느니라.”

    13. 이삭이 그에게 이르되 나도 알고 보니 야곱이 우리를 대하여 온 마음으로 존중히 여기느니라 내가 에서를 야곱이 태어날 때부터 먼저 사랑하였더니 이제는 내가 에서보다 야곱을 더 사랑하나니 이는 그의 행위가 심히 악하고 그에게 의가 없음이라 그의 행위는 모두 불의와 포악이요 그 주위에는 의가 없음이라

    14. 이제 그의 모든 일로 말미암아 내 마음이 불안하니 그와 그의 자손이 구원을 얻지 못하리라 그들은 땅에서 뽑힐 자요 천하에서 멸망을 당할 자니 이는 그가 아브라함의 하나님을 버리고 그 아내들을 좇았음이라

