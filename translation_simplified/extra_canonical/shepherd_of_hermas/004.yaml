translation:
  text: 'IV.1. So when she finished reading and rose from the chair, four young men came, lifted the chair[e],
    and went away toward the east.


    IV.2. She called me over and touched my chest. She said to me, “Did you like my reading?” I said to
    her, “Lady, I like these last things[a], but the earlier things are hard and harsh[d].” She said to
    me, “These last things are for the righteous, but the earlier things are for the nations[b] and the
    apostates.”


    IV.3. While she was speaking with me, two men appeared. They lifted her by the elbows[f] and went
    away toward the east, where the chair also was. She went away cheerful. As she was going, she said
    to me, “Take courage[c], Hermas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: These last things and the earlier things refer here to the latter and former portions of her
      reading.
    reason: cultural_note
  - marker: b
    text: Nations renders ethnesin; Gentiles is an alternative. Apostates renders apostatais, those who
      have fallen away or defected. Working Greek, Athos and Sinaiticus4.2 retain the two groups. Vulgata
      printed7 has defectors and Gentiles in reversed order; Palatina printed17 has Gentiles and transgressors.
      D’Abbadie1860’s Latin rendering of Ethiopic printed115 instead has peoples who denied, without separately
      enumerating both groups. The working distinction remains.
    reason: lexical_alternative
  - marker: c
    text: Take courage renders andrizou; literally act like a man, an exhortation to bravery. Athos and
      Sinaiticus4.3 retain the imperative with Hermas’s name. Vulgata printed7 has Confortare, Herma,
      be strengthened, Hermas; Palatina printed17 has Viriliter age, act bravely, without the name. D’Abbadie1860’s
      Latin rendering of the Ethiopic printed115 instead has eundum est, Herma, one must go, Hermas. That
      different farewell is disclosed rather than inserted into the selected Greek. Ethiopic evidence
      here is through the printed Latin translation, not direct Geʿez collation.
    reason: lexical_alternative
  - marker: d
    reason: textual_variant
    text: Working Greek and Athos say the last things please Hermas but the earlier things are hard and
      harsh. Sinaiticus4.2 first hand lacks areskei ta de protera, please, but the earlier things; S1
      adds those words. Without that phrase the first-hand answer calls these last things hard and harsh.
      Both printed Latin versions and the Latin rendering of Ethiopic retain a favorable response to the
      last part and an unfavorable response to the first. The longer working contrast is retained; correctors
      are not extra manuscripts.
  - marker: e
    reason: textual_variant
    text: The working Greek and Athos have four young men lifting the chair and going east after she finishes
      reading and rises. Sinaiticus4.1 first hand lacks hote oun, so when, and the separate chair-lifting
      clause; ca adds both, while another correction removes a stray nes before young men. Both printed
      Latin versions and the Ethiopic edition’s Latin rendering retain four youths and removal of the
      chair toward the east. Vulgata also has again with the lifting. No first-hand words are invented
      to harmonize Sinaiticus.
  - marker: f
    reason: textual_variant
    text: The working Greek, Athos and Sinaiticus4.3 have two men lifting her by the elbows. Vulgata printed7
      instead carries her on their shoulders; Palatina printed17 says they lift her with their hands,
      not that they grasp her by her own hands. The Ethiopic edition’s Latin rendering printed115 says
      they take her up, without naming elbows. All retain the departure toward the chair in the east and
      her cheerful departure. The specific elbows of the selected Greek remain.
lexical_decisions:
- source_word: ἀναγινώσκουσα / ἀνάγνωσις
  lemma: ἀνάγνωσις
  chosen: reading
  alternatives:
  - reciting
  - public reading
  lexicon: BDAG
  rationale: ἀναγινώσκω and its noun ἀνάγνωσις denote the act of reading aloud; in context she has been
    reading to Hermas. "Reading" preserves the concrete act without adding liturgical nuance.
- source_word: καθέδρα
  chosen: chair
  alternatives:
  - seat
  lexicon: LSJ
  rationale: Concrete piece of furniture in the vision; "chair" keeps the scene vivid. "Seat" is more
    generic.
- source_word: νεανίαι
  chosen: young men
  alternatives:
  - youths
  lexicon: LSJ
  rationale: Plural of νεανίας; "young men" is clear modern English. "Youths" can sound archaic or ambiguous.
- source_word: ἀνατολή
  chosen: east
  alternatives:
  - sunrise
  - the Orient
  lexicon: BDAG
  rationale: Spatial direction in visionary movement; "toward the east" is the natural rendering.
- source_word: προσκαλεῖται (με)
  chosen: called me over
  alternatives:
  - summoned me
  - called me to herself
  lexicon: BDAG
  rationale: Middle voice with personal object conveys a drawing toward herself; "called me over" reads
    naturally and preserves proximity nuance.
- source_word: ἥψατο τοῦ στήθους
  chosen: touched my chest
  alternatives:
  - touched my breast
  - laid her hand on my chest
  lexicon: BDAG
  rationale: στῆθος refers to the chest; "chest" is straightforward modern English. Preserves the concrete
    gesture.
- source_word: ἥρεσεν / ἀρέσκει
  chosen: like
  alternatives:
  - did you like / I like
  lexicon: BDAG
  rationale: Like in the question and answer preserves the same favorable response as standard please.
    Retain the contrast with hard and harsh.
- source_word: ἔσχατα / πρότερα
  chosen: last things / earlier things
  alternatives:
  - later parts / earlier parts
  - latter / former
  lexicon: LSJ
  rationale: Literally "last" and "former"; here they refer to parts of her reading. Rendering as "last
    things / earlier things" keeps the literal contrast while context indicates sequence, not eschatology.
- source_word: χαλεπὰ καὶ σκληρά
  chosen: hard and harsh
  alternatives:
  - difficult and severe
  - grievous and harsh
  lexicon: LSJ
  rationale: χαλεπός = difficult, grievous; σκληρός = harsh, severe. "Hard and harsh" keeps the alliteration
    and weight without over-interpretation.
- source_word: δίκαιοι
  chosen: righteous
  alternatives:
  - just
  lexicon: BDAG
  rationale: δικαίος in early Christian moral discourse commonly rendered "righteous"; fits Hermas's ethical
    frame.
- source_word: ἔθνη
  chosen: nations
  alternatives:
  - Gentiles
  lexicon: BDAG
  rationale: ἔθνη can mean the Gentiles, but in Hermas the broader sense of the non-Christian nations
    is likely; "nations" preserves the generic outsider scope.
- source_word: ἀποστάται
  chosen: apostates
  alternatives:
  - rebels
  - deserters
  lexicon: LSJ
  rationale: ἀποστάτης denotes one who has fallen away or rebelled. Given Hermas's concern with those
    who leave the faith, "apostates" is apt and transparent.
- source_word: ἀγκών
  chosen: elbows
  alternatives:
  - arms
  lexicon: LSJ
  rationale: The genitive construction indicates grasping by the elbows; "elbows" keeps the vivid, specific
    gesture.
- source_word: ἱλαρά
  chosen: cheerful
  alternatives:
  - glad
  - joyful
  lexicon: LSJ
  rationale: ἱλαρός describes a cheerful, glad disposition; "cheerful" is natural and accurate.
- source_word: ὑπάγουσα
  chosen: as she was going
  alternatives:
  - as she departed
  - as she went away
  lexicon: BDAG
  rationale: ὑπάγω here marks departing movement; participial timing captured with "as she was going".
- source_word: ἀνδρίζου
  chosen: Take courage
  alternatives:
  - Be brave
  - Act like a man
  lexicon: BDAG
  rationale: Idiom literally means "act like a man" = be courageous. "Take courage" conveys the exhortation
    idiomatically without importing gendered phrasing; note alternatives in footnotes.
- source_word: ἦραν
  chosen: lifted
  alternatives:
  - took up
  - carried off
  lexicon: BDAG
  rationale: Simple physical action; "lifted" matches the immediate raising motion in both occurrences.
