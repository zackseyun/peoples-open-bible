theological_decisions:
- issue: Distinct rod groups and conditional repentance
  chosen_reading: Retain the distinct half-dry and green rod groups, including their cracks; distinguish
    repentance already undertaken from the continuing hope of repentance, and faster from slower repentance
    with the tower/walls distinction. Preserve expulsion and loss of life for renewed division, life for
    those keeping the Lord’s commandments, and the emphatic death warning for those persisting in their
    deeds.
  rationale: Do not merge groups or erase hard conditional statements to smooth theology. Keep the alternative
    readings and damaged witness limits explicit.
