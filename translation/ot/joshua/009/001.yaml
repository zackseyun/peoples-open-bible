    prior_rendering: And it happened, when ... heard of it
    new_rendering: When ... heard what had happened
    rationale: The Hebrew introduces the circumstances of the next action; English does not need a separate statement that something happened, and the implicit object of hearing is supplied naturally from context.
  - source_phrase: בְּעֵבֶר הַיַּרְדֵּן
    prior_rendering: beyond the Jordan
    new_rendering: west of the Jordan
    rationale: The regions and peoples listed identify the western side, whereas 'beyond' leaves modern readers uncertain about the geography.
  - source_phrase: וּבַשְּׁפֵלָה
    prior_rendering: in the lowland
    new_rendering: the western foothills
    rationale: This names the foothill region between the central highlands and the coastal plain, rather than low-lying land generally.
  - source_phrase: הַיָּם הַגָּדוֹל
    prior_rendering: the Great Sea
