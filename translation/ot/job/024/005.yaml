id: JOB.24.5
reference: Job 24:5
source:
  edition: WLC
  text: הֵ֤ן פְּרָאִ֨ים בַּֽ/מִּדְבָּ֗ר יָצְא֣וּ בְּ֭/פָעֳלָ/ם מְשַׁחֲרֵ֣י לַ/טָּ֑רֶף עֲרָבָ֥ה ל֥/וֹ לֶ֝֗חֶם לַ/נְּעָרִֽים׀׃
translation:
  text: Look, like wild donkeys in the wilderness, the poor go out to their work, searching early for food; the desert provides bread for them and their children.
  philosophy: dynamic
lexical_decisions:
- source_word: הֵן
  chosen: Look
  alternatives:
  - Behold
  - See
  lexicon: HALOT
  rationale: Introduces the scene with attention-getting force. 'Look' is natural modern English while preserving the deictic emphasis.
- source_word: פְּרָאִים
  chosen: wild donkeys
  alternatives:
  - wild asses
  lexicon: HALOT
  rationale: Refers to untamed donkeys of the wilderness. 'Wild donkeys' is accurate and contemporary; 'wild asses' is archaic in modern English.
- source_word: בַּמִּדְבָּר
  chosen: in the wilderness
  alternatives:
  - in the desert
  lexicon: HALOT
  rationale: The phrase locates the wild donkeys in an uncultivated wasteland. 'Wilderness' preserves the broader sense better than the narrower 'desert' here.
- source_word: יָצְאוּ
  chosen: they go out
  alternatives:
  - they go forth
  - they come out
  lexicon: HALOT
  rationale: Simple motion verb; present-like English fits the vivid poetic description.
- source_word: בְּפָעֳלָם
  chosen: to their labor
  alternatives:
  - for their work
  - at their task
  lexicon: HALOT
  rationale: Conveys purposeful activity in earning sustenance. 'Labor' suits the hardship context of the oppressed described in the chapter.
- source_word: מְשַׁחֲרֵי
  chosen: seeking ... early
  alternatives:
  - rising early for
  - diligently seeking
  lexicon: HALOT
  rationale: The participle carries the sense of seeking from early morning. Rendering with 'seeking ... early' preserves both pursuit and temporal nuance.
- source_word: לַטָּרֶף
  chosen: food
  alternatives:
  - prey
  - provision
  lexicon: HALOT
  rationale: Though often 'prey,' in this human-poverty context it refers more broadly to sustenance obtained for survival, not animal hunting specifically.
- source_word: עֲרָבָה
  chosen: the desert
  alternatives:
  - the steppe
  - the Arabah
  - the wilderness plain
  lexicon: HALOT
  rationale: “Desert” naturally conveys the arid steppe or wasteland in the image.
- source_word: לוֹ
  chosen: for them
  alternatives:
  - them
  - for him
  lexicon: HALOT
  rationale: The singular functions distributively in a description of plural people; the literal singular is retained in the note.
- source_word: לֶחֶם
  chosen: bread
  alternatives:
  - food
  lexicon: HALOT
  rationale: “Bread” preserves the concrete source image.
- source_word: לַנְּעָרִים
  chosen: their children
  alternatives:
  - for the young ones
  - for his boys
  - for the youths
  lexicon: HALOT
  rationale: In this context the young ones are the dependents of those seeking food; the possessive makes the English relation clear.
- source_word: מְשַׁחֲרֵי לַטָּרֶף
  chosen: searching early for food
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The phrase describes an early or diligent search for sustenance; “food” avoids importing a specifically predatory sense.
