revisions:
- from: 1. 음행하는 사람은, 파멸당하는 중에도 그것을 깨닫지 못하고, 수치를 당하면서도 부끄러워하지 않습니다. 2. 그러므로 사람이 왕일지라도 음행하면 왕권에서 벗겨지고, 저도 음행의 종이 되었던 것처럼 그렇게 됩니다. 3. 나는 내 지팡이—곧 내 지파를 떠받치는 기둥을—그리고 내 띠—곧 내 힘을—그리고 내 관—곧 내 왕권의 영광을—내주었습니다. 4. 그리고 이 일들에 대하여 회개한 뒤에도, 나는 늙을 때까지 포도주도 고기도 먹지 않았고, 어떤 기쁨도 보지 못했습니다. 5. 하나님의 천사가 내게 보여 주기를, 여자들은 왕이나 가난한 사람이나 모두를 지배하며, 왕에게서 그의 영광을, 힘센 사람에게서 그의 힘을, 가난한 사람에게서 그의 가장 작은 의지처마저 빼앗아 갑니다.[a][b]
  to: 1. 음행하는 사람은 발가벗겨져도 깨닫지 못하고, 수치를 당해도 부끄러워하지 않습니다. 2. 사람이 왕이라 해도 음행하면, 음행에 예속되어 나도 겪었던 것처럼 왕권을 빼앗깁니다. 3. 나는 내 지팡이, 곧 내 지파의 버팀목을 내어 주었고, 내 띠, 곧 내 힘을 내어 주었으며, 내 관, 곧 내 왕국의 영광을 내어 주었습니다. 4. 나는 이 일들을 두고 회개한 뒤, 늙을 때까지 포도주는 마시지 않고 고기는 먹지 않았으며, 어떤 기쁨도 보지 못했습니다. 5. 하나님의 천사가 내게 보여 주었습니다. 여자들은 왕과 가난한 사람을 지배하며, 왕에게서 영광을, 남자에게서 힘을, 가난한 사람에게서 가장 작은 버팀목마저 빼앗아 갑니다.
  rationale: 원문의 노출·박탈 이미지, 음행에 대한 예속, 세 상징물의 설명 병렬, 회개 뒤의 금욕, 그리고 5절의 왕·남자·가난한 사람에 대한 삼중 박탈 구조를 보존했습니다. 원문에 없는 양보 및 ‘힘센’이라는 수식은 제거했으며, 현 원문 증거와 부합하지 않고 구조적으로도 불완전한 각주 앵커를 삭제했습니다.
