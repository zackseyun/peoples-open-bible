  meaning: The imagined lament ends with the fear that no son will remain to bury her, but the author declares that the holy mother did not lament her sons in this way.
  meaning_decisions:
  - source_phrase: ἣ οὐδʼ ἂν ἀποθάνω
    prior_rendering: who, even if I were not to die
    new_rendering: Not even when I die
    rationale: The negation belongs to the statement about having a son to bury her, not to the possibility of her dying; the relative continuation can naturally become an independent English sentence.
  - source_phrase: θάπτοντα τῶν υἱῶν ἕξω τινά
    prior_rendering: would bury some one of my sons
    new_rendering: will I have one of my sons to bury me
    rationale: ἕξω means 'I will have,' and θάπτοντα describes the son who would perform the burial; the prior wording reversed who buries whom.
  - source_phrase: ἀλλὰ τούτῳ τῷ θρήνῳ οὐδένα ὀλοφύρετο
    prior_rendering: But with this lament ... bewailed none of them
    new_rendering: But ... did not lament any of them in this way
    rationale: Clearly marks the preceding speech as an imagined lament rather than the mother's actual response.
