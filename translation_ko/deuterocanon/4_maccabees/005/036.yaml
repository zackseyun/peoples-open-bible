  text: Nor will you defile my mouth, made venerable by old age, nor the years of a law-abiding life.
translation:
  language: ko
  text: 당신은 노년으로 존귀해진 내 입을 더럽히지도 못하며, 율법을 지키며 살아온 세월도 더럽히지 못합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεμνὸν γήρως στόμα
  english_pob_choice: my mouth, made venerable by old age
  chosen_korean: 내 존엄한 노년의 입
  alternatives_korean:
  - 노년으로 존귀해진 내 입
  - 늙음으로 존귀해진 내 입
  lexicon: σεμνός, γῆρας, στόμα
  rationale: σεμνὸν은 단순히 ‘늙은’이 아니라 ‘존엄한/경건한’의 뉘앙스를 가지므로, 영어의 made venerable을 반영해 ‘존엄한’으로 옮기고 στόμα는 자연스럽게 ‘입’으로 처리했습니다.
- source_word: μιαινεῖς
  english_pob_choice: defile
  chosen_korean: 더럽힐 수 없습니다
  alternatives_korean:
  - 더럽히지 못합니다
  - 부정하게 할 수 없습니다
  lexicon: μιαίνω
  rationale: 문맥상 육체적 오염이 아니라 모욕과 훼손의 의미가 강하므로, POB의 ‘defile’을 표준 한국어의 ‘더럽히다’로 옮겼습니다.
- source_word: νομίμου βίου
  english_pob_choice: the years of a law-abiding life
  chosen_korean: 율법을 지킨 삶의 세월
  alternatives_korean:
  - 율법에 순종한 삶의 세월
  - 법을 지킨 삶의 나이
  lexicon: νόμιμος, βίος
  rationale: νομίμου는 단순한 ‘합법적인’보다 율법에 맞는 삶을 뜻하므로, POB의 law-abiding life를 유대적 맥락에 맞게 ‘율법을 지킨 삶’으로 구체화했습니다.
theological_decisions:
- issue: 노년과 경건한 삶의 존엄성을 어떻게 표현할지
  chosen_reading: 화자가 자신의 늙음을 도덕적·영적 존엄의 근거로 제시하는 발언으로 유지했습니다.
  alternative_readings:
  - 단순한 생물학적 노화의 언급으로 약화하는 읽기
  - 예의상 완곡한 자기소개로만 읽는 것
  rationale: 원문은 나이 듦 자체가 아니라 그 나이 듦이 지닌 존엄과 율법적 삶의 축적을 강조하므로, 그 긴장을 보존해야 합니다.
  doctrine_reference: 순교 서사 안에서 경건한 삶의 가치와 몸의 존엄성을 함께 드러내는 본문
- issue: 문장의 어조를 직접 발화로 유지할지
  chosen_reading: 2인칭 경고문을 합쇼체로 유지해 단호한 선언성을 살렸습니다.
  alternative_readings:
  - 완곡한 서술문으로 바꾸는 것
  - 더 부드러운 요청형으로 낮추는 것
  rationale: 원문은 상대를 직접 겨냥한 강한 거절이므로, 한국어에서도 단호한 직설을 보존하는 것이 적절합니다.
  doctrine_reference: 수사적 거절/도전의 보존
