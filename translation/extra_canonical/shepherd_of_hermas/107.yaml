translation:
  text: '“Hear about all these too,” he says. “The stones taken up from the plain and placed in the tower’s
    building in place of the rejected stones are the roots of this white mountain.”


    2. “Since all the believers from this mountain were found innocent, the Lord of the tower ordered
    that these stones from the mountain’s roots be put into the tower’s building. For he knew that if
    these stones went into the building, they would remain bright, and not one of them would turn black.”


    3. “But if he had added stones from the other mountains, he would have had to inspect that tower again
    and purify it. All these, however, were found white,[a] both those who have believed and those who
    will believe. For they are of the same kind.[b] Blessed is this kind, because it is innocent.”


    4. “Now hear also about those round and splendid stones. They are all from this white mountain. Hear
    why they were found round. Their riches have somewhat obscured and clouded their view of the truth.
    Yet they never departed from God, nor did any evil word come from their mouths, but only righteousness
    and the virtue of truth.”


    5. “When the Lord saw their disposition—that they could favor the truth[c] and also remain good—he
    ordered their wealth to be cut back, rather than taken away entirely. Then they could do some good
    with what was left to them, and they will live to God, because they are of a good kind. So they were
    trimmed a little and placed in the structure of this tower.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The printed Latin inventi, “found,” is Gebhardt’s conjecture with reported Palatina support.
      The cited Vulgata manuscripts have iuvenes, “young.” This draft follows the explicit working-edition
      correction; the Amherst fragment does not preserve enough of this wording to certify that correction.
  - marker: b
    reason: textual_variant
    text: The continuous source switches from Greek to Latin at the start of this paragraph. Amherst190
      h verso partly preserves Greek same-kind and innocent-kind wording, but surrounding words and the
      future-belief phrase are damaged or editorially restored. It is a bounded parallel, not a continuous
      Greek replacement for this Latin paragraph.
  - marker: c
    reason: textual_variant
    text: “That they could favor the truth” translates the dagger-marked Latin crux posse eos veritati
      favere. The wording remains uncertain. The apparatus proposes wording about recognizing their servitude
      from versions and Latin variants, but this draft does not silently adopt that conjecture. Amherst190
      h does not reach this clause; it cannot settle the crux.
lexical_decisions:
- source_word: αἱ ῥίζαι / circumcidi
  chosen: the roots / cut back
  alternatives:
  - the base / circumcised
  rationale: Preserve the changing stone/root/trimming images and the explicit application to wealth.
- source_word: ex eodem enim genere sunt
  chosen: they are of the same kind
  alternatives:
  - same race
  - same family
  rationale: The kind is defined by innocence in context, not an inserted ethnic identity. Amherst’s partial
    same-kind wording is recorded separately.
- source_word: †posse eos veritati favere†
  chosen: that they could favor the truth
  alternatives:
  - recognize their servitude
  rationale: Translate the printed crux provisionally with an exposed uncertainty; the alternative is
    an editorial conjecture, not preserved Greek.
