  text: 그가 일어설 때 힘센 자들이 두려워하고, 부서지는 소리에 그들은 갈피를 잡지 못합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשֵּׂתּוֹ
  english_pob_choice: At his rising
  chosen_korean: 그가 일어날 때에
  alternatives_korean:
  - 그가 일어섰을 때
  - 그가 일어나면
  lexicon: שׂאת / קום
  rationale: אָית로서의 ‘일어남’을 자연스럽게 옮기되, 상황 묘사의 현재적 일반성을 살려 ‘일어날 때에’로 처리했습니다.
- source_word: אֵלִים
  english_pob_choice: the mighty
  chosen_korean: 용사들
  alternatives_korean:
  - 강한 자들
  - 힘센 자들
  - 권세 있는 자들
  lexicon: אֵיל / אֱלִים
  rationale: 문맥상 압도적인 힘을 지닌 존재들을 가리키므로, 한국어에서 가장 직관적인 ‘용사들’로 옮겼습니다.
- source_word: יִתְחַטָּאוּ
  english_pob_choice: they are beside themselves
  chosen_korean: 혼란에 빠집니다
  alternatives_korean:
  - 제정신을 잃습니다
  - 당황합니다
  - 넋을 잃습니다
  lexicon: חתא / חטא (reflexive nuance in context)
  rationale: 영어 POB가 지적한 ‘beside themselves’를 따라, 단순한 감정의 동요보다 자기 통제가 무너지는 상태를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘at the crashing’의 이미지 보존
  chosen_reading: ‘부서지는 소리만 들어도’로 충격의 소리를 살렸습니다.
  alternative_readings:
  - ‘무너질 때에’
  - ‘부딪히는 소리에’
  rationale: 히브리어는 파괴·충돌의 소리와 그 파급을 시각이 아니라 청각적 이미지로 제시하므로, 이를 평이하게 풀어 전달했습니다.
  doctrine_reference: 시적 묘사 보존 원칙
