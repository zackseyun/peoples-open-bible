theological_decisions:
- issue: Rendering of the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Nuance of אֱמֶת in covenantal pairing with חֶסֶד
  chosen_reading: truth
  alternative_readings:
  - faithfulness
  rationale: The Hebrew term can mean both 'truth' and 'faithfulness.' To preserve lexical transparency, the main text uses the more literal 'truth,' while the covenantal nuance 'faithfulness' is preserved in a footnote rather than being resolved away.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
