base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: ko
  text: “당신은 당신이 잃은 군대만큼 군대를 소집하고, 말을 말만큼, 병거를 병거만큼 마련하십시오. 그런 다음 평야에서 그들과 싸웁시다. 틀림없이 우리가 그들보다 더 강할 것입니다.” 그래서 그는 그들의 말을 듣고 그대로 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה לְךָ חַיִל
  english_pob_choice: muster for yourself an army
  chosen_korean: 자기에게서 떨어져 나간 군대와 같은 군대를 징집하고
  alternatives_korean:
  - 군대를 계수하고
  - 병력을 모으고
  - 자기 군대를 세어
  lexicon: תִמְנֶה
  rationale: 문맥상 단순 계산이 아니라 전열을 다시 갖추도록 군사를 불러 모으는 뜻이므로, POB의 muster를 따라 ‘징집하다’로 옮기되 ‘자기에게서 떨어져 나간’으로 원문의 비유를 살렸습니다.
- source_word: כַּחַיִל הַנֹּפֵל מֵאוֹתָךְ
  english_pob_choice: like the army that fell from you
  chosen_korean: 자기에게서 떨어져 나간 군대와 같은
  alternatives_korean:
  - 당신에게서 패한 군대 같은
  - 당신에게서 무너진 군대 같은
  lexicon: הַנֹּפֵל
  rationale: ‘fell from you’는 전투 패배와 이탈의 뉘앙스를 함께 담으므로, 직역적이면서도 자연한 한국어로 ‘떨어져 나간’을 택했습니다.
- source_word: סוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  english_pob_choice: horse for horse and chariot for chariot
  chosen_korean: 말에는 말, 병거에는 병거를
  alternatives_korean:
  - 말은 말대로, 병거는 병거대로
  - 말 대 말, 병거 대 병거로
  lexicon: כַּ/
  rationale: 히브리어의 대응구문을 한국어 반복 구조로 살려, 수적·전력적 대응을 분명하게 표현했습니다.
- source_word: בַּמִּישׁוֹר
  english_pob_choice: on the plain
  chosen_korean: 평야에서
  alternatives_korean:
  - 평지에서
  - 광야에서
  lexicon: מִישׁוֹר
  rationale: מִישׁוֹר는 전투가 벌어질 열린 평지/평야를 가리키므로, 전투 맥락이 드러나는 ‘평야’로 옮겼습니다.
theological_decisions:
- issue: 아람 왕의 전략 제안이 직접화법으로 제시되는 방식
  chosen_reading: 직접 인용부호를 유지해 조언과 결의를 생생하게 드러냈습니다.
  alternative_readings:
  - 간접화법으로 완화
  - 서술문으로 평탄화
  rationale: 본문은 군사 고문들이 왕에게 내는 구체적 전략과 확신을 대화체로 전달하므로, 수사적 긴장감을 보존하는 것이 원문의 의도에 더 가깝습니다.
  doctrine_reference: 내러티브의 담화 기능 보존
- issue: ‘우리가 그들보다 더 강할 것입니다’의 확신 표현
  chosen_reading: ‘분명히 우리가 그들보다 더 강할 것입니다’로 번역해 확신의 어조를 살렸습니다.
  alternative_readings:
  - ‘아마 우리가 더 강할 것입니다’
  - ‘우리가 이길 수 있을 것입니다’
  rationale: 히브리어의 단정적 확신을 약화시키지 않기 위해 미래형보다 확언적 표현을 선택했습니다.
  doctrine_reference: 서사체의 강조법 보존
