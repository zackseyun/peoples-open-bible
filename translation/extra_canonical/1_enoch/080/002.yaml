translation:
  text: “In the days of sinners the years will grow shorter. Their crops will be late on their land and in their
    fields. Everything done upon the earth will change and will not appear at its proper times. Rain will be withheld,
    and the sky will hold it back.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dillmann1865 col834 gives year as a sense of ክረምት and explicitly cites80:2; col623 supports the intransitive
      shortening verb, and col949 gives selected ወፍር as fields or cultivated land. The final verb is the causative
      stopping/holding-back form, not simply the sky will stand. Col453 gives restrain/hold back and explicitly
      cites80:2 in its related delaying range; it, referring to the just-mentioned rain, is supplied in English.
      The printed negative before appear is retained.
    reason: lexical_alternative
