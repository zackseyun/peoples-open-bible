translation:
  text: And you, cleanse the earth of all oppression, of all injustice, of all sin,
    and of all wickedness; and destroy from the earth every unclean thing done upon
    the earth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez command ends with a plural object, literally “destroy them,” apparently
      gathering the preceding evils into the command. The translation states the object
      directly.
    reason: lexical_alternative
lexical_decisions:
- source_word: አንጽሓ
  chosen: cleanse
  alternatives:
  - purify
  rationale: Preserves the command to remove what defiles the earth.
- source_word: ግፍዕ
  chosen: oppression
  alternatives:
  - violence
  - wrongdoing
  rationale: Conveys forceful wrongdoing without merging it with the following term.
- source_word: ዓመፃ
  chosen: injustice
  alternatives:
  - lawlessness
  - rebellion
  rationale: Keeps the second charge distinct while acknowledging its overlap with
    oppression.
- source_word: ረሲዕ
  chosen: wickedness
  alternatives:
  - godlessness
  - evil
  rationale: Fits the sequence of evils without adding an explicit reference to God.
- source_word: ርኵስ ዘይትገበር
  chosen: unclean thing done
  alternatives:
  - impurity practiced
  - defiling deed committed
  rationale: Retains both the language of uncleanness and the statement that it is
    done on the earth.
theological_decisions:
- issue: The scope of cleansing the earth
  chosen_reading: Removal of the named evils and uncleanness
  alternative_readings:
  - A generalized prediction of cosmic renewal
  rationale: The verse specifies what is to be removed; the translation does not import
    a broader eschatological formula.
