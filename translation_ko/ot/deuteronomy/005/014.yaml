  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֣א תַעֲשֶׂ֣ה כָל מְלָאכָ֡ה אַתָּ֣ה וּ/בִנְ/ךָֽ וּ/בִתֶּ֣/ךָ וְ/עַבְדְּ/ךָֽ וַ֠/אֲמָתֶ/ךָ וְ/שׁוֹרְ/ךָ֨ וַ/חֲמֹֽרְ/ךָ֜ וְ/כָל בְּהֶמְתֶּ֗/ךָ וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male slave, or your female slave, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male slave and your female slave may rest as you do.
  footnotes:
  - marker: a
    text: Or 'resident foreigner' for 'sojourner.' The Hebrew גֵּר refers to a non-native resident living within the community.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'within your gates,' an idiom for those residing within your town or community.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 일곱째 날은 당신의 하나님 야훼께 드리는 안식일입니다. 당신과 당신의 아들과 당신의 딸과 당신의 남종과 당신의 여종과 당신의 소와 당신의 나귀와 당신의 모든 가축과 당신의 성문 안에 있는 거류민[a][b]은 어떤 일도 해서는 안 됩니다. 이는 당신의 남종과 여종도 당신처럼 쉬게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거류민’은 여기서 גֵּר를 옮긴 것으로, 단순한 여행자가 아니라 공동체 안에 거주하는 비토착 주민을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성문 안’은 히브리어 관용구로, 한 마을이나 공동체의 관할 안에 있음을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: י֨וֹם הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת
  english_pob_choice: But the seventh day is a Sabbath
  chosen_korean: 그러나 일곱째 날은 안식일입니다
  alternatives_korean:
  - 그리고 일곱째 날은 안식일입니다
  - 일곱째 날은 쉼의 날입니다
  lexicon: HALOT
  rationale: שַׁבָּת는 단순한 ‘쉼’보다 언약적 제도인 안식일을 가리키므로, 전통적 교회 용어이되 문맥상 특정한 날의 성격을 살려 옮겼습니다.
- source_word: לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ
  english_pob_choice: to Yahweh your God
  chosen_korean: 야훼 당신의 하나님께
  alternatives_korean:
  - 여호와 당신의 하나님께
  - 야훼 너의 하나님께
  lexicon: HALOT
  rationale: יהוה는 본 프로젝트 기본값에 따라 야훼로 옮기고, ל의 헌납·귀속 의미는 ‘께’로 자연스럽게 표현했습니다.
- source_word: וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ
  english_pob_choice: the sojourner who is within your gates
  chosen_korean: 당신의 성문 안에 있는 나그네
  alternatives_korean:
  - 당신의 성문 안에 거하는 거류민
  - 당신의 성문 안에 있는 이방 거주자
  lexicon: HALOT
  rationale: גֵּר는 일시적 여행자가 아니라 공동체 안에 사는 비토착 거주자를 가리키므로, POB의 ‘sojourner’를 한국어로는 ‘나그네’로 풀어도 문맥상 거주 의미를 유지하도록 했습니다.
- source_word: עַבְדְּ/ךָ ... וַ/אֲמָתְ/ךָ
  english_pob_choice: your male slave ... your female slave
  chosen_korean: 당신의 남종, 당신의 여종
  alternatives_korean:
  - 당신의 남노예, 당신의 여노예
  - 당신의 종과 여종
  lexicon: HALOT
  rationale: 안식 명령이 가정 내 속박된 신분의 사람들에게도 확장된다는 점이 핵심이므로, 종보다 신분이 드러나는 ‘남종/여종’을 택했습니다.
- source_word: כָל מְלָאכָה
  english_pob_choice: any work
  chosen_korean: 어떤 일도
  alternatives_korean:
  - 어떤 노동도
  - 모든 일도
  lexicon: HALOT
  rationale: מְלָאכָה는 안식일 법문맥에서 금지되는 활동 범주를 가리키므로, 과도한 세부화 없이 ‘어떤 일’로 옮겨 자연스럽게 유지했습니다.
theological_decisions:
- issue: 여호와 대신 야훼 사용
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 יהוה를 직접 사용하므로, 편의적 대체어보다 고유 신명 자체를 드러내는 번역이 출처 충실성에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 남종/여종의 신분 표지
  chosen_reading: 남종 / 여종
  alternative_readings:
  - 종
  - 남자 종 / 여자 종
  rationale: 이 율법은 가족과 가축뿐 아니라 가계에 속한 속박된 사람들까지 안식하게 하라는 명령이므로, 신분적 긴장을 흐리지 않도록 ‘남종/여종’을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
