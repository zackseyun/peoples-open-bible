  from: But give as alms the things that are within[a], and behold, everything is clean for you.
  to: Rather, give what is inside the cup and dish[a] to the poor, and everything will be clean for you.
  rationale: The earlier rationale favored an inward moral reading, but its wording left the object of giving obscure. I give greater weight to the concrete almsgiving instruction and the immediate cup-and-dish context, while preserving the serious alternatives in a note.
