  text: καὶ ἐὰν κατακολουθήσῃς τοῖς λόγοις τῆς παιδίσκης σου, τελείως πρᾶγμα ποιήσει μετὰ σοῦ ὁ θεός, καὶ οὐκ ἀποστεῖται ὁ κύριός μου τῶν ἐπιτηδευμάτων αὐτοῦ.
  language: Greek
  pages:
