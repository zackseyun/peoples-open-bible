id: PRO.25.10
reference: Proverbs 25:10
source:
  edition: WLC
  text: פֶּֽן יְחַסֶּדְ/ךָ֥ שֹׁמֵ֑עַ וְ֝/דִבָּתְ/ךָ֗ לֹ֣א תָשֽׁוּב־׃
translation:
  text: lest someone who hears it shame you and your bad reputation never leave you[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “and the damaging report about you cannot be withdrawn.”
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּן
  chosen: lest
  alternatives:
  - otherwise
  - or else
  lexicon: HALOT
  rationale: Introduces a warning of undesirable consequence. 'Lest' is concise and fits proverbial style better than the more colloquial 'otherwise' or 'or else.'
- source_word: יְחַסֶּדְךָ
  chosen: shame you
  alternatives:
  - shame you
  - reproach you
  - treat you with contempt
  lexicon: HALOT
  rationale: The rare verb is uncertain, but in this context public reproach or shame is a restrained rendering.
- source_word: שֹׁמֵעַ
  chosen: one who hears it
  alternatives:
  - a hearer
  - someone listening
  lexicon: HALOT
  rationale: The participle functions substantivally for an indefinite person. 'One who hears it' is natural English and makes explicit that the warning concerns an overhearing person.
- source_word: דִבָּתְךָ
  chosen: your bad reputation
  alternatives:
  - your evil report
  - the report about you
  - your slander
  lexicon: HALOT
  rationale: The noun can denote a damaging report and, contextually, the ill repute that results from it.
- source_word: לֹא תָשׁוּב
  chosen: never leaves you
  alternatives:
  - not return
  - not be recalled
  - not go away
  lexicon: HALOT
  rationale: This gives the likely enduring consequence in natural English, while the footnote preserves the difficult literal motion image.
