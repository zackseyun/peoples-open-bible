  category: idiom
  tier: 1
  from: Remember how short my lifetime is! For what vanity have you created all the sons of man?[a]
  to: Remember how fleeting I am! Why have you created all the sons of man in vain?[a]
  rationale: “How fleeting I am” respects the first-person syntax of אֲנִי מֶה חָלֶד better than converting it into the possessive “my lifetime.” “Why ... in vain?” is natural rhetorical English for עַל מַה שָּׁוְא; “for what vanity” is unnatural and risks treating vanity as creation’s purpose. Under the supplied editorial policy, “all the sons of man” retains the Hebrew masculine idiom, while the note clarifies its generic scope.
