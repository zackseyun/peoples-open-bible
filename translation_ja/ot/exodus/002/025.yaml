  yaml_path: translation/ot/exodus/002/025.yaml
  text: God saw the sons of Israel, and God knew.
translation:
  language: ja
  text: 神はイスラエルの子らを見、神は知った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: 見
  rationale: 動詞 ראה の基本義「見る」を保ち、神が彼らの状況を見たという簡潔な表現にした。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 「イスラエル人」よりも原文の「イスラエルの子ら」という父祖との結び付きを明示する表現を保った。
- source_word: וַיֵּדַע
  choice: 知った
  rationale: ידע の広い意味領域と、この節に残された目的語なしの強い終止を保持するため、「心に留めた」「顧みた」などと解釈的に補わなかった。
theological_decisions:
- issue: 神が「知った」ことの含意
  choice: 神は知った
  alternative: 神は彼らを顧みた／神は心に留めた
  rationale: 原文は目的語や具体的な対応を明示せず、ידע を用いている。神の認識、関与、契約的な顧みを含み得る余韻を、特定の一義に限定せず残した。
translation_notes:
  register: 原文の短さ、神を二度明示する反復、最後の「知った」という余韻を保つため、簡潔で格調ある現代日本語とした。
