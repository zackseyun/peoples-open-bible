translation:
  text: Moses was beloved by God and people; he is remembered with blessing[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'his memory is for good,' an expression of honored remembrance.
    reason: lexical_alternative
lexical_decisions:
- source_word: אהוב
  chosen: Beloved
  alternatives:
  - loved
  - dear
  lexicon: HALOT
  rationale: The passive/adjectival sense 'beloved' best matches the Hebrew predicate and aligns with the Greek ἠγαπημένον. It preserves the honorific tone better than the flatter 'loved'.
- source_word: אלהים
  chosen: God
  alternatives:
  - God/gods
  lexicon: HALOT
  rationale: In this singular reverential context with Moses, the referent is clearly the God of Israel, so 'God' is the natural English rendering.
- source_word: ואנשים
  chosen: and men
  alternatives:
  - and people
  - and humans
  lexicon: HALOT
  rationale: The Hebrew literally says 'and men/people.' Following the project's gender-accurate policy, 'men' is retained because the source uses the masculine plural אדם/אנשים form rather than a more explicitly neutral expression. The Greek parallel has ἀνθρώπων ('human beings, people'), which could support 'people,' but the Hebrew witness is primary here.
- source_word: משה
  chosen: Moses
  rationale: Standard English transliteration of the personal name משה.
- source_word: זכרו
  chosen: whose memory
  alternatives:
  - his remembrance
  - his memorial
  lexicon: HALOT
  rationale: The construct-like pronominal form is most idiomatically rendered 'whose memory' in English. This also resonates with the Greek μνημόσυνον while remaining natural.
- source_word: לטובה
  chosen: is for blessing
  alternatives:
  - for good
  - for a blessing
  - for good remembrance
  lexicon: HALOT
  rationale: Although literally 'for good,' in commemorative contexts the idiom points to blessed remembrance. The Greek parallel expands interpretively to ἐν εὐλογίαις ('in blessings'), supporting an English rendering that makes the idiom clear rather than leaving the opaque 'for good.'
