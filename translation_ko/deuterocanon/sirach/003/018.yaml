lexical_decisions:
- source_word: מַעֵט נַפְשְךָ מִכָּל גְּדוּלָה
  english_pob_choice: The greater you are, the more you must humble yourself
  chosen_korean: “당신이 더 클수록, 더욱 자신을 낮추십시오”
  alternatives_korean:
  - 모든 큰됨에서 자신을 작게 하십시오
  - 모든 높아짐에서 자신을 낮추십시오
  lexicon: מִכָּל גְּדוּלָה / ταπείνου σεαυτόν
  rationale: 히브리어는 ‘모든 큰됨/높아짐에서 자신을 줄이라’는 뜻이고, 영어 POB의 ‘humble yourself’를 따라 현대 한국어의 직접적인 권고형으로 옮겼습니다.
- source_word: וְלִפְנֵי אֵל
  english_pob_choice: before God
  chosen_korean: “하나님 앞에서”
  alternatives_korean:
  - 하나님 면전에서
  - 하나님 앞에
  lexicon: לִפְנֵי / ἔναντι Κυρίου
  rationale: 전치사 לִפְנֵי/ἔναντι는 ‘앞에서, 면전에서’의 공개적·관계적 위치를 나타내므로, 자연스러운 합쇼체 표현으로 ‘하나님 앞에서’가 적절합니다.
- source_word: תִּמְצָא רַחֲמִים
  english_pob_choice: you will find mercy
  chosen_korean: “은혜를 찾을 것입니다”
  alternatives_korean:
  - 긍휼을 얻을 것입니다
  - 자비를 얻게 될 것입니다
  lexicon: רַחֲמִים / χάριν
  rationale: 히브리어는 ‘긍휼/자비’를 뜻하지만, 대응하는 그리스어 병행문이 χάριν(은혜)을 쓰므로 POB의 의미 축을 살려 ‘은혜’를 채택했습니다.
theological_decisions:
- issue: “mercy”와 “grace”의 대응
  chosen_reading: 본문의 히브리어 רַחֲמִים를 한국어로는 ‘은혜’로 옮겼습니다.
  alternative_readings:
  - 긍휼
  - 자비
  rationale: 이 절의 그리스어 병행문이 χάριν을 사용하고, 영어 POB도 ‘mercy’로 자연화된 신학적 결과를 제시하므로, 두 전통을 함께 반영해 ‘은혜’를 택했습니다.
  doctrine_reference: 시락 3:18 병행본문(히브리어/그리스어)
