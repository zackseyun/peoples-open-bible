lexical_decisions:
- source_word: גְּדֹלִים / Great
  english_pob_choice: Great
  chosen_korean: 위대하며
  alternatives_korean:
  - 크며
  - 매우 크며
  - 웅장하며
  lexicon: גדול
  rationale: 사물의 규모보다 탁월성과 중대함을 드러내는 형용사로 보아, 문맥상 ‘위대하다’가 가장 자연스럽고 격에 맞습니다.
- source_word: מַעֲשֵׂי / works
  english_pob_choice: works
  chosen_korean: 일들
  alternatives_korean:
  - 행사
  - 행하신 일들
  - 행적
  lexicon: מַעֲשֶׂה
  rationale: 하나님의 행위 전체를 가리키는 복수형을 살려 ‘일들’로 옮기되, 너무 설명적으로 늘이지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 본문의 신명 표기를 직접 반영하는 프로젝트 기본값을 따랐습니다.
- source_word: דְּרוּשִׁים
  english_pob_choice: studied
  chosen_korean: 살펴봅니다
  alternatives_korean:
  - 탐구됩니다
  - 연구됩니다
  - 찾아집니다
  lexicon: דרשׁ
  rationale: 영어 POB의 ‘studied’를 따라, 단순한 ‘찾다’보다 의미가 분명히 드러나는 ‘살펴보다’로 옮겼습니다.
- source_word: לְ/כָל חֶפְצֵי/הֶם
  english_pob_choice: by all who delight in them
  chosen_korean: 그것들을 즐거워하는 모든 이가
  alternatives_korean:
  - 그것들을 기뻐하는 모든 이가
  - 그것들을 좋아하는 모든 이가
  - 그것들을 사랑하는 모든 이가
  lexicon: חפץ
  rationale: חפץ의 ‘기뻐하다/즐거워하다’ 뜻을 살려, 원문의 수동적이거나 일반적인 ‘찾는 이’보다 내적 애호를 분명히 드러냈습니다.
theological_decisions:
- issue: דְּרוּשִׁים의 의미를 ‘studied’로 둘지 ‘sought out’로 둘지
  chosen_reading: ‘살펴봅니다’로 옮겨, 하나님의 일들이 단순히 발견되는 것이 아니라 주의 깊게 숙고되고 조사되는 대상으로 제시했습니다.
  alternative_readings:
  - 찾아집니다
  - 추구됩니다
  rationale: 최근 POB 개정에서 ‘studied’가 확정되었으므로, 탐구·숙고의 의미를 살리는 방향이 개정 의도와 가장 잘 맞습니다.
  doctrine_reference: 시편 111편의 지혜적 찬양은 하나님의 행위를 경외와 성찰의 대상으로 제시합니다.
