theological_decisions:
- issue: ‘의의 제사’의 의미 범위
  chosen_reading: 윤리적 진실성만이 아니라, 언약에 맞는 바른 예배와 올바른 제사의 질서를 함께 열어 두는 표현으로 유지했습니다.
  alternative_readings:
  - 도덕적으로 올바른 제사
  - 규정에 맞는 합법적 제사
  rationale: 히브리어 צֶדֶק은 윤리와 예전 질서를 모두 포괄할 수 있으므로, 번역에서 어느 한쪽으로만 좁히지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
