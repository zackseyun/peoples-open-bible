  to: 아닙니다.[a] 오히려 어떤 일이 염려되어 우리가 이렇게 한 것입니다. ‘앞으로 여러분의 자녀들이 우리 자녀들에게 이렇게 말할 것입니다. “너희가 이스라엘의 하나님 여호와와 무슨 상관이 있느냐?”’
  rationale: 복수형 ‘여러분의 자녀들’을 회복하고, 원문의 ‘말하며’가 도입하는 미래 발화 내용을 한국어 인용 구조로 자연스럽게 보존했습니다. ‘어떤 일이 염려되어’는 מִדְּאָגָה מִדָּבָר의 다소 압축적이고 불분명한 대상을 불필요하게 특정하지 않습니다. 각주 표지도 설명 대상인 문두 부정·대조 표현으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
