  from: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
  to: The kingdom of heaven may be compared to a king who gave a wedding feast for his son[a][b].
  rationale: The aorist passive of ὁμοιόω in Matthew's parabolic formulas (Mt 13:24; 18:23; 22:2) functions gnomically or to indicate a state ('has become like' -> 'is like'), not a past act of comparison by an unnamed agent. BDAG explicitly glosses this exact phrase as 'the kingdom of heaven is like.' Rendering it 'was compared to' misrepresents the Greek idiom and obscures the timeless nature of the parable's comparison. 'May be compared to' or 'is like' correctly captures the force. When ἄνθρωπος is used appositionally with a noun of status or profession (like βασιλεύς), it functions idiomatically to designate the person's role, often equivalent to an indefinite article (BDAG ἄνθρωπος 4.a). Translating both words as 'a man, a king' is overly literal and produces awkward English. 'A king' fully captures the lexical intent.
