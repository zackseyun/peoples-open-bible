  verdict: revise
  source_fidelity: 원문의 주격적 소유격(‘요한이 한 증언’), ὅτε의 시간 관계, 파견 목적, 그리고 질문의 명시적 2인칭은 보존되어야 합니다. 초안의 ‘묻도록 했을 때입니다’는 ἵνα의 목적을 다소 우회적으로 만들고, ‘증언으로 … 때입니다’라는 연결도 한국어에서 부자연스럽습니다.
  naturalness: 현대 표준어 합쇼체의 서술과 인용문에 맞추어 문장을 정리했습니다. ‘레위인들’은 현재 한국어 성경 문맥에서 더 자연스럽고 통용되는 명칭이며, 파견단의 질문은 ‘당신은 누구십니까?’로 옮겨 본문의 합쇼체와 조화를 이루게 했습니다.
  terminology: ‘증언’, ‘유대인들’, ‘제사장들’, ‘레위인들’을 유지했습니다. οἱ Ἰουδαῖοι의 범위에 관한 각주는 원문의 문자적 표현을 보존하면서도 요한복음 내 문맥상 가능한 더 좁은 지시 대상을 신중히 설명하도록 다듬었습니다.
