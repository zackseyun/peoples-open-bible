  text: 야훼[a]께서 모세에게 말씀하여 이르셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: YHWH. 여기서는 하나님의 신성명을 ‘야훼’로 음역했습니다.'
