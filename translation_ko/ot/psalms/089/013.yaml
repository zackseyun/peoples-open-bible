  text: צָפ֣וֹן וְ֭/יָמִין אַתָּ֣ה בְרָאתָ֑/ם תָּב֥וֹר וְ֝/חֶרְמ֗וֹן בְּ/שִׁמְ/ךָ֥ יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/013.yaml
  text: You have a mighty arm; your hand is strong; your right hand is raised high.
  footnotes:
  - marker: a
    text: Or 'The north and the right side—you created them.' Here 'right side' is likely a geographical idiom for 'south.'
