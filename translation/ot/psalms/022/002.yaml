  from: and by night, but there is no silence for me.
  to: and by night there is no silence for me.
  rationale: 'The current rendering''s use of ''and [phrase], but [clause]'' is syntactically awkward and redundant in English. The Hebrew structure `וְלַיְלָה וְלֹא...` (wəlaylāh wəlō''...) can be more smoothly rendered by treating both `waw` conjunctions as simple ''and'', which is common in parallel poetic lines. The suggested rewrite removes the redundant ''but'', improving the flow. For even greater clarity of the poetic structure, a semicolon could be used after ''answer'': ''...but you do not answer; and by night there is no silence for me.'''
