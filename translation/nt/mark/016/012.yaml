  rationale: The verse states that Jesus appeared in a different form but does not specify whether this refers to altered appearance, perception, or another mode of recognition. The translation preserves the textual claim without importing a more developed theological explanation.
  doctrine_reference: Preserve theological tension rather than resolve it.
