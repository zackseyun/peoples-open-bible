id: ECC.10.11
reference: Ecclesiastes 10:11
source:
  edition: WLC
  text: אִם יִשֹּׁ֥ךְ הַ/נָּחָ֖שׁ בְּ/לוֹא לָ֑חַשׁ וְ/אֵ֣ין יִתְר֔וֹן לְ/בַ֖עַל הַ/לָּשֽׁוֹן־־׃
translation:
  text: If the snake bites before it is charmed[a], there is no advantage for the charmer[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “without a charm.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “the master of the tongue,” referring here to the speaker of a charm.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  chosen: If
  alternatives:
  - Surely/indeed if
  - when
  lexicon: HALOT
  rationale: Introduces a conditional or illustrative case. 'If' is the most natural English rendering and fits the proverb-like observation.
- source_word: יִשֹּׁךְ
  chosen: bites
  alternatives:
  - strikes
  - bites someone
  lexicon: HALOT
  rationale: The verb נשׁך commonly means 'bite,' especially of a serpent. 'Bites' is direct and idiomatic.
- source_word: הַנָּחָשׁ
  chosen: the snake
  alternatives:
  - the serpent
  lexicon: HALOT
  rationale: Refers to a literal snake in the proverb's imagery. 'Snake' is more natural modern English than 'serpent' here, without theological overtones not present in context.
- source_word: בְּלוֹא לָחַשׁ
  chosen: without a charm
  alternatives:
  - without an incantation
  - without whispering
  - before the charm
  lexicon: HALOT
  rationale: This renders the stated absence of לחש without introducing an unmarked temporal or passive construal.
- source_word: וְאֵין יִתְרוֹן
  chosen: there is no advantage
  alternatives:
  - there is no profit
  - there is no gain
  lexicon: HALOT
  rationale: יתרון is a key Qoheleth term meaning advantage, profit, or gain. 'Advantage' preserves the thematic vocabulary of Ecclesiastes while remaining readable.
- source_word: לְבַעַל הַלָּשׁוֹן
  chosen: for the charmer
  alternatives:
  - for the master of the tongue
  - for the master of speech
  - for the one with the tongue
  lexicon: HALOT
  rationale: Literally 'owner/master of the tongue.' In this context, the idiom most plausibly refers to the snake charmer, the one skilled in spoken charm or incantation. Rendering it idiomatically avoids misleading readers into taking 'tongue' as ordinary speech alone, while preserving the proverb's point.
