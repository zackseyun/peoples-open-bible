  category: meaning_retranslation
  from: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
  to: He must live in that city until he appears before the assembly for judgment[a], and must remain there until the high priest serving at that time dies. Then the one who killed may return to his own city and home—to the city from which he fled.’”
  rationale: The lexical decisions rightly identify the serving high priest and understand 'may return' as legal permission; both gains remain. I clarify the compressed residence provisions in light of Numbers 35 without adding an explanation of why the high priest's death ends the restriction.
