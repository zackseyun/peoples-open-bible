  from: But Jesus, knowing this, said, “Why are you discussing among yourselves, you of little faith, that you did not bring bread[a]?”
  to: Aware of this, Jesus said, “You of little faith, why are you discussing among yourselves your failure to bring bread?
  rationale: The later source audit correctly restored 'did not bring bread' rather than 'have no bread,' preserving the link with verses 5 and 7. I retain that correction while making the question and its direct address natural in English.
