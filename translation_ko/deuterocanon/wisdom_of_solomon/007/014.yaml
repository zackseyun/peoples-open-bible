  text: For it is an unfailing treasure for men; those who have made use of it gained friendship with God, having been commended through the gifts that come from instruction.
translation:
  language: ko
  text: 그것은 사람들에게 다함이 없는 보물이기 때문입니다. 그것을 사용한 이들은 하나님과의 우정을 얻었고, 교육에서 오는 선물들을 통하여 인정받았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεκλιπὴς γὰρ θησαυρός
  english_pob_choice: unfailing treasure
  chosen_korean: 없어지지 않는 보물
  alternatives_korean:
  - 다함이 없는 보물
  - 끊이지 않는 보물
  - 불멸의 보물
  lexicon: ἀνεκλιπής, θησαυρός
  rationale: ἀνεκλιπής는 ‘결핍이 없는/끝나지 않는’ 성격을 가리키므로, 소유물의 가치와 지속성을 드러내는 ‘없어지지 않는’으로 옮겼습니다. ‘보물’은 θησαυρός의 기본 의미를 직접 살립니다.
- source_word: πρὸς θεὸν ἐστείλαντο φιλίαν
  english_pob_choice: gained friendship with God
  chosen_korean: 하나님과의 우정을 얻었고
  alternatives_korean:
  - 하나님과 우정을 맺었고
  - 하나님과의 친밀함을 얻었고
  - 하나님과 친구가 되었고
  lexicon: φιλία, ἐστείλαντο
  rationale: φιλία는 단순한 호의가 아니라 ‘우정/친분’을 뜻하므로, 전통적 신학어인 ‘친밀함’보다 직접적인 ‘우정’을 택했습니다. ἐστείλαντο는 결과 획득을 나타내어 ‘얻었습니다’로 처리했습니다.
- source_word: διὰ τὰς ἐκ παιδείας δωρεὰς
  english_pob_choice: through the gifts that come from instruction
  chosen_korean: 교육을 통해 주어지는 선물들로 인해
  alternatives_korean:
  - 훈련에서 비롯된 선물들로 인해
  - 교훈에서 나온 선물들을 통해
  - 훈육으로부터 오는 선물들로 인해
  lexicon: παιδεία, δωρεά
  rationale: παιδεία는 단순 지식 전달보다 ‘교육/훈육/훈련’의 넓은 뜻이 있어, 현대 한국어에서 의미를 넓게 담는 ‘교육’을 기본으로 두었습니다. δωρεά는 은혜로운 ‘선물’이므로 그대로 살렸습니다.
- source_word: συσταθέντες
  english_pob_choice: having been commended
  chosen_korean: 인정받았습니다
  alternatives_korean:
  - 추천받았습니다
  - 칭찬받았습니다
  - 증언받았습니다
  lexicon: συνίστημι
  rationale: συσταθέντες는 ‘추천되다/인정되다/드러나다’의 결과를 나타내므로, 수동적 평가를 반영하는 ‘인정받았습니다’로 옮겼습니다.
theological_decisions:
- issue: φιλία πρὸς θεόν의 신학적 뉘앙스
  chosen_reading: 하나님과의 우정이라는 직접적 표현을 유지했습니다.
  alternative_readings:
  - 하나님과의 친밀함
  - 하나님과의 화해
  rationale: 본문은 단순한 관계 개선을 넘어서 지혜를 통해 성립하는 ‘우정’을 말하므로, 이를 신학적으로 완화하지 않고 유지하는 것이 원문 의미에 가깝습니다.
  doctrine_reference: 지혜서의 지혜-관계 언어; 약 2:23의 아브라함의 ‘하나님의 벗’ 전통과도 공명함
