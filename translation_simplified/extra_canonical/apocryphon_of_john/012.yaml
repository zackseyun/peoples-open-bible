translation:
  language: en
  text: '1. I asked, “Lord, what does ‘she moved back and forth’ mean?” He grinned and answered, “Do not think this is the same as what Moses said about being ‘above the waters.’ No!


    2. She had seen the evil that had happened and the theft her son had committed. So she reoriented[r1]. Forgetfulness overwhelmed her in the darkness of ignorance, and she became ashamed. [She did not dare] to return, but [continued moving] about.


    3. This is what the movement means: “to go back and forth.” The proud one received power from his mother. In his ignorance, he thought that no one existed except her.


    4. But when he saw the great company of angels he had created, he raised himself above them.


    5. Then the mother realized that the garment of darkness was flawed. She understood that her companion had not agreed with her.


    6. She reoriented and wept bitterly. The entire Fullness[a] heard her prayer of reorientation, and they praised the unseen, virginal Spirit on her behalf.


    7. Then [he] agreed. When [the unseen Spirit] agreed, the holy Spirit poured out upon her from the entire Fullness. Her companion did not come to her by himself. He came through the Fullness so that he could correct what she lacked. She was lifted up, but not to her own heavenly realm. She was placed above her son and would live in the Ninth[b] until she had corrected what she lacked.


    8. A voice also came from the high heavenly realm: “The Man exists, and so does the Son of Man.” Yaltabaoth, the chief ruler, heard it. He thought the voice came from his mother, but he did not know where it came from.


    9. He also taught them about the sacred and perfect Mother-Father: the perfect Providence, the image of the unseen one, the Father of All, through whom everything came into being, and the Primal Man, because he made his likeness manifest in male form.


    10. Then the chief ruler’s entire realm shook, and the foundations of the abyss moved. The appearance of this revealed image lit up the bottom of the waters above the material world. When the chief ruler and all the other rulers looked, they saw the whole region beneath them filled with light.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fullness” is the complete heavenly divine realm and its inhabitants.
    reason: cultural_note
  - marker: b
    text: “The Ninth” refers to a heavenly level above her son’s realm.
    reason: cultural_note
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
