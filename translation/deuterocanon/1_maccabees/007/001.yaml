translation:
  text: In the one hundred fifty-first year[a] of the Seleucid era[b], Demetrius son of Seleucus left Rome and came with a few men to a city by the sea, where he became king.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The supplied Greek text reads “the fifty-first year”; the usual Greek reading and the narrative chronology give “the one hundred fifty-first year.”
    reason: textual_variant
  - marker: b
    text: About 162–161 BC; the book dates events by the Seleucid era.
    reason: cultural_note
lexical_decisions:
- source_word: Ἔτους ἑνὸς καὶ πεντηκοστοῦ
  chosen: In the one hundred fifty-first year
  alternatives:
  - In year one hundred fifty-one
  - In the hundred and fifty-first year
  lexicon: LSJ
  rationale: The genitive absolute-like dating formula introduces the time reference. English idiom is best served by 'In the one hundred fifty-first year,' preserving the chronological notice without awkward literalism.
- source_word: ἐξῆλθεν
  chosen: went out
  alternatives:
  - departed
  - came out
  lexicon: LSJ
  rationale: A straightforward rendering of the aorist of ἐξέρχομαι. 'Went out' preserves the movement from Rome without adding interpretive nuance such as 'escaped' or overly polished 'departed.'
- source_word: Δημήτριος ὁ τοῦ Σελεύκου
  chosen: Demetrius son of Seleucus
  alternatives:
  - Demetrius, the son of Seleucus
  - Demetrius of Seleucus
  lexicon: LSJ
  rationale: The article plus genitive patronymic is naturally rendered in English as 'son of Seleucus.' This makes the relationship explicit and readable.
- source_word: ἀνέβη
  lemma: ἀναβαίνω
  chosen: went up
  alternatives:
  - came up
  - ascended
  lexicon: LSJ
  rationale: The common narrative verb ἀναβαίνω is retained as 'went up.' Although the destination is coastal, Greek narrative often uses 'go up' idiomatically for travel inland or to a place of significance; preserving it avoids over-interpretation.
- source_word: σὺν ἀνδράσιν ὀλίγοις
  chosen: with a few men
  alternatives:
  - accompanied by a few men
  - with few men
  lexicon: LSJ
  rationale: This is a simple accompaniment phrase. 'With a few men' is natural English and preserves the small size of his company.
- source_word: εἰς πόλιν παραθαλασσίαν
  chosen: to a city by the sea
  alternatives:
  - to a coastal city
  - to a seaside city
  lexicon: LSJ
  rationale: παραθαλάσσιος means 'by the sea' or 'coastal.' 'City by the sea' is transparent and slightly more formal than 'coastal city,' while remaining natural.
- source_word: ἐβασίλευσεν
  chosen: reigned there
  alternatives:
  - became king there
  - ruled there
  lexicon: LSJ
  rationale: The verb can mean 'became king' or 'reigned/ruled as king' depending on context. Here the narrative reports his assumption of kingship after arrival, and 'reigned there' preserves the royal sense without over-specifying enthronement mechanics.
