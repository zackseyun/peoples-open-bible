  source_fidelity: 개정이 필요합니다. 현행 ‘이스라엘을 그들의 돌보심 가운데서’는 αὐτῶν을 이스라엘의 주관적 소유처럼 읽히게 하며, 하나님이 이스라엘을 찾아보시는 행위라는 목적격 관계를 분명히 하지 못합니다. 또한 ἐν τῇ ἐπισκοπῇ의 의미를 ‘돌보심’으로만 좁힙니다. ‘이스라엘을 찾아보심으로’는 명사적 표현을 유지하면서 하나님의 이스라엘을 향한 방문/돌보심이라는 방향을 자연스럽게 드러냅니다.
  naturalness: ‘복음 전하는 이’는 후대의 전문적 기독교 용어를 불필요하게 불러올 수 있으므로 ‘기쁜 소식을 전하는 이’가 εὐαγγελιζομένου에 더 중립적이고 자연스럽습니다. ‘소리를 … 선포하십시오’는 문어적이지만 공적 선포라는 원문의 명령과 음성 이미지를 함께 보존하는 현대 격식체 표현입니다.
  terminology: κῆρυξατε는 ‘선포하십시오’, φωνὴν은 ‘소리’, εὐαγγελιζομένου는 ‘기쁜 소식을 전하는 이’, ἐπισκοπῇ는 본문에서 ‘찾아보심’으로 옮깁니다. ‘긍휼을 베푸셨기’는 ἠλέησεν의 자비 행위를 자연스럽게 나타냅니다.
