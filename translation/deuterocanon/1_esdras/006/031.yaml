translation:
  text: And issue an order that if anyone transgresses any part of what has been written and nullifies it, a beam shall be
    taken from his own property and he shall be hanged on it[a], and his possessions shall become royal property.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'suspended on it'; 'impaled' is a possible contextual interpretation. The Greek hang/suspend wording does not
      specify the precise method.
    reason: lexical_alternative
lexical_decisions:
- source_word: προστάξαι
  chosen: issue an order
  alternatives:
  - command
  - decree
  lexicon: LSJ
  rationale: The infinitive continues the administrative/jussive sequence and refers to an official royal directive. 'Issue
    an order' is natural modern English while preserving the formal governmental sense.
- source_word: παραβῶσίν
  chosen: transgresses
  alternatives:
  - violates
  - oversteps
  lexicon: LSJ
  rationale: The verb denotes violating or going beyond what is prescribed. 'Transgresses' preserves the legal force better
    than a weaker 'disobeys,' though 'violates' is also possible.
- source_word: τι τῶν γεγραμμένων
  chosen: any part of what has been written
  alternatives:
  - anything written here
  - any of the written provisions
  lexicon: LSJ
  rationale: τι with the genitive plural naturally means 'anything/any part of the things written.' The rendering makes explicit
    that the reference is to the written decree without over-specifying beyond the Greek.
- source_word: ἀκυρώσωσιν
  chosen: nullifies it
  alternatives:
  - sets it aside
  - invalidates it
  lexicon: LSJ
  rationale: The verb expresses invalidation or cancellation. Match the existing main 'nullifies it', retaining the other
    legal renderings as alternatives.
- source_word: λημφθῆναι ξύλον
  chosen: a beam shall be taken
  alternatives:
  - wood shall be taken
  - a timber shall be taken
  lexicon: LSJ
  rationale: ξύλον can denote wood, timber or a beam. Retain beam in this punitive property context without claiming verification
    of a separate parallel.
- source_word: ἐκ τῶν ἰδίων αὐτοῦ
  chosen: from his own property
  alternatives:
  - from what is his own
  - from his own house
  lexicon: LSJ
  rationale: The Greek phrase broadly denotes what belongs to him. The existing main property wording is retained; the more
    specific house alternative is not established by this repair.
- source_word: κρεμασθῆναι
  chosen: he shall be hanged
  alternatives:
  - he shall be impaled
  - he shall be suspended
  lexicon: LSJ
  rationale: The Greek verb denotes hanging or suspension. Retain the main hanged wording; impaled is a possible contextual
    interpretation, not a method specified by this verb or newly established here.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  chosen: his possessions
  alternatives:
  - his property
  - his goods
  lexicon: LSJ
  rationale: The phrase refers to what belongs to him materially. 'Possessions' is clear modern English and broad enough to
    include all assets.
- source_word: βασιλικά
  chosen: royal property
  alternatives:
  - forfeit to the crown
  - belonging to the king
  lexicon: LSJ
  rationale: The adjective means belonging to the king/royal domain. 'Royal property' preserves the formal legal result of
    confiscation.
