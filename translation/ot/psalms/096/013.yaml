  from: before Yahweh[a], for he is coming, for he is coming to judge the earth. He will judge the world with righteousness[b][c], and the peoples with his faithfulness.
  to: before Yahweh, for he is coming, for he is coming[a] to judge the earth. He will judge the world with righteousness, and the peoples[b] with his faithfulness[c].
  rationale: The verse translation is defensible and retains the emphatic repetition of בָא, the universal scope of earth/world/peoples, and the judicial language. The present apparatus attaches every note to an unrelated expression. The proposed placement correctly links the coming alternative to the repeated verb, “nations” to peoples, and “truth” to faithfulness. Resequencing the notes is editorially necessary and does not introduce interpretation.
