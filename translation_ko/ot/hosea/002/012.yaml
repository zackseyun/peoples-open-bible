  text: וְ/עַתָּ֛ה אֲגַלֶּ֥ה אֶת נַבְלֻתָ֖/הּ לְ/עֵינֵ֣י מְאַהֲבֶ֑י/הָ וְ/אִ֖ישׁ לֹֽא יַצִּילֶ֥/נָּה מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/012.yaml
  text: And now I will uncover her nakedness before the eyes of her lovers, and no man will rescue her from my hand.
translation:
  language: ko
  text: 이제 내가 그녀의 연인들 앞에서 그녀의 알몸을 드러내겠습니다. 아무도 내 손에서 그녀를 건져 내지 못할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲגַלֶּה
  english_pob_choice: I will uncover
  chosen_korean: 드러내겠습니다
  alternatives_korean:
  - 벗기겠습니다
  - 폭로하겠습니다
  lexicon: גלה
  rationale: 몸의 수치를 공개적으로 드러내는 뜻을 살려 ‘드러내다’로 옮겼습니다. ‘폭로하다’는 정보 공개처럼 들려 신체적 이미지가 약해집니다.
- source_word: נַבְלֻתָהּ
  english_pob_choice: her nakedness
  chosen_korean: 그의 알몸
  alternatives_korean:
  - 그녀의 벌거벗음
  - 그녀의 수치
  lexicon: nbl
  rationale: 문맥상 노출된 몸을 가리키므로 직역에 가까운 ‘알몸’을 택했습니다. ‘수치’는 해석을 강하게 덧붙일 수 있어 본문 이미지가 약해집니다.
- source_word: מְאַהֲבֶיהָ
  english_pob_choice: her lovers
  chosen_korean: 그의 연인들
  alternatives_korean:
  - 그의 사랑하는 이들
  - 그의 애인들
  lexicon: אהב
  rationale: 호세아서의 우상적·배교적 애정 대상을 나타내는 말로, POB의 ‘lovers’에 맞춰 ‘연인들’로 옮겼습니다. ‘애인들’은 현대 구어 느낌이 더 강합니다.
- source_word: אִישׁ לֹא יַצִּילֶנָּה
  english_pob_choice: no man will rescue her
  chosen_korean: 아무도 … 건져내지 못할 것입니다
  alternatives_korean:
  - 아무 남자도 … 구해내지 못할 것입니다
  - 어떤 사람도 … 구해내지 못할 것입니다
  lexicon: איש / נצל
  rationale: 영문 POB의 ‘no man’을 그대로 성별 특정으로 옮기기보다, 한국어에서는 자연스럽고 넓은 의미의 ‘아무도’로 처리하되 ‘건져내다’로 구출 이미지와 손의 은유를 살렸습니다.
theological_decisions:
- issue: ‘no man’의 성별 특정성
  chosen_reading: 본문의 대조점은 구원 불가능성이지 남성 일반의 부재가 아니므로, 한국어에서는 ‘아무도’로 의미를 전달했습니다.
  alternative_readings:
  - 아무 남자도
  - 어떤 사람도
  rationale: 히브리어 이יש는 종종 ‘사람/누구’의 일반적 용법을 가지며, 이 절의 핵심은 야훼의 심판 아래서 도움받지 못함입니다.
  doctrine_reference: 문맥 우선의 번역 원리
- issue: 신체 노출 표현의 직설성
  chosen_reading: ‘알몸을 드러내다’라는 직설 표현을 유지해 심판의 수치와 공개성을 보존했습니다.
  alternative_readings:
  - 수치를 드러내다
  - 벌거벗은 모습을 보이다
  rationale: 본문의 충격과 공개적 수치를 완화하지 않는 것이 호세아서의 예언적 수사에 더 충실합니다.
  doctrine_reference: 예언문학의 심판 이미지
