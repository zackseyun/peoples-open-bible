translation:
  text: But your holy ones had abundant light. The Egyptians heard their voices but could not see them; though your holy ones too had suffered, the Egyptians counted them blessed[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, the difficult final clause has been understood as saying that the Egyptians counted the holy ones blessed because they had not suffered as the Egyptians had.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ... ὁσίοις σου
  chosen: for your holy ones
  alternatives:
  - for your saints
  - for your faithful ones
  lexicon: LSJ
  rationale: ὅσιος denotes those who are devout/holy in relation to God. 'Holy ones' preserves the covenantal-religious sense without importing later ecclesiastical overtones that 'saints' may carry.
- source_word: μέγιστον ... φῶς
  chosen: very great light
  alternatives:
  - greatest light
  - a most great light
  lexicon: LSJ
  rationale: μέγιστον is the superlative of μέγας. In idiomatic English, 'very great light' communicates the force naturally while remaining close to the Greek.
- source_word: φωνὴν
  chosen: voice
  alternatives:
  - sound
  lexicon: LSJ
  rationale: φωνή can mean sound or voice; here 'their voice' fits the personal reference and the contrast with unseen μορφή.
- source_word: μορφὴν
  chosen: form
  alternatives:
  - appearance
  - shape
  lexicon: LSJ
  rationale: μορφή refers to visible form/appearance. 'Form' keeps the contrast with hearing but not seeing and avoids over-specifying physical features.
- source_word: ἐπεπώθεισαν
  chosen: had suffered the same things
  alternatives:
  - had experienced the same things
  - had longed for them
  lexicon: LSJ
  rationale: Although ποθέω commonly means 'long for,' in this context the clause points to the Egyptians' recognition that the Israelites had undergone the plagues' effects or related hardships and were now to be congratulated. The contextual sense reflected in many interpreters is experiential rather than desiderative; 'had suffered the same things' best fits the logic leading to 'they counted them blessed.'
- source_word: ἐμακάριζον
  chosen: they counted them blessed
  alternatives:
  - they called them blessed
  - they congratulated them
  lexicon: LSJ
  rationale: μακαρίζω means to call or count blessed. 'Counted them blessed' is natural English and preserves the evaluative sense.
