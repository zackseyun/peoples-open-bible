  source_fidelity: 초안은 시편 9:6이 아니라 앞 절(시 9:5)의 ‘민족들을 꾸짖으셨고…’를 번역하고 있어, 제시된 히브리어 본문 및 영어 POB와 일치하지 않습니다. 본문은 원수의 영구한 황폐, 주께서 성읍들을 뿌리째 제거하심, 그리고 그들에 관한 기억의 소멸을 말합니다. 첫 구절은 ‘원수는’으로 읽을 수 있으나 직접 호격으로도 분석될 수 있으므로 각주로 보존했습니다.
  naturalness: ‘원수는 영원히 황폐해져 끝났고’는 현대 한국어에서 다소 어색하므로, 명사구와 완료 표현을 자연스럽게 연결하여 ‘원수는 영원한 폐허가 되어 끝났습니다’로 옮겼습니다. ‘성읍’은 시편의 격조를 유지하면서도 표준적인 문어 표현이며, 전체를 합쇼체로 일관되게 처리했습니다.
  terminology: נתשׁ의 뿌리째 뽑아 제거하는 이미지는 ‘뿌리째 뽑으셨고’로 살렸습니다. זכרם은 단순한 개인의 이름이 아니라 그들에 대한 기억을 가리키므로 ‘그들에 대한 기억’으로 번역했습니다. 마지막 독립대명사의 강조는 ‘그 기억마저’로 반영했습니다.
