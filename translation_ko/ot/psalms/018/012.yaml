- from: 주께서 어둠을 자기의 숨는 곳으로 삼으시고, 주위에는 자기의 초막으로 삼으셨습니다—물의 어둠, 하늘의 짙은 구름입니다.[a][b][c]
  to: 그 앞의 광채로 말미암아 그의 짙은 구름들이 지나갔습니다—우박과 불의 숯불도 그러했습니다.[a]
  rationale: 제시된 WLC 본문을 처음부터 번역했습니다. מִנֹּגַהּ נֶגְדּוֹ는 ‘그 앞의 광채로 말미암아’, עָבָיו עָבְרוּ는 ‘그의 짙은 구름들이 지나갔습니다’로 옮겼습니다. 마지막 명사 병렬은 한국어의 자연스러운 완결성을 위해 ‘도 그러했습니다’로 최소 보완했으며, 원문의 동사 생략과 그에 따른 시적 여지를 각주에 보존했습니다.
