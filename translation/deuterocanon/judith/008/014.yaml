  from: For you will not find the depths of a man's heart[a], nor will you discern the words of his mind. So how will you search out God, who made all these things, and know his mind, and understand his thought? By no means, brothers[b], provoke the Lord our God.
  to: For you cannot fathom the depths of a person's heart or discern their thoughts. How then can you fathom God, who made all these things, know his mind, and understand his purposes? No, brothers, do not provoke the Lord our God to anger.
  rationale: The recorded decisions rightly preserve the heart’s depths and distinguish God’s mind from his thought or purpose. I retain those distinctions while replacing source-shaped expressions and correcting the unclear prohibition; the inclusive-address note is unnecessary because Judith is addressing the male rulers.
