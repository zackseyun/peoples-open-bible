    lexicon: Dillmann
    rationale: Functions as a narrative transition introducing the next divine action. 'Then' preserves the sequence without
      over-specifying temporal nuance.
  - source_word: ልዑል
    chosen: the Most High
    alternatives:
    - the Exalted One
    - the العليا/High One
    lexicon: Dillmann
    rationale: A standard divine title meaning 'high' or 'most high.' 'The Most High' is idiomatic English and preserves the
      elevated apocalyptic register.
  - source_word: ዓቢይ
    chosen: the Great
    alternatives:
    - great
    lexicon: Dillmann
    rationale: Used as a divine epithet paired with 'Holy.' Retaining it as a title preserves the solemn stacked description
      of God.
  - source_word: ቅዱስ
    chosen: Holy One
    alternatives:
    - holy
    - the Holy One
    lexicon: Dillmann
    rationale: Rendered substantivally because it stands in apposition with the divine titles. 'Holy One' preserves the title-like
      force better than a bare adjective.
  - source_word: ተናገረ
    chosen: spoke
    alternatives:
    - said
    - uttered
    lexicon: Dillmann
    rationale: A straightforward speech verb. 'Spoke' fits the elevated narrative style and pairs naturally with the following
      commission.
  - source_word: ወፈነወ
    chosen: sent
    alternatives:
    - dispatched
    lexicon: Dillmann
    rationale: The verb marks commissioning. 'Sent' is simple and formal enough for angelic mission language.
  - source_word: አሰርየ፡ ልዩር
