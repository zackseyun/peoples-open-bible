  from: Whoever rebukes a man will afterward find favor[a], more than one who flatters with the tongue.
  to: Whoever rebukes a man will afterward find more favor than a flatterer.
  rationale: The comparative must modify “favor,” not remain detached at the end of the clause. “A flatterer” naturally conveys the participial phrase מַחֲלִיק לָשׁוֹן. The proposed “with his tongue” is not needed, adds a masculine possessive not expressed by the Hebrew phrase, and is less concise English.
