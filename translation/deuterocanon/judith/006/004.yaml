  meaning: Holofernes threatens Israel with fiery destruction and overwhelming bloodshed, invoking Nebuchadnezzar’s authority as a guarantee that nothing will survive.
  meaning_decisions:
  - source_phrase: τὰ ὅρια αὐτῶν
    prior_rendering: their borders
    new_rendering: their territory
    rationale: The threatened bloodshed saturates their land, not merely its boundary lines; ὅρια can designate the territory within those boundaries.
  - source_phrase: μεθυσθήσεται ἐν τῷ αἵματι αὐτῶν
    prior_rendering: will be drenched with their blood
    new_rendering: will be drunk with their blood
    rationale: The grotesque image of intoxication contributes to the boast’s excessive violence and remains intelligible in dignified English.
  - source_phrase: οὐκ ἀντιστήσεται τὸ ἴχνος τῶν ποδῶν αὐτῶν κατὰ πρόσωπον ἡμῶν
    prior_rendering: The trace of their feet will not stand before us
    new_rendering: Not even their footprints will survive our advance
    rationale: The current wording leaves the image obscure; the new wording retains the footprints while expressing the threat that even traces of Israel will be obliterated.
  - source_phrase: εἶπεν γάρ· οὐ ματαιωθήσεται τὰ ῥήματα τῶν λόγων αὐτοῦ
    prior_rendering: For he said, ‘The words of his mouth will not prove empty.’
    new_rendering: For he has declared that his words will not prove empty
    rationale: Indirect speech carries the third-person reference naturally, and “his words” expresses the emphatic repetition without introducing a mouth that the Greek does not mention.
