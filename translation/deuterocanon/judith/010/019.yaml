  rationale: Following the project's gender-accurate principle, the masculine idiom is preserved rather than neutralized, while still recognizing that it refers collectively to Israel.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: Gendered singular in military statement
  chosen_reading: even one man
  alternative_readings:
