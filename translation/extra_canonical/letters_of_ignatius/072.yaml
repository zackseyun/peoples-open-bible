translation:
  text: 'I therefore did my part, as a man committed to unity. But where there is division and anger, God does not dwell. Now the Lord forgives everyone when they reorient[r1], if in reorientation they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who will strike off every fetter from you; and I urge you,


    Do nothing in a spirit of faction, but according to the teaching of Christ. For I heard certain people saying, “If I do not find it in the charters, I do not believe it in the Gospel.” And when I said to them, “It is written,” they answered me, “That is the question.” But for me, my charter is Jesus Christ; the inviolable charter is his cross, his death, his resurrection, and faith through him. In these I desire to be justified through your prayers.'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - Provisional rendering based on the supplied public-domain English witness.
  - “Charter” and “charters” are retained to preserve the witness’s repeated image.
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation. This reader text adapts the recorded English translation witness; it is not a verbatim quotation or a newly verified translation of the ancient-language text. The source witness is unchanged.
    reason: lexical_alternative
