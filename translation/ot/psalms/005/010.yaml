id: PSA.5.10
reference: Psalms 5:10
source:
  edition: WLC
  text: הַֽאֲשִׁימֵ֨/ם אֱֽלֹהִ֗ים יִפְּלוּ֮ מִֽ/מֹּעֲצ֪וֹתֵ֫י/הֶ֥ם בְּ/רֹ֣ב פִּ֭שְׁעֵי/הֶם הַדִּיחֵ֑/מוֹ כִּי מָ֥רוּ בָֽ/ךְ׀־׃
translation:
  text: Condemn them, O God; let their own plans bring them down. Drive them away because of their many transgressions, for they have rebelled against you.
  philosophy: dynamic
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  chosen: Hold them guilty
  alternatives:
  - Hold them guilty
  - Condemn them
  lexicon: HALOT
  rationale: The Hiphil imperative asks God to regard or treat them as guilty; this avoids limiting the request to a verbal declaration.
- source_word: אֱלֹהִים
  chosen: O God
  lexicon: HALOT
  rationale: Direct address in prayer; vocative sense is natural in context.
- source_word: יִפְּלוּ
  chosen: let them fall
  alternatives:
  - may they fall
  lexicon: HALOT
  rationale: Jussive-like imperfect in an imprecatory petition; 'let them fall' is idiomatic English for the psalmist's appeal.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  chosen: by their own plans
  alternatives:
  - from their schemes
  - because of their plans
  lexicon: HALOT
  rationale: The מן phrase may mark the means/source, and possibly cause, of their fall. “By” retains the contextual sense that their own schemes bring about their downfall.
- source_word: בְּרֹב פִּשְׁעֵיהֶם
  chosen: because of their many transgressions
  alternatives:
  - for the abundance of their rebellions
  - in the multitude of their transgressions
  lexicon: HALOT
  rationale: ב with רֹב gives a causal sense here. פֶּשַׁע denotes transgression/rebellion; 'many transgressions' is clear modern English while retaining moral weight.
- source_word: הַדִּיחֵמוֹ
  chosen: Drive them away
  alternatives:
  - cast them out
  - banish them
  lexicon: HALOT
  rationale: Hiphil imperative of נדח conveys causing someone to be driven away or cast out. 'Drive them away' is forceful and readable, fitting the judicial-imprecatory context.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  lexicon: HALOT
  rationale: Introduces the ground for the petition. 'For' fits the poetic line and links the reason naturally.
- source_word: מָרוּ בָךְ
  chosen: they have rebelled against you
  alternatives:
  - they have been rebellious toward you
  lexicon: HALOT
  rationale: מרה with ב marks rebellion against God. 'Rebelled against you' is the most direct and idiomatic rendering.
