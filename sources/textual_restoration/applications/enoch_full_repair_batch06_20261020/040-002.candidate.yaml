translation:
  text: 'I saw—at the four wings of the Lord of Spirits I saw four other faces,[a] different from those who do not
    sleep. I learned their names: the angel who came with me and showed me all the hidden things made their names
    known to me.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The concrete word is “wings,” which can also refer to extremities or sides. “Faces” is retained as the
      visionary description rather than silently replaced with “beings.” The repeated “I saw” follows the selected
      text; Charles notes that some witnesses attach the opening occurrence to the preceding sentence.
    reason: lexical_alternative
