  meaning: Levi’s participation in Abraham’s payment is explained by his being Abraham’s future descendant when Abraham met Melchizedek.
  meaning_decisions:
  - source_phrase: ἐν τῇ ὀσφύϊ τοῦ πατρὸς
    prior_rendering: in the loins of his father
    new_rendering: in his ancestor’s loins
    rationale: “Father” here denotes a forefather, not Levi’s immediate father; “ancestor” makes that relationship accurate for modern readers while retaining the bodily image.
  - source_phrase: ἦν ὅτε συνήντησεν αὐτῷ Μελχισέδεκ
    prior_rendering: he was ... when Melchizedek met him
    new_rendering: when Melchizedek met Abraham, Levi was
    rationale: Naming both people and reordering the clause prevents the pronouns from suggesting that Melchizedek met Levi.
