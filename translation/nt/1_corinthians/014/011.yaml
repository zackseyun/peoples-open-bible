id: 1CO.14.11
reference: 1 Corinthians 14:11
source:
  edition: SBLGNT
  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
translation:
  text: Therefore, if I do not understand the language, I will be a foreigner[a] to the speaker, and the speaker will be a foreigner to me.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'a barbarian'; here this means someone whose speech is foreign or unintelligible, not someone uncivilized.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  chosen: Therefore, if
  alternatives:
  - So if
  - If then
  lexicon: BDAG
  rationale: Combines the inferential οὖν with the conditional ἐὰν in natural English while preserving Paul's logical flow from the preceding illustrations.
- source_word: μὴ εἰδῶ
  chosen: I do not know
  alternatives:
  - I do not understand
  lexicon: BDAG
  rationale: οἶδα is fundamentally 'know.' 'Understand' is contextually possible, but 'know' better preserves the lexical sense while still making sense in context.
- source_word: τὴν δύναμιν
  chosen: the meaning
  alternatives:
  - the force
  - the significance
  - the power
  lexicon: BDAG
  rationale: δύναμις literally means 'power' or 'force,' but in the idiom 'the δύναμις of the voice/sound' it refers to the sense or significance conveyed. 'Meaning' best communicates the intended point in readable English.
- source_word: τῆς φωνῆς
  chosen: of the sound
  alternatives:
  - of the voice
  - of the language
  lexicon: BDAG
  rationale: φωνή can mean 'sound' or 'voice.' In this context Paul is speaking broadly about intelligible utterance, and 'sound' fits the immediate analogy while avoiding over-specification. 'Language' is interpretive and better left as an alternative.
- source_word: ἔσομαι
  chosen: I will be
  alternatives:
  - I shall be
  lexicon: BDAG
  rationale: Straightforward future of εἰμί; rendered in standard modern English.
- source_word: τῷ λαλοῦντι
  chosen: to the one speaking
  alternatives:
  - to the speaker
  - to the one who speaks
  lexicon: BDAG
  rationale: Retains the participial force without unnecessary stiffness. 'The one speaking' is transparent and close to the Greek.
- source_word: βάρβαρος
  chosen: a foreigner
  alternatives:
  - a barbarian
  - one who speaks a foreign language
  lexicon: BDAG
  rationale: In this context βάρβαρος refers to someone linguistically unintelligible or foreign, not primarily to a savage person in the later pejorative English sense of 'barbarian.' 'Foreigner' best conveys the relational and linguistic distance intended.
- source_word: ἐν ἐμοὶ
  chosen: to me
  alternatives:
  - in my view
  - with me
  lexicon: BDAG
  rationale: Here ἐν with ἐμοί functions idiomatically to express relation from the speaker's standpoint. 'To me' is the most natural English equivalent in this reciprocal construction.
