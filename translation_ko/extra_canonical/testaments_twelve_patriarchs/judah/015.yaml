review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 1절 γυμνούμενος는 ‘파멸당하다’보다 ‘벌거벗겨지다/발가벗겨지다’라는 노출·박탈의 이미지가 직접적입니다. 2절은 왕권 상실의 이유를 음행에 예속된 상태로 제시하며, 5절의 ἀνδρός는 ‘힘센 사람’이 아니라 ‘남자/사람의 힘’입니다. 현 그리스어 본문은 5절의 진술을 갖추어 전하므로, OCR 절단을 전제한 각주는 유지할 근거가 없습니다.
  naturalness: 합쇼체 문체는 대체로 적절하나, ‘왕권에서 벗겨지고’는 한국어 관용상 어색하여 ‘왕권을 빼앗기고’가 자연스럽습니다. 또한 ‘회개한 뒤에도’의 ‘에도’는 원문에 없는 양보를 더하므로 삭제해야 합니다. 포도주는 ‘마시다’로, 고기는 ‘먹다’로 병렬하는 것이 자연스럽습니다.
  terminology: ‘음행’, ‘왕권’, ‘띠’, ‘관’, ‘회개’는 문맥에 맞습니다. στήριγμα는 양쪽 용례에서 ‘버팀목’으로 옮겨 지지·기반의 비유를 보존했습니다. 5절의 성별 일반화는 원문의 수사적 진술로 번역하되, 원문에 없는 ‘힘센’이라는 수식은 제거했습니다.
  issues:
  - severity: medium
    issue: 1절 ‘파멸당하는 중에도’
    rationale: γυμνούμενος는 ‘벌거벗겨지다, 벗김을 당하다’이며, ζημιόω(손해를 입다/파멸하다)가 아닙니다.
  - severity: medium
    issue: 2절 ‘왕권에서 벗겨지고’ 및 비교 구문의 처리
    rationale: γυμνοῦται τῆς βασιλείας는 왕권을 박탈당한다는 뜻이며, δουλεύσας τῇ πορνείᾳ는 음행에 예속됨을 나타냅니다. ‘그렇게 됩니다’는 원문의 구체성을 약화합니다.
  - severity: medium
    issue: 4절 ‘회개한 뒤에도’
    rationale: μετανοήσας는 시간적/상황적 분사로 ‘회개한 뒤’가 가능하지만, ‘에도’는 원문에 없는 양보 관계를 첨가합니다.
  - severity: medium
    issue: 5절 ‘힘센 사람’
    rationale: 그리스어 τοῦ ἀνδρός는 ‘남자의/사람의’이며 ‘힘센’이라는 형용어가 없습니다.
  - severity: high
    issue: '[a][b] 각주 앵커의 무근거 및 각주 누락'
    rationale: 번역문에는 [a][b] 앵커가 있으나 대응 한국어 각주가 제공되지 않았습니다. 더구나 영어 감사기록의 OCR 절단 각주는 제시된 그리스어 본문이 5절 전체 내용을 포함하는 현 상황과 맞지 않습니다. 앵커와 해당 각주는 제거해야 합니다.
  revised_text: 1. 음행하는 사람은 발가벗겨져도 깨닫지 못하고, 수치를 당해도 부끄러워하지 않습니다. 2. 사람이 왕이라 해도 음행하면, 음행에 예속되어 나도 겪었던 것처럼 왕권을 빼앗깁니다. 3. 나는 내 지팡이, 곧 내 지파의 버팀목을 내어 주었고, 내 띠, 곧 내 힘을 내어 주었으며, 내 관, 곧 내 왕국의 영광을 내어 주었습니다. 4. 나는 이 일들을 두고 회개한 뒤, 늙을 때까지 포도주는 마시지 않고 고기는 먹지 않았으며, 어떤 기쁨도 보지 못했습니다. 5. 하나님의 천사가 내게 보여 주었습니다. 여자들은 왕과 가난한 사람을 지배하며, 왕에게서 영광을, 남자에게서 힘을, 가난한 사람에게서 가장 작은 버팀목마저 빼앗아 갑니다.
