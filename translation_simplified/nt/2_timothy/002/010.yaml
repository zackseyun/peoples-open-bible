translation:
  language: en
  text: That is why I endure everything for the sake of the elect.[a] I do this so that they too may receive the salvation found in Christ Jesus,[b] along with eternal glory.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “the chosen.”
    reason: lexical_alternative
  - marker: b
    text: The Greek title Christos means ‘Messiah’; here it appears in the conventional English personal-name form.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: For this reason I endure everything for the sake of the elect
  simplified_phrase: That is why I endure everything for the sake of the elect
  preserved_meaning: Paul’s endurance is grounded in the preceding context and benefits the elect.
  reasoning_layer_used: Lexical decisions for διὰ τοῦτο, πάντα, ὑπομένω, and διὰ τοὺς ἐκλεκτούς
  rationale: “That is why” states the causal link in direct, common English while retaining “the elect.”
- pob_phrase: so that they also may obtain
  simplified_phrase: I do this so that they too may receive
  preserved_meaning: Paul endures with the purpose that the elect may obtain salvation.
  reasoning_layer_used: Lexical decisions for ἵνα, καὶ αὐτοὶ, and σωτηρίας τύχωσιν
  rationale: A new sentence and “receive” make the purpose easier to follow without changing its goal.
- pob_phrase: the salvation that is in Messiah Jesus with eternal glory
  simplified_phrase: the salvation found in Messiah Jesus, along with eternal glory
  preserved_meaning: Salvation is located in Messiah Jesus and is accompanied by eternal glory.
  reasoning_layer_used: Lexical decisions for τῆς ἐν Χριστῷ Ἰησοῦ and μετὰ δόξης αἰωνίου, plus the regression fix
  rationale: “Found in” clarifies the dense modifier, while “along with” separates eternal glory as salvation’s accompaniment.
translation_notes:
  risk_flags:
  - risk: “Receive” may sound more passive than the POB’s “obtain.”
    mitigation: It remains within the documented sense of coming to possess salvation in the purpose clause.
  - risk: “Found in” may slightly soften Paul’s union or location language.
    mitigation: The wording retains “in Messiah Jesus” rather than replacing it with a causal paraphrase.
