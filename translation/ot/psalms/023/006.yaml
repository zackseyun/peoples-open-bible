id: PSA.23.6
reference: Psalms 23:6
source:
  edition: WLC
  text: אַ֤ךְ ט֤וֹב וָ/חֶ֣סֶד יִ֭רְדְּפוּ/נִי כָּל יְמֵ֣י חַיָּ֑/י וְ/שַׁבְתִּ֥י בְּ/בֵית יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־־׃
translation:
  text: Surely goodness and steadfast love will pursue me all the days of my life, and I will keep returning to the house of Yahweh[a] for years to come[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “and I will dwell in the house of Yahweh,” a longstanding alternative understanding.
    reason: alternative_reading
  - marker: b
    text: Literally, “for length of days”; also understood as “forever.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  chosen: Surely
  alternatives:
  - Only
  - Indeed
  - Surely
  lexicon: HALOT
  rationale: Here the particle introduces a confident affirmation rather than restriction; 'Surely' best captures the psalm's concluding certainty in natural English.
- source_word: טוֹב
  chosen: goodness
  alternatives:
  - good
  - prosperity
  - benefit
  lexicon: HALOT
  rationale: As an abstract noun-like adjective in parallel with חֶסֶד, it is best rendered 'goodness,' referring to God's beneficent care rather than merely generic 'good.'
- source_word: חֶסֶד
  chosen: steadfast love
  alternatives:
  - lovingkindness
  - mercy
  - covenant loyalty
  lexicon: HALOT
  rationale: '''Steadfast love'' is a well-established rendering that conveys loyal, enduring covenantal love without archaic diction. ''Mercy'' is too narrow, and ''covenant loyalty'' is more interpretive.'
- source_word: יִרְדְּפוּנִי
  chosen: will pursue me
  alternatives:
  - will follow me
  - will chase me
  lexicon: HALOT
  rationale: The verb literally means 'pursue/chase.' 'Pursue me' preserves the vivid reversal of hostile pursuit into benevolent pursuit better than the traditional but weaker 'follow me.'
- source_word: כָּל יְמֵי חַיָּי
  chosen: all the days of my life
  alternatives:
  - all my days
  - throughout my life
  lexicon: HALOT
  rationale: This is a natural, essentially formal rendering of the Hebrew idiom, preserving both temporal fullness and personal scope.
- source_word: וְשַׁבְתִּי
  chosen: and I will return
  alternatives:
  - I will return
  - I will sit
  lexicon: HALOT
  rationale: The Masoretic vocalization supports a form of שוב, “return”; “dwell” is an established alternative interpretation and belongs in a note.
- source_word: בְּבֵית יְהוָה
  chosen: to the house of Yahweh
  alternatives:
  - in the LORD's house
  lexicon: HALOT
  rationale: Following “return,” English idiom uses “to” for the destination, while retaining the concrete house imagery and the rendering Yahweh.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: לְאֹרֶךְ יָמִים
  chosen: for a long time
  alternatives:
  - forever
  - for many days
  - for a long time
  lexicon: HALOT
  rationale: The expression denotes extended duration. “For a long time” is idiomatic without imposing the more bounded sense of “the rest of my days.”
