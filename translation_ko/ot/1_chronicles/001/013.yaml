translation:
  language: ko
  text: 가나안은 맏아들 시돈과 헷을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헷’(히브리어 חֵת)은 여기서 민족명이라기보다 족보에 나오는 조상 이름입니다.
    reason: source_note
lexical_decisions:
- source_word: וּ/כְנַעַן
  english_pob_choice: And Canaan
  chosen_korean: 그리고 가나안
  alternatives_korean:
  - 가나안은
  - 그런데 가나안은
  lexicon: HALOT
  rationale: 계보 문맥의 연결 접속을 살리면서 고유명사 가나안을 표준 표기로 옮겼습니다.
- source_word: יָלַד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 출생시켰습니다
  lexicon: HALOT
  rationale: 남성 주어가 계보 안에서 자손을 두는 뜻이므로, 현대 한국어에서 자연스럽고 직설적인 ‘낳다’를 사용했습니다.
- source_word: בְּכֹר/וֹ
  english_pob_choice: his firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째 아들
  - 장자
  lexicon: HALOT
  rationale: ‘첫째’의 서열을 드러내되, 한국어 계보 표현에서 자연스러운 ‘맏아들’로 옮겼습니다.
- source_word: חֵת
  english_pob_choice: Heth
  chosen_korean: 히스
  alternatives_korean:
  - 헷
  - 히트
  lexicon: HALOT
  rationale: 본문의 히브리어 고유명사 חֵת을 개인 이름으로 읽어 표기했고, 민족명 ‘헷 사람들’로 풀지 않았습니다.
theological_decisions:
- issue: 계보 동사의 직역성
  chosen_reading: ‘낳았습니다’로 계보적 부자 관계를 직접 드러냈습니다.
  alternative_readings:
  - ‘아버지가 되었습니다’처럼 완곡하게 옮김
  - ‘생산했습니다’로 일반화
  rationale: 히브리어 יָלַד의 계보적 사용을 흐리지 않고, 독자가 혈통 계승을 즉시 이해하도록 했습니다.
  doctrine_reference: 창세기-역대기 계보 전승의 문자적 혈통 표지
- issue: חֵת의 인명성 보존
  chosen_reading: 히스를 민족칭이 아닌 인명으로 보았습니다.
  alternative_readings:
  - ‘헷 사람들’로 민족화
  - ‘히타이트’로 역사적 민족명화
  rationale: 영어 POB의 주석처럼 כאן은 민족 일반이 아니라 족보상의 선조 이름이므로, 본문 의미를 유지했습니다.
  doctrine_reference: 역대기 족보의 족장-민족 연계
