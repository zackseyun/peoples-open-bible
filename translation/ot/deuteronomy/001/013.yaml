  from: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
  to: Choose for yourselves wise, discerning men who are well known in your tribes, and I will appoint them as your leaders.’
  rationale: I followed the lexical record’s passive understanding of 'well-known' and its account of selection followed by appointment. The earlier leadership metaphor is translated by its ordinary administrative meaning.
