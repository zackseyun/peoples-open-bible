base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/013.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: Go and say to the men of Judah and to the inhabitants of Jerusalem, ‘Will you not receive instruction by listening to my words? declares the LORD.’'
translation:
  language: ko
  text: 이스라엘의 하나님, 만군의 야훼께서 이렇게 말씀하십니다. “가서 유다 사람들과 예루살렘 주민들에게 말하십시오. ‘너희가 내 말을 들음으로써 교훈을 받지 않겠느냐? 야훼의 말씀이다.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: the LORD of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주
  - 만군의 여호와
  lexicon: YHWH
  rationale: 군대적 권위를 드러내는 관용구는 한국어 성경의 ‘만군의’로 옮기되, YHWH는 프로젝트 기본어인 ‘야훼’를 사용했습니다.
- source_word: הָלֹךְ וְאָמַרְתָּ
  english_pob_choice: Go and say
  chosen_korean: 가서 말하여라
  alternatives_korean:
  - 가서 전하여라
  - 가서 말하시오
  lexicon: הלך / אמר
  rationale: 연속 명령의 기능을 살리면서도 한국어에서 자연스러운 지시문으로 ‘가서 말하여라’라고 옮겼습니다.
- source_word: מוּסָר
  english_pob_choice: instruction
  chosen_korean: 교훈
  alternatives_korean:
  - 훈계
  - 징계
  - 가르침
  lexicon: מוסר
  rationale: 여기서는 단순 정보가 아니라 권면·훈련의 의미가 있어, 전통적이지만 문맥상 무난한 ‘교훈’을 택했습니다.
- source_word: לִשְׁמֹעַ אֶל דְּבָרַי
  english_pob_choice: by listening to my words
  chosen_korean: 내 말을 들어 순종함으로
  alternatives_korean:
  - 내 말을 들음으로
  - 내 말을 청종함으로
  lexicon: שׁמע + דבר
  rationale: 단순 청취보다 순응의 뉘앙스가 강해, ‘듣다’와 ‘순종하다’를 결합해 청종의 의미를 드러냈습니다.
theological_decisions:
- issue: YHWH의 음역
  chosen_reading: 본문의 יהוה는 ‘야훼’로 일관해 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 원어 기반의 투명성을 유지하려는 POB 원칙을 따르며, 인용부의 동일 표기도 통일해 독자가 신명칭을 추적할 수 있게 했습니다.
  doctrine_reference: source transparency / tetragrammaton rendering
