id: PSA.26.2
reference: Psalms 26:2
source:
  edition: WLC
  text: בְּחָנֵ֣/נִי יְהוָ֣ה וְ/נַסֵּ֑/נִי צרופ/ה כִלְיוֹתַ֣/י וְ/לִבִּֽ/י׃
translation:
  text: Examine me, O Yahweh, and test me; refine my inmost being[a] and my heart.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'my kidneys,' understood as the seat of deep feelings and desires.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָנֵנִי
  chosen: Examine me
  alternatives:
  - Try me
  - Test me
  lexicon: HALOT
  rationale: The verb בחן commonly denotes examining or proving, often with the nuance of testing genuineness. 'Examine me' fits the first imperative well and preserves a distinction from the following נסה, avoiding unnecessary repetition in English while keeping the forensic/proving sense.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: וְנַסֵּנִי
  chosen: and test me
  alternatives:
  - and try me
  - and prove me
  lexicon: HALOT
  rationale: נסה overlaps with בחן but often emphasizes testing or proving through trial. Rendering it 'test me' preserves the parallelism while distinguishing it from 'Examine me' for בחן.
- source_word: צרופה
  lemma: צרף
  chosen: refine
  alternatives:
  - smelt
  - purify
  - assay
  lexicon: HALOT
  rationale: The verb צרף is a metallurgical term for refining or smelting. 'Refine' is the most natural modern English equivalent and preserves the imagery of purification by testing.
- source_word: כִלְיוֹתַי
  chosen: my kidneys
  alternatives:
  - my reins
  - my inmost being
  lexicon: HALOT
  rationale: The literal body-part image should remain in the text; the accompanying note supplies its idiomatic sense.
- source_word: וְלִבִּי
  chosen: and my heart
  alternatives:
  - and my mind
  lexicon: HALOT
  rationale: לֵב/לֵבָב commonly denotes the inner person, including thought and will. 'Heart' is the standard and sufficiently broad English rendering, especially in poetic parallelism with 'kidneys'.
