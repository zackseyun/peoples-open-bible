theological_decisions:
- issue: Rendering of the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Rendering of צְבָאוֹת
  chosen_reading: Armies
  alternative_readings:
  - Hosts
  rationale: The Hebrew title evokes heavenly and earthly armies. 'Armies' communicates the meaning more clearly to modern readers than the traditional but opaque 'Hosts.' This is a lexical-theological title choice, not a doctrinal alteration.
  doctrine_reference: DOCTRINE.md Translation philosophy §2, §6
