id: PSA.127.3
reference: Psalms 127:3
source:
  edition: WLC
  text: הִנֵּ֤ה נַחֲלַ֣ת יְהוָ֣ה בָּנִ֑ים שָׂ֝כָ֗ר פְּרִ֣י הַ/בָּֽטֶן׃
translation:
  text: Look, children are a heritage from Yahweh[a], the fruit of the womb a reward.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “children are Yahweh’s heritage.”
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  chosen: Look
  alternatives:
  - Look
  - Indeed
  lexicon: HALOT
  rationale: Natural contemporary equivalent for the discourse-attention force of הִנֵּה.
- source_word: נַחֲלַת יְהוָה
  chosen: a heritage from Yahweh
  alternatives:
  - the LORD's heritage
  - an inheritance from the LORD
  lexicon: HALOT
  rationale: The source reading is natural in context; the viable possessive construal remains in the note.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Follows the project's default rendering for the divine name, preserving reverential convention and alignment with the doctrine guidance on YHWH.
- source_word: בָּנִים
  chosen: children
  alternatives:
  - sons
  lexicon: HALOT
  rationale: Although the Hebrew form is morphologically masculine plural, in this context it refers generically to offspring rather than specifically male children. 'Children' best reflects the intended sense in natural English.
- source_word: שָׂכָר
  chosen: a reward
  alternatives:
  - wages
  - recompense
  lexicon: HALOT
  rationale: The noun often denotes wages or reward. Here it is metaphorical and positive, parallel to 'heritage'; 'reward' communicates the sense without implying a commercial transaction.
- source_word: פְּרִי הַבָּטֶן
  chosen: the fruit of the womb
  alternatives:
  - offspring
  - the womb's fruit
  lexicon: HALOT
  rationale: This is a conventional Hebrew expression for offspring. Retaining 'fruit of the womb' preserves the poetic imagery and intertextual resonance, while remaining understandable in English.
