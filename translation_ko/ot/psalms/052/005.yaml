  source_fidelity: 원문의 히브리어(אָהַבְתָּ כָל דִּבְרֵי בָלַע לְשׁוֹן מִרְמָה)는 ‘간사한 혀’를 향해 모든 파멸의 말을 사랑한다고 비난합니다. 현 초안은 시편 52:3에 해당하는 다른 히브리어 본문(악을 선보다, 거짓을 의를 말함보다)을 번역한 것으로, 지정된 절과 일치하지 않습니다.
