- from: 야훼께서 환난의 날에 당신에게 응답하시고, 야곱의 하나님의 이름이 당신을 높이 안전하게 두시기를 바랍니다.[a]
  to: 그분께서 성소[b]에서 당신에게 도움을 보내시고, 시온에서 당신을 붙들어 주시기를 바랍니다.[a]
  rationale: 제시된 WLC 본문에 맞추어 본문 전체를 교체했습니다. יִשְׁלַח과 יִסְעָדֶךָּ의 미완료형은 앞뒤 축원 문맥에 따라 ‘…하시기를 바랍니다’라는 기원으로 옮겼습니다. עֶזְרְךָ는 한국어 어순상 ‘당신에게 도움을’으로, מִקֹּדֶשׁ은 ‘성소에서’로, וּמִצִּיּוֹן은 ‘시온에서’로 번역했습니다. 영어 감사 기록의 두 어휘 대안에 맞추어, סעד의 대안은 [a], קֹדֶשׁ의 대안은 해당 어구의 [b]로 연결했습니다.
