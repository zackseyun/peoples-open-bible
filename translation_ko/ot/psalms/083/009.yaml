  text: Do to them as you did to Midian[a], as you did to Sisera and Jabin at the Kishon Brook[b],
  footnotes:
  - marker: a
    text: More literally, “Do to them like Midian, like Sisera, like Jabin.” The Hebrew comparisons are elliptical; the English main text supplies the implied wording “as you did to.”
    reason: lexical_alternative
  - marker: b
    text: See Judges 4:7, 13; 5:21 for the defeat of Sisera and Jabin at the Kishon.
    reason: cross_reference
translation:
  language: ko
  text: 그들에게 미디안에게 하신 것처럼 하시고, 기손 시내에서 시스라와 야빈에게 하신 것처럼 하소서.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들에게 미디안처럼, 시스라처럼, 야빈처럼, 기손 시내에서 하소서’입니다. 한국어에서는 비교되는 과거의 행위를 드러내기 위해 ‘하신 것처럼’을 보충했습니다.
    reason: lexical_alternative
  - marker: b
    text: 삿 4:7, 13 및 5:21을 보십시오. 기손은 시스라와 야빈의 패배와 관련된 물줄기입니다.
    reason: cross_reference
lexical_decisions:
