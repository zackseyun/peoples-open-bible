  yaml_path: translation/deuterocanon/4_maccabees/010/024.yaml
  text: O hateful and misanthropic man[a], what are you doing by exposing us in this way?
  footnotes:
  - marker: a
    text: Or 'by setting us forth in this manner.' The Greek verb can mean 'set forth' or 'expose,' and the context favors the sense of publicly presenting them to abuse or punishment.
    reason: lexical_alternative
translation:
  language: ko
  text: “오, 덕을 미워하는 자여, 사람을 미워하는 자여, 우리를 이런 방식으로 내세워 무엇을 하시는 것입니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이런 방식으로 우리를 드러내어’ 또는 ‘내보내어’라고 옮길 수 있습니다. 그리스어 동사는 ‘내세우다’, ‘제시하다’, ‘드러내다’, ‘노출시키다’를 뜻할 수 있으며, 문맥에서는 그들을 공개적으로 박해나 학대에 내맡기도록 내세우는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισάρετε
  english_pob_choice: hateful
  chosen_korean: 미워하는 자요
  alternatives_korean:
  - 가증한 자요
  - 미운 자여
  - 가장 미워할 자여
  lexicon: LSJ
  rationale: 직접적인 욕설성 호칭이므로, 현대 한국어에서 자연스럽고 강한 비난을 살리는 ‘미워하는 자’로 옮겼습니다. ‘가장 미워할’은 과장될 수 있고, ‘가증한’은 도덕적 평가가 더 앞섭니다.
- source_word: μισάνθρωπε
  english_pob_choice: misanthropic man
  chosen_korean: 사람을 미워하는 자여
  alternatives_korean:
  - 인류를 미워하는 자여
  - 인간 혐오자여
  - 미잔트로프여
  lexicon: LSJ
  rationale: 어근 의미인 ‘사람을 미워하는’으로 풀어, 욕설적 호칭의 공격성을 살리면서도 독자가 뜻을 바로 이해하도록 했습니다. 음역형 ‘미잔트로프’는 의미 전달력이 약합니다.
- source_word: προθεῖς
  english_pob_choice: by exposing
  chosen_korean: 드러내십니까
  alternatives_korean:
  - 내보내십니까
  - 앞에 세우십니까
  - 공개하십니까
  lexicon: LSJ
  rationale: 문맥상 수치를 주거나 박해에 넘기도록 ‘공적으로 드러내는’ 뉘앙스가 있어 ‘드러내다’가 가장 포괄적입니다. 영어 주석의 ‘set forth/expose’ 긴장도 한국어에서 유지했습니다.
- source_word: τὸν τρόπον
  english_pob_choice: in this way
  chosen_korean: 이런 식으로
  alternatives_korean:
  - 이런 방식으로
  - 이렇게
  - 이러한 방식으로
  lexicon: LSJ
  rationale: 관용적인 방식/상태를 나타내므로, 현대 한국어에서 가장 자연스러운 ‘이런 식으로’를 택했습니다.
theological_decisions:
- issue: 복수 분사 τί δρῶντες의 한국어 처리
  chosen_reading: 주어는 한 사람을 향하지만 행동은 복수형으로 묻는 구조를, 자연스러운 2인칭 존대 질문으로 재구성했습니다.
  alternative_readings:
  - 무엇을 하고 계십니까
  - 무엇을 행하고 있습니까
  rationale: 그리스어의 복수 분사 직설을 그대로 살리면 한국어가 부자연스러워지므로, 문맥상 한 박해자를 향한 질문임을 드러내는 방식으로 옮겼습니다.
  doctrine_reference: 문체/화행 처리
