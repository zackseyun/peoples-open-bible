lexical_decisions:
- source_word: מִכָּל פְּשָׁעַי
  english_pob_choice: from all my transgressions
  chosen_korean: 내 모든 허물에서
  alternatives_korean:
  - 내 모든 범죄에서
  - 내 모든 반역에서
  lexicon: HALOT
  rationale: מִן + כָּל은 원천으로부터의 구출을 나타내므로 ‘에서’로 살리고, פֶּשַׁע의 도덕·언약적 위반 뉘앙스를 현대 한국어에서 자연스럽게 담을 수 있는 ‘허물’로 옮겼습니다.
- source_word: הַצִּילֵנִי
  english_pob_choice: Deliver me
  chosen_korean: 나를 건져 주십시오
  alternatives_korean:
  - 나를 구해 주십시오
  - 나를 구원해 주십시오
  lexicon: HALOT
  rationale: נצל의 ‘빼내다/구출하다’는 감각을 살리면서, 기도체의 간구로 자연스럽고 직접적인 ‘건져 주십시오’를 선택했습니다.
- source_word: חֶרְפַּת
  english_pob_choice: the reproach
  chosen_korean: 치욕
  alternatives_korean:
  - 수치
  - 비방
  - 모욕
  lexicon: HALOT
  rationale: חֶרְפָּה의 공개적 수치와 명예 훼손의 의미를 한국어에서 압축적으로 드러내기 위해 ‘치욕’을 택했습니다.
- source_word: נָבָל
  english_pob_choice: a fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 미련한 자
  - 우매한 자
  - 하나님을 무시하는 자
  lexicon: HALOT
  rationale: נָבָל은 단순한 지적 부족보다 도덕적으로 무감각한 사람을 가리키므로, 교회적 상투어를 피하면서도 그 성격을 드러내는 ‘어리석은 자’로 옮겼습니다.
theological_decisions:
- issue: חֶרְפַּת נָבָל의 관계 설정
  chosen_reading: 시편 화자는 ‘어리석은 자’의 입에서 나오는 조롱의 대상, 곧 그에게 치욕으로 여겨지는 처지가 되지 않기를 구합니다.
  alternative_readings:
  - ‘어리석은 자의 치욕’ 자체가 되지 않게 해 달라는 뜻
  - 어리석은 자에게서 오는 수치를 받지 않게 해 달라는 뜻
  rationale: 문법적으로는 소유격적 결합이지만, 시편의 명예-수치 문맥에서는 ‘어리석은 자의 reproach’가 화자가 그로부터 조롱당하는 상황을 가리키는 것으로 읽는 것이 가장 자연스럽습니다. 그래서 본문에는 그 관계를 드러내되, 화자가 직접 ‘어리석은 자’라고 불린다는 해석은 과도하게 확정하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
