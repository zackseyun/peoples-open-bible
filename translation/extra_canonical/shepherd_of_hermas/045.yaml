translation:
  text: '1. I say to him, "Sir, listen[a] to a few words from me." He says, "Speak what you wish." "A
    person," I say, "Sir, is eager to keep the commandments of God, and there is no one who does not ask
    from the Lord to be strengthened in his commandments and to be made subject to them; but the devil
    is harsh and tyrannizes them."


    2. "He is not able," he says, "to tyrannize the servants of God—those who put their hope in him with
    their whole heart. The devil can grapple, but he cannot overthrow. If, therefore, you resist him,
    defeated he will flee from you, disgraced. But those who are empty," he says, "are afraid of the devil
    as though he had power.


    3. "When a man fills very many clay jars with good wine, and among those jars a few are empty[b],
    he comes to the jars and does not examine the full ones—for he knows they are full—but he inspects
    the empty ones, fearing lest they have turned sour; for empty jars quickly turn sour, and the enjoyment
    of the wine is lost.


    4. "So also the devil comes upon all the servants of God, putting them to the test. Therefore, as
    many as are full in faith have strongly resisted him, and he withdraws from them, having no place
    where he may enter. He comes then to the empty ones; and having a place, he enters into them, and
    he does in them what he wishes, and they become enslaved to him[c]."'
  philosophy: optimal-equivalence
  footnotes:
