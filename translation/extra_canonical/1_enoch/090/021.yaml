    text: The wording about the first star is unclear; the repeated reference may name another star rather than describe the same one.
    reason: alternative_reading
lexical_decisions:
- source_word: እግዚአ ሰብኡ
  chosen: the Lord of the sheep
  alternatives:
  - the master of the sheep
  - the owner of the sheep
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: In the Animal Apocalypse, this title refers to God in the vision's animal symbolism. 'Lord' preserves elevated register and authority better than 'master' or 'owner.'
- source_word: ሰብአ ፯ጸዓድወ ቀዳማዊያን
  chosen: those seven first white ones
  alternatives:
  - those seven first white men
  - those seven first bright ones
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The Ge'ez points to seven beings marked by whiteness and priority. 'White ones' preserves the visionary symbolism without over-specifying 'men,' which is not explicit in the immediate wording here.
- source_word: ያምጽኡ ቅድሜሁ
  chosen: bring before him
  alternatives:
  - lead before him
  - present before him
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: A standard judicial/presentational formula in apocalyptic scenes. 'Bring before him' is natural English and preserves the courtroom-like force.
- source_word: እምክቡበ ቀዳማዊ ዘይቀድም እምነ ዝኩ ከዋክብት
  chosen: from the first star that went before those stars
  alternatives:
  - beginning with the first star that preceded those stars
  - the first among the stars that went ahead of those stars
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The phrase identifies a leading or first star among the condemned stars. 'Went before' preserves the sequential and leadership nuance of the Ge'ez.
- source_word: ከዋክብት
  chosen: stars
  alternatives:
  - heavenly beings
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The text says 'stars,' and the Animal Apocalypse regularly uses stars symbolically for angelic beings. The imagery should be preserved in the main text rather than interpreted away.
- source_word: ኃፍረቶሙ ከመ ኃፍረተ አፍራስ
  chosen: whose private parts were like those of horses
  alternatives:
  - whose genitals were like horses' genitals
  - whose sexual organs were like those of stallions
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The Ge'ez is explicit and alludes to grotesque sexual transgression imagery. 'Private parts' keeps the meaning clear without becoming clinically jarring, while preserving the scandalous force of the image.
- source_word: ዘወፅአ ቅድመ
  chosen: that first one that went out before them
  alternatives:
  - that first one that came forth ahead of them
  - the first one that went before
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The bracketed clause appears to restate and specify the leading offender. 'Went out before them' preserves both movement and precedence.
- source_word: ወአምጽእዎሙ ለእሎሙ ቅድሜሁ
  chosen: and they brought them before him
  alternatives:
  - and they presented them before him
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The plural object likely refers to the stars/beings just identified. The repetition is retained because apocalyptic judgment scenes often repeat procedural actions for emphasis.
