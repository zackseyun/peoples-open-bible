  source_fidelity: 그리스어의 καὶ αὐτοί(‘그들도/또한’)와 πρὸς ... αὐτῶν(상대편의 병기에 대항하여), ἡμέρας πολλάς(여러 날 동안)는 대체로 반영되었습니다. 다만 ‘기계들’은 현대 한국어에서 군사용 μηχαναί의 뜻이 지나치게 불분명하고, ‘자기들의 기계들’은 재귀적으로 읽혀 대항 관계를 흐릴 수 있습니다.
  naturalness: ‘자기들의 기계들에 맞서는 기계들’은 반복이 어색하고 수식 관계가 무거우며, 문장 끝의 [a]는 이미 본문의 위첨자 표지가 있어 중복됩니다.
  terminology: 이 문맥의 μηχαναί는 공성전에서 쓰이는 기계 장치, 곧 군사용 병기를 가리킵니다. 본문에서는 자연스러운 ‘병기’로 옮기고, 각주에서 ‘공성 병기’ 및 ‘군사용 기계’라는 더 구체적 대안을 제시하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘자기들의 기계들’이 원문의 대항 대상을 자기 소유의 기계로 오해하게 할 수 있음
    rationale: αὐτῶν은 문맥상 상대편 측의 μηχαναί를 가리키며, ‘자기들의’는 한국어에서 주어 자신들의 소유물이라는 재귀적 의미를 강하게 띱니다.
  - severity: medium
    issue: ‘기계들’은 군사·공성 문맥의 μηχαναί를 충분히 전달하지 못함
    rationale: 일반 기계를 뜻하는 말로 읽히기 쉬우므로, 군사 장비라는 문맥을 드러내는 ‘병기’가 더 자연스럽습니다.
  - severity: low
