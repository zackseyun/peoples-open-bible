id: JOB.10.17
reference: Job 10:17
source:
  edition: WLC
  text: תְּחַדֵּ֬שׁ עֵדֶ֨י/ךָ נֶגְדִּ֗/י וְ/תֶ֣רֶב כַּֽ֭עַשְׂ/ךָ עִמָּדִ֑/י חֲלִיפ֖וֹת וְ/צָבָ֣א עִמִּֽ/י׀׃
translation:
  text: You bring your witnesses against me again and increase your anger against me; wave after wave of troops comes against me[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “changes and warfare are against me.” The Hebrew phrase is compressed.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחַדֵּשׁ
  chosen: you renew
  alternatives:
  - you make new
  - you bring afresh
  lexicon: HALOT
  rationale: Piel of חדש commonly conveys renewing or making fresh/new again. In context Job complains that God keeps bringing fresh charges or evidence against him, so 'you renew' preserves the iterative force without over-paraphrase.
- source_word: עֵדֶיךָ
  chosen: your witnesses
  alternatives:
  - your testimony
  - your evidences
  lexicon: HALOT
  rationale: Plural of עֵד normally means 'witnesses' or 'testimonies/evidences.' Because the possessive plus 'against me' evokes legal accusation, 'witnesses' best preserves the forensic imagery, while the possibility of impersonal 'evidences' is preserved in a footnote.
- source_word: נֶגְדִּי
  chosen: against me
  alternatives:
  - before me
  - in front of me
  lexicon: HALOT
  rationale: Though literally 'in front of me,' in adversarial/legal context it naturally means 'against me.' This fits Job's complaint of prosecution.
- source_word: וְתֶרֶב
  chosen: and you increase
  alternatives:
  - and you multiply
  - and you make great
  lexicon: HALOT
  rationale: From רבה, Hiphil/jussive-like form here conveys causing to become many/great. 'Increase' is idiomatic with the following noun and keeps the direct address to God.
- source_word: כַּעַשְׂךָ
  chosen: your anger
  alternatives:
  - your vexation
  - your indignation
  - your provocation
  lexicon: HALOT
  rationale: כעס can denote anger, vexation, or provocation. With second-person suffix and divine address, 'your anger' is the clearest and most natural English rendering.
- source_word: עִמָּדִי
  chosen: against me
  alternatives:
  - toward me
  - against me
  lexicon: HALOT
  rationale: With divine anger in this hostile context, the Hebrew preposition has natural adversative force.
- source_word: חֲלִיפוֹת
  chosen: relays
  alternatives:
  - changes
  - successive attacks
  - replacements
  lexicon: HALOT
  rationale: The noun can denote changes or successive replacements; “relays” preserves the likely military coloring without converting it into a full repeated-assault clause.
- source_word: וְצָבָא
  chosen: and an army
  alternatives:
  - and warfare
  - and a host
  lexicon: HALOT
  rationale: The concrete military sense is plausible alongside “relays,” while the alternative abstract sense “warfare” is retained in the note.
- source_word: עִמִּי
  chosen: are against me
  alternatives:
  - are against me
  - are upon me
  lexicon: HALOT
  rationale: The hostile context supports adversative English rather than the opaque literal wording “are with me.”
