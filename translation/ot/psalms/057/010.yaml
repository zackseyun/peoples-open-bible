id: PSA.57.10
reference: Psalms 57:10
source:
  edition: WLC
  text: כִּֽי גָדֹ֣ל עַד שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
translation:
  text: For your steadfast love is great, reaching to the heavens; your faithfulness[a] reaches to the clouds.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “truth.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  lexicon: HALOT
  rationale: Introduces the ground or reason for the preceding praise/exaltation. 'For' fits the poetic flow and preserves the causal sense without overexplaining.
- source_word: גָדֹל
  chosen: is great
  alternatives:
  - is mighty
  - is large
  lexicon: HALOT
  rationale: Predicate adjective describing the magnitude of God's covenant love. 'Is great' is the most natural and standard English rendering in this poetic context.
- source_word: עַד
  chosen: as far as
  alternatives:
  - to
  - unto
  - as far as
  lexicon: HALOT
  rationale: Expresses spatial extent naturally while retaining the source image.
- source_word: שָׁמַיִם
  chosen: the heavens
  alternatives:
  - heaven
  - the sky
  lexicon: HALOT
  rationale: In Hebrew poetry this commonly denotes the heavens/sky above. 'The heavens' preserves the elevated poetic register better than the flatter 'sky.'
- source_word: חַסְדֶּךָ
  chosen: your steadfast love
  alternatives:
  - your lovingkindness
  - your covenant love
  - your mercy
  lexicon: HALOT
  rationale: חֶסֶד carries covenantal loyalty, mercy, and enduring love. 'Steadfast love' is the best established English equivalent that preserves both affection and constancy without archaic wording.
- source_word: וְעַד
  chosen: and ... as far as
  alternatives:
  - and to
  - even to
  lexicon: HALOT
  rationale: Retains the repeated extent phrase and the second colon's ellipsis.
- source_word: שְׁחָקִים
  chosen: the clouds
  alternatives:
  - the skies
  - the heights
  lexicon: HALOT
  rationale: In poetic usage שְׁחָקִים refers to clouds or the lofty skies. 'The clouds' gives a concrete image and matches the parallel with 'the heavens.'
- source_word: אֲמִתֶּךָ
  chosen: your faithfulness
  alternatives:
  - your truth
  - your trustworthiness
  lexicon: HALOT
  rationale: Though אֱמֶת can mean 'truth,' in parallel with חֶסֶד and in reference to God's character it often conveys reliability or faithfulness. 'Your faithfulness' best captures the relational and covenantal sense in this psalm.
