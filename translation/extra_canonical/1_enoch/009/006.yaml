translation:
  text: 'You have seen what Azazel has done: he taught all lawlessness on the earth and revealed the secrets of eternity—those
    that are carried out in the heavens—and humankind came to know them.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The heavenly-practice clause is daggered and syntactically difficult in the selected printing. Charles discusses
      corrupt verb forms, word order and proposed reconstruction in printed22note15. The presented wording is retained without
      substituting a different Greek clause or “kept in heaven”; the final GeEz clause literally says “humankind knew.”
    reason: textual_variant
lexical_decisions:
- source_word: ርኢከ
  chosen: You have seen
  alternatives:
  - You saw
  - See
  rationale: The form is a second-person masculine singular perfect of “see.” The English present perfect suits the angels’
    appeal to God by emphasizing what is already within his sight without turning the form into an imperative.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዘገብረ፡ አዛዝኤል
  chosen: what Azazel has done
  alternatives:
  - that which Azazel did
  - what Azazel did
  rationale: The relative particle ዘ introduces the object of “you have seen.” English “what … has done” preserves the relation
    while reading naturally.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ዘመሀረ
  chosen: he taught
  alternatives:
  - who taught
  - having taught
  rationale: The relative construction further defines Azazel’s deed. After a colon, an independent English clause makes the
    agent clear while preserving the accusatory sequence.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኵሎ፡ ዓመፃ
  chosen: all lawlessness
  alternatives:
  - every rebellion
  - all transgression
  - every act of violence
  rationale: ዓመፃ denotes rebellion, wrongdoing, or lawlessness. “All lawlessness” preserves the comprehensive moral accusation
    without narrowing it to physical violence or a specific legal offense.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በዲበ፡ ምድር
  chosen: on the earth
  alternatives:
  - upon the earth
  - over the earth
  rationale: The phrase marks the earthly sphere in which the illicit teaching spreads. “On the earth” is clear modern English
    and retains the cosmic earth/heavens contrast.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወአግሀደ
  chosen: and revealed
  alternatives:
  - and disclosed
  - and made known
  rationale: The causative verb conveys bringing hidden things into the open. “Revealed” is exact here and preserves the apocalyptic
    theme of forbidden disclosure.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኅቡኣተ፡ ዓለም
  chosen: the secrets of eternity
  alternatives:
  - the eternal secrets
  - the secrets of the world
  - the hidden things of eternity
  rationale: ኅቡኣተ is a plural substantival form referring to hidden things or secrets, while ዓለም can denote the world, an
    age, or eternity. “Secrets of eternity” keeps the genitival wording and cosmic-temporal sense; “secrets of the world”
    remains lexically possible.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እለ፡ ይትገበሩ፡ በሰማያት
  chosen: those that are carried out in the heavens
  alternatives:
  - those that are done in the heavens
  - those that are made in heaven
  - those kept in the heavens
  rationale: The relative plural refers back to the secrets, and the passive/reflexive form of ገብረ most directly means “are
    done” or “are made.” “Are carried out” is intelligible without conjecturally changing the verb to “are kept.” The plural
    “heavens” reflects ሰማያት.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: አመረ፡ ሰብእ
  chosen: humankind came to know them
  alternatives:
  - humankind knew them
  - a human learned them
  - people learned them
  rationale: The clause literally has “humankind/man knew,” with a singular verb agreeing with collective ሰብእ. “Came to know”
    expresses the resulting acquisition of forbidden knowledge. The object “them” is supplied from the immediately preceding
    “secrets,” as English requires for clarity.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
