id: ACT.24.7
reference: Acts 24:7
source:
  edition: robinson-pierpont-2005-byzantine
  text: παρελθὼν δὲ Λυσίας ὁ χιλίαρχος μετὰ πολλῆς βίας ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν,
  language: Greek
  note: Secondary longer-unit reading in byztxt v2.0.3 AC24.CCT/AC24.csv, not the checked RP main text. The CSV verse-7 wording matches after case/whitespace normalization, not byte-exact capitalization. Whole-unit selection remains unresolved; the separate verse-8 no-variants CSV loses a pronoun variant block present in its CCT source.
translation:
  text: But[a] Lysias the commander came and took him out of our hands with great
    force,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: "This secondary record belongs to the longer unit spanning the end of verse 6 through the beginning of verse 8. The checked Byzantine main text does not include that unit; its separate AC24 file does. The SBL apparatus reports a similar, not identical, TR form. Do not insert this verse alone into the shorter surrounding text. Historical priority remains unresolved in this comparison."
    reason: textual_variant
lexical_decisions:
- source_word: παρέρχομαι
  chosen: came
  alternatives:
  - came forward
  - arrived
  - came along
  lexicon: BDAG
  rationale: The aorist participle παρελθὼν indicates Lysias arriving on the scene.
    Translated as a finite verb ('came and...') to maintain natural English narrative
    flow.
- source_word: χιλίαρχος
  chosen: commander
  alternatives:
  - tribune
  - captain
  lexicon: BDAG
  rationale: Literally 'commander of a thousand,' referring to a Roman military tribune.
    'Commander' is the most accessible equivalent for modern readers while accurately
    conveying his high military rank.
- source_word: βία
  chosen: force
  alternatives:
  - violence
  - strength
  lexicon: BDAG
  rationale: Combined with πολλῆς ('much/great'), 'great force' captures the physical
    coercion used by Lysias to extract Paul from the mob without necessarily implying
    malicious 'violence'.
- source_word: ἀπάγω
  chosen: took away
  alternatives:
  - led away
  - carried off
  lexicon: BDAG
  rationale: The verb means to lead or take someone away, often in a judicial or custodial
    context. 'Took him out of our hands' provides a smooth, idiomatic rendering of
    the Greek prepositional phrase.
