lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  chosen: From the sons of
  alternatives:
  - Of the sons of
  - From among the sons of
  lexicon: LSJ
  rationale: The preposition ἐκ naturally indicates source or membership from a group. 'From the sons of' is idiomatic in
    English for this list formula and preserves the genealogical/listing sense.
- source_word: Ἀδωνιακαὶμ
  chosen: Adoniakim
  alternatives:
  - Adoniakim/Adonikam
  lexicon: LSJ
  rationale: The Greek expression is rendered 'Adoniakim' in this unit. The selected Greek, not an approximate cross-reference,
    controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: οἱ ἔσχατοι
  chosen: the last ones
  alternatives:
  - the latest
  - the final ones
  - the descendants at the end
  lexicon: LSJ
  rationale: ἔσχατοι literally means 'last' or 'final.' In this genealogical/list context it likely distinguishes a final
    subgroup or later members. 'The last ones' preserves the Greek wording without over-interpreting the exact nuance.
- source_word: καὶ ταῦτα τὰ ὀνόματα αὐτῶν
  chosen: and these are their names
  alternatives:
  - and these were their names
  - and these their names
  lexicon: LSJ
  rationale: This is a standard list-introduction formula. Supplying 'are' makes natural English while staying close to the
    Greek nominal construction.
- source_word: Ἐλειφάλα
  chosen: Eliphala
  alternatives:
  - Eleiphala
  lexicon: LSJ
  rationale: Proper name transliterated directly from the Greek form. Standardized to a readable English transliteration while
    remaining close to the source spelling.
- source_word: τοῦ Γεουὴλ
  chosen: son of Geuel
  alternatives:
  - of Geuel
  lexicon: LSJ
  rationale: The genitive with a personal name in these genealogical lists commonly expresses filiation. Rendering it as 'son
    of Geuel' makes the relationship explicit in idiomatic English.
- source_word: Σαμαίας
  chosen: Shemaiah
  alternatives:
  - Samaias
  - Samaias
  lexicon: LSJ
  rationale: The Greek expression is rendered 'Shemaiah' in this unit. The selected Greek, not an approximate cross-reference,
    controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: μετʼ αὐτῶν
  lemma: μετά
  chosen: with them
  alternatives:
  - along with them
  lexicon: LSJ
  rationale: The preposition μετά with the genitive indicates accompaniment. 'With them' is the most natural modern English
    rendering and preserves the simple coordinative force of the Greek.
- source_word: ἄνδρες
  chosen: men
  alternatives:
  - males
  - adult men
  lexicon: LSJ
  rationale: ἀνήρ/ἄνδρες normally denotes males/men rather than people in general. In line with the project's gender-accurate
    policy, 'men' is preferred over a gender-neutral term such as 'persons.'
- source_word: ἑβδομήκοντα
  chosen: seventy
  lexicon: LSJ
  rationale: The Greek expression is rendered 'seventy' in this unit. The selected Greek, not an approximate cross-reference,
    controls the active rendering; any prior lexicon label is historical, not a new consultation.
