translation:
  text: “This son of man whom you saw will raise kings and the mighty from their beds, and the strong from their
    thrones. He will loosen the bridles of the strong and crush the teeth of sinners.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected raising verb has an initial dagger, with no closing partner printed. Dillmann1865 col637
      supports raise or cause to rise; Charles printed86 note35, continued87, considers it corrupt and proposes
      cast down by comparison with46:5. This English retains raise rather than silently installing that conjecture.
      The actual next noun is ለጓማተ, interpreted as bridles (primary col61, explicit46:4), not OCR ለኃማተ or a guessed
      jaw word. Charles printed87 note1 calls the printed loosen-bridles construction strange. The punitive context
      does not authorize silently reversing the selected direction of the first verb.
    reason: textual_variant
