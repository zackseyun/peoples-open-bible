theological_decisions:
- issue: The force of righteousness in the restored earth
  chosen_reading: The earth is cultivated in righteousness.
  alternative_readings:
  - The earth is cultivated justly.
  rationale: The noun is retained without supplying an unstated agent or narrowing
    the vision to agricultural fairness alone.
