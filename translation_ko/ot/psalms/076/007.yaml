  text: You—you are to be feared[a]; and who can stand before you once you are angry[b]?
  footnotes:
  - marker: a
    text: Or 'From your rebuke' or 'Because of your rebuke.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'chariot and horse,' a poetic way of referring to military force; some understand the image as extending to their riders as well.
    reason: cultural_note
translation:
  language: ko
  text: 주님—주님은 두려워할 분이십니다.[a] 주님께서 진노하신 때부터 누가 주님 앞에 설 수 있겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려우신 분이십니다’, ‘경외할 분이십니다’. 히브리어는 문자적으로 ‘두려워할 만한 분’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님께서 진노하실 때에’ 또는 ‘주님의 진노가 시작된 때부터’. 히브리어 표현은 진노의 시점부터라는 뜻이며, 문맥상 ‘진노하실 때’라는 의미로도 이해될 수 있습니다.
    reason: lexical_alternative
