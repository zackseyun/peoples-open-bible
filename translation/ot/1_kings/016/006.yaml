  from: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
  to: Baasha rested with his ancestors[a] and was buried in Tirzah. His son Elah became king in his place.
  rationale: The earlier pass deliberately preserved the traditional death formula and acknowledged “ancestors” and “became king” as alternatives. I retain the formula's image while clarifying its English expression and the accession it introduces.
