base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/002.yaml
  text: Great are the works of the LORD, studied by all who delight in them.
translation:
  language: ko
  text: 야훼의 일들은 위대하며, 그것들을 기뻐하는 모든 이가 깊이 살펴봅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을 기뻐하는 모든 이가 찾아봅니다’.
