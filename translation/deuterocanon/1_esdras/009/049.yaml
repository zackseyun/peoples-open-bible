- issue: Identification of Ἀτταρατὴ in relation to the MT parallel
  chosen_reading: Keep the Greek form 'Attarates' in the main text, with the MT identification ('Nehemiah the governor/Tirshatha') noted in a footnote.
  alternative_readings:
  - Translate as 'Nehemiah the governor' directly in the main text
  - Translate as 'the Tirshatha'
  rationale: The project prioritizes the Greek witness for 1 Esdras while using the Hebrew parallel as a real control. Since the Greek text here presents Ἀτταρατὴ rather than Νεεμίας, the main text should not replace the Greek form with the MT name/title. The parallel is important enough to preserve in a footnote for auditability.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Translate titles; transliterate names.'
