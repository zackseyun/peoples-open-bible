translation:
  language: en
  text: By acting in these ways, you taught your people that those who are righteous must be kind to others. You also filled your children with good hope,[a] because you give people the opportunity to repent[b] of sins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek specifically says “your sons.” This may refer representatively to God’s children or people.
    reason: lexical_alternative
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
