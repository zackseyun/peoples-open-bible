  text: By this I know that you delight in me,[a] because my enemy does not shout in triumph over me.[b]
  footnotes:
  - marker: a
    text: Or “is pleased with me.” The Hebrew verb denotes taking pleasure or delight in someone.
    reason: lexical_alternative
  - marker: b
    text: More literally, “does not raise a shout over me,” referring here to a shout of victory.
    reason: literal_form
