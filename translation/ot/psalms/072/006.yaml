  from: May he come down like rain on mown grass[b][c], like showers that water the earth[a].
  to: May he be like rain falling[a] on mown grass[b], like showers that water the earth.
  rationale: The first draft and lexical notes rightly preserve the rain imagery and favor mown grass over fleece in this agricultural setting. I retain those choices while clarifying how the descending rain functions as a comparison to the king.
