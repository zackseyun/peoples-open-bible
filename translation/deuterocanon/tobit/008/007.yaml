  text: καὶ νῦν, κύριε, οὐ διὰ πορνείαν ἐγὼ λαμβάνω τὴν ἀδελφήν μου ταύτην, ἀλλʼ ἐπʼ ἀληθείας· ἐπίταξον ἐλεῆσαί με καὶ αὐτὴν συγκαταγηρᾶσαι.
