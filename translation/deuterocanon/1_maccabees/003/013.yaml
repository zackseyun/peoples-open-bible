  text: καὶ ἤκουσεν Σήρων, ὁ ἄρχων τῆς δυνάμεως Συρίας, ὅτι ἤθροισεν Ἰούδας ἄθροισμα καὶ ἐκκλησίαν πιστῶν μεθʼ αὐτοῦ καὶ ἐκπορευομένων εἰς πόλεμον.
