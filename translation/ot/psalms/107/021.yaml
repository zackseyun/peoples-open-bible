id: PSA.107.21
reference: Psalms 107:21
source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃׆
translation:
  text: Let them give thanks to Yahweh for his steadfast love and his wonders for humankind.
  philosophy: dynamic
lexical_decisions:
- source_word: יוֹדוּ
  chosen: Let them give thanks
  alternatives:
  - Let them praise
  - May they thank
  lexicon: HALOT
  rationale: The Hiphil of ידה in this psalmic refrain commonly means to give thanks or confess/praise. In this context of response to deliverance, 'give thanks' best fits the idiom and the repeated refrain in Psalm 107.
- source_word: לַיהוָה
  chosen: to Yahweh
  alternatives:
  - to Yahweh
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: חסדו
  chosen: his steadfast love
  alternatives:
  - his lovingkindness
  - his covenant love
  - his mercy
  lexicon: HALOT
  rationale: חסד denotes loyal, covenantal love and kindness. 'Steadfast love' is a well-established and accurate English rendering that preserves both affection and durability better than the broader 'mercy'.
- source_word: ונפלאותיו
  chosen: and his wonders
  alternatives:
  - and his wonders
  - and for his marvelous works
  lexicon: HALOT
  rationale: A natural, source-faithful rendering of extraordinary acts.
- source_word: לבני אדם
  chosen: for humankind
  alternatives:
  - to humankind
  - to the sons of men
  - for the children of man
  lexicon: HALOT
  rationale: Naturally expresses the human beneficiaries while preserving the generic reference.
