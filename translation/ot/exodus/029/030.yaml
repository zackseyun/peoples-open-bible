  from: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
  to: The priest from among Aaron’s sons who succeeds him and enters the tent of meeting to minister in the holy place shall wear these garments for seven days.
