  - source_phrase: הָאוֹיֵב תַּמּוּ חֳרָבוֹת לָנֶצַח
    prior_rendering: O enemy, ruins have come to an end forever
    new_rendering: The enemies have come to an end in everlasting ruins
    rationale: The singular “enemy” can introduce the enemies collectively, allowing the plural verb to refer to them; “ruins” describes the resulting devastation. The surrounding address to Yahweh and the contrast with his everlasting throne favor the enemies’ permanent ruin rather than the disappearance of ruins.
