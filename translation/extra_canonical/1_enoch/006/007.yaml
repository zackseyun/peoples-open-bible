- source_word: መላእክቲሆሙ / መልአኮሙ
  chosen: their angels / their angel
  alternatives:
  - their leaders
  rationale: Retains the source’s repeated angel terminology rather than replacing
    it with a contextual interpretation.
- source_word: አራኪበረሜኤል
  chosen: Arakibaremeel
  alternatives:
  - Arakiba, Remeel
  rationale: The supplied witness presents the letters as one name; the translation
    does not silently divide it.
- source_word: አራዝያል
