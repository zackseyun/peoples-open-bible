  footnotes:
  - marker: a
    reason: textual_variant
    text: 'Project edition-comparison report: The working Greek brackets sir in paragraphs1 and2 as an
      insertion, with L1/L2/E reported by the printed apparatus and omission in Athos. The later sir in
      paragraph2 is not bracketed. The title addresses the shepherd and follows the contextual Sir rendering.
      Servant follows current project policy; bonded status and belonging are not erased.'
  - marker: b
    reason: textual_variant
    text: The working Greek brackets much in paragraph4. The editorial mark is disclosed here without
      inventing unanimous manuscript support; the surrounding statement still says no less and even more.
  - marker: c
    reason: textual_variant
    text: 'Project edition-comparison report: The working edition marks this whole question with vertical
      bars; its apparatus attributes the insertion to Gebhardt and reports omission in Athos and Palatina
      in a repetition-related omission. The same apparatus also lists Palatina among insertion support,
      so that report is not treated as unqualified support. The independently read Palatina printed137
      has no question; Vulgata printed72 does have it.'
  - marker: d
    reason: textual_variant
    text: 'Project edition-comparison report: Working above (ἄνω) is Tischendorf’s conjecture; the reported
      Athos letters are an abbreviated man, and Vulgata omits that element while Palatina speaks of power
      with the Lord. Working goes up is Hollenberg’s conjecture against the reported damaged or corrupt
      Athos form. P.Oxy1172 printed12/14 instead has ἐπαναπαῇ, explained there as rests upon or relies
      on. Its disputed wording before no-power is damaged and does not securely confirm above. The working
      text is retained with both limits exposed.'
  - marker: e
    reason: textual_variant
    text: The working Greek brackets and in confession here. P.Oxy1172 printed13 preserves most of that
      phrase with final letters supplied; both printed Latin versions instead speak of prayer at this
      point. Intercession and confession remain distinct in the working translation. Wage retains μισθός
      as an economic metaphor; reward is an alternative. Without doubting follows the existing contextual
      project decision.
  - marker: f
    reason: lexical_alternative
    text: The clause literally speaks of becoming unceasing in his life. The existing project decision
      understands the aim as the needy person’s continual sustenance; the simplified text makes that interpretation
      explicit. The alternative is the rich man’s constancy in his own life. Abundant with God preserves
      the existing rendering; rich toward God is possible. P.Oxy1172 printed13 has Lord rather than working
      God in the final phrase.
  - marker: g
    reason: textual_variant
    text: The working Greek brackets which he received from the Lord; P.Oxy1172 printed13 preserves much
      of it, with its Lord supplied. The following double-dative construction is retained with the prior
      rendering to the Lord for the supplier; to the Lord who supplies him is another grammatical reading.
      P.Oxy1172 printed13 and Berlin5513 printed14 omit of the Lord after ministry, while the working
      Greek retains it. The printed Vulgata supplies a longer passage here from Palatina; that supplied
      Latin is not an independent Vulgata manuscript vote.
  - marker: h
    reason: textual_variant
    text: The enlarged Lightfoot/Harmer printed345 scan reads souls (ψυχάς), not prayers (εὐχάς). An earlier
      project repair mistakenly claimed the opposite; this corrects that transcription record. P.Oxy1172
      line40 prints ψυ outside brackets and supplies the following letters. Michigan printed39 supplies
      the initial ψ; Berlin5513 printed14 reports only a trace of that initial letter. Neither fragment
      is presented as fully preserved at this word. Palatina printed139 has animas, souls; Vulgata printed73
      has a different, shorter application. Complete or fulfill preserves the repeated πληροφοροῦσι; this
      clause does not explicitly assert salvation of an immortal soul.
  - marker: i
    reason: textual_variant
    text: 'Project edition-comparison report: Working by (ὑπό) was a printed conjecture against reported
      Athos from (ἀπό), but the independently read Michigan, Berlin5513 and P.Oxy1172 editions also report
      ὑπό, with damage or supplied adjoining letters distinguished in the evidence. The latter three have
      forms of enrolled/written rather than working ἐπιγεγραμμένος, inscribed. All retain the books-of-the-living
      promise; Latin editions use a singular book. These are edition comparisons, not fresh manuscript
      photograph authentication.'
  - marker: j
    reason: textual_variant
    text: 'Project edition-comparison report and bounded selection: The final explanatory sentence is
      reported absent from Athos. The former printed1891 plural those who think this way can do some good
      is retained as an alternative. The working source now follows Michigan printed39, papyrus page1
      lines11–13: the singular one who understands this can render some good service. Supplied letters
      remain bracketed in the normalized Greek; they are not all preserved ink. Berlin5513 printed14 lines29–30
      corroborates singular understanding and service but has no good; P.Oxy1172 printed14 lines46–47
      has a similar singular/service ending with a damaged or corrected object. These are three manuscripts
      compared through editions, not independent new photograph certifications. Vulgata printed73 can
      minister something and Palatina can do something good provide versional comparison, not exact Greek
      votes.'
lexical_decisions:
- source_word: δοῦλος
  chosen: servant
  alternatives:
  - slave
  - bondservant
  lexicon: Working source and current DOCTRINE.md; no new lexicon lookup.
  rationale: Reader-facing servant retains belonging, bonded status and allegiance in the notes.
- source_word: μισθός / ἀδιστάκτως / πλουσία πρὸς τὸν Θεόν
  chosen: wage / without doubting / abundant with God
  alternatives:
  - reward / without hesitation / rich toward God
  lexicon: Existing contextual decisions retained against the complete Greek; no new lexicon lookup.
  rationale: Preserve remuneration, double-mindedness contrast and rich/poor imagery.
- source_word: ψυχάς / πληροφοροῦσι
  chosen: souls / make complete
  alternatives:
  - lives / fulfill
  lexicon: Printed source, papyrus edition reports and Palatina comparison; no new lexicon lookup.
  rationale: Correct the mistaken prayers transcription while avoiding an added claim about immortal souls.
- source_word: ὁ γὰρ συν[ίω]ν ... δια[κ]ονῆσαί τ[ι ἀ]γαθόν
  chosen: the one who understands ... render some good service
  alternatives:
  - 'printed1891: those who think ... do some good'
  lexicon: Bounded primary Michigan917, Berlin5513 and POxy1172 edition comparison; no new lexicon lookup.
  rationale: Prefer the early Greek singular understanding/service construction over the plural version-based
    printed wording; retain the selected Michigan restoration marks and other-witness differences.
