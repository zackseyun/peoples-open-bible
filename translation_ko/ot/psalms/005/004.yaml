  - 아침마다
  lexicon: WLC
  rationale: 두 번 반복되는 זמן 표현을 자연스러운 현대 한국어 부사구로 살려, 시간적 강조를 그대로 드러냈습니다.
- source_word: אֶעֱרָךְ לְךָ
  english_pob_choice: I lay my request before you
  chosen_korean: 내 기도를 주 앞에 펼쳐 놓고
  alternatives_korean:
  - 내 요청을 주 앞에 정리하고
  - 주께 내 청원을 차려 놓고
  lexicon: WLC
  rationale: ערך의 핵심인 ‘정돈하여 두다/차려 놓다’의 뜻을 살리면서, 기도 맥락에서 자연스럽게 ‘주 앞에 펼쳐 놓다’로 옮겼습니다.
- source_word: וַאֲצַפֶּה
  english_pob_choice: and watch expectantly
  chosen_korean: 기대하며 지켜봅니다
  alternatives_korean:
  - 기대하며 기다립니다
  - 바라보며 기다립니다
  lexicon: WLC
  rationale: צפה가 단순한 시선만이 아니라 기대 어린 기다림을 포함하므로, 두 의미를 함께 드러내는 표현을 선택했습니다.
theological_decisions:
- issue: 여호와/야훼의 신명 번역
  chosen_reading: ‘야훼’로 직역해 신적 고유명을 유지했습니다.
  alternative_readings:
  - ‘주님’으로 의역
  - ‘여호와’로 음역
  rationale: 시편 본문은 칭호가 아니라 이스라엘에게 자신을 알리신 언약의 이름을 직접 사용하므로, 이를 가리지 않고 드러내는 번역이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
