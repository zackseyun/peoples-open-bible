id: PSA.53.4
reference: Psalms 53:4
source:
  edition: WLC
  text: הֲ/לֹ֥א יָדְעוּ֮ פֹּ֤עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם אֱ֝לֹהִ֗ים לֹ֣א קָרָֽאוּ׃
translation:
  text: Have these evildoers no understanding? They devour my people[a] as readily as they eat bread; they do not call on God.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “My people” may be the psalmist’s words or God’s; the speaker is not explicitly identified here.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  chosen: Do not
  alternatives:
  - Have they not
  - Will they not
  lexicon: HALOT
  rationale: Introduces a rhetorical question expecting an affirmative answer. 'Do not' preserves the interrogative force in natural English.
- source_word: יָדְעוּ
  chosen: know
  alternatives:
  - understand
  - have known
  lexicon: HALOT
  rationale: Qal perfect 3cp of ידע here expresses knowing/recognizing. Present 'know' fits the gnomic rhetorical question better than an English past tense.
- source_word: פֹּעֲלֵי אָוֶן
  chosen: evildoers
  alternatives:
  - evildoers
  - workers of iniquity
  lexicon: HALOT
  rationale: An ordinary English equivalent that retains the agentive moral sense; the literal Hebrew construction is supplied in a note.
- source_word: אֹכְלֵי עַמִּי
  chosen: those who eat up my people
  alternatives:
  - those who devour my people
  - eaters of my people
  lexicon: HALOT
  rationale: The participial phrase is metaphorical for predatory oppression. 'Eat up' keeps the eating metaphor explicit and idiomatic in English.
- source_word: אָכְלוּ לֶחֶם
  chosen: as they eat bread
  alternatives:
  - they eat bread
  - like eating bread
  lexicon: HALOT
  rationale: 'The Hebrew juxtaposes devouring God''s people with eating bread. English requires a comparative sense to make the idiom clear: they consume God''s people as casually and ordinarily as bread.'
- source_word: אֱלֹהִים
  chosen: God
  lexicon: HALOT
  rationale: The plural form here clearly refers to the singular God of Israel. 'God' is the standard and contextually correct rendering.
- source_word: לֹא קָרָאוּ
  chosen: They do not call on
  alternatives:
  - they have not called on
  - they do not invoke
  lexicon: HALOT
  rationale: קרא with אלוהים in context means to call upon/invoke God. Present tense suits the general characterization of the wicked in the psalm.
