base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/034.yaml
  text: Jesus said, “If a blind person leads a blind person, both of them fall down into a pit.”
translation:
  language: de
  text: 'Jesus sagte: »Wenn ein Blinder einen Blinden führt[a], fallen beide[b] hinab in eine Grube.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »vor sich herzieht«; die koptische Wendung bedeutet idiomatisch »führt« oder »leitet«.'
    reason: lexical_alternative
  - marker: b
    text: 'Die koptische Verbform beschreibt hier eine allgemeine, sprichwortartige Wirklichkeit: Sie fallen hinab. Anders als in der synoptischen Parallele (Matthäus 15,14) steht die Aussage nicht ausdrücklich im Futur.'
    reason: textual_variant
lexical_decisions:
- source_word: ⲃⲗⲗⲉ
  choice: ein Blinder / einen Blinden
  rationale: Das koptische Substantiv bezeichnet allgemein einen blinden Menschen. Die substantivierte deutsche Form bewahrt die knappe, sprichwortartige Gestalt des Satzes.
- source_word: ⲥⲱⲕ ϩⲏⲧϥ
  choice: führt
  rationale: Die Verbindung bedeutet wörtlich etwa »vor sich herziehen« und dient idiomatisch im Sinn von »führen« oder »leiten«.
- source_word: ϣⲁⲩϩⲉ
  choice: fallen
  rationale: Die Aoristform drückt hier eine allgemeine beziehungsweise sprichwortartige Wahrheit aus; das deutsche Präsens gibt diesen Sinn wieder.
- source_word: ⲡⲉⲥⲛⲁⲩ
  choice: beide
  rationale: Wörtlich »die zwei«; »beide« erhält die ausdrückliche Einbeziehung von Führendem und Geführtem.
- source_word: ⲉⲡⲉⲥⲏⲧ
  choice: hinab
  rationale: Die adverbiale Wendung bezeichnet die Bewegung nach unten und darf nicht als Teil des Wortes für »Grube« missverstanden werden.
- source_word: ⲉⲟⲩϩⲓⲉⲓⲧ
  choice: in eine Grube
  rationale: Die Konstruktion enthält den unbestimmten Artikel und bezeichnet eine Grube, einen Schacht oder einen Brunnen; »Grube« passt hier am natürlichsten.
theological_decisions:
- issue: Zeitlicher beziehungsweise allgemeingültiger Sinn der Aussage
  choice: 'Präsens: »fallen«'
  alternative: 'Futur: »werden fallen«'
  rationale: Die koptische Form stellt den Vorgang als regelmäßig eintretende, allgemeine Wirklichkeit dar. Ein Futur würde die Aussage stärker auf ein einzelnes zukünftiges Ereignis festlegen.
translation_notes:
  register: Knappe, würdige und sprichwortartige Standardsprache. Die traditionelle substantivierte Form »ein Blinder« entspricht der Kürze des koptischen Textes; »hinab« bewahrt das ausdrücklich vorhandene Richtungsadverb, und der unbestimmte Artikel bei »eine Grube« bleibt erhalten.
