translation:
  language: en
  text: He did not learn this from people, but through reorientation[r1] he knows how to welcome those who turn back.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: And he did not learn this from men
  simplified_phrase: He did not learn this from people
  preserved_meaning: His knowledge did not come from human instruction.
  reasoning_layer_used: POB translation and Greek source
  rationale: “People” conveys the generic human sense of “men” in modern English.
- pob_phrase: receive those who turn back
  simplified_phrase: welcome those who turn back
  preserved_meaning: He accepts those who return.
  reasoning_layer_used: POB translation
  rationale: “Welcome” makes the sense of receiving returning people immediately clear.
translation_notes:
  risk_flags:
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
