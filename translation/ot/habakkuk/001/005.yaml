id: HAB.1.5
reference: Habakkuk 1:5
source:
  edition: WLC
  text: רְא֤וּ בַ/גּוֹיִם֙ וְֽ/הַבִּ֔יטוּ וְ/הִֽתַּמְּה֖וּ תְּמָ֑הוּ כִּי פֹ֨עַל֙ פֹּעֵ֣ל בִּֽ/ימֵי/כֶ֔ם לֹ֥א תַאֲמִ֖ינוּ כִּ֥י יְסֻפָּֽר־׃
translation:
  text: Look among the nations[a] and see; be astonished, be astounded[b]. For I am doing a work[c] in your days that you would not believe if it were told.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'at the nations.' The Greek version instead addresses 'despisers' (compare Acts 13:41). Mur88 preserves the Hebrew noun 'nations'; the 'traitors' address in the quoted verse of 1QpHab is supplied, though its commentary concerns traitors. The earliest address remains unresolved.
    reason: textual_variant
  - marker: b
    text: The Hebrew pairs two astonishment commands for emphasis.
    reason: lexical_alternative
  - marker: c
    text: Or 'a deed is being done.' The retained Hebrew has no explicit first-person pronoun; 'I' is inferred from the speaker context, especially verse 6. The Greek explicitly expresses the first-person subject.
    reason: alternative_reading
lexical_decisions:
- source_word: רְאוּ
  chosen: Look
  alternatives:
  - See
  lexicon: HALOT
  rationale: Imperative plural of ראה. 'Look' works well with the following prepositional phrase 'among the nations' and preserves the summons to observe.
- source_word: בַגּוֹיִם
  chosen: among the nations
  alternatives:
  - at the nations
  - among the Gentiles
  lexicon: HALOT
  rationale: גּוֹיִם commonly means 'nations.' The preposition with article here is best taken in the sense 'among' or 'at/among.' 'Nations' is preferable to 'Gentiles' in this prophetic context because the reference is to peoples/political entities, not primarily an ethnic-religious contrast.
- source_word: וְהַבִּיטוּ
  chosen: and see
  alternatives:
  - and look
  - and observe
  lexicon: HALOT
  rationale: הביט overlaps with ראה but adds focused looking. Rendering it 'and see' avoids awkward repetition while preserving the paired imperatives.
- source_word: וְהִתַּמְּהוּ תְּמָהוּ
  chosen: be astonished, be astounded
  alternatives:
  - and be astonished, astonished
  - and wonder, wonder
  lexicon: HALOT
  rationale: The doubled forms from תמה intensify the command. Rather than woodenly repeating the same English word twice, the translation expresses the emphatic force with a two-part phrase in natural English.
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  - Indeed
  lexicon: HALOT
  rationale: Introduces the ground for the astonishment command. 'For' fits the explanatory flow.
- source_word: פֹעַל פֹּעֵל
  chosen: I am doing a work
  alternatives:
  - a deed I am doing
  - I am working a work
  lexicon: HALOT
  rationale: The noun and participle construction is retained as 'I am doing a work.' The first-person speaker is inferred from the surrounding discourse, especially verse 6, not an explicit pronoun in the retained Hebrew. An impersonal rendering remains possible and is disclosed in note c. The Greek explicitly expresses the subject but does not establish missing Hebrew pronoun letters. The historical HALOT label is retained; no fresh entry consultation is claimed.
- source_word: בִּימֵיכֶם
  chosen: in your days
  alternatives:
  - in your lifetime
  - in your time
  lexicon: HALOT
  rationale: Literal and idiomatic. It preserves the temporal immediacy addressed to the audience.
- source_word: לֹא תַאֲמִינוּ
  chosen: you would not believe
  alternatives:
  - you will not believe
  - you do not believe
  lexicon: HALOT
  rationale: Though morphologically imperfect, in this context with the following conditional-like clause it expresses what would be unbelievable to the hearers. 'Would not believe' best captures the sense in idiomatic English.
- source_word: כִּי יְסֻפָּר
  chosen: if it were told
  alternatives:
  - when it is told
  - though it is recounted
  - if someone told it
  lexicon: HALOT
  rationale: 'The conjunction plus passive can be rendered idiomatically as a conditional statement in English: ''if it were told.'' This matches the sense that the coming act is so astonishing that mere report would strain belief.'
