  meaning_decisions:
  - source_phrase: καὶ ἔστησαν αὐτῷ τὴν ἱερωσύνην
    prior_rendering: and established the priesthood for him
    new_rendering: Alcimus was appointed high priest
    rationale: The phrase concerns Alcimus's appointment to an existing office, not the establishment of a new priesthood; the passive avoids inventing a precise subject for the Greek plural verb.
  - source_phrase: ἐνετείλατο αὐτῷ ποιῆσαι τὴν ἐκδίκησιν
    prior_rendering: commanded him to carry out vengeance
    new_rendering: the king commanded Bacchides to take vengeance
    rationale: The military commission belongs to Bacchides; explicit names distinguish him from Alcimus, the recipient of the priestly office.
  - source_phrase: ἐν τοῖς υἱοῖς Ἰσραήλ
    prior_rendering: on the sons of Israel
    new_rendering: on the Israelites
    rationale: This is a conventional designation for Israel's people, not a restriction to male descendants.
