  text: The cords of Sheol[a] surrounded me; the snares of death confronted me.[b]
  footnotes:
  - marker: a
    text: Or 'the floods/torrents of destruction'; 'Belial' is also possible if taken as a proper name, but here it is more likely a common noun meaning worthlessness or ruin.
    reason: alternative_reading
translation:
  language: ko
  text: 스올[a]의 줄이 나를 둘러쌌으며, 죽음의 올무가 나를 맞아섰습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
