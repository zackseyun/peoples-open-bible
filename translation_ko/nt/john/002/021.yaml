  rationale: ‘자신의 몸인 성전’으로 옮겨 예수의 몸을 성전으로 가리키는 원문의 비유적 식별을 한국어에서 자연스럽고 분명하게 보존했습니다. ναός의 어휘적 뉘앙스를 설명하는 각주는 유지하되, ‘내성소’로 과도하게 한정하지 않았습니다.
