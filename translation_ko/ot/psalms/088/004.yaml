source:
  edition: WLC
  text: נֶ֭חְשַׁבְתִּי עִם י֣וֹרְדֵי ב֑וֹר הָ֝יִ֗יתִי כְּ/גֶ֣בֶר אֵֽין אֱיָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/004.yaml
  text: I am counted among those going down to the pit[a]; I have become like a man without strength[b].
  footnotes:
  - marker: a
    text: Or “those going down to the grave.” The Hebrew “pit” is a common poetic image for death.
    reason: lexical_alternative
  - marker: b
    text: Or “like a strong man without vigor.” The noun can denote a man with connotations of strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 구덩이로 내려가는 이들과 함께 여겨졌으며,[a] 힘이 없는 사람처럼 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤으로 내려가는 이들과 함께.’ 히브리어 ‘구덩이’는 죽음을 나타내는 시적 이미지로 자주 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기력이 없는 힘센 사람처럼.’ 히브리어 גֶּבֶר는 ‘사람’을 뜻하며, 힘이나 기력의 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 주께서
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 문맥상 앞뒤 진술을 잇는 인과를 담지만, 한국어 시편 절에서는 자연스러운 시작을 위해 바로 주어를 세워도 의미가 유지됩니다.
- source_word: שָׂבְעָה בְרָעוֹת
  english_pob_choice: is full of troubles
  chosen_korean: 고난으로 가득 채우시니
  alternatives_korean:
  - 고난으로 가득합니다
  - 재앙으로 가득합니다
  - 악으로 가득합니다
  lexicon: HALOT
  rationale: רָעוֹת는 כאן에서 도덕적 악보다 시편 화자를 짓누르는 재난·고난을 가리키므로, ‘고난’으로 옮겨 시적 압박감을 살렸습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 생명
  - 제 자아
  lexicon: HALOT
  rationale: 앞 절의 חַיַּי('제 생명')와 구별되는 평행 구조를 살리기 위해 ‘영혼’으로 옮겼습니다.
- source_word: לִשְׁאוֹל
  english_pob_choice: to Sheol
  chosen_korean: 스올에
  alternatives_korean:
  - 무덤에
  - 죽은 자들의 나라에
  lexicon: HALOT
  rationale: 스올은 히브리어 고유 개념이므로 표준 음역 ‘스올’을 유지해 본문의 세계를 보존했습니다.
theological_decisions:
- issue: 시편의 스올 표기
  chosen_reading: ‘스올’은 단순한 무덤보다 죽은 자들의 영역을 가리키는 히브리어 개념으로 유지합니다.
  alternative_readings:
  - 무덤
  - 죽음의 세계
  rationale: 후대 교리 범주로 평탄화하지 않고, 본문 자체의 사후 세계 이미지를 드러내기 위해 음역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3
