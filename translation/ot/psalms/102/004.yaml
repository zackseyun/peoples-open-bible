  from: My heart is struck down like grass and withered
  to: is struck and withered like grass
  rationale: The current phrasing, while closely following the Hebrew word order, is slightly awkward in English. The Hebrew syntax (supported by the Masoretic accent on כָעֵשֶׂב) links 'like grass' primarily with 'is struck'. However, the poetic sense is that the heart's entire condition—struck and withered—is like that of grass. The current rendering creates a slightly disjointed phrase. The suggested rewrite, 'is struck and withered like grass,' is a common solution (cf. NIV, ESV) that creates a more fluid and powerful image in English by applying the simile to the compound predicate, which better captures the holistic sense of the metaphor.
