  rationale: 시편 표제에서 이 표현은 예배 음악을 맡은 책임자를 가리키므로, 기능을 살린 ‘지휘자’가 자연스럽습니다.
- source_word: עַל שׁוּשַׁן עֵדוּת
  english_pob_choice: according to “Lily of Testimony.”
  chosen_korean: 「증거의 백합」에 맞추어
  alternatives_korean:
  - 「증거의 백합」에 따라
  - 「증거의 백합」의 곡조로
  lexicon: HALOT
  rationale: 표제가 곡조나 예배용 선율을 가리킬 수 있으므로, 원문의 열린 의미를 보존하면서도 한국어로는 ‘-에 맞추어’로 자연스럽게 옮겼습니다.
- source_word: מִכְתָּם
  english_pob_choice: miktam
  chosen_korean: 믹담
  alternatives_korean:
  - 금시
  - 노래
  lexicon: HALOT
  rationale: 의미가 불확실한 장르 표지이므로, 추정 번역보다 음역이 더 투명하고 주석 가능한 선택입니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의 것
  alternatives_korean:
  - 다윗의
  - 다윗을 위한
  lexicon: HALOT
  rationale: 히브리어 전치사는 저작, 관련성, 헌정 모두를 열어 두므로, 단정적인 저자 표정보다 소속/귀속의 여지를 남기는 표현을 택했습니다.
- source_word: לְלַמֵּד
  english_pob_choice: for teaching
  chosen_korean: 가르치기 위해
  alternatives_korean:
  - 가르치기 위하여
  - 교훈을 주기 위해
  lexicon: HALOT
  rationale: 부정사 목적형의 의도를 직접적으로 드러내는 표현으로, 시편 표제의 용법에 잘 맞습니다.
