source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם עַל֩ אֲשֶׁר עָזְב֨וּ אֲבוֹתֵי/כֶ֤ם אוֹתִ/י֙ נְאֻם יְהוָ֔ה וַ/יֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יַּעַבְד֖וּ/ם וַ/יִּשְׁתַּחֲו֣וּ לָ/הֶ֑ם וְ/אֹתִ֣/י עָזָ֔בוּ וְ/אֶת תּוֹרָתִ֖/י לֹ֥א שָׁמָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/011.yaml
  text: Then you shall say to them, ‘Because your fathers abandoned me,’ declares the LORD, ‘and went after other gods, and served them, and bowed down to them. But me they abandoned, and my law they did not keep.’
translation:
  language: ko
  text: 그러면 너희는 그들에게 이렇게 말하십시오. 「너희 조상들이 나를 버리고, 야훼께서 말씀하신다, 다른 신들을 따라가 그들을 섬기고 그들에게 절하였으며, 나를 버리고 내 율법을 지키지 않았기 때문이다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָזְבוּ / עָזַבְתִּי
  english_pob_choice: abandoned / they abandoned
  chosen_korean: 버리다
  alternatives_korean:
  - 떠나다
  - 저버리다
  lexicon: עזב
  rationale: 관계적·언약적 단절을 드러내기 위해 단순한 ‘떠나다’보다 ‘버리다’를 택했습니다. 앞뒤 모두 하나님을 대상화한 배반의 뉘앙스가 강합니다.
- source_word: אֱלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들
  alternatives_korean:
  - 다른 하나님들
  - 타신들
  lexicon: אלהים
  rationale: 히브리어의 우상 숭배 대상을 자연스러운 현대 한국어로 옮기되, 문맥상 실제 신격으로 숭배된 대상이라는 점을 살려 ‘다른 신들’로 번역했습니다.
- source_word: עַבְד֖וּם / וַיִּשְׁתַּחֲו֣וּ
  english_pob_choice: served them, and bowed down to them
  chosen_korean: 그들을 섬기고 그들에게 절하였기
  alternatives_korean:
  - 그들을 섬기고 그들 앞에 엎드렸기
  - 그들을 섬기고 그들에게 경배하였기
  lexicon: עבד / השתחוה
  rationale: ‘섬기다’는 עבוד의 노예적·예배적 봉사를, ‘절하다’는 השתחוה의 몸짓을 비교적 직접적으로 드러냅니다.
- source_word: תּוֹרָה
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 교훈
  lexicon: תורה
  rationale: 본문의 토라는 야훼의 언약적 가르침 전체를 가리키므로 프로젝트 기본값에 따라 ‘율법’이 가장 적절합니다.
theological_decisions:
- issue: 여호와 신명 처리
  chosen_reading: 본문의 נְאֻם יְהוָה는 한국어 본문에서 ‘여호와의 말씀이다’로 옮기고, 경어는 예언자 인용문 바깥에서 유지했습니다.
  alternative_readings:
  - ‘야훼의 말씀이다’
  - ‘주님의 말씀이다’
  rationale: 이 절의 직접 출처는 구약 히브리어 본문이며, POB 기본 용례상 יהוה는 야훼가 기본이지만, 현재 입력의 영어 POB가 LORD로 정리된 점과 출판용 한국어의 가독성을 함께 고려해 인용 표지로 처리했습니다.
  doctrine_reference: 출애굽기 3:15; 예레미야 16:11
