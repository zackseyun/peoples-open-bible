  from: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
  to: But you did not go near the land of the Ammonites—the whole region along the Jabbok and the cities of the hill country—or any place Yahweh our God had forbidden you to enter[a].
  rationale: The lexical record recognizes that the closing command is elliptical, but leaving its object unstated obscures the restriction recalled from verse 19. I make the forbidden territory explicit, retain the shift to 'you,' and note the alternative reading that summarizes obedience to Yahweh’s command.
