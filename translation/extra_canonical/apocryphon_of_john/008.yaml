translation:
  text: '1. Further, from the Precognition of Perfect Mind, by means of the revelation of the will of the unseen Spirit and the will of the self-generated one, (issued forth) ‹the› Perfect Man, the first revelation, even the truth.


    2. He is the one whom the virginal Spirit named Pigera-Adama(s), and he appointed him over «9» the first aeon together with the Mighty One, the self-generated one, Christ, by the first light, Armozel, escorted by his powers.


    3. Further, the unseen one granted him a spiritual, invulnerable strength,


    4. and he spoke and extolled and praised the unseen Spirit, saying: ‘On your account the All has come forth into being, and to you will return the All.


    5. I will praise and extol you and the self-generated one, and the three aeons, the Father, the Mother, the Son, the perfect power.’


    6. He appointed also his son Seth over the second aeon, in front of the second light, Oroiel, and inside the third aeon the seed of Seth was appointed over the third light, Daveithai, and (inside it) were placed the souls of the holy ones.


    7. Further, inside the fourth aeon were placed the souls of those unacquainted with the Fullness, and who failed to repent[a] immediately, but who instead continued (unwilling to repent) for some time, and who repented (only) afterwards.


    8. These are the fourth light, Eleleth.


    9. These are creatures who extol the unseen Spirit.'
