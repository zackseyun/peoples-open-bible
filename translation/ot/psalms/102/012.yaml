id: PSA.102.12
reference: Psalms 102:12
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה לְ/עוֹלָ֣ם תֵּשֵׁ֑ב וְ֝/זִכְרְ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר׃
translation:
  text: But you, Yahweh, sit enthroned forever[a], and your name is remembered from generation to generation.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'remain forever.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  chosen: But you
  alternatives:
  - And you
  lexicon: HALOT
  rationale: The conjunction with the independent pronoun marks a strong contrast with the preceding context of human frailty and transience. 'But you' brings out the adversative force naturally in English better than a simple 'And you.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The name is apposed to the emphatic subject “you,” not used as a vocative.
- source_word: לְעוֹלָם
  chosen: forever
  alternatives:
  - for ever
  - for eternity
  lexicon: HALOT
  rationale: עוֹלָם here denotes unending duration. 'Forever' is clear modern English and fits the psalm's contrast between God's permanence and creation's mutability.
- source_word: תֵּשֵׁב
  chosen: sit
  alternatives:
  - sit
  - remain seated
  - dwell
  lexicon: HALOT
  rationale: This retains the ordinary verbal image and leaves the possible enduring or royal senses unmarked in the text.
- source_word: וְזִכְרְךָ
  chosen: and your name is remembered
  alternatives:
  - your memorial
  - your renown
  - the memory of you
  lexicon: HALOT
  rationale: In this enduring-remembrance formula, the noun refers naturally to Yahweh’s memorial name, memory, or mention; this rendering expresses the idiom in natural English.
- source_word: לְדֹר וָדֹר
  chosen: from generation to generation
  alternatives:
  - to generation and generation
  - for all generations
  lexicon: HALOT
  rationale: This idiom expresses continuity across successive generations. 'From generation to generation' is idiomatic English that preserves the distributive sense better than a wooden rendering.
