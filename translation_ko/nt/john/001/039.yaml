id: JHN.1.39
reference: John 1:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
  footnotes:
  - marker: a
    text: Or, if counted from sunrise, about 4:00 PM; some understand it by Roman reckoning as about 10:00 AM.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. 「오십시오. 그러면 보게 될 것입니다.」 그들이 가서 예수께서 머무르고 계신 곳을 보았고, 그날 그분과 함께 머물렀습니다. 때는 대략 열째 시였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 일출부터 계산하면 대략 오후 4시입니다. 일부는 로마식 계산에 따르면 대략 오전 10시로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔρχεσθε
  english_pob_choice: Come
  chosen_korean: 오십시오
  alternatives_korean:
  - 오라
  - 와라
  - 와서 보십시오
  lexicon: BDAG
  rationale: 원형은 2인칭 복수 명령형 초대입니다. 본문 전체 문체(현대 한국어 공식 합쇼체)와 인칭·예법을 맞추기 위해 공손한 명령형 '오십시오'를 택했고, 부드러운 초대의 뉘앙스를 보존하기 위해 '오십시오, 그러면 …' 구조로 병치했습니다.
- source_word: ὄψεσθε
  english_pob_choice: you will see
  chosen_korean: 보실 것입니다
  alternatives_korean:
  - 보리라
  - 보게 될 것이다
  - 보시리라
  lexicon: BDAG
  rationale: 미래형 강조를 살리기 위해 정중한 미래 서법 '보실 것입니다'를 사용했습니다. 이는 원문의 미래·서술적 힘을 한국어 공식문체로 전달합니다.
- source_word: ποῦ μένει
  english_pob_choice: where he was staying
  chosen_korean: 그가 어디에 머무는지
  alternatives_korean:
  - 그가 머무는 곳
  - 그가 머무르고 있는 곳
  - 그가 묵고 있는 곳
  lexicon: BDAG
  rationale: μένω는 일시적 거처(머무르다)의 의미로 읽힙니다. 질문·탐색의 의미를 살려 '어디에 머무는지 보았다'라는 간결한 명사절형으로 옮겼습니다.
- source_word: ὥρα ἦν ὡς δεκάτη
  english_pob_choice: It was about the tenth hour
  chosen_korean: 열째 시
  alternatives_korean:
  - 대략 오후 4시
  - 대략 오전 10시
  - 열 번째 시간
  lexicon: BDAG
  rationale: 원문은 시간 계수(ordinal) 표현을 사용하므로 본문에서는 문자적으로 '열째 시'를 유지했습니다. 시간 계산 방식이 본문에 명시되지 않아 현대적 시각시로 환산하면 해석적 결단이 필요하므로 본문은 원형을 보존하고 보충 설명을 각주로 달았습니다.
- source_word: λέγει αὐτοῖς
  english_pob_choice: He said to them
  chosen_korean: 말씀하셨다
  alternatives_korean:
  - 말한다
  - 말씀하신다
  lexicon: BDAG
  rationale: ἐνεστώς의 서사적 현재를 한국어 공식본문에서는 과거 서술형으로 자연스럽게 고쳐 '말씀하셨다'로 처리했습니다(문체 일관성 유지).
theological_decisions:
- issue: Reckoning of 'the tenth hour' (시간 계산 방식)
  chosen_reading: 본문에서는 문자형 '열째 시'를 그대로 보존하고 해석적 보충은 각주에 둡니다.
  alternative_readings:
  - 유대식(일출 기준)으로 계산하면 대략 오후 4시로 이해할 수 있다.
  - 로마식(자정 또는 자오 기준)으로 계산하면 대략 오전 10시로 이해할 수 있다.
  rationale: 본문은 어떤 시간 체계를 사용했는지 밝히지 않으므로 본문 자체를 보존하는 것이 통전적·투명한 번역 원칙에 부합합니다. 해석적 선택을 본문에 강제로 넣기보다 각주로 주요 해석 가능성을 제시합니다.
  doctrine_reference: 원문 충실성 및 해석적 투명성 보존
