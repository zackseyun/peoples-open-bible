id: HERM.V.2.ii
reference: Shepherd of Hermas — Vision 2, section ii
unit: section
book: Shepherd of Hermas
source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Μετὰ δὲ δέκα καὶ πέντε ἡμέρας νηστεύσαντός μου καὶ πολλὰ ἐρωτήσαντος τὸν Κύριον ἀπεκαλύφθη μοι
    ἡ γνῶσις τῆς γραφῆς. ἦν δὲ γεγραμμένα ταῦτα· 2. Τὸ σπέρμα σου, Ἑρμᾶ, ἠθέτησαν εἰς τὸν Θεὸν καὶ ἐβλασφήμησαν
    εἰς τὸν Κύριον καὶ προέδωκαν τοὺς γονεῖς αὐτῶν ἐν πονηρίᾳ μεγάλῃ, καὶ ἤκουσαν προδότας γονέων, καὶ
    προδόντες οὐκ ὠφελήθησαν, ἀλλὰ ἔτι προσεθήκαν ταῖς ἁμαρτίαις αὐτῶν τὰς ἀσελγηίας καὶ συμφυρμοὺς πονηρίας,
    καὶ οὕτως ἐπλήσθησαν αἱ ἀνομίαι αὐτῶν. 3. ἀλλὰ γνώρισον ταῦτα τὰ ῥήματα τοῖς τέκνοις σου πᾶσιν καὶ
    τῇ συμβίῳ σου τῇ μελλούσῃ σου ἀδελφῇ· καὶ γὰρ αὕτη οὐκ ἀπέχεται τῆς γλώσσης, ἐν ᾗ πονηρεύεται· ἀλλὰ
    ἀκούσασα τὰ ῥήματα ταῦτα ἀφέξεται, καὶ ἕξει ἔλεος. 4. μετὰ τὸ γνωρίσαι σε ταῦτα τὰ ῥήματα αὐτοῖς ἃ
    ἐνετείλατό μοι ὁ δεσπότης ἵνα σοι ἀποκαλυφθῇ, τότε ἀφίενται αὐτοῖς αἱ ἁμαρτίαι πᾶσαι ἃς πρότερον ἥμαρτον,
    καὶ πᾶσιν τοῖς ἁγίοις τοῖς ἁμαρτήσασιν μέχρι ταύτης τῆς ἡμέρας, ἐὰν ἐξ ὅλης τῆς καρδίας μετανοήσωσιν
    καὶ ἄρωσιν ἀπὸ τῆς καρδίας αὐτῶν τὰς διψυχίας. 5. ὤμοσεν γὰρ ὁ δεσπότης κατὰ τῆς δόξης αὐτοῦ ἐπὶ τοὺς
    ἐκλεκτοὺς αὐτοῦ· ἐὰν ὡρισμένης τῆς ἡμέρας ταύτης ἔτι ἁμάρτησις γένηται, μὴ ἔχειν αὐτοὺς σωτηρίαν·
    ἡ γὰρ μετάνοια τοῖς δικαίοις ἔχει τέλος· πεπλήρωνται αἱ ἡμέραι μετανοίας πᾶσιν τοῖς ἁγίοις· καὶ τοῖς
    δὲ ἔθνεσιν μετάνοιά ἐστιν ἕως ἐσχάτης ἡμέρας. 6. ἐρεῖς οὖν τοῖς προηγουμένοις τῆς ἐκκλησίας ἵνα κατορθώσωνται
    τὰς ὁδοὺς αὐτῶν ἐν δικαιοσύνῃ, ἵνα ἀπολάβωσιν ἐκ πλήρους τὰς ἐπαγγελίας μετὰ πολλῆς δόξης. 7. ἐμμείνατε
    οὖν οἱ ἐργαζόμενοι τὴν δικαιοσύνην καὶ μὴ διψυχήσητε, ἵνα γένηται ὑμῶν ἡ πάροδος μετὰ τῶν ἀγγέλων
    τῶν ἁγίων. μακάριοι ὑμεῖς ὅσοι ὑπομένετε τὴν θλῖψιν τὴν ἐρχομένην τὴν μεγάλην, καὶ ὅσοι οὐκ ἀρνήσονται
    τὴν ζωὴν αὐτῶν. 8. ὤμοσεν γὰρ Κύριος κατὰ τοῦ υἱοῦ αὐτοῦ, τοὺς ἀρνησαμένους τὸν Κύριον αὐτῶν ἀπεγνωρίσθαι
    ἀπὸ τῆς ζωῆς αὐτῶν, τοὺς νῦν μέλλοντας ἀρνεῖσθαι ταῖς ἐρχομέναις ἡμέραις· τοῖς δὲ πρότερον ἀρνησαμένοις
    διὰ τὴν πολυσπλαγχνίαν ἵλεως ἐγένετο αὐτοῖς.
  language: Greek
  pages:
  - 317
  - 318
  unit_id: V.2.ii
  label: Vision 2, section ii
  sequence: 6
translation:
  text: 'II.1. After fifteen days, when I had been fasting and had asked the Lord many things, the understanding
    of the writing[1] was revealed to me. And this was written:


    II.2. “Your offspring[2], Hermas, have rejected God[h] and blasphemed the Lord, and they have betrayed
    their parents in great wickedness, and they were heard as betrayers of parents; and though they betrayed
    them, they gained no advantage[i], but they added still to their sins licentious acts and interminglings
    of wickedness[3], and thus their lawless deeds were filled up.


    II.3. But make these words known to all your children and to your wife, who is to be your sister[4];
    for she too does not refrain from her tongue, by which she acts wickedly. But when she hears these
    words, she will refrain, and she will obtain mercy.


    II.4. After you have made known to them these words which the Master commanded me to reveal to you,
    then all their sins that they formerly committed are forgiven them, and also to all the holy ones[d]
    who have sinned up to this day, if they repent[c] with all their heart and remove from their heart
    their double‑mindedness[b][6].


    II.5. For the Master swore by his glory concerning his chosen ones: if, after this appointed day[e],
    sin should still occur, they have no salvation; for repentance has an end for the righteous. The days
    of repentance have been fulfilled for all the holy ones, but for the nations[9] there is repentance
    until the last day.


    II.6. Therefore you shall say to those who lead the church[10] that they should set their ways straight
    in righteousness, so that they may receive the promises in full, with much glory.


    II.7. Hold fast, then, you who work righteousness, and do not be double‑minded, so that your passage
    may be with the holy angels[11]. Blessed are you who endure the great tribulation that is coming,
    and who will not deny their life[12].


    II.8. For the Lord swore by his Son[13] that those who denied their Lord[f] are rejected from their
    life[a][14]—those who are now about to deny him in the coming days; but to those who denied before,
    because of his great compassion, he became merciful[g].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: ‘Writing’ renders γραφή here as the particular document revealed to Hermas within the vision,
      not ‘Scripture’ in general.
    reason: cultural_note
  - marker: '2'
    text: Offspring renders sperma, literally seed, a collective for descendants. Working Greek, Athos,
      Sinaiticus and both printed Latin versions retain it. D’Abbadie1860’s Latin rendering of Ethiopic
      printed116 lacks the separate offspring word in its main text; its footnote proposes a different
      Geʿez reading to agree with Greek and Latin. That proposal is not counted as preserved Ethiopic
      words.
    reason: lexical_alternative
  - marker: '3'
    text: Interminglings renders the rare symphyrmous; minglings or entanglements are alternatives. The
      working text closes the paragraph with their lawless deeds being filled up; Sinaiticus6.2 and both
      Latin printed versions retain that completion clause. Athos Plate I and the Ethiopic edition’s Latin
      rendering lack the separate closing fullness clause. It remains in the selected Greek.
    reason: lexical_alternative
  - marker: '4'
    text: The source calls her both wife and future sister, without explaining the relationship here.
      Vulgata printed9 retains the future sister wording; Palatina printed19 has a wife beginning to be
      a sister. Sinaiticus6.3 adds your before sister in ca, and transcribes the final mercy verb exeis,
      normally you will have, against working exei, she will have. The working third-person mercy promise
      to the wife is retained. The Ethiopic edition’s Latin rendering has the difficult phrase futurae
      tuae, your future one, rather than the same full wife/sister expression.
    reason: cultural_note
  - marker: '6'
    text: Double-mindedness renders dipsychia, divided or wavering intention. Here it must be removed
      from the heart; paragraph7 also forbids being double-minded. Vulgata printed10 lacks that separate
      prohibition in paragraph7. Palatina printed21 has the prohibition with nolite, an editorial emendation
      against reported non; the Ethiopic edition’s Latin rendering printed116 instead says do not despair.
      The selected Greek retains both removal in paragraph4 and the prohibition in paragraph7.
    reason: textual_variant
  - marker: '9'
    text: ‘The nations’ (ἔθνη) can also be rendered ‘the Gentiles.’ The contrast is between insiders (‘holy
      ones/righteous’) and outsiders.
    reason: lexical_alternative
  - marker: '10'
    text: ‘Those who lead the church’ translates τοῖς προηγουμένοις τῆς ἐκκλησίας, literally ‘those who
      go before’—a standard term for leaders/presiders.
    reason: cultural_note
  - marker: '11'
    text: Passage renders parodos; the source explicitly associates it with the holy angels but leaves
      the kind of passage unspecified here. Sinaiticus6.7 first hand has our and a different passage spelling;
      S1 changes these to your and parodos. Vulgata printed10 has transitus, passage; Palatina printed21
      has iter, journey; the Ethiopic edition’s Latin rendering printed116 has reditus, return. No particular
      death or judgment mechanism is added.
    reason: cultural_note
  - marker: '12'
    text: Will not deny their life preserves the working negative and the noun life. Athos, Sinaiticus6.7
      and both Latin printed versions retain the negative. Sinaiticus has a difficult life spelling corrected
      by S1, while ca changes their to their own; no added negative is encoded. D’Abbadie1860’s Latin
      rendering of Ethiopic printed116 instead has those who deny their life, positively. The source’s
      difficult negative remains without silently changing life into Lord or faith.
    reason: textual_variant
  - marker: '13'
    text: 'Oath formula: ‘swore by his Son,’ parallel to ‘by his glory’ above, underscores the solemnity
      of the declaration.'
    reason: cross_reference
  - marker: '14'
    text: The working print on Lightfoot & Harmer physical317/printed301 reads apegnoristhai, to have
      been disowned or repudiated. The import dropped ri and read apegnosthai; raw and normalized text
      are corrected to the actual print. Athos Plate I and Sinaiticus6.8 likewise retain the ri form.
      Are rejected keeps the resulting state; have been disowned is a more explicit perfect-passive alternative.
      The correction is a printed transcription repair, not an additional selected manuscript locus.
    reason: lexical_alternative
  - marker: a
    text: The perfect passive may be expressed as those who have denied their Lord have been disowned
      from their life. The following those who are now about to deny clause and the closing mercy to previous
      deniers remain distinct; this grammatical alternative does not erase either temporal group.
    reason: lexical_alternative
  - marker: b
    text: Or 'remove from their heart the double‑mindedness'.
    reason: lexical_alternative
  - marker: c
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: d
    reason: textual_variant
    text: The working Greek and Sinaiticus6.4 name all the holy ones who sinned up to this day and retain
      whole-hearted repentance together with removing double-mindedness as the condition. Athos has an
      explicit future forgiveness clause for the holy ones. Vulgata printed9 includes all saints in its
      main text, but its apparatus reports omission in D and Vat; its me in the commanded-revelation clause
      is an editorial emendation against reported him forms. Palatina printed21 and the Ethiopic edition’s
      Latin rendering printed116 have all who sinned without the explicit holy-ones label here. The selected
      scope and condition are preserved. Vulgata also adds she will be instructed before this forgiveness
      transition; that separate instructional clause is absent from the selected Greek.
  - marker: e
    reason: textual_variant
    text: The appointed-day warning states no salvation if sin still occurs, followed by the end of repentance
      for the righteous, completed repentance days for the holy ones, and repentance for the nations until
      the last day. Athos, Sinaiticus6.5 and both Latin versions retain that sequence; the Ethiopic edition’s
      Latin rendering has they will not live for the corresponding warning. No numbered calendar date
      or fifteen-day repentance deadline is supplied by the translation.
  - marker: f
    reason: textual_variant
    text: The working text says their Lord as the object of denial. Athos has Lord; Sinaiticus6.8 first
      hand has the abbreviation for Christ, changed by ca to Lord. Vulgata printed10 instead names the
      Son as the denied object; Palatina printed23 and the Ethiopic edition’s Latin rendering printed116
      have Lord. The oath by his Son remains in all these printed accounts. Correctors and printed translations
      are not additional independent manuscripts.
  - marker: g
    reason: textual_variant
    text: The working Greek, Athos and Sinaiticus6.8 close with mercy already shown to those who denied
      before. Palatina printed23 instead has future propitiabitur, will be merciful; the Ethiopic edition’s
      Latin rendering printed116 has future condonabit, will pardon. Vulgata printed10 has past propitius
      factus est, but its unquam, ever, before denied is an editorial emendation against reported nunquam,
      never, in its codices. That emendation cannot be counted as preserved Latin agreement with the working
      previous-deniers clause. The working past mercy and future-denial warning remain.
  - marker: h
    reason: textual_variant
    text: Working Greek, Athos and Sinaiticus6.2 distinguish rejecting God and blaspheming the Lord. Vulgata
      printed8 has sinning against the Lord without a separate blasphemy clause. Palatina printed19 and
      the Ethiopic edition’s Latin rendering printed116 use Lord in both corresponding clauses. The selected
      two clauses and God/Lord distinction remain. Ethiopic evidence throughout these notes is through
      the printed Latin rendering, not direct Geʿez or manuscript-photo collation.
  - marker: i
    reason: textual_variant
    text: The working Greek, Athos and Sinaiticus6.2 say the betrayal brought no advantage. Palatina printed19
      and the Ethiopic edition’s Latin rendering printed116 also deny a benefit. Vulgata printed9 instead
      has profecerunt, they profited, without the negative in its printed main text. The working no-advantage
      statement remains.
lexical_decisions:
- source_word: ἡ γνῶσις τῆς γραφῆς
  chosen: the understanding of the writing
  alternatives:
  - the understanding of the Scripture
  - knowledge of the writing
  lexicon: BDAG; LSJ
  rationale: γρᾰφή often means Scripture, but within this vision it refers to the particular writing shown
    to Hermas; rendering avoids over‑specifying canonical Scripture.
- source_word: σπέρμα
  chosen: offspring
  alternatives:
  - seed
  - descendants
  - children
  lexicon: BDAG; LSJ
  rationale: Concrete familial term; “offspring” preserves collective sense without implying only immediate
    children.
- source_word: ἠθέτησαν
  chosen: have rejected
  alternatives:
  - have broken faith with
  - have set aside
  - have betrayed
  lexicon: BDAG
  rationale: In Koine, ἀθετέω = reject/nullify; “rejected” reads naturally with God as object and matches
    subsequent blasphemy/betrayal.
- source_word: ἐβλασφήμησαν
  chosen: blasphemed
  alternatives:
  - slandered
  - reviled
  lexicon: BDAG
  rationale: Standard theological sense toward the Lord is appropriate.
- source_word: προέδωκαν
  chosen: betrayed
  alternatives:
  - handed over
  - delivered up
  lexicon: BDAG; LSJ
  rationale: With parents as object, “betrayed” best captures moral treachery.
- source_word: προδότας γονέων
  chosen: betrayers of parents
  alternatives:
  - betrayers of parents
  - those who betray parents
  lexicon: BDAG; LSJ
  rationale: Retain the label attached to the offspring; were called is an idiomatic alternative to were
    heard as.
- source_word: ἀσελγηίαι
  chosen: licentious acts
  alternatives:
  - debaucheries
  - sensualities
  lexicon: BDAG
  rationale: Common moral term; “licentious acts” is concrete and weighty.
- source_word: συμφυρμοὺς πονηρίας
  chosen: interminglings of wickedness
  alternatives:
  - entanglements in wickedness
  - mixtures of wickedness
  - complicity in evil
  lexicon: LSJ; Lampe (Patristic)
  rationale: συμφυρμός = mixing/commingling; here moral mixing/entanglement; chosen phrasing preserves
    metaphor while readable.
- source_word: συμβίος
  chosen: wife
  alternatives:
  - partner in life
  - spouse
  lexicon: LSJ; Lampe (Patristic)
  rationale: In context of household exhortation, the natural sense is spouse/wife.
- source_word: ἡ μελλοῦσά σου ἀδελφή
  chosen: who will be your sister
  alternatives:
  - who is to be your sister
  lexicon: BDAG; Lampe (Patristic)
  rationale: Preserves early Christian idiom of spiritual kinship without collapsing it into paraphrase.
- source_word: δεσπότης
  chosen: Master
  alternatives:
  - Lord
  - Sovereign
  lexicon: BDAG
  rationale: Differentiates from κύριος (“Lord”) later in the unit; “Master” reflects the nuance of δεσπότης
    used of God in Hermas.
- source_word: ἀφίενται
  chosen: are forgiven
  alternatives:
  - are forgiven
  lexicon: BDAG
  rationale: Preserve the selected present forgiveness formulation with its temporal setting and whole-hearted
    repentance/double-mindedness condition; alternatives and scope in note d.
- source_word: ἅγιοι
  chosen: holy ones
  alternatives:
  - saints
  lexicon: BDAG
  rationale: “Holy ones” preserves the adjective’s force and keeps consistency with “holy angels” in this
    unit.
- source_word: μετανοήσωσιν / μετάνοια
  chosen: repent / repentance
  alternatives:
  - reorient / reorientation
  - repent / repentance
  - change their mind / change of mind
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial
    assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: διψυχίαι
  chosen: double‑mindedness
  alternatives:
  - doubts
  - vacillation
  lexicon: BDAG; Lampe (Patristic)
  rationale: Hermas uses διψυχία as a technical moral failing; “double‑mindedness” is the established,
    concrete rendering.
- source_word: ὤμοσεν … κατὰ τῆς δόξης αὐτοῦ
  chosen: swore by his glory
  alternatives:
  - swore against his glory
  - swore on his glory
  lexicon: BDAG; LSJ
  rationale: κατά + gen. in oath formula = “by”; the idiom is preserved.
- source_word: ἐκλεκτοί
  chosen: chosen ones
  alternatives:
  - elect
  lexicon: BDAG
  rationale: “Chosen ones” is transparent; “elect” is more technical; both valid.
- source_word: ἡμέραι μετανοίας πεπλήρωνται
  chosen: the days of repentance have been fulfilled
  alternatives:
  - the days of reorientation have been fulfilled
  - the days of repentance have been fulfilled
  - the days of repentance are complete
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial
    assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: ἔθνεσιν
  chosen: the nations
  alternatives:
  - the Gentiles
  lexicon: BDAG
  rationale: Hermas likely contrasts believers and non‑Jews; “the nations” preserves OT/LXX resonance;
    “Gentiles” noted as alternative.
- source_word: προηγούμενοι τῆς ἐκκλησίας
  chosen: those who lead the church
  alternatives:
  - the leaders of the church
  - those who preside in the church
  lexicon: BDAG; LSJ; Lampe (Patristic)
  rationale: Participle ‘those who go before’ is a standard term for leaders; chosen phrasing is clear
    and preserves church‑order nuance.
- source_word: κατορθώσωνται τὰς ὁδοὺς
  chosen: set their ways straight
  alternatives:
  - straighten their ways
  - make their paths right
  lexicon: LSJ
  rationale: κατορθόω = set right/straight; with ‘ways/paths’ a moral metaphor; chosen rendering keeps
    imagery.
- source_word: ἐμμείνατε
  chosen: Hold fast
  alternatives:
  - Remain
  - Continue steadfast
  lexicon: BDAG
  rationale: Imperative of perseverance; “Hold fast” is vivid and concise.
- source_word: πάροδος
  chosen: passage
  alternatives:
  - passing over
  - transit
  lexicon: LSJ; Lampe (Patristic)
  rationale: Metaphor for the passage through death/judgment; “passage” preserves imagery without over‑interpreting.
- source_word: θλῖψις ἡ ἐρχομένη ἡ μεγάλη
  chosen: the great tribulation that is coming
  alternatives:
  - the coming great affliction
  lexicon: BDAG
  rationale: θλῖψις = tribulation/affliction; chosen phrasing echoes eschatological tone without importing
    NT as a title.
- source_word: ὤμοσεν … κατὰ τοῦ υἱοῦ αὐτοῦ
  chosen: swore by his Son
  alternatives:
  - swore on his Son
  lexicon: BDAG; LSJ
  rationale: Parallel oath formula to ‘by his glory’; preserves striking theology without smoothing.
- source_word: ἀπεγνωρίσθαι ἀπὸ τῆς ζωῆς
  chosen: are rejected from their life
  alternatives:
  - to be disowned from life
  - to be cut off from life
  lexicon: BDAG; LSJ
  rationale: Correct the Greek lemma to the actual printed perfect passive with ri; preserve the disowned
    state, future-denial warning and prior-deniers mercy, with perfect alternative in notes.
