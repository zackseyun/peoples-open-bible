  to: '1. 이 희년의 넷째 주 다섯째 해, 셋째 달 중순에 아브람은 밀 수확의 첫 열매 절기를 지켰습니다.

    2. 그는 제단 위에 새 제물을 바쳤습니다. 곧 소산의 첫 열매를 주님께 드린 것입니다. 그는 황소와 염소와 양을 제단 위에서 주님께 향기로운 냄새가 되도록 바쳤고, 그에 딸린 소제와 전제를 향과 함께 제단 위에 바쳤습니다.

    3. 주님께서 아브람에게 나타나셔서 그에게 말씀하셨습니다. “나는 하나님 샷다이이다. 내 앞에서 나를 기쁘게 하시고, 흠이 없으십시오.”

    4. 내 언약을 나와 너 사이에 세우고, 너를 크게 번성하게 하겠습니다.

    5. 아브람이 얼굴을 땅에 대고 엎드리자 하나님께서 그에게 말씀하여 이르셨습니다. “보십시오, 내 언약이 너와 함께 있으며, 너는 많은 민족의 아버지가 될 것입니다.”

    7. 당신의 이름은 다시는 아브람이라 불리지 않을 것이며, 이제부터 영원히 아브라함이라 불릴 것입니다. 내가 당신을 많은 민족의 아버지로 삼았기 때문입니다.

    8. 내가 너를 매우 크게 하며, 너에게서 여러 민족이 나오게 하겠고, 왕들도 너에게서 나올 것입니다. 또 내가 나와 너와 네 뒤를 이을 네 후손 사이에 내 언약을 세워, 그들의 대대로 영원한 규례가 되게 하겠습니다. 이는 내가 너와 네 뒤를 이을 네 후손에게 하나님이 되기 위함입니다.

    10. 내가 너와 네 뒤를 이을 네 씨에게, 네가 나그네로 머물렀던 땅 곧 가나안 땅을 영원한 소유로 줄 것이며, 그들의 하나님이 되겠습니다.”

    11. 주님께서 아브라함에게 말씀하셨습니다. “너는 내 언약을 지키십시오. 너와 네 뒤를 이을 네 자손도 그렇게 해야 합니다. 너희 가운데 있는 모든 남자는 할례를 받으십시오. 너희 포피의 살을 할례하십시오. 이것이 나와 너희 사이에 영원한 규례의 표징이 될 것입니다. 너희 가운데 있는 모든 남자는 난 지 여드레째 되는 날 할례를 받아야 합니다. 곧 집에서 난 자와, 너희 자손에게서 나지 않은 이방인의 아들들 가운데 너희가 금으로 산 자도 할례를 받아야 합니다. 네 집에서 난 자는 반드시 할례를 받아야 하고, 네가 금으로 산 자도 할례를 받아야 합니다. 그러면 내 언약이 너희의 살에 영원한 규례로 있을 것입니다. 그러나 포피의 살에 할례를 받지 않은 무할례 남자, 곧 여드레째 되는 날 할례를 받지 않은 사람은 자기 친족에게서 끊어질 것입니다. 그가 내 언약을 깨뜨렸기 때문입니다.”


    주님께서 아브라함에게 또 말씀하셨습니다. “네 아내 사래는 이제 더 이상 사래라는 이름으로 부르지 마십시오. 그의 이름은 사라입니다. 내가 그를 복 주고, 그에게서 네게 아들을 주겠습니다. 내가 그 아들을 복 주겠고, 그는 한 민족이 될 것이며, 여러 민족의 왕들이 그에게서 나올 것입니다.”


    아브라함은 얼굴을 땅에 대고 엎드려 기뻐하며 마음속으로 말했습니다. “백 살 된 사람에게 아들이 태어날 수 있겠는가? 아흔 살 된 사라가 아이를 낳을 수 있겠는가?” 아브라함이 주님께 말했습니다. “부디 이스마엘이 주님 앞에서 살게 해 주십시오!”


    하나님께서 말씀하셨습니다. “그렇습니다. 네 아내 사라가 네게 아들을 낳을 것이니, 너는 그의 이름을 이삭이라 부르십시오. 내가 그와 더불어 내 언약을 세우겠습니다. 그것은 그의 뒤를 이을 그의 자손과 맺는 영원한 언약이 될 것입니다. 이스마엘에 관해서도 내가 네 말을 들었습니다. 보십시오, 내가 그를 복 주고 번성하게 하며, 그를 매우 크게 번성하게 하겠습니다. 그는 열두 통치자를 낳을 것이며, 내가 그를 큰 민족이 되게 하겠습니다. 그러나 내가 내 언약은 이삭과 더불어 세우겠습니다. 사라가 내년 이맘때 그를 네게 낳을 것입니다.”


    하나님께서는 그와 말씀을 마치시고 아브라함에게서 올라가셨습니다. 아브라함은 주님께서 그에게 말씀하신 대로 행했습니다. 그는 자기 아들 이스마엘과 자기 집에서 난 모든 사람과 금으로 산 모든 사람, 곧 자기 집에 있는 모든 남자를 데리고 그들의 포피의 살을 할례했습니다. 바로 그날 아브라함도 할례를 받았고, 그의 집의 모든 남자, 곧 그의 집에서 난 자들과 이방인의 아들들 가운데 금으로 산 모든 자도 그와 함께 할례를 받았습니다.


    이것은 모든 세대를 위한 영원한 법입니다. 날을 미루어서도 안 되며, 여드레 가운데 단 하루도 빠뜨려서는 안 됩니다. 이는 하늘의 서판에 정해지고 기록된 영원한 규례이기 때문입니다. 난 지 여드레째 되는 날 포피의 살에 할례를 받지 않은 모든 사람은 주님께서 아브라함과 맺으신 언약의 자손에 속하지 않습니다. 그는 멸망의 자손에 속하며, 그에게는 자신이 주님께 속했다는 표징이 없습니다. 그는 멸망하도록, 땅에서 멸망당하도록, 땅에서 뿌리째 뽑히도록 정해졌습니다. 그가 주 우리 하나님의 언약을 깨뜨렸기 때문입니다.

    27. 모든 임재의 천사들과 모든 거룩함의 천사들의 창조는 창조된 날부터 이와 같았습니다. 그는 임재의 천사들과 거룩함의 천사들 앞에서 이스라엘을 거룩하게 하셨으니, 그들이 그와 그의 거룩한 천사들과 함께 있게 하시려는 것이었습니다.

    28. 그리고 당신은 이스라엘 자손에게 명령하여, 그들이 대대로 영원한 규례로 언약의 표를 지키게 하십시오. 그들은 그 땅에서 뽑히지 않을 것입니다.

    29. 이는 모든 이스라엘 자손이 그것을 영원히 지키도록 그 명령이 언약으로 제정되었기 때문입니다.

    30. 이시마엘과 그의 아들들과 그의 형제들과 에서를 주께서는 자기에게 가까이하지 않으셨고, 그들이 아브라함의 자녀들이라고 해서 그들을 택하지 않으셨습니다. 그분은 그들을 아셨고, 이스라엘을 택하여 자기 백성으로 삼으셨습니다.

    31. 그리고 그를 거룩하게 하시고 모든 사람의 자손 가운데서 그를 모으셨습니다. 이는 많은 민족과 많은 백성이 있고, 그들 모두는 그의 것이며, 그들 모두 위에 영들을 두셔서 그들이 그를 따르지 않도록 미혹하게 하셨기 때문입니다.

    32. 그러나 그분께서는 이스라엘을 어떤 천사나 영에게도 넘겨 주거나 맡기지 않으셨습니다. 오직 그분만이 그들의 통치자이시며, 그분께서는 그들을 지키시고 자기 천사들과 자기 영들과 자기의 모든 권세자들의 손에서 그들을 되찾아 요구하실 것입니다. 이는 그분께서 그들을 지키시고 복을 주시며, 그들이 그분의 것이 되고 그분께서 그들의 것이 되시도록 하시려는 것입니다. 이제부터 영원까지 그러하실 것입니다.

    33. 그리고 이제 내가 너희에게 말합니다. 이스라엘 자손은 이 규례를 지키지 않을 것이며, 율법 전체에 따라 자기 아들들에게 할례를 행하지도 않을 것입니다. 그들은 아들들에게 할례를 행할 때 잘라 내야 할 살 일부를 남겨 둘 것이며, 벨리알의 모든 자손은 태어날 때 그대로 자기 아들들을 할례받지 않은 채로 둘 것입니다.

    34. 그리고 이스라엘 자손에게 주님으로부터 큰 진노가 있을 것입니다. 그들이 그의 언약을 버리고 그의 말씀에서 돌아서며, 주님을 격노하게 하고 모독했기 때문입니다. 이는 그들이 이 법의 규례를 지키지 않았기 때문입니다. 그들은 민족들처럼 되어 땅에서 뿌리째 뽑혀 멸망할 것입니다. 또한 그들에게는 이 영원한 그릇됨의 모든 죄에 대하여 더 이상 용서나 사함이 없을 것이며, 그들은 용서받거나 사함을 받지 못할 것입니다.'
