  from: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
  to: So Abraham took the wood for the burnt offering and laid it on his son Isaac. He himself carried the fire[a] and the knife, and the two of them walked on together.
  rationale: The lexical record rightly avoids specifying a firepot in the main text and preserves the burden placed on Isaac. “Carried” conveys the hand construction naturally, while a brief note supplies the background modern readers may lack.
