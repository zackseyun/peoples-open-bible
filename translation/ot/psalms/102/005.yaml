id: PSA.102.5
reference: Psalms 102:5
source:
  edition: WLC
  text: מִ/קּ֥וֹל אַנְחָתִ֑/י דָּבְקָ֥ה עַ֝צְמִ֗/י לִ/בְשָׂרִֽ/י׃
translation:
  text: Because of my groaning, my bones cling to my skin.
  philosophy: dynamic
lexical_decisions:
- source_word: מִ/קּוֹל
  chosen: Because of
  alternatives:
  - Because of
  - At the sound of
  - From the voice of
  lexicon: HALOT
  rationale: The phrase most naturally marks the cause of the psalmist’s wasting, while its more literal form is preserved in the note.
- source_word: אַנְחָתִי
  chosen: my groaning
  alternatives:
  - my sighing
  - my lament
  lexicon: HALOT
  rationale: The noun denotes groaning or sighing arising from distress. 'Groaning' best matches the intensity of the lament and fits the bodily imagery of the verse.
- source_word: דָּבְקָה
  chosen: cling
  alternatives:
  - stick
  - cleave
  - are stuck
  lexicon: HALOT
  rationale: The verb דבק commonly means 'cling/stick fast.' 'Cling' preserves the vivid physical image in idiomatic modern English without sounding archaic like 'cleave.'
- source_word: עַצְמִי
  chosen: my bones
  alternatives:
  - my bone
  lexicon: HALOT
  rationale: Though morphologically singular in form with suffix, עֶצֶם often functions collectively. English idiom prefers the plural 'my bones' for the body frame in poetic lament.
- source_word: לִבְשָׂרִי
  chosen: to my flesh
  alternatives:
  - to my skin
  - to my body
  lexicon: HALOT
  rationale: “Flesh” preserves the ordinary lexical value of בָּשָׂר; “skin” is contextually plausible in the emaciation image but is retained as an alternative rather than made explicit in the main text.
