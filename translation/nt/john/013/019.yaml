  rationale: The phrase likely carries more than simple self-reference in John, potentially echoing Isaianic and divine-identification language. However, the Greek lacks an explicit predicate, and the translation should preserve the tension rather than over-resolve it. 'I am he' gives intelligible English while a footnote preserves the more literal 'I am' and alerts readers to the possible theological weight.
