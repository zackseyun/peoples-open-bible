  chosen_reading: ‘그 주위’를 통해 히브리어의 3인칭 여성형 목적어를 한국어에서도 가능한 한 보존했습니다.
  alternative_readings:
  - ‘그 주위를’ 대신 단순히 ‘주위를’로 처리
