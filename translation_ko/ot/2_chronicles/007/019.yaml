  yaml_path: translation/ot/2_chronicles/007/019.yaml
  text: But if you turn away and abandon my statutes and my commandments that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: ko
  text: 그러나 여러분이 돌이켜, 내가 여러분 앞에 둔 내 규례와 내 계명을 버리고, 가서 다른 신들을 섬기며 그들에게 절한다면,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשׁוּבוּן / turn away
  english_pob_choice: turn away
  chosen_korean: 돌이켜
  alternatives_korean:
  - 떠나
  - 돌아서
  - 되돌아
  lexicon: שוב
  rationale: 회개적 ‘돌이킴’의 방향 전환을 살리되, 여기서는 하나님께로 돌아오는 긍정이 아니라 언약에서 이탈하는 반대 방향이므로 ‘돌이켜’가 자연스럽습니다.
- source_word: וַעֲזַבְתֶּם / abandon
  english_pob_choice: abandon
  chosen_korean: 버리고
  alternatives_korean:
  - 떠나고
  - 저버리고
  - 내팽개치고
  lexicon: עזב
  rationale: POB의 ‘abandon’을 따라 언약적 규범을 의도적으로 포기하는 뉘앙스를 살리며, ‘저버리고’보다 문맥상 간결하고 직접적입니다.
- source_word: חֻקּוֹתַי / my statutes; מִצְוֹתַי / my commandments
  english_pob_choice: my statutes and my commandments
  chosen_korean: 내 규례와 내 계명
  alternatives_korean:
  - 내 법도와 내 명령
  - 내 규정과 내 계명
  lexicon: חקים; מצות
  rationale: 율법 전승의 두 용어를 한국어 성경에서 흔한 ‘규례/계명’으로 구분해, 상호 병렬과 권위성을 함께 전달합니다.
- source_word: וְהִשְׁתַּחֲוִיתֶם / bow down
  english_pob_choice: bow down
  chosen_korean: 절하면
  alternatives_korean:
  - 엎드리면
  - 경배하면
  lexicon: שתחוה
  rationale: 우상 숭배의 몸짓을 한국어로 명확하게 드러내되, 문맥상 예배 행위의 외형을 가장 직접적으로 보여 주는 ‘절하다’를 택했습니다.
theological_decisions:
- issue: 언약 위반의 동사 묶음(돌이킴-버림-섬김-절함)
  chosen_reading: 불순종의 점진적 심화를 보여 주는 연쇄로 유지했습니다.
  alternative_readings:
  - 각 동사를 완화하여 도덕적 실패 정도로 표현
  - ‘절하다’를 ‘경배하다’로 완화
  rationale: 본문은 단순한 실수보다 언약 파기와 우상숭배의 전면적 전환을 경고하므로, 동사들의 강도를 보존하는 것이 source-direct합니다.
  doctrine_reference: 언약 신실성 / 우상숭배 경고
