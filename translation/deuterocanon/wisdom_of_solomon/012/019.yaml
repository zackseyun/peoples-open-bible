id: WIS.12.19
reference: Wisdom of Solomon 12:19
source:
  edition: lxx-swete-1909
  text: ἐδίδαξας δέ σου τὸν λαὸν διὰ τῶν τοιούτων ἔργων, ὅτι δεῖ τὸν δίκαιον εἶναι φιλάνθρωπον· καὶ εὐέλπιδας ἐποίησας τοὺς υἱούς σου, ὅτι διδοῖς ἐπὶ ἁμαρτήμασιν μετάνοιαν.
  language: Greek
  pages:
