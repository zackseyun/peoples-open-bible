lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 찬양대 지휘자에게
  - 음악 감독에게
  - 지휘 책임자에게
  lexicon: HALOT
  rationale: 시편 표제의 לְ는 대상 표시로 자연스럽게 옮기고, מְנַצֵּחַ는 예배 음악을 이끄는 사람을 가리키므로 현대 한국어로는 '지휘자'가 가장 간결하고 기능을 잘 드러냅니다.
- source_word: מִזְמ֥וֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  - 찬가
  lexicon: HALOT
  rationale: מִזְמ֤וֹר는 장르 표지이므로 '시'로 옮겨 한국어 성경에서 익숙한 표제를 유지하되, 본문 안에서의 문학 형식도 자연스럽게 드러냅니다.
- source_word: לְ/דָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에 의한
  - 다윗을 위한
  - 다윗에게 속한
  lexicon: HALOT
  rationale: לְדָוִד는 저작, 관련, 헌정의 가능성을 모두 열어 두므로 '다윗의'로 옮겨 영어 POB의 'of David'가 유지한 관계적 모호성을 한국어에서도 보존합니다.
theological_decisions:
- issue: 시편 표제에서 לְדָוִד의 관계 의미
  chosen_reading: '''다윗의''로 두어 저자표시와 관련표시의 양면성을 열어 둡니다.'
  alternative_readings:
  - '''다윗이 쓴''으로 저작을 단정하는 읽기'
  - '''다윗을 위한''으로 헌정만 강조하는 읽기'
  rationale: 히브리어 표제는 저작자, 관련, 헌정의 뜻을 모두 가질 수 있으므로, 본문이 허용하는 긴장을 해소하지 않고 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3
