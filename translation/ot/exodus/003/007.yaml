  - I am aware of their sufferings
  - I have taken notice of their pains
  rationale: The Hebrew uses ordinary human language for God's personal knowledge of Israel's suffering. The translation preserves this theological immediacy rather than softening it into abstract awareness.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
