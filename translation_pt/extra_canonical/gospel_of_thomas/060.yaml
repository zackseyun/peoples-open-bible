base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/060.yaml
  text: '⟨They saw⟩ a Samaritan carrying a lamb[a], going into Judea. He said to his disciples, "That one around the lamb?"

    They said to him, "So that he may kill it and eat it."

    He said to them, "As long as it is alive, he will not eat it, but if he kills it and it becomes a corpse."

    They said, "Otherwise he will not be able to do it."

    He said to them, "You yourselves, seek a place for yourselves in rest[b][c], so that you will not become a corpse and they eat you."'
translation:
  language: pt
  text: '⟨Eles viram⟩[a] um samaritano carregando um cordeiro e entrando na Judeia. Ele disse aos seus discípulos: “Aquele ali, em torno do cordeiro?”[b]


    Eles lhe disseram: “Para que o mate e o coma.”


    Ele lhes disse: “Enquanto estiver vivo, ele não o comerá; mas, se o matar, ele se tornará um cadáver.”


    Eles disseram: “De outro modo, ele não poderá fazê-lo.”


    Ele lhes disse: “Vocês mesmos, procurem para si um lugar no descanso, para que não se tornem um cadáver e eles comam vocês.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito não traz um verbo principal no início, lendo literalmente algo como “a um samaritano”. A expressão “Eles viram” é uma restauração editorial para completar o sentido.
    reason: textual_variant
  - marker: b
    text: 'O copta é elíptico, literalmente: “Aquele ali em torno do cordeiro?”. A resposta dos discípulos mostra que entenderam a fala como uma pergunta sobre a intenção do homem.'
    reason: lexical_alternative
  - marker: c
    text: 'O copta emprega uma forma ativa na terceira pessoa do plural: “e eles comam vocês”. O sujeito de “eles” não é identificado.'
    reason: register_note
lexical_decisions:
- source_word: ⲥⲁⲙⲁⲣⲉⲓⲧⲏⲥ
  choice: samaritano
  rationale: Equivalente direto do etnônimo, sem explicação interpretativa no corpo do texto.
- source_word: ϩⲓⲉⲓⲃ
  choice: cordeiro
  rationale: Designa um ovino jovem; “cordeiro” conserva a imagem concreta e seu possível peso simbólico sem explicitá-lo.
- source_word: ⲡⲏ ⲙ̄ⲡⲕⲱⲧⲉ ⲙ̄ⲡⲉϩⲓⲉⲓⲃ
  choice: Aquele ali, em torno do cordeiro?
  rationale: Mantém a formulação nominal e elíptica do copta, em vez de acrescentar um verbo ou uma pergunta causal ausentes do texto.
- source_word: ⲡⲧⲱⲙⲁ
  choice: cadáver
  rationale: O empréstimo grego πτῶμα denota aqui um corpo morto; “cadáver” preserva a repetição entre o cordeiro e os discípulos.
- source_word: ϣⲁ
  choice: poder
  rationale: Expressa capacidade; com o marcador de Futuro I, resulta em “não poderá”.
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: descanso
  rationale: Equivalente corrente do empréstimo grego ἀνάπαυσις, preservando seu sentido aberto de repouso e possível estado ou destino espiritual.
theological_decisions:
- issue: Sentido da pergunta elíptica sobre o samaritano e o cordeiro
  choice: 'Preservar a elipse: “Aquele ali, em torno do cordeiro?”'
  alternative: “Por que aquele homem está carregando o cordeiro?”
  rationale: A resposta dos discípulos sugere uma pergunta sobre finalidade, mas o copta não explicita “por quê” nem repete o verbo “carregar”; a tradução não resolve silenciosamente essa dificuldade.
- issue: Sentido de “descanso”
  choice: Manter “descanso” sem paráfrase doutrinária
  alternative: “repouso eterno” ou “salvação”
  rationale: O termo pode ter alcance espiritual no Evangelho de Tomé, mas o texto não define aqui sua natureza; uma expansão fecharia indevidamente o sentido.
- issue: Metáfora final do cadáver devorado
  choice: Conservar literalmente “tornem um cadáver” e “eles comam vocês”
  alternative: Parafrasear como destruição ou condenação espiritual
  rationale: A imagem deliberadamente tensa liga os discípulos ao cordeiro; interpretá-la no corpo do texto eliminaria sua força e ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. A sintaxe foi mantida próxima do copta, sobretudo na pergunta elíptica e na repetição de “cadáver”. O “sim” após a oração condicional torna explícito em português o contraste predicativo já exigido pela construção copta, sem acrescentar uma interpretação teológica.
