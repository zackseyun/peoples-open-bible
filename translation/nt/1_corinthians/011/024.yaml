id: 1CO.11.24
reference: 1 Corinthians 11:24
source:
  edition: SBLGNT
  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
translation:
  text: And after giving thanks, he broke it and said, “This is my body, which is for you[a]. Keep doing this in remembrance of me.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'Some manuscripts add “broken”: “which is broken for you.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  chosen: after giving thanks
  alternatives:
  - having given thanks
  - when he had given thanks
  lexicon: BDAG
  rationale: Aorist participle preceding the main verb; 'after giving thanks' is natural modern English and preserves the temporal/sequential sense without unnecessary stiffness.
- source_word: ἔκλασεν
  chosen: he broke it
  alternatives:
  - he broke
  lexicon: BDAG
  rationale: The verb means 'broke'; English idiom supplies the object from context (the bread), making the action clear for readers.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  chosen: This is my body
  alternatives:
  - This is the body of me
  - This means my body
  lexicon: BDAG
  rationale: The straightforward copular construction is best rendered directly. 'Means' would import an interpretive paraphrase not demanded by the Greek.
- source_word: τὸ ὑπὲρ ὑμῶν
  chosen: which is for you
  alternatives:
  - which is on your behalf
  - which is for your sake
  lexicon: BDAG
  rationale: ὑπέρ with genitive commonly conveys representation or benefit ('for, on behalf of'). 'For you' is concise and preserves the sacrificial/benefactive force without over-specifying a doctrinal theory of atonement.
- source_word: τοῦτο ποιεῖτε
  chosen: Keep doing this
  alternatives:
  - Do this
  lexicon: BDAG
  rationale: The present imperative naturally supports customary or repeated practice in this institution context. 'Keep doing this' makes that ongoing force explicit in English.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  chosen: in remembrance of me
  alternatives:
  - as my memorial
  - for my remembrance
  lexicon: BDAG
  rationale: Ἀνάμνησις denotes an act of remembrance or memorial commemoration. 'In remembrance of me' preserves the active memorial force of the Communion command in clear English, while avoiding the funeral-like connotation that 'memorial' can carry by itself.
