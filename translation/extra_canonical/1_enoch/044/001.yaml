translation:
  text: 'And another thing I saw concerning lightning: how some of the stars arise and become lightning, and they cannot depart along with them[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The closing clause is uncertain. This rendering retains the selected Charles Geʿez plural relation, 'with them,' rather than replacing it with 'it.' The referent and force of 'depart' are not clear. Other manuscript forms and an explanatory gloss are recorded in Charles 1906, printed page85, note1; the verse is visionary imagery, not a scientific account of lightning.
    reason: textual_variant
lexical_decisions:
- source_word: ካልእተ
  chosen: another thing
  alternatives:
  - another
  - a second thing
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Introduces a new visionary item. Rendering it as 'another thing' preserves the resumptive apocalyptic style better than a bare 'another.'
- source_word: ርኢኩ
  chosen: I saw
  alternatives:
  - I beheld
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Standard first-person visionary report; 'I saw' is clear modern English while preserving the report formula.
- source_word: በእንተ
  chosen: concerning
  alternatives:
  - about
  - regarding
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Keeps the explanatory relation without overinterpreting the syntax.
- source_word: መብረቅ
  chosen: lightning
  alternatives:
  - flash
  - brightness
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The ordinary apocalyptic image here is lightning, and the same noun recurs later in the verse; consistency is preferable.
- source_word: እፎ
  chosen: how
  alternatives:
  - in what manner
  - that
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Introduces the content of what was seen in a vivid descriptive way.
- source_word: ይቀውሙ
  chosen: stand out
  alternatives:
  - stand
  - take their stand
  - arise
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: A simple 'stand' is possible, but with 'from the stars' the sense seems to be emergence or standing forth from among them.
- source_word: እምከዋክብተ
  chosen: from the stars
  alternatives:
  - out of the stars
  - among the stars
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The preposition most naturally marks source or separation. 'From the stars' preserves the imagery without forcing a cosmological explanation.
- source_word: ወይከውኑ
  chosen: and become
  alternatives:
  - and are
  - and come to be
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The verb of becoming fits the transformation imagery better than a static copula.
- source_word: ወኢይክሉ
  chosen: and they are not able
  alternatives:
  - and they cannot
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Retains the explicit incapacity expressed in the Ge'ez.
- source_word: ኃዲገ
  chosen: depart
  alternatives:
  - leave
  - leave off
  - cease
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The restored complete closing clause includes a plural relation ('with them'). 'Depart' keeps a cautious motion/withdrawal sense without silently asserting that lightning stops; the remaining uncertainty is disclosed in the note.
- source_word: ምስሌሆሙ
  chosen: along with them
  alternatives:
  - with them
  lexicon: Selected Charles 1906 Geʿez text; no specific lexicon entry independently verified in this application
  rationale: Retains the recovered plural relational ending. Its precise antecedent remains uncertain and is not replaced with a singular object.
