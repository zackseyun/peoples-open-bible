- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Relationship of singular 'commandment' to plural 'statutes and judgments'
  chosen_reading: 'Retain both, with singular as a collective heading: ''the commandment—the statutes and the judgments'''
  alternative_readings:
  - 'Smooth to all-plural: ''the commandments, statutes, and judgments'''
  rationale: The Hebrew text has singular מִצְוָה followed by plural categories. Preserving the number distinction reflects the source text and avoids harmonizing away a likely summary-plus-expansion structure.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #5'
