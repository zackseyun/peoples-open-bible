  - 기도
  lexicon: BDAG
  rationale: δέησις는 간절한 요청을 가리키므로, 정중하면서도 긴박한 뉘앙스를 살리는 ‘간구’가 적절합니다.
- source_word: πτωχοῦ
  english_pob_choice: a poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 가난한 남자
  lexicon: BDAG
  rationale: 그리스어는 남성 단수이지만 한국어에서는 불필요한 성별 표지를 피하면서도 단수의 개별성을 살릴 수 있는 ‘가난한 사람’이 자연스럽습니다.
- source_word: ἐν ἐλπίδι
  english_pob_choice: in hope
  chosen_korean: 희망 가운데
  alternatives_korean:
  - 소망 안에서
  - 희망으로
  lexicon: BDAG
  rationale: 짧은 전치사구의 상태·태도를 한국어에서 가장 매끄럽게 드러내는 표현으로 ‘희망 가운데’를 택했습니다.
- source_word: τὰ κρίματά σου
  english_pob_choice: your judgments
  chosen_korean: 주님의 심판
  alternatives_korean:
  - 주님의 판단
  - 주님의 결정들
  lexicon: BDAG
  rationale: κρίματα는 하나님의 통치적 판결과 판단을 가리키므로, 문맥상 무게를 살리는 ‘심판’이 적절합니다.
- source_word: μετὰ ἐλέους
  english_pob_choice: with mercy
  chosen_korean: 자비와 함께합니다
  alternatives_korean:
  - 자비로
  - 자비 가운데
  lexicon: BDAG
  rationale: ‘심판’과 결합된 자비의 동반성을 살리기 위해, 부사화보다 관계적 표현인 ‘자비와 함께합니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: ‘심판’과 ‘자비’의 병치
  chosen_reading: 주님의 심판은 온 땅 위에 있으며, 자비와 함께합니다.
  alternative_readings:
  - 주님의 심판은 온 땅 위에 있습니다—자비로.
  - 주님의 심판은 온 땅 위에 있으며 자비롭습니다.
  rationale: 원문은 하나님의 전 지구적 심판을 약화시키지 않으면서도 그 심판이 자비와 함께한다는 긴장을 유지합니다. 한국어에서도 두 속성을 분리하지 않고 함께 제시했습니다.
  doctrine_reference: 시편적 신정론; 하나님의 공의와 긍휼의 동시성
