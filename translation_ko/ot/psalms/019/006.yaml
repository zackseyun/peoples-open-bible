  lexicon: HALOT
  rationale: חֻפָּה는 결혼 천막/신방 모두 가능하므로, 본문 맥락에서 신랑이 흥겨움 속에 나오는 장면을 드러내는 ‘신방’으로 번역했습니다.
- source_word: כְּגִבּוֹר לָרוּץ
  english_pob_choice: like a warrior to run
  chosen_korean: 용사처럼 달리기를
  alternatives_korean:
  - 용사처럼 달려가기를
  - 장사처럼 달리기를
  lexicon: HALOT
  rationale: גִּבּוֹר의 힘찬 전사 이미지를 ‘용사’로 살리고, לָרוּץ는 목적 동작으로 자연스럽게 연결했습니다.
