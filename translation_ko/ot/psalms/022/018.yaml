  rationale: 제시된 히브리어 본문에 맞추어 번역을 전면 교체했습니다. ‘내 옷’(בְגָדַי)과 ‘내 의복’(לְבוּשִׁי)의 시적 병행을 보존하고, לָהֶם은 ‘자기들끼리’로, ‘제비를 던지다’라는 히브리어 관용구는 자연스러운 한국어인 ‘제비를 뽑습니다’로 옮겼습니다. 기존의 무관한 어휘·신학 각주는 제거하고 영어 POB 감사 기록의 교차 참조를 한국어로 제공했습니다.
