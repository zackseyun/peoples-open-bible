id: PSA.69.25
reference: Psalms 69:25
source:
  edition: WLC
  text: תְּהִי טִֽירָתָ֥/ם נְשַׁמָּ֑ה בְּ֝/אָהֳלֵי/הֶ֗ם אַל יְהִ֥י יֹשֵֽׁב־־׃
translation:
  text: May their camp become desolate; let no one live in their tents.
  philosophy: dynamic
lexical_decisions:
- source_word: תְּהִי
  chosen: May ... become
  alternatives:
  - let ... be
  lexicon: HALOT
  rationale: Qal jussive/imperfect of היה used volitively in an imprecatory wish. English 'May ... become' naturally conveys the jussive force and works idiomatically with the following predicate noun/adjective.
- source_word: טִירָתָם
  chosen: their camp
  alternatives:
  - their camp
  - their habitation
  - their settlement
  lexicon: HALOT
  rationale: Retains the concrete collective-settlement sense in idiomatic English.
- source_word: נְשַׁמָּה
  chosen: desolate
  alternatives:
  - a desolation
  - laid waste
  lexicon: HALOT
  rationale: The noun/adjectival form denotes devastation or desolation. 'Become desolate' gives natural English with the preceding היה while preserving the sense of ruin.
- source_word: בְּאָהֳלֵיהֶם
  chosen: in their tents
  alternatives:
  - in their dwellings
  - in their tabernacles
  lexicon: HALOT
  rationale: אֹהֶל literally means 'tent(s).' In poetic parallelism it can extend to dwellings/households, but 'tents' keeps the concrete Hebrew image and matches the likely parallel to 'encampment.'
- source_word: אַל יְהִי
  chosen: let there be no
  alternatives:
  - may there not be
  - do not let there be
  lexicon: HALOT
  rationale: Negative jussive construction expressing an imprecatory wish. 'Let there be no' is idiomatic and preserves the volitional force.
- source_word: יֹשֵׁב
  chosen: live
  alternatives:
  - inhabitant
  - one sitting
  - resident
  lexicon: HALOT
  rationale: Natural English realization of dwelling/residing in this negative wish.
