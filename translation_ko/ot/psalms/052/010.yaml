  rationale: 이 구절에서 시편 기자의 확신의 근거는 하나님의 언약적이고 신실한 호의이므로, 교리적 축소를 피하면서도 한국어 독자가 이해하기 쉬운 표현으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §6
