  rationale: Proper name with prefixed conjunction ו. 'Zechariah' is the standard English transliteration; a more phonetic transliteration is possible but less idiomatic in English Bible style.
- source_word: וּ/מִקְלֽוֹת
  chosen: and Mikloth
  alternatives:
  - and Miklot
  lexicon: HALOT
  rationale: Proper name with prefixed conjunction ו. The final consonant cluster is represented by the conventional English form 'Mikloth.'
