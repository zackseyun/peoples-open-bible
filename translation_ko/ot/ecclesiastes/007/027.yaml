  text: See, this is what I found, says Qoheleth, adding one thing to another to find the sum.
translation:
  language: ko
  text: 전도자가 말합니다. “보십시오, 이것이 내가 찾아낸 것입니다. 합계를 찾아내려고 하나를 또 하나에 더한 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 히브리어 רְאֵה의 직접적인 주의 환기 표현을 합쇼체로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘전도자’는 קֹהֶלֶת의 통상적인 한국어 대응으로, 여기서는 화자가 자신을 가리키는 호칭입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘합계’는 חֶשְׁבּוֹן의 산술적·누적적 뉘앙스와 영어 POB의 “the sum”을 반영한 번역입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: רְאֵה
  rationale: 청자에게 주의를 환기하는 직접 명령형을 현대 합쇼체로 살리기 위해 ‘보십시오’를 택했습니다.
- source_word: מָצָ֔אתִי
  english_pob_choice: this is what I found
  chosen_korean: 이것이 제가 찾아낸 것입니다
  alternatives_korean:
  - 제가 찾은 것입니다
  - 제가 발견한 것입니다
  lexicon: מצא
  rationale: ‘찾다/찾아내다’의 발견 의미를 유지하면서, 완결된 진술로 자연스럽게 옮겼습니다.
- source_word: קֹהֶ֑לֶת
  english_pob_choice: Qoheleth
  chosen_korean: 전도자
  alternatives_korean:
  - 코헬렛
  - 회중 설교자
  lexicon: קֹהֶלֶת
  rationale: 전도서의 인물 호칭으로 굳어진 번역어를 유지하되, 본문 화자의 자의식(말하는 자)을 드러내는 호칭으로 처리했습니다.
- source_word: אַחַ֥ת לְ/אַחַ֖ת לִ/מְצֹ֥א חֶשְׁבּוֹן
  english_pob_choice: adding one thing to another to find the sum
  chosen_korean: 한 가지를 다른 것에 더해 총계를 찾아내는 것입니다
  alternatives_korean:
  - 한 가지를 다른 것에 더하여 합계를 찾는 것입니다
  - 이것저것을 맞대어 합을 찾아내는 것입니다
  lexicon: חשבון
  rationale: 문자적 누적 동작인 ‘한 것에 다른 것을 더함’을 살리고, POB의 최종 선택인 ‘the sum’을 반영해 ‘총계’로 옮겼습니다.
theological_decisions:
- issue: חֶשְׁבּוֹן의 의미를 ‘설명’으로 완화할지, ‘총계/합’으로 유지할지
  chosen_reading: ‘총계’를 택해 수학적·누적적 이미지를 유지했습니다.
  alternative_readings:
  - 설명
  - 해석
  - 합계
  rationale: 영문 POB의 최종 판정이 ‘the sum’이므로, 전도자의 통찰이 ‘설명’이 아니라 더해 얻는 결론임을 그대로 드러내는 것이 원문과 주석 기록에 가장 충실합니다.
  doctrine_reference: 해석학적 의미보다는 본문의 어휘·수사에 대한 번역 판단입니다.
