  from: Look, he writhes with trouble, he is pregnant with misery, and he gives birth to falsehood.
  to: Look, he conceives trouble, and he is pregnant with misery, and he gives birth to falsehood.
  rationale: Changed 'writhes with trouble' to 'conceives trouble' for closer lexical accuracy to יְחַבֶּל in the birth/pregnancy imagery carried through the verse; retained the rest with minor punctuation consistency.
- timestamp: '2026-07-13T20:45:23Z'
  adjudicator: codex-source-grounded-divergence-audit
