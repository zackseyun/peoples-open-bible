id: PSA.140.8
reference: Psalms 140:8
source:
  edition: WLC
  text: אַל תִּתֵּ֣ן יְ֭הוָה מַאֲוַיֵּ֣י רָשָׁ֑ע זְמָמ֥/וֹ אַל תָּ֝פֵ֗ק יָר֥וּמוּ סֶֽלָה־־׃
translation:
  text: O Yahweh, do not grant the desires of the wicked; do not let their schemes succeed, lest they be exalted[a]. Selah
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “lest they become proud.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: מַאֲוַיֵּי
  chosen: the desires of
  alternatives:
  - the cravings of
  - the longings of
  lexicon: HALOT
  rationale: The noun denotes desires or cravings. 'Desires' is natural modern English and fits the moral context without over-intensifying beyond the Hebrew.
- source_word: רָשָׁע
  chosen: the wicked
  alternatives:
  - the wicked man
  - the guilty
  lexicon: HALOT
  rationale: Although morphologically singular, the term often functions as a class label. 'The wicked' preserves that representative force in idiomatic English better than 'the wicked man,' while still allowing the following singular suffix to be rendered naturally.
- source_word: זְמָמוֹ
  chosen: his scheme
  alternatives:
  - his plan
  - his device
  lexicon: HALOT
  rationale: The noun refers to a plan, often with malicious intent in wisdom and psalmic contexts. 'Scheme' captures the hostile nuance better than the more neutral 'plan'.
- source_word: תָּפֵק
  chosen: do not let his scheme succeed
  alternatives:
  - bring forth
  - promote
  - fulfill
  lexicon: HALOT
  rationale: In this negative petition the difficult verb concerns enabling the malicious plan to reach success.
- source_word: יָרֻמוּ
  chosen: lest they be exalted
  alternatives:
  - they rise up
  - they be lifted up
  - he be exalted
  lexicon: HALOT
  rationale: The plural form is retained, and the rendering preserves the idiom of becoming elevated or triumphant.
- source_word: סֶלָה
  chosen: Selah
  lexicon: HALOT
  rationale: Traditionally transliterated because its precise force is uncertain; translating it would overstate certainty.
