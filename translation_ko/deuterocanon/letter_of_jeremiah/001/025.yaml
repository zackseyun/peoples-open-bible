  naturalness: ‘어깨에 실려 다니며’는 자연스럽고, 문단의 우상 풍자 문맥에도 적절합니다. 다만 마지막 절은 ‘부끄러워합니다’로 고치면 현대 표준어 합쇼체에서 원문의 의미와 문장 연결이 더 자연스럽습니다.
  terminology: ‘수치’는 ἀτιμία의 불명예·치욕이라는 뜻을 적절히 살립니다. θεραπεύοντες αὐτά의 ‘그것들을 섬기는 자들’도 우상 숭배 행위의 문맥에 정확합니다.
