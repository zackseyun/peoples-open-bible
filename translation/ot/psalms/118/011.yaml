id: PSA.118.11
reference: Psalms 118:11
source:
  edition: WLC
  text: סַבּ֥וּ/נִי גַם סְבָב֑וּ/נִי בְּ/שֵׁ֥ם יְ֝הוָ֗ה כִּ֣י אֲמִילַֽ/ם־׃
translation:
  text: They surrounded me—yes, they surrounded me; in the name of Yahweh I destroyed them.
  philosophy: dynamic
lexical_decisions:
- source_word: סַבּוּנִי
  chosen: they surrounded me
  alternatives:
  - they encircled me
  - they encompassed me
  lexicon: HALOT
  rationale: From סבב, denoting surrounding or encircling. 'Surrounded me' is natural modern English and preserves the hostile encirclement imagery without archaic tone.
- source_word: גַם
  chosen: 'yes'
  alternatives:
  - also
  - indeed
  - even
  lexicon: HALOT
  rationale: Here גַם intensifies and reinforces the repeated statement rather than simply adding another item. 'Yes' captures the emphatic force in readable English.
- source_word: סְבָבוּנִי
  chosen: they surrounded me
  alternatives:
  - they encircled me
  - they encompassed me
  lexicon: HALOT
  rationale: The repetition of the same verbal idea should be preserved in English because it contributes to the poetic emphasis and mounting pressure of the verse.
- source_word: בְּשֵׁם יְהוָה
  chosen: in the name of Yahweh
  alternatives:
  - by the name of the LORD
  - through the name of the LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: כִּי
  chosen: '[untranslated]'
  alternatives:
  - for I cut them down
  - indeed I cut them down
  lexicon: HALOT
  rationale: Its precise connective/asseverative force is uncertain in the refrain; English punctuation and poetic assertion can carry it without false precision.
- source_word: אֲמִילַם
  chosen: I cut them off
  alternatives:
  - I warded them off
  - I destroyed them
  - I hewed them down
  lexicon: HALOT
  rationale: This preserves the decisive cutting-off sense without adding a downward direction.
