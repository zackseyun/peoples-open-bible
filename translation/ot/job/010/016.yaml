id: JOB.10.16
reference: Job 10:16
source:
  edition: WLC
  text: וְ֭/יִגְאֶה כַּ/שַּׁ֣חַל תְּצוּדֵ֑/נִי וְ֝/תָשֹׁ֗ב תִּתְפַּלָּא בִֽ/י־׃
translation:
  text: If my head rises[a], you hunt me like a lion; again you work wonders against me.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew leaves the subject unstated, probably referring to “my head” in verse 15; another rendering is “If I am exalted.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִגְאֶה
  chosen: If my head rises
  alternatives:
  - And it rises
  - And I am exalted
  - If it rises high
  lexicon: HALOT
  rationale: The verb is 3ms and most plausibly resumes “my head” from verse 15, while the conditional force is supplied by context.
- source_word: כַּשַּׁחַל
  chosen: like a lion
  alternatives:
  - like a fierce lion
  - like a lioness
  lexicon: HALOT
  rationale: שַׁחַל denotes a lion, often with emphasis on strength or fierceness. 'Like a lion' is clear, natural, and sufficiently preserves the simile without over-specifying.
- source_word: תְּצוּדֵנִי
  chosen: you hunt me
  alternatives:
  - you stalk me
  - you catch me
  lexicon: HALOT
  rationale: From צוד, the sense is to hunt or pursue as prey. 'You hunt me' best matches the lion simile and preserves the predatory imagery.
- source_word: וְתָשֹׁב
  chosen: and again
  alternatives:
  - and you return
  - and once more
  lexicon: HALOT
  rationale: שׁוב literally means 'return,' but idiomatically here it introduces repeated action. 'And again' communicates the iterative force in natural English.
- source_word: תִּתְפַּלָּא
  chosen: you act wondrously
  alternatives:
  - you act wonderfully
  - you display your power marvelously
  - you show yourself marvelous
  lexicon: HALOT
  rationale: Conveys extraordinary or astonishing action in natural English without the awkward evaluative wording “show yourself wonderful.”
- source_word: בִי
  chosen: against me
  alternatives:
  - in me
  - with me
  - toward me
  lexicon: HALOT
  rationale: The adversarial context supports action directed against Job.
