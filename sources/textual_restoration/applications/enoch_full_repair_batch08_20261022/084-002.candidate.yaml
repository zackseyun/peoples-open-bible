translation:
  text: Blessed are you, O Lord, great King and mighty in your greatness, Lord of all heavenly creation[a], King
    of kings and God of all the world. Your sovereign power[b], your kingdom, and your greatness endure forever
    and ever, and your authority endures through every generation. All the heavens are your throne forever, and
    the whole earth is the footstool of your feet forever and ever.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally all the creation of heaven; heavenly creation is a compact English rendering.
    reason: lexical_alternative
  - marker: b
    text: 'The exact internal spelling of the photographed royal-attribute noun remains unresolved. In the source
      transcription, POB-added ⟦?⟧ visibly marks those unknown letter signs; it is not a mark printed by Charles
      or an ancient lacuna. Sovereign power is a provisional lexical reconstruction: Dillmann’s1865 lexicon,column152,
      directly cites84:2 under divine dominion/power. That establishes the sense family, not every printed vowel
      or labial sign. No particular Unicode spelling for the unresolved interior is claimed verified.'
    reason: textual_variant
  - marker: c
    text: Compare the throne-and-footstool imagery of Isaiah 66:1 without claiming identical wording.
    reason: cross_reference
