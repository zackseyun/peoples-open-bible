id: 2CO.9.5
reference: 2 Corinthians 9:5
source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
translation:
  text: Therefore I considered it necessary to urge the brothers to go to you ahead of us and arrange in advance the generous gift[a] you had promised, so that it would be ready as a generous gift and not as something extorted[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'blessing,' also in the second occurrence of 'generous gift.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'not as a grudging gift.' The Greek word ordinarily means 'greed' or 'covetousness.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγκαῖον
  chosen: necessary
  alternatives:
  - compulsory
  - needful
  lexicon: BDAG
  rationale: Predicate adjective expressing necessity; 'necessary' is natural modern English and preserves Paul's sense of practical obligation without overstating compulsion.
- source_word: ἡγησάμην
  chosen: I considered
  alternatives:
  - I thought
  - I regarded
  lexicon: BDAG
  rationale: Aorist middle of ἡγέομαι here introduces Paul's judgment. 'I considered' fits the deliberative sense better than the flatter 'I thought'.
- source_word: παρακαλέσαι
  chosen: to urge
  alternatives:
  - to exhort
  - to encourage
  - to appeal to
  lexicon: BDAG
  rationale: In this context Paul is pressing the brothers to act promptly. 'Urge' captures the force without sounding overly formal like 'exhort'.
- source_word: τοὺς ἀδελφοὺς
  chosen: the brothers
  alternatives:
  - the brothers and sisters
  - the brothers
  lexicon: BDAG
  rationale: The Greek is grammatically masculine plural. Per gender-accurate policy, 'brothers' is retained in the main text; the likely mixed-group sense can be noted in a footnote.
- source_word: προέλθωσιν εἰς ὑμᾶς
  lemma: προέρχομαι
  chosen: to go to you ahead of us
  alternatives:
  - to go on ahead to you
  - to go before to you
  lexicon: BDAG
  rationale: The compound verb describes the brothers going before Paul's party; the comparator is supplied naturally from the travel context.
- source_word: προκαταρτίσωσι
  chosen: arrange in advance
  alternatives:
  - prepare in advance
  - make ready beforehand
  lexicon: BDAG
  rationale: The verb concerns organizing and completing the promised collection before Paul's arrival. 'Arrange in advance' is idiomatic and avoids repetition with 'ready.'
- source_word: προεπηγγελμένην
  chosen: you had promised
  alternatives:
  - previously promised
  lexicon: BDAG
  rationale: The participle modifies the gift as one promised beforehand. English expresses that temporal relation naturally with the pluperfect.
- source_word: εὐλογίαν
  chosen: generous gift
  alternatives:
  - blessing
  - bountiful gift
  lexicon: BDAG
  rationale: In this collection context εὐλογία characterizes the promised contribution as a generous gift. The literal image remains in a note.
- source_word: ἑτοίμην εἶναι
  chosen: would be ready
  alternatives:
  - might be ready
  lexicon: BDAG
  rationale: The purpose clause describes the intended result of the advance arrangements. 'Would be ready' is natural in the reported deliberation.
- source_word: οὕτως ὡς εὐλογίαν
  chosen: as a generous gift
  alternatives:
  - as a blessing
  - as generosity
  lexicon: BDAG
  rationale: Repeating 'generous gift' preserves the rhetorical repetition of εὐλογία in intelligible modern English.
- source_word: πλεονεξίαν
  chosen: something extorted
  alternatives:
  - an exaction
  - greed
  - covetousness
  lexicon: BDAG
  rationale: The noun normally denotes greed or grasping. In contrast with the generous gift, it characterizes the contribution as something wrung from the givers; the lexical range remains documented.
