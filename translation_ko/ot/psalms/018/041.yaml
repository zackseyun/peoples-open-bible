  text: They cried for help, but there was no one to save them; they cried to Yahweh, but he did not answer them.
translation:
  language: ko
  text: 그들이 부르짖었으나 구원할 자가 없었고, 여호와께 부르짖었으나 그분께서 그들에게 응답하지 않으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֹיְבַי
  english_pob_choice: my enemies
  chosen_korean: 내 원수들
  alternatives_korean:
  - 내 적들
  - 나를 대적하는 자들
  lexicon: HALOT
  rationale: 첫인칭 소유 접미사가 붙은 אויב는 관계적으로 적대하는 자들을 가리키므로, 현대 한국어에서는 ‘원수들’이 자연스럽고 어감도 강합니다.
- source_word: נָתַתָּה לִּי
  english_pob_choice: you gave me
  chosen_korean: 주님께서는 … 내게 주셨습니다
  alternatives_korean:
  - 주셨습니다
  - 내게 주셨습니다
  lexicon: HALOT
  rationale: 히브리어의 단순 동사 נתן은 ‘주다’가 기본 뜻이므로, 주어를 보충하지 않고도 문맥상 하나님께 드리는 찬양으로 읽히게 했습니다.
- source_word: עֹרֶף
  english_pob_choice: the backs / the necks
  chosen_korean: 목덜미
  alternatives_korean:
  - 목
  - 등
  - 뒤통수
  lexicon: HALOT
  rationale: 직역상 ‘목/목덜미’이지만, 패주한 원수의 뒷모습을 가리키는 관용을 살리기 위해 신체 이미지가 남는 한국어 표현인 ‘목덜미’를 택했습니다.
- source_word: אַצְמִיתֵם
  english_pob_choice: I destroyed
  chosen_korean: 멸하였습니다
  alternatives_korean:
  - 멸망시켰습니다
  - 없애버렸습니다
  - 소멸시켰습니다
  lexicon: HALOT
  rationale: 히필 צמת는 ‘멸하다, 제거하다, 죽게 하다’의 강한 뜻이므로, 현대어로는 과도하게 약화되지 않는 ‘멸하다’가 적절합니다.
theological_decisions:
- issue: 원수 패배를 나타내는 신체 이미지의 보존
  chosen_reading: ‘목덜미를 내게 주셨습니다’로 옮겨, 원수들이 패주하여 등을 보이는 관용적 장면을 유지했습니다.
  alternative_readings:
  - ‘원수들의 등을 내게 주셨습니다’
  - ‘원수들이 내게 등을 돌리게 하셨습니다’
  rationale: 히브리어 עֹרֶף은 단순한 해설보다 몸의 이미지를 통해 승리를 그리므로, 한국어도 지나치게 평탄화하지 않고 시각적 긴장을 남겼습니다.
  doctrine_reference: '번역 원리: 원문 우선, 관용은 이해 가능성 안에서 가능한 한 보존'
