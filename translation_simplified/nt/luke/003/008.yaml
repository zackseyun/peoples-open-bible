translation:
  language: en
  text: So produce fruits that show your repentance[b] is real. Do not start saying among yourselves,[a] ‘Abraham is our father.’ For I tell you, God can raise up children for Abraham from these stones.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: This may also mean “to yourselves” or “within yourselves.”
    reason: lexical_alternative
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: do not begin to say among yourselves
  simplified_phrase: Do not start saying among yourselves
  preserved_meaning: They must not even begin appealing to their shared ancestry.
  reasoning_layer_used: Lexical decision on μὴ ἄρξησθε λέγειν and ἐν ἑαυτοῖς
  rationale: “Start saying” is more natural while the footnote preserves the phrase’s ambiguity.
- pob_phrase: God is able to raise up children for Abraham from these stones
  simplified_phrase: God can raise up children for Abraham from these stones
  preserved_meaning: God has power to provide Abrahamic children apart from presumed physical descent.
  reasoning_layer_used: Lexical and theological decisions on δύναται, ἐγεῖραι, and Abrahamic descent
  rationale: “Can” makes the statement direct without weakening God’s power or the stone image.
