  to: Woe to you[a], scribes and Pharisees, hypocrites! For you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
  rationale: Starting a new sentence with 'Because' after an exclamation mark creates a sentence fragment. Changing 'Because' to 'For' (or replacing the exclamation mark with a comma) resolves the grammatical issue while maintaining the exclamatory force of the previous clause. Since the main translation text already renders the term as 'Gehenna', the explanatory note 'Greek "a son of Gehenna"' is redundant and potentially confusing.
