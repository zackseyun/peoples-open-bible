translation:
  text: Urel told me, “Here the angels who joined with women will stand.[a] Their spirits, taking many forms, defiled
    humankind and will lead them astray to sacrifice to demons as gods, until the great day of judgment, on which
    they will be judged until they are brought to an end.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Urel follows the selected spelling ኡርኤል. The printed joining expression begins with a dagger, not a letter
      ተ; that critical sign is retained in the source rather than turned into a new verb prefix. The compressed
      joining construction is rendered conservatively, not claimed as a recovered earlier wording.
    reason: textual_variant
  - marker: b
    text: The selected text shifts from defiled to will lead astray, and both are retained. Taking many forms renders
      the appearance/form expression. Being brought to an end follows the completion verb; the verse does not explain
      a more exact mechanism of destruction.
    reason: alternative_reading
