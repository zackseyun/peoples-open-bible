theological_decisions:
- issue: Identity of the enthroned figure
  chosen_reading: Retain the source's descriptors rather than insert 'God' into the verse.
  alternative_readings:
  - Identify the figure explicitly as God
  rationale: The surrounding vision may identify the figure, but this verse expresses the identity through its paired honorifics.
- issue: Meaning of 'flesh'
  chosen_reading: A fleshly being contrasted with angels
  alternative_readings:
  - Sinful human nature
  rationale: The contrast concerns who can behold the figure, not moral depravity.
