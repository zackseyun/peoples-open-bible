translation:
  language: ko
  text: '1. 주님께서는 아브라함이 그가 겪은 모든 시험에서 신실하다는 것을 아셨습니다. 이는 주님께서 그의 땅에서, 또 기근으로, 또 왕들의 재물을 통하여 그를 시험하셨고, 다시 그가 아내를 빼앗겼을 때와 할례로 그를 시험하셨으며, 그가 이스마엘과 자기 여종 하갈을 보냈을 때에도 그를 시험하셨기 때문입니다. 그를 시험하신 모든 일에서 그는 신실한 사람으로 드러났고, 그의 영혼은 조급해하지 않았으며, 그는 행동하기를 지체하지 않았습니다. 그는 신실했고 주님을 사랑하는 사람이었기 때문입니다.

    2. 주님께서 그에게 말씀하셨습니다. “아브라함아, 아브라함아.” 그가 대답하였습니다. “제가 여기 있습니다.” 주님께서 말씀하셨습니다. “네가 사랑하는 아들 이삭을 데리고 높은 땅으로 가서, 내가 네게 보여 줄 산들 가운데 하나에서 그를 바쳐라.” 그는 아침 일찍 일어나 나귀에 안장을 얹고, 두 종과 그의 아들 이삭을 데리고 갔습니다. 그는 번제에 쓸 나무를 쪼개어 셋째 날에 그곳으로 가다가 멀리서 그곳을 보았습니다. 그가 물이 있는 우물에 이르러 종들에게 말하였습니다. “너희는 나귀와 함께 여기 머물러라. 나와 이 아이는 더 가서 예배를 드린 뒤에 너희에게 돌아오겠다.” 그는 제물로 드릴 나무를 가져다가 그의 아들 이삭에게 지우고, 자기 손에는 불과 칼을 들었습니다. 그리고 두 사람은 함께 그곳으로 갔습니다.

    3. 그리고 그는 롯이 그에게서 갈라져 나가던 날에 주님께서 그에게 하신 말씀을 기억하였으며, 주님께서 그에게 땅 위에 씨를 주셔서 그가 땅을 유업으로 받게 하셨으므로 기뻐하였고, 입을 다하여 창조주를 송축하였습니다.

    4. 사라는 이스마엘이 장난하고 춤추는 것과 아브라함이 크게 기뻐하는 것을 보고, 이스마엘을 질투하여 아브라함에게 말했습니다. 「이 여종과 그 아들을 내쫓으십시오.」

    5. …그리고 그 아들도 내쫓으십시오. 이 여종의 아들이 내 아들 이삭과 함께 상속자가 되지 못할 것이기 때문입니다.” 그 일은 그의 여종과 그의 아들 때문에 아브라함이 보기에 매우 괴로웠습니다.

    6. 그들을 자기 곁에서 내보내야 한다는 것이었습니다. 그러자 주님께서 아브라함에게 말씀하셨습니다. “아이와 종녀 때문에 괴롭게 여기지 마십시오. 사라가 당신에게 하는 말은 무엇이든지 그 말에 귀를 기울여 그대로 행하십시오.”

    7. 이는 이삭을 통하여 너를 위하여 이름과 씨가 불릴 것이기 때문입니다. 그리고 이 여종의 아들에 관하여는

    8. 나는 그를 큰 민족으로 만들 것입니다. 이는 그가 당신의 후손이기 때문입니다. 그리고 아브라함은 이른 아침에 일어났습니다.

    9. 그는 빵과 물 한 가죽부대를 가져다가 하갈의 어깨에 지우고 아이를 그녀에게 맡긴 뒤, 그녀를 떠나보냈습니다. 그녀는 브엘세바 광야로 가서 방황하였고, 가죽부대의 물이 떨어졌으며, 아이는 목말라 걸어갈 수 없었고 쓰러졌습니다.

    10. 그리고 그의 어머니가 그를 데려다가 올리브나무 아래에 던져 두고, 그녀는 가서 멀리 떨어진 맞은편에 앉았습니다.

    11. 그녀는 “내 아이가 죽는 것을 보지 않겠다” 하고 말하며, 화살 한 발이 날아갈 거리만큼 떨어져 갔습니다. 그리고 앉아 울었습니다. 그때 하나님의 천사, 곧 거룩한 이들 가운데 하나가 그녀에게 말했습니다. “하갈아, 네가 왜 울고 있느냐? 일어나 아이를 들어 네 손으로 붙들어라. 하나님께서 네 목소리를 들으셨고 아이를 보셨기 때문이다.”

    12. 그분이 그녀의 눈을 여시자, 그녀는 물이 있는 우물을 보았습니다. 그리고 가서 가죽부대에 물을 채워 그에게 마시게 했습니다.

    13. 그녀의 아이를. 그리고 그녀는 일어나 파란 광야 쪽으로 갔습니다. 그 아이는 자라서 궁수가 되었고, 주님께서 그와 함께 계셨습니다. 그의 어머니는 그를 위하여 이집트 여자들 가운데서 아내를 얻어 주었습니다.

    14. 그녀는 그에게 아들을 낳았고, 그는 그 이름을 느바욧이라 불렀습니다. 그녀가 “주님께서 내게 가까이 계십니다”라고 말했기 때문입니다.

    15. 내가 그를 불렀을 때였습니다. 그러고 나서 이 희년의 일곱째 주간, 첫해 첫째 달 그 달 열이틀에 하늘에서 아브라함에 관한 말들이 있었습니다. 곧 그가 말한 모든 일에서 신실하였고, 주님을 사랑하였으며, 모든 시험 가운데서도 신실하였다는 것입니다.'
