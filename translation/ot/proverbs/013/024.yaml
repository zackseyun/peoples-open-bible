  from: Whoever withholds his rod hates his son[b][a], but whoever loves him diligently seeks discipline.
  to: Whoever withholds[a] his rod hates his son, but whoever loves him diligently disciplines him.[b]
  rationale: The current second colon wrongly leaves “discipline” without an object, even though the suffix on שִׁחֲרוֹ refers to the son. The proposal correctly restores that object, but “is diligent to discipline him” is less idiomatic than necessary. “Diligently disciplines him” naturally conveys the idiomatic force of שׁחר together with מוסר and retains the son as object. The marker relocations are warranted. The explanatory footnote should not call the expression literally “seeks him early with discipline,” since מוסר is the noun object and the construction is more exactly reflected by “seeks him early for discipline”; its interpretive explanation is retained.
