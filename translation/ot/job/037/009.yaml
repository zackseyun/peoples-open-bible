id: JOB.37.9
reference: Job 37:9
source:
  edition: WLC
  text: מִן הַ֭/חֶדֶר תָּב֣וֹא סוּפָ֑ה וּֽ/מִ/מְּזָרִ֥ים קָרָֽה־׃
translation:
  text: From the southern chamber[a] comes the storm; from the northern winds[b] comes cold.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Hebrew, “the chamber,” probably referring to the “chambers of the south” in Job 9:9; a hidden storehouse for the storm is also possible.
    reason: alternative_reading
  - marker: b
    text: The rare Hebrew term is uncertain; it may instead mean winds that scatter the clouds.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַחֶדֶר
  chosen: From the chamber
  alternatives:
  - From the chamber
  - From the inner chamber
  - From the south
  lexicon: HALOT
  rationale: The Hebrew definite noun should not acquire an English possessive.
- source_word: תָּבוֹא
  chosen: comes
  alternatives:
  - arrives
  - goes forth
  lexicon: HALOT
  rationale: The verb בוא commonly means 'come, enter, arrive.' With סוּפָה as subject, 'comes' is the most natural English rendering and preserves the vivid immediacy of the Hebrew poetic line.
- source_word: סוּפָה
  chosen: the storm
  alternatives:
  - whirlwind
  - tempest
  lexicon: HALOT
  rationale: סוּפָה denotes a violent storm, tempest, or whirlwind. 'Storm' is broad, natural English and fits the parallel with 'cold' in the second colon. 'Whirlwind' is possible but narrower than the context requires.
- source_word: וּמִמְּזָרִים
  chosen: and from the scattering winds
  alternatives:
  - from the north
  - from the dispersing winds
  - from the constellations
  lexicon: HALOT
  rationale: This is a source-near rendering of a rare, disputed term and avoids presenting the directional interpretation as certain.
- source_word: קָרָה
  chosen: cold
  alternatives:
  - cold weather
  - frost
  lexicon: HALOT
  rationale: קָרָה denotes cold, frost, or freezing weather. 'Cold' is concise and idiomatic in parallel with 'storm'; 'frost' is possible but more specific than the Hebrew requires in this line.
