translation:
  language: en
  text: But I preached first to the people in Damascus, then in Jerusalem and throughout Judea, and also to the Gentiles.[a] I told them to reorient[b] and turn to God, and to let their actions show their reorientation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gentiles are people who are not Jewish.
    reason: cultural_note
  - marker: b
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
