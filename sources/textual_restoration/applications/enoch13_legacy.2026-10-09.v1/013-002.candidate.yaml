translation:
  text: And no respite[a] or petition[b] will be granted to you, because of the violence that you have taught, and
    because of all the works of blasphemy and violence and sin that you have shown to humankind.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or rest/relief. Original Dillmann Latin headwordሣኅትhas rest/relaxation senses and explicitly citesEnoch13:2.
      Charles selected spellingሣሕትis retained, not normalized to the dictionary headword. Greekἀνοχήin the same
      printed edition corroborates respite/forbearance; it is not a newly collated independent witness. Earlier
      POBmercyand the lexical petition gloss for this first noun are superseded.
    reason: lexical_alternative
  - marker: b
    text: The second nounስእለትis petition/intercession, not another gloss of the first noun. Original Dillmann Latinስእለትexplicitly
      citesEnoch13:2with intercessio; the same-volume Greek hasἐρώτησις.
    reason: lexical_alternative
  - marker: c
    text: Or revealed to humankind for shown. This note belongs to the final showing clause, not to the denial of
      respite/petition or the earlier teaching clause. The starred granting verb remains in the selected source.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣሕት
  chosen: respite
  alternatives:
  - rest
  - relief
  - forbearance
  rationale: The original Dillmann Latin entry explicitly links the rest/relaxation headword toHen13,2. The selected
    spelling is retained. This distinguishes respite from the separate petition/intercession noun, with same-volume
    Greek corroboration rather than Greek substitution.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: Original public-domain Dillmann Latin sense consulted via digitized access; modern English/French
    annotations not used as the translation basis.
  consulted_lexicon_entry:
    url: https://github.com/BetaMasaheft/DillmannData/blob/4b1cf257e7a51e72f509d8cb2d61d7d823e4ed3e/1/L0b71aab914244d35ad3097a93b9c3174.xml
    sense: Dmain, source=#dillmann
    xml_sha256: ea2b06e7a4532bc3d0908c08fa1939803d52941b3a37307b4096794a6aa528bd
- source_word: ስእለት
  chosen: petition
  alternatives:
  - entreaty
  - prayer
  rationale: Original Dillmann Latinስእለትhas petition/intercession senses and explicitly citesHen13,2. It is not
    a rhetorical near-synonym of the first noun respite.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: Original public-domain Dillmann Latin sense consulted via digitized access.
  consulted_lexicon_entry:
    url: https://github.com/BetaMasaheft/DillmannData/blob/4b1cf257e7a51e72f509d8cb2d61d7d823e4ed3e/7/L7775888e41e8428180370fd18c9ac50c.xml
    sense: Dmain, source=#dillmann
    xml_sha256: 3a8f101f7411af0d764df82a6aa17e9b5fa1755c48a8b9245600b153355e09ba
- source_word: ኢይከውከ
  chosen: will be granted for you
  alternatives:
  - will be yours
  - will happen for you
  - will avail for you
  rationale: The negative imperfect of 'to be/become' with the dative sense points not merely to existence but to
    efficacy or obtaining. 'Will be granted for you' fits the context of a denied intercessory appeal.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ዘመሀርከ
  chosen: you have taught
  alternatives:
  - you instructed
  - you caused to learn
  rationale: A straightforward rendering of the causative/teaching verb; this is central in the Watchers context,
    where illicit knowledge is transmitted to humans.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ግፍዐ
  chosen: violence
  alternatives:
  - oppression
  - wrongdoing
  rationale: In this judgment context, 'violence' best preserves the moral and social force of the term and aligns
    with the corrupting instruction attributed to the Watchers.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ምግባረ
  chosen: works
  alternatives:
  - deeds
  - practices
  rationale: '''Works'' keeps the concrete plural sense and the elevated register of the indictment formula.'
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ጽርፈት
  chosen: blasphemy
  alternatives:
  - reviling
  - insolence
  - defilement
  rationale: The term denotes abusive or impious speech/behavior. 'Blasphemy' best fits the religious-judicial register
    of the accusation, though the semantic range may include reviling more broadly.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ወግፍዕ
  chosen: and violence
  alternatives:
  - and oppression
  - and wrongdoing
  rationale: Kept consistent with the earlier cognate term rather than varying the English without contextual necessity.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ወሓጢአት
  chosen: and sin
  alternatives:
  - and transgression
  rationale: '''Sin'' is the broadest and most natural rendering, preserving the climactic accumulation of charges.'
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ዘአርአይከ
  chosen: you have shown
  alternatives:
  - you revealed
  - you made known
  - you displayed
  rationale: The verb can mean to show or reveal. 'Shown' is chosen because it fits the Ge'ez wording while still
    allowing the context of illicit disclosure; the stronger 'revealed' is preserved in a footnote.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ለሰብእ
  chosen: to humankind
  alternatives:
  - to men
  - to human beings
  rationale: Inclusive modern English is appropriate here because the referent is humanity generally, not males
    specifically.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
