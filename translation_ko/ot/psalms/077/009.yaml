translation:
  language: ko
  text: 하나님께서 은혜 베푸시기를 잊으셨습니까? 진노하셔서 자신의 긍휼을 막아 두셨습니까? 셀라[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘셀라’는 예배나 음악과 관련된 표지로 보이지만, 그 정확한 뜻은 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֶאָפֵס
  english_pob_choice: has ceased
  chosen_korean: 그쳤습니까
  alternatives_korean:
  - 끝났습니까
  - 사라졌습니까
  lexicon: HALOT
  rationale: 상실과 소멸을 묻는 탄식문이므로, 상태의 중단을 자연스럽게 드러내는 ‘그쳤습니까’가 가장 적절합니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 그분의 변함없는 사랑
  alternatives_korean:
  - 그분의 인자하심
  - 그분의 언약적 사랑
  - 그분의 자애
  lexicon: HALOT
  rationale: 히브리어 חֶסֶד의 언약적·지속적 뉘앙스를 살리면서도 현대 한국어에서 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: אֹמֶר
  english_pob_choice: his promise
  chosen_korean: 그분의 말씀
  alternatives_korean:
  - 그분의 약속
  - 그분의 말씀하심
  - 그분의 말
  lexicon: HALOT
  rationale: 원뜻은 ‘말씀/발화’이지만, 문맥상 하나님의 신실한 말씀을 가리키므로 본문에는 ‘말씀’을 두고, 더 해석적인 ‘약속’은 본문의 선택으로 과도하게 좁힐 수 있어 채택하지 않았습니다.
- source_word: לְדֹר וָדֹר
  english_pob_choice: for generation after generation
  chosen_korean: 대대로
  alternatives_korean:
  - 세대에서 세대로
  - 대대에 걸쳐
  - 한 세대 또 한 세대로
  lexicon: HALOT
  rationale: 반복과 지속을 압축적으로 살리는 한국어 관용 표현으로 ‘대대로’를 사용했습니다.
theological_decisions:
- issue: אֹמֶר를 ‘약속’으로 구체화할지, 더 직접적인 ‘말씀’으로 둘지
  chosen_reading: 말씀
  alternative_readings:
  - 약속
  - 말
  rationale: 시편의 탄식은 하나님의 신실한 발화 자체가 끝났는지를 묻는 형식이므로, 의미를 지나치게 좁히지 않는 ‘말씀’이 원문에 더 가깝습니다. 영어 POB의 ‘promise’는 해석적 명료화로 이해하되, 한국어 본문은 원어의 폭을 보존합니다.
  doctrine_reference: Translation philosophy §3, §5
