translation:
  text: Most of them escaped wounded and stripped[a]; Lysias himself also escaped, fleeing in disgrace.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “naked”; the Greek can refer to being without clothing or without armor.
