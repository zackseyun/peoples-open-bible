id: PSA.68.17
reference: Psalms 68:17
source:
  edition: WLC
  text: רֶ֤כֶב אֱלֹהִ֗ים רִבֹּתַ֣יִם אַלְפֵ֣י שִׁנְאָ֑ן אֲדֹנָ֥/י בָ֝֗/ם סִינַ֥י בַּ/קֹּֽדֶשׁ׃
translation:
  text: The chariots of God number twenty thousand, thousands upon thousands[a]; the Lord is among them in the holy place, as he was at Sinai[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Hebrew “thousands of shin'an”; the meaning of the final word is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew is highly compressed; another understanding is “the Lord has come from Sinai into the holy place.”
    reason: alternative_reading
lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  chosen: the chariots of God
  alternatives:
  - God's chariotry
  - the chariot host of God
  lexicon: HALOT
  rationale: 'רֶכֶב denotes chariotry/chariots collectively. The construct with אֱלֹהִים is most naturally possessive: God''s chariots or chariot host. ''The chariots of God'' is clear modern English while preserving the imagery.'
- source_word: רִבֹּתַיִם
  chosen: twice ten thousand
  alternatives:
  - twice ten thousand
  - tens of thousands
  lexicon: HALOT
  rationale: The dual form expresses two myriads; unlike “myriads,” this preserves the marked number without claiming that the whole host is numerically limited.
- source_word: אַלְפֵי שִׁנְאָן
  chosen: thousands upon thousands
  alternatives:
  - thousands of repetition
  - thousands innumerable
  lexicon: HALOT
  rationale: This gives a natural contextual rendering while acknowledging in the note that שִׁנְאָן is obscure.
- source_word: אֲדֹנָי
  chosen: the Lord
  alternatives:
  - Lord
  lexicon: HALOT
  rationale: As a divine title, אֲדֹנָי is best rendered 'the Lord' in English. This aligns with the project's default rendering of divine lordship titles.
- source_word: בָם
  chosen: among them
  alternatives:
  - in them
  - with them
  lexicon: HALOT
  rationale: The preposition ב with pronominal suffix can mean 'in/among/with them.' In context of God amid his heavenly hosts, 'among them' is the most natural English expression.
- source_word: סִינַי
  chosen: Sinai
  lexicon: HALOT
  rationale: Proper place name, transliterated according to project policy.
- source_word: בַּקֹּדֶשׁ
  chosen: in holiness
  alternatives:
  - in the sanctuary
  - in the holy place
  lexicon: HALOT
  rationale: קֹדֶשׁ can denote holiness abstractly or a holy place/sanctuary concretely. Here the phrase after 'Sinai' is compressed and poetic. 'In holiness' preserves the abstract sacred quality without over-specifying a location not explicit in the Hebrew.
- source_word: סִינַי בַּקֹּדֶשׁ
  chosen: as at Sinai, in the holy place
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This supplies an elliptical comparison and takes קֹדֶשׁ concretely, producing coherent English without turning “Sinai” into the subject of a newly asserted clause.
