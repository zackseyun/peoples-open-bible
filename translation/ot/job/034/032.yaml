id: JOB.34.32
reference: Job 34:32
source:
  edition: WLC
  text: בִּלְעֲדֵ֣י אֶ֭חֱזֶה אַתָּ֣ה הֹרֵ֑/נִי אִֽם עָ֥וֶל פָּ֝עַ֗לְתִּי לֹ֣א אֹסִֽיף־׃
translation:
  text: Teach me what I do not see[a]; if I have done wrong, I will not do it again”?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “Teach me beyond what I see.”
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעֲדֵי
  chosen: what ... not
  alternatives:
  - apart from
  - besides
  - without
  lexicon: HALOT
  rationale: 'In this idiom with אֶחֱזֶה, the sense is elliptical: ''what I do not see/know.'' A more literal ''apart from'' would be awkward in English and obscure the clause''s meaning.'
- source_word: אֶחֱזֶה
  chosen: I see
  alternatives:
  - I perceive
  - I know
  lexicon: HALOT
  rationale: The verb חזה literally denotes seeing or perceiving. 'See' preserves the imagery while allowing the implied sense of moral or factual perception in context.
- source_word: אַתָּה הֹרֵנִי
  chosen: teach me
  alternatives:
  - you show me
  - you instruct me
  lexicon: HALOT
  rationale: The form functions as a direct imperative addressed to God.
- source_word: אִם
  chosen: if
  alternatives:
  - whether
  lexicon: HALOT
  rationale: 'Introduces a conditional clause: ''if I have done wrong.'' ''Whether'' is possible in some analyses, but the conditional reading is more straightforward here.'
- source_word: עָוֶל
  chosen: wrong
  alternatives:
  - injustice
  - iniquity
  - evil
  lexicon: HALOT
  rationale: עָוֶל denotes wrongdoing or injustice. 'Wrong' is concise, idiomatic, and broad enough for the speaker's confession without over-specifying the offense.
- source_word: פָּעַלְתִּי
  chosen: I have done
  alternatives:
  - I committed
  - I worked
  lexicon: HALOT
  rationale: פעל is a general verb for doing or acting. 'I have done' fits the perfect aspect and pairs naturally with 'wrong.'
- source_word: לֹא אֹסִיף
  chosen: I will not do it again
  alternatives:
  - I will add no more
  - I will not continue
  - I will not repeat it
  lexicon: HALOT
  rationale: יסף in the Hiphil with negation idiomatically means 'do no more' or 'not continue/repeat.' English requires an implied object; 'do it again' makes the sense explicit and readable.
