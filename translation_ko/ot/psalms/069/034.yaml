source:
  edition: WLC
  text: כִּֽי שֹׁמֵ֣עַ אֶל אֶבְיוֹנִ֣ים יְהוָ֑ה וְ/אֶת אֲ֝סִירָ֗י/ו לֹ֣א בָזָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/034.yaml
  text: Let heaven[b] and earth praise him[c], the seas and everything that moves[a] in them.
  footnotes:
  - marker: a
    text: Or 'his captives.' The Hebrew term can refer broadly to those held in bondage or confinement.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 가난한 이들의 부르짖음을 들으시고, 자기 포로들을 멸시하지 않으시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 포로들’. 히브리어 용어는 넓게는 속박되거나 갇힌 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵעַ אֶל אֶבְיוֹנִים
  english_pob_choice: hears the needy
  chosen_korean: 가난한 이들의 부르짖음을 들으시고
  alternatives_korean:
  - 가난한 이들을 들으시고
  - 궁핍한 이들의 부르짖음을 들으시고
  lexicon: HALOT
  rationale: שׁמע는 단순 청취보다 응답적 ‘들음’을 포함하므로, 시편의 기도 맥락을 살려 ‘부르짖음’을 보완해 자연스럽게 옮겼습니다. אֶבְיוֹנִים은 ‘가난한 이들’로 번역해 경제적·사회적 취약성을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와가 아니라 ‘야훼’를 사용하여, 시편 본문의 언약적 고유명을 직접 반영했습니다.
- source_word: אֲסִירָיו
  english_pob_choice: his prisoners
  chosen_korean: 자기 포로들
  alternatives_korean:
  - 그의 포로들
  - 자기 죄수들
  lexicon: HALOT
  rationale: 3인칭 남성 단수 소유격을 ‘자기’로 살려, 단순한 일반 명사가 아니라 야훼와 관련된 소속성을 드러냈습니다. 영어 POB의 ‘his prisoners’와 달리 한국어에서는 ‘포로들’이 본문상 더 넓은 억류·구금의 뉘앙스를 유지합니다.
- source_word: לֹא בָזָה
  english_pob_choice: does not despise
  chosen_korean: 멸시하지 않으시기
  alternatives_korean:
  - 업신여기지 않으시기
  - 경멸하지 않으시기
  lexicon: HALOT
  rationale: בזה의 핵심은 ‘경멸하다/업신여기다’이므로, 현대 한국어에서 가장 직접적인 ‘멸시하다’를 택했습니다. 시적 평행을 위해 현재적 진술로 옮겼습니다.
theological_decisions:
- issue: 하나님의 ‘들으심’의 구체화
  chosen_reading: ‘가난한 이들의 부르짖음’으로 옮겨, 단순 감각적 청취가 아니라 구원적 응답을 전제한 들음으로 표현했습니다.
  alternative_readings:
  - ‘가난한 이들을 들으시고’
  - ‘가난한 이들을 들으시는’
  rationale: 시편 맥락에서 하나님이 가난한 자의 호소에 응답하신다는 의미가 핵심이므로, 한국어에서는 ‘부르짖음’을 보충해 본문이 암시하는 기도적 상황을 분명히 했습니다.
  doctrine_reference: 시편 69편의 탄원-구원 구조
- issue: ‘자기 포로들’의 소유격 보존
  chosen_reading: ‘자기 포로들’로 번역해 포로 상태의 사람들을 야훼께 속한 자들로 남겨 두었습니다.
  alternative_readings:
  - ‘그의 포로들’
  - ‘포로들’
  rationale: 히브리어 소유격은 단순 소속 표지가 아니라, 억류된 자들도 여전히 야훼의 돌보심 아래 있다는 신학적 뉘앙스를 유지합니다.
  doctrine_reference: 번역 원칙 §1, §5
