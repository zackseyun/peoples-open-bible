revisions:
- from: 그리고 너희가 말하기를 “우리가 일곱째 해에 무엇을 먹겠느냐? 보라, 우리는 씨를 뿌리지도 않고 우리의 소출도 거두지 않을 것이다” 하거든,[a]
  to: 만일 너희가 “우리가 일곱째 해에 무엇을 먹겠습니까? 우리는 씨를 뿌리지도 않고 우리 소출을 거두지도 않을 텐데요”라고 말한다면,
  rationale: 직접화법을 자연스러운 현대 합쇼체로 다듬고, 히브리어의 הֵן 및 영문 POB의 ‘since’가 나타내는 근거 관계를 ‘…않을 텐데요’로 반영했습니다. 다음 절에 이어지는 조건절임을 보존하기 위해 끝맺지 않고 쉼표로 두었습니다.
