  meaning_decisions:
  - source_phrase: וַיְהִי כְּכַלּוֹת יִשְׂרָאֵל לַהֲרֹג
    prior_rendering: And it happened that when Israel had finished killing
    new_rendering: Israel finished killing
    rationale: The narrative formula and extended temporal construction are expressed through a direct statement followed by 'Then,' preserving the sequence in stronger English sentences.
  - source_phrase: אֶת כָּל יֹשְׁבֵי הָעַי בַּשָּׂדֶה בַּמִּדְבָּר אֲשֶׁר רְדָפוּם בּוֹ
    prior_rendering: all the inhabitants of Ai in the field, in the wilderness where they had pursued them
    new_rendering: all the inhabitants of Ai who were in the open country, in the wilderness where they had pursued the Israelites
    rationale: The location limits this first group to those outside the city, and the pursuers are Ai's people while the pursued are Israelites; the new wording makes both relationships explicit.
  - source_phrase: וַיִּפְּלוּ כֻלָּם לְפִי חֶרֶב עַד תֻּמָּם
    prior_rendering: all of them had fallen by the edge of the sword until they were finished off
    new_rendering: Every one of them fell by the edge of the sword; none remained alive
    rationale: The new wording retains the sword image and the emphatic completeness of the killing without the potentially casual register of 'finished off.'
  - source_phrase: וַיַּכּוּ אֹתָהּ לְפִי חָרֶב
    prior_rendering: struck it with the edge of the sword
    new_rendering: put its inhabitants to the sword
    rationale: The city stands for the people within it; the clause describes killing, not striking buildings or merely launching another attack.
