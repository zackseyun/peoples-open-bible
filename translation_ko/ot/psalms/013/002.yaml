source:
  edition: WLC
  text: עַד אָ֨נָה אָשִׁ֪ית עֵצ֡וֹת בְּ/נַפְשִׁ֗/י יָג֣וֹן בִּ/לְבָבִ֣/י יוֹמָ֑ם עַד אָ֓נָה יָר֖וּם אֹיְבִ֣/י עָלָֽ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/002.yaml
  text: How long must I make plans within myself[b], with sorrow in my heart all day? How long will my enemy be exalted over me[a]?
  footnotes:
  - marker: a
    text: Or “How long will my enemy triumph over me?” The Hebrew more literally says “be exalted over me.”
    reason: lexical_alternative
  - marker: b
    text: Or “How long must I deliberate within myself, with sorrow in my heart all day?”
    reason: lexical_alternative
translation:
  language: ko
  text: 언제까지 제가 제 속으로 계획들을 세우며, 날마다 제 마음에 슬픔을 품어야 합니까? 언제까지 제 원수가 제 위로 높아지겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד אָ֣נָה
  english_pob_choice: How long
  chosen_korean: 언제까지
  alternatives_korean:
  - 얼마나 더
  - 언제까지나
  lexicon: HALOT
  rationale: 탄식시에서 반복되는 기간 질문을 한국어 자연어로 옮기기에 ‘언제까지’가 가장 직접적이며, 절박한 호소의 리듬도 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유신명사 יְהוָה를 제목이나 호칭으로 바꾸지 않고, 프로젝트 기본값에 따라 음역형 ‘야훼’로 유지했습니다.
- source_word: תִּשְׁכָּחֵנִי
  english_pob_choice: will you forget me
  chosen_korean: 저를 잊으시렵니까
  alternatives_korean:
  - 저를 잊으십니까
  - 저를 잊으실 겁니까
  lexicon: HALOT
  rationale: 히브리어 미완료형의 질문적 탄식을 한국어 미래/의지형 추궁으로 자연스럽게 살리되, 지나치게 평서적으로 약화하지 않았습니다.
- source_word: פָּנֶיךָ
  english_pob_choice: your face
  chosen_korean: 당신의 얼굴
  alternatives_korean:
  - 당신의 얼굴
  - 당신의 임재
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘얼굴’을 본문에 보존해 시적 긴장을 살렸고, ‘임재’는 의미상 해석이므로 본문 대신 각주로 처리하는 편이 적절합니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 시편 본문은 다윗의 탄식 속에서도 언약의 이름을 직접 부르므로, 대체 호칭 ‘주’보다 고유명사 ‘야훼’를 유지하는 것이 본문의 직접성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘얼굴’을 ‘임재’로 풀지 여부
  chosen_reading: 본문에는 ‘당신의 얼굴’을 유지
  alternative_readings:
  - 당신의 임재를 저에게서 숨기시렵니까
  rationale: 히브리어 관용구는 하나님의 은혜와 임재의 철수를 함축하지만, 본문 자체의 구체적 표현을 보존하는 것이 시적·신학적 중첩을 가장 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §6
