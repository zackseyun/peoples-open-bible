  yaml_path: translation/deuterocanon/sirach/030/039.yaml
  text: If you have a slave, let him be like yourself, because you acquired him with blood; if you have a slave, lead him as yourself, because you need him as your own life.
translation:
  language: ko
  text: 종이 있으면 그를 자신과 같이 여기십시오.[a] 그를 피로 사셨기 때문입니다. 종이 있으면 그를 자신처럼 이끄십시오.[b] 그가 당신에게 목숨만큼 필요하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종’은 가정에 속한 예속 신분의 사람을 가리키는 그리스어 οἰκέτης를 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이끄십시오’는 그리스어 ἄγε를 따른 번역입니다. 문맥상 그를 돌보고 관리하는 일을 포함할 수 있으나, 원문의 구체적인 동사를 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: οἰκέτης
  rationale: 가정에 속한 소유적 종속 신분을 가리키므로, 본문이 강조하는 구속된 소유 관계를 살리기 위해 중립적 ‘하인’보다 ‘종’을 택했습니다.
- source_word: ἔστω ὡς σύ
  english_pob_choice: let him be like yourself
  chosen_korean: 그를 당신과 같게 여기십시오
  alternatives_korean:
  - 그가 당신처럼 되게 하십시오
  - 그를 당신과 같이 여기십시오
  lexicon: ἔστω ὡς σύ
  rationale: 존재 상태를 권고하는 명령으로 읽어 ‘같게 여기다’로 옮겨, 단순한 외형적 대우가 아니라 인식과 처우의 기준을 드러냈습니다.
- source_word: ἄγε αὐτὸν ὡς σεαυτόν
  english_pob_choice: lead him as yourself
  chosen_korean: 그를 당신 자신처럼 대하십시오
  alternatives_korean:
  - 그를 당신처럼 인도하십시오
  - 그를 당신처럼 이끄십시오
  lexicon: ἄγε αὐτὸν ὡς σεαυτόν
  rationale: ἄγε는 단순 지도보다 실제적 처우를 포함할 수 있어, 문맥상 ‘대하다’로 넓게 옮겨 두 반복 명령의 윤리를 선명하게 했습니다.
- source_word: ἐν αἵματι ἐκτήσω αὐτόν
  english_pob_choice: because you acquired him with blood
  chosen_korean: 그를 피로 사셨기 때문입니다
  alternatives_korean:
  - 그를 피로 얻으셨기 때문입니다
  - 그를 피값을 치르고 얻으셨기 때문입니다
  lexicon: ἐκτήσω
  rationale: ἐκτάομαι의 취득·획득을 한국어에서 자연스럽고 강하게 드러내는 ‘사다’로 옮겨, ‘피로’와 결합된 대가성을 분명히 했습니다.
- source_word: ὡς ἡ ψυχή σου ἐπιδέησις αὐτόν
  english_pob_choice: because you need him as your own life
  chosen_korean: 그가 당신의 생명처럼 꼭 필요하기 때문입니다
  alternatives_korean:
  - 그가 당신의 목숨만큼 필요하기 때문입니다
  - 그가 당신의 영혼처럼 필요하기 때문입니다
  lexicon: ψυχή / ἐπιδέησις
  rationale: ψυχή를 직역해 ‘영혼’으로 만들기보다, 문맥상 생명·필수성의 강조를 살려 ‘생명’으로 옮겼고, ἐπιδέησις의 절박한 필요를 ‘꼭 필요하다’로 반영했습니다.
theological_decisions:
- issue: 노예/종 번역 선택
  chosen_reading: 본문의 οἰκέτης를 ‘종’으로 옮기되, 혈로 산 소유 관계와 가족 내 지위를 함께 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 노예로 옮겨 더 강한 소유성과 억압을 드러내는 읽기
  - 하인으로 옮겨 완화하는 읽기
  rationale: 히브리·헬라 문맥의 가정 종속 신분을 드러내면서도, 이 절의 윤리 명령이 신분 완화가 아니라 대우의 갱신임을 보존하기 위해 ‘종’이 가장 균형적입니다.
  doctrine_reference: 사회윤리 / 번역어 선택
- issue: ‘피로 사셨기 때문입니다’의 대가성
  chosen_reading: 피는 단순한 비유가 아니라 종의 취득에 수반된 실제 대가를 나타내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘피로 얻으셨기 때문입니다’로 완곡화
  - 상징적 표현으로 희석
  rationale: 본문의 충격성과 종의 소유 관계를 약화하지 않기 위해, 혈액을 통한 취득의 직접성을 그대로 살렸습니다.
  doctrine_reference: 본문의 사회적-수사적 긴장 보존
