theological_decisions:
- issue: Rendering of צִדְקֶךָ in a context of divine vindication
  chosen_reading: your righteousness
  alternative_readings:
  - your justice
  rationale: The Hebrew can evoke both God's moral righteousness and his just vindication of the psalmist. Following the project's default preference to preserve theological breadth where possible, 'righteousness' is retained in the main text, with 'justice' preserved as an alternative.
  doctrine_reference: 'DOCTRINE.md: Contested terms table notes δικαιοσύνη as usually ''righteousness'' with ''justice'' preserved where relevant; by analogy, the Hebrew cognate is handled similarly to preserve tension rather than narrow the sense.'
revisions:
- timestamp: '2026-04-21T00:17:07Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/035/028.json
  category: awkward_english
  tier: 1
  from: your righteousness, your praise all day long
  to: your righteousness, and all day long of your praise
  rationale: The current rendering is syntactically awkward. The verb phrase 'will speak of' governs both 'righteousness' and 'praise', but the preposition 'of' is omitted before the second object, creating an unidiomatic list. Additionally, the Hebrew poetic structure (וּלְשׁוֹנִי תֶהְגֶּה צִדְקֶךָ // כָּל־הַיּוֹם תְּהִלָּתֶךָ) places the temporal phrase 'all day long' at the start of the second clause, emphasizing its connection to 'your praise'. The suggested rewrite restores both the grammatical parallelism (by implying 'speak of your praise') and the poetic structure of the Hebrew, resulting in a more elegant and faithful translation.
- timestamp: '2026-04-21T02:31:51Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/035/028.json
  category: awkward_english
  tier: 1
  from: will speak of your righteousness, and all day long of your praise.
  to: will declare your righteousness and your praise all day long.
  rationale: The current rendering of the second clause, "...and all day long of your praise," is grammatically awkward and unnatural in English. It appears to be an attempt to preserve the Hebrew word order of the second colon (כָּל־הַיּוֹם תְּהִלָּתֶךָ) at the cost of clarity and flow. The Hebrew verb תֶּהְגֶּה (tehgeh) takes a direct object (see BDB 1.c, HALOT 1.b). Using a transitive verb like "declare" is more direct than "speak of" and allows for a much smoother English construction. The suggested rewrite forms a natural compound direct object ("your righteousness and your praise all day long"), which is a standard and elegant way to render this type of gapped Hebrew parallelism. The choice of "declare" also fits the context of joyful proclamation established in the preceding verse (Ps 35:27).
- timestamp: '2026-04-23T11:25:26Z'
  adjudicator: azure-gpt-5.4-revision-pass
  reviewer_model: gpt-5.4
  category: revision_pass
  from: And my tongue will declare your righteousness and your praise all day long.
  to: And my tongue will meditate on your righteousness, and on your praise all day long.
  rationale: Changed 'declare' to 'meditate on' to more closely reflect תהגה, and repeated 'on' for clearer alignment with the two objects while preserving formal register.
- timestamp: '2026-08-28T22:05:07Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: idiom
  tier: 1
  from: And my tongue will meditate on your righteousness[a][b], and on your praise all day long.
  to: And my tongue will speak of your righteousness[a] and praise you all day long.
  rationale: With “my tongue” as subject, the verb naturally denotes voiced expression in this praise context; “meditate on” is misleadingly inward, and “meditate on … and on your praise” is awkward English. “Speak of … and praise you” accurately renders the two coordinated objects in idiomatic English. The retained note honestly preserves the righteousness/justice alternative.
