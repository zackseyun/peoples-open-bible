  text: O Yahweh, save![a] May the king answer us when we call.
  footnotes:
  - marker: a
    text: Or “O Yahweh, save the king! May he answer us when we call,” or possibly, “O Yahweh, save! The King will answer us when we call.” The Hebrew syntax is compressed and permits more than one construal of “the king.”
    reason: alternative_reading
translation:
  language: ko
  text: 여호와[a]여, 구원하소서! 우리가 부르는 날에 왕께서 우리에게 응답하게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문장이 압축되어 있어, ‘여호와여, 왕을 구원하시고 우리가 부르는 날에 우리에게 응답하소서’로도, 또는 ‘여호와여, 구원하소서! 왕께서 우리가 부르는 날에 우리에게 응답하실 것입니다’로도 이해할 수 있습니다. 여기서 ‘왕’은 문맥상 인간 왕을 가리킬 수 있으나, 하나님을 가리키는 것으로 이해되기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  english_pob_choice: They
  chosen_korean: 그들은
  alternatives_korean:
  - 그 사람들이
  - 저들은
  lexicon: HALOT
  rationale: 독립 3인칭 복수 대명사의 대비를 한국어에서도 자연스럽게 살리기 위해 ‘그들은’으로 옮겼습니다.
- source_word: כָּרְעוּ
  english_pob_choice: have bowed down
  chosen_korean: 몸을 굽히고
