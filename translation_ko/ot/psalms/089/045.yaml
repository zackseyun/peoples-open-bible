  lexicon: HALOT
  rationale: 히필 קצר의 ‘짧게 하다/줄이다’라는 의미를 살려 자연스러운 합쇼체로 옮겼습니다.
- source_word: יְמֵי עֲלוּמָיו
  english_pob_choice: the days of his youth
  chosen_korean: 그의 청춘의 날들
  alternatives_korean:
  - 그의 젊은 날들
  - 그의 젊은 시절의 날들
  lexicon: HALOT
  rationale: ‘날들’의 기간감과 ‘청춘’의 youth 의미를 함께 살려 히브리어 표현을 비교적 직접적으로 반영했습니다.
- source_word: הֶעֱטִיתָ עָלָיו בּוּשָׁה
  english_pob_choice: you have covered him with shame
  chosen_korean: 그에게 수치를 덮어씌우셨습니다
  alternatives_korean:
  - 그를 수치로 덮으셨습니다
  - 그에게 수치를 입히셨습니다
  lexicon: HALOT
  rationale: עָטָה의 ‘덮다/입히다’와 בּוּשָׁה의 ‘수치’를 살리되, 한국어에서 가장 자연스럽고 강한 이미지인 ‘덮어씌우다’로 옮겼습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - —
  - (연주지시) 셀라
  lexicon: HALOT
  rationale: 정확한 기능이 불확실한 용어이므로 음역을 유지해 원문 형식을 보존했습니다.
theological_decisions:
