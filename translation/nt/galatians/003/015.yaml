    rationale: Paul addresses the community of fellow believers, including women; the familial address is preserved while its intended scope is explicit.
  - source_phrase: κατὰ ἄνθρωπον λέγω
    prior_rendering: I am speaking in human terms
    new_rendering: I am using an example from everyday life
    rationale: The idiom introduces an ordinary human analogy, not a qualification that Paul’s argument is merely human or spiritually deficient.
  - source_phrase: ὅμως ἀνθρώπου κεκυρωμένην διαθήκην
