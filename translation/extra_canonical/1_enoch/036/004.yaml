translation:
  text: When I saw this, I blessed, and at all times I bless the Lord of Glory, who has done great and glorious
    wonders to show the greatness of his work to his angels, to spirits, and to humankind[a], so that they might
    praise his work and all his deeds, that they might see the work of his power and praise the great work of his
    hands and bless him forever.
  philosophy: optimal-equivalence
