  source_fidelity: 현 초안은 시편 68편 24절이 아니라 바로 앞 절(68:23)의 전투·피·개 이미지에 해당하는 전혀 다른 히브리어 본문을 번역하고 있습니다. 따라서 현 본문은 해당 절의 원문 및 영어 POB 감사 기록과 일치하지 않습니다. 68:24는 하나님과 왕의 행렬/걸음을 목격한 장면입니다. בַּקֹּדֶשׁ은 문맥상 성소를 가리킬 수 있으나, 히브리어 전치사 בְ는 그 자체로 ‘안에서/가운데서’를 나타내므로 ‘성소로 들어가시는’보다 ‘성소에서의’가 더 직접적입니다.
  naturalness: ‘하나님, 그들이 주의 행렬을 보았습니다. 곧 나의 하나님, 나의 왕의 성소에서의 행렬을 보았습니다’는 한국어 시어로 자연스럽고, 반복된 הֲלִיכוֹת의 병행도 유지합니다. ‘그들’의 지시 대상은 원문에서 명시되지 않으므로 그대로 보존했습니다.
  terminology: אֱלֹהִים은 호격 ‘하나님’으로, אֵלִי와 מַלְכִּי는 ‘나의 하나님, 나의 왕’으로 옮겼습니다. הֲלִיכוֹת은 예식적 문맥을 고려해 ‘행렬’로 번역하되, ‘걸음/행차’라는 어휘적 가능성은 각주에 남겼습니다. קֹּדֶשׁ은 ‘성소’로 옮겼습니다.
