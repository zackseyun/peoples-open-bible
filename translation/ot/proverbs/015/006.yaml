  from: In the house of the righteous there is great wealth[b][a], but in the income of the wicked there is trouble.
  to: In the house of the righteous there is great wealth, but the income of the wicked is troubled.[a]
  rationale: The current double-locative wording is awkward, and the note markers are misplaced. But נֶעְכָּרֶת is a Niphal predicate describing the wicked person’s yield or income as troubled, disturbed, or ruined; “brings trouble” supplies an unmarked causative meaning. Making “income” the English subject is appropriate, while retaining the noncausative predicate preserves the Hebrew’s ambiguity between trouble and ruin.
