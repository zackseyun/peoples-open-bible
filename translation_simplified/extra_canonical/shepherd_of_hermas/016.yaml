theological_decisions:
- issue: Personified virtues as supporting agents of the tower
  chosen_reading: Retain them as real personified virtues rather than reducing them to abstractions only.
  alternative_readings: []
  rationale: Retain the visionary women and their virtue names without reducing them to an unpersonified
    list or certifying a later ontological account.
- issue: διὰ ταύτης σώζονται
  chosen_reading: Render Faith as the means 'through' which God’s chosen are saved.
  alternative_readings: []
  rationale: Retain the selected through-her and present passive salvation, while noted discloses Sinaiticus’s
    because-of-her and versional differences. No additional God-appointed-channel proposition is inserted.
- issue: The end and the tower’s completion
  chosen_reading: Preserve the tower-completion image as the sign of the end.
  alternative_readings: []
  rationale: Preserve tower completion, the end and quick building without adding a date or later system.
