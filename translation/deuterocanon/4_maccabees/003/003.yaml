translation:
  text: None of you can cut anger out of your soul, but reason can help you control it[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “it is possible to help anger.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμόν
  chosen: anger
  alternatives:
  - wrath
  - passion
  - spiritedness
  lexicon: LSJ
  rationale: θύμος commonly denotes anger, wrath, or passionate impulse. In this ethical context, 'anger' is the most natural and accessible English rendering, while still broad enough to cover the affective force of the Greek.
- source_word: ἐκκόψαι
  chosen: cut ... out
  alternatives:
  - cut off
  - remove
  - root out
  lexicon: LSJ
  rationale: The verb literally means to cut out/off. 'Cut ... out' preserves the vivid metaphor of excision from the soul better than the flatter 'remove.'
- source_word: ψυχῆς
  chosen: soul
  alternatives:
  - life
  - self
  - inner being
  lexicon: LSJ
  rationale: ψυχή can mean life, soul, or self. Here the phrase 'out of your soul' reflects the Greek expression directly and suits the moral-psychological discussion of inner passions.
- source_word: δυνατὸν βοηθῆσαι
  chosen: it is possible to help
  alternatives:
  - it is possible to assist
  - it is possible to support
  - it is possible to come to the aid of
  lexicon: LSJ
  rationale: βοηθέω means to help or come to the aid of. The construction contrasts inability to eradicate anger with the possibility of aiding it in some sense; 'it is possible to help' stays close to the Greek without over-interpreting the object.
- source_word: τῷ θυμῷ
  chosen: anger
  alternatives:
  - the angry impulse
  - wrath
  - spiritedness
  lexicon: LSJ
  rationale: The dative repeats θύμος. Rendering it again as 'anger' preserves the lexical repetition. Because the phrase 'help anger' is unusual in English, the wording intentionally reflects the Greek's paradoxical claim rather than smoothing it into an interpretation not explicit in the text.
