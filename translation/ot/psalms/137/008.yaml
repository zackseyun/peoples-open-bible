id: PSA.137.8
reference: Psalms 137:8
source:
  edition: WLC
  text: בַּת בָּבֶ֗ל הַ/שְּׁד֫וּדָ֥ה אַשְׁרֵ֥י שֶׁ/יְשַׁלֶּם לָ֑/ךְ אֶת גְּ֝מוּלֵ֗/ךְ שֶׁ/גָּמַ֥לְתְּ לָֽ/נוּ־־־׃
translation:
  text: Daughter of Babylon[a], doomed to destruction[b], blessed is the one who pays you back for what you did to us.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: A poetic personification of Babylon and its people, not a separate daughter.
    reason: lexical_alternative
  - marker: b
    text: Or, “devastated one”; the Hebrew passive participle can describe devastation already suffered or anticipated.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּת בָּבֶל
  chosen: Daughter of Babylon
  alternatives:
  - Daughter of Babylon
  - O daughter Babylon
  lexicon: HALOT
  rationale: This is the natural English rendering of the poetic personifying construct.
- source_word: הַשְּׁדוּדָה
  chosen: devastated one
  alternatives:
  - destroyed one
  - plundered one
  - you who are to be destroyed
  lexicon: HALOT
  rationale: The passive participle denotes one devastated or plundered. This retains its image and does not force a future-oriented interpretation.
- source_word: אַשְׁרֵי
  chosen: blessed is
  alternatives:
  - happy is
  - fortunate is
  lexicon: HALOT
  rationale: Common beatitude formula. 'Blessed is' preserves the elevated, beatitude-like force better than 'happy,' especially in a psalmic context.
- source_word: שֶׁיְשַׁלֶּם לָךְ
  lemma: שׁלם
  chosen: who repays you
  alternatives:
  - who pays you back
  - who requites you
  lexicon: HALOT
  rationale: The verb שׁלם in this stem here denotes repayment/requital. 'Repays you' is natural modern English and preserves the judicial reciprocity of the line.
- source_word: אֶת גְּמוּלֵךְ
  chosen: with the recompense
  alternatives:
  - your recompense
  - what is due to you
  - your repayment
  lexicon: HALOT
  rationale: גְּמוּל denotes dealing, recompense, or repayment. Rendering with 'with the recompense' makes explicit the object of repayment and keeps the formal parallel with the following clause.
- source_word: שֶׁגָּמַלְתְּ לָנוּ
  chosen: you dealt to us
  alternatives:
  - you have done to us
  - you repaid us
  - you dealt with us
  lexicon: HALOT
  rationale: גמל can denote dealing with someone, whether for good or ill. In this context of Babylon's violence, 'dealt to us' preserves the lexical connection with גְּמוּל while allowing the negative sense to be supplied by context.
- source_word: שֶׁיְשַׁלֶּם לָךְ אֶת גְּמוּלֵךְ שֶׁגָּמַלְתְּ לָנוּ
  chosen: who pays you back for what you did to us
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This idiomatically conveys the reciprocal requital while preserving its negative force in context.
