id: JER.43.2
reference: Jeremiah 43:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֲזַרְיָ֤ה בֶן הוֹשַֽׁעְיָה֙ וְ/יוֹחָנָ֣ן בֶּן קָרֵ֔חַ וְ/כָל הָ/אֲנָשִׁ֖ים הַ/זֵּדִ֑ים אֹמְרִ֣ים אֶֽל יִרְמְיָ֗הוּ שֶׁ֚קֶר אַתָּ֣ה מְדַבֵּ֔ר לֹ֣א שְׁלָחֲ/ךָ֞ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לֵ/אמֹ֔ר לֹֽא תָבֹ֥אוּ מִצְרַ֖יִם לָ/ג֥וּר שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/002.yaml
  text: Azariah son of Hoshaiah, Johanan son of Kareah, and all the arrogant men said to Jeremiah, “You are speaking a lie. The LORD our God has not sent you to say, ‘You must not go to Egypt to sojourn there.’”
translation:
  language: ko
  text: 호사야의 아들 아사랴와 가레아의 아들 요하난과 모든 교만한 사람들이 예레미야에게 말했습니다. “당신은 거짓을 말하고 있습니다. 우리 하나님 여호와께서는 당신에게 ‘너희는 이집트에 가서 그곳에 머물러 살지 말라’고 말씀하라고 보내지 않으셨습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֶל יִרְמְיָהוּ
  english_pob_choice: said to Jeremiah
  chosen_korean: 예레미야에게 말했습니다
  alternatives_korean:
  - 예레미야에게 이르렀습니다
  - 예레미야에게 말하여
  lexicon: אמר
  rationale: 서술형 대화 도입은 현대 한국어에서 가장 자연스러운 ‘말했습니다’를 택해 원문의 직접 발화를 분명히 드러냈습니다.
- source_word: הַזֵּדִים
  english_pob_choice: the arrogant men
  chosen_korean: 거만한 사람들
  alternatives_korean:
  - 오만한 사람들
  - 교만한 사람들
  lexicon: זיד
  rationale: 모욕적 뉘앙스를 살리되, 현대어에서 과도하게 설교적이지 않은 ‘거만한’으로 옮겼습니다.
- source_word: שֶׁקֶר אַתָּה מְדַבֵּר
  english_pob_choice: You are speaking a lie
  chosen_korean: 당신은 거짓을 말하고 있습니다
  alternatives_korean:
  - 당신은 거짓말하고 있습니다
  - 당신이 말하는 것은 거짓입니다
  lexicon: שׁקר + דבר
  rationale: 직역적으로 ‘거짓을 말하다’는 구조를 살려, 단순한 ‘거짓말하다’보다 원문의 단정적 비난을 보존했습니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: The LORD our God
  chosen_korean: 우리 하나님 야훼께서는
  alternatives_korean:
  - 우리 하나님 여호와께서는
  - 우리 하나님께서는
  lexicon: יהוה + אלהים
  rationale: 프로젝트 기본어인 야훼를 유지하고, ‘우리 하나님’의 소유격을 자연스럽게 살렸습니다.
- source_word: לֹא תָבֹאוּ מִצְרַיִם לָגוּר שָׁם
  english_pob_choice: You must not go to Egypt to sojourn there
  chosen_korean: ‘너희는 이집트로 내려가 거기에서 머물면 안 된다’
  alternatives_korean:
  - ‘너희는 이집트로 가지 말고 거기 거주하면 안 된다’
  - ‘너희는 이집트로 가서 거기 머물러서는 안 된다’
  lexicon: בוא + גור
  rationale: ‘sojourn’의 임시 체류 의미를 ‘머물다’로 옮기고, 히브리어의 이동 방향을 한국어 관용에 맞게 ‘내려가’로 표현했습니다.
theological_decisions:
- issue: YHWH citation in direct speech
  chosen_reading: 야훼께서 직접 명령하신 내용으로 처리해, ‘말하라고 보내시지 않았다’는 비난이 단순한 정보 부정이 아니라 계시 권위 부정임을 드러냈습니다.
  alternative_readings:
  - 주님께서는
  - 여호와께서는
  rationale: 예레미야가 하나님의 이름을 앞세우는 거짓 대항을 받는 장면이므로, 신적 권위의 충돌을 흐리지 않도록 했습니다.
  doctrine_reference: 예언의 권위와 참/거짓 계시의 구별
- issue: Quoted prohibition wording
  chosen_reading: ‘너희는 … 머물면 안 된다’로 옮겨, 원문의 금지 명령을 직접 화법으로 보존했습니다.
  alternative_readings:
  - ‘가지 말아야 한다’
  - ‘가면 안 된다’
  rationale: 히브리어 부정 명령의 강도를 유지하면서도 한국어에서 자연스럽고 명료한 금지 표현을 택했습니다.
  doctrine_reference: 예언 말씀의 직접성
