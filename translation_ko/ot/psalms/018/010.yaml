lexical_decisions:
- source_word: וַיֵּט
  english_pob_choice: bent
  chosen_korean: 휘어 내리셨다
  alternatives_korean:
  - 내리셨다
  - 굽히셨다
  - 기울이셨다
  lexicon: HALOT
  rationale: נטה는 ‘펼치다/기울이다’의 범위를 가지지만, 하늘을 대상으로 한 신현적 시적 문맥에서는 하늘을 아래로 ‘휘게 하다’는 이미지가 가장 생생하게 전달됩니다.
- source_word: שָׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 하늘
  lexicon: HALOT
  rationale: 히브리어 복수형의 우주적 장엄함은 보존하되, 한국어에서는 시적·자연스러운 표현으로 ‘하늘’이 가장 적절합니다.
- source_word: וַעֲרָפֶל
  english_pob_choice: thick darkness
  chosen_korean: 짙은 어둠
  alternatives_korean:
  - 두터운 어둠
  - 짙은 흑암
  - 짙은 구름
  lexicon: HALOT
  rationale: ערפל은 신현과 연관된 짙고 응축된 어둠을 가리키므로, ‘짙은 어둠’이 과도한 해석 없이 밀도와 분위기를 함께 살립니다.
- source_word: רַגְלָיו
  english_pob_choice: his feet
  chosen_korean: 그의 발
  alternatives_korean:
  - 그의 발들
  - 그의 발아래
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그의 발들’이지만 한국어에서는 관용적으로 ‘그의 발 아래’라는 공간 관계로 자연스럽게 드러내는 것이 적절합니다.
theological_decisions:
- issue: 신체적 의인화와 신현적 이미지 보존
  chosen_reading: 하나님이 하늘을 ‘휘어 내리시고’ 실제로 ‘내려오시며’, 발 아래에 어둠이 있는 장면을 그대로 유지했습니다.
  alternative_readings:
  - 비유적으로 완화하여 하나님의 강림을 설명적으로 표현함
  - 의인화를 줄여 추상적으로 옮김
  rationale: 시적 신현 묘사는 설명으로 희석하기보다 원문의 구체적 이미지를 보존하는 것이 본문의 힘과 긴장을 가장 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
