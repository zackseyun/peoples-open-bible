  rationale: In line with the translation philosophy, titles are translated for meaning. Here the plural form refers to persons consecrated by God in Israel's history, not directly to the singular royal title 'Messiah.' Therefore 'anointed ones' preserves the lexical sense without importing later christological specificity.
