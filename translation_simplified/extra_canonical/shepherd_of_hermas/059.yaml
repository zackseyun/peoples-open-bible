    the punisher, to leave my house, because he afflicts me greatly.” “You must be afflicted,” he says,
    “for this is what the glorious angel has commanded concerning you. He wants you to be tested.” “What,
    sir,” I say, “have I done that is so evil that I should be handed over to this angel?”


    2. “Listen,” he says. “Your sins are many, but not so many that you should be handed over to this
    angel. Rather, your household has committed great lawless deeds and sins. The glorious angel was embittered
    at their works, and for this reason he ordered you to be afflicted for a certain time, so that they
    too might repent[c] and cleanse themselves from every desire of this age. When, therefore, they repent
    and are cleansed, then the angel of punishment will withdraw.”


    3. I say to him, “Sir, if they did such things as to embitter the glorious angel, what did I do?”
    “Otherwise,” he says, “they cannot be afflicted unless you, the head of the [whole] household[b],
    are afflicted. For when you are afflicted, they too will necessarily be afflicted; but while you are
    at ease, they cannot have any affliction[d].”


    4. “But look, sir,” I say, “they have repented with all their heart.” “I also know,” he says, “that
    they have repented with all their heart[e]. Do you think, then, that the sins of those who repent
    are forgiven immediately? Not at all[f]. Rather, the one who repents must afflict his own soul, be
    resolutely humble-minded in all his conduct, and be afflicted with all kinds of afflictions. If he
    endures the afflictions that come upon him, the one who created and strengthened all things will surely
    be moved with compassion and give some healing[g].”


    5. “And this will happen when [God] sees that the heart of the one who repents is clean from every
    evil deed[h]. It is beneficial for you and your household to be afflicted now. Why do I say so much
    to you? You must be afflicted, as that angel of the Lord commanded, the one who handed you over to
    me. And for this give thanks to the Lord: he considered you worthy to be told of the affliction beforehand,
