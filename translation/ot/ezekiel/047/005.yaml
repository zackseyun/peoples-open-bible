  from: Again he measured a thousand[a], and it was a river that I could not cross, because the waters had risen—waters to swim in[b], a river that could not be crossed.
  to: He measured off another thousand cubits, and it was now a river I could not wade across, because the water had risen—deep enough to swim in, a river that could not be crossed on foot.
  rationale: The earlier decisions rightly identify a river and preserve the emphatic repetition of its uncrossability. The progression from ankle to waist depth shows that the crossing now ruled out is crossing on foot, which the revised wording makes explicit.
