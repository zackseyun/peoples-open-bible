id: PSA.118.16
reference: Psalms 118:16
source:
  edition: WLC
  text: יְמִ֣ין יְ֭הוָה רוֹמֵמָ֑ה יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׃
translation:
  text: Yahweh’s right hand is raised high; Yahweh’s right hand acts with power.
  philosophy: dynamic
lexical_decisions:
- source_word: יְמִין
  chosen: right hand
  alternatives:
  - right side
  lexicon: HALOT
  rationale: The noun literally denotes the right hand/right side. In poetic and theological usage it commonly signifies strength, power, or victorious action. 'Right hand' preserves the Hebrew image rather than interpreting it as 'power' in the main text.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: רוֹמֵמָה
  chosen: is raised high
  alternatives:
  - is raised high
  - is lifted up
  - triumphs
  lexicon: HALOT
  rationale: Retains the poetic image of elevation without importing a praise sense.
- source_word: עֹשָׂה
  chosen: does
  alternatives:
  - works
  - acts
  lexicon: HALOT
  rationale: עשה is a broad verb meaning 'do/make/act.' In this collocation with חַיִל, English idiom is best captured by 'does' rather than the more wooden 'makes' or the more interpretive 'acts'.
- source_word: חָיִל
  chosen: valiantly
  alternatives:
  - might
  - strength
  - power
  - victoriously
  lexicon: HALOT
  rationale: חַיִל can denote strength, wealth, army, or valor. In the idiom עשה חיל, especially in martial or victory contexts, it means to act with valor or achieve mighty success. 'Valiantly' preserves the idiomatic force in natural English while retaining the psalm's triumphant tone.
- source_word: עֹשָׂה חָיִל
  chosen: acts with power
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural rendering of powerful, effective action.
