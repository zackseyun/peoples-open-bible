lexical_decisions:
- source_word: ὅσα
  chosen: what
  alternatives:
  - all that
  - whatever things
  lexicon: BDAG
  rationale: The neuter plural relative pronoun introduces the content known. In idiomatic English, 'what' best captures the sense without awkwardness; 'all that' is possible but slightly heavier.
- source_word: τε
  chosen: both
  alternatives:
  - and
  - also
  lexicon: LSJ
  rationale: The enclitic τε coordinates the pair κρυπτὰ καὶ ἐμφανῆ. Rendering it with 'both' brings out the correlative force naturally in English.
- source_word: κρυπτὰ
  chosen: what is hidden
  alternatives:
  - hidden things
  - secret things
  lexicon: LSJ
  rationale: κρυπτός means hidden or concealed. 'What is hidden' is natural English and preserves the broad scope; 'secret things' is possible but can imply intentional secrecy more strongly than the Greek requires.
- source_word: ἐμφανῆ
  chosen: what is plain
  alternatives:
  - what is manifest
  - what is evident
  - open things
  lexicon: LSJ
  rationale: ἐμφανής denotes what is visible, manifest, or evident. 'Plain' gives a readable modern equivalent that contrasts well with 'hidden' while preserving the sense of what is out in the open. 'Manifest' is more formal but less natural.
- source_word: ἔγνων
  chosen: I came to know
  alternatives:
  - I knew
  - I learned
  lexicon: BDAG
  rationale: The aorist of γινώσκω can denote coming to know or learning. 'I came to know' preserves the ingressive nuance in context, where the speaker is recounting wisdom's instruction. 'I knew' is possible but less precise.
