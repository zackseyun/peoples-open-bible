  terminology: ‘아시리아’, ‘보병’, ‘전차’, ‘기병들’, ‘베툴리아’는 적절합니다. ἀγγεῖα τῶν ὑδάτων은 특정 형태의 ‘독’으로 한정하기보다 ‘물 저장 용기’로 옮기는 것이 포괄적인 원문의 뜻을 잘 보존합니다.
