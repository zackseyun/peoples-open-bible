  rationale: 'Three source-based corrections: ὧδε limits the negated coming to “here”; ὡσεὶ νεώτερος ἐγεγόνειν
    preserves the comparison “as if I had become younger,” with καὶ αὐτός reflected by “I too”; and paragraph
    9 retains the opening καθώς comparison and explicit ἐρωτῶ σε request instead of turning the earlier
    showing solely into the object of “explain.” The latter remains a proposed rendering for fresh review,
    not a claim that the construction permits only this interpretation. Existing markers, paragraph prefixes,
    and paragraph divisions are preserved.; Section xi narrates affection, an overnight stay, and prayer;
    it does not state entry requirements.; The selected Greek supports these elements in paragraphs 3–8,
    but contains no statement about the Son’s role or gate/name and clothing requirements. The tunics
    are spread on the ground for lying down.; Scopes the rationale to xi and its existing textual notes
    rather than implying that this section contains the long editorial supplements discussed for other
    units.; Reconciles the simplification record with the corrected text and xi’s actual Greek contents.
    Ancient repair materials, gate/name requirements, and a holy-spirits plural do not occur in this section.'
- category: publication_review_correction
  rationale: 'Reconsideration of the prior lexical rendering “returns,” independently checked against
