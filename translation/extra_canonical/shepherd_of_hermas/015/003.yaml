translation:
  text: And those others that fall near the waters yet are not able to roll into the water—do you want to know who they are? These are the ones who have heard the word and want to be baptized into the name of the Lord; then, when the purity of the truth comes to their remembrance, they change their minds[a] and go back again after their evil desires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Earlier reader wording used a form of "repent." This occurrence describes abandoning the intended baptism and going back after evil desires. Render the change of mind without implying Godward reorientation. The recorded Greek can be used for reconsideration in this adverse direction.
    reason: lexical_alternative
