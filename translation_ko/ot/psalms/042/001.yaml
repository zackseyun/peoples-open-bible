  lexicon: HALOT
  rationale: לִבְנֵי는 표제에서 저자·소속·사용 대상을 모두 열어 둘 수 있으므로, 한국어에서는 소속 관계를 가장 무리 없이 드러내는 소유격으로 옮겼습니다. 고유명사 코라는 관용 표기를 따랐습니다.
