id: MRK.5.11
reference: Mark 5:11
source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ πρὸς τῷ ὄρει ἀγέλη χοίρων μεγάλη βοσκομένη·
translation:
  text: A large herd of pigs was feeding there near the mountain.
  philosophy: dynamic
lexical_decisions:
- source_word: ἦν δὲ
  chosen: There was
  alternatives:
  - And there was
  - Now there was
  lexicon: BDAG
  rationale: 'ἦν gives the existential ''there was.'' δέ is a mild connective; ''now'' preserves the narrative transition in readable English better than a bare ''and,'' while not overstating contrast. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: ἐκεῖ
  chosen: there
  alternatives:
  - in that place
  lexicon: BDAG
  rationale: Simple locative adverb; 'there' is the natural direct equivalent.
- source_word: πρὸς τῷ ὄρει
  chosen: near the mountain
  alternatives:
  - by the mountain
  - at the mountain
  lexicon: BDAG
  rationale: With the dative, πρός here indicates proximity/location. 'Near the mountain' is idiomatic English and preserves the spatial sense without overprecision.
- source_word: ἀγέλη
  chosen: herd
  alternatives:
  - drove
  lexicon: BDAG
  rationale: ἀγέλη denotes a herd or drove of animals. 'Herd' is the most common and natural English term here.
- source_word: χοίρων
  chosen: of pigs
  alternatives:
  - of swine
  lexicon: BDAG
  rationale: χοῖρος refers to pigs/swine. 'Pigs' is preferred for readable modern English; 'swine' is a valid but more formal alternative.
- source_word: μεγάλη
  chosen: large
  alternatives:
  - great
  - big
  lexicon: BDAG
  rationale: μέγας here describes size/number of the herd. 'Large' is the most natural attributive rendering in contemporary English.
- source_word: βοσκομένη
  chosen: feeding
  alternatives:
  - grazing
  - being fed
  - pasturing
  lexicon: BDAG
  rationale: The present participle describes the herd in the act/state of feeding. 'Feeding' is concise and natural. 'Grazing' is possible, but 'feeding' is broader and avoids implying only grass-eating.
