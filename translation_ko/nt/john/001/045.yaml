id: JHN.1.45
reference: John 1:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
  footnotes:
  - marker: a
    text: Or, more formally, “the one of whom Moses wrote in the Law, and the prophets also.”
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has “Jesus of Nazareth”; the Greek more literally says “Jesus ... from Nazareth.”
    reason: lexical_alternative
translation:
  language: ko
  text: 빌립은 나다나엘을 찾아 그에게 말했습니다. “우리는 모세가 율법에서 기록하고 선지자들도 기록한 그분[a], 곧 요셉의 아들이며 나사렛 출신인 예수[b]를 찾았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모세가 율법에서 기록하고 선지자들도 기록한 분”이라고 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 문자적으로 “나사렛에서 온 예수”라고 말합니다. ‘나사렛 출신’은 이 표현을 자연스러운 한국어로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρίσκει / λέγει
  english_pob_choice: found / said (past)
  chosen_korean: 찾았습니다 / 말했습니다
  alternatives_korean:
  - 찾는다 / 말한다 (현재)
  - 찾았다 / 말했다 (과거형, 서술형)
  lexicon: BDAG; narrative practice
  rationale: 그리스어의 역사적 현재(εὑρίσκει, λέγει)를 한국어로 그대로 현재형으로 옮기면 산문 흐름이 부자연스럽습니다. 영어 POB와 마찬가지로 한국어 내러티브 흐름을 위해 과거 시제로 번역했습니다(찾았습니다·말했습니다).
- source_word: ἐν τῷ νόμῳ
  english_pob_choice: in the Law
  chosen_korean: 율법에
  alternatives_korean:
  - 율법에서
  - 토라에서
  lexicon: BDAG; POB glossary
  rationale: 모세를 지칭하는 문구이므로 정경적·전통적 의미를 살려 '율법'으로 번역했습니다. '토라'도 가능하지만, 현대 한국어 독자에게는 '율법'이 익숙하고 원문의 종교적 함의를 보존합니다.
- source_word: Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν
  english_pob_choice: the one Moses wrote about in the Law, and also the prophets; we have found
  chosen_korean: 모세가 율법에 기록하고 선지자들도 기록한 그를 찾았습니다
  alternatives_korean:
  - 모세가 율법에서 기록한 그 사람을 우리가 찾았습니다
  - 모세가 율법에 대하여 기록한 그를 우리가 발견했습니다
  lexicon: BDAG; Greek relative construction
  rationale: 원문은 '그(Ὃν)에 대해 모세가 율법에 기록했고 선지자들도 기록했다'는 지적입니다. 한국어로는 '모세가 율법에 기록하고 선지자들도 기록한 그'처럼 관형절로 처리해, 원문의 인물 지시와 두 축의 성서적 증언(율법·선지자)을 그대로 드러냈습니다.
- source_word: υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ
  english_pob_choice: Jesus son of Joseph, from Nazareth
  chosen_korean: 요셉의 아들, 나사렛 출신 예수
  alternatives_korean:
  - 요셉의 아들 예수
  - 나사렛 예수(나사렛 출신의 예수)
  lexicon: BDAG; POB notes
  rationale: 그리스어 어순은 '예수(Ἰησοῦν) — 요셉의 아들(υἱὸν τοῦ Ἰωσὴφ) — 나사렛 출신(τὸν ἀπὸ Ναζαρέτ)'입니다. 한국어에서 자연스럽고 원문을 충실히 반영하기 위해 '요셉의 아들, 나사렛 출신 예수'로 처리했고, 말하는 이(빌립)의 단순한 사회적 식별을 유지했습니다.
theological_decisions:
- issue: Reference of 'son of Joseph' in relation to christology
  chosen_reading: 화자는 사람 간의 사회적 식별로 '요셉의 아들'이라고 말한 것으로 번역함
  alternative_readings:
  - 예수를 '요셉의 아들로 여긴 사람(추정적 표지)'으로 번역
  - 예수의 신적 독특성을 강조하여 '요셉의 아들이 아닌' 식으로 보완 번역
  rationale: 본문은 빌립의 말(보고)으로, 역사적·서술적 맥락에서 단순한 신분 식별을 제공하고 있습니다. 후대 교리(처녀잉태 등)를 본문에 불필요하게 삽입하지 않고, 화자의 관점을 그대로 전달하는 것이 원문 충실성에 부합합니다.
  doctrine_reference: Affirmations; Translation philosophy items 1 and 3
- issue: Scope of 'Moses in the Law and the prophets' (scriptural witness)
  chosen_reading: 모세(율법)와 선지자들 모두가 그에 관해 기록한 사람으로 번역함
  alternative_readings:
  - '''모세가 율법에서 기록한 사람''만을 지칭'
  - '''모세(율법)와 선지자들이 합쳐서 예언적으로 가리킨 인물''으로 강하게 메시아적 해석'
  rationale: 그리스어는 두 범주의 증언을 병렬로 제시합니다(ἐν τῷ νόμῳ καὶ οἱ προφῆται). 번역은 이 두 증언의 병행을 보존하되, 빌립의 주장으로서 지나친 메시아 해석을 본문 밖에서 더하지 않았습니다.
  doctrine_reference: Translation philosophy items 1 and 6
