  text: καὶ πάντες οἱ ἀδελφοὶ ἡμῶν οἱ ὄντες ἐν τοῖς Τουβίου τεθανάτωνται, καὶ αἰχμαλωτίκασι τὰς γυναῖκας αὐτῶν καὶ τὰ τέκνα αὐτῶν καὶ τὴν ὑποσκευήν, καὶ ἀπώλεσαν ἐκεῖ ὡς μίαν χιλιάδα ἀνδρῶν.
