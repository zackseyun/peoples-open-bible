  text: ἔκρινα τοίνυν ταύτην ἀγαγέσθαι πρὸς συμβίωσιν, εἰδὼς ὅτι ἔσται μοι σύμβουλος ἀγαθῶν, καὶ παραίνεσις φροντίδων καὶ λύπης.
  language: Greek
