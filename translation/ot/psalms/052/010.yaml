  to: I will give thanks to you forever, because you have done it; I will hope in your name[a], for it is good[b], in the presence of your faithful ones.
  rationale: The current wording "wait for your name" is formally close but genuinely misleading or unnatural in contemporary English, readily suggesting that a name is awaited for announcement rather than expectant trust directed toward God as disclosed in his name. "Hope in your name" is a restrained, contextually faithful rendering of קוה with this object. The marker for this alternative must move from "forever" to the clause it concerns. Retain the compact "for it is good," since the Hebrew leaves the antecedent implicit; the second note honestly supplies the explicit construal.
