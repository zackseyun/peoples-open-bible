id: PSA.77.1
reference: Psalms 77:1
source:
  edition: WLC
  text: קוֹלִ֣/י אֶל אֱלֹהִ֣ים וְ/אֶצְעָ֑קָה קוֹלִ֥/י אֶל אֱ֝לֹהִ֗ים וְ/הַאֲזִ֥ין אֵלָֽ/י־־׃
translation:
  text: I cry aloud to God; I cry aloud to God, that he may listen to me[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “and he listens to me”; the final clause can also be understood as a statement of God’s response.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹלִי
  chosen: My voice
  alternatives:
  - I lift my voice
  - I cry with my voice
  lexicon: HALOT
  rationale: The Hebrew noun literally means 'voice' with first-person singular suffix. Retaining 'my voice' preserves the poetic emphasis and parallelism rather than collapsing it immediately into the verbal idea 'I cry.'
- source_word: אֶל
  chosen: to
  alternatives:
  - toward
  lexicon: HALOT
  rationale: The preposition marks direction toward God. 'To' is natural English and preserves the sense of directed address.
- source_word: אֱלֹהִים
  chosen: God
  lexicon: HALOT
  rationale: In this context the plural-form noun clearly refers to the one true God and takes singular sense in translation.
- source_word: וְאֶצְעָקָה
  chosen: and I cry out
  alternatives:
  - and I call out
  - and I cried out
  lexicon: HALOT
  rationale: From צעק, expressing a strong cry for help. The cohortative/imperfect form here is best represented in English as a vivid present-like poetic statement, 'I cry out,' rather than a simple future. 'Cry out' preserves the intensity better than merely 'call.'
- source_word: וְהַאֲזִין
  chosen: and he gives ear
  alternatives:
  - and he listened
  - and he heard me
  - and he paid attention
  lexicon: HALOT
  rationale: From אזן, 'to give ear, listen attentively.' The subject is third masculine singular, referring to God. 'Gives ear' preserves the attentive nuance and the poetic register better than the flatter 'heard me.'
- source_word: אֵלַי
  chosen: to me
  alternatives:
  - to my voice
  - unto me
  lexicon: HALOT
  rationale: The preposition with first-person suffix is straightforwardly 'to me.' Although English might idiomatically expect 'heard me,' the Hebrew keeps the directional phrasing after 'give ear,' which is preserved here.
- source_word: קוֹלִי אֶל־אֱלֹהִים
  chosen: I cry aloud to God
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This gives idiomatic English expression to the nominal cry while retaining its audible force and exact repetition.
- source_word: וְהַאֲזִין אֵלָי
  chosen: that he may listen to me
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The form is appropriately represented as a volitive/jussive appeal in context, rather than as a completed or present declarative response.
