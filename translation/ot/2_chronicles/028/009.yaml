translation:
  text: A prophet of Yahweh named Oded was there. He went out to meet the army as it approached Samaria and said to them, “Look, because Yahweh, the God of your fathers, was angry with Judah, he handed them over to you. But you have killed them in a rage that has reached up to heaven.
