- field: lexical_decisions
  value:
  - source_word: ወበእንተዝ
    chosen: And because of this
    alternatives:
    - And concerning this
    - Therefore
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: The phrase introduces the reason for the preceding prohibition/explanation. 'Because
      of this' preserves the causal force better than a merely topical 'concerning this.'
  - source_word: ኢረሰይኩ
    chosen: I have not appointed
    alternatives:
    - I did not make
    - I have not assigned
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: The verb here carries the sense of establishing, assigning, or appointing rather
      than simple physical making. In context God is speaking of what was not allotted to the
      watchers.
  - source_word: ለክሙ
    chosen: for you
    alternatives:
    - to you
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: Idiomatic English with the verb 'appoint' takes 'for you'; the dative sense is
      preserved.
  - source_word: አንስቲያ
    chosen: wives
    alternatives:
    - women
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: In this context the issue is marital/sexual pairing assigned to beings; 'wives'
      is more specific and fits the contrast with angelic dwelling and order. 'Women' is possible
      but less precise.
  - source_word: እስመ
    chosen: for
    alternatives:
    - because
    - since
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: Introduces the explanatory ground for the statement. 'For' keeps the elevated
      register and concise causal link.
  - source_word: መንፈሳውያነ
    chosen: the spiritual ones
    alternatives:
    - spiritual beings
    - spirits
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: The adjective/substantival form points to beings characterized as spiritual.
      'The spiritual ones' preserves the form and avoids over-resolving whether the emphasis
      is on nature ('spirits') or class ('spiritual beings').
  - source_word: ሰማይ
    chosen: of heaven
    alternatives:
    - heavenly
    - of the sky
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: The genitival relation is best preserved as 'of heaven.' This keeps the repeated
      heaven-language audible in the verse.
  - source_word: ውስተ ሰማይ
    chosen: in heaven
    alternatives:
    - within heaven
    - in the heavens
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: A straightforward locative phrase. 'In heaven' is natural English and preserves
      the repetition with the prior 'of heaven.'
  - source_word: መሓድሪሆሙ
    chosen: the dwelling ... is
    alternatives:
    - their dwelling-place is
    - their habitation is
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: This noun denotes dwelling or habitation. 'The dwelling ... is in heaven' is
      clear and elevated without becoming archaic.
  certifies_this_candidate: false
- field: theological_decisions
  value:
  - issue: Whether to render መንፈሳውያነ ሰማይ as 'spirits of heaven,' 'heavenly spirits,' or 'the
      spiritual ones of heaven'
    chosen_reading: the spiritual ones of heaven
    alternative_readings:
    - the spirits of heaven
    - the heavenly spiritual beings
    rationale: The Ge'ez wording appears adjectival/substantival rather than a simple noun 'spirits.'
      The chosen rendering preserves the category of beings without collapsing the phrase into
      later angelological shorthand. It also keeps the apocalyptic contrast between their proper
      sphere and illicit earthly unions.
    doctrine_reference: Preserve theological tension rather than resolve it; original-language
      primacy over translation tradition.
  - issue: Whether አንስቲያ should be generalized as 'women' or specified as 'wives'
    chosen_reading: wives
    alternative_readings:
    - women
    rationale: The verse explains that such beings were not assigned marital partners because
      their proper habitation is heavenly. 'Wives' better reflects the notion of allotted spouses
      rather than merely contact with females in general.
    doctrine_reference: Optimal equivalence with documented exception; preserve local passage
      sense rather than harmonizing broadly.
