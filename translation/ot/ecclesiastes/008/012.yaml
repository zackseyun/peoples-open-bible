  from: Though a sinner does evil a hundred times and lives long, yet I also know that it will be well for those who fear God, who fear before him.
  to: Though a sinner does evil a hundred times and lives long, yet I also know that it will go well for those who fear God, who stand in awe before him.
  rationale: I retain the latest revision's “lives long,” which avoids suggesting that the sinner controls his lifespan. The repeated description of fearing God remains, but its second occurrence is expressed in natural English.
