base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/022.yaml
  text: As for me, I said in my alarm[a], “I am cut off from your sight[b].” Yet you heard the sound of my pleas when I cried to you for help.
  footnotes:
  - marker: a
    text: Or “in my haste.” The Hebrew can denote haste, agitation, or panic.
    reason: lexical_alternative
  - marker: b
    text: Literally “from before your eyes.”
    reason: literal_rendering
translation:
  language: ko
  text: 그러나 저는 당황한 가운데 말했습니다. “저는 주님의 눈앞에서 끊어졌습니다.” 그러나 제가 주님께 부르짖을 때에 주님께서는 제 간구의 소리를 들으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “황급한 가운데.” 히브리어는 황급함, 동요, 또는 공황을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “주님의 눈앞에서.” 또는 “주님의 시야에서.”
    reason: lexical_alternative
