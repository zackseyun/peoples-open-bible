  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: idiom
  tier: 1
  from: Be still[a], and know that I am God. I will be exalted among the nations[b][c]; I will be exalted in the earth.
  to: Be still[a], and know that I am God. I will be exalted[b] among the nations; I will be exalted on earth[c].
  rationale: The proposal correctly identifies that “in the earth” is not natural English for the worldwide sphere intended here; “on earth” is the smallest idiomatic correction and does not alter the earth/land ambiguity retained in the note. Its footnote reassignment also corrects genuine marker mismatches. However, replacing “Be still” with “Stop” is not required. הַרְפּוּ can mean desist, let go, or slacken; “Be still” is established, suitably elevated Psalm diction and leaves the command's breadth open, whereas the bare modern “Stop” is less fitting in register and offers no clear gain in source fidelity.
