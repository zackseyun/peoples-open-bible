  from: their hand
  to: Judah's hand
  rationale: The pronoun 'their' is ambiguous. Its most immediate plural antecedent in the clause is 'them' (the sons of Israel), which would lead to the nonsensical reading 'God gave them into their own hand.' While the context makes the intended antecedent (Judah) recoverable, the momentary ambiguity hinders clarity. Replacing the pronoun with its antecedent ('Judah's hand') resolves this awkwardness without changing the meaning, which is a common practice to aid readability when source-language pronouns don't map clearly into the target language.
