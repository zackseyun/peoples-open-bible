translation:
  text: '[And now,][a] you were in heaven, but not yet had (all)[b] the hidden things been revealed
    to you.[c] You knew a despised mystery,[d] and you made this known to women in the hardness
    of your hearts; through this mystery women and men multiplied evil upon the earth.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Charles brackets “And now” and identifies it as an Ethiopic interpolation.
    reason: textual_variant
  - marker: b
    text: All” is parenthesized and critically starred in Charles’s printed text. His apparatus
      states that he added it in accordance with the Greek. It should not be presented as an
      independently established Ethiopic manuscript reading.
    reason: textual_variant
  - marker: c
    text: The negative is critically marked in the printed Ethiopic. This translation follows
      that editorially marked reading and retains “not yet”; the resulting sentence is not an
      unqualified manuscript reading.
    reason: textual_variant
  - marker: d
    text: A despised mystery” follows the Ethiopic wording. “Worthless” would interpret its
      significance. The Greek main text differs, describing a mystery originating from God;
      Charles’s Greek apparatus identifies the Ethiopic counterpart as “despised.” The Greek
      wording has not been substituted into this translation.
    reason: textual_variant
  - marker: e
    text: The disclosure is made to women. In the ensuing clause, women and men multiply evil
      upon the earth. “Hardness of your hearts” describes the Watchers’ disposition; it must
      not be reassigned to the human recipients.
    reason: textual_variant
