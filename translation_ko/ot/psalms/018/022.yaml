  naturalness: 수정문은 현대 표준 한국어의 합쇼체로 자연스럽습니다. ‘내게서 치워 버리지 않았습니다’는 히브리어 히필의 타동적 표현과 מֶנִּי(‘내게서’)를 살리면서도 한국어에서 이해 가능한 표현입니다.
  terminology: מִשְׁפָּטָיו는 시편의 율법 용어로 ‘법도’, חֻקֹּתָיו는 ‘율례’로 구별했습니다. 신명은 이 절에 없으므로 ‘야훼’나 ‘하나님’ 표기는 삽입하지 않았습니다.
