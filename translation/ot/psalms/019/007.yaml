id: PSA.19.7
reference: Psalms 19:7
source:
  edition: WLC
  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
translation:
  text: The law of Yahweh is perfect, restoring the soul[a]; the testimony of Yahweh is trustworthy, making the naive wise.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'reviving the soul.'
    reason: alternative_reading
lexical_decisions:
- source_word: תּוֹרַת
  chosen: law
  alternatives:
  - instruction
  lexicon: HALOT
  rationale: תּוֹרָה can denote instruction broadly, but in Psalm 19 it refers to the LORD’s revealed instruction in a weighty, covenantal sense. 'Law' preserves the traditional and theological force while remaining natural English. 'Instruction' is a viable alternative but is less idiomatic in this poetic parallelism.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: תְּמִימָה
  chosen: perfect
  alternatives:
  - blameless
  - whole
  - complete
  lexicon: HALOT
  rationale: The adjective conveys completeness, soundness, and integrity. 'Perfect' best captures the comprehensive excellence of the LORD’s law in this poetic context, though the semantic range includes 'whole' or 'blameless'.
- source_word: מְשִׁיבַת
  chosen: restoring
  alternatives:
  - reviving
  - bringing back
  - refreshing
  lexicon: HALOT
  rationale: From שוב, the participle means causing a return or restoration. 'Restoring' preserves that core sense without overinterpreting. 'Reviving' is a common English rendering and fits the context, but 'restoring' better reflects the verbal root's return/restoration nuance.
- source_word: נָפֶשׁ
  chosen: the soul
  alternatives:
  - the life
  - the self
  - the person
  lexicon: HALOT
  rationale: נֶפֶשׁ has a broad range including life, self, and inner being. 'Soul' is concise and traditional here, and in this poetic setting it suitably conveys the whole inner person without requiring a more expansive paraphrase.
- source_word: עֵדוּת
  chosen: testimony
  alternatives:
  - decree
  - witness
  - covenant stipulation
  lexicon: HALOT
  rationale: In Psalm 19’s sequence of terms for divine revelation, עֵדוּת refers to the LORD’s attested witness or covenantal testimony. 'Testimony' is the most direct and established rendering in this context.
- source_word: נֶאֱמָנָה
  chosen: trustworthy
  alternatives:
  - sure
  - faithful
  - reliable
  lexicon: HALOT
  rationale: The term denotes firmness and reliability. 'Trustworthy' communicates this clearly in contemporary English. 'Sure' is traditional but less natural for many modern readers.
- source_word: מַחְכִּימַת
  chosen: making ... wise
  alternatives:
  - giving wisdom to
  - wise-ing
  lexicon: HALOT
  rationale: The participle means causing someone to become wise. 'Making ... wise' is the most natural and direct English equivalent.
- source_word: פֶּתִי
  chosen: the simple
  alternatives:
  - the naive
  - the inexperienced
  - the gullible
  lexicon: HALOT
  rationale: פֶּתִי refers to the inexperienced or naive person, not necessarily morally corrupt but vulnerable and unformed. 'The simple' is concise, traditional, and fits wisdom-literature usage well.
