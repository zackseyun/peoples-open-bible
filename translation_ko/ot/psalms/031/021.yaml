id: PSA.31.21
reference: Psalms 31:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּסְתִּירֵ֤/ם בְּ/סֵ֥תֶר פָּנֶי/ךָ֮ מֵֽ/רֻכְסֵ֫י אִ֥ישׁ תִּצְפְּנֵ֥/ם בְּ/סֻכָּ֗ה מֵ/רִ֥יב לְשֹׁנֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/021.yaml
  text: Blessed be Yahweh, for he has wonderfully shown his steadfast love to me in a fortified city[a].
  footnotes:
  - marker: a
    text: Or 'from the conspiracies of man' or 'from the plots of man.' The Hebrew term rendered 'schemes' is rare and may denote hostile combinations or machinations.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from the strife of tongues,' that is, from hostile or slanderous speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 찬송합니다. 그분께서 포위된 성읍[a]에서 나에게 그분의 한결같은 사랑을 놀랍게 나타내셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘포위된 성읍’으로도 ‘견고한 성읍’으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּסְתִּירֵם
  english_pob_choice: You hide them
  chosen_korean: 그들을 숨기시고
  alternatives_korean:
  - 그들을 숨기고
  - 그들을 감추시고
  lexicon: WLC
  rationale: 히필형은 하나님이 능동적으로 보호를 베푸는 의미이므로 수동적으로 약화하지 않고, 자연스러운 현대 한국어로 ‘숨기시고’라 옮겼습니다.
- source_word: בְּסֵתֶר פָּנֶיךָ
  english_pob_choice: in the shelter of your presence
  chosen_korean: 주님의 얼굴의 은밀한 곳에
  alternatives_korean:
  - 주님의 임재의 은밀한 곳에
  - 주님의 얼굴의 피난처에
  lexicon: WLC
  rationale: סֵתֶר는 ‘은밀한 곳/숨는 곳’이고 פָּנִים은 문자적으로 ‘얼굴’이지만 여기서는 인격적 임재를 가리킵니다. ‘얼굴의 은밀한 곳’은 원문의 이미지와 신학적 긴장을 함께 보존합니다.
- source_word: מֵרֻכְסֵי אִישׁ
  english_pob_choice: from the schemes of man
  chosen_korean: 사람의 음모에서
  alternatives_korean:
  - 사람의 계략에서
  - 사람의 모의에서
  lexicon: WLC
  rationale: 희귀어 רֻכְסֵי는 문맥상 적대적 인간의 책략·음모를 가리키므로, POB의 해석을 따라 현대 한국어에서 분명한 ‘음모’로 옮겼습니다. אִישׁ은 대표적 단수로 ‘사람’이라 했습니다.
- source_word: תִּצְפְּנֵם
  english_pob_choice: you conceal them
  chosen_korean: 그들을 장막 속에 감추십니다
  alternatives_korean:
  - 그들을 장막 속에 숨기십니다
  - 그들을 비밀히 간직하십니다
  lexicon: WLC
  rationale: צפן은 ‘숨기다/간직하다’의 뜻이 있어, 앞절과 구별되면서도 보호의 뉘앙스를 살리는 ‘감추십니다’를 선택했습니다. בְּסֻכָּה는 여기서 절기용 초막보다 보호용 ‘장막/초막’의 뜻이 우선입니다.
- source_word: מֵרִיב לְשֹׁנוֹת
  english_pob_choice: from the strife of tongues
  chosen_korean: 혀들의 다툼에서
  alternatives_korean:
  - 말싸움에서
  - 비방의 말에서
  lexicon: WLC
  rationale: רִיב은 ‘다툼/분쟁’이고 לְשֹׁנוֹת은 문자적으로 ‘혀들’이므로, 시적 이미지와 적대적 말을 함께 살려 직역성 높은 ‘혀들의 다툼’으로 옮겼습니다.
theological_decisions:
- issue: פָּנִים을 ‘얼굴’로 살릴지 ‘임재’로 풀지
  chosen_reading: ‘얼굴의 은밀한 곳’으로 유지해, 하나님의 인격적 임재와 보호의 이미지를 함께 드러냈습니다.
  alternative_readings:
  - ‘임재의 은밀한 곳’
  - ‘얼굴’ 대신 완전한 의역
  rationale: 시편의 병행법은 보호와 친밀함을 동시에 강조하므로, 전통적 신앙어를 완전히 대체하지 않으면서도 원문 이미지의 긴장을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: 시편의 의인화 표현을 과도하게 평탄화하지 않는 번역 원칙
