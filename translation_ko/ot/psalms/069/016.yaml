  text: Answer me, O Yahweh, for your steadfast love is good; according to your abundant compassion, turn to me.
translation:
  language: ko
  text: 야훼여, 주의 한결같은 사랑이 좋으니 제게 응답하소서. 주의 풍성한 자비를 따라 제게로 돌이키소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁטְפֵנִי / שִׁבֹּלֶת מַיִם
  english_pob_choice: sweep me away / the flood of waters
  chosen_korean: 저를 휩쓸어 가지 못하게 하시고 / 물의 홍수가
  alternatives_korean:
  - 저를 쓸어가 버리게 하시고
  - 저를 휩쓸지 못하게 하시고 / 물의 물결이
  lexicon: HALOT
  rationale: שטף의 파괴적 유동성을 ‘휩쓸어 가다’로 살리고, שִׁבֹּלֶת מַיִם은 ‘물의 홍수’로 옮겨 급류·범람의 압도감을 보존했습니다.
- source_word: מְצוּלָה
  english_pob_choice: the deep
  chosen_korean: 깊음이
  alternatives_korean:
  - 깊은 곳이
  - 깊은 물이
  lexicon: HALOT
  rationale: 시적 병행 속에서 מְצוּלָה의 ‘깊은 수역’ 이미지를 간결하게 살리기 위해 ‘깊음’으로 옮겼습니다.
- source_word: בְּאֵר פִּיהָ
  english_pob_choice: the pit close its mouth over me
  chosen_korean: 구덩이가 저 위로 입을 닫지 못하게 하소서
  alternatives_korean:
  - 우물이 저 위로 입을 닫지 못하게 하소서
  - 구덩이의 입이 저를 덮지 못하게 하소서
  lexicon: HALOT
  rationale: 문맥상 neutral한 ‘우물’보다 위협적 구멍/심연의 뜻을 살리는 ‘구덩이’가 더 적절하며, ‘입을 닫다’로 의인화된 이미지를 유지했습니다.
theological_decisions:
- issue: 시편의 간구형 부정 명령을 한국어 기도체로 어떻게 나타낼지
  chosen_reading: -지 못하게 하시고 / -지 못하게 하소서의 간구형으로 옮겼습니다.
  alternative_readings:
  - 직설적으로 ‘물의 홍수가 저를 휩쓸지 말게 하소서’로 옮길 수 있음
  - 서술형 ‘휩쓸어 가지 않게 해 주십시오’로 완화할 수 있음
  rationale: 히브리어 부정 명령의 간절한 청원을 한국어 예배·기도 문체에 맞게 살리되, 합쇼체의 품위를 유지했습니다.
  doctrine_reference: 시편의 탄원 기도 형식
