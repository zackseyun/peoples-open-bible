translation:
  text: But you would not judge these things worthy of torture[a],
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “But these things of you are not worthy of tortures”; the Greek wording is difficult.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  chosen: But
  alternatives:
  - rather
  - yet
  lexicon: BDAG
  rationale: Adversative conjunction marking contrast with the preceding statement; 'But' is the most natural concise English equivalent here.
- source_word: ταῦτα
  chosen: these things
  alternatives:
  - this
  - such things
  lexicon: BDAG
  rationale: Neuter plural demonstrative; 'these things' preserves the plural form and leaves the referent broad, as in the Greek.
- source_word: ὑμῶν
  chosen: from you
  alternatives:
  - of you
  - belonging to you
  lexicon: BDAG
  rationale: 'The genitive here is best taken as a source or relation genitive in context: the speaker says that such things coming from the addressees are unworthy of the tortures being inflicted. ''From you'' is more idiomatic and contextually pointed than the wooden ''of you.'''
- source_word: βασάνων
  chosen: tortures
  alternatives:
  - torments
  - tests
  lexicon: BDAG
  rationale: βάσανος in this martyrdom context refers to physical torture or torment, not merely testing. The plural 'tortures' matches the Greek genitive plural and the concrete setting.
- source_word: ἄξια
  chosen: worthy of
  alternatives:
  - deserving
  - fit for
  lexicon: BDAG
  rationale: ἄξιος with a genitive commonly expresses worthiness or desert. 'Worthy of' stays close to the Greek while remaining natural English.
