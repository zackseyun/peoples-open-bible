id: JOB.30.24
reference: Job 30:24
source:
  edition: WLC
  text: אַ֣ךְ לֹא בְ֭/עִי יִשְׁלַח יָ֑ד אִם בְּ֝/פִיד֗/וֹ לָהֶ֥ן שֽׁוּעַ־־־׃
translation:
  text: Yet does not someone brought to ruin stretch out a hand, or cry for help in disaster[a]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew is exceptionally uncertain; another understanding is, “Surely no one raises a hand against a ruined person who cries for help in disaster.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  chosen: Yet
  alternatives:
  - Yet
  - Only
  - However
  lexicon: HALOT
  rationale: An adversative transition fits Job’s movement from expected death to the present observation, though the particle can also have an emphatic force.
- source_word: בְּעִי
  chosen: amid ruins
  alternatives:
  - on a heap of ruins
  - against a heap
  - in a ruin
  lexicon: HALOT
  rationale: The rare form is commonly associated with ruin or a ruin heap, but the exact construction is uncertain; this rendering avoids falsely specifying either an attacked object or a literal location in one particular heap.
- source_word: יִשְׁלַח יָד
  chosen: stretch out a hand
  alternatives:
  - put forth a hand
  - strike with the hand
  - attack
  lexicon: HALOT
  rationale: This is a common Hebrew idiom. A relatively formal rendering preserves the imagery while allowing readers to infer hostile action from context.
- source_word: אִם
  chosen: if
  alternatives:
  - surely
  - indeed
  - when
  lexicon: HALOT
  rationale: Taken here in a conditional or concessive sense linking the second colon to the first. The verse is notoriously difficult, but 'if' best preserves the Hebrew particle without over-resolving the syntax.
- source_word: בְּפִידוֹ
  chosen: in his calamity
  alternatives:
  - at his disaster
  - in his destruction
  - when he falls
  lexicon: HALOT
  rationale: פיד denotes disaster/calamity. 'In his calamity' preserves the preposition and the personal suffix while remaining natural English.
- source_word: לָהֶן
  chosen: from them
  alternatives:
  - for them
  - to them
  - therein
  lexicon: HALOT
  rationale: The form is difficult in context. Rendering it 'from them' gives a plausible relational sense with 'cry for help' while acknowledging the obscurity of the clause. Because the syntax is uncertain, an alternative is preserved in a footnote.
- source_word: שׁוּעַ
  chosen: a cry for help
  alternatives:
  - cry
  - outcry for help
  lexicon: HALOT
  rationale: The noun denotes a cry for help, often in distress. 'A cry for help' makes the nuance explicit in readable English.
- source_word: אִם בְּפִידוֹ לָהֶן שׁוּעַ
  chosen: or cry for help in disaster
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This retains the disaster and appeal elements while avoiding an artificially precise agent and syntactic relationship in a corrupt or highly obscure clause.
