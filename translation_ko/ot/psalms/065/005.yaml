  terminology: ‘구원’, ‘의로움’, ‘신뢰’는 각각 יֵשַׁע, צֶדֶק, מִבְטָח의 넓은 의미를 과도한 교리화 없이 반영합니다. נוֹרָאוֹת는 단순한 ‘놀라운’보다 경외와 두려움의 함의를 보존하는 ‘경외심을 일으키는 일들’로 옮겼습니다. יָם은 단수이므로 본문에서는 ‘먼 바다’로 두고, 집합적 의미 가능성은 각주로 보존했습니다.
