  from: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
  to: But he brought us out from there to bring us in and give us the land he swore to give our fathers.
  rationale: The record rightly emphasizes the purposeful contrast between bringing Israel out and bringing it in, as well as the sworn commitment to the fathers. Both are retained, while the fronted object receives its contextual contrast and the misplaced ancestors note is dropped.
