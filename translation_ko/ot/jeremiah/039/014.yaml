revisions:
- from: 그들이 사람을 보내어 시위대 뜰에서 예레미야를 데려다가, 아히감의 아들, 사반의 손자 그달리야에게 맡겨 집으로 데려가게 하였더니, 그는 백성 가운데서 살았습니다.[a]
  to: 그들은 사람을 보내어 시위대 뜰에서 예레미야를 데려다가 아히감의 아들이며 사반의 손자인 그달리야에게 맡겨 집으로 데려가게 하였고, 예레미야는 백성 가운데서 살았습니다.
  rationale: 인명 계보 표현과 문장 연결을 자연스럽게 다듬고, 마지막 주어를 ‘예레미야’로 명시하여 원문의 문맥상 지시 대상을 보존했습니다. 히브리어 장소 표현을 지나치게 해석한 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
