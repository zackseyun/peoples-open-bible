  from: The fear of Yahweh is the beginning of wisdom[a]; good understanding belongs to all who practice it[b]. His praise stands forever.
  to: The fear of Yahweh is the beginning of wisdom; good understanding belongs to all who practice them.[a] His praise stands forever.[b]
  rationale: The suffix in עֹשֵׂיהֶם is masculine plural. Singular “it” wrongly resolves the Hebrew and suppresses the most natural discourse link to the plural precepts of verses 7–8. “Practice them” is idiomatic English, while the note accurately identifies the implicit plural object and its probable antecedent. Both notes are also correctly placed.
