id: PRO.2.3
reference: Proverbs 2:3
source:
  edition: WLC
  text: כִּ֤י אִ֣ם לַ/בִּינָ֣ה תִקְרָ֑א לַ֝/תְּבוּנָ֗ה תִּתֵּ֥ן קוֹלֶֽ/ךָ׃
translation:
  text: indeed, if you call out for understanding and raise your voice for discernment,
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי אִם
  chosen: indeed, if
  alternatives:
  - indeed, if
  - for if
  - surely if
  lexicon: HALOT
  rationale: This expresses the emphatic conditional force without the unnatural English sequence “yes, if.”
- source_word: בִּינָה
  chosen: understanding
  alternatives:
  - insight
  - discernment
  lexicon: HALOT
  rationale: בינה commonly denotes understanding or insight. 'Understanding' fits the wisdom context and pairs well with the following near-synonym without collapsing the distinction entirely.
- source_word: תִקְרָא
  chosen: call out
  alternatives:
  - call
  - cry out
  lexicon: HALOT
  rationale: The verb קרא here conveys vocal appeal rather than mere naming or summoning. 'Call out' is idiomatic modern English and matches the earnestness of the exhortation.
- source_word: תְּבוּנָה
  chosen: discernment
  alternatives:
  - understanding
  - insight
  lexicon: HALOT
  rationale: תבונה overlaps with בינה but is not identical. 'Discernment' preserves a meaningful distinction in English while remaining natural in wisdom literature.
- source_word: תִּתֵּן קוֹלֶךָ
  chosen: raise your voice
  alternatives:
  - lift your voice
  - give your voice
  - utter your voice
  lexicon: HALOT
  rationale: A natural English idiom for the Hebrew expression “give your voice,” retaining the sense of earnest vocal appeal.
