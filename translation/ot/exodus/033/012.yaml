- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Force of 'I know you by name'
  chosen_reading: Retain the relational idiom without expanding it into theological paraphrase
  alternative_readings:
  - I know you personally
  - I have chosen you personally
  rationale: The verse expresses personal divine knowledge and favor, but the Hebrew does not explicitly state election or covenant status beyond the idiom itself. The translation preserves the theological weight without importing a stronger doctrinal claim.
