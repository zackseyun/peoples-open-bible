  source_fidelity: 히브리어 וַיֶּחֱזַק ... עַל은 왕의 말이 요압과 군 지휘관들에 맞서 우세하여 그들의 이견을 이겼음을 나타냅니다. 초안의 ‘압박하였으므로’는 압력을 가했다는 과정은 나타내지만 ‘우세하여 관철되었다’는 결과를 충분히 드러내지 못합니다. 또한 לִפְנֵי הַמֶּלֶךְ는 이 문맥에서 ‘왕 앞에서’라기보다 ‘왕 앞을 떠나’가 자연스럽고 정확합니다.
  naturalness: ‘왕의 말이 …을 제압하였으므로’와 ‘왕 앞을 떠나’는 현대 표준 한국어의 격식 있는 서사체에서 자연스럽습니다. ‘계수하다’는 다소 문어적이나 인구를 세는 행정 행위라는 문맥에 알맞고 합쇼체 종결과도 잘 맞습니다.
