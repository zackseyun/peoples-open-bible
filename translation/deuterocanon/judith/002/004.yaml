  confidence: high
  validation: agree
translation:
  text: 'After finalizing his plan, Nebuchadnezzar, king of the Assyrians, summoned Holofernes, the commander-in-chief of his forces, who ranked second only to the king, and said to him:'
  philosophy: dynamic
lexical_decisions:
- source_word: καὶ ἐγένετο
  chosen: And it happened
  alternatives:
  - And it came to pass
  - Then it happened
  lexicon: BDAG
  rationale: A standard narrative formula. 'And it happened' preserves the Greek structure without archaic English like 'came to pass.'
- source_word: ὡς συνετέλεσεν
  chosen: when he had finished
  alternatives:
  - after he had completed
  - when he completed
  lexicon: BDAG
  rationale: The aorist with ὡς here introduces the time at which the next action occurred. 'When he had finished' gives clear English sequence and reflects completion.
- source_word: τὴν βουλὴν αὐτοῦ
  chosen: his plan
  alternatives:
  - his counsel
  - his purpose
  - his decision
  lexicon: BDAG
  rationale: βουλή can mean counsel, plan, or purpose. In this military-political context, 'plan' is natural modern English and preserves intentionality without sounding abstract.
- source_word: ἐκάλεσεν
  chosen: called
  alternatives:
  - summoned
  lexicon: BDAG
  rationale: Both are possible, but 'called' is the more direct default. The context already implies an authoritative summons.
- source_word: βασιλεὺς Ἀσσυρίων
  chosen: king of the Assyrians
  alternatives:
  - the Assyrian king
  lexicon: BDAG
  rationale: This keeps the appositional structure of the Greek and preserves the ethnic designation explicitly.
- source_word: τὸν Ὀλοφέρνην
  chosen: Holofernes
  rationale: Personal name transliterated according to project policy.
- source_word: ἀρχιστράτηγον
  chosen: the commander-in-chief
  alternatives:
  - the general
  - the supreme commander
  lexicon: BDAG
  rationale: The term denotes the highest military commander. 'Commander-in-chief' best conveys rank and authority in accessible English.
- source_word: τῆς δυνάμεως αὐτοῦ
  chosen: of his forces
  alternatives:
  - of his army
  - of his power
  lexicon: BDAG
  rationale: δύναμις can mean power or military force; here the military sense is demanded by the office title. 'Forces' is broad enough to cover the king's military strength.
- source_word: δεύτερον ὄντα μετʼ αὐτόν
  chosen: who was second after him
  alternatives:
  - being second to him
  - who ranked next after him
  lexicon: BDAG
  rationale: This phrase indicates Holofernes' rank immediately below the king. 'Who was second after him' is clear and close to the Greek.
- source_word: καὶ εἶπεν πρὸς αὐτόν
  chosen: and said to him
  alternatives:
  - and spoke to him
  lexicon: BDAG
  rationale: A straightforward rendering of the common speech-introduction formula.
