translation:
  text: When Methuselah heard the words of his father Enoch, who had secretly shown him all these works, he returned
    and made them known to him.[a] He named that child Noah, because he would bring comfort to the earth from all
    its destruction.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The return and making-known clauses use unexpressed subjects and recipients. The English does not insert
      a named recipient or silently transfer the naming action to a different explicitly named person.
    reason: alternative_reading
  - marker: b
    text: The printed dagger marks the comfort/gladden verb as corrupt. Dillmann1865 column1349 supports consolation
      and expressly cites107:3 with a from-phrase. Charles1906 printed223 note26 proposes a different underlying
      verb meaning grant rest and a Noah wordplay; that reconstruction is reported, not silently substituted into
      the selected source.
    reason: textual_variant
