  rationale: '이 장 파일의 한국어 본문은 개역 계열 문어체(「이르되」, 「-니라」, 「-더라」, 「하사」, 「하옵」 등)로 작성되어 있었고 문장 부호도 대부분 빠져 있어, KOREAN_PIPELINE.md가 규정한 현대 표준어 합쇼체 등록과 어긋났습니다. 원문이 아니라 개역 계열 한국어 성경을 바탕으로 초벌 작성된 흔적도 있었습니다(예: 6장 2절의 「어린아이」는 게으즈 원문과 영어 POB의 kids/young goats, 곧 「염소 새끼」를 잘못 옮긴 것입니다). 같은 장의 절 단위 기록(translation_ko/extra_canonical/jubilees/<장>/<절>.yaml)은 이미 게으즈 원문을 근거로 합쇼체로 번역되어 검토를 마친 상태이므로, 장 파일의 본문을 그 절 단위 기록을 순서대로 이어 붙여 다시 만들었습니다. 이렇게 하면 같은 본문에 대해 서로 어긋나는 두 개의 번역이 생기지 않고, 장 파일도 절 기록과 동일하게 원문에 근거하게 됩니다. 절 기록의 각주 표지는 장 단위로 합치면 서로 충돌하므로 집계 본문에서는 제거했습니다. 각주는 절 단위 기록이 계속 보유합니다.'
