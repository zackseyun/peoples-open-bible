  lexicon: HALOT
  rationale: 직역적 ‘좁다’의 이미지를 현대 한국어 시어로 풀어, 개인적 압박과 고통을 함께 드러내는 ‘곤경에 빠졌사오며’로 옮겼습니다.
- source_word: עָשְׁשָׁה בְכַעַס עֵינִי
  english_pob_choice: my eye has wasted away with grief
  chosen_korean: 내 눈은 슬픔으로 쇠하였사오니
  alternatives_korean:
  - 내 눈은 괴로움으로 희미해졌사오니
  - 내 눈은 비탄으로 쇠약해졌사오니
  lexicon: HALOT
  rationale: עָשְׁשָׁה의 ‘쇠하다/약해지다’ 의미를 살리면서, בְכַעַס을 POB의 해석에 맞게 ‘슬픔’으로 옮겨 눈의 쇠약이라는 시적 병행을 자연스럽게 재현했습니다.
- source_word: נַפְשִׁי וּבִטְנִי
  english_pob_choice: my soul and my belly as well
  chosen_korean: 내 영혼과 내 배도 그러합니다
  alternatives_korean:
  - 내 목숨과 내 배도 그러합니다
  - 내 속사람과 내 배도 그러합니다
  lexicon: HALOT
  rationale: נפש의 넓은 의미를 한국어에서 보편적으로 이해되는 ‘영혼’으로 옮기되, בטן은 문자적으로 ‘배’로 유지해 신체-내면의 병렬을 보존했습니다.
