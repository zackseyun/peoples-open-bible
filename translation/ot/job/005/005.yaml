  from: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
  to: The hungry eat his harvest, and take it even from among the thorns, and the thirsty pant after their wealth.[a]
  rationale: The final plural suffix in חֵילָם should not be replaced by singular “his.” In context it naturally reaches back to the fool’s children or household in the preceding verse; “their wealth” preserves that source feature, even though the antecedent is contextual. The real needed correction is to attach the note to the difficult final clause rather than to “harvest.” The comma after “harvest” also makes the coordinated predicates easier to read without altering the sense.
