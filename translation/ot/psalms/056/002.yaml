id: PSA.56.2
reference: Psalms 56:2
source:
  edition: WLC
  text: שָׁאֲפ֣וּ שׁ֭וֹרְרַ/י כָּל הַ/יּ֑וֹם כִּֽי רַבִּ֨ים לֹחֲמִ֖ים לִ֣/י מָרֽוֹם־־׃
translation:
  text: My enemies pursue me all day long, for many fight against me proudly[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “for many fight against me, O Most High.”
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאֲפוּ
  lemma: שׁאף
  chosen: pursue
  alternatives:
  - trample on
  - pursue eagerly
  - snort at
  lexicon: HALOT
  rationale: The hostile verb conveys eager pursuit or attack. “Pursue” avoids the misleading modern associations of “pant after” while preserving the contextual action.
- source_word: שׁוֹרְרַי
  chosen: my enemies
  alternatives:
  - those who watch me
  - my attackers
  - my foes
  lexicon: HALOT
  rationale: The noun refers to hostile opponents. 'My enemies' is clear modern English and fits the psalm's lament context better than a more opaque literal rendering.
- source_word: כָּל הַיּוֹם
  chosen: all day long
  alternatives:
  - all the day
  lexicon: HALOT
  rationale: This is the natural contemporary English equivalent of the idiom.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - indeed
  lexicon: HALOT
  rationale: Here כִּי introduces the reason for the complaint; 'for' fits the poetic flow.
- source_word: רַבִּים
  chosen: many
  alternatives:
  - numerous
  lexicon: HALOT
  rationale: Straightforward quantitative adjective; 'many' is idiomatic and concise.
- source_word: לֹחֲמִים לִי
  chosen: fight against me
  alternatives:
  - wage war against me
  - battle me
  lexicon: HALOT
  rationale: The participle plus ל marks ongoing hostile action directed toward the psalmist. 'Fight against me' preserves the military hostility in accessible English.
- source_word: מָרוֹם
  chosen: proudly
  alternatives:
  - proudly
  - O Most High
  - height
  lexicon: HALOT
  rationale: Used adverbially, the word conveys the attackers’ haughty or exalted stance. The viable vocative reading “O Most High” is retained in a note rather than made an unmarked resolution.
