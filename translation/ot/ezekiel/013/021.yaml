  category: meaning_retranslation
  from: I will tear off your magic bands[a], and I will deliver my people from your hand, and they will no longer be in your hand as prey[b]; then you will know that I am Yahweh.
  to: I will tear off your head coverings and deliver my people from your grasp. They will no longer be prey in your hands. Then you will know that I am Yahweh.
  rationale: The prior wording correctly conveyed rescue from predatory control, but its lexical decision blurred the two distinct objects named in verse 18. The source's own usage requires restoring the head coverings here rather than repeating the arm bands of verse 20.
