id: PSA.91.4
reference: Psalms 91:4
source:
  edition: WLC
  text: בְּ/אֶבְרָת֨/וֹ יָ֣סֶךְ לָ֭/ךְ וְ/תַֽחַת כְּנָפָ֣י/ו תֶּחְסֶ֑ה צִנָּ֖ה וְֽ/סֹחֵרָ֣ה אֲמִתּֽ/וֹ׀־׃
translation:
  text: He will cover you with his feathers, and under his wings you will take refuge; his faithfulness is a shield and a rampart[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or 'buckler,' a shield; this Hebrew defense term occurs only here, and its precise meaning is uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֶבְרָתוֹ
  chosen: with his feathers
  alternatives:
  - with his feathers
  - with his plumage
  lexicon: HALOT
  rationale: אֶבְרָה refers to a bird's feathered pinion or plumage. 'Feathers' preserves the image in ordinary modern English; the more technical 'pinions' remains in the note.
- source_word: יָסֶךְ
  chosen: he will cover
  alternatives:
  - he will shelter
  - he will screen
  lexicon: HALOT
  rationale: The Hiphil of סכך conveys covering/protecting. 'Cover' is the most direct rendering and fits the bird-imagery of the verse.
- source_word: לָךְ
  chosen: you
  rationale: Although morphologically marked 2fs in the table, the verse addresses the worshiper generically; English 'you' naturally conveys the addressee without forcing gender.
- source_word: וְתַחַת
  chosen: and under
  alternatives:
  - beneath
  lexicon: HALOT
  rationale: A straightforward spatial rendering that continues the protective image.
- source_word: כְּנָפָיו
  chosen: his wings
  lexicon: HALOT
  rationale: כנף commonly means 'wing' in avian contexts. Here it pairs naturally with the preceding bird metaphor.
- source_word: תֶּחְסֶה
  chosen: you will take refuge
  alternatives:
  - you will take refuge
  - you will seek refuge
  - you will find refuge
  lexicon: HALOT
  rationale: The Qal verb denotes actively taking or seeking refuge. 'Take refuge' is both idiomatic English and closer to the Hebrew than 'find refuge.'
- source_word: צִנָּה
  chosen: shield
  alternatives:
  - large shield
  lexicon: HALOT
  rationale: צִנָּה denotes a shield, often a large body-shield. 'Shield' is clear in English; the size nuance is not essential in the main text.
- source_word: וְסֹחֵרָה
  chosen: and a rampart
  alternatives:
  - and a buckler
  - and a rampart
  - and a bulwark
  lexicon: HALOT
  rationale: The noun occurs only here. Traditional interpretation takes it as a buckler, while cognate evidence supports a surrounding defensive wall. 'Rampart' preserves a distinct defensive image without pretending the rare term is certain; the alternatives remain explicit in the note.
- source_word: אֲמִתּוֹ
  chosen: his faithfulness
  alternatives:
  - his truth
  - his reliability
  lexicon: HALOT
  rationale: אֱמֶת can mean truth, faithfulness, or reliability. In this context of divine protection, 'faithfulness' best expresses God's dependable character as the basis of safety.
