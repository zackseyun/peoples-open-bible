  meaning_decisions:
  - source_phrase: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν
    prior_rendering: For we do not want you to be unaware
    new_rendering: For we want you to know
    rationale: The negative construction introduces information Paul wants his readers to understand; the positive English idiom carries that function directly.
  - source_phrase: ἀδελφοί
    prior_rendering: brothers
