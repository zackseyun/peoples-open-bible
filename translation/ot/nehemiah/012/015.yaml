  lexicon: HALOT
  rationale: Proper personal name; transliterated in a standard English form. 'Adna' is the common rendering in this context.
- source_word: לִ/מְרָיוֹת
  chosen: for Meraioth
  alternatives:
  - of Meraioth
  - as for Meraioth
  lexicon: HALOT
  rationale: Again, prefixed ל introduces the priestly family or division to which the following name corresponds in this roster. 'Meraioth' is a proper name and is transliterated.
- source_word: חֶלְקָי
  chosen: Helkai
  alternatives:
  - Helkiai
  lexicon: HALOT
  rationale: Proper personal name; transliterated. 'Helkai' is the conventional English form for this name in Nehemiah 12:15.
