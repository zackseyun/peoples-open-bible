reference: Psalms 69:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַבּ֤וּ מִ/שַּׂעֲר֣וֹת רֹאשִׁ/י֮ שֹׂנְאַ֪/י חִ֫נָּ֥ם עָצְמ֣וּ מַ֭צְמִיתַ/י אֹיְבַ֣/י שֶׁ֑קֶר אֲשֶׁ֥ר לֹא גָ֝זַ֗לְתִּי אָ֣ז אָשִֽׁיב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/004.yaml
  text: Those who hate me without cause are more numerous than the hairs of my head; those who seek to destroy me—my enemies wrongfully[a]—are mighty. What I did not steal, I must restore[b].
  footnotes:
  - marker: a
    text: Or “my deceitful enemies.” The Hebrew may characterize either their opposition as wrongful or the enemies themselves as deceitful.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “then I restore.” The context may imply that the psalmist is compelled to repay what he did not steal.
    reason: lexical_alternative
translation:
  language: ko
  text: 까닭 없이 나를 미워하는 자들이 내 머리카락보다 많습니다. 나를 멸하려 하는 자들, 곧 거짓된 내 원수들이[a] 강합니다. 내가 빼앗지 않은 것을, 그때에 돌려주어야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 거짓으로 대적하는 내 원수들이.’ 히브리어 표현은 원수들이 거짓되거나 속이는 자들이라는 뜻일 수도 있고, 그들이 시인을 거짓으로, 곧 부당하게 대적한다는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그때에 나는 돌려준다’입니다. 문맥상 시인이 빼앗지 않은 것을도 돌려주도록 강요받는다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  english_pob_choice: I am weary
  chosen_korean: 지쳤습니다
  alternatives_korean:
  - 피곤합니다
  - 기진맥진했습니다
  lexicon: HALOT
  rationale: יגע는 지치고 쇠약해진 상태를 가리키므로, 현재 상태를 자연스럽게 드러내는 ‘지쳤습니다’가 합쇼체에서 가장 무난합니다.
- source_word: בְּקָרְאִי
  english_pob_choice: from my crying
  chosen_korean: 울며 부르짖느라
  alternatives_korean:
  - 부르짖느라
  - 내가 부르짖어서
  lexicon: HALOT
  rationale: קרא는 여기서 단순한 부름보다 애절한 부르짖음을 뜻하므로, 시편 탄식의 정서를 살려 ‘울며 부르짖느라’로 옮겼습니다.
- source_word: נִחַר גְּרוֹנִי
  english_pob_choice: my throat is parched
  chosen_korean: 내 목은 타들어 가고
  alternatives_korean:
  - 내 목은 바싹 말라 가고
  - 내 목은 쉬고
  lexicon: HALOT
  rationale: נחר는 목이 마르고 달아오른 상태를 가리키므로, ‘타들어 가고’가 건조함과 고통의 이미지를 함께 살립니다.
- source_word: מְיַחֵל לֵאלֹהָי
  english_pob_choice: while I wait for my God
  chosen_korean: 내 하나님을 기다리다가
  alternatives_korean:
  - 내 하나님을 바라며
  - 내 하나님께 소망을 두며
  lexicon: HALOT
  rationale: יחל은 기다림과 소망을 함께 담을 수 있으나, 본문은 눈이 지칠 정도의 지속적 기대를 말하므로 ‘기다리다’가 기본 의미를 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: יחל의 의미 범위
  chosen_reading: ‘기다리다’로 옮기되, 희망의 뉘앙스를 문맥상 보존합니다.
  alternative_readings:
  - ‘소망하다’
  - ‘바라다’
  rationale: 이 절은 하나님을 향한 인내 어린 기대를 말하므로, ‘기다리다’가 시간적 지속성을 분명히 하면서도 소망의 감각을 해치지 않습니다.
  doctrine_reference: 시편의 탄원과 소망의 결합
- issue: 반복되는 신체 이미지의 보존
  chosen_reading: 목과 눈의 이미지를 그대로 살려 육체적 소진을 드러냅니다.
  alternative_readings:
  - 의역하여 전반적 고통만 표현
  - 정서 중심으로 완화
  rationale: 시인은 영적 낙심만이 아니라 실제 신체적 쇠약을 말하므로, 신체 이미지를 보존해야 탄원의 강도가 유지됩니다.
  doctrine_reference: 성경적 탄식의 육체성
