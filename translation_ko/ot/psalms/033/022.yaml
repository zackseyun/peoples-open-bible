  - 우리가 주님께 소망을 두고 있기 때문입니다
  lexicon: יחל
  rationale: 히브리어 יחל은 단순한 심리적 기대보다 신뢰와 기다림을 함께 담으므로, ‘바라고 있다’로 옮겨 현재적 신뢰의 뉘앙스를 살렸습니다.
