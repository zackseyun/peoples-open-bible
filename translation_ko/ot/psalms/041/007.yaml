lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 그리고 ... 하면
  alternatives_korean:
  - 만일 ... 하면
  - 그리고 만일 ... 하면
  lexicon: HALOT
  rationale: 앞 절과 이어지는 조건문이므로 ‘그리고’로 연결감을 살리면서 한국어에서는 ‘...하면’으로 자연스럽게 옮겼습니다.
- source_word: לִרְאוֹת
  english_pob_choice: to see me
  chosen_korean: 나를 보러
  alternatives_korean:
  - 보러
  - 나를 보려고
  - 나를 보기 위해
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘보러’이지만, 문맥상 대상이 화자임이 분명하므로 자연스러운 한국어로 ‘나를’를 보충했습니다.
- source_word: שָׁוְא
  english_pob_choice: falsehood
  chosen_korean: 거짓
  alternatives_korean:
  - 허무
  - 헛됨
  - 속임수
  lexicon: HALOT
  rationale: 이 문맥에서는 공허함보다 기만적인 말의 성격이 강하므로 ‘거짓’이 가장 직접적으로 대응합니다.
- source_word: לַחוּץ
  english_pob_choice: to the street
  chosen_korean: 밖으로
  alternatives_korean:
  - 거리로
  - 바깥으로
  - 공개적으로
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘밖’이지만, 시편의 대비 구조상 사적인 자리에서 공개 공간으로 나가는 흐름이므로 ‘밖으로’가 가장 간결합니다.
