id: PSA.68.15
reference: Psalms 68:15
source:
  edition: WLC
  text: הַר אֱ֭לֹהִים הַר בָּשָׁ֑ן הַ֥ר גַּ֝בְנֻנִּ֗ים הַר בָּשָֽׁן־־־׃
translation:
  text: The mountain of Bashan is a mighty mountain[a]; the mountain of Bashan is a many-peaked mountain.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “a mountain of God”; the phrase may describe a sacred mountain or an exceptionally mighty one.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  chosen: mountain
  alternatives:
  - hill
  lexicon: HALOT
  rationale: The standard sense is 'mountain.' Repetition of הַר is preserved for the verse's emphatic, poetic structure rather than reduced to a smoother English paraphrase.
- source_word: אֱלֹהִים
  chosen: of God
  alternatives:
  - mighty
  - godlike
  - divine
  lexicon: HALOT
  rationale: In the construct phrase הַר אֱלֹהִים, the most straightforward rendering is 'mountain of God.' While אֱלֹהִים can sometimes function as an intensifier ('mighty'), retaining 'of God' preserves the Hebrew form and the theological-poetic force; the idiomatic alternative is preserved in a footnote.
- source_word: בָּשָׁן
  chosen: Bashan
  lexicon: HALOT
  rationale: Proper place name; transliterated according to the translation philosophy's preference for transliterating names.
- source_word: גַּבְנֻנִּים
  chosen: many-peaked
  alternatives:
  - many summits
  - rugged
  - hump-backed
  lexicon: HALOT
  rationale: This natural English adjective preserves the likely image of multiple peaks, ridges, or humps.
