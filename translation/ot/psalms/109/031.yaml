id: PSA.109.31
reference: Psalms 109:31
source:
  edition: WLC
  text: כִּֽי יַ֭עֲמֹד לִ/ימִ֣ין אֶבְי֑וֹן לְ֝/הוֹשִׁ֗יעַ מִ/שֹּׁפְטֵ֥י נַפְשֽׁ/וֹ־׃
translation:
  text: For he stands at the right hand of the needy to save them from those who pass judgment on them[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “from the judges of his life.” The Hebrew uses a representative singular for the needy person whose life is at stake.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  lexicon: HALOT
  rationale: Introduces the ground or reason for the preceding praise/assurance. 'For' fits the poetic flow and explanatory force in context.
- source_word: יַעֲמֹד
  chosen: he stands
  alternatives:
  - he will stand
  - he takes his stand
  lexicon: HALOT
  rationale: The imperfect can express habitual or assured action. In poetic affirmation, present 'stands' conveys the LORD's characteristic protective stance without over-specifying futurity.
- source_word: לִימִין
  chosen: at the right hand of
  alternatives:
  - on the right hand of
  - to the right of
  lexicon: HALOT
  rationale: The idiom denotes advocacy, support, and protective presence. 'At the right hand of' is natural English and preserves the metaphor.
- source_word: אֶבְיוֹן
  chosen: the poor
  alternatives:
  - the needy
  - the afflicted
  lexicon: HALOT
  rationale: אֶבְיוֹן commonly denotes one who is poor/needy and vulnerable. 'The poor' is concise and idiomatic here, while still carrying the social vulnerability implied by the Hebrew.
- source_word: לְהוֹשִׁיעַ
  chosen: to save
  alternatives:
  - to deliver
  lexicon: HALOT
  rationale: The infinitive expresses purpose. 'To save' is the broad, standard rendering of ישׁע and fits both physical and judicial rescue in this context.
- source_word: מִשֹּׁפְטֵי
  chosen: from those who pass judgment on
  alternatives:
  - from his judges
  - from those condemning
  - from those who pass judgment
  lexicon: HALOT
  rationale: Expresses the participial judicial sense naturally without importing an explicit verdict of condemnation.
- source_word: נַפְשׁוֹ
  chosen: him
  alternatives:
  - his soul
  - him
  lexicon: HALOT
  rationale: Here the term refers to the person whose life is at stake; the literal “his life” is retained in the note.
