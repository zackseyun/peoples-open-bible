  from: How can I alone bear your trouble[a], your burden, and your disputes?
  to: How can I alone bear the trouble you bring, the burden you place on me, and your disputes?
  rationale: The lexical record distinguishes wearisome trouble, a carried burden, and disputes, and I retained all three. Their relationship to Moses is made explicit in light of his inability to lead alone and the ensuing appointment of judges.
