id: PRO.10.10
reference: Proverbs 10:10
source:
  edition: WLC
  text: קֹ֣רֵֽץ עַ֭יִן יִתֵּ֣ן עַצָּ֑בֶת וֶ/אֱוִ֥יל שְׂ֝פָתַ֗יִם יִלָּבֵֽט׃
translation:
  text: Whoever winks with evil intent causes grief, and a babbling fool will come to ruin[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “will be cast down”; the Hebrew verb is rare.
    reason: alternative_reading
lexical_decisions:
- source_word: קֹרֵץ עַיִן
  chosen: Whoever winks the eye
  alternatives:
  - He who winks the eye
  - One who winks the eye
  - Whoever winks
  lexicon: HALOT
  rationale: The participle קֹרֵץ functions substantivally ('one who winks'), with עַיִן as its object. 'Whoever' gives natural English while preserving the generic force. Retaining 'the eye' reflects the Hebrew idiom more closely than simply 'winks,' though the latter is a viable smoother alternative.
- source_word: יִתֵּן
  chosen: causes
  alternatives:
  - gives
  - brings
  lexicon: HALOT
  rationale: 'נתן literally means ''give,'' but in this collocation with עַצָּבֶת the idiomatic sense is causative: ''causes/brings grief.'' ''Causes'' is clearer modern English and fits optimal equivalence.'
- source_word: עַצָּבֶת
  chosen: grief
  alternatives:
  - sorrow
  - pain
  - vexation
  lexicon: HALOT
  rationale: The noun denotes pain, hurt, or sorrow. 'Grief' captures the emotional and relational harm implied in wisdom literature. 'Pain' could sound too physical; 'vexation' is possible but less natural for modern readers.
- source_word: וֶאֱוִיל שְׂפָתַיִם
  chosen: and a babbling fool
  alternatives:
  - and a babbling fool
  - and a foolish talker
  - and a fool with his lips
  lexicon: HALOT
  rationale: Natural English representation of the Hebrew idiom for a fool characterized by speech.
- source_word: יִלָּבֵט
  chosen: will come to ruin
  alternatives:
  - will be ruined
  - will fall
  - will be overthrown
  lexicon: HALOT
  rationale: Broad idiomatic rendering of the rare verb, while retaining the concrete alternative in a note.
