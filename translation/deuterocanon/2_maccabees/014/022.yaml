lexical_decisions:
- source_word: διέταξεν
  chosen: stationed
  alternatives:
  - ordered
  - arranged
  - posted
  lexicon: LSJ
  rationale: In military context with ἐνόπλους and location phrases, the verb conveys arranging/deploying forces rather than merely issuing a command. 'Stationed' captures the practical action in idiomatic English.
- source_word: ἐνόπλους
  chosen: armed men
  alternatives:
  - armed soldiers
  - men under arms
  lexicon: LSJ
  rationale: The adjective means armed persons. 'Armed men' is concise and natural; 'soldiers' is possible but slightly more specific than the Greek requires.
- source_word: ἑτοίμους
  chosen: ready
  alternatives:
  - prepared
  lexicon: LSJ
  rationale: Simple predicate complement indicating preparedness for action; 'ready' is the most natural modern rendering.
- source_word: ἐν τοῖς ἐπικαίροις τόποις
  chosen: in strategic places
  alternatives:
  - in suitable places
  - at critical points
  - in opportune places
  lexicon: LSJ
  rationale: ἐπικαίροις here refers to advantageous or critical positions in a tactical setting. 'Strategic places' communicates the military sense better than the more literal but less clear 'opportune places.'
- source_word: μή ποτε
  chosen: lest
  alternatives:
  - so that not
  - for fear that
  lexicon: LSJ
  rationale: Introduces a precautionary purpose clause; 'lest' is concise and accurate.
- source_word: ἐκ τῶν πολεμίων
  chosen: from the enemies
  alternatives:
  - by the enemies
  - out of the enemy camp
  lexicon: LSJ
  rationale: The phrase marks the source/origin of the threatened action. 'From the enemies' preserves that sense without overinterpreting agency.
- source_word: ἐφνιδίως
  chosen: suddenly
  alternatives:
  - unexpectedly
  - by surprise
  lexicon: LSJ
  rationale: The adverb denotes suddenness/surprise. 'Suddenly' is direct; the surprise element is also supported by context.
- source_word: κακουργία
  chosen: treachery
  alternatives:
  - villainy
  - evil deed
  - malicious act
  lexicon: LSJ
  rationale: In this diplomatic-military context, the feared act is not generic evil but hostile foul play. 'Treachery' best fits the context of possible deceitful attack.
- source_word: γένηται
  chosen: should arise
  alternatives:
  - should happen
  - should occur
  lexicon: LSJ
  rationale: With κακουργία as subject, 'should arise' gives a natural English expression for an event coming about.
- source_word: τὴν ἁρμόζουσαν
  chosen: the fitting
  alternatives:
  - the appropriate
  - the proper
  lexicon: LSJ
  rationale: The participial adjective means what is suitable or appropriate to the situation. 'Fitting' preserves the evaluative nuance.
- source_word: ἐποίησαν κοινολογίαν
  chosen: held the conference
  alternatives:
  - held a conversation
  - made common discussion
  - conferred together
  lexicon: LSJ
  rationale: The expression denotes mutual discussion or conference. Because the article and adjective imply a specific kind of discussion suited to the moment, 'held the fitting conference' renders both elements while keeping the formal tone.
