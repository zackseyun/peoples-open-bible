  from: I will hear what God Yahweh will speak[a], for he will speak peace to his people and to his faithful ones[b]; but let them not turn back to folly.
  to: I will listen to what God Yahweh will say, for he will speak peace to his people and to his faithful ones[a]; let them not turn back to folly[b].
  rationale: '“I will listen to what … will say” is a justified natural-English correction of the source-shaped “I will hear what … will speak,” while retaining the resolve of אשמעה and the future sense of ידבר. The notes must be re-anchored: [a] belongs with “faithful ones” and [b] with “folly.” However, the proposed “but” before the final jussive is not represented by the Hebrew conjunction, which is simply ו; English punctuation can mark the shift without adding an adversative contrast.'
