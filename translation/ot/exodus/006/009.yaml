  - harsh labor
  rationale: Although the noun can denote labor or service broadly, the context in Exodus is Israel's forced bondage in Egypt. Rendering it 'slavery' reflects the historical and moral reality more clearly and aligns with the translation philosophy's preference for bonded-language where salient.
