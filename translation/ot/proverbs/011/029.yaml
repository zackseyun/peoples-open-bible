id: PRO.11.29
reference: Proverbs 11:29
source:
  edition: WLC
  text: עוֹכֵ֣ר בֵּ֭ית/וֹ יִנְחַל ר֑וּחַ וְ/עֶ֥בֶד אֱ֝וִ֗יל לַ/חֲכַם לֵֽב־־׃
translation:
  text: Whoever brings trouble on his own household will inherit wind, and the fool will be a servant[a] to the wise in heart.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew term can denote a servant in bondage, including a slave.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹכֵר
  chosen: troubles
  alternatives:
  - brings trouble on
  - ruins
  - disturbs
  lexicon: HALOT
  rationale: The participle denotes one who causes trouble or brings calamity. 'Troubles' is concise, natural English and preserves the active sense without over-specifying total destruction.
- source_word: בֵּיתוֹ
  chosen: his own household
  alternatives:
  - his household
  - his family
  lexicon: HALOT
  rationale: Conveys the family or domestic group, rather than merely a building.
- source_word: יִנְחַל
  chosen: will inherit
  alternatives:
  - will receive as an inheritance
  - will possess
  lexicon: HALOT
  rationale: 'The verb commonly means ''inherit'' or ''take possession.'' ''Will inherit'' preserves the proverb''s irony: the only legacy gained is emptiness.'
- source_word: רוּחַ
  chosen: wind
  alternatives:
  - air
  - emptiness
  - nothing
  lexicon: HALOT
  rationale: Here the noun likely carries the sense of something insubstantial or futile. 'Wind' preserves the Hebrew metaphor and the proverbial force better than an interpretive gloss like 'nothing.'
- source_word: וְעֶבֶד
  chosen: will be a servant
  alternatives:
  - and a servant
  - will become a slave
  - will serve as a servant
  lexicon: HALOT
  rationale: 'The verbless clause implies result: the fool ends up in servile relation to the wise. ''Will be a servant'' supplies natural English predication without overstating the bonded nature as ''slave,'' which is not clearly foregrounded here.'
- source_word: אֱוִיל
  chosen: the fool
  alternatives:
  - a fool
  - the foolish one
  lexicon: HALOT
  rationale: A common wisdom-term for a morally and practically senseless person. 'The fool' matches English proverbial style and treats the term as a type.
- source_word: לַחֲכַם־לֵב
  chosen: to the wise in heart
  alternatives:
  - to the wise-hearted
  - to the wise in heart
  - to the wise person
  lexicon: HALOT
  rationale: Preserves the Hebrew heart expression in natural English.
