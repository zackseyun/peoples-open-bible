review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안 5절은 영어 POB의 확장문(‘주 하나님께서 땅에 나타나셔서 … 아담을 구원’)을 따르지만, 제시된 그리스어 본문 5절에는 그 문장이 없고 ‘이스라엘에게 큰 표적이 영화롭게 될 것이다’만 있습니다. 반대로 그리스어 7절에는 대괄호로 표시된 ‘하나님께서 몸을 취하시고 사람들과 함께 식사하셔서 사람들을 구원하셨기 때문’이라는 구절이 있으나 초안은 이를 누락했습니다. 대괄호는 본문 전승상 불확실하거나 편집상 유보된 읽기임을 시사하므로, 번역문에서도 대괄호와 주석으로 보존합니다.
  naturalness: 합쇼체 문체는 대체로 적절하나, ‘너희의 죄에서 벗어난 사람으로 드러나게’는 δικαιωθῶ ἀπὸ의 책임 면제/무죄 선언의 뉘앙스를 다소 우회적으로 표현합니다. ‘너희의 죄에 대하여 내가 책임 없음을 인정받도록’이 더 자연스럽고 정확합니다. ‘아말렉에게는 남은 것이 없다’는 ἐν τῷ Ἀμαλήκ의 장소적 표현을 ‘아말렉에는’으로 옮기는 편이 낫습니다.
  terminology: φθόνος는 ‘시기’, σκληροκαρδία는 ‘완악함’, ἅγιοι는 문헌의 비정형적 용례를 보존하는 ‘거룩한 이들’로 번역했습니다. πλάνη는 단순한 거짓말보다 미혹·기만의 뜻을 지니므로 ‘미혹의 영들’로 다듬었습니다. Καππαδόκαι는 민족명으로 ‘갑바도기아인’으로 표기했습니다.
  issues:
  - severity: high
    issue: 5절에 제시된 그리스어 본문에 없는 확장 구절이 삽입되어 있습니다.
    rationale: 그리스어 5절은 ‘Τότε σημεῖον ἐνδοξασθήσεται μέγα τῷ Ἰσραήλ’이며, 초안의 ‘주 하나님께서 땅에 나타나셔서 … 아담을 구원’은 제공된 영어 POB에는 있으나 제공된 원어 본문에는 없습니다. 원어 우선 원칙에 따라 삭제해야 합니다.
  - severity: high
    issue: 7절의 대괄호 처리된 그리스어 구절이 누락되었습니다.
    rationale: 제시된 원어 본문은 7절 끝에 대괄호 안의 구절을 포함합니다. 이를 본문 대괄호와 전승 상태를 알리는 주석으로 보존하여, 무비판적으로 확정하지도 누락하지도 않도록 했습니다.
  - severity: medium
    issue: 초안의 [a][b] 주석 표지가 정의되지 않았습니다.
    rationale: 번역문에 실제로 반영한 대괄호 구절에만 [a]를 붙이고, 해당 주석을 제공하여 표지-주석 연결을 완결했습니다.
  - severity: low
    issue: ‘아말렉에게는’이 원문의 전치사구를 부정확하게 처리합니다.
