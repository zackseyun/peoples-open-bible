    2. “This world and the vanities of their wealth must be cut away from them. Then they will fit into
    God’s kingdom. They must enter God’s kingdom, for the Lord has blessed this innocent kind. No one
    of this kind, therefore, will perish. Even if one of them, tempted by the utterly wicked devil, commits
    some offense, that person will quickly return to their Lord.”


    3. “I, the messenger of repentance, declare all of you blessed who are innocent like infants, for
    your portion is good and honored before God.”


    4. “I tell all of you who have received this seal to be sincere, to hold no grudges, and not to persist
    in your wickedness or in bitter remembrance of offenses. Become, each of you, of one spirit,[a] heal
    these evil divisions and remove them from among you, so that the Lord of the flock may rejoice over
    them.”


    5. “He will rejoice if he finds them all healthy. But if he finds any of them ruined,[b] woe to the
    shepherds!”


    6. “And if the shepherds themselves are found ruined, what answer will they give for this flock?[c]
    Will they say that the flock mistreated them? They will not be believed. It is incredible that a shepherd
    could suffer at the hands of the flock, and the shepherd will be punished more severely for lying.
