id: JER.34.16
reference: Jeremiah 34:16
source:
  edition: WLC
  text: וַ/תָּשֻׁ֨בוּ֙ וַ/תְּחַלְּל֣וּ אֶת שְׁמִ֔/י וַ/תָּשִׁ֗בוּ אִ֤ישׁ אֶת עַבְדּ/וֹ֙ וְ/אִ֣ישׁ אֶת שִׁפְחָת֔/וֹ אֲשֶׁר שִׁלַּחְתֶּ֥ם חָפְשִׁ֖ים לְ/נַפְשָׁ֑/ם וַ/תִּכְבְּשׁ֣וּ אֹתָ֔/ם לִֽ/הְי֣וֹת לָ/כֶ֔ם לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָחֽוֹת־־־־׃ס
translation:
  text: 'But you reversed course and profaned my name: each of you forced his male and female slaves to return, though you had set them free to live as they wished; then you forced them to be your male and female slaves again.'
  philosophy: dynamic
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  chosen: you turned back
  alternatives:
  - you turned around
  - you relapsed
  lexicon: HALOT
  rationale: שׁוּב with waw-consecutive here marks reversal of the prior action; 'turned back' preserves the concrete idiom and the sense of reneging.
- source_word: וַתְּחַלְּלוּ אֶת־שְׁמִי
  chosen: and profaned my name
  alternatives:
  - and defiled my name
  - and dishonored my name
  lexicon: HALOT
  rationale: חלל in the piel commonly means to profane or treat as common, especially with 'name' as object. 'Profaned my name' is the standard and most theologically precise rendering.
- source_word: וַתָּשִׁבוּ
  chosen: made return
  alternatives:
  - caused to return
  - took back
  lexicon: HALOT
  rationale: 'The Hiphil is causative: the former owners made the released servants return. The main sentence supplies the objects naturally.'
- source_word: אִישׁ ... וְאִישׁ
  chosen: each of you
  alternatives:
  - each man ... and each man
  lexicon: HALOT
  rationale: The distributive repetition addresses every slaveholder. English carries that force concisely with 'each of you.'
- source_word: עַבְדּוֹ
  chosen: his male slave
  alternatives:
  - his servant
  - his slave
  lexicon: HALOT
  rationale: Given the context of ownership, release, and re-enslavement, the bonded nature is salient. Following the translation philosophy, 'slave' is preferable to 'servant.' 'Male slave' also preserves the contrast with the following feminine term.
- source_word: שִׁפְחָתוֹ
  chosen: his female slave
  alternatives:
  - his maidservant
  - his slave-girl
  lexicon: HALOT
  rationale: The feminine counterpart to עבד is explicit. 'Female slave' is clear modern English and preserves the gender distinction without archaic tone.
- source_word: שִׁלַּחְתֶּם חָפְשִׁים
  chosen: you had set them free
  alternatives:
  - you had sent them away free
  lexicon: HALOT
  rationale: The phrase concerns granting freedom, not merely the manner of departure. 'Set free' is the established idiomatic equivalent.
- source_word: לְנַפְשָׁם
  chosen: to go where they wished
  alternatives:
  - for themselves
  - as they desired
  lexicon: HALOT
  rationale: The phrase presents the freed people as living at their own disposal. 'Go where they wished' communicates that autonomy in this release context.
- source_word: וַתִּכְבְּשׁוּ אֹתָם
  chosen: then you subjugated them
  alternatives:
  - and you forced them into subjection
  - and you brought them under control
  lexicon: HALOT
  rationale: The verb denotes forcing under control or subjugating. The adversative sequence supplies the renewed enslavement.
- source_word: לִהְיוֹת לָכֶם
  chosen: to be your
  alternatives:
  - to become yours as
  - to belong to you as
  lexicon: HALOT
  rationale: The infinitive phrase expresses resulting status. 'To be your' is concise and preserves the possessive relation.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  chosen: male slaves and female slaves
  alternatives:
  - slaves, both male and female
  - servants and maidservants
  lexicon: HALOT
  rationale: The paired nouns restate the enslaved status with gender distinction. Rendering both explicitly preserves the Hebrew emphasis and avoids softening the institution.
