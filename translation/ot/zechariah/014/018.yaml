  meaning_decisions:
  - source_phrase: מִשְׁפַּחַת מִצְרַיִם
    prior_rendering: the family of Egypt
    new_rendering: the people of Egypt
    rationale: The collective expression identifies Egypt’s people as a national group, not a single household; “people” conveys that meaning naturally.
  - source_phrase: לֹא תַעֲלֶה וְלֹא בָאָה
    prior_rendering: does not go up and does not come
    new_rendering: do not go up to attend the feast
    rationale: The paired verbs describe failure to make the pilgrimage and attend the celebration, not two distinct failures requiring separate English clauses.
  - source_phrase: וְלֹא עֲלֵיהֶם תִּהְיֶה הַמַּגֵּפָה
    prior_rendering: then the plague will not be upon them
    new_rendering: they too will have no rain; they will suffer the plague
    rationale: The Masoretic pause after “upon them” supports separating the elliptical negative clause from the positive plague clause. Supplying “rain” from verse 17 preserves the negation without exempting Egypt from the punishment explicitly affirmed in verse 19.
