source:
  edition: Lightfoot & Harmer 1891 (edited Latin Vulgata ending)
  text: 'Misi autem tibi has virgines, ut habitent tecum; vidi enim eas affabiles tibi esse. habes ergo
    eas adiutrices, quo magis possis huius mandata servare; non potest enim fieri ut sine his virginibus
    haec mandata serventur. video autem eas libenter esse tecum. sed ego praecipiam eis ut omnino a domo
    tua non discedant. 2. tu tantum conmunda domum tuam; in munda enim domo libenter habitabunt. mundae
    enim sunt atque castae et industriae, et omnes habentes gratiam apud Dominum. igitur si habuerint
    domum tuam puram, tecum permanebunt; sin autem pusillum aliquid inquinationis acciderit, protinus
    a domo tua recedent. hae enim virgines nullam omnino diligunt inquinationem. 3. dico ei: Spero me,
    domine, placiturum eis, ita ut in domo mea libenter habitent semper. et sicut hic, cui me tradidisti,
    nihil de me queritur, ita neque illae querentur. 4. ait ad pastorem illum: Video, inquit, servum Dei
    velle vivere, et custoditurum haec mandata, et virgines has habitatione munda conlocaturum. 5. haec
    cum dixisset, iterum pastori illi me tradidit, et vocavit eas virgines et dixit ad eas: Quoniam video
    vos libenter in domo huius habitare, commendo eum vobis et domum eius, ut a domo eius non recedatis
    omnino. illae vero haec verba libenter audierunt.'
