theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Whether בְּמַעֲשֵׂה יְדֵיכֶם should be made explicit as idolatry
  chosen_reading: by the work of your hands
  alternative_readings:
  - by the idols your hands made
  - by what your hands have made
  rationale: Although the idiom often refers to idols in Jeremiah, this verse does not explicitly name idols. To avoid importing a doctrinally or interpretively sharpened claim beyond the wording, the translation keeps the broader idiom in the main text.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Never import doctrinal claims the text does not make; original-language primacy'
