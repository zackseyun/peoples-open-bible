theological_decisions:
- issue: Rendering of covenant-community term חֲסִידֶיךָ
  chosen_reading: your faithful ones
  alternative_readings:
  - your saints
  - your godly ones
  rationale: The verse speaks of God's devoted people without invoking later technical ecclesial categories. 'Faithful ones' preserves covenant loyalty and remains readable modern English, in line with the translation philosophy's preference for accessibility without flattening theological weight.
  doctrine_reference: Translation philosophy points 5 and 6
- issue: Whether to make explicit that 'good' refers to God's name
  chosen_reading: for it is good
  alternative_readings:
  - for your name is good
  rationale: The Hebrew leaves the predicate compact and somewhat elliptical. The main text preserves that terseness and ambiguity rather than over-specifying the referent, while a footnote preserves the more explicit interpretive rendering.
  doctrine_reference: Translation philosophy point 3
revisions:
- timestamp: '2026-04-21T00:23:44Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/052/011.json
  category: awkward_english
  tier: 1
  from: I will wait for your name
  to: I will hope in your name
  rationale: The Hebrew `וַאֲקַוֶּה שִׁמְךָ` is literally 'and I will wait for your name.' While 'wait for' is a valid translation of `קוה`, the English idiom 'to wait for a name' is uncommon and could be slightly unclear to a modern reader. It might be interpreted as waiting for a name to be announced, rather than the intended meaning of placing expectant trust in God's character (represented by His name). A rendering like 'I will hope in your name' (already a footnote) is a common and clear alternative that better captures the sense of trust and expectation inherent in the verb `קוה` in this context.
