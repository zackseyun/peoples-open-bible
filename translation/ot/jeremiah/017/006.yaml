  from: He will be like a shrub in the desert[a], and he will not see when good comes. He will dwell in parched places in the wilderness[c][b], in a salt land that is not inhabited.
  to: They will be like a shrub in the desert and will not experience good when it comes[a]. They will dwell in parched places in the wilderness, in a salt-encrusted land where no one lives.
  rationale: The earlier lexical discussion recognized both perception and participation in the coming good; I choose the experiential sense and note the other. Shrub remains suitably unspecific, and the repeated desert imagery is preserved rather than replaced with explanation.
