theological_decisions:
- issue: Meaning of יִפְלְחוּן toward the son-of-man figure
  chosen_reading: serve him
  alternative_readings:
  - worship him
  - pay homage to him
  rationale: Serve retains service and allegiance while allowing the strong religious resonance supported by Daniel 3 and 6; worship is disclosed. Wider lexical breadth and book-level religious usage must both remain visible. Neither the English gloss nor the future rendering independently decides the recipient's identity.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
