  review_summary: The verse introduces another way God addresses a human being, so an explicit generic subject is needed in English. “Reproved with pain” and especially “strife in his bones” are overly formal glosses that obscure bodily suffering. In this setting רִיב denotes severe internal conflict or agony, while אֵתָן conveys persistence or strength. The revision remains concrete by retaining “in his bones.”
