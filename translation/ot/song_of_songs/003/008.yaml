id: SNG.3.8
reference: Song of Songs 3:8
source:
  edition: WLC
  text: כֻּלָּ/ם֙ אֲחֻ֣זֵי חֶ֔רֶב מְלֻמְּדֵ֖י מִלְחָמָ֑ה אִ֤ישׁ חַרְבּ/וֹ֙ עַל יְרֵכ֔/וֹ מִ/פַּ֖חַד בַּ/לֵּילּֽוֹת־׃ס
translation:
  text: All of them bear swords and are trained for battle; each man has his sword at his thigh because of the terrors of the night.
  philosophy: dynamic
lexical_decisions:
- source_word: כֻּלָּם
  chosen: All of them
  alternatives:
  - All
  - Every one of them
  lexicon: HALOT
  rationale: The pronominal suffix makes the collective explicit; 'All of them' is natural English and preserves the totality of the group.
- source_word: אֲחֻזֵי חֶרֶב
  chosen: bear swords
  alternatives:
  - grasping the sword
  - equipped with swords
  lexicon: HALOT
  rationale: The construction characterizes the entire group as armed rather than depicting a momentary act of gripping.
- source_word: מְלֻמְּדֵי מִלְחָמָה
  chosen: trained for battle
  alternatives:
  - trained for battle
  - experienced in war
  lexicon: HALOT
  rationale: This is a natural rendering of military training.
- source_word: אִישׁ
  chosen: each man
  alternatives:
  - each one
  - every man
  lexicon: HALOT
  rationale: Distributive singular after a plural collective is well represented by 'each man.' This is gender-accurate to the masculine singular and suits the immediate picture of armed guards.
- source_word: חַרְבּוֹ עַל יְרֵכוֹ
  chosen: has his sword at his thigh
  alternatives:
  - his sword on his thigh
  - wears his sword at his side
  lexicon: HALOT
  rationale: This phrase evokes a weapon strapped or ready at the upper leg/hip area. 'At his thigh' is the more literal rendering and preserves the imagery.
- source_word: מִפַּחַד
  lemma: מִן
  chosen: because of terror
  alternatives:
  - because of fear
  - against terror
  lexicon: HALOT
  rationale: The preposition מִן here is causal ('because of' / 'on account of'). 'Terror' better conveys the intensity of פַּחַד in this protective context.
- source_word: בַּלֵּילוֹת
  chosen: in the nights
  alternatives:
  - in the night
  - at night
  lexicon: HALOT
  rationale: The Hebrew is plural, likely an idiomatic plural referring to nighttime danger generally. 'In the nights' preserves the plural form, though English readers may hear it as poetic rather than strictly temporal.
- source_word: מִפַּחַד בַּלֵּילוֹת
  chosen: because of the terrors of the night
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: It preserves the causal force of מִן and renders the temporal idiom naturally without converting it into an explicit purpose clause.
