translation:
  text: 'I.1. The man who raised me sold me to a woman named Rhoda in Rome[b]. Many years later, I recognized
    her and began to love her as a sister.


    I.2. Later, I saw her bathing in the river Tiber. I gave her my hand and helped her out of the river.
    When I saw her beauty, I thought in my heart, “I would be happy if I had a wife like her, in both
    beauty and character.” That was all I thought about, nothing else.


    I.3. Some time later, I was going to Cumae[c], praising God’s creations for being so great, splendid,
    and powerful. I fell asleep while walking. A spirit took me and carried me through a pathless place
    where no one could walk. The place was steep and cut off by the waters. I crossed that river and reached
    level ground. I knelt down and began to pray to the Lord and confess my sins.


    I.4. While I was praying, heaven opened. I saw the woman I had desired greeting me from heaven. She
    said, “Greetings, Hermas!”


    I.5. I looked at her and said, “Lady, what are you doing here?” She answered, “I was taken up to expose
    your sins before the Lord.”


    I.6. I said to her, “Are you now my accuser?” “No,” she said. “But listen to what I am about to tell
    you. God lives in the heavens. He created what exists out of what did not exist. He multiplied it
    and made it grow for the sake of his holy church. He is angry with you because you sinned against
    me.”


    I.7. I answered her, “Did I sin against you? In what way? When did I ever say anything shameful to
    you? Didn’t I always regard you as a goddess[1]? Didn’t I always respect you as a sister? Woman, why
    are you falsely accusing me of these wicked and unclean things?”


    I.8. She laughed and said to me, “Evil desire has risen into your heart[2]. Doesn’t it seem to you[d]
    that it is wicked for evil desire to rise into a righteous man’s heart? It is a sin, and a great one.
    A righteous man plans what is righteous. When he does this, his honor is established in the heavens[3],
    and he has the Lord readily reconciled[4] in everything he does. But people who plan evil in their
    hearts bring death and captivity upon themselves. This is especially true of those who secure this
    present age for themselves[5], boast in their wealth, and do not hold on to the good things that are
    coming.


    I.9. “Their souls will repent[a][6]—those who have no hope, but have despaired of themselves and their
    life. But you, pray to God. He will heal your sins[7], and those of your whole household, and of all
    the holy ones[8].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: '1'
    reason: textual_variant
    text: The working Greek has thean, goddess. Sinaiticus1.7 also has goddess; Athos Plate I has daughter
      instead. Vulgata printed3 has dominam, lady or mistress, while its apparatus reports deam, goddess,
      for a named manuscript. Palatina printed9 omits this separate goddess/daughter question and keeps
      respect as a sister. These are different readings, not interchangeable English synonyms.
  - marker: '2'
    reason: cultural_note
    text: Rising into the heart describes the arrival of a thought or desire. The speaker identifies that
      evil desire as a great sin, although Hermas has denied further intentions. The working source’s
      accusation and his denial are both retained.
  - marker: '3'
    reason: lexical_alternative
    text: Doxa may be rendered honor or glory. The working sentence establishes his honor in the heavens
      as he plans righteous things; Athos and Sinaiticus retain the glory clause. Vulgata printed4 instead
      speaks of walking rightly in the heavens, and Palatina printed9 has correcting himself and grace
      in the heavens. These versional formulations have not been inserted into the working Greek.
  - marker: '4'
    reason: lexical_alternative
    text: Eukatallakton means readily reconciled or easily brought into favor. Both Latin printed passages
      use propitium, favorable or propitious. The source connects this with righteous planning in every
      affair; the translation does not replace that connection with a separate doctrinal explanation.
  - marker: '5'
    reason: lexical_alternative
    text: Securing this present age for themselves renders ton aiona touton peripoioumenoi. Athos retains
      the verb, and Sinaiticus1.8 correctors S1/ca supply peripoioumenoi over a difficult first-hand spelling
      with dotted letters. Vulgata printed4 says loving this world and glorying in vices, with riches
      reported in its apparatus for one manuscript; Palatina printed9 says claiming this world and luxuriating
      in riches while neglecting coming glory. The working Greek has wealth and coming good things.
  - marker: '6'
    reason: textual_variant
    text: The working Greek has metanoesousin, will repent; Sinaiticus1.9 transcribes the same verb without
      a correction or supplied-text marker. Lightfoot & Harmer physical314 prints the sentence as a statement,
      retained here instead of the former English question. Athos Plate I has polla metamelesousin, will
      greatly regret, using a different verb. Vulgata printed4 instead says their souls are emptied and
      describes doubters with no hope in the Lord who disregard their lives. Palatina printed9 says souls
      without hope of life will not resist those same luxuries and that they despair of themselves and
      their lives; its resistent is an editorial emendation of the reported codex form. Neither Latin
      version is presented as a literal attestation of the selected Greek future. A rhetorical English
      question is a possible interpretation, not the working edition’s printed punctuation. Repent is
      retained without erasing the statement about their hopelessness or harmonizing the witnesses.
  - marker: '7'
    reason: lexical_alternative
    text: The working verb iasetai means will heal; Sinaiticus1.9 and Athos retain it, and Vulgata printed4
      has sanabit, will heal. Palatina printed9 instead has dimittet, will forgive. The working healing
      image is retained rather than silently replacing it with the Latin alternative.
  - marker: '8'
    reason: cultural_note
    text: Holy ones renders hagioi; saints is an alternative. The promise explicitly includes Hermas,
      his whole household, and all the holy ones. Both Greek witnesses and both Latin printed passages
      preserve that scope; the note does not add a condition or exclude a named group.
  - marker: b
    reason: textual_variant
    text: Rhoda’s name is in the working Greek and Sinaiticus1.1. Athos Plate I instead says a certain
      woman in Rome, without the name. Palatina printed3 has a woman named Rada; Vulgata printed2 has
      the difficult wording sold a certain girl in Rome, without Rhoda’s name. The working text says the
      man who raised Hermas sold him; it does not narrate a later manumission. Vulgata also repeats the
      wish for such a wife in1.2; the selected Greek gives it once.
  - marker: c
    reason: textual_variant
    text: Working Cumae is also in Athos Plate I and Sinaiticus1.3. Vulgata printed2 instead has setting
      out with these thoughts. Palatina printed5 has the city of the Ostians, and its apparatus proposes
      Cumae as an editorial correction. The working destination is retained. In the prayer, working/Athos
      and both Latin passages say Lord, while Sinaiticus1.3 has God; its first hand lacks the possessive
      my before sins, added by ca.
  - marker: d
    reason: textual_variant
    text: The working question asks whether evil desire seems wicked. Athos and both Latin versions retain
      that negative question. Sinaiticus1.8 first hand has soi, to you, in the place where corrector ca
      writes ou, not; the working negative is retained. In1.7, working/Athos ask in what way; Sinaiticus
      first hand has in what place and ca changes place to way. Vulgata printed3 has where/in what place.
      Correctors are distinguished from separate manuscripts.
lexical_decisions:
