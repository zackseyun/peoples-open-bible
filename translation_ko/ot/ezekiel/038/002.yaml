  source_fidelity: ‘וְהִנָּבֵא עָלָיו’의 עַל은 이 심판 예언의 문맥에서 곡을 반대하는 방향을 나타냅니다. 초안의 ‘그에게 대언하라’는 수신 대상에게 메시지를 전달한다는 뜻으로 들려 적대적 방향성을 보존하지 못합니다. 또한 נְשִׂיא רֹאשׁ를 ‘메섹과 두발의 우두머리 통치자’로 옮기는 것은 영어 POB의 ‘chief prince of Meshech and Tubal’ 및 본문 어순에 부합합니다.
  naturalness: ‘그에게 대언하라’는 현대 한국어에서 예언의 내용이나 반대 방향이 불분명하며, ‘대언하다’는 본문에 없는 대리 발화의 뉘앙스를 낼 수 있습니다. ‘그를 거슬러 예언하십시오’가 원문의 방향성과 현대적 의미를 더 명료하게 나타냅니다. 합쇼체에 맞추어 명령형도 ‘향하십시오/예언하십시오’로 통일했습니다.
  terminology: 에스겔의 정형 호칭 ‘인자야’, 고유명 ‘마곡’, ‘곡’, ‘메섹’, ‘두발’을 유지했습니다. רֹאשׁ는 지명 ‘로스’로 확정하지 않고 ‘우두머리’로 번역했습니다.
  issues:
