base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/016.yaml
  text: And all the eagles and the vultures and the ravens and the kites gathered together and came with them, with all the wild sheep; and they all came together and helped one another so as to break the horn of that ram.
translation:
  language: ko
  text: 그리고 모든 독수리와 대머리독수리와 까마귀와 솔개가 함께 모여 그들과 함께 왔고, 모든 들양도 함께 왔습니다. 그들은 모두 한데 모여 서로 도와 그 숫양의 뿔을 꺾었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎሙ፡ አንስርት፡ ወዓውስት፡ ወቋዓት፡ ወሀባይ
  english_pob_choice: the eagles and the vultures and the ravens and the kites
  chosen_korean: 독수리와 독수리새와 까마귀와 솔개
  alternatives_korean:
  - 독수리와 독수리매와 까마귀와 솔개
  - 독수리와 독수리류와 까마귀와 솔개
  lexicon: Ethiopic bird names in Enoch 90:16
  rationale: POB의 열거를 따라 네 종류의 새를 모두 구분해 옮겼습니다. ‘vultures’에 해당하는 ዓውስት은 한국어 성경에서 정착된 단일 대응이 약해, 독수리와 혼동되지 않도록 ‘독수리새’로 기능적으로 구분했습니다.
- source_word: ተጋብኡ፡ ወ*መጽኡ፡ ... ኵሉ፡ አባግዕ፡ ገዳም፡ ወ*መጽኡ፡ *ኵሎሙ፡ ኅቡረ፡
  english_pob_choice: gathered together and came with them, with all the wild sheep; and they all came together
  chosen_korean: 함께 모여 그들과 함께 왔으며, 모든 들양들과도 함께 와서, 그들 모두가 한데 모여
  alternatives_korean:
  - 모여 그들과 함께 와서, 모든 들양들과 함께 왔으며, 모두 한자리에 모여
  - 모여 함께 왔고, 모든 들양과 함께 왔으며, 다 함께 모여
  lexicon: repetition and coordination in Ge'ez narrative
  rationale: 동사 반복과 병렬 구조를 살려 ‘모여 / 함께 와서 / 한데 모여’로 중복을 일부 보존했습니다. ‘wild sheep’는 문자적으로 ‘들양’이 가장 직접적입니다.
- source_word: ይቀትቅጥዎ፡ ለዝኩ፡ ቀርነ፡
  english_pob_choice: helped one another so as to break the horn of that ram
  chosen_korean: 서로 도와 그 숫양의 뿔을 꺾었습니다
  alternatives_korean:
  - 서로 도와 그 숫양의 뿔을 부러뜨렸습니다
  - 서로 협력하여 그 숫양의 뿔을 꺾었습니다
  lexicon: Qal/causative sense in Ge'ez for damaging/breaking a horn
  rationale: POB의 ‘break’에 맞춰 물리적 파손을 직접 드러내되, 뿔에 자연스러운 한국어 동사로 ‘꺾다’를 택했습니다. 이는 ‘부러뜨리다’보다 상징적·서사적 힘을 유지하면서도 자연스럽습니다.
theological_decisions:
- issue: 숫양의 뿔을 ‘꺾다’라는 최종 이미지
  chosen_reading: 군집한 새들과 들양들이 협력하여 권세의 상징인 뿔을 무너뜨리는 서사적 장면으로 유지했습니다.
  alternative_readings:
  - 정치적 세력의 몰락을 직접 해석하는 방식
  - 상징을 약화시켜 단순한 동물 행동으로만 읽는 방식
  rationale: 본문은 해석을 덧붙이기보다 상징적 행위를 서술합니다. 그래서 의미를 확장하지 않고, 독자가 Enoch의 비유적 힘을 그대로 읽도록 했습니다.
  doctrine_reference: apocalyptic symbolism preservation
