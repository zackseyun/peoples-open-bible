theological_decisions:
- issue: 시편 탄식의 본문 초점과 그리스도론적 적용
  chosen_reading: 본문은 우선 시편 기자의 탄식으로 옮기되, 메시아적 해석을 본문에 직접 삽입하지 않았습니다.
  alternative_readings:
  - 본문에 예수의 고난을 직접 예견하는 표현을 넣는 해석
  rationale: 이 절은 히브리어 자체로는 개인 탄식의 언어이며, 신약의 적용 가능성은 유지하되 번역문은 본문이 말하는 고통과 버림받음을 그대로 전달하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3; NT 인용 전통
