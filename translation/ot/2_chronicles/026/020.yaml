  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Whether כֹהֵן הָרֹאשׁ should be rendered as a technical office title
  chosen_reading: chief priest
  alternative_readings:
  - high priest
  - head priest
  rationale: The Hebrew here says 'the head/chief priest,' not the more specific later English ecclesiastical title 'high priest.' The chosen rendering avoids importing a technical distinction not explicit in the text.
