  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus Christ, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
  footnotes:
