id: JOB.30.22
reference: Job 30:22
source:
  edition: WLC
  text: תִּשָּׂאֵ֣/נִי אֶל ר֭וּחַ תַּרְכִּיבֵ֑/נִי וּ֝/תְמֹגְגֵ֗/נִי תשוה־׃
translation:
  text: You lift me up on the wind; you make me ride on it, and you make me melt away in the storm[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The final Hebrew word is uncertain; the last clause may instead mean “you dissolve my substance” or “you bring me to ruin.”
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  chosen: You lift me up
  alternatives:
  - You carry me away
  - You raise me
  lexicon: HALOT
  rationale: From נשׂא, 'to lift, carry, bear.' In context of violent displacement, 'lift me up' preserves the concrete image while remaining natural English. The direct address to God is retained with 'You.'
- source_word: אֶל רוּחַ
  chosen: on the wind
  alternatives:
  - into the wind
  - to the spirit
  lexicon: HALOT
  rationale: With the following causative verb of riding, this naturally expresses the medium on which Job is borne.
- source_word: תַּרְכִּיבֵנִי
  chosen: you make me ride on it
  alternatives:
  - you cause me to ride
  - you set me riding
  lexicon: HALOT
  rationale: Hiphil of רכב means 'cause to ride' or 'make ride.' Because English normally requires an object with 'ride' in this context, 'on it' is supplied to refer back to the wind. This makes explicit what is implicit in Hebrew without changing the image.
- source_word: וּתְמֹגְגֵנִי
  chosen: you make me melt away
  alternatives:
  - you melt me
  - you make me totter
  lexicon: HALOT
  rationale: The verb conveys melting or dissolution; this preserves its image in natural English rather than substituting the inferred motion “toss me about.”
- source_word: תשוה
  chosen: in the storm
  alternatives:
  - in the crash
  - in the tempest
  - you bring me to ruin
  lexicon: HALOT
  rationale: This is a contextually plausible construal of the difficult final form, but not a certain lexical identification; the note preserves other major understandings.
