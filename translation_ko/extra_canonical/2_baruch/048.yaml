  language: ko
  text: '이레가 지나고, 일곱째 날이 지나자 나는 전능하신 분 앞에서 기도하며 말했습니다.[a]


    “오 주님, 주님께서는 때들의 도래를 부르시니 그것들이 주님 앞에 서고, 세대들의 지배를 바꾸시니 그것들이 주님을 거스르지 못합니다. 주님께서는 때들의 질서를 정하시니 그것들이 주님께 순종합니다. 주님만이 세대들의 기간을 아시며, 많은 이에게는 주님의 비밀을 드러내지 않으십니다. 주님께서는 불의 많은 무리를 알리시고, 강한 바람의 날쌘 움직임을 저울질하십니다. 주님께서는 때들의 끝을 살피시고, 짙은 어둠의 저장고들을 조사하십니다. 주님께서는 지나가는 자들과 보존되는 자들의 수를 정하시고, 아직 있을 자들의 거처를 드러내십니다. 주님께서는 생물들의 생각을 밝혀 주시며, 세대들에 감추어진 것들은 주님께 숨겨지지 않습니다. 주님께서는 두려움과 격분의 영으로 불길을 명하시니, 그것들이 바람으로 바뀝니다. 주님의 말씀으로 존재하지 않던 것을 서 있게 하시고, 주님의 지혜의 능력으로 있는 것을 붙드십니다. 주님의 선하심으로 주님의 율법의 쓰디쓴 것들을 지혜롭게 하십니다.


    “수없이 많은 이들이 그것들을 버렸고, 그들의 무리 가운데서 파멸로 내려가 자기 자신을 대적하는 자들이 되었습니다. 그들이 주님을 버리고 자기에게 유익하지 않은 것을 찾았기 때문입니다. 그러나 우리에게는 시간이 지날수록 더욱 그러하니, 우리가 그들과 같아지지 않았음을 압니다. 그들은 주님의 길을 알지 못했고 주님의 판결을 이해할 수 없었습니다. 우리의 생명이 무엇이겠습니까? 우리는 멸망한 우리의 조상들을 버린 적이 없고, 죽음과 모든 것의 끝으로 돌아선 적도 없습니다. 주님께 남겨진 이 백성을 보시고, 그들 가운데서 주님을 위한 남은 자들을 구원해 주십시오. 주님의 백성의 소망을 꺾지 마시고, 주님의 도우심의 때를 단축하지 마십시오. 이는 주님께서 선택하신 백성이며, 이 백성과 같은 자는 누구도 찾을 수 없기 때문입니다. 그러나 이제 저는 주님 앞에서 말하고, 제 마음이 생각하는 것을 말하겠습니다. 우리는 주님을 신뢰합니다. 보십시오, 주님의 율법이 우리와 함께 있고, 우리가 주님의 규례를 굳게 붙드는 한 넘어지지 않으리라는 것을 압니다. 적어도 이 점에서는 복을 받습니다. 곧 우리가 민족들과 섞이지 않았다는 것입니다. 우리는 한 분에게서 하나의 율법을 받은 하나의 유명한 백성이기 때문입니다. 우리 가운데 있는 그 율법이 우리를 도울 것이며, 우리 안에 있는 뛰어난 지혜가 우리를 붙들어 줄 것입니다.”


    내가 이렇게 기도하고 말했을 때 나는 크게 약해졌습니다. 그러자 그분이 나에게 대답하여 말씀하셨습니다.[b]


    “바룩아, 너는 분명히 기도했으며 네 말은 모두 들려졌다. 그러나 나의 심판은 나 자신의 것이고, 나의 율법은 그 권리를 주장한다. 너는 네 뜻에서 말하고 네 마음에서 나와 대화하고 있기 때문이다. 이것이 사람이다. 곧 썩어 없어질 것이 되어서는 안 되며, 사람은 아무것도 아닌 데서 지어낸 자들 같은 존재가 아니냐? 나의 은혜는 꺾이지 않을 것이고, 어둠은 내 영을 도울 수 없다. 그러므로 네가 반드시 들려 올라갈 것이라는 것은 내가 전에 네게 말한 대로다. 그리고 내가 네게 말한 것을 보이겠다. 보응의 때가 오면 그것이 기쁨들의 출발과 함께 드러날 것이지만, 깊은 어둠 가운데 오는 자들도 있을 것이다. 그 날들에 그들은 많은 멸망 한가운데서 서로를 보게 될 것이며, 무엇이 내 것인지를 알지 못했기 때문이다. 그때에는 지혜로운 이가 많지 않고, 깨닫는 자도 적을 것이며, 아는 자들조차 잠잠할 것이다. 많은 이가 때 이르게 죽고, 때 이르지 않은 출산이 보일 것이며, 맏아들들이 때보다 먼저 태어날 것이다. 그들의 아들들은 헛될 것이고, 그들의 자손은 드러나 구별될 것이다. 사람들은 거짓된 자가 될 것이며, 어떤 이들은 환난 속에서 믿음 안에서 죽고, 다른 이들은 감사를 준비하였다가 다시 수치 가운데 굳게 설 것이다. 스스로 의롭다고 여기는 이들로부터 많은 말이 전해지겠지만, 기대하지 않았던 이들에게는 오류의 표지가 드러날 것이며, 평안하던 자들을 고통이 사로잡을 것이다. 많은 이가 진노 가운데 드러날 것이고, 그 진노로 말미암아 멸망에 이르게 될 것이다. 그러면 그 시대들의 드러남이 그들의 죄악의 가득한 분량 가운데서 나타날 것이다. 그 시대들은 이미 준비되어 지나가고 있었고, 그들은 자기 생각 속에서 멸망하고 있었으나 멸망의 고통을 깨닫지 못했기 때문이다. 그러므로 불이 그들을 삼켰다. 그러나 참으로 내 것인 자들에게는 아직 큰 소망이 남아 있다. 지금 네가 사는 이 지나가는 세상에서는 얻는 것이 적고 잠깐이지만, 끝이 없는 세상에서는 훨씬 더 큰 소망이
    있다. 그들은 그 큰 빛을 상속받을 것이다.”[c]'
  philosophy: optimal-equivalence
lexical_decisions:
