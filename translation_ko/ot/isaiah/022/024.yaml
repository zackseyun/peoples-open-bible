review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. וְתָלוּ는 능동 복수(‘그들이 매달 것이다’)인데 초안의 ‘그에게 달릴 것이니’는 행위 주체를 지우고 한국어에서 ‘달리다’가 지닌 단순 부착 상태로 약화합니다. 또한 צאצאים와 צפעוֹת의 병렬은 ‘자손과 후손’처럼 동의어를 겹치기보다 ‘자손과 곁가지들’처럼 파생·분지의 이미지를 구별하여 옮기는 편이 낫습니다.
  naturalness: ‘그에게 매달 것입니다’와 콜론 뒤의 동격 목록은 현대 표준어 합쇼체에서 자연스럽습니다. ‘그의 아버지 집안’은 가문·가속을 포함하는 בֵּית אָבִיו의 문맥상 의미를 한국어로 무리 없이 전달합니다.
  terminology: כָּבוֹד은 여기서 가문의 위신·영예를 가리키므로 ‘영예’가 영어 POB의 honor 및 문맥에 더 정확합니다. כְּלֵי הַקָּטָן은 ‘작은 그릇 하나하나’, אַגָּנוֹת과 נְבָלִים은 각각 ‘대접들’과 ‘온갖 항아리’로 옮겨 목록과 범위를 보존했습니다.
  issues:
  - severity: medium
    issue: 능동 복수 동사의 주체와 동작이 약화됨
    rationale: וְתָלוּ는 ‘그들이 매달 것이다’라는 능동 복수형입니다. ‘달릴 것이다’는 수동적 상태 표현이며 원문의 행위 주체를 보존하지 못합니다.
  - severity: medium
    issue: ‘자손과 후손’이 두 원어 명사의 비유적 구별을 흐림
    rationale: צאצאים(후대/자손)과 צפעות(곁가지·파생된 것들)의 병렬을 한국어 동의어 병렬로 만들면 원문의 분지 이미지를 잃습니다.
  - severity: low
    issue: ‘영광’보다 ‘영예’가 문맥과 영어 감사본에 적합함
    rationale: 이 구절의 כָּבוֹד은 가문의 명성과 위신을 가리키며, 이어지는 부양가족과 기물의 부담스러운 이미지와도 ‘영예’가 더 잘 연결됩니다.
  revised_text: 그들이 그의 아버지 집안의 모든 영예를 그에게 매달 것입니다. 곧 자손과 곁가지들, 작은 그릇 하나하나, 대접들부터 온갖 항아리까지입니다.
