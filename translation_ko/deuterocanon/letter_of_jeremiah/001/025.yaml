  text: Without feet they are carried on shoulders, showing their own disgrace to men; and even those who serve them are put to shame,
translation:
  language: ko
  text: 발이 없는 것들은 어깨에 실려 다니며, 사람들에게 자기들의 수치를 드러내고, 그것들을 섬기는 자들까지도 부끄러워합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνευ ποδῶν
  english_pob_choice: Without feet
  chosen_korean: 발이 없는 것들은
  alternatives_korean:
  - 발 없이
  - 발이 없어서
  lexicon: ποῦς
  rationale: 형태적 결핍을 자연스러운 현대 한국어로 옮기되, 우상 조각상의 무생물성을 분명히 드러내기 위해 ‘것들’을 보탰습니다.
- source_word: ἐπʼ ὤμοις φέρονται
  english_pob_choice: they are carried on shoulders
  chosen_korean: 어깨에 실려 다니며
  alternatives_korean:
  - 어깨에 메여 다니며
  - 어깨 위에 실려
  lexicon: φέρω
  rationale: ‘carry’를 수동적으로 풀어 우상들이 사람들에 의해 운반되는 장면을 자연스럽게 재현했습니다.
- source_word: τὴν ἑαυτῶν ἀτιμίαν
  english_pob_choice: their own disgrace
  chosen_korean: 자기들의 수치
  alternatives_korean:
  - 자기들의 치욕
  - 자기들의 불명예
  lexicon: ἀτιμία
  rationale: ἀτιμία의 공개적 수치와 수모를 담기 위해 ‘수치’를 택했습니다.
- source_word: τοῖς ἀνθρώποις
  english_pob_choice: to men
  chosen_korean: 사람들에게
  alternatives_korean:
  - 사람들 앞에
  - 인간들에게
  lexicon: ἄνθρωπος
  rationale: 문맥상 일반 대중을 가리키므로 남성 중심 어감이 강한 직역보다 ‘사람들에게’를 기본값으로 두었습니다.
- source_word: οἱ θεραπεύοντες αὐτά
  english_pob_choice: those who serve them
  chosen_korean: 그것들을 섬기는 자들
  alternatives_korean:
  - 그것들을 돌보는 자들
  - 그것들을 섬기는 사람들
  lexicon: θεραπεύω
  rationale: 우상에 대한 봉사·시중의 의미를 살리기 위해 ‘섬기는 자들’로 옮겼습니다.
theological_decisions:
- issue: 우상 비판의 직접성 유지
  chosen_reading: 우상들은 수동적 무게를 지닌 채 운반되고, 오히려 섬기는 이들까지 부끄러움에 빠집니다.
  alternative_readings:
  - 우상들은 단지 물건처럼 옮겨질 뿐이라는 중립적 서술
  - 의인화된 우상 이미지로 완화된 표현
  rationale: 본문의 풍자적 반전—우상이 인간에게 수치를 당하게 만드는 것이 아니라 인간이 우상으로 인해 수치를 당함—을 약화하지 않도록 했습니다.
  doctrine_reference: 우상숭배 비판, 예레미야 전통의 반우상 신학
