id: PSA.110.2
reference: Psalms 110:2
source:
  edition: WLC
  text: מַטֵּֽה עֻזְּ/ךָ֗ יִשְׁלַ֣ח יְ֭הוָה מִ/צִּיּ֑וֹן רְ֝דֵ֗ה בְּ/קֶ֣רֶב אֹיְבֶֽי/ךָ־׃
translation:
  text: 'Yahweh will extend your mighty scepter from Zion: rule in the midst of your enemies.'
  philosophy: dynamic
lexical_decisions:
- source_word: מַטֵּה
  chosen: scepter
  alternatives:
  - staff
  - rod
  lexicon: HALOT
  rationale: מַטֶּה can denote a staff, rod, or scepter. In this royal psalm, with the addressee enthroned and commanded to rule, 'scepter' best captures the emblem of kingly authority while remaining faithful to the concrete image.
- source_word: עֻזְּךָ
  chosen: your strength
  alternatives:
  - your might
  lexicon: HALOT
  rationale: 'עֹז commonly denotes strength or might. ''Your strength'' is the most direct rendering and works naturally with ''scepter'' as a genitive of quality/source: the scepter characterized by or expressing the king''s strength.'
- source_word: יִשְׁלַח
  chosen: sends forth
  alternatives:
  - will send
  - extends
  lexicon: HALOT
  rationale: The verb means 'send' or 'send out.' 'Sends forth' preserves the vividness of dispatching the royal scepter from Zion. Although some English versions use 'will send' or interpretively 'extends,' the Hebrew form here is well rendered as a present/future-like poetic statement in English.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives: []
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: מִצִּיּוֹן
  chosen: from Zion
  lexicon: HALOT
  rationale: A straightforward locative/source phrase. 'Zion' is retained as the proper name with its theological and royal associations.
- source_word: רְדֵה
  chosen: rule
  alternatives:
  - have dominion
  - subdue
  lexicon: HALOT
  rationale: The imperative of רדה means to rule or have dominion. 'Rule' is the clearest modern English equivalent. 'Subdue' would overstate the lexical force here, while 'have dominion' is accurate but less natural.
- source_word: בְּקֶרֶב
  chosen: in the midst of
  alternatives:
  - among
  lexicon: HALOT
  rationale: The phrase literally means 'in the midst of' or 'among.' The fuller rendering preserves the dramatic image of reigning surrounded by hostile powers.
- source_word: אֹיְבֶיךָ
  chosen: your enemies
  lexicon: HALOT
  rationale: A direct rendering of the plural noun with second masculine singular suffix, matching the addressed king.
