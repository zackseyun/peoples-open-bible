    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָסוֹג אָחוֹר
  english_pob_choice: has not turned back
  chosen_korean: 뒤로 물러서지 않았고
  alternatives_korean:
  - 뒤로 돌아서지 않았고
  - 물러나지 않았고
  - 뒤로 돌아가지 않았고
  lexicon: HALOT
  rationale: נָסוֹג אָחוֹר는 단순한 방향 전환보다 후퇴·철수의 뉘앙스를 가지므로, 한국어에서는 ‘뒤로 물러서다’가 자연스럽고 시적이며 의미를 잘 보존합니다.
- source_word: לִבֵּנוּ
  english_pob_choice: Our heart
  chosen_korean: 우리 마음
  alternatives_korean:
  - 우리 হৃদ?
  - 우리 심장
  - 우리 속마음
  lexicon: HALOT
  rationale: 히브리어 ‘heart’는 내면 전체를 가리키므로, 한국어에서는 문자 그대로의 ‘마음’을 유지해 인간 내면과 충성의 의미를 함께 살립니다.
- source_word: וַתֵּט אֲשֻׁרֵינוּ
  english_pob_choice: our steps turned aside
  chosen_korean: 우리 발걸음도 … 벗어나지 않았습니다
  alternatives_korean:
  - 우리 걸음도 … 벗어나지 않았습니다
  - 우리 발자국도 … 벗어나지 않았습니다
  - 우리 걸음도 … 치우치지 않았습니다
  lexicon: HALOT
  rationale: אֲשֻׁרֵינוּ는 ‘발걸음/걸음’의 뜻이므로, ‘발걸음’이 길-행로 이미지를 가장 자연스럽게 드러냅니다. וַתֵּט의 ‘옆으로 기울다/벗어나다’는 한국어에서는 ‘벗어나지 않았다’로 풀어 표현했습니다.
- source_word: מִנִּי אָרְחֶךָ
  english_pob_choice: from your path
  chosen_korean: 당신의 길에서
  alternatives_korean:
  - 당신의 길로부터
  - 당신의 길에서 벗어나
  - 당신의 길을 떠나
  lexicon: HALOT
  rationale: אָרַח은 물리적 ‘길’이면서 비유적으로 삶의 경로를 뜻하므로, ‘당신의 길’로 옮겨 원문 이미지와 언약적 방향성을 유지했습니다.
theological_decisions:
- issue: ‘heart’의 내면적 의미 보존
  chosen_reading: ‘마음’을 그대로 살려, 지성만이 아니라 의지와 충성까지 포함하는 내면의 중심을 가리키게 했습니다.
  alternative_readings:
  - 우리 충성이
  - 우리 의지가
  - 우리 생각이
  rationale: 시편의 표준적 인류학 표현을 좁혀 해석하지 않고, 독자가 본문이 지닌 정서·의지·충성의 넓은 범위를 읽도록 유지합니다.
