translation:
  text: 'As I walked with him, I was glad to see such good things. The shepherd said to me, “Go and bring
    lime and finely crushed pottery, so that I can fill the hollows left by the stones that were removed
    and put into the building.[a] Everything around the tower must be made level.”


    2. I did as he commanded and brought them to him. “Help me,” he said, “and the work will soon be finished.”[b]
    He filled the hollows left by the stones that had gone into the building, then ordered that the area
    around the tower be swept and made clean.


    3. The virgins took brooms and swept. They removed all the refuse from the tower and sprinkled water,
    and the place became cheerful and most fitting for the tower.


    4. The shepherd said to me, “Everything has been cleaned. If the Lord comes to inspect the tower,
    he will have nothing to blame us for.”[c] After saying this, he wanted to leave.


    5. But I caught hold of his bag and began solemnly to implore him by the Lord to explain everything
    he had shown me.[d] He said to me, “I must be occupied for a little while, and I will explain everything
    to you. Wait for me here until I return.”


    6. I said to him, “Sir, what will I do here by myself?” “You are not by yourself,” he said. “These
    virgins are with you.” “Then entrust me to them,” I said. The shepherd called them over and said to
    them, “I entrust this man to you until I return.” Then he left.


    7. I was alone with the virgins. They were even more cheerful and friendly toward me, especially the
    four most glorious among them.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: “Removed and put into the building” follows Hilgenfeld’s printed conjecture compared with Latin
      Vulgata. Reported Athos has a differently ordered “fitted into the building and” phrase; the other
      versions are uncertain in the apparatus. The hollows are around the tower where stones had lain,
      not an invented hole in the completed wall. Lime and crushed pottery are source materials, not a
      modern repair product.
  - marker: b
    reason: textual_variant
    text: “The work will soon be finished” follows the printed working choice compared with the versions.
      The corresponding Athos word is reported illegible, with a completion suggesting a related finishing
      verb. It is not a fully legible unanimous Greek reading.
  - marker: c
    reason: lexical_alternative
    text: 'Reconsideration of the prior lexical decision: “Lord,” rather than “master,” renders the independent
      title ὁ κύριος in accordance with the title policy. In this scene the title refers to the tower
      owner who may come to inspect it. “Sir” in paragraph 6 is a respectful address to the shepherd,
      while “the Lord” in the following adjuration remains a divine reference.'
  - marker: d
    reason: textual_variant
    text: The first “everything” translates a bracketed insertion by Harmer compared with the Latin traditions
      and Ethiopic; Athos is reported to omit it. “I must be occupied for a little while” translates the
      supplied working Greek, Μικρὸν ἔχω ἀκαιρεθῆναι, which specifies no location. The earlier draft note
      reported a different Athos form for this clause, but the supplied bounded evidence does not identify
      that form or provide the relevant apparatus entry. Its wording and English meaning therefore remain
      unestablished here; the selected working reading is retained pending clarification.
