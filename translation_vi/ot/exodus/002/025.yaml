  text: God saw the sons of Israel, and God knew.
translation:
  language: vi
  text: Đức Chúa Trời nhìn thấy con cái Y-sơ-ra-ên, và Đức Chúa Trời biết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: nhìn thấy
  rationale: Giữ nghĩa trực tiếp của động từ ראה và mạch song song ngắn gọn trong nguyên văn.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Thành ngữ chỉ dân Y-sơ-ra-ên; “con cái” vừa gần hình thức Hê-bơ-rơ vừa bao gồm toàn thể cộng đồng, không chỉ nam giới.
- source_word: וַיֵּדַע
  choice: biết
  rationale: Dịch trực tiếp ידע, giữ nguyên sự súc tích và độ mở của câu thay vì diễn giải thành “để ý”, “thấu hiểu” hay “nhớ đến”.
theological_decisions:
- issue: Hàm ý của việc Đức Chúa Trời “biết”
  choice: Giữ động từ đơn giản “biết”
  alternative: “để ý đến”, “thấu hiểu” hoặc “nhận biết hoàn cảnh của họ”
  rationale: Nguyên văn kết thúc đột ngột bằng אֱלֹהִים וַיֵּדַע, không nêu tân ngữ. Cách dịch này bảo tồn sự mơ hồ giàu ý nghĩa và tránh giải thích thay cho văn bản.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và cô đọng. Lặp lại “Đức Chúa Trời” theo nguyên văn để giữ nhịp và sự nhấn mạnh; không thêm tân ngữ cho “biết”.
