translation:
  text: Whoever rejoices in his heart[a] will be condemned; whoever hates idle talk has less to do with evil[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Other Greek texts read, “Whoever delights in wickedness will be condemned.”
    reason: textual_variant
  - marker: b
    text: Or, “is diminished by evil,” understanding evil as the cause of the loss rather than what is reduced.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ εὐφραινόμενος
  chosen: whoever rejoices
  alternatives:
  - the one who delights
  - whoever makes merry
  lexicon: LSJ
  rationale: The present middle/passive participle functions generically. 'Whoever rejoices' preserves the gnomic force without over-specifying the manner of joy. 'Makes merry' is possible but sounds more festive than the Greek requires.
- source_word: καρδίᾳ
  chosen: in heart
  alternatives:
  - in his heart
  - at heart
  lexicon: LSJ
  rationale: The dative is retained idiomatically as an inner disposition. 'In heart' is concise and avoids adding a masculine pronoun not present in the Greek.
- source_word: καταγνωσθήσεται
  chosen: will be found guilty
  alternatives:
  - will be condemned
  - will be reproved
  lexicon: LSJ
  rationale: The future passive of καταγινώσκω can mean to be condemned or judged guilty. 'Will be found guilty' makes the judicial nuance clear while remaining readable. 'Condemned' is possible but slightly stronger and more interpretive.
- source_word: ὁ μισῶν
  chosen: whoever hates
  alternatives:
  - the one who hates
  lexicon: LSJ
  rationale: Generic participle rendered with 'whoever' for smooth proverbial English.
- source_word: λαλιὰν
  chosen: chatter
  alternatives:
  - talkativeness
  - babbling
  - speech
  lexicon: LSJ
  rationale: λαλιά often denotes talk or manner of speaking; here in a wisdom context it likely has a negative sense of excessive or idle talk. 'Chatter' captures that nuance better than the more neutral 'speech'.
- source_word: ἐλαττονοῦται
  chosen: is diminished
  alternatives:
  - is reduced
  - comes to lack
  - is made less
  lexicon: LSJ
  rationale: The verb denotes being made less or reduced. 'Is diminished' preserves the passive sense and fits proverbial style.
- source_word: κακίᾳ
  chosen: by evil
  alternatives:
  - by wickedness
  - in evil
  - through malice
  lexicon: LSJ
  rationale: The dative is somewhat terse and may be instrumental or associative. 'By evil' keeps the Greek's compactness and leaves the exact nuance open. 'Malice' is too narrow for κακία here.
