theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Aspect of מָלָךְ in an enthronement psalm
  chosen_reading: present 'reigns'
  alternative_readings:
  - perfective 'has reigned'
  - ingressive 'has become king'
  rationale: The psalm proclaims YHWH's kingship as a present, ongoing reality. Using 'reigns' preserves the theological force of divine kingship without overcommitting to a punctiliar enthronement event.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
