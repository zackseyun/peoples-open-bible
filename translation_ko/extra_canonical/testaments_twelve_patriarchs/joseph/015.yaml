    2. “왜 스스로 노예라고 말했습니까? 보십시오, 우리는 당신이 가나안 땅의 큰 사람의 아들이며, 당신의 아버지가 아직도 베옷과 재 가운데서 당신을 위해 슬퍼하고 있다는 것을 알게 되었습니다.”


    3. 내가 이 말을 듣자 내 속이 찢어지고 내 마음이 녹아내렸으며, 나는 몹시 울고 싶었습니다. 그러나 나는 형제들에게 수치를 안기지 않으려고 스스로를 억눌렀습니다. 그리고 그들에게 말했습니다. “나는 알지 못합니다. 나는 종입니다.”


    4. 그러자 그들은 나를 팔기로 상의하여, 내가 그들의 손에 붙잡히지 않게 하였습니다.


    5. 그들은 내 아버지를 두려워했기 때문입니다. 그가 그들에게 와서 위험한 보복을 행하지 못하게 하려는 것이었습니다. 그들은 그가 하나님과 사람 앞에서 큰 사람이라는 말을 들었기 때문입니다.


    6. 그때 그 상인이 그들에게 말했습니다. “나를 보디발의 판결에서 풀어 주십시오.”


    7. 그래서 그들이 가까이 와서 나에게 청하며 말했습니다. “우리가 당신을 은으로 샀다고 말하십시오. 그러면 그가 우리를 풀어 줄 것입니다.”[a][b]'
