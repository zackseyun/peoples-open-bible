  from: Give us help against the adversary[a][b], for the salvation of man is vain.
  to: Give us help against the adversary[a], for deliverance by humans is futile.[b]
  rationale: 'The current “the salvation of man is vain” is unnecessarily literal and can wrongly suggest an abstract or doctrinal claim. “Futile” and “deliverance” suit the military context. However, “human deliverance” remains ambiguous in English: it can mean deliverance experienced by humans rather than deliverance supplied by them. “Deliverance by humans” explicitly conveys the construct’s contextual contrast between human and divine aid without adding a particular human agent. The proposed notes are otherwise accurate, with marker placement improved.'
