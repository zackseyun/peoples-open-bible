base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.”[a] A psalm of Asaph[b]. A song.'
  footnotes:
  - marker: a
    text: 'Or possibly a tune or musical direction: “Do not destroy.”'
    reason: cultural_note
  - marker: b
    text: The phrase “of Asaph” may indicate authorship, association, or membership in the Asaphite collection.
    reason: lexical_alternative
translation:
  language: ko
  text: 지휘자에게. “멸망시키지 마십시오.”[a] 아삽의 시[b]. 노래.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '이 표현은 곡명 또는 음악적 지시일 수 있습니다: “멸망시키지 마십시오.”'
    reason: cultural_note
  - marker: b
    text: “아삽의”라는 표현은 저자, 연관성, 또는 아삽 계열 전승 소속을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 찬양대 지휘자에게
  - 음악 책임자에게
  lexicon: HALOT
  rationale: 시편 표제의 לַמְנַצֵּחַ는 예배·연주를 맡은 책임자를 가리키므로, 한국어로는 기능을 살린 ‘지휘자에게’가 간결하고 자연스럽습니다.
- source_word: אַל תַּשְׁחֵת
  english_pob_choice: Do Not Destroy
  chosen_korean: “멸망시키지 마십시오.”
  alternatives_korean:
  - “파괴하지 마십시오.”
  - “망하게 하지 마십시오.”
  lexicon: HALOT
  rationale: 문맥상 본문 명제가 아니라 표제/곡명 성격이 강하므로 따옴표로 묶어 제목처럼 처리하고, שׁחת의 기본 의미를 살려 ‘멸망시키지 마십시오’로 옮겼습니다.
- source_word: מִזְמֹור
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 찬송시
  - 시편
  lexicon: HALOT
  rationale: מִזְמֹור는 장르 표지이므로 ‘시’로 옮겨 다음의 שׁיר와 중복되지 않게 했습니다.
- source_word: לְאָסָף
  english_pob_choice: of Asaph
  chosen_korean: 아삽의
  alternatives_korean:
  - 아삽에게
  - 아삽과 관련된
  lexicon: HALOT
  rationale: לְאָסָף는 저자·소속·전승 연관을 모두 열어 두는 표현이므로, 한국어에서도 과도하게 좁히지 않는 ‘아삽의’가 적절합니다.
- source_word: שִׁיר
  english_pob_choice: A song
  chosen_korean: 노래
  alternatives_korean:
  - 한 노래
  - 찬가
  lexicon: HALOT
  rationale: שׁיר은 두 번째 장르 표지이므로 독립된 표기로 살리되, 현대 한국어에서 자연스러운 ‘노래’로 옮겼습니다.
theological_decisions:
- issue: 표제구의 기능
  chosen_reading: ‘멸망시키지 마십시오’는 시의 본문 명령이 아니라 음악적/전승적 표제 또는 곡명으로 처리했습니다.
  alternative_readings:
  - 본문 일부로 읽어 ‘멸망시키지 마십시오’의 직접 명령으로 번역
  - 단순 주석 없이 일반 문장처럼 번역
  rationale: 영어 POB도 이 구를 곡명 또는 음악 지시로 보며 각주[a]를 달고 있으므로, 한국어 본문에서도 제목적 성격을 분명히 드러내는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 시편 표제와 예배 전승에 대한 문헌적 처리
