revisions:
- from: '1[a]. 희년 일곱째 주의 둘째 해에 리브가가 자기 아들 야곱을 불러 이르되

    2. 그에게 말하여 이르되 내 아들아 네 형 에서가 가나안 딸들 중에서 두 아내를 취하였음 같이 너는 가나안 딸들 중에서 아내를 택하지 말라 그들이 그 모든 더러운 행실로 내 마음을 괴롭게 하였느니라

    3. 그들의 모든 행위는 음행과 더러운 것이며 그들에게는 의로운 일이 없나니 그것이 악하기 때문이니라.

    4. 그러나 내 아들인 나는 너를 지극히 사랑하며, 내 마음과 애정이 낮이나 밤에 항상 너를 축복할 것이다.

    5. 그리고 이제 내 아들아, 내 말을 듣고 네 어머니의 뜻을 행하여 이 땅의 딸들 중에서 아내를 택하지 말고 오직 내 아버지의 집과 내 아버지의 친척 중에서 아내를 택하라. 내 아버지 집에서. 그리고 지극히 높으신 하나님이 네게 복을 주시리니 네 자녀가 의로운 자손이요 거룩한 자손이 되리라.”

    6. 야곱이 그 어머니 리브가에게 말하여 이르되 보라 나는 이제 아홉 주 된 아들이라 여자를 알지 못하며 가까이 한 적도 없고 가나안 사람의 딸들 중에서 아내를 택할 생각도 없노라

    7. 우리 조상 아브라함이 나에게 명하여 가나안 사람의 딸들에게서 아내를 취하지 말고 내 아버지 집의 자손 중에서 아내를 취하라고 명령하신 것을 내가 기억하노라.

    8. 그리고 내가 전에 당신의 형 라반에게 딸들이 태어났다는 소식을 들었습니다. 나는 그들 가운데서 아내를 취하고자 마음을 정했습니다.

    9. 그러므로 나는 내 영혼을 지켜서, 내 평생에 죄를 짓지 않고 모든 일에서 부패하지 않게 하려고 내 마음을 지켜 왔습니다. 내 아버지 아브라함이 음란과 음행 때문에 나에게 많은 명령을 하였기 때문입니다.

    10. 그리고 에서가 이십이년 동안 이 일로 나에게 재촉하며 나에게 말하면서 ''내 형제여, 내 두 아내의 누이 중에서 아내를 취하라''고 말하였지만 나는 여전히 그처럼 행하기를 즐겨하지 아니하였느니라.

    11. 나는 내 평생에 네 앞에 맹세한다. 나는 가나안 자손의 딸들 중에서 아내를 택하지 않을 것이며, 에서가 행한 것처럼 악을 행하지도 않을 것이다.

    12. 어머니, 두려워하지 마십시오. 내가 당신의 뜻을 행하고 정직하게 행할 것이며 내 길은 결코 부패하지 않을 것임을 확신해 주십시오.”

    13[c][d][e][f]. 그러자 그녀는 얼굴을 들었다.'
  to: '1. 그리고 이 희년의 이 주의 둘째 해에 리브가가 자기 아들 야곱을 불렀습니다.

    2. 그녀가 그에게 말했습니다. “내 아들아, 가나안의 딸들 가운데서 아내를 택하지 마십시오. 네 형 에서가 가나안의 딸들 가운데서 두 아내를 취하였고, 그 두 여자가 자기들의 온갖 부정한 행위로 내 영을 쓰라리게 하였습니다.”

    3. 그들의 모든 행위는 음행과 부정이며, 그들 가운데에는 의가 없습니다. 이는 악하기 때문입니다.

    4. 그러나 나는, 내 아들아, 너를 지극히 사랑합니다. 나의 마음과 나의 사랑은 모든 때에, 곧 낮에도 밤의 파수 시간들에도 너를 축복할 것입니다.

    5. 이제 내 아들아, 내 말을 들으십시오. 네 어머니의 뜻을 행하십시오. 이 땅의 딸들 가운데서 아내를 맞지 마십시오. 오히려 내 아버지의 집과 내 아버지의 친족 가운데서 네 아내를 맞으십시오. 지극히 높으신 하나님께서 너에게 복을 주실 것이며, 네 자녀는 의로운 자손과 거룩한 씨가 될 것입니다.

    6. 그때 야곱이 자기 어머니 리브가에게 말했습니다. “보십시오, 저는 이제 아홉 주간의 해를 산 사람입니다. 저는 여자를 알지 못했고, 어떤 여자에게도 손을 대지 않았으며, 약혼하지도 않았고, 가나안의 딸들 가운데서 아내를 맞이하려고도 하지 않습니다.”

    7. 나는 우리 조상 아브라함의 말씀을 기억합니다. 그는 나에게 가나안의 딸들 가운데서 아내를 맞이하지 말고, 내 아버지 집안의 후손과 내 친족 가운데서 아내를 맞이하라고 명령했기 때문입니다.

    8. 그리고 저는 이전에 당신의 형제 라반에게 딸들이 태어났다는 말을 들었고, 그들 가운데서 아내를 얻고자 그들에게 마음을 두었습니다.

    9. 그러므로 나는 내 모든 길에서 평생 동안 죄를 짓거나 더럽혀지지 않도록 내 영을 지켰습니다. 음란과 음행 때문에 내 아버지 아브라함이 내게 많은 명령을 내렸기 때문입니다.

    10. 그가 내게 명령한 이 모든 일에도 불구하고, 이십이 년 동안 에서는 나를 권하고 재촉하며 내게 말하여 이르기를 ‘내 형제여, 내 두 아내의 누이들 가운데서 아내를 하나 맞이하라’ 하였습니다. 그러나 나는 그가 한 것처럼 하기를 원하지 않았습니다.

    11. 저는 제 평생 동안 가나안의 자손의 딸들 가운데서 아내를 맞이하지 않고, 에서가 한 것처럼 악하게 행하지 않겠다고 당신 앞에서 맹세합니다.

    12. “어머니, 두려워하지 마십시오. 저를 믿으십시오. 제가 어머니의 뜻을 행하고 올바르게 살아가며, 제 길을 영원히 더럽히지 않겠습니다.”

    13. 그 뒤에 그녀는 얼굴을 들었습니다.'
