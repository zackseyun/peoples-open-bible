theological_decisions:
- issue: Rendering of demonic terminology
  chosen_reading: an unclean demon-spirit
  alternative_readings:
  - an unclean spirit of a demon
  - an unclean spirit
  rationale: The Greek explicitly includes both πνεῦμα and δαιμόνιον, with ἀκαθάρτου modifying δαιμονίου. The chosen rendering preserves the text's full demonic terminology rather than simplifying it. This avoids minimizing the supernatural dimension while also not adding doctrinal claims beyond the wording.
  doctrine_reference: Translation philosophy §§1, 3, 5
