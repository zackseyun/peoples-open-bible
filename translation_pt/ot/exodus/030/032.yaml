    issue: A segunda proibição fica sintaticamente imprecisa.
    rationale: O hebraico diz literalmente que não se deve fazer algo semelhante ao óleo conforme a sua composição. «Nem fareis outro igual, com a mesma composição» introduz «outro» sem nomear o referente e torna a relação da composição menos nítida.
