translation:
  text: Amizarak taught enchantments and the cutting of roots; Armaros, the undoing of spells; Baraqiel, the observation of
    the stars; Kokabiel, the signs; Tamiel taught the appearance of a star; and Asderel taught the course of the moon.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cutting of roots” probably refers to preparing roots for occult or medicinal practice; the Ge'ez itself retains
      the concrete expression.
    reason: cultural_note
  - marker: b
    text: Or “the loosening of enchantments.”
    reason: lexical_alternative
  - marker: c
    text: The selected printing has the singular star expression at this point. The name and adjoining wording have corruption/variant
      notes in the apparatus; no alternate Greek name or an expanded teaching is silently supplied.
    reason: textual_variant
  - marker: d
    text: The six named teachers follow this selected Ethiopic edition’s presented list; this is not a complete list harmonized
      from other textual traditions.
    reason: textual_variant
  - marker: e
    text: The printed apparatus records many variant or corrupt forms of these names. The spellings here are readable transliterations
      of the selected forms, not certified historical identities or independently collated manuscript names.
    reason: textual_variant
lexical_decisions:
- source_word: መሳብዕያነ
  chosen: enchantments
  alternatives:
  - enchanters
  - magical practices
  rationale: The form is connected with magical adjuration or enchantment. In this list of forbidden arts, an abstract practice
    is more coherent as the object of “taught” than a designation for practitioners, though the Ge'ez morphology permits uncertainty.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: መታርያነ፡ ሥርዋት
  chosen: the cutting of roots
  alternatives:
  - root-cutting
  - root-cutters
  rationale: This preserves both the cutting terminology and the concrete image of roots. In context it likely denotes occult
    or medicinal use of roots, but the translation does not add that interpretation to the main text.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ፈትሐ፡ ስብዐታተ
  chosen: the undoing of spells
  alternatives:
  - the loosening of enchantments
  - the resolving of enchantments
  rationale: ፈትሐ carries the sense of loosening, releasing, or undoing, while ስብዐታተ denotes enchantments or spells. “Undoing
    of spells” gives clear English while retaining the action represented in the source.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ራዓይያነ፡ ከዋክብት
  chosen: the observation of the stars
  alternatives:
  - observers of the stars
  - astrology
  rationale: The wording is literally associated with seeing or observing stars. “Astrology” would state the likely cultural
    sense but would compress the source's imagery and may overdefine the practice.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ትእምርታተ
  chosen: the signs
  alternatives:
  - signs
  - the constellations
  rationale: The term means signs or marks. Since this witness supplies no explicit object after it, the main text preserves
    the bare expression rather than supplying “of the stars” or interpreting it as constellations.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ርእየ፡ ከከብ
  chosen: the appearance of a star
  alternatives:
  - the sight of a star
  - the appearance of the stars
  - the observation of a star
  rationale: ርእየ is connected with seeing or appearance, and the OCR witness presents ከከብ as singular. The resulting phrase
    is somewhat difficult, so the translation stays close to the transmitted wording rather than silently conforming it to
    a familiar longer list.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ሩፀተ፡ ወርኅ
  chosen: the course of the moon
  alternatives:
  - the motion of the moon
  - the running of the moon
  rationale: The source pictures the moon's movement as running. “Course” is natural astronomical English that retains the
    idea of its ordered motion.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
theological_decisions:
- issue: Nature of the angelic instruction
  chosen_reading: The verse lists specialized arts taught by named figures without adding an explicit moral label within this
    verse.
  alternative_readings:
  - Explicitly describe every item as forbidden magic or corrupt knowledge
  rationale: The surrounding Watchers narrative presents this instruction negatively, but adding evaluative adjectives here
    would exceed the wording of the verse. Concrete magical and celestial terminology is retained so the narrative's own judgment
    can emerge from context.
  doctrine_reference: Preserve apocalyptic imagery and theological tension; do not paraphrase beyond the Ge'ez witness.
- issue: Relationship to longer textual forms of the Watchers' teaching list
  chosen_reading: Translate only the names and teachings present in the supplied Ge'ez witness.
  alternative_readings:
  - Expand or harmonize the verse with longer Greek, Aramaic, or traditional English forms of the list
  rationale: No checked Greek reading was supplied, and the base witness contains a shorter sequence. Importing additional
    angelic names or teachings would silently replace rather than translate this Ge'ez text.
  doctrine_reference: Original-language primacy; consequential witness differences must not be silently harmonized.
