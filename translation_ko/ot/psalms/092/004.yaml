  text: עֲֽלֵי עָ֭שׂוֹר וַ/עֲלֵי נָ֑בֶל עֲלֵ֖י הִגָּי֣וֹן בְּ/כִנּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/004.yaml
  text: For you have made me glad, O Yahweh, by your work; at the works of your hands I sing for joy.[a]
  footnotes:
  - marker: a
    text: The exact identification of the Hebrew stringed instruments is uncertain. נָבֶל may also be rendered 'lyre' or 'lute,' and כִּנּוֹר is sometimes rendered 'harp.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with meditation on the lyre.' The Hebrew הִגָּיוֹן can denote meditation, murmuring, or resonant musical sound; here the musical sense best fits the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와여, 주께서 하신 일로 나를 기쁘게 하셨으므로, 내가 주의 손으로 하신 일들을 기뻐 노래합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלֵי עָשׂוֹר
  english_pob_choice: on the ten-stringed instrument
  chosen_korean: 열줄짜리 악기로
  alternatives_korean:
  - 열 줄 현악기로
  - 열줄짜리 현악기로
  lexicon: HALOT
  rationale: עָשׂוֹר는 단순한 숫자보다 열 줄을 지닌 악기를 가리키므로, 의미를 살려 ‘열줄짜리 악기’로 옮겼습니다.
- source_word: וַעֲלֵי נָבֶל
  english_pob_choice: and on the harp
  chosen_korean: 수금으로
  alternatives_korean:
  - 하프로
  - 류트로
  lexicon: HALOT
  rationale: נָבֶל의 정확한 기종은 불확실하지만, 한국 교회 언어에서 가장 무난한 대응어인 ‘수금’을 택해 전통적 악기명을 보존했습니다.
- source_word: הִגָּיוֹן
  english_pob_choice: melody
  chosen_korean: 선율을
  alternatives_korean:
  - 묵상을
  - 울림을
  - 음향을
  lexicon: HALOT
  rationale: 문맥상 내적 묵상보다 음악적 울림이 더 자연스러우므로, POB의 ‘melody’에 맞추어 ‘선율’로 옮겼습니다.
- source_word: בְּכִנּוֹר
  english_pob_choice: on the lyre
  chosen_korean: 하프에 맞추어
  alternatives_korean:
  - 리라에
  - 수금에
  lexicon: HALOT
  rationale: כִּנּוֹר는 흔히 하프나 리라로 옮길 수 있으나, 앞의 נָבֶל과 구분을 살리면서 한국어로 가장 익숙한 현악기 이미지인 ‘하프’를 사용했습니다.
theological_decisions:
- issue: 시편 92:4의 마지막 구절에서 הִגָּיוֹן을 묵상인지 음악적 소리인지 어떻게 처리할지
  chosen_reading: 음악적 의미를 반영하여 ‘선율’로 처리했습니다.
  alternative_readings:
  - ‘묵상’으로 옮겨 내적 사유를 강조하는 읽기
  - ‘울림’으로 옮겨 소리의 성격을 강조하는 읽기
  rationale: 본문은 악기 목록과 병렬을 이루므로, 이 항목은 음악적 수행을 가리키는 것으로 읽는 것이 가장 설득력 있습니다.
  doctrine_reference: 시편 92:4의 시적·예배적 문맥
