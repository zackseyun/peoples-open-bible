  terminology: '''금고'' is acceptable for γαζοφυλάκιον as a treasury/store of funds, though it has a somewhat narrower modern sense of a secure cash box. ''급료'' is the standard Korean term for troops'' pay. No theological terminology is involved.'
  issues:
