review_pass:
  verdict: revise
  source_fidelity: 초안의 마지막 ‘불에 비유된 율법도 그렇게 하실 것입니다’는 라틴어에 없는 별도의 서술을 보충하여, 율법을 행위의 주체 또는 별도 행위로 오해하게 합니다. 라틴어에서는 et legem이 perdet의 등위 목적어이므로, 그와 율법 모두가 ‘멸하실’ 대상임을 드러내야 합니다. 또한 adsimilatae sunt/adsimilata est의 완료 수동 상태는 현재의 일반적 ‘비유됩니다’보다 ‘비유된’ 또는 ‘비유되어 있는’이 더 충실합니다.
  naturalness: 수정문은 절의 시작이 앞 문맥에 의존하는 단편적 구조를 유지하면서도, 한국어에서 ‘그들을 멸하시고 … 율법도 멸하실 것입니다’라는 병렬 목적어 관계를 자연스럽고 분명하게 나타냅니다. 합쇼체의 높임 표현도 유지했습니다.
  terminology: lex는 이 문맥과 전통적 성서 용례에 맞게 ‘율법’으로 유지했습니다. flamma/ignis는 각각 ‘불꽃’과 ‘불’로 옮겨 원문의 어휘적 구별을 보존했습니다.
  issues:
