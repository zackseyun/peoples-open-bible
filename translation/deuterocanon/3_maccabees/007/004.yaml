translation:
  text: They claimed that our kingdom would never be secure until this was done, because of these people's hostility toward the Gentiles.
  philosophy: dynamic
lexical_decisions:
- source_word: προφερόμενοι
  chosen: asserting
  alternatives:
  - claiming
  - putting forward
  - alleging
  lexicon: LSJ
  rationale: The participle introduces the content of the accusation or argument being advanced. 'Asserting' preserves the sense of publicly putting forward a claim without over-specifying tone.
- source_word: μηδέποτε
  chosen: never
  alternatives:
  - at no time
  - not ever
  lexicon: LSJ
  rationale: A straightforward adverb of absolute negation; 'never' is the most natural modern English equivalent.
- source_word: εὐσταθήσειν
  chosen: would ... be secure
  alternatives:
  - would stand firm
  - would be stable
  - would prosper
  lexicon: LSJ
  rationale: From εὐσταθέω/εὐσταθής language of stability or firmness. In context of political/social 'affairs,' 'be secure' communicates stable well-being more idiomatically than the wooden 'stand firm.'
- source_word: τὰ πράγματα ἡμῶν
  chosen: our affairs
  alternatives:
  - our matters
  - our situation
  - our state
  lexicon: LSJ
  rationale: πράγματα here refers broadly to the community's public condition or concerns, not merely isolated 'things.' 'Our affairs' fits the political-administrative context.
- source_word: διʼ ἣν ἔχουσιν οὗτοι πρὸς τὰ ἔθνη δυσμένειαν
  chosen: because of the hostility these people have toward the nations
  alternatives:
  - because of the ill will these men have toward the Gentiles
  - because of their enmity toward the peoples
  lexicon: LSJ
  rationale: δυσμένεια denotes hostility or ill will. τὰ ἔθνη in this Hellenistic Jewish context can mean 'the nations/Gentiles'; 'the nations' preserves the broader Greek sense while avoiding importing later technical nuance unless necessary.
- source_word: μέχρι ἂν συντελεσθῇ τοῦτο
  chosen: until this is accomplished
  alternatives:
  - until this is completed
  - until this comes to pass
  lexicon: LSJ
  rationale: συντελεσθῇ conveys completion or fulfillment. 'Accomplished' works naturally with the unspecified τοῦτο ('this') and preserves the forward-looking force.
