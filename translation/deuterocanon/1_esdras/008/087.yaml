lexical_decisions:
- source_word: ἰδοὺ
  chosen: Look
  alternatives:
  - Behold
  - See
  lexicon: BDAG
  rationale: Introduces the climactic confession with direct force. 'Look' is natural modern English while preserving the
    deictic emphasis better than a flat omission.
- source_word: ἐσμὲν ἐνώπιόν σου
  chosen: we are before you
  alternatives:
  - we stand before you
  - we are in your presence
  lexicon: BDAG
  rationale: A straightforward rendering of existence in God's presence. 'Before you' preserves the relational/judicial setting
    without overinterpreting the verb as 'stand' here, since στῆναι appears explicitly later in the verse.
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  chosen: in our lawless deeds
  alternatives:
  - in our iniquities
  - in our lawlessness
  - with our guilt upon us
  lexicon: BDAG
  rationale: ἀνομία denotes violation of law, so 'lawless deeds' keeps the concrete moral force. 'Iniquities' is traditional
    but less transparent for modern readers. The phrase expresses their condition as they come before God, not merely a location.
- source_word: οὐ γάρ ἐστιν
  chosen: for it is ... possible
  alternatives:
  - for there is not
  - for it is not
  lexicon: BDAG
  rationale: Idiomatic English requires supplying 'possible' with the infinitive construction that follows.
- source_word: στῆναι
  chosen: to stand
  alternatives:
  - to remain standing
  - to take one's stand
  lexicon: BDAG
  rationale: Retains the judicial/cultic image of being able to stand in God's presence under judgment.
- source_word: ἔτι
  chosen: no longer
  alternatives:
  - still
  - any longer
  lexicon: BDAG
  rationale: Conveys that, given their sins, continued standing before God is impossible. 'No longer' reads naturally with
    the infinitive clause.
- source_word: ἔμπροσθέν σου
  chosen: before you
  alternatives:
  - in front of you
  - in your presence
  lexicon: BDAG
  rationale: Matches the repeated Godward orientation and keeps the solemn courtroom-like sense.
- source_word: ἐπὶ τούτοις
  chosen: because of these things
  alternatives:
  - on account of these things
  - in view of these things
  - for this
  lexicon: BDAG
  rationale: The Greek expression is rendered 'because of these things' in this unit. The selected Greek, not an approximate
    cross-reference, controls the active rendering; any prior lexicon label is historical, not a new consultation.
theological_decisions:
- issue: Penitential confession
  chosen_reading: lawless deeds and inability to stand before God
  alternative_readings:
  - iniquities
  rationale: The Greek states the people's guilt and inability to stand before God; no additional destruction clause is supplied.
