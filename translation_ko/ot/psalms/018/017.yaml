  footnotes:
  - marker: a
    text: 또는 ‘건져 내십니다.’ 히브리어 미완료형은 시적 문맥에서 현재와 같은 의미로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח / מִמָּרוֹם
  english_pob_choice: sent from on high / reached down from on high
  chosen_korean: 높은 곳에서 손을 내미시며
  alternatives_korean:
  - 높은 곳에서 보내시며
  - 높은 곳에서 뻗으시며
  lexicon: HALOT
  rationale: 히브리어는 ‘보내다/뻗다’의 동작을 쓰지만, 구원 장면에서는 하나님의 구원 개입을 자연스럽게 드러내는 ‘손을 내미시다’가 원문의 위에서 아래로 향하는 이미지를 잘 살립니다.
- source_word: יִקָּחֵנִי
  english_pob_choice: he took me
  chosen_korean: 저를 붙드시고
  alternatives_korean:
  - 저를 데리시고
  - 저를 잡으시고
  lexicon: HALOT
  rationale: 단순한 ‘가져가다’보다 구출의 맥락에서는 ‘붙드시다’가 하나님의 적극적인 구원 행위를 더 분명히 전합니다.
- source_word: יַמְשֵׁנִי
  english_pob_choice: he drew me out
  chosen_korean: 많은 물에서 저를 끌어내셨습니다
  alternatives_korean:
  - 많은 물에서 저를 건져내셨습니다
  - 많은 물에서 저를 끌어올리셨습니다
  lexicon: HALOT
  rationale: 이 동사는 물에서 ‘끌어내다’는 뜻이 분명하므로, 직설적이면서도 현대 한국어에서 자연스러운 표현을 택했습니다.
- source_word: מִמַּיִם רַבִּים
  english_pob_choice: out of many waters
  chosen_korean: 많은 물
  alternatives_korean:
  - 큰 물
  - 많은 물들
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘많은 물’을 유지해 압도적 위험의 상징을 보존하고, 영어 POB의 주석처럼 문자적 표현 아래의 비유적 의미를 남겼습니다.
theological_decisions:
- issue: ‘from on high’의 초월적 이미지를 어디까지 풀어 쓸 것인가
  chosen_reading: ‘높은 곳에서’로 두어 하늘을 명시하지 않고 원문 이미지를 유지했습니다.
  alternative_readings:
  - 하늘에서
  - 천상에서
  rationale: 히브리어는 ‘높은 곳/높음’이지 직접적으로 ‘하늘’을 말하지 않으므로, 하나님의 초월성을 암시하되 원문보다 더 구체화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
