lexical_decisions:
- source_word: שָׁכַבְתִּי
  english_pob_choice: I lay down
  chosen_korean: 나는 누워서
  alternatives_korean:
  - 나는 누웠습니다
  - 나는 드러누웠습니다
  lexicon: HALOT
  rationale: 동사 שׁכב의 기본 의미는 ‘눕다/누워 있다’이며, 시의 동작 진행을 자연스럽게 살리기 위해 ‘누워서’로 옮겼습니다.
- source_word: וָאִישָׁנָה
  english_pob_choice: and slept
  chosen_korean: 잠들었고
  alternatives_korean:
  - 그리고 잤고
  - 잠잤고
  lexicon: HALOT
  rationale: ישׁן의 의미를 한국어의 자연스러운 관용 표현인 ‘잠들다’로 옮겨, 앞 구절과의 연속 동작을 살렸습니다.
- source_word: הֱקִיצוֹתִי
  english_pob_choice: I awoke
  chosen_korean: 깨어났습니다
  alternatives_korean:
  - 잠에서 깨어났습니다
  - 일어났습니다
  lexicon: HALOT
  rationale: קיץ의 핵심 의미는 ‘깨어나다’이므로, ‘일어나다’보다 원문의 감각을 더 직접적으로 반영하는 ‘깨어났습니다’를 택했습니다.
- source_word: יִסְמְכֵנִי
  english_pob_choice: sustains me
  chosen_korean: 붙드십니다
  alternatives_korean:
  - 지탱하십니다
  - 받쳐 주십니다
  - 지키십니다
  lexicon: HALOT
  rationale: סמך는 ‘붙들다/지탱하다/떠받치다’의 뜻을 가지며, 시편 문맥에서 하나님의 지속적 보호와 지지를 드러내는 한국어로 ‘붙드십니다’가 가장 간결하고 힘 있게 대응합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 고유명 יְהוָה를 직접 사용하므로, 관용적 호칭 ‘주님’ 대신 고유명 표기인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: 시편 3:6의 화자 시제와 종결형
  chosen_reading: 서술은 과거 사건을 말하지만 마지막 절은 현재적 진리로 마감하여 합쇼체 현재형 ‘붙드십니다’를 사용했습니다.
  alternative_readings:
  - 붙드셨습니다
  - 붙드십니다
  rationale: 히브리어 현재형 동사 יִסְמְכֵנִי는 지속적·습관적 지지의 뉘앙스를 띠므로, 한국어에서는 선언적 현재형이 시의 진술력을 더 잘 살립니다.
  doctrine_reference: 시편의 신뢰 고백과 하나님의 지속적 돌보심
