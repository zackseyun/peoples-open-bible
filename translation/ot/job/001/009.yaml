id: JOB.1.9
reference: Job 1:9
source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר הַֽ/חִנָּ֔ם יָרֵ֥א אִיּ֖וֹב אֱלֹהִֽים־׃
translation:
  text: Then the Adversary answered Yahweh, “Does Job fear God without reward[a]?”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “for nothing”; the same Hebrew word means “without cause” in Job 2:3.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  chosen: answered
  alternatives:
  - responded
  lexicon: HALOT
  rationale: The verb ענה in this narrative formula commonly means 'answer' or 'respond.' 'Answered' preserves the formal dialogue structure and matches the immediate speech context.
- source_word: הַשָּׂטָן
  chosen: the Adversary
  alternatives:
  - the Satan
  - the adversary
  lexicon: HALOT
  rationale: This retains the article and role designation consistently in the scene.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: וַיֹּאמַר
  chosen: and said
  alternatives:
  - and he said
  lexicon: HALOT
  rationale: Standard narrative wayyiqtol introducing direct speech. 'And said' is natural English and keeps the Hebrew sequence.
- source_word: הֲחִנָּם
  chosen: for nothing
  alternatives:
  - without cause
  - for no reason
  - for free
  lexicon: HALOT
  rationale: In this context the adverb questions whether Job's piety is disinterested. 'For nothing' is idiomatic English and preserves the ambiguity between 'without payment/benefit' and 'without cause.'
- source_word: יָרֵא
  chosen: fear
  alternatives:
  - revere
  lexicon: HALOT
  rationale: The verb ירא with God commonly denotes reverential fear. 'Fear' is the standard and weightier biblical term; 'revere' is interpretive and softens the lexical force.
- source_word: אֱלֹהִים
  chosen: God
  lexicon: HALOT
  rationale: Here אֱלֹהִים refers to the true God in direct discourse about Job's piety. 'God' is the straightforward equivalent.
- source_word: וַיַּעַן ... וַיֹּאמַר
  chosen: answered
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: One English speech verb naturally renders the Hebrew answer-and-say formula.
