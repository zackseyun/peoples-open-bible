  category: lexical
  tier: 1
  from: His soul will dwell in goodness[a][b], and his offspring will inherit the land.
  to: He will lodge in well-being[a], and his offspring will inherit the land[b].
  rationale: The proposal rightly removes unnatural “his soul” and improves “goodness” to the broader contextual sense of well-being. But “will spend the night” can misleadingly make a durable blessing sound merely one-night temporary. “Will lodge” preserves לון’s lodging image and natural poetic breadth without that false precision.
