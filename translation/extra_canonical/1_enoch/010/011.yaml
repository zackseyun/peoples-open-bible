    - in their impurity
    - with their defilement
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: The phrase intensifies the state of pollution associated with the illicit union. 'Uncleanness' preserves the
      ritual-moral texture better than the flatter 'impurity' in this context.
