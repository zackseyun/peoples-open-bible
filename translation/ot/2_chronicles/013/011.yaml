  to: The priests offer burnt offerings to Yahweh every morning and evening and burn fragrant incense. They arrange the bread on the ritually pure table[a], and every evening they light the lamps on the golden lampstand. For we are fulfilling the duties Yahweh our God has given us, but you have forsaken him.
