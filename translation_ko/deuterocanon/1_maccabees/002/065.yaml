    rationale: ‘내가 알기로는’은 화자의 직접적 확신인 ‘나는 안다’를 유보적 인식처럼 만듭니다.
  - severity: medium
    issue: ἀκούετε의 목적 표현
    rationale: ‘그에게서 들으십시오’보다 ‘그의 말을 들으십시오’가 ‘그에게 귀 기울이라’는 명령을 자연스럽고 정확하게 전달합니다.
  - severity: low
    issue: εἰς πατέρα의 비교적 약화
    rationale: ‘아버지와 같을 것입니다’는 원문의 ‘여러분에게 아버지가 될 것이다’를 비교 표현으로 약화하므로 역할적 의미는 문맥에 맡기고 직설 표현을 유지하는 편이 좋습니다.
