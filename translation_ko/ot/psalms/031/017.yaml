base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: O Yahweh, let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol[a].
  footnotes:
  - marker: a
    text: Or “let them go down silently to Sheol.” The Hebrew connects silence or stillness with Sheol, the realm of the dead.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼여, 제가 부끄러움을 당하지 않게 하소서. 제가 주를 부르짖었으니, 악인들은 수치를 당하게 하시고 스올[a]에서 잠잠하게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스올로 내려가 잠잠하게 하소서.’ 히브리어 동사는 ‘잠잠하다’ 또는 ‘고요해지다’를 뜻할 수 있습니다. ‘스올’은 반드시 ‘지옥’을 뜻하는 말이라기보다 죽은 자들의 영역을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִירָה פָנֶיךָ
  english_pob_choice: Make your face shine
  chosen_korean: 주의 얼굴을 ... 비추시고
  alternatives_korean:
  - 주의 얼굴이 ... 빛나게 하시고
  - 주의 얼굴을 ... 비치게 하시고
  lexicon: HALOT
  rationale: 히필 명령형의 요청을 한국어에서 자연스럽게 옮기기 위해 ‘비추시다’를 사용했습니다. ‘얼굴’ 이미지를 유지하면서도 하나님의 호의가 임하는 관용구의 힘을 살립니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 종들
  lexicon: HALOT
  rationale: 기도문에서 하나님께 직접 말하는 관계 표현이므로 ‘종’이 가장 자연스럽고, 이 절에서는 지배-소유의 뉘앙스를 전면화할 근거가 약합니다.
- source_word: הוֹשִׁיעֵנִי
  english_pob_choice: save me
  chosen_korean: 나를 구원하소서
  alternatives_korean:
  - 나를 구해 주소서
  - 나를 건지소서
  lexicon: HALOT
  rationale: ישׁע의 기본 의미를 살리면서 시편의 구원 호소를 가장 넓고도 문체상 품위 있게 전달하는 표현으로 ‘구원하다’를 택했습니다.
- source_word: בְחַסְדֶּךָ
  english_pob_choice: in your steadfast love
  chosen_korean: 주의 인애로
  alternatives_korean:
  - 주의 변함없는 사랑으로
  - 주의 언약적 사랑으로
  - 주의 은혜로
  lexicon: HALOT
  rationale: חסד의 핵심은 단순 감정보다 언약적 충실과 호의이므로, 한국어 성서 문맥에서 이를 압축적으로 드러내는 ‘인애’를 사용했습니다. ‘로’는 영어 POB의 ‘by/according to’ 가능성을 자연스럽게 포괄합니다.
theological_decisions:
- issue: חסד의 한국어 신학어 선택
  chosen_reading: 인애
  alternative_readings:
  - 은혜
  - 자비
  - 인자하심
  rationale: 이 절은 하나님의 언약적 신실함에 근거한 구원을 구하므로, 정서적 자비보다 관계적·언약적 뉘앙스를 가진 ‘인애’가 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 시편의 חסד 용례; 번역 일관성 원칙
