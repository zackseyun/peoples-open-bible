id: HERM.V.2.iii
reference: Shepherd of Hermas — Vision 2, section iii
unit: section
book: Shepherd of Hermas
source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Σὺ δέ, Ἑρμᾶ, μηκέτι μνησικακήσῃς τοῖς τέκνοις σου, μηδὲ τὴν ἀδελφήν σου ἐάσῃς, ἵνα καθαρισθῶσιν
    ἀπὸ τῶν προτέρων ἁμαρτιῶν αὐτῶν. παιδευθήσονται γὰρ παιδείᾳ δικαίᾳ, ἐὰν σὺ μὴ μνησικακήσῃς αὐτοῖς.
    μνησικακία θάνατον κατεργάζεται. σὺ δέ, Ἑρμᾶ, μεγάλας θλίψεις ἔσχες ἰδιωτικὰς διὰ τὰς παραβάσεις τοῦ
    οἴκου σου, ὅτι οὐκ ἐμέλησέ σοι περὶ αὐτῶν, ἀλλὰ παρενεθυμήθης καὶ ταῖς πραγματείαις σου συνανεφύρης
    ταῖς πονηραῖς. 2. ἀλλὰ σῴζει σε τὸ μὴ ἀποστήναι σε ἀπὸ Θεοῦ ζῶντος, καὶ ἡ ἁπλότης σου καὶ ἡ πολλὴ
    ἐγκράτεια· ταῦτα σέσωκέν σε, ἐὰν ἐμμένῃς, καὶ πάντας σῴζει τοὺς τὰ τοιαῦτα ἐργαζομένους καὶ πορευομένους
    ἐν ἀκακίᾳ καὶ ἁπλότητι. οὗτοι κατισχύουσιν πάσης πονηρίας καὶ παραμένουσιν εἰς ζωὴν αἰώνιον. 3. μακάριοι
    πάντες οἱ ἐργαζόμενοι τὴν δικαιοσύνην· οὐ διαφθαρήσονται ἕως αἰῶνος. 4. ἐρεῖς δὲ Μαξίμῳ· Ἰδοὺ θλίψις
    ἔρχεται, ἐάν σοι δοκῇ πάλιν ἀρνεῖσθαι. Ἐγγὺς Κύριος τοῖς ἐπιστρεφομένοις, ὡς γέγραπται ἐν τῷ Ἐλδὰδ
    καὶ Μωδὰτ, τοῖς προφητεύσασιν ἐν τῇ ἐρήμῳ τῷ λαῷ.
  language: Greek
  pages:
  - 318
  unit_id: V.2.iii
  label: Vision 2, section iii
  sequence: 7
translation:
  text: 'III.1. But you, Hermas, no longer bear a grudge against your children, nor give up on your sister[a],
    so that they may be cleansed from their former sins. For they will be disciplined with righteous discipline[b],
    if you do not bear a grudge against them. Resentment produces death[f]. But you, Hermas, have had
    great private tribulations[g] because of the transgressions of your household, because you did not
    take concern for them, but became preoccupied and were entangled with your business dealings—the wicked
    ones[h].


    III.2. But what saves you is that you did not depart from the living God, and your simplicity and
    great self-control. These have saved you, if you continue in them[i], and they save all who do such
    things and who walk in guilelessness and simplicity. These prevail over all wickedness and remain
    for eternal life[j].


    III.3. Blessed are all who practice righteousness; they will never be destroyed[k].


    III.4. And you shall say to Maximus: Behold, tribulation is coming, if it seems good to you to deny
    again[d]. The Lord is near to those who return[e], as it is written in Eldad and Modat[c], who prophesied
    to the people in the wilderness.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Give up on your sister preserves the selected leave/abandon language, with cleansing from former
      sins as the purpose. The source calls her sister here; no wife or new relationship explanation is
      added. Vulgata printed10 says do not let her be, and its apparatus distinguishes transmitted sinas
      from other forms; Palatina printed23 has do not dismiss your sister, and the Ethiopic edition’s
      Latin rendering printed116 has do not abandon your sister.
    reason: textual_variant
  - marker: b
    text: Disciplined with righteous discipline retains the repeated paideia word family for instruction
      and correction, and the following condition that Hermas not bear a grudge. Vulgata printed10 has
      doctrina iusta, with iusta explicitly an editorial emendation against reported ista. Palatina printed23
      has righteous correction. The Ethiopic edition’s Latin rendering printed116 has rebuke with the
      rebuke of justice.
    reason: textual_variant
  - marker: c
    text: The source presents Eldad and Modat as a written authority and names prophets addressing the
      people in the wilderness. The title is retained rather than substituting a different citation. Athos
      PlateII prints Eldad and Mōdad; Sinaiticus7.4 first has a stray letter before Eldad, removed by
      ca, and Ōdat corrected by S1 and ca to Mōdat. Vulgata printed11 has Heldad and Modad with spelling
      variants in its apparatus; Palatina printed23 has Heldat and Modat; the Ethiopic edition’s Latin
      rendering printed117 has Eldad and Mudad. No extra words of a lost work are reconstructed from this
      citation.
    reason: textual_variant
  - marker: d
    text: Deny again follows the selected ἀρνεῖσθαι. LH1891 physical318/printed302 explicitly marks this
      infinitive as Harmer’s conjecture, citing Latin/Ethiopic support, while reporting ἄρνησαι for S,
      A and Latin evidence. Sinaiticus7.4 transcribes arnesai with no correction, and Athos PlateII likewise
      prints arnesai; both are denial forms, not asking. Vulgata printed11 has iterum nega, deny again,
      whereas Palatina printed23 has iterum negare, to deny again, and the Ethiopic edition’s Latin rendering
      printed117 says if you again purpose to deny. No object such as faith or Lord is supplied in the
      selected clause. Vulgata names Magnus instead of Maximus here; its Ecce is an editorial emendation
      of reported forms.
    reason: textual_variant
  - marker: e
    text: Those who return renders epistrephomenois, with turn back or repent as contextual alternatives.
      The selected clause supplies no explicit object after return. Palatina printed23 adds ad ipsum,
      to him; Vulgata printed11 has convertentibus, those turning, and the Ethiopic edition’s Latin rendering
      printed117 has those doing repentance. These versional formulations are disclosed without imposing
      one wording on the Greek.
    reason: textual_variant
  - marker: f
    reason: textual_variant
    text: Resentment produces death preserves the selected moral cause without an added duration. Vulgata
      printed10 adds a contrasting sentence that forgetting wrongs cooperates in eternal life, which its
      apparatus explicitly says is absent from Greek. Palatina printed23 adds eternal to the death caused
      by remembered wrongs. The Ethiopic edition’s Latin rendering printed116 speaks instead of planning
      revenge and revenge producing death. Those expansions and formulations are not silently inserted
      into the working Greek.
  - marker: g
    reason: textual_variant
    text: Private tribulations follows the working idiōtikas. Sinaiticus7.1 first hand has that word,
      corrected by ca to biōtikas, pertaining to life or worldly affairs. Vulgata printed10 has worldly
      tribulations; Palatina printed23 has personal tribulations. The Ethiopic edition’s Latin rendering
      printed116 has many afflictions; its note proposes a different reading in the following difficult
      phrase, which is not counted as a preserved agreement.
  - marker: h
    reason: textual_variant
    text: The working text connects household neglect and diverted attention with entanglement in wicked
      business dealings. Sinaiticus7.1 first hand transcribes business dealings, but ca changes it to
      sins; this corrected reading is not a second manuscript. Athos PlateI and both Latin printed versions
      retain business language; the Ethiopic edition’s Latin rendering printed116 likewise has wicked
      business and explicit neglect. The working business wording is retained.
  - marker: i
    reason: textual_variant
    text: The selected source keeps both the perfect these have saved you and the condition if you continue,
      followed by saving all who do and walk in the stated ways. Sinaiticus7.2 first en is corrected by
      ca to ean, if; its following verb is transcribed sōzeis, you save, against working sōzei, saves.
      Athos and the printed Latin versions retain the continuation condition; the Ethiopic edition’s Latin
      rendering also has if you persevere. The perfect is not harmonized into a future or the condition
      omitted.
  - marker: j
    reason: textual_variant
    text: Remain for eternal life preserves the selected continuing/life formulation. Athos PlateII and
      both Latin versions retain it. Sinaiticus7.2 first-hand eternal adjective has one unreadable-character
      gap; S1 supplies the full aiōnion. That correction is not counted as fully preserved first-hand
      letters. The Ethiopic edition’s Latin rendering printed116 instead has they hope for eternal life,
      and has gentleness and much patience where the Greek names simplicity and self-control. This is
      mediated versional evidence, not direct Geʿez collation.
  - marker: k
    reason: textual_variant
    text: They will never be destroyed preserves the selected negative and duration. Sinaiticus7.3 retains
      the negative; ca corrects the verb spelling. Athos PlateII prints ou, not, inside square brackets,
      so that printed negative is not counted as an unbracketed preserved word. Vulgata printed11 has
      will not be consumed forever; Palatina printed23 has will not perish forever; the Ethiopic edition’s
      Latin rendering printed117 has will not die forever. No mechanism of destruction is supplied.
lexical_decisions:
- source_word: μνησικακήσῃς / μνησικακία
  chosen: bear a grudge / resentment
  alternatives:
  - remember wrongs
  - harbor resentment
  - spite
  lexicon: LSJ; Lampe (Patristic Greek Lexicon)
  rationale: μνησικακέω/μνησικακία denote the remembrance of wrongs and vindictive spirit. “Bear a grudge”
    and “resentment” convey concrete, relational spite more than abstract “malice.”
- source_word: ἐάσῃς (τὴν ἀδελφήν σου)
  chosen: give up on
  alternatives:
  - leave
  - allow
  - permit
  - neglect
  lexicon: LSJ
  rationale: ἐάω can mean leave/let go/allow. In context of pastoral care for kin, the sense is not mere
    permission but abandonment; “give up on” reflects not forsaking her so that they may be cleansed.
- source_word: καθαρισθῶσιν
  chosen: be cleansed
  alternatives:
  - be purified
  - be made clean
  lexicon: BDAG; LSJ
  rationale: Passive of καθαρίζω; ritual/moral cleansing is a common early Christian motif. “Be cleansed”
    maintains that texture.
- source_word: παιδευθήσονται… παιδείᾳ
  chosen: be disciplined… with righteous discipline
  alternatives:
  - be trained… with righteous instruction
  - be corrected… with just correction
  lexicon: BDAG; LSJ
  rationale: παιδεία is formative discipline (both instruction and correction). Retaining “discipline”
    preserves moral‑ascetic nuance in Hermas.
- source_word: θάνατον κατεργάζεται
  chosen: produces death
  alternatives:
  - brings about death
  - works out death
  lexicon: BDAG
  rationale: κατεργάζομαι = bring about, effect. “Produces” is clear and weighty without importing other
    Pauline phrasing.
- source_word: θλίψεις (ἰδιωτικὰς)
  chosen: tribulations (private)
  alternatives:
  - distresses
  - afflictions (personal)
  lexicon: BDAG; LSJ
  rationale: Private/personal renders the selected adjective without importing public trials; Sinaiticus
    ca has a different life/worldly adjective, disclosed in note g.
- source_word: παραβάσεις
  chosen: transgressions
  alternatives:
  - offenses
  - violations
  lexicon: BDAG
  rationale: παράβασις conveys breach of a standard. “Transgressions” carries the moral-legal force.
- source_word: τοῦ οἴκου σου
  chosen: your household
  alternatives:
  - your house
  - your family
  lexicon: BDAG; LSJ
  rationale: Here οἶκος denotes the family unit. “Household” is precise and idiomatic.
- source_word: οὐκ ἐμέλησέ σοι περὶ αὐτῶν
  chosen: you did not take concern for them
  alternatives:
  - you did not care about them
  - you were not concerned for them
  lexicon: BDAG (μέλει)
  rationale: μέλει + dat. expresses active concern. “Take concern” fits the pastoral exhortation.
- source_word: παρενεθυμήθης
  chosen: became preoccupied
  alternatives:
  - were careless
  - forgot them
  - turned your thoughts aside
  lexicon: LSJ; Lampe
  rationale: Rare verb likely indicates turning one’s attention aside. “Became preoccupied” fits the contrast
    with neglecting the household.
- source_word: ταῖς πραγματείαις σου… ταῖς πονηραῖς
  chosen: your business dealings—the wicked ones
  alternatives:
  - your (wicked) business affairs
  - your evil occupations
  lexicon: LSJ
  rationale: πραγματεία = business/occupation; πονηραῖς modifies it. Rendering keeps both the economic
    and moral coloring.
- source_word: συνανεφύρης
  chosen: were entangled with
  alternatives:
  - mixed yourself up with
  - became involved in
  lexicon: LSJ (συμφύρω, ἐμφύρω – to mix, entangle)
  rationale: Form is difficult; sense is mingling oneself with. “Entangled” conveys moral involvement
    without over‑specifying the exact compound.
- source_word: μὴ ἀποστήναι… ἀπὸ Θεοῦ ζῶντος
  chosen: did not depart from the living God
  alternatives:
  - did not fall away from the living God
  - did not withdraw from the living God
  lexicon: BDAG (ἀφίστημι)
  rationale: Aorist infinitive of ἀφίστημι in a causal construction. Retain “living God” as a fixed biblical
    title.
- source_word: ἁπλότης
  chosen: simplicity
  alternatives:
  - singleness (of heart)
  - sincerity
  lexicon: BDAG; LSJ
  rationale: In Hermas, ἁπλότης connotes unmixed, straightforward character. “Simplicity” preserves that
    ascetic ideal.
- source_word: ἐγκράτεια
  chosen: self-control
  alternatives:
  - temperance
  - self-discipline
  lexicon: BDAG
  rationale: Standard rendering that carries moral asceticism without archaism.
- source_word: ἐμμένῃς
  chosen: continue (in them)
  alternatives:
  - abide
  - persist
  lexicon: BDAG
  rationale: Idiomatic for persevering in virtues. The parenthetical clarifies the implicit object.
- source_word: πορευομένους ἐν ἀκακίᾳ καὶ ἁπλότητι
  chosen: walk… in guilelessness and simplicity
  alternatives:
  - conduct themselves… in innocence and simplicity
  - live… in harmlessness and simplicity
  lexicon: BDAG; LSJ
  rationale: πορεύομαι for conduct; ἀκακία emphasizes lack of guile. “Walk” preserves biblical cadence.
- source_word: κατισχύουσιν
  chosen: prevail over
  alternatives:
  - overcome
  - are strong against
  lexicon: BDAG; LSJ
  rationale: κατισχύω = to be strong against, to prevail. “Prevail over” keeps the active victory nuance.
- source_word: παραμένουσιν εἰς ζωὴν αἰώνιον
  chosen: remain for eternal life
  alternatives:
  - continue into eternal life
  - abide unto eternal life
  lexicon: BDAG
  rationale: παραμένω + εἰς conveys ongoing continuance toward the goal. Retain the prepositional force
    rather than paraphrasing.
- source_word: μακάριοι
  chosen: Blessed
  alternatives:
  - Happy
  lexicon: BDAG; LSJ
  rationale: Beatitude formula; “Blessed” preserves traditional solemnity.
- source_word: ἐργαζόμενοι τὴν δικαιοσύνην
  chosen: practice righteousness
  alternatives:
  - do righteousness
  - work righteousness
  lexicon: BDAG
  rationale: Ἐργάζομαι + abstract noun suggests ongoing practice; “practice righteousness” is idiomatic
    and concrete.
- source_word: οὐ διαφθαρήσονται
  chosen: they will never be destroyed
  alternatives:
  - they will not be corrupted
  - they will not perish
  lexicon: BDAG; LSJ
  rationale: διαφθείρω can mean corrupt/destroy. “Destroyed” fits the antithesis to prevailing over wickedness;
    “never” renders ἕως αἰῶνος idiomatically.
- source_word: ἐρεῖς
  chosen: you shall say / you will say
  alternatives:
  - say (future)
  lexicon: BDAG
  rationale: Future indicative as directive; English future with modal tone fits.
- source_word: θλίψις (2nd occurrence)
  chosen: tribulation
  alternatives:
  - distress
  - affliction
  lexicon: BDAG; LSJ
  rationale: Maintain consistency with earlier use; here it anticipates persecution/trial.
- source_word: ἐάν σοι δοκῇ
  chosen: if it seems good to you
  alternatives:
  - if you think it proper
  - if it seems right to you
  lexicon: BDAG; LSJ (δοκέω)
  rationale: Captures the ironic conditional challenge in the admonition.
- source_word: ἀρνεῖσθαι
  chosen: to deny
  alternatives:
  - to renounce
  - to disown
  lexicon: BDAG
  rationale: To deny follows the selected editorial infinitive; note d distinguishes the manuscript arnesai
    and the printed versional support. The object remains unstated.
- source_word: Ἐγγὺς Κύριος
  chosen: The Lord is near
  alternatives:
  - Near is the Lord
  lexicon: BDAG; LSJ
  rationale: Keep title “Lord” per project standards; fronting preserved in English by standard word order.
- source_word: τοῖς ἐπιστρεφομένοις
  chosen: to those who return
  alternatives:
  - to those who turn back
  - to those who repent
  lexicon: BDAG
  rationale: Preserve the concrete turning/returning expression here. Turn back or repent are contextual
    alternatives; no rule prevents epistrephō from expressing moral repentance. No explicit object is
    added to the selected clause.
- source_word: ὡς γέγραπται
  chosen: as it is written
  alternatives:
  - as it stands written
  lexicon: BDAG
  rationale: Citation formula introducing a known written source.
- source_word: ἐν τῷ Ἐλδὰδ καὶ Μωδὰτ
  chosen: in Eldad and Modat
  alternatives:
  - in Eldad and Medad
  lexicon: —
  rationale: Reflects the Greek form of the title of the cited work as in our source text; we retain it
    rather than harmonizing to Numbers’ spelling.
- source_word: τοῖς προφητεύσασιν ἐν τῇ ἐρήμῳ τῷ λαῷ
  chosen: who prophesied to the people in the wilderness
  alternatives:
  - who prophesied in the wilderness to the people
  lexicon: BDAG
  rationale: Keeps both the dative of advantage and the wilderness setting, echoing the tradition of Eldad
    and Modat.
