translation:
  language: en
  text: He alone is immortal. He lives in light that no one can approach. No human being has seen him or is able to see him. May he be honored, and may he rule forever.[a] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some understand this description and praise as referring more directly to the Lord Jesus the Messiah, though the words about being unseen most naturally point to God.
    reason: alternative_reading
simplification_decisions:
- pob_phrase: who alone has immortality
  simplified_phrase: He alone is immortal
  preserved_meaning: God uniquely and inherently possesses immortality.
  reasoning_layer_used: POB lexical decisions for μόνος and ἔχων ἀθανασίαν
  rationale: The direct statement is easier to understand while preserving God's unique immortality.
- pob_phrase: dwelling in unapproachable light
  simplified_phrase: He lives in light that no one can approach
  preserved_meaning: God dwells in light beyond human access.
  reasoning_layer_used: POB lexical decision for φῶς οἰκῶν ἀπρόσιτον
  rationale: The clause explains “unapproachable” while retaining the source image of light.
- pob_phrase: To him be honor and eternal dominion
  simplified_phrase: May he be honored, and may he rule forever
  preserved_meaning: The praise ascribes honor and everlasting ruling power to God.
  reasoning_layer_used: POB lexical decisions for τιμή and κράτος αἰώνιον
  rationale: The verbal form clearly expresses both honor and his eternal exercise of dominion.
translation_notes:
  risk_flags:
