lexical_decisions:
- source_word: עֹשֶׁר כְּבוֹד מַלְכוּתוֹ
  choice: utajiri wa utukufu wa ufalme wake
  rationale: Inahifadhi mfululizo wa nomino wa Kiebrania na maana ya mali nyingi pamoja na utukufu wa kifalme.
- source_word: יְקָר תִּפְאֶרֶת גְּדוּלָּתוֹ
  choice: fahari ya heshima ya ukuu wake
  rationale: Neno יְקָר linaelekezwa kwenye heshima au thamani, huku תִּפְאֶרֶת likitafsiriwa 'fahari'; mpangilio huu unaepuka kurudia 'utukufu' na kuhifadhi msisitizo wa lugha asilia.
- source_word: יָמִים רַבִּים שְׁמוֹנִים וּמְאַת יוֹם
  choice: kwa siku nyingi—siku mia moja na themanini
  rationale: Inahifadhi kwanza kauli ya jumla kisha idadi kamili, huku alama ya mkato ikionyesha ufafanuzi wa muda.
