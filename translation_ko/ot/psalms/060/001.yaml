  text: God, you have rejected us; you have breached us; you have been angry. Restore us.[a]
  footnotes:
  - marker: a
    text: Or, 'turn back to us.' The Hebrew can express either restoration of the people or God's return to them.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님, 주께서 우리를 버리시고 우리를 무너뜨리셨습니다. 주께서 진노하셨습니다. 우리를 회복시켜 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리에게 돌아와 주십시오.” 히브리어는 백성을 회복시키신다는 뜻으로도, 하나님께서 백성에게 다시 돌아오신다는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
