  meaning: Jacob contrasts Laban’s great increase under Yahweh’s blessing since his arrival with his own continuing need to provide for his household.
  meaning_decisions:
  - source_phrase: מְעַט אֲשֶׁר הָיָה לְךָ לְפָנַי וַיִּפְרֹץ לָרֹב
    prior_rendering: the little that you had before me has increased into abundance
    new_rendering: the little you had before I came has grown into abundance
    rationale: “Before me” is temporal here, referring to Laban’s holdings before Jacob arrived; the new wording makes that clear while retaining the marked growth into abundance.
  - source_phrase: לְרַגְלִי
    prior_rendering: at my coming
    new_rendering: since my arrival
    rationale: The idiom links Laban’s blessing with Jacob’s arrival and presence; the new wording expresses that naturally, while the note preserves the literal expression and the causal alternative.
  - source_phrase: וְעַתָּה מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
    prior_rendering: And now, when shall I also provide for my own household?
    new_rendering: But now, when will I also provide for my own household?
    rationale: '“But now” makes the understood contrast explicit: Jacob has benefited Laban’s household and now seeks provision for his own.'
