id: ISA.49.24
reference: Isaiah 49:24
source:
  edition: WLC
  text: הֲ/יֻקַּ֥ח מִ/גִּבּ֖וֹר מַלְק֑וֹחַ וְ/אִם שְׁבִ֥י צַדִּ֖יק יִמָּלֵֽט־׃
translation:
  text: Can plunder[a] be taken from a mighty man, or can the captives of a righteous one[b] be rescued?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'prey' instead of 'plunder.'
    reason: lexical_alternative
  - marker: b
    text: POB renders the difficult Masoretic phrase “captives of a righteous one.” The published Great Isaiah Scroll instead
      reads “captives of a ruthless one.” Its surrounding answer also changes the paired captivity nouns, so harmonization
      remains possible. The selected Greek speaks of taking someone captive unjustly; it does not establish that same Hebrew
      noun. Earlier Hebrew wording remains uncertain.
    reason: textual_variant
lexical_decisions:
- source_word: הֲיֻקַּח
  chosen: Can ... be taken
  alternatives:
  - Is ... taken
  - Can ... be seized
  lexicon: HALOT
  rationale: The interrogative particle with the passive/imperfect of לקח introduces a rhetorical question. 'Can ... be taken'
    gives natural English while preserving the modal force of the Hebrew question.
- source_word: מִגִּבּוֹר
  chosen: from a mighty man
  alternatives:
  - from a warrior
  - from a strong man
  lexicon: HALOT
  rationale: גִּבּוֹר commonly denotes a strong or mighty man, often a warrior. 'Mighty man' preserves the broad sense without
    over-specifying military imagery, though that nuance is present.
- source_word: מַלְקוֹחַ
  chosen: plunder
  alternatives:
  - prey
  - booty
  - what was taken
  lexicon: HALOT
  rationale: The noun refers to spoil or something seized. 'Plunder' is idiomatic in English and fits the parallel with captives.
    'Prey' is possible and traditional, but can sound more zoological in modern English.
- source_word: וְאִם
  chosen: or can
  alternatives:
  - or if
  - and if
  lexicon: HALOT
  rationale: In this rhetorical parallelism, וְאִם functions idiomatically to introduce the second question rather than a
    conditional clause. 'Or can' best reflects the sense in smooth English.
- source_word: שְׁבִי
  chosen: captives
  alternatives:
  - captivity
  - prisoners
  lexicon: HALOT
  rationale: Although the noun can denote captivity or captives, the context asks whether persons seized can be delivered.
    'Captives' best fits the parallelism and the following verb 'be rescued.'
- source_word: צַדִּיק
  chosen: a righteous one
  alternatives:
  - the righteous
  - a just one
  - a victorious one
  lexicon: HALOT
  rationale: The current WLC has צַדִּיק, righteous/just, rendered here as describing the captor. Legal entitlement and an
    innocent captive are competing interpretations requiring grammatical and contextual argument. The published Great Isaiah
    Scroll instead has עריץ; its linked question/answer wording also permits a harmonization explanation. The consulted Greek
    describes taking someone captive unjustly and does not uniquely establish either Hebrew noun. Retain the current main
    English provisionally, not because Masoretic wording must always take priority; earlier wording and the best interpretation
    remain unresolved.
- source_word: יִמָּלֵט
  chosen: be rescued
  alternatives:
  - escape
  - be delivered
  lexicon: HALOT
  rationale: The Niphal of מלט conveys escaping or being delivered. 'Be rescued' fits the passive sense and reads naturally
    in English in parallel with 'be taken.'
