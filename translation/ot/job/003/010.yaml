  from: because it did not shut the doors of my womb[b][a], nor hide trouble from my eyes.
  to: because it did not shut the doors of my mother’s womb[a] or hide trouble from my eyes.[b]
  rationale: Although the Hebrew idiom literally says “my womb,” it refers to the womb from which Job was born. In English, “my womb” ordinarily denotes Job’s own anatomical womb and therefore produces a false meaning. “My mother’s womb” is the smallest natural clarification. “Or hide” correctly carries forward the negation, and the replacement notes correctly align with their respective expressions.
