lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이기 때문입니다
  lexicon: WLC
  rationale: 시편의 이유 제시를 현대 한국어에서 가장 자연스럽게 풀어, 앞선 진술의 근거를 밝히는 기능을 살렸습니다.
- source_word: שֶׁמֶשׁ וּמָגֵן
  english_pob_choice: a sun and shield
  chosen_korean: 해요 방패
  alternatives_korean:
  - 해와 방패
  - 태양과 방패
  lexicon: HALOT
  rationale: 두 개의 비유를 그대로 유지하되, 예배적 문맥에서 자연스러운 ‘해’와 ‘방패’로 옮겼습니다.
- source_word: חֵן וְכָבוֹד
  english_pob_choice: favor and honor
  chosen_korean: 은혜와 영광
  alternatives_korean:
  - 은총과 존귀
  - 호의와 영광
  lexicon: HALOT
  rationale: חֵן은 이 시적 문맥에서 단순 호의보다 주시는 은혜의 뉘앙스가 강하므로 ‘은혜’로, כָבוֹד은 반복되는 성경적 대구를 살려 ‘영광’으로 옮겼습니다.
- source_word: לֹא יִמְנַע טוֹב
  english_pob_choice: He does not withhold good
  chosen_korean: 좋은 것을 아끼지 않으십니다
  alternatives_korean:
  - 좋은 것을 거두지 않으십니다
  - 좋은 것을 withholding하지 않으십니다
  lexicon: HALOT
  rationale: ‘withhold’의 의미를 자연스럽게 풀어, 하나님이 선한 것을 주저하지 않으신다는 뜻을 현대 한국어로 분명하게 전달했습니다.
- source_word: בְּתָמִים
  english_pob_choice: blamelessly
  chosen_korean: 정직하게
  alternatives_korean:
  - 온전하게
  - 흠 없이
  lexicon: HALOT
  rationale: 이 단어는 무죄무흠의 절대적 완전성보다 삶의 성실함과 바름을 가리키므로, 오해를 줄이기 위해 ‘정직하게’로 옮겼습니다.
theological_decisions:
- issue: 야훼 하나님의 이름과 호칭
  chosen_reading: ‘야훼 하나님’으로 직접 옮겨 언약 이름을 드러냈습니다.
  alternative_readings:
  - ‘주 하나님’
  - ‘여호와 하나님’
  rationale: 본문은 יְהוָה אֱלֹהִים을 직접 사용하므로, POB 기본 원칙에 따라 고유한 신적 이름을 보존했습니다.
  doctrine_reference: 'POB glossary: יְהוָה / YHWH → 야훼'
- issue: בְּתָמִים의 윤리적 강도
  chosen_reading: ‘정직하게’는 죄 없는 완전함이 아니라 성실하고 바른 삶을 뜻하도록 유지했습니다.
  alternative_readings:
  - ‘온전하게’
  - ‘흠 없이’
  rationale: 시편 문맥에서 하나님이 선을 주시는 대상은 윤리적 성실함으로 걷는 이들이며, 절대적 무결성을 주장하는 것으로 읽히지 않게 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
