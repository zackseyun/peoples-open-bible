id: PSA.128.4
reference: Psalms 128:4
source:
  edition: WLC
  text: הִנֵּ֣ה כִי כֵ֭ן יְבֹ֥רַךְ גָּ֗בֶר יְרֵ֣א יְהוָֽה־׃
translation:
  text: See, this is how the man who fears Yahweh will be blessed.
  philosophy: dynamic
lexical_decisions:
- source_word: הִנֵּה
  chosen: See
  alternatives:
  - Look
  - See
  lexicon: HALOT
  rationale: Natural modern attention marker.
- source_word: כִי כֵן
  chosen: thus
  alternatives:
  - indeed thus
  - surely thus
  - for thus
  lexicon: HALOT
  rationale: 'The combination reinforces the manner/result: ''indeed/for thus.'' In English poetry, ''thus'' captures the sense compactly without over-translating the particles.'
- source_word: יְבֹרַךְ
  chosen: will be blessed
  alternatives:
  - will ... be blessed
  - is blessed
  lexicon: HALOT
  rationale: Preserves the passive imperfect in natural English.
- source_word: גָּבֶר
  chosen: the man
  alternatives:
  - the person
  - the strong man
  - a man
  lexicon: HALOT
  rationale: גבר is grammatically masculine and here refers generically to the blessed individual described in the psalm. Per doctrine, gender-accurate rendering is preferred over gender-neutral flattening. The article in English helps present the class/proverbial sense.
- source_word: יְרֵא יְהוָה
  chosen: who fears Yahweh
  alternatives:
  - who reveres the LORD
  - fearing the LORD
  lexicon: HALOT
  rationale: The participial construction describes the defining characteristic of the man. 'Fears the LORD' preserves the covenantal and wisdom-language idiom more directly than the interpretive 'reveres.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Follows the project's default rendering for the divine name, preserving reverential convention and alignment with the doctrine table.
- source_word: כִּי כֵן
  chosen: this is how
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: It points to the preceding depiction as the manner of blessing.
