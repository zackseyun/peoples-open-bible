review_pass:
  verdict: revise
  source_fidelity: ‘성읍을 향해’는 לָעִיר의 표적 관계를 풀어낸 것이나, 한국어에서는 실제 방향 이동의 뉘앙스를 더할 수 있습니다. ‘성읍 뒤에 매복하십시오’가 성읍을 대상으로 한 매복과 그 위치를 충실하고 간결하게 전달합니다. 명령·금지·준비 지시는 모두 보존했습니다.
  naturalness: 인용문 안에서 ‘여러분’과 ‘너희’를 섞는 것은 현대 표준 한국어 합쇼체의 호칭 및 높임 일관성을 해칩니다. 또한 ‘매복하고 있어야 합니다’보다 직접 작전 지시인 ‘매복하십시오’가 자연스럽습니다.
  terminology: ‘성읍’, ‘매복’, ‘준비’는 문맥과 관습에 적절합니다. 집단 청중은 ‘여러분 모두’로 일관되게 지칭했습니다.
