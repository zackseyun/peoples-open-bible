  from: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
  to: So on the day of battle, not one of the men with Saul and Jonathan had a sword or spear; only Saul and his son Jonathan had them.
  rationale: Earlier work correctly understood the negation as applying to every accompanying soldier and the final clause as the exception. I preserve that emphasis while translating the possession idiom directly and dropping the redundant literal note.
