  to: 이스라엘 자손이 그 소식을 듣자, 모두 한마음으로 그들에게 달려들어 코바에 이를 때까지 그들을 계속 쳤습니다. 이와 같이 예루살렘에서 온 사람들과 온 산지에서 온 사람들도 도착했습니다. 그들이 적들의 진영에서 일어난 일을 보고받았기 때문입니다. 또 길르앗에 있는 사람들과 갈릴리에 있는 사람들은 큰 타격을 가하며 그들을 앞질러, 다마스쿠스와 그 경계를 지나갈 때까지 추격했습니다.[a][b][c]
  rationale: 그리스어 본문을 우선하여 지명 Χωβά를 ‘코바’로 바로잡았습니다. πληγῇ μεγάλῃ는 ‘큰 타격’으로 옮겨 원문의 폭력적 전투 문맥은 유지하되 ‘살육’이라는 해석적 특정은 각주로 옮겼습니다. ὑπερεκέρασαν은 ‘앞질러’로 번역하고 군사적 차단의 가능성을 각주에서 밝혔습니다. 마지막 ἕως οὗ παρῆλθον은 앞선 추격 행위의 범위로 자연스럽게 연결하여 문장을 명료하게 했습니다.
