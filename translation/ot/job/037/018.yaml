id: JOB.37.18
reference: Job 37:18
source:
  edition: WLC
  text: תַּרְקִ֣יעַ עִ֭מּ/וֹ לִ/שְׁחָקִ֑ים חֲ֝זָקִ֗ים כִּ/רְאִ֥י מוּצָֽק׃
translation:
  text: can you, with him, hammer out the skies, hard as a cast metal mirror?
  philosophy: dynamic
lexical_decisions:
- source_word: תַּרְקִיעַ
  chosen: hammer out
  alternatives:
  - beat out
  - hammer out
  - stretch out
  lexicon: HALOT
  rationale: Preserves the concrete beating-out image that the cast-metal mirror simile evokes.
- source_word: עִמּוֹ
  chosen: with him
  alternatives:
  - with God
  lexicon: HALOT
  rationale: The pronominal form is simply 'with him.' The referent in context is God, but the Hebrew uses the pronoun, so the translation preserves that wording rather than making the referent explicit in the main text.
- source_word: לִשְׁחָקִים
  chosen: the skies
  alternatives:
  - the clouds
  - the heavens
  - the sky
  lexicon: HALOT
  rationale: שׁחקים can denote skies/heavens and sometimes clouds. Here the comparison to a metal mirror suggests the visible sky-vault rather than localized clouds, so 'the skies' best captures the plural poetic sense in natural English.
- source_word: חֲזָקִים
  chosen: hard
  alternatives:
  - strong
  - firm
  lexicon: HALOT
  rationale: The adjective describes the solidity of the skies in the simile. 'Hard' fits the comparison to cast metal more idiomatically than 'strong' or 'firm' in English.
- source_word: כִּרְאִי
  chosen: as a ... mirror
  alternatives:
  - like a mirror
  - like a looking-glass
  lexicon: HALOT
  rationale: ראי denotes a mirror. The prefixed כ expresses comparison, rendered smoothly in English as 'as a ... mirror' within the phrase 'hard as a cast metal mirror.'
- source_word: מוּצָק
  chosen: cast metal
  alternatives:
  - molten metal
  - cast bronze
  lexicon: HALOT
  rationale: The passive participial form denotes something poured/cast, especially metal. 'Cast metal' preserves the metallurgical image without over-specifying bronze, which the Hebrew does not explicitly state.
