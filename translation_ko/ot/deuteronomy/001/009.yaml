  terminology: ‘감당하다’는 여기서 백성을 홀로 짊어지고 돌보는 부담을 나타내는 נָשָׂא에 적절합니다. 각주의 ‘짊어질 수 없습니다’도 유효한 어휘적 대안을 제공합니다.
