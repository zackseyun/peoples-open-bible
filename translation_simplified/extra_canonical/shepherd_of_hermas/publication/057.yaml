translation:
  text: 'I say to him, “Sir, explain this further.” “What do you want to know?” he asks. “Sir, are those
    who indulge and are deceived tormented for as long as they indulge and are deceived?” He tells me,
    “They are tormented for the same length of time.”


    2. “Their torment is not long enough, sir,” I say.[a] “People who indulge like this and forget God
    should be tormented seven times as much.”


    3. He says, “You are foolish. You do not understand the force of the torment.” “Sir,” I say, “if I
    understood, I would not ask you to explain it.” He says, “Hear the force of both indulgence and torment.”[c]


    4. “The time of indulgence and deceit is one hour. But an hour of torment has the force of thirty
    days. If someone indulges and is deceived for one day, and is tormented for one day, that day of torment
    amounts to a whole year.[b] They are tormented for as many years as the days they indulge. So you
    see that indulgence and deceit last a very short time. Punishment and torment last a long time.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The reported Lavra Greek wording replaces an older conjecture meaning “They are tormented very
      little.” This is an edition-mediated selection; punctuation is editorial. See the source-repair
      record.
  - marker: b
    reason: lexical_alternative
    text: The hours, days and years follow the source’s stated comparisons. Their ratios have not been
      recalculated or expanded into a universal timetable of punishment.
  - marker: c
    reason: textual_variant
    text: In the selected working Greek, “indulgence and torment” is shown in brackets as an editorial
      supplement. These words explain what “both” refers to.
