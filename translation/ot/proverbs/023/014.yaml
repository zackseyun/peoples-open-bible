  rationale: The verse speaks proverbially of preserving the child from a path leading to death or destruction. Rendering נַפְשׁוֹ as 'his life' preserves the idiomatic Hebrew sense in context and avoids forcing a specific doctrine of body-soul distinction from this proverb.
  doctrine_reference: Preserve theological tension rather than resolve it.
