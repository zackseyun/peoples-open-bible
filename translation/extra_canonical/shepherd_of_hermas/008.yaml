translation:
  text: 'IV.1. And it was revealed to me, brothers[a], while I was asleep[k], by a very handsome young
    man who said to me: “The old woman[c], from whom you received the little book—who do you suppose she
    is?” I said, “The Sibyl[b].” “You are mistaken,” he says; “she is not.” “Then who is she?” I say.
    “The Church,” he says. I said to him, “Why then an old woman?” “Because,” he says, “she was created
    first of all[g]; for this reason she is old, and for her sake the world was set in order[d].”


    IV.2. Afterward I saw a vision in my house. The old woman came and asked me whether I had already
    given the book to the elders. I denied having given it. “You have done well,” she says; “for I have
    words to add. When, therefore, I complete all the words[l], through you[m] they will be made known
    to all the elect.


    IV.3. “So you will write two little booklets, and you will send one to Clement[h] and one to Grapte[i].
    Then Clement will send it to the cities outside[e], for this has been entrusted to him; but Grapte
    will admonish the widows and the orphans. But you will read it aloud[f] in this city together with
    the elders[j] who preside over the church.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Brothers renders adelphoi, the source’s communal address. Brothers and sisters is an inclusive
      contextual alternative; the translation does not add an explicit list of audience members.
    reason: lexical_alternative
  - marker: b
    text: Sibyl is Hermas’s proposed identification of the old woman. The young man rejects it and identifies
      her as the Church; no particular Sibyl is identified here.
    reason: lexical_alternative
  - marker: c
    text: Old woman renders presbytera, which can also mean older or elder woman; elders later renders
      the related plural presbyteroi. Sinaiticus8.1 first hand lacks the exchange I said to him, Why then
      old? Because, he says; S1 adds that clause. Athos PlateII and both Latin printed versions have the
      old-age question and answer. The fuller exchange is retained with the corrector distinguished.
    reason: textual_variant
  - marker: d
    text: Was set in order renders katērtisthē; prepared, fashioned, established or formed are alternatives.
      Athos and Sinaiticus8.1 retain this verb. Vulgata printed11 and the Ethiopic edition’s Latin rendering
      printed117 say the world was made or created, while Palatina printed25 uses creation language. The
      selected Greek verb is distinguished from was created earlier in the sentence.
    reason: textual_variant
  - marker: e
    text: Cities outside translates the spatial phrase relative to this city later in the paragraph. The
      selected clause does not name that city or identify an empire-wide office. Vulgata printed12 has
      outside cities; Palatina printed29 has other cities. These expressions do not by themselves settle
      Clement’s identity.
    reason: lexical_alternative
  - marker: f
    text: Read it aloud expresses the reading in this city together with the elders. Read it is a less
      explicit alternative. The context supplies an audience, without specifying a later liturgy or procedure.
    reason: lexical_alternative
  - marker: g
    text: The source explicitly says that she, identified as the Church, was created first of all and
      that the world was set in order for her sake. Athos, Sinaiticus8.1 and the printed versions retain
      the first-created or before-all claim. The wording is kept without reducing it to a merely figurative
      antiquity or adding a mechanism of pre-existence.
    reason: textual_variant
  - marker: h
    text: The source names Clement, assigns him a booklet and sending to the outside cities, and says
      the task has been entrusted to him. It gives no further personal identification here. Sinaiticus8.3
      and Athos retain the two recipients and Clement’s commission. Vulgata printed12 also has Clement,
      Grapte and the commission. Palatina printed27–29 lacks the separate Grapte recipient and full commission
      clause; its editor’s suggestion of lost words or translator confusion is a hypothesis, not surviving
      missing text.
    reason: textual_variant
  - marker: i
    text: The selected Greek names Grapte as the second booklet recipient and says she will admonish widows
      and orphans. Sinaiticus8.3 first has Garptē, corrected by ca to Graptē. Athos PlateII prints the
      end of the admonish verb in brackets; those letters are not counted as unbracketed preserved evidence.
      Vulgata printed12 retains Grapte. Palatina printed27–29 and the Ethiopic edition’s Latin rendering
      printed117 do not separately name Grapte, though instruction of widows and orphans remains. No biography
      or office is supplied for her.
    reason: textual_variant
  - marker: j
    text: The source calls the book recipients in paragraph2 elders and closes paragraph3 with elders
      who preside over the church. Sinaiticus8.2–3, Athos and Vulgata retain the two contexts. Palatina
      printed29 has seniors and older members of the church rather than this same final presiding expression.
      The Ethiopic edition’s Latin rendering printed117 retains elders presiding over the church. This
      comparison is through a Latin rendering, not direct Geʿez or manuscript-photo collation.
    reason: textual_variant
  - marker: k
    text: While I was asleep follows the working Greek koimōmenō. Sinaiticus8.1 and both Latin printed
      versions retain sleeping; the Ethiopic edition’s Latin rendering printed117 also does. Athos PlateII’s
      diplomatic transcription has a question mark near moi and lacks this explicit participle in its
      printed main line. The selected sleeping detail remains; this is not fresh collation of original
      handwriting.
    reason: textual_variant
  - marker: l
    text: I complete keeps the old woman as the speaker completing all the words. Athos, Sinaiticus8.2
      and both Latin printed versions retain that first-person formulation. Sinaiticus first has epitelesō,
      corrected by S1 and ca to apotelesō. The Ethiopic edition’s Latin rendering printed117 instead addresses
      Hermas with when you finish all the words. The working speaker distinction is retained.
    reason: textual_variant
  - marker: m
    text: Through you keeps Hermas as the intermediary and all the elect as the audience. Athos and Sinaiticus8.2
      retain this formulation; Palatina printed27 also has per te. Vulgata printed12 prints per te as
      Angero’s conjecture against reported aperto in the codices, so that edited wording is not counted
      as preserved Latin agreement. The Ethiopic edition’s Latin rendering printed117 also describes Hermas
      disclosing the words, but is mediated versional evidence.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκαλύφθη
  chosen: was revealed
  alternatives:
  - was shown
  - was disclosed
  lexicon: BDAG
  rationale: Standard passive of apokalyptō in visionary contexts emphasizes divine revelation rather
    than mere showing.
- source_word: ἀδελφοί
  chosen: brothers
  alternatives:
  - brothers and sisters
  - brethren
  lexicon: BDAG
  rationale: Vocative address to the community; retained as “brothers” to preserve second-century idiom,
    with a note indicating inclusive reference.
- source_word: κοιμωμένῳ
  chosen: while I was asleep
  alternatives:
  - while I was sleeping
  - as I slept
  lexicon: BDAG
  rationale: Temporal participle; “asleep” concise and natural in English narrative.
- source_word: νεανίσκου εὐειδεστάτου
  chosen: a very handsome young man
  alternatives:
  - a most handsome youth
  - a very good-looking youth
  lexicon: LSJ
  rationale: Superlative εὐειδεστάτου rendered as “very handsome” to keep intensity while maintaining
    idiomatic English.
- source_word: πρεσβυτέρα
  chosen: old woman
  alternatives:
  - elder woman
  - aged woman
  lexicon: BDAG
  rationale: Descriptive of age; “old woman” avoids confusion with the office term πρεσβύτεροι (elders)
    later in the passage.
- source_word: βιβλίδιον
  chosen: little book
  alternatives:
  - booklet
  - little scroll
  lexicon: BDAG
  rationale: Diminutive; “little book” keeps concreteness without committing to scroll vs. codex form.
- source_word: Σίβυλλα
  chosen: Sibyl
  lexicon: LSJ
  rationale: Proper name for a famed pagan prophetess; transliterated.
- source_word: πλανᾶσαι
  chosen: you are mistaken
  alternatives:
  - you err
  - you are deceived
  lexicon: BDAG
  rationale: Idiomatic rebuke; maintains force without archaism.
- source_word: Ἐκκλησία
  chosen: the Church
  alternatives:
  - the assembly
  - the congregation
  lexicon: BDAG
  rationale: Second-century Christian usage denotes the Church; capitalized due to personification as
    a woman.
- source_word: ἐκτίσθη
  chosen: was created
  alternatives:
  - was made
  - came into being
  lexicon: BDAG
  rationale: Creation term; preserves theological weight of first-created claim.
- source_word: κατηρτίσθη
  chosen: was set in order
  alternatives:
  - was prepared
  - was fashioned
  - was established
  lexicon: BDAG
  rationale: Captures arranging/ordering nuance rather than mere making; suits the cosmic-order sense.
- source_word: ὅρασιν
  chosen: vision
  alternatives:
  - appearance
  - sight
  lexicon: BDAG
  rationale: Technical term for a visionary experience.
- source_word: πρεσβύτεροι
  chosen: elders
  alternatives:
  - presbyters
  - senior leaders
  lexicon: BDAG
  rationale: Technical term for church office; “elders” is standard and compact.
- source_word: ῥήματα
  chosen: words
  alternatives:
  - sayings
  - message
  lexicon: BDAG
  rationale: Plural rhema; concrete “words” keeps the serial, additive sense.
- source_word: ἀποτελέσω
  chosen: complete
  alternatives:
  - finish
  - bring to completion
  lexicon: BDAG
  rationale: Teleological nuance preserved succinctly with “complete.”
- source_word: γνωρισθήσεται
  chosen: they will be made known
  alternatives:
  - it will be disclosed
  - it will be made clear
  lexicon: BDAG
  rationale: The passive singular with the preceding words rendered in English plural preserves the completion
    and disclosure to all elect through Hermas.
- source_word: ἐκλεκτοῖς
  chosen: the elect
  alternatives:
  - the chosen
  - the chosen ones
  lexicon: BDAG
  rationale: Preserves technical theological term; concise and traditional without importing later doctrinal
    specificity.
- source_word: βιβλαρίδια
  chosen: little booklets
  alternatives:
  - little books
  - small scrolls
  lexicon: BDAG
  rationale: Diminutive plural; “booklets” naturally conveys small size.
- source_word: τὰς ἔξω πόλεις
  chosen: the cities outside
  alternatives:
  - outlying cities
  - cities abroad
  lexicon: BDAG
  rationale: The phrase is relative to this city in the selected paragraph; no city name or particular
    office is supplied here. Broader identification remains interpretation.
- source_word: ἐπιτέτραπται
  chosen: has been entrusted
  alternatives:
  - has been assigned
  - has been committed
  lexicon: BDAG
  rationale: Connotes responsibility given to Clement; “entrusted” fits ecclesial delegation.
- source_word: νουθετήσει
  chosen: will admonish
  alternatives:
  - will instruct
  - will warn
  lexicon: BDAG
  rationale: Paraenetic term with moral edge; stronger than mere instruction, fitting Hermas’s tone.
- source_word: ἀναγνωσῇ
  chosen: you will read it aloud
  alternatives:
  - you will read it
  lexicon: BDAG
  rationale: The selected scene puts the reading together with the elders; aloud makes that audience context
    explicit without specifying a later liturgy.
- source_word: προϊσταμένων
  chosen: who preside over
  alternatives:
  - who are set over
  - who lead
  lexicon: BDAG
  rationale: Presiding leadership nuance; maintains early church order language without modernization.
