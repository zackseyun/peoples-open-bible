  terminology: paradisi는 문맥상 ‘낙원’이 적절하며, 특정 교리적 의미를 덧붙이지 않습니다. fundamenta와 confirmarentur는 ‘기초가 세워지다’로 무리 없이 옮겨졌습니다.
