simplification_decisions:
- pob_phrase: Paul, an apostle of Messiah Jesus by the will of God
  simplified_phrase: From Paul, whom God appointed to be an apostle of Messiah Jesus
  preserved_meaning: Paul’s apostleship comes from God’s will and authorization.
  reasoning_layer_used: POB lexical rationale for διὰ θελήματος θεοῦ and the commissioning formula
  rationale: The active wording makes God’s authorization clear without weakening the title “apostle.”
- pob_phrase: according to the promise
  simplified_phrase: in keeping with the promise
  preserved_meaning: Paul’s apostleship corresponds to the promise rather than causing it.
  reasoning_layer_used: POB lexical decision for κατ’ ἐπαγγελίαν
  rationale: “In keeping with” expresses correspondence in more familiar English.
- pob_phrase: the life that is in Messiah Jesus
  simplified_phrase: the life found in union with Messiah Jesus
  preserved_meaning: The promised life is found through a relationship of union with Messiah Jesus.
  reasoning_layer_used: POB lexical rationale for τῆς ἐν Χριστῷ Ἰησοῦ
  rationale: “Found in union with” explains the relational force of “in” for a new reader.
interpretive_expansions:
