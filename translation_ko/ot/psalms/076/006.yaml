  yaml_path: translation/ot/psalms/076/006.yaml
  text: At your rebuke[a], O God of Jacob[b], both chariot and horse were cast into a deep sleep.
  footnotes:
  - marker: a
    text: Or 'From your rebuke' or 'Because of your rebuke.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'chariot and horse,' a poetic way of referring to military force; some understand the image as extending to their riders as well.
    reason: cultural_note
translation:
  language: ko
  text: 야곱의 하나님이여, 주의 꾸짖으심에[a] 병거와 말이[b] 깊은 잠에 빠졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 꾸짖으심으로’ 또는 ‘주의 꾸짖으심 때문에’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘병거와 말’이라고 합니다. 이는 군사력을 가리키는 시적 표현이며, 일부는 이 이미지가 병거를 모는 이들과 기병들에게도 미친다고 봅니다.
    reason: cultural_note
