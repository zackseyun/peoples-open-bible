translation:
  text: Anna ran to her son and threw her arms around his neck. She said to him, “I have seen you again, my child.
  philosophy: dynamic
lexical_decisions:
- source_word: προσδραμοῦσα
  lemma: προστρέχω
  chosen: ran up
  alternatives:
  - ran to him
  - hurried up
  lexicon: LSJ
  rationale: The participle from προστρέχω conveys running toward someone. 'Ran up' is natural modern English and preserves the vivid movement better than the flatter 'came' or the slightly interpretive 'hurried up'.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον
  chosen: fell on the neck
  alternatives:
  - threw herself on the neck
  - embraced around the neck
  lexicon: LSJ
  rationale: This is a conventional idiom for an emotional embrace. 'Fell on the neck' keeps the source imagery closely; the more idiomatic English sense is clear in context. 'Threw herself on the neck' is possible but adds reflexive force not explicit in the Greek.
- source_word: τὸν τράχηλον
  chosen: the neck
  alternatives:
  - his neck
  lexicon: LSJ
  rationale: The Greek has the article with a genitive modifier ('the neck of her son'). Rendering it literally preserves the concrete image. English readers will understand the possessive relation from the following phrase.
- source_word: τοῦ υἱοῦ αὐτῆς
  chosen: of her son
  alternatives:
  - her son's
  - of her child
  lexicon: LSJ
  rationale: υἱός specifically means 'son,' not the more general 'child.' Retaining 'son' preserves the familial specificity of the Greek.
- source_word: Εἶδόν σε
  chosen: I have seen you
  alternatives:
  - I have found you
  - I have looked upon you
  - I see you
  lexicon: LSJ
  rationale: The aorist of ὁράω here naturally expresses the fulfilled joy of seeing him again. 'I have seen you' captures the completed event with present emotional force. 'I see you' underplays the reunion nuance; 'I have found you' is too interpretive.
- source_word: παιδίον
  chosen: child
  alternatives:
  - my child
  - dear child
  - little one
  lexicon: LSJ
  rationale: παιδίον is an affectionate diminutive meaning 'child.' 'Child' preserves the tenderness without adding possessive or emotional wording not explicit in the Greek. Although the son is grown, the maternal address justifies the affectionate term.
