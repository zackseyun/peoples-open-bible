lexical_decisions:
- source_word: לְךָ
  english_pob_choice: Yours is
  chosen_korean: 주님의 것은
  alternatives_korean:
  - 주님께 있습니다
  - 주님에게 속해 있습니다
  lexicon: HALOT
  rationale: 전치사 לְ + 대명사 접미사는 소유·귀속을 나타내므로, 시적 어순에서 문두의 소유 강조를 살리기 위해 ‘주님의 것은’으로 옮겼습니다.
- source_word: זְרוֹעַ עִם גְּבוּרָה
  english_pob_choice: arm with might
  chosen_korean: 힘 있는 팔
  alternatives_korean:
  - 능력 있는 팔
  - 권능의 팔
  lexicon: HALOT
  rationale: 직역하면 ‘팔’이지만, 한국어에서는 ‘팔 + with might’의 결합을 자연스럽게 살리기 위해 ‘힘 있는 팔’로 옮겨 이미지와 수식 관계를 유지했습니다.
- source_word: תָּעֹז / יָדְךָ
  english_pob_choice: your hand is strong
  chosen_korean: 주님의 손은 강합니다
  alternatives_korean:
  - 주님의 손이 힘이 있습니다
  - 주님의 손은 힘이 셉니다
  lexicon: HALOT
  rationale: 동사적 강세를 한국어에서는 서술 형용사 ‘강하다’로 자연스럽게 구현하여, 손을 하나님의 활동적 권능의 상징으로 보존했습니다.
- source_word: תָּרוּם יְמִינֶךָ
  english_pob_choice: your right hand is exalted
  chosen_korean: 주님의 오른손은 높이 들려 있습니다
  alternatives_korean:
  - 주님의 오른손은 높습니다
  - 주님의 오른손은 높이 올려져 있습니다
  lexicon: HALOT
  rationale: רום의 ‘높아지다/높이 들리다’는 의미를 살리되, 단순한 위치보다 영화와 승귀의 뉘앙스를 드러내기 위해 ‘높이 들려 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 몸짓적 의인화 표현
  chosen_reading: ‘팔’, ‘손’, ‘오른손’을 추상화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 권능
  - 능력
  - 힘
  rationale: 시편의 시적 의인화가 하나님의 능동적 구원 행위를 생생하게 드러내므로, 본문 이미지를 약화시키는 추상어로 바꾸지 않았습니다.
  doctrine_reference: Translation philosophy §1, §6
