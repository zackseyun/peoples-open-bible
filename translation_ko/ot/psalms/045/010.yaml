  to: 딸아, 들으십시오[a]. 그리고 보십시오. 귀를 기울이시고, 당신의 백성과 아버지의 집을 잊으십시오.
  rationale: 제시된 WLC 본문에 따라 네 개의 여성 단수 명령형을 순서대로 옮겼습니다. 직접 호칭 ‘딸아’는 בַת의 호격 기능을 드러내고, ‘귀를 기울이시고’는 히브리어 관용 표현의 심상을 보존합니다. 이전 절에서 유래한 왕궁·오빌 관련 문구와 각주는 모두 제거했습니다.
