  - source_phrase: מִמְּרֹרָתוֹ
    prior_rendering: out of his gall
    new_rendering: from his gallbladder
    rationale: The bodily context most naturally indicates the organ containing gall; naming it makes the deep internal wound intelligible, while the note preserves the literal wording and its uncertainty.
