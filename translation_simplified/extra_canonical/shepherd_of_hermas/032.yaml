  text: 'I.1. “Be long-suffering[e] and sensible,” he says, “and you will gain mastery over every wicked
    deed and do every work of righteousness.”


    I.2. “For if you are long-suffering, the holy spirit dwelling in you will be pure, not clouded by
    another evil spirit. Instead, dwelling in a wide space, it will exult and rejoice with the vessel
    in which it dwells, and will minister to God with much cheerfulness, having vitality within itself.”


    I.3. “But if a quick temper comes on, at once the holy spirit, being tender, is cramped, without a
    clean place, and seeks to withdraw from that place. For it is choked by the evil spirit, without room
    to minister to the Lord as it desires, being defiled by quick temper. For the Lord dwells in long-suffering,
    but the devil in quick temper.”


    I.4. “So when both spirits dwell together, it is unprofitable and harmful to the person in whom they
    dwell.”


    I.5. “For if you take a little wormwood and pour it into a jar of honey, is not all the honey spoiled?
    So much honey is ruined by the smallest amount of wormwood, which destroys the honey’s sweetness.
    It no longer has the same favor with its master, because it has become bitter and lost its usefulness.
    But if the wormwood is not put into the honey, the honey is found sweet and becomes useful to its
    master.”[e]


    I.6. “You see, then, that long-suffering is sweeter than honey and useful to the Lord, and he dwells
    in it. But quick temper is bitter and useless. So if quick temper is mixed with long-suffering, long-suffering
    is defiled, and that person’s prayer is not useful to God.”[a]


    I.7. “Sir,” I say, “I wanted to know how quick temper works, so that I may guard against it.” “Indeed,”
    he says, “if you and your household do not guard against it, you have lost all your hope. But guard
    against it, for I am with you. Everyone who repents with their whole heart will also keep away from
    it, for I will be with them and will protect them; for they have all been justified by the most revered
    angel.”[b][c]


    II.1. “Now hear,” he says, “how quick temper works, how evil it is, how it overthrows God’s servants
    by its own activity, and how it leads them astray from righteousness. But it does not lead astray
    those who are full in faith, nor can it act upon them, because the Lord’s power is with them. It leads
    astray those who are empty and double-minded.”[d]


    II.2. “For when it sees such people standing firm, it inserts itself into a person’s heart. Out of
    nothing, the man or woman becomes bitter over everyday matters: food, some petty matter, a friend,
    giving or receiving, or foolish matters like these. For all these things are foolish, empty, senseless
    and unprofitable for God’s servants.”[f]


    II.3. “But long-suffering is great and strong, possessing mighty and vigorous power, flourishing in
    a wide space, cheerfully rejoicing, free from care, glorifying the Lord at all times. It has nothing
    bitter within itself, but always remains gentle and quiet. This long-suffering dwells with those whose
    faith is complete.”


    II.4. “But quick temper is first foolish, flighty and senseless. Then from senselessness comes bitterness,
    from bitterness anger, from anger wrath, and from wrath rage. Then rage, composed of so many evils,
    becomes a great and incurable sin.”


    II.5. “For when all these spirits dwell in one vessel, where the holy spirit also dwells, that vessel
    cannot contain them, but overflows.”


    II.6. “So the tender spirit, unaccustomed to dwelling with an evil spirit or with hardness, withdraws
    from such a person and seeks to dwell with gentleness and quiet.”


    II.7. “Then, when it departs from the person in whom it dwells, that person becomes empty of the righteous
    spirit. Afterward, filled with evil spirits, they are unstable in every deed, dragged here and there
    by the evil spirits, and are altogether blinded in their good understanding. This is what happens
    to all who are quick-tempered.”[g]


    II.8. “So keep away from quick temper, that most wicked spirit. Clothe yourself with long-suffering,
    and stand against quick temper and bitterness, and you will be found with the dignity beloved by the
    Lord. See, then, that you never forget this command. For if you master this command, you will also
    be able to keep the other commands I am going to give you. Be strong in them and be empowered, and
    let everyone who wishes to walk in them be empowered.”[h]'
