    changes_summary: 'Recast the opening to reflect that the trial was theirs because of Paul''s bodily condition, not ''my bodily trial.'' Added ''me'' after ''treat'' to account for the implied object, and changed ''Messiah Jesus'' to ''Christ Jesus'' for more natural formal register and consistency with common NT rendering. [Regression fix applied: Messiah restored (revision_pass had changed Χριστός → Christ against DOCTRINE.md policy)]'
translation:
  language: en
  text: Even though my physical condition was hard for you to bear,[a] you did not look down on me or reject me in disgust.[b] Instead, you welcomed me as you would welcome an angel of God, as you would welcome Christ Jesus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “your trial in my body”; the Greek phrase is difficult and can be understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: Literally “spit out,” a vivid expression of disgust and rejection.
    reason: lexical_alternative
  - marker: c
    text: Greek “Jesus the Messiah”; “Messiah” is used because the word functions here as a title.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: my bodily condition was a trial to you
  simplified_phrase: my physical condition was hard for you to bear
  preserved_meaning: Paul’s physical condition created a difficult situation for the Galatians.
  reasoning_layer_used: Lexical decisions for πειρασμός and σάρξ, with the alternate syntax retained in footnote a.
  rationale: This states the burden in direct, common English.
- pob_phrase: you did not treat me with contempt or disgust
  simplified_phrase: you did not look down on me or reject me in disgust
  preserved_meaning: They neither despised Paul nor recoiled from and rejected him.
  reasoning_layer_used: Lexical decisions for ἐξουθενέω and ἐκπτύω.
  rationale: This clearly distinguishes contempt from disgusted rejection.
- pob_phrase: you welcomed me as an angel of God, as Messiah Jesus
  simplified_phrase: you welcomed me as you would welcome an angel of God, as you would welcome Messiah Jesus
  preserved_meaning: They welcomed Paul with extraordinary honor according to two distinct comparisons.
  reasoning_layer_used: The source’s parallel ὡς phrases and the theological decision on manner of reception.
  rationale: Repeating the implied action preserves both comparisons and avoids identifying Jesus as an angel.
interpretive_expansions:
- pob_phrase: as an angel of God, as Messiah Jesus
  rendering: as you would welcome an angel of God, as you would welcome Messiah Jesus
  claim: Both comparisons describe how the Galatians welcomed Paul, not Paul’s identity.
  evidence:
  - Both Greek ὡς phrases modify the act of welcoming Paul.
  - The POB theological decision treats them as manner-of-reception comparisons.
  confidence: high
  alternatives_preserved:
  - The second comparison may rhetorically heighten the first.
translation_notes:
  risk_flags:
  - risk: “Hard for you to bear” makes the difficult Greek phrase somewhat more explicit.
    mitigation: Footnote a preserves the alternate syntax and acknowledges the ambiguity.
  - risk: Repeating “as you would welcome” supplies an implied action.
    mitigation: The parallel wording preserves the two source comparisons without adding a new claim.
