  from: For your steadfast love is great to the heavens[a], and your faithfulness to the clouds.
  to: For your steadfast love is great as far as the heavens, and your faithfulness[a] as far as the clouds.
  rationale: The repeated עַד marks extent in both cola. The current "great to the heavens" is materially unnatural English. "As far as" preserves the spatial measure and Hebrew ellipsis without adding an interpretive verb such as "reaches." The narrowed note honestly identifies the principal lexical alternative for אֱמֶת; the previous note's full-verse alternative, including "Because," was not needed.
