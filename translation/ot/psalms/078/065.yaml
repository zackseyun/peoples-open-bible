id: PSA.78.65
reference: Psalms 78:65
source:
  edition: WLC
  text: וַ/יִּקַ֖ץ כְּ/יָשֵׁ֥ן אֲדֹנָ֑/י כְּ֝/גִבּ֗וֹר מִתְרוֹנֵ֥ן מִ/יָּֽיִן׀׃
translation:
  text: Then the Lord awoke like one who had been sleeping, like a warrior shouting, stirred by wine.
  philosophy: dynamic
lexical_decisions:
- source_word: וַיִּקַץ
  chosen: awoke
  alternatives:
  - roused himself
  - woke up
  lexicon: HALOT
  rationale: The verb from יקץ means to awake or rouse from sleep. 'Awoke' is natural English and preserves the simile without over-paraphrasing.
- source_word: כְּיָשֵׁן
  chosen: like one who had been sleeping
  alternatives:
  - like one sleeping
  - like a sleeper
  lexicon: HALOT
  rationale: The simile is to a sleeping person awakening, rather than simply to awakening from sleep.
- source_word: אֲדֹנָי
  chosen: the Lord
  alternatives:
  - Lord
  lexicon: HALOT
  rationale: This divine title is best rendered 'the Lord' in English here. It is not the Tetragrammaton, so 'the LORD' would be inappropriate.
- source_word: כגבור
  chosen: like a warrior
  alternatives:
  - like a mighty man
  - like a champion
  lexicon: HALOT
  rationale: גבור denotes a strong warrior or mighty man. 'Warrior' is idiomatic, vivid, and fits the martial imagery of the verse.
- source_word: מתרונן
  chosen: shouting
  alternatives:
  - crying out
  - exulting
  - raising a shout
  lexicon: HALOT
  rationale: The reflexive/intensive participial form conveys a loud cry or jubilant shout. 'Shouting' fits the warrior image and avoids implying inward emotion alone.
- source_word: מיין
  chosen: because of wine
  alternatives:
  - from wine
  - with wine
  lexicon: HALOT
  rationale: 'The preposition מן here most naturally indicates cause or occasion: the warrior is shouting under the effect of wine. ''Because of wine'' is clearer in contemporary English than the more wooden ''from wine.'''
- source_word: מִתְרוֹנֵן
  chosen: shouting
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The participle denotes a vigorous loud cry; “exulting” remains a viable alternative.
- source_word: מִיָּיִן
  chosen: from wine
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: “From” preserves the Hebrew preposition’s concise source/cause relation without explaining its precise effect.
