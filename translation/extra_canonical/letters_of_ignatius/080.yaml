    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation. This reader text adapts the recorded English translation witness; it is not a verbatim quotation or a newly verified translation of the ancient-language text. The source witness is unchanged.
