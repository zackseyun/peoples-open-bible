  - severity: medium
    issue: Χαρααθαλὰν을 ‘차라아달란’으로 음역함
    rationale: χ는 ‘카’로, θ는 ‘타’로 옮겨 ‘카라아탈란’으로 표기하는 것이 그리스어 철자에 충실합니다. 기존 표기는 χ와 θ를 각각 ‘차’, ‘달’로 처리하여 원문 자음과 거리가 있습니다.
