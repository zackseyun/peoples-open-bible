  rationale: 'The Hebrew has two coordinated requested nouns: "your steadfast love" and "your salvation," followed by "according to your promise." The proposal rightly recognizes that the second term is appositional/explicative, but its dash placement makes "according to your promise" appear to modify only "salvation" and creates an English fragment after the dash. Moving the appositional clarification to the end retains both requested terms and lets the promise qualify the coming of Yahweh''s steadfast love/salvation. The current comma is not a comma splice, but it leaves the relation under-signaled in English.'
