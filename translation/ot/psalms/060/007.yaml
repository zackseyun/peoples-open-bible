  from: Gilead is mine[a], and Manasseh is mine; Ephraim is the stronghold of my head; Judah is my scepter.
  to: Gilead is mine, and Manasseh is mine; Ephraim is the defense of my head; Judah is my scepter.[a]
  rationale: “The stronghold of my head” is unnatural English. The proposal’s “a stronghold for my head” improves the syntax but loses the definiteness of the construct phrase and remains awkward. “The defense of my head” gives the natural sense of מָעוֹז while preserving the concrete head image. The note on מְחֹקְקִי must follow “scepter.”
