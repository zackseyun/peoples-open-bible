id: JOB.13.16
reference: Job 13:16
source:
  edition: WLC
  text: גַּם הוּא לִ֥/י לִֽ/ישׁוּעָ֑ה כִּי לֹ֥א לְ֝/פָנָ֗י/ו חָנֵ֥ף יָבֽוֹא־־־׃
translation:
  text: This too will be my deliverance[a], for a godless person would not come before him.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “He too will be my deliverance,” referring to God.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  chosen: also
  alternatives:
  - indeed
  - even
  lexicon: HALOT
  rationale: Marks addition/emphasis; 'also' preserves the connective force naturally in English.
- source_word: הוּא
  chosen: this
  alternatives:
  - he
  - it
  lexicon: HALOT
  rationale: Although formally 'he,' in this idiom it points to the preceding situation or claim; English 'this' best captures the demonstrative sense in context.
- source_word: לִי
  chosen: my
  alternatives:
  - for me
  - to me
  lexicon: HALOT
  rationale: 'With לישועה the sense is possession/benefit: ''will be my salvation'' is idiomatic and faithful.'
- source_word: לִישׁוּעָה
  chosen: deliverance
  alternatives:
  - deliverance
  - victory
  lexicon: HALOT
  rationale: The context concerns Job’s favorable outcome in appearing before God.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - indeed
  lexicon: HALOT
  rationale: Introduces the ground for the previous statement; 'for' preserves the explanatory relation concisely.
- source_word: לֹא
  chosen: 'no'
  alternatives:
  - not
  lexicon: HALOT
  rationale: Combined with the following clause, English reads most naturally as 'no ... may come' rather than a more wooden 'not ... will come.'
- source_word: לְפָנָיו
  chosen: before him
  alternatives:
  - into his presence
  - before his face
  lexicon: HALOT
  rationale: Standard idiom for appearing in someone's presence; 'before him' is clear and sufficiently formal.
- source_word: חָנֵף
  chosen: godless person
  alternatives:
  - hypocrite
  - profane man
  - impious man
  lexicon: HALOT
  rationale: The substantival adjective denotes an impious person without requiring English masculine gender marking.
- source_word: יָבֹוא
  chosen: may come
  alternatives:
  - comes
  - will come
  - can come
  lexicon: HALOT
  rationale: In this gnomic/assertive context, 'may come' expresses admissibility or possibility before God/presence, fitting the logic that the godless are not admitted before him.
- source_word: יָבוֹא
  chosen: will come
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The imperfect makes a general assertion, not primarily a statement of permission.
