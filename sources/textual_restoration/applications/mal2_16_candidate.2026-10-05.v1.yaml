theological_decisions:
- issue: Human conditional versus divine hatred and command readings
  chosen_reading: Provisionally render a human subject who hates and divorces, followed by the violence consequence;
    retain unchanged pointed WLC.
  alternative_readings:
  - For he hates divorce, with God as subject and divorce as the subject of covering
  - I hate divorce, through a different grammatical analysis or pointing
  - If he hates her, send her away
  rationale: The same human subject gives a connected accusation without repointing, but the conditional conjunction
    and finite-infinitive function remain disputed. Source grammar and local context, not a preferred divorce
    policy or theological outcome, govern the provisional choice. Early conditional attestation does not establish
    historical priority or the exact MT syntax. Original decisions remain in the archived record.
  doctrine_reference: DOCTRINE.md Translation philosophy 1 and 3
- issue: Agency and the garment image
  chosen_reading: Retain the finite covering predicate and the garment/violence image.
  alternative_readings:
  - Violence covers his garment
  - Divorce covers the divorcer’s garment
  rationale: Do not turn the predicate into an additional person whom God hates, identify the garment with
    the wife as a lexical fact, or infer a universal divorce rule from this local choice. Covering-subject
    alternatives are disclosed.
  doctrine_reference: DOCTRINE.md Translation philosophy 1 and 3
