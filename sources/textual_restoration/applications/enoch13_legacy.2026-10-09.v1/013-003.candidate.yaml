lexical_decisions:
- source_word: እሜሃ
  chosen: Then
  alternatives:
  - And then
  - At that time
  rationale: Temporal-sequential particle introducing the next action in the narrative. 'Then' preserves the flow
    without over-specifying timing.
  model_suggested_lexicon_unverified: Dillmann
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ሐዊርየ
  chosen: I went
  alternatives:
  - I departed
  - I came
  rationale: First-person verbal form from the verb of going/walking. 'I went' is the most straightforward narrative
    rendering.
  model_suggested_lexicon_unverified: Dillmann
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ነገርክዎሙ
  chosen: I spoke to them
  alternatives:
  - I told them
  - I addressed them
  rationale: Verb of speaking/telling with object suffix. 'Spoke to them' fits the immediate context of Enoch addressing
    the Watchers.
  model_suggested_lexicon_unverified: Dillmann
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ለኵሎሙ
  chosen: to them all
  alternatives:
  - to all of them
  rationale: Explicit totalizing object phrase; retained to preserve the collective scope.
  model_suggested_lexicon_unverified: Dillmann
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ኅቡረ
  chosen: together
  alternatives:
  - as an assembly
  - in a group
  rationale: Conveys gatheredness or collectivity. 'Together' is idiomatic and preserves the sense that they were
    addressed as one body.
  model_suggested_lexicon_unverified: Dillmann
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ወእሙንቱ ኵሎሙ
  chosen: and they all
  alternatives:
  - and all of them
  rationale: Repetition of totality is characteristic of the style and should be preserved rather than reduced.
  model_suggested_lexicon_unverified: Dillmann
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ፈርሁ
  chosen: became afraid
  alternatives:
  - feared
  - were afraid
  rationale: A simple fear verb; 'became afraid' captures the onset of fear in response to Enoch's words.
  model_suggested_lexicon_unverified: Dillmann
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ፍርሃት
  chosen: fear
  alternatives:
  - dread
  rationale: Abstract noun paired with the following term for intensified emotional reaction. 'Fear' keeps the lexical
    link with the preceding verb.
  model_suggested_lexicon_unverified: Dillmann
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ነሥአሙ
  chosen: seized them
  alternatives:
  - took hold of them
  - came upon them
  rationale: The verb suggests taking or overtaking. 'Seized them' preserves the forceful, almost external grip
    of the emotion.
  model_suggested_lexicon_unverified: Dillmann
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
- source_word: ወረዓድ
  chosen: and trembling
  alternatives:
  - and terror
  - and shaking
  rationale: Common term for trembling or quaking, especially in fear contexts. 'Trembling' preserves the bodily
    dimension of their dread.
  model_suggested_lexicon_unverified: Dillmann
  consultation_status: No new dictionary lookup is claimed for this item unless consulted_lexicon_entry is explicitly
    present.
