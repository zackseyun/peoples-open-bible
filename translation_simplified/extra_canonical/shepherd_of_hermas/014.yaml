base_translation:
  text: 'VI.1. “Do you want to know about those who are being cut down and hurled far from the tower?
    These are the sons of lawlessness[a]; they believed in hypocrisy, and no wickedness departed from
    them. For this reason they have no salvation[i], because they are not serviceable for the building
    on account of their wicked deeds. Therefore they were cut away and flung far off because of the anger
    of the Lord, because they provoked him[j].”


    VI.2. “And the others you saw—many lying there, not going into the building—these are the scabbed
    ones[h]: they came to know the truth, but did not remain in it, nor did they cling to the holy ones[k];
    therefore they are useless.”


    VI.3. “And those that have cracks[g]—who are they?” “These are the ones who harbor things against
    one another in their hearts and are not at peace among themselves, but put on a face of peace[l];
    yet when they depart from one another, their evils remain in their hearts. These, then, are the cracks
    that the stones have.”


    VI.4. “And the ones cut short—these are those who have believed and have the greater part in righteousness[m],
    but have certain parts of lawlessness. For this reason they are truncated and not whole.”


    VI.5. “And the white and round ones that do not fit into the building—who are they, Lady?” Answering
    me, she says, “How long will you be foolish and without understanding, asking about everything and
    understanding nothing? These are those who have faith, but also have the wealth of this age[n]. When
    affliction comes, because of their wealth and their business dealings they deny their Lord.”


    VI.6. And answering her, I say, “Lady, when then will they become fit for the building?” She says,
    “When their wealth—which captivates their souls[f]—has been cut back[s], then they will be useful
    to God[o]. For just as a round stone[p], unless it is trimmed and sheds something from itself, cannot
    become square[e], so also those who are rich in this age, unless their wealth is cut back, cannot
    become useful to the Lord[q].”


    VI.7. “[But][d] learn first from yourself: when you were rich[r], you were useless; but now you are
    useful and beneficial for life. Become useful to God, all of you[b]; for you yourself also are used
    from the same stones[c].”'
