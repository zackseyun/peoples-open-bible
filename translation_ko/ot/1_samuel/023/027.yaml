  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאָךְ
  english_pob_choice: a messenger
  chosen_korean: 전령
  alternatives_korean:
  - 사자
  - 메신저
  - 사절
  lexicon: מַלְאָךְ
  rationale: 사람의 전달자를 가리키는 일반 명사이므로 ‘전령’이 문맥상 가장 자연스럽고, 신적 ‘천사’ 의미를 피하면서도 신속한 전달의 뉘앙스를 살립니다.
- source_word: מַהֲרָה וְלֵכָה
  english_pob_choice: Hurry and come
  chosen_korean: 서둘러 오십시오
  alternatives_korean:
  - 빨리 오십시오
  - 어서 오십시오
  - 서둘러 와 주십시오
  lexicon: מהר + הלך
  rationale: 두 명령형의 긴박함을 압축해 살리되, 한국어에서 자연스러운 공손 명령으로 옮겼습니다.
- source_word: פָשְׁטוּ
  english_pob_choice: have made a raid
  chosen_korean: 습격했습니다
  alternatives_korean:
  - 급습했습니다
  - 공격했습니다
  - 약탈했습니다
  lexicon: פשט
  rationale: 단순한 ‘공격’보다 조직적인 침입·약탈의 함의를 살려 ‘습격했습니다’를 택했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 이 땅
  - 나라
  - 지역
  lexicon: ארץ
  rationale: 원문의 일반적 공간 지시를 유지하면서, POB의 ‘the land’에 대응하는 가장 직접적인 표현으로 옮겼습니다.
theological_decisions:
- issue: 사울에게 전달되는 급박한 경고의 어조
  chosen_reading: 전령의 보고와 직접 명령문을 그대로 살려, 사울에게 닥친 위기감을 보존했습니다.
  alternative_readings:
  - 설명형 문장으로 완화해 ‘급한 소식이 전해졌습니다’처럼 옮기기
  - 간접화법으로 바꾸어 긴박감을 줄이기
  rationale: 서사의 긴장과 전환점을 드러내는 본문의 기능이 중요하므로, 메시지의 급박함을 약화하지 않았습니다.
  doctrine_reference: 서사 본문에서의 원문 긴장 보존
- issue: 블레셋의 행동 묘사
  chosen_reading: ‘습격했습니다’로 옮겨 원문의 침입·약탈적 행동을 분명히 했습니다.
  alternative_readings:
  - ‘공격했습니다’로 일반화하기
  - ‘침공했습니다’로 정치군사 용어화하기
  rationale: 히브리어 동사의 의미 범위를 과도하게 좁히거나 넓히지 않으면서, 본문이 전달하는 위협성을 살렸습니다.
  doctrine_reference: 히브리어 동사 의미역 보존
