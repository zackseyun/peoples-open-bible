id: PSA.69.15
reference: Psalms 69:15
source:
  edition: WLC
  text: אַל תִּשְׁטְפֵ֤/נִי שִׁבֹּ֣לֶת מַ֭יִם וְ/אַל תִּבְלָעֵ֣/נִי מְצוּלָ֑ה וְ/אַל תֶּאְטַר עָלַ֖/י בְּאֵ֣ר פִּֽי/הָ־׀־־־׃
translation:
  text: Do not let the torrent of water sweep me away, and do not let the deep swallow me up, and do not let the well close its mouth over me.
  philosophy: dynamic
lexical_decisions:
- source_word: תִּשְׁטְפֵנִי
  chosen: sweep me away
  alternatives:
  - overflow me
  - wash over me
  lexicon: HALOT
  rationale: From שטף in the sense of flooding/overwhelming. 'Sweep me away' captures the destructive force of rushing water in idiomatic modern English better than the more wooden 'overflow me.'
- source_word: שִׁבֹּלֶת מַיִם
  chosen: the torrent of water
  alternatives:
  - the current of waters
  - the torrent of waters
  lexicon: HALOT
  rationale: The phrase denotes a rushing watercourse or torrent and should retain its water reference.
- source_word: תִּבְלָעֵנִי
  chosen: swallow me up
  alternatives:
  - swallow me
  - consume me
  lexicon: HALOT
  rationale: בלע commonly means 'swallow.' The English idiom 'swallow me up' naturally conveys total engulfment and matches the psalm's vivid metaphor.
- source_word: מְצוּלָה
  chosen: the deep
  alternatives:
  - the depths
  - the deep waters
  lexicon: HALOT
  rationale: מְצוּלָה refers to the depths, especially of the sea or deep waters. 'The deep' is concise, poetic, and standard English for this image.
- source_word: תֶּאְטַר
  chosen: close
  alternatives:
  - shut
  - enclose
  lexicon: HALOT
  rationale: The verb here conveys shutting or closing around/over someone. 'Close' is natural in English when paired with 'its mouth over me' and preserves the metaphor of the pit as a devouring opening.
- source_word: בְּאֵר
  chosen: the well
  alternatives:
  - the well
  - the cistern
  lexicon: HALOT
  rationale: “Well” is the ordinary lexical sense; the threatening personification is supplied by the context and retained in the text.
- source_word: פִּיהָ
  chosen: its mouth
  alternatives:
  - her mouth
  lexicon: HALOT
  rationale: Hebrew uses a feminine suffix agreeing with בְּאֵר, but English normally renders inanimate referents as 'its.' 'Mouth' preserves the personified image of the pit as something that can devour.
- source_word: עָלַי
  chosen: over me
  alternatives:
  - upon me
  - against me
  lexicon: HALOT
  rationale: With the image of the pit's mouth shutting, 'over me' best conveys closure above the speaker rather than mere hostility.
