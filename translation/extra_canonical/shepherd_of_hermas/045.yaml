    text: 'Project edition-comparison report: The project’s apparatus transcription records the working
      listen as a restoration supported by the1891 edition’s L1/E; A preserves only the damaged ending
      …ouson, and L2 is defective. The positive request Lord, so that he may be strengthened is Tischendorf’s
      conjectural restoration supported by L1/E; the reported damaged A includes a negative mē dynamōthē.
      These are disclosed edition choices, not complete preserved Athos wording. Lake’s reproduced leaf
      ends at iv.7; its missing Leipzig leaves cannot establish absence of v. See the bounded witness
      extracts for locator and source hashes.'
  - marker: b
    reason: textual_variant
    text: 'Project edition-comparison report: The working Greek has empty jars. Vulgata printed 67–68
      has half-full jars; Palatina printed 129 has jars not full, with marked corrections. The difficult
      empty-jar comparison is retained rather than changed to the Latin image.'
  - marker: c
    reason: lexical_alternative
    text: Servant follows current project policy; the closing enslaved to him retains the source’s subjection
      to the devil. Belonging, bonded status and allegiance are not erased by the reader-facing servant
      wording.
