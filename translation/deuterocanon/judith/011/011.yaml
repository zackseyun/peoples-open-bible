  meaning: Judith claims that impending death will prevent Holofernes’ campaign from failing because a particular sin has overtaken her people and will provoke God when they commit it.
  meaning_decisions:
  - source_phrase: ἵνα μὴ γένηται ὁ κύριός μου ἔκβολος καὶ ἄπρακτος
    prior_rendering: so that my lord may not become an outcast and ineffective
    new_rendering: so that my lord will not be driven back and thwarted
    rationale: In the campaign context, the paired adjectives describe repulse and failure to accomplish his purposes, rather than necessarily social exclusion or inability to act.
  - source_phrase: κατέλαβε αὐτοὺς ἁμάρτημα
    prior_rendering: sin has overtaken them
    new_rendering: A sin has overtaken them
    rationale: The following verses identify a particular impending offense; the rendering retains the personification and the tension between being overtaken already and committing the act later.
  - source_phrase: ἐν ᾧ παροργιοῦσιν τὸν θεὸν αὐτῶν, ἐπηνίκα ἂν ποιήσωσιν ἀτοπίαν
    prior_rendering: by which they provoke their God whenever they commit an offense
    new_rendering: when they commit this offense, they will provoke their God to anger
    rationale: The verb is future, and the context concerns the coming commission of this offense, not a general statement about habitual wrongdoing; the anger expressed by the verb is made explicit.
