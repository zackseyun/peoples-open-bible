  text: Πῶς, φημί, κύριε, ἐγένοντο χείρονες, Θεὸν ἐπεγνωκότες; Ὁ μὴ γινώσκων, φησί, Θεὸν καὶ πονηρευόμενος
    ἔχει κόλασίν τινα τῆς πονηρίας αὐτοῦ· ὁ δὲ Θεὸν ἐπιγνοὺς οὐκέτι ὀφείλει πονηρεύεσθαι, ἀλλ᾿ ἀγαθοποιεῖν.
    2. ἐὰν οὖν ὁ ἀγαπῶν ἀγαθοποιεῖν πονηρεύηται, οὐ δοκεῖ πλείονα πονηρίαν ποιεῖν παρὰ τὸν μὴ γινώσκοντα
    τὸν Θεόν; διὰ τοῦτο οἱ μὴ ἐγνωκ⸢ό⸣τες Θεὸν καὶ πονηρευόμενοι κεκριμένοι εἰσὶν εἰς θάνατον, οἱ δὲ τὸν
    Θεὸν ἐγνωκότες καὶ τὰ μεγαλεῖα αὐτοῦ ἑωρακότες καὶ πονηρευόμενοι δισσῶς κολασθήσονται καὶ ἀποθανοῦνται
    εἰς τὸν αἰῶνα. οὕτως οὖν καθαρισθήσεται ἡ ἐκκλησία τοῦ Θεοῦ. 3. ὡς δὲ εἶδες ἐκ τοῦ πύργου τοὺς λίθους
    ⸢ἠρ⸣μένους καὶ παραδεδομένους τοῖς πνεύμασι τοῖς πονηροῖς, καὶ ἐκεῖνοι ἐκβληθήσονται, καὶ ἔσται ἓν
    σῶμα τῶν κεκαθαρμένων, ὥσπερ καὶ ὁ πύργος ἐγένετο ὡς ἐξ ἑνὸς λίθου γεγονὼς μετὰ τὸ καθαρισθῆναι αὐτόν.
    οὕτως ἔσται καὶ ἡ ἐκκλησία τοῦ Θεοῦ μετὰ τὸ καθαρισθῆναι αὐτὴν καὶ ἀποβληθῆναι τοὺς πονηροὺς καὶ ὑποκριτὰς
    καὶ βλασφήμους καὶ διψύχους καὶ πονηρευομένους ποικίλαις πονηρίαις. 4. μετὰ τὸ τούτους ἀποβληθῆναι
    ἔσται ἡ ἐκκλησία τοῦ Θεοῦ ἓν σῶμα, μία φρόνησις, εἷς νοῦς, μία πίστις, μία ἀγάπη. καὶ τότε ὁ υἱὸς
    τοῦ Θεοῦ ἀγαλλιάσεται καὶ εὐφρανθήσεται ἐν αὐτοῖς ἀπειληφὼς τὸν λαὸν αὐτοῦ καθαρόν. Μεγάλως, φημί,
    κύριε, καὶ ἐνδόξως πάντα ἔχει. 5. ἔτι, [φημί,] κύριε, τῶν ὀρέων ἑνὸς ἑκάστου δήλωσόν μοι τὴν δύναμιν
    καὶ τὰς πράξεις, ἵνα πᾶσα ψυχὴ πεποιθυῖα ἐπὶ τὸν Κύριον ἀκούσασα δοξάσῃ τὸ μέγα καὶ θαυμαστὸν καὶ
    ἔνδοξον ὄνομα αὐτοῦ. Ἄκουε, φησί, τῶν ὀρέων τὴν ποικιλίαν καὶ τῶν δώδεκα ἐθνῶν.
