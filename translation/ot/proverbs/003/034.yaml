id: PRO.3.34
reference: Proverbs 3:34
source:
  edition: WLC
  text: אִם לַ/לֵּצִ֥ים הֽוּא יָלִ֑יץ ו/ל/עניים יִתֶּן חֵֽן־־־׃
translation:
  text: Surely he scoffs at scoffers, but gives grace to the humble[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “the poor” or “the afflicted.”
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  chosen: Surely
  alternatives:
  - Indeed
  lexicon: HALOT
  rationale: 'In this clause אִם is asseverative rather than a conditional protasis: no conditional apodosis follows, and the antithetical proverb asserts God''s characteristic response.'
- source_word: לַלֵּצִים
  chosen: at scoffers
  alternatives:
  - at mockers
  - at the scornful
  lexicon: HALOT
  rationale: The preposition marks the people toward whom the action is directed. 'Scoffers' preserves the deliberate lexical echo with 'scoffs.'
- source_word: הוּא
  chosen: he
  alternatives:
  - He himself
  lexicon: HALOT
  rationale: The explicit pronoun adds emphasis in Hebrew, but standard English can convey the sense with 'he' without awkwardness. The subject is left implicit as God from context rather than expanded in translation.
- source_word: יָלִיץ
  chosen: scoffs
  alternatives:
  - mocks
  - shows himself a scoffer
  lexicon: HALOT
  rationale: 'The Hiphil of לוץ here forms a wordplay with לֵצִים. ''Scoffs'' preserves the lexical echo: to scoffers, he scoffs. This also aligns with the sense reflected in ancient versions and the proverb''s retributive symmetry.'
- source_word: וְלַעֲנִיִּים
  chosen: but to the humble
  alternatives:
  - but to the afflicted
  - but to the poor
  lexicon: HALOT
  rationale: The antithetical wisdom context supports 'humble,' while the social and circumstantial senses remain documented.
- source_word: יִתֶּן
  chosen: he gives
  alternatives:
  - he grants
  - he will give
  lexicon: HALOT
  rationale: The imperfect here expresses characteristic action in proverbial style. Present tense in English best captures the gnomic force.
- source_word: חֵן
  chosen: favor
  alternatives:
  - grace
  lexicon: HALOT
  rationale: חן can mean favor or grace. 'Favor' is the more natural English choice in this wisdom context and avoids importing later theological associations unnecessarily, while still preserving the benevolent sense.
