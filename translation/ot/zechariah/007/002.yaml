  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Subject identification for בֵּית אֵל
  chosen_reading: Bethel as the sender
  alternative_readings:
  - the house of God sent
  - Beth-el (as a personal or clan designation)
  rationale: The Hebrew most plausibly identifies Bethel, the place/community, as the subject of the verb. Rendering it as a toponym avoids importing a theological nuance ('house of God') that is not required in this context.
