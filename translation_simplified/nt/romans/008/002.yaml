  text: For the life-giving Spirit’s power in Christ Jesus has set you free from the power of sin and death.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek uses “law” for both powers, describing each as a ruling force.
