- from: 내 사랑하는 이들과 내 친구들은 내 고통에서 멀리 서 있고, 내 가까운 친족들은 멀리 서 있습니다.[a][b][c]
  to: 내 생명을 노리는 자들이 덫을 놓고, 내 해를 바라는 자들이 파멸을 말하며, 온종일 속임수를 중얼거립니다.
  rationale: 대상 절의 히브리어를 직접 반영하여, 두 적대 집단의 병렬 표현(‘내 생명을 노리는 자들’/‘내 해를 바라는 자들’)과 그들의 행동(덫을 놓음, 파멸을 말함, 속임수를 지속해서 말함)을 보존했습니다. 영어 POB의 ‘set traps,’ ‘seek my life,’ ‘seek my harm,’ ‘speak destruction,’ ‘mutter deceit’와도 의미상 일치합니다. 원문과 무관한 기존 각주 및 앵커는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:07:21Z'
