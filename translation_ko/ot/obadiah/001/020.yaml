revisions:
- from: 그리고 이스라엘 자손의 이 군대의 포로들, 곧 가나안 사람들 가운데 사르밧까지 흩어진 자들과 예루살렘의 포로들, 곧 스바랏에 있는 자들이 네게브의 성읍들을 차지할 것입니다.[a][b]
  to: 이 이스라엘 자손 무리에 속한 사로잡혀 간 이들[a], 곧 가나안 사람들 가운데 사르밧까지 있는 이들과, 스바랏에 있는 예루살렘의 사로잡혀 간 이들은[b] 네게브의 성읍들을 차지할 것입니다.
  rationale: 원문과 영어 감사 번역의 두 병렬 주어를 보존하되, 본문에 없는 ‘흩어진’을 제거했습니다. גָלוּת의 유배 의미를 보다 넓게 반영하고, חֵיל을 실제 군사 부대로 단정하지 않도록 자연스러운 집합 명사로 처리했습니다. 지명과 미래의 점유 약속은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:13Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘흩어진 자들’은 히브리어 본문에 없는 의미를 더하며, גָלוּת는 단순한 전쟁 포로보다 강제 이주·유배의 상태/집단을 가리키므로 ‘포로들’보다 ‘사로잡혀 간 이들’이 더 충실합니다. 두 유배 집단이 병렬로 네게브 성읍들을 차지한다는 문장 구조도 더 분명히 해야 합니다.
  naturalness: ‘이스라엘 자손의 이 군대의 포로들’은 소유 관계가 어색하고 실제 군대의 포로라는 뜻으로 오해될 수 있습니다. ‘이 이스라엘 자손 무리에 속한 사로잡혀 간 이들’은 집합 명사 חֵיל의 범위를 보존하면서도 현대 한국어에서 자연스럽습니다.
  terminology: חֵיל은 이 문맥에서 실제 전투 부대라고 단정하기 어려우므로 ‘무리’로 옮기고 각주에서 군사적 집합 명사의 뉘앙스를 알립니다. גָלוּת는 ‘사로잡혀 간 이들’로, נֶגֶב은 지명 ‘네게브’로 유지합니다. 스바랏의 위치는 확정되지 않았다는 각주가 적절합니다.
  issues:
