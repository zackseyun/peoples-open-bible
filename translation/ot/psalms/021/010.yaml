id: PSA.21.10
reference: Psalms 21:10
source:
  edition: WLC
  text: פִּ֭רְיָ/מוֹ מֵ/אֶ֣רֶץ תְּאַבֵּ֑ד וְ֝/זַרְעָ֗/ם מִ/בְּנֵ֥י אָדָֽם׃
translation:
  text: You will destroy their fruit[a] from the earth, and their offspring from among humanity.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Here 'fruit' is an image for their descendants, parallel to 'offspring.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּרְיָמוֹ
  lemma: פְּרִי
  chosen: their fruit
  alternatives:
  - their produce
  - their progeny
  lexicon: HALOT
  rationale: פְּרִי literally means 'fruit' or 'produce.' In this judgment context it can metaphorically refer to descendants or issue, but the parallel with 'their offspring' favors retaining the concrete metaphor 'fruit' in the main text while allowing the reader to hear the poetic image.
- source_word: מֵאֶרֶץ
  chosen: from the earth
  alternatives:
  - from the land
  lexicon: HALOT
  rationale: אֶרֶץ can mean 'earth' or 'land.' In this royal psalm's broad judgment setting, 'earth' best preserves the wider scope rather than a specific territory.
- source_word: תְּאַבֵּד
  chosen: you will destroy
  alternatives:
  - you will wipe out
  - you will make perish
  lexicon: HALOT
  rationale: The Piel of אבד commonly carries a causative sense, 'destroy' or 'cause to perish.' 'Destroy' is natural modern English and preserves the direct force of the second masculine singular address to God.
- source_word: וְזַרְעָם
  chosen: their offspring
  alternatives:
  - their seed
  - their descendants
  lexicon: HALOT
  rationale: זֶרַע often means 'seed' literally or 'offspring/descendants' figuratively. Here the human referent and parallelism with 'fruit' support 'offspring' as the clearest English rendering, while 'seed' is preserved as an alternative.
- source_word: מִבְּנֵי אָדָם
  chosen: from among humanity
  alternatives:
  - from among mankind
  - from among humankind
  lexicon: HALOT
  rationale: The phrase denotes human beings collectively in this context; “humanity” is idiomatic English and preserves its generic scope.
