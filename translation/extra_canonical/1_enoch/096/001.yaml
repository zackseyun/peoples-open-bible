translation:
  text: Have hope, righteous ones,[a] for sinners will soon perish before you.[b] And authority over them will be
    yours, as you have wished.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: This follows the selected main text of Charles1906, printed200, not a newly inspected manuscript. The
      righteous address is asterisk-marked. His apparatus15–20 reports an alternative opening, omissions and variations
      in the authority and final relational phrases. These reported alternatives are not silently substituted into
      the selected main line.
  - marker: b
    reason: lexical_alternative
    text: The verb belongs to the perishing/destruction family and here has the reflexive/intransitive form. No
      agent of destruction is stated. Before you renders the source expression literally from before your plural
      presence; soon renders its quickly/soon adverb. This assurance supplies no calendar date.
  - marker: c
    reason: textual_variant
    text: Authority is the singular subject of will be, with for you and over them; the last verb is a second-person
      plural perfect, hence as you have wished. Charles reports an alternative authority form at17, omission of
      for you by g,u at18, over you in u at19, and variations or omission of the final comparison at20. These are
      his apparatus reports, not independent manuscript checks.
