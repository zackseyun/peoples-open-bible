  text: καὶ ὀβελίσκους ὀξεῖς πυρώσαντες, τοῖς νώτοις προσέφερον· καὶ τὰ πλευρὰ διαπείραντες, ἀπʼ αὐτοῦ τὰ σπλάγχνα διέκαιον.
