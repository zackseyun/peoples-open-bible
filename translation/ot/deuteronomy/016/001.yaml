  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Whether to render אָבִיב as a season or as a month name
  chosen_reading: Abib as a calendrical designation
  alternative_readings:
  - spring
  rationale: In this legal/festival context the phrase identifies the liturgical month associated with the exodus and Passover. Rendering it as 'spring' would flatten the formal calendar reference.
