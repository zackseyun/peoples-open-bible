lexical_decisions:
- source_word: ἡμᾶς
  chosen: us
  lexicon: BDAG
  rationale: Direct object pronoun; straightforwardly rendered as first person plural 'us'.
- source_word: δὲ
  chosen: But
  alternatives:
  - and
  - now
  lexicon: BDAG
  rationale: Marks contrast with the preceding context; 'But' best preserves the adversative force in readable English.
- source_word: ἐκύκλωσαν
  chosen: have surrounded
  alternatives:
  - surrounded
  - encircled
  - hemmed in
  lexicon: BDAG
  rationale: Aorist verb from κυκλόω, literally 'encircled/surrounded.' English present perfect fits the epistolary summary of ongoing troubles resulting from past events better than a simple past, while staying close to the Greek image.
- source_word: πολλαὶ
  chosen: many
  alternatives:
  - numerous
  lexicon: BDAG
  rationale: Common adjective modifying θλίψεις; 'many' is the most natural and direct rendering.
- source_word: θλίψεις
  chosen: afflictions
  alternatives:
  - troubles
  - distresses
  - tribulations
  lexicon: BDAG
  rationale: θλίψις denotes pressure, distress, or affliction. 'Afflictions' preserves the gravity without importing specifically later theological resonance that 'tribulations' may carry.
- source_word: καὶ
  chosen: and
  lexicon: BDAG
  rationale: Simple coordinating conjunction linking the two plural subjects.
- source_word: πόλεμοι πολλοί
  chosen: many wars
  alternatives:
  - many battles
  - numerous wars
  lexicon: BDAG
  rationale: πόλεμοι refers broadly to wars or armed conflicts, not merely individual engagements; retaining 'many wars' mirrors the Greek word order and emphasis.
