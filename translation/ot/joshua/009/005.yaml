  from: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
  to: They wore worn-out, patched sandals and worn-out clothes; all the bread they carried as provisions was dry and moldy[a].
  rationale: The earlier lexical rationale preferred 'crumbly,' but that judgment is uncertain and the current wording in verse 12 uses 'moldy' for the same word. I favor the speckled appearance suggested by the term and make both verses consistent while retaining the alternative.
