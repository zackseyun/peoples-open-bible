  from: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
  to: if the king’s anger flares up and he says to you, ‘Why did you go so close to the city to fight? Did you not know they would shoot from the wall?
