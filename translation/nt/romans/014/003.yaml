  from: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
  to: The one who eats anything must not despise the one who abstains from certain foods, and the one who abstains must not judge the one who eats anything, for God has welcomed him.
  rationale: The earlier decisions rightly retained the force of “despise,” the distinction from judging, and the singular “him,” all of which remain. I depart from the earlier preference for an unspecified eating contrast because “does not eat” can misleadingly suggest complete abstinence from food.
