translation:
  text: There I saw the one called the Head of Days, whose head was like white wool. With him was another whose
    face had a human appearance, full of grace like one of the holy angels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Head of Days preserves the recurring designation, literally one who has a head of days; it is not silently
      replaced by a named theological identity. The same designation appears explicitly again in46:2 and47:3. Grace
      here includes gracious beauty or attractiveness: Dillmann1865 col1317 explicitly cites46:1 under that visual
      sense. A human-looking face does not by itself identify this figure with a later named person.'
    reason: lexical_alternative
