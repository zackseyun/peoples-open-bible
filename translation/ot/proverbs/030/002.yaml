  to: Indeed, I am too senseless to be called human[a]; I lack human understanding.
  rationale: The latest revision’s replacement of “brutish” with “senseless” correctly focused the statement on deficient understanding, and that gain is retained. There is no MAINTAINER ruling; the earlier insistence on “than a man” preserves the construction but obscures its rhetorical force, so the current footnote’s interpretation becomes the main text.
