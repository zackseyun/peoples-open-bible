  from: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
  to: For the flesh desires what is contrary to the Spirit, and the Spirit desires what is contrary to the flesh. They oppose one another, so that you do not do whatever you want.
  rationale: The earlier wording leaves the desired actions unspecified, and I preserve that openness alongside its contextual identification of the Holy Spirit. I clarify the parallel clauses and drop the weak human-spirit alternative and the repeated flesh note.
