lexical_decisions:
- source_word: פחד על שם
  english_pob_choice: Be concerned for your name
  chosen_korean: 이름을 소중히 여기십시오
  alternatives_korean:
  - 이름을 염려하십시오
  - 이름을 돌보십시오
  lexicon: שם / 이름
  rationale: 히브리어는 '이름'을 직접 언급하며, 문맥상 평판과 명예를 지키라는 권고이므로 현대 한국어에서 자연스럽고 강한 권면인 '소중히 여기십시오'로 옮겼습니다.
- source_word: כי הוא ילוך
  english_pob_choice: for it will go with you
  chosen_korean: 그것은 ... 더 오래 당신과 함께 있을 것입니다
  alternatives_korean:
  - 그것이 당신과 함께 갈 것입니다
  - 그것이 당신과 함께 갈 것입니다
  lexicon: הלך / 가다
  rationale: 직역의 '갈 것이다'를 유지하면서도 한국어에서 소유·동반의 지속성을 드러내기 위해 '함께 있을 것입니다'로 다듬었습니다.
- source_word: מאלפי אוצרות חכמה
  english_pob_choice: more than a thousand stores of wisdom
  chosen_korean: 천 개의 큰 금고보다도
  alternatives_korean:
  - 지혜의 천 개의 큰 저장고보다도
  - 지혜의 천 개의 보물보다도
  lexicon: אוצרות / 저장고, 창고; חכמה / 지혜
  rationale: English POB의 'stores'를 따라 '금고'보다 '저장소/금고'의 물리적 축적 이미지를 살리되, 현대 독자가 읽기 쉬운 '큰 금고'로 옮겼습니다.
theological_decisions:
- issue: 명예/평판으로서의 '이름'과 축적된 지혜의 대비
  chosen_reading: 이 구절은 문자 그대로의 호칭이 아니라, 삶의 명성과 도덕적 평판을 가리키는 '이름'을 보존하라는 지혜문학적 권면으로 읽었습니다.
  alternative_readings:
  - 실제 개인 이름을 소중히 여기라는 뜻
  - 단순한 명망보다 지적 재산을 우선하라는 뜻
  rationale: 집회서의 문맥은 사회적·윤리적 평판을 중시하는 지혜 문학의 전형으로, '이름'을 인격의 공적 평판으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 지혜문학의 명예/평판 개념
- issue: Hebrew와 Greek parallel의 수치 차이
  chosen_reading: 본문의 히브리어 '지혜의 천 개의 큰 창고' 계열을 따라 번역하되, English POB의 'stores' 반영을 살려 축적의 이미지를 유지했습니다.
  alternative_readings:
  - 그리스어의 '천 개의 큰 금 저장고'를 따라 번역
  - 히브리어/그리스어를 절충해 '보물'로 번역
  rationale: 본문 전승 간 물질 이미지가 다르므로, 지혜의 가치를 극대화하는 공통분모인 '많이 쌓인 귀중한 저장물'의 이미지를 보존하는 방향이 적절합니다.
  doctrine_reference: 본문비평 및 지혜문학 번역 원칙
