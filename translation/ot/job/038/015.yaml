id: JOB.38.15
reference: Job 38:15
source:
  edition: WLC
  text: וְ/יִמָּנַ֣ע מֵ/רְשָׁעִ֣ים אוֹרָ֑/ם וּ/זְר֥וֹעַ רָ֝מָ֗ה תִּשָּׁבֵֽר׃
  extraction_repair: Retains inline special letters from the vendored XML; see docs/HEBREW_INLINE_LETTER_REPAIR_2026-09-07.md.
translation:
  text: Their light is withheld from the wicked, and the raised arm[a] is broken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The “arm” is a concrete image that can represent strength or power, especially power used violently.
    reason: lexical_alternative
  - marker: b
    text: Or “will be broken.” The Hebrew imperfect can be read as future or as a vivid description of what dawn does.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִמָּנַע
  chosen: is withheld
  alternatives:
  - is restrained
  - is kept back
  lexicon: HALOT
  rationale: Niphal imperfect of מנע conveys being withheld or prevented. Passive English best reflects the Hebrew form and fits the context of light being denied.
- source_word: מֵרְשָׁעִים
  chosen: from the wicked
  alternatives:
  - from wicked ones
  - from evil men
  lexicon: HALOT
  rationale: 'The preposition מִן with רְשָׁעִים indicates separation: the light is withheld from wicked people. ''The wicked'' is idiomatic and preserves the moral category without over-specifying gender.'
- source_word: אוֹרָם
  chosen: their light
  alternatives:
  - light for them
  - their daylight
  lexicon: HALOT
  rationale: Constructed as 'their light,' most naturally referring to the light belonging to or enjoyed by the wicked. This fits the immediate imagery of dawn exposing and frustrating evildoers.
- source_word: וּזְרוֹעַ
  chosen: and the arm
  alternatives:
  - and the strength
  - and the forearm
  lexicon: HALOT
  rationale: זְרוֹעַ literally means 'arm' and often metaphorically denotes strength or power. The literal image should be retained in the main text, allowing the metaphorical force to remain implicit.
- source_word: רָמָה
  chosen: raised
  alternatives:
  - raised
  - exalted
  - outstretched
  lexicon: HALOT
  rationale: The form describes an arm held high. “Raised” is direct modern English and retains the concrete image.
- source_word: תִּשָּׁבֵר
  chosen: is broken
  alternatives:
  - will be broken
  - is shattered
  lexicon: HALOT
  rationale: 'Niphal imperfect of שבר can be rendered as a present gnomic passive in poetic discourse: ''is broken.'' This matches the surrounding depiction of what dawn does to the wicked. Future ''will be broken'' is possible, but present better suits the vivid poetic description.'
