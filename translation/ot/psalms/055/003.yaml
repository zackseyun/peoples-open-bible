  from: Because of the voice of the enemy[a], because of the oppression of the wicked; for they cast trouble upon me, and in anger they hate me.
  to: Because of the voice of the enemy, because of the oppression of the wicked; for they bring trouble down on me[a], and in anger they hate me.
