base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/083.yaml
  text: Jesus said[1], "The images are manifest to humanity, and the light that is within them is hidden in the image of the light of the Father. He will be revealed[2], and his image is hidden by his light."
translation:
  language: fr
  text: 'Jésus a dit : « Les images se manifestent à l’être humain[b], mais la lumière qui est en elles est cachée dans l’image de la lumière du Père. Il se révélera[a], et son image est cachée par sa lumière. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En copte, le pronom masculin peut renvoyer soit au Père, soit à la lumière, puisque les deux noms sont masculins. On peut donc aussi comprendre : « La lumière se révélera, et son image est cachée par sa lumière. »'
    reason: ambiguïté grammaticale et référentielle
  - marker: b
    text: 'Littéralement : « à la personne » ou « à l’humain »; le singulier est employé dans un sens générique.'
    reason: précision lexicale
lexical_decisions:
- source_word: ⲛϩⲓⲕⲱⲛ
  choice: les images
  rationale: Le terme copte, emprunté au grec εἰκών, désigne ici des images ou formes visibles; « images » conserve le lien lexical répété dans tout le logion.
- source_word: ⲥⲉⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: se manifestent
  rationale: Cette expression indique que les images deviennent manifestes ou visibles. La tournure pronominale est naturelle en français tout en gardant l’idée de manifestation.
- source_word: ⲙ̄ⲡⲣⲱⲙⲉ
  choice: à l’être humain
  rationale: Le singulier générique ⲡⲣⲱⲙⲉ peut désigner la personne humaine ou l’humanité collectivement. « L’être humain » garde ici le singulier du copte.
- source_word: ϩⲏⲡ⳿ / ϩⲱⲡ
  choice: est cachée
  rationale: Le statif exprime un état présent de dissimulation, et non une action future.
- source_word: ϭⲱⲗⲡ⳿ ⲉⲃⲟⲗ
  choice: se révélera
  rationale: Dans ce contexte, le verbe s’oppose délibérément à « être caché » et prend le sens intransitif de devenir manifeste ou d’être révélé.
theological_decisions:
- issue: Référent du pronom masculin singulier dans « Il se révélera » et les possessifs qui suivent
  choice: Il se révélera, et son image est cachée par sa lumière.
  alternative: Elle se révélera, et son image est cachée par sa lumière — si le référent est « la lumière » selon le genre français.
  rationale: En copte, le Père et la lumière sont tous deux des noms masculins; le pronom peut donc renvoyer à l’un ou à l’autre. Le texte principal retient « Il », qui peut viser le Père, sans supprimer l’autre lecture, signalée en note.
- issue: Rapport entre l’image, la lumière et le Père
  choice: Conserver littéralement « l’image de la lumière du Père » et « son image est cachée par sa lumière ».
  alternative: Expliciter les rapports métaphysiques entre ces éléments.
  rationale: Le logion formule ces rapports de manière dense et énigmatique. Une explicitation imposerait une interprétation théologique absente de la syntaxe.
translation_notes:
  register: Français international moderne, sobre et dignifié. La répétition de « image » et de « lumière » est volontairement conservée, ainsi que l’opposition entre ce qui se manifeste ou se révèle et ce qui demeure caché.
