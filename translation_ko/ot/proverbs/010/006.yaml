  text: 복이 의인의 머리에는 있고, 악인의 입은 폭력을 덮습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרָכוֹת
  english_pob_choice: Blessings
  chosen_korean: 복들
  alternatives_korean:
  - 복
  - 축복들
  lexicon: ברכה
  rationale: 히브리어 복수형을 살려 단수의 일반명사보다 ‘복들’로 옮겨, 의인에게 임하는 풍성함을 드러냈습니다.
- source_word: לְרֹאשׁ
  english_pob_choice: are on the head of
  chosen_korean: 머리 위에
  alternatives_korean:
  - 머리에
  - 머리 위에 있습니다
  lexicon: ראש
  rationale: 전치사 לְ와 명사 ראש의 결합은 단순 소유보다 ‘위에 임함’의 이미지를 드러내므로 ‘머리 위에’로 자연스럽게 표현했습니다.
- source_word: יְכַסֶּה
  english_pob_choice: covers
  chosen_korean: 덮어 버립니다
  alternatives_korean:
  - 덮습니다
  - 가립니다
  lexicon: כסה
  rationale: 동사의 기본 의미는 ‘덮다’이지만, 문맥상 악인의 입이 폭력을 가려 드러나지 않게 하는 적극적 행위를 보여 주므로 ‘덮어 버립니다’로 옮겼습니다.
- source_word: חָמָס
  english_pob_choice: violence
  chosen_korean: 폭력
  alternatives_korean:
  - 포악
  - 불의
  lexicon: חמס
  rationale: חָמָס는 단순한 거친 말보다 폭력과 잔혹함을 포함하는 사회적 악을 가리키므로 ‘폭력’이 가장 직접적입니다.
theological_decisions:
- issue: 의인과 악인의 대조 구조
  chosen_reading: 이 속담은 의인에게는 복이, 악인에게는 폭력이 혀와 입술의 작동과 맞물려 드러난다는 대조를 유지합니다.
  alternative_readings:
  - 의인의 외적 번영과 악인의 말의 악함을 일반적으로 대비하는 읽기
  rationale: 히브리 시는 결과만이 아니라 인격과 말의 성격을 함께 드러내므로, 단순한 도덕 교훈보다 언어와 삶의 방향이 연결된 대조로 번역했습니다.
  doctrine_reference: 잠언의 지혜 문학적 대조법
