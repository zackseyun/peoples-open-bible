base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/050.yaml
  text: For since they are wooden, overlaid with gold and overlaid with silver, it will afterward be known that they are false; to all the nations and to the kings it will be evident that they are not gods but works of human hands, and there is no work of God in them.
translation:
  language: ko
  text: 그것들은 나무로 되어 있고 금과 은으로 입혀졌으므로, 나중에는 그것들이 거짓된 것임이 알려질 것입니다. 모든 민족과 모든 왕들에게 그것들이 신들이 아니라 사람의 손으로 만든 것들이며, 그것들 안에는 하나님께서 하신 일이 전혀 없다는 것이 분명해질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάρχοντα
  english_pob_choice: since they are
  chosen_korean: 나무로 만든 것이고
  alternatives_korean:
  - 그것들이 있으므로
  - 존재하므로
  lexicon: ὑπάρχω
  rationale: 문맥상 단순한 존재 진술이 아니라 우상들의 물질적 실체를 설명하는 출발점이므로, 한국어에서는 자연스럽게 ‘나무로 만든 것’으로 풀어 주었습니다.
- source_word: περίχρυσα καὶ περιάργυρα
  english_pob_choice: overlaid with gold and overlaid with silver
  chosen_korean: 금과 은으로 입혀졌으므로
  alternatives_korean:
  - 금과 은으로 입혀졌으므로
  - 금으로 입히고 은으로 입힌
  lexicon: περιχρύσω / περιάργυρος
  rationale: 반복 구조를 살려 ‘금과 은으로 입혀졌으므로’로 옮기되, 영어 POB의 ‘overlaid with silver’에 맞춰 은도 별도의 입힘으로 드러나게 했습니다.
- source_word: ψευδῆ
  english_pob_choice: 'false'
  chosen_korean: 거짓임
  alternatives_korean:
  - 헛됨
  - 가짜임
  lexicon: ψευδής
  rationale: 우상의 실재 부재와 속임수 성격을 함께 드러내기 위해 ‘거짓임’이 가장 직설적이고 문맥에 맞습니다.
- source_word: ἔργα χειρῶν ἀνθρώπων
  english_pob_choice: works of human hands
  chosen_korean: 사람의 손이 만든 작품
  alternatives_korean:
  - 사람의 손으로 만든 것들
  - 사람 손의 작품
  lexicon: ἔργον + χείρ + ἄνθρωπος
  rationale: 성경적 우상 비판의 관용구를 유지하면서도, 현대 한국어에서 ‘작품’이 창조적 산물이라는 오해를 줄이도록 ‘만든 작품’으로 완화했습니다.
- source_word: οὐθὲν θεοῦ ἔργον
  english_pob_choice: there is no work of God
  chosen_korean: 하나님의 일도 아무것도 없다는
  alternatives_korean:
  - 하나님의 일은 전혀 없다는
  - 하나님의 작품은 아무것도 없다는
  lexicon: θεοῦ ἔργον
  rationale: ‘ἔργον’의 일반적 의미를 살려 ‘일’로 옮기되, 부정의 강도를 위해 ‘아무것도 없다’는 중첩 표현을 사용했습니다.
theological_decisions:
- issue: 우상의 실체와 무능을 어떻게 드러낼지
  chosen_reading: 우상은 단지 물질로 된 인간 제작물이며, 그 안에는 하나님의 어떤 일도 없다고 직설적으로 진술했습니다.
  alternative_readings:
  - 우상은 헛된 상징일 뿐이라고 완곡하게 옮길 수 있습니다.
  - 우상은 신적 힘이 없는 물건이라고 설명적으로 풀 수 있습니다.
  rationale: 본문은 우상의 거짓됨을 선언하는 예언적 논증이므로, 완곡화하지 않고 ‘거짓’, ‘사람의 손이 만든 작품’, ‘하나님의 일도 아무것도 없음’으로 그대로 드러냈습니다.
  doctrine_reference: 우상 숭배 비판, 신론
- issue: ‘하나님’과 ‘신들’의 대조
  chosen_reading: 복수 명사 ‘θεοὶ’는 ‘신들’로, 단수 속격 ‘θεοῦ’는 ‘하나님의’로 구분했습니다.
  alternative_readings:
  - ‘신’/‘하나님’으로 단순화할 수 있습니다.
  rationale: 본문의 대조가 다신론적 주장에 대한 반박이므로, 복수와 단수의 차이를 한국어에서도 유지했습니다.
  doctrine_reference: 유일신 신앙
