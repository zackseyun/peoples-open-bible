translation:
  language: en
  text: You foolish Galatians! Who has put you under a spell?[a] Jesus Christ[b] was publicly portrayed before your very eyes as crucified.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Who has deceived you?” The wording pictures someone casting a harmful spell.
    reason: lexical_alternative
  - marker: b
    text: Greek “Jesus the Messiah”; “Messiah” expresses the meaning of the title “Christ.”
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: You foolish Galatians, who has bewitched you
  simplified_phrase: You foolish Galatians! Who has put you under a spell?
  preserved_meaning: Paul sharply rebukes their lack of understanding and pictures them as victims of a harmful influence.
  reasoning_layer_used: Lexical decisions for ἀνόητοι and ἐβάσκανεν
  rationale: Two short sentences make the rebuke immediate while preserving the vivid spell image.
- pob_phrase: before whose eyes
  simplified_phrase: before your very eyes
  preserved_meaning: The message about Jesus was presented to them with striking clarity and visibility.
  reasoning_layer_used: Lexical decision for οἷς κατ’ ὀφθαλμοὺς
  rationale: Direct second-person wording removes the difficult relative clause without weakening the image.
- pob_phrase: Jesus the Messiah was publicly portrayed as crucified
  simplified_phrase: Jesus the Messiah was publicly portrayed before your very eyes as crucified
  preserved_meaning: Jesus was openly and vividly presented in his crucified state, with Messiah retained as his title.
  reasoning_layer_used: Lexical and theological decisions for Ἰησοῦς Χριστός, προεγράφη, and ἐσταυρωμένος
  rationale: The reordered wording reads naturally while keeping the public-display sense and the chosen title.
translation_notes:
  risk_flags:
  - risk: “Before your very eyes” could be mistaken to mean that the Galatians personally witnessed the crucifixion.
    mitigation: “Was publicly portrayed” keeps the phrase tied to a vivid presentation rather than direct historical sight.
