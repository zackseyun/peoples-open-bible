theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Whether עבד here should be narrowed to 'worship'
  chosen_reading: to serve
  alternative_readings:
  - to worship
  rationale: The Hebrew verb can include worshipful service when God is the object, but the text itself uses the broader verb 'serve.' To preserve lexical transparency and theological breadth, 'serve' is retained in the main text and 'worship' is preserved in a footnote as a contextual alternative.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
revisions:
- timestamp: '2026-04-21T00:17:07Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/102/023.json
  category: awkward_english
  tier: 1
  from: when peoples gather together, and kingdoms to serve the LORD—
  to: when peoples and kingdoms gather together to serve the LORD—
  rationale: The Hebrew syntax presents 'peoples' (עַמִּים) and 'kingdoms' (וּמַמְלָכוֹת) as a compound subject of the infinitive 'to be gathered' (בְּהִקָּבֵץ). The current English rendering separates them, creating an awkward construction ('and kingdoms to serve the LORD') that makes 'kingdoms' seem detached from the gathering action. Combining the subjects ('when peoples and kingdoms gather together...') more accurately reflects the Hebrew grammar and results in a more natural and clear English sentence. A less disruptive alternative would be to add a comma after 'kingdoms' to clarify the parallel structure.
- timestamp: '2026-04-23T11:29:05Z'
  adjudicator: azure-gpt-5.4-revision-pass
  reviewer_model: gpt-5.4
  category: revision_pass
  from: when peoples and kingdoms gather together to serve the LORD—
  to: when peoples gather together, and kingdoms, to serve the LORD—
  rationale: Added the conjunction before 'kingdoms' to reflect the Hebrew, and removed 'together' from modifying both nouns so the syntax more closely matches the source while remaining natural in English.
- timestamp: '2026-08-28T22:08:58Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: awkward_english
  tier: 1
  from: when peoples gather together[a], and kingdoms[b], to serve Yahweh—
  to: when peoples and kingdoms gather together[a] to serve[b] Yahweh—
  rationale: The present comma-separated wording wrongly detaches “kingdoms” from the gathering and produces an unnatural English construction. Peoples and kingdoms are the coordinated parties gathered for the purpose of serving Yahweh. The active English clause is natural; the note candidly records that the Hebrew infinitive is passive in form. Both markers are placed on the expressions they explain.
- timestamp: '2026-11-09T18:44:33Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: when peoples and kingdoms gather together[a] to serve[b] Yahweh—
  to: when peoples and kingdoms gather together to serve[a] Yahweh.
  rationale: The latest revision rightly joined peoples and kingdoms as the parties gathering, correcting the earlier detached construction. I retain the broader “serve” with its worship alternative, but drop the note about passive grammatical form because it adds no necessary distinction in meaning.
