  from: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
  to: With rebukes for iniquity you discipline a man, and like a moth you consume what is precious to him[a]; surely every man is vapor[b]. Selah
  rationale: The proposed gender-neutral substitutions are not required by the Hebrew or by English clarity and conflict with the stated editorial policy of retaining the masculine forms where the source uses them. They are therefore preference-level changes. However, the existing first marker is wrongly attached to “a man,” though its note concerns the following phrase. Moving it after “what is precious to him” is a genuine editorial correction; the wording and the vapor note otherwise stand.
