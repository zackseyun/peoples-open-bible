theological_decisions:
- issue: Rendering δοῦλοι τοῦ Θεοῦ
  chosen_reading: God’s servants
  alternative_readings:
  - servants of God
  rationale: 'Reconsideration of the prior terminology decision: current servant policy uses “God’s servants.”
    Belonging, bonded status and obedience to God remain part of the explanatory force of δοῦλοι; they
    are not grounds for asserting a slave default.'
  doctrine_reference: 'Translation philosophy: contested terms (δοῦλος).'
- issue: Distinguishing πνεῦμα θεῖον and πνεῦμα ἅγιον
  chosen_reading: Render theios as “divine spirit” and hagios as “holy Spirit,” preserving Hermas’s adjectival
    nuance.
  alternative_readings:
  - Uniformly ‘Holy Spirit’ for both
  - ‘God’s Spirit’ for both
  rationale: Hermas uses both adjectives; preserving them keeps his diction and allows readers to see
    how he speaks of inspiration.
- issue: Genitive in τῶν ἐχόντων πίστιν θείου πνεύματος
  chosen_reading: faith in the divine Spirit (objective genitive)
  alternative_readings:
  - faith from the divine Spirit (source)
  - spirit‑given faith (attributive)
  rationale: Context describes the righteous as believers gathered in prayer, not the origin of their
    faith; ‘in’ reads most naturally while alternatives are plausible.
- issue: Identity of the ‘angel of the prophetic spirit’
  chosen_reading: Translate literally as an angel set over the prophet who mediates prophetic filling.
  alternative_readings:
  - Paraphrase as ‘the prophetic Spirit’ without angel
  - Interpret as metaphor for inspiration
  rationale: Hermas’s angelology features angelic overseers; the literal reading best respects his framework.
- issue: Equating consultation of false prophets with idolatry
  chosen_reading: Maintain the strong claim that consulting a false prophet about actions constitutes
    idol‑worship.
  rationale: Hermas draws a moral equivalence to pagan divination; softening would undercut his exhortation.
- issue: Translation of θεότης
  chosen_reading: Deity
  alternative_readings:
  - Godhead
  - divine nature
  rationale: ‘Deity’ communicates divine essence without archaic overtones; retains metaphysical sense
    suitable to Hermas’s contrast with earthly spirits.
- issue: Concluding exhortation πιστεύειν τῷ πνεύματι
  chosen_reading: Trust in this spirit
  alternative_readings:
  - Believe this spirit
  - Believe in this spirit
  rationale: ‘Trust in’ conveys reliance and obedience without narrowing to propositional belief; keeps
    imperative force.
- issue: Contextual repentance reassessment
  chosen_reading: Retain “often change their minds” provisionally; disclose “often repent” as an alternative
    in note b.
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: 'Reconsideration of the prior lexical interpretation: the association with double-mindedness
    and divination supports a contextual vacillation reading, but the clause does not mention baptism
    or explicitly give the direction of μετανοοῦσι. Do not add a Godward destination or present the adverse
    interpretation as unambiguous source wording.'
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- issue: Earthly versus holy reading and tests of prophets
  chosen_reading: Retain version-supported earthly correction with full Athos alternative; restore the
    tests and both upward examples.
  rationale: Follow the declared working Greek and versional evidence, without making a smooth theological
    reading into unanimous manuscript testimony.
