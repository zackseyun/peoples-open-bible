  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Force of the psalmist's claim to תֻם
  chosen_reading: integrity rather than sinless perfection
  alternative_readings:
  - blamelessness
  rationale: The verse presents a covenantal/legal appeal based on upright conduct, not an absolute claim of moral perfection. 'Integrity' preserves the theological tension without overstating the psalmist's righteousness.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
