id: JOB.34.33
reference: Job 34:33
source:
  edition: WLC
  text: הַֽ/מֵ/עִמְּ/ךָ֬ יְשַׁלְמֶ֨/נָּה כִּֽי מָאַ֗סְתָּ כִּי אַתָּ֣ה תִבְחַ֣ר וְ/לֹא אָ֑נִי וּֽ/מַה יָדַ֥עְתָּ דַבֵּֽר־־־־׃
translation:
  text: Should he repay on your terms because you have rejected it[a]? For you must choose, and not I; so say what you know.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew is difficult; literally, “Is it from you that he should repay it?” The unstated “it” may refer to God's recompense, judgment, or way of governing.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמֵעִמְּךָ
  chosen: on your terms
  alternatives:
  - from you
  - at your side
  - according to you
  lexicon: HALOT
  rationale: The idiom asks whether the recompense is to be determined in conformity with the addressee's preference, without specifying “judgment.”
- source_word: יְשַׁלְּמֶנָּה
  chosen: should he repay it
  alternatives:
  - should he recompense it
  - will he repay
  - should he make restitution for it
  lexicon: HALOT
  rationale: The feminine object suffix should be represented while its referent remains ambiguous.
- source_word: כִּי מָאַסְתָּ
  chosen: because you have rejected it
  alternatives:
  - because you have refused
  - since you have despised it
  lexicon: HALOT
  rationale: מאס commonly means 'reject, refuse, despise.' Here 'rejected it' best fits the argument that Job has refused God's way or verdict. The object is implicit in English but represented by 'it' from context.
- source_word: כִּי אַתָּה תִבְחַר וְלֹא אָנִי
  chosen: For you must choose, and not I
  alternatives:
  - For you are the one who chooses, not I
  - Because you should choose and not I
  lexicon: HALOT
  rationale: 'בחר means ''choose.'' The clause contrasts Job''s role with Elihu''s: Job must state his own position rather than Elihu deciding for him. ''Must choose'' brings out the rhetorical force in natural English.'
- source_word: וּמַה יָדַעְתָּ דַבֵּר
  chosen: so say what you know
  alternatives:
  - and what you know, speak
  - therefore speak what you know
  lexicon: HALOT
  rationale: “Say” is a close, ordinary rendering of the imperative.
