translation:
  text: 'But I do not know whether these commandments can be kept by a human being, for they are very hard.


    In reply he says to me: “If you set it before yourself that they can be kept, you will keep them easily, and they will not be hard. But if it has already risen up in your heart that they cannot be kept by a human being, you will not keep them.


    Now I say to you: if you do not keep these, but only remember them in passing, you will walk in the commandments of the devil—difficult and bitter and savage and licentious. And do not be afraid of the devil, for he has no power against you; for I will be with you—I, the angel of reorientation[r1]—who has mastery over him. The devil has only fear, and his fear has no strength. Do not therefore be afraid of him, and he will flee from you.”'
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
