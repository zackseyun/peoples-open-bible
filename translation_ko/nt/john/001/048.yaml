id: JHN.1.48
reference: John 1:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
  footnotes:
  - marker: a
    text: Or, more literally, “From where do you know me?”
    reason: lexical_alternative
translation:
  language: ko
  text: 나다나엘이 그에게 말했습니다. 「어떻게 나를 아십니까?[a]」 예수께서 대답하셨습니다. 「빌립이 너를 부르기 전에, 네가 무화과나무 아래에 있을 때 내가 너를 보았습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로 “어디서 나를 아십니까?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  english_pob_choice: How
  chosen_korean: 어떻게
  alternatives_korean:
  - 어디서
  - 어떻게 해서
  lexicon: BDAG
  rationale: Πόθεν는 문자적으로 '어디서'이지만, γινώσκεις와 결합된 관용적 질문으로 지식의 근거를 묻는다. 한국어에서 '어떻게 나를 아십니까?'가 자연스럽고 의미를 잘 전달하므로 선택했습니다.
- source_word: γινώσκεις
  english_pob_choice: do you know
  chosen_korean: 아십니까
  alternatives_korean:
  - 알고 있습니까
  - 알아보십니까
  lexicon: BDAG
  rationale: γινώσκω의 개인적 인지·지식 의미를 표준 한국어로 옮겼습니다. 정중한 질문형 '-습니까'를 사용하여 본문 서술의 격식과 어울리게 했습니다.
- source_word: συκῆν
  english_pob_choice: fig tree
  chosen_korean: 무화과나무
  alternatives_korean:
  - 무화과
  - 무화과나무 아래
  lexicon: BDAG
  rationale: συκῆν은 'fig tree'의 표준적 의미입니다. 한국어 전통 번역과 일치하도록 '무화과나무'를 선택했습니다.
- source_word: ὄντα ... εἶδόν σε
  english_pob_choice: when/while you were ... I saw you
  chosen_korean: 네가 ... 있던 것을 내가 보았습니다
  alternatives_korean:
  - 네가 ... 있을 때 내가 보았습니다
  - 너를 ... 보았습니다
  lexicon: BDAG
  rationale: 분사(ὄντα)가 상황적 배경을 제공하고, εἶδόν의 과거 시제는 단순 과거로 옮기는 것이 자연스럽습니다. 한국어에서는 '...있던 것을 내가 보았습니다'가 시제와 상황의 선후관계를 명확히 합니다.
theological_decisions:
- issue: Nature of Jesus' knowledge of Nathanael
  chosen_reading: 본문은 예수의 선지적·초자연적 능력을 설명하지 않고 단순히 이전에 보았다고 진술하므로 번역도 직설적으로 옮겼습니다.
  alternative_readings:
  - 본문을 초자연적 예지(예언적 지식)를 암시하도록 번역한다.
  - 본문을 일반적 관찰(평범한 시선)으로 완전히 환원하여 번역한다.
  rationale: 구절 자체는 메커니즘을 설명하지 않으므로 해석을 삽입하지 않고 텍스트를 그대로 전달함으로써 신학적 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: Second-person register in Jesus' address
  chosen_reading: 예수의 직접 발화에서는 그리스어 단수 2인칭(σε)에 따라 친밀한 2인칭(네/너)을 유지했습니다.
  alternative_readings:
  - 예수의 말을 한국어 정중체(당신/귀하)로 바꾼다.
  - 보다 완화된 2인칭(너)을 사용한다.
  rationale: 복음서에서 제자들 간의 직접 대화에서는 반말(친밀한 2인칭)이 흔하므로 본문 원어의 2인칭 단수성을 살려 '네가/너를'을 사용했습니다. 본문 스타일 지침(인용된 직접 어법의 register 전환 허용)을 따랐습니다.
  doctrine_reference: 'Korean target style: register shift allowed for quoted speech to disciples.'
