  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Sense of ישועה in a praise psalm
  chosen_reading: salvation
  alternative_readings:
  - victory
  - deliverance
  rationale: The Hebrew term can include rescue or victory, but 'salvation' best preserves the full semantic range and theological resonance without excluding concrete deliverance. A lexical alternative is preserved in a footnote because 'victory' is contextually plausible in a psalm of praise.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it; §5 Consistency of key terms
