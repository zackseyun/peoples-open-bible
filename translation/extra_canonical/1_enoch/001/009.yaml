translation:
  text: Look, he comes with myriads of holy ones to carry out judgment upon them[a], to destroy the godless, and to reprove all flesh for all they have done; sinners and godless ones have acted impiously against him[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Ge’ez is uncertain here, and it is unclear whom “them” refers to.
    reason: textual_variant
  - marker: b
    text: The closing words are unclear in the Ge’ez; they may describe the sinners’ impious deeds rather than make a separate statement. Jude 14–15 quotes a fuller form that also condemns sinners’ harsh words against God.
    reason: textual_variant
