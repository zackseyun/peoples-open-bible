revisions:
- from: '1[3]. 요셉은 그들의 생각과 그들 가운데 화평에 대한 생각이 있는지 알아보기 위해 계획을 세웠습니다. 그가 자기 집 청지기에게 이르되 그들의 모든 자루에 곡식을 채우고 각 사람의 돈은 그 자루 가운데에 넣고 나의 은잔 곧 내가 마시는 잔을 가장 어린 자루에 넣으라 하니라 그리고 그는 그들을 멀리 보냈습니다.

    2. 요셉이 그에게 말한 대로 하여, 그들의 모든 자루에 곡식과 돈을 가득 담아, 그들의 자루에 넣었습니다. 그리고 그 잔을 베냐민의 자루에 넣어 두었습니다. 그리고 아침이 밝자 그들은 떠났습니다.

    3. 그들이 거기서 나갈 때에 요셉이 그 집 사람에게 이르되 일어나 그들을 따라 달려가서 그들을 따라잡아 이르되 너희가 어찌하여 나의 선을 악으로 갚느냐 너희가 내 주인이 마시던 은잔을 훔치고 너희 막내 아우 FN1__을 욕하였으니 속히 그를 데려오라 내가 심판을 면할 것이 아니니이다 하니

    4. 그리고 그는 그들 뒤에 달려가서 이 말로 그들에게 말했다. 그들이 그에게 이르되 당신의 종들이 이런 일을 행함은 결단코 당신 주의 집에서 은이나 금을 도적질하는 것이 아니니이다 우리가 전에 우리 자루에 있던 돈을 당신의 종들이 땅에서 가지고 돌아왔나이다

    5. 가나안. 그러면 우리는 어떻게 물건을 훔쳐야 합니까? 보세요, 우리와 우리 자루는 그것들을 수색해 보세요. 그리고 우리 중 어느 사람의 자루 속에 있는 잔이 누구에게서든지 발견되면 그를 죽여라. 그러면 우리와 우리 당나귀들도 우리 주의 종이 될 것입니다.”

    6. 그가 그들에게 이르되 그렇지 아니하니 내가 만난 그 사람은 그 사람뿐이니라

    7. 너희는 종으로 끌려가리니 너희가 평안히 너희 집으로 돌아가리라 하시니라 그들이 장남부터 시작하여 막내까지 물건을 뒤지는데 그것이 베냐민의 자루에서 발견되었습니다.

    8. 그들은 옷을 찢고 나귀에 짐을 싣고 성으로 돌아갔습니다.

    9. 그리고 그들은 요셉의 집에 이르러, 모두 그 앞에 얼굴을 땅에 대고 엎드렸습니다. 요셉이 그들에게 이르되 너희가 악을 행하였도다 그들이 이르되 우리가 무슨 말을 하며 어떻게 속죄하리이까 우리 주께서 그 죄를 찾으셨으니

    10. 그의 종들. 보시옵소서, 우리와 우리의 당나귀들도 우리 주의 종이 되었나이다." 요셉이 그들에게 이르되 내가 결코 두려워할 일이 아니니라 너희는 너희 집으로 돌아가라 너희가 악을 행하였으니 너희 말째 아우가 내 종이 되리라 내가 이 잔으로 점치는 것 같이 사람도 자기 잔으로 점을 치는 줄을 너희가 알지 못하였느냐 그런데 너희가 그것을 내게서 도적질하였느니라

    11. 유다가 이르되 내 주여 구하옵나니 종으로 내 주의 귀에 한 말씀을 말하게 하소서 우리 아버지, 주의 종에게 한 어미에게서 두 아들이 있었나이다 하나는 나가서 잃어버렸고 그를 만난 사람이 없고 그 어미와 주의 종은 홀로 남았나이다

    12. 우리 아버지께서 그를 사랑하시므로 그의 생명이 이 사람의 생명과 연관되어 있느니라 우리가 주의 종 우리 아버지에게로 갈 때에 그가 우리와 함께 있지 아니하면 그 노인은 죽고 우리는 슬픔으로 우리 아버지를 끌어내리리이다

    13. 주의 종이 아이를 대신하여 내 주의 종으로 보증이 되어 그 노인으로 그 형제들과 함께 있게 하였으니 이는 내가 그를 주의 종 우리 아버지로 그 어미에게서 받았음이니이다 그리고 내가 그 사람을 다시 데려오지 않으면 당신의 종이 우리 아버지의 일생 동안 책임을 지게 될 것입니다.”

