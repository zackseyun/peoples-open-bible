  rationale: The immediate context strongly informs the saying, but this verse itself states the offense as 'blasphemes against the Holy Spirit.' To preserve theological tension and avoid importing a full doctrinal explanation into the translation, the main text remains close to the Greek wording.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: Text-critical variant at the end of the verse
  chosen_reading: Translate the SBLGNT reading 'eternal sin.'
  alternative_readings:
