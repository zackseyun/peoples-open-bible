id: MAT.3.8
reference: Matthew 3:8
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
translation:
  text: Therefore[a], produce fruit worthy of repentance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'fruit in keeping with repentance.'
    reason: lexical_alternative
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  chosen: produce
  alternatives:
  - bear
  - make
  lexicon: BDAG
  rationale: Aorist active imperative, second person plural, calling for decisive action. 'Produce' fits idiomatic English with 'fruit' better than the more wooden 'make,' while preserving the command's force. 'Bear' is possible in fruit imagery but is less directly tied to ποιέω here.
- source_word: οὖν
  chosen: Therefore
  alternatives:
  - then
  - so
  lexicon: BDAG
  rationale: Marks an inference from the preceding warning and exhortation. 'Therefore' preserves the logical connection clearly and naturally.
- source_word: καρπὸν
  chosen: fruit
  alternatives:
  - fruitage
  lexicon: BDAG
  rationale: Standard rendering for καρπός, here metaphorical for visible outcome or conduct. Singular is retained as a collective singular in English.
- source_word: ἄξιον
  chosen: worthy of
  alternatives:
  - fit for
  - in keeping with
  lexicon: BDAG
  rationale: ἄξιος with the genitive expresses correspondence or suitability. 'Worthy of' is the most direct formal equivalent, though the sense is that the fruit corresponds to genuine repentance.
- source_word: μετανοίας
  chosen: repentance
  alternatives:
  - reorientationd mind
  - that changed mind
  - a change of mind
  - turning
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Restore repentance and keep the distinction between repentance and its fruit. Contextual editorial assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
