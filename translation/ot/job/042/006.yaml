  value:
  - issue: 'Sense of Job''s final response: self-abasement/repentance versus recantation of his case'
    chosen_reading: 'Job expresses personal self-abasement and repentance: ''I despise myself, and I repent in dust and ashes.'''
    alternative_readings:
