id: PSA.69.7
reference: Psalms 69:7
source:
  edition: WLC
  text: כִּֽי עָ֭לֶי/ךָ נָשָׂ֣אתִי חֶרְפָּ֑ה כִּסְּתָ֖ה כְלִמָּ֣ה פָנָֽ/י־׃
translation:
  text: For your sake I have borne reproach; disgrace has covered my face.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - For
  - Because
  lexicon: HALOT
  rationale: “For” adequately marks the explanatory connection in natural English.
- source_word: עָלֶיךָ
  chosen: for your sake
  alternatives:
  - for your sake
  - on your account
  - upon you
  lexicon: HALOT
  rationale: The phrase denotes suffering reproach on God’s account and is idiomatic English.
- source_word: נָשָׂאתִי
  chosen: I have borne
  alternatives:
  - I have carried
  - I have endured
  lexicon: HALOT
  rationale: נשא commonly means 'lift, carry, bear.' With חֶרְפָּה as object, 'borne' is the most natural English collocation and preserves the metaphor of carrying reproach. Present perfect fits the completed-yet-relevant force in context.
- source_word: חֶרְפָּה
  chosen: reproach
  alternatives:
  - scorn
  - disgrace
  - taunt
  lexicon: HALOT
  rationale: חֶרְפָּה denotes insult, reproach, or public shame. 'Reproach' preserves both the verbal abuse and shame dimension and is a standard, still understandable English equivalent in Psalms.
- source_word: כִּסְּתָה
  chosen: has covered
  alternatives:
  - covered
  - has overwhelmed
  lexicon: HALOT
  rationale: The verb כסה literally means 'cover.' The perfect 3fs agrees with the following feminine subject כְלִמָּה. 'Has covered' keeps the concrete metaphor and reads naturally in English.
- source_word: כְלִמָּה
  chosen: disgrace
  alternatives:
  - shame
  - humiliation
  lexicon: HALOT
  rationale: כְלִמָּה refers to shame, dishonor, or humiliation. 'Disgrace' works well alongside 'reproach' without simple repetition, preserving the public-honor dimension. 'Shame' is also possible, but using 'disgrace' gives better lexical differentiation in English while remaining faithful.
- source_word: פָנַי
  chosen: my face
  alternatives:
  - my face/presence
  lexicon: HALOT
  rationale: Though פָּנִים can mean 'face' or 'presence,' the idiom 'covered my face' clearly points to the literal image of visible shame. 'My face' is therefore the best rendering.
