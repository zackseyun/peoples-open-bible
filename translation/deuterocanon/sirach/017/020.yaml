  confidence: high
  validation: major_mismatch
translation:
  text: Yet to those who reorient[r1] he granted a return[c][b][a], and he encouraged those who were failing in patience.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, 'he encouraged those who were failing to be patient.' The Greek wording is compact and can be understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: '''A return'' may also be understood as ''a way back'' or ''restoration.'''
    reason: lexical_alternative
  - marker: c
    text: The Greek source here is marked with source-validation uncertainty ('major mismatch'), so the exact phrasing should be held with some caution, though the overall sense is clear.
    reason: textual_variant
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  chosen: Yet
  alternatives:
  - But
  - Nevertheless
  lexicon: LSJ
  rationale: Marks a contrastive transition from the preceding context; 'Yet' is concise and natural in English while preserving the adversative force.
- source_word: μετανοοῦσιν
  chosen: to those who reorient
  alternatives:
  - to those who repent
  - to the repentant
  - to those changing their mind
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use reorient/reorientation without automatically inserting God. The sentence supplies a departure, destination, interpersonal setting, or the work's own conceptual framework. Preserve distinct turning verbs and named wrongdoing. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
- source_word: ἔδωκεν
  chosen: he granted
  alternatives:
  - he gave
  lexicon: BDAG
  rationale: Aorist of δίδωμι. 'Granted' fits the object 'a return' in smoother English while retaining the sense of giving.
- source_word: ἐπάνοδον
  chosen: a return
  alternatives:
  - a way back
  - restoration
  - returning
  lexicon: LSJ
  rationale: The noun denotes a return or way back. 'A return' stays close to the Greek and leaves open whether the sense is return to God, restoration, or recovery, avoiding over-interpretation.
- source_word: παρεκάλεσεν
  chosen: he encouraged
  alternatives:
  - he exhorted
  - he comforted
  - he called alongside
  lexicon: BDAG
  rationale: παρακαλέω can range from exhorting to comforting. In this context, with the object 'those who were failing' and the following accusative 'patience,' 'encouraged' best captures supportive strengthening without narrowing to either consolation or command.
- source_word: ἐκλείποντας
  lemma: ἐκλείπω
  chosen: those who were failing
  alternatives:
  - those who were fainting
  - those who were coming to an end
  - those who were giving out
  lexicon: LSJ
  rationale: The participle from ἐκλείπω can denote failing, fainting, or giving out. 'Those who were failing' preserves the broad sense and avoids importing a specifically physical or spiritual nuance not explicit in the Greek.
- source_word: ὑπομονήν
  chosen: with patience
  alternatives:
  - endurance
  - steadfastness
  lexicon: BDAG
  rationale: The accusative is somewhat compressed in Greek and may function as the content or means of the encouragement. 'With patience' gives clear English while preserving the core idea of enduring perseverance; 'endurance' is possible but slightly less natural here.
