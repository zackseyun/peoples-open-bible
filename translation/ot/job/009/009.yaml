id: JOB.9.9
reference: Job 9:9
source:
  edition: WLC
  text: עֹֽשֶׂה עָ֭שׁ כְּסִ֥יל וְ/כִימָ֗ה וְ/חַדְרֵ֥י תֵמָֽן־׃
translation:
  text: He makes the Bear[a], Orion, and the Pleiades[b], and the chambers of the southern sky[c].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The identification of this Hebrew constellation name is uncertain; “the Bear” is a common proposal.
    reason: lexical_alternative
  - marker: b
    text: Orion and the Pleiades are the conventional identifications of the two Hebrew star-group names.
    reason: lexical_alternative
  - marker: c
    text: Literally, “the chambers of the south”; perhaps the hidden regions or constellations of the southern sky.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  chosen: who makes
  alternatives:
  - who makes
  - maker of
  lexicon: HALOT
  rationale: The Qal participle continues the description of what God characteristically does; the English present tense preserves that force without denying the creative reference.
- source_word: עָשׁ
  chosen: the Bear
  alternatives:
  - Ash
  - the Great Bear
  - Arcturus
  lexicon: HALOT
  rationale: The term names a constellation. 'The Bear' is a clear modern English rendering of the likely referent. 'Arcturus' reflects older translation tradition but is less transparent and may be too specific; transliteration 'Ash' would obscure meaning for most readers.
- source_word: כְּסִיל
  chosen: Orion
  alternatives:
  - Kesil
  lexicon: HALOT
  rationale: In astronomical contexts this noun is widely understood as the constellation Orion. Using the standard English constellation name communicates the referent directly.
- source_word: כִימָה
  chosen: the Pleiades
  alternatives:
  - Kimah
  lexicon: HALOT
  rationale: This is conventionally identified as the star cluster Pleiades. The English astronomical name is the clearest rendering.
- source_word: חַדְרֵי תֵמָן
  chosen: the chambers of the south
  alternatives:
  - the inner rooms of the south
  - the constellations of the south
  - the chambers of Teman
  lexicon: HALOT
  rationale: Literally 'the chambers/inner rooms of the south.' In context with named constellations, the phrase likely refers to the hidden regions or star-chambers of the southern sky. The more literal 'chambers of the south' preserves the poetic imagery without over-interpreting. 'Teman' here is best taken in its directional sense 'south,' not as the place name.
