translation:
  text: And Mordecai said, “These things have come from God.
  philosophy: dynamic
lexical_decisions:
- source_word: Καὶ
  chosen: And
  alternatives:
  - Then
  - Now
  lexicon: LSJ
  rationale: Standard connective introducing the statement; 'And' preserves the simple narrative linkage without adding temporal nuance.
- source_word: εἶπεν
  chosen: said
  alternatives:
  - spoke
  - declared
  lexicon: LSJ
  rationale: Aorist of λέγω is most naturally rendered 'said' in straightforward narrative speech introduction.
- source_word: Μαρδοχαῖος
  chosen: Mordecai
  rationale: Personal name is transliterated according to project policy rather than translated.
- source_word: Παρὰ
  chosen: from
  alternatives:
  - by
  - at the hand of
  lexicon: LSJ
  rationale: With the genitive τοῦ θεοῦ, παρά commonly denotes source or origin. 'From God' best captures the sense that the events originated with God.
- source_word: τοῦ θεοῦ
  chosen: God
  alternatives:
  - the god
  lexicon: LSJ
  rationale: 'In this Jewish narrative context, ὁ θεός refers to the one true God. English idiom omits the article: ''God.'''
- source_word: ἐγένετο
  chosen: have come
  alternatives:
  - happened
  - came to pass
  - have happened
  lexicon: LSJ
  rationale: 'γίνομαι here denotes coming into being or happening. ''Have come'' works naturally with ταῦτα as the subject and pairs well with ''from God'' to express origin: ''These things have come from God.'''
- source_word: ταῦτα
  chosen: These things
  alternatives:
  - this
  - these events
  lexicon: LSJ
  rationale: Neuter plural demonstrative referring to the preceding or surrounding events. 'These things' is slightly more formal than 'this' and preserves the plural.
