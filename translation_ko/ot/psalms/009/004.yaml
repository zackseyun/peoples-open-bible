translation:
  language: ko
  text: 이는 주께서 나의 권리와 나의 송사를 옹호해 주셨고, 보좌에 앉으시어 의롭게 재판하시기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּשׁוּב
  english_pob_choice: When ... turn back
  chosen_korean: 돌아설 때
  alternatives_korean:
  - 돌아올 때
  - 물러설 때
  - 후퇴할 때
  lexicon: WLC/HALOT
  rationale: ב + שוב의 시간적 용법을 살려 자연스러운 조건·시점 표현인 ‘-을 때’로 옮겼습니다.
- source_word: אוֹיְבַי
  english_pob_choice: my enemies
  chosen_korean: 내 원수들이
  alternatives_korean:
  - 나의 적들이
  - 나를 대적하는 자들이
  lexicon: WLC/HALOT
  rationale: 1인칭 소유형 ‘my enemies’를 직역해 시적이면서도 분명한 ‘원수들’로 옮겼습니다.
- source_word: יִכָּשְׁלוּ
  english_pob_choice: they stumble
  chosen_korean: 넘어지고
  alternatives_korean:
  - 비틀거리고
  - 실족하고
  lexicon: WLC/HALOT
  rationale: כשל의 ‘넘어지다/실족하다’ 이미지를 한국어 시어에서 자연스럽게 살렸습니다.
- source_word: מִפָּנֶיךָ
  english_pob_choice: before you
  chosen_korean: 당신 앞에서
  alternatives_korean:
  - 당신의 임재 앞에서
  - 당신의 얼굴 앞에서
  lexicon: WLC/HALOT
  rationale: 문자적으로는 ‘당신의 얼굴/임재로부터’이지만, 시편 문맥에서는 하나님 앞에서의 위치를 나타내는 관용으로 이해되어 ‘당신 앞에서’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 임재와 심판의 방식
  chosen_reading: 원수들이 하나님의 임재 앞에서 넘어지고 멸망한다는 진술을 유지하고, 심판이 어떻게 작동하는지는 덧붙여 설명하지 않았습니다.
  alternative_readings:
  - 하나님이 직접 원수들을 멸하신다
  - 원수들이 하나님의 모습을 보고 스스로 무너진다
  rationale: 히브리어는 결과와 장소를 말할 뿐 기제를 상세히 설명하지 않으므로, 본문의 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: 신학적 긴장을 해소하지 말고 보존한다.'
