  from: From oppression and violence he will redeem their life[a][b], and their blood will be precious in his eyes.
  to: From oppression and violence he will redeem their lives[a], and their blood will be precious in his eyes.
  rationale: תּוֹךְ in this verse means oppression, injury, or abusive treatment, not the spatial noun “midst”; “from oppression and violence” is correct. Though נפשם is formally singular with a plural suffix, English idiom requires the distributive plural “their lives” when referring to multiple vulnerable persons. The concrete image “their blood” is rightly retained.
