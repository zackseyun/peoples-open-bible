- from: 그러나 저는 주님께 부르짖었습니다. 아침에 제 기도가 주님 앞에 나아갑니다.[a]
  to: 야훼여, 어찌하여 저를 버리시며, 어찌하여 얼굴을 제게서 숨기십니까?[a]
  rationale: 원문 절의 두 탄식 질문을 복원했습니다. תִּזְנַח는 ‘버리시며’로, תַּסְתִּיר פָּנֶיךָ מִמֶּנִּי는 직역적 이미지를 살려 ‘얼굴을 제게서 숨기십니까’로 옮겼습니다. 두 번째 ‘어찌하여’는 히브리어에서 첫 의문사가 두 동사에 걸쳐 작용하는 구조를 한국어에서 명료하고 자연스럽게 드러냅니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:12:00Z'
