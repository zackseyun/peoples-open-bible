id: 2CH.31.19
reference: 2 Chronicles 31:19
source:
  edition: WLC
  text: וְ/לִ/בְנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֜ים בִּ/שְׂדֵ֨י מִגְרַ֤שׁ עָרֵי/הֶם֙ בְּ/כָל עִ֣יר וָ/עִ֔יר אֲנָשִׁ֕ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לָ/תֵ֣ת מָנ֗וֹת לְ/כָל זָכָר֙ בַּ/כֹּ֣הֲנִ֔ים וּ/לְ/כָל הִתְיַחֵ֖שׂ בַּ/לְוִיִּֽם־־־׃
translation:
  text: For the priests descended from Aaron who lived in the pasturelands around their cities, men were designated by name in every city to distribute portions to every male among the priests and to everyone registered by genealogy among the Levites.
  philosophy: dynamic
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  chosen: And for the sons of Aaron, the priests
  alternatives:
  - And for the descendants of Aaron the priests
  - And for the Aaronic priests
  lexicon: HALOT
  rationale: בני literally means 'sons,' but in genealogical/tribal contexts can denote descendants. 'Sons of Aaron' preserves the Hebrew form while appositionally clarifying with 'the priests.'
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  chosen: in the pasture lands of their cities
  alternatives:
  - in the fields of the common lands of their cities
  - in the open lands around their cities
  lexicon: HALOT
  rationale: מִגְרָשׁ refers to the open land/common pasture surrounding Levitical cities. 'Pasture lands' is natural English and fits the land-use sense better than a wooden 'suburbs' or overly vague 'fields.'
- source_word: בְּכָל עִיר וָעִיר
  chosen: in every single city
  alternatives:
  - in every city
  - in each and every city
  lexicon: HALOT
  rationale: The distributive repetition 'city and city' emphasizes comprehensiveness. 'Every single city' captures that force in readable English.
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  chosen: there were men designated by name
  alternatives:
  - men who were specified by name
  - men who were appointed by name
  - men who were listed by name
  lexicon: HALOT
  rationale: נִקְּבוּ בְּשֵׁמוֹת conveys being identified/registered specifically by name. 'Designated by name' preserves the formal administrative sense without overcommitting to either appointment or mere listing.
- source_word: לָתֵת מָנוֹת
  chosen: to give portions
  alternatives:
  - to distribute shares
  - to give allotted portions
  lexicon: HALOT
  rationale: מָנוֹת commonly denotes portions or shares distributed from provisions. 'Give portions' is concise and fits the provisioning context of the chapter.
- source_word: לְכָל זָכָר בַּכֹּהֲנִים
  chosen: to every male among the priests
  alternatives:
  - to every male of the priests
  - to every man among the priests
  lexicon: HALOT
  rationale: זָכָר is specifically 'male,' not the more general 'man.' 'Among the priests' expresses the partitive sense naturally in English and preserves the gender-specific wording of the Hebrew.
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  chosen: and to everyone enrolled by genealogy among the Levites
  alternatives:
  - and to all who were registered by genealogy among the Levites
  - and to everyone reckoned by genealogy among the Levites
  lexicon: HALOT
  rationale: The hitpael of יחס refers to being enrolled/registered in genealogical records. 'Enrolled by genealogy' is clear modern English and preserves the administrative-genealogical nuance.
