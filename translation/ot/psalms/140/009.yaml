id: PSA.140.9
reference: Psalms 140:9
source:
  edition: WLC
  text: רֹ֥אשׁ מְסִבָּ֑/י עֲמַ֖ל שְׂפָתֵ֣י/מוֹ יכסו/מו׃
translation:
  text: Let the harm from the lips of those who surround me cover their own heads[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “As for the leader of those who surround me, let the harm from their lips cover them.” Hebrew “head” is singular.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאשׁ
  chosen: head
  alternatives:
  - chief
  - sum
  - top
  lexicon: HALOT
  rationale: The noun literally means 'head.' In this syntax it is best taken as the subject/topic of the clause ('the head of those who surround me'), not idiomatically paraphrased away. 'Head' preserves the concrete imagery and allows the following verb 'cover' to make sense.
- source_word: מְסִבָּי
  chosen: those who surround me
  alternatives:
  - my surrounders
  - my besiegers
  - my enemies around me
  lexicon: HALOT
  rationale: From the root סבב, with 1cs suffix, referring to people around the psalmist. 'Those who surround me' is natural modern English and preserves the hostile encirclement implied by the context without over-specifying 'besiegers'.
- source_word: עֲמַל
  chosen: trouble
  alternatives:
  - mischief
  - harm
  - toil
  - wickedness
  lexicon: HALOT
  rationale: The noun can denote trouble, mischief, or harmful labor. Here, linked with 'their lips,' it refers to the harmful effect or mischief produced by their speech. 'Trouble' is readable and broad enough to preserve the semantic range.
- source_word: שְׂפָתֵימוֹ
  chosen: their lips
  alternatives:
  - their speech
  - their mouth
  lexicon: HALOT
  rationale: Literally 'their lips.' Keeping the body-part term preserves the Hebrew poetic concreteness and the connection between speech and its consequences.
- source_word: יכסומו
  chosen: let ... cover them
  alternatives:
  - will cover them
  - overwhelm them
  - conceal them
  lexicon: HALOT
  rationale: 'The verb כסה means ''cover.'' In context it is best rendered as a jussive/imprecatory wish: ''let ... cover them.'' This matches the psalm''s prayer tone and avoids flattening it into a mere prediction.'
- source_word: רֹאשׁ מְסִבָּי
  chosen: the head of those who surround me
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Retains the Hebrew singular and its ambiguity rather than silently pluralizing it.
- source_word: עֲמַל שְׂפָתֵימוֹ
  chosen: the trouble from their lips
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Expresses the harmful effect generated by their speech while retaining the concrete image of lips.
