  text: When it is time to depart, do not linger; go home and do what pleases you.
translation:
  language: ko
  text: 식사 자리에서는 말을 많이 하지 마십시오. 마음에 할 말이 떠오르더라도 그러하십시오. 떠날 때가 되면 머뭇거리지 말고, 집으로 돌아가 원하는 일을 이루십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בעת שלחן
  english_pob_choice: When it is time to depart
  chosen_korean: 잔치 자리에선
  alternatives_korean:
  - 식탁에서
  - 음식상 앞에서
  - 식사할 때
  lexicon: בעת + שלחן
  rationale: 히브리어는 문자적으로는 ‘식탁의 때’이지만, 문맥상 식사 자리에서의 처신을 가리키므로 POB의 ‘depart’보다 앞 절의 상황을 반영해 자연스럽게 ‘잔치 자리’로 옮겼습니다.
- source_word: אל תרבה דברים
  english_pob_choice: do not linger
  chosen_korean: 말을 많이 하지 마십시오
  alternatives_korean:
  - 말을 늘이지 마십시오
  - 말을 많이 하지 말고
  - 장황하게 말하지 마십시오
  lexicon: רבה דברים
  rationale: 히브리어는 ‘말을 많이 하다/장황하게 하다’의 뜻이므로, 한국어에서는 잔치 자리에서의 과다한 발화를 직접적으로 풀어 옮겼습니다.
- source_word: בעת מפקד
  english_pob_choice: When it is time to depart
  chosen_korean: 길을 떠날 때가 되면
  alternatives_korean:
  - 떠날 때가 되면
  - 헤어질 때가 되면
  - 출발할 때가 되면
  lexicon: בעת מפקד
  rationale: מפקד는 여기서 ‘정리하여 떠남, 출발’의 맥락으로 읽히므로, 문장의 흐름을 따라 ‘길을 떠날 때’로 번역했습니다.
- source_word: פטר לביתך
  english_pob_choice: go home
  chosen_korean: 집으로 가서
  alternatives_korean:
  - 집에 가서
  - 자기 집으로 돌아가서
  lexicon: פטר לביתך
  rationale: 히브리어는 집으로 돌아가라는 뜻을 분명히 하므로, 동작의 방향을 살려 간결하게 옮겼습니다.
- source_word: ושלם רצון
  english_pob_choice: do what pleases you
  chosen_korean: 하고 싶은 대로 하십시오
  alternatives_korean:
  - 뜻대로 하십시오
  - 마음에 드는 대로 하십시오
  - 바라는 대로 하십시오
  lexicon: שלם רצון
  rationale: POB가 ‘what pleases you’로 유지한 표현을 따라, רצון을 ‘원함/원하는 것’의 뜻으로 받아 한국어에서도 ‘하고 싶은 대로’로 옮겼습니다.
theological_decisions:
- issue: POB의 최종 영어가 앞절의 식사 규범을 생략하고 ‘떠날 때’ 중심으로 정리된 점
  chosen_reading: 히브리어 본문이 보여 주는 두 권면—식사 자리에서 말을 많이 하지 말 것과 떠날 때 머뭇거리지 말 것—을 모두 살립니다.
  alternative_readings:
  - 영문 POB를 따라 ‘떠날 때가 되면…’만 두고 앞절 의미를 더 약화시키는 읽기
  - 식사 장면 전체를 누락하는 읽기
  rationale: 이 절의 히브리어는 두 개의 평행 권면으로 구성되어 있으므로, POB의 축약된 영어만 따르지 않고 원문의 청중 효과를 보존했습니다.
  doctrine_reference: 지혜문학의 문맥 보존
