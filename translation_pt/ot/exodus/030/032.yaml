  source_fidelity: 'A primeira proibição e a declaração de santidade são bem traduzidas. Porém, «nem fareis outro igual, com a mesma composição» reorganiza a construção hebraica de modo algo solto: «outro» não tem antecedente expresso e «com a mesma composição» pode soar como informação acessória, em vez de qualificar precisamente a proibição de reproduzir a mistura segundo a sua fórmula.'
  naturalness: «Carne humana» é natural e preserva o valor genérico de אָדָם. A redação revista torna a segunda proibição mais clara em português atual sem perder o tom formal do versículo. «Vós» é aceitável para o registro bíblico adotado.
  terminology: «Derramado», «carne», «composição» e «santo» correspondem adequadamente aos termos-chave hebraicos. «Conforme a sua composição» expressa de forma direta בְּמַתְכֻּנְתּוֹ.
  issues:
