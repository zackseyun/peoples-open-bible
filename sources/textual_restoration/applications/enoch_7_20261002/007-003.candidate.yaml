translation:
  text: They consumed everything people had labored for, until people could no longer
    feed them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Charles 1906 places daggers around the conjunction rendered “until” and
      discusses an emended connective in the apparatus. The main text follows the
      printed connective provisionally; the uncertain reading is not presented as
      undisputed.
    reason: textual_variant
lexical_decisions:
- source_word: እለ፡ በልዑ
  chosen: They consumed
  alternatives:
  - who ate
  - who devoured
  rationale: The Ge’ez begins with a relative clause referring to the offspring in
    the preceding verse. An independent clause makes this verse readable without changing
    its referent.
- source_word: ኵሎ፡ ጻማ፡ ሰብእ
  chosen: everything people had labored for
  alternatives:
  - all the toil of humankind
  - all the produce of human labor
  rationale: ጻማ denotes toil or labor; in this context it refers to what people gained
    through that labor, which the eaters consumed.
- source_word: እስከ፡ ስእኑዎሙ፡ ሰብእ፡ ሴስዮቶ
  chosen: until people could no longer feed them
  alternatives:
  - and people were unable to feed them
  rationale: This preserves the stated limit on people’s ability to provide food,
    while retaining the supplied reading of እስከ as ‘until.’
theological_decisions:
- issue: Referent of ‘they’ and ‘them’
  chosen_reading: The offspring described in the preceding verse
  rationale: The pronouns follow the local narrative context; no later identification
    or doctrinal language is imported.
