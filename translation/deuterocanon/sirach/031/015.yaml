  rationale: Per project philosophy, the surviving Hebrew of Sirach is primary where extant. Because the Greek parallel is not a close equivalent here but a different sentence, it is treated as evidence of textual instability rather than as the base text. The English therefore translates the Hebrew while documenting the divergence in a footnote.
