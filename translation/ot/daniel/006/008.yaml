  from: 'All the high officials of the kingdom[a], the prefects and satraps, the counselors and governors, have agreed together to establish a royal statute and to enforce an injunction: that whoever makes a petition to any god or man for thirty days, except to you, O king[c][b], shall be thrown into the lions’ den.'
  to: '“All the high officials of the kingdom, the prefects and satraps, the counselors and governors, have agreed to establish a royal statute and impose a binding injunction: anyone who, during the next thirty days, makes a petition to any god or person other than you, O king, shall be thrown into the lions’ den.”'
  rationale: I retain the official titles, the speakers’ claim of universal agreement, and the broad term “petition,” rather than narrowing the ban to prayer. The lexical rationale itself identifies the disputed legal action as making a prohibition binding, which the new wording expresses directly.
