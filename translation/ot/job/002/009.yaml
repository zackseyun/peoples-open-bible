  to: Then his wife said to him, “Are you still holding fast to your integrity? Curse God[a] and die.”
  rationale: In this prologue context, בָּרֵךְ is a reverential euphemism for cursing God, as its parallel uses in 1:11 and 2:5 show. Literal “Bless God” in the text misstates the wife’s intended challenge in English. The note preserves the written Hebrew form. The marker should follow “God,” where it clearly qualifies the imperative phrase, rather than sit outside the closing quotation.
