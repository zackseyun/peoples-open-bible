id: PSA.104.31
reference: Psalms 104:31
source:
  edition: WLC
  text: יְהִ֤י כְב֣וֹד יְהוָ֣ה לְ/עוֹלָ֑ם יִשְׂמַ֖ח יְהוָ֣ה בְּ/מַעֲשָֽׂי/ו׃
translation:
  text: May the glory of Yahweh endure forever; may Yahweh rejoice in his works.
  philosophy: dynamic
lexical_decisions:
- source_word: יְהִי
  chosen: May ... endure
  alternatives:
  - Let ... be
  - May ... be
  lexicon: HALOT
  rationale: The jussive wish, together with לְעוֹלָם, is naturally expressed in English as “May ... endure forever.”
- source_word: כְבוֹד
  chosen: glory
  alternatives:
  - honor
  - majesty
  lexicon: HALOT
  rationale: '''Glory'' is the standard rendering for כָּבוֹד and fits the psalm''s doxological context, preserving the weight and splendor associated with the LORD.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: לְעוֹלָם
  chosen: forever
  alternatives:
  - for ever
  - for eternity
  - endure forever
  lexicon: HALOT
  rationale: The phrase denotes enduring duration. 'Forever' is natural modern English and preserves the temporal force without archaism.
- source_word: יִשְׂמַח
  chosen: may ... rejoice
  alternatives:
  - let ... rejoice
  - be glad
  lexicon: HALOT
  rationale: Imperfect/jussive-like sense parallels the first clause as a wish. 'Rejoice' is stronger and more fitting than 'be glad' in this poetic context.
- source_word: בְּמַעֲשָׂיו
  chosen: in his works
  alternatives:
  - in what he has made
  - over his works
  - in his deeds
  lexicon: HALOT
  rationale: מַעֲשֶׂה here refers broadly to God's created works in the context of Psalm 104. 'In his works' is formally close and idiomatic; 'over his works' is possible interpretively, but the preposition ב is adequately represented by 'in.'
