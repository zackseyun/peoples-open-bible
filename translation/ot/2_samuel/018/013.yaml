reference: 2 Samuel 18:13
source:
  edition: WLC
  text: אֽוֹ עָשִׂ֤יתִי ב/נפש/ו שֶׁ֔קֶר וְ/כָל דָּבָ֖ר לֹא יִכָּחֵ֣ד מִן הַ/מֶּ֑לֶךְ וְ/אַתָּ֖ה תִּתְיַצֵּ֥ב מִ/נֶּֽגֶד־־־־׃
translation:
  text: If I had treacherously taken his life[a]—and nothing is hidden from the king—you yourself would have kept your distance[b].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The written Hebrew text has “his life”; the traditional reading has “my life,” which can mean, “If I had acted treacherously at the cost of my own life.”
    reason: textual_variant
  - marker: b
    text: Or, “would have turned against me.”
    reason: alternative_reading
