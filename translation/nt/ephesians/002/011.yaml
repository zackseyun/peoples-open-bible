theological_decisions:
- issue: Rendering of σάρξ in a non-moral context
  chosen_reading: flesh
  alternative_readings:
  - body
  - physical nature
  rationale: The doctrine guidance specifies 'flesh' for literal contexts and 'sinful nature' only for metaphorical ones. Here Paul contrasts ethnic/covenantal bodily status, not moral corruption, so 'flesh' should be preserved.
  doctrine_reference: 'DOCTRINE.md: Contested terms table, σάρξ'
- issue: Force of λεγομένης with περιτομή
  chosen_reading: what is called 'circumcision'
  alternative_readings:
  - the so-called circumcision
  - the circumcision
  rationale: Paul's repetition of 'called' for both groups creates rhetorical symmetry and likely relativizes merely external identity markers. The translation preserves that tension without importing a stronger anti-Jewish tone.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
