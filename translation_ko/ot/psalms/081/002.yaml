    text: 히브리어 ‘수금’(כִּנּוֹר)과 ‘비파’(נָבֶל)는 서로 구별되는 현악기이지만, 오늘날의 악기 분류와 정확히 대응시키기는 어렵습니다. 각각 ‘리라’와 ‘하프’ 또는 ‘류트’ 등으로 옮기기도 합니다.
