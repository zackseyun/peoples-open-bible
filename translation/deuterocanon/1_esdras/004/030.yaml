  text: καὶ ἀφαιροῦσαν τὸ διάδημα ἀπὸ τῆς κεφαλῆς τοῦ βασιλέως καὶ ἐπιτιθοῦσαν αὐτῇ· καὶ ἐράπιζεν τὸν βασιλέα τῇ ἀριστερᾷ.
