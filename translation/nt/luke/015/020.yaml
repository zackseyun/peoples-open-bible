  meaning_decisions:
  - source_phrase: καὶ ἀναστὰς
    prior_rendering: And he arose
    new_rendering: So he got up
    rationale: The action fulfills the resolve expressed in the preceding verses; “so” makes that connection clear, while “got up” naturally expresses the physical action.
  - source_phrase: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
    prior_rendering: came to his father
    new_rendering: went to his father
    rationale: English naturally uses “went” when following the son's departure toward his father; the Greek verb permits either viewpoint.
  - source_phrase: δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
    prior_rendering: ran and fell on his neck
    new_rendering: ran to him, threw his arms around his neck
    rationale: “Fell on his neck” means an eager embrace, not a physical fall. The new wording conveys that meaning while preserving the vivid bodily image; the direction of the father's running is implicit in the source.
