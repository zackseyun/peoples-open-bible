  meaning: Cheerful singing offered to someone in distress can aggravate rather than relieve that person’s suffering.
  meaning_decisions:
  - source_phrase: וְשָׁר בַּשִּׁרִים עַל לֶב רָע
    prior_rendering: one who sings songs to a troubled heart
    new_rendering: Singing cheerful songs to a troubled heart
    rationale: The comparisons concern inappropriate cheerfulness in the presence of sorrow, not lament or every kind of singing; the supplied adjective makes that contextual distinction clear.
  - source_phrase: מַעֲדֶה בֶּגֶד בְּיוֹם קָרָה
    prior_rendering: Like one who takes off a garment on a cold day
    new_rendering: like taking away a garment on a cold day
    rationale: “Taking away” better communicates the removal of needed warmth, rather than suggesting an incidental act of undressing.
  - source_phrase: מַעֲדֶה בֶּגֶד ... חֹמֶץ עַל נָתֶר וְשָׁר
    prior_rendering: Like one who takes off a garment ... and like vinegar on alkali, is one who sings
    new_rendering: Singing ... is like taking away a garment ... and like vinegar on alkali
    rationale: Placing the subject first makes the comparison readily intelligible without losing either image.
