  text: καὶ ἴδεν Ἰούδας ἅπαν τὴν κακίαν ἣν ἐποίησεν Ἄλκιμος καὶ οἱ μετ’ αὐτοῦ ἐν υἱοῖς Ἰσραὴλ ὑπὲρ τὰ ἔθνη.
