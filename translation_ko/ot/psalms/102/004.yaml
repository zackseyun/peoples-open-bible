  yaml_path: translation/ot/psalms/102/004.yaml
  text: My heart is struck down and withered like grass, for I forget to eat my bread.[a][b]
  footnotes:
  - marker: a
    text: “My bread” may also mean “my food” more generally.
    reason: lexical_alternative
  - marker: b
    text: Or “I have forgotten to eat my bread”; the Hebrew perfect may describe ongoing distress or a completed action with present effect.
    reason: alternative_reading
translation:
  language: ko
  text: 내 마음은 풀처럼 맞아 시들었으니,[c] 내가 내 빵[b] 먹기를 잊었기[a] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 완료형은 ‘내가 내 빵 먹기를 잊었습니다’로도, 고난 가운데 계속되는 상태를 나타내어 ‘잊고 있습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 빵’은 더 넓게 ‘내 음식’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 마음은 풀처럼 맞고 시들었습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이기 때문입니다
  lexicon: HALOT
  rationale: 원문의 원인 제시를 한국어 설명문으로 자연스럽게 옮기되, 시적 문맥의 인과관계를 분명히 살리기 위해 ‘이는 … 때문입니다’를 택했습니다.
- source_word: כָלוּ בְעָשָׁן
  english_pob_choice: my days vanish like smoke
  chosen_korean: 내 날들이 연기처럼 사라지고
  alternatives_korean:
  - 내 날들이 연기처럼 없어지고
  - 내 날들이 연기 속에서 사라지고
  lexicon: HALOT
  rationale: ‘כָלוּ’의 소멸·소진 의미를 ‘사라지고’로 담고, ‘בְעָשָׁן’을 비교적 이미지가 분명한 ‘연기처럼’으로 처리해 시적 비유를 유지했습니다.
- source_word: וְעַצְמוֹתַי כְּמוֹ קֵד נִחָרוּ
  english_pob_choice: and my bones burn like a hearth
  chosen_korean: 내 뼈는 화덕처럼 타오르기
  alternatives_korean:
  - 내 뼈는 화로처럼 타오르기
  - 내 뼈는 아궁이처럼 달아오르기
  - 내 뼈는 불쇠처럼 그슬리기
  lexicon: HALOT
  rationale: ‘קֵד’의 정확한 지시물이 불확실하다는 본문 문제를 반영해, 한국어에서는 ‘화덕처럼’으로 열기와 타는 이미지를 살리되 너무 단정적인 특정 물건으로 고정하지 않도록 했습니다. ‘נִחָרוּ’는 강한 열에 의해 타는 의미를 ‘타오르다’로 옮겼습니다.
