    prior_rendering: having the eyes of your heart enlightened
    new_rendering: May the eyes of your heart be enlightened
    rationale: The participle belongs to the prayer for spiritual perception; the new wording expresses the prayed-for enlightened state while retaining the heart's eyes as an image.
  - source_phrase: ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ
    prior_rendering: the hope of his calling
    new_rendering: the hope to which he has called you
    rationale: The calling is God's summons of the readers into a promised hope, not uncertainty about whether God will call.
  - source_phrase: ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις
    prior_rendering: the wealth of the glory of his inheritance among the saints
    new_rendering: the glorious riches of the inheritance he has in his holy people
    rationale: The compressed genitives become natural English, and the likely sense is God's people as his own treasured inheritance, consistent with the preceding possession language. The alternative inheritance-given-to-believers reading is footnoted.
