id: JOB.9.19
reference: Job 9:19
source:
  edition: WLC
  text: אִם לְ/כֹ֣חַ אַמִּ֣יץ הִנֵּ֑ה וְ/אִם לְ֝/מִשְׁפָּ֗ט מִ֣י יוֹעִידֵֽ/נִי־־׃
translation:
  text: If it comes to strength, look—he is mighty! If it comes to justice, who can arrange a hearing for me[a]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'Or, “who can summon me?” Some understand this as God''s challenge: “Who can summon me to court?”'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  chosen: If
  alternatives:
  - If it is a matter of
  - As for
  lexicon: HALOT
  rationale: Introduces the first conditional or hypothetical case. In English, simple 'If' is natural, while the fuller sense is carried by the following phrase.
- source_word: לְכֹחַ
  chosen: it is a matter of strength
  alternatives:
  - for strength
  - as to strength
  - in strength
  lexicon: HALOT
  rationale: 'The preposition ל with כֹּחַ here frames the category under discussion: ''with respect to strength'' or ''if it concerns strength.'' Expanded slightly for idiomatic English while preserving the forensic, comparative structure of the verse.'
- source_word: אַמִּיץ
  chosen: mighty
  alternatives:
  - strong
  - powerful
  lexicon: HALOT
  rationale: Describes overwhelming strength. 'Mighty' fits the elevated tone and avoids redundancy with the preceding noun 'strength' while still reflecting the adjective's force.
- source_word: הִנֵּה
  chosen: look
  alternatives:
  - look
  - indeed
  - see
  lexicon: HALOT
  rationale: A natural modern attention marker for the emphatic particle.
- source_word: וְאִם
  chosen: and if
  alternatives:
  - or if
  - but if
  lexicon: HALOT
  rationale: Coordinates the second conditional branch with the first. 'And if' best reflects the Hebrew conjunction without overinterpreting the relationship.
- source_word: לְמִשְׁפָּט
  chosen: a matter of judgment
  alternatives:
  - for judgment
  - as to legal judgment
  - for a case at law
  lexicon: HALOT
  rationale: The noun concerns a judicial proceeding or case in this context.
- source_word: מִי
  chosen: who
  alternatives:
  - who is there that
  lexicon: HALOT
  rationale: Straightforward interrogative introducing the rhetorical question.
- source_word: יוֹעִידֵנִי
  chosen: can summon me
  alternatives:
  - can appoint him for trial
  - can cite him
  - can summon me
  lexicon: HALOT
  rationale: The attached suffix is explicitly first-person singular; the Hiphil can denote summoning or setting an appointed meeting.
