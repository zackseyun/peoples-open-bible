  alternative_readings:
  - A boast that Jerusalem protects its inhabitants like a pot protects meat
  - A sarcastic slogan minimizing the urgency of judgment
  rationale: The verse presents a proverb whose force is clarified by the wider context, but the translation should preserve the image rather than interpret it in the main text.
  doctrine_reference: Preserve theological tension rather than resolve it.
