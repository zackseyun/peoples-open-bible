  text: גַּם אַ֭שּׁוּר נִלְוָ֣ה עִמָּ֑/ם הָ֤י֥וּ זְר֖וֹעַ לִ/בְנֵי ל֣וֹט סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/008.yaml
  text: Even Assyria joined with them; they were an arm[a] for the sons of Lot[b]. Selah
  footnotes:
  - marker: a
    text: Or “they were strength” or “they were help.” The Hebrew literally reads “they were an arm,” a metaphor of military support.
    reason: lexical_alternative
  - marker: b
    text: “Sons of Lot” likely refers to Lot's descendant peoples, especially Moab and Ammon.
    reason: cross_reference
translation:
  language: ko
  text: 앗수르도 그들과 연합하였으며, 롯의 자손들에게 팔이 되었습니다[a][b]. 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘롯의 자손들에게 팔이 되었습니다’입니다. ‘팔’은 힘이나 군사적 도움을 비유적으로 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘롯의 자손들’은 롯의 후손 민족들, 특히 모압과 암몬을 가리키는 것으로 보입니다.
    reason: cross_reference
lexical_decisions:
- source_word: גְּבָל
  english_pob_choice: Gebal
  chosen_korean: 게발
  alternatives_korean:
  - 비블로스
  lexicon: HALOT
  rationale: 히브리어 고유지명은 음역하는 것이 원칙이므로, 본문 형태를 따라 게발로 옮겼습니다. 영어 주석의 비블로스는 가능한 역사적 동일시이지만 본문 자체의 표기는 아닙니다.
- source_word: וְעַמּוֹן
  english_pob_choice: Ammon
  chosen_korean: 암몬
  alternatives_korean:
  - 암몬 족속
  - 암몬 사람들
  lexicon: HALOT
  rationale: 지명/민족명 고유형을 표준 음역으로 살렸습니다.
- source_word: וַעֲמָלֵק
  english_pob_choice: Amalek
  chosen_korean: 아말렉
  alternatives_korean:
  - 아말렉 족속
  - 아말렉 사람들
  lexicon: HALOT
  rationale: 고유 민족명을 한국어 성경에서 통용되는 음역으로 옮겼습니다.
- source_word: פְּלֶשֶׁת
  english_pob_choice: Philistia
  chosen_korean: 블레셋
  alternatives_korean:
  - 블레셋 땅
  - 블레셋 사람들
  lexicon: HALOT
  rationale: 영어 POB가 지역명 Philistia를 택했지만, 한국어에서는 해당 지명과 민족명이 겹치는 경우가 많아 본문 흐름상 자연스럽고 간결한 블레셋을 사용했습니다. 이는 지역을 가리키는 뉘앙스를 유지하면서도 독자가 즉시 알아볼 수 있게 합니다.
- source_word: יֹשְׁבֵי צֽוֹר
  english_pob_choice: the inhabitants of Tyre
  chosen_korean: 두로의 주민들
  alternatives_korean:
  - 두로에 사는 사람들
  - 두로의 거주민들
  lexicon: HALOT
  rationale: 구문 의미인 ‘두로에 거주하는 사람들’을 자연스러운 현대 한국어로 옮겼습니다. ‘주민들’은 construct 구문의 집합적 의미를 잘 살립니다.
