  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד הִנֵּה֩ בִתִּ֨/י הַ/גְּדוֹלָ֤ה מֵרַב֙ אֹתָ/הּ֙ אֶתֶּן לְ/ךָ֣ לְ/אִשָּׁ֔ה אַ֚ךְ הֱיֵה לִּ֣/י לְ/בֶן חַ֔יִל וְ/הִלָּחֵ֖ם מִלְחֲמ֣וֹת יְהוָ֑ה וְ/שָׁא֣וּל אָמַ֗ר אַל תְּהִ֤י יָדִ/י֙ בּ֔/וֹ וּ/תְהִי ב֖/וֹ יַד פְּלִשְׁתִּֽים־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: ko
  text: 그때 사울이 다윗에게 말했습니다. “보십시오, 내 큰딸 메랍을 내가 당신에게 아내로 주겠습니다. 다만 당신은 나를 위해 용맹한 사람이 되어 야훼의 전쟁들을 치르십시오.” 사울은 말했습니다. “내 손은 그를 해치지 않고, 블레셋 사람들의 손이 그를 해치게 하리라.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 봐요
  - 여기 보십시오
  lexicon: הִנֵּה
  rationale: 호명하며 주의를 끄는 용법을 살려, 현대 합쇼체에서 자연스럽고 직접적인 ‘보십시오’로 옮겼습니다.
- source_word: בִתִּי הַגְּדוֹלָה
  english_pob_choice: my older daughter
  chosen_korean: 내 큰딸
  alternatives_korean:
  - 내 맏딸
  - 내 누이딸
  lexicon: בַּת
  rationale: ‘older’의 순서·서열 의미를 담으면서도 한국어에서 가장 자연스러운 가족 호칭으로 정리했습니다.
- source_word: בֶן חַיִל
  english_pob_choice: a valiant man
  chosen_korean: 용맹한 사람
  alternatives_korean:
  - 용사
  - 유능한 장사
  - 큰 용사의 사람
  lexicon: בֶּן־חַיִל
  rationale: 구문상 ‘~의 아들’ 직역보다, 인격적 자질을 요구하는 관용구로서 ‘용맹한 사람’이 의미를 더 정확히 드러냅니다.
- source_word: מִלְחֲמוֹת יְהוָה
  english_pob_choice: the LORD’s battles
  chosen_korean: 야훼의 전쟁들
  alternatives_korean:
  - 주의 전쟁들
  - 여호와의 전쟁들
  - 하나님의 전쟁들
  lexicon: מִלְחָמָה + יהוה
  rationale: YHWH를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 복수형 ‘전쟁들’을 유지해 하나님의 전투들을 가리키는 표현을 살렸습니다.
theological_decisions:
- issue: 사울의 동기 설명과 인물 발화의 이중 구조
  chosen_reading: 본문의 직접 인용과 서술자의 의도 설명을 모두 분리해, 사울의 말과 그 숨은 의도를 함께 드러냈습니다.
  alternative_readings:
  - 사울이 말했습니다… 왜냐하면…
  - 사울은 속으로 생각했습니다…
  rationale: 히브리어 본문은 사울의 발언 뒤에 서술자의 해설을 붙여 동기를 밝히므로, 인용부와 서술을 분리해 독자가 전략적 의도를 놓치지 않게 했습니다.
  doctrine_reference: 문맥 해석 / 서술자 의도
- issue: ‘야훼의 전쟁들’의 직접성 유지
  chosen_reading: 전통적 완화 표현 대신 ‘야훼의 전쟁들’을 유지했습니다.
  alternative_readings:
  - 주의 전쟁들
  - 하나님의 전쟁들
  rationale: 본문이 왕실 전략과 대비되는 여호와 중심의 전쟁 개념을 분명히 하므로, 고유명사 신학을 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 하나님의 주권 / 언약 공동체의 전쟁
