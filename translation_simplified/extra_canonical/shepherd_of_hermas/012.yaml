base_translation:
  text: 'IV.1. Answering, I say to her, "Lady, this matter is great and marvelous. And the six young men[1]
    who are building—who are they, Lady?" "These are the holy angels of God, the first-created[2], to
    whom the Lord entrusted all his creation—to make it grow and to build it up[3] and to rule over all
    creation. By these, therefore, the building of the tower[4] will be brought to completion[5]."


    IV.2. "And the others who are carrying the stones—who are they?" "They too are holy angels of God[a];
    but these six are superior to them[6]. The building of the tower, then, will be brought to completion,
    and all together will rejoice around the tower and will glorify God, because the building of the tower
    has been completed[7]."


    IV.3. I asked her, saying, "Lady, I wished to know the outcome[8] of the stones and their power—what
    sort it is." Answering me, she says, "It is not because you are more worthy than all that it is revealed
    to you; for there are others before you and better than you, to whom it was fitting that these visions
    should be revealed. But in order that the name of God might be glorified, it has been revealed to
    you and will be revealed[b], for the sake of the double-minded[9]—those who reason within their hearts
    whether these things are so or not[c]. Tell them that all these things are true, and nothing is outside
    the truth; rather, all are strong and sure and well-founded[10]."'
