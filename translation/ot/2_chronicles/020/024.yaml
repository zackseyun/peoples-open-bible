  from: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
  to: When Judah reached the lookout over the wilderness, they looked toward the enemy army and saw corpses lying on the ground; there was not a single survivor.
