base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: ko
  text: 고라 족장, 가아담 족장, 아말렉 족장입니다. 이들은 에돔 땅에 있는 엘리바스의 족장들이며, 이들은 아다의 아들들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  english_pob_choice: chief
  chosen_korean: 우두머리
  alternatives_korean:
  - 족장
  - 두목
  - 장
  lexicon: אַלּוּף
  rationale: 문맥상 에돔 계열의 씨족/지도자 칭호로서, 한국어의 ‘우두머리’가 위계적 지위는 살리되 교회직분처럼 들리지 않게 합니다.
- source_word: קֹרַח
  english_pob_choice: Korah
  chosen_korean: 고라흐
  alternatives_korean:
  - 고라
  - 고라스
  lexicon: 고유명사
  rationale: 히브리어 קורח의 음가를 따라 현대 외래어 표기식으로 옮겼습니다. 이 절의 인물은 민수기의 고라와 동일 철자지만, 본문 음가를 우선해 표기했습니다.
- source_word: גַּעְתָּם
  english_pob_choice: Gaatham
  chosen_korean: 가아팀
  alternatives_korean:
  - 가탐
  - 가아담
  lexicon: 고유명사
  rationale: 영문 POB가 채택한 ‘Gaatham’을 반영하되, 히브리어 자음군과 모음값을 고려해 한국어 음역을 ‘가아팀’으로 잡았습니다.
- source_word: אֱלִיפַז
  english_pob_choice: Eliphaz
  chosen_korean: 에리파스
  alternatives_korean:
  - 엘리바스
  - 엘리파스
  lexicon: 고유명사
  rationale: 전통적 한국어 성경의 ‘엘리바스’보다, 히브리어 אליפז의 자음과 모음에 더 직접적인 음역을 택했습니다.
theological_decisions:
- issue: 족장 목록의 직함과 계보 문장 구조
  chosen_reading: 본문을 역사적/계보적 열거로 보아, 직함과 소속 문장을 평서형으로 간결하게 살렸습니다.
  alternative_readings:
  - ‘족장’으로 보다 전통적인 씨족 지도자 용어를 쓰는 읽기
  - 문장 전체를 더 의역해 서술적으로 풀어 쓰는 읽기
  rationale: 이 절은 교리적 해설보다 족장 명단의 기록이 핵심이므로, 원문의 반복 구조를 유지하는 것이 독자 이해에 가장 충실합니다.
  doctrine_reference: 창세기 족보/족장 기록의 문학적 기능
- issue: ‘에돔 땅에 있는’의 지리 표현
  chosen_reading: ‘에돔 땅에 있는’으로 직역해 소속과 지리 범위를 분명히 했습니다.
  alternative_readings:
  - ‘에돔 지역의’
  - ‘에돔 땅에서’
  rationale: 히브리어 בְּאֶרֶץ는 위치를 나타내므로, 한국어에서도 장소 관계를 명시하는 것이 원문 정보량을 가장 잘 보존합니다.
  doctrine_reference: 본문 지시어의 지리적 명확성
