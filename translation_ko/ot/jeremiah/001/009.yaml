id: JER.1.9
reference: Jeremiah 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יָד֔/וֹ וַ/יַּגַּ֖ע עַל פִּ֑/י וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י הִנֵּ֛ה נָתַ֥תִּי דְבָרַ֖/י בְּ/פִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/009.yaml
  text: Then the LORD stretched out his hand and touched my mouth, and the LORD said to me, “Look, I have put my words in your mouth.”
translation:
  language: ko
  text: 그러자 야훼께서 손을 내밀어 제 입에 대셨습니다. 그리고 야훼께서 제게 말씀하셨습니다. “보십시오[a], 내가 내 말을 당신의 입에 두었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הִנֵּה는 단순한 시각 지시보다 주의 환기와 선언의 강세를 함께 지닙니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה / LORD
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주
  - 여호와
  lexicon: YHWH
  rationale: 본문의 신명사 표지를 고유명사적으로 드러내는 POB 기본 원칙에 따라 야훼로 옮기고, 합쇼체 서술 안에서도 동일 표기를 유지했습니다.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ וַיַּגַּע
  english_pob_choice: stretched out his hand and touched
  chosen_korean: 손을 내밀어 ... 대셨습니다
  alternatives_korean:
  - 손을 뻗어 ... 만지셨습니다
  - 손을 펴서 ... 닿게 하셨습니다
  lexicon: גע / שלח
  rationale: ‘손을 내밀다’는 히브리어의 행위 순서를 자연스럽게 살리면서, ‘대셨습니다’로 직접적인 접촉을 분명하게 표현했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보라
  alternatives_korean:
  - 봐라
  - 자
  lexicon: הנה
  rationale: 문장 앞의 주의 환기 표현을 한국어 명령형으로 살리되, 예레미야와의 소명 장면에 맞는 격식을 유지했습니다.
- source_word: דְבָרַי בְּפִיךָ
  english_pob_choice: I have put my words in your mouth
  chosen_korean: 내 말들을 네 입에 두었다
  alternatives_korean:
  - 내 말을 네 입에 넣었다
  - 내 말을 네 입속에 두었다
  lexicon: דבר
  rationale: ‘말들’은 히브리어 복수형을 반영하고, ‘두었다’는 단순 주입보다 위임·부여의 뉘앙스를 더 직접적으로 드러냅니다.
theological_decisions:
- issue: 예언자 입에 하나님의 말씀을 두시는 행위의 표현
  chosen_reading: 하나님이 예언자에게 말씀을 단순 전달한 것이 아니라, 그 입 자체에 말씀을 두어 대변 권위를 부여하시는 장면으로 번역했습니다.
  alternative_readings:
  - ‘내 말을 네게 주었다’처럼 일반적 수여로 완화
  - ‘네 입에 넣었다’로 물리적 이미지에만 국한
  rationale: 문맥은 예레미야의 예언 직무를 신적 위임으로 확증하므로, 접촉과 ‘두었다’의 결합을 유지해 소명-위임의 강도를 살렸습니다.
  doctrine_reference: 예언 소명과 신적 위임
- issue: 직접화법의 호칭과 어조
  chosen_reading: 직접 화법은 현대 표준어 합쇼체 서술 안에서, 신적 발화는 원문의 명령적 도입어를 살려 ‘보라’로 옮겼습니다.
  alternative_readings:
  - 전부 평서형으로 통일
  - ‘자’나 ‘이제 보라’로 완화
  rationale: 본문의 긴박한 소명 어조를 보존하면서도 한국어 성경문체의 공적·문어적 품격을 유지하기 위해서입니다.
  doctrine_reference: 예언적 계시의 직접성
