source:
  edition: WLC
  text: כִּ֤י לֹ֪א בְ/חַרְבָּ֡/ם יָ֥רְשׁוּ אָ֗רֶץ וּ/זְרוֹעָ/ם֮ לֹא הוֹשִׁ֪יעָ֫ה לָּ֥/מוֹ כִּֽי יְמִֽינְ/ךָ֣ וּ֭/זְרוֹעֲ/ךָ וְ/א֥וֹר פָּנֶ֗י/ךָ כִּ֣י רְצִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/003.yaml
  text: For it was not by their sword that they possessed the land, and their arm did not save them, but by your right hand, your arm, and the light of your face[a], because you delighted in them.
  footnotes:
  - marker: a
    text: Or 'the light of your presence'; the Hebrew literally says 'the light of your face,' an image of divine favor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 자기 칼로 그 땅을 차지한 것도 아니고, 자기 팔이 그들을 구원한 것도 아니었습니다. 오직 주님의 오른손과 팔과 주님의 얼굴의 빛 때문이었습니다. 주님께서 그들을 기뻐하셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדְךָ
  english_pob_choice: by your hand
  chosen_korean: 손으로
  alternatives_korean:
  - 당신의 손으로
  - 손에 의해
  lexicon: HALOT
  rationale: 히브리어의 ביד/손은 하나님의 능동적 수단을 나타내므로, 한국어에서는 원인·수단을 자연스럽게 드러내는 ‘손으로’를 택했습니다.
- source_word: גּוֹיִם
  english_pob_choice: nations
  chosen_korean: 나라들을
  alternatives_korean:
  - 민족들을
  - 이방 민족들을
  lexicon: HALOT
  rationale: 역사적 정복 문맥에서 고정된 이방/종교적 대비보다 정치적 공동체를 가리키므로, ‘나라들’이 가장 자연스럽고 넓은 대응입니다.
- source_word: לְאֻמִּים
  english_pob_choice: peoples
  chosen_korean: 민족들을
  alternatives_korean:
  - 백성들을
  - 나라들을
  lexicon: HALOT
  rationale: 앞의 גּוֹיִם과 평행을 이루되 동일어 반복을 피하는 시어적 변화를 살리기 위해 ‘민족들’을 택했습니다.
- source_word: וַתְּשַׁלְּחֵם
  english_pob_choice: sent them out
  chosen_korean: 그들을 흩으셨습니다
  alternatives_korean:
  - 그들을 내보내셨습니다
  - 그들을 보내셨습니다
  lexicon: HALOT
  rationale: 동사 שׁלח의 기본 뜻은 ‘보내다’이지만, 문맥상 단순 파송보다 추방·분산의 결과가 더 강하므로 ‘흩으셨습니다’로 옮겨 정복 후 처리의 함의를 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 대명사 지시 대상
  chosen_reading: ‘그들을 심으셨으며’는 이스라엘의 조상들을 가리키고, 뒤의 ‘그들을 흩으셨습니다’는 진멸·축출된 민족들을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 두 절의 대명사가 모두 이스라엘의 조상들을 가리킨다
  - 두 절의 대명사가 모두 민족들을 가리킨다
  rationale: 시적 압축 때문에 지시 대상이 논의되지만, 앞뒤 문맥은 하나님께서 민족들을 몰아내고 이스라엘을 정착시키신 역사를 찬양합니다. 그래서 첫 절은 정착의 대상인 조상들로, 마지막 절은 축출된 민족들로 읽는 것이 흐름에 가장 잘 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
