base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/007.yaml
  text: “But there are also indulgences that save people; for many, by doing good things, indulge themselves, being carried along by their own pleasure. This indulgence, therefore, is beneficial for the slaves of God, and it secures life for such a person; but the harmful indulgences previously mentioned procure torments and punishments for them; and if they persist and do not repent, they procure death for themselves.”
translation:
  language: en
  text: But some kinds of pleasure can also save people. Many people please themselves by doing good and are carried along by the pleasure they find in it. This kind of pleasure benefits the servants of God and brings such a person to life. But the harmful pleasures mentioned earlier bring torment and punishment. If people persist in them and do not repent[a], they bring death on themselves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: indulgences that save people
  simplified_phrase: some kinds of pleasure can also save people
  preserved_meaning: Some forms of pleasure are beneficial and lead to salvation.
  reasoning_layer_used: POB translation and immediate contrast
  rationale: The wording connects beneficial pleasure with the good deeds explained next.
- pob_phrase: by doing good things, indulge themselves, being carried along by their own pleasure
  simplified_phrase: please themselves by doing good and are carried along by the pleasure they find in it
  preserved_meaning: They do good while their own pleasure motivates and accompanies them.
  reasoning_layer_used: POB clause meaning and grounding review
  rationale: This avoids making enjoyment a criterion for goodness while preserving its motivating role.
translation_notes:
  risk_flags:
  - risk: Modern readers may assume that every kind of self-pleasure is morally harmful.
    mitigation: The text clearly contrasts pleasure found in doing good with the harmful pleasures mentioned earlier.
