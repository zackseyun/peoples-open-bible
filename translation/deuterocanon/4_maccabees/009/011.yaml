  text: ὅθεν τὸν πρεσβύτατον αὐτῶν κελευσθέντες παρήγαγον οἱ μιστισταί, καὶ διαρρήξαντες τὸν χιτῶνα διέδησαν τὰς χεῖρας αὐτοῦ καὶ τοὺς βραχίονας ἱμᾶσιν ἑκατέρωθεν.
