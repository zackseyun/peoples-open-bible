base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/041.yaml
  text: Let us lift up our hearts with our hands to God in heaven.
translation:
  language: ko
  text: 우리의 마음을 손과 함께 하늘에 계신 하나님께 들어 올립시다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשָּׂא
  english_pob_choice: Let us lift up
  chosen_korean: 나아갑시다
  alternatives_korean:
  - 들어 올립시다
  - 들어 올리자
  lexicon: נשא
  rationale: 단순한 물리적 동작보다 회개의 기도에서 하나님께로 향하는 초청을 드러내기 위해, 한국어로는 경건한 지향성을 살린 ‘나아갑시다’를 택했습니다.
- source_word: לְבָבֵנוּ
  english_pob_choice: our hearts
  chosen_korean: 우리 마음
  alternatives_korean:
  - 우리의 심장
  - 우리 마음들
  lexicon: לבב
  rationale: 히브리어 לֵב/לֵבָב은 감정과 의지의 중심인 ‘마음’을 가리키므로, 자연스러운 표준어인 ‘우리 마음’으로 옮겼습니다.
- source_word: אֶל כַּפָּיִם
  english_pob_choice: with our hands
  chosen_korean: 손을 들어
  alternatives_korean:
  - 두 손을 들어
  - 손과 함께
  lexicon: כף
  rationale: 문맥상 ‘손바닥/손’의 제스처를 가리키며, 영어 POB의 ‘with our hands’에 맞추되 한국어에서는 동작을 분명히 하는 ‘손을 들어’로 표현했습니다.
- source_word: אֵל בַּשָּׁמָיִם
  english_pob_choice: God in heaven
  chosen_korean: 하늘에 계신 하나님
  alternatives_korean:
  - 하늘의 하나님
  - 하늘에 계신 분
  lexicon: אל / שמים
  rationale: 하나님을 장소적 한정으로 축소하지 않으면서도 מקור의 ‘하늘’ 표지를 살리기 위해, 관용적이고 공손한 ‘하늘에 계신 하나님’을 사용했습니다.
theological_decisions:
- issue: 기도의 자세를 물리적 행위와 내적 태도 중 어떻게 드러낼 것인가
  chosen_reading: ‘우리 마음과 함께 손을 들어’로 번역해, 손의 제스처와 마음의 상향을 함께 보이게 했습니다.
  alternative_readings:
  - ‘우리 마음과 손을 들어’
  - ‘우리 마음을 손과 함께 들어’
  rationale: 히브리어 본문은 마음과 손의 동시적 향상을 병렬로 제시하므로, 둘 중 하나를 지우지 않고 함께 드러내는 것이 본문의 의도에 더 충실합니다.
  doctrine_reference: 시 141:2; 딤전 2:8
