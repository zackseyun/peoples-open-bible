  - 나를 미워한 사람들
  lexicon: שׂנא
  rationale: 현재형 분사적 의미를 살려 지속적인 적대 상태를 나타내는 ‘미워하는 자들’로 옮겼습니다.
- source_word: אָמְצ֖וּ מִמֶּֽ/נִּי
  english_pob_choice: for they were too mighty for me
  chosen_korean: 그들이 나보다 너무 강하였기 때문입니다
  alternatives_korean:
  - 그들이 나를 이길 만큼 강하였기 때문입니다
  - 그들이 내게 너무 강하였기 때문입니다
  lexicon: אמץ
  rationale: 비교 우위와 압도적 힘을 드러내기 위해 ‘나보다 너무 강하였기’로 직역에 가깝게 처리했습니다.
