id: GEN.38.7
reference: Genesis 38:7
source:
  edition: WLC
  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
translation:
  text: Er, Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
  philosophy: dynamic
lexical_decisions:
- source_word: וַיְהִי
  chosen: '... Was'
  alternatives:
  - And ... was
  - Then ... was
  - Now ... was
  lexicon: HALOT
  rationale: 'The waw-consecutive on היה advances the narrative. In English, ''Now'' idiomatically introduces the next event/person in the storyline while preserving the simple existential/copular sense ''was''. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: עֵר
  chosen: Er
  rationale: 'Personal name is transliterated according to the translation philosophy: translate titles, transliterate names.'
- source_word: בְּכוֹר יְהוּדָה
  chosen: Judah’s firstborn
  alternatives:
  - the firstborn of Judah
  lexicon: HALOT
  rationale: Construct chain indicates filial relationship and birth order. 'Judah’s firstborn' is the most natural modern English rendering and preserves the familial designation.
- source_word: רַע
  chosen: evil
  alternatives:
  - wicked
  - bad
  lexicon: HALOT
  rationale: רַע in moral evaluation before YHWH here denotes moral evil, not merely misfortune or poor quality. 'Evil' best preserves the gravity of divine judgment in the verse.
- source_word: בְּעֵינֵי יְהוָה
  chosen: in the sight of the LORD
  alternatives:
  - in the eyes of the LORD
  - before the LORD
  lexicon: HALOT
  rationale: This Hebrew idiom expresses evaluation from YHWH's perspective. 'In the sight of the LORD' is clear, natural, and close to the source idiom.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: וַיְמִתֵהוּ
  chosen: put him to death
  alternatives:
  - killed him
  - caused him to die
  lexicon: HALOT
  rationale: 'The Hiphil of מות is causative: ''caused him to die.'' ''Put him to death'' communicates direct divine action with appropriate solemnity and avoids the slightly blunt or potentially ambiguous English ''killed him,'' while remaining more idiomatic than the overly wooden ''caused him to die''.'
