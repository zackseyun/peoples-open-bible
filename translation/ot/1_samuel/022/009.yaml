  from: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
  to: Then Doeg the Edomite, who was standing among Saul’s servants[a], replied, “I saw the son of Jesse come to Ahimelech son of Ahitub at Nob.
