translation:
  text: 'He showed me a great white rock rising in the middle of the plain. It was higher than the mountains.
    It was square and large enough to hold the whole world.[a]


    2. The rock was old, but the gate cut into it looked newly made. The gate shone more brightly than
    the sun. I marveled at its brilliance.


    3. Twelve virgins stood around the gate. The four at the corners seemed more glorious, though the
    others were glorious too. Two virgins stood between each pair of the four, along the gate’s four sides.[d]


    4. They wore linen tunics with neat belts. Their right shoulders were bare, as if they were about
    to carry a load. They were ready like this, for they were very cheerful and eager.[b]


    5. After seeing these things, I marveled within myself that I was seeing such great and glorious things.
    I was also puzzled about the virgins. They were so delicate, but stood bravely, as if they were going
    to carry the whole heaven.


    6. The shepherd asked, “Why do you reason and puzzle within yourself and bring sorrow on yourself?
    Do not try to understand what you cannot grasp as though you were wise. Instead, ask the Lord to give
    you understanding so that you can understand those things.”[c][e]


    7. “You cannot see behind you, but you see what is in front of you. Leave what you cannot see alone.
    Do not torment yourself. Master what you see, and do not pry into the rest. I will explain everything
    I show you. Now look at what comes next.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: The Greek describes the rock as square and able to contain the whole world. The draft keeps
      the visionary scale; it does not turn this into a measured geographical claim. Amherst 190 fragment
      e verso partly overlaps paragraphs 1–2, with missing line edges and supplied letters. Its damaged
      shape word is uncertain in the 1901 edition and does not independently certify the complete square-rock
      sentence.
  - marker: b
    reason: textual_variant
    text: Amherst 190 fragment e recto partly preserves the linen tunics, belts, right shoulders and load-bearing
      readiness in paragraph 4. Several intervening letters and line edges are supplied. It supports a
      bounded parallel, not every printed word or the complete paragraph 5 sentence.
  - marker: c
    reason: lexical_alternative
    text: “As though you were wise” renders the Greek wise/understanding expression in the shepherd’s
      rebuke. Printed Palatina (1877), p. 201 likewise has tamquam sis sapiens. This is a contextual construal,
      not a new Greek-word substitution. The Lord is the one Hermas is told to ask; the draft does not
      replace him with the shepherd.
  - marker: d
    reason: textual_variant
    text: The selected printed Greek says “between them” (αὐτῶν). The supplied transcription of the Lightfoot–Harmer
      textual notes cites support from ancient translations labeled L₁, L₂, and E, and also notes an alternative
      under L₁. It reports that A (Athos) has αὐτῆς, “of it/her,” instead of “them.” This changes what
      the pronoun refers to. The translation keeps the selected reading. This information comes from the
      supplied printed notes, not a new examination of the manuscript.
  - marker: e
    reason: textual_variant
    text: The selected printed Greek says “you cannot” (οὐ δύνασαι), rendered here as “cannot grasp.”
      The supplied transcription of the Lightfoot–Harmer textual notes cites support from ancient translations
      labeled L₁, L₂, and E. It reports that A (Athos) instead has οὐδὲ, “nor/not even.” This short report
      is not enough to give a complete alternative English sentence. The translation keeps the selected
      wording. No new examination of the manuscript is claimed.
