id: AMO.7.15
reference: Amos 7:15
source:
  edition: WLC
  text: וַ/יִּקָּחֵ֣/נִי יְהוָ֔ה מֵ/אַחֲרֵ֖י הַ/צֹּ֑אן וַ/יֹּ֤אמֶר אֵלַ/י֙ יְהוָ֔ה לֵ֥ךְ הִנָּבֵ֖א אֶל עַמִּ֥/י יִשְׂרָאֵֽל־׃
translation:
  text: But Yahweh took me from tending the flock, and Yahweh said to me, ‘Go, prophesy to my people Israel.’
  philosophy: dynamic
lexical_decisions:
- source_word: וַיִּקָּחֵנִי
  chosen: took me
  alternatives:
  - seized me
  - took hold of me
  lexicon: HALOT
  rationale: לקח commonly means 'take.' In this context it describes the LORD's taking Amos from his prior occupation into prophetic service. 'Took me' is natural English and preserves the directness without overinterpreting it as forceful seizure.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: מֵאַחֲרֵי הַצֹּאן
  chosen: from following the flock
  alternatives:
  - from behind the flock
  - from tending the sheep
  lexicon: HALOT
  rationale: The phrase is literally 'from after the flock.' 'From following the flock' preserves the pastoral image and the Hebrew idiom better than the more interpretive 'from tending the sheep,' while remaining readable.
- source_word: הַצֹּאן
  chosen: the flock
  alternatives:
  - the sheep
  lexicon: HALOT
  rationale: צאן can denote small livestock collectively, often sheep/goats. 'Flock' is the best collective English equivalent here and fits the occupational setting.
- source_word: וַיֹּאמֶר אֵלַי
  chosen: said to me
  alternatives:
  - told me
  lexicon: HALOT
  rationale: A straightforward rendering of אמר + אל. 'Said to me' is slightly more formal and preserves the speech-act wording.
- source_word: לֵךְ
  chosen: Go
  alternatives:
  - Go on
  - Depart
  lexicon: HALOT
  rationale: The imperative of הלך is best rendered simply as 'Go,' preserving the commissioning force.
- source_word: הִנָּבֵא
  chosen: prophesy
  alternatives:
  - speak as a prophet
  - declare prophetically
  lexicon: HALOT
  rationale: The Niphal imperative of נבא is the standard verb for prophetic proclamation. 'Prophesy' is concise, accurate, and idiomatic.
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  chosen: to my people Israel
  alternatives:
  - against my people Israel
  - to Israel my people
  lexicon: HALOT
  rationale: The preposition is אֶל, normally 'to,' not 'against.' Although prophetic speech often contains judgment, the Hebrew here does not itself specify hostility. 'To my people Israel' preserves both the covenantal claim and the direction of the commission.
