  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  english_pob_choice: heard about
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들었습니다
  - 들었을 때
  - 듣고
  lexicon: שׁמע
  rationale: 문맥상 단순 청취가 아니라 사건 소식을 접한 것을 나타내므로, 한국어는 자연스럽게 ‘…을 듣고’로 옮기되 문장 종결은 서술형으로 열어 두는 것이 가장 원문에 가깝습니다.
- source_word: יֹשְׁבֵי יָבֵישׁ גִּלְעָד
  english_pob_choice: the inhabitants of Jabesh-gilead
  chosen_korean: 길르앗 야베스 주민들
  alternatives_korean:
  - 길르앗 야베스의 주민들
  - 야베스 길르앗 주민들
  lexicon: יֹשֵׁב
  rationale: ‘주민들’이 가장 직역에 가깝고 현대 한국어에서도 자연스럽습니다. 지명은 기존 성서 관용 표기인 ‘길르앗 야베스’를 유지했습니다.
- source_word: אֲשֶׁר עָשׂוּ פְלִשְׁתִּים לְשָׁאוּל
  english_pob_choice: what the Philistines had done to Saul
  chosen_korean: 블레셋 사람들이 사울에게 한 일
  alternatives_korean:
  - 블레셋 사람들이 사울에게 행한 일
  - 블레셋이 사울에게 저지른 일
  lexicon: עשה + ל
  rationale: 히브리어의 ‘עשה ל’는 단순히 ‘행하다’보다 누군가에게 가한 처분이나 조치를 가리킬 수 있으므로, 한국어는 ‘한 일’로 옮겨 문맥의 행위 결과를 그대로 드러냈습니다.
theological_decisions:
- issue: 사울에게 대한 블레셋의 처사에 대한 서술 방식
  chosen_reading: 본문은 평가를 덧붙이지 않고, 야베스 주민들이 들은 사건 자체만 절제되게 전합니다.
  alternative_readings:
  - ‘사울에게 행한 일’에 도덕적 뉘앙스를 강화하여 번역
  - 사울의 처참한 최후를 암시하는 해설 추가
  rationale: 히브리어 원문은 사실 진술에 머물며, 서술자의 평가를 덧붙이지 않습니다. 따라서 한국어도 설명을 보태지 않고 원문의 절제를 보존하는 것이 적절합니다.
  doctrine_reference: 서사 본문의 절제된 사실 진술 보존
