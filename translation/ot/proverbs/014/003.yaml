id: PRO.14.3
reference: Proverbs 14:3
source:
  edition: WLC
  text: בְּֽ/פִי אֱ֭וִיל חֹ֣טֶר גַּאֲוָ֑ה וְ/שִׂפְתֵ֥י חֲ֝כָמִ֗ים תִּשְׁמוּרֵֽ/ם־׃
translation:
  text: A fool’s proud words are a rod for his own back[a], but the lips of the wise protect them.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “In a fool’s mouth is a rod of pride.” The image may instead portray arrogant speech as a weapon against others.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפִי
  chosen: In the mouth of
  alternatives:
  - By the mouth of
  - From the mouth of
  lexicon: HALOT
  rationale: The preposition ב plus פֶּה here is best rendered locatively, introducing what is found in or proceeds from the fool's speech. 'In the mouth of' preserves the Hebrew image and proverb style better than a more interpretive paraphrase.
- source_word: אֱוִיל
  chosen: a fool
  alternatives:
  - the fool
  - a foolish person
  lexicon: HALOT
  rationale: אֱוִיל is the standard wisdom-term for a morally dull or obstinate fool, not merely someone unintelligent. 'A fool' is the natural English equivalent in Proverbs and preserves the representative singular.
- source_word: חֹטֶר
  chosen: a rod
  alternatives:
  - a shoot
  - a staff
  - a scepter
  lexicon: HALOT
  rationale: Though חֹטֶר can denote a shoot/branch in some contexts, in this proverb the metaphor works better as 'rod,' an instrument associated with striking or authority. In context with 'pride,' it likely depicts arrogant speech as something that brings punishment or functions as a proud weapon. 'Rod' best preserves the compact metaphor without overexplaining it.
- source_word: גַּאֲוָה
  chosen: of pride
  alternatives:
  - of arrogance
  - of haughtiness
  lexicon: HALOT
  rationale: גַּאֲוָה denotes pride, exaltation, or arrogance. 'Pride' is the most direct and idiomatic rendering here; 'arrogance' is possible but slightly more interpretive. The genitive construction is retained as 'rod of pride' to preserve the Hebrew terseness.
- source_word: וְשִׂפְתֵי
  chosen: but the lips of
  alternatives:
  - and the lips of
  lexicon: HALOT
  rationale: While ו can be simply 'and,' English proverb style often uses adversative 'but' where the second colon contrasts with the first. 'Lips' is retained rather than paraphrasing as 'words' or 'speech,' preserving the Hebrew poetic parallel with 'mouth.'
- source_word: חֲכָמִים
  chosen: the wise
  alternatives:
  - wise people
  - the wise ones
  lexicon: HALOT
  rationale: The masculine plural adjective functions substantivally. 'The wise' is idiomatic in English wisdom literature and preserves the representative class sense without unnecessary expansion.
- source_word: תִּשְׁמוּרֵם
  chosen: protect them
  alternatives:
  - will preserve them
  - will protect them
  - will guard themselves
  lexicon: HALOT
  rationale: “Protect” naturally conveys the guarding sense while preserving the unresolved plural object.
- source_word: בְּפִי אֱוִיל
  chosen: In a fool’s mouth
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English that preserves the Hebrew mouth image.
