  meaning_decisions:
  - source_phrase: יְהוֹיָדָע אָבִיו
    prior_rendering: Jehoiada his father
    new_rendering: Jehoiada, Zechariah’s father
    rationale: The surrounding narrative identifies Jehoiada as Zechariah’s father; making that reference explicit avoids suggesting that he was Joash’s biological father. The earlier fatherly-benefactor interpretation is retained as an alternative.
  - source_phrase: וַיַּהֲרֹג אֶת בְּנוֹ וּכְמוֹתוֹ אָמַר
    prior_rendering: and he killed his son. As he was dying, he said
    new_rendering: Instead, he killed Jehoiada’s son. As Zechariah was dying, he said
    rationale: The explicit names prevent confusion about whose son was killed and who spoke the dying appeal; 'Instead' expresses Joash’s betrayal of the kindness he had received.
  - source_phrase: יֵרֶא יְהוָה וְיִדְרֹשׁ
    prior_rendering: May Yahweh see and require it
    new_rendering: May Yahweh see this and call those responsible to account
    rationale: In this bloodshed context, דרש means demanding accountability; 'require it' no longer communicates that judicial appeal clearly.
