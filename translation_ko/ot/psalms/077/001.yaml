  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 찬양대 지휘자에게
  - 수석 음악가에게
  lexicon: HALOT
  rationale: 시 표제에서 이 표현은 연주를 맡은 책임자에게 주는 지시문으로 쓰이므로, 기능을 살린 ‘지휘자에게’가 자연스럽고 간결합니다.
- source_word: עַל
  english_pob_choice: according to
  chosen_korean: ~에 따라
  alternatives_korean:
  - ~에 맞추어
  - ~의 곡조로
  - ~에 관하여
  lexicon: HALOT
  rationale: 이 자리의 עַל은 단순한 ‘위에’가 아니라 곡조·양식·연주 기준을 나타낼 수 있으므로, ‘~에 따라’로 처리해 표제의 음악적 용법을 살렸습니다.
- source_word: יְדוּתוּן
  english_pob_choice: Jeduthun
  chosen_korean: 여두둔
  alternatives_korean:
  - 여두툰
  - 여두둔
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역으로 옮겼으며, 시편 표제의 전통적 인명 표기를 따랐습니다.
- source_word: לְאָסָף
  english_pob_choice: Of Asaph
  chosen_korean: 아삽의
  alternatives_korean:
  - 아삽에게
  - 아삽에 의한
  - 아삽을 위한
  lexicon: HALOT
  rationale: לְ는 이 표제에서 저자, 관련성, 헌정을 모두 열어 둘 수 있으므로, 한국어에서는 가장 자연스럽게 그 범위를 유지하는 ‘아삽의’로 옮겼습니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시입니다
  alternatives_korean:
  - 시편입니다
  - 노래입니다
  - 노래시입니다
  lexicon: HALOT
  rationale: מִזְמוֹר의 장르 표지를 한국어로는 간결하게 ‘시’로 옮겨, 제목형 표제의 기능을 살리면서도 현대 한국어 문체에 맞췄습니다.
theological_decisions:
- issue: 표제의 לְאָסָף를 저자성으로만 확정할지 여부
  chosen_reading: ‘아삽의’로 두어 저자·관련성·헌정 가능성을 모두 열어 둡니다.
  alternative_readings:
  - ‘아삽을 위한’
  - ‘아삽에게’
  - ‘아삽이 지은’
  rationale: 히브리어 전치사 לְ는 시 표제에서 소유/관련/헌정의 폭을 가질 수 있으므로, 본문에서 한 가지로 과도하게 못박지 않는 번역이 원문에 더 충실합니다.
  doctrine_reference: 시편 표제의 문법적 다의성
