  text: οὐδάμως ἐπιλογιζόμενος τὸ τοῦ θεοῦ κράτος, πεφρονηματισμένος δὲ ταῖς μυριάσιν τῶν πεζῶν καὶ ταῖς χιλιάσι τῶν ἱππέων καὶ τοῖς ἐλέφασιν τοῖς ὀγδοήκοντα.
