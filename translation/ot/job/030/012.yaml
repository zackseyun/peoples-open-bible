id: JOB.30.12
reference: Job 30:12
source:
  edition: WLC
  text: עַל יָמִין֮ פִּרְחַ֪ח יָ֫ק֥וּמוּ רַגְלַ֥/י שִׁלֵּ֑חוּ וַ/יָּסֹ֥לּוּ עָ֝לַ֗/י אָרְח֥וֹת אֵידָֽ/ם־׃
translation:
  text: On my right the rabble rises up; they force me off my footing[a] and build roads to bring destruction upon me[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “they send away my feet”; the precise action described is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Literally, “they build up against me their paths of disaster,” an image of attackers preparing their approach.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָמִין
  chosen: On my right
  alternatives:
  - At my right hand
  - Against my right side
  lexicon: HALOT
  rationale: The phrase is spatial and idiomatic for hostile positioning at one's right side. 'On my right' is concise and natural while preserving the Hebrew image.
- source_word: פִּרְחַח
  chosen: the rabble
  alternatives:
  - rabble
  - young men
  - riffraff
  lexicon: HALOT
  rationale: “Rabble” is natural English for the contemptuous collective and avoids the offspring implication of “brood.”
- source_word: יָקוּמוּ
  chosen: rises up
  alternatives:
  - rise up
  - stand up
  lexicon: HALOT
  rationale: The verb קום here conveys hostile arising or taking a stand. Singular English agrees naturally with the collective noun 'brood.'
- source_word: רַגְלַי שִׁלֵּחוּ
  chosen: they force my feet away
  alternatives:
  - they trip up my feet
  - they drive my feet away
  - they let loose my feet
  lexicon: HALOT
  rationale: This removes wooden gloss-English while preserving the explicit feet image and avoiding the false precision of “trip.”
- source_word: וַיָּסֹלּוּ
  chosen: they build up
  alternatives:
  - they cast up
  - they heap up
  lexicon: HALOT
  rationale: From סלל, often used of building up or casting up a road/highway. Here it introduces the road/path imagery that follows, so 'build up' keeps the metaphor intelligible in modern English.
- source_word: עָלַי
  chosen: against me
  alternatives:
  - upon me
  - over me
  lexicon: HALOT
  rationale: In this hostile context, 'against me' best conveys adversative force rather than mere spatial relation.
- source_word: אָרְחוֹת אֵידָם
  chosen: their paths of disaster
  alternatives:
  - their ways of destruction
  - their paths of calamity
  - their roads of ruin
  lexicon: HALOT
  rationale: אֹרַח/אָרְחוֹת means paths/ways, and אֵיד commonly denotes disaster, calamity, or ruin. The suffix on אֵידָם is best taken as 'their,' so the phrase refers to paths that belong to or lead to their destructive assault. 'Disaster' is clear modern English and preserves the severity without overinterpreting.
- source_word: וַיָּסֹלּוּ עָלַי אָרְחוֹת אֵידָם
  chosen: they cast up their roads of disaster against me
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This preserves the hostile road-building metaphor and the possessive suffix on אֵידָם in reasonably natural English.
