status: reviewed
revisions:
- from: 야훼께서 이같이 말씀하십니다. "어디 있느냐, 너희 어머니의 이혼증서가—내가 그 여자를 내보냈다면 그것이다. 또는 내가 너희를 누구의 채권자에게 팔았느냐? 보라, 너희는 너희의 죄악들 때문에 팔렸고, 너희 어머니는 너희의 허물들 때문에 내보내졌습니다."[a][b]
  to: 야훼께서 이렇게 말씀하십니다. “내가 그것으로 너희 어머니를 내보낸 이혼증서가 어디 있느냐? 내가 너희를 팔아넘긴 내 채권자들 가운데 누구에게 팔았느냐? 보라, 너희는 너희의 죄악 때문에 팔렸고, 너희 어머니는 너희의 허물 때문에 내보내졌습니다.”
  rationale: 첫 질문을 이혼증서가 수식받는 원문의 관계절 구조로 바로잡고, 둘째 질문에서 ‘내 채권자들 가운데 누구’라는 원문의 소유·복수 표현을 명시했습니다. 매매와 내보냄의 피동 표현 및 죄악/허물의 대조는 유지했습니다. 구조적·의미상 불필요한 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:08:17Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 수사적 질문의 관계절이 원문과 다르게 조건문으로 처리되어 뜻이 무너졌습니다. 히브리어는 ‘내가 그것으로 그 여자를 내보낸’ 이혼증서가 어디 있느냐고 묻습니다. 또한 ‘내 채권자들 가운데 누구’라는 소유·복수 관계를 본문에 밝혀야 합니다.
  naturalness: 초안의 ‘내가 그 여자를 내보냈다면 그것이다’는 현대 한국어로 비문이며 지시 대상도 불분명합니다. 수정문은 예언자적 법정 질문의 긴장과 합쇼체를 자연스럽게 유지합니다.
  terminology: ‘야훼’, ‘이혼증서’, ‘죄악’, ‘허물’은 원문의 신명사호와 법적·도덕적 어휘를 적절히 반영합니다. שֻׁלְּחָה는 문맥상 ‘내보내졌습니다’로 유지할 수 있습니다.
  issues:
  - severity: high
    issue: 첫 문장의 ‘내가 그 여자를 내보냈다면 그것이다’
    rationale: 원문의 אֲשֶׁר שִׁלַּחְתִּיהָ는 이혼증서를 수식하는 관계절이며, ‘만일’ 조건문이 아닙니다. 현 번역은 문법적으로도 어색하고 ‘그것으로/그 문서와 함께’라는 관계를 소실합니다.
  - severity: medium
    issue: ‘누구의 채권자’
    rationale: מִנּוֹשַׁי는 ‘나의 채권자들 가운데 누구’입니다. 초안은 소유 관계와 복수성을 흐리며, 하나님이 누구에게 빚져 자녀를 팔았다는 수사적 부정을 충분히 드러내지 못합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 배치됨
    rationale: 각주가 해당 어휘에 직접 연결되지 않고, 각주 내용도 본문 어휘의 반복뿐이어서 독자에게 실질적 정보를 제공하지 않습니다. 불필요한 각주는 제거하는 편이 낫습니다.
  revised_text: 야훼께서 이렇게 말씀하십니다. “내가 그것으로 너희 어머니를 내보낸 이혼증서가 어디 있느냐? 내가 너희를 팔아넘긴 내 채권자들 가운데 누구에게 팔았느냐? 보라, 너희는 너희의 죄악 때문에 팔렸고, 너희 어머니는 너희의 허물 때문에 내보내졌습니다.”
