  from: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
  to: Then the king summoned Shimei and said to him, “Did I not make you swear by Yahweh and solemnly warn you, ‘On the day you leave and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘What you say is good; I understand.’
