id: JHN.3.16
reference: John 3:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
  footnotes:
  - marker: a
    text: 'Or, traditionally, ''For God so loved the world.'' The Greek can be understood as emphasizing the manner of God''s love: ''For God loved the world in this way.'''
    reason: lexical_alternative
  - marker: b
    text: 'Or ''his only begotten Son''; also possible: ''his unique Son.'''
    reason: alternative_reading
translation:
  language: ko
  text: 하나님께서는 세상을 이와 같이[a] 사랑하셨습니다. 곧 자신의 유일한 아들[b]을 주셨습니다. 이는 그를 믿는 사람마다 멸망하지 않고 영생을 얻게 하시려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로 “하나님께서 세상을 그토록 사랑하셨다.” 그리스어 οὕτως는 사랑의 정도(“그토록”) 또는 방식(“이와 같이”)을 가리킬 수 있습니다. 여기서는 뒤따르는 아들을 주신 일을 그 사랑의 방식으로 제시하는 것으로 번역했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “독생자”; 전통적으로 “독생하신 아들.” 그리스어 μονογενής는 ‘유일한’, ‘독특한’이라는 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  english_pob_choice: in this way
  chosen_korean: 이와 같이
  alternatives_korean:
  - 그토록
  - 이렇게
  lexicon: BDAG
  rationale: 원문 οὕτως는 방식(어떤 ‘방법으로’)을 가리키며, ὥστε로 이어지는 구문이 그 사랑의 구체적 표현(아들의 주심)을 설명하므로 ‘이와 같이’로 번역해 원문 의미를 보존합니다.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  english_pob_choice: his one and only Son
  chosen_korean: 독생자
  alternatives_korean:
  - 외아들
  - 유일한 아들
  - 오직 독생자
  lexicon: BDAG
  rationale: μονογενής는 ‘유일무이함’을 밝히는 어휘입니다. 한국어 전통어인 ‘독생자’가 관용적으로 쓰이지만 ‘생겨남/생득’을 암시할 수 있어 본문 의미(유일성)를 살리고, 역사적 신학적 함의를 각주로 남깁니다.
- source_word: πᾶς ὁ πιστεύων
  english_pob_choice: everyone who believes
  chosen_korean: 그를 믿는 사람마다
  alternatives_korean:
  - 믿는 자마다
  - 누구든지 믿는 자
  lexicon: BDAG
  rationale: 현재 분사의 일반·포괄적 용법을 반영해 현대 한국어 청중에게 자연스러운 ‘사람마다’ 표현을 택했습니다. 이는 본문이 포괄적 초청을 제시함을 그대로 전달합니다.
- source_word: ζωὴν αἰώνιον
  english_pob_choice: eternal life
  chosen_korean: 영생
  alternatives_korean:
  - 영원한 생명
  - 영원한 삶
  lexicon: BDAG
  rationale: 요한복음에서의 ζωὴν αἰώνιον은 단순한 시간적 지속뿐 아니라 질적·구원적 생명을 말하므로 한국어 관습어인 ‘영생’으로 번역해 신학적 의미를 온전히 담았습니다.
theological_decisions:
- issue: Rendering of μονογενής (τὸν υἱὸν τὸν μονογενῆ)
  chosen_reading: 본문은 ‘독생자’(유일한 아들)로 표기하고, ‘오직·독생하신 아들(only begotten)’과 같은 전통적 어휘 가능성은 각주로 표기
  alternative_readings:
  - 오직 독생자(only begotten Son)
  - 유일한 아들/one and only Son
  rationale: 학문적 어휘 연구는 μονογενής가 ‘독특성/유일성’을 강조한다고 보지만, 역사적 전통에서는 ‘독생(only‑begotten)’으로 읽혀왔습니다. 본문 번역은 현대 독자가 어휘의 중심 의미를 이해하도록 ‘독생자’로 표기하고, 전통적 신학어휘의 함의는 각주로 남겨 투명성을 확보합니다.
  doctrine_reference: '교의적 참고: 니케아·칼케돈 정통 해석(전통적 어휘 보존의 중대성) 및 번역 철학 §3'
- issue: Scope of πᾶς ὁ πιστεύων
  chosen_reading: ‘그를 믿는 사람마다’로 포괄적·일반적 초청을 표현
  alternative_readings:
  - ‘누구든지 믿는 자’
  - ‘믿는 자마다’
  rationale: '구문상 포괄적·일반적 의미를 지니므로 특정 교파적 교리(예: 제한적 구속론)를 전제하지 않고 원문이 제시하는 보편적 초청을 반영합니다.'
  doctrine_reference: '번역 원칙: 교파적 편향 배제, Affirmations 문단'
