base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/027.yaml
  text: 'The sons of Levi: Gershon[a], Kohath, and Merari.'
  footnotes:
  - marker: a
    text: Or 'descendants of Levi.' In genealogies, 'sons of' can sometimes function more broadly for lineage, though here it most naturally refers to Levi's three immediate sons.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위의 아들들은 게르손, 고핫, 그리고 므라리입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 후손들
  - 자손들
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 직계 아들들을 가리키는 표지로 쓰이므로, 영어 POB의 'sons of'에 맞춰 가장 직접적인 '아들들'로 옮겼습니다.
- source_word: לֵוִי
  english_pob_choice: Levi
  chosen_korean: 레위
  alternatives_korean:
  - 리바이
  lexicon: HALOT
  rationale: 히브리어 고유명사 לֵוִי의 표준 한국어 음역은 레위입니다.
- source_word: גֵּרְשׁוֹן
  english_pob_choice: Gershon
  chosen_korean: 게르손
  alternatives_korean:
  - 게르솜
  lexicon: HALOT
  rationale: 이 족보 항목의 히브리어 형태는 גֵּרְשׁוֹן이므로, 이에 맞는 표준 음역 게르손을 사용했습니다.
- source_word: קְהָת
  english_pob_choice: Kohath
  chosen_korean: 고핫
  alternatives_korean:
  - 그핫
  lexicon: HALOT
  rationale: 히브리어 קְהָת의 한국어 관용 음역은 고핫이며, 족보 전승에서 널리 쓰입니다.
- source_word: מְרָרִי
  english_pob_choice: Merari
  chosen_korean: 므라리
  alternatives_korean:
  - 메라리
  lexicon: HALOT
  rationale: 히브리어 מְרָרִי의 표준 음역은 므라리입니다.
