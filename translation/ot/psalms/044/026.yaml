id: PSA.44.26
reference: Psalms 44:26
source:
  edition: WLC
  text: ק֭וּמָֽ/ה עֶזְרָ֣תָ/ה לָּ֑/נוּ וּ֝/פְדֵ֗/נוּ לְמַ֣עַן חַסְדֶּֽ/ךָ׃
translation:
  text: Rise up to help us and redeem us for the sake of your steadfast love.
  philosophy: dynamic
lexical_decisions:
- source_word: קוּמָה
  chosen: Rise up
  alternatives:
  - Arise
  - Get up
  lexicon: HALOT
  rationale: Qal imperative 2ms of קום, an urgent appeal for God to act. 'Rise up' is natural modern English while preserving the vivid imperative force more transparently than a looser 'come to our aid.'
- source_word: עֶזְרָתָה לָנוּ
  lemma: עֶזְרָה
  chosen: to help us
  alternatives:
  - for our help
  - to help us
  - as help for us
  lexicon: HALOT
  rationale: The Hebrew noun phrase functions with the preceding imperative as an appeal for divine aid. English idiom appropriately verbalizes it as “Rise up to help us”; the nominal wording is retained in a literal-form note.
- source_word: וּפְדֵנוּ
  chosen: and redeem us
  alternatives:
  - and ransom us
  - and rescue us
  lexicon: HALOT
  rationale: Imperative of פדה with 1cp object suffix. 'Redeem' best preserves the covenantal and deliverance connotations of the root, whereas 'ransom' can sound overly commercial and 'rescue' is broader but less specific.
- source_word: לְמַעַן
  chosen: for the sake of
  alternatives:
  - because of
  - on account of
  lexicon: HALOT
  rationale: This preposition commonly marks motive or basis. 'For the sake of' captures appeal grounded in what follows without flattening it into a merely causal statement.
- source_word: חַסְדֶּךָ
  chosen: your steadfast love
  alternatives:
  - your covenant love
  - your loyal love
  - your mercy
  lexicon: HALOT
  rationale: חסד often denotes loyal, covenantal love. 'Steadfast love' is established, readable English that preserves both affection and covenant constancy better than the narrower 'mercy.'
