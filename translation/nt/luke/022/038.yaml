  chosen_reading: It is enough
  alternative_readings:
  - That is enough
  - Enough of this
  rationale: The Greek permits either a literal assessment ('two are enough') or a dismissive ending of the conversation. In keeping with the translation philosophy, the main text preserves the ambiguity rather than resolving it interpretively. A footnote preserves the alternative sense.
