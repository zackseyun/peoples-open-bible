  text: Καὶ ἐκέλευσεν εἰσαγαγεῖν αὐτὴν οὗ ἔτιθετο τὰ ἀργυρώματα αὐτοῦ, καὶ συνέταξεν καταστρῶσαι αὐτῇ ἀπὸ τῶν ὀψοποιημάτων αὐτοῦ καὶ τοῦ οἴνου αὐτοῦ πινεῖν.
