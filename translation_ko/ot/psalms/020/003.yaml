source:
  edition: WLC
  text: יִשְׁלַֽח עֶזְרְ/ךָ֥ מִ/קֹּ֑דֶשׁ וּ֝/מִ/צִּיּ֗וֹן יִסְעָדֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/003.yaml
  text: May he remember all your offerings[a] and accept[b] your burnt offering. Selah
  footnotes:
  - marker: a
    text: Or 'support you' or 'uphold you' from Zion.
    reason: lexical_alternative
  - marker: b
