id: JOB.19.20
reference: Job 19:20
source:
  edition: WLC
  text: בְּ/עוֹרִ֣/י וּ֭/בִ/בְשָׂרִ/י דָּבְקָ֣ה עַצְמִ֑/י וָ֝/אֶתְמַלְּטָ֗/ה בְּ/ע֣וֹר שִׁנָּֽ/י׃
translation:
  text: My bones cling to my skin and flesh, and I have escaped by the skin of my teeth.
  philosophy: dynamic
lexical_decisions:
- source_word: בְּעוֹרִי
  chosen: to my skin
  alternatives:
  - with my skin
  - in my skin
  lexicon: HALOT
  rationale: עוֹר means 'skin/hide.' With דבקה ('clings'), English idiom prefers 'clings to my skin' rather than a more wooden 'in/with my skin.'
- source_word: וּבִבְשָׂרִי
  chosen: and to my flesh
  alternatives:
  - and to my body
  lexicon: HALOT
  rationale: בשר commonly means 'flesh' in literal bodily contexts. Here it parallels 'skin' and describes Job's emaciated physical condition, so the literal 'flesh' is best.
- source_word: דָּבְקָה עַצְמִי
  chosen: my bones cling
  alternatives:
  - my bones cling
  - my bone sticks fast
  lexicon: HALOT
  rationale: The morphologically singular noun is collective; English normally uses plural “bones” for this bodily image.
- source_word: וָאֶתְמַלְּטָה
  chosen: and I have escaped
  alternatives:
  - and I escape
  - and I am delivered
  - and I have barely escaped
  lexicon: HALOT
  rationale: The verb from מלט denotes escaping/deliverance. In context Job speaks of surviving in an extreme, reduced state; English present perfect 'have escaped' communicates resultant survival. 'Barely' is interpretive and therefore left out of the main text.
- source_word: בְּעוֹר שִׁנָּי
  chosen: with the skin of my teeth
  alternatives:
  - by the skin of my teeth
  lexicon: HALOT
  rationale: This is the well-known idiom reflected directly by the Hebrew. 'With' matches the preposition ב closely, while 'by' is a natural English alternative. The phrase conveys an extremely narrow escape, even though teeth literally have no skin.
- source_word: בְּעוֹרִי וּבִבְשָׂרִי
  chosen: to my skin and flesh
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The coordinated concrete nouns are retained, with English naturally supplying the shared preposition.
