review_pass:
  verdict: revise
  source_fidelity: 대체로 충실하나, 결말의 ⲙⲟⲛⲁⲭⲟⲥ를 ‘단독한 자들’로 옮긴 것은 현대 한국어에서 부자연스럽고 의미를 불필요하게 특정합니다. 원문은 ‘홀로/단독으로 된 이들’이라는 표현을 사용하며, 그것이 영적 통일성을 뜻한다는 해석은 본문 자체를 넘어섭니다. 또한 원문은 ‘아버지가 아들을 거슬러, 아들이 아버지를 거슬러’라고 명시적으로 반복하기보다 앞선 ‘셋이 둘을 거슬러, 둘이 셋을 거슬러’ 뒤에 명사구로 제시하므로, 한국어에서도 이를 과도하게 완결된 두 절로 확장하지 않는 편이 더 가깝습니다.
  naturalness: ‘평강을 던지다’는 의도적으로 낯선 비유를 보존한 표현으로 가능하지만, ‘단독한 자들’은 현대 표준어 문장에 매우 부자연스럽습니다. ‘홀로 있는 이들’이 자연스럽고 원문의 의미 범위도 보존합니다. ‘그들은 알지 못합니다’로 어순을 바로잡으면 더 자연스럽습니다.
  terminology: ‘평강’, ‘분열’, ‘칼’은 격식 있는 성서 문체에 적절합니다. ⲙⲟⲛⲁⲭⲟⲥ에 대해 ‘수도사’라는 시대착오적 번역을 피하는 것은 타당하나, ‘분열되지 않은 한 사람’ 및 ‘내적으로 나뉘지 않은’이라는 주석·결정문은 교리적·해석적 확장을 포함하므로 삭제하거나 중립화해야 합니다.
  issues:
  - severity: medium
    issue: ⲙⲟⲛⲁⲭⲟⲥ의 번역과 주석이 해석을 과도하게 확정함
    rationale: ‘단독한 자들’은 비자연적이며, 주석의 ‘분열되지 않은 한 사람’과 ‘영적으로 분열되지 않은 상태’는 원문이 명시하지 않는 해석입니다. ‘홀로 있는 이들’로 번역하고, 후대 수도사 제도와 동일시하지 않는다는 최소한의 설명만 두는 것이 안전합니다.
  - severity: low
