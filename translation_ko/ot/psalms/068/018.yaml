  text: You ascended on high; you took captives; you received gifts among people[a], even among the rebellious, so that Yah God might dwell there[b].
  footnotes:
  - marker: a
    text: Or “from people”; the Hebrew preposition can indicate source, yielding “you received gifts from people.”
    reason: lexical_alternative
  - marker: b
    text: Or “that Yah God might dwell among them” or “as a dwelling for Yah God”; the Hebrew final clause is compact and may be construed in more than one way.
    reason: alternative_reading
