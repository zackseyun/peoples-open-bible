  from: Stand, therefore, fastening the belt of truth around your waist and putting on the breastplate of righteousness.
  to: Stand, therefore, having fastened your waist with truth and having put on the breastplate of righteousness,
  rationale: Revised to reflect the Greek participles more closely ('having fastened,' 'having put on'), preserved the explicit object 'your waist,' and rendered ἐν ἀληθείᾳ more literally as 'with truth' rather than adding 'belt of.'
- timestamp: '2026-11-09T17:07:54Z'
