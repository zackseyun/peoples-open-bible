- issue: Meaning of the metaphor 'leaven'
  chosen_reading: Retain the metaphor as 'leaven' without explicating it in the main text.
  alternative_readings:
  - teaching
  - hypocrisy
  - corrupting influence
  rationale: The immediate context and Synoptic parallels suggest a negative metaphor for corrupting influence, but Mark 8:15 itself does not specify the exact nuance. Preserving the metaphor maintains the text's interpretive openness rather than resolving it beyond what the verse states.
  doctrine_reference: Preserve theological tension rather than resolve it.
