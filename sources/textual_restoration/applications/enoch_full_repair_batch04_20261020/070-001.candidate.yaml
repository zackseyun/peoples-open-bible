translation:
  text: After this his name, while he lived, was raised up before him, to that Son of Man and to the Lord of Spirits,
    from among those who dwell upon the dry land.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The selected wording is compressed: his name, living, followed by before/in his presence and to that
      Son of Man. The pronoun’s referent and the precise relation of living are not supplied by a new identity claim.
      Son of Man renders the extended human idiom in the printed Ge’ez. The third-person wording here and in verse2
      is retained rather than harmonized to the first person of verse3.'
