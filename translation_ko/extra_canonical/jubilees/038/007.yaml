  text: And Reuben and Issachar and Zebulun went out toward the north side of the tower, and fifty were with them; and they killed the fighting men of the Philistines.
translation:
  language: ko
  text: 르우벤과 잇사갈과 스불론이 망대의 북쪽으로 나갔고, 그들과 함께 쉰 명이 있었으며, 그들이 블레셋 사람들의 전투원들을 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወፅኡ
  english_pob_choice: went out
  chosen_korean: 나갔고
  alternatives_korean:
  - 나섰고
  - 나왔고
  lexicon: Geez 출발/이동 동사
  rationale: 단순한 이동 사실을 자연스럽게 옮기되, 군사적 전개를 살려 ‘나섰고’도 가능하지만 본문은 중립적 이동이므로 ‘나갔고’로 두었습니다.
- source_word: እንተ፡ ገጸ፡ ሰሜን፡ ለማኅፈድ
  english_pob_choice: toward the north side of the tower
  chosen_korean: 망대의 북쪽으로
  alternatives_korean:
  - 망대 북쪽 편으로
  - 망대의 북편으로
  lexicon: 지시 방향구 + 지명적 구조
  rationale: ‘toward’의 방향성을 살리면서도 한국어로는 간결하게 ‘…의 북쪽으로’로 옮겼습니다.
- source_word: ፶
  english_pob_choice: fifty
  chosen_korean: 쉰 명
  alternatives_korean:
  - 50명
  - 오십 명
  lexicon: 수사 표현
  rationale: 인원수를 자연스러운 한국어로 표현하기 위해 ‘쉰 명’을 사용했습니다.
- source_word: መስተባእሳኒሆሙ፡ ለፍልስጥኤም
  english_pob_choice: the fighting men of the Philistines
  chosen_korean: 블레셋 사람들의 전투원들
  alternatives_korean:
  - 블레셋의 싸우는 자들
  - 블레셋 사람들의 싸움꾼들
  lexicon: 전투 집단 명사
  rationale: 원문의 ‘전투에 참여하는 자들’의 의미를 살리면서, 본문이 단순한 일반인보다 전투원을 가리키므로 ‘전투원들’로 옮겼습니다.
