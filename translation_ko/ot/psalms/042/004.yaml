base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/004.yaml
  text: 'These things I remember, and I pour out my soul within me: how I used to pass along with the throng[a], leading them[b] to the house of God with the sound of joyful shouting and thanksgiving—a celebrating crowd.'
  footnotes:
  - marker: a
    text: Or 'in the procession' for 'with the throng'; the Hebrew noun בַּסָּךְ is difficult and may refer to the gathered festival crowd or the processional company itself.
    reason: lexical_alternative
  - marker: b
    text: Or 'guiding them' / 'going with them' for 'leading them'; the Hebrew verb אֶדַּדֵּם is rare and its precise nuance is uncertain, though the context clearly involves movement with others toward the house of God.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이 일들을 기억하며 내 영혼을 내 속에 쏟아 놓습니다. 내가 무리와 함께 나아가[a] 그들을 이끌고[b] 하나님의 집까지 갔던 일을 기억합니다. 기쁨의 외침과 감사의 소리 가운데, 절기를 지키는 큰 무리와 함께 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무리와 함께 나아가’로 옮긴 히브리어는 뜻이 불확실합니다. 축제에 모인 군중을 가리킬 수도 있고, 행렬 자체를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들을 이끌고’로 옮긴 히브리어 동사는 드물게 쓰이며 정확한 뉘앙스가 확실하지 않습니다. ‘그들과 함께 가며’ 또는 ‘그들을 인도하며’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה לִּי ... לֶחֶם
  english_pob_choice: have been my bread
  chosen_korean: 내 양식이 되었습니다
  alternatives_korean:
  - 내 빵이 되었습니다
  - 내 떡이 되었습니다
  lexicon: HALOT
  rationale: היה + ל 구조는 단순한 존재보다 ‘~이 되다/역할을 하다’의 뜻이므로, 눈물이 생존의 양식이 되었다는 비유를 한국어로 자연스럽게 살렸습니다.
- source_word: דִמְעָתִי
  english_pob_choice: my tears
  chosen_korean: 내 눈물
  alternatives_korean:
  - 내 눈물들
  - 내 눈물 한 방울
  lexicon: HALOT
  rationale: 형태는 단수형이지만 집합적으로 쓰일 수 있어, 시편의 탄식 맥락에 맞게 복수적 자연스러움을 살린 ‘눈물’로 옮겼습니다.
- source_word: יוֹמָם וָלָיְלָה
  english_pob_choice: day and night
  chosen_korean: 밤낮으로
  alternatives_korean:
  - 낮과 밤으로
  - 하루 종일
  lexicon: HALOT
  rationale: 지속성을 나타내는 관용적 병렬 구조로, 한국어에서는 ‘밤낮으로’가 가장 간결하고 관용적입니다.
- source_word: אַיֵּה אֱלֹהֶיךָ
  english_pob_choice: Where is your God?
  chosen_korean: 네 하나님이 어디에 있느냐?
  alternatives_korean:
  - 네 하나님이 어디 있느냐?
  - 너의 하나님은 어디에 있느냐?
  lexicon: HALOT
  rationale: 히브리어의 직접적 조롱 질문을 유지하기 위해 ‘어디에 있느냐?’로 직역성을 살렸고, 화자에게 하는 도발적 어조를 반영했습니다.
theological_decisions:
- issue: 조롱의 신학적 긴장
  chosen_reading: “네 하나님이 어디에 있느냐?”라는 조롱을 그대로 유지했습니다.
  alternative_readings:
  - “네 하나님이 어떻게 되셨느냐?”로 완화할 수 있음
  - “네 하나님이 어디 계시느냐?”로 부드럽게 표현할 수 있음
  rationale: 본문은 하나님의 부재처럼 보이는 상황을 해소하지 않고 드러내므로, 그 긴장을 완화하지 않는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
