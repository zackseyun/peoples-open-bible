  text: 보십시오, 우리가 이것을 탐구해 보았으니 참으로 그렇습니다. 그것을 들으십시오. 그대도 스스로 아십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה / Look
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: 히네
  rationale: 호소하는 주의 환기를 드러내면서도 현대 합쇼체에 맞게 정중한 명령형으로 옮겼습니다.
- source_word: חֲקַרְנוּ / we have searched out
  english_pob_choice: we have searched out
  chosen_korean: 우리가 탐구해 알아낸 것이니
  alternatives_korean:
  - 우리가 찾아냈으니
  - 우리가 조사해 알아낸 것이니
  lexicon: חקר
  rationale: 단순 발견보다 ‘탐구하여 알아냄’의 과정성을 살려 מקור의 탐구 의미를 보존했습니다.
- source_word: וְאַתָּה / and you
  english_pob_choice: and you
  chosen_korean: 그리고 당신은
  alternatives_korean:
  - 그리고 너는
  - 또 당신은
  lexicon: אתה
  rationale: 본문이 ‘너는/당신은’으로 청자를 직접 지시하므로, 문맥상 정중한 합쇼체를 유지해 ‘당신은’으로 옮겼습니다.
- source_word: דַע לָךְ / know it for yourself
  english_pob_choice: know it for yourself
  chosen_korean: 스스로 알아 두십시오
  alternatives_korean:
  - 스스로 아십시오
  - 마음에 새기십시오
  lexicon: ידע
  rationale: 지식의 내면화와 책임 있는 인지를 나타내기 위해 단순 지식보다 ‘스스로 알아 두다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 지혜 격언의 확언 어조
  chosen_reading: ‘이것은 우리가 탐구해 알아낸 것이니 참으로 그렇습니다’로, 화자의 확신과 청자의 수용을 함께 드러냈습니다.
  alternative_readings:
  - ‘이것이 사실입니다’
  - ‘우리가 알아낸 바가 이렇습니다’
  rationale: 히브리어의 확인 절(כֶּן הִיא)과 명령 절을 모두 살리면서, 교훈적 확언의 어조를 약화하지 않도록 했습니다.
  doctrine_reference: 일반 지혜문학의 진술 방식
