review_pass:
  verdict: revise
  source_fidelity: 초안은 장로들이 손을 씻고 목이 꺾인 암송아지가 관련된다는 핵심을 대체로 전달합니다. 그러나 הַקְּרֹבִים אֶל הֶחָלָל은 장로 개인보다 살해된 사람이 있는 곳에 가장 가까운 성읍을 가리키는 문맥적 관계로 옮기는 것이 자연스럽고 정확합니다. חָלָל의 ‘죽임당한 사람/시신’ 양의성 및 נַחַל의 지형적 범위는 각주로 보존했습니다.
  naturalness: ‘그 성읍의 그 죽은 자에게 가장 가까운 모든 장로’는 한국어 수식 관계가 불분명하고 ‘그’의 반복으로 매우 부자연스럽습니다. ‘죽임당한 사람이 있는 곳에 가장 가까운 성읍의 모든 장로’로 고치면 현대 표준어에서 뜻이 명료합니다. 합쇼체의 규범적 절차 표현으로 ‘씻어야 합니다’를 사용했습니다.
  terminology: ‘암송아지’는 עֶגְלָה에 적절하며, ‘목이 꺾인’은 עֲרוּפָה의 의례적 행위를 과도하게 해석하지 않고 반영합니다. נַחַל은 본문에서 ‘와디’로 두고 이해 가능한 지형 대안을 각주에 제시했습니다.
  issues:
  - severity: medium
    issue: ‘그 성읍의 그 죽은 자에게 가장 가까운 모든 장로’의 수식 관계가 불명확함
    rationale: 히브리어와 앞 절의 절차 문맥은 살해된 사람이 있는 곳에 가장 가까운 성읍의 장로들을 가리킵니다. 초안은 장로들이 직접 시신에 가장 가까이 있다는 뜻처럼 읽히며 한국어 문장도 어색합니다.
  - severity: low
    issue: חָלָל 및 נַחַל의 어휘적 범위가 본문에서 보존되지 않음
    rationale: חָלָל은 죽임당한 사람 또는 그러한 사람의 시신을, נַחַל은 와디·골짜기·시내 바닥을 가리킬 수 있으므로, 선택한 본문 표현을 유지하면서 각주로 대안을 제시하는 것이 안전합니다.
  revised_text: 죽임당한 사람이 있는 곳에 가장 가까운 성읍의 모든 장로는, 그 와디[a]에서 목이 꺾인 그 암송아지 위에서 손을 씻어야 합니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘골짜기’ 또는 ‘시내 바닥’. 히브리어는 물길과 관련된 와디나 골짜기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘죽임당한 사람’은 ‘죽임당한 사람의 시신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: '가장 가까운 성읍이라는 문맥적 수식 관계를 한국어로 명료하게 했고, 절차적 명령을 현대 합쇼체로 옮겼습니다. ‘와디’의 지형적 의미는 각주로 보존했습니다. 또한 חָלָל의 양의성을 보존하기 위한 각주를 추가했으나, 본문에 해당 각주 표지가 누락되지 않도록 아래와 같이 표지를 붙여야 합니다: ‘죽임당한 사람[b]이 있는 곳에 가장 가까운 성읍의 모든 장로는, 그 와디[a]에서 목이 꺾인 그 암송아지 위에서 손을 씻어야 합니다.’'
