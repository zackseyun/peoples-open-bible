  text: Οἱ δὲ ἐπιδεδωκότες τὰς ῥάβδους χλωράς, αὐτὰ δὲ τὰ ἄκρα ξηρὰ καὶ σχισμὰς ἔχοντα, οὗτοι πάντοτε
    ἀγαθοὶ καὶ πιστοὶ καὶ ἔνδοξοι παρὰ τῷ Θεῷ ἐγένοντο, ἐλάχιστον δὲ ἐξήμαρτον διὰ μικρὰς ἐπιθυμίας καὶ
    μικρὰ κατ᾿ ἀλλήλων ἔχοντες· ἀλλ᾿ ἀκούσαντές μου τῶν ῥημάτων τὸ πλεῖστον μέρος ταχὺ μετενόησαν, καὶ
    ἐγένετο ἡ κατοικία αὐτῶν εἰς τὸν πύργον. 2. τινὲς δὲ ἐξ αὐτῶν ἐδιψύχησαν, τινὲς δὲ διψυχήσαντες διχοστασίαν
    μείζονα ἐποίησαν. ἐν τούτοις οὖν ἔτι ἐστὶ μετανοίας ἐλπίς, ὅτι ἀγαθοὶ πάντοτε ἐγένοντο· δυσκόλως δέ
    τις αὐτῶν ἀποθανεῖται. 3. οἱ δὲ τὰς ῥάβδους αὐτῶν ξηρὰς ἐπιδεδωκότες, ἐλάχιστον δὲ χλωρὸν ἐχούσας,
    οὗτοί εἰσιν οἱ πιστεύσαντες μόνον, τὰ δὲ ἔργα τῆς ἀνομίας ἐργασάμενοι· οὐδέποτε δὲ ἀπὸ τοῦ Θεοῦ ἀπέστησαν,
    καὶ τὸ ὄνομα ἡδέως ἐβάστασαν, καὶ εἰς τοὺς οἴκους αὐτῶν ἡδέως ὑπεδέξαντο τοὺς δούλους τοῦ Θεοῦ. ἀκούσαντες
    οὖν ταύτην τὴν μετάνοιαν ἀδιστάκτως μετενόησαν, καὶ ἐργάζονται πᾶσαν ἀρετὴν καὶ δικαιοσύνην· 4. τινὲς
    δὲ ἐξ αὐτῶν καὶ παθοῦνται, γινώσκοντες τὰς πράξεις αὐτῶν ἃς ἔπραξαν. τούτων οὖν πάντων ἡ κατοικία
    εἰς τὸν πύργον ἔσται.
