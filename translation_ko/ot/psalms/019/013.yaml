source:
  edition: WLC
  text: גַּ֤ם מִ/זֵּדִ֨ים חֲשֹׂ֬ךְ עַבְדֶּ֗/ךָ אַֽל יִמְשְׁלוּ בִ֣/י אָ֣ז אֵיתָ֑ם וְ֝/נִקֵּ֗יתִי מִ/פֶּ֥שַֽׁע רָֽב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/013.yaml
  text: Also keep your servant back from presumptuous sins[a]; do not let them rule over me. Then I will be blameless[b] and cleared of great transgression[c].
  footnotes:
  - marker: a
    text: Or “the arrogant” or “proud people.” The Hebrew form can refer to arrogant people; the main text understands it as presumptuous acts in parallel with the preceding verse’s errors and hidden faults.
    reason: alternative_reading
  - marker: b
    text: Or “whole” or “complete.”
    reason: lexical_alternative
  - marker: c
    text: Or “great rebellion.”
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 주의 종을 교만한 자들에게서 막아 주십시오[a]. 그들이 저를 지배하지 못하게 해 주십시오. 그러면 제가 온전하게 되고 큰 범죄에서 깨끗하게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교만하여 일부러 짓는 죄들에서’. 히브리어는 교만한 사람들을 가리킬 수도 있고, 교만하고 고의적인 죄들을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁגִיאוֹת
  english_pob_choice: errors
  chosen_korean: 잘못들
  alternatives_korean:
  - 오류들
  - 실수들
  - 죄의 잘못들
  lexicon: HALOT
  rationale: 문맥상 단순한 실수보다 도덕적·영적 책임이 있는 어긋남을 가리키므로, 자연스러운 한국어이면서도 죄책의 뉘앙스를 살리는 ‘잘못들’이 적절합니다.
- source_word: יָבִין
  english_pob_choice: can discern
  chosen_korean: 분별할 수 있습니까
  alternatives_korean:
  - 이해할 수 있습니까
  - 알아차릴 수 있습니까
  - 식별할 수 있습니까
  lexicon: HALOT
  rationale: 수사적 질문의 힘을 살리면서, 자기 잘못을 스스로 온전히 알아차릴 수 없다는 의미를 ‘분별하다’로 자연스럽게 옮깁니다.
- source_word: מִנִּסְתָּרוֹת
  english_pob_choice: from hidden faults
  chosen_korean: 숨은 허물에서
  alternatives_korean:
  - 숨은 죄에서
  - 숨겨진 일들에서
  - 감추어진 허물에서
  lexicon: HALOT
  rationale: POB의 ‘hidden faults’에 맞추어, מִן의 분리 의미를 살려 ‘—에서’로 처리했고, moral sense를 분명히 하는 한국어로 ‘허물’을 택했습니다.
- source_word: נַקֵּנִי
  english_pob_choice: Clear me
  chosen_korean: 저를 깨끗하게 해 주십시오
  alternatives_korean:
  - 저를 깨끗이 해 주십시오
  - 저를 깨끗하게 하소서
  - 저를 정결하게 해 주십시오
  lexicon: HALOT
  rationale: 이 동사는 무죄 선언과 정결하게 함의 뜻을 함께 지닐 수 있으므로, 법정적·정결적 긴장을 유지하는 ‘깨끗하게 해 주십시오’로 옮겼습니다.
theological_decisions:
- issue: ‘hidden faults’의 성격
  chosen_reading: 도덕적으로 숨은 허물/잘못을 가리키는 표현으로 번역했습니다.
  alternative_readings:
  - 비도덕적 의미의 숨은 것들
  - 단순히 감춰진 일들
  rationale: ‘errors’와의 평행이 moral referent를 강하게 지지하므로, 중립적 ‘숨은 것들’보다 죄책이 드러나는 표현을 택하되, 어디까지가 자기 자신에게 숨겨진 것인지는 열어 둡니다.
  doctrine_reference: 죄의 자기 인식 한계와 은밀한 죄에 대한 기도라는 시편의 긴장을 보존합니다.
