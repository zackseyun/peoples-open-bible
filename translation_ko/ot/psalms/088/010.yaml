  text: הֲ/לַ/מֵּתִ֥ים תַּעֲשֶׂה פֶּ֑לֶא אִם רְ֝פָאִ֗ים יָק֤וּמוּ יוֹד֬וּ/ךָ סֶּֽלָה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/010.yaml
  text: Do you work wonders for the dead? Do the departed[a] rise to praise you? Selah
  footnotes:
  - marker: a
    text: Or “the shades,” a poetic term for the dead in the underworld.
