id: JOB.15.31
reference: Job 15:31
source:
  edition: WLC
  text: אַל יַאֲמֵ֣ן ב/שו נִתְעָ֑ה כִּי שָׁ֝֗וְא תִּהְיֶ֥ה תְמוּרָתֽ/וֹ־־׃
translation:
  text: Let him not go astray[a] by trusting in emptiness[b], for emptiness will be his return.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “be led astray.”
    reason: alternative_reading
  - marker: b
    text: The same Hebrew word, repeated here, can also mean “worthlessness” or “falsehood.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  chosen: Let ... not
  alternatives:
  - Do not
  lexicon: HALOT
  rationale: Negative particle used with the imperfect/jussive nuance; in context it introduces a prohibition or warning, best carried by 'Let him not' in English.
- source_word: יַאֲמֵן
  chosen: trust
  alternatives:
  - believe
  - put confidence in
  lexicon: HALOT
  rationale: From אמן in the Hiphil, here meaning to place trust or confidence in something rather than merely to believe a proposition.
- source_word: בְּשָׁוְא
  chosen: in emptiness
  alternatives:
  - in vanity
  - in falsehood
  - in what is worthless
  lexicon: HALOT
  rationale: שָׁוְא commonly denotes emptiness, vanity, or worthlessness, and can also shade toward falsehood. 'Emptiness' preserves the image and pairs well with the repeated שָׁוְא later in the verse.
- source_word: נִתְעָה
  chosen: going astray
  alternatives:
  - being led astray
  - going astray
  - being deluded
  lexicon: HALOT
  rationale: Avoids the unsupported reflexive specification of “deceiving himself” while retaining the verb's possible active/intransitive sense.
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - indeed
  lexicon: HALOT
  rationale: 'Introduces the reason for the warning: the outcome of trusting emptiness.'
- source_word: שָׁוְא
  chosen: emptiness
  alternatives:
  - vanity
  - worthlessness
  - falsehood
  lexicon: HALOT
  rationale: Repeated for rhetorical effect; keeping the same English gloss preserves the Hebrew repetition and the poetic force.
- source_word: תִּהְיֶה
  chosen: will be
  alternatives:
  - shall become
  lexicon: HALOT
  rationale: Simple future/copular sense in context.
- source_word: תְּמוּרָתוֹ
  chosen: what he gets in return
  alternatives:
  - his exchange
  - his return
  - what he gets in return
  lexicon: HALOT
  rationale: Naturally renders the exchange/return sense in context without importing a financial or judicial technicality.
