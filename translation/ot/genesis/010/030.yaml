    prior_rendering: And their settlement was
    new_rendering: The region where they lived extended
    rationale: The verse describes the extent of a people’s inhabited region, not the location of one settlement; the geographical predicate naturally requires “extended.”
  - source_phrase: בֹּאֲכָה סְפָרָה
