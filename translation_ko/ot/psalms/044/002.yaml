base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/002.yaml
  text: With your hand you drove out nations and planted our ancestors; you crushed peoples and sent them away[a].
  footnotes:
  - marker: a
    text: Or, more traditionally, 'O God, we have heard with our ears.'
    reason: lexical_alternative
  - marker: b
    text: Or 'our ancestors'; Hebrew 'our fathers.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in ancient days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 주의 손으로 민족들을 몰아내시고 그들을 심으셨으며[a], 백성들을 괴롭게 하시고 그들을 내보내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 두 ‘그들’이 가리키는 대상은 논쟁의 여지가 있습니다. 첫째 ‘그들’은 문맥상 이스라엘의 조상들을, 마지막 ‘그들’은 민족들/백성들을 가리키는 것으로 흔히 이해됩니다. 또는 마지막 ‘그들’도 이스라엘의 조상들을 가리켜 ‘그들을 널리 퍼지게 하셨다’로 이해할 수 있습니다.
    reason: alternative_reading
