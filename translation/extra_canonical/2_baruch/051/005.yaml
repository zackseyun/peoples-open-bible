translation:
  text: 'When therefore they see that those over whom they are now exalted are then exalted and glorified more than they, then these and those will be changed: the latter into the splendor of angels, but the former will waste away yet more in wonder at the visions and at the sight of the forms[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'see those over whom they are now exalted, that those then are exalted'.
    reason: previous_rendering
