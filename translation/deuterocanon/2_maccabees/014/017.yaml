translation:
  text: Simon, the brother of Judas, had engaged Nicanor in battle, but had been checked by the sudden confusion caused by the enemy[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “slowly ... having stumbled because of the sudden speechlessness of the opponents”; the Greek expression is difficult.
