  text: וַ/יֹּ֨אמֶר֙ אַחַ֣ד מֵֽ/עֲבָדָ֔י/ו ל֖וֹא אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ כִּֽי אֱלִישָׁ֤ע הַ/נָּבִיא֙ אֲשֶׁ֣ר בְּ/יִשְׂרָאֵ֔ל יַגִּיד֙ לְ/מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר בַּ/חֲדַ֥ר מִשְׁכָּבֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/012.yaml
  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: ko
  text: 그러나 그의 신하들 가운데 한 사람이 말했습니다. “아닙니다, 왕이시여. 오히려 이스라엘에 있는 예언자 엘리사가 이스라엘 왕에게 임금님께서 침실에서 하시는 말씀을 알려 줍니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  english_pob_choice: one of his servants
  chosen_korean: 그의 종들 중 하나
  alternatives_korean:
  - 그의 종들 가운데 하나
  - 그의 신하들 중 하나
  lexicon: עֶבֶד / עֲבָדִים
  rationale: 문맥상 왕에게 속한 하위 인물을 가리키므로 ‘종들 중 하나’가 직역에 가깝고, 궁정적 뉘앙스를 살리기 위해 ‘신하’보다 ‘종’을 기본으로 택했습니다.
- source_word: ל֖וֹא
  english_pob_choice: 'No'
  chosen_korean: 아닙니다
  alternatives_korean:
  - 아니요
  - 그렇지 않습니다
  lexicon: לא
  rationale: 왕에게 정중히 반박하는 말이므로 현대 한국어에서 공손하고 자연스러운 부정 응답인 ‘아닙니다’를 썼습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 왕이시여
  alternatives_korean:
  - 주군이시여, 왕이시여
  - 나의 주 왕이시여
  lexicon: אדני + המלך
  rationale: 히브리어의 경칭적 호칭을 한국어 왕호로 옮기되, 과도하게 중첩된 호칭을 줄여 대화체로 자연스럽게 전달했습니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자 선지자
  lexicon: נביא
  rationale: POB의 용례와 표준 한국어를 따라 ‘예언자’를 사용해, 단순히 미래 예측자가 아니라 하나님의 말을 전달하는 자라는 의미를 살렸습니다.
- source_word: בַּחֲדַר מִשְׁכָּבֶךָ
  english_pob_choice: in your bedroom
  chosen_korean: 침실에서
  alternatives_korean:
  - 잠자리에서
  - 침상에서
  lexicon: חדר משכב
  rationale: 히브리어의 은밀한 개인 공간을 나타내는 표현을 현대어로 자연스럽게 풀어 ‘침실’로 옮겼습니다.
theological_decisions:
- issue: 엘리사의 ‘말을 알려 줌’의 성격
  chosen_reading: 엘리사가 왕이 입 밖에 낸 말뿐 아니라 은밀한 방 안의 말까지 하나님께로부터 알게 된다는 암시를 살려 ‘알려 줍니다’로 직역했습니다.
  alternative_readings:
  - 말합니다
  - 엿듣습니다
  rationale: 본문은 예언자의 초자연적 통찰을 설명하는 대목이므로, 단순 발화나 자연적 청취로 축소하지 않았습니다.
  doctrine_reference: 예언과 하나님의 지식에 대한 본문적 진술
- issue: ‘침실’의 사적·은밀한 뉘앙스
  chosen_reading: ‘침실’로 옮겨 왕의 은밀한 공간이라는 대조를 드러냈습니다.
  alternative_readings:
  - 방
  - 잠자리
  rationale: 문맥상 군사 기밀이 새어 나간다는 놀라움이 핵심이므로, 사적인 공간성을 분명히 하는 번역이 필요합니다.
  doctrine_reference: 본문의 수사적 강조
