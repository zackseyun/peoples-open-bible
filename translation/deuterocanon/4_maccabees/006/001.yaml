lexical_decisions:
- source_word: Τοῦτον τὸν τρόπον
  chosen: in this way
  alternatives:
  - thus
  - in this manner
  lexicon: LSJ
  rationale: Idiomatic adverbial phrase introducing the manner of Eleazar's response. 'In this way' is natural modern English and preserves the demonstrative force.
- source_word: ἀντιρρητορεύσαντα
  chosen: had spoken against
  alternatives:
  - had argued against
  - had contradicted
  - had replied in opposition to
  lexicon: LSJ
  rationale: A participle describing Eleazar's oppositional speech. 'Had spoken against' preserves the adversative sense without sounding overly technical; 'argued against' was possible but slightly over-specifies formal debate.
- source_word: παρηγορίαις
  chosen: persuasions
  alternatives:
  - encouragements
  - appeals
  - exhortations
  lexicon: LSJ
  rationale: In context the tyrant is attempting to win Eleazar over, not comfort him in a benign sense. 'Persuasions' captures the coercive rhetorical appeal better than the more positive 'encouragements'.
- source_word: δορυφόροι
  chosen: bodyguards
  alternatives:
  - guards
  - spearmen
  lexicon: LSJ
  rationale: Literally 'spear-bearers,' but in royal context this denotes the tyrant's armed attendants/guard. 'Bodyguards' communicates the functional role in clear English.
- source_word: παραστάντες
  chosen: came forward
  alternatives:
  - stepping forward
  - standing by
  lexicon: LSJ
  rationale: Aorist participle indicating movement into action. 'Came forward' fits the narrative sequence smoothly in English.
- source_word: πικρῶς
  chosen: bitterly
  alternatives:
  - harshly
  - cruelly
  lexicon: LSJ
  rationale: The adverb can denote severity or harshness. 'Bitterly' is the most direct lexical equivalent, though the sense is one of cruel harshness in context.
- source_word: ἔσυραν
  chosen: dragged
  alternatives:
  - hauled
  - pulled
  lexicon: LSJ
  rationale: The verb implies forceful pulling rather than simple leading. 'Dragged' best conveys the violence of the action.
- source_word: ἐπὶ τὰ βασανιστήρια
  chosen: to the tortures
  alternatives:
  - to the instruments of torture
  - to the torture chamber
  - to the torments
  lexicon: LSJ
  rationale: The phrase points to the place or means of torture. 'To the tortures' is concise and keeps the plural concrete as in Greek; alternatives either over-interpret location or shift to a more abstract sense.
- source_word: τὸν Ἐλεάζαρον
  chosen: Eleazar
  rationale: Personal name transliterated according to project policy.
