base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/002.yaml
  text: God, save me by your name, and vindicate me by your might[a].
  footnotes:
  - marker: a
    text: Or “with us.” The Hebrew literally reads “with us,” but “among us” brings out the sense of David hiding within the Ziphites’ area or company.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 주의 이름으로 저를 구원하시고, 주의 능력으로 저를 변호하여 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저를 판단하여 주십시오’ 또는 ‘저의 송사를 변호하여 주십시오.’ 히브리어 동사는 법정에서 판단하거나 판결하는 것을 뜻할 수 있지만, 여기서는 정의를 베풀어 신원해 달라는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  english_pob_choice: when ... came
  chosen_korean: 와서
  alternatives_korean:
  - 올 때
  - 왔을 때
  lexicon: HALOT
  rationale: ב + 부정사구가 시간 절을 이루므로, 사건의 선행을 자연스럽게 드러내는 ‘와서’가 시적 문맥에 맞습니다.
- source_word: הַזִּיפִים
  english_pob_choice: the Ziphites
  chosen_korean: 지프 사람들이
  alternatives_korean:
  - 지프인들
  - 지프 족속이
  lexicon: HALOT
  rationale: 지명 Ziph의 주민 집단을 가리키므로, 고유명사 음역만 두기보다 ‘사람들’로 집단성을 분명히 했습니다.
- source_word: מִסְתַּתֵּר
  english_pob_choice: hiding
  chosen_korean: 숨어 있지 않습니까
  alternatives_korean:
  - 숨고 있지 않습니까
  - 숨은 채 있지 않습니까
  lexicon: HALOT
  rationale: 히트파엘 분사로 지속적 은신 상태를 나타내므로, 진행성과 상태를 함께 살리는 표현을 택했습니다.
- source_word: עִמָּנוּ
  english_pob_choice: among us
  chosen_korean: 우리 가운데
  alternatives_korean:
  - 우리와 함께
  - 우리 안에
  lexicon: HALOT
  rationale: 직역은 ‘우리와 함께’이지만, 문맥상 지파의 영역 안에 숨어 있다는 뉘앙스를 살려 ‘우리 가운데’로 옮겼습니다.
