theological_decisions:
- issue: Nature of the contrast between two kinds of sorrow
  chosen_reading: Render the contrast as 'godly sorrow' versus 'worldly sorrow' without specifying beyond the text whether the resulting 'death' is primarily physical, spiritual, or eschatological.
  alternative_readings:
  - godly sorrow versus merely human sorrow
  - death as specifically spiritual death
  rationale: Paul contrasts sorrow aligned with God and sorrow belonging to the world, but he does not narrowly define the mode of 'death' here. Preserving the broader term avoids importing a doctrinally narrower interpretation than the verse itself states.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: Contextual repentance reassessment
  chosen_reading: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Restore repentance while retaining godly sorrow as its cause and without regret as a distinct expression; this preserves the central semantic distinction without a technical substitute.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
