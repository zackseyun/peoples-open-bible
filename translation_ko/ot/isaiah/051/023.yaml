revisions:
- from: 그리고 내가 너를 괴롭히는 자들의 손에 넘기겠습니다. 그들은 네게 ‘엎드려서 우리가 지나가게 하라’고 말했습니다. 너는 네 등을 땅같이, 네 몸을 지나가는 이들의 거리처럼 만들었습니다.
  to: 그리고 내가 그것을 너를 괴롭히는 자들의 손에 넘기겠습니다. 그들은 네게 ‘엎드려서 우리가 지나가게 하라’고 말했습니다. 너는 네 등을 땅처럼, 지나가는 이들을 위한 거리처럼 만들었습니다.
  rationale: 원문의 지시 목적어를 복원하고, ‘등’이라는 신체 부위를 두 비유에 일관되게 적용했습니다. 통행자와 거리의 용도 관계도 원문의 לְ를 따라 명시했습니다. 그 외 표현은 초안의 현대 표준어 합쇼체와 영어 POB의 의미 범위 안에서 유지했습니다.
