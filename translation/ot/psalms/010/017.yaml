id: PSA.10.17
reference: Psalms 10:17
source:
  edition: WLC
  text: תַּאֲוַ֬ת עֲנָוִ֣ים שָׁמַ֣עְתָּ יְהוָ֑ה תָּכִ֥ין לִ֝בָּ֗/ם תַּקְשִׁ֥יב אָזְנֶֽ/ךָ׃
translation:
  text: O Yahweh, you have heard the desire of the humble[a]; you will strengthen their hearts[b]; your ear will listen,
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “the afflicted.”
    reason: alternative_reading
  - marker: b
    text: Or, “prepare their hearts.”
    reason: alternative_reading
lexical_decisions:
- source_word: תַּאֲוַת
  chosen: desire
  alternatives:
  - longing
  - wish
  lexicon: HALOT
  rationale: The noun denotes desire or longing. 'Desire' is natural English and fits the prayer context without overstating emotional intensity.
- source_word: עֲנָוִים
  chosen: the humble
  alternatives:
  - the afflicted
  - the meek
  lexicon: HALOT
  rationale: The term can denote humble, meek, or afflicted people. In Psalm 10 the oppressed poor are in view, but the word itself carries the sense of lowliness/humility; 'the humble' preserves the lexical sense while fitting the context.
- source_word: שָׁמַעְתָּ
  chosen: you have heard
  alternatives:
  - you heard
  lexicon: HALOT
  rationale: Perfect verb addressed to God. Present perfect in English conveys completed action with present relevance, suitable in prayer-poetry.
- source_word: יְהוָה
  chosen: O Yahweh
  alternatives:
  - the LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: תָּכִין
  chosen: you will prepare
  alternatives:
  - you will establish
  - you will prepare
  lexicon: HALOT
  rationale: “Prepare” is within the Hiphil range of כון in this context. “Make their heart firm” records the closely related establishing/strengthening sense without displacing the chosen rendering.
- source_word: לִבָּם
  chosen: their heart
  alternatives:
  - their mind
  - their inner being
  lexicon: HALOT
  rationale: Hebrew 'heart' is retained rather than interpreted, since it is a central biblical anthropological term and remains understandable in English.
- source_word: תַּקְשִׁיב
  chosen: will listen
  alternatives:
  - will pay attention
  - will give heed
  lexicon: HALOT
  rationale: The Hiphil of קשׁב means to attend or listen attentively. 'Will listen' is concise and idiomatic; the attentiveness is reinforced by the explicit mention of God's ear.
- source_word: אָזְנֶךָ
  chosen: your ear
  alternatives:
  - you
  lexicon: HALOT
  rationale: The Hebrew uses the concrete image 'your ear.' Retaining it preserves the poetic anthropomorphism rather than flattening it to a generic 'you'.
