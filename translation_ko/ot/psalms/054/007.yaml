  text: 내 적들에게 악이 돌아오길 바랍니다[a]. 당신의 신실함으로[b] 그들을 멸망시키소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '악이 나의 대적에게 돌아올 것이다. 주의 성실하심으로 그들을 멸하시리이다' 첫 번째 동사는 의지적이라기보다는 지시적 의미로 읽을 수 있으며, '그들을 파괴하다'는 마지막 동사를 좀 더 문자 그대로 번역한 것입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '당신의 진실로'. 히브리어 단어는 진실, 신뢰성, 신실함을 의미할 수 있습니다.
    reason: lexical_alternative
