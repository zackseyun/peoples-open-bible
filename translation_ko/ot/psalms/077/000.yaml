translation:
  language: ko
  text: 지휘자에게. 여두둔에 따라. 아삽의 시.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 찬양대장에게
  - 최고 음악가에게
  lexicon: HALOT
  rationale: 시편 표제에서 이 형식은 음악 연주의 책임자에게 주는 지시로 쓰이므로, 기능을 살려 현대 한국어로 간결하게 옮겼습니다.
- source_word: עַל
  english_pob_choice: according to
  chosen_korean: 에 따라
  alternatives_korean:
  - 에 맞추어
  - 곡조로
  - 대로
  lexicon: HALOT
  rationale: 여기서는 단순한 위치가 아니라 연주 지시나 곡조 표지를 이끄는 용법이므로, ‘~에 따라’로 자연스럽게 반영했습니다.
- source_word: יְדוּתוּן
  english_pob_choice: Jeduthun
  chosen_korean: 여두둔
  alternatives_korean:
  - 여둣둔
  - 여두톤
  lexicon: 고유명사 음역
  rationale: 고유명사는 한국어 표기 관행에 따라 음역했으며, 특정 용어 해석보다 이름 자체를 보존했습니다.
- source_word: לְאָסָף מִזְמוֹר
  english_pob_choice: A psalm of Asaph
  chosen_korean: 아삽의 시
  alternatives_korean:
  - 아삽을 위한 시
  - 아삽에게 속한 시
  - 아삽의 시편
  lexicon: HALOT
  rationale: לְ + 인명은 저자·연관·봉헌 모두 가능하지만, POB의 영어판처럼 ‘of Asaph’의 유연한 관계를 유지하면서 문학 장르인 ‘시’로 간결하게 옮겼습니다.
