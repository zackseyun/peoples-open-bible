  meaning: Eleazar warns that compromising their faithfulness would make them models of ungodliness for the young by setting an example of eating unclean food.
  meaning_decisions:
  - source_phrase: ἀσεβείας τύπος
    prior_rendering: a pattern of ungodliness
    new_rendering: a model of ungodliness
    rationale: “Model” more clearly identifies their conduct as something the young could imitate, while preserving the religious force of “ungodliness.”
  - source_phrase: ἵνα παράδειγμα γενώμεθα
    prior_rendering: so that we might become an example
    new_rendering: setting an example
