  terminology: « Chefs », « couche » et « puissants » conviennent. « Esclaves » rend plus directement δούλους; une note peut signaler que le terme peut aussi se traduire par « serviteurs » selon le contexte. « C'est pourquoi » rend naturellement la relation rétrospective de ἀνθʼ ὧν.
