id: PSA.119.62
reference: Psalms 119:62
source:
  edition: WLC
  text: חֲצֽוֹת לַ֗יְלָה אָ֭קוּם לְ/הוֹד֣וֹת לָ֑/ךְ עַ֝֗ל מִשְׁפְּטֵ֥י צִדְקֶֽ/ךָ־׃
translation:
  text: At midnight I rise to thank you for your righteous ordinances.
  philosophy: dynamic
lexical_decisions:
- source_word: מִשְׁפְּטֵי
  chosen: ordinances
  alternatives:
  - judgments
  - rules
  - just decrees
  lexicon: HALOT
  rationale: מִשְׁפָּט as a term for God's revealed law is rendered 'ordinances' (his just rulings), keeping it distinct from 'statutes' and avoiding the punitive overtone of 'judgments'; 'judgments/rules' preserved as alternatives.
- source_word: לְהוֹדוֹת לָךְ
  chosen: to thank you
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: ידה in the Hiphil, with ל marking the recipient, here denotes thanking or giving thanks to that person.
