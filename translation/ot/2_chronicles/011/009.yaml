- source_word: וְ/אֶת ... וְ/אֶת ... וְ/אֶת
  chosen: and ... and ... and
  alternatives:
  - with each direct-object marker left untranslated
  lexicon: HALOT
  rationale: The repeated conjunction plus direct-object marker introduces each item in a list dependent on the previous verse's verb ('he built'). In English, the direct-object marker is not represented, but the coordination is preserved naturally as a list with final 'and'.
