  from: May you add days to the days of the king[a][b]; may his years be like generation after generation.
  to: May you add days to the days of the king[a]; may his years be like generation after generation[b].
  rationale: The petitionary main text is a defensible contextual reading of the imperfects. The future-reading alternative pertains to the whole bicola and belongs with the first clause; the literal/idiomatic explanation of דֹר וָדֹר belongs after “generation after generation.” The proposed apparatus accurately distinguishes these matters.
