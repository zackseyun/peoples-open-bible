id: PSA.106.43
reference: Psalms 106:43
source:
  edition: WLC
  text: פְּעָמִ֥ים רַבּ֗וֹת יַצִּ֫ילֵ֥/ם וְ֭/הֵמָּה יַמְר֣וּ בַ/עֲצָתָ֑/ם וַ֝/יָּמֹ֗כּוּ בַּ/עֲוֺנָֽ/ם׃
translation:
  text: Many times he delivered them, but they rebelled by following their own plans and were brought low by their iniquity[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “wasted away because of their iniquity.”
    reason: alternative_reading
lexical_decisions:
- source_word: פְּעָמִים רַבּוֹת
  chosen: Many times
  alternatives:
  - Often
  - Repeatedly
  lexicon: HALOT
  rationale: The phrase literally denotes numerous occurrences. 'Many times' is natural English and preserves the repeated action without over-paraphrasing.
- source_word: יַצִּילֵם
  chosen: he delivered them
  alternatives:
  - he rescued them
  - he saved them
  lexicon: HALOT
  rationale: From נצל in Hiphil, meaning to snatch away, deliver, rescue. 'Delivered' fits Psalmic diction and preserves the sense of repeated divine rescue without importing fuller soteriological overtones that 'saved' may suggest in English.
- source_word: וְהֵמָּה
  chosen: but they
  alternatives:
  - yet they
  - and they
  lexicon: HALOT
  rationale: 'The independent pronoun adds emphasis and contrast. Rendering with ''but they'' captures the adversative force implied by the context: despite God''s repeated deliverance, they responded negatively.'
- source_word: יַמְרוּ
  chosen: rebelled
  alternatives:
  - rebelled
  - were defiant
  lexicon: HALOT
  rationale: A direct verbal rendering preserves the source form without importing a durative “kept.”
- source_word: בַעֲצָתָם
  chosen: in their counsel
  alternatives:
  - by their counsel
  - in their plan
  - through their scheme
  lexicon: HALOT
  rationale: Retains the lexical range of counsel, plan, or purpose.
- source_word: וַיָּמֹכּוּ
  chosen: were brought low
  alternatives:
  - they sank down
  - they wasted away
  - they were humbled
  lexicon: HALOT
  rationale: Natural English for their reduction or abasement without requiring a specified external agent.
- source_word: בַּעֲוֺנָם
  chosen: by their iniquity
  alternatives:
  - in their iniquity
  - through their guilt
  - because of their wrongdoing
  lexicon: HALOT
  rationale: עָוֹן can denote iniquity, guilt, or punishment for guilt. 'By their iniquity' preserves the likely instrumental/causal force of the preposition and keeps the morally weighty term 'iniquity' rather than flattening it to generic wrongdoing.
