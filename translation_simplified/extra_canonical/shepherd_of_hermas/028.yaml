translation:
  text: 'III.1. Again he says to me: Love truth[p], and let all truth come from your mouth. Then the spirit
    which God has made to dwell in this flesh[h] may be found true before all people[g]. In this way the
    Lord who dwells in you will be glorified. For the Lord is true in every word, and there is no falsehood
    with him.


    III.2. So those who lie reject the Lord and become defrauders of the Lord[a]. They do not hand back
    to him the deposit they received[b]. For they received from him a spirit without falsehood[q]. If
    they return it false, they have defiled the Lord’s command and have become defrauders[i].


    III.3. When I heard these things, I wept greatly. Seeing me weeping, he says, “Why are you weeping?”
    “Because, sir[e],” I say, “I do not know whether I can be saved.” “Why?” he says. “Sir,” I say, “I
    have never yet spoken a true word in my life. I have always lived deceitfully with everyone[j], and
    I made my lie appear true before all people. No one ever contradicted me. My word was believed. How
    then, sir, can I live after doing these things?”


    III.4. He says, “You are thinking rightly and truly. As a servant of God[k], you ought to have walked
    in truth. You ought not to have let an evil conscience dwell with the spirit of truth[l], or brought
    grief upon the venerable and true spirit[c].” “Sir,” I say, “I have never heard such words precisely[r].”


    III.5. “Now you are hearing,” he says. “Keep them, so that even the earlier lies you spoke in your
    dealings[m], when these are found true[d], may also become credible. For those too can become credible.
    If you keep these and speak all truth from now on, you will be able to gain life for yourself[n].
    Whoever hears this command and abstains from the most evil lie[o] will live to God[f].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Defrauders retains the active aposterētai sense: those who deprive or defraud the Lord, rather
      than those bereft of him. The entrusted-deposit comparison supports that earlier adjudication. Antiochus
      Homily66, PG89 column1629, retains the active defrauder wording in an adapted excerpt. The Ethiopic
      edition’s Latin rendering printed129 instead has deserters of the Lord; that mediated version is
      not direct Geʿez or an additional Latin family.'
    reason: lexical_alternative
  - marker: b
    text: Deposit renders parakatathēkē, something entrusted for safekeeping; compare 1 Timothy6:20 and
      2 Timothy1:12,14. These are contextual parallels, not manuscripts of Hermas. The selected text has
      not handing back to him what they received. Antiochus’s adapted excerpt uses the shorter parathēkē
      and a return verb rather than the selected paradidontes; its Greek and facing Latin are one transmission
      context, not two independent witnesses.
    reason: cross_reference
  - marker: c
    text: Venerable restores the earlier semnos choice, also august or noble, already retained in the
      old lexical entry and note. An intervening revision changed the main text to holy, but the selected
      Greek and Athos PlateV have semnos rather than hagios. This is an explicit reconsideration of that
      revision, whose full history remains archived. Vulgata printed38 and Palatina printed77 have holy
      in Latin, while the Ethiopic edition’s mediated Latin printed129 has pure. Those differences are
      disclosed rather than imported into the selected Greek. Lowercase spirit does not decide the gift’s
      identity or deny the earlier divine-indwelling interpretation.
    reason: lexical_alternative
  - marker: d
    text: When these are found true renders the genitive absolute toutōn heurethentōn alēthinōn, also
      as these are found true. The earlier if these are found true was an interpretive conditional rendering.
      The earlier preferred interpretation takes these as words now spoken truly, with former utterances
      becoming credible; the alternative takes these as the earlier utterances themselves. Neither restored
      reputation nor a mechanism that makes a past falsehood true is inserted into the main text. This
      ambiguous construction is distinct from the explicit if-you-keep condition later in the paragraph.
    reason: alternative_reading
  - marker: e
    text: Sir retains the earlier direct-address rendering of kyrie to the messenger. It distinguishes
      that dialogue address from the Lord used of the one rejected or glorified. The weeping, salvation
      uncertainty, questions and speaker changes remain; no assurance of already having been saved replaces
      Hermas’s question.
    reason: cultural_note
  - marker: f
    text: Will live to God retains zēsetai tō theō and the earlier authorial-refrain decision. Will live
      for God is a smoother interpretive alternative. The selected ending does not specify eternal life
      or restrict the promise to present vitality. The Ethiopic edition’s mediated Latin printed130 instead
      has live to the Lord. Palatina printed77 earlier adds perpetual to gaining life; that extra qualification
      is not imported.
    reason: lexical_alternative
  - marker: g
    text: Before all people retains the earlier explicit adjudication for para pasin anthrōpois, rather
      than by all people as direct agency. The old by-all alternative remains archived. The same before-all
      construction also remains in Hermas’s confession. Athos, the consulted Latin versions and the adapted
      Antiochus excerpt retain corresponding before-all/in-the-sight-of-all wording; supplied Sinaiticus
      letters are not claimed as wholly visible first-hand ink.
    reason: lexical_alternative
  - marker: h
    text: God has caused to dwell in this flesh retains God, this flesh and the indwelling image. Vulgata
      printed37 and Palatina printed75 instead name Lord; Palatina and the Ethiopic edition’s mediated
      Latin use body rather than the selected flesh. The selected Lord who dwells in you differs from
      the Latin versions’ gave-the-spirit or above-you expressions. Antiochus Homily66 retains God/flesh
      but adapts the indwelling address to the man and the glorification syntax. It does not quote the
      opening love-truth command in that form.
    reason: textual_variant
  - marker: i
    text: The selected conditional says that returning the received spirit false has defiled the command
      of the Lord and made the liars defrauders. Antiochus Homily66 instead says they defiled God’s deposit,
      a substantive adapted-excerpt difference. Palatina printed75 adds giving an account, which is not
      added here. Vulgata printed37 brackets its first defrauders clause as editorially supplied from
      Palatina and Greek; the supplied clause is not counted as preserved Latin manuscript ink. Sinaiticus28.2
      preserves only the opening before a large gap, not this full deposit/command warning.
    reason: textual_variant
  - marker: j
    text: Always lived deceitfully with everyone retains the confession’s prior choice and its universal
      wording, alongside never a true word, all people, and no one ever contradicting him. The speech
      is Hermas’s reported confession, not an editorial claim about every event in his life. Both printed
      Latin versions and the Ethiopic edition’s mediated Latin retain the dialogue with differing phrasing.
      Sinaiticus has no paragraph3 verse element across its 45-line gap, and the Antiochus excerpt omits
      this dialogue; neither supplies a complete manuscript reading here.
    reason: textual_variant
  - marker: k
    text: Servant of God follows current DOCTRINE.md, Translation philosophy and Contested terms/doulos.
      Bondservant and slave express the bonded-status, ownership and total-allegiance dimension, retained
      here in the note. Earlier metadata and a historical regression entry called slave the project default;
      those entries are archived and reconciled to the current servant policy, rather than used to reverse
      the current main text. The selected God is retained where the Ethiopic edition’s mediated Latin
      printed129 instead has servant of the Lord.
    reason: lexical_alternative
  - marker: l
    text: Evil conscience, spirit of truth, the negative against dwelling together, and nor bringing grief
      all remain. The earlier divine-gift interpretation is preserved as an interpretation rather than
      converted into a new proper name. Neither human spirit nor a detailed identification of the indwelling
      spirit is supplied as a certainty in the main text. The spirit of truth and venerable/true description
      are not collapsed into a single substituted title.
    reason: lexical_alternative
  - marker: m
    text: Former lies spoken in your dealings retains spoken falsehoods and the dealings setting; business
      dealings is a possible narrower rendering. Palatina printed77 instead speaks of earlier actions
      and explicitly later true deeds. The selected text retains its repeated becoming credible rather
      than adding forgiveness or a theory that good deeds erase past lies. The Ethiopic edition’s mediated
      Latin printed129 uses different true/credible wording. Sinaiticus’s gap and Antiochus’s abridgment
      do not attest this whole earlier-lies passage.
    reason: textual_variant
  - marker: n
    text: If you keep these and from now on speak all truth retains both parts of the explicit condition,
      now, all, will be able and gaining life for yourself. Antiochus Homily66 abbreviates this to keeping
      truth and being able to gain life, then adds protection by truth; its addition and abridgment do
      not replace the full selected condition. Palatina printed77 has different no-falsehood/love-truth
      conditions and perpetual life. No quantity of good deeds or guaranteed salvation apart from the
      stated condition is added.
    reason: textual_variant
  - marker: o
    text: Abstains translates the selected apechētai, which the printed apparatus identifies as Hilgenfeld’s
      conjecture. Sinaiticus28.5 has partial letters with supplied material in the verb; its electronic
      completion cannot be counted as a fully visible verb endorsing the conjecture. Athos PlateV prints
      aphexetai, a future refrain/abstain form. The Latin versions and mediated Ethiopic have differing
      hear/do/obey/abstain formulations and do not settle the exact Greek form. The selected hears-and-abstains
      sequence and most evil superlative remain; no specific oath, perjury or apostasy referent is inserted.
    reason: textual_variant
  - marker: p
    text: Love truth and let all truth go forth retain both instructions and all, rather than reducing
      the opening to a general preference for honesty. The selected source’s repeated truth/true/falsehood
      contrasts remain. Antiochus’s adapted excerpt begins with the necessity of all truth coming from
      a person’s mouth rather than the exact love-truth opening; its shorter opening is not substituted.
    reason: lexical_alternative
  - marker: q
    text: Received from him a spirit without falsehood retains received, from him and the negative description.
      The earlier divine-indwelling-gift interpretation remains in the metadata, with the human-spirit
      alternative recorded; no additional doctrine is inserted into the wording. Antiochus’s adapted excerpt
      retains spirit without falsehood but does not repeat the selected from him. Sinaiticus does not
      preserve this whole sentence across its gap.
    reason: textual_variant
  - marker: r
    text: Precisely restores the earlier akribōs lexical choice, also exactly. The intervening main-text
      clearly is archived. The selected statement is that Hermas has never heard such words precisely;
      it does not say the teaching had never existed. The consulted versions use carefully/diligently
      or a shorter never-heard form, rather than requiring one identical adverb in every witness.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπα
  chosen: love
  lexicon: BDAG
  rationale: Standard rendering of agapaō in imperative; retains ethical force of affection and commitment.
- source_word: ἀλήθεια / ἀληθής / ἀληθινός
  chosen: truth / true
  alternatives:
  - genuine
  - real
  lexicon: BDAG
  rationale: Consistent rendering keeps Hermas’s repeated emphasis on truthfulness concrete and ethical.
- source_word: ἐκπορευέσθω
  chosen: go forth
  alternatives:
  - proceed
  - come out
  lexicon: BDAG
  rationale: “Go forth” preserves vivid imagery of speech issuing from the mouth without over-smoothing.
- source_word: πνεῦμα
  chosen: spirit
  alternatives:
  - Spirit
  lexicon: BDAG
  rationale: Rendered lower-case to preserve Hermas’s idiom and allow interpretive openness; context suggests
    a divine gift dwelling in the believer.
- source_word: κατῴκισεν
  chosen: made to dwell
  alternatives:
  - caused to dwell
  - settled
  lexicon: LSJ
  rationale: Causative nuance of katoikizō fits the phrase "which God made to dwell in this flesh."
- source_word: Κύριος
  chosen: the Lord
  alternatives:
  - Master
  lexicon: BDAG
  rationale: Title for God/Christ retained as “the Lord” per project conventions.
- source_word: ψεῦδος / ψεύδομαι / ψεῦσμα
  chosen: falsehood / tell lies / lie
  alternatives:
  - falsehood / lie
  lexicon: BDAG
  rationale: Varies slightly to fit English syntax while keeping the same semantic field; maintains ethical
    weight of lying.
- source_word: ἀθετοῦσι
  chosen: set aside
  alternatives:
  - reject
  - nullify
  lexicon: BDAG
  rationale: “Set aside” captures the act of disregarding/repudiating the Lord’s claim inherent in the
    metaphor.
- source_word: ἀποστερηταί
  chosen: defrauders
  alternatives:
  - robbers
  - deprivers
  lexicon: LSJ
  rationale: Active sense suits the deposit metaphor; they wrongfully withhold what is owed to the Lord.
- source_word: παρακαταθήκη
  chosen: deposit
  alternatives:
  - trust
  - pledge
  lexicon: BDAG
  rationale: Technical term for something entrusted for safekeeping; the imagery governs the paragraph.
- source_word: ἄψευστον
  chosen: without falsehood
  alternatives:
  - unlying
  - truthful
  lexicon: LSJ
  rationale: Retains the privative force; “unlying” is vivid but less idiomatic in modern English.
- source_word: ἐμίαναν
  chosen: defiled
  alternatives:
  - stained
  - polluted
  lexicon: BDAG
  rationale: Carries moral/ritual contamination imagery appropriate to Hermas’s exhortational tone.
- source_word: πανοῦργος
  chosen: craftily
  alternatives:
  - with guile
  - cunningly
  lexicon: LSJ
  rationale: Conveys ethically negative shrewdness; adverbial in English fits the confession.
- source_word: ἀντεῖπεν
  chosen: contradicted
  alternatives:
  - gainsaid
  - opposed
  lexicon: BDAG
  rationale: Modern and clear rendering of a direct contradiction in speech.
- source_word: φρονεῖς
  chosen: are thinking
  alternatives:
  - judge
  - are minded
  lexicon: BDAG
  rationale: Hermas’s assessor affirms Hermas’s moral evaluation; “think” is straightforward.
- source_word: δοῦλος
  chosen: servant
  alternatives:
  - bondservant
  - slave
  lexicon: Prior lexical record and current DOCTRINE.md Contested terms/doulos
  rationale: Reconcile the old slave-default metadata with current reader-facing servant policy; retain
    bonded ownership and allegiance in note k. Earlier adjudications remain archived.
- source_word: πορεύεσθαι
  chosen: walk
  alternatives:
  - conduct oneself
  - live
  lexicon: BDAG
  rationale: Standard metaphor for ethical conduct; preserves biblical-register diction.
- source_word: συνείδησιν
  chosen: conscience
  lexicon: BDAG
  rationale: Established rendering; ethical inner awareness is in view.
- source_word: πνεῦμα τῆς ἀληθείας
  chosen: spirit of truth
  alternatives:
  - Spirit of truth
  lexicon: BDAG
  rationale: Lower-case to avoid importing later Trinitarian capitalization while preserving the phrase.
- source_word: λύπην ἐπάγειν
  chosen: bring grief
  alternatives:
  - cause sorrow
  - afflict with grief
  lexicon: BDAG
  rationale: Direct, maintains affective force toward the spirit.
- source_word: σεμνός
  chosen: venerable
  alternatives:
  - august
  - noble
  lexicon: LSJ
  rationale: Captures reverent/august quality without importing “holy,” which is not the word used.
- source_word: ἀκριβῶς
  chosen: precisely
  alternatives:
  - exactly
  lexicon: BDAG
  rationale: Conveys exactness; Hermas expresses surprise at the clarity/precision.
- source_word: φύλασσε
  chosen: guard
  alternatives:
  - keep
  - observe
  lexicon: BDAG
  rationale: Preserves vigilant sense of keeping a command.
- source_word: πραγματείαις
  chosen: dealings
  alternatives:
  - business affairs
  - transactions
  lexicon: LSJ
  rationale: Secular-commercial sphere of life; “dealings” is concise and natural.
- source_word: πιστά
  chosen: trustworthy
  alternatives:
  - reliable
  - believed
  lexicon: BDAG
  rationale: In context describes words that can be credited as true.
- source_word: λαλήσῃς
  chosen: speak
  alternatives:
  - say
  lexicon: BDAG
  rationale: Neutral verb for utterance; repeated often in this unit.
- source_word: ζωὴν περιποιήσασθαι
  chosen: secure life
  alternatives:
  - gain life
  - obtain life
  lexicon: BDAG
  rationale: Peripoieō has the sense of acquiring/preserving for oneself; “secure” balances nuance and
    readability.
- source_word: ἀπέχηται
  chosen: keeps away
  alternatives:
  - abstains
  - holds back from
  lexicon: BDAG
  rationale: Concrete ethical abstention; modern idiom.
- source_word: πονηροτάτου
  chosen: most wicked
  alternatives:
  - most evil
  - worst
  lexicon: BDAG
  rationale: Superlative preserved to maintain the intensification.
- source_word: ζήσεται τῷ Θεῷ
  chosen: will live to God
  alternatives:
  - will live for God
  - will live unto God
  lexicon: BDAG
  rationale: Retains the dative’s orientation; “to God” is a transparent rendering of the phrase.
