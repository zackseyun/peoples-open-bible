  from: by what is called “circumcision,” made by hands in the flesh—
  to: by the so-called “circumcision” made by hands in the flesh—
  rationale: The current phrasing is grammatically correct but stylistically awkward. The comma after 'circumcision' makes 'made by hands in the flesh' feel like a tacked-on, non-restrictive clause. In the Greek, 'χειροποιήτου' ('handmade') is a single adjective tightly modifying 'περιτομῆς' ('circumcision'). Using 'the so-called' (a valid alternative for 'λεγομένης') allows for a more integrated English phrase ('the so-called circumcision made by hands...'), which better reflects the tight connection in the source text and improves the flow of an already complex sentence.
