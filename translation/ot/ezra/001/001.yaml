theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Fulfillment language for לִכְלוֹת דְּבַר יְהוָה מִפִּי יִרְמְיָה
  chosen_reading: so that the word of Yahweh spoken by Jeremiah might be fulfilled
  alternative_readings:
  - when the word of the LORD spoken by Jeremiah was completed
  - to complete the word of the LORD from the mouth of Jeremiah
  rationale: The verse frames Cyrus's decree as the realization of prophetic speech. 'Fulfilled' preserves the theological connection between prophecy and historical event without adding doctrinal content beyond the text.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
