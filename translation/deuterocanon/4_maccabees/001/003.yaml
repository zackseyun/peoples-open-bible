translation:
  text: If, then, reason clearly prevails over the passions that hinder self-control—gluttony and desire,
  philosophy: dynamic
lexical_decisions:
- source_word: εἰ ἄρα
  chosen: if, then
  alternatives:
  - if indeed
  - if therefore
  lexicon: LSJ
  rationale: Introduces the protasis with an inferential nuance. 'If, then' preserves both the conditional force of εἰ and the connective/inferential flavor of ἄρα without overformal stiffness.
- source_word: τῶν σωφρονούντων
  chosen: that hinder self-control
  alternatives:
  - of the self-controlled
  - belonging to those who are self-controlled
  lexicon: LSJ
  rationale: The transmitted phrase is compressed and syntactically difficult with κωλυτικῶν παθῶν. In context, the sense is of passions that obstruct σωφροσύνη/self-control. Rendering the phrase adjectivally in relation to the passions gives clear English while staying anchored to the Greek idea.
- source_word: κωλυτικῶν παθῶν
  chosen: the passions that hinder
  alternatives:
  - hindering passions
  - obstructive passions
  lexicon: LSJ
  rationale: κωλυτικός means hindering/preventing; πάθη are passions, impulses, or emotions. 'The passions that hinder' is natural English and prepares for the following examples.
- source_word: ὁ λογισμός
  chosen: reason
  alternatives:
  - rational judgment
  - the rational mind
  lexicon: LSJ
  rationale: In 4 Maccabees λογισμός is a key philosophical term for reasoned judgment. 'Reason' is concise and idiomatic, while preserving the conceptual weight of the argument.
- source_word: φαίνεται ἐπικρατεῖν
  chosen: is evidently able to prevail over
  alternatives:
  - appears to master
  - seems to overcome
  - is shown to prevail over
  lexicon: LSJ
  rationale: 'φαίνεται can mean ''appears/is shown,'' and ἐπικρατεῖν means to prevail over or master. ''Is evidently able to prevail over'' captures the argumentative tone: the claim is being demonstrated, not merely guessed.'
- source_word: γαστριμαργίας
  chosen: gluttony
  alternatives:
  - greediness of appetite
  - voraciousness
  lexicon: LSJ
  rationale: The term denotes excessive appetite, especially for food. 'Gluttony' is the standard concise English equivalent.
- source_word: ἐπιθυμίας
  chosen: desire
  alternatives:
  - craving
  - lust
  lexicon: LSJ
  rationale: ἐπιθυμία is broad desire/craving. 'Desire' is the least overdetermined choice here, since the context has not yet narrowed it specifically to sexual lust.
