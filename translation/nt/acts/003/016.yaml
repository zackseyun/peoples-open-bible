theological_decisions:
- issue: Meaning of 'faith in/through his name' and agency of healing
  chosen_reading: The verse attributes the man's strengthening to Jesus' name, with faith related to that name and mediated through Jesus, without specifying more narrowly whose faith is in view.
  alternative_readings:
  - the healed man's faith in Jesus' name
  - the apostles' faith in Jesus' name
  - faith generated by Jesus
  rationale: The Greek emphasizes the efficacy of Jesus' name and mentions faith both 'in his name' and 'through him,' but does not explicitly identify the human subject of that faith in this verse. The translation preserves that tension rather than resolving it.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: Metonymic force of 'name'
  chosen_reading: '''His name'' is retained in the main text as a metonym for Jesus'' person and authority.'
  alternative_readings:
  - Jesus himself has made this man strong
  - the power of his name has made this man strong
  rationale: Acts frequently uses 'name' in a theologically charged way. Retaining the expression avoids flattening Luke's wording while still being intelligible in English.
