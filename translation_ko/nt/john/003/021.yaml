revisions:
- from: 그러나 진리를 행하는 자는 빛으로 나아옵니다[a], 그리하여 그의 행위들이 드러나게 하려는 것입니다[d][c][b]. 이는 그 행위들이 하나님 안에서 행하여졌기 때문입니다.
  to: 그러나 진리를 행하는 사람은 자신의 행위들이 하나님 안에서 이루어졌음이 드러나도록 빛으로 나아옵니다[a][d][c][b].
  rationale: The revision retains the formal Johannine wording while restructuring the sentence so that the ἵνα purpose clause modifies ‘빛으로 나아옵니다’ naturally in Korean. It renders ὅτι as the content of disclosure—‘his works have been done in God’—which closely follows the Greek sequence and avoids treating a debated connective as unambiguously causal. The causal alternative remains explicitly available in footnote b, and the open force of ἐν θεῷ remains unaltered.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T07:47:28Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the principal lexical elements, including ποιῶν τὴν ἀλήθειαν as ‘진리를 행하는’ and ἐν θεῷ as ‘하나님 안에서.’ However, its division into ‘그리하여 … 하려는 것입니다. 이는 … 때문입니다’ makes the purpose construction syntactically awkward and commits the disputed ὅτι clause to a causal reading in the main text. In this construction, ὅτι is very naturally read as the content of what is disclosed. The revision adopts that reading while retaining the causal alternative in a footnote.
  naturalness: '‘그의 행위들이 드러나게 하려는 것입니다’ is not a natural independent Korean predicate following ‘나아옵니다.’ Integrating the purpose clause before the main verb produces fluent modern formal Korean: ‘… 이루어졌음이 드러나도록 빛으로 나아옵니다.’'
  terminology: ‘진리를 행하는’ appropriately preserves the striking Johannine idiom without reducing it to mere factual truth or imposing an interpretation. ‘행위’ and ‘하나님 안에서’ are suitable. ‘이루어졌음’ naturally expresses the perfect passive resultative force of ἐστιν εἰργασμένα more idiomatically than repeating ‘행하여졌.’
  issues:
  - severity: medium
    issue: The purpose clause is syntactically awkward in the Korean draft.
    rationale: ‘빛으로 나아옵니다, 그리하여 그의 행위들이 드러나게 하려는 것입니다’ lacks a natural Korean connection and obscures that ἵνα governs the purpose of coming to the light.
  - severity: medium
    issue: The main text selects the causal sense of ὅτι where the content sense is at least as plausible and fits the Greek construction especially well.
    rationale: ‘His works may be revealed, namely/that they have been done in God’ is a standard and source-sensitive construal. Since the clause is disputed, the causal construal is preserved in a footnote rather than excluded.
  - severity: low
    issue: Footnote a describes the literal Greek phrase as a nominal expression rather than a verbal expression.
    rationale: ‘진리를 행한다’ more precisely represents ποιεῖν τὴν ἀλήθειαν than ‘진리를 행하는 것.’
  revised_text: 그러나 진리를 행하는 사람은 자신의 행위들이 하나님 안에서 이루어졌음이 드러나도록 빛으로 나아옵니다[a][d][c][b].
