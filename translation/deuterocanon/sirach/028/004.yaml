translation:
  text: How can someone show no mercy to a fellow human being, yet ask for their own sins to be forgiven?
  philosophy: dynamic
lexical_decisions:
- source_word: ἐπʼ ἄνθρωπον ὅμοιον αὐτῷ
  chosen: on a man like himself
  alternatives:
  - on a person like himself
  - toward one like himself
  lexicon: LSJ
  rationale: The Zone 1 Hebrew appears unrelated to this verse and is marked with a minor mismatch, so the Greek parallel supplies the usable wording. ἄνθρωπον is singular and masculine in form; per project philosophy, 'man' is retained rather than neutralized, while the sense is representative of a fellow human being. ὅμοιον αὐτῷ indicates one similar to oneself, hence 'like himself'.
- source_word: οὐκ ἔχει ἔλεος
  chosen: has no mercy
  alternatives:
  - shows no mercy
  - does not have compassion
  lexicon: BDAG
  rationale: ἔλεος is most naturally 'mercy' in this ethical context, matching the surrounding theme of forgiveness and compassion. 'Has no mercy' preserves the Greek verbal construction with clear English.
- source_word: καὶ περὶ τῶν ἁμαρτιῶν αὐτοῦ δεῖται
  chosen: yet he asks for his own sins to be forgiven
  alternatives:
  - and does he pray concerning his sins?
  - yet he begs concerning his sins?
  lexicon: BDAG
  rationale: 'δεῖται commonly means ''asks, begs, entreats, prays.'' In context, the object of the request is implicit: he seeks pardon for his sins. Rendering the implication explicitly in English makes the rhetorical contrast clear without overstepping the sense of the clause. ''Yet'' brings out the adversative force of the rhetorical question.'
