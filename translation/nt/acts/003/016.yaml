  from: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
  to: Through faith in Jesus’ name[a], his name itself has strengthened this man whom you see and know. The faith that comes through him has given him this complete healing in the presence of you all.
  rationale: The recorded revision rightly recognized the deliberate repetition of 'name,' so its emphatic 'itself' is retained. The lexical and theological records also support leaving whose faith is involved unstated, while the earlier health alternatives clarify the physical sense of 'wholeness.'
