base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/015.yaml
  text: And you shall say[a], ‘To the Lord our God belongs righteousness, but to us shame of face, as it is this day—to the people of Judah and to the inhabitants of Jerusalem,’
translation:
  language: pt
  text: 'E vocês dirão: “Ao Senhor, nosso Deus, pertence a retidão[a], mas a nós, a vergonha que se vê em nossos rostos, como se vê hoje entre o povo de Judá e os habitantes de Jerusalém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “justiça”. O termo grego pode indicar tanto justiça quanto retidão moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖτε
  choice: direis
  rationale: O futuro do indicativo tem força diretiva no contexto e preserva o tom solene da instrução litúrgica.
- source_word: κυρίῳ θεῷ ἡμῶν
  choice: ao Senhor, nosso Deus
  rationale: Reproduz naturalmente a relação dativa e mantém κύριος como “Senhor”, sem introduzir uma forma do nome divino ausente do texto grego.
- source_word: ἡ δικαιοσύνη
  choice: pertence a justiça
  rationale: A frase grega é elíptica; “pertence” explicita em português a atribuição contrastiva. “Justiça” conserva o campo semântico de δικαιοσύνη, enquanto “retidão” permanece alternativa válida.
- source_word: αἰσχύνη τῶν προσώπων
  choice: a vergonha estampada no rosto
  rationale: Expressa de maneira clara o semitismo que designa vergonha ou desonra manifesta no rosto, sem reduzir o sentido a mero sentimento interior.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: como se vê neste dia
  rationale: Comunica o valor idiomático da fórmula, que aponta para a situação presente como prova visível da vergonha confessada.
- source_word: ἀνθρώπῳ Ἰούδα
  choice: ao povo de Judá
  rationale: Embora ἀνθρώπῳ esteja no singular, a expressão tem sentido coletivo e aparece em paralelo com os habitantes de Jerusalém; “povo de Judá” é natural e inclusivo em português.
- source_word: τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: aos habitantes de Jerusalém
  rationale: Tradução direta, corrente e digna da construção participial.
theological_decisions:
- issue: Sentido de δικαιοσύνη na confissão que contrasta Deus com a vergonha do povo
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva a amplitude moral e judicial do termo grego; “retidão” destaca mais diretamente a correção moral e, por isso, é registrada em nota sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, solene e acessível, com futuro diretivo (“direis”) e formulação natural do semitismo relativo à vergonha visível no rosto.
