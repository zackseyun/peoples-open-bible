id: ISA.26.21
reference: Isaiah 26:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה יְהוָה֙ יֹצֵ֣א מִ/מְּקוֹמ֔/וֹ לִ/פְקֹ֛ד עֲוֺ֥ן יֹֽשֵׁב הָ/אָ֖רֶץ עָלָ֑י/ו וְ/גִלְּתָ֤ה הָ/אָ֨רֶץ֙ אֶת דָּמֶ֔י/הָ וְ/לֹֽא תְכַסֶּ֥ה ע֖וֹד עַל הֲרוּגֶֽי/הָ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/026/021.yaml
  text: For look, the LORD is coming out from his place to punish the iniquity of the inhabitant of the earth upon him, and the earth will uncover her blood and will no longer cover her slain.
translation:
  language: ko
  text: 보십시오, 야훼께서 자기 처소에서 나오셔서 땅에 사는 사람에게 그의 죄악을 물으시려고 합니다. 땅이 그 피를 드러내고, 그 살해당한 이들을 더는 덮지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 히브리어 כִּי הִנֵּה의 주의를 환기하는 표현을 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 본문의 신명(神名)은 POB 기본값에 따라 학술적 음역인 ‘야훼’로 옮겨, 본문이 하나님의 고유명을 직접 드러내도록 했습니다.
- source_word: יֹצֵא מִמְּקוֹמוֹ
  english_pob_choice: is coming out from his place
  chosen_korean: 자기 처소에서 나오셔서
  alternatives_korean:
  - 그 자리에서 나와
  - 그 처소를 떠나
  lexicon: יצא
  rationale: ‘나오다’의 이동 의미를 살리면서 ‘자기 처소’로 하나님의 현현·재판 이미지를 유지했습니다.
- source_word: לִפְקֹד עֲוֺן
  english_pob_choice: to punish the iniquity
  chosen_korean: 죄악을 … 벌하시려
  alternatives_korean:
  - 죄악을 심판하시려
  - 죄악을 갚으시려
  lexicon: פקד
  rationale: 동사 פקד는 단순 관찰이 아니라 책임을 묻는 심판 행위를 가리키므로, 문맥상 ‘벌하다’로 옮겼습니다.
- source_word: וְגִלְּתָה הָאָרֶץ אֶת דָּמֶיהָ
  english_pob_choice: and the earth will uncover her blood
  chosen_korean: 땅이 자기 피를 드러내고
  alternatives_korean:
  - 땅이 그 피를 밝히고
  - 땅이 자기의 피를 폭로하고
  lexicon: גלה + דם
  rationale: ‘피를 드러내다’는 직역에 가까우면서도, 땅이 숨겨진 살육의 증거를 폭로하는 이미지를 유지합니다.
theological_decisions:
- issue: ‘upon him’의 지시 대상과 심판의 방향
  chosen_reading: ‘그에게’로 옮겨, 땅의 주민의 죄악이 결국 그 책임자에게 돌아가 심판이 임한다는 문맥을 살렸습니다.
  alternative_readings:
  - ‘그들 위에’로 집단적 귀속을 약화시킴
  - ‘땅 위에’로 평이하게 처리함
  rationale: 히브리어 עָלָיו는 단수 지시를 가지며, 본문의 심판 논리는 죄악의 책임 귀속을 강조합니다.
  doctrine_reference: 공의로운 심판과 책임 귀속
