source:
  edition: WLC
  text: זַ֭רְע/וֹ לְ/עוֹלָ֣ם יִהְיֶ֑ה וְ/כִסְא֖/וֹ כַ/שֶּׁ֣מֶשׁ נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/037.yaml
  text: Like the moon, it will be established forever, a faithful witness in the sky[a]. Selah
  footnotes:
  - marker: a
    text: Or 'His seed will be forever'; 'offspring' renders the collective sense of the Hebrew more naturally in modern English.
    reason: lexical_alternative
  - marker: b
    text: Or 'in my presence.' The Hebrew literally says 'before me.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and his throne like the sun before me'.
    reason: previous_rendering
translation:
  language: ko
  text: 달처럼 영원히 굳게 설 것이며, 하늘의 증인은 신실합니다.[a][b] 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘달과 같이’.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘의 증인’은 흔히 달을 가리키는 것으로 이해되지만, 히브리어 본문은 그 정체를 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זַרְעוֹ
  english_pob_choice: his offspring
  chosen_korean: 그의 후손
  alternatives_korean:
  - 그의 씨
  - 그의 자손
  lexicon: HALOT
  rationale: זֶרַע는 문자적으로는 ‘씨’이지만, 왕조적 약속 문맥에서는 집단적 후손을 가리키므로 현대 한국어에서는 ‘후손’이 가장 자연스럽고 의미도 잘 드러납니다.
- source_word: לְעוֹלָם יִהְיֶה
  english_pob_choice: will endure forever
  chosen_korean: 영원히 지속될 것이며
  alternatives_korean:
  - 영원할 것이며
  - 영원히 있을 것이며
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘있다’이지만, 시적·언약적 문맥에서 지속성을 분명히 드러내기 위해 ‘지속될 것이다’로 옮겼습니다.
- source_word: וְכִסְאוֹ
  english_pob_choice: and his throne
  chosen_korean: 그의 왕좌는
  alternatives_korean:
  - 그의 보좌는
  - 그의 왕위는
  lexicon: HALOT
  rationale: כִּסֵּא는 왕권의 구체적 표상인 ‘왕좌’가 가장 직접적입니다. 추상화된 ‘왕위’보다 원문의 이미지가 살아납니다.
- source_word: כַשֶּׁמֶשׁ נֶגְדִּי
  english_pob_choice: like the sun before me
  chosen_korean: 제 앞의 해와 같을 것입니다
  alternatives_korean:
  - 제 앞에서 해와 같을 것입니다
  - 제 앞에 있는 해와 같을 것입니다
  lexicon: HALOT
  rationale: נֶגְדִּי는 ‘제 앞에/제 면전에’라는 뜻이므로, 직역성을 살리되 한국어로 자연스럽게 ‘제 앞의 해’로 옮겼습니다.
theological_decisions:
- issue: 시편 89편의 화자 정체와 1인칭 표현
  chosen_reading: 하나님의 직접 발화로 읽히는 1인칭을 그대로 살려 ‘제 앞의’로 번역했습니다.
  alternative_readings:
  - 더 풀어서 ‘제 임재 안에서’로 옮김
  rationale: 문맥상 여호와의 언약 선언이므로 1인칭 관계성을 흐리지 않는 것이 중요합니다. ‘제 앞의’는 직접성과 엄숙함을 함께 유지합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
