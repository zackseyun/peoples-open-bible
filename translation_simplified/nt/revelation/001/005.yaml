  simplified_phrase: who is the faithful witness, the firstborn from the dead, and the ruler over the kings of the earth
  preserved_meaning: The three titles present Jesus as faithful, preeminent over death, and sovereign over earthly kings.
  reasoning_layer_used: POB lexical decisions for μάρτυς, πιστός, πρωτότοκος, and ἄρχων
  rationale: “Who is” and “ruler over” make the relationships clearer while preserving each title.
- pob_phrase: To him who loves us and freed us
