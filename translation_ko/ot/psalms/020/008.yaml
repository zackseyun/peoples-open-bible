lexical_decisions:
- source_word: בָּרֶכֶב / בַּסּוּסִים
  english_pob_choice: trust in chariots and ... in horses
  chosen_korean: 병거를 의지하고 / 말을 의지하다
  alternatives_korean:
  - 병거를 신뢰하고 / 말을 신뢰하다
  - 병거에 기대고 / 말에 기대다
  lexicon: רכב, סוס
  rationale: 히브리어 원문은 전쟁력의 상징인 병거와 말을 대조하며 의존 대상을 말하므로, 한국어는 ‘의지하다’로 그 의존의 함의를 살렸습니다.
- source_word: וַאֲנַחְנוּ ... נַזְכִּיר
  english_pob_choice: we call on the name of the LORD our God
  chosen_korean: 우리는 ... 이름을 부릅니다
  alternatives_korean:
  - 우리는 ... 이름을 기억합니다
  - 우리는 ... 이름을 선포합니다
  lexicon: זכר
  rationale: 영어 POB의 ‘call on’에 맞춰, 히브리어 זכר의 기도적/호소적 용례를 살려 ‘이름을 부르다’로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: the LORD our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 여호와 우리 하나님
  - 주 우리 하나님
  lexicon: יהוה, אלהים
  rationale: YHWH는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고, אֱלֹהֵינוּ는 소유격을 분명히 하도록 ‘우리 하나님’으로 처리했습니다.
theological_decisions:
- issue: 성호를 ‘부르다’로 옮길지 ‘기억하다/선포하다’로 옮길지
  chosen_reading: ‘이름을 부릅니다’로 번역하여, 하나님께 향하는 신뢰와 기도의 행위를 직접 드러냈습니다.
  alternative_readings:
  - ‘이름을 기억합니다’
  - ‘이름을 선포합니다’
  rationale: 문맥상 병거와 말에 대한 의존과 대조되는 행위는 단순 회상이나 선언보다 하나님께 대한 호소/예배 행위이므로, 본문 의미를 가장 직접적으로 전달하는 읽기를 택했습니다.
  doctrine_reference: 시편 20편의 왕적/예배적 신뢰 주제
