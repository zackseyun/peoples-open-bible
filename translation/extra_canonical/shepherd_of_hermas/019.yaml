translation:
  text: 'XI.1. “Listen,” he says, “about the three forms[a] you are inquiring about.”


    XI.2. “In the first vision, why did she appear to you as an old woman and seated on a chair? Because
    your spirit[b] is old and already withered and has no strength because of your softness[c] and your
    double-mindedness[d].”


    XI.3. “For just as the aged, no longer having hope of being renewed[f], expect nothing else but their
    sleep[e], so also you, having been softened[g] by the affairs of life, have handed yourselves over
    to negligence[h], and you did not cast your anxieties upon the Lord[i]; instead your mind has been
    shattered[j], and you have grown old in your sorrows[k].”


    XI.4. “Why then was she seated in a chair? I would like to know, sir[l].” “Because every weak person
    sits in a chair because of his weakness, in order that the weakness of his body may be steadied[m].
    You have the pattern of the first vision[n].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected text explicitly says three forms. Athos PlateIII retains three; Sinaiticus19.1
      initially has a malformed forms word, with ca adding the numeral three and correcting forms. Vulgata
      printed28 and Palatina printed57 have forms without the number in their main text; the Ethiopic
      edition’s Latin rendering printed124 refers to visions. A corrector’s addition is not counted as
      intact first-hand agreement or a new manuscript.
    reason: textual_variant
  - marker: b
    text: Spirit is singular while your addresses more than one person. The audience’s inner condition
      is described in the woman’s aging image; a communal dimension remains possible. The text is not
      translated as an aging divine Holy Spirit. The Ethiopic edition’s Latin rendering printed124 mentions
      both nature and spirit. Palatina printed57’s spiritus is a reported grammatical correction of codex
      spiritu. Those forms are not flattened into exact Greek correspondence.
    reason: textual_variant
  - marker: c
    text: Softness retains the earlier lexical choice for malakiai, also weaknesses, moral laxity or self-indulgence,
      with the Greek plural represented as an English mass noun. Sinaiticus19.2 retains malakiōn; Athos
      PlateIII instead prints hamartiōn, sins. Vulgata printed28 uses infirmities, Palatina printed57
      luxuries. The working softness reading is retained and the disagreement disclosed; a particular
      moral nuance is not uniquely established by the noun alone.
    reason: textual_variant
  - marker: d
    text: Double-mindedness renders dipsychiai, wavering or divided commitment, also doubts. It is a distinct
      cause alongside softness in the selected explanation, not a replacement for that first cause. Both
      Latin traditions and the Ethiopic edition’s Latin rendering express doubt in their formulations.
    reason: lexical_alternative
  - marker: e
    text: Sleep renders koimēsis, the selected euphemism for death. The comparison concerns elderly people
      with no hope of renewal, not church office-holders. Athos, Sinaiticus19.3 and both Latin versions
      retain a sleep expression; the Ethiopic edition’s Latin rendering printed124 explicitly says mortem,
      death. The Greek image is retained without turning it into a new claim about the state of all dead
      people.
    reason: textual_variant
  - marker: f
    text: Being renewed retains the current rendering of tou ananeōsai, also becoming young again or being
      rejuvenated in the aging comparison. The no-longer-having-hope statement and expectation of nothing
      else but sleep both remain. It is not replaced with an added promise of physical rejuvenation.
    reason: lexical_alternative
  - marker: g
    text: Having been softened retains the earlier lexical decision for malakisthentes, with having been
      weakened or enervated as alternatives. The affairs of life translates biōtika pragmata, ordinary
      or worldly business, not an added catalogue of sins. Sinaiticus19.3 retains the participle; Athos
      PlateIII omits it before the affairs phrase. Palatina describes being fatigued; the Ethiopic edition’s
      Latin rendering instead speaks of the vices of this world. The versions are not treated as word-for-word
      agreement.
    reason: textual_variant
  - marker: h
    text: Negligence renders akēdia, lack of care, apathy or listless indifference, traditionally acedia.
      The selected clause says you handed yourselves over to it. Athos, Sinaiticus and Vulgata printed28
      retain the acedia expression. Palatina printed57 instead says anxieties in the corresponding clause.
      This is distinct from the following selected anxieties that were not cast upon the Lord.
    reason: textual_variant
  - marker: i
    text: The selected clause explicitly says you did not cast your own anxieties upon the Lord; its negation
      and direction remain. Compare the shared casting-cares language in Psalm55:22 and1Peter5:7, without
      inserting either passage’s further promises into Hermas. Athos, Sinaiticus and both Latin versions
      retain the negative casting clause; the Ethiopic edition’s Latin rendering likewise has a negative
      formulation. Lord is distinguished from the respectful sir addressed to the interpreter in paragraph4.
    reason: textual_variant
  - marker: j
    text: Shattered retains the strong selected verb ethrausthē, also broken or crushed. Sinaiticus19.3’s
      first-hand shattered-your sequence is malformed and includes an unreadable-character gap; S1 gives
      a different malformed repair and ca the closer ethrausthē hymōn. It is not described as a fully
      intact first-hand match. Vulgata printed28 has a bruised or battered mind, Palatina printed57 a
      blunted mind, and the Ethiopic edition’s Latin rendering a corrupted heart.
    reason: textual_variant
  - marker: k
    text: Grown old in your sorrows preserves both the aging metaphor and the selected sorrows. Sinaiticus19.3
      has corrections in this sequence and an unreadable character in the article; Athos PlateIV’s beginning
      includes bracketed material in the continuation. Palatina printed57 instead has grown old in your
      thoughts. Damaged, corrected or bracketed wording is not counted as an unbroken visible manuscript
      match.
    reason: textual_variant
  - marker: l
    text: I would like to know retains the prior polite-request adjudication of ēthelon gnōnai. The earlier
      I wanted to know is an alternative imperfect reading, preserved in the full historical archive;
      the tense alone does not uniquely establish the English idiom. Vulgata printed28 has volebam cognoscere,
      Palatina printed57 volo cognoscere, and the Ethiopic edition’s Latin rendering velim scire. Sir
      renders the respectful vocative kyrie addressed to the interpreter, distinct from the Lord in paragraph3.
      The question and reply remain separate speakers.
    reason: textual_variant
  - marker: m
    text: Steadied retains the earlier choice for synkratēthē, also supported, held together or braced.
      The chair supports bodily weakness; every weak person, because of weakness and the purpose clause
      all remain. Sinaiticus19.4 retains the support construction; Athos PlateIV has bracketed material
      at its opening, so it is not unbroken preserved corroboration of the whole clause. Vulgata and Palatina
      use contineatur, while the Ethiopic edition’s Latin rendering speaks of bodily weakness resting
      on the seat.
    reason: textual_variant
  - marker: n
    text: Pattern renders typos, also type, figure or model, here the corresponding explanation of the
      first vision. Sinaiticus19.4 has first added by S1, rather than preserved in the first-hand wording.
      Athos and both Latin versions retain the first-vision designation in their edited texts; the Ethiopic
      edition’s Latin rendering calls it the explanation of the first vision. The selected first is retained
      without treating the correction as another independent witness.
    reason: textual_variant
lexical_decisions:
- source_word: μορφῶν
  chosen: forms
  alternatives:
  - figures
  - appearances
  - shapes
  lexicon: LSJ
  rationale: μορφή refers to external form or appearance; “forms” preserves the visionary imagery without
    over‑interpreting.
- source_word: ἐπιζητεῖς
  chosen: are inquiring about
  alternatives:
  - seek
  - are seeking
  - desire to know about
  lexicon: BDAG
  rationale: Context is interpretive inquiry into symbols, so “are inquiring about” fits better than simple
    “seek.”
- source_word: ὁράσει
  chosen: vision
  alternatives:
  - appearance
  - sight
  lexicon: BDAG
  rationale: ὅρασις in apocalyptic contexts is best rendered “vision.”
- source_word: πρεσβυτέρα
  chosen: old woman
  alternatives:
  - elderly woman
  - aged woman
  lexicon: BDAG
  rationale: Concrete image of a woman advanced in years; avoids confusion with ecclesial office implied
    by “elder.”
- source_word: καθέδρα
  chosen: chair
  alternatives:
  - seat
  lexicon: LSJ
  rationale: Concrete furniture term; “chair” aligns with the action of sitting and the weakness image.
- source_word: τὸ πνεῦμα ὑμῶν
  chosen: your spirit
  alternatives:
  - your inner self
  - your heart
  - your mind
  lexicon: BDAG
  rationale: Singular spirit with plural addressees; human inner condition with a possible communal dimension,
    not an aging divine Holy Spirit.
- source_word: μεμαρασμένον (from μαραίνω)
  chosen: withered
  alternatives:
  - faded
  - shrivelled
  - worn out
  lexicon: LSJ
  rationale: The perfect participle conveys a settled state; “withered” captures the image vividly.
- source_word: δύναμιν
  chosen: strength
  alternatives:
  - power
  - ability
  lexicon: BDAG
  rationale: Physical and moral vigor is in view; “strength” is idiomatic.
- source_word: μαλακίαι
  chosen: softness
  alternatives:
  - moral laxity
  - self‑indulgence
  - weakness
  lexicon: LSJ
  rationale: Retain the earlier softness mass-noun rendering, with weakness/moral laxity/self-indulgence
    alternatives. The noun alone does not uniquely establish a moral nuance; notec discloses Athos sins.
- source_word: διψυχίαι
  chosen: double-mindedness
  alternatives:
  - doubtfulness
  - two‑mindedness
  - vacillation
  lexicon: BDAG
  rationale: Established ethical term in early Christian literature; keeps the concrete metaphor of being
    “two‑souled.”
- source_word: πρεσβύτεροι
  chosen: the aged
  alternatives:
  - elderly people
  - old men
  lexicon: BDAG
  rationale: Here the reference is to age, not to church elders; “the aged” avoids ecclesial confusion.
- source_word: ἀνανεῶσαι
  chosen: be renewed
  alternatives:
  - be rejuvenated
  - make new again
  - be made young again
  lexicon: LSJ
  rationale: General renewal, not a technical theological term; “be renewed” is concise.
- source_word: κοίμησιν
  chosen: sleep
  alternatives:
  - rest
  - death
  lexicon: BDAG
  rationale: Maintains the euphemism common in early Christian diction; clarified by footnote.
- source_word: βιωτικὰ πράγματα
  chosen: the affairs of life
  alternatives:
  - worldly affairs
  - everyday business
  - secular matters
  lexicon: BDAG
  rationale: Neutral phrase that captures mundane, this‑worldly concerns without moralizing the term itself.
- source_word: μαλακισθέντες (from μαλακίζομαι)
  chosen: having been softened
  alternatives:
  - having been weakened
  - enervated
  lexicon: LSJ
  rationale: Retain the earlier softened choice and its relation to softness; weakening is a disclosed
    alternative, and Athos’s omission is explicit.
- source_word: ἀκηδίας
  chosen: negligence
  alternatives:
  - carelessness
  - apathy
  - acedia
  lexicon: LSJ
  rationale: Mass‑noun rendering fits English idiom; footnote notes the traditional term “acedia.”
- source_word: μερίμνας
  chosen: anxieties
  alternatives:
  - cares
  - worries
  lexicon: BDAG
  rationale: μερίμνα often denotes anxious concern; “anxieties” balances concreteness and readability.
- source_word: ἐπερίψατε (from ἐπιρρίπτω)
  chosen: cast
  alternatives:
  - throw
  - hurl
  lexicon: BDAG
  rationale: Preserves the vivid act of off‑loading cares onto the Lord; echoes but does not import NT
    diction beyond the Greek itself.
- source_word: Κύριον (with article)
  chosen: the Lord
  alternatives:
  - the Master
  lexicon: BDAG
  rationale: Reference is to God; default rendering in Cartha is “Lord.”
- source_word: διάνοια
  chosen: mind
  alternatives:
  - understanding
  - intention
  lexicon: BDAG
  rationale: The inner faculty of thought/resolve; “mind” fits the contrast with being shattered.
- source_word: ἐθραύσθη (from θραύω)
  chosen: has been shattered
  alternatives:
  - was broken
  - was crushed
  lexicon: LSJ
  rationale: θραύω is a strong verb for breaking; “shattered” conveys the severity.
- source_word: ἐπαλαιώθητε (from παλαιόω)
  chosen: have grown old
  alternatives:
  - have been aged
  - have become old
  - have been worn down
  lexicon: LSJ
  rationale: Idiomatic English that preserves metaphor of aging through sorrow.
- source_word: λύπαι
  chosen: sorrows
  alternatives:
  - griefs
  - distresses
  lexicon: BDAG
  rationale: Plural concrete burdens; “sorrows” preserves the affective weight.
- source_word: ἀσθενής / ἀσθένεια
  chosen: weak / weakness
  alternatives:
  - sick / sickness
  - feeble / feebleness
  lexicon: BDAG
  rationale: Physical frailty is the image; “weak/weakness” is straightforward.
- source_word: συνκρατηθῇ (sc. συγκρατέω)
  chosen: be steadied
  alternatives:
  - be supported
  - be held together
  - be braced
  lexicon: LSJ
  rationale: The aim is to stabilize bodily weakness; “be steadied” is vivid and idiomatic.
- source_word: τύπος
  chosen: pattern
  alternatives:
  - type
  - figure
  - model
  lexicon: BDAG
  rationale: Here denotes the corresponding explanation/figure to the vision; “pattern” is clear, with
    footnote noting alternatives.
- source_word: κύριε (voc.)
  chosen: sir
  alternatives:
  - lord
  lexicon: BDAG
  rationale: Polite address to the visionary interpreter, distinguished from “the Lord” (God) in the same
    unit.
- source_word: ἤθελον γνῶναι
  chosen: I would like to know
  alternatives:
  - I wanted to know
  rationale: Retain the prior polite-request adjudication while disclosing the literal past alternative
    and different versional tenses; full prior records archived.
