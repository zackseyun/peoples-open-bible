id: JDG.3.9
reference: Judges 3:9
source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל יְהוָ֔ה וַ/יָּ֨קֶם יְהוָ֥ה מוֹשִׁ֛יעַ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל וַ/יּֽוֹשִׁיעֵ֑/ם אֵ֚ת עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֥ן מִמֶּֽ/נּוּ־־־׃
translation:
  text: 'Then the Israelites cried out to Yahweh, and Yahweh raised up a deliverer for them: Othniel son of Kenaz, Caleb’s younger brother[a]. Othniel delivered them.'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, Kenaz may be identified as Caleb’s younger brother, making Othniel Caleb’s nephew.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  chosen: cried out
  alternatives:
  - called out
  - cried for help
  lexicon: HALOT
  rationale: זעק in this context conveys an urgent cry for help directed to God, not merely speaking or praying. 'Cried out' is natural English and preserves the distress implied by the verb.
- source_word: בְנֵי יִשְׂרָאֵל
  chosen: the sons of Israel
  alternatives:
  - the Israelites
  - the people of Israel
  lexicon: HALOT
  rationale: Literally 'sons of Israel.' In keeping with the gender-accurate principle, the familial expression is preserved rather than neutralized to 'Israelites,' while remaining idiomatic enough in English.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: וַיָּקֶם
  chosen: raised up
  alternatives:
  - appointed
  - caused to arise
  lexicon: HALOT
  rationale: קום in the hiphil here means to cause someone to arise or stand up for a role. 'Raised up' is the standard and contextually precise idiom for God bringing forth a leader.
- source_word: מוֹשִׁיעַ
  chosen: deliverer
  alternatives:
  - savior
  - rescuer
  lexicon: HALOT
  rationale: The participle from ישׁע denotes one who brings rescue. 'Deliverer' fits the Judges context well and avoids importing later christological overtones that 'savior' may carry in English, while still reflecting the rescue theme.
- source_word: וַיּוֹשִׁיעֵם
  chosen: he delivered them
  alternatives:
  - he saved them
  - he gave them victory
  lexicon: HALOT
  rationale: The verb ישׁע here refers to concrete rescue from oppression. 'Delivered them' matches the military-political setting and coheres with 'deliverer' for מוֹשִׁיעַ.
- source_word: אֵת עָתְנִיאֵל בֶּן קְנַז
  chosen: Othniel son of Kenaz
  alternatives:
  - Othniel, the son of Kenaz
  lexicon: HALOT
  rationale: Personal names are transliterated. The appositional naming after the rescue clause identifies the deliverer.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  chosen: Caleb’s younger brother
  alternatives:
  - the younger brother of Caleb
  - the brother of Caleb, younger than he
  - Caleb’s youngest brother
  lexicon: HALOT
  rationale: The phrase most naturally identifies Othniel as Caleb's brother who was younger than Caleb. 'Younger brother' is idiomatic English. 'Youngest brother' would overstate the comparative. The Hebrew construction has been debated, but this rendering best fits the syntax and common understanding.
