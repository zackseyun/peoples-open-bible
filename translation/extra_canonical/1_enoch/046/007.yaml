translation:
  text: “They are the ones who judge the stars of heaven. They raise their hands toward the Most High, walk on dry
    land, and dwell in it. All their deeds display injustice; their strength rests in their wealth. Their faith
    has been in the gods they made with their own hands, and they deny the name of the Lord of Spirits.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected stars/judging/raised-hands stanza is damaged. Charles printed87 note24, continued88, proposes
      a reconstruction through Daniel8:10 that casts stars down and tramples them; it requires changing the judging
      verb and supplying an object. This English does not adopt those conjectures, add a new trampling object, or
      make the selected people into a modern astronomical mechanism. It retains a readable diplomatic judging-stars
      construction while openly declining to certify its earlier meaning. The selected dwelling clause is also considered
      an intrusion by Charles but is not bracketed in the printed main text; it remains here. Those are editorial
      diagnoses, not independently collated manuscript facts.
    reason: textual_variant
