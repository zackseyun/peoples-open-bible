base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: ko
  text: 다윗이 야훼께 여쭈며 말했습니다. “이 약탈대를 추격하겠습니까? 내가 그들을 따라잡겠습니까?” 그러자 야훼께서 다윗에게 말씀하셨습니다. “추격하십시오. 당신이 반드시 그들을 따라잡을 것이며, 반드시 구출할 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַ֨ל ... בַּֽ/יהוָה
  english_pob_choice: And David inquired of the LORD
  chosen_korean: 다윗이 야훼께 여쭈며
  alternatives_korean:
  - 다윗이 야훼께 물으며
  - 다윗이 주님께 물으며
  lexicon: יהוה
  rationale: 동사 שאל은 단순한 질문보다 신적 응답을 구하는 ‘여쭙다’가 문맥에 더 맞고, יהוה는 본문 원형을 드러내기 위해 야훼로 옮겼습니다.
- source_word: הַגְּדוּד הַזֶּה
  english_pob_choice: this raiding party
  chosen_korean: 이 약탈대
  alternatives_korean:
  - 이 습격대
  - 이 무리
  lexicon: גדוד
  rationale: 문맥상 단순한 ‘무리’가 아니라 약탈·습격 목적의 무리이므로, 행위성을 살린 약탈대를 택했습니다.
- source_word: הַשֵּׂג תַּשִּׂיג
  english_pob_choice: you will surely overtake
  chosen_korean: 반드시 따라잡을 것이며
  alternatives_korean:
  - 분명히 따라잡을 것이며
  - 반드시 추격해 붙잡을 것이며
  lexicon: שׂיג
  rationale: 히브리어 강조 반복을 한국어의 ‘반드시’로 살리고, 군사적 추격의 동작을 자연스럽게 드러내기 위해 따라잡다를 택했습니다.
- source_word: וְהַצֵּל תַּצִּיל
  english_pob_choice: and you will surely rescue
  chosen_korean: 반드시 구출할 것이다
  alternatives_korean:
  - 반드시 건져낼 것이다
  - 반드시 구해낼 것이다
  lexicon: נצל
  rationale: נצל은 단순한 ‘구하다’보다 위험에서 건져내는 구출의 뜻이 강하므로, 중복 강조를 살려 반드시 구출할 것이다로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 발화와 3인칭 표기의 정리
  chosen_reading: 본문의 ‘그가 다윗에게 말씀하셨습니다’는 앞선 야훼께 여쭙는 구문과 연결되는 직접 응답으로 처리했습니다.
  alternative_readings:
  - ‘그가 그에게 말했습니다’처럼 중성적으로 옮길 수 있음
  - 명시적으로 ‘야훼께서’로 반복할 수 있음
  rationale: 히브리어는 대명사만 두지만, 문맥상 응답 주체는 야훼이므로 한국어에서는 독자가 오해하지 않도록 앞문장과 연동해 번역했습니다.
  doctrine_reference: 본문 문맥상 야훼의 응답
