  text: And Esther said, “A hostile and enemy man—this evil Haman!” Then Haman was terrified before the king and the queen.
translation:
  language: ko
  text: 에스더가 말했습니다. 「적대자요 원수인 사람은 바로 이 악한 하만입니다!」 그러자 하만은 왕과 왕비 앞에서 몹시 두려워했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ צַר וְאוֹיֵב
  english_pob_choice: A hostile and enemy man
  chosen_korean: 이 악한 자, 곧 원수인 사람
  alternatives_korean:
  - 적대적인 사람과 원수인 사람
  - 해로운 자이자 원수인 사람
  - 원수이며 적대적인 사람
  lexicon: אִישׁ / צַר / אוֹיֵב
  rationale: hebrew가 인물을 직접 지칭하는 구조이므로 단순 형용사열보다 '사람'을 살리고, צַר·אוֹיֵב의 적대성을 '악한 자, 곧 원수인 사람'으로 옮겨 비난의 강도를 유지했습니다.
- source_word: הָמָן הָרָע הַזֶּה
  english_pob_choice: this evil Haman
  chosen_korean: 하만입니다
  alternatives_korean:
  - 이 악한 하만입니다
  - 이 나쁜 하만입니다
  - 이 사악한 하만입니다
  lexicon: הָמָן הָרָע הַזֶּה
  rationale: 지시어 '이'와 형용사 '악한'은 앞 절에 이미 응축해 두고, 고유명사 앞의 수식은 한국어에서 자연스럽게 풀어 배치했습니다.
- source_word: וַתֹּאמֶר אֶסְתֵּר
  english_pob_choice: And Esther said
  chosen_korean: 에스더가 말했습니다
  alternatives_korean:
  - 에스더가 말했습니다
  - 에스더가 말하였습니다
  - 에스더가 외쳤습니다
  lexicon: וַתֹּאמֶר
  rationale: 서술 동사 אמר의 기본값은 '말하다'이므로 과도한 감정 해석인 '외치다'는 피하고, 서사체에 맞는 평이한 합쇼체로 옮겼습니다.
- source_word: וְהָמָן נִבְעַת
  english_pob_choice: Then Haman was terrified
  chosen_korean: 그러자 하만은 크게 두려워했습니다
  alternatives_korean:
  - 그러자 하만은 두려워했습니다
  - 그러자 하만은 몹시 떨었습니다
  - 그러자 하만은 공포에 질렸습니다
  lexicon: נבעת
  rationale: נבעת의 강한 공포 반응을 반영하되, 한국어 서술에서 지나치게 관용적인 '공포에 질리다'보다 본문의 즉시성과 서술성을 살린 표현을 택했습니다.
theological_decisions:
- issue: 왕과 왕비 앞에서의 공적 발화와 공포의 대비
  chosen_reading: 에스더의 선언이 하만의 죄책과 몰락을 공개적으로 드러내는 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 법정적 고발 장면으로 읽을 수 있습니다
  - 궁정 예절을 강조한 장면으로만 읽을 수 있습니다
  rationale: 본문은 에스더의 진술 직후 하만의 두려움을 병치하여, 왕 앞에서의 공개 폭로와 심판의 분위기를 강조합니다.
  doctrine_reference: 서사 문맥에 따른 본문 의미 보존
