  from: and your poverty will come like a prowler[b][a], and your lack like an armed man.
  to: and your poverty will come like a traveler[a], and your lack like a man with a shield.
  rationale: “Prowler” imports stealth and hostile intent that the participle “one walking/traveling about” does not itself mark. “Traveler” is a natural, restrained rendering, and “a man with a shield” retains the concrete shield image rather than generalizing it as merely armed. The replacement note candidly records the lexical uncertainty.
