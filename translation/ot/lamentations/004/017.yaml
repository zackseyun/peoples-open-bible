    rationale: The cognate construction conveys sustained, watchful expectation rather than a distinction between a watching activity and a separate act of watching.
  - source_phrase: אֶל גּוֹי לֹא יוֹשִׁעַ
    prior_rendering: for a nation that could not save
    new_rendering: for a nation that could not save us
    rationale: The people seeking rescue are the understood object of “save”; supplying “us” completes the English sense.
