translation:
  language: en
  text: For in Christ Jesus,[a] it does not matter whether a person is circumcised or uncircumcised. What matters is faith[b] working through love.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “Jesus the Messiah.” “Messiah” preserves the Greek word as a title.
    reason: alternative_reading
  - marker: b
    text: The Greek word for “faith” can also mean “faithfulness” or “trust.”
    reason: lexical_alternative
  - marker: c
    text: Or “faith being active through love” or “faith expressing itself through love.”
    reason: lexical_alternative
