translation:
  language: en
  text: Sorrow aligned with God produces repentance[b] leading to salvation without regret.[a] But worldly sorrow produces death.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek may describe the repentance more directly as something never to be regretted.
    reason: lexical_alternative
  - marker: b
    text: Sorrow leads to or produces repentance here; they are not the same thing. Repentance describes changed disposition and conduct, not merely feeling sorry. The separate language of regret remains distinct.
    reason: lexical_alternative
