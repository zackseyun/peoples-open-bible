  to: Do you really pronounce righteous judgments, you rulers[a]? Do you judge people[b] fairly?
  rationale: The latest audit usefully rejected the contradictory 'speak righteousness in silence' and preserved the lexical uncertainty. I retain that gain but adopt the longstanding rulers reading and take 'sons of man' as those being judged, because the parallel questions and verse 2 best fit corrupt human authorities.
