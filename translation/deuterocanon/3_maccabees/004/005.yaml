  meaning_decisions:
  - source_phrase: πλήρης πολιᾶς ... τὴν ἐκ τοῦ γήρως νωθρίτητα ποδῶν ἐπικύφων
    prior_rendering: full of gray hair, bent over by the weakness in his feet that comes with age
    new_rendering: with a head full of gray hair ... though he was stooped and his feet were weak with age
    rationale: The descriptions of gray hair, stooped posture, and age-weakened feet are distinguished rather than making weakness in the feet the sole cause of his posture.
  - source_phrase: ἀνατροπῆς ὁρμῇ βιαίας
    prior_rendering: driven by the violent force of being thrown down
    new_rendering: He stumbled as he was violently pushed along
    rationale: This conveys violent physical compulsion and loss of footing without reproducing an unintelligible English construction; the possibility of an actual knockdown is preserved in the note.
  - source_phrase: ἁπάσης αἰδοῦς ἄνευ πρὸς ὀξειαν καταχρώμενος πορείαν
    prior_rendering: making use of a swift march without any regard for all dignity
    new_rendering: was driven along at a hurried pace ... with no respect at all shown for his dignity
    rationale: The hurried pace is imposed on the frail man, and the lack of respect belongs to his treatment, not to a voluntary disregard for dignity on his part.
