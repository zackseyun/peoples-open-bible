id: JER.23.33
reference: Jeremiah 23:33
source:
  edition: WLC
  text: וְ/כִי יִשְׁאָלְ/ךָ֩ הָ/עָ֨ם הַ/זֶּ֜ה אֽוֹ הַ/נָּבִ֤יא אֽוֹ כֹהֵן֙ לֵ/אמֹ֔ר מַה מַשָּׂ֖א יְהוָ֑ה וְ/אָמַרְתָּ֤ אֲלֵי/הֶם֙ אֶת מַה מַשָּׂ֔א וְ/נָטַשְׁתִּ֥י אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־־־־־־׃
translation:
  text: When these people, or a prophet or a priest, ask you, ‘What is the burden[a] of Yahweh?’ you are to tell them, ‘You are the burden[b], and I will cast you off,’ declares Yahweh.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew word translated “burden” can also mean a prophetic oracle; verses 33–40 play on both senses.
    reason: lexical_alternative
  - marker: b
    text: “You are the burden” follows the Septuagint and Vulgate and a different division of the Hebrew consonants; the traditional Hebrew reading is “What burden?”
    reason: textual_variant
