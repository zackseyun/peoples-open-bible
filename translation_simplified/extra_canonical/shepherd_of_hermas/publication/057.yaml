  text: 'I say to him, “Sir, explain this further to me.” “What do you want to know?” he says. “Sir,”
    I say, “are those who indulge and are deceived tormented for the same length of time as they indulge
    and are deceived?” He says to me, “They are tormented for the same length of time.”


    2. “Their torment is not long enough, sir,” I say.[a] “For those who indulge in this way and forget
    God ought to be tormented seven times as much.”


    3. He says to me, “You are foolish and do not understand the force of the torment.” “Sir,” I say,
    “if I understood, I would not be asking you to explain it to me.” “Hear,” he says, “the force of both
    indulgence and torment.”[c]


    4. “The time of indulgence and deceit is one hour, but the hour of torment has the force of thirty
    days. So if someone indulges and is deceived for one day and is tormented for one day, that day of
    torment amounts to a whole year.[b] For as many days as someone indulges, for that many years they
    are tormented. So you see,” he says, “that the time of indulgence and deceit is very short, but the
    time of punishment and torment is long.”'
