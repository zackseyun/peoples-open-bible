  source_fidelity: 히브리어 אֲמִילַם은 1인칭 미완료형으로, 문맥상 확정적 결의 또는 미래의 결과를 나타낼 수 있습니다. 초안의 과거 완료형 ‘끊어 버렸습니다’는 영어 POB의 해석을 따르지만, 원문의 동사형이 지닌 전망적 뉘앙스를 충분히 보존하지 못합니다. ‘반드시’는 כִּי의 확언적 용법을 무리 없이 반영합니다.
  naturalness: ‘모든 민족이 나를 둘러쌌습니다. 내가 … 끊어 버리겠습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 병렬적이고 단호한 리듬을 유지합니다. 명시적 역접 ‘-으나’는 원문에 없는 연결을 다소 강화하므로 문장 분리로 처리하는 편이 안전합니다.
  terminology: ‘모든 민족’, ‘야훼의 이름으로’, ‘끊어 버리겠습니다’는 각각 גּוֹיִם, בְּשֵׁם יְהוָה, אֲמִילַם에 적절히 대응합니다. ‘야훼’ 표기와 기존 각주는 유지할 수 있습니다.
