base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/024.yaml
  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: ko
  text: 그는 은으로 된 받침대 마흔 개를 스무 개의 널빤지 아래에 만들었습니다. 하나의 널빤지 아래에는 그 두 촉을 위하여 받침대 두 개를, 또 다른 하나의 널빤지 아래에도 그 두 촉을 위하여 받침대 두 개를 만들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  english_pob_choice: silver bases
  chosen_korean: 은으로 된 받침대
  alternatives_korean:
  - 은 받침대
  - 은제 받침대
  - 은 기초
  lexicon: adanim
  rationale: אַדְנִים은 문맥상 널빤지를 받치는 구조물의 ‘받침대’가 자연스럽고, כֶסֶף는 재료를 밝혀 ‘은으로 된’으로 옮기는 것이 원문의 기능과 재질을 함께 살립니다.
- source_word: הַקְּרָשִׁים
  english_pob_choice: the twenty frames
  chosen_korean: 스무 개의 널빤지
  alternatives_korean:
  - 스무 개의 틀판
  - 스무 개의 판재
  - 스무 개의 프레임
  lexicon: qereshim
  rationale: 성막 구조물의 기술적 명칭이지만 한국어에서는 널빤지가 가장 즉각적이고 오해가 적어, 기능을 드러내되 지나치게 현대 공업용어로 옮기지 않았습니다.
- source_word: יְדֹתָיו
  english_pob_choice: its two tenons
  chosen_korean: 그 두 촉을 위하여
  alternatives_korean:
  - 그 두 장부를 위하여
  - 그 두 결구를 위하여
  - 그 두 홈을 위해
  lexicon: yadot
  rationale: יָד는 여기서 끼워 맞추는 돌출부를 가리키므로 목공 문맥의 ‘촉’이 가장 가까우며, 소유대명사 ‘그’로 각 널빤지의 두 촉을 분명히 했습니다.
theological_decisions:
- issue: 반복되는 구조 묘사에서의 간결성과 정확성
  chosen_reading: 원문의 평서형 기술을 그대로 유지해 공예적·서술적 정보가 흐트러지지 않도록 했습니다.
  alternative_readings:
  - 문장부호를 줄여 더 압축적으로 만들기
  - ‘만들었다’를 반복 없이 한 번만 쓰기
  rationale: 이 절은 신학적 해석보다 성막 제작의 수량과 배치를 정확히 전달하는 데 초점이 있으므로, 반복을 일부 유지하는 편이 원문의 설계 정보를 가장 충실하게 드러냅니다.
  doctrine_reference: 출애굽기 25–40장의 성막 제작 서술
