  text: O Yahweh[a], by your favor you made my mountain stand strong; when you hid your face, I was dismayed.
  footnotes:
  - marker: a
    text: Or 'you established strength for my mountain'; the Hebrew wording is compact and may also be understood as an image for secure prosperity or stability.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와여, 주의 은총으로 제 산이 굳세게 서게 하셨습니다.[a] 주께서 얼굴을 숨기시자 저는 몹시 놀랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제 산에 힘을 세우셨습니다’로도 이해할 수 있습니다. ‘제 산’은 안전과 안정된 형편을 비유적으로 가리킬 수 있으나, 본문에서는 그 이미지를 그대로 옮겼습니다.
    reason: lexical_alternative
