theological_decisions:
- issue: Universal repentance offer, calling through the Son, and response conditions
  chosen_reading: Retain the offer of repentance to everyone despite some being unworthy because of their
    deeds, the Lord’s desire for the calling that came through his Son to be saved, the whole-heart repentance
    and cleansing requirements, the no-added-sins and no-wavering conditions, and the self-condemnation
    warning.
  rationale: Do not conflate the opportunity to repent with achieved salvation or replace the explicit
    calling with its inferred beneficiaries. Preserve the conditions attached to the promise, the warning,
    and the disclosed limits of the bracketed supplements.
