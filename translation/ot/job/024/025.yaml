id: JOB.24.25
reference: Job 24:25
source:
  edition: WLC
  text: וְ/אִם לֹ֣א אֵ֭פוֹ מִ֣י יַכְזִיבֵ֑/נִי וְ/יָשֵׂ֥ם לְ֝/אַ֗ל מִלָּתִֽ/י־׃ס
translation:
  text: And if it is not so, then who can prove me a liar and reduce my word to nothing?
  philosophy: dynamic
lexical_decisions:
- source_word: וְאִם לֹא
  chosen: And if it is not so
  alternatives:
  - If not
  - And if not
  lexicon: HALOT
  rationale: Introduces a conditional challenge based on Job's preceding claims. Expanding לֹא with 'it is' yields natural English while preserving the Hebrew sense.
- source_word: אֵפוֹ
  chosen: then
  alternatives:
  - now
  - indeed
  lexicon: HALOT
  rationale: 'Discourse particle adding emphasis/inference. ''Then'' best fits the argumentative force in English: ''if not so, then who...'''
- source_word: מִי
  chosen: who
  lexicon: HALOT
  rationale: Straightforward interrogative pronoun introducing the rhetorical challenge.
- source_word: יַכְזִיבֵנִי
  chosen: can prove me a liar
  alternatives:
  - can show me false
  - can make me out a liar
  - can refute me
  lexicon: HALOT
  rationale: From כזב in Hiphil, 'to prove false / show to be a liar.' 'Prove me a liar' captures both the forensic and rhetorical force better than the flatter 'refute me.' The modal 'can' is supplied for idiomatic English in a rhetorical question.
- source_word: וְיָשֵׂם
  chosen: and make
  alternatives:
  - and set
  - and render
  lexicon: HALOT
  rationale: Common verb 'put/set' used idiomatically with the following phrase; 'make' is the most natural English equivalent in this construction.
- source_word: לְאַל
  chosen: into nothing
  alternatives:
  - as nothing
  - to nothingness
  - for nothing
  lexicon: HALOT
  rationale: The phrase means to reduce to nothing / nullify. 'Into nothing' communicates the result clearly in modern English.
- source_word: מִלָּתִי
  chosen: my word
  alternatives:
  - my speech
  - my statement
  lexicon: HALOT
  rationale: Retains the singular Hebrew noun in a natural English collocation.
- source_word: וְיָשֵׂם לְאַל
  chosen: and reduce ... to nothing
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English equivalent for the idiom “make/set as nothing,” preserving its nullifying result.
