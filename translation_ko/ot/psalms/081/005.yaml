  text: 'He established it as a testimony in Joseph when he went out against the land of Egypt[a]. I hear a language I did not know:'
  footnotes:
  - marker: a
    text: Or “when he went out over the land of Egypt.” The subject of “went out” is not explicit, and the Hebrew preposition may be understood as “against” or “over.”
    reason: alternative_reading
translation:
  language: ko
  text: 이집트 땅을 거슬러 나가실 때, 그것을 요셉[a] 가운데 증거로 세우셨습니다.[b] 내가 알지 못하던 언어를 들었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요셉’은 여기서 출애굽의 문맥에서 이스라엘 백성을 가리키는 이름으로 이해될 수 있으나, 히브리어 본문은 ‘요셉’이라는 이름을 사용합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘이집트 땅 위로 나가실 때’로 옮길 수 있습니다. 히브리어 전치사는 문맥상 ‘이집트 땅을 거슬러’라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내가 알지 못하던 언어를 듣습니다’로 옮길 수 있습니다. 히브리어 미완료형은 시적 문맥에서 현재 또는 과거로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 앞절의 부름을 이어 이유를 밝히는 연결이므로, 문장 앞에 자연스럽게 들어가는 설명 표지로 ‘이는’를 택했습니다.
- source_word: חֹק
  english_pob_choice: statute
  chosen_korean: 규례
  alternatives_korean:
  - 법령
  - 정한 규정
  lexicon: HALOT
  rationale: חֹק의 고정된 규정·제정된 조항이라는 뜻을 한국어 성경 문맥에서 가장 자연스럽게 드러내는 말로 ‘규례’를 사용했습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: ordinance
  chosen_korean: 정한 법
  alternatives_korean:
  - 규례
  - 판결
  lexicon: HALOT
  rationale: 평행구에서 חֹק와 구별되는 공식적·권위적 규정을 살리기 위해, 단순 반복인 ‘규례’보다 ‘정한 법’으로 옮겼습니다.
- source_word: לֵאלֹהֵי יַעֲקֹב
  english_pob_choice: of the God of Jacob
  chosen_korean: 야곱의 하나님에게서
  alternatives_korean:
  - 야곱의 하나님께 속한
  - 야곱의 하나님을 위한
  lexicon: HALOT
  rationale: 히브리어 ל의 출처/권위 관계를 한국어로 드러내기 위해, 이 규정이 ‘야곱의 하나님에게서’ 나온 것으로 옮겨 원문의 힘을 보존했습니다.
theological_decisions:
- issue: חֹק와 מִשְׁפָּט의 평행 관계를 한국어에서 어떻게 살릴지
  chosen_reading: ‘규례’와 ‘정한 법’을 구별하여 두 법적 용어의 평행을 유지했습니다.
  alternative_readings:
  - 둘 다 ‘법’으로 통일하기
  - 둘 다 ‘규정’으로 통일하기
  rationale: 시편의 시적 병행은 같은 뜻의 중복보다 서로 겹치면서도 다른 법적 표현을 통해 강조를 형성하므로, 한국어에서도 구별을 남기는 편이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: '번역 원칙: 핵심 용어의 일관성과 문맥적 예외'
- issue: לֵאלֹהֵי יַעֲקֹב의 관계를 소유격보다 출처/권위로 읽을지
  chosen_reading: ‘야곱의 하나님에게서 정한 법’으로 옮겨, 이 규정의 출처와 권위를 강조했습니다.
  alternative_readings:
  - ‘야곱의 하나님께 속한 정한 법’
  - ‘야곱의 하나님을 위한 정한 법’
  rationale: 문맥상 이 관례는 야곱의 하나님이 정하신 것으로 이해하는 것이 자연스러우며, 한국어에서도 ‘에게서’가 권위적 출처를 가장 분명하게 드러냅니다.
  doctrine_reference: optimal-equivalence
