  meaning_decisions:
  - source_phrase: τῷ ἀδελφῷ αὐτοῦ
    prior_rendering: his brother
    new_rendering: a brother or sister
    rationale: The kinship term has representative force here, as the earlier notes acknowledge. Making that scope explicit avoids restricting the saying to male siblings while preserving its familial language.
  - source_phrase: Ῥακά
    prior_rendering: Raca
    new_rendering: You good-for-nothing!
    rationale: The first hearers understood an abusive expression of contempt, not an unexplained foreign word. The translation carries that force, while the note preserves the distinctive Aramaic term.
  - source_phrase: τῇ κρίσει … τῷ συνεδρίῳ
    prior_rendering: to the judgment … to the council
    new_rendering: to judgment … to the Jewish council
    rationale: The new wording makes the judicial setting intelligible without identifying an institution more precisely than the wording requires.
  - source_phrase: εἰς τὴν γέενναν τοῦ πυρός
    prior_rendering: to the Gehenna of fire
    new_rendering: to the fire of hell
    rationale: The prior wording leaves many readers without the meaning of the warning. Established English 'hell' communicates the place of divine judgment, retains the fire image, and does not specify its nature or duration; the note preserves the historical term.
