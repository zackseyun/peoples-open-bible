    rationale: '''Deadly'' preserves the lethal force in an idiomatic description of an arrow, and English plurals naturally express the Hebrew distributive singular.'
  - source_phrase: בְּפִיו שָׁלוֹם אֶת רֵעֵהוּ יְדַבֵּר
    prior_rendering: With his mouth each man speaks peace to his neighbor
