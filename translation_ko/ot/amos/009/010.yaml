  text: By the sword all the sinners of my people will die—those who say, ‘The disaster will not overtake us or come against us.’
translation:
  language: ko
  text: 칼로 내 백성의 모든 죄인이 죽을 것입니다. 곧 “재앙이 우리에게 가까이 오거나 우리를 앞서 오지는 않을 것이다”라고 말하는 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘앞서 오다’는 문맥상 재앙이 그들에게 이르기 전에 앞서 지나가거나 그들 앞에 나타나는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֶרֶב
  english_pob_choice: By the sword
  chosen_korean: 칼에 의해
  alternatives_korean:
  - 칼로
  - 칼에 의해
  lexicon: חרב
  rationale: 히브리어 전치사 בְּ의 수단·매개 의미를 살려, 단순한 장소가 아니라 심판의 도구를 드러내는 표현으로 옮겼습니다.
- source_word: כֹּל חַטָּאֵי עַמִּי
  english_pob_choice: all the sinners of my people
  chosen_korean: 내 백성의 모든 죄인들은
  alternatives_korean:
  - 내 백성의 모든 죄인들
  - 내 백성 가운데 모든 죄인들은
  lexicon: חטא
  rationale: חַטָּאֵי를 단순히 ‘죄를 짓는 자들’보다 명사적 범주인 ‘죄인들’로 옮겨, 공동체 내부의 책임 있는 집단을 분명히 했습니다.
- source_word: לֹא תַגִּישׁ וְתַקְדִּים בַּעֲדֵינוּ הָרָעָה
  english_pob_choice: The disaster will not overtake us or come against us
  chosen_korean: 재앙이 우리를 앞지르거나 우리에게 닥치지는 않을 것이다
  alternatives_korean:
  - 재앙이 우리를 따라잡거나 우리에게 닥치지는 않을 것이다
  - 재앙이 우리를 앞서거나 우리에게 닥치지는 않을 것이다
  lexicon: נגש / קדם / רעה
  rationale: 두 동사의 병행을 살리되, 한국어에서는 ‘앞지르다 / 닥치다’가 재앙의 도래와 충돌을 자연스럽게 함께 드러내므로 이렇게 옮겼습니다.
theological_decisions:
- issue: ‘내 백성’과 심판 선언의 범위
  chosen_reading: 이스라엘 공동체 안에서도 ‘죄인들’이 칼로 죽는다는 경고를 직접적으로 유지했습니다.
  alternative_readings:
  - ‘내 백성’이 전체 이스라엘을 뜻하는 완곡한 표현으로 약화하기
  - ‘죄인들’을 일반적 도덕범주로만 처리하기
  rationale: 본문은 언약 공동체 내부의 책임과 심판을 선명하게 말하므로, 이를 완화하지 않고 그대로 드러내는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 예언서의 언약 심판과 공동체 책임
