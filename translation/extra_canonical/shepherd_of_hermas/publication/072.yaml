  rationale: 'Reconsideration of the prior lexical rendering “outer walls”: τὰ τείχη τὰ πρῶτα says “the
    first walls.” The supplied passage does not establish “outer”; retain the ordinal and the result expressed
    by ἐγένετο.; Disclose both translated bracketed supplements, [τὸν ποιμένα] and [φησίν], using the
    supplied source warnings while preserving the existing lexical explanations.; Reconcile the note with
    the corrected ordinal, explicitly label the lexical reconsideration, and preserve the existing witness
    and repentance-condition information.; The selected Greek contains μετάνοια but not διψυχεῖν; remove
    the out-of-unit expression.; Remove the rendering of the absent verb while retaining the rendering
    actually used in this unit.; Remove the alternative for the absent διψυχεῖν so the lexical record
    consistently concerns μετάνοια.; Explicitly label the reconsideration while preserving the valid distinction
    between granted repentance, actual repentance, and salvation.'
