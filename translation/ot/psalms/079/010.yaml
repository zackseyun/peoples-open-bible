theological_decisions:
- issue: Imprecatory request for divine vengeance
  chosen_reading: Retain the prayer for God's public vengeance without softening it into generic justice.
  alternative_readings:
  - Let justice for the blood of your servants be known
  - Show the nations that you avenge your servants
  rationale: The Hebrew explicitly uses נקמת ('vengeance/avenging'), and the verse asks for visible divine vindication. Softening the term would undertranslate the imprecatory force of the psalm.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: Syntactic relation of 'before our eyes'
  chosen_reading: Attach 'before our eyes' to the making-known of vengeance among the nations.
  alternative_readings:
  - 'Attach it more tightly to the vengeance itself: ''the vengeance ... before our eyes'''
  rationale: The Hebrew sequence allows some flexibility, but in English the clearest sense is that the nations are to see God's avenging action, and the psalmist asks to witness it personally.
  doctrine_reference: Translation philosophy §5
revisions:
- timestamp: '2026-04-21T00:23:45Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/079/010.json
  category: awkward_english
  tier: 1
  from: the vengeance for the shed blood of your servants
  to: vengeance for your servants' shed blood
  rationale: The current phrasing, with its chain of prepositional phrases ('for the... blood of your servants'), is slightly stiff in English. Using a possessive ('your servants' shed blood') creates a more natural and concise rendering without any loss of meaning. The definite article 'the' before 'vengeance' can also be omitted for a more idiomatic jussive construction.
- timestamp: '2026-04-23T11:27:46Z'
  adjudicator: azure-gpt-5.4-revision-pass
  reviewer_model: gpt-5.4
  category: revision_pass
  from: Why should the nations say, “Where is their God?” Let vengeance for your servants' shed blood be made known among the nations before our eyes.
  to: Why should the nations say, “Where is their God?” Let the vengeance of your servants' shed blood be made known among the nations before our eyes.
  rationale: Added 'the' before 'vengeance' and changed 'vengeance for your servants' shed blood' to 'the vengeance of your servants' shed blood' to more closely reflect the Hebrew construction.
- timestamp: '2026-08-28T22:07:59Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: mistranslation
  tier: 1
  from: Why should the nations say[a], “Where is their God?” Let the vengeance of your servants' shed blood be made known among the nations before our eyes.
  to: Why should the nations say, “Where is their God?” Let vengeance for your servants’ shed blood be made known among the nations before our eyes.
  rationale: נִקְמַת דַּם is vengeance/avenging on account of shed blood. English “vengeance of ... blood” misleadingly makes the blood the possessor of vengeance; “vengeance for your servants’ shed blood” expresses the construct relation naturally and accurately. Once this is in the text, the prior alternative-syntax note is redundant.
