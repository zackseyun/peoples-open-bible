    rationale: 마소라 본문(WLC)은 ‘파멸의 성읍’을 지지하지만, 일부 고대 본문 전승은 ‘태양의 성읍’에 해당하는 독법을 보인다. 본문은 WLC를 따르되 이문을 각주로 제시하여 논쟁성을 보존해야 한다.
