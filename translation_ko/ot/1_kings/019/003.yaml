    rationale: וַיַּרְא 및 영어 POB ‘he saw’에는 무엇을 보았는지가 명시되지 않습니다. ‘그것을’은 선행 내용을 특정하여 원문의 목적어 생략을 좁힙니다.
  - severity: low
