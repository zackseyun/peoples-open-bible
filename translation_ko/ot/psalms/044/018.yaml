lexical_decisions:
- source_word: כָּל זֹאת / All this
  english_pob_choice: All this
  chosen_korean: 이 모든 일
  alternatives_korean:
  - 이 모든 것들
  - 이 모든 일들
  lexicon: HALOT
  rationale: 앞선 고난 전체를 포괄하는 집합적 표현이므로, 한국어에서는 단수적인 '이 모든 일'이 자연스럽고 포괄성도 잘 살립니다.
- source_word: בָּאַתְנוּ / has come upon us
  english_pob_choice: has come upon us
  chosen_korean: 우리에게 닥쳤으나
  alternatives_korean:
  - 우리에게 일어났으나
  - 우리에게 찾아왔으나
  lexicon: HALOT
  rationale: 히브리어의 '오다' 이미지를 살리면서 환난이 외부에서 덮쳐 온 뉘앙스를 자연스럽게 전달하기 위해 '닥치다'를 택했습니다.
- source_word: שְׁכַחֲנוּךָ / we have not forgotten you
  english_pob_choice: we have not forgotten you
  chosen_korean: 우리가 주님을 잊지 않았고
  alternatives_korean:
  - 우리가 주님을 잊은 적이 없고
  - 우리가 주님을 기억하지 못한 것이 아니고
  lexicon: HALOT
  rationale: 직접 목적어의 2인칭 접미사는 하나님을 가리키므로, 문맥상 존칭을 사용해 '주님'으로 옮겼습니다. 현재완료의 지속된 부정을 자연스럽게 살리기 위해 '잊지 않았고'로 표현했습니다.
- source_word: שִׁקַּרְנוּ בִּבְרִיתֶךָ / we have not been false to your covenant
  english_pob_choice: we have not been false to your covenant
  chosen_korean: 주님의 언약에 거짓되이 행하지도 않았습니다
  alternatives_korean:
  - 주님의 언약을 속이지도 않았습니다
  - 주님의 언약에 대해 거짓말하지도 않았습니다
  lexicon: HALOT
  rationale: שקר은 단순한 '거짓말하다'보다 언약에 대한 불성실·배신을 포함할 수 있어, '거짓되이 행하다'로 covenant unfaithfulness를 드러냈습니다.
theological_decisions:
- issue: 시편 44:18의 언약적 무죄 주장 범위
  chosen_reading: 이 구절은 고난 가운데서도 하나님을 잊지 않고 언약에 불성실하지 않았다는 항변으로 읽고, 절대적 무죄 주장으로 확장하지 않았습니다.
  alternative_readings:
  - 하나님 앞에서 전면적인 도덕적 무죄 주장
  rationale: 히브리어는 '주님을 잊지 않음'과 '언약에 거짓되이 행하지 않음'을 말할 뿐이므로, 본문이 허용하는 범위를 넘는 강한 신학적 확대를 피했습니다.
  doctrine_reference: 언약적 충실성의 주장과 인간의 전반적 죄성은 구분하여 보존
