- timestamp: '2026-08-28T22:31:26Z'
  adjudicator: wisdom-source-audit-final
  reviewer_model: gpt-5.6-sol-2026-07-09
  source_review: WLC Hebrew, chapter context, prior Sol/Terra proposal and final high-scrutiny adjudication
  category: idiom
  tier: 1
  from: Surely his flesh on him feels pain[b][a], and his soul on him mourns.
  to: Only his own flesh feels pain[a], and his own soul[b] mourns.
  rationale: The repeated “on him” is not viable English. In this compact parallelism, עָלָיו is plausibly self-referential and can be represented by “his own,” while אַךְ most naturally restricts the person’s awareness to his own suffering in contrast with his ignorance of what happens to his children. This preserves the flesh/soul pairing without imposing the potentially misleading idea that flesh and soul suffer “for” him. The notes preserve both the Hebrew idiom and the semantic range of נֶפֶשׁ.
- timestamp: '2026-11-09T18:02:31Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: Only his own flesh feels pain[a], and his own soul[b] mourns.
  to: Only his own flesh feels pain[a], and his own soul mourns.
  rationale: The latest idiom revision rightly replaces the unnatural repeated “on him” with “his own” and reads “Only” in contrast with ignorance of the sons’ circumstances. I preserve that gain and the flesh–soul parallel without specifying whether the suffering belongs to dying or to the condition of the dead.
