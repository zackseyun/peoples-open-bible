- from: 그날에 아하수에로 왕은 하만, 곧 유대인들의 적의 집을 왕비 에스더에게 주었습니다. 모르드개는 에스더가 그가 자기에게 어떤 사람이었는지를 알려 주었기 때문에 왕 앞에 나아왔습니다.
  to: 그날 아하수에로 왕은 유대인들의 적인 하만의 집을 왕비 에스더에게 주었습니다. 에스더가 왕에게 모르드개가 자신에게 어떤 사람인지를 알렸기 때문에, 모르드개는 왕 앞에 나아왔습니다.
  rationale: 하만을 ‘유대인들의 적’으로 직접 수식하여 히브리어의 관계를 명확히 했습니다. 또한 에스더가 왕에게 모르드개와 자신의 관계를 알렸다는 문맥상 전제를 드러내되, מַה הוּא לָהּ의 폭넓은 관계 표현은 ‘어떤 사람인지’로 보존했습니다. 인과절을 앞에 두어 ‘때문에’가 모르드개의 왕 앞 출현과 자연스럽게 연결되게 했습니다.
