  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: ko
  text: 그리고 그때 내가 여러분에게 말했습니다. ‘나 혼자서는 여러분을 감당할 수 없습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
