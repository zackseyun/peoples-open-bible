revisions:
- from: 당신께서는 그들을 불의 용광로처럼 만드실 것입니다[a] — 당신의 얼굴이 임하는 때에, 야훼여. 그분은 진노하셔서 그들을 삼키시며, 불이 그들을 삼킬 것입니다.
  to: 당신께서는 그들의 열매를 땅에서 멸하시고, 그들의 자손을 사람들 가운데서 멸하실 것입니다[a].
  rationale: 제시된 WLC 본문에 맞추어 번역 전체를 시편 21:10으로 교체했습니다. ‘열매’와 ‘자손’의 시적 병행을 유지했으며, 히브리어에서 둘째 행에 생략된 ‘멸하시다’를 한국어 문장의 명료성을 위해 반복했습니다. ‘사람들 가운데서’는 בְּנֵי אָדָם의 일반적 인류 지시를 자연스럽게 반영하고, 직역 및 대안은 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:06:34Z'
