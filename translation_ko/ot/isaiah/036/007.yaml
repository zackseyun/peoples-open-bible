id: ISA.36.7
reference: Isaiah 36:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִי תֹאמַ֣ר אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵ֛י הַ/מִּזְבֵּ֥חַ הַ/זֶּ֖ה תִּֽשְׁתַּחֲוֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/007.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall bow down before this altar’?”
translation:
  language: ko
  text: “그러나 만일 당신이 내게 ‘우리는 야훼 우리 하나님을 신뢰한다’고 말한다면, 히스기야가 그분의 산당들과 제단들을 없애고 유다와 예루살렘에 ‘너희는 이 제단 앞에서 절하라’고 말한 분이 바로 그분이 아니겠습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: the LORD our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 주님 우리 하나님
  - 여호와 우리 하나님
  lexicon: YHWH → 야훼; Θεός → 하나님
  rationale: 원문의 신명사표현은 POB 관례에 따라 야훼로 옮기고, 소유격 관계는 우리 하나님으로 자연스럽게 처리했습니다.
- source_word: בָּמֹתָיו
  english_pob_choice: his high places
  chosen_korean: 그분의 산당들
  alternatives_korean:
  - 그의 높은 곳들
  - 그의 산당
  lexicon: במה → 산당
  rationale: במות는 예배 장소로 쓰인 ‘산당’을 가리키므로, 단순한 지리적 ‘높은 곳’보다 우상숭배적 예배 공간의 함의를 살렸습니다.
- source_word: מִזְבְּחֹתָיו
  english_pob_choice: his altars
  chosen_korean: 그분의 제단들
  alternatives_korean:
  - 그의 제단
  - 그분의 제단
  lexicon: מזבח → 제단
  rationale: 복수형을 반영해 ‘제단들’로 옮기고, 이어지는 소유 관계는 문맥상 ‘그분의’로 통일했습니다.
- source_word: תִּשְׁתַּחֲוֽוּ
  english_pob_choice: You shall bow down
  chosen_korean: 너희는 … 절하라
  alternatives_korean:
  - 너희는 … 엎드리라
  - 너희는 … 경배하라
  lexicon: שחה → 절하다
  rationale: 히브리어 동사의 몸짓적 의미를 살리되, 한국어 예배 맥락에서 가장 직관적인 ‘절하다’를 택했습니다.
theological_decisions:
- issue: 야훼 신명사 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 공개·감사 가능 원칙에 따라 히브리어 고유명사를 직접 드러내는 표기를 유지했습니다.
  doctrine_reference: 성경 번역 원칙 / 신명사 표기 일관성
- issue: 히스기야의 개혁 대상 묘사
  chosen_reading: ‘산당들과 제단들’을 함께 옮겨, 히스기야의 제거 행위가 단순한 시설 정비가 아니라 우상숭배 제의의 정리를 뜻함을 살렸습니다.
  alternative_readings:
  - 높은 곳들
  - 예배당들
  rationale: 원문과 문맥은 예배 개혁의 대상이 된 제의 공간들을 가리키므로, 이를 약화시키는 일반어로 바꾸지 않았습니다.
  doctrine_reference: 열왕기하 18:4; 역대하 31:1
