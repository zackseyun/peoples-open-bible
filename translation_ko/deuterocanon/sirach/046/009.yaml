  - 백발이 될 때까지
  lexicon: 한글 일반어휘
  rationale: 원문의 시간 한계를 살리되 한국어에서 문어적으로 자연스러운 표현을 택했습니다.
- source_word: נחלה / κληρονομία
  english_pob_choice: inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 상속분
  - 기업
  - 기업지
  - 기업물
  lexicon: 한글 일반어휘
  rationale: 문맥상 가나안 땅의 분깃을 가리키므로 '유산'이 'inheritance'의 결과적 수혜를 가장 무리 없이 전달합니다.
theological_decisions:
- issue: 히브리어 본문과 그리스어 병행본의 초점 차이
  chosen_reading: 본문은 '갈렙에게 힘을 주심'과 '그의 자손이 유산을 차지함'을 함께 살리고, '높은 곳' 표현은 본문대로 유지했습니다.
  alternative_readings:
  - LXX를 따라 '주님께서 갈렙에게 힘을 주셨다'와 '그의 씨가 유산을 차지했다'를 더 직접적으로 옮김
  - 히브리어 본문에 맞춰 '그와 함께 머물렀다'를 덧붙임 없이 단순화함
  rationale: 제공된 영어 POB와 최신 개정은 히브리어 본문의 흐름을 따르며, 그리스어의 '주님'과 '씨/자손'은 보조 비교로만 반영하는 것이 적절합니다.
  doctrine_reference: 본문비평/번역 원칙
