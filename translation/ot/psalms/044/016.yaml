id: PSA.44.16
reference: Psalms 44:16
source:
  edition: WLC
  text: מִ֭/קּוֹל מְחָרֵ֣ף וּ/מְגַדֵּ֑ף מִ/פְּנֵ֥י א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׃
translation:
  text: because of the taunts and insults I hear, because of the enemy taking revenge.
  philosophy: dynamic
lexical_decisions:
- source_word: מִקּוֹל
  lemma: מִן
  chosen: because of the voice of
  alternatives:
  - from the sound of
  - at the voice of
  lexicon: HALOT
  rationale: The preposition מִן with קוֹל here expresses cause/source in context, not simple spatial separation. 'Because of the voice of' preserves the concrete Hebrew image while making the causal force clear in English.
- source_word: מְחָרֵף
  chosen: one who taunts
  alternatives:
  - the reviler
  - the taunter
  lexicon: HALOT
  rationale: Expresses active hostile scorn naturally.
- source_word: וּמְגַדֵּף
  chosen: and reviles
  alternatives:
  - and rails
  - and speaks abusively
  lexicon: HALOT
  rationale: Conveys abusive speech without specifying an unstated object of blasphemy.
- source_word: מִפְּנֵי
  chosen: because of
  alternatives:
  - before
  - from the presence of
  lexicon: HALOT
  rationale: Though literally 'from the face/presence of,' the idiom commonly marks cause or occasion. 'Because of' best fits the parallelism and the verse's causal sequence.
- source_word: אֹיֵב
  chosen: the enemy
  alternatives:
  - an enemy
  - foe
  lexicon: HALOT
  rationale: The singular functions collectively or representatively, but 'the enemy' is the most natural English equivalent and preserves the Hebrew singular.
- source_word: וּמִתְנַקֵּם
  chosen: and the avenger
  alternatives:
  - and the one taking vengeance
  - and the vindictive one
  lexicon: HALOT
  rationale: The hitpael participle of נקם denotes one who avenges or takes vengeance. 'The avenger' is concise and idiomatic, preserving the personal force of the participle.
