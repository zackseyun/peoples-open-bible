lexical_decisions:
- source_word: לֹא יִשְׁמַע
  english_pob_choice: does not listen
  chosen_korean: 듣지 않는 것입니다
  alternatives_korean:
  - 듣지 않습니다
  - 들으려 하지 않습니다
  lexicon: שׁמע
  rationale: 시편의 비유에서 단순한 청각이 아니라 반응하지 않음을 나타내므로, '듣지 않는'으로 옮겨 청자의 응답성 부재를 살렸습니다.
- source_word: לְקוֹל
  english_pob_choice: to the voice
  chosen_korean: 목소리를
  alternatives_korean:
  - 소리를
  - 음성을
  lexicon: קוֹל
  rationale: 뒤따르는 פעילים(말하는 자/주문하는 자)과의 연결을 살려 '목소리'로 옮겼습니다.
- source_word: מְלַחֲשִׁים
  english_pob_choice: charmers
  chosen_korean: 술객들
  alternatives_korean:
  - 주문하는 자들
  - 속삭이는 자들
  - 주술사들
  lexicon: לחש
  rationale: 히브리어가 속삭임/주문과 연관된 용어이므로, 여기서는 주술적 행위를 하는 사람을 가리키는 뜻을 살려 '술객들'로 옮겼습니다.
- source_word: חוֹבֵר חֲבָרִים מְחֻכָּם־
  english_pob_choice: one who skillfully casts spells
  chosen_korean: 주문을 능숙하게 거는 자
  alternatives_korean:
  - 주문을 묶는 자
  - 마법을 능숙하게 부리는 자
  - 주술을 능숙하게 거는 자
  lexicon: חבר
  rationale: 직역하면 '결속하는/묶는 자'에 가깝지만, 문맥상 뱀을 다루는 주술적 주문을 가리키므로 의미를 드러내는 표현으로 옮겼습니다.
