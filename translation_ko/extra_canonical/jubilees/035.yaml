  language: ko
  text: '1. 마흔다섯째 희년의 첫째 주 첫째 해에 리브가가 자기 아들 야곱을 불러, 그의 아버지와 그의 형제에 관하여 평생 그들 모두를 공경하라고 일러 주었습니다.

    2. 야곱이 그녀에게 말했습니다. “당신께서 내게 명령하신 모든 것을 행하겠습니다. 내가 그들을 공경하는 일이기 때문에, 이 일은 내게 명예와 위대함이 되고 하나님 앞에서 의가 될 것입니다.”

    3. 내 아들아, 너는 네가 태어난 날부터 오늘까지 내 모든 행위와 내 마음속에 있는 모든 것을 알고 있습니다. 내가 네 아버지를 매우 사랑한다는 것도 알고 있습니다.

    4. 내 마음에 있는 것은, 내가 늘 모든 이를 위해 선한 것을 생각한다는 것입니다. 그리고 내가 왜 이 일을 하지 않겠습니까?

    5. 당신께서 제게 명령하신 것은 제가 아버지와 형제를 공경하는 것이었습니다. 그러니 제게서 어떤 비뚤어짐을 보셨는지 말씀해 주십시오.

    6. 그녀가 그에게 말하였습니다. “내 아들아, 나는 평생 네 안에서 그릇된 행위는 하나도 보지 못하고, 오직 올바름만 보았습니다. 그러나 내 아들아, 내가 너에게 진실을 말하겠습니다. 나는 이 해에 죽을 것이며, 이 해를 넘겨 살지 못할 것입니다. 내가 꿈에서 내 죽음의 날을 보았기 때문입니다. 곧 나는 백오십오 년을 넘겨 살지 못할 것입니다.”

    7. “보십시오, 저는 제가 살아야 할 생애의 모든 날을 다 마쳤습니다.” 그리고 야곱은 어머니의 말 때문에 웃었습니다. 어머니가 그에게 자신이 죽을 것이라고 말했지만, 그녀는 여전히 그의 맞은편에 있었고, 그녀에게는 여전히 힘이 있었으며, 기력도 쇠하지 않았습니다. 이는 그녀가 들어가고 나가고 보았기 때문인데,

    8. 그리고 그녀의 이빨은 튼튼했고, 그녀의 평생 동안 그녀에게는 어떤 병도 전혀 닥치지 않았습니다. 야곱이 그녀에게 말했습니다. “어머니, 제 생애의 날들이 어머니의 생애의 날들에 가까워지고, 제 힘도 어머니의 힘처럼 이처럼 제게 남아 있다면, 저는 복된 사람입니다. 어머니께서는 죽지 않으실 것입니다. 이는 어머니께서 자신의 죽음에 관하여 제게 헛되이 말씀하고 계시기 때문입니다.”

    9. 그리고 그녀는 이삭에게 가서 말했습니다. “제가 당신께 한 가지 청을 드립니다. 에서에게 야곱에게 해를 꾀하지 않고 적의를 품고 야곱을 뒤쫓지도 않겠다고 맹세하게 해 주십시오. 당신은 에서의 마음을 알고 계십니다. 그는 어릴 때부터 잔인했고, 그에게는 선한 것이 전혀 없으니, 그가 원하기 때문…”

    10. 그는 그대가 죽은 뒤에 그를 죽일 것입니다. 그리고 그대는 그의 형제 야곱이 하란으로 간 날부터 오늘까지, 그가 온 마음으로 우리를 버리고 행한 모든 일을 다 알고 있습니다.

    11. 그는 우리에게 악한 짓을 하였고, 당신의 양 떼를 모았으며, 당신의 모든 소유를 당신의 눈앞에서 약탈했습니다. 우리가 우리에게 속한 것을 그에게 달라고 청하고 요구하는 동안에도, 그는 마치 우리를 불쌍히 여기는 사람처럼 행동합니다.

    12. 그리고 그는 당신께서 당신의 완전하고 올곧은 아들 야곱을 축복하셨기 때문에 당신에게 쓰라린 마음을 품고 있습니다. 그에게는 악이 전혀 없고 오직 선함뿐입니다. 그가 하란에서 온 때부터 오늘까지, 그는 우리에게서 아무것도 빼앗지 않았습니다. 모든 것은 날마다 제때에 우리에게 오며, 우리가 그의 손에서 받을 때마다 그는 온 마음으로 기뻐하고 우리를 축복합니다. 그는 하란에서 온 때부터 오늘까지 우리 곁을 떠나지 않았고, 늘 집 안에서 우리와 함께 지내며 우리를 존중합니다.”

    13. 이삭이 그녀에게 말했습니다. “나도 야곱이 우리를 대하는 행실을 알고 또 보고 있습니다. 그는 마음을 다해 우리를 존중합니다. 나는 에서가 맏아들로 태어난 때부터 야곱보다 에서를 먼저 사랑했지만, 이제는 에서보다 야곱을 더 사랑합니다. 에서가 자기 행실을 매우 악하게 만들었고, 그에게는 의가 없으며, 그의 모든 길은 불의와 폭력이고, 그 주위에는 의가 전혀 없기 때문입니다.”

    14. 그리고 이제 그의 모든 행위 때문에 내 마음이 괴롭습니다. 그도 그의 자손도 구원받지 못할 것입니다. 이는 그들이 땅에서 멸망당하고 하늘 아래에서 뿌리 뽑힐 자들이기 때문입니다. 그는 아브라함의 하나님을 버리고 자기 아내들을 따라가고 또…

    15. 그들의 부정함과 그들의 잘못 뒤에, 그와 그의 자손이. 그리고 당신은 그가 자기 동생 야곱을 죽이지 않겠다고 맹세하게 하라고 내게 말합니다. 그가 맹세하더라도 자기 맹세를 지키지 않을 것이며, 악 외에는 아무것도 하지 않을 것입니다. 또 그가 자기 동생 야곱을 죽이고자 하면, 그는 야곱의 손에 넘겨질 것이며, 그 손에서 벗어나지 못할 것입니다. 그가 야곱의 손에 떨어질 것이기 때문입니다.

    16. “그러나 너는 야곱 때문에 두려워하지 말아라. 야곱의 보호자는 위대하고 강하며 존귀하고, 에서의 보호자보다 더 찬양받는다.” 그 뒤 리브가는 사람을 보내 에서를 불렀고, 에서가 그녀에게 왔습니다. 리브가가 그에게 말했습니다. “내 아들아, 내가 네게 한 가지 청을 한다. 그것을 들어주겠다고 말하여라, 내 아들아.”

    17. 그가 말했습니다. “저는 당신이 요구하시는 모든 것을 행하고, 당신의 요청을 거절하지 않겠습니다.” 그러자 그 여자가 그에게 말했습니다. “내가 죽는 날에 나를 데려다가 네 아버지의 어머니인 사라 곁에 묻어 주고, 너와 야곱이 서로 사랑하기를 바란다.”

    18. 아무도 자기 형제에게 해를 꾀하지 말고 오직 서로 사랑하여라. 그리하면 내 아들들아, 너희가 형통하고 땅 한가운데에서 존귀하게 되며, 어떤 원수도 너희를 두고 기뻐하지 못할 것이다. 또 너희를 사랑하는 모든 이의 눈앞에서 너희는 복과 자비가 될 것이다.”

    19. 그가 말하였습니다. “제가 어머니께서 제게 말씀하신 모든 것을 행하고, 어머니께서 돌아가시는 날 사라, 곧 제 아버지의 어머니 곁에 어머니를 장사하겠습니다. 어머니께서 바라신 대로 사라의 뼈가 어머니의 뼈 가까이에 있게 하겠습니다.”

    20. 그리고 내 형제 야곱을 저는 그 누구보다도 더 사랑합니다. 온 땅에 그 한 사람 외에는 제게 형제가 없습니다. 제가 그를 사랑하는 것이 어찌 대단한 일이겠습니까? 그는 제 형제입니다. 우리는 함께 어머니의 태에 심겨졌고, 함께 어머니의 몸에서 나왔습니다. 제가 제 형제를 사랑하지 않는다면 누구를 사랑하겠습니까?

    21. 저는 어머니께 청합니다. 저와 제 자녀에 관하여 야곱을 타이르십시오. 아버지께서 야곱을 축복하시던 날 그를 높이시고 저를 낮추셨으므로, 그가 반드시 저와 제 자녀를 다스리게 될 것을 저는 압니다.

    22. “그리고 저는 그를 사랑하며, 제 평생 동안 그에게 악을 꾀하지 않고 오직 선만을 도모할 것을 맹세합니다.” 그리고 그는 이 모든 일에 관하여 그녀에게 맹세하였다.

    23. 리브가는 에서가 보는 앞에서 야곱을 불러, 자기가 에서와 나눈 말대로 그에게 명령했습니다. 야곱이 말했습니다. “제가 당신의 뜻을 행하겠습니다. 저를 믿으십시오. 저나 제 자손에게서 에서를 해치는 어떤 악도 나오지 않을 것이며, 사랑 외에는 어떤 일에서도 제가 앞서지 않겠습니다.”

    24. 그 밤에 그녀와 그녀의 아들들은 먹고 마셨습니다. 그녀는 마흔한 번째 희년의 일곱째 주 셋째 해 그 밤에 죽었습니다. 그녀의 두 아들 에서와 야곱은 그녀를 그들의 아버지의 어머니 사라 곁에 있는 쌍굴에 장사했습니다.

    25. 그리고 이 이레의 여섯째 해에 이삭이 두 아들 에서와 야곱을 불렀습니다. 그들이 그에게 왔습니다. 이삭이 그들에게 말했습니다. “내 아들들아, 나는 내 조상들의 길로 가서 내 조상들이 있는 영원한 집에 이릅니다.”

    26. 나를 내 아버지 아브라함 곁, 헷 사람 에브론의 밭에 있는 쌍굴에 장사하십시오. 그곳은 아브라함이 가나안 땅에서 매장지로 마련한 곳입니다. 내가 나 자신을 위해 판 무덤, 바로 그곳에 나를 장사하십시오.

    27. 내 아들들아, 내가 너희에게 명합니다. 땅에서 의와 정직을 행하십시오. 그러면 야훼께서 아브라함과 그의 자손에게 행하겠다고 말씀하신 모든 일을 너희에게 이루실 것입니다.

    28. 내 아들들아, 너희끼리 서로 사랑하십시오. 사람이 자기 생명을 사랑하듯이, 각자 자기 형제를 사랑하고 사람은 구하십시오—'
