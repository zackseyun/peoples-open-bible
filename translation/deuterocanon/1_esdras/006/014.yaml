  chosen_reading: the heavenly One
  alternative_readings:
  - the God of heaven
  - the one in heaven
  rationale: The Greek source text has the adjectival substantive 'the heavenly [one],' not the fuller phrase 'God of heaven.' Because the project prioritizes the Greek witness for 1 Esdras while using the Semitic parallel as a control, the main text preserves the Greek form. A footnote records the more expansive alternative familiar from related Ezra tradition.
  doctrine_reference: Translation philosophy §1, §3
- issue: Rendering κύριος
  chosen_reading: Lord
  alternative_readings:
