  source_fidelity: 히브리어 본문의 대조 구조를 충실히 반영합니다. שְׂנוּאָה는 ‘미움을 받는’으로, וַיִּפְתַּח אֶת־רַחְמָהּ는 ‘그녀의 태를 여셨지만’으로, עֲקָרָה는 ‘불임이었습니다’로 적절히 옮겼습니다. ‘하지만’은 וְ의 문맥상 대조를 자연스럽게 드러냅니다.
