  text: נַפְשִׁי נָתַתִּי אַחֲרֶיהָ, וּלְנֵצַח נְצָחִים לֹא אַטֶּה מִמֶּנָּה.<br><small>(כ)</small> וּבְטָהֳרָה מְצָאתִיהָ, וְלֵב קָנִיתִי לָהּ מִתְּחִלָּתָהּ.
