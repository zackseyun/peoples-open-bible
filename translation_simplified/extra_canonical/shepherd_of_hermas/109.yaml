  text: 'Remediate ergo vos dum adhuc turris aedificatur. 2. Dominus habitat in viris amantibus pacem;
    ei enimvero pax cara est; a litigiosis vero et perditis malitiae longe abest. reddite igitur ei spiritum
    integrum, sicut accepistis. 3. si enim dederis fulloni vestimentum novum integrum, idque integrum
    iterum vis recipere, fullo autem scissum tibi illud reddet, recipies? nonne statim scandescis et eum
    convicio persequeris, dicens: Vestimentum integrum tibi dedi; quare scidisti illud et inutile redegisti?
    et propter scissuram, quam in eo fecisti, in usu esse non potest. nonne haec omnia verba dices fulloni
    ergo et de scissura quam in vestimento tuo fecerit? 4. si sic igitur tu doles de vestimento tuo, et
    quereris quod non illud integrum recipias, quid putas Dominum tibi facturum, qui spiritum integrum
    tibi dedit, et tu eum totum inutilem redegisti, ita ut in nullo usu esse possit domino suo? inutilis
    enim esse coepit usus eius, cum sit corruptus a te. nonne igitur dominus spiritus eius propter hoc
    factum tuum [morte te] adficiet? 5. Plane, inquam, omnes eos, quoscumque invenerit in memoria offensarum
    permanere, adficiet. Clementiam, inquit, eius calcare nolite, sed potius honorificate eum, quod tam
    patiens est ad delicta vestra, et non est sicut vos. agite enim paenitentiam utilem vobis.'
