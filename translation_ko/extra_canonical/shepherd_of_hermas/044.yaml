  text: 'But I do not know whether these commandments can be kept by a human being, for they are very hard.


    In reply he says to me: “If you set it before yourself that they can be kept, you will keep them easily, and they will not be hard. But if it has already risen up in your heart that they cannot be kept by a human being, you will not keep them.


    Now I say to you: if you do not keep these, but only remember them in passing, you will walk in the commandments of the devil—difficult and bitter and savage and licentious. And do not be afraid of the devil, for he has no power against you; for I will be with you—I, the angel of repentance—who has mastery over him. The devil has only fear, and his fear has no strength. Do not therefore be afraid of him, and he will flee from you.”'
translation:
  language: ko
  text: '하지만 저는 이 계명들이 사람에 의해 지켜질 수 있는지 알지 못합니다. 왜냐하면 그것들은 매우 엄격하기 때문입니다.


    그에 대해 그가 제게 말했습니다. “네가 스스로 그것들이 지켜질 수 있다고 생각해 두면, 그것들을 쉽게 지킬 것이며, 그것들은 엄격하지 않을 것이다. 그러나 이미 네 마음속에 사람에 의해 그것들을 지킬 수 없다는 생각이 떠오른다면, 너는 그것들을 지키지 못할 것이다.


    이제 내가 너희에게 말합니다. 만일 너희가 이것들을 지키지 않고 그냥 흘려버린다면, 너희는 악마의 계명들—어렵고 쓰고 거칠고 방탕한—을 따르게 될 것이다. 그리고 악마를 두려워하지 마십시오. 그에게는 너희를 거슬러 아무 힘도 없기 때문입니다. 내가 너희와 함께 있을 것이기 때문입니다. 곧 그를 제압하는 회개의 천사인 내가 함께 있을 것입니다. 악마는 두려움만 가지고 있을 뿐이며, 그의 두려움에는 힘이 없습니다. 그러므로 그를 두려워하지 마십시오. 그러면 그가 너희에게서 달아날 것입니다.”[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολαί / ἐντολαὶ αὗται
  english_pob_choice: these commandments
  chosen_korean: 이 계명들 / 이것들
  alternatives_korean:
  - 이 명령들
  - 이 훈계들
  lexicon: ἐντολή
  rationale: POB의 ‘commandments’를 따라 ‘계명들’로 옮겨, 내용이 단순한 권고가 아니라 규범적 명령임을 드러냈습니다.
- source_word: σκληραί εἰσι λίαν
  english_pob_choice: they are very hard
  chosen_korean: 매우 엄격하기 때문입니다
  alternatives_korean:
  - 매우 어렵기 때문입니다
  - 매우 कठ하기 때문입니다
  lexicon: σκληρός
  rationale: σκληρός의 핵심을 단순 난이도보다 ‘강하고 कठ한/엄한’ 성격으로 보아, 계명의 요구가 헐겁지 않다는 뉘앙스를 살렸습니다.
- source_word: παρενθυμηθῇς
  english_pob_choice: only remember them in passing / neglect them
  chosen_korean: 그냥 흘려버린다면
  alternatives_korean:
  - 잠깐 생각해 보고 지나친다면
  - 건성으로 여긴다면
  lexicon: παρενθυμέομαι
  rationale: 행위를 ‘잠깐 떠올리고 넘어감’이라는 소극적 처리로 이해하여, 지속적 순종의 반대라는 점이 드러나도록 했습니다.
- source_word: κατακυριεύων αὐτοῦ
  english_pob_choice: who has mastery over him
  chosen_korean: 그를 제압하는
  alternatives_korean:
  - 그를 다스리는
  - 그를 지배하는
  lexicon: κατακυριεύω
  rationale: 단순한 통치보다 상대를 눌러 제어하는 역동이 있어 ‘제압하는’으로 옮겼습니다.
theological_decisions:
- issue: 악마에 대한 두려움과 권세의 관계
  chosen_reading: 악마는 두려움만 가지고 있을 뿐이며, 그의 두려움에는 힘이 없습니다.
  alternative_readings:
  - 악마는 단지 두려움만을 일으킬 뿐이며 그의 두려움에는 힘이 없습니다
  - 악마의 위협은 실질적 권능이 없습니다
  rationale: 원문의 대비는 악마의 실제 권능이 아니라 두려움의 위장성에 있으므로, POB의 직설을 유지해 ‘힘이 없다’는 진술을 분명히 살렸습니다.
  doctrine_reference: 문맥상 영적 권세의 상대화; 회개의 천사가 악마를 제압함
- issue: 회개의 천사에 대한 자기소개
  chosen_reading: 곧 그를 제압하는 회개의 천사인 내가 함께 있을 것입니다.
  alternative_readings:
  - 회개의 천사인 내가, 그를 지배하는, 함께 있을 것입니다
  - 회개의 천사로서 내가 함께 있어 그를 다스릴 것입니다
  rationale: ‘회개의 천사’라는 호칭과 ‘그를 제압하는’ 수식의 결합을 유지해, 인물이 단순 조력자가 아니라 악마 위에 권세를 가진 존재임을 드러냈습니다.
  doctrine_reference: 본문 고유의 천사론을 보존하며 정통 교리로 환원하지 않음
