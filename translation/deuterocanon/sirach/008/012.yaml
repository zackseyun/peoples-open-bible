- issue: Divergence between the surviving Hebrew and the Greek parallel for Sirach 8:12
  chosen_reading: Translate the extant Hebrew line as the main text.
  alternative_readings:
  - 'Greek tradition: ''Do not lend to a man stronger than you, and if you do lend, count it as lost.'''
  rationale: For Sirach, where Hebrew survives, project policy gives primacy to the Hebrew witness. Here the Greek is not a minor variant but an entirely different saying, so it is preserved as an alternative textual tradition in a footnote rather than harmonized into the main text.
