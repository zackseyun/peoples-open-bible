lexical_decisions:
- source_word: רָחוּם וְחַנּוּן / οἰκτίρμων καὶ ἐλεήμων
  english_pob_choice: compassionate and gracious
  chosen_korean: 자비롭고 은혜로우시며
  alternatives_korean:
  - 긍휼이 많고 은혜로우시며
  - 불쌍히 여기시고 은혜로우시며
  lexicon: רָחוּם / חַנּוּן
  rationale: 두 형용사는 하나님의 긍휼과 호의를 함께 나타내므로, 한국어에서도 두 어휘를 병렬로 살려 균형 있게 표현했습니다.
- source_word: וְסוֹלֵחַ לַעֲוֹנוֹת / ἀφίησιν ἁμαρτίας
  english_pob_choice: he forgives sins
  chosen_korean: 죄를 용서하시고
  alternatives_korean:
  - 죄악을 용서하시고
  - 허물을 용서하시고
  lexicon: סלח / ἁμαρτία
  rationale: English POB의 'sins'를 따라 범주를 분명히 하되, 한국어에서는 자연스러운 직접 목적어 구조로 옮겼습니다.
- source_word: וּמוֹשִׁיעַ בְּעֵת צָרָה / σώζει ἐν καιρῷ θλίψεως
  english_pob_choice: saves in a time of distress
  chosen_korean: 환난 때에 구원하십니다
  alternatives_korean:
  - 고난 때에 구원하십니다
  - 곤란한 때에 구원하십니다
  lexicon: ישׁע / θλῖψις
  rationale: צָרָה와 θλῖψις는 단순한 불편보다 압박과 위기의 뉘앙스가 강하므로, 성경적 문맥에 익숙하면서도 원뜻을 살리는 '환난'을 택했습니다.
theological_decisions:
- issue: יהוה / ὁ Κύριος의 표기
  chosen_reading: 주님
