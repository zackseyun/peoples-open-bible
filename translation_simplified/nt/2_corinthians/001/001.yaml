translation:
  language: en
  text: 'From Paul, an apostle of Christ Jesus[a] by God’s will, and from Timothy, our brother. To God’s church in Corinth and to all the saints[b] throughout Achaia:'
  philosophy: optimal-equivalence
  footnotes:
