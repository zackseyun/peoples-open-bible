translation:
  language: ko
  text: 이는 그가 지혜로운 자들도 죽고[a], 어리석은 자와 우둔한 자가 함께 망하며[b], 그들이 자기들의 재산을 다른 이들에게 남기는 것을 보기 때문입니다[c].
