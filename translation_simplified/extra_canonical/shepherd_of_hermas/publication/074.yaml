  rationale: In paragraphs 1 and 4, ἐπιδεδωκότες identifies the people by their act of handing in rods;
    both omissions are restored. In paragraph 5, ἐὰν governs both repenting quickly and not persisting
    in pleasures, so the opportunity is explicitly conditional rather than an unqualified assertion followed
    by an obligation. The existing note [d] already distinguishes idiomatic English “still” from the selected
    Greek and records the reported Michigan wording. All notes, paragraph prefixes, divisions and disclosed
    proportions are preserved.; The selected Greek has no renewed seal, plural spirits or sinners noun
    selection. This removes decisions belonging to other sections and aligns the metadata with this section's
    actual contents and the corrected conditional wording.; The seal, spirits and sinners noun are absent
    from S.8.viii. The replacement describes the section's actual contents and reconciles the simplification
    metadata with the restored submission actions and explicit paragraph 5 condition.
- category: publication_review_correction
  rationale: In paragraph 3, ἐὰν ταχὺ μετανοήσωσι governs the quick-repentance outcome, including tower
    dwelling; “If they do” explicitly carries that condition across the sentence break without changing
    the opportunity language. Independently reconsidering paragraph 5 against the Greek, ἐδιψύχησαν supports
    “wavered” and ἐδιχοστάτησαν supports “were at odds,” not the added causative assertion “caused divisions.”;
    Records the independent lexical reconsideration for the simplified edition and reconciles its decision
    record with the corrected text.
- category: publication_review_correction
  rationale: 'Independent reconsideration against the supplied Greek: paragraph 5 has οὖν but no ἔτι,
