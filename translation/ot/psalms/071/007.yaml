id: PSA.71.7
reference: Psalms 71:7
source:
  edition: WLC
  text: כְּ֭/מוֹפֵת הָיִ֣יתִי לְ/רַבִּ֑ים וְ֝/אַתָּ֗ה מַֽחֲסִ/י עֹֽז־׃
translation:
  text: I have become a wonder to many[a], but you are my strong refuge.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “a sign” or “an object of astonishment.”
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹפֵת
  chosen: a wonder
  alternatives:
  - like a wonder
  - like a sign
  - like an object of astonishment
  lexicon: HALOT
  rationale: “Wonder” retains the remarkable or astonishing sense without importing the frequent ominous implication of “portent.”
- source_word: הָיִיתִי
  chosen: I have become
  alternatives:
  - I was
  - I became
  lexicon: HALOT
  rationale: The qatal 1cs of היה can be rendered as a simple past, but in English 'I have become' naturally conveys a present state resulting from prior experience, which fits the psalm's ongoing situation.
- source_word: לְרַבִּים
  chosen: to many
  alternatives:
  - for many
  - in the eyes of many
  lexicon: HALOT
  rationale: The preposition לְ with רַבִּים is most straightforwardly rendered 'to many,' indicating the people for whom the psalmist has become such a portent.
- source_word: מַחֲסִי
  chosen: my refuge
  alternatives:
  - my shelter
  - my place of refuge
  lexicon: HALOT
  rationale: מַחֲסֶה regularly denotes a refuge or shelter. 'My refuge' is concise, idiomatic, and preserves the metaphor of protective safety in God.
- source_word: עֹז
  chosen: strong
  alternatives:
  - strength
  - mighty
  - of strength
  lexicon: HALOT
  rationale: עֹז means strength or might. Because it follows a construct form ('my refuge of strength'), idiomatic English is better served by the attributive rendering 'strong refuge,' which preserves the semantic force while avoiding awkwardness.
