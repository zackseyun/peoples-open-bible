translation:
  text: One who lowers his face and pretends not to hear will get the better of you where he is not recognized[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “when he is not noticed.”
    reason: alternative_reading
lexical_decisions:
- source_word: συγκύφων
  chosen: lowers
  alternatives:
  - bends down
  - stoops
  - hangs down
  lexicon: LSJ
  rationale: The participle denotes a stooping or bending posture. 'Lowers' fits idiomatic English when paired with 'his face' and preserves the bodily gesture without over-literal awkwardness.
- source_word: πρόσωπον
  chosen: face
  alternatives:
  - countenance
  lexicon: LSJ
  rationale: The ordinary sense is 'face.' 'Countenance' is possible but too elevated for the project's modern-English style.
- source_word: ἑτεροκωφῶν
  chosen: pretends not to hear
  alternatives:
  - acts deaf
  - feigns deafness
  lexicon: LSJ
  rationale: The rare participle suggests behaving as though deaf or turning a deaf ear. 'Pretends not to hear' communicates the intentional social pose more naturally than the more wooden 'acts deaf.'
- source_word: ὅπου
  chosen: where
  alternatives:
  - when
  - wherever
  lexicon: LSJ
  rationale: 'The adverb is most naturally locative here: ''where he is not recognized.'' A temporal rendering is possible but less direct from the Greek wording.'
- source_word: οὐκ ἐπεγνώσθη
  chosen: he is not recognized
  alternatives:
  - he is not noticed
  - he is not known
  lexicon: LSJ
  rationale: The passive of ἐπιγινώσκω can mean 'be recognized' or 'be known.' 'Recognized' best fits the social setting implied by deceptive bodily behavior.
- source_word: προφθάσει
  chosen: he will get ahead of you
  alternatives:
  - he will outstrip you
  - he will anticipate you
  - he will forestall you
  lexicon: LSJ
  rationale: The verb means to come before, anticipate, or outpace. In this wisdom context, 'get ahead of you' captures the practical sense of gaining advantage over another without sounding archaic.
