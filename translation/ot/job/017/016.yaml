id: JOB.17.16
reference: Job 17:16
source:
  edition: WLC
  text: בַּדֵּ֣י שְׁאֹ֣ל תֵּרַ֑דְנָה אִם יַ֖חַד עַל עָפָ֣ר נָֽחַת־־׃ס
translation:
  text: Will my hopes go down to the bars of Sheol[a]? Shall we descend together to the dust[b]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “the parts of Sheol” or “the depths of Sheol.” The Hebrew expression is uncertain.
    reason: alternative_reading
  - marker: b
    text: Or “Shall we rest together on the dust?”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּדֵּי
  chosen: bars of
  alternatives:
  - parts of
  - members of
  - bolts of
  lexicon: HALOT
  rationale: A possible concrete sense in this difficult expression; “parts” or “depths” remains possible and is noted.
- source_word: שְׁאֹל
  chosen: Sheol
  alternatives:
  - the grave
  - the realm of the dead
  lexicon: HALOT
  rationale: Retained as 'Sheol' rather than flattened to 'grave' in order to preserve the Hebrew concept of the underworld/realm of the dead. This is a significant lexical-theological term and transliteration best preserves its semantic range.
- source_word: תֵּרַדְנָה
  chosen: will they go down
  alternatives:
  - they will descend
  - will they descend
  lexicon: HALOT
  rationale: The verb ירד means 'go down/descend.' Because the surrounding lines are framed by Job's rhetorical questioning about hope, an interrogative rendering in English fits the discourse well. The 3rd person feminine plural likely refers back to Job's 'hopes' or related feminine plural antecedents from the context.
- source_word: אִם
  chosen: shall
  alternatives:
  - if
  - whether
  lexicon: HALOT
  rationale: Although often 'if,' here אִם functions idiomatically in a rhetorical question or conditional-like clause introducing the second half of the verse. Rendering it as 'shall' produces natural English while preserving the interrogative force of the line.
- source_word: יַחַד
  chosen: together
  alternatives:
  - at once
  - altogether
  lexicon: HALOT
  rationale: The adverb most naturally means 'together' here, expressing shared descent/rest in death.
- source_word: עַל עָפָר
  chosen: to the dust
  alternatives:
  - upon the dust
  - on the dust
  lexicon: HALOT
  rationale: Under the descent reading, this is natural directional English without the stronger interior sense of “into.”
- source_word: נָחַת
  chosen: descend
  alternatives:
  - go down
  - rest
  lexicon: HALOT
  rationale: The main text follows the descent analysis in parallel with תֵּרַדְנָה, while the footnote preserves the competing “rest” reading.
