translation:
  text: After Eleazar had countered the tyrant’s appeals in this way, the bodyguards came forward and harshly dragged him to the instruments of torture[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “to the place of torture.”
