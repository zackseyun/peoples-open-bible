  from: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
  to: Above all, be strong and very courageous, taking care to obey the whole law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may succeed[a] wherever you go.
