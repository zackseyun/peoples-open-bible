source:
  edition: WLC
  text: עֻ֭זִּ/י אֵלֶ֣י/ךָ אֲזַמֵּ֑רָה כִּֽי אֱלֹהִ֥ים מִ֝שְׂגַּבִּ֗/י אֱלֹהֵ֥י חַסְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/017.yaml
  text: O my strength, to you I will sing praises, for God is my stronghold, the God who shows me steadfast love.[a]
  footnotes:
  - marker: a
    text: The Hebrew is literally “the God of my steadfast love,” a compressed expression that may also be rendered “my gracious God.”
    reason: alternative_reading
translation:
  language: ko
  text: 나의 힘이시여, 주님께 노래하겠습니다. 하나님은 나의 요새, 나의 변함없는 사랑의 하나님이십니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나의 변함없는 사랑의 하나님’. 이는 ‘나에게 변함없는 사랑을 보이시는 하나님’ 또는 ‘나의 은혜로우신 하나님’으로 이해될 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But I
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 그리고 저는
  - 저는
  lexicon: WLC
  rationale: 문맥상 앞의 대적들과 대비되는 전환이므로 ‘그러나’로 역접을 살렸고, 독립 인칭대명사는 한국어에서 자연스럽게 ‘저는’으로 옮겼습니다.
- source_word: אָשִׁיר
  english_pob_choice: will sing
  chosen_korean: 노래하겠습니다
  alternatives_korean:
  - 노래하겠습니다
  - 노래하리다
  - 찬양하겠습니다
  lexicon: HALOT
  rationale: 미완료형의 의지/미래를 현대 한국어의 자연스러운 미래·결심 표현으로 옮겼습니다. ‘찬양하다’는 의미를 지나치게 좁힐 수 있어 피했습니다.
- source_word: עֻזֶּךָ
  english_pob_choice: your strength
  chosen_korean: 주님의 힘
  alternatives_korean:
  - 주님의 능력
  - 주님의 힘
  lexicon: HALOT
  rationale: 하나님의 զոր함을 가리키는 עֹז는 ‘힘/능력’ 범위가 있으나, 시적 병행에서 더 직접적이고 간명한 ‘힘’을 택했습니다.
- source_word: וַאֲרַנֵּן
  english_pob_choice: I will sing aloud
  chosen_korean: 높이 노래하겠습니다
  alternatives_korean:
  - 기쁘게 소리 내어 노래하겠습니다
  - 환호하며 노래하겠습니다
  lexicon: HALOT
  rationale: רנן의 ‘기쁨에 찬 큰 소리’ 성격을 살리면서도, 한국어에서 시편적 평행법과 잘 어울리는 표현으로 옮겼습니다.
- source_word: חַסְדֶּךָ
  english_pob_choice: your steadfast love
  chosen_korean: 변함없는 사랑
  alternatives_korean:
  - 인애
  - 한결같은 사랑
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 핵심인 신실하고 언약적인 사랑을 드러내되, 현대 독자가 바로 이해할 수 있는 표현으로 ‘변함없는 사랑’을 택했습니다.
- source_word: מִשְׂגָּב
  english_pob_choice: a stronghold
  chosen_korean: 견고한 요새
  alternatives_korean:
  - 견고한 요새
  - 높은 피난처
  - 보루
  lexicon: HALOT
  rationale: 보호의 높이와 견고함을 함께 드러내는 이미지이므로, ‘stronghold’의 방어적 뉘앙스를 살려 ‘견고한 요새’로 옮겼습니다.
- source_word: וּמָנוֹס
  english_pob_choice: and a refuge
  chosen_korean: 피난처
  alternatives_korean:
  - 도피처
  - 피난처
  - 숨을 곳
  lexicon: HALOT
  rationale: מָנוֹס는 위험에서 달아나 들어가는 안전한 장소이므로, 한국어 성경에서 익숙하면서도 의미를 잘 살리는 ‘피난처’를 사용했습니다.
theological_decisions:
- issue: חֶסֶד의 한국어 신학 용어 선택
  chosen_reading: ‘변함없는 사랑’
  alternative_readings:
  - 인애
  - 한결같은 사랑
  - 언약적 사랑
  - 자비
  rationale: 이 절은 구원의 경험을 근거로 하나님의 חסד를 찬양하므로, 신학적 핵심인 신실한 사랑을 드러내되 고어적이거나 의미가 좁은 표현은 피했습니다.
  doctrine_reference: 시편 번역 일관성 원칙; חסד 렌더링 일관성
- issue: 시적 평행에서 두 번째 동사의 강도
  chosen_reading: ‘높이 노래하겠습니다’
  alternative_readings:
  - 소리 높여 노래하겠습니다
  - 기쁘게 외치겠습니다
  rationale: 원문 רנן은 단순한 노래보다 환희의 외침을 포함할 수 있으므로, ‘높이 노래하다’로 음악성과 환호성을 함께 유지했습니다.
  doctrine_reference: 시적 어조 보존 원칙
