lexical_decisions:
- source_word: κρίσιν
  chosen: judgment
  alternatives:
  - justice
  - a legal case
  - sentence
  lexicon: LSJ
  rationale: The surviving clause is fragmentary and begins mid-thought; κρίσιν most naturally denotes 'judgment' or 'justice.' 'Judgment' preserves the formal sense without over-interpreting the exact legal nuance.
- source_word: ἐκδικήσεις
  chosen: avenge
  alternatives:
  - vindicate
  - exact justice for
  lexicon: LSJ
  rationale: The verb carries the sense of obtaining justice or avenging wrong. 'Avenge' fits the direct object 'our brothers' naturally in English and preserves the force of retaliation/justice in context.
- source_word: τοὺς ἀδελφοὺς ἡμῶν
  chosen: our brothers
  alternatives:
  - our kindred
  - our brothers and companions
  lexicon: LSJ
  rationale: ἀδελφοί is rendered gender-accurately as 'brothers' per project philosophy. In this military-political context it refers to fellow Jews/comrades, but the literal familial term should be preserved.
- source_word: εὐδοκοῦμεν
  chosen: We are pleased
  alternatives:
  - we are willing
  - we approve
  - we are content
  lexicon: LSJ
  rationale: The verb expresses favorable disposition or willingness. 'We are pleased' stays close to the Greek while still making sense with the infinitive 'to serve.'
- source_word: δουλεύειν
  chosen: to serve
  alternatives:
  - to be slaves to
  - to be subject to
  lexicon: LSJ
  rationale: Although δουλεύω can denote slavery/bonded service, here it describes political allegiance to a king. The bonded nature is not foregrounded, so 'serve' is the best contextual rendering under the project's doulos policy.
- source_word: τῷ πατρί σου
  chosen: your father
  lexicon: LSJ
  rationale: Straightforward dative object after δουλεύειν; no reason to expand beyond the literal phrase.
- source_word: πορεύεσθαι
  chosen: to walk
  alternatives:
  - to conduct ourselves
  - to go
  lexicon: LSJ
  rationale: In combination with τοῖς ... λεγομένοις, the idiom means to live or proceed in accordance with commands. 'Walk' preserves the metaphor and biblical register without becoming archaic.
- source_word: τοῖς ὑπʼ αὐτοῦ λεγομένοις
  chosen: according to what is spoken by him
  alternatives:
  - according to what he says
  - according to his commands
  lexicon: LSJ
  rationale: Literally 'the things said by him.' 'According to what is spoken by him' is somewhat formal but transparent to the Greek. 'His commands' is interpretive and stronger than the wording itself.
