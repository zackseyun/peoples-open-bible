translation:
  language: en
  text: '1. Therefore, my children, do not focus on the beauty of women or fill your minds with what they do. Instead, live with sincere, undivided hearts and in fear of the Lord. Work hard at doing good, learning, and caring for your flocks until the Lord gives you the wife he chooses for you, so that you may not suffer as I did.


    2. Until my father died, I did not have the courage to look him in the face.[a]


    3. The disgrace of my sin continually ate away at my mind.


    4. For seven months I was so sick that I nearly died. Then I reoriented[e] before the Lord with firm resolve, and the spirit of jealousy left me.[b] Ever since then, I have remained on guard and have not sinned.


    5. Therefore, my children, I tell you: obey everything I command you, and you will certainly not sin.


    6. Sexual immorality is a pit for the soul. It separates the soul from God and draws it near to idols. It leads both mind and understanding astray and brings young men down to Hades before their time.


    7. Sexual immorality has destroyed many people. Whether a man is old or noble, rich or poor, he brings disgrace on himself before others and becomes a stumbling block to Beliar.[c]


    8. You have heard how Joseph guarded himself from a woman. He cleansed his thoughts of every kind of sexual immorality and found favor with God and people.


    9. The Egyptian woman tried many things against him. She called in magicians and brought him potions.[d] But Joseph guarded himself from every evil desire and refused to consent inwardly to wicked lust.


    10. Therefore, the God of your fathers rescued him from every hidden evil and from death.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The source text here is damaged or compressed, but it indicates that Reuben's sin left him unable to face his father confidently until his father's death.
    reason: textual_variant
  - marker: b
    text: The source layer is compressed here, so the wording cautiously follows the transmitted account of seven months of sickness and the departure of the spirit of jealousy.
    reason: textual_variant
  - marker: c
    text: “A stumbling block to Beliar” is a difficult Greek phrase preserved without resolving its uncertain meaning; it may express a harmful relation to Beliar, but the precise sense is unclear.
    reason: lexical_alternative
  - marker: d
    text: The word translated “potions” can also mean drugs or magical preparations; the mention of magicians supports this wording.
    reason: lexical_alternative
  - marker: e
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
