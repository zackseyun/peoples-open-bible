translation:
  language: en
  text: Before he came, John had publicly announced to all the people of Israel a baptism of reorientation toward God[r1].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “a baptism for repentance.”
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: John had proclaimed
  simplified_phrase: John had publicly announced
  preserved_meaning: John openly heralded his message to the people.
  reasoning_layer_used: POB lexical decision for προκηρύξαντος
  rationale: “Publicly announced” makes the heralding sense clear in common English.
- pob_phrase: before his coming
  simplified_phrase: Before he came
  preserved_meaning: John’s proclamation happened before the arrival of the Savior already identified in context.
  reasoning_layer_used: POB lexical and theological decisions for πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  rationale: The finite clause is easier to read while keeping the contextual pronoun.
translation_notes:
