  source_fidelity: 원문의 계보 관계는 지사가 시피의 아들이며, 이어 알론·여다야·시므리·스마야로 거슬러 올라갑니다. 초안은 이 관계의 한국어 어순이 역전되어, 표면상 시사가 지사의 아들인 것처럼 읽힙니다. 또한 שִׁפְעִי(Shiphi)를 ‘시사’로 옮긴 것은 원어 자음·모음 및 영어 감사본과 부합하지 않습니다.
  naturalness: 한국어의 소유·계보 연쇄는 가장 이른 조상을 먼저 두고 ‘…의 아들’을 반복한 뒤 최종 인명을 제시하는 방식이 자연스럽습니다. 종결 표현 ‘입니다’를 유지하여 요청된 현대 합쇼체를 충족했습니다.
  terminology: 인명은 음역했습니다. אַלּוֹן은 ‘앨론’보다 히브리어 발음과 한국어 표기에 가까운 ‘알론’으로, שִׁפְעִי는 영어 POB의 Shiphi 및 히브리어에 맞추어 ‘시피’로 정정했습니다. ‘지사’는 초안의 Ziza 대응 표기를 유지했습니다.
