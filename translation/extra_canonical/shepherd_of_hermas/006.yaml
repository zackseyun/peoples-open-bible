theological_decisions:
- issue: Referent of ‘the writing’ (ἡ γραφή)
  chosen_reading: Render as ‘the writing’ (the specific text shown to Hermas), not ‘the Scripture’.
  alternative_readings:
  - Translate generically as ‘Scripture’
  rationale: Narrative context in Visions points to a revealed document within the vision, not the canonical
    Scriptures broadly.
- issue: Address to Hermas’s ‘wife who will be your sister’
  chosen_reading: Maintain literal phrasing to preserve early Christian notion of spiritual kinship within
    the household.
  alternative_readings:
  - Paraphrase as ‘your wife, who will become a fellow believer’
  rationale: Preserve wife and future sister and the source’s third-person mercy promise; do not insert
    an explanation of their future relationship.
- issue: Oath formulas ‘by his glory’ and ‘by his Son’
  chosen_reading: Render literally as oath formulae, preserving the distinction between ‘the Master’ and
    ‘the Lord’ and the striking ‘by his Son’.
  alternative_readings:
  - Paraphrase as ‘solemnly declared’
  - Avoid ‘by his Son’ due to doctrinal concerns
  rationale: The text’s theological boldness is part of its force. Differentiating δεσπότης (Master) and
    κύριος (Lord) follows lexical nuance and project’s title policy.
  doctrine_reference: Doctrine.md §Contested terms (Kyrios → Lord)
- issue: ‘Will not deny their life’ (οὐκ ἀρνήσονται τὴν ζωὴν αὐτῶν)
  chosen_reading: Keep literal wording to preserve ambiguity (life as earthly life or the true Life in
    God).
  alternative_readings:
  - Interpret ‘life’ as ‘the Lord’ and translate ‘will not deny the Lord’
  - Interpret as ‘will not renounce their faith’
  rationale: Immediate context shifts to denying the Lord, but the phrase here is different; preserving
    literalness avoids over‑harmonizing.
  doctrine_reference: Translation Philosophy §Preserve theological tension
- issue: Contextual repentance reassessment
  chosen_reading: Retain whole-hearted repentance and removal of double-mindedness, the appointed-day/no-salvation
    warning, righteous/holy-ones/nations limits, the negative life clause, and prior-deniers mercy without
    imposing a different framework.
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
