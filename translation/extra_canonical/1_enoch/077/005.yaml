theological_decisions:
- issue: Whether 'Great Sea' should be treated as a title-like geographic name or a generic large sea
  chosen_reading: Great Sea
  alternative_readings:
  - great sea
  rationale: In ancient Jewish geographical usage, 'the Great Sea' commonly functions as a recognizable designation for the Mediterranean. The astronomical-geographical context supports retaining that specificity while staying close to the Ge'ez wording.
  doctrine_reference: 'Translation philosophy: preserve source-text plain sense and document ambiguity rather than flattening it.'
