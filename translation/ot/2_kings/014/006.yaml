  to: 'But he did not put the killers’ sons to death, in keeping with Yahweh’s command written in the Book of the Law of Moses[a]: “Fathers must not be put to death for their sons’ sins, nor sons for their fathers’ sins; each person is to be put to death only for their own sin.”'
