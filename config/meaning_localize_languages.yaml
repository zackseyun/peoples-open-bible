# Language rules for tools/pob_meaning_localize.py (meaning-first POB in other languages).
# Terms follow each language's existing POB records, so readers see no change of
# vocabulary from the meaning pass itself.
es:
  name: Spanish
  dir: translation_es
  variant: neutral Latin American Spanish
  rules: |
    # Spanish
    - Variant: neutral Latin American Spanish, readable across churches. Use Spanish punctuation (¿?, ¡!) and «» for quotations.
    - The divine name YHWH is "Yahvé" in the main text. Where a New Testament text quotes a YHWH passage with Kyrios, use "Señor".
    - Christos as a title is "Mesías"; name constructions are "Jesucristo" and "Cristo Jesús". Theos is "Dios".
    - Doulos is "siervo" in the main text.
    - "Know" for sexual union is "conocer" ("Adán conoció a Eva, su esposa").
    - Psalm 23 keeps "Él restaura mi alma", "sendas de justicia", and "valle de sombra de muerte".
pt:
  name: Portuguese
  dir: translation_pt
  variant: modern international Portuguese with Brazilian readability
  rules: |
    # Portuguese
    - Variant: modern international Portuguese, readable in Brazil first. Use “ ” for quotations.
    - The divine name YHWH is "Yahweh" in the main text. Where a New Testament text quotes a YHWH passage with Kyrios, use "Senhor".
    - Christos as a title is "Messias"; name constructions are "Jesus Cristo" and "Cristo Jesus". Theos is "Deus".
    - Doulos is "servo" in the main text.
    - "Know" for sexual union is "conhecer" ("Adão conheceu Eva, sua mulher").
    - Psalm 23 keeps "restaura a minha alma", "veredas da justiça", and "vale da sombra da morte".
ko:
  name: Korean
  dir: translation_ko
  variant: Standard Korean, modern formal-polite 합쇼체
  rules: |
    # Korean
    - Variant: Standard Korean in the formal-polite 합쇼체 used throughout the current Korean POB. Use 「」 for quotations, as the current text does.
    - The divine name YHWH is "야훼" in the main text. Where a New Testament text quotes a YHWH passage with Kyrios, use "주".
    - Christos as a title is "메시아"; name constructions are "예수 그리스도" and "그리스도 예수". Theos is "하나님".
    - Doulos is "종" in the main text.
    - "Know" for sexual union keeps the verb 알다 ("아담이 그의 아내 하와를 알았고").
    - Psalm 23 keeps the soul (영혼), the paths of righteousness (의의 길), and the image of the valley of the shadow of death (traditionally 사망의 음침한 골짜기).
zh_hans:
  name: Mandarin Chinese
  dir: translation_zh_hans
  variant: Modern Standard Mandarin in Simplified Chinese
  rules: |
    # Mandarin Chinese (Simplified)
    - Variant: Modern Standard Mandarin in Simplified characters, with full-width punctuation and “ ” for quotations.
    - The divine name YHWH is "雅威" in the main text. Where a New Testament text quotes a YHWH passage with Kyrios, use "主".
    - Christos as a title is "弥赛亚"; name constructions are "耶稣基督" and "基督耶稣". Theos is "上帝".
    - Doulos is "仆人" in the main text.
    - "Know" for sexual union keeps the verb 认识 ("亚当认识了他的妻子夏娃"); do not use 同房 or similar. Add a short note only if a reader would otherwise miss the meaning.
    - Psalm 23 keeps the soul (灵魂), the paths of righteousness (义路), and the valley of the shadow of death (死荫的幽谷).
fr:
  name: French
  dir: translation_fr
  variant: modern international French
  rules: |
    # French
    - Variant: modern international French. Use « » with the usual French spacing for quotations, and French spacing before : ; ! ?.
    - The divine name YHWH is "Yahvé" in the main text (not "Yahweh", not "l'Éternel"). Where a New Testament text quotes a YHWH passage with Kyrios, use "Seigneur".
    - Christos as a title is "Messie"; name constructions are "Jésus-Christ" and "Christ Jésus". Theos is "Dieu".
    - Doulos is "serviteur" in the main text.
    - "Know" for sexual union is "connaître" ("Adam connut Ève, sa femme").
    - Psalm 23 keeps "il restaure mon âme", "les sentiers de la justice", and "la vallée de l'ombre de la mort".
