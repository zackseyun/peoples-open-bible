translation:
  text: So they sent for Jeremiah, brought him out of the courtyard of the guard, and entrusted him to Gedaliah son of Ahikam, son of Shaphan, to take him home[a]. Jeremiah then lived among the people.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'to take him to Gedaliah’s house.' The Hebrew says 'to the house,' without identifying whose.
    reason: alternative_reading
