id: PSA.102.3
reference: Psalms 102:3
source:
  edition: WLC
  text: כִּֽי כָל֣וּ בְ/עָשָׁ֣ן יָמָ֑/י וְ֝/עַצְמוֹתַ֗/י כְּ/מוֹ קֵ֥ד נִחָֽרוּ־־׃
translation:
  text: For my days vanish like smoke, and my bones are scorched like burning wood[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The rare Hebrew noun is uncertain; other possible renderings include 'a hearth' or 'a brazier.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  lexicon: HALOT
  rationale: Introduces the reason or ground for the lament. 'For' fits English poetic style and preserves the causal connection without over-explicating it.
- source_word: כָלוּ
  chosen: vanish
  alternatives:
  - are consumed
  - come to an end
  - waste away
  lexicon: HALOT
  rationale: The verb conveys being finished, consumed, or spent. With 'days' and the image of smoke, 'vanish' best captures the fleeting, dissipating sense in natural English while remaining close to the Hebrew imagery.
- source_word: בְעָשָׁן
  chosen: like smoke
  alternatives:
  - in smoke
  - as smoke
  lexicon: HALOT
  rationale: 'Although the preposition is literally ''in,'' the phrase is idiomatic with the verb and contextually comparative: the days disappear as smoke dissipates. ''Like smoke'' communicates the simile clearly in English poetry.'
- source_word: יָמַי
  chosen: my days
  lexicon: HALOT
  rationale: A straightforward rendering of the construct with first-person suffix, preserving the psalmist's personal lament.
- source_word: וְעַצְמוֹתַי
  chosen: and my bones
  lexicon: HALOT
  rationale: Literal rendering preserves the bodily imagery of suffering. 'Bones' in Hebrew poetry often expresses deep physical and emotional affliction.
- source_word: כְּמוֹ
  chosen: like
  alternatives:
  - as
  lexicon: HALOT
  rationale: Standard comparative particle; 'like' is the most natural English equivalent here.
- source_word: קֵד
  chosen: a hearth
  alternatives:
  - a firebrand
  - an oven
  - a brazier
  lexicon: HALOT
  rationale: The noun's precise referent is uncertain; "hearth" is a viable broad rendering, with alternatives retained in the note.
- source_word: נִחָרוּ
  chosen: are scorched
  alternatives:
  - are scorched
  - glow with heat
  - are charred
  lexicon: HALOT
  rationale: This naturally conveys the passive/resultant condition of the bones and the heat imagery.
