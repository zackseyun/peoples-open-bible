id: PSA.18.38
reference: Psalms 18:38
source:
  edition: WLC
  text: אֶ֭מְחָצֵ/ם וְ/לֹא יֻ֣כְלוּ ק֑וּם יִ֝פְּל֗וּ תַּ֣חַת רַגְלָֽ/י־׃
translation:
  text: I crushed them, and they could not rise; they fell beneath my feet.
  philosophy: dynamic
lexical_decisions:
- source_word: אֶמְחָצֵם
  chosen: I crushed them
  alternatives:
  - I shatter them
  - I wound them
  - I strike them down
  lexicon: HALOT
  rationale: The lexical sense of forceful crushing is retained, with past tense appropriate to the completed victory account.
- source_word: וְלֹא
  chosen: and ... not
  alternatives:
  - but not
  rationale: 'Simple conjunction plus negation. In English the conjunction is absorbed into the clause structure: ''and they cannot rise.'''
- source_word: יֻכְלוּ
  chosen: they cannot
  alternatives:
  - they are not able to
  lexicon: HALOT
  rationale: From יכל, denoting ability. 'Cannot' is the most natural concise rendering in modern English.
- source_word: קוּם
  chosen: rise
  alternatives:
  - stand
  - get up
  lexicon: HALOT
  rationale: Infinitive complement after יכל. 'Rise' preserves the image of being unable to get back up after being crushed; 'stand' is possible but less direct here.
- source_word: יִפְּלוּ
  chosen: they fell
  alternatives:
  - they collapse
  - they are fallen
  lexicon: HALOT
  rationale: Past tense continues the completed battle narration.
- source_word: תחת רגלי
  chosen: beneath my feet
  alternatives:
  - under my feet
  - at my feet
  lexicon: HALOT
  rationale: Literal spatial expression. 'Beneath my feet' is idiomatic, poetic, and preserves the image of total defeat.
- source_word: וְלֹא יֻכְלוּ קוּם
  chosen: and they could not rise
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Past tense coheres with the account while retaining the enemies’ inability to get up.
