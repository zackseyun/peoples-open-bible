  from: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
  to: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds for human beings[a].
  rationale: “Children of man” is unnecessarily source-shaped and unnatural here. The phrase בני אדם refers collectively to human beings, and the preposition identifies those for whom or toward whom the deeds are displayed. “For human beings” is natural while retaining the concrete collective reference better than the more abstract “humanity.” The obsolete divine-name note must be removed.
