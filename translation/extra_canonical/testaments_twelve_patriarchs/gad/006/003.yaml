source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '3. Ἀγαπήσατε¹⁷ ἀλλήλους ἀπὸ καρδίας, καὶ ἐάν τις¹⁸ *ἁμαρτήσει εἰς σέ¹⁹, [α-text] εἰπὲ αὐτῷ εἰρήνην²⁰, καὶ ἐν τῇ ψυχῇ σου μὴ κρατήσῃς δόλον· καὶ ἐὰν μετανοήσας ὁμολογήσῃ²¹, ἄφες αὐτῷ²². [β, Α, S¹] εἰπὲ αὐτῷ *ἐν εἰρήνῃ²³, ἐξορίσας τὸν ἰὸν τοῦ μίσους, καὶ²⁴ ἐν τῇ²⁵ ψυχῇ σου μὴ κρατήσῃς δόλον· καὶ ἐὰν *ὁμολογήσας μετανοήσῃ²⁶ *ἄφες αὐτῷ²⁷.'
  language: Greek
translation:
  text: Love one another from the heart; and if anyone sins against you, speak peace to him, and in your soul hold no deceit; and if he confesses and repents[a], forgive him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims.
    reason: lexical_alternative
