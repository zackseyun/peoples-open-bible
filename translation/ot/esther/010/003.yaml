  from: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
  to: For Mordecai the Jew was second only to King Ahasuerus, great among the Jews and esteemed by many of his fellow Jews[a]. He worked for the good of his people and spoke for the peace and well-being of all his people[b].
  rationale: The lexical record recognizes fellow Jews behind brothers and active pursuit behind seeking good, so those meanings now appear directly in English. I depart from its preference for offspring because the parallel communal clauses favor the wider Jewish kinship group, while retaining descendants as an alternative; no MAINTAINER revision is recorded.
