theological_decisions:
- issue: Interpretation of the metaphors 'what is holy,' 'dogs,' 'pearls,' and 'pigs'
  chosen_reading: Retain the metaphors without interpretive expansion.
  alternative_readings:
  - Explicitly interpret 'what is holy' as sacred teaching or the message of the kingdom
  - Explicitly interpret 'dogs' and 'pigs' as wicked people or those hostile to the gospel
  rationale: The verse uses vivid metaphor but does not itself define each image with precision. To preserve theological tension and avoid importing a narrower doctrinal interpretation than the text states, the translation leaves the imagery intact.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
revisions:
- timestamp: '2026-04-21T03:17:53Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/nt/matthew/007/006.json
  category: awkward_english
  tier: 1
  from: and, turning, tear you to pieces
  to: and turn and tear you to pieces
  rationale: 'The Greek presents two feared outcomes from the pigs: they trample the pearls (καταπατήσουσιν) and they attack you (στραφέντες ῥήξωσιν). The current English rendering (''lest they trample... and, turning, tear...'') is slightly asymmetric in its structure. Using two finite verbs (''lest they trample... and turn and tear...'') creates a more parallel and rhythmic clause that better reflects the sequence of hostile actions.'
