translation:
  language: en
  text: 'Dearly loved friends, I warn you about these things, even though I know you already think this way. Still, I am looking out for you ahead of time, to protect you from wild beasts in human form. Do not welcome such people. If possible, do not even meet with them. Just pray that they may repent[a]. That is difficult, but Jesus Christ, our true life, has power even over this difficulty.


    If our Lord did these things only in appearance, then my imprisonment is also only an appearance. Why, then, have I handed myself over to death—to fire, the sword, and wild beasts? Yet when I am close to the sword, I am close to God; when I am among wild beasts, I am with God. May it only be in the name of Jesus Christ, so that we may suffer together with him. I can endure everything because he himself gives me strength. He is the perfect human being.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in these appeals to reconciliation and ecclesial unity; keep distinct return expressions and the authors own claims about the bishop.
    reason: lexical_alternative
