  from: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
  to: For the third time he said to them, “Why? What evil has this man done? I have found no grounds for sentencing him to death. So I will punish him and then release him.”
  rationale: The prior lexical and theological decisions rightly avoided specifying flogging where the verb itself does not specify the penalty. That restraint is retained, while “punish” and “sentencing him to death” make the established punitive and judicial meanings clearer.
