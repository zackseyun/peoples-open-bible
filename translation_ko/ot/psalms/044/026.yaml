revisions:
- from: 우리의 영혼이 티끌에까지 내려앉았고, 우리의 배는 땅에 달라붙어 있습니다.[a][b]
  to: 일어나셔서 우리를 도우시고,[a] 주의 한결같은 사랑을 위하여 우리를 속량해 주십시오.[b][c]
  rationale: 제시된 초안은 인접 절을 번역한 것으로 보이므로, 의미를 보존한 부분 수정으로는 해결할 수 없습니다. WLC 본문의 명령형 ‘일어나소서’와 ‘속량하소서’, 도움의 명사 표현, 그리고 ‘주의 חסד를 위하여’라는 근거를 반영하여 완전 교체했습니다. ‘주의’를 사용해 하나님께 드리는 합쇼체 기도의 존대와 문체적 자연스러움을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:07:11Z'
