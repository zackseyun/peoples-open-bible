  lexicon: HALOT
  rationale: ‘기억’과 강조어 הֵמָּה의 뉘앙스를 살리기 위해 ‘마저’로 소멸의 최종성을 강조했습니다.
theological_decisions:
- issue: 시의 첫 행을 서술문으로 읽을지, 직접 호칭으로 읽을지
  chosen_reading: 서술문으로 읽어 ‘원수’의 최종 심판을 선언했습니다.
  alternative_readings:
