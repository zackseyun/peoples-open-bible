lexical_decisions:
- source_word: κατήρξατο
  chosen: he began
  alternatives:
  - he set about
  - he commenced
  lexicon: LSJ
  rationale: Aorist middle of κατάρχομαι here functions idiomatically as 'began' or 'set about.' In context it introduces the onset of violent action rather than merely a formal commencement.
- source_word: χειρῶν ἀδίκων
  chosen: to strike with unjust hands
  alternatives:
  - to lay violent hands
  - with lawless hands
  lexicon: LSJ
  rationale: The genitive phrase is elliptical after κατήρξατο and denotes violent action. 'Strike with unjust hands' keeps the imagery of hands while conveying wrongdoing. 'Lawless hands' is possible, but 'unjust' more directly reflects ἀδίκων.
- source_word: προηγησαμένου
  chosen: taking the lead
  alternatives:
  - going before
  - leading the way
  lexicon: LSJ
  rationale: The genitive absolute indicates that this named individual was the one who went ahead in the action. 'Taking the lead' is idiomatic English for initiating the assault.
- source_word: τινὸς Αὐρανοῦ
  chosen: a certain Auranus
  alternatives:
  - one Auranus
  lexicon: LSJ
  rationale: τινός with a proper name often means 'a certain' or 'one.' The name is transliterated rather than translated, following project policy for personal names.
- source_word: προβεβηκότος τὴν ἡλικίαν
  chosen: advanced in age
  alternatives:
  - well along in years
  - advanced in years
  lexicon: LSJ
  rationale: The participial phrase describes old age or seniority. 'Advanced in age' is natural English and preserves the sense of having progressed far in years.
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  chosen: but no less in ignorance
  alternatives:
  - but equally in ignorance
  - yet not at all less in ignorance
  lexicon: LSJ
  rationale: 'The phrase balances age with lack of understanding: though old, he was not less advanced in ignorance. ''No less in ignorance'' preserves the rhetorical sting and comparative structure.'
