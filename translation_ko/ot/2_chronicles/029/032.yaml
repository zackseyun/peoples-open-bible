    rationale: בָּקָר는 집합적으로 ‘소/가축’을 뜻하지만, 70이라는 마릿수와 함께 한국어에서는 ‘소가 칠십 마리’가 더 자연스럽습니다. ‘소 떼’는 한 무리를 다시 마릿수로 세는 듯한 어색함을 줍니다.
  - severity: low
