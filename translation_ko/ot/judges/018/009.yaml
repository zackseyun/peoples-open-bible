- from: 그들이 말했습니다. “일어나서 그들에게로 올라갑시다. 우리가 그 땅을 보았는데, 보십시오, 매우 좋습니다. 그런데 여러분은 잠자코 있습니다. 가서, 들어가서, 그 땅을 차지하는 데 게으르지 마십시오.”
  to: 그들이 말했습니다. “일어나서 그들을 치러 올라갑시다. 우리가 그 땅을 보았는데, 보십시오, 그 땅은 매우 좋습니다. 그런데도 여러분은 잠자코 있습니다. 가고 들어가 그 땅을 차지하기를 게을리하지 마십시오.”
  rationale: 대상에 대한 ‘대적하여’의 의미를 한국어에서 명확히 하고, 접속 흐름과 마지막 권면의 문장을 현대 표준 한국어 합쇼체로 다듬었습니다. ‘차지하다’와 ‘매우 좋다’ 등 본문의 핵심 어휘와 강도는 유지했습니다.
