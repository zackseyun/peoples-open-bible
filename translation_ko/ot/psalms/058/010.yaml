  rationale: 조리용 그릇의 구체적 이미지를 현대 한국어에서 가장 자연스럽게 드러내는 말로 ‘냄비’를 택했습니다.
- source_word: אָטָד
  english_pob_choice: the thornbush
  chosen_korean: 가시나무
  alternatives_korean:
  - 가시덤불
  - 찔레나무
  - 가시풀
  lexicon: HALOT
  rationale: 불쏘시개가 되는 가시나무의 구체적 이미지를 살리기 위해 일반적이고 직관적인 ‘가시나무’를 사용했습니다.
- source_word: כְּמוֹ חַי / כְּמוֹ חָרוֹן
  english_pob_choice: whether green, or burning
  chosen_korean: 푸르든 타고 있든
  alternatives_korean:
  - 푸르든든 타오르든
  - 살아 있든 불타고 있든
  - 푸르든 혹은 불타든
  lexicon: HALOT
  rationale: POB의 ‘green / burning’ 구분을 따라 식물의 생생함과 연소 상태를 한국어의 대구로 유지했습니다.
- source_word: יִשְׂעָרֶנּוּ
  english_pob_choice: he will sweep them away
  chosen_korean: 그가 그것들을 휩쓸어 버리실 것입니다
  alternatives_korean:
  - 그가 그것을 휩쓸어 버리실 것입니다
  - 그가 그것들을 휩쓸어 가실 것입니다
  - 그가 그것들을 몰아내실 것입니다
  lexicon: HALOT
  rationale: 동사의 ‘휘몰아 쓸어감’이라는 격렬한 움직임을 살리면서, 대상이 복수로 읽히는 문맥을 반영해 ‘그것들을’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 난해 구절의 이미지를 한국어에서 어떻게 처리할지
  chosen_reading: 본문은 악인이 계획을 이루기 전에 갑작스럽게 제거되는 장면을, 가시나무 불로 냄비가 아직 달궈지기도 전의 상황에 비유한 것으로 읽고, 최종 동작은 ‘휩쓸어 버리실 것입니다’로 옮겼습니다.
  alternative_readings:
  - 가시나무를 느끼기 전에
  - 분노 가운데 그것을 휩쓸어 가실 것입니다
  - 그가 그를 휩쓸어 가실 것입니다
  rationale: 히브리어는 매우 난해하므로, 과잉해석 없이 핵심 의미인 ‘갑작스러운 제거’를 드러내되, חָרוֹן을 본문에서 곧바로 ‘분노’로 단정하지 않았습니다.
  doctrine_reference: 번역 철학 §3 — 해석의 긴장을 보존하고 불확실성을 과도하게 해소하지 않음
