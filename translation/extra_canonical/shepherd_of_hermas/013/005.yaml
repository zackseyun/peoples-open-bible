translation:
  text: '“And those whom they were casting away and throwing aside—who are they?” “These are people who have sinned and want to repent[a]. For this reason they were not flung far away outside the tower, because they will be useful for the building, if they repent. Therefore those who are going to repent—if they repent—will be strong in the faith, if they repent now, while the tower is being built. But if the building is completed, they no longer have a place, but will be cast out. But they have only this: to lie beside the tower.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
