id: T12P.BEN.9.2
reference: Testament of Benjamin 9:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πλὴν ἐν μερίδι ὑμῶν γενήσεται *ναὸς Θεοῦ¹⁴, καὶ *ἔσται ὁ ἔσχατος ἔνδοξος¹⁵ *ὑπὲρ τὸν πρῶτον¹⁶, καὶ *συναχθήσονται ἐκεῖ¹⁷ αἱ¹⁸ δώδεκα φυλαί, καὶ πάντα τὰ ἔθνη ἕως οὗ ὁ ὕψιστος ἀποστείλῃ¹⁹ τὸ σωτήριον αὐτοῦ²⁰ ἐν ἐπισκοπῇ μονογενοῦς προφήτου²¹. [3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/002.yaml
  text: Nevertheless, in your allotted portion there will be the temple of God, and the latter will be more glorious than the former; and there the twelve tribes and all the nations will be gathered, until the Most High sends his salvation in the visitation of an only-begotten prophet.
translation:
  language: pt
  text: Contudo, na porção de vocês haverá um templo de Deus, e o último será mais glorioso do que o primeiro. Ali se reunirão as doze tribos e todas as nações, até que o Altíssimo envie a sua salvação na visitação de um profeta unigênito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Visitação” pode indicar uma vinda ou intervenção decisiva. A expressão grega traduzida por “profeta unigênito” também pode ser entendida como “profeta único em seu gênero”.
    reason: Esclarece duas expressões incomuns sem eliminar a ambiguidade lexical e teológica do grego.
lexical_decisions:
- source_word: ἐν μερίδι ὑμῶν
  choice: na porção que lhes coube
  rationale: Expressa de modo natural a ideia de uma parte territorial atribuída, sem acrescentar uma referência específica à tribo ou à herança.
- source_word: ὁ ἔσχατος ... τὸν πρῶτον
  choice: o último ... o primeiro
  rationale: Conserva o contraste temporal do grego e evita substituir 'último' por 'segundo'; o contexto permite entender que se trata do templo.
- source_word: συναχθήσονται
  choice: se reunirão
  rationale: Reproduz o passivo com naturalidade em português e mantém tanto as doze tribos quanto todas as nações como sujeitos.
- source_word: τὸ σωτήριον αὐτοῦ
  choice: a sua salvação
  rationale: Mantém o substantivo grego e sua possível amplitude, em vez de especificar antecipadamente uma pessoa ou um ato particular.
- source_word: ἐν ἐπισκοπῇ
  choice: na visitação
  rationale: Preserva o termo religioso e a ideia de uma vinda ou intervenção decisiva, sem reduzir o sentido a mera supervisão.
- source_word: μονογενοῦς προφήτου
  choice: de um profeta unigênito
  rationale: Mantém a formulação incomum e teologicamente carregada do grego, sem normalizá-la para 'único profeta'.
theological_decisions:
- issue: Referente de 'o último' e 'o primeiro'
  choice: Mantida a expressão substantivada, com o templo como referente contextual.
  alternative: Explicitar 'o último templo' e 'o primeiro templo'.
  rationale: A forma escolhida conserva a concisão e a leve ambiguidade gramatical do original, embora o referente mais provável seja o templo.
- issue: Relação entre 'visitação' e 'profeta unigênito'
  choice: na visitação de um profeta unigênito
  alternative: quando visitar por meio de um profeta unigênito
  rationale: O genitivo grego pode indicar a visitação associada ao próprio profeta; a tradução não impõe uma leitura instrumental que o texto não explicita.
- issue: Identidade do profeta unigênito
  choice: Não identificada nem explicada no texto.
  alternative: Identificá-lo explicitamente com uma figura messiânica específica.
  rationale: A tradução preserva a linguagem da fonte e evita importar uma conclusão confessional não expressa neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide o longo período grego para maior clareza. O trecho entre colchetes iniciado como versículo 3 na fonte fornecida foi excluído por não pertencer à referência solicitada, Testamento de Benjamim 9:2.
