  from: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
  to: They were responsible for the ark, the table, the lampstand, the altars, the vessels of the sanctuary used in ministry, the inner veil[a], and all the service connected with these items.
