  naturalness: 수정문은 현대 표준 한국어의 격식 있는 합쇼체를 사용합니다. ‘기쁨의 기름을 부어 … 기름부으셨습니다’는 다소 반복적으로 들릴 수 있으나, 히브리어의 기름부음 표현과 시적·성경적 어조를 자연스럽게 보존합니다.
