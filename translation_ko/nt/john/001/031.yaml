    rationale: ἐν ὕδατι는 문자적으로는 '물 안에서'일 수 있으나, 한국어의 세례 관용 표현에서는 '물로 세례를 베풀다'가 자연스럽고 원문의 세례 방식 표지를 충분히 전달합니다.
  - severity: low
