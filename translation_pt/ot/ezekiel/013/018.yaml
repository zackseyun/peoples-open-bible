base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/018.yaml
  text: 'And say, ‘Thus says the Lord GOD: Woe to the women who sew magic bands on every wrist and make veils for the head of persons of every height, to hunt souls! Will you hunt the souls of my people and keep your own souls alive?'
translation:
  language: pt
  text: 'E diga: “Assim diz o Senhor DEUS: Ai das mulheres que costuram faixas mágicas em todos os pulsos e fazem véus para a cabeça de pessoas de qualquer altura, a fim de capturar vidas![a] Acaso vocês capturarão a vida do meu povo e farão viver vidas para si mesmas?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “capturar pessoas” ou “caçar almas”. Os objetos e a prática ritual mencionados neste versículo não são conhecidos com certeza.'
    reason: Expõe a amplitude semântica de נפשות e a incerteza histórica sem sobrecarregar o texto principal.
  - marker: b
    text: 'Literalmente: “e fareis viver vidas para vós mesmas?”. Não fica claro se se trata das próprias vidas das mulheres ou de vidas mantidas sob seu poder ou para seu benefício.'
    reason: Preserva a ambiguidade de לָכֶנָה e o valor causativo do verbo hebraico, sem adotar uma interpretação específica.
lexical_decisions:
- source_word: כְּסָתוֹת
  choice: faixas mágicas
  rationale: O objeto exato é incerto; no contexto de práticas rituais condenadas, trata-se provavelmente de peças associadas à magia. “Faixas” comunica um objeto preso aos braços ou pulsos sem sugerir simples almofadas comuns.
- source_word: עַל כָּל אַצִּילֵי יָדַי
  choice: para todos os pulsos
  rationale: A expressão literalmente envolve as articulações dos braços/mãos e é textualmente difícil. “Pulsos” oferece uma referência corporal natural em português e se harmoniza com faixas usadas ritualmente.
- source_word: הַמִּסְפָּחוֹת
  choice: véus
  rationale: O substantivo é raro e seu formato preciso é incerto; o contexto especifica que eram postos sobre a cabeça. “Véus” preserva essa função sem detalhar além da evidência.
- source_word: כָּל קוֹמָה
  choice: pessoas de qualquer altura
  rationale: Literalmente, “toda estatura”. A formulação indica que os véus eram feitos para pessoas de diferentes tamanhos, embora a natureza exata da prática permaneça obscura.
- source_word: נְפָשׁוֹת
  choice: vidas
  rationale: נפש pode significar vida, pessoa ou ser vivente. “Vidas” mantém o jogo entre capturar e conservar vivo melhor do que o uso moderno de “almas”, que poderia impor uma leitura exclusivamente imaterial.
theological_decisions:
- issue: Natureza das práticas das mulheres
  choice: “faixas mágicas” explicita a função ritual sugerida pelo contexto
  alternative: “faixas” ou “almofadas” sem qualificação
  rationale: O capítulo denuncia profecia e práticas enganosas destinadas a capturar vidas. A qualificação evita que o leitor entenda os objetos como acessórios cotidianos, mas uma nota reconhece a incerteza lexical.
- issue: Objeto de “conservar vivas” na pergunta final
  choice: “conservareis vidas para vós mesmas”
  alternative: “conservareis a vossa própria vida”
  rationale: O hebraico diz literalmente “vidas para vós”, não identifica de modo inequívoco essas vidas como as próprias vidas das mulheres. A tradução preserva a ambiguidade teológica e interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais de segunda pessoa do plural para refletir a interpelação direta às mulheres. “Senhor DEUS” segue uma convenção legível para אֲדֹנָי יְהוִה. A pontuação mantém a declaração profética e a pergunta acusatória.
