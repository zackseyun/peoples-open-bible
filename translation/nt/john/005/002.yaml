id: JHN.5.2
reference: John 5:2
source:
  edition: SBLGNT
  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
translation:
  text: In Jerusalem, by the Sheep Gate, there is a pool called Bethesda[a] in Hebrew[b], with five covered walkways.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Some manuscripts read “Bethzatha” or “Bethsaida” instead of “Bethesda.”
    reason: textual_variant
  - marker: b
    text: Or, “in Aramaic”; John’s expression can refer to the local Semitic language rather than Hebrew strictly distinguished from Aramaic.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστιν δὲ
  chosen: There is
  alternatives:
  - Now there was
  - And there is
  - Now there is
  lexicon: BDAG
  rationale: 'Present tense ἔστιν is best retained as ''there is.'' δέ is lightly connective; ''Now'' gives natural discourse transition without overstating contrast. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: ἐν τοῖς Ἱεροσολύμοις
  chosen: in Jerusalem
  alternatives:
  - in Jerusalem city
  lexicon: BDAG
  rationale: Although Ἱεροσόλυμα is morphologically plural, standard English idiom uses the singular place name 'Jerusalem.'
- source_word: ἐπὶ τῇ προβατικῇ
  chosen: by the Sheep Gate
  alternatives:
  - at the Sheep Pool
  - by the sheep market
  - near the sheep gate
  lexicon: BDAG
  rationale: The phrase is elliptical. προβατική can mean 'sheep-place' and likely refers to the Sheep Gate/area known from Jerusalem topography. Because κολυμβήθρα follows as the subject ('a pool'), rendering ἐπὶ τῇ προβατικῇ as 'by the Sheep Gate' avoids the awkward and less likely sense 'a pool at the pool.' The supplied noun 'Gate' is interpretive but widely judged contextually appropriate.
- source_word: κολυμβήθρα
  chosen: a pool
  alternatives:
  - a reservoir
  - a bathing pool
  lexicon: BDAG
  rationale: Standard term for a pool; 'pool' is the clearest natural English equivalent.
- source_word: ἡ ἐπιλεγομένη
  chosen: called
  alternatives:
  - which is called
  - named
  lexicon: BDAG
  rationale: The participle introduces the pool's name. 'Called' is concise and natural in English while preserving the sense.
- source_word: Ἑβραϊστὶ
  chosen: in Hebrew
  alternatives:
  - in Aramaic
  - in the Hebrew language
  lexicon: BDAG
  rationale: John's Ἑβραϊστί conventionally refers to the local Semitic language, often Aramaic, but the text says 'Hebrew.' Per source-language primacy, the main text keeps 'in Hebrew,' while the likely linguistic nuance is preserved in a footnote.
- source_word: Βηθεσδά
  chosen: Bethesda
  alternatives:
  - Bethzatha
  - Bethsaida
  lexicon: NA28/SBLGNT textual tradition
  rationale: Given the provided SBLGNT source text reads Βηθεσδά, the translation follows it as 'Bethesda.' Other well-known textual forms are preserved in a footnote as variants.
- source_word: πέντε στοὰς ἔχουσα
  chosen: having five porticoes
  alternatives:
  - with five colonnades
  - having five covered walkways
  lexicon: BDAG
  rationale: στοά denotes a covered colonnade/portico. 'Porticoes' is accurate and readable; 'having' preserves the participial construction.
