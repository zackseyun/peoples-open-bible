  alternative_readings:
  - among the sons of Israel
  rationale: 'The covenant lawsuit setting and the function of the song in the surrounding context favor an adversative sense: the song testifies against Israel. This is an interpretive decision, so the more literal spatial rendering is preserved in a footnote.'
