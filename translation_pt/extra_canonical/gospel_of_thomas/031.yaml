base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/031.yaml
  text: Jesus said[1], "No prophet is acceptable in his village[3][2]; a physician does not heal those who know him."
translation:
  language: pt
  text: 'Jesus disse: “Nenhum profeta é aceito em sua aldeia;[a] um médico não cura aqueles que o conhecem”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O fragmento grego P.Oxy. 1 traz “em sua terra natal” (πατρίδι), em vez do copta “em sua aldeia” (ϯⲙⲉ). Compare Lucas 4:24.
    reason: variante textual e referência cruzada
  - marker: b
    text: O fragmento grego P.Oxy. 1 diz “realiza curas para aqueles que o conhecem”, expressão um pouco mais ampla que o copta “cura aqueles que o conhecem”.
    reason: variante textual
lexical_decisions:
- source_word: ⲙⲛⲡⲣⲟⲫⲏⲧⲏⲥ
  choice: Nenhum profeta
  rationale: A construção existencial negativa com o substantivo expressa uma negação universal; esta formulação é natural e concisa em português.
- source_word: ϣⲱⲡ / ϣⲏⲡ
  choice: é aceito
  rationale: O qualitativo do verbo ‘receber, aceitar’ indica o estado de ser aceito e corresponde ao grego δεκτός no testemunho de P.Oxy. 1.
- source_word: ϯⲙⲉ
  choice: aldeia
  rationale: Traduz diretamente o termo copta para aldeia ou povoado, sem harmonizá-lo com o grego πατρίδι, ‘terra natal’.
- source_word: ⲙⲉⲣⲉⲥⲟⲓⲛ / ⲙⲁⲣⲉⲥⲟⲉⲓⲛ
  choice: um médico não
  rationale: ⲥⲟⲓⲛ é a forma regional de ‘médico’, e o prefixo é o aoristo negativo que enuncia uma verdade geral.
- source_word: ⲣⲑⲉⲣⲁⲡⲉⲩⲉ
  choice: cura
  rationale: O empréstimo grego θεραπεύειν significa aqui ‘curar’.
- source_word: ⲛⲡⲉⲧⲉⲣⲉⲥⲟⲟⲩⲛ ⲛⲛⲧⲟϥ
  choice: aqueles que o conhecem
  rationale: Reproduz o referente humano plural e o pronome masculino singular sem acrescentar a ideia de parentesco ou familiaridade.
theological_decisions:
- issue: Harmonização com os paralelos canônicos e com o fragmento grego
  choice: aldeia
  alternative: terra natal / cidade natal
  rationale: O texto copta traz explicitamente ϯⲙⲉ, ‘aldeia’; preservar essa leitura evita substituir a forma copta pela redação dos paralelos.
- issue: Relação entre as duas máximas
  choice: duas orações coordenadas por ponto e vírgula
  alternative: introduzir ‘e’ ou ‘também’
  rationale: O copta justapõe as afirmações. O ponto e vírgula preserva a relação aberta entre elas sem explicá-la teologicamente.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe proverbial concisa. ‘Aldeia’ mantém a especificidade do copta; ‘médico’ e ‘cura’ são termos correntes e precisos. Os marcadores de todas as notas aparecem no texto principal.
