  rationale: 완료형 자기 맹세를 보존하고, 심판의 첫 결과를 대상적 의미가 드러나는 ‘경악거리’로 조정했습니다. 네 항목의 병렬 구조와 미래 심판, 보스라에 속한 모든 성읍의 영속적 폐허라는 의미는 유지했습니다. 영어 POB의 이전 편집 선택만 언급하는 비본문 주석은 삭제했습니다.
