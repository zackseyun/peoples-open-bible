  from: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
  to: The Horites formerly lived in Seir, but the descendants of Esau dispossessed them, destroyed them, and settled in their place, just as Israel did in the land Yahweh gave them as a possession.)
