  from: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
  to: He returned to the disciples and found them asleep. He said to Peter, “So, could none of you keep watch with me for one hour?”
  rationale: The earlier notes recognize both the plural address and the vigilance carried by 'keep watch.' I make those meanings explicit rather than preserving an English 'you' that could be read as addressing Peter alone.
