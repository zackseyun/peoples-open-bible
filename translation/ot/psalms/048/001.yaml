id: PSA.48.1
reference: Psalms 48:1
source:
  edition: WLC
  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד בְּ/עִ֥יר אֱ֝לֹהֵ֗י/נוּ הַר קָדְשֽׁ/וֹ־׃
translation:
  text: Great is Yahweh and greatly to be praised in the city of our God, on his holy mountain.
  philosophy: dynamic
lexical_decisions:
- source_word: גָּדוֹל
  chosen: Great
  alternatives:
  - greatly exalted
  - mighty
  lexicon: HALOT
  rationale: Predicate adjective opening the verse; 'Great is the LORD' preserves the Hebrew word order and the evaluative sense without overinterpreting it as power alone.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: וּמְהֻלָּל
  chosen: and greatly to be praised
  alternatives:
  - and highly praised
  - and worthy of much praise
  lexicon: HALOT
  rationale: Passive participle from הלל with waw conjunction. In English, 'to be praised' naturally conveys the predicative force ('praiseworthy' / 'deserving praise') while staying close to the Hebrew.
- source_word: מְאֹד
  chosen: greatly
  alternatives:
  - very
  - exceedingly
  lexicon: HALOT
  rationale: Adverb intensifying the praise clause. 'Greatly' fits idiomatic English with 'to be praised' better than the more wooden 'very.'
- source_word: בְּעִיר
  chosen: in the city
  alternatives:
  - within the city
  - at the city
  lexicon: HALOT
  rationale: The preposition ב marks location. 'In the city' is the most natural locative rendering.
- source_word: אֱלֹהֵינוּ
  chosen: of our God
  alternatives:
  - belonging to our God
  lexicon: HALOT
  rationale: 'Construct relationship with ''city'': ''the city of our God.'' This preserves the covenantal possessive force.'
- source_word: הַר קָדְשׁוֹ
  chosen: his holy mountain
  alternatives:
  - the mountain of his holiness
  - his sacred hill
  lexicon: HALOT
  rationale: Appositional phrase further identifying 'the city of our God' as Zion. 'Holy mountain' is the standard, clear rendering; 'hill' would be possible in some contexts but is less direct here.
