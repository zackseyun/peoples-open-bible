  to: 그녀는 그의 옷을 자기 곁에 놓아 두고, 그의 주인이 집으로 돌아올 때까지 그대로 두었습니다.
  rationale: 원문의 ‘두다/남겨 두다’와 ‘~할 때까지’를 보존하면서, 초안의 중복적이고 모호한 종결 표현을 직접적인 지속 상태의 표현으로 고쳤습니다. ‘집으로 돌아올 때까지’는 영어 POB의 ‘came home’ 및 문맥상 주인의 귀가를 자연스럽게 반영합니다.
