    57. 양들은 제 종류대로 새끼를 낳았고, 표식이 있는 것은 모두 야곱에게 속하였으며, 표식이 없는 것은 모두 라반에게 속하였습니다.

    58. 야곱의 소유가 크게 불어났고, 그는 소 떼와 양 떼와 나귀와 낙타를 얻었습니다.

    59. 또 나귀들과 남종들과 여종들도 있었습니다. 라반과 그의 아들들은 야곱을 시기했고, 라반은 자기 양 떼를 모았습니다.

    60. 그에게서 나와 악한 뜻으로 속임수를 썼습니다.

    61. 라헬이 요셉을 낳은 뒤에, 라반은 멀리 떨어져 있었기 때문에 자기 양의 털을 깎으러 갔습니다.

    62. 그는 그에게서 사흘 길 떨어져 있었습니다. 그리고 야곱은 라반이 양의 털을 깎으러 간 것을 보았습니다.

    63. 그의 양 떼에게로 야곱은 레아와 라헬을 불러, 그들의 마음에 대고 말하여 그들이 함께 오도록 하였습니다.

    64. 그와 함께 가나안 땅으로 갔습니다. 이는 그가 꿈에서 본 모든 것과 그에게 말해진 모든 것을 그들에게 말했기 때문입니다.'
