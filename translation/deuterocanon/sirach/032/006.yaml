translation:
  text: Like a beryl seal set in fine gold[a], so is the sound of a psalm with the sweetness of new wine.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “an emerald seal set in fine gold”; the ancient gemstone’s exact identity is uncertain.
