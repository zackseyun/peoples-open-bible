id: JOB.16.22
reference: Job 16:22
source:
  edition: WLC
  text: כִּֽי שְׁנ֣וֹת מִסְפָּ֣ר יֶאֱתָ֑יוּ וְ/אֹ֖רַח לֹא אָשׁ֣וּב אֶהֱלֹֽךְ־־׃
translation:
  text: For a few years will pass, and I will go on the path from which I will not return.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Indeed
  - For when
  lexicon: HALOT
  rationale: Introduces the reason or ground for Job's preceding statement. 'For' best preserves the causal connection in natural English.
- source_word: שְׁנוֹת מִסְפָּר
  chosen: a few years
  alternatives:
  - numbered years
  - years of number
  lexicon: HALOT
  rationale: The construct phrase literally means 'years of number,' an idiom for years that are few or limited in count. 'A few years' communicates the sense idiomatically in modern English while preserving the emphasis on brevity.
- source_word: יֶאֱתָיוּ
  chosen: will pass
  alternatives:
  - will arrive
  - are coming
  lexicon: HALOT
  rationale: Although literally “will come,” English normally expresses the advance of a span of years as years passing; the footnote preserves the literal Hebrew image.
- source_word: וְאֹרַח
  chosen: and ... the path
  alternatives:
  - and ... the way
  - even the path
  lexicon: HALOT
  rationale: אֹרַח denotes a path or way. Here it is metaphorical for the course toward death. 'Path' preserves the concrete metaphor better than the more abstract 'way.' The conjunction is carried into the clause structure rather than translated woodenly.
- source_word: לֹא אָשׁוּב
  chosen: from which I will not return
  alternatives:
  - I will not return
  - never to return
  lexicon: HALOT
  rationale: The negated verb means 'I will not return.' In English, attaching it to 'path' with 'from which' makes the syntax natural while preserving the Hebrew sense of an irreversible journey.
- source_word: אֶהֱלֹךְ
  chosen: I will go
  alternatives:
  - I go
  - I must go
  lexicon: HALOT
  rationale: Simple Qal imperfect of הלך, 'to go/walk.' In context it expresses Job's impending movement toward death. 'I will go' is sufficiently formal and clear.
