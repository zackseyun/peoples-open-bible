source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Ὁ θρέψας με πέπρακέν με Ῥόδῃ τινὶ εἰς Ῥώμην. μετὰ πολλὰ ἔτη ταύτην ἀνεγνωρισάμην καὶ ἠρξάμην αὐτὴν
    ἀγαπᾶν ὡς ἀδελφήν. 2. μετὰ χρόνον τινὰ λουομένην εἰς τὸν ποταμὸν τὸν Τίβεριν εἶδον, καὶ ἐπέδωκα αὐτῇ
    τὴν χεῖρα καὶ ἐξήγαγον αὐτὴν ἐκ τοῦ ποταμοῦ. ταύτης οὖν ἰδὼν τὸ κάλλος διελογιζόμην ἐν τῇ καρδίᾳ μου
    λέγων· Μακάριος ἤμην εἰ τοιαύτην γυναῖκα εἶχον καὶ τῷ κάλλει καὶ τῷ τρόπῳ. μόνον τοῦτο ἐβουλευσάμην,
    ἕτερον δὲ οὐδὲ ἕν. 3. μετὰ χρόνον τινὰ πορευομένου μου εἰς Κώμας καὶ δοξάζοντος τὰς κτίσεις τοῦ Θεοῦ,
    ὡς μεγάλαι καὶ ἐκπρεπεῖς καὶ δυναταί εἰσιν, περιπατῶν ἀφύπνωσα. καὶ πνεῦμά με ἔλαβεν καὶ ἀπήνεγκέ
    με δι᾿ ἀνοδίας τινός, δι᾿ ἧς ἄνθρωπος οὐκ ἐδύνατο ὁδεῦσαι· ἦν δὲ ὁ τόπος κρημνώδης καὶ ἀπερρηγὼς ἀπὸ
    τῶν ὑδάτων. διαβὰς οὖν τὸν ποταμὸν ἐκεῖνον ἦλθον εἰς τὰ ὁμαλά, καὶ τιθῶ τὰ γόνατα καὶ ἠρξάμην προσεύχεσθαι
    τῷ Κυρίῳ καὶ ἐξομολογεῖσθαί μου τὰς ἁμαρτίας. 4. προσευχομένου δέ μου ἠνοίγη ὁ οὐρανός, καὶ βλέπω
    τὴν γυναῖκα ἐκείνην ἣν ἐπεθύμησα ἀσπαζομένην με ἐκ τοῦ οὐρανοῦ, λέγουσαν· Ἑρμᾶ, χαῖρε. 5. βλέψας δὲ
    εἰς αὐτὴν λέγω αὐτῇ· Κυρία, τί σὺ ὧδε ποιεῖς; ἡ δὲ ἀπεκρίθη μοι· Ἀνελήφθην ἵνα σου τὰς ἁμαρτίας ἐλέγξω
    πρὸς τὸν Κύριον. 6. λέγω αὐτῇ· Νῦν σύ μου ἔλεγχος εἶ; Οὔ, φησίν, ἀλλὰ ἄκουσον τὰ ῥήματα ἅ σοι μέλλω
    λέγειν. ὁ Θεὸς ὁ ἐν τοῖς οὐρανοῖς κατοικῶν καὶ κτίσας ἐκ τοῦ μὴ ὄντος τὰ ὄντα καὶ πληθύνας καὶ αὐξήσας
    ἕνεκεν τῆς ἁγίας ἐκκλησίας αὐτοῦ ὀργίζεταί σοι ὅτι ἥμαρτες εἰς ἐμέ. 7. ἀποκριθεὶς αὐτῇ λέγω· Εἰς σὲ
    ἥμαρτον; ποίῳ τρόπῳ; ἢ πότε σοι αἰσχρὸν ῥῆμα ἐλάλησα; οὐ πάντοτέ σε ὡς θεὰν ἡγησάμην; οὐ πάντοτέ σε
    ἐνετράπην ὡς ἀδελφήν; τί μου καταψεύδῃ, ὦ γύναι, τὰ πονηρὰ ταῦτα καὶ ἀκάθαρτα; 8. γελάσασά μοι λέγει·
    Ἐπὶ τὴν καρδίαν σου ἀνέβη ἡ ἐπιθυμία τῆς πονηρίας. ἢ οὐ δοκεῖ σοι ἀνδρὶ δικαίῳ πονηρὸν πρᾶγμα εἶναι
    ἐὰν ἀναβῇ αὐτοῦ ἐπὶ τὴν καρδίαν ἡ πονηρὰ ἐπιθυμία; ἁμαρτία γέ ἐστιν, καὶ μεγάλη, φησίν. ὁ γὰρ δίκαιος
    ἀνὴρ δίκαια βουλεύεται. ἐν τῷ οὖν δίκαια βουλεύεσθαι αὐτὸν κατορθοῦται ἡ δόξα αὐτοῦ ἐν τοῖς οὐρανοῖς
    καὶ εὐκατάλλακτον ἔχει τὸν Κύριον ἐν παντὶ πράγματι αὐτοῦ· οἱ δὲ πονηρὰ βουλευόμενοι ἐν ταῖς καρδίαις
    αὐτῶν θάνατον καὶ αἰχμαλωσίαν ἑαυτοῖς ἐπισπῶνται, μάλιστα οἱ τὸν αἰῶνα τοῦτον περιποιούμενοι καὶ γαυριῶντες
    ἐν τῷ πλούτῳ αὐτῶν καὶ μὴ ἀντεχόμενοι τῶν ἀγαθῶν τῶν μελλόντων. 9. μετανοήσουσιν αἱ ψυχαὶ αὐτῶν, οἵτινες
    οὐκ ἔχουσιν ἐλπίδα, ἀλλὰ ἑαυτοὺς ἀπηγνώκασι καὶ τὴν ζωὴν αὐτῶν. ἀλλὰ σὺ προσεύχου πρὸς τὸν Θεόν, καὶ
    ἰάσεται τὰ ἁμαρτήματά σου καὶ ὅλου τοῦ οἴκου σου καὶ πάντων τῶν ἁγίων.
