  from: And the Chaldeans who are fighting against this city will come and set this city on fire and burn it[a], along with the houses on whose rooftops they burned incense to Baal and poured out drink offerings to other gods, to provoke me to anger.
  to: And the Chaldeans who are attacking this city will enter it, set it on fire, and burn it down, along with the houses on whose rooftops the people burned incense to Baal and poured out drink offerings to other gods, provoking me to anger.
  rationale: The lexical record supports the destructive fire sequence, rooftop worship, and personal divine anger. I retained those meanings while making the change of human subject explicit, avoiding the misleading impression that the attacking Chaldeans performed the rooftop worship.
