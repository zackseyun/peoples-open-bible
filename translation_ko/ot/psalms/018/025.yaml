  text: With the faithful you show yourself faithful[a]; with the blameless man you show yourself blameless.
  footnotes:
  - marker: a
    text: Or 'With the loyal/godly one you show yourself loyal'; the Hebrew uses cognate terms from the same root (חסד), emphasizing reciprocal covenant loyalty.
