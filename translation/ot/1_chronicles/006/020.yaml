  text: בֶּן ציף בֶּן אֶלְקָנָ֔ה בֶּן מַ֖חַת בֶּן עֲמָשָֽׂי־־־־׃
translation:
  text: son of Zuph[a], son of Elkanah, son of Mahath, son of Amasai,
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The traditional Hebrew reading is Zuph; the written text has Ziph.
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן
  chosen: the son of
  alternatives:
  - son of
  lexicon: HALOT
  rationale: In a genealogy, בֶּן marks direct descent. Rendering it as 'the son of' preserves the repetitive genealogical structure of the Hebrew while producing natural English in a list context.
- source_word: ציף
  chosen: Ziph
  rationale: Proper personal name; transliterated according to the project's policy to transliterate names rather than translate them.
- source_word: אֶלְקָנָה
  chosen: Elkanah
  rationale: Proper personal name; standard English transliteration retained.
- source_word: מַחַת
  chosen: Mahath
  rationale: Proper personal name; transliterated rather than translated.
- source_word: עֲמָשָׂי
  chosen: Amasai
  rationale: Proper personal name; transliterated by standard convention.
