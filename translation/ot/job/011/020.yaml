id: JOB.11.20
reference: Job 11:20
source:
  edition: WLC
  text: וְ/עֵינֵ֥י רְשָׁעִ֗ים תִּ֫כְלֶ֥ינָה וּ֭/מָנוֹס אָבַ֣ד מִנְ/הֶ֑ם וְ֝/תִקְוָתָ֗/ם מַֽפַּח נָֽפֶשׁ־׃פ
translation:
  text: But the eyes of the wicked will fail with waiting; they will have no escape, and their only hope will be to breathe their last[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “their hope will end in a dying breath.” The Hebrew phrase means “the breathing out of life.”
    reason: alternative_reading
lexical_decisions:
- source_word: עֵינֵי
  chosen: the eyes of
  alternatives:
  - eyes
  lexicon: HALOT
  rationale: Literal rendering of the construct plural 'eyes of.' In context it functions idiomatically with the following verb to express failing expectation or exhausted looking, but retaining 'eyes' preserves the Hebrew imagery.
- source_word: רְשָׁעִים
  chosen: the wicked
  alternatives:
  - wicked people
  - the guilty
  lexicon: HALOT
  rationale: Standard rendering for the plural adjective/substantive referring to morally evil persons. 'The wicked' is concise and idiomatic in English.
- source_word: תִּכְלֶינָה
  chosen: will fail
  alternatives:
  - will waste away
  - will come to an end
  - will be exhausted
  lexicon: HALOT
  rationale: From כלה, here with 'eyes' as subject. 'Will fail' best captures the idiom of eyes growing dim/exhausted in expectation without over-paraphrasing.
- source_word: מָנוֹס
  chosen: all escape will be lost to them
  alternatives:
  - refuge
  - flight
  lexicon: HALOT
  rationale: The noun denotes flight or a means of escape. This expresses that no avenue of escape remains, more naturally than saying that refuge or escape “perishes” from them.
- source_word: אָבַד
  chosen: will perish
  alternatives:
  - has perished
  - will vanish
  - is lost
  lexicon: HALOT
  rationale: Although morphologically a qatal form, in this poetic context it participates in the future-oriented description alongside the surrounding imperfects. 'Will perish' preserves the force and parallelism in English.
- source_word: מִנְהֶם
  chosen: from them
  alternatives:
  - for them
  lexicon: HALOT
  rationale: The preposition מן is best rendered 'from,' indicating that any possibility of escape is removed from the wicked.
- source_word: תִקְוָתָם
  chosen: their hope
  alternatives:
  - their expectation
  lexicon: HALOT
  rationale: '''Hope'' is the most natural and common rendering, while still allowing the sense of expectation in context.'
- source_word: מַפַּח נָפֶשׁ
  chosen: a last breath
  alternatives:
  - the breathing out of life
  - an expiring breath
  - despair
  lexicon: HALOT
  rationale: This is idiomatic English for the likely sense while preserving the Hebrew phrase's concrete image of life being breathed out.
