  from: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
  to: 'Then these Levites stepped forward: from the Kohathites, Mahath son of Amasai and Joel son of Azariah; from the descendants of Merari, Kish son of Abdi and Azariah son of Jehallelel; from the Gershonites, Joah son of Zimmah and Eden son of Joah;'
  rationale: The lexical rationale reads 'arose' as the beginning of action in response to the king, which supports 'stepped forward.' The earlier notes establish family membership as the meaning of the genealogical formulas; I put that meaning in the text, retain every name, and leave the list open for verses 13–14.
