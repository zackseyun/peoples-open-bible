source:
  edition: WLC
  text: כִּ֤י מַה תִּקְוַ֣ת חָ֭נֵף כִּ֣י יִבְצָ֑ע כִּ֤י יֵ֖שֶׁל אֱל֣וֹהַּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/008.yaml
  text: For what is the hope of the godless when God cuts him off[c][b][a], when God takes away his life?
  footnotes:
  - marker: a
    text: Or 'the hypocrite.' The Hebrew term can denote one who is irreverent, godless, or hypocritical.
    reason: lexical_alternative
  - marker: b
    text: The clause is difficult; alternatively, 'when he gains' or 'though he has gained.'
    reason: alternative_reading
  - marker: c
    text: Or 'draws out his soul/life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 경건하지 않은 자[a]가 이익을 얻는다 해도[b], 하나님께서 그의 생명을 거두실 때[c] 그에게 무슨 소망이 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위선자’. 히브리어는 불경한 자, 경건하지 않은 자, 또는 위선자를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 동사는 난해합니다. 또는 ‘그가 이익을 얻을 때’ 또는 ‘그의 이익이 끊길 때’로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그의 생명(혼)을 끌어내실 때’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְוַת
  english_pob_choice: hope
  chosen_korean: 소망
  alternatives_korean:
  - 희망
  - 기대
  lexicon: HALOT
  rationale: 예언적·지혜문맥에서 장차 기대하는 바를 가리키므로, 현대 합쇼체에서는 ‘소망’이 가장 자연스럽고 엄숙합니다.
- source_word: חָנֵף
  english_pob_choice: the godless
  chosen_korean: 악한 자
  alternatives_korean:
  - 경건하지 않은 자
  - 위선자
  - 불경한 자
  lexicon: HALOT
  rationale: 이 단어는 단순한 종교적 위선보다 하나님을 경외하지 않는 인물을 폭넓게 가리킬 수 있으므로, 문맥상 기능을 살려 ‘악한 자’로 옮겼습니다.
- source_word: יִבְצָע
  english_pob_choice: he cuts off gain
  chosen_korean: 그가 이익을 얻을 때
  alternatives_korean:
  - 그가 이익을 끊을 때
  - 그의 이익이 끊길 때
  - 그가 벌어들일 때
  lexicon: HALOT
  rationale: 히브리어 동사는 여기서 의미가 난해하므로, 영어 POB가 보존한 ‘이익’ 계열의 해석을 따라 문맥상 대비되는 순간을 한국어로 드러냈습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his life
  chosen_korean: 그의 생명
  alternatives_korean:
  - 그의 목숨
  - 그의 혼
  - 그의 영혼
  lexicon: HALOT
  rationale: 여기서는 האדם의 존재 전체가 죽음으로 제거되는 뜻이므로, 교리적 함의를 좁히지 않는 ‘생명’이 가장 직접적입니다.
theological_decisions:
- issue: נֶפֶשׁ의 인류학적 의미
  chosen_reading: ‘생명’으로 번역해, 본문이 말하는 죽음의 제거를 그대로 드러냈습니다.
  alternative_readings:
  - 혼
  - 영혼
  rationale: 본문은 인간 구성요소에 대한 형이상학적 진술보다, 하나님이 악인의 생명을 거두시는 심판을 말합니다. 따라서 신학적 세부를 과도하게 확정하지 않았습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 교리적 세부는 본문 밖에서 다룹니다.
