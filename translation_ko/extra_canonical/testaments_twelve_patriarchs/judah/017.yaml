  source_fidelity: 개정이 필요합니다. 초안은 1–2절의 큰 뜻은 대체로 반영하지만, 원문에 있는 3–5절이 빠져 있어 본문 범위(Testament of Judah 17)를 충족하지 못합니다. 또한 εἰς ἀπώλειαν πορνείας를 ‘음행의 파멸’로 옮긴 표현은 한국어에서 무엇이 파멸하는지 불명료합니다. ‘음행으로 말미암는 파멸’은 원문의 파멸과 음행의 연결을 유지하면서 자연스럽습니다.
  naturalness: ‘가나안 여자 베수에에게 유혹되어 빗나갔기 때문입니다’는 조사 결합이 어색하고, 금과 아름다움이 미혹의 원인이라는 문장 구조도 다소 흐려집니다. ‘금과 아름다움 때문에 가나안 여인 베수에에게로 잘못 이끌렸습니다’로 다듬었습니다. ‘그들은’은 선행사가 ‘이 두 가지’이므로 ‘그것들은’으로 바로잡았습니다.
  terminology: ἀργύριον은 ‘은’, πορνεία는 ‘음행’, βασιλεία/βασίλειον은 문맥에 따라 ‘왕국’으로 유지했습니다. ἀλλοιώσουσι의 타락·변질 의미는 ‘타락시킬 것’으로, σμικρυνθῆναι ποιήσουσιν은 ‘작아지게 할 것’으로 옮겼습니다. 원문에 없는 주석 내용은 추가하지 않았고, 초안의 근거 없는 [a][b] 표지는 제거했습니다.
