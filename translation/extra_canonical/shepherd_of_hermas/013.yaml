id: HERM.V.3.v
reference: Shepherd of Hermas — Vision 3, section v
unit: section
book: Shepherd of Hermas
source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Ἄκουε νῦν περὶ τῶν λίθων τῶν ὑπαγόντων εἰς τὴν οἰκοδομήν. οἱ μὲν οὖν λίθοι οἱ τετράγωνοι καὶ λευκοὶ καὶ συμφωνοῦντες ταῖς ἁρμογαῖς αὐτῶν, οὗτοί εἰσιν οἱ ἀπόστολοι καὶ ἐπίσκοποι καὶ διδάσκαλοι καὶ διάκονοι οἱ πορευθέντες κατὰ τὴν σεμνότητα τοῦ Θεοῦ καὶ ἐπισκοπήσαντες καὶ διδάξαντες καὶ διακονήσαντες ἁγνῶς καὶ σεμνῶς τοῖς ἐκλεκτοῖς τοῦ Θεοῦ, οἱ μὲν κεκοιμημένοι, οἱ δὲ ἔτι ὄντες· καὶ πάντοτε ἑαυτοῖς συμφωνήσαντες καὶ ἐν ἑαυτοῖς εἰρήνην ἔσχον καὶ ἀλλήλων ἤκουον· διὰ τοῦτο ἐν τῇ οἰκοδομῇ τοῦ πύργου συμφωνοῦσιν αἱ ἁρμογαὶ αὐτῶν. 2. Οἱ δὲ ἐκ τοῦ βυθοῦ ἑλκόμενοι καὶ ἐπιτιθέμενοι εἰς τὴν οἰκοδομὴν καὶ συμφωνοῦντες ταῖς ἁρμογαῖς αὐτῶν μετὰ τῶν ἑτέρων λίθων τῶν ἤδη ᾠκοδομημένων τίνες εἰσίν; Οὗτοί εἰσιν οἱ παθόντες ἕνεκεν τοῦ ὀνόματος τοῦ Κυρίου. 3. Τοὺς δὲ ἑτέρους λίθους τοὺς φερομένους ἀπὸ τῆς ξηρᾶς θέλω γνῶναι τίνες εἰσίν, κυρία. ἔφη· Τοὺς μὲν εἰς τὴν οἰκοδομὴν ὑπάγοντας καὶ μὴ λατομουμένους, τούτους ὁ Κύριος ἐδοκίμασεν, ὅτι ἐπορεύθησαν ἐν τῇ εὐθύτητι τοῦ Κυρίου καὶ κατωρθώσαντο τὰς ἐντολὰς αὐτοῦ. 4. Οἱ δὲ ἀγόμενοι καὶ τιθέμενοι εἰς τὴν οἰκοδομὴν τίνες εἰσίν; Νέοι εἰσὶν ἐν τῇ πίστει καὶ πιστοί. νουθετοῦνται δὲ ὑπὸ τῶν ἀγγέλων εἰς τὸ ἀγαθοποιεῖν, διότι εὑρέθη ἐν αὐτοῖς πονηρία. 5. Οὓς δὲ ἀπέβαλλον καὶ ἔριττον, τίνες εἰσίν; Οὗτοί εἰσιν ἡμαρτηκότες καὶ θέλοντες μετανοῆσαι· διὰ τοῦτο μακρὰν οὐκ ἀπερίφησαν ἔξω τοῦ πύργου, ὅτι εὔχρηστοι ἔσονται εἰς τὴν οἰκοδομήν, ἐὰν μετανοήσωσιν. οἱ οὖν μέλλοντες μετανοεῖν, ἐὰν μετανοήσωσιν, ἰσχυροὶ ἔσονται ἐν τῇ πίστει, ἐὰν νῦν μετανοήσωσιν ἐν ᾧ οἰκοδομεῖται ὁ πύργος. ἐὰν δὲ τελεσθῇ ἡ οἰκοδομή, οὐκέτι ἔχουσιν τόπον, ἀλλʼ ἔσονται ἔκβολοι. μόνον δὲ τοῦτο ἔχουσιν, παρὰ τῷ πύργῳ κεῖσθαι.
  language: Greek
  pages:
  - 323
  unit_id: V.3.v
  label: Vision 3, section v
  sequence: 13
translation:
  text: '“Listen now about the stones that go into the building. The stones, then, that are square and white and that fit together at their joints [a]—these are the apostles and bishops [b] and teachers and deacons [c], who walked in the reverent dignity of God [d] and who oversaw and taught and served God’s elect with purity and reverence [e]—some have fallen asleep [f], and some are still alive. They were always in agreement with one another, had peace among themselves, and listened to each other; for this reason their joints fit in the building of the tower.


    “And the ones drawn up from the deep [g] and set into the building and fitting together at their joints with the other stones already built—who are they?” “These are the ones who suffered on account of the name of the Lord [h].”


    “I want to know who the other stones are that are being carried from the dry land [i], lady.” She said, “Those that go into the building without being hewn [j]—the Lord approved these, because they walked in the uprightness of the Lord [k] and accomplished his commandments [l].”


    “And the ones being brought and set into the building—who are they?” “They are new in the faith and faithful [m]. But they are being admonished [n] by the angels to do good, because evil was found in them.”


    “And those whom they were casting away and throwing aside [o]—who are they?” “These are people who have sinned and want to repent[t] [p]. For this reason they were not flung far away outside the tower, because they will be useful for the building [q], if they repent. Therefore those who are going to repent—if they repent—will be strong in the faith, if they repent now, while the tower is being built. But if the building is completed, they no longer have a place, but will be cast out [r]. But they have only this: to lie beside the tower [s].”'
  footnotes:
  - marker: t
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
