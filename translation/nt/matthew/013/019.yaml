  from: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
  to: When anyone hears the message about the kingdom and does not understand it, the evil one comes and snatches away what has been sown in his heart. This is the person represented by the seed sown beside the path[a].
