theological_decisions:
- issue: Rendering διψυχία as a vice rather than generic doubt
  chosen_reading: Translate as “double‑mindedness,” retain personification (“daughter of the devil”) and
    vice language.
  alternative_readings:
  - Render as ‘doubt’ or ‘uncertainty’
  rationale: Hermas distinguishes the act of doubting (διστάζειν) from the entrenched disposition (διψυχία);
    preserving the vice term maintains the moral instruction’s texture.
- issue: Translation of δοῦλοι τοῦ θεοῦ
  chosen_reading: servants of God
  alternative_readings:
  - slaves of God
  rationale: Current DOCTRINE.md reader-facing servant rule governs; the bonded-status and allegiance
    nuance is explicit in note g.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy1; Contested terms doulos'
- issue: ζήσῃ τῷ θεῷ dative nuance
  chosen_reading: “live to God”
  alternative_readings:
  - live for God
  rationale: Retains early‑Christian idiom and directional dative, avoiding modern smoothing.
- issue: πληροφορέω in petition context
  chosen_reading: “bring the request of your soul to completion/fulfill”
  alternative_readings:
  - assure the request of your soul
  rationale: Context addresses God’s action in granting petitions, not interior assurance alone.
- issue: πειρασμός rendered as ‘testing’ not ‘temptation’
  chosen_reading: “testing”
  alternative_readings:
  - temptation
  - trial
  rationale: Testing is retained provisionally with trial/temptation alternatives. No educational purpose
    is asserted by the selected clause.
- issue: Contextual repentance reassessment
  chosen_reading: Exact reader wording is recorded in config/terminology/repentance-contextual-2026-10-13.json#translation/extra_canonical/shepherd_of_hermas/036.yaml
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
