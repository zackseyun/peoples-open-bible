  source_fidelity: The draft preserves the sequence of actions, both occurrences of ἐνιαυτόν ('for a year'), the military sense of δυνάμεις, and the broad scope of πᾶσαν χρείαν. However, ὀψώνια in this military context is more idiomatically and precisely rendered as '급료' than '삯.'
