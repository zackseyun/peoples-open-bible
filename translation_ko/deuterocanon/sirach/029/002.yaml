  text: Lend to your neighbor in his time of need, and in turn repay your neighbor on time.
translation:
  language: ko
  text: 이웃이 필요할 때 그에게 빌려 주십시오. 그리고 정해진 때에 그 이웃에게 다시 갚으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δάνεισον
  english_pob_choice: Lend
  chosen_korean: 빌려주십시오
  alternatives_korean:
  - 빌려주시오
  - 대여하십시오
  - 꾸어주십시오
  lexicon: δανείζω
  rationale: 현재형 명령으로서 ‘빌려주다’가 가장 자연스럽고, 도움의 의미도 함께 살릴 수 있습니다.
- source_word: τῷ πλησίον
  english_pob_choice: your neighbor
  chosen_korean: 이웃에게
  alternatives_korean:
  - 가까운 사람에게
  - 이웃 사람에게
  lexicon: πλησίον
  rationale: 특정 종교 용어화보다 본래의 ‘가까운 사람/이웃’ 의미를 직접 드러내는 표현이 적절합니다.
- source_word: ἐν καιρῷ χρείας αὐτοῦ
  english_pob_choice: in his time of need
  chosen_korean: 필요할 때에
  alternatives_korean:
  - 그의 궁핍한 때에
  - 필요한 때에
  lexicon: καιρός, χρεία
  rationale: χρεία의 핵심인 ‘필요/궁핍’을 간결하게 반영하되, 수식이 과도하지 않게 ‘필요할 때에’로 옮겼습니다.
- source_word: ἀπόδος
  english_pob_choice: repay
  chosen_korean: 갚으십시오
  alternatives_korean:
  - 돌려주십시오
  - 상환하십시오
  lexicon: ἀποδίδωμι
  rationale: 금전적 빚을 전제로 한 상환을 한국어로 가장 자연스럽게 드러내는 동사입니다.
theological_decisions:
- issue: ὁ πλησίον의 윤리적 범위
  chosen_reading: ‘이웃’은 단순한 혈연·동네 범주가 아니라 도움을 필요로 하는 상대를 향한 책임 윤리를 드러냅니다.
  alternative_readings:
  - 일반적인 친근한 사람
  - 가까운 사람
  rationale: 지혜문학 맥락에서 상호부조의 윤리적 요구를 약화시키지 않기 위해, 넓은 의미의 이웃 책임으로 이해했습니다.
  doctrine_reference: 지혜문학의 이웃 사랑/상호 책임 윤리
- issue: καὶ πάλιν ἀπόδος … εἰς τὸν καιρόν의 시간성
  chosen_reading: ‘때가 되면 … 제때’로 옮겨, 단순한 ‘언젠가’가 아니라 정해진 시점에 맞춘 상환 의무를 살렸습니다.
  alternative_readings:
  - 정해진 때에
  - 마땅한 때에
  rationale: 영어 POB의 ‘on time’을 따르되, 헬라어의 καιρός를 반영하여 시간 준수의 의무성을 강조했습니다.
  doctrine_reference: 청지기적 정직성과 약속 이행
