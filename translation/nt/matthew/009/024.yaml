  from: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
  to: He was saying[a], “Go away, for the girl is not dead, but is sleeping.” And they were laughing at him.
  rationale: While 'has not died' accurately reflects the aorist verb as an event, English idiomatically uses the adjective 'dead' to describe the state that contrasts with 'sleeping'. 'Is not dead' is more natural and avoids the slight implication that she simply hasn't died *yet*. Although ἔλεγεν is imperfect, it is frequently used as a standard narrative past tense for speech introductions in the Gospels. 'He said' is more natural in English narrative flow, though 'He was saying' is defensible if the goal is to emphasize repeated action to the crowd.
