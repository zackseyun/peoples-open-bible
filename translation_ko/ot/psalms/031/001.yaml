  yaml_path: translation/ot/psalms/031/001.yaml
  text: In you, O Yahweh, I have taken refuge; let me never be put to shame. In your righteousness[a] deliver me.
  footnotes:
  - marker: a
    text: Or possibly 'by David' or 'for David'; the Hebrew superscription can indicate authorship, association, or dedication.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼여, 제가 주님께 피하였습니다. 제가 영원히 수치를 당하지 않게 하소서. 주님의 의로[a] 저를 건져 주소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 인도자에게
  - 합창 지휘자에게
  lexicon: HALOT
  rationale: 시편 표제의 ל prefixed 형식을 목적격/수신자 뉘앙스로 살려, 예배·연주를 총괄하는 사람을 가리키는 표현을 간결하게 옮겼습니다. '지휘자'는 전통적이면서도 현대 한국어에서 자연스럽습니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  - 찬가
  lexicon: HALOT
  rationale: מִזְמוֹר는 장르 표지로서 '시'가 가장 간결하고 표제문에 자연스럽습니다. 본문 전체를 가리키는 책명 '시편'보다 개별 작품 표지로서 더 정확합니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에게
  - 다윗을 위한
  - 다윗이 지은
  lexicon: HALOT
  rationale: לְ는 표제에서 저자성, 관련성, 헌정 가능성을 모두 가질 수 있으므로, 단정적인 '다윗이 지은' 대신 관계의 폭을 남기는 속격 표현 '다윗의'로 옮겼습니다.
theological_decisions:
- issue: 다윗 표제의 관계성 보존
  chosen_reading: 저자성만으로 확정하지 않고 관계·헌정의 가능성을 열어 둠
  alternative_readings:
  - 다윗이 지은 시로 확정
  - 다윗을 위한 시로 확정
  rationale: 히브리어 표제는 לְדָוִד의 정확한 관계를 단일하게 고정하지 않으므로, 원문의 해석 여지를 한국어에서도 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
