    τίνες εἰσίν; Αὗται, φησίν, ἅγια πνεύματά εἰσι· καὶ ἄλλως ἄνθρωπος οὐ δύναται εὑρεθῆναι εἰς τὴν βασιλείαν
    τοῦ Θεοῦ, ἐὰν μὴ αὗται αὐτὸν ἐνδύσωσι τὸ ἔνδυμα αὐτῶν· ἐὰν γὰρ τὸ ὄνομα μόνον λάβῃς, τὸ δὲ ἔνδυμα
    παρὰ τούτων μὴ λάβῃς, οὐδὲν ὠφελήσῃ· αὗται γὰρ αἱ παρθένοι δυνάμεις εἰσὶ τοῦ υἱοῦ τοῦ Θεοῦ. ἐὰν [οὖν]
    τὸ ὄνομα φορῇς, τὴν δὲ δύναμιν μὴ φορῇς αὐτοῦ, εἰς μάτην ἔσῃ τὸ ὄνομα αὐτοῦ φορῶν. 3. τοὺς δὲ λίθους,
    φησίν, οὓς εἶδες ἀποβεβλημένους, οὗτοι τὸ μὲν ὄνομα ἐφόρεσαν, τὸν δὲ ἱματισμὸν τῶν παρθένων οὐκ ἐνεδύσαντο.
    Ποῖος, φημί, ἱματισμὸς αὐτῶν ἐστί, κύριε; Αὐτὰ τὰ ὀνόματα, φησίν, ἱματισμός ἐστιν αὐτῶν. ὃς ἂν τὸ
    ὄνομα τοῦ υἱοῦ τοῦ Θεοῦ φορῇ, καὶ τούτων ὀφείλει φορεῖν τὰ ὀνόματα· καὶ γὰρ αὐτὸς ὁ υἱὸς τὰ ὀνόματα
    τῶν παρθένων τούτων φορεῖ. 4. ὅσους, φησί, λίθους εἶδες εἰς τὴν οἰκοδομὴν | τοῦ πύργου εἰσεληλυθότας,
    ἐπιδεδομένους διὰ τῶν χειρῶν αὐτῶν καὶ μείναντας εἰς τὴν οἰκοδομήν, | τούτων τῶν παρθένων τὴν δύναμιν
    ἐνδεδυμένοι εἰσί. 5. διὰ τοῦτο βλέπεις τὸν πύργον μονόλιθον γεγονότα [μετὰ] τῆς πέτρας. οὕτω καὶ οἱ
    πιστεύσαντες τῷ Κυρίῳ διὰ τοῦ υἱοῦ αὐτοῦ καὶ ἐνδιδυσκόμενοι τὰ πνεύματα ταῦτα, ἔσονται εἰς ἓν πνεῦμα,
    καὶ ἓν σῶμα, μία χρόα τῶν ἱματίων αὐτῶν. τῶν τοιούτων δὲ τῶν φορούντων τὰ ὀνόματα τῶν παρθένων ἐστὶν
    ἡ κατοικία εἰς τὸν πύργον. 6. Οἱ οὖν, φημί, κύριε, ἀποβεβλημένοι λίθοι διατί ἀπεβλήθησαν; διῆλθον
    γὰρ διὰ τῆς πύλης, καὶ διὰ τῶν χειρῶν τῶν παρθένων ἐτέθησαν εἰς τὴν οἰκοδομὴν τοῦ πύργου. Ἐπειδὴ πάντα
    σοι, φησί, μέλει, καὶ ἀκριβῶς ἐξετάζεις, ἄκουε περὶ τῶν ἀποβεβλημένων λίθων. 7. οὗτοι, [φησί,] πάντες
    τὸ ὄνομα τοῦ υἱοῦ τοῦ Θεοῦ ἔλαβον, ἔλαβον δὲ καὶ τὴν δύναμιν τῶν παρθένων τούτων. λαβόντες οὖν τὰ
    πνεύματα ταῦτα ἐνεδυναμώθησαν, καὶ ἦσαν μετὰ τῶν δούλων τοῦ Θεοῦ, καὶ ἦν αὐτῶν ἓν πνεῦμα καὶ ἓν σῶμα
    [καὶ ἓν ἔνδυμα]· τὰ γὰρ αὐτὰ ἐφρόνουν καὶ δικαιοσύνην εἰργάζοντο. 8. μετὰ οὖν χρόνον τινὰ ἀνεπείσθησαν
    ὑπὸ τῶν γυναικῶν ὧν εἶδες μέλανα ἱμάτια ἐνδεδυμένων, τοὺς ὤμους ἔξω ἐχουσῶν καὶ τὰς τρίχας λελυμένας
    καὶ εὐμόρφων. ταύτας ἰδόντες ἐπεθύμησαν αὐτῶν, καὶ ἐνεδύσαντο τὴν δύναμιν αὐτῶν, τῶν δὲ παρθένων ἀπεδύσαντο
    τὴν δύναμιν. 9. οὗτοι οὖν ἀπεβλήθησαν ἀπὸ τοῦ οἴκου τοῦ Θεοῦ καὶ ἐκείναις παρεδόθησαν. οἱ δὲ μὴ ἀπατηθέντες
    τῷ κάλλει τῶν γυναικῶν τούτων ἔμειναν ἐν τῷ οἴκῳ τοῦ Θεοῦ. ἔχεις, φησί, τὴν ἐπίλυσιν τῶν ἀποβεβλημένων.
