id: PRO.11.18
reference: Proverbs 11:18
source:
  edition: WLC
  text: רָשָׁ֗ע עֹשֶׂ֥ה פְעֻלַּת שָׁ֑קֶר וְ/זֹרֵ֥עַ צְ֝דָקָ֗ה שֶׂ֣כֶר אֱמֶֽת־׃
translation:
  text: A wicked man earns deceptive wages[a], but one who sows righteousness earns a reliable reward.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “does deceptive work”; the main rendering describes gain that proves unreliable.
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  chosen: a wicked man
  alternatives:
  - the wicked
  - a wicked person
  lexicon: HALOT
  rationale: Singular masculine noun used generically/proverbially. Rendered with gender-accurate 'man' per project philosophy, while preserving the representative sense of the proverb.
- source_word: עֹשֶׂה פְעֻלַּת שָׁקֶר
  chosen: does deceptive work
  alternatives:
  - does a work of falsehood
  - produces deceitful gain
  - works for a deceptive wage
  lexicon: HALOT
  rationale: This follows the clause’s verb-object construction and preserves its broad characterization of the work.
- source_word: שָׁקֶר
  chosen: deceptive
  alternatives:
  - 'false'
  - fraudulent
  - vain
  lexicon: HALOT
  rationale: 'שָׁקֶר often denotes falsehood, deception, or unreliability. ''Deceptive'' fits the proverb''s contrast: the wicked person''s gain appears real but proves false.'
- source_word: וְזֹרֵעַ
  chosen: but one who sows
  alternatives:
  - and one who sows
  - but the one sowing
  lexicon: HALOT
  rationale: The conjunction can be simple 'and,' but in this antithetical proverb the contrastive sense is natural in English. 'One who sows' avoids unnecessary repetition of 'man' while preserving the singular proverbial subject.
- source_word: צְדָקָה
  chosen: righteousness
  alternatives:
  - justice
  - what is right
  lexicon: HALOT
  rationale: Default rendering is 'righteousness.' In Proverbs the term can overlap with justice/right conduct, but 'righteousness' best preserves the moral-theological dimension and aligns with project consistency.
- source_word: שֶׂכֶר אֱמֶת
  chosen: a reliable reward
  alternatives:
  - sure wages
  - a reliable reward
  - faithful wages
  lexicon: HALOT
  rationale: The construct denotes a reward that is true, sure, and dependable.
