translation:
  text: '“The believers from the fifth mountain, which had green plants and was rugged, are like this:
    they are faithful, but hard to teach, stubborn and pleased with themselves. They want to know everything,
    yet know nothing at all.”


    2. “Because of this stubbornness, understanding left them and senseless folly entered them. They praise
    themselves as having understanding and want to set themselves up as teachers, though they are foolish.”


    3. “Because of this pride, many were emptied as they exalted themselves.[a] Stubbornness and empty
    confidence are a great demon. Many of them were therefore rejected. But some repented and believed,
    and submitted themselves to those who have understanding, recognizing their own folly.”


    4. “Repentance is also available to the others who are like this. For they did not become wicked,
    but rather foolish[b] and without understanding. If they repent, they will live to God. But if they
    do not repent, they will dwell with the women who work evil against them.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: “Emptied” keeps the source’s metaphor for the outcome of self-exaltation. “Brought to nothing”
      is an alternative; no object such as wealth or knowledge is supplied in Greek.
  - marker: b
    reason: textual_variant
    text: “Foolish” follows Hilgenfeld’s printed conjecture, with reported Latin Vulgata/Palatina comparison.
      The apparatus says Gebhardt could read the beginning of a wickedness word in damaged Athos text.
      That partial report is not a complete alternative Greek clause or unanimous support for “foolish.”
lexical_decisions:
- source_word: μετάνοια / μετανοεῖν
  chosen: repentance / repent
  alternatives:
  - regret
  - penance
  rationale: 'Reconsideration of the prior lexical rationale: this section connects repentance with pride,
    recognition of one''s own folly, belief, and submission to those with understanding. Preserve its
    conditional contrast between living to God and dwelling with the women who work evil against them.'
- source_word: δυσμαθεῖς / αὐθάδεις / ἐθελοδιδάσκαλοι
  chosen: hard to teach / stubborn / set themselves up as teachers
  alternatives:
  - slow to learn / arrogant / self-appointed teachers
  rationale: 'Reconsideration of the prior lexical decision: ἐθελοδιδάσκαλοι characterizes people who
    want to assume the teaching role themselves, not teachers selected by them. Preserve the rebuke of
    resistant self-confidence without implying an institutional appointment procedure.'
