  from: As for the pillars[a], the height of each pillar was eighteen cubits, and a line of twelve cubits would go around it; its thickness was four fingers, and it was hollow.
  to: Each pillar was eighteen cubits[a] high and twelve cubits in circumference. It was hollow, with walls four fingerbreadths thick.
