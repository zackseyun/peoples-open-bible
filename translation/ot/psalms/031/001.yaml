- issue: Rendering the divine name יְהוָה
  chosen_reading: O Yahweh
  alternative_readings:
  - Yahweh
  - O Yahweh
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Rendering צִדְקָה in relation to God's saving action
  chosen_reading: righteousness
  alternative_readings:
  - justice
  rationale: The verse appeals to God's covenantally right character as the ground for deliverance. 'Righteousness' preserves the lexical connection and theological breadth; 'justice' is a legitimate nuance but narrower here. Since the contested-terms table explicitly concerns Greek δικαιοσύνη rather than Hebrew צִדְקָה, no footnote is required, though the alternative is documented.
