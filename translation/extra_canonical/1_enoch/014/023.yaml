translation:
  text: And the holiest of the holy ones, who draw near to him, do not go far away
    at night or withdraw from him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez repeats holiness language; the expression may also be rendered
      “the most holy ones.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ቅድሳት፡ ቅዱሳን
  chosen: the holiest of the holy ones
  alternatives:
  - the most holy ones
  rationale: Preserves the repeated holiness language rather than reducing it to a
    single adjective.
- source_word: ይቀርቡ፡ ኃቤሁ
  chosen: draw near to him
  alternatives:
  - approach him
  rationale: Retains the spatial imagery of nearness.
- source_word: ኢይርኅቁ፡ ሌሊተ፡ ወኢየአትቱ፡ እምኔሁ
  chosen: do not go far away at night or withdraw from him
  alternatives:
  - do not depart at night or leave him
  rationale: Keeps both negative verbs and the explicit reference to night.
theological_decisions:
- issue: Identity of the holy ones
  chosen_reading: holy ones
  alternative_readings:
  - angels
  rationale: The verse names them as holy ones; identifying them more specifically
    would go beyond its wording.
