  meaning_decisions:
  - source_phrase: βάθος καρδίας ἀνθρώπου οὐχ εὑρήσετε
    prior_rendering: you will not find the depths of a man's heart
    new_rendering: you cannot fathom the depths of a person's heart
    rationale: The rhetorical future expresses inability, and finding the heart’s depths means penetrating its hidden inner life; the statement concerns human beings generally.
  - source_phrase: λόγους τῆς διανοίας αὐτοῦ οὐ διαλήμψεσθε
    prior_rendering: nor will you discern the words of his mind
    new_rendering: or discern their thoughts
    rationale: The phrase refers to inner thoughts or reasonings, not spoken words; the new wording carries that meaning naturally.
  - source_phrase: πῶς τὸν θεὸν ... ἐρευνήσετε
    prior_rendering: how will you search out God
    new_rendering: How then can you fathom God
    rationale: The inquiry seeks understanding of God, not his location, and the repeated 'fathom' makes the comparison with human limitations clear.
  - source_phrase: τὸν λογισμὸν αὐτοῦ
    prior_rendering: his thought
    new_rendering: his purposes
    rationale: In the argument about God’s timing and intended action, the term concerns his designs or purposes, without implying a particular theological account of divine decrees.
  - source_phrase: μηδαμῶς, ἀδελφοί, μὴ παροργίζετε
    prior_rendering: By no means, brothers, provoke
    new_rendering: No, brothers, do not provoke ... to anger
    rationale: The current English can read as a command to provoke God; the explicit prohibition restores the intended force, and 'to anger' conveys the verb’s full sense.
