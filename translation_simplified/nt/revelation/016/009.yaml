translation:
  language: en
  text: The people were scorched by intense heat. They blasphemed the name of God, who has authority over these plagues. But they did not repent[a] so that they would give him glory.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
