id: PRO.11.13
reference: Proverbs 11:13
source:
  edition: WLC
  text: הוֹלֵ֣ךְ רָ֭כִיל מְגַלֶּה סּ֑וֹד וְ/נֶאֱמַן ר֝֗וּחַ מְכַסֶּ֥ה דָבָֽר־־׃
translation:
  text: A gossip reveals a secret, but a trustworthy person keeps a matter confidential.
  philosophy: dynamic
lexical_decisions:
- source_word: הוֹלֵךְ רָכִיל
  chosen: A gossip
  alternatives:
  - One who goes about as a slanderer
  - A talebearer
  - A whisperer
  lexicon: HALOT
  rationale: The idiom literally means 'one walking as a רכיל.' In context it describes a habitual carrier of damaging talk. 'A gossip' is natural modern English and captures the proverb's characterization without woodenly preserving 'walking.' 'Slanderer' is possible, but the parallel with revealing secrets points more broadly to gossiping/tale-bearing than strictly false accusation.
- source_word: מְגַלֶּה
  chosen: reveals
  alternatives:
  - uncovers
  - discloses
  lexicon: HALOT
  rationale: The participle denotes making something known or uncovered. 'Reveals' is idiomatic and fits the object 'secret' well.
- source_word: סּוֹד
  chosen: a secret
  alternatives:
  - confidential matter
  - counsel
  lexicon: HALOT
  rationale: Here the sense is private/confidential information. While סוד can denote intimate counsel or council, the proverb contrasts exposing private information with covering a matter, so 'secret' is the clearest rendering.
- source_word: נֶאֱמַן רוּחַ
  chosen: a trustworthy person
  alternatives:
  - a trustworthy person
  - faithful of spirit
  - reliable in spirit
  lexicon: HALOT
  rationale: The construct describes a reliably discreet person; this is natural English.
- source_word: מְכַסֶּה
  chosen: conceals
  alternatives:
  - covers
  - keeps hidden
  lexicon: HALOT
  rationale: '''Conceals'' communicates the figurative sense of covering over information. ''Covers'' is more literal, but in English can sound opaque without explanation.'
- source_word: דָבָר
  chosen: a matter
  alternatives:
  - a thing
  - an affair
  - a word
  lexicon: HALOT
  rationale: דבר is broad, but in wisdom literature and in this parallelism it refers to a matter/issue/information. 'A matter' is idiomatic and suitably general.
- source_word: מְכַסֶּה דָבָר
  chosen: keeps a matter confidential
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This idiomatically conveys covering a matter in contrast to exposing a secret.
