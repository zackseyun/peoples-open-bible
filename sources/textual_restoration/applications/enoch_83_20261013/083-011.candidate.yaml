translation:
  text: And when I went out below[a] and saw the heaven, and the sun rising in the east, and the moon setting in the west, and a few stars, and the whole earth, and everything as He had known it in the beginning[b], then I blessed the Lord of judgment and extolled Him, because He had brought forth the sun from the windows of the east, and it ascended and rose on the face of the heaven, and set out and followed the path which He showed it.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected main text has 'when' and a spatial term rendered 'below/down'; no geographical setting is specified. Printed page 160 note 38 regards 'when' as a late emendation and proposes an original expression meaning 'thereupon/from there.' This is a report of the printed apparatus, not an independently checked manuscript reading.
    reason: textual_variant
  - marker: b
    text: Charles 1906 printed page 161 note 12 discusses this dagger-marked corrupt clause, comparing knew/saw with proposed made/built readings. The current POB 'known' wording is retained provisionally, not certified as unambiguous or silently harmonized with a creation account. This reports the edition's apparatus, not an independent examination of ancient witnesses.
    reason: textual_uncertainty
  - marker: c
    text: The selected ending describes a path shown to the sun in a passive construction. Current POB makes the contextual agent explicit with 'He'; this is an English interpretation, not a separately expressed divine name in that clause.
    reason: translation_explication
