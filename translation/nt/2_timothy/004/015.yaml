id: 2TI.4.15
reference: 2 Timothy 4:15
source:
  edition: SBLGNT
  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
translation:
  text: You also must beware of him, for he strongly opposed what we said.
  philosophy: dynamic
lexical_decisions:
- source_word: φυλάσσου
  chosen: must beware of
  alternatives:
  - be on guard against
  - watch out for
  - guard yourself from
  lexicon: BDAG
  rationale: The present middle imperative calls for ongoing personal caution regarding Alexander. 'Beware of' is idiomatic modern English that preserves the warning force without sounding wooden. 'Must' reflects the imperative force addressed directly to Timothy.
- source_word: λίαν
  chosen: strongly
  alternatives:
  - greatly
  - very much
  - severely
  lexicon: BDAG
  rationale: λίαν intensifies the following verb. 'Strongly' fits natural English with 'opposed' and conveys marked intensity.
- source_word: ἀντέστη
  chosen: opposed
  alternatives:
  - resisted
  - stood against
  lexicon: BDAG
  rationale: The aorist of ἀνθίστημι means to set oneself against or resist. 'Opposed' is clear, idiomatic, and fits the dative object 'our words' in English better than the more literal 'stood against.'
- source_word: τοῖς ἡμετέροις λόγοις
  chosen: our words
  alternatives:
  - our message
  - what we said
  - our teaching
  lexicon: BDAG
  rationale: λόγοι here most naturally refers to the apostolic words/speech Paul and his companions spoke, likely in testimony or teaching. 'Our words' stays close to the Greek while remaining understandable. 'Our message' or 'our teaching' are interpretive expansions and are therefore kept as alternatives rather than the main rendering.
- source_word: ὃν
  chosen: him
  alternatives:
  - that man
  lexicon: BDAG
  rationale: The relative pronoun refers back to Alexander in the previous verse. English requires an explicit personal object here; 'him' is the most natural rendering.
- source_word: καὶ σὺ
  chosen: You also
  alternatives:
  - And you too
  - You too
  lexicon: BDAG
  rationale: καὶ with emphatic σὺ highlights Timothy in addition to Paul. 'You also' preserves the emphasis and connection to the prior warning.
