lexical_decisions:
- source_word: רְעָדָה
  english_pob_choice: Trembling
  chosen_korean: 떨림
  alternatives_korean:
  - 전율
  - 두려움
  - 흔들림
  lexicon: HALOT
  rationale: 명사형의 상태를 살리면서도 ‘Trembling’의 구체적 신체 반응을 자연스럽게 옮기기 위해 ‘떨림’을 택했습니다.
- source_word: אֲחָזָתַם
  english_pob_choice: seized them
  chosen_korean: 그들을 사로잡았습니다
  alternatives_korean:
  - 그들을 붙들었습니다
  - 그들을 움켜잡았습니다
  lexicon: HALOT
  rationale: ‘붙들다’보다 더 강한 돌발성과 압도감을 담아, 갑작스럽게 덮쳐 온 상태를 ‘사로잡다’로 옮겼습니다.
- source_word: חִיל
  english_pob_choice: anguish
  chosen_korean: 고통
  alternatives_korean:
  - 산통
  - 해산의 고통
  - 몸부림
  lexicon: HALOT
  rationale: 영문 본문이 ‘anguish’로 의미를 좁혔지만, 뒤의 해산 비유가 이미 있어 한국어에서는 중복을 피하면서도 실제적 고통을 드러내는 ‘고통’을 선택했습니다.
- source_word: כַּיּוֹלֵדָה
  english_pob_choice: like a woman in labor
  chosen_korean: 해산하는 여인 같은
  alternatives_korean:
  - 진통하는 여인 같은
  - 아이를 낳는 여인 같은
  lexicon: HALOT
  rationale: 출산 행위보다 산고의 긴박함을 살리기 위해 ‘해산하는 여인’으로 옮겼고, 비교의 구조를 앞세워 문장의 힘을 유지했습니다.
theological_decisions:
- issue: 시적 평행에서 ‘חִיל’과 ‘כַּיּוֹלֵדָה’의 관계를 어떻게 처리할지
  chosen_reading: ‘고통’과 ‘해산하는 여인 같은’으로 나누어, 본문이 말하는 신체적·정서적 압박과 산고의 비유를 함께 드러냈습니다.
  alternative_readings:
  - ‘몸부림’으로 일괄 번역
  - ‘산통’으로 직접 번역
  rationale: 히브리어는 산고 이미지를 단순 반복하지 않고, 떨림 뒤에 오는 내적 격통을 병치합니다. 한국어에서도 두 표현을 구분해야 시적 긴장이 유지됩니다.
  doctrine_reference: 시편의 시적 병행법 보존
