  rationale: The Hebrew first-person verbs emphasize the LORD's direct agency in redemption and conquest. The translation preserves that emphasis without adding theological interpretation beyond the text.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
