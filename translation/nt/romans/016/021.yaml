id: ROM.16.21
reference: Romans 16:21
source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
translation:
  text: Timothy, my fellow worker, greets you, as do Lucius, Jason, and Sosipater, my fellow Jews[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'my relatives.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀσπάζεται
  chosen: greets
  alternatives:
  - sends greetings to
  - greets warmly
  lexicon: BDAG
  rationale: The middle/passive form of ἀσπάζομαι in epistolary contexts commonly means to greet or send greetings. 'Greets' is concise, natural English and preserves the direct personal sense of the singular verb with Timothy as subject.
- source_word: ὑμᾶς
  chosen: you
  lexicon: BDAG
  rationale: Second person plural object, referring to the Roman recipients collectively. English 'you' is the natural equivalent, with plurality understood from context.
- source_word: συνεργός
  chosen: fellow worker
  alternatives:
  - coworker
  - co-worker
  lexicon: BDAG
  rationale: συνεργός denotes one who works together with another in shared labor, especially ministry labor in Paul. 'Fellow worker' is clear, idiomatic, and preserves the collaborative sense without sounding overly corporate.
- source_word: μου
  chosen: my
  lexicon: BDAG
  rationale: 'The genitive pronoun marks personal association: Timothy is Paul''s fellow worker, and the listed men are Paul''s kinsmen.'
- source_word: Λούκιος
  chosen: Lucius
  lexicon: BDAG
  rationale: Personal names are transliterated by standard English convention per translation philosophy.
- source_word: Ἰάσων
  chosen: Jason
  lexicon: BDAG
  rationale: Standard English transliteration of the personal name.
- source_word: Σωσίπατρος
  chosen: Sosipater
  alternatives:
  - Sopater
  lexicon: BDAG
  rationale: The form in this verse is Σωσίπατρος, best represented by the direct transliteration 'Sosipater.' 'Sopater' reflects a shortened form known elsewhere, but this verse's spelling supports 'Sosipater' in the main text.
- source_word: συγγενεῖς
  chosen: kinsmen
  alternatives:
  - relatives
  - fellow Jews
  lexicon: BDAG
  rationale: συγγενής can denote blood relatives or more broadly compatriots/kinsmen. In Paul it may carry ethnic-Jewish solidarity as in other passages, but here the term itself should not be overinterpreted. 'Kinsmen' preserves the broader familial/ethnic sense better than the narrower 'relatives' while avoiding an interpretive paraphrase like 'fellow Jews' in the main text.
