source:
  edition: WLC
  text: וַ/יַּ֥רְא אֱלֹהִ֖ים אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֵּ֖דַע אֱלֹהִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/025.yaml
  text: God saw the sons of Israel, and God knew.
translation:
  language: ta
  text: தேவன் இஸ்ரவேல் மக்களைப் பார்த்தார்; தேவன் அறிந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு இஸ்ரவேல் ஜனங்களை மொத்தமாகக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: וַיַּרְא
  choice: பார்த்தார்
  rationale: எபிரேய வினையின் நேரடியான பொருளைப் பேணுகிறது; முந்தைய வசனத்தின் சூழலில் அவர்களுடைய துயரத்தைத் தேவன் கண்டார் என்ற தொடர்பும் நிலைக்கிறது.
- source_word: וַיֵּדַע
  choice: அறிந்தார்
  rationale: ‘கவனித்தார்’, ‘அக்கறை கொண்டார்’ போன்ற விளக்கங்களை உரைக்குள் சேர்க்காமல், மூலத்தின் சுருக்கத்தையும் பொருள் ஆழத்தையும் திறந்த நிலையையும் பேணுகிறது.
theological_decisions:
- issue: ‘தேவன் அறிந்தார்’ என்பதன் குறிப்பிட்ட உட்பொருள்
  choice: அறிந்தார்
  alternative: அவர்களைக் கவனித்துக்கொண்டார் / அவர்களுடைய நிலையை உணர்ந்தார்
  rationale: எபிரேய உரை எதை அல்லது யாரை அறிந்தார் என்பதைக் குறிப்பாகச் சொல்லாமல் நிற்கிறது. உடன்படிக்கையை நினைவுகூருதல், துயரை உணருதல், அக்கறையுடன் ஏற்றுக்கொள்ளுதல் ஆகிய நிழற்பொருள்களில் ஒன்றை மட்டும் தீர்மானிக்காமல் உண்மையான தெளிவின்மையைப் பேணுகிறது.
translation_notes:
  register: சுருக்கமான, கண்ணியமான நவீனத் தமிழ். மூலத்தில் ‘தேவன்’ இருமுறை வருவது வலியுறுத்தலாக இருப்பதால் தமிழிலும் இருமுறை வைக்கப்பட்டது; வாக்கியத்தின் இரண்டு இணைச் செயல்கள் அரைப்புள்ளியால் தெளிவாகப் பிரிக்கப்பட்டன.
