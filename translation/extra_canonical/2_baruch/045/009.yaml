    ܘܬܩܘܡܘܢ ܒܕܚܠܬܗ ܘܠܐ
    ܬܛܥܘܢ ܢܡܘܣܗ. ܡܬܚܠܦܝܢ
    ܒܥܕܢܗܘܢ ܙܒ̈ܢܐ ܠܛܒܬܐ.
    ܘܬܚܙܘܢ ܒܒܘܝܐܐ
    ܕܨܝܘܢ. ܡܛܠ ܕܡܕܡ ܕܗܘܐ
    ܗܫܐ ܠܐ ܗܘܐ ܡܕܡ.
    ܡܕܡ ܕܝܢ ܕܥܬܝܕ ܕܢܗܘܐ.
    ܗܘܝܘ ܪܒ ܣܓܝ. ܟܠ ܕܝܢ
    ܡܕܡ ܕܡܬܚܒܠ. ܘܐܙܠ
    ܠܐ ܡܢ ܕܡܢܐ
    ܘܡܬܛܥܐ ܡܟܝܠ ܙܒܢܐ
    ܕܗܘܐ. ܘܠܐ ܗܘܐ
    ܕܡܢ ܒܬܪ ܗܢܐ
    ܕܡܬܒܥܐ ܒܥܘܗܕܢܐ. ܗܘ
    ܓܝܪ ܕܗܘܐ ܚܠܦ
    ܠܡܬܚܒܠܘ ܗܘ ܕܗܘܐ.
    ܘܗܘ ܕܡܬܚܒܠ ܒܥܘܗܕܢܐ
    ܢܦܠܐ ܘܡܬܛܥܐ. ܡܕܡ
    ܓܝܪ ܕܥܬܝܕ ܗܘ ܗܘ
    ܡܬܒܥܐ. ܡܕܡ ܕܥܒܪ
    ܡܢ ܐܝܕܐ ܠܐ ܗܘ ܗܘ
    ܡܬܚܫܒ. ܐܢ ܓܝܪ ܙܒܢܐ
    ܕܠܐ ܥܒܕ.. ܘܐܬܐ
    ܥܕܢܗ ܗܘ ܕܡܫܘܐ ܥܒܕܘܗܝ.
    ܘܡܒܩܪ ܚܛܗܝܗ̇ ܗܘ
    ܕܠܐܚܝܕܝܢ ܕܡܢܘܗܝ ܐܢܘܢ
    ܠܐ ܡܘܣܦܝܢ ܥܘܩܢ ܥܚܒܠܐ.
    ܘܐܠܘ ܐܝܬܝܗܝܢ ܕܐܢܘܢ
    ܥܬܝܕܝܢܡܢ ܠܐ ܡܬܚܣܟ.
    ܘܠܐܝܠܝܢ ܕܚ̈ܝܝܢ ܒܗ ܠܐ
    ܡܘܒܠܐ ܠܐܒܕܢܐ. ܘܐܝܠܝܢ
    ܕܐܦ ܨܒܝܢ ܕܢܬܚܙܝܢ
    ܕܢܬܙܗܪܘܢ ܗܘܘ ܙܒܢܐ ܕܐܡܝܪ.
    ܘܕܢܥܒܪܘܢ ܗܘܘ ܚܘܒܐ
    ܕܙܒܢܐ ܕܡܥܝܪ. ܘܐܝܠܝܢ
    ܐܝܠܝܢ ܕܐܦܢܘ ܥܘܩܢ
    ܘܕ̈ܓܠܐ ܢܣܒܘܐܬܐ.
    ܘܣܝܡܬܐ ܕܣܒܪܐܐܒܕܘܐ
    ܒܗܘܐܢܬ ܐܬܒܥܝܘ. ܘܡܢ
    ܪ̈ܚܡܐ ܠܐ ܐܚܣܘ.
    ܘܡܕܪܗ ܕܡܘܣܪ ܢܛܪܘ.
    ܥܘܩܢ ܨܒܝܢ ܠܡܬܒܥܝ
    ܡܬܚܣܟ ܒܥܡܐ ܕܐܬܐ.
    ܡܒܩܪܐܗܘ ܕܝܢ ܕܡܕܡ
    ܕܣ̈ܓܝܐܐ ܒܗܘܐܙܕܕܩܘ.܀.
