id: PSA.103.9
reference: Psalms 103:9
source:
  edition: WLC
  text: לֹֽא לָ/נֶ֥צַח יָרִ֑יב וְ/לֹ֖א לְ/עוֹלָ֣ם יִטּֽוֹר־׃
translation:
  text: He will not accuse us[a] forever, nor will he hold on to his anger for all time.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “contend with us.”
    reason: alternative_reading
lexical_decisions:
- source_word: לָנֶצַח
  chosen: forever
  alternatives:
  - continually
  - perpetually
  lexicon: HALOT
  rationale: נֶצַח with לְ commonly denotes enduring duration. 'Forever' is natural modern English and fits the poetic parallel with לְעוֹלָם.
- source_word: יָרִיב
  chosen: contend
  alternatives:
  - strive
  - accuse
  - bring a case
  lexicon: HALOT
  rationale: From ריב, often used for contending, disputing, or bringing a case. 'Contend' preserves the judicial-relational nuance without over-specifying a courtroom setting.
- source_word: לְעוֹלָם
  chosen: for all time
  alternatives:
  - forever
  - for ever
  lexicon: HALOT
  rationale: עוֹלָם denotes indefinite or perpetual duration. Rendered 'for all time' here to avoid awkward repetition of 'forever' in both cola while preserving the parallel sense.
- source_word: יִטּוֹר
  chosen: keep his anger
  alternatives:
  - keep anger
  - bear a grudge
  - retain
  - guard
  - keep watch
  lexicon: HALOT
  rationale: Used absolutely in a conflict context, the verb means to retain anger or bear a grudge, not to keep watch over something.
