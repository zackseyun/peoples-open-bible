id: JHN.1.34
reference: John 1:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
  footnotes:
  - marker: a
    text: Some manuscripts read 'the Son of God' instead of 'the Chosen One of God.'
    reason: textual_variant
translation:
  language: ko
  text: 나도 보았고 증언하였습니다. 이분이 하나님께서 택하신 분이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 ‘하나님께서 택하신 분’ 대신 ‘하나님의 아들’이라고 되어 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  english_pob_choice: And I
  chosen_korean: 저도
  alternatives_korean:
  - 나도
  - 나 역시
  lexicon: BDAG
  rationale: καί+ἐγώ의 결합은 앞 문장과의 연결 및 주체의 강조를 담습니다. 공손한 문체에 맞추어 '저도'가 연결적·강조적 의미를 모두 보존합니다.
- source_word: ἑώρακα
  english_pob_choice: have seen
  chosen_korean: 보았습니다
  alternatives_korean:
  - 보았고
  - 보았었다
  lexicon: BDAG
  rationale: 그리스어 현재완료는 목격의 지속적·현존하는 효력을 드러냅니다. 한국어 공손체 과거형 '보았습니다'가 그 지속성·증거성을 자연스럽게 전달합니다.
- source_word: μεμαρτύρηκα
  english_pob_choice: have testified
  chosen_korean: 증언하였습니다
  alternatives_korean:
  - 증거하였습니다
  - 증언하였습니다(완료의 강조)
  lexicon: BDAG
  rationale: 완료된 행위가 여전히 효력을 지닌다는 의미를 살려 공손한 과거 완료 적 표현 '증언하였습니다'를 택했습니다.
- source_word: ἐκλεκτός (τοῦ θεοῦ)
  english_pob_choice: Chosen One of God
  chosen_korean: 하나님의 택하신 이
  alternatives_korean:
  - 하나님의 택하신 자
  - 하나님의 선택된 이
  lexicon: BDAG
  rationale: 관사를 동반한 형용사가 실질적으로 명사적 용법으로 쓰였습니다. 영어의 'Chosen One'에 해당하도록 직역적·명료한 '택하신 이'를 사용해 원문 표기를 유지합니다.
theological_decisions:
- issue: Christological title in John 1:34
  chosen_reading: 하나님의 택하신 이 (ὁ ἐκλεκτὸς τοῦ θεοῦ에 따른 직역)
  alternative_readings:
  - 하나님의 아들 (ὁ υἱὸς τοῦ θεοῦ)
  rationale: SBLGNT 원문은 ὁ ἐκλεκτὸς τοῦ θεοῦ로 전합니다. 원문 우선 원칙에 따라 이 표기를 본문에 그대로 옮기고, 신학적으로 중요한 대체표기는 각주로 보존하여 독자가 원전의 긴장과 변이 가능성을 검토할 수 있게 합니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy), §3 (Preserve theological tension rather than resolve it)
