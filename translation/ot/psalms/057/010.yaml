  from: great up to the heavens, and your faithfulness up to the clouds
  to: great to the heavens, and your faithfulness to the clouds
  rationale: The phrase 'great up to the heavens' is slightly awkward. While 'up to' is a valid sense of 'עַד', in this context it applies a physical measure to the abstract quality 'great'. The simpler 'to the heavens' better conveys the sense of extent ('as far as the heavens') in more natural English. The same logic applies to the parallel second clause.
