  from: And so you shall do on the seventh day of the month for anyone who sins unintentionally or through simplicity[b][a]; thus you shall make atonement for the temple.
  to: On the seventh day of the month[a], you shall repeat this rite for anyone who sins unintentionally or out of ignorance[b]. In this way you shall make atonement for the temple.
  rationale: The lexical and theological record rightly keeps the temple, rather than the offenders, as the object of atonement. I preserve that distinction, clarify the opaque 'through simplicity,' and retain the supplied Hebrew date while noting the significant Greek variant.
