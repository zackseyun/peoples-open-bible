base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/001.yaml
  text: The book of the words of Tobit son of Tobiel[a], son of Ananiel, son of Aduel, son of Gabael, from the seed of Asiel, from the tribe of Naphtali[b],
  footnotes:
  - marker: a
    text: Greek has 'book of the words,' a formal title-like expression. It could also be rendered 'record' or 'account.'
    reason: lexical_alternative
  - marker: b
    text: The ancestor's name appears in a difficult Greek form here; the English normalizes it as 'Gabael.' Some witnesses and secondary traditions reflect forms closer to 'Gabiel' or 'Bagabael.'
    reason: alternative_reading
translation:
  language: ko
  text: 토빗의 말을 기록한 책입니다[a]. 토빗은 토비엘의 아들이고, 토비엘은 아나니엘의 아들이며, 아나니엘은 아두엘의 아들이고, 아두엘은 가바엘[b]의 아들입니다. 토빗은 아시엘의 혈통이며 납탈리 지파 출신입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘말들의 책’이라는 형식적인 표제 표현입니다. 문맥에 따라 ‘기록’ 또는 ‘이야기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 본문에는 이 이름이 난해한 형태(바가바엘에 가까운 표기)로 나타납니다. 다른 전승과 관련 자료에는 가바엘 또는 가비엘에 가까운 형태도 있어, 본문에서는 가바엘로 정규화했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ΒΙΒΛΟΣ λόγων
  english_pob_choice: The book of the words
  chosen_korean: 말들의 책
  alternatives_korean:
  - 기록
  - 사건들에 대한 책
  - 말씀들의 책
  lexicon: LSJ
  rationale: βίβλος λόγων은 제목 형식의 공식적 서두이므로, ‘말들’로 원문의 명사구를 보존하면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: Τωβείτ
  english_pob_choice: Tobit
  chosen_korean: 토빗
  alternatives_korean:
  - 토비트
  - 토빗트
  lexicon: 고유명사 음역
  rationale: 통용되는 성서 인명 음역에 맞춰 토빗으로 옮겼습니다.
- source_word: τοῦ Τωβιὴλ / τοῦ Ἀνανιὴλ / τοῦ Ἀδουὴλ / τοῦ ΒαΓαβαήλ
  english_pob_choice: son of Tobiel, son of Ananiel, son of Aduel, son of Gabael
  chosen_korean: 토비엘의 아들, 아니엘의 아들, 아두엘의 아들, 바가바엘의 아들
  alternatives_korean:
  - 토비엘로부터
  - 토비엘의 후손, 아니엘의 후손
  - 가바엘의 아들
  lexicon: LSJ
  rationale: 연속된 속격 계보를 한국어의 족보 관용구인 ‘~의 아들’로 풀어 genealogical 관계를 분명히 했고, 마지막 이름은 그리스어 표면형을 따라 바가바엘로 두었습니다.
- source_word: ἐκ τοῦ σπέρματος Ἀσιήλ
  english_pob_choice: from the seed of Asiel
  chosen_korean: 아시엘의 씨에서
  alternatives_korean:
  - 아시엘의 نسل에서
  - 아시엘의 후손 가운데서
  - 아시엘의 혈통에서
  lexicon: LSJ
  rationale: σπέρμα를 ‘씨’로 직역해 계보적 의미를 살리되, 한국어에서도 혈통/후손의 함의를 자연스럽게 전달하도록 했습니다.
- source_word: ἐκ τῆς φυλῆς Νεφθαλείμ
  english_pob_choice: from the tribe of Naphtali
  chosen_korean: 납달리 지파에서
  alternatives_korean:
  - 납달리의 지파에서
  - 납달리 지파로부터
  lexicon: LSJ
  rationale: φυλή는 족속이 아니라 ‘지파’가 본문 문맥에 가장 적합하므로 그대로 옮겼고, 성서 관용에 맞는 납달리로 표기했습니다.
theological_decisions:
- issue: 제목 형식의 서두를 어떻게 처리할지
  chosen_reading: 본문의 ‘책’은 서사 첫 구절이자 표제문으로 보고, 별도의 해설적 부연 없이 본문 안에 유지했습니다.
  alternative_readings:
  - ‘토빗에 대한 기록’
  - ‘토빗의 이야기’
  rationale: 그리스어 ΒΙΒΛΟΣ λόγων은 단순 서술보다 문서 표제의 성격이 강하므로, 그 형식성을 보존하는 쪽이 독자에게 원문 의도를 더 잘 전달합니다.
  doctrine_reference: 문헌 형식 보존 원칙
