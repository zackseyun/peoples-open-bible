translation:
  text: As for the matters Lysias decided should be submitted to the king, send someone at once to review them with us, so that we can take appropriate action[a], for we are on our way to Antioch.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “so that we may settle them as is fitting for us”; the Greek expression is compressed.
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ δὲ
  chosen: But whatever
  alternatives:
  - And whatever
  - Now whatever
  lexicon: LSJ
  rationale: δέ marks a mild transition or contrast; 'But' fits the flow from the preceding concessions while keeping the sentence connected. ἃ is an indefinite relative, best rendered 'whatever' rather than a more wooden 'the things which.'
- source_word: ἔκρινεν
  chosen: he has decided
  alternatives:
  - he decided
  - he judged
  lexicon: BDAG
  rationale: κρίνω here refers to an official determination or decision. The perfect-like English 'has decided' suits the present relevance of the decision in the letter's instructions better than the more judicial-sounding 'judged.' The subject is singular from context, referring to the Jewish leadership/addressee previously addressed.
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  chosen: should be presented to the king
  alternatives:
  - should be brought before the king
  - should be submitted to the king
  lexicon: LSJ
  rationale: The passive infinitive of προσαναφέρω in administrative context suggests formal presentation or submission. 'Presented to the king' is natural English and preserves the official nuance without over-specifying procedure.
- source_word: πέμψατέ τινα
  chosen: send someone
  alternatives:
  - dispatch someone
  - send a man
  lexicon: BDAG
  rationale: The imperative is straightforward. τις is indefinite; 'someone' is idiomatic and avoids adding male specificity not explicit in the Greek.
- source_word: παραχρῆμα
  chosen: at once
  alternatives:
  - immediately
  - right away
  lexicon: BDAG
  rationale: The adverb denotes promptness. 'At once' is clear, dignified modern English.
- source_word: ἐπισκεψόμενον περὶ τούτων
  chosen: to examine these matters
  alternatives:
  - to look into these things
  - to inspect concerning these matters
  lexicon: BDAG
  rationale: 'The participle conveys the purpose/result of sending: the envoy is to investigate or review the matters under discussion. ''Examine these matters'' is concise and suitably formal.'
- source_word: ἵνʼ ἔχωμεν
  chosen: so that we may settle them
  alternatives:
  - so that we may have them
  - so that we may be able
  lexicon: LSJ
  rationale: Although ἔχω literally means 'have,' in this epistolary-administrative context it likely means 'have matters arranged/handled.' English requires an idiomatic completion; 'settle them' captures the practical force implied by the following ὡς καθήκει ἡμῖν.
- source_word: ὡς καθήκει ἡμῖν
  chosen: as is fitting for us
  alternatives:
  - as is proper for us
  - as befits us
  lexicon: LSJ
  rationale: 'καθήκω denotes what is fitting, proper, or appropriate. ''As is fitting for us'' preserves the formal register and leaves the referent broad: what is appropriate for the royal authorities to do.'
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  chosen: for we are going on to Antioch
  alternatives:
  - for we are proceeding to Antioch
  - for we are coming to Antioch
  lexicon: LSJ
  rationale: προσάγω can mean bring/lead, but with a destination in this context it refers to moving onward toward a place. 'Going on to Antioch' gives natural travel language and fits the explanatory γάρ.
