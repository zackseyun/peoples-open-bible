  text: חַטַּ֣את יְהוּדָ֗ה כְּתוּבָ֛ה בְּ/עֵ֥ט בַּרְזֶ֖ל בְּ/צִפֹּ֣רֶן שָׁמִ֑יר חֲרוּשָׁה֙ עַל ל֣וּחַ לִבָּ֔/ם וּ/לְ/קַרְנ֖וֹת מִזְבְּחוֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/001.yaml
  text: The sin of Judah is written with an iron stylus[a]; with a diamond point it is engraved on the tablet of their heart and on the horns of your altars.
translation:
  language: pt
  text: O pecado de Judá está escrito com um estilete de ferro; com ponta de diamante[a], está gravado na tábua do coração deles e nos chifres dos seus altares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ponta de adamante”; a identificação exata de שָׁמִיר é incerta. O termo se refere, em geral, a uma substância extremamente dura, própria para gravar.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: pecado
  rationale: No contexto de denúncia profética, o substantivo indica a culpa moral de Judá, não uma oferta pelo pecado.
- source_word: כְּתוּבָה
  choice: está escrito
  rationale: 'Expressa naturalmente o estado resultante do particípio passivo: o pecado permanece inscrito.'
- source_word: עֵט בַּרְזֶל
  choice: estilete de ferro
  rationale: “Estilete” comunica um instrumento rígido para escrever ou entalhar e preserva a imagem do ferro.
- source_word: צִפֹּרֶן שָׁמִיר
  choice: ponta de diamante
  rationale: צִפֹּרֶן designa aqui a ponta do instrumento, e שָׁמִיר uma substância extremamente dura; “diamante” é uma equivalência moderna clara, com a incerteza lexical indicada em nota.
- source_word: חֲרוּשָׁה
  choice: está gravado
  rationale: 'Mantém o particípio passivo e intensifica a imagem: não se trata apenas de escrita, mas de uma inscrição profundamente entalhada.'
- source_word: לוּחַ לִבָּם
  choice: a tábua do coração deles
  rationale: Preserva a metáfora da superfície de escrita e o coração singular coletivo do hebraico.
- source_word: קַרְנוֹת
  choice: pontas
  rationale: Refere-se às projeções salientes nos cantos do altar; “pontas” é compreensível em português corrente sem perder o referente cultual.
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: seus altares
  rationale: O possessivo mantém a segunda pessoa do plural e, em contraste com “deles”, conserva a mudança de referência do texto hebraico.
theological_decisions:
- issue: Mudança pronominal da terceira para a segunda pessoa
  choice: Manter “coração deles” e depois “seus altares”
  alternative: Uniformizar como “altares deles”
  rationale: O texto massorético passa de uma descrição de Judá para uma interpelação direta. A mudança deve ser preservada por seu efeito profético, embora “seus” em português dependa do contexto para indicar a segunda pessoa.
translation_notes:
  register: Português moderno, claro e digno, com preservação da metáfora de inscrição e da mudança pronominal hebraica. “Estilete” evita a imagem inadequada de uma caneta moderna; “pontas dos altares” torna acessível o elemento arquitetônico tradicionalmente chamado de “chifres”.
