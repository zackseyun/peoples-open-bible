translation:
  text: Your falsehood will flow like water, for wealth will not remain with you, but will quickly leave you.[a]
    For you acquired all of it through injustice, and you will be handed over to a great curse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The selected source explicitly says wealth will not remain for you: the initial ኢ- negates the remaining
      verb, and the printed star before for you is preserved in the source. The next selected word is the adversative
      እላ, but; Charles printed203 note3 reports እለ in witness g, but that reported reading is not adopted here.
      Neither the rejected positive wealth-remains reading nor the old OCR fire-like string is the selected wording.
      This is a review of Charles’s printed body and apparatus, not a fresh inspection of witness g.'
    reason: textual_variant
  - marker: b
    text: The first clause says your falsehood will flow like water. The wealth verb later in the sentence literally
      uses going up or ascending; leave you expresses the resulting loss without inventing fire or burning. The
      source then says that you acquired all of it by injustice and that you will be handed over to a great curse.
      The possessors and addressed group remain second-person plural throughout.
    reason: lexical_alternative
