id: NUM.18.19
reference: Numbers 18:19
source:
  edition: WLC
  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
translation:
  text: I have given you and your sons and daughters all the contributions from the holy offerings that the Israelites present to Yahweh, as a permanent statute. It is an everlasting covenant of salt[a] before Yahweh for you and your offspring.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Salt was required with offerings (Leviticus 2:13); a “covenant of salt” denotes an enduring covenant.
    reason: cultural_note
