  from: For behold[a], those far from you will perish; you destroy all who are unfaithful to you.
  to: For behold, those far from you will perish; you destroy all who are unfaithful to you.[a]
  rationale: The proposed “look” and perfect English are stylistic alternatives, not needed corrections; the Hebrew perfect may express the gnomic certainty rendered by “you destroy.” “Prostitute themselves by leaving you” makes the metaphor sound more literal and adds an instrumental/causal relation not explicitly marked. “Unfaithful to you” gives its covenantal sense, while a note preserves the source metaphor. The existing note must be moved from “behold” to the expression it explains.
