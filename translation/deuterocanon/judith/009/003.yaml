translation:
  text: For this you gave their rulers over to slaughter, and through deceit you stained with blood the bed that was ashamed of their deceit[a]. You struck down servants[b] along with princes, and princes on their thrones.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “their bed, which was ashamed of their deceit, deceived into blood”; the bed is personified, and their deceit is answered with deceit.
    reason: lexical_alternative
  - marker: b
    text: The Greek refers to enslaved servants.
    reason: lexical_alternative
