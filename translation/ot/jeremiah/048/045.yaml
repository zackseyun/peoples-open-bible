  from: In the shadow of Heshbon the fugitives stand without strength[a], for a fire has gone out from Heshbon, and a flame from the midst of Sihon[d][c][b]; it has consumed the corner of Moab and the crown of the head of the sons of tumult.
  to: Fugitives stand exhausted in the shadow of Heshbon; for fire has come out of Heshbon, a flame from Sihon’s city[a]; it has consumed the brow of Moab[b] and the scalps of its boisterous people.
  rationale: The lexical record rightly preserves exhaustion, shadow, and destructive fire, but its source-shaped references to Sihon and “sons of tumult” obscure their sense in English. The parallel head imagery and the reworked Numbers passages favor “brow,” while the border reading remains a serious alternative.
