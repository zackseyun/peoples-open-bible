translation:
  text: 'And go, say to the Watchers of heaven[a] who sent you to petition on their behalf[b]:
    “You ought to petition on behalf of humankind[c], and not humankind on your behalf.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected Ethiopic includes “the Watchers of heaven”; the printed Greek lacks that
      designation here. Charles's Greek apparatus, p41 n11, identifies it as an Ethiopic addition.
    reason: textual_variant
  - marker: b
    text: The verb means ask or request; “petition” reflects the appeal made on their behalf.
    reason: textual_variant
  - marker: c
    text: The Ethiopic term denotes human beings collectively, not males alone.
    reason: textual_variant
