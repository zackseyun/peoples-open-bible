  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: idiom
  tier: 1
  from: He causes grass to grow for the cattle[a], and plants for the service of man, to bring forth bread from the earth,
  to: He causes grass to grow for livestock, and plants for human cultivation, to bring forth bread from the earth,
  rationale: “Plants for the service of man” is materially unnatural English. “Livestock” appropriately avoids restricting בְּהֵמָה to cattle, and “for human cultivation” naturally expresses the agricultural relation of the compact Hebrew phrase. The proposal’s “so that they may” makes humans the explicit subject of the infinitive and thus narrows an ambiguity that the Hebrew leaves compact; “food” also unnecessarily replaces the concrete לֶחֶם, “bread.”
