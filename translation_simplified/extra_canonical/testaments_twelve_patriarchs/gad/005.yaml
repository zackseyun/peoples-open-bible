translation:
  language: en
  text: '1. Hatred is evil. It continually keeps company with falsehood and speaks against the truth. It makes small matters seem great, presents light as darkness, and calls what is sweet bitter. It teaches slander and stirs up anger and war. It fills the heart with insolence, every kind of greed, all kinds of evil, and devilish poison.


    2. So I tell you these things from my own experience, my children: drive out this devilish hatred and cling to the love of God. 3. Righteousness drives out hatred, and humility removes jealousy. A righteous and humble person is ashamed to act unjustly. This is not because someone else condemns him, but because his own heart does, for the Lord watches over his soul. 4. He does not speak against a holy person, because the fear of God lives in him. 5. He fears offending the Lord, so he does not want to wrong anyone—not even in his thoughts.


    6. I learned these things only later, after I changed my attitude[d] toward Joseph. 7. True repentance according to God [removes ignorance and][a] drives darkness away. It enlightens the eyes, gives knowledge to the soul, and guides a person''s purpose toward salvation. 8. He did not learn this from human beings; through repentance he knows how to receive those who turn back.[b]


    9. God brought liver disease upon me. If my father''s prayers had not helped me, my spirit would almost have failed. 10. A person is punished through the very things by which he transgresses. 11. Because my liver had been pitilessly set against Joseph, I too was judged pitilessly: I suffered in my liver for ten months.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words “removes ignorance and” are uncertain in the Greek text.
    reason: textual_variant
  - marker: b
    text: The Greek does not name the subject of “he”; God, the repentant person, and an impersonal sense have been proposed.
    reason: alternative_reading
  - marker: c
    text: The Greek literally says “ten periods.” The lexical and theological audit favors “ten months,” while the POB running text reads “ten years.”
    reason: alternative_reading
  - marker: d
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims. Retain changed my attitude toward Joseph for the personal reversal in 5:6, matching the paired record, while using repentance for 5:7-8.
    reason: lexical_alternative
