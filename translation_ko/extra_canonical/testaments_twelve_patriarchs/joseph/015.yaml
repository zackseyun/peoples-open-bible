revisions:
- from: '4. 그는 죄의 욕망 가운데서 나를 보고 싶어 했지만, 나는 이 모든 일에 대해 알지 못했습니다.


    5. 나는 그녀에게 말했습니다. “증거가 제시되기 전에 남의 것을 빼앗는 일은 이집트 사람들 사이의 관습이 아닙니다.”


    6. 그래서 나는 이 말을 교환에 관해 한 것입니다. 그러나 소년은 갇혀 있어야 합니다.


