id: JOB.4.2
reference: Job 4:2
source:
  edition: WLC
  text: הֲ/נִסָּ֬ה דָבָ֣ר אֵלֶ֣י/ךָ תִּלְאֶ֑ה וַ/עְצֹ֥ר בְּ֝/מִלִּ֗ין מִ֣י יוּכָֽל׃
translation:
  text: If someone ventures to speak to you, will it be too much for you? But who can hold back words?
  philosophy: dynamic
lexical_decisions:
- source_word: הֲנִסָּה
  chosen: tries
  alternatives:
  - attempts
  - tests
  - ventures
  lexicon: HALOT
  rationale: From נסה in the Piel/denominative sense of making an attempt or venturing. In context Eliphaz is cautiously introducing speech to Job, so 'tries' or 'ventures' fits better than 'tests.' The interrogative הֲ makes this the opening of a question.
- source_word: דָבָר
  chosen: a word
  alternatives:
  - a matter
  - something
  lexicon: HALOT
  rationale: דבר can mean 'word,' 'matter,' or 'thing.' Here, with the following reference to 'words,' the speech sense is foregrounded. 'A word' preserves the idiomatic sense of speaking to someone while staying close to the Hebrew.
- source_word: אֵלֶיךָ
  chosen: with you
  alternatives:
  - to you
  lexicon: HALOT
  rationale: Literally 'to you,' but in English 'try a word to you' is unnatural. 'With you' idiomatically conveys addressing Job in speech while preserving the interpersonal direction.
- source_word: תִּלְאֶה
  chosen: will you become weary
  alternatives:
  - will you be weary
  - will you be offended
  - will you be grieved
  lexicon: HALOT
  rationale: Retains the basic sense of becoming weary.
- source_word: וַעְצֹר
  chosen: hold back
  alternatives:
  - restrain
  - withhold
  - stop
  lexicon: HALOT
  rationale: 'From עצר, ''restrain'' or ''hold back.'' The clause is rhetorical: Eliphaz claims he cannot refrain from speaking. ''Hold back'' is natural and faithful.'
- source_word: במִלִּין
  chosen: words
  alternatives:
  - speech
  - utterances
  lexicon: HALOT
  rationale: Aramaizing/plural form for 'words.' The plural is best preserved. It also creates a deliberate echo with the earlier דבר.
- source_word: מִי יוּכָל
  chosen: who can
  alternatives:
  - who is able to
  lexicon: HALOT
  rationale: A standard rhetorical expression of ability. 'Who can' is concise and natural English.
- source_word: הֲנִסָּה דָבָר אֵלֶיךָ
  chosen: If someone ventures to speak to you
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English for the cautious attempt to address Job; the alternative note preserves the compact source image of venturing a word.”
