    text: An obscure designation retained from the Greek; the Hebrew text of Esther 3:1 calls Haman an Agagite.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁμὰν Ἁμαδάθου
  chosen: Haman son of Hammedatha
  alternatives:
  - Haman, the son of Hammedatha
  lexicon: LSJ
  rationale: The genitive Ἁμαδάθου is naturally rendered as a patronymic, 'son of Hammedatha,' in clear English while preserving the personal names by transliteration.
- source_word: Βουγαῖος
  chosen: a Bougaean
  alternatives:
  - the Bougaean
  - a Bugaean
  lexicon: LSJ
  rationale: This ethnic or family designation is obscure and best transliterated rather than interpreted. The anarthrous predicate/appositional force works naturally in English as 'a Bougaean.'
- source_word: ἔνδοξος
  chosen: honored
  alternatives:
  - glorious
  - distinguished
  - held in honor
  lexicon: LSJ
  rationale: In context the term describes Haman's exalted standing before the king, not intrinsic glory. 'Honored' is idiomatic and captures courtly status without overstating.
- source_word: ἐνώπιον τοῦ βασιλέως
  chosen: before the king
  alternatives:
  - in the presence of the king
  - in the king's sight
  lexicon: LSJ
  rationale: A standard rendering that preserves the court-setting nuance and reads naturally in English.
- source_word: ἐζήτει κακοποιῆσαι
  chosen: was seeking to harm
  alternatives:
  - sought to do evil to
  - was trying to mistreat
  lexicon: LSJ
  rationale: The imperfect ἐζήτει suggests ongoing intent, so 'was seeking' preserves aspect. κακοποιῆσαι here is broader than physical injury alone; 'to harm' captures malicious intent against Mordecai and his people.
- source_word: τὸν Μαρδοχαῖον καὶ τὸν λαὸν αὐτοῦ
  chosen: Mordecai and his people
  alternatives:
  - Mordecai and his nation
  - Mordecai and his people-group
  lexicon: LSJ
  rationale: λαός is most naturally 'people' here, referring to the Jewish people associated with Mordecai.
- source_word: ὑπὲρ τῶν δύο εὐνούχων τοῦ βασιλέως
  chosen: because of the king’s two eunuchs
  alternatives:
  - on account of the king's two eunuchs
  - concerning the king's two eunuchs
  - for the sake of the king's two eunuchs
  lexicon: LSJ
  rationale: 'ὑπέρ here is causal in context: Haman''s hostility is linked to the matter involving the two eunuchs. ''Because of'' communicates that causal connection most clearly. εὐνοῦχοι is rendered ''eunuchs'' in keeping with the Greek term''s ordinary court sense.'
