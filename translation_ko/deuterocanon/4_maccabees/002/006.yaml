  source_fidelity: 초안은 핵심 어휘와 이성이 욕망 및 의를 방해하는 정념을 제어한다는 진술을 대체로 충실히 반영합니다. 그러나 ὥσπερ καί의 비교 구조가 ‘정념들도 마찬가지로’라는 병렬 표현에서 다소 불분명해졌고, εἴρηκεν의 완료적 진술은 ‘말할 때’보다 ‘말하였는데’가 더 잘 반영합니다.
  naturalness: ‘욕망하지 말라고’는 현대 한국어에서 다소 어색하므로 ‘욕망을 품지 말라고’로 다듬는 것이 자연스럽습니다. 비교절의 주어가 이성임을 다시 밝혀 문장 관계를 명료하게 했습니다.
  terminology: ‘율법’, ‘이성’, ‘욕망’, ‘의’, ‘정념’은 원문의 범위와 이 문헌의 헬레니즘 윤리적 어휘에 적절합니다. ‘정념’은 πάθη를 단순 감정보다 정확하게 나타냅니다.
