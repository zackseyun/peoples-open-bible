revisions:
- from: 그때 모세가 이스라엘 자손에게 말했습니다. “이것은 너희가 제비뽑기로 차지할 땅입니다. 야훼께서 아홉 지파와 반 지파에게 주라고 명령하신 땅입니다.”[a]
  to: 모세가 이스라엘 자손에게 명령하여 말했습니다. “이것은 너희가 제비를 뽑아 기업으로 받을 땅, 곧 야훼께서 아홉 지파와 반 지파에게 주라고 명령하신 땅입니다.”
  rationale: 모세의 발화가 명령임을 명시하고, 토지를 제비로 ‘기업으로 받는다’는 본문의 분배·상속 어휘를 살렸습니다. 야훼께서 그 땅을 아홉 지파와 반 지파에게 주도록 명령하셨다는 관계절도 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:44:50Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 제비에 의한 땅 분배와 야훼의 명령이라는 핵심을 대체로 보존합니다. 그러나 וַיְצַו(‘명령하였다’)를 단순히 ‘말했습니다’로 옮겨 모세의 권위 있는 명령 행위를 약화시켰습니다. תִּתְנַחֲלוּ는 이 문맥에서 땅을 기업/유산으로 받는다는 뜻이므로 ‘차지할’보다 ‘기업으로 받을’이 더 정확합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 두 번의 ‘땅입니다’ 반복을 관계절로 연결하여 원문의 한 문장 구조와 논리 관계를 분명히 합니다.
  terminology: ‘야훼’, ‘제비를 뽑아’, ‘지파’, ‘반 지파’는 일관되고 적절합니다. ‘기업으로 받을’은 성서의 토지 분배·상속 용어를 보존하면서도 문맥상 이해 가능합니다.
  issues:
  - severity: medium
    issue: וַיְצַו의 의미 약화
    rationale: ‘말했습니다’는 ‘명령하다’라는 동사의 지시·권위의 의미를 충분히 전달하지 못합니다.
  - severity: medium
    issue: תִּתְנַחֲלוּ의 기업 상속 의미가 ‘차지할’로 평준화됨
    rationale: ‘차지하다’는 점유·획득 일반을 뜻할 수 있으나, 본문은 제비로 분배받는 토지 기업의 의미를 담고 있습니다.
  - severity: low
    issue: 각주가 불필요한 번역 선택을 해명함
    rationale: ‘상속받을’ 대신 ‘차지할’을 쓴 이유를 설명하는 각주는 수정된 본문에서는 필요하지 않으며, 해당 선택 자체도 원문 의미를 충분히 반영하지 못합니다.
  revised_text: 모세가 이스라엘 자손에게 명령하여 말했습니다. “이것은 너희가 제비를 뽑아 기업으로 받을 땅, 곧 야훼께서 아홉 지파와 반 지파에게 주라고 명령하신 땅입니다.”
