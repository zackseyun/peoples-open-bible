revisions:
- from: 당신은 의를 사랑하고 악을 미워하셨으므로 — 그러므로 하나님, 당신의 하나님이 당신에게 즐거움의 기름을 당신의 동료들보다 더 많이 부으셨습니다.ᵃᵇ[a][b]
  to: 몰약과 침향과 계피의 향기가 당신의 모든 옷에 배어 있고, 상아 궁전들에서 현악기가 당신을 기쁘게 하였습니다.[a][b]
  rationale: 원문 절 번호와 실제 번역 내용의 불일치를 바로잡아 시편 45:8 전체를 새로 번역했습니다. 무동사 명사절은 ‘향기가 … 배어 있고’로 자연스럽게 풀되 향품과 의복의 관계를 보존했습니다. 후반절은 영어 POB의 전통적 ‘현악기’ 해석을 따르면서도, 원문이 주어를 밝히지 않는다는 점과 전치사구의 해석상 여지를 각주로 보존했습니다.
