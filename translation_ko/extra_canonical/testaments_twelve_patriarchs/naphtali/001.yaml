- from: '나프탈리, 곧 야곱의 여덟째 아들의 유언의 사본입니다. 그는 떠날 때, 곧 자기 생애의 백삼십 년째에 이것을 정리하였습니다.


    2 그의 아들들이 일곱째 달 초하루에 함께 모였을 때, 그는 그들을 위해 잔치를 베풀었습니다. 3 아침에 그가 깨어난 뒤 그들에게 말하였습니다. “나는 죽어 가고 있습니다.” 그러나 그들은 그를 믿지 않았습니다. 4 그리고 주님을 찬양하고 영화롭게 하면서 그는 힘을 회복하고 말하였습니다. “어제 잔치 뒤에 내 육체는 힘을 잃고 죽었습니다.”


    5 그가 말하기 시작하였습니다. “내 자녀들아, 나프탈리의 아들들아, 내 아버지의 말을 들으십시오. 6 나는 빌하에게서 태어났습니다. 라헬이 꾀를 써서 빌하를 자기 대신 야곱에게 주었기 때문입니다. 빌하는 수태하여 라헬의 무릎 위에서 나를 낳았고, 이 때문에 그녀는 내 이름을 나프탈리라고 불렀습니다. 7 라헬은 내가 무릎 위에서 태어났기 때문에 나를 매우 사랑했습니다. 내가 아직 어린아이였을 때에도 그녀는 나에게 입을 맞추며 말하였습니다. ‘당신과 같은, 내 태에서 난 형제를 제가 얻기를 원합니다.’ 8 그러므로 요셉도 라헬의 기도대로 모든 면에서 나와 같았습니다.”[a][b][c]'
  to: '야곱과 빌하의 여덟째 아들 나프탈리의 유언의 사본입니다. 이것은 그가 자기 생애의 백삼십 년째, 곧 그가 떠날 때에 마련한 것입니다.


    2 그의 아들들이 일곱째 달 초하루에 함께 모였을 때, 그는 그들을 위해 잔치를 베풀었습니다. 3 아침에 그가 잠에서 깨어난 뒤 그들에게 말하였습니다. “나는 죽어 가고 있습니다.” 그러나 그들은 그의 말을 믿지 않았습니다. 4 그는 주님을 영화롭게 하며 힘을 얻어 말하였습니다. “어제 잔치 뒤에 내 육체는 죽었습니다.”


    5 그가 말하기 시작하였습니다. “내 자녀들아, 나프탈리의 아들들아, 너희 아버지의 말을 들으십시오. 6 나는 빌하에게서 태어났습니다. 라헬이 꾀를 써서 빌하를 자기 대신 야곱에게 주었기 때문입니다. 빌하는 수태하여 라헬의 무릎 위에서 나를 낳았고, 이 때문에 라헬은 내 이름을 나프탈리라고 불렀습니다. 7 라헬은 내가 자기 무릎 위에서 태어났기 때문에 나를 매우 사랑했습니다. 내가 아직 어린아이였을 때에도 그녀는 내게 입을 맞추며 말하였습니다. ‘내 태에서 너 같은 형제를 내게 주시기를 바랍니다.’ 8 그러므로 요셉도 라헬의 축복들에 따라 모든 면에서 나와 같았습니다.”'
  rationale: 그리스어 본문을 우선하여 계보 정보, 화자-청자 관계, 기원법, 그리고 εὐλογίας의 의미를 바로잡았습니다. 영어 감사본의 ‘failed and died’ 및 ‘prayers’는 각각 제시된 그리스어 ‘ἀπέθανεν’ 및 ‘εὐλογίας’와 일치하지 않으므로 따르지 않았습니다. 본문에 제공되지 않은 각주는 새로 만들지 않았고, 정의되지 않은 앵커는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:10Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 표제는 나프탈리가 야곱과 빌하의 아들이라는 정보를 포함해야 하며, 5절의 ‘πατρὸς ὑμῶν’은 화자인 나프탈리를 가리키므로 ‘너희 아버지’여야 합니다. 4절의 그리스어는 ‘내 육체는 죽었다’라고 하며 ‘힘을 잃고’는 원문에 없는 보충입니다. 7절의 기원법 ‘Δοίη μοι’는 소망/간구이지 ‘원합니다’라는 의지 진술이 아닙니다. 8절의 현존 본문 ‘εὐλογίας’는 ‘기도’가 아니라 ‘축복들’입니다.
  naturalness: 합쇼체와 고어적 유언 형식을 유지하되, 표제와 호칭을 자연스럽게 다듬었습니다. 직접 인용 안의 라헬의 기원은 한국어에서 자연스러운 ‘주시기를 바랍니다’로 옮겼습니다.
  terminology: ‘유언’, ‘주님’, ‘빌하’, ‘라헬’, ‘요셉’을 유지했습니다. ‘무릎 위에서’는 출생·수양 전승의 관용적 표현을 보존합니다. 근거 없는 [a][b][c] 앵커는 제거했습니다.
  issues:
  - severity: high
    issue: 5절의 ‘내 아버지의 말’
    rationale: 그리스어 ‘λόγους πατρὸς ὑμῶν’은 ‘너희 아버지의 말’입니다. 현재 번역은 화자가 자기 아버지 야곱의 말을 전하는 것으로 의미를 바꿉니다.
  - severity: high
    issue: 8절의 ‘라헬의 기도대로’
    rationale: 제시된 그리스어 본문은 ‘κατὰ τὰς εὐλογίας Ῥαχιήλ’(라헬의 축복들에 따라)입니다. 영어 감사본의 ‘prayers’보다 원문을 우선해야 합니다.
  - severity: medium
    issue: 4절의 ‘힘을 잃고 죽었습니다’
    rationale: ‘ἀπέθανεν ἡ σάρξ μου’에는 ‘힘을 잃고’에 해당하는 말이 없습니다. 앞선 ‘ἐκραταιώθη’는 나프탈리가 힘을 얻었다는 뜻입니다.
  - severity: medium
    issue: 7절의 기원 표현 및 ‘당신’ 호칭
    rationale: ‘Δοίη μοι’는 ‘내게 주시기를’이라는 기원법입니다. 어린 나프탈리에게 하는 말로 ‘너 같은’이 문맥상 더 자연스럽습니다.
  - severity: medium
    issue: 표제에서 빌하 누락
    rationale: 표제의 ‘τοῦ ὀγδόου υἱοῦ Ἰακὼβ καὶ Βάλλας’는 야곱과 빌하의 여덟째 아들이라는 계보 정보를 포함합니다.
  - severity: low
    issue: 미정의 각주 앵커 [a][b][c]
    rationale: 제공된 각주 목록이 없으므로 독자에게 해결 불가능한 참조가 됩니다. 삭제하는 것이 안전합니다.
