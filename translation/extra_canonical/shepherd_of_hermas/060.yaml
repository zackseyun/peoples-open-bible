translation:
  text: 'I.1. He showed me a [large] willow[a] covering plains and mountains, and all those called by
    the name of the Lord had come under the shelter of the willow.


    I.2. An angel of the Lord, glorious and very tall, was standing beside the willow with a great sickle.
    He was cutting branches from the willow and handing them to the people sheltered beneath it; he gave
    them little rods, about a cubit long[b].


    I.3. After everyone had received the rods, the angel laid down the sickle, and that tree was sound,
    just as I had seen it before.


    I.4. I marveled within myself, saying, “How is the tree sound when so many branches have been cut
    off?” The shepherd says to me, “Do not marvel that the tree remained sound though so many branches
    were cut off. But wait until you see everything, and what it is will be shown to you[c].”


    I.5. The angel who had given the rods to the people again demanded them back. They were called to
    him in the same order in which they had received them, and each one returned the rods. The angel of
    the Lord took them and examined them.


    I.6. From some he received rods that were dry and eaten as if by a moth. The angel ordered those who
    had handed in such rods to stand apart.


    I.7. Others handed in dry rods, but they had not been eaten by a moth. These too he ordered to stand
    apart.


    I.8. Others handed in half-dry rods, and these stood apart[d].


    I.9. Others handed in their rods half-dry and with splits, and these stood apart.


    I.10. Others handed in their rods green and with splits, and these stood apart[e].


    I.11. Others handed in rods half dry and half green, and these stood apart[f].


    I.12. Others presented their rods with two parts of the rod green and the third part dry, and these
    stood apart.


    I.13. Others handed in two parts dry and the third part green, and these stood apart[g].


    I.14. Others handed in their rods almost entirely green. Only a very little of their rods was dry,
    at the very tip; but they had splits in them, and these stood apart[h].


    I.15. For others, only a very little was green, and the rest of the rods was dry. These stood apart[i].


    I.16. Others came carrying their rods green, just as they had received them from the angel. The greater
    part of the crowd handed in rods like these. The angel rejoiced greatly over these, and these stood
    apart[j].


    I.17. Others handed in their rods green and with shoots. These stood apart, and the angel rejoiced
    greatly over these too[k].


    I.18. Others handed in their rods green and with shoots; their shoots had something like fruit. Those
    people whose rods were found to be like this were very cheerful. The angel exulted over these, and
    the shepherd was very cheerful over these[l].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: Large is bracketed in the1891 working Greek. Michigan printed83 and both Latin versions lack
      this adjective; the Sinaiticus project transcription global67.1 has μεγάλην without supply or correction
      markup. Berlin6789 begins later within paragraph1 and cannot attest the adjective. The source bracket
      is retained while the early Greek support is disclosed. The misplaced old060 opening from S.7.4–5,
      including its repentance annotation, now belongs to repaired059; it is archived, not deleted from
      the book or imposed on this willow passage.
  - marker: b
    reason: textual_variant
    text: Cubit renders the ancient length pechys; the image retains the rods’ approximate length without
      replacing it with a falsely exact modern measure. Sinaiticus global67.2 places the full handing-branches-to-the-sheltered-people
      clause in a ca-corrector addition, not its first hand. Berlin6789printed17 partly preserves the
      surrounding account, with many supplied letters. Its strong adjective before tall is explicitly
      deleted by dots. The working English retains glorious and very tall without that extra adjective.
  - marker: c
    reason: textual_variant
    text: The working wait until phrase is Harmer’s version-supported conjecture. Michigan printed84–85
      has a shorter aphes de, he says, see everything construction; Berlin6789printed18 has damage at
      the beginning of the corresponding clause, so it does not preserve the whole working conjecture.
      Both Latin versions have wait, with Palatina also explicit when you have seen everything. Berlin’s
      internal question before the shepherd’s reply is absent by the edition’s line-length reconstruction;
      Michigan preserves the question, and Sinaiticus has how as a ca-correction before its damaged physical
      break. The working dialogue is retained rather than harmonized.
  - marker: d
    reason: textual_variant
    text: Half-dry without splits in paragraph8 remains separate from half-dry with splits in9. Michigan
      printed85–86 omits the separate paragraph8 group, while Berlin6789printed19 partly supports the
      separate group and both Latin versions include it (Palatina’s pseudo-dry is its peculiar wording).
      Sinaiticus global67.8 partly preserves half-dry and standing apart; reconstructed letters are marked
      as supplies in that project.
  - marker: e
    reason: textual_variant
    text: The whole working paragraph10 group, green rods with splits, is Hilgenfeld’s version-supported
      restoration against reported Athos omission. Berlin6789printed19–20 partly supports a corresponding
      passage across a damaged leaf break, but most of the opening wording is supplied, not intact ink.
      Sinaiticus global67.10 partly preserves this group; green is a ca-corrected spelling and part of
      splits is supplied. Michigan printed86 has the corresponding group but an interlinear two-parts-green/third-dry
      gloss that its editor treats as misplaced, not an additional group to import. Vulgata98brackets
      this whole group as supplied from Palatina; it is not independent Vulgata manuscript evidence for
      it.
  - marker: f
    reason: textual_variant
    text: Half dry and half green in11 is not collapsed into the earlier half-dry group. Michigan printed86
      partly preserves it, and Berlin6789printed19–20 partly preserves half dry followed by a mostly supplied
      half green phrase. Vulgata98includes it; Palatina175omits it. Sinaiticus global67.11 ends after
      the opening words, and12–13are not separately present in the surviving extracted passage; these
      physical losses do not establish omission of the groups.
  - marker: g
    reason: textual_variant
    text: Two-thirds green/one-third dry in12 and two-thirds dry/one-third green in13 remain distinct
      and in the working order. Michigan printed86–87 partly preserves both. Vulgata98also has both; Palatina175omits13.
      Berlin6789ends in12 and cannot attest13. No missing fragment is counted as a negative witness.
  - marker: h
    reason: textual_variant
    text: Paragraph14 is almost entirely green with only the very tip dry and with splits. Michigan printed87
      supports this combination, with damage/supplies. Vulgata98has an edited green against its codex/earlier
      editions’ dry and retains the splits. Palatina175has nearly all green with the very tip dry but
      omits the splits. The surviving Sinaiticus global67.14 is heavily damaged and lacks much of the
      tip-description text, so it cannot certify every word of the working sentence.
  - marker: i
    reason: textual_variant
    text: 'Paragraph15 reverses the preceding proportions: only a very little green, the rest dry. Michigan
      printed87 partly preserves this group. Sinaiticus global67.15 has the green word as an S1correction
      from the incomplete first-hand ron; surrounding wording partly survives. Vulgata98has the group;
      Palatina175omits it. The complete working group is restored without pretending the Latin versions
      have identical extent.'
  - marker: j
    reason: textual_variant
    text: The greater part of the crowd returning rods as green as received is explicit, as are the angel’s
      joy and this group’s separate place. Michigan printed87 partly preserves it; Sinaiticus global67.16
      partly preserves it with carries/has wording differences. Vulgata98and Palatina175support the majority
      and joy but differ in some descriptive wording. No majority count is invented beyond the source’s
      greater part.
  - marker: k
    reason: textual_variant
    text: The working continuation across17–18 is a Gebhardt version-supported restoration against reported
      Athos copying omission. Michigan printed87–88 partly preserves the separate shoot-bearing group
      and the angel’s joy, and Sinaiticus global67.17 partly preserves the corresponding separate group,
      standing apart and joy, with supplies/damage. Both Latin versions include it. The working critical
      bars remain in the source; supplied editions and reconstructed manuscript letters are not treated
      as untouched ink.
  - marker: l
    reason: textual_variant
    text: Something like fruit retains both hosei and tina rather than turning the shoots into a specific
      fruit. Michigan printed88 partly preserves the fruit-bearing group, and Sinaiticus global67.18 partly
      preserves it with damaged/supplied words and corrected spellings. Both versions retain fruit but
      do not have the explicit like wording. Michigan and Sinaiticus add with him to the shepherd’s joy,
      as does Vulgata99; Palatina177does not. The continuous working English keeps its own wording and
      the angel/shepherd/people’s distinct joy.
