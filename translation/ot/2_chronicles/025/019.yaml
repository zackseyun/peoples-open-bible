  meaning_decisions:
  - source_phrase: אָמַרְתָּ הִנֵּה הִכִּיתָ אֶת אֱדוֹם
    prior_rendering: You said, ‘Look, you have struck Edom
    new_rendering: You say, ‘Look, I have defeated Edom!’
    rationale: Within a quotation of Amaziah’s own boast, English requires the first-person pronoun; 'defeated' conveys the military sense of 'struck.'
  - source_phrase: וּנְשָׂאֲךָ לִבְּךָ לְהַכְבִּיד
    prior_rendering: and your heart has lifted you up to boast.’
    new_rendering: Your heart has lifted you up in boastful pride.
    rationale: This is Joash’s diagnosis, not part of Amaziah’s quoted boast; the wording clarifies self-exaltation while preserving the image of being lifted up.
  - source_phrase: לָמָּה תִתְגָּרֶה בְּרָעָה וְנָפַלְתָּ
    prior_rendering: Why should you provoke disaster, so that you fall
    new_rendering: Why invite disaster and bring yourself down
    rationale: The natural English idiom conveys reckless provocation and its consequence while retaining the contrast between self-exaltation and downfall.
