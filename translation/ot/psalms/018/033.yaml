id: PSA.18.33
reference: Psalms 18:33
source:
  edition: WLC
  text: מְשַׁוֶּ֣ה רַ֭גְלַ/י כָּ/אַיָּל֑וֹת וְ/עַ֥ל בָּ֝מֹתַ֗/י יַעֲמִידֵֽ/נִי׃
translation:
  text: He makes me as sure-footed as a deer[a] and sets me securely on my heights.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'makes my feet like those of female deer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁוֶּה
  chosen: makes
  alternatives:
  - equips
  - makes equal
  - makes like
  lexicon: HALOT
  rationale: The Piel participle from שוה here expresses causing or making the psalmist’s feet to be like something. 'Makes' is natural English and fits the comparative phrase that follows without overtranslating.
- source_word: רַגְלַי
  chosen: my feet
  alternatives:
  - my legs
  lexicon: HALOT
  rationale: The dual/plural noun רֶגֶל commonly means 'foot/feet.' 'My feet' is the standard and contextually appropriate rendering in a movement/agility image.
- source_word: כָּאַיָּלוֹת
  chosen: like a deer’s
  alternatives:
  - like does
  - like hinds
  - like deer
  lexicon: HALOT
  rationale: An English generic singular gives a natural comparison; the note preserves the Hebrew plural feminine reference.
- source_word: וְעַל
  chosen: and ... on
  alternatives:
  - and upon
  lexicon: HALOT
  rationale: The conjunction plus preposition straightforwardly links the second clause. 'On' is modern and sufficiently formal.
- source_word: בָּמוֹתַי
  lemma: בָּמוֹת
  chosen: my heights
  alternatives:
  - my high places
  - the heights
  lexicon: HALOT
  rationale: בָּמוֹת literally means 'high places/heights.' In this poetic context it refers to elevated places where one stands securely, not necessarily cultic high places. 'My heights' preserves the first-person suffix and the poetic imagery.
- source_word: יַעֲמִידֵנִי
  chosen: sets me secure
  alternatives:
  - sets me
  - makes me stand
  - causes me to stand
  - establishes me
  lexicon: HALOT
  rationale: The Hiphil of עמד means to cause to stand or set in place. Because the image is of stable footing on heights, 'sets me secure' brings out the causative and the result of firm standing in clear English without losing the metaphor.
