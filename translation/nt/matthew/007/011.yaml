  to: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him?
  rationale: The construction 'how much more will...' forms a rhetorical question in English and should end with a question mark, regardless of the punctuation in the provided Greek source text. While 'being evil' is a literal rendering of the participle, the English phrasing 'being [adjective]' often carries a causal sense ('because you are evil'), which could obscure the clearly concessive meaning ('although you are evil') intended here.
