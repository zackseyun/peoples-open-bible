theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Sense of הוֹשִׁיעָה לּוֹ in relation to God's own arm
  chosen_reading: his right hand and his holy arm have brought him victory
  alternative_readings:
  - his right hand and his holy arm have saved him
  - his right hand and his holy arm have won salvation for him
  rationale: The Hebrew can be rendered more literally as 'saved for him' or 'won salvation for him,' but in this poetic context the sense is that the LORD's own power has achieved victory/deliverance. 'Victory' communicates the result clearly in modern English while preserving the theological point that salvation is accomplished by God's own power, not by another.
