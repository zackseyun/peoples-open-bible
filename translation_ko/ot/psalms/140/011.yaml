translation:
  language: ko
  text: 혀를 함부로 쓰는 사람은 땅에서 굳게 자리 잡지 못합니다.[a] 폭력의 사람은 악이 그를 사냥하여 거듭 밀어 넘어뜨릴 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘혀의 사람’. 또는 ‘중상하는 사람’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 마지막 말은 드문 복수형이며, ‘거듭 밀침’, ‘거듭된 타격’ 또는 ‘파멸’로 이해될 수 있습니다. 또한 일부는 이 절을 ‘악한 폭력의 사람을 사냥할 것이다’로 이해합니다.
    reason: lexical_alternative
