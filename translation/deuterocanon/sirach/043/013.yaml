lexical_decisions:
- source_word: גבורתו
  chosen: by his might
  alternatives:
  - by his strength
  - through his power
  lexicon: HALOT
  rationale: 'The noun denotes strength/might. Rendering with the preposition ''by'' reflects the instrumental sense in context: the action happens through God''s power.'
- source_word: תתוה
  chosen: he marks out
  alternatives:
  - he traces
  - he directs
  - he appoints
  lexicon: HALOT
  rationale: The Hebrew verb is somewhat rare/uncertain here. From the Hebrew witness alone it suggests marking out or tracing; the Greek parallel speaks of hastening lightning, which supports an active divine control over lightning. 'Marks out' preserves the Hebrew image while still fitting the context of ordered weather phenomena.
- source_word: ברק
  chosen: the lightning
  alternatives:
  - lightning
  - lightning bolt
  lexicon: HALOT
  rationale: Standard Hebrew term for lightning/flash. The article in English is natural for the phenomenon as a class.
- source_word: ותנצח
  chosen: he makes ... prevail
  alternatives:
  - he strengthens
  - it overcomes
  - he sends forth victoriously
  lexicon: HALOT
  rationale: From נצח in the sense of being preeminent/prevailing. Because the subject is God's action over storm phenomena, a causative English rendering best fits the line's parallelism.
- source_word: זיקות
  chosen: the flashes
  alternatives:
  - sparks
  - lightnings
  - bolts
  lexicon: HALOT
  rationale: The noun can denote fiery flashes or sparks. In parallel with ברק and with the Greek ἀστραπαί, 'flashes' is the most natural and least over-specific rendering.
- source_word: במרום
  chosen: in the height
  alternatives:
  - on high
  - in the heavens
  - aloft
  lexicon: HALOT
  rationale: Literally 'in the height/on high.' 'In the height' preserves the elevated poetic register and avoids over-interpreting as a fixed cosmological term.
