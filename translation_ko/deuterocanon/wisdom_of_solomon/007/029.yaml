lexical_decisions:
- source_word: εὐπρεπεστέρα
  english_pob_choice: more beautiful
  chosen_korean: 더 아름답고
  alternatives_korean:
  - 더 보기 좋고
  - 더 수려하고
  lexicon: εὐπρεπής
  rationale: 형용사 비교급의 심미적 의미를 살려 ‘더 아름답고’로 옮겼습니다. 문맥상 단순한 외형 우수성보다 빛과 천체를 넘는 광채의 인상을 줍니다.
- source_word: ὑπὲρ πᾶσαν ἄστρων θέσιν
  english_pob_choice: above every arrangement of the stars
  chosen_korean: 별들의 모든 배열보다 더 뛰어나고
  alternatives_korean:
  - 별들의 모든 배치보다 위에 있고
  - 모든 별의 자리보다 뛰어나고
  lexicon: ὑπέρ + θέσις
  rationale: θέσις는 ‘배치, 자리, 배열’의 의미를 가지므로 별들의 질서 있는 배치를 드러내는 ‘배열’로 옮겼습니다. ‘above’는 공간적 우위라기보다 우월성을 나타내어 ‘-보다 더 뛰어나고’로 처리했습니다.
- source_word: προτέρα
  english_pob_choice: earlier
  chosen_korean: 더 앞선 것으로
  alternatives_korean:
  - 더 이른 것으로
  - 먼저인 것으로
  lexicon: πρότερος
  rationale: POB의 수정된 ‘earlier’를 반영해 시간적 선행성을 살렸습니다. 여기서는 ‘더 앞선’이 비교급의 순서/선재를 자연스럽게 드러냅니다.
theological_decisions:
- issue: 지혜를 여성 대명사로 유지할지 여부
  chosen_reading: ‘이는’으로 지혜를 가리키되, 본문이 말하는 지혜의 인격적 의인화는 유지했습니다.
  alternative_readings:
  - ‘그녀는’으로 직접 여성 대명사를 살림
  - ‘그것은’으로 비인격화함
  rationale: 원문 지혜(σοφία)는 문맥상 여성적 의인화를 전제하지만, 한국어 현대문체에서는 지시대명사 ‘이는’이 문맥상 자연스럽고 과도한 성별화를 피하면서도 인격화된 지혜를 해치지 않습니다.
  doctrine_reference: 지혜서의 문학적 의인화
