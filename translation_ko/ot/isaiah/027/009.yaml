  rationale: 원문의 속죄와 죄 제거의 관계를 자연스러운 한국어로 명료하게 표현하고, חַמָּנִים의 통상적 의미를 반영하여 ‘분향 제단’을 ‘태양 기둥들’로 바로잡았습니다. 아세라 기둥과 태양 기둥이 더 이상 서지 못한다는 부정 표현은 לֹא יָקֻמוּ를 반영합니다.
