  from: Arise[a], go to Nineveh, the great city, and cry out against it[b], because their evil has come up before me.
  to: “Get up and go to Nineveh, the great city, and proclaim judgment against it, because the wickedness of its people has come up before me.”
  rationale: The lexical and theological records support a proclamation of judgment while retaining Nineveh's greatness and the image of wickedness rising before God. I make the proclamation and the inhabitants' identity explicit without replacing that image with a mere statement of awareness.
