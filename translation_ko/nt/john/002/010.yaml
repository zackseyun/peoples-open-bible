review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 정확합니다. μεθυσθῶσιν을 ‘취하게 되면’으로 직설적으로 옮긴 점과 τετήρηκας를 완료의 결과를 살려 ‘남겨 두었습니다’로 옮긴 점이 적절합니다. 다만 τὸν ἐλάσσω는 문맥상 생략된 ‘포도주’를 가리키므로, ‘더 못한 것’보다 ‘그보다 못한 포도주’가 비교 관계와 지시 대상을 더 분명히 보존합니다.
  naturalness: 합쇼체의 서술과 직접화법은 자연스럽습니다. ‘그 다음에’는 표준 표기인 ‘그다음에’로 다듬는 것이 좋습니다. ‘그보다 못한 포도주’는 혼인 잔치 문맥에서 무엇을 내놓는지 명확히 하면서도 자연스럽습니다.
  terminology: ‘좋은 포도주’, ‘취하게 되면’, ‘남겨 두었습니다’는 원문의 의미와 현대 표준 한국어에 잘 맞습니다. Πᾶς ἄνθρωπος를 ‘모든 사람’으로 처리한 것은 성별을 한정하지 않는 일반적 단수의 뜻을 적절히 전달합니다.
  issues:
  - severity: low
    issue: τὸν ἐλάσσω의 지시 대상이 ‘것’으로만 표현됨
    rationale: 그리스어에서는 οἶνον이 생략되어 있으나 바로 앞의 포도주를 가리킵니다. 한국어에서는 ‘그보다 못한 포도주’로 밝혀 주면 품질의 비교급 의미와 문맥상 생략된 명사를 분명히 전달할 수 있습니다.
  - severity: low
    issue: ‘그 다음에’ 띄어쓰기
    rationale: 의존 명사 결합인 ‘그다음’의 표준 표기는 붙여 씁니다.
  - severity: low
    issue: 각주 a의 대안 표현이 다소 부자연스러움
    rationale: ‘충분히 마실 때’는 원문의 완료적 상황과 시간 관계를 충분히 드러내지 못합니다. 가능한 완곡적 대안을 제시하되 ‘실컷 마신 뒤에’처럼 자연스럽게 표현하는 편이 낫습니다.
  revised_text: 그가 그에게 말하였습니다. 「모든 사람[b]은 먼저 좋은 포도주를 내놓고, 사람들이 취하게 되면[a] 그다음에는 그보다 못한 포도주를 내놓습니다. 그러나 당신은 지금까지 좋은 포도주를 남겨 두었습니다。」
  revised_footnotes:
  - marker: a
    text: 또는 ‘취하면’ 또는 ‘실컷 마신 뒤에’로도 옮길 수 있습니다. 그리스어 동사는 통상 ‘취하게 되다’를 뜻하므로, 본문은 취함을 직설적으로 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ‘Πᾶς ἄνθρωπος’는 일반적인 단수 표현으로 사람들을 가리키며, 남성만을 뜻하지 않습니다.
    reason: cultural_note
  revision_rationale: 원문의 비교급 ἐλάσσω가 문맥상 ‘좋은 포도주보다 못한 포도주’를 뜻함을 분명히 하고, 표준 표기와 각주의 자연스러운 표현을 보완했습니다. 취함에 관한 원문의 직설성, 일반적 인칭, 완료형이 나타내는 ‘지금까지 남겨 둠’의 의미는 유지했습니다.
