id: PSA.121.8
reference: Psalms 121:8
source:
  edition: WLC
  text: יְֽהוָ֗ה יִשְׁמָר צֵאתְ/ךָ֥ וּ/בוֹאֶ֑/ךָ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־־׃
translation:
  text: Yahweh will keep you as you go out and come in, from now on and forever.
  philosophy: dynamic
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: יִשְׁמָר
  chosen: will keep
  alternatives:
  - will guard
  - will watch over
  - will preserve
  lexicon: HALOT
  rationale: שׁמר commonly denotes keeping, guarding, or watching over. 'Will keep' preserves the lexical link with the repeated use of this verb throughout Psalm 121 and is natural modern English.
- source_word: צֵאתְךָ
  chosen: your going out
  alternatives:
  - your departure
  - your outgoing
  lexicon: HALOT
  rationale: The infinitive construct with 2ms suffix is rendered formally as 'your going out.' This preserves the Hebrew merism when paired with 'your coming in' and avoids over-specifying a single departure event.
- source_word: וּבוֹאֶךָ
  chosen: and your coming in
  alternatives:
  - and your arrival
  - and your coming
  lexicon: HALOT
  rationale: Paired with 'your going out,' this forms a merism for the whole course of one's movements or daily life. 'Coming in' keeps the parallelism and concrete imagery of the Hebrew.
- source_word: מֵעַתָּה
  chosen: from now
  alternatives:
  - from this time
  - from now on
  lexicon: HALOT
  rationale: Means 'from now' or 'from this time.' 'From now' is concise and idiomatic; the continuing force is completed by the following phrase 'and forever.'
- source_word: וְעַד עוֹלָם
  chosen: and forever
  alternatives:
  - even forevermore
  - and unto eternity
  - and until forever
  lexicon: HALOT
  rationale: עוֹלָם here expresses unbounded future duration. 'And forever' is clear modern English and fits the poetic cadence without archaic wording.
