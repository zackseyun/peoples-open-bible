    issue: ‘용맹으로부터’라는 직역적 연결
    rationale: ἀπό는 논거·근거의 출처를 나타내지만, 한국어에서는 ‘용맹을 통해’ 또는 ‘용맹에서’가 더 자연스럽고 의미도 정확합니다.
  - severity: low
    issue: 각주가 본문과 동일한 의미를 반복함
    rationale: ‘덕을 위해’가 이미 충실하고 자연스러워 대체 독법 각주가 필요하지 않습니다.
