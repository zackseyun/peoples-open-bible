base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/018.yaml
  text: The sound of your thunder was in the whirlwind[a]; lightning lit up the world; the earth trembled and quaked.
  footnotes:
  - marker: a
    text: Or 'in the wheel'; the Hebrew likely evokes a whirling storm, hence 'in the whirlwind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 천둥 소리가 회오리바람 속에서 울렸고, 번개들이 세상을 밝혔습니다. 땅이 떨며 흔들렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회오리바람’으로 옮긴 말은 직역하면 ‘바퀴’일 수 있습니다. 여기서는 천둥과 번개의 문맥상 소용돌이치는 폭풍을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרְמוּ מַיִם
  english_pob_choice: The clouds poured out water
  chosen_korean: 물들이 구름에서 쏟아져 나왔으며
  alternatives_korean:
  - 물이 흘러나왔으며
  - 물이 쏟아졌으며
  lexicon: HALOT
  rationale: 동사는 물이 거세게 흘러나오거나 쏟아지는 동작을 가리키므로, 시적 폭포감과 폭우 이미지를 살려 ‘쏟아져 나왔습니다’로 옮겼습니다.
- source_word: עָבוֹת
  english_pob_choice: the clouds
  chosen_korean: 구름
  alternatives_korean:
  - 짙은 구름
  - 먹구름
  lexicon: HALOT
  rationale: ‘짙은’이라는 성격은 문맥상 분명하지만, 본문은 간결한 평행법을 이루므로 기본 명사 ‘구름’으로 옮기고 그 농밀함은 시적 상황이 드러내게 했습니다.
- source_word: קוֹל נָתְנ֣וּ שְׁחָקִ֑ים
  english_pob_choice: the skies gave forth a sound
  chosen_korean: 하늘이 소리를 냈습니다
  alternatives_korean:
  - 하늘이 소리를 내었습니다
  - 하늘이 우렁차게 울렸습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역인 ‘소리를 주다’를 한국어로 자연스럽게 풀어, 천둥 같은 울림을 과도하게 특정하지 않으면서도 본문의 표현을 보존했습니다.
- source_word: אַף חֲצָצֶיךָ יִתְהַלָּכוּ
  english_pob_choice: indeed, your arrows moved about
  chosen_korean: 참으로 주의 화살들이 이리저리 다녔습니다
  alternatives_korean:
  - 참으로 주의 번개 화살들이 이리저리 다녔습니다
  - 또한 주의 번개가 이리저리 번쩍였습니다
  lexicon: HALOT
  rationale: 히브리어 표면 의미는 ‘화살’이므로 본문에는 그대로 두되, ‘이리저리 다녔습니다’로 움직임을 살려 폭풍 신현의 역동성을 유지했습니다.
theological_decisions:
- issue: ‘화살들’의 문자적 표현과 폭풍 신현적 의미
  chosen_reading: 본문에는 ‘주의 화살들’로 두고, 자연현상과 연결되는 해석을 본문 안에서 과잉 설명하지 않았습니다.
  alternative_readings:
  - ‘주의 번개 화살들’로 직접 풀어 쓰기
  - ‘주의 번개’로 의미를 정리하기
  rationale: 시적 본문은 표면 이미지와 신현적 함의를 함께 유지하는 것이 중요하므로, 어휘적 긴장을 해소하지 않고 독자가 문맥에서 번개 이미지를 읽어내도록 남겨 두었습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
