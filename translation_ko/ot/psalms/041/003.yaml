translation:
  language: ko
  text: 야훼께서는 병상에서 그를 붙들어 주십니다. 그가 앓을 때에, 주께서는 그의 침상을 온전히 돌보아 주십니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 앓을 때에 그의 침상 전체를 돌리십니다.’ 히브리어 동사는 문자적으로 ‘돌리다, 뒤집다’이며, 여기서는 병든 이를 침상에서 돌보거나 회복시키는 일을 가리키는 관용적 표현으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC / 표준 학술 표기
  rationale: 테트라그라마톤은 전통적 대치어가 아니라 고유명사 음역으로 처리하여, 원문이 드러내는 하나님의 이름을 보존했습니다.
- source_word: יִשְׁמְרְהוּ
  english_pob_choice: will keep him
  chosen_korean: 그를 지키시고
  alternatives_korean:
  - 그를 보살피시고
  - 그를 보호하시고
  lexicon: HALOT
  rationale: שׁמר는 ‘지키다, 보호하다’의 뜻이므로, 문맥상 간결하고 자연스러운 ‘지키시고’로 옮겼습니다.
- source_word: וִיחַיֵּהוּ
  english_pob_choice: and preserve his life
  chosen_korean: 그의 생명을 보존하십니다
  alternatives_korean:
  - 그를 살리십니다
  - 그의 생명을 지키십니다
  lexicon: HALOT
  rationale: חיה의 사역적 의미인 ‘살아 있게 하다, 생명을 보존하다’를 살려, 앞의 ‘지키다’와 구별되는 생명 보존의 뉘앙스를 반영했습니다.
- source_word: יאשר
  english_pob_choice: he will be blessed
  chosen_korean: 그가 복을 받으리니
  alternatives_korean:
  - 그가 복되다 일컬음을 받으리니
  - 그가 복을 받으리라
  lexicon: HALOT
  rationale: 문맥상 יאשר는 단순 상태보다 ‘복되다/복을 받다’로 선언되는 뉘앙스를 가지므로, 한국어에서는 자연스럽게 ‘복을 받다’로 옮겼습니다.
- source_word: בָּאָרֶץ
  english_pob_choice: in the land
  chosen_korean: 땅에서
  alternatives_korean:
  - 그 땅에서
  - 그 나라에서
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 거주 영역을 가리키는 ‘land’로 보이며, 한국어로는 시적이고 포괄적인 ‘땅’이 가장 무난합니다.
- source_word: וְאַל תִּתְּנֵהוּ
  english_pob_choice: and may you not give him over
  chosen_korean: 그를 넘기지 마소서
  alternatives_korean:
  - 그를 내주지 마소서
  - 그를 맡기지 마소서
  lexicon: HALOT
  rationale: נתן의 여기서의 관용적 용법은 적대자에게 ‘넘기다/내주다’의 뜻이므로, 기도체에 맞는 직접 청유로 옮겼습니다.
- source_word: בְּנֶפֶשׁ אֹיְבָיו
  english_pob_choice: to the desire of his enemies
  chosen_korean: 그의 원수들의 뜻에
  alternatives_korean:
  - 그의 원수들의 욕망에
  - 그의 원수들의 의지에
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 ‘영혼’이 아니라 ‘뜻, 욕구, 바람’의 관용적 의미이므로, 더 자연스럽고 의미가 분명한 ‘뜻’으로 옮겼습니다.
theological_decisions:
- issue: '후반부의 화자 전환: 서술에서 기도로의 이동'
  chosen_reading: 앞 절반은 야훼의 보존 행위를 선언하고, 마지막은 하나님께 직접 드리는 청유형 기도로 유지했습니다.
  alternative_readings:
  - 마지막도 계속 3인칭 서술로 평탄화하는 번역
  rationale: 히브리어의 2인칭 부정 청유를 살려, 시편의 기도적 긴장과 직접성을 보존했습니다.
  doctrine_reference: 원문 형식 보존; 기도문에서의 직접 호칭 유지
- issue: ‘복을 받다’의 수동적 선언
  chosen_reading: ‘그가 복을 받으리니’로 두어, 타인이 그를 복되다고 여기는 선언성과 실제 축복의 의미를 함께 살렸습니다.
  alternative_readings:
  - 그가 복되다고 불리리니
  - 그가 행복하리니
  rationale: יאשר의 선언적 성격을 지나치게 심리적 상태로 축소하지 않으면서도, 한국어 시적 문맥에 자연스럽게 맞췄습니다.
  doctrine_reference: 시편의 축복 선언 표현 보존
