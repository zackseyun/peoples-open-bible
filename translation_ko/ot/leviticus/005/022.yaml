  source_fidelity: ‘주워 놓고’는 מָצָא(발견하다/찾다)에 없는 ‘습득하여 보관하다’의 의미를 더하며, ‘숨기며’는 בָּהּ와 함께 쓰인 כחש(그것에 관하여 거짓말하다/부인하다)를 지나치게 좁힙니다. 또한 마지막 절은 앞선 맹세가 ‘죄를 짓는 모든 행위 가운데 어느 하나에 관하여’ 이루어진다는 범위를 나타냅니다.
  naturalness: 수정문은 법조문적 병렬을 유지하면서도 현대 표준 한국어로 자연스럽습니다. ‘그것에 관하여’와 ‘어느 하나에 관하여’는 각각 원문의 전치사 בָּהּ와 עַל אַחַת의 지시 대상을 분명히 합니다.
  terminology: אֲבֵדָה는 ‘잃어버린 물건’으로, כחש는 중립적으로 ‘거짓말하다’로 옮겼습니다. אדם은 법문맥의 일반적 사람을 뜻하므로 ‘사람’으로 번역했습니다. ‘거짓으로 맹세하다’는 נשבע על שקר를 충실히 반영합니다.
