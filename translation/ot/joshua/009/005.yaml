  - source_phrase: וּנְעָלוֹת ... בְּרַגְלֵיהֶם וּשְׂלָמוֹת ... עֲלֵיהֶם
    prior_rendering: They had worn-out and patched sandals on their feet, and worn-out clothes on themselves
