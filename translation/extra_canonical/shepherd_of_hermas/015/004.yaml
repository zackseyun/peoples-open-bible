translation:
  text: So she finished the explanation of the tower. But, becoming bold again, I questioned her further whether all these stones that were cast away and did not fit into the building of the tower—whether there is reorientation[a] for them and whether they have a place in this tower. “They have reorientation,” she says, “but they cannot fit into this tower.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
