  text: On you I was cast from the womb; from my mother’s belly you are my God.[a]
  footnotes:
  - marker: a
    text: Or “from my mother’s womb.” Hebrew uses a different word here from the word rendered “womb” in the preceding line.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신께 내가 태에서부터 내던져졌고, 어머니의 배에서부터 당신은 내 하나님이십니다.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: עָלֶיךָ
  english_pob_choice: Upon you
  chosen_korean: 당신께
  alternatives_korean:
  - 당신 위에
  - 당신에게
  lexicon: HALOT
  rationale: עַל+2인칭 접미사는 여기서 의지와 맡김의 방향을 드러내므로, 한국어에서는 ‘당신께’로 옮겨 의존적 관계를 자연스럽게 살렸습니다.
- source_word: הָשְׁלַכְתִּי
  english_pob_choice: I was cast
  chosen_korean: 내던져졌고
  alternatives_korean:
  - 던져졌고
  - 던져져 있었고
  - 맡겨졌고
  lexicon: HALOT
  rationale: 원문의 피동적 이미지와 강한 투사를 유지하기 위해 ‘내던져졌고’를 택했습니다. ‘맡겨졌고’는 의미는 부드럽지만 동사의 생생한 비유를 약화시킵니다.
- source_word: מֵרָחֶם / מִבֶּטֶן אִמִּי
  english_pob_choice: from the womb / from my mother's belly
  chosen_korean: 태에서 / 어머니의 배에서
  alternatives_korean:
  - 태에서 / 어머니의 태에서
  - 모태에서 / 어머니의 배에서
  lexicon: HALOT
  rationale: רֶחֶם과 בֶּטֶן의 어휘 차이를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 각각 ‘태’와 ‘배’를 대응시켰습니다. 영어 POB가 유지한 구별을 한국어에서도 반영했습니다.
- source_word: אֵלִי אָתָּה
  english_pob_choice: you have been my God
  chosen_korean: 당신은 내 하나님이십니다
  alternatives_korean:
  - 당신은 내 하나님이셨습니다
  - 당신은 내 하나님이십니다
  lexicon: HALOT
  rationale: 히브리어는 계사 생략문이므로 현재형으로도 읽을 수 있어, 하나님과의 지속적 관계를 드러내는 현재형을 택했습니다. 존칭은 하나님께 직접 고백하는 문맥에 맞춰 유지했습니다.
theological_decisions:
- issue: 문법상 계사 생략절의 시제 처리
  chosen_reading: 현재형 ‘당신은 내 하나님이십니다’
  alternative_readings:
  - 과거지속형 ‘당신은 내 하나님이셨습니다’
  - 완료형 ‘당신은 내 하나님이 되어 오셨습니다’
  rationale: 원문 אֵלִי אָתָּה는 문자적으로는 ‘내 하나님, 당신’에 해당하는 무계사 절입니다. 시제를 과도하게 고정하기보다, 태에서부터 이어진 관계라는 문맥을 따라 현재형으로 옮겨 지속성을 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
