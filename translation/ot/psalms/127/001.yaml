  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Sense of בַיִת in wisdom context
  chosen_reading: house
  alternative_readings:
  - household
  - dynasty
  rationale: The Hebrew term can extend beyond a physical structure, but the immediate poetic parallel with 'city' and 'watchman' supports the concrete image in the main text. Broader metaphorical application is left to interpretation rather than imported into the translation.
