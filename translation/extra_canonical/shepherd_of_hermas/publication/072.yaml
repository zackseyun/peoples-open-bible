source:
  edition: 'POB selected working Greek: Lightfoot-Harmer1891 with bounded Athos sinners noun (2026-11-04)'
  text: Μετὰ τὸ πάντων κατανοῆσαι τὰς ῥάβδους [τὸν ποιμένα] λέγει μοι· Εἶπόν σοι ὅτι τὸ δένδρον τοῦτο
    φιλόζωόν ἐστι. βλέπεις, φησί, πόσοι μετενόησαν καὶ ἐσώθησαν; Βλέπω, φημί, κύριε. Ἵνα ἴδῃς, φησί, τὴν
    πολυευσπλαγχνίαν τοῦ Κυρίου, ὅτι μεγάλη καὶ ἔνδοξός ἐστι, καὶ ἔδωκε πνεῦμα τοῖς ἀξίοις οὖσι μετανοίας.
    2. Διατί οὖν, φημί, κύριε, πάντες οὐ μετενόησαν; Ὧν εἶδε, φησί, τὴν καρδίαν μέλλουσαν καθαρὰν γενέσθαι
    καὶ δουλεύειν αὐτῷ ἐξ ὅλης καρδίας, τούτοις ἔδωκε τὴν μετάνοιαν· ὧν δὲ εἶδε τὴν δολιότητα καὶ πονηρίαν,
    μελλόντων ἐν ὑποκρίσει μετανοεῖν, ἐκείνοις οὐκ ἔδωκε μετάνοιαν, μήποτε πάλιν βεβηλώσωσι τὸ ὄνομα αὐτοῦ.
    3. λέγω αὐτῷ· Κύριε, νῦν οὖν μοι δήλωσον τοὺς τὰς ῥάβδους ἐπιδεδωκότας, ποταπός τις αὐτῶν ἐστι, καὶ
    τὴν τούτων κατοικίαν, ἵνα ἀκούσαντες οἱ πιστεύσαντες καὶ εἰληφότες τὴν σφραγῖδα καὶ τεθλακότες αὐτὴν
    καὶ μὴ τηρήσαντες ὑγιῆ, ἐπιγνόντες τὰ ἑαυτῶν ἔργα μετανοήσωσι, λαβόντες ὑπὸ σοῦ σφραγῖδα, καὶ δοξάσωσι
    τὸν Κύριον, ὅτι ἐσπλαγχνίσθη ἐπ᾿ αὐτοὺς καὶ ἀπέστειλέ σε τοῦ ἀνακαινίσαι τὰ πνεύματα αὐτῶν. 4. Ἄκουε,
    φησίν· ὧν αἱ ῥάβδοι ξηραὶ καὶ βεβρωμέναι ὑπὸ σητὸς εὑρέθησαν, οὗτοί εἰσιν οἱ ἀποστάται καὶ προδόται
    τῆς ἐκκλησίας καὶ βλασφημήσαντες ἐν ταῖς ἁμαρτίαις αὐτῶν τὸν Κύριον, ἔτι δὲ καὶ ἐπαισχυνθέντες τὸ
    ὄνομα Κυρίου τὸ ἐπικληθὲν ἐπ᾿ αὐτούς. οὗτοι οὖν εἰς τέλος ἀπώλοντο τῷ Θεῷ. βλέπεις δὲ ὅτι οὐδὲ εἷς
    αὐτῶν μετενόησε, καίπερ ἀκούσαντες τὰ ῥήματα ἃ ἐλάλησας αὐτοῖς, ἃ σοὶ ἐνετειλάμην· ἀπὸ τῶν τοιούτων
    ἡ ζωὴ ἀπέστη. 5. οἱ δὲ τὰς ξηρὰς καὶ ἀσήπτους ἐπιδεδωκότες, καὶ οὗτοι ἐγγὺς αὐτῶν· ἦσαν γὰρ ὑποκριταὶ
    καὶ διδαχὰς ξένας εἰσφέροντες καὶ ἐκστρέφοντες τοὺς δούλους τοῦ Θεοῦ, μάλιστα δὲ τοὺς ἡμαρτηκότας,
    μὴ ἀφιέντες μετανοεῖν αὐτούς, ἀλλὰ ταῖς διδαχαῖς ταῖς μωραῖς πείθοντες αὐτούς. οὗτοι οὖν ἔχουσιν ἐλπίδα
    τοῦ μετανοῆσαι. 6. βλέπεις δὲ πολλοὺς ἐξ αὐτῶν καὶ μετανενοηκότας ἀφ᾿ ἧς ἐλάλησας αὐτοῖς τὰς ἐντολάς
    μου· καὶ ἔτι μετανοήσουσιν. ὅσοι δὲ οὐ μετανοήσουσιν, ἀπώλεσαν τὴν ζωὴν αὐτῶν· ὅσοι δὲ μετενόησαν
    ἐξ αὐτῶν, ἀγαθοὶ ἐγένοντο καὶ ἐγένετο ἡ κατοικία αὐτῶν εἰς τὰ τείχη τὰ πρῶτα· τινὲς δὲ καὶ εἰς τὸν
    πύργον ἀνέβησαν. βλέπεις οὖν, [φησίν,] ὅτι ἡ μετάνοια τῶν ἁμαρτωλῶν ζωὴν ἔχει, τὸ δὲ μὴ μετανοῆσαι
    θάνατον.
