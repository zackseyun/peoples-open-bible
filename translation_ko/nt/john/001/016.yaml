- from: 이는 그의 충만에서 우리 모두가 받았고[a], 은혜가 은혜로 대신되었습니다.
  to: 이는 우리 모두가 그의 충만함에서 은혜 대신 은혜를 받았기 때문입니다.[a]
  rationale: 원문의 단회적 수령(ἐλάβομεν)을 한국어 과거 표현 ‘받았기 때문입니다’로 반영하고, ‘은혜 대신 은혜’를 그 수령의 내용으로 연결했습니다. 이 번역은 ἀντί의 기본 의미를 보존하면서도, 그것이 연속적 은혜를 뜻할 수 있다는 해석적 여지를 각주에 남깁니다. ‘이는 … 때문입니다’는 문맥상 설명적·근거적 ὅτι를 자연스러운 현대 합쇼체로 표현합니다.
  reviewer_model: gpt-5.6-terra
