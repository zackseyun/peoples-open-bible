translation:
  text: “Then they will rejoice with joy and be glad in the holy place. They will enter, with its fragrance in their
    bones.[a] They will live a long life on the earth, as your ancestors lived; in their days sorrow, weariness,
    suffering, and scourging will not touch them.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The holy place supplies the place understood with selected holy. The difficult next construction is rendered
      with people as the continuing subject of enter, not with an unmarked causative bring. With is supplied to
      connect the following fragrance/bones phrase; this remains an uncertain construction, not a fully restored
      earlier text. Charles p64 notes5–6 discusses entering/bringing forms and interprets ሎቱ as its, reflecting
      a Greek genitive, rather than for him; this is an explicit syntactic interpretation, not a changed Geʽez reading.
      The raised apparatus reference7 after በ is not an Ethiopic seven and is excluded from the text.
    reason: alternative_reading
