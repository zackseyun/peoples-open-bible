review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 πρὸς αὐτόν의 αὐτόν은 예수를 가리키므로, 한국어 재귀 표현인 ‘자신에게’가 문맥상 나다나엘을 가리킬 여지를 없애는 것이 좋습니다. 또한 ἐν ᾧ δόλος οὐκ ἔστιν의 관계절은 ‘속임수가 없는’으로 자연스럽고 충실하게 표현할 수 있습니다.
  naturalness: 초안의 ‘말씀하시되’는 현대 표준 합쇼체 서술에서는 다소 문어적·고풍스럽습니다. ‘말씀하셨습니다’와 ‘그를 두고’를 사용하면 자연스럽고, 직접화법의 격식도 유지됩니다.
  terminology: ‘나다나엘’, ‘예수께서’, ‘이스라엘 사람’은 적절합니다. δόλος는 여기서 ‘속임수’가 자연스러우며 원문의 기만·간계의 뜻을 보존합니다. ‘보십시오’는 Ἴδε의 주의 환기 기능을 현대 정중체로 잘 반영합니다.
  issues:
  - severity: low
    issue: ‘자신에게’의 지시 대상이 잠재적으로 모호합니다.
    rationale: 원문의 αὐτόν은 예수를 가리킵니다. 한국어 재귀어 ‘자신’은 가까운 주어인 나다나엘과 연결되어 읽힐 가능성이 있으므로 ‘예수께로’가 더 명료합니다.
  - severity: low
    issue: ‘말씀하시되’가 현대 합쇼체의 자연스러운 종결 서술과 다소 어긋납니다.
    rationale: 의미 오류는 없지만, ‘그를 두고 말씀하셨습니다’가 περὶ αὐτοῦ λέγει를 더 자연스러운 현대 정중체로 옮깁니다.
  revised_text: 예수께서 나다나엘이 예수께로 다가오는 것을 보시고, 그를 두고 말씀하셨습니다. “보십시오, 참으로 속임수가 없는 이스라엘 사람입니다.”
