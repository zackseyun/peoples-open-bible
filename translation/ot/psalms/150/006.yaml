- issue: Rendering the divine name in its short poetic form יָהּ
  chosen_reading: Yah
  alternative_readings:
  - the LORD
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Whether to preserve the traditional liturgical form 'Hallelujah'
  chosen_reading: Translate as 'Praise Yah!' in the main text
  alternative_readings:
  - Hallelujah!
  rationale: Optimal equivalence and original-language primacy favor translating the imperative phrase rather than leaving it as a familiar transliteration. Because 'Hallelujah' is deeply embedded in English Christian usage, it is preserved in a footnote as a lexical alternative.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §1, §6'
