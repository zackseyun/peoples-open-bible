  source_fidelity: 헬라어의 대조 구조(무리는 계속 간청함, 왕 주변의 장로들은 왕의 결심을 바꾸려 애씀)와 핵심 어휘는 대체로 충실합니다. 다만 τούτοις는 문맥상 무리가 그들에게 청원하는 대상을 가리키므로, ‘그들과 함께하며’는 동반 행동처럼 읽힐 수 있습니다. 또한 ‘음모에서 돌려세우다’보다 음모를 그만두게 하려는 목적을 명시하는 표현이 자연스럽고 정확합니다.
  naturalness: ‘그들과 함께하며 간청하였고’는 한국어에서 의미 관계가 다소 불분명합니다. ‘이들에게 전과 같이 계속 간청하였고’와 ‘음모를 그만두도록 … 마음을 돌이키려’가 현대 표준 한국어 합쇼체에서 더 명료하고 자연스럽습니다.
  terminology: πρεσβύτεροι의 ‘장로들’, ἀγέρωχος의 ‘오만한’, ἐπιβουλή의 ‘음모’는 적절합니다. περὶ τὸν βασιλέα는 단순한 물리적 주변보다 궁정의 측근·원로 집단을 뜻할 수 있으므로 ‘왕 주변에 있던 장로들’로 옮기면 문맥에 맞습니다.
