theological_decisions:
- issue: Aspect/tense in poetic description
  chosen_reading: Render the imperfects as present/generic statements ('bear fruit,' 'are')
  alternative_readings:
  - Render as future ('will still bear fruit ... they will be')
  rationale: The verse functions as a general description of the righteous in the psalm's tree imagery rather than a narrowly predictive statement. Present English reads naturally and preserves the proverbial force.
  doctrine_reference: Translation philosophy §6; preserve source sense in readable modern English
revisions:
- timestamp: '2026-04-21T00:27:46Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/092/015.json
  category: awkward_english
  tier: 1
  from: green,
  to: green.
  rationale: The verse as presented is a complete grammatical unit, corresponding to the Hebrew verse which ends with a soph pasuq. Ending the English sentence with a comma makes it grammatically incomplete as a standalone verse. While this punctuation is appropriate if verse 16 follows immediately as a subordinate purpose clause ('to declare...'), when presenting verse 15 on its own, it should conclude with a period to form a complete sentence.
- timestamp: '2026-08-28T22:09:07Z'
  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: lexical
  tier: 1
  from: They still bear fruit in old age[a][b]; they are full of sap and green.
  to: They still bear fruit in old age; they are lush[a] and green[b],
  rationale: In the sustained plant image, “lush” conveys the richness and vigor of דְּשֵׁנִים without specifying the physiological mechanism implied by “full of sap.” The comma appropriately preserves the syntactic and purposive continuation into the following verse, “to declare that Yahweh is upright.” The future sense remains a legitimate alternative for the imperfects.
- timestamp: '2026-11-09T18:44:44Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: They still bear fruit in old age; they are lush[a] and green[b],
  to: They still bear fruit in old age; they are lush and green,
  rationale: The later audit correctly replaced “full of sap” with “lush,” preserving vigorous growth without extra physiological detail. I retain that wording and the comma connecting it to verse 15; the earlier stand-alone punctuation pass carries little weight in this complete passage.
