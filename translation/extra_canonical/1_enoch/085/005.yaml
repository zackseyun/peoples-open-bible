lexical_decisions:
- source_word: ወዝኩ
  chosen: And I saw
  alternatives:
  - And I looked
  - Then I saw
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The form introduces Enoch’s visionary perception. 'And I saw' preserves the recurring dream-vision reporting formula without unnecessary expansion.
- source_word: ጸሊም
  chosen: black
  alternatives:
  - dark
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The adjective denotes blackness/dark coloration. 'Black' is the straightforward rendering and preserves the symbolic color imagery of the Animal Apocalypse.
- source_word: ጣዕዋ
  chosen: wild boar
  alternatives:
  - boar
  - swine
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: In the Animal Apocalypse the animal imagery is specific and should not be flattened. 'Wild boar' best captures an untamed male swine rather than generic 'swine.'
- source_word: ላህቀ
  chosen: that
  alternatives:
  - the
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Taken as a demonstrative/determining element pointing to a specific animal in the vision. 'That' preserves the deictic force better than a simple article.
- source_word: ወመጽአት
  chosen: and it came
  alternatives:
  - and it arrived
  - and it approached
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The verb is from 'to come.' 'And it came' is formally close and keeps the terse, sequential movement of the vision.
