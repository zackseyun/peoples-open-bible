  text: מ֭וּזָר הָיִ֣יתִי לְ/אֶחָ֑/י וְ֝/נָכְרִ֗י לִ/בְנֵ֥י אִמִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/008.yaml
  text: I have become[b] a stranger to my brothers, and a foreigner to my mother's sons[a].
  footnotes:
  - marker: a
    text: Hebrew 'my mother's sons,' a poetic way of referring to close family members, especially brothers.
    reason: cultural_note
  - marker: b
    text: Or 'I was a stranger' / 'I became a stranger.' The Hebrew verb can be rendered with either simple past or ingressive force.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 형제들에게 낯선 사람이 되었고,[a] 내 어머니의 아들들에게는 이방인이 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 내 형제들에게 낯선 사람이었습니다.’ 히브리어 완료형은 이미 이루어진 상태를 나타내며, 문맥에 따라 ‘되었다’ 또는 ‘이었다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 어머니의 아들들에게’입니다. 가까운 남자 형제들을 가리키는 시적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי + עָלֶיךָ
  english_pob_choice: For because of you
  chosen_korean: 정말 당신 때문에
  alternatives_korean:
  - 당신 때문에
  - 당신을 인하여
  - 당신을 위해
  lexicon: HALOT
  rationale: כִּי는 여기서 원인 설명을 이끌고, עָלֶיךָ는 ‘because of you’의 원인/책임 관계를 나타내므로 현대 한국어에서는 자연스러운 원인 표현인 ‘당신 때문에’가 가장 직접적입니다.
- source_word: נָשָׂאתִי
  english_pob_choice: I have borne
  chosen_korean: 내가 치욕을 당하였고
  alternatives_korean:
  - 내가 감당하였고
  - 내가 짊어졌고
  - 내가 견뎌냈고
  lexicon: HALOT
  rationale: נָשָׂא의 ‘지니다/짊어지다’ 이미지를 살리되, ‘reproach’를 한국어에서 더 자연스럽게 받는 동사로 옮기기 위해 ‘치욕을 당하다’를 택했습니다.
- source_word: חֶרְפָּה
  english_pob_choice: reproach
  chosen_korean: 치욕
  alternatives_korean:
  - 모욕
  - 비난
  - 책망
  lexicon: HALOT
  rationale: חֶרְפָּה는 공개적 수치와 모욕을 함께 띠므로, ‘치욕’이 문맥상 가장 강하고 응축된 대응어입니다.
- source_word: כִּסְּתָה כְלִמָּה פָנַי
  english_pob_choice: disgrace has covered my face
  chosen_korean: 수치가 내 얼굴을 덮었습니다
  alternatives_korean:
  - 수치가 내 얼굴을 가렸습니다
  - 치욕이 내 얼굴을 덮었습니다
  - 수치가 내 얼굴을 덮어버렸습니다
  lexicon: HALOT
  rationale: כִּסָּה의 ‘덮다’라는 구체적 이미지를 보존하고, כְלִמָּה는 ‘shame/disgrace’의 공적 수치감을 살려 ‘수치’로 옮겼습니다. ‘얼굴’은 פָּנִים의 문자적 이미지를 유지합니다.
theological_decisions:
- issue: 하나님께 향한 원인절의 해석
  chosen_reading: ‘정말 당신 때문에’로 옮겨, 시편 화자의 수치가 하나님과의 관계/연관에서 비롯되었음을 드러냈습니다.
  alternative_readings:
  - ‘당신을 위해’
  - ‘당신을 인하여’
  rationale: 본문의 עַל은 여기서 단순한 목적보다 원인·연관을 나타내므로, 하나님을 위한 자발적 봉사보다 ‘하나님 때문에 당한 수치’라는 고난의 맥락을 더 직접적으로 전달하는 번역이 필요합니다.
  doctrine_reference: 시편의 탄식과 의인의 고난 모티프
