  from: If it is a matter of strength[a], behold, he is mighty; and if of justice[b], who can summon him?
  to: If it is a matter of strength, look—he is mighty! If it is a matter of judgment, who can summon me[a]?
  rationale: The suffix on יוֹעִידֵנִי is first-person singular, “me.” Rendering it “him” changes the Hebrew object and must be corrected. “Judgment” appropriately retains the judicial category, and the note responsibly explains the range of the difficult legal verb.
