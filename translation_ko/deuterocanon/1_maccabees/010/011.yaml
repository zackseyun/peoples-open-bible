  text: And he told those doing the work to build the walls and Mount Zion all around with squared stones for fortification, and they did so.
translation:
  language: ko
  text: 그는 일을 하는 사람들에게 성벽과 시온 산 둘레에 네모나게 다듬은 돌을 쌓아 방어 시설을 마련하라고 말하였고, 그들은 그렇게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ποιοῦντας τὰ ἔργα
  english_pob_choice: those doing the work
  chosen_korean: 일을 하는 사람들
  alternatives_korean:
  - 공사하는 사람들
  - 일꾼들
  lexicon: ποιοῦντας / ἔργα
  rationale: 진행 중인 작업자들을 가리키므로, 문맥상 자연스러운 현대 한국어로 풀어 옮기되 ‘일꾼들’보다 중립적인 ‘일을 하는 사람들’을 택했습니다.
- source_word: τὰ τείχη
  english_pob_choice: the walls
  chosen_korean: 성벽
  alternatives_korean:
  - 벽들
  - 담장
  lexicon: τεῖχος
  rationale: 예루살렘 방어 시설의 벽을 뜻하므로 일반적인 ‘벽’보다 역사적·군사적 뉘앙스가 분명한 ‘성벽’이 적절합니다.
- source_word: τὸ ὄρος Σιὼν
  english_pob_choice: Mount Zion
  chosen_korean: 시온 산
  alternatives_korean:
  - 시온의 산
  - 시온 언덕
  lexicon: ὄρος Σιών
  rationale: POB의 ‘Mount Zion’을 직역해 ‘시온 산’으로 옮기되, 지리적 고유명사로서의 무게를 유지했습니다.
- source_word: ἐκ λίθων τετραγώνων εἰς ὀχύρωσιν
  english_pob_choice: with squared stones for fortification
  chosen_korean: 사각돌로 사방에 둘러 쌓아 방어 시설로
  alternatives_korean:
  - 다듬은 돌로 요새를 만들기 위해
  - 네모난 돌로 성채를 세우기 위해
  lexicon: λίθων τετραγώνων / ὀχύρωσις
  rationale: τετραγώνων은 ‘네모진/사각의’ 돌을 뜻하므로 ‘사각돌’로 옮겼고, ὀχύρωσις는 단순한 장식이 아니라 방어 목적의 구조물을 가리켜 ‘방어 시설’로 풀었습니다.
theological_decisions:
- issue: 시온 산의 역사적·신학적 지칭
  chosen_reading: ‘시온 산’으로 옮겨 역사적 장소성을 드러내면서도, 본문이 말하는 예루살렘 방어 작업의 상징적 중심을 약화하지 않았습니다.
  alternative_readings:
  - ‘시온의 산’으로 더 직역하는 방법
  - ‘시온 언덕’으로 지형을 완화하는 방법
  rationale: 본문은 성벽 공사와 함께 시온의 방어 강화를 말하므로, 지리적 이름을 보존하는 번역이 가장 직접적입니다.
  doctrine_reference: 성전 산/시온의 역사적 표지에 대한 본문 맥락
