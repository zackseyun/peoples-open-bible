  meaning_decisions:
  - source_phrase: καὶ συνεπισχύειν αὐτοῖς
    prior_rendering: and to strengthen them
    new_rendering: Also support them
    rationale: This continues the decree's commands and requires officials to give practical support, rather than leaving an unattached infinitive or suggesting only personal encouragement.
  - source_phrase: τοὺς ... ἐπιθεμένους αὐτοῖς ἀμύνωνται
    prior_rendering: might defend themselves against those who attacked them
    new_rendering: can defend themselves against those who attack them
    rationale: The decree authorizes defense against attacks on the appointed future date; the Greek participle does not require an attack already past when the letter was issued.
  - source_phrase: τῇ αὐτῇ ἡμέρᾳ
    prior_rendering: on that same day
    new_rendering: the very day set for their destruction
    rationale: The phrase identifies the date from the earlier extermination decree; making that reference explicit carries the intended reversal rather than leaving an unexplained repetition.
