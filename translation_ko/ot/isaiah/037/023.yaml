  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָה קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/023.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel.
translation:
  language: ko
  text: 누구를 모욕하고 모독하였습니까? 누구를 향해 소리를 높이고 눈을 높이 치켜들었습니까? 이스라엘의 거룩하신 분을 향해서입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵרַפְתָּ
  english_pob_choice: mocked
  chosen_korean: 모욕하고
  alternatives_korean:
  - 조롱하고
  - 비난하고
  - 욕보이고
  lexicon: חרף
  rationale: POB가 ‘mocked’를 택해 단순한 reproach보다 공개적 모욕의 뉘앙스를 살렸으므로, 한국어에서는 ‘모욕하다’가 가장 직접적으로 대응합니다.
- source_word: גִדַּפְתָּ
  english_pob_choice: blasphemed
  chosen_korean: 모독하였습니까
  alternatives_korean:
  - 신성모독하였습니까
  - 하나님을 욕되게 하였습니까
  - 저주하였습니까
  lexicon: גדף
  rationale: 동사 גדף는 신성 모독/모독의 의미가 강하므로, 종교적 색채를 유지하면서도 현대 한국어에서 이해하기 쉬운 ‘모독하다’를 사용했습니다.
- source_word: קְד֥וֹשׁ יִשְׂרָאֵֽל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 분
  alternatives_korean:
  - 이스라엘의 거룩하신 이
  - 이스라엘의 거룩하신 분
  - 이스라엘의 거룩한 분
  lexicon: קדושׁ + יִשְׂרָאֵל
  rationale: 전통적 ‘이스라엘의 거룩하신 이’도 가능하지만, 현대 한국어에서는 인격적 호칭을 살리는 ‘거룩하신 분’이 자연스럽고 원문의 존칭적 칭호를 잘 전달합니다.
theological_decisions:
- issue: ‘거룩하신 분’의 칭호를 인격적 호칭으로 유지할지 여부
  chosen_reading: 본문의 마지막 칭호를 ‘이스라엘의 거룩하신 분’으로 옮겨, 단순한 속성 설명이 아니라 하나님 자신을 직접 가리키는 호칭임을 드러냈습니다.
  alternative_readings:
  - 이스라엘의 거룩한 이
  - 이스라엘의 거룩하신 자
  rationale: 이 칭호는 야훼의 고유한 언약적 호칭이므로, 추상화하지 않고 인격적·경칭적 표현으로 유지하는 것이 본문의 신학적 강도를 보존합니다.
  doctrine_reference: 야훼의 거룩하심과 언약적 자기계시
