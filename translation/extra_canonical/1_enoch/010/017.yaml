translation:
  text: And now all the righteous will escape and remain alive until they have a thousand
    children; they will complete all the days of their youth and their old age in
    peace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The expression rendered “old age” uses rest-language; its pairing with “youth”
      suggests the later period of life.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጻድቃን
  chosen: the righteous
  alternatives:
  - the just
  rationale: Preserves the verse’s designation without adding a later doctrinal identity.
- source_word: ይጐይዩ
  chosen: will escape
  alternatives:
  - will flee
  rationale: Conveys deliverance from the surrounding judgment without specifying
    how they escape.
- source_word: ይከውኑ፡ ሕያዋነ
  chosen: remain alive
  alternatives:
  - be alive
  - live
  rationale: Represents the explicit statement that they will be living after their
    escape.
- source_word: ይወልዱ፡ ፲፻
  chosen: have a thousand children
  alternatives:
  - beget a thousand children
  rationale: The numeral is ten hundreds, or one thousand; 'have' avoids imposing
    a gender on the righteous.
- source_word: ሰንበተ፡ ዚአሆሙ
  chosen: their old age
  alternatives:
  - their time of rest
  rationale: The contrast with 'their youth' favors a reference to the later period
    of life, while the source’s rest-language warrants a note.
- source_word: ይፌጽሙ፡ በሰላም
  chosen: will complete ... in peace
  alternatives:
  - will live out ... in peace
  rationale: Keeps the source’s sense of bringing the full span of days to completion.
theological_decisions:
- issue: The scope of the promise to the righteous
  chosen_reading: A promise of survival, abundant children, and peaceful longevity
    within this judgment scene.
  alternative_readings:
  - A universal promise of literal longevity to every righteous person
  rationale: The verse’s imagery is retained without turning its apocalyptic promise
    into a general doctrinal rule.
