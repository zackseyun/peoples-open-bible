lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 지휘자에게
  - 음악감독에게
  - 합창대장에게
  lexicon: HALOT
  rationale: 시편 표제의 לַמְנַצֵּחַ는 예배 음악을 맡은 책임자에게 돌리는 지시로 이해하는 것이 자연스럽습니다. 한국어로는 기능을 드러내면서도 과도하게 해석을 확정하지 않는 ‘지휘자에게’가 가장 간결합니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  - 가락
  lexicon: HALOT
  rationale: 여기서는 장르 표지이므로, 한국어 표제에서는 짧고 기능적인 ‘시’로 옮겨 표제의 성격을 살렸습니다. 본문 서술이 아니라 표제이므로 ‘시편’보다 간결한 ‘시’가 자연스럽습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗에 관한
  - 다윗을 위한
  - 다윗이 쓴
  lexicon: HALOT
  rationale: 히브리어 לְ + 인명은 저자, 소속, 헌정 등으로 폭넓게 읽힐 수 있습니다. 영어 POB의 ‘of David’처럼 한국어도 ‘다윗의’로 두어 그 관계를 단정하지 않고 열린 채로 유지했습니다.
theological_decisions:
- issue: 다윗 표제의 관계를 단정할지 여부
  chosen_reading: 저자, 연관, 헌정 가능성을 열어 둔 ‘다윗의’
  alternative_readings:
  - ‘다윗이 쓴’으로 저자 단정
  - ‘다윗을 위한’으로 헌정 단정
  rationale: 원문 표제는 다윗과의 관계를 하나로 고정하지 않습니다. 번역도 그 긴장을 보존하는 것이 적절하므로, 해석을 좁히는 표현은 피했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
