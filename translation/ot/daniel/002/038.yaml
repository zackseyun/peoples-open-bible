theological_decisions:
- issue: Implied divine subject of the verbs 'has given' and 'made ruler'
  chosen_reading: Render with the implicit subject as 'he' in context, referring to the Most High/God from the preceding verse, without inserting 'God' into the main text here.
  alternative_readings:
  - Explicitly supply 'God has given ... and made you ruler'
  rationale: The immediate context (Dan 2:37) names the God of heaven as the one granting kingdom, power, strength, and glory. In v. 38 the subject remains implicit in Aramaic. Retaining 'he' preserves the source-text flow while allowing the context to identify the referent clearly.
  doctrine_reference: 'Translation philosophy #1 and #3'
- issue: Anthropological wording in בְּנֵי אֲנָשָׁא
  chosen_reading: Use 'children of men' in the main text.
  alternative_readings:
  - human beings
  - mankind
  rationale: The source expression is masculine/generic and idiomatic. Per the gender-accurate principle, the translation preserves the human-representative wording rather than replacing it with a fully neutral abstraction, while still communicating humanity as a whole.
  doctrine_reference: 'Translation philosophy #4'
