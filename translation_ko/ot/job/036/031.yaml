  naturalness: 문장은 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. ‘그것들로 말미암아’는 다소 문어적이지만, 선행 문맥의 복수 대상을 보존하면서 시적·격식적 성격에 잘 맞습니다.
  terminology: ‘심판하십니다’는 דין의 통치적·재판적 의미에 적합하며, ‘민족들’은 עַמִּים의 복수를 잘 살립니다. ‘양식’과 ‘풍성한’도 본문의 공급 및 풍부함을 무리 없이 표현합니다. 존대 표현은 본문 문맥의 하나님을 가리키는 한국어 번역 관례와 합쇼체 요구에 부합합니다.
