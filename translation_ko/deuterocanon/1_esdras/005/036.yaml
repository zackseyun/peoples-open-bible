  text: These were the ones who came up from Thermeleth and Thelersas, with Charaathalan and Allar leading them.
translation:
  language: ko
  text: 이들은 테르멜레트와 테렐사스에서 올라온 자들이며, 카라아탈란과 알라르가 그들을 이끌었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβάντες
  english_pob_choice: came up
  chosen_korean: 올라온
  alternatives_korean:
  - 올라간
  - 상경한
  lexicon: ἀναβαίνω
  rationale: 지리적 이동을 나타내는 기본 동사로 이해하여, 자연스럽고 직접적인 「올라온」을 택했습니다.
- source_word: ἀπὸ Θερμέλεθ καὶ Θελερσάς
  english_pob_choice: from Thermeleth and Thelersas
  chosen_korean: 테르멜레스와 테렐사스에서
  alternatives_korean:
  - 테르멜레트와 테렐사스에서
  - 테르멜레스와 테렐사스에서
  lexicon: 고유명사 음역
  rationale: 그리스어 지명을 현대 한국어 음역으로 옮기되, 본문의 출발지를 분명히 하기 위해 조사 「에서」를 붙였습니다.
- source_word: ἡγούμενος
  english_pob_choice: leading
  chosen_korean: 이끌었습니다
  alternatives_korean:
  - 인도했습니다
  - 앞장섰습니다
  lexicon: ἡγέομαι
  rationale: POB의 현재 영어 흐름인 「leading」을 따라, 집단의 지도·인도 기능을 자연스럽게 드러내는 「이끌었습니다」로 옮겼습니다.
- source_word: Χαρααθαλὰν καὶ Ἀλλάρ
  english_pob_choice: Charaathalan and Allar
  chosen_korean: 차라아달란과 알라르
  alternatives_korean:
  - 차라아탈란과 알라르
  - 하라아달란과 알라르
  lexicon: 고유명사 음역
  rationale: 그리스어 철자를 우선하여 음역했고, 마소라 본문의 대응 이름들과의 차이는 주석 없이 본문 음역만 유지했습니다.
theological_decisions:
- issue: 지도 표현의 관계 구조
  chosen_reading: 「차라아달란과 알라르가 그들을 이끌었습니다」로, 두 인물이 집단의 안내자/지도자였음을 평이하게 드러냈습니다.
  alternative_readings:
  - 「차라아달란과 알라르의 인도를 받았습니다」
  - 「차라아달란과 알라르가 앞장섰습니다」
  rationale: 그리스어 ἡγούμενος는 단순한 동행보다 지도·선도 관계를 뜻하므로, 문맥이 요구하는 지배적 관계를 약화하지 않는 범위에서 자연스럽게 표현했습니다.
  doctrine_reference: 서사 내 지도자 표지에 대한 문법적-서사적 해석
