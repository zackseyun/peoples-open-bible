  rationale: 원문 절 전체를 새로 반영했습니다. ‘궁핍을 겪고 굶주리지만’은 רשו와 רעבו의 병렬된 결핍을, ‘야훼를 찾는 이들’은 분사 דורשי יהוה를, ‘좋은 것은 하나도 부족하지 않습니다’는 לא יחסרו כל־טוב의 포괄적 부정을 보존합니다. 원문과 영어 POB에 별도의 본문상 불확실성이 제시되지 않아 각주는 필요하지 않습니다.
