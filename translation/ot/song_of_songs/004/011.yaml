id: SNG.4.11
reference: Song of Songs 4:11
source:
  edition: WLC
  text: נֹ֛פֶת תִּטֹּ֥פְנָה שִׂפְתוֹתַ֖יִ/ךְ כַּלָּ֑ה דְּבַ֤שׁ וְ/חָלָב֙ תַּ֣חַת לְשׁוֹנֵ֔/ךְ וְ/רֵ֥יחַ שַׂלְמֹתַ֖יִ/ךְ כְּ/רֵ֥יחַ לְבָנֽוֹן׃ס
translation:
  text: Honey from the comb drips from your lips, my bride; honey and milk are under your tongue, and the fragrance of your garments is like the fragrance of Lebanon[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Lebanon was renowned for its fragrant cedar forests.
    reason: cultural_note
lexical_decisions:
- source_word: נֹפֶת
  chosen: honey from the comb
  alternatives:
  - comb honey
  - honey
  lexicon: HALOT
  rationale: Expresses the honey substance naturally rather than making a honeycomb itself the object that drips.
- source_word: תִּטֹּפְנָה
  chosen: drips from
  alternatives:
  - drop
  - distill
  lexicon: HALOT
  rationale: The restructuring communicates the verb’s dripping image idiomatically in English.
- source_word: שִׂפְתוֹתַיִךְ
  chosen: your lips
  lexicon: HALOT
  rationale: Straightforward plural construct with 2fs suffix; 'your lips' is the natural equivalent.
- source_word: כַּלָּה
  chosen: bride
  alternatives:
  - bride-to-be
  lexicon: HALOT
  rationale: The vocative means “bride”; no possessive suffix is present.
- source_word: דְּבַשׁ וְחָלָב
  chosen: honey and milk
  alternatives:
  - milk and honey
  lexicon: HALOT
  rationale: The Hebrew order is 'honey and milk,' not the more familiar idiom 'milk and honey.' Preserving the source order respects original-language primacy and avoids importing the stock biblical phrase where it is not used here.
- source_word: תַּחַת לְשׁוֹנֵךְ
  chosen: under your tongue
  alternatives:
  - beneath your tongue
  lexicon: HALOT
  rationale: A direct and idiomatic rendering of the preposition plus noun with suffix; it preserves the concrete sensual imagery.
- source_word: רֵיחַ
  chosen: fragrance
  alternatives:
  - scent
  - smell
  lexicon: HALOT
  rationale: In this positive poetic context, 'fragrance' better conveys pleasant aroma than the more neutral 'smell'.
- source_word: שַׂלְמֹתַיִךְ
  chosen: your garments
  alternatives:
  - your clothes
  - your robes
  lexicon: HALOT
  rationale: The plural noun refers to clothing/outer garments. 'Garments' is suitably elevated yet readable for love poetry.
- source_word: כְּרֵיחַ לְבָנוֹן
  chosen: like the fragrance of Lebanon
  alternatives:
  - like the scent of Lebanon
  lexicon: HALOT
  rationale: Lebanon evokes its famed cedars and mountain freshness. Keeping 'Lebanon' literal preserves the geographic-poetic image rather than paraphrasing it.
