id: JOB.34.18
reference: Job 34:18
source:
  edition: WLC
  text: הַ/אֲמֹ֣ר לְ/מֶ֣לֶךְ בְּלִיָּ֑עַל רָ֝שָׁ֗ע אֶל נְדִיבִֽים־׃
translation:
  text: Is it fitting to call a king a scoundrel or nobles wicked[a]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'Alternatively, describing God: “He calls a king a scoundrel and nobles wicked.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַאֲמֹר
  chosen: Is it fitting to say
  alternatives:
  - to say
  - saying
  lexicon: HALOT
  rationale: The interrogative infinitive continues the rhetorical challenge and asks about the propriety of such speech.
- source_word: לְמֶלֶךְ
  chosen: to a king
  alternatives:
  - to the king
  lexicon: HALOT
  rationale: The preposition ל marks the indirect object of speech. The anarthrous noun is best rendered generically as 'a king' rather than 'the king.'
- source_word: בְּלִיָּעַל
  chosen: Worthless one
  alternatives:
  - worthless fellow
  - scoundrel
  - Belial
  lexicon: HALOT
  rationale: This is a contemptuous characterization, not a use of the later proper name Belial.
- source_word: רָשָׁע
  chosen: Wicked men
  alternatives:
  - wicked one
  - wicked people
  - guilty ones
  lexicon: HALOT
  rationale: Though morphologically singular in form, it functions distributively/predicatively with the plural 'nobles' in the parallel line. English idiom is clearer with the plural 'Wicked men!' to match the plural addressees.
- source_word: אֶל
  chosen: to
  alternatives:
  - toward
  lexicon: HALOT
  rationale: Here אֶל introduces the addressee of speech in parallel with לְמֶלֶךְ. 'To' is the natural English equivalent.
- source_word: נְדִיבִים
  chosen: nobles
  alternatives:
  - princes
  - noblemen
  lexicon: HALOT
  rationale: The term denotes socially elevated, generous, or noble persons. 'Nobles' fits the parallel with 'king' and keeps the social-political sense in readable modern English.
- source_word: רָשָׁע אֶל נְדִיבִים
  chosen: or to nobles, “Wicked ones!”
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The singular-form characterization is applied distributively to plural nobles; plural English is natural in direct address.
