  from: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
  to: So know today that Yahweh your God himself is crossing ahead of you—a consuming fire. He will destroy them and subdue them before you, so you will dispossess them and destroy them quickly, just as Yahweh has told you.
  rationale: The lexical and theological records rightly preserve the crossing motif, Yahweh’s decisive agency, and the consuming-fire metaphor. I retain those gains but do not preserve an artificial English distinction between “destroy” and “make them perish”; the earlier notes chiefly offered synonymous wording and are unnecessary.
