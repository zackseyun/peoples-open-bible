  rationale: פדה는 단순한 ‘구출’보다 값 주고 건지는 속량/구속의 뜻을 지니므로, 시편의 구원-속량 어감을 살려 ‘구속하셨습니다’로 옮겼습니다.
- source_word: בְשָׁלוֹם
  english_pob_choice: in peace
  chosen_korean: 평강 가운데
  alternatives_korean:
  - 평화 가운데
  - 평안하게
  - 안전하게
  lexicon: HALOT
  rationale: שָׁלוֹם의 핵심인 평강·온전함을 살리되, 한국어 시적 문맥에서 자연스러운 전치사구로 ‘평강 가운데’라고 번역했습니다.
- source_word: מִקֲּרָב לִי
  english_pob_choice: from the battle against me
  chosen_korean: 나를 치러 오는 싸움에서
  alternatives_korean:
  - 나를 향한 싸움에서
  - 나를 대적하는 전투에서
  - 나에게 닥친 싸움에서
  lexicon: HALOT
  rationale: קְרָב은 전투/싸움을 가리키며, 문맥상 לִי는 적대 방향을 드러내므로 ‘나를 치러 오는’으로 풀어 한국어에서 자연스럽게 적대성을 드러냈습니다.
- source_word: עִמָּדִי
  english_pob_choice: with me
  chosen_korean: 나와 함께
  alternatives_korean:
  - 나를 대적하여
  - 나와 더불어
  - 내 편에
  lexicon: HALOT
  rationale: 형태상 עם은 기본적으로 ‘~와 함께’이므로 본문은 원문 표면을 따라 ‘나와 함께’로 두었습니다. 이는 문맥상 역설적이거나 관용적인 가능성을 남깁니다.
theological_decisions:
- issue: 마지막 절의 עִמָּדִי 해석(‘with me’ 대 ‘against me’)
  chosen_reading: 본문에는 ‘많은 이들이 나와 함께 있었다’로 두고, 적대적 의미는 배경 해석으로만 남깁니다.
  alternative_readings:
  - 많은 이들이 나를 대적하였다
  - 많은 이들이 나를 치러 왔다
  rationale: 히브리어 표면형은 ‘나와 함께’가 가장 직접적이므로, POB의 원문 보존 원칙에 따라 본문은 그 형태를 유지했습니다. 다만 시편의 전투 문맥은 적대적 해석을 충분히 가능하게 하므로, 본문이 과도하게 매끈해지지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve lexical and contextual tension rather than resolve it.'
