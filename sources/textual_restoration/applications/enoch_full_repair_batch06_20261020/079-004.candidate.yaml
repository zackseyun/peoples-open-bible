translation:
  text: 'The waning that takes place in the first gate, in its own period, continues until 177 days are completed:
    25 weeks and two days.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The opening and-the-waning is enclosed in parentheses in the actual edition. Charles printed151 note51
      says it was lost through a same-ending omission and supplied here; it is an editor restoration, not an independently
      observed manuscript reading. The running text prints177 and25 in Ethiopic numerals but writes two as a word.
      The arithmetic25×7+2=177 is a consistency check, not permission to normalize any other printed number. Continues
      supplies the elliptical English predicate rather than adding new Geʽez.
