  review_summary: In the immediate sequence, Elihu says that he attended to the friends and waited, yet they failed to continue; taking the first כִּי with an adversative or asseverative discourse force is more coherent than saying he waited because they were silent. The second כִּי introduces or emphasizes the explanation of their silence and need not be mechanically repeated as “because.” In this speech context עָמְדוּ means that the speakers stopped, whereas “stood still” misleadingly suggests bodily posture.
