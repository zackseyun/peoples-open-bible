  - 담대함
  lexicon: ἀνδραγαθία
  rationale: 단순한 심리 상태보다 행위로 드러난 고결한 용맹과 기개를 가리키므로 '용맹'으로 옮겼습니다.
- source_word: ὑπὲρ ἀρετῆς
  english_pob_choice: for the sake of virtue
  chosen_korean: 덕을 위해
  alternatives_korean:
