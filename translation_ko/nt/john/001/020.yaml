id: JHN.1.20
reference: John 1:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
  footnotes:
  - marker: a
    text: Or, “the Christ.” The Greek title is Χριστός (Christos). Here it functions as a messianic title, so the main text renders it “the Messiah.”
    reason: alternative_reading
translation:
  language: ko
  text: 그는 시인하였고 부인하지 않았습니다. 그는 시인하여 말하였습니다. “나는 메시아[a]가 아닙니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리스도.” 그리스어 Χριστός(크리스토스)의 음역입니다. 여기서는 메시아적 칭호로 쓰였으므로 본문에서는 “메시아”로 번역하였습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  english_pob_choice: confessed
  chosen_korean: 시인하였고
  alternatives_korean:
  - 고백하였다
  - 인정하였다
  lexicon: BDAG
  rationale: ὁμολογέω의 공적·명백한 인정이라는 의미를 반영하여 전통 한국어 성경에서 자주 쓰이는 '시인하다'를 택했습니다. 반복된 ὡμολόγησεν의 강조를 한국어에서도 '다시 시인하여'로 살렸습니다.
- source_word: οὐκ ἠρνήσατο
  english_pob_choice: did not deny
  chosen_korean: 부인하지 아니하였으며
  alternatives_korean:
  - 부인하지 않았다
  - 부인하지 않다
  lexicon: BDAG
  rationale: ἁρνέομαι의 표준적 번역은 '부인하다'입니다. 부정문을 '부인하지 아니하였으며'로 처리하여 문체를 경건하고 고풍스럽게 유지하면서도 원문의 부정 강조를 살렸습니다.
- source_word: Ἐγὼ οὐκ εἰμὶ
  english_pob_choice: I am not
  chosen_korean: 나는 ...가 아니다
  alternatives_korean:
  - 내가 ...가 아니다
  - 나 자신은 ...가 아니다
  lexicon: BDAG
  rationale: Ἐγὼ의 강조를 한국어에서 자연스럽게 반영하기 위해 1인칭 주어 '나는'을 사용했습니다. '나 자신은'처럼 과도한 강조 표현은 피했습니다.
- source_word: ὁ χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 그리스도(음역)
  lexicon: BDAG
  rationale: 프로젝트 기본 원칙에 따라 Χριστός가 이 구절에서는 칭호로 작동하므로 히브리적 기대를 살리는 '메시아'를 사용했습니다. 음역 '그리스도'는 대안이며 본문 주석으로 표기합니다.
theological_decisions:
- issue: Rendering of Χριστός as title
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 본문에서 세례자 요한은 자신이 기대된 기름부음 받은 자임을 부인하고 있으므로 Χριστός는 이름이 아니라 메시아적 칭호로 기능합니다. 따라서 '메시아'가 원저자의 독자에게 전달하려는 의미(유대적 메시아 기대)를 더 직접적으로 살립니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table, Χριστός → Messiah (where title; Christ where name-like)'
- issue: Register inside quoted speech
  chosen_reading: 직접적 단정 어조(평서문, 비공손체)로 인용
  alternative_readings:
  - 주시체(합쇼체)로 인용
  rationale: 원문에서 요한의 간단하고 단정적인 부인이 반복 강조와 함께 직접적으로 제시되므로, 인용문은 한국어에서 직설적 어조('나는 메시아가 아니다')로 옮겨 원어의 긴장과 단호함을 보존합니다. 본문 서술은 합쇼체로 유지했습니다.
  doctrine_reference: 'STYLE.md: Quoted speech register guidance'
