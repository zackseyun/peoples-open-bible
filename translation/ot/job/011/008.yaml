  from: It is higher than the heavens—what can you do? Deeper than Sheol—what can you know?[a]
  to: It is as high as the heavens—what can you do? Deeper than Sheol—what can you know?[a]
  rationale: The proposal correctly identifies that גבהי שמים lacks the comparative preposition required for “higher than the heavens,” but its plural “They are the heights of heaven” unnecessarily changes the carried-forward referent and produces an awkward predicate. The idiomatic construction “as high as the heavens” accurately renders the construct phrase as a superlative/comparative measure and maintains the singular implicit subject. The second colon remains correctly comparative because it has מִן.
