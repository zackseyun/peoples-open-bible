  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: grammar
  tier: 1
  from: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
  to: Lift up your heads, O gates, and lift yourselves up, O ancient doors[a], that the King of glory may come in.
  rationale: Verse 9 has the active Qal imperative וּשְׂאוּ, whereas verse 7 uses the passive form וְהִנָּשְׂאוּ. “Be lifted up” smooths away that formal distinction. In the sustained personification of gates and doors, “lift yourselves up” is a natural English reflexive expression of the active command and retains the repeated lifting image. The note on פִּתְחֵי עוֹלָם must be attached to “ancient doors,” its actual referent, rather than “heads.”
