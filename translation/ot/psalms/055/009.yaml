  from: Confuse them[a], Lord; divide their speech[b], for I have seen violence and strife in the city.
  to: Swallow them up[a], Lord; divide their tongue[b], for I have seen violence and strife in the city.
  rationale: “Confuse them” resolves the line into a contextual interpretation and loses the concrete destructive image of בַּלַּע. “Swallow them up” retains that image and permits the implied object. Likewise, “tongue” retains לָשׁוֹן’s concrete wording while a note honestly identifies its possible metonymic sense of speech or language.
