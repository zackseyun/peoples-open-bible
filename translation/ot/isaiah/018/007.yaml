id: ISA.18.7
reference: Isaiah 18:7
source:
  edition: WLC
  text: בָּ/עֵת֩ הַ/הִ֨יא יֽוּבַל שַׁ֜י לַ/יהוָ֣ה צְבָא֗וֹת עַ֚ם מְמֻשָּׁ֣ךְ וּ/מוֹרָ֔ט וּ/מֵ/עַ֥ם נוֹרָ֖א מִן ה֣וּא וָ/הָ֑לְאָה גּ֣וֹי קַו קָ֣ו וּ/מְבוּסָ֗ה אֲשֶׁ֨ר בָּזְא֤וּ נְהָרִים֙ אַרְצ֔/וֹ אֶל מְק֛וֹם שֵׁם יְהוָ֥ה צְבָא֖וֹת הַר צִיּֽוֹן־־׀־־־־׃ס
translation:
  text: At that time a gift will be brought to Yahweh of Armies from a tall, smooth-skinned people[a], from a people feared far and wide, a nation that measures out territory and tramples others down[b], whose land rivers divide[c], to the place where Yahweh of Armies has established his name—Mount Zion.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Alternatively, the tall, smooth-skinned people themselves may be brought as the gift.
    reason: alternative_reading
  - marker: b
    text: Literally, “a nation of line upon line and trampling”; the Hebrew epithet is obscure.
    reason: lexical_alternative
  - marker: c
    text: Or “whose land the rivers plunder” or “spoil.”
    reason: alternative_reading
