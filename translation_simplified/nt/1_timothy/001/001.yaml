simplification_decisions:
- pob_phrase: Paul, an apostle of Messiah Jesus
  simplified_phrase: I, Paul, am an apostle of Messiah Jesus
  preserved_meaning: Paul identifies himself as an apostle belonging to and commissioned by Messiah Jesus.
  reasoning_layer_used: Lexical decisions for Παῦλος, ἀπόστολος, and Χριστοῦ Ἰησοῦ
  rationale: A first-person sentence makes the compact letter opening immediately clear.
- pob_phrase: by the command of God our Savior and Messiah Jesus our hope
  simplified_phrase: God our Savior and Messiah Jesus, our hope, commanded that I be an apostle
  preserved_meaning: Paul’s apostleship rests on the authoritative command of God and Messiah Jesus.
  reasoning_layer_used: Lexical decisions for κατ’ ἐπιταγήν and καὶ
  rationale: The dense phrase becomes a direct sentence without adding an act of service.
- pob_phrase: Messiah Jesus our hope
  simplified_phrase: Messiah Jesus, our hope
  preserved_meaning: Messiah Jesus himself is identified as the believers’ hope.
  reasoning_layer_used: Theological decision on the appositional relation of ἐλπίδος
  rationale: Commas clearly mark “our hope” as a title for Messiah Jesus.
interpretive_expansions:
- pob_phrase: an apostle of Messiah Jesus by the command
  rendering: commanded that I be an apostle
  claim: The divine command is the basis and authorization for Paul’s apostleship.
  evidence:
  - The POB rationale says κατ’ ἐπιταγήν expresses the basis in an authoritative directive.
  - The immediate phrase directly links Paul’s apostleship with that command.
  confidence: high
  alternatives_preserved:
  - Paul is an apostle by divine authorization.
translation_notes:
  risk_flags:
  - risk: The first-person recasting is more explicit than the Greek letter-heading form.
    mitigation: It preserves Paul as the speaker and adds no new participant.
  - risk: “Commanded that I be an apostle” states the relation between the command and apostleship directly.
    mitigation: The wording is limited to the authorization already expressed by “by the command.”
