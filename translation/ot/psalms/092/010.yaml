  from: But you have raised my horn like that of a wild ox[a]; I am moistened with fresh oil.[b]
  to: But you have raised my horn[a] like that of a wild ox; I am refreshed with fresh oil[b].
  rationale: The later audit was right not to force ceremonial anointing or intensify the image into “drenched.” I retain “raised” and the horn image, but carry the oil’s contextual significance into the main text while noting the lexical uncertainty.
