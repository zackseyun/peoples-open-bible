  from: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
  to: All their neighbors supported them with silver vessels, gold, goods, livestock, and valuables, in addition to all the freewill offerings.
  rationale: The lexical record and earlier footnote both recognize “supported them” as the meaning of “strengthened their hands.” I bring that meaning into the text and retain the distinction between material assistance and additional freewill offerings.
