    rationale: ‘…백성이기 때문입니다’로 처리하면 이스라엘에게서 도움을 기대할 수 없다는 판단의 근거를 나타내는 원문의 연결을 보존할 수 있습니다.
  revised_text: 우리가 이스라엘 자손에게서 도움을 받지 못할 것이기 때문입니다. 보십시오, 그들은 강력한 전열을 펼칠 힘도 능력도 없는 백성이기 때문입니다.
