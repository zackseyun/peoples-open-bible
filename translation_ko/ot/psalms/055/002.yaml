id: PSA.55.2
reference: Psalms 55:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַקְשִׁ֣יבָ/ה לִּ֣/י וַ/עֲנֵ֑/נִי אָרִ֖יד בְּ/שִׂיחִ֣/י וְ/אָהִֽימָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/002.yaml
  text: Pay attention to me and answer me; I am restless[a] in my complaint[b], and I moan.
  footnotes:
  - marker: a
    text: Or “I wander restlessly in my complaint.” The Hebrew verb can suggest restless roaming or agitation under distress.
    reason: lexical_alternative
  - marker: b
    text: “Complaint” may also be rendered “meditation” or “musing”; here the lament context favors “complaint.”
    reason: lexical_alternative
translation:
  language: ko
  text: 제게 귀를 기울이시고 응답해 주십시오. 저는 제 하소연 속에서 안절부절못하며[a] 신음합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 하소연 속에서 이리저리 헤맵니다.’ 히브리어 동사는 고통 가운데서 불안하게 떠돌거나 동요하는 상태를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하소연’으로 옮긴 히브리어 명사는 ‘묵상’ 또는 ‘혼잣말’을 뜻할 수도 있습니다. 여기서는 시편의 탄식 문맥에 따라 ‘하소연’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  english_pob_choice: Give ear
  chosen_korean: 귀를 기울여 주시고
  alternatives_korean:
  - 들어 주시고
  - 귀를 기울이십시오
  lexicon: HALOT
  rationale: אזן의 청유형은 단순한 '듣다'보다 적극적으로 귀를 기울이는 뜻이므로, 기도문의 절박한 호소를 살려 '귀를 기울여 주시고'로 옮겼습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님이시여
  - 주님
  lexicon: HALOT
  rationale: 직접 호칭이므로 한국어 성경 관행에 맞게 '하나님'을 사용했고, 여기에는 야훼 같은 언약 이름이 나오지 않습니다.
- source_word: תְּחִנָּתִי
  english_pob_choice: my supplication
  chosen_korean: 제 간구
  alternatives_korean:
  - 제 간청
  - 제 호소
  - 제 탄원
  lexicon: HALOT
  rationale: תְּחִנָּה는 은혜를 구하는 간절한 청원이라서, 현대 한국어에서 격식을 유지하면서도 의미를 분명히 하는 '간구'가 적절합니다.
- source_word: תִּתְעַלַּם
  english_pob_choice: hide yourself
  chosen_korean: 당신 자신을 숨기지 마십시오
  alternatives_korean:
  - 외면하지 마십시오
  - 못 본 체하지 마십시오
  - 숨지 마십시오
  lexicon: HALOT
  rationale: 반사형 עלם은 단순한 '무시하다'보다 자신을 감추는 이미지를 담으므로, 본문이 가진 관계적 긴장을 살려 직역에 가까운 표현을 택했습니다.
theological_decisions:
- issue: 하나님께 드리는 직접 호소의 높임말 처리
  chosen_reading: 직접 호칭과 명령형은 합쇼체로 유지하되, 하나님께 드리는 말이므로 '주시고', '마십시오' 같은 공손한 종결을 사용했습니다.
  alternative_readings:
  - 반말형 기도문
  - 더 전통적인 '-옵소서'형
  rationale: 시편의 기도는 현대 독자가 바로 기도문으로 읽을 수 있어야 하므로, 고어체보다 표준적인 공손체가 본문의 간구성을 더 자연스럽게 전달합니다.
  doctrine_reference: 기도의 직접성과 경외의 병행
- issue: ‘숨기다’의 의미 보존
  chosen_reading: '''당신 자신을 숨기지 마십시오''로 옮겨, 단순히 ''무시하지 마십시오''로 완화하지 않았습니다.'
  alternative_readings:
  - 제 기도를 외면하지 마십시오
  - 제 간구를 듣지 않으시는 듯하지 마십시오
  rationale: 히브리어 동사는 응답을 거부하는 태도를 우회적으로 묘사하므로, 관계적 거리감을 보존하는 번역이 원문의 긴장을 더 잘 드러냅니다.
  doctrine_reference: 하나님의 응답과 임재에 대한 탄원
