translation:
  language: ko
  text: 야훼께서는 악을 행하는 자들에게 얼굴을 돌리시어, 그들의 기억을 땅에서 끊어 버리십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינֵי
  english_pob_choice: The eyes of
  chosen_korean: 눈은
  alternatives_korean:
  - 눈이
  - 눈들
  lexicon: HALOT
  rationale: 히브리어의 신체 이미지와 평행 구조를 살리기 위해 ‘눈’을 문자적으로 유지하되, 한국어에서는 주어 표지를 자연스럽게 처리해 읽기 흐름을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문이 여호와 대용어가 아니라 하나님의 고유명 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의인
  lexicon: HALOT
  rationale: 복수의 실체명사적 용법을 한국어에서 가장 자연스럽게 반영하는 표현으로 ‘의인들’을 선택했습니다.
- source_word: שַׁוְעָתָם
  english_pob_choice: their cry for help
  chosen_korean: 부르짖음
  alternatives_korean:
  - 부르짖음으로
  - 도움 요청
  - 간구
  lexicon: HALOT
  rationale: 이 어근은 단순한 소리보다 환난 속의 구원 요청을 가리키므로, 본문의 긴급성과 정서를 살려 ‘부르짖음’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 신체 이미지 유지
  chosen_reading: ‘눈’과 ‘귀’를 문자적으로 유지해 하나님의 주의와 응답을 시적으로 드러냈습니다.
  alternative_readings:
  - ‘야훼께서 지켜보십니다’
  - ‘야훼께서 들으십니다’
  rationale: 히브리어는 의인화된 신체 언어로 하나님의 관심과 응답을 표현하므로, 이를 설명문으로 바꾸지 않고 원문 이미지를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source-text imagery'
