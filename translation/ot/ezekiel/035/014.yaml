id: EZK.35.14
reference: Ezekiel 35:14
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה כִּ/שְׂמֹ֨חַ֙ כָּל הָ/אָ֔רֶץ שְׁמָמָ֖ה אֶעֱשֶׂה לָּֽ/ךְ־־׃
translation:
  text: 'Thus says the Lord GOD: When the whole earth[b] rejoices[a], I will make you desolate.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'Just as you rejoiced over the whole land, I will make you desolate,' taking Edom as the implied subject in light of verse 15. The main text takes the whole earth as the subject of rejoicing at the time of the announced judgment; the occasion of its joy is not stated.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the whole earth'; some take this more locally as 'the whole land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  chosen: Thus
  alternatives:
  - This is what
  lexicon: HALOT
  rationale: Standard prophetic messenger formula; 'Thus' preserves the formal force of the introduction in readable English.
- source_word: אָמַר
  chosen: says
  alternatives:
  - said
  lexicon: HALOT
  rationale: Though morphologically perfect, in prophetic formulae it is idiomatically rendered as present in English ('Thus says') to convey the standing divine declaration.
- source_word: אֲדֹנָי יְהוִה
  chosen: the Lord GOD
  alternatives:
  - Lord GOD
  - the Lord Yahweh
  lexicon: HALOT
  rationale: The compound divine title is conventionally rendered 'the Lord GOD.' 'YHWH' follows the project default as 'the LORD,' but when paired with אֲדֹנָי, English convention uses 'Lord GOD' to avoid 'Lord LORD.' The article improves English flow.
- source_word: כִּשְׂמֹחַ
  chosen: When ... rejoices
  alternatives:
  - As ... rejoices
  - Just as you rejoiced over ...
  lexicon: HALOT
  rationale: The retained form is a Qal infinitive construct with prefixed kaf, not a finite past tense. Temporal 'When' relates the joy to the announced judgment, taking the following whole-earth phrase as subject. Verse 15 explicitly describes Edom's earlier joy over Israel's desolation; it does not require past worldwide rejoicing in verse 14. A comparative reading with Edom as implied subject remains a contextual rival in note a. This is a provisional syntactic preference after a masked comparison, not a new Hebrew reading. The historical HALOT label is retained; no fresh entry consultation is claimed.
- source_word: כָּל הָאָרֶץ
  chosen: the whole earth
  alternatives:
  - all the land
  - the whole land
  lexicon: HALOT
  rationale: Under the selected subject reading, 'the whole earth' sets general rejoicing alongside Edom's desolation. 'The whole land' remains possible and is preserved in note b; the regional context does not establish an exclusive worldwide scope. The cause of joy is not supplied. No fresh HALOT entry consultation is claimed.
- source_word: שׂמח
  chosen: rejoices
  alternatives:
  - is glad
  - celebrates
  lexicon: HALOT
  rationale: English 'rejoices' belongs to a future-oriented temporal clause with 'I will make you'; it does not assert present-time joy. Time comes from this contextual interpretation, not a past or present tense encoded in the infinitive. 'Rejoice' retains the joy vocabulary shared with verse 15 without forcing identical subjects or times. No fresh HALOT entry consultation is claimed.
- source_word: שְׁמָמָה
  chosen: desolate
  alternatives:
  - a desolation
  - devastated
  lexicon: HALOT
  rationale: Predicate/resultative sense after עשה with ל yields idiomatic English 'make you desolate.' This is smoother than the more wooden 'make you a desolation' while preserving meaning.
- source_word: אֶעֱשֶׂה לָּךְ
  chosen: I will make you
  alternatives:
  - I will make for you
  - I will make of you
  lexicon: HALOT
  rationale: The idiom עשה + ל + pronoun here means to cause the addressee to become something; 'I will make you' is the natural English equivalent.
