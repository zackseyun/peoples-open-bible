  text: God is greatly feared in the council of the holy ones[a][b], and awesome above all who surround him.
  footnotes:
  - marker: a
    text: Or 'among the heavenly beings,' 'among the divine beings,' or 'among the sons of the mighty.' The Hebrew phrase literally reads 'among the sons of God/gods.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 거룩한 이들의 모임에서 크게 경외받으시며, 그분을 둘러싼 모든 이보다 더욱 경외로우십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회의’, ‘집회’. 히브리어는 친밀한 의논의 모임이나 집회를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거룩한 이들’은 여기서 인간 성도들보다 하늘의 존재들을 가리킬 가능성이 큽니다.
    reason: cultural_note
