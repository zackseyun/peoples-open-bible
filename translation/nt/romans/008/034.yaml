  rationale: The verse uses Χριστός as a meaningful title within Paul's salvation argument, so the translation preserves that sense per the doctrine's contested-terms guidance rather than defaulting to inherited English tradition.
  doctrine_reference: 'DOCTRINE.md: ''Χριστός Christos → Messiah (where title; Christ where name-like)'''
- issue: Voice of ἐγερθείς
  chosen_reading: who was raised
