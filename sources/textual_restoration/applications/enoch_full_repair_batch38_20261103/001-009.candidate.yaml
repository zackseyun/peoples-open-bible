translation:
  text: Look, he comes with myriads of holy ones[a] to carry out judgment upon them,[b] to destroy the godless,
    and to reprove all flesh for all they did—and they acted impiously against him, sinners [and] godless ones.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: The selected text has no explicit “his” with the holy ones. “Myriads” does not assert an exact headcount.
  - marker: b
    reason: textual_variant
    text: “Upon them” renders the provisional reading of the printed, daggered expression, checked against the same-page
      form in 1:8. The antecedent is unresolved. Charles’s note 20 proposes a different reading, supported in sense
      by the Greek; it is not substituted here.
  - marker: c
    reason: textual_variant
    text: The dash presents a trial reading of the abrupt sequence, not punctuation supplied by the print. It leaves
      the named groups at the end, preserves the finite impiety verb, and does not add a second “for.” The English
      “they” reflects the working plural verb reading without settling how the final nouns relate to it or how the
      two actions are linked. The impiety verb is Charles’s emendation already printed in the verse body, as disclosed
      in note 25. The additional clause proposed in that same note is not printed in the body and is not supplied
      here.
