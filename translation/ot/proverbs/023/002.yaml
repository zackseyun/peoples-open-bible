id: PRO.23.2
reference: Proverbs 23:2
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ שַׂכִּ֣ין בְּ/לֹעֶ֑/ךָ אִם בַּ֖עַל נֶ֣פֶשׁ אָֽתָּה־׃
translation:
  text: And put a knife to your throat if your appetite rules you.
  philosophy: dynamic
lexical_decisions:
- source_word: וְ/שַׂמְתָּ
  chosen: and put
  alternatives:
  - and set
  - then put
  lexicon: HALOT
  rationale: The waw + Qal perfect 2ms of שׂים continues the instructional sequence from the previous verse and is naturally rendered as an imperative-like continuation in English. 'Put' is idiomatic and concise.
- source_word: שַׂכִּין
  chosen: a knife
  alternatives:
  - a blade
  lexicon: HALOT
  rationale: The noun denotes a knife. 'Knife' is the plain modern English equivalent and preserves the vivid, hyperbolic warning.
- source_word: בְּ/לֹעֶךָ
  chosen: to your throat
  alternatives:
  - in your throat
  - to your gullet
  lexicon: HALOT
  rationale: לֹעַ refers to the throat/gullet. With בְּ after שׂים, English idiom prefers 'put ... to your throat' rather than the more wooden 'in your throat.' 'Throat' is more natural than 'gullet' for modern readers.
- source_word: אִם
  chosen: if
  alternatives:
  - when
  lexicon: HALOT
  rationale: The conditional particle is best rendered 'if,' introducing the circumstance under which the warning applies.
- source_word: בַּעַל נֶפֶשׁ
  chosen: are given to appetite
  alternatives:
  - given to appetite
  - a glutton
  - master of desire
  - a man with a big appetite
  lexicon: HALOT
  rationale: This renders the contextual idiom as being disposed or governed by appetite, avoiding both unnatural literalism and the weaker sense of merely having a strong appetite.
- source_word: אָתָּה
  chosen: you are
  lexicon: HALOT
  rationale: The independent pronoun supplies the explicit subject and is naturally represented in English by 'you are' in the conditional clause.
