simplification_decisions:
- pob_phrase: The grace of our Lord Jesus Christ be with
  simplified_phrase: may the grace of our Lord Jesus the Messiah be with
  preserved_meaning: This remains a closing blessing asking that the Lord’s grace accompany the community.
  reasoning_layer_used: Source syntax and the lexical decisions for χάρις, μετὰ, and Χριστός
  rationale: “May” makes the blessing natural in modern English, while “Messiah” follows the audited title choice.
- pob_phrase: brothers
  simplified_phrase: Brothers,
  preserved_meaning: Paul directly addresses the believing community with the masculine plural term.
  reasoning_layer_used: Lexical and theological decision for ἀδελφοί
  rationale: Moving the address first gives the short blessing a clearer English flow without changing its scope.
- pob_phrase: your spirit
  simplified_phrase: your spirit
  preserved_meaning: The singular spirit belongs collectively to the people being addressed.
  reasoning_layer_used: Lexical decision for πνεύματος ὑμῶν
  rationale: The phrase is retained because replacing it with “you” would erase Paul’s distinct wording.
interpretive_expansions:
