translation:
  text: And all human beings shall be righteous, and all nations shall worship and
    bless me, and all of them shall bow down to me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “all the children of man.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሉ፡ ውሉደ፡ ሰብእ
  chosen: all human beings
  alternatives:
  - all the children of humankind
  - all the children of man
  rationale: The phrase literally refers to all the children of humankind; the concise
    English preserves its universal scope.
- source_word: ጻድቃነ
  chosen: righteous
  alternatives:
  - just
  rationale: Describes the condition of human beings without adding a process of becoming
    righteous.
- source_word: ያምልኩ
  chosen: worship
  alternatives:
  - serve
  rationale: Retains the religious action directed toward the first-person speaker.
- source_word: ይባርኩ
  chosen: bless
  alternatives:
  - praise
  rationale: Preserves a distinct verb alongside 'worship' rather than merging the
    two actions.
- source_word: ይሰግዱ
  chosen: bow down
  alternatives:
  - prostrate themselves
  - worship
  rationale: Conveys the bodily act of homage and distinguishes it from the earlier
    verb rendered 'worship'.
theological_decisions:
- issue: Identity of the first-person recipient of worship
  chosen_reading: Retain 'me' without adding a name or title.
  alternative_readings:
  - Explicitly identify the speaker as God
  rationale: The verse uses first-person pronouns; identifying their referent in the
    translated line would add wording absent from this witness.
