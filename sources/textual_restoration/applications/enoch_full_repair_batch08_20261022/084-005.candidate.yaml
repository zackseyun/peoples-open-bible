translation:
  text: 'And now, O God and Lord and great King, I plead and ask that you grant my petition: preserve for me a remnant[a]
    on the earth, and do not destroy all human flesh and strip the earth bare, leaving it devastated forever.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or posterity. The request concerns preserving human life and does not name particular survivors.
    reason: lexical_alternative
  - marker: b
    text: Do not destroy is explicit. The following earth-stripping and lasting-destruction clauses remain within
      that negative request. Charles printed p.163 note 6 reports variants in the earth-stripping clause, including
      negative forms.
    reason: textual_variant
