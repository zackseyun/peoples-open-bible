id: JOB.28.13
reference: Job 28:13
source:
  edition: WLC
  text: לֹא יָדַ֣ע אֱנ֣וֹשׁ עֶרְכָּ֑/הּ וְ/לֹ֥א תִ֝מָּצֵ֗א בְּ/אֶ֣רֶץ הַֽ/חַיִּֽים־׃
translation:
  text: No human knows its worth, and it is not found in the land of the living.
  philosophy: dynamic
lexical_decisions:
- source_word: אֱנוֹשׁ
  chosen: No human
  alternatives:
  - mortal man
  - humanity
  - a person
  lexicon: HALOT
  rationale: Natural modern English for the representative mortal-human reference.
- source_word: יָדַע
  chosen: does not know
  alternatives:
  - has not known
  - cannot know
  lexicon: HALOT
  rationale: 'The qatal here states a general truth in context, best rendered in English present tense: ''does not know.'' ''Cannot know'' would overstate inability beyond the lexical sense.'
- source_word: עֶרְכָּהּ
  chosen: its worth
  alternatives:
  - its value
  - its measure
  - its price
  lexicon: HALOT
  rationale: The noun from ערך can denote valuation, worth, or price. In the wisdom context about wisdom's inestimable value, 'its worth' is idiomatic and broad, avoiding the overly commercial feel of 'price' while preserving the sense of valuation.
- source_word: תִּמָּצֵא
  chosen: it is not found
  alternatives:
  - it cannot be found
  - it is not to be found
  lexicon: HALOT
  rationale: 'The Niphal imperfect is naturally rendered as passive: ''it is not found.'' ''Cannot be found'' would add a modal nuance not explicit in the Hebrew.'
- source_word: בְּאֶרֶץ הַחַיִּים
  chosen: in the land of the living
  alternatives:
  - in the earth of the living
  - among the living
  lexicon: HALOT
  rationale: This is a standard Hebrew idiom for the realm of earthly human life. 'Land of the living' preserves the idiom and poetic register better than more interpretive alternatives.
