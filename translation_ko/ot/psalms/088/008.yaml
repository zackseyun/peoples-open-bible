id: PSA.88.8
reference: Psalms 88:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָ֭לַ/י סָמְכָ֣ה חֲמָתֶ֑/ךָ וְ/כָל מִ֝שְׁבָּרֶ֗י/ךָ עִנִּ֥יתָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/008.yaml
  text: You have driven my companions far from me[a]; you have made me abhorrent to them[b]. I am confined and cannot go out[c].
  footnotes:
  - marker: a
    text: Or 'waves' or 'billows' for 'breakers.' The Hebrew term evokes breaking sea-waves.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 제가 아는 이들을 제게서 멀리 떼어 놓으셨고, 저를 그들에게 혐오스러운 존재로 만드셨습니다. 저는 갇혀 있어 나갈 수 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סָמְכָה
  english_pob_choice: has rested
  chosen_korean: 머물렀고
  alternatives_korean:
  - 내렸고
  - 눌렀고
  - 놓였고
  lexicon: HALOT
  rationale: 동사 סמך의 공간적 이미지를 살리면서, 분노가 화자 위에 ‘머물러 있는’ 상태를 자연스럽게 옮겼습니다. ‘눌렀고’는 해석을 더 강하게 드러내고, ‘내렸고’는 원문의 지속적 뉘앙스를 덜 살립니다.
- source_word: חֲמָתֶךָ
  english_pob_choice: your wrath
  chosen_korean: 주의 분노가
  alternatives_korean:
  - 주의 진노가
  - 주의 격노가
  lexicon: HALOT
  rationale: חֵמָה는 문맥상 하나님의 감정적 분노를 가리키므로 ‘분노’로 옮기되, 시편 탄식의 중량감을 유지했습니다. ‘진노’도 가능하지만 이 절에서는 바로 이어지는 수난 이미지와 함께 보다 직접적인 ‘분노’가 자연스럽습니다.
- source_word: מִשְׁבָּרֶיךָ
  english_pob_choice: your breakers
  chosen_korean: 주의 모든 파도가
  alternatives_korean:
  - 주의 모든 파도들이
  - 주의 모든 물결이
  - 주의 모든 부서지는 파도가
  lexicon: HALOT
  rationale: מִשְׁבָּר은 문자적으로 ‘파도, 특히 부서지는 파도’이므로 ‘파도’로 옮기되, 발화된 폭력성을 보존하려고 ‘모든’을 살렸습니다. 본문 의미를 더 노출하려면 ‘부서지는 파도’도 가능하나, 한국어에서는 과도한 중복을 피했습니다.
- source_word: עִנִּיתָ
  english_pob_choice: you have afflicted me
  chosen_korean: 저를 괴롭게 하셨습니다
  alternatives_korean:
  - 저를 괴롭히셨습니다
  - 저를 학대하셨습니다
  - 저를 고통받게 하셨습니다
  lexicon: HALOT
  rationale: ענה의 핵심은 ‘괴롭게 하다/억누르다/학대하다’의 폭넓은 고난 부과이므로, 시편의 탄식어법에 맞게 ‘괴롭게 하셨습니다’로 옮겼습니다. ‘학대하다’는 현대 한국어에서 지나치게 강한 사회적 함의를 낳을 수 있어 피했습니다.
theological_decisions:
- issue: 하나님의 분노와 고난의 직접적 귀속
  chosen_reading: 하나님의 분노와 ‘모든 파도’가 모두 하나님께 직접 귀속되도록 그대로 옮겼습니다.
  alternative_readings:
  - 분노와 파도의 이미지를 비인격적 고난으로 완화하기
  - 하나님의 행위를 암시적으로만 표현하기
  rationale: 히브리어 본문은 고난의 원인을 하나님께 직접 연결하므로, 그 긴장과 불편함을 완화하지 않는 것이 원문의 신학적 힘을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
