translation:
  text: 'He says, “Hear about all these too. Stones were taken from the plain and put into the tower’s
    building. They replaced the rejected stones. They are the roots of this white mountain.”


    2. “All the believers from this mountain were found innocent. So the Lord of the tower ordered stones
    from its roots[d] to be put into the building. He knew that if these stones went into the building,
    they would stay bright and not one of them would turn black.”


    3. “If he had added stones from the other mountains, he would have had to inspect the tower again
    and purify it. But all these were found white,[a] both those who have believed and those who will
    believe. They are of the same kind.[b] This kind is blessed because it is innocent.”


    4. “Now hear about the round, splendid stones. They all come from this white mountain. Why were they
    round? Their riches have darkened and clouded them a little with respect to the truth. But they never
    left God. No evil word came from their mouths. They spoke only righteousness and the virtue of truth.”


    5. “The Lord saw their disposition. He saw that they could favor the truth[c] and remain good. So
    he ordered their wealth to be reduced, rather than taken away completely. They could then do some
    good with what they had left. They will live to God because they are of a good kind. So they were
    trimmed a little and put into this tower’s structure.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The printed Latin inventi, “found,” is Gebhardt’s conjecture with reported L₂/Palatina support.
      The supplied project report identifies the cited L₁ reading as iuvenes, “young.” This draft follows
      the explicit working-edition correction; the Amherst fragment does not preserve enough of this wording
      to certify that correction.
  - marker: b
    reason: textual_variant
    text: The continuous source switches from Greek to Latin at the start of this paragraph. Amherst190
      h verso partly preserves Greek same-kind and innocent-kind wording, but surrounding words and the
      future-belief phrase are damaged or editorially restored. It is a bounded parallel, not a continuous
      Greek replacement for this Latin paragraph.
  - marker: c
    reason: textual_variant
    text: “That they could favor the truth” provisionally translates the dagger-marked Latin crux posse
      eos veritati favere. The wording remains uncertain. The actual 1891 printed apparatus, physical413/printed397,
      proposes posse securitatem (or severitatem) agentes. This proposal was visually rechecked in the
      acquired scan; the earlier drafting report “recognize their servitude” misrepresented its wording
      and is withdrawn. The proposed correction is not adopted here, and no complete alternative English
      sentence is established by that isolated phrase. Amherst190 h stops before this clause and cannot
      settle it. This is a check of the printed edition, not fresh collation of the underlying Latin manuscripts.
  - marker: d
    reason: textual_variant
    text: This paragraph keeps the printed working Greek. According to the supplied apparatus transcription,
      Hilgenfeld added the Greek words for “the roots,” which are reported missing in A (the Athos manuscript).
      The opening “this mountain” follows Harmer’s proposed correction; A is reported to read “the white
      mountain” there. These details come from the supplied transcription, not a fresh check of the manuscript.
