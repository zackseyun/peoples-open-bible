    reason: cross_reference
translation:
  language: ko
  text: 당신은 의를 사랑하시고 악을 미워하셨으므로, 하나님[a], 곧 당신의 하나님께서 기쁨의 기름을 부어 당신에게 기름부으셨습니다. 당신의 동료들보다 더하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러므로 오 하나님, 당신의 하나님께서 기쁨의 기름을 부어 당신에게 기름부으셨습니다. 당신의 동료들보다 더하셨습니다.’ 첫 번째 ‘하나님’을 동사의 주어가 아니라 부름말로 읽을 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리서 1:9에서 인용합니다.
    reason: cross_reference
