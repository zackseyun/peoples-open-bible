  from: Chief Dishon, chief Ezer, chief Dishan—these were the chiefs of the Horites, according to their clans in the land of Seir.
  to: Chief Dishon, chief Ezer, chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
  rationale: Replaced 'according to their clans' with 'according to their chiefs' to reflect לְאַלֻּפֵיהֶם more accurately; otherwise retained the draft wording.
- timestamp: '2026-11-09T17:44:08Z'
