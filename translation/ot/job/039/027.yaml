id: JOB.39.27
reference: Job 39:27
source:
  edition: WLC
  text: אִם עַל פִּ֭י/ךָ יַגְבִּ֣יהַּ נָ֑שֶׁר וְ֝/כִ֗י יָרִ֥ים קִנּֽ/וֹ־־׃
translation:
  text: Is it at your command that the eagle[a] soars and sets its nest on high?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “vulture”; the Hebrew term can refer to either kind of large bird of prey.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  chosen: Is it
  alternatives:
  - Does
  lexicon: HALOT
  rationale: Introduces an interrogative clause in context, not a simple conditional 'if.' English idiom requires an interrogative opening.
- source_word: עַל פִּיךָ
  chosen: at your command
  alternatives:
  - by your mouth
  - according to your word
  lexicon: HALOT
  rationale: Literally 'upon your mouth,' an idiom meaning according to one's command or order. 'At your command' is natural English and preserves the sense of authority.
- source_word: יַגְבִּיהַּ
  chosen: soars
  alternatives:
  - soars
  - makes itself high
  - mounts up
  lexicon: HALOT
  rationale: In this bird context, “soars” naturally conveys rising high.
- source_word: נָשֶׁר
  chosen: eagle
  alternatives:
  - vulture
  lexicon: HALOT
  rationale: Traditional and contextually fitting rendering. While the Hebrew term can overlap with large birds of prey, 'eagle' is the standard gloss in this poetic context and aligns with the bird's lofty nesting imagery.
- source_word: וְכִי
  chosen: and
  alternatives:
  - and indeed
  - that
  lexicon: HALOT
  rationale: Here it links the second verbal clause to the first within the same rhetorical question. A simple 'and' best reflects the coordination in smooth English.
- source_word: יָרִים
  chosen: lifts up
  alternatives:
  - raises
  - sets high
  lexicon: HALOT
  rationale: The verb means to raise or lift. 'Lifts up' preserves the imagery of elevating the nest's placement.
- source_word: קִנּוֹ
  chosen: its nest
  alternatives:
  - his nest
  lexicon: HALOT
  rationale: The suffix is grammatically masculine singular referring to the eagle. English commonly uses 'its' for an animal in generic description.
- source_word: יָרִים קִנּוֹ
  chosen: sets its nest on high
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The expression concerns the elevated placement of the nest, not physically lifting it.
