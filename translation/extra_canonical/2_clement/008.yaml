translation:
  text: 'While we are on earth then, let us reorient[r1]: for we are clay under the craftsman’s hand.


    For in like manner as the potter, if he be making a vessel, and it get twisted or crushed in his hands, reshapes it again; but if he have once put it into the fiery oven, he shall no longer mend it: so also let us, while we are in this world, reorient with our whole heart away from the evil things which we have done in the flesh, that we may be saved by the Lord, while we have yet time for reorientation.


    For after that we have departed out of the world, we can no more make confession there, or reorient any more.


    Wherefore, brethren, if we shall have done the will of the Father and kept the flesh pure and guarded the commandments of the Lord, we shall receive life eternal.


    For the Lord saith in the Gospel, “If ye kept not that which is little, who shall give unto you that which is great? For I say unto you that he which is faithful in the least, is also faithful in much.”


    So then He meaneth this, “Keep the flesh pure and the seal unstained, to the end that we may receive life.”'
  philosophy: provisional optimal-equivalence bridge
  translator_notes:
  - Provisional rendering based on the supplied public-domain English witness.
  - Direct review of the Greek manuscript tradition remains necessary.
  - The imagery and wording of “the seal” have been preserved without interpretation.
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation. This reader text adapts the recorded English translation witness; it is not a verbatim quotation or a newly verified translation of the ancient-language text. The source witness is unchanged.
    reason: lexical_alternative
