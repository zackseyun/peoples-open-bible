reference: Wisdom of Solomon 14:27
source:
  edition: lxx-swete-1909
  text: ἡ γὰρ τῶν ἀνωνύμων εἰδώλων θρησκεία παντὸς ἀρχὴ κακοῦ καὶ αἰτία καὶ πέρας ἐστίν·
  language: Greek
  pages:
