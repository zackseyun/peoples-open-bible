translation:
  text: And when one burns and is destroyed,[a] from then on they will be bound together with them until the completion of
    generation after generation.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected source daggers the verb rendered “burns.” Charles discusses a corrupt construction and proposes a different
      verb in printed28notes31–32. This English keeps the presented heat/destruction sense with disclosed uncertainty rather
      than replacing it with the unsupported phrase “is condemned.” The change from singular to plural reflects the uncertain
      collective relation, not an identified additional person.
    reason: textual_variant
  - marker: b
    text: Literally, “until the completion of generation of generation.” The expression is rendered “generation after generation”
      to preserve the repeated wording.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶበ፡ †ይውዒ፡†
  chosen: And whoever is condemned
  alternatives:
  - And when one is condemned
  - And when it burns
  rationale: The clause introduces the party who subsequently shares the others’ binding. Rendering ወሶበ idiomatically as “whoever”
    produces coherent English in this judgment context, while the daggered, OCR-uncertain verb is understood judicially as
    “is condemned.” Because the supplied witness marks the form as doubtful, the more literal temporal construction and a
    possible burning sense remain documented.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወይማስን፡
  chosen: and destroyed
  alternatives:
  - and ruined
  - and corrupted
  rationale: “Destroyed” preserves the force of the judgment verb without weakening it to moral corruption or expanding it
    into a specific mode of punishment.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እምይእዜ፡
  chosen: from then on
  alternatives:
  - from now on
  - thereafter
  rationale: The phrase marks the point from which the binding continues. “From then on” fits the future judgment sequence
    better than the speaker-relative “from now on.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ምስሌሆሙ፡ ኅቡረ፡ ይትአሰሩ፡
  chosen: will ... be bound together with them
  alternatives:
  - will ... be imprisoned together with them
  - will ... be fettered with them
  rationale: “Bound” directly preserves the recurring imprisonment imagery of the Watchers narrative. “Together with them”
    retains both ምስሌሆሙ (“with them”) and ኅቡረ (“together”) rather than collapsing the phrase.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እስከ፡ ተፍጻሜተ፡ ትውልደ፡ ትውልድ።
  chosen: until the completion of generation after generation
  alternatives:
  - until the end of the generations of generations
  - until the consummation of all generations
  rationale: The rendering keeps the source’s repeated “generation” language and expresses its continuing, age-spanning force
    without adding “all,” which is not explicit in the supplied Ge'ez.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
