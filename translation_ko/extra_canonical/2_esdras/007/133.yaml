  text: and compassionate, because he shows compassion to those who turn back to his law,
translation:
  language: ko
  text: 그리고 자비로우시며, 그분의 율법으로 돌아오는 이들에게 자비를 베푸시기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et miserator
  english_pob_choice: and compassionate
  chosen_korean: 그리고 자비로우시며
  alternatives_korean:
  - 그리고 긍휼이 많으시며
  - 그리고 측은히 여기시는 분이며
  lexicon: miserator
  rationale: 형용사적 서술로서 하나님의 성품을 나타내므로, 단순한 감정이 아니라 지속적 성향을 드러내는 ‘자비로우시며’를 택했습니다.
- source_word: in eo quod miseretur
  english_pob_choice: because he shows compassion
  chosen_korean: 자비를 베푸시기 때문입니다
  alternatives_korean:
  - 긍휼을 베푸시기 때문입니다
  - 불쌍히 여기시기 때문입니다
  lexicon: miseretur
  rationale: 라틴어의 원인절을 자연스러운 한국어 종속절로 옮겨, ‘보여 주다’보다 동작의 결과를 분명히 하는 ‘자비를 베푸시다’로 렌더링했습니다.
- source_word: illis qui conversionem faciunt
  english_pob_choice: to those who turn back
  chosen_korean: 돌아오는 이들에게
  alternatives_korean:
  - 회개하는 이들에게
  - 돌이키는 이들에게
  lexicon: conversionem faciunt
  rationale: conversionem faciunt는 단순한 방향 전환이 아니라 하나님의 율법으로 되돌아오는 행위를 가리키므로, 의미를 살린 ‘돌아오는’으로 번역했습니다.
- source_word: in lege eius
  english_pob_choice: to his law
  chosen_korean: 자기 율법으로
  alternatives_korean:
  - 그분의 율법으로
  - 그의 법으로
  lexicon: lex
  rationale: 라틴어 lege eius의 소유 관계를 그대로 살리되, 문맥상 하나님의 토라를 가리키므로 한국어에서는 자연스럽게 ‘자기 율법’으로 옮겼습니다.
theological_decisions:
- issue: conversionem faciunt의 신학적 뉘앙스
  chosen_reading: 단순한 후회가 아니라 하나님의 율법으로 돌아오는 회심/복귀로 이해했습니다.
  alternative_readings:
  - 일반적인 마음의 변화
  - 도덕적 개선
  rationale: 문맥이 ‘율법’과 연결되므로, 회개를 추상화하기보다 언약적 귀환의 의미를 유지하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 언약적 회심과 율법 순종의 연결
