  from: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
  to: Every swarming or crawling creature[a] on the ground is detestable; it shall not be eaten.
  rationale: The lexical record recognizes that the term covers small creatures moving close to the ground, not only creatures moving in swarms. I convey that breadth while retaining 'detestable' and the direct prohibition, avoiding a moralized substitute such as 'abomination.'
