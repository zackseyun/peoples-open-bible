translation:
  text: '1. “I would like,” I say, “sir, to know in what ways I must serve the good desire.” “Listen,”
    he says. “Practice righteousness and virtue, truth and fear of the Lord, faith and gentleness[a],
    and whatever good things are like these. By doing these things you will be a pleasing servant of God
    and will live to him; and everyone who serves the good desire will live to God.”


    2. So he completed the twelve commandments and says to me, “You have these commandments. Walk in them
    and encourage those who hear, so that their repentance[b] may become pure for the remaining days of
    their life.”


    3. “Carry out diligently this service that I give you, and you will accomplish much. For you will
    find favor among those who are going to repent, and they will be persuaded by your words. For I will
    be with you, and I will compel[c] them to be persuaded by you.”


    4. I say to him, “Sir, these commandments are great and good and glorious, and able to gladden the
    heart of a person who can keep them. But I do not know whether these commandments can be kept by a
    human being, because they are very hard.”


    5. In reply he says to me, “If you set it before yourself that they can be kept, you will keep them
    easily, and they will not be hard. But if it has already risen up in your heart that they cannot be
    kept by a human being, you will not keep them.”


    6. “But now I say to you: if you do not keep these, but pass them by in your thoughts, you will not
    have salvation—neither your children nor your household[d]—because you have already judged for yourself
    that these commandments cannot be kept by a human being.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The working full service list is righteousness, virtue, truth, fear of the Lord, faith and gentleness.
      Lake (1907) Plate VIII retains it. Vulgata printed 65 has a different shorter list; the Latin text
      printed as Palatina at125 is supplied from Vulgata because the Palatina manuscript is missing this
      stretch, not independent Palatina support.
  - marker: b
    reason: textual_variant
    text: Repentance is read in this work’s own moral-change context. Retain pure repentance and the remaining-days
      condition without imposing a uniform added Godward formula.
  - marker: c
    reason: textual_variant
    text: Compel retains anankasō and the repeated be-persuaded construction. Alternatives include constrain
      or force; the difficult assertion is not reduced to merely inviting or helping.
  - marker: d
    reason: textual_variant
    text: Pass them by in your thoughts renders parenthymēthēs provisionally; alternatives include disregard
      them or neglect them. The salvation warning expressly includes children and household. Lake (1907)
      Plate VIII and Vulgata printed 66 retain that warning; the supplied Latin on Palatina printed 127
      is Vulgata-derived and is not an independent witness.
