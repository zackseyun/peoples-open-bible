base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/037.yaml
  text: And as we were going around the enclosed garden, we saw this woman lying with a man, and standing there we watched them talking with one another,
translation:
  language: ko
  text: 우리가 그 뜰을 둘러 돌다가[a] 이 여자가 한 남자와 함께 누워 있는 것을 보았고, 그곳에 서서 그들이 서로 이야기하는 것을 지켜보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 στάδιον은 보통 경기장이나 경주장을 뜻합니다. 이 문맥에서는 둘러싸인 뜰 또는 정원 같은 장소를 가리키는 것으로 이해될 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: κυκλοῦντες τὸ στάδιον
  english_pob_choice: as we were going around the enclosed garden
  chosen_korean: 울타리 친 정원 주위를 돌 때
  alternatives_korean:
  - 닫힌 정원 주위를 돌 때
  - 둘러싸인 정원 주위를 돌 때
  lexicon: κυκλοῦντες; στάδιον
  rationale: τὸ στάδιον은 여기서 단순한 경기장이 아니라 울타리로 둘러싸인 정원으로 이해하는 것이 POB의 영어 본문과 서술 상황에 더 잘 맞습니다. '돌 때'는 진행 중인 동작을 자연스럽게 살렸습니다.
- source_word: ἀναπαυομένην μετὰ ἀνδρός
  english_pob_choice: this woman lying with a man
  chosen_korean: 이 여자가 한 남자와 함께 누워 있는 것을
  alternatives_korean:
  - 이 여자가 한 남자와 쉬고 있는 것을
  - 이 여자가 한 남자와 함께 있는 것을
  lexicon: ἀναπαυομένην; μετά + gen.
  rationale: ἀναπαυομένην은 여기서 '쉬다'보다는 부적절한 성적 동침을 가리키는 문맥상 표현으로 읽히므로, 영어 POB의 'lying with a man'에 맞춰 직설적으로 옮겼습니다.
- source_word: ὁμιλοῦντας ἀλλήλοις
  english_pob_choice: talking with one another
  chosen_korean: 서로 이야기하는 것을
  alternatives_korean:
  - 서로 말하는 것을
  - 서로 대화하는 것을
  lexicon: ὁμιλοῦντας; ἀλλήλοις
  rationale: ὁμιλέω의 기본 의미를 살리되, 한국어에서는 '서로 이야기하다'가 가장 자연스럽고 관찰 진술의 어조를 유지합니다.
theological_decisions:
- issue: 여기서의 행위 묘사를 한국어에서 완곡하게 만들지 여부
  chosen_reading: '''누워 있는 것을''으로 직설적으로 번역해 외설적 정황을 희석하지 않았습니다.'
  alternative_readings:
  - '''쉬고 있는 것을''처럼 완곡하게 번역'
  - '''함께 있는 것을''처럼 의미를 약화'
  rationale: 본문은 고발 진술의 증거로서 구체적 행위를 제시하므로, 도덕적·법정적 함의를 흐리지 않는 직역이 필요합니다.
  doctrine_reference: 서술의 사실성 보존, 간음 고발 문맥
