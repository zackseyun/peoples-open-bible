id: PSA.120.2
reference: Psalms 120:2
source:
  edition: WLC
  text: יְֽהוָ֗ה הַצִּ֣ילָ/ה נַ֭פְשִׁ/י מִ/שְּׂפַת שֶׁ֑קֶר מִ/לָּשׁ֥וֹן רְמִיָּֽה־׃
translation:
  text: Yahweh, deliver me[a] from lying lips, from a deceitful tongue.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “my soul”; here it refers to the speaker as a whole person.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  - LORD
  lexicon: HALOT
  rationale: Direct address in modern English does not require “O.”
- source_word: הַצִּילָה
  chosen: deliver
  alternatives:
  - rescue
  - save
  lexicon: HALOT
  rationale: Imperative of נצל in a plea for rescue. 'Deliver' is idiomatic in prayer language and fits the danger posed by hostile speech without overstating physical peril.
- source_word: נַפְשִׁי
  chosen: me
  alternatives:
  - me
  - my life
  - my self
  lexicon: HALOT
  rationale: Here the word idiomatically denotes the speaker as a whole person.
- source_word: מִשְּׂפַת
  chosen: from ... lips
  alternatives:
  - from the lip of
  - from speech of
  lexicon: HALOT
  rationale: שׂפה literally means 'lip,' often metonymic for speech. The plural 'lips' is the most natural English idiom in the collocation 'lying lips,' even though the Hebrew form is singular in construct.
- source_word: שֶׁקֶר
  chosen: lying
  alternatives:
  - falsehood
  - deception
  - a lie
  lexicon: HALOT
  rationale: 'In construct with ''lips,'' an adjectival rendering is best English: ''lying lips.'' This preserves the sense of false speech more idiomatically than ''lips of falsehood.'''
- source_word: מִלָּשׁוֹן
  chosen: from ... tongue
  alternatives:
  - from language
  - from speech
  lexicon: HALOT
  rationale: לשון literally means 'tongue' and commonly stands for speech. 'Tongue' is retained because the parallelism with 'lips' is poetically important.
- source_word: רְמִיָּה
  chosen: deceitful
  alternatives:
  - treacherous
  - deceptive
  - fraudulent
  lexicon: HALOT
  rationale: The noun denotes deceit or treachery; rendered adjectivally in English to match the construct phrase 'a deceitful tongue.' 'Deceitful' is clear, natural, and preserves the moral character of the speech.
