  - marker: b
    text: ‘함의 땅’은 애굽을 가리키는 시적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂמוּ
  english_pob_choice: performed
  chosen_korean: 행하였습니다
  alternatives_korean:
  - 베풀었습니다
  - 이루었습니다
  - 행했습니다
  lexicon: HALOT
  rationale: 동사 שׂוּם은 문자적으로는 ‘두다/놓다’이지만, 표적과 기사 문맥에서는 그것들을 실제로 ‘행하다’는 뜻으로 자연스럽게 드러내는 것이 적절합니다.
- source_word: בָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데에서
  alternatives_korean:
  - 그들 안에서
  - 그들 중에
  lexicon: HALOT
  rationale: 대상 집단의 내부가 아니라 그들의 한복판에서 일어난 일을 가리키므로, ‘가운데에서’로 옮기는 것이 문맥에 맞습니다.
- source_word: דִּבְרֵי אֹתוֹתָיו
  english_pob_choice: the words of his signs
  chosen_korean: 그의 표적들의 말씀
  alternatives_korean:
  - 그의 표적들의 일들
  - 그의 표적들의 사건들
  - 그의 표적들의 내용
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘표적들의 말씀’이지만, 한국어에서는 ‘말씀’이 단순한 발화보다 ‘선포된 뜻/드러난 표현’의 뉘앙스를 살릴 수 있어 원문의 형식을 유지하면서도 자연스럽게 옮깁니다.
- source_word: וּמֹפְתִים
  english_pob_choice: and wonders
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 경이들
  - 기이한 일들
  - 이적들
  lexicon: HALOT
  rationale: מֹפְתִים은 ‘표적’과 함께 짝을 이루는 관용적 표현으로, 한국어에서는 ‘놀라운 일들’이 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘표적들의 말씀’이라는 다소 낯선 결합을 어떻게 드러낼지
  chosen_reading: 본문의 형식을 살리되, 한국어에서 읽히도록 ‘그의 표적들의 말씀’으로 유지했습니다.
  alternative_readings:
  - 그의 표적들의 일들
  - 그의 표적들의 사건들
  rationale: 히브리어 דִּבְרֵי를 평탄화하면 원문이 가진 수사적 긴장이 사라집니다. 한국어에서도 약간의 낯섦을 감수해 원문 구조를 보존하는 편이 더 투명합니다.
  doctrine_reference: 번역 철학 §§1, 5
