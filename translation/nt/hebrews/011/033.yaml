  rationale: The doctrine guidelines specify 'faith' as the default rendering for πίστις, with alternatives preserved where contested. In Hebrews 11:33 the context is the chapter-wide theme of acting in reliance on God, so 'faith' is the best main-text rendering. The alternatives are noted but not adopted because the verse does not present the sharper ambiguity found in some other passages.
