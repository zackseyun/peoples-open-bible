translation:
  text: 'A few days later, we came back to that place. The Shepherd sat down in the angel’s place, and
    I stood beside him. He said to me, “Tie a piece of unfinished linen around your waist and serve me.”
    So I tied a clean piece of unfinished linen made from sackcloth around my waist.


    2. When he saw that I had tied it around my waist and was ready to serve him, he said, “Call the men
    whose rods were planted. Call them rank by rank, in the same order in which each man handed over his
    rods.” I went out to the field and called them all, and they stood in their ranks.


    3. He tells them, “Each of you must pull up your own rods and bring them to me.”


    4. First, those whose rods were dry and cut handed them in. Their rods were still dry and cut, so
    he ordered them to stand apart from the others.


    5. Then those whose rods were dry but uncut brought them forward. Some handed in green rods, but others
    handed in rods that were dry and cut, looking as though worms had eaten them. He ordered those who
    handed in green rods to stand apart. He told those who handed in dry and cut rods to stand with the
    first group.


    6. Then those whose rods had been half dry and cracked handed them in. Many handed in green rods with
    no cracks. Some rods were green and had shoots bearing fruit, like the fruit on the rods of the crowned
    people who had gone into the tower. Others were dry and worm-eaten. Some were dry but had not been
    eaten, and others were still half dry and cracked. He told each person to stand separately, some with
    their own groups and others apart.'
