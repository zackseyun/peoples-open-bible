  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: idiom
  tier: 1
  from: Men of blood hate the blameless[a], but the upright seek his life.
  to: Bloodthirsty men hate the blameless, but the upright seek to preserve his life.[a]
  rationale: אַנְשֵׁי דָמִים is an established Hebrew designation for violent, bloodguilty people; “bloodthirsty men” is natural English and conveys the sense better than the gloss-like “men of blood.” In the second colon, the contrast requires a benevolent action by the upright. Bare English “seek his life” is now strongly hostile and therefore falsely implies that the upright pursue the blameless person’s death. “Care for his life” is possible but too vague for יְבַקְשׁוּ; “seek to preserve his life” makes the contextual force clear while retaining the life-focused object. The note should report the literal expression without claiming that the full contextual Hebrew sense remains evenly ambiguous.
- timestamp: '2026-11-09T18:36:27Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: Bloodthirsty men hate the blameless, but the upright seek to preserve his life.[a]
  to: Bloodthirsty men hate a blameless man, but the upright seek to preserve his life[a].
  rationale: The August revision rightly removed the misleading implication that upright people seek the blameless man's death. I retain its protective reading, but the earlier record's concern about the difficult second clause warrants a footnote acknowledging the alternative construction.
