id: PSA.87.7
reference: Psalms 87:7
source:
  edition: WLC
  text: וְ/שָׁרִ֥ים כְּ/חֹלְלִ֑ים כָּֽל מַעְיָנַ֥/י בָּֽ/ךְ־׃
translation:
  text: Singers and dancers[a] alike say, “All my springs are in you.”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “flute players.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁרִים
  chosen: Singers
  alternatives:
  - And singers
  - Princes
  lexicon: HALOT
  rationale: From the verb שׁיר ('to sing'), the participial form naturally means 'singers.' Although the consonants can coincide with a noun meaning 'princes' in other contexts, the parallel with כְּחֹלְלִים strongly favors a musical group here.
- source_word: כְּחֹלְלִים
  chosen: as well as dancers
  alternatives:
  - as dancers
  - flute-players
  - those who dance
  lexicon: HALOT
  rationale: This retains the force of the prefixed כְּ in an idiomatic English coordination of the paired celebrants, without adding an unexpressed speech verb or reducing the phrase to a strict simile.
- source_word: כָּל
  chosen: All
  alternatives:
  - Every
  lexicon: HALOT
  rationale: Standard rendering of the totalizing noun/adjective; 'all' fits the poetic declaration better than 'every' in English.
- source_word: מַעְיָנַי
  lemma: מַעְיָן
  chosen: my springs
  alternatives:
  - my fountains
  - my wellsprings
  - my sources
  lexicon: HALOT
  rationale: The noun מַעְיָן denotes a spring or fountain. 'Springs' is concrete and poetic, while still allowing the metaphorical sense of life-source. 'Sources' is interpretive and less vivid, so it is not preferred for the main text.
- source_word: בָּךְ
  chosen: in you
  alternatives:
  - are in you
  - are from you
  lexicon: HALOT
  rationale: 'The preposition ב normally means ''in.'' In context it expresses location or source metaphorically with Zion addressed as feminine singular. English idiom requires the copula with the preceding noun phrase: ''All my springs are in you.'''
