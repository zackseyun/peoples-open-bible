  source_fidelity: 히브리어 פִּי שְׁנַיִם בָּהּ는 관용적으로 ‘그 가운데 삼분의 이’를 뜻합니다. 초안의 ‘두 부분’은 분모인 삼분의 일을 드러내지 않아 수량을 부정확하게 만듭니다. יִכָּרְתוּ יִגְוָעוּ의 ‘끊어지고 죽다’ 및 ‘삼분의 일은 그 안에 남다’는 보존했습니다.
  naturalness: ‘온 땅에 이런 일이 있을 것입니다’와 삽입된 선언문은 현대 표준 한국어로 자연스럽습니다. 다만 ‘그곳에서’는 앞선 ‘온 땅’과 지시 대상이 겹치므로 ‘그 땅에서’가 더 명료합니다.
  terminology: ‘야훼의 말씀입니다’는 נְאֻם יְהוָה에 대한 가능한 현대 한국어 예언문 공식어이며, 신명 표기와 합쇼체도 일관됩니다. 별도 각주는 필요하지 않습니다.
