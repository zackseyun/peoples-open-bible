- source_word: עַל יוֹנַת אֵלֶם רְחֹקִים
  english_pob_choice: according to “The Silent Dove of Distant Places”
  chosen_korean: “멀리 있는 곳의 잠잠한 비둘기”에 맞추어
  alternatives_korean:
  - “멀리 있는 곳의 침묵하는 비둘기”에 맞추어
