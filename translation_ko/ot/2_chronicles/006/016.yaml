revisions:
- from: 이제, 이스라엘의 하나님이신 주님, 주의 종 내 아버지 다윗에게 말씀하신 것을 지켜 주십시오. 곧 「이스라엘의 왕좌에 앉을 사람이 내 앞에서 너에게서 끊어지지 않을 것입니다. 다만 네 자손들이 내 율법 안에서 걸어가는 너의 길을 지키기만 한다면, 네가 내 앞에서 걸어갔던 것처럼 말입니다」 하셨습니다.[a]
  to: 이제 이스라엘의 하나님이신 주님, 주의 종 내 아버지 다윗에게 말씀하신 것을 지켜 주십시오. 곧 ‘네게서 이스라엘의 왕좌에 앉아 내 앞에 설 사람이 끊어지지 않을 것이다. 다만 네 자손들이 네가 내 앞에서 걸었던 것처럼 내 율법 안에서 걸어가도록 그들의 길을 지킨다면 그러할 것이다’ 하고 말씀하셨습니다.[a]
  rationale: 조건절을 원문의 소유 관계에 맞게 ‘그들의 길’로 바로잡고, 그 길을 지키는 목적·내용인 ‘내 율법 안에서 걸어가다’를 명확히 연결했습니다. 왕위 계승 약속은 ‘네게서 ... 사람이 끊어지지 않는다’로 재배열하여, 다윗 왕조에서 이스라엘 왕좌에 앉을 사람이 없어지지 않는다는 뜻을 분명히 했습니다. 조건이 약속 전체에 걸린다는 점을 한국어에서 드러내기 위해 ‘그러할 것이다’를 보충했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:18:40Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 청원의 목적어 관계는 대체로 정확하지만, 조건절에서 ‘네 자손들이 ... 너의 길을 지키다’라고 하여 원문의 ‘네 자손들이 그들의 길을 지키다’를 바꾸었습니다. 또한 ‘내 율법 안에서 걸어가다’는 자손들의 길을 지키는 행위의 내용으로 연결되어야 합니다.
  naturalness: ‘이스라엘의 왕좌에 앉을 사람이 내 앞에서 너에게서 끊어지지 않을 것입니다’는 수식 관계와 ‘너에게서’의 연결이 다소 불명확합니다. ‘네게서 ... 사람이 끊어지지 않을 것이다’로 배열하면 현대 한국어에서도 더 자연스럽고 의미가 선명합니다.
  terminology: ‘이스라엘의 하나님이신 주님’, ‘주의 종 내 아버지 다윗’, ‘율법’은 적절합니다. יהוה를 ‘주님’으로 처리한 설명 각주도 현재 번역 정책상 유지할 수 있습니다.
  issues:
  - severity: high
    issue: 조건절의 소유·지시 관계가 바뀜
    rationale: 원문은 ‘네 자손들이 그들의 길을 지키면’(יִשְׁמְרוּ בָנֶיךָ אֶת־דַּרְכָּם)이라고 말합니다. 초안의 ‘내 율법 안에서 걸어가는 너의 길’은 길을 다윗의 것으로 바꾸고, ‘내 율법 안에서 걸어감’을 ‘길’의 수식어로 전환합니다.
  - severity: medium
    issue: 왕조 지속 약속의 한국어 수식 관계가 불명확함
    rationale: ‘사람이 내 앞에서 너에게서 끊어지지 않는다’는 ‘내 앞에서’와 ‘너에게서’가 모두 ‘끊어지다’에 걸리는 듯 읽힐 수 있습니다. 왕좌에 앉는 사람이 다윗에게서 끊어지지 않는다는 원문의 관계를 명확히 해야 합니다.
