translation:
  language: ko
  text: 야훼의 말씀이 내게 임하여 이르셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יהוה(YHWH). 전통적으로 ‘여호와’ 또는 ‘주’로 옮기기도 하지만, 여기서는 고유명 ‘야훼’로 음역합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 와서
  - 이르러
  lexicon: HALOT
  rationale: 예언 공식에서 ‘말씀이 ... 임하다’는 히브리어 서술 흐름을 자연스럽게 옮기면서, 단순한 발생이 아니라 하나님의 계시가 도착하는 뉘앙스를 살립니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: דְבַר־יְהוָה의 관용적 예언 공식에 맞추어 ‘말씀’으로 옮겨, 특정한 신적 선포라는 의미를 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명 사קרא(the Tetragrammaton)를 프로젝트 기본값에 따라 음역하여, 본래의 고유명을 보존합니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시며
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 직접화법 도입을 한국어에서 자연스럽게 풀어, 뒤따를 신탁 내용이 야훼의 발화임을 분명히 합니다.
theological_decisions:
- issue: 신적 발화 공식의 한국어 재현
  chosen_reading: ‘야훼의 말씀이 내게 임하여 말씀하셨습니다’로 옮겨, 계시의 주체와 도착을 모두 드러냈습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 이르러 말씀하셨습니다’
  - ‘야훼의 말씀이 내게 와서 말씀하셨습니다’
  rationale: 히브리 예언서의 표준 서두는 단순한 전달이 아니라 야훼의 말씀이 예언자에게 도래하는 계시 사건을 나타내므로, ‘임하다’의 종교적·서사적 무게를 살리는 것이 적절합니다.
  doctrine_reference: 예언적 계시와 하나님의 선포에 관한 일반 번역 원칙
