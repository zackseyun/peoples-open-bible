id: MAL.1.6
reference: Malachi 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ֛ן יְכַבֵּ֥ד אָ֖ב וְ/עֶ֣בֶד אֲדֹנָ֑י/ו וְ/אִם אָ֣ב אָ֣נִי אַיֵּ֣ה כְבוֹדִ֡/י וְ/אִם אֲדוֹנִ֣ים אָנִי֩ אַיֵּ֨ה מוֹרָאִ֜/י אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת לָ/כֶם֙ הַ/כֹּֽהֲנִים֙ בּוֹזֵ֣י שְׁמִ֔/י וַ/אֲמַרְתֶּ֕ם בַּ/מֶּ֥ה בָזִ֖ינוּ אֶת שְׁמֶֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/006.yaml
  text: A son honors his father, and a slave his master. If, then, I am a father, where is my honor? And if I am a master, where is the fear due me? says the LORD of Armies to you, O priests who despise my name. Yet you say, “How have we despised your name?”
translation:
  language: ko
  text: 아들은 아버지를 공경하고, 종은 자기 주인을 공경합니다. 그러므로 내가 아버지라면, 내게 마땅한 공경이 어디 있습니까? 내가 주인이라면, 나를 두려워함이 어디 있습니까? 만군의 야훼께서 너희에게, 곧 내 이름을 멸시하는 제사장들에게 말씀하십니다. 그런데 너희는 “우리가 어떻게 당신의 이름을 멸시했습니까?”라고 말합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종
  lexicon: עֶבֶד
  rationale: 원문은 사회적 종속 관계를 가리키지만, 이 절의 대조 구조상 ‘아들/아버지’와 짝을 이루는 일반적 종속 호칭으로 기능하므로 한국어 본문은 ‘종’으로 두되, 영어 POB의 ‘slave’ 선택을 반영하는 민감한 용어는 각주로 확인할 수 있게 했습니다.
- source_word: אֲדֹנָי / אֲדוֹנִים
  english_pob_choice: master
  chosen_korean: 주인
  alternatives_korean:
  - 주인
  - 주님
  - 주
  lexicon: אדון
  rationale: 본절의 비유는 인간 주종 관계를 말하므로, 하나님 호칭인 ‘주님’이 아니라 관계적 의미가 분명한 ‘주인’이 원문 구조를 가장 직접적으로 반영합니다.
- source_word: כָּבוֹד
  english_pob_choice: honor
  chosen_korean: 존경
  alternatives_korean:
  - 존경
  - 영광
  - 공경
  lexicon: כבוד
  rationale: 아버지에게는 ‘공경’, 하나님께는 그에 대응하는 응답으로 ‘존경’을 사용해 원문의 대구를 살렸습니다. 다만 ‘영광’은 여기서는 다소 추상적이어서 본문의 질문형 대조가 약해집니다.
- source_word: מוֹרָא
  english_pob_choice: fear
  chosen_korean: 두려워하는 마음
  alternatives_korean:
  - 두려움
  - 경외
  - 두려워하는 마음
  lexicon: מורא
  rationale: 원문은 단순 감정 공포보다 권위자에게 마땅한 경외적 두려움을 뜻하므로, ‘경외’보다 문장 안에서 자연스러운 ‘두려워하는 마음’으로 풀어 의미 범위를 드러냈습니다.
- source_word: בּוֹזֵי שְׁמִי
  english_pob_choice: you who despise my name
  chosen_korean: 내 이름을 업신여기는 제사장들
  alternatives_korean:
  - 내 이름을 업신여기는 제사장들
  - 내 이름을 멸시하는 제사장들
  lexicon: בזה + שם
  rationale: 영어 POB의 ‘despise’에 해당하는 동사를 한국어 ‘업신여기다’로 옮겨, 단순 무관심이 아니라 경멸적 태도를 분명히 했습니다.
theological_decisions:
- issue: 야훼 호칭과 직접 발화의 격식
  chosen_reading: 만군의 야훼께서 말씀하십니다.
  alternative_readings:
  - 만군의 주께서 말씀하십니다.
  - 만군의 여호와께서 말씀하십니다.
  rationale: WLC의 יְהוָה를 프로젝트 기본값인 ‘야훼’로 옮기고, 예언적 책망의 직접 발화는 현대 합쇼체로 유지했습니다.
  doctrine_reference: 사 42:8; 말 1:6
- issue: ‘아버지/주인’ 비유의 수사적 긴장
  chosen_reading: 하나님을 아버지이면서 주인으로 병렬 제시하여, 마땅한 공경과 두려움의 결핍을 동시에 책망하는 구조를 살렸습니다.
  alternative_readings:
  - ‘아버지’만 강조하는 독법
  - ‘주인’만 강조하는 독법
  rationale: 원문은 দুটি 수사 질문을 통해 언약적 친밀성과 권위적 경외를 함께 요구하므로, 둘 중 하나로 약화시키지 않았습니다.
  doctrine_reference: 출 20:12; 신 6:13
