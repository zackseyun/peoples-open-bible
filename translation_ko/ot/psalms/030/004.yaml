translation:
  language: ko
  text: 야훼를 찬양하십시오, 그의 신실한 이들아. 그의 거룩하심을 기억하며 감사하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 신실한 이들’은 ‘그의 성도들’ 또는 ‘그의 경건한 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 거룩하심의 기억에 감사하십시오’입니다. ‘그의 거룩하심을 기념하며’ 또는 ‘그의 거룩하심을 언급하며 감사하십시오’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: 신성호칭 יְהוָה는 POB의 원칙에 따라 신적 고유명사로 옮기고, 한국어에서는 직접 호격을 살려 ‘야훼여’로 표현했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 생명
  - 저를
  lexicon: HALOT
  rationale: נפשׁ의 의미 범위 가운데 시적·인간론적 울림을 살리기 위해 ‘영혼’을 택했고, ‘생명’도 가능한 해석이지만 본문 이미지를 더 직접적으로 보존하는 표현으로 정했습니다.
- source_word: מִן שְׁאוֹל
  english_pob_choice: from Sheol
  chosen_korean: 스올에서
  alternatives_korean:
  - 음부에서
  - 무덤에서
  - 죽은 자들의 세계에서
  lexicon: HALOT
  rationale: שְׁאוֹל은 단순한 무덤보다 죽은 자들의 영역을 가리키므로, 한국어 본문에서는 음역 ‘스올’을 유지해 의미를 약화시키지 않았습니다.
- source_word: מִיּוֹרְדֵי בוֹר
  english_pob_choice: from among those going down to the pit
  chosen_korean: 구렁으로 내려가는 자들 가운데서
  alternatives_korean:
  - 구렁으로 내려가는 자들로부터
  - 구덩이로 내려가는 자들 가운데서
  lexicon: HALOT
  rationale: ‘pit’의 בּוֹר는 죽음의 구덩이/무덤 이미지를 담으므로, 한국어에서는 ‘구렁’으로 옮겨 시적 압박감을 살렸고, מן+분사구를 ‘가운데서’로 풀어 분리의 의미를 드러냈습니다.
theological_decisions:
- issue: 스올과 구렁을 한국어에서 어떻게 처리할지
  chosen_reading: 스올과 구렁의 죽음-구출 이미지를 그대로 유지하고, 지옥·무덤·부활로 단정하지 않았습니다.
  alternative_readings:
  - 스올을 무덤으로 번역
  - 구출을 부활로 명시
  rationale: 시편의 표현은 죽음의 영역에서 건져 올리시는 구원 이미지를 말하지만, 본문 자체가 후대의 특정 종말론 용어로 정리되지는 않으므로 그 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
