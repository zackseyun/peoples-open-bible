    rationale: ‘칼집으로 돌아가십시오’는 번역문 자체로 충분히 이해되며, 현 각주는 실질적인 이문·어휘 대안 정보를 제공하지 않습니다. 또한 표지가 절 끝에 있어 특정 어구의 주석으로 기능하기 어렵습니다.
