theological_decisions:
- issue: The scope of the promise not to repeat sin
  chosen_reading: A promise concerning the people described in this passage during their lives
  alternative_readings:
  - A general doctrine that the righteous become incapable of sin
  rationale: The verse repeats 'throughout all the days of their lives'; it does not explain the mechanism of their future conduct.
- issue: The source of the wrath
  chosen_reading: Leave the agent unspecified
  alternative_readings:
  - God's wrath
  rationale: The Ge'ez names wrath but does not explicitly identify its source in this clause.
- issue: Everlasting peace alongside a numbered lifespan
  chosen_reading: Retain both expressions without reconciling them
  alternative_readings:
  - Reduce 'everlasting' to 'lifelong'
  - Read the verse as explicitly promising bodily immortality
  rationale: The witness places the expansive peace formula beside repeated references to the days of their lives.
