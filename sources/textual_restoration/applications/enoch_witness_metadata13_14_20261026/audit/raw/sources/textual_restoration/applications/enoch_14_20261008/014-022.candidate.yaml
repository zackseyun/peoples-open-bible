translation:
  text: Burning fire was around him, and a great fire stood before him. None of those
    around him could approach him; myriads upon myriads were before him, yet he himself
    desired no counsel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Charles1906 daggers the final wording, literally in two parts “and he does
      not desire; and he himself—counsel.” This provisional rendering takes counsel
      as the object and retains the emphatic pronoun. His apparatus21 discusses corruption
      and a different Greek clause about his word/deed; that clause is not silently
      imported into the main text.
    reason: textual_variant
lexical_decisions: []
theological_decisions:
- issue: The figure's relation to counsel
  chosen_reading: He sought no counsel.
  alternative_readings:
  - He needed no counselor.
  rationale: The translation does not turn an uncertain expression about counsel into
    an explicit assertion of divine self-sufficiency.
