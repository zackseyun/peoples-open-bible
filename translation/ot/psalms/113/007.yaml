  rationale: The Hebrew uses vivid material images ('dust,' 'ash heap') and social categories ('poor,' 'needy'). The translation keeps these concrete terms and does not import a purely spiritual interpretation, though such application may be drawn theologically.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
