  text: 우리가 이스라엘 모든 지파에서 백 명마다 열 명을, 천 명마다 백 명을, 만 명마다 천 명을 뽑아 백성이 먹을 양식을 마련하게 하겠습니다. 그들이 베냐민의 기브아에 이르러, 기브아가 이스라엘에서 저지른 그 모든 망측한 일에 따라 갚게 하려는 것입니다.
