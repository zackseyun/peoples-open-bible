id: WIS.14.19
reference: Wisdom of Solomon 14:19
source:
  edition: lxx-swete-1909
  text: ὁ μὲν γὰρ τάχα κρατοῦντι βουλόμενος ἀρέσαι ἐξεβιάσατο τῇ τέχνῃ τὴν ὁμοιότητα ἐπὶ τὸ κάλλιον·
  language: Greek
  pages:
  - 647
  confidence: high
  validation: agree
  note: This verse is being loaded from the normalized translation-ready override layer derived from the adjudicated corpus. Translation-ready override derived from final_corpus_adjudicated; dropped duplicate chapter 20 and spillover beyond Wisdom 19:22.
translation:
  text: For the craftsman, perhaps wishing to please the ruler, used his skill to make the likeness more beautiful than the ruler himself[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'forced the likeness toward greater beauty.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τάχα
  chosen: perhaps
  alternatives:
  - quickly
  - possibly
  lexicon: LSJ
  rationale: In this context τάχα most naturally signals uncertainty or supposition about motive ('perhaps'), not temporal speed. The author is inferring the craftsman's intention.
- source_word: κρατοῦντι
  chosen: the ruler
  alternatives:
  - the one in power
  - the sovereign
  - the authority
  lexicon: LSJ
  rationale: The participle denotes the one exercising power or rule. 'The ruler' is natural English and fits the social-political setting of flattering a powerful patron.
- source_word: βουλόμενος ἀρέσαι
  chosen: wishing to please
  alternatives:
  - wanting to gratify
  - desiring to win favor with
  lexicon: LSJ
  rationale: The participle plus infinitive expresses purpose or intent. 'Wishing to please' preserves both the volitional nuance and the straightforward sense of ἀρέσκω.
- source_word: ἐξεβιάσατο
  chosen: forced
  alternatives:
  - strained
  - compelled
  - distorted
  lexicon: LSJ
  rationale: The middle verb conveys exerting force beyond what is natural. Here it describes the artist pressing the representation beyond ordinary resemblance. 'Forced' preserves that sense without overinterpreting.
- source_word: τῇ τέχνῃ
  chosen: by his skill
  alternatives:
  - by art
  - by craftsmanship
  - through his craft
  lexicon: LSJ
  rationale: τέχνη can mean art, craft, or technical skill. 'By his skill' communicates the means used and reads naturally in modern English.
- source_word: τὴν ὁμοιότητα
  chosen: the likeness
  alternatives:
  - the image
  - the resemblance
  lexicon: LSJ
  rationale: ὁμοιότης refers to resemblance or likeness. 'The likeness' is the most direct rendering and avoids prematurely identifying it as an idol-image apart from the immediate wording.
- source_word: ἐπὶ τὸ κάλλιον
  chosen: into a more beautiful form
  alternatives:
  - for the better
  - toward greater beauty
  - into something finer
  lexicon: LSJ
  rationale: The phrase indicates movement toward something more beautiful or finer. 'Into a more beautiful form' makes explicit the result of the forcing while remaining close to the Greek sense.
