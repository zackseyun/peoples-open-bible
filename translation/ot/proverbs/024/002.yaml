id: PRO.24.2
reference: Proverbs 24:2
source:
  edition: WLC
  text: כִּי שֹׁ֭ד יֶהְגֶּ֣ה לִבָּ֑/ם וְ֝/עָמָ֗ל שִׂפְתֵי/הֶ֥ם תְּדַבֵּֽרְנָה־׃
translation:
  text: For their hearts contemplate violence, and their lips speak of harm.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - because
  lexicon: HALOT
  rationale: Introduces the reason for the preceding prohibition in v.1; 'for' is natural English and preserves the explanatory force.
- source_word: שֹׁד
  chosen: destruction
  alternatives:
  - destruction
  - devastation
  - plunder
  lexicon: HALOT
  rationale: A contextually valid sense of destructive ruin; “violence” and “devastation” remain possible alternatives.
- source_word: יֶהְגֶּה
  chosen: contemplate
  alternatives:
  - murmurs
  - plots
  - devises
  lexicon: HALOT
  rationale: Natural English for inward pondering without adding a specific plan or plot.
- source_word: לִבָּם
  chosen: their hearts
  alternatives:
  - their mind
  - their inner being
  lexicon: HALOT
  rationale: A distributive plural is idiomatic English for the plural group represented by Hebrew’s collective singular.
- source_word: וְעָמָל
  chosen: trouble
  alternatives:
  - mischief
  - toil
  - harm
  lexicon: HALOT
  rationale: Appropriately broad for harmful mischief or trouble in the parallel line.
- source_word: שִׂפְתֵיהֶם
  chosen: their lips
  alternatives:
  - their mouth
  lexicon: HALOT
  rationale: A literal rendering preserves the Hebrew poetic image and the contrast between inner heart and outward speech.
- source_word: תְּדַבֵּרְנָה
  chosen: speak
  alternatives:
  - utter
  - declare
  lexicon: HALOT
  rationale: Simple present 'speak' fits the proverbial style and naturally renders the imperfect in this gnomic context.
