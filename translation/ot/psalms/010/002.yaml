id: PSA.10.2
reference: Psalms 10:2
source:
  edition: WLC
  text: בְּ/גַאֲוַ֣ת רָ֭שָׁע יִדְלַ֣ק עָנִ֑י יִתָּפְשׂ֓וּ בִּ/מְזִמּ֖וֹת ז֣וּ חָשָֽׁבוּ׀׃
translation:
  text: In his pride, the wicked man hotly pursues the poor; may the wicked be caught in the schemes they have devised[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “the poor are caught in the schemes the wicked have devised.” The Hebrew leaves uncertain both who is caught and whether the clause expresses a wish or a statement.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת
  chosen: in the pride of
  alternatives:
  - through the pride of
  - because of the pride of
  lexicon: HALOT
  rationale: 'The preposition ב plus גַּאֲוָה is rendered locatively/instrumentally as ''in the pride of,'' preserving the Hebrew compactness while allowing the phrase to function adverbially: the wicked person''s proud arrogance is the setting or motive for the action.'
- source_word: רָשָׁע
  chosen: the wicked
  alternatives:
  - the wicked man
  - a wicked man
  lexicon: HALOT
  rationale: Singular adjective/substantive used generically. 'The wicked' is idiomatic in English and preserves the representative singular without over-specifying individuality.
- source_word: יִדְלַק
  chosen: is hotly pursued
  alternatives:
  - pursues
  - burns against
  - persecutes
  lexicon: HALOT
  rationale: The verb דלק can denote burning or pursuing closely. In this context with 'the poor' as object, the sense is hostile pursuit/persecution. The passive English construction reflects the likely sense that the poor is the one being chased, matching common contextual understanding of the verse.
- source_word: עָנִי
  chosen: the poor man
  alternatives:
  - the poor
  - the afflicted
  lexicon: HALOT
  rationale: עָנִי often denotes the poor, afflicted, or oppressed person. 'The poor man' preserves the singular and the anthropological focus. This follows the project's gender-accurate principle for a grammatically masculine representative singular.
- source_word: יִתָּפְשׂוּ
  chosen: may the wicked be caught
  alternatives:
  - they are caught
  - may they be seized
  lexicon: HALOT
  rationale: The plural Niphal imperfect plausibly has jussive force; the supplied collective referent makes the English clear.
- source_word: בִּמְזִמּוֹת
  chosen: in the schemes
  alternatives:
  - by the schemes
  - in the plots
  - by the devices
  lexicon: HALOT
  rationale: מְזִמּוֹת can be plans, devices, or schemes; in this hostile context 'schemes' conveys malicious intent naturally. The preposition ב is retained as 'in,' expressing entrapment within their own plotting.
- source_word: זוּ
  chosen: they have
  alternatives:
  - which they have
  lexicon: HALOT
  rationale: זוּ is a relative particle. English often omits the explicit relative pronoun in a restrictive clause after a plural noun phrase; 'the schemes they have devised' is smoother than 'the schemes which they have devised' while preserving sense.
- source_word: חָשָׁבוּ
  chosen: devised
  alternatives:
  - planned
  - thought out
  lexicon: HALOT
  rationale: חשב in this context refers to intentional planning. 'Devised' captures deliberate, crafty plotting and fits the negative moral context.
- source_word: בְּגַאֲוַת רָשָׁע
  chosen: In his pride, the wicked man
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The construct phrase describes the arrogant wicked person as the subject of the following verb.
- source_word: יִדְלַק עָנִי
  chosen: hotly pursues the poor
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The active verb and following noun are best represented as subject and object, respectively.
