  from: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
  to: But Jesus said, “Father, forgive them, for they do not know what they are doing[a].” And they cast lots to divide his garments[b].
  rationale: The prior decision to include the prayer while noting its manuscript omission is retained, as is the deliberately unspecified “them.” The earlier preference for “was saying” overreads what the imperfect requires in this narrative setting.
