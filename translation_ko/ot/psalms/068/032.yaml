translation:
  language: ko
  text: '땅의 나라들아, 하나님께 노래하십시오.

    주께 찬양을 노래하십시오. 셀라.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֶאֱתָיוּ
  english_pob_choice: shall come
  chosen_korean: 오며
  alternatives_korean:
  - 옵니다
  - 도착합니다
  - 공물을 바칩니다
  lexicon: HALOT
  rationale: 동사의 기본 의미는 '오다'이므로, 문맥상 확장 해석인 공물 제시는 피하고 도래 자체를 살렸습니다.
- source_word: חַשְׁמַנִּים
  english_pob_choice: nobles
  chosen_korean: 고귀한 자들
  alternatives_korean:
  - 귀족들
  - 사신들
  - 군왕들
  lexicon: HALOT
  rationale: 희귀어의 핵심은 이집트에서 오는 높은 지위의 사람들을 가리키는 점이므로, 신분의 높음을 드러내되 사신으로 단정하지 않기 위해 '고귀한 자들'로 옮겼습니다.
- source_word: כּוּשׁ
  english_pob_choice: Cush
  chosen_korean: 구스
  alternatives_korean:
  - 에티오피아
  lexicon: HALOT
  rationale: 고유 지명을 현대 외래어 표기보다 본문 전통을 살려 음역했으며, 후대 지리명으로 치환하지 않았습니다.
- source_word: תָּרִיץ יָדָיו
  english_pob_choice: shall quickly stretch out its hands
  chosen_korean: 자기 손을 재빨리 내밉니다
  alternatives_korean:
  - 손을 급히 뻗습니다
  - 손을 서둘러 내밉니다
  - 손을 재빨리 펼칩니다
  lexicon: HALOT
  rationale: 히필형의 '재촉하다/달리게 하다' 뉘앙스를 손을 드는 관용으로 풀어, 신체 행위의 속도와 방향을 함께 살렸습니다.
theological_decisions:
- issue: 구스가 하나님께 손을 내미는 행위의 의미
  chosen_reading: 이 구절은 구스의 경배, 간구, 또는 항복의 몸짓을 열어 두며, 이를 특정한 외교 행위나 완결된 구원론으로 좁히지 않았습니다.
  alternative_readings:
  - 공물을 바치는 외교적 행위
  - 언약 편입을 단정하는 표현
  rationale: 손을 하나님께 뻗는 관용구는 기도·간구·예배를 모두 아우를 수 있으므로, 본문이 말하는 나라들의 전향만을 보존하고 세부 의미는 단정하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
