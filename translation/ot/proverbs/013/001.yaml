id: PRO.13.1
reference: Proverbs 13:1
source:
  edition: WLC
  text: בֵּ֣ן חָ֭כָם מ֣וּסַר אָ֑ב וְ֝/לֵ֗ץ לֹא שָׁמַ֥ע גְּעָרָֽה־׃
translation:
  text: A wise son heeds a father's discipline, but a scoffer does not listen to rebuke.
  philosophy: dynamic
lexical_decisions:
- source_word: בֵּן
  chosen: son
  alternatives:
  - child
  lexicon: HALOT
  rationale: The Hebrew noun is singular masculine and in proverb style commonly presents a representative case. Per the project's gender-accurate policy, 'son' is retained rather than neutralizing to 'child.'
- source_word: חָכָם
  chosen: wise
  alternatives:
  - skillful
  lexicon: HALOT
  rationale: In wisdom literature the adjective denotes practical wisdom and moral discernment; 'wise' is the standard and most natural rendering here.
- source_word: מוּסַר
  chosen: discipline
  alternatives:
  - instruction
  - correction
  lexicon: HALOT
  rationale: מוּסַר in Proverbs often carries the sense of formative correction or training, not mere information. 'Discipline' best captures the father's corrective instruction in this contrast with rebuke.
- source_word: אָב
  chosen: a father's
  alternatives:
  - his father's
  - of a father
  lexicon: HALOT
  rationale: The construct phrase מוּסַר אָב is rendered idiomatically as 'a father's discipline.' Hebrew lacks an explicit possessive suffix, so 'his father's' would over-specify.
- source_word: לֵץ
  chosen: scoffer
  alternatives:
  - mocker
  lexicon: HALOT
  rationale: In Proverbs לֵץ is a settled wisdom-category for one who arrogantly mocks correction. 'Scoffer' preserves that moral posture slightly better than the more generic 'mocker.'
- source_word: שָׁמַע
  chosen: heeds / does not listen to
  alternatives:
  - hears
  - obeys
  lexicon: HALOT
  rationale: The expressed verb in the second colon supplies the elided predicate in the first; “heeds” gives its contextual force naturally.
- source_word: גְּעָרָה
  chosen: rebuke
  alternatives:
  - reproof
  lexicon: HALOT
  rationale: The noun denotes a verbal reprimand. 'Rebuke' is clear modern English and fits the contrast with discipline.
