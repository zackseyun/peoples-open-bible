id: PRO.14.32
reference: Proverbs 14:32
source:
  edition: WLC
  text: בְּֽ֭/רָעָת/וֹ יִדָּחֶ֣ה רָשָׁ֑ע וְ/חֹסֶ֖ה בְ/מוֹת֣/וֹ צַדִּֽיק׃
translation:
  text: In calamity[a] the wicked are overthrown, but the righteous take refuge even at death[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “By their evil”; the Hebrew word can refer either to calamity or to wickedness.
    reason: alternative_reading
  - marker: b
    text: Greek and Syriac versions read “in their integrity” rather than “at death.”
    reason: textual_variant
lexical_decisions:
- source_word: בְּרָעָתוֹ
  chosen: In his calamity
  alternatives:
  - In his calamity
  - By his trouble
  - When disaster comes upon him
  lexicon: HALOT
  rationale: The prepositional phrase naturally gives the circumstance of the wicked person’s downfall here; the word retains a possible moral sense, noted in the footnote.
- source_word: יִדָּחֶה
  chosen: is driven away
  alternatives:
  - is thrust down
  - is overthrown
  - is cast down
  lexicon: HALOT
  rationale: The Niphal of נדח/דחה carries the sense of being driven away, thrust aside, or overthrown. 'Is driven away' preserves the passive nuance and reads naturally in English without overinterpreting the exact mode of downfall.
- source_word: רָשָׁע
  chosen: the wicked man
  alternatives:
  - the wicked
  - a wicked man
  lexicon: HALOT
  rationale: The singular adjective functions substantivally. 'The wicked man' preserves the masculine singular form in keeping with the gender-accurate policy, while still representing a proverbial type rather than one individual.
- source_word: וְחֹסֶה
  chosen: finds refuge
  alternatives:
  - takes refuge
  - has refuge
  - is secure
  lexicon: HALOT
  rationale: חסה commonly means to seek or find refuge. Because the form is a participle used proverbially and contrasted with the wicked man's ruin, 'finds refuge' communicates the settled result in idiomatic English. 'Takes refuge' is also possible, but may sound overly volitional in a context where the exact object of trust is not explicit.
- source_word: בְּמוֹתוֹ
  chosen: at his death
  alternatives:
  - at his death
  - when he dies
  lexicon: HALOT
  rationale: This is idiomatic English while preserving the phrase’s temporal/circumstantial ambiguity and avoiding an added claim of afterlife hope.
- source_word: צַדִּיק
  chosen: the righteous
  alternatives:
  - the righteous man
  - a righteous man
  lexicon: HALOT
  rationale: The substantival adjective refers to the righteous person as a proverbial class. 'The righteous' is natural English and preserves the contrast with 'the wicked man.'
- source_word: חֹסֶה
  chosen: takes refuge
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The participle denotes one taking refuge; this preserves the verbal image without supplying the unstated object of trust.
