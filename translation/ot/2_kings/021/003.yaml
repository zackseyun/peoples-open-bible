translation:
  text: He rebuilt the high places[a] that his father Hezekiah had destroyed. He erected altars to Baal and made an image of Asherah[b], as Ahab king of Israel had done. He bowed down to all the heavenly bodies[c] and worshiped them.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Local shrines, often on hilltops.
    reason: cultural_note
  - marker: b
    text: Asherah was a Canaanite goddess; her name also designated a sacred object associated with her worship.
    reason: cultural_note
  - marker: c
    text: 'Literally, ''all the host of heaven'': the sun, moon, and stars worshiped as divine powers.'
    reason: lexical_alternative
