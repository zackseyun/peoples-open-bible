review_pass:
  verdict: revise
  source_fidelity: 'The draft translates a different verse (Psalm 21:10): its wording concerning their fruit, descendants, earth, and humanity has no basis in the Hebrew text of Psalm 21:11. Psalm 21:11 speaks of enemies directing evil against the king/recipient, devising a plan, and being unable to accomplish it.'
  naturalness: The proposed revision uses natural modern formal Korean and retains the poetic parallelism without mechanically reproducing the Hebrew idiom.
  terminology: ‘악을 꾀하다’ and ‘계략을 꾸미다’ convey the hostile intent of רָעָה and מְזִמָּה. ‘이루지 못할 것입니다’ makes the implicit object of יוּכָלוּ explicit from the immediately preceding plan, as in the English audit trail.
  issues:
  - severity: high
    issue: The submitted Korean text is for Psalm 21:10 rather than Psalm 21:11.
    rationale: 'The draft contains ‘그들의 열매,’ ‘땅에서,’ and ‘그들의 자손,’ corresponding to the preceding verse, while omitting every major element of the supplied source for verse 11: intended evil against you, devised a scheme, and inability to carry it out.'
  - severity: high
    issue: The lexical decisions and footnote are likewise attached to the wrong Hebrew verse.
    rationale: They discuss פִּרְיָמוֹ, מֵאֶרֶץ, תְּאַבֵּד, and מִבְּנֵי אָדָם, none of which occurs in the source text for Psalm 21:11. The obsolete footnote anchor must therefore be removed.
  revised_text: 그들이 주께 악을 꾀하고 계략을 꾸몄으나, 이루지 못할 것입니다.
  revised_footnotes: []
