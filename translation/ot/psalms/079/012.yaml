  from: repay our neighbors sevenfold into their lap the reproach
  to: repay into the lap of our neighbors sevenfold the reproach
  rationale: The current word order places the prepositional phrase 'into their lap' between the verb's indirect object ('our neighbors') and its direct object ('the reproach'), a structure known as heavy-NP shift. While grammatically permissible, it creates an awkward and slightly stilted cadence in English. The suggested rewrite combines the dative recipient ('to our neighbors') and the destination ('into their lap') into a single, more fluid prepositional phrase ('into the lap of our neighbors'). This improves the flow and clarity of the English sentence without losing any of the Hebrew's meaning.
