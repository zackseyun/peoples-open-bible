translation:
  text: He told me, “This first one is Mikael, merciful and slow to anger. The second, who is over every illness
    and every wound of humankind, is Rufael. The third, who is over all power, is Gebriel. The fourth, who is over
    repentance for the hope of those who will inherit eternal life, is named Fanuel.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mikael, Rufael, Gebriel and Fanuel follow the selected Ethiopic name forms rather than silently substituting
      their more familiar English spellings. The fourth figure is linked with repentance and hope; the text does
      not explicitly name a separate office beyond the relation stated here.
    reason: cultural_note
