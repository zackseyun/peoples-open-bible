revisions:
- from: '그러므로 요셉은 외모가 아름답고 모습이 아름다웠습니다. 이는 그 안에 악한 것이 아무것도 머물지 않았기 때문입니다. 곧 얼굴은 영의 혼란을 드러냅니다.


    이제 내 자녀들아, 주 앞에서 너희 마음을 선하게 하고, 사람들 앞에서 너희 길을 곧게 하십시오. 그러면 너희는 주와 사람들 앞에서 은혜를 얻게 될 것입니다.


    그러므로 성적 부도덕에서 자신을 지키십시오. 성적 부도덕은 모든 악의 어머니이며, 하나님에게서 멀어지게 하고 벨리알에게 가까이 가게 합니다.


    내가 에녹의 글에서 보니, 너희 아들들은 성적 부도덕으로 타락할 것이며, 레위의 아들들에게 칼로 해를 끼칠 것입니다.


    그러나 그들은 레위에 맞서 설 수 없을 것입니다. 그가 주의 전쟁을 싸울 것이며 너희의 모든 진영을 이길 것이기 때문입니다.


    그리고 그들은 수가 적을 것이며, 레위와 유다 가운데 나뉘어 있을 것입니다. 또 너희 중에서는 아무도 지도자가 되지 못할 것입니다. 우리 조상도 자기의 축복들에서 그렇게 예언했기 때문입니다.[a][b][c][d][e]'
  to: '그러므로 요셉은 용모가 빼어났고 보기에 아름다웠습니다. 이는 그 안에 악한 것이 아무것도 머물지 않았기 때문입니다. 얼굴은 영의 혼란을 드러내기 때문입니다.


    이제 나의 자녀들아, 주 앞에서 너희 마음을 선하게 하고, 사람들 앞에서 너희 길을 곧게 하십시오. 그러면 너희는 주와 사람들 앞에서 은혜를 얻게 될 것입니다.


    그러므로 성적 부도덕을 멀리하십시오. 성적 부도덕은 온갖 악의 어머니이며, 하나님에게서 멀어지게 하고 벨리아르에게 가까이 가게 합니다.


    내가 에녹의 기록에서 보니, 너희 아들들은 성적 부도덕 가운데서 멸망할 것이며, 칼로 레위의 아들들에게 불의를 행할 것입니다.


    그러나 그들은 레위에게 맞서지 못할 것입니다. 그가 주의 전쟁을 치르고 너희의 모든 진영을 이길 것이기 때문입니다.


    그들은 수가 적어 레위와 유다 안에서 나뉘어 있을 것이며, 너희 가운데서는 아무도 지도자가 되지 못할 것입니다. 우리 아버지께서도 자신의 축복들 가운데서 그렇게 예언하셨기 때문입니다.'
  rationale: 원문의 어휘적 대비와 문법적 관계를 보존하면서 현대 표준 한국어 합쇼체로 다듬었습니다. 특히 멸망의 수동 의미, ‘우리 아버지’라는 원문 표현, Βελίαρ의 음역을 바로잡았고, 내용 없는 각주 표지를 제거했습니다. ‘레위와 유다 안에서 나뉘어 있을 것’은 ἐπιμεριζόμενοι의 정확한 분배 방식이 분명하지 않으므로 해석을 과도하게 확정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:19Z'
review_pass:
  verdict: revise
  source_fidelity: 여러 핵심 의미는 잘 전달되었으나, φθαρήσονται를 단순히 ‘타락할 것’으로 옮긴 것은 ‘파멸/멸망을 당할 것’이라는 수동적 결과를 약화합니다. 또한 ‘우리 조상’은 πατὴρ ἡμῶν(우리 아버지)을 바꾸며, Βελίαρ는 그리스어 본문에 더 가까운 ‘벨리아르’로 옮기는 편이 안전합니다. 마지막의 독립된 각주 표지는 해당 각주가 제공되지 않아 삭제해야 합니다.
  naturalness: 합쇼체 권면문은 전반적으로 자연스럽습니다. 다만 ‘그가 주의 전쟁을 싸울’은 한국어 결합이 다소 어색하므로 ‘주의 전쟁을 치를’로 다듬었습니다. ‘외모가 아름답고 모습이 아름다웠습니다’도 같은 뜻의 반복이므로 원문의 두 병렬 표현을 살리면서 ‘용모가 빼어나고 보기에 아름다웠습니다’로 정리했습니다.
  terminology: πορνεία는 현대적이고 포괄적인 ‘성적 부도덕’으로 유지할 수 있습니다. πνεῦμα은 성령으로 특정하지 않고 ‘영’으로 유지했습니다. ‘은혜’는 χάρις의 문맥상 적절합니다. Βελίαρ는 원문 음역을 따라 ‘벨리아르’로 표기했습니다.
  issues:
  - severity: medium
    issue: φθαρήσονται를 ‘타락할 것’으로 번역함
    rationale: φθείρω의 수동 미래형은 여기서 단순한 도덕적 타락보다 ‘멸망하게 되다/파멸을 당하다’라는 결과를 나타냅니다. 뒤따르는 칼의 폭력과도 ‘멸망할 것’이 더 잘 맞습니다.
  - severity: medium
    issue: πατὴρ ἡμῶν을 ‘우리 조상’으로 번역함
    rationale: 원문은 ‘우리의 아버지’이며, 문맥상 야곱을 가리키는 가족 관계 표현을 보존해야 합니다.
  - severity: low
    issue: Βελίαρ를 ‘벨리알’로 표기함
    rationale: ‘벨리알’은 널리 알려진 대응형이지만, 이 그리스어 본문의 표기는 Βελίαρ이므로 원문 우선 원칙상 ‘벨리아르’가 더 직접적입니다.
  - severity: medium
    issue: 본문 끝에 [a]–[e] 각주 표지가 있으나 각주 내용이 없음
    rationale: 독자가 참조할 수 없는 표지는 구조적으로 불완전하므로 삭제해야 합니다.
