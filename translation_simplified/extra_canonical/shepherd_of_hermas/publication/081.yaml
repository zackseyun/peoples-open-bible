revisions:
- category: publication_review_correction
  rationale: 'In iv.6, ὑπὸ τῶν παρθένων specifies the agent of handing over, while οὐδὲ διὰ τῆς πύλης
    παρενηνεγμένοι separately denies passage through the gate without specifying an agent. The correction
    preserves both negations and does not permit passage by someone other than the virgins. Existing note
    [d] continues to disclose the shorter alternative.; Independently compared with iv.2 and iv.8: shared
    support and the color-change condition occur here, but understanding and the tower lord’s inspection
    do not.; Removes the out-of-unit conjectural-negation claim and reconciles the rationale with the
    corrected paragraph 6 and its retained textual-variant note.; The selected unit contains no explicitly
    conjectural negative. This replacement records the distinctions actually preserved in S.9.iv, including
    the corrected separate gate negation, without changing the disclosed alternatives.'
