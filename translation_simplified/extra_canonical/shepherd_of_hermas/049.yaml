  text: 'III.1. He showed me many trees that had no leaves, but they seemed to me to be dry; for they
    were all alike. And he says to me, “Do you see these trees?” “I see,” I say, “sir, that they are alike
    and dry.” Answering, he says to me, “These trees that you see are those who dwell in this age.”


    III.2. “Why then, sir, are they as if dry and alike?” I say. “Because,” he says, “neither the righteous
    nor the sinners are visible in this age[a], but they are alike; for this age is winter for the righteous,
    and they are not visible while dwelling among sinners.”


    III.3. “For just as in winter the trees, having cast off their leaves, are alike, and it is not apparent
    which are dry or which are living, so in this age neither the righteous nor the sinners are apparent,
    but all are alike.”


    IV.1. He showed me again many trees, some sprouting and others dry, and he says to me, “Do you see
    these trees?” “I see,” I say, “sir, some sprouting and others dry.”


    IV.2. “These trees that are sprouting,” he says, “are the righteous, who are about to dwell in the
    age to come; for the age to come is summer for the righteous, but winter for sinners. Therefore when
    the mercy of the Lord shines forth, then those serving God will be made manifest, and all will be
    made manifest[b].”


    IV.3. “For just as in summer the fruits of each tree become visible and are recognized for what they
    are, so also the fruits of the righteous will be visible, and all will be known, flourishing in that
    age[c].”


    IV.4. “But the nations and the sinners—like the dry trees you saw—will be found dry and fruitless
    in that age. They will be burned up like wood and will be manifest[d], because their conduct has been
    evil in their life. For the sinners will be burned because they sinned and did not repent[e]; the
    nations will be burned because they did not know the one who created them.”


    IV.5. “Therefore bear fruit, so that your fruit may be known in that summer. Keep away from many activities,
    and you will not go wrong in anything[f]. For those who do many things also sin much, being distracted
    about their activities and not serving their own Lord at all.”


    IV.6. “How then,” he says, “can such a person ask anything from the Lord and receive it, while not
    serving the Lord? For[g] those who serve him will receive their requests; but those who do not serve
    the Lord will receive nothing.”


    IV.7. “But if someone undertakes one activity, he can also serve the Lord. For his mind will not be
    corrupted away from the Lord[h]; rather, he will serve him, keeping his mind pure.”


    IV.8. “Therefore, if you do these things, you can bear fruit for the age to come; and whoever does
    these things will bear fruit[i].”'
