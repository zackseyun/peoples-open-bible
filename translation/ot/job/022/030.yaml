id: JOB.22.30
reference: Job 22:30
source:
  edition: WLC
  text: יְֽמַלֵּ֥ט אִֽי נָקִ֑י וְ֝/נִמְלַ֗ט בְּ/בֹ֣ר כַּפֶּֽי/ךָ־׃פ
translation:
  text: He will deliver even one who is not innocent[a], who will escape through the cleanness of your hands[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “He will deliver the innocent”; the opening Hebrew expression is difficult.
    reason: alternative_reading
  - marker: b
    text: Clean hands symbolize innocence and moral integrity.
    reason: cultural_note
lexical_decisions:
- source_word: יְמַלֵּט
  chosen: delivers
  alternatives:
  - rescues
  - causes to escape
  lexicon: HALOT
  rationale: The Piel of מלט commonly conveys causing someone to escape or delivering/rescuing. 'Delivers' is concise, natural English and fits the parallel with the following Niphal.
- source_word: אִי
  chosen: even one who is not
  alternatives:
  - island/coastland
  - not
  lexicon: HALOT
  rationale: In this difficult verse, אִי is best taken idiomatically in the traditional sense as a negative particle-like usage yielding 'not,' as reflected by the context and ancient/major translation tradition. The sense is that deliverance extends even to a person lacking innocence. The nominal sense 'island/coastland' does not fit the syntax here.
- source_word: נָקִי
  chosen: innocent
  alternatives:
  - clean
  - guiltless
  lexicon: HALOT
  rationale: נָקִי often denotes innocence or freedom from guilt. 'Innocent' best captures the moral/judicial nuance in context.
- source_word: וְנִמְלַט
  chosen: who will escape
  alternatives:
  - and he will escape
  - and he will be rescued
  lexicon: HALOT
  rationale: The relative clause expresses the likely linkage to the person in the first colon and removes English pronoun ambiguity.
- source_word: בְּבֹר
  chosen: through the cleanness
  alternatives:
  - by the purity
  - through the purity
  lexicon: HALOT
  rationale: The consonantal text points to בֹּר, commonly understood here in the sense of purity/cleanness, especially in the idiom with hands. Rendering the preposition instrumentally as 'through' communicates means without over-literal awkwardness.
- source_word: כַּפֶּיךָ
  chosen: of your hands
  alternatives:
  - of your palms
  - of your hand
  lexicon: HALOT
  rationale: The dual/plural form refers idiomatically to 'hands.' In Hebrew, clean hands symbolize innocence or moral integrity; the phrase is preserved in understandable English.
- source_word: אִי נָקִי
  chosen: even one who is not innocent
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This preserves the traditional privative construal without intensifying it to an unambiguous assertion of guilt.
