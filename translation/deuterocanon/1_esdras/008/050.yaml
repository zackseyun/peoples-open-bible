lexical_decisions:
- source_word: ζητῆσαι
  chosen: to seek
  alternatives:
  - to ask for
  - to request
  lexicon: LSJ
  rationale: The infinitive means 'to seek' or 'to ask for.' 'Seek' preserves the verbal connection to petitioning God without
    over-specifying the manner of request.
- source_word: παρʼ αὐτοῦ
  chosen: from him
  alternatives:
  - before him
  - at his hand
  lexicon: LSJ
  rationale: With ζητῆσαι, παρά + genitive naturally indicates the source from whom the request is sought. 'From him' is the
    clearest modern English rendering.
- source_word: εὐοδίαν
  chosen: a prosperous journey
  alternatives:
  - good journey
  - success on the way
  - safe journey
  lexicon: LSJ
  rationale: The Greek expression is rendered 'a prosperous journey' in this unit. The selected Greek, not an approximate
    cross-reference, controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: ἡμῖν τε καὶ τοῖς τέκνοις ἡμῶν καὶ κτήνεσιν
  chosen: for us and for our children and livestock
  alternatives:
  - for us and our sons and cattle
  - for us and our little ones and beasts
  lexicon: LSJ
  rationale: τέκνοις is broader than 'sons' and is well rendered 'children.' κτήνεσιν refers to domesticated animals/property
    animals; 'livestock' is natural modern English and fits the caravan setting.
