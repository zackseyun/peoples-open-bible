  text: I call on Yahweh, who is worthy to be praised, and I am saved from my enemies.[a]
  footnotes:
  - marker: a
    text: Or 'my rock' for 'my crag' (סַלְעִי); the Hebrew uses two related but distinct terms here, סֶלַע and צוּר.
    reason: lexical_alternative
  - marker: b
    text: Or 'in him I take refuge.'
    reason: lexical_alternative
  - marker: c
    text: '''Horn'' is a metaphor for strength and victorious saving power.'
    reason: cultural_note
translation:
  language: ko
  text: 찬양받으실 만한 야훼[a]를 내가 부르며, 내 원수들에게서 구원을 받습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야훼’는 하나님의 이름 YHWH를 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 원수들에게서 구원을 받으리이다.’ 히브리어 동사는 미래의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
