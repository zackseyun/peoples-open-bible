id: PRO.11.20
reference: Proverbs 11:20
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה עִקְּשֵׁי לֵ֑ב וּ֝/רְצוֹנ֗/וֹ תְּמִ֣ימֵי דָֽרֶךְ־׃
translation:
  text: Those whose hearts are crooked are an abomination to Yahweh, but those whose ways are blameless are his delight.
  philosophy: dynamic
lexical_decisions:
- source_word: תּוֹעֲבַת
  chosen: an abomination
  alternatives:
  - detestable
  - a detestable thing
  lexicon: HALOT
  rationale: The noun denotes something abhorrent or detestable, often with strong moral or covenantal revulsion. 'An abomination' preserves the intensity and proverbial terseness better than a softer paraphrase.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: עִקְּשֵׁי לֵב
  chosen: those whose hearts are crooked
  alternatives:
  - the perverse of heart
  - those with twisted hearts
  lexicon: HALOT
  rationale: This preserves the heart and crookedness imagery in a natural English construction.
- source_word: וּרְצוֹנוֹ
  chosen: are his delight
  alternatives:
  - are his favor
  - are acceptable to him
  - his pleasure is in
  lexicon: HALOT
  rationale: The noun means pleasure, favor, or delight, with the 3ms suffix referring to the LORD. Rendering the verbless clause as 'are his delight' is idiomatic in English and preserves the contrast with 'abomination.'
- source_word: תְּמִימֵי דָרֶךְ
  chosen: those blameless in their way
  alternatives:
  - the blameless in way
  - those of blameless conduct
  - the upright in conduct
  lexicon: HALOT
  rationale: תָּמִים here carries the sense of integrity, wholeness, or blamelessness; דֶּרֶךְ in wisdom literature commonly refers to one's course of life or conduct. 'Blameless in their way' preserves the Hebrew idiom while remaining readable. The plural is represented by 'those' and 'their' for natural English.
