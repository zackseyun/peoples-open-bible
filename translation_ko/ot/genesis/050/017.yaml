id: GEN.50.17
reference: Genesis 50:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה תֹאמְר֣וּ לְ/יוֹסֵ֗ף אָ֣נָּ֡א שָׂ֣א נָ֠א פֶּ֣שַׁע אַחֶ֤י/ךָ וְ/חַטָּאתָ/ם֙ כִּי רָעָ֣ה גְמָל֔וּ/ךָ וְ/עַתָּה֙ שָׂ֣א נָ֔א לְ/פֶ֥שַׁע עַבְדֵ֖י אֱלֹהֵ֣י אָבִ֑י/ךָ וַ/יֵּ֥בְךְּ יוֹסֵ֖ף בְּ/דַבְּרָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Yosef: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Yosef wept when they spoke to him.'
translation:
  language: ko
  text: “요셉에게 이렇게 말하십시오. ‘부디 형제들의 허물과 그들의 죄를 용서해 주십시오. 그들이 당신에게 악으로 갚았기 때문입니다. 이제 부디 당신 아버지의 하나님을 섬기는 종들의 허물을 용서해 주십시오.’” 그들이 그에게 말할 때 요셉은 울었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיוֹסֵף / Yosef
  english_pob_choice: Yosef
  chosen_korean: 요셉
  alternatives_korean:
  - 요세프
  - 요세푸스
  lexicon: 고유명사
  rationale: 한국어 성경에서 폭넓게 통용되는 형태를 따르되, 인명 표기는 현대 표기 관행에 맞춰 자연스럽게 옮겼습니다.
- source_word: שָׂא נָא פֶּשַׁע ... וְחַטָּאתָם
  english_pob_choice: Please forgive the transgression ... and their sin
  chosen_korean: 부디 형제들의 허물과 그들의 죄를 용서해 주십시오
  alternatives_korean:
  - 부디 형제들의 죄과와 그들의 죄를 사해 주십시오
  - 부디 형제들의 범죄와 그들의 죄를 용서해 주십시오
  lexicon: פֶּשַׁע / חַטָּאת
  rationale: פֶּשַׁע는 단순한 실수보다 관계를 깨는 ‘허물/죄과’에 가깝고, חַטָּאת은 일반적인 ‘죄’로 유지해 병렬을 살렸습니다.
- source_word: רָעָה גְמָלוּךָ
  english_pob_choice: they repaid you with evil
  chosen_korean: 그들이 당신에게 악으로 갚았기 때문입니다
  alternatives_korean:
  - 그들이 당신에게 악한 일을 했기 때문입니다
  - 그들이 당신을 악으로 대했기 때문입니다
  lexicon: גמל
  rationale: 문맥상 보복의 상응 관계를 드러내는 ‘갚다’가 가장 직접적이며, רָעָה는 행위의 질을 ‘악’으로 유지했습니다.
- source_word: עַבְדֵי אֱלֹהֵי אָבִיךָ
  english_pob_choice: the servants of the God of your father
  chosen_korean: 아버지의 하나님을 섬기는 종들
  alternatives_korean:
  - 아버지의 하나님의 종들
  - 아버지 하나님의 종들
  lexicon: עֶבֶד
  rationale: 히브리어의 소유격 관계를 한국어에서 자연스럽게 풀어, ‘하나님을 섬기는 종들’로 아버지의 하나님께 속한 정체성을 분명히 했습니다.
theological_decisions:
- issue: 반복 청유형 ‘שָׂא נָא’의 정서와 예의 표현
  chosen_reading: 두 번 모두 ‘부디 … 용서해 주십시오’로 옮겨 간청의 반복과 긴박한 호소를 살렸습니다.
  alternative_readings:
  - ‘제발 … 용서하십시오’
  - ‘간절히 … 용서해 주십시오’
  rationale: 본문은 단순 정보 전달이 아니라 대리 요청의 간절함을 강조하므로 반복되는 נָא를 두 차례의 공손한 간청으로 보존하는 것이 적절합니다.
  doctrine_reference: 형제 간 화해와 용서의 요청
- issue: ‘아버지의 하나님’이라는 호칭의 보존
  chosen_reading: ‘아버지의 하나님’ 표현을 그대로 유지해 족장 전승과 언약적 정체성을 드러냈습니다.
  alternative_readings:
  - ‘너희 아버지의 하나님’
  - ‘우리 아버지의 하나님’
  rationale: 청자에게 전달되는 호칭 자체가 이야기의 신학적 배경이므로, 소유 관계를 과도하게 풀지 않고 문맥을 보존했습니다.
  doctrine_reference: 언약 공동체와 족장 신앙
