simplification_decisions:
- pob_phrase: And Peter said to them
  simplified_phrase: Peter said to them
  preserved_meaning: Peter directly addresses the people.
  reasoning_layer_used: source syntax and POB translation
  rationale: The opening “And” is unnecessary in clear modern English.
- pob_phrase: Repent, and let each of you be baptized
  simplified_phrase: Repent. Every one of you must be baptized
  preserved_meaning: Peter commands repentance and baptism while emphasizing each person's response.
  reasoning_layer_used: lexical decisions for Μετανοήσατε, βαπτισθήτω, and ἕκαστος ὑμῶν
  rationale: Two direct sentences make the commands and individual emphasis easier to grasp.
- pob_phrase: and you will receive
  simplified_phrase: You will receive
  preserved_meaning: Peter promises that they will receive the Holy Spirit's gift.
  reasoning_layer_used: lexical decision for λήμψεσθε
  rationale: A new sentence keeps the promise clear without changing its force.
translation_notes:
