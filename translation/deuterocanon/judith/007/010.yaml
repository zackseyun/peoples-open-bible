  from: For this people[a], the sons of Israel, do not rely on their spears, but on the heights of their mountains, in which they themselves dwell[b]; for it is not easy to approach the summits of their mountains.
  to: For these Israelites do not rely on their spears but on the mountain heights where they live, because the summits of their mountains are not easy to reach.
