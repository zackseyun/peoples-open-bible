id: ISA.51.23
reference: Isaiah 51:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י/הָ֙ בְּ/יַד מוֹגַ֔יִ/ךְ אֲשֶׁר אָמְר֥וּ לְ/נַפְשֵׁ֖/ךְ שְׁחִ֣י וְ/נַעֲבֹ֑רָה וַ/תָּשִׂ֤ימִי כָ/אָ֨רֶץ֙ גֵּוֵ֔/ךְ וְ/כַ/ח֖וּץ לַ/עֹבְרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/023.yaml
  text: And I will put it into the hand of those who afflict you, who said to you, ‘Bow down, so that we may pass over’; and you made your back like the ground, and like the street for those passing by.
translation:
  language: ko
  text: 그리고 내가 그것을 너를 괴롭히는 자들의 손에 넘기겠습니다. 그들은 네게 ‘엎드려서 우리가 지나가게 하라’고 말했습니다. 너는 네 등을 땅처럼, 지나가는 이들을 위한 거리처럼 만들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֹוגָיִךְ / those who afflict you
  english_pob_choice: those who afflict you
  chosen_korean: 너를 괴롭히는 자들
  alternatives_korean:
  - 너를 압제하는 자들
  - 너를 고통 주는 자들
  - 너를 학대하는 자들
  lexicon: 괴롭히다
  rationale: POB가 afflict를 단순한 감정적 '괴롭힘'보다 실제 가해를 포함하는 폭넓은 표현으로 두었으므로, 문맥에 맞게 가장 직접적인 동적 대응인 ‘괴롭히는 자들’을 택했습니다.
- source_word: שְׁחִי וְנַעֲבֹרָה / Bow down, so that we may pass over
  english_pob_choice: Bow down, so that we may pass over
  chosen_korean: 엎드려서 우리가 지나가게 하라
  alternatives_korean:
  - 몸을 낮추어 우리가 지나가게 하라
  - 엎드리라, 그러면 우리가 지나가겠다
  lexicon: 엎드리다
  rationale: 히브리어 명령형의 굴욕적 자세를 살리기 위해 ‘엎드리다’를 택했고, 이어지는 목적/결과를 자연스럽게 드러내기 위해 ‘우리가 지나가게 하라’로 옮겼습니다.
- source_word: כָאָרֶץ / the ground
  english_pob_choice: the ground
  chosen_korean: 땅같이
  alternatives_korean:
  - 땅처럼
  - 땅과 같이
  - 지면처럼
  lexicon: 땅
  rationale: 원문의 비유를 간결하게 살리되, 한국어에서 자연스럽고 문어적인 대비를 위해 ‘땅같이’를 사용했습니다.
- source_word: כַחוּץ / the street
  english_pob_choice: the street
  chosen_korean: 거리처럼
  alternatives_korean:
  - 길처럼
  - 거리와 같이
  - 대로처럼
  lexicon: 거리
  rationale: 길목을 밟고 지나가는 공적 공간의 이미지를 살리기 위해 ‘거리’로 옮겼습니다. 한국어에서 ‘street’의 상투적 번역이지만, 여기서는 모욕적 비유를 분명히 전달합니다.
theological_decisions:
- issue: 보복 선언의 주체와 동사 시제
  chosen_reading: ‘내가 … 넘기겠습니다’로 하나님이 직접 보응하시는 현재-미래형 선언을 유지했습니다.
  alternative_readings:
  - ‘내가 … 넘길 것이다’
  - ‘내가 … 넘깁니다’
  rationale: 원문의 첫 인칭 완료/미래적 선언을 한국어 예언문맥에 맞게 장차의 단호한 행위로 표현하되, 합쇼체로 정돈했습니다.
  doctrine_reference: 신적 보응과 예언적 선언의 일치
- issue: ‘지나가는 이들’의 범위
  chosen_reading: 일반적 행인으로 좁히지 않고, 모욕을 가하는 통행자 전체를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 지나는 사람들
  - 지나가는 자들
  rationale: 문맥상 단순한 보행자라기보다, 멸시 속에 몸을 길로 내준 상태를 말하므로 ‘지나가는 이들’로 폭넓게 두었습니다.
  doctrine_reference: 문맥 우선의 은유 보존
