  text: But because your heart is hard and unwilling to repent[b], you are storing up wrath for yourself for the day of wrath, when God reveals his righteous judgment.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Or: “God’s just judgment.”'
    reason: lexical_alternative
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
