source:
  edition: WLC
  text: אֲבָרֲכָ֣ה אֶת יְהוָ֣ה בְּ/כָל עֵ֑ת תָּ֝מִ֗יד תְּֽהִלָּת֥/וֹ בְּ/פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/001.yaml
  text: I will bless Yahweh at all times[a]; his praise will continually be in my mouth.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; alternatively rendered ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 나는 언제나 야훼[a]를 송축하겠습니다. 그분을 향한 찬양이 늘 내 입에 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘YHWH’; ‘야훼’로도 음역합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  english_pob_choice: Of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗에 대한 시
  - 다윗으로부터
  lexicon: HALOT
  rationale: 시편 표제의 לְ + 인명은 저작, 관련, 헌정의 폭을 함께 담을 수 있어 “다윗의 시”가 가장 자연스럽고 그 모호성을 과도하게 좁히지 않습니다.
- source_word: בְּשַׁנּוֹתֹו
  english_pob_choice: when he changed
  chosen_korean: 그가 … 바꾸었을 때
  alternatives_korean:
  - 그가 … 변경했을 때
  - 그가 … 바꾸는 중에
  lexicon: HALOT
  rationale: 부정사구의 시간적 용법을 살려 “~했을 때”로 옮겼고, 현대 한국어에서 가장 자연스러운 동사는 “바꾸다”입니다.
- source_word: טַעְמוֹ
  english_pob_choice: his behavior
  chosen_korean: 자기 행동
  alternatives_korean:
  - 자기 분별
  - 자기 태도
  - 자기 이성
  lexicon: HALOT
  rationale: 직역상 ‘맛/분별’ 계열이지만, 문맥상 외적 처신과 기색을 가리키므로 ‘행동’이 가장 과도한 해석 없이 의미를 전달합니다.
- source_word: אֲבִימֶלֶךְ
  english_pob_choice: Abimelech
  chosen_korean: 아비멜렉
  alternatives_korean:
  - 아기스
  lexicon: HALOT
  rationale: 히브리어 본문 표기를 그대로 옮기고, 사무엘상 21장의 아기스와의 관련성은 본문에 흡수하지 않고 각주로 처리하는 것이 원문 우선 원칙에 맞습니다.
theological_decisions:
- issue: 아비멜렉과 아기스의 역사적 동일시
  chosen_reading: 본문에는 ‘아비멜렉’을 유지하고, 동일시 가능성은 각주로만 제시했습니다.
  alternative_readings:
  - 아기스로 정정하여 번역
  - 아비멜렉을 왕호 또는 별칭으로 이해
  rationale: 시편 표제의 히브리어 어형을 보존하면서도, 사무엘상 21장과의 관련은 독자가 확인할 수 있게 남겨 두는 편이 번역과 주석의 경계를 가장 분명히 합니다.
  doctrine_reference: 원문 우선 원칙; 역사적 조화보다 본문 표면형 보존; 주석으로 해소할 수 있는 긴장은 본문에서 제거하지 않음
