translation:
  text: '1. “Listen now,”[h] he says, “foolish one, to how sorrow wears down[a] the Holy Spirit and again
    saves.”


    2. “When a double-minded person[b] undertakes some deed and fails because of his double-mindedness,
    this sorrow enters the person. It grieves the Holy Spirit and wears it down.”[i]


    3. “Then again, when quick temper[c] clings to a person about some matter and he becomes very bitter,
    sorrow again enters the heart of the person who became quick-tempered. He grieves over the deed he
    did and repents[g] because he did evil.”


    4. “This sorrow therefore seems to have salvation,[f] because the person who did evil repented. So
    both actions grieve the Spirit. Double-mindedness does so because it did not succeed in its deed.
    Quick temper grieves the Spirit because it did evil. Both double-mindedness and quick temper are grievous
    to the Holy Spirit.”


    5. “So remove sorrow from yourself. Do not afflict the Holy Spirit who dwells in you, lest it plead
    against you with God[d] and depart from you.”


    6. “For the Spirit of God given into this flesh does not endure sorrow or anguish.”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: Wears down renders ektribei; alternatives include wears away or rubs out. Both the wearing-down
      and saving assertions are retained.
  - marker: b
    reason: lexical_alternative
    text: Double-minded retains the named dipsychos disposition, with doubt or wavering as lexical alternatives.
  - marker: c
    reason: lexical_alternative
    text: Quick temper renders oxycholia, the same disposition named in section i. Irascibility is an
      alternative.
  - marker: d
    reason: textual_variant
    text: The working source brackets against you (kata sou) and expressly includes to God. The English
      restores against you, omitted in the former draft. Lake1907 Plate VII lines54–55 has against you
      without to God. Vulgata printed57 has ask the Lord, and Palatina printed109 ask from God, both without
      an explicit against you. These differing constructions are disclosed rather than silently combined
      into unanimous testimony.
  - marker: e
    reason: textual_variant
    text: The working Greek and Athos transcription include both sorrow and anguish. Palatina printed109
      likewise includes sorrow and such distresses; Vulgata printed57 has sorrow without the second term.
      Both working terms are retained.
  - marker: f
    reason: textual_variant
    text: Working seems to have salvation (dokei sōtērian echein) is retained with its causal repentance
      explanation. Athos Plate VII lines51–52 also has this assertion. Vulgata printed57 lacks the separate
      salvation sentence here, while Palatina printed109 has a salvation statement and expands the subsequent
      contrast. The fuller Greek is not shortened or expanded to harmonize either Latin.
  - marker: g
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: h
    reason: textual_variant
    text: The working now (nyn) follows Harmer’s version-supported correction; Lake1907 Plate VII line47
      instead has therefore (oun). Vulgata printed57 has now, and Palatina printed109 has therefore now.
      The English follows the disclosed working reading.
  - marker: i
    reason: textual_variant
    text: At paragraph2 Lake1907 Plate VII line49 adds and again saves before and wears it down. The working
      Greek lacks this extra saving clause at that location. Both printed Latin versions also lack that
      intervening clause. The main translation retains the selected working sequence; the saving claim
      at1 and4 remains.
