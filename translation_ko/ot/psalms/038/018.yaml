  text: For I confess my iniquity[a][b]; I am anxious because of my sin.
  footnotes:
  - marker: a
    text: Or 'I am troubled about my sin.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I declare my iniquity.' The Hebrew verb literally means 'I make known' or 'I declare'; 'confess' reflects the penitential context.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 죄악을 고백하고 내 죄 때문에 근심하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고백하고’는 직역하면 ‘알리고’ 또는 ‘드러내고’입니다.
