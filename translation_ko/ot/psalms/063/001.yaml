  yaml_path: translation/ot/psalms/063/001.yaml
  text: God, you are my God; I seek you at dawn.[a] My soul thirsts for you, my flesh longs for you, in a dry and weary land without water.
  footnotes:
  - marker: a
    text: Or 'by David' or 'for David'; the Hebrew heading 'of David' can indicate authorship, dedication, or association.
    reason: alternative_reading
  - marker: b
    text: Or 'desert of Judah.' The Hebrew term can refer broadly to wilderness or desert terrain.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 시[a]입니다. 그가 유다의 광야[b]에 있을 때입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗이 지은’ 또는 ‘다윗을 위한’. 히브리어 표제의 ‘다윗의’는 저자, 헌정, 연관을 모두 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘사막’. 히브리어는 광야나 사막 지형을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
