  yaml_path: translation/ot/1_samuel/025/042.yaml
  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: ko
  text: 아비가일은 급히 일어나 나귀를 타고, 자기를 따라가는 젊은 여종 다섯과 함께 다윗의 사자들을 따라가서 그의 아내가 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  english_pob_choice: quickly got up
  chosen_korean: 급히 일어나
  alternatives_korean:
  - 빨리 일어나
  - 서둘러 일어나
  lexicon: מהר / קום
  rationale: 동사의 연쇄가 행동의 신속함을 강조하므로, 현대 한국어에서 가장 자연스럽고 간결한 ‘급히 일어나’로 옮겼습니다.
- source_word: חֲמוֹר
  english_pob_choice: donkey
  chosen_korean: 나귀
  alternatives_korean:
  - 당나귀
  lexicon: חמור
  rationale: 성경 본문에서 일반적으로 쓰이는 짐승 이름을 유지하면서도 현대어로 읽히는 ‘나귀’를 택했습니다.
- source_word: נַעֲרֹתֶיהָ הַהֹלְכוֹת לְרַגְלָהּ
  english_pob_choice: with five of her young women going after her
  chosen_korean: 자기 젊은 여자 종 다섯을 데리고 뒤따라갔습니다
  alternatives_korean:
  - 자기 시종 다섯을 데리고 뒤따라갔습니다
  - 젊은 여자 하인 다섯을 데리고 뒤따라갔습니다
  lexicon: נערה + הלך לרגל
  rationale: ‘젊은 여자들’의 성별과 종속적 지위를 함께 드러내기 위해 ‘젊은 여자 종’으로 옮겼고, 뒤따름의 관계는 ‘뒤따라갔습니다’로 자연스럽게 표현했습니다.
- source_word: מַלְאֲכֵי דָוִד
  english_pob_choice: David's messengers
  chosen_korean: 다윗의 사자들
  alternatives_korean:
  - 다윗의 전령들
  - 다윗의 메신저들
  lexicon: מלאכים
  rationale: 문맥상 단순한 전달자가 아니라 다윗이 보낸 공식적인 사절이므로, 한국어 성경에서 널리 쓰이는 ‘사자들’을 유지했습니다.
theological_decisions:
- issue: 결혼 서술의 종결 표현
  chosen_reading: 그의 아내가 되었습니다
  alternative_readings:
  - 그의 아내가 되었습니다
  rationale: 히브리어의 결과 상태를 한국어 서술로 충실히 옮겼으며, 남편/아내 관계의 형성 자체를 직설적으로 드러냈습니다.
  doctrine_reference: 서사 본문은 해설을 덧붙이지 않고 사건의 결과를 그대로 진술해야 합니다.
