id: PSA.74.8
reference: Psalms 74:8
source:
  edition: WLC
  text: אָמְר֣וּ בְ֭/לִבָּ/ם נִינָ֣/ם יָ֑חַד שָׂרְפ֖וּ כָל מוֹעֲדֵי אֵ֣ל בָּ/אָֽרֶץ־־׃
translation:
  text: They said to themselves, “Let us crush them[a] all together.” They burned all the meeting places of God in the land.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew form is difficult; possible senses include “Let us oppress them” and “Let us subdue them.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְרוּ
  chosen: They said
  alternatives:
  - They have said
  lexicon: HALOT
  rationale: Qal perfect 3cp of אמר, introducing the enemies' internal resolve. Simple past fits the poetic narrative context in English.
- source_word: בְלִבָּם
  chosen: in their hearts
  alternatives:
  - to themselves
  - in their mind
  lexicon: HALOT
  rationale: Hebrew idiom for inward speech or intention. 'In their hearts' preserves the anthropological imagery of the source.
- source_word: נִינָם
  chosen: Let us crush them
  alternatives:
  - Let us oppress them
  - Let us subdue them
  - Their offspring
  lexicon: HALOT
  rationale: The context indicates hostile suppression or destruction, but the difficult form does not establish a precise lexical sense.
- source_word: יָחַד
  chosen: all together
  alternatives:
  - together
  - altogether
  lexicon: HALOT
  rationale: Adverb meaning 'together'; 'all together' brings out the comprehensive force in context.
- source_word: שָׂרְפוּ
  chosen: They burned
  alternatives:
  - They have burned
  - They set on fire
  lexicon: HALOT
  rationale: Qal perfect 3cp of שרף, straightforwardly 'burned' or 'set on fire.' 'Burned' is concise and natural.
- source_word: כָּל
  chosen: all
  alternatives:
  - every
  lexicon: HALOT
  rationale: Marks totality; 'all' works idiomatically with the following plural noun.
- source_word: מוֹעֲדֵי אֵל
  chosen: the meeting places of God
  alternatives:
  - God's appointed places
  - the appointed festivals of God
  - the assemblies of God
  - the synagogues of God
  lexicon: HALOT
  rationale: A spatial sense is most likely because these entities are burned and are located in the land; the note preserves the less specific alternative without importing “synagogues” into the text.
- source_word: בָּאָרֶץ
  chosen: in the land
  alternatives:
  - in the הארץ/earth
  - throughout the land
  lexicon: HALOT
  rationale: The phrase most naturally refers to the land of Israel in context, not the whole earth. 'In the land' is both literal and contextually appropriate.
