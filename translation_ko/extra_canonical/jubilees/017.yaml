revisions:
- from: '1[a]. 그리고 주님께서는 아브라함이 그의 모든 환난 가운데서 신실했다는 것을 아셨습니다. 이는 그가 그의 땅에서 기근으로 그를 시험하였고, 왕들의 부로 그를 시험하였고, 그의 아내가 사로잡혔을 때에와 할례를 통하여 그를 다시 시험하였고, 그가 그들을 보낼 때에 이스마엘과 그의 여종 하갈을 통하여 그를 시험하였음이라. 그를 시험하신 모든 일에 신실하심이 나타났고 그의 마음이 조급해하지 아니하며 지체하지 아니하고 실행하기를 더디하지 아니하였느니라 왜냐하면 그는 신실하고 주님을 사랑하는 사람이었기 때문입니다.

    2. 주님께서 그에게 말씀하셨다. “아브라함아, 아브라함아.” 그리고 그는 “내가 여기 있습니다.”라고 말했습니다. 그리고 주님께서는 “네 사랑하는 아들 이삭을 데리고 높은 곳으로 가서 내가 네게 지시하는 한 산에서 그를 드리라”고 말씀하셨습니다. 그리고 그는 아침에 일찍 일어나 당나귀에 안장을 지우고 두 종과 그의 아들 이삭을 데리고 갔다. 그리고 그는 제물의 나무를 쪼개어 셋째 날 [b]에 그곳으로 갔습니다. 그리고 그는 그 곳을 멀리서 보았습니다. 그가 우물에 이르러 그의 종들에게 이르되 당나귀와 함께 여기 있으라 나와 아이는 계속 가다가 예배한 후에 너희에게로 돌아오리라 하고 그리고 그는 희생의 나무를 가져다가 그의 아들 이삭에게 지우고 자기 손에는 불과 칼을 들고 있었습니다. 그리고 두 사람은 함께 그 곳으로 갔습니다.

    3. 이삭이 그의 아버지에게 “아버지!”라고 말했습니다. 그러자 그가 “내 아들아, 내가 여기 있다”고 말했습니다. 그가 그에게 이르되, “불과 칼과 나무는 여기 있는데, 아버지, 번제할 양은 어디 있습니까?” 그리고 그는 “내 아들아, 번제물로 바칠 양은 주님께서 자기를 위하여 친히 준비하시리라”고 말했습니다. 그리고 그가 주님의 산에 가까이 이르렀습니다.

    4. 그가 거기 제단을 쌓고 그 위에 나무를 벌여 놓고 그 아들 이삭을 결박하여 제단 위 나무 위에 놓고 손을 펴서 칼을 잡고 그 아들 이삭을 죽이려 하였더라. 그리고 나는 그와 마스테마 왕자 앞에 섰습니다. 그러자 주님께서 말씀하셨습니다. “그 아이에게 손을 대지 말며 그에게 아무 일도 하지 말라고 말하라. 이제 나는 그가 주님을 경외하는 줄을 안다.”

    5. 그리고 내가 하늘에서 그를 불러서 “아브라함아, 아브라함아”라고 말했습니다. 그러자 그는 겁에 질려 “내가 여기 있습니다”라고 말했습니다. 내가 그에게 이르되 그 아이에게 네 손을 대지 말며 그에게 아무 일도 하지 말라 내가 이제 네가 네 아들 네 장자를 내게 아끼지 아니하였으니 주님 경외하는 것을 내가 보였노라 하였느니라

    6. 그리고 마스테마 왕자는 수치를 당했다. 아브라함이 눈을 들어 보니 숫양 한 마리가 뿔이 걸렸습니다. 아브라함이 가서 그 숫양을 가져다가 아들을 대신하여 번제물로 드렸더라.

    7. 아브라함이 그 곳을 주님께서 보신다 하였으므로 일컬어 이르기를 주님께서 산에서 보신다 하였느니라 그것이 바로 시온산이다. 주님께서 우리로 나타나게 하시고 주님의 이름으로 그에게 말하게 하시려고 하늘에서 두 번째로 아브라함을 그의 이름으로 부르셨느니라.

    8. 그가 이르시되 주님께서 이르시되 내가 나를 가리켜 맹세하노니 네가 이같이 행하여 네 아들 네 사랑하는 아들을 내게 아끼지 아니하였은즉 내가 반드시 네게 복을 주고 네 씨로 크게 성하여 하늘의 별과 같고 바닷가의 모래와 같게 하리니 네 씨가 그 대적의 성읍을 차지하리라

    9. 네가 내 말을 순종하였으므로 땅의 모든 민족이 너의 씨로 말미암아 복을 받을 것이다. 그리고 나는 너희에게 말한 모든 일에서 너희가 나에게 신실하다는 것을 모든 사람에게 보여 주었다. 평안히 가십시오.”

    10. 아브라함은 그의 젊은 종들에게로 돌아가서, 일어나 함께 브엘세바로 갔다. 그리고 아브라함은 맹세의 우물 곁에 살았습니다.

    11. 그는 매년 이 절기를 즐겁게 지켰고, 자기가 갔다가 평안히 돌아오는 동안의 칠 일을 가리켜 주님의 절기라 일컬었습니다.

    12. 그리하여 이스라엘과 그 후손을 위하여 하늘 판에 명령하고 기록하였으니 그들이 이 절기를 칠 일 동안 즐겁게 지키리라 하였느니라.

    13. 그리고 이 희년 다섯째 주의 첫째 해에 이삭은 아람 사람 브두엘의 딸이자 아람 사람 라반의 누이인 리브가를 아내로 맞이했습니다.

    14. 그리고 이번 주 여섯째 해에 그 여자는 야곱과 에서를 낳았습니다. 야곱은 매끄럽고 정직한 사람이었지만 에서는 사나운 사람이었고 들에 사는 사람이었고 털이 많았습니다. 야곱은 장막에 살았습니다.

    15. 청년들이 자라매 야곱은 글을 배웠으나 에서는 배우지 못하였으니 그는 들사람이요 사냥꾼이었기 때문이라. 아브라함은 야곱을 사랑했고, 이삭은 에서를 사랑했습니다.'
