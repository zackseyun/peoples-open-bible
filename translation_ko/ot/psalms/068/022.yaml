translation:
  language: ko
  text: 주께서 말씀하셨습니다.[a] “내가 바산에서 돌아오게 하겠습니다. 내가 바다 깊은 곳에서 돌아오게 하겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여, ‘내가 바산에서 돌아오게 하겠다. 내가 바다 깊은 곳에서 돌아오게 하겠다.’ 히브리어는 ‘돌아오게 하겠다’의 목적어를 명시하지 않습니다.
    reason: lexical_alternative
