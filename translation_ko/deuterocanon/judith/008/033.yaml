review_pass:
  verdict: revise
  source_fidelity: 초안은 문장 전체의 기본 의미와 인물 관계를 대체로 충실히 옮겼습니다. 다만 ἐν ταῖς ἡμέραις μεθʼ ἃς의 시간적 한계(그들이 정해 둔 날들이 지나기 전)를 ‘말한 날들 안에’라고 하면 한국어로 불명확하며, πόλις는 이 맥락에서 ‘성’보다 ‘성읍’이 더 정확합니다. ἐπισκέψεται는 결과를 과도하게 한정하지 않는 ‘돌아보시다’로 옮기는 편이 좋습니다.
  naturalness: ‘문에서 서 있어야 합니다’와 ‘말한 날들 안에’는 현대 표준어로 다소 어색하거나 뜻이 흐립니다. ‘성문에 서 계십시오’와 ‘그 날들이 지나기 전에’가 합쇼체 명령 및 시간 관계를 자연스럽게 드러냅니다.
  terminology: ἅβρα는 ‘여종’으로 유지했습니다. πόλις는 성곽 도시를 가리키므로 ‘성읍’으로, Κύριος는 초안의 호칭을 따라 ‘주님’으로 유지했습니다. ‘내 손으로’는 ἐν χειρί μου의 도구·매개 표현을 간결하게 보존합니다.
  issues:
  - severity: medium
    issue: 시간 표현 ‘당신들이 … 말한 날들 안에’
    rationale: ἐν ταῖς ἡμέραις μεθʼ ἃς는 그들이 성읍을 넘기겠다고 정한 날들의 기한과 관련된 표현입니다. 초안은 ‘안에’의 기준과 ‘그 후’의 관계가 불분명합니다. ‘그 날들이 지나기 전에’가 문맥상 기한 내라는 뜻을 자연스럽게 전달합니다.
  - severity: low
    issue: ‘문에서 서 있어야 합니다’
    rationale: πύλη는 이 성읍 포위 문맥에서 성문을 가리키며, στήσεσθε는 유딧의 지시입니다. ‘성문에 서 계십시오’가 자연스럽고 명령의 어조를 보존합니다.
  - severity: low
    issue: ‘성을’
    rationale: πόλις는 성채 자체라기보다 도시/성읍을 뜻합니다. 한국어 ‘성’은 성곽 또는 요새로 좁게 이해될 수 있으므로 ‘성읍’이 더 정확합니다.
  - severity: low
    issue: ‘돌보실 것입니다’
    rationale: ἐπισκέψεται는 찾아오심, 살피심, 개입하심을 포괄할 수 있습니다. ‘돌보시다’는 의미를 긍정적 돌봄으로 다소 좁힐 수 있으므로 ‘돌아보시다’가 더 폭넓게 원문의 표현을 보존합니다.
  revised_text: 당신들은 오늘 밤 성문에 서 계십시오. 나는 내 여종과 함께 나가겠습니다. 그리고 당신들이 우리 원수들에게 이 성읍을 넘겨주겠다고 말한 그 날들이 지나기 전에, 주님께서 내 손으로 이스라엘을 돌아보실 것입니다.
