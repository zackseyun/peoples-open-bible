  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבָרִים
  english_pob_choice: words
  chosen_korean: 말들
  alternatives_korean:
  - 말
  - 말씀
  - 일들
  lexicon: דבר
  rationale: 히브리어 דְּבָרִים를 POB의 'words'에 맞춰 ‘말들’로 옮겨, 사물보다 발화 자체가 헛됨을 더하는 문맥을 드러냈습니다.
- source_word: הַרְבֵּה מַרְבִּים
  english_pob_choice: increase
  chosen_korean: 더해지니
  alternatives_korean:
  - 증가시키니
  - 많아지게 하니
  - 더 크게 하니
  lexicon: רבה
  rationale: ‘많이 많게 하다/늘리다’의 누적 강조를 자연스러운 현대 한국어로 압축해 ‘더해지니’로 표현했습니다.
- source_word: הָבֶל
  english_pob_choice: vanity
  chosen_korean: 헛됨
  alternatives_korean:
  - 허무
  - 헛것
  - 공허
  lexicon: הבל
  rationale: 전도서의 핵심어 הָבֶל을 POB의 ‘vanity’에 대응하여 ‘헛됨’으로 옮겨, 덧없음과 무가치를 함께 살렸습니다.
- source_word: מַה יֹּתֵר לָאָדָם
  english_pob_choice: what advantage is there for man?
  chosen_korean: 사람이 무슨 유익이 있겠습니까?
  alternatives_korean:
  - 사람에게 무슨 이익이 있겠습니까?
  - 사람에게 남는 것이 무엇이겠습니까?
  lexicon: יתר
  rationale: מַה יֹּתֵר의 수사적 질문을 한국어 관용에 맞게 ‘무슨 유익’으로 옮겨, ‘advantage’의 실질적 이득 의미를 살렸습니다.
theological_decisions:
- issue: 전도서의 הָבֶל 해석
  chosen_reading: ‘헛됨’으로 일관되게 번역해, 삶과 말의 덧없음이 아니라 실제로 무가치하고 붙잡을 수 없음을 드러냈습니다.
  alternative_readings:
  - 허무
  - 공허
  - 덧없음
  rationale: 본문은 단순한 감정 상태보다 결과의 실질적 무가치를 강조하므로, POB의 'vanity'를 한국어 ‘헛됨’으로 유지하는 것이 가장 직접적입니다.
  doctrine_reference: 전도서 1:2, 2:11과의 어휘 일관성
