id: PSA.88.14
reference: Psalms 88:14
source:
  edition: WLC
  text: לָ/מָ֣ה יְ֭הוָה תִּזְנַ֣ח נַפְשִׁ֑/י תַּסְתִּ֖יר פָּנֶ֣י/ךָ מִמֶּֽ/נִּי׃
translation:
  text: Why, O Yahweh, do you reject me? Why do you hide your face from me[a]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Hiding one's face expresses withdrawal of favor or attention.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָה
  chosen: Why
  alternatives:
  - For what reason
  lexicon: HALOT
  rationale: Direct interrogative of reason; simple 'Why' is the most natural modern English equivalent and preserves the lament's force.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: תִּזְנַח
  chosen: reject
  alternatives:
  - cast off
  - spurn
  - forsake
  lexicon: HALOT
  rationale: The verb denotes rejecting or casting off. 'Reject' is clear modern English and fits the psalm's complaint without sounding archaic. 'Forsake' is possible but can suggest abandonment more than repudiation; 'reject' better matches the lexical core.
- source_word: נַפְשִׁי
  chosen: me
  alternatives:
  - me
  - my life
  lexicon: HALOT
  rationale: In this clause נפש denotes the speaker as a whole person.
- source_word: תַּסְתִּיר
  chosen: hide
  alternatives:
  - conceal
  lexicon: HALOT
  rationale: Straightforward rendering of the Hiphil verb 'to hide/conceal.' 'Hide' is idiomatic and concise.
- source_word: פָּנֶיךָ
  chosen: your face
  alternatives:
  - your presence
  lexicon: HALOT
  rationale: Literally 'your face.' In Hebrew this often implies presence or favor, but the concrete idiom should be preserved in the main text; the implied sense is well understood in biblical English.
- source_word: מִמֶּנִּי
  chosen: from me
  alternatives:
  - away from me
  lexicon: HALOT
  rationale: Standard prepositional rendering; 'from me' is sufficient and natural.
