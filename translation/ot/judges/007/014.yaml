  from: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
  to: His companion replied, “This can only mean the sword of Gideon son of Joash, a man of Israel. God has handed Midian and the whole army over to him.”
