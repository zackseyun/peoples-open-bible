  from: And in that day Yahweh will thresh from the channel of the River to the Wadi of Egypt[a], and you will be gathered one by one[d][c][b], O sons of Israel.
  to: In that day Yahweh will thresh his harvest from the channel of the Euphrates to the Wadi of Egypt[a], and you, people of Israel, will be gathered one by one.
  rationale: The earlier decisions correctly preserve threshing, individual gathering, and the distinction between the Egyptian wadi and the Nile. Their preference for “the River” and a masculine ethnic label obscures meanings that the original hearers would have understood, so those expressions are clarified.
