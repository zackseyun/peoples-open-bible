  from: And when they came to a place called Golgotha (which means Place of a Skull),[a]
  to: And when they came to a place called Golgotha (which is called Place of a Skull),[a]
  rationale: The Greek explicitly includes the participle λεγόμενος ('called'). Translating 'ὅ ἐστιν... λεγόμενος' as 'which means' is an unnecessary dynamic paraphrase that drops the participle. 'Which is called Place of a Skull' is natural English and preserves the exact Greek phrasing. If the main text is updated to 'which is called Place of a Skull', the current footnote becomes partially redundant. It can be simplified to just note the traditional definite article.
