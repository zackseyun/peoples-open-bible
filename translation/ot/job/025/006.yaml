id: JOB.25.6
reference: Job 25:6
source:
  edition: WLC
  text: אַ֭ף כִּֽי אֱנ֣וֹשׁ רִמָּ֑ה וּ/בֶן אָ֝דָ֗ם תּוֹלֵעָֽה־־׃פ
translation:
  text: how much less a mortal, who is a maggot, and a human being[a], who is a worm!
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “a son of man,” a Hebrew expression for a human being here.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  chosen: how much less
  alternatives:
  - indeed
  - even though
  - how much more
  lexicon: HALOT
  rationale: 'In context this idiom continues Bildad''s a fortiori argument from the previous verse: if even heavenly bodies are not pure before God, then all the more frail humanity is not. English ''how much less'' best captures the inferential force here.'
- source_word: אֱנוֹשׁ
  chosen: a mortal
  alternatives:
  - mortal man
  - human being
  lexicon: HALOT
  rationale: The term presents humanity in its frailty and mortality.
- source_word: רִמָּה
  chosen: maggot
  alternatives:
  - worm
  lexicon: HALOT
  rationale: This term commonly denotes a maggot or grub associated with decay, distinct from the following תּוֹלֵעָה. Rendering it 'maggot' preserves the poetic intensification and avoids flattening both nouns into the same English word.
- source_word: בֶן אָדָם
  chosen: a human being
  alternatives:
  - a son of man
  - human being
  lexicon: HALOT
  rationale: Here this is a non-titular Hebrew idiom, parallel to אֱנוֹשׁ; the literal form is supplied in a footnote.
- source_word: אָדָם
  chosen: man
  alternatives:
  - humankind
  - humanity
  lexicon: HALOT
  rationale: Within the construct phrase בֶן אָדָם, the sense is human/man. The default policy for אָדָם allows 'man' where context supports it; here the singular poetic parallel favors that rendering.
- source_word: תּוֹלֵעָה
  chosen: worm
  alternatives:
  - grub
  - maggot
  lexicon: HALOT
  rationale: This noun is a broader term for worm and is suitably distinguished from רִמָּה. 'Worm' is the most natural English equivalent and preserves the poetic pairing.
