source:
  edition: WLC
  text: מִ֣י יֹ֭בִלֵ/נִי עִ֣יר מִבְצָ֑ר מִ֖י נָחַ֣/נִי עַד אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/010.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a][b]
  footnotes:
  - marker: a
    text: Or 'Who will lead me to Edom?' The second verb can be rendered as a future-like question in parallel with the first line, though the Hebrew form is formally perfect ('has led me').
    reason: lexical_alternative
  - marker: b
    text: '''The fortified city'' may refer to a specific Edomite stronghold, traditionally understood by many as Sela/Petra, though the Hebrew text does not name the city.'
    reason: cultural_note
translation:
  language: ko
  text: 누가 나를 견고한 성읍으로 데려가겠습니까?[b] 누가 나를 에돔까지 이끌겠습니까?[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누가 나를 에돔으로 이끌겠습니까?’ 히브리어 전치사는 ‘…까지’ 또는 ‘…으로’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘견고한 성읍’은 특정 에돔의 요새를 가리킬 수 있으나, 히브리어 본문은 그 성읍의 이름을 밝히지 않습니다. 전통적으로 많은 이들은 이를 셀라/페트라로 이해합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘누가 나를 에돔까지 이끌었습니까?’ 두 번째 히브리어 동사는 문법상 완료형입니다. 그러나 첫 행과의 시적 병행 및 문맥상 미래의 수사 의문문으로 이해될 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: מוֹאָב סִיר רַחְצִי
  english_pob_choice: my washbasin
  chosen_korean: 내 씻는 그릇
  alternatives_korean:
  - 내 세숫대야
  - 내 씻는 항아리
  - 내 물두멍
  lexicon: HALOT
  rationale: סִיר은 그릇·냄비류의 용기를 가리키고 רַחְצִי는 ‘씻는’이라는 관계를 분명히 하므로, 현대어로는 ‘내 씻는 그릇’이 이미지와 의미를 함께 살립니다.
- source_word: אַשְׁלִ֣יךְ נַעֲלִ֑/י
  english_pob_choice: I throw my sandal
  chosen_korean: 내 샌들을 던집니다
  alternatives_korean:
  - 내 신을 던집니다
  - 내 신발을 던집니다
  - 내 신을 집어던집니다
  lexicon: HALOT
  rationale: נַעַל은 고대 근동 맥락에서 ‘신발’보다 ‘샌들’이 더 정확하고, Hiphil אַשְׁלִיךְ는 단순히 ‘던지다/내던지다’의 동작을 보존하는 것이 좋습니다.
- source_word: עֲלֵי פְלֶשֶׁת אֶתְרוֹעָע
  english_pob_choice: over Philistia I shout in triumph
  chosen_korean: 블레셋 위에서 나는 승리의 함성을 지릅니다
  alternatives_korean:
  - 블레셋 위에서 나는 크게 외칩니다
  - 블레셋을 향해 나는 외칩니다
  - 블레셋 위로 나는 환호성을 올립니다
  lexicon: HALOT
  rationale: עֲלֵי는 ‘위에서/위에’의 공간적 뉘앙스를 살리고, אֶתְרוֹעָע는 단순한 외침보다 승리·환호의 성격이 있으므로 ‘승리의 함성’으로 옮겼습니다.
- source_word: פְלֶשֶׁת
  english_pob_choice: Philistia
  chosen_korean: 블레셋
  alternatives_korean:
  - 블레셋 땅
  - 필리스티아
  - 블레셋 사람들
  lexicon: HALOT
  rationale: 히브리어는 지역명이며, 한국어 성경 전통에서 가장 널리 인식되는 지명은 ‘블레셋’이므로 이를 사용하되 사람보다 지역에 초점을 둡니다.
theological_decisions:
- issue: 적대 민족에 대한 지배와 굴욕의 상징을 얼마나 직접적으로 보존할지
  chosen_reading: ‘씻는 그릇’과 ‘샌들을 던집니다’라는 구체적 이미지를 그대로 살려, 모압과 에돔에 대한 굴욕·주권의 표지를 해석적으로 완화하지 않았습니다.
  alternative_readings:
  - 모압은 내 종이 쓰는 그릇입니다
  - 에돔 위에 내 권리를 주장합니다
  - 블레셋 위에서 내가 승리합니다
  rationale: 시의 은유를 추상화하면 본문의 힘이 약해지므로, 원문의 물질적·상징적 이미지를 유지하고 그 의미는 독자가 읽어내도록 두는 것이 소스 충실성에 더 부합합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve poetic metaphor and tension.'
