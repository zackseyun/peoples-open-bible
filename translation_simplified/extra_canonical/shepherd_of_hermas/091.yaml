translation:
  text: '“Sir,” I said, “what if these people repent? What if they cast off the desires of these women
    and return to the virgins? If they walk in the virgins’ power and works, will they not enter God’s
    house?”[a]


    2. He said, “They will enter if they cast off the women’s works, take up the virgins’ power, and walk
    in their works. Construction has been paused for this reason. If these people repent, they can go
    into the building of the tower. If they do not, others will go, and these people will be cast out
    for good.”


    3. I thanked the Lord for all this. He had compassion on everyone who calls upon his name. He sent
    the messenger of repentance[b] to us who had sinned against him. He renewed our spirit and our life[c]
    when we were already ruined and had no hope of living.


    4. “Now, sir,” I said, “why was the tower built on the rock and the gate instead of on the ground?”
    He said, “You ask because you are foolish and lack understanding.”[d] “Sir,” I said, “I must ask you
    about everything. I cannot understand anything at all. Everything is great and glorious, and hard
    for people to understand.”


    5. He said, “Listen. The name of the Son of God is great and cannot be contained. It sustains the
    whole world. If all creation is sustained through the Son of God, what do you think of those he has
    called? They bear the Son of God’s name and walk in his commandments.[e]”


    6. “Do you see whom he sustains? Those who bear his name with their whole heart. He became their foundation.[f]
    He gladly sustains them because they are not ashamed to bear his name.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: The women and virgins are figures in this vision, explained by the names in the next chapter.
      The conditional concerns abandoning one set of desires and works and taking up the other; it is
      not a statement about women as a general class.
  - marker: b
    reason: textual_variant
    text: The singular “messenger” follows the printed working text compared with Latin Vulgata, Palatina
      and Ethiopic; the apparatus reports an irregular plural in Athos. Repentance here includes changed
      conduct and restored hope, not merely a feeling of regret.
  - marker: c
    reason: textual_variant
    text: “Renewed our life” follows the printed form compared with Latin Vulgata and Palatina; the apparatus
      reports an Athos form meaning “renewed” with different grammar. Renewing the spirit and renewing
      life remain distinct expressions.
  - marker: d
    reason: textual_variant
    text: “You ask” translates Harmer’s bracketed insertion compared with the Latin traditions, absent
      from reported Athos/Ethiopic. Sinaiticus begins only later within this paragraph and cannot certify
      its missing opening.
  - marker: e
    reason: textual_variant
    text: The two repeated “of God” phrases after “Son” are bracketed in the printed source. The rhetorical
      question leaves its predicate implicit; the draft does not add a promise beyond the following explanation.
      Sinaiticus expands the name’s description with “glorious,” while retaining the world-sustaining
      image.
  - marker: f
    reason: textual_variant
    text: '“He became their foundation” follows the working printed text. Sinaiticus v1.05,Q95F8r col1
      lines25–27, has a neuter subject (“it,” the name) and “is their foundation”; corrector ca changes
      the subject to masculine. Alternative: “So it is their foundation.” Neither reading is merged into
      a claim that all hands agree. Sinaiticus also has a closing phrase about gladly bearing the name,
      with partly supplied letters.'
lexical_decisions:
- source_word: κύριε
  chosen: sir
  alternatives:
  - Lord
  - master
  rationale: Respectful address to the visionary shepherd; keep it distinct from explicit references to
    the divine Lord.
- source_word: μετανοεῖν / ἀνοχή
  chosen: repent / suspension of construction
  alternatives:
  - regret / delay
  rationale: The text makes changed desires and works the condition and explains the building’s pause.
    Retain the warning that others may replace those who do not repent.
- source_word: ἀχώρητον / βαστάζει
  chosen: cannot be contained / sustains
  alternatives:
  - incomprehensible / carries
  rationale: Retain the name’s greatness and world-bearing image without equating incomprehensibility
    with a definition of the Son.
