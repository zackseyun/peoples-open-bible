  - marker: b
    text: Or 'have established its pillars.'
    reason: lexical_alternative
  - marker: c
    text: '''Selah'' is traditionally transliterated; its precise meaning is uncertain.'
    reason: cultural_note
translation:
  language: ko
  text: 나는 자랑하는 자들에게는 “자랑하지 마십시오” 하고, 악인들에게는 “뿔을 높이 들지 마십시오” 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿔’은 히브리어 시어에서 힘, 권세, 또는 교만하게 자신을 높임을 비유할 수 있습니다.
    reason: lexical_alternative
