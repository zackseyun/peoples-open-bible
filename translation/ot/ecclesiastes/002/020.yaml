  from: So I turned to despair in my heart over all the labor at which I had labored under the sun[a][b].
  to: So I turned and gave my heart over to despair[a] because of all the labor at which I had labored under the sun.[b]
  rationale: The Hebrew makes “my heart” the object of the causative verb; “despair in my heart” instead turns it into a location and obscures that syntax. “Gave my heart over to despair” is a natural source-faithful idiomatic rendering. “Because of” suitably expresses the labor as the occasion for the despair.
