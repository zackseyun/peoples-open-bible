  from: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
  to: And is there any man who is engaged to a woman[a] but has not yet married her? Let him return home, lest he die in battle and another man marry her.”
  rationale: The recorded notes explicitly identify 'take her' as completing the marriage, although the earlier rationale favored preserving the Hebrew idiom. That established meaning now belongs in the main text, with the culturally binding character of engagement explained in a note.
