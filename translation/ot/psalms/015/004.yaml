- issue: Interpretation of the difficult clause נִבְזֶה בְּעֵינָיו נִמְאָס
  chosen_reading: In his eyes a despised person is rejected
  alternative_readings:
  - In his eyes a vile person is despised
  - He despises a reprobate person
  rationale: The Hebrew syntax is compressed and has been rendered variously. The chosen reading preserves the passive forms and the evaluative force without importing a stronger theological category such as 'reprobate.' A common alternative is preserved in a footnote because it is well established in English tradition.
