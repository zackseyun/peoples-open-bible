  terminology: ‘야훼’는 יהוה의 고유명사성을 보존하는 일관된 학술적 표기이며, 레아·라헬 및 ‘태’, ‘불임’의 용어 선택도 적절합니다. שְׂנוּאָה를 완화하여 ‘사랑받지 못한’으로 바꾸지 않고 ‘미움을 받는’으로 유지한 것은 원문과 영어 감사 이력의 ‘hated’에 부합합니다.
