revisions:
- from: 그러므로 야훼께서는 억눌린 이들의 강한 피난처가 되시며, 환난 때의 강한 피난처가 되십니다.[a][b]
  to: 주님의 이름[a]을 아는 이들은 주님을 신뢰할 것입니다. 야훼[b]여, 주님을 찾는 이들을 버리지 않으셨기 때문입니다.[c]
  rationale: 원문 WLC를 우선하여, 접속사 וְ를 한국어 문장 연결에 자연스럽게 반영하고 미완료형 יִבְטְחוּ를 ‘신뢰할 것입니다’로 옮겼습니다. יֹדְעֵי שְׁמֶךָ는 직역적이며 성경적 관용을 유지해 ‘주님의 이름을 아는 이들’로, דֹרְשֶׁיךָ는 헌신적으로 하나님을 찾는 뜻을 보존해 ‘주님을 찾는 이들’로 번역했습니다. 마지막 יְהוָה는 호격 ‘야훼여’로 처리했으며, 한국어의 직접 호칭 관습상 동일 대상을 이어서 ‘주님’으로 받았습니다.
