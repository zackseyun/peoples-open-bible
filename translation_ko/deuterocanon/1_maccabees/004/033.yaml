  text: Strike them down with the sword of those who love you, and let all who know your name praise you with hymns.
translation:
  language: ko
  text: 당신을 사랑하는 이들의 칼로 그들을 쓰러뜨리시고, 당신의 이름을 아는 모든 이가 찬송을 부르며 당신을 찬양하게 하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατάβαλε
  english_pob_choice: Strike them down
  chosen_korean: 쓰러뜨리시고
  alternatives_korean:
  - 치시고
  - 내리치시고
  - 무찌르시고
  lexicon: καταβάλλω
  rationale: 무력으로 넘어뜨리거나 쓰러뜨리는 동작을 자연스럽게 살리되, 기도문 맥락에 맞게 간결한 청원형으로 옮겼습니다.
- source_word: ῥομφαίᾳ
  english_pob_choice: with the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 검으로
  - 칼날로
  lexicon: ῥομφαία
  rationale: 무장된 무기를 가리키는 일반적 한국어로는 ‘칼’이 가장 직접적이며, 본문의 수단 격 표현도 무리 없이 전달합니다.
- source_word: ἀγαπώντων σε
  english_pob_choice: of those who love you
  chosen_korean: 당신을 사랑하는 자들의
  alternatives_korean:
  - 당신을 사랑하는 사람들의
  - 당신을 사랑하는 이들의
  lexicon: ἀγαπάω
  rationale: 현재분사 소유격의 관계를 반영해 ‘~하는 자들의’로 옮겨, 칼이 그들에 속한 수단임을 분명히 했습니다.
- source_word: αἰνεσάτωσάν σε ... ἐν ὕμνοις
  english_pob_choice: let ... praise you with hymns
  chosen_korean: 찬송가로 당신을 찬양하게 하소서
  alternatives_korean:
  - 노래로 당신을 찬양하게 하소서
  - 찬미가로 당신을 찬양하게 하소서
  lexicon: αἰνέω, ὕμνοις
  rationale: ‘찬양’과 함께 ‘ὕμνοις’의 수단을 드러내기 위해 ‘찬송가로’로 옮겼습니다. 한국어 교회어의 익숙한 ‘찬양’과 병행해 문맥의 예배적 성격을 유지했습니다.
theological_decisions:
- issue: 본문이 하나님을 향한 청원인지, 단순한 서술인지
  chosen_reading: 간구형으로 처리하여 ‘-하소서’로 옮겼습니다.
  alternative_readings:
  - 명령형 서술로 옮김
  - 희망문으로 완화
  rationale: 문맥상 하나님의 개입을 구하는 기도문이므로, 한국어에서도 청원 뉘앙스를 분명히 드러내는 것이 원문의 기능에 가장 부합합니다.
  doctrine_reference: 시편적 간구문과 지혜/전쟁 기도의 수사
- issue: ‘당신을 사랑하는 자들’의 칼이라는 표현의 긴장
  chosen_reading: 전투의 주체를 ‘당신을 사랑하는 자들’에게 속한 칼로 직접 유지했습니다.
  alternative_readings:
  - 주어를 완화해 ‘당신의 백성의 칼로’
  - 의역해 ‘당신을 따르는 자들의 무기로’
  rationale: 원문은 승리를 사람의 충성된 사랑과 결부시키므로, 이 긴장을 완화하지 않고 그대로 보존했습니다.
  doctrine_reference: 신명기적 전쟁 언어와 공동체적 충성
