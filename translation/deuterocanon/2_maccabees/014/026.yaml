  text: Ὁ δὲ Ἄλκιμος συνιδὼν τὴν πρὸς ἀλλήλους εὔνοιαν καὶ τὰς γενομένας συνθήκας λαβὼν ἧκεν πρὸς τὸν Δημήτριον, καὶ ἔλεγεν τὸν Νικάνορα ἀλλότρια φρονεῖν τῶν πραγμάτων· τὸν γὰρ ἐπίβουλον τῆς βασιλείας αὐτοῦ Ἰούδαν διάδοχον ἀπέδειξεν.
