theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Potential royal-residence nuance of בַּיִת
  chosen_reading: house
  alternative_readings:
  - palace
  rationale: Although a royal residence could be called a palace in English, 'house' better preserves the Hebrew wording and the literary/theological wordplay in the surrounding chapter concerning David's 'house' and the LORD's 'house.' This does not add doctrine but preserves textual texture.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
