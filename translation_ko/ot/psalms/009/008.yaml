lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: But Yahweh
  chosen_korean: 그러나 야훼는
  alternatives_korean:
  - 그리고 야훼는
  - 주께서는
  lexicon: WLC direct name rendering
  rationale: 문맥상 악인의 몰락과 대조되는 전환이므로 접속사는 「그러나」로 살리고, יְהוָה는 프로젝트 기본값에 따라 「야훼」로 옮겼습니다.
- source_word: יֵשֵׁב
  english_pob_choice: sits enthroned
  chosen_korean: 좌정하십니다
  alternatives_korean:
  - 앉아 계십니다
  - 보좌에 앉으십니다
  lexicon: HALOT
  rationale: 동사 자체는 ‘앉다’이지만 왕권/재판 문맥에서 지속적인 왕적 재위와 좌정을 드러내는 한국어로 「좌정하십니다」를 택했습니다.
- source_word: לַמִּשְׁפָּט
  english_pob_choice: for judgment
  chosen_korean: 심판을 위하여
  alternatives_korean:
  - 재판을 위하여
  - 공의를 위하여
  lexicon: HALOT
  rationale: 보좌와 결합한 משפט는 여기서 하나님의 사법적 판결 행위를 가리키므로, 추상적인 「공의」보다 직접적인 「심판」이 원문의 법정적 의미를 더 분명히 드러냅니다.
- source_word: כִּסְאוֹ
  english_pob_choice: his throne
  chosen_korean: 자신의 보좌
  alternatives_korean:
  - 그분의 보좌
  - 그의 왕좌
  lexicon: HALOT
  rationale: 소유대명사는 한국어에서 자연스럽게 주어와 호응하는 「자신의」로 풀어, 왕권 이미지를 지닌 כסא를 「보좌」로 번역했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 직접 표기된 신명은 전통적 대체어보다 원문 가시성을 높이는 「야훼」를 사용해, 본문이 드러내는 언약적 왕권을 보존했습니다.
  doctrine_reference: 'POB naming convention: יְהוָה → 야훼'
- issue: 왕좌/재판 이미지의 해석
  chosen_reading: 좌정하십니다… 보좌를 세우셨습니다
  alternative_readings:
  - 앉아 계십니다… 보좌를 두셨습니다
  rationale: 시편의 병행구는 단순한 정적 묘사보다 왕이 재판을 집행하는 장면을 강조하므로, ‘좌정’과 ‘보좌’로 왕적·사법적 의미를 함께 살렸습니다.
  doctrine_reference: 'POB optimal equivalence: preserve royal-judicial force'
