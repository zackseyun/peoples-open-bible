  from: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
  to: The Israelites buried Joseph’s bones, which they had brought up from Egypt, at Shechem in the plot of land Jacob had bought from the sons of Hamor, Shechem’s father, for a hundred qesitahs[a]. This land became an inheritance for Joseph’s descendants[b].
  rationale: I retain the history’s concrete “bones,” cautious treatment of qesitahs, and preferred understanding that the land became an inheritance. I depart from its source-transparency preference for “sons of Israel” and acknowledge the final plural verb’s ambiguity, which the current wording leaves unnoted.
