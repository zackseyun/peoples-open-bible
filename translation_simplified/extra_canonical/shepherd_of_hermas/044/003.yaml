base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/003.yaml
  text: 'I say to you: if you do not keep these, but neglect them, do not follow the commandments of the devil, which are difficult and bitter and savage and licentious; and do not fear the devil, because he has no power against you. For I will be with you—I, the angel of repentance, who has mastery over him. The devil has only fear, but his fear has no force. Therefore do not fear him, and he will flee from you.”'
translation:
  language: en
  text: '“I tell you this: if you fail to keep these commands and neglect them, do not follow the devil’s commands. They are hard, bitter, cruel, and morally corrupt. Do not be afraid of the devil, because he has no power over you. I will be with you—I, the angel of repentance[a], who has authority over him. The devil has only fear, but that fear has no power. So do not be afraid of him, and he will run away from you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance; do not impose a different tradition on it.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: if you do not keep these, but neglect them
  simplified_phrase: if you fail to keep these commands and neglect them
  preserved_meaning: The warning still addresses hearers who fail to keep the preceding commands.
  reasoning_layer_used: POB syntax and immediate context
  rationale: Naming “commands” clarifies what “these” refers to without making the condition concessive.
- pob_phrase: difficult and bitter and savage and licentious
  simplified_phrase: hard, bitter, cruel, and morally corrupt
  preserved_meaning: The four descriptions present the devil’s commands as burdensome, painful, savage, and unrestrained in evil.
  reasoning_layer_used: POB lexical wording
  rationale: Common wording preserves each distinct negative description.
translation_notes:
  risk_flags:
  - risk: “Morally corrupt” explains the ethical force of “licentious” rather than retaining its older wording.
    mitigation: It preserves the idea of unrestrained evil without narrowing it to sexual misconduct.
  - risk: “That fear” leaves open what relationship the fear has to the devil.
    mitigation: This preserves the POB’s ambiguity rather than recasting fear as a weapon.
