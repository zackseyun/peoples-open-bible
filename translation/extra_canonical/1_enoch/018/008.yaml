translation:
  text: But the middle one[a] reaches as far as heaven, like a throne for the Lord made of pēkā-stone.[b] And the
    top of the throne is of sapphire-stone.[c]
  philosophy: formal
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: The source has the middle/central adjective with affixed sä (ሰ), a focusing or contrasting particle, not
      a third-person possessive suffix. But the middle one represents that conjunction-plus-particle construction
      without adding its, their or a mountain noun. The spatial verb is directly controlled by Dillmann’s attingere
      with eske (reach/touch as far as), where he cites this verse; the following separate trudere/protrudere sub-sense
      is not the citation used here.
  - marker: b
    reason: lexical_alternative
    text: Pēkā is the printed stone name. Dillmann’s complete photographed1865 Latin entry cites this verse and
      gives white marble, perhaps alabaster. The historical name is retained without certifying an exact modern
      mineral identification. Made of supplies English wording for the relative-plus-material-from construction;
      it describes the throne in the comparison, not the Lord.
  - marker: c
    reason: textual_variant
    text: This follows the Charles1906 selected critical main line. Literally the latter has its summit, of/for
      the throne, from sapphire-stone; the la construction names the throne after the anticipatory suffix and is
      rendered the top of the throne. No his throne or mountain is inserted. Charles places an editorial asterisk
      immediately before eske (as far as) and records variants in notes45-49; these are not newly collated manuscript
      evidence. Sapphire is the historical lexical name, not a modern gemological certification.
