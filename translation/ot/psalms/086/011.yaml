  from: Teach me your way[a], O Yahweh, that I may walk in your truth[b]; unite my heart to fear your name.
  to: Teach me your way, Yahweh, that I may walk in your truth[a]; unite my heart to fear your name.[b]
  rationale: The footnote markers are indeed attached to the wrong phrases and must be relocated. But “faithfulness” unnecessarily narrows אֱמֶת, which can retain its broader sense as “truth” here, and “make my heart one in fearing” is less natural English than “unite my heart to fear” without improving source fidelity. The existing main translation should therefore stand apart from the corrected note placement.
