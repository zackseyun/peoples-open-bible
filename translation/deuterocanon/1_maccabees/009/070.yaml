  text: καὶ ἔγνω Ἰωνάθη, καὶ ἀπέστειλεν πρὸς αὐτὸν πρέσβεις, τοῦ συνθέσθαι πρὸς αὐτὸν εἰρήνην καὶ ἀποδοῦναι αὐτοῖς τὴν αἰχμαλωσίαν.
