translation:
  language: en
  text: 'Therefore, brothers and sisters, now that we have heard the God of truth, I am reading this appeal to you. Pay attention to what is written, because by doing so you may save both yourselves and the person reading it aloud among you. This is the reward I ask from you: repent[a] with all your heart, and bring salvation and life to yourselves. If we do this, we will set a goal for all the younger people who want to work at studying godliness and the goodness of God.


    We must not become resentful or angry when someone warns us and turns us away from wrongdoing toward what is right. We would be foolish to react that way. Sometimes we do evil without realizing it because our hearts are divided and unbelieving. Our empty desires darken our understanding.


    So let us keep doing what is right, so that we may be saved to the end. Blessed are those who obey these instructions. They may suffer in this world for a short time, but they will gather the undying fruit of the resurrection.


    Therefore, godly people should not be grieved if they are miserable in the present time. A blessed time awaits them. They will live again in heaven with our fathers and rejoice forever, where there is no sorrow.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in the exhortation to moral change while there is time; preserve the authors own baptismal and ethical claims rather than harmonizing them.
    reason: lexical_alternative
