  to: 그는 그룹들과 종려나무들과 활짝 핀 꽃들을 새기고, 새긴 것 위에 맞추어 금을 입혔습니다.
  rationale: 히브리어의 조각 대상 목록을 보존하고, 금 입힘이 새긴 장식 위에 맞추어 이루어졌다는 마지막 구절의 관계를 한국어 한 문장 안에서 명료하게 옮겼습니다. מְיֻשָּׁר의 정확한 공정상 뉘앙스는 논쟁의 여지가 있으므로 영어 POB의 ‘fitted’를 따라 ‘맞추어’로 절제해 번역했습니다.
