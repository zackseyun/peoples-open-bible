  text: παρακαλῶ συνείξαντάς μοι τῆς ἐμῆς ἀπολαῦσαι φιλίας· δύναμιν γὰρ ὥσπερ κολάζειν τοὺς ἀπειθοῦντάς μου τοῖς ἐπιτάγμασιν, οὕτως καὶ εὐεργετεῖν τοὺς εὐπειθοῦντάς μου.
