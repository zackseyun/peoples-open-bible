  rationale: The Hebrew term can legitimately be rendered either 'righteousness' or 'justice.' Because the verse presents Wisdom's gifts in a broad moral frame rather than a courtroom or social-legal setting, 'righteousness' is preferred in the main text, while 'justice' is preserved in a footnote to avoid over-resolving the semantic range.
