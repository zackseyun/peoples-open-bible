  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲוֺנֹתַי
  english_pob_choice: my iniquities
  chosen_korean: 내 죄악
  alternatives_korean:
  - 내 죄들
  - 내 죄책
  lexicon: HALOT
  rationale: עָוֹן은 죄악, 죄책, 죄의 결과까지 아우를 수 있으나, 본문은 시편의 탄식 속에서 행위 자체의 도덕적 무게를 드러내므로 ‘죄악’이 가장 직접적입니다.
- source_word: עָבְרוּ רֹאשִׁי
  english_pob_choice: have gone over my head
  chosen_korean: 머리 위를 넘었으니
  alternatives_korean:
  - 머리 위를 지나갔으니
  - 머리 위를 덮쳤으니
  lexicon: HALOT
  rationale: ‘머리 위를 넘다’는 히브리어의 공간적 비유를 살리면서도 한국어로 자연스럽게 읽히는 표현입니다.
- source_word: כְמַשָּׂא
  english_pob_choice: like a heavy burden
  chosen_korean: 무거운 짐[a]처럼
  alternatives_korean:
  - 무거운 부담처럼
  - 무거운 짐처럼
  lexicon: HALOT
  rationale: מַשָּׂא의 기본 의미인 ‘짐/부담’을 살리되, 뒤의 ‘무겁다’와 중복되는 번역은 피하지 않고 시적 평행을 유지했습니다.
- source_word: יִכְבְּד֥וּ מִמֶּֽנִּי
  english_pob_choice: they are too heavy for me
  chosen_korean: 내게 너무 무겁습니다
  alternatives_korean:
  - 내게 감당하기에는 너무 무겁습니다
  - 내게 지나치게 무겁습니다
  lexicon: HALOT
  rationale: 동사 כבד의 ‘무겁다’ 이미지를 반복하여, 영어 POB가 보존한 중량감과 압도감을 한국어에서도 유지했습니다.
theological_decisions:
- issue: עֲוֹנֹתַי의 범위(죄 vs 죄책)
  chosen_reading: 본문에는 행위 중심의 ‘죄악’을 두되, 주석으로도 확정하지 않고 의미 범위를 열어 둡니다.
  alternative_readings:
  - 내 죄책
  - 내 허물
  rationale: 시편 38편의 탄식 맥락에서는 실제 범죄의 무게가 강조되지만, 어근이 죄책/책임의 의미도 가질 수 있으므로 번역 본문은 명료하게, 의미의 긴장은 남겨 둡니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
