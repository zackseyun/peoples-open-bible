  - 교훈시
  lexicon: HALOT
  rationale: 이 용어는 정확한 장르·기능이 확정되지 않아, 본문에서는 음역을 유지해 해석을 과도하게 고정하지 않았습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗의
