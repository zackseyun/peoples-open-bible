  text: 왕께서는 사람의 아들들보다 더 아름다우십니다[a]. 은혜가 왕의 입술에 부어졌으므로[b], 하나님께서 왕께 영원히 복을 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
