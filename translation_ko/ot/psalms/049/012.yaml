translation:
  language: ko
  text: 사람은 존귀한 자리에 있어도 오래 지속되지 못하니[a][b], 멸망하는 짐승과 같습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간은 존귀한 자리에 있어도’. 히브리어 אָדָם은 ‘사람’ 또는 ‘인간’을 뜻할 수 있으며, 여기서는 대표 단수입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘밤을 지내지 못하니’ 또는 ‘유숙하지 못하니’입니다. 이 표현은 존귀한 상태에 계속 머물거나 지속하지 못한다는 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘멸망되는 짐승’. 마지막 동사는 전통적으로 ‘멸망하다’라는 뜻으로 이해됩니다.
    reason: alternative_reading
