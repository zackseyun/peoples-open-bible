lexical_decisions:
- source_word: κατὰ πάντα
  chosen: in every way
  alternatives:
  - altogether
  - in all things
  - in every respect
  lexicon: LSJ
  rationale: The phrase functions adverbially to intensify εὐλογητός. 'In every way' is natural modern English and preserves the comprehensive force without sounding wooden.
- source_word: εὐλογητὸς
  chosen: Blessed
  alternatives:
  - praised
  - worthy of blessing
  lexicon: LSJ
  rationale: A standard predicate adjective for God in Jewish-Greek diction. 'Blessed' preserves the liturgical and theological register better than the more interpretive 'praised'.
- source_word: ἡμῶν ὁ θεός
  chosen: our God
  alternatives:
  - God of us
  lexicon: LSJ
  rationale: Idiomatic possessive construction; 'our God' is the natural English equivalent and preserves the covenantal relationship implied by the Greek.
- source_word: ἔδωκεν
  chosen: gave over
  alternatives:
  - gave
  - handed over
  - delivered
  lexicon: LSJ
  rationale: With a personal object and in a military/judicial context, the verb likely means to hand enemies over into another's power rather than merely 'give.' 'Gave over' keeps the wording concise while signaling hostile transfer.
- source_word: τοὺς ἀσεβήσαντας
  chosen: those who acted wickedly
  alternatives:
  - the ungodly ones
  - those who acted impiously
  - those who were godless
  lexicon: LSJ
  rationale: The aorist participle from ἀσεβέω denotes impious or wicked conduct. 'Those who acted wickedly' is readable modern English and avoids importing a narrower doctrinal sense, while still reflecting moral-religious offense.
