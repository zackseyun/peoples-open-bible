id: PSA.77.10
reference: Psalms 77:10
source:
  edition: WLC
  text: וָ֭/אֹמַר חַלּ֣וֹתִ/י הִ֑יא שְׁ֝נ֗וֹת יְמִ֣ין עֶלְיֽוֹן׃
translation:
  text: 'Then I said, “This is my grief: the right hand[a] of the Most High has changed[b].”'
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The right hand is an image of strength and powerful action.
    reason: cultural_note
  - marker: b
    text: 'Or, “This is what I will appeal to: the years when the Most High displayed his power.” The difficult Hebrew permits different understandings of “my grief,” and the word rendered “has changed” can also mean “years.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  chosen: Then I said
  alternatives:
  - And I said
  - So I said
  lexicon: HALOT
  rationale: Wayyiqtol of אמר introduces the psalmist's statement in sequence. 'Then I said' preserves the narrative turn while remaining natural English.
- source_word: חַלּוֹתִי
  chosen: my grief
  alternatives:
  - my sickness
  - my weakness
  - my wound
  lexicon: HALOT
  rationale: From חלה/חלות, the form is difficult and contextually denotes the psalmist's affliction or weakness. 'My grief' fits the lament context and yields coherent sense in parallel with the following clause. Because the term is debated, alternatives are preserved in a footnote.
- source_word: הִיא
  chosen: This is
  alternatives:
  - it is
  - this was
  lexicon: HALOT
  rationale: The pronoun likely points deictically to the preceding condition or realization. Rendering with 'This is' makes the Hebrew pronoun explicit in idiomatic English.
- source_word: שְׁנוֹת
  chosen: has changed
  alternatives:
  - the changes of
  - the repetitions of
  - the years of
  lexicon: HALOT
  rationale: 'With ''this is my grief,'' the verbal reading from shanah gives a complete and coherent clause: the Most High''s powerful action appears to have changed. The nominal ''years of'' remains possible.'
- source_word: יְמִין
  chosen: the right hand of
  alternatives:
  - the right side of
  lexicon: HALOT
  rationale: '''Right hand'' is the standard idiomatic rendering and in biblical poetry commonly signifies power or saving action. Retaining the image preserves the theological-poetic force.'
- source_word: עֶלְיוֹן
  chosen: the Most High
  alternatives:
  - the Exalted One
  lexicon: HALOT
  rationale: A divine title regularly rendered 'Most High.' This preserves established biblical diction and the title's exalted sense.
