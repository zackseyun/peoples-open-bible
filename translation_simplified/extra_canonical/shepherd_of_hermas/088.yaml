  text: Λέγουσί μοι αἱ παρθένοι· Σήμερον ὁ ποιμὴν ὧδε οὐκ ἔρχεται. Τί οὖν, φημί, ποιήσω ἐγώ; Μέχρις ὀψέ,
    φασίν, περίμενον αὐτόν· καὶ ἐὰν ἔλθῃ, λαλήσει μετὰ σοῦ, ἐὰν δὲ μὴ ἔλθῃ, μενεῖς μεθ᾿ ἡμῶν ὧδε ἕως ἔρχεται.
    2. λέγω αὐταῖς· Ἐκδέξομαι αὐτὸν ἕως ὀψέ· ἐὰν δὲ μὴ ἔλθῃ, ἀπελεύσομαι εἰς τὸν οἶκον, καὶ πρωῒ ἐπανήξω.
    αἱ δὲ ἀποκριθεῖσαι λέγουσί μοι· Ἡμῖν παρεδόθης· οὐ δύνασαι ἀφ᾿ ἡμῶν ἀναχωρῆσαι. 3. Ποῦ οὖν, φημί,
    μενῶ; Μεθ᾿ ἡμῶν, φασί, κοιμηθήσῃ ὡς ἀδελφός, καὶ οὐχ ὡς ἀνήρ. ἡμέτερος γὰρ ἀδελφὸς εἶ, καὶ τοῦ λοιποῦ
    μέλλομεν μετὰ σοῦ κατοικεῖν· λίαν γάρ σε ἀγαπῶμεν. ἐγὼ δὲ ᾐσχυνόμην μετ᾿ αὐτῶν μένειν. 4. καὶ ἡ δοκοῦσα
    πρώτη αὐτῶν εἶναι ἤρξατό με καταφιλεῖν καὶ περιπλέκεσθαι· αἱ δὲ ἄλλαι ὁρῶσαι ἐκείνην περιπλεκομένην
    μοι, καὶ αὐταὶ ἤρξαντό με καταφιλεῖν καὶ περιάγειν κύκλῳ τοῦ πύργου καὶ παίζειν μετ᾿ ἐμοῦ. 5. κἀγὼ
    ὡσεὶ νεώτερος ἐγεγόνειν καὶ ἠρξάμην καὶ αὐτὸς παίζειν μετ᾿ αὐτῶν. αἱ μὲν γὰρ ἐχόρευον, [αἱ δὲ ὠρχοῦντο,]
    αἱ δὲ ᾖδον· ἐγὼ δὲ σιγὴν ἔχων μετ᾿ αὐτῶν κύκλῳ τοῦ πύργου περιεπάτουν, καὶ ἱλαρὸς ἤμην μετ᾿ αὐτῶν.
    6. ὀψίας δὲ γενομένης ἤθελον εἰς τὸν οἶκον ὑπάγειν· αἱ δὲ οὐκ ἀφῆκαν, ἀλλὰ κατέσχον με. καὶ ἔμεινα
    μετ᾿ αὐτῶν τὴν νύκτα, καὶ ἐκοιμήθην παρὰ τὸν πύργον. 7. ἔστρωσαν γὰρ αἱ παρθένοι τοὺς λινοῦς χιτῶνας
    ἑαυτῶν χαμαί, καὶ ἐμὲ ἀνέκλιναν εἰς τὸ μέσον αὐτῶν, καὶ οὐδὲν ὅλως ἐποίουν εἰ μὴ προσηύχοντο· κἀγὼ
    μετ᾿ αὐτῶν ἀδιαλείπτως προσηυχόμην, καὶ οὐκ ἔλασσον ἐκείνων. καὶ ἔχαιρον αἱ παρθένοι οὕτω μου προσευχομένου.
    καὶ ἔμεινα ἐκεῖ μέχρι τῆς αὔριον ἕως ὥρας δευτέρας μετὰ τῶν παρθένων. 8. εἶτα παρῆν ὁ ποιμήν, καὶ
    λέγει ταῖς παρθένοις· Μή τινα αὐτῷ ὕβριν πεποιήκατε; Ἐρώτα, φασίν, αὐτόν. λέγω αὐτῷ· Κύριε, εὐφράνθην
    μετ᾿ αὐτῶν μείνας. Τί, φησίν, ἐδείπνησας; Ἐδείπνησα, φημί, κύριε, ῥήματα Κυρίου ὅλην τὴν νύκτα. Καλῶς,
    φησίν, ἔλαβόν σε; Ναί, φημί, κύριε. 9. Νῦν, φησί, τί θέλεις πρῶτον ἀκοῦσαι; Καθὼς, φημί, κύριε, ἀπ᾿
    ἀρχῆς ἔδειξας, ἐρωτῶ σε, κύριε, ἵνα καθὼς ἄν σε ἐπερωτήσω, οὕτω μοι καὶ δηλώσῃς. Καθὼς βούλει, φησίν,
    οὕτω σοι καὶ ἐπιλύσω, καὶ οὐδὲν ὅλως ἀποκρύψω ἀπὸ σοῦ.
