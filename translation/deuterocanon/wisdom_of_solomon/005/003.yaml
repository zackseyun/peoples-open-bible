id: WIS.5.3
reference: Wisdom of Solomon 5:3
source:
  edition: lxx-swete-1909
  text: ἐροῦσιν ἐν ἑαυτοῖς μετανοοῦντες καὶ διὰ στενοχωρίαν πνεύματος στενάξονται Οὗτος ἦν ὃν ἔσχομέν ποτε εἰς γέλωτα
  language: Greek
