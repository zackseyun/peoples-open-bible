  text: שִׁמְעָ֥א בְנ֛/וֹ חַגִּיָּ֥ה בְנ֖/וֹ עֲשָׂיָ֥ה בְנֽ/וֹ׃פ
translation:
  text: Uzzah’s son was Shimea; Shimea’s son was Haggiah, and Haggiah’s son was Asaiah.
