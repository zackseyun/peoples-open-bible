source:
  edition: WLC
  text: אָכְל֬וּ וַ/יִּֽשְׁתַּחֲוּ֨וּ כָּֽל דִּשְׁנֵי אֶ֗רֶץ לְ/פָנָ֣י/ו יִ֭כְרְעוּ כָּל יוֹרְדֵ֣י עָפָ֑ר וְ֝/נַפְשׁ֗/וֹ לֹ֣א חִיָּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: All the prosperous of the earth[a] will eat and bow down; before him all who go down to the dust[b] will kneel—even he who could not keep himself alive.[c]
  footnotes:
  - marker: a
    text: Hebrew literally, “all the fat ones of the earth,” an image commonly understood as the well-fed or prosperous.
    reason: lexical_alternative
  - marker: b
    text: Or “all who descend to the dust.” “Dust” is a concrete Hebrew image associated with mortality and death.
    reason: lexical_alternative
  - marker: c
    text: The final Hebrew clause is difficult; more literally, “and his life he did not keep alive.” The rendering in the text understands it of one unable to preserve his own life.
    reason: alternative_reading
translation:
  language: ko
  text: 땅의 모든 부유한 이들이 먹고 절할 것이며[a], 티끌로 내려가는 모든 이들이 그의 앞에서 무릎을 꿇을 것입니다[b]—자기 생명을 보존하지 못한 이도 그러할 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘땅의 모든 기름진 자들’입니다. 이 표현은 풍족하고 부유한 이들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘티끌로 내려가는 모든 이들’로 옮길 수 있습니다. ‘티끌’은 히브리어에서 필멸성과 죽음을 나타내는 이미지입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 마지막 절은 해석하기 어렵습니다. 직역하면 ‘그의 생명을 그가 살려 두지 못하였다’ 정도이며, 흔히 ‘자기 생명을 보존할 수 없었던 이도’로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께 속하였고
  alternatives_korean:
  - 야훼의 나라입니다
  - 주께 속하였고
  - 여호와께 속하였고
  lexicon: HALOT
  rationale: ל 표지는 소유/귀속 관계를 나타내므로, 단순히 ‘주께 있다’보다 ‘속하다’가 원문의 관계를 더 직접적으로 드러냅니다. POB의 YHWH 처리를 따라 전통적 ‘여호와’보다 ‘야훼’를 사용했습니다.
- source_word: הַמְּלוּכָה
  english_pob_choice: the kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕권
  - 왕국
  - 통치
  lexicon: HALOT
  rationale: מְלוּכָה는 왕권, 통치, 왕국/나라를 아우를 수 있으나, 이 시구에서는 하나님의 보편적 주권을 자연스럽게 드러내는 ‘나라’가 가장 읽기 쉽고 원뜻에도 부합합니다.
- source_word: וּמֹשֵׁל
  english_pob_choice: and he rules
  chosen_korean: 그가 다스리십니다
  alternatives_korean:
  - 그가 통치하십니다
  - 그가 지배하십니다
  - 다스리며
  lexicon: HALOT
  rationale: 분사 모쉘은 현재적·일반적 사실을 나타낼 수 있으므로, 한국어에서는 문맥상 현재 진술인 ‘다스리십니다’로 옮겼습니다. 대상이 하나님이므로 높임 종결을 사용했습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: over the nations
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 열방을 다스리십니다
  - 나라들 위에
  - 민족들 위에
  lexicon: HALOT
  rationale: ב는 통치의 범위/영역을 나타낼 수 있어 단순한 ‘위에’보다 ‘가운데서’가 시적 병행을 살리면서도 실제 통치 영역을 표현합니다. גוים는 여기서 이방 대비보다 넓은 ‘민족들’이 적절합니다.
theological_decisions:
