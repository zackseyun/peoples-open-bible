id: HAB.2.4
reference: Habakkuk 2:4
source:
  edition: WLC
  text: הִנֵּ֣ה עֻפְּלָ֔ה לֹא יָשְׁרָ֥ה נַפְשׁ֖/וֹ בּ֑/וֹ וְ/צַדִּ֖יק בֶּ/אֱמוּנָת֥/וֹ יִחְיֶֽה־׃
translation:
  text: 'Look: his soul is puffed up; it is not upright within him, but the righteous will live by his[a] faithfulness[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The Masoretic Hebrew has 'his.' A Greek form reads 'by my faith/faithfulness.' In the consulted published transcriptions of 1QpHab, Mur 88 and 4Q82, this clause is editorially restored, not preserved, so those supplies cannot settle the suffix. POB retains the Hebrew provisionally; earliest wording is unresolved.
  - marker: b
    reason: lexical_alternative
    text: Or 'his faith' or 'his trust.' 'Faithfulness' emphasizes steadfast fidelity; trust and fidelity can overlap. This wording does not by itself settle later arguments about faith and works.
lexical_decisions:
- source_word: אֱמוּנָתוֹ
  chosen: his faithfulness
  alternatives:
  - his faith
  - his trust
  rationale: The waiting-for-the-vision context and contrast with arrogance support steadfast fidelity, while trust remains a possible emphasis. Retention is provisional and does not establish one exclusive sense, a different Hebrew suffix, or the meaning of every later Greek quotation. No fresh lexicon consultation is claimed.
