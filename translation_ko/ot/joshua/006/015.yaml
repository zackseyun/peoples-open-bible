  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/יַּשְׁכִּ֨מוּ֙ כַּ/עֲל֣וֹת הַ/שַּׁ֔חַר וַ/יָּסֹ֧בּוּ אֶת הָ/עִ֛יר כַּ/מִּשְׁפָּ֥ט הַ/זֶּ֖ה שֶׁ֣בַע פְּעָמִ֑ים רַ֚ק בַּ/יּ֣וֹם הַ/ה֔וּא סָבְב֥וּ אֶת הָ/עִ֖יר שֶׁ֥בַע פְּעָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/015.yaml
  text: And it happened on the seventh day that they rose early, at the going up of the dawn, and marched around the city in this manner seven times. Only on that day did they march around the city seven times.
translation:
  language: ko
  text: 그리고 일곱째 날에 그들은 새벽이 밝아올 무렵 일찍 일어나, 이 규례대로 성을 일곱 번 돌았습니다. 다만 그날에만 그들은 성을 일곱 번 돌았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  english_pob_choice: And it happened on the seventh day
  chosen_korean: 그리고 이레째 되는 날에
  alternatives_korean:
  - 그리고 일곱째 날에
  - 이레째 날에
  lexicon: WLC narrative formula
  rationale: אָנ/וַיְהִי의 서술 도입은 한국어에서 자연스러운 연결어인 ‘그리고’로 풀고, הַשְּׁבִיעִי는 ‘이레째’로 옮겨 반복되는 수사와 서사 리듬을 살렸습니다.
- source_word: וַיַּשְׁכִּימוּ כַּעֲלוֹת הַשַּׁחַר
  english_pob_choice: they rose early, at the going up of the dawn
  chosen_korean: 새벽이 밝아올 무렵 일찍 일어나
  alternatives_korean:
  - 새벽이 오를 때 일찍 일어나
  - 동틀 무렵 일찍 일어나
  lexicon: WLC idiom
  rationale: ‘새벽이 오르다’의 문자성을 유지하면서도 한국어에서 자연스럽게 들리도록 ‘밝아올 무렵’으로 다듬어, זמן/상황 묘사를 과도하게 해설하지 않았습니다.
- source_word: וַיָּסֹבּוּ אֶת הָעִיר ... שֶׁבַע פְּעָמִים
  english_pob_choice: and marched around the city in this manner seven times
  chosen_korean: 이 방식으로 성을 일곱 번 돌았습니다
  alternatives_korean:
  - 이런 식으로 성을 일곱 번 돌았습니다
  - 그와 같이 성을 일곱 번 돌았습니다
  lexicon: WLC verb + manner phrase
  rationale: סבב는 단순한 ‘돌다’이지만, 본문과 POB의 audit trail에 맞게 군사적 이동을 과장하지 않고 ‘성을 돌다’로 직역하되, כַּמִּשְׁפָּט הַזֶּה는 ‘이 방식으로’로 옮겨 진행 방식의 반복성을 드러냈습니다.
- source_word: רַק ...
  english_pob_choice: Only on that day
  chosen_korean: 다만 그날만은
  alternatives_korean:
  - 오직 그날에만
  - 다만 그날에만
  lexicon: WLC restrictive particle
  rationale: רַק의 제한 의미를 한국어의 대조 표지 ‘다만’으로 살리고, ‘만은’을 덧붙여 뒤 문장의 예외성을 강조했습니다.
theological_decisions:
- issue: 서술의 반복성과 예외성
  chosen_reading: ‘이 방식으로’와 ‘다만 그날만은’으로 반복 명령과 예외를 함께 드러냈습니다.
  alternative_readings:
  - 단순히 ‘그렇게’로 평준화하는 번역
  - ‘오직’만 반복해 강조를 약화시키지 않는 번역
  rationale: 본문은 동일한 행위를 반복하되 하루만 예외가 있음을 대비시키므로, 반복 규칙성과 단회성 예외를 동시에 보이도록 처리했습니다.
  doctrine_reference: 본문 서사 구조 보존
