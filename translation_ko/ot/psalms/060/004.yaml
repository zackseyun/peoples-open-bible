id: PSA.60.4
reference: Psalms 60:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָ֘תַ֤תָּה לִּ/ירֵאֶ֣י/ךָ נֵּ֭ס לְ/הִתְנוֹסֵ֑ס מִ֝/פְּנֵ֗י קֹ֣שֶׁט סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/004.yaml
  text: You have given a banner to those who fear you, to be raised up[a] because of the truth[b]. Selah
  footnotes:
  - marker: a
    text: Or 'to be displayed,' 'to rally themselves,' or possibly 'to flee.' The Hebrew verb is difficult and debated.
    reason: lexical_alternative
  - marker: b
    text: Hebrew qoshet most likely means 'truth' or 'truthfulness'; some ancient versions and interpreters understand the line differently, yielding readings such as 'because of the bow.'
    reason: alternative_reading
translation:
  language: ko
  text: 주께서 주를 경외하는 이들에게 깃발을 주셔서 높이 세우게 하셨습니다[a]. 진리를 위하여[b]. 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘드러내게 하셨습니다’, ‘집결하게 하셨습니다’, 또는 ‘피하게 하셨습니다’. 히브리어 동사의 뜻은 난해하며 논쟁의 여지가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 코셰트는 가장 유력하게 ‘진리’ 또는 ‘성실’을 뜻합니다. 일부 고대 역본과 해석 전통은 이 구절을 다르게 이해하여 ‘활 때문에’와 같은 의미로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִרְעַשְׁתָּה
  english_pob_choice: you have shaken
  chosen_korean: 흔드셨고
  alternatives_korean:
  - 흔들게 하셨고
  - 떨게 하셨고
  lexicon: HALOT
  rationale: 원문의 사역적 의미를 살리면서도 시적 평행문에서 자연스럽게 들리는 동사로 옮겼습니다.
- source_word: אֶרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 지면
  - 세상
  lexicon: HALOT
  rationale: 이 시편의 문맥에서는 우주 전체보다 실제로 무너지고 흔들리는 대상의 이미지를 살리는 것이 중요하므로, 한국어에서는 ‘땅’이 가장 자연스럽습니다.
- source_word: פְּצַמְתָּהּ / שְׁבָרֶיהָ
  english_pob_choice: you have split it open / its fractures
  chosen_korean: 그것을 갈라놓으셨습니다 / 그 틈
  alternatives_korean:
  - 그것을 쪼개셨습니다 / 그 금
  - 그것을 찢으셨습니다 / 그 균열
  lexicon: HALOT
  rationale: ‘split open’과 ‘fractures’의 긴밀한 반복을 살리기 위해 ‘갈라놓다’와 ‘틈’을 대응시켜, 같은 파괴 이미지가 이어지도록 했습니다.
- source_word: רְפָה
  english_pob_choice: heal
  chosen_korean: 고쳐 주십시오
  alternatives_korean:
  - 치유해 주십시오
  - 회복시켜 주십시오
  - 낫게 해 주십시오
  lexicon: HALOT
  rationale: 대상은 인격체가 아니라 파괴된 땅이지만, 원문이 의인화된 요청을 담고 있으므로 ‘고쳐 주십시오’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 의인화된 자연에 대한 간구를 어떻게 한국어로 유지할 것인가
  chosen_reading: ‘그 틈을 고쳐 주십시오’로 자연의 상처를 실제로 돌보아 달라는 시적 간구를 그대로 살렸습니다.
  alternative_readings:
  - ‘그것을 복구해 주십시오’
  - ‘그 상처를 치료해 주십시오’
  rationale: 원문은 땅을 마치 상처 입은 몸처럼 묘사하므로, 과도하게 설명적이거나 기술적인 표현보다 의인화된 기도를 유지하는 편이 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: 시적 의인화와 탄원 기도
- issue: 마지막 절의 상태 표현 מָטָה를 어떻게 처리할 것인가
  chosen_reading: ‘흔들리고 있기 때문입니다’로 현재진행적 불안정을 나타냈습니다.
  alternative_readings:
  - ‘무너졌기 때문입니다’
  - ‘기울어졌기 때문입니다’
  rationale: 원문의 ‘tottering’은 완전 붕괴보다 아직 버티고 있지만 위태로운 상태를 가리키므로, 진행 중인 불안정을 반영했습니다.
  doctrine_reference: 시편의 시적 현재상
