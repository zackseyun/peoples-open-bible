id: PRO.29.25
reference: Proverbs 29:25
source:
  edition: WLC
  text: חֶרְדַּ֣ת אָ֭דָם יִתֵּ֣ן מוֹקֵ֑שׁ וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה יְשֻׂגָּֽב׃
translation:
  text: Fearing people is a snare, but whoever trusts in Yahweh will be secure[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, 'will be set on high,' beyond danger's reach.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְדַּת
  chosen: fearing
  alternatives:
  - dread of
  - trembling before
  lexicon: HALOT
  rationale: The verbal noun is rendered idiomatically as a gerund, making clear that the proverb concerns the act or disposition of fearing.
- source_word: אָדָם
  chosen: people
  alternatives:
  - humankind
  - people
  lexicon: HALOT
  rationale: In the construct phrase, אָדָם denotes human beings as the objects of fear; “people” communicates that generic relational sense clearly.
- source_word: יִתֵּן
  chosen: lays
  alternatives:
  - gives
  - brings
  - sets
  lexicon: HALOT
  rationale: Literally 'gives,' but in idiomatic English with 'snare' the sense is that such fear places or lays a trap. 'Lays' communicates the proverb's imagery more naturally while staying close to the Hebrew sense.
- source_word: מוֹקֵשׁ
  chosen: a snare
  alternatives:
  - a trap
  lexicon: HALOT
  rationale: A common wisdom image for something that ensnares or traps a person. 'Snare' preserves the metaphorical and literary force better than the flatter 'trap.'
- source_word: וּבוֹטֵחַ
  chosen: but whoever trusts
  alternatives:
  - but the one trusting
  - but he who trusts
  lexicon: HALOT
  rationale: The participle functions substantivally and generically. 'Whoever trusts' renders the ongoing/generic force in natural modern English without restricting the saying to a male individual.
- source_word: בַּיהוָה
  chosen: in Yahweh
  alternatives:
  - in Yahweh
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: יְשֻׂגָּב
  chosen: will be secure
  alternatives:
  - will be safe
  - will be protected
  - will be exalted
  lexicon: HALOT
  rationale: The verb depicts being placed in an inaccessible position and thus protected; the literal height image is retained in the note.
- source_word: יִתֵּן מוֹקֵשׁ
  chosen: is a snare
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: The copular English idiom naturally conveys that such fear produces or constitutes a trap, without the misleading suggestion of deliberate trap-setting.
