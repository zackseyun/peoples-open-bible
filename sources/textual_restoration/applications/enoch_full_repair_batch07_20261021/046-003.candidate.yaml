translation:
  text: He answered me, “This is the son of man who has righteousness. Righteousness has dwelt with him, and he
    uncovers all the hidden storehouses, because the Lord of Spirits has chosen him. His portion has prevailed before
    the Lord of Spirits in uprightness forever.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected final phrase speaks of his portion or allotted share prevailing; it is not replaced by an
      unprinted kingdom, independent rank or named person. The relative and possessive construction is compressed,
      and this English relates it to the son of man. The two actual printed titles here use መንፈሳት; no universal
      spelling rule from another chapter supplies them.
    reason: alternative_reading
