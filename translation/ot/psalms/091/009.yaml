theological_decisions:
- issue: Identifying the speaker and addressee in the compressed Hebrew of verse 9
  chosen_reading: Use the expressed verb 'have made' while treating 'Yahweh—my refuge, the Most High' as its object; do not supply an unexpressed speech verb.
  alternative_readings:
  - 'Preserve an abrupt shift of voice: “For you, Yahweh, are my refuge! You have made the Most High your dwelling place.”'
  - Treat “Yahweh—my refuge, the Most High” as the object of “you have made.”
  rationale: The Masoretic wording is compressed and supports multiple construals. The main text follows a long-standing syntactic solution that keeps one human addressee and uses only the expressed verb שַׂמְתָּ. The note preserves the accent-sensitive abrupt change of voice rather than concealing the ambiguity.
  doctrine_reference: PHILOSOPHY.md — source-image accuracy with contextual understanding in the companion layer
