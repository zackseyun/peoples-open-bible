id: PSA.3.2
reference: Psalms 3:2
source:
  edition: WLC
  text: רַבִּים֮ אֹמְרִ֪ים לְ/נַ֫פְשִׁ֥/י אֵ֤ין יְֽשׁוּעָ֓תָ/ה לּ֬/וֹ בֵֽ/אלֹהִ֬ים סֶֽלָה׃
translation:
  text: Many are saying about me, “There is no salvation for him from God.” Selah[a]
  philosophy: dynamic
  footnotes:
  - marker: a
    text: “Selah” is probably a musical or liturgical term; its precise meaning is uncertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  chosen: Many
  alternatives:
  - Many people
  - Multitudes
  lexicon: HALOT
  rationale: The adjective functions substantivally here, referring to numerous people. 'Many' is concise and natural in English while preserving the indefinite plural force.
- source_word: אֹמְרִים
  chosen: are saying
  alternatives:
  - say
  - are saying repeatedly
  lexicon: HALOT
  rationale: The participle conveys ongoing or repeated action. 'Are saying' captures the durative sense better than a simple present without becoming overly paraphrastic.
- source_word: לְנַפְשִׁי
  chosen: about me
  alternatives:
  - to my soul
  - about me
  lexicon: HALOT
  rationale: The expression idiomatically refers to the psalmist himself; “about me” is natural with “are saying.”
- source_word: אֵין
  chosen: There is no
  alternatives:
  - There is not
  - 'No'
  lexicon: HALOT
  rationale: Standard existential negation. 'There is no' is the most natural English equivalent in this clause.
- source_word: יְשׁוּעָתָה
  chosen: salvation
  alternatives:
  - deliverance
  - help
  - victory
  lexicon: HALOT
  rationale: The noun from ישׁע denotes rescue or deliverance. 'Salvation' preserves the lexical connection and theological weight common in the Psalms, while remaining understandable. 'Deliverance' is a viable contextual alternative but slightly narrows the resonance.
- source_word: לּוֹ
  chosen: for him
  alternatives:
  - for himself
  - to him
  lexicon: HALOT
  rationale: The pronominal suffix refers to the psalmist in the third person as quoted by his enemies. 'For him' is the most straightforward rendering in English.
- source_word: בֵאלֹהִים
  chosen: in God
  alternatives:
  - from God
  - with God
  - by God
  lexicon: HALOT
  rationale: The preposition ב normally means 'in' or 'with.' Here 'in God' is the plain rendering and preserves the likely sense that, in the speakers' view, God offers him no saving help. 'From God' reflects an interpretive expansion rather than the preposition itself.
- source_word: סֶלָה
  chosen: Selah
  lexicon: HALOT
  rationale: The term's precise meaning is uncertain; standard practice is to transliterate rather than impose a speculative interpretation such as 'pause' or 'interlude.' This preserves transparency to the source text.
