  source_fidelity: 개정이 필요합니다. 초안은 בְּאֶרֶץ חָם(‘함의 땅에서’)를 본문에서 누락하여 장소 표현을 번역하지 않았습니다. 또한 דִּבְרֵי אֹתוֹתָיו를 ‘표적들의 말씀’으로 옮긴 것은 히브리어의 낯선 구성은 반영하지만, 한국어에서 ‘말씀’이 표적의 행위·사건이라는 문맥상 의미를 심각하게 흐립니다.
  naturalness: ‘그들 가운데에서’은 가능하나 ‘그들 가운데서’가 더 자연스럽습니다. ‘그의 표적들의 일들’도 다소 직역적이지만, 본문의 수사적 구성을 보존하면서 ‘말씀’보다 문맥에 맞게 읽힙니다. ‘기사들’은 표적과 짝을 이루는 מוֹפְתִים의 성격을 현대 한국어 성경 문체에서 자연스럽게 전달합니다.
  terminology: אָתוֹת는 ‘표적’, מוֹפְתִים는 ‘기사’로 구별했습니다. ‘함의 땅’은 애굽의 시적 명칭이므로 본문에 보존하고 각주로 설명해야 합니다. דִּבְרֵי의 문자적 ‘말씀’은 본문이 아니라 각주에서 밝혀, 원문 투명성과 한국어 의미 전달을 함께 확보했습니다.
