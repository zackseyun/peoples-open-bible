translation:
  text: And they conceived and gave birth to great giants, whose height was three thousand cubits each.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ethiopic numeral ፴፻ is read multiplicatively as “three thousand” (thirty hundreds). The source’s gigantic measurement
      is retained without normalization.
    reason: cultural_note
  - marker: b
    text: The selected edition reads the ancient cubit measure together with the very large numeral. This is retained as the
      text’s measurement, not a claim about a physically demonstrated stature or a scale for literal illustration.
    reason: textual_variant
