lexical_decisions:
- source_word: ርስዓነ
  chosen: wickedness
  alternatives:
  - impiety
  - godlessness
  rationale: The term denotes moral and religious wrongdoing. “Wickedness” is broad enough to cover both dimensions without
    importing a more narrowly doctrinal sense.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ዓቢየ፡ ወብዙኃ
  chosen: great and widespread
  alternatives:
  - great and abundant
  - great and much
  rationale: Literally, the paired modifiers express greatness and abundance. “Widespread” gives idiomatic English expression
    to the scale implied by “much” while retaining both modifiers.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ዘመዉ
  chosen: committed sexual immorality
  alternatives:
  - committed fornication
  - acted promiscuously
  rationale: The verb denotes illicit sexual conduct. “Committed sexual immorality” is clear modern English and does not restrict
    the act to the narrower modern sense of “fornication.”
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ተሳሕቱ
  chosen: went astray
  alternatives:
  - erred
  - were led astray
  rationale: The form expresses deviation or error. “Went astray” preserves the path metaphor reinforced by the following
    reference to their ways, without assuming an external agent.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ማሰኑ
  chosen: corrupted
  alternatives:
  - ruined
  - spoiled
  rationale: “Corrupted” preserves the active sense that they brought their conduct into a ruined moral state.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ኵሎ፡ ፍናዊሆሙ
  chosen: all their ways
  alternatives:
  - all their paths
  - their whole manner of life
  rationale: “Ways” retains the source metaphor for patterns of conduct and avoids replacing the image with an explanatory
    paraphrase.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
theological_decisions:
- issue: Religious versus general moral force of ርስዓነ
  chosen_reading: wickedness
  alternative_readings:
  - impiety
  - godlessness
  rationale: The context combines sexual wrongdoing, straying, and corrupted conduct. The broader “wickedness” preserves this
    range rather than limiting the term to irreverence toward God.
  doctrine_reference: Preserve locally grounded theological meaning rather than harmonizing terminology across the corpus.
