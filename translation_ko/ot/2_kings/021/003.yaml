revisions:
- from: 그는 그의 아버지 히스기야가 없앤 산당들을 다시 세우고, 바알에게 제단들을 세우며, 아세라를 만들었으니 — 이스라엘 왕 아합이 한 것과 같았습니다 — 그리고 그는 하늘의 온 군상에게 절하고 그것들을 섬겼습니다.[a][b][c]
  to: 그는 그의 아버지 히스기야가 없앤 산당들을 다시 세우고, 바알을 위한 제단들을 세우고, 이스라엘 왕 아합이 한 것처럼 아세라[b]를 만들고, 하늘의 모든 군상에게 절하며 그것들을 섬겼습니다.
  rationale: 원문의 네 동작을 일관된 과거 서술로 유지하고, ‘아합이 한 것처럼’이 ‘아세라를 만들고’를 수식하도록 재배치했습니다. 불필요하거나 불명확한 대안 각주는 제거하고, 아세라의 지시 대상에 관한 필요한 설명만 해당 단어에 직접 연결했습니다.
