id: PSA.22.19
reference: Psalms 22:19
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה אַל תִּרְחָ֑ק אֱ֝יָלוּתִ֗/י לְ/עֶזְרָ֥תִ/י חֽוּשָׁ/ה־׃
translation:
  text: But you, Yahweh, do not be far away; my strength[a], hurry to help me.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “my help”; the Hebrew term is rare and its meaning uncertain.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַתָּה
  chosen: But you
  alternatives:
  - And you
  - But as for you
  lexicon: HALOT
  rationale: The conjunction plus independent pronoun marks a strong contrast with the preceding distress. 'But you' captures the adversative force naturally in English better than a simple 'And you.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  - LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: אַל תִּרְחָק
  chosen: do not be far away
  alternatives:
  - do not be far off
  - do not stay far away
  lexicon: HALOT
  rationale: The verb רחק means 'be far, distant.' Rendering the negative jussive as 'do not be far away' is idiomatic modern English while preserving the plea's directness.
- source_word: אֱיָלוּתִי
  chosen: my strength
  alternatives:
  - my help
  - my might
  - my hind/doe
  lexicon: HALOT
  rationale: Contextually suitable rendering of a rare term, with a note candidly preserving lexical uncertainty.
- source_word: לְעֶזְרָתִי
  chosen: to help me
  alternatives:
  - for my help
  - to my aid
  lexicon: HALOT
  rationale: The prepositional phrase literally means 'for/to my help.' 'To help me' is the most natural English expression and preserves the purpose/direction of the appeal.
- source_word: חוּשָׁה
  chosen: hurry
  alternatives:
  - make haste
  - come quickly
  lexicon: HALOT
  rationale: The imperative calls for urgent action. 'Hurry' is clear modern English; 'make haste' is more traditional but archaic for the stated translation philosophy.
