translation:
  text: And Azazel taught human beings to make swords, knives, shields, and armor for the shoulders. He showed them what lay
    behind these[a] and how to make them, as well as bracelets, ornaments, eye paint, the beautifying of the eyelids, every
    kind of precious and choice stone, and every dye for coloring. And the world was changed.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected Ethiopic phrase is difficult and uses “behind/after” language. Charles discusses corrupt or doublet
      expressions and a possible relation to metals in the apparatus. This translation preserves the difficult relation rather
      than silently supplying “metals drawn from the earth.”
    reason: textual_variant
  - marker: b
    text: The clause “And the world was changed” is bracketed in the supplied edition, indicating textual uncertainty, but
      is retained in the main text because it belongs to the presented witness.
    reason: textual_variant
lexical_decisions:
- source_word: አዛዝኤል
  chosen: Azazel
  alternatives:
  - Azael
  rationale: Uses the conventional English form of the Watcher's name represented by the Ge'ez transliteration.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ሰብእ
  chosen: human beings
  alternatives:
  - men
  - people
  rationale: The noun can denote people or humanity collectively. Here the instruction has a society-wide effect, so 'human
    beings' preserves the collective sense without implying that only males received the knowledge.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: አሰይፍት፡ ወመጣብኅት፡ ወወልታ፡ ወድርዐ፡ አንግድዓ
  chosen: swords, knives, shields, and armor for the shoulders
  alternatives:
  - swords, cutting weapons, shields, and breastplates
  - swords, knives, shields, and shoulder guards
  rationale: Preserves the concrete catalogue of weaponry. The final construction associates defensive armor with the shoulders;
    'armor for the shoulders' retains that anatomy rather than silently reducing it to the conventional 'breastplates.'
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ዘእምድኅሬሆሙ
  chosen: what lay behind these
  alternatives:
  - what came after them
  - the materials from which these were made
  - the metals drawn from the earth
  rationale: The marked Ge'ez phrase literally points to what is 'behind' or 'after' them and is textually difficult in context.
    The main text remains close to the supplied witness rather than silently importing the familiar metals-of-the-earth reading;
    the uncertainty is disclosed in a footnote.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ምግባሮሙ
  chosen: how to make them
  alternatives:
  - their manufacture
  - their workmanship
  - how to work them
  rationale: Expresses the making or production of the preceding objects in clear modern English while retaining the emphasis
    on imparted technical knowledge.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: እውቃፋተ፡ ወስርጐ
  chosen: bracelets, ornaments
  alternatives:
  - armlets and adornments
  - bracelets and jewelry
  rationale: Renders two distinct forms of bodily adornment without narrowing the broader second term to a specific kind of
    jewelry.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ተጽሕሎተ፡ ወአስንዮተ፡ ቀርንብ
  chosen: eye paint, the beautifying of the eyelids
  alternatives:
  - antimony, and the adornment of the eyelids
  - cosmetic painting and beautifying the eyebrows
  rationale: The sequence concerns cosmetic coloring and beautification around the eyes. 'Eye paint' communicates the function
    without overconfidently identifying a particular mineral, while 'eyelids' reflects the traditional anatomical sense but
    remains lexically uncertain.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: እብነ፡ እምኵሉ፡ እብን፡ ክቡረ፡ ወሕኂረ
  chosen: every kind of precious and choice stone
  alternatives:
  - all precious and selected stones
  - stones of every precious kind
  rationale: Conveys comprehensiveness, value, and select quality while smoothing the repetitive Ge'ez stone terminology into
    idiomatic English. The bracketed adjective is represented as 'choice.'
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ኵሎ፡ ጥምዓታተ፡ ኅብረ
  chosen: every dye for coloring
  alternatives:
  - all coloring substances
  - every colored tincture
  - all kinds of colored dyes
  rationale: The phrase denotes substances or preparations used to impart color. 'Dye' is accessible and concrete, while 'for
    coloring' preserves the explicit color term.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ተወላጠ፡ ዓለም
  chosen: the world was changed
  alternatives:
  - the age was changed
  - the world became altered
  rationale: Preserves the stark apocalyptic consequence stated in the bracketed clause. 'World' best captures the broad social-cosmic
    scope of ዓለም here, though 'age' is lexically possible.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
theological_decisions:
- issue: The portrayal of weaponcraft and adornment as illicit revealed knowledge
  chosen_reading: Retain the concrete catalogue under Azazel's agency and conclude with the world's transformation.
  alternative_readings:
  - Treat the list as neutral technological progress
  - Generalize the instruction as corruption or sin
  rationale: The verse locates these arts within the Watchers' transgressive instruction, but it does so through a specific
    catalogue rather than an abstract moral label. The translation therefore neither neutralizes the scene nor adds an explicit
    condemnation absent from this verse.
- issue: Scope of the final transformation
  chosen_reading: the world was changed
  alternative_readings:
  - the age was changed
  - human society was corrupted
  rationale: The Ge'ez clause states transformation, not explicitly corruption, even though the surrounding narrative supplies
    a negative judgment. Preserving 'changed' avoids importing that interpretation into the wording itself.
