base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/003.yaml
  text: 'I say to you: if you do not keep these, but neglect them, do not follow the commandments of the devil, which are difficult and bitter and savage and licentious; and do not fear the devil, because he has no power against you. For I will be with you—I, the angel of repentance, who has mastery over him. The devil has only fear, but his fear has no force. Therefore do not fear him, and he will flee from you.”'
translation:
  language: pt
  text: 'Eu te digo: se não guardares estes mandamentos, mas os negligenciares, não sigas os mandamentos do diabo, que são difíceis, amargos, selvagens e libertinos.[a] Não temas o diabo, pois ele não tem poder contra ti. Eu estarei contigo — eu, o anjo do arrependimento, que o domina. O diabo só conta com o medo, mas esse medo não tem força. Portanto, não o temas, e ele fugirá de ti.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego está corrompido ou incompleto na transição para “não sigas”; o sentido adotado segue o contraste imediato entre os mandamentos apresentados e os mandamentos do diabo.
    reason: Sinalizar com transparência uma dificuldade real do texto-fonte, que não permite traduzir a construção de forma plenamente literal.
lexical_decisions:
- source_word: παρενθυμηθῇς
  choice: os negligenciares
  rationale: O verbo raro indica pôr de lado, desconsiderar ou negligenciar; esta formulação conserva o contraste com guardar os mandamentos.
- source_word: ἀγρίαις
  choice: cruéis
  rationale: No contexto de mandamentos caracterizados moralmente, traduz a ideia de algo feroz, brutal ou selvagem em português natural.
- source_word: ἀσελγέσι
  choice: libertinos
  rationale: Expressa conduta desenfreada e moralmente dissoluta sem restringir o termo apenas à sexualidade.
- source_word: κατακυριεύων
  choice: que o domina
  rationale: Mantém a noção forte de exercer domínio sobre o diabo.
- source_word: τόνον οὐκ ἔχει
  choice: não tem força
  rationale: τόνος denota tensão, vigor ou eficácia; a expressão afirma que o medo provocado pelo diabo carece de poder efetivo.
theological_decisions:
- issue: Poder do diabo contra os destinatários
  choice: ele não tem poder contra vós
  alternative: ele não tem poder algum sobre vós
  rationale: Conserva καθ’ ὑμῶν como oposição dirigida contra os ouvintes, sem ampliar a afirmação para uma negação absoluta de todo poder diabólico.
- issue: Identidade e autoridade do anjo do arrependimento
  choice: eu, o anjo do arrependimento, que o domina
  alternative: eu, o anjo da penitência, que tenho domínio sobre ele
  rationale: Mantém a autoidentificação e a relação gramatical com o diabo, sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com “vós” para preservar a mudança do singular dirigida a Hermas para a exortação plural. “Libertinos” conserva o teor moral de ἀσελγέσι sem explicitação denominacional. A formulação do medo foi levemente desdobrada para soar inteligível em português, mantendo a tensão entre a capacidade do diabo de causar medo e a falta de força desse medo.
