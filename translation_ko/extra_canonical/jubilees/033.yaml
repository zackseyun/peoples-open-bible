  text: '1[v2]. And Jacob went and camped to the south of Migdal-edar. And he went to his father

    2. Isaac, he and Leah his wife, on the new moon of the ninth month. And Reuben saw Bilhah,

    3. Rachel’s maidservant, the concubine of his father, bathing in water in a secluded place, and he loved her. And he hid himself at night, entered the house of Bilhah by night, and found her sleeping alone on a bed in her house.

    4. And he lay with her, and she awoke and saw, and behold, Reuben was lying with her in the bed. And she uncovered the edge of her covering and seized him and cried out, and she recognized that it was Reuben.

    5[v4]. And she was ashamed because of him, and she released her hand from upon him, and he fled. And she lamented greatly because of this matter,

    6. and she told it to no one. And when Jacob came and she sought him, she said to him,

    7. “I am not clean for you, because I have been defiled away from you, for Reuben has polluted me and lay with me at night while I was sleeping, and I did not know until he uncovered my skirt and lay with me.”

    8. And Jacob was very angry with Reuben because he had lain with Bilhah, because he had uncovered his father’s skirt.

    9. Yet Jacob did not approach her again, because Reuben had defiled her. And every man who uncovers his father’s covering—his matter is very evil,

    10. for he is abominable before the LORD. Because of this it is written and ordained on the heavenly tablets that a man must not lie with his father’s wife and must not uncover his father’s covering, because it is unclean. They must surely die together—the man who lies with his father’s wife and the woman also—for they have done an unclean deed on the earth. And let there be no uncleanness before our God among the people whom he has chosen for himself as a kingdom. And again it is written a second time: “Cursed be the one who lies with his father’s wife, because he has uncovered his father’s shame.” And let all the holy ones of the LORD say, “So be it, so be it.” And you, Moses, command the children of Israel that they keep this word, for it is a sentence of death, and it is unclean, and there is no atonement forever to atone for the man who has done this, except to put him to death and kill him and stone him and uproot him from the midst of the people of our God. For there shall not
    remain alive for a single day on the earth any man who does this in Israel, for he is abominable and unclean. And let them not say, “Reuben was allowed to live and forgiveness was granted after he lay with his father’s concubine, and she too, though she had a husband, and though Jacob his father was still alive.” For until that time the ordinance and the judgment and the law had not been fully revealed for all; but in your days it is as the law of the times and of the days, and as an everlasting law for the everlasting generations. And for this law there is no completion of days, and no forgiveness for it, except that both of them be uprooted from the midst of the people; on the day on which they did it they shall kill them. And you, Moses, write it down for Israel, that they may keep it and not do according to this word and not sin with a sin unto death, because the Judge, the LORD our God, is one who does not show partiality and does not accept gifts. And tell them this word of the
    ordinance, that they may hear and be on guard and watch themselves and not be destroyed and rooted out from the land. For all who do it on the earth are unclean and defiled and polluted and contaminated before our God. And there is no greater sin than the sexual impurity that they commit on the earth, for Israel is a holy people to the LORD its God, and a people of inheritance, and a priestly people, and a kingdom people, and a planted people; and no such uncleanness is to be seen in the midst of the holy people. And in the third year of this week Jacob and all his sons went and dwelt in the house of Abraham, near Isaac his father and Rebekah his mother. And these are the names of the sons of Jacob: the firstborn, Reuben; and Simeon; and Levi; and Judah; and Issachar; and Zebulun, the sons of Leah; and the sons of Rachel, Joseph and Benjamin; and the sons of Bilhah, Dan and Naphtali; and the sons of Zilpah, Gad and Asher; and Dinah, the only daughter of Leah, the daughter of Jacob. And
    they went and bowed down to Isaac and Rebekah, and when they saw them they blessed Jacob and all his sons. And Isaac rejoiced greatly because he saw the sons of Jacob his younger son[v10][v10][v9], and he blessed them.'
  footnotes:
  - marker: v2
    text: The Ge'ez text literally reads 'he and Leah his wife, on the new moon of the ninth month.' Some scholars emend this to a standard Jubilees date formula ('first year of the third week of the ninth jubilee'), assuming textual corruption, but the translation follows the extant Ge'ez.
    reason: textual_variant
  - marker: v4
    text: The wording shifts between literal handling of a garment and sexual euphemism. 'Edge of her covering' is kept for the immediate action; later verses use the legal euphemism 'uncover his father’s covering.'
    reason: lexical_alternative
  - marker: v9
    text: The verse division is likely artificial here; verse 9 runs directly into the long legal discourse of verse 10.
    reason: segmentation_note
  - marker: v10
    text: The repeated legal formulas echo Levitical and Deuteronomic incest prohibitions, but Jubilees frames them as written on the heavenly tablets and then commanded through Moses.
    reason: cross_reference
  - marker: v10
    text: The final notice 'Jacob his younger son' may reflect Isaac’s perspective in contrast to Esau, rather than Jacob’s age at this moment.
    reason: cultural_note
translation:
  language: ko
  text: '1. 야곱은 가서 믹달-에다르 남쪽에 진을 쳤습니다. 그 뒤 아버지에게 갔습니다.

    2. 이삭과 그의 아내 레아는 아홉째 달 초하루에— 그리고 르우벤은 빌하를 보았습니다.

    3. 라헬의 시녀, 곧 그의 아버지의 첩이 은밀한 곳에서 물로 몸을 씻고 있었고, 그는 그녀를 사랑했습니다. 그는 몸을 숨겼다가 밤에 빌하의 집에 들어가, 그녀가 그녀의 침상에서 홀로 자고 있는 것을 발견했습니다.

    4. 그녀의 집 안에서였습니다. 그는 그녀와 함께 누웠고, 그녀가 깨어 그를 보았는데, 보니 르우벤이 그녀와 함께 침상에 누워 있었습니다. 그녀는 덮개의 가장자리를 젖히고 그를 붙잡아 외쳤으며, 그가 르우벤임을 알아보았습니다.

    5. 그녀는 그 앞에서 부끄러워하여 자기 손을 그의 몸 위에서 거두었습니다. 그는 달아났습니다. 그리고 그녀는 이 일로 슬퍼했습니다.

    6. 그녀는 누구에게도 말하지 않았습니다. 그리고 야곱이 와서 그녀를 찾자, 그녀는 그에게 말했습니다.

    7. “저는 당신에게 정결하지 않습니다. 제가 당신을 떠나 더럽혀졌기 때문입니다. 르우벤이 저를 더럽히고, 밤에 제가 자고 있을 때 저와 동침했습니다. 저는 그가 제 옷자락을 들추고 저와 동침할 때까지 알지 못했습니다.”

    8. 야곱은 르우벤이 빌하와 동침하여 아버지의 옷자락을 들추었기 때문에 그에게 크게 분노하였습니다.

    9. 그리고 야곱은 르우벤이 그 여자를 더럽혔기 때문에 다시는 그 여자에게 가까이하지 않으셨습니다. 자기 아버지의 덮개를 드러내는 사람은 누구나—그런 사람의 행위는 매우 악합니다.

    10. 그의 행위는 매우 악합니다. 그는 주님 앞에서 가증한 자입니다. 그러므로 하늘의 석판에 기록되고 제정되었으니, 사람은 자기 아버지의 아내와 동침해서는 안 되며 자기 아버지의 옷자락을 들추어서도 안 됩니다. 이는 그것이 부정하기 때문입니다. 자기 아버지의 아내와 동침하는 남자와 그 여자도 함께 반드시 죽어야 합니다. 그들이 땅에서 부정한 일을 행했기 때문입니다. 우리 하나님 앞에서, 그분께서 자기 소유로 택하신 왕국의 백성 가운데에는 부정함이 없어야 합니다.


    또 다시 기록되었으니, “자기 아버지의 아내와 동침하여 자기 아버지의 수치를 드러낸 자는 저주를 받을지어다.” 주님의 모든 거룩한 자들은 “그리되기를, 그리되기를”이라고 말해야 합니다. 그리고 당신, 모세는 이스라엘 자손에게 이 말씀을 지키라고 명령하십시오. 이것은 사형의 판결이며 부정한 일이기 때문입니다. 이것을 행한 사람에게는 영원히 속죄가 없으며, 그를 사형에 처하고 죽이고 돌로 쳐 죽이며 우리 하나님의 백성 가운데에서 뿌리째 뽑아 버리는 것 외에는 달리 속죄할 길이 없습니다.


    이스라엘에서 이런 일을 하는 사람은 땅 위에서 하루도 살아남아서는 안 됩니다. 그는 가증하고 부정하기 때문입니다. 그들은 “르우벤은 그의 아버지의 첩과 동침한 뒤에도 살도록 허락받았고 용서도 받았다. 그 여자에게도 남편이 있었고, 그의 아버지 야곱도 그때 아직 살아 있었다”라고 말해서는 안 됩니다. 그때까지는 규례와 판결과 율법이 모든 사람을 위하여 완전히 드러나지 않았기 때문입니다. 그러나 당신의 시대에는 이것이 때와 날들의 율법이며, 영원한 세대를 위한 영원한 율법입니다. 이 율법에는 끝나는 날이 없고 용서도 없습니다. 오직 그 둘을 백성 가운데에서 뿌리째 뽑아 버릴 뿐입니다. 그들이 그것을 행한 날에 그들을 죽여야 합니다.


    그리고 당신, 모세는 이 일을 이스라엘을 위하여 기록하여, 그들이 지키고 이런 일을 행하지 않으며 죽음에 이르는 죄를 짓지 않게 하십시오. 심판자이신 우리 하나님 주님께서는 사람을 편들지 않으시고 뇌물도 받지 않으시는 분이기 때문입니다. 그들에게 이 규례의 말씀을 전하여, 그들이 듣고 경계하며 스스로 삼가서 멸망하고 그 땅에서 뿌리째 뽑히지 않게 하십시오. 땅에서 이것을 행하는 모든 자는 우리 하나님 앞에서 부정하고 더럽혀지고 오염되고 더러운 자들이기 때문입니다.


    이스라엘에서 땅 위에서 저지르는 음행보다 더 큰 죄는 없습니다. 이스라엘은 그 하나님 주님께 속한 거룩한 백성이며, 유업의 백성이며, 제사장 백성이며, 왕국의 백성이며, 심으신 백성이기 때문입니다. 거룩한 백성 가운데에는 그러한 부정함이 보여서는 안 됩니다.


    이 주기의 셋째 해에 야곱과 그의 모든 아들들은 가서 그의 아버지 이삭과 그의 어머니 리브가 가까이에 있는 아브라함의 집에 거하였습니다. 야곱의 아들들의 이름은 이러합니다. 맏아들 르우벤, 시므온, 레위, 유다, 잇사갈, 스불론은 레아의 아들들이며, 라헬의 아들들은 요셉과 베냐민이고, 빌하의 아들들은 단과 납달리이며, 실바의 아들들은 갓과 아셀입니다. 그리고 야곱의 딸이며 레아의 외동딸인 디나가 있습니다. 그들은 가서 이삭과 리브가에게 절하였습니다. 이삭과 리브가는 그들을 보고 야곱과 그의 모든 아들들을 축복했습니다. 이삭은 자기의 더 어린 아들 야곱의 아들들을 보고 크게 기뻐하며 그들을 축복했습니다.'
