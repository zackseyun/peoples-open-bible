  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: lexical
  tier: 1
  from: May he sit enthroned before God forever[a][b]; appoint steadfast love and truth to guard him.
  to: May he dwell before God forever[a]; appoint steadfast love and faithfulness[b] to guard him.
  rationale: “Sit enthroned” makes the royal implication of the context explicit in the translation, though יֵשֵׁב itself can simply mean sit, remain, or dwell. “Dwell” retains the enduring-presence sense without that added specification. In the conventional pair חֶסֶד וֶאֱמֶת, especially as personified protectors, “faithfulness” naturally conveys reliability/fidelity better than the potentially abstract English “truth.” The stated alternatives preserve the lexical range.
