translation:
  language: en
  text: '1. If someone prospers more than you do, do not be upset. Instead, pray for him, that he may reach completion. This will also benefit you.


    2. If he rises to even greater honor, do not envy him. Remember that everyone will die. Instead, offer hymns to the Lord, who gives everyone what is good and beneficial.


    3. Study the Lord’s judgments. Then your purpose will become clear, and you will be at peace.


    4. If someone becomes rich through evil, as my uncle Esau did, do not be jealous. Wait for the limit the Lord has appointed.[a]


    5. If what he gained through evil is taken from him, or if he reorients[r1], he is forgiven. But if he remains unwilling to reorient, he is kept for eternal punishment.[b]


    6. A poor man who is free from envy in everything and pleases the Lord is richer than everyone else. He is not pulled in every direction by people whose concerns are empty.


    7. Therefore, cast hatred out of your souls. Love one another in what you do, what you say, and the attitude of your heart.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “The limit the Lord has appointed” may also mean the Lord’s fixed time or decree.
    reason: lexical_alternative
  - marker: b
    text: Or “age-long punishment.”
    reason: alternative_reading
  - marker: c
    text: The surviving Greek excerpt is cut off after “love one another.” The closing words are supplied to complete the exhortation.
    reason: textual_variant
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: pray for him, that he may be brought to completion
  simplified_phrase: pray for him, that he may reach completion
  preserved_meaning: The prayer seeks a complete outcome for him, not merely further success.
  reasoning_layer_used: lexical and theological decisions for τελειωθῇ
  rationale: The simpler wording preserves the broad completion language without adding maturity as a separate quality.
- pob_phrase: wait for the appointed limit of the Lord
  simplified_phrase: wait for the limit the Lord has appointed
  preserved_meaning: The Lord has fixed the boundary or outcome of wicked prosperity.
  reasoning_layer_used: lexical and theological decisions for ὅρον Κυρίου
  rationale: The reordered phrase is natural English without narrowing the limit to time alone.
- pob_phrase: the distraction of vain people
  simplified_phrase: pulled in every direction by people whose concerns are empty
  preserved_meaning: Futile human concerns burden a person with divided attention.
  reasoning_layer_used: lexical decisions for περισπασμόν and ματαίων ἀνθρώπων
  rationale: The wording preserves the image of being distracted while avoiding the modern sense of conceited people.
interpretive_expansions:
- pob_phrase: what was taken away in evil
  rendering: what he gained through evil
  claim: The unspecified object is something the wicked person acquired through evil.
  evidence:
  - Verse 4 immediately describes someone becoming rich through evil.
  - Verse 5 says the object is taken from that person.
  confidence: moderate
  alternatives_preserved:
  - what he took through evil
  - what was obtained through evil
- pob_phrase: vain people
  rendering: people whose concerns are empty
  claim: The people are characterized by futile concerns that create distraction.
  evidence:
  - The lexical rationale connects the phrase with vain social striving.
  - The immediate contrast treats freedom from this distraction as true wealth.
  confidence: moderate
  alternatives_preserved:
  - people with futile concerns
  - vain people
