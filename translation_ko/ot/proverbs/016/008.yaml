  yaml_path: translation/ot/proverbs/016/008.yaml
  text: Better a little with righteousness than great income without justice.
translation:
  language: ko
  text: 의롭게 얻은 적은 것이 정의 없이 얻은 많은 소득보다 낫습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב מְעַט
  english_pob_choice: Better a little
  chosen_korean: 조금 가진 것이
  alternatives_korean:
  - 적은 것이
  - 조금이
  lexicon: טוֹב
  rationale: 비교 구문을 자연스러운 한국어로 옮기되, 양이 적음을 분명히 하여 원문의 간결한 대비를 살렸습니다.
- source_word: בִּצְדָקָה
  english_pob_choice: with righteousness
  chosen_korean: 의와 함께 있는 것이
  alternatives_korean:
  - 의 가운데 있는 것이
  - 의와 더불어 있는 것이
  lexicon: צְדָקָה
  rationale: 의는 추상 개념이지만, 전치사 בְּ가 동반 상태를 나타내므로 ‘함께 있는’으로 관계를 드러냈습니다.
- source_word: תְּבוּאוֹת
  english_pob_choice: income
  chosen_korean: 많은 소득
  alternatives_korean:
  - 많은 수확
  - 큰 소득
  lexicon: תְּבוּאָה
  rationale: POB의 audit trail이 ‘income’을 채택하므로, 수확의 농업적 뉘앙스보다 경제적 축적의 의미를 살린 ‘소득’을 유지했습니다.
- source_word: בְּלֹא מִשְׁפָּט
  english_pob_choice: without justice
  chosen_korean: 정의 없이
  alternatives_korean:
  - 공의 없이
  - 판단 없이
  lexicon: מִשְׁפָּט
  rationale: 문맥상 법정적 심판보다 공정성과 정당성의 결여를 가리키므로, POB의 ‘justice’를 따라 ‘정의’로 옮겼습니다.
theological_decisions:
- issue: צְדָקָה / מִשְׁפָּט의 윤리적 대비
  chosen_reading: 의와 함께 있는 적은 몫이, 정의 없는 큰 소득보다 낫다는 윤리적 지혜의 대비로 읽었습니다.
  alternative_readings:
  - ‘공의’와 ‘심판’의 법정적 대비
  - ‘의’와 ‘공정’의 사회윤리적 대비
  rationale: 잠언의 격언적 성격상 형식적 도덕 대조가 핵심이며, 문맥을 넘는 교리화 없이 원문의 대비를 선명하게 드러내는 번역이 적절합니다.
  doctrine_reference: '잠언의 지혜 문학: 도덕적·실천적 판단'
- issue: תְּבוּאוֹת의 경제적 함의
  chosen_reading: ‘소득’으로 옮겨 축적된 이익의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘수확’으로 옮겨 농경적 이미지를 강조
  - ‘산출’로 옮겨 보다 직역
  rationale: 히브리어 어휘는 농경적 배경을 가지지만, 한국어 독자는 본문의 대비를 경제적 번영과 연계해 이해하기 쉽기 때문에 POB의 선택을 따르는 것이 문맥에 충실합니다.
  doctrine_reference: 지혜문학의 일반 원리
