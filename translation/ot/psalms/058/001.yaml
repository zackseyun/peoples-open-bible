  rationale: Reordered the clause to reflect the Hebrew more naturally and moved 'sons of man' to the end, matching its vocative function in the verse. Retained 'in silence' for אֵלֶם and preserved the two rhetorical questions.
- timestamp: '2026-08-28T22:32:07Z'
