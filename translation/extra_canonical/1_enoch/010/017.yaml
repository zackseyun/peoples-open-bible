translation:
  text: And now all the righteous will escape and remain alive until they beget a thousand children; and they will complete
    all the days of their youth and their old age in peace.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The verb rendered “escape” can also mean “flee” or “run.” In this judgment context, “escape” emphasizes successful
      deliverance.
    reason: lexical_alternative
  - marker: b
    text: The expression rendered “old age” uses a term associated with rest or sabbath, here contrasted with “youth” as the
      later, resting stage of life.
    reason: lexical_alternative
  - marker: c
    text: The stated thousand offspring is retained as the selected text’s numerical promise, not a demonstrated demographic
      or reproductive claim.
    reason: cultural_note
lexical_decisions:
- source_word: ወይእዜኒ
  chosen: And now
  alternatives:
  - And then
  - And at that time
  rationale: Preserves the conjunctive and temporal force of the Ge'ez expression without importing a stronger chronological
    sequence than the base witness requires.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኵሎሙ፡ ጻድቃን
  chosen: all the righteous
  alternatives:
  - all the righteous ones
  rationale: The adjective functions substantivally and designates the righteous collectively; adding “ones” is unnecessary
    in natural English.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይጐይዩ
  chosen: will escape
  alternatives:
  - will flee
  - will run
  rationale: The verb's basic motion sense can be expressed as running or fleeing, but in this judgment context it denotes
    the righteous getting away from the destruction; “escape” communicates that contextual result without flattening the deliverance
    motif.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወይከውኑ፡ ሕያዋነ
  chosen: and remain alive
  alternatives:
  - and will be alive
  - and will live
  rationale: Literally, the construction is “and they will be living/alive.” “Remain alive” makes clear that survival follows
    escape while retaining the stative construction.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እስከ፡ ይወልዱ፡ ፲፻
  chosen: until they beget a thousand children
  alternatives:
  - until they produce a thousand
  - until they give birth to a thousand
  rationale: The numeral is ten hundreds, hence “a thousand.” The verb concerns procreation; “children” is supplied as the
    natural implicit object in English and “beget” preserves the elevated register without restricting the statement to mothers.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: መዋዕለ፡ ውርዝውቶሙ
  chosen: the days of their youth
  alternatives:
  - the time of their youth
  rationale: “Days” directly represents መዋዕል, while the following noun denotes youth or youthful vigor.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወሰንበተ፡ ዚአሆሙ
  chosen: and their old age
  alternatives:
  - and their time of rest
  - and their sabbath-rest
  rationale: In contrast with “youth,” the term denotes the resting or declining period of life, conventionally understood
    here as old age. The contrast supports the idiomatic rendering, while the underlying rest imagery is documented in the
    footnote.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ይፌጽሙ፡ በሰላም
  chosen: they will complete … in peace
  alternatives:
  - they will fulfill … in peace
  - they will finish … peacefully
  rationale: “Complete” preserves the source's image of living out the full span of one's days, and “in peace” retains the
    nominal expression and eschatological force.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
