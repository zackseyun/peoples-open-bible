theological_decisions:
- issue: 하나님 호칭과 고유 명칭의 처리
  chosen_reading: 본문의 청원적 호칭은 ‘주님’으로 번역하고, 본문 서술적 주어는 ‘그분’으로 처리해 기도문 형식을 유지했습니다.
  alternative_readings:
  - 야훼
  - 주
  - 주 하나님
  rationale: 이 구절은 하나님께 직접 아뢰는 기도이므로 합쇼체의 경외를 유지하되, 학술적 야훼 표기를 본문에 강제로 넣기보다 기도문의 자연스러운 호칭을 우선했습니다.
  doctrine_reference: 기도문 문체와 신적 호칭의 존칭 처리
- issue: ‘my law’와 공동체 율법의 신학적 무게
  chosen_reading: ‘나의 율법’과 ‘주님의 율법’을 모두 구분해 번역하여, 하나님의 권리 주장과 공동체의 토라 신뢰를 함께 드러냈습니다.
  alternative_readings:
  - 율례
  - 교훈
  - 계명
  rationale: 본문은 하나님 자신의 심판과 율법의 권리를 병치하므로, 두 층위를 같은 말로 평탄화하지 않고 ‘율법’으로 일관시켜 신학적 긴장을 보존했습니다.
