  naturalness: ‘주님의 행위가 … 보이게 하시고, 주님의 위엄이 … 보이게 하소서’는 현대 표준 한국어의 기도체로 자연스럽고, 합쇼체 청원 어조를 유지합니다. ‘자손 위에’는 시적 표현으로 자연스럽습니다.
