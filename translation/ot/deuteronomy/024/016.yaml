  meaning: Capital punishment must be imposed only for the offender’s own sin, never for the sin of a parent or child.
  meaning_decisions:
  - source_phrase: אָבוֹת עַל בָּנִים וּבָנִים ... עַל אָבוֹת
    prior_rendering: Fathers ... for sons, and sons ... for fathers
    new_rendering: Parents ... for the sins of their children, nor children for the sins of their parents
    rationale: The family terms express the prohibition against transferring capital liability between generations, not an exemption restricted to males; “sins” makes the understood basis of punishment explicit.
  - source_phrase: אִישׁ בְּחֶטְאוֹ יוּמָתוּ
    prior_rendering: each man shall be put to death for his own sin
    new_rendering: each person may be put to death only for their own sin
    rationale: The clause limits the permissible basis for execution rather than requiring execution for every sin; the distributive expression concerns each individual offender.
  footnote_kinds:
    a: literal_wording
  history_weighed: The earlier decisions correctly restrict the verse to judicial execution rather than every consequence of sin. Although they favored masculine family wording, they also recognized the wider legal principle; I express that scope directly and preserve the literal family terms in a note.
