  from: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
  to: and one of you says to them, “Go in peace; keep warm and eat your fill[a],” but you do not give them what their bodies need, what good is it?
  rationale: I preserved the earlier recognition that the imperatives can be understood in either a middle or passive sense, without deciding how the needy people are expected to obtain help. 'Go in peace' remains because its conventional blessing and its irony both carry the argument.
