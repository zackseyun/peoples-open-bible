id: JHN.4.17
reference: John 4:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν ⸀αὐτῷ· Οὐκ ἔχω ἄνδρα. λέγει αὐτῇ ὁ Ἰησοῦς· Καλῶς εἶπας ὅτι Ἄνδρα οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
  footnotes:
  - marker: a
    text: Or, more literally, “I have no husband.”
    reason: lexical_alternative
  - marker: b
    text: The Greek word ἀνήρ can mean either “man” or “husband”; here the context indicates “husband.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자가 그에게 대답했습니다. 「남편이 없습니다.」 예수께서 그녀에게 말씀하셨습니다. 「남편이 없다고 잘 말했습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἀνήρ는 ‘남자’ 또는 ‘남편’을 뜻할 수 있으나, 여기서는 문맥상 ‘남편’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνδρα / Ἄνδρα
  english_pob_choice: husband
  chosen_korean: 남편
  alternatives_korean:
  - 남자
  lexicon: BDAG
  rationale: 문맥(다음 절의 내용)이 여성의 혼인 상태를 다루므로 ἄνδρα는 '남편'으로 읽히는 것이 자연스럽습니다. 영어 POB와 동일한 결정으로 본문 인용 부분도 일관되게 '남편'으로 번역했습니다.
- source_word: γυνή
  english_pob_choice: woman
  chosen_korean: 그 여자
  alternatives_korean:
  - 여인
  - 여자
  lexicon: BDAG
  rationale: 맥락상 사마리아 여인을 지칭하므로 일반적 성별 지칭어인 '여자'를 선택했습니다. 문맥 흐름상 자연스러운 현대 한국어 어투로 '그 여자'라고 하였습니다.
- source_word: Ἰησοῦς + verb of saying
  english_pob_choice: Jesus said
  chosen_korean: 예수께서 ... 말씀하셨습니다
  alternatives_korean:
  - 예수가 말했다
  - 예수님께서 말씀하셨습니다
  lexicon: N/A (proper name / style)
  rationale: 한국어 성경 관용과 현대 공손체를 따라 예수의 발화에는 존칭형인 '예수께서'와 '말씀하셨습니다'를 사용해 경의(敬意)를 표했습니다. 이는 원문의 의미를 변경하지 않고 현대 한국어 독자에게 적절한 존칭을 제공합니다.
- source_word: Καλῶς εἶπας
  english_pob_choice: You have spoken well
  chosen_korean: 잘 말씀하셨습니다
  alternatives_korean:
  - 잘 말했습니다
  - 옳게 말했습니다
  lexicon: BDAG
  rationale: 그 어구의 평가적 의미(바르게/적절히 말함)를 보존하면서, 예수가 직접 여성의 발화를 평가하는 문맥을 반영해 공손한 존칭 표현 '잘 말씀하셨습니다'로 번역했습니다.
theological_decisions:
- issue: Sense of ἄνδρα in the woman's statement (husband vs. man)
  chosen_reading: 남편
  alternative_readings:
  - 남자
  rationale: 본문 전체(특히 요한복음 4:18)에서 여자의 결혼 이력이 주제로 다뤄지므로 ἄνδρα를 '남편'으로 읽는 것이 원문 의도를 가장 잘 반영합니다. 이는 영어 POB의 판단과 일치합니다.
  doctrine_reference: 원문 우선 번역 원칙; 문맥적 의미 우선
- issue: Rendering of speech about Jesus (use of honorific forms)
  chosen_reading: 예수께서 ... 말씀하셨습니다 (존칭)
  alternative_readings:
  - 예수가 말했다 (비존칭)
  - 예수님께서 말씀하셨습니다 (다른 이름형)
  rationale: 현대 한국어 성경 번역의 관행과 독자 기대에 따라 예수의 발화에는 존칭을 사용하여 경의를 표합니다. 이는 신학적 해석을 추가하지 않으며 단지 언어적 존칭 선택입니다.
  doctrine_reference: 한국어 번역 관습 / 독자 수용성
