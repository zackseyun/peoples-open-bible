revisions:
- timestamp: '2026-04-21T12:34:42Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/isaiah/044/011.json
  category: awkward_english
  tier: 1
  from: Let all of them gather themselves
  to: Let them all gather
  rationale: The current rendering 'gather themselves' is a very literal translation of the Hebrew Hithpael stem (יִתְקַבְּצוּ). While not incorrect, it is slightly stiff and less idiomatic in modern English. Using the intransitive 'gather' (as in 'Let them all gather' or 'Let them all assemble') achieves the same meaning with a more natural flow, which is preferable under an 'optimal-equivalence' philosophy.
- timestamp: '2026-11-09T17:52:22Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: Look[a], all his companions will be put to shame, and the craftsmen are only men. Let them all gather and stand up; they will be terrified[b], they will be put to shame together.
  to: Look, all who stand with the idol[a] will be put to shame; the craftsmen are only human. Let them all gather and take their stand; they will be terrified and put to shame together.
  rationale: I retain the revision’s natural “Let them all gather” and the repeated shame language. The documented human-versus-divine contrast favors “only human,” while the uncertain reference of “his companions” is handled with an alternative note.
