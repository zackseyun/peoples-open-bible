- source_word: בְּעִיר אֱלֹהֵינוּ
  english_pob_choice: in the city of our God
  chosen_korean: 우리 하나님의 도성
  alternatives_korean:
  - 우리 하나님의 성읍
  - 우리 하나님의 도시
  - 우리 하나님의 성
  lexicon: HALOT
  rationale: '''city''를 단순히 도시로 옮기기보다 시편 문맥에서 예루살렘/시온을 가리키는 예배적 표현인 ''도성''으로 옮겨, 지리적 의미와 신학적 뉘앙스를 함께 살렸습니다.'
- source_word: הַר קָדְשׁוֹ
  english_pob_choice: his holy mountain
  chosen_korean: 그의 거룩한 산
  alternatives_korean:
  - 그의 성산
  - 그의 거룩한 산악
  - 그의 신성한 산
  lexicon: HALOT
  rationale: קָדוֹשׁ의 기본 의미를 반영해 '거룩한'을 사용했고, הַר는 시온을 가리키는 직역에 가깝게 '산'으로 옮겼습니다. '성산'은 관용적이지만 원문 대응성이 더 약합니다.
