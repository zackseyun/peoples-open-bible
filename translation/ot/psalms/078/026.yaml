id: PSA.78.26
reference: Psalms 78:26
source:
  edition: WLC
  text: יַסַּ֣ע קָ֭דִים בַּ/שָּׁמָ֑יִם וַ/יְנַהֵ֖ג בְּ/עֻזּ֣/וֹ תֵימָֽן׃
translation:
  text: He set the east wind moving in the sky, and by his strength he drove the south wind.
  philosophy: dynamic
lexical_decisions:
- source_word: יַסַּע
  chosen: set ... moving
  alternatives:
  - caused to set out
  - drove
  - made blow
  lexicon: HALOT
  rationale: Conveys the causative sense of making the wind move.
- source_word: קָדִים
  chosen: east wind
  alternatives:
  - east
  - eastern wind
  lexicon: HALOT
  rationale: In Hebrew this noun commonly denotes the east wind rather than merely the direction 'east.' Given the parallel with תימן as a wind from a direction, 'east wind' is the clearest rendering.
- source_word: בַּשָּׁמַיִם
  chosen: in the sky
  alternatives:
  - in the sky
  - in heaven
  lexicon: HALOT
  rationale: The reference is to the atmospheric sphere in which winds move.
- source_word: וַיְנַהֵג
  chosen: drove
  alternatives:
  - led
  - drove
  lexicon: HALOT
  rationale: Naturally conveys forceful direction of the wind.
- source_word: בְּעֻזּוֹ
  chosen: by his strength
  alternatives:
  - by his power
  - with his might
  lexicon: HALOT
  rationale: עֹז denotes strength, might, or power. 'By his strength' is a direct and readable rendering of the preposition plus noun with suffix, expressing means or agency.
- source_word: תֵימָן
  chosen: the south wind
  alternatives:
  - south
  - southern wind
  lexicon: HALOT
  rationale: Though literally 'south' or 'south region,' in parallel with קדים and in the context of winds bringing quail, it functions as a directional wind term. 'South wind' makes the sense explicit in English.
