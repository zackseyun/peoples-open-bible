  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/037/022.yaml
  text: 'This is the word that the LORD has spoken concerning him: ‘Virgin Daughter Zion despises you and mocks you; Daughter Jerusalem shakes her head behind you.’'
translation:
  language: ko
  text: 이것은 야훼께서 그에 관하여 말씀하신 것입니다. ‘시온의 처녀 딸이 너를 업신여기고 너를 조롱합니다. 예루살렘의 딸이 네 뒤에서 머리를 흔듭니다.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: YHWH
  rationale: 원문 고유명사를 직접 반영하고, POB의 기본 용례인 야훼를 따라 번역했습니다.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  english_pob_choice: Virgin Daughter Zion
  chosen_korean: 시온의 처녀 딸
  alternatives_korean:
  - 처녀 시온 딸
  - 시온 딸 처녀
  lexicon: בְּתוּלָה / בַּת צִיּוֹן
  rationale: 영어 POB의 ‘Virgin Daughter Zion’을 자연스러운 한국어 소유격 구조로 옮기되, 수식 관계를 유지했습니다.
- source_word: בַּת יְרוּשָׁלִָם
  english_pob_choice: Daughter Jerusalem
  chosen_korean: 예루살렘의 딸
  alternatives_korean:
  - 예루살렘 딸
  - 예루살렘의 딸들
  lexicon: בַּת
  rationale: 단수 여성 의인화 표현을 살려, 도시를 딸로 부르는 원문의 비유를 유지했습니다.
- source_word: רֹאשׁ הֵנִיעָה
  english_pob_choice: shakes her head
  chosen_korean: 머리를 흔듭니다
  alternatives_korean:
  - 고개를 젓습니다
  - 머리를 젓습니다
  lexicon: נוע
  rationale: 조롱의 몸짓을 직역에 가깝게 살리되, 현대 한국어에서 자연스러운 관용 표현으로 옮겼습니다.
theological_decisions:
- issue: 예루살렘/시온의 의인화 표현을 어떻게 유지할 것인가
  chosen_reading: 도시를 ‘처녀 딸’과 ‘딸’로 직접 의인화하여 조롱하는 장면을 그대로 유지했습니다.
  alternative_readings:
  - ‘시온의 젊은 여자’로 완화
  - ‘예루살렘 주민들’로 집단화
  rationale: 원문은 도시를 인격화해 앗수르 왕을 향해 조롱하는 시적/예언적 발화이므로, 비유를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 예언서의 시적 의인화 보존
