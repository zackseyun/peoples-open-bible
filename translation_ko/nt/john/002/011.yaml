id: JHN.2.11
reference: John 2:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
  footnotes:
  - marker: a
    text: Or, 'the first of his signs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수님께서 갈릴리 가나에서 이 일을 행하셨습니다. 이것이 예수님의 표적들의 시작[a]이었습니다. 예수님께서는 자신의 영광을 나타내셨고, 제자들은 예수님을 믿었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예수님의 첫 표적’으로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην
  english_pob_choice: this
  chosen_korean: 이 일
  alternatives_korean:
  - 이것
  - 이 표적
  lexicon: BDAG
  rationale: '그리스어 지시대명사(taútēn)가 바로 앞의 행동을 가리키므로, 영어 POB처럼 단순히 ''this''로 처리했습니다. 한국어로는 문맥상 ''이 일''이 자연스럽고 불필요한 해석(예: ''기적'')을 추가하지 않습니다.'
- source_word: ἀρχὴν τῶν σημείων
  english_pob_choice: the beginning of his signs
  chosen_korean: 표적들의 시작
  alternatives_korean:
  - 그의 첫 표적
  - 표적들 중 첫째
  lexicon: BDAG
  rationale: ἀρχή은 '처음'보다 '시작'으로 읽는 편이 원문 어휘를 더 직접적으로 반영합니다. '시작'은 이 표적이 연속된 표적들의 개시임을 보여 주므로 원문 의미를 보존합니다.
- source_word: σημείων
  english_pob_choice: signs
  chosen_korean: 표적
  alternatives_korean:
  - 기적
  lexicon: BDAG
  rationale: 요한복음에서 σημεῖον은 단순한 기적 이상의 '표징/드러냄' 의미를 갖습니다. 따라서 신학적 함의를 살리는 '표적'을 선택했고, 통상적 '기적'은 부차적 대안으로 표기합니다.
- source_word: τὴν δόξαν αὐτοῦ
  english_pob_choice: his glory
  chosen_korean: 그의 영광
  alternatives_korean:
  - 영광스러움
  lexicon: BDAG
  rationale: δόξα는 요한 신학에서 핵심 용어로 '영광'이 표준 번역입니다. 여기서는 예수의 신적 위엄과 드러남을 가리키므로 '그의 영광'으로 처리했습니다.
- source_word: οἱ μαθηταὶ αὐτοῦ
  english_pob_choice: his disciples
  chosen_korean: 그의 제자들
  alternatives_korean:
  - 제자들
  lexicon: BDAG
  rationale: 그리스어의 소유격 αὐτοῦ가 포함되어 있으므로, 한국어에서도 소유 표현을 살려 '그의 제자들'로 번역해 원문의 소속 관계를 보존했습니다.
theological_decisions:
- issue: Johannine σημεῖον terminology
  chosen_reading: 표적(들)으로 번역 — '기적' 대신 '표적'을 우선 사용
  alternative_readings:
  - 기적
  rationale: 요한 복음에서는 σημεῖον이 단순한 기사적 사건을 넘어서 예수의 신적 정체와 영광을 드러내는 표징 역할을 합니다. '표적'은 이러한 신학적 함의를 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; consistency of key Johannine terms.'
- issue: Force of ἀρχὴν τῶν σημείων
  chosen_reading: '''표적들의 시작''으로 번역 — ''첫 표적''(the first of his signs)은 주석적 대안으로 표기'
  alternative_readings:
  - 그의 첫 표적
  - 표적들 중 첫째
  rationale: ἀρχή의 'beginning' 어감을 살려 원문이 말하는 개시적 성격을 보존했습니다. 영어 POB가 제시한 대안처럼 'first'로 번역하는 것도 가능하므로 주석(각주)으로 보존합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source wording where meaningful.'
