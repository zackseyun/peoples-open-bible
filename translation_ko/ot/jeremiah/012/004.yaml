- from: 땅이 언제까지 슬퍼하며, 들의 풀은 언제까지 마르겠습니까? 그 땅에 사는 자들의 악 때문에 들짐승과 새가 쓸려 가고 있습니다. 그들은 "그가 우리의 끝을 보지 못할 것이다"라고 말하기 때문입니다.[a]
  to: 땅이 언제까지 애도하며[a], 모든 들의 풀이 마르겠습니까? 그곳에 사는 자들의 악 때문에 짐승과 새가 사라졌습니다. 이는 그들이 "그가 우리의 끝을 보지 못할 것이다"라고 말하기 때문입니다.
