  chosen_reading: for harm
  alternative_readings:
  - for evil
  - for disaster
  rationale: The context is covenant judgment. Rendering רעה as 'evil' in English could suggest moral evil rather than punitive calamity. 'Harm' preserves the negative judicial sense while avoiding doctrinal misunderstanding not warranted by the Hebrew.
