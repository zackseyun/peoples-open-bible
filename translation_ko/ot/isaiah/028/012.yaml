  yaml_path: translation/ot/isaiah/028/012.yaml
  text: to whom he said, “This is rest; give rest to the weary, and this is repose,” yet they were not willing to hear.
translation:
  language: ko
  text: 그들에게 말씀하셨습니다. 「이것이 안식입니다. 지친 사람을 쉬게 하십시오. 이것이 쉼입니다.」 그러나 그들은 들으려 하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘듣기를 원하지 않았다’라는 표현으로, 단순히 듣지 못한 것이 아니라 들으려 하지 않은 의지적 거부를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: זֹאת הַמְּנוּחָה
  english_pob_choice: This is rest
  chosen_korean: 이것은 안식입니다
  alternatives_korean:
  - 이것은 쉼입니다
  - 이것은 휴식입니다
  lexicon: מְנוּחָה
  rationale: מְנוּחָה는 단순한 휴식보다 더 넓은 ‘안식/쉼’의 개념이므로, 본문 선언의 무게를 살려 ‘안식’으로 옮겼습니다.
- source_word: הָנִיחוּ לֶעָיֵף
  english_pob_choice: give rest to the weary
  chosen_korean: 피곤한 사람에게 안식을 주십시오
  alternatives_korean:
  - 지친 사람에게 쉬게 하십시오
  - 피곤한 사람을 쉬게 하십시오
  lexicon: נוח
  rationale: 동사 형태는 ‘쉬게 하다/안식을 주다’의 사역적 의미이므로, 영어 POB의 결정과 원문의 사역 뉘앙스를 함께 반영해 ‘안식을 주십시오’로 옮겼습니다.
- source_word: וְזֹאת הַמַּרְגֵּעָה
  english_pob_choice: and this is repose
  chosen_korean: 그리고 이것은 평온입니다
  alternatives_korean:
  - 그리고 이것은 평안입니다
  - 그리고 이것은 휴식입니다
  lexicon: מַרְגֵּעָה
  rationale: 두 번째 명사도 정서적·신체적 ‘이완/평온’의 상태를 가리키므로, 중복을 피하면서 본문의 대칭을 살려 ‘평온’으로 옮겼습니다.
- source_word: וְלֹא אָבוּא שְׁמוֹעַ
  english_pob_choice: yet they were not willing to hear
  chosen_korean: 그들은 들으려 하지 않았습니다
  alternatives_korean:
  - 그러나 그들은 듣기를 원하지 않았습니다
  - 그런데도 그들은 듣지 않으려 했습니다
  lexicon: אָבָה + שׁמע
  rationale: 원문은 ‘듣기를 원하지 않다/들으려 하지 않다’의 의지적 거부를 나타내므로, 단순 청각 부재가 아니라 불순종의 의도를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘안식’과 ‘평온’의 병렬
  chosen_reading: 본문의 두 명사는 단순 반복이 아니라, 하나님의 제공하시는 쉼의 상태를 서로 다른 각도에서 강조하는 병렬로 읽었습니다.
  alternative_readings:
  - 두 단어를 모두 ‘쉼’으로 평준화하는 읽기
  - ‘평온’을 단지 감정적 평안으로 축소하는 읽기
  rationale: 원문은 동일한 영역을 가리키되 표현을 달리하여 강조를 누적하므로, 한국어에서도 의미 중첩을 보존하되 어휘를 구분해 번역했습니다.
  doctrine_reference: 이사야 28장 문맥의 언약적 경고와 안식 거부
