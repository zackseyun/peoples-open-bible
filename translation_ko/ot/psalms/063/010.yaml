  - 내 목숨을 찾아
  lexicon: HALOT
  rationale: נֶפֶשׁ은 이 문맥에서 추상적 '영혼'이 아니라 실제 생명/목숨을 가리키므로, 시적이면서도 현대 한국어에서 자연스러운 '내 생명'을 택했습니다.
- source_word: בְּתַחְתִּיּוֹת הָאָרֶץ
  english_pob_choice: into the depths of the earth
  chosen_korean: 땅의 가장 깊은 곳으로 들어갈 것입니다
  alternatives_korean:
  - 땅의 깊은 곳으로 들어갈 것입니다
  - 땅 아래 가장 낮은 곳으로 들어갈 것입니다
  - 땅의 아래쪽 깊은 곳으로 들어갈 것입니다
  lexicon: HALOT
  rationale: 직역의 '아래쪽 깊은 곳'보다 한국어에서 더 자연스러운 '땅의 가장 깊은 곳'이 지하/죽음의 이미지도 잘 보존합니다.
theological_decisions:
- issue: ‘땅의 가장 깊은 곳’의 의미 범위
  chosen_reading: 죽음이나 심판으로 깊이 떨어지는 시적 표현으로 유지했습니다.
  alternative_readings:
  - 지하 세계나 스올에 대한 더 직접적인 언급
