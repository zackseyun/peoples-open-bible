id: 2TI.2.5
reference: 2 Timothy 2:5
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·
translation:
  text: Likewise, an athlete does not receive the victor’s crown unless he competes according to the rules.
  philosophy: dynamic
lexical_decisions:
- source_word: ἀθλῇ
  lemma: ἀθλέω
  chosen: competes as an athlete
  alternatives:
  - competes
  - strives
  - contends in the games
  lexicon: BDAG
  rationale: The verb ἀθλέω evokes athletic contest rather than generic effort. 'Competes as an athlete' preserves the athletic imagery clearly in modern English without sounding archaic.
- source_word: τις
  chosen: anyone
  alternatives:
  - someone
  - a man
  lexicon: BDAG
  rationale: Indefinite pronoun with generic force. 'Anyone' conveys the representative sense naturally in English; the following 'he' preserves the masculine singular discourse pattern.
- source_word: στεφανοῦται
  chosen: is crowned
  alternatives:
  - receives the victor's crown
  - is awarded a crown
  lexicon: BDAG
  rationale: Passive of στεφανόω refers to receiving the victor's wreath/crown. 'Is crowned' is concise and idiomatic, while retaining the metaphor of reward.
- source_word: νομίμως
  chosen: according to the rules
  alternatives:
  - lawfully
  - legitimately
  - according to the regulations
  lexicon: BDAG
  rationale: νομίμως here means in a lawful or proper manner within the contest. 'According to the rules' best communicates the athletic context in contemporary English more clearly than the more abstract 'lawfully'.
- source_word: ἀθλήσῃ
  chosen: he competes
  alternatives:
  - he has competed
  - he strives
  lexicon: BDAG
  rationale: Aorist subjunctive in the conditional clause summarizes the act of competing. Repeating 'competes' preserves the lexical link with ἀθλῇ and keeps the athletic metaphor explicit.
- source_word: καὶ
  chosen: also
  alternatives:
  - even
  - indeed
  lexicon: BDAG
  rationale: καὶ adds another illustrative case alongside the surrounding metaphors. 'Also' reflects the additive force straightforwardly.
- source_word: δὲ
  chosen: And
  alternatives:
  - Now
  - But
  lexicon: BDAG
  rationale: δέ marks a mild transition to another example. 'And' is smooth in English and fits the flow of Paul's sequence of analogies.
