lexical_decisions:
- source_word: συνήχθησαν
  chosen: they gathered
  alternatives:
  - they assembled
  - they came together
  lexicon: LSJ
  rationale: 'Aorist passive/middle of συνάγω here functions intransitively: the group came together for a purpose. ''Gathered'' is natural English and stays close to the Greek.'
- source_word: τοῦ οἰκοδομεῖν
  chosen: to build
  alternatives:
  - for building
  - to rebuild
  lexicon: LSJ
  rationale: The articular infinitive with τοῦ expresses purpose. 'To build' is the most direct rendering; 'rebuild' would import a nuance not explicit in οἰκοδομεῖν itself.
- source_word: ἔπεσεν
  chosen: fell
  alternatives:
  - collapsed
  lexicon: LSJ
  rationale: The verb literally means 'fell.' In context of a wall, 'collapsed' is possible, but 'fell' preserves the source wording more transparently.
- source_word: τοῦ τείχους
  chosen: the wall
  alternatives:
  - the fortification wall
  lexicon: LSJ
  rationale: τείχος is a wall, often defensive. 'Wall' is sufficient here without over-specifying.
- source_word: τοῦ χειμάρρου
  chosen: of the wadi
  alternatives:
  - of the torrent
  - of the brook
  - of the winter-stream
  lexicon: LSJ
  rationale: χείμαρρος denotes a seasonal torrent-bed or ravine. 'Wadi' best captures the geographical sense in this Levantine setting; 'brook' would sound too permanent, and 'torrent' could suggest flowing water rather than the location.
- source_word: τοῦ ἐξ ἀπηλιώτου
  chosen: on the east side
  alternatives:
  - from the east
  - eastern
  lexicon: LSJ
  rationale: ἀπηλιώτης means 'east' or 'east wind.' With ἐξ modifying the wall/wadi phrase, the sense is the eastern side/orientation. 'On the east side' is idiomatic and contextually clear.
- source_word: ἐπεσκεύασεν
  chosen: he repaired
  alternatives:
  - he restored
  - he rebuilt
  lexicon: LSJ
  rationale: The verb means to repair or restore. 'Repaired' fits the immediate context of damaged fortifications and avoids overstating the extent of the work.
- source_word: τὸ καλούμενον Χαφεναθά
  chosen: what is called Chaphenatha
  alternatives:
  - the place called Chaphenatha
  - the so-called Chaphenatha
  lexicon: LSJ
  rationale: The neuter article plus participle can refer to a place or structure known by that name. Because the Greek does not explicitly supply 'place' or 'tower,' 'what is called Chaphenatha' preserves the source's restraint while transliterating the proper name.
