lexical_decisions:
- source_word: דורי ארץ
  chosen: rulers of the land
  alternatives:
  - leaders of the earth
  - governors of the land
  lexicon: HALOT
  rationale: The Hebrew phrase is difficult in isolation, but in context with במלכותם ('in their kingship/kingdoms') and the Greek κυριεύοντες ('ruling, exercising dominion'), it refers to those who govern. 'Of the land' is preferred over 'of the earth' because the line speaks of concrete political rule.
- source_word: במלכותם
  chosen: in their kingdoms
  alternatives:
  - in their reigns
  - by their kingship
  lexicon: HALOT
  rationale: The noun can denote kingship, reign, or kingdom. 'In their kingdoms' fits the political portrait and aligns naturally with the parallel Greek plural βασιλείαις.
- source_word: אנשי שם
  chosen: men renowned
  alternatives:
  - famous men
  - men of name
  lexicon: HALOT
  rationale: Literally 'men of name,' an idiom for renown. 'Men renowned' preserves the idiomatic sense while keeping the masculine form present in the Hebrew.
- source_word: בגבורתם
  chosen: for their might
  alternatives:
  - in their strength
  - for their valor
  lexicon: HALOT
  rationale: The term denotes strength, might, or heroic power. 'Might' best matches the broad sense here and resonates with the Greek ἐν δυνάμει.
- source_word: היועצים
  chosen: counselors
  alternatives:
  - those who give counsel
  - advisers
  lexicon: HALOT
  rationale: A participial/nominal form describing a class of wise leaders. 'Counselors' is concise and natural English.
- source_word: בתבונתם
  chosen: in their understanding
  alternatives:
  - with their insight
  - by their discernment
  lexicon: HALOT
  rationale: תבונה denotes understanding, insight, discernment. 'In their understanding' preserves the Hebrew preposition and parallels the earlier 'in their kingdoms.'
- source_word: וחוזי כל
  chosen: and seers of all things
  alternatives:
  - and those who see everything
  - and visionaries of all
  lexicon: HALOT
  rationale: חוזי are 'seers.' The phrase כל is terse; the Greek has ἀπηγγελκότες ἐν προφητείαις ('those reporting in prophecies'), which supports a prophetic sense. 'Of all things' preserves the breadth of כל without overinterpreting the object.
- source_word: בנבואתם
  chosen: in their prophecy
  alternatives:
  - by their prophecy
  - through their prophetic utterance
  lexicon: HALOT
  rationale: The noun refers to prophecy/prophetic speech. Singular in English is acceptable as a collective abstraction. The phrase is kept close to the Hebrew while remaining readable.
