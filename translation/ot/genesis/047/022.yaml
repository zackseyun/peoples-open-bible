  category: meaning_retranslation
  from: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
  to: The only land Joseph did not buy was the priests’ land, because they received a fixed allowance from Pharaoh and lived on the allowance he gave them. That is why they did not sell their land.
  rationale: The lexical record explicitly distinguishes an assigned provision from a statute and offers “lived on their allowance” as an alternative. That contextual understanding is brought into the main text, making the earlier note unnecessary.
