review_pass:
  verdict: revise
  source_fidelity: 현재 초안은 시편 31:3이 아니라 앞 절인 31:2의 내용(‘귀를 기울이십시오… 피난의 바위… 견고한 집’)을 옮기고 있습니다. 31:3의 히브리어는 하나님이 ‘나의 바위와 요새’이심과, 그분의 이름을 위하여 시인을 인도하고 이끄실 것이라는 진술입니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체를 유지하면서 시편 기도의 경건하고 자연스러운 어조를 살립니다. ‘인도하시고 이끄실 것입니다’는 두 히브리어 동사의 의도적인 병행을 한국어에서도 보존합니다.
  terminology: סַלְעִי는 ‘저의 바위’, מְצוּדָתִי는 ‘저의 요새’로 옮겨 피난처의 은유와 방어적 이미지를 보존했습니다. ‘주님의 이름을 위하여’는 לְמַעַן שִׁמְךָ의 관용구를 해설 없이 충실하게 유지합니다.
  issues:
  - severity: high
    issue: 본문 대조 오류
    rationale: 제출된 번역문과 어휘 결정은 시편 31:2에 해당하며, 검토 대상인 시편 31:3의 히브리어 본문 및 영어 POB 감사 기록과 일치하지 않습니다.
  - severity: medium
    issue: 각주 앵커와 내용이 대상 본문에 맞지 않음
    rationale: 현 각주는 31:2의 ‘귀를 기울이다’, ‘피난의 바위’, ‘견고한 집’을 설명합니다. 31:3에는 כִּי, מְצוּדָה, 그리고 두 인도 동사의 병행에 관한 각주가 필요합니다.
  revised_text: 주님은 저의 바위와 요새이시니[a], 주님의 이름을 위하여 저를 인도하시고 이끄실 것입니다.[c]
  revised_footnotes:
  - marker: a
    text: 또는 ‘주님은 저의 바위와 요새이시기 때문입니다.’ 히브리어 כִּי는 이유를 나타내는 ‘왜냐하면/…이기 때문에’ 또는 설명을 잇는 표현으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요새’는 히브리어 מְצוּדָה의 번역입니다. 또는 ‘산성’이나 ‘견고한 피난처’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘인도하시고 이끄실 것입니다’는 뜻이 가까운 두 히브리어 동사를 병행하여 옮긴 것입니다.
    reason: lexical_alternative
