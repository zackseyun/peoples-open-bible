base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: ko
  text: 그러자 그의 아내가 그에게 말했습니다. “야훼께서 우리를 죽이려 하셨다면 우리 손에서 번제와 곡식제를 받지 않으셨을 것이며, 우리에게 이 모든 것을 보이지도 않으셨을 것이고, 지금 우리에게 이런 일을 알리지도 않으셨을 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: יהוה
  rationale: 본문의 신명 표기는 POB 기본값에 따라 야훼로 옮겨, 원문 고유명사성을 드러냈습니다.
- source_word: עֹלָה
  english_pob_choice: a burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 번제물
  - 불로 드리는 제물
  lexicon: עֹלָה
  rationale: 희생제의 전문용어이므로 한국어 성경에서 통용되는 번제를 유지하되, 원문의 제의 항목을 분명히 했습니다.
- source_word: מִנְחָה
  english_pob_choice: a grain offering
  chosen_korean: 곡식제
  alternatives_korean:
  - 소제
  - 곡식 제물
  lexicon: מִנְחָה
  rationale: 전통적 소제 대신 제물의 재료를 드러내는 곡식제를 택해, 영어 POB의 grain offering과 원문의 제의 구분을 반영했습니다.
- source_word: הִשְׁמִיעַ
  english_pob_choice: announced to us
  chosen_korean: 알리지도 않으셨을
  alternatives_korean:
  - 들려주시지도 않으셨을
  - 알려주시지도 않으셨을
  lexicon: שׁמע (Hiphil)
  rationale: 원문은 단순한 ‘말하다’보다 어떤 소식을 들리게 하다/알리다의 뜻이므로, 문맥상 ‘우리에게 이런 일을 알리지도 않으셨을’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 의도에 대한 부정적 가정문
  chosen_reading: 번제와 곡식제를 받으신 사실, 환상을 보이신 사실, 지금 이 일을 알리신 사실을 근거로 야훼께서 그들을 죽이려 하신 것이 아니라고 논증하는 문장으로 옮겼습니다.
  alternative_readings:
  - ‘죽이려 하셨다면’의 조건을 약화해 ‘죽일 뜻이 있으셨다면’로 완화
  - 제의 수납을 단순한 호의 표시로 축소
  rationale: 본문은 사사기 내 천사 현현 이후의 논증을 그대로 유지하며, 제물 수납과 계시를 하나님의 살리심/호의의 표지로 읽게 합니다.
  doctrine_reference: 사사기 13장 문맥, 신적 계시와 수납의 표지
