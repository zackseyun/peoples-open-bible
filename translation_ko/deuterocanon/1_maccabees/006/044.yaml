  text: And he gave himself to save his people and to win for himself an everlasting name.
translation:
  language: ko
  text: 그리고 그는 자기 백성을 구원하고 자신을 위해 영원한 이름을 얻고자 자신을 바쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν ἑαυτόν
  english_pob_choice: he gave himself
  chosen_korean: 자신을 내주었습니다
  alternatives_korean:
  - 자신을 주었습니다
  - 자신을 바쳤습니다
  lexicon: δίδωμι + ἑαυτόν
  rationale: 단순히 '주다'보다 자기 자신을 내어 맡기는 능동적 헌신을 드러내기 위해 '내주다'를 택했습니다.
- source_word: σῶσαι τὸν λαὸν αὐτοῦ
  english_pob_choice: to save his people
  chosen_korean: 자기 백성을 구원하고
  alternatives_korean:
  - 자기 백성을 살리고
  - 자기 ժողովրդի를 구하고
  lexicon: σῴζω
  rationale: σῴζω의 핵심 의미인 구원/구출을 살려 '구원하다'로 옮겼습니다.
- source_word: περιποιῆσαι αὐτῷ ὄνομα αἰώνιον
  english_pob_choice: to win for himself an everlasting name
  chosen_korean: 자기에게 영원한 이름을 얻기 위해
  alternatives_korean:
  - 자기에게 영원한 이름을 차지하기 위해
  - 자기에게 영원한 명성을 얻기 위해
  lexicon: περιποιέω + ὄνομα αἰώνιος
  rationale: POB의 'win for himself'를 따라 단순 소유보다 성취·획득의 뉘앙스를 살렸고, ὄνομα는 '이름'으로 직역해 문학적 반복을 보존했습니다.
theological_decisions:
- issue: 자기희생적 행동의 표현
  chosen_reading: '''자신을 내주었습니다''로 번역해, 단순한 자기방어가 아니라 백성을 위한 자발적 헌신을 드러냈습니다.'
  alternative_readings:
  - 자신을 주었습니다
  - 자신을 바쳤습니다
  rationale: 본문의 ἑαυτὸν은 목적절과 결합해 자기헌신의 의미를 강화하므로, 한국어에서도 그 긴장을 분명히 해야 합니다.
  doctrine_reference: 희생적 구원 행위의 서술(성경의 구원 서사 일반)
