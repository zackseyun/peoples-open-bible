  text: '1[15]. On the day Isaac, the father of Jacob and Esau, died, the sons of Esau heard that

    2. Isaac had given the rights of the firstborn to Jacob his younger son, and they were exceedingly angry. And they strove with their father, saying, "Why, while we were present, did you give the rights of the firstborn to Jacob, though Jacob is younger, and leave us aside?"

    3. And Esau said to them, "I sold my firstborn birthright to Jacob for a little dish of lentil stew. And on the day my father sent me to hunt and bring him game, that he might eat and bless me, he came by craftiness and brought my father food and drink, and my father blessed him and put me beneath his hand.

    4. Yet now our father has made me swear, me and him, that we should not seek evil, each against his brother,

    5. and that we should remain in love and in peace, a man with his brother, and not disturb our way." But they said to him, "We will not listen to you to make peace with him, for our strength is stronger than his strength, and we are mightier than he. Go up against him, and let us kill him and destroy his sons. But if you will not go

    6. with us, we will harm you also. And now listen to us: let us send to Aram and to Philistia and to Moab and to Ammon, and let us take for ourselves chosen men, eager for battle, and let us go up against him and fight with him and wipe him from the land before he grows strong."

    7. And their father said to them, "Do not go, and do not make war with him, lest you fall before him."

    8. But they said to him, "This is just how you have acted from your youth until this day,

    9. and you bow your neck under his yoke[14]. We will not listen to this word." And they sent to Aram, and to Aduram, the friend of their father, and they hired along with them one thousand seasoned warriors, chosen men.

    10. And there came to them from Moab and from the sons of Ammon, those who were hired, one thousand chosen men; and from Philistia one thousand chosen men, men fit for war; and from Edom and from the Horites one thousand chosen men, seasoned fighters; and from the Kittim strong men fit for war.

    11. And they said to their father, "Go out with them and lead them; and if not,

    12. we will kill you." And he was filled with wrath and indignation when he saw that his sons were forcing him to go before them and lead them to Jacob his brother.

    13. Then he remembered all the evil that had been hidden in his heart against Jacob his brother, and he did not remember the oath that he had sworn to his father and to his mother, that he would not seek any evil against Jacob his brother all his days.

    14. Throughout all this, Jacob did not know that they were coming against him to kill him. And he was mourning for Leah his wife until they came near to the tower with four thousand men, warriors and chosen fighters. And they sent to him honorable men, saying, "Behold, your brother has come against you to fight you, with four hundred men girded with the sword, and they carry shields and weapons of war." For they loved Jacob more than Esau, and they told him that Jacob was a gracious and merciful man, more than Esau. Then Jacob was alarmed when they came near to the tower, and he shut the gates of the tower and stood on the battlements and spoke with his brother Esau and said, "The comfort for which you have come is a fine comfort, to comfort me concerning my wife who has died. Is this the oath that you swore to your father and your mother? You have broken the oath, and at the moment you swore to your father you were condemned." And at that time Esau answered and said to him, "There is
    no righteous oath for the sons of men, nor for the beasts of the earth; for whatever they swear, they scheme one against another with evil, so that each may kill his enemy and foe. And you hate me and my children forever, and there is no observing brotherhood with you. Hear this word that I declare to you: if the boar can change its skin and its bristles become soft like wool, or if horns grow on its head like the horns of a stag or a sheep, then I will keep brotherhood with you. And if the breasts separated from their mother should return and suckle again, then I will be reconciled to you as a brother. And if wolves make peace with lambs so as not to devour or oppress them, and if their hearts are good toward them, then there will be peace in my heart toward you. And if the lion becomes the friend of the ox and is bound together with it under one yoke and plows with it and makes peace with it, then I will make peace with you. And when the raven becomes white like the raza-bird, then
    I will know that I have loved you and will make peace with you. Be destroyed, and may your sons be destroyed, and let there be no peace for you." And when Jacob saw that he was evil in his heart toward him, and with all his soul intended to kill him, and that he came raging like a wild boar rushing upon the spear that pierces and kills it and does not turn back from it, then he said to his own and to his servants that they should attack him and all his companions.

    15. Then Judah spoke to Jacob his father and said to him, "Bend your bow, father, and send out your arrows and cast down the enemy and kill the adversary; and may you have strength, for we will not kill your brother, because he is such, and because he is your kinsman we will give him honor." Then Jacob bent his bow and sent forth an arrow and struck Esau his brother on his right breast and killed him. And again he sent an arrow and struck Adoran the Aramean on the left breast and drove him back and killed him. Then the sons of Jacob and their servants went out from the four sides of the tower. And Judah went out first, and Naphtali and Gad with him, on the south side of the tower, and they killed all whom they found before them, and not one of them escaped. And Levi and Dan and Asher went out on the east side of the tower, and they killed the warriors of Moab and Ammon. And Reuben and Issachar and Zebulun went out on the north side of the tower, and they killed the fighters of Philistia.
    And Simeon and Benjamin and Enoch the son of Reuben went out on the west side of the tower, and they killed of Edom and of the Horites four hundred strong and warlike men. And six hundred fled, and four of Esau’s sons fled with them, and they left their father lying slain, as he had fallen on the hill that is in Adurim. And the sons of Jacob pursued after them as far as Mount Seir. But Jacob buried his brother in the hill that is in Adurim, and he returned to his house[14], and they fed them there.'
  footnotes:
  - marker: '15'
    text: The source row is labeled 'verse 38' in the working corpus, but it continues the same narrative unit and is rendered here as verse 15 of chapter 37.
    reason: segmentation_note
  - marker: '14'
    text: The comparison 'white like the raza-bird' reflects an uncertain bird name in the Ge'ez; some interpreters identify a notably white bird species, but the exact zoological reference is unclear.
    reason: lexical_alternative
  - marker: '14'
    text: The Ge'ez text reads 'four thousand' (፵፻) for the initial approach, but the messengers report 'four hundred' (፬፻). This discrepancy is preserved from the source manuscript.
    reason: textual_variant
translation:
  language: ko
  text: '1. 야곱과 에서의 아버지 이삭이 죽던 날, 에서의 아들들은 …라는 말을 들었습니다.

    2. 이삭이 자신의 더 어린 아들 야곱에게 장자의 권리를 주었고, 그들은 몹시 화가 났습니다. 그들은 아버지와 다투며 말했습니다. 「왜 이삭은 당신이 장자인데도 나이 어린 야곱에게 장자의 권리를 주고 당신을 제쳐 두었습니까?」

    3. “야곱은 더 어립니다. 당신의 아버지는 야곱에게 장자의 권리를 주었고, 당신을 버려두었습니다.” 에서가 그들에게 말했습니다. “내가 장자의 권리를 야곱에게 렌틸콩 스튜 한 그릇에 팔았습니다. 아버지께서 나를 사냥하여 사냥감을 가져오게 하신 날, 아버지께서 잡수시고 나를 축복하시도록 야곱이 꾀를 써서 내 아버지께 음식과 마실 것을 가져왔습니다. 내 아버지께서는 그를 축복하시고 나를 그의 손 아래에 두셨습니다. 이제 우리 아버지께서는 나와 그에게 맹세하게 하셔서, 우리가 서로에게 악을 꾀하지 않도록 하셨습니다.”

    4. 그러나 이제 우리 아버지께서는 나와 그, 곧 우리 둘이 서로에게 악을 꾀하지 않겠다고 맹세하게 하셨습니다.

    5. “그리고 우리가 사랑과 평화 가운데, 각 사람이 자기 형제와 더불어 지내며, 우리의 길들을 망치지 않아야 한다.” 그러나 그들이 그에게 말했습니다. “우리는 그와 화평을 이루라는 당신의 말을 듣지 않겠습니다. 우리의 힘이 그의 힘보다 더 강하고, 우리도 그보다 강합니다. 그에게 맞서 올라가십시오. 그를 죽이고 그의 아들들을 멸하십시오. 그러나 당신이 가지 않으려 한다면

    6. “우리와 함께하면, 우리도 너희를 해치겠습니다. 이제 우리의 말을 들으십시오. 아람과 블레셋과 모압과 암몬에 사람을 보내어, 싸울 의욕이 있는 정예 인원들을 우리가 뽑고, 그에게 맞서 나아가 그와 싸우며, 그가 강성해지기 전에 그를 그 땅에서 뿌리째 없애버립시다.”

    7. 그들의 아버지가 그들에게 말했습니다. “가지 말고, 그와 전쟁을 벌이지 마십시오. 너희가 넘어질까 염려됩니다.”

    8. 그들이 그에게 말했습니다. 「당신은 젊은 시절부터 오늘까지 이렇게 행동해 왔으며, 또 당신은…」

    9. 그리고 그의 멍에 아래에 목을 굽히십시오. 우리는 이 말을 듣지 않겠습니다.” 그리고 그들은 아람에게, 또 아버지의 친구인 아두람에게 사람을 보내어, 그들과 함께 전투를 위한 용사 천 명을 고용했습니다.

    10. 그리고 모압과 암몬 자손 가운데서 고용된 선발된 병사 천 명이 그들에게 왔으며, 블레셋에서 전투에 적합한 선발된 병사 천 명이 왔고, 에돔과 호리인 가운데서 전투를 위해 훈련된 선발된 병사 천 명이 왔으며, 깃딤에서는 전투에 적합한 강한 사람들이 왔습니다.

    11. 그리고 그들은 자기 아버지에게 말했습니다. “그들과 함께 나가서 그들을 이끄십시오. 그리고 그렇지 않으면…”

    12. “우리가 당신을 죽이겠습니다.” 그리고 그는 그의 아들들이 그에게 자기들보다 앞장서서 그의 형제 야곱에게로 자기들을 이끌도록 강요하는 것을 보았을 때, 분노와 격분이 가득 찼습니다.

    13. 그는 앞서 가서 그들을 자기 형제 야곱에게로 인도하였습니다. 그러고 나서 그는 마음속에 자기 형제 야곱을 향해 감추어 두었던 모든 악을 기억하였으며, 자기 아버지와 어머니에게 맹세한 맹세, 곧 자기의 모든 날 동안 야곱을 향해 어떤 악도 꾀하지 않겠다고 한 맹세를 기억하지 않았습니다.

    14. 이 모든 일이 일어나는 동안 야곱은 그들이 자기를 죽이려고 자기에게 오는 줄 알지 못했습니다. 그는 아내 레아를 애도하고 있었는데, 그들이 사천 명, 곧 용사들과 선발된 전사들을 거느리고 망대 가까이 이르렀습니다. 그들은 유력한 사람들을 야곱에게 보내어 이렇게 말하게 했습니다. 「보십시오, 당신의 형이 칼을 찬 사백 명과 함께 당신과 싸우러 왔습니다. 그들은 방패와 전쟁 무기를 들고 있습니다.」 그들은 야곱을 에서보다 더 사랑했기 때문에, 야곱이 에서보다 은혜롭고 자비로운 사람이라고 그에게 말했습니다.


    그들이 망대 가까이 이르자 야곱은 두려워하여 망대의 문들을 닫고 흉벽 위에 서서 그의 형 에서에게 말했습니다. 「당신이 가져온 위로는 참으로 훌륭한 위로로군요. 죽은 내 아내 때문에 나를 위로하려고 오신 것이니까요. 이것이 당신이 당신의 아버지와 어머니에게 맹세한 그 맹세입니까? 더구나 그들이 아직 죽기 전에 당신은 그 맹세를 깨뜨렸습니다. 당신이 당신의 아버지에게 맹세하던 바로 그때 당신은 정죄받았습니다.」


    그때 에서가 대답하여 그에게 말했습니다. 「사람의 자손에게나 땅의 짐승에게나 의로운 맹세란 없습니다. 그들이 무엇을 맹세하든, 서로를 해하려고 악한 꾀를 꾸며 저마다 자기 원수와 대적을 죽이려 하기 때문입니다. 당신은 나와 내 자녀들을 영원히 미워하며, 당신과는 형제의 의리를 지킬 수 없습니다. 내가 당신에게 말하는 이 말을 들으십시오. 멧돼지가 자기 가죽을 바꾸고 그 털이 양털처럼 부드러워지거나, 그 머리에 수사슴이나 양의 뿔 같은 뿔이 돋아난다면, 그때 나는 당신과 형제의 의리를 지키겠습니다. 또 어미에게서 떨어져 나온 젖가슴들이 다시 돌아와 젖을 먹인다면, 그때 나는 형제로서 당신과 화목하겠습니다. 또 늑대들이 어린양들과 평화롭게 지내어 그들을 잡아먹거나 억누르지 않고, 그들을 향한 그들의 마음이 선하다면, 그때 내 마음에는 당신을 향한 평화가 있을 것입니다. 또 사자가 소의 친구가 되어 한 멍에 아래 그것과 함께 매여 밭을 갈고 그것과 화목한다면, 그때 나는 당신과 화목하겠습니다. 까마귀가 라자새처럼 희어지면, 그때 내가 당신을 사랑해 왔음을 알겠고 당신과 화목하겠습니다. 당신은 멸망하고 당신의 자녀들도 멸망할 것이며, 당신에게 평화가 없을 것입니다.」


    야곱은 그가 마음속으로 자기에게 악의를 품고 온 마음을 다해 자기를 죽이려 하며, 자기를 꿰뚫어 죽이고도 물러서지 않는 창을 향해 돌진하는 들멧돼지처럼 날뛰며 오는 것을 보았습니다. 그러자 그는 자기 사람들과 종들에게 그와 그의 모든 동료를 공격하라고 말했습니다.

    15. 유다가 자기 아버지 야곱에게 말했습니다. “아버지, 활을 당기시고 화살을 쏘아 원수를 쓰러뜨리고 대적을 죽이십시오. 힘을 내십시오. 우리는 당신의 형제를 죽이지 않겠습니다. 그는 그러한 이이며 당신의 친족이므로, 우리가 그에게 존경을 보이겠습니다.” 그러자 야곱은 활을 당겨 화살을 쏘아 자기 형 에서의 오른쪽 가슴을 맞혀 죽였습니다. 그리고 다시 화살을 쏘아 아람 사람 아도란의 왼쪽 가슴을 맞혀 그를 물리치고 죽였습니다.


    그러자 야곱의 아들들과 그들의 종들이 망대의 사방에서 나왔습니다. 유다가 먼저 나왔고, 납달리와 갓과 종 오십 명이 그와 함께 망대 남쪽으로 나갔습니다. 그들은 자기들 앞에서 만나는 사람을 모두 죽였고, 한 사람도 피하지 못했습니다. 레위와 단과 아셀은 오십 명과 함께 망대 동쪽으로 나가서 모압과 암몬의 용사들을 죽였습니다. 르우벤과 잇사갈과 스불론은 오십 명과 함께 망대 북쪽으로 나가서 블레셋의 전사들을 죽였습니다. 시므온과 베냐민과 르우벤의 아들 에녹은 오십 명과 함께 망대 서쪽으로 나가서 에돔 사람들과 호리 사람들 가운데 강하고 용맹한 사백 명을 죽였습니다.


    육백 명이 도망했고, 에서의 아들 넷도 그들과 함께 도망했습니다. 그들은 아버지가 아두림에 있는 산에 쓰러져 죽임을 당한 채로 있는 것을 남겨 두었습니다. 야곱의 아들들은 그들을 세일 산까지 뒤쫓았습니다. 그러나 야곱은 아두림에 있는 산에 자기 형을 장사하고 자기 집으로 돌아왔으며, 그들은 거기서 그를 위로했습니다.'
