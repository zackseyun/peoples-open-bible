translation:
  language: en
  text: While the way was still open for them to repent[a], they did not understand and instead treated it with contempt. After death, they must come to understand it while in torment.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for the missed opportunity to live; do not change this works eschatological claims.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: but scorned it
  simplified_phrase: and instead treated it with contempt
  preserved_meaning: They responded to the open opportunity with scorn rather than understanding.
  reasoning_layer_used: POB text and Latin source
  rationale: This states the force of “scorned” in familiar language without weakening it.
- pob_phrase: these must know it after death in torment
  simplified_phrase: After death, they must come to understand it while in torment
  preserved_meaning: The same people will be compelled to recognize after death what they rejected before death.
  reasoning_layer_used: applied grammar revision
  rationale: The revision preserves “they” as the subject and keeps the implied object deliberately unspecified.
translation_notes:
  risk_flags:
  - risk: The object of “understand it” is implicit in the Latin and remains somewhat ambiguous.
    mitigation: The pronoun is retained rather than identifying its referent more narrowly than the POB does.
