id: PSA.125.5
reference: Psalms 125:5
source:
  edition: WLC
  text: וְ/הַ/מַּטִּ֤ים עַֽקַלְקַלּוֹתָ֗/ם יוֹלִיכֵ֣/ם יְ֭הוָה אֶת פֹּעֲלֵ֣י הָ/אָ֑וֶן שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
translation:
  text: But Yahweh will lead away those who turn aside to their crooked ways, along with evildoers. Peace be upon Israel.
  philosophy: dynamic
lexical_decisions:
- source_word: וְהַמַּטִּים
  chosen: But those who turn aside
  alternatives:
  - And those who turn aside
  - But those who bend aside
  lexicon: HALOT
  rationale: The participle identifies those who deviate, and the conjunction marks the contrast with the good and upright in the preceding verse.
- source_word: עַקַלְקַלּוֹתָם
  chosen: to their crooked ways
  alternatives:
  - to their crooked paths
  - to their twisted ways
  lexicon: HALOT
  rationale: The term denotes morally crooked courses; “ways” preserves the established Hebrew metaphor without overconcretizing it.
- source_word: יוֹלִיכֵם
  chosen: will lead them away
  alternatives:
  - will make them go
  - will lead them off
  lexicon: HALOT
  rationale: Hiphil of הלך here has a causative sense, 'cause to go/lead.' 'Lead them away' communicates removal in judgment and fits the collocation with evildoers.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: אֶת
  chosen: with
  alternatives:
  - along with
  lexicon: Hebrew grammar
  rationale: 'Although normally the direct-object marker, here אֶת functions in the associative sense after a verb of leading, indicating accompaniment: the apostates are led away together with evildoers.'
- source_word: פֹּעֲלֵי הָאָוֶן
  chosen: the workers of wickedness
  alternatives:
  - evildoers
  - those who do iniquity
  lexicon: HALOT
  rationale: Literally 'workers of iniquity/wickedness.' The fuller rendering preserves the Hebrew construction and its moral weight, though 'evildoers' is a viable compressed alternative.
- source_word: שָׁלוֹם
  chosen: Peace
  alternatives:
  - Well-being
  - Wholeness
  lexicon: HALOT
  rationale: '''Peace'' is the standard and most natural rendering, while still carrying the broader Hebrew sense of well-being and covenantal flourishing.'
- source_word: עַל יִשְׂרָאֵל
  chosen: be upon Israel
  alternatives:
  - upon Israel
  - on Israel
  lexicon: HALOT
  rationale: The prepositional phrase is rendered as a benedictory wish/pronouncement, idiomatically completed in English as 'Peace be upon Israel.'
- source_word: יוֹלִיכֵם ... אֶת פֹּעֲלֵי הָאָוֶן
  chosen: will lead them away with evildoers
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The Hiphil conveys leading away or causing to go, and אֶת has an associative sense here; the explicit English pronoun avoids a strained fronted-object construction.
