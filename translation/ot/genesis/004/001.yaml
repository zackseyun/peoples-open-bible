id: GEN.4.1
reference: Genesis 4:1
source:
  edition: WLC
  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
translation:
  text: And Adam knew Eve his wife; and she conceived and bore Cain[a], and said, “I have acquired a man from Yahweh[b].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Cain sounds like the Hebrew word for “I have acquired” (qaniti).
    reason: lexical_alternative
  - marker: b
    text: Literally, “with Yahweh”; also understood as “with Yahweh’s help” or, less likely, “I have acquired a man—Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאָדָם
  chosen: And Adam
  alternatives:
  - And the man
  - The man
  - Now the man
  lexicon: HALOT
  rationale: אָדָם here refers specifically to Adam, the male human previously introduced, rather than humankind in general. Rendering the personal referent as 'Adam' makes his identity explicit in English, while 'And' preserves the prefixed conjunction and the verse's connection to the preceding narrative.
- source_word: יָדַע
  chosen: knew
  alternatives:
  - had relations with
  - lay with
  lexicon: HALOT
  rationale: The Hebrew verb literally means 'knew' and is a standard euphemism for sexual relations in this context. Retaining 'knew' preserves the source-text idiom and literary register better than a more explicit paraphrase.
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  chosen: Eve his wife
  alternatives:
  - his wife Eve
  lexicon: HALOT
  rationale: Direct object marker plus name and apposition/relationship term. 'Eve his wife' closely follows Hebrew order while remaining natural English.
- source_word: וַתַּהַר
  chosen: she conceived
  alternatives:
  - and she became pregnant
  lexicon: HALOT
  rationale: Standard rendering of the verb הרה in birth narratives; concise and idiomatic.
- source_word: וַתֵּלֶד אֶת קַיִן
  chosen: and bore Cain
  alternatives:
  - and gave birth to Cain
  lexicon: HALOT
  rationale: '''Bore'' is the conventional and accurate English rendering in genealogical and birth contexts, preserving narrative compactness.'
- source_word: קַיִן
  chosen: Cain
  rationale: Personal name is transliterated per translation philosophy. The following wordplay with קָנִיתִי is preserved by footnote rather than by altering the name.
- source_word: קָנִיתִי
  chosen: I have acquired
  alternatives:
  - I have gotten
  - I have obtained
  - I have created
  lexicon: HALOT
  rationale: The verb קנה commonly means 'acquire/get.' 'Acquired' preserves the lexical connection to Cain's name better than 'gotten,' while avoiding the misleading theological sense 'created' in this context.
- source_word: אִישׁ
  chosen: a man
  alternatives:
  - a male child
  - a son
  lexicon: HALOT
  rationale: The noun normally means 'man.' Although the referent is a newborn male, the Hebrew uses אִישׁ, and the translation should preserve that wording rather than flatten it to 'son' or 'baby boy.' This also aligns with the gender-accurate principle.
- source_word: אֶת יְהוָה
  lemma: אֶת
  chosen: from Yahweh
  alternatives:
  - with Yahweh
  - with the help of Yahweh
  - a man—Yahweh
  lexicon: HALOT
  rationale: The particle אֶת here is notoriously difficult. In this clause, 'from Yahweh' clearly conveys Eve's acknowledgment that the child came from Yahweh while preserving the compact Hebrew construction. The more literal 'with Yahweh' and the less likely reading that identifies the child as Yahweh remain documented as alternatives.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
