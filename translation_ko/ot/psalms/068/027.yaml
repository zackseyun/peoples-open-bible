  text: There is little Benjamin, ruling them; the princes of Judah with their throng; the princes of Zebulun; the princes of Naphtali.[a]
  footnotes:
  - marker: a
    text: The Hebrew word rendered “their throng” is rare and uncertain; it may mean “their company” or “their multitude.”
