    rationale: ‘보라’ 자체는 성경적 문체로 가능하지만, 지정된 현대 formal-polite 문체에서는 ‘보십시오’가 더 일관되고 자연스럽습니다.
  revised_text: 다음 날 그는 예수께서 자기에게로 오시는 것을 보고 말합니다. 「보십시오. 세상의 죄를 없애시는 하나님의 어린양입니다。」
