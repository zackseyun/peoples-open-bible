  text: וַֽ/יְהִי֙ כִּ/רְאוֹתָ֔/ם כִּֽי רַ֥ב הַ/כֶּ֖סֶף בָּֽ/אָר֑וֹן וַ/יַּ֨עַל סֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וְ/הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וַ/יָּצֻ֨רוּ֙ וַ/יִּמְנ֔וּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֥א בֵית יְהוָֽה־־־׃
translation:
  text: Whenever they saw that a large amount of money had accumulated in the chest, the king’s scribe and the high priest would come up, put the money found in the temple of Yahweh into bags[a], and count it.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “bound up,” probably referring to tying the money in bags.
    reason: lexical_alternative
