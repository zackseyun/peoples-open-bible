  yaml_path: translation/extra_canonical/jubilees/038/005.yaml
  text: And Judah went out first, and Naphtali and Gad with him, and fifty servants with him, toward the south side of the tower; and they killed all whom they found before them, and none of them escaped, not even one.
translation:
  language: ko
  text: 유다가 먼저 나갔고, 납달리와 갓과 종 오십 명이 그와 함께 탑의 남쪽으로 나갔습니다. 그들은 자기들 앞에서 만나는 모든 사람을 죽였으며, 그들 가운데서 그들에게서 달아난 사람은 단 한 사람도 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወፅአ፡ ይሁዳ፡ ፍጹመ፡ ወንፍታሌም፡ ወጋድ፡ ምስሌሁ
  english_pob_choice: And Judah went out first, and Naphtali and Gad with him
  chosen_korean: 유다가 그와 함께 있던 납달리와 갓과 함께 나갔습니다
  alternatives_korean:
  - 유다가 먼저 나갔습니다, 그리고 납달리와 갓이 그와 함께 있었습니다
  - 유다가 나가고 납달리와 갓이 그와 함께 갔습니다
  lexicon: Geez ፍጹመ can mark 'first/at the head' here; I rendered the clause naturally as a lead movement while keeping the three named figures together.
  rationale: 문맥상 유다가 선두에 서서 나가는 장면이지만, 본문은 세 인물이 함께 움직이는 구도를 강조하므로 ‘그와 함께 있던 …과 함께 나갔습니다’로 보존했습니다.
- source_word: ወ፶ደቅ፡ ምስሌሁ
  english_pob_choice: and fifty servants with him
  chosen_korean: 그리고 그와 함께 있던 오십 명의 종들
  alternatives_korean:
  - 그리고 그와 함께 있던 오십 명의 노예들
  - 그리고 그와 함께 있던 오십 명의 종들
  lexicon: The Geez term denotes bonded attendants/servants in this context; I used the default '종' because the passage does not require the stronger '노예' carve-out used elsewhere in POB.
  rationale: 직역하면 ‘종들’이 가장 무난하며, 이 문맥은 사회적 예속 상태를 특별히 부각하지 않으므로 ‘노예’보다 중립적인 ‘종들’을 택했습니다.
- source_word: እንተ፡ ገጸ፡ ደቡብ፡ ለማኅፈድ
  english_pob_choice: toward the south side of the tower
  chosen_korean: 성의 남쪽을 향하여
  alternatives_korean:
  - 탑의 남쪽 면을 향하여
  - 요새의 남쪽 쪽으로
  lexicon: The phrase describes direction toward the southern side of a fortification; '성' preserves the defensive stronghold sense without forcing a specific architectural term not explicit in the Geez here.
  rationale: ‘탑’으로 특정하면 원문보다 과도하게 구체화될 수 있어, 방어 거점의 의미를 살린 ‘성’으로 옮겼습니다.
- source_word: ወቀተሉ፡ ኵሎ፡ ዘረከቡ፡ በቅድሜሆሙ፡ ወአልቦ፡ ዘአምለጠ፡ እምኔሆሙ፡ ወአሐዱኒ
  english_pob_choice: and they killed all whom they found before them, and none of them escaped, not even one
  chosen_korean: 그들은 자기들 앞에 있는 모든 사람을 쳐 죽였고, 그들 가운데서 달아난 자는 하나도, 한 사람도 없었습니다
  alternatives_korean:
  - 그들은 자기들 앞에 있는 모든 사람을 죽였고, 그들 가운데서 달아난 자는 아무도 없었습니다
  - 그들은 자기들 앞에 있는 모든 사람을 쳐 죽였고, 그들 중 누구도 도망치지 못했습니다
  lexicon: The double negative 'none… not even one' is strengthened in Korean by pairing '하나도' with '한 사람도' to preserve the emphatic totality of the source.
  rationale: ‘한 사람도’는 원문의 완전한 예외 없음(‘not even one’)을 분명히 드러내기 위한 보강입니다.
theological_decisions:
- issue: 군사적 폭력의 서술을 어떻게 번역할지
  chosen_reading: 본문의 서술적 폭력을 완화하지 않고 ‘쳐 죽였고’로 직접 옮겼습니다.
  alternative_readings:
  - ‘죽였고’로 완화하여 번역
  - ‘살해하였고’로 중립화하여 번역
  rationale: 본문은 전투 장면의 실제적 살상 결과를 서술하므로, 윤문으로 약화하지 않고 원문의 강도를 유지했습니다.
  doctrine_reference: source fidelity / narrative violence
