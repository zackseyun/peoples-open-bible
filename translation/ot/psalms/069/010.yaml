  rationale: The current draft completely omits the Hebrew word נַפְשִׁי (nap̄šî), meaning 'my soul' or 'my self'. This word is crucial as it specifies the deep, internal nature of the psalmist's grief. While the verb 'I wept' implies personal involvement, the explicit addition of 'my soul' provides a theological and emotional weight that is lost in the draft. The proposed rewrite interprets נַפְשִׁי as an adverbial accusative ('in my soul'), a grammatically sound reading that restores this essential component of the text without resorting to adding verbs from parallel passages (e.g., 'humbled').
