  yaml_path: translation/deuterocanon/3_maccabees/003/004.yaml
  text: But because they worshiped God and lived according to his law, they kept themselves separate in matters of food; for this reason some regarded them as hateful.
translation:
  language: ko
  text: 그들은 하나님을 경외하고 그들의 율법에 따라 살았기 때문에, 음식에 관한 일에서는 따로 지냈습니다. 그 때문에 어떤 사람들은 그들을 혐오스럽게 여겼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεβόμενοι δὲ τὸν θεόν
  english_pob_choice: they worshiped God
  chosen_korean: 하나님을 경외하고
  alternatives_korean:
  - 하나님을 예배하고
  - 하나님을 섬기고
  lexicon: σεβομαι
  rationale: 이 동사는 단순한 예배 행위보다 경외와 경배의 태도를 함께 담으므로, 합쇼체 서술에 자연스럽게 맞는 ‘경외하고’로 옮겼습니다.
- source_word: τῷ τούτων νόμῳ
  english_pob_choice: his law
  chosen_korean: 그들의 율법에 따라
  alternatives_korean:
  - 그의 율법에 따라
  - 그 법에 따라
  lexicon: νόμος
  rationale: 본문의 그리스어는 직역하면 ‘그들의 율법’이지만, 영어 POB는 문맥상 하나님을 가리키는 ‘his law’로 정리했습니다. 한국어 본문은 문맥의 주체를 드러내지 않고도 원문의 집단 소속성과 율법 준수를 살리기 위해 ‘그들의 율법’으로 두었습니다.
- source_word: πολιτευόμενοι
  english_pob_choice: lived according to
  chosen_korean: 생활했기 때문에
  alternatives_korean:
  - 행동했기 때문에
  - 시민답게 살았기 때문에
  lexicon: πολιτεύομαι
  rationale: 이 동사는 단순한 생활 습관보다 공동체적 삶의 양식을 가리키지만, 여기서는 뒤의 결과 절을 자연스럽게 연결하는 ‘생활했습니다’가 가장 간결하고 문맥에 맞습니다.
- source_word: χωρισμὸν ἐποίουν ἐπὶ τῷ κατὰ τὰς τροφάς
  english_pob_choice: they kept themselves separate in matters of food
  chosen_korean: 음식 문제에서는 서로를 구별하여 지켰습니다
  alternatives_korean:
  - 음식에 관한 일에서는 분리하여 있었습니다
  - 먹는 일에서는 따로 지냈습니다
  lexicon: χωρισμός + κατὰ τὰς τροφάς
  rationale: ‘음식 문제’는 단순한 식성보다 식품 규례와 식탁 교제를 포함하는 표현이므로, 분리의 행위를 드러내는 ‘구별하여 지켰습니다’로 옮겼습니다.
- source_word: ἀπεχθεῖς ἐφαίνοντο
  english_pob_choice: some regarded them as hateful
  chosen_korean: 어떤 이들은 그들을 미운 사람들로 여겼습니다
  alternatives_korean:
  - 어떤 이들은 그들을 혐오스럽게 보았습니다
  - 어떤 이들은 그들을 가증스럽게 여겼습니다
  lexicon: ἀπεχθής
  rationale: 형용사 ἀπεχθής는 ‘미운, 혐오스러운’의 감정을 나타내므로, 독자에게 즉시 의미가 닿는 ‘미운 사람들’로 풀었습니다.
theological_decisions:
- issue: 본문의 율법 귀속이 하나님께 대한 순종인지, 공동체의 전통 규범인지
  chosen_reading: 본문은 하나님 경외와 연결된 율법 준수를 말하지만, 한국어 본문에서는 원문의 집단 표현을 따라 ‘그들의 율법’으로 유지했습니다.
  alternative_readings:
  - ‘그의 율법’로 명시해 하나님을 직접 지시
  - ‘그들의 법’으로 중립화
  rationale: 영어 POB는 해석을 통해 his law로 정리했으나, 그리스어 본문은 τῶν τούτων νόμῳ라고 되어 있어 소유 대명사 해석에 여지가 있습니다. 본문에는 과도한 신학적 단정 대신 문맥상의 경외-율법 준수 관계를 남겼습니다.
  doctrine_reference: 본문 비평 및 지시 대상 해석
