theological_decisions:
- issue: Meaning of the curse relation to the ground
  chosen_reading: Cain is cursed in relation to or away from the ground, without specifying more than the Hebrew does.
  alternative_readings:
  - Cain is cursed by the ground
  - Cain is banished from the ground
  rationale: The Hebrew מִן can support nuances of source or separation. The translation preserves the tension rather than resolving it into either agricultural infertility alone or exile alone.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
revisions:
- timestamp: '2026-04-21T00:17:08Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/genesis/004/011.json
  category: awkward_english
  tier: 1
  from: from the ground
  to: by the ground
  rationale: The Hebrew preposition 'min' can mean 'from,' 'by,' or 'away from.' While 'from the ground' is a traditional rendering that preserves ambiguity (as noted in the footnote), it is slightly awkward in English. Given the immediate context personifying the ground as an active agent ('which has opened its mouth'), an instrumental reading ('by the ground') is contextually strong and provides a clearer, more forceful statement. The effect of this curse (separation from the ground's productivity) is then detailed in the following verse.
