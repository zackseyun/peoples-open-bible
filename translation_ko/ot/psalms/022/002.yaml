base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God, I cry out by day, but you do not answer, and by night, but there is no silence for me.[a]
  footnotes:
  - marker: a
    text: Or “I have no rest.” The Hebrew says, “there is no silence for me.”
