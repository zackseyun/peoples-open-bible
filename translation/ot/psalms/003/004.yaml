theological_decisions:
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Aspect/tense nuance of וַיַּעֲנֵנִי in poetry
  chosen_reading: present 'he answers me'
  alternative_readings:
  - past 'he answered me'
  rationale: Hebrew poetic verbal forms can be rendered flexibly in English. The present tense preserves the psalm's immediacy and ongoing confidence in divine response, but the past is a legitimate formal alternative and is preserved in a footnote rather than being dogmatically resolved.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
