  text: Ἔτι μοι, φημί, κύριε, δήλωσον. Τί, φησίν, ἐπιζητεῖς; Διατί, φημί, κύριε, οἱ λίθοι ἐκ τοῦ βυθοῦ
    ἀνέβησαν καὶ εἰς τὴν οἰκοδομὴν ἐτέθησαν, πεφορηκότες τὰ πνεύματα ταῦτα; 2. Ἀνάγκην, φησίν, εἶχον δι᾿
    ὕδατος ἀναβῆναι, ἵνα ζωοποιηθῶσιν· οὐκ ἠδύναντο γὰρ ἄλλως εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ Θεοῦ, εἰ
    μὴ τὴν νέκρωσιν ἀπέθεντο τῆς ζωῆς αὐτῶν [τῆς προτέρας]. 3. ἔλαβον οὖν καὶ οὗτοι οἱ κεκοιμημένοι τὴν
    σφραγῖδα τοῦ υἱοῦ τοῦ Θεοῦ | καὶ εἰσῆλθον εἰς τὴν βασιλείαν τοῦ Θεοῦ· | πρὶν γάρ, φησί, φορέσαι τὸν
    ἄνθρωπον τὸ ὄνομα [τοῦ υἱοῦ] τοῦ Θεοῦ, νεκρός ἐστιν· ὅταν δὲ λάβῃ τὴν σφραγῖδα, ἀποτίθεται τὴν νέκρωσιν
    καὶ ἀναλαμβάνει τὴν ζωήν. 4. ἡ σφραγὶς οὖν τὸ ὕδωρ ἐστίν· εἰς τὸ ὕδωρ οὖν καταβαίνουσι νεκροί, καὶ
    ἀναβαίνουσι ζῶντες. κἀκείνοις οὖν ἐκηρύχθη ἡ σφραγὶς αὕτη, καὶ ἐχρήσαντο αὐτῇ, ἵνα εἰσέλθωσιν εἰς
    τὴν βασιλείαν τοῦ Θεοῦ. 5. Διατί, φημί, κύριε, καὶ οἱ τεσσαράκοντα λίθοι μετ᾿ αὐτῶν ἀνέβησαν ἐκ τοῦ
    βυθοῦ, ἤδη ἐσχηκότες τὴν σφραγῖδα; Ὅτι, φησίν, οὗτοι οἱ ἀπόστολοι καὶ οἱ διδάσκαλοι οἱ κηρύξαντες
    τὸ ὄνομα τοῦ υἱοῦ τοῦ Θεοῦ, κοιμηθέντες ἐν δυνάμει καὶ πίστει τοῦ υἱοῦ τοῦ Θεοῦ ἐκήρυξαν καὶ τοῖς
    προκεκοιμημένοις, καὶ αὐτοὶ ἔδωκαν αὐτοῖς τὴν σφραγῖδα τοῦ κηρύγματος. 6. κατέβησαν οὖν μετ᾿ αὐτῶν
    εἰς τὸ ὕδωρ, καὶ πάλιν ἀνέβησαν. | ἀλλ᾿ οὗτοι ζῶντες κατέβησαν, [καὶ πάλιν ζῶντες ἀνέβησαν]· ἐκεῖνοι
    δὲ οἱ προκεκοιμημένοι νεκροὶ κατέβησαν, ζῶντες δὲ ἀνέβησαν. | 7. διὰ τούτων οὖν ἐζωοποιήθησαν καὶ
    ἐπέγνωσαν τὸ ὄνομα τοῦ υἱοῦ τοῦ Θεοῦ. διὰ τοῦτο καὶ συνανέβησαν μετ᾿ αὐτῶν καὶ συνηρμόσθησαν εἰς τὴν
    οἰκοδομὴν τοῦ πύργου, καὶ ἀλατόμητοι συνῳκοδομήθησαν· ἐν δικαιοσύνῃ γὰρ ἐκοιμήθησαν καὶ ἐν μεγάλῃ
    ἁγνείᾳ· μόνον δὲ τὴν σφραγῖδα ταύτην οὐκ εἶχον. ἔχεις οὖν καὶ τὴν τούτων ἐπίλυσιν. Ἔχω, φημί, κύριε.
