  from: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
  to: He is the one you praise[a], and he is your God, who has done for you these great and awe-inspiring things that you have seen with your own eyes.
  rationale: The recorded discussion recognizes that “your praise” can name either the object or the ground of praise. I make the contextual reading explicit without suppressing that ambiguity, and retain “awe-inspiring” and the repeated “he is.”
