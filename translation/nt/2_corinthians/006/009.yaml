id: 2CO.6.9
reference: 2 Corinthians 6:9
source:
  edition: SBLGNT
  text: ὡς ἀγνοούμενοι καὶ ἐπιγινωσκόμενοι, ὡς ἀποθνῄσκοντες καὶ ἰδοὺ ζῶμεν, ὡς παιδευόμενοι καὶ μὴ θανατούμενοι,
translation:
  text: as unknown, yet well known[a]; as dying, yet we are still alive; as disciplined, yet not put to death[b];
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or 'unrecognized, yet recognized'; recognition need not mean public fame.
    reason: alternative_reading
  - marker: b
    text: Echoes Psalm 118:18.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  chosen: as
  alternatives:
  - like
  - as though
  lexicon: BDAG
  rationale: Introduces each paradoxical characterization in Paul's catalog. 'As' preserves the repeated rhetorical structure more naturally and formally than paraphrastic alternatives.
- source_word: ἀγνοούμενοι
  lemma: ἀγνοέω
  chosen: unknown
  alternatives:
  - ignored
  - not recognized
  lexicon: BDAG
  rationale: Passive participle from ἀγνοέω here denotes being unknown or unrecognized by others. 'Unknown' is concise and idiomatic in the paradox pair with 'well known.'
- source_word: ἐπιγινωσκόμενοι
  chosen: well known
  alternatives:
  - fully known
  - recognized
  lexicon: BDAG
  rationale: The compound verb can suggest fuller or clearer recognition. 'Well known' gives natural English and preserves the contrast with 'unknown' without overloading the phrase with epistemological nuance.
- source_word: ἀποθνῄσκοντες
  chosen: dying
  alternatives:
  - about to die
  - being put to death
  lexicon: BDAG
  rationale: Present participle conveys an ongoing condition or appearance of being at death's edge. 'Dying' preserves the terseness and paradox with 'we live.' 'Being put to death' would overlap too much with the later θανατούμενοι.
- source_word: ἰδοὺ
  chosen: behold
  alternatives:
  - look
  - see
  lexicon: BDAG
  rationale: Retains the abrupt, attention-calling force of the particle in a way suitable to elevated but still readable English. 'Look' would sound too colloquial here.
- source_word: ζῶμεν
  chosen: we live
  alternatives:
  - we are alive
  lexicon: BDAG
  rationale: 'Simple present best reflects the Greek and keeps the sharp paradox: ''dying, and behold, we live.'''
- source_word: παιδευόμενοι
  chosen: disciplined
  alternatives:
  - being trained
  - being chastened
  - being corrected
  lexicon: BDAG
  rationale: παιδεύω can denote formative discipline or corrective chastening. In this suffering context, 'disciplined' preserves both senses without importing excessive harshness.
- source_word: μὴ θανατούμενοι
  chosen: not put to death
  alternatives:
  - not killed
  - not being put to death
  lexicon: BDAG
  rationale: Passive construction is preserved. 'Not put to death' is slightly more formal and matches the contrast with divine or providential preservation better than the blunter 'not killed.'
