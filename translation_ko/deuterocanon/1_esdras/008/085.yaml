  source_fidelity: 그리스어의 핵심 어휘인 κουφίσας(죄를 가볍게 함), ῥίζαν(뿌리), παραβῆναι τὸν νόμον(율법을 범함), ἐπιμιγῆναι(섞임)는 대체로 반영되었습니다. 다만 초안의 ‘섞이므로 ... 범하였습니다’는 섞임을 단순 원인으로 만들고, ‘다시 돌아서서 ... 범하였습니다’는 원문의 ‘율법을 범하기 위해/범하는 쪽으로 다시 돌아갔다’라는 부정사 구문의 지향성을 다소 흐립니다.
