id: JOB.35.3
reference: Job 35:3
source:
  edition: WLC
  text: כִּֽי תֹ֭אמַר מַה יִּסְכָּן לָ֑/ךְ מָֽה אֹ֝עִ֗יל מֵֽ/חַטָּאתִֽ/י־־־־׃
translation:
  text: For you say, “What benefit is my righteousness to you[a]? What more do I gain than by sinning?”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, taking the first question as self-address, “What benefit does righteousness bring me?”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  - That
  lexicon: HALOT
  rationale: Introduces Elihu's explanation of Job's claim; 'For' fits the argumentative flow into the quotation.
- source_word: תֹאמַר
  chosen: you say
  alternatives:
  - you are saying
  - you would say
  lexicon: HALOT
  rationale: Qal imperfect 2ms, addressed to Job; simple present in English works naturally in reported accusation.
- source_word: מַה
  chosen: What
  alternatives:
  - How
  - Why
  lexicon: HALOT
  rationale: Interrogative pronoun introducing the first rhetorical question.
- source_word: יִסְכָּן לָךְ
  chosen: benefit is it to you
  alternatives:
  - does it benefit you
  - is it advantageous for you
  lexicon: HALOT
  rationale: סכן denotes benefit or advantage, and the second-person suffix is retained without adding an interpretive referent.
- source_word: מָה
  chosen: What
  alternatives:
  - How much
  - Why
  lexicon: HALOT
  rationale: Second interrogative, parallel to the first.
- source_word: אֹעִיל
  chosen: do I gain
  alternatives:
  - do I gain
  - am I benefited
  lexicon: HALOT
  rationale: The Hiphil of יעל can express profit or gain; this is idiomatic in the rhetorical question.
- source_word: מֵחַטָּאתִי
  chosen: more than by sinning
  alternatives:
  - more than from my sin
  - apart from my sin
  - from my sinning
  lexicon: HALOT
  rationale: The preposition מִן is comparative here. Rendering the noun as “sinning” conveys the contrast without implying a specified individual sinful act.
