  validation: no_reference
translation:
  text: And there is a friend who turns against you and will expose a quarrel to your disgrace[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, 'will expose your shameful quarrel'; the Greek can describe the quarrel itself as shameful rather than emphasize the disgrace caused by exposing it.
    reason: alternative_reading
lexical_decisions:
- source_word: φίλος
  chosen: friend
  alternatives:
  - companion
  lexicon: LSJ
  rationale: The ordinary sense is a personal friend or companion. 'Friend' best matches the relational force in context.
- source_word: μεταβαλλόμενος
  chosen: changes into
  alternatives:
  - turns into
  - is altered into
  - becomes
  lexicon: LSJ
  rationale: The participle conveys change of state. 'Changes into' preserves the processive sense without over-paraphrase.
- source_word: εἰς ἔχθραν
  chosen: into enmity
  alternatives:
  - into hostility
  - into hatred
  - into an enemy
  lexicon: LSJ
  rationale: The Greek noun is abstract ('enmity/hostility'), not the personal noun 'enemy.' 'Into enmity' keeps the source form, though English is slightly less idiomatic.
- source_word: μάχην
  chosen: a quarrel
  alternatives:
  - a fight
  - strife
  - contention
  lexicon: LSJ
  rationale: In wisdom context this likely refers to a dispute or conflict rather than literal combat. 'Quarrel' is natural modern English and fits the social setting.
- source_word: ὀνειδισμοῦ
  chosen: to your disgrace
  alternatives:
  - of your reproach
  - for your shame
  - as a reproach against you
  lexicon: LSJ
  rationale: The genitive can denote the reproachful or shameful character of the exposed quarrel. 'To your disgrace' communicates the result in idiomatic English while preserving the dishonor motif.
- source_word: ἀποκαλύψει
  chosen: he will expose
  alternatives:
  - he will reveal
  - he will uncover
  - he will disclose
  lexicon: LSJ
  rationale: The verb means to uncover or reveal. 'Expose' fits the hostile context, suggesting disclosure that brings shame.
