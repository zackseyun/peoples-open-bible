  from: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
  to: You did these things, and I kept silent; you thought that I was altogether like you.[a] I will rebuke you and lay it out before your eyes.[b]
  rationale: 'The proposed removal of the supplied object in the final clause is warranted: ערך has no expressed object, and “lay it out” leaves its contextual referent open. The proposed “would be just like you,” however, unnecessarily selects one temporal construal. In this retrospective accusation, “you thought that I was altogether like you” is a natural rendering that retains the Hebrew emphasis and avoids imposing a future-oriented meaning. The notes should be attached to their respective clauses.'
