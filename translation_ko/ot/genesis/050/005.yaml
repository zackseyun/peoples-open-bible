review_pass:
  verdict: revise
  source_fidelity: 원문의 핵심 이동·매장 지시를 대체로 반영했으나, שָׁמָּה(‘그곳에’)가 번역문에서 빠져 있습니다. 또한 직접 인용 안의 명령은 야곱이 요셉에게 하는 말이므로 존대 명령형 ‘장사하십시오’보다 ‘장사하여라’가 화자·청자 관계와 원문 명령형에 더 충실합니다. נָא의 간청은 ‘부디’로 명시하는 것이 적절합니다.
  naturalness: ‘나에게 맹세하게 하면서’는 이해되지만 ‘나에게 맹세시키시며’가 현대 한국어에서 더 자연스럽습니다. 인용문의 ‘내가 … 판 내 무덤’ 및 ‘그곳에’를 명시하면 지시 대상과 문장 연결이 분명해집니다.
  terminology: ‘장사하다’는 매장 행위를 가리키는 성경적·현대적 표현으로 유지할 수 있습니다. ‘가나안 땅’, ‘무덤’, ‘맹세’도 적절합니다.
