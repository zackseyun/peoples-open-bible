  yaml_path: translation/ot/psalms/054/005.yaml
  text: Behold, God is my helper; the Lord is among those who sustain my life[a][b].
  footnotes:
  - marker: a
    text: Or 'foreigners have risen against me.' The Hebrew זָרִים can denote those who are alien, estranged, or foreign.
    reason: lexical_alternative
  - marker: b
    text: Or 'violent men' for 'ruthless men.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'seek my soul'; here 'soul' refers to the psalmist's life.
    reason: lexical_alternative
translation:
  language: ko
  text: “보라, 하나님은 나를 돕는 분이시며, 주님은 내 생명을 붙드는 이들 가운데 계십니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘주님은 내 생명을 붙드는 이들 가운데 계십니다’라고 합니다. 이 구문은 통사적으로 어려워, ‘주님께서 내 생명을 붙드십니다’ 또는 ‘주님은 내 생명을 붙드는 분이십니다’로 이해하기도 합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 네페시(נַפְשִׁי)는 문맥에 따라 ‘내 생명’, ‘나 자신’, 또는 ‘내 영혼’을 뜻할 수 있습니다.
    reason: lexical_alternative
