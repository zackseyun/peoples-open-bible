id: PSA.36.3
reference: Psalms 36:3
source:
  edition: WLC
  text: דִּבְרֵי פִ֭י/ו אָ֣וֶן וּ/מִרְמָ֑ה חָדַ֖ל לְ/הַשְׂכִּ֣יל לְ/הֵיטִֽיב־׃
translation:
  text: The words of his mouth are wickedness and deceit; he has stopped acting wisely and doing good.
  philosophy: dynamic
lexical_decisions:
- source_word: דִּבְרֵי
  chosen: The words of
  alternatives:
  - The speech of
  - The utterances of
  lexicon: HALOT
  rationale: Construct plural of דבר, introducing the content/character of what proceeds from his mouth. 'The words of' is natural English and preserves the plural sense.
- source_word: פִיו
  chosen: his mouth
  alternatives:
  - his speech
  lexicon: HALOT
  rationale: Literal rendering of פה with 3ms suffix. 'Mouth' preserves the concrete Hebrew idiom rather than abstracting immediately to 'speech.'
- source_word: אָוֶן
  chosen: wickedness
  alternatives:
  - trouble
  - iniquity
  - evil
  lexicon: HALOT
  rationale: אָוֶן can denote trouble, evil, or iniquity; here, paired with 'deceit' and describing his speech, it points to morally corrupt speech. 'Wickedness' communicates the ethical force clearly in modern English.
- source_word: וּמִרְמָה
  chosen: and deceit
  alternatives:
  - and treachery
  - and fraud
  lexicon: HALOT
  rationale: מִרְמָה commonly denotes deceit or treachery. 'Deceit' fits the speech context best and pairs naturally with 'wickedness.'
- source_word: חָדַל
  chosen: has stopped
  alternatives:
  - he stops
  - he has failed
  lexicon: HALOT
  rationale: Accurately expresses cessation in natural English with coordinated complements.
- source_word: לְהַשְׂכִּיל
  chosen: acting wisely
  alternatives:
  - to act wisely
  - to have insight
  lexicon: HALOT
  rationale: Captures the practical/prudent sense of the Hiphil infinitive in this context.
- source_word: לְהֵיטִיב
  chosen: doing good
  alternatives:
  - to do good
  - to act well
  lexicon: HALOT
  rationale: Faithfully renders the second infinitive as morally beneficial action.
