id: PSA.8.5
reference: Psalms 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מָֽה אֱנ֥וֹשׁ כִּֽי תִזְכְּרֶ֑/נּוּ וּ/בֶן אָ֝דָ֗ם כִּ֣י תִפְקְדֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/005.yaml
  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
  footnotes:
  - marker: a
    text: Or 'mortal man' for 'man'; the Hebrew אֱנוֹשׁ often highlights human frailty.
    reason: lexical_alternative
  - marker: b
    text: '''Son of man'' here is a Hebrew idiom for a human being. Later biblical usage can give the phrase messianic significance, but in this psalm it functions as a poetic parallel for humanity.'
    reason: cross_reference
  - marker: c
    text: Or 'care for him,' 'visit him,' or 'take notice of him' for 'attend to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 그를 하나님보다 조금 못하게 하시고, 영광과 존귀로 그에게 관을 씌우셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 존재들보다’. 칠십인역은 ‘천사들보다’로 읽으며, 이 번역은 히브리서 2:7에 반영되어 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱנוֹשׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 죽을 사람
  - 인간
  - 인류
  lexicon: HALOT
  rationale: אֱנוֹשׁ는 인간의 연약함을 띠는 대표적 인간을 가리키므로, 현대 한국어에서는 성별을 과도하게 부각하지 않으면서도 자연스러운 대표어인 ‘사람’으로 옮겼습니다.
- source_word: תִזְכְּרֶנּוּ
  english_pob_choice: you remember him
  chosen_korean: 그를 기억하십니까
  alternatives_korean:
  - 그를 마음에 두십니까
  - 그를 생각하십니까
  lexicon: HALOT
  rationale: זכר의 기본 의미를 직접 살려 ‘기억하다’로 옮기되, 하나님께 대한 높임말 형태를 사용해 합쇼체 문맥을 유지했습니다.
- source_word: וּבֶן אָדָם
  english_pob_choice: and the son of man
  chosen_korean: 또 사람의 아들
  alternatives_korean:
  - 또 인자
  - 또 사람의 자손
  lexicon: HALOT
  rationale: 시적 평행법과 히브리어 관용구를 살려 직역에 가깝게 유지했습니다. 여기서는 메시아 칭호가 아니라 인간 일반을 가리키는 표현이므로, 문맥에 맞게 소문자/일반적 의미를 보존했습니다.
- source_word: תִפְקְדֶנּוּ
  english_pob_choice: you attend to him
  chosen_korean: 그를 돌보십니까
  alternatives_korean:
  - 그를 살피십니까
  - 그를 방문하십니까
  - 그를 주목하십니까
  lexicon: HALOT
  rationale: פקד는 ‘돌보다/살피다/찾아보다’ 등 넓은 의미가 있으나, 이 시편의 문맥에서는 하나님의 적극적 관심을 자연스럽게 드러내는 ‘돌보다’가 가장 적절합니다.
theological_decisions:
- issue: 인간을 가리키는 남성 단수 표현의 처리
  chosen_reading: ‘사람’과 ‘사람의 아들’로 남성 단수의 대표성을 유지했습니다.
  alternative_readings:
  - 인간
  - 인류
  - 사람들
  rationale: 히브리어는 남성 단수 명사를 사용해 대표적 인간을 말하므로, 이를 평면화하지 않고 시적 대구를 보존하는 번역을 택했습니다.
  doctrine_reference: 'Translation philosophy §4; Contested terms: אֱנוֹשׁ / אָדָם'
- issue: ‘사람의 아들’의 메시아적 처리
  chosen_reading: 본문에서는 메시아 칭호로 표시하지 않고 인간 일반을 가리키는 관용구로 옮겼습니다.
  alternative_readings:
  - 인자
  - 사람의 아들(메시아적 함의 강조)
  rationale: 이 절의 즉각적 문맥은 인간의 미미함을 말하는 시적 질문이므로, 후대의 그리스도론적 적용을 본문 자체에 앞당기지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
