translation:
  text: Simyaza, who was their leader,[a] said to them, “I fear that you may not be willing for this deed to be
    done, and that I alone will have to pay for this great sin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected word for their leader belongs to a word family that also denotes an envoy or messenger; Dillmann1865
      column49 attests its princely or leadership use. The verb at the close concerns paying or bearing the penalty
      for a sin, not enjoying a reward (columns1378–1379). “Simyaza” follows this verse’s spelling and is not silently
      conformed to the different printed name-form in 6:7.
