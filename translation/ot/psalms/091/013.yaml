  chosen_reading: serpent
  alternative_readings:
  - dragon
  rationale: Psalm 91:13 lists dangerous creatures the protected person overcomes. A zoological 'serpent' best fits the land-creature context for תַנִּין, while the first snake is rendered generically because its exact venomous species is uncertain. The traditional 'dragon' alternative remains in the note.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
