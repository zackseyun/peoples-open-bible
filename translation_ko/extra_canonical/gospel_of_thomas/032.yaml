  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ⲉⲩⲕⲱⲧ/ⲉⲥⲧⲁϫⲣⲏⲩ는 진행 중인 ‘세워지고’라기보다 완성된 상태를 나타내므로 ‘세워져 견고한’이 더 정확합니다. 마지막 절의 미래 가능 불능은 ‘숨겨질 수도 없을 것입니다’로 드러내는 편이 안전합니다.
  naturalness: ‘요새화된 도성’도 가능하지만 현대 한국어에서는 ‘세워져 견고한 도성’이 원문의 ‘견고하게 된’ 상태를 자연스럽고 과도한 군사화 없이 전달합니다. 각주 a의 ‘꼭대기 위에’는 한국어로 다소 겹치므로 ‘꼭대기에’로 다듬었습니다.
  terminology: ‘예수’, ‘도성’, ‘무너지다’는 적절합니다. ⲧⲁϫⲣⲟ는 ‘요새화된’으로 한정하기보다 ‘견고한’으로 옮겨 ‘굳게 되다/견고하다’라는 어휘 범위를 보존합니다.
