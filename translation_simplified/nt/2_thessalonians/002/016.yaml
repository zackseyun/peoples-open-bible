  preserved_meaning: The encouragement God gives has an enduring, eternal scope.
  reasoning_layer_used: Lexical decisions for παράκλησιν and αἰωνίαν
  rationale: The clause explains “eternal” in immediate, common English without weakening its force.
- pob_phrase: gave us eternal encouragement and good hope by grace
  simplified_phrase: by grace gave us encouragement that lasts forever and a good hope
  preserved_meaning: Grace is the means by which the encouragement and hope are given.
  reasoning_layer_used: Lexical decision for ἐν χάριτι
  rationale: Moving “by grace” beside “gave” makes its connection to the gift easier to follow.
- pob_phrase: Jesus the Messiah himself, and God our Father
