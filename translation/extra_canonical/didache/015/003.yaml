  category: awkward_english
  tier: 1
  from: anyone who goes wrong against another
  to: anyone who wrongs another
  rationale: The verb ἀστοχέω literally means 'to miss the mark' or 'go astray', but in this interpersonal context with κατὰ τοῦ ἑτέρου ('against another'), it refers to committing an offense. 'Goes wrong against' is an unnatural English calque; 'wrongs another' or 'sins against another' accurately captures the intended meaning of interpersonal transgression.
- timestamp: '2026-04-23T20:33:03Z'
  adjudicator: azure-gpt-5.4-revision-pass
  reviewer_model: gpt-5.4
  category: revision_pass
  from: And reprove one another, not in anger but in peace, as you have it in the gospel; and let no one speak to anyone who wrongs another, nor let him hear from you, until he repents.
  to: And reprove one another, not in anger but in peace, as you have in the gospel; and let no one speak to anyone who sins against another, nor let him be heard by you, until he repents.
  rationale: Removed the unnecessary pronoun in 'as you have in the gospel'; revised 'wrongs another' to 'sins against another' for closer lexical accuracy to ἀστοχοῦντι κατὰ τοῦ ἑτέρου; and changed 'nor let him hear from you' to 'nor let him be heard by you' to reflect ἀκουέτω more accurately.
