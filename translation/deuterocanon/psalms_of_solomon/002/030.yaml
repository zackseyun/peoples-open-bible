  - source_phrase: οὐκ ἐχρόνισα
    prior_rendering: I did not delay
    new_rendering: I did not wait long
    rationale: The speaker is describing how quickly God answered the preceding prayer, not his own decision to act without delay.
  - source_phrase: τὴν ὕβριν αὐτοῦ, ἐκκενεκεντημένον
    prior_rendering: his insolence, pierced through
