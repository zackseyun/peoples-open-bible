id: T12P.JUD.15.4
reference: Testament of Judah 15:4
unit: verse
book: Testament of Judah
collection: Testaments of the Twelve Patriarchs
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: "Καίγε *μετανοήσας ἐπὶ τούτοις¹⁴, οἶνον καὶ κρέα¹⁶ οὐκ¹⁷ ἔφαγον ἕως γήρους¹⁹ μου²⁰, καὶ *πᾶσαν εὐφροσύνην²¹ οὐκ εἶδον."
  language: Greek
translation:
  text: And indeed, having repented[a] of these things, I ate neither wine nor meat until my old age, and I saw no joy at all.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims. In 15:4 the recorded metanoesas and prolonged abstinence support repented of these things, not mere reconsideration; align the corresponding 8:25 wording without rewriting the surrounding text.
    reason: lexical_alternative
