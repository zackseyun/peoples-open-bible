id: REV.2.5
reference: Revelation 2:5
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
translation:
  text: Therefore remember from where you have fallen[a], and reorient toward God[r1], and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you reorient toward God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'from what height you have fallen.' The Greek literally says 'from where you have fallen'; some take it as an implied metaphor of height.
    reason: lexical_alternative
  - marker: b
    text: The 'lampstand' is the image used for a church in Revelation 1:20.
    reason: cross_reference
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημόνευε
  chosen: remember
  alternatives:
  - keep remembering
  - call to mind
  lexicon: BDAG
  rationale: Present imperative calls for ongoing recollection; 'remember' is idiomatic and sufficiently preserves the command without awkwardness.
- source_word: οὖν
  chosen: therefore
  alternatives:
  - then
  - so
  lexicon: BDAG
  rationale: Marks inference from the previous rebuke; 'therefore' preserves the logical connection more clearly than a weaker connective.
- source_word: πόθεν
  chosen: from where
  alternatives:
  - from what height
  - where
  lexicon: BDAG
  rationale: The adverb literally means 'from where/whence.' Some English versions interpret the metaphor as 'from what height,' but the Greek does not explicitly supply 'height,' so the more transparent rendering is preferred.
- source_word: πέπτωκας
  chosen: you have fallen
  alternatives:
  - you have fallen away
  lexicon: BDAG
  rationale: Perfect tense indicates a completed fall with present result. 'You have fallen' preserves the metaphor without importing the stronger theological sense of apostasy implied by 'fallen away.'
- source_word: μετανόησον
  chosen: reorient toward God
  alternatives:
  - repent
  - change your mind
  - turn back
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
- source_word: τὰ πρῶτα ἔργα
  chosen: the works you did at first
  alternatives:
  - the first works
  - your former works
  lexicon: BDAG
  rationale: The phrase refers to the deeds characteristic of their earlier state. 'The works you did at first' is natural English and clarifies the temporal force of πρῶτα.
- source_word: ποίησον
  chosen: do
  alternatives:
  - practice
  - carry out
  lexicon: BDAG
  rationale: Simple imperative matching the broad semantic range of ποιέω in this context.
- source_word: εἰ δὲ μή
  chosen: But if not
  alternatives:
  - otherwise
  - but if you do not
  lexicon: BDAG
  rationale: Introduces the warning condition. 'But if not' keeps the abruptness and conditional force of the Greek.
- source_word: ἔρχομαί σοι
  chosen: I am coming to you
  alternatives:
  - I will come to you
  - I am coming against you
  lexicon: BDAG
  rationale: Present middle indicative can function futuristically, but 'I am coming to you' preserves the vivid immediacy of the Greek. 'Against you' is interpretive and not explicit in the text.
- source_word: κινήσω
  lemma: κινέω
  chosen: I will remove
  alternatives:
  - I will move
  - I will take away
  lexicon: BDAG
  rationale: Although κινέω literally means 'move,' in this judgment context with ἐκ τοῦ τόπου αὐτῆς the sense is effectively removal from position. 'Remove' communicates the force clearly in English.
- source_word: τὴν λυχνίαν σου
  chosen: your lampstand
  alternatives:
  - your lamp
  lexicon: BDAG
  rationale: λυχνία is 'lampstand,' not the lamp itself. In Revelation 1:20 lampstands symbolize churches, so the concrete image should be retained.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  chosen: from its place
  alternatives:
  - out of its place
  lexicon: BDAG
  rationale: A straightforward rendering of the prepositional phrase; 'from its place' is natural modern English while preserving the image.
- source_word: ἐὰν μὴ μετανοήσῃς
  chosen: unless you reorient toward God
  alternatives:
  - unless you repent
  - if you do not repent
  lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
