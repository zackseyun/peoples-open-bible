  from: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
  to: A single witness is not enough to establish anyone’s guilt for any iniquity or sin, whatever sin they may have committed. A case shall be established only on the testimony of two or three witnesses.
  rationale: The lexical history explicitly recognizes that 'stand' means legal validity or establishment, which governs the new wording. Its earlier preference for representative masculine forms does not outweigh the acknowledged general application of this law; the displaced and unnecessary footnotes are dropped.
