theological_decisions:
- issue: Rendering of δοῦλοι τοῦ θεοῦ
  chosen_reading: servants of God
  alternative_readings:
  - slaves of God
  rationale: Current DOCTRINE.md reader-facing servant rule applies; note c retains bonded-status and
    allegiance nuance.
- issue: Reference and capitalization of τὸ πνεῦμα τὸ ἅγιον
  chosen_reading: the Holy Spirit (capitalized)
  alternative_readings:
  - the holy spirit (as indwelling gift)
  rationale: The translation retains the Holy Spirit capitalization and the source’s wearing-away and
    saving claims without inserting an ontological explanation.
- issue: Rendering of θεότης
  chosen_reading: the divine
  alternative_readings:
  - the Deity
  - Godhead
  - God’s nature
  rationale: ‘The divine’ preserves the abstract quality of θεότης and avoids later technical terms (‘Godhead’).
    It allows phrases like ‘parables of the divine’ without importing post‑Nicene precision.
- issue: ‘Parables’ in Hermas
  chosen_reading: Keep ‘parables’ for παραβολαί
  alternative_readings:
  - figures
  - allegories
  rationale: Hermas self‑describes his visionary/allegorical instruction as παραβολαί; retaining ‘parables’
    preserves his register while context clarifies he means figurative instruction, not necessarily Gospel‑style
    short stories.
- issue: 'Paradox: ‘sorrow … wears down the Holy Spirit—and again saves’'
  chosen_reading: Preserve the paradox verbatim
  rationale: Hermas develops this tension in the following material (two kinds of sorrow). We do not pre‑resolve
    it in this unit, to maintain his rhetorical structure.
