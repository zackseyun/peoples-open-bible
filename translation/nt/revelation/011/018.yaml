  category: meaning_retranslation
  from: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
  to: The nations raged, and your wrath has come; the time has come for the dead to be judged, for you to reward your servants—the prophets, the saints, and those who fear your name, small and great alike—and to destroy those who destroy the earth[a].”
  rationale: The recorded decisions preserve “servants,” “saints,” and the destroy/destroy symmetry; these remain, without narrowing the last clause to physical devastation or moral corruption alone. The Greek’s compressed announcement of the appointed time is expanded only enough to make its judgment and reward clauses clear.
