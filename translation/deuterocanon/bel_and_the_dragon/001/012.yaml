  text: καὶ σφράγισον τῷ δακτυλίῳ σου. καὶ ἐλθὼν πρωὶ ἐὰν μὴ εὕρῃς πάντα βεβρωμένα ὑπὸ τοῦ Βήλ, ἀποθανούμεθα, ἢ Δανιὴλ ὁ ψευδό- μενος καθʼ ἡμῶν.
  language: Greek
