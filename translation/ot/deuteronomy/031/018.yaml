  from: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
  to: I myself will surely hide my face on that day because of all the evil they have done, for they have turned to other gods.
  rationale: The lexical discussion rightly preserves both the emphatic assurance and the hidden-face image. Its preference for singular 'he' rests on Hebrew form rather than the referent, so plural English is used consistently.
