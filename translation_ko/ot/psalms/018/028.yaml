    reason: lexical_alternative
lexical_decisions:
- source_word: עַם עָנִי
  english_pob_choice: an afflicted people
  chosen_korean: 고난받는 백성
  alternatives_korean:
  - 가난한 백성
  - 겸손한 백성
  - 곤고한 백성
  lexicon: HALOT
  rationale: עָנִי는 경제적 가난, 고난, 낮아짐을 모두 가리킬 수 있으므로, 영어 POB의 afficted를 따라 고난의 상태를 드러내면서도 한쪽 의미로만 좁히지 않았습니다.
- source_word: תוֹשִׁיעַ
  english_pob_choice: save
  chosen_korean: 구원하시고
  alternatives_korean:
  - 구하시고
  - 건지시고
  lexicon: HALOT
  rationale: 히필 동사의 구원/구출 의미를 살려 시편의 신학적 울림이 강한 '구원하시다'로 옮겼습니다.
- source_word: וְעֵינַיִם רָמוֹת
  english_pob_choice: haughty eyes
  chosen_korean: 오만한 눈
  alternatives_korean:
  - 높은 눈
  - 교만한 눈
  - 거만한 눈
  lexicon: HALOT
  rationale: 직역하면 '높은 눈'이지만 한국어에서는 오만함을 나타내는 관용 표현으로 풀어야 의미가 분명해지므로, 눈의 높음이 가리키는 교만을 드러냈습니다.
- source_word: תַּשְׁפִּיל
  english_pob_choice: you bring low
  chosen_korean: 낮추십니다
  alternatives_korean:
  - 낮게 하십니다
  - 겸손하게 하십니다
  - 끌어내리십니다
  lexicon: HALOT
  rationale: 샤팔의 '낮게 하다/내리다'를 살리되, 시의 평행법상 앞의 '구원하시고'와 자연스럽게 짝이 되도록 간결한 '낮추십니다'로 옮겼습니다.
theological_decisions:
- issue: עַם עָנִי를 '백성'으로 옮길지 '사람들'로 옮길지
  chosen_reading: '''백성''은 공동체성을 드러내는 반면, 본문은 하나님이 특정한 성격의 집단을 구원하신다는 점을 강조하므로 ''고난받는 백성''으로 옮겼습니다.'
  alternative_readings:
  - 고난받는 사람들
  - 곤고한 사람들
  rationale: 시편의 평행구조에서 낮은 자와 교만한 자의 대조가 핵심이므로, 개인보다 공동체를 가리키는 집합적 뉘앙스를 살리는 편이 본문에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: preserve the source text''s plain sense; do not narrow עָנִי to economics or mere inward humility.'
