  meaning_decisions:
  - source_phrase: וּלְשֵׁם יֻלַּד גַּם הוּא
    prior_rendering: And to Shem also ... children were born
    new_rendering: Children were also born to Shem
    rationale: Natural English clause order preserves the emphasis that Shem, too, had offspring without separating the subject from its verb by lengthy appositions.
  - source_phrase: אֲבִי כָּל בְּנֵי עֵבֶר
    prior_rendering: the father of all the sons of Eber
    new_rendering: the ancestor of all Eber’s descendants
    rationale: The genealogy makes Shem an ancestor several generations before Eber, so “father” and “sons” both have their broader genealogical senses here.
