  text: when I sharpen the lightning of my sword, and my hand takes hold of judgment, I will return vengeance on my adversaries, and I will repay those who hate me.
translation:
  language: ko
  text: 내 칼날을 번개처럼 벼리고, 내 손이 심판을 붙잡을 때, 나는 내 대적들에게 보복하고 나를 미워하는 자들에게 갚겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 칼의 번개/섬광을 벼릴 때’라는 시적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּרַק חַרְבִּי
  english_pob_choice: the lightning of my sword
  chosen_korean: 내 칼의 번갯빛
  alternatives_korean:
  - 내 칼의 번개
  - 내 칼의 번갯불
  lexicon: בְּרַק
  rationale: English POB가 חַרְבִּי를 단순히 ‘my sword’가 아니라 ‘the lightning of my sword’로 읽은 해석을 따라, 칼의 위력과 번개 같은 번뜩임을 함께 살리는 ‘번갯빛’으로 옮겼습니다.
- source_word: וְתֹאחֵז בְּמִשְׁפָּט יָדִי
  english_pob_choice: and my hand takes hold of judgment
  chosen_korean: 내 손이 심판을 붙잡을 때
  alternatives_korean:
  - 내 손이 심판을 움켜잡을 때
  - 내 손이 공의를 붙잡을 때
  lexicon: מִשְׁפָּט
  rationale: מִשְׁפָּט는 여기서 법정적 판결/심판의 의미가 강하므로, 추상적인 ‘공의’보다 POB의 ‘judgment’에 맞춰 ‘심판’으로 렌더링했습니다.
- source_word: אָשִׁיב נָקָם
  english_pob_choice: I will return vengeance
  chosen_korean: 나는 … 복수하고
  alternatives_korean:
  - 나는 원수를 갚고
  - 나는 보복하고
  lexicon: נָקָם
  rationale: נָקָם은 단순한 감정 표현보다 응보적 행위를 가리키므로, 영어 POB의 ‘vengeance’를 따라 ‘복수하다’로 옮겼습니다.
- source_word: לְצָרַי / לִמְשַׂנְאַי
  english_pob_choice: on my adversaries / those who hate me
  chosen_korean: 내 대적들에게 / 나를 미워하는 자들에게
  alternatives_korean:
  - 내 원수들에게 / 나를 미워하는 자들에게
  - 나를 대적하는 자들에게 / 나를 미워하는 자들에게
  lexicon: צָרַי; מְשַׂנְאַי
  rationale: 두 병행 표현을 각각 ‘대적들’과 ‘미워하는 자들’로 구분해, 적대와 증오의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 하나님의 자기-보복 선언의 직접성
  chosen_reading: 하나님이 친히 보복과 갚음을 선언하시는 직설을 약화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - ‘심판하겠다’처럼 일반화하여 완화하는 읽기
  - ‘원수를 갚겠다’로 정서화하는 읽기
  rationale: 본문은 단순한 판결 선언이 아니라 언약적 적대에 대한 적극적 응보를 말하므로, POB의 어조를 유지해 신적 주권과 공의의 긴장을 드러냈습니다.
  doctrine_reference: 신명기 32장의 언약적 저주와 하나님의 공의
- issue: ‘번갯빛’ 표현의 은유 보존
  chosen_reading: 칼의 날카로움을 번개 이미지로 유지해 시적·전투적 긴장을 보존했습니다.
  alternative_readings:
  - ‘칼’을 평이하게 ‘칼날’로 풀어 쓰는 읽기
  - 이미지를 약화해 ‘칼을 갈 때’로 옮기는 읽기
  rationale: 히브리어의 시적 병행과 영어 POB의 독특한 이미지를 살려, 본문의 위협성과 장엄함을 함께 전달했습니다.
  doctrine_reference: 시적 평행법과 예언적/모세적 진술의 수사
