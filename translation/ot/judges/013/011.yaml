  from: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
  to: Manoah rose and followed his wife. When he reached the man, he asked, “Are you the man who spoke to my wife?” The man replied, “I am.”
  rationale: The earlier preference for 'the woman' was based on preserving source form, not on a different referent; 'my wife' conveys the relationship first hearers already knew. I retain the visitor’s designation as 'the man' and his ordinary affirmative reply without adding theological significance.
