  source_fidelity: הֶבֶל은 우상들의 무가치함을 가리키므로 ‘헛것’은 적절합니다. מַעֲשֵׂה תַּעְתֻּעִים은 영어 POB의 ‘a work of mockery’를 따라 ‘조롱의 산물’로 옮겨, 원문의 조롱/기만 계열 뉘앙스를 유지하면서도 ‘조롱거리 같은 작품’이 만드는 비교 표현과 의미 전환을 피했습니다. פְּקֻדָּה는 여기서 심판적 처벌의 때를 뜻하며, ‘처벌을 받을 때’가 자연스럽게 반영합니다.
  naturalness: 초안의 ‘조롱거리 같은 작품’은 현대 한국어에서 다소 부자연스럽고, ‘같은’이 원문에 없는 완화·비교의 뜻을 더합니다. ‘조롱의 산물’은 간결하고 문맥상 자연스럽습니다. 두 번째 절에서 주어를 반복하지 않아도 앞의 ‘그들’을 명확히 이어 받을 수 있습니다.
  terminology: ‘헛것’, ‘처벌’, ‘멸망하다’는 우상 비판과 심판 문맥에 적합한 현대 표준어입니다. ‘조롱의 산물’은 특정 교리적 해석을 덧붙이지 않습니다.
