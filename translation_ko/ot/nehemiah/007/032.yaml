lexical_decisions:
- source_word: אַנְשֵׁי
  english_pob_choice: the men of
  chosen_korean: 남자들
  alternatives_korean:
  - 사람들
  - 주민들
  lexicon: HALOT
  rationale: 히브리어 אַנְשֵׁי는 אִישׁ의 구성형 복수로, POB의 ‘the men of’를 따라 성별 표지를 살려 ‘남자들’로 옮겼습니다. ‘사람들’이나 ‘주민들’은 의미를 부드럽게 하지만 원문 형식을 약화합니다.
- source_word: בֵית אֵל
  english_pob_choice: Bethel
  chosen_korean: 베델
  alternatives_korean:
  - 벧엘
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 관행에 따라 ‘베델’로 적었습니다. 의미역(‘하나님의 집’)은 여기서는 원문 지명성을 유지하는 편이 더 적절합니다.
- source_word: וְהָעָי
  english_pob_choice: and Ai
  chosen_korean: 아이
  alternatives_korean:
  - 아이 성
  - 아이의
  lexicon: HALOT
  rationale: 히브리어는 정관사를 포함하지만 한국어 지명 표현에서는 보통 이를 드러내지 않으므로 단순히 ‘아이’로 옮겼습니다.
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  english_pob_choice: one hundred twenty-three
  chosen_korean: 백이십삼 명
  alternatives_korean:
  - 백스물세 명
  - 일백이십삼 명
  lexicon: HALOT
  rationale: 수사와 계수 단위를 자연스러운 현대 한국어로 옮겨 정확한 수량을 보존했습니다.
