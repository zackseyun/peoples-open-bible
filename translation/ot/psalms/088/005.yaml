id: PSA.88.5
reference: Psalms 88:5
source:
  edition: WLC
  text: בַּ/מֵּתִ֗ים חָ֫פְשִׁ֥י כְּמ֤וֹ חֲלָלִ֨ים שֹׁ֥כְבֵי קֶ֗בֶר אֲשֶׁ֤ר לֹ֣א זְכַרְתָּ֣/ם ע֑וֹד וְ֝/הֵ֗מָּה מִ/יָּדְ/ךָ֥ נִגְזָֽרוּ׀׃
translation:
  text: I am free among the dead[a], like the slain who lie in the grave, whom you remember no more[b] and who are cut off from your hand[c].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The word means 'free' or 'released'; here it evokes being cut loose from the ties of the living, as though already dead.
    reason: lexical_alternative
  - marker: b
    text: Here 'remember' includes attending to someone and acting on their behalf.
    reason: lexical_alternative
  - marker: c
    text: God's 'hand' is an image of his power and active care.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמֵּתִים
  chosen: among the dead
  alternatives:
  - with the dead
  - in the company of the dead
  lexicon: HALOT
  rationale: The preposition ב with the plural 'the dead' is best rendered locatively/socially as 'among the dead,' expressing the psalmist's identification with the realm/company of the dead rather than simple accompaniment.
- source_word: חָפְשִׁי
  chosen: free
  alternatives:
  - free
  - released
  lexicon: HALOT
  rationale: An adjective in a verbless clause, best rendered as the state “free,” rather than as the passive-event wording “set free.”
- source_word: כְּמוֹ
  chosen: like
  alternatives:
  - as
  lexicon: HALOT
  rationale: Standard comparative particle introducing the simile.
- source_word: חֲלָלִים
  chosen: the slain
  alternatives:
  - the pierced
  - the wounded dead
  lexicon: HALOT
  rationale: In poetic contexts this noun commonly denotes those slain, often violently. 'The slain' is the most natural English equivalent here.
- source_word: שֹׁכְבֵי קֶבֶר
  chosen: who lie in the grave
  alternatives:
  - lying in the grave
  - those who lie in the tomb
  lexicon: HALOT
  rationale: Construct participle plus noun describes the state of the slain. 'Lie in the grave' is natural and preserves the durative participial sense.
- source_word: אֲשֶׁר לֹא זְכַרְתָּם עוֹד
  chosen: whom you remember no more
  alternatives:
  - whom you no longer remember
  - whom you remember no longer
  lexicon: HALOT
  rationale: Directly reflects the relative clause and adverb עוֹד. In this lament context 'remember' carries covenantal/attentive force, not mere mental recollection.
- source_word: וְהֵמָּה
  chosen: for they
  alternatives:
  - and they
  - they
  lexicon: HALOT
  rationale: Though formally 'and they,' the clause explains the prior statement. Rendering as 'for they' captures the explanatory force in smooth English.
- source_word: מִיָּדְךָ
  chosen: from your hand
  alternatives:
  - from your power
  - from your care
  lexicon: HALOT
  rationale: '''Hand'' is retained as the primary metaphor, preserving the Hebrew image of power/control/care. Interpretive expansions such as ''power'' or ''care'' are possible but too narrowing for the main text.'
- source_word: נִגְזָרוּ
  chosen: are cut off
  alternatives:
  - have been severed
  - are separated
  lexicon: HALOT
  rationale: The Niphal of גזר conveys being cut off/severed. 'Are cut off' is idiomatic and preserves the stark imagery of separation.
