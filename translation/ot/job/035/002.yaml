id: JOB.35.2
reference: Job 35:2
source:
  edition: WLC
  text: הֲ֭/זֹאת חָשַׁ֣בְתָּ לְ/מִשְׁפָּ֑ט אָ֝מַ֗רְתָּ צִדְקִ֥/י מֵ/אֵֽל׃
translation:
  text: Do you think this is just? You say, “I am in the right, not God[a].”
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “My righteousness is greater than God’s”; another understanding is, “I am righteous before God.” The Hebrew expression is compressed and disputed.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲזֹאת
  chosen: Do you think this
  alternatives:
  - Is this
  - Do you consider this
  lexicon: HALOT
  rationale: 'The interrogative הֲ with demonstrative זֹאת introduces a rhetorical question. In English, combining it with the following verb yields a natural opening: ''Do you think this...?''.'
- source_word: חָשַׁבְתָּ
  chosen: do you think
  alternatives:
  - have you considered
  - did you reckon
  lexicon: HALOT
  rationale: חשב commonly means 'think, reckon, consider.' Present English 'do you think' best conveys the rhetorical force in context.
- source_word: לְמִשְׁפָּט
  chosen: is just
  alternatives:
  - to be justice
  - for justice
  - right
  lexicon: HALOT
  rationale: Idiomatic English for Elihu’s challenge whether Job regards this position as just or right.
- source_word: אָמַרְתָּ
  chosen: You say
  alternatives:
  - you said
  - saying
  lexicon: HALOT
  rationale: The English present naturally frames the claim Elihu is presently attributing to Job.
- source_word: צִדְקִי
  chosen: I am in the right
  alternatives:
  - my right
  - my justice
  - my innocence
  lexicon: HALOT
  rationale: Expresses the substantival judicial claim naturally in English without reducing it to an abstract possession.
- source_word: מֵאֵל
  chosen: not God
  alternatives:
  - than God
  - before God
  - from God
  lexicon: HALOT
  rationale: 'In combination with the preceding self-vindication, this conveys the comparative/adversative force: Job is alleged to vindicate himself instead of God.'
