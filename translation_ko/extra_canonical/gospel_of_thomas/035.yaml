  to: 예수께서 말씀하셨습니다. “누구도 먼저 강한 자의 손을 묶지 않고서는 그의 집에 들어가 강제로 빼앗아 갈[a] 수 없습니다. 그런 뒤에야 그의 집을 뒤엎을[b] 것입니다.”
