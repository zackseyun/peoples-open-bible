  naturalness: 초안의 ‘모세에게 말하며, “…”’는 직접 인용을 이끄는 서술로 다소 어색하고 문장이 미완성처럼 들릴 수 있습니다. ‘모세에게 말했습니다’로 고치면 현대 표준 한국어의 합쇼체 서술에 자연스럽습니다. 또한 ‘갓 자손과 르우벤 자손’은 족칭의 병렬을 간결하게 살립니다.
  terminology: ‘갓’, ‘르우벤’, ‘종’, ‘내 주’, ‘명령하다’, ‘행하다’는 문맥과 원문의 위계적·공적 발화 양식에 적절합니다. 모세에게 쓰인 אֲדֹנִי는 신적 칭호인 ‘주님’보다 ‘내 주’가 적합합니다.
