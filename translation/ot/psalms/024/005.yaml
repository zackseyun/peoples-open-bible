id: PSA.24.5
reference: Psalms 24:5
source:
  edition: WLC
  text: יִשָּׂ֣א בְ֭רָכָה מֵ/אֵ֣ת יְהוָ֑ה וּ֝/צְדָקָ֗ה מֵ/אֱלֹהֵ֥י יִשְׁעֽ/וֹ׃
translation:
  text: He will receive blessing from Yahweh and righteousness[a] from the God of his salvation.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “vindication” or “justice.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִשָּׂא
  chosen: will receive
  alternatives:
  - will bear
  - will carry
  - will lift up
  lexicon: HALOT
  rationale: Although the verb נָשָׂא commonly means 'lift/carry/bear,' with an abstract object such as 'blessing' the idiomatic sense is receiving or obtaining it. 'Will receive' best conveys the sense in natural English without obscuring the Hebrew idiom.
- source_word: בְּרָכָה
  chosen: blessing
  lexicon: HALOT
  rationale: Standard rendering for בְּרָכָה. Singular is retained, matching the Hebrew and preserving the sense of bestowed favor.
- source_word: מֵאֵת יְהוָה
  chosen: from Yahweh
  alternatives:
  - from Yahweh
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: וּצְדָקָה
  chosen: righteousness
  alternatives:
  - and vindication
  - and justice
  lexicon: HALOT
  rationale: Retains the semantic breadth of the Hebrew; “vindication” remains a legitimate contextual alternative in the note.
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  chosen: from the God of his salvation
  alternatives:
  - from God his Savior
  - from the God who saves him
  lexicon: HALOT
  rationale: 'The construct phrase is most literally ''the God of his salvation.'' This preserves the Hebrew genitive and leaves open both senses: God as the source of salvation and God characterized by saving action. A more interpretive rendering like ''his Savior'' is possible but less formally transparent.'
- source_word: יִשְׁעוֹ
  chosen: his salvation
  alternatives:
  - his deliverance
  - his victory
  lexicon: HALOT
  rationale: The noun can denote salvation or deliverance. 'Salvation' fits the psalm's theological register and traditional English usage while remaining faithful to the Hebrew.
