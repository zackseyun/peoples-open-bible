translation:
  text: Woe to you, stubborn-hearted people who do evil and eat blood[a]! Where do you get the good food and drink that fill you? From all the good things the Lord, the Most High, has made abundant on the earth. Yet you have no peace.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Eating blood is forbidden in Leviticus 17:10–14; here it may also be an image of profiting from bloodshed.
