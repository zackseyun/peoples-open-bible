  from: My inward parts boil and do not rest[a]; days of affliction confront me.
  to: My insides boil and do not rest; days of affliction have come upon me.
  rationale: “My insides” preserves the visceral image in natural English, and “have come upon me” avoids adding the deliberate hostility implied by “confront.” The proposed “never rest,” however, is stronger than the Hebrew’s simple negated verb; “do not rest” is sufficient.
