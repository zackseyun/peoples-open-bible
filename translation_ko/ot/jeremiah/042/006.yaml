    rationale: לְמַעַן은 목적을, כִּי נִשְׁמַע은 순종을 복됨과 연결하는 절을 이룹니다. ‘순종할 때’를 사용해 미래의 서원 및 연결 관계를 자연스럽게 보존할 수 있습니다.
