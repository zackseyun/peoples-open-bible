  text: 나는 내 모든 뼈를 셀 수 있습니다[a]. 그들은 나를 바라보고 쳐다봅니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 내 모든 뼈를 셉니다.’ 히브리어 동사는 ‘세다’ 또는 ‘헤아리다’라는 뜻을 지닙니다. 여기서는 ‘모든 뼈’라는 목적어 때문에 뼈를 하나하나 셀 수 있다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
