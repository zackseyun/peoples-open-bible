  category: meaning_retranslation
  from: Then your survivors will remember me among the nations where they were taken captive[a], when I have broken their whoring heart that turned away from me, and their eyes that whored after their idols[c][b]; and they will loathe themselves for the evils they committed in all their abominations.
  to: Then your survivors will remember me among the nations where they were taken captive—how I was broken[a] by their adulterous hearts that turned away from me and by their eyes that lusted after their idols[b]. They will loathe themselves for the evils they committed in all their abominations.
  rationale: The earlier record preferred divine breaking of Israel's heart but preserved divine anguish as an alternative. Its claim that the Masoretic vocalization favors an active verb is not supported by the supplied form, so I promote the passive reading and retain the earlier main interpretation in a footnote.
