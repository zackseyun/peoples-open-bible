translation:
  text: Then the king of Assyria sent the Rabshakeh[a] from Lachish to King Hezekiah in Jerusalem with a large army. The Rabshakeh stood by the water channel of the upper pool, on the highway to the launderer’s field.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: An Assyrian official’s title, usually understood as “chief cupbearer.”
    reason: lexical_alternative
