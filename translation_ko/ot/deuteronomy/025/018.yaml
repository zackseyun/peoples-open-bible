  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: ko
  text: 그가 길에서 너희를 만나 너희 뒤에 처진 모든 사람들을 공격했습니다. 너희가 피곤하고 지쳐 있을 때에 그렇게 했으며, 그는 하나님을 두려워하지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ / met you on the way
  english_pob_choice: met you on the way
  chosen_korean: 길에서 너희를 만나
  alternatives_korean:
  - 길에서 너희를 맞닥뜨리고
  - 길에서 너희와 마주쳐
  lexicon: קָרַר/קָרָה
  rationale: ‘만나다’는 우연한 조우를 넘어서 적대적 접촉의 서두를 자연스럽게 살리며, 본문의 공격 맥락과도 잘 맞습니다.
- source_word: וַיְזַנֵּב בְּךָ / attacked all the stragglers behind you
  english_pob_choice: attacked all the stragglers behind you
  chosen_korean: 너희 뒤에 처진 모든 뒤처진 자들을 공격하고
  alternatives_korean:
  - 너희 뒤에 처진 모든 낙오자들을 쳐서
  - 너희 뒤에 처진 모든 지체들을 습격하고
  lexicon: זנב
  rationale: EN POB의 ‘attacked’를 따라 적극적인 가해를 드러내되, ‘뒤처진 자들’로 히브리어의 후미 낙오 대상을 구체화했습니다.
- source_word: הַנֶּחֱשָׁלִים / the stragglers
  english_pob_choice: the stragglers
  chosen_korean: 뒤처진 자들
  alternatives_korean:
  - 뒤처진 사람들
  - 낙오한 자들
  lexicon: נכשׁל
  rationale: ‘뒤처진 자들’은 전열에서 떨어진 사람들을 직접적으로 가리켜, 단순한 지연이 아니라 취약한 상태를 나타냅니다.
- source_word: יָרֵא אֱלֹהִים / did not fear God
  english_pob_choice: did not fear God
  chosen_korean: 하나님을 두려워하지 않았습니다
  alternatives_korean:
  - 하나님을 경외하지 않았습니다
  - 하나님을 무서워하지 않았습니다
  lexicon: ירא + אלהים
  rationale: 여기서는 경건한 ‘경외’보다 판단과 책임의 부재를 드러내는 직역적 표현이 더 적합하여, EN POB의 문장을 그대로 반영했습니다.
theological_decisions:
- issue: ‘하나님을 두려워하지 않았다’의 윤리적 의미
  chosen_reading: 아말렉의 공격은 단순한 전술적 적대가 아니라 하나님에 대한 무감각과 무경외를 드러내는 행위로 제시됩니다.
  alternative_readings:
  - 단지 종교적 불신고백으로만 읽는 해석
  - 전쟁 윤리의 문제로만 제한하는 해석
  rationale: 본문은 행동의 잔혹성에 신학적 평가를 덧붙여, 이 사건이 야훼의 백성에 대한 모독이자 하나님을 두려워하지 않는 태도였음을 드러냅니다.
  doctrine_reference: 신명기 25장 문맥의 언약 윤리
