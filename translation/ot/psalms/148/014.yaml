  from: And he has raised up a horn for his people[a], praise for all his faithful ones, for the sons of Israel, the people near to him[b][c][d]. Praise Yah!
  to: And he has raised up a horn[a] for his people, praise[b] for all his faithful ones, for the children of Israel[c], the people near to him. Praise Yah![d]
  rationale: “Children of Israel” is the established natural-English rendering of the corporate expression בְּנֵי יִשְׂרָאֵל and does not erase the Hebrew kinship image; a note can preserve the literal wording. The verse deliberately has compressed, appositional syntax, so “horn ... praise for all his faithful ones” should remain rather than be resolved into one interpretation. The proposed marker redistribution is sound, with the syntax note best anchored directly to “praise,” whose relation to the preceding clause is at issue.
