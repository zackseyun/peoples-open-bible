id: PSA.89.8
reference: Psalms 89:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣ל נַ֭עֲרָץ בְּ/סוֹד קְדֹשִׁ֣ים רַבָּ֑ה וְ֝/נוֹרָ֗א עַל כָּל סְבִיבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/008.yaml
  text: O Yahweh, God of hosts, who is mighty like you, O Yah[a]? Your faithfulness surrounds you.
  footnotes:
  - marker: a
    text: Or 'assembly'; the Hebrew term can denote an intimate council or deliberative gathering.
    reason: lexical_alternative
  - marker: b
    text: '''Holy ones'' likely refers here to heavenly beings rather than human saints.'
    reason: cultural_note
translation:
  language: ko
  text: 만군의 하나님 야훼여, 주님처럼 강하신 이가 누구입니까, 야여? 주님의 신실하심이 주님을 둘러싸고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야’는 히브리어 신명 ‘야훼’의 짧은 형태입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: HALOT
  rationale: 시편의 이 표현은 일반 신이 아니라 이스라엘의 하나님을 가리키므로, POB의 'God'에 맞춰 '하나님'으로 옮겼습니다.
- source_word: נַעֲרָץ
  english_pob_choice: greatly feared
  chosen_korean: 크게 두려움의 대상이시며
  alternatives_korean:
  - 크게 두려워지며
  - 크게 경외받으시며
  - 심히 두려우시며
  lexicon: HALOT
  rationale: 단순한 공포보다 경외를 포함한 '두려움의 대상'이라는 뜻을 살려, 평행구의 '두렵고 경외로우십니다'와 어울리게 번역했습니다.
- source_word: בְּסוֹד קְדֹשִׁים
  english_pob_choice: in the council of the holy ones
  chosen_korean: 거룩한 이들의 회중에서
  alternatives_korean:
  - 거룩한 이들의 회의에서
  - 성스러운 존재들의 모임에서
  - 성도들의 회중에서
  lexicon: HALOT
  rationale: סוֹד는 비밀스러운 친밀한 회의나 의결 모임을 가리킬 수 있어, 천상 회의의 뉘앙스를 살리되 '회중'으로 자연스럽게 옮겼습니다. '거룩한 이들'은 인간 성도보다 천상 존재를 가리킬 가능성을 열어 둡니다.
- source_word: עַל כָּל סְבִיבָיו
  english_pob_choice: above all who surround him
  chosen_korean: 그를 둘러선 모든 이들보다
  alternatives_korean:
  - 그를 둘러싼 모든 이들 위에
  - 주위를 둘러선 모든 이들보다
  - 둘러선 모든 것들 위에
  lexicon: HALOT
  rationale: עַל은 비교 우위를 나타내므로, 장소적 '위에'보다 비교적 의미가 분명한 '보다'로 옮겨 하나님이 주변 존재들보다 더 두렵고 경외로우심을 나타냈습니다.
theological_decisions:
- issue: '''거룩한 이들''의 지시 대상'
  chosen_reading: 천상 존재들을 포함하는 하나님의 회중으로 이해하되, 본문에서는 범위를 과도하게 좁히지 않았습니다.
  alternative_readings:
  - 인간 성도들의 모임
  - 혼합된 예배 공동체
  rationale: 문맥상 하늘과 하나님의 주변 존재들을 말하는 흐름이 강하지만, 히브리어 자체는 더 넓게 읽힐 수 있으므로 번역 본문은 '거룩한 이들'로 유지했습니다.
  doctrine_reference: 시 89편의 천상 회의 이미지
