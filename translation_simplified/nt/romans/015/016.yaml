  rationale: The clearer wording expresses the favored sense while the footnote preserves the alternative.
- pob_phrase: sanctified by the Holy Spirit
  simplified_phrase: made holy by the Holy Spirit
  preserved_meaning: The Holy Spirit brings the offering into a holy state.
  reasoning_layer_used: POB lexical decision
  rationale: Made holy explains the theological term sanctified in common English.
