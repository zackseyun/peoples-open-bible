translation:
  text: And one of the holy ones came to me and raised me.[a] He lifted me up and
    brought me as far as the door; but I bowed my face downward.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Charles1906 prints a lacuna at the opening of the Geʿez unit. The opening
      about one of the holy ones coming and raising Enoch is translated from the bracketed
      Greek parallel printed on PDF79; the edition explicitly says that Greek supplies
      this Geʿez lacuna. It is not invented Geʿez, a modern English substitution,
      or a fresh manuscript transcription.
    reason: textual_variant
  - marker: b
    text: The final printed Geʿez verb is daggered. Apparatus30 calls it untranslatable
      and suggests a corruption corresponding to Greek ἔκυφον. The final clause provisionally
      follows printed Greek ἐγὼ δὲ τὸ πρόσωπόν μου κάτω ἔκυφον, but I bowed my face
      downward. This is an explicitly Greek-supported repair, not a certified reading
      of the difficult Geʿez verb.
    reason: textual_variant
