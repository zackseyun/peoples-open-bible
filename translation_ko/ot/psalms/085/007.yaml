id: PSA.85.7
reference: Psalms 85:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲֽ/לֹא אַ֭תָּה תָּשׁ֣וּב תְּחַיֵּ֑/נוּ וְ֝/עַמְּ/ךָ֗ יִשְׂמְחוּ בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/007.yaml
  text: Show us your steadfast love[a], O Yahweh, and grant us your salvation.
  footnotes:
  - marker: a
    text: Or 'turn back' or 'turn again.' The Hebrew verb can denote returning or turning back, here likely of God turning again toward his people in favor.
    reason: lexical_alternative
  - marker: b
    text: Or 'give us life again' or 'make us live.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주의 한결같은 사랑을 우리에게 보여 주시고,[a] 주의 구원을 우리에게 베풀어 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 한결같은 사랑을 우리가 보게 하시고’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא אַתָּה תָּשׁוּב
  english_pob_choice: Will you not return
  chosen_korean: 주님께서 우리를 다시 돌이키시고
  alternatives_korean:
  - 주님께서 돌아오시고
  - 주님께서 다시 돌아오시고
  lexicon: HALOT
  rationale: הֲלֹא의 기대 섞인 수사 의문과 שוב의 ‘돌이키다/돌아오다’ 의미를 살려, 단순한 미래 진술보다 간구의 뉘앙스가 드러나도록 옮겼습니다.
- source_word: תְּחַיֵּנוּ
  english_pob_choice: revive us
  chosen_korean: 우리를 살리시면
  alternatives_korean:
  - 우리를 다시 살리시면
  - 우리에게 생명을 주시면
  lexicon: HALOT
  rationale: 피엘형 חיה의 ‘살게 하다/생명을 회복시키다’ 의미를 살려, 공동체적 회복을 포함할 수 있는 ‘살리다’를 선택했습니다.
- source_word: וְעַמְּךָ
  english_pob_choice: your people
  chosen_korean: 주님의 백성이
  alternatives_korean:
  - 주님의 백성은
  - 주님의 백성들이
  lexicon: HALOT
  rationale: 언약적 소유를 분명히 드러내면서 한국어 기도문 흐름에 맞게 자연스럽게 옮겼습니다.
- source_word: יִשְׂמְחוּ בָךְ
  english_pob_choice: may rejoice in you
  chosen_korean: 주님 안에서 기뻐할 것입니다
  alternatives_korean:
  - 주님 안에서 기뻐하게 될 것입니다
  - 주님으로 말미암아 기뻐할 것입니다
  lexicon: HALOT
  rationale: ב의 기쁨 대상/영역을 ‘안에서’로 자연스럽게 살리고, 시편의 소망적 진술을 ‘할 것입니다’로 표현했습니다.
theological_decisions:
- issue: 하나님의 ‘return’ 의미를 어떻게 드러낼지
  chosen_reading: ‘우리를 다시 돌이키시고’로 공동체를 향한 방향 전환을 드러냈습니다.
  alternative_readings:
  - 주님께서 돌아오시고
  - 주님께서 다시 우리에게로 돌아오시고
  rationale: 본문은 단순한 재방문보다 백성을 향해 다시 얼굴을 돌리시는 언약적 회복을 암시하므로, 그 함의를 한국어 동사 선택으로 살렸습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
- issue: ‘revive us’의 범위를 좁힐지 여부
  chosen_reading: ‘우리를 살리시면’로 두어 영적·공동체적 회복의 여지를 남겼습니다.
  alternative_readings:
  - 우리를 영적으로 새롭게 하시면
  - 우리의 삶을 회복하시면
  rationale: 시편 문맥의 회복 기도이지만, 본문 자체는 회복의 범위를 제한하지 않으므로 넓게 유지했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
