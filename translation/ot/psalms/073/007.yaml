  review_summary: The first colon preserves the grotesque image of eyes protruding amid fatness. In the second, the plural מַשְׂכִּיּוֹת is most naturally the subject of the plural עָבְרוּ, so the prior adjudication’s implicit subject “they” is grammatically less likely and turns the line into an unexpressed statement about possessions. “Imaginings” retains the difficult noun’s mental sense without narrowing it to fantasies or desires, while “overflow” is an idiomatic use of עבר for passing beyond limits. The note preserves the noun’s uncertainty and the alternative excess formulation.
