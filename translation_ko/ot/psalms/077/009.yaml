base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/009.yaml
  text: Has God forgotten to be gracious? Or has he in anger shut up his compassion? Selah[a]
  footnotes:
  - marker: a
    text: “Selah” is likely a liturgical or musical marker; its precise meaning is uncertain.
