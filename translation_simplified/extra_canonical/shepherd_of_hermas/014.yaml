theological_decisions:
- issue: Rendering of ἅγιοι
  chosen_reading: Translate as ‘holy ones’ rather than ‘saints.’
  alternative_readings:
  - saints
  rationale: Retain the earlier holy-ones choice, with saints in notek; both designate the community,
    without asserting that saints necessarily implies a later ecclesiastical status.
- issue: σχίσματα in a stone allegory vs. ecclesial schism
  chosen_reading: Render as ‘cracks’ in the main text.
  alternative_readings:
  - divisions
  - schisms
  rationale: The selected question uses schismas, cracks or divisions, within a stone allegory; noteg
    retains its figurative communal sense without narrowing it to a later church-order controversy.
- issue: κύριος (Kyrios)
  chosen_reading: Translate as ‘Lord.’
  alternative_readings:
  - Master
  rationale: Follows project default for Kyrios to render ‘Lord,’ reflecting covenantal usage without
    over-specific christological import within Hermas’s visionary context.
  doctrine_reference: 'DOCTRINE.md: Contested terms — Kyrios → Lord'
- issue: πίστις
  chosen_reading: Translate as ‘faith.’
  alternative_readings:
  - faithfulness
  - trust
  rationale: Here πίστις is a possessed quality (‘having faith’) alongside wealth; ‘faith’ is the clear,
    established sense.
  doctrine_reference: 'DOCTRINE.md: Contested terms — pistis → faith'
