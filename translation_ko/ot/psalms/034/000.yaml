  source_fidelity: 히브리어 표제의 시간 구문과 서술 순서를 대체로 잘 반영했습니다. 다만 초안의 연속된 ‘그가/그를’는 히브리어에서 문맥상 분명한 주체(아비멜렉)와 목적어(다윗)를 한국어에서 불필요하게 모호하게 만듭니다. 주체를 밝혀야 합니다.
  naturalness: ‘다윗의 시’는 시편 표제로 자연스럽고, ‘자기 처신을 바꾸었을 때’는 문맥상 타인 앞에서 보인 행동·태도의 변화를 자연스럽게 전달합니다. 인물명을 반복하여 문장의 지시 관계를 분명히 하는 편이 현대 표준 한국어에 적합합니다.
  terminology: ‘아비멜렉’을 본문에 보존한 것은 원문 우선 원칙에 맞습니다. 각주의 성경 책 이름은 통용 표기인 ‘사무엘상’으로 고치고, 아기스와의 관계는 가능성으로만 제시하여 조화시키지 않습니다.
