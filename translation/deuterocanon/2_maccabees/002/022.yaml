    prior_rendering: And when the things for the sacrifice had been consumed
    new_rendering: When the sacrifice had been consumed by fire
    rationale: The elliptical phrase refers to what was offered in sacrifice, and the surrounding narrative makes clear that its consumption was by burning, not merely the expenditure of supplies.
