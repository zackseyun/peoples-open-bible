translation:
  language: ko
  text: 여호와여, 왕이 주님의 능력으로 기뻐하고, 주님의 구원으로 말미암아 얼마나 크게 즐거워합니까!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 인도자에게
  - 합창 지휘자에게
  lexicon: HALOT
  rationale: 시편 표제의 לַמְנַצֵּחַ는 예배 음악의 책임자에게 돌리는 말로 이해하는 것이 자연스러우므로, 기능을 살려 ‘지휘자에게’로 옮겼습니다.
- source_word: מִזְמ֥וֹר
  english_pob_choice: A psalm
  chosen_korean: 시입니다
  alternatives_korean:
  - 시편입니다
  - 찬가입니다
  - 노래입니다
  lexicon: HALOT
  rationale: מִזְמוֹר는 장르 표지이므로 현대 한국어에서는 ‘시’보다 ‘시입니다’가 표제문으로 간결하고, 장르 표시를 무리 없이 전달합니다.
- source_word: לְדָוִֽד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗을 위한
  - 다윗이 지은
  - 다윗에게 속한
  lexicon: HALOT
  rationale: לְ다윗은 저자, 관련성, 헌정의 가능성을 모두 열어 두므로, 한국어에서도 단정하지 않는 ‘다윗의’로 폭넓은 뜻을 보존했습니다.
theological_decisions:
- issue: 다윗 표제의 의미 범위
  chosen_reading: 저자 단정 없이 다윗과의 관련성을 열어 둠
  alternative_readings:
  - 다윗이 지은
  - 다윗을 위한
  rationale: 히브리어 표제는 소속·헌정·저자성을 모두 가리킬 수 있으므로, 한쪽으로 좁히지 않고 본문이 허용하는 긴장을 유지했습니다.
  doctrine_reference: 번역 원칙 §3 — 문헌적·신학적 긴장을 해소하지 않고 보존합니다.
