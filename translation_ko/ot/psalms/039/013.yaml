  lexicon: HALOT
  rationale: 두 사회적 지위를 구분해 옮기되, 한국어 성경어감에서 '나그네'가 일시적 체류와 비소유의 뜻을 잘 드러내고 '거류하는 자'가 תּוֹשָׁב의 법적 뉘앙스를 보완합니다.
- source_word: עִמָּךְ
  english_pob_choice: with you
  chosen_korean: 주님과 함께 있는
  alternatives_korean:
  - 주님과 함께
  - 주님 곁에 있는
  lexicon: HALOT
  rationale: 단순한 동반보다 하나님 앞/안에서의 존재감을 살리기 위해 관계적 표현으로 풀었습니다.
theological_decisions:
- issue: 이중 사회적 지위 표현 גֵר / תּוֹשָׁב의 처리
  chosen_reading: '''나그네''와 ''거류하는 자''로 구분하여 함께 두었습니다.'
  alternative_readings:
  - '''나그네이며 객인 자'''
  - '''외국인과 임시 거주자'''
  rationale: 시편 기자의 자기 이해는 단순한 유랑이 아니라 하나님 앞에서의 비정주·비소유 상태를 근거로 한 겸손한 호소이므로, 두 용어의 차이를 살리는 편이 원문의 논지를 더 잘 드러냅니다.
