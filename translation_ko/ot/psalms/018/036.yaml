  yaml_path: translation/ot/psalms/018/036.yaml
  text: You broaden my steps beneath me[b], and my ankles have not given way[a].
  footnotes:
  - marker: a
    text: Or 'your gentleness made me great.' The Hebrew word can denote humility, meekness, or gentleness.
