theological_decisions:
- issue: Rendering of מְחֹקְקִי in royal imagery
  chosen_reading: my scepter
  alternative_readings:
  - my lawgiver
  - my ruler's staff
  rationale: The verse catalogs tribal territories and assigns symbolic royal/military roles. Rendering Judah as 'my scepter' preserves the political-royal metaphor without importing a narrower constitutional sense. The traditional 'lawgiver' is possible and worth preserving in a footnote because of its history and lexical plausibility.
  doctrine_reference: Translation philosophy §3, §5
revisions:
- timestamp: '2026-04-21T00:23:45Z'
  adjudicator: auto_apply_tier1
  reviewer_model: gemini-2.5-pro
  source_review: state/reviews/gemini/ot/psalms/060/009.json
  category: awkward_english
  tier: 1
  from: the stronghold of my head
  to: a stronghold for my head
  rationale: The phrase 'the stronghold of my head' is a literalism that is awkward in English. The preposition 'of' creates a slightly strange image, as if the head possesses a stronghold. Using 'for' clarifies the protective function of Ephraim for the speaker's head. This change preserves the drafter's key lexical choices ('stronghold', 'head') while forming a more natural and immediately understandable English phrase.
