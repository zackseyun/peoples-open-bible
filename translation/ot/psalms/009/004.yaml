id: PSA.9.4
reference: Psalms 9:4
source:
  edition: WLC
  text: כִּֽי עָ֭שִׂיתָ מִשְׁפָּטִ֣/י וְ/דִינִ֑/י יָשַׁ֥בְתָּ לְ֝/כִסֵּ֗א שׁוֹפֵ֥ט צֶֽדֶק־׃
translation:
  text: For you have upheld my right and my cause; you sat on the throne, judging righteously.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  - Indeed
  lexicon: HALOT
  rationale: Introduces the ground for the preceding praise. 'For' fits the causal connection in English and preserves the psalm's logic.
- source_word: עָשִׂיתָ
  chosen: have upheld
  alternatives:
  - have done
  - have executed
  - have maintained
  lexicon: HALOT
  rationale: The verb is literally 'have done/made,' but with מִשְׁפָּט and דִּין as objects it idiomatically means to carry out or uphold someone's legal right. 'Have upheld' communicates the judicial sense naturally in English without over-paraphrasing.
- source_word: מִשְׁפָּטִי
  chosen: my right
  alternatives:
  - my judgment
  - my right
  - my case
  lexicon: HALOT
  rationale: With עָשִׂיתָ and parallel וְדִינִי, it refers to the speaker’s legal right or claim, not justice as a quality possessed by the speaker.
- source_word: וְדִינִי
  chosen: my cause
  alternatives:
  - my judgment
  - my legal claim
  - my case
  lexicon: HALOT
  rationale: דִּין in this nominal form refers to a legal case or cause. Rendering it 'my cause' differentiates it from מִשְׁפָּט while preserving the parallel judicial imagery.
- source_word: יָשַׁבְתָּ
  chosen: you sat
  alternatives:
  - you have sat
  - you took your seat
  - you were seated
  lexicon: HALOT
  rationale: The perfect verb depicts God's enthronement as the basis for judgment. 'You sat' is concise and natural, and in context implies taking the judicial seat.
- source_word: לְכִסֵּא
  chosen: on the throne
  alternatives:
  - on a throne
  - upon the throne
  - to the throne
  lexicon: HALOT
  rationale: The preposition with 'throne' expresses enthronement in a judicial setting. 'On the throne' is idiomatic English and suits the image of divine kingship and judgment.
- source_word: שֹׁפֵט
  chosen: judging
  alternatives:
  - as judge
  - who judges
  lexicon: HALOT
  rationale: The participle describes God's ongoing role while seated on the throne. 'Judging' keeps the verbal force and reads smoothly after 'you sat on the throne.'
- source_word: צֶדֶק
  chosen: righteously
  alternatives:
  - with righteousness
  - justly
  lexicon: HALOT
  rationale: The noun functions adverbially with the participle. 'Righteously' preserves the close link to righteousness, though 'justly' is a viable stylistic alternative.
