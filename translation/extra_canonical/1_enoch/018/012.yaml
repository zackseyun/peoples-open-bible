translation:
  text: Beyond that chasm[a] I saw a place with no heaven covering it above,[b] and no foundation of earth beneath
    it. There was no water above it[c] and no birds; it was an empty and terrifying place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beyond renders the contextual direction; the printed Ge’ez preposition is literally on/upon. Charles calls
      it a wrong rendering of the Greek beyond in printed50 note13. This follows that disclosed editorial explanation,
      not an independently collated Greek manuscript.
    reason: textual_variant
  - marker: b
    text: The selected print has the marked negativeኢ before the heaven-covering verb. Charles’s printed50 note14
      records its omission by witnessq; this translation retains the selected negative rather than silently changing
      it to a positive.
    reason: textual_variant
  - marker: c
    text: The selected main printing hasማን, ending with the nun-shaped letterን, not the ordinary finalይ of the water-word.
      This source record preserves that anomalous printing. English water follows the water-reading reported in
      Charles’s printed50 note17; Dillmann’s1865 lexicon,column212,gives aqua for the water-word. Whether the main
      printed anomaly is a typesetting error or reflects an antecedent cannot be established from these images.
      The apparatus reports manuscript readings; those manuscripts were not independently inspected here.
    reason: textual_variant
