lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקַּח
  english_pob_choice: sent and brought
  chosen_korean: 사람을 보내어 ... 데려왔습니다
  alternatives_korean:
  - 보내어 ... 끌고 왔습니다
  - 보내어 ... 데려왔습니다
  lexicon: שלח; לקח
  rationale: 두 동사의 결합은 단순한 파견과 인도/호출의 결과를 함께 나타내므로, 문맥상 자연스러운 ‘보내어 데려오다’로 옮겨 원문의 행위 순서를 살렸습니다.
- source_word: מִצֹּר
  english_pob_choice: from Tyre
  chosen_korean: 두로에서
  alternatives_korean:
  - 두레에서
  - 티레에서
  lexicon: צֹר
  rationale: 지명 צֹר는 한국어 성경에서 널리 알려진 ‘두로’로 옮기는 것이 가독성과 일치성에 가장 적절합니다.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  english_pob_choice: King Solomon
  chosen_korean: 솔로몬 왕
  alternatives_korean:
