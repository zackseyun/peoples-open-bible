  rationale: 지정된 WLC 본문을 처음부터 다시 번역했습니다. אָהַבְתָּ의 완료형은 시적 책망에서 현재적 성향을 나타낼 수 있으므로 본문에는 ‘사랑합니다’를 사용했고, 완료형 및 ‘속임의 혀’라는 보다 형식적인 표현은 각주에 보존했습니다. כָל דִּבְרֵי בָלַע는 영어 POB의 ‘all words of destruction’에 따라 ‘모든 파멸의 말’로, לְשׁוֹן מִרְמָה는 ‘간사한 혀여’로 옮겼습니다.
