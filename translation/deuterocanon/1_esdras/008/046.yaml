      - in our Lord's house
      lexicon: LSJ
      rationale: The Greek reads κυρίου ἡμῶν, 'our Lord,' and should be translated as such rather than harmonized to the MT
        parallel's 'our God.' 'House' is the standard rendering for temple language in this context.
