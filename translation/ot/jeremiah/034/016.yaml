  meaning: Yahweh accuses the people of profaning his name by reversing their commitment and forcing the men and women they had freed back into slavery.
  meaning_decisions:
  - source_phrase: וַתָּשֻׁבוּ
    prior_rendering: you turned back
    new_rendering: you reversed course
    rationale: The people reversed their earlier obedience by undoing the emancipation; this wording makes that reversal clear without suggesting repentance.
  - source_phrase: עַבְדּוֹ ... שִׁפְחָתוֹ ... לַעֲבָדִים וְלִשְׁפָחוֹת
    prior_rendering: his male servant and his female servant ... your male and female servants
    new_rendering: his male and female slaves ... your male and female slaves
    rationale: These Hebrew terms describe people held in bondage, released, and forcibly enslaved again. 'Slaves' conveys the status central to the accusation and follows the documented lexical decisions.
  - source_phrase: וַתָּשִׁבוּ
    prior_rendering: made ... return
    new_rendering: forced ... to return
    rationale: The causative verb, read with the subsequent subjugation, describes a compelled return rather than a voluntary one.
  - source_phrase: לְנַפְשָׁם
    prior_rendering: to go where they wished
    new_rendering: to live as they wished
    rationale: The released people had been given personal freedom, not merely permission to travel; 'live' better conveys their freedom to direct their own lives.
  - source_phrase: וַתִּכְבְּשׁוּ אֹתָם לִהְיוֹת לָכֶם לַעֲבָדִים וְלִשְׁפָחוֹת
    prior_rendering: then you subjugated them to be your male and female servants
    new_rendering: then you forced them to be your male and female slaves again
    rationale: This states the coercion and resulting enslaved status in natural English; 'again' expresses the renewed bondage established by the preceding release and return.
