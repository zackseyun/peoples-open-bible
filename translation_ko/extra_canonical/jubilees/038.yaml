base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/038.yaml
  text: '1[v1]. And after this Judah spoke to Jacob his father and said to him, “Bend your bow, father, and send out your arrows, and cast down the enemy and kill the adversary; and may there be strength for you, because we shall kill your brothers’ enemy. Your hand is with you, and your help is with you; we will give it to you for honor.”

    2. At that time Jacob bent his bow and sent out an arrow[v3], and struck Esau his brother on the right breast, and killed him.

    3. And again he sent out an arrow, and struck Adoran the Aramean on the left breast, and drove him back and killed him.

    4. And after this the sons of Jacob went out, they and their servants with them, in four divisions of battle.

    5. And Judah went out in front, and Naphtali and Gad with him, and fifty servants with him, toward the south side of the tower; and they killed all whom they found before them, and not one of them escaped, not even one.

    6. And Levi and Dan and Asher went out toward the east side of the tower, and fifty were with them; and they killed the fighting men of Moab and Ammon.

    7. And Reuben and Issachar and Zebulun went out toward the north side of the tower, and fifty were with them; and they killed the warriors of the Philistines.

    8. And Simeon and Benjamin and Enoch the son of Reuben went out toward the west side of the tower, and fifty were with them; and they killed of Edom and of the Horites, four hundred valiant men, men fit for battle.

    9. And six hundred fled, and four of the sons of Esau fled with them; and they left their father slain, as he had fallen in the hill-country which is in Adurim. And the sons of Jacob pursued after them as far as Mount Seir.

    10. But Jacob buried his brother in the hill-country which is in Adurim, and he returned to his house.

    11. And the sons of Jacob pressed the sons of Esau on Mount Seir, and they bowed their necks so that they might become slaves

    12. to the sons of Jacob. And they sent to their father asking whether they should make peace with them or kill them.

    13. And Jacob sent to his sons that they should make peace, and they made peace with them, and they imposed upon them a yoke of service, so that they should serve Jacob and his sons all their days.

    14. And they remained serving Jacob until the day when he went down into Egypt.

    15. And the sons of Edom have not again cast off the yoke of service which the twelve sons of Jacob had laid upon them, to this day.

    16. And these are the kings who reigned in Edom before a king reigned over the children of Israel,

    17. to this day, in the land of Edom: Balaq son of Beor reigned in Edom, and the name of his city was Denaba.

    18. And Balaq died, and Jobab son of Zarah from Boser reigned after him.

    19. And Jobab died, and Asam from the mountain of Teman reigned after him.

    20. And Asam died, and Adath son of Barad, who struck Midian in the field of Moab, reigned after him; and the name of his city was Avith.

    21. And Adath died, and Salman from Amaseqa reigned after him.

    22. And Salman died, and Saul from Rehoboth of the River reigned after him.

    23. And Saul died, and Baelunan son of Achbor reigned after him.

    24. And Baelunan son of Achbor died, and Adath reigned after him; and the name of his wife was Meṭabigo, daughter of Maṭarego, daughter of Metebedzaab.

    25[v24][v17][v15][v9][v8][v6][v5]. These are the kings who reigned in the land of Edom.'
  footnotes:
  - marker: v1
    text: The opening speech is textually difficult in this Ethiopic row, especially the clauses after 'kill the adversary.' The translation keeps the martial exhortation and honor-language without over-smoothing several compressed phrases.
    reason: segmentation_note
  - marker: v3
    text: The name 'Adoran' is uncertain in form, and the ethnic label may also be read differently in other witnesses. The Ethiopic here appears to identify a named foreign warrior distinct from Esau.
    reason: textual_variant
  - marker: v5
    text: The term rendered 'tower' may also denote a fortified place or stronghold. The four directional assaults in vv. 5–8 support a military-topographical sense.
    reason: lexical_alternative
  - marker: v6
    text: The directional term here is literally 'toward the sunrise/east.'
    reason: lexical_alternative
  - marker: v8
    text: The phrase 'of Edom and of the Horites' is difficult; the verse appears to report the killing of four hundred strong fighting men drawn from Edomite and Horite groups.
    reason: segmentation_note
  - marker: v9
    text: The place-name rendered 'Adurim' is uncertain in vocalization from the Ethiopic transcription.
    reason: textual_variant
  - marker: v15
    text: The Ethiopic numeral phrase is awkwardly segmented in this row. The sense is that the yoke imposed by the twelve sons of Jacob remained on Edom 'to this day.'
    reason: segmentation_note
  - marker: v17
    text: The royal list closely parallels the Edomite king list known from Genesis 36, but the spellings here follow the Ethiopic forms of Jubilees rather than being harmonized back to Genesis.
    reason: cross_reference
  - marker: v24
    text: The personal names in this verse are preserved in readable transliteration from the Ethiopic and are textually uncertain in exact form.
    reason: textual_variant
translation:
  language: ko
  text: '1. 그 후에 유다가 자기 아버지 야곱에게 말하여 이르기를, “아버지, 활을 당기시고 화살을 쏘아 원수를 넘어뜨리고 대적을 죽이십시오. 아버지께 힘이 있으시기를 바랍니다. 우리는 아버지의 형제를 죽이지 않을 것입니다. 그는 아버지의 동료이며 아버지와 같기 때문입니다. 그에게 존경을 표합시다.” 하였습니다.

    2. 그때에 야곱은 활을 당기고 화살 하나를 쏘아 그의 형 에서의 오른쪽 가슴에 맞혀 그를 죽였습니다.

    3. 그리고 다시 화살을 쏘아 아람 사람 아도란의 왼쪽 가슴을 맞히고, 그를 물러서게 한 뒤 죽였습니다.

    4. 이 일이 있은 뒤에 야곱의 아들들과 그들의 종들이 나가서 네 전열로 나뉘었습니다.

    5. 유다가 먼저 나갔고, 납달리와 갓과 종 오십 명이 그와 함께 탑의 남쪽으로 나갔습니다. 그들은 자기들 앞에서 만나는 모든 사람을 죽였으며, 그들 가운데서 그들에게서 달아난 사람은 단 한 사람도 없었습니다.

    6. 레위와 단과 아셀은 탑의 동쪽 편으로 나갔고, 오십 명이 그들과 함께 있었으며, 그들은 모압과 암몬의 전사들을 죽였습니다.

    7. 르우벤과 잇사갈과 스불론이 망대의 북쪽으로 나갔고, 그들과 함께 쉰 명이 있었으며, 그들이 블레셋 사람들의 전투원들을 죽였습니다.

    8. 그리고 시므온과 베냐민과 르우벤의 아들 에녹이 탑의 서편으로 나갔습니다. 그들과 함께한 사람은 오십 명이었고, 그들은 에돔과 호리 사람들의 용사 사백 명을 죽였습니다.

    9. 그리고 육백 명이 도망했고, 에서의 아들 넷도 그들과 함께 도망했습니다. 그들은 아버지를 아두핌에 있는 산지에서 쓰러져 죽은 채로 남겨 두고 떠났습니다. 야곱의 아들들은 그들을 세일 산까지 추격했습니다.

    10. 그러나 야곱은 아두림에 있는 산에 그의 형제를 장사하고, 자기 집으로 돌아갔습니다.

