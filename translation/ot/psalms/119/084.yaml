source:
  edition: WLC
  text: כַּ/מָּ֥ה יְמֵֽי עַבְדֶּ֑/ךָ מָתַ֬י תַּעֲשֶׂ֖ה בְ/רֹדְפַ֣/י מִשְׁפָּֽט־׃
translation:
  text: How many days does your servant have left[a]? When will you bring judgment on those who persecute me?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “How long must your servant endure this?”
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁפָּט
  chosen: judgment
  lemma: מִשְׁפָּט
  alternatives:
