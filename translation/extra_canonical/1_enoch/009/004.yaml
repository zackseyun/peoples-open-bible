translation:
  text: And they said to their Lord:[a] “Lord of lords, God of gods, and King of kings, the throne of your glory endures throughout
    all generations of the world. Your name is holy and glorious throughout the whole world, and is blessed and honored.”[b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected printing has a daggered, corrupt opening fragment, literally “to kings, because.” Charles proposes
      corrections in printed20notes20–21. This English keeps the address to their Lord and places the unreconstructed fragment
      here, rather than inventing a singular title “the King” or silently importing “Lord of the ages.”
    reason: textual_variant
  - marker: b
    text: “Endures” is supplied in English; the Ge'ez has a verbless clause, literally, “the throne of your glory throughout
      all generations of the world.”
    reason: lexical_alternative
  - marker: c
    text: “And honored” is bracketed in the supplied edition, indicating uncertainty about its textual status.
    reason: textual_variant
  - marker: d
    text: The GeEz word rendered “world” can also express an age or eternity; the temporal expressions in this praise remain
      open to that alternative.
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ
  chosen: their Lord
  alternatives:
  - their master
  rationale: The possessive suffix is third-person plural, referring to the Lord addressed by the angelic speakers. “Lord”
    preserves the elevated divine title and fits the following direct address.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ነገሥት
  chosen: the King
  alternatives:
  - kings
  - the King of the ages
  rationale: The transmitted form ordinarily means “kings,” but the opening wording is marked as textually difficult and does
    not yield natural syntax if translated mechanically. In context it introduces the divine addressee and anticipates “King
    of kings,” so the singular titular sense is represented cautiously in the main text.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እግዚኦሙ፡ ለአጋእዝት
  chosen: Lord of lords
  alternatives:
  - Master of masters
  rationale: The construct-like relation expressed with ለ presents the addressed deity as supreme over all lords. The possessive-looking
    form is understood by context as part of the direct address rather than as a shift back to third-person narration.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: አምላኮሙ፡ ለአማልክት
  chosen: God of gods
  alternatives:
  - their God, over the gods
  rationale: The repeated superlative formula places God above every being called a god. Retaining “gods” preserves the source's
    cosmic hierarchy without asserting that such beings are equal to the one addressed.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ንጉሦሙ፡ ለነገሥት
  chosen: King of kings
  alternatives:
  - their King, over kings
  rationale: This is the third member of the repeated supremacy formula; conventional English accurately preserves both its
    form and rhetorical force.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ውስተ፡ ኵሉ፡ ትውልደ፡ ዓለም
  chosen: throughout all generations of the world
  alternatives:
  - in every generation of the age
  - for all generations forever
  rationale: The phrase combines totality, generation, and world/age language. “Throughout all generations of the world” keeps
    these components visible while expressing the continuing duration implied by the verbless clause.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ስቡሕ
  chosen: glorious
  alternatives:
  - praised
  - worthy of praise
  rationale: In this doxological description of the divine name, “glorious” conveys splendor and praiseworthiness while matching
    the elevated register.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ከቡድ
  chosen: honored
  alternatives:
  - weighty
  - glorious
  - majestic
  rationale: The word can carry the linked senses of weight, dignity, and honor. “Honored” is intelligible in relation to
    the divine name and avoids repeating “glorious,” but the bracketed witness status is noted separately.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
