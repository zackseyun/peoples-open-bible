  text: אַל תַּהַרְגֵ֤/ם פֶּֽן יִשְׁכְּח֬וּ עַמִּ֗/י הֲנִיעֵ֣/מוֹ בְ֭/חֵילְ/ךָ וְ/הוֹרִידֵ֑/מוֹ מָֽגִנֵּ֣/נוּ אֲדֹנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/012.yaml
  text: Let them be caught in their pride because of the sin of their mouth—the word of their lips—and because of the curse and falsehood they speak.[a]
  footnotes:
  - marker: a
    text: Or 'shake them' or 'make them totter' for 'make them wander'; the Hebrew verb can denote causing restless movement or instability.
    reason: lexical_alternative
  - marker: b
    text: Or 'by your strength'; the Hebrew word can denote strength, power, or military force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 입의 죄, 곧 그들의 입술의 말과 그들이 말하는 저주와 거짓말 때문에, 그들이 그들의 교만 가운데 붙잡히게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 입의 죄는 그들의 입술의 말입니다. 그들이 그들의 교만 가운데 붙잡히게 하소서. 그들이 말하는 저주와 거짓말 때문에.”
    reason: 히브리어 첫 구문과 마지막 전치사구의 연결은 다르게 분석될 수 있으므로, 본문의 인과적 연결과 함께 대안적 구문을 제시합니다.
lexical_decisions:
- source_word: אַל תַּהַרְגֵם
  english_pob_choice: Do not kill them
  chosen_korean: 그들을 죽이지 마소서
  alternatives_korean:
