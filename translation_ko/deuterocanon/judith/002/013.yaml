  text: And you also must not transgress a single one of your lord’s words, but you shall surely carry out exactly as I have commanded you, and you shall not delay to do them.
translation:
  language: ko
  text: 당신도 당신의 주인의 말 가운데 하나도 어기지 말고, 내가 당신에게 명령한 그대로 반드시 실행하십시오. 그것들을 실행하는 데 지체하지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ παραβήσῃ
  english_pob_choice: must not transgress
  chosen_korean: 어기지 말고
  alternatives_korean:
  - 위반하지 말고
  - 어기지 말고
  - 넘어서지 말고
  lexicon: BDAG
  rationale: παραβαίνω의 핵심은 명령 경계를 넘어서는 ‘어김/위반’이므로, 현대 한국어에서 가장 자연스럽고 직접적인 ‘어기다’를 택했습니다.
- source_word: ἓν τι τῶν ῥημάτων
  english_pob_choice: a single one of ... words
  chosen_korean: 말들 가운데 하나도
  alternatives_korean:
  - 말 가운데 한 마디도
  - 말들 중 하나도
  - 한 말씀도
  lexicon: BDAG
  rationale: 복수 ‘말들’에 대한 분배적 강조를 살리기 위해 ‘가운데 하나도’로 옮겨, 한 항목도 빠뜨리거나 어기지 말라는 힘을 보존했습니다.
- source_word: ἐπιτελῶν ἐπιτελέσεις
  english_pob_choice: you shall surely carry out
  chosen_korean: 반드시 실행하고
  alternatives_korean:
  - 반드시 수행하고
  - 온전히 실행하고
  - 꼭 이행하고
  lexicon: BDAG
  rationale: 분사+미래형의 강조를 한국어 부사 ‘반드시’로 살리고, 군사·행정 명령문 맥락에 맞게 ‘실행하다’를 사용했습니다.
- source_word: οὐ μακρυνεῖς τοῦ ποιῆσαι αὐτά
  english_pob_choice: you shall not delay to do them
  chosen_korean: 그것들을 행하는 일을 지체하지 말아야 합니다
  alternatives_korean:
  - 그것들을 하는 것을 늦추지 말아야 합니다
  - 그것들을 시행하는 데 지체하지 말아야 합니다
  - 그것들을 행하기를 미루지 말아야 합니다
  lexicon: LSJ
  rationale: 마κρύνω의 ‘지연시키다/미루다’ 의미를 살려 ‘지체하다’로 옮기고, 부정문+목적부정사 구조를 자연스러운 한국어로 풀었습니다.
theological_decisions:
- issue: 인간 상급자를 가리키는 κύριος의 처리
  chosen_reading: ‘주인’으로 옮기되 대문자적 신적 호칭은 쓰지 않았습니다.
  alternative_readings:
  - ‘주님’
  - ‘주인님’
  - ‘상관’
  rationale: 문맥상 네부카드네자르 체계의 인간 상급자를 가리키므로, 신적 호칭인 ‘주님’을 피하고 관계상 위계가 드러나는 ‘주인’을 택했습니다. 동시에 한국어 군사·행정 명령문 어감에 맞게 과도한 종교적 색채를 줄였습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος의 인간 지시 대상은 문맥에 따라 일반 명사로 번역'
