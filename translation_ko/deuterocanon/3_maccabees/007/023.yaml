lexical_decisions:
- source_word: Εὐλογητὸς
  english_pob_choice: Blessed
  chosen_korean: 찬송이 있습니다
  alternatives_korean:
  - 복되십니다
  - 복되심이 있습니다
  - 찬양받으소서
  lexicon: εὐλογητός
  rationale: 문맥상 단순한 상태 진술이라기보다 하나님께 돌리는 축복/찬송 선언이므로, 한국어에서는 예배적이지만 현대적인 「찬송이 있습니다」로 옮겨 원문의 경축적 어조를 살렸습니다.
- source_word: ὁ ῥύστης
  english_pob_choice: the deliverer
  chosen_korean: 건져 내시는 이분
  alternatives_korean:
  - 구원자
  - 구해 주시는 분
  - 구속자
  lexicon: ῥύστης
  rationale: ῥύστης는 ‘건져 내다/구해 내다’의 구출 뉘앙스가 있어, 익숙한 교회어 ‘구원자’보다 동작성을 드러내는 표현을 택했습니다.
- source_word: Ἰσραήλ
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 백성
  - 야곱
  lexicon: Ἰσραήλ
  rationale: 고유명사는 표준 음역인 ‘이스라엘’로 유지해 원문 지시 대상을 그대로 보존했습니다.
- source_word: εἰς τοὺς ἀεὶ χρόνους
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 언제나
  - 끝없이
  lexicon: εἰς + χρόνους
  rationale: POB의 ‘forever’를 따라 시간적 종결 없음과 지속성을 간결한 현대 한국어 ‘영원히’로 표현했습니다.
theological_decisions:
- issue: 도움/구출의 성격을 가진 τίς-동사 표현을 어떻게 옮길지
  chosen_reading: ‘건져 내시는 이분’으로 옮겨 단순한 추상적 구원이 아니라 역사 속에서 구출하시는 하나님의 행위를 드러냈습니다.
  alternative_readings:
  - ‘구원자’로 일반화
  - ‘구속자’로 신학화
  rationale: 본문은 찬양문으로서 하나님의 구출 행위를 찬양하므로, 보다 구체적인 동사적 표현이 원문의 힘을 잘 전달합니다.
  doctrine_reference: 출애굽 전통의 구원/구출 표상
- issue: 축복 선언문의 종결형 처리
  chosen_reading: ‘찬송이 있습니다’로 마무리해 헬라어 수동 분사형의 찬양 선언을 현대 한국어 예배 문체로 재현했습니다.
  alternative_readings:
  - ‘복되십니다’
  - ‘찬양받으소서’
  rationale: 직역형보다 한국어에서 자연스럽고, 선언문 특유의 공적 찬양 어조를 유지합니다.
  doctrine_reference: 예배 언어의 형식적 대응
