id: PSA.107.38
reference: Psalms 107:38
source:
  edition: WLC
  text: וַ/יְבָרֲכֵ֣/ם וַ/יִּרְבּ֣וּ מְאֹ֑ד וּ֝/בְהֶמְתָּ֗/ם לֹ֣א יַמְעִֽיט׃
translation:
  text: He blessed them, and they multiplied greatly; he did not diminish their livestock.
  philosophy: dynamic
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  chosen: He blessed them
  alternatives:
  - And he blessed them
  lexicon: HALOT
  rationale: From ברך in the piel with 3mp suffix, denoting bestowal of blessing/prosperity. Singular subject is retained as 'He,' referring back to God in the psalm's context.
- source_word: וַיִּרְבּוּ
  chosen: they multiplied
  alternatives:
  - they increased
  - they became many
  lexicon: HALOT
  rationale: From רבה, here intransitive/plural, describing numerical increase. 'Multiplied' fits both population growth and the blessing context.
- source_word: מְאֹד
  chosen: greatly
  alternatives:
  - very much
  - exceedingly
  lexicon: HALOT
  rationale: Adverb intensifying the extent of increase; 'greatly' is natural modern English and preserves the force.
- source_word: וּבְהֶמְתָּם
  chosen: their livestock
  alternatives:
  - their cattle
  - their animals
  lexicon: HALOT
  rationale: בְּהֵמָה here is collective for domesticated animals/property animals. 'Livestock' is the most natural contemporary equivalent; 'cattle' would be too narrow.
- source_word: לֹא יַמְעִיט
  chosen: he did not diminish
  alternatives:
  - he did not diminish
  - it did not decrease
  lexicon: HALOT
  rationale: The singular Hiphil continues the prior divine subject and means that he did not reduce their livestock.
