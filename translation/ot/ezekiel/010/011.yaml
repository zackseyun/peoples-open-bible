  text: בְּ/לֶכְתָּ֗/ם אֶל אַרְבַּ֤עַת רִבְעֵי/הֶם֙ יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּ֑/ם כִּ֣י הַ/מָּק֞וֹם אֲשֶׁר יִפְנֶ֤ה הָ/רֹאשׁ֙ אַחֲרָ֣י/ו יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ם־־׃
translation:
  text: When the wheels moved, they went in any of the four directions without turning. They followed the direction the head[a] faced; they did not turn as they moved.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “the leading wheel”; the Hebrew word for “head” can also refer to what is foremost, and its precise referent here is uncertain.
    reason: alternative_reading
