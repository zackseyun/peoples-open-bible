base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/004.yaml
  text: And the elder said, “It is justified for him.”
translation:
  language: ko
  text: 그리고 그 노인이 말했습니다. “그에게는 그것이 정당합니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβύτης
  english_pob_choice: the elder
  chosen_korean: 그 노인
  alternatives_korean:
  - 그 장로
  - 그 어른
  lexicon: πρεσβύτης
  rationale: 본문의 중심은 연장자임을 나타내는 일반 명사이므로, 교회 직분인 ‘장로’보다 중립적인 ‘노인’이 원문에 더 가깝습니다.
- source_word: Δικαιοῦται
  english_pob_choice: It is justified
  chosen_korean: 정당합니다
  alternatives_korean:
  - 의롭다 하십니다
  - 의롭다고 여겨집니다
  lexicon: δικαιόω
  rationale: 형용사적·판정적 의미를 살려 ‘정당합니다’로 옮기면, 법정적/판정적 선언의 성격을 유지하면서도 한국어에서 자연스럽습니다.
- source_word: αὐτῷ
  english_pob_choice: for him
  chosen_korean: 그에게는
  alternatives_korean:
  - 그를 위하여
  - 그에게
  lexicon: αὐτός
  rationale: 영문 POB의 ‘for him’을 반영하되, 한국어에서는 주어 초점의 소유·귀속 뉘앙스를 드러내기 위해 ‘그에게는’으로 처리했습니다.
theological_decisions:
- issue: δικαιόω의 판정 의미를 어떻게 드러낼지
  chosen_reading: 도덕적 칭찬이 아니라, ‘그 사람에 관하여 그렇게 판정된다’는 의미로 읽었습니다.
  alternative_readings:
  - 그가 의롭다 하심을 받습니다
  - 그에게는 의가 있습니다
  rationale: 이 절은 신학 교리 진술이라기보다 평가/판정의 짧은 말이므로, 과도하게 교리화하지 않고 원문의 판정성을 보존하는 쪽을 택했습니다.
  doctrine_reference: δικαίωσις/δικαιόω의 법정적 용례
