  source_fidelity: 초두의 라틴어 단편 iudicati, sed는 앞 문맥이 결손된 상태이므로, 이를 ‘…아니라’로 옮겨 부정 대조를 삽입해서는 안 됩니다. iudicati는 ‘심판을 받았으나’로 보존하는 편이 제공된 원문과 영어 감사본의 ‘judged, but’에 충실합니다. mortalibus moribus egimus는 단지 ‘죽을 수밖에 없는 삶’이라기보다 ‘필멸의 방식/습속으로 살아왔다’는 표현입니다. 끝의 tu autem은 미완결로 유지해야 합니다.
  naturalness: ‘심판을 받았으나, 늘 당신의 영광을 신뢰해 온 이들을 사랑하십시오’는 원문 단편의 불완전한 연결을 억지로 보완하지 않으면서도 현대 한국어 합쇼체로 읽힙니다. ‘필멸의 방식으로 살아왔습니다’는 자연스럽고도 원문의 moribus를 보존합니다.
  terminology: gloria는 ‘영광’, confiderunt는 ‘신뢰해 온’, diligas는 기원·간청 문맥의 합쇼체 ‘사랑하십시오’로 유지할 수 있습니다. ‘필멸’은 mortalis의 핵심 의미를 정확히 전달합니다.
  issues:
