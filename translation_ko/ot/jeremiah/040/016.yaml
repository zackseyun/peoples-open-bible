  text: But Gedaliah son of Ahikam said to Johanan son of Kareah, “Do not do this thing, for you are speaking a lie about Ishmael.”
translation:
  language: ko
  text: 그러나 아히감의 아들 그달랴가 가레아의 아들 요하난에게 말했습니다. “이 일을 하지 마십시오. 당신은 이스마엘에 대해 거짓말을 하고 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת הַדָּבָר הַזֶּה
  english_pob_choice: Do not do this thing
  chosen_korean: 이 일을 하지 마십시오
  alternatives_korean:
  - 이 일을 하지 마소서
  - 이런 짓을 하지 마십시오
  - 이것을 행하지 마십시오
  lexicon: דָּבָר
  rationale: 지시대명사적 용법으로 특정 행위를 가리키므로 ‘이 일’을 택해 자연스러운 현대 한국어로 옮겼습니다.
- source_word: שֶׁקֶר
  english_pob_choice: a lie
  chosen_korean: 거짓말
  alternatives_korean:
  - 거짓
  - 허위
  lexicon: שֶׁקֶר
  rationale: 여기서는 진술의 내용이 거짓임을 직접적으로 꾸짖는 말이므로, 추상적 ‘거짓’보다 구체적인 ‘거짓말’이 더 잘 대응합니다.
- source_word: דֹבֵר אֶל
  english_pob_choice: speaking ... about
  chosen_korean: …에 대해 말하고 있습니다
  alternatives_korean:
  - …을 두고 말하고 있습니다
  - …에 관해 거짓말하고 있습니다
  lexicon: דבר
  rationale: 히브리어 전치사 אֶל이 여기서는 ‘~에 대하여’의 의미로 쓰여, 한국어에서는 ‘~에 대해’로 자연스럽게 풀었습니다.
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם
  english_pob_choice: Gedaliah son of Ahikam
  chosen_korean: 스바냐의 아들 그달랴
  alternatives_korean:
  - 아히감의 아들 그달랴
  - 그달랴
  lexicon: 고유명사/본문대조
  rationale: 마소라 본문에는 ‘아히감의 아들’로 되어 있으나, 영어 POB와의 대조 및 본 절의 통용 표기상 ‘그달랴’는 유지하고, 부친명은 원문대로 반영했습니다.
theological_decisions:
- issue: 직접 인용부의 금지 명령과 비난의 강도
  chosen_reading: 명령형을 완곡하게 약화시키지 않고 ‘하지 마십시오’로 직접 옮겼습니다.
  alternative_readings:
  - ‘그렇게 하지 마십시오’처럼 완화
  - ‘이런 일은 안 됩니다’처럼 해설적 표현
  rationale: 원문은 단순한 권고가 아니라 특정 행동을 금지하고 허위 진술을 책망하는 직설적 발화이므로, 그 긴장을 보존했습니다.
  doctrine_reference: 본문 의미 보존과 화행 강도 유지
