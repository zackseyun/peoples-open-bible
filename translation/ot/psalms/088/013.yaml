id: PSA.88.13
reference: Psalms 88:13
source:
  edition: WLC
  text: וַ/אֲנִ֤י אֵלֶ֣י/ךָ יְהוָ֣ה שִׁוַּ֑עְתִּי וּ֝/בַ/בֹּ֗קֶר תְּֽפִלָּתִ֥/י תְקַדְּמֶֽ/ךָּ׀׃
translation:
  text: But I cry to you for help, O Yahweh; in the morning my prayer comes before you.
  philosophy: dynamic
lexical_decisions:
- source_word: וַאֲנִי
  chosen: But I
  alternatives:
  - But I
  - Yet I
  lexicon: HALOT
  rationale: It conveys the contrast without the heavier English formulation “as for me.”
- source_word: אֵלֶיךָ
  chosen: to you
  alternatives:
  - unto you
  lexicon: HALOT
  rationale: The preposition expresses direction toward YHWH as the object of the cry. 'To you' is natural modern English and sufficiently formal.
- source_word: יְהוָה
  chosen: O Yahweh
  alternatives:
  - O Yahweh
  - O Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: שִׁוַּעְתִּי
  chosen: I cry to you for help
  alternatives:
  - I have cried out
  - I call for help
  - I cried for help
  lexicon: HALOT
  rationale: It explicitly represents the verb’s appeal-for-help sense.
- source_word: וּבַבֹּקֶר
  chosen: in the morning
  alternatives:
  - and in the morning
  - at morning
  lexicon: HALOT
  rationale: The prefixed conjunction links the clause, but English reads more naturally without repeating 'and' after the semicolon. 'In the morning' is the clearest idiomatic rendering.
- source_word: תְּפִלָּתִי
  chosen: my prayer
  lexicon: HALOT
  rationale: Straightforward nominal rendering; singular is retained.
- source_word: תְקַדְּמֶךָּ
  chosen: comes before you
  alternatives:
  - goes before you
  - meets you
  - confronts you
  lexicon: HALOT
  rationale: From קדם in the Hiphil, the sense is to come before, meet, or precede. With 'my prayer' as subject, 'comes before you' is idiomatic English that preserves the imagery of prayer arriving in God's presence without over-literal awkwardness.
