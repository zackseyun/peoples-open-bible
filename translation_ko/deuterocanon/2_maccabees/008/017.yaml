revisions:
- from: 그들이 자기들의 눈앞에, 거룩한 곳에 대해 불법적으로 저지른 만행과 조롱당한 도시의 학대, 그리고 조상 대대로 이어온 삶의 방식의 파괴를 떠올렸습니다.[a]
  to: 그들은 거룩한 곳에 그들이 불법하게 저지른 만행과 조롱당한 도시가 받은 학대와 조상들에게서 물려받은 삶의 질서가 무너진 일을 눈앞에 떠올렸습니다.
  rationale: 문장 구조를 현대 한국어로 다듬되, 원문의 세 병렬 목적어와 ‘눈앞에 두다’라는 동기 부여의 표현을 유지했습니다. 특히 도시가 학대의 대상임을 명확히 하고, 정치·사회적 질서까지 포괄할 수 있는 πολιτεία를 ‘삶의 질서’로 옮겼습니다.
