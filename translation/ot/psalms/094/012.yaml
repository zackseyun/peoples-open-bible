  chosen_reading: O Yah
  alternative_readings:
  - O LORD
  - Yah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Gendered representative noun הַגֶּבֶר
  chosen_reading: the man
  alternative_readings:
  - the person
  rationale: The Hebrew is masculine singular and functions as a representative individual. Per the gender-accurate policy, the masculine form is retained rather than neutralized, while the representative force may be clarified in a footnote.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4: Gender-accurate over gender-neutral.'
