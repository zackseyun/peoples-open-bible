translation:
  language: ko
  text: 누가 자기의 잘못들을 깨달을 수 있겠습니까? 숨은 허물들에서 저를 깨끗하게 하소서[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨은 죄들에서 저를 깨끗하게 하소서’ 또는 ‘감추어진 것들에서 저를 깨끗하게 하소서’. 히브리어는 화자 자신에게 알려지지 않은 허물, 다른 이들에게 감추어진 죄, 또는 일반적으로 숨겨진 것들을 가리킬 수 있습니다. ‘깨끗하게 하소서’는 ‘죄 없게 하소서’ 또는 ‘무죄로 선언하소서’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고
  - 더욱이
  - 또
  lexicon: HALOT
  rationale: 앞선 문맥에 이어지는 덧붙임의 힘을 살리면서, 현대 한국어에서 자연스럽고 문어체에 잘 맞는 연결어로 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
