id: PRO.25.22
reference: Proverbs 25:22
source:
  edition: WLC
  text: כִּ֤י גֶֽחָלִ֗ים אַ֭תָּה חֹתֶ֣ה עַל רֹאשׁ֑/וֹ וַֽ֝/יהוָ֗ה יְשַׁלֶּם לָֽ/ךְ־־׃
translation:
  text: For you will heap burning coals on his head[a], and Yahweh will reward you.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The image may signify the enemy’s painful shame at receiving kindness, or judgment upon him.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  chosen: for
  alternatives:
  - because
  - indeed
  lexicon: HALOT
  rationale: Introduces the reason for the preceding exhortation in the prior verse; 'for' preserves the explanatory connection more naturally than 'because' in English verse flow.
- source_word: גֶחָלִים
  chosen: burning coals
  alternatives:
  - coals
  - embers
  lexicon: HALOT
  rationale: Refers to live coals/fire coals. 'Burning coals' makes explicit the active image without over-paraphrasing.
- source_word: חֹתֶה
  chosen: heap
  alternatives:
  - gather
  - rake
  - carry away
  lexicon: HALOT
  rationale: The verb literally involves taking up or raking coals; in this idiom with 'on his head,' English 'heap' best conveys the resulting piling up and matches the metaphorical force recognized in context.
- source_word: עַל רֹאשׁוֹ
  chosen: on his head
  alternatives:
  - upon his head
  lexicon: HALOT
  rationale: A direct, formal rendering of the prepositional phrase; the idiom should be preserved rather than interpreted away in the main text.
- source_word: וַיהוָה
  chosen: Yahweh
  alternatives:
  - Yahweh
  lexicon: HALOT
  rationale: This brings the lexical record into agreement with the retained project rendering of the divine name.
- source_word: יְשַׁלֶּם לָךְ
  chosen: will repay you
  alternatives:
  - will reward you
  - will recompense you
  lexicon: HALOT
  rationale: The piel of שלם here conveys repayment/recompense. 'Repay you' is broad enough to include positive recompense in context, while staying close to the lexical sense. 'Reward you' is possible but slightly more interpretive.
