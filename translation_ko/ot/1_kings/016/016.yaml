  to: 그리고 그곳에 진을 치고 있던 백성이 “시므리가 반역했고 왕도 죽였다”라는 말을 들었습니다. 그러자 온 이스라엘이 그날 진영에서 오므리—이스라엘의 군대 사령관—를 왕으로 세웠습니다.
  rationale: 인용된 보고를 들었다는 원문의 לֵאמֹר 구조를 보존하도록 ‘소식’을 ‘말’로만 조정했습니다. 그 밖의 어휘와 문장 구성은 원문의 역사적·정치적 의미 및 현대 한국어 합쇼체에 적합하므로 유지했습니다.
