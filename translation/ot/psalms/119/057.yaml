  from: Yahweh[a] is my portion; I have promised to keep your words.
  to: Yahweh[a] is my portion; I have said that I will keep your words.
  rationale: אָמַרְתִּי is “I have said,” not lexically “I have promised.” In this context the saying is a resolve, and the English complement “that I will keep” naturally expresses the infinitive לִשְׁמֹר without making “promise” the verb’s asserted meaning. The existing acrostic footnote remains accurate and correctly placed.
