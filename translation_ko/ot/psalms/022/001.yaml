  lexicon: HALOT
  rationale: 시편 표제어에서 موسی적 기능을 맡은 지도자를 가리키므로, 한국어로는 자연스럽고 간결한 「지휘자에게」가 그 역할을 잘 드러냅니다.
- source_word: עַל
  english_pob_choice: according to
  chosen_korean: 에 따라
  alternatives_korean:
