  from: when he comes to be glorified among his saints and to be marveled at among all who have believed—because our testimony to you was believed—on that day.
  to: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed—because our testimony to you was believed.
  rationale: The placement of the temporal phrase 'on that day' at the very end of the sentence, separated from its verb 'comes' by two purpose clauses and a parenthetical statement, is stylistically awkward in English. While it mirrors the Greek word order, it reads like an afterthought. Moving the phrase to the beginning ('on that day when he comes...') creates a more natural and fluid English sentence, clarifying that 'on that day' frames the entire event without losing the emphasis of the Greek.
