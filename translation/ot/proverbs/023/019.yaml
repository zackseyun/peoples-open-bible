id: PRO.23.19
reference: Proverbs 23:19
source:
  edition: WLC
  text: שְׁמַע אַתָּ֣ה בְנִ֣/י וַ/חֲכָ֑ם וְ/אַשֵּׁ֖ר בַּ/דֶּ֣רֶךְ לִבֶּֽ/ךָ־׃
translation:
  text: Listen, my son, and be wise; guide your heart along the right path.
  philosophy: dynamic
lexical_decisions:
- source_word: שְׁמַע
  lemma: שׁמע
  chosen: Listen
  alternatives:
  - Hear
  lexicon: HALOT
  rationale: Imperative 2ms from שׁמע. 'Listen' communicates not merely auditory reception but heedful attention in natural modern English. 'Hear' is possible but sounds more archaic here.
- source_word: בְנִי
  chosen: my son
  alternatives:
  - my child
  lexicon: HALOT
  rationale: Vocative with 1cs suffix. The Hebrew is explicitly masculine singular and in Proverbs often reflects father-to-son instruction. Per gender-accurate philosophy, 'my son' is preferred over neutralizing to 'my child'.
- source_word: וַחֲכָם
  chosen: and be wise
  alternatives:
  - and become wise
  lexicon: HALOT
  rationale: Imperative from חכם. English idiom favors 'be wise'; 'become wise' is possible but slightly more process-oriented than the concise exhortational force here.
- source_word: וְאַשֵּׁר
  chosen: guide
  alternatives:
  - and guide
  - and make straight
  lexicon: HALOT
  rationale: In context the Piel directs or guides the heart.
- source_word: בַּדֶּרֶךְ
  chosen: along the way
  alternatives:
  - on the path
  - in the path
  lexicon: HALOT
  rationale: Natural collocation with “guide” that retains the path image.
- source_word: לִבֶּךָ
  chosen: your heart
  alternatives:
  - your mind
  - your inner self
  lexicon: HALOT
  rationale: לב in Hebrew anthropology includes thought, will, and desire, but 'heart' is the standard and theologically/literarily important rendering. Broader interpretive senses should not replace the concrete metaphor in the main text.
