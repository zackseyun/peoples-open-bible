  rationale: The Hebrew is grammatically masculine and generic. Per doctrine, gender-accurate rendering is preferred over flattening to a neutral term in the main text; a more inclusive alternative is preserved in a footnote where relevant.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: Handling the obscure term שִׁדָּה וְשִׁדּוֹת
  chosen_reading: a concubine and concubines
  alternative_readings:
