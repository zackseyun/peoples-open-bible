language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָבֶ֞ל יוֹלִ֤ךְ אֶת צִדְקִיָּ֨הוּ֙ וְ/שָׁ֣ם יִֽהְיֶ֔ה עַד פָּקְדִ֥/י אֹת֖/וֹ נְאֻם יְהוָ֑ה כִּ֧י תִֽלָּחֲמ֛וּ אֶת הַ/כַּשְׂדִּ֖ים לֹ֥א תַצְלִֽיחוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/005.yaml
  text: And he will take Zedekiah to Babylon, and there he will remain until I attend to him, declares the LORD. Though you fight against the Chaldeans, you will not succeed.
translation:
  language: ko
  text: 바빌론 왕이 시드기야를 바빌론으로 데려갈 것이며, 그는 내가 그를 찾아볼 때까지 그곳에 머물 것입니다[a]—야훼의 말씀입니다. 너희가 갈대아 사람들과 싸워도 성공하지 못할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פָּקַד은 문맥에 따라 ‘찾아보다, 살피다, 개입하다, 벌하다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈대아 사람들’은 바빌론 제국의 지배 집단을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בָבֶ֞ל יוֹלִ֤ךְ אֶת צִדְקִיָּ֨הוּ֙
  english_pob_choice: And he will take Zedekiah to Babylon
  chosen_korean: 그리고 바빌론으로 시드기야를 끌고 갈 것이며
  alternatives_korean:
  - 그리고 바빌론으로 시드기야를 데려갈 것이며
  - 그리고 바빌론으로 시드기야를 옮길 것이며
  lexicon: בבל / הלך
  rationale: יוֹלִךְ는 단순한 ‘가다’보다 강제적 이동을 드러내므로, 바빌론으로 ‘끌고 가다’로 옮겨 원문의 억류 뉘앙스를 살렸습니다.
- source_word: עַד פָּקְדִי אֹתוֹ
  english_pob_choice: until I attend to him
  chosen_korean: 내가 그를 돌볼 때까지
  alternatives_korean:
  - 내가 그를 살필 때까지
  - 내가 그에게 개입할 때까지
  - 내가 그를 방문할 때까지
  lexicon: פקד
  rationale: פָּקַד은 문맥상 심판적 ‘돌보다/살피다/처리하다’의 뜻이므로, 자연스럽지만 책임 있는 개입을 드러내는 ‘돌보다’로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares the LORD
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 여호와의 말씀입니다
  - 주님의 말씀입니다
  lexicon: נאם / יהוה
  rationale: 직접적인 여호와 이름이므로 프로젝트 기본어인 ‘야훼’를 사용했고, נְאֻם은 예언 공식에 맞게 ‘말씀입니다’로 처리했습니다.
- source_word: כִּי תִלָּחֲמוּ אֶת הַכַּשְׂדִּים לֹא תַצְלִיחוּ
  english_pob_choice: Though you fight against the Chaldeans, you will not succeed
  chosen_korean: 비록 여러분이 갈대아 사람들과 싸울지라도, 승리하지 못할 것입니다
  alternatives_korean:
  - 여러분이 갈대아 사람들과 싸워도, 성공하지 못할 것입니다
  - 여러분이 갈대아 사람들과 싸운다 해도, 뜻을 이루지 못할 것입니다
  lexicon: לחם / צלח
  rationale: כִּי가 여기서는 양보적 의미로 기능하므로 ‘비록 …일지라도’로 옮겼고, תַצְלִיחוּ는 단순 성공보다 전투의 성패를 가리켜 ‘승리하다’로 번역했습니다.
theological_decisions:
- issue: 야훼 이름의 표기
  chosen_reading: 예언자 서술의 신적 발화 표지로 ‘야훼’라고 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원어에 יהוה가 분명히 나타나며, 본 프로젝트의 기본 표기가 하나님 이름의 직접성을 가장 잘 보존합니다.
  doctrine_reference: 출애굽기 3:15; 예레미야 32:5
