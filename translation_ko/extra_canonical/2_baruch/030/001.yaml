  verdict: revise
  source_fidelity: 핵심 종말론적 순서와 의미는 충실합니다. 다만 ‘hope of him’은 한국어에서 ‘그분을 바라고’라고 하면 메시아의 도래를 기다린다는 뜻으로 좁혀질 수 있으므로, 그분을 소망의 근거·대상으로 삼는 뜻을 더 잘 보존해야 합니다.
  naturalness: 합쇼체 문장으로 전반적으로 자연스럽습니다. 그러나 ‘때가 다 이루어지고’보다 시간의 충만·완료를 나타내는 ‘때가 차고’가 현대 한국어 성서 문체에서 더 간결하고 자연스럽습니다.
  terminology: ‘메시아’, ‘영광’, ‘잠든’, ‘일어나다’는 적절합니다. ‘그분’은 앞선 메시아를 가리키는 존칭으로 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘그분을 바라고’의 의미 범위
    rationale: 영어 POB의 ‘in hope of him’ 및 그 배후 표현은 단순히 그분의 도래를 기다리는 행위보다 그분께 소망을 둔 상태를 가리킬 수 있습니다. 현재 표현은 이를 ‘그분을 기다림’으로 협소화할 여지가 있습니다.
  - severity: low
    issue: ‘때가 다 이루어지고’의 어법
    rationale: 의미상 문제는 없지만, 시간의 완료를 말하는 문맥에서는 ‘때가 차고’가 더 자연스럽고 간결하며 원문의 시간적 완료를 잘 드러냅니다.
  revised_text: 이 일들이 있은 뒤에, 메시아께서 오시는 때가 차고 그분께서 영광과 함께 돌아오시면, 그분께 소망을 두고 잠든 모든 이가 일어날 것입니다.
