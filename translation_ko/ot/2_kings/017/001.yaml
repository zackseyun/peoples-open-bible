  source_fidelity: 히브리어 본문은 아하스의 제12년에 엘라의 아들 호세아가 사마리아에서 이스라엘을 통치하기 시작하여 9년간 통치했음을 서술합니다. 번역은 시간 표지, 인명·지명, 통치 대상, 통치 개시와 기간을 모두 충실히 반영합니다.
