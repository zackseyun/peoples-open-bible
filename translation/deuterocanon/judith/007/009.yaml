lexical_decisions:
- source_word: Ἀκουσάτω
  chosen: Let ... hear
  alternatives:
  - May ... hear
  - Hear
  lexicon: BDAG
  rationale: 'Aorist imperative, third person singular. English idiom naturally renders this as a jussive request: ''Let ... hear.'' This preserves the deferential tone directed to a superior.'
- source_word: δὴ
  chosen: —
  alternatives:
  - now
  - then
  - indeed
  lexicon: BDAG
  rationale: The particle adds urgency or politeness but is often not represented by a separate English word in smooth modern translation. Its force is carried by the overall courteous imperative construction.
- source_word: λόγον
  chosen: a word
  alternatives:
  - a matter
  - a message
  - an account
  lexicon: BDAG
  rationale: The singular 'a word' is a common idiom for 'a brief statement' or 'something to say.' It is retained rather than expanded to keep close to the Greek while remaining intelligible.
- source_word: ὁ δεσπότης ἡμῶν
  chosen: our lord
  alternatives:
  - our master
  lexicon: BDAG
  rationale: δεσπότης denotes one in authority, often 'master' or 'lord.' In this courtly address to a military superior, 'our lord' fits the respectful register without implying the stronger ownership nuance that 'master' can carry in English.
- source_word: ἵνα μὴ γένηται
  chosen: so that no ... may come about
  alternatives:
  - lest there be
  - so that there may not be
  lexicon: BDAG
  rationale: This purpose clause expresses the speaker's aim in offering counsel. 'So that ... may come about' preserves the prospective sense of γένηται in natural English.
- source_word: θραῦσμα
  chosen: breach
  alternatives:
  - break
  - ruin
  - disaster
  - fracture
  lexicon: LSJ
  rationale: Literally something broken or a breaking. In the military context with 'in your force,' 'breach' best conveys a damaging break or collapse within the army without overinterpreting the exact nature of the setback.
- source_word: ἐν τῇ δυνάμει σου
  chosen: in your force
  alternatives:
  - in your army
  - in your power
  - among your forces
  lexicon: BDAG
  rationale: δύναμις can mean power, might, or military force. Here the context favors the military sense. 'Your force' stays close to the Greek singular while clearly indicating the troops under his command.
