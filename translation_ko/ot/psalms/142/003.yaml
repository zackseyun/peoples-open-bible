id: PSA.142.3
reference: Psalms 142:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶשְׁפֹּ֣ךְ לְ/פָנָ֣י/ו שִׂיחִ֑/י צָ֝רָתִ֗/י לְ/פָנָ֥י/ו אַגִּֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/003.yaml
  text: When my spirit grows faint within me[a], you know my path. On the path I walk, they have hidden a trap[b] for me.
  footnotes:
  - marker: a
    text: Or 'my meditation' / 'my musing' for 'my complaint' (Hebrew שִׂיחִי); in this lament context the sense is likely spoken complaint rather than inward reflection.
    reason: lexical_alternative
  - marker: b
    text: Or 'my trouble' / 'my affliction' for 'my distress.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제 영이 제 안에서 기운을 잃을 때[a], 주님께서는 제 길을 아십니다. 제가 걷는 길에서 그들이 저를 노리고 덫을 숨겨 놓았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 영이 제 안에서 짓눌릴 때’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘올무’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁפֹּךְ
  english_pob_choice: I pour out
  chosen_korean: 쏟아 놓습니다
  alternatives_korean:
  - 쏟아 붓습니다
  - 퍼붓습니다
  - 쏟아 냅니다
  lexicon: HALOT
  rationale: שׁפך의 ‘pour out’ 이미지를 한국어로 자연스럽게 살리되, 탄식 시편의 절박한 감정을 담아 ‘쏟아 놓다’를 선택했습니다.
- source_word: שִׂיחִי
  english_pob_choice: my complaint
  chosen_korean: 제 하소연
  alternatives_korean:
  - 제 शिकायत
  - 제 묵상
  - 제 읊조림
  - 제 호소
  lexicon: HALOT
  rationale: 이 문맥에서는 내적 묵상보다 하나님께 직접 내는 탄식과 불평의 말이 더 분명하므로, 의미를 살려 ‘하소연’으로 옮겼습니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그분 앞에
  alternatives_korean:
  - 그분 앞에서
  - 그분의 면전에서
  - 그분께
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴/임재 앞’이라는 공간적·관계적 이미지를 유지하기 위해 두 절 모두 ‘그분 앞에’로 반복해 옮겼습니다.
- source_word: צָרָתִי
  english_pob_choice: my distress
  chosen_korean: 제 고통
  alternatives_korean:
  - 제 괴로움
  - 제 환난
  - 제 곤경
  - 제 고난
  lexicon: HALOT
  rationale: צָרָה 계열의 넓은 의미를 한국어에서 가장 직접적으로 전달하는 말은 ‘고통’이며, 시편의 절박한 정서를 무리 없이 담습니다.
- source_word: אַגִּיד
  english_pob_choice: I declare
  chosen_korean: 알립니다
  alternatives_korean:
  - 말합니다
  - 선언합니다
  - 전합니다
  - 고합니다
  lexicon: HALOT
  rationale: 히필 נגד의 ‘알리다/말해 알게 하다’ 뜻을 살리면서, 기도적 진술의 형식성을 과도하게 높이지 않는 표현을 택했습니다.
theological_decisions:
- issue: '탄식의 공개성: 내면 독백이 아니라 하나님께 직접 말하는 고백으로 드러낼 것인지'
  chosen_reading: 두 동사 모두 하나님을 향한 직접 호소로 읽어, ‘그분 앞에’와 ‘알립니다’를 반복해 탄식의 대면성을 살렸습니다.
  alternative_readings:
  - 내면적 묵상에 가까운 독백으로 완화
  - ‘하소연’ 대신 중립적인 ‘말씀드립니다’ 사용
  rationale: 시편 탄식의 핵심은 고통을 하나님 앞에 드러내는 행위이므로, 문맥상 ‘complaint’의 공적·언어적 성격을 유지하는 것이 본문의 힘을 더 정확히 전달합니다.
  doctrine_reference: 시편 탄식문학의 기도적 직접성
