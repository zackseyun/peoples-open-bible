translation:
  text: 'V.1. After I had prayed in the house and sat down on the couch[i], a certain man entered, glorious
    in appearance, in a shepherd’s guise[a], wearing a white skin[j], and having a bag on his shoulders
    and a staff in his hand. And he greeted me[b], and I returned his greeting.


    V.2. And immediately he sat beside me and says to me, “I have been sent by the most venerable angel[k],
    that I may dwell with you for the rest of the days of your life.”


    V.3. I thought that he had come to test me[g], and I say to him, “Who then are you? For I,” I say,
    “know the one to whom I was handed over[l].” He says to me, “Do you not recognize me?” “No,” I say.
    “I,” he says, “am the Shepherd to whom you were handed over.”


    V.4. While he was still speaking, his appearance was changed[m], and I recognized him, that he was
    the one to whom I had been handed over, and immediately I was confounded, and fear seized me, and
    I was completely crushed with grief, because I had answered him so wickedly and senselessly.


    V.5. But he answered me and says, “Do not be confounded, but be strengthened in my mandates[c], which
    I am about to command you. For I have been sent,” he says, “that I may show you again all the things
    you saw before—the very main points[e] that are beneficial for you[f]. First of all, write my mandates
    and the parables[d]; but the other things, as I show you, so you will write.” “For this reason,” he
    says, “I command you first to write the mandates and parables, so that you may read them readily at
    hand and be able to keep them[n].”


    V.6. So I wrote the mandates and the parables, just as he commanded me.


    V.7. If then, having heard them, you keep them and walk in them and do them[o] with a pure heart[p],
    you will receive from the Lord all that he promised you; but if, having heard, you do not repent[h],
    but still add to your sins, you will receive from the Lord the opposite things[q]. The Shepherd, the
    angel of repentance[r], commanded me to write all these things in this way.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In a shepherd’s guise restores the earlier documented choice for schēmati poimenikō, also in
      shepherd’s attire or dress. Guise here describes the presented appearance and clothing; it does
      not add an assertion of disguise or deceit. White skin, bag and staff belong to that description;
      their presence does not itself establish a new doctrine of purity.
    reason: lexical_alternative
  - marker: b
    text: He greeted me and I returned his greeting retain both reciprocal actions. Aspazomai can be associated
      with different greeting customs, but the selected wording does not specify a kiss or another added
      gesture.
    reason: lexical_alternative
  - marker: c
    text: Mandates retains the documented choice for entolai, also commands or commandments, and the repeated
      my. It is the work’s customary division label; the Greek noun alone does not exclude resemblance
      to other commandments or prove a special non-Mosaic sense.
    reason: lexical_alternative
  - marker: d
    text: Parables retains parabolai, also comparisons or similitudes, associated with the work’s section
      often titled Similitudes. The first write instruction, repeated first instruction and the narrator’s
      subsequent writing all retain both mandates and parables. Sinaiticus25.5 has an extra first-hand
      paras before parabolas, deleted by ca;25.6’s first-hand parapodas is corrected to parabolas. These
      are separate correction layers, not independent votes.
    reason: textual_variant
  - marker: e
    text: The very main points renders auta ta kephalaia as principal matters or summaries in apposition
      to the things shown before. It replaces the current record’s especially the main points, returning
      to the earlier archived wording rather than adding an unexpressed ranking. Chapters or headings
      are lexical possibilities, not a claim about modern numbered chapters. Sinaiticus25.5 has tauta,
      these, where the selected print has panta, all; the main text retains all.
    reason: lexical_alternative
  - marker: f
    text: You in beneficial for you is plural, hymin; the earlier address to Hermas uses singular forms.
      The final conditions and promises also address a plural audience. The note marks this shift without
      changing every you into an invented singular recipient or adding a separate group name.
    reason: lexical_alternative
  - marker: g
    text: I thought ... test me retains the narrator’s supposition, not an assertion of the shepherd’s
      actual intention. Testing, trying and tempting are lexical alternatives for ekpeirazō. The recognition
      exchange supports examination as an interpretation, but the English does not add an absolute claim
      that the verb can never concern temptation.
    reason: lexical_alternative
  - marker: h
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: i
    text: Couch retains the earlier klinē choice; bed or reclining couch are alternatives. It is the narrator
      who sits on it after praying. The adjacent clothing note formerly attached here has moved to the
      shepherd’s guise, so couch is not a description of his clothing.
    reason: lexical_alternative
  - marker: j
    text: White skin refers to the worn animal hide or pelt in the clothing description, not the man’s
      bodily complexion. The selected Greek and Sinaiticus25.1 have derma leukon without naming an animal;
      Athos PlateIV adds aigeion, goat, and the Ethiopic edition’s Latin rendering has goat skin. Vulgata
      printed34 instead has a white pallium, cloak, while Palatina printed67 has pelle, hide. Those are
      not identical lexical corroborations, and goat is not silently added to the main text.
    reason: textual_variant
  - marker: k
    text: Most venerable angel retains semnotatou angelou, also most august or most revered messenger,
      without naming the sender as God, Christ or another specific figure. The Ethiopic edition’s mediated
      Latin printed127 instead says angel of justice; Vulgata and Palatina have venerable messenger without
      an exact superlative. The promise is to dwell with the narrator for the remaining days of his life,
      not a newly added fixed period.
    reason: textual_variant
  - marker: l
    text: Handed over restores the earlier documented paradidōmi choice consistently in the narrator’s
      claim, the shepherd’s reply and the later recognition. Entrusted remains a possible interpretation;
      the selected passive does not identify an otherwise unstated agent who handed him over. Sinaiticus25.3’s
      first-hand ti is expanded by ca to tis ei, who are you; spelling and ending corrections in the recognition
      exchange are not a new speaker.
    reason: lexical_alternative
  - marker: m
    text: His appearance changed while he was still speaking, leading to recognition, immediate confusion,
      fear and complete grief because of the narrator’s wicked and senseless reply. All links remain;
      the grief is not substituted for the later repentance warning or made its only meaning. The selected
      text does not state a new physical identity or describe what the changed face looked like.
    reason: lexical_alternative
  - marker: n
    text: Read them readily at hand retains hypo cheira and the purpose of being able to keep the instructions.
      Clement of Alexandria, Stromata1.1.1, in the consulted Stahlin/Perseus Greek opening preserves the
      short purpose clause beginning hina hypo cheira and ending phylaxai autas. This is bounded quotation
      evidence for Vision5.5, not the entire Vision5.7 warning or a continuous Hermas manuscript. Vulgata
      printed35 and Palatina printed69 instead describe repeated reading, subinde, while the Ethiopic
      edition’s Latin rendering has earlier reading and an editorial word proposal. The selected hand
      idiom is not harmonized to those versions.
    reason: textual_variant
  - marker: o
    text: The first condition retains hearing, keeping, walking in and doing the instructions; the promise
      depends on that complete sequence, not hearing alone. Athos PlateIV adds me after having heard in
      the first condition. Both conditions and the final direction to write remain part of the narrator’s
      report here, not unmarked new speech by another person.
    reason: textual_variant
  - marker: p
    text: With a pure heart retains the selected singular kardiai and its connection to doing the instructions.
      Sinaiticus25.7 and Athos retain the heart expression. Vulgata printed35 and Palatina printed69 have
      mente pura, pure mind; the Ethiopic edition’s mediated Latin printed128 describes purifying your
      hearts. They are disclosed without rewriting the selected noun, number or construction.
    reason: textual_variant
  - marker: q
    text: The second condition retains hearing, not repenting, still adding to sins, and receiving from
      the Lord the opposite things. It does not replace the named sins with mere grief or omit the negative
      condition. Vulgata and Palatina use a do-repentance formulation and adversa, adverse things. The
      Ethiopic edition’s Latin rendering printed128 instead has non purificaveritis, not purifying yourselves,
      and retribution; that is not exact lexical agreement with repent or opposite. The selected paired
      outcomes and both references to the Lord remain.
    reason: textual_variant
  - marker: r
    text: Angel of repentance retains the work’s own title for the Shepherd, with messenger as a lexical
      alternative for angelos; it does not identify him with the most venerable sender in paragraph2.
      Both repent and this repentance title keep the contextual policy, distinct from the narrator’s earlier
      grief. Sinaiticus25.7 lacks all in the closing instruction and has first-hand egrapse corrected
      by S1 to grapse with an extra article removed; the selected all these things and infinitive writing
      construction remain without treating all correction layers as identical.
    reason: textual_variant
lexical_decisions:
- source_word: σχήματι ποιμενικῷ
  chosen: in a shepherd’s guise
  alternatives:
  - in shepherd’s dress
  - in shepherd’s form
  lexicon: LSJ
  rationale: Restore the earlier documented guise rendering; attire/dress remain alternatives, without
    adding deception.
- source_word: δέρμα λευκόν
  chosen: a white skin
  alternatives:
  - a white hide
  - a white leather cloak
  lexicon: LSJ
  rationale: δέρμα is an animal skin/hide; context suggests garment of skin. Retaining "skin" preserves
    the concrete image.
- source_word: πήραν ἔχων ἐπὶ τῶν ὤμων
  chosen: with a bag on his shoulders
  alternatives:
  - with a wallet on his shoulders
  - with a scrip over his shoulders
  lexicon: LSJ
  rationale: πήρα is a leather pouch/scrip (esp. of travelers/shepherds). "Bag" is accessible modern English;
    'scrip' is archaic.
- source_word: ῥάβδον εἰς τὴν χεῖρα
  chosen: a staff in his hand
  alternatives:
  - a rod in his hand
  lexicon: BDAG
  rationale: ῥάβδος can be rod/staff. Given shepherd imagery, "staff" fits best.
- source_word: ἠσπάσατό με
  chosen: he greeted me
  alternatives:
  - he saluted me
  - he embraced me
  lexicon: BDAG
  rationale: ἀσπάζομαι commonly means to greet/salute; physical embrace is not explicit here.
- source_word: παρεκάθισέν μοι
  chosen: he sat down beside me
  alternatives:
  - he sat down with me
  - he sat by me
  lexicon: LSJ
  rationale: παρα-καθίζω conveys sitting down near/beside someone. "Beside" captures proximity.
- source_word: σεμνοτάτου ἀγγέλου
  chosen: the most venerable angel
  alternatives:
  - the most august angel
  - the most noble angel
  - the most holy angel
  lexicon: BDAG
  rationale: σεμνός denotes dignity/augustness. "Venerable" communicates solemn dignity without conflating
    with "holy" (ἅγιος).
- source_word: οἰκήσω μετὰ σοῦ
  chosen: to dwell with you
  alternatives:
  - to live with you
  - to stay with you
  lexicon: BDAG
  rationale: οἰκέω often denotes dwelling/settled presence; "dwell" preserves theological resonance of
    ongoing presence.
- source_word: ἐκπειράζων με
  chosen: testing me
  alternatives:
  - tempting me
  - trying me
  lexicon: BDAG
  rationale: ἐκπειράζω means to test thoroughly; "testing" avoids the moral connotation of enticing to
    sin that "tempting" can carry.
- source_word: ᾧ παρεδόθην
  chosen: to whom I was handed over
  alternatives:
  - to whom I was entrusted
  - to whom I was delivered
  lexicon: BDAG
  rationale: Restore the prior handed-over rendering consistently in all three connected statements; entrusted
    remains a contextual alternative and no unstated agent is named.
- source_word: ἠλλοιώθη ἡ ἰδέα αὐτοῦ
  chosen: his appearance was changed
  alternatives:
  - his form was altered
  - his look was transformed
  lexicon: LSJ
  rationale: ἰδέα is outward appearance/form. "Appearance was changed" is clear and literal.
- source_word: συνεχύθην
  chosen: I was confounded
  alternatives:
  - I was thrown into confusion
  - I was bewildered
  lexicon: LSJ
  rationale: συγχέω in passive indicates confusion/embarrassment. "Confounded" retains elevated tone.
- source_word: συνεκόπην ἀπὸ τῆς λύπης
  chosen: I was completely crushed with grief
  alternatives:
  - I was utterly crushed with grief
  - I was cut down by grief
  lexicon: LSJ
  rationale: συνκόπτω metaphorically of being shattered; "broken down" plus "with grief" conveys intensity;
    "completely" renders ὅλος.
- source_word: πονηρῶς καὶ ἀφρόνως
  chosen: wickedly and senselessly
  alternatives:
  - evil and foolishly
  - badly and foolishly
  lexicon: BDAG
  rationale: πονηρός = wicked/evil; ἄφρων = senseless/foolish. Pairing retains moral and cognitive nuance.
- source_word: ἰσχυροποιοῦ ἐν ταῖς ἐντολαῖς μου
  chosen: be strengthened in my mandates
  alternatives:
  - be made strong by my commandments
  - become strong in my commands
  lexicon: LSJ
  rationale: ἰσχυροποιέω = make strong; middle imperative urges being strengthened. ἐντολή is rendered
    "mandate" here to reflect Hermas’s internal section title and maintain consistency across the work.
- source_word: κεφάλαια
  chosen: main points
  alternatives:
  - headings
  - chief matters
  - chapters
  lexicon: LSJ
  rationale: κεφάλαιον can denote a principal point or summary. "Main points" fits the explanatory sense
    without implying book chapters.
- source_word: σύμφορα
  chosen: beneficial
  alternatives:
  - profitable
  - advantageous
  lexicon: BDAG
  rationale: σύμφορος means beneficial/advantageous. "Beneficial" is clear and idiomatic.
- source_word: ὑπὸ χεῖρα ἀναγινώσκῃς
  chosen: read them readily at hand
  alternatives:
  - read them at hand
  - keep them at the ready to read
  lexicon: LSJ
  rationale: Retain the hand idiom and able-to-keep purpose; bounded ClementStromata1.1.1 quotation covers
    this clause only.
- source_word: φυλάξαι
  chosen: keep
  alternatives:
  - observe
  - guard
  lexicon: BDAG
  rationale: φυλάσσω in moral instruction often = keep/observe commandments. "Keep" is concise and standard.
- source_word: πορευθῆτε ἐν αὐταῖς
  chosen: walk in them
  alternatives:
  - live by them
  - conduct yourselves in them
  lexicon: BDAG
  rationale: πορεύομαι with ἐν conveys conduct of life. "Walk in" retains biblical ethical metaphor common
    in early Christian texts.
- source_word: ἐργάσησθε αὐτὰς
  chosen: do them
  alternatives:
  - do them
  - work them out
  lexicon: BDAG
  rationale: ἐργάζομαι of doing/working deeds; "put into practice" connects hearing to doing, matching
    paraenetic tone.
- source_word: ἀπολήμψεσθε ... τὰ ἐναντία
  chosen: you will receive ... the opposite
  alternatives:
  - you will receive ... what is contrary
  - you will receive ... the contrary things
  lexicon: BDAG
  rationale: ἐναντίος = opposite/contrary. Rendering preserves antithetical structure.
- source_word: ὁ ποιμήν ... ὁ ἄγγελος τῆς μετανοίας
  chosen: the Shepherd—the angel of repentance
  alternatives:
  - the shepherd, the messenger of repentance
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial
    assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
