    text: Or “those who pay regard to empty vanities.”
    reason: literal_alternative
translation:
  language: ko
  text: 저는 헛된 것들을 붙드는 자들을 미워하지만, 저는 야훼를 신뢰합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛된 것들’은 ‘헛된 우상들’, ‘거짓된 허무한 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/יָדְ/ךָ
  english_pob_choice: Into your hand
  chosen_korean: 주님의 손에
  alternatives_korean:
  - 주님의 손 안에
  - 주님의 손으로
  lexicon: HALOT
  rationale: ב + ‘손’은 신뢰와 보호를 향한 위탁을 나타내는 관용으로, 한국어에서는 ‘~의 손에 맡기다’가 가장 자연스럽고 원문의 위탁 의미를 잘 살립니다.
- source_word: אַפְקִיד
  english_pob_choice: I commit
  chosen_korean: 맡깁니다
  alternatives_korean:
  - 위탁합니다
  - 부탁합니다
  lexicon: HALOT
  rationale: 히필 פקד는 여기서 단순 전달이 아니라 책임 있게 맡기는 뜻이므로, 현대 한국어의 ‘맡기다’가 의도와 정서를 가장 분명하게 전달합니다.
- source_word: רוּחִי
  english_pob_choice: my spirit
  chosen_korean: 제 영
  alternatives_korean:
  - 제 정신
  - 제 목숨
  lexicon: HALOT
  rationale: רוּחַ는 여기서 생명 전체를 하나님께 맡기는 개인적 실재를 가리키므로, ‘영’이 직역성과 신학적 무게를 함께 유지합니다.
- source_word: אֱמֶת
  english_pob_choice: God of truth
  chosen_korean: 진리의 하나님
  alternatives_korean:
  - 참되신 하나님
  - 신실하신 하나님
  lexicon: HALOT
  rationale: אֱמֶת은 ‘진리/신실함/신뢰성’을 모두 포괄할 수 있어, 본문은 ‘진리의 하나님’으로 두어 직접성을 살리고 대안 의미는 각주 없이도 문맥상 열어 둡니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주 야훼
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 여호와 대신 신명 표기인 ‘야훼’를 따르고, 호칭어 ‘주’를 덧붙여 시편의 직접 호소를 한국어 호격으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시편 31:6의 이중 진술(위탁과 구속)의 관계
  chosen_reading: 영을 주님의 손에 맡기고, 이미 속량하신 하나님께 신뢰를 고백하는 두 문장을 병렬로 유지했습니다.
  alternative_readings:
  - 한 문장으로 매끄럽게 합쳐 표현하기
  - ‘구원하셨다’로 완화하기
  rationale: 히브리어는 위탁과 구속을 연속적으로 제시하므로, 이를 합쳐버리면 시인이 현재의 의탁과 과거의 구속을 함께 붙드는 긴장이 약해집니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
- issue: אֱמֶת의 의미 범위
  chosen_reading: ‘진리의 하나님’으로 본문을 두고, 신실함의 뉘앙스는 ‘하나님’이라는 호칭 안에서 문맥적으로 열어 두었습니다.
  alternative_readings:
  - 신실하신 하나님
  - 참되신 하나님
  rationale: אֱמֶת은 단일한 의미로 환원되기보다 진리와 신실함을 함께 담을 수 있으므로, 본문에서는 가장 투명한 표현을 택하되 의미의 긴장을 과도하게 해소하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
