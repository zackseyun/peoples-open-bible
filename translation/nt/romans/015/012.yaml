  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
translation:
  text: And again Isaiah says, “The root of Jesse will appear[a], the one who rises to rule the Gentiles; in him the Gentiles will hope[b].”
