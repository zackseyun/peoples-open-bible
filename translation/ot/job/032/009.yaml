  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: mistranslation
  tier: 1
  from: It is not the many who are wise[a], nor the old who understand justice.
  to: It is not the great who are wise, nor the old who understand judgment[a].
  rationale: The proposal rightly identifies that “the many” is unlikely in this immediate argument, but it over-specifies רַבִּים as “the old.” In this contrast with זְקֵנִים, the term more naturally denotes the great or prominent, not a second near-synonym for the aged. “Judgment” is a suitably broad and source-near rendering of מִשְׁפָּט; “what is right” is possible but more interpretive. The lexical note must mark “judgment,” not “wise.”
- timestamp: '2026-11-09T18:04:42Z'
  adjudicator: gpt-6.1-sol-meaning-pass
