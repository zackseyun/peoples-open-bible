id: JOB.20.25
reference: Job 20:25
source:
  edition: WLC
  text: שָׁלַף֮ וַ/יֵּצֵ֪א מִ/גֵּ֫וָ֥ה וּ֭/בָרָק מִֽ/מְּרֹרָת֥/וֹ יַהֲלֹ֗ךְ עָלָ֥י/ו אֵמִֽים׃
translation:
  text: He draws it out of his body; the gleaming weapon emerges from his gallbladder[a], and terrors come upon him.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the gleam comes out of his gall”; “gall” here most likely refers to the gallbladder.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַף
  chosen: He draws it out
  alternatives:
  - He draws it out
  - It is drawn out
  lexicon: HALOT
  rationale: The verb commonly describes drawing a weapon; “draws it out” is more idiomatic than “pulls it out” in this context.
- source_word: וַיֵּצֵא
  chosen: and it comes
  alternatives:
  - and it goes out
  - and it comes out
  lexicon: HALOT
  rationale: The verb is 'go/come out.' English idiom with the preceding verb favors 'comes'/'comes out.' I chose 'comes' because the following phrase already specifies emergence from the body.
- source_word: מִגֵּוָה
  chosen: from his body
  alternatives:
  - from his back
  - from his torso
  lexicon: HALOT
  rationale: גֵּוָה refers to the body or torso. 'Body' is the clearest modern English rendering here and avoids over-specifying anatomy.
- source_word: וּבָרָק
  chosen: the flashing point
  alternatives:
  - and a flash
  - and lightning
  - the gleaming blade
  lexicon: HALOT
  rationale: בָּרָק literally denotes lightning or flashing brightness. In this context, parallel to a weapon being pulled from the body, it likely refers metonymically to the gleaming, flashing point or blade. 'The flashing point' preserves the vivid image while fitting the weapon context.
- source_word: מִמְּרֹרָתוֹ
  chosen: from his gall
  alternatives:
  - from his bitterness
  - from his gallbladder
  lexicon: HALOT
  rationale: The noun can denote gall/bile and by extension bitterness. In this bodily injury context, the anatomical sense is primary. 'Gall' is concise and preserves the visceral force without requiring the more clinical 'gallbladder.'
- source_word: יַהֲלֹךְ עָלָיו
  chosen: come upon him
  alternatives:
  - goes upon him
  - moves against him
  - falls on him
  lexicon: HALOT
  rationale: הלך with על can express something coming over or upon someone. 'Come upon him' is idiomatic English and suits the onset of dread.
- source_word: אֵמִים
  chosen: terrors
  alternatives:
  - dread
  - horrors
  lexicon: HALOT
  rationale: The plural noun denotes terrors or dreadful things. 'Terrors' best preserves the plural intensity and conventional sense.
- source_word: וַיֵּצֵא מִגֵּוָה
  chosen: and it comes out of his body
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This directly and naturally expresses the weapon's emergence.
- source_word: וּבָרָק מִמְּרֹרָתוֹ
  chosen: the gleaming blade comes out of his gall
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: בָרָק literally evokes a flash or gleam and metonymically the gleaming weapon; “blade” fits the context without the unsupported precision of “point.”
