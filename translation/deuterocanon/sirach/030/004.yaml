translation:
  text: His father has died, yet it is as though he had not died, for he has left behind a son like himself.
  philosophy: dynamic
lexical_decisions:
- source_word: ἐτελεύτησεν
  chosen: has died
  alternatives:
  - has come to his end
  - has passed away
  lexicon: LSJ
  rationale: The verb means 'to come to an end' and in context plainly refers to death. 'Has died' is direct, natural English and avoids euphemism while preserving the completed event.
- source_word: ὁ πατήρ
  chosen: his father
  alternatives:
  - the father
  lexicon: LSJ
  rationale: With αὐτοῦ, the sense is possessive rather than generic. 'His father' is the idiomatic and contextually precise rendering.
- source_word: ὡς οὐκ ἀπέθανεν
  chosen: as though he had not died
  alternatives:
  - as if he did not die
  - as though he had not passed away
  lexicon: LSJ
  rationale: ὡς introduces comparison, not literal denial. English past perfect ('had not died') fits the retrospective comparison after the father's death.
- source_word: ὅμοιον
  chosen: one like himself
  alternatives:
  - someone like him
  - an equal to him
  lexicon: LSJ
  rationale: The adjective is neuter singular here but functions substantivally with an implied person/offspring. 'One like himself' preserves the filial sense without over-specifying 'son' beyond the Greek wording.
- source_word: κατέλιπεν
  chosen: has left behind
  alternatives:
  - left
  - bequeathed
  lexicon: LSJ
  rationale: The verb means 'left behind' in the sense of surviving posterity. 'Has left behind' makes explicit the continuing presence of the child after the father's death.
- source_word: μετʼ αὐτόν
  chosen: after him
  alternatives:
  - behind him
  - to succeed him
  lexicon: LSJ
  rationale: 'The phrase is temporal/sequential: the offspring remains after the father. ''After him'' is concise and natural.'
