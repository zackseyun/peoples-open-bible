  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֶ֣בֶל הֵ֔מָּה מַעֲשֵׂ֖ה תַּעְתֻּעִ֑ים בְּ/עֵ֥ת פְּקֻדָּתָ֖/ם יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/015.yaml
  text: They are vanity, a work of mockery; at the time of their punishment they will perish.
translation:
  language: ko
  text: 그들은 헛것이며 조롱의 산물입니다. 그들이 처벌을 받을 때에 멸망할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶבֶל
  english_pob_choice: vanity
  chosen_korean: 헛것
  alternatives_korean:
  - 허무
  - 공허함
  lexicon: הבל
  rationale: 실체 없고 덧없는 존재를 가리키는 말로, ‘허무’보다 사물의 공허함과 우상성에 더 직접적인 ‘헛것’을 택했습니다.
- source_word: מַעֲשֵׂה תַּעְתֻּעִים
  english_pob_choice: a work of mockery
  chosen_korean: 조롱거리 같은 작품
  alternatives_korean:
  - 조롱의 작품
  - 희롱의 산물
  lexicon: מעשה / תעתועים
  rationale: חָסר로서의 우상 제작물을 드러내기 위해 ‘작품’을 살리고, תעתועים의 조롱·기만의 뉘앙스를 ‘조롱거리’로 옮겼습니다.
- source_word: פְּקֻדָּה
  english_pob_choice: punishment
  chosen_korean: 벌
  alternatives_korean:
  - 징계
  - 형벌
  lexicon: פקד
  rationale: 문맥상 우상들에게 임하는 심판적 처분을 가리키므로, 보다 구어적이면서도 재판적 의미를 유지하는 ‘벌’을 사용했습니다.
- source_word: יֹאבֵדוּ
  english_pob_choice: they will perish
  chosen_korean: 멸망할 것입니다
  alternatives_korean:
  - 사라질 것입니다
  - 망할 것입니다
  lexicon: אבד
  rationale: 단순 소멸보다 심판 아래의 완전한 파멸을 드러내는 동사로 ‘멸망하다’를 선택했습니다.
theological_decisions:
- issue: 우상에 대한 평가의 강도
  chosen_reading: ‘헛것’과 ‘조롱거리 같은 작품’으로, 우상이 실재 능력이나 존엄이 없는 인간 제작물임을 강하게 드러냈습니다.
  alternative_readings:
  - ‘허무’로 완화
  - ‘기만의 작품’으로 일반화
  rationale: 본문은 우상의 무가치함을 단순 부정이 아니라 조롱의 대상으로 묘사하므로, 한국어에서도 그 풍자성과 신학적 폄하를 보존했습니다.
  doctrine_reference: 우상숭배 비판 / 야훼의 유일신성
