theological_decisions:
- issue: 다윗 표제의 소속 의미
  chosen_reading: ‘다윗의 시’로 옮겨, 저자·헌정·연관 가능성을 단정하지 않았습니다.
  alternative_readings:
  - 다윗이 지은 시
  - 다윗을 위한 시
  rationale: 히브리어 לְדָוִד는 표제에서 복수의 관계를 가질 수 있으므로, 본문이 강제하지 않는 저자 단정을 피하는 것이 주해적으로 더 안전합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
