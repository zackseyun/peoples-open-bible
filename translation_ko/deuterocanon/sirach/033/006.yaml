revisions:
- from: 당신 외에는 하나님이 없으시기 때문입니다, 주님. 표징들을 새롭게 하시고 이적들을 바꾸어 주십시오.[a]
  to: 주님, 주님 외에는 하나님이 없으시기 때문입니다. 표징들을 새롭게 하시고 이적들을 바꾸어 주십시오.
  rationale: The revision moves the vocative to a natural Korean position and replaces the less appropriate pronoun ‘당신’ with ‘주님,’ while preserving the source’s exclusive confession, causal connective, parallel imperatives, and formal-polite petition. The unnecessary explanatory footnote is removed.
  reviewer_model: gpt-5.6-terra
