translation:
  text: 'I came into the garden of righteousness and saw [ከሐክቲሆሙ, meaning unclear][a] in connection with those trees:
    many large trees were growing there, with a pleasant fragrance[b]. They were large, their beauty was abundant,
    and they were glorious. I also saw the tree of wisdom; when people eat from it, they know great wisdom[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: 'The bracket marks uncertainty in translation, not a gap in the printed Geʿez. Dillmann, column 824, calls
      the word obscure and doubtful. His 1853 commentary (p. 135) says his suggestion of variety came from context.
      His 1851 edition prints a longer form; Flemming (1902, p. 36) prints a shorter form like Charles. Neither
      settles the meaning. “In connection with” signals only that “those trees” follows the obscure word; their
      exact grammatical relation is uncertain. No spatial gloss is supplied from comparison texts: the relevant
      distance wording in the edited Aramaic 4Q206 transcription is largely restored in brackets.'
  - marker: b
    reason: lexical_alternative
    text: 'Dillmann, column 1309, cites this verse for the scent noun with “pleasant.” The Geʿez has “their fragrance,”
      not a numeral. The two successive tree forms are both retained in the source and represented by “those trees:
      many large trees.” The later size, abundant beauty, and glory are separate descriptions. No tree of life is
      added.'
  - marker: c
    reason: lexical_alternative
    text: “When people eat” renders the eating gerund with a plural subject; “know” does not add a separate act
      of acquiring wisdom. “Great” is read with the adjacent “wisdom.” Dillmann, column 1229, lists this noun as
      both masculine and feminine, and his Grammar §§130 and 188 allow gender variation for abstract and non-personal
      nouns. This supports the nearby attachment without making it the only possible reading.
