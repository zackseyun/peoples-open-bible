  category: meaning_retranslation
  from: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
  to: But if you persist in opposing me[a] and refuse to listen to me, I will strike you sevenfold more, in keeping with your sins.
  rationale: The documented decisions consistently favor opposition as the contextual meaning of קֶרִי and preserve the proportional force of כְּחַטֹּאתֵיכֶם. I retain those gains but translate the conduct idiom directly, noting the serious alternative understanding of the uncertain term.
