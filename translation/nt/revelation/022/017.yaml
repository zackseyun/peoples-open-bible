  from: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
  to: The Spirit and the bride say, “Come[a].” Let anyone who hears say, “Come.” Let anyone who is thirsty come; let anyone who desires it take the water of life without cost.
