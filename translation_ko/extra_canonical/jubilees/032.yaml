  language: en
  yaml_path: translation/extra_canonical/jubilees/032.yaml
  text: '1[5-6]. And Judah rejoiced, and he blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be recorded for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them."

    2. And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth from everything that had come with him, from people to cattle, from gold to all possessions, and he took and tithed from everything.

    3. And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons from among him, and Levi came up in the LORD’s portion, and his father clothed him

    4. with priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar as sacrifices from the cattle fourteen oxen and twenty-eight rams, and forty-nine sheep and seven lambs and twenty-one kids,

    5. from the land of Gilead. And Jacob concealed his intention from Laban and did not tell him. And in the fourth week, in the seventh year, Jacob turned back toward Gilead on the first day of the month, in the tenth year; and Laban was told, and he pursued after him and overtook Jacob at the mountain of Gilead in the third month, in the thirteenth year. But the LORD did not permit him to harm Jacob, for he appeared to him in a dream by night and spoke to Laban for Jacob’s sake. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent at the mountain of witness,

    6. from the prayer which he had prayed, that he should tithe together with their sacrifices and their drink offerings. And when the fire had consumed the burnt offering, he offered for the sacrifice of deliverance two oxen and four rams and four sheep and five he-goats and four yearling sheep.

    7[10-12]. Therefore thus it is ordained in Israel concerning a daughter of Israel who has been defiled: and if there is a man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed disgrace in Israel; and the woman

    8. they shall burn with fire, because she has defiled the name of her father’s house, and she shall be rooted out from Israel. And let no fornication or uncleanness be found in Israel through all the days of the generations of the earth, for Israel is holy to the LORD; and everyone who defiles it shall surely die; they shall stone him with stones.

    9. This ordinance is for testimony forever, according to this testimony. And formerly they used to call the land of Gilead the land of the Rephaim, because it is the land of the Rephaim; and Rephaim were born there, giants whose height was nine cubits, and eight cubits, and down to seven cubits.

    10. Whoever defiles shall surely die, and he shall be stoned with stones. And there is no limit of days for this law, and no remission and no atonement, except that they root out the man who has defiled his daughter in the midst of all Israel, because from his seed he has given to Molech and has acted wickedly by defiling it.

    11. Their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon. And the LORD judged them according to their evil deeds, because they were very wicked, and he caused the Amorites to dwell in their place, evil and sinful, and there is no people today that has completed the full measure of their sins as they did, and they have no longer any

    12. longevity, and there remained to them no more than twenty-six years, from the twenty-seventh year onward. For in its year seed is eaten until the days of the harvest of the twenty-eighth year, and wine until the year of

    13. "Let us not give our daughter to a man who has a foreskin, for that is a reproach to us." And it is a reproach to Israel for those who give and for those who take from the daughters of the nations, because it is unclean,

    14. and so are your children through all the ages. And may the LORD give to you and to your seed greatness of heart for his glory; and may he bring you and your seed near to him from all flesh, so that you may minister in his sanctuary like the angels of the presence and like the holy ones. Like them shall the seed of your sons be for glory and greatness

    15. above the daughters of the nations. And if there is any from your daughters who gives herself to a man from any of the nations, plague upon plague shall be upon her, and curse upon curse; and all this plague and curse shall come if he does this thing, and if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together shall be judged for all the uncleanness and profanation.

    16. The LORD will put in their mouths that they may bless all the seed of the beloved. He has called you from among them, as Levi, and in truth he has called you to draw near to the LORD, that you may be his and that all the sons of Jacob may eat at your table, and you and your sons shall eat, and for all

    17. every man and woman in Israel who defiles his sanctuary. Because of this I have commanded you, saying, "Bear this testimony over Israel: see what happened to Shechem and to his sons, how they were delivered into the hands of the two sons of Jacob, and they killed them with pain, and it was reckoned to them as righteousness, and it was written down for them as righteousness."

    18. Blessed be the one who blesses you, and all the people who curse you shall be cursed. And to Judah he said, "May the LORD give you strength and power to tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go forth and travel through all the earth and regions. Then nations will fear before your face,

    19. all the children of men. And I will give to your seed all the earth that is under heaven, and they will rule among all the nations as they desire; and after this they will gather all the earth and inherit it."

    20. And through you the salvation of Israel will be found. And when you sit on the throne of honor of your righteousness, there will be great peace for all the seed of the sons of the beloved. Whoever blesses you shall be blessed, and all who hate you and afflict you and also curse you shall be destroyed and cut off."

    21. And he went up into heaven. And he saw in a vision of the night, and behold, an angel was descending from heaven, and in his hands were tablets, and he gave them to Jacob, and he read them and learned everything written in them that would happen to him and to his sons through all the ages. And he showed him everything written on the tablets and said to him, "Do not build this place, and do not make here an eternal sanctuary, and do not dwell here, for this is not the place. Go to the house of Abraham your father’s father, and dwell with Isaac your father until the day of your father’s death. For in Egypt you will die in peace, and in this land you will be buried in honor in the tomb of your fathers, with Abraham and Isaac. Do not fear, for as you have seen and read, so shall everything be. And you also, write down everything as you have seen and read." And Jacob said, "Lord, how shall I remember everything that I have read and seen?" And he said to him, "I will bring everything to
    your remembrance." And he went up from him, and he awoke from his sleep and remembered everything that he had read and seen, and he wrote down all the matters that he had read and seen. And there he celebrated one more day, and he observed it according to all the days that they used to celebrate in former times, and he called its name Addition, because that day had been added, and they had formerly called it a feast. And thus it was revealed that it should be so, and it is written in the heavenly tablets concerning this, that it was disclosed to him that he should celebrate it and add it to the seven days of the feast. And its name was called Addition, because it was appended to the days of the feast, according to the number of the days of the year. And on the night of the thirteenth of this month Deborah, Rebekah’s nurse, died, and they buried her below the city, under the oak by the river, and they called the name of that place the River of Deborah; and the oak, Deborah’s Oak. And
    Rebekah went and entered her house to Isaac her father, and Jacob sent by her hand rams and sheep and goats, that she might bring them to his father’s house. And he said to her, "Let us go to every place, and do not travel with you." And Jacob blessed the God of Isaac his father and the God of Abraham, the father of his father, and he arose and loaded his wives and his children and took all his property and crossed the river and arrived.

    22. He commanded them that they should do it and write it as an ordinance. But if they transgress and act from all its ways with uncleanness, they shall be written in the heavenly tablets as adversaries, and they shall be blotted out from the book of life and be written in the book of those who will be destroyed and with those who

    23. are for shame. And Jacob arranged his two sons, one on his right hand and one on his left, and it was counted to him as righteousness. And Jacob told everything to his father in the night, how the LORD had dealt with him in great mercy and how he had prospered all his way and protected him from all evil. And Isaac blessed the God of his father Abraham, who had not withheld mercy and righteousness from the son of his servant Isaac. And in the morning Jacob told his father Isaac the prayer that he had prayed to the LORD, and the vision that he had seen, and how he had built an altar, and all that was prepared for sacrifice to offer before the LORD according to how he had prayed, and how he had come to carry him on a donkey. And Isaac said to Jacob, "My son, I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred and sixty-five years old today. I can no longer bear the burden of the road. Stay with me. And I know, my
    son, that you came on my account, and this day is blessed, on which you have seen me alive and I also have seen you, my son. Prosper and perform the prayer that you have prayed, and do not delay your prayer, for it is sought out, and now quickly do it, and may he who has done everything grant success to the prayer for which you have prayed." And Rebekah said to her, "Go with Jacob your son." And Rebekah went with Jacob her son, and Deborah was with her, and they came to Bethel. And Jacob remembered the prayer with which his father had blessed him, and his two sons, Levi and Judah, and he rejoiced and blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be raised for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them." And he stayed that night in Bethel, and Levi dreamed that they had
    appointed and ordained him priest of the Most High God, him and his sons forever. And he awoke from his sleep and blessed the LORD. And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth from everything that had come with him, from people to cattle, from gold to all possessions, and he took and tithed from everything. And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons, and Levi came up in the LORD’s portion, and his father clothed him with priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar as sacrifices from the cattle fourteen oxen and eighteen rams and forty-nine sheep and seven lambs and twenty-one kids.

    24. And he came to the land of Ephrath, and he stayed there. And Rachel gave birth in the night to a son, and she called his name Son of My Sorrow, because she suffered while giving birth; but his father called his name Benjamin, on the eleventh of the eighth month, in the first year of the sixth week of this jubilee.

    25. And Rachel died there and was buried in the land of Ephrath, that is, Bethlehem. And Jacob built a pillar over Rachel’s grave on the road[23][21][21][13-17], above her tomb.'
  footnotes:
  - marker: 5-6
    text: The verse division is difficult here. The opening phrase of verse 6 may continue the oath scene at the mountain from verse 5, while the sacrificial details likely belong with Jacob’s festival observance and tithe.
    reason: segmentation_note
  - marker: 10-12
    text: These verses are textually difficult in the Ethiopic transmission. The sense appears to combine legal warning with a notice about the Rephaim and the shortening of their remaining years.
    reason: textual_variant
  - marker: 13-17
    text: The speech unit appears to continue a legal-priestly exhortation, likely tied to Levi’s election and Israel’s holiness. Some clauses are compressed or displaced in the surviving Ethiopic wording.
    reason: segmentation_note
  - marker: '21'
    text: The feast-name rendered “Addition” translates a term meaning something added or appended. The passage explains an extra festival day added to the seven days of the feast.
    reason: cultural_note
  - marker: '21'
    text: Several clauses in this long verse are syntactically difficult, especially around Rebekah’s movements and Jacob’s instructions. The translation preserves the broad sequence without over-smoothing uncertain details.
    reason: textual_variant
  - marker: '23'
    text: The source row repeats material from the opening of the chapter and then continues into Rachel’s childbirth narrative. The translation treats the repeated section as part of the chapter’s transmitted text while preserving the final birth notice in vv. 24-25.
    reason: segmentation_note
translation:
  language: ko
  text: '1. 유다는 이를 보고 기뻐했습니다. 그는 자기 조상 아브라함과 이삭의 하나님을 송축했습니다. 그리고 말했습니다. “이제 나는 나와 내 자녀들에게 모든 것의 하나님 앞에서 영원한 소망이 있다는 것을 압니다. 두 사람에 관해서도 이렇게 정해져 있으며, 이삭이 그들을 축복한 대로 하늘의 판들에 그들을 위한 영원한 증거로 기록될 것입니다.”

    2. 하나님께. 야곱은 이 달 열나흗날 이른 아침에 일어나, 그와 함께 온 모든 것, 곧 사람부터 가축까지, 금부터 모든 재산까지에서 십분의 일을 드렸습니다. 그리고 그것을 가져와, 모든 것에서 십분의 일을 드렸습니다.

    3. 그때에 라헬은 베냐민을 가졌고, 야곱은 베냐민부터 시작하여 자기 아들들을 세었으며, 레위는 여호와의 몫으로 올라갔고, 레위의 아버지는 그에게 옷을 입혔습니다.

    4. 그는 그에게 제사장 옷을 입히고 그의 손을 채웠습니다. 그리고 이 달 열다섯째 날에 그는 가축 가운데서 수소 열네 마리와 숫양 스물여덟 마리, 양 마흔아홉 마리와 어린양 일곱 마리와 염소 새끼 스물한 마리를 제단으로 가져왔습니다.

    5. 길르앗 땅에서였습니다. 야곱은 라반에게 자신의 마음을 숨기고 알리지 않았습니다. 그리고 넷째 주, 일곱째 해에 야곱은 첫째 달 스물하루에 길르앗 쪽으로 돌아갔습니다. 라반은 그를 뒤쫓아 길르앗 산에서 야곱을 따라잡았는데, 이는 셋째 달 열셋째 해였습니다. 그러나 주께서는 그가 야곱에게 해를 끼치도록 허락하지 않으셨습니다. 주께서 밤에 꿈으로 라반에게 나타나셨고, 라반이 야곱에게 말했기 때문입니다. 그리고 그날들 가운데 열다섯째 날에 야곱은 라반과 그와 함께 온 모든 사람을 위하여 잔치를 베풀었습니다. 야곱은 그날 라반에게 맹세했고, 라반도 야곱에게 맹세했습니다. 곧 산에서 어느 쪽도 다른 쪽을 향해 악한 뜻을 품고 넘어가지 않겠다고 맹세했습니다.

    6. 그가 드린 기도에 따라, 그는 그들의 제물과 전제물과 함께 십일조를 바쳤습니다. 불이 그것을 삼키자, 그는 그 위에서 유향을 불에 태웠습니다. 그리고 구원의 제물로 수소 두 마리와 숫양 넷과 양 넷과 숫염소 넷과 한 살 된 양 넷을 드렸습니다.

    7. 그러므로 이스라엘 안에서 이스라엘 사람인 처녀를 더럽히는 일에 관하여 이렇게 정해졌습니다. 이스라엘 안에 자기 딸이나 심지어 자기 누이까지도 민족들의 씨에서 난 어떤 남자에게 주고자 하는 사람이 있으면, 그는 반드시 죽임을 당해야 하며, 그들이 그를 돌로 쳐야 합니다. 이는 그가 이스라엘 안에서 수치스러운 일을 저질렀기 때문입니다. 그리고 그 여인은

    8. 그들은 그 여인을 불에 태워야 합니다. 이는 그 여인이 자기 아버지 집의 이름을 더럽혔기 때문이며, 그 여인은 이스라엘에서 끊어져야 합니다. 땅의 모든 세대에 걸쳐 이스라엘 가운데 음행이나 부정함이 발견되어서는 안 됩니다. 이스라엘은 주님께 거룩하기 때문입니다. 이스라엘을 더럽히는 사람은 누구든지 반드시 죽어야 하며, 그들은 그를 돌로 쳐야 합니다.

    9. 이것은 이와 같은 기쁨에 관한 증언입니다. 이전에는 길르앗 땅을 르바임의 땅이라고 불렀습니다. 그곳이 르바임의 땅이었기 때문입니다. 그곳에서 르바임이 태어났으며, 그들은 키가 열 규빗, 아홉 규빗, 여덟 규빗, 그리고 일곱 규빗에 이르는 거인들이었습니다.

    10. 누구든지 더럽히는 자는 반드시 죽을 것이며, 돌로 쳐 죽임을 당할 것입니다. 이 법에는 기간 제한이 없고, 면제도 어떤 속죄도 없습니다. 다만 자기 딸을 온 이스라엘 가운데서 더럽힌 그 사람은 뿌리째 뽑힐 것입니다. 이는 그가 자기 씨 가운데서 몰렉에게 바쳤고, 그것을 더럽혀 악을 행했기 때문입니다.

    11. 그들의 왕국은 가르나임과 아스타롯과 에드레이와 미수르와 브온이었습니다. 주님께서는 그들의 악한 행위 때문에 그들을 멸하셨습니다. 그들이 매우 악했기 때문입니다. 또 그들의 자리에 아모리 사람들을 살게 하셨는데, 그들도 악하고 죄 많은 자들이었습니다. 오늘날 자기들의 죄를 모두 채운 백성은 없으며, 그들은 더 이상 존재하지 않습니다.

    12. 그것은 정해져 있으며, 이것을 이 해에서 오는 해까지 남겨 둘 것은 없습니다. 이는 그 해에는 씨앗이 그 해의 씨앗을 거두는 날들까지 먹히며, 포도주는 …의 때까지이기 때문입니다.

    13. 우리 딸을 할례받지 않은 남자에게 주지 맙시다. 그것은 우리에게 수치입니다. 또한 그것은 이스라엘에게도 수치이며, 이방 민족의 딸들에게 딸을 내주는 사람들과 그들에게서 아내를 맞아들이는 사람들에게도 수치입니다. 이는 부정한 일이기 때문입니다.

    14. 그리하여 네 자녀도 모든 시대에 그러할 것입니다. 야훼께서 너와 네 자손에게 그의 영광을 위하여 큰마음을 주시기를, 또 너와 네 자손을 모든 사람 가운데서 그에게 가까이 이끄셔서 그들이 그의 성소에서 임재의 천사들과 거룩한 이들처럼 섬기게 하시기를 바랍니다. 그들처럼 네 자녀의 자손도 영광과 위대함을 얻게 될 것입니다.

    15. 열방의 딸들이며, 또 그의 딸들 가운데 누구든지 그가 열방 가운데 어떤 남자에게 준 자가 있다면, 이는 재앙 위에 재앙이요 저주 위에 저주입니다. 그가 이 일을 행하거나 부정한 일을 행하는 자들, 주님의 성소를 더럽히는 자들, 그의 거룩한 이름을 모독하는 자들에게 눈감는다면, 이 모든 재앙과 저주가 임할 것입니다. 모든 백성이 함께 그 모든 부정함과 모독 때문에 심판을 받을 것입니다.

    16. 주님께서 그들의 입에 그것을 두셔서 사랑받는 이의 모든 후손을 축복하게 하실 것입니다. 당신의 어머니가 당신을 레위라고 불렀고, 참으로 당신이 하나님과 연합하고 야곱의 모든 아들들의 동반자가 되도록 그렇게 불렀습니다. 그의 식탁이 당신의 것이 되기를 바랍니다. 당신과 당신의 아들들이 먹을 것이며, 또 모든 이를 위하여.

    17. 이스라엘 가운데 자기 성소를 더럽히는 모든 남자와 여자입니다. 그러므로 내가 너에게 명령하여 말한다. 「이스라엘에게 이 증언을 들려주십시오. 세겜과 그의 아들들에게 무슨 일이 일어났는지 보십시오. 그들이 야곱의 두 아들의 손에 넘겨졌고, 그 두 아들이 그들을 고통 중에 죽였으며, 그것이 그들에게 의로 여겨졌고, 그것이 그들을 위하여 의로 기록되었습니다.」

    18. 당신을 축복하는 모든 사람은 복을 받을 것이며, 당신을 저주하는 모든 백성은 저주를 받을 것입니다. 그리고 유다에게 이렇게 말했습니다. "주께서 당신에게 힘과 능력을 주시어 당신을 미워하는 모든 사람을 짓밟게 하시기를 바랍니다. 당신과 당신의 아들들 가운데 한 사람이 야곱의 아들들을 다스리는 통치자가 되십시오. 당신의 이름과 당신의 아들들의 이름이 온 땅과 여러 지역으로 퍼져 널리 알려지기를 바랍니다. 그때 민족들이 당신 앞에서 두려워할 것입니다,

    19. 모든 사람의 자손에게. 나는 하늘 아래에 있는 온 땅을 네 씨에게 주겠습니다. 그들은 원하는 대로 모든 민족을 다스릴 것이며, 그 후에는 온 땅을 자기들에게로 끌어모아 그 땅을 유업으로 받을 것입니다.

    20. 그리고 너를 통해 이스라엘의 구원이 발견될 것입니다. 네 의의 영광의 보좌에 앉는 날에는 사랑받는 이의 아들들의 모든 자손에게 큰 평강이 있을 것입니다. 너를 축복하는 사람은 복을 받을 것이며, 너를 미워하고 괴롭히는 모든 사람과 또 너를 저주하는 사람들은 멸망하고 끊어질 것입니다.

    21. 그가 하늘로 올라갔습니다. 그리고 밤의 환상 가운데서 보니, 한 천사가 하늘에서 내려오고 있었고, 그의 손에는 판들이 들려 있었습니다. 그가 그것들을 야곱에게 주었고, 야곱은 그것을 읽고, 그 안에 기록된 모든 것—그에게와 그의 자손에게 모든 시대에 일어날 일—을 알게 되었습니다. 그리고 그가 판들에 기록된 모든 것을 그에게 보여 주며 말했습니다. 「이곳을 세우지 마라. 그리고 영원한 성소로 만들지 마라. 그리고 여기 머물지 마라. 이곳은 그 장소가 아니기 때문이다. 너의 아버지 아브라함의 집으로 가서, 너의 아버지 이삭과 함께 너의 아버지의 죽는 날까지 거기에 머물러라. 너는 이집트에서 평안히 죽을 것이며, 이 땅에서는 조상들의 무덤—아브라함과 이삭과 함께—에 존귀하게 장사될 것이다. 두려워하지 마라. 네가 보고 읽은 대로 모든 일이 그렇게 될 것이다. 너도 네가 보고 읽은 모든 것을 기록해 두어라。」 야곱이 말했습니다. 「주님, 제가 읽고 본 모든 것을 어떻게 기억하겠습니까?」 그러자 그가 말했습니다. 「내가 네가 모든 것을 기억하게 하겠다。」


    그가 그에게서 올라가자 야곱은 잠에서 깨어났고, 자신이 읽고 본 모든 것을 기억하여, 읽고 본 모든 일을 다 기록했습니다. 그리고 거기서 그는 하루를 하나 더 지켰고, 이전 날들에 그들이 드리는 모든 것에 따라 그것을 지켰으며, 그 이름을 ‘추가’라고 불렀습니다. 그날이 더해졌기 때문이며, 이전에는 그들을 절기로 불렀기 때문입니다. 이렇게 해서 그것이 그러해야 함을 보였고, 이 일에 관하여 하늘의 판들에 기록되어 있으니, 그에게 그것을 지키고 절기의 일곱 날에 더하라고 계시되었기 때문입니다. 그리고 그 이름은 ‘추가’라 불렸는데, 해의 날 수에 따라 절기 날들에 더해지기 때문입니다. 그리고 이 달 열셋째 날 밤에 리브가의 유모 드보라가 죽었습니다. 그들은 그녀를 도시 아래, 강가의 떡갈나무 아래에 묻었고, 그곳 이름을 ‘드보라의 강’이라 불렀으며, 그 떡갈나무를 ‘드보라의 애도의 떡갈나무’라고 불렀습니다. 리브가는 가서 자기 집으로, 자기 아버지 이삭에게 들어갔고, 야곱은 그녀의 손에 숫양들과 양들을 보냈습니다. 그것들이 자기 아버지의 집으로 가게 하려는 것이었습니다. 그리고 그는 그녀에게 말했습니다. 「우리 함께 모든 곳으로 가자. 그리고 너와 함께 여행하지 마라。」 야곱은 자기 아버지 이삭의 하나님과 자기 조상 아브라함의 하나님을 복 주었고, 일어나 자기 아내들과 자녀들과 모든 재산을 실어 강을 건너 도착했습니다.

    22. 그들은 이것을 행하고 친구들로 기록되도록 정해져 있습니다. 그러나 만일 그들이 어기고 그 모든 길에서 부정하게 행하면, 그들은 하늘의 판에 적대자들로 기록되고, 생명의 책에서 지워지며, 멸망할 자들의 책에, 그리고 …하는 이들과 함께 기록될 것입니다.

    23. 기쁨으로. 야곱은 자기 두 아들을 오른편에 하나, 왼편에 하나 세웠고, 그것이 그에게 의로 여겨졌습니다. 야곱은 밤에 아버지에게 주님께서 자기에게 큰 긍휼로 어떻게 대해 주셨는지, 또 자기의 모든 길을 어떻게 형통하게 하시고 모든 악에서 어떻게 보호하셨는지를 모두 말했습니다. 이삭은 자기 아버지 아브라함의 하나님, 곧 그분의 종 이삭의 아들에게서 긍휼과 의를 거두지 않으신 분을 찬송했습니다. 아침에 야곱은 아버지 이삭에게 주님께 드렸던 기도와 자신이 본 환상, 또 어떻게 제단을 쌓았는지, 기도한 대로 주님 앞에 드리려고 준비한 모든 제물과, 어떻게 그를 나귀에 태워 모셔 가려고 왔는지를 말했습니다. 이삭이 야곱에게 말했습니다. 「내 아들아, 나는 너와 함께 갈 수가 없다. 나는 늙어서 길을 견딜 수가 없다. 내 아들아, 평안히 가라. 나는 오늘로 백육십오 세가 되었구나. 나는 더 이상 여행할 수 없으니, 네 어머니를 짐승에 태워 너와 함께 가게 하여라. 내 아들아, 네가 나를 위해 왔음을 나는 안다. 오늘은 네가 나를 살아 있는 모습으로 보았고 나도 너를 보았으니, 복된 날이다. 번성하고 네가 드린 기도를 실행하여라. 네 기도를 지체하지 말아라. 그 기도는 살펴질 것이니, 이제 서둘러 행하여라. 모든 것을 행하시는 분께서 네가 기도한 그 기도에 형통함을 주시기를 바란다.」 그리고 그는 리브가에게 「네 아들 야곱과 함께 가라」고 말했습니다. 리브가는 자기 아들 야곱과 함께 갔고, 드보라도 리브가와 함께 있었으며, 그들은 베델에 이르렀습니다. 야곱은 아버지가 자기와 자기 두 아들 레위와 유다에게 복을 빌어 주었던 그 기도를 기억하고, 기뻐하며 자기 조상 아브라함과 이삭의 하나님을 찬송했습니다. 그리고 그는 말했습니다. 「이제 나는 내게 영원한 소망이 있고, 내 자녀에게도 소망이 있다는 것을 모든 이의 하나님 앞에서 알게 되었습니다.」 이처럼 그 두 아들에 관하여 그것이 규정되었고, 이삭이 그들에게 복을 빌어 준 대로 하늘의 판에 그들을 위한 영원한 증언으로
    기록될 것입니다. 그는 그날 밤 베델에 머물렀고, 레위는 자신과 자기 자손이 영원히 지극히 높으신 하나님의 제사장으로 세워지고 임명되는 꿈을 꾸었습니다. 그는 잠에서 깨어 주님을 찬송했습니다. 야곱은 이달 십사일 아침 일찍 일어나 자신과 함께 온 모든 것에서, 곧 사람에서 가축까지, 금에서 모든 소유까지 십일조를 드렸고, 모든 것에서 십일조를 떼어 바쳤습니다. 그 무렵 라헬은 베냐민을 잉태했고, 야곱은 자기 아들들을 헤아렸으며, 레위가 주님의 몫 가운데 올라왔습니다. 그의 아버지는 그에게 제사장의 옷을 입히고 그의 손을 채웠습니다. 이달 십오일에 그는 소 떼에서 수소 열네 마리와 숫양 열여덟 마리와 양 마흔아홉 마리와 어린양 일곱 마리와 숫염소 새끼 스물한 마리를 제단에 제물로 가져왔습니다.

    24. 그리고 그는 에브랏 땅에 이르러 거기에 머물렀습니다. 라헬은 밤에 아들을 낳고, 출산할 때 고통을 겪었으므로 그 이름을 “내 고통의 아들”이라고 불렀습니다. 그러나 그의 아버지는 이 희년의 여섯째 주 첫째 해 여덟째 달 열하루에 그 이름을 베냐민이라고 불렀습니다.

    25. 라헬은 거기서 죽어 에브랏 땅, 곧 베들레헴에 장사되었습니다. 야곱은 길가에 라헬의 무덤 위로 기둥을 세웠습니다.'
