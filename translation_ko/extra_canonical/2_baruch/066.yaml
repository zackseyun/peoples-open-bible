  text: '1. And the tenth bright waters that you saw—these are the purity of the generation of Josiah king of Judah, who alone at that time submitted himself to the Mighty One with all his heart and with all his soul.


    2. And he cleansed the land from idols, and sanctified the vessels that had been defiled, and restored the offerings to the altar, and exalted the righteous, and honored those beloved ones who were wise in understanding. He also brought the priests back to their service, and removed the sorcerers, diviners, and sinners from the land.


    3. And not only did he kill the impious who were living, but they also brought out from the graves the bones of the dead and burned them with fire.


    4. 1. And the bright tenth waters that you saw—these are the purity of the generation of Josiah king of Judah, who alone at that time submitted himself to the Mighty One with all his heart and with all his soul.


    2. And he cleansed the land from idols, and sanctified the vessels that had been defiled, and restored the offerings to the altar, and exalted the righteous, and honored those beloved ones who were wise in understanding. He also brought the priests back to their service, and removed the sorcerers, diviners, and sinners from the land.


    3. And not only did he kill the impious who were living, but they also brought out from the graves the bones of the dead and burned them with fire.


    4. And the workers of magic he burned with fire; and the lying prophets who were leading the people astray, these also he gave over to burning. And the people who had listened to them while they were alive, he cast into the brook.; and the lying prophets who were leading the people astray, these also he gave over to burning. And the people who had listened to them while they were alive, he cast into the brook.'
translation:
  language: ko
  text: '네가 본 그 열 번째 빛나는 물들은 유다 왕 요시야의 세대의 정결함입니다. 그는 그때에 온 마음과 온 영혼으로 오직 전능자께 자신을 맡겼습니다.


    그는 우상들로부터 그 땅을 깨끗하게 했고, 더럽혀진 기물들을 거룩하게 했으며, 제단에 드리는 제물들을 회복했고, 의인들을 높였으며, 분별력에 있어 지혜로운 사랑받는 이들을 존중했습니다. 또한 제사장들을 다시 그 직무로 돌려보내고, 마술사들과 점쟁이들과 죄인들을 그 땅에서 제거했습니다.


    그리고 그는 살아 있는 불경한 자들만 죽인 것이 아니라, 그들의 뼈를 무덤에서 꺼내 불로 태우게도 했습니다.


    그는 마술을 행하는 자들을 불로 태웠고, 백성을 미혹하던 거짓 예언자들도 불에 넘겼습니다. 그리고 그들이 살아 있는 동안 그들의 말을 들었던 백성은 키드론 시내로 던졌습니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܙܐ ܥܡܝܩܐ / bright waters
  english_pob_choice: the tenth bright waters
  chosen_korean: 열 번째 빛나는 물들
  alternatives_korean:
  - 열 번째 밝은 물들
  - 열 번째 광명한 물들
  lexicon: source imagery
  rationale: 시각적 이미지인 ‘bright waters’를 직역해 물의 상징성을 유지했고, 문맥상 열 번째 항목을 분명히 하기 위해 ‘열 번째’를 앞세웠습니다.
- source_word: ܡܡܠܟܢܘܬܗ ... ܕܠܥܠܡ
  english_pob_choice: the purity of the generation of Josiah
  chosen_korean: 요시야의 세대의 정결함
  alternatives_korean:
  - 요시야 세대의 깨끗함
  - 요시야 시대의 순결
  lexicon: purity
  rationale: POB의 audit trail이 ‘purity’를 핵심 의미로 잡고 있어 도덕적·의례적 정결을 함께 담는 ‘정결함’으로 옮겼습니다.
- source_word: ܕܡܢ ܙܒܢܐ ... ܒܟܠܗ̇ ܢܦܫܗ
  english_pob_choice: submitted himself to the Mighty One with all his heart and with all his soul
  chosen_korean: 온 마음과 온 영혼으로 오직 전능자께 자신을 맡겼습니다
  alternatives_korean:
  - 온 마음과 온 영혼으로 전능자께 복종했습니다
  - 온 마음과 온 영혼으로 전능자 앞에 몸을 낮췄습니다
  lexicon: submitted himself
  rationale: ‘submitted himself’는 단순 복종보다 자기를 내맡기는 능동적 헌신을 포함하므로, 본문의 자기-전달을 살려 ‘자신을 맡겼습니다’로 옮겼습니다.
- source_word: ܡܓܘܪܐ / ܚܫ̈ܒ̈ܐ / ܕܝܢܐ
  english_pob_choice: sorcerers, diviners, and sinners / workers of magic / false prophets
  chosen_korean: 마술사들, 점쟁이들, 죄인들 / 마술을 행하는 자들 / 거짓 예언자들
  alternatives_korean:
  - 주술사들, 복술가들, 악인들 / 주술사들 / 거짓 선지자들
  lexicon: occult and prophetic terms
  rationale: ‘diviners’는 예언자와 구별되는 점술 행위이므로 ‘점쟁이들’로, ‘false prophets’는 직역해 ‘거짓 예언자들’로 유지했습니다.
theological_decisions:
- issue: Josiah’s relation to the Mighty One and the law tradition
  chosen_reading: 본문의 핵심은 요시야가 전능자께 전심으로 자신을 맡긴 순종이며, POB의 현행 영어문과 달리 ‘율법’은 본문 핵심으로 두지 않았습니다.
  alternative_readings:
  - 전능자의 율법에 굳게 섰다
  - 전능자의 법을 지켰다
  rationale: 제공된 시리아어 본문과 현재 영어 POB의 최근 판본은 순종과 헌신을 강조하며, 이를 한국어에서도 본문 중심으로 보존해야 합니다.
  doctrine_reference: 본문 근거 우선 원칙
- issue: The violent judgment on false prophets and their hearers
  chosen_reading: 거짓 예언자들과 그 말을 들은 백성에 대한 처벌은 강하게 유지하되, 한국어에서 완곡화하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - 그들을 벌하셨습니다
  - 그들을 심판하셨습니다
  rationale: 본문은 우상 숭배와 미혹의 제거를 역사적 정화 행위로 제시하므로, 서술의 강도를 낮추지 않고 유지하는 것이 소스 충실도에 맞습니다.
  doctrine_reference: source-text fidelity
