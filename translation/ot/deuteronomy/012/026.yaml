- timestamp: '2026-11-09T20:31:50Z'
  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
  to: But you must take whatever holy offerings you have, along with your vow offerings, to the place Yahweh will choose.
  rationale: The lexical record rightly identifies offerings fulfilling vows rather than abstract vows, and it preserves the requirement to transport sacred items. I retain those gains but recast ‘But only’ and ‘carry and come’ to make the contrast with permitted local eating unmistakable.
