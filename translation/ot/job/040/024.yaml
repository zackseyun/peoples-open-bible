id: JOB.40.24
reference: Job 40:24
source:
  edition: WLC
  text: בְּ/עֵינָ֥י/ו יִקָּחֶ֑/נּוּ בְּ֝/מֽוֹקְשִׁ֗ים יִנְקָב אָֽף־׃
translation:
  text: Can anyone capture him while he is watching, or pierce his nose with trapping gear[a]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “with snares” or “with traps”; the precise trapping device is uncertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  chosen: before his eyes
  alternatives:
  - in his eyes
  - with his eyes
  lexicon: HALOT
  rationale: 'The preposition ב with ''eyes'' is idiomatic here, expressing action done openly in the creature''s sight rather than instrumentality. ''Before his eyes'' best fits the rhetorical sense: could anyone seize him while he is watching?'
- source_word: יִקָּחֶנּוּ
  chosen: can one capture him
  alternatives:
  - will take him
  - take him
  lexicon: HALOT
  rationale: לקח commonly means 'take,' but in this hunting context 'capture' brings out the sense of seizing an animal. Rendering as a rhetorical question in English matches the surrounding context of divine challenge about Behemoth's untamable strength.
- source_word: בְּמוֹקְשִׁים
  chosen: with snares
  alternatives:
  - with hooks
  - with traps
  lexicon: HALOT
  rationale: מוֹקֵשׁ normally denotes a snare or trap, not a hook. 'Snares' preserves the lexical sense better than traditional renderings influenced by the parallel in Leviathan passages.
- source_word: יִנְקָב
  chosen: pierce
  alternatives:
  - bore through
  - perforate
  lexicon: HALOT
  rationale: The verb נקב means to pierce or bore through. 'Pierce' is natural modern English and suits the image of forcibly puncturing the animal's nose.
- source_word: אָף
  chosen: nose
  alternatives:
  - nostril
  lexicon: HALOT
  rationale: Although אַף can mean 'anger' in many contexts, here the concrete anatomical sense is required by the parallel with piercing. 'Nose' is the most straightforward English rendering; 'nostril' is possible but narrower.
