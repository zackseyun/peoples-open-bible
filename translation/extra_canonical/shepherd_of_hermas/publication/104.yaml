  text: Ἐκ δὲ τοῦ ὄρους τοῦ δεκάτου, οὗ ἦσαν δένδρα σκεπάζοντα πρόβα⸢τά⸣ τινα, οἱ πιστεύσαντες τοιοῦτοί
    εἰσιν· 2. ἐπίσκοποι φιλόξενοι, οἵτινες ἡδέως εἰς τοὺς οἴκους ἑαυτῶν πάντοτε ὑπεδέξαντο τοὺς δούλους
    τοῦ Θεοῦ ἄτερ ὑποκρίσεως· [οἱ δὲ ἐπίσκοποι] πάντοτε τοὺς ὑστερημένους καὶ τὰς χήρας τῇ διακονίᾳ ἑαυτῶν
    ἀδιαλείπτως ἐσκέπασαν καὶ ἁγνῶς ἀνεστράφησαν πάντοτε. 3. οὗτοι οὖν [πάντες] σκεπασθήσονται ὑπὸ τοῦ
    Κυρίου διαπαντός. οἱ οὖν ταῦτα ἐργασάμενοι ἔνδοξοί εἰσι παρὰ τῷ Θεῷ, καὶ ἤδη ὁ τόπος αὐτῶν μετὰ τῶν
    ἀγγέλων ἐστίν, ἐὰν ἐπιμείνωσιν ἕως τέλους λειτουργοῦντες τῷ Κυρίῳ.
