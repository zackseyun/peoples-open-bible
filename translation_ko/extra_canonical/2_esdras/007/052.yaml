  source_fidelity: 라틴어의 대조 접속사(uero), ‘악한 자들이 많아짐’(impios ... multiplicari), 명령(audi), 그리고 조건절(lapides electos ... paucos ualde)을 대체로 충실히 반영했습니다. 다만 ‘선택된 돌’은 한국어에서 부자연스럽고, 현재 범위의 라틴어는 쉼표로 끝나는 미완의 조건절이므로 이를 자연스럽게 유지하는 편이 좋습니다.
