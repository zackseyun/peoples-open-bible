translation:
  text: I also grant you the right to mint your own coinage as the currency of your country.
  philosophy: dynamic
lexical_decisions:
- source_word: ποιῆσαι
  chosen: to make
  alternatives:
  - to produce
  - to mint
  lexicon: LSJ
  rationale: Aorist infinitive of ποιέω, broadly 'to make/do.' In this construction it introduces the granted right. 'Mint' would be more specific but is not directly encoded in the verb itself, so 'make' preserves the Greek while the object clarifies the monetary sense.
- source_word: κόμμα
  chosen: coinage
  alternatives:
  - coin
  - minted money
  lexicon: LSJ
  rationale: In this context κόμμα refers to coined money or coinage. 'Coinage' best captures the collective/administrative sense of the privilege being granted, rather than a single coin.
- source_word: ἴδιον
  chosen: your own
  alternatives:
  - private
  - distinctive
  - peculiar to you
  lexicon: LSJ
  rationale: ἴδιον marks possession or what belongs particularly to the addressee. 'Your own' is the most natural English expression here and fits the political privilege of issuing coinage.
- source_word: νόμισμα
  chosen: currency
  alternatives:
  - money
  - legal tender
  - coinage
  lexicon: LSJ
  rationale: 'νόμισμα denotes current money/currency. Because κόμμα already carries the idea of coined money, rendering νόμισμα as ''currency'' avoids awkward repetition while preserving the sense: coinage serving as the country''s money.'
- source_word: τῆς χώρας σου
  chosen: of your country
  alternatives:
  - of your land
  - for your territory
  lexicon: LSJ
  rationale: χώρα commonly means land, region, or country. In this royal-political context, 'country' communicates the territorial domain more idiomatically than 'land' in modern English.
