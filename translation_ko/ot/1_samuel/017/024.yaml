lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  english_pob_choice: every man of Israel
  chosen_korean: 이스라엘의 모든 사람
  alternatives_korean:
  - 이스라엘의 모든 남자
  - 이스라엘의 모든 사람들
  lexicon: כֹל, אִישׁ, יִשְׂרָאֵל
  rationale: 히브리어 직역상 '남자'가 가능하지만, 본문은 이스라엘 군중 전체의 반응을 가리키므로 성별을 불필요하게 제한하지 않는 '모든 사람'으로 옮겼습니다.
- source_word: בִּרְאוֹתָם
  english_pob_choice: when they saw
  chosen_korean: 그 사람을 보자
  alternatives_korean:
  - 그 사람을 보았을 때
  - 그 사람을 볼 때
  lexicon: ראה
  rationale: 문맥상 반복되는 집단의 시각적 인지를 자연스럽게 풀어, '보자'로 사건 발생의 즉각성을 살렸습니다.
- source_word: מִפָּנָיו
  english_pob_choice: from before him
  chosen_korean: 그의 앞에서
  alternatives_korean:
  - 그 앞에서
  - 그를 피해
  lexicon: פָּנִים
  rationale: 직역 구조를 유지하되 한국어에서 자연스러운 방향 표현인 '그의 앞에서'를 택해 추격/대면의 긴장을 드러냈습니다.
- source_word: וַיִּירְאוּ מְאֹד
  english_pob_choice: were very afraid
  chosen_korean: 매우 두려워했습니다
  alternatives_korean:
  - 몹시 두려워했습니다
  - 크게 두려워했습니다
  lexicon: ירא + מְאֹד
  rationale: 히브리어의 강한 두려움을 직접 반영하여 '매우 두려워했습니다'로 옮겼습니다.
theological_decisions:
- issue: 집단 반응의 서술 방식
  chosen_reading: '''when they saw''를 반영해 이스라엘 전체의 공동 반응으로 읽었습니다.'
  alternative_readings:
  - '''when he saw''처럼 단수 개인 반응으로 읽는 번역'
  rationale: 히브리어 복수형 '그들이 보았다'는 본문의 집단적 공포를 강조하므로, 이를 개별화하지 않고 유지했습니다.
  doctrine_reference: 본문 관찰에 근거한 서술적 선택
