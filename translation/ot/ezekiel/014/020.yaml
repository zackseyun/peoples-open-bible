theological_decisions:
- issue: Rendering the divine name in אֲדֹנָי יְהוִה
  chosen_reading: the Lord GOD
  alternative_readings:
  - the Lord Yahweh
  - Lord YHWH
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Identity of דנאל
  chosen_reading: Daniel
  alternative_readings:
  - Danel
  rationale: The Hebrew spelling permits the reading 'Danel,' and some interpreters connect the name to an ancient Near Eastern righteous figure rather than the biblical Daniel. Because the text itself does not settle the identification and English tradition strongly recognizes 'Daniel,' the main text uses 'Daniel' while preserving 'Danel' in a footnote.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (preserve theological tension rather than resolve it)
