  from: Bless Yahweh, his angels, mighty in strength, who carry out his word, heeding the voice of his word.
  to: Bless Yahweh, his angels, mighty in strength, who carry out his word, heeding his voice[a].
  rationale: The latest revision’s “carry out his word” and responsive “heeding” are retained. I depart from its insistence on the full genitive because “his voice” conveys the meaning more clearly without replacing the voice image with a narrower “command.”
