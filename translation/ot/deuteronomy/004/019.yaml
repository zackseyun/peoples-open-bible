  from: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
  to: When you look up to heaven and see the sun, moon, and stars—all the host of heaven—do not be led astray into bowing down to them and serving them. Yahweh your God has allotted them[a] to all the peoples under heaven.
  rationale: Earlier decisions rightly left the purpose of the allotment unstated rather than importing authorization or a developed judgment explanation. I preserve that restraint while untangling the warning and documenting the serious alternatives.
