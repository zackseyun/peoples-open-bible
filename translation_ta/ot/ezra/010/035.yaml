  source_fidelity: மூன்று எபிரெய தனிப்பெயர்களும் (בְּנָיָה, בֵדְיָה, כלהי) மூலத்தின் வரிசையிலும் பட்டியல் வடிவத்திலும் துல்லியமாக ஒலிப்பெயர்க்கப்பட்டுள்ளன. உயிர்க்குறியிடப்படாத கடைசிப் பெயருக்கு வழங்கப்பட்டுள்ள «கெலூஹி» வாசிப்பு ஆங்கில POB audit உரையான “Keluhi” உடன் ஒத்துள்ளது.
  naturalness: «பெனாயா, பெதியா, கெலூஹி.» என்பது நவீன நிலையான தமிழில் பெயர்ப்பட்டியலுக்குரிய இயல்பான, சுருக்கமான வடிவமாகும். நிறுத்தற்குறியும் பொருத்தமானது.
  terminology: இது தனிப்பெயர் பட்டியல் மட்டுமே; இறையியல் சொற்கள் இல்லை. பெயர்களின் ஒலிப்பெயர்ப்பு நடை ஒரேமாதிரியாகவும் பொருத்தமாகவும் உள்ளது.
