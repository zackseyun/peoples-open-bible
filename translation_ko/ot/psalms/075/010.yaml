translation:
  language: ko
  text: 내가 악인들의 모든 뿔을 잘라 내겠으며, 의인의 뿔들은 높이 들릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿔’은 힘, 권세, 또는 높은 지위를 비유적으로 가리킵니다.
