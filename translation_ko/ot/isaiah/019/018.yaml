    rationale: 이는 원문의 서약 동사에 대한 가능한 번역이며 본문에서 충분히 드러난다. 이 구절에서는 도시 명칭의 본문 이문이 독자에게 더 중요한 정보이다.
  revised_text: 그날에 이집트 땅에는 가나안의 언어를 말하고 만군의 야훼께 충성을 맹세하는 다섯 성읍이 있을 것이며, 그중 한 성읍은 파멸의 성읍이라 불릴 것입니다.[a]
