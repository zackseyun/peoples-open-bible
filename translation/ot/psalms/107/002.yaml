  from: Let the redeemed of Yahweh say so[a], whom he has redeemed from the hand of the foe,
  to: Let the redeemed of Yahweh say so, whom he has redeemed from the hand of the foe,[a]
  rationale: '“Whom” does not grammatically attach to Yahweh: it is the object of “he has redeemed,” and its antecedent is “the redeemed.” Recasting it as “those he has redeemed” is therefore an unnecessary stylistic change. The footnote is, however, attached to the wrong phrase and should follow “foe.”'
