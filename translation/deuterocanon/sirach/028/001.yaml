translation:
  text: Those who take vengeance will face vengeance from the Lord, and he will surely hold their sins against them.
  philosophy: dynamic
lexical_decisions:
- source_word: ὁ ἐκδικῶν
  chosen: the one who takes vengeance
  alternatives:
  - the avenger
  - whoever exacts revenge
  lexicon: BDAG
  rationale: Zone 1 Hebrew appears to reflect a different text (matching Prov 27:1) and is marked minor_mismatch, while the Greek parallel provides the actual Sirach 28:1 wording. The participial construction is rendered generically as 'the one who...' for readable modern English while preserving the habitual sense.
- source_word: παρὰ Κυρίου
  chosen: from the Lord
  alternatives:
  - from the LORD
  - at the hands of the Lord
  lexicon: BDAG
  rationale: παρά with genitive here indicates source. 'Lord' follows project default for κύριος.
- source_word: εὑρήσει ἐκδίκησιν
  chosen: will find vengeance
  alternatives:
  - will receive vengeance
  - will encounter punishment
  lexicon: BDAG
  rationale: Keeps the lexical repetition with ἐκδικῶν/ἐκδίκησιν visible in English. 'Find' is slightly idiomatic but still close to the Greek.
- source_word: τὰς ἁμαρτίας αὐτοῦ
  chosen: his sins
  alternatives:
  - his offenses
  lexicon: BDAG
  rationale: Standard rendering of ἁμαρτίαι; no need to weaken the moral force.
- source_word: διατηρῶν διατηρήσει
  chosen: he will surely keep his sins in mind
  alternatives:
  - he will keep them stored up
  - he will preserve them
  - he will keep them
  lexicon: BDAG
  rationale: The Greek repeats the same verb for emphasis. In context, the sense is that his sins are retained against him, not merely remembered mentally. 'Keep ... in mind' communicates ongoing retention in accessible English, while 'surely' reflects the emphatic repetition.
