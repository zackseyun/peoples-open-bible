translation:
  text: And after setting out from the place Thera[a] on the twelfth day of the first month, they came to Jerusalem by the
    mighty hand of our Lord that was upon us; and he rescued us from every enemy from the outset[b], and they came to Jerusalem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Thera is the place-name in Swete's main Greek; it is not replaced with Ahava.
    reason: alternative_reading
  - marker: b
    text: Greek literally, 'from the approach/entrance from every enemy'; the phrase is difficult.
    reason: alternative_reading
  - marker: c
    text: The Greek shifts narrative person and repeats the arrival. These features are retained rather than regularized to
      'we came'.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναζεύξαντες
  chosen: after setting out
  alternatives:
  - after breaking camp
  - after departing
  lexicon: LSJ
  rationale: The participle denotes striking camp / setting out on a journey. 'After setting out' is natural modern English
    and preserves the temporal force without over-paraphrase.
- source_word: τοῦ τόπου Θερὰ
  chosen: the place Thera
  alternatives:
  - the place of Thera
  - Thera
  lexicon: LSJ
  rationale: The Greek expression is rendered 'the place Thera' in this unit. The selected Greek, not an approximate cross-reference,
    controls the active rendering; any prior lexicon label is historical, not a new consultation.
- source_word: τῇ δωδεκάτῃ τοῦ πρώτου μηνὸς
  chosen: on the twelfth day of the first month
  alternatives:
  - on the twelfth of the first month
  lexicon: LSJ
  rationale: A straightforward calendrical expression; expanded slightly for clear English.
- source_word: κατὰ τὴν κραταιὰν χεῖρα τοῦ κυρίου ἡμῶν τὴν ἐφʼ ἡμῖν
  chosen: by the mighty hand of our Lord that was upon us
  alternatives:
  - according to the mighty hand of our Lord upon us
  - through the strong hand of our Lord upon us
  lexicon: LSJ
  rationale: The Greek expression is rendered 'by the mighty hand of our Lord that was upon us' in this unit. The selected
    Greek, not an approximate cross-reference, controls the active rendering; any prior lexicon label is historical, not a
    new consultation.
- source_word: ἐρύσατο
  chosen: he rescued us
  alternatives:
  - he delivered us
  - he saved us
  lexicon: LSJ
  rationale: The verb means to rescue/deliver from danger. 'Rescued' is vivid and accessible without importing broader soteriological
    overtones.
- source_word: ἀπὸ τῆς εἰσόδου
  chosen: from the outset
  alternatives:
  - from the approach
  - from the entrance
  lexicon: LSJ
  rationale: Active rendering synchronized with this printed Greek unit and its main English; the prior lexicon label is historical,
    not a new consultation.
- source_word: ἀπὸ παντὸς ἐχθροῦ
  chosen: from every enemy
  alternatives:
  - from all enemies
  lexicon: LSJ
  rationale: παντός with singular ἐχθροῦ has distributive force; 'every enemy' preserves that nuance.
- source_word: καὶ ἤλθον εἰς Ἰερουσαλήμ
  chosen: and they came to Jerusalem
  alternatives:
  - and they came to Jerusalem
  lexicon: LSJ
  rationale: Active rendering synchronized with this printed Greek unit and its main English; the prior lexicon label is historical,
    not a new consultation.
