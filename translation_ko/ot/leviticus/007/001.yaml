  rationale: ‘규례’로 제의 절차를 뜻하는 תּוֹרַת의 문맥상 의미를 살리고, 두 번째 문장에서 속건제를 다시 밝혀 히브리어 הוּא의 지시 대상을 분명히 했습니다. 각주는 아샴의 배상·보상 관련 어휘적 뉘앙스를 유지하되, 본문의 정착된 제의 용어 ‘속건제’를 보존합니다.
