base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/014.yaml
  text: 'Look: he labors with wickedness, conceives trouble, and gives birth to falsehood.[a]'
  footnotes:
  - marker: a
    text: Or 'he makes his arrows for pursuers' or 'against pursuers.' The Hebrew term can be understood from a verb meaning 'to pursue' rather than 'to burn,' though the main text follows the common martial image of fiery arrows.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그는 죄악으로 산고를 겪고, 재앙을 잉태하며, 거짓을 낳습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄악으로 산고를 겪고’로 옮긴 히브리어는 ‘죄악을 품고 진통하다’ 또는 ‘죄악을 잉태하다’로도 이해될 수 있습니다. 이어지는 ‘잉태하며’와 ‘낳습니다’의 출산 은유는 분명하지만, 첫 동사의 정확한 뉘앙스에는 논의가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  english_pob_choice: And for him
  chosen_korean: 그리고 그를 위해
  alternatives_korean:
  - 그리고 그에게
  - 그리고 그를 위하여
  lexicon: HALOT
  rationale: ל+3인칭 남성 접미사는 여기서 ‘그를 위해/그에게’라는 방향·수혜 관계를 나타내며, 문맥상 앞절의 악인을 가리킵니다.
- source_word: כְּלֵי מָוֶת
  english_pob_choice: weapons of death
  chosen_korean: 죽음의 무기들
  alternatives_korean:
  - 죽음의 도구들
  - 치명적인 무기들
  lexicon: HALOT
  rationale: כְּלִי는 문맥상 전투용 ‘무기/도구’의 넓은 뜻을 가지며, ‘죽음의’라는 속격 구조를 살려 치명성을 직접 드러냈습니다.
- source_word: לְדֹלְקִים
  english_pob_choice: fiery
  chosen_korean: 불붙게
  alternatives_korean:
  - 화염이 이는
  - 불타게
  - 추격자들을 위해
  lexicon: HALOT
  rationale: 이 분사는 דלק의 ‘타다’ 의미를 따라 화살의 발화 이미지를 살렸습니다. 다만 ‘추격자들’로도 이해될 수 있는 중의성은 주석으로 남겼습니다.
theological_decisions:
- issue: 시적 무력 이미지의 보존
  chosen_reading: 하나님이 악인에게 준비하신 심판의 무기라는 이미지를 그대로 살려, 해석을 완화하지 않고 직설적으로 옮겼습니다.
  alternative_readings:
  - 비유적으로 순전한 경고로 완화하는 번역
  - 전쟁 이미지를 약화한 의역
  rationale: 시편의 문맥상 심판과 보응의 시적 진술이므로, 원문의 긴장과 위협성을 유지하는 것이 중요합니다.
  doctrine_reference: 시편 7편의 보응/심판 주제
