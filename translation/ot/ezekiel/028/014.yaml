theological_decisions:
- issue: Nature of the addressee in the lament over the king of Tyre
  chosen_reading: Retain the exalted cherubic imagery without resolving whether it refers only metaphorically to the king of Tyre, to an Edenic/primal figure, or typologically beyond him.
  alternative_readings:
  - Purely metaphorical royal imagery for the king of Tyre
  - Reference to a supernatural being behind or represented by the king
  - Dual/typological reference
  rationale: The Hebrew-target translation retains the pointed source's cherub identification provisionally. The selected Greek instead distinguishes the king from the cherub at14 and16; this connected alternative is disclosed, not rejected on theological grounds. Neither source form names Satan or Adam or resolves every metaphor of the lament over Tyre.
  doctrine_reference: Preserve theological tension rather than resolve it.
