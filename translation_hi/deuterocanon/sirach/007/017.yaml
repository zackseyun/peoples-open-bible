lexical_decisions:
- source_word: ταπείνωσον
  choice: दीन कर
  rationale: यूनानी समानांतर में यह आज्ञार्थक क्रिया स्वयं को नम्र या दीन करने का भाव देती है; यहाँ उपलब्ध अंग्रेज़ी POB और पद-संदर्भ इसी पाठ-परंपरा का अनुसरण करते हैं।
- source_word: σφόδρα
  choice: बहुत
  rationale: तीव्रता बताने वाले क्रिया-विशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τὴν ψυχήν σου
  choice: अपने प्राण को
  rationale: ψυχή का अर्थ यहाँ व्यक्ति का आंतरिक स्व या जीवन है; ‘प्राण’ मूल रूपक और धार्मिक गरिमा को बनाए रखता है।
theological_decisions:
- issue: हिब्रू स्रोत और यूनानी समानांतर के बीच स्पष्ट असंगति
  choice: यूनानी समानांतर के आधार पर ‘अपने प्राण को बहुत दीन कर’
  alternative: 'दिए गए हिब्रू का अनुवाद: ‘मुझसे यह कहने में उतावली न कर—“तोड़कर निकल”; परमेश्वर पर छोड़ दे और उसके मार्ग को स्वीकार कर।’'
  rationale: दिया गया हिब्रू पाठ इस पद के यूनानी और स्वीकृत अंग्रेज़ी रूप से मेल नहीं खाता और रिकॉर्ड में minor_mismatch अंकित है। पद-संदर्भ तथा नवीनतम निर्णीत संशोधन के लिए स्पष्ट यूनानी साक्ष्य उपलब्ध होने के कारण उसी को मुख्य पाठ बनाया गया, जबकि असंगति को निर्णय में खुलकर दर्ज किया गया।
translation_notes:
  register: संक्षिप्त, आज्ञार्थक और गरिमापूर्ण आधुनिक मानक हिन्दी। ‘दीन कर’ जानबूझकर नैतिक नम्रता/स्व-अवनति की तीव्रता रखता है; ‘बहुत’ σφόδρα की स्पष्ट शक्ति व्यक्त करता है।
