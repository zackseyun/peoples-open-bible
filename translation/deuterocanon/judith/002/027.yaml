  text: καὶ κατέβη εἰς πεδίον Δαμασκοῦ ἐν ἡμέραις θερισμοῦ πυρῶν καὶ ἐνέπρησεν πάντας τοὺς ἀγροὺς αὐτῶν, τὰ ποίμνια καὶ τὰ βουκόλια ἔδωκεν εἰς ἀφανισμόν, καὶ τὰς πόλεις αὐτῶν ἐσκύλευσεν καὶ τὰ πεδία αὐτῶν ἐξελίκμησεν, καὶ ἐπάταξεν πάντας τοὺς νεανίσκους αὐτῶν ἐν στόματι ῥομφαίας.
