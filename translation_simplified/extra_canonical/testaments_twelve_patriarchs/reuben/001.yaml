translation:
  language: en
  text: 'A copy of Reuben’s testament—what he commanded his sons before he died at the age of 125.


    2 Two years after the death of his brother Joseph, Reuben became sick. Joseph’s sons and grandsons gathered to visit him. 3 Reuben said to them, “My children, I am dying. I am going where my ancestors have gone.”


    4 When he saw his brothers Judah, Gad, and Asher there, he said, “Help me sit up so that I may tell my brothers and my children what I have kept hidden in my heart, for my strength is already failing.” 5 Then Reuben got up and kissed them. He said, “Listen, my brothers and my sons. Pay attention to what your father Reuben commands you.


    6 “Today I call the God of heaven to witness against you: Do not live in the ignorance of youth or in sexual immorality. I poured myself out in such immorality and defiled the bed of my father Jacob. 7 I tell you that I was struck with a severe blow in my loins for seven months. If my father Jacob had not prayed to the Lord for me, the Lord would have chosen to destroy me. 8 I was thirty years old when I did this evil before the Lord, and for seven months I grew so weak that I nearly died.


    9 “Afterward, I firmly resolved to reorient[a] before the Lord, and I did so for seven years. 10 I drank no wine or other strong drink. I ate no meat and no bread that I desired. Instead, I mourned over my sin, for it was great—nothing like it had happened in Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
