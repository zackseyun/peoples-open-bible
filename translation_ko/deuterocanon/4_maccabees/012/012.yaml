  text: For these things, divine justice is storing up for you a denser and eternal fire and torments, which through the whole age will not release you.
translation:
  language: ko
  text: 이런 일들 때문에 신적 정의가 더욱 거세고 영원한 불과 고문[a]을 네게 쌓아 두고 있으니, 그것들은 온 시대에 걸쳐 너를 놓아주지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고문’(βάσανοις)은 단순한 괴로움뿐 아니라 가혹한 형벌적 고통을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθ᾽ ὧν
  english_pob_choice: For these things
  chosen_korean: 이런 일들로 인해
  alternatives_korean:
  - 이 일들 때문에
  - 이러한 것들로 말미암아
  lexicon: ἀντί + 관계대명사
  rationale: 원인의 관계를 분명히 드러내면서도, POB의 지시적 뉘앙스를 살려 ‘이런 일들로 인해’로 옮겼습니다.
- source_word: ἡ θεία δίκη
  english_pob_choice: divine justice
  chosen_korean: 신적인 정의
  alternatives_korean:
  - 하나님의 정의
  - 신의 정의
  lexicon: θεῖος + δίκη
  rationale: δικη를 단순한 형벌이 아니라 ‘정의’로 유지해 문맥의 공적·심판적 성격을 반영했습니다.
- source_word: πυκνοτέρῳ
  english_pob_choice: denser
  chosen_korean: 더 짙고
  alternatives_korean:
  - 더 촘촘하고
  - 더 짙은
  lexicon: πυκνότερος
  rationale: POB의 ‘denser’를 자연스러운 한국어로 풀어, 불의 강도와 밀집성을 함께 느끼게 하는 ‘더 짙고’로 옮겼습니다.
- source_word: βασάνοις
  english_pob_choice: torments
  chosen_korean: 고문
  alternatives_korean:
  - 고통
  - 형벌
  lexicon: βάσανος
  rationale: βάσανος는 단순한 감정적 고통보다 실제적 가혹행위를 가리키므로, 문맥의 강한 심판 어휘를 살려 ‘고문’으로 번역했습니다.
theological_decisions:
- issue: 신적인 정의가 ‘저장하고 있다’는 의인화와 미래 심판의 누적성
  chosen_reading: ‘신적인 정의가 … 저장하고 있으니’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘신적인 정의가 … 예비하고 있으니’
  - ‘신적인 정의가 … 쌓아 두고 있으니’
  rationale: 원문의 ταμιεύεταί는 보관·축적의 이미지를 가지므로, 미래 심판이 이미 준비되고 있다는 긴박한 의인화를 보존했습니다.
  doctrine_reference: 종말론적 심판과 신적 보응
- issue: αἰωνίῳ / εἰς ὅλον τὸν αἰῶνα의 지속성 표현
  chosen_reading: ‘영원한’과 ‘온 세월 동안 너를 놓아주지 않을 것입니다’로 함께 살렸습니다.
  alternative_readings:
  - ‘끝없는’
  - ‘영원토록’
  rationale: 형용사와 절의 반복이 지속성을 이중으로 강조하므로, 한국어에서도 의미 반복을 유지해 심판의 영속성을 분명히 했습니다.
  doctrine_reference: 영원한 형벌의 지속성
