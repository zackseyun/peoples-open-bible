- from: '1[13]. 그리고 이 희년 일곱째 주의 여섯째 해에 아브라함이 그의 아들 이삭을 불러서 그에게 지시하여 이르되, “내가 늙어서 나의 죽을 날을 알지 못하며 나의 날이 다 찼으니.

    2. 보라, 내 나이 백칠십오 세라 내 평생에 내가 주님를 생각하며 그의 뜻을 행하기를 온 마음으로 구하였노라

    3. 그의 모든 길을 정직하게 행하게 하소서. 내 마음이 우상을 미워하여 스스로 경계하여 행하려 하였더니

    4. 나를 창조하신 분의 뜻. 그는 살아 계신 하나님이시며 모든 것보다 거룩하고 신실하시며 의로우시며 그에게는 사람을 외모로 취하심이 없으시며 선물을 받으심이 없으시니 그는 의로우신 하나님이시라 그의 계명과 언약을 범하는 자를 다 심판하시는 자이심이라

    5. 내 아들아 너도 그의 명령과 율례와 법도를 지키며 더러운 것을 좇지 말라

    6. 조각한 형상 뒤에나 녹인 형상 뒤에. 그리고 피는 먹지 마세요.

    7. 짐승이나 가축이나 하늘을 나는 모든 새의 것. 그리고 평화의 감사제물을 잡으려면, 그 피가 제단에 쏟아지도록 잡으십시오. 제물의 모든 기름을 제단에 드리되 고운 가루에 기름을 섞은 것과 그 전제와 함께 다 함께 제단 위에 드려 향기로운 제사를 드릴지니라

    8. 주님. 또 구원 희생의 기름을 제단 위 불 위에 둘지니 곧 내장에 있는 기름과 내장에 있는 모든 기름과 두 콩팥과

    9. 그 위에 있는 기름과 허리에 있는 것과 간과 콩팥을 떼어내라. 너는 이 모든 것을 소제물과 함께 주님 앞에 받으실 만한 향기로운 냄새로 드릴지니라

    10. 그 전제와 함께 주님께 향기로운 제물을 드리며 그 고기를 그 날과 그 둘째 날에 먹고 둘째 날까지 해가 지지 않게 한 후에 먹되 그리고 삼일 동안에는 조금도 남기지 마십시오. 그것은 받아들일 만한 것이 아닙니다. 그것은 악한 것이므로 먹어서는 안 되는 것입니다. 그것을 먹는 사람은 모두 자기 죄를 당할 것이다. 나는 내 조상들의 책과 에녹의 말과 노아의 말에 이같이 기록된 것을 보았노라.

    11. 네 모든 예물에 소금을 더할지니 모든 것 중에 언약의 소금을 빼지 말라

    12. 주님 앞에 너희의 제물을 드리라 제단에 쓸 나무는 삼가서 포도나무와 무화과나무와 화석류와 월계수와 잣나무와 백향목과 로간주나무와 대추나무와 살구나무와 감람나무와 몰약과 월계수와 물푸레나무와

    13. [called] arsatna 및 besem; 그러나 이 숲 중에서 겉모습이 시험된 나무를 제물로 바쳐라. 그리고 쪼개진 나무를 놓지 말고, 단단하고 깨끗한 나무, 흠 없고 튼튼하고 새로 자란 나무를 놓아라. 낡은 나무를 두지 말라 그 향기가 빠졌느니라

    14. 그리고 더 이상 처음처럼 향기가 나지 않습니다. 이 숲 외에는 다른 종류를 두지 말라 그 향기가 알려지고 그 향기가 하늘에 사무치느니라.

    15. 내 아들아, 이 명령을 지켜 행하라. 그러면 네가 네 모든 행위를 올바로 행할 것이다. 그리고 제단에 제물을 드리러 오기 전에는 항상 몸을 깨끗하게 하고 물로 몸을 씻으십시오. 그리고 제단에 다가가기 전에 손과 발을 씻으십시오. 그리고 제사를 마친 후에 들어가라.

    17. 그리고 손과 발을 씻으십시오. 그리고 당신과 당신의 옷에 피가 묻어나지 않게 하십시오.

    18. 내 아들아, 피에 대하여 조심하라. 땅의 먼지로 덮어 두십시오. 그리고 먹지 마세요

    19. 피가 생명이니 이는 피라. 피도 먹지 마세요. 그리고 사람의 피에 관한 선물은 받지 마십시오. 심판 없이 빼앗기지 않도록 하십시오. 흘린 피가 땅을 더럽히느니라. 사람의 피를 흘리신 이의 피가 아니면 땅을 정결하게 할 수 없느니라.

    20. 선물을 받지 말며 사람의 피를 흘릴 때 편파적인 태도를 취하지 마십시오. 피에는 피를 지극히 높으신 하나님 주님 앞에 드려야 합니다. 이 일이 너희에게 좋은 기념이 되어 너희를 지켜 모든 환난에서 지켜지게 하시고 또 주님께서 너희를 모든 사망에서 구원하실 것임이니라 내 아들아, 내가 사람의 자녀들의 모든 행위를 보노니, 그들의 모든 죄와 악과 그들의 모든 행위는 더러움과 가증함과 더러움이며 그들에게는 의가 없느니라. 너는 삼가 그 길로 행하지 말며 그 길을 밟지 말며 지극히 높으신 하나님 앞에서 사망에 이르는 죄를 짓지 말라 그렇지 아니하면 그가 그의 얼굴을 네게서 가리우사 너를 범죄케 하는 손에 붙이시며 너를 땅에서 뿌리째 뽑으실 것이며 네 자손이 천하에서 끊어지며 네 이름과 네 자손이 온 땅에서 끊어질까 하노라 모든 행위와 모든 더러운 것에서 떠나 지극히 높으신 하나님의 직분을 지켜 그의 뜻을 행하며 범사에 정직하라. 그리고 그분께서는 네 모든 일에 네게 복을 주시며, 땅의 모든 세대에 걸쳐 온 땅에 의로운 나무가 자라게 하실 것이다. 그리고 내 이름과 당신의 이름은 하늘 아래서 영원히 잊혀지지 않을 것입니다. 내 아들아, 평안히 가라. 지극히 높으신 하나님, 나의 하나님, 너희 하나님이 너희를 강하게 하여 그의 뜻을 행하게 하시기를 원하노라 그리고 그가 모든 의로운 축복으로 너희 모든 자손과 너희 자손의 남은 자에게 대대로 영원히 복을 주시리니 너희가 온 땅에서 복이 되게 하시기를 원하노라.” 그리고 그는 기뻐하며 그 앞에서 나갔다.'
  to: '1. 이 희년의 일곱째 주의 여섯째 해에 아브라함이 자기 아들 이삭을 불러 그를 타이르며 말했습니다. “나는 늙었고, 내 죽음의 날을 알지 못하며, 나는 내 날들을 충분히 누렸습니다.”

    2. 보십시오. 저는 백칠십오 세입니다. 그리고 제 생애의 모든 날 동안 주님을 기억해 왔고, 온 마음을 다해 그분의 뜻을 행하려고 힘써 왔습니다.

    3. 그리고 그의 모든 길에서 바르게 걷고, 내 영혼은 우상들을 미워하였으니, 내가 지켜 행하려 하였습니다.

    4. 나를 지으신 분의 뜻입니다. 그는 살아 계신 하나님이시며, 거룩하시고 신실하시며 무엇보다 의로우십니다. 그분께는 사람을 외모로 보아 차별하시는 일도, 뇌물을 받으시는 일도 없습니다. 그분은 의로우신 하나님이시며, 그분의 계명들을 어기는 모든 자와 그분의 언약을 멸시하는 자들에게 심판을 집행하시는 분이십니다.

    5. 그의 언약입니다. 또한 너는, 내 아들아, 그의 계명과 그의 규례와 그의 판결을 지키고, 그들을 따라 걷지 마십시오.

    6. 부정한 것들을 따르거나, 새긴 형상들을 따르거나, 부어 만든 형상들을 따르지 마십시오. 또한 어떤 피도 먹지 마십시오.

    7. 들짐승의 피와 가축의 피와 하늘에서 나는 날짐승의 피입니다. 그리고 만일 받아들여질 평화제물로 제물을 드리려거든, 그것을 잡아 그 피를 제단에 뿌리십시오. 또 그 제물의 모든 기름과 기름에 섞은 고운 가루와 그 전제물을 함께 제단에 올려, 야훼 앞에 향기로운 냄새가 되는 제물로 드리십시오.

    8. 주님. 또 구원의 제물의 기름을 제단 위에 있는 불 위에 놓으십시오. 곧 내장 위에 있는 기름과 속 부분에 있는 모든 기름과 두 콩팥과 모든

    9. 그 위에 붙어 있는 지방과 내장 위에 붙어 있는 지방과 간과 콩팥을 제거하십시오. 그리고 이 모든 것을 곡식 제물과 함께, 주님 앞에서 받아들여질 만한 향기로운 냄새로 바치십시오.

    10. 그리고 그 음료제와 함께, 여호와께 드리는 소제, 곧 향기로운 냄새를 위한 제물을 드리십시오. 그 고기는 그날과 둘째 날에 먹으십시오. 둘째 날에 그것을 다 먹기 전에는 해가 그것 위로 지지 않게 하십시오. 셋째 날까지는 아무것도 남겨 두지 마십시오. 그것은 받아들여지지 않기 때문이며, 속된 것이므로 먹어서는 안 됩니다. 그것을 먹는 모든 사람은 자기 죄를 짊어질 것입니다. 나는 이것이 내 조상들, 곧 옛 조상들의 책과 에녹의 말과 노아의 말에 기록되어 있는 것을 발견했습니다.

    11. 그리고 네 모든 제물에 소금을 치고, 언약의 소금이 어느 제물에도 빠지지 않게 하십시오.

    12. 당신의 제물들을 주님 앞에 드리십시오. 그리고 제단에 쓸 나무에 관하여 주의하십시오. 이 나무들 외에는 제단에 쓸 나무를 가져오지 마십시오. 곧 사이프러스나무, 전나무, 아몬드나무, 소나무, 송진소나무, 백향목, 향나무, 클레마티스, 올리브나무, 도금양나무, 월계수나무, 그리고 백향목입니다.

    13. [아르사트나와 베셈이라 불리는 것들]을—이 나무들 가운데서도 제단의 제물 위에 외형이 시험된 것들을 두십시오. 그리고 아무 갈라진 나무나 어두운 나무는 두지 말고, 흠 없는 단단하고 깨끗한 나무, 온전하고 갓 자란 나무를 두십시오. 오래된 나무는 두지 마십시오. 그 향기가 사라졌기 때문입니다.

    14. 그 향기는 처음과 같이 이제 더 이상 그 위에 향기가 없기 때문입니다. 이 나무들 외에는 다른 나무를 두지 마십시오. 그 향기는 독특하며, 그 향내가 하늘로 올라갑니다.

    15. 이 명령을 지키고 행하라, 내 아들아. 네 모든 행실에서 바르게 살아가도록 하여라. 언제나 네 몸을 정결하게 하라. 제단에 올라가 제사를 드리기 전에 물로 몸을 씻고, 제단에 가까이 가기 전에 손과 발을 씻어라. 그리고 제사를 마치면 돌아가라.

    17. 손과 발을 씻으십시오. 그리고 여러분의 몸이나 옷에 피가 전혀 보이지 않게 하십시오.

    18. 내 아들아, 피에 관해서는 조심하십시오. 그것을 땅속에 덮는 일에 각별히 주의하십시오. 그리고 그것을 전혀 먹지 마십시오.

    19. 피는 곧 생명이기 때문입니다. 그러므로 어떤 피도 먹지 마십시오. 또한 어떤 사람의 피에 관해서도 선물을 받지 마십시오. 그 피가 처벌받지 않은 채, 심판도 없이 흘려지지 않도록 하십시오. 왜냐하면 흘려진 피가 땅을 더럽히는 것이며, 땅은 그 피를 흘린 자의 피가 아니고서는 사람의 피로부터 깨끗해질 수 없기 때문입니다.

    20. 그리고 사람의 피를 두고 뇌물이나 예물을 받지 마십시오. 피는 피로 갚아야 하며, 그것은 주님 곧 지극히 높으신 하나님 앞에서 갚아야 합니다. 이것이 그대를 위한 좋은 보호가 되어, 모든 악에서 그대를 지켜 주고 모든 죽음에서 그대를 구해 줄 것입니다. 내 아들아, 나는 사람들의 모든 행위를 봅니다. 그들의 모든 죄와 악과 그들의 모든 행위는 부정과 가증함과 더러움이며, 그들 가운데에는 의가 없습니다. 조심하여 그들의 길로 가지 말고 그들의 행로를 밟지도 마십시오. 지극히 높으신 하나님 앞에서 죽음에 이르는 죄를 짓지 마십시오. 그렇지 않으면 그분이 그대에게서 얼굴을 감추시고 그대를 원수들의 손에 넘기시며, 그대를 땅에서 뽑아 버리고 그대의 씨를 하늘 아래에서 뿌리째 뽑으시며, 온 땅에서 그대의 이름과 그대의 씨를 멸하실 것입니다. 그들의 모든 행위와 모든 더러움에서 돌아서십시오. 지극히 높으신 하나님의 명령을 지키고, 그분의 뜻을 행하며, 모든 일에서 바르게 행하십시오. 그러면 그분이 그대의 모든 일에 복을 주시고, 온 땅에 걸쳐 땅의 모든 세대 가운데 그대에게서 의의 나무를 일으키실 것입니다. 내 이름과 그대의 이름은 영원히 하늘 아래에서 잊히지 않을 것입니다. 내 아들아, 평안히 가십시오. 지극히 높으신 하나님, 곧 나의 하나님이시며 그대의 하나님이신 분께서 그대가 그분의 뜻을 행하도록 굳세게 하시기를 바랍니다. 또한 그분이 그대의 모든 씨와 그대의 씨의 남은 자에게 영원한 세대에 이르도록 모든 의로운 복으로 복을 주셔서, 그대가 온 땅에 복이 되게 하시기를 바랍니다.” 그리고 그는 기뻐하며 그의 곁을 떠났습니다.'
