  previous_text: …with all their heart. So, do you think that people who repent have their sins forgiven immediately? Not completely. A person who repents must discipline his own soul, remain humble in everything he does, and firmly endure the distress of every kind of trouble. If he bears the troubles that come upon him, the One who created and strengthened all things will surely have compassion and grant him some healing. This will happen when God sees that the repentant person’s heart is clean from everything.
