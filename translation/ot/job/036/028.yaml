id: JOB.36.28
reference: Job 36:28
source:
  edition: WLC
  text: אֲשֶֽׁר יִזְּל֥וּ שְׁחָקִ֑ים יִ֝רְעֲפ֗וּ עֲלֵ֤י אָדָ֬ם רָֽב־׀׃
translation:
  text: The clouds pour it down; they shower it abundantly on humanity.
  philosophy: dynamic
lexical_decisions:
- source_word: אֲשֶׁר
  chosen: which
  alternatives:
  - that
  - which water
  lexicon: HALOT
  rationale: Relative particle linking this verse to the antecedent in the previous line; 'which' preserves the subordinate connection without adding content.
- source_word: יִזְּלוּ
  chosen: pour down
  alternatives:
  - flow
  - distill
  - stream
  lexicon: HALOT
  rationale: From נזל, denoting flowing or streaming downward. In the rain context, 'pour down' is idiomatic modern English and captures the downward movement more naturally than the more literal but less natural 'flow' or the overly technical 'distill'.
- source_word: שְׁחָקִים
  chosen: the clouds
  alternatives:
  - skies
  - cloud-masses
  lexicon: HALOT
  rationale: In poetic weather imagery this term refers to the skies/clouds. 'The clouds' best fits the immediate context of rain formation and precipitation.
- source_word: יִרְעֲפוּ
  chosen: they shower
  alternatives:
  - they shower
  - they pour
  - they drop
  lexicon: HALOT
  rationale: Natural precipitation language that retains the downward rain image.
- source_word: עֲלֵי
  chosen: 'on'
  alternatives:
  - upon
  - over
  lexicon: HALOT
  rationale: Simple preposition of downward movement onto people below; 'on' is the most natural modern equivalent.
- source_word: אָדָם
  chosen: humanity
  alternatives:
  - humankind
  - mankind
  - people
  lexicon: HALOT
  rationale: Accurately conveys the generic collective referent.
- source_word: רָב
  chosen: abundantly
  alternatives:
  - in abundance
  - many
  - plentifully
  lexicon: HALOT
  rationale: Adjectival form used adverbially here to express plentiful extent. 'Abundantly' communicates the sense smoothly in English and modifies the dripping/showering action rather than suggesting many separate persons.
