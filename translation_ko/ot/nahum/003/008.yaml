    rationale: ‘낫냐/느니라’ 대신 ‘낫습니까/있었습니다’를 사용하면 요청된 현대 공식-공손 문체가 일관됩니다.
  revised_text: 네가 노아몬보다 더 낫습니까? 노아몬은 나일강 수로들 가운데 앉아 있었고, 물이 그 성읍 사방을 둘러싸고 있었으며, 바다가 그 요새였고, 바다에서 나온 것이 그 성벽이었습니다.
