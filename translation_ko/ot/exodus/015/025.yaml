  source_fidelity: 히브리어 본문의 대명사는 ‘그에게/그를’로 단수(לוֹ, נִסָּהוּ)인데, 초안은 이를 모두 ‘그들을’로 복수화했습니다. 문맥상 이스라엘 백성을 집합적으로 가리킬 가능성을 해석으로 덧붙이지 않고, 본문의 단수를 보존해야 합니다. ‘물이 달아졌습니다’도 의미는 통하지만 현대 한국어에서는 맛이 달아진다는 표현으로 다소 부자연스러워 ‘물이 달게 되었습니다’가 더 직접적입니다.
  naturalness: 합쇼체는 일관되고 전반적으로 자연스럽습니다. ‘그에게 나무를 보여 주셨습니다’도 자연스럽습니다. 다만 각주 표지는 ‘나무’에 바로 붙이는 편이 지시 대상이 명확합니다.
  terminology: ‘야훼’, ‘부르짖다’, ‘규례와 법도’, ‘시험하다’는 원문의 어휘와 문맥에 무난하게 부합합니다. יהוה를 ‘야훼’로 옮긴 초안의 방침을 유지했습니다. עֵץ는 이 문맥에서 ‘나무’로 옮기는 것이 적절합니다.
