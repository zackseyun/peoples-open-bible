    chosen: that I have seen
    alternatives:
    - which I saw
    lexicon: Dillmann, Lexicon Linguae Aethiopicae
    rationale: Relative clause qualifying the visions. English present perfect sounds natural for prior experiences now being reported, while still reflecting completed seeing.
  - source_word: በቅድሜከ፡
    chosen: before you
    alternatives:
