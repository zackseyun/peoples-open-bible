  naturalness: 기존 문장은 ‘깨끗함을 받았음’이 원문의 상태 서술을 결과적 수동 표현으로 바꾸고, ‘한 사람으로부터 깨끗함을 받다’도 한국어 결합이 부자연스럽습니다. ‘깨끗합니다’로 고치면 현대 표준어 합쇼체로 자연스럽고 간결합니다.
