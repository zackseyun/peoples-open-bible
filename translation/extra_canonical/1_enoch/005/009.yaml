translation:
  text: They will no longer sin, nor will they be condemned[a] throughout all the days of their lives. They will not die by punishment or wrath, but will complete the full number of their days. They will grow old in peace, and their years of joy will increase in gladness and everlasting peace throughout all the days of their lives.
