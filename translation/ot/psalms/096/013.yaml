  from: before Yahweh, for he is coming, for he is coming[a] to judge the earth. He will judge the world with righteousness, and the peoples[b] with his faithfulness[c].
  to: before Yahweh, for he is coming—for he is coming to judge the earth. He will judge the world with righteousness, and the peoples with his faithfulness.
  rationale: The earlier decisions preserve both the repeated announcement of Yahweh’s coming and the judicial force of “judge”; I retain them. “Righteousness” and “faithfulness” carry the ending’s moral weight without narrowing it to a later formulation of final judgment.
