  from: yet breaking the bonds he was driven
  to: and breaking the bonds, he was driven
  rationale: The Greek uses a simple coordinating conjunction, καὶ ('and'). While the context implies a contrast, adding 'yet' is an interpretive gloss not strictly present in the source. The resulting English phrase is also syntactically awkward without a comma to set off the participial phrase. A more direct and natural rendering like 'and breaking the bonds, he was driven...' preserves the Greek participial construction, is more formally equivalent, and improves the flow of the sentence.
