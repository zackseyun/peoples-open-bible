source:
  edition: WLC
  text: כִּ֤י כָל֪וּ בְ/יָג֡וֹן חַיַּ/י֮ וּ/שְׁנוֹתַ֪/י בַּ/אֲנָ֫חָ֥ה כָּשַׁ֣ל בַּ/עֲוֺנִ֣/י כֹחִ֑/י וַ/עֲצָמַ֥/י עָשֵֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/010.yaml
  text: For my life is spent with grief, and my years with sighing; my strength has failed because of my iniquity[a], and my bones waste away.
  footnotes:
  - marker: a
    text: Or “because of my guilt”; the Hebrew word can denote iniquity, guilt, or the consequence of guilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내 생명이 슬픔 속에서 다하고 내 햇수가 탄식 속에서 다하기 때문입니다. 내 힘은 내 죄악 때문에 쇠하였으며, 내 뼈들은 쇠약해졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 죄책 때문에’ 또는 ‘내 죄악의 결과 때문에’. 히브리어 ‘아온’은 죄악, 죄책, 또는 죄악의 결과를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쇠하였으며’에 해당하는 히브리어 동사는 문자적으로 ‘비틀거리다’ 또는 ‘휘청거리다’라는 뜻이며, 여기서는 힘이 꺾이거나 쇠하는 것을 비유적으로 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  english_pob_choice: Be gracious to me
  chosen_korean: 은혜를 베푸소서
