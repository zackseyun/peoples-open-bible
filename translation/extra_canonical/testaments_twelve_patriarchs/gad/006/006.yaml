id: T12P.GAD.6.6
reference: Testament of Gad 6:6
unit: verse
book: Testament of Gad
collection: Testaments of the Twelve Patriarchs
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '6. Ἐὰν *δὲ ἀρνήσηται⁴⁵ καὶ *αἰδεσθῇ ἐλεγχόμενος⁴⁶, ἡσύχασον⁴⁷ μὴ †ἐλέγξῃς⁴⁸ αὐτόν· ὁ γὰρ ἀρνούμενος⁴⁹ μετανοεῖ *τοῦ πλημμελῆσαι⁵⁰ *εἰς σέ⁵¹. *καὶ [φοβηθεὶς] εἰρηνεύει⁵².'
  language: Greek
translation:
  text: But if he denies it and is ashamed when reproved, be still; do not reprove him. For the one who denies it repents[a] of having sinned against you, so that he may not do wrong to you again, and being afraid he makes peace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance for acknowledged wrongdoing, retaining the persons, offenses and ensuing actions; preserve distinct return expressions and this works own claims.
    reason: lexical_alternative
