source:
  edition: WLC
  text: לָבְשׁ֬וּ כָרִ֨ים הַ/צֹּ֗אן וַ/עֲמָקִ֥ים יַֽעַטְפוּ בָ֑ר יִ֝תְרוֹעֲע֗וּ אַף יָשִֽׁירוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/013.yaml
  text: The pastures are clothed with flocks[a], and the valleys wrap themselves in grain; they shout for joy, yes, they sing.
  footnotes:
  - marker: a
    text: Or “The meadows are clothed with flocks.” The Hebrew noun can denote pastureland or meadowland in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 목초지는 양 떼로 옷 입고, 골짜기들은 곡식으로 몸을 두릅니다.[a] 그들은 환성을 지르며, 참으로 노래합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘초원’. 히브리어 낱말은 이 문맥에서 양 떼가 덮은 목초지나 초원을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 강조 표현은 ‘또한’, ‘참으로’ 등으로 옮길 수 있습니다.
    reason: lexical_note
lexical_decisions:
- source_word: יִרְעֲפוּ
  english_pob_choice: drip
  chosen_korean: 흘러내리고
  alternatives_korean:
  - 똑똑 떨어지고
  - 점점 떨어지고
  - 넘쳐흐르고
  lexicon: HALOT
  rationale: 이 동사는 비가 스며들듯 방울져 흐르는 이미지를 살리므로, 한국어에서는 시적 자연성을 유지하면서도 과도한 해석을 피하는 「흘러내리고」가 적절합니다.
- source_word: נְא֣וֹת
  english_pob_choice: pastures
  chosen_korean: 풀밭
  alternatives_korean:
  - 목초지
  - 초원
  - pastures(음역)
  lexicon: HALOT
  rationale: 광야와 병렬되는 목양 공간을 한국어 독자가 즉시 떠올리도록 「풀밭」으로 옮기되, 지나치게 목축 전문어인 「목초지」보다는 시적 문맥에 맞게 다듬었습니다.
- source_word: מִדְבָּר
  english_pob_choice: wilderness
  chosen_korean: 광야
  alternatives_korean:
  - 사막
  - 들판
  - 황야
  lexicon: HALOT
  rationale: 히브리어 מִדְבָּר는 단순한 사막보다 넓은 비경작지의 뜻이 있어, 성경 시어로 널리 쓰이며 의미 범위도 넓은 「광야」가 가장 무난합니다.
- source_word: גִיל
  english_pob_choice: rejoicing
  chosen_korean: 기쁨을 띠고
  alternatives_korean:
  - 환희를 입고
  - 즐거움으로
  - 기뻐하며
  lexicon: HALOT
  rationale: 명사 גִיל의 감정적 풍성함을 살리면서, 언덕이 그것을 ‘두른다’는 뒤 절과 자연스럽게 이어지도록 「기쁨을 띠고」로 표현했습니다.
- source_word: תַּחְגֹּרְנָה
  english_pob_choice: gird themselves with
  chosen_korean: 스스로 두릅니다
  alternatives_korean:
  - 허리에 띠를 돕니다
  - 두릅니다
  - 스스로 띠를 띱니다
  lexicon: HALOT
  rationale: חָגַר의 핵심은 ‘띠를 두르다/동이다’이므로, 은유를 너무 풀지 않으면서도 한국어로 자연스러운 「스스로 두릅니다」를 택했습니다.
theological_decisions:
- issue: 의인화된 자연의 표현 방식
  chosen_reading: 산문적으로 설명하지 않고, 광야와 언덕이 실제로 기쁨에 반응하는 듯한 시적 의인화를 그대로 살렸습니다.
  alternative_readings:
  - 자연이 풍요를 드러낸다고 풀어 쓰는 해석
  - 하나님의 복에 대한 상징으로만 정리하는 번역
  rationale: 시편의 이미지 자체가 신학적 메시지의 운반체이므로, 은유를 해설로 바꾸지 않고 독자가 본문의 생동감을 직접 보게 하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 시편 65편의 창조 세계 찬양과 하나님의 복 주심
