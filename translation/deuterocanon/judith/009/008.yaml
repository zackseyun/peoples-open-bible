id: JDT.9.8
reference: Judith 9:8
source:
  edition: lxx-swete-1909
  text: Κύριος ὄνομά σοι· σὺ ῥάξον αὐτῶν τὴν ἰσχὺν ἐν δυνάμει σου, καὶ κατάξον τὸ κράτος αὐτῶν ἐν τῷ θυμῷ σου· ἐβουλεύσαντο γὰρ βεβηλῶσαι τὰ ἅγιά σου, μιᾶναι τὸ σκήνωμα τῆς καταπαύσεως τοῦ ὀνόματος τῆς δόξης σου, καταβαλεῖν σιδήρῳ κέρας θυσιαστηρίου σου.
