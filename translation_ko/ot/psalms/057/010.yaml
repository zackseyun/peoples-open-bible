  text: אוֹדְ/ךָ֖ בָ/עַמִּ֥ים אֲדֹנָ֑/י אֲ֝זַמֶּרְ/ךָ֗ בַּל אֻמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/010.yaml
  text: For your steadfast love is great as far as the heavens, and your faithfulness[a] as far as the clouds.
  footnotes:
  - marker: a
    text: Or 'I will praise you among the peoples.' The Hebrew verb can denote either thanksgiving or praise; 'give thanks' was chosen to preserve the distinction from the next line's 'sing praise.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 주님의 한결같은 사랑이 하늘에까지 크고, 주님의 신실하심이 구름에까지 이르기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹדְךָ
  english_pob_choice: I will give thanks to you
  chosen_korean: 감사드리겠습니다
  alternatives_korean:
  - 찬양하겠습니다
  - 감사하겠습니다
  - 주님을 찬양하겠습니다
  lexicon: HALOT
  rationale: 히필형 ידה는 문맥에 따라 ‘감사하다’와 ‘찬양하다’ 모두 가능하지만, 다음 행의 זמר를 ‘찬양하다’로 살려 병행 속에서 의미 구분을 유지했습니다.
- source_word: בָעַמִּים
  english_pob_choice: among the peoples
  chosen_korean: 백성들 가운데에서
  alternatives_korean:
  - 민족들 가운데에서
  - 사람들 가운데에서
  - 백성들 가운데서
  lexicon: HALOT
  rationale: עַמִּים의 복수 집합적 뉘앙스를 살려 ‘백성들’로 옮겼고, 시적 병행을 위해 ‘가운데에서’로 자연스럽게 표현했습니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주여
  lexicon: HALOT
  rationale: 아도나이는 하나님의 호칭이므로 프로젝트 기본값에 따라 ‘주님’으로 옮겼습니다.
- source_word: אֲזַמֶּרְךָ
  english_pob_choice: I will sing praise to you
  chosen_korean: 찬양하겠습니다
  alternatives_korean:
  - 노래하겠습니다
  - 주님께 노래하겠습니다
  - 찬송하겠습니다
  lexicon: HALOT
  rationale: זמר의 시편적 용법은 단순히 ‘노래하다’보다 예배적 찬양을 가리키므로, 앞 행과 구별되는 의미를 살려 ‘찬양하다’로 옮겼습니다.
- source_word: אֻמִּים
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방 나라들
  - 민족 가운데
  lexicon: HALOT
  rationale: אֻמִּים은 בָעַמִּים보다 더 넓은 집단을 가리키는 경우가 많아, 한국어에서는 병행을 살리는 동시에 차이를 드러내는 ‘민족들’이 적절합니다.
theological_decisions:
- issue: 시적 병행에서 ידה와 זמר의 의미 구분
  chosen_reading: 첫 행은 ‘감사드리겠습니다’, 둘째 행은 ‘찬양하겠습니다’로 구분했습니다.
  alternative_readings:
  - 두 행 모두 ‘찬양하겠습니다’
  - 첫 행도 ‘감사하겠습니다’
  rationale: 히브리어는 두 동사를 나란히 배치해 표현을 구별하고 있으므로, 한국어에서도 반복을 피하고 서로 다른 예배 행위를 드러내는 번역이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 시편의 평행법과 어휘 구별 원칙
