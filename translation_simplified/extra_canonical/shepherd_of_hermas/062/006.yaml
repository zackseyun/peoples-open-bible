  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/006.yaml
  text: “All who transgressed the law which they received from him,” he says, “he left under my authority for repentance; but those who have already been pleasing to the law and have kept it, he has under his own authority.”
translation:
  language: en
  text: He says, “He placed under my authority all who broke the law they received from him, so that they could reorient[r1]. But he keeps under his own authority those who have already lived in a way pleasing to the law and have kept it.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: transgressed the law
  simplified_phrase: broke the law
  preserved_meaning: They violated the law given to them.
  reasoning_layer_used: POB translation
  rationale: “Broke the law” states the same idea in common English.
- pob_phrase: have already been pleasing to the law and have kept it
  simplified_phrase: have already lived in a way pleasing to the law and have kept it
  preserved_meaning: Their conduct pleased the law, and they also kept it.
  reasoning_layer_used: POB translation and grounding review
  rationale: This clarifies the unusual expression while preserving both coordinated descriptions.
