translation:
  text: Destroy all these spirits of illegitimate birth and the offspring of the Watchers, because they have oppressed humanity.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “spirits of the bastards”; the Ge'ez expression is difficult and appears to identify the spirits by their illicit
      origin.
    reason: lexical_alternative
  - marker: b
    text: The source joins the spirits and the offspring with a conjunction. Their relation may be appositional or describe
      connected groups; the English retains “and” rather than settling that identity. No anatomy or an additional named group
      is supplied.
    reason: alternative_reading
lexical_decisions:
- source_word: ወአኅጕሎሙ
  chosen: Destroy
  alternatives:
  - And destroy them
  - Wipe them out
  rationale: The verbal form continues the divine command and calls for complete destruction. English omits an initial “and”
    for a clear standalone verse, while retaining the imperative force.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ለእሉ
  chosen: all these
  alternatives:
  - these
  - all
  rationale: The demonstrative points to the spirits under judgment in the surrounding command. The transmitted wording is
    somewhat awkward, and the traditional understanding includes totality; “all these” makes the scope explicit without replacing
    the Ge'ez base text.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: መናፍስተ፡ ተውኔት
  chosen: spirits of illegitimate birth
  alternatives:
  - spirits of the bastards
  - spirits of the reprobate
  - spirits of corruption
  rationale: The phrase identifies the condemned spirits by their illicit origin. “Illegitimate birth” preserves that genealogical
    force in elevated but readable English without using “bastards” as a modern insult. The word is textually and lexically
    difficult enough that alternatives are noted.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወለውሉዶሙ፡ ለትጉሃን
  chosen: the offspring of the Watchers
  alternatives:
  - the children of the Watchers
  - the offspring of the vigilant ones
  rationale: The phrase appositionally identifies the spirits as the progeny of the Watchers. “Watchers” is the established
    local designation for the angelic beings and preserves the apocalyptic category rather than reducing it to ordinary vigilance.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: እስመ፡ ገፍዕዎሙ፡ ለሰብእ
  chosen: because they have oppressed humanity
  alternatives:
  - because they have done violence to humanity
  - because they have wronged human beings
  rationale: The verb denotes forceful mistreatment or oppression, stronger than a generic “wronged.” “Humanity” represents
    the collective reference to human beings and avoids a male-only sense.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
