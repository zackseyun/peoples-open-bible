id: PRO.7.5
reference: Proverbs 7:5
source:
  edition: WLC
  text: לִ֭/שְׁמָרְ/ךָ מֵ/אִשָּׁ֣ה זָרָ֑ה מִ֝/נָּכְרִיָּ֗ה אֲמָרֶ֥י/הָ הֶחֱלִֽיקָה׃
translation:
  text: to keep you from the forbidden woman, from the adulteress[a] with her smooth words.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the foreign woman,” here describing a woman outside a lawful sexual relationship.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  chosen: to keep you
  alternatives:
  - to guard you
  - to preserve you
  lexicon: HALOT
  rationale: 'The infinitive construct with prefixed ל expresses purpose in relation to the previous verse: the instruction/wisdom is given ''to keep'' or ''guard'' the son. ''Keep you'' is natural modern English and preserves the protective sense of שמר.'
- source_word: מֵאִשָּׁה זָרָה
  chosen: from the forbidden woman
  alternatives:
  - from the strange woman
  - from an adulteress
  - from a loose woman
  lexicon: HALOT
  rationale: זָרָה literally means 'strange/foreign,' but in Proverbs this collocation functions idiomatically for a woman outside the covenantal/moral bounds of lawful sexuality. 'Forbidden woman' communicates the moral force more clearly in contemporary English than the traditional but misleading 'strange woman.'
- source_word: מִנָּכְרִיָּה
  chosen: from the foreign woman
  alternatives:
  - from the stranger
  - from the adulteress
  lexicon: HALOT
  rationale: This is the direct lexical sense and retains the distinction from the preceding זָרָה; contextual moral implications should not replace the source term.
- source_word: אֲמָרֶיהָ
  chosen: whose words
  alternatives:
  - her sayings
  - her speech
  lexicon: HALOT
  rationale: The construct plural means 'her words/sayings.' 'Whose words' connects smoothly to the following verb in English.
- source_word: הֶחֱלִיקָה
  chosen: are smooth
  alternatives:
  - she has made smooth
  - she flatters
  - are flattering
  lexicon: HALOT
  rationale: The Hiphil of חלק means 'make smooth,' often metaphorically for smooth or flattering speech. Since the object is 'her words,' English idiom prefers the stative result 'are smooth.' This preserves the imagery while remaining readable. The flattering nuance is implicit and can be noted in a footnote.
- source_word: אֲמָרֶיהָ הֶחֱלִיקָה
  chosen: whose words are smooth
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This retains the Hebrew image; the idiomatic flattering implication is appropriately noted.
