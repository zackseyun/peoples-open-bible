translation:
  language: en
  text: I tell you, in the same way there will be more joy in heaven over one sinner who repents[b] than over ninety-nine righteous people[a] who do not need repentance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Righteous people” may be straightforward or ironic in this context; the wording leaves both readings open.
    reason: alternative_reading
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
