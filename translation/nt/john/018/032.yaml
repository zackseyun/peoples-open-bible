  - source_phrase: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν
    prior_rendering: so that the word of Jesus would be fulfilled, which he had spoken
    new_rendering: This happened to fulfill Jesus’ words
