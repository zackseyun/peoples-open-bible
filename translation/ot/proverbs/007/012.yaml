id: PRO.7.12
reference: Proverbs 7:12
source:
  edition: WLC
  text: פַּ֤עַם בַּ/ח֗וּץ פַּ֥עַם בָּ/רְחֹב֑וֹת וְ/אֵ֖צֶל כָּל פִּנָּ֣ה תֶאֱרֹֽב׀־׃
translation:
  text: Sometimes she is outside, sometimes in the squares; at every corner she lies in wait.
  philosophy: dynamic
lexical_decisions:
- source_word: פַּעַם ... פַּעַם
  chosen: Sometimes ... sometimes
  alternatives:
  - At one time ... at another
  - Sometimes ... sometimes
  - Now ... now
  lexicon: HALOT
  rationale: This idiomatic repetition conveys alternation of location.
- source_word: בַּחוּץ
  chosen: outside
  alternatives:
  - outside
  - in the open
  lexicon: HALOT
  rationale: This preserves the public/outside setting and the preceding contrast with home without unsupported spatial precision.
- source_word: בָּרְחֹבוֹת
  chosen: in the squares
  alternatives:
  - in the plazas
  - in the broad streets
  lexicon: HALOT
  rationale: רְחֹבוֹת refers to open public places or plazas within a town. 'Squares' is concise, idiomatic, and distinguishes it from the prior 'street.'
- source_word: וְאֵצֶל
  chosen: and beside
  alternatives:
  - and near
  - and by
  lexicon: HALOT
  rationale: אֵצֶל indicates proximity. 'Beside' gives a natural English sense of lurking near strategic locations.
- source_word: כָּל פִּנָּה
  chosen: every corner
  alternatives:
  - every street corner
  - every angle
  lexicon: HALOT
  rationale: פִּנָּה literally means 'corner.' In context, 'every corner' idiomatically conveys the city's corners where someone might ambush or solicit passersby.
- source_word: תֶאֱרֹב
  chosen: she lies in wait
  alternatives:
  - she lurks
  - she waits in ambush
  lexicon: HALOT
  rationale: The verb ארב carries the sense of lying in wait or ambushing. 'She lies in wait' preserves the predatory nuance central to the warning passage.
