  from: because you are sent from before the king and his seven counselors to inquire concerning Judah and Jerusalem according to the law of your God that is in your hand[a][b].
  to: For you are being sent by the king and his seven counselors to examine conditions in Judah and Jerusalem according to the law of your God, which is in your possession[a].
  rationale: Earlier lexical deliberation correctly identified royal authorization, examination, and the law as the inquiry’s standard. I express the court and possession idioms directly, retaining a note for the genuine alternative concerning Ezra’s knowledge of the law.
