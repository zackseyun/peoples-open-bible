id: DID.15.3
reference: Didache 15:3
unit: verse
book: Didache
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλέγχετε δὲ ἀλλήλους μὴ ἐν ὀργῇ, ἀλλ' ἐν εἰρήνῃ, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ· καὶ παντὶ ἀστοχοῦντι κατὰ τοῦ ἑτέρου μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω, ἕως οὗ μετανοήσῃ.
  language: Greek
translation:
  text: And reprove one another[a], not in anger but in peace, as you have in the gospel; and let no one speak to anyone who sins against another, nor let him be heard by you, until he repents[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'anyone who goes wrong against another'.
    reason: previous_rendering
  - marker: b
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repent in the communitys summons and reconciliation discipline, preserving its conditions rather than redefining them.
    reason: lexical_alternative
