# known_regressions.yaml
# ======================
# Policy-enforcing regression cases for the People's Open Bible revision pipeline.
#
# PURPOSE: These are known cases where prior AI revision passes introduced errors
# against POB's explicit translation policy. Each entry documents:
#   - what the model did wrong
#   - what the correct rendering is
#   - why (the doctrinal/policy rationale)
#
# HOW TO USE: Feed this file to future revision pass model prompts as a
# "do NOT repeat these patterns" list. Run tools/check_regressions.py to
# validate that no current verse YAML contains a known regression pattern.
#
# FORMAT: Each entry has:
#   id: unique slug
#   discovered: ISO date the regression was first observed
#   fixed: ISO date the regression was corrected in the corpus
#   category: regression type
#   source_term: Greek/Hebrew source word
#   wrong_rendering: what the model produced (forbidden)
#   correct_rendering: what POB policy requires
#   policy_ref: reference to DOCTRINE.md or book_context file
#   rationale: why the wrong_rendering is a regression
#   affected_verses: sample verse IDs where this regression occurred
#   fix_script: script that corrected the corpus

regressions:

  - id: christos-name-form
    discovered: "2026-09-12"
    fixed: "2026-09-12"
    category: lexical_substitution
    source_term: Χριστός (Greek)
    wrong_rendering: Jesus the Messiah / Messiah Jesus in name-like constructions
    correct_rendering: Jesus Christ / Christ Jesus
    policy_ref: "DOCTRINE.md §Contested Terms — Χριστός"
    rationale: |
      Χριστός is the Greek translation of the Hebrew מָשִׁיחַ (Mashiach / Messiah),
      meaning "the anointed one." POB preserves "Messiah" when the word functions
      independently as a title, including "Jesus is the Messiah." When Χριστός is
      joined directly to Jesus in a personal-name construction, POB uses the familiar
      and recognizable conventional English name "Jesus Christ" or "Christ Jesus."
    affected_verses:
      - ROM.1.1
      - GAL.1.1
      - EPH.1.1
      - PHP.1.1
      - COL.1.1
      - 1TH.1.1
      - ACT.15.26
      - EPH.3.1
      - 1CO.1.1
      # ... 405 total across all NT books
    scale: all name-like constructions across the NT
    fix_script: corpus migration (run 2026-09-12)
    prompt_injection: |
      POB POLICY: Use "Jesus Christ" and "Christ Jesus" when Χριστός is part
      of a personal-name construction. Use "Messiah" when it functions independently
      as a title, including predicative expressions such as "Jesus is the Messiah."
      Examples of CORRECT POB rendering:
        "Paul, a servant of Christ Jesus"
        "the grace of our Lord Jesus Christ"
        "Peter answered, 'You are the Messiah.'"

  - id: slave-as-servant
    discovered: "2026-07-14"
    fixed: "2026-07-14"
    category: lexical_substitution
    source_term: reader-facing English terminology
    wrong_rendering: slave / slaves
    correct_rendering: servant / servants
    policy_ref: "DOCTRINE.md §Contested Terms — δοῦλος"
    rationale: |
      POB uses servant/servants consistently in reader-facing English Bible text.
      Where δοῦλος, עֶבֶד, or another source term carries legal bondage, household
      status, ownership, or total-allegiance force, that nuance remains explicit in
      lexical decisions, footnotes, and public audit metadata rather than using
      slave/slaves as the main wording. This supersedes the prior 2026-04-23 policy.
    affected_verses:
      - ROM.1.1
      - PHP.1.1
      - COL.1.7
      - JAM.1.1
      - 2PE.1.1
      - REV.1.1
      - LUK.1.48
      - LUK.2.29
      - ACT.2.18
      - GEN.9.25
    scale: project-wide reader terminology
    fix_script: product-wide source/export/reader normalization (2026-07-14)
    prompt_injection: |
      CRITICAL — POB POLICY: Use "servant" / "servants" in reader-facing text.
      Do not use the standalone words "slave" or "slaves" in translation.text.
      Preserve bonded-status, ownership, and total-allegiance nuance in notes and
      audit metadata instead of the main wording.
      Examples of CORRECT POB rendering:
        "Paul, a servant of Christ Jesus"
        "to his servants" in Rev 1:1
        "releasing your servant" in Luke 2:29

  - id: hebrew-name-form-in-english-reader
    discovered: "2026-07-18"
    fixed: "2026-07-18"
    category: terminology_consistency
    source_term: יוֹסֵף / יַעֲקֹב (Hebrew)
    wrong_rendering: Yosef / Yaakov in base English translation.text
    correct_rendering: Joseph / Jacob
    policy_ref: "DOCTRINE.md §2 — transliterate names by standard conventions"
    rationale: |
      "Yosef" and "Joseph" identify the same person, as do "Yaakov" and "Jacob."
      Mixing closer Hebrew spellings into a reader that otherwise uses the standard
      English forms makes a single person appear to have two names and can imply a
      textual distinction that is not present in the source. The base English reader
      therefore uses Joseph and Jacob consistently. Closer Hebrew forms remain
      documented in footnotes, lexical alternatives, and revision history.
    affected_verses:
      - GEN.37.33
      - GEN.39.7
      - GEN.39.10
      - GEN.39.22
      - GEN.43.25
      - GEN.45.27
      - GEN.47.29
      - GEN.50.17
      - EXO.1.8
    scale: 9 Joseph-form outliers and 1 Jacob-form outlier
    fix_script: manual source normalization and regression guard (2026-07-18)
    prompt_injection: |
      ENGLISH READER NAME CONSISTENCY: Use "Joseph" and "Jacob" in base English
      translation.text. Do not switch individual verses to "Yosef" or "Yaakov."
      Preserve the closer Hebrew forms only in notes, alternatives, and audit metadata.

  - id: john21-approved-love-distinction
    discovered: "2026-09-06"
    fixed: "2026-09-06"
    category: source_distinction_loss
    source_term: "ἀγαπάω / φιλέω in John 21:15–17"
    wrong_rendering: "Collapsing the approved exchange back to undifferentiated love"
    correct_rendering: "agape-love / phileo-love in the approved seven-occurrence sequence"
    policy_ref: "DOCTRINE.md §Source distinctions and optimal English"
    rationale: |
      Preserve the Greek word choices in the English dialogue. Jesus asks with
      agape-love in verses 15–16 and phileo-love in verse 17; all Peter's answers
      and the narrative repetition in verse 17 use phileo-love. This is a scoped
      maintainer-approved rendering, not a global lexical hierarchy.
    affected_verses: [JHN.21.15, JHN.21.16, JHN.21.17]
    fix_script: "tools/source_distinction_audit.py (validation, not automatic rewriting)"
    prompt_injection: |
      Keep the approved John 21:15–17 agape-love/phileo-love wording in POB and
      SPOB. Do not move this distinction back into a debate footnote or claim
      an unchanged result has passed review without explicit source checks.
