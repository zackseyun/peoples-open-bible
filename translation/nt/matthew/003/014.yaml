  to: But John tried to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
  rationale: The imperfect verb διεκώλυεν here is a classic conative imperfect, which expresses an action that was attempted but not completed. 'Tried to prevent' perfectly captures this grammatical nuance. 'Kept trying to prevent' forces an iterative (repeated) sense that is likely absent in this immediate interaction and makes the English slightly clunky.
