translation:
  language: ko
  text: 우리의 힘이신 하나님께 기쁨으로 노래하십시오. 야곱의 하나님께 환호하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  english_pob_choice: For the choir director
  chosen_korean: 지휘자에게
  alternatives_korean:
  - 음악 감독에게
  - 합창 지휘자에게
  lexicon: HALOT
  rationale: 시편 표제에서 이 분사는 음악 수행을 맡은 책임자에게 주는 지시로 이해하는 것이 자연스럽습니다. 현대 한국어에서는 기능을 분명히 드러내는 ‘지휘자’가 가장 간결합니다.
- source_word: עַל
  english_pob_choice: according to
  chosen_korean: 「가티트」에 맞추어
  alternatives_korean:
  - 「가티트」에 따라
  - 「가티트」에 근거하여
  lexicon: HALOT
  rationale: 여기서 עַל은 단순한 ‘위에’가 아니라 곡조·연주 양식 표지를 가리키는 용법이므로, 음악적 대응을 살린 ‘맞추어’가 적절합니다.
- source_word: הַגִּתִּית
  english_pob_choice: The Gittith
  chosen_korean: 「가티트」
  alternatives_korean:
  - 「깃딧」
  - 「가드식」
  lexicon: HALOT
  rationale: 정확한 의미가 불확실하므로 음역을 유지해 본문의 모호성을 보존했습니다. 음가도 한국어에서 자연스러운 외래어 표기 쪽을 따랐습니다.
- source_word: לְאָסָף
  english_pob_choice: Of Asaph
  chosen_korean: 아삽의 시입니다
  alternatives_korean:
  - 아삽의 것입니다
  - 아삽에게
  lexicon: HALOT
  rationale: 시편 표제의 ל + 인명은 저자·소속·전승을 모두 아울러 가리킬 수 있으므로, ‘아삽의’로 옮겨 그 유보적 성격을 보존했습니다.
theological_decisions:
- issue: 시편 표제의 기능과 문체
  chosen_reading: 본문이 아니라 예배용 지시문과 저자 표지를 함께 담은 표제로 읽고, 문체는 간결한 합쇼체로 유지했습니다.
  alternative_readings:
  - 모두를 한 문장으로 풀어 설명하는 방식
  - 각 요소를 주석처럼 분리하는 방식
  rationale: 히브리어 표제의 압축성을 살리면서도 한국어에서 읽히는 문장 형태를 확보하기 위한 선택입니다.
  doctrine_reference: 시편 표제의 장르/문학적 기능
- issue: 정확한 의미가 불확실한 երաժත් 용어 보존
  chosen_reading: 의미가 확정되지 않은 음악 용어는 해석을 단정하지 않고 음역으로 남겼습니다.
  alternative_readings:
  - 특정 악기명으로 단정
  - 특정 곡조명으로 확정
  rationale: 본문이 허용하는 범위를 넘는 단정은 피해야 하며, 의미상의 긴장을 보존하는 것이 원문 충실성에 더 부합합니다.
  doctrine_reference: 원문 우선 번역 원칙
