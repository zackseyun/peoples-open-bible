translation:
  text: After this he showed me the angels of punishment, ready to come and release all the power of the water beneath
    the earth, so that it may be for judgment and manifestation[a] to all who live [and dwell] on dry land.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: 'The purpose phrase is read as two coordinated expressions: “for judgment and for manifestation.” The
      related verbal entry photographed in Dillmann, columns 298–299, includes senses of appearing, showing or making
      manifest, and revealing. “Manifestation” is an interpretation of the nominal construction here, not a gloss
      verified in a separate entry for this exact noun. The source does not separately say what is revealed. “It”
      retains the singular ይኩን without deciding whether water or its power is the precise antecedent.'
  - marker: b
    reason: textual_variant
    text: This unit crosses from printed page 118 to 119. Charles prints [ወየኀድሩ፡], rendered [and dwell], in brackets;
      his note 5 calls it a dittography, reports omission by u and b x, and says the other manuscripts support the
      text. The source asterisks before እለ and ይመጽኡ are retained as edition signs, not translated as words. No manuscript
      was independently inspected.
