id: PRO.31.31
reference: Proverbs 31:31
source:
  edition: WLC
  text: תְּנוּ לָ֭/הּ מִ/פְּרִ֣י יָדֶ֑י/הָ וִֽ/יהַלְל֖וּ/הָ בַ/שְּׁעָרִ֣ים מַעֲשֶֽׂי/הָ־׃
translation:
  text: Give her the fruit of her hands, and let her works praise her at the city gates.
  philosophy: dynamic
lexical_decisions:
- source_word: תְּנוּ
  chosen: Give
  alternatives:
  - Grant
  - Give due
  lexicon: HALOT
  rationale: Imperative plural of נתן, a direct command to bestow or give. 'Give' is the plain and natural English equivalent.
- source_word: לָהּ
  chosen: her
  lexicon: HALOT
  rationale: Indirect object pronoun referring to the excellent wife/woman of the poem; rendered straightforwardly as 'her'.
- source_word: מִפְּרִי
  lemma: מִן
  chosen: the fruit
  alternatives:
  - of the fruit
  - some of the fruit
  lexicon: HALOT
  rationale: Although the Hebrew preposition can be represented literally as “from” or idiomatically as partitive “of,” “Give her the fruit of her hands” is natural English in this reward context and retains the image. The more formally corresponding wording is supplied in the note.
- source_word: יָדֶיהָ
  chosen: of her hands
  alternatives:
  - of her labor
  - her handiwork
  lexicon: HALOT
  rationale: Literally 'her hands.' In Hebrew this commonly stands for labor or productive work. Retaining 'hands' preserves the concrete metaphor while remaining intelligible in English.
- source_word: וִיהַלְלוּהָ
  chosen: and let ... praise her
  alternatives:
  - and may ... praise her
  - and they will praise her
  lexicon: HALOT
  rationale: 'Imperfect/jussive-like form of הלל with prefixed conjunction, functioning as a volitive: ''and let ... praise her.'' This fits the exhortational parallelism with the opening imperative.'
- source_word: בַשְּׁעָרִים
  chosen: at the city gates
  alternatives:
  - at the city gates
  - in the public square
  lexicon: HALOT
  rationale: This naturally communicates the civic/public gate setting without implying that she is physically inside a gate. The literal wording is retained in the note.
- source_word: מַעֲשֶׂיהָ
  chosen: her works
  alternatives:
  - her deeds
  - what she has done
  lexicon: HALOT
  rationale: Plural of מעשה, denoting deeds, works, accomplishments. 'Her works' preserves the concise parallel with 'fruit of her hands' and allows the personified sense that her deeds testify on her behalf.
