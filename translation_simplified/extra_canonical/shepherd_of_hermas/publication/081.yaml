  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Καθὼς δὲ ἐστάθησαν ὁμοῦ κύκλῳ τῆς πύλης, οὕτως ἐβάσταζον αἱ δοκοῦσαι δυναταὶ εἶναι καὶ ὑπὸ τὰς
    γωνίας τοῦ λίθου ὑποδεδυκυῖαι ἦσαν· αἱ δὲ ἄλλαι ἐκ τῶν πλευρῶν τοῦ λίθου ὑποδεδύκεισαν καὶ οὕτως ἐβάσταζον
    πάντας τοὺς λίθους· διὰ δὲ τῆς πύλης διέφερον αὐτούς, καθὼς ἐκελεύσθησαν, καὶ ἐπεδίδουν τοῖς ἀνδράσιν
    εἰς τὸν πύργον· ἐκεῖνοι δὲ ἔχοντες τοὺς λίθους ᾠκοδόμουν. 2. ἡ οἰκοδομὴ δὲ τοῦ πύργου ἐγένετο ἐπὶ
    τὴν πέτραν τὴν μεγάλην καὶ ἐπάνω τῆς πύλης. ἡρμόσθησαν οὖν οἱ δέκα λίθοι ἐκεῖνοι, | καὶ ἀνέπλησαν
    ὅλην τὴν πέτραν. καὶ ἐγένοντο ἐκεῖνοι | θεμέλιος τῆς οἰκοδομῆς τοῦ πύργου. ἡ δὲ [πέτρα καὶ ἡ] πύλη
    ἦν βαστάζουσα ὅλον τὸν πύργον. 3. μετὰ δὲ τοὺς δέκα λίθους ἄλλοι ἀνέβησαν ἐκ τοῦ βυθοῦ εἴκοσι πέντε
    λίθοι· καὶ οὗτοι ἡρμόσθησαν εἰς τὴν οἰκοδομὴν τοῦ πύργου, βασταζόμενοι ὑπὸ τῶν παρθένων καθὼς καὶ
    οἱ πρότεροι. μετὰ δὲ τούτους ἀνέβησαν τριάκοντα πέντε· καὶ οὗτοι ὁμοίως ἡρμόσθησαν εἰς τὸν πύργον.
    μετὰ δὲ τούτους ἕτεροι ἀνέβησαν λίθοι τεσσαράκοντα καὶ οὗτοι πάντες ἐβλήθησαν εἰς τὴν οἰκοδομὴν τοῦ
    πύργου· | ἐγένοντο οὖν στοῖχοι τέσσαρες ἐν τοῖς θεμελίοις τοῦ πύργου· | 4. καὶ ἐπαύσαντο ἐκ τοῦ βυθοῦ
    ἀναβαίνοντες· ἐπαύσαντο δὲ καὶ οἱ οἰκοδομοῦντες μικρόν. καὶ πάλιν ἐπέταξαν οἱ ἓξ ἄνδρες τῷ πλήθει
    τοῦ ὄχλου ἐκ τῶν ὀρέων παραφέρειν λίθους εἰς τὴν οἰκοδομὴν τοῦ πύργου. 5. παρεφέροντο οὖν ἐκ πάντων
    τῶν ὀρέων χροαῖς ποικίλαις λελατομημένοι ὑπὸ τῶν ἀνδρῶν καὶ ἐπεδίδοντο ταῖς παρθένοις· αἱ δὲ παρθένοι
    διέφερον αὐτοὺς διὰ τῆς πύλης καὶ ἐπεδίδουν εἰς τὴν οἰκοδομὴν τοῦ πύργου. καὶ ὅταν εἰς τὴν οἰκοδομὴν
    ἐτέθησαν οἱ λίθοι οἱ ποικίλοι, ὅμοιοι ἐγένοντο λευκοί, καὶ τὰς χρόας τὰς ποικίλας ἤλλασσον. 6. τινὲς
    δὲ λίθοι ἐπεδίδοντο ὑπὸ τῶν ἀνδρῶν εἰς τὴν οἰκοδομήν, καὶ οὐκ ἐγίνοντο λαμπροί, ἀλλ᾿ οἷοι ἐτέθησαν,
    τοιοῦτοι καὶ εὑρέθησαν· οὐ γὰρ ἦσαν ὑπὸ τῶν παρθένων ἐπιδεδομένοι, οὐδὲ διὰ τῆς πύλης παρενηνεγμένοι.
    οὗτοι οὖν οἱ λίθοι ἀπρεπεῖς ἦσαν ἐν τῇ οἰκοδομῇ τοῦ πύργου. 7. ἰδόντες δὲ οἱ ἓξ ἄνδρες τοὺς λίθους
    τοὺς ἀπρεπεῖς ἐν τῇ οἰκοδομῇ ἐκέλευσαν αὐτοὺς ἀρθῆναι καὶ ἀπαχθῆναι [κάτω] εἰς τὸν ἴδιον τόπον ὅθεν
    ἠνέχθησαν. 8. καὶ λέγουσι τοῖς ἀνδράσι τοῖς παρεμφέρουσι τοὺς λίθους· Ὅλως ὑμεῖς μὴ ἐπιδίδοτε εἰς
    τὴν οἰκοδομὴν λίθους· τίθετε δὲ αὐτοὺς παρὰ τὸν πύργον, ἵνα αἱ παρθένοι διὰ τῆς πύλης παρενέγκωσιν
    αὐτοὺς καὶ ἐπιδιδῶσιν εἰς τὴν οἰκοδομήν. ἐὰν γάρ, [φασί,] διὰ τῶν χειρῶν τῶν παρθένων τούτων μὴ παρενεχθῶσι
    διὰ τῆς πύλης, τὰς χρόας αὐτῶν ἀλλάξαι οὐ δύνανται· μὴ κοπιᾶτε οὖν, [φασίν,] εἰς μάτην.
