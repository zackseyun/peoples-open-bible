  to: 그리고 당신의 경건한 이들의 의로운 행위들은 주님 앞에 있습니다. 하나님, 사람이 어디에 당신의 아심을 피하여 숨을 수 있겠습니까?
  rationale: 원문의 ποῦ를 장소 의문사로 정확히 반영하고, ἀπὸ τῆς γνώσεώς σου를 하나님의 아심을 피할 수 없다는 자연스러운 한국어 표현으로 다듬었습니다. δικαιοσύναι의 복수성과 원문의 두 호칭은 유지했습니다.
