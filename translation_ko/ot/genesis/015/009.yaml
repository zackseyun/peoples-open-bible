  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו קְחָ֥/ה לִ/י֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְ/עֵ֥ז מְשֻׁלֶּ֖שֶׁת וְ/אַ֣יִל מְשֻׁלָּ֑שׁ וְ/תֹ֖ר וְ/גוֹזָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/009.yaml
  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'take for me.' The sense in context is to bring or procure the animals for the covenant rite.
    reason: lexical_alternative
  - marker: b
    text: The repeated Hebrew term rendered 'three-year-old' is traditionally understood here to indicate animals three years of age.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말씀하셨습니다. 「나를 위하여 세 살 된[b] 암송아지와 세 살 된 암염소와 세 살 된 숫양과 산비둘기와 새끼 비둘기를 가져오십시오[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나를 위해 취하라’입니다. 문맥상 동물을 준비해 가져오라는 뜻이므로 본문에서는 ‘가져오십시오’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 반복된 표현은 이 문맥에서 동물의 나이를 가리키는 것으로 전통적으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
