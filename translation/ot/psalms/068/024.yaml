id: PSA.68.24
reference: Psalms 68:24
source:
  edition: WLC
  text: רָא֣וּ הֲלִיכוֹתֶ֣י/ךָ אֱלֹהִ֑ים הֲלִ֘יכ֤וֹת אֵלִ֖/י מַלְכִּ֣/י בַ/קֹּֽדֶשׁ׃
translation:
  text: They have seen your procession, O God—the procession of my God, my King, in the sanctuary[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “in holiness.”
    reason: alternative_reading
lexical_decisions:
- source_word: רָאוּ
  chosen: They have seen
  alternatives:
  - They saw
  lexicon: HALOT
  rationale: Qal perfect 3cp of ראה, here naturally rendered as a completed action. English present perfect fits the vivid descriptive style of the psalm while preserving the sense of witnessed action.
- source_word: הֲלִיכוֹתֶיךָ
  chosen: your procession
  alternatives:
  - your goings
  - your steps
  - your march
  lexicon: HALOT
  rationale: Plural noun from הלך can denote goings, processional movement, or steps. In this cultic and celebratory context, 'procession' best captures the public, ceremonial movement implied by the repeated noun and surrounding imagery.
- source_word: אֱלֹהִים
  chosen: O God
  alternatives:
  - God
  lexicon: HALOT
  rationale: Direct address is indicated by context and apposition with the following titles; English vocative 'O God' conveys the prayerful-poetic address.
- source_word: הֲלִיכוֹת
  chosen: the procession
  alternatives:
  - the goings
  - the steps
  - the march
  lexicon: HALOT
  rationale: The repeated noun is retained for emphasis. Rendering both occurrences with 'procession' preserves the poetic parallelism and likely cultic sense.
- source_word: אֵלִי
  chosen: my God
  alternatives:
  - God of me
  lexicon: HALOT
  rationale: 'Construct form with 1cs suffix is straightforwardly possessive: ''my God.'''
- source_word: מַלְכִּי
  chosen: my King
  alternatives:
  - my king
  lexicon: HALOT
  rationale: The psalmist applies royal language to God. Capitalizing 'King' in reference to God reflects English convention for divine title without adding content beyond the Hebrew.
- source_word: בַקֹּדֶשׁ
  chosen: in the sanctuary
  alternatives:
  - in holiness
  - in the holy place
  - in the sanctuary
  lexicon: HALOT
  rationale: The Hebrew preposition is locative; the alternative abstract sense is retained in the note.
- source_word: הֲלִיכוֹתֶיךָ ... הֲלִיכוֹת
  chosen: your procession ... the procession
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Collective singular is natural English for the ceremonial movement.
