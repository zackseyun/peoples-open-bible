- timestamp: '2026-07-12T06:40:40Z'
  previous_text: 'So I did my part as someone committed to unity. But God does not dwell where there is division and anger. The Lord forgives everyone who repents and returns to unity with God and to the bishop’s council. I trust in the grace of Jesus Christ, who will break every chain that binds you. I urge you:


    Do nothing out of party spirit. Instead, follow Christ’s teaching. I heard some people say, “If I do not find it in the written records, I do not believe it is in the Gospel.” When I told them, “It is written,” they replied, “That is exactly what we dispute.”


    But for me, Jesus Christ is my charter—my sure authority. The charter that cannot be broken is his cross, his death, his resurrection, and faith through him. On this basis I desire to be justified, with the help of your prayers.'
