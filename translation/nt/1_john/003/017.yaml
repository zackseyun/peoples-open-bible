  category: meaning_retranslation
  from: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
  to: But if someone has material possessions and sees a brother or sister in need, yet closes their heart to them, how can the love of God[a] remain in that person?
  rationale: The lexical record identifies material resources and deliberate withholding of compassion as the intended meanings. I preserve its caution about 'the love of God,' but replace source-shaped wording where it obscures the practical situation or the force of the rhetorical question.
