translation:
  language: ko
  text: 그가 말했습니다[a]. 「그들은 예고된 것들을 볼 수 있도록 일곱 날 동안 자유를 누릴 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 내게 말했습니다. 「그들은 네가 들은 것들을 볼 수 있도록 일곱 날 동안 자유를 누릴 것이며, 그 뒤에는 자기 거처로 모이게 될 것입니다.」’
    reason: previous_rendering
lexical_decisions:
- source_word: dixit
  english_pob_choice: And he said
  chosen_korean: 그는 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말씀하셨습니다
  lexicon: 표준 동사
  rationale: 라틴어 단순 과거 dixit는 서술적 발화를 나타내므로, 불필요한 대상 보어를 넣지 않고 자연스러운 간접 서술로 옮겼습니다.
- source_word: septem diebus
  english_pob_choice: for seven days
  chosen_korean: 일곱 날 동안
  alternatives_korean:
  - 칠 일 동안
  - 일곱 날에 걸쳐
  lexicon: 시간 표현
  rationale: 기간을 나타내는 전치사구로, 문어체이면서도 원문의 직설성을 살려 ‘일곱 날 동안’으로 번역했습니다.
- source_word: libertas earum
  english_pob_choice: they will have freedom
  chosen_korean: 자유를 누리게 되어
  alternatives_korean:
  - 자유를 얻게 되어
  - 자유롭게 되어
  lexicon: libertas
  rationale: libertas는 단순 상태보다 해방/자유 상태를 뜻하므로, ‘누리다’로 자연스러운 상태 지속을 드러냈습니다.
- source_word: ut uideant
  english_pob_choice: so that they may see
  chosen_korean: 보게 될 것입니다
  alternatives_korean:
  - 볼 수 있도록
  - 보게 하려는 것입니다
  lexicon: 목적절
  rationale: ut+subjunctive의 목적을 한국어에서는 결과가 분명한 미래 표현으로 풀어, 목적과 결과를 함께 살렸습니다.
- source_word: qui praedicti
  english_pob_choice: the things that were foretold
  chosen_korean: 예언된 것들
  alternatives_korean:
  - 미리 말해진 것들
  - 전에 예고된 것들
  lexicon: praedictus
  rationale: praedicti는 ‘미리 말해진/예고된’의 수동 분사이므로, 종교적 어법을 과도하게 덧씌우지 않고 ‘예언된 것들’로 옮겼습니다.
theological_decisions:
- issue: 자유(libertas)의 성격
  chosen_reading: 여기서의 자유는 정치적/법적 해방이라기보다, 제한이 풀린 상태에서 미리 정해진 것들을 볼 수 있게 되는 허용된 기간으로 이해했습니다.
  alternative_readings:
  - 단순한 일시적 휴가
  - 영적 자유
  rationale: 문맥상 징벌의 중지나 섭리적 허용을 가리키므로, 한국어에서도 추상화하거나 신학적으로 확장하지 않고 본문이 말하는 범위 안에 두었습니다.
  doctrine_reference: 본문 문맥 우선 원칙
