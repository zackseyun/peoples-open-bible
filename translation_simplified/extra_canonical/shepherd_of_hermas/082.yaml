  text: Καὶ ἐτελέσθη τῇ ἡμέρᾳ ἐκείνῃ ἡ οἰκοδομή, οὐκ ἀπετελέσθη δὲ ὁ πύργος· ἔμελλε γὰρ [πάλιν] ἐποικοδομεῖσθαι·
    καὶ ἐγένετο ἀνοχὴ τῆς οἰκοδομῆς. ἐκέλευσαν δὲ οἱ ἓξ ἄνδρες τοὺς οἰκοδομοῦντας ἀναχωρῆσαι μικρὸν [πάντας]
    καὶ ἀναπαυθῆναι· ταῖς δὲ παρθένοις ἐπέταξαν ἀπὸ τοῦ πύργου μὴ ἀναχωρῆσαι. ἐδόκει δέ μοι τὰς παρθένους
    καταλελεῖφθαι τοῦ φυλάσσειν τὸν πύργον. 2. μετὰ δὲ τὸ ἀναχωρῆσαι πάντας [καὶ ἀναπαυθῆναι] λέγω τῷ
    ποιμένι· Διατί, φημί, κύριε, οὐ συνετελέσθη ἡ οἰκοδομὴ τοῦ πύργου; Οὔπω, φησί, δύναται ἀποτελεσθῆναι
    ὁ πύργος, ἐὰν μὴ ἔλθῃ ὁ κύριος αὐτοῦ καὶ δοκιμάσῃ τὴν οἰκοδομὴν ταύτην, ἵνα ἐάν τινες λίθοι σαπροὶ
    εὑρεθῶσιν, ἀλλάξῃ αὐτούς· πρὸς γὰρ τὸ ἐκείνου θέλημα οἰκοδομεῖται ὁ πύργος. 3. Ἤθελον, φημί, κύριε,
    τούτου τοῦ πύργου γνῶναι τί ἐστιν ἡ οἰκοδομὴ αὕτη, καὶ περὶ τῆς πέτρας καὶ πύλης καὶ τῶν ὀρέων καὶ
    τῶν παρθένων, καὶ τῶν λίθων τῶν ἐκ τοῦ βυθοῦ ἀναβεβηκότων καὶ μὴ λελατομημένων, ἀλλ᾿ οὕτως ἀπελθόντων
    εἰς τὴν οἰκοδομήν. 4. καὶ διατί πρῶτον εἰς τὰ θεμέλια δέκα λίθοι ἐτέθησαν, εἶτα εἴκοσι πέντε, εἶτα
    τριάκοντα πέντε, εἶτα τεσσαράκοντα, καὶ περὶ τῶν λίθων τῶν ἀπεληλυθότων εἰς τὴν οἰκοδομὴν καὶ πάλιν
    ἠρμένων καὶ εἰς τόπον ἴδιον ἀποτεθειμένων· περὶ πάντων τούτων διανάπαυσον τὴν ψυχήν μου, κύριε, καὶ
    γνώρισόν μοι αὐτά. 5. Ἐάν, φησί, κενόσπουδος μὴ εὑρεθῇς, πάντα γνώσῃ. μετ᾿ ὀλίγας γὰρ ἡμέρας | ἐλευσόμεθα
    ἐνθάδε, καὶ τὰ λοιπὰ ὄψει τὰ ἐπερχόμενα τῷ πύργῳ τούτῳ, καὶ πάσας τὰς παραβολὰς ἀκριβῶς γνώσῃ. 6.
    καὶ μετ᾿ ὀλίγας ἡμέρας | ἤλθομεν εἰς τὸν τόπον οὗ κεκαθίκαμεν, καὶ λέγει μοι· Ἄγωμεν πρὸς τὸν πύργον·
    ὁ γὰρ αὐθέντης τοῦ πύργου ἔρχεται κατανοῆσαι αὐτόν. καὶ ἤλθομεν πρὸς τὸν πύργον· καὶ ὅλως οὐθεὶς ἦν
    πρὸς αὐτὸν εἰ μὴ αἱ παρθένοι μόναι. 7. καὶ ἐπερωτᾷ ὁ ποιμὴν τὰς παρθένους εἰ ἄρα παρεγεγόνει ὁ δεσπότης
    τοῦ πύργου. αἱ δὲ ἔφησαν μέλλειν αὐτὸν ἔρχεσθαι κατανοῆσαι τὴν οἰκοδομήν.
