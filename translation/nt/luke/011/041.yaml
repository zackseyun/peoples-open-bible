  meaning: Jesus directs them to give to the poor rather than concentrate on outward cleansing, declaring that everything will then be clean for them.
  meaning_decisions:
  - source_phrase: τὰ ἐνόντα
    prior_rendering: the things that are within
    new_rendering: what is inside the cup and dish
    rationale: The concrete act of almsgiving and the preceding vessel image support understanding the phrase as their contents; naming the vessels prevents readers from imagining that greed and wickedness themselves are to be given away.
  - source_phrase: δότε ἐλεημοσύνην
    prior_rendering: give as alms
    new_rendering: give ... to the poor
    rationale: Almsgiving means giving to the needy, so the recipient implicit in the Greek term is expressed directly.
  - source_phrase: πλὴν ... καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν
    prior_rendering: But ... and behold, everything is clean for you
    new_rendering: Rather ... and everything will be clean for you
    rationale: The corrective instruction and its announced result are made clear in natural English.
