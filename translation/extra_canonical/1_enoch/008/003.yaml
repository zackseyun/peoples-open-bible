translation:
  text: Amizarak taught spell-casters and root-cutters; Armaros taught the undoing
    of spells; Baraqyal taught observers of the stars; Kokabiel taught signs; Tami'el
    taught the observation of a star; and Asdriel taught the course of the moon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge’ez names spell-casters, root-cutters, and observers of stars rather
      than explicitly naming the arts of spell-casting, root-cutting, and astrology.
    reason: lexical_alternative
  - marker: b
    text: The witness says only “signs”; what signs are meant is not stated.
    reason: lexical_alternative
lexical_decisions:
- source_word: መሳብዕያነ፡ ወመታርያነ፡ ሥርዋት
  chosen: spell-casters and root-cutters
  alternatives:
  - spell-casting and root-cutting
  rationale: Preserves the witness’s person-denoting expressions and its concrete
    reference to roots.
- source_word: ፈትሐ፡ ስብዐታተ
  chosen: the undoing of spells
  alternatives:
  - the unbinding of enchantments
  rationale: Retains the image of releasing or undoing rather than replacing it with
    a general term for magic.
- source_word: ራዓይያነ፡ ከዋክብት
  chosen: observers of the stars
  alternatives:
  - star-gazers
  - astrologers
  rationale: The witness speaks of people who observe stars; “astrologers” would specify
    a practice it does not explicitly name.
- source_word: ትእምርታተ
  chosen: signs
  alternatives:
  - celestial signs
  rationale: The object is unspecified, so the translation does not supply “celestial.”
- source_word: ርእየ፡ ከከብ
  chosen: the observation of a star
  alternatives:
  - the sight of a star
  - the appearance of a star
  rationale: Keeps the singular “star” and distinguishes this phrase from the earlier
    plural “stars.”
- source_word: ሩፀተ፡ ወርኅ
  chosen: the course of the moon
  alternatives:
  - the moon’s movement
  rationale: Preserves the image of the moon’s course without specifying an astronomical
    system.
