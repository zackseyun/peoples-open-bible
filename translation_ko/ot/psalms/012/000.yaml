  lexicon: HALOT
  rationale: 원문은 음악적·전례적 지시일 가능성이 크므로, 의미를 드러내면서도 해석을 과도하게 좁히지 않는 표제로 처리했습니다.
- source_word: מִזְמ֥וֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 찬양시
  - 노래
  - 시편
  lexicon: HALOT
  rationale: 장르 표지로서 가장 간결하고 자연스러운 한국어는 ‘시’이며, 책명인 ‘시편’과 혼동되지 않도록 단수형 장르명으로 옮겼습니다.
- source_word: לְ/דָוִֽד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
