  - 시체들과 섞여 더러워졌습니다
  lexicon: 더럽히다, 죽은 자
  rationale: τοῖς νεκροῖς의 대상성을 살리면서도, 의식적 부정의 강한 함의를 한국어 ‘더러워지다’로 전달했습니다.
theological_decisions:
- issue: 탄식문과 수사 의문문의 보존
  chosen_reading: 본문의 연속된 질문을 설명문으로 풀지 않고 탄식하는 호소로 보존했습니다.
  alternative_readings:
  - 이스라엘의 처지를 해설하는 진술문으로 완화
  - 정서적 요소를 줄인 직설 번역
  rationale: 히브리/헬라 탄식 전통의 수사 질문은 단순 정보 요청이 아니라 상태의 비참함을 드러내므로, 그 기능을 유지했습니다.
  doctrine_reference: 예언서적 탄식과 언약 위기 진술
- issue: 죽은 자와의 접촉으로 인한 부정성
  chosen_reading: ‘죽은 자들과 함께 더러워졌습니다’로 의식적 부정의 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘죽은 자들로 인해 부정해졌습니다’
  - ‘시체와 접촉하여 부정하게 되었습니다’
  rationale: 원문의 μι-오염 어근과 전치사구의 결합이 단순 오염이 아니라 의례적 부정을 암시하므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 정결/부정 개념
