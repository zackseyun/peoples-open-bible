  from: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
  to: Jotham rested in death with his ancestors[a] and was buried in the City of David. His son Ahaz succeeded him as king.
  rationale: The lexical record rightly recognizes the death formula and values its sleep imagery, but defends wording that can mislead contemporary readers. I preserve the ancestral-repose image while explicitly identifying death, and render the burial and succession formulas idiomatically.
