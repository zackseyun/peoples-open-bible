  yaml_path: translation/ot/psalms/055/019.yaml
  text: God will hear and humble them—he who sits enthroned from of old (Selah)—for they have no changes,[a] and they do not fear God.
  footnotes:
  - marker: a
    text: Or “they experience no reversals.” The Hebrew phrase is difficult and may describe an untroubled, unchanged condition that leaves them complacent.
    reason: lexical_alternative
translation:
  language: ko
  text: '하나님께서 들으시고 그들을 낮추실 것입니다—옛부터 좌정하시는 분께서. 셀라.

    그들에게는 변화가 없고, 그들은 하나님을 경외하지 않습니다.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 들으시고 그들에게 응답하실 것입니다.” 히브리어 동사는 ‘응답하다’로 이해될 수 있으나, 문맥에서는 심판으로 그들을 낮추시거나 괴롭게 하신다는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “그들에게는 변동이 없다” 또는 “그들에게는 역전이 없다.” 히브리어 표현은 난해하며, 그들이 처지의 변화를 겪지 않아 안일해진 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּדָה
