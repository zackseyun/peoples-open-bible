  to: 또 돌을 퍼붓는 분노로 가득 찬 우박들이 내던져질 것이며, 바다의 물은 그들에게 맞서 격분하고, 강물들은 갑자기 그들을 휩쓸 것입니다.
  rationale: 투석의 이미지를 지닌 πετροβόλου를 ‘돌을 퍼붓는’으로 옮겨 원문의 비유적·의인화된 심판 묘사를 보존했습니다. ἀγανατήσει는 ‘격분하고’로, συγκλύσουσιν은 물에 휩쓸려 압도되는 결과를 드러내는 ‘휩쓸 것입니다’로 다듬었습니다. 본문에 필요한 본문비평상 불확실성이나 별도 주석 표지는 없습니다.
