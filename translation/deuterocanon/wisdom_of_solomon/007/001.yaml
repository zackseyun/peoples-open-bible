id: WIS.7.1
reference: Wisdom of Solomon 7:1
source:
  edition: lxx-swete-1909
  text: Εἰμὶ μὲν κἀγὼ θνητὸς ἴσος ἅπασιν, καὶ γηγενοῦς ἀπόγονος πρωτοπλάστου· καὶ ἐν κοιλίᾳ μητρὸς ἐγλύφην σάρξ
  language: Greek
  pages:
  - 631
  confidence: high
  validation: agree
  note: This verse is being loaded from the normalized translation-ready override layer derived from the adjudicated corpus. Translation-ready override derived from final_corpus_adjudicated; dropped duplicate chapter 20 and spillover beyond Wisdom 19:22.
translation:
  text: I too am mortal, like everyone else, and a descendant of the first man, who was formed from the earth[a]. In my mother’s womb I was molded into flesh.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: An allusion to Adam’s formation from the ground in Genesis 2:7.
    reason: cross_reference
lexical_decisions:
- source_word: θνητός
  chosen: mortal
  alternatives:
  - subject to death
  - mortal man
  lexicon: LSJ
  rationale: The adjective denotes mortality or being liable to death. 'Mortal' is concise and natural English, preserving the emphasis on shared human frailty.
- source_word: ἴσος ἅπασιν
  chosen: equal to all
  alternatives:
  - like all
  - on equal terms with everyone
  lexicon: LSJ
  rationale: This phrase stresses common human status rather than merely similarity. 'Equal to all' preserves the comparative force of ἴσος with the dative/plural sense.
- source_word: γηγενοῦς
  chosen: earth-born
  alternatives:
  - born of the earth
  - earthly
  lexicon: LSJ
  rationale: The compound literally means 'earth-born.' Retaining this vivid expression preserves the allusion to humanity's origin from the ground.
- source_word: ἀπόγονος
  chosen: descendant
  alternatives:
  - offspring
  - issue
  lexicon: LSJ
  rationale: The noun indicates one born from an ancestor. 'Descendant' is idiomatic and fits the genealogical sense in relation to the first-formed man.
- source_word: πρωτοπλάστου
  chosen: first-formed man
  alternatives:
  - first-formed one
  - first-created man
  - Adam
  lexicon: LSJ
  rationale: The term means 'first-formed' and alludes to Adam without naming him explicitly. 'First-formed man' preserves the lexical content and the anthropological reference without importing the proper name into the main text.
- source_word: ἐγλύφην
  chosen: I was molded
  alternatives:
  - I was formed
  - I was carved/shaped
  lexicon: LSJ
  rationale: The verb can denote engraving or carving, but in this prenatal context it refers to being shaped or formed. 'I was molded' captures the passive formation imagery while sounding natural in English.
- source_word: σάρξ
  chosen: flesh
  alternatives:
  - body
  lexicon: LSJ
  rationale: Here the term is literal, not metaphorical. Per project guidance, σάρξ should be rendered 'flesh' in literal contexts.
