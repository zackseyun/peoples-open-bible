theological_decisions:
- issue: Identification of πνεῦμα (a spirit vs. the Holy Spirit)
  chosen_reading: Render as “a spirit,” leaving the agent unspecified.
  alternative_readings:
  - the Spirit (i.e., the Holy Spirit)
  rationale: The Greek lacks the article and Hermas often narrates visionary transport by an unnamed spirit;
    leaving it indefinite preserves the text’s ambiguity and avoids over-interpretation.
- issue: Translation of ἐκλεκτοῖς (ecclesial identity)
  chosen_reading: Render as the elect; chosen ones remains an alternative in the note.
  alternative_readings:
  - the chosen ones
  rationale: Preserve the selected phrase and its named God referent while exposing the Ethiopic rendering’s
    Lord alternative.
- issue: Addressing the figure as Κυρία
  chosen_reading: Translate Κυρία as “Lady.”
  alternative_readings:
  - Madam
  - Mistress
  rationale: “Lady” conveys respect without servile connotations and aligns with Hermas’s symbolic portrayal
    of a dignified elder woman associated later with the Church.
- issue: Rendering ἡγήσατο ἄξιον
  chosen_reading: Translate as had counted me worthy.
  alternative_readings:
  - had counted me worthy
  - had considered me worthy
  rationale: Preserve the worthiness judgment and disclosure of former sins as the stated reasons for
    prayer and glorification. No additional doctrinal cause is supplied.
