translation:
  text: 'Accordingly, it is written in the poet:


    Odysseus sat on the island, suffering and grieving,

    and turning his face away from Calypso’s words and charms,

    yearning to see his village again and smoke rising from it.

    And if he had not [received] help from Heaven,

    [he could not have returned] to his village. (Homer, Odyssey 1.48–1.59)


    Again, [Helen also] says:


    My heart changed within me;

    [] it is to my home that I would return. (Homer, Odyssey 4.260–261)


    For she moaned, saying:


    It is Aphrodite who misled me

    and took me away from my village.

    I abandoned my own daughter,

    and my husband, good, intelligent, and handsome. (Homer, Odyssey 4.261–4.264)


    For when the soul abandons her perfect husband because of the disloyalty of Aphrodite, who comes into existence here through the act of begetting, she will then come to harm. But if she moans and repents[a], she will be returned to her house.'
