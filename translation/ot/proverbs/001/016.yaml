id: PRO.1.16
reference: Proverbs 1:16
source:
  edition: WLC
  text: כִּ֣י רַ֭גְלֵי/הֶם לָ/רַ֣ע יָר֑וּצוּ וִֽ֝/ימַהֲר֗וּ לִ/שְׁפָּךְ דָּֽם־׃
translation:
  text: For their feet run to do evil, and they hurry to shed blood.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  lexicon: HALOT
  rationale: Introduces the reason for the preceding warning; 'for' is natural and preserves the explanatory force in context.
- source_word: רַגְלֵיהֶם
  chosen: their feet
  lexicon: HALOT
  rationale: Literal rendering of the plural construct with pronominal suffix. Keeping the body-part imagery preserves the Hebrew metaphor of eagerness expressed through movement.
- source_word: לָרַע
  chosen: to do evil
  alternatives:
  - to do evil
  - toward evil
  lexicon: HALOT
  rationale: The Hebrew compactly marks evil as the goal of their eager action. “To do evil” is the smallest natural-English expansion and is supported by the parallel purpose phrase.
- source_word: יָרוּצוּ
  chosen: run
  alternatives:
  - rush
  lexicon: HALOT
  rationale: Basic sense is physical running; in context it conveys haste and eagerness. 'Run' keeps the metaphor vivid and pairs well with the parallel verb that follows.
- source_word: וִימַהֲרוּ
  chosen: and they hurry
  alternatives:
  - and they hasten
  - and they are quick
  lexicon: HALOT
  rationale: Captures the piel/imperfect sense of making haste. 'Hurry' is readable modern English and preserves the parallel intensification with 'run'.
- source_word: לִשְׁפָּךְ
  chosen: to shed
  alternatives:
  - to pour out
  lexicon: HALOT
  rationale: In collocation with 'blood,' the idiomatic sense is 'shed blood.' 'Pour out blood' would be overly literal and less natural in English.
- source_word: דָּם
  chosen: blood
  lexicon: HALOT
  rationale: Standard rendering. In this context it denotes violent bloodshed, but the simple noun 'blood' best preserves the Hebrew expression.
