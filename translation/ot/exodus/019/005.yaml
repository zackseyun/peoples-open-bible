  category: meaning_retranslation
  from: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
  to: Now, if you truly obey me and keep my covenant, then you will be my treasured possession out of all the peoples, for all the earth is mine.
  rationale: The earlier rationale explicitly recognized obedient hearing but preferred “listen” for source transparency; the covenant condition and the people’s response favor stating obedience directly. “Treasured possession,” “covenant,” and Yahweh’s ownership of all the earth are retained without weakening either Israel’s distinct status or the universal claim.
