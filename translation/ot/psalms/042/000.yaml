id: PSA.42.0
reference: Psalms 42:0
source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ מַשְׂכִּ֥יל לִ/בְנֵי קֹֽרַח־׃
translation:
  text: For the choirmaster. A Maskil[a] of the sons of Korah[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: A technical term in psalm headings whose exact meaning is uncertain, possibly an instructive or contemplative composition.
    reason: lexical_alternative
  - marker: b
    text: The sons of Korah were a family of Levite temple singers; the heading may indicate authorship, association, or intended performers.
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  chosen: For the choirmaster
  alternatives:
  - To the choirmaster
  - For the director of music
  - For the leader
  lexicon: HALOT
  rationale: In psalm superscriptions this term conventionally denotes the musical director or chief musician. 'Choirmaster' is concise, idiomatic, and preserves the liturgical/musical function better than the vaguer 'leader.' 'For' fits the likely dedicatory force of ל in superscriptions.
- source_word: מַשְׂכִּיל
  chosen: A Maskil
  alternatives:
  - A contemplative psalm
  - An instructive song
  - A skillful song
  lexicon: HALOT
  rationale: The precise meaning of this technical psalm heading remains uncertain. Retaining 'Maskil' transliterates the genre term rather than overstating a debated interpretation. The indefinite article reflects its function as a classification in English.
- source_word: לִבְנֵי
  chosen: of the sons of
  alternatives:
  - for the sons of
  - belonging to the sons of
  lexicon: HALOT
  rationale: The preposition ל in superscriptions can indicate authorship, association, or dedication. 'Of the sons of' is a standard, suitably broad rendering that preserves the ambiguity without forcing either authorship or mere performance assignment.
- source_word: קֹרַח
  chosen: Korah
  lexicon: HALOT
  rationale: Personal names are transliterated by standard convention per project philosophy.
