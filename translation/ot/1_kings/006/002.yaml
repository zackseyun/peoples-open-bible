id: 1KI.6.2
reference: 1 Kings 6:2
source:
  edition: WLC
  text: וְ/הַ/בַּ֗יִת אֲשֶׁ֨ר בָּנָ֜ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ לַֽ/יהוָ֔ה שִׁשִּֽׁים אַמָּ֥ה אָרְכּ֖/וֹ וְ/עֶשְׂרִ֤ים רָחְבּ֑/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתֽ/וֹ־׃
translation:
  text: The house that King Solomon built for Yahweh was sixty cubits[a] long, twenty cubits wide, and thirty cubits high.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: A cubit was roughly eighteen inches (45 centimeters), though the precise standard used here is uncertain.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַבַּיִת
  chosen: The house
  alternatives:
  - And the house
  - the temple
  - Now the house
  lexicon: HALOT
  rationale: 'בַּיִת literally means ''house.'' In this temple-building context it refers to the temple structure, but ''house'' preserves the Hebrew wording and its theological resonance (''house'' for the LORD''s dwelling). The prefixed conjunction is rendered ''Now'' for natural English narrative flow. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: אֲשֶׁר
  chosen: that
  alternatives:
  - which
  lexicon: HALOT
  rationale: Standard relative pronoun introducing the clause; 'that' is idiomatic modern English.
- source_word: בָּנָה
  chosen: built
  alternatives:
  - was building
  - constructed
  lexicon: HALOT
  rationale: Qal perfect 3ms indicates completed action in narrative description; 'built' is the straightforward rendering.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  chosen: King Solomon
  alternatives:
  - the king, Solomon
  lexicon: HALOT
  rationale: Appositional royal title plus proper name is best rendered in standard English order as 'King Solomon.'
- source_word: לַיהוָה
  chosen: for the LORD
  alternatives:
  - to the LORD
  - for Yahweh
  lexicon: HALOT
  rationale: 'The preposition ל here marks dedication/purpose: the house was built for the LORD. Per doctrine, יהוה is rendered ''the LORD,'' with ''Yahweh'' preserved only as an alternative, not in the main text.'
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  chosen: sixty cubits long
  alternatives:
  - its length was sixty cubits
  lexicon: HALOT
  rationale: The Hebrew gives number + unit + 'its length.' English commonly compresses this to an adjectival measurement phrase while preserving the sense exactly.
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  chosen: twenty wide
  alternatives:
  - twenty cubits wide
  - its width was twenty cubits
  lexicon: HALOT
  rationale: Although אַמָּה is not repeated here, it is understood from the measurement sequence. 'Twenty wide' is concise and natural; the unit is implied from the parallel measurements. The omitted unit is not supplied in the main text to avoid overtranslation.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  chosen: thirty cubits high
  alternatives:
  - its height was thirty cubits
  lexicon: HALOT
  rationale: קוֹמָה denotes height. English measurement style naturally renders this as 'thirty cubits high.'
