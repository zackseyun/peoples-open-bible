translation:
  language: en
  text: When they heard what Peter had told them, they stopped objecting and glorified God. They said, “So God has also given non-Jews the repentance[b][a] that leads to life.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek term is often translated “repentance.”
    reason: lexical_alternative
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
