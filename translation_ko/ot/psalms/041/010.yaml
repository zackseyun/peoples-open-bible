translation:
  language: ko
  text: 그러나 야훼여, 제게 은혜를 베푸시고 저를 일으켜 세우셔서, 제가 그들에게 갚게 하소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러면 제가 그들에게 갚겠습니다.’ 히브리어 코호르타티브는 앞선 청원에 따른 목적이나 결과로, 또는 청원 뒤에 이어지는 화자의 결의로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Even
  chosen_korean: 심지어
  alternatives_korean:
  - 또한
  - 더구나
  lexicon: HALOT
  rationale: 문맥상 단순 첨가가 아니라 배신의 충격을 강조하는 표현이므로, ‘심지어’가 영어 POB의 ‘Even’을 가장 자연스럽게 받습니다.
- source_word: אִישׁ שְׁלוֹמִי
  english_pob_choice: my close friend
  chosen_korean: 내 평화의 사람
  alternatives_korean:
  - 내 가까운 친구
  - 나와 평화로운 사람
  - 내 친구
  lexicon: HALOT
  rationale: 직역하면 ‘내 평화의 사람’이지만, 한국어 본문에서는 관용성을 너무 빨리 풀지 않고 원문 이미지를 살리되, ‘평화’는 관계적 신뢰와 친밀함을 드러내도록 유지했습니다.
- source_word: אֲשֶׁר בָּטַחְתִּי בוֹ
  english_pob_choice: in whom I trusted
  chosen_korean: 내가 신뢰하던
  alternatives_korean:
  - 내가 믿던
  - 내가 의지하던
  lexicon: HALOT
  rationale: בּטח ב의 관계적 신뢰를 살리기 위해 ‘신뢰하던’을 사용했고, 문장 흐름상 관계절을 간결하게 풀었습니다.
- source_word: אוֹכֵל לַחְמִי
  english_pob_choice: who ate my bread
  chosen_korean: 내 빵을 먹은 뒤에
  alternatives_korean:
  - 내 빵을 먹던
  - 내 빵을 먹은 사람
  - 내 빵을 함께 먹은
  lexicon: HALOT
  rationale: ‘먹은 빵’의 구체적 식탁 교제를 보존하되, 한국어에서는 사건의 선후를 자연스럽게 드러내기 위해 ‘먹은 뒤에’로 옮겼습니다.
- source_word: הִגְדִּיל עָקֵב עָלַי
  english_pob_choice: has lifted up his heel against me
  chosen_korean: 내게 발꿈치를 들었습니다
  alternatives_korean:
  - 내게 발꿈치를 들어 올렸습니다
  - 내게 발꿈치를 높였습니다
  - 내게 발꿈치를 겨누었습니다
  lexicon: HALOT
  rationale: ‘발꿈치’ 이미지를 유지해 배신의 관용구를 보존했고, 동작성은 ‘들었습니다’로 간명하게 표현했습니다.
theological_decisions:
- issue: 시편 본문의 직접 의미와 요한복음의 인용 연결
  chosen_reading: 본문은 시편 화자의 배신당한 경험을 직접적으로 말하는 것으로 두고, 메시아적 함의는 본문 밖의 연결로 남깁니다.
  alternative_readings:
  - 요한복음 인용을 염두에 두고 더 명시적으로 배신-메시아 연결을 드러내는 번역
  rationale: 원문은 우선 화자와 가까웠던 사람의 배신을 말하므로, 신약의 후대적 사용을 본문에 앞질러 넣지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3
