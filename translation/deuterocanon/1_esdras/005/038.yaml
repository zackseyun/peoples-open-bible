translation:
  text: 'And from the priests, those who claimed the priesthood, but were not found[a]: the sons of Obbeia, the sons of Akbos,
    the sons of Iaddous, who had taken Augia as a wife from the daughters of Phaexeldai, and he was called by his name[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The Greek is elliptical: ''were not found'' likely concerns the genealogical record or priestly registration; the
      next verse describes the record search.'
    reason: lexical_alternative
  - marker: b
    text: Or 'was named after his name.' The compressed Greek clause does not repeat the name.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  chosen: from the priests
  alternatives:
  - among the priests
  lexicon: LSJ
  rationale: The phrase marks this group as belonging to the priestly class. 'From the priests' is a natural rendering of
    ἐκ with the genitive here.
- source_word: οἱ ἐμποιούμενοι ἱερωσύνης
  chosen: those who claimed the priesthood
  alternatives:
  - those who made a claim to the priesthood
  - those who presented themselves as priests
  lexicon: LSJ
  rationale: The participle ἐμποιούμενοι here conveys making or asserting a claim, not simply performing priestly service.
    In context, the issue is genealogical qualification, so 'claimed the priesthood' best captures the sense.
- source_word: οὐχ εὑρέθησαν
  chosen: were not found
  alternatives:
  - were not discovered
  - could not be found
  lexicon: LSJ
  rationale: The selected Greek expression is rendered 'were not found' in this list or record-search context. The Greek,
    not a same-number parallel, controls the active wording. A retained lexicon label is historical; no fresh consultation
    is claimed.
- source_word: υἱοὶ Ὀββειά
  chosen: the sons of Obbeia
  alternatives:
  - the descendants of Obbeia
  rationale: The selected Greek expression is rendered 'the sons of Obbeia' in this list or record-search context. The Greek,
    not a same-number parallel, controls the active wording. A retained lexicon label is historical; no fresh consultation
    is claimed.
- source_word: υἱοὶ Ἀκβώς
  chosen: the sons of Akbos
  alternatives:
  - the descendants of Akbos
  rationale: As above, the genealogical formula is preserved. The name is transliterated from the Greek witness.
- source_word: υἱοὶ Ἰαδδοὺς
  chosen: the sons of Iaddous
  alternatives:
  - the descendants of Iaddous
  rationale: The Greek proper name is retained by transliteration. 'Sons of' preserves the list structure.
- source_word: τοῦ λαβόντος Αὐγίαν γυναῖκα
  chosen: who had taken Augia as a wife
  alternatives:
  - who had married Augia
  lexicon: LSJ
  rationale: The aorist participle with λαμβάνω plus γυναῖκα is an idiom for marrying. 'Had taken ... as a wife' stays closer
    to the Greek while remaining understandable.
- source_word: τῶν θυγατέρων Φαηξελδαίου
  chosen: from the daughters of Phaexeldai
  alternatives:
  - from the daughters of Phaexeldaios
  - from among the daughters of Phaexeldai
  rationale: The selected Greek expression is rendered 'from the daughters of Phaexeldai' in this list or record-search context.
    The Greek, not a same-number parallel, controls the active wording. A retained lexicon label is historical; no fresh consultation
    is claimed.
- source_word: ἐκλήθη
  chosen: was called
  alternatives:
  - was named
  - was summoned
  lexicon: LSJ
  rationale: The passive of καλέω with ἐπὶ τῷ ὀνόματι naturally means 'was called/named by the name.' 'Was summoned' is possible
    for καλέω generally, but the following phrase about the name points to naming/identification, not summoning.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  chosen: by his name
  alternatives:
  - in his name
  - after his name
  lexicon: LSJ
  rationale: This phrase most naturally indicates designation or identification by a name. 'By his name' preserves the Greek
    closely while remaining intelligible. The referent is somewhat compressed in Greek, so a more expansive rendering would
    risk overinterpretation.
