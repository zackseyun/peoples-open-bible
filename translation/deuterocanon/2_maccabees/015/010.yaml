  text: καὶ τοῖς θυμοῖς διεγείρας αὐτοὺς παρήγγειλεν, ἅμα παρειδείκνυς τὴν τῶν ἐθνῶν ἀθεσίαν καὶ τὴν τῶν ὅρκων παράβασιν.
