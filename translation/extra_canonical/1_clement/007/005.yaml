id: 1CLEM.7.5
reference: 1 Clement 7:5
unit: verse
book: 1 Clement
source:
  edition: Funk 1901 (normalized OCR)
  text: διέλθωμεν εἰς τὰς γενεὰς πάσας καὶ καταμάθωμεν, ὅτι ἐν γενεᾷ καὶ γενεᾷ μετανοίας
    τόπον ἔδωκεν ὁ δεσπότης τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν.
  language: Greek
translation:
  text: Let us pass through all the generations and learn carefully that in generation after generation the Master gave a place for reorientation[r1] to those willing to turn to him.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
