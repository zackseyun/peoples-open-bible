theological_decisions:
- issue: Rendering the divine name in the title אֲדֹנָי יְהוָה
  chosen_reading: the Lord GOD
  alternative_readings:
  - the Lord Yahweh
  - the Sovereign LORD
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Referent of the singular suffixes in עָלָיו / נִקְבָּצָיו
  chosen_reading: singular collective reference to Israel ('to him')
  alternative_readings:
  - 'plural sense smoothed in English: ''to them'''
  - reference to the land/Zion rather than Israel
  rationale: The Hebrew uses singular suffixes after 'the outcasts of Israel.' Retaining the singular in English preserves the collective-personified sense and avoids prematurely resolving the referent to a plural group. Because the syntax is debated, the alternative is preserved in a footnote.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
