translation:
  text: Why did you abandon the high, holy, eternal heaven, lie with women, defile yourselves
    with the daughters of humankind, take wives for yourselves, act as the children of the earth
    do[a], and beget giant sons[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The comparison with children of the earth accompanies acting and begetting in both
      printed parallels; Greek explicitly has ἐποιήσατε καὶ ἐγεννήσατε, “you acted and begot.”
    reason: textual_variant
  - marker: b
    text: The Ethiopic prints ውሉደ ረዓይት. “Giant sons” follows the Greek-supported understanding
      expressed by υἱοὺς γίγαντας, “sons who were giants.”
    reason: textual_variant
