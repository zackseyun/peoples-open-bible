    he comes,” while retaining “return” for ἐπανήξω in paragraph 2. Existing notes and simplification
    metadata remain consistent with this narrow proposed correction.'
- category: publication_review_correction
  rationale: 'Independent comparison with the supplied Greek confirms both omitted elements in paragraph
