translation:
  text: Understand that I have not labored for myself alone, but for all who seek instruction[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Instruction here includes moral training as well as teaching.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  chosen: Understand
  alternatives:
  - Consider
  - Perceive
  - Take note
  lexicon: LSJ
  rationale: Aorist imperative plural calling the audience to grasp or recognize the point being made. 'Understand' is clear modern English and preserves the force better than the more formal 'consider' or the weaker 'take note'.
- source_word: οὐκ ἐμοὶ μόνῳ
  chosen: not for myself alone
  alternatives:
  - not for me alone
  - not only for myself
  lexicon: LSJ
  rationale: 'The dative with μόνος expresses advantage/benefit: the labor was not merely for the speaker''s own sake. ''For myself alone'' communicates this naturally in English.'
- source_word: ἐκοπίασα
  chosen: I have labored
  alternatives:
  - I labored
  - I toiled
  - I worked hard
  lexicon: LSJ
  rationale: From κοπιάω, denoting strenuous labor or toil. 'Have labored' fits the speaker's retrospective appeal and sounds natural in English; 'toiled' is possible but slightly more literary.
- source_word: πᾶσιν τοῖς ζητοῦσιν
  chosen: for all who seek
  alternatives:
  - for everyone seeking
  - for all those who pursue
  lexicon: LSJ
  rationale: The phrase is inclusive and generic. 'All who seek' is concise and preserves the participial sense without overcomplication.
- source_word: παιδείαν
  chosen: instruction
  alternatives:
  - discipline
  - training
  - education
  - wisdom
  lexicon: LSJ
  rationale: παιδεία in Sirach commonly carries the sense of moral and intellectual formation. 'Instruction' best balances readability and breadth here; 'discipline' is too narrow, 'education' too institutional, and 'wisdom' overstates the lexical sense.
