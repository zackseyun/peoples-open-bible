  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/003.yaml
  text: “I heard,” I say, “sir, from certain teachers, that there is no other repentance except that one when we went down into the water and received forgiveness of our former sins.”
translation:
  language: en
  text: 'I said, “Sir, I have heard some teachers say that we can reorient[a] only once: when we went down into the water and received forgiveness for our earlier sins.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: “I heard,” I say, “sir, from certain teachers
  simplified_phrase: I said, “Sir, I have heard some teachers say
  preserved_meaning: The speaker respectfully reports what unnamed teachers taught.
  reasoning_layer_used: POB translation and immediate syntax
  rationale: The reordered dialogue sounds natural in English without changing the speakers.
- pob_phrase: received forgiveness of our former sins
  simplified_phrase: received forgiveness for our earlier sins
  preserved_meaning: They received forgiveness for sins committed before the water event.
  reasoning_layer_used: POB translation
  rationale: “Earlier sins” is clearer modern English than “former sins.”
translation_notes:
  risk_flags:
  - risk: Modern readers may identify the water event as baptism.
    mitigation: The text preserves the POB’s concrete wording without adding that label.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
