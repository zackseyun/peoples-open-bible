translation_notes:
  risk_flags:
  - risk: The prophecy about salvation from Levi and Judah can be read broadly or messianically.
    mitigation: The main text remains broad, and footnote a preserves both possibilities.
  - risk: The two outcomes for a prosperous wrongdoer could be collapsed into one doctrine of recompense.
    mitigation: The text keeps present reward and future judgment as alternatives.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
