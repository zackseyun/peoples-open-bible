translation:
  text: 'Then he said to me, “Conduct yourself courageously in this service. Tell every person about the
    Lord’s mighty works, and you will find favor in this service. Whoever walks in these commandments
    will live and be happy in life. But whoever neglects them will not live and will be miserable in life.”


    2. “Tell all who are able to do what is right not to stop doing good works; it benefits them. And
    I say that every person ought to be rescued from hardship. For someone who is in need and suffers
    hardship in daily life is in great torment and distress.”


    3. “So whoever rescues such a person from distress gains great joy. For someone afflicted by such
    hardship suffers the same torment as a person agonizing in chains.[a] Many, unable to bear such calamities,
    bring death on themselves. Anyone who knows about such a person’s calamity and does not rescue them
    commits a great sin and becomes guilty of that person’s blood.[b]”


    4. “Therefore, all of you who have received from the Lord, do good works, lest the tower’s structure
    be completed while you delay doing them. For the work of building it has been suspended for your sake.
    Unless you hurry to do what is right, the tower will be completed and you will be shut out.”


    5. After he had spoken with me, he rose from the couch, took the shepherd and the virgins with him,
    and went away, saying to me that he would send that shepherd and the virgins back to my house.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: lexical_alternative
    text: The printed Latin literally compares the sufferer with someone who “torments himself” in chains.
      “Agonizing” renders the reflexive anguish; the source has not been silently emended.
  - marker: b
    reason: textual_variant
    text: The Vulgata base has singular “becomes guilty of that person’s blood” and “commits a great sin.”
      The damaged Greek P.Oxy.III404 verso40–42 has plural guilty/become wording; the editors suggest
      its preceding clause may differ. Much is lost. This draft retains the continuous Latin and does
      not reconstruct the absent Greek sentence.
lexical_decisions:
- source_word: Viriliter
  chosen: courageously
  alternatives:
  - bravely
  - in a manly way
  rationale: Render the force of the Latin courage idiom in readable English without adding a restriction
    on who can perform the service.
- source_word: omnem hominem de incommodis eripi oportere
  chosen: every person ought to be rescued from hardship
  alternatives:
  - everyone ought to rescue a person from hardship
  rationale: 'The accusative infinitive is passive: the person is the one rescued, not the grammatical
    rescuer. Preserve universal scope.'
- source_word: pari tormento cruciatur atque torquet se qui in vincla est
  chosen: suffers the same torment as a person agonizing in chains
  alternatives:
  - is tortured by the same torment as one who torments himself in chains
  rationale: Retain the comparison and reflexive anguish without silently emending the unusual printed
    Latin. Page417 re-read; torquet se is printed, not corrected to torquetur.
- source_word: magnum peccatum admittit et reus fit sanguinis eius
  chosen: commits a great sin and becomes guilty of that person’s blood
  alternatives:
  - they become guilty of this blood
  rationale: Retain continuous Latin singular and great-sin clause. Fragmentary Greek plural survives
    in an edition, but the preceding damaged clause is not reconstructed into a replacement text.
- source_word: adprehenso pastore et virginibus
  chosen: took the shepherd and the virgins with him
  alternatives:
  - taking hold of the shepherd and the virgins
  rationale: Preserve departure with the named figures; do not add a new scene or a return that has not
    yet occurred.
