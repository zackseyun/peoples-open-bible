  text: τὸ δὲ ἱερὸν ἀργυρολόγητον, καθὼς τὰ λοιπὰ τῶν ἐθνῶν τεμένη, πρατὴν δὲ κατʼ ἔτος τὴν ἀρχιερωσύνην ποιήσειν·
