  text: Τοῦ δὲ Ἐλεάζαρον λήγοντος ἄρτι τῆς προσευχῆς, ὁ βασιλεὺς σὺν τοῖς θηρίοις καὶ παντὶ τῷ τῆς δυνάμεως φρύαγματι κατὰ τὸν ἱππόδρομον παρῆγεν.
