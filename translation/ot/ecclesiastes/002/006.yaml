id: ECC.2.6
reference: Ecclesiastes 2:6
source:
  edition: WLC
  text: עָשִׂ֥יתִי לִ֖/י בְּרֵכ֣וֹת מָ֑יִם לְ/הַשְׁק֣וֹת מֵ/הֶ֔ם יַ֖עַר צוֹמֵ֥חַ עֵצִֽים׃
translation:
  text: I made pools of water for myself to irrigate a woodland of growing trees.
  philosophy: dynamic
lexical_decisions:
- source_word: עָשִׂיתִי
  chosen: I made
  alternatives:
  - I constructed
  - I made for myself
  lexicon: HALOT
  rationale: Qal perfect 1cs of עשה, straightforwardly 'I made' or 'I did.' Here with the following לִי, English naturally separates the reflexive nuance as 'for myself' rather than folding it into the verb.
- source_word: לִי
  chosen: for myself
  alternatives:
  - for me
  lexicon: HALOT
  rationale: The preposition ל with 1cs suffix marks personal benefit/possession. 'For myself' brings out the self-directed sense in Qoheleth's list of accomplishments.
- source_word: בְּרֵכוֹת מָיִם
  chosen: pools of water
  alternatives:
  - reservoirs of water
  - ponds
  lexicon: HALOT
  rationale: בְּרֵכוֹת denotes pools/reservoirs; with מָיִם the phrase is literally 'pools of water.' 'Pools' is natural English and preserves the concrete image without over-specifying engineering.
- source_word: לְהַשְׁקוֹת
  chosen: to irrigate
  alternatives:
  - to water
  - to give drink to
  lexicon: HALOT
  rationale: Hiphil infinitive of שקה means to cause to drink, hence to water/irrigate. Given the context of constructed water pools and a wooded area, 'to irrigate' best captures intentional watering infrastructure.
- source_word: מֵהֶם
  chosen: from them
  alternatives:
  - with them
  - from these
  lexicon: HALOT
  rationale: The preposition מן with 3mp suffix is most naturally 'from them,' referring back to the pools as the source of irrigation.
- source_word: יַעַר
  chosen: a woodland
  alternatives:
  - a forest
  - woodland
  lexicon: HALOT
  rationale: The word denotes a forest or wooded area; “woodland” avoids the unjustified cultivated specificity of “grove.”
- source_word: צוֹמֵחַ עֵצִים
  chosen: of growing trees
  alternatives:
  - growing trees
  - where trees were growing
  lexicon: HALOT
  rationale: This supplies natural English syntax while retaining the participial description of growing trees.
- source_word: לְהַשְׁקוֹת מֵהֶם
  chosen: to irrigate
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: English naturally treats the previously named pools as the source or means of irrigation without preserving an awkward “from them.”
