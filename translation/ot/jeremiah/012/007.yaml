  alternative_readings:
  - its enemies
  - the enemies of Judah
  - the enemies of Jerusalem
  rationale: The Hebrew leaves the precise antecedent implicit while using feminine grammar. The translation preserves that poetic-theological ambiguity rather than resolving it interpretively.
  doctrine_reference: Preserve theological tension rather than resolve it.
