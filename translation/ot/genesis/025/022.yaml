  from: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
  to: The children struggled against each other in her womb, and she said, “If this is how it is, why is this happening to me[a]?” So she went to inquire of Yahweh.
