id: PRO.21.26
reference: Proverbs 21:26
source:
  edition: WLC
  text: כָּל הַ֭/יּוֹם הִתְאַוָּ֣ה תַאֲוָ֑ה וְ/צַדִּ֥יק יִ֝תֵּ֗ן וְ/לֹ֣א יַחְשֹֽׂךְ־׃
translation:
  text: All day long he craves and craves, but a righteous man gives and does not hold back.
  philosophy: dynamic
lexical_decisions:
- source_word: כָּל הַיּוֹם
  chosen: All day long
  alternatives:
  - All the day
  - The whole day
  lexicon: HALOT
  rationale: Idiomatic temporal expression meaning throughout the day; 'All day long' is natural modern English while preserving the durative sense.
- source_word: הִתְאַוָּה תַאֲוָה
  chosen: he craves and craves
  alternatives:
  - he covets greedily
  - he desires desire
  - he keeps craving
  lexicon: HALOT
  rationale: English verbal repetition conveys the Hebrew cognate intensification naturally, without adding “greedily.”
- source_word: צַדִּיק
  chosen: a righteous man
  alternatives:
  - the righteous
  - a righteous man
  lexicon: HALOT
  rationale: The masculine singular substantive is indefinite and representative in this proverb.
- source_word: יִתֵּן
  chosen: gives
  alternatives:
  - gives freely
  - keeps giving
  lexicon: HALOT
  rationale: Simple imperfect with habitual/proverbial force. 'Gives' fits English proverbial style without adding adverbial nuance not explicit in the Hebrew.
- source_word: לֹא יַחְשֹׂךְ
  chosen: does not hold back
  alternatives:
  - does not withhold
  - does not spare
  lexicon: HALOT
  rationale: The verb means to withhold or keep back. 'Does not hold back' is clear, idiomatic modern English and suits the generosity contrast in the proverb.
