  from: because he also is flesh
  to: for he is flesh
  rationale: The Hebrew word בְּשַׁגַּם is a composite form including גַּם ('also'). While translating it literally as 'he also is flesh' is defensible, it creates an awkward English phrase that prompts the reader to ask, 'also what?' The context does not provide a clear comparison. The force of גַּם here is likely intensive, emphasizing the reason. A smoother and more natural rendering like 'for he is flesh' or 'since he is merely flesh' conveys the essential logic without the distracting and unanchored 'also'.
