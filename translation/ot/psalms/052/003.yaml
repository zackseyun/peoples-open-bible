id: PSA.52.3
reference: Psalms 52:3
source:
  edition: WLC
  text: הַ֭וּוֹת תַּחְשֹׁ֣ב לְשׁוֹנֶ֑/ךָ כְּ/תַ֥עַר מְ֝לֻטָּ֗שׁ עֹשֵׂ֥ה רְמִיָּֽה׃
translation:
  text: You who practice deceit[a], your tongue devises destruction; it is like a sharpened razor.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'The final Hebrew phrase may instead describe the razor: “Your tongue devises destruction; it is like a sharpened razor, working deceit.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַוּוֹת
  chosen: destruction
  alternatives:
  - ruin
  - mischief
  - destructive acts
  lexicon: HALOT
  rationale: 'Plural noun from הוה used in a context of harmful intent; rendered with a collective singular in English for natural style: ''destruction.'' This captures the sense of ruinous harm rather than mere trouble.'
- source_word: תַּחְשֹׁב
  chosen: devises
  alternatives:
  - plans
  - thinks up
  lexicon: HALOT
  rationale: The verb is third-person feminine singular and agrees with 'your tongue,' the subject at the end of the first colon.
- source_word: לְשׁוֹנְךָ
  chosen: your tongue
  lexicon: HALOT
  rationale: The feminine noun is the subject of 'devises,' not a detached topic for the next clause.
  alternatives: []
- source_word: כְּתַעַר
  chosen: like a razor
  alternatives:
  - as a razor
  lexicon: HALOT
  rationale: The comparative כ plus 'razor' is straightforwardly simile language; 'like a razor' is idiomatic modern English.
- source_word: מְלֻטָּשׁ
  chosen: sharpened
  alternatives:
  - polished
  - honed
  lexicon: HALOT
  rationale: Passive participle indicating a blade made keen. 'Sharpened' best fits the image of a razor prepared to cut, whereas 'polished' would underplay the danger.
- source_word: עֹשֵׂה רְמִיָּה
  chosen: you who practice deceit
  alternatives:
  - practicing treachery
  - producing deception
  - working fraud
  lexicon: HALOT
  rationale: The masculine participle is naturally taken as a direct address to the accused man; its possible attachment to the masculine “razor” is retained in a note.
