theological_decisions:
- issue: Relation of Hebrew and Greek in the final clause
  chosen_reading: Translate the Hebrew warning as emotional steadiness ('do not be alarmed') while allowing the Greek to confirm the broader context of affliction rather than adopting a more literal 'do not hurry.'
  alternative_readings:
  - do not hurry in time of affliction
  - do not panic in the time of visitation
  rationale: 'The project prioritizes the surviving Hebrew of Sirach where available, but the Greek parallel must be used as a real input. Here the witnesses are not contradictory so much as differently angled: Hebrew emphasizes dismay; Greek emphasizes rash haste. The main text follows the Hebrew as primary and preserves the Greek-leaning alternative in a footnote.'
  doctrine_reference: 'PHILOSOPHY.md: translate from Hebrew where it survives; use Greek parallel as actual input; preserve ambiguity/tension where present.'
