source:
  edition: WLC
  text: גַּם אֵל֮ יִתָּצְ/ךָ֪ לָ֫/נֶ֥צַח יַחְתְּ/ךָ֣ וְ/יִסָּחֲ/ךָ֣ מֵ/אֹ֑הֶל וְ/שֵֽׁרֶשְׁ/ךָ֨ מֵ/אֶ֖רֶץ חַיִּ֣ים סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/006.yaml
  text: But God will also tear you down forever; he will snatch you up[a] and pull you from your tent, and uproot you from the land of the living[b]. Selah
  footnotes:
  - marker: a
    text: Or “seize you” or “take you away.” The Hebrew verb is rare and conveys forceful removal.
    reason: lexical_alternative
  - marker: b
    text: Literally, “your root from the land of the living”; the sense is “uproot you from the land of the living.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 하나님께서는 또한 당신을 영원히 무너뜨리시고, 당신을 붙잡아[a] 당신의 장막에서[b] 끌어내시며, 산 자들의 땅에서 당신의 뿌리를[c] 뽑아 버리실 것입니다. 셀라
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 낚아채실’ 또는 ‘당신을 데려가실’. 히브리어의 희귀 동사는 힘으로 붙들어 제거하는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 장막에서’. 또는 ‘당신의 거처에서’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘산 자들의 땅에서 당신의 뿌리를’. 문맥상 하나님께서 그 뿌리를 뽑으신다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהַבְתָּ
  english_pob_choice: You love
  chosen_korean: 사랑하십니다
  alternatives_korean:
  - 사랑하셨습니다
  - 사랑합니다
  lexicon: HALOT
  rationale: 2인칭 남성 단수 완료형이지만, 시편의 직접적 고발 문맥에서는 현재형으로 된 상태적 진술이 자연스럽고, 합쇼체로는 "사랑하십니다"가 가장 직접적입니다.
- source_word: כָל דִּבְרֵי בָלַע
  english_pob_choice: all words of destruction
  chosen_korean: 모든 파괴의 말들
  alternatives_korean:
  - 모든 파멸의 말들
  - 삼키는 말들
  - 파괴적인 말들
  lexicon: HALOT
  rationale: כָל דִּבְרֵי를 포괄성 있게 "모든 … 말들"로 옮기고, בָלַע의 은유적 파괴성을 너무 풀지 않으면서도 자연스러운 현대 한국어로 "파괴의"를 택했습니다.
- source_word: לְשׁוֹן מִרְמָה
  english_pob_choice: O deceitful tongue
  chosen_korean: 속이는 혀여
  alternatives_korean:
  - 기만하는 혀여
  - 속임수의 혀여
  - 간사한 혀여
  lexicon: HALOT
  rationale: לְשׁוֹן의 신체 은유를 살려 "혀"를 유지했고, מִרְמָה는 형용사적으로 기능하므로 "속이는"으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 시적 고발의 직접 호칭과 2인칭 진술의 어조
  chosen_reading: 하나님을 향한 기도체가 아니라 악한 혀를 향한 직접 고발로 읽어, 문장 전체를 2인칭 비난 진술로 유지했습니다.
  alternative_readings:
  - '"당신은 모든 파괴의 말을 사랑하셨습니다…"처럼 과거형으로 옮김'
  - 완곡하게 서술문으로 처리
  rationale: 본문은 예언자적/시적 고발의 직설화법이므로, 한국어에서도 직면성을 유지하는 것이 מקור의 힘을 보존합니다.
  doctrine_reference: 시편의 예언자적 고발 화법
