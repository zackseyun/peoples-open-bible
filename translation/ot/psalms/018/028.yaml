id: PSA.18.28
reference: Psalms 18:28
source:
  edition: WLC
  text: כִּֽי אַ֭תָּה תָּאִ֣יר נֵרִ֑/י יְהוָ֥ה אֱ֝לֹהַ֗/י יַגִּ֥יהַּ חָשְׁכִּֽ/י־׃
translation:
  text: For you light my lamp; Yahweh my God lights up my darkness.
  philosophy: dynamic
lexical_decisions:
- source_word: כִּי
  chosen: For
  alternatives:
  - Because
  - Indeed
  lexicon: HALOT
  rationale: Introduces the reason or ground for the surrounding praise/confidence. 'For' is concise and natural in English poetic discourse.
- source_word: תָּאִיר
  chosen: light
  alternatives:
  - cause to shine
  - give light to
  lexicon: HALOT
  rationale: Hiphil of אור means to give light/shine upon. 'Light' in 'you light my lamp' is idiomatic English and preserves the causative sense without awkwardness.
- source_word: נֵרִי
  chosen: my lamp
  alternatives:
  - my light
  lexicon: HALOT
  rationale: נֵר is literally 'lamp.' Keeping 'lamp' preserves the concrete metaphor rather than flattening it to the abstract 'light.'
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: אֱלֹהַי
  chosen: my God
  lexicon: HALOT
  rationale: Straightforward possessive construction; 'my God' preserves the personal covenantal address.
- source_word: יַגִּיהַּ
  chosen: lights up
  alternatives:
  - illumines
  - makes bright
  - causes to shine
  lexicon: HALOT
  rationale: From נגה/גהה in the Hiphil, conveying making bright or shining. 'Lights up' is vivid, readable modern English and matches the parallel with 'light my lamp' while distinguishing the second colon stylistically.
- source_word: חָשְׁכִּי
  chosen: my darkness
  alternatives:
  - my dark place
  - the darkness around me
  lexicon: HALOT
  rationale: The noun with first-person suffix is best rendered literally as 'my darkness.' This preserves the poetic metaphor and allows readers to infer either external distress or internal gloom from context without over-interpretation.
