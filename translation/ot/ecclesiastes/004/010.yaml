  from: For if they fall[a], one will lift up his companion[b]; but woe to the one who falls when there is not a second to lift him up.
  to: For if they fall, one will lift up his companion[a]; but woe to the one who falls and there is no second to lift him up.
  rationale: The existing “when there is not a second” is unnecessarily stiff, but “with no one else” removes the deliberate numerical image and contrast between one and a second person. “And there is no second to lift him up” is clear in this proverb-like context, follows the Hebrew clause order, and preserves that image. The companion note belongs at “companion”; no separate literal note is needed when the main text renders the latter clause directly.
