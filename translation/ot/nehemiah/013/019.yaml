id: NEH.13.19
reference: Nehemiah 13:19
source:
  edition: WLC
  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר צָֽלֲלוּ֩ שַׁעֲרֵ֨י יְרוּשָׁלִַ֜ם לִ/פְנֵ֣י הַ/שַּׁבָּ֗ת וָ/אֹֽמְרָ/ה֙ וַ/יִּסָּגְר֣וּ הַ/דְּלָת֔וֹת וָ/אֹ֣מְרָ֔/ה אֲשֶׁר֙ לֹ֣א יִפְתָּח֔וּ/ם עַ֖ד אַחַ֣ר הַ/שַּׁבָּ֑ת וּ/מִ/נְּעָרַ֗/י הֶֽעֱמַ֨דְתִּי֙ עַל הַ/שְּׁעָרִ֔ים לֹא יָב֥וֹא מַשָּׂ֖א בְּ/י֥וֹם הַ/שַּׁבָּֽת־־׃
translation:
  text: When evening shadows began to fall on the gates of Jerusalem before the Sabbath[a], I ordered the doors shut and commanded that they not be opened until after the Sabbath. I stationed some of my servants at the gates so that no load would be brought in on the Sabbath day.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Sabbath began at sunset.
    reason: cultural_note
lexical_decisions:
- source_word: צָֽלֲלוּ
  chosen: began to grow dark
  alternatives:
  - cast shadows
  - grew dim
  - were shaded
  lexicon: HALOT
  rationale: The verb refers to the onset of evening/darkness. In context with 'before the Sabbath,' it marks the approach of sundown at which Sabbath observance begins. 'Began to grow dark' is idiomatic English and preserves the temporal nuance better than the more literal but opaque 'cast shadows.'
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  chosen: the gates of Jerusalem
  alternatives:
  - Jerusalem's gates
  lexicon: HALOT
  rationale: A straightforward construct chain; 'the gates of Jerusalem' is natural and clear.
- source_word: לִפְנֵי הַשַּׁבָּת
  chosen: before the Sabbath
  alternatives:
  - in advance of the Sabbath
  lexicon: HALOT
  rationale: Temporal phrase indicating the time just prior to Sabbath onset.
- source_word: וָאֹמְרָה
  chosen: I ordered
  alternatives:
  - I said
  - I gave orders
  lexicon: HALOT
  rationale: The lexical verb is 'say,' but the governor's directive pragmatically functions as an order; English expresses that force directly.
- source_word: וַיִּסָּגְרוּ הַדְּלָתוֹת
  chosen: the doors shut
  alternatives:
  - that the doors should be shut
  - the doors were shut
  lexicon: HALOT
  rationale: After 'I ordered,' the concise complement is natural English and does not introduce an unstated agent.
- source_word: אֲשֶׁר לֹא יִפְתָּחוּם
  chosen: that they not be opened
  alternatives:
  - that they should not open them
  - that they were not to open them
  lexicon: HALOT
  rationale: The passive English complement keeps the focus on the doors and fits the preceding administrative order.
- source_word: עַד אַחַר הַשַּׁבָּת
  chosen: until after the Sabbath
  alternatives:
  - until the Sabbath was over
  lexicon: HALOT
  rationale: A direct temporal rendering that is both clear and close to the source.
- source_word: וּמִנְּעָרַי
  chosen: some of my servants
  alternatives:
  - some of my attendants
  - some of my young men
  lexicon: HALOT
  rationale: In Nehemiah's gubernatorial retinue the term denotes servants or attendants, not necessarily youths.
- source_word: הֶעֱמַדְתִּי
  chosen: I stationed
  alternatives:
  - I set
  - I posted
  lexicon: HALOT
  rationale: In this security/administrative context, 'stationed' best conveys placing personnel on duty.
- source_word: עַל הַשְּׁעָרִים
  chosen: at the gates
  alternatives:
  - over the gates
  - by the gates
  lexicon: HALOT
  rationale: Although the preposition is literally 'upon/over,' with personnel and city gates the idiomatic sense is assignment at the gates.
- source_word: לֹא יָבֹא מַשָּׂא
  chosen: so that no load would be brought in
  alternatives:
  - that no burden should enter
  - that no merchandise should be brought in
  lexicon: HALOT
  rationale: In context a load is carried through the gates. The passive English wording makes that event clear while keeping the concrete noun.
- source_word: בְּיוֹם הַשַּׁבָּת
  chosen: on the Sabbath day
  alternatives:
  - on the Sabbath
  lexicon: HALOT
  rationale: A natural rendering of the phrase that preserves the explicit mention of 'day' present in Hebrew.
