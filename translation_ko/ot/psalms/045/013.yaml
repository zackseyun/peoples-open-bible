    text: 히브리어는 ‘금의 무늬 있는 세공’ 또는 ‘금으로 수놓은 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת צֹר
  english_pob_choice: And the daughter of Tyre
  chosen_korean: 두로의 딸
  alternatives_korean:
  - 그리고 두로의 딸
  - 두로의 딸이
  lexicon: HALOT
  rationale: 히브리어의 ‘딸’은 도시/민족을 의인화한 관용 표현이므로 ‘두로의 딸’로 옮기고, 문맥상 접속사 וּ는 자연스러운 한국어 흐름에 맞게 살렸습니다.
- source_word: בְּמִנְחָה
  english_pob_choice: with a gift
  chosen_korean: 예물을 가지고
  alternatives_korean:
  - 예물과 함께
  - 헌물을 가지고
  - 공물을 가지고
  lexicon: HALOT
  rationale: מִנְחָה는 문맥에 따라 선물·공물·예물을 뜻할 수 있으므로, 여기서는 왕실/조공 문맥을 살리되 지나치게 제의적으로 굳지 않도록 ‘예물’을 택했습니다.
- source_word: פָּנַיִךְ יְחַלּוּ
  english_pob_choice: will seek your favor
  chosen_korean: 당신의 은혜를 구할 것입니다
  alternatives_korean:
  - 당신의 얼굴을 구할 것입니다
  - 당신의 호의를 구할 것입니다
  - 당신께 은총을 구할 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 얼굴’을 뜻하지만, חלה의 이 관용구는 ‘호의를 구하다/은혜를 구하다’라는 뜻이므로 의미를 드러내는 번역이 필요합니다.
- source_word: עֲשִׁירֵי עָם
  english_pob_choice: the rich among the people
  chosen_korean: 백성 가운데 부유한 이들
  alternatives_korean:
  - 백성의 부유한 자들
  - 그 백성의 부유한 자들
  - 백성 가운데 있는 부자들
  lexicon: HALOT
  rationale: ‘부유한 사람들’이라는 사회적 계층을 자연스럽게 전달하면서, 특정 민족을 좁혀 단정하지 않도록 ‘백성 가운데’로 처리했습니다.
theological_decisions:
- issue: פָּנַיִךְ(직역 ‘당신의 얼굴’)을 한국어에서 어떻게 처리할지
  chosen_reading: 인격적 관계와 청원을 드러내는 ‘당신의 은혜를 구하다’로 옮겼습니다.
  alternative_readings:
  - 당신의 얼굴을 구하다
  - 당신의 호의를 구하다
  rationale: 한국어에서 ‘얼굴을 구하다’는 관용성이 약하므로, 원문의 예배/궁정적 간청의 힘을 살리면서도 이해 가능한 표현을 택했습니다.
  doctrine_reference: 시편의 시적 관용구 해석 원칙
