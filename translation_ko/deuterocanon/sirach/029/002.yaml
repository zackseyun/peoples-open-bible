  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐν καιρῷ χρείας αὐτοῦ의 소유격은 ‘이웃이 필요로 하는 때’임을 가리키므로 이를 드러내는 편이 더 정확합니다. εἰς τὸν καιρόν은 ‘정해진 때에’로 자연스럽게 반영할 수 있습니다.
  naturalness: 현 번역의 ‘때가 되면 … 제때’는 시간 표현이 중복되어 다소 부자연스럽습니다. ‘정해진 때에’로 간결하게 하면 현대 한국어 문장 흐름이 좋아집니다.
  terminology: ‘이웃’, ‘빌려 주십시오’, ‘갚으십시오’는 δανείζω, πλησίον, ἀποδίδωμι의 문맥상 의미와 현대 합쇼체에 잘 맞습니다. ‘다시’는 πάλιν의 상환·되돌림의 뉘앙스를 보존합니다.
  issues:
