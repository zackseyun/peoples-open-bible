  meaning: Yahweh will cleanse his people of the guilt of their sin and forgive all their offenses and rebellion against him.
  meaning_decisions:
  - source_phrase: מִכָּל עֲוֺנָם אֲשֶׁר חָטְאוּ לִי
    prior_rendering: from all their guilt by which they have sinned against me
    new_rendering: of all the guilt they have incurred by sinning against me
    rationale: Their sin produces guilt; guilt is not the means by which they sin. The new construction clarifies the relationship while retaining the cleansing clause's emphasis on culpability.
  - source_phrase: לְכָל עֲוֺנוֹתֵיהֶם
    prior_rendering: all their guilty deeds
    new_rendering: all the iniquities
    rationale: “Iniquities” carries the full moral weight of these culpable offenses more effectively than the flattened phrase “guilty deeds.”
  - source_phrase: אֲשֶׁר חָטְאוּ לִי וַאֲשֶׁר פָּשְׁעוּ בִי
    prior_rendering: by which they have sinned against me and by which they have rebelled against me
    new_rendering: they have committed by sinning and rebelling against me
    rationale: This expresses the overlapping descriptions of their offenses in natural English while retaining both sin and rebellion and their direction against Yahweh.
