  - source_phrase: כֹּה אָמַר יְהוָה
    prior_rendering: Thus says the LORD
    new_rendering: This is what Yahweh says
    rationale: The introductory formula is expressed in natural contemporary English, and the divine name follows the standing ruling.
  - source_phrase: אִם שְׁלֵמִים וְכֵן רַבִּים וְכֵן נָגֹזּוּ
