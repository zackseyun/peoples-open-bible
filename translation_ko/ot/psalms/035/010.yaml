  to: 내 모든 뼈가 말할 것입니다. 「야훼여, 누가 주님과 같습니까? 주님은 가난한 자를 그보다 강한 자에게서 건져 내시며, 가난하고 궁핍한 자를 그를 빼앗는 자에게서 건져 내십니다.」
