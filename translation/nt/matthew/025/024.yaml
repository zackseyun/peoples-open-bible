  to: Then the one who had received the one talent also came forward and said, ‘Master, I knew that you were a hard man, reaping where you did not sow and gathering where you did not scatter seed[a].
  rationale: I retain the later source-audit's 'came forward' and natural 'I knew that,' as well as the unresolved force of the servant's accusation. Unlike the current wording, I supply 'seed' for clarity, as the earlier lexical deliberation proposed, but acknowledge the alternative agricultural reading.
