theological_decisions:
- issue: Nature of the sorrow in κατὰ θεόν
  chosen_reading: Render literally as 'according to God' rather than interpretively as 'godly sorrow' in the main text.
  alternative_readings:
  - godly
  - in a godly manner
  - as God intends
  rationale: The phrase denotes sorrow in relation to God's standard or will. A more literal rendering preserves the theological nuance and avoids collapsing the phrase into a stock expression while still remaining understandable in context.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
- issue: Context-sensitive reorientation terminology
  chosen_reading: Now I rejoice[a], not because you were grieved, but because you were grieved into a reorientation toward God; for you were grieved according to God[c][b], so that you might suffer no loss from us.
  alternative_readings:
  - Traditional repent/repentance wording, preserved at the baseline commit.
  rationale: Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
