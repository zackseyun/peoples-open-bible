id: PSA.142.4
reference: Psalms 142:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַבֵּ֤יט יָמִ֨ין וּ/רְאֵה֮ וְ/אֵֽין לִ֪/י מַ֫כִּ֥יר אָבַ֣ד מָנ֣וֹס מִמֶּ֑/נִּי אֵ֖ין דּוֹרֵ֣שׁ לְ/נַפְשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/004.yaml
  text: 'Look to the right and see: there is no one who recognizes me; no refuge remains for me[a]; no one cares for me[b].'
  footnotes:
  - marker: a
    text: Or “no escape remains for me”; the Hebrew noun may denote a place or means of escape.
    reason: lexical_alternative
  - marker: b
    text: Literally, “no one seeks my life,” an expression meaning that no one is concerned for him.
    reason: literal_form
translation:
  language: ko
  text: 오른쪽을 보시고 살펴보십시오. 나를 알아주는 사람이 아무도 없습니다. 피할 곳이 내게서 사라졌고, 내 생명을 돌보는 이가 아무도 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/הִתְעַטֵּ֬ף
  english_pob_choice: when ... grows faint
  chosen_korean: 기가 꺾일 때에
  alternatives_korean:
  - 내 영이 쇠약해질 때에
  - 내 영이 기운을 잃을 때에
  - 내 영이 압도될 때에
  lexicon: HALOT
  rationale: בְ+부정사구는 시간 부사절로 처리하는 것이 자연스럽고, הִתְעַטֵּף는 ‘기력이 꺾이다/기운을 잃다’의 의미를 살려 현대 한국어의 비유를 유지했습니다.
- source_word: רוּחִי
  english_pob_choice: my spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 혼
  - 내 숨
  - 내 속사람
  lexicon: HALOT
  rationale: 여기서는 육체의 숨보다 내적 생명·심정이 무너지는 뜻이므로, 성령이 아닌 일반적 의미의 ‘영’을 직접적으로 옮겼습니다.
- source_word: נְתִיבָתִי
  english_pob_choice: my path
  chosen_korean: 내 길
  alternatives_korean:
  - 내 행로
  - 내 발걸음의 길
  - 내 발자취
  lexicon: HALOT
  rationale: ‘길/행로’의 은유를 살리되 한국어에서 가장 간결하고 자연스러운 표현을 택했습니다.
- source_word: טָמְנוּ פַ֣ח לִֽי
  english_pob_choice: they have hidden a trap for me
  chosen_korean: 그들이 함정을 숨겨 두었습니다
  alternatives_korean:
  - 그들이 올무를 숨겨 두었습니다
  - 그들이 덫을 놓아 두었습니다
  - 그들이 나를 위한 함정을 숨겼습니다
  lexicon: HALOT
  rationale: פַח은 ‘덫/올무/함정’ 모두 가능하지만, 본문이 ‘숨겨 둔’ 공격성을 강조하므로 현대 독자에게 분명한 ‘함정’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 현재적 아심의 시제
  chosen_reading: 주님께서는 내 길을 아십니다
  alternative_readings:
  - 주님께서는 내 길을 아셨습니다
  - 주님께서는 내 길을 알고 계셨습니다
  rationale: 히브리어 완료형이 시적 문맥에서 현재적 상태를 나타내므로, 단순 과거보다 지금의 돌보심과 인식을 드러내는 현재형이 적절합니다.
  doctrine_reference: 시편의 기도체와 하나님의 섭리적 아심
- issue: 내적 침체를 ‘영’으로 유지할지 여부
  chosen_reading: 내 영이 내 안에서 기가 꺾일 때에
  alternative_readings:
  - 내 영이 내 안에서 압도될 때에
  - 내 속사람이 내 안에서 무너질 때에
  rationale: 본문의 רוּחִי를 ‘영’으로 유지해 원문 이미지를 보존하되, 한국어의 자연성을 위해 ‘기가 꺾이다’로 상태를 구체화했습니다.
  doctrine_reference: 히브리 시어의 은유 보존
