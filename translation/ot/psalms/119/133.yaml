  text: פְּ֭עָמַ/י הָכֵ֣ן בְּ/אִמְרָתֶ֑/ךָ וְֽ/אַל תַּשְׁלֶט בִּ֥/י כָל אָֽוֶן־־־׃
translation:
  text: Establish my steps by your promise, and let no iniquity rule over me.
  philosophy: dynamic
lexical_decisions:
- source_word: בְּאִמְרָתֶךָ
  chosen: promise
  alternatives:
  - word
  - saying
  lexicon: HALOT
  rationale: אִמְרָה in this psalm repeatedly denotes God's committed utterance on which the psalmist stakes his life; rendered 'promise' to distinguish it from דָּבָר ('word'), with 'word/saying' as alternatives.
- source_word: הָכֵן
  chosen: establish
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The Hiphil imperative asks God to make the psalmist’s steps firm or established.
- source_word: תַּשְׁלֶט
  chosen: rule over
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The verb denotes exercising rule or mastery over.
