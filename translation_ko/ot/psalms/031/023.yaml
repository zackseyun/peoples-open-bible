id: PSA.31.23
reference: Psalms 31:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶֽהֱב֥וּ אֶת יְהוָ֗ה כָּֽל חֲסִ֫ידָ֥י/ו אֱ֭מוּנִים נֹצֵ֣ר יְהוָ֑ה וּ/מְשַׁלֵּ֥ם עַל יֶ֝֗תֶר עֹשֵׂ֥ה גַאֲוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/023.yaml
  text: Love Yahweh, all his faithful ones[a]! Yahweh preserves the faithful and fully repays[b] the one who acts proudly.
  footnotes:
  - marker: a
    text: Or “all his saints” or “all his godly ones.” The Hebrew term refers to those marked by covenant loyalty to Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Or “repays in full” or “abundantly repays.”
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와를 사랑하십시오, 그분께 충실한 모든 이들이여! 여호와께서는 신실한 자들을 지키시고, 교만하게 행하는 자에게는 넘치도록 갚으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그분께 충실한 모든 이들”은 히브리어 ‘그의 하시딤’을 옮긴 것입니다. ‘성도들’ 또는 ‘경건한 이들’로도 번역할 수 있으며, 여호와께 대한 충성되고 신실한 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: “넘치도록 갚으십니다”는 ‘충분히 갚으시다’, ‘풍성히 보응하시다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחָפְזִי
  english_pob_choice: in my alarm
  chosen_korean: 제 급한 마음에
  alternatives_korean:
  - 제 서두름 속에서
  - 제 불안 속에서
  - 제 패닉 속에서
  lexicon: HALOT
  rationale: חפז는 단순한 속도보다 급박함과 동요를 포함할 수 있으므로, 본문 맥락에서 감정적 긴장을 살린 “급한 마음”이 자연스럽고 원문의 뉘앙스를 잘 드러냅니다.
- source_word: נִגְרַזְתִּי
  english_pob_choice: I am cut off
  chosen_korean: 나는 ... 끊어졌습니다
  alternatives_korean:
  - 나는 끊겼습니다
  - 나는 버려졌습니다
  - 나는 끊어졌다고 여겼습니다
  lexicon: HALOT
  rationale: 수동태의 단절 이미지를 살리되, 원문이 말하는 체험적 진술을 직접화하기 위해 “끊어졌습니다”로 옮겼습니다. “버려졌습니다”는 해석을 더 강하게 넣는 표현이라 피했습니다.
- source_word: מִנֶּגֶד עֵינֶיךָ
  english_pob_choice: from before your eyes
  chosen_korean: 당신의 눈앞에서
  alternatives_korean:
  - 당신의 시야에서
  - 당신 앞에서
  - 당신의 얼굴 앞에서
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지는 “눈앞/당신 앞에서”이므로, 한국어에서는 가장 직접적인 “당신의 눈앞에서”가 원문의 공간적 대비를 잘 보존합니다.
- source_word: קוֹל תַּחֲנוּנַי
  english_pob_choice: the sound of my pleas
  chosen_korean: 제 간구의 소리
  alternatives_korean:
  - 제 간청의 소리
  - 제 탄원의 소리
  - 제 애원의 소리
  lexicon: HALOT
  rationale: תַּחֲנוּנִים은 단순 요청보다 자비를 구하는 간구에 가깝기 때문에, 교회적 문어이면서도 원뜻을 보존하는 “간구”를 선택했습니다.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  english_pob_choice: when I cried to you for help
  chosen_korean: 제가 당신께 부르짖을 때
  alternatives_korean:
  - 제가 당신께 외칠 때
  - 제가 당신께 도움을 구해 부르짖을 때
  - 제가 당신께 부르짖으며
  lexicon: HALOT
  rationale: שׁוע의 강한 부르짖음/호소를 한국어 동사 “부르짖다”로 옮기고, 이어지는 문맥에서 도움 요청이 이미 내포되므로 “도움을 구해”는 덧붙이지 않았습니다.
theological_decisions:
- issue: 시인의 체험적 단절 진술과 하나님의 실제 응답 사이의 긴장
  chosen_reading: 첫 절은 시인이 급박한 상황에서 느낀 단절을 그대로 말하게 하고, 뒤 절은 하나님이 वास्तव로 들으셨다는 사실로 이를 교정하게 했습니다.
  alternative_readings:
  - “당신이 나를 거절하신 줄 알았습니다”처럼 해석을 풀어 쓰기
  - 첫 절을 완화하여 단순한 거리감으로 표현하기
  rationale: 원문은 신학적 결론을 미리 정리하지 않고, 인간의 인식과 하나님의 실제 청취 사이의 긴장을 유지합니다. 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
