id: PSA.5.9
reference: Psalms 5:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י אֵ֪ין בְּ/פִ֡י/הוּ נְכוֹנָה֮ קִרְבָּ֪/ם הַ֫וּ֥וֹת קֶֽבֶר פָּת֥וּחַ גְּרוֹנָ֑/ם לְ֝שׁוֹנָ֗/ם יַחֲלִֽיקוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/009.yaml
  text: For there is nothing trustworthy in his mouth[a]; their inward being is ruin[c]. Their throat is an open grave; with their tongue they flatter[b].
  footnotes:
  - marker: a
    text: The Hebrew shifts from singular “his mouth” here to plural forms in the rest of the verse, treating the enemies first collectively and then as a group.
    reason: alternative_reading
  - marker: b
    text: Or “with their tongue they speak smoothly.”
    reason: lexical_alternative
  - marker: c
    text: Or “their inward being is destruction.” The plural Hebrew noun can denote ruins, disasters, or destructive schemes.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들의 입에는 신뢰할 만한 말이 전혀 없고[a], 그들의 속은 파멸이며[b], 그들의 목구멍은 열린 무덤입니다. 그들은 혀로 아첨합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 입에는 신뢰할 만한 말이 전혀 없고.’ 히브리어의 이 접미사는 단수로 읽힐 수 있으나, 이어지는 표현들은 복수이며 문맥상 악인들을 집단으로 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 속은 멸망’ 또는 ‘그들의 마음은 파멸.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들은 혀로 매끄럽게 말합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 여호와여
  - 주님이여
  lexicon: WLC / POB doctrinal glossary
  rationale: 히브리어 고유명 יְהוָה를 POB 기본값인 ‘야훼’로 옮기고, 직접 호칭이므로 호격 ‘-여’를 붙였습니다.
- source_word: נְחֵנִי
  english_pob_choice: lead me
  chosen_korean: 저를 인도하소서
  alternatives_korean:
  - 저를 이끄소서
  - 저를 안내하소서
  lexicon: HALOT
  rationale: נחה의 핵심 의미는 ‘인도하다/이끌다’이므로, 기도문체에 자연스럽고도 직접적인 ‘인도하소서’를 선택했습니다.
- source_word: בְצִדְקָתֶךָ
  english_pob_choice: in your righteousness
  chosen_korean: 주님의 의로
  alternatives_korean:
  - 주님의 의 안에서
  - 주님의 의 가운데
  lexicon: HALOT
  rationale: ב는 여기서 수단/기준의 뉘앙스를 함께 가질 수 있어, 한국어에서는 ‘-로’로 옮겨 하나님의 의가 인도의 기준이자 방식임을 드러냈습니다.
- source_word: שׁוֹרְרָי
  english_pob_choice: my enemies
  chosen_korean: 제 원수들 때문에
  alternatives_korean:
  - 저를 엿보는 자들 때문에
  - 제 적들 때문에
  lexicon: HALOT
  rationale: 기본적인 대립자 의미를 살려 ‘원수들’로 번역하되, 시편 문맥상의 적대적 감시/매복의 뉘앙스를 한국어 본문에서는 자연스럽게 흡수하도록 ‘때문에’를 두었습니다.
- source_word: הושר
  english_pob_choice: make your way straight
  chosen_korean: 주님의 길을 … 곧게 하소서
  alternatives_korean:
  - 주님의 길을 … 바르게 하소서
  - 주님의 길을 … 평탄하게 하소서
  lexicon: HALOT
  rationale: ישר의 사역형으로서 ‘곧게 하다/바르게 하다/평탄하게 하다’가 가능하지만, 시적 직선성의 이미지를 살려 ‘곧게 하소서’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 언약명 고유성을 보존하기 위해 POB 기본 원칙대로 ‘야훼’를 사용했습니다. 이는 일반적인 교회 용례보다 원문 식별성을 우선한 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: צדקה의 의미 선택
  chosen_reading: 의
  alternative_readings:
  - 정의
  - 의로움
  rationale: 이 구절은 하나님의 성품에 근거한 인도를 구하므로, משפט적 ‘정의’보다 언약적·도덕적 성격을 포함하는 ‘의’가 더 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
