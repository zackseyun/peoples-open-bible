  from: Even on your skirts is found the blood of the lives of innocent poor people[a]. I did not find them in a break-in[c][b], but on account of all these things.
  to: Even on your skirts is found the lifeblood of the innocent poor. You did not catch them[a] breaking in[b]. Yet despite all this[c],
  rationale: The earlier rationale rightly identifies innocent victims rather than burglars, but treats the suffixed verb as exclusively first-person; the second-person feminine reading better fits the address. I read the final clause as a concessive lead-in to verse 35 and preserve the earlier significant understandings in notes.
