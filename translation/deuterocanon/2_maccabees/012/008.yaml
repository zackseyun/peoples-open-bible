reference: 2 Maccabees 12:8
source:
  edition: lxx-swete-1909
  text: μεταλαβὼν δὲ καὶ τοὺς ἐν Ἰαμνίᾳ τὸν αὐτὸν ἐπιτελεῖν βουλομένους τρόπον τοῖς κατοικοῦσιν Ἰουδαίοις,
  language: Greek
  pages:
  - 718
  confidence: high
  validation: agree
translation:
  text: He also learned that the people of Jamnia intended to do the same to the Jews living there.
  philosophy: dynamic
lexical_decisions:
- source_word: μεταλαβὼν
  lemma: μεταλαμβάνω
  chosen: after taking in hand
  alternatives:
  - after dealing with
  - after taking along
  - after attacking
  lexicon: LSJ
  rationale: The participle from μεταλαμβάνω here likely has the sense of 'taking up' or 'undertaking' with reference to another target group in the sequence of Judas's actions. 'After taking in hand' preserves the transitional force without over-specifying a military action not explicit in the word itself.
- source_word: τοὺς ἐν Ἰαμνίᾳ
  chosen: those in Jamnia
  alternatives:
  - the people in Jamnia
  - those at Jamnia
  lexicon: LSJ
  rationale: The article plus prepositional phrase refers to the inhabitants or relevant group located in Jamnia. 'Those in Jamnia' is concise and leaves the referent broad, as in the Greek.
- source_word: τὸν αὐτὸν ... τρόπον
  chosen: the same kind of action
  alternatives:
  - the same way
  - the same plan
  - the same manner
  lexicon: LSJ
  rationale: τρόπος can mean 'way, manner, method.' Because the context is hostile conduct toward Jews, 'the same kind of action' makes the implied hostile method clearer in natural English while staying close to the Greek.
- source_word: ἐπιτελεῖν
  chosen: to carry out
  alternatives:
  - to accomplish
  - to complete
  - to execute
  lexicon: LSJ
  rationale: ἐπιτελεῖν commonly means to bring to completion or carry out. 'Carry out' fits an intended hostile act or plan in idiomatic English.
- source_word: βουλομένους
  chosen: were wanting
  alternatives:
  - intending
  - wishing
  - planning
  lexicon: LSJ
  rationale: The participle expresses volition or intention. 'Were wanting' preserves the participial, contemporaneous sense, though the broader clause already remains somewhat suspended because this verse continues into the next.
- source_word: τοῖς κατοικοῦσιν Ἰουδαίοις
  chosen: against the Jews living there
  alternatives:
  - for the Jews dwelling there
  - toward the resident Jews
  - the Jews who lived there
  lexicon: LSJ
  rationale: The dative depends on the hostile action implied by the larger context; in English, the relation is best made explicit as hostile direction. 'Living there' renders κατοικοῦσιν naturally.
