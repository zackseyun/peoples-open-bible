base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/010.yaml
  text: What is it, Israel? Why is it that you are in the land of enemies? You have grown old in a foreign land; you have become defiled with the dead,
  footnotes:
  - marker: a
    text: Or 'What is the matter, Israel? Why are you in the land of enemies?' The opening τί ἐστιν can function idiomatically as a lamenting exclamation or question.
