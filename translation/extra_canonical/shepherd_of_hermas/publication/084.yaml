  text: Ταῦτα οὖν συντελέσας ὁ ἀνὴρ ὁ ἔνδοξος καὶ κύριος ὅλου τοῦ πύργου προσεκαλέσατο τὸν ποιμένα, καὶ
    παρέδωκεν αὐτῷ τοὺς λίθους πάντας τοὺς παρὰ τὸν πύργον κειμένους, τοὺς ἀποβεβλημένους ἐκ τῆς οἰκοδομῆς,
    καὶ λέγει αὐτῷ· 2. Ἐπιμελῶς καθάρισον τοὺς λίθους τούτους καὶ θὲς αὐτοὺς εἰς τὴν οἰκοδομὴν τοῦ πύργου,
    τοὺς δυναμένους ἁρμόσαι τοῖς λοιποῖς· τοὺς δὲ μὴ ἁρμόζοντας ῥῖψον μακρὰν ἀπὸ τοῦ πύργου. 3. | ταῦτα
    κελεύσας τῷ ποιμένι ἀπῄει ἀπὸ τοῦ πύργου | μετὰ πάντων ὧν ἐληλύθει. αἱ δὲ παρθένοι κύκλῳ τοῦ πύργου
    εἱστήκεισαν τηροῦσαι αὐτόν. 4. λέγω τῷ ποιμένι· Πῶς πάλιν οὗτοι οἱ λίθοι δύνανται εἰς τὴν οἰκοδομὴν
    τοῦ πύργου ἀπελθεῖν ἀποδεδοκιμασμένοι; ἀποκριθείς μοι λέγει· Βλέπεις, φησί, τοὺς λίθους τούτους; Βλέπω,
    φημί, κύριε. Ἐγώ, φησί, τὸ πλεῖστον μέρος τῶν λίθων τούτων λατομήσω καὶ βαλῶ εἰς τὴν οἰκοδομήν, καὶ
    ἁρμόσουσι μετὰ τῶν λοιπῶν λίθων. 5. Πῶς, φημί, κύριε, δύνανται περικοπέντες τὸν αὐτὸν τόπον πληρῶσαι;
    ἀποκριθεὶς λέγει μοι· Ὅσοι μικροὶ εὑρεθῶσι εἰς μέσην τὴν οἰκοδομὴν βληθήσονται, ὅσοι δὲ μείζονες,
    ἐξώτεροι τεθήσονται καὶ συγκρατήσουσιν αὐτούς. 6. ταῦτά μοι λαλήσας λέγει μοι· Ἄγωμεν, καὶ μετὰ ἡμέρας
    δύο ἔλθωμεν καὶ καθαρίσωμεν τοὺς λίθους τούτους, καὶ βάλωμεν αὐτοὺς εἰς τὴν οἰκοδομήν· τὰ γὰρ κύκλῳ
    τοῦ πύργου πάντα καθαρισθῆναι δεῖ, μήποτε ὁ δεσπότης ἐξάπινα ἔλθῃ καὶ τὰ περὶ τὸν πύργον ῥυπαρὰ εὕρῃ
    καὶ προσοχθίσῃ, καὶ οὗτοι οἱ λίθοι οὐκ ἀπελεύσονται εἰς τὴν οἰκοδομὴν τοῦ πύργου, κἀγὼ ἀμελὴς δόξω
    εἶναι παρὰ τῷ δεσπότῃ. 7. καὶ μετὰ ἡμέρας δύο ἤλθομεν πρὸς τὸν πύργον, καὶ λέγει μοι· Κατανοήσωμεν
    τοὺς λίθους πάντας, καὶ ἴδωμεν τοὺς δυναμένους εἰς τὴν οἰκοδομὴν ἀπελθεῖν. λέγω αὐτῷ· Κύριε, κατανοήσωμεν.
