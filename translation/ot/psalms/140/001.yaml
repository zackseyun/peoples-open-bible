id: PSA.140.1
reference: Psalms 140:1
source:
  edition: WLC
  text: חַלְּצֵ֣/נִי יְ֭הוָה מֵ/אָדָ֣ם רָ֑ע מֵ/אִ֖ישׁ חֲמָסִ֣ים תִּנְצְרֵֽ/נִי׃
translation:
  text: Rescue me, O Yahweh, from evil men; guard me from violent men.
  philosophy: dynamic
lexical_decisions:
- source_word: חַלְּצֵנִי
  chosen: Rescue me
  alternatives:
  - Deliver me
  lexicon: HALOT
  rationale: From חלץ in the Hiphil imperative with 1cs suffix, meaning to draw out, rescue, or deliver. 'Rescue me' is natural modern English and preserves the urgent plea without sounding overly traditional.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: מֵאָדָם רָע
  chosen: from an evil man
  alternatives:
  - from an evil man
  - from evil humanity
  lexicon: HALOT
  rationale: The formally indefinite singular denotes an unidentified evil person.
- source_word: מֵאִישׁ חֲמָסִים
  chosen: from a violent man
  alternatives:
  - from a violent man
  - from the man of violences
  lexicon: HALOT
  rationale: The Hebrew singular phrase is indefinite; the adjectival English is natural without loss of sense.
- source_word: תִּנְצְרֵנִי
  chosen: guard me
  alternatives:
  - keep me
  - preserve me
  - watch over me
  lexicon: HALOT
  rationale: From נצר, 'to guard, keep, preserve.' 'Guard me' pairs well with 'rescue me' while distinguishing the second verb from the first and preserving the sense of ongoing protection.
