  from: The city of chaos is broken down[b][a]; every house is shut up so that none may enter.
  to: The city of chaos[a] lies shattered; every house is shut, so no one can enter.
  rationale: The lexical record recognizes chaos, emptiness, and desolation in the city's designation, so I retain its striking image and a serious alternative without identifying a particular city. I express the houses' closure as actual inability to enter rather than possible lack of permission.
