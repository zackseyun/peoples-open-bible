  source_fidelity: 첫 번째 אֲלֵיהֶם은 ‘그들을 두고/그들에게 대하여’라는 심판 선포의 대상을, 두 번째 אֲלֵיהֶם은 발화의 수신자를 나타냅니다. 초안은 둘 다 ‘그들에게’로 옮겨 첫 용법의 대적·대상 의미가 본문에서는 사라지고 각주에만 남았습니다. 또한 마지막 절에서 יַעֲנֶה(‘응답하다’)의 주체와 행위를 ‘그것은 … 향한 것입니다’로 바꾸어 원문의 서술을 훼손했습니다. 이를 본문에서 회복했습니다.
  naturalness: ‘그들을 두고 … 그들에게 말해야 합니다’는 두 전치사 용법을 자연스럽게 구별합니다. ‘포도 밟는 자들처럼 함성을 지르시며 땅의 모든 주민에게 응답하실 것입니다’는 히브리어의 비유와 동사 연쇄를 현대 표준어 합쇼체로 유지합니다.
  terminology: יהוה의 음역인 ‘야훼’, שאג의 ‘포효하다’, נוהו의 목양 이미지인 ‘목초지’를 유지했습니다. הֵידָד는 ‘함성’으로 옮기고 각주에서 포도 밟는 자들의 외침이라는 어휘 배경을 밝혔습니다.
