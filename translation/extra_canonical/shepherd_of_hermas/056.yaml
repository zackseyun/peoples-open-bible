  - source_word: μετανοήσωσι
    chosen: repent
    alternatives:
    - change their mind
    - turn back
    lexicon: BDAG
    rationale: Here the context is moral guilt and recognition of evil deeds; 'repent' is apt per project guidelines.
  - source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν
    chosen: rise up into their heart
    alternatives:
    - come into their heart
