  adjudicator: gpt-6.1-sol-meaning-pass
  reviewer_model: gpt-6.1-sol-2026-09-29
  category: meaning_retranslation
  from: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
  to: He will give their kings into your hand, and you shall blot out their name from under heaven. No one will be able to stand against you until you have destroyed them.
  rationale: The lexical record supports both the remembrance carried by 'name' and the military sense of standing one's ground. I retain the singular 'their name' and the hand image, but go beyond the earlier preference for 'man' and 'before' to state their acknowledged contextual meanings clearly.
