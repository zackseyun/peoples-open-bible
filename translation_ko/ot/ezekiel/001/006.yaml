  text: 각 생물은 얼굴이 넷이었고, 날개도 넷이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַרְבָּעָה פָנִים
  english_pob_choice: four faces
  chosen_korean: 얼굴이 넷
  alternatives_korean:
  - 네 얼굴
  - 얼굴 넷이
  lexicon: פָנִים
  rationale: 히브리어 פָנִים는 기본적으로 ‘얼굴’이며, 본문은 생물 하나마다 얼굴 수를 단순 서술하므로 자연스러운 한국어 어순으로 옮겼습니다.
- source_word: לְאֶחָת / לְאַחַת
  english_pob_choice: Each
  chosen_korean: 각 생물은
  alternatives_korean:
  - 각각은
  - 하나마다
  lexicon: אֶחָת
  rationale: 문맥상 네 생물 각각을 가리키므로, 주어를 분명히 드러내는 ‘각 생물은’으로 처리해 반복적 분배 의미를 살렸습니다.
- source_word: וְאַרְבַּע כְּנָפַיִם
  english_pob_choice: four wings
  chosen_korean: 날개가 넷
  alternatives_korean:
  - 네 날개
  - 날개 넷이
  lexicon: כְּנָפַיִם
  rationale: ‘날개’의 수를 단정하는 병렬 구조를 유지하면서, 앞절과 같은 방식으로 수량 서술을 맞췄습니다.
- source_word: לָהֶם
  english_pob_choice: of them
  chosen_korean: 각각은
  alternatives_korean:
  - 그들 각각은
  - 그것들 각각은
  lexicon: לָהֶם
  rationale: 영어 POB의 ‘each of them’처럼 분배적 관계를 강조해야 하므로, 한국어에서도 중복을 줄이면서 ‘각각은’으로 반영했습니다.
theological_decisions:
- issue: 환상적 생물의 신체 묘사 직역
  chosen_reading: 본문의 상징적 이미지를 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 상징으로 풀어 설명하는 의역
  - ‘얼굴’과 ‘날개’를 비유로 약화하는 표현
  rationale: 에스겔의 환상 문맥에서 이 절은 해석보다 묘사가 우선이므로, 상징성을 설명적으로 덧붙이지 않고 원문의 이미지 강도를 보존했습니다.
  doctrine_reference: 에스겔 1장 환상 문맥
