  source_fidelity: 히브리어는 아브람과 그의 종들이 밤에 적군을 맞아 나뉘어 공격하고, 그들을 치며 호바까지 추격한 뒤 호바의 위치를 다마스쿠스 북쪽으로 설명합니다. 초안의 ‘자기와 그의 종들을 나누어’는 재귀적 ‘자기’와 목적격 구성이 원문의 주어 및 행동 관계를 부정확하고 어색하게 만듭니다. 또한 서사 과거 문맥에서 마지막을 현재형 ‘있습니다’로 끝낸 것은 시제상 부조화합니다.
  naturalness: ‘그와 그의 종들은 밤에 그들을 맞아 나뉘어’는 한국어에서 군사적 대열 분할과 대적의 방향을 자연스럽게 나타냅니다. 위치 관계는 관계절로 처리해 반복을 줄이고 서사 문체를 유지했습니다.
  terminology: 고유명사 חוֹבָה는 통용 음역인 ‘호바’로 옮겼습니다. 다마스쿠스와 추격이라는 표현은 유지했습니다. ‘북쪽’은 מִשְּׂמֹאל לְדַמָּשֶׂק의 지리적 의미를 보존합니다.
