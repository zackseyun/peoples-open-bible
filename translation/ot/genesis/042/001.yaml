  from: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
  to: When Jacob learned that there was grain for sale in Egypt, he said to his sons, “Why do you keep looking at one another?”
  rationale: The lexical record supports understanding the sons’ mutual looking as hesitation, so that question is retained. Its preference for “saw” preserves the source verb’s form, but the following verse makes “learned” the clearer expression of its contextual meaning.
