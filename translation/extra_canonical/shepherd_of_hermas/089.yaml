  text: Πρῶτον, φημί, πάντων, κύριε, τοῦτό μοι δήλωσον· ἡ πέτρα καὶ ἡ πύλη τίς ἐστιν; Ἡ πέτρα, φησίν,
    αὕτη καὶ ἡ πύλη ὁ υἱὸς τοῦ Θεοῦ ἐστί. Πῶς, φημί, κύριε, ἡ πέτρα παλαιά ἐστιν, ἡ δὲ πύλη καινή; Ἄκουε,
    φησί, καὶ σύνιε, ἀσύνετε. 2. ὁ μὲν υἱὸς τοῦ Θεοῦ πάσης τῆς κτίσεως αὐτοῦ προγενέστερός ἐστιν, ὥστε
    σύμβουλον αὐτὸν γενέσθαι τῷ πατρὶ τῆς κτίσεως αὐτοῦ· διὰ τοῦτο καὶ παλαιός ἐστιν. Ἡ δὲ πύλη διατί
    καινή, φημί, κύριε; 3. Ὅτι, φησίν, ἐπ᾿ ἐσχάτων τῶν ἡμερῶν τῆς συντελείας φανερὸς ἐγένετο, διὰ τοῦτο
    καινὴ ἐγένετο ἡ πύλη, ἵνα οἱ μέλλοντες σώζεσθαι δι᾿ αὐτῆς εἰς τὴν βασιλείαν εἰσέλθωσι τοῦ Θεοῦ. 4.
    εἶδες, φησί, τοὺς λίθους τοὺς διὰ τῆς πύλης ἐληλυθότας | ἀπεληλυθότας | εἰς τὴν οἰκοδομὴν τοῦ πύργου,
    τοὺς δὲ μὴ εἰσεληλυθότας πάλιν ἀποβεβλημένους εἰς τὸν ἴδιον τόπον; Εἶδον, φημί, κύριε. Οὕτω, φησίν,
    εἰς τὴν βασιλείαν τοῦ Θεοῦ οὐδεὶς εἰσελεύσεται, εἰ μὴ λάβοι τὸ ὄνομα τοῦ υἱοῦ αὐτοῦ. 5. ἐὰν γὰρ εἰς
    πόλιν θελήσῃς εἰσελθεῖν τινά, κἀκείνη ἡ πόλις περιτετειχισμένη κύκλῳ καὶ μίαν ἔχει πύλην, μήτι δυνήσῃ
    εἰς τὴν πόλιν ἐκείνην εἰσελθεῖν εἰ μὴ διὰ τῆς πύλης ἧς ἔχει; Πῶς γάρ, φημί, κύριε, δύναται ἄλλως;
    Εἰ οὖν εἰς τὴν πόλιν οὐ δύνῃ εἰσελθεῖν εἰ μὴ διὰ τῆς πύλης αὐτῆς, οὕτω, φησί, καὶ εἰς τὴν βασιλείαν
    τοῦ Θεοῦ ἄλλως εἰσελθεῖν οὐ δύναται ἄνθρωπος εἰ μὴ διὰ τοῦ ὀνόματος τοῦ υἱοῦ αὐτοῦ τοῦ ἠγαπημένου
    ὑπ᾿ αὐτοῦ. 6. εἶδες, φησί, τὸν ὄχλον τὸν οἰκοδομοῦντα τὸν πύργον; Εἶδον, φημί, κύριε. Ἐκεῖνοι, φησί,
    πάντες ἄγγελοι ἔνδοξοί εἰσι. τούτοις οὖν περιτείχισται ὁ Κύριος. ἡ δὲ πύλη ὁ υἱὸς τοῦ Θεοῦ ἐστιν·
    αὕτη μία εἴσοδός ἐστι πρὸς τὸν Κύριον. ἄλλως οὖν οὐδεὶς εἰσελεύσεται πρὸς αὐτὸν εἰ μὴ διὰ τοῦ υἱοῦ
    αὐτοῦ. 7. εἶδες, φησί, τοὺς ἓξ ἄνδρας καὶ τὸν μέσον αὐτῶν ἔνδοξον καὶ μέγαν ἄνδρα τὸν περιπατοῦντα
    περὶ τὸν πύργον καὶ τοὺς λίθους ἀποδοκιμάσαντα ἐκ τῆς οἰκοδομῆς; Εἶδον, φημί, κύριε. 8. Ὁ ἔνδοξος,
    φησίν, ἀνὴρ ὁ υἱὸς τοῦ Θεοῦ ἐστί, κἀκεῖνοι οἱ ἓξ οἱ ἔνδοξοι ἄγγελοί εἰσι δεξιὰ καὶ εὐώνυμα συγκρατοῦντες
    αὐτόν. τούτων, φησί, τῶν ἀγγέλων τῶν ἐνδόξων οὐδεὶς εἰσελεύσεται πρὸς τὸν Θεὸν ἄτερ αὐτοῦ· ὃς ἂν τὸ
    ὄνομα αὐτοῦ μὴ λάβῃ, οὐκ εἰσελεύσεται εἰς τὴν βασιλείαν τοῦ Θεοῦ.
