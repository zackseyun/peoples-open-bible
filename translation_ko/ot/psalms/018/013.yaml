  rationale: נֶגֶד의 공간적 의미를 살려 '그의 앞의'로 처리해, 단순한 추상적 '임재'로 완화하지 않았습니다.
- source_word: עָבָיו
  english_pob_choice: his clouds
  chosen_korean: 그의 구름
  alternatives_korean:
  - 그의 먹구름
  - 그의 짙은 구름
  lexicon: HALOT
  rationale: 어간의 기본 뜻을 따라 '구름'으로 두고, 뒤의 우박과 불의 숯이 이미 폭풍 이미지를 충분히 형성하므로 수식어를 덧붙이지 않았습니다.
- source_word: וְגַחֲלֵי אֵשׁ
  english_pob_choice: and coals of fire
  chosen_korean: 불의 숯
  alternatives_korean:
  - 불타는 숯
  - 불의 숯덩이
  lexicon: HALOT
  rationale: 구문을 직역해 'fire coals'의 이미지를 보존했습니다. '불타는 숯'은 의미를 풀어쓴 것이고, '불의 숯'이 원문의 압축성을 더 잘 반영합니다.
theological_decisions:
