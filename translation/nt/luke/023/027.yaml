id: LUK.23.27
reference: Luke 23:27
source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
translation:
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
  philosophy: dynamic
lexical_decisions:
- source_word: Ἠκολούθει
  chosen: followed
  alternatives:
  - was following
  lexicon: BDAG
  rationale: The imperfect advances the narrative with an ongoing action. Simple past is idiomatic English here; the following paired imperfects carry the visible progressive emphasis.
- source_word: δὲ
  chosen: narrative continuation (not separately represented)
  alternatives:
  - And
  - Now
  lexicon: BDAG
  rationale: The connective marks narrative continuation but does not require a sentence-initial English conjunction.
- source_word: αὐτῷ
  chosen: him
  alternatives:
  - after him
  lexicon: BDAG
  rationale: Dative with ἀκολουθέω means the crowd was following Jesus. English idiom prefers direct object 'him' with 'follow'.
- source_word: πολὺ πλῆθος
  chosen: a large crowd
  alternatives:
  - a great multitude
  lexicon: BDAG
  rationale: The singular head noun controls the Greek verb and is naturally rendered as a collective crowd in English.
- source_word: τοῦ λαοῦ
  chosen: of people
  alternatives:
  - of the people
  lexicon: BDAG
  rationale: With 'crowd,' English naturally identifies its members as people without a mechanical article.
- source_word: γυναικῶν
  chosen: including women
  alternatives:
  - and women
  lexicon: BDAG
  rationale: The partitive expression identifies women within the accompanying crowd and prepares for the feminine relative clause.
- source_word: αἳ
  chosen: who
  alternatives: []
  lexicon: BDAG
  rationale: The feminine plural relative pronoun refers specifically to the women, which the English clause preserves.
- source_word: ἐκόπτοντο
  chosen: were beating their breasts
  alternatives:
  - were beating themselves
  - were wailing
  lexicon: BDAG
  rationale: In mourning contexts κόπτομαι can refer idiomatically to beating one's breast as a sign of grief. This makes the cultural action explicit in clear English rather than leaving the more opaque literal 'were beating themselves.'
- source_word: ἐθρήνουν
  chosen: mourning
  alternatives:
  - lamenting
  - wailing
  lexicon: BDAG
  rationale: θρηνέω denotes lamenting or mourning, often in audible grief. 'Mourning' is accessible modern English; 'lamenting' is possible but slightly less natural here.
- source_word: αὐτόν
  chosen: for him
  alternatives:
  - him
  - over him
  lexicon: BDAG
  rationale: With verbs of lament in English, 'mourning for him' communicates the object of grief idiomatically. 'Over him' is also possible, but 'for him' is more natural in contemporary English.
