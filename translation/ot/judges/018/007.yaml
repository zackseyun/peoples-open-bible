  from: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
  to: The five men went on to Laish and saw that its people lived in safety, as the Sidonians did, quiet and secure. There was no ruler in the land to oppress them[a]. They lived far from the Sidonians and had no dealings with anyone.
  rationale: The lexical record favors the absence of a ruler or oppressor who would dominate and humiliate them, but the current English leaves that sense obscure. I adopt that interpretation cautiously and retain the cumulative emphasis on security and isolation.
