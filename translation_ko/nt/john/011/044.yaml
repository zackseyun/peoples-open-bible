  naturalness: ‘풀어 주어 가게 하십시오’보다 ‘풀어 주고 가게 하십시오’가 현대 표준 한국어에서 더 자연스럽고, 두 명령의 순서를 명료하게 드러냅니다.
  terminology: ‘감는 천’은 κειρίαις의 결박·포장 기능을 보존하면서 ‘수의’가 불러올 수 있는 단일 의복 또는 시신 덮개라는 좁은 의미를 피합니다. σουδαρίῳ는 ‘수건’으로 유지할 수 있습니다.
