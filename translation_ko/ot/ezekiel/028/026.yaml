revisions:
- from: 그들은 그 위에 안전하게 살며, 집들을 짓고 포도원들을 심을 것입니다. 내가 그들 주위에서 그들을 멸시하는 모든 이들에 대해 심판을 집행할 때에도 그들은 안전하게 살 것입니다. 그러면 그들은 내가 그들의 하나님인 야훼임을 알게 될 것입니다.[a]
  to: 그들은 그 땅에 안전하게 살며, 집을 짓고 포도원을 심을 것입니다. 내가 그들 주위의 모든, 곧 그들을 멸시하는 자들에게 심판을 내릴 때, 그들은 안전하게 살 것입니다. 그러면 그들은 내가 그들의 하나님 야훼임을 알게 될 것입니다.
  rationale: 잘못된 각주를 삭제하고, 첫 문장의 지시 대상을 ‘그 땅’으로 명시했습니다. 시간 접속의 양보적 뉘앙스를 제거했으며, 주변의 멸시자들과 그들에 대한 심판이라는 원문의 관계를 유지했습니다. ‘집/포도원’은 히브리어 복수형의 일반적·집합적 용법을 자연스러운 한국어로 옮긴 것입니다.
