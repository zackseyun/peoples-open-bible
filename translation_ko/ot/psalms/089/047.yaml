lexical_decisions:
- source_word: עַד מָה
  english_pob_choice: How long
  chosen_korean: 언제까지입니까
  alternatives_korean:
  - 얼마나 더입니까
  - 언제까지
  lexicon: HALOT
  rationale: 탄식시의 관용구로서 지속되는 고통을 묻는 표현이므로, 현대 한국어의 자연스러운 항의·간청형인 ‘언제까지입니까’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문이 신성 4문자 YHWH를 직접 부르므로, 프로젝트 기본값에 따라 고유 이름인 ‘야훼’를 사용했습니다.
- source_word: תִּסָּתֵר
  english_pob_choice: will you hide yourself
  chosen_korean: 자신을 숨기시렵니까
  alternatives_korean:
  - 숨으시렵니까
  - 자신을 감추시렵니까
  - 숨겨져 계시렵니까
  lexicon: HALOT
  rationale: 니팔형의 반사적 뉘앙스를 살리면서도 하나님이 ‘숨겨진 상태에 계신다’는 체험을 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: חֲמָתֶךָ
  english_pob_choice: your wrath
  chosen_korean: 주의 분노
  alternatives_korean:
  - 주의 진노
  - 주의 노여움
  - 주의 격노
  lexicon: HALOT
  rationale: ‘화/분노’ 계열 의미를 담되, 시편의 격조를 유지하면서 현대 한국어에서 분명한 ‘분노’로 옮겼습니다.
theological_decisions:
- issue: 하나님께 직접 말하는 탄식의 높임말 처리
