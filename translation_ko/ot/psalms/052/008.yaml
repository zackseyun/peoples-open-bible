  text: הִנֵּ֤ה הַ/גֶּ֗בֶר לֹ֤א יָשִׂ֥ים אֱלֹהִ֗ים מָֽע֫וּזּ֥/וֹ וַ֭/יִּבְטַח בְּ/רֹ֣ב עָשְׁר֑/וֹ יָ֝עֹ֗ז בְּ/הַוָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/008.yaml
  text: Look, this is the man who did not make God his refuge[a], but trusted in the abundance of his riches and grew strong in his wicked desire[b].
  footnotes:
  - marker: a
    text: Or “fortress” or “stronghold.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew noun can also mean “ruin,” “destruction,” or “destructive schemes.”
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 이 사람은 하나님을 자기의 피난처[a]로 삼지 않고, 많은 재물을 의지하며, 자기의 파멸[b] 가운데서 힘을 얻습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요새’ 또는 ‘산성’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 하와(הַוָּה)는 ‘멸망’, ‘악한 욕망’, 또는 ‘파괴적인 꾀’를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיקִים
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 이들
  - 의인
  lexicon: HALOT
  rationale: 명사화된 복수형을 자연스럽게 풀어 현대 한국어에서 익숙한 ‘의인들’로 옮겼습니다. ‘the righteous’의 집단성을 유지합니다.
- source_word: וְיִרְאוּ
  english_pob_choice: will see
  chosen_korean: 보고
  alternatives_korean:
  - 볼 것입니다
  - 보며
  lexicon: HALOT
  rationale: 시편의 병렬 구조에서 앞절의 동작을 이어 주는 현재 분사형 연결이 자연스러워 ‘보고’로 처리했습니다. 시각적 인식의 기본 의미를 보존합니다.
- source_word: וְיִירָאוּ
  english_pob_choice: fear
  chosen_korean: 두려워하며
  alternatives_korean:
  - 두려워할 것입니다
  - 경외하며
  - 무서워하며
  lexicon: HALOT
  rationale: 이 문맥의 ירא는 단순 공포와 경외가 함께 걸려 있으므로, 영어 POB의 긴장을 반영해 ‘두려워하며’로 옮겼습니다. ‘경외하다’는 긍정적 뉘앙스를 과도하게 좁힐 수 있습니다.
- source_word: וְעָלָיו יִשְׂחָקוּ
  english_pob_choice: they will laugh at him
  chosen_korean: 그를 비웃을 것입니다
  alternatives_korean:
  - 그에게 웃을 것입니다
  - 그를 조롱할 것입니다
  - 그 위에 웃을 것입니다
  lexicon: HALOT
  rationale: שׂחק는 기본적으로 ‘웃다’이지만 대상이 심판받는 악인이므로 조롱의 뉘앙스가 강합니다. 한국어에서는 ‘비웃다’가 이 결합을 가장 자연스럽게 드러냅니다.
theological_decisions:
- issue: 의인들이 느끼는 ‘두려움’의 성격
  chosen_reading: ‘두려워하며’로 두려움과 경외의 긴장을 함께 남겼습니다.
  alternative_readings:
  - 경외하며
  - 무서워하며
  rationale: 본절은 하나님의 심판을 목격한 의인의 반응을 말하므로, 공포로만도 경외로만도 고정하지 않는 것이 본문의 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
