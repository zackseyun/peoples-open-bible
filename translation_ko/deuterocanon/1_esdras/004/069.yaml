  revised_text: 그때 다리오 왕이 일어나 그에게 입을 맞추고, 모든 청지기와 지방 통치자와 장군과 사트라프에게 그를 위하여 편지를 써서, 그와 함께 예루살렘을 다시 세우려고 올라가는 모든 사람을 떠나보내도록 하였습니다.
