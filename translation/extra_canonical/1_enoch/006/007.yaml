- issue: Whether to identify the named angels explicitly as leaders
  chosen_reading: Retain “angels” in the main text.
  alternative_readings:
  - Render the term contextually as “leaders.”
  rationale: The Ge'ez witness uses angel terminology; leadership may be implied by
    the surrounding account but is not made explicit in this verse’s wording.
