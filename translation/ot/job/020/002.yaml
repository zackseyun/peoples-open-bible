id: JOB.20.2
reference: Job 20:2
source:
  edition: WLC
  text: לָ֭/כֵן שְׂעִפַּ֣/י יְשִׁיב֑וּ/נִי וּ֝/בַ/עֲב֗וּר ח֣וּשִׁ/י בִֽ/י׃
translation:
  text: Therefore my thoughts make me answer[a], because of the urgency within me.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “my thoughts answer me.”
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  chosen: Therefore
  alternatives:
  - So
  - For this reason
  lexicon: HALOT
  rationale: Discourse marker indicating consequence or inference from the preceding speech. 'Therefore' preserves the logical connection clearly in modern English.
- source_word: שְׂעִפַּי
  chosen: my troubled thoughts
  alternatives:
  - my thoughts
  - my disquieting thoughts
  - my divided thoughts
  lexicon: HALOT
  rationale: From שְׂעִפִּים, often referring to disquieting, divided, or anxious thoughts rather than neutral cognition. 'Troubled thoughts' communicates the emotional disturbance in context better than the bare 'thoughts.'
- source_word: יְשִׁיבוּנִי
  chosen: make me answer
  alternatives:
  - bring me back
  - respond within me
  - cause me to reply
  lexicon: HALOT
  rationale: The Hiphil supports a causative sense in this context.
- source_word: וּבַעֲבוּר
  chosen: because of
  alternatives:
  - on account of
  - and because of
  lexicon: HALOT
  rationale: Prepositional expression marking cause or reason. 'Because of' gives clear causal force. The prefixed conjunction is absorbed naturally into English style rather than rendered woodenly as a separate 'and.'
- source_word: חוּשִׁי
  chosen: my inward agitation
  alternatives:
  - my haste
  - my agitation
  - my inner turmoil
  lexicon: HALOT
  rationale: Though related to a root meaning haste, in this poetic context the noun with first-person suffix likely denotes the inner impulsion, agitation, or excited stirring that drives Zophar's response. 'Inward agitation' captures both the internal and urgent sense.
- source_word: בִי
  chosen: inward
  alternatives:
  - in me
  - within me
  lexicon: HALOT
  rationale: The preposition with first-person suffix locates the cause internally. Rendering it adjectivally in English ('inward agitation') avoids awkwardness while preserving the sense of something arising within him.
- source_word: חוּשִׁי בִי
  chosen: the urgency within me
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This conveys inward haste or impetus without imposing a more specific psychological state.
