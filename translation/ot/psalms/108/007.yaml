  from: 'God has spoken in his holiness: “I will exult[a][b]; I will divide up Shechem and measure out the Valley of Succoth.”'
  to: 'God has spoken in his holiness[a]: “I will exult[b]; I will divide up Shechem and measure out the Valley of Succoth.”'
  rationale: “Exult” is neither materially unnatural nor falsely precise; it better preserves the jubilant force of עלזה than the flatter “rejoice,” so the proposed lexical substitution is not warranted. The genuine ambiguity of בְּקָדְשׁוֹ should be marked at “his holiness,” and “rejoice” may remain as an alternative for “exult.”
