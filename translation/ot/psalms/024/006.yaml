  rationale: 'The proposed removal of “O” correctly avoids treating bare יעקב as a straightforward vocative, but leaving “—Jacob” in the main text produces unnatural English and does not adequately represent the most likely construal. In this notoriously difficult phrase, the Masoretic wording can support “Jacob” as the community/identity of those seeking God, while major ancient witnesses support “God of Jacob.” The current “O Jacob” is especially untenable: it makes Jacob the addressee immediately after “your face.” A minimal source-faithful resolution is “O God of Jacob,” with a note candidly preserving the Hebrew’s difficult bare “Jacob” reading and the textual uncertainty.'
