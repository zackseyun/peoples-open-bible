id: JOB.10.22
reference: Job 10:22
source:
  edition: WLC
  text: אֶ֤רֶץ עֵיפָ֨תָ/ה כְּמ֥וֹ אֹ֗פֶל צַ֭לְמָוֶת וְ/לֹ֥א סְדָרִ֗ים וַ/תֹּ֥פַע כְּמוֹ אֹֽפֶל׀־׃פ
translation:
  text: a land of gloom like deep darkness, a land of the shadow of death[a], without order, where even its light is like deep darkness[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “deep darkness.”
    reason: alternative_reading
  - marker: b
    text: Literally, “it shines like deep darkness.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  chosen: land
  alternatives:
  - earth
  - country
  lexicon: HALOT
  rationale: In context Job is describing the realm of the dead as a place or region; 'land' is the most natural English equivalent and fits the imagery better than the broader 'earth'.
- source_word: עֵיפָתָה
  chosen: of gloom
  alternatives:
  - of darkness
  - of weariness
  - of obscurity
  lexicon: HALOT
  rationale: The noun/adjectival form denotes darkness/gloominess. 'Of gloom' preserves the genitival descriptive force with readable English. 'Weariness' is less suitable in this immediate context dominated by darkness imagery.
- source_word: כְּמוֹ אֹפֶל
  chosen: like deep darkness
  alternatives:
  - like darkness
  - like thick darkness
  lexicon: HALOT
  rationale: אֹפֶל denotes dense or deep darkness, not merely ordinary darkness. 'Deep darkness' is idiomatic and preserves the intensified image.
- source_word: צַלְמָוֶת
  chosen: deep shadow
  alternatives:
  - deep shadow
  - deathly darkness
  lexicon: HALOT
  rationale: In this darkness-saturated context, "deep shadow" is a defensible source-near rendering that does not force a death-component into the main text; the traditional "shadow of death" remains available in the note.
- source_word: וְלֹא סְדָרִים
  chosen: and without order
  alternatives:
  - and with no order
  - and without arrangement
  lexicon: HALOT
  rationale: This preserves the conjunction and negative descriptive force in idiomatic English.
- source_word: וַתֹּפַע
  chosen: it shines
  alternatives:
  - and it shines
  - and it appears bright
  - and it gleams
  lexicon: HALOT
  rationale: The finite feminine singular verb is retained, preserving the deliberately paradoxical assertion that the land shines like deep darkness.
- source_word: כְּמוֹ אֹפֶל
  chosen: like deep darkness
  alternatives:
  - as darkness
  - as thick darkness
  lexicon: HALOT
  rationale: Repeating 'like deep darkness' preserves the Hebrew repetition and the verse's climactic paradox.
