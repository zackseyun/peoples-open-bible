base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/049.yaml
  text: Jesus said[a], "Blessed are the solitary and chosen, for you will find the kingdom. For you are from it[b][c], and you will go there again."
translation:
  language: fr
  text: 'Jésus dit : « Heureux les solitaires[a] et ceux qui sont choisis, car vous trouverez[b] le Royaume. Car vous êtes issus de lui[c], et vous y irez de nouveau. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme copte, emprunté au grec μοναχός (monachos), peut désigner des personnes « seules », « uniques » ou, dans une lecture spirituelle, « non divisées ». Il n’a pas nécessairement ici le sens institutionnel plus tardif de « moines ».
    reason: lexical_alternative
  - marker: b
    text: Après le verbe « trouver », le manuscrit emploie la préposition ⲁ au lieu du sahidique courant ⲉ, trait dialectal attesté dans ce codex.
    reason: dialect_note
  - marker: c
    text: 'Littéralement : « vous êtes [des gens] hors de lui », c’est-à-dire provenant de lui.'
    reason: register_note
lexical_decisions:
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  choice: solitaires
  rationale: Le mot, emprunté au grec μοναχός, désigne ici des personnes seules ou intérieurement unifiées. « Solitaires » évite l’anachronisme institutionnel de « moines » tout en conservant la brièveté du texte.
- source_word: ⲥⲟⲧⲡ
  choice: ceux qui sont choisis
  rationale: La forme qualitative exprime un état ou un sens passif. Cette formulation rend donc le pluriel et évite le contresens actif « ceux qui ont choisi ».
- source_word: ϩⲉ
  choice: trouverez
  rationale: Le verbe signifie ici « trouver », avec la préposition attendue après lui sous une forme dialectale dans le manuscrit.
- source_word: ⲙⲛⲧⲉⲣⲟ
  choice: Royaume
  rationale: « Royaume » est l’équivalent traditionnel et direct du terme copte; il conserve ici l’ambiguïté entre domaine, règne et souveraineté.
- source_word: ⲉⲃⲟⲗ ⲛϩⲏⲧⲥ
  choice: issus de lui
  rationale: Cette expression française naturelle rend l’idée d’origine contenue dans le littéral « hors de lui », avec un antécédent masculin correspondant à « Royaume ».
- source_word: ⲡⲁⲗⲓⲛ ... ⲃⲱⲕ ⲙⲙⲁⲩ
  choice: vous y irez de nouveau
  rationale: La formulation reste proche du mouvement explicitement énoncé (« aller là de nouveau ») sans expliciter davantage l’idée de retour.
theological_decisions:
- issue: Sens de ⲙⲟⲛⲁⲭⲟⲥ
  choice: solitaires
  alternative: moines; personnes seules; êtres unifiés
  rationale: « Moines » importerait une institution plus tardive. « Solitaires » laisse ouverte la nuance concrète ou spirituelle du terme.
- issue: Rapport entre les solitaires et les choisis
  choice: les solitaires et ceux qui sont choisis
  alternative: les solitaires choisis; les solitaires et les élus
  rationale: La coordination du copte est conservée sans décider si le texte décrit strictement un seul groupe sous deux aspects ou deux catégories étroitement associées.
- issue: Nature du Royaume
  choice: Royaume
  alternative: règne; souveraineté
  rationale: Le terme n’est pas interprété comme un lieu seulement futur ni comme un état purement intérieur. Les affirmations d’origine et de destination demeurent intactes.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe demeure proche du copte, notamment dans la béatitude et dans « vous y irez de nouveau ». La majuscule à « Royaume » signale son emploi comme réalité théologique centrale sans en fixer l’interprétation.
