  text: καὶ λαβὼν πάντα ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ. καὶ ἐποίησαν φονοκτονίαν, καὶ ἐλάλησαν ὑπερηφανίαν μεγάλην.
