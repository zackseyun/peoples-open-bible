id: PSA.83.13
reference: Psalms 83:13
source:
  edition: WLC
  text: אֱֽלֹהַ֗/י שִׁיתֵ֥/מוֹ כַ/גַּלְגַּ֑ל כְּ֝/קַ֗שׁ לִ/פְנֵי רֽוּחַ־׃
translation:
  text: My God, make them like tumbleweed[a], like straw before the wind.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “a whirling thing”; the Hebrew word also means “wheel” and suggests something rolling or whirling before the wind.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהַי
  chosen: My God
  alternatives:
  - O my God
  lexicon: HALOT
  rationale: Vocative address with 1cs suffix. English can render either 'My God' or 'O my God'; the simpler 'My God' preserves the direct appeal without adding an interjection not explicit in the Hebrew.
- source_word: שִׁיתֵמוֹ
  chosen: make them
  alternatives:
  - set them
  - place them
  lexicon: HALOT
  rationale: From שׁית, here an imperative/request to cause or appoint them as something. In English, 'make them' best fits the following comparative predicates ('like whirling dust... like chaff') and sounds natural in prayer.
- source_word: כַגַּלְגַּל
  chosen: like a whirling thing
  alternatives:
  - like a wheel
  - like tumbleweed
  - like a rolling thing
  lexicon: HALOT
  rationale: Avoids adding "dust" while retaining the dynamic rolling/whirling image appropriate to the parallel with wind-blown straw.
- source_word: כְּקַשׁ
  chosen: like straw
  alternatives:
  - like stubble
  - like straw
  lexicon: HALOT
  rationale: קַשׁ denotes straw, with stubble as a viable alternative; it is not specifically chaff.
- source_word: לִפְנֵי רוּחַ
  chosen: before the wind
  alternatives:
  - before a wind
  - in the face of the wind
  lexicon: HALOT
  rationale: Standard idiom meaning driven before the wind. The anarthrous רוּחַ here is naturally rendered generically as 'the wind' in English idiom.
