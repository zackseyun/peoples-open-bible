  from: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
  to: Therefore, since the Messiah suffered in his body, you too must arm yourselves with the same resolve, because whoever has suffered in the body has broken with sin[a],
