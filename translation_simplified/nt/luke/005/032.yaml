translation:
  language: en
  text: I have not come to call righteous people. I have come to call sinners to reorient toward God[r1].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to repentance.” The Greek phrase describes the goal of Jesus’ call.
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: the righteous
  simplified_phrase: righteous people
  preserved_meaning: The moral and religious category remains unqualified.
  reasoning_layer_used: POB lexical and theological decisions for δικαίους
  rationale: The added noun makes the category immediately clear without deciding whether they are truly righteous or only considered righteous.
- pob_phrase: I have not come to call the righteous, but sinners
  simplified_phrase: I have not come to call righteous people. I have come to call sinners
  preserved_meaning: Jesus contrasts those he did not come to call with those he did come to call.
  reasoning_layer_used: POB syntax and lexical decisions for ἐλήλυθα and καλέσαι
  rationale: Two short sentences make the contrast easier to follow while retaining “have come” and “call.”
interpretive_expansions:
- pob_phrase: but sinners
  rendering: I have come to call sinners
  claim: The second sentence states explicitly that calling sinners is Jesus’ purpose in coming.
  evidence:
  - The conjunction “but” contrasts sinners with those Jesus did not come to call.
  - The POB rationale identifies the infinitive “to call” as expressing purpose.
  confidence: high
  alternatives_preserved:
  - The contrast remains between righteous people and sinners.
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: Readers may assume “righteous people” means either truly righteous or self-righteous people.
    mitigation: The text adds no qualifier and preserves the POB’s intended theological tension.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
