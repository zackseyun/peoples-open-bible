  warnings:
  - 'Page 322: V.3.iii.3–4 corrected from physical322/printed306: imperative ἐπερώτα, not OCR ἐπερωτᾷν;
    ἄξιόν με ἡγήσω, not OCR ἠξίών με ἠγήσω. Printed-source transcription corrections, not new manuscript
    selections. Old raw bytes and normalized text are archived in the tower repair record.'
translation:
  text: 'IV.1. Answering, I say to her, “Lady, this matter is great and marvelous. Who are the six young
    men[1] building it, Lady?” “These are the holy angels of God, who were created first[2]. The Lord
    entrusted all his creation to them, to make it grow and build it up[3] and to rule over all creation.
    Through them the building of the tower[4] will be completed[5].”


    IV.2. “Who are the others carrying the stones?” “They too are holy angels of God[a], but these six
    are superior to them[6]. The building of the tower will be completed. All will rejoice together around
    the tower and glorify God because the building of the tower has been completed[7].”


    IV.3. I asked her, saying, “Lady, I wanted to know the outcome[8] of the stones and what sort of power
    they have.” Answering me, she says, “It is not because you are more worthy than everyone else that
    this is revealed to you. Others came before you and are better than you; these visions should have
    been revealed to them. But so that God’s name may be glorified, it has been revealed to you and will
    be revealed[b] for the sake of the double-minded[9], who wonder in their hearts whether these things
    are so or not[c]. Tell them that all these things are true. Nothing is outside the truth; all are
    strong, sure, and well-founded[10].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: The selected text numbers the builders six. Athos PlateII and both printed Latin versions retain
      six here. Sinaiticus12.1 first has exēkonta, sixty; ca changes it to hex, six. D’Abbadie1860’s Latin
      rendering of Ethiopic printed119 asks who the young builders are without this numeral. These are
      distinct readings, not independent votes by correctors.
    reason: textual_variant
  - marker: '2'
    text: First-created renders hoi prōtoi ktisthentes, a passive creation expression retained by Athos
      and Sinaiticus12.1. Palatina printed39 and the Ethiopic edition’s Latin rendering printed119 use
      first-created wording; Vulgata printed17 has primo constituti, first constituted or appointed. The
      Greek is not reduced to rank alone. The old alternatives and adjudications are preserved in the
      history archive.
    reason: textual_variant
  - marker: '3'
    text: Retain the explicit make-it-grow, build-it-up, and rule-over-all-creation clauses, as in the
      working Greek, Athos and Sinaiticus12.1. Palatina printed39 retains increase/build/rule; Vulgata
      printed18 uses create/build/rule. The Ethiopic edition’s Latin rendering printed119 has the entrusting
      and completion but lacks this three-infinitive expansion. The earlier doctrine-realignment decision
      to retain the growth and building force is preserved.
    reason: textual_variant
  - marker: '4'
    text: The preceding section identifies the tower as the Church; this cross-reference explains the
      image without adding that explanation to the present dialogue.
    reason: lexical_alternative
  - marker: '5'
    text: The selected Greek uses related completion verbs, telesthēsetai in paragraph1 and syntelesthēsetai
      in paragraph2. Both are future passives. The translation retains the completion promise without
      making the angels independent of the Lord who entrusted creation to them.
    reason: lexical_alternative
  - marker: a
    text: The other stone-carriers are holy angels of God in the working Greek, Athos, Sinaiticus12.2
      and Palatina printed39. Vulgata printed18 and the Ethiopic edition’s Latin rendering printed119
      instead call them angels of the Lord. No harmonizing title change is made in the selected text.
    reason: textual_variant
  - marker: '6'
    text: The six builders are superior to the other carriers. Athos and Palatina printed39 repeat six
      here. Sinaiticus12.2 first contains hex, six, which S1 removes; this is a deletion, not a supplied
      numeral. Vulgata printed18 and the Ethiopic edition’s Latin rendering printed119 express superiority
      without repeating six.
    reason: textual_variant
  - marker: '7'
    text: The source retains future completion and rejoicing followed by has-been-completed in the reason
      clause. Sinaiticus12.2 first uses a singular rejoicing verb, corrected by S1 to plural; this does
      not replace the future with a present event. The versions retain completion and collective joy in
      their own wording.
    reason: textual_variant
  - marker: '8'
    text: Outcome renders exodos, also issue or coming forth, without making the question solely about
      origin. The working Greek and Sinaiticus12.3 have exodos; Vulgata printed18 and Palatina printed39
      use exitus. Athos PlateII instead has diaphora, difference or distinction; the Ethiopic edition’s
      Latin rendering printed119 asks about character and explanation. The earlier outcome revision is
      retained, and its formerly inconsistent origin note and lexical entry are corrected. Power remains
      dynamis.
    reason: textual_variant
  - marker: b
    text: 'The selected text has it has been revealed to you and will be revealed. Sinaiticus12.3 first
      has only the future verb; ca adds the past verb and and, without an explicit soi, to you, in that
      addition. Athos and both Latin versions retain past and future revelation; Athos also has eti, still
      or further, absent from the selected print. P.Oxy.4706 fragment1 lines7–8 preserves only parts of
      the verbs: the edition reconstructs to you, and, and still across lost portions. Those restored
      words are not counted as surviving papyrus letters.'
    reason: textual_variant
  - marker: '9'
    text: Double-minded renders dipsychous, inner wavering or divided commitment. The following reasoning
      clause defines the doubt at issue. Compare James1:8 and4:8 for related usage. P.Oxy.4706 fragment1
      line9 preserves the beginning of the reasoning word; the edition infers omission of the repeated
      article tous from spacing. That omission is an editorial inference, not a wholly preserved phrase
      or a reason to omit the people’s doubt in English.
    reason: textual_variant
  - marker: c
    text: The selected question is whether these things are so or not. Sinaiticus12.3 first lacks this
      full question clause; S1 and ca add it in the official transcription. Athos has estai, will be,
      in its corresponding question; the selected print has estin, are. The P.Oxy.4706 editor restores
      estin before a surviving final n; the entire verb is not extant. Both Latin versions and the Ethiopic
      edition’s Latin rendering retain a positive-or-negative question. These corrected, restored and
      mediated readings are distinguished.
    reason: textual_variant
  - marker: '10'
    text: Retain all three assurances, strong, sure and well-founded, and the preceding nothing-is-outside-the-truth
      claim. They affirm these visions’ reliability; the text does not make a general assertion about
      every imaginable proposition.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κυρία
  chosen: Lady
  alternatives:
  - Madam
  - Mistress
  lexicon: BDAG; LSJ
  rationale: Respectful form of address to the female figure; "Lady" preserves dignity without implying
    ownership.
- source_word: νεανίσκοι
  chosen: young men
  alternatives:
  - youths
  - young fellows
  lexicon: BDAG
  rationale: Common Koine sense for male youths; avoids archaic tone while keeping age nuance.
- source_word: οἱ οἰκοδομοῦντες
  chosen: who are building
  alternatives:
  - who are constructing
  lexicon: BDAG
  rationale: Plain participial rendering keeps the building metaphor active.
- source_word: ἅγιοι ἄγγελοι
  chosen: holy angels
  alternatives:
  - holy messengers
  lexicon: BDAG
  rationale: Standard early Christian sense of ἄγγελος; "holy" kept as an attributive adjective.
- source_word: οἱ πρῶτοι κτισθέντες
  chosen: the first-created
  alternatives:
  - those created first
  lexicon: BDAG; LSJ
  rationale: The selected Greek explicitly describes creation, not merely rank or appointment. Vulgata
    first-constituted wording is distinguished in note2; the old alternatives remain archived.
- source_word: παρέδωκεν
  chosen: entrusted
  alternatives:
  - handed over
  - delivered
  lexicon: BDAG
  rationale: In stewardship contexts παραδίδωμι conveys "entrust" (assign responsibility), fitting the
    angelic charge over creation.
- source_word: κτίσις
  chosen: creation
  alternatives:
  - created order
  - creaturely order
  lexicon: BDAG
  rationale: Default rendering for κτίσις; broad cosmic scope is explicit in "all creation".
- source_word: αὔξειν
  chosen: to make it grow
  alternatives:
  - to increase
  lexicon: BDAG
  rationale: Dynamic infinitive paraphrase keeps transitivity clear; the object is creation's growth.
- source_word: οἰκοδομεῖν
  chosen: to build it up
  alternatives:
  - to build
  lexicon: BDAG
  rationale: '"Build up" maintains the constructive nuance and ties to the tower imagery.'
- source_word: δεσπόζειν
  chosen: to rule over
  alternatives:
  - to be master of
  - to have dominion over
  lexicon: LSJ
  rationale: Idiomatic English for exercising lordship; avoids the slavery connotations of "master" in
    modern English.
- source_word: τελεσθήσεται
  chosen: will be brought to completion
  alternatives:
  - will be finished
  - will be completed
  lexicon: BDAG
  rationale: Passive form foregrounds the work's completion by agency (the angels) without overstating
    their independence.
- source_word: συντελεσθήσεται
  chosen: will be brought to completion
  alternatives:
  - will be completed
  - will be accomplished
  lexicon: BDAG
  rationale: Syn-prefixed cognate emphasizes culmination; same English rendering preserves sense, with
    note provided.
- source_word: οἱ παραφέροντες (τοὺς λίθους)
  chosen: who are carrying (the stones)
  alternatives:
  - who are bringing along
  - who are bearing
  lexicon: LSJ
  rationale: Parapherō here denotes transport; "carrying" is natural English.
- source_word: ὑπερέχοντες
  chosen: are superior (to them)
  alternatives:
  - are over them
  - excel them
  lexicon: BDAG
  rationale: Conveys comparative rank/status in clear English.
- source_word: εὐφρανθήσονται
  chosen: will rejoice
  alternatives:
  - will be gladdened
  - will be made joyful
  lexicon: BDAG
  rationale: Standard rendering for the deponent future passive of εὐφραίνω in Koine contexts.
- source_word: κύκλῳ
  chosen: around
  alternatives:
  - all around
  - in a circle around
  lexicon: LSJ
  rationale: Concise spatial preposition; context already implies circular gathering.
- source_word: ἐτελέσθη
  chosen: has been completed
  alternatives:
  - is finished
  - was completed
  lexicon: BDAG
  rationale: Aorist indicative with resultant sense in visionary report; perfect-like translation fits
    English idiom.
- source_word: ἔξοδος (τῶν λίθων)
  chosen: outcome (of the stones)
  alternatives:
  - issue
  - coming forth
  - origin
  lexicon: LSJ; Lampe
  rationale: Retain the previously adjudicated outcome without restricting the question to provenance.
    Note8 distinguishes Athos diaphora and the versions; source power remains explicit.
- source_word: δύναμις
  chosen: power
  alternatives:
  - strength
  - capability
  lexicon: BDAG
  rationale: Default rendering; keeps the abstract noun's force.
- source_word: ἀξιώτερος
  chosen: more worthy
  alternatives:
  - more deserving
  - more qualified
  lexicon: BDAG
  rationale: Comparative of ἄξιος; "worthy" fits Hermas' moral register.
- source_word: πρότεροι
  chosen: before you
  alternatives:
  - earlier than you
  - prior to you
  lexicon: BDAG
  rationale: Temporal priority is emphasized; not necessarily rank.
- source_word: βελτίονες
  chosen: better
  alternatives:
  - more excellent
  - superior
  lexicon: LSJ
  rationale: Plain comparative of ἀγαθός via βελτίων; "better" suits tone.
- source_word: ἔδει
  chosen: it was fitting
  alternatives:
  - it was necessary
  - it was right
  lexicon: BDAG
  rationale: Hermas often uses ἔδει with the sense of propriety/fitness; "fitting" is slightly softer
    than "necessary."
- source_word: ὁράματα
  chosen: visions
  alternatives:
  - revelations
  lexicon: BDAG
  rationale: Maintains the visual aspect of the experiences described.
- source_word: δοξασθῇ
  chosen: be glorified
  alternatives:
  - be honored
  - be praised
  lexicon: BDAG
  rationale: Standard theologically-loaded rendering of δοξάζω.
- source_word: διψύχους
  chosen: double-minded
  alternatives:
  - of two minds
  - wavering
  lexicon: BDAG
  rationale: Conventional early Christian term; preserves moral diagnosis of inner division.
- source_word: διαλογιζομένους
  chosen: who reason
  alternatives:
  - who debate
  - who question
  lexicon: BDAG
  rationale: Keeps the sense of inward deliberation without importing adversarial tone.
- source_word: καρδία
  chosen: heart
  alternatives:
  - inner self
  - mind
  lexicon: BDAG
  rationale: Biblical/early Christian anthropological term; standard rendering.
- source_word: ἀληθῆ
  chosen: 'true'
  alternatives:
  - truthful
  - real
  lexicon: BDAG
  rationale: Plain adjective; no need for variation.
- source_word: ἔξωθεν
  chosen: outside
  alternatives:
  - apart from
  - external to
  lexicon: BDAG
  rationale: Metaphorical spatial preposition; "outside the truth" preserves Hermas' absolute claim.
- source_word: ἀλήθεια
  chosen: truth
  alternatives:
  - reality
  lexicon: BDAG
  rationale: Default theological term.
- source_word: ἰσχυρά
  chosen: strong
  alternatives:
  - powerful
  lexicon: BDAG
  rationale: Pairs well with βέβαια in English rhythm while retaining meaning.
- source_word: βέβαια
  chosen: sure
  alternatives:
  - firm
  - secure
  lexicon: BDAG
  rationale: Conveys stability/reliability alongside ἰσχυρά.
- source_word: τεθεμελιωμένα
  chosen: well-founded
  alternatives:
  - established
  - founded
  lexicon: BDAG
  rationale: Echoes building imagery; idiomatic English for a secure foundation.
