  text: ἐγίνετο δὲ νέων καὶ πρεσβυτέρων ἀναίρεσις, ἀνδρῶν τε καὶ γυναικῶν καὶ τέκνων ἀφανισμός, παρθένων τε καὶ νηπίων σφαγαί.
