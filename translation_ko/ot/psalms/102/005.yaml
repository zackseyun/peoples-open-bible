theological_decisions:
- issue: לֵב / heart as the seat of inner life
  chosen_reading: ‘제 마음’은 감정만이 아니라 생각과 의지를 포함한 내면 전체를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘내 심장’
  - ‘내 속사람’
  rationale: 시적 인체 은유를 한국어 성경 관용에 맞게 전달하면서도, 단순한 감정 표현으로 축소되지 않도록 했습니다.
  doctrine_reference: 성경적 인간 이해에서 ‘마음’은 내면 전체를 포괄합니다.
