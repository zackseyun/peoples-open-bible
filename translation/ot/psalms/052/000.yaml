lexical_decisions:
- source_word: לַמְנַצֵּחַ
  chosen: For the choirmaster
  alternatives:
  - To the choirmaster
  - For the director of music
  lexicon: HALOT
  rationale: In Psalm superscriptions, this term conventionally denotes direction to or for the musical leader. 'Choirmaster' is concise, idiomatic, and preserves the liturgical/musical function better than the broader 'director of music.' 'For' fits English superscription style naturally, though 'to' is also possible.
- source_word: מַשְׂכִּיל
  chosen: A Maskil
  alternatives:
  - A contemplative psalm
  - An instructive song
  lexicon: HALOT
  rationale: The precise force of מַשְׂכִּיל in psalm headings is uncertain and likely functions as a genre or performance label. Retaining 'Maskil' preserves the Hebrew term transparently without overstating a debated meaning. Interpretive glosses such as 'contemplative' or 'instructive' are possible but less auditable in the main text.
- source_word: לְדָוִד
  chosen: of David
  alternatives:
  - belonging to David
  - for David
  - by David
  lexicon: HALOT
  rationale: The preposition ל in psalm headings can indicate authorship, association, dedication, or possession. 'Of David' is the most textually restrained and traditional English rendering because it preserves the ambiguity rather than resolving it to authorship ('by David') or dedication ('for David').
