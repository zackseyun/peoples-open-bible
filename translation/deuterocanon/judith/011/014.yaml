  meaning_decisions:
  - source_phrase: καὶ ἀπεστάλακεν εἰς Ἰερουσαλήμ ... τοὺς μετοικίσαντας αὐτοῖς
    prior_rendering: And he sent word to Jerusalem ... granting to those who had settled among them
