translation:
  language: en
  text: So repent[c]. If you do not repent, I am coming to you quickly, and I will make war against them[a] with the sword of my mouth.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Greek expression can literally mean “with them,” but here it means “against them.”
    reason: lexical_alternative
  - marker: b
    text: The “sword of my mouth” is an apocalyptic image for Christ’s judicial word of judgment.
    reason: cross_reference
  - marker: c
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
simplification_decisions:
