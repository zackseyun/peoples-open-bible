base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/049.yaml
  text: Shepha fathered Sheva, the father of Machbenah and the father of Gibea; and Caleb’s daughter was Acsah.
translation:
  language: de
  text: Und sie gebar Schaaf, den Vater von Madmanna,[a] und Schewa, den Vater von Machbena und den Vater von Gibea. Kalebs Tochter war Achsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vater von“ kann hier auch „Gründer von“ oder „Stammvater der Bewohner von“ bedeuten; Madmanna, Machbena und Gibea sind wahrscheinlich Ortsnamen.
    reason: Die wiederholte genealogische Formel אֲבִי ist bei Ortsnamen semantisch weiter als eine rein biologische Vaterschaft.
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Und sie gebar
  rationale: Die feminine Verbform bezieht sich auf die im vorherigen Vers genannte Maacha und wird entsprechend ausdrücklich wiedergegeben.
- source_word: אֲבִי
  choice: Vater von
  rationale: Die genealogische Bezeichnung bleibt wörtlich erhalten; sie kann je nach Zusammenhang auch Gründer oder Ahnherr eines Ortes bezeichnen.
- source_word: שַׁעַף
  choice: Schaaf
  rationale: Der hebräische Personenname wird in einer im Deutschen gut lesbaren Transliteration wiedergegeben.
- source_word: מַדְמַנָּה
  choice: Madmanna
  rationale: Der Ortsname wird eng am hebräischen Konsonantenbestand transliteriert.
- source_word: שְׁוָא
  choice: Schewa
  rationale: Der Name wird nach der masoretischen Vokalisierung als Schewa wiedergegeben.
- source_word: מַכְבֵּנָה
  choice: Machbena
  rationale: Der Ortsname wird in deutscher Transliteration wiedergegeben.
- source_word: גִבְעָא
  choice: Gibea
  rationale: Der Ortsname wird in der geläufigen deutschen Form wiedergegeben.
- source_word: עַכְסָה
  choice: Achsa
  rationale: Der Personenname wird in der geläufigen deutschen Form wiedergegeben.
theological_decisions:
- issue: Genealogische oder ortsgründende Bedeutung von אֲבִי
  choice: Vater von
  alternative: Gründer von / Stammvater von
  rationale: Die formale Wiedergabe bewahrt die mögliche genealogische und sozial-geografische Bedeutung, ohne die Mehrdeutigkeit festzulegen.
- issue: Satzbezug der Schlussaussage über Achsa
  choice: 'Als eigenständige Aussage: „Kalebs Tochter war Achsa“'
  alternative: Engere syntaktische Verbindung mit der vorangehenden Aufzählung
  rationale: Der hebräische Nominalsatz kennzeichnet Achsa klar als Kalebs Tochter; eine eigenständige deutsche Aussage bildet dies natürlich ab.
translation_notes:
  register: 'Moderne, würdige Standardsprache mit enger Bindung an den hebräischen Satzbau. Die vom Englischen abweichende Aufnahme Madmannas folgt dem WLC: Der hebräische Text nennt Schaaf als Vater von Madmanna und Schewa als Vater von Machbena und Gibea.'
