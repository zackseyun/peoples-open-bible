  rationale: Preserve bonded position, authority, obligation and reward without changing reader terminology
    policy.
- source_word: σάρξ / πνεῦμα / προόν
  chosen: flesh / Spirit / preexistent
  alternatives:
  - body / spirit / existing before
  lexicon: Working Greek and direct printed edition comparison; no new lexicon lookup.
  rationale: Keep the source’s difficult flesh/Spirit assertions and anterior existence without importing
    a later doctrinal formula.
- source_word: κυριότητα / κοινωνόν
  chosen: lordship / partner
  alternatives:
  - dominion / sharer
  lexicon: Working source and bounded Latin comparison; no new lexicon lookup.
  rationale: Preserve actual authority and partnership language; do not erase the servant question or
    predetermine its theological resolution.
