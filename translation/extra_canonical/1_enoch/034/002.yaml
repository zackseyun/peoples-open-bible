translation:
  text: There I saw three gates of heaven open in heaven. From each one of them north winds come out, blowing cold,
    hail, frost, snow, dew and rain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The repeated winter-weather words overlap in meaning rather than marking perfectly separate modern meteorological
      categories. Dillmann1865 column331 includes snow, frost, hail and ice among the senses ofአስሐትያ; column79 gives
      frost/snow forሐመዳ and quotes this verse’s list. Frost may therefore also be understood as ice here. The selected
      numeral is፩, one, not the prior OCR፪; the same-edition ordinary one comparand was inspected.
    reason: lexical_alternative
