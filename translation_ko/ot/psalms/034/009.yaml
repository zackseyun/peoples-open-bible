translation:
  language: ko
  text: 야훼의 거룩한 이들이여, 야훼를 경외하십시오. 그를 경외하는 이들에게는 부족함이 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַעֲמוּ
  english_pob_choice: Taste
  chosen_korean: 맛보아 알지어다
  alternatives_korean:
  - 맛보십시오
  - 맛보아 보십시오
  - 경험해 보아 알지어다
  lexicon: HALOT
  rationale: 히브리어 명령형의 감각적 이미지를 살리기 위해 ‘맛보아’를 유지하고, 뒤의 ‘see’와 평행을 이루도록 ‘알지어다’를 덧붙여 경험적 인식을 자연스럽게 드러냈습니다.
- source_word: וּרְאוּ
  english_pob_choice: and see
  chosen_korean: 알지어다
  alternatives_korean:
  - 그리고 보십시오
  - 보고 알지어다
  - 그리고 깨달으십시오
  lexicon: HALOT
  rationale: ‘보고’보다 결과를 강조하는 ‘알지어다’가 시적 병행에서 ‘taste and see’의 인식적 결론을 더 간결하게 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름을 일반 호칭으로 바꾸지 않고, 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겼습니다.
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 좋으심
  alternatives_korean:
  - 선하심
  - 좋습니다
  - 선하십니다
  lexicon: HALOT
  rationale: 하나님의 성품을 서술하는 형용사를 한국어에서 자연스럽게 신격적 의미로 풀어 ‘좋으심’으로 옮겼습니다. 문장 안에서는 주어 서술의 완결성을 위해 명사화가 가장 적합합니다.
- source_word: הַגֶּבֶר
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 자
  - 그 사람은
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 형식을 보존하되, 시편의 대표적 일반화 기능을 한국어에서 더 자연스럽게 드러내기 위해 문맥상 포괄적인 ‘그 사람’을 택했습니다. 이는 성별을 지우는 번역이 아니라 대표성의 기능을 살린 선택입니다.
- source_word: יֶחֱסֶה בּוֹ
  english_pob_choice: takes refuge in him
  chosen_korean: 그에게 피하는
  alternatives_korean:
  - 그에게 피신하는
  - 그 안에 피하는
  - 그에게 피하는 자
  lexicon: HALOT
  rationale: חסה의 보호-피난 이미지를 살려 ‘피하다’ 계열로 옮겼고, ‘그에게’로 목적어를 명시해 히브리어의 대상을 분명히 했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה를 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 하나님의 이름을 사용하므로, 전통적 대체 칭호인 ‘주’로 완화하지 않고 고유명사 ‘야훼’를 유지했습니다. 이는 독자가 언약의 이름 자체를 인식하도록 돕습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
