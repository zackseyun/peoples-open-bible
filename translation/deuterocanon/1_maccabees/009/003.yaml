translation:
  text: And in the first month of the one hundred and fifty-second year[a], they encamped in Jerusalem.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The first month was Nisan (March–April), and the year is reckoned by the Seleucid era, placing this in 160 BC.
