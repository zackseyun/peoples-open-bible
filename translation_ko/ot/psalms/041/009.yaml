  source_fidelity: 현재 초안은 시편 41:9가 아니라 앞 구절(시 41:8)의 히브리어 어휘와 내용을 번역하고 있습니다. WLC 본문은 ‘나의 평화의 사람/내가 신뢰한 이/내 빵을 먹는 이/나를 향해 발꿈치를 크게 하였다’라는 배신의 진술입니다. 이를 원문의 관계적 표현과 발꿈치 관용어를 보존하여 옮겨야 합니다.
  naturalness: ‘나와 평화롭게 지내던 사람’과 ‘내가 신뢰하던 이’는 현대 표준 한국어에서 자연스럽고, 시편의 격조에도 맞습니다. ‘자기 발꿈치를 나를 향해 높이 들었습니다’는 다소 낯선 원문 이미지를 유지하므로 각주로 관용적 의미를 설명하는 것이 적절합니다.
  terminology: אִישׁ שְׁלוֹמִי는 단순히 일반적 ‘친구’보다 평화와 신뢰의 관계에 있던 가까운 사람을 뜻하므로 ‘나와 평화롭게 지내던 사람’으로 번역했습니다. לַחְמִי는 ‘내 빵’을 유지하며, הִגְדִּיל עָקֵב는 해석적으로 ‘배신했습니다’로 본문에서 평탄화하지 않고 발꿈치 이미지를 보존했습니다.
