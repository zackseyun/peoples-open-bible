  text: Ἰωνᾶς Νινευίταις καταστροφὴν ἐκήρυξεν· οἱ δὲ μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν ἐξιλάσαντο τὸν θεὸν ἱκετεύσαντες καὶ ἔλαβον σωτηρίαν, καίπερ ἀλλότριοι τοῦ θεοῦ ὄντες.
  language: Greek
base_translation:
  language: en
  edition: POB
  yaml_path: translation/extra_canonical/1_clement/007/007.yaml
  text: Jonah proclaimed destruction to the Ninevites; but they[a], having repented of their sins, made atonement to God by their supplication and received salvation, though they were strangers to God.
  footnotes:
  - marker: a
    text: Or 'made atonement before God'.
    reason: previous_rendering
  revision_pass:
    model: gpt-5.4
    timestamp: '2026-04-23T11:33:40Z'
    unchanged: false
    changes_summary: Updated 'Yonah' to the standard English form 'Jonah'; rendered the participles more closely with 'having repented' and 'by their supplication'; replaced 'appeased God' with 'made atonement to God' to reflect ἐξιλάσαντο more accurately while keeping formal register.
translation:
  language: en
  text: Jonah announced to the people of Nineveh that destruction was coming. But they reoriented[a] away from their sins and pleaded with God. In this way they made atonement to him and were saved, even though they were strangers to God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: Jonah proclaimed destruction to the Ninevites
  simplified_phrase: Jonah announced to the people of Nineveh that destruction was coming
  preserved_meaning: Jonah publicly warned Nineveh of impending destruction.
  reasoning_layer_used: source syntax and POB translation
  rationale: The recast sentence makes the warning natural in modern English without specifying details the source leaves unstated.
- pob_phrase: received salvation
  simplified_phrase: were saved
  preserved_meaning: They were delivered from the announced destruction.
  reasoning_layer_used: immediate context and POB translation
  rationale: The active biblical expression is replaced with its common direct equivalent.
translation_notes:
  risk_flags:
  - risk: “Made atonement to him” may remain unfamiliar to some readers.
    mitigation: It is retained because replacing it with “appeased” or “made peace” could weaken the POB’s audited lexical choice.
  - risk: “Destruction was coming” does not identify precisely what would be destroyed.
    mitigation: The source itself leaves the object implicit, so the wording preserves that breadth.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
