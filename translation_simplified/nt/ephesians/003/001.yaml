  preserved_meaning: Paul connects this statement to his preceding argument.
  reasoning_layer_used: Lexical decision for Τούτου χάριν
  rationale: The common phrase keeps the same backward-looking connection.
- pob_phrase: the prisoner of Messiah Jesus
  simplified_phrase: Messiah Jesus’ prisoner
  preserved_meaning: Paul identifies himself as a prisoner who belongs to Messiah Jesus without narrowing the relationship to service.
  reasoning_layer_used: Lexical rationale for ὁ δέσμιος and τοῦ Χριστοῦ Ἰησοῦ
  rationale: The natural possessive preserves the broad force of the Greek genitive.
- pob_phrase: on behalf of you Gentiles
  simplified_phrase: for your sake—you Gentiles
  preserved_meaning: Paul’s imprisonment is for the Gentiles’ benefit.
  reasoning_layer_used: Lexical decision for ὑπὲρ ὑμῶν τῶν ἐθνῶν
  rationale: Direct address makes the benefactive meaning clear in natural English.
