  to: 그러자 모세가 하나님께 말했습니다. “보십시오, 제가 이스라엘 자손에게 가서 ‘여러분의 조상의 하나님께서 저를 여러분에게 보내셨습니다’라고 말하면, 그들이 제게 ‘그분의 이름이 무엇입니까?’라고 하면, 제가 그들에게 무엇이라고 말해야 합니까?”
  rationale: 원문의 가정적 문장 전개를 더 직접적으로 반영하도록 ‘할 터인데’를 ‘하면’으로 고쳤고, 하나님을 가리키는 대명사를 현대 한국어 존칭 관습에 맞게 조정했습니다. 그 밖의 어휘와 문장 구조는 유지했습니다.
