source:
  edition: WLC
  text: מָ֭צָאתִי דָּוִ֣ד עַבְדִּ֑/י בְּ/שֶׁ֖מֶן קָדְשִׁ֣/י מְשַׁחְתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/021.yaml
  text: My hand will be steadfast with him; indeed[a], my arm will strengthen him.
  footnotes:
  - marker: a
    text: Or, 'I found David my servant; with my holy oil I anointed him.' The Hebrew perfects can be rendered as simple pasts in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 손이 그와 함께 굳게 설 것이며, 또한 내 팔이 그를 강하게 할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי
  english_pob_choice: I have found
  chosen_korean: 나는 ... 찾았으며
  alternatives_korean:
  - 나는 ... 찾았습니다
  lexicon: HALOT
  rationale: 완료된 행위를 나타내는 עבר형을 한국어에서 현재완료형으로 고정하기보다, 시적 선언의 단정성과 진행 감각을 살려 자연스러운 합쇼체 과거형으로 옮겼습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 종자
  - 내 노예
  lexicon: HALOT
  rationale: 여기서는 다윗에 대한 언약적·왕권적 호칭이므로, 문맥상 자연스러운 '종'을 택했고, '노예'는 본문의 존칭적 용법을 지나치게 약화할 수 있어 배제했습니다.
- source_word: בְּשֶׁמֶן קָדְשִׁי
  english_pob_choice: with my holy oil
  chosen_korean: 내 거룩한 기름으로
  alternatives_korean:
  - 내 성스러운 기름으로
  - 내 거룩한 기름과 함께
  lexicon: HALOT
  rationale: ב + 기름은 기름 '으로'라는 수단 표현이 가장 자연스럽고, קָדְשִׁי는 '거룩한'으로 옮겨 예배적·성별된 성격을 유지했습니다.
- source_word: מְשַׁחְתִּיו
  english_pob_choice: I have anointed him
  chosen_korean: 그에게 기름을 부었습니다
  alternatives_korean:
  - 그를 기름부었습니다
  - 그에게 부었습니다
  lexicon: HALOT
  rationale: משח의 관용적 의미를 한국어 동사구 '기름을 붓다'로 풀어, 왕적 위임 행위를 분명히 드러냈습니다.
theological_decisions:
- issue: 다윗에 대한 기름부음과 메시아적 함의
  chosen_reading: 본문은 우선적으로 다윗 개인의 선택과 기름부음을 말하므로, 번역문에는 '메시아'를 삽입하지 않았습니다.
  alternative_readings:
  - 다윗을 통한 메시아 예표를 번역문에 직접 드러내는 해석적 표현
  rationale: 시편의 더 넓은 신학적 연결은 유지하되, 이 절 자체가 말하지 않는 명시적 칭호를 앞당겨 넣지 않는 것이 원문 충실도에 맞습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 것 이상을 주입하지 말고, 본문이 지닌 신학적 긴장은 별도로 보존한다.'
