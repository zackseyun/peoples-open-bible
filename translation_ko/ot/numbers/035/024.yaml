lexical_decisions:
- source_word: הָֽ/עֵדָ֔ה
  english_pob_choice: the congregation
  chosen_korean: 회중
  alternatives_korean: 회당, 백성
  lexicon: WLC
  rationale: Hebrew 'edah' refers to the assembled community of Israel, best rendered as '회중' in a legal context.
- source_word: גֹּאֵ֣ל הַ/דָּ֑ם
  english_pob_choice: avenger of blood
  chosen_korean: 피의 대속자
  alternatives_korean: 피의 친족, 피를 갚는 자
  lexicon: WLC
  rationale: '''Goel'' implies a kinsman-redeemer role; ''대속자'' captures the legal and familial duty to avenge blood.'
- source_word: הַ/מִּשְׁפָּטִ֖ים
  english_pob_choice: ordinances
  chosen_korean: 법도들
  alternatives_korean: 판결들, 법규
  lexicon: WLC
  rationale: Plural 'mishpatim' refers to established legal statutes or ordinances, not just individual judgments.
theological_decisions:
- decision: Use of '회중' for 'edah'
  rationale: Emphasizes the communal responsibility in administering justice, aligning with the covenantal nature of the text.
- decision: Use of '피의 대속자' for 'Goel ha-dam'
  rationale: Preserves the theological concept of the kinsman-redeemer's specific duty in blood guilt cases.
