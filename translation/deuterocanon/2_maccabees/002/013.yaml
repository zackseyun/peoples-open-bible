  text: ὡς δὲ ἐγένετο καὶ χρόνος διῆλθεν ὅ τε ἥλιος ἀνέλαμψεν ἐπινεφὴς ὤν, ἀνήφθη πυρὰ μεγάλη, ὥστε θαυμάσαι πάντας.
