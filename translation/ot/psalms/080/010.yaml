id: PSA.80.10
reference: Psalms 80:10
source:
  edition: WLC
  text: כָּסּ֣וּ הָרִ֣ים צִלָּ֑/הּ וַ֝/עֲנָפֶ֗י/הָ אַֽרְזֵי אֵֽל־׃
translation:
  text: Its shade covered the mountains, and its branches covered the mighty cedars[a][b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the cedars of God.”
    reason: lexical_alternative
  - marker: b
    text: Or, “its branches were like the mighty cedars.”
    reason: alternative_reading
lexical_decisions:
- source_word: כָּסּוּ
  chosen: covered
  alternatives:
  - covered
  - were covered
  lexicon: HALOT
  rationale: 'The verb governs both parallel cola: the vine''s shade covered the mountains and its branches the cedars.'
- source_word: הָרִים
  chosen: the mountains
  alternatives:
  - mountains
  lexicon: HALOT
  rationale: Straightforward plural noun meaning 'mountains'; the article is naturally represented in English.
- source_word: צִלָּהּ
  chosen: its shade
  alternatives:
  - its shadow
  lexicon: HALOT
  rationale: צל commonly denotes shade or shadow. 'Shade' fits the vineyard/vine imagery better in English, suggesting spreading protective cover rather than merely darkness.
- source_word: וַעֲנָפֶיהָ
  chosen: and its branches
  alternatives:
  - and its boughs
  lexicon: HALOT
  rationale: The branches parallel the shade as the means by which the huge vine covers the cedars.
- source_word: אַרְזֵי אֵל
  chosen: the cedars of God
  alternatives:
  - mighty cedars
  - cedars of God
  lexicon: HALOT
  rationale: The construct phrase can function as a superlative ('mighty cedars') or as a more literal genitival expression ('cedars of God'). Because the Hebrew explicitly says 'of God/El,' the main text preserves that wording for transparency, while the idiomatic superlative sense is worth noting in a footnote.
