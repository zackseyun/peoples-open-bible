base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/087/001.yaml
  text: and in my prayer. And you also have learned from them the commandments of this letter, and you will be subdued in excellence, the nations for the promise, and you will be loved, and you will be comforted, lest you fall and be tormented.
translation:
  language: pt
  text: e em minha oração. Vocês também aprenderam deles os mandamentos desta carta; e serão submetidos na excelência — os povos, para a promessa[a] —, serão amados e serão consolados, para que não venham a cair e a ser atormentados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto siríaco desta cláusula é obscuro e talvez esteja corrompido. Literalmente, traz algo próximo de “sereis submetidos na excelência, os povos para a promessa”. Algumas reconstruções propõem uma frase mais fluente, como “sereis fortalecidos na excelência para governar as nações”, mas isso exige alterar a redação transmitida.
    reason: A sintaxe da cláusula é anômala, e as propostas de emenda mudam substantivos e verbos importantes; a nota conserva a incerteza textual.
lexical_decisions:
- source_word: ܒܒܥܘܬܝ
  choice: em minha oração
  rationale: O substantivo pode indicar oração, petição ou súplica. “Oração” é natural e abrangente, sem ampliar a frase para uma doutrina formal de intercessão.
- source_word: ܝܠܦܬܘܢ
  choice: aprendestes
  rationale: A forma verbal expressa aprender ou receber instrução. O perfeito português preserva a leitura de ação já realizada, adotada no texto de consulta.
- source_word: ܡܢܗܘܢ
  choice: deles
  rationale: O pronome plural tem antecedente incerto no trecho sobreposto. “Deles” mantém essa referência aberta, sem substituí-la interpretativamente por “destas coisas”.
- source_word: ܦܘ̈ܩܕܢܐ
  choice: os mandamentos
  rationale: O termo designa ordens ou preceitos dotados de autoridade; “mandamentos” conserva o teor exortativo e pactual.
- source_word: ܘܬܬܟܦܘܢ
  choice: e sereis submetidos
  rationale: A forma, tal como transmitida no texto fornecido, aponta para ser dobrado, constrangido ou submetido. Evita-se a conjectura “sereis fortalecidos”, embora ela produza uma frase mais fluente.
- source_word: ܠܡܘܠܟܢܐ
  choice: para a promessa
  rationale: ܡܘܠܟܢܐ significa “promessa”. A tradução não o confunde com a raiz ligada a reinar ou governar.
- source_word: ܘܬܬܪܚܡܘܢ / ܘܬܬܢܚܡܘܢ
  choice: sereis amados e sereis consolados
  rationale: Os passivos mantêm a sequência futura do siríaco e deixam o agente implícito, como no texto-fonte.
- source_word: ܕܠܡܐ
  choice: para que não
  rationale: A expressão introduz prevenção ou receio. “Para que não” comunica naturalmente a advertência final em português.
theological_decisions:
- issue: Se a lembrança de Baruc na oração deve ser explicitada como intercessão formal
  choice: Manter apenas “em minha oração”
  alternative: “em minha intercessão por vós”
  rationale: O siríaco menciona a oração, mas não desenvolve sua natureza nem autoriza explicitar uma doutrina de intercessão.
- issue: Se o agente de “sereis amados” e “sereis consolados” deve ser identificado como Deus
  choice: Deixar o agente implícito
  alternative: “Deus vos amará e vos consolará”
  rationale: As formas passivas não nomeiam o agente. Identificá-lo resolveria uma ambiguidade genuína do texto.
- issue: Se a cláusula textual obscura deve ser corrigida para uma leitura teologicamente ou retoricamente mais coerente
  choice: Traduzir de modo formal e sinalizar a dificuldade em nota
  alternative: Adotar uma conjectura como “sereis fortalecidos na excelência para governar as nações”
  rationale: A conjectura altera palavras decisivas do siríaco fornecido, sobretudo “submetidos” e “promessa”. A nota preserva a tensão textual sem apresentar uma reconstrução incerta como texto seguro.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas verbais na segunda pessoa do plural para acompanhar o tom epistolar solene. A cláusula central permanece deliberadamente áspera por causa da dificuldade real do siríaco, explicada em nota, em vez de ser harmonizada por conjectura silenciosa.
