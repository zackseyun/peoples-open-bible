id: PSA.119.78
reference: Psalms 119:78
source:
  edition: WLC
  text: יֵבֹ֣שׁוּ זֵ֭דִים כִּי שֶׁ֣קֶר עִוְּת֑וּ/נִי אֲ֝נִ֗י אָשִׂ֥יחַ בְּ/פִקּוּדֶֽי/ךָ־׃
translation:
  text: Let the arrogant be put to shame, for they have wronged me through deceit[a]; but I will meditate on your precepts.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “they have wronged me without cause.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפִקּוּדֶֽיךָ
  chosen: precepts
  alternatives:
  - orders
  - charges
  lexicon: HALOT
  rationale: פִּקּוּדִים are the specific charges God appoints. 'Precepts' keeps this term distinct from statutes and commandments.
- source_word: שֶׁקֶר עִוְּתוּנִי
  chosen: they have wronged me falsely
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This represents the completed verbal action and the Hebrew's broad falsehood characterization without restricting it to spoken lies.
