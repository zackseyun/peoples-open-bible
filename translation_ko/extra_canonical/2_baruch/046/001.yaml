  - severity: low
    issue: ‘너무 갑자기’의 강도 표현
    rationale: 의미상 틀리지는 않지만, ‘그토록 갑자기’는 앞선 ‘그토록 낮추시어’와 호응하면서 수사적 질문의 강조를 더 자연스럽게 재현합니다.
