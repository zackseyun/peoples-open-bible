  to: 주님께서는 그에게 주님의 손으로 만드신 것들을 다스리게 하셨으며, 모든 것을 그의 발 아래 두셨습니다.[a]
  rationale: 원문 תַּמְשִׁילֵהוּ בְּמַעֲשֵׂי יָדֶיךָ를 ‘그에게 주님의 손으로 만드신 것들을 다스리게 하셨으며’로 옮겨 사역형 ‘다스리게 하다’와 ‘주님의 손으로 만드신 것들’의 이미지를 보존했습니다. כֹּל שַׁתָּה תַחַת רַגְלָיו는 ‘모든 것을 그의 발 아래 두셨습니다’로 직역적 이미지와 지배의 함의를 유지했습니다. 기존 각주는 다른 절의 쟁점이므로 삭제하고, 이 절에 해당하는 대표적 단수 표현 설명 각주로 교체했습니다.
