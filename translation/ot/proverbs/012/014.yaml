  chosen_reading: Rendered as singular generic 'a man' in both cola
  alternative_readings:
  - a person
  - one
  - human
  rationale: The Hebrew uses grammatically masculine singular terms representatively. Per the doctrine's gender-accurate policy, the translation preserves this with 'a man' rather than neutralizing to 'person,' while the proverb's applicability to humanity generally can be clarified in a footnote.
