  text: בֵּֽ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/012.yaml
  text: I am bound by vows to you, O God[a]; I will render thank offerings to you[b].
  footnotes:
  - marker: a
    text: Or 'What can a human do to me?' The Hebrew has singular אָדָם ('man'), used here representatively for a human being.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님, 주께 드린 서원들이 제게 지워져 있습니다[a]. 제가 주께 감사 제물을 드리겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주의 서원들이 내게 있습니다.’ 문맥상 하나님께 드린 화자의 서원들, 곧 그가 이행해야 할 서원을 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘감사’를 뜻할 수 있습니다. 히브리어는 감사의 표현을 가리킬 수도 있고 감사 제물을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  english_pob_choice: In God
  chosen_korean: 하나님 안에서
  alternatives_korean:
  - 하나님께
  - 하나님으로 말미암아
  lexicon: HALOT
  rationale: 신뢰의 대상을 나타내는 전치사 ב는 이 문맥에서 ‘안에서/안에’의 영역적 용법이 자연스럽고, 신뢰 সূত্র을 한국어로도 직접적으로 살리기 위해 ‘하나님 안에서’로 옮겼습니다.
- source_word: בָּטַחְתִּי
  english_pob_choice: I have trusted
  chosen_korean: 내가 신뢰하였으니
  alternatives_korean:
  - 내가 신뢰합니다
  - 나는 신뢰해 왔습니다
  lexicon: HALOT
  rationale: 완료형의 settled trust를 한국어 과거형 ‘신뢰하였으니’로 반영해, 이미 굳게 정착된 신뢰가 뒤의 두려움 부정과 인과적으로 연결됨을 드러냈습니다.
- source_word: לֹא אִירָא
  english_pob_choice: I will not fear
  chosen_korean: 두려워하지 않겠습니다
  alternatives_korean:
  - 두려워하지 않습니다
  - 무서워하지 않겠습니다
  lexicon: HALOT
  rationale: 부정된 미완료형의 결의/미래 뉘앙스를 한국어 미래형으로 살리되, 시편의 고백체에 맞게 ‘두려워하지 않겠습니다’로 자연스럽게 표현했습니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 인간이
  - 인간이
  lexicon: HALOT
  rationale: 히브리어 단수 אָדָם의 대표적 인간 일반을 한국어에서 남성성보다 인간성을 드러내는 ‘사람’으로 옮겨, 문맥의 대조—하나님 대 인간—를 보존했습니다.
theological_decisions:
- issue: 대표적 단수 אָדָם의 한국어 처리
  chosen_reading: 사람이
  alternative_readings:
  - 인간이
  - 한 사람이
  rationale: 이 절은 하나님에 대한 신뢰와 인간의 무력함을 대조하는 수사적 질문이므로, 단수형을 유지하면서도 대표성을 띠는 ‘사람’이 원문 의도를 가장 자연스럽게 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: gender-accurate over gender-neutral; representative singular'
- issue: 1인칭 고백의 종결 형식
  chosen_reading: 두려워하지 않겠습니다
  alternative_readings:
  - 두려워하지 않습니다
  rationale: 시편의 신뢰 고백은 단순 진술보다 결의의 성격이 강하므로, 미래/의지적 표현을 택해 원문의 확언적 힘을 살렸습니다.
  doctrine_reference: WLC aspect in trust/confidence formula
