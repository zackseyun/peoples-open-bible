id: ISA.53.11
reference: Isaiah 53:11
source:
  edition: POB-critical
  language: Hebrew
  text: מעמל נפשו יראה אור ישבע בדעתו יצדיק צדיק עבדי לרבים ועונתם הוא יסבל׃
  note: Provisional editorial composite, not a transcription of one manuscript or a recovered autograph. The unpointed text retains the declared base except for the recorded changes; interpretive vocalization outside those changes follows the base.
  apparatus:
  - witness: WLC, Isaiah 53:11
    reading: יראה ישבע
    note: Retained shorter Hebrew alternative; exact pointed base is preserved in restoration_draft.baseline.source.
  - witness: 1QIsaᵃ 44:19, published transcription 2026-05-21
    reading: יראה אור וישבע
    note: Complete word אור; its extra conjunction before the following verb is not adopted.
  - witness: 1Q8 = 1QIsaᵇ 23:22, published transcription 2026-05-21
    reading: יראה אור יש[בע]
    note: Complete word אור; end of following verb supplied.
  - witness: 4Q58 = 4QIsaᵈ 8:20, published transcription 2026-05-21
    reading: יראה או֯[ר ]ושבע֯
    note: 'Partial support only: vav of light uncertain, resh supplied; following verb differs.'
  - witness: Rahlfs-labeled Greek digital control, Isa 53:11
    reading: δεῖξαι αὐτῷ φῶς
    note: To show him light; versional support, not the same syntax or a unique Hebrew retroversion.
translation:
  text: From the anguish of his soul he will see light[a] and be satisfied; by his knowledge[b] my righteous servant will justify many, and he will bear their iniquities.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The draft includes 'light,' preserved in published transcriptions of 1QIsaᵃ and 1QIsaᵇ, with partial support from 4QIsaᵈ. The Masoretic Text lacks this word. The Greek reads 'to show him light.' The earlier Hebrew wording remains uncertain.
  - marker: b
    reason: alternative_reading
    text: Or 'by knowledge of him,' taking the phrase to refer to others coming to know the servant rather than to the servant's own knowledge.
lexical_decisions:
- source_word: מֵעֲמַל
  chosen: From the anguish
  alternatives:
  - From the labor
  - From the toil
  - Out of the suffering
  lexicon: HALOT
  rationale: עָמָל can denote toil, trouble, misery, or suffering. In this servant-song context, the sense is not mere work but painful affliction. 'Anguish' captures the experiential suffering while preserving the concrete force of the noun. The prefixed מִן is rendered 'From' to preserve the Hebrew construction rather than smoothing it away.
- source_word: נַפְשׁוֹ
  chosen: of his soul
  alternatives:
  - of himself
  - of his life
  lexicon: HALOT
  rationale: נֶפֶשׁ often refers to the whole self or life, but 'soul' remains a transparent and theologically weighty rendering here, especially in a context of deep inner suffering. It also preserves the Hebrew idiom 'anguish of his soul' without over-paraphrase.
- source_word: יִרְאֶה
  chosen: he will see
  alternatives:
  - he will look upon
  lexicon: HALOT
  rationale: The verb remains 'he will see'; the object 'light' follows from the separate provisional source selection, not from the verb's lexical meaning. See the אור entry and source apparatus. No new lexicon consultation is claimed.
- source_word: אור
  chosen: light
  alternatives:
  - light of life
  rationale: Render the attested added noun as 'light.' 'Light of life' explains a possible idiom but adds an unstated specification; it is not the selected wording. Neither the noun nor this rendering alone proves resurrection or identifies the servant. Source priority remains provisional.
- source_word: יִשְׂבָּע
  chosen: be satisfied
  alternatives:
  - be content
  - be filled
  lexicon: HALOT
  rationale: The verb means to be satisfied or sated. 'Be satisfied' is idiomatic English and preserves the resultative sense following 'he will see.'
- source_word: בְּדַעְתּוֹ
  chosen: by his knowledge
  alternatives:
  - by knowledge of him
  - through his knowing
  lexicon: HALOT
  rationale: Retain 'by his knowledge' as a defensible reading, with 'by knowledge of him' at the phrase's own note anchor. The suffix alone does not settle subjective versus objective interpretation. Retaining the existing clause division is not a new adjudication of all possible attachments.
- source_word: יַצְדִּיק
  chosen: will justify
  alternatives:
  - will declare righteous
  - will make righteous
  lexicon: HALOT
  rationale: In the Hiphil, צדק commonly means to declare or treat as righteous, hence 'justify.' This is the most concise and theologically established English equivalent, while not forcing the mechanism beyond the Hebrew.
- source_word: צַדִּיק עַבְדִּי
  lemma: צַדִּיק
  chosen: my righteous servant
  alternatives:
  - my servant, the righteous one
  - the righteous one, my servant
  lexicon: HALOT
  rationale: The adjective צַדִּיק is taken attributively with 'my servant.' 'My righteous servant' is the most natural English order and preserves both descriptors.
- source_word: לָרַבִּים
  chosen: many
  alternatives:
  - the many
  - for many
  lexicon: HALOT
  rationale: רַבִּים means 'many' or 'the many.' English normally omits the article here. The phrase is not weakened to 'all,' since the Hebrew specifically says 'many.'
- source_word: וַעֲוֺנֹתָם
  chosen: their iniquities
  alternatives:
  - their sins
  - their guilt
  lexicon: HALOT
  rationale: עָוֺן carries the sense of iniquity/guilt, not merely generic sin. 'Iniquities' preserves the moral weight and aligns with the servant's bearing of culpability.
- source_word: הוּא
  chosen: he
  alternatives:
  - he himself
  - he indeed
  lexicon: HALOT
  rationale: Retain the current main-text 'he.' The independent pronoun is explicit in Hebrew and permits 'he himself' to express emphasis; the earlier lexical choice claimed that wording although it was absent from the sentence. This candidate does not add a second main-English change beyond light.
- source_word: יִסְבֹּל
  chosen: will bear
  alternatives:
  - will carry
  - will endure
  lexicon: HALOT
  rationale: The verb can mean bear/carry/endure. In parallel with iniquities, 'will bear' best conveys vicarious burden-bearing and matches the immediate object.
