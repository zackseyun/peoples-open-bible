translation:
  text: They devoured all the fruit of human labor, until people were unable to feed them.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literally, “all the toil of humanity”; in context, this means what human labor produced.
    reason: lexical_alternative
  - marker: b
    text: The selected Charles printing marks the connective rendered “until” with daggers and discusses its corruption in
      the apparatus. This draft retains the connective without reconstructing an alternative Greek sentence.
    reason: textual_variant
lexical_decisions:
- source_word: እለ፡ በልዑ
  chosen: They devoured
  alternatives:
  - those who ate
  - they consumed
  rationale: The clause begins with a relative form, literally resembling “those who ate,” but in context it continues the
    description of the preceding beings. “They” supplies natural English continuity, while “devoured” conveys voracious consumption
    without adding imagery absent from the verb.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ኵሎ፡ ጻማ፡ ሰብእ
  chosen: all the fruit of human labor
  alternatives:
  - all human labor
  - all the toil of people
  - everything people had worked for
  rationale: ጻማ denotes toil, labor, or what labor produces. Since something is being eaten, the contextual sense is the produce
    or yield obtained through human labor. “Fruit of human labor” preserves both the labor sense and the concrete consumable
    result without reducing it merely to food.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: እስከ
  chosen: until
  alternatives:
  - so that eventually
  - to the point that
  rationale: The term marks the resulting limit reached by the continued consumption. The direct temporal-resultative “until”
    closely follows the Ge'ez.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ስእኑዎሙ፡ ሰብእ፡ ሴስዮቶ
  chosen: people were unable to feed them
  alternatives:
  - human beings could no longer sustain them
  - people lacked the means to provide food for them
  rationale: The construction expresses inability, with the following infinitive referring to feeding or nourishing them.
    “Were unable to feed them” is direct and preserves the personal object; it does not introduce the stronger temporal adverb
    “longer,” which is only implicit in the progression.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
theological_decisions:
- issue: The consuming beings’ exploitation of humanity
  chosen_reading: The verse depicts the beings as consuming the produce of human labor until humanity cannot feed them.
  alternative_readings:
  - The verse says only that they consumed human toil itself in a figurative sense.
  rationale: The eating verb and the following inability to feed them favor understanding ጻማ as the yield of labor. This preserves
    the escalating violence of the Watchers narrative without importing later demonological explanations.
