  lexicon: HALOT
  rationale: 본문이 불확실한 곡조/표제 구절이므로 해석을 확정하지 않고 제목처럼 따옴표로 처리했으며, אֵלֶם의 ‘잠잠함’과 רְחֹקִים의 ‘멀리 있는 곳들’을 반영했습니다.
- source_word: מִכְתָּם
  english_pob_choice: A miktam
  chosen_korean: 믹담
  alternatives_korean:
  - 미크담
  - 시편 표제의 기술어
  lexicon: HALOT
  rationale: 정확한 뜻이 불확실한 전문 용어이므로, 추정 번역보다 음역을 택해 문학적·전승적 표지로 남겼습니다.
- source_word: פְלִשְׁתִּים בְּגַת
  english_pob_choice: the Philistines seized him in Gath
  chosen_korean: 블레셋 사람들이 그를 가드에서 붙잡았을 때
  alternatives_korean:
  - 블레셋 사람들이 가드에서 그를 사로잡았을 때
  - 블레셋 사람들이 그를 가드에서 붙들었을 때
  lexicon: HALOT
  rationale: 블레셋은 통상적인 고유 민족명으로 옮겼고, בְּגַת는 장소 부사구로 ‘가드에서’가 자연스럽습니다.
theological_decisions:
- issue: 시편 표제의 본문 포함 여부
  chosen_reading: 표제를 본문 일부로 번역해 음악적 지시와 역사적 상황을 함께 보존했습니다.
  alternative_readings:
  - 표제를 주석으로 돌리기
  - 의미를 단정해 의역하기
  rationale: 히브리어 본문이 이 구절을 정식 표제로 제시하므로, 확정 불가한 용어만 과잉 해석하지 않고 본문 그대로 반영하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
