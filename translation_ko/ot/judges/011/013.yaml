  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: ko
  text: 암몬 자손의 왕이 입다의 사자들에게 말했습니다. “이스라엘이 이집트에서 올라올 때, 아르논에서 야복까지, 또 요단까지 이르는 내 땅을 빼앗았으니, 이제 그 땅들을 평화롭게 돌려주십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: Because
  chosen_korean: “...빼앗았으니”로 원인절을 앞의 말에 붙여 번역했습니다.
  alternatives_korean:
  - “왜냐하면...이기 때문입니다”
  - “...했기 때문에”
  lexicon: כִּי
  rationale: POB가 문맥상 원인 제시로 읽은 것을 따라, 앞문장에 종속된 이유를 자연스럽게 한국어로 연결했습니다.
- source_word: אַרְצִי
  english_pob_choice: my land
  chosen_korean: “내가 가진 땅”
  alternatives_korean:
  - “내 땅”
  - “내가 차지한 땅”
  lexicon: ארץ
  rationale: 직역의 소유격을 살리되, 한국어에서 ‘내 땅’보다 조금 더 분쟁 맥락이 드러나는 표현으로 옮겼습니다.
- source_word: הָשִׁיבָה ... בְּשָׁלוֹם
  english_pob_choice: restore them peacefully
  chosen_korean: “평화롭게 돌려주십시오”
  alternatives_korean:
  - “평강으로 돌려주십시오”
  - “평화 가운데 반환하십시오”
  lexicon: שׁוב + שָׁלוֹם
  rationale: 동사의 회복/반환 의미를 살리면서, POB의 peacefully를 한국어 관용에 맞게 ‘평화롭게’로 옮겼습니다.
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: “이집트”
  alternatives_korean:
  - “애굽”
  lexicon: מִצְרַיִם
  rationale: 표준 현대 한국어 음역을 택해 지리명으로 읽히게 했습니다.
theological_decisions:
- issue: 암몬 왕의 주장 문장과 화자의 입장 구분
  chosen_reading: 본문은 암몬 왕의 주장 자체를 직접 인용하며, 번역도 그 주장으로서 객관적으로 제시했습니다.
  alternative_readings:
  - 해설적으로 ‘그가 주장하기를’로 완화하는 번역
  rationale: 이 절은 내러티브가 왕의 논지를 그대로 전달하므로, 화자-인용 구조를 보존하는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 서사 문맥 보존
