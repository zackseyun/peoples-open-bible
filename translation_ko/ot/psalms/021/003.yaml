  to: 주께서는 좋은 복으로 그를 맞이하시며, 그의 머리에 순금 왕관을 씌우십니다.[a][b]
  rationale: 대상 히브리어 본문을 직접 반영하여, 하나님께서 왕을 좋은 복으로 먼저 맞이하시고 그의 머리에 고급 금의 왕관을 두신다는 두 병행 진술로 번역했습니다. ‘좋은 복’은 ברכות טוב의 폭넓은 의미를 유지하며, ‘맞이하시며’에는 קדם의 선행·예방적 뉘앙스를 각주로 보완했습니다. 기존의 시 21:2 관련 본문과 각주는 삭제했습니다.
