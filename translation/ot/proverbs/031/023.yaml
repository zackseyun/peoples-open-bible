id: PRO.31.23
reference: Proverbs 31:23
source:
  edition: WLC
  text: נוֹדָ֣ע בַּ/שְּׁעָרִ֣ים בַּעְלָ֑/הּ בְּ֝/שִׁבְתּ֗/וֹ עִם זִקְנֵי אָֽרֶץ־־׃
translation:
  text: Her husband is known at the city gates[a] when he sits among the elders of the land.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The city gates were gathering places for civic and legal business; elders were community leaders.
    reason: cultural_note
lexical_decisions:
- source_word: נוֹדָע
  chosen: is known
  alternatives:
  - is respected
  - is recognized
  lexicon: HALOT
  rationale: Nifal participle of ידע conveys being known/recognized. 'Is known' preserves the stative/passive sense without over-interpreting it as specifically honorific, though social esteem is implied by context.
- source_word: בַּשְּׁעָרִים
  chosen: at the city gates
  alternatives:
  - at the city gates
  - in the city gates
  lexicon: HALOT
  rationale: This renders the concrete plural expression in ordinary English while preserving its civic setting.
- source_word: בַּעְלָהּ
  chosen: her husband
  alternatives:
  - her master
  lexicon: HALOT
  rationale: בעל can mean owner/master/husband depending on context. In this domestic portrait of the capable wife, 'her husband' is the clear contextual sense and avoids importing a stronger hierarchical nuance not required here.
- source_word: בְּשִׁבְתּוֹ
  chosen: when he sits
  alternatives:
  - in his sitting
  - as he sits
  lexicon: HALOT
  rationale: 'The preposition ב plus infinitive construct with suffix is naturally rendered temporally here: ''when he sits.'' This is idiomatic English and reflects the circumstantial timing of his public presence.'
- source_word: עִם
  chosen: among
  alternatives:
  - with
  lexicon: HALOT
  rationale: Though literally 'with,' 'among' better conveys his seated participation in the company/council of the elders in idiomatic English.
- source_word: זִקְנֵי אָרֶץ
  chosen: the elders of the land
  alternatives:
  - the elders of the הארץ
  - the elders of the city
  lexicon: HALOT
  rationale: זקני ארץ is literally 'elders of the land.' 'Land' is retained rather than narrowing to 'city,' since the Hebrew says ארץ. In context it denotes leading civic figures, but the translation preserves the broader lexical form.
