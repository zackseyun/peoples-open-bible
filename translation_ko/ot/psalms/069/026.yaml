  rationale: 절 참조와 원문을 기준으로 본문을 전면 교체했습니다. כִּי의 인과 관계는 ‘때문입니다’로, 단수 목적어는 ‘주께서 치신 이’로 유지했습니다. רָדָפוּ는 적대적 문맥을 반영하여 ‘박해하고’로, יְסַפֵּרוּ는 고통을 화제로 삼아 말하는 뜻으로 ‘이야기하기’로 옮겼습니다. חֲלָלֶיךָ의 ‘상하게 한 이들/죽임을 당한 이들/찌름을 당한 이들’ 사이의 어휘적 불확실성은 본문에서 성급히 확정하지 않고 각주로 보존했습니다.
