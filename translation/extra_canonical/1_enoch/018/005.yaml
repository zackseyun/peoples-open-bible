translation:
  text: I saw the winds over the earth carrying the clouds.[a] I saw the paths of the angels. At the edge of the
    earth I saw the firmament of heaven above.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'The selected Geʽez prints the corrupt bearing expression with †በደመናት, “in clouds,” leaving its object
      unclear. This English adopts the object “clouds” from the later Ethiopic variant reported by Charles, not
      from an invented missing object: printed48 note19 reports ደመናት without the preposition for t and β, and printed49
      note6 describes the later reading as Greek-equivalent τὰς νεφέλας, “the clouds,” contrasting the best Ethiopic
      evidence. The printed singular bearing form and plural winds are also awkward. The selected source is preserved
      unchanged; the English is an explicit critical reading, not a claim that the best selected manuscripts all
      say “carrying the clouds.” I inspected Charles’s report, not those manuscripts themselves.'
    reason: textual_variant
