  lexicon: סבב
  rationale: 완료된 포위 상황을 간결하게 살리되, 앞절과의 대조를 위해 역접 연결을 자연스럽게 반영했습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of the LORD
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
