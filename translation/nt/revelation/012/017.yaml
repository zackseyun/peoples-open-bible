  from: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
  to: And the dragon became enraged at the woman and went away to wage war against the rest of her offspring—those who keep the commandments of God and hold to the testimony given by Jesus[a].
  rationale: The earlier deliberation rightly identifies a genuine dispute over 'the testimony of Jesus,' but its formally ambiguous wording leaves the relationship unclear. I favor testimony given by Jesus in light of Revelation’s wider usage and preserve testimony about Jesus as a serious alternative; no maintainer ruling settles this choice.
