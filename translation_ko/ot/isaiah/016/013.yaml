  - 여호와
  rationale: 본문의 יְהוָה는 직유적 호칭이 아니라 언약 이름이므로, 번역에서도 고유명을 보존하는 쪽이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אֶל מוֹאָב의 방향성
  chosen_reading: 모압에 대해
  alternative_readings:
  - 모압에게
  - 모압을 향하여
  - 모압을 향해
  rationale: 이 문장은 모압을 향한 직접 명령이 아니라 모압에 관한 예언의 결말 요약이므로, 관계 표지를 참조 의미로 처리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §5
