  adjudicator: wisdom-source-audit
  reviewer_model: gpt-5.6-sol-2026-07-09 + gpt-5.6-terra-2026-07-09
  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: idiom
  tier: 1
  from: There is nothing better for a man than that he should eat and drink and show himself good in his labor[b][a]. I also saw that this is from the hand of God.
  to: There is nothing better for a man[b] than to eat and drink and enjoy good in his labor[a]. I also saw that this is from the hand of God.
