theological_decisions:
- issue: Nature of divine discipline
  chosen_reading: disciplines
  alternative_readings:
  - chastens
  - corrects
  rationale: The verse compares the LORD's action to a human father's treatment of his son. 'Disciplines' preserves both corrective and formative dimensions without overstating punitive wrath or softening the force into mere instruction.
  doctrine_reference: Translation philosophy §3, §5
- issue: Rendering of the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
