id: JOB.38.12
reference: Job 38:12
source:
  edition: WLC
  text: הְֽ֭/מִ/יָּמֶי/ךָ צִוִּ֣יתָ בֹּ֑קֶר ידעתה שחר מְקֹמֽ/וֹ׃
translation:
  text: Have you ever commanded the morning and made the dawn know its place,
  philosophy: dynamic
lexical_decisions:
- source_word: הֲמִיָּמֶיךָ
  chosen: Have you ever
  alternatives:
  - since your days began
  - in your lifetime
  - ever since your days
  lexicon: HALOT
  rationale: The idiom asks whether this has occurred at any point in Job’s lifetime; “Have you ever” is the natural English equivalent.
- source_word: צִוִּיתָ
  chosen: commanded
  alternatives:
  - given orders to
  - appointed
  lexicon: HALOT
  rationale: צוה commonly means 'command, give an order.' 'Commanded' fits the divine challenge and keeps the force of authoritative speech over creation.
- source_word: בֹּקֶר
  chosen: the morning
  alternatives:
  - morning
  lexicon: HALOT
  rationale: 'Definite English idiom suits the poetic personification: God asks whether Job has ever commanded ''the morning'' as a cosmic reality.'
- source_word: יָדַעְתָּה
  chosen: made ... know
  alternatives:
  - caused ... to know
  - shown
  lexicon: HALOT
  rationale: The Hiphil is causative. “Made the dawn know” retains both that force and the poetic personification.
- source_word: שַׁחַר
  chosen: the dawn
  alternatives:
  - daybreak
  - the dawn light
  lexicon: HALOT
  rationale: שחר refers to dawn/daybreak. 'The dawn' is natural English and preserves the poetic parallel with 'the morning' while distinguishing the two terms.
- source_word: מְקוֹמוֹ
  chosen: its place
  alternatives:
  - its appointed place
  - its station
  lexicon: HALOT
  rationale: מקום means 'place.' 'Its place' is the plain sense; 'appointed place' is interpretive and therefore left as an alternative rather than placed in the main text.
