  text: Ἐκ δὲ τοῦ τετάρτου ὄρους τοῦ ἔχοντος βοτάνας πολλάς, τὰ μὲν ἐπάνω τῶν βοτανῶν χλωρά, τὰ δὲ πρὸς
    ταῖς ῥίζαις ξηρά, τινὲς δὲ καὶ ἀπὸ τοῦ ἡλίου ξηραινόμεναι, οἱ πιστεύσαντες τοιοῦτοί εἰσιν· οἱ μὲν
    δίψυχοι, οἱ δὲ τὸν Κύριον ἔχοντες ἐπὶ τὰ χείλη, ἐπὶ τὴν καρδίαν δὲ μὴ ἔχοντες. 2. διὰ τοῦτο τὰ θεμέλια
    αὐτῶν ξηρά ἐστι καὶ δύναμιν μὴ ἔχοντα, καὶ τὰ ῥήματα αὐτῶν μόνα ζῶσι, τὰ δὲ ἔργα αὐτῶν νεκρά ἐστιν.
    οἱ τοιοῦτοι οὔτε ζῶσιν οὔτε τεθνήκασιν. ὅμοιοι οὖν εἰσὶ τοῖς διψύχοις· καὶ γὰρ οἱ δίψυχοι οὔτε χλωροί
    εἰσιν οὔτε ξηροί· οὔτε γὰρ ζῶσιν οὔτε τεθνήκασιν. 3. ὥσπερ γὰρ αὐτῶν αἱ βοτάναι ἥλιον ἰδοῦσαι ἐξηράνθησαν,
    οὕτω καὶ οἱ δίψυχοι, ὅταν θλῖψιν ἀκούσωσι, διὰ τὴν δειλίαν αὐτῶν εἰδωλολατροῦσι καὶ τὸ ὄνομα ἐπαισχύνονται
    τοῦ Κυρίου αὐτῶν. 4. οἱ τοιοῦτοι οὖν οὔτε | ζῶσιν οὔτε | τεθνήκασιν. ἀλλὰ καὶ οὗτοι, ἐὰν ταχὺ μετανοήσωσι,
    | δύνανται ζῆσαι· ἐὰν δὲ μὴ μετανοήσωσιν, | ἤδη παραδεδομένοι εἰσὶ ταῖς γυναιξὶ ταῖς ἀποφερομέναις
    τὴν ζωὴν αὐτῶν.
