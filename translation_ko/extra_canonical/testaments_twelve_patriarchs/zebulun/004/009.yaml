base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/009.yaml
  text: “Let us slaughter a male goat with a knife, stain Joseph’s tunic, and send it to Jacob, saying, ‘Recognize—is this the tunic of your son?’” And they did so.
translation:
  language: ko
  text: “칼로 숫염소를 잡아바치고, 요셉의 두루마기를 더럽혀서, 그것을 야곱에게 보내며 ‘알아보십시오. 이것이 당신의 아들의 두루마기입니까?’라고 말합시다.” 그리고 그들은 그렇게 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θύσωμεν
  english_pob_choice: Let us slaughter
  chosen_korean: 잡아바치고
  alternatives_korean:
  - 죽이고
  - 도살하고
  - 희생제로 바치고
  lexicon: θύω
  rationale: 제의적·희생 제의적 뉘앙스를 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: χίμαρρον αἰγῶν
  english_pob_choice: a male goat
  chosen_korean: 숫염소
  alternatives_korean:
  - 염소 숫컷
  - 수염소
  - 염소
  lexicon: χίμαρρος
  rationale: 원문이 수컷 염소를 가리키므로 표준 한국어의 간결한 표현인 숫염소를 선택했습니다.
- source_word: μολύνωμεν τὸν χιτῶνα Ἰωσήφ
  english_pob_choice: stain Joseph’s tunic
  chosen_korean: 요셉의 두루마기를 더럽혀서
  alternatives_korean:
  - 요셉의 속옷을 더럽혀서
  - 요셉의 긴옷을 더럽혀서
  - 요셉의 옷을 더럽혀서
  lexicon: χιτών
  rationale: χιτών은 단순한 일반 옷보다 몸에 가까운 긴옷/두루마기에 가깝지만, 이야기 맥락상 독자가 곧바로 이해할 수 있도록 두루마기를 택했습니다.
- source_word: Ἐπίγνωθι ... ὁ χιτὼν τοῦ υἱοῦ σου ἐστίν;
  english_pob_choice: Recognize—is this the tunic of your son?
  chosen_korean: 알아보십시오. 이것이 당신의 아들의 두루마기입니까?
  alternatives_korean:
  - 분별해 보십시오. 이것이 당신의 아들의 두루마기입니까?
  - 알아보십시오. 이것이 당신 아들의 두루마기입니까?
  lexicon: ἐπίγνωθι
  rationale: 명령형의 확인 요구를 한국어의 공손한 요청형으로 옮겨, 야곱에게 보내는 조작된 말의 문맥을 자연스럽게 살렸습니다.
theological_decisions:
- issue: The verse contains a deceptive report without any explicit divine speech or doctrinal claim.
  chosen_reading: 서술적 폭로를 그대로 따르며, 행위의 기만성과 고의성을 약화하지 않았습니다.
  alternative_readings:
  - 완곡하게 ‘보내며’만 남겨 기만의 강도를 낮추는 읽기
  - 도덕적 평이로 재서술하는 읽기
  rationale: 원문은 형제들의 계획과 실행을 있는 그대로 제시하므로, 한국어도 사건의 음모성과 실행을 명확히 드러내야 합니다.
  doctrine_reference: Narrative fidelity / moral agency
