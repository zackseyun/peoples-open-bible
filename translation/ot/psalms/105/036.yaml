id: PSA.105.36
reference: Psalms 105:36
source:
  edition: WLC
  text: וַ/יַּ֣ךְ כָּל בְּכ֣וֹר בְּ/אַרְצָ֑/ם רֵ֝אשִׁ֗ית לְ/כָל אוֹנָֽ/ם־־׃
translation:
  text: He struck down every firstborn in their land, the first offspring born of their vigor[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the first of all their vigor”; the firstborn are described as the earliest expression of their parents' power to produce offspring.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  chosen: He struck down
  alternatives:
  - He struck
  - He smote
  - He killed
  lexicon: HALOT
  rationale: The Hiphil wayyiqtol of נכה commonly means 'strike' or 'smite'; in the context of the death of the firstborn, English 'struck down' conveys both the act and its lethal result without over-paraphrasing.
- source_word: כָּל
  chosen: every
  alternatives:
  - all
  lexicon: HALOT
  rationale: With a singular noun ('firstborn'), English idiom prefers 'every firstborn' rather than 'all firstborn,' while preserving the distributive force.
- source_word: בְּכוֹר
  chosen: firstborn
  alternatives:
  - firstborn one
  lexicon: HALOT
  rationale: Standard rendering for בכור; it is the established and precise English equivalent in plague contexts.
- source_word: בְּאַרְצָם
  chosen: in their land
  alternatives:
  - in their country
  lexicon: HALOT
  rationale: ארץ with 3mp suffix is naturally 'their land.' This keeps the geographic sense and echoes the Exodus plague setting.
- source_word: רֵאשִׁית
  chosen: the first issue
  alternatives:
  - the first part
  - the first
  lexicon: HALOT
  rationale: In apposition to “every firstborn,” it denotes the initial offspring or first expression, not agricultural firstfruits.
- source_word: לְכָל
  chosen: of all
  alternatives:
  - of every
  - for all
  lexicon: HALOT
  rationale: 'Here ל marks relation with the following noun phrase; ''of all'' best captures the genitival sense in English: ''the firstfruits of all their strength.'''
- source_word: אוֹנָם
  chosen: their vigor
  alternatives:
  - their vigor
  - their generative power
  lexicon: HALOT
  rationale: Here אוֹן denotes strength, with a contextual generative implication; “vigor” communicates this more closely than broad “strength.”
