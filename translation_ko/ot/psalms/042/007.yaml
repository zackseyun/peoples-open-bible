    text: 또는 ‘주님의 물길’, ‘주님의 큰 폭포들’. 히브리어 낱말은 물길이나 거센 물줄기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님의 모든 부서지는 파도와 물결이 제 위를 휩쓸고 지나갔습니다.’
    reason: lexical_alternative
