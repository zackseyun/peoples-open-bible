  category: other
  from: And he said, “Behold
  to: “Behold
  rationale: The phrase 'And he said' typically belongs to the end of verse 3 in standard
    versification (e.g., '...and spoke with the Mighty One and said:'). You may want
    to check the versification boundaries to ensure it isn't duplicated or misplaced
    here in verse 4.
