translation:
  text: But you who have suffered, do not fear,[a] for there will be healing for you.[b] Bright light will shine
    for you, and you will hear a voice of rest from heaven.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: This follows the selected main line of Charles1906, printed200, where the unit begins with a dagger. His
      apparatus34–38 reports omissions and variations in this passage. The marked edition reading is retained here
      rather than silently replaced; these are printed apparatus reports, not new manuscript checks.
  - marker: b
    reason: lexical_alternative
    text: The opening completed verb addresses the plural you who have suffered; its root can describe bodily illness
      or pain and affliction more broadly. Healing renders the cure/healing noun, not a named healer. The suffix
      on will be has the dative sense for you; the source does not say that healing becomes the people themselves.
  - marker: c
    reason: lexical_alternative
    text: 'Voice of rest keeps the source noun pairing: voice or word, followed by rest or repose. Word of rest
      is another close rendering. No direct quotation or named heavenly speaker is supplied. Bright light is the
      singular subject of will shine for you; the final will hear returns to the plural audience, and from heaven
      retains the source singular form.'
