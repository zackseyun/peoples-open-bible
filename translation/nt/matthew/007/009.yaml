  to: Or what man is there among you whom his son asks for bread[a]—he will not give him a stone, will he?
  rationale: The draft flattens the Greek anacoluthon (marked by the dash in SBLGNT) by adding an unsupported "and" to connect the clauses. It also loses the explicit negative expectation of the rhetorical question introduced by `μὴ` (`μὴ λίθον ἐπιδώσει αὐτῷ;`), which BDAG explicitly cites as expecting a negative answer (BDAG, μή 1.b.α). The following verse (7:10) correctly translates the exact same construction as "he will not give him a snake, will he?". Restoring "whom" for the accusative relative pronoun `ὃν` allows the English to match the Greek syntax and rhetorical structure perfectly while resolving the cross-verse inconsistency.
