  naturalness: 수정안은 현대 표준 한국어의 합쇼체 문체로 자연스럽습니다. ‘보고’는 원문에 명시되지 않은 목적어를 보충하지 않으면서도 한국어 시적 문맥에서 자연스럽게 연결됩니다. ‘마음이 살아나기를 바랍니다’는 히브리어의 ‘마음이 살다’라는 비유를 과도하게 해석하지 않고 전달합니다.
