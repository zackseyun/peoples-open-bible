translation:
  language: en
  text: Baptism corresponds to that event and now saves you too. Baptism is not the removal of dirt from the flesh, but an appeal[a] to God for a good conscience. It saves you through the resurrection of Jesus Christ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or, “a pledge of a good conscience to God.” The Greek word translated “appeal” can also mean “pledge” or “answer.”
    reason: alternative_reading
simplification_decisions:
- pob_phrase: Corresponding to that, baptism now also saves you
  simplified_phrase: Baptism corresponds to that event and now saves you too.
  preserved_meaning: Baptism is the corresponding reality in relation to the preceding flood-and-water event, and it is directly said to save the readers now.
  reasoning_layer_used: POB lexical decisions for ἀντίτυπον and σῴζει; POB theological decision on baptism and salvation; independent grounding review
  rationale: The inverted opening was recast in ordinary subject-verb order. Making baptism the subject preserves the source and POB direction of the typological correspondence while retaining the unsoftened statement that baptism saves.
- pob_phrase: not the removal of dirt from the flesh, but an appeal to God for a good conscience
  simplified_phrase: Baptism is not the removal of dirt from the flesh, but an appeal to God for a good conscience.
  preserved_meaning: The saving baptism in view is distinguished from physical cleansing and is identified with an appeal directed to God for a good conscience.
  reasoning_layer_used: POB lexical decisions for σαρκὸς, ἀπόθεσις ῥύπου, συνειδήσεως ἀγαθῆς, ἐπερώτημα, and εἰς θεόν; POB theological decision on the disputed meaning of ἐπερώτημα
  rationale: The compressed contrast was made into a complete sentence. “Flesh,” “appeal,” and “for a good conscience” retain the audited lexical choices, while the footnote preserves the genuine alternative reading.
- pob_phrase: through the resurrection of Jesus the Messiah
  simplified_phrase: It saves you through the resurrection of Jesus the Messiah.
  preserved_meaning: Baptism’s stated saving role operates through the resurrection of Jesus the Messiah.
  reasoning_layer_used: POB lexical decisions for δι’ ἀναστάσεως and Ἰησοῦ Χριστοῦ; POB theological decision on baptism and salvation
  rationale: The final means phrase was turned into a short sentence so readers can readily connect it with “saves,” without adding a denominational explanation.
interpretive_expansions:
- pob_phrase: that
  rendering: that event
  claim: “That” refers to the preceding flood-and-water event.
  evidence:
  - The POB lexical rationale for ἀντίτυπον says the expression refers back to the preceding flood/water event.
  - The immediate context of 1 Peter 3:20 describes people being brought safely through water.
  confidence: high
  alternatives_preserved:
  - The general word “event” does not decide whether the primary emphasis falls on the flood, the water, or the entire preceding episode.
- pob_phrase: through the resurrection of Jesus the Messiah
  rendering: It saves you through the resurrection of Jesus the Messiah.
  claim: The resurrection phrase states the means by which baptism saves.
  evidence:
  - The POB lexical rationale identifies διά with the genitive as expressing means or instrumentality.
  - The POB theological rationale says baptism’s saving role is bound up with Jesus’ resurrection.
  confidence: high
retained_terms:
- term: baptism
  reason: This standard biblical term is the POB’s source-driven rendering and is essential to the verse’s direct statement about salvation.
- term: flesh
  reason: The POB deliberately retains the literal term in this physical-cleansing contrast.
- term: appeal
  reason: This is the POB’s chosen main-text rendering of the debated Greek term; the alternatives are preserved in the footnote.
- term: Messiah
  reason: The POB treats Χριστός here as a theological title and renders it in idiomatic English as “the Messiah.”
translation_notes:
  source_alignment_notes: The corrected draft makes baptism—not the preceding event—the subject that corresponds to the flood-and-water event. It preserves the direct claim that baptism saves, Peter’s denial that this is merely physical dirt removal, the main-text rendering “appeal,” the alternate “pledge” and “answer” senses, the appeal’s direction to God, and the resurrection as the means. It imposes neither a symbolic-only reading nor a denominational sacramental explanation.
  readability_notes:
  - The dense POB sentence was divided into three short, connected sentences.
  - The inverted opening was recast in direct subject-verb order without reversing the typological relationship.
  - The final means phrase was supplied with an explicit subject and verb so its connection with salvation is immediately clear.
  compression_notes:
  - The opening participial relation was compressed into the direct clause “Baptism corresponds to that event.”
  - No central theological qualification or documented lexical ambiguity was removed.
  risk_flags:
  - risk: Dividing the verse into three sentences could make baptism, the appeal, and the resurrection seem unrelated.
    mitigation: The repeated noun “Baptism” and the pronoun “It” keep all three statements explicitly connected.
  - risk: The statement that baptism saves could be weakened or expanded into a denominational doctrine.
    mitigation: The direct wording is retained, followed only by Peter’s own qualifications concerning physical cleansing, conscience, God, and the resurrection.
  - risk: The debated meaning of ἐπερώτημα could be presented as certain.
    mitigation: “Appeal” remains the audited main reading, while “pledge” and “answer” are preserved in the footnote.
  - risk: The typological direction could again be reversed in simplification.
    mitigation: The corrected first sentence explicitly makes baptism the subject that corresponds to the preceding event.
