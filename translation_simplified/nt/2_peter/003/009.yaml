translation:
  language: en
  text: The Lord is not slow in keeping his promise, as some people think he is slow. Instead, he is patient toward you.[a] He does not want any to perish, but wants all to reorient toward God[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The words “any” and “all” may refer specifically to Peter’s readers or more broadly to humanity.
    reason: alternative_reading
  - marker: b
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: as some consider slowness
  simplified_phrase: as some people think he is slow
  preserved_meaning: Some regard the Lord’s apparent delay as slowness.
  reasoning_layer_used: Lexical decision for ἡγέομαι and the rhetorical repetition of βραδύνει and βραδύτητα
  rationale: The clause now clearly states their judgment while preserving the repeated idea of slowness.
- pob_phrase: but is patient toward you
  simplified_phrase: Instead, he is patient toward you
  preserved_meaning: The apparent delay is the Lord’s patient restraint directed toward the readers.
  reasoning_layer_used: Lexical decisions for μακροθυμεῖ and εἰς ὑμᾶς
  rationale: A new sentence makes the contrast easier to follow while retaining “toward you.”
interpretive_expansions:
- pob_phrase: not slow concerning the promise
  rendering: not slow in keeping his promise
  claim: The Lord’s apparent slowness concerns carrying out what he promised.
  evidence:
  - The immediate context concerns the expected fulfillment of the Lord’s promise.
  - The POB lexical rationale says fulfillment is implied though not explicit.
  confidence: high
  alternatives_preserved:
  - not slow about the promise
  - does not delay concerning the promise
- pob_phrase: reorient / reorientation
  rendering: toward God
  claim: Make the destination supplied by the religious context explicit, without claiming it is lexical content of metanoia.
  evidence:
  - Use the approved reorientation vocabulary for a moral response to God. The direction toward God is supplied from this religious context, not claimed to be contained in the Greek word by itself. No degree of completeness, achievement or emotional intensity is added.
  confidence: moderate
  alternatives_preserved:
  - reorient / reorientation without an expressed destination
translation_notes:
  risk_flags:
  - risk: Readers may assume “any” and “all” have either a narrowly limited or universally human scope.
    mitigation: The footnote preserves the POB’s documented ambiguity without choosing a doctrinal interpretation.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
