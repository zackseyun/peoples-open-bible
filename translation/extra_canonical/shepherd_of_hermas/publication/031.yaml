translation:
  text: 'III.1. “Sir,” I said, “I will add another question.” “Speak,” he said. “I heard from certain
    teachers,” I said, “that there is no other repentance[a] except the one when we went down into the
    water and received forgiveness of our former sins.”


    III.2. He said to me, “You heard correctly; that is how it is. A person who has received forgiveness
    of sins ought no longer to sin, but to live in purity.”


    III.3. “But since you examine everything closely, I will explain this too, without giving an opening
    to those who are going to believe or have now believed in the Lord. For those who have now believed
    or are going to believe have no repentance of sins, but they have forgiveness of their former sins.”[b]


    III.4. “The Lord therefore established repentance for those called before these days. For the Lord
    knows hearts and foreknows everything. He knew human weakness and the devil’s many schemes, that the
    devil would harm God’s servants and act wickedly against them.”[c]


    III.5. “So the Lord, being abundantly merciful, took pity on his creation and established this repentance.
    Authority over this repentance was given to me.”


    III.6. “But I tell you: after that great and solemn calling, if someone is tempted by the devil and
    sins, they have one repentance. But if they repeatedly sin and repent, it does not benefit such a
    person; they will live with difficulty.”[d]


    III.7. I said to him, “I have been brought to life by hearing these things from you so precisely.
    For I know that if I add no more to my sins, I will be saved.” “You will be saved,” he said, “and
    so will everyone who does these things.”


    IV.1. I asked him again, “Sir, since you have been patient with me, explain this too.” “Speak,” he
    said. “Sir,” I said, “if a woman or a man falls asleep in death and the surviving partner marries,
    does the one who marries sin?”[e]


    IV.2. “They do not sin,” he said. “But if someone remains unmarried, they gain greater honor and great
    glory for themselves with the Lord. Yet if they marry, they do not sin.”[f]


    IV.3. “So keep purity and reverence, and you will live to God. Keep everything I tell you and am going
    to tell you, from now on, from the day you were entrusted to me, and I will dwell in your house.”


    IV.4. “There will be forgiveness for your former trespasses if you keep my commandments. There will
    also be forgiveness for everyone if they keep these commandments of mine and walk in this purity.”[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
    reason: lexical_alternative
  - marker: b
    reason: textual_variant
    text: '“No repentance of sins, but forgiveness” retains the working printed text without softening
      its difficult distinction. Vulgata, Hilgenfeld (1873), physical61 printed42, has the corresponding
      repentance-of-sins contrast. The older 1891 apparatus instead reports Athos “no great sin”; alternative:
      “Those who have now believed or are going to believe have no great sin, but have forgiveness of
      their former sins.” Lake (1907), Plate V, prints repentance-of-sins in its later Athos transcription,
      so the reports disagree. The Sinaiticus project XML’s corresponding repentance/sins words are wholly
      or partly restored in a damaged span filed within chapter30.3, not an intact independent vote. Palatina
      paraphrases the passage differently; it is not silently converted into identical Greek testimony.'
  - marker: c
    reason: textual_variant
    text: Sinaiticus’s surviving chapter31.4 starts within this paragraph, after a gap. Its foreknowing
      wording and many neighboring letters are editorially supplied or uncertain. Chapter31.5 partly preserves
      the authority/repentance statement; it is not a fully intact second text of the whole sentence.
      The project chapter31 begins with verse4, while the preceding damaged chapter30.3 element also contains
      pieces corresponding to31.3; its metadata must not be treated as a clean passage boundary.
  - marker: d
    reason: textual_variant
    text: 'The working edition omits a negation that Athos has before repent. Lake (1907), Plate V line50,
      prints “and does not repent.” Alternative warning: “But if they repeatedly sin and do not repent,
      it does not benefit such a person; they will live with difficulty.” The positive reading is retained
      provisionally: Vulgata, Hilgenfeld physical61 printed42, says repeated sinning and doing repentance;
      Palatina, Gebhardt/Harnack (1877), physical180 printed83, speaks of frequently doing repentance.
      Sinaiticus breaks off within the preceding say-word and cannot decide the negation. Hypo cheira
      is rendered repeatedly in this context; “at once” is another possible idiomatic sense. The one-repentance
      statement and difficult-life warning are both retained. The older apparatus also reports Athos a
      calling-of-spirit expansion, absent from Lake’s later transcription; that report remains unresolved
      rather than being added to the main text.'
  - marker: e
    reason: lexical_alternative
    text: 'Falls asleep is the death metaphor; the surviving partner makes explicit the implied person
      who marries, not the deceased spouse. More literal: “If a woman or a man falls asleep, and one of
      them marries, does the one who marries sin?” Palatina, physical182 printed85, explicitly distinguishes
      one dying and the other marrying. The respectful Sir is a printed correction of Athos’s conjunction
      at the opening; alternative opening: “And since you have been patient with me, explain this too.”
      Hapax can more literally mean once/already in the patience clause.'
  - marker: f
    reason: lexical_alternative
    text: Remains unmarried expresses remaining by oneself in the widowed context. The passage twice says
      marrying is not sin while also describing greater honor for remaining unmarried. Both claims are
      retained; no rule about every other marriage situation is added. Purity and reverence in the next
      paragraph render hagneia and semnotēs; chastity and dignity are alternatives.
  - marker: g
    reason: lexical_alternative
    text: 'The promise retains the stated conditions: keeping these commandments and walking in this purity.
      The everyone clause does not erase those conditions. The draft preserves both historical sections
      within legacy reader31; III/IV paragraph labels expose the boundary without changing reader IDs
      or overwriting legacy reader32.'
lexical_decisions:
- source_word: μετάνοια
  chosen: repentance
  alternatives:
  - reorientation
  - repentance
  - change of mind
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial
    assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: εἰς ὕδωρ κατέβημεν
  chosen: we went down into the water
  alternatives:
  - we descended into the water
  - we entered the water
  lexicon: BDAG; LSJ
  rationale: Literal rendering maintains early baptismal imagery without inserting the word “baptize.”
- source_word: ἄφεσις (ἁμαρτιῶν)
  chosen: forgiveness (of sins)
  alternatives:
  - remission (of sins)
  - release
  lexicon: BDAG; LSJ
  rationale: “Forgiveness” is clear, idiomatic English for the soteriological ‘release’ of sins; “remission”
    is a viable traditional alternative.
- source_word: κύριε (voc.)
  chosen: sir
  alternatives:
  - lord
  lexicon: BDAG; LSJ
  rationale: Here it is a respectful address to the angelic shepherd, not a divine title; “sir” avoids
    confusion with “the Lord” used for God later in the unit.
- source_word: πρὸς τὸν Κύριον
  chosen: with the Lord
  alternatives:
  - before the Lord
  - in the Lord’s sight
  lexicon: BDAG
  rationale: Capitalized “Lord” signals the divine referent; “with the Lord” fits the dative-like relation
    conveyed by πρὸς here (cf. idiomatic ‘in relation to the Lord’).
- source_word: κοιμηθῇ
  chosen: fall asleep (die)
  alternatives:
  - die
  lexicon: BDAG; LSJ
  rationale: Preserves early Christian euphemism for death, with explanatory footnote for clarity.
- source_word: ἐφ' ἑαυτῷ μείνῃ
  chosen: remains unmarried
  alternatives:
  - remains by himself/alone
  - remains as he is
  lexicon: BDAG; LSJ
  rationale: Context is marital status after a spouse’s death; “remains unmarried” communicates the sense
    without loss of the reflexive nuance.
- source_word: περισσοτέραν … τιμὴν … καὶ μεγάλην δόξαν περιποιεῖται
  chosen: he obtains for himself greater honor and great glory
  alternatives:
  - he procures for himself greater honor and great glory
  - he gains for himself greater honor and great glory
  lexicon: BDAG; LSJ
  rationale: “Obtains for himself” matches περιποιεῖται; key terms τιμή/δόξα kept as “honor” and “glory”
    to preserve moral-religious weight.
- source_word: ἁγνεία
  chosen: purity
  alternatives:
  - purity
  lexicon: BDAG; LSJ
  rationale: 'Reconsideration of prior lexical decision: retain the reader’s “purity” for ἁγνεία. In III.2
    it describes conduct after forgiveness generally; in IV.3 the marriage and remarriage context includes
    sexual purity without restricting the term to remaining unmarried, since IV.2 twice says remarriage
    is not sin. “Chastity” remains a defensible contextual alternative, as noted in footnote f.'
- source_word: σεμνότης
  chosen: reverence
  alternatives:
  - gravity
  - dignity
  - sobriety
  lexicon: BDAG; LSJ
  rationale: 'Reconsideration of prior lexical decision: retain the reader’s “reverence” for σεμνότης
    in IV.3, understood as dignified moral seriousness paired with purity, not as an added command to
    perform an act of worship. “Dignity,” “gravity,” “sobriety,” and the prior “modesty” are alternative
    glosses; footnote f retains “dignity.”'
- source_word: φυλάσσω (imper.)
  chosen: keep
  alternatives:
  - keep
  - observe
  lexicon: BDAG; LSJ
  rationale: 'Reconsideration of prior lexical decision: retain “keep” for φυλάσσω in IV.3–4. With the
    speaker’s instructions and commandments as its objects, it conveys attentive observance, including
    the vigilance expressed by the alternative “guard.” It does not reduce the stated conditions for forgiveness
    to merely remembering the instructions.'
- source_word: παρεδόθης (μοι)
  chosen: were entrusted (to me)
  alternatives:
  - were handed over (to me)
  - were delivered (to me)
  lexicon: BDAG; LSJ
  rationale: “Entrusted” captures the sense of being committed to the shepherd’s care, fitting the narrative
    frame.
- source_word: κατοικήσω
  chosen: I will dwell
  alternatives:
  - I will take up residence
  lexicon: BDAG; LSJ
  rationale: “Dwell” preserves biblical-ecclesial register and allows the metaphorical sense of indwelling
    presence.
- source_word: παραπτώματα
  chosen: trespasses
  alternatives:
  - transgressions
  - offenses
  lexicon: BDAG; LSJ
  rationale: “Trespasses” is a well-established moral term for violations; it retains the weight of paraenetic
    discourse.
- source_word: ἐντολαί
  chosen: commandments
  alternatives:
  - commands
  lexicon: BDAG; LSJ
  rationale: “Commandments” preserves the formal moral authority of the mandates in context.
- source_word: πορεύομαι ἐν
  chosen: walk in
  alternatives:
  - live in
  - conduct oneself in
  lexicon: BDAG; LSJ
  rationale: “Walk in” keeps the traditional ethical metaphor for conduct, aligning with Hermas’s paraenetic
    style.
- source_word: μετανοήσῃ / οὐ μετανοήσῃ
  chosen: repent (provisional working reading)
  alternatives:
  - do not repent (Athos)
  rationale: Preserve the substantive negation alternative; the positive reading is supported by Latin
    traditions, while Sinaiticus ends before the clause.
- source_word: ὑπὸ χεῖρα / κοιμηθῇ
  chosen: repeatedly / falls asleep in death
  alternatives:
  - at once / dies
  rationale: Keep the repeated-sin warning and the widowed context without making the deceased spouse
    the person who remarries.
