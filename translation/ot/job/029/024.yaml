id: JOB.29.24
reference: Job 29:24
source:
  edition: WLC
  text: אֶשְׂחַ֣ק אֲ֭לֵ/הֶם לֹ֣א יַאֲמִ֑ינוּ וְ/א֥וֹר פָּ֝נַ֗/י לֹ֣א יַפִּילֽוּ/ן׃
translation:
  text: I smiled at them; they did not believe it[a], and they did not dim the light of my face[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “I smiled at them when they had no confidence.”
    reason: alternative_reading
  - marker: b
    text: Literally, “they did not cause the light of my face to fall”; possibly, “they did not disregard my favor.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשְׂחַק
  chosen: I smiled
  alternatives:
  - I laughed
  - I jested
  lexicon: HALOT
  rationale: The verb שׂחק can denote laughing or smiling. In this context of Job's favorable, dignifying response to others, 'I smiled' best fits the social nuance without suggesting mockery or loud laughter. It also pairs naturally with the following expression about the 'light of my face.'
- source_word: אֲלֵהֶם
  chosen: at them
  alternatives:
  - to them
  - with them
  lexicon: HALOT
  rationale: The preposition אֶל with this verb is most naturally rendered directionally. 'At them' works idiomatically in English with 'smiled' and preserves the interpersonal orientation.
- source_word: לֹא יַאֲמִינוּ
  chosen: they did not believe it
  alternatives:
  - they did not believe
  - they would not believe
  lexicon: HALOT
  rationale: This gives the unelaborated Hebrew sense without deciding whether their response was astonishment, disbelief, or reluctance to presume upon Job’s favor.
- source_word: וְאוֹר פָּנַי
  chosen: the light of my face
  alternatives:
  - the light of my countenance
  - the brightness of my face
  - my cheerful face
  lexicon: HALOT
  rationale: The phrase is a Hebrew idiom for a bright, favorable, or cheerful facial expression. 'The light of my face' preserves the imagery of the source while remaining understandable in English.
- source_word: לֹא יַפִּילוּן
  chosen: they did not diminish
  alternatives:
  - they did not bring down
  - they did not darken
  - they did not reject
  lexicon: HALOT
  rationale: The Hiphil means cause to fall; with the light of the face as object, “diminish” is idiomatic English that maintains the image and causative sense.
