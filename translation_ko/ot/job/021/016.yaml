base_translation:
  language: en
  yaml_path: translation/ot/job/021/016.yaml
  text: Look, is not their prosperity in their own hand? The counsel of the wicked is far from me.
translation:
  language: ko
  text: 보십시오, 그들의 번영[a]이 그들의 손에 있지 않습니까? 악인들의 꾀는 내게서 멉니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들의 좋은 것’이라고도 옮길 수 있는 표현입니다. 여기서는 삶의 형통이나 번영을 가리키는 뜻으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 자 보십시오
  lexicon: הֵן
  rationale: 감탄·주의 환기 용법을 현대 합쇼체로 옮겨, 독자의 시선을 즉시 끌어들이는 POB의 'Look'을 자연스럽게 살렸습니다.
- source_word: לֹא ... בְיָדָם טוּבָם
  english_pob_choice: is not their prosperity in their own hand
  chosen_korean: 그들의 번영이 그들의 손 안에 있지 않습니까
  alternatives_korean:
  - 그들의 복이 그들의 손에 있지 않습니까
  - 그들의 형통이 자기 손에 있지 않습니까
  lexicon: טוּב
  rationale: טוּב은 여기서 단순한 '선함'보다 삶의 형편과 번영을 가리키므로, POB의 prosperity를 따라 '번영'으로 옮겼습니다.
- source_word: עֲצַת רְשָׁעִים
  english_pob_choice: The counsel of the wicked
  chosen_korean: 악인들의 꾀
  alternatives_korean:
  - 악인들의 계획
  - 악한 자들의 조언
  lexicon: עֵצָה
  rationale: עֲצָה는 맥락상 '의논/계획/꾀'의 뜻인데, 여기서는 욥이 자신과 거리를 두는 부정적 결탁의 뉘앙스를 살려 '꾀'로 처리했습니다.
- source_word: רָחֲקָה מֶנִּי
  english_pob_choice: is far from me
  chosen_korean: 내게서 멉니다
  alternatives_korean:
  - 내게서 멀리 있습니다
  - 나와는 거리가 멉니다
  lexicon: רחק
  rationale: 히브리어 완료형의 결과 상태를 자연스러운 현재 판단으로 옮겨, 말하는 이와 악인들의 꾀 사이의 분리를 간결하게 드러냈습니다.
theological_decisions:
- issue: 욥의 진술을 의문형으로 옮길지, 반어적 선언으로 옮길지
  chosen_reading: 반어적 질문 형태를 유지했습니다.
  alternative_readings:
  - 그들의 번영은 그들의 손 안에 있는 것이 아닙니다.
  - 그들의 번영이 그들의 손 안에 있는 것 아닙니까?
  rationale: 히브리어 לֹא + 질문 구조와 POB의 질문형을 따라, 욥의 논박적·비판적 어조를 보존했습니다.
  doctrine_reference: 문맥 주해
