  rationale: The doctrine excerpt specifies gender-accurate rendering and lists אָדָם as 'man / humankind (context).' In this verse the singular generic stands in a stylized pair with 'beast,' so 'man' best preserves the source form and rhetorical balance, while an inclusive alternative is worth preserving in a footnote.
