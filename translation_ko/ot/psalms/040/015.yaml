  - 모욕을 당하게 하소서
  - 수치를 더 깊이 당하게 하소서
  lexicon: HALOT
  rationale: חפר의 ‘창피를 당하다/굴욕스럽게 되다’는 뜻을 살려, 앞의 ‘수치’와 중복되면서도 강도를 더하는 표현으로 옮겼습니다.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  english_pob_choice: those who seek my life
  chosen_korean: 내 생명을 없애려는 이들
  alternatives_korean:
  - 내 생명을 찾는 이들
  - 내 목숨을 노리는 이들
  lexicon: HALOT
  rationale: נפש는 여기서 추상적 ‘영혼’보다 ‘생명/목숨’의 관용구로 이해되며, 동사의 목적이 살해임을 드러내기 위해 ‘없애려는’으로 풀었습니다.
- source_word: חֲפֵצֵי רָעָתִי
  english_pob_choice: those who delight in my harm
  chosen_korean: 내 해를 기뻐하는 이들
  alternatives_korean:
  - 내 악을 좋아하는 이들
  - 내 재앙을 즐기는 이들
  lexicon: HALOT
  rationale: רָעָה는 כאן에서 도덕적 ‘악’보다 시편 화자에게 닥치는 ‘해/재앙’의 뜻이 더 적절하므로, POB의 의미를 따라 ‘해’로 옮겼습니다.
