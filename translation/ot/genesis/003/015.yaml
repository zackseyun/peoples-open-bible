theological_decisions:
- issue: Whether the woman's seed should be rendered in a way that preserves both collective and individual dimensions often associated with this verse
  chosen_reading: Rendered זֶרַע as 'seed' in both lines and the following pronoun הוּא as 'he' in the main text
  alternative_readings:
  - Rendered collectively as 'they' or 'it'
  - Rendered idiomatically as 'offspring' with a masculine singular pronoun
  rationale: The Hebrew repeats the same collective noun for the serpent and the woman, then follows it with a masculine singular pronoun. 'Seed' preserves that repeated image and its collective sense, while 'he' keeps the representative-individual possibility visible without forcing a full messianic interpretation into the translation itself.
  doctrine_reference: Translation philosophy §3; §4
- issue: How strongly to render שׁוּף in the first clause
  chosen_reading: Used 'crush' for the head clause and 'bruise' for the heel clause
  alternative_readings:
  - '''bruise'' in both clauses'
  - '''strike'' in both clauses'
  rationale: The Hebrew repeats the same rare verb, and the footnote makes that lexical repetition transparent. The differing body parts imply differing severity, so 'crush' and 'bruise' express the verse's head-versus-heel asymmetry directly in English.
  doctrine_reference: Translation philosophy §1; §3; §5
