simplification_decisions:
- issue: Shorter sentences with critical distinctions preserved
  choice: Use shorter sentences while retaining the plural holy spirits, the Son’s powers, the necessary
    garment and name requirements, passage through the gate, delivery through the virgins’ hands, reception
    of the spirits followed by strengthening without a stated agent, and seeing the women before desiring
    them. Restore the interlocutor’s seeing the tower’s unity, the explicit comparison with believers’
    unity, the reason for the invitation to listen, and the explanatory connection of shared thinking
    and righteousness to unity. Preserve clothing imagery, the exchange of powers and its consequences,
    God’s servants, and the substantive notes with their evidential limits, including the attributed conjecture
    reports.
