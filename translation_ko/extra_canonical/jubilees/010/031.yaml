  source_fidelity: The draft reflects the reviewed reading of the repeated phrase as 'in rebellion,' preserves the perfect sense of ኀደርክሙ ('have dwelt'), includes the future fall of the children and the otherwise easily omitted uprooting clause, and retains the final prohibition. The supplied alternate rendering should remain explicitly marked as an alternate because it substantially changes the repeated phrase's sense.
  naturalness: ‘영원히 뽑힐 것입니다’ is understandable but incomplete and somewhat unnatural in Korean for an uprooting image. ‘영원히 뿌리 뽑힐 것입니다’ is idiomatic, vivid, and formally appropriate. The footnote marker should attach to the phrase for which the alternate rendering is offered, rather than to the final prohibition.
  terminology: ‘반역,’ ‘거하다,’ and ‘자녀’ suit a formal biblical register. ‘뿌리 뽑히다’ accurately conveys eradication/uprooting without adding interpretation.
  issues:
