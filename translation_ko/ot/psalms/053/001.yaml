  lexicon: HALOT
  rationale: מָחֲלָת는 의미가 불확실한 음악·예전 용어일 수 있으므로, 추측 번역 대신 음역을 유지하고 관계만 드러냈습니다.
- source_word: מַשְׂכִּיל
  english_pob_choice: A Maskil
  chosen_korean: 마스킬
  alternatives_korean:
  - 교훈시
  - 묵상시
  - 마스킬
  lexicon: HALOT
  rationale: 기술적 표제어의 정확한 뜻이 불확실하므로, 본문에서는 음역을 보존해 과도한 의미 규정을 피했습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의 시
  alternatives_korean:
  - 다윗의
  - 다윗이 지은
  - 다윗에게
  lexicon: HALOT
  rationale: לְ는 저작자뿐 아니라 소속·헌정·연관을 가리킬 수 있어, 영어 POB처럼 'of David'의 유연한 의미를 살렸습니다.
theological_decisions:
- issue: 시편 표제를 본문으로 번역할지 여부
  chosen_reading: 표제를 정경 본문의 일부로 옮겨, 절 첫머리의 기능적 지시를 그대로 보존했습니다.
  alternative_readings:
  - 표제를 각주나 편집문으로 돌림
  - 본문에서 생략
  rationale: 히브리어 본문이 표제를 본문에 포함하고 있으므로, 번역에서도 같은 위치와 무게를 유지하는 것이 source-grounded에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: לְדָוִד의 귀속 의미
  chosen_reading: '''다윗의 시''로 옮겨 저작, 연관, 헌정 가능성을 모두 열어 두었습니다.'
  alternative_readings:
  - '''다윗이 지은 시'''
  - '''다윗을 위한 시'''
  rationale: 히브리어 전치사 ל의 범위가 넓으므로, 저작을 단정하는 번역보다 원문의 모호성을 보존하는 번역이 더 정확합니다.
  doctrine_reference: Translation philosophy §§1, 5
