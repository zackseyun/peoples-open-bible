  naturalness: 수정문은 현대 표준 한국어의 합쇼체를 따르며, 직접 인용의 구조와 하나님께 드리는 호칭을 자연스럽게 표현합니다. ‘나에게 부르짖을 것입니다’는 기도·호소의 방향성을 분명히 하되, 각주로 더 중립적인 ‘나를 부를 것입니다’도 보존합니다.
