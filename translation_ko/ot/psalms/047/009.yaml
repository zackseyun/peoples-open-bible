  rationale: 보좌와 병행될 때 단순한 위치보다 즉위/왕권의 이미지를 살려야 하므로, 한국어에서는 예배적이고 자연한 ‘앉아 계십니다’로 옮겼습니다.
- source_word: כִּסֵּא קָדְשׁוֹ
  english_pob_choice: his holy throne
  chosen_korean: 그의 거룩한 보좌
