id: PRO.12.25
reference: Proverbs 12:25
source:
  edition: WLC
  text: דְּאָגָ֣ה בְ/לֶב אִ֣ישׁ יַשְׁחֶ֑/נָּה וְ/דָבָ֖ר ט֣וֹב יְשַׂמְּחֶֽ/נָּה־׃
translation:
  text: Anxiety weighs down a man’s heart, but a good word makes it glad.
  philosophy: dynamic
lexical_decisions:
- source_word: דְּאָגָה
  chosen: anxiety
  alternatives:
  - worry
  - care
  - heaviness
  lexicon: HALOT
  rationale: The noun denotes anxious care or worry. 'Anxiety' is natural modern English and preserves the inward emotional sense better than the broader 'care' or the interpretive 'heaviness'.
- source_word: בְלֶב אִישׁ
  chosen: a man’s heart
  alternatives:
  - in the heart of a man
  - in a person's heart
  lexicon: HALOT
  rationale: English idiom recasts the Hebrew prepositional phrase as the object of the causative verb, without changing the referent.
- source_word: יַשְׁחֶנָּה
  chosen: weighs down
  alternatives:
  - bows it down
  - depresses it
  - makes it stoop
  lexicon: HALOT
  rationale: The verb denotes causing the heart to sink or bow low; “weighs down” is a natural rendering that retains this downward image.
- source_word: וְדָבָר טוֹב
  chosen: but a good word
  alternatives:
  - and a good word
  - but a kind word
  - but a good message
  lexicon: HALOT
  rationale: 'דָבָר is broadly ''word, matter, message.'' In this proverb''s antithetical parallelism, ''a good word'' is the most direct rendering and leaves the phrase appropriately broad: encouraging, favorable, or timely speech. ''But'' captures the adversative force of the parallelism better than a wooden ''and.'''
- source_word: יְשַׂמְּחֶנָּה
  chosen: makes it glad
  alternatives:
  - cheers it up
  - gladdens it
  - makes it rejoice
  lexicon: HALOT
  rationale: The Piel of שׂמח means to make glad or rejoice. 'Makes it glad' is clear, idiomatic, and preserves the causative sense. The feminine suffix is represented by 'it,' referring back to the heart/inner person.
