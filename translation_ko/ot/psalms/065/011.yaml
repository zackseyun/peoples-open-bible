  - 그 밭고랑들을
  lexicon: 밭고랑
  rationale: 농경 이미지를 직접 살리기 위해 furrows를 ‘밭고랑’으로 옮겼고, 히브리어 접미사로 표시된 소유는 한국어에서 자연스럽게 ‘그의’로 풀었습니다.
- source_word: גְּדוּדֶ֑י/הָ
  english_pob_choice: its ridges
  chosen_korean: 그의 이랑을
  alternatives_korean:
  - 그것의 언덕을
  - 그의 고랑을
  lexicon: 이랑
  rationale: POB의 settle은 지형을 다듬어 고르게 하는 뜻이므로, ridges는 밭의 ‘이랑’으로 대응시키는 것이 본문과 가장 잘 맞습니다.
- source_word: בִּ/רְבִיבִ֥ים
  english_pob_choice: With showers
  chosen_korean: 소나기로
  alternatives_korean:
  - 이슬비로
  - 비들로
  lexicon: 소나기
  rationale: 히브리어 plural/collective 비를 한국어에서는 자연스럽게 ‘소나기’로 처리해, 농작물에 내리는 풍성한 비의 뉘앙스를 살렸습니다.
- source_word: תְּמֹגְגֶ֗/נָּה
  english_pob_choice: you soften it
  chosen_korean: 그것을 부드럽게 하시고
  alternatives_korean:
  - 그것을 녹이시고
  - 그것을 무르게 하시고
  lexicon: 부드럽게 하다
  rationale: 동사의 핵심은 땅을 물로 풀어 무르게 하는 뜻이므로, 문자적 ‘녹이다’보다 한국어에서 자연스럽고 농경 맥락에 맞는 ‘부드럽게 하다’로 옮겼습니다.
- source_word: צִמְחָ֥/הּ
  english_pob_choice: its growth
  chosen_korean: 그 싹을
  alternatives_korean:
  - 그 자람을
  - 그 생장을
  lexicon: 싹
  rationale: English POB의 growth는 최종 결과보다 성장의 시작과 생동을 강조하므로, 식물이 돋아나는 이미지를 드러내는 ‘싹’으로 구체화했습니다.
theological_decisions:
- issue: 문두와 종결의 동사 호칭 및 주어 생략
  chosen_reading: 자연현상에 대한 서술이지만, 본절 전체를 하나님의 섭리적 행위로 읽어 동사를 모두 존대형으로 정리했습니다.
  alternative_readings:
  - 자연현상 서술로 평서형을 쓰는 방식
  - 직접 주어를 반복해 ‘주님께서’로 명시하는 방식
  rationale: 시편 문맥에서 하나님이 비와 풍요를 주시는 분이라는 점을 드러내면서도, 한국어 시적 흐름을 해치지 않기 위해 존대형과 주어 생략을 병행했습니다.
  doctrine_reference: 시편 65편의 창조-섭리 신학
