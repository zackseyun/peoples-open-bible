  - Jehovah
  rationale: The verse contains the Tetragrammaton YHWH. Per project doctrine, the divine name is rendered 'Yahweh' rather than the traditional title substitution 'the LORD.'
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH -> Yahweh'
- issue: Generic masculine אדם in wisdom literature
  chosen_reading: a man's
  alternative_readings:
  - a person's
  - humankind's
  rationale: The proverb speaks of a representative individual in singular form. Following the project's gender-accurate principle, 'a man's' best matches the source form and proverbial style, while the generic force can be noted in a footnote for modern readers.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
