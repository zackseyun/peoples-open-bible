  from: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
  to: David said to Saul, “Let no one lose heart because of this Philistine. Your servant will go and fight him.”
  rationale: The lexical notes establish that the falling heart is an idiom for discouragement and that “your servant” is deferential address to the king. Those meanings are preserved, while the former footnotes are unnecessary once the main text states them clearly.
