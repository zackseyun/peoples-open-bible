  from: So you[a], by your God, return; keep steadfast love and justice[b], and wait continually for your God.
  to: So repent with your God’s help[a]; hold fast to steadfast love and justice, and always wait for your God in hope.
  rationale: The earlier “by your God” identifies a plausible instrumental sense, which I retain as God’s help while noting the directional alternative. The context and standing ruling support “repent,” and the lexical record supports making the hopeful character of waiting explicit.
