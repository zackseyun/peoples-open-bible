base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/013.yaml
  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: ko
  text: 모세가 이스라엘 자손에게 명령하여 말했습니다. “이것은 너희가 제비를 뽑아 기업으로 받을 땅, 곧 야훼께서 아홉 지파와 반 지파에게 주라고 명령하신 땅입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו ... לֵאמֹר
  english_pob_choice: Then Moses commanded ... saying
  chosen_korean: “그때 모세가 … 말했습니다”
  alternatives_korean:
  - “그때 모세가 … 명령했습니다”
  - “모세가 … 일렀습니다”
  lexicon: צוה
  rationale: 히브리어 צווה는 단순 발화보다 권위를 가진 지시를 뜻하지만, 이어지는 직접 인용문이 본문 핵심이므로 한국어에서는 자연스러운 서술로 처리하고 '말했습니다'를 사용했습니다.
- source_word: תִּתְנַחֲלוּ
  english_pob_choice: you shall inherit
  chosen_korean: “차지할”
  alternatives_korean:
  - “상속받을”
  - “기업으로 받을”
  lexicon: נחל
  rationale: ‘inherit’의 법적/분배적 의미를 살리되 현대 한국어에서 자연스러운 표현으로 ‘차지하다’를 택했습니다. 이 땅의 분배 맥락을 유지합니다.
- source_word: בְּגוֹרָל
  english_pob_choice: by lot
  chosen_korean: “제비뽑기로”
  alternatives_korean:
  - “제비로”
  - “제비를 뽑아”
  lexicon: גורל
  rationale: גורל은 단순 운명이 아니라 분배 수단으로서의 제비를 가리키므로, 절차를 분명히 드러내는 ‘제비뽑기로’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: “야훼”
  alternatives_korean:
  - “주님”
  - “여호와”
  lexicon: יהוה
  rationale: 이 번역 프로젝트의 기본 원칙에 따라 여호와가 아니라 학술적 음역인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 땅의 분배 주체와 권위
  chosen_reading: 땅은 이스라엘이 제비뽑기로 받지만, 그 분배 명령의 최종 권위는 야훼께 있습니다.
  alternative_readings:
  - 단순한 행정적 분배
  - 인간 지도자의 결정
  rationale: 본문은 모세의 명령 형식을 취하지만, 그 내용이 야훼의 명령에 근거함을 분명히 하므로 신적 권위를 약화시키지 않도록 했습니다.
  doctrine_reference: 민수기 34장 전체의 기업 분배 맥락
