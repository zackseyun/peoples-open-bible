  to: 왕은 야훼를 신뢰하며, 지극히 높으신 분의 한결같은 사랑으로[a] 흔들리지 않을 것입니다.[b]
  rationale: 절 참조와 히브리어 원문에 맞도록 본문 전체를 교체했습니다. כִּי는 앞 절을 뒷받침하는 접속사이므로 한국어에서는 별도 접속어 없이 자연스럽게 절을 시작했고, בֹּטֵחַ는 ‘신뢰하며’로, בַּל יִמּוֹט은 미래적 결과를 드러내는 ‘흔들리지 않을 것입니다’로 옮겼습니다. וּבְחֶסֶד의 수단적·상태적 해석 가능성은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
