lexical_decisions:
- source_word: πρὸς ταῦτα
  chosen: In response to this
  alternatives:
  - at this
  - to this
  - in view of this
  lexicon: LSJ
  rationale: The phrase introduces a reaction or reply to what has just been said. 'In response to this' captures the discourse function more naturally in modern English than the more wooden 'to this.'
- source_word: ὑμεῖς μέν
  chosen: you
  alternatives:
  - you indeed
  - for your part, you
  lexicon: BDAG
  rationale: The pronoun is emphatic, and μέν marks contrast or topical emphasis. English can carry this adequately with word order and direct address without forcing an awkward 'you indeed.' The contrastive nuance is light here and does not require explicit expansion.
- source_word: ὦ Ἀβραὰμ παῖδες
  chosen: O children of Abraham
  alternatives:
  - O sons of Abraham
  - O descendants of Abraham
  lexicon: BDAG
  rationale: παῖδες can mean 'children' or 'sons.' 'Children of Abraham' preserves the familial and covenantal resonance while avoiding over-specifying male offspring in English. The vocative particle ὦ is retained as 'O' to preserve the elevated rhetorical tone.
- source_word: εὐγενῶς
  chosen: nobly
  alternatives:
  - worthily
  - bravely
  - in a noble manner
  lexicon: LSJ
  rationale: The adverb denotes noble or high-minded conduct. 'Nobly' is concise, idiomatic, and preserves the moral commendation without narrowing the sense merely to courage.
- source_word: ὑπὲρ τῆς εὐσεβείας
  chosen: for the sake of godliness
  alternatives:
  - for piety
  - on behalf of godliness
  - for reverence toward God
  lexicon: BDAG
  rationale: εὐσέβεια in this Jewish-Greek context refers to piety or reverent devotion to God. 'Godliness' is accessible modern English and keeps the God-directed moral-religious sense clearer than the potentially archaic or narrower 'piety.' 'For the sake of' reflects ὑπέρ well in a martyrdom context.
- source_word: τελευτᾶτε
  chosen: die
  alternatives:
  - meet your end
  - come to your death
  - finish life
  lexicon: BDAG
  rationale: The verb is a dignified expression for dying or coming to one's end. In context, the plain 'die' is both accurate and suitably solemn; the nobility is already conveyed by εὐγενῶς.
