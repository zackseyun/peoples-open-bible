id: ISA.56.3
reference: Isaiah 56:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַל יֹאמַ֣ר בֶּן הַ/נֵּכָ֗ר הַ/נִּלְוָ֤ה אֶל יְהוָה֙ לֵ/אמֹ֔ר הַבְדֵּ֧ל יַבְדִּילַ֛/נִי יְהוָ֖ה מֵ/עַ֣ל עַמּ֑/וֹ וְ/אַל יֹאמַר֙ הַ/סָּרִ֔יס הֵ֥ן אֲנִ֖י עֵ֥ץ יָבֵֽשׁ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/056/003.yaml
  text: Let not the foreigner who has joined himself to the LORD say, “The LORD will surely separate me from his people”; and let not the eunuch say, “Look, I am a dry tree.”
translation:
  language: ko
  text: 야훼께 붙은 이방인은 “야훼께서 반드시 나를 자기 백성에게서 갈라놓으실 것이다”라고 말하지 마십시오. 내시도 “보십시오, 나는 마른 나무입니다”라고 말하지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן הַנֵּכָר הַנִּלְוָה אֶל יְהוָה
  english_pob_choice: the foreigner who has joined himself to the LORD
  chosen_korean: 낯선 사람이 야훼께 붙어 그분께 나아왔다
  alternatives_korean:
  - 이방인이 야훼께 연합한
  - 타국인이 야훼께 몸을 의지한
  lexicon: foreigner / joined himself
  rationale: נֵכָר은 단순한 '외국인'보다 공동체 밖의 '낯선 사람'을 살리는 편이 문맥상 자연스럽고, נִלְוָה는 '붙다/동행하다'의 능동적 참여를 드러내어 '붙어 그분께 나아왔다'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: YHWH
  rationale: 원문 고유명사 יהוה를 POB 기본 원칙에 따라 '야훼'로 옮기고, 일반적인 '주'로 평준화하지 않았습니다.
- source_word: הַבְדֵּל יַבְדִּילַנִי
  english_pob_choice: will surely separate me
  chosen_korean: 반드시 나를 … 갈라놓으실 것이다
  alternatives_korean:
  - 완전히 나를 떼어 놓으실 것이다
  - 반드시 나를 분리하실 것이다
  lexicon: separate
  rationale: 중첩 동사형은 강한 강조를 나타내므로 '반드시'와 '갈라놓으실 것이다'로 강조와 분리를 함께 살렸습니다.
- source_word: הַסָּרִיס
  english_pob_choice: the eunuch
  chosen_korean: 내시
  alternatives_korean:
  - 환관
  - 궁중 관리
  lexicon: eunuch
  rationale: 문맥상 신체적 상태를 가리키는 표준어 '내시'가 직설적이며, 원문의 사회적·신체적 결핍을 완화하지 않습니다.
- source_word: עֵץ יָבֵשׁ
  english_pob_choice: a dry tree
  chosen_korean: 마른 나무
  alternatives_korean:
  - 메마른 나무
  - 죽은 나무
  lexicon: dry tree
  rationale: 비유를 자연스럽게 살리되, 생명 없음과 열매 없음의 이미지를 과장하지 않도록 '마른 나무'로 옮겼습니다.
theological_decisions:
- issue: 명령 부정문과 발화체의 공손성
  chosen_reading: '''말하지 못하게 하십시오''로 번역해 예언적 금지의 권위를 살리면서도 현대 한국어 합쇼체를 유지했습니다.'
  alternative_readings:
  - 말하지 말라고 하십시오
  - 말하지 못하게 하소서
  rationale: 본문은 공동체를 향한 예언적 금지이므로 직접 명령보다 금지 조항의 기능이 드러나야 하며, 합쇼체로 공적 선언의 톤을 유지하는 것이 적절합니다.
  doctrine_reference: 예언서의 권면/금지 발화
- issue: 야훼 호칭 유지
  chosen_reading: 본문의 יְהוָה를 '야훼'로 유지했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 인용문 안팎에서 동일한 신명 표지를 유지해, 언약적 주체가 누구인지 흐리지 않도록 했습니다.
  doctrine_reference: Tetragrammaton / divine name consistency
