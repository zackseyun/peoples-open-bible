source:
  edition: WLC
  text: מִ/נֹּ֗גַהּ נֶ֫גְדּ֥/וֹ עָבָ֥י/ו עָבְר֑וּ בָּ֝רָ֗ד וְ/גַֽחֲלֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/012.yaml
  text: Out of the brightness before him, his clouds passed by—hail and coals of fire.
translation:
  language: ko
  text: 그 앞의 광채로 말미암아 그의 짙은 구름들이 지나갔습니다—우박과 불의 숯불도 그러했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 짙은 구름들이 지나갔습니다—우박과 불의 숯불.’ 히브리어는 마지막의 ‘우박과 불의 숯불’에 동사를 반복하지 않는 압축적인 시어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֶׁת
  english_pob_choice: He made
  chosen_korean: 삼으시고
  alternatives_korean:
  - 만드셨고
  - 두셨고
  lexicon: HALOT
  rationale: 시편의 시적 문맥에서 ‘어둠을 …로 삼다’는 용법이 원문의 조성·배치 의미를 자연스럽게 살리며, POB의 ‘He made’가 나타내는 성립/설정의 뜻도 충분히 반영합니다.
- source_word: סִתְרוֹ
  english_pob_choice: his hiding place
  chosen_korean: 자기의 숨는 곳
  alternatives_korean:
  - 자기의 은밀한 곳
  - 자기의 숨을 곳
  lexicon: HALOT
  rationale: סתר의 핵심은 ‘숨김/은폐’이므로, 장소성을 살린 ‘숨는 곳’이 ‘secret place’보다 더 직관적이며, 신학적 해석을 덧붙이지 않습니다.
- source_word: סֻכָּתוֹ
  english_pob_choice: his shelter
  chosen_korean: 자기의 초막
  alternatives_korean:
  - 자기의 천막
  - 자기의 장막
  - 자기의 피난처
  lexicon: HALOT
  rationale: 이 어휘는 문자적으로 ‘초막/막’의 뜻이 강하므로, 본문의 시적 이미지와 더 맞는 ‘초막’을 택했습니다. POB의 ‘shelter’는 기능을 드러내지만, 히브리어의 형상을 보존하기 위해 보다 직접적인 표현을 사용했습니다.
- source_word: חֶשְׁכַת מַיִם
  english_pob_choice: dark waters
  chosen_korean: 물의 어둠
  alternatives_korean:
  - 어두운 물
  - 물의 칠흑
  lexicon: HALOT
  rationale: 히브리어의 명사구를 그대로 살려 ‘물의 어둠’으로 옮겨, 단순히 ‘어두운 물’로 풀어버리기보다 시적 결합과 묵직한 분위기를 보존했습니다.
- source_word: עָבֵי שְׁחָקִים
  english_pob_choice: thick clouds of the skies
  chosen_korean: 하늘의 짙은 구름
  alternatives_korean:
  - 하늘의 두터운 구름
  - 창공의 짙은 구름
  lexicon: HALOT
  rationale: עָבֵי는 ‘짙은/두터운’, שְׁחָקִים은 시어로서 ‘하늘/창공’을 가리키므로, 현대 한국어에서 자연스러운 ‘하늘의 짙은 구름’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 어둠/숨김 이미지의 해석
  chosen_reading: 어둠을 하나님의 현현을 가리는 시적 숨김으로 그대로 두고, 도덕적 악이나 본질적 어둠으로 해석하지 않았습니다.
  alternative_readings:
  - 심판의 상징으로 해석
  - 성전/장막 이미지로 단정
  rationale: 히브리어는 폭풍-신현(theophany) 이미지의 병렬을 제시할 뿐이므로, 본문이 넘어서지 않는 해석을 피하고 시적 긴장을 유지하는 것이 바람직합니다.
  doctrine_reference: 'Translation philosophy §3: 문맥이 요구하지 않는 신학적 결론을 번역에 주입하지 않기'
