  from: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
  to: With many such parables he spoke the word to them, as much as they could take in.
  rationale: The recorded decisions rightly preserve 'the word' and caution against equating hearing with full understanding. I keep that tension but go beyond lexical surface wording so that English readers recognize the audience’s limited capacity to absorb the teaching.
