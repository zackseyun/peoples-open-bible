  chosen_reading: when a feast is consecrated
  alternative_readings:
  - when a feast is sanctified
  - on the night a feast is kept holy
  rationale: The phrase refers to a festival being set apart as holy, likely evoking pilgrimage worship. 'Consecrated' preserves the sacred setting without importing later doctrinal claims.
