  from: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
  to: You will roll them up like a cloak; like a garment they will be changed. But you remain the same, and your years will never end.”
  rationale: The lexical record itself offers “will never end” and explains “will not fail” as unending duration. I make that meaning explicit while preserving the cloak, garment, and enduring-years imagery.
