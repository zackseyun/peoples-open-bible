  text: Ἐκ τοῦ πρώτου ὄρους τοῦ μέλανος οἱ πιστεύσαντες τοιοῦτοί εἰσιν· ἀποστάται καὶ βλάσφημοι εἰς τὸν
    Κύριον καὶ προδόται τῶν δούλων τοῦ Θεοῦ. τούτοις δὲ μετάνοια οὐκ ἔστι, θάνατος δὲ ἔστι, καὶ διὰ τοῦτο
    καὶ μέλανές εἰσι· καὶ γὰρ τὸ γένος αὐτῶν ἄνομόν ἐστιν. 2. ἐκ δὲ τοῦ δευτέρου ὄρους τοῦ ψιλοῦ οἱ πιστεύσαντες
    τοιοῦτοί εἰσιν· ὑποκριταὶ καὶ διδάσκαλοι πονηρίας. καὶ οὗτοι οὖν τοῖς προτέροις ὅμοιοί εἰσι, μὴ ἔχοντες
    καρπὸν δικαιοσύνης· ὡς γὰρ τὸ ὄρος αὐτῶν ἄκαρπον, οὕτω καὶ οἱ ἄνθρωποι οἱ τοιοῦτοι ὄνομα μὲν ἔχουσιν,
    ἀπὸ δὲ τῆς πίστεως κενοί εἰσι, καὶ οὐδεὶς ἐν αὐτοῖς καρπὸς ἀληθείας. τούτοις οὖν μετάνοια κεῖται,
    ἐὰν ταχὺ μετανοήσωσιν· ἐὰν δὲ βραδύνωσι, μετὰ τῶν προτέρων ἔσται ὁ θάνατος αὐτῶν. 3. Διατί, φημί,
    κύριε, τούτοις μετάνοιά ἐστι, τοῖς δὲ προτέροις οὐκ ἔστι; παρά τι γὰρ αἱ αὐταὶ αἱ πράξεις αὐτῶν εἰσί.
    Διὰ τοῦτο, φησί, τούτοις μετάνοια κεῖται, ὅτι οὐκ ἐβλασφήμησαν τὸν Κύριον αὐτῶν· οὐδὲ ἐγένοντο προδόται
    τῶν δούλων τοῦ Θεοῦ, διὰ δὲ τὴν ἐπιθυμίαν τοῦ λήμματος ὑπεκρίθησαν καὶ ἐδίδαξεν ἕκαστος [κατὰ] τὰς
    ἐπιθυμίας τῶν ἀνθρώπων τῶν ἁμαρτανόντων. ἀλλὰ τίσουσι δίκην τινά· κεῖται δὲ αὐτοῖς μετάνοια διὰ τὸ
    μὴ γενέσθαι αὐτοὺς βλασφήμους μηδὲ προδότας.
