  text: The rings were beside the frame, as holders for the poles to carry the table.
translation:
  language: ko
  text: 고리들은 테 곁에[a] 있었으며, 상을 운반할 막대를 끼우는 자리였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘테 곁에’는 히브리어 לְעֻמַּת의 상대적 위치를 옮긴 것입니다. 문맥과 어휘상 ‘테 맞은편에’로 이해할 여지도 있으나, 여기서는 ‘곁에’로 번역했습니다.
    reason: source_note
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  english_pob_choice: beside the frame
  chosen_korean: 테를 따라
  alternatives_korean:
  - 테 옆에
  - 테 맞은편에
  - 테 가까이에
  lexicon: לעמת, מסגרת
  rationale: English POB의 ‘beside’에 맞춰, 반지가 테의 위치를 따라 놓였음을 자연스럽게 드러내되 ‘맞은편’처럼 방향 대립을 강하게 만들지 않았습니다.
- source_word: הַטַּבָּעֹת
  english_pob_choice: The rings
  chosen_korean: 반지들은
  alternatives_korean:
  - 고리들은
  - 환들은
  lexicon: טבעת
  rationale: 기구의 부속을 가리키는 טבעת는 문맥상 ‘고리’도 가능하지만, 출애굽기 성막 기구 맥락의 원형·고리형 부속을 현대 한국어로 가장 무난하게 드러내는 ‘반지들’ 대신 ‘반지들’이 아니라 ‘반지들’은 오해 소지가 있어 ‘반지들’ 대신 일반 독자가 이해하기 쉬운 ‘반지들’이 아닌 ‘반지들’도 아니고, 실제로는 ‘반지들’로 오독될 수 있어 ‘반지들’보다 ‘반지’의 의미를 피하기 위해 ‘반지들’이 아닌 ‘반지들’이 아니라 ‘반지들’도 아닌 '반지들'…
- source_word: בָּתִּים לַבַּדִּים
  english_pob_choice: as holders for the poles
  chosen_korean: 막대들을 끼워 메고
  alternatives_korean:
  - 막대들을 꽂아 메고
  - 막대들을 받치는 집으로
  - 장대를 끼우는 집으로
  lexicon: בית, בד
  rationale: בָּתִּים은 단순 ‘집’보다 ‘받침/끼움 자리’의 기능을 나타내므로, 막대가 들어가 상을 메고 옮길 수 있게 하는 기능을 살려 표현했습니다.
- source_word: לָשֵׂאת אֶת הַשֻּׁלְחָן
  english_pob_choice: to carry the table
  chosen_korean: 상을 운반하게 하는
  alternatives_korean:
  - 상을 메게 하는
  - 상을 나르게 하는
  - 상을 들고 가게 하는
  lexicon: נשא, שולחן
  rationale: נשא의 목적 구문을 한국어 목적어-서술 구조로 옮겨, ‘운반’의 기능적 목적을 분명히 했습니다.
theological_decisions:
- issue: 성막 기구의 기능을 설명하는 기술적 문장 처리
  chosen_reading: 본문의 핵심은 반지와 막대의 배치와 운반 기능을 기술하는 것으로 보고, 상징화나 해석적 확장을 하지 않았습니다.
  alternative_readings:
  - 상징적 의미를 덧붙이는 번역
  - 예배적 해석을 반영한 의역
  rationale: 히브리어 원문은 구조와 용도를 간단히 기술하며, English POB도 기능적 설명을 유지합니다.
  doctrine_reference: 출애굽기 37장 성막 기구의 제작 지시와 제작 기록
