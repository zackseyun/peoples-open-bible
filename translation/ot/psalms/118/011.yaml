  from: They surrounded me[a], yes, they surrounded me[b][c]; in the name of Yahweh I cut them down.
  to: They surrounded me; yes, they surrounded me. In the name of Yahweh, I cut them off.
  rationale: The current note placement is corrupt and the note claiming a LORD rendering contradicts the stated Yahweh policy. מול in this refrain is best kept as the less directional “cut them off,” rather than “cut them down.” The proposed “surely” for כי is possible but needlessly fixes a debated nuance; the terse refrain is more source-faithful without it.
