translation:
  text: And I said, “This tree is beautiful, and how [beautiful and] delightful its appearance is!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The selected edited Geʽez brackets “beautiful and” in the second clause; Charles 1906 printed p74 note2
      recommends omitting those words with G and q. The brackets in English expose that editorial uncertainty rather
      than treating the words as secure in all witnesses. No tree species is identified here.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ወእቤ
  chosen: And I said
  alternatives:
  - and I spoke
  - then I said
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The conjunction ወ commonly carries simple narrative continuation, and እቤ is the first-person singular
    preterite of 'to say/speak.' In this brief visionary exchange, 'And I said' preserves the narrative sequence
    and directness.
- source_word: ሠናይዝ
  chosen: It is beautiful
  alternatives:
  - good
  - pleasant
  - fine
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: The form appears to derive from ሠናይ, 'good, beautiful, pleasant.' Because the verse as transmitted
    is extremely short and likely elliptical in direct speech, an English predicate is required for intelligibility.
    'Beautiful' best fits the immediate visionary/travel context, where Enoch is reacting to what he sees, while
    still preserving the evaluative force of the Ge'ez.
- source_word: '[ሠናይ፡ ወ]ፍሡሕ፡ ርእየቱ'
  chosen: '[beautiful and] delightful its appearance'
  alternatives:
  - delightful to behold
  lexicon: Charles 1906 printed p74 selected text and apparatus note2
  rationale: The brackets disclose words recommended for omission with G and q; the remainder describes pleasing
    appearance without identifying a species.
