id: PSA.78.46
reference: Psalms 78:46
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לֶ/חָסִ֣יל יְבוּלָ֑/ם וִֽ֝/יגִיעָ֗/ם לָ/אַרְבֶּֽה׃
translation:
  text: He gave their produce to devouring insects[a], and the fruit of their labor to locusts.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The Hebrew uses two different terms for crop-devouring insects; their precise kinds or stages are uncertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  chosen: He gave
  alternatives:
  - He delivered
  - He handed over
  lexicon: HALOT
  rationale: The waw-consecutive verb from נתן is straightforwardly rendered 'gave.' In context of judgment, 'handed over' is possible, but 'gave' preserves the Hebrew idiom and lets the object/complement structure carry the sense.
- source_word: לֶחָסִיל
  chosen: to the devouring locust
  alternatives:
  - to the caterpillar
  - to the consuming locust
  lexicon: HALOT
  rationale: חָסִיל denotes a crop-devouring insect, often treated as a kind of locust in plague contexts. 'Devouring locust' communicates the likely referent and preserves the destructive nuance better than the traditional but potentially misleading 'caterpillar.'
- source_word: יְבוּלָם
  chosen: their produce
  alternatives:
  - their crops
  - their yield
  lexicon: HALOT
  rationale: יְבוּל refers to produce or yield of the land. 'Produce' is natural modern English and broad enough to include agricultural output generally.
- source_word: וִיגִיעָם
  chosen: the fruit of their labor
  alternatives:
  - the fruit of their labor
  - their toil
  lexicon: HALOT
  rationale: In parallel with agricultural produce and as the thing surrendered to the insect, it denotes what labor produced.
- source_word: לָאַרְבֶּה
  chosen: to the locust
  alternatives:
  - to the locust
  - to the grasshopper
  lexicon: HALOT
  rationale: אַרְבֶּה is the ordinary locust term; “swarming” is not lexically supplied.
- source_word: חָסִיל
  chosen: the devourer
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: The term carries a consuming/destructive sense, but its exact insect referent is uncertain.
