  from: But if there are matters that should be brought before the king[a], send someone at once to look into these things, so that we may act as is fitting for us; for we are going on to Antioch.
  to: As for the matters Lysias decided should be brought before the king, send someone at once to discuss them with us, so that we can act as we should, for we are on our way to Antioch.
  rationale: The earlier rationale treated the singular verb as an impersonal expression and supplied an unsupported 'if.' The immediate reference to Lysias provides its subject and restores the distinction between his granted concessions and matters requiring the king’s decision.
