  from: Remove your stroke from me[a]; because of the attack of your hand, I am spent.[b]
  to: Remove the affliction you have brought on me; the attack of your hand has left me spent.
  rationale: The latest review rightly rejected the disease-specific “plague,” distinguished an attack from a mere blow, and chose the broad “spent.” I preserve those judgments while making the source of the affliction and its effect more immediately clear.
