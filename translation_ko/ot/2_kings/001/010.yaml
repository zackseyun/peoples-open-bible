base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: ko
  text: 엘리야가 대답하여 그 오십부대의 지휘관에게 말했습니다. “그러나 내가 하나님의 사람이라면, 하늘에서 불이 내려와 당신과 당신의 오십 명을 삼키게 하소서.” 그러자 하늘에서 불이 내려와 그와 그의 오십 명을 삼켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  english_pob_choice: a man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님 사람
  - 하나님의 종
  lexicon: אִישׁ
  rationale: 히브리어 관용구를 직역에 가깝게 살리되, 엘리야의 소명과 권위를 드러내는 POB의 ‘man of God’ 의미를 유지하기 위해 ‘하나님의 사람’으로 옮겼습니다.
- source_word: שַׂר הַחֲמִשִּׁים
  english_pob_choice: the captain of fifty
  chosen_korean: 오십부대의 지휘관
  alternatives_korean:
  - 오십 명의 대장
  - 오십인의 우두머리
  lexicon: שַׂר
  rationale: 군사적 지휘 직분을 분명히 하면서도 현대 한국어에서 자연스럽게 읽히도록 ‘지휘관’으로 옮겼습니다.
- source_word: תֵרֶד אֵשׁ מִן הַשָּׁמַיִם ... וְתֹאכַל
  english_pob_choice: let fire come down from heaven and consume
  chosen_korean: 하늘에서 불이 내려와 … 삼키게 하십시오
  alternatives_korean:
  - 하늘에서 불이 내려와 … 태우게 하십시오
  - 하늘에서 불이 내려와 … 소멸하게 하십시오
  lexicon: אֵשׁ / אָכַל
  rationale: ‘consume’는 단순히 태우는 것보다 완전히 집어삼키는 파괴를 가리키므로, 서술의 강도를 살려 ‘삼키다’로 번역했습니다.
theological_decisions:
- issue: 하늘에서 내려온 불의 심판 묘사
  chosen_reading: 본문의 심판 행위를 완화하지 않고, 하나님의 승인된 응답으로서의 파괴적 불을 그대로 유지했습니다.
  alternative_readings:
  - 상징적 경고로 완화
  - ‘태우다’로 중화
  rationale: 열왕기하 1장의 문맥은 엘리야의 예언적 권위와 야훼의 심판을 직접 드러내므로, 서술의 폭력성과 심판성을 약화하지 않는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 열왕기하 1:9-12 문맥
- issue: ‘But if’의 역접
  chosen_reading: ‘그러나 내가 하나님의 사람이라면’으로 역접을 살렸습니다.
  alternative_readings:
  - ‘내가 하나님의 사람이라면’
  - ‘만일 내가 하나님의 사람이라면’
  rationale: English POB의 최신 판독이 ‘But if’를 보존하고 있어, 엘리야의 선언이 단순 조건이 아니라 대결적 반박임을 드러내도록 했습니다.
  doctrine_reference: 2 Kings 1:10 revisions
