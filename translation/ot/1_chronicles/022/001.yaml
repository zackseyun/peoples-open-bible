  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Whether to render בֵּית יְהוָה הָאֱלֹהִים as 'house' or 'temple'
  chosen_reading: the house of Yahweh God
  alternative_readings:
  - the temple of the LORD God
  rationale: Although the context concerns the temple site, the Hebrew text itself says 'house.' Preserving 'house' avoids importing a more interpretive architectural term and retains biblical-theological resonance.
