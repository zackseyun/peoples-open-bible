  terminology: ‘처녀’, ‘동침’, ‘진영’, ‘실로’는 본문의 서사적·군사적 및 성적 표현을 지나치게 완화하지 않고 적절히 보존합니다. ‘동침한 적이 없는’은 ידע와 למשכב זכר의 결합이 가리키는 성적 경험의 부재를 현대 표준어로 정확히 나타냅니다.
