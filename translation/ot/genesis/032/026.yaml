  category: meaning_retranslation
  from: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
  to: When the man saw that he could not prevail against Jacob, he touched Jacob’s hip socket, and Jacob’s hip was dislocated as they wrestled.
  rationale: The earlier decisions rightly retained “touched” and “prevail,” preserving the scene’s striking tension. Their concern about the figure’s theological identity does not require obscuring which participant acts, so I identify only the man and Jacob, as the narrative already does.
