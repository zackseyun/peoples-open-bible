lexical_decisions:
- source_word: ἀριθμὸς ἡμερῶν ἀνθρώπου
  choice: Число дней человека
  rationale: Буквально и естественно передаёт греческую конструкцию, сохраняя обобщённое значение ἀνθρώπου.
- source_word: πολλὰ ἔτη
  choice: много лет
  rationale: Сохраняет прямое значение греческого текста и его напряжённое соположение с последующим уточнением «сто», не добавляя отсутствующего в источнике «не более».
- source_word: ἑκατόν
  choice: сто
  rationale: Передаёт отдельное заключительное числительное и сохраняет его эмфатическую позицию.
theological_decisions:
- issue: Является ли сто лет строгим верхним пределом человеческой жизни
  choice: Не добавлять значение верхнего предела
  alternative: «не более ста лет» или «самое большее — сто лет»
  rationale: В греческом тексте нет выражения «не более»; перевод сохраняет необычную формулировку и не разрешает её смысл сверх источника.
