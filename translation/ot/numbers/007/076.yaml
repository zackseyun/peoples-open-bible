  rationale: The Hebrew term can denote either 'sin' or the offering associated with sin/purification. In Levitical and priestly sacrificial lists, the offering sense is clearly intended here. 'Sin offering' remains the most recognizable English rendering, while 'purification offering' is a defensible contextual alternative worth preserving in a footnote because the rite addresses ritual purification as well as sin.
