  from: For an enemy has pursued my soul[a]; he has crushed my life to the ground; he has made me dwell in dark places[b], like those long dead.
  to: For an enemy has pursued me[a]; he has crushed my life to the ground; he has made me dwell in dark places, like those long dead[b].
  rationale: Here נַפְשִׁי is a common Hebrew reference to the person as the object of pursuit. “Pursued my soul” is misleadingly literal English, while “me” is idiomatic and does not erase the distinct subsequent term חַיָּתִי, “my life.” The final-phrase note is also correctly relocated.
