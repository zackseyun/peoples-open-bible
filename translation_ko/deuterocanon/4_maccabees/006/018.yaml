  - severity: low
    issue: ἐπ’ αὐτῶν의 선행사를 단수 ‘그 위’로 고정함
    rationale: αὐτῶν은 복수이며 앞선 진실한 삶과 관련 요소들을 가리킬 수 있습니다. ‘그에 바탕을 둔’은 한국어에서 자연스럽게 문맥적 포괄성을 남깁니다.
  - severity: low
