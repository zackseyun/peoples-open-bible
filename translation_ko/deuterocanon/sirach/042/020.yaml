  source_fidelity: 첫 행은 히브리어 'לא נעדר ממנו כל שכל' 및 그리스어 병행문과 잘 맞습니다. 둘째 행의 히브리어 דבר는 ‘말’뿐 아니라 ‘일/사안’도 뜻할 수 있으나, 그리스어 λόγος 및 확정된 영어 POB ‘word’를 따라 ‘말’로 옮기는 것은 가능합니다. 다만 ‘어떤 말도 그를 지나치지 않았습니다’는 한국어에서 다소 부자연스럽고, ‘그를 피해 지나가지 않았습니다’가 ‘그에게서 숨거나 빠져나가지 않았다’는 뜻을 더 분명하게 전달합니다.
  naturalness: ‘어떤 이해도 부족하지 않고’도 이해되지만, ‘어떤 이해도 부족한 것이 없고’가 현대 표준 한국어에서 결핍 없음의 의미를 더 자연스럽고 명료하게 표현합니다. 둘째 행은 주어 ‘말’과 ‘지나치다’의 결합을 ‘피해 지나가다’로 다듬는 것이 자연스럽습니다.
  terminology: שכל은 ‘이해’로 유지하는 것이 적절합니다. דבר/λόγος는 본문 및 영어 POB에 맞추어 ‘말’로 유지하되, 히브리어의 더 넓은 뜻은 각주에서 제한적으로 밝혀 두는 것이 안전합니다. ‘말씀’은 본문에 없는 종교적 뉘앙스를 더할 수 있으므로 사용하지 않습니다.
