  source_fidelity: 현 초안은 시편 22:7이 아니라 바로 앞 절인 22:6(‘나는 벌레요…’)에 해당하는 히브리어와 내용을 번역하고 있습니다. 22:7의 히브리어는 ‘나를 보는 모든 이가 나를 조롱하고, 입술로 경멸의 몸짓을 하며, 머리를 흔든다’는 내용입니다. 따라서 본문과 모든 주석 표지를 해당 절에 맞게 교체해야 합니다.
