theological_decisions:
- issue: Rendering רָע in relation to divine agency
  chosen_reading: calamity
  alternative_readings:
  - disaster
  - evil
  rationale: The source explicitly makes Yahweh the agent of both the positive and adverse conditions. The retained shalom contrast and contextual lexical evidence favor calamity in the main, but evil remains a disclosed alternative. This rendering does not resolve a doctrine of divine causation or exclude an alternative because of its theological consequences.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The source writes the Tetragrammaton directly. Yahweh follows the current documented divine-name rule and matches the main English. The older statement about revelation at Sinai is archived, not carried forward as source evidence; no etymological or historical-origin decision is made here.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
