id: PRO.29.24
reference: Proverbs 29:24
source:
  edition: WLC
  text: חוֹלֵ֣ק עִם גַּ֭נָּב שׂוֹנֵ֣א נַפְשׁ֑/וֹ אָלָ֥ה יִ֝שְׁמַ֗ע וְ/לֹ֣א יַגִּֽיד־׃
translation:
  text: Whoever shares in a thief's loot hates his own life; he hears the call to testify under oath[a] but does not testify.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: This public summons invoked a curse on anyone who withheld what he knew; compare Leviticus 5:1.
    reason: cultural_note
lexical_decisions:
- source_word: חוֹלֵק
  chosen: shares
  alternatives:
  - is a partner with
  - divides with
  - has a share with
  lexicon: HALOT
  rationale: The participle denotes sharing/participating with someone. In context with עִם גַּנָּב, it refers to complicity or partnership with a thief. 'Shares with' is concise and natural, while preserving the idea of participation in stolen gain or criminal enterprise.
- source_word: עִם גַּנָּב
  chosen: with a thief
  alternatives:
  - with the thief
  - in partnership with a thief
  lexicon: HALOT
  rationale: The preposition plus noun marks association. The indefinite 'a thief' fits proverbial style in English better than 'the thief' and preserves the generic force.
- source_word: שׂוֹנֵא נַפְשׁוֹ
  chosen: hates his own life
  alternatives:
  - hates himself
  - hates his own soul
  lexicon: HALOT
  rationale: נֶפֶשׁ can mean life, self, or soul depending on context. Here the proverb concerns self-destructive conduct, so 'life' best communicates the practical sense without importing a more dualistic 'soul' reading. 'His own' makes the reflexive force explicit.
- source_word: אָלָה
  chosen: an adjuration
  alternatives:
  - a curse
  - an adjuration
  lexicon: HALOT
  rationale: In this setting the word denotes a curse-bearing oath or public adjuration, not merely a generic curse.
- source_word: יִשְׁמַע
  chosen: he hears
  alternatives:
  - he hears the call
  - he is put under oath
  lexicon: HALOT
  rationale: The verb is simply 'hear.' In context it likely refers to hearing a public oath/adjuration in a judicial setting, but the Hebrew wording itself is not more specific than 'he hears.'
- source_word: וְלֹא יַגִּיד
  chosen: does not testify
  alternatives:
  - and does not tell
  - and does not testify
  - and does not disclose it
  lexicon: HALOT
  rationale: The verb means tell or declare; in the legal idiom, “testify” is the natural English expression.
