  rationale: 원문 우선 원칙에 따라, 서로 다른 절을 번역한 현 초안을 시편 41:2의 히브리어 내용으로 교정했습니다. 첫 두 동사는 야훼에 대한 미래의 서술로, 마지막 동사는 야훼께 드리는 2인칭 부정 청원으로 번역했습니다. וְאֻשַּׁר의 수동적·선언적 뉘앙스는 보존하되, ‘땅’의 범위나 원수들의 ‘욕망’에 관한 해석은 각주에서 대안을 제시하여 본문의 모호성을 과도하게 확정하지 않았습니다.
