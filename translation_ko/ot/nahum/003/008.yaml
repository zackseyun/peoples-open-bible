  rationale: 원문의 수사 의문문, 노아몬의 물로 둘린 입지, 그리고 요새와 성벽의 병렬 은유를 유지했습니다. 특히 난해하지만 본문에 있는 מִיָּם의 ‘바다에서/바다로부터’라는 표현을 ‘바다에서 나온 것’으로 보존하여, 이를 단순히 ‘바다가 성벽’이라고 평탄화하지 않았습니다.
