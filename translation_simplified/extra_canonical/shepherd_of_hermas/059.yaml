  text: Μετὰ ἡμέρας ὀλίγας εἶδον αὐτὸν εἰς τὸ πεδίον τὸ αὐτὸ ὅπου καὶ τοὺς ποιμένας ἑωράκειν, καὶ λέγει
    μοι· Τί ἐπιζητεῖς ; Πάρειμι, φημί, κύριε, ἵνα τὸν ποιμένα τὸν τιμωρητὴν κελεύσῃς ἐκ τοῦ οἴκου μου
    ἐξελθεῖν, ὅτι λίαν με θλίβει. Δεῖ σε, φησί, θλιβῆναι· οὕτω γάρ, φησί, προσέταξεν ὁ ἔνδοξος ἄγγελος
    τὰ περὶ σοῦ· θέλει γάρ σε πειρασθῆναι. Τί γάρ, φημί, κύριε, ἐποίησα οὕτω πονηρόν, ἵνα τῷ ἀγγέλῳ τούτῳ
    παραδοθῶ ; 2. Ἄκουε, φησίν· αἱ μὲν ἁμαρτίαι σου πολλαί, ἀλλ' οὐ τοσαῦται ὥστε τῷ ἀγγέλῳ τούτῳ παραδοθῆναι·
    ἀλλ' ὁ οἶκός σου μεγάλας ἀνομίας καὶ ἁμαρτίας εἰργάσατο, καὶ παρεπικράνθη ὁ ἔνδοξος ἄγγελος ἐπὶ τοῖς
    ἔργοις αὐτῶν, καὶ διὰ τοῦτο ἐκέλευσέ σε χρόνον τινὰ θλιβῆναι, ἵνα κἀκεῖνοι μετανοήσωσι καὶ καθαρίσωσιν
    ἑαυτοὺς ἀπὸ πάσης ἐπιθυμίας τοῦ αἰῶνος τούτου. ὅταν οὖν μετανοήσωσι καὶ καθαρισθῶσι, τότε ἀποστήσεται
    ὁ ἄγγελος τῆς τιμωρίας. 3. λέγω αὐτῷ· Κύριε, εἰ ἐκεῖνοι τοιαῦτα εἰργάσαντο ἵνα παραπικρανθῇ ὁ ἔνδοξος
    ἄγγελος, τί ἐγὼ ἐποίησα ; Ἄλλως, φησίν, οὐ δύνανται ἐκεῖνοι θλιβῆναι, ἐὰν μὴ σὺ ἡ κεφαλὴ τοῦ οἴκου
    [ὅλου] θλιβῇς· σοῦ γὰρ θλιβομένου ἐξ ἀνάγκης κἀκεῖνοι θλιβήσονται, εὐσταθοῦντος δὲ σοῦ οὐδεμίαν δύνανται
    θλῖψιν ἔχειν. 4. Ἀλλ' ἰδού, φημί, κύριε, μετανενοήκασιν ἐξ ὅλης καρδίας αὐτῶν. Οἶδα, φησί, κἀγὼ ὅτι
    μετανενοήκασιν ἐξ ὅλης καρδίας αὐτῶν· τῶν οὖν μετανοούντων εὐθὺς δοκεῖς τὰς ἁμαρτίας ἀφίεσθαι; οὐ
    παντελῶς· ἀλλὰ δεῖ τὸν μετανοοῦντα βασανίσαι τὴν ἑαυτοῦ ψυχὴν καὶ ταπεινοφρονῆσαι ἐν πάσῃ πράξει αὐτοῦ
    ἰσχυρῶς καὶ θλιβῆναι ἐν πάσαις θλίψεσι ποικίλαις· καὶ ἐὰν ὑπενέγκῃ τὰς θλίψεις τὰς ἐπερχομένας αὐτῷ,
    πάντως σπλαγχνισθήσεται ὁ τὰ πάντα κτίσας καὶ ἐνδυναμώσας καὶ ἴασίν τινα δώσει· 5. καὶ τοῦτο ὅταν
    [ὁ Θεὸς] τοῦ μετανοοῦντος καθαρὰν ἴδῃ τὴν καρδίαν ἀπὸ παντὸς πονηροῦ πράγματος. σοὶ δὲ συμφέρον ἐστὶ
    καὶ τῷ οἴκῳ σου νῦν θλιβῆναι. τί δέ σοι πολλὰ λέγω; θλιβῆναί σε δεῖ, καθὼς προσέταξεν ὁ ἄγγελος Κυρίου
    ἐκεῖνος, ὁ παραδιδοὺς σε ἐμοί· καὶ τοῦτο εὐχαρίστει τῷ Κυρίῳ ὅτι ἄξιόν σε ἡγήσατο τοῦ προδηλῶσαί σοι
    τὴν θλῖψιν, ἵνα προγνοὺς αὐτὴν ὑπενέγκῃς ἰσχυρῶς. 6. λέγω αὐτῷ· Κύριε, σὺ μετ᾽ ἐμοῦ γίνου, καὶ [εὐκόλως]
    δυνήσομαι πᾶσαν θλῖψιν ὑπενεγκεῖν. Ἐγώ, φησίν, ἔσομαι μετὰ σοῦ· ἐρωτήσω δὲ καὶ τὸν ἄγγελον τὸν τιμωρητὴν
    ἵνα σε ἐλαφροτέρως θλίβῃ· ἀλλ᾽ ὀλίγον χρόνον θλιβήσῃ, καὶ πάλιν ἀποκατασταθήσῃ εἰς τὸν οἶκόν σου·
    μόνον παράμεινον ταπεινοφρονῶν καὶ λειτουργῶν τῷ Κυρίῳ ἐν καθαρᾷ καρδίᾳ, καὶ τὰ τέκνα σου καὶ ὁ οἶκός
    σου, καὶ πορεύου ἐν ταῖς ἐντολαῖς μου αἷς σοι ἐντέταλμαι, καὶ δυνήσεταί σου ἡ μετάνοια ἰσχυρὰ καὶ
    καθαρὰ εἶναι· 7. καὶ ἐὰν ταύτας φυλάξῃς μετὰ τοῦ οἴκου σου, ἀποστήσεται πᾶσα θλῖψις ἀπὸ σοῦ· καὶ ἀπὸ
    πάντων δέ, φησίν, ἀποστήσεται θλῖψις, ὅσοι ἐὰν ἐν ταῖς ἐντολαῖς μου ταύταις πορευθῶσιν.
