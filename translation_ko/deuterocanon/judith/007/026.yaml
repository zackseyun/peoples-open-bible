  text: And now call them, and hand over the whole city as plunder to the people of Holofernes and to all his force.
translation:
  language: ko
  text: 이제 그들을 부르고, 온 성을 홀로페르네스의 백성과 그의 모든 병력에게 약탈물로 넘겨 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλέσασθε
  english_pob_choice: call them
  chosen_korean: 그들을 부르고
  alternatives_korean:
  - 그들을 소집하고
  - 그들을 부르십시오
  lexicon: ἐπικαλέομαι
  rationale: 문맥상 단순한 호출이 아니라 사람들을 불러 모으는 명령이므로, POB의 'call them'을 따라 자연스럽게 '부르고'로 옮겼습니다.
- source_word: ἔκδοθε
  english_pob_choice: hand over
  chosen_korean: 넘겨 주십시오
  alternatives_korean:
  - 내주십시오
  - 인도하십시오
  lexicon: ἐκδίδωμι
  rationale: 도시를 적에게 넘겨 주라는 강한 명령을 한국어에서 직접적이고 분명하게 드러내기 위해 '넘겨 주십시오'를 선택했습니다.
- source_word: εἰς προνομὴν
  english_pob_choice: as plunder
  chosen_korean: 노략물로
  alternatives_korean:
  - 약탈물로
  - 전리품으로
  lexicon: προνομή
  rationale: 전투 맥락의 약탈 대상이라는 의미를 살리면서도, 결과 상태를 나타내는 '—로' 구문으로 압축해 표현했습니다.
- source_word: τῷ λαῷ Ὁλοφέρνου καὶ πάσῃ τῇ δυνάμει αὐτοῦ
  english_pob_choice: to the people of Holofernes and to all his force
  chosen_korean: 홀로페르네스의 백성과 그의 모든 군대에게
  alternatives_korean:
  - 홀로페르네스의 사람들과 그의 모든 군세에게
  - 홀로페르네스의 백성과 그의 모든 병력에게
  lexicon: λαός / δύναμις
  rationale: λαός는 집단을 가리키는 '백성'이 가장 직접적이고, δύναμις는 군사력의 집합으로서 '군대'가 문맥상 자연스럽습니다.
theological_decisions:
- issue: 적에게 도시를 넘겨 주라는 명령의 어조
  chosen_reading: 본문의 명령형을 그대로 살려, 권고가 아니라 항복을 촉구하는 강한 요구로 옮겼습니다.
  alternative_readings:
  - 완곡하게 부탁하는 어조로 낮추는 번역
  - 설명적으로 풀어 '항복시키십시오'로 옮기는 번역
  rationale: 헬라어 명령문 두 개가 연속으로 나오므로, 수사적 긴급성과 압박을 약화하지 않는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 본문 주해상 명령의 강도와 서사적 긴장 유지
