lexical_decisions:
- source_word: ὅθεν
  chosen: So
  alternatives:
  - therefore
  - from there
  - whereupon
  lexicon: LSJ
  rationale: In narrative context this inferential/consecutive particle links the previous scene to the action that follows. 'So' gives natural English narrative flow without overtranslating spatial force.
- source_word: ἀπολαβών
  chosen: took him
  alternatives:
  - having taken aside
  - having received
  - having taken charge of
  lexicon: LSJ
  rationale: The participle likely means taking the affected person away/from the scene rather than merely 'receiving.' Because the direct object is implicit in Greek, English must supply it from context; 'him' is the most economical way to represent the understood person being removed.
- source_word: περίστυλον
  chosen: colonnade
  alternatives:
  - peristyle
  - portico
  - courtyard with columns
  lexicon: LSJ
  rationale: περίστυλον denotes a colonnaded area. 'Colonnade' is readable modern English and preserves the architectural sense better than the more technical loanword 'peristyle.'
- source_word: ὡς ἀναψύχοντα
  chosen: as though to revive him
  alternatives:
  - as if refreshing him
  - as though giving him relief
  - as though cooling him
  lexicon: LSJ
  rationale: ἀναψύχω can mean refresh, cool, or revive. In this context of a distressed king being moved to another place, 'revive him' best conveys restoration from faintness or agitation. The participial construction with ὡς expresses apparent purpose or pretext, hence 'as though to.'
- source_word: μετέθηκεν
  chosen: moved
  alternatives:
  - transferred
  - removed
  - relocated
  lexicon: LSJ
  rationale: A straightforward narrative verb of moving/transfer. 'Moved' is idiomatic and sufficiently literal.
- source_word: τὸν βασιλέα
  chosen: the king
  lexicon: LSJ
  rationale: Direct rendering of the accusative object; retained as explicit object of μετέθηκεν in English.
- source_word: ὁ Πτολεμαῖος
  chosen: Ptolemy
  rationale: Standard transliteration of the personal name.
