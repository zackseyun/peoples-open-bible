  text: μεγέθει βραχίονός σου καταπλαγήτωσαν οἱ μετὰ βλασφημίας παραγινόμενοι ἐπὶ τὸν ἅγιον σου λαόν. καὶ οὕτως μὲν ἐν τούτοις ἔληξεν.
