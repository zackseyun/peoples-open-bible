  rationale: The verse itself describes the garment's construction and the soldiers' actions. Possible theological symbolism may be discussed elsewhere, but should not be embedded in the translation.
  doctrine_reference: Preserve theological tension rather than resolve it; do not import doctrinal claims the text does not make.
