theological_decisions:
- issue: Representative masculine language in ἕκαστος
  chosen_reading: Render as 'each one' in the main text while retaining 'he' later in the sentence.
  alternative_readings:
  - Render fully masculine as 'each man ... how he builds'
  - Render fully non-gendered as 'each person ... how they build'
  rationale: The Greek singular masculine is generic rather than exclusively male. 'Each one' captures the representative scope, while retaining singular 'he' keeps the sentence aligned with the Greek's singular construction and the project's gender-accurate policy.
  doctrine_reference: 'Translation philosophy #4 (Gender-accurate over gender-neutral)'
