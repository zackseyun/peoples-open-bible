  text: Τῶν οὖν κατὰ Νικάνορα χωρησάντων οὕτως, καὶ ἀπ᾿ ἐκείνων τῶν καιρῶν κρατηθείσης τῆς πόλεως ὑπὸ τῶν Ἐβραίων, καὶ αὐτὸς αὐτόθι τὸν λόγον καταπαύσω.
