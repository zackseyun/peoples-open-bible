base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/011.yaml
  text: Their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon. And the LORD destroyed them for their evil deeds, because they were very wicked, and he caused the Amorites to dwell in their place, evil and sinful, and there is no people today that has completed all their sins, and they are no more.
  footnotes:
  - marker: a
    text: Or 'judged them'.
    reason: previous_rendering
  - marker: b
    text: Or 'fully completed their sins as they did'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 왕국은 가르나임과 아스타롯과 에드레이와 미수르와 브온이었습니다. 주님께서는 그들의 악한 행위 때문에 그들을 멸하셨습니다. 그들이 매우 악했기 때문입니다. 또 그들의 자리에 아모리 사람들을 살게 하셨는데, 그들도 악하고 죄 많은 자들이었습니다. 오늘날 자기들의 죄를 모두 채운 백성은 없으며, 그들은 더 이상 존재하지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንግሥቶሙ
  english_pob_choice: Their kingdoms
  chosen_korean: 그들의 왕국은
  alternatives_korean:
  - 그들의 나라들은
  - 그들의 통치권은
  lexicon: 왕국
  rationale: Ge'ez의 복수 소유형은 여러 도시국가의 영토/통치 영역을 가리키므로, 자연스럽고 직접적인 한국어로 ‘왕국’이 가장 적절합니다.
- source_word: አሕጐሎሙ
  english_pob_choice: destroyed them
  chosen_korean: 그들을 멸하셨습니다
  alternatives_korean:
  - 그들을 파멸시키셨습니다
  - 그들을 심판하셨습니다
  lexicon: 멸하다
  rationale: 오디오트레이스의 최신 교정이 ‘judged’가 아니라 ‘destroyed’임을 분명히 하므로, 심판보다 파괴/멸망의 의미를 살려 번역했습니다.
- source_word: ጸዋጋን፡ ጥቀ፡ እሙንቱ
  english_pob_choice: they were very wicked
  chosen_korean: 그들이 매우 악했기 때문입니다
  alternatives_korean:
  - 그들이 지극히 사악했기 때문입니다
  - 그들이 몹시 악했기 때문입니다
  lexicon: 악하다
  rationale: 원문은 그들의 도덕적 상태를 강하게 강조하므로, ‘매우 악했다’로 간결하게 옮겨 과장 없이 강도를 반영했습니다.
- source_word: አልቦ፡ ሕዝበ፡ ዮም፡ ዘፈጸመ፡ ኀጣውኢሆሙ፡ ኵሎ፡
  english_pob_choice: there is no people today that has completed all their sins
  chosen_korean: 오늘날에는 그들처럼 자기 죄를 모두 완전히 채운 백성이 없으며
  alternatives_korean:
  - 오늘날 그들처럼 모든 죄를 완성한 백성은 없으며
  - 오늘날 그들처럼 죄를 다 채운 백성은 없으며
  lexicon: 죄를 모두 완전히 채우다
  rationale: Pob 수정안의 핵심인 ‘all’과 ‘completed their sins’의 결을 살려, 해석을 덧붙이지 않으면서도 한국어로는 ‘모두 완전히 채운’으로 표현했습니다.
- source_word: ወአልቦሙ
  english_pob_choice: they are no more
  chosen_korean: 그들은 더 이상 존재하지 않습니다
  alternatives_korean:
  - 그들은 이제 없습니다
  - 그들은 사라졌습니다
  lexicon: 더 이상 존재하지 않다
  rationale: 마지막 절은 단순한 부재가 아니라 현재의 소멸 상태를 말하므로, 자연스러운 종결 표현으로 옮겼습니다.
theological_decisions:
- issue: 주님(κύριος/יהוה) 호칭과 본문 어조
  chosen_reading: 주님께서
  alternative_readings:
  - 야훼께서
  - 주께서
  rationale: 이 절은 게에즈 본문이 하나님의 주권적 행위를 서술하는 문맥이므로, 한국어 본문에서는 POB의 일반 호칭인 ‘주님께서’를 사용하되, 야훼 표기는 원문이 직접 제시되지 않아 본문에 두지 않았습니다.
  doctrine_reference: divine name handling in source-grounded translation
- issue: 최종 절의 완결성
  chosen_reading: 오늘날에는 그들처럼 자기 죄를 모두 완전히 채운 백성이 없으며, 그들은 더 이상 존재하지 않습니다
  alternative_readings:
  - 오늘날에는 그들처럼 자기 죄를 전부 채운 백성이 없으며, 그들은 더 이상 없습니다
  - 오늘날에는 그들처럼 죄를 모두 끝낸 백성이 없으며, 그들은 사라졌습니다
  rationale: 원문의 대비는 ‘그들처럼’과 ‘더 이상 존재하지 않음’에 있으므로, 두 요소를 모두 드러내어 본문의 경고적 효과를 유지했습니다.
  doctrine_reference: historical judgment and moral exemplarity in Jubilees
