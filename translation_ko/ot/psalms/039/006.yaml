  text: Surely a man walks about as an image[a]; surely people are in turmoil in vain[b]. He heaps things up but does not know who will gather them.
  footnotes:
  - marker: a
    text: Or “as a mere semblance” or “as a phantom.” Hebrew literally says “in/as an image.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally says “in vapor/breath”; that is, futilely or insubstantially. The plural verb likely generalizes from the preceding singular “man.”
    reason: lexical_alternative
translation:
  language: ko
  text: 진실로 사람은 그림자처럼 다닙니다[a]. 진실로 그들은 헛되이 소란을 피웁니다[b]. 그는 재물을 쌓아 두지만, 누가 그것들을 거둘지 알지 못합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '형상 안에서', '한낱 모습처럼' 또는 '환영처럼'. 히브리어는 문자적으로 '형상'이며, 여기서는 인간 존재의 덧없고 실체 없는 모습을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 '그들은 소란을 피운다'라는 복수형입니다. 앞의 단수 '사람' 뒤에서 인류 일반을 가리키는 복수로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 '누가 그것들을 거둘지'라고 하며, 그가 쌓아 둔 재물들을 가리킵니다.
    reason: lexical_alternative
