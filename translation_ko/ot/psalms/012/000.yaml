base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/000.yaml
  text: 'For the choirmaster: according to The Eighth[a]. A psalm of David[b].'
  footnotes:
  - marker: a
    text: Hebrew The Eighth; likely a musical or liturgical designation, possibly referring to a tune, instrument, or octave setting. Traditionally transliterated 'Sheminith.'
    reason: cultural_note
  - marker: b
    text: Or 'by David' or 'for David'; the Hebrew 'of David' leaves the exact relationship open.
    reason: alternative_reading
translation:
  language: ko
  text: 지휘자를 위하여. 「제8」에 따라[a]. 다윗의[b] 시입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘제8’이며, 아마도 곡조·악기·음역 설정을 가리키는 음악적 또는 전례적 표지입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘다윗이 지은’ 또는 ‘다윗을 위한’이라는 뜻일 수 있습니다. 히브리어는 정확한 관계를 확정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּ֥חַ
  english_pob_choice: For the choirmaster
  chosen_korean: 지휘자에게
