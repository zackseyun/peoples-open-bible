    - Lord
    - master
    lexicon: BDAG
    rationale: Here Hermas addresses an angelic guide, not God; rendering as “Sir” avoids conflation with the divine title “Lord.”
  - source_word: νόμος
    chosen: law
    alternatives:
    - instruction
    - teaching
    lexicon: BDAG / LSJ
    rationale: The passage repeatedly calls the symbol “the law” and even equates it with the Son of God; preserving “law” retains the weighty, covenantal register and Hermas’s own diction.
  - source_word: σκεπάζον
    chosen: covers
    alternatives:
    - overshadows
    - shades
    lexicon: BDAG / LSJ
    rationale: The participle describes the tree’s protective spread; “covers” is clear and preserves the imagery of shade without over-interpretation.
  - source_word: κηρυχθείς
    chosen: proclaimed
    alternatives:
    - heralded
    - preached
    lexicon: BDAG
    rationale: Standard rendering for the passive of kērussō; “proclaimed” keeps the heraldic sense without importing ecclesiastical jargon.
  - source_word: λαοί
    chosen: peoples
    alternatives:
    - nations
    - crowds
    lexicon: BDAG / LSJ
    rationale: “Peoples” captures plural groups under the tree’s shade and fits Hermas’s broad scope.
  - source_word: ἄγγελος … Μιχαήλ
    chosen: angel … Michael
    lexicon: BDAG
    rationale: Proper name and common noun rendered by standard English equivalents.
  - source_word: ἐξουσία
    chosen: authority
    alternatives:
    - power
    - control
    lexicon: BDAG
    rationale: “Authority” matches the governance context and Hermas’s administrative imagery.
  - source_word: διακυβερνῶν
    chosen: governs
    alternatives:
    - steers
    - directs
    lexicon: LSJ
    rationale: Nautical metaphor of steering extended to governance; “governs” fits the context and English idiom.
  - source_word: διδοὺς … εἰς τὰς καρδίας
    chosen: gives … into the hearts
    alternatives:
    - puts … into the hearts
    - writes … on the hearts
    lexicon: BDAG
    rationale: Retains the prepositional imagery without importing Jeremiah 31 “write on hearts” language.
  - source_word: ἐπισκέπτεται
    chosen: visits
    alternatives:
    - inspects
    - looks into
    lexicon: BDAG
    rationale: The term can mean to visit with oversight; “visits … to see whether” captures the pastoral inspection.
  - source_word: ῥάβδοι
    chosen: rods
    alternatives:
    - sticks
    - staffs
    lexicon: BDAG / LSJ
    rationale: Consistent with the willow-rod imagery developed in Similitude 8; “rods” keeps the concrete symbol.
  - source_word: ἠχρειωμένας
    chosen: made worthless
    alternatives:
    - spoiled
    - rendered useless
    - ruined
    lexicon: BDAG
    rationale: Cognate with achreioō (“make useless,” cf. Rom 3:12 LXX/NT); “made worthless” is literal and weighty.
  - source_word: κατοικία
    chosen: dwelling
    alternatives:
    - abode
    - place of residence
    - home
    lexicon: BDAG / LSJ
    rationale: Literal rendering that preserves the sense of where each belongs/abides within the allegory.
  - source_word: ἀπέλυσεν
    chosen: send away
    alternatives:
    - dismiss
    - release
    lexicon: BDAG
    rationale: Describes transfer to the tower; “send away” reads smoothly with movement imagery.
  - source_word: κατέλειψεν
    chosen: left
    alternatives:
    - left behind
    - left over
    lexicon: BDAG
    rationale: Plain narrative verb for leaving some to the angel’s oversight.
  - source_word: παρέβησαν
    chosen: transgressed
    alternatives:
    - broke
    - violated
    lexicon: BDAG
    rationale: Legal imagery is active in the passage; “transgressed” retains juridical tone.
  - source_word: μετάνοια
    chosen: reorientation
    alternatives:
    - repentance
    - change of mind
    lexicon: Recorded source and contextual English comparison; see docs/REORIENTATION_POLICY_2026-10-11.md
    rationale: Use reorient/reorientation without automatically inserting God. The sentence supplies a departure, destination, interpersonal setting, or the work's own conceptual framework. Preserve distinct turning verbs and named wrongdoing. This is a scoped terminology decision, not a new independent lexicon consultation or a whole-verse accuracy certification.
    doctrine_reference: 'DOCTRINE.md: Reorientation terminology (2026-10-11)'
  - source_word: εὐηρέστησαν τῷ νόμῳ
    chosen: were well-pleasing with respect to the law
    alternatives:
    - were well-pleasing to [him]/to God
    - pleased the law
    lexicon: BDAG
    rationale: Literal prepositional construction avoids supplying an implicit object; preserves Hermas’s wording for later exegesis.
  - source_word: ἐστεφανωμένοι
    chosen: crowned
    alternatives:
    - given a victor’s wreath
    lexicon: BDAG / LSJ
    rationale: The term evokes athletic/martyrial wreaths; “crowned” is concise, with the wreath nuance noted in footnotes.
  - source_word: συμπαλαίσαντες
    chosen: grappled
    alternatives:
    - wrestled
    lexicon: BDAG / LSJ
    rationale: The compound intensifies struggle; “grappled” conveys close, strenuous combat.
  - source_word: διάβολος
    chosen: the devil
    alternatives:
    - the accuser
    lexicon: BDAG
    rationale: Conventional rendering; keeps personal opponent imagery.
  - source_word: παθόντες
    chosen: suffered
    alternatives:
    - underwent suffering
    - suffered (unto death)
    lexicon: BDAG
    rationale: Plain rendering allows readers to see a contrast with “were hard-pressed”; martyrdom nuance noted in footnotes.
  - source_word: θλιβέντες
    chosen: were hard-pressed
    alternatives:
    - were afflicted
    - were persecuted
    lexicon: BDAG
    rationale: Thlibō evokes pressure/distress; “hard-pressed” keeps the metaphor and distinguishes from general suffering (paschō).
  - source_word: παραφυάδες
    chosen: side-shoots
    alternatives:
    - offshoots
    - sprouts
    lexicon: LSJ
    rationale: Botanical term for secondary growth; “side-shoots” is precise and keeps the horticultural image.
  - source_word: χλωράς
    chosen: green
    alternatives:
    - fresh
    - verdant
    lexicon: BDAG / LSJ
    rationale: Describes living, fresh rods; “green” is straightforward and consistent with earlier context.
  - source_word: πορευθέντες
    chosen: have walked
    alternatives:
    - have lived
    - have conducted themselves
    lexicon: BDAG
    rationale: Biblical idiom for conduct; “walked” keeps the moral-pathway metaphor.
  - source_word: λίαν
    chosen: great
    alternatives:
    - exceeding
    - very
    lexicon: BDAG
    rationale: 'Rendered adverbially by intensifying the prepositional phrase: “in great purity of heart.”'
  - source_word: ἐντολάς
    chosen: commandments
    alternatives:
    - commands
    lexicon: BDAG
    rationale: Standard rendering; weighty moral content retained.
  - source_word: κατανοήσω
    chosen: examine
    alternatives:
    - consider carefully
    - observe closely
    lexicon: BDAG
    rationale: The verb implies careful scrutiny; “examine” fits the inspection of planted rods.
  - source_word: πεφυτευμένας καὶ πεποτισμένας
    chosen: planted and watered
    alternatives:
    - planted and irrigated
    - set and watered
    lexicon: BDAG / LSJ
    rationale: Agricultural imagery preserved with familiar collocation “planted and watered.”
