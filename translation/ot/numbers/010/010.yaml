  meaning_decisions:
  - source_phrase: בְּיוֹם שִׂמְחַתְכֶם
    prior_rendering: on the day of your gladness
    new_rendering: On your days of rejoicing
    rationale: The singular is used generically for occasions of communal joy, not to identify one otherwise unspecified day.
  - source_phrase: וּבְמוֹעֲדֵיכֶם
    prior_rendering: at your appointed times
    new_rendering: at your appointed festivals
    rationale: The sacrificial setting identifies the appointed occasions as Israel’s sacred festivals rather than unspecified scheduled times.
  - source_phrase: וּבְרָאשֵׁי חָדְשֵׁיכֶם
    prior_rendering: at the beginnings of your months
    new_rendering: at the beginning of each month
    rationale: This expresses the recurring calendrical occasion naturally; the note supplies the lunar setting known to the first hearers.
  - source_phrase: עַל עֹלֹתֵיכֶם וְעַל זִבְחֵי שַׁלְמֵיכֶם
    prior_rendering: over your burnt offerings and over the sacrifices of your peace offerings
    new_rendering: as you offer your burnt offerings and peace offerings
    rationale: The trumpets accompany the sacrificial acts; English need not reproduce the genitive chain or suggest a required physical position above the offerings.
  - source_phrase: וְהָיוּ לָכֶם לְזִכָּרוֹן לִפְנֵי אֱלֹהֵיכֶם
    prior_rendering: and they shall be for you as a memorial before your God
    new_rendering: These trumpet blasts shall serve as a memorial for you before your God
    rationale: Naming the trumpet blasts prevents the intervening offerings from being mistaken for the pronoun’s referent and preserves the connection with divine remembrance in verse 9.
