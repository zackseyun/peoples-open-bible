id: PSA.48.11
reference: Psalms 48:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/שִׁמְ/ךָ֤ אֱלֹהִ֗ים כֵּ֣ן תְּ֭הִלָּתְ/ךָ עַל קַצְוֵי אֶ֑רֶץ צֶ֝֗דֶק מָלְאָ֥ה יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/011.yaml
  text: Let Mount Zion rejoice; let the daughters of Judah[a] be glad because of your judgments.
  footnotes:
  - marker: a
    text: Or 'your praise is over the ends of the earth.' The Hebrew preposition is literally 'upon/over,' and the clause may be rendered more formally.
    reason: lexical_alternative
  - marker: b
    text: Or 'justice.' The Hebrew צֶדֶק can denote righteousness or justice.
    reason: alternative_reading
translation:
  language: ko
  text: 시온 산은 기뻐하고, 유다의 딸들은 주님의 심판들 때문에 즐거워합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다의 성읍들’. 히브리어 ‘유다의 딸들’은 시적으로 유다에 딸린 성읍이나 정착지를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשִׁמְךָ
  english_pob_choice: As your name
  chosen_korean: 주님의 이름처럼
  alternatives_korean:
  - 주님의 이름같이
  - 주님의 이름대로
  lexicon: HALOT
  rationale: 비교 표지 כ의 의미를 살려 ‘처럼’으로 옮겼고, ‘이름’은 이름이 지닌 명성과 평판까지 담는 구체적 표현을 유지했습니다.
- source_word: תְּהִלָּתְךָ
  english_pob_choice: your praise
  chosen_korean: 주님의 찬양
  alternatives_korean:
  - 주님의 영예
  - 주님께 드려지는 찬양
  lexicon: HALOT
  rationale: 히브리어는 하나님께 속한 ‘찬양’을 직접 가리키므로, 의미를 분명히 하되 과도한 풀이를 피해서 ‘찬양’으로 옮겼습니다.
- source_word: עַל קַצְוֵי אֶרֶץ
  english_pob_choice: reaches to the ends of the earth
  chosen_korean: 땅의 끝들에 이르며
  alternatives_korean:
  - 땅의 끝들 위에
  - 땅의 가장 먼 곳까지
  lexicon: HALOT
  rationale: עַל의 문자적 ‘위에’보다 문맥상 확장·도달의 뜻이 자연스러워 ‘이르며’로 풀어, 시적 병행을 살렸습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 공의
  lexicon: HALOT
  rationale: 이 단어는 ‘의’와 ‘정의’ 사이의 의미 폭이 있으나, 프로젝트 기본값과 시편의 신학적 어조를 따라 ‘의’로 두고 의미의 긴장은 보존했습니다.
theological_decisions:
- issue: 하나님의 이름과 찬양의 병행 구조
  chosen_reading: ‘주님의 이름처럼’과 ‘주님의 찬양’의 대응을 유지해, 이름의 명성과 온 땅에 퍼지는 찬양의 대응을 드러냈습니다.
  alternative_readings:
  - ‘주님의 이름대로’
  - ‘주님의 명성처럼’
  rationale: 본문의 כ ... כֵּן 병행은 단순한 정보 전달이 아니라 시적 대응을 이루므로, 한국어에서도 비교 구조를 살려 신학적·수사적 힘을 보존했습니다.
  doctrine_reference: 시편의 보편적 찬양과 하나님의 명성에 관한 본문 신학
- issue: צֶדֶק의 번역
  chosen_reading: ‘의’
  alternative_readings:
  - ‘정의’
  - ‘공의’
  rationale: 히브리어 צֶדֶק은 법정적·윤리적 뉘앙스를 모두 가질 수 있으나, 이 절에서는 하나님의 오른손의 성품을 묘사하는 표현이므로 ‘의’가 가장 직접적이며, 대안 의미는 여전히 열어 둡니다.
  doctrine_reference: 컨테스티드 텀(Contested terms)에서 의미 범위를 보존하는 원칙
