  to: God settles the lonely in a home; he brings out prisoners into prosperity[a], but the rebellious live in a parched land.
  rationale: “The lonely” is an acceptable and more idiomatic rendering of יְחִידִים in this context, and “live” is natural for שָׁכְנוּ. But “well-being” is too generic for the difficult בַּכּוֹשָׁרוֹת and does not improve on “prosperity,” which is a standard cautious main-text choice. The retained note openly records the significant uncertainty, including the possible singing sense.
