translation:
  language: ko
  text: 야훼[a], 나의 하나님, 제가 주님께 부르짖었고[b], 주님께서 저를 고쳐 주셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘YHWH’; 전통적으로 ‘여호와’ 또는 ‘주’로 옮깁니다. ‘야훼’와 ‘여호와’라는 표기가 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘제가 주님께 도움을 청해 부르짖었고’.
    reason: lexical_alternative
  - marker: c
    text: ‘고쳐 주셨습니다’는 신체적 치유를 가리킬 수 있으나, 문맥상 더 넓은 회복이나 구원을 포함할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  english_pob_choice: I will exalt you
  chosen_korean: 제가 주님을 높이겠습니다
  alternatives_korean:
