base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/005.yaml
  text: Then the Levites—Jeshua[a], Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah—said, “Stand up; bless Yahweh your God from everlasting to everlasting. Blessed be your glorious name[b], which is exalted above all blessing and praise.”
  footnotes:
  - marker: a
    text: Or, “And let them bless your glorious name.” The Hebrew verb is third person plural with a volitive sense.
    reason: alternative_reading
  - marker: b
    text: Literally, “the name of your glory.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 레위 사람들, 곧 예수아[a], 갓미엘, 바니, 하삽느야, 세레뱌, 호디야, 스바냐, 브다히야가 말했습니다. 「일어나 영원부터 영원까지 여러분의 하나님 야훼를 찬송하십시오. 모든 찬송과 찬양 위에 높으신 주의 영광스러운 이름[b]에 찬송을 드립니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "그들이 찬송하라". 히브리어 동사는 제 3 인칭 복수로 명령적 의미를 가짐.
    reason: alternative_reading
  - marker: b
    text: 문자적 의미는 "너희 영광의 이름".
    reason: alternative_reading
