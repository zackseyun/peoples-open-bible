translation:
  text: And there I saw[a] a place beyond the great earth;[b] there the heavens gather together.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Charles puts and I saw there in square brackets; printed49 note52 describes it as an addition in Ethiopic.
      It is retained as printed, not called an independent Greek reading or an editorial restoration.
    reason: textual_variant
  - marker: b
    text: The printed Ge'ez word rendered beyond is marked corrupt. Printed49 note54 compares a Greek beyond-form
      with an end-form. This translation follows the printed Ge'ez surface reading; it does not settle the underlying
      textual problem.
    reason: textual_variant
  - marker: c
    text: The subject heavens continues at the start of printed50/PDF88. The old verse stopped before this word,
      leaving an unsupported they. Printed49 note56 also questions the Ge'ez rendering against the Greek; the gathering
      verb is retained as printed.
    reason: textual_variant
