  source_fidelity: 히브리어 זֶה הַדָּבָר는 ‘이것은 ... 말씀입니다’로, אֲשֶׁר דִּבֶּר의 관계절과 예언 선언의 형식을 자연스럽게 보존할 수 있습니다. יְהוָה, אֶל מוֹאָב, מֵאָז도 각각 ‘야훼’, ‘모압에 관하여’, ‘일찍이’로 충실히 반영됩니다.
  naturalness: 초안의 ‘야훼께서 오래전에 모압에 대해 말씀하신 말씀’은 ‘말씀’이 연달아 반복되어 현대 한국어 문장으로 다소 어색합니다. ‘하신 말씀’으로 고치면 격식 있는 합쇼체를 유지하면서 중복을 해소합니다.
  terminology: ‘야훼’는 제시된 번역 방침 및 원문의 신명에 일치합니다. ‘모압에 관하여’는 예언의 대상·주제를 나타내는 אֶל의 문맥적 용법을 자연스럽고 정확하게 전달합니다.
  issues:
