theological_decisions:
- issue: Nature of the people’s weeping and supplication
  chosen_reading: The verse does not specify whether the tears are penitential, sorrowful, or joyful.
  alternative_readings:
  - penitential weeping
  - weeping of joy at restoration
  rationale: The Hebrew states the manner of their coming but not the emotional or theological cause, so the translation preserves that ambiguity.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: Force of הָיִיתִי in the fatherhood statement
  chosen_reading: Rendered as 'I am a father to Israel.'
  alternative_readings:
  - I have been a father to Israel
  rationale: The stative qatal affirms an established relationship in this prophetic declaration; an ingressive 'have become' adds a temporal change the source does not express.
  doctrine_reference: Translation philosophy §1 and §3
