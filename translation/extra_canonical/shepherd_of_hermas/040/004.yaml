translation:
  text: 4. Therefore, as many as are strong in the faith of the Lord, having put on the truth, do not cling to such spirits, but keep away from them. But those who are double‑minded and often change their minds[r1] practice divination like the nations and bring a greater sin upon themselves by practicing idolatry; for the one who consults a false prophet about any matter is an idolater, empty of the truth and foolish.
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Earlier reader wording used a form of "repent." Preserve reconsideration/change of mind without adding a Godward destination. Here the direction or referent is contested, vacillating, or explicitly contrary to faith; a uniform Godward rendering would misstate the passage.
    reason: lexical_alternative
