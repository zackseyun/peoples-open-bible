  source_fidelity: 히브리어는 앗수르 왕이 라기스에서 랍사게를 예루살렘의 히스기야 왕에게 보냈으며, 그에게 큰/막강한 병력이 딸렸음을 말합니다. 초안의 ‘군사력을 많이 거느리고’는 כָּבֵד의 ‘크고 강한’ 병력이라는 뜻을 인원수의 많음으로 좁히고, 누가 병력을 거느리는지도 다소 불분명하게 합니다. ‘큰 군대를 거느린’으로 바로 수식하는 것이 충실합니다. מְסִלָּה는 일반적인 ‘길’보다 ‘큰길/대로’가 적절하며, כוֹבֵס는 단수입니다.
