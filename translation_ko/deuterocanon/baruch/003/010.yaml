  lexicon: 늙다
  rationale: 문맥상 단순한 연령 정보가 아니라 쇠잔과 소진의 느낌이 있어 ‘늙어 버렸고’로 처리했습니다.
- source_word: συνεμιάνθης τοῖς νεκροῖς
  english_pob_choice: you were defiled with the dead
  chosen_korean: 죽은 자들과 함께 더러워졌습니다
  alternatives_korean:
