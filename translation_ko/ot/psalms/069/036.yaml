  - marker: b
    text: '''그것''과 ''그 안''은 앞 문맥의 시온, 곧 회복될 성읍을 가리키는 것으로 가장 자연스럽습니다. 더 넓게는 예루살렘이나 그 땅으로 이해하기도 합니다.'
    reason: cross_reference
