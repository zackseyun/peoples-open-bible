source:
  edition: WLC
  text: מִשְׁפַּ֤ט אֶחָד֙ יִהְיֶ֣ה לָ/כֶ֔ם כַּ/גֵּ֥ר כָּ/אֶזְרָ֖ח יִהְיֶ֑ה כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: ko
  text: 너희에게는 한 가지 법규가 있어야 합니다. 거류민[a]에게나 본토인에게나 같아야 합니다. 나는 너희의 하나님 야훼이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거류민’은 히브리어 גֵּר(gēr)를 옮긴 것으로, 이스라엘 공동체 안에 거주하는 외래인을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִשְׁפַּט אֶחָד
  english_pob_choice: one standard of judgment
  chosen_korean: 한 가지 판결 기준
  alternatives_korean:
  - 한 가지 판단 기준
  - 한 가지 재판 기준
  - 하나의 판결
  lexicon: מִשְׁפָּט
  rationale: משפט는 단순한 ‘판결’보다 적용 가능한 규범적 기준의 뜻이 강해, POB의 ‘standard of judgment’를 살려 ‘판결 기준’으로 옮겼습니다.
- source_word: לָכֶם
  english_pob_choice: for you
  chosen_korean: 너희에게는
  alternatives_korean:
  - 너희에게
  - 너희를 위하여
  lexicon: ל
  rationale: 대상자 전체에 대한 규범 선언이므로 조사 ‘에게는’으로 문두를 세워 문맥의 규정성을 드러냈습니다.
- source_word: כַּגֵּר כָּאֶזְרָח
  english_pob_choice: for the sojourner as for the native
  chosen_korean: 나그네에게도 본토 사람에게도 그러해야 합니다
  alternatives_korean:
  - 거류민에게도 본토인에게도 그러해야 합니다
  - 나그네와 본토 사람에게 똑같이 적용됩니다
  lexicon: גֵּר / אֶזְרָח
  rationale: 두 집단의 동등한 적용을 분명히 하되, 전통적 ‘거류민’보다 현대 독자가 즉시 이해할 수 있는 ‘나그네’를 기본으로 택했습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: the LORD your God
  chosen_korean: 내가 너희의 하나님 야훼이기 때문입니다
  alternatives_korean:
  - 내가 너희 하나님 야훼이기 때문입니다
  - 내가 야훼 너희의 하나님이기 때문입니다
  lexicon: יְהוָה / אֱלֹהִים
  rationale: 본문의 자기선언을 직접 살려 1인칭 ‘내가’로 시작하고, YHWH는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 언약 공동체 안에서 나그네와 본토 사람의 법적 동일성
  chosen_reading: 하나님의 기준은 신분에 따라 달라지지 않고 동일하게 적용된다는 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 사회적 관용의 권고
  - 사법 절차의 기술적 평등만을 말함
  rationale: 문맥상 율례의 보편 적용을 말하며, 이 구절은 이스라엘 내부의 정의가 야훼의 성품에 근거함을 드러냅니다.
  doctrine_reference: 출 12:49; 레 19:34; 민 15:15-16
- issue: 야훼 신명 표기
  chosen_reading: 본문의 יהוה는 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 직접 מקור 텍스트의 신명 표기를 음역해 본문의 언약적 자기계시를 보존했습니다.
  doctrine_reference: 출 3:15
