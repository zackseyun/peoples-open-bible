  lexicon: בַּיִת + עֲבָדִים
  rationale: 영어 POB의 ‘house of slaves’는 노예 상태를 드러내는 표현이지만, 한국어에서는 관용적으로 ‘종의 집’이 원문의 압축성과 대응성을 더 잘 살립니다.
theological_decisions:
- issue: ‘house of slaves’의 신학적·사회적 강도
  chosen_reading: ‘종의 집’으로 간결하게 유지해, 출애굽의 해방 사건과 종속 상태를 함께 드러냈습니다.
  alternative_readings:
  - ‘노예의 집’으로 더 강하게 표기
  - ‘종살이의 집’으로 의미를 풀어쓰기
  rationale: 본문은 출애굽을 단순한 이동이 아니라 예속에서의 구출로 제시하므로, 의미를 약화시키지 않으면서도 한국어 문맥에 맞는 압축 표현을 선택했습니다.
