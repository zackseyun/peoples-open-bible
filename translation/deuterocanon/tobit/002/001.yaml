id: TOB.2.1
reference: Tobit 2:1
source:
  edition: lxx-swete-1909
  text: ν Ὅτε δὲ κατῆλθον εἰς τὸν οἶκόν μου καὶ ἀπεδόθη μοι Ἄννα ἡ 1 II γυνή μου καὶ Τωβίας ὁ υἱός μου, ἐν τῇ πεντηκοστῇ ἑορτῇ ᾗ ἐστιν ἁγία ἑπτὰ ἑβδομάδων, ἐγενήθη ἄριστον καλὸν μοι· ἀνέπεσα τοῦ φαγεῖν.
  language: Greek
  pages:
  - 835
  confidence: high
  validation: agree
  note: Primary translation anchor remains the Greek; see parallel_sources for the Semitic / MT witness.
  parallel_sources:
  - edition: neubauer-tobit-1878
    text: ובשנה ההיא בחג השבועות הכינותי [בביתי] סעודה גדולה וישבתי על שלחני לאכול ואמרתי לטוביה בני לך והבא לנו מאחינו העניים לאכול עמנו ואני וכל היושבים עמי לא נאכל עד בואך.
    kind: indirect_hebrew
    note: NOT an ancient Hebrew witness. Neubauer's 1878 Hebrew is a back-translation from an Aramaic Munich MS. The actual ancient evidence is Qumran 4Q196-200 (Aramaic), published in DJD XIX (not redistributable). Use for translation reference only; do not treat as Vorlage.
    reference: TOB 2:1
translation:
  text: When I had returned home and been reunited with my wife Anna and my son Tobiah, a fine meal was prepared for me on Pentecost, the holy Feast of Weeks[a]. I reclined at the table to eat.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “the holy feast of seven weeks.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῆλθον
  chosen: had come down
  alternatives:
  - came
  - returned
  lexicon: BDAG
  rationale: 'The verb literally means ''went/came down.'' In context it marks Tobit''s return home; ''had come down'' preserves the directional nuance of the Greek better than simply ''returned,'' while still reading naturally in English. Cleanup note: the reader-facing rendering no longer begins with ''Now'' because this source expression does not contain an explicit temporal ''now''; any connective force is carried by the surrounding English clause or context.'
- source_word: οἶκόν
  chosen: house
  alternatives:
  - home
  lexicon: BDAG
  rationale: οἶκος can mean either the physical house or household/home. 'House' keeps closer to the Greek wording, while the possessive 'my' still conveys the personal sense.
- source_word: ἀπεδόθη μοι
  chosen: were restored to me
  alternatives:
  - was given back to me
  - was returned to me
  lexicon: BDAG
  rationale: The passive of ἀποδίδωμι means 'was given back/returned.' Because both Anna and Tobiah are included after the singular verb by sense, English plural 'were restored to me' best captures the family-reunion sense. This also aligns with the broader narrative context of return after separation.
- source_word: Ἄννα ἡ γυνή μου
  chosen: Anna my wife
  alternatives:
  - Hannah my wife
  lexicon: BDAG
  rationale: The proper name is transliterated as 'Anna' from the Greek form Ἄννα. 'My wife' directly renders ἡ γυνή μου.
- source_word: Τωβίας
  chosen: Tobiah
  alternatives:
  - Tobias
  lexicon: BDAG
  rationale: Names are transliterated rather than conformed to traditional Latinate forms. 'Tobiah' reflects the Semitic name more transparently and is supported by the parallel Semitic tradition.
- source_word: πεντηκοστῇ ἑορτῇ
  chosen: the feast of Pentecost
  alternatives:
  - the Feast of Weeks
  - Pentecost
  lexicon: BDAG
  rationale: πεντηκοστή is the Greek designation later familiar as 'Pentecost.' Because the verse itself immediately explains it as the holy feast of seven weeks, retaining 'Pentecost' preserves the Greek term while the apposition clarifies its Jewish festal identity.
- source_word: ἁγία ἑπτὰ ἑβδομάδων
  chosen: the holy feast of seven weeks
  alternatives:
  - the sacred feast of seven weeks
  - the holy festival of seven weeks
  lexicon: LEH
  rationale: This explanatory phrase identifies Pentecost with the Feast of Weeks. Rendering it explicitly as 'the holy feast of seven weeks' preserves the appositional explanation in the Greek.
- source_word: ἐγενήθη ἄριστον καλὸν μοι
  chosen: a fine meal was prepared for me
  alternatives:
  - a good dinner was made for me
  - an excellent meal came to be for me
  lexicon: BDAG
  rationale: Literally, 'a good meal came to be for me.' Idiomatic English prefers a passive-like expression. 'Fine meal' preserves καλόν without sounding wooden; 'prepared for me' conveys the event naturally.
- source_word: ἀνέπεσα
  chosen: I reclined
  alternatives:
  - I sat down
  - I lay back
  lexicon: BDAG
  rationale: At ancient meals, ἀναπίπτω commonly refers to reclining at table. 'I reclined' preserves the cultural practice more accurately than the generic 'sat down.'
- source_word: τοῦ φαγεῖν
  chosen: to eat
  alternatives:
  - for eating
  - to begin eating
  lexicon: BDAG
  rationale: 'The articular infinitive here expresses purpose: he reclined in order to eat. ''To eat'' is the most natural English rendering.'
