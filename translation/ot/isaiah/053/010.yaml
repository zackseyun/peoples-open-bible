  from: Yet it pleased Yahweh to crush him[a]; he made him sick. If his life makes a guilt offering, he will see offspring, he will prolong his days[e][d][c][b], and the pleasure of Yahweh will prosper in his hand.
  to: Yet it pleased Yahweh to crush him; he afflicted him[a]. If his life is made[b] a guilt offering[c], he will see offspring and live long, and Yahweh's purpose will succeed through him.
