  rationale: “Gave birth to” is clear modern English while preserving the concrete sense of bearing offspring.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ረዓይተ፡ ዓበይተ
  chosen: great giants
  alternatives:
  - huge giants
  - great ones
  rationale: The phrase identifies extraordinary giant offspring and qualifies them as great or immense. “Great giants” retains
    both elements without reducing the apocalyptic beings to merely tall humans.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: ቆሞሙ
  chosen: whose height
  alternatives:
  - their stature
  - their size
  rationale: In combination with the following linear measure, the noun denotes bodily height or stature; “height” is the
    clearest English expression.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: በበ፡ ፴፻
  chosen: three thousand ... each
  alternatives:
  - each, three thousand
  - thirty hundred ... each
  rationale: The distributive repetition በበ indicates an amount for each giant. In Ethiopic numeral notation, ፴፻ combines
    thirty and one hundred multiplicatively, yielding three thousand.
  consultation_status: No independently checked lexicon entry is claimed by this application.
- source_word: በአመት
  chosen: cubits
  alternatives:
  - ells
  - units of measure
  rationale: The context requires a linear unit used to measure stature. “Cubits” is the standard intelligible rendering of
    the ancient measure; the OCR spelling may obscure the precise Ge'ez form.
  model_suggested_lexicon_unverified: Dillmann's Lexicon Linguae Aethiopicae
  consultation_status: No independently checked lexicon entry is claimed by this application.
theological_decisions:
- issue: The enormous height of the giants
  chosen_reading: Preserve the stated height of three thousand cubits literally.
  alternative_readings:
  - Treat the number as symbolic and paraphrase it as immeasurably tall
  - Emend or reduce the number to make it physically plausible
  rationale: The extravagant dimension is part of the passage’s apocalyptic portrayal of the giants. Translation should preserve
    rather than rationalize or interpret away that imagery.
  doctrine_reference: Book-context instruction to preserve apocalyptic imagery
