  naturalness: ‘하나님’에 호격 조사 없이 쉼표로 직접 부르고, 반복되는 청원을 ‘-해 주십시오’로 옮겨 현대 표준어 합쇼체에서 자연스럽고 기도문의 직접성을 살렸습니다. ‘유죄를 선고하다’, ‘내쫓다’, ‘반역하다’는 문맥에 맞는 자연스러운 표현입니다.
