id: WIS.10.1
reference: Wisdom of Solomon 10:1
source:
  edition: lxx-swete-1909
  text: Αὕτη πρωτόπλαστον πατέρα κόσμου μόνον κτισθέντα διεφύλαξεν, καὶ ἐξείλατο αὐτὸν ἐκ παραπτώματος ἰδίου,
  language: Greek
  pages:
