id: PRO.5.16
reference: Proverbs 5:16
source:
  edition: WLC
  text: יָפ֣וּצוּ מַעְיְנֹתֶ֣י/ךָ ח֑וּצָ/ה בָּ֝/רְחֹב֗וֹת פַּלְגֵי מָֽיִם־׃
translation:
  text: Should your springs spread outside, streams of water in the streets[a]?
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “Let your springs spread outside, streams of water in the streets.” Hebrew permits an exhortation or an unmarked question; verses 15 and 17 favor the question.
    reason: alternative_reading
lexical_decisions:
- source_word: יָפ֣וּצוּ
  chosen: should ... be scattered
  alternatives:
  - let ... be scattered
  - are ... scattered
  - may ... spread out
  lexicon: HALOT
  rationale: The verb פוץ in the Qal commonly means 'be scattered' or 'be dispersed.' In this context, the form can be read as an interrogative/jussive-like statement continuing the father's admonition. Rendering it with 'should ... be scattered' captures the rhetorical force better than a flat indicative.
- source_word: מַעְיְנֹתֶיךָ
  chosen: your springs
  alternatives:
  - your fountains
  - your sources
  lexicon: HALOT
  rationale: מַעְיָן denotes a spring or fountain. 'Springs' is natural modern English and preserves the water metaphor tied to sexual fidelity in the surrounding context.
- source_word: חוּצָה
  chosen: outside
  alternatives:
  - outside
  - outdoors
  lexicon: HALOT
  rationale: This directly conveys the contrast between the private and public sphere.
- source_word: בָּרְחֹבוֹת
  chosen: in the streets
  alternatives:
  - in the squares
  - in the open places
  lexicon: HALOT
  rationale: רְחֹבוֹת refers to broad public places, streets, or squares. 'In the streets' is the most idiomatic English here and matches the contrast with private marital intimacy in the context.
- source_word: פַּלְגֵי מָיִם
  chosen: streams of water
  alternatives:
  - channels of water
  - watercourses
  lexicon: HALOT
  rationale: פֶּלֶג means a division, channel, or stream of water. 'Streams of water' is clear and preserves the poetic parallelism with 'springs.'
- source_word: יָפֻצוּ
  chosen: should ... spread
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: With water sources as subject, the verb depicts their dispersal or spreading outward; “spread” retains this image more closely than “flow.”
