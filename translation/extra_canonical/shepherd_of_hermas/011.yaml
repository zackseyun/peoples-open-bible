translation:
  text: 'III.1. After showing me these things, she wanted to run off. I say to her, “Lady, what profit
    is it to me to have seen these things and not know what the matters are?” Answering me, she says,
    “You are a crafty man, wanting to know the things concerning the tower.” “Yes, lady,” I say, “so that
    I may report them to the brothers, and [that they may become more cheerful, and] having heard [these
    things], may know the Lord in much glory[a].”


    III.2. She said, “Many indeed will hear; and, having heard, some of them will rejoice, but some will
    weep. But even these, if they hear and repent[b], they too will rejoice. Therefore listen to the parables
    of the tower, for I will reveal everything to you. And no longer cause me trouble about revelations,
    for these revelations have an end, for they have been completed. But you will not stop asking for
    revelations, for you are shameless[c].”


    III.3. “The tower that you see being built is I, the Church, the one shown to you both now and before.
    Whatever you wish, therefore, ask about the tower, and I will reveal it to you, so that you may rejoice
    with the holy ones[d].”


    III.4. I say to her, “Lady, since once for all you considered me worthy for everything to be revealed
    to me, reveal it.” She says to me, “Whatever can be revealed to you will be revealed. Only let your
    heart be toward God, and do not be double-minded in whatever you see[e].”


    III.5. I asked her, “Why has the tower been built upon the waters, lady?” She says, “I told you before
    also, and you inquire diligently; therefore, by inquiring, you find the truth. Why, then, the tower
    has been built upon the waters—listen: because your life was saved through water and will be saved.
    And the tower has been founded by the word of the Almighty and glorious Name, and is held fast by
    the unseen power of the Master[f].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    reason: textual_variant
    text: The two English bracket spans together represent the single working Greek bracket hilaroteroi
      genontai kai tauta; hearing itself is outside that Greek bracket. Square brackets mark the1891editor’s
      supplement, not ancient punctuation. Sinaiticus11.1lacks the cheerful/these-things phrase without
      a gap at that point; AthosLake1907PlateIIline28includes it without brackets but has know God where
      the working source/Sinaiticus have Lord. Vulgata16has the cheerful/hearing phrase but honorify the
      Lord; Palatina35has hearing/know the Lord and adds joy at the end, without the separate become-more-cheerful
      phrase. These differences are disclosed, not counted as independent editions of a single witness.
  - marker: b
    reason: lexical_alternative
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it.
  - marker: c
    reason: textual_variant
    text: The condition if they hear and repent and the promised rejoicing remain explicit in the working
      source, Sinaiticus11.2, AthosPlateIIline29and both Latin versions. The completed revelations and
      the rebuke that Hermas will not stop asking are also retained. Palatina37instead says the requested
      revelation will not be left empty, omitting the shameless rebuke; Vulgata17retains it. Parables
      here are the vision’s symbolic explanations. Completion may also be fulfillment; it is not rewritten
      as a command never to ask again.
  - marker: d
    reason: textual_variant
    text: The woman identifies the tower with herself, the Church; assembly/congregation is the lexical
      alternative for ekklesia, without assigning a modern institution. The physical322scan prints imperative
      eperota, ask, not the raw OCR infinitive eperotan. Sinaiticus11.3has eperota, AthosPlateIIline32erota,
      and Vulgata17interroga. Palatina37prints interrogare with a marginal instruction to read interroga.
      Holy ones translates hagioi, also saints. Both the imperative and the purpose so that you may rejoice
      are explicit.
  - marker: e
    reason: textual_variant
    text: Physical322prints axion me hegeso, considered me worthy; raw OCR exion me egeso was corrupt.
      Sinaiticus11.4and AthosPlateIIline33have the corresponding worthy/considered words; both Latin versions
      also have worthy. This is a printed transcription correction, not a new selected manuscript locus.
      Working toward God differs from Sinaiticus first-hand peri God and Vulgata17apud dominum, toward/with
      the Lord; Palatina37has apud deum. The condition/limit on what may be revealed and the no-double-mindedness
      instruction remain. No extra qualification for worthiness is invented.
  - marker: f
    reason: textual_variant
    text: Both past was saved and future will be saved through water remain. AthosPlateIIline36and Sinaiticus11.5preserve
      that pair, as do both Latin versions. The body keeps water rather than substituting baptism or a
      sacramental theory. Vulgata17has an extra description of Hermas as crafty about scriptures where
      the working Greek and Palatina37say he inquires diligently. Name remains reverentially capitalized,
      but no specific Christological identification is inserted. Despotes is Master, distinguished from
      earlier kyrios/Lord. Sinaiticus’s spelling of unseen is corrected S1/ca, not an additional manuscript
      vote. Palatina’s shorter closing joins unseen power to the foundation phrase rather than the separate
      held-fast verb.
lexical_decisions:
- source_word: ἀποτρέχειν
  chosen: run off
  alternatives:
  - run away
  - hurry off
  lexicon: LSJ
  rationale: Conveys quick departure with slightly colloquial vividness fitting the scene.
- source_word: Κυρία
  chosen: Lady
  alternatives:
  - Mistress
  - Madam
  lexicon: BDAG
  rationale: Respectful address to a woman; in Hermas it is a personified figure. "Lady" avoids slavery/sexual
    connotations of "Mistress."
- source_word: ὄφελος
  chosen: profit
  alternatives:
  - benefit
  - advantage
  lexicon: BDAG
  rationale: Rhetorical tone preserved; "profit" keeps the idiom "what profit is there?" without being
    archaic.
- source_word: πράγματα
  chosen: matters
  alternatives:
  - things
  - affairs
  lexicon: LSJ
  rationale: Slightly formal, fitting Hermas’s register; points to substantive content rather than mere
    objects.
- source_word: πανοῦργος
  chosen: crafty
  alternatives:
  - cunning
  - shrewd
  lexicon: LSJ
  rationale: Carries a lightly pejorative, teasing edge matching the rebuke; "shrewd" loses the admonitory
    color.
- source_word: ἀδελφοί
  chosen: brothers
  alternatives:
  - brothers and sisters
  - fellow believers
  lexicon: BDAG
  rationale: Reflects the early Christian familial term as written; inclusivity can be explained in notes
    if needed.
- source_word: ἱλαρώτερος
  chosen: more cheerful
  alternatives:
  - encouraged
  - more joyful
  lexicon: LSJ
  rationale: Comparative form kept; "cheerful" preserves affective nuance distinct from deep joy.
- source_word: Κύριος
  chosen: Lord
  alternatives:
  - Master
  lexicon: BDAG
  rationale: Standard covenantal title; reserving "Master" for δεσπότης avoids conflation of titles in
    this unit.
- source_word: μετανοέω
  chosen: repent
  alternatives:
  - reorient
  - repent
  - change their mind
  - turn back
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it. Contextual editorial
    assessment, not independent scholarly certification.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: παραβολή
  chosen: parables
  alternatives:
  - allegories
  - figurative sayings
  lexicon: BDAG
  rationale: Hermas labels his symbolic explanations "parables"; retaining the term preserves genre-signaling.
- source_word: ἀποκάλυψις / ἀποκαλύπτω
  chosen: revelation / reveal
  alternatives:
  - unveiling / unveil
  - disclosure / disclose
  lexicon: BDAG
  rationale: Maintains apocalyptic resonance of the term while using idiomatic English.
- source_word: κόπους παρέχειν
  chosen: cause me trouble
  alternatives:
  - give me trouble
  - put me to toil
  lexicon: LSJ
  rationale: Idiomatic English conveying nuisance/effort; keeps mild rebuke tone.
- source_word: τέλος ἔχειν
  chosen: have an end
  alternatives:
  - have a limit
  - come to an end
  lexicon: BDAG
  rationale: Straightforward rendering; supports the next clause about completion.
- source_word: πεπληρωμέναι
  chosen: are complete
  alternatives:
  - are fulfilled
  - are filled up
  lexicon: BDAG
  rationale: In this context the set of revelations is complete; "fulfilled" is also possible but can
    suggest prophecy fulfillment.
- source_word: ἀναιδής
  chosen: shameless
  alternatives:
  - impudent
  - brazen
  lexicon: LSJ
  rationale: Captures the playful yet pointed rebuke; stronger than "bold."
- source_word: Ἐκκλησία
  chosen: Church
  alternatives:
  - assembly
  - congregation
  lexicon: BDAG
  rationale: Hermas personifies the Christian community; capitalized "Church" reflects ecclesial sense,
    not generic gathering.
- source_word: ἐπερωτάω
  chosen: inquire
  alternatives:
  - ask
  - question
  lexicon: BDAG
  rationale: Slightly formal verb matches register and the investigative context.
- source_word: ἅγιοι
  chosen: holy ones
  alternatives:
  - saints
  lexicon: BDAG
  rationale: Literal, transparent rendering; avoids later technical connotations of "saints" while retaining
    traditional sense.
- source_word: διψυχεῖν
  chosen: be double-minded
  alternatives:
  - be of two minds
  - waver
  lexicon: BDAG
  rationale: Echoes early Christian moral vocabulary; preserves idiom used elsewhere (e.g., James).
- source_word: ἐκζητεῖν (ἐπιμελῶς)
  chosen: seek diligently
  alternatives:
  - search earnestly
  - make thorough inquiry
  lexicon: BDAG
  rationale: Brings out the intensive prefix and adverb; matches commendation of persistence.
- source_word: ἡ ζωὴ ὑμῶν ἐσώθη καὶ σωθήσεται
  chosen: your life was saved and will be saved
  alternatives:
  - your lives were saved and will be saved
  - you were saved and will be saved
  lexicon: BDAG
  rationale: Singular "life" with plural possessive preserved; temporal aspect kept with aorist and future.
- source_word: ῥῆμα
  chosen: word
  alternatives:
  - command
  - utterance
  lexicon: BDAG
  rationale: Common biblical sense retained; pairs well with "founded upon."
- source_word: παντοκράτωρ
  chosen: Almighty
  alternatives:
  - All-sovereign
  - Ruler of all
  lexicon: BDAG
  rationale: Established rendering for a divine epithet; concise and reverent.
- source_word: ὄνομα (ἐνδόξον)
  chosen: glorious Name
  alternatives:
  - glorious name
  - the Name
  lexicon: BDAG
  rationale: Capitalizing "Name" signals the Jewish-Christian reverential circumlocution for God.
- source_word: τεθεμελίωται
  chosen: has been founded
  alternatives:
  - has been laid as a foundation
  - has been established
  lexicon: BDAG
  rationale: Architectural metaphor preserved; perfect aspect reflected.
- source_word: κρατεῖται
  chosen: is held fast
  alternatives:
  - is upheld
  - is kept firm
  - is sustained
  lexicon: BDAG
  rationale: Conveys continuing stabilizing action exerted upon the tower.
- source_word: ἀόρατος
  chosen: unseen
  alternatives:
  - invisible
  lexicon: BDAG
  rationale: Natural English while keeping the literal idea; "invisible" is acceptable but more abstract.
- source_word: δεσπότης
  chosen: Master
  alternatives:
  - Lord
  lexicon: BDAG
  rationale: Differentiates from κύριος rendered "Lord" earlier; preserves nuance of sovereign ownership.
