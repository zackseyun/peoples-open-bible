review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. μισάρετε는 단순히 ‘미워하는/미운’이라는 뜻보다 ‘덕을 미워하는’(virtue-hating)이라는 합성어의 뜻을 보존해야 합니다. 또한 τί는 ‘왜’가 아니라 ‘무엇을’ 묻습니다. προθεῖς는 여기서 사람들을 공개적으로 내세우거나 노출시키는 행위를 가리키므로 ‘내세우다’가 문맥과 어휘 범위를 함께 잘 살립니다.
  naturalness: 현대 표준어 합쇼체로 ‘덕을 미워하는 자여, 사람을 미워하는 자여’와 ‘…무엇을 하시는 것입니까?’는 자연스럽고 원문의 격한 호칭과 질문을 유지합니다. 기존의 ‘미워하는 자요’는 목적어가 없어 어색하고 의미가 불완전합니다.
  terminology: μισάρετε는 ‘덕을 미워하는 자’, μισάνθρωπε는 ‘사람을 미워하는 자’로 구별하여 두 비난의 대상을 보존했습니다. ‘당신’은 대치 상황의 존대 문체에서 가능하나, 호격 뒤에는 생략하는 편이 더 자연스럽습니다.
  issues:
  - severity: high
    issue: μισάρετε를 ‘미워하는 자’로 번역함
    rationale: μισάρετος는 ‘덕(ἀρετή)을 미워하는’이라는 합성어입니다. ‘미워하는 자’는 무엇을 미워하는지 탈락시켜 원문의 핵심 의미를 잃습니다.
  - severity: medium
    issue: τί를 ‘왜’로 번역함
    rationale: τί는 여기서 ‘무엇을’이라는 질문입니다. 동기만 묻는 ‘왜’로 한정하지 않아야 합니다.
  - severity: low
    issue: 각주 대안 ‘공개해 두는’
    rationale: ‘공개해 두다’는 현대 한국어에서 이 문맥에 부자연스럽고, προτίθημι의 ‘내세우다/제시하다/노출시키다’ 범위를 정확히 드러내지 못합니다.
  revised_text: “오, 덕을 미워하는 자여, 사람을 미워하는 자여, 우리를 이런 방식으로 내세워 무엇을 하시는 것입니까?”[a]
