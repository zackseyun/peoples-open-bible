  source_fidelity: 현 번역의 ‘고라흐의 우두머리, 가아팀의 우두머리, 아말렉의 우두머리’는 히브리어의 반복된 칭호 אַלּוּף를 각 이름에 대한 소유·속격 관계로 바꾸어, ‘고라 족장, 가아담 족장, 아말렉 족장’이라는 원문의 열거 구조를 훼손합니다. 또한 אֱלִיפַז의 첫 음절은 ‘에리-’가 아니라 ‘엘리-’로 옮겨야 합니다.
  naturalness: 명단의 칭호는 한국어에서 이름 뒤에 놓는 ‘고라 족장’ 형식이 자연스럽고 의미도 정확합니다. ‘족장’은 이 에돔 씨족 지도자 칭호를 간결하게 나타내며, ‘우두머리’보다 본문의 정형적인 명단 문체에 알맞습니다.
  terminology: קֹרַח은 통용 표기인 ‘고라’, גַּעְתָּם은 히브리어 음가를 반영한 ‘가아담’, אֱלִיפַז은 한국어 성경의 통용 표기인 ‘엘리바스’를 사용했습니다. אַלּוּף는 본문에서 반복되는 에돔의 지도자 칭호이므로 일관되게 ‘족장’으로 옮겼습니다.
