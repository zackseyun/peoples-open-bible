id: PRO.22.16
reference: Proverbs 22:16
source:
  edition: WLC
  text: עֹ֣שֵֽׁק דָּ֭ל לְ/הַרְבּ֣וֹת ל֑/וֹ נֹתֵ֥ן לְ֝/עָשִׁ֗יר אַךְ לְ/מַחְסֽוֹר־׃
translation:
  text: One who oppresses the poor to increase his own wealth, and one who gives to the rich—both come only to poverty[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: 'The compressed Hebrew may instead describe one person: “One who oppresses the poor to increase his own wealth and gives to the rich comes only to poverty.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֵׁק
  chosen: One who oppresses
  alternatives:
  - He who oppresses
  - An oppressor of
  lexicon: HALOT
  rationale: Qal participle of עשׁק used substantivally; denotes one characterized by exploiting or extorting. 'One who oppresses' is natural English and preserves the ongoing/generic force of the participle.
- source_word: דָּל
  chosen: the poor
  alternatives:
  - a poor person
  - the weak
  lexicon: HALOT
  rationale: דָּל commonly denotes one who is poor, lowly, or weak in social/economic status. In this proverb the economic sense is primary, so 'the poor' best fits.
- source_word: לְהַרְבּוֹת לוֹ
  chosen: to increase his own wealth
  alternatives:
  - to increase for himself
  - to enrich himself
  lexicon: HALOT
  rationale: Infinitive construct of רבה with ל plus pronominal suffix indicates purpose/result for the subject's own benefit. 'To increase his own wealth' makes explicit the implied economic gain in context without over-paraphrasing.
- source_word: נֹתֵן
  chosen: and one who gives
  alternatives:
  - and gives
  - one who gives
  lexicon: HALOT
  rationale: Treats the second participle as a parallel subject without adding the more interpretive disjunction “or.”
- source_word: לְעָשִׁיר
  chosen: to the rich
  alternatives:
  - to a rich man
  - to the wealthy
  lexicon: HALOT
  rationale: עָשִׁיר denotes a rich person. 'The rich' is idiomatic and matches the generic class sense of the proverb.
- source_word: אַךְ
  chosen: only
  alternatives:
  - surely
  - indeed
  - but only
  lexicon: HALOT
  rationale: Preserves the particle’s restrictive emphasis in the stated outcome.
- source_word: לְמַחְסוֹר
  chosen: to poverty
  alternatives:
  - to want
  - to lack
  - to need
  lexicon: HALOT
  rationale: Naturally expresses the economic lack or want that forms the outcome of both actions on this construal.
