  source_fidelity: 초안은 ‘ἐν ᾗ’가 이끄는 관계절을 ‘오늘은 … 날이기 때문입니다’라는 인과절로 바꾸어, 좋은 날의 내용을 그 사건이 일어난 날로 특정하는 원문의 구문을 충분히 보존하지 못했습니다. 또한 원문에는 ‘오늘’이라는 시간 부사가 없습니다.
  naturalness: ‘조상들의 땅’, ‘왕국의 왕좌’는 격식 있는 성서 문체에서 자연스럽습니다. 관계절을 앞세운 문장으로 고치면 현대 한국어 합쇼체에서도 명료하고 자연스럽습니다.
  terminology: Πτολεmaῖος는 ‘프톨레마이오스’, πατέρων은 문맥상 ‘조상들’, θρόνου βασιλείας αὐτῶν은 ‘그들의 왕국의 왕좌’로 옮긴 것이 적절합니다. 원문의 직접 호칭에 맞추어 ‘당신께서’와 높임 선어말을 사용했습니다.
  issues:
