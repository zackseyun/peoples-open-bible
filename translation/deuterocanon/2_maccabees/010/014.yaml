lexical_decisions:
- source_word: ἔπεισεν
  chosen: He persuaded
  alternatives:
  - He convinced
  - He won over
  lexicon: LSJ
  rationale: Aorist of πείθω; straightforwardly denotes persuading someone. 'Persuaded' fits the diplomatic context and preserves the verbal link with the later πείσει ('will persuade').
- source_word: συλλύεσθαι
  chosen: to come to terms
  alternatives:
  - to be reconciled
  - to settle
  - to make an agreement
  lexicon: LSJ
  rationale: The verb is unusual and the source is flagged with major mismatch; in context with ἐπὶ πᾶσι τοῖς δικαίοις it most naturally refers to reaching a settlement/agreement. 'Come to terms' captures the diplomatic sense without overcommitting to a narrower legal nuance.
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  chosen: on all the just demands
  alternatives:
  - in all the rightful matters
  - on all fair terms
  - with respect to everything just
  lexicon: LSJ
  rationale: δικαίοις here is best taken substantivally, referring to what is just/right in the negotiations. 'Just demands' gives idiomatic English for the matters judged fair or rightful in the settlement.
- source_word: διότι καὶ τὸν βασιλέα πείσει
  chosen: and that he would also persuade the king
  alternatives:
  - because he would also persuade the king
  - and moreover he would persuade the king
  lexicon: LSJ
  rationale: διότι can introduce content or reason; here it is best taken as part of what was promised in persuasion. 'And that he would also persuade the king' reads naturally in English and keeps the future force of πείσει.
- source_word: φίλον αὐτοῖς
  chosen: their friend
  alternatives:
  - friendly to them
  - a friend to them
  lexicon: LSJ
  rationale: φίλον with αὐτοῖς expresses favorable disposition toward them. 'Their friend' is concise and idiomatic, though the sense is political favor rather than intimate friendship.
- source_word: ἀναγκάζων γενέσθαι
  chosen: compelling him to become
  alternatives:
  - forcing him to become
  - constraining him to be
  lexicon: LSJ
  rationale: Present participle of ἀναγκάζω conveys strong pressure or compulsion. 'Compelling' preserves that force while fitting the political setting.
