- from: 가서 히스기야에게 말하십시오. ‘야훼께서, 네 아버지 다윗의 하나님께서 이렇게 말씀하십니다. “나는 네 기도를 들었고, 네 눈물을 보았습니다. 보십시오, 내가 네 수명에 열다섯 해를 더하겠습니다.”’
  to: 가서 히스기야에게 말하십시오. “야훼, 곧 네 조상 다윗의 하나님께서 이렇게 말씀하십니다. ‘내가 네 기도를 들었고 네 눈물을 보았습니다. 보십시오, 내가 네 날들에 열다섯 해를 더하겠습니다.’”
  rationale: The revision resolves the quotation-mark structural defect, clarifies the dynastic sense of ‘father’ as ‘ancestor,’ and restores the source expression ‘your days’ while preserving the draft's formal-polite register and its rendering of the divine name.
