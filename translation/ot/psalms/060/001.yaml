  from: you have broken us through
  to: you have breached us
  rationale: The current rendering 'you have broken us through' is not idiomatic English and risks obscuring the meaning. It could be misinterpreted as God helping the people break through something, which is the opposite of the context of divine judgment. The verb פָּרַץ (parats) implies making a breach in something, like a wall. 'You have breached us' is more direct, avoids ambiguity, and accurately conveys the violent imagery of the Hebrew in a concise and clear way.
