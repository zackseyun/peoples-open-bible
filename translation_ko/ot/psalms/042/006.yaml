  chosen_korean: 그분의 얼굴의 구원이요
  alternatives_korean:
  - 그분의 임재의 구원이요
  - 그분의 얼굴빛의 구원이요
  lexicon: HALOT
  rationale: 본문의 직역 이미지를 유지해 פָּנִים의 ‘얼굴’ 의미를 살렸습니다. 영어 POB의 각주가 지적하듯 ‘임재’ 뉘앙스가 있으나, 여기서는 원문의 표상을 보존하는 쪽이 더 충실합니다.
theological_decisions:
- issue: פָּנִים(얼굴)과 구원의 관계
  chosen_reading: ‘그분의 얼굴의 구원’으로 직역해, 구원이 하나님의 인격적 임재와 분리되지 않음을 드러냈습니다.
  alternative_readings:
  - ‘그분의 임재의 구원’
  - ‘그분의 얼굴빛의 구원’
  rationale: 시편의 표현은 단순한 구조적 도움보다 하나님의 얼굴/임재와 결부된 구원을 말합니다. 직역을 유지하되, 독자가 의미를 오해하지 않도록 후속 해석 여지를 남겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
