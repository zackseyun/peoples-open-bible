base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/021.yaml
  text: And the LORD sent an angel, who wiped out every mighty warrior, commander, and officer in the camp of the king of Assyria. So he returned to his own land with shame on his face. And when he entered the house of his god, some of those who came from his own body struck him down there with the sword.
translation:
  language: ko
  text: 야훼께서 천사를 보내셔서 앗수르 왕의 진영에 있는 모든 용사와 지휘관과 장교를[a] 멸하셨습니다. 그래서 그는 수치스러운 얼굴로[b] 자기 땅으로 돌아갔습니다. 그가 자기 신의 집에 들어갔을 때, 그에게서 난 자들이 거기서 그를 칼로 쳐 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 용사와 두 종류의 지도적 직함을 나열합니다. 이 직함들의 정확한 군사적 계층 관계는 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘얼굴의 수치와 함께’입니다. 공개적인 굴욕과 패배를 나타내는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָךְ
  english_pob_choice: an angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 메신저
  lexicon: מַלְאָךְ
  rationale: 본절은 신적 파견자를 가리키는 문맥이므로 한국어 성경 용례에 맞는 ‘천사’가 가장 자연스럽고, 단순한 ‘사자/메신저’보다 source의 초자연적 의미를 더 분명히 드러냅니다.
- source_word: גִּבּוֹר חַיִל / נָגִיד / שָׂר
  english_pob_choice: every mighty warrior, commander, and officer
  chosen_korean: 용사와 지휘관과 장교
  alternatives_korean:
  - 용사와 지도자와 지휘관
  - 용사와 군관과 관리
  lexicon: גִּבּוֹר חַיִל; נָגִיד; שָׂר
  rationale: POB의 ‘commander, and officer’를 따라 군사·행정적 구분을 살려 ‘지휘관’과 ‘장교’를 두었고, ‘מַחֲנֶה’의 군영 맥락에서 ‘장교’가 영어 선택을 가장 잘 반영합니다.
- source_word: בְּבוֹשֶׁת פָּנִים
  english_pob_choice: with shame on his face
  chosen_korean: 수치를 얼굴에 안고
  alternatives_korean:
  - 부끄러움을 얼굴에 안고
  - 얼굴에 수치를 지닌 채
  lexicon: בֹּשֶׁת; פָּנִים
  rationale: 히브리어 관용구를 직역적으로 유지하되, 한국어로는 상태 표현이 되도록 ‘수치를 얼굴에 안고’로 옮겨 shame on his face의 공개적 모욕감을 살렸습니다.
- source_word: הִפִּילֻהוּ בֶחָרֶב
  english_pob_choice: struck him down there with the sword
  chosen_korean: 칼로 쳐 죽였습니다
  alternatives_korean:
  - 칼로 쳤습니다
  - 칼로 쓰러뜨렸습니다
  lexicon: נָפַל / הִפִּיל; חֶרֶב
  rationale: 문맥상 단순 타격보다 치명적 살해가 분명하므로, 한국어로는 결과를 드러내는 ‘쳐 죽였습니다’가 POB의 ‘struck him down’보다 의미를 더 정확히 전달합니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: WLC의 יהוה를 학술적 음역인 ‘야훼’로 옮겨 source-direct 원칙을 따르고, 본문이 LXX 인용이 아닌 역사서 내 서술이므로 본문에 그대로 반영합니다.
  doctrine_reference: 'POB 기본 용례: יהוה → 야훼'
