- from: 그리고 다시 나는 환상 가운데에서 보았습니다. 모든 시내가 그 높은 지붕 아래에서 물러날 때까지, 땅의 갈라진 틈들이 평평해지고, 또 다른 깊은 구덩이들이 열렸습니다.
  to: 그리고 다시 나는 환상 가운데에서, 모든 시내가 그 높은 지붕에서 물러나고 땅의 갈라진 틈들이 평평해지며 다른 심연들이 열릴 때까지 보았습니다.
  rationale: 영어 POB와 원문의 지형 이미지를 따라 ‘높은 지붕’에서의 물러남을 보존하되, 한국어 문장 구조를 다듬었습니다. ‘심연들’로 옮겨 새로 열리는 깊은 공간의 강도를 유지했습니다. 해석상 불확실한 ‘높은 지붕’의 비유는 설명으로 완화하거나 다른 지형물로 대체하지 않았습니다.
