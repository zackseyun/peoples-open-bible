  category: mistranslation
  tier: 1
  from: Sheol and Abaddon lie open before Yahweh[b][a]; how much more the hearts of the sons of man.
  to: Sheol and Abaddon are before Yahweh[a]; how much more the hearts of human beings.
  rationale: נֶגֶד itself means “before” or “in the presence of.” Although the wider saying implies Yahweh’s complete knowledge, “lie open” supplies an exposure image not stated in this verse. “Human beings” naturally conveys the generic force of בְּנֵי אָדָם without retaining a source-language idiom as English gloss. The remaining Abaddon note is accurately placed and useful.
