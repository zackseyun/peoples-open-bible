translation:
  text: And because they take delight in their children, they will see the killing of their beloved ones.[a] They will wail over the destruction of their children and plead forever, but there will be no mercy or peace for them.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Ge'ez says 'their beloved ones.' The surrounding references suggest their children, but the word 'children' is not repeated in this phrase.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትፌሥሑ
  chosen: take delight
  alternatives:
  - rejoice
  rationale: Preserves the positive feeling toward their children without implying approval of what the children do.
- source_word: ቀትለ፡ ፍቁራኒሆሙ
  chosen: the killing of their beloved ones
  alternatives:
  - the slaughter of their loved ones
  rationale: Retains both the violent noun and the distinct expression 'beloved ones' rather than silently replacing it with 'children.'
- source_word: ሐጕለ፡ ውሉዶሙ
  chosen: the destruction of their children
  alternatives:
  - the ruin of their children
  rationale: Keeps the repeated reference to their children and the force of their loss.
- source_word: ይገዐሩ
  chosen: wail
  alternatives:
  - cry out
  - lament
  rationale: Conveys an audible expression of grief over the destruction.
- source_word: ይስእሉ፡ ለዓለም
  chosen: plead forever
  alternatives:
  - petition forever
  - ask continually
  rationale: Renders the appeal and its stated duration without supplying an unstated recipient or request.
- source_word: ምሕረት፡ ወሰላም
  chosen: mercy or peace
  alternatives:
  - compassion or peace
  rationale: Preserves both terms under the preceding negation; English 'or' makes clear that neither will be theirs.
theological_decisions:
- issue: The scope of the denied mercy and peace
  chosen_reading: There will be no mercy or peace for them.
  alternative_readings:
  - They will never receive forgiveness
  rationale: The Ge'ez explicitly denies mercy and peace to the people addressed by the judgment; it does not use a separate term for forgiveness here.
- issue: The force of 'forever' in their pleading
  chosen_reading: The pleading is described as continuing forever.
  alternative_readings:
  - The phrase itself defines the duration of their punishment
  rationale: The temporal phrase modifies their appeal in this verse. The translation does not turn it into a broader doctrinal claim.
