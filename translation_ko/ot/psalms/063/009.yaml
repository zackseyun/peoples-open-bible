  yaml_path: translation/ot/psalms/063/009.yaml
  text: But those who seek to destroy my life will go into the depths of the earth.[a]
  footnotes:
  - marker: a
    text: Or 'My soul clings close behind you.' The Hebrew literally says 'after you,' which can convey close pursuit or attachment.
