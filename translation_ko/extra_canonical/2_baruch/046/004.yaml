  source_fidelity: 첫 두 문장은 시리아어 본문과 영어 감사 번역의 의미를 대체로 충실히 반영합니다. 다만 마지막 행은 시리아어의 대구(‘이스라엘에는 지혜자가 부족하지 않으며 / 야곱의 자손에게는 율법의 아들이 부족하지 않는다’)를 한국어에서 잘못 결속하여, ‘야곱의 씨’가 ‘율법의 아들’을 수식하는 듯한 비문이 되었습니다.
  naturalness: ‘율법의 아들 야곱의 씨도 아니니라’는 현대 표준어로 문법적 관계와 부정의 범위가 불명확합니다. 대구를 두 절로 분명히 하고, 본문 전체를 합쇼체 종결로 통일하는 것이 자연스럽습니다.
  terminology: ܚܝܠܬܢܐ는 여기서 하나님을 가리키는 호칭이므로 영어 ‘Mighty One’에 상응하는 ‘전능하신 분’을 유지할 수 있습니다. ܒܪ ܢܡܘܣܐ(직역 ‘율법의 아들’)는 율법에 속하거나 율법에 정통한 사람을 뜻하므로, 현대 한국어 본문에서는 ‘율법에 정통한 사람’으로 옮기고 직역을 각주로 밝혔습니다.
  issues:
