  rationale: The verse reports the inner boast of the wicked. Carrying the first-person sense through the final clause yields the most coherent English and best reflects the psalm's portrayal of arrogant invulnerability. This is a grammatical/poetic decision rather than a doctrinally contested one.
  doctrine_reference: Translation philosophy §3, preserve ambiguity where genuine; here the main text adopts the most coherent reading and alternatives are preserved in a footnote.
