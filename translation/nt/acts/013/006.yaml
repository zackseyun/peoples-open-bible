  from: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
  to: After traveling through the whole island as far as Paphos, they encountered a Jewish sorcerer and false prophet named Bar-Jesus[a].
