translation:
  text: And they went to the daughters of humankind on the earth and lay with them—with those women—and defiled themselves,
    and revealed to them every sin.
  philosophy: optimal-equivalence
  footnotes: []
lexical_decisions:
- source_word: አዋልደ፡ ሰብእ
  chosen: the daughters of humankind
  alternatives:
  - the daughters of men
  - human daughters
  rationale: The construct means literally “daughters of man/humankind.” “Humankind” makes clear that these are human women
    in contrast to the Watchers without implying that they are daughters only of male persons.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: በዲበ፡ ምድር
  chosen: on the earth
  alternatives:
  - upon the earth
  - on the ground
  rationale: The phrase locates the Watchers’ action in the earthly realm; “on the earth” is clear modern English while retaining
    the cosmic contrast implicit in the narrative.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወስከቡ፡ ምስሌሆን
  chosen: and lay with them
  alternatives:
  - and slept with them
  - and had sexual relations with them
  rationale: In this context the verb denotes sexual intercourse. “Lay with” preserves the source’s concise euphemistic expression
    and elevated register without expanding it into a paraphrase.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ምስለ፡ እልኩ፡ አንስት
  chosen: with those women
  alternatives:
  - with those wives
  - with those females
  rationale: The phrase appears appositional or emphatically resumptive after “with them.” Rendering አንስት as “women” fits
    the immediate reference to human daughters; dashes preserve the emphatic repetition rather than deleting it as redundant.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወረኵሱ
  chosen: and defiled themselves
  alternatives:
  - and became unclean
  - and polluted themselves
  rationale: The verb carries impurity and defilement language. The reflexive English preserves that the Watchers rendered
    themselves unclean through the illicit unions.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ወአግሀዱ፡ ሎን
  chosen: and revealed to them
  alternatives:
  - and disclosed to them
  - and made known to them
  rationale: “Revealed” preserves the apocalyptic and forbidden-knowledge resonance of making hidden things known, while the
    feminine plural object refers back to the women.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
- source_word: ኵሎ፡ ኃጢአተ
  chosen: every sin
  alternatives:
  - all sin
  - every kind of sin
  rationale: The phrase is literally singular in form, “all/every sin.” “Every sin” is idiomatic while retaining the sweeping
    accusation; “every kind of sin” would explain the likely distributive sense but add wording not explicit in the witness.
  model_suggested_lexicon_unverified: Dillmann, Lexicon Linguae Aethiopicae
  consultation_status: No independently consulted lexicon entry is claimed by this application.
