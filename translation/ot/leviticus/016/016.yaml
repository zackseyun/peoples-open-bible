    rationale: The expression refers to the whole covenant people, not only Israel’s males or immediate sons.
  - source_phrase: טֻמְאֹת
    prior_rendering: uncleannesses
    new_rendering: uncleanness
    rationale: English uses this as a collective mass noun that includes the various instances and kinds of ritual impurity.
