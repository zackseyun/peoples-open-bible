id: 1CLEM.54.4
reference: 1 Clement 54:4
unit: verse
book: 1 Clement
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα οἱ πολιτευόμενοι τὴν ἀμεταμέλητον πολιτείαν τοῦ θεοῦ ἐποίησαν καὶ ποιήσουσιν.
  language: Greek
translation:
  text: These things those who live in God's unregretted[b] way of life have done and will do[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'live out the unrepented citizenship'.
    reason: previous_rendering
  - marker: b
    text: Earlier reader wording used a form of "repent." The Greek negative adjective describes a way of life without regret, not a refusal to reorient. Preserve that distinction.
    reason: lexical_alternative
