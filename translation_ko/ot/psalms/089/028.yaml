  lexicon: HALOT
  rationale: 여기서 בכור는 출생 순서보다 지위와 특권을 가리키는 왕적 칭호이므로, 혈통을 지나치게 부각하는 ‘맏아들’보다 서열·지위를 드러내는 ‘첫째로’가 문맥에 더 맞습니다.
- source_word: אֶתְּנֵהוּ
  english_pob_choice: I will make him
  chosen_korean: 세우며
  alternatives_korean:
  - 만들겠습니다
  - 정하겠습니다
  - 임명하겠습니다
  lexicon: HALOT
  rationale: נתן이 כאן에서는 어떤 신분이나 자격으로 ‘세우다/지정하다’는 결과적 의미를 가지므로, 한국어에서는 목적격 대상을 어떤 지위에 두는 뜻을 살려 ‘세우다’로 옮겼습니다.
- source_word: עֶלְיוֹן לְ/מַלְכֵי אָרֶץ
