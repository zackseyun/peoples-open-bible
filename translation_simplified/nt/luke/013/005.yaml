translation:
  language: en
  text: No, I tell you. But unless you repent[b], every one of you will likewise perish.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “perish in the same way.” The Greek points to comparable judgment but does not specify the exact kind of similarity.
    reason: lexical_alternative
  - marker: b
    text: Repentance here means a change of disposition and conduct, not merely feeling sorry or changing an opinion. Sorrow is not excluded. The surrounding passage supplies the direction and consequences; no extra degree of completeness is added.
    reason: lexical_alternative
