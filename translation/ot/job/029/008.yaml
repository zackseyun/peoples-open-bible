id: JOB.29.8
reference: Job 29:8
source:
  edition: WLC
  text: רָא֣וּ/נִי נְעָרִ֣ים וְ/נֶחְבָּ֑אוּ וִֽ֝/ישִׁישִׁים קָ֣מוּ עָמָֽדוּ׃
translation:
  text: the young men saw me and withdrew from sight; the aged rose and remained standing.
  philosophy: dynamic
lexical_decisions:
- source_word: רָאוּנִי
  chosen: saw me
  alternatives:
  - looked at me
  - caught sight of me
  lexicon: HALOT
  rationale: From ראה, the straightforward sense is visual perception, 'saw me.' No contextual pressure requires a more interpretive rendering.
- source_word: נְעָרִים
  chosen: young men
  alternatives:
  - youths
  - young people
  lexicon: HALOT
  rationale: The masculine plural refers to young males. In keeping with gender-accurate translation philosophy, 'young men' is preferred over the more generic 'young people'.
- source_word: וְנֶחְבָּאוּ
  chosen: hid themselves
  alternatives:
  - hid themselves
  - drew back
  lexicon: HALOT
  rationale: This is the verb’s direct concrete sense; deference is contextual implication, not a replacement meaning.
- source_word: וִישִׁישִׁים
  chosen: the aged
  alternatives:
  - old men
  - elders
  lexicon: HALOT
  rationale: ישישים denotes aged persons, especially old men. 'The aged' is dignified and fits the poetic register. 'Elders' could imply office rather than age, so it is avoided.
- source_word: קָמוּ
  chosen: rose
  alternatives:
  - stood up
  - got up
  lexicon: HALOT
  rationale: קום here marks the initial act of rising in respect. 'Rose' preserves the concise poetic movement.
- source_word: עָמָדוּ
  chosen: stood
  alternatives:
  - remained standing
  - took their stand
  lexicon: HALOT
  rationale: 'עמד follows קום to complete the picture: they not only rose but stood in Job''s presence. Rendering both verbs preserves the Hebrew emphasis rather than collapsing them into one English action.'
