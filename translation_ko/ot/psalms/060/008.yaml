  source_fidelity: 현 초안은 시편 60:8이 아니라 앞선 절(60:6)의 내용을 옮긴 것으로, 모압·에돔·블레셋 및 씻는 그릇/신발/외침이라는 히브리어 본문을 전혀 반영하지 못합니다. 본문을 해당 절의 마소라 본문에 따라 새로 옮겨야 합니다. 마지막 동사 הִתְרֹעָעִי는 여성 단수 명령형으로 읽히나 해석이 어려우므로, 명령형을 본문에 유지하고 대안적 선언문 해석은 주석으로 남깁니다.
  naturalness: ‘씻는 대야’는 현대 한국어에서 자연스럽고 סִיר רַחְצִי의 구체적 이미지를 보존합니다. ‘내 신을 던지겠습니다’는 시적이면서도 현대적으로 이해 가능합니다. 블레셋을 여성 단수로 의인화한 명령은 한국어에서 ‘블레셋아’로 자연스럽게 표현할 수 있습니다.
  terminology: 모압, 에돔, 블레셋은 통용되는 성서 지명 표기를 사용했습니다. נַעַל은 고대 배경을 반영하여 ‘신발’보다 ‘신’으로 옮겼습니다. ‘승리의 함성’은 רוע의 큰 외침이라는 뜻을 보존하되 군사적 의미를 과도하게 한정하지 않습니다.
  issues:
