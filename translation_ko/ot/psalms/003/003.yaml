  text: וְ/אַתָּ֣ה יְ֭הוָה מָגֵ֣ן בַּעֲדִ֑/י כְּ֝בוֹדִ֗/י וּ/מֵרִ֥ים רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/003.yaml
  text: But you, O Yahweh, are a shield around me[a], my glory, and the one who lifts up my head[b].
  footnotes:
  - marker: a
    text: Or “a shield for me” or “a shield on my behalf.” The Hebrew preposition can express protection in favor of someone and can also carry a protective-surrounding sense here.
    reason: lexical_alternative
  - marker: b
    text: The concrete image “lifts up my head” can suggest restored dignity, confidence, or vindication.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 야훼여, 주께서는 저를 둘러싼 방패이시며[a], 저의 영광이시고, 제 머리를 들어 올리시는 분이십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저를 위한 방패’ 또는 ‘저를 보호하시는 방패’. 히브리어 전치사는 ‘~을 위하여, ~을 대신하여’를 뜻할 수 있으나, 여기서는 보호를 위해 둘러싼다는 이미지로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘머리를 들어 올리다’는 존엄과 용기, 또는 억울함이 풀려 인정받음을 회복시키는 것을 나타낼 수 있는 히브리어 관용 표현입니다.
    reason: cultural_note
