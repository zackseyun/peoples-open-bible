  text: ζῶντι τοὺς ἐλπίζοντας ἐπʼ αὐτόν. 6 καὶ ἀνέστησαν ἐπὶ τοὺς δύο πρεσβύτας, ὅτι συνέστησεν αὐτοὺς Δανιὴλ ἐκ τοῦ στόματος αὐτῶν ψευδομάρτυρας ὄντας, καὶ ἐποίησαν αὐτοὶ οὗν τὸν τρόπον ἐπονηρεύσαντο
  language: Greek
  pages:
