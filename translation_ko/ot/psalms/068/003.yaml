base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/003.yaml
  text: But the righteous will be glad; they will exult before God and rejoice with joy.
  footnotes:
  - marker: a
    text: Or 'you scatter it' for 'you drive it away'; the Hebrew verb can denote being driven off, scattered, or blown away.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from before fire' and 'from before God,' an idiom meaning because of or in the presence of.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew imperfects may also be understood as future ('will drive away ... will perish') or as wish-like in context.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 의인들은 기뻐하고,[a] 하나님 앞에서 크게 즐거워하며, 기쁨으로 기뻐합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 의인들은 기뻐하고’. 히브리어 접속사는 단순히 ‘그리고’로 옮길 수도 있으나, 본문은 앞 절의 악인과 대조되는 흐름을 반영하여 ‘그러나’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘하나님 앞에서’이며, 하나님의 임재 안에서라는 뜻을 포함합니다.
    reason: lexical_alternative
