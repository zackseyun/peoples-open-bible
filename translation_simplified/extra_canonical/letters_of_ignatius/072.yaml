translation:
  language: en
  text: 'So I did my part as someone committed to unity. But God does not dwell where there is division and anger. The Lord forgives everyone when they reorient[a], if in reorientation they return to God’s unity and to the bishop’s council. I trust in the grace of Jesus Christ, who will break every chain that binds you. I urge you:


    Do nothing out of a spirit of faction. Instead, follow Christ’s teaching. I heard some people say, “If I do not find it in the written records, I do not believe it is in the Gospel.” When I told them, “It is written,” they replied, “That is the question.”


    But for me, Jesus Christ is my charter. The charter that cannot be broken is his cross, his death, his resurrection, and faith through him. In these I desire to be justified through your prayers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
