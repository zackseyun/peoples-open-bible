  rationale: κόσμον은 ‘세상’으로 옮기고, διοικέω 계열의 통치·관리 의미를 살려 ‘다스리다’로 번역했습니다.
- source_word: ἐν ὁσιότητι καὶ δικαιοσύνῃ
  english_pob_choice: in holiness and righteousness
  chosen_korean: 거룩함과 의로
  alternatives_korean:
