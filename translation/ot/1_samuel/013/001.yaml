theological_decisions:
- issue: Corrupt or difficult regnal formula in the Masoretic Text
  chosen_reading: Mark unrecoverable figures in the main text and preserve the Masoretic wording in the footnote
  alternative_readings:
  - Saul was thirty years old when he became king, and he reigned forty-two years over Israel
  - Saul was ... years old when he became king, and he reigned ... and two years over Israel
  - Saul was thirty years old when he became king, and he reigned two years over Israel
  rationale: The WLC Masoretic form yields the implausible accession age of one, and the complete reign length cannot be recovered securely. Editorial gaps show these uncertainties in the main text without supplying conjectural figures. The footnote gives the literal wording and the main interpretive alternatives.
  doctrine_reference: Translation philosophy §§1, 3, 5
