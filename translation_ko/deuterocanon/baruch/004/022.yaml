    rationale: 원문은 ‘너희의 구원을 바라며 영원하신 분을 의지하였다’는 의미입니다. ‘바라며 … 의지하였습니다’가 희망의 내용과 신뢰 대상을 자연스럽게 구분합니다.
  - severity: medium
    issue: ‘그 영원하신 구원자’의 ‘그’는 불필요한 지시성을 더하며, 자비의 출처를 나타내는 문장 배열이 부자연스럽습니다.
    rationale: 원문은 ‘너희의 영원하신 구원자에게서 너희에게 속히 올 자비’를 말합니다. 소유 관계와 출처 및 미래 수식을 명시적으로 재배열해야 합니다.
