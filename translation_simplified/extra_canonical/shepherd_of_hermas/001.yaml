  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Retain the selected Greek even where other witnesses differ; note1 distinguishes readings.
- source_word: δόξα
  chosen: honor
  alternatives:
  - glory
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Preserve the heavenly establishment of his honor without replacing it with the versional
    clauses.
- source_word: εὐκατάλλακτον
  chosen: readily reconciled
  alternatives:
  - favorable
  - propitious
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Preserve the source description and its link to righteous planning.
- source_word: μετανοήσουσιν
  chosen: will repent
  alternatives:
  - will greatly regret (different Athos verb)
  - will their souls repent? (rhetorical interpretation)
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Retain working future as printed statement and disclose alternative verb and punctuation.
    Contextual repentance policy does not decide between manuscripts.
- source_word: ἰάσεται
  chosen: will heal
  alternatives:
  - will forgive (Palatina reading)
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Keep the healing image rather than harmonizing it to the Latin forgiveness wording.
- source_word: πάντων τῶν ἁγίων
  chosen: all the holy ones
  alternatives:
  - all the saints
  lexicon: Recorded Greek and bounded primary witness comparison
  rationale: Preserve the complete scope of the closing promise.
