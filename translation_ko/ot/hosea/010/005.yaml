revisions:
- from: 사마리아 주민들은 벧아웬의 송아지들 때문에 떨며, 그 백성은 그것으로 말미암아 슬퍼하고, 그 우상 제사장들은 그것으로 말미암아, 그 영광 때문에 통곡합니다. 그것이 그들에게서 떠났기 때문입니다.
  to: 사마리아 주민들은 벧아웬의 송아지들 때문에 떱니다. 그 백성은 그것을 두고 슬퍼하고, 그 우상 제사장들은 그 영광을 두고 기뻐합니다. 그 영광이 그것에게서 떠났기 때문입니다.
  rationale: 원문의 동사 יָגִילוּ를 ‘기뻐합니다’로 회복하고, עַל의 반복 관계를 ‘~을 두고’로 옮겼습니다. 마지막 절의 ‘그 영광’과 ‘그것’은 원문의 대명사 지시가 논의될 수 있으므로 특정 해석을 덧붙이지 않고 보존했습니다.
