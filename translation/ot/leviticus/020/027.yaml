  category: meaning_retranslation
  from: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
  to: A man or a woman who is a medium or a spiritist[a] must be put to death. They must be stoned; they are responsible for their own deaths[b].
  rationale: The lexical record favors practitioner meanings for 'medium' and 'spiritist' while acknowledging that the terms can also denote associated spirits. I retain both the male/female formulation and that lexical uncertainty, but replace the opaque containing construction and make the documented meaning of the blood formula explicit.
