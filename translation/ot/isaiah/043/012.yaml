theological_decisions:
- issue: Interpretation of זָר in the clause וְאֵין בָכֶם זָר
  chosen_reading: foreign god
  alternative_readings:
  - stranger
  - foreigner
  rationale: The immediate context centers on YHWH's unique role in declaring, saving, and making known, contrasted with other deities. Rendering זָר as 'foreign god' best captures the polemical monotheistic force of the verse rather than a social reference to a foreign person.
  doctrine_reference: Preserve theological tension rather than resolve it; here the context sufficiently supports the deity sense, so no unresolved ambiguity remains in the main text.
- issue: Rendering of the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
