theological_decisions:
- issue: Identification of the tower
  chosen_reading: The tower represents the Church, personified as the woman speaking.
  rationale: 'The speaker self-identifies: "The tower that you see being built— I am the Church." The
    allegory is explicit in the text.'
- issue: Rendering of Ἐκκλησία
  chosen_reading: Translate as "Church" (capitalized).
  alternative_readings:
  - assembly
  - congregation
  rationale: Hermas speaks of the Christian community as a single, personified entity; capitalization
    signals ecclesial, not generic, sense.
- issue: Capitalizing "Name" for ὄνομα
  chosen_reading: Capitalize "Name" as a reverential circumlocution for God.
  alternative_readings:
  - lowercase "name"
  rationale: Jewish and early Christian usage treats "the Name" as a reverent stand-in for the divine;
    Hermas’s phrase "the Almighty and glorious Name" functions this way.
- issue: Scope of "these revelations have an end—they are complete"
  chosen_reading: Refers to a finite set of visions in this cycle, not to the cessation of all revelation.
  alternative_readings:
  - Cessationist claim about prophecy ending
  rationale: Immediate context concerns Hermas’s persistent asking; "these revelations" points to a bounded
    series that are now complete, even if Hermas keeps asking.
- issue: Rendering of ἅγιοι
  chosen_reading: Render as "holy ones" in main text.
  alternative_readings:
  - saints
  rationale: Maintains literalness while avoiding later ecclesiastical sense; readers can equivalently
    understand "saints."
- issue: 'Titles for God: κύριος vs δεσπότης'
  chosen_reading: Render κύριος as "Lord" and δεσπότης as "Master" to preserve distinct nuances.
  alternative_readings:
  - Both as "Lord"
  rationale: Differentiation reflects the text’s distinct lexemes and avoids flattening titles.
- issue: Contextual repentance reassessment
  chosen_reading: Exact reader wording is recorded in config/terminology/repentance-contextual-2026-10-13.json#translation/extra_canonical/shepherd_of_hermas/011.yaml
  alternative_readings:
  - Prior wording and its rationale remain at the pinned baseline and in review history.
  rationale: Use repentance for moral change while preserving the works own teaching about baptism, forgiveness,
    conduct and the angel of repentance; do not impose a different tradition on it.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
