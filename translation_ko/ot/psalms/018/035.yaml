  text: You gave me the shield of your salvation, and your right hand supported me, and your humility[a] made me great.
  footnotes:
  - marker: a
    text: Or “your gentleness.” The Hebrew can denote humility, meekness, or gentleness.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 제게 주의 구원의 방패를 주셨고, 주의 오른손이 저를 붙들어 주셨으며, 주의 겸손하심이 저를 크게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 온유하심이 저를 크게 하셨습니다.’ 히브리어 낱말은 겸손, 온유, 부드러움을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלַמֵּד
  english_pob_choice: trains
  chosen_korean: 익숙하게 하시고
  alternatives_korean:
  - 훈련시키시고
  - 가르치시고
  lexicon: HALOT
  rationale: למד는 ‘가르치다’뿐 아니라 실제 수행에 맞게 ‘훈련하다/익숙하게 하다’의 뜻이 가능하므로, 전투 맥락에서는 기능적 준비를 드러내는 ‘익숙하게 하시고’가 가장 자연스럽습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: for battle
  chosen_korean: 싸움에
  alternatives_korean:
  - 전쟁에
  - 전투에
  lexicon: HALOT
  rationale: מלחמה는 넓게는 전쟁이지만, 손을 단련시키는 대비와 짝지을 때는 일상 한국어에서도 곧바로 이해되는 ‘싸움’이 시적 긴장을 잘 살립니다.
- source_word: וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי
  english_pob_choice: my arms can bend a bow of bronze
  chosen_korean: 제 팔로 놋 활도 휘게 하십니다
  alternatives_korean:
  - 제 팔이 놋 활을 휘게 합니다
  - 제 팔이 놋 활을 구부릴 수 있습니다
  lexicon: HALOT
  rationale: 난해한 절이지만 POB의 선택처럼 능력 부여의 결과를 살려 능동적 가능 문장으로 옮겼습니다. ‘놋’은 활의 강인함을 드러내는 금속 표현으로 한국어 성경 문체에서 자연스럽습니다.
theological_decisions:
- issue: 난해한 절 וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי의 의미
  chosen_reading: 하나님이 시편 기자에게 전투에 필요한 능력을 주셔서, 그의 팔이 놋 활까지 휘게 되는 강화와 সক্ষম의 의미로 읽었습니다.
  alternative_readings:
  - 제 팔이 놋 활을 굽힙니다
  - 놋 활이 제 팔에 의해 굽혀집니다
  rationale: 히브리어는 압축적이라 능동/수동 모두 가능하지만, 앞절과의 평행에서 핵심은 하나님의 훈련이 낳는 실제적 능력입니다. 따라서 모호함을 지우지 않으면서도 시적 힘을 살리는 방향을 택했습니다.
  doctrine_reference: Translation philosophy §3 (의도된 긴장을 보존하고 과도한 해소를 피함)
