  from: For you will not abandon my soul to Sheol[a][b], nor will you let your faithful one see the pit.
  to: For you will not abandon me to Sheol, nor will you let your faithful one see the pit.[a]
  rationale: 'Changing נפשי from “my soul” to “me” is justified: here the possessive נפש idiomatically refers to the psalmist himself, and “me” avoids an unwarranted separable-soul implication. The main-line renderings “Sheol,” “faithful one,” and “the pit” remain source-faithful. The existing notes are wrongly anchored after “Sheol,” although they concern חסידך and שחת. One note at the end may cover both alternatives, but it should identify them as separate lexical alternatives rather than present “holy one see corruption” as a single, fused alternative reading.'
