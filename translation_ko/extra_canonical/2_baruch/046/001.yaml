  text: 'And my son and the elders of the people answered and said to me,


    "Has the Mighty One humbled us so greatly as to take you from us so suddenly?'
translation:
  language: ko
  text: 내 아들과 백성의 장로들이 내게 대답하여 말하였습니다. “전능하신 분께서 우리를 그토록 낮추시어 당신을 우리 곁에서 그토록 갑자기 데려가셨습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ / Mighty One
  english_pob_choice: the Mighty One
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 능하신 분
  - 전능자
  lexicon: 2 Baruch 46:1
  rationale: 신명칭을 인격적으로 부르면서도 2인칭이 아닌 서술형 칭호를 유지하기 위해 ‘전능하신 분’으로 옮겼습니다. “하나님”을 앞세우지 않은 것은 본문의 호칭 자체를 보존하기 위함입니다.
- source_word: ܡܟܟ / humbled us
  english_pob_choice: humbled us so greatly
  chosen_korean: 우리를 이렇게 낮추셔서
  alternatives_korean:
  - 우리를 이처럼 겸손하게 하셔서
  - 우리를 아주 낮추셔서
  lexicon: 2 Baruch 46:1
  rationale: 동사의 핵심은 ‘낮추다/굴욕을 주다’의 의미이므로, 문맥상 자연스러운 ‘낮추시다’로 옮겼습니다. ‘이렇게’는 영어 POB의 강한 정도 부사를 반영합니다.
- source_word: ܠܣܒܟ ... ܡܢܢ / to take you from us
  english_pob_choice: to take you from us
  chosen_korean: 당신을 우리에게서 데려가셨습니까
  alternatives_korean:
  - 당신을 우리에게서 데려가셨습니까
  - 당신을 우리에게서 빼앗아 가셨습니까
  lexicon: 2 Baruch 46:1
  rationale: ‘데려가다’는 출발의 사실을 직접 드러내면서도 과도한 해석을 피합니다. ‘빼앗다’는 가능하지만, 본문은 우선 이동/이별의 충격을 말하므로 기본형을 택했습니다.
- source_word: ܒܦܬܡܐ / suddenly
  english_pob_choice: so suddenly
  chosen_korean: 너무 갑자기
  alternatives_korean:
  - 그렇게 갑자기
  - 너무도 갑자기
  lexicon: 2 Baruch 46:1
  rationale: 영어 POB의 ‘so suddenly’는 사건의 급작스러움을 강조하므로, 한국어에서는 자연스러운 강조 부사 ‘너무’로 그 강도를 살렸습니다.
theological_decisions:
- issue: ‘the Mighty One’의 신칭을 직역할지, 한국 교회 관용어를 쓸지
  chosen_reading: ‘전능하신 분’으로 신칭의 절제된 직접성을 유지했습니다.
  alternative_readings:
  - 하나님
  - 전능자
  rationale: 본 절은 인물들의 탄식 인용문으로, 호칭의 개별성을 보존하는 것이 중요합니다. ‘하나님’은 내용상 가능하지만 원문 호칭의 서술적 뉘앙스를 다소 평준화할 수 있습니다.
  doctrine_reference: 명칭 번역의 직결성과 문체 보존 원칙
- issue: 질문문의 긴장과 비난성 뉘앙스를 완화하지 않을지
  chosen_reading: 반어적 탄식 그대로의 질문형으로 유지했습니다.
  alternative_readings:
  - 평서문으로 완화
  - ‘정말’ 같은 완화 부사 추가
  rationale: 문맥상 이 말은 단순 정보 질문이 아니라 상실과 충격을 드러내는 탄식입니다. 따라서 감정의 날을 누그러뜨리지 않고 질문형으로 남겼습니다.
  doctrine_reference: 서사 내 애가/탄식의 수사 유지 원칙
