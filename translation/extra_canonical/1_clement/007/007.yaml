id: 1CLEM.7.7
reference: 1 Clement 7:7
unit: verse
book: 1 Clement
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰωνᾶς Νινευίταις καταστροφὴν ἐκήρυξεν· οἱ δὲ μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν ἐξιλάσαντο τὸν θεὸν ἱκετεύσαντες καὶ ἔλαβον σωτηρίαν, καίπερ ἀλλότριοι τοῦ θεοῦ ὄντες.
  language: Greek
translation:
  text: Jonah proclaimed destruction to the Ninevites; but they[a], having repented[b] of their sins, made atonement to God by their supplication and received salvation, though they were strangers to God.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'made atonement before God'.
    reason: previous_rendering
  - marker: b
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in the appeal to leave sin or faction, preserving separate return verbs and the writers own exhortation.
    reason: lexical_alternative
