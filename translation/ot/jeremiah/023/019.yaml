- issue: Rendering the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Aspect of prophetic perfect יָצְאָה
  chosen_reading: has gone out
  alternative_readings:
  - goes out
  - will go out
  rationale: The Hebrew perfect in prophetic judgment contexts often presents a future event as certain. Rendering it as present perfect preserves that rhetorical force without flattening it into a simple future.
