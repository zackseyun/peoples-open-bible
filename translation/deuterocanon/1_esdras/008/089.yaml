    translation:
      text: And while Ezra was praying and making confession[a], weeping as he lay prostrate before the temple[b], a very
        great crowd gathered to him from Jerusalem—men and women and young men—for there was great weeping among the multitude.
      philosophy: optimal-equivalence
      footnotes:
      - marker: a
        text: Or 'was giving thanks'; the Greek verb can bear either sense, but here the penitential context favors 'making
          confession.'
        reason: lexical_alternative
      - marker: b
        text: Greek 'young men'; the term is masculine, not a gender-neutral word for youths in general.
        reason: lexical_alternative
    lexical_decisions:
    - source_word: προσευχόμενος
      chosen: was praying
      alternatives:
      - praying
      - was in prayer
      lexicon: BDAG
      rationale: Present participle in narrative context is best rendered with progressive aspect in English to show ongoing
        action concurrent with the following verbs.
    - source_word: ἀνθωμολογεῖτο
      chosen: was making confession
      alternatives:
      - was confessing
      - was giving thanks
      lexicon: LSJ
      rationale: In this penitential context, and in light of the Ezra parallel, the verb carries the sense of open confession
        rather than thanksgiving. 'Making confession' preserves the formal, public nuance.
    - source_word: κλαίων
      chosen: weeping
      alternatives:
      - crying
      lexicon: BDAG
      rationale: '''Weeping'' better matches the solemn penitential setting than the broader ''crying.'''
    - source_word: χαμαιπετής
      chosen: as he lay prostrate
      alternatives:
      - fallen on the ground
      - prostrate on the ground
      lexicon: LSJ
      rationale: The adjective denotes being stretched on the ground. 'Lay prostrate' gives natural English while preserving
        the bodily posture of humiliation.
    - source_word: ἔμπροσθεν τοῦ ἱεροῦ
      chosen: before the temple
      alternatives:
      - before the sanctuary
      - in front of the temple precinct
      lexicon: BDAG
      rationale: ἱερόν refers to the temple complex rather than the inner shrine specifically. 'Temple' is the clearest natural
        rendering here.
    - source_word: ἐπισυνήχθησαν πρὸς αὐτόν
      chosen: gathered to him
      alternatives:
      - assembled around him
      - were gathered to him
      lexicon: BDAG
      rationale: The passive/deponent form is naturally rendered as an intransitive gathering movement toward Ezra. 'Gathered
        to him' preserves the directional force of πρὸς.
    - source_word: ὄχλος πολὺς σφόδρα
      chosen: a very great crowd
      alternatives:
      - an exceedingly large crowd
      - a very large multitude
      lexicon: BDAG
      rationale: This reproduces both πολὺς and the intensifier σφόδρα without sounding wooden.
    - source_word: νεανίαι
      chosen: young men
      alternatives:
      - youths
      - young people
      lexicon: LSJ
      rationale: The Greek is masculine and specifically denotes young males, not a mixed-gender youth group. This follows
        the project's gender-accurate policy.
    - source_word: κλαυθμὸς
      chosen: weeping
      alternatives:
      - lamentation
      - crying
      lexicon: BDAG
      rationale: The noun denotes audible mourning. 'Weeping' fits the immediate context and reads smoothly with the verbal
        repetition.
    - source_word: ἐν τῷ πλήθει
      chosen: among the multitude
      alternatives:
      - in the crowd
      - among the people
      lexicon: BDAG
      rationale: '''Among the multitude'' preserves the collective sense and echoes the elevated narrative register without
        becoming archaic.'
    theological_decisions:
    - issue: Sense of ἀνθωμολογεῖτο in a penitential setting
      chosen_reading: confessional language ('making confession')
      alternative_readings:
      - thanksgiving/praise language ('giving thanks')
      rationale: Although the verb can in some contexts denote praise or thanksgiving, the surrounding actions of prayer,
        tears, prostration, and the close thematic alignment with Ezra's penitential prayer favor confession of sin here.
      doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
    - issue: Rendering of νεανίαι
      chosen_reading: '''young men'''
      alternative_readings:
      - '''youths'''
      - '''young people'''
      rationale: The source is grammatically masculine and contextually lists demographic groups separately. Per the gender-accurate
        policy, the masculine reference should not be neutralized.
      doctrine_reference: DOCTRINE.md §Translation philosophy 4
    - issue: Temple terminology for ἱερόν
      chosen_reading: '''temple'''
      alternative_readings:
      - '''sanctuary'''
      rationale: The Greek term ordinarily denotes the temple precinct/complex. 'Temple' is broad enough to preserve that
        sense without implying only the inner sanctuary.
      doctrine_reference: DOCTRINE.md §Translation philosophy 6
