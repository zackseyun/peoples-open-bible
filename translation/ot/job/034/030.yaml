id: JOB.34.30
reference: Job 34:30
source:
  edition: WLC
  text: מִ֭/מְּלֹךְ אָדָ֥ם חָנֵ֗ף מִ/מֹּ֥קְשֵׁי עָֽם׃
translation:
  text: so that a godless man may not reign and ensnare the people[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “lest a godless man reign because of the snares of the people.” The Hebrew is compressed.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמְּלֹךְ
  chosen: lest ... reign
  alternatives:
  - from reigning
  - lest ... reign
  lexicon: HALOT
  rationale: The preposition מן with the infinitive construct is read preventively in dependence on the preceding context.
- source_word: אָדָם
  chosen: man
  alternatives:
  - humankind
  - person
  lexicon: HALOT
  rationale: Here אָדָם refers to an individual human ruler, not humanity in general. Per doctrine, gender-accurate rendering is preferred where the source intends it; 'man' fits the singular representative sense.
- source_word: חָנֵף
  chosen: godless
  alternatives:
  - profane
  - hypocritical
  - impious
  lexicon: HALOT
  rationale: חָנֵף in wisdom literature commonly denotes one who is irreverent or ungodly rather than merely insincere. 'Godless' communicates the moral-religious force more clearly than 'hypocrite' in modern English.
- source_word: מִמֹּקְשֵׁי
  lemma: מִן
  chosen: from ensnaring
  alternatives:
  - because of the snares of
  - from the snares of
  - lest there be snares for
  lexicon: HALOT
  rationale: The noun מוֹקֵשׁ means 'snare/trap.' In this compressed poetic line, the preposition מִן likely marks prevention with the sense of keeping the people from being trapped. Rendering it verbally as 'from ensnaring' produces natural English while preserving the causal-preventive force.
- source_word: עָם
  chosen: the people
  alternatives:
  - a people
  - the populace
  lexicon: HALOT
  rationale: With the context of public rule and oppression, עָם is best rendered generically as 'the people,' referring to the community under a ruler.
- source_word: מִמֹּקְשֵׁי עָם
  chosen: because of the snares of the people
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: This preserves the plural construct phrase and its overt relation to עָם. A preventive sense involving the people's being ensnared remains possible but requires supplying that relation.
