lexical_decisions:
- source_word: νῦν οὖν
  chosen: Now then
  alternatives:
  - Now therefore
  - So now
  lexicon: LSJ
  rationale: The combination marks a transition and inference. 'Now then' is natural modern English while preserving the exhortatory flow.
- source_word: ὀρθῶς ποιήσεις
  chosen: you will do well
  alternatives:
  - you will act rightly
  - you will do the right thing
  lexicon: LSJ
  rationale: This idiom commends a course of action rather than making a bare moral statement. 'You will do well' captures the epistolary/request nuance in readable English.
- source_word: ἀποστείλας
  chosen: to send
  alternatives:
  - by sending
  - having sent
  lexicon: LSJ
  rationale: 'Although formally an aorist participle, in English it is best represented as the content of what the addressee should do: ''you will do well to send.'' This preserves sense without awkward literalism.'
- source_word: ἡμῖν
  chosen: us
  alternatives:
  - to us
  lexicon: LSJ
  rationale: The dative with ἀποστείλας naturally means 'send to us.' In idiomatic English the indirect object can be expressed simply as 'send us.'
- source_word: ἄνδρας
  chosen: men
  alternatives:
  - soldiers
  - fighters
  lexicon: LSJ
  rationale: The Greek specifically says 'men,' not a more technical military term. Since the context is military, their function is clarified by the following clause rather than replacing the noun with an interpretive gloss.
- source_word: οἳ συμμαχήσουσίν μοι
  chosen: who will fight alongside me
  alternatives:
  - who will be allies with me
  - who will help me in battle
  lexicon: LSJ
  rationale: The verb denotes fighting as an ally, not merely general assistance. 'Fight alongside me' makes the military sense explicit and natural in English.
- source_word: ἀπέστησαν
  chosen: have deserted
  alternatives:
  - have withdrawn
  - have defected
  - have revolted
  lexicon: LSJ
  rationale: In this military context, the sense is that his forces have abandoned him. 'Have deserted' best conveys the practical force of the verb here.
- source_word: πᾶσαι αἱ δυνάμεις μου
  chosen: all my forces
  alternatives:
  - all my troops
  - all my armies
  - all my power
  lexicon: LSJ
  rationale: δυνάμεις can mean forces/troops in military contexts. 'Forces' preserves the breadth of the term without overcommitting to a specific unit size.
