    rationale: 원문은 성읍을 매복의 대상으로 제시하며 성읍 뒤라는 위치를 밝힙니다. ‘향해’는 불필요하게 방향성을 부각할 수 있습니다.
  revised_text: 그가 그들에게 이렇게 명령했습니다. “보십시오, 여러분은 성읍 뒤에 매복하십시오. 성읍에서 너무 멀리 떨어지지 말고, 여러분 모두 준비하고 있으십시오.”
