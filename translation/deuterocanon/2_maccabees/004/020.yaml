lexical_decisions:
- source_word: ἕνεκα
  chosen: because of
  alternatives:
  - for the sake of
  - on account of
  lexicon: LSJ
  rationale: Causal preposition introducing the reason or occasion. 'Because of' is clear modern English and preserves the causal force.
- source_word: τῶν παρόντων
  chosen: the present circumstances
  alternatives:
  - the present situation
  - what is at hand
  - the current needs
  lexicon: LSJ
  rationale: The articular neuter plural participle functions substantivally, referring broadly to matters presently obtaining. 'The present circumstances' best captures the idiomatic sense without over-specifying.
- source_word: κατασκευάς
  chosen: outfitting
  alternatives:
  - equipment
  - preparation
  - construction
  lexicon: LSJ
  rationale: In the naval context created by 'triremes,' the noun refers to preparation/equipping rather than literal building alone. 'Outfitting' conveys practical provisioning and preparation in idiomatic English.
- source_word: τριηρέων
  chosen: triremes
  alternatives:
  - warships
  - three-banked ships
  lexicon: LSJ
  rationale: A specific ancient ship type is named. Following the project's preference to translate meaning while preserving historical specificity, 'triremes' is the most accurate rendering; a more generic 'warships' would lose precision.
