  to: 내가 그들을 쳐부수었으므로, 그들은 일어날 수 없었고 내 발 아래에 쓰러졌습니다.
  rationale: 원문 절에 맞추어 전체를 교체했습니다. ‘쳐부수었으므로’는 אֶמְחָצֵם의 강한 전투 동작과 이어지는 결과를 자연스럽게 연결하며, ‘일어날 수 없었고’는 יֻכְלוּ קוּם을, ‘내 발 아래에 쓰러졌습니다’는 יִפְּלוּ תַּחַת רַגְלָי를 충실히 반영합니다. 본문 자체로 충분히 명료하므로 어휘 대안 각주는 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:06:33Z'
