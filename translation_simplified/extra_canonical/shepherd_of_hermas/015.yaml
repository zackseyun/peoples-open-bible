translation:
  text: 'VII.1. “As for the other stones you saw thrown far from the tower, falling into the road and
    rolling from the road into pathless places[h]: they have believed, but their double-mindedness[l]
    makes them abandon their true road. Thinking they can find a better road, they go astray and suffer
    misery as they walk in pathless places.”


    VII.2. “Those that fall into the fire and are burned have finally turned away from the living God[m].
    It no longer came up into their heart to repent[a], because of their cravings for lewdness[b] and
    the evils they have done.”


    VII.3. “Do you want to know who the others are that fall near the waters but cannot roll into the
    water? They have heard the word and want to be baptized into the name of the Lord[j]. Then, when the
    purity of the truth[c] comes to their remembrance, they change their mind[d] and go back again after
    their evil desires.”


    VII.4. So she finished explaining the tower.


    VII.5. Plucking up my courage[n] again, I asked her further whether all these stones that were cast
    away and did not fit into the building of the tower have repentance[k] and a place in this tower.
    “They have repentance,” she says, “but they cannot fit into this tower[o].”


    VII.6. “Rather, they will fit in another place, much smaller[e]. This will be when they have been
    tormented[p] and have completed the days of their sins[i]. They will be transferred[q] because they
    have shared in the righteous word[f]. Then it will happen that they are transferred from their torments[r],
    if the evil deeds they have done come up into their heart[g]. But if they do not come up into their
    heart, they are not saved because of their hardness of heart[s].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Repent renders metanoēsai in paragraph2: these people no longer contemplate moral change away
      from the evil just named. The earlier cognitive-only note was attached to this clause despite the
      later contextual reassessment; it is corrected here. Paragraph3 instead describes reconsidering
      baptism and returning to evil, so its same Greek verb family is rendered change their mind. The
      directions are not homogenized.'
    reason: textual_variant
  - marker: b
    text: Lewdness renders aselgeia, also licentiousness, sensuality or wantonness. Cravings and the evils
      they have done remain separate expressions. The earlier cravings choice is retained.
    reason: lexical_alternative
  - marker: c
    text: Purity of the truth renders hagnōtēs tēs alētheias, also chastity of the truth. Sinaiticus15.3
      retains hagnōtēs; Athos PlateIII instead prints gnōsis, knowledge, with an editorial question mark.
      Vulgata printed22 has holiness of the truth and Palatina printed47 chastity of truth. The Ethiopic
      edition’s Latin rendering printed121 describes forgetting justice instead of this exact purity-remembrance
      clause. These differences are disclosed without replacing the working reading.
    reason: textual_variant
  - marker: d
    text: Change their mind renders metanoousin here as reconsidering their intention to be baptized,
      followed by returning to evil desires. Rendering every occurrence repent would obscure that direction.
      Vulgata printed22 describes drawing back; Palatina printed47 uses poenitentur but likewise continues
      with the return to wrongful desires. The earlier contextual distinction is retained.
    reason: textual_variant
  - marker: e
    text: Much smaller renders poly elattoni, also much lesser or inferior; the phrase can concern lesser
      standing rather than measured size. Sinaiticus15.6, Athos, Vulgata printed23 and Palatina printed47
      retain a lesser-place formulation. The Ethiopic edition’s Latin rendering printed121–122 has a difficult
      construction about another side or place; its footnote proposes a much-inferior wording. That editorial
      proposal is not counted as preserved Ethiopic corroboration.
    reason: textual_variant
  - marker: f
    text: The righteous word retains the earlier adjectival interpretation of tou rhēmatos tou dikaiou.
      The alternative is the word of the Righteous One, with that person’s identity not named in this
      phrase. Sinaiticus15.6 and Athos retain the Greek expression; both Latin editions have a just or
      righteous word, while the Ethiopic edition’s Latin rendering has a word of righteousness. Those
      formulations do not eliminate the Greek alternative or establish a uniquely named referent.
    reason: textual_variant
  - marker: g
    text: Come up into their heart is the idiom for coming to mind or remembrance. In the selected positive
      condition its subject is the evil deeds; the following they refers to those deeds. The earlier English
      plural-pronoun adjudication is retained, without turning the recollection into an unconditional
      salvation statement.
    reason: lexical_alternative
  - marker: h
    text: Pathless places renders anodiai, also trackless or roadless places, preserving the road/no-road
      contrast. Sinaiticus15.1 has pathless places at the first destination but anomiais, lawlessnesses,
      in the final phrase without an encoded correction there. Palatina printed45 speaks of another road
      and perverse ways. The selected repeated pathless image remains.
    reason: textual_variant
  - marker: i
    text: Complete the days of their sins retains the literal expression associated here with torment.
      Fulfill the days is an alternative. The passage gives no numerical duration, and the translation
      does not calculate one or equate it with a named later doctrine.
    reason: lexical_alternative
  - marker: j
    text: Baptized into the name translates eis to onoma; in the name is a common alternative. Lord renders
      kyrios. The selected intention to be baptized is retained; these people are not described here as
      having completed baptism.
    reason: lexical_alternative
  - marker: k
    text: Repentance and related expressions are read in this works own context; they are not restricted
      to feeling sorry, and no uniform Godward formula is imposed. Use repentance for moral change while
      preserving the works own teaching about baptism, forgiveness, conduct and the angel of repentance;
      do not impose a different tradition on it. In section 2 use repent for refusal to leave evil, aligning
      the unit record; in section 3 retain change their mind for abandoning baptism. The same Greek family
      has opposite contextual directions.
    reason: lexical_alternative
  - marker: l
    text: Double-mindedness renders dipsychia, divided or wavering commitment. The selected text says
      these people have believed but abandon their true road because of that wavering. It does not remove
      either their prior belief or their departure.
    reason: lexical_alternative
  - marker: m
    text: Finally turned away renders eis telos apostantes, also completely or definitively departed;
      turned away to the end of life is a possible temporal interpretation, not an added date in the main
      text. The selected living God is retained in Sinaiticus15.2, Athos and both Latin versions. The
      Ethiopic edition’s Latin rendering printed121 instead has living Lord. The source’s no-longer-contemplating-repentance
      claim remains.
    reason: textual_variant
  - marker: n
    text: Plucking up my courage retains the earlier choice for anaideusamenos, renewed boldness or casting
      off bashfulness; boldly, even shamelessly, questioning her is an alternative with a more reproachful
      tone. The word can suggest persistence past ordinary restraint. The main text’s idiom is not a claim
      that the form uniquely establishes a positive emotional state. No earlier adjudication is silently
      replaced.
    reason: lexical_alternative
  - marker: o
    text: The question concerns all the cast-away stones that do not fit; the answer gives them repentance
      but denies that they can fit into this tower. Sinaiticus15.5 and Athos retain that distinction.
      Vulgata printed22–23 and Palatina printed47 likewise distinguish repentance from fitting in this
      tower. Another place in paragraph6 is not silently identified with admission to this tower.
    reason: textual_variant
  - marker: p
    text: Tormented and torments retain the severity of basanizō/basanoi, with pains or being painfully
      tested as lexical alternatives. The selected text gives torment and completion of the days of sins
      before the lesser-place fitting. It does not name purgatory, specify a location, or say whether
      this occurs before or after death.
    reason: lexical_alternative
  - marker: q
    text: Transferred renders metatithēmi, moved or relocated. The reason stated for this transfer is
      that they shared in the righteous word. The later phrase explicitly says transferred from their
      torments; these clauses and their stated reasons or conditions are not collapsed into one unqualified
      promise.
    reason: lexical_alternative
  - marker: r
    text: The working text makes transfer from torment conditional on their evil deeds coming into their
      heart. Vulgata printed23 retains that positive condition. Sinaiticus15.6 and Palatina printed47
      instead have because of the evil works in the corresponding sequence, without this positive if-remembrance
      clause. Athos PlateIII’s ending has a repentance expression in a difficult conditional sequence
      and lacks the selected complete paired transition. It is not silently emended or counted as complete
      confirmation of the working conditional. The Ethiopic edition’s Latin rendering printed122 gives
      self-affliction and evils becoming manifest in hearts in its different formulation. The working
      condition remains explicitly selected and the disagreement remains open.
    reason: textual_variant
  - marker: s
    text: If the evil deeds do not come into their heart, the working text says they are not saved because
      of hardness of heart. Sinaiticus15.6 retains a negative final condition; ca adds metanoēsai, to
      repent, after heart. Vulgata printed23 brackets poenitentiam agere, an editorial supply stated to
      be absent from the Latin codices; Palatina printed47’s note proposes adding repentance, also not
      preserved main text. The Ethiopic edition’s Latin rendering printed122 brackets non, not, in its
      condition and gives wickedness as the final reason. Those editorial supplies are not counted as
      preserved negative or repentance wording in the respective manuscripts. The selected denial, condition
      and hardness of heart are all retained.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνοδίαι
  chosen: pathless places
  alternatives:
  - trackless places
  - roadless places
  - rough places
  lexicon: LSJ
  rationale: Alpha-privative from ὁδός (“road”); in Hermas denotes places without a way—“pathless places”
    keeps the metaphor of leaving the road.
- source_word: διψυχία
  chosen: double‑mindedness
  alternatives:
  - double‑souled
  - wavering
  lexicon: BDAG
  rationale: Term for divided inner commitment common in early Christian paraenesis (cf. Jas 1:8). “Double‑mindedness”
    is transparent and retains moral texture.
- source_word: ῥίπτω / ῥιπτόμενοι
  chosen: thrown
  alternatives:
  - hurled
  - cast
  lexicon: LSJ
  rationale: “Thrown” is plain and matches the violent removal from the tower imagery.
- source_word: κυλίω / κυλισθῆναι
  chosen: roll / roll into
  alternatives:
  - be rolled
  - tumble
  lexicon: LSJ
  rationale: Physical image of stones rolling off the road toward pathless places; keeps the concrete
    motion.
- source_word: ἀφίημι (ἀφίουσιν)
  chosen: abandon
  alternatives:
  - leave
  - forsake
  lexicon: BDAG
  rationale: In moral contexts ἀφίημι can mean to let go/leave behind; “abandon” conveys culpable departure
    from the true road.
- source_word: πλανάω (πλανῶνται)
  chosen: go astray
  alternatives:
  - are misled
  - wander
  lexicon: BDAG
  rationale: Standard moral/metaphorical sense; “go astray” fits the road metaphor and retains responsibility.
- source_word: ταλαιπωρέω (ταλαιπωροῦσιν)
  chosen: suffer misery
  alternatives:
  - are distressed
  - are in misery
  - are wretched
  lexicon: LSJ
  rationale: Conveys hardship/misery experienced as consequence of straying.
- source_word: πῦρ / καίω (καιόμενοι)
  chosen: fire / being burned
  alternatives:
  - flame / being consumed
  lexicon: LSJ
  rationale: Maintains vivid punitive imagery.
- source_word: ἀφίστημι (εἰς τέλος ἀποστάντες)
  chosen: finally turned away
  alternatives:
  - completely fell away
  - have apostatized to the end
  lexicon: BDAG
  rationale: εἰς τέλος intensifies the separation—“finally” captures completion/finality of apostasy without
    specifying time of life.
- source_word: μετανοέω (ἀνέβη … τοῦ μετανοῆσαι)
  chosen: repent
  alternatives:
  - moral change of disposition and conduct
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Retain the later contextual repent decision for the refusal to leave named evil in paragraph2;
    do not restore the superseded cognitive-only explanation. Paragraph3 retains its opposite reconsideration-of-baptism
    direction.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: ἐπιθυμία
  chosen: cravings
  alternatives:
  - desires
  - lusts
  lexicon: BDAG
  rationale: “Cravings” maintains volitional force; collocates with ἀσέλγεια to underscore enslaving pull.
- source_word: ἀσέλγεια
  chosen: lewdness
  alternatives:
  - licentiousness
  - sensuality
  - wantonness
  lexicon: BDAG
  rationale: All options are viable; “lewdness” is concrete and morally charged, fitting Hermas’s tone.
- source_word: λόγος (τὸν λόγον ἀκούσαντες)
  chosen: the word
  alternatives:
  - the message
  lexicon: BDAG
  rationale: Retains early Christian idiom for the proclaimed message.
- source_word: βαπτίζω εἰς τὸ ὄνομα
  chosen: be baptized into the name
  alternatives:
  - be baptized in the name
  lexicon: BDAG
  rationale: εἰς with “name” marks entry/transfer of allegiance; “into the name” preserves early baptismal
    formula.
- source_word: ἁγνότης (ἡ ἁγνότης τῆς ἀληθείας)
  chosen: purity (of the truth)
  alternatives:
  - chastity (of the truth)
  - moral purity
  lexicon: BDAG
  rationale: Ἁγνότης denotes moral purity/chastity; “purity of the truth” preserves literalness while
    implying the ethical demand of the truth.
- source_word: μετανοέω (μετανοοῦσιν)
  chosen: change their mind
  alternatives:
  - reconsider
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Retain the contextual change-their-mind decision for abandoning the intention to be baptized
    and returning to evil desires, distinct from paragraph2’s moral repentance.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: ἐπιμνῄσκομαι / μνεία (ἔλθῃ εἰς μνείαν)
  chosen: comes back to their remembrance
  alternatives:
  - comes to mind
  - they recall
  lexicon: LSJ
  rationale: Idiomatic rendering that keeps the mental-aspect sequence in v.3.
- source_word: ἐτέλεσεν
  chosen: she finished
  alternatives:
  - she completed
  - she ended
  lexicon: LSJ
  rationale: Plain past narration; preserves feminine subject from context.
- source_word: ἀναιδεύομαι (ἀναιδευσάμενος)
  chosen: plucking up my courage
  alternatives:
  - boldly (even shamelessly)
  - taking heart again
  lexicon: LSJ
  rationale: Retain the earlier renewed-boldness idiom with a boldly/even-shamelessly alternative in noten;
    do not claim a uniquely positive emotional sense from the middle voice alone.
- source_word: ἐπερωτάω (ἐπηρώτησα)
  chosen: I questioned
  alternatives:
  - I asked
  - I inquired
  lexicon: BDAG
  rationale: Slightly formal “questioned” matches solemn visionary dialogue.
- source_word: ἁρμόζω (μὴ ἁρμόζοντες / ἁρμόσαι)
  chosen: fit / fit into
  alternatives:
  - be suitable for
  - be joined to
  lexicon: LSJ
  rationale: 'Building imagery: stones either fit or do not fit the structure.'
- source_word: μετάνοια
  chosen: repentance
  alternatives:
  - moral change
  lexicon: Recorded source/witness and contextual review; see docs/REPENTANCE_REASSESSMENT_2026-10-13.md
  rationale: Retain repentance in the question and reply, with the explicit inability to fit this tower
    and the different-place conditions. No uniform Godward formula is supplied.
  doctrine_reference: 'DOCTRINE.md: Repentance terminology (2026-10-13)'
- source_word: βασανίζω / βασανισθῶσιν, βασάνων
  chosen: be tormented / torments
  alternatives:
  - be tortured/tested
  - pains
  lexicon: BDAG
  rationale: Hermas uses punitive imagery; “torment” reflects severity and matches the verbal noun cognate.
- source_word: ἐκπληρόω (ἐκπληρώσωσιν τὰς ἡμέρας)
  chosen: complete the days
  alternatives:
  - fulfill the days
  - serve out the time
  lexicon: LSJ
  rationale: Retain the literal completion of days associated with sins and torment; the passage supplies
    no numerical duration.
- source_word: μετατίθημι (μετατεθῆναι/μετατεθήσονται)
  chosen: be transferred
  alternatives:
  - be moved
  - be removed
  - be translated
  lexicon: BDAG
  rationale: Consistent rendering of the verb’s two occurrences retains the judicial-relocation imagery.
- source_word: μεταλαμβάνω (μετέλαβον)
  chosen: shared in
  alternatives:
  - partook of
  - received a share in
  lexicon: BDAG
  rationale: Relational participation in the message is in view; “shared in” is natural English.
- source_word: τοῦ ῥήματος τοῦ δικαίου
  chosen: the righteous word
  alternatives:
  - the word of the Righteous One
  - the just word
  lexicon: BDAG
  rationale: Retain the earlier adjectival interpretation righteous word, while notef discloses the substantival
    word-of-the-Righteous-One alternative. The Greek phrase alone does not name that person or settle
    the alternative uniquely.
- source_word: ἀναβαίνω ἐπὶ τὴν καρδίαν
  chosen: come up into the heart
  alternatives:
  - occur to the heart
  - come to mind
  lexicon: LSJ
  rationale: Preserves Semitic idiom; footnoted to explain the sense of recollection/consideration.
- source_word: σκληροκαρδία
  chosen: hardness of heart
  alternatives:
  - stubbornness of heart
  - obduracy
  lexicon: BDAG
  rationale: Traditional phrase accurately captures moral obstinacy; consistent with early Christian usage.
