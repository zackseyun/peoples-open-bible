id: JOB.15.29
reference: Job 15:29
source:
  edition: WLC
  text: לֹֽא יֶ֭עְשַׁר וְ/לֹא יָק֣וּם חֵיל֑/וֹ וְ/לֹֽא יִטֶּ֖ה לָ/אָ֣רֶץ מִנְלָֽ/ם־־־׃
translation:
  text: He will not be rich, and his wealth will not endure; his possessions will not spread over the land[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: The final Hebrew word is rare and uncertain; it may denote possessions, property, or produce. Another interpretation is that his produce will not bend toward the ground.
    reason: alternative_reading
lexical_decisions:
- source_word: יֶעְשַׁר
  chosen: will not become rich
  alternatives:
  - will not be rich
  - will not grow rich
  lexicon: HALOT
  rationale: From עשר in the Qal, the sense is to become rich or gain wealth. 'Become rich' best captures the verbal force rather than a static state.
- source_word: יָקוּם
  chosen: will not endure
  alternatives:
  - will not stand
  - will not remain
  lexicon: HALOT
  rationale: Although literally 'will not stand/arise,' with חֵילוֹ ('his wealth/substance') the idiomatic sense is that his wealth will not last or be established. 'Endure' gives the natural English sense while preserving the idea of instability.
- source_word: חֵילוֹ
  chosen: his wealth
  alternatives:
  - his substance
  - his possessions
  - his resources
  lexicon: HALOT
  rationale: חַיִל can denote strength, wealth, or resources. In this context of prosperity and its collapse, 'wealth' is the clearest contextual rendering.
- source_word: יִטֶּה
  chosen: will not spread
  alternatives:
  - will not stretch out
  - will not spread
  - will not incline
  lexicon: HALOT
  rationale: “Extend” or “spread” is a regular sense of the verb and avoids importing an unmarked image of drooping branches.
- source_word: מִנְלָם
  chosen: his possessions
  alternatives:
  - their possessions
  - their gain
  - their abundance
  lexicon: HALOT
  rationale: The rare term remains uncertain, but a general reference to possessions or property best fits the surrounding wealth language; the produce interpretation is retained in the note.
