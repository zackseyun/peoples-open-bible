translation:
  language: ko
  text: 주께서는 주의 백성을 양 떼처럼 모세와 아론의 손으로 인도하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צאן은 특히 양과 염소를 포함하는 집합명사로, 여기서는 개별 동물보다 ‘양 떼’라는 무리 이미지를 살립니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모세와 아론의 손으로’는 그들을 통한 대리 작용이나 지도력을 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחִיתָ
  english_pob_choice: You led
  chosen_korean: 인도하셨습니다
  alternatives_korean:
  - 이끄셨습니다
  - 데리고 가셨습니다
  lexicon: HALOT
  rationale: 하나님이 직접 백성을 방향 지어 가게 하신다는 뜻을 자연스럽게 살리면서, 시편의 목자적 이미지를 한국어로 가장 무리 없이 전달합니다.
- source_word: כַצֹּאן
  english_pob_choice: like a flock
  chosen_korean: 양 떼처럼
  alternatives_korean:
  - 양처럼
  - 무리처럼
  lexicon: HALOT
  rationale: צאן은 개별 양보다 집합적 ‘무리/떼’의 뉘앙스가 강하므로, ‘양 떼’가 POB의 ‘flock’과 가장 잘 대응합니다.
- source_word: ביד
  english_pob_choice: by the hand of
  chosen_korean: ~의 손으로
  alternatives_korean:
  - ~를 통해
  - ~의 지도 아래
  lexicon: HALOT
  rationale: ביד의 관용적 용법인 수단·대리 작용을 한국어에서는 ‘~의 손으로’로 옮겨, 모세와 아론의 매개 역할을 드러냅니다.
theological_decisions:
- issue: 하나님의 직접 인도와 인간 매개자의 관계
  chosen_reading: 주께서 백성을 인도하신 주체이시고, 모세와 아론은 그 인도에 쓰인 인간 대리자입니다.
  alternative_readings:
  - 모세와 아론이 중심이고 하나님은 배경적으로만 언급된다는 읽기
  - ‘손으로’를 풀어 써서 인간 대리성을 약화시키는 읽기
  rationale: 히브리어 원문이 2인칭으로 하나님께 직접 말하면서도 ‘모세와 아론의 손으로’라는 관용구를 덧붙이므로, 두 층위 모두를 유지해야 합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 5
