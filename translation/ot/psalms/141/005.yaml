id: PSA.141.5
reference: Psalms 141:5
source:
  edition: WLC
  text: יֶֽהֶלְמֵֽ/נִי צַדִּ֨יק חֶ֡סֶד וְֽ/יוֹכִיחֵ֗/נִי שֶׁ֣מֶן רֹ֭אשׁ אַל יָנִ֣י רֹאשִׁ֑/י כִּי ע֥וֹד וּ֝/תְפִלָּתִ֗/י בְּ/רָעוֹתֵי/הֶֽם־׀־־׃
translation:
  text: Let a righteous man strike me—it is a kindness; let him rebuke me—it is oil for the head[a]; let my head not refuse it. Yet I keep praying in the face of their evil deeds[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Oil applied to the head was a welcome sign of honor and refreshment.
    reason: cultural_note
  - marker: b
    text: The final clause is uncertain; it may mean “Yet my prayer continues amid their calamities” or “Even then I pray for them in their troubles.”
    reason: alternative_reading
lexical_decisions:
- source_word: יֶהֶלְמֵנִי
  chosen: let ... strike me
  alternatives:
  - smite me
  - beat me
  lexicon: HALOT
  rationale: From הלם, a forceful blow. In context of accepting righteous correction, 'strike me' preserves the concrete metaphor without sounding archaic like 'smite' or overly violent like 'beat.' The jussive sense is carried by 'let.'
- source_word: צַדִּיק
  chosen: a righteous man
  alternatives:
  - the righteous
  - a righteous one
  lexicon: HALOT
  rationale: Singular adjective used substantivally. 'A righteous man' is gender-accurate and natural English; it refers to a representative righteous person rather than a specific individual.
- source_word: חֶסֶד
  chosen: it is a kindness
  alternatives:
  - mercy
  - steadfast love
  - a kindness
  lexicon: HALOT
  rationale: A predicate construal is natural in the compact poetic parallelism and does not require changing the main text to the less certain adverbial analysis.
- source_word: וְיוֹכִיחֵנִי
  chosen: let him rebuke me
  alternatives:
  - correct me
  - reprove me
  lexicon: HALOT
  rationale: Hiphil of יכח commonly means to reprove or correct. 'Rebuke' preserves the verbal sharpness appropriate to moral correction.
- source_word: שֶׁמֶן רֹאשׁ
  chosen: oil for the head
  alternatives:
  - head oil
  - anointing oil for the head
  lexicon: HALOT
  rationale: Construct phrase used metaphorically for something welcome, refreshing, or honoring. 'Oil for the head' is clear and keeps the image without over-interpreting it as formal anointing.
- source_word: אַל יָנִי רֹאשִׁי
  chosen: let my head not refuse it
  alternatives:
  - let not my head reject it
  - let my head not decline it
  lexicon: HALOT
  rationale: Preserves the head-oil image and the likely sense of nonrejection while explicitly noting that the verb is difficult.
- source_word: כִּי עוֹד
  chosen: For still
  alternatives:
  - For yet
  - Indeed still
  lexicon: HALOT
  rationale: Introduces the reason or continuation of the thought. 'For still' is concise and natural.
- source_word: וּתְפִלָּתִי
  chosen: my prayer
  alternatives:
  - my prayer also
  lexicon: HALOT
  rationale: Simple noun with 1cs suffix. The conjunction is absorbed into the English clause naturally.
- source_word: בְּרָעוֹתֵיהֶם
  chosen: against their evils
  alternatives:
  - in the face of their evils
  - concerning their evil deeds
  - while they do evil
  lexicon: HALOT
  rationale: The preposition ב is syntactically difficult here. Given the broader context, the clause most plausibly means the psalmist continues praying in relation to, and effectively against, the wicked deeds of the opponents. 'Against their evils' makes the adversative force explicit in idiomatic English while remaining close to the sense.
- source_word: כִּי עוֹד וּתְפִלָּתִי בְּרָעוֹתֵיהֶם
  chosen: Yet my prayer continues amid their calamities
  alternatives: []
  lexicon: HALOT/BDB final source audit
  rationale: Avoids the unsupported “against,” gives intelligible English for the broad circumstantial force of בְּ, and preserves uncertainty about both רָעוֹת and the prayer’s relation to those denoted by the suffix.
