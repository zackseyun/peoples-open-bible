theological_decisions:
- issue: Referent of the singular pronoun in וְהוּא
  chosen_reading: The pronoun refers collectively to Israel/the people under judgment, rendered idiomatically as 'this is a people.'
  alternative_readings:
  - A masculine singular referent such as 'he' or 'it' carried over more literally
  rationale: This is a grammatical and discourse decision rather than a doctrinal one. The collective noun עַם immediately explains the pronoun, and English requires a smoother rendering than a literal 'and he is a people.'
