- from: 그때 야훼께서 모세에게 말씀하셨습니다. “바로에게 들어가서 그에게 말하십시오. ‘히브리 사람들의 하나님인 야훼께서 이렇게 말씀하십니다. 내 백성을 보내주어 그들이 나를 섬기게 하십시오.’”[a]
  to: 그때 야훼께서[a] 모세에게 말씀하셨습니다. “바로에게 나아가 그에게 말하십시오. ‘히브리 사람들의 하나님인 야훼께서 이렇게 말씀하십니다. 내 백성을 보내어 그들이 나를 섬기게 하십시오.’”
  rationale: 원문의 의미와 신명 표기를 보존하면서, ‘바로에게 들어가서’를 현대 한국어에 자연스러운 ‘바로에게 나아가’로, 수혜적 뉘앙스를 낼 수 있는 ‘보내주어’를 직접 명령인 ‘보내어’로 고쳤습니다. 각주 내용은 유지하되 표지를 첫 해당 어휘 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
