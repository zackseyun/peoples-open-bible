id: PRO.25.15
reference: Proverbs 25:15
source:
  edition: WLC
  text: בְּ/אֹ֣רֶךְ אַ֭פַּיִם יְפֻתֶּ֣ה קָצִ֑ין וְ/לָשׁ֥וֹן רַ֝כָּ֗ה תִּשְׁבָּר גָּֽרֶם־׃
translation:
  text: With patience a ruler can be persuaded, and a gentle tongue breaks a bone.
  philosophy: dynamic
lexical_decisions:
- source_word: בְּאֹרֶךְ אַפַּיִם
  chosen: With patience
  alternatives:
  - With long patience
  - By forbearance
  - By long-suffering
  lexicon: HALOT
  rationale: Natural rendering of the idiom for patient restraint or persistence.
- source_word: יְפֻתֶּה
  chosen: can be persuaded
  alternatives:
  - is persuaded
  - is won over
  - is enticed
  lexicon: HALOT
  rationale: Natural English expression of the passive, proverbial result.
- source_word: קָצִין
  chosen: a ruler
  alternatives:
  - an official
  - a prince
  - a leader
  lexicon: HALOT
  rationale: The term denotes a person in authority, such as a ruler or official. 'Ruler' is broad, clear, and suits the proverb's general application better than the more archaic 'prince' or narrower 'official'.
- source_word: לָשׁוֹן רַכָּה
  chosen: a gentle tongue
  alternatives:
  - a soft tongue
  - a tender tongue
  lexicon: HALOT
  rationale: The phrase is metaphorical for gentle speech. 'Gentle tongue' preserves the image while communicating the intended sense naturally. 'Soft tongue' is more literal and is preserved as an alternative.
- source_word: תִּשְׁבָּר גָּרֶם
  chosen: breaks a bone
  alternatives:
  - can break a bone
  - crushes bone
  lexicon: HALOT
  rationale: 'A vivid metaphor: gentle speech has surprising power, even to overcome what seems hard or resistant. ''Breaks a bone'' preserves the concrete imagery and proverbial force. English singular ''a bone'' is idiomatic for the Hebrew singular collective image.'
