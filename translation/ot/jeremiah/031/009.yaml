id: JER.31.9
reference: Jeremiah 31:9
source:
  edition: WLC
  text: בִּ/בְכִ֣י יָבֹ֗אוּ וּֽ/בְ/תַחֲנוּנִים֮ אֽוֹבִילֵ/ם֒ אֽוֹלִיכֵ/ם֙ אֶל נַ֣חֲלֵי מַ֔יִם בְּ/דֶ֣רֶךְ יָשָׁ֔ר לֹ֥א יִכָּשְׁל֖וּ בָּ֑/הּ כִּֽי הָיִ֤יתִי לְ/יִשְׂרָאֵל֙ לְ/אָ֔ב וְ/אֶפְרַ֖יִם בְּכֹ֥רִ/י הֽוּא־־׃ס
translation:
  text: They will come with weeping, and I will lead them as they plead for mercy[a]; I will guide them to streams of water, on a straight path where they will not stumble. For I am a father to Israel, and Ephraim is my firstborn.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or, “I will lead them with compassion.”
    reason: alternative_reading
lexical_decisions:
- source_word: בִּבְכִי
  chosen: with weeping
  alternatives:
  - in weeping
  - weeping
  lexicon: HALOT
  rationale: The prefixed ב marks accompaniment or manner. 'With weeping' preserves the concrete image and avoids overinterpreting whether the tears are penitential, sorrowful, or joyful.
- source_word: יָבֹאוּ
  chosen: they will come
  alternatives:
  - they will arrive
  lexicon: HALOT
  rationale: Simple future sense of בוא. 'Come' is the most natural and contextually fitting English equivalent.
- source_word: וּבְתַחֲנוּנִים
  chosen: and with pleas for mercy
  alternatives:
  - and with supplications
  - and with consolations
  lexicon: HALOT
  rationale: תחנונים commonly denotes supplications or pleas for favor/mercy. 'Pleas for mercy' communicates the relational and prayerful nuance in accessible English. An alternative tradition takes the sense differently in context, but the lexical core favors supplication.
- source_word: אֹבִילֵם
  chosen: I will lead them
  alternatives:
  - I will bring them along
  lexicon: HALOT
  rationale: Hiphil of יבל conveys leading or conducting. 'Lead' fits both the pastoral imagery and the divine-guidance context.
- source_word: אֹלִיכֵם
  chosen: I will guide them
  alternatives:
  - I will cause them to walk
  - I will bring them
  lexicon: HALOT
  rationale: Hiphil of הלך overlaps with 'lead,' so varying the English to 'guide' avoids awkward repetition while preserving the causative movement sense. The semantic distinction is documented here as a stylistic but source-faithful variation.
- source_word: נַחֲלֵי מַיִם
  chosen: streams of water
  alternatives:
  - watercourses
  - brooks of water
  lexicon: HALOT
  rationale: A construct phrase meaning channels/streams characterized by water. 'Streams of water' is idiomatic modern English and preserves the life-giving imagery.
- source_word: בְּדֶרֶךְ יָשָׁר
  chosen: on a straight path
  alternatives:
  - by a level way
  - in a straight way
  lexicon: HALOT
  rationale: The phrase denotes a direct, even, unobstructed route. 'On a straight path' is natural English and keeps the metaphor of safe guidance.
- source_word: לֹא יִכָּשְׁלוּ בָּהּ
  chosen: where they will not stumble
  alternatives:
  - in which they will not stumble
  - they will not stumble on it
  lexicon: HALOT
  rationale: The clause refers back to the straight path. 'Where they will not stumble' is idiomatic English and preserves that relation.
- source_word: כִּי הָיִיתִי לְיִשְׂרָאֵל לְאָב
  chosen: for I am a father to Israel
  alternatives:
  - for I have been a father to Israel
  lexicon: HALOT
  rationale: With a stative predicate, the qatal presents an established reality here; 'have become' would wrongly imply that the father relationship begins only at the restoration.
- source_word: וְאֶפְרַיִם בְּכֹרִי הוּא
  chosen: and Ephraim is my firstborn
  alternatives:
  - and Ephraim—he is my firstborn
  lexicon: HALOT
  rationale: בכור denotes firstborn in status and inheritance significance. The pronoun הוּא is naturally represented by standard English predication rather than an emphatic separate clause.
