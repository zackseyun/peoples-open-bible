  yaml_path: translation/extra_canonical/shepherd_of_hermas/032.yaml
  text: '“Be long-suffering[1],” he says, “and sensible, and you will gain mastery over all wicked deeds and do every work of righteousness. For if you are long-suffering, the holy spirit[2] that dwells in you will be pure, not being clouded by another evil spirit; rather, dwelling in a wide space[3] it will exult and rejoice with the vessel in which it dwells, and it will minister[4] to God with much cheerfulness, having vitality[5] within itself.


    But if a quick temper[6] comes on, at once the holy spirit—being tender—is cramped, not having a clean place, and it seeks to withdraw from that place; for it is choked by the evil spirit, not having room to minister to the Lord as it desires, being defiled by the quick temper. For in long-suffering the Lord dwells, but in quick temper, the devil. Therefore when both spirits dwell together in one, it is unprofitable and harmful to that person in whom they dwell.


    For if, after taking a little wormwood[7], you pour it into a jar of honey, does not all the honey perish? So much honey is ruined by the smallest amount of wormwood: it destroys the sweetness of the honey, and it no longer has the same favor with its master[8], because it has been embittered and has lost its use. But if the wormwood is not cast into the honey, the honey is found sweet and becomes serviceable to its master.


    You see, then, that long-suffering is sweeter than honey and is serviceable to the Lord, and he dwells in it; but quick temper is bitter and useless. If, therefore, quick temper is mixed with long-suffering, long-suffering is defiled and is no longer useful to God. Long-suffering at all times has nothing bitter within itself, remaining always gentle and quiet. This long-suffering, then, dwells with those who have the faith complete[10].


    Quick temper, for its part, is first foolish—flighty and senseless. Then from senselessness comes bitterness; from bitterness, anger; from anger, wrath; and from wrath, rage. Then rage—composed of so many evils—becomes a great and incurable sin.


    For when all these spirits dwell in one vessel, the very vessel in which the holy spirit also dwells, that vessel cannot contain them; it overflows. The tender spirit, having no habit of dwelling with an evil spirit or with hardness, withdraws from such a person and seeks to dwell with gentleness and quiet. Then, when it has departed from that person in whom it dwells, that person becomes empty of the righteous spirit[11]; and thereafter, being filled with evil spirits, he is unstable in all his deeds, dragged here and there by the evil spirits, and is altogether blinded as to his good understanding. Thus it happens to all who are quick-tempered.


    Therefore keep away from quick temper—that most wicked spirit—but clothe yourself with long-suffering, and stand against quick temper and bitterness, and you will be found with the dignity[9] that is beloved by the Lord. See to it, then, that you never forget[12] this command; for if you gain mastery of this command, you will also be able to keep the other commands that I am about to give you. Be strong in them and be empowered, and let all be empowered who wish to walk in them.”'
translation:
  language: ko
  text: '“오래 참으십시오[1],”라고 하십니다. “그리고 분별력을 가지십시오. 그러면 당신은 모든 악한 행위를 제압하고 모든 의로운 일을 행하게 될 것입니다. 당신이 오래 참으면, 당신 안에 거하시는 거룩한 영[2]은 다른 악한 영에 의해 흐려지지 않고 깨끗할 것입니다. 오히려 넓은 공간[3]에 거하면서 기뻐하고 즐거워하며, 머무는 그 그릇과 함께 즐거워할 것이며, 큰 기쁨으로 하나님을 섬길 것입니다[4]. 그 안에 생기[5]를 지니고 있기 때문입니다.


    그러나 급한 성미[6]가 찾아오면, 곧 거룩한 영—온유한 그 영은—좁아져 깨끗한 자리를 얻지 못하고 그 자리에서 물러나려 합니다. 악한 영에 눌려 숨이 막히고, 급한 성미에 더럽혀져 주님을 섬기고자 해도 그럴 공간을 얻지 못하기 때문입니다. 오래 참음 안에는 주님이 거하시지만, 급한 성미 안에는 악마가 거합니다. 그러므로 두 영이 한 사람 안에 함께 거하면, 그 사람에게는 유익하지도 않고 해롭기만 합니다.


    예를 들어, 쑥[7]을 조금 집어 꿀 단지에 부으면, 꿀이 전부 사라지지 않습니까? 가장 작은 쑥도 그만큼의 꿀을 망가뜨려 꿀의 단맛을 빼앗고, 더는 주인에게 같은 쓸모가 없게 만듭니다[8]. 그러나 쑥이 꿀에 들어가지 않으면, 꿀은 달게 여겨지고 주인에게 유용하게 됩니다.


    그러니 오래 참음이 꿀보다 더 달고, 주님께 유용하며, 그분이 그 안에 거하신다는 것을 보십시오. 그러나 급한 성미는 쓰고 쓸모가 없습니다. 그러므로 급한 성미가 오래 참음과 섞이면, 오래 참음은 더럽혀져 하나님께 더는 유용하지 않게 됩니다. 오래 참음은 언제나 자기 안에 아무런 쓰라림도 두지 않고, 늘 온유하고 고요하게 머뭅니다. 그러므로 이 오래 참음은 믿음이 온전한 사람들과 함께 거합니다[10].


    한편 급한 성미는 먼저 어리석고—경솔하며 분별이 없습니다. 그다음 분별 없음에서 쓰라림이 나오고, 쓰라림에서 분노가, 분노에서 격노가, 격노에서 광분이 나옵니다. 그리고 그렇게 많은 악으로 이루어진 광분은 크고 고칠 수 없는 죄가 됩니다.


    왜냐하면 이런 모든 영들이 한 그릇 안에 함께 거할 때, 거룩한 영이 또한 거하시는 바로 그 그릇은 그것들을 담을 수 없어서 넘쳐흐르기 때문입니다. 온유한 영은 악한 영과 함께 있거나 강퍅함과 함께 거하는 데 익숙하지 않으므로, 그런 사람에게서 물러나 온유와 고요함과 함께 거하기를 찾습니다. 그가 머물던 그 사람에게서 떠나면, 그 사람은 의로운 영[11]이 비게 되고, 그 뒤로는 악한 영들로 채워져 모든 행위에서 흔들리며 악한 영들에 이리저리 끌려다니고, 좋은 분별에서는 완전히 눈이 멀게 됩니다. 급한 성미를 가진 모든 사람에게 이와 같이 일어납니다.


    그러므로 그 가장 악한 영인 급한 성미를 멀리하십시오. 오히려 오래 참음을 입고 급한 성미와 쓰라림을 대적하십시오. 그러면 당신은 주님께 사랑받는 품위[9]와 함께 있는 사람으로 발견될 것입니다. 그러니 이 명령을 결코 잊지 마십시오[12]. 이 명령을 제압하면, 내가 곧 당신에게 명할 나머지 명령들도 지킬 수 있을 것이기 때문입니다. 그 안에서 강해지고 힘을 얻으십시오. 그리고 그 안에서 걸어가고자 하는 사람은 모두 힘을 얻으십시오.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μακρόθυμος / μακροθυμία
  english_pob_choice: long-suffering
  chosen_korean: 오래 참음 / 오래 참으십시오
  alternatives_korean:
  - 인내
  - 참을성
  lexicon: μακρόθυμος
  rationale: POB의 장기적·관계적 인내 뉘앙스를 살리기 위해 단순한 인내보다 ‘오래 참음’을 택했습니다.
- source_word: συνετός
  english_pob_choice: sensible
  chosen_korean: 분별력
  alternatives_korean:
  - 현명함
  - 분별
  lexicon: συνετός
  rationale: 지적 판단의 신중함을 드러내기 위해 ‘분별력’을 사용했습니다.
- source_word: πνεῦμα τὸ ἅγιον
  english_pob_choice: holy spirit
  chosen_korean: 거룩한 영
  alternatives_korean:
  - 성령
  lexicon: πνεῦμα
  rationale: 문맥상 성령이지만, 본문은 인격화된 ‘영’의 작용을 비유적으로 전개하므로 기본어형을 살렸습니다.
- source_word: ἐν εὐρυχώρῳ
  english_pob_choice: in a wide space
  chosen_korean: 넓은 공간에 거하면서
  alternatives_korean:
  - 넓은 곳에서
  - 여유로운 공간에서
  lexicon: εὐρύχωρος
  rationale: 영이 숨 쉬고 기뻐하는 대조를 살리기 위해 공간적 이미지가 분명한 표현을 유지했습니다.
- source_word: λειτουργήσει τῷ Θεῷ
  english_pob_choice: minister to God
  chosen_korean: 하나님을 섬길 것입니다
  alternatives_korean:
  - 하나님께 봉사할 것입니다
  - 하나님께 예배드릴 것입니다
  lexicon: λειτουργέω
  rationale: 공적 섬김의 뜻을 살리되 한국어에서 자연스러운 ‘섬기다’로 옮겼습니다.
- source_word: ἀψίνθιον
  english_pob_choice: wormwood
  chosen_korean: 쑥
  alternatives_korean:
  - 개쑥
  - 압신티움
  lexicon: ἀψίνθιον
  rationale: 비유의 기능을 고려해 한국어에서 곧바로 이해되는 식물명 ‘쑥’으로 옮겼습니다.
- source_word: παρὰ τῷ δεσπότῃ
  english_pob_choice: with its master
  chosen_korean: 주인에게
  alternatives_korean:
  - 주인과 함께
  - 주인 앞에서
  lexicon: δεσπότης
  rationale: 비유의 소유·유용성 관계를 드러내는 가장 직설적인 표현을 택했습니다.
- source_word: εὐθηνίαν
  english_pob_choice: vitality
  chosen_korean: 생기
  alternatives_korean:
  - 활력
  - 번성
  lexicon: εὐθηνία
  rationale: English audit trail의 ‘vitality’를 따라 생명력과 내적 충만을 함께 드러내는 단어로 옮겼습니다.
- source_word: σεμνότης
  english_pob_choice: dignity
  chosen_korean: 품위
  alternatives_korean:
  - 존귀
  - 단정함
  lexicon: σεμνότης
  rationale: ‘주님께 사랑받는’ 수식과 함께 인간의 태도·품격을 나타내는 말로 ‘품위’를 선택했습니다.
theological_decisions:
- issue: “거룩한 영”과 “의로운 영”의 번역 방식
  chosen_reading: 문맥이 비유적이지만 실제로 내주하시는 영의 활동을 말하므로, ‘성령’으로 고정하지 않고 ‘거룩한 영/의로운 영’으로 일관되게 옮겼습니다.
  alternative_readings:
  - 성령
  - 성령님
  rationale: 본문은 영을 그릇 안에 거하며 떠나거나 머무는 존재로 묘사하므로, 인격적이면서도 비유적인 원문의 표현을 보존하는 것이 더 충실합니다.
  doctrine_reference: pneumatology
- issue: “주님”과 “하나님”의 구분
  chosen_reading: ἔργα/λειτουργέω/κύριος 문맥에서는 주님, τῷ Θεῷ 문맥에서는 하나님으로 구분했습니다.
  alternative_readings:
  - 모두 주님
  - 모두 하나님
  rationale: 원문이 κύριος와 Θεός를 구별하므로 한국어도 그 구분을 유지해야 합니다.
  doctrine_reference: theology of divine titles
