    10. 누구든지 더럽히는 자는 반드시 죽을 것이며, 돌로 쳐 죽임을 당할 것입니다. 이 법에는 기간 제한이 없고, 면제도 어떤 속죄도 없습니다. 다만 자기 딸을 온 이스라엘 가운데서 더럽힌 그 사람은 뿌리째 뽑힐 것입니다. 이는 그가 자기 씨 가운데서 몰렉에게 바쳤고, 그것을 더럽혀 악을 행했기 때문입니다.

    11. 그들의 왕국은 가르나임과 아스타롯과 에드레이와 미수르와 브온이었습니다. 주님께서는 그들의 악한 행위 때문에 그들을 멸하셨습니다. 그들이 매우 악했기 때문입니다. 또 그들의 자리에 아모리 사람들을 살게 하셨는데, 그들도 악하고 죄 많은 자들이었습니다. 오늘날 자기들의 죄를 모두 채운 백성은 없으며, 그들은 더 이상 존재하지 않습니다.

    12. 그것은 정해져 있으며, 이것을 이 해에서 오는 해까지 남겨 둘 것은 없습니다. 이는 그 해에는 씨앗이 그 해의 씨앗을 거두는 날들까지 먹히며, 포도주는 …의 때까지이기 때문입니다.

    13. 우리 딸을 할례받지 않은 남자에게 주지 맙시다. 그것은 우리에게 수치입니다. 또한 그것은 이스라엘에게도 수치이며, 이방 민족의 딸들에게 딸을 내주는 사람들과 그들에게서 아내를 맞아들이는 사람들에게도 수치입니다. 이는 부정한 일이기 때문입니다.

    14. 그리하여 네 자녀도 모든 시대에 그러할 것입니다. 야훼께서 너와 네 자손에게 그의 영광을 위하여 큰마음을 주시기를, 또 너와 네 자손을 모든 사람 가운데서 그에게 가까이 이끄셔서 그들이 그의 성소에서 임재의 천사들과 거룩한 이들처럼 섬기게 하시기를 바랍니다. 그들처럼 네 자녀의 자손도 영광과 위대함을 얻게 될 것입니다.

    15. 열방의 딸들이며, 또 그의 딸들 가운데 누구든지 그가 열방 가운데 어떤 남자에게 준 자가 있다면, 이는 재앙 위에 재앙이요 저주 위에 저주입니다. 그가 이 일을 행하거나 부정한 일을 행하는 자들, 주님의 성소를 더럽히는 자들, 그의 거룩한 이름을 모독하는 자들에게 눈감는다면, 이 모든 재앙과 저주가 임할 것입니다. 모든 백성이 함께 그 모든 부정함과 모독 때문에 심판을 받을 것입니다.

    16. 주님께서 그들의 입에 그것을 두셔서 사랑받는 이의 모든 후손을 축복하게 하실 것입니다. 당신의 어머니가 당신을 레위라고 불렀고, 참으로 당신이 하나님과 연합하고 야곱의 모든 아들들의 동반자가 되도록 그렇게 불렀습니다. 그의 식탁이 당신의 것이 되기를 바랍니다. 당신과 당신의 아들들이 먹을 것이며, 또 모든 이를 위하여.

    17. 이스라엘 가운데 자기 성소를 더럽히는 모든 남자와 여자입니다. 그러므로 내가 너에게 명령하여 말한다. 「이스라엘에게 이 증언을 들려주십시오. 세겜과 그의 아들들에게 무슨 일이 일어났는지 보십시오. 그들이 야곱의 두 아들의 손에 넘겨졌고, 그 두 아들이 그들을 고통 중에 죽였으며, 그것이 그들에게 의로 여겨졌고, 그것이 그들을 위하여 의로 기록되었습니다.」

    18. 당신을 축복하는 모든 사람은 복을 받을 것이며, 당신을 저주하는 모든 백성은 저주를 받을 것입니다. 그리고 유다에게 이렇게 말했습니다. "주께서 당신에게 힘과 능력을 주시어 당신을 미워하는 모든 사람을 짓밟게 하시기를 바랍니다. 당신과 당신의 아들들 가운데 한 사람이 야곱의 아들들을 다스리는 통치자가 되십시오. 당신의 이름과 당신의 아들들의 이름이 온 땅과 여러 지역으로 퍼져 널리 알려지기를 바랍니다. 그때 민족들이 당신 앞에서 두려워할 것입니다,

    19. 모든 사람의 자손에게. 나는 하늘 아래에 있는 온 땅을 네 씨에게 주겠습니다. 그들은 원하는 대로 모든 민족을 다스릴 것이며, 그 후에는 온 땅을 자기들에게로 끌어모아 그 땅을 유업으로 받을 것입니다.

    20. 그리고 너를 통해 이스라엘의 구원이 발견될 것입니다. 네 의의 영광의 보좌에 앉는 날에는 사랑받는 이의 아들들의 모든 자손에게 큰 평강이 있을 것입니다. 너를 축복하는 사람은 복을 받을 것이며, 너를 미워하고 괴롭히는 모든 사람과 또 너를 저주하는 사람들은 멸망하고 끊어질 것입니다.

    21. 그가 하늘로 올라갔습니다. 그리고 밤의 환상 가운데서 보니, 한 천사가 하늘에서 내려오고 있었고, 그의 손에는 판들이 들려 있었습니다. 그가 그것들을 야곱에게 주었고, 야곱은 그것을 읽고, 그 안에 기록된 모든 것—그에게와 그의 자손에게 모든 시대에 일어날 일—을 알게 되었습니다. 그리고 그가 판들에 기록된 모든 것을 그에게 보여 주며 말했습니다. 「이곳을 세우지 마라. 그리고 영원한 성소로 만들지 마라. 그리고 여기 머물지 마라. 이곳은 그 장소가 아니기 때문이다. 너의 아버지 아브라함의 집으로 가서, 너의 아버지 이삭과 함께 너의 아버지의 죽는 날까지 거기에 머물러라. 너는 이집트에서 평안히 죽을 것이며, 이 땅에서는 조상들의 무덤—아브라함과 이삭과 함께—에 존귀하게 장사될 것이다. 두려워하지 마라. 네가 보고 읽은 대로 모든 일이 그렇게 될 것이다. 너도 네가 보고 읽은 모든 것을 기록해 두어라。」 야곱이 말했습니다. 「주님, 제가 읽고 본 모든 것을 어떻게 기억하겠습니까?」 그러자 그가 말했습니다. 「내가 네가 모든 것을 기억하게 하겠다。」


    그가 그에게서 올라가자 야곱은 잠에서 깨어났고, 자신이 읽고 본 모든 것을 기억하여, 읽고 본 모든 일을 다 기록했습니다. 그리고 거기서 그는 하루를 하나 더 지켰고, 이전 날들에 그들이 드리는 모든 것에 따라 그것을 지켰으며, 그 이름을 ‘추가’라고 불렀습니다. 그날이 더해졌기 때문이며, 이전에는 그들을 절기로 불렀기 때문입니다. 이렇게 해서 그것이 그러해야 함을 보였고, 이 일에 관하여 하늘의 판들에 기록되어 있으니, 그에게 그것을 지키고 절기의 일곱 날에 더하라고 계시되었기 때문입니다. 그리고 그 이름은 ‘추가’라 불렸는데, 해의 날 수에 따라 절기 날들에 더해지기 때문입니다. 그리고 이 달 열셋째 날 밤에 리브가의 유모 드보라가 죽었습니다. 그들은 그녀를 도시 아래, 강가의 떡갈나무 아래에 묻었고, 그곳 이름을 ‘드보라의 강’이라 불렀으며, 그 떡갈나무를 ‘드보라의 애도의 떡갈나무’라고 불렀습니다. 리브가는 가서 자기 집으로, 자기 아버지 이삭에게 들어갔고, 야곱은 그녀의 손에 숫양들과 양들을 보냈습니다. 그것들이 자기 아버지의 집으로 가게 하려는 것이었습니다. 그리고 그는 그녀에게 말했습니다. 「우리 함께 모든 곳으로 가자. 그리고 너와 함께 여행하지 마라。」 야곱은 자기 아버지 이삭의 하나님과 자기 조상 아브라함의 하나님을 복 주었고, 일어나 자기 아내들과 자녀들과 모든 재산을 실어 강을 건너 도착했습니다.

    22. 그들은 이것을 행하고 친구들로 기록되도록 정해져 있습니다. 그러나 만일 그들이 어기고 그 모든 길에서 부정하게 행하면, 그들은 하늘의 판에 적대자들로 기록되고, 생명의 책에서 지워지며, 멸망할 자들의 책에, 그리고 …하는 이들과 함께 기록될 것입니다.

    23. 기쁨으로. 야곱은 자기 두 아들을 오른편에 하나, 왼편에 하나 세웠고, 그것이 그에게 의로 여겨졌습니다. 야곱은 밤에 아버지에게 주님께서 자기에게 큰 긍휼로 어떻게 대해 주셨는지, 또 자기의 모든 길을 어떻게 형통하게 하시고 모든 악에서 어떻게 보호하셨는지를 모두 말했습니다. 이삭은 자기 아버지 아브라함의 하나님, 곧 그분의 종 이삭의 아들에게서 긍휼과 의를 거두지 않으신 분을 찬송했습니다. 아침에 야곱은 아버지 이삭에게 주님께 드렸던 기도와 자신이 본 환상, 또 어떻게 제단을 쌓았는지, 기도한 대로 주님 앞에 드리려고 준비한 모든 제물과, 어떻게 그를 나귀에 태워 모셔 가려고 왔는지를 말했습니다. 이삭이 야곱에게 말했습니다. 「내 아들아, 나는 너와 함께 갈 수가 없다. 나는 늙어서 길을 견딜 수가 없다. 내 아들아, 평안히 가라. 나는 오늘로 백육십오 세가 되었구나. 나는 더 이상 여행할 수 없으니, 네 어머니를 짐승에 태워 너와 함께 가게 하여라. 내 아들아, 네가 나를 위해 왔음을 나는 안다. 오늘은 네가 나를 살아 있는 모습으로 보았고 나도 너를 보았으니, 복된 날이다. 번성하고 네가 드린 기도를 실행하여라. 네 기도를 지체하지 말아라. 그 기도는 살펴질 것이니, 이제 서둘러 행하여라. 모든 것을 행하시는 분께서 네가 기도한 그 기도에 형통함을 주시기를 바란다.」 그리고 그는 리브가에게 「네 아들 야곱과 함께 가라」고 말했습니다. 리브가는 자기 아들 야곱과 함께 갔고, 드보라도 리브가와 함께 있었으며, 그들은 베델에 이르렀습니다. 야곱은 아버지가 자기와 자기 두 아들 레위와 유다에게 복을 빌어 주었던 그 기도를 기억하고, 기뻐하며 자기 조상 아브라함과 이삭의 하나님을 찬송했습니다. 그리고 그는 말했습니다. 「이제 나는 내게 영원한 소망이 있고, 내 자녀에게도 소망이 있다는 것을 모든 이의 하나님 앞에서 알게 되었습니다.」 이처럼 그 두 아들에 관하여 그것이 규정되었고, 이삭이 그들에게 복을 빌어 준 대로 하늘의 판에 그들을 위한 영원한 증언으로
    기록될 것입니다. 그는 그날 밤 베델에 머물렀고, 레위는 자신과 자기 자손이 영원히 지극히 높으신 하나님의 제사장으로 세워지고 임명되는 꿈을 꾸었습니다. 그는 잠에서 깨어 주님을 찬송했습니다. 야곱은 이달 십사일 아침 일찍 일어나 자신과 함께 온 모든 것에서, 곧 사람에서 가축까지, 금에서 모든 소유까지 십일조를 드렸고, 모든 것에서 십일조를 떼어 바쳤습니다. 그 무렵 라헬은 베냐민을 잉태했고, 야곱은 자기 아들들을 헤아렸으며, 레위가 주님의 몫 가운데 올라왔습니다. 그의 아버지는 그에게 제사장의 옷을 입히고 그의 손을 채웠습니다. 이달 십오일에 그는 소 떼에서 수소 열네 마리와 숫양 열여덟 마리와 양 마흔아홉 마리와 어린양 일곱 마리와 숫염소 새끼 스물한 마리를 제단에 제물로 가져왔습니다.

    24. 그리고 그는 에브랏 땅에 이르러 거기에 머물렀습니다. 라헬은 밤에 아들을 낳고, 출산할 때 고통을 겪었으므로 그 이름을 “내 고통의 아들”이라고 불렀습니다. 그러나 그의 아버지는 이 희년의 여섯째 주 첫째 해 여덟째 달 열하루에 그 이름을 베냐민이라고 불렀습니다.

    25. 라헬은 거기서 죽어 에브랏 땅, 곧 베들레헴에 장사되었습니다. 야곱은 길가에 라헬의 무덤 위로 기둥을 세웠습니다.'
