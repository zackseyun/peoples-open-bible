theological_decisions:
- issue: Rendering of the divine name יְהוָה
  chosen_reading: Yahweh
  alternative_readings:
  - Yahweh
  - Jehovah
  rationale: The verse uses the Tetragrammaton יְהוָה directly. Per updated doctrine, the divine name is rendered 'Yahweh' rather than 'the LORD', preserving the covenant name God revealed at Sinai.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Whether כֹהֵן הָרֹאשׁ should be rendered with the more technical 'high priest'
  chosen_reading: chief priest
  alternative_readings:
  - high priest
  rationale: The Hebrew literally means 'the head/chief priest.' In this administrative setting, 'chief priest' avoids importing a more technical institutional sense unless context requires it. The verse emphasizes jurisdictional oversight more than cultic rank terminology.
