  - 합창 인도자에게
  lexicon: HALOT
  rationale: 시편 표제의 לַמְנַצֵּחַ는 연주 지시로 기능하므로, 현대 한국어에서는 예배적·연주적 역할을 드러내는 ‘지휘자에게’가 가장 자연스럽습니다.
- source_word: עַלְמוּת לַבֵּן
  english_pob_choice: according to “Death of the Son”
  chosen_korean: “죽음의 아들”에 맞춘
  alternatives_korean:
  - 알마웻 라벤에 따라
  - ‘아들의 죽음’에 맞춘
  - ‘알모트-라벤’에 맞춘
  lexicon: HALOT
  rationale: 이 표현은 뜻과 용법이 불확실하므로, 본문 기능상 곡조/표제 표시로 보면서도 POB의 영어 해석을 반영해 한국어에는 직역적 의미를 살린 quoted title 형태로 옮겼습니다.
- source_word: מִזְמוֹר
  english_pob_choice: A psalm
  chosen_korean: 시
  alternatives_korean:
  - 시편
  - 노래
  lexicon: HALOT
  rationale: 표제에서 장르 표지이므로 ‘시’로 간결하게 옮겨, 문맥상 작품 유형을 드러내되 과도한 해설은 피했습니다.
- source_word: לְדָוִד
  english_pob_choice: of David
  chosen_korean: 다윗의
  alternatives_korean:
  - 다윗이 지은
  - 다윗에게 속한
  - 다윗을 위한
  lexicon: HALOT
  rationale: לְ는 표제에서 저자·소속·헌정을 모두 열어 두므로, 한국어에서도 가장 덜 해석적인 ‘다윗의’로 처리했습니다.
theological_decisions:
