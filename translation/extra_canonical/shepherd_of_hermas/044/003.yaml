translation:
  text: 'I say to you: if you do not keep these, but neglect them, do not follow the commandments of the devil, which are difficult and bitter and savage and licentious; and do not fear the devil, because he has no power against you. For I will be with you—I, the angel of reorientation[a], who has mastery over him. The devil has only fear, but his fear has no force. Therefore do not fear him, and he will flee from you.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionally "repent" or "repentance." "Reorient" and "reorientation" describe a change of disposition and direction. The surrounding passage supplies the direction; this wording does not erase named wrongdoing, distinct turning expressions, or sorrow, and does not by itself assert a completed moral transformation.
    reason: lexical_alternative
