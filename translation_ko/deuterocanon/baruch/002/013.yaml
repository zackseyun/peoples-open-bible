  verdict: revise
  source_fidelity: 현 번역의 첫 절은 원문의 청원과 대체로 맞지만, “우리가 흩으신 그곳”은 ‘우리가’가 ‘흩으신’의 주어가 되는 문법적 오류이며, 원문의 2인칭 단수 주어(‘당신께서 우리를 흩으셨다’)를 보존하지 못합니다. 또한 ἐν τοῖς ἔθνεσιν은 문맥상 이스라엘 밖의 민족들을 가리키지만, ‘이방’을 본문에 보태기보다 ‘민족들’로 옮기는 것이 어휘적으로 더 직접적입니다.
  naturalness: “당신의 분노가 우리에게서 떠나게 하십시오”은 기도문으로 자연스럽고 원문의 ‘분노가 … 돌아서게 하소서’라는 표현을 보존합니다. “당신께서 우리를 흩어 놓으신 그곳의 민족들 가운데”는 관계절과 ἐκεῖ(그곳)를 자연스럽게 반영합니다.
  terminology: θυμός는 ‘분노’로 유지할 수 있습니다. διασπείρω는 ‘흩어 놓으신’으로, 수동형 κατελείφθημεν과 ὀλίγοι는 ‘소수만 남게 되었기’로 옮겨 남겨진 소수라는 뜻을 유지했습니다.
