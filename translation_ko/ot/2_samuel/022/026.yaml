base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/026.yaml
  text: With the faithful you show yourself faithful; with the blameless warrior you show yourself blameless.
translation:
  language: ko
  text: 신실한 이에게는 주께서 신실하게 자신을 나타내시며, 흠 없는 용사에게는 흠 없게 자신을 나타내십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד
  english_pob_choice: the faithful
  chosen_korean: 충성된 이
  alternatives_korean:
  - 신실한 자
  - 경건한 자
  lexicon: חָסִיד
  rationale: 대상 인물의 신실함과 언약적 충성을 함께 살리기 위해 ‘충성된 이’로 옮겼습니다. ‘경건한 자’는 종교적 행위 중심으로 좁아질 수 있어 피했습니다.
- source_word: תִּתְחַסָּד
  english_pob_choice: you show yourself faithful
  chosen_korean: 자신을 충성되게 나타내시며
  alternatives_korean:
  - 충성하게 행하시며
  - 신실하게 나타내시며
  lexicon: חסד/Hitpael 계열
  rationale: 동사형의 상호/반사적 뉘앙스를 살려 ‘자신을 … 나타내시며’로 처리했고, 반복 어근 효과를 위해 ‘충성되게’로 대응했습니다.
- source_word: גִּבּוֹר
  english_pob_choice: warrior
  chosen_korean: 용사
  alternatives_korean:
  - 용맹한 사람
  - 능력 있는 사람
  lexicon: גִּבּוֹר
  rationale: 영어 POB가 ‘mighty man’보다 ‘warrior’를 채택한 점을 따라, 전투적·영웅적 맥락이 드러나는 ‘용사’를 택했습니다.
- source_word: תָּמִים
  english_pob_choice: blameless
  chosen_korean: 흠 없는
  alternatives_korean:
  - 온전한
  - 책망할 것 없는
  lexicon: תָּמִים
  rationale: 도덕적 무결성과 결함 없음의 의미를 가장 직접적으로 드러내는 표준적 표현으로 ‘흠 없는’을 사용했습니다.
theological_decisions:
- issue: 하나님의 응답이 인간의 상태를 거울처럼 되비추는 병행 구조
  chosen_reading: 하나님은 사람의 성품과 행실에 상응하여 자신을 드러내시는 분으로 옮겼습니다.
  alternative_readings:
  - 단순한 보응의 원리로만 축소하는 읽기
  - 일반적 격언으로 완화하는 읽기
  rationale: 히브리어 병행법은 동일한 어근과 상응 구조를 통해 관계적 상호성을 강조하므로, 이를 평이한 격언으로 약화하지 않았습니다.
  doctrine_reference: 시편 18:25의 평행구와 하나님의 공의/신실하심에 대한 성서적 증언
