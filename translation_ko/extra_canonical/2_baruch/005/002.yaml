  source_fidelity: 초안의 ‘때가 이르매 의가 있느니라’는 심판 자체가 의롭다는 진술로 바꾸어, 시리아어의 법정적 표현(심판이 정한 때에 자신의 권리/정당성을 보전하거나 얻음)과 영어 감사본의 ‘maintains its right’를 충분히 반영하지 못합니다.
  naturalness: ‘서리라’, ‘있느니라’, ‘하시니라’는 요청된 현대 표준어 합쇼체보다 고어적입니다. 현대적 직접 인용과 합쇼체 종결로 정리하는 것이 자연스럽습니다.
  terminology: ‘주님’, ‘영광’, ‘심판’은 적절합니다. zedqeh의 ‘권리/정당한 몫’이라는 다의성은 본문에서 ‘권리’로 옮기고 각주로 대안을 보존합니다.
  issues:
  - severity: high
    issue: ‘내 심판은 때가 이르매 의가 있느니라’
    rationale: 이는 ‘심판은 때가 되면 의롭다’라는 뜻이 되어, 원문의 ‘심판’과 ‘그 권리/정당성’의 관계 및 시간적 한정을 바꿉니다.
  - severity: medium
    issue: 고어적 종결 표현
    rationale: 번역의 지정 register인 현대 formal-polite 합쇼체와 맞지 않습니다.
  revised_text: 주님께서 내게 말씀하셨습니다. “내 이름과 내 영광은 영원히 지속됩니다. 그러나 내 심판은 정해진 때에 그 권리를 유지합니다.ᵃ”
  revised_footnotes:
  - marker: a
    text: 또는 “그 자신의 권리를 지킵니다.”
    reason: 시리아어의 ‘그 권리/정당성’에 해당하는 표현은 ‘유지하다’와 ‘지키다’로 모두 옮길 수 있으므로, 영어 POB 감사본의 대안(‘keeps its own right’)을 보존합니다.
  revision_rationale: 심판이 ‘의롭다’는 해석적 진술을 피하고, 원문 및 영어 감사본이 보존하는 법정적 ‘권리’의 의미를 유지했습니다. 현대 합쇼체로 문체를 정리했으며, 다의적인 동사의 대안을 각주에 남겼습니다.
