translation:
  language: ko
  text: 이스라엘아, 어찌된 일입니까?[a] 어찌하여 네가 원수들의 땅에 있습니까? 너는 낯선 땅에서 늙었고, 죽은 자들과 함께 더럽혀졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어찌된 일입니까?’는 τί ἐστιν의 탄식형 질문을 옮긴 것입니다. ‘이스라엘아, 무슨 일이냐?’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘죽은 자들과 함께 더럽혀졌습니다’는 죽은 이들과의 연관으로 인한 의례적 부정과, 유배 가운데 죽음의 영역에 속한 듯한 비유적 상태를 함께 시사할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τί ἐστιν Ἰσραήλ;
  english_pob_choice: What is Israel?
