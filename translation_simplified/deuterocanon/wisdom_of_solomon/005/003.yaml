translation:
  language: en
  text: 'As they reconsider[r1], they will say among themselves and groan because their spirits are in anguish: “This is the one we once mocked.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: r1
    text: Earlier reader wording used a form of "repent." In the judgment scene the speakers reconsider their former judgment of the righteous. Do not make this recognition an explicit saving return to God or deny its accompanying anguish.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: will groan because of anguish of spirit
  simplified_phrase: will groan because their spirits are in anguish
  preserved_meaning: Their intense inward or spiritual distress causes audible groaning.
  reasoning_layer_used: POB lexical decisions for στενοχωρίαν πνεύματος and στενάξονται
  rationale: The recast clause uses ordinary syntax while preserving both the spirit language and the force of groaning.
- pob_phrase: whom we once held in derision
  simplified_phrase: we once mocked
  preserved_meaning: They formerly treated this person as an object of ridicule.
  reasoning_layer_used: POB lexical decisions for ἔχομεν εἰς γέλωτα
  rationale: The direct verb “mocked” clearly expresses their former contempt without the archaic phrase “held in derision.”
