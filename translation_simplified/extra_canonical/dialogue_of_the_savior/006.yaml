  from: 'Judas asked, “Lord, tell [us] what [existed] before [heaven and] earth came into being.”


    The Lord said, “There was darkness and water, and […] a spirit was over the [water]. I tell you [the truth]: Look! What you seek and ask about [is] within you. It [has] the spirit’s power and hidden nature because it [comes] from [the spirit]. Evil entered [to keep destroying] the mind. Look! […].”


    [Matthew] said, “Lord, tell us: Where is [the soul] established, and where does the true [mind] live?”


    The Lord [said], “The spirit’s fire came into being [between] those two. In this way [spirit] came into being, with the true mind within them. [If] someone raises the soul on high, [it will] be exalted.”


    Matthew asked him, […], “[Is circumcision not necessary] when it is understood [in its true sense]?”


    The Lord [said], “[Circumcision is] more beneficial than your [work. Remove] from yourselves [whatever can] persecute you—even everything [within] your hearts. When your hearts [are circumcised], you [will find] a way to overcome the powers above and below. I tell you: Whoever [has] power must renounce [it] and reorient[r1]. Whoever [understands] must seek, find, and rejoice.”


    Judas said, “Look! [I] see that everything is [exactly] like a sign over [the earth]. That is why these things came into being as they did.”


    The Lord [said], “When the Father established the world, he [gathered] some of its water together, and the word came out from it. […] It endured much [trouble], but it was higher than the course [of the stars] that circles the whole earth.”


    [He continued], “The water gathered [above] is beyond the stars. [Beyond] the water is a great inferno surrounding them like a wall. When several beings within had separated from the rest, periods of time [began to be calculated].


    “When the [whole structure] had been established, he looked [down]. The Father said to it, ‘Go! [Bring forth something] from yourself so that [the earth] might lack nothing from generation to [generation] and from age to age.’


    “So [it] brought forth fountains of milk, honey, oil, and wine, along with good fruit, delightful flavors, and nourishing roots, so that the earth might lack nothing from generation to generation and from age to age.


    “It is above […]. […] stood there [and displayed] its beauty […]. Outside [was a great light], brighter [than] the light resembling it, because that light rules over [all] the aeons above and below. [Light] was drawn from the fire and scattered across the [vault of heaven] above and below. Those over heaven above and earth below hang from [them]. Everything hangs from them.”


    When Judas heard this, he fell to his knees, bowed down, and praised the Lord.'
