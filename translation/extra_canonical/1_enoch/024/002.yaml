translation:
  text: 'I went toward it and saw seven magnificent mountains, each different from the others, with precious, beautiful stones. Their appearance was altogether splendid and glorious, and their faces were beautiful: three toward the east, firmly set one upon another, and three toward the south, one upon another. There were deep, winding valleys that did not come close to one another.'
