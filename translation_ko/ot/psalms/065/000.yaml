  rationale: 히브리어는 두 장르 표지를 함께 제시하므로, 한국어에서도 둘을 모두 보이되 문장부호로 연결해 원문의 집약된 표제성을 유지하는 것이 적절합니다.
  doctrine_reference: 시편 표제의 장르·귀속 표시는 본문 해석을 안내하지만 교리 항목은 아닙니다.
