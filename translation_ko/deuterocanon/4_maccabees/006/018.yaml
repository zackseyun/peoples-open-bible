  text: For it would indeed be irrational, if, after living our whole life up to old age in truth and lawfully preserving the reputation founded on it, we should now change course,
translation:
  language: ko
  text: 이는 참으로 이치에 맞지 않기 때문입니다. 우리가 노년에 이를 때까지 평생 진리에 따라 살아가고, 그에 바탕을 둔 명성을 법에 맞게 지켜 왔으면서, 이제 와서 태도를 바꾼다면,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλογιστον
  english_pob_choice: irrational
  chosen_korean: 이치에 맞지 않습니다
  alternatives_korean:
  - 비합리적입니다
  - 말이 되지 않습니다
  lexicon: ἄλογιστος
  rationale: 논리적·도덕적 판단이 어긋난다는 뜻을 살려, 현대적 문어체에서 자연스럽고 강한 부정으로 옮겼습니다.
- source_word: τὸν μέχρι γήρως βίον
  english_pob_choice: our whole life up to old age
  chosen_korean: 늙음에 이를 때까지
  alternatives_korean:
  - 늙을 때까지의 삶
  - 노년까지의 생애
  lexicon: βίος
  rationale: βίος의 생애 전체를 가리키는 점을 반영하고, μέχρι γήρως의 기간성을 간결하게 살렸습니다.
- source_word: πρὸς ἀλήθειαν
  english_pob_choice: in truth
  chosen_korean: 진리 안에서
  alternatives_korean:
  - 진리 가운데
  - 참되게
  lexicon: ἀλήθεια
  rationale: 단순한 사실성보다 삶의 방향과 영역을 뜻하는 문맥을 살려 ‘안에서’로 옮겼습니다.
- source_word: τὴν ἐπ’ αὐτῶν δόξαν νομίμως φυλάσσοντες
  english_pob_choice: lawfully preserving the reputation founded on it
  chosen_korean: 그 위에 세워진 평판을 합당하게 지켜 왔는데
  alternatives_korean:
  - 그것에 근거한 명성을 법대로 지켜 왔는데
  - 그 위에 기반한 평판을 정당하게 보존해 왔는데
  lexicon: δόξα, νομίμως φυλάσσω
  rationale: δόξα를 ‘평판’으로 두어 사회적 명예의 뜻을 살리고, νομίμως는 법률적 허용보다 ‘합당하게’로 옮겨 문맥의 도덕적 정당성을 드러냈습니다.
- source_word: μεταβαλοίμεθα
  english_pob_choice: change course
  chosen_korean: 돌이키려 한다면
  alternatives_korean:
  - 태도를 바꾸려 한다면
  - 변절하려 한다면
  lexicon: μεταβάλλω
  rationale: 단순한 방향 전환보다 이전 삶을 저버리는 의미를 드러내되, 과도한 해석어는 피했습니다.
theological_decisions:
- issue: 진리(ἀλήθεια)의 범위와 생활 양식
  chosen_reading: ‘진리 안에서’는 단순한 사실 진술이 아니라, 공동체 앞에서 일관되게 살아온 삶의 원리로 읽었습니다.
  alternative_readings:
  - ‘참되게’로 중립적으로 옮길 수 있음
  - ‘진리에 따라’로 규범성을 더 강하게 살릴 수 있음
  rationale: 문맥상 순교적 결단을 앞두고 일생의 일관성을 변호하는 문장이므로, 진리를 삶의 영역으로 드러내는 번역이 더 적절합니다.
  doctrine_reference: 윤리적 진리와 인내의 일관성
- issue: ‘법적으로’인지 ‘합당하게’인지
  chosen_reading: νομίμως는 단순한 법률 준수보다 ‘정당성/합당함’의 뉘앙스를 살려 번역했습니다.
  alternative_readings:
  - ‘법대로 지켜 왔는데’
  - ‘율법에 따라 지켜 왔는데’
  rationale: 여기서의 νομίμως는 형식적 법조문보다 그들의 삶이 정당하게 인정받는 상태를 가리키는 문맥으로 보입니다.
  doctrine_reference: 헬라어 부사 νομίμως의 문맥적 의미
