  rationale: DOCTRINE.md directs that Χριστός be translated as 'Messiah' where it functions as a title. In this greeting formula the titular sense remains clear, so 'Messiah' is preferred while the traditional 'Christ' is preserved in a footnote.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names; Contested terms table for Χριστός'
- issue: Gendered language in ἀδελφοῖς
  chosen_reading: brothers
