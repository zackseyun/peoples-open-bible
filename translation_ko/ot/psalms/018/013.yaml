  lexicon: HALOT
  rationale: מִן의 출발점 의미를 살리되, נֹגַהּ는 문맥상 단순한 '빛'보다 '광채/밝음'으로 이해할 수 있어 한국어에서는 자연스럽게 '빛으로부터'로 옮겼습니다.
