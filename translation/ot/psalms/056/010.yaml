id: PSA.56.10
reference: Psalms 56:10
source:
  edition: WLC
  text: בֵּֽ֭/אלֹהִים אֲהַלֵּ֣ל דָּבָ֑ר בַּ֝/יהוָ֗ה אֲהַלֵּ֥ל דָּבָֽר׃
translation:
  text: I praise God's word; I praise Yahweh's word[a].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Or “promise” in both clauses.
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאלֹהִים
  chosen: In God
  alternatives:
  - By God
  - Through God
  lexicon: HALOT
  rationale: 'The preposition ב with אֱלֹהִים is most naturally rendered locatively/in relation: ''in God.'' This matches the parallel structure with ''in the LORD'' and preserves the psalmic idiom of boasting/praising in relation to God rather than making God the direct object alone.'
- source_word: אֲהַלֵּל
  chosen: I praise
  alternatives:
  - I praise
  - let me praise
  lexicon: HALOT
  rationale: The imperfect can express the psalmist's present, characteristic declaration of praise.
- source_word: דָּבָר
  chosen: word
  alternatives:
  - word
  - promise
  - matter
  lexicon: HALOT
  rationale: “Word” retains the repeated noun and its breadth; “promise” remains a footnoted contextual alternative.
- source_word: בַּיהוָה
  chosen: in Yahweh
  alternatives:
  - in Yahweh
  - by the LORD
  lexicon: HALOT
  rationale: The source contains the Tetragrammaton YHWH. Per project doctrine, it is rendered 'Yahweh,' preserving the personal divine name rather than substituting the title 'the LORD.'
- source_word: בֵּאלֹהִים אֲהַלֵּל דָּבָר / בַּיהוָה אֲהַלֵּל דָּבָר
  chosen: In God, whose word I praise; in Yahweh, whose word I praise
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: This represents the elliptical poetic syntax naturally in English and makes explicit the referent supplied by the context.
