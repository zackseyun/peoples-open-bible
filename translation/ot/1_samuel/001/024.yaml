id: 1SA.1.24
reference: 1 Samuel 1:24
source:
  edition: WLC
  text: וַ/תַּעֲלֵ֨/הוּ עִמָּ֜/הּ כַּ/אֲשֶׁ֣ר גְּמָלַ֗תּ/וּ בְּ/פָרִ֤ים שְׁלֹשָׁה֙ וְ/אֵיפָ֨ה אַחַ֥ת קֶ֨מַח֙ וְ/נֵ֣בֶל יַ֔יִן וַ/תְּבִאֵ֥/הוּ בֵית יְהוָ֖ה שִׁל֑וֹ וְ/הַ/נַּ֖עַר נָֽעַר־׃
translation:
  text: When she had weaned him, she took him up with her, with three bulls[a], one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The Masoretic text reads 'three bulls.' The Septuagint reads 'a three-year-old bull,' supported by the surviving age-related word in the published Hebrew transcription of 4QSam-a (4Q51); part of the surrounding animal phrase is supplied. These witnesses also include bread. Which textual form is earlier remains under review.
    reason: textual_variant
  - marker: b
    text: Hebrew literally, 'and the boy was a boy,' rendered here as a comment on his youth. The selected Septuagint text instead has 'and the boy was with them' and continues with a longer sacrifice scene in verses 24–25. The damaged Hebrew scroll 4QSam-a (4Q51) also preserves parts of a longer account, but much of its wording must be supplied. Whether the shorter account lost material or the longer account expanded it remains unresolved.
    reason: textual_variant
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ
  chosen: she took him up
  alternatives:
  - she brought him up
  - she took him
  lexicon: HALOT
  rationale: The verb עלה literally means 'go up/bring up.' In this pilgrimage context, 'took him up' preserves the directional nuance toward the sanctuary while remaining natural English. 'Brought him up' is possible, but the later וַתְּבִאֵהוּ is better reserved for 'brought him,' so varying the English helps reflect the two Hebrew verbs.
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  chosen: When she had weaned him
  alternatives:
  - after she had weaned him
  lexicon: HALOT
  rationale: גמל in this context refers to weaning a child, not merely completing or repaying. 'When she had weaned him' is idiomatic and fits the temporal clause introduced by כַּאֲשֶׁר.
- source_word: עִמָּהּ
  chosen: with her
  lexicon: HALOT
  rationale: Straightforward accompaniment marker; retained explicitly because it is present in the Hebrew and clarifies that Samuel went with Hannah.
- source_word: בְּפָרִים שְׁלֹשָׁה
  chosen: with three bulls
  alternatives:
  - with three bulls
  - with a three-year-old bull
  lexicon: HALOT
  rationale: The declared WLC source reads 'three bulls.' The versioned 4Q51 transcription preserves בקר משלש ולחם, with the preceding בפר בן supplied; the Greek control reads 'a three-year-old bull' and includes bread. This is direct published Hebrew support for the age-related alternative, not merely a Greek interpretation. The singular bull in verse 25 is relevant but does not by itself prove historical priority. The previous assertion that the alternative likely arose by harmonization was not established. Retain the current source-aligned wording pending source selection and disclose the alternative.
- source_word: וְאֵיפָה אַחַת קֶמַח
  chosen: one ephah of flour
  alternatives:
  - an ephah of meal
  lexicon: HALOT
  rationale: אֵיפָה is a dry measure best transliterated as 'ephah' rather than converted approximately, preserving the ancient unit. קֶמַח is 'flour'; 'meal' is possible but less precise in contemporary English.
- source_word: וְנֵבֶל יַיִן
  chosen: and a skin of wine
  alternatives:
  - and a jar of wine
  - and a wineskin of wine
  lexicon: HALOT
  rationale: נֵבֶל here denotes a container, commonly understood as a skin-bottle or wineskin. 'A skin of wine' is concise and natural. 'Jar' is possible in some contexts, but the skin-container sense is widely recognized.
- source_word: וַתְּבִאֵהוּ
  chosen: and brought him
  alternatives:
  - and she brought him
  lexicon: HALOT
  rationale: בוא in the hiphil means 'bring.' This is the main arrival verb, so 'brought him' is the clearest rendering and complements the earlier 'took him up.'
- source_word: בֵית יְהוָה
  chosen: the house of Yahweh
  alternatives:
  - Yahweh's house
  lexicon: HALOT
  rationale: The sanctuary phrase is rendered 'the house of Yahweh,' matching the current English and the project's divine-name policy. This corrects stale lexical metadata; it does not change the source or main text.
- source_word: יְהוָה
  chosen: Yahweh
  alternatives:
  - Jehovah
  lexicon: HALOT
  rationale: Per doctrine, the Tetragrammaton יְהוָה is rendered 'Yahweh' — the transliteration of the divine name — rather than the traditional 'the LORD' substitution. This preserves the personal name God revealed to Israel rather than substituting a title.
- source_word: שִׁלֹה
  chosen: at Shiloh
  alternatives:
  - to Shiloh
  lexicon: HALOT
  rationale: Shiloh is transliterated as a place name. English idiom prefers 'at Shiloh' with 'the house of Yahweh,' though the destination sense is still clear.
- source_word: וְהַנַּעַר נָעַר
  chosen: Now the boy was young
  alternatives:
  - and the boy was a boy
  - and the child was young
  lexicon: HALOT
  rationale: The retained WLC expression literally repeats 'boy' and is rendered here as a comment on his youth; emphasis or vividness is not established by the repetition alone. The selected Greek text instead has the boy with them and continues with a longer sacrifice scene. Published 4Q51 preserves parts of a longer account, with substantial supplied wording. Retaining the shorter source and this English rendering does not settle historical priority. This qualification does not claim fresh consultation of HALOT.
