    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  english_pob_choice: back
  chosen_korean: 다시 ... 돌아가셨습니다
  alternatives_korean:
  - 다시
  - 또
  lexicon: BDAG
  rationale: 여행 구문에서 πάλιν은 단순한 반복('또')보다 '돌아옴'의 의미가 더 자연스럽습니다. 한국어에서는 '다시'를 '돌아가다'와 결합해 '다시 ... 돌아가셨습니다'로 표현하여 복귀의 의미를 분명히 했습니다.
- source_word: Ἰουδαίαν
