review_pass:
  verdict: revise
  source_fidelity: πετροβόλου는 단순히 ‘돌같이’라는 성질보다 ‘돌을 던지는/퍼붓는’ 작용의 이미지를 지닙니다. 초안의 ‘돌같이 거센 분노’는 이 핵심 이미지를 약화합니다. 또한 ὕδωρ θαλάσσης는 ‘바닷물’도 가능하나 ‘바다의 물’이 원문의 명사구를 더 투명하게 드러냅니다.
  naturalness: 합쇼체의 문장 흐름은 대체로 자연스럽습니다. 다만 ‘던져질 것이며’와 ‘덮칠 것입니다’의 연결을 유지하면서, ‘돌을 퍼붓는 분노’로 옮기면 의인화된 심판 이미지가 더 자연스럽고 선명해집니다.
  terminology: θυμός는 이 심판 맥락에서 ‘분노/진노’로 옮길 수 있으며, 여기서는 현대 한국어의 자연스러움과 격조를 고려해 ‘분노’를 유지했습니다. συγκλύζω의 압도적으로 휩쓰는 뜻은 ‘휩쓸 것입니다’가 ‘덮칠 것입니다’보다 더 직접적으로 반영합니다.
  issues:
  - severity: medium
    issue: πετροβόλου θυμοῦ를 ‘돌같이 거센 분노’로 번역함
    rationale: πετροβόλος는 ‘돌을 던지는, 돌을 퍼붓는’이라는 동작적 복합어입니다. ‘돌같이’는 돌의 단단함 또는 거침으로 의미를 바꾸므로, 원문의 투석/돌 퍼붓기 이미지를 살려야 합니다.
  - severity: low
    issue: συγκλύσουσιν을 ‘덮칠 것입니다’로 번역함
    rationale: ‘덮치다’도 문맥상 가능하지만, συγκλύζω는 물이 몰려와 압도적으로 휩쓰는 의미가 두드러집니다. ‘휩쓸 것입니다’가 더 정확합니다.
  revised_text: 또 돌을 퍼붓는 분노로 가득 찬 우박들이 내던져질 것이며, 바다의 물은 그들에게 맞서 격분하고, 강물들은 갑자기 그들을 휩쓸 것입니다.
