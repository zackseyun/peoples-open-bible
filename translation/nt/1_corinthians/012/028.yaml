  category: meaning_retranslation
  from: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
  to: And God has appointed in the church first apostles, second prophets, third teachers, then workers of miracles, then those with gifts of healing, those who help others, those who provide leadership, and those who speak in various kinds of tongues[a].
  rationale: The lexical record supplies the meanings of assistance, guidance, and varied tongues, but its preference for mirroring noun forms leaves the English list uneven. I make the appointed people explicit while retaining the recorded ordering and refusing to define a hierarchy or settle the nature of tongues.
