id: PSA.89.43
reference: Psalms 89:43
source:
  edition: WLC
  text: אַף תָּ֭שִׁיב צ֣וּר חַרְבּ֑/וֹ וְ/לֹ֥א הֲ֝קֵימֹת֗/וֹ בַּ/מִּלְחָמָֽה־׃
translation:
  text: You have even turned back his sword[a]; you have not upheld him in battle.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “turned back the edge of his sword.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  chosen: even
  alternatives:
  - Also
  - Even
  - Surely
  lexicon: HALOT
  rationale: Marks emphatic addition in the lament sequence.
- source_word: תָּשִׁיב
  chosen: have turned back
  alternatives:
  - you cause to turn back
  - you turn away
  - you blunt
  lexicon: HALOT
  rationale: Matches the completed-action sequence and preserves the verbal image.
- source_word: צוּר
  chosen: the edge
  alternatives:
  - rock
  - strength
  - sharpness
  lexicon: HALOT
  rationale: Although צור often means 'rock,' in construct with 'his sword' it denotes the edge/sharpness of the sword. 'The edge' is the clearest idiomatic English rendering in this context.
- source_word: חַרְבּוֹ
  chosen: of his sword
  alternatives:
  - his sword
  lexicon: HALOT
  rationale: 'Rendered with the construct relationship explicit in English: ''the edge of his sword.'''
- source_word: הֲקֵימֹתוֹ
  chosen: have not enabled him to stand
  alternatives:
  - you have not sustained him
  - you have not raised him up
  - you have not established him
  lexicon: HALOT
  rationale: Natural causative English that retains the standing image.
- source_word: בַּמִּלְחָמָה
  chosen: in battle
  alternatives:
  - in the battle
  - in war
  lexicon: HALOT
  rationale: The prefixed article is often not carried into idiomatic English in such expressions. 'In battle' is natural and sufficiently definite from context.
