id: JOB.4.21
reference: Job 4:21
source:
  edition: WLC
  text: הֲ/לֹא נִסַּ֣ע יִתְרָ֣/ם בָּ֑/ם יָ֝מ֗וּתוּ וְ/לֹ֣א בְ/חָכְמָֽה־׃
translation:
  text: Is not their tent-cord pulled loose[a]? They die without wisdom[b].
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “their cord is pulled up in them”; the image probably evokes a tent losing the cord that holds it up.
    reason: lexical_alternative
  - marker: b
    text: Or, “without having gained wisdom.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  chosen: Is not
  alternatives:
  - Surely
  - Is it not
  lexicon: HALOT
  rationale: Introduces a rhetorical question expecting agreement. 'Is not' preserves the interrogative force more transparently than the more interpretive 'surely'.
- source_word: נִסַּע
  chosen: pulled up
  alternatives:
  - torn away
  - removed
  - plucked up
  lexicon: HALOT
  rationale: From נסע in the passive/reflexive sense of being pulled up or removed, often used of tent pegs or encampments. 'Pulled up' fits the tent imagery and avoids overcommitting to violent nuance like 'torn away'.
- source_word: יִתְרָם
  chosen: their tent-cord
  alternatives:
  - their cord
  - their abundance
  - their excellency
  lexicon: HALOT
  rationale: יתר can denote a cord, especially a tent-cord, and this fits the surrounding imagery of fragile human life in a tent-like dwelling (cf. previous verse). Traditional renderings like 'their excellency' likely reflect a different semantic choice, but the concrete image is better supported here.
- source_word: בם
  chosen: within them
  alternatives:
  - from them
  - in them
  lexicon: HALOT
  rationale: 'The preposition ב with pronominal suffix is rendered ''within them'' to preserve the internal, embodied sense: the life-cord is removed from within them. This is somewhat idiomatic in English while staying close to the Hebrew.'
- source_word: ימותו
  chosen: They die
  alternatives:
  - they perish
  lexicon: HALOT
  rationale: מות is the ordinary verb 'to die.' 'They die' is direct and avoids adding interpretive weight.
- source_word: ולא בחכמה
  chosen: without wisdom
  alternatives:
  - without wisdom
  - but not wisely
  lexicon: HALOT
  rationale: Natural English for the negative prepositional phrase; the footnote preserves the principal contextual alternatives.
