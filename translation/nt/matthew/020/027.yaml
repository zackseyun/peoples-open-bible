  from: And whoever wants to be first among you will be your servant[a].
  to: And whoever wants to be first among you must be your servant[a].
  rationale: While 'ἔσται' is a future indicative, it functions here as an imperatival future. In English, 'will be' often reads as a simple prediction rather than a command or requirement. Rendering it as 'must be' (or 'shall be') accurately conveys the prescriptive force intended in the Greek.
