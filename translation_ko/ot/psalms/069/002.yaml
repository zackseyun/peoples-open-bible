source:
  edition: WLC
  text: טָבַ֤עְתִּי בִּ/יוֵ֣ן מְ֭צוּלָה וְ/אֵ֣ין מָעֳמָ֑ד בָּ֥אתִי בְ/מַעֲמַקֵּי מַ֝֗יִם וְ/שִׁבֹּ֥לֶת שְׁטָפָֽתְ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/002.yaml
  text: I have sunk in deep mire, and there is no foothold; I have come into deep waters, and the current[a] has swept over me.
  footnotes:
  - marker: a
    text: Or “the torrent.”
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 깊은 진창에 빠져들었으나 발 디딜 곳이 없습니다. 깊은 물속에 들어왔고, 급류가 저를 휩쓸었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  english_pob_choice: Save me
  chosen_korean: 저를 구원해 주십시오
  alternatives_korean:
  - 저를 구해 주십시오
  - 저를 살려 주십시오
  lexicon: HALOT
  rationale: 히필 명령형의 간절한 구원을 드러내되, 시편 기도의 호소를 자연스럽고 격식 있게 살리기 위해 ‘구원해 주십시오’를 택했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: O God
  chosen_korean: 하나님
  alternatives_korean:
  - 오 하나님
  - 하나님이시여
  lexicon: HALOT
  rationale: 직접 호칭이므로 문장 첫머리에서 호격을 자연스럽게 드러내되, 한국어 합쇼체 기도문에서는 ‘오’보다 간결한 ‘하나님’이 더 유려합니다.
- source_word: בָאוּ מַ֣יִם עַד נָֽפֶשׁ
  english_pob_choice: the waters have come up to my neck
  chosen_korean: 물들이 제 목까지 올라왔습니다
  alternatives_korean:
  - 물들이 제 목에 이르렀습니다
  - 물들이 제 영혼까지 왔습니다
  - 물들이 제 목구멍까지 올라왔습니다
  lexicon: HALOT
  rationale: 문맥상 익사 직전의 신체적 이미지가 핵심이므로 נֶפֶשׁ의 구체적 감각을 한국어로 ‘목’으로 옮겼습니다. ‘올라왔습니다’는 물이 위로 차오르는 동작을 살립니다.
- source_word: נָפֶשׁ
  english_pob_choice: Literally, 'to my soul'; Hebrew nephesh can mean 'soul,' 'life,' 'self,' or, in contexts like this, the throat/neck.
  chosen_korean: 목
  alternatives_korean:
  - 영혼
  - 생명
  - 목구멍
  lexicon: HALOT
  rationale: 이 절은 영혼론 진술이 아니라 압도적 위험을 그리는 시적 비유이므로, 영어 POB의 해설을 따라 문자적 신체 의미를 본문에 반영했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역 범위와 시적 이미지 보존
  chosen_reading: 본문에는 ‘목’을 두고, נֶפֶשׁ의 더 넓은 의미는 해설로 보존합니다.
  alternative_readings:
  - ‘영혼’으로 옮기는 더 문자적인 번역
  - ‘생명’으로 옮기는 추상적 번역
  rationale: 시편 69:2는 구원의 교리를 논하는 문장이 아니라 물에 잠기는 절박한 상황을 묘사합니다. 따라서 독자가 즉시 이해할 수 있는 신체 이미지가 우선이며, 원어의 의미 범위는 주석으로 남기는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3, §6
