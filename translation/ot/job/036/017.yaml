  meaning_decisions:
  - source_phrase: וְדִין רָשָׁע מָלֵאתָ
    prior_rendering: But you are full of the judgment of the wicked
    new_rendering: But you are suffering the full judgment due to the wicked
    rationale: The contrast with the offered abundance and the following warnings favors judgment experienced by Job; the rendering makes that relationship intelligible while preserving fullness and noting the alternative of preoccupation with a legal case.
  - source_phrase: דִּין וּמִשְׁפָּט יִתְמֹכוּ
    prior_rendering: judgment and justice take hold
    new_rendering: judgment and justice take hold of you
    rationale: Job is the contextually understood object on the punitive reading, and supplying him completes the English image; the possible supportive reading remains explicit in the note.
