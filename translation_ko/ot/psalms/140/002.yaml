  lexicon: HALOT
  rationale: נצר의 ‘지키다/보호하다/보존하다’ 가운데, 앞의 ‘건져 주십시오’와 병행되면서도 지속적 보호의 뜻을 자연스럽게 전달하는 표현을 택했습니다.
theological_decisions:
- issue: 악인과 폭력적 인간에 대한 병행 구조
  chosen_reading: 두 호칭을 각각 독립된 위협으로 구분해 번역했습니다.
  alternative_readings:
  - 두 표현을 하나의 포괄적 악인으로 합칠 수 있음
