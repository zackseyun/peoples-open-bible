id: GEN.31.8
reference: Genesis 31:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם כֹּ֣ה יֹאמַ֗ר נְקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן נְקֻדִּ֑ים וְ/אִם כֹּ֣ה יֹאמַ֗ר עֲקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן עֲקֻדִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: ko
  text: 그가 ‘점박이 것들이 네 삯이 될 것이다’라고 말할 때마다, 양 떼 모두가 점박이 새끼를 낳곤 했습니다. 또 그가 ‘줄무늬 있는 것들이 네 삯이 될 것이다’라고 말할 때마다, 양 떼 모두가 줄무늬 있는 새끼를 낳곤 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים / עֲקֻדִּים
  english_pob_choice: speckled / streaked
  chosen_korean: 점박이 / 줄무늬 있는
  alternatives_korean:
  - 얼룩진 / 얼룩무늬의
  - 반점 있는 / 띠무늬 있는
  lexicon: adjective coloring of livestock markings
  rationale: 가축의 털무늬를 가리키는 구체적 표지를 살리기 위해 ‘점박이’와 ‘줄무늬 있는’으로 옮겼습니다. ‘얼룩진’은 더 넓고 추상적이며, ‘점박이/줄무늬’가 본문의 대조를 더 직접적으로 드러냅니다.
- source_word: שְׂכָרֶךָ
  english_pob_choice: your wages
  chosen_korean: 네 삯
  alternatives_korean:
  - 네 품삯
  - 네 보수
  lexicon: payment/reward for labor
  rationale: 본문의 거래적·노동 보상 의미를 반영하여 ‘삯’으로 옮겼습니다. ‘보수’보다 고대 가족 노동 관계의 보상 뉘앙스가 더 가깝습니다.
- source_word: יָלְדוּ כָל הַצֹּאן
  english_pob_choice: all the flock bore
  chosen_korean: 모든 양 떼가 … 새끼를 낳았습니다
  alternatives_korean:
  - 모든 양 떼가 …를 낳았습니다
  - 모든 떼가 …를 낳았습니다
  lexicon: biological birth idiom for livestock
  rationale: 동물의 출산을 직접 드러내는 동사 ‘낳다’를 유지해 히브리어의 생물학적 진술을 살렸습니다. ‘떼’만 쓰면 출산 행위가 약해집니다.
- source_word: וְאִם כֹּה יֹאמַר / כֹּה יֹאמַר
  english_pob_choice: If he said this / and if he said this
  chosen_korean: 그가 이렇게 말하면 / 또 그가 이렇게 말하면
  alternatives_korean:
  - 그가 말하기를 이러면
  - 그가 이렇게 말할 때
  lexicon: repeated conditional formula
  rationale: 영어 POB의 수정처럼 반복되는 조건부 서술을 그대로 반영하여 ‘그가 이렇게 말하면’을 되풀이했습니다. 첫 절의 ‘또’는 두 번째 조건의 병렬성을 자연스럽게 연결합니다.
theological_decisions:
- issue: 반복되는 조건절의 서술 방식
  chosen_reading: 두 개의 조건절을 병렬로 유지하고, 결과절을 각각 대응시키는 단순 서술로 처리했습니다.
  alternative_readings:
  - 한 문장으로 압축하여 뜻을 요약하는 방식
  - 조건절을 생략하고 결과만 서술하는 방식
  rationale: 본문은 야곱의 가축 번식에 대한 관찰을 두 번의 가정-결과 구조로 제시하므로, 반복을 줄이지 않고 그대로 보여 주는 편이 원문의 설득력을 보존합니다.
  doctrine_reference: 창세기 31장의 서사 문맥 보존
