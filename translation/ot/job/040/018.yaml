id: JOB.40.18
reference: Job 40:18
source:
  edition: WLC
  text: עֲ֭צָמָי/ו אֲפִיקֵ֣י נְחוּשָׁ֑ה גְּ֝רָמָ֗י/ו כִּ/מְטִ֥יל בַּרְזֶֽל׃
translation:
  text: His bones are pipes of bronze[a]; his bones are like bars of iron.
  philosophy: dynamic
  footnotes:
  - marker: a
    text: Literally, “channels of bronze.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָמָיו
  chosen: his bones
  alternatives:
  - his frame
  lexicon: HALOT
  rationale: The noun עֶצֶם commonly means 'bone(s).' 'His bones' is the plain anatomical sense and fits the parallelism with גְּרָמָיו.
- source_word: אֲפִיקֵי
  chosen: channels of
  alternatives:
  - channels of
  - pipes of
  - bars of
  lexicon: HALOT
  rationale: Keeps the concrete conduit/channel image without specifying hollow tubes.
- source_word: נְחוּשָׁה
  chosen: bronze
  alternatives:
  - copper
  lexicon: HALOT
  rationale: נְחוּשָׁה often refers to bronze/copper. In biblical poetic comparisons of strength, 'bronze' is the more idiomatic and likely alloy sense in English.
- source_word: גְּרָמָיו
  chosen: his bones
  alternatives:
  - his bones
  - his frame
  lexicon: HALOT
  rationale: Reflects the noun’s anatomical sense and preserves parallelism with עֲצָמָיו.
- source_word: כִּמְטִיל
  chosen: like bars of
  alternatives:
  - like rods of
  - like castings of
  lexicon: HALOT
  rationale: The comparison is to something cast or formed from metal; in context of bodily strength, 'bars of' communicates rigid, weighty solidity in natural English better than the more technical 'castings of.'
- source_word: בַּרְזֶל
  chosen: iron
  lexicon: HALOT
  rationale: Standard rendering of בַּרְזֶל; the metal imagery pairs naturally with 'bronze' in the previous colon.
