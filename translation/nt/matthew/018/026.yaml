  from: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
  to: So the servant fell down and prostrated himself before him[a], saying, ‘Be patient with me, and I will repay you everything.’
  rationale: 'The verb προσκυνέω (BDAG: "do obeisance to, prostrate oneself before, do reverence to") denotes a physical act of submission or reverence, not the verbal act of pleading. Translating it as "kept pleading" is a mistranslation that loses the lexical meaning of the word. The combination of the participle πεσὼν and the finite verb προσεκύνει emphasizes the slave''s posture of total submission. If the main text is corrected to "prostrated himself" or "bowed down," the first clause of this footnote becomes redundant and should be removed.'
