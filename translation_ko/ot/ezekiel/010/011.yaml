id: EZK.10.11
reference: Ezekiel 10:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/לֶכְתָּ֗/ם אֶל אַרְבַּ֤עַת רִבְעֵי/הֶם֙ יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּ֑/ם כִּ֣י הַ/מָּק֞וֹם אֲשֶׁר יִפְנֶ֤ה הָ/רֹאשׁ֙ אַחֲרָ֣י/ו יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/011.yaml
  text: When they went, they would go in any of their four directions; they did not turn as they went, for to the place where the head faced, they followed after it; they did not turn as they went.
translation:
  language: ko
  text: 그들이 갈 때에는 자기들의 네 방면 가운데 어느 쪽으로든지 갔으며, 가면서 방향을 바꾸지 않았습니다. 머리가 향하는 곳이면 어디든지 그들은 그곳으로 갔으며, 가면서 방향을 바꾸지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּלֶכְתָּם / יֵלֵכוּ
  english_pob_choice: When they went / they would go
  chosen_korean: 그들이 갈 때에는 … 갔고
  alternatives_korean:
  - 그들이 갈 때에는 … 다녔고
  - 그들이 움직일 때에는 … 갔고
  lexicon: הלך
  rationale: 반복되는 동작을 한국어에서 자연스럽게 살리되, 원문의 서술적 반복을 유지하기 위해 ‘갔고’를 사용했습니다.
- source_word: אֶל אַרְבַּעַת רִבְעֵיהֶם
  english_pob_choice: in any of their four directions
  chosen_korean: 자기들의 네 방향 중 어느 쪽으로든지
  alternatives_korean:
  - 자기들의 네 방향으로
  - 네 갈래 방향 중 어느 쪽으로든지
  lexicon: ארבעה / רבע
  rationale: 문맥상 ‘네 방향’이라는 기본 의미를 분명히 하면서, POB의 ‘in any of their four directions’가 주는 분산적 뉘앙스를 ‘어느 쪽으로든지’로 반영했습니다.
- source_word: לֹא יִסַּבּוּ
  english_pob_choice: they did not turn as they went
  chosen_korean: 가면서 돌이키지 않았습니다
  alternatives_korean:
  - 가면서 방향을 바꾸지 않았습니다
  - 돌아서지 않았습니다
  lexicon: סבב
  rationale: 단순한 회전 동작을 가리키므로 ‘돌이키다’가 문맥상 자연스럽고, 반복되는 금지를 그대로 살리기 위해 두 번 모두 유지했습니다.
- source_word: הָרֹאשׁ
  english_pob_choice: the head
  chosen_korean: 머리
  alternatives_korean:
  - 머리 부분
  - 우두머리
  lexicon: ראש
  rationale: 환상 속 존재의 방향성을 가리키는 말로서 문자적 ‘머리’를 유지했습니다. 지도자 의미의 ‘우두머리’는 문맥에 맞지 않습니다.
theological_decisions:
- issue: 환상적 생물의 이동 방향과 인격적 주체성
  chosen_reading: ‘머리가 향하는 곳으로 그들도 그 뒤를 따라갔고’로, 방향성을 가진 유기적 움직임을 드러냈습니다.
  alternative_readings:
  - ‘머리가 향하는 곳으로 그들도 갔고’
  - ‘머리가 향하는 곳을 따라 그들도 움직였습니다’
  rationale: 원문은 기계적 이동이 아니라 머리의 방향에 종속된 생물적/환상적 운동을 강조하므로, ‘그 뒤를 따라갔다’로 그 종속성과 연속성을 살렸습니다.
  doctrine_reference: 에스겔 10장의 환상 묘사
- issue: 반복 강조의 보존
  chosen_reading: 마지막 절을 포함해 ‘가면서 돌이키지 않았습니다’를 두 번 반복했습니다.
  alternative_readings:
  - 중복을 하나로 줄여 매끄럽게 처리
  rationale: 히브리어의 반복은 강조 기능이 크므로, 한국어도 의도적 반복을 유지해 원문의 힘을 보존했습니다.
  doctrine_reference: 히브리 시문/예언문 반복 강조
