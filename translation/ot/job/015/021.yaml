id: JOB.15.21
reference: Job 15:21
source:
  edition: WLC
  text: קוֹל פְּחָדִ֥ים בְּ/אָזְנָ֑י/ו בַּ֝/שָּׁל֗וֹם שׁוֹדֵ֥ד יְבוֹאֶֽ/נּוּ־׃
translation:
  text: He hears terrifying sounds; even when all is well, a destroyer comes upon him.
  philosophy: dynamic
lexical_decisions:
- source_word: קוֹל
  chosen: A sound
  alternatives:
  - The sound
  - A voice
  lexicon: HALOT
  rationale: קוֹל commonly denotes 'sound' or 'voice.' Here the construct with פְּחָדִים points to an auditory phenomenon rather than articulated speech, so 'sound' is preferred. The indefinite English article reflects the lack of a Hebrew article.
- source_word: פְּחָדִים
  chosen: terrors
  alternatives:
  - fears
  - dreadful things
  lexicon: HALOT
  rationale: The plural conveys multiple terrors or terrifying alarms, not merely an internal emotion of fear. 'Terrors' preserves the force and vividness of the plural better than 'fears'.
- source_word: בְּאָזְנָיו
  chosen: is in his ears
  alternatives:
  - is in his hearing
  - rings in his ears
  lexicon: HALOT
  rationale: Literally 'in his ears.' 'Is in his ears' keeps the concrete Hebrew image while remaining natural English. More idiomatic expansions like 'rings in his ears' add nuance not explicit in the text.
- source_word: בַּשָּׁלוֹם
  chosen: when he is at peace
  alternatives:
  - in peace
  - when all is well
  - in safety
  lexicon: HALOT
  rationale: Preserves the broad state of peace/well-being, with security noted as an alternative.
- source_word: שׁוֹדֵד
  chosen: a destroyer
  alternatives:
  - the plunderer
  - the marauder
  - the ravager
  lexicon: HALOT
  rationale: The root denotes destructive action; noun, participle, and verbal contexts require destroyer, devastate, or a contextually specified destructive act.
- source_word: יְבוֹאֶנּוּ
  chosen: comes upon him
  alternatives:
  - comes against him
  - comes to him
  - will come upon him
  lexicon: HALOT
  rationale: The verb is 'comes' with a 3ms object suffix, literally 'comes him.' In English this is best expressed as 'comes upon him' or 'comes against him.' 'Comes upon him' conveys hostile arrival without overinterpreting. Present tense is retained to match the Hebrew poetic style, though a future nuance is possible in context.
- source_word: קוֹל פְּחָדִים בְּאָזְנָיו
  chosen: Terrifying sounds are in his ears
  alternatives: []
  lexicon: HALOT/BDB source audit
  rationale: Natural English retains the auditory image without adding “fill.”
