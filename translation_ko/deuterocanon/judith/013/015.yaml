  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:57:48Z'
review_pass:
  verdict: revise
  source_fidelity: ‘오로페르네스’는 Ὀλοφέρνης의 통용 표기 및 한국어 성서식 음역과 맞지 않아 ‘홀로페르네스’로 고쳐야 합니다. 또한 κωνώπιον은 침상과 관련된 덮개/차양을 가리키며, 관계절은 직역하면 그가 그 안에 누워 있었다는 뜻입니다. ‘그 아래’라는 영어 감사본의 해석을 그대로 따르기보다 원문의 공간 표현을 보존했습니다.
  naturalness: 합쇼체의 서술 흐름을 위해 ‘보여 주며’ 대신 사건을 순차적으로 잇는 ‘보여 주고’로 다듬었습니다. ‘술에 취해’를 ‘술에 취한 채’로 하여 상태 표현을 자연스럽게 했습니다.
  terminology: ‘아수르’, ‘최고 사령관’, ‘주’, ‘한 여자의 손으로’는 원문의 명칭·직책·신적 주어·도구격을 무리 없이 반영합니다. ‘차양’은 κωνώπιον의 기능을 단정적으로 ‘모기장’으로 좁히지 않는 표현입니다.
