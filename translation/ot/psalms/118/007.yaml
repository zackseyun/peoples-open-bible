  from: Yahweh is among my helpers[a][b]; I myself will look on my haters.
  to: Yahweh is for me among my helpers; I myself will look on those who hate me.[a]
  rationale: The current first clause fails to represent לִי (“for me”), while “among my helpers” preserves the plural participial phrase. “Those who hate me” is idiomatic English for the participle with first-person suffix; “my haters” is unnecessarily marked. The proposed note should not supply an unstated outcome as though it were the wording of an alternative translation; it should instead identify the unexpressed object of the seeing.
