  text: 주께서 높은 곳으로 오르시고 포로 무리를 사로잡아 끌고 가시며, 사람들 가운데서, 곧 반역하는 자들 가운데서도 선물들을 받으셨으니,[a] 야 하나님께서 거기에 거하시도록 하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
