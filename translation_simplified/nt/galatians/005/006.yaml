  reasoning_layer_used: Lexical decisions for περιτομή, ἀκροβυστία, and τι ἰσχύει
  rationale: The concrete condition is easier to understand than the paired abstract nouns.
- pob_phrase: but faith working through love
  simplified_phrase: What matters is faith working through love
