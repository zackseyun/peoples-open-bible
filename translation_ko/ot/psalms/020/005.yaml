translation:
  language: ko
  text: 우리는 당신의 구원[a]으로 기뻐 외치며, 우리 하나님의 이름으로 깃발을 높이 들겠습니다[b]. 야훼께서 당신이 구한 모든 것을 이루어 주시기를 바랍니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 승리’ 또는 ‘당신의 구출’. 히브리어는 넓은 의미의 구원뿐 아니라 구출이나 군사적 승리를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 깃발을 세우겠습니다’. 히브리어 동사는 승리를 기념하여 깃발을 들어 올리거나 내거는 모습을 암시하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘야훼께서 당신이 구한 모든 것을 이루어 주실 것입니다’. 히브리어 미완료형은 기원이나 기도로도, 미래 진술로도 읽힐 수 있으나, 여기서는 기원의 뜻이 문맥에 잘 맞습니다.
    reason: alternative_reading
