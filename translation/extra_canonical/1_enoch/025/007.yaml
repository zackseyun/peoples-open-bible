translation:
  text: Then I blessed the God of glory, the eternal King, because he had prepared such things for righteous people,
    had created them in this way, and said that he would give them to them.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The printed word order around people, such things, and righteous is unusual; this English construes righteous
      with people. Charles 1906 printed p64 note19 discusses that order. “Said that he would give” follows the explicit
      speech verb rather than introducing a separate promise formula.
