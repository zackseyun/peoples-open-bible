    mitigation: The main text follows POB’s descriptive wording, while footnote b preserves the temporal alternative.
  - risk: “Stand in God’s way” is less formally literal than “hinder God.”
    mitigation: The idiom clearly retains Peter’s rhetorical claim that opposition would resist God.
