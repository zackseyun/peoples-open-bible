translation:
  language: en
  text: Yet you judged them little by little, giving them room to reorient toward you[r1]. You knew that their origin[a] was evil, that their wickedness was inborn, and that their way of thinking would remain unchanged forever.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “birth” or “lineage.”
    reason: lexical_alternative
  - marker: r1
    text: Traditionally "repent" or "repentance." Reorientation means a change of disposition and direction, not merely feeling sorry. The direction toward God is explicit in Acts 20:21 and is made explicit from the context here; it is not a separate meaning-component of the Greek word. No added degree of completeness is intended.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: not being unaware
  simplified_phrase: You knew
  preserved_meaning: God acted with full awareness of their condition.
  reasoning_layer_used: POB lexical decision for οὐκ ἀγνοῶν
  rationale: The direct positive statement removes an awkward double negative without changing its force.
- pob_phrase: their wickedness innate, and that their way of thinking would never change forever
  simplified_phrase: their wickedness was inborn, and that their way of thinking would remain unchanged forever
  preserved_meaning: Their evil was deeply inherent, and their mindset was enduringly fixed.
  reasoning_layer_used: POB lexical and theological decisions for ἔμφυτος, λογισμός, and εἰς τὸν αἰῶνα
  rationale: Common wording preserves the verse’s severity without adding a theory of inherited guilt or metaphysical inability.
translation_notes:
  risk_flags:
  - risk: “Inborn” may be read as a later doctrine of inherited guilt.
    mitigation: The wording states the verse’s severity but does not define guilt, causation, or metaphysical inability.
  - risk: “Origin” can refer to birth or lineage rather than only beginnings in general.
    mitigation: A footnote preserves the documented lexical alternatives.
  - risk: Reorient is less common English and explicit Godward wording is a contextual expansion.
    mitigation: Explain it in the reader note; preserve source-specific exceptions and avoid added intensifiers.
