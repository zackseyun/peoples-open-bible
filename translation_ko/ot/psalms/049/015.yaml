source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִפְדֶּ֣ה נַ֭פְשִׁ/י מִֽ/יַּד שְׁא֑וֹל כִּ֖י יִקָּחֵ֣/נִי סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/015.yaml
  text: But God will redeem my life from the hand of Sheol[a], for he will take me[b]. Selah
  footnotes:
  - marker: a
    text: Sheol is the Hebrew term for the realm of the dead; alternatively, 'the grave' or 'the realm of the dead.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for he will receive me.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 하나님께서 스올[a]의 손에서 내 생명을 속량하실 것입니다. 그분께서 나를 데려가실[b] 것이기 때문입니다. 셀라
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스올’은 죽은 자들의 영역을 가리키는 히브리어입니다. ‘무덤’ 또는 ‘죽은 자들의 영역’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분께서 나를 받아 주실 것이기 때문입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: כַּצֹּאן
  english_pob_choice: Like sheep
  chosen_korean: 양처럼
  alternatives_korean:
  - 한 떼의 양처럼
  - 목양하는 양처럼
  lexicon: HALOT
  rationale: ‘צֹאן’의 집합적 비유를 자연스럽게 살리면서, 무력하게 끌려가는 이미지를 유지하기 위해 ‘양처럼’으로 옮겼습니다.
