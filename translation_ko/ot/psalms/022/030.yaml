revisions:
- from: 이 땅의 모든 부유한 자들은 먹고 절하며, 그 앞에서 티끌로 내려가는 모든 자도 무릎을 꿇을 것입니다 — 곧 자기 생명을 지키지 못한 그 사람도 그러할 것입니다.[a][b][c]
  to: 후손이 그를 섬길 것이며, 주님에 관한 일이 다음 세대에 전해질 것입니다.
  rationale: 원문 절을 정확히 반영하도록 앞 절에서 잘못 유입된 본문과 각주를 전부 교체했습니다. זֶרַע의 집합적 의미는 ‘후손’으로, 수동형 יְסֻפַּר의 비인칭적·전승적 표현은 ‘주님에 관한 일이 … 전해질 것입니다’로 옮겼습니다. 원문의 간결함과 ‘주님’에 대한 전승이라는 표현의 범위를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:06:32Z'
