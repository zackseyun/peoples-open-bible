  from: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[b][c], I seek.
  to: My heart says to you[a], “Seek my face.” Your face[c], Yahweh, I seek[b].
  rationale: “On your behalf” imports an agency or representative relation not marked by לְךָ. The proposal's “To you my heart says” is source-near but unnecessarily unnatural English. Reordering it as “My heart says to you” retains the direct dative construal and the difficult, unresolved quotation while avoiding gloss-English. The note candidly preserves alternative construals.
