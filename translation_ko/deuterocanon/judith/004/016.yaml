  text: And there was ashes on their turbans, and they were crying out to the Lord with all their strength, that he might look with favor on the whole house of Israel.
translation:
  language: ko
  text: 그들의 두건 위에는 재가 있었고, 그들은 온 힘을 다해 주님께 부르짖으며 이스라엘 온 집을 좋게 살펴 주시기를 구했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σποδὸς
  english_pob_choice: ashes
  chosen_korean: 재
  alternatives_korean:
  - 재들
  - 잿가루
  lexicon: σποδός
  rationale: 머리에 뿌린 애도의 표지를 자연스럽게 옮기되, 단수·복수의 영어 선택과 무관하게 한국어에서는 집합명사로 ‘재’가 가장 간결하고 원문에 가깝습니다.
- source_word: κιδάρεις
  english_pob_choice: turbans
  chosen_korean: 두건
  alternatives_korean:
  - 터번
  - 머리두건
  lexicon: κίδαρις
  rationale: 유대 제의·사회적 머리쓰개를 한국어에서 과도하게 현대화하지 않으면서도 이해 가능한 표현으로 옮겼습니다.
- source_word: πρὸς Κύριον
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주께
  - 주께로
  lexicon: κύριος
  rationale: 이 문맥의 κύριος는 하나님을 가리키므로, 한국어 경어형 ‘주님께’로 기도/호소의 방향성을 분명히 했습니다.
- source_word: εἰς ἀγαθὸν ἐπισκέψασθαι
  english_pob_choice: look with favor
  chosen_korean: 선하게 살펴보아 주시기를
  alternatives_korean:
  - 좋게 보아 주시기를
  - 호의를 베풀어 주시기를
  lexicon: ἐπισκέπτομαι
  rationale: ἐπισκέψασθαι는 단순한 ‘보다’보다 돌봄과 개입의 의미가 있어, ‘살펴보아 주시다’로 옮기고 ἀγαθόν의 긍정적 방향을 ‘선하게’로 반영했습니다.
theological_decisions:
- issue: 공동체 탄원의 어조
  chosen_reading: 이스라엘 온 집을 위한 공동체적 간구로 읽고, 한국어도 복수 주어 ‘그들’과 청원형을 유지했습니다.
  alternative_readings:
  - 개별 애도자의 단독 탄원으로 축소하는 읽기
  - 더 서술적인 평서문으로 완화하는 읽기
  rationale: 본문은 애도의 표지와 함께 집단적으로 주께 부르짖는 장면이므로, 공동체적 절박함이 드러나도록 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 공동체 기도와 중보의 성격
- issue: ἐπισκέψασθαι의 신학적 뉘앙스
  chosen_reading: 하나님의 자비로운 돌봄과 개입을 ‘선하게 살펴보아 주시다’로 표현했습니다.
  alternative_readings:
  - 단순 관찰로 축소
  - 응징/심판의 중립적 방문으로 처리
  rationale: 문맥상 요청은 구원적 호의와 돌봄을 구하는 것이므로, ‘살펴보아 주시다’에 선한 방향을 명시해 원문의 탄원 의도를 보존했습니다.
  doctrine_reference: 하나님의 긍휼과 섭리
