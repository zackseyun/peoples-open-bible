lexical_decisions:
- source_word: ὁ Ἐλεάζαρος
  chosen: Eleazar
  lexicon: LSJ
  rationale: Proper name transliterated according to project policy to transliterate names rather than translate them.
- source_word: ὥσπερ
  chosen: as though
  alternatives:
  - as if
  - just as
  lexicon: LSJ
  rationale: Here it introduces a comparison of manner or effect rather than a simple equation; 'as though' captures the rhetorical force naturally in English.
- source_word: πικρότερον
  lemma: πικρός
  chosen: more bitterly
  alternatives:
  - more harshly
  - more grievously
  lexicon: LSJ
  rationale: Comparative adverb from πικρός retains the metaphor of bitterness. 'More bitterly' preserves the vividness of the Greek better than flattening to 'more harshly'.
- source_word: διὰ τῆς συμβουλίας
  chosen: by the counsel
  alternatives:
  - by the advice
  - because of the counsel
  lexicon: LSJ
  rationale: διά with the genitive can denote means or agency. In context the speech/advice directed at Eleazar is what intensifies the torment, so 'by the counsel' preserves that instrumental nuance while remaining readable.
- source_word: αἰκισθείς
  chosen: having been tortured
  alternatives:
  - having been maltreated
  - having been tormented
  lexicon: LSJ
  rationale: Aorist passive participle of αἰκίζω denotes abuse or torture. Given the martyrdom context, 'having been tortured' best conveys the severity.
- source_word: ἀνεβόησεν
  chosen: cried out
  alternatives:
  - shouted
  - called out
  lexicon: LSJ
  rationale: The verb indicates a loud exclamation. 'Cried out' is idiomatic, forceful, and fits the solemn narrative tone.
