  to: “You must no longer give the people straw for making bricks as you did before. They must go and gather their own straw.
  rationale: The earlier translation already interprets the reference to previous days correctly as “as before,” and I retain that idiomatic meaning. Its lexical discussion also recognizes a command requiring the workers to gather straw themselves, which the revised English states more clearly.
