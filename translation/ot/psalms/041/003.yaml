  source_review: WLC Hebrew, chapter context, documented POB reasoning, and public-domain comparison diagnostics
  category: mistranslation
  tier: 1
  from: Yahweh will sustain him on his sickbed[a]; in his illness you restore his whole bed.
  to: Yahweh will sustain him on his sickbed; in his illness you turn his whole bed over[a].
  rationale: “Restore” replaces the Hebrew’s concrete turning image with an inferred result. The precise force of the idiom remains uncertain, so retaining “turn ... over” in the text and explaining the likely caregiving or restorative sense in a note better preserves the source’s image and ambiguity.
