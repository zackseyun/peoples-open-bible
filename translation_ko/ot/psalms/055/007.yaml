theological_decisions:
- issue: 시편 화자의 소망 진술을 어떻게 표기할지
  chosen_reading: 직접적인 불평이나 단순 미래가 아니라, 극심한 압박 속에서 벗어나고자 하는 소망의 표현으로 읽어 한국어에서 청유적 완곡 표현을 사용했습니다.
  alternative_readings:
  - 나는 날아가서 살겠습니다
  - 나는 날아가서 쉬겠습니다
  rationale: מִי יִתֶּן לִּי는 히브리어 관용적으로 ‘그렇게 되면 좋겠다’는 소망을 나타내므로, 문법 형식보다 정서적 기능을 살리는 것이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 시편의 탄식/간구 장르
- issue: וְאֶשְׁכֹּנָה의 종결 의미
  chosen_reading: ‘머물겠습니다’로 번역해 단순한 비행 욕구가 아니라 피난처를 찾아 안착하려는 뜻을 드러냈습니다.
  alternative_readings:
  - 쉬겠습니다
  - 거주하겠습니다
  rationale: 문맥상 분주한 도주보다 안정된 거처에 들어가는 이미지를 전달하는 것이 자연스럽고, 영어 POB의 ‘dwell’도 이 방향을 지지합니다.
  doctrine_reference: 시편 55편의 탄식적 정서
