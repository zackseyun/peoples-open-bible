    unchanged: false
    changes_summary: Capitalized the opening for formal English and changed 'pronouncement' to 'judgment' to better reflect γνώμην while keeping the syntax and sense of the Greek.
translation:
  language: en
  text: 'The Master of all things also spoke about repentance[a] and swore an oath: “As surely as I live,” says the Lord, “I do not desire the sinner’s death, but rather that he repent.” He then added this good judgment:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Repentance and related expressions are read in this works own context; they are not restricted to feeling sorry, and no uniform Godward formula is imposed. Use repentance in the appeal to leave sin or faction, preserving separate return verbs and the writers own exhortation.
    reason: lexical_alternative
simplification_decisions:
- pob_phrase: For as I live
  simplified_phrase: As surely as I live
  preserved_meaning: The Lord swears by his own life.
  reasoning_layer_used: source text and immediate quotation
  rationale: The common English oath formula preserves the solemn expression.
translation_notes:
  risk_flags:
  - risk: “Good judgment” may suggest a judicial verdict rather than a spoken declaration.
    mitigation: It is retained because the latest POB revision deliberately chose “judgment” for γνώμη in this context.
