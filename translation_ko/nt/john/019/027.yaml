id: JHN.19.27
reference: John 19:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: ko
  text: 그가 제자에게 말씀하셨습니다. “보십시오, 네 어머니입니다.” 그리고 그때부터 그 제자는 그녀를 자기 집으로 맞아들였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  - 보십시오
  lexicon: ἴδε
  rationale: 영어 POB가 ‘Look’로 되돌린 지시 표현을 따라, 직역적 명령형이면서도 현대 한국어 합쇼체에 맞는 ‘보십시오’로 옮겼습니다.
- source_word: ἡ μήτηρ σου
  english_pob_choice: your mother
  chosen_korean: 네 어머니입니다
  alternatives_korean:
  - 너의 어머니입니다
  - 당신의 어머니입니다
  - 네 엄마입니다
  lexicon: μήτηρ
  rationale: μήτηρ의 기본적·정중한 대응으로 ‘어머니’를 택했고, 제자에게 직접 말하는 장면이므로 2인칭 소유를 자연스럽게 드러냈습니다.
- source_word: εἰς τὰ ἴδια
  english_pob_choice: into his own home
  chosen_korean: 자기 집으로 맞아들였습니다
  alternatives_korean:
  - 자기 집으로 데려갔습니다
  - 자기 집으로 받아들였습니다
  - 자기 소유로 들어갔습니다
  lexicon: τὰ ἴδια
  rationale: τὰ ἴδια는 단순한 ‘자기 것들’보다 거처를 포함한 자기 영역을 뜻할 수 있어, POB의 ‘his own home’을 자연스럽게 풀어 ‘자기 집으로 맞아들였습니다’로 옮겼습니다.
theological_decisions:
- issue: 예수의 발화 방식
  chosen_reading: 서술문은 예수의 말씀을 ‘말씀하셨습니다’로 처리하고, 인용문 안에서는 제자에게 직접 지시하는 짧은 명령형을 살렸습니다.
  alternative_readings:
  - ‘말했습니다’로 평탄화
  - 인용문을 완곡하게 바꾸기
  rationale: 십자가 위 장면의 긴박성과 직접성을 보존하려면, 화자의 권위와 제자에 대한 즉각적 지시가 드러나야 합니다.
  doctrine_reference: 복음서 서술의 직접화법 보존
