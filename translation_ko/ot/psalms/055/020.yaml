  to: 그는 자기와 평화롭게 지내던 이들을 향해 손을 뻗어, 자기의 언약을 더럽혔습니다.[a][b]
  rationale: 제시된 원문은 ‘그가 자기와 평화 관계에 있던 이들을 향해 손을 뻗었다; 그가 자기의 언약을 더럽혔다’입니다. 따라서 잘못 이식된 앞 절 전체와 그 각주를 제거하고, 손을 뻗는 적대적 행동, 평화 관계의 배신, 언약의 훼손을 번역했습니다. 히브리어의 단수 ‘손’과 3인칭 남성 단수 소유 표현도 유지했습니다.
